- pgno: 68
  md: '# Chapter 5: Nping


    Because NAT is so popular (your connection is likely to be NATed), there''s a
    good chance that you would see CAPT entries under the SENT lines and before the
    next RCVD line if you query that machine. This command works for me:


    ```

    # nping --echo-client echo.nmap. --tcp

    ```


    If you look carefully at the captured packet source (CAPT), you should be able
    to tell if NAT has altered your source address. such as 10.0.10.10, as per RFC
    1918 (https://tools.ietf.org/html/rfc1918), being changed to a publicly routed
    IP address such as 123.123.123.123 if NAT has been involved. It''s relatively
    easy to detect NAT getting in the way of your connection. Remember that there
    is NAT, there are sometimes other devices altering MTUs (Maximum Transmission
    Units), packet-mangling for traffic shaping, unexpected firewalls, and invisible
    switches that might cause subtle changes to your connection.


    There are a number of other scenarios within which Nping can assist, (after some
    learning) being able to spot if transparent proxies might be employed on route.
    I will leave you to advance your skills further, but in the meantime, the following
    section describes a few other options that you might find useful.


    # Other Nping Options


    Using the --delay 10 option, you can limit the frequency of your packets. The
    default is to usually send pings at one second apart, but increasing this value
    can reduce the noise on your screen if you''re watching diligently for a particular
    event.


    Along the same lines is the --rate 3 option, which you can flood a target machine
    by sending three packets per second in the example just given. Don''t get tripped
    up with settings for the rate and delay options, however. According to the documentation:


    [his] rate and --delay are inverse; --rate 20 is the same as --delay 0.05. If
    other addresses are used, only the one in the parameter list counts.


    You can utilize the -H or --hide-sent option where outbound packets aren''t shown.
    For example, if you''re flooding a connection, then this will help.


    In addition, if you''re flooding a network and testing how it responds to a significant
    load, then you probably don''t want to process each packet that is received. The
    -N or --no-cap-ture option doesn''t capture any packets that are received.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Chapter 5: Nping


    Many other command line options are available for Nping. For example, you can
    add --debug to assist you with more detail. You can also alter TTLs (Time To Live
    settings). If you''re scanning many hosts, you might also want to add a timeout
    option so that you''re asking Nping to wait around for a response --host-timeout
    10, where the 10 is a measure in seconds.


    I briefly mentioned spoofing IP addresses in order to forge the IP address; Nping
    can go one step further and empower the sender field with random values, by using
    a command like this whiteheat.chrisbinnie.tld:


    ```

    # nping --arp --sender-ip random --ttl random whiteheat.chrisbinnie.tld

    ```


    Alarm bells ring when you first read about this. Being able to spoof an IP address
    with random values (successfully) should cause any sysadmin to be concerned. It
    takes poorly configured upstream routers to allow this type of traffic to arrive
    on an organization''s network.


    Finally, if you want to adjust the channel which is used for Echo mode, then --channel-tcp
    or --channel-udp will do that:


    ```

    # ping --vvv --client --channel --tcp 1234 --tcp -p 8100 localhost

    ```


    As you might imagine, having the ability to adjust Echo mode to send its "channel"
    data back to the client via both TCP and UDP might be a lifesaver if strict firewall
    gets in the way.


    # Summary


    If you experiment with Nping over time, you should appreciate that the report-ing
    offers is truly extensive. I''d encourage you to reach for Nmap whenever you have
    the opportunity, to gain more exposure.


    With its packet-crafting possibilities, the powerful Nping can outdo many of its
    rivals. The addition of the spoofing Echo mode means if you have access to both
    ends of a connection, there''s less chance of a device escaping detection. As
    a result, troubleshooting should be much swifter and less difficult.


    Nmap''s powerful Nping might be considered as just one tool inside a white hat''s
    toolkit. By using tools such as these legally, you will excel at your intended
    tasks, and as a welcome afterthought, you''ll learn how to keep your own servers
    up and running.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# # Logging Reconnoiters


    At times, you need to pay extra attention to what is connecting to your servers.
    For example, a series of attacks may have recently taken place, which you want
    to keep a close eye on, or you might just be serve paranoid in general, Akin to
    the sensitivity of your data or the critical nature of your service.


    One relatively unsophisticated approach to monitoring those machines that are
    making reconnaissance of your servers would be to log the IP addresses that run
    pings and traceroutes against them. You may think that the information you manage
    to gle isn''t going to be of much use, but it actually be really important in
    building a picture of who connects to your servers, often and when. Akin to studying
    Closed Circuit Television (CCTV) video footage of people visiting an office, after
    a while, you get to know who stands out as unusual or who might not be expected
    on a given day. Log files are fantastic because you forget them only to return
    for analysis months later.


    If you need to keep a vigilant eye on your servers, for whatever reason, then
    the trick to monitoring your system properly depends, on two things. First, you
    need a reliable daemon running in the background, listening a sentry; it should
    be reliable so it doesn''t introduce a race condition and cause your server to
    fail. Second, you need minimal logging so that you can check back to your log
    file in a year''s time and find the necessary information without worrying that
    the logs will overflow disk space and cause you problems. Clearly you also don''t
    want an attack to fill your disks with attack logs. That is unless of course you
    want to provide a high-capacity storage system and additionally there are fan
    of verbose logging.


    In this chapter, you will explore how to log any reconnaissance of your machines
    and how to counter Internet Control Message Protocol (ICMP) issues. You will also
    learn how some attackers in the past took advantage of the good-natured protocol
    that is ICMP, and gaign an overview of what common attacks looked like before
    ICMP gained a reputation for being insecure.


    # ## ICMP Misceptions


    The traffic generated by pings and traceroutes uses the well-maligned ICMP, with
    UDP to a lesser extent for DNS lookups if needed.


    However, it''s worth mentioning that ICMP was created for very good reasons and
    is still used for very important tasks in the day-to-day operation of the Internet.
    For example, it''s needed to tell the devices to set their Maximum Transmission
    Unit (MTU) in order to allow packets to traverse smoothly heterogeneous network
    links. As a result, after reading what you should avoid one of the most common
    synonym mistakes: blocking all ICMP traffic to your servers.


    *Linux Security: Hack and Defend. Chris Binnie*


    © 2016 by John Wiley & Sons, Inc. Published by John Wiley & Sons, Inc.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Chapter 6: Logging Reconnoiters


    # tcpdump


    Let''s have a cursory look at your options for monitoring pings and traceroutes
    around the clock. The sysadmin''s tool kit of reliable utilities, you might consider
    the powerful packet-sniffing tool, tcpdump. This tool has long been trusted to
    split traffic into smaller pieces in order to offer an insight into what is travelling
    across a network.


    For example, if you want to pick up pings, the following command works when I
    ping my paranoid server from another machine:


    ```

    # /usr/sbin/tcpdump -i eth0 icmp and icmp[type]=icmpecho

    ```


    This next example, showing tcpdump''s ICMP packet-sniffing abilities, also picks
    up tracerouters:


    ```

    # /usr/sbin/tcpdump ip proto \icmp

    ```


    As you can see in the following code, pings rely on both replies and requests;
    however, because my paranoid server''s firewall is blocking ICMP traffic, an admin
    error is logged when tracerouters after.


