- pgno: 43
  md: '# Chapter 3: Twenty-First-Century Netcat


    # Chatting Example


    Let''s have some fun chatting with a user on another computer. You may have seen
    the wall minecraft in the past, which broadcasts to all logged-in users. You can
    use netcat for two-way chatting. Pick a port on the recipient machine (Luis again)
    and politely ask netcat to listen, as:


    ```

    Luis> # ncat -l 1234

    ```


    Next, run the following command. Having run that command, anything you type on
    Lionel (hitting the Enter key afterwards to send each line of chat content) will
    be mirrored on Lionel''s console, and vice versa.


    ```

    Lionel> # ncat Luis 1234

    ```


    In the following snippet, you can see how a conversation looks from Lionel''s
    perspective.


    ```

    # ncat 127.0.0.1 1234

    Want to have my two rules for success?

    Ok:

    Rule #1: Never tell everything that you know.

    Ok, and...

    Hello, are you there?

    ```


    This example shows one of many unexpected features that are included with netcat.
    I''ll leave functionality for you to explore and continue to examine some of the
    other options that are available. Netcat almost suffers from an embarrassment
    of riches in relation to its feature set, and there are simply far too many to
    cover here.


    # Chaining Commands Together


    One of the nice features included with ncat (but not nc) is the ability to chain
    multiple instances into a single command. This makes netcat versatile; you can
    pipe the output of one netcat command into another, Unix style. Let''s look at
    an example from the netcat documentation. For the following, I''ll introduce the
    command "Neymar" as your third host. Luis is your sender, and in this scenario
    Luis is the man in the middle. Take a moment to look at these commands:


    ```

    Neymar> # ncat -l 1234 > my_big_file.txt

    Luis> # ncat -l 1234 | ncat Luis 1234

    Lionel> # ncat --send-only Luis 1234 < length_file.txt

    ```


    As you can see, in reverse, Luis is passing his length onto Luis before he then
    chains the two netcats together in order to forward the file onto Neymar. This
    triumph works well, especially if Luis can''t talk directly to Neymar because
    of a firewall or routing.'
