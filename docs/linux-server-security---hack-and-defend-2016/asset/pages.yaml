    # Timing Templates


    In Listings 7.1 and 7.2, you asked for information about ports in the 0-to-1024
    range (the privileged, or superuser ports on Unix-type systems) using the -p0-1024
    option. The -T4 option isn''t actually a timeout value of four seconds but instead
    offers a way of pulling up a specific timing template by NSE. The higher the setting,
    the faster Nmap runs, and the values that are available range from 0 to 5.


    The timing templates are important and can make a difference to your emotional
    well-being. These values, from 0 to 5, stand for paranoid, sneaky, polite, normal,
    aggressive and insane. The words can also be used in place of the numbers if you
    find them to remember.


    Because many templates are bundled with NSE, the main programmer realized that
    users might get lost in their complexity, and so introduced templates that might
    be helpful.


    The main reason that the templates are so important to using Nmap is when you
    run NSE against a lot of hosts, or a large network, or the process can take a
    very long time to complete. You may also discover very little information (because
    of well-configured firewalls), and your task can still take what it seems to forever.


    What''s the difference in the templates, may you ask? The paranoid and sneaky
    templates offer some degree of avoiding detection by an intrusion detection system
    (IDS). The polite slows down the scanning process to limit the bandwidth at both
    ends of the connection and the target machine''s resources. The -T3 switch does
    nothing whatever''s; the normal template is the default and is switched on. The
    aggressive template, which you used in the earlier example, will speed up the
    scanning process and test a relatively high-capacity network''s limits more rigorously.
    The last template, insane, assumes that you are happy to trade off some accuracy
    in the results that NSE provides against the time to execute. You should have
    a high-capacity and reliable network if you want to use this setting.


    73'
