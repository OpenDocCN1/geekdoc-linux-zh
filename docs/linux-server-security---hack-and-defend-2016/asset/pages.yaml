- pgno: 105
  md: '# Chapter 8: Malware Detection


    If any of your scans take longer than expected, then LMD can accommodate this
    scenario too. The kill switch or -k option (also written as --kill) will stop
    any notify instance in its tracks. If machine load is too high or you think something
    is not behaving as it should, then this is a useful addition to the Available
    options.


    # Cron Job


    LMD comes with a daily cron job, which is located at /etc/cron.daily/maldet. This
    will update signatures and clean up scan data so that it''s kept for fourteen
    days, or as a daily scan using the config you have specified.


    Note that session data and temporary files are kept between cron jobs. As a result,
    you need to run the -p option that I mentioned earlier to purge those files if
    your results aren''t accurate.


    You should use the e-mail configuration parameters in order to receive daily reports
    every morning. The daily update is valuable for e-mail archival reasons and for
    making sure that your scans are taking place every day and haven''t failed.


    # Reporting Malware


    You''ve seen how sophisticated and well constructed LMD is, and it should therefore
    come as no surprise that LMD provides a simple mechanism for uploading suspicious
    files for analysis. If they prove to be of an unknown variety of malware, then
    new signatures may be created and added to LMD''s known threats in order to identify
    malware for other users. The method to send files back to LMD for checking is
    by using the --checkout feature, which is also written as the -c option.


    ```

    # maldet -c suspicious_file.gz

    ```


    When you execute this command, the file will be submitted to rfxn.com and checked
    in due course.


    # Apache Integration


    Earlier in the chapter, I briefly alluded to a clever feature that is included
    with LMD. This feature is the ability to integrate LMD with the Apache mod_security2
    module. The LMD documentation explains that it uses the malleable Apache module''s
    inspectFile functionality to enable you to run a validation script that can determine
    if an upload is to pass or fail. So, for example, inside your Apache config file,
    you might see this entry, taken from the documentation:


    ```

    SecRequestBodyAccess On

    SecRule FILES_TMPNAMES "@inspectFile /usr/local/maldetect/hookscan.sh"

    none"

    "id:999999, log,auditlog, severity:2,phase:2,t:

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'By design, each upload of a file by a user can be scanned automatically, which
    should significantly reduce the number of threats on a system, especially where
    many users are uploading files frequently.


    The documentation includes details of how performance and accuracy have been in
    the default options. If you''re interested in this feature, then I would encourage
    you to check out the bundled README file for more information.


    # Summary


    In addition to looking at LMD, I touched upon the innotify mechanism that it uses
    to check for filesystem changes in real time. The clever and efficient notify
    allows real-time checks for malware without significant system load being introduced.


    With Android smartphones currently accounting for over 80 percent of the global
    market, there is little doubt that the malware written to exploit vulnerabilities
    in those devices will appear to a greater extent on Linux user devices as well
    as servers in the future.


    By enabling real-time filesystem checks alongside sophisticated tools such as
    LMD, you should reduce your risk of a malware infection significantly. LMD was
    initially designed for servers offering shared hosting because the author felt
    the user-account attack vector was being missed by other products, which usually
    focused on kernel and rootkit infections.


    Having tried installing LMD in a test environment first, however, and having become
    familiar with how it operates, I believe LMD is definitely worth considering for
    use on your production machines.'
