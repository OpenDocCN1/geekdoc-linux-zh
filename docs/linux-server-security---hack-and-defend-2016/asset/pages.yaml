    # Summary


    In this chapter, we looked at a number of security issues that affect critical
    infrastructure services. These services, mostly affected using the more vulnerable
    UDP, genuinely help protect the Internet and clearly need to be protected. Some
    of these attacks are of an older design, but it is interesting to note how categories
    of attacks surge and diminish over different periods of time. For example, an
    attack that has not been seen for many years resurface in a slightly more evolved
    state. As we saw recently, the SNMP tools made available by the hacking community,
    most likely encouraged by the success of the NTP reflection attacks, have generated
    the most interest.


    Even if it''s not possible to follow the detailed intricacies of more sophisticated
    attacks, the premise is simple. Services relying on UDP are currently at most
    risk. UDP does not always expect a response (TCP enjoys a three-way handshake)
