- pgno: 44
  md: '# Chapter 3: Twenty-First-Century Netcat


    However, the documentation point out a problem with this scenario. The issue is
    that Neymar can''t talk back to Lionel. As you''d expect from the powerful netcat,
    there''s a work-around. When I look at this example, I immediately think of exploits
    deployed for nefarious around. (I you''ll see why in a moment). Now look at the
    following set of commands:


    ```

    Neymar # ncat -l 1234 > newlog.log

    Luis # ncat -l 1234 --sh-exec ncat Neymar 1234

    Lionel # ncat --send-exec Luis 1234 < logfile.log

    ```


    To my mind, the scary option in this example is a new shell command when Luis
    receives data. Imagine the damage that you can cause with such an option, being
    able to launch any command. In this example, Luis receives a connection, he spawns
    a new netcat instance and handles both the inputs and outputs of Lionel and Neymar''s
    communications. It''s very sophisticated.


    Here is a port-forwarding example from the documentation, dealing with HTTP again,
    where you execute a shell command to forward traffic:


    ```

    # ncat -l localhost 80 --sh-exec "ncat www.chrisbinnie.tld 8100"

    ```


    You simply forward data destined for TCP port 800 on your local machine to anchor
    another host on TCP port 6100.


    # Secure Communications


    I mentioned SSL earlier and how netcat can interact with encrypted traffic, though
    it''s a worrying possibility to consider. I''ll start this section with an example
    of how netcat can encrypt its own traffic. You use the -C switch (sometimes called
    connect mode):


    ```

    # ncat -C --ssl ssl.chrisbinnie.tld 443

    ```


    Here you''re assuming that your trusted machine, ssl.chrisbinnie.tld is running
    an SSL server on TCP port 443 and you can connect to it. Surprisingly, for SSL
    servers that use certificates for authentication, the mighty netcat can be very
    useful.


    You simply point netcat at location of your PEM certificate and private key files,
    using the --ssl-cert and --ssl-key options respectively within the command. You
    can point both options at the same file if you like.


    One important factor when exchanging certificates, along with encrypting communications,
    is the act of confirming (via a third-party service''s stamp of approval) the
    SSL server''s identity is valid. Netcat is able to serve such a request by using
    this command:


    ```

    # ncat -C --ssl-verify ssl.chrisbinnie.tld 443

    ```'
