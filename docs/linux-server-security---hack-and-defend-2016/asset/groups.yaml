    # Chapter 6: Logging Reconnoiters


    # tcpdump


    Let''s have a cursory look at your options for monitoring pings and traceroutes
    around the clock. The sysadmin''s tool kit of reliable utilities, you might consider
    the powerful packet-sniffing tool, tcpdump. This tool has long been trusted to
    split traffic into smaller pieces in order to offer an insight into what is travelling
    across a network.


    For example, if you want to pick up pings, the following command works when I
    ping my paranoid server from another machine:


    ```

    # /usr/sbin/tcpdump -i eth0 icmp and icmp[type]=icmpecho

    ```


    This next example, showing tcpdump''s ICMP packet-sniffing abilities, also picks
    up tracerouters:


    ```

    # /usr/sbin/tcpdump ip proto \icmp

    ```


    As you can see in the following code, pings rely on both replies and requests;
    however, because my paranoid server''s firewall is blocking ICMP traffic, an admin
