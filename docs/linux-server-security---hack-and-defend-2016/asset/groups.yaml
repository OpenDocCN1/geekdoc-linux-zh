    # Chapter 1: Invisibility Cloak


    # Confusing a Port Scanner


    Now that you know how ports may present themselves to port scanners, let''s look
    at how to obfuscate the response you give back in order to confuse sophisticated
    port scanning techniques. The most obvious tool of choice, thanks to its powerful
    feature set, would be the kernel-based firewall Netfilter, more commonly known
    as iptables.


    Here''s how it works. For TCP packets, you want to manipulate how you respond
    to port probes using iptables to generate a REJECT request. For other protocols
    you want to drop the packets. This way, when you get closed, not filtered, responses
    from Nmap. Based on what I''ve gathered from most online opinions (and seems this
    argument is contentious and changeable), a closed port is the best response that
    you can hope for. This is because you''re not admitting to blocking any ports
    with a firewall, nor is the port simply open because a daemon is running behind.


    To explain a little further, under normal circumstances, an unreachable port would
    usually generate an ICMP Port Unreachable response. You don''t want these errors
    to be generated, because that would mean a server is listening on that port in
    the first place and you would give your server''s response away. The tweaked REJECT
    response that you want to generate is applied as follows:-reject-with tcp-reset.
    This helps you to respond if the port were unused and closed, and not filtered.


    You simply add this snippet to the end of each of your iptables rules:


    ```

    -j REJECT-reject-with tcp-reset

    ```


    By using this technique, you''re making sure you''re not giving away unnecessary
    information about your system.


    Note that in the port knocking example that you''re about to look at, you won''t
    be using iptables option. This is because you''re not running additional services
    to your SSH server. However, this background information will help you understand
    how an attacker might approach a machine''s ports and how you can apply-reject-with
    tcp-reset option to other services.


    There is some debate about using iptables DROP versus REJECT responses in your
    rules. If you''re interested, you''ll find some insightful information on the
    subject at


    www.chiark.greenend.org.uk/~peterb/network/drop-vs-reject.


