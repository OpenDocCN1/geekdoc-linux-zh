    client elements of this test. It''s not the best way of failing traffic through
    a firewall or a NAT gateway, it should offer you enough information to understand
    how the process works.


    You will also need to be the superuser to run this command. You will add the appropriate
    password and make sure you connect to your localhost. Clearly replace the IP of
    the remote machine you connect to, as:


    ```

    # nping -vvv --echo-client "please_connect" localhost --tcp -p1001-1003 --flags
    ack

    ```


    As you can see, you''re going to connect to three TCP ports (1001, 1002, and 1003)
    and fire TCP ACK packets at them. If you have difficulties with the connection
    and you receive a “Handshake failed” error message, then you probably entered
    your passwords incorrectly at one end.


    Let''s look at what happens on either side of the connection, starting with the
    client. The root user, using the -vvv option, you''re going to see the packets
    as you traverse the network; otherwise, the output would be much quieter. Listing
    5.2 shows an abbreviated sample of what you see.


    ### LISTING 5.2 An abbreviated sample output from your client showing just one
    and one received packet rather than many packets


    ```

    Starting Nping 0.51 (http://nmap.org/nping) at 2016-11-16 11:16 GMT

    SENT (0.4256s) TCP [127.0.0.1:20869 > 127.0.0.1:1000] seq=3313364 ack=11279167
    res=0 win=0 sum=0ec91f urp=0 [IP:4 id=55 options=0 iplen=40 ttl=64 proto=6 sum=0xc3664

    0000 45 00 28 0e 04 00 40 63 64 7f 00 00 01..S....

    0010 7f 00 00 51 85 03 e8 01 94 f4 25 24 39 03 88 ....Q);

    0020 50 10 05 83 17 00 00 ....P

    RCVD (0.4268s) TCP [127.0.0.1:1000 < 127.0.0.1:20869] seq=11279167 ack=0 res=0
    win=0 sum=0xe211 urp=0 [IP:4 id=55 options=0 iplen=40 ttl=64 proto=6 sum=0xc396

    0000 45 00 28 0e 04 00 40 63 64 7f 00 00 01..E...).

    0010 7f 00 00 51 85 03 e8 01 94 f4 25 24 39 03 88 ....Q);

    0020 50 04 00 00 22 11 00 00 ......

    Max rtt: 0.085ms | Min rtt: 0.083ms | Avg rtt: 0.083ms

    Raw packets sent: 4 (160B) | Rcvd: 4 (160B) | Lost: 0 (0.00%) | Echoed: 0 (0)

    ```


    ### LISTING 5.2 An abbreviated sample output from your client showing just one
    and one received packet (continued)


    | Tx time: 3.23067s | Tx bytes/s: 49.53 | Tx pkts/s: 1.24 |

    | Rx time: 3.23067s | Rx bytes/s: 49.53 | Rx pkts/s: 1.24 |

    | Nping done: 1 IP pinged in 36 seconds |


    In Listing 5.2, you have abbreviated the output to see only one "SENT" outbound
    from the client to TCP port 1000. Next, the client receives a reply from the server
    (inbound, which is marked as "RCVD") from TCP port 1000 to TCP port 2086, one
    of the higher ports.


    The additional noise, to the -vv option, includes the checksum line (starting
    csum) and the three lines of content. The "C" signifies that I''ve stopped the
    output just after it begins, for brevity. And, in the same way that the ping command
    behaves, you receive (rtt) Round Trip Times and transactivating statistics below,
    followed by an overall completion time.


    On the server (any local machine, which reality is of little consequence), Nping
    is listening on TCP port 9929. Listing 5.3 shows the output that the server provides.


    ### LISTING 5.3 The server''s perspective of the packets that were sent by your
    client


    ```

    Starting Nping 0.0.51 (http://nmap.org/nping) at 2016-11-16 11:16 GMT

    Packet capture will be performed using network interface eth0.

    Waiting for connections...

    Server bound to 0.0.0.0:9929

    [179294971] Connection received from 127.0.0.1:51099

    [179294971] Good packet specification received from client #0

    [Specs:IP=4,Proto=6,Cnt=5]

    [179294971] NEP handshake with client #0 (127.0.0.1:51099) was performed successfully

    [179294971] Client #0 (127.0.0.1:51099) disconnected

    ```


    In Listing 5.3, your server reported "Good packet specification received from
    client #0" and that a handshake was completed without any issue, followed by an
    Epoch timestamp of the disconnection from the client. There''s not much to glean
    from the server side, so you only need to be logged into the client if the server
    is always available for testing.


    The Nmap Project help provides some test machines that you can use. The password
    is "public" for the hostname "echo.nmap.org." For Nmap scans (not Nping), you
    can try this host: http://scan.nmap.org.


    Because NAT is so popular (your connection is likely to be NATed), there''s a
    good chance that you would see CAPT entries under the SENT lines if you query
    that machine. This command works for me:


    ```

    # nping --echo-client echo.nmap.org

    ```


    # Other Nping Options


    Using the --delay 10 option, you can limit the frequency of your packets. The
    default is to usually send pings at one second apart, but increasing this value
    can reduce the noise on your screen if you''re watching diligently for a particular
    event.


    Along the same lines is the --rate 3 option, which you can flood a target machine
    by sending three packets per second in the example just given. Don''t get tripped
    up with settings for the rate and delay options, however. According to the documentation:


    his] rate and --delay are inverse; --rate 20 is the same as --delay 0.05. If other
    addresses are used, only the one in the parameter list counts.


    You can utilize the -H or --hide-sent option where outbound packets aren''t shown.
    For example, if you''re flooding a connection, then this will help.


    In addition, if you''re flooding a network and testing how it responds to a significant
    load, then you probably don''t want to process each packet that is received. The
    -N or --no-cap-ture option doesn''t capture any packets that are received.

