    # Chapter 1: Invisibility Cloak


    sequence to trigger those actions under the sequence option. After installing
    knockd, I immediately changed those ports from the defaults to avoid reducing
    the effectiveness of my server security. The defaults are ports 7000, 8000, and
    9000 to open up SSH access and ports 9000, 8000, 7000 to close access. As you
    can see, I''ve added more ports to open the access so someone will be less likely
    to stumble across their combination with an arbitrary port scan.


    After changing any settings, you can simply restart knockd on system-based operating
    systems:


    ```

    # systemctl restart knockd.service

    ```


    After installing knockd, if you want more background information on the package,
    then Debian Jessie has a brief README file you can find at /usr/share/doc/knockd/README.


    This helpful README file discusses how knockd works, among other things. It uses
    a library called libcap, which is also used by several other packages such as
    tcpdump, ngrep, and iftop (which capture packets for inspection). Thanks to its
    clever design, knockd doesn''t even need to bind to the ports, it''s cleverly
    listening on, in order to monitor raw traffic.


    # Altering Filesystem Locations


    Events such as connections, disconnections, or errors are logged directly to your
    system''s syslog, and may be written to the /var/log/messages or /var/log/syslog
    file. If you don''t want this information to be buried among other system log
    activities, or go to the bother of parsing an unwieldy log file, you can create
