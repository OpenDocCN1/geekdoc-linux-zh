    Incidently, if you find that your logs are filling up too quickly, then you can
    just flush every iptables rule like this:


    ```

    # iptables -F

    # iptables -X

    # iptables -t nat -F

    # iptables -t nat -X

    # iptables -t mangle -F

    # iptables -t mangle -X

    # iptables -t raw -F

    # iptables -t raw -X

    # iptables -t security -F

    # iptables -t security -X

    # iptables -P INPUT ACCEPT

    # iptables -P FORWARD ACCEPT

    # iptables -P OUTPUT ACCEPT

    ```


    My preference is to put this strings into a script (or very long Bash aliases
    with the commands separated by semicolons), and as the root user, I can type flush
    whenever I need a quick, fail-safe removal of all the firewall rules in use.


    # Hardening


    If you''re worried about your system being overloaded by ICMP traffic, there are
    a couple of relatively simple things you can check. This is thanks to the power
    of Unix-type operating systems. First (and your build may already have this set
    as default), you can ignore ICMP broadcasts by adding the following line to the
    bottom of the file /etc/sysctl.conf:


    ```

    net.ipv4.icmp_echo_ignore_broadcasts = 1

    ```


    This sysctl.conf example will persist a reboot, whereas the following command
    will set it immediately:


    ```

    # echo "1" /proc/sys/net/ipv4/icmp_echo_ignore_broadcasts

    ```


    The following command will also set it immediately if you have followed the sysctl.conf
    example (it reloads all the config settings inside the file sysctl.conf):


    ```

    # sysctl -p

    ```


    The icmp_echo_ignore_broadcasts setting stops ICMP broadcasts from bringing your
    network with unwanted broadcast traffic.


    In reality, this is a deprecated attack (you saw that modern kernels use rate-limiting
    at standard), and the kernel setting is only useful for ping attacks to the broadcast'
