    # Chapter 3: Twenty-First-Century Netcat


    documentation makes a point of stating that it not only uses completely rewritten
    code (and doesn''t borrow from the original version), but that also employs Nmap''s
    thoroughly battle-tested networking libraries.


    Having HTTP proxies, I''ll start by using netcat as a web browser. If you type
    this command, along with an arbitrary website you want to visit, then you''ll
    be able to connect to TCP port 80:


    ```

    # ncat -C www.chrisbinnie.tld 80

    ```


    As soon as you''ve typed this command and hit the Enter key, you''ll need to type
    the follow-text, and then Enter a couple of times:


    ```

    GET /HTTP/1.0

    ```


    Be warned that if you''re not quick, the command will time out and you''ll have
    to try again. If you''ve ever queried HTML from the command line before, then
    you probably will be surprised by the excess of information that scrolls up your
    screen after doing so. If you''re interested, the -c option throws a Carriage
    Return and Line Feed (CRLF) into the mix to allow compatibility with some network
    protocols.


    You can also use netcat as a daemon that listens. There are numerous ways of breaking
    into servers, and one way of leaving access open for a return visit is leaving
    netcat listening on an obscure port a sysadmin might not be aware of.


    You''ll think about that in a moment, but focus on HTTP. The netcat documentation
    provides an excellent example of how to turn your simple netcat binary into a
    basic web server. First, you will create a simple file. You won''t use the .html
    extension, because your file won''t be plain HTML; instead, it''ll be one half
    of an HTTP conversation. You''ll call your index.http with the content shown in
    Listing 3.1.


    # LISTING 3.1 One half of an HTTP conversation, saved in the file index.


    ```

    HTTP/1.0 200 OK


    <HTML>

    <BODY>

    Nothing to see here, move along.

    </BODY>

    </HTML>

    ```


    As Listing 3.1 shows, it''s mostly HTML, but the header acknowledges the visiting
    client''s request first. Next, make netcat listen for connections, and present
    your file if it''s asked to do so by running this command:


    ```

    # ncat -1 127.0.0.1 80 < index.http

    ```'
