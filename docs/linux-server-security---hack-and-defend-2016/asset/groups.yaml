    # Chapter 5: Nping


    Because NAT is so popular (your connection is likely to be NATed), there''s a
    good chance that you would see CAPT entries under the SENT lines and before the
    next RCVD line if you query that machine. This command works for me:


    ```

    # nping --echo-client echo.nmap. --tcp

    ```


    If you look carefully at the captured packet source (CAPT), you should be able
    to tell if NAT has altered your source address. such as 10.0.10.10, as per RFC
    1918 (https://tools.ietf.org/html/rfc1918), being changed to a publicly routed
    IP address such as 123.123.123.123 if NAT has been involved. It''s relatively
    easy to detect NAT getting in the way of your connection. Remember that there
    is NAT, there are sometimes other devices altering MTUs (Maximum Transmission
    Units), packet-mangling for traffic shaping, unexpected firewalls, and invisible
    switches that might cause subtle changes to your connection.


    There are a number of other scenarios within which Nping can assist, (after some
    learning) being able to spot if transparent proxies might be employed on route.
    I will leave you to advance your skills further, but in the meantime, the following
    section describes a few other options that you might find useful.


    # Other Nping Options


    Using the --delay 10 option, you can limit the frequency of your packets. The
    default is to usually send pings at one second apart, but increasing this value
    can reduce the noise on your screen if you''re watching diligently for a particular
    event.


    Along the same lines is the --rate 3 option, which you can flood a target machine
    by sending three packets per second in the example just given. Don''t get tripped
    up with settings for the rate and delay options, however. According to the documentation:


    [his] rate and --delay are inverse; --rate 20 is the same as --delay 0.05. If
    other addresses are used, only the one in the parameter list counts.


    You can utilize the -H or --hide-sent option where outbound packets aren''t shown.
    For example, if you''re flooding a connection, then this will help.


    In addition, if you''re flooding a network and testing how it responds to a significant
    load, then you probably don''t want to process each packet that is received. The
    -N or --no-cap-ture option doesn''t capture any packets that are received.'
