    ## Chapter 8: Malware Detection


    Imagine you want to monitor two particular filesystem partitions, because your
    users potentially have the ability to write data there. You would monitor the
    paths as follows:


    ```bash

    # maldet -m /usr/local,/home

    ```


    Note the comma that is separating the paths. The output for running this command
    is shown in Figure 8. Remember that large scans can use the -b background option,
    or as you saw earlier.


    ### FIGURE 8.S


    What you see when LMD starts monitoring two filesystem partitions with notify
    enabled


