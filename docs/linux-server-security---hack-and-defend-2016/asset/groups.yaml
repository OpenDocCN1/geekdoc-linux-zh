    ## 监控文件系统


    观察变化的一种方法是使用 notify。不要担心，因为从 2.6.13 版本开始内核中已包含了 notify，因此大多数 Linux 构建都能正常工作。


    复杂的 notify 可以实时监控单个文件或目录的更改，如果发现任何更改。捕获到某个用户发生了更改，notify 将其视为事件并立即报告。通过创建一个观察列表，notify
    可以跟踪列表中的每个唯一项。虽然 notify 不会传递有关更改的文件或目录的详细信息，但对于大多数应用程序已经足够。如果 notify 不可用，通常需要通过轮询文件系统的方法手动运行。在检查网络文件系统的更改的情况下，任何配置软件将需要使用预定义的频率进行轮询。因为递归文件系统很难追踪。不幸的是，notify
    可见 /proc、sys 和 /dev/pts 等伪系统。


