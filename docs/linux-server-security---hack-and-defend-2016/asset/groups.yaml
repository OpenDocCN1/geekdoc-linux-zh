    # Chapter 3: Twenty-First-Century Netcat


    FIGURE 3.1


    Netcat automatically generates a temporary SSL certificate.


    ```

    Ncat: Version 5.51 (http://nmap.org/ncat )

    Ncat: Generating a temporary 1024-bit RSA key. Use --ssl-key and --ssl-cert to
    use a permanent one.

    Ncat: RSA-1 fingerprint: 71B8 7CB4 7159 F390 A0FC 5B26 46CE 0F41 18D2 1EF4

    Ncat: Listening on 0.0.0.0:12337

    ```


    # Executables


    Along with dealing with encryption, you can also execute a command on the shell
    upon receiving a connection. Needless to say, you must always consider the potentially
    disastrous implications of running the following commands. Don''t try anything
    on production machines without being very sure of what is going behind the scenes.
    In other words, test these commands on development boxes first and become familiar
    with the considerable damage they can do.


    The first (worrying) executable example you look at is the Bash itself. It''s
    not difficult to learn, which is very concerning. I have already mentioned that
    breaking into a server and learning an alternative way of accessing it is possible
    with netcat. Ncat you don''t even need to be root to open up a shell. Try it yourself.


    On your listening machine (Louis), whose shell you will open up to the world,
    run this command:


    ```

    Luis> ncat --exec "/bin/bash" -l 1234 --keep-open

    ```


    And in your familiar connect-to from (Lionel), you simply run this command:


    ```

    Lionel> ncat Louis 1234

    ```


    The first time you connect to TCP port 1234, you might suspect that the Bash shell
    hasn''t been spawned correctly. However, try typing any valid Bash command, such
    as requesting a directory list:


    ```

    # ls

    ```


    You will see Louis'' current directory, on Lionel, which should concern you. Type
    commands very carefully, and you won''t get all the Bash feedback that you''re
    used to, for file deletion and command execution is easy.


    The highly popular and powerful security tool called Metasploit takes this functionality
    one step further, making the backdoor persistent. Even if you don''t install Metasploit
    and further your knowledge, it''s well worth this web page about using netcat'
  - '[PAGE 47]


    # Chapter 3: Twenty-First-Century Netcat


    On a Windows machine: https://www.offensive-security.com/metasploit-unleased/persistent-netcat-backdoor/.
    You can see from reading this web page that it''s relatively easy to write changes
    to the Windows registry and the firewall rules by following the included instructions.


    Whichever operating system you are using, multiple options are available with
    netcat. Be warned that during your testing, you can pass many environment variables
    and cause all sorts of problems if you''re not careful.


    # Access Control Lists


    With netcat the features are coming on soon. You can even add ACLs (Access Control
    Lists) to your netcat instances. On a listening netcat daemon, you might add ACLs
    as those in the following examples. You''ll execute on the Bash command what you
    just looked at by duly locking down your port, one example from the documentation,
    as shown here:


    ```

    # ncat --exec "/bin/bash" --max-conn 3 --allow 192.168.0.0/24 -l 8081 --keep-open

    ```


    You can see that you''re only allowing the 254 hosts from the CIDR /24 IP address
    range 192.168.0.0, which are only allowed to open up a maximum of three connections.
    The combination of these options adds very versatility.


    The opposite of command might be, using IPv6, a --deny example like the following:


    ```

    # ncat -l --deny 1222:cb88::3b

    ```


    Here are you allowing other machines access and denying this one. This applies
    equally to IPv4 as you''d expect.


    Alternately, the method is much more efficient when enabling or denying access
    for multiple hosts. You simply populate a file with your entries. Use both --denyfile
    and --allowfile options as follows:


    ```

    # ncat -l --allowfile trusted-hosts.txt

    ```


    # Miscellaneous Options


    Incidentally, you can easily jump from the default TCP by using the -u or --udp
    switches. You''ll see that''s useful in a moment.


    Similarly, to start using SCTP (Stream Control Transmission Protocol), you can
    provide netcat with the --sctp option.'
