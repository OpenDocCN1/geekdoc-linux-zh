    # Port Knocking Clients


    You can use different clients to create a knocking sequence in order to initialize
    a connection and open up your SSH port. You can even manually use tools such as
    Nmap, netcat, and Telnet to probe the required ports in sequence. The documentation
    also mentions that you can use the hping, sendip, and packit packages if they
    are available. Let''s look at an example of the knock command that comes with
    the knockd package.


    If you used openSSH section shown in Listing 1.1, you would set up your simple
    knock command with the following syntax:


    ```

    # knock [options] <host> <port [:proto]> <port [:proto]> <port [:proto]>

    ```


    I configured TCP ports in Listing 1.1, so you can run the knock command as follows:


    ```

    # knock 11.11.11.11 6:tcp 1450:tcp 8156:tcp 22045:tcp 23501:tcp

    24691:tcp

    ```


    The target has the IP address 11.11.11.11 in this example. If you want, you can
    also use a combination of UDP and TCP ports in Listing 1.1; your client-side knocking
    sequence might like this:


    ```

    # knock 11.11.11.11 6:tcp 1450:udp 8156:udp 22045:tcp 23501:udp

    24691:tcp

    ```


    One shortcut is that if you only want to use UDP ports, then you can simply add
    -u to the start of the command rather than specifying them explicitly. You can
    run a command for UDP ports like this:


    ```

    # knock -u 11 22 33 44 55

    ```


    Let''s return to your server''s config file to see how TCP and UDP can be intertwined
    within your valid knocking sequence. In order to mix protocols, you would simply
    alter the sequence line under the openSSH section as follows:


    ```

    [openSSH

    sequence = 6:tcp 1450:udp 8156:udp 22045:tcp 23501:udp

    24691:tcp]

    ```


    # Making Your Server Invisible


    Once you are confident that your installation is working as you''d like, you can
    lock your server down to hide it from attackers. An attacker may be able to attack
    the IP address bound to your server or somehow might be able to view traffic sent
    and received from that IP address (for example, they might work for the ISP that
    the server was hosted with).'
