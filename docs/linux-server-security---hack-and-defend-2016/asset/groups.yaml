    LMD offers a number of monitoring modes that can be configured to check different
    parts of the filesystem. As you will see, LMD uses the binary executable called
    Maldet, short for "malware detection."


    To monitor a system component, you can use the -m option, also written as --monitor.
    What LMD can monitor may be broken down into users, files, and paths. The website
    gives the following example of how the three modes might look on the command line:


    ```

