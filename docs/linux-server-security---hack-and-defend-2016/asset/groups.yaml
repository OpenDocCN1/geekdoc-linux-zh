    ## Chapter 4: Denying Service


    institutions to toughen up aspects of their networking infrastructure, on both
    their hosts and networking equipment, to prevent cascading effects around the
    Internet.


    Specifically, it takes some time to discuss the importance of ingress filtering
    to protect external networks from your network if it is used as an attack tool.
    Citing that, by employing simple preventative measures, the diagnosis and mitigation
    of an attack from a "valid" source is more effective than guessing where the originating
    traffic comes from, as you saw in the earlier section, "NTP Reflection Attacks."


    Varying levels of ingress filtering should achieve that goal in many circumstances.
    One of the observations presented is that by reducing the number and frequency
    of attacks on the Internet, ultimately more resources will be available when attacks
    occur. As a result, responses will be more effective. Much of the content contributed
    to these seminal guidelines is attributed to the venerable NANOG (North American
    Network Operators’ Group: https://www.nanog.org) who vociferously discuss networking
    issues in detail on a popular mailing list.


    # Bringing a Nation to Its Knees


    The threat of multiple, geographically diverse systems being aimed at a single
    system — such as a network or autonomous system, regardless of how large it may
    be — and taking it offline has long been a concern for enterprises, ISPs, and
    even entire nations. DDoS attacks may even have existed since the mid-1990s.


    It was widely reported in 2007 that the Baltic state of Estonia repeated DDoS
    attacks, coupled with street rioting, almost brought the government to its knees.
    Apparently the population objected to the removal of a famous war memorial by
    the Estonian parliament. Coupled with a high level of social unrest, this was
    the tipping point. The steadily increasing levels of attack traffic from the DDoS
    were received in a sustained manner over a prolonged period of time. News agencies
    were frustrated by the lack of connectivity, as this meant that the rest of the
    world could not be kept up-to-date with events as they unfolded within the country.


    The Estonian DDoS evolved, and at one point reportedly reached four million packets
    per second of attack traffic. This was partly aimed at, and according to some
    reports it was ultimately successful in, taking the nation’s largest bank off
    the Internet. According to national statistics, around 97 percent of the population
    banked online, which meant this was a critical failure in the country’s banking
    systems. And if the impact wasn’t damaging enough already, the lack of Internet
    connectivity meant that the main bank couldn’t communicate with, or disperse cash
    from, automated teller machines (ATMs).


    Worryingly, it has been said that the only arrest relating to this hugely destructive
    incident, which lasted around three weeks, resulted in a fine less than US$2,000.
    NATO''s involvement in furthering the effectiveness of international responses
    to these attacks was bolstered, by the stark lessons learned in Estonia.


    # Mapping Attacks


    As the excellent book, Firewalls and Internet Security: Repelling the Wily Hacker,
    by William Cheswick, et al. succinctly in the Introduction:


    The Internet is a large city, not a series of small towns. Anyone can use it,
    and use it nearly anonymously.


    The Internet is a bad neighborhood.


    The validity of this can be confirmed by using Digital Attack Map, an online tool
    that provides an excellent global overview of DDoS attacks and that is updated
    hourly, at www.digitalattackmap.com.


    This fully graphical Digital Attack Map tool is run by Arbor Networks and Google
    Ideas, which populate the data from over 270 global ISPs. These ISPs have agreed
    to share data with Arbor Networks'' global threat intelligence system, ATLAS.
    The data is also available via Arbor''s ATLAS threat portal and there is a closer
    look at .arbornetworks.com/threats.


    In addition, there''s a useful gallery that highlights key historical attacks
    for reference, at www.digitalattackmap.com/gallery. You can interact by hovering
    your mouse over the attack flows revealing the eye-watering gigabits per second
    of bandwidth that was abused during the attack. There are also approximate sources
    of the attacks (for example, if an attack was generated by a botnet, then it might
    be from dozens of different countries), the presumed victim, and the attack''s
    duration. Of additional interest is the source and destination ports used during
    the attack; lo behold, the NTP port, UDP port 123, was present in one of the few
    attacks that I queried. Interestingly, though, ports 80 and 53, HTTP and DNS respectively,
    seem to be the most popular DDoS services, judging by the available data.


    Figure 4.1 shows a sample of attacks from the Digital Attack Map, along with the
    types of attacks that the map presents. This is merely the left side.


    Figure 4.1 shows a sample of attacks from the Digital Attack Map, along with the
    types of attacks that the map presents. This is merely the left side.


    # Summary


    In this chapter, we looked at number of issues that affect the Internet. As we
    saw recently, UDP is highly vulnerable. However, it is imperative to monitor your
    systems and networks continuously. While the ping command is a common tool, it''s
    interesting to note that the does not always expect a three-way handshake and
    is therefore more likely to be exploited.


    Let''s look at how Nping tool can help you gain more insight into what your systems
    and networks are, both remote and local connections.


    # Nping


    Just as the U.S. military''s DARPA (the Department of Defense''s Advanced Research
    Projects Agency) contributed so greatly and helped to shape the Internet that
    you know today, a similar tool to the ping command. As part of the powerful tool
    Nmap (https://nmap.org) also includes access to a powerful improvement to the
    ping command, called Nping (https://nmap.org/nping/). If you have used Nmap, you''ll
    know that you''re in safe hands with any tool created by the Nmap Project.


    # Functionality


    On the surface, what you expect Nping''s functionality to be relatively limited.
    After all, when you fire off a ping, you send a question and then wait for an
    answer. Although Nping is still not a finished piece of software, it''s safe to
    say that it''s highly comprehensive and sophisticated networking tool.


    You will begin by getting used to the syntax. You''ll need to be in root, the
    superuser, to execute Nping commands, and you''ll look at TCP mode. Your first
    exercise will be to fire off TCP (you read correctly; they''re not ICMP pings)
    toward your local machine.


    If you don''t have it already, you can install Nping as follows.

    '
