    # 回声模式 (Echo Mode)


    Nping 包含的高级功能中包括了回声模式。该模式旨在详细显示数据包在穿越网络时发生了什么变化。通过在两个主机上启用回声模式，你可以建立服务器与客户端的关系，以精确监控在线路上发生的任何事情。


    让我们来看看这个功能。服务器组件捕获数据包，然后通过 TCP 通信“通道”将细节发回客户端。首先，生成上述数据包是客户端的任务。


    这种技术是发现可能发生的任何包篡改（packet-mangling）极极方法。例如，如果涉及到网络地址翻译 (NAT)，许多细节也会发生。通过使用这种技术，如果线路上的设备更改了任何其他
    TCP 选项，或者对数据包进行了流量整形，那么这些难以诊断的细节就会显而易见。你可能还能确定传输数据包是否被神秘地阻塞，这将有助于诊断问题。


    让我们尝试使用回声模式做一个小实验。顺便提一下，如果你想从 Nping 获取更多输出和更高级别的信息，可以添加 -vvv 来增加详细度。要开始，你需要 root
    用户权限启动连接的服务器端。你将使用密码 "please_connect" 并通过以下命令在你的 eth0 接口上接收的输出中添加详细信息：


    ```

