    # 第6 章：日志侦察


    让本地网络广播域内的每个设备做出响应。如果每个设备都同时响应，然后对他人的响应再次响应，就会由于网络上的流量过大导致拒绝服务。然而，与所有的内核设置一样，了解背景对于帮助你理解网络的工作原理是有用的。


    另一种攻击（追溯到 1996 年）是“死亡之 Ping”（Ping of Death），它通过构造庞大的 ICMP 数据包，寄希望导致远程崩溃。它影响了许多流行的工作系统（在发布时发现有
    18 个操作系统存在漏洞）。只需知道 IP 地址，并向该 IP 地址发送大于 65,536 字节的 ICMP 数据包，就会导致目标机器崩溃。关于此的更多信息可以查阅外部网站
    Insecure.org：http://insecure.org/exploits/ping-o-death.html。


    昨天讨论的另一种常见攻击涉及中间人攻击（MITM），被称为“小精灵人攻击”（smurf attack）。小精灵人攻击是欺骗如何工作的良好范例，它属于最近变得更加频繁的一种攻击类型，被称为放大攻击。


    中间人被充分利用，使得无法识别攻击的原始源，攻击的目标是饱和带宽，最终导致拒绝服务。在运作时，密集的 ICMP 流量实际上似乎来自受害者本身，他们向受害者发送了正常的回显回复，而受害者甚至没有请求过响应。他们也无法阻止数据包到达。在互联网早期，你的
    ISP（网络服务商）可以禁用所有 ICMP 流量来阻止海量的数据流。由于数据包是伪造的，即使是日志对于追踪来源也无助。


    解决此问题的一种方法是由你自己对数据包进行速率限制。这让 ICMP 能够到达，并让你的网络正常运行，尽管可能会稍微慢一点。


    这可以在专有硬件（如 Cisco 或 Juniper）上实现，也可以在单个主机上使用 `iptables` 并配合如下规则：


    ```

    # iptables - INPUT -p icmp -m limit --limit 30/minute --limit-burst 60 -j ACCEPT

    # iptables - INPUT -p icmp -m limit --limit 6/minute --limit-burst 10 -j LOG

    # iptables - INPUT -p icmp -j DROP

    ```


    从第一行所示的配置来看，`--limit-burst` 选项允许在启用每秒一个包的速率限制（30/分钟的值）之前，初始允许多达 60 个数据包到达。第二行表示你将记录（尽管严格得多）在记录到
    syslog 之前接受了多少流量：在爆发十个数据包后每分钟记录六条目。最后，你将丢弃那些数据包以减轻任何影响。


    如果我没有理解错误的话，`--limit-burst` 值指的是由 `--limit` 指定的周期。当未达到该限制时，每当未达到限制，`--limit-burst`
    就会获得一个增量——换句话说，增加1，直到达到配置的数字。


    # 总结


    你所探索的一些更改可能会对系统和网络造成破坏。在生产环境中尝试任何这些设置之前，你应该清楚自己在做什么（理想情况下在测试机上进行实验）。正如提到的，因为 ICMP
    的糟糕声誉而陷入恐慌，并简单地在你的网络上禁止所有对该协议的引用，是不明智的。


    你已经查看了攻击以及如何防止它们影响你网络和服务器的正常运行。你还查看了对入站 ICMP 流量的速率限制。


    此外，你查看了 ping 和 traceroute 的日志记录，以发现服务器上任何带有恶意意图的侦察，更重要的是，如何安全地将所有意外探测记录到文件中，以便攻击不会用巨大的日志文件填满你的磁盘。


    可以说，这些知识中的某些可能很少需要，但下当有人提到他们正在自己的服务器上拦截 ICMP 流量时，你可以给他们一个会会的眼神，并说你有信心 ICMP 问题将不再再给你带来麻烦了。


    # Nmap 极其强大的 NSE


    即使是优秀的系统管理员可能也听过对本地和远程主机运行端口扫描。他们可能也听过市场上一个著名的端口扫描器，由 Nmap 项目创建，命名为 Nmap，代表“Network
    Mapper”（网络映射器），它不仅极快、复杂且高效，而且功能极其丰富。


    在它的许多功能中，你可以测试远程服务器运行的操作系统，审核本地和远程机器的安全性，并创建网络机器及其活动服务的清单。


    你过去可能使用过 Nmap 进行扫描，但很有可能你并没有意识到它是一个强大的渗透测试工具。这部分归功于它复杂的内置脚本引擎。然而，在你查看它之前，你将首先回顾
    Nmap 的基础端口扫描功能。然后你将学习如何将 Nmap 用于更高级的白帽活动。


    # 基础端口扫描


    即使是 Nmap 封装的基础（端口扫描）功能也包含高级选项，例如确定你的源 IP 地址（使用 -S 选项）。它提供了丰富的功能。但首先让我们从安装软件包开始。


