    ## 第6 章：日志侦察


    在以下代码中，你将看到参与 ping 流量交换的源 IP 和目的 IP 地址（SRC=10.10.10.200 和 DST=10.10.10.10）被记录在
    /var/log messages 文件中。


    ```

    Feb 21 17:19:34 noid.chribinnie.tld kernel: Pings Logged IN=eth0

    OUT=MAC=00:61:24:3e:1c:ef:00:30:16:3c:14:3b:02 SRC=10.10.10.200

    DST=10.10.10.10 LEN=80 TOS=00 PRETT=64 ID=0 PROTO=ICMP

    TYPE=8 CODE=0 ID=4097 SEQ=1

    Feb 21 17:19:34 noid.chribinnie.tld kernel: Pings Logged IN=eth0

    OUT=MAC=00:61:24:3e:1c:ef:00:30:16:3c:14:3b:02 SRC=10.10.10.200

    DST=10.10.10.10 LEN=80 TOS=00 PRETT=64 ID=0 PROTO=ICMP

    TYPE=8 CODE=0 ID=4097 SEQ=3

    ```


    如果我们使用 tcpdump 或 iptables 来记录流量，我非常希望减少日志。第一个原因是为了防止（无论是有意还是无意）在被 ICMP 流量淹没后，通过创建巨大的日志文件导致磁盘空间问题。第二个原因是将显著的日志噪声水平保持在最低，以便我能够读取日志并看到我正在寻找的内容。


    假设你出于系统稳定性的考虑，明智地觉得让 tcpdump 全年在后台运行是不舒服的，那么，让我们使用 iptables 示例来提取出你需要的信息。


    让我们来看一下如何从日志中剔除噪声的高级概述。为了清晰起见，你可能希望你的侦察结果输出到与 syslog 不同的独立文件中。


    我将使用出色的、“极速”的 syslog 服务器 rsyslog 作为示例（你可以在 www.rsyslog.com 找到更多信息）。这是因为 Red Hat
    和 Debian（以及它们的许多衍生版本）默认使用 rsyslog，所以你很有可能访问到它。


    让我们再次看一眼刚才的 iptables 示例：


    ```

    # iptables -I INPUT -p icmp --icmp-type 8 -m state --state

    NEW, ESTABLISHED, RELATED -j LOG --log-level=1 --log-prefix "Pings

    Logged"

    ```


    你现在正密切关注 --log-prefix 选项，如下所示：


    ```

    --log-prefix "Pings Logged "

    ```


    如果你想将所有的内核警告保存到新的日志文件中，那么设置起来相对简单。打开 /etc/rsyslog.conf 文件，并在 RULES 部分或其附近添加以下行（假设已经没有一个你可能会干扰的
    kern.warning 条目；否则，请决定是覆盖它还是追加到后面）：


    ```

    kern.warning

    ```


    当然，当涉及到处理文本时，你可以通过简单的 shell 脚本（或使用某些 grep、awk 或 sed 命令行工具）实现许多不同的结果。然而，为了避免磁盘空间耗尽问题，让我们尝试在硬件出现故障并在短时间内产生成千上万条警告的情况下，不要记录内核的每一个警告。


    你将创建一个新的 syslog 配置文件并将其命名为 /etc/rsyslog.d/iptables-pings-logging。可以信的是，你可能可以给此文件起任何喜欢的名字，只要你的主配置文件（即
    /etc/rsyslog.conf）会读取在该目录中找到的所有配置文件。默认情况下，该文件中有一个如下所示的条目，用于包含所有的配置文件：


    ```

    $IncludeConfig /etc/rsyslog.d/*.conf

    ```


    我应该说，我在让过滤器从该目录下的新文件工作方面遇到过困难。尽管我检查了权限，并且其中一个文件中的远程-syslog-logging 可以正常工作（并且尝试了你接下来将看到的
    `startswith` 运算符而不是 `contains`）。


    如果你遇到了相同的问题，那么不要向你的新配置文件添加两行，而是直接导航到主配置文件 (/etc/rsyslog.conf) 中提到 `kern.*` 的行，以避免使用单独的文件，并添加以下两行：


    ```

    :msg contains "Pings"

    & /var/log/iptables-pings

    ```


    第一行捕获包含字符串 "Pings" 的条目，并要求 syslog 写入文件 /var/log/iptables-pings.log。第二行有点特殊，它告诉
    syslog 忽略上一行捕获的任何条目，这样你就不会通过将相同的内容写入另一个文件而导致日志重复。当然，如果你想记录到其他地方，可以跳过第二行。现在你已经能够将内容丢到日志文件中并过滤
    iptables 事件（根据你的喜好添加自己的标签），让我们来看看其他示例。


    img/0de912dbd05f760e7b5b15fbf73eaa74_0


    ## 多部分规则


    img/0de912dbd05f760e7b5b15fbf73eaa75_0


    如果你允许 ping 到达你的服务器，同时也允许你的服务器出站 ping，那么每个操作都涉及略有不同的 iptables 配置。以下网页解释了如何允许 ping
    进入你服务器上的特定 IP 地址（假设你的服务器上绑定了多个 IP），以及不同的出站 ping 配置：tips/linux-iptables-allow-icmp.html。注意，入站规则的
    -d 选项意味着特定的 IP 地址。


    ## 为了取证分析而记录所有内容


    如果你担心自己正遭受攻击，并想要记录到你机器的所有入站连接，你可以简要启用此命令：


    ```

    # iptables -I INPUT -m state --state NEW -j LOG --log-prefix "Traffic: "

    ```


    请注意，你的 /var/log/messages 文件将变得非常大，以至于你必须尽快清除规则来禁用日志。一旦可能，就通过刷新规则来禁用日志。你可能会发现，你的
    /var/log/messages 输出如下所示：


    ```

    Feb 21 17:19:34 noid.chribinnie.tld kernel: Pings Logged IN=eth0

    OUT=MAC=00:61:24:3e:1c:ef:00:30:16:3c:14:3b:02 SRC=10.10.10.200

    DST=10.10.10.10 LEN=80 TOS=00 PRETT=64 ID=0 PROTO=ICMP

    TYPE=8 CODE=0 ID=4097 SEQ=1

    ```


    这是从 /var/log/messages 提取的，流量是由 UDP 数据包生成的。


    如果你想记录日志但同时也限制流量，只需将 INPUT 替换为 OUTPUT。例如：


    ```

    # iptables -I INPUT -p icmp -p udp limit 5/min -j LOG --log-prefix "Blocked ICMP
    Traffic: " --log-level 7

    ```


    这种示例意味着在重复开始之前，几次探测是有用的。顺便提一下，如果你发现日志填充得太快，可以像这样刷新所有的 iptables 规则：你可能会看到输出如下：


    ```

    Feb 21 17:19:34 noid.chribinnie.tld kernel: Pings Logged IN=eth0

    OUT=MAC=00:61:24:3e:1c:ef:00:30:16:3c:14:3b:02 SRC=10.10.10.200

    DST=10.10.10.10 LEN=80 TOS=00 PRETT=64 ID=0 PROTO=ICMP

    TYPE=8 CODE=0 ID=4097 SEQ=3

    ```


    我的偏好是将这些字符串放入脚本中（或使用用分号分隔的长 Bash 别名），作为 root 用户，我可以在需要时快速、安全地移除正在使用的防火墙规则。


    ```

    # iptables -F

    # iptables -X

    # iptables -t nat -F

    # iptables -t nat -X

    # iptables -t mangle -F

    # iptables -t mangle -X

    # iptables -t raw -F

    # iptables -t raw -X

    # iptables -t security -F

    # iptables -t security -X

    # iptables -P INPUT ACCEPT

    # iptables -P FORWARD ACCEPT

    # iptables -P OUTPUT ACCEPT

    ```


    ## 加固


    如果你担心系统被 ICMP 流量过载，可以检查一些相对简单的项目。这归益于 Unix 类型操作系统的强大。首先（你的发行版本可能已经将其设置为默认值），你可以通过向
    /etc/sysctl.conf 文件末尾添加以下行来忽略 ICMP 广播：


    ```

    net.ipv4.icmp_echo_broadcast_s = 1

    ```


    这个 sysctl.conf 示例在重启后有效，而下面的命令会立即生效：


    ```

    # echo "1" > /proc/sys/net/ipv4/icmp_echo_broadcast_s

    ```


    如果你已经遵循了 sysctl.conf 示例，下面的命令也可以立即生效（它会重新加载 sysctl.conf 文件中的所有配置设置）：


    ```

    # sysctl -p

    ```


    icmp_echo_broadcast_s 设置防止了 ICMP 广播通过不受希望的广播流量影响你的网络。实际上，这已经是过时的攻击（你已经看到现代内核在标准中使用了速率限制），而内核设置仅对
    ping 广播攻击是有用的。


