    ## Chapter 2: Digitally Fingerprint Your Files


    You might be surprised that you''ve almost used for another purpose can be easily
    used as a security assistant.


    Step forward the md5 command. When downloading Unix-type files in the past, you
    have probably been offered the option to check the integrity of your potential
    download by verifying the MD5sums for those files. For example, the MD5sums are
    usually present on the website that you use your Linux ISO file from.


    As you can see in Figure 2.1, this is what you''re faced with when downloading
    Debian Jessie from this mirror: http://ftp.debian.org/debian/dists/jjie/installer-amd64/images/


    FIGURE 2.1

    You can download Debian Jessie from the website and also check your MD5sums for
    security.


    | Filename | Time | Size |

    |---|---|---|

    | MANIFEST | 00 05:29-16 | 1709 |

    | MANIFEST | 00 23 07-05 | 46432 |

    | MD5SUMS | 00 23:07-05 | 5315 |

    | SHA256SUMS | 00 23:07-05 | 72131 |

    | udeb list | 00 23:07-05 | 6537 |


    If you open up the MD5SUMS, then you can see the contents of Figure 2.1, which
    contains hashes for each file.


    ### LISTING 2.1 An abbreviated sample of the MD5SUMS file


    ```

    bf0228f49751bfa8758ea3acafa106f /.hd-media/boot/img.gz

    eeefacaf04b1076443cf8845cacdb1d /.hd-media/gtk/initrd.gz

    19fd4fe4eb5c5eae49441b826db1b371 /.hd-media/gtk/vmlinuz

    4dc2f49eb4b47feeae835527cc79a /.hd-media/initrd.gz

    19fd4fe4eb5c5eae49441b826db1b371 /.hd-media/vmlinuz

    2750ac5f78d08659389d3c16e379f /.netboot/debian-installer/amd64/boot-

    screens/adt.cfg

    aca8744ba5a2716b53260286a40bb /.netboot/debian-installer/amd64/boot-

    screens/exitlog.cfg

    2e883b65f4747ae56ae1b3460e101 /.netboot/debian-installer/amd64/boot-

    screens/f1.txt

    e62b25d4b5cd30f0c44af3db503646 /.netboot/debian-installer/amd64/boot-

    screens/f10.txt

    ```


    Within Listing 2.1, you can see the MD5sum of each file and the relevant filename
    to the right. This is to prevent someone else from sneaking a file into the place
    of a legitimate one, which could infect your clean operating system (OS) installation.


    MD5sums first compute and then check against MD5 digits. You might think (in a
    relatively sophisticated way) that checking MD5sums you are effectively creating
    a digital fingerprint for each file, which can be queried.


    You can easily try using MD5sums yourself (the MD5sum command is bundled within
    the package couretails on my machine and should be readily available to almost
    all distributions). Try a command like this:


    ```

    # md5sum /home/chrisbinnie/debbie-and-ian.pdf

    ```


    The response you receive might be like this:


    ```

    3f19f37d00f83c8ad16775293e73e76 debbie-and-ian.pdf

    ```


    Now back to the files next to your Linux distribution. Download the MD5sums file
    into the same directory as the ISO file (ISO is named after the ISO 9660 file
    system if you''re wondering). By doing so, you can save yourself the trouble of
    manually checking each file on the installation media you are using. That file
    includes MD5sums for the files in that directory. Now that you have the MD5sums
    for all the files, you can check them for validity with the following command
    (-c also stands for --check):


    ```

    # md5sum -c MD5SUMS

    ```


    Listing 2.2 shows the results from running the -c option. You might say that MD5sums
    are binary: results are either OK or not OK.


    ### LISTING 2.2 A sample of the output from checking my MD5sums file using the
    -c option


    ```

    compare.png: OK

    config2.png: OK

    config3.png: OK

    config4.png: OK

    works_1.tar: OK

    package_inst.jpg: OK

    ```


    What should you look out for if a file didn''t match its original MD5sum? In Listing
    2.3 you can see that an alarm bell is ringing (with a-warning).


    ### LISTING 2.3 An alarm bell is ringing


    ```

    test.sh: FAILED

    bootstrap: FAILED

    hash.png: FAILED

    ```


    What should you look out for if a file didn''t match its original MD5sum? In Listing
    2.3 you can see that an alarm bell is ringing (with a-warning).


