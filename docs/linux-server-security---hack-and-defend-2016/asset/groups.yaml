    # Saving iptables Rules


    To ensure that your iptables rules survive a reboot, you should install a package

    iptables-persistent on Debian derivatives, as follows:


    ```

    # apt-get install iptables-persistent

    ```


    You then save your rules with a command like this one:


    ```

    # /etc/init.d/iptables-persistent save

    ```


    Or, you can revert the saved config by running this command:


    ```

    # /etc/init.d/iptables-persistent reload

    ```


    On Red Hat derivatives (on presystem machines), you can use this command:


    ```

    # /sbin/service iptables save

    ```


    And to restore rules, you run this command:


    ```

    # /sbin/service iptables reload

    ```'
