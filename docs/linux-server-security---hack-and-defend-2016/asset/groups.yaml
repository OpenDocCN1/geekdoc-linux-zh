    # Echo Mode


    Among the sophisticated features included with Nping is Echo mode. This mode is
    designed to show in detail what happens to packets as they traverse a network.
    By enabling Echo mode on two hosts, you can set a server-and-client relationship
    to monitor exactly what takes place on the wire.


    Let''s look at this feature. The server component captures packets and then forwards
    details back to the client via a TCP communication "channel". It''s the client''s
    job to generate the aforementioned packets in the first place.


    This technique is a great way to spot any packet-mangling should it occur. And,
    for, example, if Network Address Translation (NAT) becomes involved, a number
    of details are also changed. By using this technique if a device on the wire changes
    any other TCP options or if traffic shaping packets, for example, then these difficult-to-diagnose
    details become apparent. You might also be able to determine if transit packets
    become mysteriously blocked, which will assist in diagnosing issues.


    Let''s try a little experiment using Echo mode. Incidentally, you can add -vvv
    for verbosity if you want more output and a higher level of detail from Nping.
    To get started, you need to be the root user to spawn the server side of the connection.
    You will use the password "please_connect" and add verb to the output received
    over your eth0 interface with the following command:


    ```

    # nping -e eth0 -vvv --echo-server "please_connect"

    ```


    The results of this command are as follows:


    Starting Nping 0.5.51 ( http://nmap.org/nping ) at 2016-11-16 11:16 GMT

    Packet capture will be performed using network interface eth0.'
