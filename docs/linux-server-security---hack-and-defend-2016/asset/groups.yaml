    servers can sometimes be limited for access due to a maximum number of clients
    or a minimum poll interval and are occasionally available to certain types of
    organizations, such as academic institutions.


    Another NTP security component is that the client software is written in a way
    to adhere to the instructions that are generated by servers that they request
    the time from. If a recipient server prefers to, then it can simply block a request.
    In a similar routing and firewall techniques, these packets are discarded or black-holed
    without intervention. In other words, the recipient server of these unwanted packets
    doesn''t take on extra system load and simply drops the traffic that it doesn''t
    think it serve as a response.


    However, a response isn''t always helpful, and it''s better to politely ask the
    client to cease and desist, rather than ignore the requests unilaterally. For
    this reason, there''s a specific type of packet called the Kiss-o-Death (KoD)
    packet. If a client is sent an unwelcome KoD packet, it will remember that server
    with an access-denied marker and look elsewhere for its timeouts, or at least
    for a predefined period of time within rate-limiting thresholds.


    There are other good reasons to protect the overall security of NTP. In addition
    to the demands on IP addressing and the impact on bank balances from bandwidth
    usage, you also need to include the Internet''s NTP infrastructure on the list
    of services that are about to be affected by the potentially explosive, exponential
    growth of the Internet of Things (IoT). By all accounts, billions of devices will
    soon need to synchronize, and so will your refrigerator or other things.


