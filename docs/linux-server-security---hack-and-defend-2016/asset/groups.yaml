    ## 第一章


    ## 隐身衣


    想象一下，你可以从互联网上隐藏一个服务器，但仍然可以使用你互联网服务提供商（ISP）的高速带宽。在不进行任何更改的情况下，你就可以安全地将其作为文件仓库或其他许多用途。


    你还可以将其安全地用于许多事情。在不进行任何更改的情况下，你就可以通过命令行来启动或停止任何你想要的服务。你的选择是简短运行这些服务然后关闭它们，还是让它们对外部世界运行一段时间。


    这可以通过“端口敲门”（port knocking）技术来实现。你可以通过关闭所有网络端口来伪装你的服务器，使其变得隐形。这种单个端口的“端口敲门”可以用于
    SSH 服务或其他服务。在本章中，你将看到如何通过某些选项创建一个隐形服务器。


    ## 背景


    通过隐藏服务器在互联网上的存在，在最好你可以让它私密运行；最坏的情况下，如果它的存在已知，你可以通过限制开放端口来减少攻击面。


    ## 探测端口


    在开始之前，让我们仔细看看服务器上的网络端口。如果你用过像 Nmap 这样的安全工具，可能已经熟悉当端口显示为关闭（closed）时，实际上它们并没有运行的原理。Nmap
    区分了端口是否有后台守护进程（daemon）在监听。如果 Nmap 指向的端口没有后台守护进程但显示为开放（open），则意味着防火墙阻止了访问。Nmap
    报告的这些状态包括：未过滤（unfiltered）、已过滤（filtered）和关闭（closed）。关于这些状态的更多信息，请访问 https://nmap.org/port-scanning-basics。


    ## 第一章：隐身衣


    ## 混淆端口扫描器


    现在你已经知道了端口是如何呈现扫描器的，让我们来看看如何混淆返回的响应以迷惑复杂的端口扫描技术。最明显的工具选择是基于内核的防火墙 Netfilter，通常被称为
    iptables。其工作原理如下：对于 TCP 数据包，你想要使用 iptables 来操纵对端口探测的响应，以生成 REJECT 请求。对于其他协议，你想要丢弃数据包。这种方式，当你收到
    Nmap 的已过滤（filtered）响应时，根据我从大多数网上收集到的信息（这个论点是有争议的且可以改变），关闭（closed）端口是你可以希望的最佳响应。这是因为你并没有通过防火墙拦截任何端口，或者端口仅仅是因为后台运行着守护进程而开放。


    进一步解释一下，正常情况下，无法到达的端口会生成 ICMP 端口不可达（Port Unreachable）响应。你不希望生成这些错误，因为那意味着服务器在那个端口上监听，并且会暴露你服务器的响应。你想要生成的调整后的
    REJECT 响应如下：--reject-with tcp-reset。这有助于在端口未被且关闭时做出响应。你只需将此片段添加到每个 iptables 规则的末尾：


    ```

    -j REJECT --reject-with tcp-reset

    ```


    通过这种技术，你可以确保不会泄露关于系统的不必要信息。在选项中，你没有泄露关于系统的不必要信息。这是因为你并没有通过防火墙拦截任何端口。


    ## 安装


    在 Debian 衍生系统中，你这样安装：


    ```

    apt-get install knockd

    ```


    在 Red Hat 衍生系统中，你通过这样安装：


    ```

    yum install knockd

    ```


    安装 knockd 后，如果你想获得有关该包的更多背景信息，Debian Jessie 有一个简短的 README 文件，可以在 /usr/share/doc/knockd/README
    找到。这个非常有用的 README 文件讨论了 knockd 如何工作等内容。它使用了一个名为 libcap 的库，其他几个包也使用了它，如 tcpdump、ngrep
    和 iftop（捕捉数据包进行检查）。得于其巧妙的设计，knockd 甚至不需要绑定到它正在巧妙监听的端口，即可监控原始流量。


    ## 修改文件系统位置


    连接、断开或错误等事件会直接记录在系统的 syslog 中，并可能写入 /var/log/messages 或 /var/log/syslog 文件。如果你不希望这些信息被埋在其他系统日志活动中，或者不想费力解析笨肿的日志文件，你可以创建自己的自定义日志文件。我倾向于这样做，这样调试会清晰得多，我可能会使用自动化工具或自定义
    shell 每天给自己发邮件，以便监控可疑事件。因为我将所有的 knockd 实例放在一个地方，信息对于脚本和其他工具来说更容易解析。


    ```

    [options]

    LogFile = /var/log/portknocking.log

    ```


    更改日志文件的位置是一个常见的解决方案，但你也可以更改 knockd 服务启动时写入进程 ID（PID）文件的位置。你可以在配置文件的 [options]
    部分更改位置，如下：


    ```

    [options]

    PidFile = /var/tmp/run/file

    ```


    '
