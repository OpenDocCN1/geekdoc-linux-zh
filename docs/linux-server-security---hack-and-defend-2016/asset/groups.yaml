    ## Chapter 4: Denying Service


    A very welcome NTP server template, among others, that you can use to help your
    public-facing server to avoid being part of these attacks is available at www.team-cymru.org/templates.html.
    If you visit page and click the Secure NTP Template link, you''re presented with
    a collection of templates for various platforms: Cisco IOS, Juniper Nino, and
    Unix.


    Also included is a useful reminder of how to configure IPTables to lock down NTP,
    as follows:


    ```

    # iptables -A INPUT -s 0 -d 0 -p udp --source-port 123 -m state --state ESTABLISHED
    -j ACCEPT

    # iptables -A OUTPUT -s 0 -d 0 -p udp --destination-port 123:123 -m state --state
    NEW, ESTABLISHED -j ACCEPT

    ```


    In addition, there is an interesting note about the potentially damaging implications
    if you panic and decide to prevent NTP traffic into your network by blocking it
    at the router level. You should only filter UDP port 123 for NTP traffic if you
    know exactly what you are doing, otherwise, key services will inevitably fail.


    ## Attack Reporting


    When the first NTP attack took place, cloud service provider, CloudFlare, announced
    the largest DDoS attack ever recorded of its kind. According to CloudFlare, the
    attack was a short of 400 Gbps of traffic and alone nearly 4,529 servers were
    required to generate that much bandwidth-saturating traffic across 1,298 different
    networks. In contrast, a widely published attack that hit Spamhaus (the antispam
    service provider) reportedly used 39,056 open DNS resolvers to generate 300 Gb
    DDoS. As you can see, there''s a significant difference in impact on a per-machine
    basis.


    Another protocol that is used increasingly in DDoS attacks was created in 1988
    by PSINET, which was one of the world''s ISPs (if not the largest) before becoming
    subsumed by various mergers and acquisitions.


    The Simple Network Management Protocol (SNMP) is used on the vast majority of
    working devices, such as switches and routers. This useful protocol helps feed
    statistical information, such as bandwidth use, to any software capable of receiving
    it. Most important, enabled by is an attack vector on a community string named
    "public". Even if passwords are configured by default, they tend to be simple,
    as "private". This means that your broadband router poses a potential risk and
    could participate in a DDoS attack. Also consider SNMP-enabled devices belonging
    to enterprises or ISPs; there might be dozens of powerful switches and routers
    on a single network segment with access to high-capacity bandwidth. As an aside,
    even printers in offices commonly employ SNMP implementations along with workstations
    and IP video cameras.


    Attackers have been witnessed experimenting with SNMP for sizeable reflection/amplification
    attacks. The alarming traffic ratios are reportedly as much as 1700:1. How accurate
    that estimate remains to be seen of, and whether a degree of scaremongering is
    present.


    In May 2014, Akamai''s DDoS division reported that they had spotted 14 SNMP attacks.
    With under half were in the U.S., and around 18 percent in China.


    ## Preventing SNMP Reflection


    Following a quick check of your /etc/services file, you can see the following
    details for the default ports used by SNMP:


    ```

    snmp                161/tcp                # Simple Net Mgmt Proto

    snmp                161/udp                # Simple Net Mgmt Proto

    snptrap             162/tcp                # SNMPTRAP

    snmptrap            162/udp                snmp-trap # Traps for SNMP

    ```


    To prevent the reflection of SNMP traffic originating from your network, you can
    follow a deny-by-default practice, making sure that your perimeter firewalls do
    not let any of this traffic out of your LAN and onto the Internet. Of course,
    this also applies to traffic coming into your LAN. Often, default settings are
    left unchanged when equipment is set up in a hurry, upgraded or configured by
    unskilled personnel, resulting in preventative measures being missed. What is
    most worrying about an attack that is, thanks to the sheer number of broadband
    routers around the planet, it can take a long to manually patch some of them (although
    residential ISPs can add ingress and egress filters to their networks). While,
    large sections of infrastructure can start to suffer from performance issues.


    The SNMP attack as described by Akamai was attributed to a specifically crafted
    attack tool. The tool used "GetBulk" and spoofed the IP address, in the same way
    as NTP and DNS reflection attacks, in order to make sure the victim''s IP address
    received the barrages of responses sent reply to the spurious requests. Frankly,
    this particular attack only applies to an older version of SNMP, version 2. Version
    3 offers greater security and does not open itself up to as much abuse by default.


    Worringly, the key design of this attack was to generate significant amounts of
    traffic by only a few requests and possibly even from a single machine. Criminals
    can disrupt large sections of online infrastructure without needing to invest
    time and resources (and-times money to meet the purchase price of of botnet).


