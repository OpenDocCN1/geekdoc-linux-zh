    \ nc：\n\n```bash\n# yum install netcat\n```\n\n对于 Nmap 项目的 ncat，你可能尝试此包：\n\n```bash\n\
    # yum install nmap-ncat\n```\n\n我怀疑安装一个包然后确保你阅读的是该包正确的页面（以防同一台机器上安装了两个版本的 netcat）将证明是成功的。\n\
    \n### 表 3.1 Debian 和 Ubuntu 包名\n\n| 包名 | 描述 |\n| --- | --- |\n| netcat | 一个用于兼容的“虚拟”包，可以安全地删除\
    \ |\n| netcat-openbsd | 支持 IPv6、代理和套接字的 OpenBSD 版本 |\n| netcat-traditional | 原始包，缺少\
    \ netcat-openbsd 中包含的许多功能 |\n| netcat-ipv6 | 原始 netcat 的重写，具有 IPv6 支持并增强了对 UDP\
    \ 的支持 |\n| nmap | 如果你想在 Debian/Ubuntu 上使用 ncat，则需要此包。 |\n\n为了避免混淆，我将关注 ncat（nc\
    \ 命令）而不是 netcat（nc 命令）。从现在起，我将交替使用 ncat 和 netcat——当然，在需要清晰时使用 ncat。\n\n## 入门\n\
    \n让我们看看 21 世纪的 netcat 替代品（我指的是 ncat）能为你做什么，从一些基础知识开始。它包含了强大的功能，可以通过命令行操纵网络数据（数据的读取和写入）。它非常可靠，并且同时适用于\
    \ TCP 和 UDP（它也适用于 IPv6）。它可以在 SSL（安全套接字层）连接方面完成令人印象深刻的事情，并能与代理良好配合——包括 SOCKS4 和\
    \ HTTP 类型。\n\n考虑到其中涉及的优秀编程实践，ncat 的质量也非常高。文档特别指出，它不仅使用了完全重写的代码（没有借用原始版本），还采用了\
    \ Nmap 经过实战检验的库。有了 HTTP，我将开始使用 netcat 作为 Web 浏览器。如果你输入此命令，加上你想要访问的任意网站，你就能连接到\
    \ TCP 80 端口：\n\n```bash\n# ncat -C www.google.com 80\n```\n\n一旦你输入此命令并按下回车键，你就需要输入以下内容，然后按两次回车：\n\
    \n```http\nGET / \n```\n\n请注意，如果你动作不够快，命令将超时，你必须重试。如果你以前在命令行中查询过 HTML，你可能会对执行后在屏幕上滚动的过量信息感到惊讶。如果你感兴趣，`-C`\
    \ 选项会加入回车和换行符（CRLF），以便与某些网络协议兼容。\n\n你也可以将 netcat 用作监听的守护进程。入侵服务器有许多方法，而保持访问开放的一种方法是让\
    \ netcat 监听在一个一个系统管理员可能没有察觉的冷门端口。你稍后会考虑这一点，但现在先关注 HTTP。netcat 文档提供了一个极佳的示例，说明了如何将你简单的\
    \ netcat 二进制文件变成基础 Web 服务器。首先，你将创建一个简单文件。你不会使用 `.html` 扩展名，因为你的文件不是纯 HTML；相反，它将是\
    \ HTTP 会话的一半。你将用列表 3.1 所示的内容命名你的 index.http。\n\n### 列表 3.1 保存在文件中的 HTTP 会话的一半\n\
    \n```http\nHTTP/1.0 200 OK\n\n<HTML>\n<BODY>\nNothing to see here, move along.\n\
    </BODY>\n</HTML>\n```\n\n如列表 3.1 所示，运行此命令后，你将看到 netcat 监听 HTML 内容。接下来，netcat 会显示客户端的请求：\n\
    \n```bash\n# ncat -C 127.0.0.1 80 < index.http\n```\n\n"
