    # Chapter 2: Digitally Fingerprint Your Files


    Within Listing 2.1, you can see the MD5sum of each file and the relevant filename
    to the right. This is to prevent someone else from sneaking a file into the place
    of a legitimate one, which could infect your clean operating system (OS) installation.


    MD5sums first compute and then check against MD5 digits. You might think (in a
    relatively sophisticated way) that checking MD5sums you are effectively creating
    a digital fingerprint for each file, which can be queried.


    You can easily try using MD5sums yourself (the MD5sum command is bundled within
    the package couretails on my machine and should be readily available to almost
    all distributions). Try a command like this:


    ```

    # md5sum /home/chrisbinnie/debbie-and-ian.pdf

    ```


    The response you receive might be like this:


    ```

    3f19f37d00f83c8ad16775293e73e76 debbie-and-ian.pdf

    ```


    Now back to the files next to your Linux distribution. Download the MD5sums file
    into the same directory as the ISO file (ISO is named after the ISO 9660 file
    system if you''re wondering). By doing so, you can save yourself the trouble of
    manually checking each file on the installation media you are using. That file
    includes MD5sums for the files in that directory. Now that you have the MD5sums
    for all the files, you can check them for validity with the following command
    (-c also stands for --check):


    ```

    # md5sum -c MD5SUMS

    ```


    Listing 2.2 shows the results from running the -c option. You might say that MD5sums
    are binary: results are either OK or not OK.


    # LISTING 2.2 A sample of the output from checking my MD5sums file using the -c
    option


    ```

    compare.png: OK

    config2.png: OK

    config3.png: OK

    config4.png: OK

    works_1.tar: OK

    package_inst.jpg: OK

    ```


    What should you look out for if a file didn''t match its original MD5sum? In Listing
    2.3 you can see that an alarm bell is ringing (with a FAILED warning) and you
    are also informed of a problem at the end of the results.'
  - '[PAGE 29]


    # Chapter 2: Digitally Fingerprint Your Files


    # LISTING 2.3 An MD5sum does NOT match and shows as “FAILED”


    ```

    test.sh: FAILED

    bootstrap_AWS.pp: OK

    hiatus.png: OK

    mdsum: WARNING: 1 of 111 computed checksums did NOT match

    ```


    It should without saying that, without making these checks when you''re installing
    your OS from a downloaded ISO or from a magazine''s DVD, you are gambling with
    the integrity of your files and further risking your system''s integrity.


    Now that you''ve been reminded of how you can check if there''s any tampering
    with your freshly downloaded files, let''s look at how to use the powers of cryptographic
    hashes to help you tell if an installed system has been compromised.


    # Whole Filesystem


    Once you''re happy with your OS installation and have run through the requisite
    postinstall fine-tuning, you should consider recording the MD5sums of your key
    system files. You do this in order to have a reliable record to compare against
    a suspected compromise.


    Of course, this with the md5sum command isn''t going to be very easy without writing
    a shell script; this is difficult to get full directory trees of files working
    with the md5sum command.


    Fear not, someone has addressed this problem with an efficient piece of software-called
    md5deep (http://md5deep.sourceforge.net). According to its website, in addition
    to the functionality you can expect from MD5sum, you can also enjoy the following:


    You can


    +   - Ignore certain file types (which is very useful when you want to ignore
    temporary files and so on).

    - If you''re installing a massive number of files (which would be on a fresh OS),
    md5deep offers a very helpful ETD (Estimated Time of Delivery)—in other words,
    how long a command will take to complete.

    - You can run md5deep in recursive to effortlessly pick up the numerous hidden
    subdirectories on your filesystem, which would otherwise be arduous (if not impossible
    to accurately) to record manually.

    - With compatibility in mind, you also import different types of hashes (for example,
    from EnCase, the National Software Reference Library, ILook Investigator, and
    HashKeeper).'
