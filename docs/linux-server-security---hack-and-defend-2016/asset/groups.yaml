    | 5 | Redirect |

    | 8 | Echo Request |

    | B | Time Exceeded * |

    | C | Parameter Problem * |

    | D | Time stamp Request |

    | E | Time stamp Reply |

    | F | Info Request |

    | G | Info Reply |

