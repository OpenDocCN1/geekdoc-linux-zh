    # iptables - INPUT -p icmp -m limit --limit 30/minute --limit-burst 60 -j ACCEPT

    # iptables - INPUT -p icmp -m limit --limit 6/minute --limit-burst 10 -j LOG

    # iptables - INPUT -p icmp -j DROP

    ```


    From the config shown on the first line, the --limit-burst option allows up to
    60 packets to arrive initially before the rate limit of one packet every second
    is enabled (the 30/minute value). The second line says that you will log (though
    much more strictly) how much traffic is accepted before being logged to syslog:
    six entries per minute after a burst of ten packets. Finally, you''ll discard
    those packets in order to mitigate any effect.


    If I''m reading the documentation correctly, the --limit-burst value refers back
    to the specified period used by --limit. When that limit is not reached, --limit-burst
    benefits by an increment — in other words, by the value of one — every time the
    limit isn''t reached, up to the number configured.


    # Summary


    Some of the changes you have explored can be damaging to both systems and networks.
    You should know what you''re doing (and ideally, experiment on a test machine)
    before trying any of these settings in production. As mentioned, the classic mistake
    of becoming panicked by the bad reputation that ICMP has and simply banning all
    mentions of the protocol on your network is ill-advised.


    You have looked at attacks and how to prevent them from affecting the normal operations
    of your network and servers. You also looked at rate-limiting inbound ICMP traffic.


    In addition, you looked at the logging of pings and traceroutes to pick up any
    recce with nefarious intent on your server, and more importantly, how to safely
    log all unwanted probes to a file so that an attack won''t fill your disks with
    sizable log files.


    It''s safe to say that some of this knowledge may only be needed rarely, but the
    next time someone mentions that they''re blocking ICMP traffic on their server,
    you can give them a knowing look and say that you''re confident that ICMP issues
    will no longer cause you problems.


    # Nmap’s Prodigious NSE


    Even nice sysadmins have probably heard of run port scans against local and remote
    hosts. They may also have heard of one famous port scanner on the market, created
    by the Nmap Project, named Nmap stands for “Network Mapper,” and along with superfast,
    sophisticated, and efficient, it’s brimming with features.


    Among its many features, you can test for operating system a remote server is
    running, audit the security of both local and remote machines, and create an inventory
    of the machines and their active services on a network.


    You may have used Nmap for scanning in the past, but there’s a good chance that
    you didn’t realize what a powerful penetration testing tool it is. This is partly
    thanks to its sophisticated built-in scripting engine. Before you look at it,
    however, you will first review Nmap’s basic port scanning functionality. Then
    you will learn how Nmap can be used for more advanced white hat activities.


    # Basic Port Scanning


    Even the basic (port scanning) features bundled with Nmap include advanced options
    such as figuring your source IP address (using the -S option). A magnificent selection
    of features is available. But first, let’s start with installing the package.


    To install Nmap on Red Hat distributions, you can use the following command:


    ```

    # yum install nmap

    ```


    On Debian and its derivatives, you can use the following command:


    ```

    # apt-get install nmap

    ```


    If you want to use RPM Package Managers on Red Hat derivatives rather than running
    these commands, you can find more information at https://nmap.org/book/book-linux.html.


    If you are familiar with the file /etc/services on Unix-type machines, then the
    inclusion of /usr/share/nmap/map-services file should make sense. Be aware that
    your file’s location may change slightly. Within this file, you need numbers to
    handle readable service names — a little like localized DNS, I suppose the /etc/hosts
    file where there’s a key:value format). One in the Nmap version of this file would
    look like this:


    | Service name | Protocol | Open-frequency | Optional comments |

    |---|---|---|---|

    | ftp | | 21/tcp | # File |

    | Transfer | [Control] | | |


