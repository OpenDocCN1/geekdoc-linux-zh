    # Well Designed


    The Rootkit Hunter developers describe it as a “host-based, passive, post-incident,
    path-based tool.\ If you’re wondering, the “passive” reference means that you
    need to schedule the software or run it manually. The “path-based” description
    means it just deals with files and does not operate heurically like a virus checker
    might.


    There is a section at the bottom of the documentation included with rkhunter that
    I enjoyed reading. It is a well-written primer for anyone who is new to online
    security or experienced users who just need a refresher.'
