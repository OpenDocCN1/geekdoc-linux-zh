    # 第 10 章：SQL 注入攻击


    由于在服务器端脚本编写上不够严谨，他们沦陷了钓鱼攻击。从 2000 年代中期开始，在短短几年内，美国联邦调查局（FBI）曾多次与我们联系，一次是一家银行，另一次是一家白帽安全服务，告知我们某个客户服务器被黑入。因此，即使在这样一个小组织中，一个热门拍卖网站的虚假副本和两个网站也被克隆，并在极短时间内对我们的网络发起了钓鱼攻击。显然，SQLi
    攻击正在那些心怀不轨的人员之间流行。


    针对这种常见的安全威胁，系统管理员和开发者注意到了这一点并开始加固代码。我记得在那段时间，我在一个基于 PHP 的网站上对每个用户输入组件谨慎地进行特殊字符转义，以避免
    SQLi 攻击。


    ## 基础 SQLi


    正如我之前提到的，SQLi 的核心原理是从数据库中非法地检索代码或向数据库中注入代码。


    为了避免这些问题，你不能再通过服务器端语言向外部暴露查询，这可能会导致你的网站不再流畅且无用。如果无法做到，你可以确保攻击向量被覆盖。实现这一点的最简单方法是过滤从访问者那里接收的所有输入。换句话说，在你网站上用户可以输入数据的每一个点，都需要在代码中采取相应的预防措施。在数据发送到数据库之前，将输入解析为易于处理的格式。


    关于如何保护代码的完整教程可以留到另一天再说。不过，我将使用一种流行的编程语言为你进行快速复习。在此之前，我会提醒你一些关于 SQLi 如何运作的简单示例。


    正如我所说，仅仅篡改网站远不是拦截的 SQL 可能造成的唯一损害。考虑下面这个 SQLi 语句例如：


    ```sql

    sql-server> DROP TABLE special-offers;

    ```


    通过了解这些名称，你还没有提到从数据库中提取用户名和密码。由于有犯罪意图，成功的 SQLi 攻击无疑是值得追求的奖品。许多大型品牌已陷于防守不严的代码和 SQLi。反复出现的雅虎、Adobe、LinkedIn
    和 Sony Music 可能都将列在受害者的长长名单中。当然，作为攻击者之一，或者作为必须恢复受此类攻击影响的节点的工作人员，我只能推测这些攻击涉及 SQLi
    的种程度。SQLi 耻辱柱可以在 http://codecurdmgeon.com/wp/sql-injection-hall-of-shame/ 找到。虽然列表可能不完全准确，但我确定你会同意这是一篇引人入胜的读。


    刚才我提到了一种编程语言。我将使用世界上最流行的服务器端脚本语言 PHP 的报告作为示例，快速演示 SQL 是如何工作的。强大的 PHP 不仅被直接用于数百万个网站，还用于世界上最流行的内容管理系统（CMS）WordPress
    (https://wordpress.com) 以及许多其他动态网站应用程序，如 Joomla!(https://www.joomla.org)。简而言之，PHP
    遍布网络，如果被发现，它就是攻击者的易受目标。


    让我们看另一个例子，PHP 中的这段代码：


    ```php

    $input = $variable[3];

    $query = "SELECT id, item, price FROM specialoffers ORDER BY id LIMIT 15 OFFSET
    " . $input;

    ```


    观察第一行，你可以看到你没有过滤名为 `$input` 的变量。这意味着该变量在 SQL 语句的某行中使用，它可能包含攻击者想要使用的任何代码。随着经过构造的注入被注入，会引起各种混乱。


    另一个例子是更新管理员的密码。例如，一个正常的 SQL 语句 PHP 代码可能像这样：


    ```php

    $query = "UPDATE credentials SET passwd=''$password'' WHERE userid=''$id'';";

    ```


    通过向此语句附加 SQL，例如像 `''sysop%''` 这样的用户，你的 SQL 变得非常不严格，让数据库搜索类似于 `sysop` 的其他用户名，然后更新它们的密码。


    遗憾的是，还可能在 SQL 中包含执行 shell 命令。


    ## 在 PHP 中缓解 SQLi


    正如我所说，这个主题太大，无法详细介绍，但我将简要介绍如何过滤输入来缓解 SQLi 攻击。多种 PHP 函数可以帮助你完成这一任务。在写作期间，PHP 从
    5.6 版本重大移动到了 7.0。旧版本（到 5.3）中，你的主配置文件（php.ini）可以通过魔法引号（magic quotes）过滤所有输入。这显然被废弃了因为它过度依赖它。


    为了保护第一个示例中的变量，你可能想通过 `addslashes` 运行用户输入。示例如下：


    ```php

    $input = addslashes($variable);

    ```


    使用 mysqli，它可能像这样：


    ```php

    $input = mysqli_real_escape_string($variable);

    ```


    为了防止不受欢迎的输入，还有 `trim` 用于从变量中移除空格，与 `strip_tags` 以相同的方式用于 HTML 和其他标记。这些都可以链在一起，例如：


    ```php

    $input = strip_tags(trim($input));

    ```


    除了 PHP 5.5.0 版本，你可以使用 `mysql_real_escape_string` 函数来清理你的字符串：


    ```php

    $input = mysql_real_escape_string($input);

    ```


    然而，从 7.0.0 开始，几乎总是想要使用 mysqli 驱动（改进后的 MySQL）来对抗 SQLi。益于此增强，你可以使用更高级的方法剥离执行代码中不必要的且危险的字符。使用
    mysqli 的示例与之前的不同：


    ```php

    $input = mysqli_real_escape_string($input);

    ```


    使用 mysqli 通过以下方法连接到数据库：


    ```php

    $mysqli = new mysqli("localhost", "userid", "DB_Name");

    ```


    缓解 SQL 攻击的另一种方法是使用预处理语句（prepared statements）。这种安全添加背后的思想是数据库引擎完全处理任何使用的参数。在这种理论下，攻击者无法向他们创建的查询注入代码。示例如下：


    ```php

    $input = $mysqli->prepare("INSERT INTO table_name (column_name) VALUES (?)");

    $input->bind_param("s", $actual_user_input);

    $input->execute();

    $input->close();

    ```


    额外的帮助是这种函数只需要读取一次，所以如果在几个页面上使用多次，PHP 引擎的工作就更少。


    另一种方法自 PHP 早期版本起可用并使用 PHP Data Objects (PDO)。这里有一个好的讨论：https://stackoverflow.com/questions/60174/how-can-i-prevent-sql-injection-in-php。


    哪种方法最好，但 PDO 看起来非常流行。PDO 的示例看起来如下：


    ```php

    $input = $pdo->prepare(''SELECT * FROM special_offers_table WHERE offerer = :name'');

    $input->execute(array(''name'' => $variable));

    ```


    关于 PDO 有很好的信息位于 http://whatever.com/blog/2014/08/28/the-heart-of-darkness/。值得一读，仅仅是为了帮助你在
    PHP 后期版本（7.0.0 及以后）中选择方法来对抗 SQLi 注入。


    ## 利用 SQL 漏洞


    现在你已经查看了几种防御 SQLi 的方法，你将学习黑客可能如何攻击你的在线服务。有很多可用工具，我将关注 sqlmap (http://sqlmap.org)，它是黑客、法医科学家和渗透测试人员中一种流行的开源工具。使用这种复杂的工具可能会造成混乱，因此请确保你完全意识到在自己的服务器上测试它时可能造成的损害，更不用说属于别人的服务器了。我绝对建议使用开发服务器或沙箱虚拟机以确保安全。


    sqlmap 广泛的能力让大多数反对者担心。根据其网站，sqlmap 支持以下数据库服务器：MySQL, Oracle, PostgreSQL, SQL Server,
    Microsoft Access, IBM DB2, Firebird, Sybase, SAP DBD 和 HQDB。


    让我们看看如何安装 sqlmap。它包含在 Kali Linux 等某些安全发行版中，但如果它不在你的包管理器仓库，还有其他的安装方法。


    你可以使用 Git 命令使用 GitHub 上的 sqlmap 仓库：


    ```bash

    $ git clone https://github.com/sqlmapproject/sqlmap.git sqlmap-dev

    ```


    从 https://github.com/sqlmapproject/sqlmap/zipball/master 还有一个 Zip 文件可用。


    ![](img/0de912db8d05f7607e7b5b15fbf73eaa_125_0.png)


