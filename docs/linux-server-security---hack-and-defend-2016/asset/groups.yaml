    # Chapter 5: Nping


    Now that you have some idea of how Nping works and reacts to your input, it should
    come as no surprise that you can use Classless Inter-Domain Routing (CIDR) network
    whenever you want (for example, 10.10.10.0/24). You''ll stick with the basics
    for now and look at how to specify a range of ports to ping, rather than specifying
    them in a list as you''ve just done.


    Consider the "privileged ports" on a Unix-type machine. These ports have been
    given a few names in the past (such superuser ports or raw ports), but in essence,
    only the root user has permission to open them. This was an original security
    feature that meant if you remotely connected to one of these ports you could reasonably
    be assured that the service is running on it. In other words, it was spawned by
    the root user, not a standard user. Here is how to check all of the privileged
    TCP ports with Nping:


    ```

    # nping -cl --tcp -p 0-1024 localhost

    ```


    Using a method that almost certainly differs from other networking tools, Nmap
    deals with multiple hosts and ports in an unusual way. For efficiency, if more
    than one target is specified, Nping won''t simply send a query to the first machine
    in the list and wait for a response. Instead, it employs a simple cyber round-robin
    approach, where machines are contacted alternately in a rotation, so that no delay
    is introduced to the user when waiting for responses. With multiple hosts, this
    also applies with multiple ports to give the target a chance to recover before
    responding to the next port Nping provides.


    # Interpreter


    Nping can act as an interpreter with a number of protocols. If you use the --tcp
    connect option, then you are engaging Nping''s TCP connect mode. Here you don''t
    need to use privileges to fire off what would be raw packets; instead, Nping asks
    the operating system to fully create the connections on your behalf. You can see
    the contents of either inbound or outbound packets in this mode, but you can see
    the status of your transmissions.


    As you would, the --tcp option, when run as the root user, enables you to achieve
    outstanding results with TCP packets. For example, you can attempt to manipulate
    the results of a connection by partially completing a TCP handshake SYN messages.
    The documentation discusses the fact that there''s a real possibility to damage
    (actually, they use the word "evil") with customized TCP RST packets, spoofing
    IP addresses and closing down active TCP sessions, so be warned.


    Here''s manipulating TCP handshakes might look if used as three separate commands:


    ```

    # nping --tcp -p 80 --flags r -cl localhost

    # nping --tcp -p 80 --flags syn -cl localhost

    # nping --tcp -p 80 --flags ack -cl localhost

    ```


    51'
  - '[PAGE 63]


    # Chapter 5: Nping


    # UDP


    You can also opt to employ the User Datagram Protocol (UDP) packets by using the
    --udp option. Normal TCP and UDP packets are embedded inside IP packets, but as
    I''ve said, without root permissions, as long as the default protocol headers
    haven''t been changed, you can''t see the content of the packets, just their transceiving
    status. The same applies to UDP packets.


    A ping can sometimes discover machines where other protocols fail. It''s possible
    that a ping might circumvent a firewall and report back if a device is listening
    behind that firewall. This is a very useful addition to your toolkit. A simple
    example command like this:


    ```

    # nping --udp localhost

    ```


    When I attempt to run this command against my local machine without being the
    root user, I see the following:


    ```

    SENT (0.0069s) UDP packet with 4 bytes to localhost:40125 (127.0.0.1:40125)

    ERR: (0.0070s) READ to 127.0.0.1:40125 failed: Connection refused

    ```


    However, as the superuser, Nping, I can repeat the transaction as:


    ```

    SENT (0.0161s) UDP 127.0.0.1:53 > 127.0.0.1:40125 ttl=64 id=64074 ipl=28

    RCVD (0.0163s) ICMP 127.0.0.1 > 127.0.0.1 Port unreachable (type=3/

    code=3) ttl=64 id=18756 ipl=56

    ```


    As you see, the ping traffic is active at UDP port 40125 in both examples.


    # ICMP


    Just like the standard ping, Nping defaults to using ICMP if executed as the root
    user when no other protocols are selected. The documentation boldly states that
    “[[ajny] kind of ICMP message can be created.” For example, you might query a
    time stamp, generate "destination unreachable" messages, or cause problems for
    another system or network by redirecting packets.


    Try the following command logged in both the root user and a standard user:


    ```

    # nping localhost

    ```'
