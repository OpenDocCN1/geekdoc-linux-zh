    # Configuration


    The main config file for LMD is /usr/local/maldetect/conf.maldetect. It''s well-known
    and is useful for understanding how LMD prefers to set up.


    One word of warning before you continue, however: the LMD config file doesn''t
    use asterisk for wildcard characters, but instead, a question mark. Therefore,
    you should use ? characters of * to replace multiple characters in a config option.
    Other than that minor caveat, it''s relatively smooth sailing.


    # Exclusions


    Let''s look how to set up LMD. The documentation starts by asking you to consider
    the elements of the system that you want to ignore. In the same style as the monitoring
    modes that you just looked at, there are files that you can populate to achieve
    this. Each entry in the following config files should be on its own line


    You can add file paths, which you don''t want to be checked by LMD, to this file:
    /usr/local/maldetect/ignore_paths.


    You can also exclude a particular file extension by putting an entry like .jpg
    in this file: /usr/local/maldetect/ignore_file_ext.


    Certain signatures might lead to unnecessary andhelpful logging entries and alerts
    for one reason or other. You can disable signatures by adding a signature, such
    as php.mailer.10hack, to this file: /usr/local/maldetect/ignore_sigs.


    The last option means that you can use sophisticated regular expressions (regex)
    to match multiple filesystem paths at once. You simply add a list to this file,
    /usr/local/maldetect/ignore_notify, which uses a format like this:


    ```

    ^/home/premium-user-$

    ```


