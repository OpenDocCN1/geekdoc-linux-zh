    # Quarantining and Cleaning


    The documentation makes a point of saying that by default, LMD will not act when
    it finds evil-looking files. It is important to understand that, in most cases,
    you need to quarantine your malware manually.


    If you''re certain that you want to enable automatic quarant, it is possible to
    do by setting the configuration option quar_hits=1 within the main config file,
    which resides at /usr/local/maldetect/conf.maldetect by default.


    If you wanted to quarantine all malware from a specific scan, then you would use
    the -q option, which is also the same as --quarantine SCANID, as follows:


    ```

    # maldet -q 010116-1111.21212

    ```


    If you feel that you''ve made a mistake, you can restore quarantined files from
    a specific SCANID by using the following command, which is the same as the --restore
    function:


    ```

    # maldet -s 010116-1111.21212

    ```


    You will see an error such as this if there''s not to restore:


    ```

    maldet(18748): {restore} could not find a valid hit list to restore.

    ```


    If you want LMD to try to fix malware infections that it discovers, you can use
    the --clean command, which is also written as the -n option. Here is an example
    command of cleaning malware that you found in a particular scan:


    ```

    # maldet -n 010116-1111.21212

    ```


