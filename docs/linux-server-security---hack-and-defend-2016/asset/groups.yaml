    # Chapter 7: Nmap''s Prodigious NSE


    Users who frequently perform network scans, and indeed anyone who is new to security,
    Zenmap should be the tool of choice. Users of all experience levels should find
    the learning curve less steep by using Zenmap first. Figure 7.1 shows what you
    can expect from using the graphical Zenmap on a Desktop machine in Linux.


    # FIGURE 7.1


    An example of Zenmap at work, as found at the Zenmap homepage (https://nmap.org/zenmap/)


