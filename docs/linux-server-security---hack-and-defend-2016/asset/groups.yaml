    malware hits 0, cleaned hits 0, time 11s

    maldet(28566): {scan} scan report saved, to view run: maldet --report

    151212-1724.28566

    ```


    If any of your scans take longer than expected, then LMD can accommodate this
    scenario too. The kill switch or -k option (also written as --kill) will stop
    any notify instance in its tracks. If machine load is too high or you think something
    is not behaving as it should, then this is a useful addition to the Available
    options.


    ### Cron Job


    LMD comes with a daily cron job, which is located at /etc/cron.daily/maldet. This
    will update signatures and clean up scan data so that it''s kept for fourteen
    days, or as a daily scan using the config you have specified.


    Note that session data and temporary files are kept between cron jobs. As a result,
    you need to run the -p option that I mentioned earlier to purge those files if
    your results aren''t accurate.


    You should use the e-mail configuration parameters in order to receive daily reports
    every morning. The daily update is valuable for e-mail archival reasons and for
    making sure that your scans are taking place every day and haven''t failed.


    ### Reporting Malware


    You''ve seen how sophisticated and well constructed LMD is, and it should therefore
    come as no surprise that LMD provides a simple mechanism for uploading suspicious
    files for analysis. If they prove to be of an unknown variety of malware, then
    new signatures may be created and added to LMD''s known threats in order to identify
    malware for other users. The method to send files back to LMD for checking is
    by using the --checkout feature, which is also written as the -c option.


    ```bash

    # maldet -c suspicious_file.gz

    ```


    When you execute this command, the file will be submitted to rfxn.com and checked
    in due course.


    ### Apache Integration


    Earlier in the chapter, I briefly alluded to a clever feature that is included
    with LMD. This feature is the ability to integrate LMD with the Apache mod_security2
    module. The LMD documentation explains that it uses the malleable Apache module''s
    inspectFile functionality to enable you to run a validation script that can determine
    if an upload is to pass or fail. So, for example, inside your Apache config file,
    you might see this entry, taken from the documentation:


    ```apache

    SecRequestBodyAccess On

    SecRule FILES_TMPNAMES "@inspectFile /usr/local/maldetect/hookscan.sh"

    "id:999999, log,auditlog, severity:2,phase:2,t:

    ```


    By design, each upload of a file by a user can be scanned automatically, which
    should significantly reduce the number of threats on a system, especially where
    many users are uploading files frequently.


    The documentation includes details of how performance and accuracy have been in
    the default options. If you''re interested in this feature, then I would encourage
    you to check out the bundled README file for more information.


    ### Summary


    In addition to looking at LMD, I touched upon the innotify mechanism that it uses
    to check for filesystem changes in real time. The clever and efficient notify
    allows real-time checks for malware without significant system load being introduced.


    With Android smartphones currently accounting for over 80% of the global market,
    there is no doubt that real-time checks on devices will become essential. By enabling
    the notify mechanism, you can reduce the risk of malware infection.


    Trying to be a little clever, by contrast, you can see what happens when I enter
    a 16-character password in the example that follows. Incidentally, I''m using
    my computer''s default character set, so here the 10-character-long character
    set example that you just looked at won''t apply.


    ## Chapter 9: Password Cracking


    ### Keyspace


    It''s important to understand the concept of keyspace in cryptography. It loosely
    relates to how much effort a password-cracking tool will have to expend.


    The National Institute of Standards and Technology (NIST) describes keyspace as
    the "total number of possible values that a key can have." A component of keyspace
    is the ''Character Set'' used to make up the key. In other words, you can use
    the available characters on your keyboard. A single character can have a keyspace
    of ten if that character is a single number, ranging from zero to nine.


    You can increase the security of your passwords by increasing the length of the
    passwords and your character sets. So, for example, a password with 16 characters
    that uses a character set sized 10 characters would reportedly have a keyspace
    of 10,000,000,000,000,000, making it much harder to attack than the 10-character
    keyspace from a single character.


    This simple yet sophisticated site uses basic terms and discusses possible combinations
    as opposed to keyspace. If you click the SHOW DETAILS link under the input box,
    after you entered a password, you will see how secure the password is. For example,
    the following output appeared after I entered one-character-length password:


    ```text

    Length 1 characters

    Character Combinations 10

    Calculations Per Second 4 billion

    Possible Combinations 10

    ```


    Now for the part that should cause you concern. The powerful password tool on
    the "How Secure Is My Password" website reports that the cracking time for my
    single-digit password is roughly 0.000000000025 seconds for a standard desktop
    computer. Imagine how fast it might be if you combined the processing capacity
    of many video cards.


    ### History


    John the Ripper and Hashcat are popular tools for cracking. Hashcat arrived on
    the scene in 2009, and since then, it has used Graphics Processing Units (GPU)
    to speed up the process.


    This helpful website might encourage you to increase your password security: https://howsecureismympassword.net.

