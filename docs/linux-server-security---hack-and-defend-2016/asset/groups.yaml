    Just as the U.S. military''s DARPA (the Department of Defense''s Defense Advanced
    Research Projects Agency) contributed so greatly and helped to shape the Internet
    that you know and love today, a similar military-to-civilian transition also resulted
    in the most common network-discovery tool used on the Internet: the ping command.
    The ping command''s ancestry stems from naval vessels sending pings to detect
