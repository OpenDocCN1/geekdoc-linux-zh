    need to use privileges to fire off what would be raw packets; instead, Nping asks
    the operating system to fully create the connections on your behalf. You can see
    the contents of either inbound or outbound packets in this mode, but you can see
    the status of your transmissions without the contents of either inbound or outbound
    packets.


    As you would, the --tcp option, when run as the root user, enables you to achieve
    outstanding results with TCP packets. For example, you can attempt to manipulate
    the results of a connection by partially completing a TCP handshake. The documentation
    discusses the fact that there''s a real possibility (actually, use the word "evil")
    to spoof IP addresses and close active TCP sessions. Here''s how manipulating
    TCP handshakes might look if used as three separate commands:


    ```

    # nping -c1 --tcp -p 80 --flags RST localhost

    # nping -c1 --tcp -p 80 --flags syn localhost

    # nping -c1 --tcp -p 80 --flags ack localhost

    ```


    ## UDP


    You can also opt to employ User Datagram Protocol (UDP) packets by using the --udp
    option. Normal UDP packets are embedded inside IP packets, but as I''ve said,
    without root permissions, as long as the default headers haven''t changed, you
    can see the content of the packets. The same applies to UDP. ping can sometimes
    discover machines where other protocols fail. It''s possible that ping might circumvent
    a firewall and report back if a device is listening behind that. This is a very
    useful addition to your toolkit. A simple example like this:


    ```

    # nping --udp localhost

    ```


    When I attempt to run this command against my local machine without the root user,
    I see the following:


    ```

    SENT (0.0069s) UDP packet with 4 bytes to localhost:127.0.0.1:40

    ERR: (0.0070s) to 127.0.0.1: Connection refused

    ```


    However, as the superuser, Nping, I can repeat the transaction as:


    ```

    SENT (0.0161s) UDP 127.0.0.1:53 > 127.0.0.1:40 ttl=64 id=6474 ipl=28

    RCVD (0.0163s) ICMP 127.0.0.1 > 127.0.0.1 Port unreachable (type=3/code=3) ttl=64
    id=18756 ipl=56

    ```


    As you see, the ping traffic is active at UDP in both examples.


    ## ICMP


    Just like the standard ping, Nping defaults to using ICMP if executed as the root
    user when no other protocols are selected. The documentation boldly states that
    any ICMP message can be created. For example, you might query a timestamp, generate
    "destination unreachable" messages, or cause problems for another system or network
    by redirecting packets. Try the following command in both the root user and a
    standard user:


    ```

    # nping localhost

    ```


    You can clearly see the difference in detail. Here is the standard user, without
    root:


    ```

    SENT (0.0027s) Starting TCP Handshake > localhost:80 (127.0.0.1:80)

    RECV (0.0028s) Handshake with localhost:80 (127.0.0.1:80) completed

    ```


    In the next example, as the root user, you can see that you get more information
    about what was in the ICMP packet. The type=8 for "Echo" according to RFC (https://tools.ietf.org/html/rfc792),
    which is what you''d expect.


    ```

    SENT (0.0152s) ICMP 127.0.0.1 > 127.0.0.1 Echo request (type=8/code=0) ttl=64
    id=31032 ipl=28

    RECV (0.0154s) ICMP 127.0.0.1 > 127.0.0.1 Echo reply (type=0/code=0) ttl=64 id=18763
    ipl=28

    ```


    ## ARP


    You also have the --arp option, which allows you to experiment with the Address
    Resolution Protocol (ARP). In addition to deploying ARP cache poisoning attacks,
    you can craft various types of ARP packets. The now obsolete RARP (Reverse ARP)
    lookups were used to translate a MAC address into an IP address. ARP has been
    succeeded by the BOOTP and DHCP protocols; RARP still sometimes has its uses.
    There was also an evolved version of RARP called Dynamic RARP (DRARP), which is
    supported. It was mostly used by Sun Microsystems in the IP of the last millennium,
    and is used very little these days. There''s also support for "InARP" requests;
    this is similar to ARP but applies mainly to frame relay and ATM networks.


    Finally, to complement these protocols, you can add --traceroute to the output
    to help determine which path took by looking at the source address of "destination
    unreachable" packets sent in reply.


    ## Payload Options


    Now that you''re familiar with the main protocol options, let''s see if you can
    take your new-found knowledge and put it to good use. Another reminder that Nmap
    was designed for white hat activities and should be used as such, not for illegitimate
    gain. It may cause mayhem with tools of this nature.


    If you wanted to add a payload to your probe packets, then there are three varieties,
    as shown in Table 5.1.

