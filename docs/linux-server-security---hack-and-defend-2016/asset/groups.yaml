    more comprehensive configuration file can also be a useful reference when you''re
    trying to troubleshoot an issue.


    What about asking Nmap to run a simple scan on a machine? Let''s perform a basic
    port scan on a remote IP address. In this example use the "PN" option in order
    to miss out a ping test, assuming the machine is online (note other versions of
    Nmap used "-PO" and "-PN", in case it causes confusion, and for "host discovery"):


