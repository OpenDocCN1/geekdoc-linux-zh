  - '[PAGE 11]


    # Introduction


    proficient attackers who can wield the power of other compromised systems and
    services, causing serious headaches for unsuspecting victims.


    Furthermore, the motives for attempting attacks are varied and sometimes unpredictable.
    They might include receiving kudos from the hacking community, one-upsmanship
    on a victim, a training exercise for wannabe novices, or simply financial gain.
    And, considering the most common demographic involved, let''s not forget thrill
    seekers.


    If your service is prone to certain types of unwanted attention, such as your
    web application being continually bombarded with probes looking for security holes,
    then common sense dictates that you focus primarily on getting your developers
    to fix your application''s flaws. Conversely, if you are running an e-mail service,
    then you need to be absolutely sure that the software that you rolled out all
    the mail servers in your cluster is up to date, patched frequently and promptly.
    By focusing on the most obvious weaknesses, it is possible to limit the attack
    surface that you are likely to present to skilled attackers, and to reduce the
    chances of them gaining a foothold on the rest of your infrastructure. Once you''re
    content that your primary attack vector is mostly secured, you can concentrate
    on plugging less obvious holes.


    It may help to focus your thoughts about security with a few simple questions.
    First, what are you trying to protect? For example, is it sensitive, secret information
    hidden inside a database, fronted by multiple firewalls and hosts, or are you
    protecting an online service that must stay available to your users around the
    clock, every day of the year? This question is important because it affects how
    you bolster your defenses and potentially changes the defensive choices that you
    will make. You might, for example, pay dollar every month for a network-traffic
    cleaning service to protect you against Denial-of-Service attacks, as opposed
    to buying expensive, high-end hardware.


    Second, how would you contain a security breach? If one server or device on your
    network is breached, will that automatically make other hosts suffer the same
    fate? If that''s the case, then clearly your security policy has serious issues
    that need to be addressed.


    Third, how would you recover from a security breach? You might also be concerned
    about what happens if an attacker has discovered your redundancy works and at
    what stage your failover services will be activated. There might be little point
    in rebuilding a primary server or blindly restoring network service if you don''t
    know how an attacker breached the security in the first place. Are you able to
    quickly recover services using an alternative vendor''s equipment or software?
    If so, then you might reduce the likelihood of the same attack penetrating your
    security again, allowing you to restore some, if not all, services investigating
    how the attackers got in.'
  - '[PAGE 12]


    Introduction


    # How This Book Is Organized


    The chapters contained within this book can be read in any order and are a collection
    of security topics that have interested the author on his journey as an Internet
    user over the years.


    The topics vary from the theory of past, current, and future attacks, to the mitigation
    and defense from a variety of online attacks, all the way empowering readers to
    perform malicious attacks themselves (in the hope they will learn to defend against
    such attacks).


    By separating the various topics into chapters, the subjects can be referenced
    and returned in the future to allow the reader to recount the content in detail.
    The content of each chapter is as follows:


    **Chapter 1: Invisibility Cloak:** If an attacker cannot see your server and isn''t
    aware of its existence, then there isn''t any attack vector to exploit in the
    first place. We demonstrate how to continue using services in production without
    the unwelcome attention of attackers.


    **Chapter 2: Digitally Fingerprint Your Files:** There are many ways to keep an
    eye on the integrity of your server''s filesystems to ensure attackers haven''t
    gained access. In this chapter we look at both a manual method and an automated
    tool that checks for rootkits.


