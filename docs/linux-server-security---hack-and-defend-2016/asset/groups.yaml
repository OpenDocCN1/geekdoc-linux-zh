    # Summary


    Some of the changes you have explored can be damaging to both systems and networks.
    You should know what you''re doing (and ideally, experiment on a test machine)
    before triing any of these settings in production. As mentioned, the classic mistake
    of becoming panicked by the bad reputation that ICMP has and simply banning all
    mentions of the protocol on your network is ill-advised.


    You have looked at attacks and how to prevent them from affecting the normal operations
    of your network and servers. You also looked at rate-limiting inbound ICMP traffic.


    In addition, you looked at the logging of pings and traceroutes to pick up any
    recce with nefarious intent on your server, and more importantly, how to safely
    log all unwanted probes to a file so that an attack won''t fill your disks with
    sizable log files.


    It''s safe to say that some of this knowledge may only be needed rarely, but the
    next time someone mentions that they''re blocking ICMP traffic on their server,
    you can give them a knowing look and say that you''re confident that ICMP issues
    will no longer cause you problems.'
