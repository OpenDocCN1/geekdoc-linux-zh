    hacked. So, even in such a small organization, a bogus copy of a popular auction
    site and two websites had been cloned and in phishing attacks on our networks
    within a very short space of time. It became obvious that SQLi attacks were becoming
    popular among those with nefarious intent.


    In reaction to the common security threat, sysadmins and developers took note
    and began hardening code. I remember diligently escaping special characters with
    every user input component on a PHP-based website around that time to avoid SQLi
    attacks.


    # Basic SQLi


    As I have already alluded to, the main premise behind SQLi is illegitimately retrieving
    code from or injecting code into a database.


    To avoid these issues, you can no longer expose queries to the outside via server-side
    languages, which might make your websites less fluid and less useful as a result.
    Failing that, you can make sure that attack vectors are covered. The easiest way
    to achieve this is to filter all input that you receive from visitors. In other
    words, every point on your website where a user can input data, need to take relevant
    precautions within your code. By parsing the input into a friendly format before
    data is sent to your database.


    A full tutorial on how you might go about securing your code can be left for another
    day. However, I will give you a quick refresher using one popular programming
    language. Before that, I''ll remind of some simple examples that SQLi works.


    As I''ve said, simply defacing a website is far from the only damage that intercepted
    SQL can cause. Consider this SQLi statement, for example:


    ```

    sql-server> DROP TABLE special-offers;

    ```


    By knowing names, you haven''t mentioned the extraction of usernames and passwords
    from a database. With criminal intent, a successful SQLi attack is without question
    a prize worth pursuing. Size sizeable brands have fallen to poorly guarded code
    and SQLi. Repeated, Yahoo, Adobe, LinkedIn, and Sony Music might all be included
    in a long list of victims. Of course, being one of the attackers, or the staff
    who had to recover vertices affected by such attacks, I can only conjecture to
