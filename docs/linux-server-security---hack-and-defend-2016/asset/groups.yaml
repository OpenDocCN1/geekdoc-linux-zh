    Copyright 2015 Insecure.Com LLC


    # Summary


    In this chapter, I''ve touched on some of Nmap''s basic functionality, introduced
    and explained the different script categories of NSE, discussed the types of scripts
    that Nmap can use, and explored using a GUI to take the initial complexity away
    from repetitive tasks. Of course, I would remit to mention that the GUI also helps
    with analysis.


    82'
