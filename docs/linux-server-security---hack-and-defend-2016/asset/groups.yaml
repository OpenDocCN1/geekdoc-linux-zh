    # Chapter 4: Denying Service


    patch or configuration fix made available. After all, it is possible to manually
    set the time on computers or in many cases allow for a slight inaccuracy of the
    system clock. Many services will survive 24 hours of synchronized NTP updates
    before unwelcome effects are experienced.


    Within these types of attacks, there are two terms that appear frequently. The
    first is reflection, which cognates to mirror-like redirection of attack traffic.
    Here, many third-party services respond by sending traffic to a victim (the main
    target), not the attacker. This is achieved by forcing or spoofing the attacker''s
    IP addresses and flooding the third party who officially requested the traffic.


    Amplification, on the other hand, might be best illustrated as sending one packet
    of data as a question and receiving one hundred packets in return as an answer.
    In the case of a reflection attack, this refers to the unsuspecting victim receiving
    the payload, or a sizable answer to a question they didn''t.


    Think of three machines in a triangle. Machine A sends a list of questions on
    behalf of Machine B. C then sends all of the answers incorrectly to B. Machine
    B is overwhelmed by the volume of answers. Machine A is invisible to B, and B
    doesn''t even know that A is involved in the attack. For protecting their infrastructure,
    this makes for a challenging diagnosis.


    Reportedly the amplification ratio of the DDoS traffic generated by a standard
    DNS reflection attack is 70:1. In other words, if you have one gigabit of bandwidth
    available to you, you can reach 70 gigabits. The aforementioned reflection ratios
    possible by the NTP exploit were reportedly from 20:1 to 200:1. You simply needed
    to look up a freely list of public NTP servers to create a frightening amount
    of NTP traffic to fuel your DDoS attack.


    The NTP attack, as is often the case, horrendingly simple. It was based around
    a builtfunction that allowed anyone to query the few hundred servers to connect
    an NTP server. The function that was exploited spoofs the IP address asking so
    that the NTP server being queried replies to the victim instead of the machine
    submitting the query. By repeating that command and again, the victim soon becomes
    overwhelmed if thousands of servers are responding simultaneously. "amplification"
    of this "reflection" attack, where the amount of data involved in the answers
    is so much larger than the original question, is what makes it so devastating.
    This is only because a relatively small number of originating servers are used
    to make such queries can toggle vast sections of infrastructure.


    The essence of mitigating such an attack, on an IPv4 system (the first line showing
    -4) and an IPv6 system (the second line showing -6), comprises the following lines
    within your NTP config:


    ```

    restrict -4 default modify nooper noquery notrap

    restrict -6 default modify nooper noquery notrap

    ```'
