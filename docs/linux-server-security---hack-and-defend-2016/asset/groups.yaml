    # Preface


    There''s little question that the knowledge required to secure systems and networks
    in an effective manner needs to be continually kept up to date. However, not all
    technical professionals want to become full-fledged security professionals; instead,
    they prefer to focus on other areas, despite their role demanding many of the
    required skills.


    It seems like every day news reports another sensational attack and makes those
    working in the field count themselves lucky that their clients weren''t the target.
    As our reliance on responsive connectivity and well-written software grows, so
    do the rewards for successfully compromising an online service.


    The intention of this book is to offer a broad overview of both system and network
    threats. Rather than focus on one specific facet of online security, my aim is
    to examine a number of diverse areas, providing you, the reader, with enough knowledge
    so that you may pursue, in greater detail, that I have found interesting on my
    journey as an Internet user, which, some-worrying, now spans almost two decades.


    The diversity of the subjects within this book will hopefully help you to secure
    your online services and also provide you the opportunity to experiment with common
    tools that hackers use. This is intended to benefit everyone'
  - '[PAGE 10]


    # Introduction


    Consider for a moment that even highly publicized online attacks might be simple
    to carry out. The steps involved in launching an attack on a system or network
    can range from highly complex to frighteningly simple. This can also be the case
    if a system is left unsecured with well-known buggy software.


    The modus operandi of a less experienced attacker may simply be the automation
    of endlessly port scans, opening a connection and promptly closing it, or tirelessly
    searching for a banner that reveals the version of the service listening behind
    the port. If any versions match those listed in their vulnerability database,
    then a fresh target is identified by the attacker. Up to this point in an attack,
    it is an almost fully automated approach, which you might say it is nothing more
    than attacking computers.


    Conversely, sophisticated attackers use a wide variety of approaches to disrupt
    or gain access to a system or network. They are not only experienced and intelligent,
    but also innovative, patient, and cunning. They employ social engineering, building
    customized hardware, and practice stealth of hand. During an attack, they adapt
    their methodology as the attack evolves, sometimes rapidly. Much of the attack''s
    impact comes from being well prepared; the sheer number of attack vectors that
    might be tested during initial reconnaissance is high.


    Securing online services is a little like pushing water uphill, and I take no
    pleasure in saying that however well secured a service or system is, there will
    always be a way to break or disrupt it. As bold statement as that may be, keep
    in mind even if a system or network isn''t vulnerable today, there is an exceptionally
    high chance that it will be at some point in the future.


    Sadly, this means that, barring destruction of the power source for a server or
    network, the very act of switching on any electronic device effectively represents
    an attack vector for someone to exploit. This is a reality that technical professionals
    have long faced. The resulting approach to online security is one of weighing
    how valuable the successful exploit of your online systems and networks might
    be to attackers versus the budget you have available to secure your infrastructure.
    You might also try to reduce the value of a single prize, for example, separating
    your mail servers from your web servers. If one cluster is compromised, hopefully
    the other cluster will not be susceptible if it''s a different firewall and using
    an alternative operating system.


    Putting night terrors aside, thankfully, very highly sophisticated attackers exist,
    against which your defenses will fail to one degree or another (sometimes within
    a matter of minutes). However, as the Internet matures, there are an increasing
