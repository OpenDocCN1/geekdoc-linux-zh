    # Chapter 5: Nping


    You can clearly see the difference in detail. Here is the standard user, without
    root may detail:


    ```

    SENT (0.0027s) Starting TCP Handshake > localhost:80 (127.0.0.1:80)

    RECV (0.0028s) Handshake with localhost:80 (127.0.0.1:80) completed

    ```


    In the next example, as the root user, you can see that you get more information
    about what was in the ICMP packet. The type=8 for "Echo" according to RFC (https://tools.ietf.org/html/rfc792),
    which is what you''d expect.


    ```

    SENT (0.0152s) ICMP 127.0.0.1 > 127.0.0.1 Echo request (type=8/

    code=0) ttl=64 id=31032 ipl=28

    RECV (0.0154s) ICMP 127.0.0.1 > 127.0.0.1 Echo reply (type=0/code=0)

    ttl=64 id=18763 ipl=28

    ```


    # ARP


    You also have the --arp option, which allows you to experiment with the Address
    Resolution Protocol (ARP). In addition to deploying ARP cache poisoning attacks,
    you can craft various types of ARP packets. The now obsolete RARP (Reverse ARP)
    lookups were used to translate a MAC address into an IP address. ARP has been
    succeeded by the BOOTP and DHCP protocols, RARP still sometimes has its uses.
    There was also an evolved version of RARP called Dynamic RARP (DRARP), which is
    supported. It was mostly used by Sun Microsystems in the ICMP of the last millennium,
    and is used very little these days. There''s also support for "InARP" requests;
    this is similar to ARP but applies mainly to frame relay and ATM networks.


    Finally, to complement these protocols, you can add --traceroute to the output
    to help determine which path took by looking at the source address of "destination
    unreachable" packets sent in reply.


    # Payload Options


    Now that you''re familiar with the main protocol options, let''s see if you can
    take your new-found knowledge and put it to good use. Another reminder that Nmap
    was designed for white hat activities and should be used as such, not for illegitimate
    gain. It may cause mayhem with tools of this nature.


    If you wanted to add a payload to your probe packets, then there are three varieties,
    as shown in Table 5.1.'
