    # Chapter 1: Invisibility Cloak


    Otherwise, it should be invisible to Internet users. I would experiment with your
    fire-wall if this is not the case. To achieve Nmap''s closed port status, however,
    the following approach works for me.


    # Testing Your iptables


    As mentioned earlier, I would use the trusted iptables. Ideally you should have
    physical access to the server before locking it down, in case you make a mistake.
    Failing that, you should have out-of-band access of some type, such as access
    via a virtual machine console, a secondary network interface that you can log
    in, or a dial-up modem attached to the machine. Be warned that unless you''ve
    tested your configuration on a development-box first, there''s a very high chance
    of making a mistake and causing problems. Even I''ve used port knocking before,
    I still get caught out and lock myself out of a server occasionally.


    With that in mind, let''s begin by looking at your iptables commands. Be careful
    when integrating these rules with any rules you already have. It might be easier
    to overwrite your existing rules after backing them up. First, you need to make
    sure that your server can speak to itself over the localhost interface, as follows:


    ```

    # iptables -INPUT -s 127.0.0.0/8 -j ACCEPT

    ```


    You must ensure that any existing connections are acknowledged and responded to,
    as follows:


    ```

    # iptables -INPUT -m conrack-ctstate ESTABLISHED,RELATED -j

    ACCEPT

    ```


    You''re using conrack to keep track of associated connections. Your connections
    continue to operate unless they have been initiated successfully. Now, assuming
    you''re only going to open TCP port 22 for your SSH server and no other services,
    you can continue. As a reminder of how to do this, referring to Listing 1.1, add
    the following command to open TCP port 22:


    ```

    command = /sbin/iptables -INPUT -s %IP% -p tcp --dport 22 -j ACCEPT

    ```


    Pay attention to this. If you let an "append" using -A INPUT in the command, you
    would be locked out by iptables. It must be an -I for "insert" so that the rule
    is the first rule and takes precedence over the others.


    You might be wondering what %IP% variable is. Port knocking is clever to substitute
    the connecting IP address in the -s field, in place of the %IP% value.


