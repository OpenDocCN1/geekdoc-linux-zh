    ## Chapter 9: Password Cracking with Hashcat


    so they are converted to the new hash type. You can expire a user''s password,
    forcing the user to change it at the next login, with the following command:


    ```

    # chage -d 0 chrisbinsinnie

    ```


    The "change age" command in this example pushes the expiration date to January
    1, 1970, which ensures it''s always earlier than the current setting of the system''s
    clock.


    Let''s look at my /etc/shadow entry again for the user chrisbinsinnie:


    ```

    chrisbinsinnie:$6STRIWb51$f6Tm54gpV2YCn6f2b7w/

    5nv82psajFqTewx7FCeW3l1G2pkKasKgf1CtWhOPWykFkGrpFGcmde4HW/

    :12231:3:32:

    ```


    You don''t need to use the authconfig command to determine that the entry is using
    a SHA512 hash. You can refer this to Table 9.1.


    ## TABLE 9.1 How to Identify Hashing Algorithms


    | Symbol | Hashing Algorithm |

    |---|---|

    | $0 | DES |

    | $1 | MD5 |

    | $2 | Blowfish |

    | $2A | Eksblowfish |

    | $5 | SHA256 |

    | $6 | SHA512 |


    In the Shadow example, sandwiched between two dollar signs directly after the
    username, there are three characters: $$$. From Table 9.1 you can tell that the
    /etc/shadow passwords are SHA512. This is good news it''s a strong algorithm.


    The next section of the password entry, after $6 and what is up to the next dollar
    sign, is the salt. That''s TRIYWb51 in this case.


    The password (encoded with the salt) is the next section after the dollar sign
    and up to the first column. After that, the other settings, within the colons,
    offer the system some pertinent information such as when the user''s password
    will expire, when was last changed, and so on.


    To gauge how recently the stronger algorithms have been used in, consider this:
    according to Fedora, since Fedora 8 the glibc package supported SHA256 and SHA512
    hashes. As a result, from Fedora 9 it has been possible to use SHA256 and SHA512
    for passwords.


    If you''re stuck, check out the website http://verifier.insidepro.com to determine
    which hash variety you want to point Hashcat to. I only had limited success with
    the example hashes used here, which were generated using a different website''s
    tool, so be warned that it may take some time to identify an unknown type of hash
    algorithm.


    In case it is useful, try running the following command to generate an MD5 password
    with a salt (you need openssl installed):


    From the results of running that command, note where the $1 and the 123 are in
    the encoded password.


    I sometimes also run an MD5 hashing test like this (without a salt):


    ```

    # echo PASSWORD | md5sum

    b804be229e11c290efdcd8190a92261

    ```


    Other ways of manually generating passwords can be found at http://unix.stackexchange.com/questions/81240/manually-generate-password-for-etc-shadow.


    ## Choosing Attack Mode


    Now that you understand how hashes work, let''s forge ahead. Even when you know
    the type of hash that you''re dealing with, you still need to consider how to
    attack any encoded passwords that you have access to.


    I have mentioned a common attack mode referred to as a brute attack. These attacks
    will go after the characters, using U.S. and U.K. character sets at least, will
    include a-z, A-Z, 0-9, and so on.


    Another popular mode of attack is using wordlists. Here Hashcat will run through
    pre-defined lists of words, testing if they work with the passwords presented
    to it.


    A more complex way of using wordlists is adding programs, in what Hashcat calls
    a rule-based attack. You can change and extend rules, for example, using custom
    rules. By crafting some of the finer points of how Hashcat works, your attacks
    can be more accurate and utterly efficient.


    ## Downloading a Wordlist


    If you want to run a wordlist, you would first need a list of words to check against.
    There are a few sites online that host lists of leaked passwords. The site that
    follows is apparently not involved in nefarious practices. It offers a number
    of wordlists that you can download. Using an English dictionary as an example,
    it will let you download 39,378 words into a list that Hashcat will happily run
    through. You can find the wordlists at md5this.com/tools/wordlists. (The password
    to unlock Zip files is shown as md5this.com.).


    If you''re interested, md5this also offers a wordlist generator in the form of
    a python script, which can be downloaded from md5this.com/tools/wordlist-generator.
    The script works by generating words from content. In order to run the script,
    you simply need to point it at where it will scrape its data.


    ## Rainbow Tables


    Instead of leaning on a system''s CPU or GPU capacity, another approach is to
    lean on storage, potentially using hundreds of gigabytes. During a brute force
    attack, rather than calculating every hash, it is possible to look up a list of
    calculated answers here. These are known as rainbow tables. There are ways of
    defeating this approach, namely by using one-way hashes. This is effective because
    each password is hashed with a unique salt, and therefore every possible salt''s
    calculated hash would need an entry in a rainbow table alongside its salt.


    ## Running Hashcat


    Now that you know about hashes, attack modes, and where to download wordlist (once
    you''ve run through the large number of examples, this knowledge can be very useful),
    you can finally get to running Hashcat itself. The contents of my installation
    directory are as follows:


    ```

    charsets/ hashcat-cli32.exe tables/ hashcat-cli64.exe docs/ hashcat-cli64.bin
    rules/ hashcat-cli32.bin examples/ salts/

    ```


    You can see from your directory listing that there are different types of executables.
    For your purposes, anything ending in .bin will suffice. If for some reason your
    .bin files aren''t immediately executable, then you can use that command chmod
    +x <executable> to remedy this. I''ll be using the 64-bit command line interface
    called hashcat-cli64.bin, which matches my capabilities. The different Hashcat
    executables shown in that directory suit a variety of features that might be made
    by your machine''s processors. The other relevant .bin file you''re interested
    in, with XOP added to its name, stands for eXtended Operations. If you want to
    get more serious about using Hashcat later, you can read up your password flags
    and choose which executable can make best use of your particular system. For example,
    according to the forums, AMD processor chips use the XOP version.


    Let''s now look at running your Hashcat executable. The syntax for the hashcat
    command is as follows:


    ```

    # hashcat [options] hashfile [wordlistdirectories] own```


