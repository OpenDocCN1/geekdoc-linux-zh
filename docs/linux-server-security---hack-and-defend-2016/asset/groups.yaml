  - '[PAGE 3]


    # About the Author


    **Chris Binnie** is a technical consultant who has worked online with Linux systems
    for almost two decades. During his career, he has deployed many servers in the
    cloud and on banking and government server estates. As well as building an autonomous
    system network in 2005 and serving HD video to 77 countries via a media streaming
    platform that he architected and built, he has written for *Linux Magazine* and
    *ADMIN Magazine* for a number of years. Outside of work, Chris enjoys the outdoors,
    watching Liverpool FC, and extolling the virtues of the unerring Ockham’s razor.


    # About the Technical Editor


    **Rob Shimonski** (www.shimonski.com) is an experienced entrepreneur and an active
    participant in the business community. Rob is a best-selling author and editor
    with over 20 years’ experience developing, producing, and distributing print media
    in the form of books, magazines, and periodicals. To date, Rob has successfully
    helped create over 100 books that are currently in circulation. Rob has worked
    for countless clients, including Wiley Publishing, Pearson Education, CompTIA,
    *Entrepreneur* magazine, Microsoft, McGraw-Hill Education, Cisco, and the National
    Security Agency. Rob is also an expert-level architect with deep technical experience
    in protocol capture and analysis, and the engineering of Windows and Unix systems.'
