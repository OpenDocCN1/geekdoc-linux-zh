    22/tcp open   ssh

    25/tcp open   smtp

    80/tcp open   http

    111/tcp open  rpcbind

    Nmap done: 1 IP address (1 host up) scanned in 0 seconds

    ```


    In Listing 7.2, however you see that NSE has been engaged, and here it adds invaluable
    insight into the mix.


    ### Listing 7.2 The richer output provided by network discovery with NSE being
    engaged


    ```

    # nmap -sC -p 0-1024 -T4 localhost

