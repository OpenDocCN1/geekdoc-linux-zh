    ## 第 4 章：拒绝服务


    机构应当加强其主机和网络设备等网络基础设施各个方面，以防止互联网周围产生连锁反应。


    具体来说，我们需要花时间讨论入站过滤（ingress filtering）的重要性，如果你的网络被用作攻击工具，它可以保护外部网络免受损害。引用这一点，通过采用简单的预防措施，对来自“有效”源的攻击进行诊断和缓解，比猜测源流量的来源更为有效，正如你在之前的章节“NTP
    反射攻击”中看到的那样。


    在许多情况下，不同层次的入站过滤可以实现这一目标。所提出的观察之一是，通过减少互联网攻击的数量和频率，最终在攻击发生时会有可用可用。因此，响应将更加有效。这些开创性指南的大部分内容归功于资深的
    NANOG（北美网络运营者小组：https://www.nanog.org），他们在一个流行的邮件列表中详尽地激烈讨论网络问题。


    # 让一个国家瘫痪


    多个地理位置分散的系统针对单一系统（例如网络或自治系统，无论其规模有多大）并使其离线的威胁，长期以来一直是企业、ISP（互联网服务供应商）甚至整个国家的担忧。DDoS
    攻击可能从 20 世纪 90 年代就开始了。


    2007 年有广泛报道，波罗的海国家爱沙尼亚的 DDoS 攻击，结合街头骚乱，几乎让政府瘫痪。显然，民众反对爱沙尼亚议会移除一座著名的战争纪念碑。加之高程度的社会动荡，这成为了转折点。来自
    DDoS 的攻击流量不断增加，并在长时间内以持续的方式被接收。新闻机构对连接的缺失感到沮丧，因为这意味着世界其他地区无法随着国内事件的发展保持最新动态。


    爱沙尼亚的 DDoS 攻击不断演变，据报道一度达到每秒四百万个数据包的攻击流量。这部分针对该国最大的银行，根据某些报告，它最终成功地让该银行断了网。根据国家统计数据，约
    97% 的人口进行在线银行业务，这意味着该国的银行系统发生了致命性故障。如果影响还不够严重，互联网连接的缺失意味着主银行无法与自动取款机（ATM）通信，也无法从其发放现金。


    令人担忧的是，据报道与这次持续了三周的巨大破坏性事件相关的唯一逮捕结果仅导致了低于 2000 美元的罚款。在爱沙尼亚获得的惨痛教训，北约在加强对此类攻击的国际响应有效性方面得到了增强。


    # 攻击映射


    正如 William Cheswick 等人编写的优秀书籍《防火墙与互联网安全：击败狡猾黑客》（Firewalls and Internet Security:
    Repelling the Wily Hacker）在引言中简洁提到的：


    互联网是一座大城市，而不是一系列小镇。任何人都可以它，并且几乎是以匿名的方式使用。


    互联网是一个坏社区。


    通过使用数字攻击地图（Digital Attack Map）可以证实其有效性，这是一个在线工具，提供了 DDoS 攻击的极全球概述，每小时更新一次，地址为
    www.digitalattackmap.com。


    这个完全图形化的数字攻击地图工具由 Arbor Networks 和 Google Ideas 运行，它们填充了来自全球 270 多个 ISP 的数据。这些
    ISP 同意与 Arbor Networks 的全球威胁情报系统 ATLAS 共享数据。也可以通过 Arbor 的 ATLAS 威胁门户获取，并在 .arbornetworks.com/threats
    查看更深入的细节。


    此外，在 www.digitalattackmap.com/gallery 处有一个非常有用的画廊，突出了关键的历史攻击以供参考。你可以通过将鼠标悬停在攻击流上进行交互，揭示攻击期间被滥用的惊人每秒比特带宽。还有攻击的大致来源（例如，如果攻击是由僵尸网络生成的，那么它可能来自几十个不同的国家）、假设受害者以及攻击的持续时间。特别感兴趣的是攻击期间使用的源端口和目的端口；看，在我查询的少数攻击之一中，NTP
    端口（UDP 端口 123）出现了。有趣的是，根据可用数据判断，端口 80 和 53（别 de HTTP 和 DNS）似乎是最流行的 DDoS 服务。


    图 4.1 显示了来自数字攻击地图的攻击示例，以及该地图展示的攻击类型。这仅仅是左侧。


    图 4.1 显示了来自数字攻击地图的攻击示例，以及该地图展示的攻击类型。这仅仅是左侧。


    # 总结


    在本章中，我们查看了影响互联网的许多问题。正如我们最近看到的，UDP 极其脆弱。然而，持续监控你的系统和网络是至关重要的。虽然 ping 命令是一个常用工具，但有趣的是，它
    并不总是期望三次握手，因此更有可能被利用。


    让我们看看 Nping 工具如何帮助你更深入地了解你的系统和网络，包括远程和本地连接。


    # Nping


    正如美国军方的 DARPA（国防高级研究计划署）对你今天所知的互联网做出的巨大贡献并帮助塑造了它，有一个类似于 ping 命令的工具。作为强大的工具 Nmap（https://nmap.org）的一部分，它还包含了对
    ping 命令的强大改进版本，称为 Nping（https://nmap.org/nping/）。如果你用过 Nmap，你就会知道在使用 Nmap 项目创建的任何工具时是安全的。


    '
