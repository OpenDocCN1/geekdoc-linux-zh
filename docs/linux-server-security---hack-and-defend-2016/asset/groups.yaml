  - '[PAGE 38]


    # Twenty-First-Century Netcat


    One of the first Linux packages that caused me to marvel at its capabilities was
    the powerful netcat (https://nmap.org/ncat/). There have been a few versions over
    the years, each with subtly different feature set. If you haven''t used it, you''re
    in for a treat. It''s described as the only tool a sysadmin will ever need, which
    may be a little optimistic, but netcat is genuinely exceptional.


    For a start, it''s incredibly lightweight, and its filesystem footprint is miniscule.
    In addition, a version of netcat is included in many distributions by default.
    After you''ve explored some of its background, you''ll look at how you can use
    it to your benefit.


    # History


    Over the years there have been a number of implementations of netcat. The original
    Unix/Linux version was written in 1995, and in 1998 a Windows version appeared
    due to its popularity. I once read that a poll conducted by the Nmap Project (https://nmap.org)
    discovered that after their open security tool, Nmap, users opted for netcat as
    their second tool of choice.


    Netcat''s functionality also helped boost its popularity in nefarious circles.
    It''s commonly used in attack reconnaissance (and attacks themselves) in addition
    to well-intentioned white attacks. As a result, you may not find full-fledged
    (modern) versions of netcat on enterprise infrastructure, due to security fears
    and its packages flagged as threatened.


    I''ll try to explain some of netcat''s parent. Confusion is easy because the original
    netcat (whose binary executable is nc) was revamped by the Nmap Project, which
    refers to it as "Netcat for the 21st Century". The result of the revamp was a
    binary called ncat. The man page for ncat duly acknowledges the original version
    with the following following comment:


    > The original netcat was written by "Hobbit" hobbit@avian.org. While Ncat isn''t
    built on any code from the "traditional" netcat (or any other implementation),
    Ncat is mostly based on Netcat in spirit and functionality.


    This version of netcat (ncat) bits itself (mostedly) as being to "concatenate
    and redirect sockets", but that''s a gross overstatement of its feature set.


    There''s version netcat available in Red Hat Enterprise Linux (RHEL) 7, for example,
    and in suspect, along with the original netcat (nc), it is available in other
    releases in various incarnations over the years. There''s also an original netcat
    version (bundled by default with Debian Jessie, whose binary is also called nc),
    and it has its abilities as being


    Linux® Server Security: Hack and Defend. Chris Bimmie

    © 2016 by John Wiley & Sons, Inc. Published by John Wiley & Sons, Inc.


