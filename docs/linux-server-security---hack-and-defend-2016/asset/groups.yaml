    ## 第二章：为文件建立数字指纹


    文档首先指出，在尝试攻击之前，总是会有某种形式的侦察，因此你应该密切关注日志文件。我记得曾经写过一个脚本，监控我一台服务器上的追踪路由（traceroutes）和
    ICMP 流量。


    再次重复我之前的观点，手册后面提到该工具并不是增强机器安全性的替代品。不要将其视为替代品，而应将其视为识别问题的工具。


    有趣的是，Rootkit Hunter 的文档还向你推荐了他们的竞争对手之一——优秀的 `chkrootkit` 工具，它是一个旧版本。手册建议，在同一类工具中仅使用一种工具有时不足以获取你所需的所有信息。因此，为了完整性，你应该从同时运行
    `chkrootkit` 和 `rkhunter` 的重叠中获益。这是一个适用于所有安全层面的良好观点。


    最后，手册讨论了如果你发现系统被入侵且没有足够的技能来处理成功的漏洞利用该怎么办。除了 `www.cert.org` 外，你可能还想访问 `www.linuxsecurity.com/br/INFO/intruder_detection_checklist.html`，它提供了一份关于如何应对在线攻击的步骤清单。


    那些具有攻击经验的人告诉我们，你应该考虑当局可以报告该漏洞，并尽快提交报告——而不是等几周或几个月——以防可以采取措施防止其他入侵。一如既往，常识是通用的。


    ## 总结


    现在你已经拥有了对文件系统上的文件建立数字指纹的能力。因此，你可以快速比较之前的 MD5sums 以查看文件是否被更改过，还可以每晚或定期运行 Rootkit
    Hunter。rootkit 检查器的好处在于，它们还可以通过计划性扫描指出你所犯的配置错误，从而带给你安全感。你希望可以在错误导致进一步更严重的安全问题之前纠正它。


    根据我所涵盖的内容，有两条规则你应该记住：


    - 始终将记录的 MD5sums（或任何其他哈希值）保存在安全的地方（加密并受密码保护），并远离服务器。

    - 不要依赖 rootkit 工具来减少事件发生后的工作；只需用它们来识别问题。从那里开始，在着重建机器之前，先弄清楚是如何发生入侵的。花费大量时间重建机器，结果稍后同样的安全漏洞再次被利用，是没有意义的。听到这种情况发生得如此频繁，你可能会感到震惊。


    在运行不太关键的服务时，只要有一定的远见，连接到互联网的机器防护通常不涉及太多工作。即使不可避免地会引入一些耗时的开销，例如在对系统更改添加夜间报告时。通过在构建机器之初采取预防措施，互联网上的黑客就可以被挡在外面，让你能够静心工作。


    ## 二一世纪的 Netcat


    第一个让我惊叹其功能之强大的 Linux 软件包之一是功能强大的 netcat (https://nmap.org/ncat/)。多年年来它出现了几个版本，每个版本的功能集都略有不同。如果你还没用过它，你将大大一番了。它被描述为系统管理员可能需要的唯一工具，这可能有点乐观，但
    netcat 确实是非同凡的。


    首先，它极其轻量化，文件系统占用空间微乎其微。此外，许多发行版默认都包含一个版本的 netcat。在你探索了一些背景知识之后，你将看到如何利用它来为自己获益。


    ## 历史


    多年来，netcat 有许多实现版本。原始的 Unix/Linux 版本编写于 1995 年，1998 年由于其流行，出现了一个 Windows 版本。我曾读到过，由
    Nmap 项目 (https://nmap.org) 进行的一项调查显示，在使用他们的开源安全工具 Nmap 之后，用户选择 netcat 作为第二备选工具。


    Netcat 的功能也助推了它在犯罪分子中的流行。除了善意的白帽攻击外，它经常被用于攻击侦察以及攻击本身。因此，你可能在企业级基础设施上找不到全功能的 netcat
    版本，因为安全担忧以及该软件包被标记为威胁。


    我将尝试解释一下 netcat 的来源。混淆很容易发生，因为原始的 netcat（其可执行二进制文件为 `nc`）被 Nmap 项目重构，他们将其称为“二十一世纪的
    Netcat”。重构的结果是一个名为 `ncat` 的二进制文件。`ncat` 的帮助页通过以下注释充分承认了原始版本：


    > 原始的 netcat 由 "Hobbit"（hobbit@avian.org）编写。虽然 Ncat 并不是基于“传统” netcat（或任何其他实现）的代码构建的，但
    Ncat 在精神和功能上大多基于 Netcat。


    这个版本的 netcat (ncat) 自我描述（主要是）是用于“连接和重定向套接字”，但对其功能的描述被夸大了。


    例如，在红帽企业 Linux (RHEL) 7 中提供了 netcat 版本，在 Debian 中也是如此，原始 netcat（名为 `nc`）在多个版本中可用。这两个“nc”版本的
    netcat 值得注意的是，在两个版本之间使用相同的命令行选项可能会遇到困难。


