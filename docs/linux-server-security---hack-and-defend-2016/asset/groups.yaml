    25/tcp open   smtp

    80/tcp open   http

    | http-methods: Potentially risky methods: TRACE

    |__See: http://nmap.org/nsedoc/scripts/http-methods.html

    |__http-title: Site doesn''t have a title (text/html; charset=UTF-8)

    111/tcp open rpcbind

    Nmap done: 1 host up scanned in 16 seconds

    ```


    In Listing 7.2 you can see the additional input from NSE. In contrast to Listing
    7.1, you also receive URLs to further research your findings, more detail (such
    as the SSH key in this case), and even comments about the HTML that Nmap doesn''t
    think is valid HTML.


    ## Timing Templates


    In Listings 7.1 and 7.2, you asked for information about ports in the 0-to-1024
    range (the privileged, or superuser ports on Unix-type systems) using the -p0-1024
    option. The -T4 option isn''t actually a timeout value of four seconds but instead
    offers a way of pulling up a specific timing template by NSE. The higher the setting,
    the faster Nmap runs, and the values that are available range from 0 to 5.


    The timing templates are important and can make a difference to your emotional
    well-being.

