    # Chapter 2: Digitally Fingerprint Your Files


    On Debian derivatives:


    ```

    # apt-get install rkhunter

    ```


    On Red Hat derivatives:


    ```

    # yum install rkhunter

    ```


    Assuming your installation didn''t throw up any errors, you can run a few simple
    commands to get started. The following command populates the file properties database
    about the files on your machine:


    ```

    # rkhunter-propupd

    ```


    Next, in order to scan any new software being installed and trigger after software
    updates have occurred, you should enable the APT_AUTOGEN option to yes in the
    file /etc/default/rkhunter. I have only verified this on Debian with Apt Package
    Manager; there might be a different option on Red Hat derivatives.


    Having made that change, you are now ready to make your first run of RootKit Hunter,
    as:


    ```

    # rkhunter-check

    ```


    Note that there are subtle differences between versions or distributions, so try
    adding -c or --checkall if errors appear.


    Periodically you can also update your rkhunter threat list with the following
    command you could create a specific cron job if you like to keep track of the
    latest threats:


    ```

    # /usr/local/bin/rkhunter-update

    ```


    Figure 2.2 shows an abbreviated output that is generated after running this command.
    The output details the initial checks that the software makes.


    As you can see, RootKit Hunter is paying attention to the key directories that
    contain executable files (/usr/sbin in this example). These are exactly the types
    of binaries file (among many others) that become infected by a rootkit.


    Think for a moment of the Greeks and the Trojan horse allegory. In addition to
    those rootkits that immediately infect binaries, a piece of code can remain dormant
    for any period of time until executed by a legitimate user or on a schedule. Following
    that, a system compromise takes place.


