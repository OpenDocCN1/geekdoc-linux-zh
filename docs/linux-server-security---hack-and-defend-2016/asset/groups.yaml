    # Chapter 10: SQL Injection Attacks


    The final part of the process would be pulling all of the data from your target
    database.

    This might include usernames and passwords, personal customer information, or
    simply product information for an online shop. If you are attacking a remote site,
    how valuable the information you extract is depends on the site you are interfacing
    with. To dump the database data, you introduce the --dump option as shown here:


    ```

    # python sqlmap -u "http://www.vulnerable-website.com/product.php?id=1111" --dump
    columns -T <database-name>

    ```


    If you want to only pull down specific columns, then you can specify them directly.

    Once you know the column names, you can simply list them with an option such as
    -C columnX,columnY and separate them with commas. Having done so, you just remove
    the --columns option included in the previous example.


    Your last command might produce something like this:


    | id | title | color | price | category | received-date |

    |---|---|---|---|---|---||

    | 1111 | bars of soap | green | 1.22 | toiletries | 11.11.22 |


    If you are a developer or sysadmin and you are not concerned with how quickly
    a database dump occurs, you certainly should be. Keep in mind that you could have
    used Google to identify a list of potential targets with minimal effort and through
    only a handful of commands gotten to the stage of stealing potentially valuable
    commercial data. In addition to this theft, you can also overwrite the existing
    data and deface the online service in question using sqlmap, to the detriment
    of their brand and reputation, with relative ease.


    The powerful and sophisticated sqlmap tool provides you with a length of options
    that are simply too great to cover in detail. I would suggest reading the GitHub
    page, which gives you more details about using sqlmap. It can be found at https://github.com/sqlmapproject/sqlmap/wiki/Usage.


    # Trying SQLi Legally


    There are likely of useful websites that allow you to run scans in order to confirm
    that you have configured your penetration-testing tools correctly. One such site
    you may want to test your new-found SQLi skills on is Web Scan Test. A SQL injection
    is possible via this subdirectory: www.webscant.com/datastore. However, I would
    read the site''s terms before proceeding, just to be sure you''re not committing
    a crime.'
