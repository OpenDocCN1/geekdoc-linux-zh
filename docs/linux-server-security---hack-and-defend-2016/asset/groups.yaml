    By including -n in the options, you can disable DNS lookups to potentially speed
    up your results and avoid detection by DNS servers, which would otherwise serve
    the answers to your queries.


    If it''s TCP that you''re interested in, then Nmap can connect to TCP ports as:


    ```bash

    # nmap -sT www.chrisbinnie.tld

    ```


    Simply swap -sT to -U for UDP ports if they''re of interest.


    As I''ve mentioned, there are simply too many options to cover, before you get
    to the really good stuff, here are a couple of other options that I find useful.


    First, if you''re scanning your local network but don''t want to include certain
    hosts, then you can use an exclude file option like this:


    ```bash

    # nmap 10.10.10/24 --excludefile /home/chrisbinnie/exclusions.txt

    ```


    If there are a few servers that you need to ignore, then you can opt to use the
    following syntax:


    ```bash

    # nmap 10.10.10/24 --exclude 10.10.10.1,10.10.10.10

    ```


    For scanning specific port numbers, you must prepend U for UDP and T for TCP as
    follows:


    ```bash

    # nmap -p 53,80, 10.10.10/24

    # nmap -sP 10.10.10/24

    ```


    You would expect an output similar to this:


    ```

    Nmap report for mail.chrisbinnie.tld (10.10.10)

    Host is up (28ms latency).

    Nmap report for smtp.chrisbinnie.tld (10.10.11)

    Host is up (29ms latency).

    ```


    In other words, one line per host, Nmap has a highly sophisticated set of innards.
    It refers to its scripting engine as NSE (Nmap Scripting Engine). NSE was designed
    with a few functions in mind. These functions include network discovery through
    port scanning, advanced service detection using a variety of scenarios, vulnerability
    checking (and exploitation), and finally backdoor detection.


    NSE''s strength is in its versatility, and extends this functionality by offering
    the addition of scripts that can be written by anyone using Lua programming language.
    In order to fire NSE from the command line, you simply launch the nmap binary
    with the --script option or, alternatively, -sC.


    Following are two examples of port scanning with Nmap. The first is without NSE
    and the second engages it. This should be useful so you can familiarize yourself
    with the difference in output. In Listing 7.1 you see the results of the first
    command. Note that both these commands are run, not as the root, but as a standard
    user.


