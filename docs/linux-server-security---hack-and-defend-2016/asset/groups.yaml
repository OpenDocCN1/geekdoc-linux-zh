    # Some Config Options


    Now that you''ve got a better understanding of how the main config file is set
    up, you can examine how to configure it for your needs. Among a number of other
    tasks, you will consider the timeouts of certain operations play a part in setting
    up your server.


    # Starting the Service


    Don''t be alarmed if you see an error message saying that knockd is disabled.
    This is a pre-caution so that until you have finished setting it up, knockd won''t
    introduce unwelcome changes to iptables.


    On Debian the error message asks you to change the following parameter to 1 in
    the file /etc/default/knockd:


    ```

    START_KNOCKD=1

    ```


    Clearly, you will only do this after double-checking your configuration or making
    sure that your out-of-band access is working as expected.


    # Changing the Default Network Interface


    Once you have configured your preferred port sequence, you might want to tweak
    other parameters. In the config file (/etc/default/knockd), you have the opportunity
    to alter the KNOCKD_OPTS settings. The example within that file is commented out
    and means that you can alter the network interface knockd is listening on, as
    follows:


    ```

    KNOCKD_OPTS="-i eth1"

    ```


    These options will be appended to the knockd service, and you will need to restart
    your service to make the changes live, as follows (on systemd machines):


    ```

    systemctl restart knockd

    ```


    # Packet Types and Timing


    In the /etc/knockd.conf file, you can alter a few settings to finely tune how
    clients connect to you. Referring to Listing 1.1, under the [openSSH] section,
    you will add more options as follows:


    ```

    [openSSH]

    ```


    ```

    tcpflags = syn

    ```'
