    a result, troubleshooting should be much swifter and less difficult.


    Nmap''s powerful Nping might be considered as just one tool inside a white hat''s
    toolkit. By using tools such as these legally, you will excel at your intended
    tasks, and as a welcome afterthought, you''ll learn how to keep your own servers
    up and running.


    ## Logging Reconnoiters


    At times, you need to pay extra attention to what is connecting to your servers.
    For example, a series of attacks may have recently taken place, which you want
    to keep a close eye on, or you might just be paranoid in general, akin to the
    sensitivity of your data or the critical nature of your service.


    One relatively unsophisticated approach to monitoring those machines that are
    making reconnaissance of your servers would be to log the IP addresses that run
    pings and traceroutes against them. You may think that the information you manage
    to gle isn''t going to be of much use, but it actually be really important in
    building a picture of who connects to your servers, often and when. Akin to studying
    Closed Circuit Television (CCTV) video footage of people visiting an office, after
    a while, you get to know who stands out as unusual or who might not be expected
    on a given day. Log files are fantastic because you forget them only to return
    for analysis months later.


    If you need to keep a vigilant eye on your servers, for whatever reason, then
    the trick to monitoring your system properly depends on two things. First, you
    need a reliable daemon running in the background, listening a sentry; it should
    be reliable so it doesn''t introduce a race condition and cause your server to
    fail. Second, you need minimal logging so that you can check back to your log
    file in a year''s time and find the necessary information without worrying that
    the logs will overflow disk space and cause you problems. Clearly you also don''t
    want an attack to fill your disks with attack logs. That is unless of course you
    want to provide a high-capacity storage system and additionally there are fan
    of verbose logging.


    In this chapter, you will explore how to log any reconnaissance of your machines
    and how to counter Internet Control Message Protocol (ICMP) issues. You will also
    learn how some attackers in the past took advantage of the good-natured protocol
    that is ICMP, and gain an overview of what common attacks looked like before ICMP
    gained a reputation for being insecure.


    ### ICMP Misceptions


    The traffic generated by pings and traceroutes uses the well-maligned ICMP, with
    UDP to a lesser extent for DNS lookups if needed.


    However, it''s worth mentioning that ICMP was created for very good reasons and
    is still used for very important tasks in the day-to-day operation of the Internet.
    For example, it''s needed to tell the devices to set their Maximum Transmission
    Unit (MTU) in order to allow packets to traverse smoothly heterogeneous network
    links. As a result, after reading what you should avoid one of the most common
    synonym mistakes: blocking all ICMP traffic to your servers.


    *Linux Security: Hack and Defend. Chris Binnie*


    © 2016 by John Wiley & Sons, Inc. Published by John Wiley & Sons, Inc.


    ## Chapter 6: Logging Reconnoiters


    ### tcpdump


    Let''s have a cursory look at your options for monitoring pings and traceroutes
    around the clock. The sysadmin''s tool kit of reliable utilities, you might consider
    the powerful packet-sniffing tool, tcpdump. This tool has long been trusted to
    split traffic into smaller pieces in order to offer an insight into what is travelling
    across a network.


    For example, if you want to pick up pings, the following command works when I
    ping my paranoid server from another machine:


    ```

    # /usr/sbin/tcpdump -i eth0 icmp and icmp[0]

    ```


    As you can see in the following code, tcpdump''s ICMP abilities also picks up
    traceroutes:


    ```

    eth0 10:00:01.123 IP 192.168.1.5 > 192.168.1.10: ICMP request, id 1234, length
    64

    10:00:01.145 IP 192.168.1.10 > 192.168.1.5: ICMP reply, id 1234, length 64

    10:00:02.201 IP 192.168.1.5 > 192.168.1.10: ICMP request, id 5678, length 64

    10:00:02.225 IP 192.168.1.10 > 192.168.1.5: ICMP reply, id 5678, length 64

    ```


    In the code snippet, a server called noid experiences probes from a host called
    recce. Recce is reconnoiting to see if the server is online.


    ### Iptables


    You can also run the iptables command, which uses Netfilter''s kernel-based firewall:


    ```

    # iptables -I INPUT -p icmp --icmp-type 8 -m state --state

    NEW,ESTABLISHED,RELATED -j LOG --log-level=1 --log-prefix "Pings

    Logged "

    ```


    If you''re paying attention, you may have spotted the 8 number being used as the
    --icmp-type value. In Table 6.1, you can see the codes that are used by ICMP.
    You can find more information at its Request for Comments (RFC) page, at https://tools.ietf.org/html/rfc792.
    According to this page, ICMP has been around since 1981 or thereabouts,

    When the Internet was a very different animal.


    #### TABLE 6.1 The ICMP Codes from the Kernel Source File, include/linux/icmp.h


    | Type | Code |

    | :--- | :--- |

    | 0 | Echo Reply |

    | 3 | Destination Unreachable * |

    | 4 | Source Quench * |

    | 5 | Redirect |

    | 8 | Echo Request |

    | B | Time Exceeded * |

    | C | Parameter Problem * |

    | D | Time stamp Request |

    | E | Time stamp Reply |

    | F | Info Request |

    | G | Info Reply |

    | H | Address Mask Request |

    | I | Address Mask Reply |


    As a reaction to the attacks that used ICMP, the functions marked with an asterisk
    in Table 6.1 are rate limited by default in modern implementations of the kernel
    (since Linux 2.4.10).

