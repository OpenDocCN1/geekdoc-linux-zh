    ## 一些配置选项


    现在你已经更好地了解了主配置文件的设置，可以检查如何根据你的需求对其进行配置。在许多其他任务中，你将考虑到某些操作的超时在设置服务器时起着作用。


    ## 启动服务


    如果你看到显示 knockd 已禁用的错误信息，请不要报警。这是一项预防措施，以确保在你完成设置之前，knockd 不会对 iptables 引入不希望的更改。


    在 Debian 上，该错误信息要求你在文件 `/etc/default/knockd` 中将以下参数更改为 `1`：


    ```

    START_KNOCKD=1

    ```


    显然，你只有在双击配置或确保你的带外访问（out-of-band access）按预期工作后才会这样做。


    ## 更改默认网络接口


    一旦配置了首选端口序列，你可能想要调整其他参数。在配置文件 (/etc/default/knockd) 中，你有机会更改 `KNOCKD_OPTS` 设置。文件中的示例被注释掉了，这意味着你可以如下所示更改
    knockd 监听的网络接口：


    ```

    KNOCKD_OPTS="-i eth1"

    ```


    这些选项将附加到 knockd 服务中，你需要重启服务以使更改生效，如下（在 systemd 机器上）：


    ```

    systemctl restart knockd

    ```


    ## 数据包类型与计时


    在 `/etc/knockd.conf` 文件中，你可以更改一些设置来精调客户端连接到你的方式。参考列表 1.1，在 `[openSSH]` 部分下，你将添加如下选项：


    ```

    [openSSH]

    tcpflags = syn

    ```


    ## 第1章：隐身斗


    ```

    seq_timeout = 10

    cmd_timeout = 15

    ```


    `tcpf flags` 选项意味着你可以预期 knockd 发送特定类型的 TCP 数据包。在这种情况下，它是 TCP "SYN"。你可以使用的 TCP
    标志包括 `fin`、`syn`、`rst`、`psh`、`ack`、`urg`。如果没有收到指定的 TCP 数据包，knockd 将简单地忽略这些数据包。意识到这种忽略机制通常有效。正常情况下，一个错误的数据包会破坏整个敲门序列的工作，这意味着客户端必须重新开始才能连接。你可以使用逗号分隔多个
    TCP 数据包类型，并且似乎新版本的 knockd（根据更新日志从 0.5 版本开始）使用感叹号来否定数据包类型，例如 `lock`。


    回到示例中的其他选项。你可能注意到列表 1.1 中默认存在 `seq_timeout`。然而，由于你增加了序列设置中的端口数量，你将 `seq_timeout`
    值从 5 增加到了 10。这是因为可能会出现连接缓慢的情况，例如在智能手机上。


    示例中的最后一个选项是 `cmd_timeout`。此选项适用于 knockd 收到成功敲门后发生的情况。事件顺序如下：首先，一旦敲门被确认为有效，knockd
    将运行 `start_command`（如果需要提醒请参考列表 1.1）。如果存在此设置，那么 knockd 执行了 `start_command`，它将在等待
    `cmd_timeout` 指定的时间后运行 `stop_command` 操作。


    这是打开 SSH 服务器访问的首选方式，然后在连接建立后立即关闭。你继续会话不应该遇到任何问题，但新连接需要再次运行敲门序列。将此操作视为在你进入后在身后关上门。你的服务器将变得不可见，只有你请求的流量是可见的。


    ## 测试你的安装


    由于你正在处理服务器的安全性，你应该运行几次测试以确保 knockd 按照预期工作。理想情况下，你有另一台客户端机器来运行一些测试。为了完全确定 knockd
    正确打开并关闭端口，我喜欢通过从不同的 IP 地址进行连接来测试。如果你无法访问不同 IP 地址的连接，你可能定期断开互联网连接，以便你的 ISP 分配一个新的动态
    IP 地址进行测试。某些宽带提供商重启后这样做，你的移动运营商也可能这样做。


