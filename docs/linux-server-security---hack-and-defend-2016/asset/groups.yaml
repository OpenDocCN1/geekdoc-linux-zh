  md: "\n# Chapter 7: Nmap's Prodigious NSE\n\n| Category | Description |\n|---|---|\n\
    | intrusive | Ostracized to this unpleasant category, these scripts are very risky\
    \ to run and won't make it to the safe category. Some of the risks include crashes,\
    \ bandwidth saturation, and being spotted by sysadmins on target machines. |\n\
    | malware | Known malware leaves certain system traces, such as backdoors or signs\
    \ of infection. Unusual port numbers and service oddities are searched for malware\
    \ scripts. |\n| safe | This set is less likely to offend the sysadmins of target\
    \ systems. Still, you shouldn't rely on these scripts to cause problems. |\n|\
    \ version | You can't select these scripts directly because they are an extension\
    \ to NSE's version detection functionality. They execute if the version detection\
    \ option (-sv) is used |\n| vuln | If vulnerabilities are discovered, then this\
    \ set will alert you about them; otherwise, little noise will be made. Examples\
    \ are realvnc-auth-bypass and afp-path-vuln. |\n\n# Contributing Factors\n\nWhen\
    \ the default set of scripts is used, you might be surprised by how the mighty\
    \ NSE reaches its decisions. There are no set thresholds; rather, it reaches a\
    \ kind of score after running through the following criteria.\n\n- Speed — default\
    \ scans must be completed swiftly, for example, so no brute forcing is employed.\n\
    - Usefulness — if a script doesn't produce useful results, then you can forget\
    \ its inclusion in default scripts.\n- Verbosity — the resulting output of running\
    \ a script needs to be succinct. Equally, when there's nothing to report, silence\
    \ is a virtue.\n- Reliability — inevitably, assumptions and guesses are made during\
    \ the operation of some scripts. However, if there are frequently errors, then\
    \ it shouldn't be run in the default category.\n- Intrusiveness — if a script\
    \ causes guards to suddenly appear, then it's probably too intrusive for the default\
    \ set of scripts.\n- Privacy — along the same line as the external set of scripts,\
    \ the default scripts need to respect your privacy and not reveal your presence.\n\
