    # Chapter 3: Twenty-First-Century Netcat


    However, the documentation point out a problem with this scenario. The issue is
    that Neymar can''t talk back to Lionel. As you''d expect from the powerful netcat,
    there''s a work-around. When I look at this example, I immediately think of exploits
    deployed for nefarious around. (I you''ll see why in a moment). Now look at the
    following set of commands:


    ```

    Neymar # ncat -l 1234 > newlog.log

    Luis # ncat -l 1234 --sh-exec ncat Neymar 1234

    Lionel # ncat --send-exec Luis 1234 < logfile.log

    ```


    To my mind, the scary option in this example is a new shell command when Luis
    receives data. Imagine the damage that you can cause with such an option, being
    able to launch any command. In this example, Luis receives a connection, he spawns
    a new netcat instance and handles both the inputs and outputs of Lionel and Neymar''s
    communications. It''s very sophisticated.


    Here is a port-forwarding example from the documentation, dealing with HTTP again,
    where you execute a shell command to forward traffic:


    ```

    # ncat -l localhost 80 --sh-exec "ncat www.chrisbinnie.tld 8100"

    ```


    You simply forward data destined for TCP port 800 on your local machine to anchor
    another host on TCP port 6100.


    # Secure Communications


    I mentioned SSL earlier and how netcat can interact with encrypted traffic, though
    it''s a worrying possibility to consider. I''ll start this section with an example
    of how netcat can encrypt its own traffic. You use the -C switch (sometimes called
    connect mode):


    ```

    # ncat -C --ssl ssl.chrisbinnie.tld 443

    ```


    Here you''re assuming that your trusted machine, ssl.chrisbinnie.tld is running
    an SSL server on TCP port 443 and you can connect to it. Surprisingly, for SSL
    servers that use certificates for authentication, the mighty netcat can be very
    useful.


    You simply point netcat at location of your PEM certificate and private key files,
    using the --ssl-cert and --ssl-key options respectively within the command. You
    can point both options at the same file if you like.


    One important factor when exchanging certificates, along with encrypting communications,
    is the act of confirming (via a third-party service''s stamp of approval) the
    SSL server''s identity is valid. Netcat is able to serve such a request by using
    this command:


    ```

    # ncat -C --ssl-verify ssl.chrisbinnie.tld 443

    ```'
  - '[PAGE 45]


    # Chapter 3: Twenty-First-Century Netcat


    According to the documentation, netcat is able to check SSL certificates as follows:


    Verification is done using the ca-bundle.crt certificate bundle shipped with Ncat,
    plus whatever trusted certificates the operating system may provide. If you want
    to verify a connection to a server whose certificate is not signed by one of the
    default certification authorities, use the ssl-trustfile to name a file containing
    your certificates. The file must be in PEM format.


    ```

    https://map.org/ncat/guide/ncat-ssl.html

    ```


    The docs continue and offer the correct syntax for an SSL command as follows:


    ```

    # ncat -C --ssl-verify --trustfile <custom-certs.pem> <server>

    443

    ```


    Now that you can confirm which machine you are connecting to, let''s look at another
    SSL function that is available to netcat. It has many capabilities, as you''ll
    see when you explore it.


    This function is referred to as having the ability to "unwrap" SSL. The documentation
    suggests that if you''re trying to collect e-mail from an SSL-enabled mail server
    but you don''t have SSL capabilities in your mail client, then netcat can assist.


    You begin by pointing the aforementioned netcat client at your localhost, your
    local machine, or IP address 127.0.0.1. With netcat listening locally on TCP port
    143 (the port commonly used for unencrypted IMAP communications), you can then
    forward your traffic to your mail server, TCP port 993, as follows:


    ```

    # ncat -l localhost 143 --sh-exec "ncat --ssl mail.chrisbinnie.tld

    993"

    ```


    You can use this method for any protocol that uses two hosts, like HTTP, for example,
    not necessarily well when multiple hosts are involved.


    Netcat can even act as an SSL server. You need to supply a certificate that, in
    a reversal to the previous example, may be verified by visiting clients.


    Without specifying a certificate file and a private key — and using the same options
    as before (--ssl-cert and --ssl-key) — netcat will automatically generate them
    for you. You can start netcat using the -l option (or its -listen equivalent)
    as follows:


    ```

    # ncat -v --listen --ssl

    ```


    As you see in Figure 3.1, the accommodating netcat generates a temporary key making
    easier for you to get started.'
