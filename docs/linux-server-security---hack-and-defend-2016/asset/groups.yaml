    knowledge to carry out even more sophisticated attacks. You might be surprised
    how easy it is, however, running only a handful of commands and with only a little
    database knowledge, to bring a vulnerable service to its knees. For reason alone,
    it is imperative that IT professionals be aware of the risks SQL injections pose
    and how to mitigate their effects.


