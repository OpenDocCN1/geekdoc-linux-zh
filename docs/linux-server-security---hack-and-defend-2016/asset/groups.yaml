    ## Monitoring Filesystems


    One method of watching for changes on filesystems is by using notify. You need
    a compatible kernel to work correctly. Fear not, because notify is reportedly
    included in kernels from version 2.6.13 and after, so most Linux builds will have
    this capability.


    The sophisticated notify can monitor, in real time, single files and directories
    for changes, altering configured software if any changes are discovered. If a
    piece of users space is caught making changes, then notify will pass on details
    about the user or consider it an event and report it immediately. By creating
    a watch list, notify can keep track of unique descriptors that associate to each
    item in its watch. Although notify will not pass details about the user or process
    that has changed a file or directory, the fact that a change has place is enough
    to satisfy most applications. If notify isn''t available, then the lower approach
    of polling a filesystem or manually running scans will usually apply. In the case
    of checking for changes on networked filesystems, any configured software will
    need to resort to polling the filesystem using a predefined frequency. This is
    because recursive filesystems are harder to track of. Unfortunately, pseudo filesystems,
    which include /proc, /sys, and /dev/pts, aren''t visible to notify. This shouldn''t
    be of much concern, however, because "real" files don''t exist in these paths.


