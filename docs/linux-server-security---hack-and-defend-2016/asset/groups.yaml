    address that every device in the local network''s broadcast domain to respond.
    If every device responds at the same time and then responds to others’ responses,
    a denial of service is caused by too much traffic on the network. As with all
    kernel settings, though, it''s useful to know the background to help you understand
    how networking works.


    Another attack (harking from 1996) was the Ping of Death, and crafted massive
    ICMP packets with the hope of crashing the remote machine. It affected many of
    the popular working systems (at release 18 operating systems were found to be
    vulnerable). Simply knowing an IP address and firing ICMP packets greater than
    65,536 bytes at IP address caused the machine to which it aimed to crash. There
    is more information from the external Insecure.org, http://insecure.org/exploits/ping-o-death.html.


    Another commonly discussed attack yesterday involved a man-in-the-middle (MITM),
    and was called a smurf attack. Smurf attacks are a good illustration of how spoofing
    can work, and belong to a type of attack that has recently become more frequent,
    called an amplification attack.


    The middleman is put to good use so that the original source of the attack can''t
    be identified, and the attack''s aim is to saturate bandwidth, ultimately causing
    a denial of service. Woringly, the barrage of ICMP traffic actually appears to
    come from the victims themselves sends a normal echo-reply to the victim, who
    didn''t even ask for a response. They also have little of stopping the packets
    from arriving. Back in the earlier days of the Internet, your ISP could disable
    all ICMP traffic to stop the massive flood of data. Because the packets were spoofed,
    even the logs were of little help in tracking down where originated.


    One solution to this problem is to rate-limit the packets yourself. This leaves
    ICMP free to arrive, and your network running normally, although possibly a little
    slower.


    This can be achieved on proprietary hardware, such as Cisco or Juniper, but also
    on individual hosts using iptables with a set of rules like this:


    ```

    # iptables - INPUT -p icmp -m limit --limit 30/minute --limit-burst

    60 -j ACCEPT

    # iptables - INPUT -p icmp -m limit --limit 6/minute --limit-burst

    10 -j LOG

    # iptables - INPUT -p icmp -j DROP

    ```


    From the config shown on the first line, the --limit-burst option allows up to
    60 packets to arrive initially before the rate limit of one packet every second
    is enabled (the 30/minute value). The second line says that you will log (though
    much more strictly) how much traffic is accepted before being logged to syslog:
    six entries per minute after a burst of ten packets. Finally, you''ll discard
    those packets in order to mitigate any effect.


