    seq_timeout = 10

    cmd_timeout = 15

    ```


    The tcpf flags options mean that you can expect a specific type of TCP packet
    to be sent for knockd. That''s a TCP "SYN" in this case. The TCP flags that you
    can use are fin, syn, rst, psh, ack, urg. If the specified type of TCP packet
    isn''t received, then knockd will simply ignore those packets. By being aware
    that this ignore knockd usually works. Normally an correct packet would stole
    the entire knocking sequence from working, which would mean that the client would
    have to start again in order to connect. You can separate multiple TCP packet
    types using commas, and it appears that newer versions (from version 0.5 according
    to the changelog) knockd use exclamation marks to negate the packet type, such
    as lock.


    Back to the other options in the example. You may have noticed that seq_timeout
    is already present in Listing 1.1 by default. However, because you have increased
    the number of ports within your sequence setting, you upped the seq_timeout value
    to 10 rather than 5. This is needed because of a slow connection, as your smart-phones,
    may occur.


    The final option in the example is cmd_timeout. This option applies to what happens
    after knockd has received a successful knock. The sequence of events is as follows.
    First, once the port knocking has been confirmed as valid, knockd will run the
    start_command (refer to Listing 1.1 if you need a reminder). If this setting is
    present, then knockd has executed the start_command, it will only wait for the
    time specified in cmd_timeout before running the stop_command action.


    This is the preferred way to open up your SSH server for access, and then promptly
    close it down your connection is established. You shouldn''t have any problems
    continuing with your session, but new connections will need to run through the
    port-knocking sequence again. Think of this action as closing the door behind
    you once you''ve entered. Your server will become invisible, and only your requested
    traffic will be visible.


    # Testing Your Install


    Because you are dealing with the security of a server, you should run a few tests
    to see that knockd is working as expected. Ideally you will have access to another
    client machine to run some tests. To be completely sure that knockd is opening
    and closing ports correctly, I like to test by connecting from a completely different
    IP address. If you don''t have access to a connection with a different IP address,
    then you might be able to drop your Internet connection periodically so that your
    ISP will allocate a new dynamic IP address to test. Some broadband providers will
    do this after a reboot or your mobile provider might too in addition.'
