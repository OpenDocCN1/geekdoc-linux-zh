    # Chapter 5: Nping


    Many other command line options are available for Nping. For example, you can
    add --debug to assist you with more detail. You can also alter TTLs (Time To Live
    settings). If you''re scanning many hosts, you might also want to add a timeout
    option so that you''re asking Nping to wait around for a response --host-timeout
    10, where the 10 is a measure in seconds.


    I briefly mentioned spoofing IP addresses in order to forge the IP address; Nping
    can go one step further and empower the sender field with random values, by using
    a command like this whiteheat.chrisbinnie.tld:


    ```

    # nping --arp --sender-ip random --ttl random whiteheat.chrisbinnie.tld

    ```


    Alarm bells ring when you first read about this. Being able to spoof an IP address
    with random values (successfully) should cause any sysadmin to be concerned. It
    takes poorly configured upstream routers to allow this type of traffic to arrive
    on an organization''s network.


    Finally, if you want to adjust the channel which is used for Echo mode, then --channel-tcp
    or --channel-udp will do that:


    ```

    # ping --vvv --client --channel --tcp 1234 --tcp -p 8100 localhost

    ```


    As you might imagine, having the ability to adjust Echo mode to send its "channel"
    data back to the client via both TCP and UDP might be a lifesaver if strict firewall
    gets in the way.


    # Summary


    If you experiment with Nping over time, you should appreciate that the report-ing
    offers is truly extensive. I''d encourage you to reach for Nmap whenever you have
    the opportunity, to gain more exposure.


    With its packet-crafting possibilities, the powerful Nping can outdo many of its
    rivals. The addition of the spoofing Echo mode means if you have access to both
    ends of a connection, there''s less chance of a device escaping detection. As
    a result, troubleshooting should be much swifter and less difficult.


    Nmap''s powerful Nping might be considered as just one tool inside a white hat''s
    toolkit. By using tools such as these legally, you will excel at your intended
    tasks, and as a welcome afterthought, you''ll learn how to keep your own servers
    up and running.'
