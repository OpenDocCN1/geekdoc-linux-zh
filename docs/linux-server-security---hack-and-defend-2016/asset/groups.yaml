    # Nmap’s Prodigious NSE


    Even nice sysadmins have probably heard of run port scans against local and remote
    hosts. They may also have heard of one famous port scanner on the market, created
    by the Nmap Project, named Nmap stands for “Network Mapper,” and along with superfast,
    sophisticated, and efficient, it’s brimming with features.


    Among its many features, you can test for operating system a remote server is
    running, audit the security of both local and remote machines, and create an inventory
    of the machines and their active services on a network.


    You may have used Nmap for scanning in the past, but there’s a good chance that
    you didn’t realize what a powerful penetration-testing tool it is. This is partly
    thanks to its sophisticated built-in scripting engine. Before you look at it,
    however, you will first review Nmap’s basic port scanning functionality. Then
    you will learn how Nmap can be used for more advanced white hat activities.


    # Basic Port Scanning


    Even the basic (port scanning) features bundled with Nmap include advanced options
    such as figuring your source IP address (using the -S option). A magnificent selection
    of features is available. But first, let’s start with installing the package.


    To install Nmap on Red Hat distributions, you can use the following command:


    ```

    # yum install nmap

    ```


    On Debian and its derivatives, you can use the following command:


    ```

    # apt-get install nmap

    ```


    If you want to use RPM Package Managers on Red Hat derivatives rather than running
    these commands, you can find more information at https://nmap.org/book/book-linux.html.


    If you are familiar with the file /etc/services on Unix-type machines, then the
    inclusion of /usr/share/nmap/map-services file should make sense. Be aware that
    your file’s location may change slightly. Within this file, you need numbers to
    handle readable service names — a little like localized DNS, I suppose the /etc/hosts
    file where there’s a key:value format). One in the Nmap version of this file would
    look like this:


    | Service name | Protocol | Open-frequency | Optional comments |

    |---|---|---|---|

    | ftp | | 21/tcp | # File |

    | Transfer | [Control] | | |


