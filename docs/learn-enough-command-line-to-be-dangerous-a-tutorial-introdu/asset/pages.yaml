    Of course, this is only one step on a longer journey, both toward command-line
    excellence (Box 13) and software development wizardry. As you proceed on this
    journey, you will probably discover that learning computer magic can be exciting
    and empowering, but it can also be *hard*. Indeed, you may already have discovered
    this fact, either on your own or while doing this tutorial. To those brave magicians-in-training
    who wish to proceed, I offer the following sequence, which is currently in preparation:


