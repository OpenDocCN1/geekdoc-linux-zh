  md: '**hello** prints “hello” and then returns another prompt. Note that, for brevity,
    I’ve omitted all characters in the prompt except the trailing dollar sign $.


    Just to make the pattern clear, let’s try a second **echo** command:


    ```

    ```

    $ echo "goodbye"

    goodbye

    $ echo ''goodbye''

    goodbye

    $

    ```

    ```


    Note here that we’ve wrapped “goodbye” in quotation marks—and we also see that
    we can use either double quotes, as in `"goodbye"`, or single quotes, as in `''goodbye''`.
    Such quotes can be used to group strings visually, though in many contexts they
    are not required by **echo** (Listing 1).


    # **Listing 1: Printing “hello, goodbye” two different ways.**


    ```

    ```

    $ echo hello, goodbye

    hello, goodbye

    $ echo "hello, goodbye"

    hello, goodbye

    $

    ```

    ```


    One thing that can happen when using quotes is accidentally not matching them,
    as follows:


    ```

    ```

    $ echo "hello, goodbye

    >

    ```

    ```


    At this point, it seems we’re stuck. There are specific ways out of this quandary
    (in fact, in this case you can just add a closing quote and hit return), but it’s
    good to have a general strategy for getting out of trouble (Figure 7). ⁶ This
    strategy is called “Ctrl-C” (Box 4).'
