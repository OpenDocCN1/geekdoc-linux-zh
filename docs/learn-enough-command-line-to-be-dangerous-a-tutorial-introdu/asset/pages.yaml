    # ## 1.4 Editing the line


    Command lines include several features to make it easy to repeat previous commands,
    possibly in edited form. The most basic is “up arrow”, which simply retrieves
    the previous command. Pressing up arrow again moves further up the list of commands,
    while down arrow goes back toward the bottom.


    When typing a new command, or dealing with a previous command, it is often convenient
    to be able to move quickly within the line. For example, suppose we typed


    ```

    $ goodbye

    ```


    only to realize that we wanted to put **echo** in front of it. We could use the
    left arrow key to get to the beginning of the line, but it’s easier to type `Ctrl-A`,
    which takes us there immediately. Similarly, `Ctrl-E` moves to the end of the
    line.$^9$ Finally, `Ctrl-U` clears to the beginning of the line and lets us start
    over.


    The combination of `Ctrl-A`, `Ctrl-E`, and `Ctrl-U` will work on most systems,
    but they don’t do you much good if you’re editing a longer line, such as this
    one containing the first line of *Sonnet 1* by William Shakespeare (Listing 4).'
