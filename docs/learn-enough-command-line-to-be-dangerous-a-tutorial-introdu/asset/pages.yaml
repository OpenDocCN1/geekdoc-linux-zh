  md: 'Note that, on many systems, by default you will be prompted to confirm the
    removal of the file. Any answer starting with the letter “y” or “Y” will cause
    the file to be deleted, and any other answers will prevent the deletion from occuring.


    By the way, in the calls to `cp` and `rm` above, I would almost certainly not
    type out `test_file.txt` or `second_test.txt`. Instead, I would type something
    like `tes<tab>` or `sec<tab>` (where `<tab>` represents the tab key), thereby
    making use of *tab completion* (Box 8).


    # Box 8. **Tab completion**


    Most modern command-line programs (shells) support *tab completion*, which involves
    automatically completing a word if there’s only one valid match on the system.
    For example, if the only file starting with the letters “tes” is `test_file`,
    we could create the command to remove it as follows:


    ```

    $ rm tes<tab>

    ```


    The shell would then complete the filename, yielding `rm test_file`. Especially
    with longer filenames (or directories), tab completion can save a huge amount
    of typing. It also lowers the *cognitive load*, since it means you don’t have
    to remember the full name of the file—only its first few letters.


    If the match is *ambiguous*, as would happen if we had files called `foobarquux`
    and `foobazquux`, the word will be completed only as far as possible, so


    ```

    $ ls foo<tab>

    ```


    would be completed to


    ```

    $ ls fooba

    ```


    If we then hit tab *again*, we would see a list of matches:'
  merge: -1
  img_proc: true
