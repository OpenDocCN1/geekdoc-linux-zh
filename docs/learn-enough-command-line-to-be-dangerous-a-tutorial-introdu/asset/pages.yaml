    ```


    Here *.txt (read “star dot tee-ex-tee”) automatically expands to all the file-names
    that match the pattern “any string followed by .txt”.


    There are three particularly important optional forms of ls, starting with the
    “long form”, using the option -l (read “dash-ell”):


    ```

    $ ls -l *.txt

    total 16

    -rw-r--r-- 1 mhartl staff 87 Jul 20 18:05 sonnet_1.txt

    -rw-r--r-- 1 mhartl staff 294 Jul 21 12:09 sonnet_1_reversed.txt

    ```


    For now, you can safely ignore most of the information output by ls -l, but note
    that the long form lists a date and time indicating the last time the file was
    modified. The number before the date is the size of the file, in bytes.$^{13}$


    A second powerful ls variant is “list by reversed time of modification (long format)”,
    or ls -rtl. This is particularly useful when there are a lot of files in the directory,
    but you really only care about seeing the ones that have been modified recently,
    such when confirming a file download. We’ll see an example of this in Section
    3.1, but you are free to try it now:


    ```

    $ ls -rtl

    <results system-dependent>

    ```


    By the way, -rtl is the commonly used compact form, but you can also pass the
    options individually, like this:


    ```

    $ ls -r -t -l

    ```


    > $^{13}$A bit is one piece of yes-or-no information (such as a 1 or a 0), and
    a byte is eight bits. Bytes are probably most familiar from “megabytes” and “gigabytes”,
    which represent a million and a billion bytes, respectively. (The official story
    is a little more complicated, but level of detail here is certainly enough to
    be dangerous.)'
