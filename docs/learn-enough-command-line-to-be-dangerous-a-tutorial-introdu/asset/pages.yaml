  md: '# Box 12. Combining commands


    It’s often convenient to combine commands at the command line, such as when installing
    software using the Unix programs configure and make, which often appear in the
    following sequence:


    ```

    $ ./configure ; make ; make install

    ```


    This line runs the configure program from the current directory . , and then runs
    both make and make install . (You are not expected to understand what these programs
    do, and indeed they won’t work on your system unless you happen to be in the directory
    of a program designed to be installed this way.) Because they are separated by
    the semicolon character ;, three commands are run in sequence.


    An even better way to combine commands is with the double-ampersand &&:


    ```

    $ ./configure && make && make install

    ```


    The difference is that commands separated by && run only if the previous command
    succeeded . In contrast, with ; all the commands will be run no matter what, which
    will cause an error in the likely case that subsequent commands depend on the
    results of the ones that precede them.


    I especially like to use && in combination with cd -, which lets me do things
    like this:


    ```

    $ build_article && cd ~/tau && deploy && cd -

    ```


    Again, you are not expected to understand these commands, but the general idea
    is that we can (say) build an article in one directory, cd to a different directory,
    deploy (perhaps a website) to production, and then cd back (cd -) to the original
    directory, where we can continue our work. Then, if need be, we can just use up
    arrow (or one of the techniques from Box 9) to retrieve the whole thing and do
    it all again.'
