  md: '# ### 2.1 Redirecting and appending


    Let’s pick up (more or less) where we left off in Section 1, with an **echo**
    command to print out the first line of Shakespeare’s first sonnet (Listing 4):


    ```

    $ echo "From fairest creatures we desire increase,"

    From fairest creatures we desire increase,

    ```


    Our task now is to create a file containing this line. Even without the benefit
    of a text editor, it is possible to do this using the *redirect operator* `>`:


    ```

    $ echo "From fairest creatures we desire increase," > sonnet_1.txt

    ```


    (Recall that you can use up arrow to retrieve the previous command rather than
    typing it from scratch.) Here the right angle bracket `>` takes the string output
    from **echo** and redirects its contents to a file called **sonnet_1.txt**.


    How can we tell if the redirect worked? We’ll learn some more advanced command-line
    tools for inspecting files in Section 3, but for now we’ll use the **cat** command,
    which simply dumps the contents of the file to the screen:


    ```

    $ cat sonnet_1.txt

    From fairest creatures we desire increase,

    ```


    The name **cat** is short for “**c**oncate**n**ate”, which is a hint that it can
    be used to combine the contents of multiple files, but the usage above (to dump
    the contents of a single file) is extremely common. Think of **cat** as a “quick-and-dirty”
    way to view the contents of a particular file (Figure 12).<sup>11</sup>


    In order to add the second line of the sonnet (in modernized spelling), we can
    use the *append operator* `>>` as follows:


    <sup>11</sup>Image retrieved from https://www.flickr.com/photos/tiffanyday/4076289864
    on 2015-07-22'
