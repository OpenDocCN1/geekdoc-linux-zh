    it, create a file **bar** with content "baz", print out **bar**''s contents, and
    then `cd` back to your home directory. *Hint: Combine the commands as described
    in Box 12.*

    +   2. What happens when you run the previous command again? How many of the commands
    executed? Why?

    +   3. Explain why the command `rm -rf /` is unbelievably dangerous, and why you
    should never type it into a terminal window, not even as a joke.

    +   4. How can the previous command be made even more dangerous? *Hint: Refer
    to Box 11. (This command is so dangerous you shouldn''t even think it, much less
    type it.)*'
