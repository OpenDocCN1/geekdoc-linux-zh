  md: 'Here the three numbers indicate how many lines, words, and bytes there are
    in the file, so there are 2620 lines (thereby fulfilling the promise made at the
    end of Section 3.1), 17670 words, and 95635 bytes.


    You are now in a position to be able to guess one method for determining how many
    lines are in head sonnets.txt. In particular, we can combine head with the redirect
    operator (Section 2.1) to make a file with the relevant contents, and then run
    wc on it, as shown in Listing 11.


    ```

    ```text

    Listing 11: Redirecting head and running wc on the result.

    $ head sonnets.txt > sonnets_head.txt

    $ wc sonnets_head.txt

    10    46    294 sonnets_head.txt

    ```

    ```


    We see from Listing 11 that there are 10 lines in head wc (along with 46 words
    and 294 bytes). The same method, of course, would work for tail.


    On the other hand, you might get the feeling that it''s a little unclean to make
    an intermediate file just to run wc on it, and indeed there''s a way to avoid
    it using a technique called pipes. Listing 12 shows how to do it.


    ```

    ```text

    Listing 12: Piping the result of head through wc.

    $ head sonnets.txt | wc

    10    46    294

    ```

    ```


    The command in Listing 12 runs head sonnets.txt and then pipes the result through
    wc using the pipe symbol | (Shift-backslash on QWERTY keyboards). The reason this
    works is that the wc command, in addition to taking a filename as an argument,
    can (like many Unix programs) take input from “standard in” (compare to “standard
    out” mentioned in Section 1.2), which in this case is the output of head sonnets.txt
    shown in Listing 9. The wc program takes this input and counts it the same way
    it counts a file, yielding the same line, word, and byte counts as Listing 11.'
