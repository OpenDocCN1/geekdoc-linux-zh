    created the file as expected. (If you do have to repeat the curl command, you
    could press up arrow twice to retrieve it, but see Box 9 for alternatives.)


    **Box 9. Repeating previous commands**


    Repeating previous commands is a frequent task when using the command line. So
    far in this tutorial, we’ve used the up-arrow key to retrieve (and possibly edit)
    previous commands, but this isn’t the only possibility. An even quicker way to
    find and immediately run a previous command involves using the exclamation point
    !, which in the context of software development is usually pronounced “bang”.
    To run the previous command exactly as written, we can use “bang bang”:

    ```bash

    $ echo "foo"

    foo

    $ !!

    ```'
