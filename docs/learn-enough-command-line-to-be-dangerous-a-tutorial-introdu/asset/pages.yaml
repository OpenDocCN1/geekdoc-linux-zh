    # **Box 3. What is the prompt?**


    Every command line starts with some symbol or symbols designed to “prompt” you
    to action. The prompt usually ends with a dollar sign $, and is preceded by information
    that depends on the details of your system. For example, on some systems the prompt
    might look like this:


    ```

    ```

    Michael''s MacBook Air:~ mhartl$

    ```

    ```


    In Figure 4, the prompt looks like this instead:


    ```

    ```

    [~]$

    ```

    ```


    and in Figure 5 it looks like this:


    ```

    ```

    [projects]$

    ```

    ```


    Finally, the prompt I’m looking at right now looks like this:


    ```

    ```

    [learn_enough_command_line (master)]$

    ```

    ```


    For the purposes of this tutorial, the details of the prompt are not important,
    but we will discuss useful ways to customize the prompt starting in the next tutorial
    after this one (*Learn Enough*™ *Text Editor to Be Dangerous*).'
