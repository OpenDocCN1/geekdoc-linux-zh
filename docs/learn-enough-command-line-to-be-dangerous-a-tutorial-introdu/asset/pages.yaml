    # ## 4.4 Renaming, copying, and deleting directories


    The commands for renaming, copying, and deleting directories are similar to those
    for files (Section 2.3), but there are some subtle differences worth noting. The
    command with the least difference is mv, which works just as it does for files:


    ```

    $ mkdir foo

