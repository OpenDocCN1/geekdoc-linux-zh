    This issue with trailing slashes never makes a difference with mv, but with cp
    it can be a source of much confusion. In particular, when copying directories,
    the behavior you usually want is to copy the directory contents *including* the
    directory, which on many systems requires leaving off the trailing slash. When
    copying files, you also need to include the -r option (for "recursive"). For example,
    to copy the contents of the text_files directory to a new directory called foobar,
    we use the command shown in Listing 17.


    ```

    **Listing 17: Copying a directory.**

