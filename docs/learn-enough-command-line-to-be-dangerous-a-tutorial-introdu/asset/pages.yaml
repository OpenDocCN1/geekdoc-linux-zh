    # ## 3 Inspecting files


    Having seen how to create and manipulate files, now it’s time to learn how to
    examine their contents. This is especially important for files too long to fit
    on a single screen. In particular, we saw starting in Section 2.1 how to use the
    cat command to dump the file contents to the screen, but this doesn’t work very
    well for longer files.


    # ### 3.1 Downloading a file


    To give us a place to start, rather than creating a long file by hand (which is
    cumbersome) we’ll download a file from the Internet using the powerful curl utility,
    which allows us to interact with URLs at the command line. Although it’s not part
    of the core Unix command set, the curl command is widely available on Unix systems.
    To make sure it’s available on your system, we can use the which command, which
    looks to see if the given program is available at the command line.14 The way
    to use it is to type which followed by the name of the program—in this case, curl:


    ```

    $ which curl

    /opt/curl

    ```


    14 Technically, which locates a file on the user’s path, which is a list of directories
    where executable programs are located.'
