    Modernized treatments of the Sonnets sometimes emend Rose to rose (thereby obscuring
    the likely meaning), and we can make a second file following this convention using
    two more calls to echo:


    ```

    $ echo "From fairest creatures we desire increase," > sonnet_1_lower_case.txt

    $ echo "That thereby beauty''s rose might never die," >> sonnet_1_lower_case.txt

    ```


    In order to facilitate the comparison of files that are similar but not identical,
    Unix systems come with the helpful diff command:


    ```

    $ diff sonnet_1.txt sonnet_1_lower_case.txt

    < That thereby beauty''s Rose might never die,

    ---

    > That thereby beauty''s rose might never die,

    ```


    When discussing computer files, diff is frequently employed both as a noun ("What''s
    the diff between those files?") and as a verb ("You should diff the files to see
    what changed."). As with many technical terms, this sometimes bleeds over into
    common usage, such as "Diff present ideas against those of various past cultures,
    and see what you get."^12




