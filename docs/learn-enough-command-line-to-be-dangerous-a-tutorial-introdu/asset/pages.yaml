    $ cd foo/

    -bash: cd: foo: No such file or directory

    $ cd bar/

    ```


    Here the error message indicates that the mv worked: there is no file or directory
    called foo. (The word bash refers to the shell being run, in this case the “Bourne
    Again Shell”.) The only minor subtlety is that the trailing slashes (which are
    typically added automatically by tab completion (Box 8)) are optional:'
