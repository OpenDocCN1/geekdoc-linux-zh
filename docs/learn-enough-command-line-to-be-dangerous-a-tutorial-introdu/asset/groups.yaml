    When forty winters shall besiege thy brow,

    And dig deep trenches in thy beauty''s field,

    sonnets.txt

    ```


    **less** 的要点在于它允许你通过文件以几种有用的方式导航，例如使用箭头键向上或向下一行，按空格键向下翻一页，按 **Ctrl-F** 向前翻一页（即与空格键相同）或按
