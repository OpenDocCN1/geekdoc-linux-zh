  - '[PAGE 15]


    In every case, the solution is the same: hit `Ctrl-C` (pronounced “control-see”).
    Here `Ctrl` refers to the “control” key on your keyboard, and `C` refers to the
    key labeled “C”. `Ctrl-C` thus means “While holding down the control key, press
    C.” In particular, `C` does *not* refer to the capital letter `C`, so you should
    not press Shift in addition to Ctrl. (`Ctrl-C` sends a *control code* to the terminal
    and has nothing to do with producing a capital `C` when typing normal text.) The
    result of typing `Ctrl-C` is sometimes written as `^C`, like this:


    ```

    $ tail

    ^C

    ```


    The **origins of Ctrl-C** are somewhat obscure, but as a mnemonic I like to think
    of it as meaning “cancel”. However you remember it, *do* remember it: when you
    get into trouble at the command line, your best bet is usually to hit `Ctrl-C`.


    *Note:* When `Ctrl-C` fails, 90% of the time hitting `ESC` (escape) will do the
    trick.


