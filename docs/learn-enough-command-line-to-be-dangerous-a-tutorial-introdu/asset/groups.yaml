  md: "\n## Exercises\n\nAt the end of each of the exercises below, use the `cat`\
    \ command to verify your answer.\n\n1. Using `echo` and `>`, make files called\
    \ `line_1.txt` and `line_2.txt` containing the first and second lines of Sonnet\
    \ 1, respectively.\n2. Replicate the original `sonnet_1.txt` (containing the first\
    \ two lines of the sonnet) by first redirecting the contents of `line_1.txt` and\
    \ then appending the contents of `line_2.txt`. Call the new file `sonnet_1_copy.txt`,\
    \ and confirm using `diff` that it’s identical to `sonnet_1.txt`. *Hint: When\
    \ there is no diff between two files, `diff` simply outputs nothing.*\n3. Use\
    \ `cat` to combine the contents of `line_1.txt` and `line_2.txt` in reverse order\
    \ using a *single* command, yielding the file `sonnet_1_reversed.txt`. *Hint:\
    \ The `cat` command can take multiple arguments.*\n\n### 2.2 Listing\n\nPerhaps\
    \ the most frequently typed command on the Unix command line is `ls`, short for\
    \ “list” (Listing 6).\n\n**Listing 6:** Listing files and directories with `ls`.\
    \ (Output will vary.)\n```\n$ ls\nDesktop\nDownloads\nsonnet_1.txt\nsonnet_1_reversed.txt\n\
    ```\n\n> The verb “diff” is computer jargon, but it’s the only word with exactly\
    \ the sense I want. It comes from the Unix `diff` utility, which yields a list\
    \ of all the differences between two files. More generally it means an unselective\
    \ and microscopically thorough comparison between two versions of something.\n\
    \n![](img/4dec9c51e73c9027d3d8a4fab4408fe6_31_0.png)\n\nFigure 13: The graphical\
    \ equivalent of `ls`.\n\nThe **ls** command simply lists all the files and directories\
    \ in the current directory (except for those that are *hidden*, which we’ll learn\
    \ more about in a moment). In this sense, it’s effectively a command-line version\
    \ of the graphical browser used to show files and directories (also called “folders”),\
    \ as seen in Figure 13. (We’ll sharpen our understanding of directories and folders\
    \ in Section 4.) As with a graphical file browser, the output in Listing 6 is\
    \ just a sample, and results will differ based on the details of your system.\
    \ (This goes for all the **ls** examples, so don’t be concerned if there are minor\
    \ differences in output.)\n\nThe **ls** command can be used to check if a file\
    \ (or directory) exists, because trying to **ls** a nonexistent file results in\
    \ an error message, as seen in Listing 7.\n\n**Listing 7: Running `ls` on a nonexistent\
    \ file.**\n```\n$ ls foo\nls: foo: No such file or directory\n$ touch foo\n$ ls\
    \ foo\nfoo\n```\n\nListing 7 uses the `touch` command to create an empty file\
    \ with name `foo` (Box 7), so the second time we run `ls` the error message is\
    \ gone. (The stated purpose of `touch` is to change the modification time on files\
    \ or directories, but (ab)using `touch` to create empty files as in Listing 7\
    \ is a common Unix idiom.)\n\n### Box 7. Foo, bar, baz, etc.\n\nWhen reading about\
    \ computers, you will encounter certain strange words—words like *foo*, *bar*,\
    \ and *baz*—with surprising frequency. Indeed, in addition to `ls foo` and `touch\
    \ foo`, we have already seen four such references in this tutorial: in a typical\
    \ command-line command (Figure 2), in a virtual machine password (`foobar!`, Box\
    \ 2), again when getting out of trouble (`grep foobar`, Box 4), and yet again\
    \ in a man page (Listing 3). The first three were my own uses, but the last I\
    \ had nothing to do with:\n\n```\n    . . .if name contains a slash (/) then man\
    \ interprets\n    it as a file specification, so that you can do man\n    ./foo.5\
    \ or even man /cd/foo/bar.1.gz.\n```\n\nHere we see both *foo* and *bar* making\
    \ an appearance in the man page for *man* itself—an unambiguous testament to their\
    \ ubiquity in computing.\n\nWhat is the origin of these odd terms? As usual, the\
    \ **Jargon File** (via its entry on *foo*) enlightens us:\n\n**foo**: /foo/\n\n\
    1. interj. Term of disgust.\n2. [very common] Used very generally as a sample\
    \ name for absolutely anything, esp. programs and files (esp. scratch files).\n\
    3. First on the standard list of **metasyntactic variables** used in syntax examples.\
    \ See also *bar*, *baz*, *qux*, *quux*, etc.\n\nWhen ‘foo’ is used in connection\
    \ with ‘bar’ it has generally traced to the WWII-era Army slang acronym *FUBAR*\
    \ [*see original meaning*], later modified to *foobar*. Early versions of the\
    \ Jargon File interpreted this change as a post-war bowdlerization, but it [sic]\
    \ now seems more likely that FUBAR was itself a derivative of ‘foo’ perhaps influenced\
    \ by German *furchtbar* (terrible) — “foobar” may actually have been the *original*\
    \ form.\n\nFollowing the link to *metasyntactic variables*, we then find the following:\n\
    \n> **metasyntactic variable**: n.\n>\n> A name used in examples and understood\
    \ to stand for whatever thing is under discussion, or any random member of a class\
    \ of things under discussion. The word *foo* is the canonical example. To avoid\
    \ confusion, hackers never (well, hardly ever) use *foo* or other words like it\
    \ as permanent names for anything. In filenames, a common convention is that any\
    \ filename beginning with a metasyntactic-variable name is a scratch file that\
    \ may be deleted at any time.\n>\n> Metasyntactic variables are so called because\
    \ (1) they are variables in the metalanguage used to talk about programs, etc.;\
    \ (2) they are variables whose values are often variables (as in usages like the\
    \ value of f(foo,bar) is the sum of foo and bar. However, it has been plausibly\
    \ suggested that the real reason for the term metasyntactic variable is that it\
    \ sounds good.\n\nA common pattern when using the command line is changing directories\
    \ using `cd` (covered in Section 4) and then immediately typing `ls` to view the\
    \ contents of the directory. This lets you orient yourself and is a good first\
    \ step toward whatever your next action might be.\n\nOne useful ability of `ls`\
    \ is support for the *wildcard character* `*` (read “star”). For example, to list\
    \ all files ending in “*.txt*”, we would type this:\n\n```\n$ ls *.txt\nsonnet_1.txt\n\
    sonnet_1_reversed.txt\n```\n\nHere `*.txt` (read “star dot tee-ex-tee”) automatically\
    \ expands to all the file-names that match the pattern “any string followed by\
    \ .txt”.\n\nThere are three particularly important optional forms of `ls`, starting\
    \ with the “long form”, using the option `-l` (read “dash-ell”):\n\n```\n$ ls\
    \ -l *.txt\ntotal 16\n-rw-r--r-- 1 mhartl staff 87 Jul 20 18:05 sonnet_1.txt\n\
    -rw-r--r-- 1 mhartl staff 294 Jul 21 12:09 sonnet_1_reversed.txt\n```\n\nFor now,\
    \ you can safely ignore most of the information output by `ls -l`, but note that\
    \ the long form lists a date and time indicating the last time the file was modified.\
    \ The number before the date is the size of the file, in bytes.[^13]\n\n[^13]:\
    \ A bit is one piece of yes-or-no information (such as a 1 or a 0), and a byte\
    \ is eight bits. Bytes are probably most familiar from “megabytes” and “gigabytes”,\
    \ which represent a million and a billion bytes, respectively. (The official story\
    \ is a little more complicated, but level of detail here is certainly enough to\
    \ be dangerous.)\n\nA second powerful `ls` variant is “list by reversed time of\
    \ modification (long format)”, or `ls -rtl`. This is particularly useful when\
    \ there are a lot of files in the directory, but you really only care about seeing\
    \ the ones that have been modified recently, such when confirming a file download.\
    \ We’ll see an example of this in Section 3.1, but you are free to try it now:\n\
    \n```\n$ ls -rtl\n<results system-dependent>\n```\n\nBy the way, `-rtl` is the\
    \ commonly used compact form, but you can also pass the options individually,\
    \ like this:\n\n```\n$ ls -r -t -l\n```\n\nIn addition, their order is irrelevant,\
    \ so typing `ls -t*rl` gives the same result.\n\nFinally, Unix has the concept\
    \ of “hidden files (and directories)”, which don’t show up by default when listing\
    \ files. Hidden files and directories are identified by starting with a dot `.`,\
    \ and are commonly used for things like storing user preferences. For example,\
    \ in *Learn Enough™ Git to Be Dangerous*, we’ll create a file called `.gitignore`\
    \ that tells a particular program (Git) to ignore files matching certain patterns.\
    \ As a concrete example, to ignore all files ending in “*.txt”, we could do this:\n\
    \n```\n$ echo \"*.txt\" > .gitignore\n$ cat .gitignore\n*.txt\n```\n\nIf we then\
    \ run `ls`, the file won’t show up, because it’s hidden:\n\n```\n$ ls\nsonnet_1.txt\n\
    sonnet_1_reversed.txt\n```\n\nTo get `ls` to display hidden files and directories,\
    \ we need to pass it the `-a` option (for “all”):\n\n```\n$ ls -a\n.       .gitignore\
    \        sonnet_1_reversed.txt\n..      sonnet_1.txt\n```\n\nNow `.gitignore`\
    \ shows up, as expected. (We’ll learn what `.` and `..` refer to in Section 4.3.)\n\
    \n## Exercises\n\n1. What’s the command to list all the files (and directories)\
    \ that start with the letter “s”?\n2. What is the command to list all the files\
    \ that contain the string “onnet”, long-form by reverse modification time? *Hint:*\
    \ Use the wildcard operator twice.\n"
  mdcn: "\n## 练习\n\n在完成以下每个练习后，请使用 `cat` 命令来验证你的答案。\n\n1. 使用 `echo` 和 `>，创建名为 `line_1.txt`\
    \ 和 `line_2.txt` 的文件，分别包含《十四行诗第1首》的第一行和第二行。\n2. 通过先将 `line_1.txt` 的内容重定向，然后追加\
    \ `line_2.txt` 的内容，来复制原始的 `sonnet_1.txt`（包含十四行诗的前两行）。将新文件命名为 `sonnet_1_copy.txt`，并使用\
    \ `diff` 确认它与 `sonnet_1.txt` 完全相同。*提示：当两个文件之间没有差异时，`diff` 不会输出任何内容。*\n3. 使用 `cat`\
    \ 以*单个*命令按相反顺序组合 `line_1.txt` 和 `line_2.txt` 的内容，生成文件 `sonnet_1_reversed.txt`。*提示：`cat`\
    \ 命令可以接受多个参数。*\n\n### 2.2 列表显示\n\n在 Unix 命令行中最常被输入的命令可能是 `ls`，它是“list”（列表）的缩写（见列表\
    \ 6）。\n\n**列表 6：** 使用 `ls` 列出文件和目录。（输出可能会有所不同。）\n```\n$ ls\nDesktop\nDownloads\n\
    sonnet_1.txt\nsonnet_1_reversed.txt\n```\n\n> “diff”（差异）这个动词是计算机行话，但它是我唯一认为能准确表达我想要意思的词。它源自\
    \ Unix 的 `diff` 工具，该工具会列出两个文件之间的所有差异。更广泛地说，它意味着对某物的两个版本进行无选择性和显微镜般彻底的比较。\n\n![](img/4dec9c51e73c9027d3d8a4fab4408fe6_31_0.png)\n\
    \n图 13：`ls` 的图形化等价物。\n\n**ls** 命令仅列出当前目录中的所有文件和目录（除了那些*隐藏*的文件，我们稍后将详细介绍）。从这个意义上说，它实际上是图形浏览器的命令行版本，该浏览器用于显示文件和目录（也称为“文件夹”，如图\
    \ 13 所示）。（我们将在第 4 节中加强对目录和文件夹的理解。）与图形文件浏览器一样，列表 6 中的输出只是一个示例，具体结果会根据你系统的细节而有所不同。（这对于所有\
    \ **ls** 示例都适用，因此如果输出有细微差别，请不要担心。）\n\n**ls** 命令可用于检查文件（或目录）是否存在，因为尝试对一个不存在的文件运行\
    \ **ls** 会导致错误消息，如列表 7 所示。\n\n**列表 7：对不存在的文件运行 `ls`。**\n```\n$ ls foo\nls: foo:\
    \ No such file or directory\n$ touch foo\n$ ls foo\nfoo\n```\n\n列表 7 使用 `touch`\
    \ 命令创建一个名为 `foo` 的空文件（方框 7），因此第二次运行 `ls` 时错误消息消失了。（`touch` 的既定目的是更改文件或目录的修改时间，但（滥用）`touch`\
    \ 来创建空文件，如列表 7 所示，是一种常见的 Unix 习惯用法。）\n\n### 方框 7. Foo, bar, baz 等\n\n在阅读有关计算机的内容时，你会以惊人的频率遇到某些奇怪的单词——像\
    \ *foo*、*bar* 和 *baz* 这样的单词。事实上，除了 `ls foo` 和 `touch foo` 之外，我们在这个教程中已经看到了四次这样的引用：在一个典型的命令行命令中（图\
    \ 2），在一个虚拟机的密码中（`foobar!`，方框 2），再次是在摆脱困境时（`grep foobar`，方框 4），还有一次是在手册页中（列表 3）。前三次是我自己的用法，但最后一次与我无关：\n\
    \n```\n    . . .if name contains a slash (/) then man interprets\n    it as a\
    \ file specification, so that you can do man\n    ./foo.5 or even man /cd/foo/bar.1.gz.\n\
    ```\n\n在这里，我们看到 *foo* 和 *bar* 都出现在了 *man* 本身的手册页中——这是它们在计算中无处不在的一个明确见证。\n\n这些奇术语的起源是什么？一如既往，**Jargon\
    \ File**（通过其关于 *foo* 的条目）给了我们启发：\n\n**foo**： /foo/\n\n1. interj. 厌恶的术语。\n2. [非常常见]\
    \ 非常普遍地用作任何事物的示例名称，尤其是程序和文件（尤其是临时文件）。\n3. 在语法示例中使用的**元语义词变量**标准列表中的第一个。另见 *bar*、*baz*、*qux*、*quux*\
    \ 等。\n\n当“foo”与“bar”一起使用时，通常可以追溯到二战时期的军队俚语缩写 *FUBAR* [*查看原始含义*]，后来被修改为 *foobar*。Jargon\
    \ File 的早期版本将此变化解释为战后的查尔斯·兰姆式温和化，但现在似乎更有可能的是，FUBAR 本身就是“foo”的一个衍生词，可能受到德语 *furchtbar*（可怕的）的影响——“foobar”实际上可能是*原始*形式。\n\
    \n沿着链接到*元语义词变量*，我们随后发现以下内容：\n\n> **元语义词变量**： n.\n>\n> 在示例中使用的名称，被理解为代表正在讨论的任何事物，或正在讨论的事物类别中的任何随机成员。单词\
    \ *foo* 是标准示例。为了避免混淆，黑客从不（几乎从不）使用 *foo* 或其他类似词语作为任何事物的永久名称。在文件名中，常见的惯例是，任何以元语义词变量名称开头的文件名都是临时文件，可以随时删除。\n\
    >\n> 元语义词变量之所以如此称呼，是因为 (1) 它们是用于讨论程序等的元语言中的变量；(2) 它们的值通常是变量（例如像 f(foo,bar) 的值是\
    \ foo 和 bar 之和这样的用法。然而，有建议认为，元语义词变量这个术语的真正原因是它听起来很好听。\n\n使用命令行的一种常见模式是改变目录使用 `cd`（在第\
    \ 4 节中介绍），然后立即输入 `ls` 以查看目录的内容。这让你能够定位自己，并且是迈向下一个动作的第一步。\n\n`ls` 的一个有用功能是对*通配符*\
    \ `*`（读作“star”）的支持。例如，要列出所有以“*.txt*”结尾的文件，我们会这样输入：\n\n```\n$ ls *.txt\nsonnet_1.txt\n\
    sonnet_1_reversed.txt\n```\n\n这里 `*.txt`（读作“star dot tee-ex-tee”）会自动扩展为所有匹配模式“任何字符串后跟\
    \ .txt”的文件名。\n\n`ls` 有三种特别重要的可选形式，首先是使用选项 `-l`（读作“dash-ell”）的“长形式”：\n\n```\n$\
    \ ls -l *.txt\ntotal 16\n-rw-r--r-- 1 mhartl staff 87 Jul 20 18:05 sonnet_1.txt\n\
    -rw-r--r-- 1 mhartl staff 294 Jul 21 12:09 sonnet_1_reversed.txt\n```\n\n目前，你可以放心地忽略\
    \ `ls -l` 输出的大部分信息，但请注意，长形式列出了表明文件最后修改时间的日期和时间。日期前的数字是文件大小，以字节为单位。[^13]\n\n[^13]:\
    \ 位（bit）是一部分是非信息（例如 1 或 0），而字节（byte）是八位。字节可能最熟悉的是来自“兆字节”和“吉字节”，它们分别代表一百万和一十亿字节。（官方故事要复杂一点，但这里详细的程度绝对足以令人危险。）\n\
    \n第二个强大的 `ls` 变体是“按修改时间倒序列出（长格式）”，即 `ls -rtl`。当目录中有大量文件时，但你只关心查看最近修改的那些文件（例如确认文件下载时），这特别有用。我们将在第\
    \ 3.1 节中看到一个例子，但你也可以现在就尝试：\n\n```\n$ ls -rtl\n<结果取决于系统>\n```\n\n顺便说一句，`-rtl` 是常用的紧凑形式，但你也可以单独传递选项，如下所示：\n\
    \n```\n$ ls -r -t -l\n```\n\n此外，它们的顺序无关紧要，所以输入 `ls -t*rl` 会得到相同的结果。\n\n最后，Unix\
    \ 有“隐藏文件（和目录）”的概念，它们在默认列出文件时不会显示。隐藏文件和目录以点 `.` 开头进行标识，通常用于存储用户偏好设置等。例如，在*Learn\
    \ Enough™ Git to Be Dangerous*中，我们将创建一个名为 `.gitignore` 的文件，它告诉特定程序（Git）忽略匹配某些模式的文件。作为一个具体的例子，要忽略所有以“*.txt”结尾的文件，我们可以这样做：\n\
