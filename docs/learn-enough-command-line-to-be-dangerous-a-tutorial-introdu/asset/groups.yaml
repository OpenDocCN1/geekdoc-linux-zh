    **框 9. 重复之前的命令**


    重复之前的命令是使用命令行时的常见任务。在本教程到目前为止的内容中，我们使用了上箭头键来检索（并可能编辑）之前的命令，但这并不是唯一的可能性。一种更快地查找并立即运行之前命令的方法是使用感叹号
    `!`，在软件开发上下文中通常发音为“bang”。要按原样运行上一条命令，我们可以使用“bang bang”：


    ```bash

    $ echo "foo"

    foo

    $ !!

    ```


    一个密切相关的用法是“bang”后跟一些字符，这将运行以这些字符开始的最后一个命令。例如，要运行最后一个 `curl` 命令，我们可以输入：


    ```bash

    $ !curl

    ```


    这将省去输入选项、URL 等的麻烦。根据我们的命令历史，甚至更简短的 `!cu` 或 `!c` 也能起作用。当期望的命令是在许多命令之前运行时，这种技术特别有用，因为按下上箭头键可能会很繁琐。


    第二种且功能强大的技术是 `Ctrl-R`，它允许你交互式地搜索之前的命令，然后在执行前选择性地编辑结果。例如，我们可以尝试以下操作来调出最后一个 `curl`
    命令：


    ```bash

    $ <Ctrl-R>

    (reverse-i-search)`:'' : curl

    ```


    此时按下回车会将最后一个 `curl` 命令放在我们的提示符后面，允许我们在按下回车执行之前对其进行编辑（如果希望的话）。当你的工作流程恰好涉及反复运行各种类似的命令时，有时可能会感觉“所有命令都以
    `Ctrl-R` 开头”。


    运行列表 8 的结果是 `sonnets.txt`，一个包含莎士比亚全部 154 首十四行诗的文件。该文件包含 2620 行，太多而无法放在一个屏幕上。学习如何检查其内容是本节其余部分的目标。（除此之外，我们将学习如何确定它有
    2620 行，而不用手动数所有行。）


    ### 练习


    1. 使用命令 `curl -I www.learnenough.com` 获取 **Learn Enough** 网站的 *HTTP 头*。该地址的 **HTTP
    状态码**是什么？它与 `learnenough.com` 的状态码有何不同？

    2. 使用 `ls` 确认 `sonnets.txt` 在你的系统上存在。它有多少字节？*提示：* 回顾第 2.2 节，`ls` 的“长格式”会显示字节数。

    3. 上一个练习中的字节数足够高，因此更自然地以 *千字节*（通常被视为 1000 字节，但实际上等于 $2^{10}=1024$ 字节）来思考。使用 `ls`
    的 `-h`（“人类可读”）选项，列出十四行诗文件的长格式，并显示人类可读的字节数。

    4. 假设你想使用**人类**可读的字节数列出文件和目录，列出**所有**文件，并按时间倒序排列的长格式。为什么这个命令可能是本教程作者的私人最爱？[15]


    > **注意：** 在很长一段时间里一直知道 `ls -a` 和 `ls -rtl`——两者一起产生了具有提示性的命令 `ls -artl`——有一天我决定添加一个“h”（原因显而易见）。实际上，我就是这样在几年前偶然发现了有用的
    `-h` 选项。


    ### 3.2 理解首尾


    两个互补的命令用于检查文件是 `head` 和 `tail`，它们分别允许我们查看文件的开头（head）和结尾（tail）。`head` 命令显示文件的前
    10 行（列表 9）。


    **列表 9：** 查看示例文本文件的头部。


    ```text

    $ head sonnets.txt

    Shake-speare''s Sonnets

    I


    From fairest creatures we desire increase,

    That thereby beauty''s Rose might never die,

    But as the riper should by time decease,

    His tender heir might bear his memory:

    But thou contracted to thine own bright eyes,

    Feed''st thy light''s flame with self-substantial fuel

    ```


    类似地，**tail** 显示文件的最后 10 行（列表 10）。


    **列表 10：** 查看示例文本文件的尾部。


    ```text

    $ tail sonnets.txt

    The fairest votary took up that fire

    Which many legion of true hearts had warm''d;

    And so the general of hot desire

    Was, sleeping, by a virgin hand disarm''d.

    This brand she quenched in a cool well by,

    Which from Love''s fire took heat perpetual,

    Growing a bath and healthful remedy,

    For men diseas''d; but I, my mistress'' thrall,

    Came there for cure and this by that I prove,

    Love''s fire heats water, water cools not love.

    ```


    当你确定只需要检查文件的开头或结尾时（这种情况很常见），这两个命令很有用。


    ## 字数统计和管道


    顺便说一下，我一时想不起 **head** 和 **tail** 默认显示多少行。由于输出中只有 10 行，我可以手动数一下，但实际上我能够使用 **wc**
    命令（“wordcount”的缩写；回顾图 14）弄清楚这一点。


    **wc** 最常见的用法是针对完整文件。例如，我们可以将 `sonnets.txt` 通过 **wc** 运行：


    ```bash

    $ wc sonnets.txt

    2620 17670 95635 sonnets.txt

    ```


    这里的三个数字表示文件中的行数、单词数和字节数，因此有 2620 行（从而兑现了在第 3.1 节末尾做出的承诺），17670 个单词，以及 95635 个字节。


    你现在有能力猜测一种确定 `head sonnets.txt` 中有多少行的方法。特别是，我们可以将 `head` 与重定向运算符（第 2.1 节）结合使用，创建一个包含相关内容的新文件，然后对其运行
    `wc`，如列表 11 所示。


    **列表 11：** 重定向 `head` 并对结果运行 `wc`。


    ```bash

    $ head sonnets.txt > sonnets_head.txt

    $ wc sonnets_head.txt

    10    46    294 sonnets_head.txt

    ```


    从列表 11 我们可以看到 `head wc` 中有 10 行（以及 46 个单词和 294 个字节）。当然，同样的方法也适用于 `tail`。


    另一方面，你可能会觉得仅仅为了运行 `wc` 而创建一个中间文件有点不整洁，确实，有一种使用称为管道（pipes）的技术来避免这种情况的方法。列表 12 展示了如何做。


    **列表 12：** 将 `head` 的结果通过管道传递给 `wc`。


    ```bash

    $ head sonnets.txt | wc

    10    46    294

    ```


    列表 12 中的命令运行 `head sonnets.txt`，然后使用管道符号 `|`（在 QWERTY 键盘上是 Shift-backslash）将结果通过管道传递给
    `wc`。这样行之有效的原因是，`wc` 命令除了接受文件名作为参数外，还可以（像许多 Unix 程序一样）从“标准输入”获取输入（对比第 1.2 节中提到的“标准输出”），在本例中，这就是列表
    9 中显示的 `head sonnets.txt` 的输出。`wc` 程序获取此输入并以与计算文件相同的方式对其进行计数，得出与列表 11 相同的行数、单词数和字节数。


    '
