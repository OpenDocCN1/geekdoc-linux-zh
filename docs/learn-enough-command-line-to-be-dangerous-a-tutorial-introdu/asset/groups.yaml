    intosb OS. $ ^{3} $  Unix systems serve most of the software on the World Wide
    Web, run most mobile and tablet devices, and power many of the world’s desktop
    computers as well. As a result of Unix’s central role in modern computing, this
    tutorial covers the Unix way of developing software. The main exception to Unix’s
    dominance is Microsoft® Windows™, which is not part of the Unix tradition, but
    those who mostly develop using native Windows development tools will still benefit
    from learning the Unix command line. Among other things, at some point such users
    are likely to need to issue commands on a Unix server (e.g., via the “secure shell”
    command **ssh**), at which point familiarity with Unix commands becomes essential.
    As a result, Windows users are strongly encouraged to run a free *Linux virtual
    machine* (as described in Box 2) in order to get the most out of this tutorial.
    Another good option is to use a cloud IDE$^{4}$ such as [Cloud9](http://www.example.com/cloud9);
    to go this route, follow the “*Development environment*” section in the [Ruby
    on Rails Tutorial book](http://www.example.com/ruby-on-rails-tutorial-book).


    ![](img/4dec9c51e73c9027d3d8a4fab4408fe6_7_0.png)


    # Box 2. Running a virtual machine


    In order to complete this tutorial, Windows users should install a couple of free
    programs to run a *virtual machine* (a simulation of a computer) that allows Windows
    to host a version of the Linux operating system. The steps appear as follows:


    +   1. Install the right version of VirtualBox for your system (free).

    +   2. Download the TutorialPath Virtual Machine (large file).

    +   3. Once the download is complete, double-click the resulting “OVA” file and
    follow the instructions to install the Virtual Machine (VM).

    +   4. Double-click the VM itself and log in using the default user’s password,
    which is “foobar!”,


    $^{3}$ In a fairly typical turn of events, the name Unix started as a pun on a
    rival system called Multics.


    $^{4}$ An IDE, or integrated development environment, typically integrates several
    development tools (such as a command line and a text editor) into one application.'
