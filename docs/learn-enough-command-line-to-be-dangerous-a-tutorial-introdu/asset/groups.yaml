    ## 3 检查文件


    既然已经了解了如何创建和操作文件，现在是学习如何检查其内容的时候了。这对于那些长度超出单屏显示范围的文件尤其重要。特别是，我们从第 2.1 节开始看到了如何使用
    `cat` 命令将文件内容转储到屏幕上，但对于较长的文件，这种方法并不太适用。


    ### 3.1 下载文件


    为了让我们有一个起点，而不是手工创建一个长文件（这很繁琐），我们将使用功能强大的 `curl` 实用工具从互联网上下载一个文件，该工具允许我们在命令行中与
    URL 交互。虽然它不是核心 Unix 命令集的一部分，但 `curl` 命令在 Unix 系统上广泛可用。为了确定它是否在你的系统上可用，我们可以使用 `which`
    命令，该命令用于检查给定的程序是否在命令行上可用。[14] 使用它的方法是在输入 `which` 后跟上程序名称——在本例中是 `curl`：


    ```bash

    $ which curl

    /opt/curl

    ```


    > **注意：** 从技术上讲，`which` 位于用户路径（path）上的一个文件，这是可执行程序所在目录列表。


