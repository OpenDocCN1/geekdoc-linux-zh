    \ tab I often have separate tabs for running a local web server and an automated\
    \ test suite.) By examining the menu items for your terminal program, figure out\
    \ how to create a new tab. *Extra credit:* Learn the keyboard shortcut for creating\
    \ a new tab. (Learning keyboard shortcuts for your system is an excellent habit\
    \ to cultivate.)\n\n## 1.2 Our first command\n\nWe are now prepared to run our\
    \ first command, which prints the word “hello” to the screen. (The place where\
    \ characters get printed is known as “standard out”, which is usually just the\
    \ screen, and rarely refers to a physical printer.) The command is **echo**, and\
    \ the argument is the string of characters that we want to print. To run the **echo**\
    \ command, type “echo hello” at the prompt, and then press the Return key (also\
    \ called Enter):\n\n```\n$ echo hello\nhello\n$\n```\n\n(I recommend always typing\
    \ the commands out yourself, which will let you learn more than if you rely on\
    \ copying and pasting.) Here we see that **echo** **hello** prints “hello” and\
    \ then returns another prompt. Note that, for brevity, I’ve omitted all characters\
    \ in the prompt except the trailing dollar sign $.\n\n```\n[~]$ cd ruby\n[ruby]$\
    \ ls -a\n.           .DS_Store rails\n..          projects\n[ruby]$ rm -f .DS_Store\n\
    [ruby]$ ls -a\n.           projects\n..          rails\n[ruby]$ cd projects/\n\
    [projects]$ pwd\n/Users/mhartl/ruby/projects\n[projects]$ \n```\n\n![](img/4dec9c51e73c9027d3d8a4fab4408fe6_12_0.png)\n\
    \nJust to make the pattern clear, let’s try a second **echo** command:\n\n```\n\
    $ echo \"goodbye\"\ngoodbye\n$ echo 'goodbye'\ngoodbye\n$\n```\n\nNote here that\
    \ we’ve wrapped “goodbye” in quotation marks—and we also see that we can use either\
    \ double quotes, as in `\"goodbye\"`, or single quotes, as in `'goodbye'`. Such\
    \ quotes can be used to group strings visually, though in many contexts they are\
    \ not required by **echo** (Listing 1).\n\n### Listing 1: Printing “hello, goodbye”\
    \ two different ways.\n\n```\n$ echo hello, goodbye\nhello, goodbye\n$ echo \"\
    hello, goodbye\"\nhello, goodbye\n$\n```\n\nOne thing that can happen when using\
    \ quotes is accidentally not matching them, as follows:\n\n```\n$ echo \"hello,\
    \ goodbye\n>\n```\n\nAt this point, it seems we’re stuck. There are specific ways\
    \ out of this quandary (in fact, in this case you can just add a closing quote\
    \ and hit return), but it’s good to have a general strategy for getting out of\
    \ trouble (Figure 7). This strategy is called “Ctrl-C” (Box 4).\n\n![](img/4dec9c51e73c9027d3d8a4fab4408fe6_14_0.png)\n\
    \n> *Figure 7: This cat appears to be stuck and should probably hit `Ctrl-C`.*\n\
    \n### Box 4. Getting out of trouble\n\nWhen using the command line, there are\
    \ lots of things that can get you in trouble, by which I mean the terminal will\
    \ just hang or otherwise end up in a state that makes entering further commands\
    \ difficult or impossible. Here are some examples of such commands:\n\n```\n$\
    \ echo \"hello\n$ grep foobar\n$ yes\n$ tail\n$ cat\n```\n\nIn every case, the\
    \ solution is the same: hit `Ctrl-C` (pronounced “control-see”). Here `Ctrl` refers\
    \ to the “control” key on your keyboard, and `C` refers to the key labeled “C”.\
    \ `Ctrl-C` thus means “While holding down the control key, press C.” In particular,\
    \ `C` does *not* refer to the capital letter `C`, so you should not press Shift\
    \ in addition to Ctrl. (`Ctrl-C` sends a *control code* to the terminal and has\
    \ nothing to do with producing a capital `C` when typing normal text.) The result\
    \ of typing `Ctrl-C` is sometimes written as `^C`, like this:\n\n```\n$ tail\n\
    ^C\n```\n\nThe **origins of Ctrl-C** are somewhat obscure, but as a mnemonic I\
    \ like to think of it as meaning “cancel”. However you remember it, *do* remember\
    \ it: when you get into trouble at the command line, your best bet is usually\
    \ to hit `Ctrl-C`.\n\n*Note:* When `Ctrl-C` fails, 90% of the time hitting `ESC`\
    \ (escape) will do the trick.\n\n## Exercises\n\n- 1. Write a command that prints\
    \ out the string “hello, world”. *Extra credit:* As in Listing 1, do it two different\
    \ ways, both with and without using quotation marks.\n- 2. Type the command `echo\
    \ ‘hello` (with a mismatched single quote), and then get out of trouble using\
    \ the technique from Box 4.\n\n## 1.3 Man pages\n\nThe program we’re using to\
    \ run a command line, which is technically known as a *shell*, includes a powerful\
    \ (though often cryptic) tool to learn more about\n"
