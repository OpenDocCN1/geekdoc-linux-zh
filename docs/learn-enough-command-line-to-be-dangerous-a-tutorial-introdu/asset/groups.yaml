    | . | The current directory | `$ cp ~/foo.txt .` |

    | .. | One directory up | `$ cd ..` |

    | find | Find files & directories | `$ find . -name foo*.*` |

    | cp -r <old> <new> | Copy recursively | `$ cp -r ~/foo .` |

    | rmdir <dir> | Remove (empty) dir | `$ rmdir foo/` |

