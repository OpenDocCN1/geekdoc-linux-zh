    Unix 提供了两个实用程序，用于常见情况，即想要查看文件的 head 或 tail 之外的更多内容。这些程序中较旧的一个被称为 `more`，但（我推测最初是一个嬉皮笑脸的玩笑）有一个更强大的变体被称为
    `less`。<sup>16</sup> `less` 程序是交互式的，因此很难在印刷品中捕捉，但以下是它的大致外观：


    > <sup>16</sup> 在某些系统上，显然它们是*完全*相同的*程序*，因此 `less` 实际上是 `more`（或者更准确地说，`more` 是
    `less`）。


    ```text

