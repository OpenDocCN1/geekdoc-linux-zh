    14）。


    答案是 Unix 起源于大多数计算机用户通过慢速连接登录到集中式服务器的时代，在用户按键和按键出现在终端之间可能有明显的延迟。对于像列出文件这样频繁使用的命令，list
    和 ls 或者 remove 和 rm 之间的差异可能相当显著。因此，最常用的 Unix 命令往往只有两三个字母长。这使得它们更难记忆，在学习时可能是一个小不便，但在终身使用命令行的过程中，比如使用
    **mv** 所带来的节省确实是很可观的。


