    \n```\n`man  [-acdfFhkKtwW]  [--path]  [-m  system]  [-P  string]  ...`\n```\n\
    \nCrazy, right? This is what I meant above when I described man pages as “often\
    \ cryptic”. Indeed, in many cases I find the details of man pages to be almost\
    \ impossible to understand, but being able to scan over the man page to get a\
    \ high-level overview of a command is a valuable skill, one worth acquiring. To\
    \ get used to reading man pages, I recommend running `man <command name>` when\
    \ encountering a new command. Even if the details aren't entirely clear, reading\
    \ the man pages will help develop the valuable skill of *technical sophistication*\
    \ (Box 5).\n\n### Box 5. Technical sophistication\n\nIn mathematics, many subjects\
    \ that can be developed by applying pure deduction to a small number of assumptions,\
    \ or *axioms*. Examples include algebra, geometry, number theory, and analysis.\
    \ As a result, such subjects are completely self-contained, and thus have no formal\
    \ prerequisites. In principle, even a small child could learn the subject from\
    \ scratch. In practice, though, something else is required, and mathematicians\
    \ often recommend the informal prerequisite of *mathematical maturity*, which\
    \ consists of the experience and general sophistication needed to understand and\
    \ write mathematical proofs.\n\nIn technology, a similar skill (or, more accurately,\
    \ set of skills) exists in the form of *technical sophistication*. Essentially,\
    \ this consists of a miscellaneous toolkit of computer tricks, combined with an\
    \ *attitude* of getting the machine to do your bidding (Box 1). As shown in Figure\
    \ 9, technical sophistication includes things like looking for promising menu\
    \ items and knowing the kinds of search terms to drop into Google. These skills\
    \ are hard to teach directly, so as you progress through this and subsequent *Learn\
    \ Enough™ tutorials*, always be on the lookout for opportunities to increase your\
    \ technical sophistication by adding tools to your kit (including, for example,\
    \ the ability to get the gist of a program by scanning its man page (Section 1.3)).\
    \ Over time, the cumulative effect will be that, like the author of Figure 9,\
    \ you'll have the seemingly magical ability to do everything in every program.\n\
    \n### Exercises\n\n- 1. According to the man page, what is the official description\
    \ of `echo` on your system?\n\nDEAR VARIOUS PARENTS, GRANDPARENTS, CO-WORKERS,\
    \ AND OTHER “NOT COMPUTER PEOPLE.”\n\nWE DON’T MAGICALLY KNOW HOW TO DO EVERYTHING\
    \ IN EVERY PROGRAM. WHEN WE HELP YOU, WE’RE USUALLY JUST DOING THIS:\n\n![](img/4dec9c51e73c9027d3d8a4fab4408fe6_20_0.png)\n\
    \nPLEASE PRINT THIS FLOWCHART OUT AND TAPE IT NEAR YOUR SCREEN. CONGRATULATIONS;\
    \ YOU’RE NOW THE LOCAL COMPUTER EXPERT!\n\n> Figure 9: “*Tech Support Cheat Sheet*”\
    \ (via xkcd.com). The only thing missing is “Have you tried rebooting?”\n\n- 2.\
    \ The usual way of running **echo** includes a *newline* character (“enter” or\
    \ “return”) that puts the new prompt on a separate line, but there is a command-line\
    \ option to prevent this. By reading the man page for **echo**, determine the\
    \ command needed to print out “hello” without the trailing newline, and verify\
    \ using your terminal that it works as expected. *Hint*: The result should look\
    \ something like `helloworld`[ . . . ]$ , where [ . . . ] represents the unimportant\
    \ details of your prompt. (*Note*: This exercise may fail when using the default\
    \ terminal program on some older versions of Macintosh OS X. In this case, I recommend\
    \ installing iTerm (which isn’t a bad idea anyway).)\n\n## 1.4 Editing the line\n\
    \nCommand lines include several features to make it easy to repeat previous commands,\
    \ possibly in edited form. The most basic is “up arrow”, which simply retrieves\
    \ the previous command. Pressing up arrow again moves further up the list of commands,\
    \ while down arrow goes back toward the bottom.\n\nWhen typing a new command,\
    \ or dealing with a previous command, it is often convenient to be able to move\
    \ quickly within the line. For example, suppose we typed\n\n```\n$ goodbye\n```\n\
    \nonly to realize that we wanted to put **echo** in front of it. We could use\
    \ the left arrow key to get to the beginning of the line, but it’s easier to type\
    \ `Ctrl-A`, which takes us there immediately. Similarly, `Ctrl-E` moves to the\
    \ end of the line. Finally, `Ctrl-U` clears to the beginning of the line and lets\
    \ us start over.\n\nThe combination of `Ctrl-A`, `Ctrl-E`, and `Ctrl-U` will work\
    \ on most systems, but they don’t do you much good if you’re editing a longer\
    \ line, such as this one containing the first line of *Sonnet 1* by William Shakespeare\
    \ (Listing 4).\n\n![](img/4dec9c51e73c9027d3d8a4fab4408fe6_22_0.png)\n\n*Figure\
    \ 10: The original appearance of Shakespeare's first sonnet.*\n\n### Listing 4:\
    \ Printing the first line of Shakespeare’s first sonnet.\n\n```\n$ echo \"From\
    \ fairest creatures we desire increase,\"\n```\n\nSuppose we wanted to change\
    \ “From” to “F**R**om” to more closely match the text from the original sonnet\
    \ (Figure 10).¹⁰ We could type `Ctrl-A` followed by the right arrow key a few\
    \ times, but on some systems it’s possible to move directly to the desired spot\
    \ by combining the keyboard and mouse via Option-click. That is, you can hold\
    \ down the Option key on your keyboard, and then click with the mouse pointer\
    \ on the place in the command where you want the cursor. This would let us move\
    \ right to the “o” in “From”, allowing us to delete the “r” and yielding Listing\
    \ 5 directly.\n\n> ⁹ Image retrieved from https://commons.wikimedia.org/wiki/File:Jazz_at_Knicks_man_to_man_defense.jpg\
    \ on 2015-07-22\n\n> ¹⁰ Note that the *Original Pronunciation* (OP) of Shakespearean\
    \ English is different from modern pronunciation. Generally speaking, Shakespeare’s\
    \ sonnets include many word pairs that don’t rhyme in modern English but do in\
    \ OP. In the case of Figure 10, the word “*memory*’” should be pronounced “MEM-or-aye”,\
    \ leading to a rhyme between lines 2 and 4 (ending in *die* and *memory*, respectively).\
    \ Image retrieved from https://commons.wikimedia.org/wiki/File:Sonnet_1.jpg on\
    \ 2015-07-20\n"
