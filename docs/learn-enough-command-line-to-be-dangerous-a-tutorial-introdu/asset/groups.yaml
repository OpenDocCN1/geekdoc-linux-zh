    One of the many uses of `grep` is filtering the Unix *process list* for running
    programs that match a particular string. (On Unix-like systems such as Linux and
    OS X, user and system tasks each take place within a well-defined container called
    a *process*.) This is especially useful when there’s a rogue process on your system
    that needs to be killed. (A good way to find such processes is by running the
    `top` command, which shows the processes consuming the most resources.)


    For example, at one point in the *Ruby on Rails Tutorial* book, it’s important
    to eliminate a program called `spring` from the process list. To do this, first
    the processes need to be found, and the way to see all the processes on your system
    is to use the `ps` command with the `aux` options:


    ```bash

    $ ps aux

    ```


    Per Figure 14, `ps` is short for “process status”. And for **confusing and obscure
    reasons**, options to `ps` aren’t written with a dash (so it’s `ps aux` instead
    of `ps -aux`). (How on earth are you supposed to know this? That’s what this tutorial
    is for.)


    To filter the processes by program name, you pipe the results of `ps` through
    `grep`:


    ```bash

    $ ps aux | grep spring

    ubuntu 12241 0.3 0.5 589960 178416 ? Ssl Sep20 1:46

    spring app | sample_app | started 7 hours ago

    ```


    The result shown gives some details about the process, but the most important
    thing is the first number, which is the *process id*, or `pid` (often pronounced
    to rhyme with “kid”). To eliminate an unwanted process, we use the `kill` command
    to issue the Unix terminate code (which **happens to be 15**) to the `pid`:


    ```bash

    $ kill -15 12241

    ```


    This is the technique I recommend for killing individual processes, such as a
    rogue web server (with the `pid` found via `ps aux | grep server`), but sometimes
    it’s convenient to kill all the processes matching a particular process name,
    such as when you want to kill all the `spring` processes gunking up your system.
    In this case, you can kill all the processes with name `spring` using the `pkill`
    command as follows:


    ```bash

    $ pkill -15 -f spring

    ```


    Any time something isn’t behaving as expected, or a process appears to be frozen,
    it’s a good idea to run `top` or `ps aux` to see what’s going on, pipe `ps aux`
    through `grep` to select the suspected processes, and then run `kill -15 <pid>`
    or `pkill -15 -f <name>` to clear things up.


