    get used to reading man pages, I recommend running `man <command name>` when encountering
    a new command. Even if the details aren''t entirely clear, reading the man pages
    will help develop the valuable skill of *technical sophistication* (Box 5).


    # **Box 5. Technical sophistication**


    In mathematics, many subjects that can be developed by applying pure deduction
    to a small number of assumptions, or *axioms*. Examples include algebra, geometry,
    number theory, and analysis. As a result, such subjects are completely self-contained,
    and thus have no formal prerequisites. In principle, even a small child could
    learn the subject from scratch. In practice, though, something else is required,
    and mathematicians often recommend the informal prerequisite of *mathematical
    maturity*, which consists of the experience and general sophistication needed
    to understand and write mathematical proofs.


    In technology, a similar skill (or, more accurately, set of skills) exists in
    the form of *technical sophistication*. Essentially, this consists of a miscellaneous
    toolkit of computer tricks, combined with an *attitude* of getting the machine
    to do your bidding (Box 1). As shown in Figure 9, technical sophistication includes
    things like looking for promising menu items and knowing the kinds of search terms
    to drop into Google. These skills are hard to teach directly, so as you progress
    through this and subsequent *Learn Enough™ tutorials*, always be on the lookout
    for opportunities to increase your technical sophistication by adding tools to
    your kit (including, for example, the ability to get the gist of a program by
    scanning its man page (Section 1.3)). Over time, the cumulative effect will be
    that, like the author of Figure 9, you''ll have the seemingly magical ability
    to do everything in every program.


    # **Exercises**


    +   1. According to the man page, what is the official description of `echo` on
    your system?'
