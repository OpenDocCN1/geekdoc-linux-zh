    # **Box 11. "sudo make me a sandwich."**


    *sudo* gives ordinary users the power to execute commands as the superuser. For
    example, let''s try *touch*ing a file in the system directory */opt* as follows:


    ```

    $ touch /opt

    touch: /opt/foo: Permission denied

    ```


    Because normal users don''t have permission to modify */opt*, the command fails,
    but it succeeds with *sudo*:


    ```

    $ sudo touch /opt/foo

    Password:

    ```


    As shown, after entering *sudo* we are prompted to enter our user password; if
    entered correctly, and if the user has been configured to have *sudo* privileges
    (which is the default on most desktop Unix systems), then the command will succeed.
    As shown in Figure 19, this pattern of being denied at first, only to succeed
    using *sudo*, is a common theme in computing.


    To check that the file really was created, we can *ls* it:'
  - '[PAGE 62]


    ```

    $ ls -l /opt/foo

    -rw-r--r-- 1 root wheel 0 Jul 23 19:13 /opt/foo

    ```


    Note that (1) a normal user can ls a file in a system directory (without sudo)
    and (2) the name root appears in the listing, indicating that the superuser owns
    the file. (The meaning of the second term, wheel, is a little obscure, but you
    can learn about it on a site called, appropriately enough, superuser.)


    To remove the file we just created, we again need superuser status:


    ```

    $ rm -f /opt/foo

    rm: /opt/foo: Permission denied

    $ sudo !!

    $ !ls

    ls: /opt/foo: No such file or directory

    ```


    Here the first rm fails, so we''ve run sudo !!, which runs sudo and then the previous
    command, and we''ve followed that up with !ls, which runs the previous ls command
    (Box 9).


    As a final comment, I''d like to note the English pronunciation of something like
    sudo !!, which is important when communicating via spoken language. As noted in
    Box 9, !! is pronounced “bang bang”. There is disagreement, though, on the pronunciation
    of sudo. Some people say “SOO-doh”, so that it sounds like the prefix pseudo,
    but in fact sudo is composed of the command su (which, contrary popular belief,
    stands for “substitute user” and not “superuser”) followed by the English word
    “do”. In other words, sudo is a contraction of “substitute user do”. Since (outside
    of solfege and The Sound of Music) the word “do” rhymes with “too”, the correct
    pronunciation of sudo is “SOO-doo”, and sudo !! would therefore be read as “SOO-doo
    bang bang”.


