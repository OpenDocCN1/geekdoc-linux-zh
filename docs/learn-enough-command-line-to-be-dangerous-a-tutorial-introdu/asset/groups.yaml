    ## 12 号框. 组合命令


    在命令行上组合命令通常非常方便，例如在使用 Unix 程序 configure 和 make 安装软件时，它们通常按以下顺序出现：


    ```bash

    $ ./configure ; make ; make install

    ```


    这行代码从当前目录 `.` 运行 configure 程序，然后运行 `make` 和 `make install`。（你不需要理解这些程序的作用，而且除非你恰好处于一个旨在以此方式安装的程序的目录中，否则它们在你的系统上也不会工作。）由于它们由分号字符
    `;` 分隔，因此三个命令按顺序执行。


    组合命令的更好方法是使用双与号 `&&`：


    ```bash

    $ ./configure && make && make install

    ```


    区别在于，由 `&&` 分隔的命令仅在前一个命令成功时才运行。相比之下，使用 `;` 时，无论发生什么，所有命令都会执行，这在后续命令依赖于前序命令结果的情况下（这种情况很常见）会导致错误。


    我特别喜欢将 `&&` 与 `cd -` 结合使用，这让我可以这样做：


    ```bash

    $ build_article && cd ~/tau && deploy && cd -

    ```


    再次说明，你不需要理解这些命令，但大致思路是：我们可以（比如）在一个目录中构建一篇文章，`cd` 到另一个目录，部署（也许是网站）到生产环境，然后 `cd`
    回去（`cd -`）到原始目录，在那里我们可以继续工作。然后，如果需要，我们可以只需使用向上箭头（或 9 号框中的某项技术）来检索整个命令并重新执行一遍。


