    Google 上搜索“install curl”后接上你的操作系统名称来完成。


    一旦 `curl` 安装完毕，我们就可以使用列表 8 中的命令下载一个包含大量语料库文本的文件。


    **列表 8：** 使用 `curl` 下载较长的文件。


    ```bash

    $ curl -OL https://cdn.learnenough.com/sonnets.txt

    $ ls -rtl

