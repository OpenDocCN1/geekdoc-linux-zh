    \ . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . 75\n\n*学会足够的™命令行以变得危险*\
    \ 是面向完全初学者的命令行入门教程，它是一系列旨在教授“计算机魔法”通用基础知识的教程中的第一部。本教程既面向那些与软件开发人员合作的人，也面向那些希望成为开发人员的人。*学会足够的™命令行以变得危险*\
    \ 除了通用的计算机知识（如何启动应用程序、如何使用网页浏览器等）外，不假设任何前提条件，这意味着它并不假设你知道如何使用文本编辑器，甚至不知道什么是文本编辑器。事实上，本教程甚至不假设你知道什么是命令行，因此如果你被标题弄糊涂了，你仍然在正确的地方。最后，即使你已经熟悉命令行，你可能会喜欢通过本教程（并做练习）来复习基础知识。\n\
    \n### 框 1. 计算机编程的魔法\n\n计算机编程可能是我们在现实世界中最接近*魔法*的东西：我们向机器输入咒语，如果咒语正确——机器就会执行我们的命令。为了施展这种魔法，计算机巫师和女巫不仅依赖言语，还依赖魔杖、药水以及一两本古老的典籍。这些行业技巧的总和被称为*软件开发*：计算机编程，加上*命令行、文本编辑器*和*版本控制*等工具。掌握这些工具的知识或许是“技术人员”和“非技术人员”（或者用魔法术语来说，是巫师/女巫与*麻瓜*）之间的主要分界线。本教程是跨越这条线并*学会足够的*软件开发以变得*危险*——即能够施放计算机咒语，让机器听从指挥——所需的第一个步骤。\n\
    \n我的名字是 *Michael Hartl*，我可能最为人所知的是 Ruby on Rails 教程的创建者，这是一本*书*和一个*视频课程系列*，它们共同构成了网页开发的主要入门资料之一。（你可能还知道我的另一种数学身份，即\
    \ *Tau Day* 的创始人和 *《Tau 宣言》* 的作者。）关于 Rails 教程最常被问到的问题是：“Rails 教程适合完全初学者吗？”答案是：“不太适合。”\n\
    \n> 虽然完全初学者可以使用 Ruby on Rails 教程学习网页开发（而且有一大群令人印象深刻的人做到了），但这可能具有挑战性，偶尔会令人沮丧，所以我通常不推荐这样做。相反，我建议你从这里开始。\n\
    \n许多编程教程要么对命令行一笔带过，要么假设你已经知道它。但是，理解命令行的基础对于成为一名熟练的开发者至关重要。<sup>1</sup> 确实，如果你查看经验丰富的计算机程序员的桌面，即使是在像\
    \ Macintosh OS X 这样拥有精美图形用户界面的系统上，你也很可能会发现许多“终端窗口”，每个窗口都包含命令行的一系列命令（图 1）。对于任何需要与开发人员合作的人，如产品经理、项目经理和设计师，熟练使用命令行也很有用。<sup>2</sup>\
    \ 使这一宝贵技能对尽可能广泛的受众可及，是 *学会足够的™命令行以变得危险* 的目标。\n\n## 1 基础\n\n正如作家 Neal Stephenson\
    \ 著名地所说：“在开始之前，是命令行。” 虽然图形用户界面 (GUI) 可以极大地简化计算机使用，但在许多情况下，通过命令行界面 (CLI) 与计算机交互是最强大和灵活的方式。在这种界面中，用户输入命令，指示计算机执行所需的任务。然后，这些命令可以以各种方式组合，以实现各种结果。典型的命令行命令示例如图\
    \ 2 所示。\n\n本教程涵盖了 Unix 命令行的基础知识，其中 Unix 指的是一组包括 Linux、Android、iOS 和 Mac OS 在内的操作系统。<sup>3</sup>\
    \ Unix 系统为万维网上的大多数软件提供服务，运行大多数移动和平板设备，并驱动世界上许多桌面计算机。由于 Unix 在现代计算中的核心作用，本教程介绍了\
    \ Unix 软件开发方式。Unix 主导地位的主要例外是 Microsoft® Windows™，它不属于 Unix 传统，但主要使用原生 Windows\
    \ 开发工具进行开发的人从学习 Unix 命令行中仍会受益。除此之外，这些用户在某个时间点可能需要在一个 Unix 服务器上发出命令（例如，通过“安全外壳”命令\
    \ **ssh**），此时熟悉 Unix 命令变得至关重要。因此，强烈建议 Windows 用户运行一个免费的 *Linux 虚拟机*（如框 2 所述），以充分利用本教程。另一个不错的选择是使用云\
    \ IDE<sup>4</sup>，例如 [Cloud9](http://www.example.com/cloud9)；如果选择这条路，请遵循 [Ruby\
    \ on Rails 教程书籍](http://www.example.com/ruby-on-rails-tutorial-book) 中的“*开发环境*”部分。\n\
    \n![](img/4dec9c51e73c9027d3d8a4fab4408fe6_6_0.png)\n\n*图 1: 经验丰富的开发人员桌面上的终端窗口。*\n\
    \n```\n[projects]$ rm -f foo.txt\n```\n\n*图 2: 典型的命令行命令。*\n\n![](img/4dec9c51e73c9027d3d8a4fab4408fe6_7_0.png)\n\
    \n### 框 2. 运行虚拟机\n\n为了完成本教程，Windows 用户应安装两个免费程序来运行 *虚拟机*（计算机的模拟），它允许 Windows 托管\
    \ Linux 操作系统的版本。步骤如下：\n\n- 1. 为你的系统安装正确版本的 VirtualBox（免费）。\n- 2. 下载 TutorialPath\
    \ 虚拟机（大文件）。\n- 3. 下载完成后，双击生成的“OVA”文件，并按照说明安装虚拟机 (VM)。\n- 4. 双击虚拟机本身，使用默认用户的密码登录，密码是“foobar!”。\n\
    \n<sup>1</sup> 如第 1 节所述，该陈述适用于 Unix 传统，这是互联网和万维网背后的主要计算传统，也是本教程遵循的传统。\n\n<sup>2</sup>\
    \ 了解命令行对于系统管理员（sysadmins）也是必不可少的。\n\n<sup>3</sup> 在一次相当典型的事件转折中，Unix 这个名字始于对竞争对手系统\
    \ Multics 的双关语。\n\n<sup>4</sup> IDE 或集成开发环境，通常将多个开发工具（如命令行和文本编辑器）集成到一个应用程序中。\n\
    \n"
