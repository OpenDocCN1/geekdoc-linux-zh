  - '[PAGE 4]


    *Learn Enough™ Command Line to Be Dangerous* is an introduction to the command
    line for complete beginners, the first in a series of tutorials designed to teach
    the common foundations of “computer magic” (Box 1). It is aimed both at those
    who work with software developers and those who aspire to become developers themselves.
    *Learn Enough™ Command Line to Be Dangerous* assumes no prerequisites other than
    general computer knowledge (how to launch an application, how to use a web browser,
    etc.), which among other things means that it doesn''t assume you know how to
    use a text editor, or even what a text editor is. Indeed, this tutorial doesn''t
    even assume you know what a command line is, so if you''re confused by the title,
    you''re still in the right place. Finally, even if you already have some familiarity
    with the command line, you might enjoy following this tutorial (and doing the
    exercises) to brush up on the basics.


    # Box 1. The magic of computer programming


    Computer programming may be as close as we get to *magic* in the real world: we
    type incantations into a machine, and—if the incantations are right—the machine
    does our bidding. To perform such magic, computer witches and wizards rely not
    only on words, but also on wands, potions, and an ancient tome or two. Taken together,
    these tricks of the trade are known as *software development*: computer programming,
    plus tools like *command lines, text editors,* and *version control.* Knowledge
    of these tools is perhaps the main line between “technical” and “non-technical”
    people (or, to put it in magical terms, between wizards or witches and *Muggles*).
    The present tutorial represents the first step needed to cross this line and *learn
    enough* software development to be *dangerous*—to be able to cast computer spells,
    and get the machine to do our bidding.


    My name is *Michael Hartl*, and I am perhaps best known as the creator of the
    Ruby on Rails Tutorial, *a book* and *screencast series* that together constitute
    one of the leading introductions to web development. (You may also know me, in
    my more mathematical mode, as the founder of *Tau Day* and author of *The Tau
    Manifesto.*) One of the most frequently asked questions about the Rails Tutorial
    is, "Is the Rails Tutorial good for complete beginners?" The answer is, "Not really."'
  - '[PAGE 5]


    > While it is possible for complete beginners to learn web development with the
    Ruby on Rails Tutorial (and an impressively large number have), it can be challenging
    and occasionally frustrating, and I don’t generally recommend it. Instead, I recommend
    starting here.


    Many programming tutorials either gloss over the command line or assume you already
    know it. But understanding the basics of the command line is absolutely essential
    to becoming a skilled developer. ${ }^{1}$ Indeed, if you look at the desktop
    of an experienced computer programmer, even on a system with a polished graphical
    user interface like Macintosh OS X, you are likely to find a large number of “terminal
    windows”, each containing a series of commands at a command line (Figure 1). Proficiency
    at the command line is also useful for anyone who needs to work with developers,
    such as product managers, project managers, and designers. ${ }^{2}$ Making this
    valuable skill accessible to as broad an audience as possible is the goal of Learn
    Enough $^{\mathrm{TM}}$ Command Line to Be Dangerous.


    # 1 Basics


    As author Neal Stephenson famously put it, “In the Beginning was the Command Line.”
    Although a graphical user interface (GUI) can dramatically simplify computer use,
    in many contexts the most powerful and flexible way to interact with a computer
    is through a command-line interface (CLI). In such an interface, the user types
    commands that tell the computer to perform desired tasks. These commands can then
    be combined in various ways to achieve a variety of outcomes. An example of a
    typical command-line command appears in Figure 2.


    This tutorial covers the basics of the Unix command line, where Unix refers to
    a family of operating systems that includes Linux, Android, iOS, and Mac-\


    As discussed in Section 1, this statement applies to the Unix tradition, which
    is the principal computing tradition behind the Internet and the World Wide Web,
    and the tradition followed by this tutorial.


    Knowing the command line is also essential for system administrators (sysadmins).'
