- img_proc: true
  md: '# CHAPTER 1 YOUR FIRST BITE OF RASPBERRY PI


    UNIX mount command (which we will cover in later chapters), but if anything on
    your Mac happens to be looking at the SD card, unmount will fail and claim the
    device is busy. diskusi is aware of this and can usually unmount the device without
    problems. We ran the following command:


    ```

    mbp: root# unmount /dev/disk2s

    Volume UNTITLED on disk2s unmounted

    mbp: root#

    ```


    With super-user privileges, we are invited to write to it, and we unmounted the
    filesystem so we can write directly to the card itself. All we have to do is actually
    go ahead and do the writing!

    The tool of this task is called dd. This tool is a bit old school in that it only
    cares reading from a device and writing to it. It has no interest in filesystems
    nor the subtle differences between a hard disk and an card. It is a fundamental
    UNIX principle that we will be revisiting in later chapters. Now, we''re going
    to take advantage of this to make an exact copy of the image on the SD card.

    diff only needs to know two things: where to read from (the if argument) and where
    to write to (the of argument). We figured out the writing bit (it''s going to
    be /dev/disk2), but what about the source? If you followed the earlier instructions,
    you should have the image file in the Downloads directory in your home area. The
    easiest way to get information into terminal is to type this:


    dd if=


    Then go to your Downloads directory in Finder (or wherever you extracted the image
    file), click and hold on the image file, and drag it onto your terminal window.
    This should then paste it in the full path for you without needing to type anything.
    This would mean you end up with something pretty similar to this:


    ```

    dd if=/Users/myuser/Downloads/2012-08-16-whezy-raspberry.img

    ```


    Now we have our image file set, all we need to specify exactly we we want to write
    to. Thanks to our earlier experiment we know that this will be /dev/disk2. We''re
    also adding bs=512 which lets dd write the image in bigger chunks (meaning you
    won''t have to wait four hours for it to complete). The full command we need for
    dd looks like:


    ```

    dd if=/Users/miggy/2012-08-16-whezy-raspberry.img of=/dev/disk2 bs=512

    ```


    Running this command takes some time (hours, seconds). The image is 2 GB in size,
    and your average smart card reader is. Our recent MacBook Pro took two hours to
    actually write the image. After coming back, you''ll find that dd has completed
    its task and you''re back at the command prompt.


    Okay, this didn''t want as simple as straightforward writing the image to Windows,
    but if everything we had to do, using the command line allowed us to express what
    we wanted in a very compact and precise way. This is something we come back to
    in Chapter 3, which we will look at the various benefits of learning to use the
    command line.


    Here is the full transcript of the commands we entered to write the image to disk.
    If something in our explanation didn''t quick click, or you''re not sure what
    the result should look like, you can use the following transcript as a reference
    to compare your version with ours:


    ```

    Last login: Wed Sep 19 13:48:40 on tty000

    mbp: pmembre5 sudo -i

    Password:

    mbp: root# mount

    /dev/disk2 on / (fs, local, journaled)

    devfs on /devfs, local, no

    ```


    16'
