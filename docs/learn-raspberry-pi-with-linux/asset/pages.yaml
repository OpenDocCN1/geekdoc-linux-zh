  md: '# Opening a Virtual Terminal in the GUI


    Raspian uses the Lightweight Desktop Environment (LXDE). As its name suggests,
    it focuses on being lightweight, which is just what you want when your computer
    sits squarely in the featherweight category!

    The native terminal for LXDE is called LXTerminal, and fortunately for us it not
    only comes preinstalled but also features on the Raspian desktop, as shown in
    Figure 3-3.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_71_0.png)


    **Figure 3-3.** Finding LXTerminal


    We took the liberty of double-clicking the icon, and you can see that we have
    what can only be described as a working terminal. Of course, there''s really not
    too much to show in this case because a terminal is by definition pretty simple.
    You will probably find yourself using the terminal a bit if you''re planning to
    sit in front of the Pi and use it as a more traditional computer. If you''re thinking
    more about working remotely, then you need to read the next section, which is
    quite a lot interesting.


    # Connecting via SSH


    SSH is a great way to connect securely to your Pi over the network (see the sidebar
    “What’s Special About SSH?”). It gives you all the benefits of a virtual terminal,
    you can access it from any machine on the network. This means that you could connect
    to your Pi at home from your work PC and fiddle with it in complete security.
    We find that SSH is by far the most common we interact with servers in general,
    and because many people use the Pi as a headless device (i.e., no keyboard or
    mouse attached to it—maybe not even a monitor), we think SSH will be the primary
    candidate for it as well.


    There are two parts to the SSH equation. You need an SSH server and you will need
    an SSH client. Fortunately, both are freely available and easy to set up.'
