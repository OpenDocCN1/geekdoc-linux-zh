  md: '# INTRODUCTION


    This has drifted up through schools and into universities. Teaching programming
    is a relatively challenging task. It requires a certain way of thinking that for
    many people to get a handle on. Traditionally, universities would start a computer
    science course by teaching about logic gates, how memory works, and how to program
    a CPU. Only you understand what the bare metal was doing would you to learn C
    although C is a high language, it reflects the hardware it runs on. Understanding
    the hardware makes C that much easier.


    With larger classes, less time teaching, and students arriving with less and less
    knowledge of computing fundamentals, universities have to adapt. Rather than teaching
    that low-level stuff, now they teach Java and scripting languages (they loved
    it). These languages all like "fiddly bits" for you, you can easily pretend they
    aren''t exist (although this can cause some issues; "The Infinite Memory Myth")


    This is simply fantastic from a productivity point of view, but when you want
    to take it to the next level (maybe you''re processing your data and script is
    just too slow), you have no idea where to turn. Worse when someone tells you the
    technique for improving, you have no idea what they''re talking about.


    Of course not all universities have this issue. I''m studying at the Hong Kong
    Polytechnic University, and its course on Computer Architecture involves a lot
    of it. If you want to get the top grade, you will need to implement a CPU simulator
    and there''s a lot to learn for everyone on this course. So, we need more than
    this. It''s too late to capture people''s interest when they''re starting degrees.
    I taught seven-year-olds to program how BASIC when I was in my first year of school
    (they got present certificates by the school) and they loved it. Letting you create
    a virtual world with your mind (the children liked to create little text-based
    adventure games) and ultimate power rested in their hands. They got creative;
    they added spells, new roads, secret entrances, and more. Okay, they needed a
    helping hand (they were only seven) but they had the desire to create and build
    new things.


    # INFINITE MEMORY MYTH


    Over the years, I''ve done lot of consultancy work with large enterprise customers
    and that has inevitably me come across Java on many occasions. One of the interesting
    things I have come across is what I''ve termed the Infinite Memory Myth. This
    seems to creep up in Java applications than in other languages, but that''s probably
    because Java tends to be more widely used in these settings.


    The short version of the myth is that developers seem to constantly create new
    objects, to the point where the application consumes huge amounts of memory or
    crashes altogether. They have no idea how much memory each object takes, or more,
    why worry. As far as I am concerned, a new object and one is produced. When an
    object is not needed (i.e., nothing points to it any more), Java will at some
    point get around to cleaning it up (called garbage collection). All of this is
    automatic; the developer doesn''t need to do anything.


    The problem is that this leads people to forget (or in many cases were never taught)
    that memory is finite, and at some point it just runs out. You can''t assume you
    can read in every row in a table and that it will always work. You can''t assume
    your test file is 50MB in size that the application will be given a 5,000MB file
    to work on.


    This lack of understanding stems from not being able to appreciate all the hard
    Java is doing on the programmer''s benefit. It''s about running about and managing
    memory allocation and garbage collection, and the programmer remains blissfully
    unaware. A good understanding of computing fundamentals would give a developer
    keen insight into what Java is doing (both the how and the why) and appreciate
    that just because creating objects is easy, memory itself is not free.'
