    In the UNIX of thinking, all people have their usernames. A username identifies
    a particular person or entity (for example, a web server might have its own username)
    on a particular system. So, far''ve spent most of our life as pl, but we''ve also
    seen that we can become the root user. Your username is the key that Linux lets
    us identify you.


    Groups are similarly straightforward. Each user belongs to one primary group,
    but may also be a member of any groups on the system. On a university system,
    a student''s username might have its own private group (standard practice on Red
    Hat and Debian systems these days) but may also belong to a student group and
    a research group. Groups are useful to administrators because we can group a selection
    of users together and treat them as a single entity. This makes things such file
    permissions easier to manage.


    When you create a new user on your Pi, you will automatically create a group with
    the same name. On some systems, users would default join a user''s group, but
    as you''ll see in the next section, this could lead to accidentally giving people
    access to files they shouldn''t have. Because a private group is by definition
    private, no one will be a member, and no one can gain access to your files just
    they happen to be in the same group as you. This is why modern systems usually
    set the owner and group of a file to be the same.


    # File Permissions


    File permissions allow you to determine who you want to access your files and
    what exactly they''re allowed to do with them. There are three different permissions
    that you can set. The first is whether or not someone can read your file. The
    second is whether they can write to your file. And third is whether they can execute
    it (i.e., run an application).


    Of course, just being able to set these permissions on a file isn''t perfectly
    flexible. You might want to give access only to a certain group of people and
    restrict everyone else. On Linux, this is where users and groups come into play.
    There are three roles that a user might fill:


    +   * User: Refers to the owner of the file

    * Group: Refers to the group that owns the file

    * World: Also referred to as other


    Each role gets its own combination of permissions; that is, you can define whether
    any of these three roles can read, write, or execute your files. We''re going
    to show you how to do just that that but before we do that, we need to show you
    how to see what permissions are effective in so and what is a good time to show
    you how to use the -lh option for the ls command. Let''s try running it!


    ```

    $@raspberry pifun$  ls -lh

    -rw-r--r-- 1 pi pi1 0 Oct 7 16:29 pi

    -rw-r--r-- 1 pi pi1 0 Oct 7 16:58 pi2

    -rw-r--r-- 1 pi pi1 0 Oct 7 16:29 raspberry

    $@raspberry pifun$

    ```


    The lh argument specifies that we want to show us a list of files (-l) and that
    we want file sizes to be in human readable format (-h). Without the human readable
    flag, ls will show all sizes in bytes, which but when you''re dealing with large
    files isn''t very easy to read. It doesn''t really matter in this case because
    our files are empty, anyway.


    There are two things that we''re really interested in as far as file permissions
    go. The first describes the permissions currently in force, and the second shows
    which user and group owns the file. Let''s break it down for the Raspberry file:


    ```

    -rw-r--r-- 1 pi pi 0 Oct 7 16:29 raspberry

    ```'
