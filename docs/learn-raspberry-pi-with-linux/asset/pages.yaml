  md: '# Introduction


    Despite sounding like Grandma would bake on Sunday afternoons or a noise that
    would make people glare and tut, the Raspberry Pi is in fact a computer. That
    much you probably knew (although, let''s be honest, the name and logo don''t really
    give much away) but the Raspberry Pi promises more than that. An awful lot.


    The venerable Commodore 64 was released in 1982, with sales reaching upwards of
    17 million, it is often considered the best-selling computer of all time. More
    importantly (at least from my perspective), it was also my first computer. For
    Christmas my ninth birthday (when the C64 was nearly a decade old) I received
    the new model (C64), which was identical to the classic machine in all respects.
    It was all set up and attached to a cassette recorder called a datasette. My dad
    had hatched what he believed to be a most cunning plan; if the code started and
    finished while I was asleep, Christmas morning, I would be so playing with the
    computer that my parents were through without sleep.


    Sadly, things didn''t go according to plan. Although everything was set up, and
    even the television was tuned to a computer signal, one small key had been forgotten:
    it hadn''t occurred to tell me how to actually load a game. Needless to say, a
    lie in was not forthcoming ...


    Came on cassette tape. (What do you mean this was a CD? And that the C64 had to
    be played in a special tape recorder the datasette spent more time in the shop
    than being attached to my computer and it was the only way to load anything into
    it, I had no choice but to occupy myself with the manual. I did use great effort
    and taught myself how to program good BASIC (Beginners All Purpose Symbolic Instruction
    Code) better than anyone ever seen.


    While I''m sure this story is very gripping, you could be forgiven for wondering
    why I am boring you with it. These events happened more than two decades ago,
    so what possible relevance could they have today? Well with that machine and the
    Amiga that followed it (still my favorite machine of all) we made a real revelation
    for what a computer could do. The Amiga was severely underpowered compared to
    PCs of the same era, yet it consistently beat them with better graphics, reliability
    and sound. It was able to do all of this because the hardware was wisely designed.
    Amiga enthusiasts were some of the most resourceful people I''ve ever seen. Who''d
    thought you could turn a real-time clock port into a connector for high-speed
    storage


    All of this was only possible because people really understand how the parts fit
    together. I know the ins and outs of the machine because they really know how
    the machine worked. I spend my day trying to make things go fast. To have any
    hope you''d need to know how everything works. People need like me to push things
    around, but they''re coming from a bit of a problem. People who really know computers
    are out getting ever much harder to find—we are a dying breed, and this is the
    situation that the Raspberry Pi Foundation is desperately trying to revive.


    So what happened? Well, things changed. Computers went from the corner becoming
    a basic part of everyone''s life. They evolved to the point where just and everyone
    knows how to use them. This is similar to how a car works, but few people are
    interested. The car takes them from place to place, and what is what is interesting,
    not how the car achieves it. Computers are generally seen in the same light. People
    have a rough idea about turning them on, installing software and so, but how they
    actually work at a low level isn''t really seen as relevant or interesting. In
    this turn that not only are fewer people getting excited by understanding itself
    but even fewer people think there''s more to it than double-clicking an icon.'
