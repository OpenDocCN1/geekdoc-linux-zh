    Once we have installed SMTP we need to configure it. The SMTP configuration file
    is /etc/smtp/smtp.conf. Open it up with your favorite text editor and get started.

    The first thing we need to configure is where the mail is destined to go. Most
    people who will read this book will have different and specific location where
    they want their mail to go. All good spies wants to be as efficient as possible,
    I can deal only with what''s in front of me, so we will be configuring for the
    most generic and free option to email: Gmail

    So we need configure where the mail is sent; in SMTP, this is governed by the
    mailhub value. This value is the DNS name of the mail server we will use to send
    outbox mail. This is traditionally named `mailhub=whatever`, but for it will be
    set.gmail.com=587, which is Google''s SMTP server.

    Having the set gmail, you may have noticed that we included a :587 over the end.
    The obvious you will recognize this as a port number. The even more obvious would
    be that :587 is not the default port for SMTP (it is 25). It is the port dedicated
    for Transport Layer Security (TLS) e-mail (secure e-mail over SSL). We need to
    add another pair of options to ensure that we have encrypted communications:


    ```

    UseTLS=YES

    UseSTARTTLS=YES

    ```


    The next option is to configure the hostname, which is the hostname listed by
    the Raspberry sPi. Go ahead and list a hostname for the sPi if you have a domain.
    raspberry.spi. The next option should be FromLineOverride=yes, which allows us
    to set the "from" on an e-mail if we do so.

    Finally, the last sets of options are related to authentication. There are three
    options you need to configure. The first two are the most obvious: username and
    password. Go ahead and add AuthUser=username@gmail.com and AuthPass=password.
    The third, which is a little more circuitous, is the AuthMethod option, which
    is used to specify which authentication method will be used to allow users to
    register with the server. The method we will be for Google is the LOGIN method.
    Other servers may not require this to be specified, with Google we should set
    AuthMethod-LOGIN.


    ```

    root=

    Mailhub-smtp.gmail.com:587

    UseTLS=YES

    UseSTARTTLS=YES

    Hostname=raspberry.spi

    FromLineOverride=yes

    AuthUser=username@gmail.com

    AuthPass=password

    AuthMethod-LOGIN

    ```


