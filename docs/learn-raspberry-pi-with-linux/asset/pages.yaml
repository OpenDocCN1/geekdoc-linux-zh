    the way you know it!


    # Moving About in vim


    Although we''ve already shown you how to move your text file, we haven''t leveraging
    the power of vim. Vim provides additional commands that can allow us to navigate
    through text more quickly.


    In command mode, you can move around your text using the cursor keys, which is
    convenient. In effect, you can do the same thing using two other commands: the
    h and l. The h key will move the cursor back one character, and the l key will
    move the cursor forward one character. Admittedly... the b and w commands work
    just like the previous commands.


    We can take this step further, though. If you want to jump to the beginning of
    a line you press the 0 (zero) key. To get to the end of the line, you simply use
    $ (in case, that means holding down the Shift key and pressing the 4 key).


    Table 6-1. Common Navigation Shortcuts in vim


    | Movement | Key press |

    | --- | --- |

    | Start of line | 0 |

    | Back one word | b |

    | Back one letter | H |

    | Forward one letter | l |

    | Forward one word | w |

    | End of line | $ |


    So what we now have is a progressive way to move our cursor from one end of the
    line to the other. No longer do we have to fiddle with the Enter or backspace
    keys, or fall asleep waiting for the cursor to trundle across the screen. That
    is the beginning, though, these keys can be used for more than just moving around
    your file; they can also be used to specify the scope of the commands you feed
    to.


    # Deleting in vim


    In command mode, to delete a single character all you need is to press the x key.
    This will remove whatever happened to be under the cursor at the time (usually
    when tweaking a typo), but it doesn''t really offer any great advantages over
    dropping into insert mode. The d key, however, provides a very powerful delete
    command that you can now combine with your newly acquired knowledge of moving
    the cursor to do some pretty impressive things.'
