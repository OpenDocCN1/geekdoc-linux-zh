    DHCP, but would give your WiFi adapter a static IP address. You simply need to
    change the interface line to read static rather than dhcp and add details for
    your IP address, subnetmask and gateway. Your config will look like this:


    Now that you have successfully configured wireless on your system, you can go
    ahead and reboot your Pi to check that the wireless adapter comes up. If not,
    go back and ensure that you set auto=false flag in the NetworkManager config file.

    If that doesn''t work, go over your configuration settings for SSID and WiFi password.
    You can can confirm whether or not you can start your wireless adapter with ifup
    wlan0; if there are problems connecting and getting an IP address your system
    should show them giving you a chance to work out what''s going wrong. Finally,
    if you just can''t get it to run, try removing any other attached USB devices;
    they can draw valuable power away from your WiFi adapter.

    Last thing on the command line that may help you is the iw series of commands:


    +   - You can iwlist with the scan option to get a scan of information about nearby
