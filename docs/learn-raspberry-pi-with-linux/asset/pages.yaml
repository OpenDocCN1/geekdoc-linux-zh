  md: 'Now that we have been able to view the PATH variable, we should look at modifying
    it. To modify a variable, we need to use the export command in assign it into
    our environment. The syntax for setting a simple variable is:


    ```

    $ export VARIABLE="SOMETHING"

    ```


    If you run this and run again, you should see this new variable show up within
    your output like:


    ```

    VARIABLE=$SOMETHING

    ```


    If we do to this to our PATH variable, we would reset it to whatever we set it
    to, which is not what we want. We could also rewrite the whole path, but that
    is quite arduous for a simple change. The easiest way to append something to the
    PATH variable is to include the PATH variable under the assignment. Let''s work
    with an example: say we want to include the /opt directory into our path. We would
    start with export PATH and then we would want to use the current PATH (as we use
    by echo), so we write "$PATH". To thePATH we would add a colon as a separator
    and the new directory /opt, which gives us this command:


    ```

    $ export PATH="$PATH:/opt"

    ```


    When run, this will change your PATH variable to:


    ```

    /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin:/usr/local/games:/usr/opt

    ```


    Awesome; the /opt was appended to the end. This brings us to a key point: PATH
    has an order, left to right. Those on the left side of the PATH variable will
    be used before those on the right. In our example, /opt would be the last place
    we search for any file.


    Now that you understand your environment and how PATH works, you should learn
    about a special file in your home directory. This is your local shell profile
    override file. In your home directory there are a number of hidden files that
    end with rc. These files are normally executed by your shell or whichever one
    you use to load your personal preferences. The file is responsible for the standard
    Linux BASH it is the .bashrc file. This is the reason that some of your commands
    have color. For example, the ls command, which is normally located at /bin/ls
    (which you can check with which). If you were to use this instead of the normal
    ls, you would not see the colors! These colors were added by the .bashrc file
    using the alias command.

    alias, as it name tuples, is aliased to a command or a group of commands under
    a single shell command, just like a program. In the case of your .bashrc, it is
    aliased the ls command to execute this:


    ```

    $ ls --color=auto

    ```


    This means that every time you use an ls command, you are automatically adding
    the color argument to ls. The way .bashrc does this is by binding:


    ```

    alias ls=''ls --color-auto''

    ```


    The great thing about files like .bashrc they are designed to be user modified—after
    all, they are your local system variables. In your way, your local environment
    is made from the base system values given by /etc./profile and the additional
    values given in .bashrc.'
