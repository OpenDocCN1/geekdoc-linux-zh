  md: '# /var


    /var is generally where you''ll find files created by your applications and many
    will store the lock files in /var/log/, and /var/run/. Lock files don''t have
    any meaningful content; an application uses them to work out it is running safely
    so that it accidentally have two copies running at once. On Raspbian, the Apache
    web server uses /var/www/ for storing a website''s files. In other distributions,
    this is not the case—such files tended to be located in the /srv/ directory. That
    said, mature applications may still be in /var, even on modern distributions.


    # /boot


    Traditionally, the /boot directory actually lived on its own partition on the
    first hard disk. At the time, the majority of computers were unable to boot from
    a single big partition, so it was very common to see these split out. On modern
    machines (although the Pi still requires it), this is no longer a problem, this
    directory is often included in the root directory. As its name suggests, it holds
    the key files needed to boot a system, including the bootloader and the Linux
    kernel.


    # /bin and /sbin


    These locations store user and administrative programs, respectively. When you
    try to run a program from the command line, there are specific places that the
    system will use for the application. This list of locations is known as the path.
    A normal user uses /bin in their path, so effectively they can see applications
    in /sbin. There are some applications that the user can access even though they''re
    generally used by administrators, but the user needs to know where they are. This
    usually doesn''t pose a problem, and you won''t need to go looking for anything.


    # /dev


    We already touched on this in the system by the "Everything as a File" section.
    It contains a file for each device or subdevice on the system and provides a way
    for tools (and, of course, users) to easily access the hardware on a particular
    machine. Beside the disks discussed earlier, there are also devices for graphics
    cards, sound cards, virtual terminals, and more.


    > Note You won''t find network cards in the /dev directory because they''re considered
    a special case. To find information on network interfaces, you need to use the
    sudo ifconfig -a command. This will list all the network devices that Linux knows
    about. For more information, check out Chapters 3 and 9.


    # /home


    Traditionally, all user home directories would be stored under /home and this
    was often on its own partition, or network share. Most UNIX-BASED systems still
    follow this rule, but there are occasions when you will find some home directories
    living elsewhere (i.e., the user''s home directory). The Mac, for example, stores
    home directories in /Users, and some businesses will put different users in different
    locations based upon their needs. Although /home generally contains only home
    directories, there''s no requirement that home directories actually reside here.'
