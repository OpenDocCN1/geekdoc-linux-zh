    Resolving mirror.westfield.com.au (mirror.westfield.com.au)... 203.42.62.21

    Connecting to mirror.westfield.com.au (mirror.westfield.com.au)... 203.42.62.21[:80]:
    connected.

    Length: 20679 (20K) [application/gzip] 200 OK

    Saving to: Net-SDP-0.07.tar.gz

    100%[=====================================> 20679

    --K/s in 0.05s

    --2012-09-30 19:01:12 (382 KB/s) ''Net-SDP-0.07.tar.gz'' saved [20679/20679]

    ```


    Once the file is downloaded, you need to extract it with the tar command. Use
    a command to unpack the file with -xvf to unzip and extract this tar. Then change
    into the newly created Net-SDP-0.07 directory:


    ```

    $ tar xvf Net-SDP-0.07.tar.gz

    $ cd Net-SDP-0.07

    ```


    Now that the file is here, you need to issue commands to build the Perl system.
    The first is to execute the Build.Pl script to generate the build file:


    ```

    $ perl Build.Pl

    Created MYMETA.yaml and MYMETA.json

    Creating new ''Build'' script for ''Net-SDP'' version ''0.07''

    ```


    Once the build file is created, you need to run it with this:


    ```

    $ ./Build

    Building Net-SDP

    ```


    And once the build is finished, run the inbuilt tests to ensure there are no problems
    by issuing the test command


    ```

    $ ./Test

    t/00use.t ...... ok

    t/10generate.t .. ok

    t/10parse.t .. ok

    t/20repeat.t .. ok

    t/30asstring.t .. ok

    All tests successful.

    Files=5, Tests=69, 5 wall clock secs (0.97 usr 0.05 sys + 3.40 cur 0.29 sys =
    4.71 CPU)

    Result: PASS

    ```'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'Finally, you need to install the modules, so issue the install command to the
    build script (you might need to press Enter after the command to get the install
    to finish and display):


    ```

    $ sudo /Build install

