  md: '# TERMINAL OR VIRTUAL TERMINAL?


    For the most part, you won''t have to worry about the differences between the
    two. You will almost always use a virtual terminal that is either a terminal window
    inside the Linux GUI or connecting via SSH. The only real difference between a
    terminal and a virtual terminal is that terminal is a single physical device such
    as a serial port or sitting at the screen directly connected to the computer (without
    a GUI). A virtual terminal has a device assigned to it, but there is no corresponding
    physical device. In fact, under Linux a new device is created and assigned to
    each new virtual terminal.


    We brought up the distinction because some documentation (generally speaking,
    old documentation) might refer to one or the other. These days, though most of
    your time will be spent on a virtual terminal, and you won''t need to worry about
    the difference.


    # Three Terminals


    There are many ways to get to the command line. The first is to sit physically
    in front of the machine and use what is often referred to as the console, you
    are directly working on the machine because it is and the second is to open a
    virtual terminal inside the GUI, and the third is to connect over the network
    using SSH.


    # Console


    Although the console is simply another terminal, it is a term that has gained
    a somewhat mythical status over the years. When you''re working on the console,
    you are directly working on the machine because it is literally a keyboard and
    monitor plugged directly into it.


    It used to be very common for administrators to restrict certain users (such as
    the root user, on that than later) to be able to log only when sitting directly
    in front of the machine. Because the computer was likely in a locked server room,
    this provided an additional level of security.


    Most distributions do not come with this security enabled, and now remote access
    over the network is the norm (sometimes an administrator doesn even have physical
    access to the machine or is on the other side of the planet), this is far less
    usual.


    Still, if you are sitting in front of your Pi, you can access the console by holding
    down the Ctrl and Alt keys and pressing F1 through F7. by default is where the
    GUI lives, so once you have finished with the console, you can flip back to GUI.


    When would you need to do this? Well, you can''t connect to your Pi via the network
    and you''re having trouble with the GUI, the console will be your new best friend.
    Generally speaking, you won''t use the console very because there are usually
    more convenient ways to get the same effect (we cover them next). However, when
    setting the system or if you''ve decided not to use the graphical interface, the
    console will be your only real choice for accessing the machine locally.


    Getting a command line through the other two methods is easier and more flexible
    because as often at least one of those options will be available to you.'
