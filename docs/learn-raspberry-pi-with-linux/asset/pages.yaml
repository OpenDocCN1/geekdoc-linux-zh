  md: '# Miscellaneous Little Commands


    Before we move on to look at some of the features of Vim''s visual mode, we''re
    going to provide a very quick overview of some other simple commands that will
    come in mind. The i enters insert mode, but sometimes you want to insert immediately
    above or below the cursor. You can get this by using O and o respectively. These
    will both insert a new line then switch to insert mode. Sometimes you don''t need
    to actually edit the content of a file; you just need to change a single character.
    This could be because of a typo or you just want to increment a number. You can
    do this with the r key. This allows you to replace the character under the cursor
    with any other character. Simply press r and then type the character you want
    to replace with. Simple but very effective!


    # Visual Mode


    Visual mode is not something we very often, but it can save you a huge amount
    of time and effort. This mode enables you to select or highlight blocks of text
    for further processing. This is akin to highlighting with your mouse in a word
    processor. There are two ways you can enter visual mode from command mode: by
    pressing either the V key or the v key. If you use the uppercase V, you will be
    able to select a block of text. With the lowercase v, you gain extra precision
    you can select letters rather than entire lines. The overall result is the same,
    and the option you choose depends on which one would be most convenient to you.


    So exactly what can you do with visual mode? Really it doesn''t do anything in
    out of itself; it just provides an easy way to tell what text the following command
    should be applied. In keeping with our previous examples, let''s select a chunk
    of Mary''s poem, as shown in Figure 6-23 (You don''t need to highlight the exact
    text that you have, but try to get a random chunk).


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_137_0.png)


    Figure 6-23. Highlighting text in visual mode


    As you can see, using the lowercase v as we wanted to highlight within a particular
    word. There''s no real reason for that apart from a sense of the dramatic, so
    it could easily have been a bunch of lines selected with V. Now let''s apply our
    favorite command: the delete command. By pressing d, you will find that the highlight
    magically disappears. In this case, you don''t need to provide additional information
    to to tell it what to delete in effect you''ve already tried by highlighting the
    text in the first place.


