    \ If you are in doubt, feel free to search Google because it's almost certain\
    \ someone, somewhere has the same error before you and asked for a solution.\n\
    \n# ## Practical BASH: An Init Script\n\nYou should be aware by now that most\
    \ Linux applications are started by a special script called init script. These\
    \ scripts aren't magic; they are simply scripts in Bash that take a given value\
    \ and perform a series of actions based on what they are told to do—just as any\
    \ good program does. The init scripts do have a small amount of special information\
    \ in them, but none of this is actual logic.\n\nLet's go through one together\
    \ and examine exactly how one of these init scripts works. Following is the init\
    \ script for XBMC, which you will see again later in this book:\n\n```\n##!/bin/bash\n\
    ### BEGIN INIT INFO\n# Provides: xbmc\n# Required-Start: $all\n# Required-Stop:\
    \ $all\n# Default-Start: 2 3 4 5\n# Default-Stop: 0 1 6\n# Short-Description:\
    \ Start XBMC\n# Description: Start XBMC\n### END INIT INFO\nDAEMON=/usr/bin/xinit\n\
    DAEMON_OPTS=\"/usr/lib/xbmc.bin\"\nNAME=xbmc\nRUN_AS=root\nPID_FILE=/var/run/xbmc.pid\n\
    test -x $DAEMON || exit 0\nset -e\ncase \"$1\"\n  start)\n    echo \"Starting\
    \ $DESC\"\n    start-stop-daemon --start -c $RUN_AS --background --pidfile $PID_FILE\
    \ --make-pidfile --exec\n    $DAEMON $DAEMON_OPTS\n    ;;\n  stop)\n    echo \"\
    Stopping $DESC\"\n    start-stop-daemon --stop --pidfile $PID_FILE\n    ;;\nesac\n\
    ```"
