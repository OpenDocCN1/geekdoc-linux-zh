  md: '# Pick and Match with the case Statement


    Once all the initialization is done and the script has set some initial variables,
    it performs a few tests and then moves to the case statement. A case statement
    is very like a series of running if statements against the same variable. Insofar
    as you have a given variable and for each of a series of values for said variable,
    you perform a function. In most init scripts, this is used to confirm what action
    it is to perform.


    The case statement in this start script is working on the special $1 variable.
    This variable represents the first thing passed to the script from the command
    line; when trying to start the xbmc application, you will execute with this:


    ```

    /etc/init.d/xbmc start

    ```


    This gives the $1 value of the start. The case statement offers a number of different
    options of the case statement:


    +   - start: Self-explanatory.

    - stop: Self-explanatory.

    - restart|force-reload: The values of restart or force-reload, which perform the
    stop application and then the start application in one process. The pipe (|) then
    is used to denote an OR operation, which means that if either of the values here
    match, we treat this as having a match.

    -* Anything else.


    After each case value, there is a small block of code that is executed in that
    case, followed by a pair of semicolons. These semicolons are like a fi and are
    used to denote the end of a case statement.


    # Application with case statement: Forking


    Once the case statement, you can see that each line will perform some action with
    the start-stop-daemon. But this isn''t a variable or anything; it''s another program.
    The most powerful part of BASH is the best we''ve gotten to yet. YASH has the
    capability to execute any command-line process from your programs just by using
    their names. BASH is the we use most of the rest of the time, which actually makes
    a lot of sense.


    The last function of an init script; it is used the start-stop-daemon to create
    a new process for you. This action is called forking because you are forking something
    of the currently running application. The start-stop-daemon is a small application
    that is used to fork off processes and manage their running for you. The script
    tells the start-stop-daemon which action needs to be taken again which.


    Now that you are aware with this knowledge, you should be able to write your own
    init scripts to start how the script should be loaded, having a case statement
    determine which action to take, and finally executing the start-stop-daemon process
    to launch and manage your application!


    # Update the Run Files


    Now you have a fully working script to go. You need to chmod the executable flag
    on your file and you can test it with the start and stop commands. This is intended-fantastic!
    We need to add it to the system''s boot logic. Historically, this involved linking
    a file special in the various run levels. However, this has been made much easier
    with the update-rc.d application. The update-rc.d application takes advantage
    of this special comment headers added to our BASH scripts in order to know which
    run levels should avoid shortcuts.'
