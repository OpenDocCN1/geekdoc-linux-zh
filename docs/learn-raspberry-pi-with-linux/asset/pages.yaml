    # Troubleshooting


    Now let''s go over some ways to troubleshoot some issues. First, try making each
    code change in sequence and then reload the page. You can use the view command
    to see the full HTML that is being generated by the PHP and see whether values
    are showing up correctly. If you can''t get that, have a look at the error log
    (the one from right back at the start when we configured Apache). This file will
    list all of the PHP errors that occur. Have a look to ensure that your quotation
    marks are open and closed correctly and haven''t left anything aligned. Check
    that you have a semicolon at the end of each of your statements (I always forget
    this). Check that your parentheses, square brackets, and brackets are opened and
    closed correctly with no overlap.


    Much of this in PHP and web development is trial and error. You should check that
    statement or block of code as you add functions and variables. You can use print
    statement to output variables as they are generated to see what exactly you are
    doing, which is a great way to diagnose any problems with your SQL statements.
    Finally, remember that if you have access to the full system, go ahead and insert
    values into your SQL and delete them as needed; use the system to work out what
    it is doing and what causes your problems.


    # Where From Here?


    +   - AddInsert(); checks to each of the insert values to check that you are actually
    inserting values, not just spaces.

    - Wrap each of the inserted values with the mysqli_real_escape_string function.
    This will increase the security of the to-do list because it prevents people writing
    "nasty" values into your application that will execute as separate SQL queries.'
