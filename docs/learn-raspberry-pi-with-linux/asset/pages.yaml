    in, we actually have a look at the first few lines. The first line spring out
    as familiar—it''s the device identifier that we saw in dmesg from the webcam attached!
    In fact, most of the information in here is all data that was referenced somewhere
    in the dmesg log. Okay, so if we can match the device from dmesg to the device
    in our system, it''s safe to say that the USB webcam we attached is available
    on the filesystem as /dev/video0.'
