  md: '# Low Power


    The Pi has a very modest power footprint. In fact, the Model A only draws 300ma,
    which means you can power the whole thing from your USB port. According to Apple,
    my iMac draws 94 watts at idle and up to 241 watts when the CPU is max. The Model
    A draws at most 1.4 watts, and the Model B draws at 3.5. An awful lot of power
    saved. Understandably, these figures only take into account the power requirements
    of the Pi itself, with a bit extra put aside to power modest USB devices. If you
    add lots of power-hungry devices to your Pi, these figures increase accordingly.


    # APPLES TO ORANGES


    I just know someone is going to cry foul my power comparison—and for reason. It
    is true compared to an iMac, the Pi draws basically no power at all. However,
    it is also true that an iMac does a lot. First, it has a big screen, hard disk,
    and CPU that would blow the ARM on the Pi into the middle of next week. So if
    I''m comparing two different systems compares a golf cart to a Formula 1 car?)
    why am I wasting ink and paper with this description?


    Well, although we are comparing two different machines, we are comparing the same
    sort of tasks. If you want to have a little web server or stream video to TV set,
    a Pi is more powerful than enough to do that for you. Bear in mind that the Pi
    is clocked in 700MHz; not too long, but that what you''d find on a very powerful
    desktop. It''s not long enough that you find such performance on an enterprise
    grade server. Ten years ago, it was just a fantasy. In short, the Pi has more
    than enough to do most of the things you''d want from a server and it won''t require
    a small nuclear power station to do.


    # The Ingredients for the Raspberry Pi


    After seeing all its benefits, you might be wondering why a $35 computer stacks
    up to ones that cost many times that. If you''re not thinking that, you will wonder
    why there is such a big difference in price. If you could get something this cheap
    that does most of the things your main machine can do, something must be up with
    the price of the other machines. After all, if a powerful laptop could be made
    cheaper, it would easily make more money in sales than it would lose in reduced
    profit.


    Well''s true to point out, the Pi, as powerful as it is, will probably never be
    a replacement for your computer. It''s not any particular thing that limits the
    Pi, but a combination of design decisions to balance features with cost that will
    ultimately prevent it from taking the crown. That, it is still a fantastic platform,
    and we''ll look at all of those highlights right now.


    # ARM CPU


    The major and obvious difference between the Pi and your desktop will almost certainly
    have a processor from either Intel or AMD at its core, the Pi has an ARM-based
    CPU. The Central Processing Unit (CPU) is the part that actually runs the programs
    you write. Before a CPU can run a program, it must be translated into a language
    that it can understand. All CPUs execute programs, but the program has to be in
    a language they can understand. An CPU cannot understand instructions written
    for Intel or AMD CPU, which effectively means that off-the-shelf software (such
    as Microsoft Windows and games) cannot run on a Raspberry Pi.


    Okay so you''re not going to be running Windows XP on the Pi, but does the ARM
    offer any advantages? The first advantage is that ARM CPUs draw much less power.
    This isn''t surprising as ARM really came from the embedded hardware industry
    where power usage and heat generation are really a big deal. In fact, you''ll
    find some'
