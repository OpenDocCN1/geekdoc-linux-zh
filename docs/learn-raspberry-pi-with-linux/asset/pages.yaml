  md: '# LXTerminal


    LXTerminal is a terminal emulator for Linux that gives you access to a virtual
    console. We won''t go into any depth on how to actually use this particular application
    because we''ll discuss the details in the next chapter. Sufficient to say this
    tool is used to give you direct command-line access to the operating system. For
    many people, this is a place where angels fear to tread, yet seasoned administrators,
    it is somewhere they call home. To find out whether the command line is for you,
    you''ll have to wait until Chapter 3.


    LXTerminal is a simple emulator (see Figure 2-13), but it gets the job done. It
    doesn''t have all the bells and whistles that some emulators provide, but it is
    perfectly fine for the majority of people.


    Figure 2-13. LXTerminal up and running


    One thing we will mention here is the prompt. When the font color is green, and
    the end of the prompt is a dollar symbol, you know you''re running as a normal
