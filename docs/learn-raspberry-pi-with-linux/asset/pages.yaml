  md: '# What Is Linux?


    Ah, this simple question opens a big can of worms that many people go out of their
    way to avoid. The reason is that in technical terms, Linux means one thing but
    in general speech, it tends to mean something else. When talking about operating
    systems in general, we see Microsoft Windows and Apple OSX to be discrete, whole
    things. If you say “I run Windows,” everyone knows what you are talking about.
    Linux, it’s a bit different.


    Linux is just an operating system kernel, which means that it handles all the
    low-level bits and pieces such as handling devices, and providing easy access
    to networks and hard disks. What makes Linux usable is all the software that is
    wrapped around it. Not much trouble there, but it starts to get complicated when
    you realize that people having opinions about what software be wrapped around
    it. There are no simple or minor opinions when it comes to computing?


    As this is open source, anyone can put it together perfectly in any way they like,
    like people have been able to build their own Distributions. This is an operating
    system with Linux at its core, but with the resources set up to match the goals
    of the people who want to build it. For example, Red Hat Enterprise (RHEL) is
    built to be robust-supportable, and stable over long periods of time. Fedora,
    on the other hand, is released every 6 months or so and is from source (so it
    can be completely optimized for your machine), and Debian goes to great lengths
    to remain stable and secure at the cost of introducing new features.


    # OPEN SOURCE


    In the old days, when computers cost millions of dollars, it was the machine itself
    that sold, not the applications that ran on it. It was common practice for a company
    to write software for you, in order to get you to buy their machine. It wasn''t
    until computers became commodity items that suddenly the value was in the software,
    and companies moved to protecting the software they''d written. One way to do
    this is to provide the software ready to use without the source code (which is
    effectively the blueprint on how to make it). This meant that you couldn''t change
    the software or make improvements to suit your changing needs.


    Many people believe that software should always come with the source code so that
    people can freely exchange, modify, and improve software collectively. Then we
    can do this when the source code is provided and permission is given (through
    an open source license) to make changes.


    Entire books can have been written on this topic, but you can give a presentation
    on this that Peter gave at his university level: http://www.youtube.com/watch?v=-c1LQGh6CI


    Which one is best? Depends on your needs. There''s no perfect distribution; the
    widely-supported Raspberry Pi, which is based on the Debian distribution, is the
    best fit for a particular job. Because it is supported and it''s the easiest to
    use (and likely the fastest to get updated and fixed when things go wrong), we''re
    going to use Raspberry Pi in this book. If you find something a little different,
    Brendan''s opening book (also from Press), Practical Raspberry Pi will show you
    in great depth how to install Fedora and (if you''re feeling particularly brave)
    to make a custom deboot!


    When the Linux kernel first debuted in the early 1990s, no one really appreciated
    the impact it would have on the world of computing. Open-source had already around
    for a long time before this, and countless tools for the UNIX had already been
    released (such as the awesome GCC compiler). However, they were just tools and
    software packages. They still needed a proprietary operating system to run (the
    only available at the time). To be compatible with the open-source, what was an
    open-source kernel to power these systems, and this is what Linux delivered. Many
    will talk about how this brought freedom and to the world of computing, which
    will save you from that particular lesson (although Admittedly there is a bit
    of truth to it) and simply say that it is the Linux kernel that really opened
    source to the eyes of the general public.'
  merge: -1
