  md: 'First, make sure your SD card is not attached to your Mac and then run the
    mount command like so:


    ```

    mbp:~ root# mount

    /dev/diskos2 on /dev (hfs, local, journaled)

    devfs on /dev (autofs, nobrowse)

    map -hosts on /net (autofs, nosuid, automounted, nobrowse)

    map auto home on /home (autofs, automounted, nobrowse)

    mbp:~ root#

    ```


    Now, you will probably be seeing this something, but this might be a little different.
    When we ignore devfs and the map lines as they''re really just parts of the operating
    system. What we''re interested in here is the first line that identifies dev/diskos2
    on /. This is the system, and we want to make sure we don''t touch it. You might
    have additional entries in your list if you have network drives mounted or disk
    images attached. That''s because we''re not really looking for anything at this
    stage; we want to establish a baseline for our system.


    Okay, now it''s time to slot in your SD card. SD cards come preformatted for use
    in cameras (although these days many cameras reformat them, anyway) and so you
    should see it up in Finder under Devices. Our card


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_27_0.png)


    **Figure 1-11.** What you''ll see in Finder after inserting your SD card


    As the card has been automatically mounted, we can now go back and rerun our mount
    command to see how things have changed. Here''s what we get when we rerun it:


    ```

    mbp:~ root# mount

    /dev/diskos2 on / (hfs, local, journaled)

    devfs on /dev (autofs, local, nobrowse)

    map -hosts on /net (autofs, nosuid, automounted)

    map auto_home on /home (autofs, automounted, nobrowse)

    /dev/diskos2 on /Volumes/UNTITLED (msdos, local, nodev, nosuid, noorners)

    mbp:~ root#

    ```


    What we care about is the addition of a new disk, in this disk2. We can see where
    it is mounted (/Volumes/UNTITLED) that this is the disk we are interested in.
    So we know where we want to write to our image.


    > Info BSD split disks into slices. In our example, the mounted file system was
    on disk2s2. This translates to disk2, slice 2. This allows you to reference a
    slice directly, but for our purposes we want to write to the device. So in our
    case we will be writing to /dev/disk2.


    There is one little wrinkle, We can''t write to the SD card directly while we
    have it mounted. If we enter it from Finder, it will not only mount the filesystem
    but it will also eject the device as well. That doesn''t help us because we still
    need the device to be present in order to write to it. To solve this issue, we
    will unmount the filesystem manually using a Mac-specific command called diskutil.
    The Mac has the general'
