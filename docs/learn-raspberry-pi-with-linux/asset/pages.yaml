  md: '# CHAPTER 10 THE RASPBERRY SPI


    Okay, we know what language we will be working in. Next, how will we start this
    one? I see two options here and both will inform which direction we take:


    +   - One is to have the application executed from within the start script for
    motion because we want to run together. This means we can ensure that they are
    both running at the same time and the script will need to be always running and
    then check periodically.

    - The second option is to have the script executed regularly. This means we wouldn''t
    need to start it and keep the script permanently. It also means that if the worst
    happens and the script dies, we won''t need to deal with it and reboot because
    it will be automatically started again. It means that we need to have something
    that will execute the script on a timer, but that can be handled by the cron daemon.


    So, we have two options to decide from, but let''s put off decision for a moment
    because we need to look at first.

    What will we do with images? We have two options again:


    +   - First is to delete each image after we send it. This is good because it
    can save on space as we clean up ourselves.

    - The second option is to keep track of all the images that we have and send only
    the new ones. This means keeping a running track of which we have in stock so
    we can determine which ones to send out.


    So, now that you understand the options, it is time to make decisions. I know
    that it''s hard to decide, so let me make it easier for you. Instead of four possible
    scripts, let''s narrow down to two:


    +   - A script that will run from cron and will search for images, then and remove
    them cron

    - A script that will start with the motion daemon and will monitor all the files,
    keep a running count and then recognize when there is a new image.


    Okay, now that we have two working designs, let''s head on to the next step.


    # Designing Solution


    "Wait; you have two solutions and you didn''t actually pick one. One giant flake."
    I hear you say that and it''s true; I didn''t. Because we had two very different
    ways to achieve our one goal it would be best to cover both, give you the options,
    and share some guidance. So, let''s start by looking at the commonalities that
    both will need a reference for the folder where motion''s captured files will
    be going. We could keep this in a variable and edit it when we change the output
    folder, but that is a lot of effort to go to, changing whole files. That''s not
    the Linux way. So let''s just load it from the motion config file and be done
    with it. It means we need two variables: a variable that will contain the motion
    config file and the second that we will create dynamically to contain the file
    location. The variable that will contain the filename is simple enough with MOTIONCONF=/etc/motion.conf.


    > Note All the following is being done as the root user (you can use su to get
