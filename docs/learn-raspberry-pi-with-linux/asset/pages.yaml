  md: '# CHAPTER 10 THE RASPBERRY SPI


    Now I''ll explain the syntax and how we use this to send alert messages from the
    sPi. The preceding message can be broken down into a few much smaller segments.
    The basic syntax I use for is:


    ```

    echo <mail content> | mutt -s <subject> <recipient>

    ```


    You may be wondering about the use of echo. You need to generate the value that
    will be passed as output and then have the pipe direct into mutt, rather than
    providing it as an argument.


    > **Note** You can include whole sentences with spaces in a shell command by enclosing
    the thing in quotation marks. You can even escape quotes within a command to create
    quotes without!


    We need to also be able to send attachments to our e-mail. mutt has covered because
    it provides the capability to attach to its outgoing e-mail. The reason why I
    elected mutt to create the Raspberry sPi is because it is not only to configure
    but also provides the capability to send attachments. The syntax to send an attachment
    with the e-mail we just sent is as follows:


    ```

    echo <mail content> | mutt -s <subject> -a <filename> -- <recipient>

    ```


    Yes, it''s as easy as that! A attachments, and the -- is used to separate attachments
    from recipients.


    # Troubleshooting


    Did everything work as expected? If not, try configuring both SMTP and mutt from
    scratch. If so, double-check your username and password. Is it an error reporting
    unsupported login type? If so check the TLS settings and the AuthMethod setting.
    Did you spell your mail server incorrectly? Is their trailing whitespace? That
    is spaces or tabs at the end of any of your entries. When you changed permissions
    you may encounter an error if you try and send an e-mail as the pi user, without
    sudo because the pi user is not a member of the mail group on your system. If
    you wish to allow the pi user or other user for that matter, need to add them
    using gpasswd, the syntax is this:


    ```

    $ passwd -a <username> mail

    ```


    Okay, so all sorted? You can capture the presence of the intruders. You can alert
    yourself from the Raspberry sPi. You can send the captured images of your intruders
    to yourself from your sPi. So what''s left? Automating it all.


    # Bringing It All Together


    So far have done the following:


    +   - Attached a webcam to the Raspberry sPi

    - Installed and configured the monitor application to use the webcam

    - Used the webcam and monitor application to function as a motion sensor and capture
    images

    - Installed and configured SMTP as an MTA


