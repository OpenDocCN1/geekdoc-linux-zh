    # Micro USB lead


    If you have to have an Android phone or a Kindle sitting about, chances are good
    that you''ve got a lead that you can reuse to the Pi. This lead isn''t actually
    used for transferring data, and although you can draw power from a USB port (you
    can plug it into your main PC or laptop), you can''t use the USB connection for
    anything else. The different types of USB connectors are hard to describe if you
    haven''t already seen one. Take a look at Figure 1-3 for some examples.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_16_0.png)


    **Figure 1-3.** Different types of USB connectors


    The connector you''re interested in is the first one on the left, known as a micro
    USB. Be careful because on inspection, a micro USB plug can easily be mistaken
    for a mini USB plug (second on the left). The last thing you want to do is make
    a special trip to the store and come back only to find that you picked up the
    wrong one!


    # USB Power Adapter


    You might actually be able to get away with this. A normal USB port can power
    a Model A Pi (the one without built-in Ethernet), and for testing you can probably
    get away with doing the same with a Model B. That''s all well and good as long
    as you want to have your Pi sitting next to your PC, but chances are you want
    it to be somewhat independent. Even if you plan on using it in the same location,
    powering it from your laptop can prove to be'
