  md: 'INTRODUCTION


    # GPU


    The GPU is really a specialized form of a CPU. A CPU is generic in what it can
    do, and it tries to be good at everything it does, the classic jack-of-all-trades.
    A GPU, on the other hand, does one thing and one thing well. It is specifically
    designed to handle the intense mathematical needed to render complex displays.
    This started off predominantly in 3D graphics rendering, but has recently gained
    traction in day-to-day computing in rather than computing graphics, a GPU can
    be harnessed to execute similar types of instruction for the user. For example,
    when an application as Photoshop enhances a photograph, it applies an algorithm
    to the image and historically the CPU would do it. Today, Photoshop can offload
    that processing work to the GPU, which because of its very specialized design
    can do the work faster—without needing any assistance from the CPU itself.


    For the most part, the GPU is not something you will directly care about, but
    by knowing that the heavy graphics work can be offloaded somewhat from the main
    CPU, you can be more confident that the ARM powers the Pi will be able to deliver
    enough force for your needs.


    # Ethernet Port (Model B only)


    You might think there''s not really much to use an Ethernet port. After all, it''s
    pretty straightforward: plug it in and can access the network. If you don''t have
    one, then you can''t. Simple enough


    For me, the ability to connect to a wired network is essential. WiFi can often
    have issues and sometimes isn''t even available (especially if you decide to turn
    your Pi into a WiFi access point). Although this feature costs an additional $10,
    in my experience not having the network card when you really need it will cost
    more than $10 in, effort, and gone. It is true that you can use a USB network
    to the Model A (and technically the card attached to the Model B is actually connected
    via USB), but would cost at least $10 and then you''d have a USB device flapping
    in the wind. You might say "yourself" if it''s USB, I can use it with my other
    devices, but but in reality, you probably never will and you''re far more likely
    to lose the damned thing altogether (right when you need it most) than it is to
    rescue it in a moment of panic.


    However, one why you might decide on a Model A is that it doesn''t have those
    extra components, it consumes significantly less power. This probably won''t be
    a major concern for most users, but if you''re planning on using the Pi in a battery-powered-product,
    you would be very likely to lose the power reserves as much as possible.


    Overall, my recommendation is to get the Model B because you get the network card.
    If you''re absolutely 100% positive that you''ll never need Ethernet (or you want
    the smallest possible power footprint), there''s probably little paying the extra
    cash for this version.


    # USB


    This isn''t so much a feature days as a true requirement. All peripherals connect
    this way and the Pi is no exception. It will work with all standard USB keyboards
    and mice, and using Linux has a driver for it, other USB devices as well (such
    as the Ethernet card in the Model B).


    Both models use USB 2.0 support, although Model A has a single port, whereas Model
    B has two. If you want to be able to plug multiple USB devices to your Pi, want
    to consider Model B, but if you''re setting it up as a basic desktop, you could
    use an external usb to get a similar effect.


    # GPIO Ports


    General Purpose Input/Output (GPIO) ports are a very key addition to the Pi. They
    provide an easy way to connect to your Pi that you can control through software.
    For example, if you wanted to add a thermometer or light sensor, you could build
    a device that connects to your Pi via the GPIO ports.


    xxvii'
