  md: '# CHAPTER 8 | LAMP OF YOUR OWN


    Now the next part we need is the portion which we specify that the owner must
    be David. The syntax for this is a very simple WHERE owner = "David" giving us
    the final query:


    ```

    SELECT creator FROM todolist WHERE owner = "David";

    +----------------++

    | creator           |

    +----------------++

    | David             |

    +----------------++

    1 row in set (0.00 sec)

    ```


    Beautiful. I now know that I have only myself to blame for this mess. In the same
    vein, let''s try another. I want to know the description and priority of all tasks
    that are due after today (which, in this example, is the 20th of September). We
    start building our query. We want the description and importance fields of this
    time, so in they go out. We also need a date greater than 2012-09-20. Frankly,
    MySQL understands date so, so all we need to do is give it our date and the greater-than
    symbol, which is > This will give you the query:


    ```

    mysql> SELECT description, importance FROM todolist WHERE date > "2012-09-20";

    +----------------+----------+

    | description    | importance |

    +----------------+----------+

    | Finish LAMP Chap| HIGH     |

    | Finish GUI Chap | HIGH     |

    +----------------+----------+

    2 rows in set (0.01 sec)

    ```


    There is one last part of a SELECT query that will likely be relevant later. This
    is the ORDER statement that can be added to the end of a query. Take last one
    for instance; let''s say we want ordered by the order in which they were added
    (by idnumber). This will make our query into this:


    ```

    mysql> SELECT description, importance, idnumber FROM todolist WHERE date > "2012-09-20"
    ORDER BY idnumber;

    +----------------+----------+----------+

    | description    | importance | idnumber  |

    +----------------+----------+----------+

    | Finish LAMP Chap| HIGH     | 1        |

    | Finish GUI Chap | HIGH     | 2        |

    +----------------+----------+----------+

    2 rows in set (0.00 sec)

    ```


    And there it, sorted. Okay, so we can see that it is in ascending order and has
    been previously displayed as so. To reverse (or force) order, we can add an ASC
    or DESC to the end of the statement, so let''s try that with the same query as
    before and watch the change:


    ```

    mysql> SELECT description, importance, idnumber FROM todolist WHERE date > "2012-09-20"
    ORDER BY DESC;

    +----------------+----------+----------+

    | description    | importance | idnumber  |

    +----------------+----------+----------+

    | Finish GUI Chap | HIGH     | 2        |

    | Finish LAMP Chap| HIGH     | 1        |

    +----------------+----------+----------+

    2 rows in set (0.00 sec)

    ```


