  md: '# CHAPTER 2 SURVEYING THE LANDSCAPE


    Next to the CPU monitor is the clock, which doesn''t really need much in the way
    of explanation. The monitor with the padlock in the middle is used to lock your
    screen (although we have heard that this doesn''t work for everyone). It is very
    useful if you''re stepping away from your computer and have some friends around
    who think it might be funny if you made "amusing" posts on Facebook. By locking
    your screen, their efforts will be thwarted-challenging you to remember your password
    to something other than the default, of course!


    Last up is the power button that gives you numerous options for shutting down
    or rebooting your machine, shown in Figure 2-4 (if you started manually with startx,
    then you will only see logout and cancel).


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_46_0.png)


    **Figure 2-4.** Clicking the shut down button


    Clicking Shutdown will do pretty much what you expect, as will Reboot and Logout.
    There is one thing that is worth mentioning, though: the Pi runs Linux, which
    is a multiuser operating system. That means things might be happening in the background
    that you''re not aware of. For example, someone might be streaming a video from
    your Pi. If you shut down or reboot, you disconnect anyone who is connected to
    the Pi. This might not be an issue for right now, but it is something that you
    should probably be aware of.


    And that is pretty much it for what you have on your screen. We''ll cover the
    apps on your desktop after the next section, in which we will into the mysteries
    of the start menu.


    # The Start Menu


    The start menu concept has become almost ubiquitous across most operating systems
    (notably not the Mac) since its introduction with Windows 95. Although various
    people scoff at that and point to places where it might have been seen before
    or that the start menu in Linux are nothing like those found in Windows, we try
    to move beyond that. The fact is, the start menu concept works very well regardless
    who thought of it, and there is a reason it''s been adopted so far and wide.'
