    ```


    This is the first thing anyone wanting to write a program in BASH should know.
    This is called the shebang, and it is a special method when placed on the first
    line of any file means it is the path to the script interpreter we want to use.
    In case, we will be using the interpreter for BASH that is located in /bin/bash
    on your Pi and on just about every Linux and UNIX operating system. This will
    tell the outside command prompt what to do when it is running this program, it
    should use the /bin/bash interpreter to execute it. You should always include
    some form of shebang at the start of your given program for any interpreted language.'
