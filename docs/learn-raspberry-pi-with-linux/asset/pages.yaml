    the messages on the screen, which will help you understand what has gone.

    If all failed, go over your configuration file. Did you accidentally mis-set one
    of the variables? Did you forget to set the value in /etc/default/motion to yes?
    Is the motion daemon running, but can you see images appearing in your given output
    directory? If not, examine the file /var/log/messages, which is a repository of
