  md: '# CHAPTER 3


    # Getting Comfortable


    Normally we don’t start a chapter with a figure (and technically speaking we haven’t
    in this one, either), but we’re going for some good old-fashioned shock and awe.
    Take a look at Figure 3-1 (courtesy of Wikipedia).


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_65_0.png)


    **Figure 3-1.** TeleVideo 925 computer terminal


    You might be wondering why we thought it necessary to show you some technology
    from the early ‘80s (late 1982 in this particular case). In the old days, computers
    lacked all the niceties that we have today, such as colorful displays and mice.
    Back then, it was just text, often green on a black background. Mice were decades
    away, and the only way to communicate with a computer was either through text-based
    menus or the command line. Because the command line gave a great deal flexibility
    than a set menu, the command line was by far the most common interface and the
    one you’d be using if you accidentally stepped 40 years into the past. You’d sit
    at one of these terminals and tapping away endlessly into the night.'
