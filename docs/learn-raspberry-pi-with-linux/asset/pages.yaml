- img_proc: true
  md: '# GUIs AND TUIs


    GUI, which is short for graphical user interface, is used by all modern computer
    systems in some shape or another. It used to be really easy to see a GUI because
    it pretty any device that you use the mouse. The lines have blurred somewhat in
    recent years, to devices such as the iPad and Android smartphones, and now you
    have a GUI that uses your fingers. It is now much easier to know what a TUI is
    as generally anything that isn''t a TUI is considered a GUI.


    TUI, which is short for text-based user interface, is often used interchangeably
    with the command-line interface (CLI). A TUI can present basic menus, but those
    systems are navigated via keyboard control rather than a mouse.


    In short, if you drive it from the keyboard, and there''s no mouse pointer, it''s
    a TUI. If you can click, point at it with a finger, or see pretty pictures, it''s
    a GUI.


    # Modern Terminals


    There''s quite a bit of evolutionary history between the dumb terminals we just
    talked about and what we use on modern Linux systems today. Often you will find
    that you have a computer (for example, your Pi) and you''ll want to connect to
    it over the network. When you do this, you are running a client on your desktop
    machine and you are connecting to a server that''s running on the machine you
    want to connect to; in this case it is your Pi (which is acting as a server).
    Once connected, you are effectively "remote controlling" the Pi, so this type
    of connection is known as a remote terminal (a software version of the dumb terminals
    of the past). Remember that as far as Linux is concerned, whatever you type on
    your local client machine is as if you were typing on the Pi directly. This is
    just like a TV, on changing the channel, either on the TV itself or via the remote
    control, causes the same result.


    In the interests of preserving your sanity (not to mention crossing the boredom
    threshold), we''ll leap ahead to the modern day and show you what a remote terminal
    looks like on your Pi (see Figure 3-2).'
