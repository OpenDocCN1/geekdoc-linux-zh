  md: '# The Start Menu and Bottom Left of the Task Bar


    The first button on the bottom left (the one that looks like an alien spider—Figure
    2-2) is actually the LXDE logo and acts as the start. The second button (which
    is indistinct even on a high-quality monitor) will start up PCManFM, the LXDE
    file manager. This is the tool for you need to move files around or some general
    tidying up. The next button (globe) starts the default web browser that happens
    to be Midori in this case. Like the other apps, you''ll find that most of these
    applications are designed to be lightweight and efficient.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_45_0.png)


    Figure 2-2. Start button and friends


    So far, so good. None of these applications is really different from what you''re
    probably used to doing on your main computer. The next two, are a bit different:
    they control the environment rather than start individual programs. The first
    one (the overlapping windows) acts like a "minimize all" button when clicked:
    all the windows currently being displayed will be immediately minimized. Clicking
    the button again doesn''t restore the back. But if you have a lot of windows open,
    don''t expect to click this button again to get them back. This button has a second
    feature: if you click on the middle button (which can also be used as a button),
    all the windows will be "shadowed". When you shake a window, it moves with its
    title. We don''t really use this feature (in honesty, we have no need to point
    out to it each), but it''s something you might use.


    Next up are the desktop environments, unaware that you can actually have more
    than one desktop. This feature was added in recent versions of Windows, and Linux
    has had it from day one, mostly because UNIX-based operating systems had it for
    considerably longer.


    The feature is quite powerful in that it lets you have multiple desktops, each
    with its own applications. This allows you by default, LXDE provides two desktops,
    but you can have more if you want.


    The rest of this part of the bar is taken up with the applications you''ve opened.
    Like Windows, all running applications (at least those that provide a graphical
    interface) will show up here and you can use the bar to select which application
    you want to interact.


    # And on the Right Side...


    After the taskbar, there are more icons, as seen in Figure 2-3. The first one
    appears to be just a black box, but it actually acts as a CPU monitor. The more
    you give your PC, the greener this will become. You can amuse yourself (at least
    for a few) by rapidly moving your mouse pointer. The faster you move it, the more
    the CPU is, and the box becomes greener. Fun and games aside, though, this monitor
    is quite useful if your PC starts acting a bit sluggishly, a quick look at the
    monitor can tell you you are taxing your CPU.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_45_1.png)


    Figure 2-3. the right side of the task bar'
