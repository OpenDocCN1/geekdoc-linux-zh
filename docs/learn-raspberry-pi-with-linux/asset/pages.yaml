  md: '# CHAPTER 1 YOUR FIRST BITE OF RASPBERRY PI


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_20_0.png)


    Figure 1-6. A fully loaded Pi


    If you put everything together, plug in the power, and turn on your TV you should
    see... a completely black screen.


    # Don''t Panic!


    When your PC or laptop boots, there is a piece of software called the BIOS that
    kicks everything off for you. It tests the memory, sets up a basic-display, and
    allows all your devices to initialize. On some machines (notably from Apple) the
    machine will have an EFI instead of a BIOS. For all intents and purposes (at least
    from our point of view), they''re basically equivalent. Regardless of the technology
    used, it is this system that finally hands control over your bootloader, the piece
    of software responsible for starting your operating system.


    BIOS are by nature noisy, and if you get something wrong it will either bleep
    a lot (with some magic number code that you can only find in the BIOS that you
    threw in the bin 3 years ago) or display some helpful cryptic message on the screen.
    In short, it may not do what you want, but at least you know that your computer
    is still alive. Although it has a little red LED "on", the Pi won''t do unless
    it has a bootable operating system on its SD card. If you were expecting some
    sort of splash screen or other sign of life (hands up; we know that), you''re
    out of luck (and probably thinking you have a dead Pi).


    Now that you know what you need to restore the Pi to life (a bootable operating
    system) it''s time to move on to Phase 2 of our master plan and get us some Linux!


    # Linux


    As this is for beginners, we''re going to take the time to talk a little about
    Linux, where it came from, what''s special about it and some of the little gotchas
    that trip people up time to time. If you already knew this (or simply don''t care),
    feel free to skip to the next section "Downloading Raspian." For those who want
    a quick refresher, just keep on reading.'
