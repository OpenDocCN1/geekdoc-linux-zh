    # # REGULAR EXPRESSIONS


    Regular expressions in the right hands are like magic. They slice through complex
    text-processing tasks like a hot chainsaw through warm butter. They are frequently
    used to give system administrators bed-betting nightmares and to scare small children.
    Regular expressions are very powerful once you know how to use them, but does
    that power come with a cost? That as it may, a basic knowledge of regular expressions
    will be very useful to you, and you can use them in searching, replacing, and
    manipulating your text.


    We don''t have enough space to go into regular expressions here (referred to as
    regex), but there are fantastic resources available on the Internet to get started,
    not to mention books on the topic. A great starting place is Jan Gooyants'': www.regular-expressions.info/.
    This only is full of useful and helpful information (it is very first port of
    call) but Jan has also written some very powerful software. We bought RegexBuddy
    many years ago and it''s still our first port of call when we''re trying to debug
    some complicated regex. If you want a simpler tool for testing your regular expressions,
    check out http://rubular.com/, which does real time parsing in Ruby.


    # # Moving to a Specific Line Number


    The last thing we covered in nano was moving to a specific line number. This is
    actually much easier in vim, because it''s something that programmers have to
    do all the time. To jump to a specific line number, all you need to do is place
    the line number after the colon. For example to jump to the 5th line all you''d
    need to do is this:


