  md: 'available via the basic website on port 80. For example, if you go into the
    /var/www folder, you will see one file: index.html. If you examine this file,
    you will see some very familiar content:


    ```

    <html><body><h1>It works!</h1>

    <p>This is the default web page for this server.</p>

    <p>The web server software is running but no content has been added, yet.</p>

    </body></html>

    ```


    Yep, that is the website content that is used to generate the basic start page
    that Apache is currently showing. I try to think of this: the web server is providing
    you to access (and all subfolders and documents within it). As proof of this,
    by executing the following command as:


    ```

    $ echo "Hello World" > /var/www/foo

    ```


    +   - You can gain root by executing sudo su -


    Once you have successfully executed this command, direct your browser to http://<IP
    Address>/foo and you should see hello world displayed. There may be wondering
    why we didn''t use index.html in the first request to our website (i.e., use http://10.0.0.2/index.html).
    This is because files named "index" are special ones. They default display page
    if no other content is available.

    The next portions of config you should be aware of are the Directory sections.
    These are a list of directories that contain special rules as to how they are
    accessed and who can access them. In this instance, there are two directories
    that Apache has configuration for: / root directory and /var/www. While there
    are a number of interesting things you can do with the directory values, there
    isn''t much we need to do with them. For more information, you should head over
    to the Apache website and read through far more detailed documentation available.

    After the details comes ScriptAlias, which governs how CGI scripts are accessed
    and executed by the application. The ScriptAlias is a directory in which these
    CGI programs live and are executed. As PHP is a script system using a special
    interpreter like BASH (covered in Chapter 7), you might use mod_php instead of
    direct) which has a direct benefit, but it is not the. The directory value below
    the ScriptAlias is related to. The quick give you answer is that reference /usr/lib/cgi-bin/.
    This directory contains the +ExecCGI directive. This relates to how scripts and
    things as PHP are executed. Finally, the configuration files come close to a file
    with very useful config lines. These values are logfiles for the server; they
