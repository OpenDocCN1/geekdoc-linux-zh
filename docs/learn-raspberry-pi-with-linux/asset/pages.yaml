  md: '# What IS BASH?


    As covered in Chapter 3, BASH is short for Bourne Again Shell and the default
    shell environment for most Linux and UNIX environments. When you log into your
    system via the command line and are presented with your prompt, this prompt is
    provided to you by the BASH shell. The shell will take commands and instructions
    and process them to perform functions. Most of the commands you normally use when
    working with or administering your system via the command line are others that
    you can generate output.


    While this seems like a very obvious and simple way to go about things, it is
    also a fantastic way of demonstrating the core concept of how any application
    works. When you give an input, perform some kind of computation upon it, result
    (the output) is generated. This process is, in fact, the basic process of so many
    functions of life and what many people take for granted. It is this basic model
    of compute, output that will be the basic model of how we understand programming
    functions.


    So back to the first question: what is BASH? a shell is a method for taking input
    to compute output. Bash will allow you to use the same basic constructs of all
    programming languages. That means you can write a number of these logical operations
    and combine them to form a script. Now you have a rudimentary understanding of
    what BASH is, what a shell is, what the broad purpose of any computer program
    is, and how all functions are available to perform the basic action of input,
    compute, and output. Now that you have a very broad overview of what we want to
    achieve, we can use this knowledge as the starting block for learning how to write
    a program with BASH.


    # Starting in BASH


    So you know what BASH is and what a shell is and how the logic of any program
    works is considered by many to be head and shoulders above the pack. In fact,
    several interviewers commented that while their employers had rigorous questioning
    of potential software engineers who could all we we have covered, that many employees
    and graduates could not form the logic for a basic program on a piece of paper.
    When they want to prove their code snippet, a simple test that any software engineer
    should be able to solve quickly, this test is called the FizzBuzz test, is based
    on a children''s game of the same name. The basic logic for every number must
    count from 1 to 100 and say Fizz for every number that is a multiple of 3, you
    must say Buzz for every number that is a multiple of 3 and 5. It sounds simple,
    doesn''t it? After all, you are just building small blocks of logic and attaching
    them to other blocks of logic; making lots and lots of input, compute, and output
    nodes to form a larger system that has a much larger input, compute, and output.


    To end, we will write our solution to the FizzBuzz problem in BASH so that you
    can pass the basic software engineering test! That will be programming in BASH.
    The BASH interpreter provides commands that have the same function as common logic
    elements. These elements can be combined with normal shell commands to form whole
    programs. So, let''s start writing (we will use text editors in Chapter 6, so
    you can use any you like). All you need is to be able to edit a file and execute
    it on the command line afterward. Go ahead and open your favorite text editor
    and write the following:


    ```

