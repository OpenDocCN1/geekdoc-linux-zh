  md: 'The hash symbol is a sign (and a warning) that you are running with elevated
    privileges and that you should be very careful about what you type. The prompt
    also shows the username as root, which provides an added indication. However,
    these subtle hints are easy to miss (people don''t tend to study the prompt before
    command), so always check where and where you are before you press the Enter key.


    That''s really all there is to prompt. Most shells allow you to customize it to
    show different information, and occasionally change this. In our experience, most
    people don''t, and we rarely feel the need to change it itself. The reason why
    we''re bringing it up here is because if you do log in to another Linux machine,
    the prompt is wildly different, and the network works exactly the same way except
    the prompt has been customized.


    # Different Shells


    Maybe we oversimplified things when we said that all terminals work alike. In
    truth, there are some minor differences, especially in what they support, but
    more than you will not notice. In fact, what will likely catch you out is when
    the remote machine is using a different shell. A shell is program like any other
    rather than being a tool for browsing the web or reading e-mail, it provides a
    command line for interacting with the operating system. It operates a wrapper
    around the kernel that thats how it got its in name: by being the shell around
    the kernel just like a peanut.


    So, far we have been making use of the BASH or Bourne Again Shell. It is by the
    most popular shell in use today and it''s available on every Linux distribution.
    It''s usually the default, which is why you''ll never have to worry much which
    shell your system is running.


    The reason we''re bringing this up here is, because everything else in the open
    source world, opinions vary what makes the best shell. Take some bare-bones approach
    and only support the most basic features which shells like BASH come with included
    and have more features than you could take a stick at. Despite BASH'' popularity,
    it is conceivable that at some point in your illustrious Linux career, you might
    come across something else, and foreseen and foreseen.


    We''re not going to spend any more time looking at the different shells because
    honestly you''ll probably never need to worry about it. Even if a machine is using
    a different shell, you can start BASH to replace it (most systems have BASH, even
    if you get a different shell when you log in). Because system commands are the
    same regardless of which shell you use, even if you can''t get to BASH when you
    log in) you can do everything you normally do. In fact, most shells are interchangeable
    for the most part, and chances are even if you were using another shell, probably
    won''t even know it!


    # Summary


    This chapter introduced you to the terminal and its (not exactly fascinating)
    history. We discussed how the terminal is still used today and how it has been
    adapted to our modern needs. We looked at the three main ways that you can get
    to a terminal: on Pi, virtual, and over SSH. We gave a quick description of the
    command prompt and touched on some interesting commands to highlight a point (which
    we although promise will be explained when you turn the page), and we wrapped
    up the chapter by giving you a heads up about the different shells out there and
    how they (probably) won''t trip you up.


    Coming up in the next chapter is all you need to know to navigate around your
    Pi, create files, delete files, and more this. This is where we start to get really
    serious about the command line and where you''ll start picking up some real-hand
    skills.'
