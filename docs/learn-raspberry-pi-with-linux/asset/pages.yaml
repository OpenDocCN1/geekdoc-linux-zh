  md: '# xargs to With Result


    This is one of those pieces of magic that never get old; however we cannot pass
    a list of PIDs directly to kill because we want pass them one at a time. To do
    this, we need to take advantage of another command, xargs, which works the same
    way that the -exec does in find. It you treat each line of output from the commands
    before as an individual argument for another command. To use xargs, we simply
    have wrap the command in the same manner so does. If we wanted to pass each of
    PIDs to xargs via kill, we would simply run the following and that would be:


    ```

    $ ps -ef | grep ssh -v grep | awk ''{print $2}'' | xargs kill -1

    ```


    In this case, I will not be killing of my ssh process as I don''t want to reboot
    my Pi. But you should get the idea of how you can begin taking output from one
    command and passing it through another command to run executions on these commands.


    There are actually a number of other commands that can be really handy when doing
    these kinds of "shell". The first is wc, which is short for word. By default,
    wc will give you the newline, and byte counts for a given block of text or file,
    but it also has some arguments, as -l, which will give you the number of lines;
    -w, which will give you the number of characters; -m,


    Next is sort, which sorts each line of the output in order. You often see sort
    with uniq, which is short for unique. With these you can pipe an output to sort
    then to uniq, and you will have only the unique values in your output!


    The final thing to be aware of working with a number of commands is the output
    operator > This operator is from the same family as pipe, but instead of being
    used to direct command output to another command, it is used to direct your output
    to a file. This is a great way to save the output of commands to a file so you
    can revisit it later or to have it as arguments for another command. By now, you
    should be getting the impression that the shell is incredibly powerful and you
    can do all kinds of tricky manipulations by combining commands with pipe!


    # User Environment


    We are going to take a small break from examining commands and have a look at
