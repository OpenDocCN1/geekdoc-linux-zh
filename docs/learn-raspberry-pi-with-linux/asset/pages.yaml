    # Understanding the Problem


    The first step in any software design problem, no matter how small a job, is to
    understand what the needs of the software solution are. So let''s start by listing
    our goals:


    +   - Capture of a new image should trigger the solution

    - An e-mail should be sent with newly captured image(s)

    - Should function automatically without needing to be started manually


    Okay, that seems like the solution we need. But there are a few other things that
    having two main requirements brings into play. These extra requirements are:


    +   - Only new images should be sent

    - Only images captured by motion should be sent

    - The application should always be running and not need to be manually started,
    just like motion


    Okay, that seems a bit better; we are pretty firm on what exactly our software
    solution should do. But what how it should do it? Maybe we should be a little
    specific on how the application we are to write will achieve our goal.

    Some things we should consider when developing the application include these:


    +   - We should send them that the image was captured

    - We should check and send regularly, given that e-mail has a delay, a semiregular
    check should be enough


    Okay, now we''re cooking. Those are like some good requirements to remember when
    building our application. We were specific in what we want and how we should achieve
    it. Now that we know exactly what we want in our application, we can move on to
    the next step.


    # Making Decisions


    The next step after working out what we want to achieve is to make some decisions
    about how it should be achieved. So, first decision: how should we write this?
    Well, much of what we want to achieve here is manipulation of shell commands.
    We want to list image files and use those image files within another shell command
    to send us the e-mail alert. Additionally, you learned bash earlier in this book,
    so that makes it a perfect fit for what we want to develop.


