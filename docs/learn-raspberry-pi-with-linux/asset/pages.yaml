  md: '# INTRODUCTION


    # WAIT, IS IT $25 OR $35?


    Throughout the book we do upon the price of the Pi fair bit; after all, it is
    one of its most distinctive features. However, we also mention two, $25 and $35,
    so which is it? There are two versions of the Pi, the Model A and the Model B
    (as uninspiring as those names sound, they''re taken from the BBC computers, and
    from a geeky point of view, the names are quite inspired). There Isn''t a great
    deal of difference between the two models, with Model B 10/100 Ethernet built
    in and an inbuilt USB port. Model B also draws a bit more power. The Ethernet
    adapter is actually connected internally via USB, so there is no difference between
    the build in Ethernet and a USB device that you could plug into the USB port.


    So would you buy? If you think networking will be useful, the built-in Ethernet
    is pretty much required. Having built-in Ethernet connectivity because it makes
    life so much easier. However if you aren''t planning on using it, there is really
    no need to get Model B. For $10, it might be worth spending more just in case
    you decide to play with networking later on...


    # MORE PI!


    If Pi is good, two would be better. Right? Well, $50 would get you two Pis and
    while this doubles the cost, it also more than doubles the fun. You now can experiment
    with networking and getting the Pis to talk to each other. After all, it''s good
    to!


    # Experiment in Safety


    When my computer is out of commission for even a short period of time, it is pretty
    inconvenient. I certainly don'' want to fiddle about something and accidentally
    erase your hard disk (been, there done that). You''d also be well advised not
    to try over-clocking your CPU on the brand-new computer that you were just given
    is much fun to think you''ve totaled the machine within an hour of turning it
    on!


    To kill hardware takes a fair bit of effort (such as taping a pin on the CPU and
    removing the CPU speed multiplier lock), it''s fairly easy to remove your family
    photo album and the last draft of the book you''ve been working on the past six
    months (there is a reason why we dedicated a whole chapter and pleads in the book
    to backups). If you have a Pi and you know, the worst case is $25 down the drain,
    which is a lot better than what would happen if you have toasted your machine.


    # Independence


    I''n sure some people will point out (quite correctly) that most of the horrors
    I just described could be avoided if you play in a VR rather than your main machine.
    Apart from not being much fun (real hardware just small better), it doesn''t give
    you all the benefits of a separate piece of kit. For start, a virtual machine
    is only when your main machine is running. If you have to a laptop that follows
    you everywhere, a virtual machine won''t be a great option for a home web server.
    Also, if you reboot your main machine, your virtual machine will go down with
    it. If you were using it to stream movies to your TV, you could end up with very
    disappointed family members. By having a real piece of hardware, you can keep
    your experimentation completely separate from anything else that might be doing.'
