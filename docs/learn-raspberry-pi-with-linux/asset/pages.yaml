  md: '# CHAPTER 11


    # Pi Media Center


    The beautiful things about a Raspberry Pi are that it is so flexible a device
    and its potential uses are nearly limitless. You can do just about anything with
    Pi, and it has an array of peripheral input ports that can be used to great effect.

    You should also be aware that while your Pi can display through a standard HDMI,
    the power of the device doesn''t end there. It can display at a full 1920 x 1080
    resolution, commonly called 1080P, which is the benchmark level for high definition.
    Your tiny Raspberry Pi is capable of displaying at full high-definition resolution,
    and thanks to the sound outlet of HDMI it can also play audio on the same channel
    as video. The goal of this chapter; we are going to take advantage of the Pi''s
    media playback capabilities to create two different varieties of Pi media center.
    One is a video playback center that you can use to play videos over your network.
    It can sit attached to your TV and allow you to tap into the Internet for video.
    The second is a wireless playback device that enables you to stream your music
    collection and play back across network.


    # Video with XBMC


    As mentioned earlier, one big advantage of Raspberry Pi is that it can play back
    in high definition, but we need a way to take advantage of this, where XBMC comes
    in.

    XBMC (which is short for Xbox Media Center) was originally designed as a media
    center for the original (Fat) Xbox. People who liked the project so much it has
    subsequently been ported to every operating system under the sun, including not
    limited to Windows, OS, X, and iOS. There is even a full-blown, stand-alone version
    called XBChuntu which is a port of Ubuntu that has XBMC installed, and ready to
    go out of the box. Given its use, open source, and easy-to-work with nature, it
    has been produced and for times with its progeny, including MediaPortal, Plex,
    Vodiom, and Boxe. This goes to show how popular media center systems are; as a
    example, Boxe makes a small device the Boxe that costs up of $2000. What we are
    creating is a tool that is both powerful and only costs $35—the price of the Pi.
    So now that you''re all excited about the bright and shiny media center, it''s
    time to take advantage of it.

    You have reached the end of this chapter, but before you go, we have one big thing
    and do a proper install Linux from the application source. While most applications
    are prepackaged with apt-get, there are some that do not need to be compiled.
    Installing XBMC from source is a somewhat involved process and is very time-consuming.
    We have chosen to compile from source because not only does it help you through
    one of the more complex ways of getting an application running in Linux but also
    that our installation of XBMC is optimized for our system because we have built
    it on our own system. Historically, compiling from source was considered to be
    an arduous process, but as the number of people using Linux has grown so has the
    need for simple-to-use installation tools and the rise of precompiled binary installation
    systems such as apt-get have grown. But with everything, there are still times
    when using a rebuild is never as good as doing it from scratch, and as time goes
    on, tools for compilation have grown and become much more approachable. It is
    also easier to do when someone steps you through the process—which is what this
    book is all about.


    223'
