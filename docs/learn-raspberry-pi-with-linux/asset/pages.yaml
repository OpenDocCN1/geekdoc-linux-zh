    # Creating Your Own Init Script


    We have covered how init scripts are created; now we can create one. The process
    is relatively simple because we simply need to re-create the structure and input
    our code in the correct place to perform the functions we need. You can have these
    init scripts do whatever you want, but for this example I will be creating a file
    with the touch command and deleting it with rm when done. The touch command is
    simply to create a file on disk with nothing; if it runs on an existing file,
    it will change the last modified time of the file. As mentioned earlier, you can
    have your programs managed by start-stop-daemon or you can simply perform system
    functions, as I will do in my example.


    As you will recall, the first thing we need in this script is the shebang, which
    is the starting point for all BASH scripts and this is the best place to start.


    ```

    #! /bin/bash

    ```


    Now that we have our shebang, recall the XBMC start script we worked with earlier:
    the first thing in that script is the opening block that gives us details about
    which init level will run this script, and so on. So let''s add that next. You
    should fill in all your own details here. My script will be called touchfile.sh
    and will provide the Touch File service. My opening block of script will look
    like this:


    ```

    ### BEGIN INIT INFO

    # Provides:      touchfile

    # Required-Start: $all

    # Required-Stop:  $all

    # Default-Start:   2 3 4 5

    # Default-Stop:    0 1 6

    # Short-Description: Run TouchFile

    # Description: RunFile

    ### END INIT INFO

    ```


    Now that I have defined the comment block, I can define my variables. They will
    be the variables that will cover my application does. Anything you have thinking
    of needing in order to start that can be configured should be defined as a variable.
    In case of my touchfile command the thing I need to have defined as a variable
    is the filename of my touchfile. Remember that this is your code, and you can
    define literally whatever you desire as a variable. My variable is this:


    ```

    TOUCHFILE="/var/tmp/touch.file"

    ```'
