  md: '# CHAPTER 8 | LAMP OF YOUR OWN


    # Website Data Insertion


    This HTML is now working in concert with the PHP to generate a full page of content.
    The static HTML provides a framework and then we have two pieces of PHP: one to
    establish a connection and second to pull the results of the to-do list and add
    them to the page. Now that we have the basic displaying, we need to add a form
    to give ourselves a form to submit new content. This basic form should have an
    input stream for each of the elements we will insert into the table. We will also
    need one special element, a hidden one that we will use to a variable called "action"
    and as we need. The final element we will need is a submission one which allows
    us to push the data to the server to be processed. In addition to all these elements,
    we need to give the form an action and method which says how to invoke CGI on
    our server and what method it should use. When this block is put together it looks
    like:


    ```

    <form action="index.php" method="POST">

    <input type="hidden" name="action" value="insert" />

    Description: <input name="description" /><br/>

    Owner: <input name="owner" /><br/>

    Date: <input name="date" /><br/>

    Location: <input name="location" /><br/>

    Importance: <input name="importance" /><br/>

    Creator: <input name="creator" /><br/>

    <input type="submit" />

    </form>

    <body>

    </html>

    ```


    This code block can then be added above the table and separated with an <hr />
    tag, which means that we will have a table of display content and a section below
    it that will give you the ability to add new content. When put together and inserted
    into the web server, the content that it generates will look like Figure 8-4.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_184_0.png)


    Figure 8-4. To-do list app with insert table


