  md: '# CHAPTER 5 ESSENTIAL COMMANDS


    This is the point where the PIDs of the ps command come into play. PID numbers
    are the ones that you will feed to kill in order to direct the signals from kill1.


    # Reading Information in /proc


    Since we are playing with PIDs, it''s probably good to revisit the /proc filesystem,
    first discussed in Chapter 4. This is part of the OS in which all process information
    lives. If you use ls /proc, you will see a number of files and a set of numbered
    directories. These directories correspond to each of the process PIDs. If you
    look within one of these directories, you should see a whole host of files that
    relate to a process. While you should never edit any of these files-


    The most commonly used is a system-wide file that contains information on all
    the system''s processors. This is the /proc/cpuinfo file. You can output the contents
    of a file to the screen using the cat command, which is short for concatenate
    and is normally to get the contents of a file into a buffer (in our case, it is
    the console screen). Go ahead and use this:


    ```

    $ /proc/cpuinfo

    ```


    Your output should look like this:


    Processor : ARMV6-compatible processor rev 7 (v61)

    BMIPS : 697.95

    Features : swp halt fastmult vdp esp java tls

    CPU implementer : 0x41

    CPU architecture : 7

    CPU variant : 0x0

    CPU part : 0xb7

    CPU revision : 7


    Hardware : BCM2708

    Revision : 0003

    Serial : 00000007a8a46b6


    This is the Linux information on the Raspberry Pi’s. If you are ever in doubt
    on the particulars of this process, this is the place to look.

    In addition to /cpuinfo, there is another file /proc that you can take advantage
    of when diagnosing system configuration information. It is the /proc/cpid/cmdline
    file. This file lists the command-line argument used to invoke a process. If you
    need to get your hands on the process using executing, cat catch against this
    file is the best way to do it.


    # File Commands


    As mentioned earlier, you can use the cat command to output the contents of a
    file. There are a number of other tools you can use to work with the contents
    of files within your system. The first is one that mentioned earlier: the less
    command. It is a command to display the contents of a file to the screen in a
    way that can be moved around and searched as it were a text editor. This is a
    great command for working with logfiles or the output of long commands such as
    ps. less allows you to move up and down with the arrow keys or to go with page
    and page down. You can also search for simple words by searching by / and then
    entering your search. less will then highlight the found instances of your expressions,
    and you can tab between them with the key to go down and the key to go up.

    In addition to being able to search within a file for things, less has the ability
    to watch the file and constantly display new content on the last line. This is
    great for watching growing logfiles as you can pick up new lines'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# CHAPTER 5 ESSENTIAL COMMANDS


    without needing to reopen the file, to get less to perform this function, press
    the F key. With this you can automatically navigate to the end of a file by pressing
    the G key. This process will also grab any new lines that have been added to the
    file and display them. You can also use the lowercase g to navigate to a specific
    number, if you wish to go to the first line, press ig. Finally, less is able to
    respond to all command-line arguments within itself. This is useful for enabling
    lines as you can simply give the command \<center> and display numbers next to
    it.


    After less, one of the commands provides a starting amount of flexibility is the
    find command, which is used to find files by examining every file within the directory
    and all of its subdirectories. find is useful on its own, extraordinary when paired
    with other commands as you will see. It also has a catch of options that are changeable
    and can be combined. I will cover a few that I have found incredibly useful here:


    +   - The first is -L, which follows symlinks, which find does not by default.

    - Second is -maxdepth <number>, which represents how many directories deep this
    command will search. Use just one? or all its subdirectories?

    - Third is -newfile <file>, which shows what was changed more recently than a
    file.

    - Fourth is -empty and as its name implies, finds empty files.

    - Fifth is -atime <number>, where the number represents the number of days that
    have passed since a file was accessed.

    - Sixth is -name <filename>, which searches for files named exactly like the name
    passed in.

    - Last is exec <command>, which tells find to execute a command on each of the
    files and execute commands on them. You can use this find to find specified files
    and execute commands on them. By way, using find is a fantastic way of exchanging
    a cleanup of unwanted files for instance. I also advise when using find in this
    matter you should test and test thoroughly because one incorrect key could spell
    doom for your system or your data.


    Combining these commands, you can achieve something that looks like this:


    ```

    $ /mnt/Volume1 -empty name foobar exec rm

    ```


    This command will find all files within /mnt/Volume1 that are empty and named
    foobar and remove them! There is so much power in the find command when administering
    Pi. Another command that has a significant limit is the use command to go through
    the contents of a file and determine what "kind" of file it. It is a bit of loose
    term here because file knows only a moderate number of file types. It is much
    useful when you want to know an answer to this question: "Can I open that file
    in a text editor, or is it a binary application?" This command can save you heartache.
    You can also use file to determine which archival format an application is written
    in, which is a great help when you need to extract from an archive but don''t
    know kind! As an example, if you run a binary executable such as /bin/bash, you
    should see the following:


    ```

    $ file /bin/bash

    /bin/bash ELF 32-bit LSB executable, ARM, version 1 (SYSV), dynamically linked
    (used shared libs), for GNU/Linux 2.6.26, BuildID[1]=0exe370aobe978f4569f11c9f41bc54688b9fe32,
    stripped

    ```


    The code shows that it is ELF 32-bit LSB executable for an ARM system, so the
    file should be compatible with Pi. This is a good way to diagnose any issues you
    may have with applications downloaded from the Internet because they may be compiled
    for x86!


    101'
