  md: 'The next step is to pull the variable out, and the best way to do this is with
    a combination of two commands: one grep, which will find any information in a
    file that contains a particular pattern, in this case any line that contains the
    line_dir, but we also need to add comments, so we need to grab lines that start
    with target_dir. This is achieved by adding an extra symbol to grep that knows
    we are looking for a value that starts with our desired value. This gives us a
    command of grep "^target_dir" $MOTONCONF. If you execute this command you will
    see the following:


    ```

    root@raspberry ~ grep "^target_dir" $MOTONCONF

    target_dir~/tmp/motion

    ```


    Now the next problem with our command reads its head: we need to get rid of the
    target_dir portion so we have the location where we are. To remove the first part,
    we need to use the awk command, which will split the dir at whitespace values
    by default. This is perfect and then we just need to print the second value that
    results. Building on this to our command, we get:


    ```

    root@raspberry ~ grep "^target_dir" $MOTONCONF | awk ''{ print $2}''

    tmp/motion

    ```


    Now that''s all left to push the result into a variable, which is accomplished
    with the back-tick symbol, giving us a final result of this:


    ```

    MOTIONDIR="^target_dir" $MOTONCONF | awk ''{ print $2}''

    ```


    Now, one that you may not have considered: if this directory is not created, motion
    will create when it captures its image, but can take hours. We need now, so let''s
    go ahead and do a check to see whether it exists and if not, create. The check
    to see whether a directory exists is if [-d <directory name>]. We also need to
    add a note to see if the directory doesn''t exist, so go ahead and add an exception
    point before the -d, which means not. Finally, mix this with a mkdir command and
    you should have the following if statement:


    ```

    if [ ! -d $MOTONDIR ]; then

    mkdir $MOTONDIR

