  md: 'That is few devices. We can quickly eliminate a few right off the bat: all
    the tty devices, all the ram devices because they are the Pi''s RAM, the loop
    devices because they are loop backers, all the memblock devices they relate to
    the SD card, and all the video devices because they are virtual consoles. There
    are still a few, but the best looking is video0. For a webcam, it registered as
    a video device didn''t it? Okay, so we think that''s right—but how can we tell?
    udev, more specifically the udev administration function, the device manager for
    the Linux kernel. It knows and where devices register themselves so that they
    can be accessed by the OS by applications. In Debian (and Raspberry), the inner
    workings of udev can be accessed with the udev command, so let''s go ahead and
    use it the following:


    ```

    $ udev info -q -a -n /dev/video0

