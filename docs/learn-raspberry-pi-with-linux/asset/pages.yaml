- img_proc: true
  md: 'ps is a lot like top, but does require fewer resources and has a few advantages
    that we will cover later in this chapter. For now, you should just be aware of
    each of the columns in ps means:


    +   * UID: Represents the user who owns this process

    * PID: Represents the process''s PID number

    * PPID: Represents the PID number of the process that created it

    * C: Represents CPU utilization of this process

    * STIME: Represents the start time of this process

    * TTY: Represents the terminal controlling this process

    * TIME: The cumulative CPU time consumed by this process

    * CMD: The command-line argument of this process


    So you might say, "Well you. You have shown all the processes in the system, but
    what can I do with them now?" This is where the magic of ps comes; it makes very
    easy for us to pick out the PID of a particular process. The PID number is very
    important as it is a unique number for each process and is the system references
    processes. This will come of use in our next command: kill.


    # # Killing Process


    kill is used to do exactly what its name implies: kill processes. But it also
    provides a number of useful functions via the mechanism through which it processes.
    In Linux and UNIX, a signal is a low-level system message that is passed into
    an application from the operating system, having no actual function beyond a signal,
    and it is up to the application to respond it in the correct manner. This is not
    true for all signals, as some cannot be handled within the application, but it
    is true for most. The function of the kill command is to send signals to applications.
    There are 64 signals that the version of kill on Raspbian send to an application.
    To list them all, issue this command:


    ```

    $ kill -l

    ```


    I won''t list all the functions of the signals now, but you will need to be aware
    of these, the most common signals:


    +   * Signal 1 (SIGHUP): For short-hangup. Tells the application to hang its current
    connection. Normally used to make an application reinstall itself.

    * Signal 3 (SIGQUIT): Signals that this application should gracefully close itself
    down and quit.

    * Signal 6 (SIGABRT): Signals that the program is aborting; it is to close immediately.

    * Signal 9 (SIGKILL): Signals to forcibly "pull the plug" on an application.


    These signals are the most common as they are used to perform application shutdowns,
    with nine being the prevalent. The format of the kill command is:


    So to kill a process with the highest force, execute this:


    ```

    $ kill -9 <PID>

    ```'
