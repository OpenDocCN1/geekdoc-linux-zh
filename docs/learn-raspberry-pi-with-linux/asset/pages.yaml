    # Add an Inverse grep


    Ah! There''s a problem! We seemed to have caught our grep in the command. But
    that''s no problem we can simply pipe grep into grep and do -v for grep, which
    will return every line without grep. This gives us the command:


    ```

    $ ps -ef | grep ssh | grep -v grep

    ```


    This gives an output of this:


    ```

    root 1722 1 19:24 ? 00:00:00 /usr/sbin/sshd

    root 1956 1722 0 19:43 ? 00:00:00 sshd: pi [priv]

    pi 1963 1956 0 19:43 ? 00:00:01 sshd: pi@pts/0

    ```


    # Cut Down the Results


    Much better! Now you can begin to see what we can accomplish with pipe, but I
    am far from done with the things you can! Let''s introduce the next command: awk
    awk is a tool for doing data extraction from a line of text. In this way, you
    can pull all information out of whatever commands you are running. By default,
    awk will pull each element by splitting on whitespace, which is any tab or space
    between characters. You can set the character to split using the -F <delimiter>.
    Once you have awk know how to brew your text, you will need to output it. awk
    has an entire syntax for augmenting commands, and it is an incredibly complex
    art form.


    However, for most of your needs, simply printing the correct field will do enough.
    All awk outputs are wrapped in curly braces { } , and you will normally need to
    wrap them in single quotes so the command line will ignore any spaces. This means
    the basic syntax looks like this:


    ```

    $ awk ''{command}'' ''

    ```


    The most useful command for working with awk is the print command because it is
    used to display the displayed variables. Each of variables is treated as the number
    it is in the sequence, so $1 for the first, $2 for the second, and so on. Using
    this can combine the awk with our ps -ef from earlier to get the second space
    field, the PID? This gives us the following:


    ```

    $ ps -ef | grep ssh | grep -v grep | awk ''{print $2}''

    ```


    Wow, these commands are getting long! Examine the output of this:


    ```

    1722

    1956

    1963

    ```


    Aha! The quick among what you realize is matching we! We can pipe this kill! In
    this fashion, we can use a ps, grep, and awk to grab only the PIDs of processes
    matching a pattern and then pass them off to be killed!'
