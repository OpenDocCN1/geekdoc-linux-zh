    # Copy and paste Vim


    Copy and paste in a terminal is something of an iffy proposition. The reason is
    that an application running in the terminal effectively lives in its own world.
    If you copy text from the terminal on your laptop, for example, text copied into
    your laptop''s clipboard. The remote application (in this case, vim) has no idea
    that you did. Likewise, if you try to copy in from terminal, vim will simply receive
    it as a set of key strokes, which''t have a clue that it came from a clipboard.
    speaking, it is okay. If you want to move a bit of text about, using the clipboard
    in this way is probably fine.


    There are times when this doesn''t work for you. For example, if you have a split
    screen and you have two files by side and you want to select the first paragraph
    on the left, you''re now a bit stuck. The terminal will show you a representation
    of what''s on the server; it is a display and such that the terminal has no understanding
    of what''s displaying. If you are displaying, you''ll find the right side comes
    along for the ride. That''s far from ideal (not to mention highly irritating).


    You might want to do something with the text you copy. If you just want to paste
    once, no big, but what if you want to paste exactly 10,004 times? Vim can''t help
    you because it has no concept of your local clipboard. You''ll find when these
    issues drop up, they''ll fairly niche and you can work around them. However it
    is likely to really irritate you when you think "if I could just copy this! while
    you are trying to work around the problem.


    What we need is a remote clipboard—for the remote application to store data for
    processing. There''s no standard for this, but many terminal-based applications
    have a solution; for it, it''s yank and paste. To copy content, you need to use
    the y, which takes the modifiers that the d command uses and you can quickly copy
    an entire line with yy (remember the letters just double up) and a single word
    with wy. Also like the clipboard command, we can use this with visual mode.


    First, highlight the text you want to copy. Simply, let''s go for the top two
    lines. Once you''ve highlighted with the V key, press the y to yank it into the
    clipboard. Phase one is complete; all you need is to paste it back into your file.
    There are two ways you can use the paste command: with either P or p. As with
    V and v commands, uppercase and lowercase are usually related in some way. In
    this case, the P key inserts content before the current line, whereas the p key
    inserts it after. Feel free to move your cursor to any location in the file before
    hitting one of those. The effect is really what you''d want, and vim will just
    paste content in. You, can, combine these commands with the numeric prefixes to
    repeat the number of times something is inserted. 6-25 shows what happens if you
    end 40p.


