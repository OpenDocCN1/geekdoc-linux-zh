    # # Compiling Source Code


    Most compilations use a very simple logic: you run the command ./configure to
    generate a configuration file

    that knows about the makeup of your system. This generates a file called a Makefile.
    This file is in a slightly

    specialized language that describes the way in which a compile for a collection
    should be performed. It is not a script

    that executes in code and itself; it is a collection of directions that will be
    used by the make application.

    Unfortunately, this compile is slightly more advanced. We need to make our configuration
    tools to match the

    setup we are trying to do before we run the configuration and compile. This will
    take a little to execute, and

    kick off and go have another cuppa.

    The command to execute is:


    ```

    $ make -C tools/rbp/depends/xbmc/

