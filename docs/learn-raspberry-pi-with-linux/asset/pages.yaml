- img_proc: true
  md: 'The last file command I have for you is one of commands that many people hate
    and many more love: grep. grep is short for Generalized Regular Expression Parser
    and is best known as a pattern matcher. Like less and, grep is both useful on
    its own and when combined with other commands. You can use grep to search a given
    file for any lines that contain a given text string. The basic format of grep
    is:


    ```

    grep <pattern> <file>

    ```


    These values will take the wildcard format, so you can use grep to search through
    every file in an entire directory for a string. As an example, look for the word
    find in the /etc/.init.d folder.


    ```

    $ grep /etc/.init.d/*

    ```


    The output would be:


    ```

    /etc/init.d/checkfs.sh# Include /usr/bin in path to find on_ac_power if /usr/
    is the root

    /etc/init.d/cdroot.sh# Include /usr/bin in path to find on_ac_power if /usr/ is
    the root

    | LIST_COMMANDS=cd /etc/init; find -name "tty*.conf" -printf ''%f

    | sed -e ''s/[^0-9]//g''

    /etc/init.d/kbd

    # eventually find an associated SFM

    /etc/init.d/nfs-common#: particularly heavy daemon, so we auto-enable if we find
    an

    /etc/init.d/exports

    /etc/init.d/rc# Now find out what the current and what the previous runlevel are.

    /etc/init.d/sudo# find /var/lib/sudo -exec -t 198501010000 ''{'' }

    ```


    grep also has some powerful options, including -i, which makes the search case
    insensitive. grep also has the -v option which turns a search on its head and
    returns everything not matching the search string! This will give you an idea
    of how powerful a tool grep can be when you wish to find a piece of information
    and why it is an awesome for a systems administrator''s arsenal of commands.


    # Combining Commands


    It''s yet so Let''s say we wanted to grep some things, but wanted the output in
    a more manageable way. We would simply write grep, add a pipe, and then add a
    list. By doing this you will find yourself inside looking at the output of your
    grep! This is when you want to search the filenames in a given directory? Use
    ls to list the files and pipe the output to grep to search. In this instance,
    you don''t even need to include a filename with grep as the pipe will provide
    grep with what is known as a buffer which will treat the same as file contents!
    So what is the command:


    ```

    $ ls <directory> | grep <search string>

    ```


    # Combine ps and grep


    Now if you want to play more with things, you can combine grep with ps -ef! In
    this way, you can search for a specific application; for example, to search for
    the SSH application sshd,we would run this:


    ```

    $ ps -ef | grep sshd

    ```'
