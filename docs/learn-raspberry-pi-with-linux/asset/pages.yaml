  md: '# Magic Spells for the Command Line (aka Scripting)


    A script is a collection of shell commands in a text file that Bash (or a shell
    of your choice) will execute. Even in this simple form, they are very powerful,
    but you can do so much. You can automate a lot of tasks with relatively little
    effort, and you can build some pretty impressive tools, too. This chapter won''t
    make you an expert, but it will certainly give you a taste for the power at your
    fingertips. You might laugh at calling them magic, but wait until you turn a tedious
    3-hour task into a single command that completes in 4 seconds!


    # Pi Server


    We start the project with a classic: getting a full LAMP (that is Linux, Apache,
    MySQL and PHP) stack up and running on your Pi. We will show you how Pi is an
    ideal web server and how it provides the perfect environment for development dynamic
    websites makes a great little portable website demonstration tool!


    # WiPi: Making Your Pi Wireless


    What''s more fun than a tiny network server? A tiny little network server has
    no wires! We''ll show you how to hook up a USB wireless adapter so your Pi can
    talk to the world without any. If that isn''t enough, we take one step further
    and look at ways of connecting the cords and getting your Pi to run off a battery.


    # The Raspberry sPi: Security Cam and Messaging Service


    Want to know who is sneaking into your room and stealing all your pens? Your sPi
    has you (or your office) totally covered! In this chapter, we will show you how
    to hook up a webcam to your Pi and have it snapshots of movement in the room.
    Not only that; it will promptly e-mail you a copy of the intruder in real time!
    Even James Bond doesn''t have one of these.


    # MC-Pi: A Pi for All Your Media Needs


    Last, by no means least, we show you how to turn your Pi into your personal media
    center. We show you how to stream video to your TV and how to act as an audio
    device for sharing music around the house. With high-resolution streaming video,
    we are ready to push the Pi and show what it is truly capable of


    # Onward


    We''ve covered a huge amount already. We''ve looked at how computing has changed
    over the years and how it has not only had an impact on how we see and use computers
    in our daily lives but also it has affected the ways computers are perceived in
    and the level and depth of knowledge that students are taught. We briefly touched
    on the Raspberry Pi Foundation and it hopes that the Pi will start to reverse
    this trend.


    Next we looked at some of the most compelling reasons why you might want to get
    a Pi and why the Pi makes an ideal platform for development and experimentation.


    We then looked at what the Raspberry Pi is at the hardware level and discussed
    the differences between your main computer and the Pi. We examined the trade-offs
    and looked at why some of the decisions we made and what impact they have on how
    you use a user.


    Last but by no means least, we''ve rounded off the introduction with a whirlwind
    tour of all the things that we''re going to cover in the rest of this book.


    So let''s head to the kitchen and make some Pi!'
