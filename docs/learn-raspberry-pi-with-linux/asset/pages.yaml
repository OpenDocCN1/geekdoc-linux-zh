  md: '# CHAPTER 5 | ESSENTIAL COMMANDS


    It contains 3 values that give the average of the current minute, the last 5 minutes
    and the last 15 minutes. Load average represents the average of actual computation
    usage and demand for your system''s resources.

    Perhaps the best way to think of load average I have heard is a freeway. Normally
    the value of CPU usage represents how much of the available computation resources
    are being used. This is akin to measuring how much traffic is currently on the
    freeway. The load average compares how much computation is being used and how
    much demand is for CPU usage. This is like examining both the freeway and its
    onramps, meaning that the difference between the two when looking at it from the
    perspective of a "busy lunchtime", meaning that there are lots of cars on the
    freeway, but just because "it''s a busy lunchtime", everyone can get onto the
    freeway and use it, nobody is stuck on the ramp, and traffic is flowing nicely.

    This is why load average is such a powerful metric; it allows you to see demand
    for your system''s computing in real time that you can see when your system begins
    to spin and thus take action to lower demand.

    Wow, that''s a lot on just one line!


    # Tasks


    The second line of your output lists the tasks that the system is currently performing:


    +   - The total number of processes

    * The number of actively running processes

    * The number of processes that are sleeping in the background

    * The number of stopped processes

    * The number of zombie processes


    Most of these processes are general for being aware of what is going on within
    your system. But zombie processes can be a real problem. These processes have
    finished executing, but are still resident in system memory—often they need to
    send a return value to the process that spawned them, but are yet to do so and
    must wait until the living dead before they can send their final message and report
    to the caller.

    Having a long zombie process can indicate a problem with the application that
    is used to spawn it, which is called its parent. If you see zombie processes on
    your system have a look to see which process spawned them and check over its running
    status and log files (log files are output from applications that are written
    to disk, so you as the systems administrator can see what they are doing), as
    this may be indicative of a larger issue.


    # CPU Utilization Percentage


    The third line of the command is the CPU utilization percentage value. This shows
    in terms of percentage how much of your current computation resource is allocated
    to which domain of your system. The values are:


    +   - us (for user applications)

    * sy (for system applications)

    * n1 (for processes that have been "nice" in order to give them or less CPU priority)

    * 1d (for representing idle)

    * wa (for processes that are waiting for I/O completion)

    * h1 (for processes waiting for hardware interrupts)

    * s1 (for processes waiting for software interrupts)

    * st (which indicates time stolen by a hypervisor—a hypervisor is software that
    runs a virtualization platform like Xen or VMware ESX)


    93'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# CHAPTER 5 ESSENTIAL COMMANDS


    Of these values, the one that will normally have the most computation resource
    allocated to it is id, which represents free computation that can be used elsewhere.
    Seeing high values of wa, hi, si or st are not good signs as they suggest your
    system is waiting on a particular piece of hardware or another function to finish
    processing. If these stay high, you should look at investigating processes which
    cause them and see if you have any hardware issues.


    # Memory Usage


    Lines 4 and 5 represent the memory usage of your system. Line 4 is for the actual
    usage, and line 5 is for the swap space usage. Both of these lines will show the
    total, used, and free memory in their given space. This final value represents
    the buffers and cached value. These two are interrelated and are the cause of
    concern for new users to Linux. This has to do with the way that RAM is allocated.
    Linux can take up all available RAM and place it into a buffers, which means it
    is taken by the buffers but can still be used for your applications. Linux will
    treat this RAM as being used, but it is just sitting in the buffers waiting. The
    buffers value can be a little hard to understand; this leads to another command
    showing how these resources are used (I will cover it next).


    # Process Table


    After the fish line there is a large section that contains a process table, which
    lists all running processes, and in near-real-time updates, which are consuming
    how much of which resource. The following shows different columns and the pieces
    of information they represent:


    +   - PID: The processes'' ID number

    - USER: The user who owns the process

    - PR: The priority of the process

    - NI: The nice value for the process

    - VIRT: The amount of virtual memory consumed by the process

    - RES: The size of actual virtual memory

    - SHR: The amount of shared memory the process is using

    - S: The process status (e.g., sleeping, running, zombie)

    - %CPU: The percentage of CPU consumed

    - %MEM: The percentage of RAM consumed

    - TIME: The total CPU time the task has used since it started

    - COMMAND: The actual name of the command


    top also has a host of keykeypress actions that can manipulate the order in which
    these processes are displayed; you can check them out in the man page for top.

    top is a fantastic command for showing all the ins and outs of your system''s
    resource usage and one of the best tools for diving into the exact nature of what
    your system is doing within itself.'
  merge: -1
