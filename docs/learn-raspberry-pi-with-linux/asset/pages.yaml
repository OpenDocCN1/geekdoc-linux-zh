    - Location

    - Importance

    - Who set the task (creator)


    Okay, so with this information, we have our rough table structure; now let''s
    go ahead and create it. The syntax for a table creation is:


    ```

    create table <table>(

    <column name> <column type>,

    <column name> <column type>,


    <column name> <column type>

    );

    ```


    That''s the basic syntax, but there need to ensure we are getting the right value
    back each time, we need to have something unique about each individual piece of
    data. Many of these tasks will look almost identical, excluding one or two variations.
    For this reason, we will need what is called a primary key, which is a unique
    identifier for each row. In this case, it''s best to use a simple count that will
    automatically go up for each row we add. Now we know what we want; let''s flesh
    it out into the syntax from before and see what we have.


    ```

    create table todolist(

    idnumber <column type>,

    description <column type>,

    owner <column type>,

    date <column type>,

    location <column type>,

    importance <column type>,

    creator <column type>

    );

    ```


    Well, looking better, but we still don''t have anything that will say that our
    idnumber is primary or automatically updated for each row. This brings us to what
    the column types are. MySQL will need to know which values of each of our data
    elements will be so we can know how to store them and what kind of queries they
    can be involved in. There are at least 30 data types in MySQL, which can perform
    all kinds of operations, but for our purposes there are only three we need to
    be concerned with: one is text or a string of text that is known as a VARCHAR
    and is given a maximum number of characters, the second is a number or integer
    known as an INT, and the last is a date value that is known as a DATE. Given that
    we now know data types, we can set them out inside our create table command. Go
    ahead and do that and remember that text strings (VARCHAR) need to be given a
    maximum number of characters long:


    ```

    create table todolist (

    idnumber INT,

    description VARCHAR(200),

    ```'
