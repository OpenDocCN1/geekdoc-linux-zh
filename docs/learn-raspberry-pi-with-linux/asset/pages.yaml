  md: '# CHAPTER 5 ESSENTIAL COMMANDS


    Inside the sudoers file are a number of things that control how the sudo environment
    works, including a PATH variable (which we will cover later). The important thing,
    however, is the line down the userauth that looks like this:


    ```

    root  ALL=(ALL:ALL) ALL

    ```


    This line states that the root user on all hosts can access all commands on all
    other hosts (a host is a server on the network). This is a bit confusing, but
    it basically grants full access to any user that can identify itself as root.
    There is another line:


    ```

    %sudo  ALL=(ALL:ALL) ALL

    ```


    This line says that members of the sudo group can also do the same things as the
    root user: accessing from all hosts on the network all commands can be executed
    on all hosts on the network. You will notice the % that is used to signify that
    this is a group name. The basic format of one of these lines is:


    ```

    <user> <From hosts>=(on hosts>:<commands>) < options and commands >

    ```


    This syntax is a bit confusing at first so creating a particular set of permissions
    for your pi user as an example. We will first need to create a new basic set of
    user permissions that will look just like the root users, but will refer instead
    to our pi user. This line will look like:


    ```

    pi  ALL=ALL ALL

    ```


    I have removed the <con which: commands> section and replaced it with one generic
    ALL to make things a bit easier to understand. Now let''s say the pi user not
    to be asked for a password. To do this, we add a NOPASSWD: before the final ALL
    that represents commands. This gives us a new line:


    ```

    pi  ALL=ALL NOPASSWD: ALL

    ```


    If you add this, you can run all commands as the pi user without needing to even
    provide a password. This is a very dangerous command, so let''s modify it slightly
    to make it only the sudo command that can be executed. To do this, we replace
    the final ALL with the command we wish to use, which in this case is visudo. But
    we can''t just write visudo, so we use visudo to get the following:


    ```

    pi  ALL=ALL NOPASSWD: /usr/bin/visudo

    ```


    Now you are getting the idea of what you can do within the sudoers file to control
    how the sudo command is accessed. There are multiple entries that govern how these
    commands can be run, by whom and under which conditions. There is also a large
    amount of functionality for adding aliases, which can be large combinations of
    commands, hosts, or users. The syntax for these commands is available from the
    manual for sudoers.


    Finally, one last command for you to be aware of is the sudo command, which is
    short for switch user. This command does exactly what it implies and switches
    which user you are, and if you aren''t root it will prompt you to enter the password
    of the user you wish to switch to. One of the niliest cheats for gaining root
    access is to combine


