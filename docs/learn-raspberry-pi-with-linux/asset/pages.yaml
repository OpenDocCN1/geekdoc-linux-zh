  md: "# XBMC on Boot\n\nAlthough we have started XBMC by hand thus, most people will\
    \ want it to occur automatically because what is the point of a media center that\
    \ you need to plug a keyboard into each time you want to start it?\n\nThe following\
    \ is a simple script that will allow you to execute XBMC using a start script.\
    \ Create this in the file /etc/init.d/xbmc (like all other long files, it can\
    \ be found in the Apress repository for this book):\n\n```\n#! /bin/sh\n### BEGIN\
    \ INIT INFO\n# Provides: xbmc\n# Required-Start: $all\n# Required-Stop: $all\n\
    # Default-Start: 2 3 4 5\n# Default-Stop: 0 1 6\n# Short-Description: Start XBMC\n\
    # Description: Start XBMC\n### END INIT INFO\nDAEMON=/usr/bin/xinit\nDAEMON_OPTS=/usr/lib/xbmc/xbmc.bin\"\
    \nNAME=xbmc\nDESC=XBMC\nRUN_AS=root\nPID_FILE=/var/run/xbmc.pid\ntest -x $DAEMON\
    \ || exit 0\nset -e\ncase \"$1\" in\nstart)\n  echo \"Starting $DESC\"\n  start-stop-daemon\
    \ -c $RUN_AS --background --pidfile $PID_FILE --make-pidfile\n  --exec $DAEMON\
    \ -- $DAEMON_OPTS\n  ;;\nstop)\n  echo \"Stopping $DESC\"\n  start-stop-daemon\
    \ --stop --pidfile $PID_FILE\n  ;;\nrestart|force-reload)\n  echo \"Restarting\
    \ $DESC\"\n  start-stop-daemon --stop --pidfile $PID_FILE\n  sleep 5\n  start-stop-daemon\
    \ -c $RUN_AS --background --pidfile $PID_FILE --make-pidfile\n  --exec $DAEMON\
    \ -- $DAEMON_OPTS\n  ;;\n*)\n  echo \"Usage: /etc/init.d/$NAME{start|stop|restart|force-reload}\"\
    \ >&2\n  exit 1\n  ;;\nesac\nexit 0\n```"
  merge: -1
  pgno: 244
