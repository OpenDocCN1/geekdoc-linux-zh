    # Pis for PHP


    PHP is a system for allowing you to add dynamic functions into your web page.
    Originally, all web pages were made from HTML, which doesn''t allow for much flexibility
    on inputs and actions. HTML just displays a static page of content that needs
    to be something different. To solve this issue, the Common Gateway Interface (CGI)
    was developed. This provided a way for servers to request data that would allow
    them to return content.


    Originally, most CGIs were full-blown applications that produced various pieces
    of HTML depending on their input, and whole portions of these were dedicated to
    outputting chunks of the same HTML over and over. This is where the development
    of PHP came in. PHP was developed to be a language in which one could add snippets
    of actual code inside the static HTML and presto: a dynamic web page would be
    formed.


    Since its creation, PHP has been widespread with installation figures of 20 million
    cited. This success is no small part due to the ease in which PHP can be used
    as a CGI compared with the original application form CGIs. Now that you have an
    understanding of what PHP is, let''s install it on the Raspberry Pi. As ever,
    we will rely on the services of apt-get to fetch and install PHP for us. The command
    to run this is:


    ```

    sudo apt-get install php5

    Reading lists... Done

    Building dependency tree

    Reading state information... Done

    The following extra packages will be installed:

    ```


    ```

    apache2-mmp-prefork libapache2-mod-php5 libonig2 libqdbm14 php5-cli php5-common

    Suggested packages:

    php-pear

    The following packages will be REMOVED:

    apache2-mp-worker

    ```


    ```

    The new PHP packages will be installed:

    apache2-mmp-prefork libapache2-mod-php5 libonig2 libqdbm14 php5-cli php5-common

    0 upgraded, 7 installed, 1 to remove and 84 not upgraded.

    Need to get 5,707, 16.3 MB of additional disk space will be used.

    After this operation, do you want to continue [Y/n]

    ```


    Notice that PHP is making a modification to our Apache installation. This is to
    replace the Apache tresman modules with those that are preferred for installing
    PHP. Once the PHP has finished installing, we will go ahead and test that it is
    working. There is a simple PHP page that we can write, which will show all our
    installation settings and confirm that PHP is running. To test this first page,
    we will need to replace index.html in /var/www with a new index.php that has the
    following line inside it:


    ```

    <?php phpinfo(); ?>

    ```'
