- img_proc: true
  md: 'The first editor we''ll cover is nano. It is a lightweight and easy-to-use
    editor and it tends to be installed on most systems. Some later versions of nano
    have more features (such syntax highlighting when writing source-code), but all
    effectively look work the same way. If you can use nano on your Pi, you''ll be
    able to use it equally on any platform.


    The nano editor was actually written to be a replacement for the pico editor that
    shipped with Pine, a text-based e-client. Pico can still be found on older systems
    (usually older), and chances are if you can''t find nano, it might still be fine
    to pico. Because it''s a replacement, the same commands and basic features used
    in nano are also available in pico. This gives you coverage of most other Unix
    platforms like as Linux.


    Nano''s key selling point is ease of use, but it has more features than pico.
    These features are accessed from menus, and while nano has more features for simply
    editing a config file, sometimes with a little more power. This is where vim comes
    in. Vim can do all the things that nano do, but it can do much more so highlighting,
    cut and delete blocks, indent chunks of text, open multiple files and more at
    the same time, and more.


    Now you might think that if vim is great, you might save yourself a lot of headaches
    by simply learning how to use that editor rather than any others. Like nano, vim
    is available everywhere in some form or another, and has has the same basic features
    and accepts the same commands. The reason we''re covering nano is that you can
    be up and running quite literally in just a few seconds. Its features are easy
    to explain, and getting it to do what you want is really easy. That said, if you
    really don''t want to learn two editors and feel that you''d rather learn nano,
    that''s fine, you won''t be missing out on anything; it might take you a bit longer
    to get productive.


    # # Starting out with nano


    We''re starting out with nano for the simple reason that it''s really easy to
    use and doesn''t take much explaining. You can literally do everything you need
    in nano, and while you might be able to do it faster in another editor, nano will
    help you get the job done fine.


    Nano can be run by using the nano command. Okay, no surprises there, but running
    nano by itself isn''t all that useful. After all, you''ve got a text editor now
    and you want to do some editing. Unless making a few notes, no one just writes
    text without wanting to save it. After when you open nano, you probably want to
    open a particular file for editing. That file may or not exist, but you probably
    know what it is you want to call it when it comes to pressing the save button.
    For the sake of this introduction, we''re going to open nano and tell it that
    we want to edit text. We can do that with:


    ```

    $ nano test.txt

    ```


    All being well, you should get something like Figure 6-2.'
