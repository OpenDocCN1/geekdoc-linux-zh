    Following this, we begin getting into the nuts and bolts of the solution. We can
    modify the height,width,

    and framerate. The defaults are to capture two images per second at a resolution
    of 320 x 240. This creates a file

    12 KB in size—you can check by examining the files that we generated during our
    testing of the motion capture.

    You increase this as you see fit; just remember not to exceed the maximum available
    resolution of your webcam

    and that each file will increase in size as resolution increases.


    Next is threshold. The threshold value is the amount of change that needs to occur
    that an image is

    captured. You can increase this value for noise, but remember that you may want
    to make the capture more

    less sensitive.


    There is ffmpeg_cap_new, which determines whether or not you want to capture a
    video file. I have turned this one

    off, but but you can keep it on if you want to generate video files of your motion
    capture. These files are generated as .swf

    now (YouTube) but you can change them by editing the ffmpeg_video_codec variable.


    Finally, you can change the target_dir, which will output the image files when
    running as a

    demon. This is important because you will need to know where to copy your files
    from. Additionally, it''s

    to be aware that the /tmp directory is just that, a temporary space. This temporary
    space is emptied each

    when your OS is restarted.


    This kind of functionality is perfect for what we intend we don''t want to have
    to deal with extra files that

    stay on the disk until we clean it out; simply reboot your Raspberry SPI and you
    go again. However, there are

    cases where we may want these files to be saved beyond a restart of the system—but
    more on later.

    Finally, save all your changes and exit so we can test the new config! My config
    is displayed here for your reference:


