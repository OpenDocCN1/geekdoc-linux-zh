  md: 'The next item on the prompt (~ or tilde) actually tells us which directory
    we''re currently in. The tilde is a special case because it refers to the home
    area of the current user. You can think of it as shorthand because really that''s
    all it is. Any time you refer to your home directory (in this case is ~pi), we
    can simply replace it with the tilde. Time for a quick example:


    ```

    pi@raspberry ~ $ pwd

    /home/pi

    pi@raspberry ~ $ cd

    pi@raspberry ~ $ pwd

    /home/pi

    pi@raspberry ~ $

    ```


    Here we used the pwd (short for working directory) command, which prints out the
    full path of the directory we''re currently in. In our example, we printed out
    /home/pi because that''s the pi user''s home directory. We then used the cd (for
    change directory) command to go to ~. We used pwd again and able to verify after
    changing the directory we back where we started. We will be explaining these commands
    more thoroughly in the next chapter, but this isn''t command-line at least a bit
    interesting.


    When referring to the ~ in general speech, you refer to it as home directory.
    So if you are at the prompt in some example and asked what directory you were,
    you wanted to be explicit you would say you were in the pi user''s home directory.
    If you wanted to get really specific you could even mention the hostname as well.
    You wouldn''t say that you are in the tilde or "wiggly line" directory.


    However, when you are going a path to something, you would say that. For example,
    if you wanted to go to "~/test", you would say "cd type slide slide test and press
    Enter." This is because tilde in this case refers to specific that you are using
    as a convenience to get to a location rather than actually telling someone what
    location is. It also helps prevent confusion with relative paths, but again, that''s
    something for the next chapter.


    > We''ve heard tilde announced as both titled and till-duh, so you should expect
    to hear both of them in the wild. Interestingly, you might find whenever you use
    one, people might have trouble understanding you, and this applies even to experienced
    administrators. It''s not because you are pronouncing it wrong; it''s just they
    don''t know that the "wiggly line to the left of the 1 key" is actually called
    tilde. If you find yourself in that situation, referring to it as the "wiggly
    line one" seems to be a fairly safe bet.


    The last part of the command prompt shows what your access level is. Linux systems
    are pretty basic when it comes to system privileges. It can generally be up this:
    you are either the root user or you''re not. There are exceptions to being root
    and a member of certain groups allow you to do things that would normally require
    root access. That said, this is the exception rather than the rule. If you are
    root, then you can do anything pretty much you want without hindrance. If there
    are any other users, expect to find your abilities drastically curtailed. This
    isn''t true today as it is true because there are tools like sudo that allow an
    administrator to grant the ability to run certain commands with root privileges
    without user having access to the root account. Of course, sudo runs as root and
    it decides whether it will run the command you asked it to, so it obeys the all
    or nothing.


    From the prompt''s perspective, if you are a normal user, you get a dollar sign
    as a prompt. We''re logged in as the pi user (which obviously isn''t the root
    user), so we have the $. If we were logged in as, we would be a privileged user,
    so we would get the hash symbol (the pound sign if you''re not from the UK). A
    root prompt looks like this:


    ```

    root@raspberry ~ #

    ```'
