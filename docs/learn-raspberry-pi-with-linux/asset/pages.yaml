  md: '# CHAPTER 1 YOUR FIRST BITE OF RASPBERRY PI


    If you can see something, congratulations, your Pi is up and running! If there
    are not, there are a few things that might have gone wrong.


    The first thing to check is whether your Pi has a red glowing power LED. Now we
    know this sounds obvious, and we know that it''s probably the first thing you
    checked, but not checking it is also the most common mistake to make. If your
    desk looks like ours, you will have a collection of cables draped about. It''s
    not too much of a stress to see how which one you''ve plugged in the wrong cable
    or the cable that you''re using isn''t actually plugged into a power source (some
    laptops, for example, turn off power when they go to sleep). Either way, this
    you should check first if you make a mistake, you will know about it. This is
    much better than an extended discussion on the process trying to get help to realize
    that you forgot to plug it in.


    The second thing to check is whether you have selected the right input on your
    TV or monitor. Most TVs have multiple inputs, and monitors often don''t default
    to HDMI (doesn''t), even if that is the only input signal they are receiving.
    Obviously, we can''t tell you how to fix or check this as it depends on the equipment
    you''re using. However, it would be fairly easy to flick through the different
    inputs to see whether or your Pi turns up. In one interesting case, even though
    on the TV port selected HDMI2, the Pi was actually visible. We have thought that
    if we had thought to flick through the inputs before fiddling with the Pi, we
    would have saved ourselves a fair bit of grief.


    The third thing to check is whether the SD card is properly inserted into its
    slot. The Pi will quite literally do nothing unless it can find the card and boot
    if you''re seeing a black screen, this could be the reason. If you are sure the
    card is inserted properly, but you''re still not having any luck, it might be
    that something went wrong when you wrote the image to the card. In case, flip
    back to the last section and have another go at writing the image to the card.
    If you are still not getting anywhere and you''ve checked that everything is plugged
    in nicely, now you have the right input on your monitor, and you have a happily
    glowing power LED, then it''s probably something more onerous. Unfortunately,
    you''re not alone; there are lots of people on the Raspberry Pi discussion forums
    who are ready to help out. To visit the forum, go to www.raspberrypi.org and click
    the Forum link (just below and to the left of the Raspberry Pi Forum) This will
    get you to the main forum page; the particular board you''re looking for is Basic
    Usage and Setup Using the Raspberry Pi.


    # Configuring Your Pi


    After the torrent of incomprehensible text (though you''re sure it means something
    to you) you should end up at the configuration shown in Figure 1-13. This is where
    we configure your Pi for general use so that next time you turn it on, you will
    be greeted with a nice desktop rather than chunky text.


