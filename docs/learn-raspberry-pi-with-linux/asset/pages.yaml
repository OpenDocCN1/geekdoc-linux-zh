    the logic flows like this: if the test is true, do something, else do a different
    thing. We can use a combination of these two to perform our tests for FizzBuzz.
    The syntax of an if, else statement is as follows:


    ```

    if [ TEST ]; then

    DO SOMETHING

    else

    DO A DIFFERENT THING

    fi

    ```


    The syntax is almost identical to the original statement, so it is easy to make
    a few changes to make your if statements into if, else statements. But now we
    run into the much bigger problem—and one that is the cause of most people''s problems
    with programming; the logical order. We need to create a sequence of tests so
    that we can determine if something is divisible by 3, 5 or both; and perform a
    wholly different action in each case. This kind of thinking is what makes programming
    so hard for many people, and there is no trick to it: you simply have to work
    it out. So let''s have a go at working this out


    If we find something divisible by 3 or 5, and output something before checking
