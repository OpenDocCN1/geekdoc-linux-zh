    # Querying a Database


    Unlike of the other statements, a data query is not done with a QUERY command.
    This is because all of the commands we have been executing are considered to be
    queries. The command for retrieving data is called a SELECT and its syntax is:


    ```

    SELECT <fields1>, <field2>... <fieldX> FROM <TABLENAME> WHERE <INFORMATION QUERY>

    ```


    Yes, know that syntax is a little strange, but once we fill it out you will get
    more of an idea of why it is the way it is. For starters let''s just grab everything.
    Normally you put field names that you wish to get, which limits the amount of
    excess data being transmitted, but in this case we can use the wildcard *. Thus
    to query every one of our todolist table, we will execute:


    ```

    SELECT * FROM todolist:

    ```


    | idnumber | description | owner | date | location | importance | creator |

    |---|---|---|---|---|---|-|

    | 1 | Finish LAMP Chapter | David | 2012-09-22 | Australia | HIGH | David |

    | 2 | Finish GUI Chapter | Peter | 2012-09-22 | Hong Kong | HIGH | David |


    2 rows in set (0.00 sec)


    You will notice that we leave off the WHERE, this is done, as there is no actual
    limitation of what we want, we want Everything, you can see that everything else
    is encoded in the format we gave it and more importantly the ID numbers are incrementing!
    This validates everything that we inserted before. Now that you understand the
    very basic syntax we can do some slightly more advanced queries. Let''s say I
    want to find out whom to blame for assigning me (David) a task. The relevant information
    in this case is the creator as''s all we want, whom to blame. This will give us
    the first half of a query:


    ```

    SELECT creator FROM todolist

