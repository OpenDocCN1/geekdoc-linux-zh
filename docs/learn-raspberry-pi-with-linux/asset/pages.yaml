    # Summary


    So we''ve come a long way since we started. We''ve done a lot. We have installed
    and configured Apache, MySQL, and PHP. You have learned how to create simple SQL
    statements to create and delete databases and tables and then learned how to insert
    and delete data from these tables. Finally, you have learned how web content is
    displayed from an Apache web server. Then we combined all and went through some
    PHP and HTML to generate a whole application that provides access to a database
    to-do list table.


    This has been a monumental undertaking because we have not only gone and installed
    three different applications and created an interconnected application stack but
    also gone over three languages to create an application on top of the application
    stack.


