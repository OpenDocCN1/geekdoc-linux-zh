  md: '# CHAPTER 1 YOUR FIRST BITE OF RASPBERRY PI


    Now that the world has Linux, what exactly can we do with it? Almost anything
    we like—such as installing it for free on your Pi.


    # # Downloading Raspbian


    At we''re off to http://raspberrypi.org/downloads/ to get our hands on Raspbian.
    Not only does the page contains links for the download we''re looking for but
    it also has links for various useful tools as links for other prebaked Linux distributions
    for the Raspbian Pi. We touched on lightly in the previous section, but if you''re
    thinking about getting one of the more exotic distributions, take a look at the
    “Raspbian?” sidebar.


    | WHY RASPBIAN |


    As you can see from the download page, there are numerous distributions to choose
    from, and especially if you''ve used Linux elsewhere you might be tempted to pick
    something other than Raspbian. However, before you download that distribution,
    you should know that the majority of people using a Pi run Raspbian—and as much
    of the support, blog posts, and tutorials (not to mention this) are all on it.
    This means if you pick something else, you will find it much harder to get if
    someone doesn''t go according to plan.


    The other subtle issue is that Raspbian is an ARM-based device. It doesn''t work
    the same way as your PC does. For example, the Pi doesn''t have a PCI bus, so
    any tools that there expect to be there are more than a few) won''t work. There
    are also quite a few gotchas for those other distributions, and they might not
    be as well maintained as Raspbian. In short, you will be taking much more if you
    don''t pick Raspbian to start out.


    Traditionally, a Linux distribution will come on a set of CDs or DVDs. The idea
    of your distribution of choice, is that you take the image and once you write
    it to a CD, that CD will be identical to the one image was originally cloned from.
    Raspbian (and the Pi in general) is a bit different. It doesn''t have a built-in
    CDROM or even a floppy drive. Instead of downloading an image on a CD or DVD,
    we''re going to download an image of SD card that contains Raspbian all up and
    ready to go.


    You can download Raspbian directly from the site (there are numerous mirrors)
    or via BitTorrent. BitTorrent can sometimes be faster, and it takes some of the
    load off Source Forge. However, there are places you probably shouldn''t be using
    a BitTorrent (i.e., at work), and some connections perform very badly due to the
    way BitTorrent works (such as mobile 3G). In any doubt, just select the download.
    We want the mainline version of Raspbian (Raspbian Whezy), which is the first
    one in the list of available distributions for download.


    # # Getting Raspbian onto Your SD Card


    Getting Raspbian onto your SD card isn''t as simply as copying the file. Remember
    we downloaded an image that is a direct representation of what should be on the
    card. If you just copy the image onto the card, it will still just be a card with
    a copy of the Raspbian image on it. What we need to do is write the image directly
    to the card, and for that we''re going to need some of those handy tools we briefly
    mentioned earlier.


