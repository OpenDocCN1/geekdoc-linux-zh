- img_proc: true
  md: '# About the Authors


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_270_0.png)


    **Peter Membrey** is a Chartered IT Professional with nearly 15 years of experience
    using Linux and open source solutions to solve problems in the real world. RHCE
    since the age of 17, he has also the honor of working for Red Hat and writing
    several books covering open source solutions. He holds a masters in IT (Information
    Security) from the University of Liverpool and is currently a PhD candidate at
    the Hong Kong Polytechnic University where his research interests include cloud
    computing, big data science and security. He lives in Hong Kong with his wonderful
    wife Sarah and son Kaydyn. His Cantonese continues to regress.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_270_1.png)


    David Hows is an Honors graduate from the University of Wollongong in NSW Australia.
    He got his start in computing trying to drive more performance out of his family
    PC without spending a fortune. This lead to a career in IT where David has worked
    as a Systems Administrator, Performance Engineer, Software Developer, Solutions
    Architect and Database Engineer. David has tried in vain for many years to play
    soccer well and his coffee mug reads "Grumble Bum."'
  merge: -1
  pgno: 270
- img_proc: true
  md: '# About the Technical Reviewer


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_271_0.png)


    Stewart Watkiss graduated from The University of Hull, UK, with a Master’s degree
    in electronic engineering. He has been a fan of Linux since first installing it
    on a home computer during the late 1990s, back when Linux was installed using
    floppy disks. While working as a Linux system administrator, he was awarded Advanced
    Linux Certification (LPIC 2) in 2006, and created the PenguinTutor website to
    help others working towards Linux certification (http://www.penguintutor.com).


    After ordering his first Raspberry Pi on the launch day, he has since gotten three
    more, which he uses as a family friendly proxy, a media center, for working on
    hobby electronic projects, and teaching his two children about computers.'
  merge: -1
  pgno: 271
- img_proc: true
  md: '# Acknowledgments


    Without a doubt, the true heroes of this book are the Raspberry Pi Foundation
    and the Raspberry Pi community because without either of them, we wouldn''t be
    here. The Raspberry Pi Foundation, the group who bought us the Pi, is a nonprofit
    charity with the stated goal with the Pi was to reinvigorate the development spirit
    of the ''80s and to provide an affordable platform for generations of youngsters
    to get into the wonderful world of computing in a truly meaningful way. It has
    done so much to bridge the digital divide and bring computing to the common man,
    and for this it deserve our thanks.


    If the Raspberry Pi Foundation is the heart, the Raspberry Pi community has to
    be the soul. These people have sought to provide the tools and support people
    need to get started with the Pi regardless of skill level. They have invested
    countless hours (and dollars) in writing, fixing, porting, hacking, and testing
    things for the Pi. Please feel free to pay a visit to them at http://www.raspberrypi.org/
    and see what we mean.'
  merge: -1
