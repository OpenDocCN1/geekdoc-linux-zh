  md: '# The crontab Command


    The last command is probably one of the most powerful and useful tools in a systems
    administrator toolkit: the cron command, cron is a timing application that executes
    commands at a given time based on rules passed to it by steering file. cron has
    a steering file per user called crontab, which it will check each minute to see
    if another command needs to be executed. To view your current crontab, you would
    simply need to execute this:


    ```

    $ crontab -l

    ```


    Unfortunately, you won''t have one to begin with, so all you will get from this
    command is this:


    no crontab for pi


    Fear not we will now go over the basics of creating a crontab timing file. The
    command to enter the special crontab is as follows:


    ```

    $ crontab -e

    ```


    This will open a copy of your standard editor and create an initial file with
    a block of comments that outline how a crontab entry is laid out. It provides
    the following example:


    ```

    0 5 * * 1 tar -zcf /var/backups/home.tgz /home/

    ```


    This command will perform a tar and zip of all users'' home directories at 5 a.m.
    Recall that tar creates a single archive file of all the documents, the zip will
    compress the file—upshot being a single compressed file containing all the files.
    The five numbers at the start of the line govern the timing; these numbers represent
    the following things, in the following order:


    +   - Minute of hour

    - Hour of day (in 24 hour format)

    - Day of month

    - Month of year

    - Day of week (Sun, 0 to Sat, 6)


    As you can see above, this command runs on the zero-th minute of the fifth hour
    of the day is a Monday. With this combination, you can set up any number of timing
    jobs in order to perform systems administrative functions. The best part is that
    you can use all the commands we have discussed earlier to perform these tasks
    for you! Want to kill a process at a certain time? Write the cron timing out for
    when you want those killed and then use the pkill, grep, awk, xargs, and the kill
    command we worked up earlier! With the combination of cron and all the commands
    we covered earlier, there is no limit to the tasks you can do!


    # Summary


    Congratulations, you should now be on your way to becoming afledged systems administrator.
    You have at your disposal more than two dozen individual commands and the ability
    to combine them in new ways to perform any task your heart desires. In addition,
    you should have the tools to automate the execution of these commands using cron
    by editing your crontab file. All these tools form the basis of how a systems
    administrator will manage a Linux system as they provide the flexibility to write
    robust commands and have them executed automatically.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# CHAPTER 6


    # Editing Files on the Command Line


    Believe it or not, one of the things you''ll end spending most of your time on
    Linux is editing text files. They get absolutely everywhere, and you''ll find
    them used for content, source code for applications, configuration files, and
    startup scripts. The reason is that despite their somewhat basic and boring nature,
    they are very useful for storing readable information. When you combine this with
    use, you know you''re on a Linux. Linux doesn''t have a registry like Windows,
    and it''s extremely rare for applications to use text files for their configuration.
    Even Sendmail, which has a historically evil config file (so evil in fact you
    need to config a file for yet another application that then need the Sendmail
    config file for you), stores its file as plain old text.


    This chapter gives you a brief overview of text files and how they''re used. We''ll
    introduce the two editors we''ll cover in this chapter (nano and vim) and we''ll
    get into the real meat of the chapter and show you how to get things done.


    # What is a Text File?


    When computers store data on disk, it can store data in one of two formats: as
    a text file or as a binary file. So computers store everything as binary data
    (those good old 1s and 0s), what exactly makes a text file different from a binary
    file? After all, surely the text file must also be stored in a binary format.
    If you were thinking along lines, you''re correct. It''s not so much how the data
    is stored, but more to do with how data can be read.

    The best way to appreciate the difference is to think about the page you''re reading
    right now. The reason why you can understand what I''m writing is because we have
    agreed to use English to communicate. The content of this page has structure that
    we both understand. We start with capital letters; we use punctuation when sentences
    end or stop for a break. In short, we have quite a complicated protocol here,
    it works because we are both capable of reading and writing English. We can understand
    both the *structure* (how the data is to be read) and the *semantics* (what the
    words actually mean). So, what about the following sentence?


    Goedemorgen. Hoe gaat het?


    Straight away we can tell that it''s not English; after all, if we would be able
    to understand it. Unless we have to speak Dutch (we don''t, but our good friends),
    you probably wouldn''t know which language it is written in. Even the content
    doesn''t make sense, the structure itself does. We can see two sentences: one
    is a statement and the other is a question. In this case, we can guess the first
    word. If we pronounce it as English, it sounds very similar to good morning (which
    is what the word translates to). From that, we can probably guess the question
    is "How are you?"


    The reason we can understand that is although we don''t understand the content,
    Dutch and English share a common structure or format. We share an alphabet (though
    Dutch has some characters not present in English) and punctuation (full stops,
    commas, and question marks). Now you might not get the pronunciation right (it
    is, after all, a foreign language) because we share a common structure, we can
    at least handle the content, if we can''t understand it.


    Let''s take this step further with Figure 6-1.'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# 早上好。你怎么样？


    **Figure 6-1.** Some Chinese text


    At least for the reader of this book, Figure 6-1 will be unintelligible. It''s
    actually the same sentences that in our Dutch example, but this time written in
    Chinese using simplified characters. To the uninitiated, there is no way to tell
    from this collection of characters how they should be pronounced. In fact, depending
    on the dialect spoken, these characters could be pronounced in many ways. This
    is because each character represents an idea and a sound, and once you recognize
    the idea, you know how to say it. In China it is possible for two people who cannot
    speak the same language to communicate perfectly by reading and writing Chinese.


    So why did we introduce foreign languages? Well, text files are like reading and
    writing English or Dutch. Whether the content matters or not depends on whether
    the reader can speak English or Dutch. This is similar to two applications and
    their config files. If you have an Apache server configuration file and the Sendmail
    e-mail server it will spit in your face (Sendmail doesn''t speak Apache), but
    you can open and read the file.


    Chinese, on the other hand, is an example of a binary file. It is very alien to
    most Western speakers. Unlike English, which you know, you don''t understand the
    Chinese structure. In computing terms, what you have is a blob of raw data that
    only makes sense to the application that you wrote.


    Now you might think that storing data in an arbitrary format is no big deal. After
    all, the application that you wrote is the one that will read it, and as long
    as it understands the file, surely that''s enough. Well and no. What happens if
    the program breaks? What if you need to read the file on another machine? Perhaps
    the vendor has some special tools to do that, but then there is the problem: you
    need special tools.


    So not for text files; they can be opened in any text editor, and no special tools
    are required. Because the vast majority of Linux applications use all text files
    (we can''t think of any off the top of our heads that don''t), all you need to
    read or make changes to a configuration file is your favorite text editor, and
    Linux has a variety of editors to choose from. Thus you can become familiar with
    a single tool and then use that tool to reconfigure all your applications, write
    source code when you are scripting, and even use it for writing books (which is
    precisely what we''re doing now).


    # The Contenders


    So the editor is your Linux Swiss army knife that you never want to leave home
    without. Of course, like Swiss army knives, there are many different editors to
    choose from, and some have more features than others. Sometimes you might want
    to do a complex search and replace or delete to the end of the line. Other times
    you might want to use one of the more feature-full editors for all your tasks;
    after all, you don''t have to use the features if you don''t need them. That said,
    it''s been our experience that people are generally familiar with at least two
    text editors: one basic and one fully featured. In this book, that means nano
    and vim, respectively.'
  merge: -1
