    # HDMI Lead


    Over the past few years, HDMI has become the de facto standard in connecting a
    myriad of devices to both monitors and TVs. This is really handy because it means
    if a device supports HDMI, it can be easily connected to any display that supports
    it. This might not sound all that, but it wasn''t too long ago that TVs and monitors
    were separate things and there was no direct way to connect, a computer to a TV
    or a VCR to a monitor (although the Commodore 64 or Spectrum). Of course, you
    could get special hardware, and some higher-end devices did offer a range of different
    connectors, but as a rule, the two worlds didn''t really mix.


    Fortunately, the Pi uses HDMI, so we can ignore the irritations of the past. To
    connect your Pi to a display, you will need a Type A lead. The size you will find
    in the back of your TV or monitor; all you have to do is find a lead for connecting
    some device with HDMI to a TV and where both ends are the same. Most modern electronics
    use Type A, so if you have an Xbox 360 or you are lucky to have a lead of the
    correct type.


    # HDMI Capable Display


    You probably saw that one, but you''re going to need some sort of display that
    supports HDMI. As it has been widely adopted over recent years, practically every
    new TV has one or more HDMI ports. These days, it''s common to see three or four
    ports on a TV you''ll need to hook up all of your new devices. It''s pretty to
    determine whether your TV or monitor supports HDMI. All you have to do is look
    for a physical HDMI port. You are much more likely to find it on your TV rather
    than your monitor, but many of the basic monitors these seem to import.


    In one case, it turned out that the monitor didn''t support HDMI, the TV in the
