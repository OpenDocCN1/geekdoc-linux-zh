  md: '# Fast


    You probably won''t believe us right now when we say this, but using the command-line
    interface will allow you to complete many of your tasks much faster because you
    can be very precise and express a lot of work in a single line of text—the sort
    of thing that would require multiple clicks or a strange convoluted process to
    execute using a mouse.


    # Lightweight


    Anyone who has had the misfortune of trying to control a desktop PC over a slow
    Internet connection will appreciate exactly what we mean here. Sending updates
    across the Internet (especially for high-resolution screens with lots of colors)
    by its nature takes up a lot of bandwidth. It can also take for the data to arrive
    at its destination, which is what we get from this problem because sessions become
    unresponsive and blocky to feel.


    Text-based sessions don''t suffer from this they only send text. They were designed
    for humans in which the maximum spends a mere fraction of what is available to
    today. Even on a very slow dial-up link, a remote terminal session tends to perform
    extremely well.

    It puts less strain on the server. Maintaining a graphical interface means that
    the computer has to do quite a bit of work to track and make sure it reacts properly
    when it touches an application or when the user clicks a button. A surprising
    amount of work goes behind the scenes, and this is why Linux servers rarely have
    a graphical interface installed, much less running.


    # Powerful


    The command line gives you an awful of power. You can express complex thoughts
    and issue commands in a way that wouldn''t be possible via a graphical interface.
    For example, you can string commands together to make more complex chains. You
    can take the output of one command and use that as input for another. This technique
    uses something called *pipes* (we cover it thoroughly in Chapter 5).


    # Always Available


    Although things have gotten better in recent years, one of the most fickle pieces
    of software on a Linux box tends to be the graphical interface. It always seems
    to be the first thing to go, and when your server boots and you need a rescue
    environment, it''s unlikely that a graphical interface will be available to you.


    A terminal, is the native way to Linux (and most other UNIX-like operating systems)
    and as such, it''s the tool that will always be available to you in some form
    or another. Knowing how to use the terminal will get you out of scrapes and deal
    with situations that would completely stump you if you weren''t comfortable with
    the command line.


    # Convinced Yet?


    Hopefully, these highlights have at least convinced you that there might be something
    to the command line after all. If you''re not totally convinced, that''s okay;
    it is hard to really get a feel for the benefits until you''ve actually spent
    some time experiencing them for yourself. In the next section, we''ll cover how
    to actually get yourself to a command line, explain what the stuff you''re looking
    at means, and cover some basic commands to get you started on your journey.'
