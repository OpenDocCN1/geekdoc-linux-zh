    - Default Case: Tell people about how to use this file


    This means I will have four case statements within my case. I will define the
    case statements (sans code to perform actions) as such:


    ```

    case "$1" in

    start;

    stop;

    restart;

    reload;

    *);

    esac

    exit 0

    ```


    Now that we have the case entries, we just need to make them do something. I mentioned
    earlier what I want to do in each case, so let''s write out the commands into
    each block and combine them into the script we have already. This will give us
    the following script:


