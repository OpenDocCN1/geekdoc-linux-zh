  md: '# CHAPTER 9 | WiPi: WIRELESS COMPUTING


    Suddenly, you see what I''m getting at; the Raspberry Pi, the tiny unattended
    super machine is actually quite tied down. Tied down with the needs of human usability
    and interactivity, these constraints mean running a large number of cables to
    your Pi just to get some of the basic functionality out of it. As you can possibly
    guess, all is not! There are many ways you can detach your Pi and make it a lot
    more mobile and give yourself a lot flexibility in what you can do. That''s the
    purpose of this chapter: to provide you with the tools and some background to
    remove the wires constraining your Raspberry Pi.


    # Preparing for WiPi


    In addition having your SD card loaded with a copy of Raspian, you will want to
    ensure that your version of Raspian has been upgraded because the September release
    included significant improvements in how WiFi access is managed. To get this system
    up, you will first need to run a few quick commands:


    ```

    $ sudo apt-get update

    $ sudo apt-get upgrade

    ```


    These commands will tell you your apt-get instance to update to which versions
    of the software are available for you use. The second will tell you apt-get to
    connect and install every upgraded version of all software currently installed
    on your system. As you can imagine, these commands on a regular basis is a very
    good idea because it allows you to keep your system running the latest version
    of the software.


    # Simple Constraint Removal


    Before you begin chopping off willy-nilly, you need to understand what you want
    to do with your Pi. This will automatically make a place of constraints on what
    you want to do with it. I can''t presuppose what you want to do with your Pi because
    there are so many options. This, what I will tell and provide here are individual
    ways that you can cut the cord (not literally) and unconstraint your Pi. You may
    be able to make use of your newfound cable-cutting skills with some of the content
    in later chapters to improve on the designs or to make them suit your purpose.


    # Removing Human Input Devices


    Start with the easiest and lowest of fruits: the monitor, keyboard, and audio
    cables. It sounds funny to say that cutting out three peripherals at once is easy,
    you are really cutting something different out of the equation: By far, the easiest
    set of constraints to cut is that of the human interaction devices. Much of this
    is in fact, geared towards getting the skills to work with your Pi without the
    aid of a monitor, keyboard, or speakers. This is not to say you can''t ever undo
    it; you can plug them back in as needed to diagnose any critical issues, but you
    can start by removing them and managing your Pi remotely. The use of SSH is here
    because you use SSH to remotely connect your Pi over your network connection.
    Once you have connected to your Pi, you have full command-line access to perform
    whatever tasks you need. There is also the added benefit that you can change the
    memory distribution within your Pi using sudo raspberrypi-config and the memory_split
    to 240/16, which puts some of the memory from RAM for your use and as little as
    possible into the Graphics display,


    Before you assume this means no need of monitor and keyboard ever, all the things
    you want to do with your Pi should be tested and configured in a working environment
    with keyboard, monitor, mouse, and so on, all at once. Once you have used your
    system to a state where it works without the interference, you can power on and
    off without needing to jump back in and each time you know you should be able
    to remove all the human interface devices. This is a great start for anyone: being
    able to remove all the cables and interface with your system remotely. This is
    also means you can do other things such as managing your Raspberry Pi via your
    phone or from a


