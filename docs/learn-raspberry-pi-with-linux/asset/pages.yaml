    # Apache Configuration


    Getting your head around the Apache config is, to be frank, a bit of a nightmare.
    If you''re game, go ahead and have a look in /etc/apache2 for an idea of what
    I mean. There are a number of folders in there with different meanings and how
    those folders interact how your Apache instance works. Frankly, once you understand
    where you need to make changes, everything becomes much easier.


    The first file of note in the Apache configuration is the apache.conf. This is
    the governing config file that says where of the other pieces are located, and
    how the application should load them. The second things to be aware of are mods-enabled
    and mods-available folders. If you have a look at the mods-available file, you
    will see that there are a large number of .load and .conf files. These files represent
    where Apache should load a module and any configuration information modules need,
    respectively.


    Next is mods-enabled, an initial look over this folder will make it seem like
    mods-available. However, if you run an ls -l on one directory, you will see


    ```

    $ ls -l /etc/apache2/mods-enabled/

    total 0

    lrwxr-xr-x 1 root 28 Sep 17 21:44 alias.conf -> ../mods-available/alias.conf

    lrwxr-xr-x 1 root 28 Sep 17 21:44 alias.load -> ../mods-available/alias.load

