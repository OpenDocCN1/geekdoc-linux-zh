  md: '# CHAPTER 8 ■ A LAMP OF YOUR OWN


    Once you have removed index.html and added index.php, direct your browser to your
    Apache server. Figure 8-2 will be your reward.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_177_0.png)


    **Figure 8-2** PHP info page


    This is the PHP info page, which describes the entire current configuration of
    your newly installed PHP instance. Since we are viewing it, it also proves that
    the PHP interpreter is working correctly. It also shows that index.php has been
    picked up as a default page by Apache. The code that we added to generate this
    was following:


    ```

    <?php phpinfo(); ?>

    ```


    This is a great example of PHP code; first we have the opening markers that show
    that this is PHP and to be interpreted as such (<?php and ?>) and we have a single
    function call inside to phpinfo(); that displays all our data.


    A function is reference to a predefined piece of code that we can run by invoking
    the function name. Functions with a pair of parentheses, which can contain data
    (variables that will be passed into the function for use). In addition to functions,
    PHP uses arrays, like the arrays we saw in Chapter 7. To recap, arrays are variables
    that contain number of values rather than one. An array can be manipulated as
    one array or each of its individual elements. To access the array elements, you
    need to add a pair of square brackets to the end of the array variable and the
    number of the element you wish to access. These elements start from 0 as the first
    element and increment.


    The other important things one needs to know for PHP are:


    +   - All PHP statements end with a semicolon

    - All PHP variables start with a $ sign (recall variables from BASH in Chapter
    7; PHP variables are used for the same thing)

    - All PHP array variables start with an @ sign

    - All PHP function''s internal code are surrounded with curly braces { and }'
