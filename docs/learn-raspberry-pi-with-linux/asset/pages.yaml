    by 5 tests, we will be guaranteed a number that is divisible by 3 and not by 5.
    This means we avoid the issue when we output both Fizz and FizzBuzz at once. We
    can use the new else statement here to accomplish this, so when we add the else
    to the divisible by 5 tests, we get:


    ```

    if [($number % 3)) -eq 0 ]; then

    if [($number % 5)) -eq 0 ]; then

    echo "FizzBuzz"

    else

    echo "Fizz"

    fi

    ```


    Fantastic. Now we only have one case left: when a number is not divisible by 3
    but is divisible by 5. We can do this test in another else statement of the divisible
    by 3 test. By doing this as an else statement and adding a second divisible by
    5 test, we can ensure that a number is not already divisible by 3 when it is divisible
