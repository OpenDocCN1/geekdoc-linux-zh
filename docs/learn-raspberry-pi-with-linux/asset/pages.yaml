    # Remove Data from DB


    We have one final change to make, which is adding the delete processing in the
    case statement. We can use a similar logic to the insert statement, whereby we
    create a SQL variable and then iteratively delete the remove for the idnumbers
    one after another. In this case, we will need to have a for loop that run through
    each element of the _REQUEST[''checkboxes''] variable that we can get from the
    count function being on the variable. This gives us a full for loop as follows:


    ```

    for($i=0; $i < count($_REQUEST[''checkboxes'']); $i++)

    ```


    Once we are within the loop, we simply need to pull out the $i element of the
    _REQUEST[''checkboxes''] array each time in the loop. In addition, we will need
    to add an to the end of each of them so that we will delete each of the elements
    by idnumber; we use or because we want to delete the variable if the idnumber
    is the first number, the second number, or the third, and so on.


    However, we will have one issue with the or: we will add it to the end of the
    last element that we don''t want. We will need to use the rtrim function to trim
    off the or from the end. The rtrim function will trim a given value from the right
    side of a string, which will give us the SQL we want. Finally, we perform the
    same query action as in the insert and will again check to see whether there is
    an error. This will a code block like this:


    ```

    $SQL="DELETE FROM todolist WHERE";

    for($i=0; $i < count($_REQUEST[''checkboxes'']); $i++) {

    $SQL=\$SQL . " idnumber=" . $_REQUEST[''checkboxes''][$i] . " or or ";

    }

    $SQL= rtrim($SQL, "or ");\nif ($mysqli->query($SQL)== FALSE) {

    printf("Error Unable to delete value " . $mysqli->error);

    }

    ```


