  md: 'CHAPTER 3 GETTING COMFORTABLE


    # LOOK BEFORE YOU LEAP


    This note falls under the "obvious-proven-otherwise" category. When you''re working
    with remote terminals, it is disturbingly easy to getoriented and start running
    commands on the wrong machine. If you are trying to reboot the Pi on your desk,
    you don''t want to accidentally reboot something else such as a corporate server
    (you never know where your Linux skills will take you).


    # SSH on the Mac


    If you''re using a Mac rather than a PC, you won''t be able to use Putty. That''s
    not a problem thanks to its UNIX root, Mac comes with a good SSH client built
    in. All you need to do is open a terminal window and run the SSH command.


    First, get Terminal and running. You can find it in the Utilities directory inside
    Applications. You can also find it by Spotlight (the magnifying glass) at the
    top right of the menu bar and typing in Terminal.

    You''ll find that it isn''t too different from the Terminal you were using on
    the Pi, and there''s a good reason for that. As mentioned, the Mac is actually
    based on UNIX, just as Linux (and hence Raspian). Although the Mac does a good
    job keeping its UNIX side well hidden (you can use Mac for years and never come
    across it), you might want to dig into it a bit if you find using Linux and the
    command line to your liking.

    Now Terminal is open, connect to your Pi. You''ll use the ssh command; because
