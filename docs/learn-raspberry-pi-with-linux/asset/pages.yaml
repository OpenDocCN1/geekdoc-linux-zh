  md: '# CHAPTER 6 EDITING FILES ON THE COMMAND LINE


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_123_0.png)


    **Figure 6-2.** Freshly opened nano with a new file


    We''ve connected to Pi using SSH but because nano is a terminal application, it
    will look the same regardless of how you run it. One interesting thing about these
    sorts of terminal applications is they are sensitive to how big your terminal
    is. A fixed terminal (such as the physical console) has a set screen size. When
    you connect via SSH or use a virtual terminal, you can adjust the size of the
    screen and this will cause nano to resize along with it. It makes it very flexible
    and can fit in whatever your needs regardless of size or shape of screen.


    # So What Does This All Mean?


    Nano''s screen can be a bit confusing at first (especially the bit at the bottom),
    but most of the time you''ve actually be paying attention to anything other than
    your text. In fact, all the other stuff melts away in the background. For example,
    on the top of your screen you can see that we''re running `GNU nano 2.0.9`. Until
    we came to write this book, we had no idea version of nano we were running and
    quite honestly until we had to describe it, if someone asked us to draw the nano
    layout from memory, we''d have''ve had a pretty hard time doing it. Actually,
    we wouldn''t have been able to do it all!


    There are two other pieces of information that you can glean from nano''s title
    bar. Black bar in the middle is the name of the file you''re editing. In our case,
    it''s `test.txt`. Not exactly earth-shattering, but it''s quite common to work
    on multiple windows at once, and being able to quickly get your bearings can come
    handy.


    112'
