    # First Boot


    Okay, that was a bit of a marathon, but hopefully it''s something you will only
    need to do once. Once you get the hang of it, it''s not bad; it''s just that there
    are a few moving parts.

    Armed with our freshly installed SD card, we can last boot the Pi. Plug in your
    keyboard, mouse, and monitor, and slot your SD card into your Pi. All you have
    to do is now turn on the power and you''re ready to go! All being well, you should
