  md: '# CHAPTER 2


    # Surveying the Landscape


    Although the mission of this book focuses getting you comfortable on the command
    line and really getting your hands dirty with Linux, we would be completely remiss
    if we didn''t first show you how to use the graphical interface that comes with
    your Pi. It''s not quite flashy as what you find on a Windows PC, a Mac, or even
    some Linux distributions, but it''s fast, easy to use, and we will do all the
    things you''re used to. And, of course, it''s all on a device that fits in your
    pocket and draws less power than the monitor or TV it''s connected to.


    We start off this chapter by looking around the desktop and seeing what interesting
    things we have to play. Some are obviously useful applications in their own right
    and are probably less useful at this stage (for the Python development environment
    won''t be much of interest to you unless you''re programming in Python). We''ll
    then through the various menus and have a look at what we find.


    # Welcome to LXDE


    Unlike Windows, Linux isn''t integrated with a particular GUI; it uses a server-and
    it uses a application (a client and a server, in this case) to provide one. This
    application is known as the X-server and used to be far the most complicated in
    the Linux universe to set up. It has gotten a lot better, not too long ago, great
    time and effort needed to be if you wanted to use the scroll wheel in that mangled
    mouse of yours. Needless to say, the fun of that wears out pretty quickly. The
    days, the X-server is almost a black box and rarely do you need to touch it. For
    we go into more depth on that in this book, but if you''re a bit curious to find
    out more, check out http://en.wikipedia.org/wiki/X_Window_System.


    It''s not just the Pi that carries-something—computers of just few years ago could
    run Linux, but started with new high graphical interfaces. When you consider older
    machines that would often get thrown out, a suitable display manager could easily
    manifest as a perfectly useful GUI. There''s still more to it; modern networks
    are low-power with high efficiency for battery consumption as well as cost. They
    benefit from a minimal desktop.


    When you need to stretch your processing budget, the best place to cut corners
    is in the feature set of the graphical interface. Do you really need all those
    fancy features? Are transparent windows essential to do what you''re doing? Do
    you really need that 3D-rendered clock? And if you want to cut some, a desktop
    environment as LXDE will be right up your street.'
