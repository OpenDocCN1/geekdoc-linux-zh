  md: '# CHAPTER 8


    # LAMP of Your Own


    The kind of things many people who come to Linux want to know is how to establish
    themselves by setting up a small website of their own. And many have difficulty
    finding a place to start. Which OS, applications, what hardware, and how exactly
    to do all this? All are legitimate questions as there are so many facets of the
    greater Linux environment that it is very easy to get lost.


    Our goal is to provide the first few stepping stones on your way to being able
    to navigate the Linux environment. One of the key stepping stones on this path
    is to show how to install, configure, and maintain a web server. Although you
    will be able to connect this server to the Internet, in examples we will only
    cover using your Pi as a local network server (in other words, for running an
    intranet). In addition, there is also the extra challenge of learning how to make
    a basic interactive website. While this may seem a lot to take on, and others
    devoted entire books to finding the absolute optimum to this problem, we cover
    it for the Raspberry Pi in one chapter.


    To end we will use a LAMP: No, not one of our bedroom luminescence devices, but
    a Linux, Apache, MySQL and PHP system designed to make delivering web content
    easy. This is one of the easiest ways to create your own web server and there
    are a variations on the original LAMP, which include, but are not limited to:


    +   - WAMP (Windows, Apache, MySQL, PHP)

    - LAMP (Mac OS, Apache, MySQL, PHP)

    - Replacement Ps with Python or Perl

    - Replacement M with MariaDB


    So, as you can gather from the amount of mixing, matching, and improving that
    people have done, it is a great way to get a powerful web server and going. Best
    of all, it is simple to set up and can be run on just about any hardware.


    One of the most regularly cited potential uses of the Pi is to enable the ability
    to build, run, and maintain a website. What better way to inspire a generation
    of young developers than to teach them how to make their own websites with a minimum
    of cost!


    # First Steps


    Now it is time to get real about what we can accomplish. Within this chapter,
    we will provide you the skills to set up a full website stack and show you how
    to integrate the functions of a MySQL database into a website using PHP to dynamically
    generate content. However, there are a few things we won''t be able to do for
    you here:


    +   - Set up and configure a DNS or domain naming

    - Advanced SQL and database administration

    - Full coverage of HTML and HTML development methods'
