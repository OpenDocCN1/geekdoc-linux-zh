    # Summary


    This chapter has taken you from getting your hands on your Pi all the way through
    getting it up and running. We deliberately took it slow and covered all the basics
    as it''s always the so-called simple things that trip people up (included!). We
    looked at what we found (and more importantly what doesn''t) and provided a shopping
    list of all the things you''ll need to make it your Pi.


    We thoroughly touched on Linux—what a distribution and why we decided to stick
    with Raspian for this book. We then covered how to download Raspian and get it
    on your SD card (which turned out to be much more than we first thought).


    Armed with a fully loaded card, we fired up the Pi and walked through the initial
    setup and configuration process that ultimately ended with us looking at the very
    pretty Raspberry Pi logo in the middle of an equally impressive desktop.


    In the next chapter, we''ll start to explore your new desktop. We give you a quick
    tour of what comes with Raspian out of the box, and we finish up by showing how
    you can tweak and customize it to suit your needs.


