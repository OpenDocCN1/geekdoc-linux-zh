    (lo or to it) is a virtual interface that applications can use to talk to each
    other on the same machine. Because no hardware is involved, it is more efficient
    to use the lo interface as it is being available and configured in the same way.
    Under Linux, most services (such as printing and the GUI) operate as client/server
    applications and make extensive use of this interface.


