  md: '# CHAPTER 8 A LAMP OF YOUR OWN


    +   - Full coverage of PHP development and PHP development methods

    - JavaScript

    - CSS


    There are a number of resources that you can take advantage of to get help with
    these other areas, including great and weighty texts by Apress. We still have
    our work cut out for us, so let''s get started.


    # L is for Linux


    There are only a few prerequisites for setting up a LAMP stack. You will need
    to


    +   - Have the Raspberry OS (the L of LAMP) installed and configured

    - Have the memory split to 240/16 (run sudo raspberry-config)

    - Be familiar with working within the Raspberry OS using the command line

    - Have a basic understanding of how to write simple software

    - Have your Pi connected to a network and the Internet (how else can we serve
    content if we aren''t?)


    There are only a few others for Raspberry LAMP. We will be doing all of this from
    a shell. Given that the website will be viewed outside the Pi, there is no need
    to use any extra resources to run the GUI. Now that we know what we need to get
    going, let''s do it.


    # A is for Apache


    Probably the most important part of any web server is the web server application.
    A web server is an application that will take requests for a website and return
    the requested web page content. Most web servers can provide a large number of
    functions that can enhance their capability to provide content to end users. For
    our LAMP stack, we will be using the Apache web server.


    Apache is considered by the world''s premier web server. It was first released
    in 1995 and has become renowned for playing a role in the growth of the World
    Wide Web by providing a simple, powerful, and free web server to the masses.


    As reinforcement of this fact, it is estimated that Apache delivers between estimated
    54 to 58 percent of the world''s websites.


    There are two stories about how Apache came to be named:


    +   - The first is that it was named for it "A patchy web server" when first developed
    all years ago.

    - The second (and much better from a storytelling perspective) is that Apache
    is said to be named for the Apache tribes of America.


    Being named for a tribe is not a misnomer as acting tribe is one of the key features
    of Apache. Apache''s website''s content: Now that it starts to create its own
    small tribe of "workers" that are tasked with the actual setting up of your Apache
    installed, up and running.

    For our installs, we will rely (as ever) on the ever-faithful apt-get tool:


    ```

    $ sudo apt-get install apache2

    Reading package lists... Done

    Building dependency tree

    ```


