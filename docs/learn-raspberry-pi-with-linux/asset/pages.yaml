- img_proc: true
  md: 'Unfortunately, apt-get cannot fix this, so you have to get it by downloading
    the module from the Perl CPAN library (which is like a giant apt-get repository
    for Perl software that can borrow and install it). Then you can use apt-get to
    download it from the Internet. Use the following command:


    ```

    $ wget http://search.cpan.org/CPAN/authors/id/N/NJ/NJH/Net-SDP-0.07.tar.gz

    --2012-09-30 19:01:11-- http://search.cpan.org/CPAN/authors/id/N/NJ/NJH/Net-SDP-0.07.tar.gz

