  md: '# The Raspberry sPi


    Everyone wants to be James Bond. Or at least I know I. He seems to get into all
    sorts of situations; then whips out a handy gadget to save the day. The Raspberry
    Pi is, as we have shown, supremely versatile for such a tiny piece of hardware.
    This makes it the perfect tool for a secret agent because with just a bit of energy
    you can provide a fully-fledged technological solution at a fraction of the expense
    of employing John Cleese (admittedly the Pi is not as funny). So, with this in
    mind, we can now don our tuxedos and get down to secret agent business.


    All good secret agents know that you need to be able to detect and be alerted
    to intruders in your secret hideout. So makes it the perfect time to introduce
    you to the Raspberry sPi! The Raspberry sPi is a combination spy camera and alerting
    system, the perfect solution for spotting dastly intruders into your inner sanctum!
    Or for monitoring your pets over the Internet. The basic concept here is that
    we will be configuring your Raspberry Pi. So without further ado, let''s get started.


    # Materials Needed


    Here are the materials needed for this project (also shown in Figure 10-1):


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_209_0.png)


    Figure 10-1. The Raspberry sPi kit'
  merge: -1
  pgno: 209
- img_proc: true
  md: '# CHAPTER 10 THE RASPBERRY SPI


    +   - 1x Raspberry Pi

    - 1x Micro USB cable (for power)

    - 1x Ethernet cable

    - 1x USB webcam

    - 1x SD card


    At this point, you should note that no webcams are compatible with the Raspberry
    Pi. This document was created with a Logitech C525 Webcam. Thankfully, the Pi
    community maintains a list of compatible hardware, which is available at http://elinux.org/RPI_VerifiedPeripherals#USB_webcams.
    If you are in doubt, please check there to see which peripherals will work with
    your Pi.


    # Presetup


    Nothing special here just attach your USB webcam for power, attach the Ethernet
    for network access, attach the SD for storage, and make sure you leave the camera
    unattended—we will do that. The rest of this process assumes you are familiar
    with the:


    +   - Installing the Debian OS

    - Knowledge of how to work within a Raspberry Linux environment


    If you''re familiar with either of these two, that''s perfectly okay. That''s
    what this book is for after all, so please go back and read Chapter 1 to get started
    with Raspberry and Part 2 of this book to gain familiarity working in a Raspberry
    Linux environment.


    # Getting Started


    So, without further ado, let''s get started. Go ahead and loop up Raspberry and
    connect your Pi to your network. Go through the Raspberry setup procedures and
    make sure to enable SSH because you will need to remote in linux. (We don''t see
    James Bond carrying around a keyboard, HDMI cable, and a monitor, do we?) Once
    you are set up, go ahead and SSH into your Pi (covered in Chapter 3).

    Once, okay you''re logged in, go ahead and issue the command dmesg and have a
    look at the output.


    # dmesg


    The dmesg command is a tool called a driver message that shows a logged output
    of all the messages to the kernel, which includes messages from devices and the
    drivers that are attached to them. dmesg is incredibly useful in determining which
    devices are attached, and where and how you should interface with them. It also
    lists driver and kernel messages that are incredibly useful when diagnosing low-level
    problems. So, let''s have a look at the relevant section of the output.


    Note less is more. If you find that the output for a command is running over the
    top of the screen and you can''t see it anymore, reissue the command and pipe
    it to less (i.e., dmesg | less). This would allow you to navigate the output of
    any about command using the arrow keys and spacebar to page down.'
