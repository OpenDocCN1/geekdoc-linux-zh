  md: 'LXDE (short for Lightweight Desktop Environment) was designed for machines
    in which energy efficiency and the need to run on hardware at the lower end of
    the performance spectrum was critical importance. It aims to be efficient in terms
    of CPU cycles and memory usage, and although some window managers esche unnecessary
    features, LXDE tries to remain full of features at the same time.

    Although we now know that the GUI is made up of a lot of moving parts, LXDE is
    mostly transparent when used. There is really no harm in thinking of LXDE as the
    main environment for your Pi and if you plan to spend most of your time using
    the GUI, we feel there''s no harm in considering it a core part of the operating
    system. You can simply use it and accept it as being available. With that in mind,
    let''s move on to exploring what we actually have when we are using LXDE.


    # What Do We Have Here?


    Once you''ve installed and set up your Pi, and you''ve powered it up for the first
    time, you should be left with a screen that looks like Figure 2-1.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_44_0.png)


    **Figure 2-1.** First boot of your Pi


    How the icons are laid out really depends on the screen connected to your Pi.
    It should look pretty similar; the only real difference is how the desktop icons
    are laid out. Raspbian is constantly being improved by the developers, it''s possible
    that you will see new icons or perhaps some replacements.


    For simplicity (not to mention the fact that they have become common idioms) we''ll
    refer to various GUI elements by the name that most people are familiar with.
    Thus we will discuss the start menu and taskbar. Let''s start with the bottom
    left of the screen.'
