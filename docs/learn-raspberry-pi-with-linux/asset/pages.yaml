  md: '# Summary


    In this comprehensive chapter, you installed a whole course of precursor applications
    and learned how to download source code, configure it, and compile from it. This
    is quite a lot of work and the XBMC compile took in excess of 12 hours!


    You also created and installed start scripts to get these new media playback systems
    to run on the Pi at boot, avoiding the need to manually intervene.


    Finally, you connected the XBMC instance to the remote control application for
    smartphones. This has been an incredible amount of work for one chapter, so well
    done!'
