  md: '# WiPi: Wireless Computing


    One of the biggest advantages of the Raspberry Pi is that it is tiny and can fit
    in just about any small nook or cranny you care to think of. This is why it is
    constantly touted as a great choice for people to use when designing—it can be
    placed just about anywhere and, with the right peripherals, can do almost any
    task. Additionally, its low power consumption means that there is less of a barrier
    to its usage in these situations as it doesn''t need a large amount of electrical
    plumbing to “just work”. Which is to say Raspberry Pi is a super tiny machine
    that provides a monumental bang for your buck!


    However, this is not without some strings attached (see 9-1). All that power is
    for without a small supply of external electricity. While 5 Volts isn’t much,
    it does need to somehow magical enter your Raspberry Pi to turn the lights on.
    In addition to requiring power, the Pi is almost useless on its own as there is
    little you can do with the Pi on 5 volts beyond making the power LED on and off.
    You need to attach devices to make the Pi useful. As a simple home computer you
    need the following (at a minimum):


