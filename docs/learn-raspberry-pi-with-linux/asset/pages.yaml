    # Fully Qualified and Relative Paths


    In Linux, there are two ways to specify a fully qualified path to a file or directory:


    +   * You can give a fully qualified path that starts with a forward slash

    * You can give a relative path that starts with a filename, directory name, a
    dot, or two dots


    Strange these might sound, they are just ways of providing a specific location
    to your programs.

    A path is fully qualified when it starts from a fixed reference point (i.e., the
    root directory). Regardless of where you are on a system, a fully qualified path
    will always point to the same location. It is the bell tower in the middle of
    the town; if you give anyone directions using that reference point, you have a
    common anchor that both you and your friend know how to reach.

    The other hand, a relative path depends on your current location to make sense.
    You can specify paths using ./ to mean the current directory or .. to mean the
    parent directory (the one up from the current location). If you had a path like
    ../../text.txt, this would only work from a few specific locations (where the
    file is two levels above your directory). It''s not as short or as easy to type.
    Of course, the same file we were created (in the directory) would be accessible
    with /home/pi/text.txt, unlike the relative path, which could be tricky. Relative
    paths can be tricky when you''re several levels deep and you''re not sure where
    you are, but you do know the full path of the file. If you are in /home/pi/Documents/work/Projects_2012/spreadsheets/
    and you want to access test.txt, you could use either the full path or alternative
    ../../text.txt. As you can see, in this case, the relative path is more confusing
    than the fully qualified path.

    So when should you use one or the other? Use whichever option is most convenient
    or makes the most sense for the task. Sometimes it''s faster or easier to use
    a fully qualified path. Other times, you will be buried deep in the tree, and
    writing fully qualified paths would be tedious and totally confusing at worst.


