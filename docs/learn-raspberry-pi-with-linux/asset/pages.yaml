  md: '# INTRODUCTION


    form ARM in almost every modern cellphone including the iPhone 4 and Samsung Galaxy
    S3. In fact they are one of the most used processors in the world and can be found
    in all manner of devices as DVD players, appliances, and even cars.


    ARM CPUs generate very little in the way of heat. If you look at the Pi itself,
    you will notice the CPU doesn''t have a heatsink. If you look at any Intel or
    AMD CPU, you can''t fail to miss the huge fan that it requires in order to prevent
    it burning out. Some people use water cooling systems to keep their PC processors
    running at a reasonable temperature.


    The last benefit is really a costly-to-performance ratio. For the vast majority
    of things, the bottleneck is not CPU power but how fast data can be fed to it.
    CPUs much faster than hard disks, and even the bus that links all the components
    together can''t keep up with an even medium CPU. So what do you get out of this?
    A low-cost processor that almost certainly do everything without the cost penalty.


    # WINDOWS 8 ON ARM


    Early last year, Microsoft announced that Windows 8 would support ARM processors.
    This is not overly surprising as ARM is present in practically every modern mobile
    device; and with the performance of the end chips gaining significant growth on
    Intel and AMD offerings, it probably won''t be long before we start to see powerful
    desktops being powered by these beasts.


    Microsoft long dominated the PC market regardless of who should be leading the
    way; everyone agrees that ARM is far from done. Of where Microsoft leads, others
    will follow. If Microsoft starts the ARM platform directly, it won''t be long
    before hardware manufacturers start providing the necessary drivers and support
    for their devices. Game developers will also need to pay attention to ARM-based
    platforms and could create some very interesting challenges and compromises


    What does it mean for your Pi? Well, you won''t be able to run Windows 8 on it;
    it isn''t built with that in mind, but it does mean the technology underpinning
    the Pi is not based on old bits and pieces found at the back of someone''s bottom
    desk drawer. Rather it is quite possible on the platform of the future!


    # 512MB of RAM


    The B Pi comes with 512MB of RAM (originally 256MB, which changed to 512MB in
    October 2012), which is shared between the Pi and the Graphics Processing Unit
    (GPU). Now that considering the laptop I''m using to write this 8GB of RAM, my
    desktop has 16GB (that is 32 and 64 times, respectively), and it sounds a little
    weird. What can you really do in 512MB of RAM? Or even 256MB if you have a Model
    A or an older Model B?


    Well the answer is to a lot more than you think Remember, 95MB was enough to operate
    a PC like the Pi, and the good old Commodore 64 came with only 64KB (the Pi has
    something like 4,000 times that) and it was able to run games of elements to the
    imagination.


    So we have so much memory in new machines? Memory is cheap these days, and we
    could do lots of stuff in very little memory, a skill that has gone out of fashion.
    Why so much effort on optimization memory when it will matter never? If 8GB of
    RAM costs $50, is it worth hours if not days of a programmer''s time to save a
    few megabytes here and there? Probably not.


    Remember, the Pi is meant as an experimentation platform, not as a general PC
    replacement, Linux (especially without a GUI) will run with plenty of memory to
    spare for all your programs. By keeping the memory to a reasonable minimum, the
    Pi is able to hit its price point without greatly limiting what you can do with
    it.'
