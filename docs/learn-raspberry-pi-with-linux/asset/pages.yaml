    # Security and User Management


    Security is one of the most neglected areas of systems administration. Because
    it is perceived as a black art to many, it often gets neglected.


    # The Rules of Raspian Security


    There are some very simple ways to make your system secure; just if you must,
    just follow a few rules:


    +   - Don''t log in as root, but if you must, just log out when done.

    - Use sudo whenever possible for admin tasks.

    - Choose a nontrivial password—one that is long and complex enough that it cannot
    be readily guessed or worked out without taking a long time.

    - Change your password regularly.

    - Review your system logs regularly, specifically /var/log/auth.log because it
    lists all user authentications to your system.

    - If you don''t need an application running, don''t run it.

    - Expose as little of your system to the Internet as possible.

    - Restrict file permissions whenever possible.


    Most of these rules will seem like common sense and that is because they are.
    Yet most people seem to fall into the trap of thinking that they won''t be attacked
    and ignore most of this advice. Now that you know these rules, you are probably
    saying, "I will change my password if only you would show me how! Changing your
    password from the Linux command line is relatively easy: simply use the password
    command and you will be prompted to enter a new password (twice, so that you can''t
    misspell it by accident the first time).'
