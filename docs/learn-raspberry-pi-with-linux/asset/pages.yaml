  md: 'As, the majority of the second section of this book is all about the command
    line and getting you comfortable using it. Although things have improved somewhat
    in the intervening decades, the technology is basically the same.


    In this chapter, we take a quick look at the history of computer interfaces and
    why the terminal has served as well as it has. We''ll then look at the various
    terminals available to you and how you go about getting to them. We''ll then explain
    the command prompt and let you in on a little-known secret about the different
    shells that are available.


    # # Ye Old Computer


    Although you can now literally buy a computer for $25, in the ''70s you could
    expect to pay at least 100,000 times that for a computer with any serious amount
    of processing power. Such machines would take up entire rooms (if not floors),
    require incredible amounts of power, and generally look impressive to passersby.
    A key problem that these things had to deal with was one of scale.


    When your computer is worth than the building it is sitting in, you want to make
    sure that you get the most out of it. One approach to solving the challenge was
    use time-sharing. The idea was that with a human interacting with the computer,
    the computer was incredibly fast. In fact, even though these computers were poor
    by today''s standards, they could still run around the people who were actually
    trying to use them. So this begs the question: if the computer is spending some
    of its time waiting for the operator to enter commands and data, couldn''t it
    be doing other things while it waits?


    It wasn''t long before someone figured out that the computer sits waiting for
    input, it could be better utilized with more than one person entering data. That,
    multiple people could enter data at the same time, and we''re no longer limited
    by the speed of a single person.


    Great, but how to carry it out? To make it, we''d really want to put a screen
    in front of everyone who needs to talk to the computer and with the available
    computer technology, even a very basic computer would be impractical. Again, but
    we didn''t really need a computer on their desks; we just needed a way for them
    to communicate with the big computer downstairs. In effect, we just want a keyboard
    and a screen with very long cables.


    # # Say Hello to the dumb Terminal


    This is where the dumb terminal comes in. It was called a dumb terminal because
    it was quite literally just a screen and keyboard. Using instructions relayed
    from the computer it would draw the text onto the screen. When a key was pressed,
    it would be sent to the server that would then reply with updates for the screen.
    The dumb terminal didn''t have any real processing capability; it was just an
    interface and that interface was very cheap and easy to install and maintain.


    The technology improved over the years, and the dumb terminal became "dumb." Support
    for different colors and brightness was added, as were fancy features for redrawing
    and managing the screen. However the concept of the dumb terminal just being a
    machine never really changed all that much. In fact, although dumb terminals started
    to be replaced when more modern networks became available (not to mention computing
    power became much cheaper), the approach continued to be used in the newer systems.
    It wasn''t just because there was a legacy of systems that people had to keep
    using (ever see the old green-on-black screens in big department stores?), but
    it actually had some useful properties that continue to be useful even today—properties
    that we''ll go into once we see what a modern terminal looks like.'
  merge: -1
