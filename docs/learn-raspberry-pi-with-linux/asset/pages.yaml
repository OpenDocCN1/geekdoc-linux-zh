    compatible. In many ways, scripts that you might write for version 2.x of Python
    will work just fine in 3.x, but there are quite a few gotchas and changes in the
    language that make guaranteeing compatibility impossible. This is why you''ll
    often see two versions of Python installed on any given machine.


