    # The Boss


    Root is a word that describes the base of a tree, something from which all the
    rest grow. In Linux and UNIX, the term is used to denote the start point of a
    filesystem (as we saw in Chapter 4) and to denote the master administrative user
    on the system (covered briefly in Chapter 3). To perform any system or administrative
    function, you need to be permission to change core functionality. Because of this,
    root is very much two-edged sword: unlimited power to change your system and unlimited
    power to break system functionality. One of the true things I can say about working
    in a Linux environment is eventually you will issue a command as root that will
    break something (if not everything) and this will cause you no end of hassle or
    may require you to reinstall your operating system. For this reason (and related
    security reasons) it advised a user never actually log to the shell as the root
    user.


    To solve this problem, which we''ve seen a little of in Chapters 3 and 4. As you
    know, this is a wrapper for any shell command that you think of. If you prefix
    a command with sudo (e.g. sudo ls), you will no longer be executing this command
    as your user but as the root user. This means working as the root user is slightly
    more complex, but also far less risky. Many distributions of Linux no longer set
    a root password, but rather assign you the power of sudo on creation. This means
    that all administration must be done by an empowered user with the sudo command
    to issue all the requisite admin functions.


    So that you can execute as root, sudo requests your password in order to validate
    that you are who you say are, not just with access left unattended. In addition
    asking all users for their passwords, sudo also has a steering file that governs
    which users and groups have access to the sudo command and the capability to limit
    which programs they can execute via sudo. There is a special command, visudo,
    to edit (the sudoers file) that must be run as root (prefix with sudo):


    ```

    $ sudo visudo

    ```


    This code fires up a special instance of your system''s text editors (normally
    vi or nano) with the sudoers already loaded to be edited. For a quick rundown
    of how to use vi and nano, please check Chapter 6.'
