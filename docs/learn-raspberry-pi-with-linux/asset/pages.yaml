  md: '# CHAPTER 8 | A LAMP OF YOUR OWN


    Assuming your server is (like mine) attached to a network, you can use the first
    IP address (10.0.0.20). This address in the eth0 block represents your network
    port. The address in lo block is the loopback address, which is used for internal
