    These blocks provide a few bits of description and say for which application they
    provide a function; in this case: the application provided is XBMC. They also
    mention what applications are needed to be running before this application can
    start or stop. The $all symbol means that this application will be started, so
    that it is guaranteed that all other applications on it can depend be started
    before it. Probably the most important set of operators are Default-Start and
    Default-stop. These operators correlate with the Linux system''s run levels, which
    govern various stages of the Linux system process.


    The Linux specification defines the following run levels:


    +   - Level 0: Halt; shut down and power off

    - Level 1: Single User Mode; only basic system functionality (used for repairs)

    - Levels 2 &3: Multi User; ads networking and multiple user functionality

    - Level 4: User Defined

    - Level 5: Normal system running

    - Level 6: Reboot


    The next numbers to the start and stop switches correlate to these levels, which
    XBMC will start in run levels 2–5 and will shut down in levels 0, 1, and 6.


