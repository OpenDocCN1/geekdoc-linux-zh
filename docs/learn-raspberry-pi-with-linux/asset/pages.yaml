    # Wrapping Up nano


    That''s all we''re going to cover for nano as you can see, the limited amount
    of functionality we''ve covered already given you the ability to edit configuration
    files or compose your own. Nano is great for these kinds of tasks where you don''t
    want distractions and just get the job done. As it happens, a good deal of this
    book was written in nano, so it just goes to show that this is certainly not a
    toy! That being said, let''s move on now to look at what the vim editor can offer
    you.


    # Getting Started with vim


    Vim is a bit more advanced than nano. Whereas nano was specifically designed to
    be simple, vim is designed to be a fully featured environment for doing all tasks.
    When you integrate other applications (such as the shell and source code control)
    directly with vim, you can do amounts of work without ever leaving your text editor.


    The downside to this power is that you have to learn how to use it. Unlike nano,
    which is basically ready to use away, vim has the concept of modes. Generally
    you''re be either in normal or insert modes, and they are the ones that you''ll
    focus on in this section.


    However, we want to point out that even we use vim on a regular basis, we''re
    not what we would call experts. We know how to use the functionality that helps
    us with our work, but there are many features that we don''t even know about.
    this is just a primer on vim, we don''t feel that this is an issue, but if you
    think vim is the tool for you, there is a wealth of books dedicated to vim as
    well as numerous video tutorials on its more advanced and powerful features.


    Rather than having to type in another poem, let''s give Mary an encore and bring
    her back to the stage with vim. First, we need to install it:


    ```

    $ apt-get install vim

    ```


    Now that we have vim, let''s be about that encore:


    vim test.txt


    Needless to say, starting vim is as straightforward as starting nano, but it does
    look a little different once it started (see Figure 6-12).'
