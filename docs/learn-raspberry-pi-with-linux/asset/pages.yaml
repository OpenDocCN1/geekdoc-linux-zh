    As you can see, the human flag has changed to a little leaf on the denoting unit.
    Ending with display flags is a great way to make sense of some of the complex
    data coming out of Linux commands. You will find a huge section detailing (in
    too much depth) all the flags for a command in its man page.

    So, we have the full disk utilization of the system, but let''s say we want to
    find the detailed utilization of the files in a folder. There is another command
    we can use to do this: du, which is short for disk usage and is used to summarize
    the disk usage of each file, recursively for directories. If you run it, it will
    tell you what the estimated usage of each file within this folder is and for each
    subdirectory item within and its subfolders, and so on. will also take advantage
    of the -h for human flag that was in df. So if we run it, we get an output like
    this:


    ```

    $ du -h

    4.0K    ./cache/dconf

    12K     ./cache/memus

    576K    ./cache/midori/web

    4.0K    ./cache/midori/thumbnails

    24K     ./cache/midori/icons

    608K    ./cache/midori

    4.0K    ./cache/openbox/sessions

    12K     ./cache/openbox

    640K    ./cache

    12K     ./dbus/session-bus

    16K     ./dbus

    5.0M    ./tor

    12K     ./ssh

    1.8M    ./python_games

    8.0K    ./dillo

    20K     ./vnc

    4.0K    ./gvfs

    124K    ./.gnupg

    ```'
