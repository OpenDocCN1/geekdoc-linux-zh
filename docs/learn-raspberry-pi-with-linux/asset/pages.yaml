  md: '# Interpreted versus Compiled


    This brings nicely to the next point of: interpreted vs. compiled languages. For
    these purposes, you won''t need to have a deep knowledge of compiled languages,
    but it is always good to know that they exist and to be aware of some of the differences
    between an interpreted language and a compiled language. While both sets of languages
    allow you to write your programs for the computer to execute, they go about it
    fundamentally different ways.


    Interpreted languages (sometimes scripting languages) write down a series of programmatic
    commands that are fed to an interpreting engine (as given by the shebang, for
    example) that extrapolate their computational meaning and perform the functions
    that the program executes. This is the pen-and-paper equivalent of a recipe for
    a cake, where you write down the exact method for to make the cake, and the interpreter
    cooks it for you and outputs tasty delicious cake.


    +   This recipe nature is also much like a script for a play that as long as you
    have the script and can read it you will perform the actions each time. This is
    why interpreted languages are often known as scripting languages: their output
    is a collection of text that can be used to create the programmatic output same
    each time.


    Compiled languages take a different approach. They also have a recipe (called
    source code), but instead of the recipe running, it will be taken to a specialized
    piece of software called a compiler that will take the recipe and create an executable
    package (called a binary) from it. This binary package is written in the computer''s
    machine language so when executed it performs all the plans for a specialized
    cake-making system and then installing it in your system and having the cake.
    In both cases you get cake, but the interpreted may take a little longer to make
    the moment you go. The flip side of this is that creating the specialized cake-making
    machinery takes much more effort. Now you should understand why I said languages
    like C are overkill for small problems—C is a compiled language.


    # Output in BASH


    Back to our application: if you were to save and run your program, it would not
    do anything for you. The first order of business should be to make your program
    output something. This is accomplished with the echo statement, which is available
    from your command prompt shell; you use echo to make the system output given set
    of text. So let''s add an output to your script to have say hello to everyone
    there in the big wide world. Modify your script so it looks like:


    ```

    #!/bin/bash

    echo "Hello World!"

    ```


    Now go ahead and execute your script; to do, you will need to change the script''s
    file permissions to allow it to be executed. My script is called fizzbuzz.sh,
    the commands needed to make it executable and then to execute it are these:


    ```

    $ chmod +x fizzbuzz.sh

    $ ./fizzbuzz.sh

    ```


    This code will generate the following output:


    Hello World!'
