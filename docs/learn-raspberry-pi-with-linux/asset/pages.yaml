    # True WiPi with WiFi


    From your early work with VNC and SSH, you will come to realize that in handling
    input devices, you have increased the dependency on your network connection. This
    dependency comes in the form of management because you cannot interact directly
    via keyboard or monitor; you need to have another access method: the Ethernet
    network connection. Of course, this is still a wire, so you may well keep the
    input devices, right? There is a very obvious solution here—WiFi—but to the chagrin
    of many people the Raspberry Pi doesn''t come with WiFi on the board itself. You
    will need to go out and purchase a wireless adapter for your Pi if you wish to
    use one.


    Okay, simply enough, and go down to the local computer store to pick up a wireless
    adapter. Look around and urged. There are so many wireless adapters available!
    So which of the dozens is best for the WiFi will even work with the Pi? While
    most people would intuitively go and pick the cheapest that will fit in their
    WiFi setup at home, this is not the right thing to do as there are other factors
    at play.


    First, all USB devices require power, and as you are aware, the Raspberry Pi runs
    on 5 volts of power. This means you will need to get a wireless device that runs
    on a lower amount of power (if you place too much draw on your Pi''s USB can crash)
    or you will need to invest in a powered USB device that connects to an external
    power source (not good for your purposes, but I will cover this later because
    there are other uses for them). You need to be mindful of you also need to be
    compatible as some of the stranger wireless adapters may not support with Linux
    systems. I have included some data from the Raspberry Pi community on their experiences
    with various adapters to supplement my own.


    As you can see in Figure 9-3, I chose to use a D-Link DWA-131 wireless adapter
    purchased from my local tech store. The rest of this example will come some of
    the basics of getting your Pi to communicate with your local wireless network
    using the DWA-131.


