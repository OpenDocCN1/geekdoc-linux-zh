  md: '# Down to One


    Congratulations, you are on your way to a fully wireless Raspberry Pi! You have
    successfully removed the need for an Ethernet cable and you can now access your
    Pi wirelessly. It should now be down to just one cable! (See Figure 9-10.)


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_207_0.png)


    Figure 9-10. Last cable for Power


    # Removing the Need for Power


    There is very little you can do to shortcut the need for your Raspberry Pi with
    power; it needs it, and there are only a finite number of solutions to this problem.
    By far the most easy and convenient is to get a large USB battery. These are available
    just everywhere these days for charging any of the many devices people commonly
    carry on the go. The simple solution here is to attach your Pi to one of these
    batteries for use because this kind of battery should guarantee the correct level
    of power output to your Pi—as they are designed to power USB devices. The important
    thing when looking at batteries to power your Pi is to be certain they can provide
    the full 1 amp of power, as some USB batteries are okay for charging but don’t
    pack quite enough juice to power a Pi. Figure 9-11 shows the final WiFi.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_207_1.png)


    Figure 9-11. WiPi at long last!'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'There are a few hacks out there with a combination of rechargeable batteries
    and solar panels, which will go much further for you, but those are well beyond
    the scope of this book.


    # Powered USB Adapters


    I mentioned earlier that if you place too much draw on your Pi''s USB, you can
    crash it as it has got a limited power supply of its. The solution is to get your
    hands on a powered USB hub. These powered hubs normally have one connection out
    and a number of connections in and will also have a mains connection which to
    supply power. The principle with this is that people rarely use the full data
    transmission volume of a USB but will run out of power, so having a way to supplement
    the power of a USB device with a mains power source is a good way to give people
    more flexibility with their devices. If you find that when you attach your device
    Pi switches itself off, it''s a fair bet that you will need something like one
    of these to help spread out the power load (see Figure 9-12).


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_208_0.png)


    **Figure 9-12.** Powered USB hub in action


    # Summary


    After all that work, you should have seen a large payoff. You should now know
    how to configure your Pi to make it wireless. You should be able to set up and
    connect to your Pi via a VNC client in addition to the normal SSH connections.
    You have learned how to configure your Raspberry Pi to take a wireless adapter
    and attach it to your existing wireless network. Finally, you should be aware
    of some of the limitations of your Pi with regard to power consumption and how
    you can resolve these issues.'
