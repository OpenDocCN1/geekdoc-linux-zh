  md: '# CHAPTER 1 YOUR FIRST BITE OF RASPBERRY PI


    Figure 1-23. Select your country or city


    # Allocating Memory


    The memory_split option needs a bit of explanation. The CPU (for central processing
    unit) and the GPU (graphics processing unit). The CPU is responsible for the general
    running of your machine, and the GPU is responsible for handling the display and
    provides features such as 2D and 3D acceleration as well as hardware support for
    decoding high-quality video streams. A GPU is dedicated to handling graphics (for
    the most part) and cannot perform the role of a CPU. However means that if the
    CPU can offload all complex graphics to the GPU, the Pi needs to be so powerful.
    By having both, the Pi keeps the costs and power requirements low but without
    sacrificing much in the measure of performance.


    So far good; but what does that have to do with splitting memory? The Pi has 256
    MB of RAM in total and needs to supply both the CPU and GPU. As the GPU is effectively
    an independent unit, it needs its own allocation of memory. Rather than having
    dedicated memory for both, it is possible to split the 256 MB into two. By default,
    the Pi allocates 192 MB for the CPU and 64 MB for the GPU. This is ideal if you
    want to use the Pi as a server or you need to attach a display to your Pi. If
    you''re not using graphics, allocating additional memory to the GPU is somewhat
    pointless.


    On the other hand, if you want to use your Pi as a desktop computer or to display
    high-quality movies, you''re going to want as much memory allocated to the GPU
    as you can get away (in the case of the Pi means splitting the middle and having
    128 MB for each). It would be difficult to anticipate how everyone will want to
    use their Pi, and adding more memory to the itself (and raising the cost) is no
    easy solution. Fortunately we have the ability to choose how we want to allocate
    the memory ourselves.


    For general usage and “getting started”—type, we recommend splitting the memory
    192 MB/64 MB. To set this up, select the memory_split option from the menu, press
    Enter, and you''ll have something like Figure 1-24. In the memory menu select
    the type that you want and press Tab to highlight the OK button and then press
    Enter.


    27'
