    Receiving objects: 100% (35172/35172), 15.28 MiB | 35 KiB/s, done.

    Resolving deltas: 100% (15265/15265), done.

    ```


    Now that we have cloned the source code of XBMC, we need to start building the
    application. This is the part that

    will take the longest for. Change into the newly created xbmc-rbp directory because
    there are a few last

    steps we need to take.


    # Changing Files with Sed and Regular Expressions


    Before we go and kick off of our XBMC application, we need to make a few adjustments
    to

    the source code so that it compiles in the exact manner we want it to be. Instead
    of making these changes by hand, we

    will use a tool Sed (for Stream Editor). It just as its name implies: it treats
    a stream of text and

    performs edits on text. The tricky part of Sed is that it makes use of a highly
    specialized language called regular

    expressions.

    Regular expressions evolved out of need to validate a given set of data to see
    if it conforms to a standard

    and edit when the example is given. While a simple find and replace is enough
    for most people when editing

    how you perform a find-and-replace when you want to edit only. That with S as
    the third letter in a

    given set is Probably one of the easiest cases for a regular expression. You want
    to confirm, e.g. that

    string is a valid email: an email with a username (who it''s from), a domain (where
    it''s from), Hotmail or

    Gmail, and will it be an e-mail? Right! with an @) symbol. Okay, can we do that
    with a valid character like *. So something

    that looks like * will we use * to avoid picking up anything. Even

    spaces, numbers, symbols, and so on. We need a way to pick up a string that is
    made up of a string of

    eail characters (letters, numbers, periods, underscores) and then @, a valid domain.
    This will be

    a collection of letters, followed by a period and then another set (or few) of
    letters. Describing this is

    ext exhausting, is why we have a specialized language for performing them.


    Now you understand what we are trying to achieve, run the following two commands
    to alter the file

    tools/rbp/setup-sdk.sh. Sed these commands make use of the option -i, which allows
    you to edit the file


    ```

    $ sed -i ''s/USE_BUILDROOT=1/USE_BUILDROOT=0/'' tools/rbp/setup-sdk.sh

    $ sed -i ''s/TOOLCHAIN=/usr/local/bcm-gcc/TOOLCHAIN=/usr/'' tools/rbp/setup-sdk.sh

    ```


    These changes modify the USE_BUILDROOT variable from 1 to a value of 0 where it
    is found within

    that file and to replace any instance of the TOOLCHAIN=/usr/local/bcm-gcc with
    TOOLCHAIN=/usr. Once we

    have edited the tools/rbp/setup-sdk.sh, you should execute it with the following
    command:


    ```

    $ sudo tools/rbp/setup-sdk.sh

    ```'
