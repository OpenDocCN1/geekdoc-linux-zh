  md: '# Installing MySQL


    A database (DB) is a system for the easy storage and retrieval of data. They take
    large volumes of input and then structure the data so that information can be
    easily retrieved with a query. All SQL databases are named for the Structured
    Query Language, which we use to process requests for information retrieval. MySQL
    is the world''s most widely opened source database. It is what is called a relational
    database system that is used because it is easy to set up and work with, with
    its wide adoption. To install MySQL we will again turn to our old friend apt-get;
    this time, we will be installing the mysql-server package. Execute the following:


    ```

    $ apt-get install mysql-server

    Reading package lists... Done

    Building dependency tree

    Reading state information... Done

    The following extras will be installed:

    heirloom-malix libddd-mysql-perl libdbi-perl libhtml-template-perl

    libmysqlclient16 libdnnet-daemon-perl liblprc mysql-client-5.5

    mysql-common mysql-server-5.5 mysql-server-core-5.5

    Suggested packages:

    libipc-shared-cache-perl libhtm-readkey-perl tiny

    The following NEW packages will be installed:

    heirloom-malix libddd-mysql-perl libdbi-perl libhtml-template-perl

    libmysqlclient16 libdnnet-daemon-perl liblprc mysql-client-5.5

    mysql-common mysql-server-5.5 mysql-server-core-5.5

    0 upgraded, 13 installed, 0 to remove and 84 not upgraded.

    Need to get 9,770 MB of archives.

    After this operation, 91.5 MB of additional disk space will be used.

    Do you want to continue [Y/n]?

    ```


    Once the MySQL installation has finished, you will be asked to provide a root
    password for your DB; this is the admin password for your database. Make sure
    you remember it; you will need it later. Now that the installation has finished,
    confirm that the process has started with:


    ```

    $ ps -ef | grep mysql

    root 5254 1 0 20:23 - 00:00:00 /bin/sh /usr/bin/mysql_safe

    mysql 5552 5254 1 20:23 ? 00:00:03 /usr/sbin/mysqld --basedir=/usr --datadir=/var/lib/mysql
    --plugin-dir=/usr/lib/mysql/ --pid-file=/var/run/mysqld/mysql.pid --socket=/var/run/mysqld/mysql.sock
    --port=3306

    root 5593 5254 0 20:23 ? 00:00:00 logger -t mysql -p daemon.error

    ```


    That''s one big command, but it does show that MySQL is up and running. We can
    go over the MySQL config, but thankfully the system will work for all our basics
    without the need to modify the configuration. Let''s start working on some basic
    ways to insert data and retrieve it.


    # Structured Query Language


    Structured Query Language (SQL) is a language for inserting and retrieving information
    from an SQL database. In SQL, there are a number of queries you can do, ranging
    from the simple to the extremely complex. Given that there are (with everything)
    a number of other resources that spend much more time and go into more detail'
