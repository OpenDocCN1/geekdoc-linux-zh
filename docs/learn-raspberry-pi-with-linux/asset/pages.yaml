    # RASPCMC


    There is a much simpler way to get XBMC working on your Pi: using a prebuilt version
    of Raspian called RaspMC. You can download a RaspMC installer and push the image
    onto an SD card just you did with Raspian. You can download this from http://www.raspcm.com/download/.
    This installation is very simple and will take between 15-25 minutes. You plug
    your Pi to your network, turn it on, and off the installer goes. It will download
    everything from the Internet and then set itself up. This is by far the easiest
    way to get XBMC running on your Pi. For those of you take the path of RaspMC,
    you can skip to the "Starting and Using XBMC" section of this chapter.


    > Note ifconfig is missing, install the net-tools package using apt-get. See Chapter
    3 for more on apt-get.


    Once you are inside the operating system, it is time to issue some commands and
    start getting XBMC installed. This is a very long process: the compiler is much
    slower than using apt-get because all the software installed by apt-get is precompiled,
    then cut out some steps. The compile in this case takes about 12 hours—hours,
    half a day. I find it best to leave the final compile to overnight so I won''t
    be tempted to sit there for hours The process takes such a long time because of
    the nature of the ARM processor and the speed at which it can work. This means
    compiling takes longer, but we can do as much on a lower level of power.


