  md: 'But does this have to do with computers? Well, one of the major tasks for any
    computer is to process information, which means that it has to be able to store
    and retrieve information easily. Older systems did use the alphabetical system
    and it worked well, but as soon as there was a buildup of number of files, it
    started to get messy; and finding information became a challenge.


    This issue was addressed by the ability to create a directory (often called a
    *folder*), in which you could put files. It helped a lot, but the same old problem
    started to creep up on people. Yes, you could have a directory for accounts and
    another for tax returns, but what if you were an accounting firm and you had lots
    of accounts and lots of tax returns? Soon you were back where you started unless
    you had a small number of directories with large amounts of files or only one
    or two files in them.


    Around the same time, the *filing system* (used predominantly for paper-based
    systems) became almost exclusively to refer to the way a computer stores data
    on a disk. Because this is the term you will come across often, we''ll switch
    to using the filesystem term as well now on.


    The last change to filesystem structure that remains familiar to this day was
    to allow directories to contain other directories. This would allow you to have
    a great degree of flexibility to store content in the most appropriate ways. Always,
    there''s more than one way to arrange a set of files, but by and large the system
    has served us and with modern search technology, finding what we''re looking for
    is easier than ever.


    # More than one Filesystem


    Here we hit a bit of a snag with this approach. Each filesystem sits on some form
    of storage. That can be a hard disk, a USB stick, a DVD, or any number of storage
    media. Each device is effectively independent from any other. This makes sense
    because you can take a USB stick from your laptop and use it on your desktop.
    Clearly there is no link between the filesystem on the USB stick and your laptop
    otherwise your desktop wouldn''t have all the information it need to find the
    files.


    Each filesystem has a *root directory*, which is the main directory of device
    and holds all the other files and directories. Like the root of a tree, all the
    files and directories branch off from this central location. This does a bit of
    a problem, though. If each device has its own filesystem and root directory, how
    do you easily present this structure to the end user? It turns out that there
    are two approaches to solving this problem. The first is separate roots; the second
    is a unified filesystem.


    # Separate Roots


    This approach was adopted by Microsoft all the way back in the days of MS-DOS
    and it is still with us today. The approach is very simple. Each device has its
    own root entry and the user can use this entry to locate the device of interest
    and then can simply navigate the filesystem as normal to find the file. In Windows,
    each root is assigned its letter. For historical reasons, the disk on Windows
    is referred to as C: which we often refer to the C drive. Floppy drives are assigned
    to A and B: (with hard disks tended to have two floppy drives) because people
    had more than one hard disk used now the CD-ROM drive been assigned to D:


    This system is really easy to use, and there is never any confusion about what
    a particular file is you can simply by looking at the drive letter. However, there
    are a couple of issues with this design:


    +   - First, root devices are assigned to letters, and there are only 26 letters
    in the alphabet, you are limited to 26 devices. Hardly an issue for home users
    every today, back when businesses were using large mainframes, they could have
    hundreds of devices.

    - The second issue is that the user has to be aware of the physical location of
    the file, which can actually add complexity because it ties the location of the
    file to the physical device that it is on. If a bigger disk is added to the system,
    and the files were moved to that new location, their root device would change.
    Any person (or software) that depends on a file location would need to be updated,
    and that''s never fun.'
