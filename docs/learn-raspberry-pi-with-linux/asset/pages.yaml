- img_proc: true
  md: 'Figure 6-3. Modified file in nano


    That''s pretty much it for the title bar. At the bottom of the screen there are
    two sections. The first one is the status line, which shows you important information
    (right now, it''s telling you that it''s a new file), and the second one is the
    shortcut or menu bar. We''re not going to say much about the status line because
    it''s pretty self-explanatory. Anything of importance that you need to know, nano
    will put there. Of much greater interest (and key to using nano) is the shortcut
    bar. Let''s take a closer look at it in Figure 6-4.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_124_0.png)


    Figure 6-4. The shortcut bar


    When you''re using in Windows or on the Mac, you''ve probably reached the point
    rather than using the mouse to copy and paste you use the keyboard combinations.
    On Windows, you would use the Ctrl and C keys, and on the Mac it would be the
    Command key and C. When you use more than one key in concert with another, you
    end up with a combination. Nano works in a very similar way, but rather than just
    copy and paste, all of its functions are driven with key combinations. Because
    it would be somewhat difficult to remember all the possible options available
    (although the ones you''ll use on a frequent basis will be committed to your long-term
    memory), nano displays them in the shortcut bar. Actually, it only shows the most
    common commands, but we have never needed to stay away from them.


    To make use of any command, you need to use the correct key combination. You can
    find which one you need by looking at the shortcut bar. A shorthand of writing
    control key is to use the caret (*) symbol. Looking at the shortcut bar, you can
    see that you want to get help, how to use `^G`; in other words, hold the Control
    key and press the G key.


    # Saving Your File


    Saving a blank file is pretty boring, and it''s hard to tell if it saved correctly
