  md: '# Squeak


    Squeak is a programming language that is preinstalled on your Pi. For licensing
    reasons, however, the install is not quite complete, so you won''t actually able
    to use it out of the box. We are not sure if this is a temporary issue and one
    might be resolved in future versions of Raspbian. At the moment, if you open Squeak
    you''ll see a window that looks something like Figure 2-19.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_57_0.png)


    Figure 2-19. Starting Squeak for the first time


    After a bit of digging, we discovered the reason and also a post on the Raspberry
    Pi forums by jstout that provided a handy shell script that would share the missing
    components for you. Thanks to jstout, we can help you get Squeak up and running.
    You''ll need to open up LXTerminal and enter these commands (you could also come
    back to this section once you read Chapter 3 and execute the following commands
    on the command):


    ```

    $ wget -r -o SqueakV41.sources.gz http://ftp.squeak.org/4.1/SqueakV41.sources.gz

    $ gunzip -f SqueakV41.sources.gz /usr/share/squeak

    $ wget -r -o Squeak-4.3-All-in-One.zip http://ftp.squeak.org/4.3/Squeak-4.3-All-in-One.zip

    $ unzip -j Squeak-4.3-All-in-One.zip "Squeak-4.3-All-in-One.app/Contents/Resources/Squeak4.3.\*"

    $ sudo mv SqueakV41.sources /usr/share/squeak

    $ sudo mv Squeak4.3.image /usr/share/squeak

    $ sudo mv Squeak4.3.changes /usr/share/squeak

    ```


    This isn''t the time to place or discuss what those commands actually do, but
    the short version is this: download the missing components and place them in the
    right location for Squeak to find them. Once you''ve entered these commands, you''ll
    be able to run Squeak without seeing that popup box. Instead you should see Figure
    2-20.'
