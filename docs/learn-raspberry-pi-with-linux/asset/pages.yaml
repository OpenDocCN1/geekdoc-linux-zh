  md: 'If you are in doubt, remove the xbmc-rbp directory and start over. Ensure that
    you execute the copies and the linking in full. I found that when you the git
    clone, things could sometimes get stuck and not move.


    When this is the case, it is best to stop the current job with Ctrl + C, remove
    the directory, and restart again. It was also better to remove peripherals from
    the system during the compile and install having too many peripheral devices caused
    issues on my system. Additionally, you should ensure that your output for commands
    as configure matches the one given as these flags can play a much bigger role
    when compiling and save you nasty headache and another 12-hour job. Finally, ensure
    that all your apt-get runs and complete successfully these packages are required
    to provide the libraries that your Pi will need when building XBMC.


    # Starting and Using XBMC


    Now that we have gone through mega compile process, it is time to start up XBMC
    and get going! First, though, we need to reset the options we set earlier, directing
    a larger amount of memory into system RAM. We will need to go to the graphics
    device because we will do some serious display work with XBMC. Execute the following
    command to change over the Pi boot system:


    ```

    $ sudo cp /boot/arm128_start.elf /boot/start/elf

    ```


    Go back and check that the linked files mentioned earlier are correct. Now we
    can also make changes to the /boot/config.txt file because it governs the Pi''s
    low-level hardware runs. The simplest change to make is to add the line disable_overscan=1
    as it will remove the need to do overscan processing which will make the audio
    of video play back larger, thus consuming more resources. Once you have made these
    changes, issue the following commands to reconfigure and reboot your Pi one last
    time:


    ```

    $ sudo rpi-update

    $ sudo reboot

    ```


    Now that you have changed the settings back to 50/50 resource allocation, start
    XBMC by logging in as root and issuing the following command:


    ```

    $ /usr/11b/xbmc/xbmc.bin

    ```


    Your screen will freeze for a moment, and Figure 11-1 will greet you.


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_241_0.png)


    Figure 11-1. XBMC boot screen'
