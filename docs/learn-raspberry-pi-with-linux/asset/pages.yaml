  md: '# CHAPTER 4


    # The File-Paths to Success


    This chapter takes a look at what filesystem is and how different operating systems
    try to make sense of them. We explain the difference between separate root filesystems
    and unifed root filesystems, and why knowing up front might save you a lot of
    headache.


    We then move on looking at the filesystem presented to you on Pi. We explore the
    standard layout and explain what goes wrong and what it actually does. We will
    also show some simple examples that highlight some benefits of the "UNIX ''everything-is-a-file''
    approach to system design.


    Next we will show you how to move around your system, and you''ll learn about
    relative paths. We''ll show you how to create directories and files (and then
    copy, move, and delete them), and we''ll explore Linux file permissions and show
    how Linux decides who can do what to your files. We''ll also touch on users and
    groups, and how to set ownership and file permissions on your own files.


    We''ll round off the chapter by showing you how to create the Linux equivalent
    of shortcuts.


    # What is a Filing System?


    We actually planned to start this section with a dictionary definition of what
    a filing system is, followed by our interpretation. Unfortunately, most of the
    definitions we could find basically "a filing is a system for filing," we''ll
    skip that and go straight to our own definition. It does suggest, that although
    a filing system is easy to talk about, it is harder to define. We think a filing
    system is:


    > A way of sorting and categorizing data that makes finding easier


    This definition covers everything from a simple-in-tray (at least you where the
    document is, if you can''t put your hand on it away); the way to view your contacts
    on phone (that''s an alphabetical system right there); all the way to some of
    the more exotic systems like the Dewey Decimal System, used to categorize nonfiction
    content at your local library.


    Actually libraries are an interesting use-case for filing systems most of them
    have at least two going at the same time. Generally libraries tend to arrange
    file by the surname (and then forename) of author, whereas the nonfiction section
    is sorted by Dewey Decimal numbers. By using two systems at once, they solve a
    fundamental problem. Sorting books by the author''s name is great if you have
    a favorite author and want to find more books. When it comes to nonfiction, you''d
    probably want to browse a selection of books on a given topic, with a particular
    author in mind. If those books were sorted by author name, you''d never be able
    to find anything.


    Some libraries take this step further by sorting books by genre (Sci-Fi or Fantasy)
    and then within that category they sort by author name. This has some neat benefits.
    You can still go straight to your favorite author because you know the genre,
    but can also browse for similar books with the same genre. If you are looking
    for the best thing in that genre, you can simply find that in section and flip
    through.


    So far, good. Filing systems make finding things easier, and we can see that it''s
    important to use the correct filing system for the task; otherwise, you''d probably
    be better off with no filing system at all.'
