  md: '# INTRODUCTION


    If hardware products don''t really interest you, then you can probably forget
    the GPIO ports. But if you''re looking to integrate your Pi with various bits
    of hardware or make your Pi the brain of some wacky invention, GPIO ports will
    give you an easy way to do that.


    # Whistle-Stop Tour


    So, what do we have in store for the rest of the book? The book is broken down
    into three core parts. In the first part I''ll show you how to get up and running
    with the GUI. If you''ve never seen a GUI, this is where you want to start. The
    Pi comes with everything you need, but out of the box it is a bit of tweaking.
    Don''t worry; we''ll get you up and running quickly, and you''ll soon be off exploring.


    Part 2 takes you back to the command line and teaches you how to move around.
    Many people (myself included) spend the vast majority of time at the command line.
    It''s fast, powerful, and always available (even when a GUI is not, as you want
    to make changes via the network), but it is a bit different from the GUI that
    most people use to. Fear not; we all have to start somewhere and in this section
    we''ll make sure you''re comfortable at home on the command line.


    In Part 3, we will start to do more interesting things. By this stage you''re
    happy on the command line (which puts you ahead of most of the crowd) and now
    you want to delve a bit deeper and actually make the Pi work for you. We spend
    this section covering some of the great things you can do. I''ll give you the
    solid foundation you''ll need to do all of the hardware and software projects
    in Brendan Horan''s "Practical Projects."


    # Your First Bite of Raspberry Pi


    In Chapter 1 we look at what Linux is and why it''s on your new Raspberry Pi.
    We take a brief look at different "distros" and explain why not all Linuxes are
    the same. We take a closer look at the Raspberry Pi and what makes it just a bit
    different, and then get your graphical interface up and running. We round off
    Chapter 1 with a quick tutorial on how to move around the desktop.


    # Surveying the Landscape


    Following is a tour of the desktop and all the fun things you can find. We start
    with the essentials and show you how to get online, check your e-mail, and get
    up with instant messaging. We''ll expand on that a little and shoot for some music
    and video. By the end of this chapter, you should be able to do your day-to-day
    computing without having to think twice about using a Raspberry Pi.


    # Remodeling the Landscape


    Once you''re happily browsing the web and sending e-mail, we will look at how
    to get about customizing your home and making it yours. We''ll start with the
    obligatory "how to change your desktop background" and then move on to other little
    tweaks and enhancements that you can do to make your time on the Pi as pleasant
    as possible'
