  md: "# Troubleshooting\n\nAs with XBMC, this process is fairly painless because\
    \ the Raspberry Pi has a fixed hardware platform, and without all these variables\
    \ there is not much to worry about—things should just work.\n\nIf you find that\
    \ no sound is coming out of your speakers when they are attached, check that you\
    \ correctly issued both the modprobe and the mixer commands because both are needed\
    \ to make the audio function.\n\nOther than this issue, most of the commands should\
    \ work. If not, you should delete any downloaded content and start over.\n\n#\
    \ Airport on Boot\n\nAs with using the XBMC instance, most people won't want to\
    \ have shairport started with their system without needing to manually log in\
    \ your Pi and start the application. It is easy for use because the shairport\
    \ install has all the features need to do with it! To perform this, first install\
    \ the shairport system: run sudo make install, and your output should look like\
    \ this:\n\n```\n$ sudo make install\ninstall -D -m 0755 hairt /usr/local/bin/hairt\n\
    install -D -m 0755 shairport.pl /usr/local/bin/shairport.pl\ninstall -D -m 0755\
    \ shairport /usr/local/bin/shairport\n```\n\nOnce this is finished, you can copy\
    \ the provided script into the correct location:\n\nNow that the file is copied,\
    \ you need to make one small modification: add the modprobe command from earlier—modprobe\
    \ snd_bcm2835—into the /etc/init.d/shairport file just before you start the shairport\
    \ application. The section should look like this:\n\n```\nstart() {\n  echo -n\
    \ \"Starting shairport: \"\n  modprobe snd_bcm2835\n  start-stop-daemon -- --quiet\
    \ --pidfile \"$PIDFILE\" \\\n    exec \"$DAEMON\" -b -oknido $DAEMON_ARGS\n  log_end_msg\
    \ $ ?\n}\n```\n\nThe commands we need to run are:\n\n```\n$ sudo chmod +x /etc/init.d/shairport\n\
    $ sudo update-rc.d defaults defaults\n```\n\nThese commands make the new script\
    \ writable and update the boot sequence to include the new shairport scripts!\
    \ Reboot your Pi, and shairport should be up and running for your boot! Congratulations."
  merge: -1
