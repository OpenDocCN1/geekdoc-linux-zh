  md: '# CHAPTER 1 YOUR FIRST BITE OF RASPBERRY PI


    ![](img/0e6e6125cff2ec21b011df8d1f7a8ec1_31_0.png)


    **Figure 1-13.** First boot: time to configure your Pi!


    We are only going to cover the basic configuration options here (and you can always
    go back and change them once you''ve got your Pi up and running) as we want to
    be in front of a working computer as soon as possible. To start, ensure that your
    Pi is configured to boot to the desktop (select the boot_behavior option to make
    sure that the desktop will appear next time you boot your Pi).


    # # Expanding the Filesystem


    The first option of interest is expand_rootfs, as the description says, will expand
    the filesystem to fill the entire card. The image we downloaded was around 2 GB
    after we decompressed and this is what we wrote to our SD card. So you might have
    an 8GB card or larger, you will be able to see only the first 2 GB of it. By expanding
    the filesystem, we can take advantage of all the space that you have available.
    This approach works perfectly well because it means we don''t need a different
    image file for each disk size; we can use all the same small image and simply
    expand it to our needs. Using the arrow keys, move the bar down to highlight expand_rootfs
    and press Enter. You should see a window that tells you that the partition has
    been resized, and the filesize will be resized after you next reboot. Press the
    Enter key to get back to the main menu.


    # # Configuring the Keyboard


    The next option of interest is configure_keyboard. By default, Raspberry assumes
    a UK keyboard, but chances you will want something else. Be warned, though, that
    Raspberry knows a huge number of keyboards, and the sheer quantity can be confusing.
    For instance, know if you have a generic 105 key keyboard or it is actually a
    105 key version? We weren''t sure either, so we stick with the default: the Generic
    105 key (Intl) PC shown in Figure 1-14.


