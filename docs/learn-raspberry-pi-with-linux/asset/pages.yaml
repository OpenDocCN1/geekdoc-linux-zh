    From within the main menu, there are options to select different types of playback,
    and XBMC is a fully graphical system that will present you with options and locations
    for getting files when you are within it. As long as your media are accessible
    on a network, XBMC should be able to access it and play it back! Now on the topic
    of playback, you will probably be sitting there thinking "Will I be stuck with
    this keyboard for all my playback?" The answer is resounding *no*! There are two
    solutions:


    +   - Purchase a USB remote and attach it to your Pi.

    - The second much have the capability to download an XBMC remote control application
    that simply needs to be paired with your XBMC system to function.


    Most smartphones have the capability to download an XBMC remote control application...
    system to function. To do this, we need to enable two options within XBMC to allow
