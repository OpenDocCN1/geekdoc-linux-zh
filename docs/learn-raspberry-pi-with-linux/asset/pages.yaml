    The quotation marks in this instance show that everything within them is considered
    to be a string of text.


    You may say, what if I want to output a quotation mark? Suppose I want to output
    "Hello World! like that in quotation marks. Well, not a problem, we have covered!
    All systems have the concept of what is called an escape. Escape is a special
    character that tells the interpreter or compiler to ignore the special properties
    of the character and treat it as a part of a given string. In most systems, the
    escape character is a backslash (\). So if we want to make our Hello World! have
    quotation marks, we would modify it to be as follows:


    ```

