    Wow, that''s a big output for a simple command. It shows the utilization of every
    folder within the current folder, and right down the bottom it shows the total
    usage. This is where we can take advantage of any flag in order to shorten the
    output: the -s flag stands for summary. Doing this will only print the total allocation
    for this directory and all within it, rather everything we have just seen. So
    go ahead and execute the command; your output should look much cleaner:


    ```

    $ du -sh

    ```


    That''s much better. You will notice that the output is using the . value to denote
    the current directory because does not tell where to look. You can specify a directory
    to use by simply adding one to the end. The next example will be /var/log, which
    is all system logs are kept, so we will need to run this command as root using
    sudo as some of these logfiles are protected:


    ```

    $ sudo du -sh /var/log

    /var/log

    ```


    And there you have it! With these two utilities, you can find out the current
    disk usage of your system and even work out which parts of your system are consuming
    the most space.


    # Managing Processes


    Possibly one of the most important tasks when working within a Linux environment
    is knowing how to manage running processes. After all, a computer is a processing
    system, and if you can''t manage what it is, how can you make truly good use of
    your machine? The first command you should aware of is the ps command. The ps
    command is short for processes snapshot and can be used to list all the current
    processes being run by your user; when invoked, you should get an output like
    the one shown in Figure 5-5.'
