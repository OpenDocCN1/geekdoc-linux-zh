    # Troubleshooting


    For the most part, setting up an Apache server is a breeze. It''s only when you
    start making a lot of changes that might run into trouble. However, if you find
    yourself running into issues, try the following: Check that you can see the Apache
    process running with ps -ef. If Apache is not, try again. If it fails, try examining
    the error log as this will contain information on any Apache that has suffered.
    Most of the entries in the error log are fairly self-explanatory. However, if
    you find yourself at loss, head over to the Apache website where there is a large
    amount of help available for those in need.


    # Mis for MySQL


    Now that you have set web server up and running, you are probably asking, "I see
    that you can make a website by writing content into a web server and it will be
    displayed. What software could I possibly need? And it''s true; right now you
    could write a web page in Basic HyperText Markup Language (HTML) and be done with
    it. The problem with writing in HTML is all static, meaning that any you want
    to change what is displayed, this is not going to be very good management when
    you want to display different things to different people. You would need to be
    sitting there and editing a whole bunch of things—that''s pointless.


    This is where we begin to see the power of the full LAMP stack. We have Apache
    to serve, PHP will handle the dynamic power, and the MySQL database will actually
    contain the various bits of information you want to display. It''s only when you
    have all these components in working together that you begin to see the true power
    of a LAMP system.'
