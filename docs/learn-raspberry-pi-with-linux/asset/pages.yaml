    # Shortcuts and Links


    Linux allows you to create links (shortcuts) by using the ln command (short for
    link). There are two types of links:


    +   * A soft link is a link that you can see on a Windows system using the Create
    Shortcut feature. It creates a file that is a pointer to the real location of
    the file elsewhere on. You create a soft link by specifying -s when using the
    ln command


    +   * The hard link is more interesting. When you use a hard link you have effectively
    created two names for the same file. That might sound like semantics, but with
    modern applications being able to follow a soft link, there''s rarely a need to
    use a hard link. Hard links are restricted to a single filesystem that has to
    support them (most Linux filesystems do). The main benefit of a hard link is that
    the hard link is completely indistinguishable from the original file; they are
    simply two names pointing to the same location. You don''t need to specify anything
    to create a hard link ln by default.


    > Note To avoid confusion and allow links to work across filesystems, you should
    use a soft link.


    Let''s do a quick example to show this in:


    ```

    [raspberrypi pifun]$$ ln pi pi1

    [raspberrypi pifun]$$ ln -s pi pi2

    [raspberrypi pifun]$$ ls -ln

    --rw-r--r-- 2 migxy migxy 0 Oct 8 08:14 pi

    --rw-r--r-- 2 migxy migxy 0 Oct 8 08:14 pi1

    lrwxrwxrwx 1 migxy migxy 3 Oct 8 08:33 pi2 -> pi

    [raspberrypi pifun]$$ $

    ```


    Let''s look at how pi and pi1 are identical in every way, but that''s not really
    a surprise because apart from the name, they are the same file. Notice that the
    number after the file permissions block shows 2 for pi and pi1. This tells us
    that there are currently two filenames pointing at this particular file. Also
    not much of a surprise because we''re the ones that created the second entry.


