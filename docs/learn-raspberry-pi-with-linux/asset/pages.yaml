  md: '# Managing WiFi from the Command Line


    For those who don''t really want to use the GUI or who consider themselves purists
    to the true Linux tradition of using only the command line to manage your systems,
    this is it for you! To do this, you will be modifying the NetworkManager configuration.
    The basic way the NetworkManager system decides how it should manage your Ethernet
    devices is twofold:


    +   - It checks to see whether the managed flag in /etc/NetworkManager/NetworkManager.conf
    is set.

    - It takes over of anything configured within /etc/network/interfaces; these settings
    say how this device should be managed.


    You don''t want the NetworkManager system to jump in and take over your settings
    from above, so you need to ensure it is not going to. This will be an issue only
    if you installed the GUI earlier, or go ahead and check /etc/NetworkManager/NetworkManager.conf
    and ensure that the managed flag is set to false. The file should look like:


    ```

    [main]

    plugins=ifupdown, keyfile

    ```


    ```

    [ifupdown]

    managed=false

    ```


    Once this is done, go ahead and reboot your Pi; you want to ensure that the Pi
    comes up correctly and all existing Ethernet connections are working after this
    first reboot. You now need to add the configuration into /etc/network/interfaces
    so that it knows how to manage the device and connect to your WiFi. So go ahead
    and open up /etc/network/interfaces. You will see that the file is already partially
    populated with the following lines:


    ```

    auto lo

    iface lo loopback

    iface eth0 inet dhcp

    ```


    You may also see the following lines in your file, depending on whether your system
    has already done some wireless configuration or not:


    ```

    allow-hotplug wlan0

    iface wlan0 inet manual

    wpa-conf conf /etc/wpa_supplicant/wpa_supplicant.conf

    iface default inet dhcp

    ```


    These lines correspond to the loopback and eth0 devices, respectively, and provide
    some simple details about their management; in this case, the loopback is an automatically
    managed loopback device, and the eth0 device is given an IP address by DHCP. There
    may also be some existing configuration for your wlan0 device; if you exist, you
    should comment them out by adding a # to the front of them or delete them from
    the file. You now need to add a new configuration for the wlan0 wireless device,
    so go ahead and add the following to your config below the existing content:


    ```

    auto wlan0

    iface wlan0 inet dhcp

    wpa-ssid <Your WiFi SSID>

    wpa-psk <Your WiFi password>

    ```'
