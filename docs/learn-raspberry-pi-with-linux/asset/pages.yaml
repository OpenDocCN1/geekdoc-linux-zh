    The file permissions part is:


    ```

    -I-W-I--I--

    ```


    There are ten slots in list. If a particular permission is missing, ls will show
    a hyphen. However, a normal file always has a hyphen in the first slot. If it
    were referencing a directory, the first slot would be a d to highlight it''s not
    a file. This slot can also be an 1 if the file is a link (shortcut) and we''ll
    show how to use these in the next section. For now we can ignore the first slot
    and focus on the final slots.

    The remaining slots are grouped in three of these groups. We use user, group,
    and world roles, respectively. Each of three slots in each group represents a
    specific permission: read, write, and execute. Where the permission is set, you
    will see a letter, but when the permission is not set, you will get the hyphen.
    If our Raspberry file had all permissions set, it would look like this:


    ```

    -TWXWIXWX

    ```


    Let''s split out a bit so it''s a little easier to read:


    ```

    rwx rwx rwx

    ```


    So if we look at the first three permissions, we can see that the owner has read,
    write, and execute permissions. We can also see that group and world have full
    permissions. To interpret what these permissions mean, though, really need to
    know who actually owns the file. Let''s take a look at the part of the line that
    shows who owns the file:


    # pi pi


    Well, wasn''t that too painful. Remember that on Linux machines, users have their
    own private groups named after the user. That''s what we''re seeing here. The
    first p1 refers to the owner, which is of course, the p1 user. By default when
    a file is created, the group ownership is set to the user''s default group. In
    this case, your private group which is also called p1 (the second p1). So look
    at our original entry:


    ```

    -rw-r---- 1 p1 0 Oct 7 16:29

    ```


    We can read this as "The p1 user has read write privileges. The group has read
    privileges and world also has read privileges." Linux applies these permissions
    in a specific order based on who you are.


    +   - If your username matches the owner of the file, the user permissions will
    apply when you try to access it.

    - If you''re not the owner, but you are in the same group as the file, Linux will
    apply the group permissions to you.

    - If you''re neither the owner nor in the same group, Linux will apply the permissions
    from the world.


    In our example, though, the permissions for world and group are identical, so
    if you''re not the owner, you will get the same level of access. However only
    the owner can actually save changes to the file. There is one exception to this
    rule: the root user. The root user is effectively immune to file permissions and
    can change permissions and file ownership for any file on the system, regardless
    of who actually is.

    The execution permission allows you to execute a file as a program. This is a
    security feature so you can effectively stop people executing commands that you
    don''t want them. However you have to be careful because if users read your file,
    there is nothing stopping them from copying it to your own file and making file
