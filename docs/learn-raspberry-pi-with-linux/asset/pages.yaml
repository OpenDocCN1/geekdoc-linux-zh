  md: '# CHAPTER 8 | LAMP OF YOUR OWN


    If you press the submit button, you will wind up back on the page, but you can
    see that the page is referenced in the URL. The action block blocking the CGI
    command to run on this page. Now we will need to add some CGI processing to our
    PHP in order to process this data.


    Recall that we use a method of POST either; the other method is GET, and the difference
    between the two is limited as post both can pass data in the basically same manner.
    For all practical purposes, the only difference is that GET will display the content
    on the web, whereas POST will keep it hidden. You can check this out by changing
    the POST to GET and then pressing the submit button. Your URL will look something
    like http://10.0.0.20/index.php?action=insert&owner=$date&importance=$creator..


    There is actually a large amount of data being transferred that will need to be
    processed. Frankly, PHP has methods to make this easier; it has special variables
    that are automatically populated with the data from CGI requests. There are three
    special variables that you access (as we did with the SQL assoc variables): `POST`,
    `GET`, and `REQUEST`.


    To process our CGI, we need to do a few things. First, check if the action variable
    is set and contains data; if it does, then press the submit button as we have
    it to insert (and have action of remove). Once we have ensured that action is
    set, we check what it is. Once we know which action we are performing, we can
    simply pull apart the remainder of the output and then perform the required actions
    on the database. Finally, if we do this before the main page load, we will actually
    have the latest version of the data displayed automatically!


    Our CGI start looking like this:


    174'
