  md: 'All we want to do at this point is download the source code into our home directory
    to work with it. To do this, use

    the git command and tell it to clone the repository of source code onto the system.
    We have also added the --depth 1

    to the command so that we only want to clone the most recent 1 revision of the
    source code (the absolute latest

    version of the code) and avoid getting a lot of extra and unwanted historical
    code.

    Start your clone by running the following:


    ```

    $ git clone --depth 1 git://github.com/xbmc/xbmc-rbp.git

    Cloning into ''xbmc-rbp'':

    remote: Counting objects: 35172, done.

    remote: compressing objects: 100 (22895/22895), done.

