  md: '# Using dd on the Mac


    If you are using a Mac, we want to show how simple it is to write an image to
    your SD card. Alas, we can''t because there''s no simple easy way to do it. Disk
    Utility, which excels at many other things, simply does not know how to handle
    our standard image files. We tried converting it to a .dmg file (the native format
    for a Mac), which didn''t work, either. We also looked at online tools that might
    be able to download to help with the problem, but we didn''t find anything that
    made the task significantly easier than doing it in the first place.


    So we''re going to get our hands dirty on the command line a little earlier than
    before. We''re not going to go into too much detail about what we''re actually
    doing because most of these commands you''ll see a later in their Linux incarnations.
    For now, you''ll have to trust us.


    # Finding the Terminal


    First, we need to open the terminal. You can find it in the Utilities directory
    under Applications. To put the following into context, we end this section with
    a complete transcript of all the commands that we use. The process is rather straightforward;
    it has a fair number of parts moving.


    We opened the terminal and now we need use sudo to become the root, the equivalent
    of Administrator on a Windows machine.


    Now, dealing with low-level devices is dangerous for security reasons (you don''t
    want a virus being able to write directly to your hard disk, for a normal user
    is not allowed to issue commands at that level. Because we need to write our Raspian
    image directly to an SD card, we have no choice: we need direct access to the
    card. Fortunately, root has unrestricted access to the machine, so as root we
    can write the image to the card. The command we need to use is this:


    ```

    sudo -i

    ```


    This command opens an interactive prompt as the root user and gives "super user"
    privileges. You use sudo to execute commands directly, but because we are going
    to be executing a few of them, it''s more convenient to do this way. sudo will
    then prompt you for your password (the one you normally use for your user account).
    Once sudo can confirm that it is really you sitting at the keyboard, you will
    be up at a root prompt.


    > **Caution** We now have permission to do anything we like on the system. And
    although that we can make our image, it also means that we could mess things up
    if we aren''t careful. Under UNIX, it is assumed that root knows what it is doing
    and there is little way of safeguards. Be very careful when running any command
    double check (and then do it again), and only when you''re completely sure you
    should hit the Enter key. As soon as you''re done, you should close the terminal
    window, just in case.


    # Using the Terminal to Write the Image


    Okay, so what now? One of the challenges with writing to the SD card is to know
    which device on that card is actually it. You don''t want to accidentally mistake
    your hard disk for because that would have some unpleasant consequences. There
    are generally some assumptions you can make (for example, we know that /dev/disk
    is usually the system disk, you never ever want to write to this), but in order
    to limit the risk, we''re going to do this one by numbers.'
