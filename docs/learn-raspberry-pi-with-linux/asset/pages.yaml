    PHP and MySQL 5, by Jason W. Gilmore.

    Anyway, enough about placement deix; let’s start with the basic administration
    stuff and make a database. The syntax for this one is dead simple:


    ```

    create database <database name>

    ```


    To perform commands on your MySQL instance, you need to connect to it and get
    into the mysql shell. This is the command to do this:


    ```

    mysql -root -p

    ```


    So jump into the shell, provide your root password, and execute create database
    pi; which should generate the following output:


    ```

    mysql> create database pi;

    Query OK, 1 row affected (0.00 sec)

    ```


    Okay, awesome. We have a database called pi. In an SQL system, a database is the
    highest-level construct. Underneath that is a table, which is the object that
    holds your data (a database holds multiple tables). Each of these items of data
    in a table is called a row. Our next step is to create a table; the problem is
    that we need to give our table some structure. We need to tell it what kind of
    data to hold and how we will lay out that data, which we need a project. The most
    obvious for now is a simple-to-do list, let’s make one of those.


    > Note All MySQL commands end with a semicolon (;). It signifies that this is
    the end of a statement. This is done as you can put lines in one command over
    multiple lines to make it easier to follow.


    # Creating Tables


    Just stepping aside quickly, I have departed from the normal project method a
    little here so that we can run through a basic database setup together. When undertaking
    a big project, it is far better to plan ahead and fully understand what will be
    going into a database long before any data is added to it.'
