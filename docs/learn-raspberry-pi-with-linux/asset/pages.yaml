  md: 'In short, although the system employed by Windows is simple and effective,
    it can become an administrative headache on large and distributed systems. These
    days there are lots of around that, and new techniques have emerged to hide this
    structure beneath the surface, as the Microsoft Distributed File System (DFS)
    network shares and libraries for grouping content in one place on your desktop
    as documents. So isn''t really an issue for Windows today. However, back when
    UNIX reigned supreme, these technologies weren''t available, and they went with
    the other: a unified filesystem.


    # Unified Filesystem


    Linux, being based on UNIX, is a unified filesystem. That means that unlike Windows,
    which has multiple root devices, a Linux system has only one and is always mounted
    on /, which is UNIX-speak for the root directory. If there is only one root directory,
    then does Linux handle additional devices, and which of them do we know their
    own filesystems?

    The solution is to take the root device of the new device and attach it to an
    existing device in the tree. This is known as mounting a filesystem, which allows
    Linux to have an unlimited number of devices because it can attach them anywhere
    in the existing tree. This means you could mount one device and then mount another
    device on a directory inside the first device. From the user''s view, you can
    move through all devices as if they were all one device. The physical structure
    (that is all the disks and raw data on them) is completely hidden from them. We
    have no need to they''ve crossed from one device to another.

    This solves the issues highlighted by Windows. The unified approach is consistent
    regardless of what the underlying mechanism is. In fact, course, the benefits
    of the root approach have now become the downside for the unified approach. It''s
    no longer easy to see things where around, and this can make things more confusing.
    Like Windows, Linux systems have evolved over time so that these problems aren''t
    quite as pronounced as they would otherwise be. However, these benefits are mostly
    seen in the GUI and tend to be less pronounced when using the command line.


    # The Mac has to be Different


    As of interesting, OS X on the Mac uses both of approaches. Under the covers,
    OS X is a UNIX-based system and so unless you go the command line (and most Mac
    users don''t), you will never see evidence of this. When you attach a USB stick
    to the Mac, it will mount in a similar way as Linux, but it will show to the user
    as if it were its own root device in a similar approach to Windows. However the
    Mac doesn''t assign a drive letter, it just sets a unique name.


    # Bring it It All Together


    Admittedly that''s a bit of theory and you''re probably wondering where all the
    fun commands are that we promised to show you. You might also be wondering why
    we just bored you with all that, and when (if ever) such information might be
    useful. The reason we''ve the reason we put this emphasis on this theory approach
    is how we started up with Linux, a lot of the things that took out were preconceptions
    from using other operating systems. When we first installed Linux some 15 years
    ago, it took several years of severing before we found what you need a "root /
    device" meant. This isn''t just a Linux, a dabbling with the BSD family of operating
    systems and its alternative way of handling disks caused you to wipe the root
    disk because we thinking Linux and not BSD.

    Hopefully this section will save you from some of the pain that we went through
    when we started out. You don''t need to memorize all the theory, but if you come
    away from this section with an appreciation despite many similarities, Linux is
    not Windows or a Mac, then you will be ahead of the game.'
