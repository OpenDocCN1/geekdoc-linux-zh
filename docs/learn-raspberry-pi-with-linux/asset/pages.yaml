  md: '# Getting Comfortable on the Command Line


    Now for something just a bit different. You can use your Pi like your other computer,
    but now we''re going to take it a notch. In order to get the full benefit from
    Linux and get your hands dirty with some very interesting projects (automatic
    cat detection and prosecution), you''ll need to lift the craft and start getting
    closer to the metal.


    The first place to start is the command line where you''ll be interacting with
    Linux on a very precise and powerful well. We''ll be starting off slowly and explaining
    what it is like to be a very alien environment. We''ll discuss the shell, where
    it comes from, and why it''s important. ... (fascinating in and of itself) you''ll
    get the full benefit from the experience.


    # Storing Stuff and (Hopefully) Finding It Again


    Once you''re up to speed on the command line, it''s time for the most important
    subject. Most books start by telling you about all the shiny commands you can
    run, and that''s all well and good, but you''ll need some context.

    I''ll start off by looking at the Linux file system and explaining the "everything
    is a file" philosophy that sits at the core of every UNIX-based operating system.
    This sounds a bit scary and we won''t go into too much depth, but with this under
    you you''ll be able to pick new commands and make full use of them.


    # Getting Down to Business


    Now you know about the command line and how Linux lays out your files, we''re
    actually showing you how to make Linux do things. I''ll show you how to become
    root (does anyone remember the ''power up'' from He-Man?) and how to install new
    applications and tools. We will also briefly look at some useful command-line
    tricks that will make you a keyboard demon. You will soon find that you can do
    things far more quickly on the command line than by clicking your mouse ...


    # Editing Files


    Next on your tour de force is editing files. I will show you two editors of choice.
    One (nano) is simple, easy, and great for general use. I''ll use it for making
    small changes to config files. For heavy lifting, I prefer vim. It has all sorts
    of magic codes and key presses (it''s playing Dungeons and Dragons--not that I
    ever have), and if you hold all the key-combos and commands in your head, you
    will never have to leave! For the rest of us, well, there''s always nano...


    # From Beginner to Admin


    Now we''re starting to take a look at system services and what makes Linux tick.
    You''ll learn that as smart as Linux is, it''s not different from all the tools
    and things you''ve been running so far. You''ll be able to apply your newfound
    knowledge and be able to start and stop services to your heart''s content.

    Network services are the bread and butter of any server. Most people have used
    them from a user''s perspective but now it''s time to experience them from the
    pointy end. We''ll look at the usual suspects, such as OpenSSH and the Apache
    web server. We''ll explain the real dangers of running your own servers on the
    Internet. There are people out there who would like to gain entry to your nice
    little server, and they do not much care who you are. Don''t worry; we''ll provide
    a simple list of do''s and don''ts that will put you ahead of the game.'
