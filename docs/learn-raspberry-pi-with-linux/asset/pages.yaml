    # Alerting Yusuf


    Thus far we have attached a webcam, configured the motion detection software and
    configured it to start automatically with your Raspberry Pi. Now we have a fully
    fledged monitoring system that you can use to spy on your enemies and keep you
    notified about intruders entering your inner sanctuary. Well, almost. Now you
    need to create a system that allows you to send messages to yourself so that you
    can be alerted when intruders


    To do this, we will be taking advantage of one of the oldest and most efficient
    messaging systems developed: e-mail. Setting up our mail server and domain is
    a big task and outside the scope of what we will be doing in this chapter. Instead,
    we are aiming to set up a lightweight mail client to forward messages to a mail
    service in which it then be sent to you on whatever handy gadget you use to receive
    e-mail. Now that you understand the plan, let''s begin.


    # Installing SMTPTP


    The application we will be using to send to the mail server is called SMTP. SMTP
    is a highly simplified transfer agent (MTA) that is used when a system administrator
    needs to be able to send mail from a server, but doesn''t need to be set up as
    a fully fledged daemon. The advantage here should be obvious: a significantly
    less intensive setup process and much lower overhead—all of which scream Raspberry
    Pi to limit.


    With all this in mind, let''s begin. Start by issuing the command to download
    and install the SMTP application and install it:


    ```

    $ sudo apt-get install smtp

    ```'
