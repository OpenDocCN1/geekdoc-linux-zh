    These lines show the user, X for the password, the user''s ID number, the user''s
    group ID number, the user''s group identifier, the path of the user''s home directory,
    and the user''s shell. These are the basics of what is needed for a user to function
    within the Linux environment.

    While this file has a password field, it is no longer used and normally contains
    a placeholder (in case, X). The passwords are stored in the shadow file, /etc/.shadow.
    The shadow file was created so that only root could access password data and all
    common user data could be read by other member generic applications.

    Now you understand how Linux stores users, add a new one called raspberry. To
    add this user, we will use the useradd command and a few arguments. There is another
    command, adduser, which performs users but instead of being supplied with arguments
    will prompt you for details. adduser is a common command to use in a pinch when
    you forget a necessary argument for useradd.

    First we want to set the user''s home directory, with the -d flag and the full
    path of the directory we want to use. Most home directories for users are /home/<username>,
    and we will do this for raspberry. Currently, /raspberry doesn''t exist, but you
    reach out and add it, we can use the -m flag to tell useradd to do it for us!
    This gives us this:


    ```

    $ sudo useradd -d /home/raspberry -m raspberry

    ```


    We could go a step further and even specify the group with -g <groupname> to set
    the primary group for the user. Or even specify the shell the new user with -s
    <shell> path or finally with -p <password>. Once you have executed your command,
    you can go and inspect the changes to /etc/.passwd, where you should see something
    like this at the bottom of your file:


    ```

    raspberry:x:1001:1001::/home/raspberry:/bin/sh

    ```


    That''s it; you now successfully added a new user! If you didn''t specify a password,
    you can use the password command we created earlier to change your new password
    and then you''re set to go. However, let''s say that you forgot to set the shell
    path -s earlier and you want to change that so you start with /bin/bash rather
    than /bin/sh. Well, first you could edit the passwd file to change the shell or
    you can use the usermod command. The usermod command functions exactly the same
    as the useradd command, right down to the arguments; simply adjusts the values.
    So run the following:


    ```

    $ sudo usermod -s /bin/bash/raspberry

    ```


    We can expect the shadow file to be changed, and yes it is:


    ```

    raspberry:x:1001:1001::/home/raspberry:/bin/bash

    ```


    Fantastic! With these tools, you should be capable of creating new user accounts
    to allow people to access your Pi.'
