  md: 'The first thing is to whether the action variable specified in the hidden field
    is set or. If it is, we can reliably certain that an action needs to be performed.
    Next, if action is, we go into a switch (or case) statement to work out which
    function we are performing. I''ve added a case for both insert and delete, but
    the delete function is just printing that we will add later. Besides, how we access
    it without a submit method for it and an action field in a form?


    # Inserting into the Database


    In the case, we simply need to create and build the SQL command. The command we
    are trying to build is exactly like the previous SQL inserts. First, I laid out
    the static content: the frame of the INSERT statement, the name, and fields we
    will be writing into. Then I started adding variable to that statement. You can
    see that the additions have a lot of funny stuff because each of these variables
    will need to be surrounded by single quotation marks and a comma on the end. Each
    of these little pieces of text needs to be treated such, which we are wrapping
    in a pair of double quotation marks like:


    ```

    $$SQL=""''.$_REQUEST["description"].''.";

    ```


    This assigns the SQL variable of the current SQL value (given by $$SQL=$SQL) and
    adds it to (marked by the period) a single quote (given by "*") and the value
    of the REQUEST variable description, then a single quote, and then a comma. I
    know its a lot of work, but we have been able to pull out each of the variables
    we need and the whole SQL statement in one tiny variable.


    > **Caution** It''s important to note at point that the above is not to be considered
    secure. Those variables can quite literally being anything and there are special
    functions that you can use to perform some sanity checking on those values. The
    recommended function for performing a good selection of these sanity checks is
    the mysql_real_string.


    Once we have created the SQL variable, we need to insert it by simply invoking
    the mysql query function again. In this example, I''ve also added a check to see
    the execution of the query failed. And that''s it; this block of code will process
    the CGI insert into our database from our PHP. All remains is to insert the block
    correctly into the right place in our code. I have chosen to append this to the
    first block of PHP instead of giving it one. This means the flow of the page comes
    first to draw the header of the page, then to create the database connection and
    perform any CGI actions, then to display the actual content of our to-do list,
    and then to display the final form. Once by placing values into the form and pressing
    submit. This should go ahead and add an extra row that will show up in your table,
    as shown in Figure 8-5.'
