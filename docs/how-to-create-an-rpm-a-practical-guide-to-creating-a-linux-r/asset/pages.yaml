    /BUILD/my-first-program-2.0-1.x86_64/etc/my-first-program.config

    /BUILD/my-first-rpm-2.0-1.x86_64/usr/bin/my-first-program

    /RPM/x86_64/my-first-rpm-1.0-1.x86_64.rpm

    [rpmpackaging rpmbuild] $

    ```'
