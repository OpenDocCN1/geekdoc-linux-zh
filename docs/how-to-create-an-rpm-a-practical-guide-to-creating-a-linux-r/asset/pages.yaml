    we are packaging. Noting that the my-first-program script requires the /bin/bash
    executable - if the user used a "yum install my-first-rpm" and bash wasn''t already
    installed, then yum would dig out the package too. If they just did a "rpm -i
    my-first-rpm-2.0-1.x86_64" and bash wasn''t installed, it would refuse to install
    my-first-rpm. This automated process is not always foolproof, but it can be a
    useful automatic way of picking out such dependencies.


