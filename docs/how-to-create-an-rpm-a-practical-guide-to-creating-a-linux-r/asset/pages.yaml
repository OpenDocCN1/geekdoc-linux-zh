  md: '# # Adding Some Files


    The RPM is still pretty useless, as it still contains no files. Create a small
    shell script,


    > Again, my-first-program(and its configuration file, first-program.conf) can
    be found in ~/files/chapter/3take3 or can be downloaded at http://bit.ly/howcreaterpm


    ```

    #!/bin/bash

    set USER_NAME

    CONFIG=/etc/my-first-program.conf

    [ -f $CONFIG ] && \

    [ -z "$USER_NAME" ] && echo "Hello, ${USER_NAME}"

    echo "This is a very simple shell script as an example of a packaged program."

    ```


    Like many programs, it uses a configuration file, /etc/my-first-program.conf:


    +   * This is a configuration file for my-first-program.

    * You can define the USER_NAME variable here, for example:

