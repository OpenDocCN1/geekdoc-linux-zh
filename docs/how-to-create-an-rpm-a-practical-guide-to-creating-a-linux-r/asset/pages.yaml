- img_proc: true
  md: "http://bit.ly/howtocreaterpm.\n\n```\n#!/bin/bash\n```\n\n```\nusage()\n{\n\
    \    echo \"usage: basename $0 { specfile [buildroot] }\"\n    echo \"- If no\
    \ spec file is provided, a single \\.spec file is\"\n    echo \"- expected to\
    \ be found in the current directory\"\n    echo \"- If no root directory is provided,\
    \ a single root/\"\n    echo \"- directory is expected to be found in the current\"\
    \n    echo \"- For example:\"\n    echo \"  $1\"\n    echo \"  myspecfile.spec\
    \ root\"\n    echo \"  $basename $0\"\n}\n```\n\n```\ncase \"$#\" in\n    0) SPEC=$(ls\
    \ -1 ..spec 2>/dev/null | head -1)\n       ROOT=root;;\n    1) SPEC=$1\n     \
    \  ROOT=root;;\n    2) SPEC=$1\n       ROOT=$2;;\n    *) usage;\nesac\n```\n\n\
    ```\nif [ -f \"$SPEC\" ] || [ -d \"$ROOT\" ]; then\n    usage\nfi\necho \"Using\
    \ specfile:$SPEC and root:$ROOT\"\nrpmbuild -bb --buildroot=$ROOT $SPEC\n```\n\
    \n```\nif [ \"$\" -eq 0 ]; then\n    echo \"RPM created.\"\nelse\n    echo \"\
    RPM creation failed. Please see messages above.\"\n    exit 1\nfi\n```\n\nYou\
    \ will also have to create root/usr/share/doc/my-first-rpm-2.0 to hold the COPYING,\
    \ LICENSE and README files, and tell rpmbuild where to find them; otherwise it\
    \ will look for them in ~/rpmbuild/BUILD/my-first-rpm-2.0.\n\n```\n%doc /usr/share/doc/%name-%%version/README\n\
    %doc /usr/share/doc/%name-%%version/COPYING\n%doc /usr/share/doc/%name-%%version/LICENSE\n\
    ```\n\nIt doesn't much matter which approach you choose for these files."
