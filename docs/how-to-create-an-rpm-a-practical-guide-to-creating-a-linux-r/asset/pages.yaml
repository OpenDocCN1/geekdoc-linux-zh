  md: '# Chapter 8: There must be an easier!


    The method we''ve looked at in the past chapters works, and it works nicely with
    the concepts, particularly if you''re going to go further and create RPMs from
    sources. But it is really complicated. What''s the deal with creating directories
    called my-first-rpm-1.0-1.x86, clearing them out when you just want to change
    the version number, and all that hassle? Do you really do that, every time, Mr.
    Parker?


    Erm, no, actually. No, I don''t. Not often, and at least. What we''ve done so
    far is a little bit unorthodox, in that we''re not creating packages from tarballs,
    applying patches, and some of the other clever that RPM can do. But this next
    one is even worse: that''s okay, because it is also so very, much easier. It uses
    the “buildroot” flag in rpmbuild which makes the whole less complicated and easier
    to manage.


    Have a directory called “my-first-rpm”. Just, don''t bother with a version number,
    or .x86 or any other details. In fact, call it whatever you like, but it is convenient
    to give it some kind of descriptive name. Let''s create /home/rpm/my-first-rpm
    to contain the files. Under there, put a .spec file and a subdirectory called
    “root”. Like this:


    ```

    [rpm@packaging ~]$ mkdir my-first-rpm

    [rpm@packaging ~]$ cd my-first-rpm

    [rpm@packaging my-first-rpm]$] ls

    my-first-rpm.spec

    root

    [rpm@packaging my-first-rpm]$

    ```


    Under the “root” directory, put all of your usr/bin/my-first-program, etc/my-program.conf,
    and anything you need. Then to build the RPM, just run this script from the directory:


    ```

    #!/bin/bash


    SPEC=${1:-myspec.spec}

    ROOT=${2:-}

    ```


    ```

    if [ -f "$SPEC" ] || [ ! -d "$ROOT" ]; then

    echo "Usage: $0 specfile rootdirectory"

    else

    rpmbuild -bb --buildroot=$ROOT $SPEC

    fi

    ```


    You can use this script in any directory, with a single .spec file and a root/subdirectory.
    To maintain different versions of my-first-rpm, it is tidier to have a “1.0” and
    a “2.0” subdirectory under my-first-rpm, and have a .spec file and a root/ directory
    within each one. You could have multiple .spec files, and multiple root directories,
    named as you like, and pass their names as parameters:


    ```

    [rpm@packaging foo]$ rpmbuild.sh my-v1.spec my-v1

    ```


    A slightly longer but friendlier version of the script is shown below, and as
    with everything in this book – both versions can be downloaded from'
  merge: -1
