  md: "# Formatting Conventions Used in this Book\n\nThe formatting conventions in\
    \ this book are fairly standard; the main text is in a serif font, like the text\
    \ you are currently reading. System files and commands (such as rpmbuild, are\
    \ shown in monospaced font.\n/etc/hosts, and so on)\n\nOutput from interactive\
    \ sessions is show on a light gray background; commands that you are **bold text**,\
    \ for example, here you would type \"cd\" and \"mkdir rpmbuild\":\n\n```\n[rpm@packaging\
    \ ~]$ cd\n[rpm@packaging ~]$ mkdir rpmbuild\n```\n\nCallout boxes are shown on\
    \ a lighter background, with a border, and highlight particular noteworthy items,\
    \ including a reminder of where you can download sample files from:\n\n> If you\
    \ are using one of the Virtual Machine images, files can be found in the ~/files/\
    \ directory\nAlternatively, download the \"files\" bundle from\nhttp://bit.ly/howtocreaterpm\n\
    \nIf a line of input is too long to show on the width of a printed book, then\
    \ a backslash (\\) character is shown to indicate that the command continues onto\
    \ the next line (which will be indented). You can either type it in literally\
    \ as shown, as multiple lines, like this:\n\n```\ncp my-first-rpm-1.0-1.spec \\\
    \ \n~/rpmbuild/SPECS\n```\n\nOr you can remove the backslash (\\) and the line-break,\
    \ and enter it all one line, like this:\n\n```\ncp my-first-rpm-1.0-1.spec ~/rpmbuild/SPECS/\n\
    ```\n\nYou will probably find the second option easier. Any shell you are using\
    \ will accept either format.\n\nAt times, it can be more clear to display the\
    \ prompt as a single \"$\" symbol, rather than its usual, but longer format (like\
    \ \"[rpm@packaging take3]$\"), so instead of this:"
  merge: -1
  pgno: 9
- img_proc: true
  md: "```\n$rpm@packaging take3]$ mkdir \\\n~/rpmbuild/BUILD/my-first-rpm-2.0\n[rpm@packaging\
    \ take3]$ cp \\\n  COPYING ~/rpmbuild/BUILD/my-first-rpm-2.0/\n[rpm@packaging\
    \ take3]$ cp \\\n  LICENSE ~/rpmbuild/BUILD//my-first-rpm-2.0/\n```\n\nWe will\
    \ sometimes show the commands like this, where that makes it easier to read:\n\
    \n```\n$pwd\n/home/rpm/files/chapter3/take3\n$ mkdir ~/rpmbuild/BUILD/my-first-rpm-2.0\n\
    $ cp COPYING ~/rpmbuild/BUILD/my-first-rpm-2.0/\n$ cp LICENSE ~/rpmbuild/BUILD/my-first-rpm-2.0/\n\
    ```\n\nNotice that here the additional “pwd” command confirms that the current\
    \ location is “home/rpm/files/chapter3/take3”, since that there was no longer\
    \ clear from the prompt itself."
