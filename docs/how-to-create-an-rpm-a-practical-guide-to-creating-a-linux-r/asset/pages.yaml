  md: '# # Placing the Files


    To get these files included in the RPM, we need to put them into the $HOME/rpmbuild/BUILDROOT
    directory. At least, that is true of the first two files; we will look at the
    documentation files in a moment.


    Starting with the files in a directory called files/chapter3/take3 , copy them
    from where they are, into a directory called rpmbuild/BUILDROOT/$name-version-release.arch.
    In this case, that is $HOME/rpmbuild/BUILDROOT/my-first-rpm-2.0-1.x86_64. We create
    a mock root of the file system, which will be used to create the package:


    ```

    [rpmpackaging take3] pwd

    /home/rpm/files/chapter3/take3

    [rpmpackaging take3] ls -la

    my-first-program.config

    my-first-program-2.0-1.spec

    LICENSE

    -first-program README

    [rpmpackaging take3] mkdir -p ~/rpmbuild/BUILDROOT/\

    my-first-rpm-2.0-1.x86_64/usr/bin/

    [rpmpackaging take3] cp -rp ~/rpmbuild/BUILDROOT/\

    my-first-rpm-2.0-1.x86_64/usr/bin/

    [rpmpackaging take3] cp -rf my-first-program \

    ~/rpmbuild/BUILDROOT/my-first-rpm-2.0-1.x86_64/usr/bin/

    [rpmpackaging take3] cp -rf my-first-program.config \

    ~/rpmbuild/BUILDROOT/my-first-rpm-2.0-1.x86_64/etc/

    [rpmpackaging take3] $

    ```


    The documentation files are a different matter, because we don''t specify in the
    filesystem they go - %{name}-%{version}/README is a relative path, not an absolute
    path (it does not begin with "/"). When the RPM is built, the %docdir determines
    the location (/usr/share/doc) by default, but it could be anywhere. For these
    files, we put them into the BUILD directory, since that is where RPM expect to
    find them:


    ```

    $ pwd

    /home/rpm/files/chapter3/take3

    $ mkdir ~/rpmbuild/BUILD/my-first-rpm-2.0/

    $ cp COPYING ~/rpmbuild/BUILD/my-first-rpm-2.0/

    $ cp LICENSE ~/rpmbuild/BUILD/my-first-rpm-2.0/

    ```


    The whole tree now looks like this (the 1.0-1 rpm file from the previous build
    is still shown here):


    ```

    [rpmpackaging take3] cd ~rpmbuild/

