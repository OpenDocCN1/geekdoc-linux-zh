  md: '# Building the Package (Take 1)


    With this my-first-rpm-1.0-1.spec file, we are ready to create our first ever
    RPM file. We do this with the rpmbuild command, passing the -bb switch (for “Build
    Binary”), and finally, the name of our my-first-rpm-1.0-1.spec file:


    | Line | Text |

    | 1 | [rpm@packaging SPECS]$ rpmbuild -bb my-first-rpm-1.0-1.spec |

    | 2 | Processing files: my-first-rpm-1.0-x86_64 |

    | 3 | Checking for unpacked file(s): /usr/lib/rpm/check-files /home/rpm/rpmbuild/BUILDROOT/my-first-rpm-1.0-1.x86_64
    |

    | 4 | warning: Could not canonicalize hostname: packaging.sgpit.com |

    | 5 | Wrote: /home/rpm/rpmbuild/RPMS/x86_64/my-first-rpm-1.0-1.x86_64.rpm |

    | 6 | Executing(%clean): /bin/sh -e /var/tmp/rpm-tmp.ogGL83 |

    | 7 | + umask 022 |

    | 8 | + cd /home/rpm/rpmbuild/BUILD |

    | 9 | + /bin/rm -rf /home/rpm/rpmbuild/BUILDROOT/my-first-rpm-1.0-1.x86_64 |

    | 10 | + exit 0 |

    | 11 | [rpm@packaging SPECS]$ |


    I''ve added line numbers to the output, so that we can more easily discuss what
    happens here. On line 1, we run the rpmbuild command. Line 2 confirms that it
    is processing the RPM, and shows the full name of the RPM, as derived from the
    metadata provided in the .spec file.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'On line 3, rpmbuild checks whether there are any additional files in the BUILDROOT
    directory which were not mentioned in .spec file. We will come to this later,
    when we start adding files to our RPM, but this is a sanity check to ensure that
    nothing gets missed.


    Line 4 is when rpmbuild can''t resolve your server''s hostname (packaging.sgit,
    in this case) - we can easily resolve this by adding an entry in /etc/hosts. You
    may wonder why it tries to resolve it, but every RPM includes the name of the
    host it created, and rpmbuild tries to find the full DNS name of the server for
    this purpose. This metadata in the RPM can be useful for lots of reasons, but
    it''s worth bearing in mind that when you create a package, for internal use,
    for a single customer, or for public distribution, all recipients of the RPM file
    will also know your hostname. So don''t call your machine “customers.are.stupid.com”,
    for example!


    Line 5 confirms the RPM file has been successfully created, and tells you the
    resulting RPM file can be found.


    The output of, lines 6-10, show the execution of a small shell script that rpmbuild
    created. default clean script, which deletes everything from the BUILDROOT directory.
    Again, we will come to this later, but it is worth noting that your carefully-crafted
    contents will be deleted automatically unless you tell it not. A dangerous side-effect,
    for the unwary. But we don''t have any files (yet), so we don''t mind about that,
    or even notice it (yet)!


    We can now inspect our RPM file. It was created in the $HOME/rpmbuild/RPMS/x86_64
    directory. The rpm -qip command is a query for information of the uninstalled-package
    directory.


    ```

    [rpmpackaging SPEC] rpm -qip ~/rpmbuild/x86_64/my-first-rpm-1.0-1.x86_64.rpm

    Name : my-first-rpm

    Relocations: (not relocatable)

    Version : 1.0

    Vendor: (none)

    Release : 1

    Build Date: Sat 03 Jan 2015 12:29:58 GMT

    Install Date: (not installed)

    Build Host: packaging.sgit

    Group : Unspecified

    Source RPM: my-first-rpm-1.0-1.src.rpm

    Size : 0

    License: none

    Signature : (none)

    Summary : This is my first ever RPM

    Description :

    My First RPM

    [rpmpackaging SPECij]

    ```


    Congratulations! That is an entirely useless RPM file, but you have now crossed
    the biggest hurdle in creating an RPM. Getting all of this preparation work out
    of the way is the single biggest obstacle to creating your own bespoke, lovingly
    hand-crafted RPM files. There''s no stopping you now!'
