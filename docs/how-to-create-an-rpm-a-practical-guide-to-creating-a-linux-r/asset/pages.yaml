    YOUR_NAME=

    it also has some documentation to go with it, a README file:


    This is a very simple program.

    If YOUR_NAME is defined in /etc/my-first-program.conf, then it will say

    Hello to you by name.

    It will then display a message.


    As this is a GPL2 licensed program, I have also taken the COPYING and LICENSE
    files we noticed in the ettool package earlier. This is a requirement for GPL
    licensed software; if you are packaging up some existing software, it should come
    with whatever license files it requires. If you are packaging up your own software,
    you should provide whatever documentation is necessary for the license you choose.


    Because we have changed the actual software (by adding some, for the first time!),
    the Version number goes up, and the Release number resets to 1. So this is Version
