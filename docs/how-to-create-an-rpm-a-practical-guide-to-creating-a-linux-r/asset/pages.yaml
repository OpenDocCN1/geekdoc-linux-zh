  md: 'program.conf file Telling rpm that this is a configuration file allows it to
    give it special treatment during upgrades. See Chapter 7,"Replacing Files" for
    more information on how rpm treats configuration files. Line 15 is about the features
    available in our current version of rpm -CompressedFileName that file names are
    stored as (dirName,BaseName,dirIndex) rather than as a regular path, and PayloadHavePrefix
    means that files are stored with a "./" prefix. None of that is terribly important
    to us, however.


