  md: '# # Introduction


    The creation of RPM packages is often seen as a bit of a dark art by many in the
    IT industry, particularly those whose main experience and expertise is somewhere
    other than the (sometimes quite niche) Linux development community. This book
    is for these people, amongst others :-


    +   - Developers needing to package their code to for distribution

    - Systems Administrators needing to install and manage software over an estate
    of servers

    - DevOps needing to create or modify RPMs for a particular project or environment

    - Students wanting to learn about and/or experiment with the mechanisms of RPM


    Anybody else who is interested in understanding RPMs.


    There is some excellent (and free) RPM reference documentation online (see the
    Bibliography), but apparently none that are particularly accessible to the outsider,
    or even to the insider who just wants to accomplish what should be (and actually
    is) a pretty simple task, without learning any arcane specifics of the details
    of how RPM is implemented.


    This book is written for anybody who just wants to be able to create an RPM package;
    if you just want to pick up enough knowledge to get a few files into an RPM, nobody
    is going to preach at you that you are not exploiting the full, exquisitely potential
    of a finely-tuned RPM package. If you want to learn how to do more with RPM than
    just install a few files, we''ll cover that, too, and go on to cover all of the
    bits that you need to know about, so you can dip in and out of whichever chapters
    you particularly need at any moment. It may well turn out that as you start to
    create more and more powerful and flexible RPM packages, that you find yourself
    wanting to use more and more of its features.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Why RPM?


    There are many benefits of RPM over, say, distributing a tarball (.tar compressed
    archive); this book is more focussed on the practicality of how to create RPMs
    than on evangelism of any particular technology, but in one word, the key benefit
    of RPM is "metadata".'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Metadata


    The Oxford Dictionary defines Metadata as “A set of data that describes and gives
    information about other data.”. This is what makes an RPM so much more useful
    than a tarball or simply copying an executable onto a system. The RPM database
    keeps track of what packages are installed, files and features they provide, as
    well as other information, such as who created them, how they are licensed, and
    how many other details.


    To compare the tarball with the RPM file, both contain the required data - the
    installed files - but the RPM also includes lots of extra metadata. Whilst this
    puts an additional burden on the creator of the RPM, the benefits are huge, and
    the up-front cost is relatively low. Once you start updating your RPM, the benefits
    increase significantly, and the cost becomes vanishingly small.


    By providing a small amount of metadata about the software package, and about
    the files it contains, you can do far more with your systems than if you slap
    software onto them in a haphazard way. Just the fact that upgrading the package
    takes care of removing obsolete files as deploying new ones, is a massive win.


    Special handling of configuration files within the RPM is another benefit - because
    RPM knows which files are documentation, which are executables, which are configuration
    files, it can give them special treatment and deal more intelligently with them.


    RPM can also perform custom tasks during installation, removal, upgrades and even
    downgrades of packages, through the embedding of custom scripts within the package
    itself.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# YUM


    Yum (and its newer workalike, DNF) is a tool that works with repositories of RPMs
    as to be able to calculate all of the dependencies between RPMs, and install or
    upgrade all of those along with the RPM that the user requested to be installed.
    The following chapter shows the installation of the rpm-build package itself,
    including automatically downloading the dependencies for rpm-build, if you want
    to see a run-through of how this works.


    Installing RPMs by hand is quite possible without the intervention of Yum, but
    you can quite easily find yourself in "RPM Hell" – you''ve found the RPM that
    you need to install, but it requires some other library, so you have to find and
    download the RPM for the correct version of library. Once you''ve done that, you
    realise that this second RPM has dependencies of its own, so you have to find
    and download them, and so on down the rabbit hole. Yum uses this rich metadata
    to check and ensure that it can get hold of all the necessary RPMs to install
    the package that you need.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Preparation


    To work through the examples in this book, it will be very useful to have a system
    that you can work on. You do not need root access on the system where you create
    the RPM, but you will need root access to be able to install an RPM.


    If you already have a system in place to create and install RPMs on, skip to Chapter
    2; otherwise continue to Chapter 1 and download or create a Virtual Machine and
    prepare it as an environment in which we can create RPMs.


    You can download a Virtualbox virtual machine from http://bit.ly/howtocreateanrpm
    which has been configured with the necessary software and the files needed to
    work through the examples in this book.'
  merge: -1
