- img_proc: true
  md: '# Aside: Creating your own Repositories


    As an aside, a simpler Repo file looks like this:


    ```

    [root@packaging /etc/yum.reposd]# cat local.repo

    [local-filesystem]

    name=Local Filesystem Repo

    baseurl=file:///usr/local/rpms

    gpgcheck=0

    enabled=1

    ```


    For this to work, you can install the createrepo package, populate the /usr/local/rpms
    directory with RPM files, then run the “createrepo /usr/local/rpms” command to
    update the relevant metadata:


    ```

    [root@packaging ~]# createrepo /usr/local/rpms/

    Spawning worker 0 with 66 pkgs

    Workers Finished

    Gathering worker results


    Saving Primary metadata

    Saving file lists metadata

    Saving other metadata

    Generating sqlite DBs

    SQLite DBs complete

    ```


    You can see the newly-created metadata in the repodata/ subdirectory:


    ```

    [root@packaging ~]# ls /usr/local/rpms/repodata

    e4e7a3b85f611ced241c686a0d7040adb9aaf0584aef19f5412099fc19d7a5-

    files.xml.gz

    57f627abc5d572f31599bb003387ae978d816c57ae5e57fa01083fc0169595-

    files.sqlite.bz2

    8065bd31b106ff6d6ac430d94193ca4bf2704db42f0491f6360f350d38c-

    other.sqlite.bz2

