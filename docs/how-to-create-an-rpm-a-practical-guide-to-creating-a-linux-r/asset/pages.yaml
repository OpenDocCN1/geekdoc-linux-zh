  md: '# # Appendix A: Importing the OVA Appliance into VirtualBox


    The VirtualBox image is hosted by Google Drive - you do not need a Google account
    to download the image. Just point your browser at http://bit.ly/rpmbuild - this
    will redirect you to the URL at Google Drive, showing RPM.ova containing three
    files:


    ![](img/e1630953eac5dd6e22589b3a1ae13d96_68_0.png)


    Hover your mouse above the top center of the window, and you should get a “Download”
    link which will download the RPM.ova file (contains RPM-disk1.vmdk, RPM.mf, and
    RPM.ovf - you do not need to download them separately).


    Google Drive doesn''t offer a virus-scanning facility for large files, so it asks
    for confirmation that you want to download this file. Click on “Download anyway”
    and the download will start.


    ![](img/e1630953eac5dd6e22589b3a1ae13d96_68_1.png)


    Once the download has completed, launch the VirtualBox application.


    ![](img/e1630953eac5dd6e22589b3a1ae13d96_68_2.png)


    From the File menu, choose “Import Appliance...”,


    ![](img/e1630953eac5dd6e22589b3a1ae13d96_68_3.png)'
