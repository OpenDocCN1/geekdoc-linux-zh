    It is worth saying that although we take steps to disable the feature, automatically
    cleaning out the BUILDROOT directory is the right thing for rpmbuild to do, since
    it assumes that we are using all of its features, and we wouldn''t want potentially
    broken artifacts left around from previous builds. What we are doing here is a
    bit of a naughty shortcut for creating RPMs, but this method is Good Enough™ for
    lots of uses, and I find that a spec file like my-first-rpm-2.0-1.spec is very
    nearly a useful template to have around for quickly putting an RPM package together.
    Three more small tweaks – Permissions, a Install Scripts, and Change Logs – will
    make it more genuinely useful. These are covered in the next three chapters.'
