  md: '# Appendix B: Configuring a Static IP Address


    If you want the virtual machine to have a static IP address, login as the root
    user, go to the /etc/sysconfig/network-scripts directory, and look at the STATIC.ifcfg-eth0
    file there:


    ```

    [root@packaging ~]# # cd /etc/sysconfig/network-scripts

    [root@rpm network-scripts]# cat STATIC.ifcfg-eth0

    DEVICE=eth0

    HWADDR=08:00:27:BC:DB:66

    TYPE=Ethernet

    UUID=7c866f8-1ffe-40c3-99ce-9aea18703256

    ONBOOT=yes

    NM_CONTROLED=yes

    BOOTPROTO=static

    ADDR=192.168.1.99

    NETMASK=255.255.255.0

    GATEWAY=192.168.1.1

    DNS1=192.168.1.1

    [root@rpm network-scripts]#

    ```


    Look in particular the last four lines; they may suit your environment, or you
    may need different values to fit on your network. Copy the file over of the ifcfg-eth0
    file (this is the file that the system actually reads at boot-time for the eth0
    device), and edit it as appropriate:


    ```

    [root@rpm network-scripts]# cp STATIC.ifcfg-eth0 ifcfg-eth0

    cp: overwrite `ifcfg-eth0`? y

    [root@rpm network-scripts]# vi ifcfg-eth0

    ```


    Assuming you are comfortable with the vi text editor, go ahead and set the values
    appropriate for your network, restart the networking service:


    ```

    [root@packaging network-scripts]# service network restart

    Shutting down interface eth0: [ OK ]

    Shutting down loopback interface: [ OK ]

    Bringing up loopback interface: [ OK ]

    Bringing up interface eth0:

    Determining IP information for eth0... done. [ OK ]

    [root@packaging network-scripts]#

    ```'
  merge: -1
