  - "[PAGE 50]\n\n# Preinstall Script\n\nBefore installing any of the files contained\
    \ within the RPM, the %pre script is run. This can be used to prepare the system\
    \ in ways that simply copying files cannot. For example, the Apache httpd package\
    \ could have a pre-install script that creates the apache user account.\n\nAs\
    \ standard, if the preinstallation script was to fail in some way, the RPM would\
    \ not be installed at all. This isn't the desired behaviour, so there are various\
    \ ways around it - one approach is to decide that failing to create the user account\
    \ would be a bad thing, but not enough serious to fail to install the software.\
    \ It wouldn't be able to set the file ownership correctly if the apache account\
    \ doesn't exist, but the files can still be installed. In that case, %pre script\
    \ can look as below.\n\n> Note: The || true at the end means \"if the command\
    \ fails, run the true command instead\". The true command is a special builtin\
    \ command which returns success (return code zero) which has the effect that RPM\
    \ is happy that the overall operation succeeded. There is another command, \"\
    :\", which is in essence the same as true, so you will sometimes see the slightly\
    \ cryptic || :\" syntax. The \\ at the end of the line is simply for line wrapping\
    \ -it means that the command continues on the next line.\n\n```\n%pre\nusr/sbin/useradd\
    \ -c \"Apache\" \\\n  -u 48 -s /sbin/nologin -r \\\n  -d /usr/share/httpd \\\n\
    \  apache 2> /dev/null || true\n```"
  - '[PAGE 51]


    # Postinstall Script


    The postinstall script is executed after the file have been installed. This can
    do any tidying up required, and is typically used to customize configuration files,
    and to register the startup script via the chkconfig command. An example might
    be:


    ```

    %post

    /sbin/chkconfig --add httpd

    ```'
  - '[PAGE 52]


    # Pre-Uninstall Script


    The preuninstall (%preun) script is executed before the files are removed from
    the system. This can still make use of the configuration files, and run the programs
    one last time, if necessary, to do any tidying up. Typical tasks here include
    stopping the service, unregistering it via chconfig, and clearing out any additional
    files it may have created whilst running. This section can also be used to clear
    out configuration files or data files, though this is potentially quite risky
    as you don''t want to delete a user''s carefully-crafted configuration file, for
    example. An example script could be:


    ```

    %preun

    /sbin/service httpd stop

    /sbin/chkconfig --del httpd

    ```'
- md: '

    # Post Uninstall Script


    The postuninstall script (%postun) completes the foursome. This is executed after
    the files have all been removed, so /sbin/ldconfig is sometimes run, to update
    the system about any library files which have been removed. The Red Hat update-alternatives
    script is also sometimes run, like in this example from the antlr RPM:


    ```

    %postuninstall

    if [ $1 -eq 0 ]; then

    /usr/sbin/update-alternatives --remove antlr /usr/bin/antlr-java

    fi

    ```


    There is a conditional statement here. Continue to the next section for what the
    $1 variable means for these scripts.


    # Install Count – Upgrading RPMs


    The previous example showed the the $1 variable. This is passed to all of your
    scripts, and is a count of how many copies of this RPM are currently installed
    (it may be possible for more than one to be installed, for example, the 32-bit
    and 64-bit versions of a library). By modifying the spec script above, we can
    easily see what this value is in different scenarios.


    Putting aside multiple architectures of an RPM for the moment, consider a typical
    single-architecture RPM. When you install a new RPM for the first time, the $1
    (install variable) will be zero (0) when the install scripts run. The uninstall
    scripts are not run during initial installation, so these are “n/a” in the table
    below. When you upgrade, this will be 2 for the install scripts and 1 for the
    uninstall scripts. When you remove the RPM, this will be 0 in the uninstall scripts
    (the pre- and post- scripts don’t run during uninstallation, so again they are
    “n/a”).


    | Action | pre | post | preun | postun |

    | --- | --- | --- | --- | --- |

    | Initial install | 0 | 0 | n/a | n/a |

    | Upgrade | 2 | 2 | 1 | |

    | Removal | n/a | n/a | 0 | |


    This information is most useful when upgrading the RPM - although the upgrade
    process consists of removing the old RPM and the new one, during an upgrade the
    uninstall scripts will know [ because $1 -ne 0 ] that there will still be copies
    of this RPM installed after they’ve finished, so any drastic tidying up (such
    as unregistering from update-alternatives, as in the antlr example above) does
    not need to be performed.


    This can help you create robust, stable RPMs which can safely and sensibly installed,
    upgraded and removed, without causing any surprises for the user.


    If there are other instances of the RPM installed - as multiple architectures
    - the numbers will be higher to reflect that state. Because of that, the most
    sensible approach (for the most common case) is simply to test whether or not
    [ $1 -eq 0 ], or if upgrading, [ $1 -gt 1 ] (to check if it is greater than 1,
    rather than precisely 2).


    An example of an updated .spec file to show this information is as the previous
    .spec file, but with one additional detail in the echo statement. I will also
    bump its release number from 1 to 2.


    ```

    Release: 2

    %pre

    echo "In the %pre preinstall script now. ($1 copies installed)"

    ```


    %post

    echo "In the %post install script now. ($1 copies installed)"


    %preun

    echo "In the %preun pre-uninstall script now. ($1 copies installed)"


    %postun

    echo "In the %postun post-uninstall script now. ($1 copies installed)"


    Now run rpmbuild to create the new RPM:


    ```

    $ rpm -bb my-first-rpm-4.0-1.spec

    ```


    Now, when we install, upgrade, and remove the updated RPM, we can see the count
    changing:


    # Install:


    ```

    [rpm@packaging SPECS]$ sudo rpm -ivh \

    ../RPMS/x86_64/my-first-rpm-4.0-1.x86_64.rpm

    Preparing...

    ############################################

    [100%]

    In the %pre preinstall script now. (1 copies installed)

    1:my-first-rpm #################################

    [100%]

    In the %post postinstall script now. (1 copies installed)

    [rpm@packaging SPECS]$

    ```


    # Upgrade:


    Now, copy my-first-rpm-4.0-2.spec to my-first-rpm-4.0-3.spec, and increment the
    Release from 2 to 3, so that we can create it. Build the new RPM, and upgrade,
    using

    rpm -Uvh:


    ```

    [rpm@packaging SPECS]$ sudo rpm -Uvh \

    ../RPMS/x86_64/my-first-rpm-4.0-3.x86_64.rpm

    Preparing...

    ############################################

    [100%]

    In the %pre preinstall script now. (2 copies installed)

    1:my-first-rpm #################################

    [100%]

    In the %post postinstall script now. (2 copies installed)

    In the %preun pre-uninstall script now. (1 copies installed)

    In the %postun post-uninstall script now. (1 copies installed)

    ```


    # Remove:


    ```

    [rpm@packaging SPECS]$ sudo rpm -e my-first-rpm

    In the %preun pre-uninstall script now. (0 copies installed)

    In the %postun post-uninstall script now. (0 copies installed)

    ```


    ```

    [rpm@packaging SPECS]$

    ```


    # Chapter 6: ChangeLog


    The final thing to add to our simple spec file is a ChangeLog. This is a useful
    piece of documentation to add to an RPM, as it can track what changes were made,
    why, when, and by whom. RPM is rather picky about the formatting of Changelog
    entries; you can include email addresses, etc, but this will suffice for:


    ```

    %changelog

    * Tue Feb 23 2016 Steve Parker

    * Bug fixes and improvements

    * Mon Feb 22 2016 Steve Parker

    * Initial release.

    ```


    Append this to the end of the spec file, and we should have a presentable RPM
    file:


    ```

    [rpm@packaging SPECS]$ cat my-first-rpm-5.0-1.spec

    Name:\           my-first-rpm

    Release:\        1

    Summary:\        This is my first ever RPM

    License:\        GPL2

    Version:\        5.0

    Vendor:\         Steve Parker

    Group:\          Documentation

    ```


    %description

    This is my first RPM package. I can describe it more thoroughly here. It is normal
    to format these sections as 80 columns wide, so that it can easily read on any
    screen.


    %clean

    echo "Not cleaning up in this case."


    ```

    %files

    %defattr(0755,root,root)

    /usr/bin/my-first-program

    %attr(0644,root,root) %config /etc/my-first-program.conf

    %doc %name-%version/README

    %doc %name-%version/COPYING

    %doc %name-%version/LICENSE

    ```


    ```

    %changelog

    * Tue Feb 23 2016 Steve Parker

    * Bug fixes and improvements

    * Mon Feb 22 2016 Steve Parker

    * Initial release.

    ```


    Create the package, as before:


    ```

    [rpm@packaging SPECS]$ rpmbuild -bb my-first-rpm-5.0-1.spec

    Processing files: my-first-rpm-5.0-1.x86_64

    Executing(%doc): /bin/sh -e /bin/sh -e /var/tmp-rpm.tmp

    + umask 022

    $ cd /home/rpm/pmbuild

    $ DOCDIR=/home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64

    $ mkdir -p /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/usr/doc

    $ cp -pr my-first-rpm-5.0/README /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/usr/doc

    $ cp -pr my-first-rpm-5.0/COPYING /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/usr/doc

    $ cp -pr my-first-rpm-5.0/LICENSE /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/usr/doc

    $ chmod 644 /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/usr/doc/README

    $ chmod 644 /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/usr/doc/COPYING

    $ chmod 644 /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/usr/doc/LICENSE

    $ chmod 755 /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/usr/bin/my-first-program

    $ chmod 644 /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64/etc/my-first-program.conf

    $ tar -C /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64 -czf /home/rpm/pmbuild/RPMS/x86_64/my-first-rpm-5.0-1.x86_64.rpm

    $ rm -rf /home/rpm/pmbuild/ROOT/my-first-rpm-5.0.x86_64

    $ exit 0

    ```


    [rpm@packaging SPECS]$


    If you have root access, you can now upgrade to version 5.0-1 of the RPM, and
    inspect the new permissions and Change Log.


    ```

    [rpm@packaging SPECS]$ sudo rpm -Uvh ../RPMS/x86_64/my-first-rpm-5.0-1.x86_64.rpm

    Preparing...

    [100%]

    ############################################

    1:my-first-rpm ############################################

    [100%]

    [rpm@packaging SPECS]$ rpm -q --changelog my-first-rpm

    * Tue Feb 23 2016 Steve Parker

    Bug fixes and improvements

    ```


    * Mon Feb 22 Steve Parker

    Initial release.

    '
