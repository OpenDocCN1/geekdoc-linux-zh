    /my-first-rpm-2.0-2.x64/usr/share/doc/my-first-rpm-2.0/COPYING\n[rpmpackaging\
    \ rebuild]\n```\n\n值得注意的是，尽管我们采取了措施来禁用该功能，但自动清理 BUILDROOT 目录是 rpmbuild 应该执行的正确操作，因为它假设我们正在使用它的所有功能，而且我们不希望留下之前构建中可能损坏的产物。我们在这里所做的是创建\
    \ RPM 的一种“坏习惯”捷径，但这种方法对于许多用途来说是**足够好 (Good Enough™)**，我发现像 `my-first-rpm-2.0-1.spec`\
    \ 这样的 spec 文件几乎可以作为一个快速组装 RPM 包的有用模板。再进行三个微调——权限、安装脚本和日志——将使其变得更具实用性。这些将在接下来的三个章节中介绍。\n\
    \n## 第 4 章：权限 (Permissions)\n\n默认情况下，打包文件的权限将与它们在你的 BUILDROOT 目录中的权限完全相同，就像 tar\
