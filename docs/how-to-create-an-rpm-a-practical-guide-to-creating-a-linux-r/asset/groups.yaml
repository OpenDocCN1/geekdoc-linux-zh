- md: '

    # YUM


    Yum (and its newer workalike, DNF) is a tool that works with repositories of RPMs
    as be able to calculate all of the dependencies between RPMs, and install or upgrade
    all of those along with the RPM that the user requested to be installed. The following
    chapter shows the installation of the rpm-build package itself, including automatically
    downloading the dependencies for rpm-build, if you want to see a run-through of
    how this works.


    Installing RPMs by hand is quite possible without the intervention of Yum, but
    you can quite easily find yourself in "RPM Hell" – you''ve found the RPM that
    you need to install, but it requires some other library, so you have to find and
    download the RPM for the correct version of library. Once you''ve done that, you
    realise that this second RPM has dependencies of its own, so you have to find
    and download them, and so on down the rabbit hole. Yum uses this rich metadata
    to check and ensure that it can get hold of all the necessary RPMs to install
    the package that you need.


    # Preparation


    To work through the examples in this book, it will be very useful to have a system
    that you can work on. You do not need root access on the system where you create
    the RPM, but you will need root access to be able to install an RPM.


    If you already have a system in place to create and install RPMs on, skip to Chapter
    2; otherwise continue to Chapter 1 and download or create a Virtual Machine and
    prepare it as an environment in which we can create RPMs.


    You can download a Virtualbox virtual machine from http://bit.ly/howtocreateanrpm
    which has been configured with the necessary software and the files needed to
    work through the examples in this book.


    # Chapter 1: Preparing to Create RPMs


    ## Step 1. Install VirtualBox


    You could use any virtual platform, or you could use any existing RPM-based GNU/Linux
    operating system, whether on a physical or virtual server. If you are planning
    to use an existing system, whether physical or virtual, you can skip to Step 3,
    “Connect.” Otherwise, read on instructions on installing VirtualBox and downloading
    the virtual machine that has been prepared for you to use along with this book.


    If you are on a Debian-based Linux system (such as Ubuntu, Mint, or Debian), you
    should be able to just “sudo apt-get install virtualbox”, or search for it in
    Software Centre. For CentOS and other Red Hat derivatives, see https://wiki.centos.org/HowTos/Virtualization/VirtualBox
    for instructions on how to install VirtualBox.


    If you are on a Windows, Mac OSX GNU/Linux distribution not mentioned above, you
    can download VirtualBox from https://www.virtualbox.org/wiki/Downloads.


    ## Step 2. Download Image


    For the purposes of this book, I have provided a CentOS 6.7 VirtualBox image,
    which you can download from http://bit.ly/rpmbuild - this is a 346M CentOS 6.7
    image with the rpmbuild package already installed, and the EPEL repository also
    configured, though not enabled - if you would like to use the EPEL packages, simply
    edit /etc/yum.repos.d/epel.repo to say “enabled=1” rather than “enabled=0” in
    the very first [epel] stanza.


    The root password is rpm, though you should not need to use the root account to
    create RPMs; There is a user “rpm” configured; the password is “rpm”. The /etc/sudoers
    file is also configured to allow the rpm user to access the root account via sudo
    (with a password prompt).


    The image is configured with an 8GB root disk, set to expand as required, although
    it will add more files within the virtual machine. So you should ideally allow
    up to 8Gb room on the device you install it on.


    To download the VM, point your browser to http://bit.ly/rpmbuild, from where you
    can download an OVA image which you can import as an Appliance into VirtualBox.


    See Appendix A for a walkthrough on installing the OVA image.


    You may need to reconfigure the network device; it is set as a DHCP client, and
    bridged to the “eth1” device. Your NIC may not be called “eth1”; it may be “eth0”
    or if on Windows, have some more verbose name.


    See Appendix B for details on setting a static IP address on the virtual machine.


    ## Step 3. Connect


    The VirtualBox console itself isn''t the easiest place to work, you don''t get
    the full copy/paste features, and the console is small and clunky; for a more
    flexible working environment, you will probably want to log in over the network.
    If you''ve got a Linux or Mac system on the network to work from, you can use
    ssh to connect to the virtual machine. You will need to add the host''s SSH key
    to your .known hosts file when first. This is done automatically for when you
    reply "yes" at the "Are you sure you want to continue connecting"


    ```

    steve@hostbox:~$ ssh root@192.168.1.30

    (192.168.1.30)'' can''t be established.

    The authenticity of host ''192.168.1.30''

    RSA key fingerprint 5d:a5:f4:c0:6d:75:3d:85:42:7e:34:6f:aa:25.

    Are you want to continue connecting (yes/no?) yes

    Warning: Permanently added ''192.168.1.30'' (RSA) to the list of known hosts.

    root@192.168.1.30 password: rpm

    Last login: Wed Aug 26 17:56:35 2015

    [root@packaging]#

    ```


    If you are on a Windows host, the free and open source PuTTY is an excellent client.
    You can get it from http://www.putty.org/ (or just type "putty" into your preferred
    search engine; it is likely to find the right result) You just need the standalone.exe
    for Windows on Intel, though you can install other utilities if you like.


    ## Step 4. Install rpm-build


    If you have downloaded VirtualBox, you can skip this step; if you''ve got your
    system and the rpm-build package is not installed, you will need to install it
    now. Note that although it provides the rpmbuild program (with no hyphen in name),
    the package is called rpm-build with a hyphen. See Appendix C for how to set up
    a repository, whether from a local DVD image.


