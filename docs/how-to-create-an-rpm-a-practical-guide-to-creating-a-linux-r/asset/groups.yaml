    # Chapter 3: Creating a Useful Binary RPM


    Now you can create an RPM file, you can start adding files to it, and start to
    specify all sorts of impressive-looking metadata to the package. We will start
    with the metadata. Lots of the rpm -qip output shown at the end of the previous
    section looks like the RPM was created by somebody who was barely capable of making
    an RPM at all, and who stopped as soon as they got something that even vaguely
    worked. We can do so much better than that, and it isn''t even difficult!


    Down the left hand column of the “rpm -qip output, we''re pretty much okay. We
    can specify what group of packages this belongs to (see Appendix D for a list
    of suggested groups).


    The second column is more administrative information, including licensing information.
    The subject of licensing is worthy of a little digression:'
  - '[PAGE 33]


    # Licensing


    In the second column, we have not specified a Vendor or a License. It is also
    possible to specify a Packager, if that is different from the Vendor (for example,
    Red Hat might package software created by the Apache Software Foundation for inclusion
    into Red Hat Enterprise Linux, making ASF the Vendor, but Red Hat the Packager).
    For the first version of the package, we did actually specify a License of “none”
    because rpmdbbuild refuses to create the package if you don’t put any text. It
    doesn’t make sense to distribute anything without some kind of license. The GPL
    and BSD licenses are the most common in a typical GNU/Linux distribution. You
    can just as easily specify a proprietary software license here, too. Normally
    the word “Proprietary” is used in this case. Whatever the license, it is common
    to include a licensing text file in the package. On Red based systems, this would
    typically be in /usr/share/doc/{name}-{version}/LICENSE. For example, the ethtool
    package on Red 6 comes with these files:


    ```

    [rpmpackaging SPECS]$ rpm ql ethtool

    /sbin/ethtool

    /usr/bin/ethtool

    /usr/share/doc/ethtool-3.5/AUTHORS

    /usr/share/doc/ethtool-3.5/COPYING

    /usr/share/doc/ethtool-3.5/ChangeLog

    /usr/share/doc/ethtool-3.5/LICENSE

    /usr/share/doc/ethtool-3.5/NEWS

    /usr/share/doc/ethtool-3.5/README

    /usr/share/man/man8/ethtool.8.gz

    ```


    As well as the binary itself (/usr/sbin/ethtool is just a link to /sbin/ethtool,
    in case you were wondering) and the ethtool.8.gz man page, there are a fairly
    typical set of text files in /usr/share/doc to accompany the program. The License
    field in the spec file does not need to go into great detail, but just lets somebody
    know what class of license the package is distributed under.'
  - '[PAGE 34]


    # Building the Package (Take Two)


    For a second version of my RPM, update the first spec file, and add some more
    detail.


    > The updated file can be found in files/chapter3/take2.if if you have downloaded
    my image, or it can be downloaded (as all these files) from the "files" bundle
    at http://build/howtocreaterpm


    We should add a few lines of description - this is normally a paragraph or so,
    describing the package in more detail than the one-line format allows.


    Because this book is Documentation, I will also say that my RPM itself is part
    of the Documentation group of packages. Your RPM might be Applications/System,
    or Amusements/Games, or something else — See Appendix E for a list of categories.


    I will also add a License, and a Vendor. I have increased the Release from 1 to
    2. The Release must always be an integer, and it goes up whenever you make a new
    release from the version of the software. If the software itself changes, then
    the Version field would need to be updated, too. You can think of Releases, Versions
    and RPM names like this:


    | Event | Version Release | RPM Name |

    | First Release of New Software | 1.0 | 1 | name-1.0-1 |

    | Software is updated to version 1.1 | 1.1 | 1 | name-1.1-1 |

    | Version 1.1 is repackaged with a better description | 1.1 | 2 | name-1.1-2 |

    | Software is updated to version 1.2 | 1.2 | 1 | name-1.2-1 |

    | Version 1.2 is repackaged with updated Dependencies | 1.2 | 2 | name-1.2-2 |

    | Version 1.2 is repackaged with updated symbolic links, no code change | 1.2
    | 3 | name-1.2-3 |

    | Software is updated to | 1.3 | 1 | name- |'
