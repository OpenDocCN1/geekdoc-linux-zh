    # YUM


    Yum（以及它更新的替代品 DNF）是一个与 RPM 仓库工作的工具，它能够计算 RPM 之间所有的依赖关系，并安装或升级用户请求安装的 RPM 及其所有依赖项。本章将展示
    `rpm-build` 软件包本身的安装，如果你想查看其工作原理，它还包括自动下载 `rpm-build` 的依赖项。


    在没有 Yum 干预的情况下，手动安装 RPM 是完全可能的，但你很容易发现陷入了“RPM 地狱”——你找到了需要安装的 RPM，但它需要另一个库，因此你必须找到并下载正确版本库的
    RPM。一旦你完成了这一步，你会发现这第二个 RPM 也有它自己的依赖，所以你必须继续寻找并下载它们，如此循环地掉进兔子洞。Yum 利用这些丰富的元数据来检查并确保它可以获取安装你所需软件包的全部必要
    RPM。


    # 准备工作


    为了完成书中的示例，拥有一个可以操作的系统将非常有帮助。在创建 RPM 的系统上不需要 root 权限，但在安装 RPM 时，你需要 root 权限。


    如果你已经有一个可以用来创建和安装 RPM 的系统，请跳到第 2 章；否则，请继续第 1 章，下载或创建一个虚拟机，并将其准备为我们创建 RPM 的环境。


    你可以从 http://bit.ly/howtocreateanrpm 下载 Virtualbox 虚拟机，该虚拟机已经配置了必要的软件以及完成书书中示例所需的文件。


    # 第 1 章：准备创建 RPM


    ## 第 1 步：安装 VirtualBox


    你可以使用任何虚拟平台，也可以使用任何现有的基于 RPM 的 GNU/Linux 操作系统，无论是在物理服务器还是虚拟机上。如果你计划使用现有的系统（无论物理还是虚拟），可以跳到第
    3 步“连接”。否则，请继续阅读关于安装 VirtualBox 以及下载本本书配套使用的准备虚拟机的说明。


    如果你使用的是基于 Debian 的 Linux 系统（如 Ubuntu、Mint 或 Debian），你应该可以直接运行 `sudo apt-get install
    virtualbox`，或者在软件中心中搜索。对于 CentOS 和其他 Red Hat 派系，请参阅 https://wiki.centos.org/HowTos/Virtualization/VirtualBox
    了解如何安装 VirtualBox。


    如果你使用的是上述未提到的 Windows、Mac OSX GNU/Linux 发行版，可以从 https://www.virtualbox.org/wiki/Downloads
    下载 VirtualBox。


    ## 第 2 步：下载镜像


    为了本书的内容，我提供了一个 CentOS 6.7 VirtualBox 镜像，你可以从 http://bit.ly/rpmbuild 下载——这是一个 346M
    的 CentOS 6.7 镜像，已安装了 rpmbuild 软件包，并配置了 EPEL 仓库但尚未启用——如果你想使用 EPEL 软件包，只需编辑 /etc/yum.repos.d/epel.repo，将第一个
    [epel] 节中的 `enabled=0` 改为 `enabled=1` 即可。


    root 密码为 `rpm`，尽管你不需要使用 root 账户来创建 RPM；系统配置了一个名为 `rpm` 的用户；密码为 `rpm`。/etc/sudoers
    文件也配置为允许 rpm 用户通过 sudo 访问 root 账户（需要密码提示）。


    该镜像配置了 8GB 的根磁盘，设置为根据需要扩展，尽管它会在虚拟机内部增加更多文件。因此，理想情况下，你应该在安装它的设备上留出最多 8GB 的空间。


    要下载虚拟机，请将浏览器指向 http://bit.ly/rpmbuild，从那里你可以下载一个 OVA 镜像，并将其作为设备（Appliance）导入 VirtualBox。


    请参考附录 A 获取安装 OVA 镜像的步骤。


    你可能需要重新配置网络设备；它被设置为 DHCP 客户端并桥接到“eth1”设备。你的网卡可能不名为“eth1”；可能是“eth0”，或者在 Windows
    上有更复杂的名称。


    请参考附录 B 获取在虚拟机上设置静态 IP 地址的详情。


    ## 第 3 步：连接


    VirtualBox 控制台本身不是最方便的操作的地方，你无法使用复制/粘贴功能，而且控制台小而笨；为了更灵活的工作环境，你可能希望通过网络登录。如果你在网络上有一个可以工作的
    Linux 或 Mac 系统，可以使用 ssh 连接到虚拟机。第一次连接时，你需要将主机的 SSH 密钥添加到你的 .known hosts 文件中。当你对“Are
    you sure you want to continue connecting”回答“yes”时，这会自动完成。


    ```

    steve@hostbox:~$ ssh root@192.168.1.30

    (192.168.1.30)'' can''t be established.

    The authenticity of host ''192.168.1.30''

    RSA key fingerprint 5d:a5:f4:c0:6d:75:3d:85:42:7e:34:6f:aa:25.

    Are you want to continue connecting (yes/no?) yes

    Warning: Permanently added ''192.168.1.30'' (RSA) to the list of known hosts.

    root@192.168.1.30 password: rpm

    Last login: Wed Aug 26 17:56:35 2015

    [root@packaging]#

    ```


    如果你是 Windows 主机，PuTTY 是一个很好的客户端。你可以从 http://www.putty.org 获取（在 Windows 上只需要一个独立的
    .exe 文件）。


    ## 第 4 步：安装 rpm-build


    如果你已经下载了 VirtualBox，可以跳过此步；如果你已有系统但未安装 rpm-build 软件包，则需要安装它。请注意，虽然提供了 rpmbuild
    程序（不带连字符），但软件包名为 rpm-build（带连字符）。请参考附录 C 获取如何从本地 DVD 镜像设置仓库。


