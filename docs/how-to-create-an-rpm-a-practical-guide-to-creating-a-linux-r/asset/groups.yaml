    ## 第 3 章：创建一个实用的二进制 RPM


    现在你可以创建一个 RPM 文件了，你可以开始向其中添加文件，并开始为软件包指定各种看起来很专业的元数据。我们将从元数据开始。上一节末尾显示的许多 `rpm
    -qip` 输出看起来，这些 RPM 就像是由一个几乎不会制作 RPM 的人创建的，而且只要弄出一个稍微有点能用的东西就停止了。我们可以做得好得多，而且这并不困难！


    在 `rpm -qip` 输出的左侧列中，我们的情况还不错。我们可以指定该包属于哪个包组（建议组的列表请参见附录 D）。


    第二列是更多的管理信息，包括许可信息。许可这个主题值得稍微题题一下：


    ### 许可


    在第二列中，我们没有指定供应商（Vendor）或许可类型（License）。如果打包者（Packager）与供应商不同，也可以指定打包者（例如，红帽公司可能会对
    Apache 软件基金会创建的软件进行打包，以将其包含在 Red Hat Enterprise Linux 中，使 ASF 为供应商，而 Red Hat 为打包者）。对于软件包的第一个版本，我们实际上指定了许可为“none”，因为如果你不放入任何文本，`rpmdbbuild`
    将拒绝创建软件包。在没有某种许可的情况下分发任何东西是没有意义的。GPL 和 BSD 许可是 GNU/Linux 发行版中最常见的。你也可以同样地在这里指定专有软件许可。通常情况下使用“Proprietary”一词。无论许可是什么，在软件包中包含一个许可文本文件是常见的。在基于
    Red 的系统中，这通常位于 `/usr/share/doc/{name}-{version}/LICENSE`。例如，Red 6 上的 `ethtool`
    包带有这些文件：


