    directory. At least, that is true of the first two files; we will look at the
    documentation files in a moment.


    Starting with the files in a directory called files/chapter3/take3 , copy them
    from where they are, into a directory called rpmbuild/BUILDROOT/$name-version-release.arch.
    In this case, that is $HOME/rpmbuild/BUILDROOT/my-first-rpm-2.0-1.x86_64. We create
    a mock root of the file system, which will be used to create the package:


