    # # Chapter 4: Permissions


    As standard, the files will be packaged with exactly the same permissions as they
    are found in your BUILDROOT directory, but as tar does. That is fine, as far as
    it goes, but the files are likely to be owned by your own username, which is probably
    not what you want.


    You can specify the default permissions for your file, when you don''t give any
    direct requirements, by using the %defattr parameter, just after the %files directive.
    You can override this with the %attr directive for any given file. For example,
    to set the default permissions to 0755, owner root, group root, but have the configuration
    file with permissions 0644, you can use this in spec file:


    ```

    %files

    %defattr(0755,root,root)

    /usr/bin/my-first-program

    %attr(0644,root,root)%config /etc/my-first-program

    %doc %name-version/README

    %doc %name-version/COPYING

    %doc %name-version/LICENSE

    ```


    Copy the my-rpm-2.0-1.spec file to my-rpm-3.0-1.spec, update the Version to 3,
    reset the Release to 1, and copy the BUILDROOT to have a directory name which
    matches the new Release:


    ```

    [rpm@packaging SPECS] $ cp my-rpm-2.0-1.spec my-rpm-3.0-1.spec

    [rpm@packaging SPECS] $ vi my-rpm-3.0-1.spec (just to update the Release)

    [rpm@packaging SPECS] $ cd ../BUILDROOT/

    [rpm@packaging BUILDROOT] $ cp -r my-rpm-2.0-1.x86_64/ my-rpm-3.0-1.x86_64/

    ```


    When you install the RPM, you can see that the permissions are set in the spec
    file:


    ```

    $ rpm -bb my-first-rpm-3.0-1.spec

    $ rpm -ivh RPM/x86_64/my-first-rpm-3.0.1.x86_64.rpm

    $ ls -l /usr/bin/my-first-program

    -rwxr-xr-x 1 root root 227 /usr/bin/my-first-program

    $ ls -l /etc/my-first-program.config

    -rw-r--r-- 1 root root 140 /etc/my-first-program.config

    ```'
