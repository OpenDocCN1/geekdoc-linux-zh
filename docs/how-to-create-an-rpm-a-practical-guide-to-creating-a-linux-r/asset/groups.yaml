    ## 不要清理！


    由于我们仔细将文件放在了那里，而且在现实生活中我们可能需要创建几次 RPM 达到要求，我们可以通过在 spec 中添加自己的 `%clean` 部分来停止这样做。让我们最后更新一次
    spec 文件。


    ```spec

    Name: my-first-rpm

    Release: 2

    Summary: 这是这是我的第一个 RPM

    License: GPLv2

    Version: 2.0

    Vendor: Steve

    Group: Documentation


    %description

    这是我的 RPM 软件包。我可以在这里详细描述 RPM。


    %clean

    echo "在此不进行清理。"


    %files

    /usr/bin/my-first-program

    %config /etc/my-first-program.conf

    %doc %name-%version/README

    %doc %name-%version/LICENSE

    ```


