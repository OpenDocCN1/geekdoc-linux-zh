    # Chapter 2: Creating a Simple (but Useless!) Binary RPM


    There are two types of RPM: a Source RPM, known as a SRPM, and a Binary RPM, which
    is the type of RPM that most people are used to dealing with. Despite its name,
    the Binary RPM does not have to include any binaries, or even any kind of executable
    code, it is only called Binary because RPM comes from a tradition of creating
    executable binaries from source code. It could be an RPM full of icon files, documentation,
    of website content, or anything else.


    The Binary RPM is the simplest type to create, and we shall start off with the
    simplest of all binary RPMs - the empty RPM containing no files. To get started,
    create the $HOME/rpmbuild/SPECS directory (capitalization is significant), and
    create a file inside called my-first-rpm-1.0-1.spec The “1-0” seems a bit odd
    at the moment, it will be explained later.


    ```

    [rpm@packaging -]$ cd

    [rpm@packaging -]$ mkdir rpmbuild/SPECS

    [rpm@packaging -]$ cd rpmbuild/SPECS

    [rpm@packaging SPECS]$ vi my-first-rpm-1.0-1.spec

    ```


    ![](img/e1630953eac5dd6e22589b3a1ae13d96_27_0.png)


    Now, add this text into the file:


    +   - Name: my-first-rpm

    - Release: 1

    - Summary: This is my first ever RPM

    - License: none

    - Version: 1.0


    %description

    My First RPM


    %files


    This is the bare minimum necessary to build an RPM file. We can use this as a
    template to build upon. It is of no actual use in itself, but we can build it
    up to see how we create a'
  - '[PAGE 28]


    more complete spec file, and this process should be useful when you need to create
    one of your own in real life. The first section defines the name, version, license
    and so on of the package, followed by the mandatory %description and %files sections.
    Our %files section is empty, as we have no files (yet), and the %description is
    a simple placeholder.'
