    B for details of assigning a static IP address.


    ## Appendix B: Configuring Static IP Address


    If you want the virtual machine to have a static IP address, login as the root
    user, go to the /etc/sysconfig/network-scripts directory and look at the ifcfg-eth0
    file there:


    ```bash

    [root@packaging ~]# cd /etc/sysconfig/network-scripts

    [root@packaging ~]# cat ifcfg-eth0

    DEVICE=eth0

    HWADDR=08:00:27:8a:6c:66

    TYPE=Ethernet

    ONBOOT=yes

    PROTO=static

    ADDR=192.168.1.30

    NETMASK=255.255.255.0

    GATEWAY=192.168.1.1

    DNS=192.168.1.1

    ```


    Look in particular the last lines; they may suit your environment or you may need
    different values to fit your network. Copy the ifcfg-eth0 file (this is the file
    that the system actually reads at boot for eth0 device), and edit it as appropriate:


    ```bash

    [root@packaging ~]# cp ifcfg-eth0 ifcfg-eth0

    cp: overwrite ifcfg-eth0

    [root@packaging ~]# vi ifcfg-eth0

    ```


    Assuming you are comfortable with the vi editor, go ahead and set the values appropriate
    for your network, restart the networking service:


    ```bash

    [root@packaging ~]# service network restart

    Shutting down interface eth0: [ OK ]

    Shutting down loopback interface: [ OK ]

    Bringing up loopback interface: [ OK ]

    Bringing up interface eth0: Determining IP information for eth0... done. [ OK
    ]

    [root@packaging ~]#

    ```


    ## Appendix C: Configuring Repositories for rpm-build


    To install the rpm-build package in Chapter 1, you will need to install the following
    RPMs:


    - rpm-build

    - elfutils

    - gdb

    - patch

    - perl

    - perl-pluggable

    - perl-simple

    - perl-libs

    - perl-version

    - redhat-config

    - unzip

    - xz


    Because you are reading this book, you are no doubt aware that you don''t need
    to go and find all RPMs yourself though. If you are using my VirtualBox image,
    everything should be configured to connect over the internet to download the necessary
    RPMs. You can also present a physical DVD from your host, or an ISO image, via
    VirtualBox Devices → CD/DVD menu, then mount it at /media/cdrom via the "mount
    /dev/sr0 /media/cdrom" command:


    ```bash

    [root@packaging ~]# mount /dev/sr0 /media/cdrom

    mount: block device /dev/sr0 is write-protected, mounting read-only

    [root@packaging ~]# ls /media/cdrom

    CentOS_BuildTag

    RELEASE-NOTES-en-US.html

    EFI

    repodata

    EULA

    GPL

    images

    RPM-GPG-KEY-CentOS-6

    RPM-GPG-KEY-CentOS-Debug-6

    RPM-GPG-KEY-CentOS-Security-6

    isolinux

    RPM-GPG-KEY-CentOS-Testing-6

    Packages

    ```


    On CentOS, you can use the DVD repository to install packages by editing /etc/yum.repos.d/CentOS-Media.repo
    and setting "enabled=1", then just "yum -y rpm-build" command as shown in Chapter
    1.


    To enable repositories in general on CentOS or other RPM-based distributions,
    you can create or edit files in /etc/yum.repos.d/. They must be given a .repo
    extension, for example, CentOS-Base.repo. This would look like:


    ```ini

    [base]

    name=CentOS-$release - Base

    mirrorlist=http://mirrorlist.centos.org/?release=$release&arch=$basearch&repo=$os&infra=$infra

    #baseurl=http://mirror.centos.org/centos/$release/$basearch/base/

    gpgcheck=1

    enabled=1

    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-6

    ```


    The "enabled=1" flag means that the repo is enabled; "enabled=0" means that it
    is configured, but not for use.


    The $release, $basearch, and other variables are picked up by RPM from the currently-installed
    OS version.


    ## Aside: Creating your own Repositories


    As an aside, a simpler Repo file looks like this:


    ```ini

    [root@packaging /etc/yum.repos.d]# cat local.repo

    [local-filesystem]

    name=Local Filesystem Repo

    baseurl=file:///usr/local/rpms

    gpgcheck=0

    enabled=1

    ```


    For this to work, you can populate the /usr/rpms directory with the relevant files,
    then run "createrepo /local/rpms" command to update the metadata:


    ```bash

    [root@packaging ~]# createrepo /local/rpms

    Spawning 0 pkgs

    Finished

    Gathering metadata

    Saving metadata

    ```


    You can see the newly created metadata in repodata/:


    ```bash

    [root@packaging ~]# ls repodata/

    ```


    ## Appendix D: Package Groups


    Groups are normaly, but not always, provided in a two-level format, such as Applications/Editors,
    or Development/Tools. Commonly-used groups are:


    - Amusements/Games

    - Amusements/Graphics

    - Applications/Archiving

    - Applications/Communications

    - Applications/Databases

    - Applications/Editors

    - Applications/Emulators

    - Applications/Engineering

    - Applications/File

    - Applications/Internet

    - Applications/Multimedia

    - Applications/Productivity

    - Applications/Publishing

    - Applications/System

    - Development/Debuggers

    - Development/Languages

    - Development/Libraries

    - Development/System

    - Development/Tools

    - Public Keys

    - System Environment/Base

    - System Environment/Daemons

    - System Environment/Kernel

    - System Environment/Libraries

    - System Environment/Shells

    - User Interface/Desktops

    - User Interface/X


    You can use a command such as "rpm -q --qf ''%{group}'' packagename" to list a
    package’s group:


    ```bash

    [root@packaging ~]$ rpm -q --qf ''%{name} is in the "%group}" group\n'' bash

    bash is in "System Environment/Shells" group

    ```


    ## Appendix E: Bibliography and Further Reading


    There are quite a lot of documents on the web about RPM; here are some selected
    URLs for further reading.


    https://fedoraproject.org/wiki/How_to_create_an_RPM_package – a very good guide
    on creating RPM packages.


    https://fedoraproject.org/wiki/Features/DNF – DNF, the successor to YUM


    http://www.rpm.org/max-rpm (older, but still a useful reference)


    http://docs.fedoraproject.org/en-US/Fedora_Draft_Documentation/0.1/html/RPM_Guide/index.html
    (newer, 2011)


    http://www.ucs.cam.ac.uk/docs/course-notes/unix-courses/archived/earlier/rpmbuild/files/rpmbuild.pdf
    – a worked example of the creation of an RPM.

