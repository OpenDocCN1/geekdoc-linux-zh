    # Chapter 6: ChangeLog


    The final thing to add to our simple spec file is a ChangeLog. This is a useful
    piece of documentation to add to an RPM, as it can track what changes were made,
    why, when, and by whom. RPM is rather picky about the formatting of Changelog
    entries; you can include email addresses, etc, but this will suffice for:


    ```

    %changelog

    * Tue Feb 23 2016 Steve Parker

    * Bug fixes and improvements

    * Mon Feb 22 2016 Steve Parker

    * Initial release.

    ```


    Append this to the end of the spec file, and we should have a presentable RPM
    file:


    ```

    [rpm@packaging SPECS]$ cat my-first-rpm-5.0-1.spec

    Name:\           my-first-rpm

    Release:\        1

    Summary:\        This is my first ever RPM

    License:\        GPL2

    Version:\        5.0

    Vendor:\         Steve Parker

    Group:\          Documentation

    ```


    %description

    This is my first RPM package. I can describe it more thoroughly here. It is normal
    to format these sections as 80 columns wide, so that it can easily read on any
    screen.


    %clean

    echo "Not cleaning up in this case."


    ```

    %files

    %defattr(0755,root,root)

    /usr/bin/my-first-program

    %attr(0644,root,root) %config /etc/my-first-program.conf

    %doc %name-%version/README

    %doc %name-%version/COPYING

    %doc %name-%version/LICENSE

    ```


    ```

    %changelog

    * Tue Feb 23 2016 Steve Parker

    * Bug fixes and improvements

    * Mon Feb 22 2016 Steve Parker

    * Initial release.

    ```


