    # Chapter 5: Install-time Scripts


    Along with the metadata in the RPM, one of the other big benefits of package managers
    is the scripts which can be run during the installation, upgrade and uninstallation
    of the package. Because RPM is built around the concept of compiling software
    from source code, some of the script types are specifically for dealing with functionality,
    which we will be looking at later in the book. In this section, we will only look
    at the four fundamental script types: %pre, %preun, %post and %postun. These run
    at preinstall, uninstall, postinstall and post-uninstall respectively. The other
    script types deal with preparing and building the source code.


    By default, these scripts are executed by the Bash shell with the -e switch, though
    you can define any other interpreter by adding "-p <interpreter>" to the spec
    file directive, for example: %post -p /usr/bin/python. Note: The -e switch to
    the shell means that it will exit with a non-zero exit code (indicating failure)
    as soon as any command in the script fails, without processing any further.


    It is a good idea to set full paths to commands you want to run in an RPM script;
    RPM will set a very restricted set of directories by default: /sbin:/bin:/usr/sbin:/usr/bin:/usr/X11/bin.


    We can see at which stage of installation the different scripts are executed by
    creating a simple .spec file as follows. Build this with "rpmbuild -bb my-first-rpm-4.0.1.spec
    (assuming my-first-rpm-4.0.1.spec is the name of the .spec file, as it is in the


    ```

    Name: my-first-rpm

    Release: 1

    Summary: This is my first ever RPM

    License: GPL2

    Version: 4.0

    Vendor: Steve Parker

    Group: Documentation

    ```


    ```

    %description

    This is my first RPM package. I can describe it more thoroughly here. It is normal
    to format these sections as 80 columns wide, so that it can easily read on any
    screen.

    ```


    ```

    %preun

    echo "In the %preun pre-uninstall script now."

    ```'
