    [rpmpackaging take3] cp -rf my-first-program.config \

    ~/rpmbuild/BUILDROOT/my-first-rpm-2.0-1.x86_64/etc/

    [rpmpackaging take3] $

    ```


    The documentation files are a different matter, because we don''t specify in the
    filesystem they go - %{name}-%{version}/README is a relative path, not an absolute
    path (it does not begin with "/"). When the RPM is built, the %docdir determines
    the location (/usr/share/doc) by default, but it could be anywhere. For these
    files, we put them into the BUILD directory, since that is where RPM expect to
    find them:


