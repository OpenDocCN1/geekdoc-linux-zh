  - '[PAGE 15]


    # YUM


    Yum (and its newer workalike, DNF) is a tool that works with repositories of RPMs
    as to be able to calculate all of the dependencies between RPMs, and install or
    upgrade all of those along with the RPM that the user requested to be installed.
    The following chapter shows the installation of the rpm-build package itself,
    including automatically downloading the dependencies for rpm-build, if you want
    to see a run-through of how this works.


    Installing RPMs by hand is quite possible without the intervention of Yum, but
    you can quite easily find yourself in "RPM Hell" – you''ve found the RPM that
    you need to install, but it requires some other library, so you have to find and
    download the RPM for the correct version of library. Once you''ve done that, you
    realise that this second RPM has dependencies of its own, so you have to find
    and download them, and so on down the rabbit hole. Yum uses this rich metadata
    to check and ensure that it can get hold of all the necessary RPMs to install
    the package that you need.'
