    You now have the necessary tools to create an RPM.


    ## Chapter 2: Creating a Simple RPM


    There are two types of RPM: Source RPM, known as SRPM, and Binary RPM, which is
    the executable code. Binary RPM does not include any source code, it is the final
    package.


    To start, we will create a directory for our RPM build:


    ```bash

    mkdir -p ~/rpmbuild/BUILD ~/rpmbuild/RPGS ~/rpmbuild/RPMS ~/rpmbuild/SOURCES

    ```


    Then we will move into that directory:


    ```bash

    cd ~/rpmbuild

    ```


    Now, we will create the spec file. This file is the heart of the RPM and tells
    rpmbuild how to build the package.


    ```bash

    vi my-rpm.spec

    ```


    Inside the spec file, we will add the following:


    ```spec

    Name: my-rpm

    Version: 1.0

    Release: 1

    Summary: This is a test RPM

    License: none


    Description:

    My test RPM

    ```


    Once the spec file is saved, we will run rpmbuild to create the RPM:


    ```bash

    rpmbuild -bb my-rpm.spec

    ```


    This will create the RPM file in the ~/rpmbuild/RPMS/ directory.


    Now we can inspect the RPM file using the rpm -q command:


    ```bash

    rpm -q ~/rpmbuild/RPMS/x86_64/my-rpm-1.0-1.x86_64.rpm

    ```


    The output will show the metadata of the RPM file, which we just created.


