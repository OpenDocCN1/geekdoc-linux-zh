    # Formatting Conventions Used in this Book


    The formatting conventions in this book are fairly standard; the main text is
    in a serif font, like the text you are currently reading. System files and commands
    (such as rpmbuild, are shown in monospaced font /etc/hosts, and so on).


    Output from interactive sessions is shown on a light gray background; commands
    that are **bold text**, for example, here would type "cd" and "mkdir rpmbuild":


    ```

    rpm@packaging ~]$ cd

    rpm@packaging ~]$ mkdir rpmbuild

    ```


    Callout boxes are shown on a lighter background, with a border, and highlight
    particular items, including a reminder of where you can download files from:


    > If you are using one of the Virtual Machine images, files can be found in the
    ~/files/ directory. Alternatively, download the "files" bundle from howtocrepm


    If a line of input is too long to show on the width of a printed book, then a
    backslash is shown to indicate that the command continues onto the next line (which
    will be indented). You can either type it literally as shown, as multiple lines,
    like this:


    ```

    cp my-first-rpm-1.0 \

    ~/rpmbuild/SPECS

    ```


    Or you can remove the backslash and the line break, and enter it all one line,
    like this:


    ```

    cp my-first-rpm-1.0.spec ~/rpmbuild/SPECS/

    ```


    You will probably find the second option easier. Any shell you are using will
    accept either format. At times, it can be more clear to display the prompt as
    a single "$", rather than its usual, instead of this:


    ```

    rpm@packaging ~]$ mkdir ~/rpmbuild/my-first-rpm-2.0

    rpm@packaging ~]$ cp COPYING ~/rpmbuild/my-first-rpm-2.0/

    rpm@packaging ~]$ cp LICENSE ~/rpmbuild/my-first-rpm-2.0/

    ```


    We will sometimes show the commands like this, where that makes it easier to read:


    ```

    $pwd

    /home/rpm/

    $ mkdir ~/rpmbuild/my-first-rpm-2.0

    $ cp COPYING ~/rpmbuild/my-first-rpm-2.0/

    $ cp LICENSE ~/rpmbuild/my-first-rpm-2.0/

    ```


    Notice that here the additional "pwd" command confirms that the current location
    is /home/rpm/, since that was no longer clear from the prompt.


    # Introduction


    The creation of RPM packages is often seen as a bit of a dark art by many in the
    IT industry, particularly whose main experience and expertise is somewhere other
    than the (sometimes niche) Linux development community. This book is for these
    people, amongst others:


    - Developers needing to package their code for distribution

    - Systems Administrators needing to install and manage software over an estate
    of servers

    - DevOps needing to create or modify RPMs for a particular project or environment

    - Students wanting to learn about and/or experiment with the mechanisms of RPM


    Anybody else who is interested in understanding RPMs.


    There is some excellent (and free) RPM reference online (see the Bibliography),
    but apparently none are particularly accessible to the outsider, or even to the
    insider who just wants to accomplish what should be (and actually is) a pretty
    simple task, without learning any arcane specifics of the details of how RPM is
    implemented.


    This book is written for anybody who just wants to be able to create an RPM package;
    if you just want to pick up enough knowledge to get a few files into an RPM, nobody
    is going to preach at you that you are not exploiting the full potential of a
    finely tuned RPM package. If you want to learn how to do more with RPM than just
    install a few files, we''ll cover that too, and go on to cover all of the bits
    that you need to know about, so you can dip in and out of whichever chapters you
    need at any moment. It may well turn out that as you start to create more and
    more powerful and flexible RPM packages, you find yourself wanting to use more
    more of its features.


    # Why RPM?


    There are many benefits of RPM over, say, distributing a tarball (.tar compressed
    archive); this book is more focused on the practicality of how to create RPMs
    than on evangelism of any particular technology, but in one word, the key benefit
    of RPM is "metadata".


    # Metadata


    The Oxford Dictionary defines Metadata as “A set of data that describes and gives
    information about other data.”. This is what makes an RPM so much more useful
    than a tarball or simply copying an executable onto a system. The RPM database
    keeps track of what packages are installed, files and features they provide, as
    well as other information, such as who created them, how they are licensed, and
    how many other details.


    To compare the tarball with the RPM file, both contain the required data - the
    installed files - but the RPM also includes lots of extra metadata. While this
    puts an additional burden on the creator of the RPM, the benefits are huge, and
    the up-front cost is relatively low. Once you start updating your RPM, the benefits
    increase significantly, and the cost becomes vanishingly small.


    By providing a small amount of metadata about the software package, and about
    the files it contains, you can do far more with your systems than if you slap
    software onto them in a haphazard way. Just the fact that upgrading the package
    takes care of removing obsolete files as deploying new ones, is a massive win.


    Special handling of configuration files within the RPM is another benefit - because
    RPM knows which files are documentation, which are executables, which are configuration
    files, it can give them special treatment and deal more intelligently with them.

