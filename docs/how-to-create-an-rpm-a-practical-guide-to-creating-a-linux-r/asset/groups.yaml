- md: "\n# Chapter 7: Replacing Configuration Files\n\nWhen upgrading software, the\
    \ new software version being installed may introduce new entries in its configuration\
    \ files, or even an entirely new format for its. If the user has not changed the\
    \ configuration, the upgrade will simply replace the old, default configuration\
    \ files with the new default versions. If the user has customized their configuration\
    \ file since installing the package, RPM is faced with a dilemma. it would be\
    \ wrong to wipe out the user's changes, but the updated RPM needs to install the\
    \ new file with the new version of the software, otherwise the user won't get\
    \ to see the new configuration file to compare with the existing one.\n\nThere\
    \ is also the restriction that RPMs should never interactive with the user when\
    \ installing, removing, or upgrading. This is that RPMs can be enabled by an installer,\
    \ such as Red Hat's Anaconda script. So stopping to ask the user which the configuration\
    \ they want to keep, as Debian packages do, is not an option with RPMs.\n\nFor\
    \ example, if you were to install the Apache httpd server, then make a simple\
    \ edit of /etc/httpd/conf/httpd.conf to update the Listen directive to listen\
    \ on port 81 instead of the default port 80, it might (in theory at least) be\
    \ possible for the upgrade RPM to compare your file with the one be installed,\
    \ since your desired configuration, and apply that logic to the new httpd.conf\
    \ file. However this would soon become complicated, and for something reasonably\
    \ complex, as the famously unintelligible sendmail.cf, it would just be best impossible\
    \ to write a safe upgrade script for every situation.\n\nIn other situations,\
    \ the configuration file format may change entirely, and some old features may\
    \ be obsolete, which no upgrade script would be to deal with.\n\nWhat RPM does,\
    \ therefore, is to leave the existing file untouched, and install the new file\
    \ so the user can compare the new and old versions. By default, if the existing\
    \ file has been edited, RPM will save it as .rpmsave (for example, /etc/httpd/conf/httpd.conf.rpmsave)\
    \ and install the new configuration file, with all of its default settings, as\
    \ /etc/httpd/conf/httpd.conf.\n\nThat isn't the best thing to do, however the\
    \ file format does not change (or at all), and the new version of the software\
    \ is expected to work with the user's customized configuration file, the RPM can\
    \ declare the as %config(noreplace), instead of the default %config. In this situation,\
    \ RPM will leave the user's configuration file in place, and install the new one\
    \ as .rpmnew, for example, /etc/httpd/conf/httpd.conf.rpmnew.\n\nWhen creating\
    \ an RPM, you can bear in mind these two different options, and choose the most\
    \ suitable behaviour for each configuration file that you package.\n\nWhatever\
    \ operation is needed, RPM will display a message to tell an alerts administrator\
    \ what has been done, so that they can look at the files and decide what they\
    \ want to do with them.\n\nWith the RPM that we have been using in this book,\
    \ /etc/my-first-program.conf be replaced on an upgrade, but the old version of\
    \ will be saved as /etc/my-first-program.conf.rpmsave.\n\nIf you were to set it\
    \ as \"%config(noreplace)\", then it would not be replaced, but instead the new\
    \ file would be installed as /etc/my-first-program.conf.rpmnew.\n\n# Chapter 8:\
    \ There must be an easier!\n\nThe method we've looked at in the past chapters\
    \ works, and it works nicely with the concepts, particularly if you're going to\
    \ go further and create RPMs from sources. But it is really complicated. What's\
    \ the deal with creating directories called my-first-rpm-1.0-1.x86, clearing them\
    \ out when you just want to change the version number, and all that hassle? Do\
    \ you really do that, every time, Mr. Parker?\n\nErm, no, actually. No, I don't.\
    \ Not often, and at least. What we've done so far is a little bit unorthodox,\
    \ in that we're not creating packages from tarballs, applying patches, and some\
    \ of the other clever that RPM can do. But this next one is even worse: that's\
    \ okay, because it is also so very, much easier. It uses the “buildroot” flag\
    \ in rpmbuild which makes the whole less complicated and easier to manage.\n\n\
    Have a directory called “my-first-rpm”. Just, don't bother with a version number,\
    \ or .x86 or any other details. In fact, call it whatever you like, but it is\
    \ convenient to give it some kind of descriptive name. Let's create /home/rpm/my-first-rpm\
    \ to contain the files. Under there, put a .spec file and a subdirectory called\
    \ “root”. Like this:\n\n```\n[rpm@packaging ~]$ mkdir my-first-rpm\n[rpm@packaging\
    \ ~]$ cd my-first-rpm\n[rpm@packaging my-first-rpm]$] ls\nmy-first-rpm.spec\n\
    root\n[rpm@packaging my-first-rpm]$\n```\n\nUnder the “root” directory, put all\
    \ of your usr/bin/my-first-program, etc/my-program.conf, and anything you need.\
    \ Then to build the RPM, just run this script from the directory:\n\n```bash\n\
    #!/bin/bash\n\nSPEC=${1:-myspec.spec}\nROOT=${2:-}\n```\n\n```bash\nif [ -f \"\
    $SPEC\" ] || [ ! -d \"$ROOT\" ]; then\necho \"Usage: $0 specfile rootdirectory\"\
    \nelse\nrpmbuild -bb --buildroot=$ROOT $SPEC\nfi\n```\n\nYou can use this script\
    \ in any directory, with a single .spec file and a root/subdirectory. To maintain\
    \ different versions of my-first-rpm, it is tidier to have a “1.0” and a “2.0”\
    \ subdirectory under my-first-rpm, and have a .spec file and a root/ directory\
    \ within each one. You could have multiple .spec files, and multiple root directories,\
    \ named as you like, and pass their names as parameters:\n\n```\n[rpm@packaging\
    \ foo]$ rpmbuild.sh my-v1.spec my-v1\n```\n\nA slightly longer but friendlier\
    \ version of the script is shown below, and as with everything in this book –\
    \ both versions can be downloaded from http://bit.ly/howtocreaterpm.\n\n```bash\n\
    #!/bin/bash\n\nusage()\n{\n    echo \"usage: basename $0 { specfile [buildroot]\
    \ }\"\n    echo \"- If no spec file is provided, a single \\.spec file is\"\n\
    \    echo \"- expected to be found in the current directory\"\n    echo \"- If\
    \ no root directory is provided, a single root/\"\n    echo \"- directory is expected\
    \ to be found in the current\"\n    echo \"- For example:\"\n    echo \"  $1\"\
    \n    echo \"  myspecfile.spec root\"\n    echo \"  $basename $0\"\n}\n\ncase\
    \ \"$#\" in\n    0) SPEC=$(ls -1 ..spec 2>/dev/null | head -1)\n       ROOT=root;;\n\
    \    1) SPEC=$1\n       ROOT=root;;\n    2) SPEC=$1\n       ROOT=$2;;\n    *)\
    \ usage;\nesac\n\nif [ -f \"$SPEC\" ] || [ -d \"$ROOT\" ]; then\n    usage\nfi\n\
    echo \"Using specfile:$SPEC and root:$ROOT\"\nrpmbuild -bb --buildroot=$ROOT $SPEC\n\
    ```\n\n```bash\nif [ $? -eq 0 ]; then\n    echo \"RPM created.\"\nelse\n    echo\
    \ \"RPM creation failed. Please see messages above.\"\n    exit 1\nfi\n```\n\n\
    You will also have to create root/usr/share/doc/my-first-rpm-2.0 to hold the COPYING,\
    \ LICENSE and README files, and tell rpmbuild where to find them; otherwise it\
    \ will look for them in ~/rpmbuild/my-first-rpm-2.0.\n\n```\n%doc /usr/share/doc/%name-%%version/README\n\
    %doc /usr/share/doc/%name-%%version/COPYING\n%doc /usr/share/doc/%name-%%version/LICENSE\n\
    ```\n\nIt doesn't much which approach you choose for these files.\n\n# Appendix\
    \ A: Importing the OVA into VirtualBox\n\nThe VirtualBox image is hosted by Google\
    \ Drive - you do not need a Google account to download the image. Just point your\
    \ browser at http://bit.ly/rpmbuild - this will redirect you to the URL at Google\
    \ Drive, showing RPM.ova containing three files: RPM-disk1.vmdk, RPM.mf, and RPM.ovf\
    \ - you do not need to download them separately.\n\nGoogle Drive doesn't offer\
    \ a virus-scanning facility for large files, so it asks for confirmation that\
    \ you want to download this file. Click on “Download anyway” and the download\
    \ will start.\n\nOnce the download has completed, launch the VirtualBox application.\n\
    \nFrom the File menu, choose “Import Appliance...”,\n"
