    ## Don’t Clean Up!


    Since we carefully put our files there, and in real life we may need to create
    the RPM a few times before we get it how we want, we can stop from doing this
    by adding our own %clean section to the spec. Let''s update the spec file one
    last time.


    ```spec

    Name: my-first-rpm

    Release: 2

    Summary: This is my first ever RPM

    License: GPLv2

    Version: 2.0

    Vendor: Steve

    Group: Documentation


    %description

    This is my RPM package. I can describe RPM thoroughly here. It is normal to format
    these sections as 80 columns, so that it can easily read on any screen.


    %clean

    echo "Not cleaning up in this case."


    %files

    /usr/bin/my-first-program

    %config /etc/my-first-program.conf

    %doc %name-%version/README

    %doc %name-%version/LICENSE

    ```


