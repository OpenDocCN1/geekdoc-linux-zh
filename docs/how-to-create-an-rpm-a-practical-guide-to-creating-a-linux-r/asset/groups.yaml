    # Post Uninstall Script


    The postuninstall script (%postun) completes the foursome. This is executed after
    the files have all been removed, so /sbin/ldconfig is sometimes run, to update
    the system about any library files which have been removed. The Red Hat update-alternatives
    script is also sometimes run, like in this example from the antlr RPM:


    ```

    %postuninstall

    if [ $1 -eq 0 ]; then

    /usr/sbin/update-alternatives --remove antlr /usr/bin/antlr-java

    fi

    ```


    There is a conditional statement here. Continue to the next section for what the
    $1 variable means for these scripts.'
  - '[PAGE 54]


    # Install Count – Upgrading RPMs


    The previous example showed the the $1 variable. This is passed to all of your
    scripts, and is a count of how many copies of this RPM are currently installed
    (it may be possible for more than one to be installed, for example, the 32-bit
    and 64-bit versions of a library). By modifying the spec script above, we can
    easily see what this value is in different scenarios.


    Putting aside multiple architectures of an RPM for the moment, consider a typical
    single-architecture RPM. When you install a new RPM for the first time, the $1
    (install variable) will be zero (0) when the install scripts run. The uninstall
    scripts are not run during initial installation, so these are “n/a” in the table
    below. When you upgrade, this will be 2 for the install scripts and 1 for the
    uninstall scripts. When you remove the RPM, this will be 0 in the uninstall scripts
    (the pre- and post- scripts don’t run during uninstallation, so again they are
    “n/a”).


    | Action | pre | post | preun | postun |

    | --- | --- | --- | --- | --- |

    | Initial install | 0 | 0 | n/a | n/a |

    | Upgrade | 2 | 2 | 1 | |

    | Removal | n/a | n/a | 0 | |


    This information is most useful when upgrading the RPM - although the upgrade
    process consists of removing the old RPM and the new one, during an upgrade the
    uninstall scripts will know [ because $1 -ne 0 ] that there will still be copies
    of this RPM installed after they’ve finished, so any drastic tidying up (such
    as unregistering from update-alternatives, as in the antlr example above) does
    not need to be performed.


    This can help you create robust, stable RPMs which can safely and sensibly installed,
    upgraded and removed, without causing any surprises for the user.


    If there are other instances of the RPM installed - as multiple architectures
    - the numbers will be higher to reflect that state. Because of that, the most
    sensible approach (for the most common case) is simply to test whether or not
    [ $1 -eq 0 ], or if upgrading, [ $1 -gt 1 ] (to check if it is greater than 1,
    rather than precisely 2).


    An example of an updated .spec file to show this information is as the previous
    .spec file, but with one additional detail in the echo statement. I will also
    bump its release number from 1 to 2.


    ```

    Release: 2

    %pre

    echo "In the %pre preinstall script now. ($1 copies installed)"

    ```'
