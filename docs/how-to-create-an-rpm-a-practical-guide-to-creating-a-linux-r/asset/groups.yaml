    # xz-lzma-compat


    Because you are reading this book, you are no doubt aware that you don''t need
    to go off and find all RPMs for yourself, though. If you are using my VirtualBox
    image, everything should be configured to connect over the internet to download
    the necessary RPMs. You can also present a physical DVD from your host, or an
    ISO image, via VirtualBox Devices → CD/DVD Devices menu, then mount it at /media/cdrom
    via the "mount /dev/sr0 /media/cdrom" command:


    ```

    [root@packaging ~]# mount /dev/sr0 /media/cdrom

    mount: block device /dev/sr0 is write-protected, mounting read-only

    [root@packaging ~] ls /media/cdrom

    CentOS_BuildTag RELEASE-NOTES-en-US.html

    EFI

    repodata

    EULA

    GPL

    images

    RPM-GPG-KEY-CentOS-6

    RPM-GPG-KEY-CentOS-Debug-6

    RPM-GPG-KEY-CentOS-Security-6

    isisolinux

    RPM-GPG-KEY-CentOS-Testing-6

    Packages

    TRANS.TBL

    [root@packaging ~]#

    ```


    On CentOS, you can use the DVD repository to install packages, by editing /etc/yum.repos/CentOS-Media.repo
    and setting "enabled=1", then just "yum -y rpm-build" command, as shown in Chapter
    1.


    To enable repositories in general, on CentOS, or other RPM-based distributions,
    you can create or edit files in /etc/yum.repos.d/. They must be given a .repo
    extension, for example, CentOS-Base.repo. This would look like:


    ```

    [base]

    name=CentOS-$release - Base

    mirrorlist=http://mirrorlist.centos.org/?release=$release&arch=$basearch&repo=$os&infra=$infra

    #baseurl=http://mirror.centos.org/centos/$release/$basearch/base/

    gpgpgcheck=1

    enabled=1

    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-CentOS-6

    ```


    The "enabled=1" flag means that the repo is enabled; "enabled=0" means that it
    is configured, but not for use.


    The $release, $basearch, and other variables are picked up by RPM from the currently-installed
    OS version.'
  - '[PAGE 76]


    # Aside: Creating your own Repositories


    As an aside, a simpler Repo file looks like this:


    ```

    [root@packaging /etc/yum.reposd]# cat local.repo

    [local-filesystem]

    name=Local Filesystem Repo

    baseurl=file:///usr/local/rpms

    gpgcheck=0

    enabled=1

    ```


    For this to work, you can install the createrepo package, populate the /usr/local/rpms
    directory with RPM files, then run the “createrepo /usr/local/rpms” command to
    update the relevant metadata:


    ```

    [root@packaging ~]# createrepo /usr/local/rpms/

    Spawning worker 0 with 66 pkgs

    Workers Finished

    Gathering worker results


    Saving Primary metadata

    Saving file lists metadata

    Saving other metadata

    Generating sqlite DBs

    SQLite DBs complete

    ```


    You can see the newly-created metadata in the repodata/ subdirectory:


    ```

    [root@packaging ~]# ls /usr/local/rpms/repodata

    e4e7a3b85f611ced241c686a0d7040adb9aaf0584aef19f5412099fc19d7a5-

    files.xml.gz

    57f627abc5d572f31599bb003387ae978d816c57ae5e57fa01083fc0169595-

    files.sqlite.bz2

    8065bd31b106ff6d6ac430d94193ca4bf2704db42f0491f6360f350d38c-

    other.sqlite.bz2

    b86763b4feea6a8b6ce7e38e6fd1c88aa32c116cf4f7d9c639db79c0a93756-

    other.xml.gz

    d2a7458bd5f4e50a24154ece68430ac4db2953f61f64d2ac2ca776fb1f6e434-

    primary.xml.gz

    e8fd543d3c499db20b2be257f238c45d96c26fb904536564d7c86fe0478a7-

    repomd.xml

    primary.sqlite.bz2

    [root@packaging ~]#

    ```


    Your repository is now ready to use.'
