  - "[PAGE 42]\n\n# # Don’t Clean Up!\n\nSince we carefully put our files there, and\
    \ in real life we may find that we need to create the RPM a few times before we\
    \ get it exactly how we want it, this behaviour be a real pain. We can stop from\
    \ doing this by adding our own, %clean directive into the spec file. Let's update\
    \ the spec file one last time. Update the Release to 2, and add a %clean section.\
    \ Save this as my-first-rpm-2.0-2.spec (or use the provided file).\n\n+   Name:\
    \ my-first-rpm\nRelease: 2\nSummary: This is my first ever RPM\nLicense: GPLv2\n\
    Version: 2.0\nVendor: Steve Parker\nGroup: Documentation\n\n%description\nThis\
    \ is my RPM package. I can describe RPM more thoroughly here. It is normal to\
    \ format these sections as 80 columns wide, so that it can easily read on any\
    \ screen.\n\n%clean\necho \"Not cleaning up in this case.\"\n\n%files\n/usr/bin/my-first-program\n\
    %config /etc/my-first-program.conf\n%doc name-%{version}/COPYING\n%doc name-%{version}/LICENSE\n\
    \nWe can then remove our reconfigured root directory, and create the package again:\n\
    \n```\n[rpmpackaging taking3] $ rpmbuild -bb my-first-spec-2.0-2.spec\n[ 'you've\
    \ seen the output already; committed this time ]\n[rpmpackaging taking3] $ rpm\
    \ -iv \\\n    ~/rpm/build/x86_64/my-first-spec-2.0-2.x86_64.rpm\n###########################################################\
    \ [100%]\nPreparing...\n[rpmpackaging taking3] $\n```\n\nNow we inspect the BUILDROOT,\
    \ and all the files are left in place.\n\n```\n$ rpm -iv ~/rpm/build/my-first-rpm-2.0-2.x86_64.rpm\n\
    $ cd BUILDROOT/\n$ mkdir my-first-rpm-2.0-2.x86_64/usr\n$ cd\n$ /home/rpm/files/chapter3/take3\n\
    $ cp my-first-program *\n$ cp ~/rpm/build/my-first-rpm-2.0-2.x86_64/bin \\\n$\
    \ cp my-first-program.conf \\\n$ ~/rpm/build/BUILDROOT/my-first-rpm-2.0-2.x86_64/etc/\n\
    $\n```\n\nNow we can see that our root filesystem is still there - it even shows"
- md: "\n```bash\n[rpmpackaging taking] cd - /rpmbuild/BUILDROOT\n[rpmpackaging rebuild]\
    \ find . -type \\\n/my-first-rpm-2.0-1.x64/usr/share/doc/my-first-rpm-2.0/LICENSE\n\
    /my-first-rpm-2.0-1.x64/usr/share/doc/my-first-rpm-2.0/README\n/my-first-rpm-2.0-2.x64/usr/share/doc/my-first-rpm-2.0/COPYING\n\
    /my-first-rpm-2.0-2.x64/etc/first-program.conf\n/my-first-rpm-2.0-2.x64/bin/first-program\n\
    /my-first-rpm-2.0-2.x64/usr/share/doc/my-first-rpm-2.0/LICENSE\n/my-first-rpm-2.0-2.x64/usr/share/doc/my-first-rpm-2.0/README\n\
    /my-first-rpm-2.0-2.x64/usr/share/doc/my-first-rpm-2.0/COPYING\n[rpmpackaging\
    \ rebuild]\n```\n\nIt is worth saying that although we take steps to disable the\
    \ feature, automatically cleaning out the BUILDROOT directory is the right thing\
    \ for rpmbuild to do, since it assumes that we are using all of its features,\
    \ and we wouldn't want potentially broken artifacts left around from previous\
    \ builds. What we are doing here is a bit of a naughty shortcut for creating RPMs,\
    \ but this method is Good Enough™ for lots of uses, and I find that a spec file\
    \ like my-first-rpm-2.0-1.spec is very nearly a useful template to have around\
    \ for quickly putting an RPM package together. Three more small tweaks – Permissions,\
    \ an Install Scripts, and Change Logs – will make it more genuinely useful. These\
    \ are covered in the next three chapters.\n\n## Chapter 4: Permissions\n\nAs standard,\
    \ the files will be packaged with exactly the same permissions as they are found\
    \ in your BUILDROOT directory, but as tar does. That is fine, as far as it goes,\
    \ but the files are likely to be owned by your own username, which is probably\
    \ not what you want.\n\nYou can specify the default permissions for your file,\
    \ when you don't give any direct requirements, by using the %defattr parameter,\
    \ just after the %files directive. You can override this with the %attr directive\
    \ for any given file. For example, to set the default permissions to 0755, owner\
    \ root, group root, but have the configuration file with permissions 0644, you\
    \ can use this in spec file:\n\n```\n%files\n%defattr(0755,root,root)\n/usr/bin/my-first-program\n\
    %attr(0644,root,root)%config /etc/my-first-program\n%doc %name-version/README\n\
    %doc %name-version/COPYING\n%doc %name-version/LICENSE\n```\n\nCopy the my-rpm-2.0-1.spec\
    \ file to my-rpm-3.0-1.spec, update the Version to 3, reset the Release to 1,\
    \ and copy the BUILDROOT to have a directory name which matches the new Release:\n\
    \n```bash\n[rpm@packaging SPECS] $ cp my-rpm-2.0-1.spec my-rpm-3.0-1.spec\n[rpm@packaging\
    \ SPECS] $ vi my-rpm-3.0-1.spec (just to update the Release)\n[rpm@packaging SPECS]\
    \ $ cd ../BUILDROOT/\n[rpm@BUILDROOT] $ cp -r my-rpm-2.0-1.x86_64/ my-rpm-3.0-1.x86_64/\n\
    ```\n\nWhen you install the RPM, you can see that the permissions are set in the\
    \ spec file:\n\n```bash\n$ rpm -bb my-first-rpm-3.0-1.spec\n$ rpm -ivh RPM/x86_64/my-first-rpm-3.0.1.x86_64.rpm\n\
    $ ls -l /usr/bin/my-first-program\n-rwxr-xr-x 1 root root 227 /usr/bin/my-first-program\n\
    $ ls -l /etc/my-first-program.config\n-rw-r--r-- 1 root root 140 /etc/my-first-program.config\n\
    ```\n\n## Chapter 5: Install-time Scripts\n\nAlong with the metadata in the RPM,\
    \ one of the other benefits of package managers is the scripts which can be run\
    \ during the installation, upgrade and uninstallation of the package. Because\
    \ RPM is built around the concept of compiling software from source, some of the\
    \ script types are specifically for dealing with functionality which we will be\
    \ looking at later in the book. In this section, we will only look at the four\
    \ script types: %pre, %preun, %post and %postun. These run at preinstall, uninstall,\
    \ postinstall and uninstall respectively. The other script types deal with preparing\
    \ and building the source code.\n\nBy default, these scripts are executed by the\
    \ shell with the -e switch, though you can define any other interpreter by adding\
    \ \"-p <interpreter>\" to the spec directive, for example: %post -p /usr/bin/python.\
    \ Note: The -e switch means that it will exit with a non-zero code (indicating\
    \ failure) as soon as any command in the script fails, without processing any\
    \ further. It is a good idea to set full paths to commands you want to run in\
    \ an RPM script; RPM will set a very restricted set of directories by default:\
    \ /sbin:/bin:/usr/sbin:/usr/bin.\n\nWe can see at which stage of installation\
    \ the different scripts are executed by creating a simple .spec file as follows.\
    \ Build this with \"rpmbuild -bb my-first-rpm-4.0-1.spec\" (assuming my-first-rpm-4.0.spec\
    \ is the name of the spec file, as it is):\n\n```spec\nName: my-first-rpm\nRelease:\
    \ 1\nSummary: This is my first RPM\nLicense: GPL\nVersion: 4.0\nVendor: Steve\n\
    Group: Documentation\n\n%description\nThis is my first RPM package. I can describe\
    \ it more thoroughly here. \nIt is normal to format these sections as 80 columns\
    \ wide, so that they can be easily read on any screen.\n\n%preun\necho \"In the\
    \ %preun pre-uninstall script now.\"\n```\n\n```spec\n%files\n%defattr(0755,root,root)\n\
    /usr/bin/my-first-program\n%attr(0644,root,root) %config /etc/my-first-program.conf\n\
    %doc %name-version/README\n%doc %name-version/COPYING\n%doc %name-version/LICENSE\n\
    ```\n\nNow run rpmbuild to create the updated RPM:\n\n```bash\n$ rpmbuild -bb\
    \ my-first-rpm-4.0-1.spec\n```\n\nBy installing and removing this RPM, we can\
    \ see exactly when they run:\n\n```bash\n[rpm@packaging SPECS] sudo rpm -ivh ../RPMS/x86_64/my-first-rpm-4.0-1.x86_64.rpm\n\
    Preparing...\n################################################\n[100%]\nIn the\
    \ %pre preinstall script now.\nInstalling my-first-rpm #################################\n\
    [100%]\nIn the %post postinstall script now.\n[rpm@packaging SPECS] sudo rpm -e\
    \ my-first-rpm\nIn the %preun preuninstall script now.\nIn the %postun uninstall\
    \ script now.\n[steve@packaging SPECS]$\n```\n\n### Preinstall Script\n\nBefore\
    \ installing any of the files contained within the RPM, the %pre script is run.\
    \ This can be used to prepare the system in ways that simply copying files cannot.\
    \ For example, the Apache httpd package could have a preinstall script that creates\
    \ the apache user account.\n\nAs standard, if the preinstallation script was to\
    \ fail in some way, the RPM would not be installed at all. This isn't the desired\
    \ behaviour, so there are various ways around it - one approach is to decide that\
    \ failing to create the user account would be a bad thing, but not enough serious\
    \ to fail to install the software. It wouldn't be able to set the file ownership\
    \ correctly if the apache account doesn't exist, but the files can still be installed.\
    \ In that case, %pre script can look as below.\n\nNote: The || true at the end\
    \ means \"if the command fails, run the true command instead\". The true command\
    \ is a special builtin command which returns success (return code zero) which\
    \ has the effect that RPM is happy that the overall operation succeeded. There\
    \ is another command, \":\", which is in essence the same as true, so you will\
    \ sometimes see the slightly cryptic || :\" syntax. The \\ at the end of the line\
    \ is simply for line wrapping - it means that the command continues on the next\
    \ line.\n\n```bash\n%pre\n/usr/sbin/useradd -c \"Apache\" \\\n  -u 48 -s /sbin/nologin\
    \ -r \\\n  -d /usr/share/httpd \\\n  apache 2> /dev/null || true\n```\n\n### Postinstall\
    \ Script\n\nThe postinstall script is executed after the files have been installed.\
    \ This can do any tidying up required, and is typically used to customize configuration\
    \ files, and to register the startup script via the chkconfig command. An example\
    \ might be:\n\n```\n%post\n/sbin/chkconfig --add httpd\n```\n\n### Pre-Uninstall\
    \ Script\n\nThe preuninstall (%preun) script is executed before the files are\
    \ removed from the system. This can still make use of the configuration files,\
    \ and run the programs one last time, if necessary, to do any tidying up. Typical\
    \ tasks here include stopping the service, unregistering it via chconfig, and\
    \ clearing out any additional files it may have created whilst running. This section\
    \ can also be used to clear out configuration files or data files, though this\
    \ is potentially quite risky as you don't want to delete a user's carefully-crafted\
    \ configuration file, for example. An example script could be:\n\n```\n%preun\n\
    /sbin/service httpd stop\n/sbin/chkconfig --del httpd\n```\n"
  mdcn: "\n\n```bash\n[rpmpackaging taking] cd - /rpmbuild/BUILDROOT\n[rpmpackaging\
