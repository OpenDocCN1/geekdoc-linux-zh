    # 第 7 章：替换配置文件


    在升级软件时，正在安装的新软件版本可能会在它的配置文件中引入新条目，甚至是一个完全全新的格式。如果用户没有更改过配置，升级将简单地将旧的默认配置文件替换为新的默认版本。如果用户在安装软件包后自定义了配置文件，RPM
    将面临进退两难的境地：删除用户的更改是错误的，但更新后的 RPM 需要为新版本的软件安装新文件，否则用户将无法看到新的配置文件，以便其与现有的文件进行比较。


    此外，还有一项性限制，即 RPM 在安装、删除或升级时，绝不应与用户进行交互。这是因为 RPM 可能会由安装程序（例如 Red Hat 的 Anaconda
    脚本）启用。因此，像 Debian 软件包那样停下来并询问用户想要保留哪种配置，对于 RPM 来说并不是一个可行方案。


    例如，如果你安装了 Apache httpd 服务器，然后对 `/etc/httpd/conf/httpd.conf` 进行了简单的编辑，将 `Listen`
    指令更新为监听 81 端口而不是默认的 80 端口，那么（至少在理论上）升级 RPM 可能会将你的文件与要安装的文件进行比较（基于你所需的配置），并将该逻辑应用到新的
    `httpd.conf` 文件中。然而，这很快就会变得复杂，对于某些相当复杂的内容，例如臭名昭著的晦懂的 `sendmail.cf`，为每种情况编写一个安全的升级脚本将几乎是不可能的。


    在其他情况下，配置文件的格式可能会发生完全变化，某些旧功能可能已经过时，这是任何升级脚本都无法处理的。


    因此，RPM 的做法是保持现有文件不变，并安装新文件，以便用户比较新旧版本。默认情况下，如果现有文件被编辑过，RPM 将将其保存为 `.rpmsave`（例如
    `/etc/httpd/conf/httpd.conf.rpmsave`），并安装带有所有默认设置的新配置文件作为 `/etc/httpd/conf/httpd.conf`。


    然而，这并不是最好的做法。


