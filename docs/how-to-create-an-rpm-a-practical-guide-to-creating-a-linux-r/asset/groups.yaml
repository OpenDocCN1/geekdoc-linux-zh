    \ 指令之后使用 `%defattr` 参数来指定文件的默认权限。你可以使用 `%attr` 指令对任何给定的文件覆盖此设置。例如，要将默认权限设置为 0755，所有者为\
    \ root，组为 root，但让配置文件的权限为 0644，你可以在 spec 文件中使用以下内容：\n\n```\n%files\n%defattr(0755,root,root)\n\
    /usr/bin/my-first-program\n%attr(0644,root,root)%config /etc/my-first-program\n\
    %doc %name-version/README\n%doc %name-version/COPYING\n%doc %name-version/LICENSE\n\
    ```\n\n将 `my-rpm-2.0-1.spec` 文件复制到 `my-rpm-3.0-1.spec`，将 Version 更新为 3，将 Release\
    \ 重置为 1，并复制 BUILDROOT 以使其目录名称与新的 Release 匹配：\n\n```bash\n[rpm@packaging SPECS]\
    \ $ cp my-rpm-2.0-1.spec my-rpm-3.0-1.spec\n[rpm@packaging SPECS] $ vi my-rpm-3.0-1.spec\
    \ (只是为了更新 Release)\n[rpm@packaging SPECS] $ cd ../BUILDROOT/\n[rpm@BUILDROOT]\
    \ $ cp -r my-rpm-2.0-1.x86_64/ my-rpm-3.0-1.x86_64/\n```\n\n当你安装 RPM 时，你可以看到权限已设置在\
    \ spec 文件中：\n\n```bash\n$ rpm -bb my-first-rpm-3.0-1.spec\n$ rpm -ivh RPM/x86_64/my-first-rpm-3.0.1.x86_64.rpm\n\
    $ ls -l /usr/bin/my-first-program\n-rwxr-xr-x 1 root root 227 /usr/bin/my-first-program\n\
    $ ls -l /etc/my-first-program.config\n-rw-r--r-- 1 root root 140 /etc/my-first-program.config\n\
    ```\n\n## 第 5 章：安装脚本 (Install-time Scripts)\n\n除了 RPM 中的元数据外，包管理器其他用处之一是可以在包的安装、升级和卸载期间运行的脚本。因为\
    \ RPM 是围绕从源码编译软件的概念构建的，所以某些脚本类型专门用于处理我们将在书中后面介绍的功能。在本节中，我们只查看四种脚本类型：`%pre`、`%preun`、`%post`\
    \ 和 `%postun`。它们分别在安装前、卸载前、安装后和卸载后运行。其他脚本类型处理源码的准备和构建。\n\n默认情况下，这些脚本由 shell 使用\
    \ `-e` 选项执行，但你可以通过在 spec 指令中添加 `-p <interpreter>` 来定义任何其他解释器，例如：`%post -p /usr/bin/python`。注意：`-e`\
    \ 选项意味着脚本中的任何命令失败，它将立即以非零状态码（表示失败）退出，而不处理任何后续操作。在 RPM 脚本中运行运行的命令设置完整路径是一个好主意；RPM\
    \ 默认设置一组非常受限的目录：`/sbin:/bin:/usr/sbin:/usr/bin`。\n\n通过创建一个如下的简单 .spec 文件，可以看到不同脚本是在安装的哪个阶段执行的。使用\
    \ \"rpmbuild -bb my-first-rpm-4.0-1.spec\" 构建它（假设 my-first-rpm-4.0.spec 是该 spec文件的文件名）：\n\
    \n```spec\nName: my-first-rpm\nRelease: 1\nSummary: This is my first RPM\nLicense:\
    \ GPL\nVersion: 4.0\nVendor: Steve\nGroup: Documentation\n\n%description\n这是我的第一个\
    \ RPM 包。我可以在这里更详细地描述它。\n将这些部分格式化为 80 列宽是正常的，这样在任何屏幕上都可以轻松阅读。\n\n%preun\necho \"\
    In the %preun pre-uninstall script now.\"\n```\n\n```spec\n%files\n%defattr(0755,root,root)\n\
    /usr/bin/my-first-program\n%attr(0644,root,root)%config /etc/my-first-program\n\
    %doc %name-version/README\n%doc %name-version/COPYING\n%doc %name-version/LICENSE\n\
    ```\n\n### 安装前脚本 (Preinstall Script)\n\n在安装 RPM 中的任何文件之前，`%pre` 脚本会运行。它可以通过配置文件无法实现的方式准备系统。例如，httpd\
    \ 包可以创建一个用户账户的预安装脚本。\n\n标准情况下，如果安装脚本以某种方式失败，RPM 将不会安装。这并不是我们想要的行为，所以有多种方法可以绕过——一种方法是认为创建用户账户失败是一个严重问题，但不至于导致无法安装软件。在这种情况下，`%pre`\
    \ 脚本可能如下：\n\n注意：`|| true` 意味着如果命令失败，则改为运行 `true` 命令。`true` 命令是一个特殊的内置命令，返回成功（返回码\
    \ 0），这使得 RPM 认为操作成功了。另一个命令是 `:`，它在本质上与 `true` 一，所以你会看到这种晦涩的 `||:` 语法。行尾的 `\\`\
    \ 只是为了换行——它意味着命令在下一行继续。\n\n```bash\n%pre\n/usr/sbin/useradd -c \"Apache\" \\\n\
    \  -u 48 -s /sbin/nologin -r \\\n  -d /usr/share/httpd \\\n  apache 2> /dev/null\
    \ || true\n```\n\n### 安装后脚本 (Postinstall Script)\n\n`%post` 脚本在文件安装后执行。它可以完成任何必要的清理工作，并通常用于自定义配置文件，以及通过\
    \ `chkconfig` 命令注册启动脚本。一个示例可能是：\n\n```\n%post\n/sbin/chkconfig --add httpd\n```\n\
    \n### 卸载前脚本 (Pre-Uninstall Script)\n\n`%preun` 脚本在文件从系统中删除之前执行。它仍然可以使用配置文件，并在必要时最后运行一次程序以进行任何清理工作。典型的任务包括停止服务、通过\
    \ `chkconfig` 取消注册，以及清理它在运行期间创建的任何额外文件。此部分也可以用于清理配置文件或数据文件，尽管这可能具有风险，因为你可能不想删除用户精心设计的配置文件，例如。一个示例脚本可以是：\n\
    \n```\n%preun\n/sbin/service httpd stop\n/sbin/chkconfig --del httpd\n```\n\n"
