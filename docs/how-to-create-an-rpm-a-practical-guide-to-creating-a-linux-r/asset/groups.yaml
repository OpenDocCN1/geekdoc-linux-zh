    # Chapter 7: Replacing Configuration Files


    When upgrading software, the new software version being installed may introduce
    new entries in its configuration files, or even an entirely new format for its.
    If the user has not changed the configuration, the upgrade will simply replace
    the old, default configuration files with the new default versions. If the user
    has customized their configuration file since installing the package, RPM is faced
    with a dilemma. it would be wrong to wipe out the user''s changes, but the updated
    RPM needs to install the new file with the new version of the software, otherwise
    the user won''t get to see the new configuration file to compare with the existing
    one.


    There is also the restriction that RPMs should never interactive with the user
    when installing, removing, or upgrading. This is that RPMs can be en messa by
    an installer, such as Red Hat''s Anaconda script. So stopping to ask the user
    which the configuration they want to keep, as Debian packages do, is not an option
    with RPMs.


    For example, if you were to install the Apache httpd server, then make a simple
    edit of /etc/httpd/conf/httpd.conf to update the Listen directive to listen on
    port 81 instead of the default port 80, it might (in theory at least) be possible
    for the upgrade RPM to compare your file with the one be installed, since your
    desired configuration, and apply that logic to the new httpd.conf file. However
    this would soon become complicated, and for something reasonably complex, as the
    famously unintelligible sendmail.cf, it would just be best impossible to write
    a safe upgrade script for every situation.


    In other situations, the configuration file format may change entirely, and some
    old features may be obsolete, which no upgrade script would be to deal with.


    What RPM does, therefore, is to leave the existing file untouched, and install
    the new file so the user can compare the new and old versions. By default, if
    the existing file has been edited, RPM will save it as .rpmsave (for example,
    /etc/httpd/conf/httpd.conf.rpmsave) and install the new configuration file, with
    all of its default settings, as /etc/httpd/conf/httpd.conf.


    That isn''t the best thing to do, however the file format does not change (or
    at all), and the new version of the software is expected to work with the user''s
    customized configuration file, the RPM can declare the as %config(noreplace),
    instead of the default %config. In this situation, RPM will leave the user''s
    configuration file in place, and install the new one as .rpmnew, for example,
    /etc/httpd/conf/httpd.conf.rpmnew.


    When creating an RPM, you can bear in mind these two different options, and choose
    the most suitable behaviour for each configuration file that you package.


    Whatever operation is needed, RPM will display a message to tell an alerts administrator
    what has been done, so that they can look at the files and decide what they want
    to do with them.


    With the RPM that we have been using in this book, /etc/my-first-program.conf
    be'
