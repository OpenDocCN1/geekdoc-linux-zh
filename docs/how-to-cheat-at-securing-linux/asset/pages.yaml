    # # Providing Secure Remote Access


    Sooner or later are odds that you will either want or the ability to work remotely.

    Providing remote access must be undertaken very cautiously, because, as soon as
    you allow an

    employee to connect to the corporate network, you have to some degree, extended
    your net-

    boundary to your workstation. This means your network''s security is now only
    as good

    as the security of the remote user''s system or network. In many cases borders
    on no secu-

    at all. That is why remote access must only be granted after careful consideration
    and

    planning. While the different types of remote access pose different levels of
    security risk, there

    are some planning and configuration steps that are common to all of them.


    The first task is to determine what type of remote access is appropriate. With
    a virtual

    tunnel network (VPN), it is as if the remote workstation is on the corporate network.
    This

    general provides the greatest level of functionality, but also poses the greatest
    risk. If the

    remote system is compromised, an attacker will be effectively inside your corporate
    network.

    While there are steps you can take to mitigate these risks, they may be time-
    and effort-\intensive. To plan, configure, and properly secure a VPN solution
    is the most involved choice

    of the various remote access solutions you could provide.


    Another option is to provide remote desktop functionality. This would allow a
    remote

    user to see and use the desktop of a system at work. A remote desktop acts as
    if the user is at

    work, while a VPN acts as if the user''s computer is at work. This type of solution
    is slightly\easier to implement, because you can typically isolate the traffic
    that needs to be permitted

    rough the firewall to a single TCP port. Many of the risks exist, in that if an

    attacker gains access to move information out of the network or otherwise cause
    mischief. Another key considera-

    with this type of solution is that you need to have a computer at home and a computer

    at work. With the VPN option, you only need to use one system, so if the user
    is a laptop,

    it can be used while they work remotely.


    The last and final option is that of a remote shell. Because most average users

    dot operate extensively (if at all) in a console (i.e., text only) this type of

    remote access is generally most viable for network administration personnel. While
    it may be

    im가능 for accountants to operate their accounting program without a GUI, many net-

    works and most firewall administration tasks can be performed with only terminal

    access. Because the widely used Telnet protocol sends all data unencrypted, any
    sensitive tasks

    should only be performed using a secure protocol such as secure shell (SSH), or
    Telnet over

    Secure Internet Protocol (IPSec) tunnel.'
  merge: -1
