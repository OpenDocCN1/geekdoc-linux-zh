    for each direction the data moves on the network. Now the two data streams need
    to be combined to be able to get a complete picture of what is happening on the
    monitored network. Channel bonding (a trunk), combining two network interfaces
    into a single logical one (this is more commonly done to provide improved network
    throughput) is one effective way to accomplish this combining of the data streams.
    Network taps are also a significant cost element in the implementation of an intrusion
    detection system (IDS).


    # Configuring Channel Bonding for Linux


    Setting up channel bonding for Linux systems is straightforward. First, the kernel
    must be configured to support bonding. When you are configuring the kernel, the
    option for bonding driver support under the network device menu should be set.
    If the bonding driver is set as a module (this is the easiest to manage), then
    there will be a module called bond0. Once the kernel support bonding is running
    and the bonding module is loaded, the interface can be started. For distributions
    that use configuration control like Red Hat, the following needs to be done to
    start the interface.


    +   First, create a file ifcfg-bond0 in the directory /etc/sysconfig/network-scripts.
    This file should look like:


    ```

    DEVICE=bond0

    BOOTPROTO=none

    ONBOOT=yes

    NETWORK=192.168.10.0

    NETMASK=255.255.255.0

    IPADDR=192.168.10.254

    USERCTL=no

    ```


    This sets up the virtual interface, bond0 in this case. If the kernel is using
    bonding as a module, the modules.conf file should contain the alias bond0 bonding,
    which associates the module with this virtual interface. You still need to define
    which physical interfaces should be combined to implement the virtual interface.
    For eth0, the ifcfg-eth0 should be edited to look like:


    ```

    DEVICE=eth0

    BOOTPROTO=none

    ONBOOT=yes

    MASTER=bond0

    SLAVE=yes

    USERCTL=no

    ```'
