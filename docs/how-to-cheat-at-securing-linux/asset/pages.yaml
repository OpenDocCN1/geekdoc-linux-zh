  md: '# Chapter 2 • Hardening the Operating System


    Because sudo logs all commands as root (or specified otherwise), administrators
    use sudo instead of using the root shell. This allows them to log their own commands
    for troubleshooting and additional security.


    The ticketing system is ideal because if the root user walks away from the system
    while still logged in (a very bad idea), another user cannot access the system
    because he has physical access to the keyboard.


    After the ticket expires, users must log on to the system again. A shorter time
    is recommended, such as the default five minutes. The ticketing system also allows
    users to remove their ticket file.


    # System Requirements


    To install and run sudo you must have a system Unix. Almost all versions of Unix
    support the sudo source distribution, including almost all flavors of POSIX, BSD,
    and SYSV. You must also install the C compiler and make the utility.


    Sudo is known to run on the following Unix flavors: Aus, SunOS, Solaris, ISC,
    RISCOS, SCO, HP-UX, Ultrix, IRIX, NEXTSTEP, DEC Unix, AIX, ConvexOS, BSD/OS, OpenBSD,
    Linux, UnixWare, Pyramid, ATT, ReliantUX, NCR, Unicos, DG/UX, Dynix/ptx, DC-CX,
    HI-UX/MP, SVR4, and NonStop-UX. It also runs on MacOS


    # The Sudo Command


    The sudo command allows a user to execute a command as a superuser or another
    user. All configurations for sudo are written to the /etc/sudoers file. The sudoers
    file specifies whether that command is allowed by that particular user.


    In order to use sudo, the user must have already supplied a username and password.
    If a user attempts to run the command via sudo and that user is not in the sudoers
    file, an e-mail is automatically sent to the administrator, indicating that an
    unauthorized user is accessing the system.


    Once a user logs in to sudo, a ticket is issued by default for five minutes. A
    user can update the ticket by issuing the -v flag, which will validate the ticket
    for another five minutes. The command is entered as follows:


    ```

    sudo -v

    ```


    If an unauthorized user runs the -v flag, an e-mail will not be sent to the administrator.
    The -v flag informs the unauthorized user that he or she is not a valid user.
    If the user enters command via sudo anyway, an e-mail will then be sent to the
    administrator.


    Sudo login attempts, successful and unsuccessful, to the syslog(3) file by default.
    However, this can be changed during sudo configuration. Some of the command-line
    options listed in Table 2.7 are used by sudo.'
