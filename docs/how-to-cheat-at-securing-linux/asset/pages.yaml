  md: '# Minimizing Services


    Like a Windows system, your chosen Linux distribution will likely be installed
    with a large number of programs configured to run automatically, without human
    intervention. On Windows systems these programs are called *services*; on Linux
    they are called *daemons*. On effort to minimize the amount of software that is
    running and thus reduce the number of targets a hacker might try to exploit, should
    disable any daemons that are not needed. Determining which daemons are needed
    will require some investigation and testing. You''ll find a list and brief description
    of daemons in Fedora Core 5 at www.mjmwired.net/mjm-services-fc5.html.


    To configure the daemon, navigate to **System | Administration | Services.** Fedora
    actually uses the Windows terminology to refer to the daemons as services.* This
    will open the GUI interface shown in Figure 10.1.


    # **Figure 10.1** Daemon Control Panel


    ![](img/b38c01d2fda8509e8449e32f876ae148_361_0.png)


    Highlighting a service in the leftmost pane will pull up a description and some
    additional details in the Description and Status panes, respectively. Disabling
    a check mark next to the service in question, clicking **Save** in the upper-right
    corner of the window and reboot.'
