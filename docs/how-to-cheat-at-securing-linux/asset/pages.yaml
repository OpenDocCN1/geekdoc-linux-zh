  md: '# Summary


    As you can see, Linux has many free and powerful security tools at its disposal.
    With a little care and planning, a Linux bastion host can be at least as secure
    as a Windows bastion host, if not so more. Although they may take some getting
    used to, the package managers offer a powerful way to install and update packages.
    Windows users might find the interfaces a bit odd, but the ability to download
    free software for firewalls, Web servers, and much more, from a single interface,
    is something most users don''t easily have. Netfilter offers a powerful firewall
    with many advanced features built in, for free. There is no firewall with comparable
    functionality included in this chapter with the Windows operating system. Armed
    with the knowledge in this chapter, you should be able to connect your Linux bastion
    host to the Internet and not get hacked, and if the system should be compromised,
    you will have logs to see it is happening, or at worst, to reconstruct events
    so that it doesn''t happen again.


    # Solutions Fast Track


    # System Installation


    +   - Be Cognant of alternate OS media other than a traditional hard disk install.

    - Research the strengths and weaknesses of a particular distribution and choose
    accordingly (not all are created equally).

    - Prepare the hard disk (if needed) with foresight, especially with an eye for
    logging.


    # Removing Optional Components


    +   - Think minimally. If you don''t need the software in question, remove it.

    - For services you need, control when they run. Some can be enabled as needed
    and don''t need to be running at startup.

    - Ensure that none of the "high-risk services" are running at all costs, and provide
    comparable functionality via more secure alternatives if needed.


    # Additional Hardening Steps


    +   - Make sure your system''s time is accurate. This is important for forensics
    and encryption.'
  merge: -1
