    Updates and Patches" section there is a small link called updates archive. Click
    that link and on the following page, download all the available updates to your
    local system.


    > All of the updates must be applied sequentially; the SmoothWall updates are
    not cumulative updates. Apply update 1 first, then update 2, and so on, until
