  md: '# Security Enhanced Linux


    Security Enhanced Linux or SELinux is a research initiative from NSA (National
    Security Agency). Recommendations of this project are incorporated in various
    Linux distributions. The project focuses on utilizing mandatory access control
    (MAC) architecture incorporated into the kernel subsystems rather than working
    on the security vulnerabilities on the operating system itself. Information on
    SELinux, whitepapers, presentation and downloads are available at www.nsa.gov/selinux/index.cfm.


    Red Hat has incorporated SELinux in its releases. If you have not enabled SELinux
    during the installation stage, the same can be enabled from


    Let''s look at the components of SELinux specific to Red Hat Enterprise Linux
    (RHEL) in version 5. Before that you need to enable SELinux.


    +   To enable SELinux click on System | Administration | Security Level and Firewall


    +   Click on the second tab SELinux. You will find three options Enforcing (policy
    enforced), Permissive (warnings only, no policy enforcement) and Disabled (SELinux
    policy fully disabled state). Once you have enabled SELinux, the system may re-label
    the file system for SELinux. This requires a restart.


    +   To manage SELinux click on System | Administration | SELinux Management Tool.
    This tool has status, boolean, file labeling, user mapping, SELinux user, translation,
    network port and policy module configuration options. First screen that opens
    is the status screen. This includes the current status for system default enforcing
    mode, current enforcing mode, and system default policy type. In this case it
    is permissive, permissive and targeted as shown in the Figure 2.26. When you have
    enabled SELinux the file system is already relabeled. You do not have to select
    the checkbox ''relabel on reboot'' once again.


    +   Next is the Boolean screen. In this screen, you choose individual services
    and enable or disable (yes or no) specific policy settings. This is where you
    configure run-time Booleans. For example, for HTTPD Service you may allow HTTPD
    cgi support, allow HTTPD to read home directories and allow HTTPD to support built-in
    scripting as shown in the Figure 2.27.'
