  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9


    Short of any advanced packet mangling, there isn''t much you can''t accomplish
    using Firestarter as your configuration tool. If you need to implement a more
    advanced configuration, use an alternate tool, or generate the configuration using
    Firestarter and use those chains as a starting point to add your own more advanced
    options.


    # Easy Firewall Generator


    Easy Firewall Generator is not a GUI per se, but it does help simplify your netfilter
    configuration and avoid the need to be familiar with the iptables syntax. By using
    the Web page at http://fwgen.morizot.net/index.php, you can enter the relevant
    information and click the **Generate Firewall** button. As you select options,
    if additional information is needed click the **Generate Firewall** button and
    the page will refresh and provide the additional input fields. When all of the
    required information has been entered, the page will change to a text page that
    can be copied and pasted for iptables to read as a saved configuration. On Fedora
    Core 5 the iptables configuration is stored in /etc/sysconfig/iptables. Although
    this method requires you to replace the default iptables configuration file used
    by your distribution, it is fairly painless, and supports all of the same basic
    functionality


    # Firewall Builder


    Firewall Builder is the most complete GUI for managing netfilter firewalls with
    features comparable to some commercial products. As is always the case, this functionality
    and capability come at a price; as far netfilter GUIs are concerned, Firewall
    Builder is not the easiest to configure and use. If you want or need superior
    management capabilities, however the extra effort is worth it. (Download firewall
    from fwbuilder.org.) Firewall Builder manages netfilter firewalls as well as ipfilter,
    OpenBSD PF and (commercially) Cisco PI firewalls. Firewall runs on many popular
    operating systems including Red Hat, Mandrake, FreeBSD, Mac OS X, and Windows
    XP.


    Firewall Builder operates differently than all of the GUIs covered so far. It
    uses an object-based approach. Essentially, you must define an object to represent
    any entity that you want to use in the firewall rules. In this means a source,
    a destination, and a service (port) at a minimum. Both the configuration and the
    GUI bear a strong resemblance to that of the Checkpoint Firewall GUI. Once the
    objects are defined, you can draw and drag them into the rules in order to permit
    or deny communications between the two. For this example we use a Windows XP host
    to run Firewall Builder and configure a Linux netfilter firewall.


    +   Install Firewall Builder.


    +   Start the GUI by navigating to **Start | Programs | Firewall Builder 2.1 |
    FWBBuilder**, which opens the main Firewall Builder window. It is divided up into
    an objects tree (the left pane) and the dialog area (the right pane) (see Figure
    9.19).'
