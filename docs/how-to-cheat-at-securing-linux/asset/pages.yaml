  md: '# Chapter 5 - Installing and Configuring Snort and Add-Ons


    crontab -u <user> -e


    Enter the username you are running Oinkmaster as in place of <user>. This will
    open the crontab for that user. Adding the following line to the crontab will
    cause Oinkmaster to run night at 2:00 AM. If you prefer, there are more GUI Consoles
    available for configuring the cron daemon, such as gnome-schedule.


    ```

    0 2 * * * oinkmaster.pl -C /etc/oinkmaster/oinkmaster.conf -o /etc/snort/rules

    ```


    Now your Snort rules should stay up to date. Remember, if you change Snort versions,
    the URL to the appropriate rules may change, in which case you will need to update
    your oinkmaster.conf accordingly.


    # WARNING


    Because the oinkmaster.conf file contains the path to update your Snort rules,
    if this file does not have secure access permissions on, someone who could edit
    the file could render your IDS useless. With the ability to edit the configuration
    file, a malicious user could point the URL to one of his choosing, with empty
    rules that will not trigger on anything, or even worse, rules that work perfectly
    except ignore the attacker''s IP address. Make sure the oinkmaster.conf file is
    secured and only the account you are running Oinkmaster has access to the file.


