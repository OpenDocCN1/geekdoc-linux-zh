    The -t option is used to specify the table we want to modify, and the -A option
    specifies that we are going to append this rule to the POSTROUTING chain. By specifying
    the outbound interface, we are ensuring that the SNAT only occurs as traffic leaves
    the private network, meaning only in the proper direction.


    > SNAT can only be performed in the nat table. However, the rules for SNAT can
    only go in the POSTROUTING chain of the nat table. This means that any time you
    use SNAT, your rule will contain -t nat -A POSTROUTING.


