  md: '# Basics of Cryptography and Encryption • Chapter 8 255


    algorithm (whether weak or strong) when its complexities are completely unknown.
    Thus, when you use an open algorithm, you can rest assured in its strength. This
    is opposed to a proprietary algorithm, which, if weak, may eventually be broken
    even if the algorithm itself is not completely understood by the cryptographer.
    Obviously, one should limit the trust placed in proprietary algorithms to limit
    long-term liability. Such scrutiny is the reason the inner details of many of
    patented algorithms in use today (such as RCG from RSA Laboratories) are publicly
