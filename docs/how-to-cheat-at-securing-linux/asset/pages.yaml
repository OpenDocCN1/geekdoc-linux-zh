  md: '# Digital Signatures


    Digital signatures serve to enforce data integrity and non-repudiation. A digital
    signature ensures that the message received was the message sent, because a hash
    was performed on the original message using a hashing algorithm. The hash value
    created by this process is encrypted by the author''s private key and appended
    to the message. To verify that the message has not been modified, the recipient
    uses the author''s public key to decrypt the hash created by the author. The recipient
    also creates a hash of the message body. If the recipient''s hash matches the
    hash created by the author, the recipient knows that the message is unaltered.
