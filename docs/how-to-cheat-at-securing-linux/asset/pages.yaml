  md: '# Chapter 5 • Installing Snort and Add-Ons


    Luckily, there are some options for getting around this feature. Most enterprise
    switches have a port mirroring option. The terms used to describe this functionality
    varies from one manufacturer to another, Cisco calls it Switched Port Analyzer
    (SPAN). This enables you to configure a specific port so that it will see traffic
    from other designated ports (or all other ports) even though the traffic is destined
    for a different port. Typically, one port is configured to mirror all other ports
    and the IDS is attached to this port. On a Cisco 3750 switch with 24 ports you
    can configure mirroring by executing the following commands:


    ```

    switch(config)# monitor session 1 source interface gig1/0/1 - gig1/0/23

    switch(config)# monitor session 1 destination interface gig1/0/24

    switch(config)# end

    ```


    This setup is pretty straightforward. One specifies which ports to forward traffic,
    and from two lines specify which port the traffic should be mirrored to.You need
    to refer to the user guide for your specific switch hardware to see if port mirroring
    is supported, and if it is, how to configure it.


