  md: '# Table 2.7 Selected Sudo Command Options


    | Option | Option Name | Description |

    | --- | --- | --- |

    | -V | Version | Prints version number and exits. |

    | -l | List | Lists the commands that are allowed and denied by current user.
    |

    | -h | Help | Prints usage message and exits. |

    | -v | Validate | Updates the user''s ticket for a configured amount of time.
    If required, the user must re-enter the user password. |

    | -k | Kill | Expires the user''s ticket. Completing this option requires the
    user to re-enter the user password to update the ticket. |

    | -K | Sure kill | Removes the user''s ticket entirely. User must log in with
    username and password after running this option. |

    | -u | User | Runs the specific command as the username specified. The user specified
    can be any user except root. If you want to enter a uid, enter #uid instead of
    the username. |


