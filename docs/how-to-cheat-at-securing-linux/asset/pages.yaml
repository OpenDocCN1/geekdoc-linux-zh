    # Tools & Traps...


    # Accidents Happen


    I saw a corporate firewall/DMZ with a connection that allowed traffic to completely
    bypass their Internet firewall. I do not know why this happened, because the organization
    was not lacking properly trained networking professionals. These types of errors
    could occur because someone didn''t analyze the implications of the changes adequately.
    Perhaps it was a "rush" to install some connectivity, or an emergency repair,
    or a "temporary" fix. All of these things would indicate poor procedures. It is
    also possible that someone didn''t realize the complete layout of the network
    when they made the connection in question, which could indicate inadequate network
    documentation among other things. In any case, we were trained professionals who
    should have known better, but accidents happen to the best of us.


    # Implementing Firewalls


    When it comes to selecting a firewall there are a host of factors to consider.
    For commercial offerings there is the up front cost in adding maintenance costs,
    which in cases can be considerable. Some commercial offerings run on their own
    base system (e.g., Cisco PIX). The underlying Linux system has been heavily modified
    and is now proprietary. In case of a Linux firewall, you also have the option
    of installing the firewall software on a Compact Disk – Read Only Memory (CD-ROM)
    or pen drive. These steps are discussed in detail in the following sections, with
    specific examples for setting up a free firewall on both Linux and Windows.


    # Hardware versus Software Firewalls


    Another consideration is whether the firewall decision-making logic is as software
    that sits on top of another functional system, or if the firewall is a dedicated
    piece of hardware. In the case of a Cisco PIX firewall, the smallest models are
    the size of a small cigar box and there is no OS other than the PIX software.
    This is a dedicated hardware device used to perform the firewall function, also
    called a firewall appliance. The other alternative is that the firewall is not
    a dedicated box, but a software component. Many popular firewalls then the approach
    as well, such as a checkpoint firewall that can be installed on top of a Windows'
  merge: -1
  pgno: 292
- img_proc: true
  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9


    system. Of these two approaches, if you want a free solution the choice is made
    for you. I know of no free hardware-based firewalls, so you will be using a software
    firewall.


    # Configuring netfilter


    When it comes to Linux-based firewalls, there is only one choice, which is netfilter.
    This is partially true because it was the best option available for the longest
    time. Since version 2.4, however, netfilter has been built into the Linux kernel.
    Even many commercial firewalls are running a modified Linux OS with netfilter
    inside their own custom case. netfilter is the underlying theory that makes up
    the built-in firewall on Linux systems. It is the netfilter component that reads
    the contents of the network packet and permit or deny traffic. Many people incorrectly
    refer to the firewall as iptables, or prior to that, ipchains. In fact, iptables
    is the software command to configure the rules that netfilter uses to make decisions
    to permit or deny traffic and ipchains is the previous version of iptables. Even
    after you have settled on Linux as your base OS for your firewall, there are some
    additional choices to make before you start any configuring.


