    upper layers and the protocols that operate at the MAC sublayer (e.g., Ethernet,
    Token Ring, and so on). The LLC sublayer is defined by Institute of Electrical
    & Electronics Engineers (IEEE) 802.2. Link addressing, sequencing, and definition
    of Service Access Points (SAPs) also take place at this layer.


