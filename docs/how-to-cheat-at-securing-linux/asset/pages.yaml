  md: '# Placing Your NIDS


    When it comes to implementing a network intrusion system (NIDS) like Snort, the
    single biggest factor in its effectiveness is its placement within the network.
    The value of the NIDS is in identifying malicious traffic and obviously it can''t
    do if it can''t see the traffic. This means you want to place the NIDS in a location
    to maximize the data it will see. In smaller environments there may be only one
    switch or hub, this is a pretty simple decision. Depending on your objectives,
    you may place inline with the Internet connection only so that you are inspecting
    traffic to or from the Internet. In a large installation, you will need to place
    multiple network cards in the NIDS so that it can inspect traffic from several
    chokepoints in your network.


    > Notes from the Underground...


    Further Considerations Remember that an IDS is also a target for a hacker just
    like any other system, and even more so. As such, the IDS host system should be
    hardened and locked down as much as possible. In addition to being a target because
    it can alert alert administrators to their activities, the hacker might target
    the IDS system itself because it often logs with valuable information in it on
    various systems. The IDS also has the capability of capturing packets that match
    its rulebase, and these packet dumps can contain valuable data as well. Not neglecting
    your IDS or you may be creating a security liability instead of the asset you
    intended.


    Be cognizant of the fact that if you choose to install multiple network cards
    to monitor segments you have the potential to create an alternate data path that
    enables traffic to bypass a firewall. As part of your hardening of the Snort host,
    you must ensure that routing is not enabled so that Snort cannot forward traffic
    from one segment it is monitoring to another. There are multiple approaches to
    protect against this hazard. The simplest is to use a network tap instead of plugging
    in a normal network tap. A tap is a specially designed piece of hardware that
    will only listen to but not transmit. Because it is hardware, there is no possibility
    of hacking the configuration or making a mistake in the configuration and accidentally
    allowing routing. Unfortunately, network taps are not free. Disabling routing,
    ensuring the host has no static routes, and disabling any routing protocols is
    the free way to ensure that you don''t create a path through a firewall. Figure
    5.1 illustrates bypassing the firewalls with your IDS.'
  merge: -1
