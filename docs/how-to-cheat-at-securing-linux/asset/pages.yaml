- img_proc: true
  md: 'Presenting the Business Case for Open Source Software • Chapter 1


    # Comparing Free Solutions with Commercial Solutions


    When it comes to making an informed decision as to whether to purchase a commercial
    solution or implement a free solution, there are some additional non-dollar considerations
    to take into account. First and foremost, compare like functionality. Don''t compare
    the deluxe version of the commercial product to the free version; they won''t
    have the same features or learning curve, or require the same hardware. Ultimately,
    by making the most informed and well-reasoned comparison possible, the best solution
    will be chosen.


    # Strengths of Free Solutions


    One advantage free solutions have over their commercial counterparts is that of
    development speed. This varies from one product to another; not free products
    have quick development cycles. The open-source packages have very fast development
    cycles and can address the latest security issue more quickly than their commercial
    counterparts. If you want to stay on the cutting edge, free software (especially
    open-source software) might be a better path than commercial solutions.


    Previously, we discussed customization as a cost savings with some free software.
    This is because you are trying to customize yourself instead of paying the vendor
    to do it for you. Customization is worth mentioning as a strength of its own,
    above and beyond the costs. Again, not all free software is customizable. Sometimes
    the best software in a particular category used closed code and there is no way
    for you to perform any customization. But one of the greatest strengths of the
    open-source movement is that anyone and everyone has the freedom to edit, customize,
    and improve the software.


    A potential strength of free solutions is the speed with which they can be implemented
    (which is different than the development speed). When I speak of the implementation
    speed of free software I am referring to the time it takes to get the software
    loaded and working. This includes not only installation, but also the red tape
    involved in making significant purchases. For example, you are trying to form
    a business partnership that will be beneficial to your organization. The nature
    of the arrangement is that time of it is the essence; the sooner the partnership
    is completed the better. The partnership involves network connectivity to facilitate
    the exchange of information. After reviewing the plans of how it would be done,
    your potential partner is hesitant to go with it, because you lack adequate firewall
    protection. Maybe your Internet connection is filtered with a consumer-level home
    router/firewall and you need a separate demilitarized zone (DMZ) with some advanced
    NAT rules and better logging. You could contact a vendor, wait for a response,
    get a quote on the price, and pass that to your manager for approval. After your
    manager approves the purchase, you hand it to accounting and they make the purchase
    and arrange shipping. Once it arrives, you must install and configure the new
    firewall and then'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Chapter 1 · Presenting the Business Case for Open Source Software


    test it. A faster approach would be to grab the old PC from the closet, download
    and install Linux on it, and configure the firewall. If your environment allows
    it, implementing the free solution could be much faster. In environments where
    there are restrictions on vendors, permitted software, permitted hardware, and
    so on, getting approval for a free solution could be more difficult and time consuming
    than a commercial solution. Ultimately, your environment will dictate whether
    implementation speed can truly pay out as an advantage or not.


    You might think that all free software is produced by some school kid and will
    be unstable and lacking the quality control of a commercial software development
    project. While this is true some of the time, at other times the larger, well-established
    open-source projects can have hundreds of programmers revising, scrutinizing,
    and modifying the code. Very few commercial companies have the same amount of
    resources to put into a single software product. This means that in many cases
    you are getting software has been through more peer review and testing than commercial
    equivalent. This is not always true; in many cases the free software has very
    little quality control and you, as the user, are really doing the testing. Basically,
    this means that the quality of free solutions will have a lot of variance. To
    increase the odds that not implementing buggy software, do your homework. If you
    stick to products that have a proven record you will certainly improve your offers.
    Avoiding new releases that implement major architectural changes may help as well.
    The current release of a product you are using incorporates newly added support
    for the latest chipset, it might be wise to wait for that to be tested a little
    before deploying it in your environment. For an excellent and lengthy article
    on the merits of free software, refer to http://www.dwheeler.com/oss_f_why.html.
    In reality, some of the free offerings are not fit to be run in any sort of critical
    role, while others can do so with aplomb. Ultimately, not all free software is
    “cheap” software; some of the free offerings are of high technical quality.


    # Weaknesses of Free Solutions


    The single drawback of implementing a free solution in a production environment
    is one of support, or lack of support. When you download something for the Internet,
    there is generally no phone number to call and ask questions. It is sometimes
    mitigated by high quality documentation, and in some cases online forums where
    you can ask questions and receive help from the creator of the package or other
    users. On the other hand, high-quality documentation is the exception rather than
    the norm, and many of the free utilities have little in the way of documentation.
    This consideration is one of the biggest concerns for management. Generally speaking,
    the more critical the role of the security software is, the more hesitant you
    would be implementing a solution with minimal support. If you are a company that
    depends on the Internet, you should require a'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Presenting the Business Case for Open Source Software • Chapter 1


    higher level expertise in in-house technical staff before implementing free Linux
    firewall, compared with another company that makes money in a storefront and uses
    the Internet to surf the Web. This isn''t to say that the support can be adequate
    with free software or that you shouldn''t use free solutions to fulfill critical
    needs, only that you need to do so knowingly after careful consideration and planning.


    The management capabilities of free software solutions are typically not as robust
    as they with commercial offerings.Your particular product will determine if this
    is a real consideration or not. Most often the presence or absence of management
    capabilities is more noticeable with IDSes, antivirus, and antisypware offerings.
    The common denominator here is that these products require frequent updates in
    order to maintain their value and their job effectively. An enterprise antivirus
    program will offer a level of control and features updates, as when and how to
    perform the updates and to handle things when a virus is detected. The free solutions
    are generally more limited, often requiring the scanning or updating process to
    be performed manually, and responding to positive detection may be an interactive
    process, rather than an automated one.


    Another area where the free solutions are sometimes lacking reporting. While some
    offer excellent reporting, many others lift to no reporting capability. In most
    cases, you will be able to manually configure some type of reporting on your using
    freely available utilities. If you can arrange for some automated logging or reporting
    to be generated, it won''t be as simple or natively as it would be if a commercial
    product that supported that functionality natively. As you begin considering free
    solutions, you will want to consider not only the logging capabilities you want,
    but those you need. In many cases, if you are in a highly regulated industry,
    such as banking, or healthcare, the lack of adequate logging capability is the
    determining factor that leads to a decision to go with commercial software. If
    you have auditors you need to satisfy, you will want to research the audit trail
    you will be able to generate carefully, before coming to a strategic decision
    on your solution.


    Previously, we touched on the fact that free solutions are often not well known,
    and how this can translate into a hidden cost in consulting fees. This liability
    can go beyond consulting. If you were hiring a new employee and specified that
    they need to know Cisco equipment, you could undoubtedly find someone in short
    order. If you specified you wanted them to be familiar with some little-known
    free solution you have implemented, you could have a very hard time finding someone.
    That''s not to say that they couldn''t be trained, but again, there are costs
    and disadvantages associated with that. The familiarity (or lack thereof) could
    also cause the time it takes to implement a solution to be longer than a more
    widely understood technology. Speed of implementation was mentioned as a potential
    asset, but it can easily be a liability if there is no one who understands the
    solution. Ultimately, there are advantages to using industry standard solutions
    over less widely deployed offerings.'
