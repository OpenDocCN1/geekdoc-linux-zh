  md: '# Chapter 9 • Perimeter Security, DMZs, Remote Access, and VPNs


    netfilter and iptables give you powerful packet filtering and manipulation capabilities
    for free. With Linux distributions available for free download, a firewall is
    within any company’s reach. Because of this, deploying firewalls internally to
    protect highly sensitive systems or is becoming increasingly viable. If you want
    to obtain a Linux firewall without installing Linux, try any of the many CDs that
    are available. Some excellent choices are Knoppix or Slax.


    # GUIs


    While the console commands that are used to manipulate and configure netfilter
    are not terribly complicated, they can sometimes get very lengthy. As the length
    of the line grows, the chances of an accidental error increase. Alternatively,
    you may not like working on the command line, in which case there is a wide variety
    of GUI and menu-driven interfaces for netfilter. In most cases, these menu-driven
    interfaces use your input to create the appropriate iptables commands, and alleviate
    you from having to know the various switches and options. There are a large number
    of GUI interfaces available to configure your netfilter firewall, which are listed
    in the following section in approximate order of ease. All these being equal,
    I have demonstrated the GUIs that are available on a wide variety of platforms
    on an equal quality that only works with one distribution. General, simpler also
    means less featured, so be aware that if you are trying to create a complex ruleset,
    some GUIs may not have the needed functionality.


    # Security Level Configuration


    You can start by navigating to System | Administration | Security Level and Firewall.
    You can also call the program directly by running system-config-securitylevel
    from a terminal. While the interface looks nice, it is limited in what you can
    configure. Basically, you can do this with GUI permit or deny certain ports. Fedora
    Core 5 configures the INPUT and FORWARD chains to jump to a custom chain named
    RH-Firewall-1-INPUT. There is no ability to differentiate ports permitted in the
    INPUT chain and the FORWARD chain, because all rules configured through the GUI
    are applied to this custom chain.


    Some services are pre-defined for you. Placing a check next to SSH and clicking
    OK and then Yes to commit the changes, would create the following rule in the
    RH-Firewall-1-INPUT chain:


    ```

    iptables -A RH-Firewall-1-INPUT -p tcp -m state --state NEW -m tcp --dport 22
    -j ACCEPT

    ```


    By expanding Other ports on the Firewall Options tab, you can enter a custom port
    number (see Figure 9.10.)'
