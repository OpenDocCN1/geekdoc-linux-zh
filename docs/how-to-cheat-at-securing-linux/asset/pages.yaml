    \ anywhere udp dpt:ipp\n  ACCEPT tcp -- anywhere anywhere tcp dpt:ipp\n  ACCEPT\
    \ all -- anywhere anywhere state RELATED, ESTABLISHED\n  ACCEPT tcp -- anywhere\
    \ anywhere state NEW dpt:ssh\n  REJECT all -- anywhere anywhere reject-with icmp-host-prohibited\n\
    ```\n\nTo start with, lets review some basic IPTables vocabulary. iptables is\
    \ the command-line utility for configuring the Netfilter firewall, which is integrated\
    \ with the Linux kernel. Specifically, Netfilter is a set of hooks inside the\
    \ Linux kernel that allows the various kernel modules to interact with the network\
    \ stack. In short, this is what allows the firewall to do the actual work of packet\
