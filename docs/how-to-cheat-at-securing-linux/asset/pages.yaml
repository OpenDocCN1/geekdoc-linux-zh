  md: '# Advancced Snort Deployment • Chapter 6


    esting possibilities for policy enforcement. For example, you could have a rule
    like the following example:


    ```

    alert udp any any <> any 53 (msg:"udp replace"; content:"forbidden.com"; replace
    "xxxxxxxxxxxxxx"; )

    ```


    This rule would prevent anybody from resolving the domain forbidden.com.


    # Solving Specific Security Requirements


    Now that we have a familiarity with the different ways to enhance the utility
    of Snort, we will take a look at some specific security requirements and how we
    might use rules and/plug-ins to address these issues.


    # Policy Enforcement


    Security policy enforcement consists of two components: detection of violations
    and taking action when a violation occurs. Detecting violations is the traditional
    use of Snort.You can accomplish detection through the use of an appropriate rule
    for the simpler cases or with a plugin for more complicated policies. Taking action
    when a violation occurs depends on the local security policy and how threatening
    the violation is. Action could be as simple as logging the event, or it could
    involve an active response like those described earlier that could block the violating
    connection.


    # Catching Internal Policy Violators


    Watching for internal systems that violate the local security policy is probably
    second only to inbound DMZ traffic in terms of usage for Snort. To use Snort for
    this type of monitoring, you use a series of rules that modify the local security
    rules, and then you are all set. For example


    ```

    alert tcp $HOME_NET any <> $EXTERNAL_NET 1863 (msg:"CHAT MSN message"; flow:established;
    content:"msg"; depth:4; content:"Content-Type|3A"; nocase; content:"text/plain";
    distance:1 classt:policy-violation; sid:540; rev:11;)

    ```


    will trigger if an internal system connects to MSN messenger.

    This type enforcement is very mean, so be sure to check if the rules that you
    are working already has what you need. Rules for watching what protocols and P2P
    protocols tend to be rather complicated because many of these protocols can use
    multiple network ports or tunnel on ports used for other protocols (typically
    port 80, the HTTP port) so that they can easily get firewalls.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '# Banned IP Address Watchlists


    Probably the easiest way to watch for communication with banned IP addresses with
    Snort is by creating a set of rules for each address.


    ```

    alert tcp $HOME_NET any <> $BANNED_NET any (msg:"TCP Traffic to banned network";nclassype:policy-violation;
    sid:1000001; rev:1)

    alert udp $HOME_NET any <> $BANNED_NET any (msg:"UDP Traffic to banned network";nclassype:policy-violation;
    sid:1000002; rev:1)

    ```


    The problem with rules like this is if the list of banned networks (or IP addresses)
    is very large, it gets awkward maintaining a huge list of banned destinations.
    If you expect to be maintaining large lists of banned destinations, a more elegant
    way of handling is to store the banned list in a database and write a detection
    plug-in.


    # Network Operations Support


    Using Snort for supporting network operations is primarily for making measurements
    of network utilization and performance.


    # Forensics and Incident Handling


    Forensics issues present an interesting problem for the utilization of Snort.
    Generally, when we think about forensics we are dealing with analyzing what happened
    after the fact. In case if you did not log the appropriate information or store
    it in a database, you are out of luck. However, if you are dealing with a situation
    that is ongoing, you can make good use of Snort’s capabilities. With an ongoing
    incident, one cannot always know what to look for, so running Snort as an IDS
    with special rules or plug-ins is not the best way to do it. Instead, in this
    situation Snort should be run in a packet-sniffing mode, storing everything to
    a binary (pcap) file and then analyzing the captured data:


    First,


    ```

    snort -deb L logfile.pcap

    ```


    then,


    ```

    snort -r logfile.pcap -c special.conf

    ```


    The configuration file special.conf will have the appropriate rules. In particular,
    this set of rules would involve the rule options: logto, session, and tag. So,
    for example, if you had reason to believe something worthy of investigation was
    happening in a telnet session that involved the local system 192.168.100.78, then
    special.conf would contain a session rule like:


    ```

    log tcp 192.168.100.78 any <> any 23 (session: printable; )

    ```


    which will log all the printable characters in the telnet session from that suspect
    system.'
  merge: -1
  pgno: 212
