  md: '# Hardening the Operating System • Chapter 2


    +   - Actions Whenever a pattern is discovered, SWATCH seeks an action, such as
    e-mailing the administrator of the failed login attempt.


    Two optional fields are used to further customize the configuration file:


    +   - Throttle determines the amount of time that SWATCH will ignore repeated
    entries before the entry again. This saves administrators’ time from viewing 300
    identical "Failed Authentication" errors. However, a secure system should limit
    the number of login attempts. The throttle entry is defined as HH:MM:SS, where
    H represents hours, M represents minutes, and S represents seconds.


    +   - Timestamp defines the length and location of the timestamp. The timestamp
    is defined as start:length.


    The following are two examples from the SWATCH configuration file. SWATCH will
    actively watch for these messages as they are written to their respective log
    files through syslog utility. The first example monitors logging for failed login
    attempts and e-mails root when a failed login attempt occurs.


    ```

    #Failed login attempts

    watchfor

    /failed/

    echo bold

    mail addresses=root,subject=Failed Authentication

    ```


    The second example monitors your log files and e-mails root when a user sued to
    gain root access.


    ```

    #Users sued to gain root

    watchfor

    /su/

    echo bold

    mail addresses=root,subject=User sued to root

    ```


    SWATCH filters logging files so that administrators only receive the information
    they require. It takes a lot of time and trouble once configured and is recommended
    for system administrators who are overwhelmed by log files (and perhaps do not
    use them for reason). To download an RPM version of SWATCH, visit www.rpmfind.net.


    # Scanlogd


    Scanlogd is an open source program that detects and logs TCP-port scanning on
    a system. For example, it can detect nmap scans. Nmap is a program used by hackers
    to create a "map" of your network. It is often the first step a hacker takes once
    he or she has access to your network to determine which system to hack. Nmap lists
    the systems and the services'
