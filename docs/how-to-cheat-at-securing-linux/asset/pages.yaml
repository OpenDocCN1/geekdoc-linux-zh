  md: '# Chapter 7 • Network Analysis, Troubleshooting, and Packet Sniffing


    # The TCP Handshake


    An important concept of TCP is handshaking. Before any data can be exchanged between
    hosts, they must agree to communicate. Host A sends a packet with the SYN flag
    to Host B. If Host B is willing and able to communicate, it returns the SYN packet
    and adds an ACK flag. Host A begins sending data, and indicates to Host B that
    it also received the ACK. When the communication between the hosts ends, a packet
    with the FIN (finish) flag is sent, and a similar acknowledgement process is followed.


    # TCP Sequence


    Another important component of TCP is sequence identification, where each packet
    sent is part of a sequence. Through these numbers, TCP handles complex tasks such
    as retransmission, acknowledgement, and order.


    # UDP


    UDP packets are the connectionless equivalent to TCP, and are used for many purposes,
    the most important being that DNS uses UDP for most of its work. DNS finds out
    which IP address corresponds to hostname (e.g., www.example.com is not routable
    as an IP address inside an IP datagram; however, through a DNS system it can find
    the IP address to route traffic to). Other uses of UDP include VoIP and many online
    games and streaming media types.


    # Hardware: Cable Taps, Hubs, and Switches


    Cable taps are hardware devices that assist in connecting to a network. Test access
    points (Taps) use this device to connect any cables between computers, hubs, switches,
    routers, and other devices. Taps are available in full- or half-duplex for 10,
    100, and 1,000 Mbps Ethernet links. They are also available in various multi-port
    sizes. The following is a list of popular cable tap products:


    +   - Net Optics carries several types of network taps for copper and fiber cables,
    and is available at www.netoptics.com.


    +   - The Finisar family carries a variety of taps for copper and fiber cables,
    and is available at www.finisar.com/nt/taps.php.


    A hub is a device that allows you to connect multiple hosts together on a shared
    medium (e.g., Ethernet). When a computer sends information, it travels to the
    hub and the hub forwards the information to all other computers connected to it.
    The computer that the information was intended for will recognize its MAC address
    in the packet header and accept the data. The area that the hub forwards all information
    is known as a collision domain (also known as broadcast domain). A hub has only
    one collision domain for all traffic to'
