    # Xprobe2: OS Fingerprinting


    Xprobe2 is primarily an OS fingerprinter, but also has basic port-scanning functionality
    built in to identify open or closed ports. You can also specify known open or
    closed ports, to which Xprobe2 performs several different TCP-, UDP-, and ICMP-based
    tests to determine the remote OS The version supplied with Auditor is one version
    behind, but newer versions have more fingerprints. You will likely want to provide
    Xprobe2 with a known open or closed port for it to determine the remote OS, as
    in Figure 3.13.'
