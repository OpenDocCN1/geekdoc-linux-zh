  md: '# Chapter 9 • Perimeter Security, DMZs, Remote Access, and VPNs


    # Lokkit


    Lokkit is an ncurses-based menu for configuring your netfilter firewall. Lokkit
    is available for most major distributions and can be installed by default on some
    (such as Fedora Core 5). To start Lokkit, type lokkit in a terminal window. The
    first lokkit screen is shown in Figure 9.12.


    # Figure 9.12 Lokkit Main Screen


    ![](img/b38c01d2fda8509e8449e32f876ae148_314_0.png)


    You can navigate the menus using the Tab key and the space bar to toggle the equivalent
    of radio buttons, such as the Enabled and Disabled options. If you select Enabled
    on this screen, the ruleset is applied. To edit any custom settings, press Tab
    until the Customize button is highlighted and then press Enter. The customization
    screen is shown in Figure 9.13.


    Lokkit does provide a little flexibility than the Security Level Configuration
    GUI discussed; however, it is still limited. By selecting an interface in Trusted
    Devices, all traffic from that interface is permitted. This would typically be
    used to select the inside interface and designate it as trusted. You do have the
    option of enabling MASQUADE. The interface you select is the one will NAT outbound
    traffic, therefore, you would generally select your external interface. Some pre-defined
    services are available, and you can enter your own service information in the
    "Other ports" section. Once you are satisfied with your choices, press OK and
    then Enter. This will take you back to the main screen, where you press OK and
    then Enter to apply the changes.'
