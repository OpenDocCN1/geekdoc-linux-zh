  md: '# Chapter 9 · Perimeter Security, DMZs, Remote Access, and VPNs


    source implementation of the X11 protocol. A closely related project is the XFree86
    Project (www.xfree86.org), which is an open source version of the XWindow system
    (which uses the X11 protocol). X11 is the protocol that is used to transfer information
    about the GUI between the server and the client. The end result of these design
    decisions is that much like Windows'' built-in terminal server, two Linux systems
    can remotely access each other via a GUI virtual desktop.


    You can configure the X Window System to permit connections from remote systems
    without any third-party software. While this works, the evolution of desktop Window
    Managers and common software packages has rendered this method inefficient. A
    more robust way to accomplish the same thing is using NX technology developed
    by NoMachine, which is a highly optimized product and protocol to make X sessions
    remotely for free (client and server) from nowmachine.com/download.php. Commercial
    variations are also available. You can see the differences between versions, and
    see what the limitations of the free version are at nowmachine.com/features.php.
    The big limitation is that the NX Free Edition limits to only two concurrent connections.
    In most cases this won''t be of a limitation unless you are trying to use it as
    a full-blown terminal server solution rather than just a remote access mechanism.
    An open source of the NX server is called FreeNX and is available (while the NoMachine
    server does). This is the recommended server and the one used in the following
    examples.


    Set up the FreeNX server

    nTo set up the FreeNX server, download and install FreeNX using whatever method
    is appropriate for your Linux distribution. For Fedora Core 5, I used yum install
    freenx. Yum (the package installer for Fedora Core 5) will automatically check
    for and install any dependencies. The aforementioned command installed the core
    nx package, and expect as dependencies. In the case of Fedora Core 5, there is
    no need for any further installation. Depending on the distribution you are using,
    the installation may be more involved. Of the major distributions should have
    packages available that make the installation relatively painless. You will need
    to have SSHD listening on port 22 in order for NX to work properly.


    ![](img/b38c01d2fda8509e8449e32f876ae148_346_0.png)


    > If you check the running services in an attempt to verify that the FreeNX server
    was installed successfully (via chconfig or the like), you will not see it listed.
    This is because the server FreeNX server does not sit and listen on a port for
    an inbound connection like most servers. Instead, when you log in via SSH running
    on port 22), it logs you as a special user (NX). That user''s profile is configured
    such that it executes a process to start up the server and listen for the inbound
    connection.'
