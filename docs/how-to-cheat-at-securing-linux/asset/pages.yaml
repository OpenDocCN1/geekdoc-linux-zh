    On the down side, this type of installation has all of the same disadvantages
    of a Windows bastion host. Namely that the entire system is sitting on the hard
    drive and if a hacker can compromise the root account, they will be able to install
    a virus or Trojan on the system that can survive future reboots. This type of
    install isn''t any better or worse than if you were using Windows for your bastion
