    # # Snort and Switched Networks


    Snort can be used on a switched network as well. Because switches are core infrastructure
    for most enterprises these days, monitoring them with Snort (or any other IDS)
    becomes more and more critical. Your switch can be inside your router or inside
    your firewall.


    A switch provides you with Layer 2 (Data Link layer on the OSI seven-layer model)
    configurability, including virtual LANs (VLANs), allowing you to subnet directly
    without routers. Switches have also been used as overpriced routers. (You''ll
    want to save your money if you''re not using your switch''s features.) In this
    case, you can connect the Snort system directly to the switch. The switch has
    a SPAN port (Switched Port Analyzer) port, which is where the Snort system will
    be connected. The Snort system then takes “copies” of all the packets to be analyzed,
    which are passed to it by the switch (see Figure 4.10).'
  merge: -1
