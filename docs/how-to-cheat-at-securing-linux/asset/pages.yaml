    # Other GUIs


    Although there are many filternet GUIs to cover them all extensively, I have tried
    to cover some of the best ones available. If none of the ones covered your fancy,
    or if you just like to experiment and see what is out there, you might want to
    investigate some additional offerings. If you are running KDE look into Guarddog
    which introduction is advice to novice users and the ability to define security
    policies by logical groupings called "zones." The Turtle Firewall Project (www.turtlefirewall.com/)
    allows you to administer your firewall host via a Web interface. While there is
    no substitute for a good understanding of the command-line configuration of iptables,
    an uncomplicated firewall configuration using these GUIs allow you to get your
    firewall up and running quickly and without having to read the iptables page.


    # Smoothwall


    Smoothwall (http://smoothwall.org/) is a firewall in its own right, and is the
    site for SmoothWall Express. SmoothWall Express is a free, open source firewall
    solution. Smoothwall.net is the home of SmoothWall Limited, which produces several
    commercial security products including a version of the SmoothWall firewall. Smoothwall
    differs from the other solutions covered here, in that smoothwall is a dedicated
    device. Other solutions using netfilter and optional GUIs to configure the firewall
    can be on a workstation. You can still use the firewall system as a normal workstation,
    but it''s not recommended. If you want to harden the firewall (as you should),
    you need to remove unneeded services and software from the system, and update
    all of the remaining software. Smoothwall takes a different approach in all of
    this is done for you. When you install Smoothwall, it'
