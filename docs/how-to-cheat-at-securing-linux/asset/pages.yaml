- img_proc: true
  md: '# Chapter 2 • Hardening the Operating System


    facilities such as mail, news, auth, and so, and priorities ranging from alert
    to debug. Many programs use the facilities; so many unused messages are written
    to their logs. In many cases, the message and the facility are not even. Syslog-ng
    filters messages based on message content in addition to the facility/priority
    pair. Using this method, only the messages that are needed are logged.


    # Figure 2.25 Syslog-ng Platforms


