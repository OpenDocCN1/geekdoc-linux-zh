  pgno: 309
- img_proc: true
  md: '+   -A appends a rule to a chain. `iptables -A INPUT -p icmp -j ACCEPT` will
    add the rule to permit ICMP at the bottom of the INPUT chain in the FILTER table.


    +   -D deletes a rule from a chain. `iptables -D INPUT -p icmp -j ACCEPT` will
    delete the matching rule from the INPUT chain. `iptables -D INPUT 3` will delete
    the third rule from the top of the INPUT chain.


    +   -I inserts a rule in a chain. `iptables -I INPUT 5 -p icmp -j ACCEPT` will
    insert this rule as the fifth rule in the INPUT chain


    +   -R replaces a rule in a chain. `iptables -R INPUT 4 -p icmp -j ACCEPT` will
    replace the fourth rule in the INPUT chain with this new rule.


    +   -L lists the rules. `iptables -L INPUT` will list all rules and `iptables
    -L INPUT` will list all rules in the INPUT chain only.


    -t -n would list all the rules in the nat table only.


    +   -F will flush (delete) rules. `iptables -F` will delete all rules in all chains.
    It will not delete counters, only the rules inside them.


    +   -Z will zero the packet and byte counters. `iptables -Z` will delete all of
    the counters. `iptables -Z FORWARD` will delete all of the counters in the FORWARD
    chain only.


    +   -N will create a new chain. `iptables -N CUSTOMCHAIN1` will create a new chain
    named CUSTOMCHAIN1.


    +   -X will delete a chain. `iptables -X CUSTOMCHAIN1` will delete the custom
    chain named CUSTOMCHAIN1.


    +   -P will change the policy for a chain. `iptables -P INPUT ACCEPT` will change
    the policy for the INPUT chain to `ACCEPT


    The policy for a chain does not need to be limited to ACCEPT or DENY; it could
    use a custom chain for a target, if desired.


    # Option Summary


    +   -p specifies the protocol to match (works with "!"). `iptables -A FORWARD
    -p tcp` will add a rule to match any TCP packet to the FORWARD chain. `iptables
    -A FORWARD -p tcp` will match any packet that was not TCP.


    +   -s specifies the source address to match (works with "!"). `iptables -A FORWARD
    -s ! 192.168.1.99` will match any packet with a source address of 192.168.1.99.
    `iptables -A FORWARD -s ! 192.168.1.99` will match any packet that did not have
    a source address of 192.168.1.99.'
