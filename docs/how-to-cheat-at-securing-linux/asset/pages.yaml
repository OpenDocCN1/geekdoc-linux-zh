  md: '# Tools & Traps...


    # Don''t Block Yourself


    Anyone who has spent any time configuring firewalls has learned the hard way to
    be very careful when configuring the rules. It is always a good idea to create
    the rules to PERMIT administrative access before any others. This is because soon
    as you configure the default policies to DROP, your SSH connection will no longer
    be permitted unless you have added it to the access list. If you forget to do
    this, you could find that you no longer have remote access to your firewall after
    applying the policy. If that happens, you won not ever be able to remotely update
    the policy and change the ACLs.


    The next step is to tell FWBuilder where to find the SSH executables because this
    is how FWBuilder uploads the configuration to the firewalls. You need to have
    SSH working on both the firewall and the FWBuilder console (assuming they are
    on different systems).


    +   34. Select Edit | Preferences from the menu.


    +   35. Select the SSH tab and click the Browse button.


    +   36. Navigate to the location of your desired SSH utility (e.g., plink.exe)
    and click Open. Note that if you are using Windows for the FWBuilder host, you
    cannot select PuTTY.exe; you must use the command-line PuTTY program, plink.exe.


    +   37. After selecting the SSH executable, click OK.


    +   38. Right-click the LAB01 firewall in the object tree, and select Install.


    +   39. Select the Firewalls you wish to install to, and click Next.


    +   40. Enter the username and password for the SSH connection.


    +   41. All other fields are optional; however, it is recommended that you check
    “Store a copy of the fwb on the firewall.” When satisfied with your choices, click
    Ok.


    After the upload completes, you will get a status of “Success” (see Figure 9.24).
    Checking your firewall (iptables -L) shows you the new rules that are listed.'
