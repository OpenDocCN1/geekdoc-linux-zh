    If you''ve used TCPDump, you will see Snort''s output in a very similar. It looks
    very typical of a packet sniffer in general.


    ```

    {date}-{time} {source-hw-address} -> {dest-hw-address} {type}

    {length} {source-ip-address:port} -> {destination-ip-address:port} {protocol}
    {TTL}

    {TOS} {ID} {IP-length} {datagram-length} {payload-length} {hex-dump} {ASCII-dump}

    ```


    This is all great information you are gathering, and Snort can collect it into
    a file as well as display it to standard output. Snort has built-in packet-logging
    mechanisms that you can use to collect the data for a file, sort it into directories,
    or store the data as a binary file.


    To use the packet-logging features, the command format is simple:


    ```

    # snort -dev -l {logging-directory} -h {home-subnet-slash-notation}

    ```


    If you want to log the data into the directory /var/adm/snort/logs with the home
    subnet 10.1.0.0/24, you would use the following:


    ```

    # snort -dev -l /var/adm/snort/logs -h 10.1.0.0/24

    ```


    However, if you log the data in binary format, you don''t need all the options.
    The binary format is also known as the TCPDump formatted data format. Several
    packet sniffers use the TCPDump data format, including Snort.


    The binary format for Snort makes the packet collection much faster because Snort
    doesn''t have to translate the data into a human-readable format immediately.
    You only need two options: the binary log file option -L and the binary option
    -b.


    For binary packet logging, just run the following:


    ```

    # snort -b -L {log-file}

    ```


    For each log file, Snort appends a timestamp to the specified filename. It''s
    great that you''re able to collect the data now. Now how do you read it? What
    you need to do is parse it back through Snort with filtering options. You also
    have the option to look at the data through TCPDump and Ethereal, as they use
    the same type of format for the data.


    ```

    # snort [-d][e] -r {log-file} {tcp|udp|icmp}

    ```


    The last item is optional if you want to filter the packets based on packet type
    (for example,TCP). To further advantage of Snort''s packet-logging features, you
    can use Snort in conjunction with the Berkeley Packet Filter (BPF). The BPF allows
    packets to be filtered at the kernel level. This can optimize performance of network
    sniffers and log-'
  merge: -1
