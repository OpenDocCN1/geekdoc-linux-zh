- img_proc: true
  md: '# Introducing Intrusion Dection and Smart • Chapter 4


    gers with marked improvements to performance. Because BPF filtering happens at
    a low level in the operating system, packets are eliminated from processing before
    they go extensive processing at higher levels. To use Snort with a BPF filter,
    use the following syntax:


    ```

    # snort -vd -r <file> <bpf_filter>

    ```


    To help you find your feet, here are some examples of BPF filters.They are commonly
    used for ignoring packets and work with expressions (and, or not).

    If you want to ignore all to one IP address:


    ```

    # snort -vd -r <file> not host 10.1.1.254

    ```


    If you want to ignore all traffic from the 10.1.1.0 network to destination port
    80:


    ```

    # snort -vd -r <file> src net 10.1.1.1 and dst port 80

    ```


    If you want to ignore all traffic coming from host 10.1.1.20 on port 22:


    ```

    # snort -vd -r <file> not host 10.1.1.20 and src port 22

    ```


    For further information about BPF filters and their syntax, you can read the page
    manual for tcpdump, which uses the same syntax (www.hmug.org/man/8/tcpdump.html).


    # Using Snort as an NIDS


    Now that you understand the basic options of Snort, you can see where the IDS
    comes into play.To make an Snort IDS, add one to the packet-logging function:
    the configuration file.


    ```

    # snort -dev -1 /var/admin/snort/logs -h 10.1.0.0/24 -c /root/mysnort.conf

    ```


    Your rules are in the configuration file, and they are what trigger the alerts.


    # Snort and Your Network Architecture


    So how do you make Snort as useful as possible?Place your sensors as strategically
    on your network, allowing them to see as much of the crucial network traffic as
    possible for your deployment. Where this depends on several factors: how big your
    network and how much money you can get your management to spend on Snort systems.


    If you cannot get enough money to acquire enough Snort systems to achieve the
    optimal designs shown in Figure 4.6, you''ll need to see what you can do from
    a practical sense. If you need to limit your spending, forego the system inside
    the router and just sure you have the Snort systems inside the subnets you want
    to protect. In general, placing the sensors close to your key assets will make
    it easier to see what those systems are sending and receiving. If you can''t place
    sensors on all your subnets, choose wisely, and protect your most important machines
    with a sensor on their segments.'
