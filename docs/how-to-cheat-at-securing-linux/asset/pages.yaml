  md: '# Hardening the Operating System • Chapter 2 85


    SWATCH is an open source package that allows administrators to efficiently monitor
    system activity. It can monitor events on a system, or a large number of systems,
    by monitoring system logs for specified events. SWATCH''s main function is to
    monitor messages actively as they are written to log files through the Unix syslog
    utility.


    Scanlog is an open source program that detects and logs TCP-port scanning on a
    system. Scanlog can alert an administrator when the network is being mapped, but
    it cannot stop the intrusion.


    Syslog-ng is a logging daemon that is the replacement for the traditional syslog.
    The "ng" is an acronym for "next generation.\The original syslog was the general
    Unix logging daemon that handled request for syslog services, but was difficult
    to configure. Syslog-ng is easier to configure and offers additional logging features,
    as more configurations. For example, syslog-ng allows administrators to filter
    messages based on priority, as well as the content of the messages.


    Security Enhanced Linux (SELinux) is an initiative of NSA along with the computer
    security research community to offer enhanced security in the operating systems.
    SELinux enhances security by utilizing mandatory access controls in Linux. Red
    Hat offers SELinux from Red Hat Enterprise Linux (RHEL) version 4 onwards.


    Novell SUSE is another Linux distribution that offers graphical interface right
    from the installation, configuration and management. SUSE Linux provides graphical
    configuration tools as well as to configure security settings.


    Novell AppArmor protects the system from inherent vulnerabilities of the applications.
    Novell calls it as immunizing the system. You can configure AppArmor profiles
    for open ports, cron jobs and well applications security can be enhanced on Linux
    servers.


    Host Intrusion Prevention System (HIPS) shields the servers from zero-day attacks,
    by signature-based, behavior-protection and ensures core operating system files
    are not changed by external attacks. CIS, Enterasys, McAfee, IBM ISS and other
    security vendors provides HIPS on many operating system platforms.


    Center for Internet Security (CIS) periodically releases benchmarking and scoring
    tools for operating systems, network devices and applications. You may download
    these free-cost tools and run them on your servers to analyze the security. CIS
    benchmark tool is available for Red Hat, SUSE and Slackware Linux.


