- img_proc: true
  md: 'only does this complexity add to the time and labor for configuration and maintenance,
    also increases the chance that an error could be in the configuration. As you
    advisers there will often be additional costs associated with them. In most cases
    this cost will be minor and far less than an additional firewall, but with some
    high-speed interfaces, they can become very costly. Lastly, though many would
