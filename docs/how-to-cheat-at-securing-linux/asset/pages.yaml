    # Snort System Requirements


    Before getting a system together, you need to know a few things. First, Snort
    data can take up a lot of disk space, and second, you''ll need to be able to monitor
    the system remotely.The Snort system we maintain is in our machine room (which
    is cold, and a hike downstairs).


    Because we''re lazy and don''t want to hike downstairs, we would like to be able
    to maintain remotely and securely. For Linux and UNIX systems, this means including
    Secure Shell (SSH) and Apache with Secure Sockets Layer (SSL). For Windows, this
    would mean Terminal Services (with limitation on users and machines can connect
    and Internet Information Servers [IIS]).


    # Hardware


    It''s difficult to give hard-and-fast requirements on what you''ll need to run
    Snort because the hardware requirements are tremendously variable depending on
    the amount of traffic on your network and how much of you''re trying to process
    and store. Busy enterprise networks with thousands of active servers are going
    to have much greater requirements than a poky home network with one client on.
    However, we can provide general guidelines.


    At a bare minimum level, Snort does not have any particular hardware requirements
    that your OS doesn''t already require to run. Running any application with a faster
    processor usually makes the application work faster. However, your network and
    hard drive will limit the amount of data you can collect.


    One of the most important things you''ll need, especially if you''re running Snort
    in NIDS mode, is a really big, reasonably fast hard drive. If you''re storing
    your data as syslog files or in a database, you''ll need a lot of space to store
    all the data that Snort''s detection engine uses to check for rule violations.
    If your hard drive is too small, there is a good chance that you will be unable
    to write alerts to your database or log files. For example, our current setup
    for a high-traffic enterprise Snort sensor is a 100GB partition for /var (for
    those of you not familiar with Linux/UNIX systems, /var is where logs, including
    Snort data, are most likely to be stored). Some high-end deployments even use
    RAID arrays for storage.


    You will need a network interface card (NIC) as fast as the rest of your network
    to collect all the packets on your network. For example, if you are on a 100MB
    network, you will need a 100MB NIC to collect the correct amount of packets. Otherwise,
    you will miss packets and be unable to accurately collect alerts. A highly recommended
