  md: '# How Scanning Works


    The list of potential targets from the footprinting phase can be expansive. To
    streamline the scanning process, it makes sense to first determine if the systems
    are up and responsive. Several methods can be used to test a TCP/IP-connected
    system''s availability, but the most common techniques use Internet Control Message
    Protocol (ICMP) packets.


    Chances are that you have any type of network troubleshooting, you will recognize
    this as the protocol that ping uses. The ICMP echo request packet is a basic one
    that according to Request for Comments (RFC) 1122 has most to implement and respond
    to. In reality, however, many networks, internally and externally, block ICMP
    requests to defend against one of the Dos attack, the ping flood. They may also
    block it to prevent scanning from the outside.


    If ICMP packets are blocked, TCP ACK packets can also be used. This is often referred
    to as a “pinging.” RFC 1122 that unsolicited ACK packets return a TCP RST, sending
    this type of packet to a port that is allowed by a firewall, as port 80, the target
    should respond with an RST indicating that the target is active.


    When you combine either ICMP or TCP ping methods for active targets in a range,
    you perform a “ping sweep.” Such a sweep should be deployed and captured to a
    log file that specifies active machines that can later input into a scanner. Most
    scanner tools will accept a carriage return delimited file of IP addresses.


    # Port Scanning


    Although there are many different port scanners, they all operate in much the
    same way. There are a few basic types of TCP port scans, the most common of which
    is a SYN scan (“SYN stealth scan”), named for the TCP SYN flag, which appears
    in the TCP connection sequence or “handshake.” This type of scan begins by sending
    a SYN packet to a destination. The target receives the SYN packet, responding
    with a SYN/ACK response if the port is open, or an RST if the port is closed.
    This is typical behavior of most scans; a packet is sent, the return is analyzed,
    and a determination is made about the state of the system or port. SYN scans are
    relatively fast, and relatively stealthy, since a full handshake does not occur.
    Since the TCP handshake did not complete, the service on the target does not see
    a connection, and does not get a chance to.


    Other types of port scans that may be used for specific situations, which we will
    discuss later in the chapter, would be port scans with various TCP flags set,
    such as FIN, PUSH, and URG. Different systems respond differently to these ports,
    so there is an element of OS detection when using these flags, but the primary
    purpose is to bypass access controls that specifically key on connections initiated
    with specific TCP flags. Table 3.1 is a summary of the different nmap options,
    with the scan types initiated and expected response.'
