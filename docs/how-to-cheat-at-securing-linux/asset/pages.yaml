- img_proc: true
  md: '# Chapter 10 • Linux Bastion Hosts


    # # Updating the Kernel


    There are two basic options for updating the kernel. You can download a newer
    kernel in its entirety and apply it, or you can download a kernel patch and apply
    it. You can obtain the complete kernel or kernel patches from www.kernel.org.
    You should also check the Web site for your specific distribution to see if there
    are restrictions on which kernel will work with that distribution. In most cases
    you will have the choice of downloading a patch or patches by downloading the
    entire updated kernel. Patching the kernel generally requires a higher level of
    skill and a investment of time than installing a new kernel.


    > Kernel version numbers follow a specific pattern. There are several numbers
    separated by decimals, such as 2.6.17.4. In this example, the 2 represents the
    major version number, and the 6 represents the minor revision number. The third
    number represents the patch version, and the fourth is a minor revision of that
    patch. Essentially, the farther from the leftmost version you get, the less significant
    change. The high-level version numbers are pretty intuitive, but there is still
    more information hidden in a kernel. If the minor revision number (the second
    number from the left) is even, it is considered a stable release; if it is odd,
    it is a developmental release. If the version number contains a dash, such as
    2.6.17-3.4, it is a kernel that has been modified and produced by a specific distribution.
    The numbers to the right of the dash will follow a scheme specific to that distribution.


    By entering the following command, you can determine the kernel you are currently
    running:


    ```

    # uname -r

    2.6.15-1.2054_FC5

    ```


    The most current kernel stable on www.kernel.org is 2.16.17.4; however, on the
    Fedora site, we found the latest Fedora Core distribution release 2.6.17-1.2145.
    Instructions on updating Fedora Core and a link to Fedora Core updates can be
    found at http://fedora.redhat.com/Download/updates.html. You can use Yum or RPM
    to update your kernel the same way any other software package. One consideration
    is that using RPM will leave each kernel image sitting on the hard drive; over
    time this could account for a considerable amount of hard disk space. Yum, by
    default, leave only the previous kernel in addition to the newest one and will
    delete all others.'
