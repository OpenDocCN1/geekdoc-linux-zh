    a more reliable media, and then write the image to a floppy disk at a later date
    using a utility such as rawwrite. Once you have made a backup, you can safely
    apply the firewall updates.


    Firewall updates are another area where the SmoothWall people have made things
    painless. Click on the maintenance tab and you will see two sections on the updates
    screen. The top section shows installed updates and the bottom one shows available
