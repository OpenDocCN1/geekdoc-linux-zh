    # Additional Steps


    At this point, the base system is in place.You have the desired software installed
    and should have the undesirable software removed. The next steps will allow you
    to drill down into some of the more granular aspects of bastion hardening. Now
    let''s look at steps to synchronize time on the bastion host, keep the system
