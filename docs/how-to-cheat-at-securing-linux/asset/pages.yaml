    # # Plug-Ins


    Plug-ins are software modules that enable you to have custom functions that can
    run on the packets that are captured and decoded. To learn how to apply plug-ins,
    you first need to understand the overall data flow within Snort. When a packet
    is captured by Snort, it gets decoded and passed on to higher modules. When Snort
    is run in Inline mode (for Linux), the capture engine is iptables.


    The packets are next to the preprocessor module, the detection engine, and the
    output module. Each of these three modules can be supplemented with your own module
    plug-ins.


    > > NOTE

    Before Snort Version 2.6, you had to compile your plug-in directly into your Snort
    executable. With previous versions of Snort, in order to add a plug-in to your
    system, you had to rebuild the Snort binary, stop the old instance, install the
    new binary, and then start it. Beginning with Version 2.6, however, you can have
    dynamic plug-ins (if Snort was compiled with the --enable-dynamic-plug in option).
    With a dynamic plug-in, you build your plug-in, install it to the proper location
    on the file system, modify the configuration file (or the command line that you
    use), and then restart Snort. The API for the original static plug-ins and the
    dynamic plug-ins are slightly different. We focus here on the dynamic plug-ins.


    # # Preprocessor Plug-Ins


    Preprocessor plug-ins are analysis modules that run after the packet has been
    captured and decoded. These plug-ins are run on every packet that is received;
    the snort rules do not have any influence on them. These preprocessors can be
    used for various purposes, but they are'
