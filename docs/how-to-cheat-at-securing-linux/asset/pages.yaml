  md: '# Advannced Snort Deployment • Chapter 6


    The keyword logto enables you to send the packets that trigger the rule that contains
    this keyword to be logged to its own file. This keyword is ignored when Snort
    is in binary logging mode.


    The keyword session will follow a TCP session that is triggered by the rule and
    will allow logging of the entire connection. The keyword tag is similar to session,
    but once it is triggered, it follows all traffic from or to the source or destination,
    not just the current session, for a specified amount of time or number of packets.
    Both session and tag put a heavy burden on Snort and should be used for the post-processing
    analysis of Snort binary or tcpdump pcap files, not for real-time use. We will
    discuss using these keywords in this chapter when we handle some specific security
    scenarios.


    Starting with Version 2.6, you can also add/modify rules while Snort is running.
    These dynamic rules are written with a new C-like syntax. This new syntax is rather
    intimidating and is quite verbose compared with the old syntax for simple rules.
    However, for complicated rules, the new syntax is easier to work with.


