- img_proc: true
  md: '# Chapter 9 • Perimeter Security, DMZs, Remote Access, and VPNs


    +   **Allow/Deny Connections To Host** This policy group is used to globally permit
    or deny outbound access to a given host, IP address, or network range. This policy
    uses the destination to match the rule.You can use this policy group in permissive
    mode to list Web sites you do not want to have access to.


    +   **Allow/Deny Connection from LAN Host** This policy group is used to permit
    or deny all access from a particular host, IP address, or network range. This
    policy uses the source to match the rule.


    +   **Allow/Deny Service** This policy group permits or denies traffic based on
    its destination port and source. When you are using permissive mode, this policy
    group can be used to block all access to the bittorrent ports. The traffic can
    be any; the firewall itself, LAN clients, or an arbitrary IP, hostname, or network
    range.


    Configuring the policies will satisfy the bulk of what you need to accomplish,
    there are some additional configuration options available by navigating to **Edit
    | Preferences**. Selecting **Interface | Events** allows you to configure some
    useful options. The “Skip redundant entries” checkbox only makes one entry for
    sequential event entries. This helps prevent the event windows from being flooded
    by redundant alerts. You also have the option of entering hosts or ports as being
    exempt from triggering the event log. After making your selections, click **Accept**.


    Another preferences setting node is under **Firewall | Network Settings**. This
    allows you to enable Internet connection sharing (the same as the initial wizard),
    and enable the firewall host as a Dynamic Host Configuration Protocol (DHCP) server.
    This allows you to configure the Linux host similarly to a firewall host, which
    generally acts as a DHCP server in addition to permit NAT and act as a firewall.The
    ICMP filtering window allows you to filter ICMP packets. By the default, permit
    and deny rules configured by Firestarter to TCP and UDP, but not ICMP.This screen
    allows you to permit the desired types of ICMP traffic. Generally speaking, it
    is better not to allow any ICMP from the Internet to your firewall or internal
    network unless absolutely necessary.


    One final setting you want to configure is under **Firewall | Advanced Options**.
    In the broadcast traffic section, check both options under **Broadcast traffic**.
    In general, you should not permit broadcast traffic to go through your firewall,
    as doing so poses a security risk. You also want to check the option to “Block
    traffic from reserved addresses on public interfaces,” which is a common filtering
    tactic. Because the “private” addresses outlined in RFC1918 should not be routed
    through the Internet, there is never a reason to receive traffic sourced from
    any of those over your outside interface. If you do, it is almost always a hacker
    attempting to bypass a poorly configured firewall.'
