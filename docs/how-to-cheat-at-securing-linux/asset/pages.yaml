  md: '# Chapter 2 • Hardening the Operating System


    system halts and reboots occur, when a user upgrades to the su command, when the
    file system is full, and when someone is sniffing the system. It can monitor anything
    desired from the log files.


    To learn about SWATCH and download the program, you need to visit the SWATCH home
    page at http://swatch.sourceforge.net/ . The SWATCH home page is shown in Figure
