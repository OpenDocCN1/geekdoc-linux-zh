    to select a role and click Submit. None of the settings here will take effect
    until you edit the base_conf.php file and change the value of $_Auth_System=1;
    A value of 0 (the default) means the authentication is disabled and everyone has
    full access to BASE. Only the admin has access to the administration screen.


    > Remember the different logging options for Snort on the command line. Previously
    we used –console, which would log Snort events to the Snort terminal. If you are
    going to use a different front for viewing Snort alerts, there isn''t much value
    in also logging to the console. You can use –A none when starting Snort, which
    will cause Snort not to log anything to the Snort terminal, resulting in improved
