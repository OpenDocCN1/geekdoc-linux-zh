  md: '# Hardening the Operating System • Chapter 2


    The Update Service Packages include all of the errata in one package to keep your
    system to date. After you pay for the service, you can download them directly
    from the Red Hat Web site. To find out more about the Update Service Packages,
    visit the secure site www.redhat.com/apps/support/


    You may also launch the **Software Updater** from Applications | **System Tools**
    | **Software Updater** from the taskbar (Red Hat Enterprise Linux 5). You have
    to register yourself with RHN (Red Hat Network) and set the hardware and software
    profile for Red Hat to recommend appropriate updates for your system. Figure 2.1
    shows the registration process through Software Updater.


    # **Figure 2.1** Software Updater


    ![](img/b38c01d2fda8509e8449e32f876ae148_33_0.png)


    # Handling Maintenance Issues


    You should apply the latest service pack and updates after the server goes live,
    and constantly maintain the server after it is deployed to make sure the most
    current required patches are installed. The more time an operating system is available
    to the public, the more time malicious hackers have to exploit discovered vulnerabilities.
    Vendors offer patches to fix these vulnerabilities as quickly as possible; in
    some cases, the fixes are available at the vendor''s site the same day.'
