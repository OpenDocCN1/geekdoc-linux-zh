    this behavior. You can use the -n option, in which case the rules will be added
    to the existing ruleset, and only overwrite if there is a duplicate rule. You
    can use the iptables-restore < /etc/ruleset command to pipe the saved configuration
    to iptables-restore.


    # Command Summary


    The following is a brief summary of the most useful iptables commands for easy
    reference, along with some examples to make the command usage more clear. Bear
    in mind this is not an exhaustive list of commands; only represents the most important
    commands for configuring your firewall. For a complete list, refer to it to iptables
    pages.'
