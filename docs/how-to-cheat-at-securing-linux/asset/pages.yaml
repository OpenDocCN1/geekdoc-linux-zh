- img_proc: true
  md: 'The five parts of a network analyzer are: hardware, capture driver, buffer,
    real-time analysis, and decode.


    # Who Uses Network Analysis?


    +   Administrators use network analysis for troubleshooting network problems,
    analyzing the performance of a network, and intrusion detection.


    +   When intruders use sniffers, it is considered a passive attack.


    +   Intruders use sniffers to capture user names and passwords, collect confidential
    data, and map the network.


    +   Sniffers are a common component of a rootkit.


    +   Intruders use sniffers to control backdoor programs.


    # How Does it Work?


    +   Ethernet is a shared medium that uses MAC or hardware addresses.


    +   The OSI model has seven layers and represents a standard for network communication.


    +   Hubs send out information to all hosts on the segment, creating a shared collision
    domain.


    +   Switches have one collision domain per port and keep an address table of the
    MAC addresses that are associated with each port.


    +   Port mirroring is a feature that allows you to sniff on switches.


    +   Switches make sniffing more difficult; however, the security measures in switch
    architectures can be overcome by a number of methods, thus allowing the sniffing
    of traffic designated for other computers.


    +   Sniffing wired traffic can be done with many kinds of NICs; wireless sniffing
    requires greater attention to hardware details such as chipset and drivers.


    # Detecting Sniffers


    +   Sometimes sniffers can be detected on local systems by looking for the PROMISC
    flag.


    +   There are several tools available that attempt to detect promiscuous mode
    using various methods.'
