    # Going Behind the Scenes with Enumeration


    Enumeration is based on the ability to gather information from an open port, by
    either straightforward banner grabbing when connecting to an open port, or by
    inference from the construction of a returned packet. There is not much true here,
    as services are supposed to respond in a predictable manner; otherwise, they would
    not have use as a service All of this starts from secured hosts and ports.


    # Service Identification


    Now that the open ports are captured, you need to be able to verify what is running
    on said ports. You normally think that SMTP is running on TCP 25, but what if
    the administrator of system is trying to obfuscate the service, and is running
    tunnel? The easiest way to check the status of a port is a banner grab. Upon connecting
    to a service, the target''s response is captured and compared to a list of known
    services, such as the response'
