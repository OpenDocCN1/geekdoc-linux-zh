    # ### amap: Application Version Detection


    Sometimes, you may encounter a service that may not be easily recognizable by
    port number or immediate response. amap will send returned banners and probes
    to a specific service, and then analyze the results, including returned banners,
    to identify what application or service is actually running on a specific port.
    There are options that allow you to minimize parallel attempts, or really stress
    the system with a large number of attempts, which may provide different information.
    You can also query a service once, and report back on the first matching banner
    reported, using the -1 option. In Figure 3.16, amap is used to discover OpenSSH
    server and a DNS server. The options used for these scans are invoke mapping (-A),
    print any ASCII banner returned (-b), do not mark closed and unresponsive ports
    identified or reported (-q), and use UDP ports (-u).'
