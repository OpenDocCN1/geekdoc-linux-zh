    IP we want to use as the new source address. SNAT assumes we have a static IP
    address to SNAT the outgoing packets. While this is likely the case in a corporate
    environment, a more appropriate solution to closely mimic the configuration of
    a home router would be to use the MASQUERADE command:


    ```

    iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE

    ```


    The masquerade command does not require an IP specification, and will use the
    IP address of the firewall interface. You might be wondering why you wouldn''t
    use the masquerade target all the time instead of the SNAT target. Because the
    source IP is static, the SNAT will cause the NAT calculations to be performed
    once for a given session. Subsequent packets belonging to that session are handled
    the same way as the first. With the masquerade target, each packet is checked
    for the source IP to use, which requires more overhead than with SNAT. This is
    why SNAT is preferable if you have a static IP address, and masquerade is your
    only option if you do not have a static IP address to use.


