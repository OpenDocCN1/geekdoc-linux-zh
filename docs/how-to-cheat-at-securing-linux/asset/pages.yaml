    # IKE-scan: VPN Assessment


    One of the more common VPN implementations uses use of IPsec tunnels. Different
    manufacturers have slightly different usages of IPsec, which can be discovered
    and fingerprinted using IKE-scan. IKE stands for Internet Key Exchange, and is
    used to provide a secure base for establishing an IPsec-secured connection. IKE
    can run in two different modes, Main (-M) and Aggressive (-A), which can identify
    different VPN implementations. Both operate under the principle that VPN servers
    will attempt to communicate to a client that only sends the initial portion of
    IPsec handshake. An initial IKE packet is sent (Aggressive mode, a UserID is also
    specified), and based on the time elapsed and types of responses, the VPN responds
    based on service fingerprints. In addition to the VPN fingerprinting functionality,
    IKE-scan includes psk-crack,


    *'
