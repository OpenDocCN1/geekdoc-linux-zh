  md: '# Chapter 1 • Presenting the Business Case for Open Software


    > WARNING

    You should always be careful when cutting consulting budgets. I have seen attempts
    to save money end up costing more. In almost all cases, getting a consultant in
    quickly is the best course of action and the most cost effective in the long run.
    If you find a skilled consultant you like, a monthly retainer might be be a good
    investment.


    # Hidden Costs


    What are all the costs of a free solution? For starters, power consumption. had
    a Windows 98 system that was only being used as a print server. It occurred to
    me that the PC cost me approximately $7 per month in electricity. With dedicated
    print server costing only about $30.00 and using virtually no electricity, I would
    save money within five months by buying the print server. The Pentium II running
    Windows 98 was technically “free,” but paying for it to keep running was not the
    most cost effective. Some security tools are not offered as a commercial appliance
    and some (e.g., small, low cost firewalls that use less than a standard desktop
    PC are available from several manufacturers). Your cost for electricity will vary.
    Based on your electric bill, you can calculate with a high degree of accuracy
    what a device costs.


    Another consideration is heating, ventilation, and air conditioning (HVAC) costs.
    HVAC is basically the climate controls. Additional computers create additional
    heat, which costs more money for air conditioning. The same conditions apply as
    for power consumption. If a stand-alone appliance is not an option, the additional
    HVAC requirements are an unavoidable cost; however, in those cases where a more
    efficient application exists, almost always produce less than a normal workstation.
    This also applies to the difference between an older computer and a newer computer.
    Newer systems that demand more power and cooling when they are being heavily utilized,
    often incorporate energy-saving characteristics that


    There is also the cost of real estate. A decommissioned full-sized tower PC takes
    a lot more space than a new commercial appliance the size of a cigar box. You
    may have plenty of room now, but as the server room gets more and crowded, space
    could become an issue. A keyboard, video, and mouse (KVM) switch might save more
    in space than it costs to buy. As the servers become increasingly tightly packed,
    good air flow and adequate cooling will be inhibited, and physical access to the
    systems for operation or maintenance will also be difficult.


    Inefficiency is another cost of free solutions with the fact that the support
    staff are likely unfamiliar with the new free solutions. When a staff member performs
    a task on an'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Presenting the Business Case for Open Source Software • Chapter 1


    new firewall, it takes longer to do than if they are familiar with the firewall.
    This inefficiency costs the time to complete a task; however, if an outage or
    business disruption occurs, this delay could result in profit or business. These
    delays must also be accounted for when planning projects and other activities.


    Free solutions are usually produced by small organizations or by an individual.
    These solutions may do an excellent job in their assigned roles, but may not be
    well known. This could be a liability if the individual who configured your free
    solution leaves or is otherwise unavailable. If you have a PIX firewall that needs
    work, you probably would not have a hard time locating a resource. On the other
    hand, if you need someone to take over the administration of an obscure free solution,
    finding someone could be difficult. This difficulty could manifest itself as a
    hidden cost by increasing the delay before a problem can be addressed, having
    to pay a premium for a consultant, or any number of other inefficiencies.


    # The Savings of Using Free Security Solutions


    The following section discusses how a free security solution can save you money.
    The primary savings are obvious: you didn''t pay for the product; however, there
    are additional benefits. This section offers a detailed look into the benefits
    of using free software. By evaluating the expected savings and costs, you can
    form a more practical, accurate picture of what will be gained by implementing
    a free security solution.


    # Purchase Costs


    The purchase cost is one of the largest cost savings of free software. The best
    example of this is with firewalls. A small Linksys or Netgear firewall costs around
    $20.00 to $50.00.They use almost no power, support port forwarding, perform Network
    Address Translation (NAT), act as a Dynamic Host Configuration Protocol (DHCP)
    server, and are stateful packet filters. Suppose you use Linux and netfilter to
    run a firewall for free. Odds will cost more to pay for the employee''s time to
    set up the Linux firewall than the Linksys would cost to buy. Firewalls are one
    of the examples of how readily available affordable commercial solutions can be.


    You can save money on purchases. Some types of products, particularly IDSes, work
    analysis and reporting tools, and commercial Virtual Private Network (VPN) solutions
    can cost staggering amounts of money. When comparing prices, come as close as
    possible to comparing products. Using the most expensive "deluxe" software suite
    available as the price for decision making is misleading. The free solution will
    not have the same features and capabilities as the commercial version. Look at
    the features you think you need as a starting point for which commercial products
    would be viable. Use the costs of those products as your basis for determining
    what the free solution will save you.'
  merge: -1
