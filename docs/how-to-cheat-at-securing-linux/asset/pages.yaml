    # p0f: Passive OS Fingerprinting


    p0f is the only passive fingerprinting tool included in the Auditor distribution.
    If you want to be stealthy in your scan and enumeration processes, and don''t
    get high-level results for OS fingerprinting, p0f is the tool for you. It works
    by analyzing the responses from your target on innocuous queries, such as Web
    traffic, ping replies, and normal operations. p0f gives the best estimation on
    an operating system based on those responses, so it is not as precise as other
    active tools, but can still give you a good starting point. In Figure 3.12, p0f
    is used to check the version of the Fedora Linux server, and a Linksys Wireless
    router, both of which are returned as Linux. In this example, p0f is run in the
    background with an open Web browser to a Linksys access point''s Web administration
    page, as well as a TorrentFlux (PHP-based BitTorrent client) login page. Both
    were detected as Linux, only correct in one case, as the Linksys AP is not a model
    based on Linux.'
