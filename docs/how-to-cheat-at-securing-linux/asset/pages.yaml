    headers in an SSH session are not encrypted, so an intruder can still view the
    source and destination addresses.


    +   - Secure Sockets Layer (SSL)/Transport Layer Security (TLS) SSL was originally
    developed by Netscape to communicate security and privacy to Internet sessions.
    It has been replaced by TLS, as stated in RFC 2246. TLS provides security at the
    transport level and overcomes some security issues of SSL. It is used to encapsulate
    the network traffic of higher-level applications such as HTTP, Lightweight Directory
    Access Protocol (LDAP), FTP, SMTP, POP3, and IMAP. It provides authentication
    and integrity via digital certificates and digital signatures and the source and
    destination IP headers in a SSL session are not encrypted.


    +   - IP Security (IPSec) IPSec is a network-protocol that incorporates security
    into the IPv4 and IPv6 protocols at the packet level, extending the IP packet
    header. This allows the ability to encrypt any higher-layer protocol. It has been
    incorporated into routing devices, gateways, and clients for securing trusted
    networks to one another. IPSec provides several means for authentication and encryption,
    supporting a lot of public key authentication certificates and symmetric encryption
    cipher keys. It can operate in tunnel mode to provide a new IP header that masks
    the source and destination addresses in addition to the data being transmitted.
    Since IPSec uses protocols other than TCP and UDP, getting the IPSec traffic through
    a firewall or NAT device can be challenging.


    +   - OpenVPN OpenVPN is a tunneling SSL VPN protocol, which can encrypt the contents
    of a packet and its headers. OpenVPN uses a single TCP or UDP port; therefore,
