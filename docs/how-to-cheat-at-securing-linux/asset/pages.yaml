  md: 'Chapter 4 • Introducing Intrusion Detection and Snort


    # Figure 4.5 Snort’s Alerting Component.


    ![](img/b38c01d2fda8509e8449e32f876ae148_150_0.png)


    # Using Snort on Your Network


    Your IDS can use just one Snort system, or more than one if you need redundancy
    or of multiple network segments. For example, it is possible to divide the task
    of network monitoring across multiple hosts. The chief benefit of dividing tasks
    within a segment is redundancy—if one element of the system goes down, the network
    can be monitored and protected. However, for monitoring extremely large and busy
    networks, we advise you to place at least one sensor in every distinct segment
    so that you can capture all the local traffic, not just the traffic that’s to
    the segments where your main sensors are.


    The previously outlined network structure can be used for passive monitoring or
    active monitoring. Passive monitoring is simply the ability to listen to network
    traffic and log it. Active monitoring involves the ability to either:'
  merge: -1
  pgno: 150
- img_proc: true
  md: '# Introducing Intrusion Dectection and Smart • Chapter 4


    +   - Monitor traffic and then send alerts concerning the traffic that is discovered

    - Actually intercept and block this traffic


    Snort is primarily used for active monitoring and alerting, though it will generally
    not intercept and block unless you are using Snort inline and configure it accordingly.

    Don''t intrusion detection applications also do signature-based and anomaly-based
    detection? That means you define what an attack looks like and configure your
    network monitoring software to look for that signature. Anomaly-based detection
    requires the IDS to listen to the network and gather evidence about “normal” traffic.
    Then, if any attack occurs that seems different, the IDS will respond by, for
    example, sending out an alert to the network administrator. Snort’s rule-based
    matching is an example of signature detection, and some of the alerts generated
    by the preprocessors are examples of anomaly-based detection.

    After dealing with postmortem on a compromised system, you''ll be amazed at how
    helpful Snort NIDS can be. On the flip side, it''s also frustrating when your
    system does not log a possible attack. Let''s take a possible attack: the IMAP
    login overflow attack. In this case, an attacker tries a buffer overflow to cause
    a remote exploit.

    Snort can let you know that someone is sending an IMAP packet that contains the
    nature of an IMAP login overflow. Depending on how you have set up, you can either
    monitor the output or be notified by e-Mail. Now you can yank the Ethernet cable
    from the wall and look at corpse and find some tools used to break the system
    and what they plan on doing on your machine.

    The rule for this attack is:


    ```

    alert tcp $EXTERNAL_NET any -> $HOME_NET 143 (msg:"IMAP login buffer \

    overflow attempt"; flow:established,to_server; content:"LOGIN"; \

    content:";distance; nocase; \

    byte_test:5->256,0,string,dec,relative; reference:bugtag,6298; \

    clas:misc-attack; sid:1993; rev:1);

    ```


    This rule checks for packet originating from the external network (defined by
    EXTERNAL_NET) to any system on the internal network (defined by HOME_NET) to port
    143, which is the IMAP port. The msg variable defines what is sent to the Snort
    alert, there are definitions on the type of attack (misc-attack), the SID number
    (1993), and the Bugraq reference on the attack 6298 (which you can find at www.securityfocus.com/bid/6298).

    Then, there’s the flip side: what happens when Snort does not detect an attack
    on your system? Take another UNIX system you have running One is running Apache
    with FrontPage extensions (g!). Someone finds a new overflow on FrontPage, writes
    a zero-day attack, and then he or she your box. No IDS is perfect, and Snort will
    not catch attacks'
