  md: '# Introduction


    You can make effective use of Snort by simply building and installing the stock
    source code and using the generic ruleset. However, if you are willing to write
    custom rules or write specialized plugs-for augmenting preprocessing, detection,
    or postprocessing, then a new universe of possible uses presents itself. We will
    look at some of these possibilities by looking at various security requirements
    and how they might be implemented.


    First let us look at just what enhancing elements are and what kind of things
    they can do for us.


    # Monitoring the Network


    There is always an issue on how to actually get monitored packets physically into
    Snort. With a network hub, it''s just a matter of hooking it up to the Ethernet
    interface that you intend to use as Snort''s monitor port. These days, hubs are
