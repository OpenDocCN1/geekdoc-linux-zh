    regardless of their priority, to /var/log/maillog. Pretty straightforward. Examples
    of valid priorities are debug, info, notice, crit, alert, and emerg, which indicate
    the overall severity of the event. An asterisk (*) stands for all facilities or
    priorities, depending on where it is used. Unless a facility isn''t used or available
    on your bastion host, you should point the logs somewhere for all of them. The
    action will typically point to a real file, but some other'
