- img_proc: true
  md: 'Each round consists of a substitution phase, wherein the data is substituted
    with pieces of the key, and a permutation phase, wherein the substituted data
    is scrambled (re-ordered). Substitution operations, sometimes referred to as confusion
    operations, occur within S-boxes. Similarly, permutation operations, sometimes
    called diffusion operations, are said to occur in P-boxes. Both of these operations
    occur in the "F Module" of the data. The security of DES lies in the fact that
    the substitution operations are non-linear, the resulting ciphertext does not
    resemble the original message. The permutation operations add another layer of
    security by scrambling the already partially encrypted message.


    Triple DES (3DES) and DESX are methods intended to use the DES cipher in a way
    that increases its security. Triple DES uses three 56-bit keys as a 168-bit key,
    though sometimes keys 1 and 3 are identical, yielding 112-bit security. DESX adds
    an additional 64 bits of key. Both 3DES and DESX are intended to strengthen DES
    against brute-force attacks. It would take many years to decrypt 3DES encrypted
    data (depending on available computing power). However, 3DES is inefficient because
    it requires two to three times the processing overhead as a single DES.


    # Advanced Encryption Standard (Rijndael)


    Because of its size of 56 bits, DES cannot withstand brute-force attacks using
    modern cryptanalysis; dedicated machines can break DES within a day. Consequently,
    The National Institute of Standards and Technology (NIST) selected the Advanced
    Encryption Standard (AES) as the authorized Federal Information Processing Standard
    (FIPS) 197 for all non-secret communications by the U.S. government, which became
    effective in May 2002. AES has the following important characteristics:


    +   - Private key symmetric cipher (similar to 3DES)

    - Stronger and faster than 3DES

    - Life expectancy of at least 20 to 30 years

    - Supports keys of 128 bits, 192 bits, and 256 bits

    - freely available to all; royalty free, non-proprietary, and not patented

    - Small footprint. AES can be used effectively in memory and in central processing
    (CPU) limited environments like Smart Cards


    As a background note, the Rijndael algorithm (pronounced "rain doll") was selected
    by NIST from a group that included four other finalists: MARS, RC6, Serpent, and
    Twofish. It was developed by Belgian cryptographers Jo Daemen and Dr Vincent Rijmen.
    NIST remains resistant to side-channel attacks as power- and timing-based attacks,
    which are attacks against a hardware implementation, not against a particular
    algorithm. For example, power- and timing-based attacks measure the time it takes
    to encrypt a message or the minute changes in power consumption during the encryption
    and decryption processes.'
