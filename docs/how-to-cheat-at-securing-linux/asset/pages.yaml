    # Asymmetric Encryption Algorithms


    The biggest disadvantage to using symmetric encryption algorithms relates to key
    management. In order to ensure confidentiality of communication between two parties,
    each communicating pair needs to have a unique secret key. As the number of communicating
    pairs increases, there is a need to manage a number of keys related to the square
    of the communicators, which quickly becomes a problem.


    Asymmetric algorithms were developed to overcome this limitation. Also known as
    public-key cryptography, these use two different keys to encrypt and decrypt information.
    If cleartext is encrypted with an entity''s public key, it can be decrypted with
    its private key, and if it is encrypted with the private key, it can only be decrypted
    by the public key. The basic principle is that the public key can be freely distributed,
    while the private key must be held in strict confidence. The owner of the private
    key can encrypt cleartext to create ciphertext that can only be decoded with its
    public key (assuring the identity of the source), or it can use the private key
    to decrypt ciphertext encoded with its public key (assuring the confidentiality
    of the data). Although these keys are generated together and are mathematically
    related, the private key cannot be derived from the public key.


    # NOTE


    Literally thousands of different cryptographic algorithms have been developed
    over the years. Cryptographic algorithms can be classified as follows:


    +   - **Encryption Algorithms** Used to encrypt data and provide confidentiality

    - **Signature Algorithms** Used to digitally “sign” data to provide authentication

