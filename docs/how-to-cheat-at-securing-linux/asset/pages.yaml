    # Demonstrating Effectiveness


    One of the age-old debates when it comes to network data collection is placement
    of the sensors. This applies to IDS sensors and reporting sensors as PRTG Grapher.
    The most common difference of opinion is whether you should place the sensor outside
    your perimeter firewall or inside it.This is relevant because the data you will
    see be drastically different between the two. With the sensor placed outside your
    perimeter firewall, you will see all traffic directed at you from the Internet,
    including all the traffic your firewall is blocking. If the sensor is placed inside
    the perimeter firewall, you will see only the traffic that has managed to pass
    through your firewall.


    Undeniably, the traffic of most security relevance is the traffic that has managed
    to traverse your firewall and get into your internal network.These are the potential
    attacks, probes, and whatnot needs to be inspected and monitored closely to make
    sure the network is not compromised.If everything is configured properly, an IDS
    inside the perimeter would see very little traffic, except perhaps triggers related
    to IT policy, such as file sharing or instant messaging protocols. So if all the
    data security officer would find “interesting” is on the inside, you might wonder
    what value a sensor on the outside would bring.


    The best value for placing a sensor outside is really one of public relations.
    The unfortunate fact is that when it comes to network security, everything is
    done properly, no one one'
