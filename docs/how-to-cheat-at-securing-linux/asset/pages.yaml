    # Sniffing Wireless


    From the airport, to the coffee shop, to the library, to your next neighbor, wireless
    networks are all around us; therefore, wireless security is a serious concern.
    There are historical weaknesses in security protocols, because intruders no longer
    need to be inside a building to attack an internal network. A wireless network
    is still a network, however, with a few exceptions maps well to the Ethernet and
    OSI models.


    # Hardware Requirements


    While most Ethernet cards are capable of packet sniffing in promiscuous mode,
    many wireless chipsets cannot use monitor mode, which is the wireless equivalent
    of promiscuous mode. Complicating the situation is that wireless card chipset
    manufacturers do not generally list the chipset they use in a readily available
    form. Also, chipsets can vary within model families. It is best to select the
    software you want to use, and then identify which chipsets and specific manufacturer’s
    model numbers work best with the specific drivers necessary for the software to
    function.'
