    # Linux Firewall Operation


    Before diving into the specific commands used to configure the Linux firewall,
    we will cover some basic Linux firewall vocabulary and how the firewall operates.
    netfilter contains the firewall logic, and iptables is the program that uses to
    modify the rules that the firewall uses. (See the netfilter home page at www.netfilter.org/)
    These rules (or ACLs) define the rules used to permit or deny packets and how
    to react to denied packets. The current iptables tables and chains. Tables are
    the blocks of processing where various actions are performed on the packets. Different
    tables process different chains. Chains are a set of rules (or ACLs). There are
    four built-in tables: nat, mangle, filter, and raw, each of which processes different
    chains (see Figure 9.4).


    # Figure 9.4 netfilter Tables and Chains


    ![](img/b38c01d2fda8509e8449e32f876ae148_296_0.png)


    The following tables and chains are not listed in any particular order, as a given
    packet may be impacted by multiple tables and chains as it is processed. The primary
    built-in chains are INPUT, OUTPUT, and FORWARD. In addition to these, you can
    create your own'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9


    user-defined chains. Capitalizing the names of the chains is a common convention,
    but is not required.


    A brief summary of the roles the tables and chains is included for reference.


    +   - Nat Table This table is referenced with a packet that is used to create
    a new connection.

    - PREROUTING This chain is processed as soon as a packet is received and before
    any routing decisions are made.

    - POSTROUTING This chain is processed before a packet is sent to an interface
    after any routing decisions have been made.

    - OUTPUT This chain is processed for packets generated locally.

    - Filter Table This is the default table used by the iptables command to modify
    the rules and do not specify an alternate table. This is where the bulk of a firewall''s
    processing is consumed.

    - INPUT This chain is processed for packets destined for the local system.

    - FORWARD This chain is processed for packets passing through the local system.

    - OUTPUT This chain is processed for packets generated by the local system.

    - Mangle Table This table is used for any specialized packet alterations that
    are needed. Examples are performing Network Address Translation (NAT) or varying
    bits within the packet.

    - PREROUTING This chain is processed on incoming packets before a routing decision
    is made.

    - POSTROUTING This chain is processed last before a packet is sent to an interface.

    - OUTPUT This chain is processed before a routing decision is made for packets
    generated locally.

    - INPUT This chain is processed for packets destined for the local system.

    - FORWARD This chain is processed for packets passing through the local system.

    - Raw Table This table is primarily used for packets that are exempt from connection
    tracking, and if required, are called before any other netfilter table.

    - PREROUTING This chain is processed as soon as a packet is received.

    - OUTPUT This chain is processed for packets generated locally.'
