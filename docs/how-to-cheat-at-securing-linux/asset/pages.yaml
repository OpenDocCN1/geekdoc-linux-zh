  md: '# Chapter 9 • Perimeter Security, DMZs, Remote Access, and VPNs


    in an Internet café. SSL VPNs also provide support for authentication methods
    and proto-cols, of which one include:


    +   * Active Directory (AD)

    * Lightweight Directory Access Protocol (LDAP)

    * Windows NT LAN Manager (NTLM)

    * Remote Authentication Dial-In User Service (RADIUS)

    * RSA Security’s RSA ACE/Server and RSA SecurID


    Many SSL VPNs also provide support for single sign-on (SSO) capacity. More sophistic-ated
    VPN gateways provide additional network access through downloadable ActiveX components,
    Java applets, and installable Win32 applications. These addons help remote users
    access a wide range of applications, including:


    +   * Citrix MetaFrame

    * Microsoft Outlook

    * NFS

    * Remote Desktop

    * Secure Shell (SSH)

    * Telnet


    However, note that not all SSL VPN products support all applications.

    SSL VPN can also block traffic at the application level, blocking worms and viruses
    at the gateway. SSL VPN is again not bound to any IP address; however, unlike
    IPsec VPN, con-nections can be maintained as the client moves. SSL VPN differs
    from IPsec VPN in that it provides fine-tuned access control. By using SSL VPN,
    each resource can be defined in a very granular manner, even as far as a URL.
    This feature of SSL VPN enables remote workers to access internal Web sites, applications,
    and file servers. This differs from IPsec VPN, since the entire corporate network
    can be defined in a single statement. SSL-based VPN uses HTTP:TCP port 443. Many
    corporate firewall policies allow outbound access for port 443 from any computer
    in the corporate network. In addition, as HTTPS traffic is encrypted, there will
    be limited firewall rules for SSL VPN.


