    # Network Analysis and Policy


    Before opening your newly installed network analyzer at work, read your company
    policy! A properly written and comprehensive “Appropriate Use” network policy
    will prohibit you from running network analyzers. Usually the only exception to
    this is if network analysis is in your job description. Also, just because you
    provide security consulting services for company clients does not mean that you
    can use a sniffer on the company network. However, if you are an administrator
    and allowed to legitimately run a sniffer, you can use it to enforce your company’s
    security policy. If the policy on sniffers is not clear in your organization,
    take the time to get permission in writing from the appropriate departments before
    using them or any other security-related tools. On the other hand, if your company
    policy prohibits file-sharing applications (e.g., KaZaA, Morpheus, BitTorrent
    or messaging services such as Internet Relay Chat [IRC] or Instant Messenger [IM]),
    you could use a sniffer to detect this type of activity.


    Also, if you provide security services for clients, be sure that using a sniffer
    is included in your Rules of Engagement. Be very specific about how, where, and
    when it will be used. Also, provide clauses (e.g., Non-Disclosure Agreements)
    that will exempt you from the liability of learning confidential information.


    Ensure that your sniffing activities do not violate any laws against wiretapping.
    In many countries, wiretapping laws were enacted at a time when modems were the
    most complicated network access device, so the clarification of laws and related
    regulatory requirements can be complex and differ based on the situation and the
    parties involved.


