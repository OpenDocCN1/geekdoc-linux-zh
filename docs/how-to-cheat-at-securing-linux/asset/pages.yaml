    # Protecting Against Sniffers


    So far, you have learned what sniffing is and how it works. You have also learned
    some of the tricks that can be used by intruders for sniffing, and some not-so-foolproof
    methods of detecting sniffing. None of this sheds a positive light on your plight
    to protect your network and data. However, there are some methods on your network
    that offer protection against sniffing.


    We talked about using switches instead of hubs, and we learned the methods used
    to defeat switches. Using switches is a network best practice that allows increased
    performance and security. While switches present a barrier to casual sniffing,
