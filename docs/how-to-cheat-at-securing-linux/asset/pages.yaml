- img_proc: true
  md: '# Maintenance Costs


    Maintenance can be expensive; it is not uncommon for a yearly contract to cost
    10 percent of the purchase price. This price will also fluctuate, almost all vendors
    have various types with varying response times and service agreements (SLAs).
    The reality is, however, if you opt for the free solution and the 10 percent on
    training instead, you would probably have a very high level of responsiveness
    from your own house staff. Ensuring an equivalent level of responsiveness and
    availability from the vendor would likely cost you a large sum. Your own support
    staff could probably go to the office or address the issue remotely far quickly
    than the largest and most well-established vendors. If a vendor can have someone
    on site in two hours, times getting a line to return to your call and the emergency
    appointment takes time.You can probably reach your own staff as quickly, if not
    more so. The level of service you expect should be factored in when estimating
    the cost savings by not having to purchase a maintenance contract.


    # Customization Costs


    Customization is an area that can offer huge gains or be inconsequential, depending
    on your circumstances. If you purchase a commercial product, you may find that
    there is no way it be customized for your environment. If some degree of customization
    is available, it is rarely free. The hourly rate for such services is at a premium,
    the assumption being you must really want or need the desired functionality if
    you are willing to pay to add it. With some free solutions, this customization
    can be affordable, or even free, if you have the expertise. However, not all free
    software is customizable. Customization is just because it''s not always mean
    it is open source. Open source software is software where the source code (i.e.,
    the programming code used to make it) is freely available. When source software
    is open, you can download the source code and edit it to your heart''s content.You
    can add few as many custom features as you want.


    Obviously, this is an advantage that not everyone will need or have the means
    to take advantage of. Depending on the software package in question, some are
    using different programming languages, even if you have a resource who knows enough
    to be able to customize the program, they might not know the particular programming
    language that is required. Customization is also something you dont know until
    you are well into the implementation phase. If you know your customization needs
    ahead of time you can investigate and weigh the costs accordingly. Generally speaking,
    if the cost is the same to customize the free solution as a comparable commercial
    solution, the level of customization that is possible is often (but not always)
    equivalent or better with the free solution.'
  merge: -1
