  md: '# Hardening the Operating System • Chapter 2 57


    The lastlog command displays the users and services that have accounts on your
    machine. It lists the last time each logged in to the system, or if the account
    has ever logged in. Each service in Linux is given an account. This is very helpful
    because if a service logged without your knowledge, a hacker may be responsible.
    This would indicate that the hacker controls your system and is currently exploiting
    it. It could also mean that another administrator started the service without
    telling you.


    The messages file is a log file that displays a list of recent activity on the
    system. For example, it lists if a password was changed and who changed it. It
    identifies when a user opens and closes it. It also lists the time and data event
    each took place. It can be viewed by entering the following command:


    ```

    `var/log/messages`

    ```


    If you prefer a GUI to view your log files, a program SWATCH (not installed by
    default) allows an instant and real-time display for large log files. It can view
    any log files you specify and is discussed in the next section.


    The Linux logs should be checked frequently to determine if any security violations
    have occurred on your system. Logs do not offer solutions, so you must analyze
    the data and decide how to counteract the attack.


    # Using Logging Enhancers


    Logging enhancers are tools that simplify logging by allowing logging information
    to be filtered and often displaying in simplified formats. Many open source logging
    programs exist to make system administration much easier. Viewing text-based files
    with hundreds or thousands of entries can be burdensome, especially if you are
    only looking for one specific error entry. Logging enhancers make a much more
    user-friendly experience, and greatly expand and customize the information you
    need to log.


    The next sections explain three popular logging services used by administrators:
    SWATCH, scanlogd, and the next generation of syslog(ng).


    # SWATCH


    Simple WATCHer or Simple WATCHdog (SWATCH) is an open source package that allows
    administrators to efficiently monitor system activity. It can monitor events on
    a system, or a large number of systems, by monitoring logs for specified events,
    SWATCH''S main function is to monitor messages actively as they are written to
    a log files through the Unix syslog utility: SWATCH requires Perl 5 to function.


    SWATCH is efficient because it allows administrators to modify the SWATCH configuration
    file (/etc/swatchrc) to filter logging entries and report to events. For example,
    SWATCH can monitor the system for bad login attempts, and e-mail the administrator
    when this failed authentication event occurs. It can monitor and alter'
  merge: -1
