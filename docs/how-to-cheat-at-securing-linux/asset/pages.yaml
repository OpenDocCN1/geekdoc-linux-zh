    # Controlling and Auditing Root Access with Sudo


    Superuser (sudo) is an open source security tool that allows an administrator
    to give specific users or groups the ability to run certain commands as root or
    as another user. Sudo (current release is 1.6.9p5) is available for download from
    www.gratisoft.us/sudo/download.html. The program can also log commands and arguments
    entered by specified system users. The developers of sudo state that the basic
    philosophy of the program is to “give as privileges as possible but still allow
    people to get their work done.” Sudo was first released to the public in the summer
    of 1986. The program is distributed freely under an ISC-style license. The Sudo
    Main Page is located at http://www.gratisoft.us/sudo/, as shown in Figure 2.13.


    The program is a command-line tool that operates one command at a time. Table
    2.6 lists several important features of sudo.'
