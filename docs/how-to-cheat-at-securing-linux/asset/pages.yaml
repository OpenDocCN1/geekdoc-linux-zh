    # # Novell AppArmor


    AppArmor provides a mechanism to protect your applications from their vulnerabilities.
    Novell calls it ‘immunizing’. To immunize your system you need to install AppArmor
    (installed by default in Novell SUSE Linux Enterprise Server 10), setup AppArmor
    profiles and reboot the system. This section briefly describes the process of
    configuring AppArmor on your SUSE Linux server.


    Most of the common applications and services have profiles created by default
    by AppArmor. When you add new applications and services you can create profiles
    individually for these applications. Make sure to stop the applications before
    you create profiles. When you create the profile, AppArmor runs autodetect to
    analyze and create an initial profile for the application. A manual profiling
    by you is very much required to avoid restricting the application too granularly
    that cannot access the directories required to perform its functions. AppArmor
    has a learning mode to monitor access of the application when you run the same.
    Information gathered by the learning mode is included in the initial profile created
    by AppArmor. Creating profiles for critical applications ensures the application
    run in a security environment ensuring no damage to the system due to the vulnerabilities
    that may get developed-to-time.


    You need to configure AppArmor to immun programs that may grant privileges, open
    ports, cron jobs, server daemons and web applications.


    +   1. First you need to enable AppArmor as shown in the Figure 2.40.'
