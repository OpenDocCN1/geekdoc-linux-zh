  md: '# Presenting the Business Case for Open Source Software • Chapter 1


    look how active the project is.You don''t want to invest a lot of time and energy
    in a product that is likely to just die off and away.


    +   - Support What does support cost? Is it available? How timely is the support?
    What format does support take (online forums, e-mail, phone, and so on).


    +   - Performance Which solutions are the best performers? This includes speed,
    efficiency, and reliability. A powerful software package that crashes every hour
    isn''t a viable option.


    +   - Usability Is the product use friendly? If the learning curve is very high,
    your training costs will rise. If the product doesn''t have a feature or function
    you like, can you customize it and make it more user friendly?


    +   - Security Even for a security tool you must consider security implications.
    Is the product secure? Will it be handling secure data? Are you opening up any
    new security risks? What type of auditing and logging can it produce?


    +   - Legal and License Issues Be aware and review the license agreement closely.
    Many times the free software is not free if you are a business, or there are special
    restrictions on the number of installations or other criteria. When in doubt your
    legal counsel review the license agreement for you.


    +   - Individual Criteria These are any special needs or requirements unique to
    your environment. What''s good for other organizations might not work for you.


    +   Perform Detailed Testing At this stage, you have hopefully narrowed the playing
    field down to one or two selections. It''s time to put them through a real test
    and see if they do what they claim to do. This can be done in a lab or possibly
    on the production network, depending on the risks involved and the nature of the
    product. You will need to evaluate how best to perform your detailed testing based
    on your circumstances.


    +   Come to a Conclusion After all research, you can make a decision on what you
    think the best solution is. Whether you are the final approver or need to forward
    your recommendation to someone else for approval, at this point you should have
    all the facts collected in order for a good decision to be made.


    Remember, the preceding steps leave a lot of room for flexibility. They may be
    formed in a more or less structured fashion. You might not formally cover all
    the steps, but in one form or another those steps should occur. The more thoroughly
    you document the steps, the more you will be in a better position to justify your
    choices.


    Now that we have discussed the many ways that the cost of a free solution may
    be higher or lower than the commercial equivalent, let''s look at an example.
    Suppose your'
