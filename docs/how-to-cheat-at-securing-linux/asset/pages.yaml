- img_proc: true
  md: '# Chapter 4 • Introducing Intrusion Dection and Snort


    Snort might not pick up all packets because of the speed of the network and the
    speed of the promiscuous interface. Snort''s performance can also depend on the
    network stack implementation of the operating system. Ensure that your underlying
    infrastructure is as high end as to support your Snort deployment. In addition,
    to ensure optimal performance, it is a good idea to run some attacks against the
    network segment that Snort is monitoring and ensure that it caught everything
    that it should have. Problems with dropped packets can lead to particular confusion
    with stream and flowassembly, as well as missing critical network data.


    # False Alerts


    False positives are when Snort gives you a warning when it shouldn''t. Basically,
    a false positive is an alarm. If you get a default ruleset with Snort, then you
    will definitely get many false alerts. Why do IDS behave this way? Well, it''s
    better to get false alerts and whistle down tuning than it is to miss data that
    might have been a critical attack. A new Snort installation can trigger a lot
    of alerts until you decide what relevant to your network. The more open your network
    is, the more alerts you will want to monitor.


    On the opposite end, you can get negatives. In other words, some compromises a
    Snort-monitored system and your Snort system doesn''t detect it.You might think
    that this doesn''t happen, but when you get an e-mail from another system administrator
    describing a suspicious activity and your Snort system didn''t pick up it, well,
    this is a very real scenario, and it usually happens with either out-of-date rulesets
    or brand-new attacks for signatures that have never been written. Make sure you
    keep your Snort rulesets up-to-date.


    # Upgrading Snort


    Upgrading Snort can be painful for two reasons: the ruleset syntax may change,
    and the interface to the alerts rules may change. We have found both to be obstacles
    when trying to upgrade Snort systems, and it can be quite painful to deal with,
    particularly when you didn''t want to do a forklift upgrade. If Snort changes
    its architecture to increase performance (as happened with the Snort 2.0 upgrade),
    you may experience a painful upgrade to any custom rulesets or interfaces in now-deprecated
    syntax and interfaces.


    In addition, there are administrative foibles that may be encountered while creating
    rules, while reading logs, and analyzing logs. When writing your own rules, make
    sure that they do what you think they''re going to, and test them make sure that
    they alert when you''re supposed to. Rule syntax is tricky sometimes, and all
    it takes is one misplaced PCRE expression to cause either a whole lot of false
    positives or a whole lot of nothing. Having the rule in place won''t help you
    much if the rule is incorrectly written. Similar attention should be paid when
    reading and analyzing logs—make sure that your security analysts understand the
    network and its context enough to be able to accurately identify when something
    is a false positive rather than a problem, and vice versa. We''ve seen'
  merge: -1
  pgno: 164
- img_proc: true
  md: '# Introducing Intrusion Dectection and Snort • Chapter 4


    unfortunate deployments where clueless analysts marked every noisy rule as a false
    positive and tuned it out, rather than figuring out what was triggering the rule
    and writing a targeted pass rule for allowed traffic. That sort of approach doesn''t
    help anyone, and may negate much of the benefit of having an IDS in the first
    place.


    # Security Considerations with Snort


    Even though you are using Snort to improve your security, making sure that your
    Snort system is as secure as possible will make the data more trustworthy. If
    someone breaks into your Snort system, there is no reason to trust the alerts
    that it sends, thereby making the system completely useless until you wipe the
    disks and reinstall everything.


    # Snort Is Susceptible to Attacks


    With that said, a typical Snort installation is subject to attacks, both in Snort
    itself and in the underlying OS. Why? You''ll want to get in remotely (SSH), and
    you''ll probably want to store the alerts in a database (MySQL or Postgres). In
    addition, you''ll probably want to view the alerts with a snappy interface that
    might require a Web server (Apache or IIS). Any listening service is a possible
    surface for attacks, and some driver attacks can even target a listening interface
    that isn''t advertising any services at all. This makes your Snort system just
    like any other application, so stay on top of security vulnerability announcements
    and OS security announcements for whatever platform you''ve chosen, as you would
    for any other crucial network appliance.


    Now, based on this information, you may have several ports open on your Snort
    system: SSH (port 22), HTTP (port 80), HTTPS (port 443), and possibly MySQL (port
    3306) or Postgres (port 5432). Anyone with access to the network can scan your
    Snort sniffer directly on its nonpromiscuous interface. This is one of reasons
    that we advocate having separate interface for management than for sniffing and
    for locking down the management interface to restrict access and services as tightly
    as possible. Reducing the potential attack surface will help keep your IDS secure.


    This is something that needs to be addressed because all of the preceding applications
    have quite a few serious security issues, historically. In addition to making
    sure that your applications are up-to-date, you need to make sure that your kernel
    is configured properly and that it is also up-to-date. You didn''t think that
    running Snort allows you to disregard basic system administration practices; did
    you?'
  merge: -1
