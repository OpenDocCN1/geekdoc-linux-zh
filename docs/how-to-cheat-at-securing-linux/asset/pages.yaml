    ![](img/b38c01d2fda8509e8449e32f876ae148_380_0.png)


    # # Auditing Access to Resources


    Auditing serves an important role in network security. Not only does it allow
    you a means to know what is occurring on your systems in real time; it also allow
    you to reconstruct a series of events after the fact, which can be especially
    important after a successful compromise has occurred. There are basically two
    types of auditing you do. One is kernel auditing, which will log system calls,
    and the other is syslog, which can log most everything.


    # # Enabling the Auditd Daemon


    Enabling auditing is a very straightforward process. If you don''t have auditd
    installed, go ahead and install it. It should be set to start automatically; if
    it''s not, configure it to do so. The primary file for configuration of auditd
    is /etc/audit.conf. This file contains settings such as where to write the logs
    (defaults to /var/log/audit/audit.log), the log formatting, and what to do if
    the disk is full. Parameters of note are the dispatcher, disk_full_action, and
    max_log_file_action. Dispatcher is the program that audit daemon will use to send
    all logs to stmid. This program will be run as root, so the program needs to be
    secure and used with'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# Linux Bastion Hosts • Chapter 10


    caution. The disk_full_action is exactly what it sounds like: what should the
    daemon do when the disk holds the log full? Max_log_file_action tells the daemon
    what to do when the maximum log file size is reached.


    If auditd is running, the logs for SELinux are written to the same location specified
    in the audit.conf file. If auditd is not running, the logs will be written to
    the syslog log (which is at /var/log/messages by default). You can view the logs
    directly or type dmesg in a terminal to view them.


    The other relevant file for the audit daemon is /etc/audit.rules. This file tells
    the audit daemon when events to audit. By default, the file contains no rules.
    If you wanted to audit all calls for mount, for example, you would place the following
    line in your audit.rules file:

    - tools,always -S mount

    -w /etc/fstab


    This basically means adding a rule to the tools list (-a), and always generate
    an audit event. The -S syscall to watch. mount. -w tells it to watch the /etc/fstab
    file for access attempts and log them. The usefulness of being able to keep close
    tabs on the use of the more important system calls is becoming clearer now. This
    is a very powerful tool for spotting intrusion attempts and other activities that
    indicate someone is trying to do something they shouldn''t be. The watch option
    accepts wildcards, so /etc/* will not work.


    # Enabling the Syslog Daemon


    The daemon that supports syslogd. With current Linux distributions, you would
    be hard-pressed to find one that didn''t come with syslog already enabled, but
    if you do not manage through /etc/syslog.conf. This file is relatively simple.
    Each line consists of a facility, a priority, and an action. Take the following
    example:


    Mail.* /var/log/maillog


