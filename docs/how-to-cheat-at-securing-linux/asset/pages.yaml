  md: '# Authentication Mechanisms


    Apache also includes several ways in which you can authenticate customers using
    your Web server as LDAP, SecureID, and basic .htaccess, to name a few examples.
    To use authentication mechanisms beyond basic .htaccess, you must compile additional
    functionality when you''re building. Like access control, authentication mechanisms
    are specified as part of the <Directory> directive.


    The two steps to enabling basic .htaccess user authentication are:


    +   1. Creating an htpasswd file to store user credentials.

    2. Adding a <Directory> directive to the httpd.conf to protect a directory structure.


    Let''s use an example to demonstrate how easy it can be to add authentication.
    In our example, we''ll secure a directory called /secure and permit only customers
    Elise and Margot access to the files in that directory.


    First, let''s create an htpasswd file somewhere not in the Web server document
    root by issuing the following command:


    ```

    htpasswd -c /usr/local/apache/passwdfile elise

    New password: *****

    Re-type new password: *****

    Adding password for user elise

    ```


    Next, we''ll add Margot to the list as well. This time we don''t need to use the
    -c argument, since our htpasswd file already exists


    ```

    htpasswd /usr/local/apache/passwdfile Margot

    New password: *****

    Re-type new password: *****

    Adding password for user Margot

    ```


    Now that we''ve established our customer accounts, we''ll finish by adding a <Directory>
    directive to the httpd.conf to protect the /secure directory as follows:


    ```

    <Directory /usr/local/apache/htdocs/secure>

    AuthType Basic

    AuthName "Access for authenticated customers only"

    AuthUserFile /usr/local/apache/passwdfile

    Require user margot Elise

    </Directory>

    ```


    Now, when anyone attempts to access the /secure directory, they''ll be prompted
    for a username and password. Because we specifically require only Margot and Elise,
    only they will be permitted to access the directory structure, if they authenticate
    properly.'
  merge: -1
  pgno: 411
- img_proc: true
  md: "# 398 Chapter 11 • Apache Web Server Hardening\n\nLet's move on to discuss\
    \ a couple other security-related <Directory> directives.\n\n# Directory Functionality\
    \ Directives\n\nWithin the <Directory> directive is a subdirective Options that\
    \ controls functionality for the directory structures specified in the <Directory>\
    \ directive. The available options listed in Table 11.3.\n\nTable 11.3 Directory\
    \ Options\n\n| Option | Functionality |\n| --- | --- |\n| All | Default setting;\
    \ includes all options except MultiViews |\n| ExecCGI | Permits CGI script execution\
    \ through mod_cgi |\n| FollowSymLinks | Allows Apache to follow OS file system\
    \ symlinks |\n| Includes | Permits SSI through mod_include |\n| IncludesNOEXEC\
    \ | Permits SSI but denies exec and exec cgi |\n| Indexes | Allows autoindexing\
    \ using mod_autoindex if no configured index is present |\n| MultiViews | Permits\
    \ content negotiation using mod_negotiation |\n| SimLinksOwnerMatch | Allows Apache\
    \ to follow OS file system symlinks only if the link and target file have the\
    \ same owner |\n\nMany of the listed options are not relevant to your installation,\
    \ we disabled Includes and CGI during compile time. Regardless, a good default\
    \ <Directory> directive disabling most options is shown here:\n\n```\n<Directory\
    \ \"/usr/local/apache/htdocs\">\nOrder allow, deny\nAllow from all\nOptions -FollowSymLinks\
    \ -ExecCGI -Includes -Indexes \\\n    -MultiViews\nAllowOverride None\n</Directory>\n\
    ```\n\nAt this point, your Apache server should be relatively secure. Let's discuss\
    \ some Apache logging directives so that we can monitor our server.\n\n# Logging\
    \ Directives\n\nThere are many reasons to configure logging on your Apache server.\
    \ Whether helping you see top page hits, hours of typical high volume traffic,\
    \ or simply understanding who's using your system, logging plays an important\
    \ part of any installation. More important, logging can"
  merge: -1
  pgno: 412
- img_proc: true
  md: '# Apache Web Server Hardening • Chapter 11


    provide a near-real-time historic forensic toolkit during or after security events.
    In this section, we examine some logging configuration best practices.


    To ensure that your logging directives are set correctly, we''ll provide an example
    of the Logging options in the Apache Web server. Apache has many options with
    which you should familiarize yourself by reading

    http://httpd.apache.org/docs/2.0/mod/mod_log_config.html#logformat. This will
    help you understand the best output data to record in logs. Also, recall that
    we compiled Apache with mod_log_forensic, which provides enhanced granularity
    and logging before and after successful page request.


    ```

    An example logging configuration is shown:

    ErrorLog /var/log/apache/error.log

    LogLevel

    LogFormat "%%h %u %t %%s %%{Referer}i" \%{User-Agent}i" \"{forensic-id}n" \%v\"

    CustomLog /var/log/apache/access.log

    ForensicLog /var/log/apache/forensic.log

    ```


    This provides a customized logging format that includes detailed output and places
    all the log files in the /var/log/apache directory.


    > It is good practice to archive your system and Apache log files to backup location.
    This prevents loss of critical forensic data due to accidental deletion or malicious
    activity.


    # Remove Default/Unneeded Apache Files


    After you''ve installed and configured your Apache server, you''ll need to do
    some quick cleanup of files that could represent a security threat. In general,
    you should not leave the source code you used to compile Apache on the file. It''s
    a good idea to tar the files up and move them to a secure server. Once you''ve
    done so, remove the source code from the Apache Web server.


    You''ll also want to remove some of the default directories and files installed
    by the Apache Web server. To do so, execute the following commands on your Web
    server. If you have added content to your document root directory, you''ll want
    to avoid the first command:


    ```

    rm -fr /usr/local/apache/htdocs/*

    rm -fr /usr/local/apache/cgi-bin

    ```'
  merge: -1
