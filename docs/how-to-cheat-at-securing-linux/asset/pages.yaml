    +   Many ISPs prohibit sniffers in their “Appropriate Use” policy. If you discover
    that you are using one while attached to their network, they may disconnect your
    service. The best place to experiment with a sniffer is on your home network that
    is not connected to the Internet. All you need is two computers with a crossover
    cable between them, or a virtual machine application. You can use one as a client,
    and install server services on the other (e.g., Telnet, FTP, Web, and e-mail).'
