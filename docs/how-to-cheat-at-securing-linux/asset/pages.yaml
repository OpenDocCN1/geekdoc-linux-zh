    # Snort Rulesets


    Snort provides many rules as part of the stock installation. Even more rules and
    frequent updates are available by subscription at www.snort.org. Rather than covering
    just the basics, these rules cover many types of events, such as Web or SQL Server
    abuses, signatures that are indicative of viruses, the use of P2P protocols, and
    so on. When some security threat emerges on the Internet, a new snort signature
    is frequently available within hours. In addition, writing your own rules is not
    that difficult.


    You are probably familiar with the basics of Snort rules; you set up a pattern
    that triggers an alert message if it is matched. For example


    ```

    alert icmp $EXTERNAL_NET any => $HOME_NET any (msg:"ICMP JPEG data tunnel"; type:8;
    content:"JFIF"; clasype:string-detect; count:1000000; rev:1);

    ```


    This rule will generate an alert when an ICMP Ping packet is carrying a JPEG image
    within it an effort to transfer data without being detected (you can do that,
    and yet it happens).


    The classic rules of this can be set up to trigger an alert on a variety of conditions.
    This uses the protocol and the packet content as a trigger. Other triggers include
    various TCP flags or options, the packet size, source, and destination. The really
    interesting rules have special functions that are invoked by special keywords
    in the rule. For instance, the react trigger can be used to use Snort to react
    to the packet in some manner, depending on what is desired. This trigger will
    attempt to close the connection and possibly send a visible warning to the originating
    system.


    > If you use the react keyword, it should be the last one in the rule option list.


    Other keywords in this class are resp, logout, and tag. The keyword resp is similar
    to react because it attempts to close the connection. However, resp can be configured
    to send a TCP reset to the source or destination or ICMP unreachable messages
    to either end of the connection. Both resp and react attempt to close the connection.
    Depending on the network volume and the speed of your Snort system, Snort might
    not be able to react fast enough to succeed in shutting down that connection—especially
    if the connection is to a small Web page that is just a couple of packets long.
    Consequently, one should not rely on these keywords to assuredly close the connection.'
