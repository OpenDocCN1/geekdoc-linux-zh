  md: '# Figure 10.5 NTP GUI Configuration


    ![](img/b38c01d2fda8509e8449e32f876ae148_368_0.png)


    Unfortunately, the GUI interface only lets you configure basic options, like adding
    time servers. You should make sure Synchronize System clock before starting service
    is the only option checked under Show Advanced Options. To configure the NTP security
    settings, you need to edit the file /etc/ntpd.conf and some additional files located
    in /etc/ntp/. For secure synchronization with an NTP server, perform the following
    steps:


    +   1. Edit /etc/ntpd.conf and add the time servers you want to get from; include
    the key to be used with each server, as server outtimeserver.com key 12345.

    2. Ensure that restrict default ignore is in /etc/ntpd.conf to set the default
    restrictions.

    3. If needed, add a restrict line for any servers you want to accept NTP requests
    from.

    4. Edit /etc/ntp/keys and configure a unique key to be used for each time server,
    using the desired algorithm; for example, 12345 A secretkey would configure key
    #12345 as an ASCII string between one and eight characters long, with a value
    of secretkey. This key must be in the keys file of both the NTP server and the
    client for this to work.

    5. Add the keys to the /etc/ntpd.conf file. For example, add key 12345 as a trusted
    key, enter trustedkey 12345.

    6. Restrict the NTP configuration files to be owned and readable only by root.'
