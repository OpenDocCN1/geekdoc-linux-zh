  md: 'Linux Bastion Hosts • Chapter 10


    # Disk Partitions


    Linux has some specific requirements for disk partitions. All the applications
    that could be running at any time require a considerable amount of RAM to run.
    Typically, more memory is required than the machine has physically installed.
    Fortunately, operating systems have a technique to make it appear that more memory
    is using swap space. This swap space is presented to the application as though
    it were more RAM. In Windows, the swap space is in the form of a swap file, which
    by default is located on the same partition. Linux, on the other hand, expects
    the swap space to be on a separate physical partition. This swap partition actually
    gets formatted specifically as a swap partition, not a standard file system. Linux
    distributions allow you to use a normal file for swap space, like Windows, but
    using a separate swap partition provides more significant performance and increases
    stability.


    The amount of swap space that will need vary by the programs that are loaded and
    the functionality you are using in. When you use a swap file, this means the size
    of the file will need to change regularly, causing reads and writes to the disk,
    above and beyond what is needed to manage the program data, simple to manage the
    swap file itself. By contrast, if you use a separate partition, there is no disk
    activity to manage the swap file, only the activity required by the programs using
    the swap space. Stability can be enhanced using a separate swap partition as well.
    If the partition containing your swap file fills up with data, it can prevent
    the swap file from growing and providing the needed swap space for a newly loaded
    program. A dedicated partition for the swap space provides the desired isolation
    from user data and ensures that the swap space will be available.


    # Choosing a Linux Version


    Because there are so many different versions of Linux available, you have a lot
    of choices here. The different versions may have some of the same core components,
    but each offers different sets of software packages, often with an emphasis on
    a particular type of function—such as security testing, general office productivity,
    or software development platforms. These variations are called distributions,
    or sometimes even distros for short. A good source of information on the various
    distributions is www.distrowatch.com. This site includes a brief summary of what
    the distribution is trying to accomplish and includes links to the homepage and
    download locations. You can, of course, always do a Google search to find a distribution
    that does exactly what you are looking for. For a locally installed full installation,
    Fedora core (which we examine in the examples in this chapter) provides a lot
    of features and has extensive support documentation. If you just want to dangle,
    a live CD, such as SLAX, is a very user-friendly way to get your feet wet with
    Linux.'
  merge: -1
  pgno: 357
