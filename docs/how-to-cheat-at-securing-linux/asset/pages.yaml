    # Packet Sniffer


    A packet sniffer is a device (either hardware or software) used to tap into networks.
    It works in a similar fashion to a telephone wiretap, but it''s used for data
    networks instead of voice networks. A network sniffer allows an application or
    a hardware device to eavesdrop on data network traffic. In the case of the Internet,
    this usually consists of IP traffic, but in local LANs and legacy networks, it
    can be any other protocol, such as IPX and AppleTalk traffic.


    Because IP traffic consists of many different higher-level protocols (including
    TCP, UDP, ICMP, routing protocols, and IPSec), many sniffers analyze the various
    network protocols to interpret the packets into something human-readable.


