  md: '# Figure 5.1 Bypassing the Firewalls using the IDS


    ![](img/b38c01d2fda8509e8449e32f876ae148_173_0.png)


    The first dotted line (data flow #1) represents the desired (secure) data flow.
    Traffic from outside can only terminate on a server in the DMZ, and traffic going
    into the internal network can only come from a server in the DMZ. With this configuration
    traffic from the Internet can never pass the way directly to a host on the internal
    network. The second data flow, #2, represents an incorrectly configured IDS could
    be used to route traffic from the outside (untrusted) network, into the internal
    network.


    When it comes to placement of your IDS, you need to be aware of the difference
    between a switch and a hub. A hub operates by sending any traffic it receives
    on any port to every other port. Therefore, when using a hub, the IDS will see
    all the traffic passing through that hub, which is usually what you want for your
    IDS. A switch is more advanced than a hub, most modern devices are switches. A
    switch listens and learns what machines are connected to it. It then uses this
    information to construct a forwarding table. It has learned which port a given
    host is, it will then only send traffic destined for that host to that specific
    port. This means that without any additional configuration, when you plug your
    IDS into a switch port, it isn''t going to be seeing much traffic.'
  merge: -1
