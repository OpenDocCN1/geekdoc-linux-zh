  md: '# Introduction


    The general concepts behind hardening a Linux bastion host are no different than
    they are for any other OS. You still need to minimize the installed software,
    update and patch the OS, and tighten the security settings. It is only the specific
    methods for accomplishing these tasks that vary with a Linux-based bastion host
    over a Windows-based one. The basic approach to hardening any bastion host (whether
    Linux, Unix, Windows, or other) can be summarized in the following high-level
    steps:


    +   1. Planning comes before doing.

    2. Remember the bastion host''s role during all stages.

    3. Leave only the minimum components on the system to get the job done.

    4. Take what''s left and make it secure as possible, avoiding default settings
    where practical.


    In some ways, securing Linux to serve as a bastion host can be harder than you
    are using a Microsoft product, because there are so many options. If you are not
    thoroughly comfortable with the landscape, the task of sorting out what tool and
    configuration to use can seem daunting. On the flip side, this weakness—Linux''s
    extreme flexibility—is also its strength. Those same bewildering options provide
    you with nearly-infinite flexibility in how you accomplish your objectives. In
    this chapter we walk through the steps of hardening a Linux computer and preparing
    it to serve in the role of bastion host. We cover the specific steps you need
    to take and contrast those with the same steps you would use on a Windows system.
    It is assumed that the reader is aware or at least familiar with the chapter on
    Windows bastion hosts and that the reader has at least moderate understanding
    of and experience using Linux.


    # System Installation


    With various flavors of Linux becoming so popular, deciding to use Linux for your
    bastion host has never been easier than it is today. The Internet is overflowing
    with helpful articles and Web sites to help you through setting up a Linux system.
    Many vendors are offering brand-new systems with Linux already. Several distributions
    of Linux are specifically configured to be user friendly and help a novice learn
    the ins and outs of Linux. We will go through the steps of hardening your Linux
    system on the assumption that you are installing from scratch. If you need to
    evaluate whether starting over with a clean install with settings you choose is
    worth the effort. If you inherited the system, starting over might not be an option,
    but many of these procedures can still serve as good guidelines for how you can
    lock down your newly inherited system.'
  merge: -1
