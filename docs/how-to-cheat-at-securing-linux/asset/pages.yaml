    # The Rlogin Service


    The remote login (login) service is enabled by default in the /etc/xinetd.d/login
    file. Rlogin has security vulnerabilities it can bypass the password prompt to
    access a system remotely.There are two services associated with rlogin: login
    and RSH (remote shell). To disable these, open the /xinetd.d/login file and comment
    out the service login line.Then, open the /etc/xinetd.d/rsh file and comment out
    the service line. Restart xinetd to ensure that your system is no longer offering
    these services.


    # Locking Down Ports


    TCP/IP networks assign a port to each service, such as HTTP, Simple Mail Transfer
    Protocol (SMTP), and Post Office Protocol version 3 (POP3). This port is given
    a number, called a port number, used for incoming data to the correct service.
    For example, if a client browser is requesting a server''s Web page, the request
    will be directed to 80 on the server. The Web service receives the request and
    sends the Web page to the client. Each service is assigned a port number, and
    each port number has a TCP and UDP port. For example, port 53 is used for the
    Domain Name System (DNS) and has a TCP port or a UDP port. TCP port 53 is used
    for zone transfers between DNS servers; UDP port 53 is used for common DNS queries—resolving
    domain names to IP addresses.


    # Well-Known and Registered Ports


    There are two types of ports used for TCP/IP networks: well-known and registered
    ports. The well-known ports are the network services that have been assigned a
    specific port number (as defined by /etc/services). For example, SMTP is assigned
    port 25, and HTTP is assigned port 80. Servers listen on the network for requests
    at the well-known ports. Registered ports are temporary ports, used by clients,
    and will vary each time a service is used. Registered ports are also called ephemeral
    ports, because they last for only a brief time. The port is then abandoned and
    can be used by other services.


    The port number ranges are classified, as shown in Table 2.1, according to Request
    for Comments (RFC) 1700. To access RFC 1700, go to ftp://ftp.isi.edu/in-notes/rfc1700.txt.
    Table 2.2 is a list of well-known TCP/UDP port numbers.'
