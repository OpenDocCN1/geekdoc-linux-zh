    # Hardening the System with Bastille


    Bastille is an open source program that facilitates the hardening of a Linux system.
    It performs many of the tasks discussed in this chapter as disabling services
    and ports that are not required for the system’s job functions. The program also
    offers a wider range of services, from installing a firewall (ipchains/iptables)
    to implementing secure shell (SSH).


    Bastille is powerful and can save administrators time from configuring each individual
    file and program the operating system. Instead, the administrator answers a series
    of “Yes” and “No” questions through an interactive GUI. The program automatically
    implements the administrator’s preferences based on the answers to the questions.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# Hardening the Operating System • Chapter 2


    Bastille is written specifically to Red Hat Linux and Mandrake Linux, but can
    be easily modified to run on most Unix flavors. The specific Red/Mandrake content
    has been generalized, and now the hard-code filenames are represented as variables.
    These variables are set automatically at runtime. Before you install Bastille
    on your system ensure your Linux version is supported by Bastille.


    # Bastille Functions


    The following list highlights the security features offered by Bastille to secure
    your system. You will choose which feature to implement on your system during
    the question-and-answer wizard. For example, many servers do not need to provide
    firewall or Network Address Translation (NAT), so you may not need to configure
    ipchains/iptables. This is a partial list of features offered by Bastille and
    may as new versions of Bastille are released. More information about each of these
    features is explained in the program.


    +   - Apply restrictive permissions on administrator utilities Allows only the
    root to read and execute common Administrator utilities such as ifconfig, linux-conf,
    ping, traceroute, and runlevel). It disables the UID root status for these programs,
    so nonroot users cannot use them.


    +   - Disable r-protocols The r-protocols allow users to log on remote systems
    using IP-based authentication. IP-based authentication permits only specific IP
    addresses to remotely log on a system. Because this authentication is based on
    the IP address, a hacker who has discovered an authorized IP address can create
    spoofed packets that appear to be from the authorized system.


    +   - Implement password age Default Red Hat Linux allows passwords to expire
    after 9999 days. Because this is too long in a secure environment, Bastille offers
    to change the password expiration time to 180 days. These configurations are written
    to the /etc/login.defs file, as shown in Figure 2.7.


    +   - Disable CTRL-ALT-DELETE rebooting This disables allowing rebooting the machine
    by this method.


    +   - Optimize TCP Wrappers This choice modifies the inetd.conf (pre-Red Hat Linux
    7 versions only) and /etc/hosts.allow file so that inetd must control TCP Wrappers
    when it gets a request, instead of automatically running the requested service.
    TCP Wrappers TCP Wrappers will determine if the requesting IP address is allowed
    to run the particular service. If the request is not allowed, the request is denied
    and the attempt is logged. Although IP-based authentication can be vulnerable,
    this optimization adds a layer of security to the process. This is not recommended
    for most scenarios.'
  merge: -1
