  md: 'Also, configure the ServerAdmin directive with a valid alias e-mail address
    such as the following:


    This will provide a point of contact for your customers, should they experience
    problems with your site.


    # Performance/Denial-of-Service (DoS) Directives


    There are a number of performance-tuning directives in the Apache httpd.conf file.
    As a security professional, you should interpret these directives as DoS prevention
    statements, since they control resource allocation for users of the Apache server.The
    following directives control the performance of an Apache server:


    +   - Timeout Configures the time Apache waits to receive GET requests, the time
    between TCP packets for POST or PUT requests, or the time between TCP ACK responses
    in responses. The Apache default is 300 seconds (5 minutes), but you might want
    to consider reducing this to 60 seconds to mitigate DoS attacks.


    +   - KeepAlive Configures HTTP1.1-compliant persistency for all Web requests.
    By default, this is set to 0 and should remain as to streamline Web communication.


    +   - KeepAliveTimeout Determines the maximum time to wait before closing an inactive,
    persistent connection. Keep this value at the default of 15 seconds, since raising
    it can cause performance problems on busy servers and expose you to DoS attacks.


    +   - StartServers Design the number of child processes to start when Apache starts.
    Setting this value higher than the default of 5 can increase server performance,
    but use care not to set the value too high, because doing so saturate system resources.


    +   - MinSpareServers This setting, like the MaxSpareServers setting, allows for
    dynamic adjustment of Apache child processes. MinSpareServers instructs Apache
    to maintain the specified number of idle processes for new connections. This number
    should be relatively low except on very busy servers.


    +   - MaxSpareServers Maintains Apache idle processes at the specified number.
    MinSpareServers, this value should be low, except for busy sites.


    +   - MaxClients As its name implies, this setting determines the maximum number
    of concurrent requests to the Apache server. We''ll leave this at the default
    value of 256.'
