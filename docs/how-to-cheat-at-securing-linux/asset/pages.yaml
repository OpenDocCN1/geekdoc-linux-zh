  md: 'attacks methodically attempt to check each key until the key that decrypts
    the message is found. However, brute-force attacks are often impractical, because
    the amount of time necessary to search the keys is greater than the useful life
    of the hidden information. No algorithm is truly unbreakable, but a strong algorithm
    takes so long to crack that it is impractical to try. Because brute-force attacks
    originate from computers, and because computers are continually improving in efficiency,
    an algorithm that may be resistant to a brute force attack performed by a computer
    today, will not necessarily be resistant to attacks by computers 5 to 10 years
    in the future.


    # Data Encryption Standard and Triple Data Encryption Standard


    Among the oldest and most famous encryption algorithms is the Data Encryption
    Standard (DES), the use of which has declined with the advent of algorithms that
    provide improved security. DES was based on the Lucifer algorithm invented by
    Horst Feistel, which never saw widespread use. Essentially, DES uses a 64-bit
    key—56 bits of data and 8 bits of parity—and operates on data in 64-bit chunks.
    This key is broken into 16 48-bit subkeys, one for each round, which are called
    Feistel cycles. Figure 8.1 gives a schematic of the DES encryption algorithm operates.


    Figure 8.1 Diagram of the DES Encryption Algorithm


    ![](img/b38c01d2fda8509e8449e32f876ae148_266_0.png)'
