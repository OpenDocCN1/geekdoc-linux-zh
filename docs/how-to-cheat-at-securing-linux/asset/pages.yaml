- img_proc: true
  md: '# Linux Bastion Hosts • Chapter 10


    The Cadillac hardening scripts are Bastille-Linux. It has evolved from a crude
    script to a well-refined hardening system with a GUI interface. Bastille currently
    runs Red Enterprise Linux, Fedora Core, SuSE, Debian, Gentoo, Mandrake, and HP-UX,
    with a Mac OS version in development. You can read about and download Bastille
    from www.bastille-linux.org.


    You can pass only three options to Bastille, each of which tells it to run in
    a different mode. If you use bastille -report, the system will generate a Web
    report of your host''s current “hardness.” The -c option will run the actual hardening
    script in a text-based mode, and -x will run it in a graphical mode, as shown
    in Figure 10.9.


    # Figure 10.9 Bastille Graphical Configuration


    ![](img/b38c01d2fda8509e8449e32f876ae148_375_0.png)


    All you have to do to Bastille is start it and it will present a series of questions
    you must respond to with a yes or no. Based on your choices, Bastille will configure
    various security settings automatically. These settings remove SUID bits from
    some programs, disabling insecure services (such as rsh, for example), changing
    user expiration and much more. The script will always have the most secure as
    the default selection, in cases where more secure selection has a high risk of
    impacting normal functionality. When you are finished answering the questions,
    you will be prompted to choose whether or not to save the resulting Bastille configuration.You
    will be prompted to choose whether you want to apply the configuration or not.'
