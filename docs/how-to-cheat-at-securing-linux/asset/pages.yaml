  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    +   Q: When should a preprocessor plug-in be used?

    A: A preprocessor plug-ins runs on all decoded packets. They are typically used
    to handle the analysis of traffic that is too complex for Snort rulesets.


    +   Q: When should a detection plug-in be used?

    A: A detection plug-in can be used to add new keyword behaviors to Snort rulesets
    to enrich the standard ruleset syntax.


    +   Q: When should an output plug-in be used?

    A: An output plug-in should be used to augment the output options for Snort alerts;
    for example, to write to some exotic database system that Snort does not ordinarily
    support.


    +   Q: Can Snort be used with a firewall to create an active intrusion prevention
    system (IPS)?nA: Yes, Snort can be used in inline mode with Linux iptables.'
  merge: -1
