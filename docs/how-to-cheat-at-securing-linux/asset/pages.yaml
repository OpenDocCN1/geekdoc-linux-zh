    thinking is costly.


    # True DMZ


    The true DMZ is generally considered the most secure of firewall architectures.
    With this design, there is an internal and external firewall. Between the two
    is sandwiched any Internet accessible devices (see Figure 9.3).


    # Figure 9.3 True DMZ


    ![](img/b38c01d2fda8509e8449e32f876ae148_291_0.png)


    Internet traffic is only permitted to a server in the DMZ, and only on the port
    that server is listening on. For example, if you had a Web server in the DMZ and
    an FTP server in the DMZ, traffic with a destination port of 80 would only be
    permitted to the Web server. For users accessing the same servers, the same rules
    would apply. Internal users would to have permission through both firewalls to
    access the Internet. Obviously, this type of design costs more, typically doable,
    but that cost buys increased security. In a true DMZ, if the Web server is compromised
    the hacker is still trapped between firewalls. For those who want to go the extra
    mile, the inside and outside firewalls can be different types (say Cisco Private
    Internet Exchange [PIX] and Linux netfilter). Then, this hacker finds a security
    hole in one firewall is unlikely to be able to apply the same techniques to the
    other firewall.


    With all of the basics out of the way, you will be in a better position to make
    informed decisions when it comes to propose and implement a firewall solution
    for your network. Bear in mind, while this chapter covers the basics of firewalls,
    there are entire volumes'
