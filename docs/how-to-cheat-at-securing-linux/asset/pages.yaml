    +   - New sniffers are smart enough to hide from traditional detection techniques.


    # Protocol Dissection


    +   - DNS packets can use TCP or UDP, depending on the purpose of the query and
    the amount of data transmitted.


    +   - NTP data transmissions generally use UDP port 123 for both the client and
    server ports.


    +   - Multiple virtual HTTP servers can listen on one port. The Host: header indicates
