  md: '# Acquire, Compile, and Install Apache Web Server Software


    Because Apache is open-source software, you can freely download the binaries or
    source code and get going with your installation. Although there are many locations
    directly which you could download the software, it is always best to obtain the
    Apache software from an approved Apache Foundation mirror listed at http://httpd.apache.org/download.cgi.


    You''ll need to decide whether to install the server using precompiled binaries
    or to compile the source yourself. From a security and functionality perspective,
    it is usually better to obtain the source code and compile the software, since
    doing so provides fine-tuning of security features and business functionality.
    In this section, we will discuss compiling the Apache server from source code.


    To download the source code, pick your browser at the URL listed previously, select
    a mirror, and select the latest Apache source code distribution. While you''re
    on the Apache mirror site, also download the MD5 checksum, which should be available
    in the same direction as the source code. The checksum file will look identical
    to the source code tarball but will have an .md5 file extension. We''ll use this
    checksum to verify the integrity of our Apache source code.


    # Verify Source Code Integrity


    To verify the checksum, you will need additional software called md5sum that might
    be part of your OS distribution. If it is not, you can download the software as
    part of GNU Textutils available at www.gnu.org/software/textutils/textutils.html.
    To verify the Apache checksum, perform the following steps. In this case, we will
    use Apache version 2.2.3.


    +   * **Root** from the command line, change directories to where you downloaded
    the Apache source code tarball and checksum file.

    * **Type** `cat httpd-2.2.3.tar.gz.md5` to `httpd-2.2.3.tar.gz` to see the md5
    checksum string. You should see something like `f72fb176e2dc7c32be16508c09f63c
    httpd-2.2.3.tar.gz`.

    * From the same directory, type `md5sum httpd-2.2.3.tar.gz.md5` to obtain the
    checksum from the tarball. You should see see the identical string shown in Step
    2. If you do, the software you downloaded is authentic.


    # Compile the Source Code


    After downloading and verifying the Apache source code, you''ll need to do some
    research to understand what options you want to compile into your Web server.
    There are many modules, such as mod_access and mod_ssl, that can be added to your
    server to provide addi-'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'tional functionality and security. A full list of Apache Foundation-provided
    modules can be found at http://httpd.apache.org/docs/2.0/mod/. When choosing modules,
    be sure you select only what you need. Compiling extra, unnecessary modules will
    only result in a less secure, slower Web server.


    # WARNING


    Use caution in enabling and disabling services at compile time. Before you do
    so, determine the dependencies of your Web server code. For instance, do you need
    CGI functionality on your site? Failure to understand what services you require
    to operate could result in loss of critical functionality. It might be prudent
    to test your configuration in a lab environment before disabling services on a
    production server.


    Once you''ve decided which modules and configurations to use, you should accomplish
    one final task before building your software: Obscure the Apache version information
    located in the ap_release.h file located in the ${ApacheSrcDir}/include directory.
    To do so, vi the file and alter the following lines to change the Software Vendor
    (Apache Software Foundation) information:


    ```

    #define AP_SERVER_BASEVENDOR "Apache Software Foundation"

    #define AP_SERVER_BASEPRODUCT "Apache"

    ```


    In general, you''ll need to perform three steps to compile and install your Apache
    Web server, as:


    +   1. From the ${ApacheSrcDir} directory, run ./configure.

    2. After compiling source, run ./make to compile the software.

    3. After compiling the server, run ./make install to install the Apache Web server.


    During the first step, you''ll decide what is added to the Apache server at compile
    time. Table 11.2 includes a list of modules you may consider adding and removing
    from your configuration.'
