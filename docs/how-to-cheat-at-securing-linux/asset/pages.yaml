    argue that there is nothing you can do to make your network completely secure.
    A combination of network access controls like 802.1x, ubiquitous and opportunistic
    encryption, and strong policies and procedures will go a long way in protecting
    your network from sniffers and other security issues. Using several layers of
    security is known as defense-in-depth, and is a standard best practice for secure
    network architectures.


    **Q**: What is this opportunistic encryption that you speak of, and where can
    I buy it?

    **A**: Opportunistic Encryption is the practice where communication between two
    parties becomes encrypted, even when those parties cannot be assured of each other’s
    identity. More information on opportunistic encryption is available at www.wikipedia.org/wiki/Opportunistic_encryption_free
    of charge. Ubiquitous opportunistic encryption is the theory that any network
    communication can be encrypted, should be.


