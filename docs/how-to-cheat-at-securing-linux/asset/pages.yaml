  md: '# Chapter 4 • Introducing Intrusion Dectection and Snort


    > Notes from the Underground...


    # Snort Security Vulnerabilities


    All applications end up with some discovered relatively few flaws, eventually.
    Snort is no exception. Although Snort itself has had relatively few flaws, some
    of the vulnerabilities in recent years have been notable. The RPC preprocessor
    flaw of 2003 (xforge.iss.net/xforge/alerts/id/advise141) allowed denial of service
    or potential host compromise. The flaw in the Back Order Handling in 2005 (www.osdb.org/displayvul.php?ids=23004)
    could be triggered by a single earlier UDP packet, and the frag3 Preprocessor
    Packet Reassembly Vulnerability this year (2006) could potentially allow malicious
    traffic to undetected (www.osdb.org/displayvul.php?id=23501). Because of issues
    like these, it is critically important to pay attention to vulnerability research
    and announcement lists and to patch your systems as new software becomes available.


    # Securing Your Snort System


    Even though your Snort implementation is locked down, your system itself might
    not be. Make sure you do the basics. There are some things you need to do without:


    +   Turn off services you don''t need Services like Telnet, the Berkeley R services,
    FTP, NFS, and NIS should not be running on your system. In addition, make sure
    you don''t have any of the useless services running; for example, echo, discard,
    and charge.


    +   Maintain system integrity Tripwire is a freep application that checks for
    those backdoors and Trojans you don''t suspect. There are plenty of freep applications
    like Tripwire-AIDE and Samhain are two worth mentioning.


    +   Firewall or TCP Wrap the services you use Services like SSH and MySQL should
    be TCP wrapped or firewalled because they have their own security holes as well,
    and access should be restricted to the smallest possible set of necessary users.
    For services that you can''t TCP Wrap like Apache, make sure you have configured
    them securely as possible. IPTables is the latest version of the Linux firewall,
    and there are plenty of references on how to implement it.


    +   Encrypt and use public key authentication as much as you can You should enable
    public key authentication only for OpenSSH. Another thing you might want to consider
    doing for Apache when using it to view logs is use'
