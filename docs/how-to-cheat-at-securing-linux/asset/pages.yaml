    when a switch receives information, it doesn''t blindly send it to all other computers;
    it looks at the packet header to locate the destination MAC address, and maintains
    a list of MAC addresses and corresponding ports on the switch that the computers
    are connected to. It then forwards the packets to the specified port. This narrows
