  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.sygress.com/solutions
    and click on the “Ask the Author” form.


    +   Q: If I were to run Linux from a CD-ROM on my bastion host, won''t the performance
    be worse than if I used a hard drive?


    +   A: Maybe. Many of the live CDs have the option of running entirely in RAM.
    If you have adequate hardware, this can result in an extremely fast system. If
    the host will need to manipulate a lot of data, using the hard disk might be unavoidable;
    however, you could still run from CD-ROM and customize the distribution to make
    use of the hard disk for data storage.


    +   Q: IPTables the firewall or Netfilter? And what is IPChains I here about?


    +   A: Netfilter is the actual firewall component, though it is very common for
    people to refer to the firewall as IPTables. Strictly speaking, IPTables is only
    the command-line interface for editing the rules that Netfilter uses. IPChains
    is the previous incarnation of IPTables and should no longer be used if possible.


    +   Q: Is it any more secure to use the Netfilter firewall over TCP Wrappers?


    +   A: They don''t really do the same thing. The Netfilter firewall makes filtering
    decisions based on the contents of the headers of the IP packets alone. TCP Wrappers
    make decisions based on the source IP and the process name that is listening for
    inbound connections. The functions of the two overlap slightly They complement
    each other nicely, however, and using both of them provides defense in depth.


    +   Q: Why wouldn''t I want to run X Windows remotely? I like using a GUI instead
    of the command line.


    +   A: For a bastion host, the objective is to minimize exposure to attack. And
    like any other software running on your bastion host, X Windows is simply one
    more listening service that an attacker can target. Using SSH would always be
    the more secure option, though X Windows is used all over the Internet without
    being compromised. In the end you will just need to research and weigh the pros
    and cons for your environment.


    ![](img/b38c01d2fda8509e8449e32f876ae148_396_0.png)'
