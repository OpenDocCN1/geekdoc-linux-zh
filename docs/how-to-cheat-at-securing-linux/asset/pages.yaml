  md: '+   - Make sure the kernel and software are patched and up to date, to avoid
    known vulnerabilities.


    +   - Remove or minimize the user of SUID and SGID files.


    +   - Consider applying SELinux for mandatory access controls. Research the implementation
    details fully before coming to a decision. SELinux can offer a lot of protection,
    but the configuration and management can be burdensome.


    +   - Harden the TCP/IP stack to make it more resistant to inherent weaknesses.


    +   - Run Bastille Linux in Report mode to see if there are things missed, or
    use it to make actual changes to the system.


    # Controlling Access to Resource


    +   - Implement TCP Wrappers to protect processes based on client IP addresses.


    +   - Implement the NetFilter firewall. It''s free and very powerful.


    # Auditing Access to Resource


    +   - Enable auditd for auditing of system calls.


    +   - Enable syslogd for normal syslog logging.


    +   - Remember to log access to the logs themselves. Attackers will often attempt
    to delete or edit the logs to hide evidence of their activities.


    +   - Configure automated log monitoring to make the volume of data manageable.'
