  md: '# Linux Bastion Hosts • Chapter 10


    fine-tuning the rules until you get the system into a working state. Once you
    are satisfied with the SELinux rules, you can enable Enforcing mode, which will
    actually apply your configured policy. Policies can be defined as targeted or
    strict. The strict policy applies to all processes and files on the system; the
    targeted policy applies only to specific files. while secure, has been found to
    be very difficult to configure properly. Targeted is easier to configure and is
    the default policy when SELinux is first enabled. You can check the status of
    SELinux by typing status.


    If you navigate back to the Security Configuration window and click the SELinux
    tab, then you will be presented with a list of options to toggle SELinux settings.
    These options are only a limited set of configured choices to toggle settings
    in the SELinux policy files. For any serious configuration you will need to edit
    the files manually. You can also download a third-party SELinux policy editor
    from the SELinux Policy Editor Project (http://edit.sourceforge.net/index.html).
    This package includes a simplified set of tools that is slightly less functional
    than the normal package. However, you can switch between one or the other.


    By reviewing the logs, you can see what actions the policy would have denied if
    it was enforced. If auditing has not been enabled, the Access Vector Cache (AVC)
    messages are found in /var/log/messages. If auditing is enabled, they will be
    in /var/log/audit/audit.log. Further details on configuring SELinux are beyond
    the scope of this book. It is recommended that you read the documentation on the
    Web site of your chosen distribution as well as the official SELinux site (selinux/).


    # TCP/IP Stack Hardening


    Some of attacking a computer system do not rely on weaknesses in the software
    that is providing a service instead attack weaknesses in the underlying communications
    protocol. For Internet-connected systems, these attacking weaknesses in the various
    protocols make the TCP/IP suite. Further, some of these weaknesses are intrinsic
    to the ways they work, and cannot be removed. In those cases, you can fine-tune
    the systems to make your host more resistant to those attacks.


    As all security measures, they come with a cost. For example, a SYN attack occurs
    when an attacker initiates a high number of connections by sending a SYN packet,
    but the attacker never completes the TCP handshake. This causes the target to
    wait, with memory and CPU cycles being used on these half-open connections. The
    depletion of resources can cause performance degradation for all users of the
    system as well as reduce resources to the point where legitimate clients cannot
    make connections. One of reducing your risk from such an attack is to reduce the
    length of time a connection can be in that half-open state before it is dropped,
    freeing up resources. The downside to this approach is that legitimate clients
    traversing high-latency networks have problems establishing a connection due the
    short timeouts.'
  merge: -1
  pgno: 373
- img_proc: true
  md: 'The way that you tune these settings, at least on some distributions, is through
    the sysctl utility. This utility allows you to configure various kernel parameters
    at run time. You can add scripts to run at system startup, if desired. If you
    enter sysctl -a | grep ipv4 you will see the list of all TCP/IP variables. In
    the previous example, to reduce the timeout of half-open connections, you should
    use the following command:


    ```

    sysctl -w net ipv4.tcp_syn_retries=3

    ```


    The default value is 5, which means the half-open connection will not be dropped
    until three minutes have passed. Setting it to 3 will result in only a 45-second
    timeout. Other values are possible, with a 1 equaling about nine seconds before
    timeout. As you can see, these will have a significant impact on the functionality
    of the host system, so they should be used with care. The following is a list
    of variables you might want to research and consider:


    +   - net.ipv4.tcp_syn_retries Number of retransmissions in an attempt to complete
    the three-way handshake; a lower number is more resistant to attack.

    - net.ipv4.tcp_max_syn_backlog Number of half-open connections that can be in
    the queue at any given time; a high number is more resistant to attack, at the
    cost of system memory.

    - net.ipv4.icmp_echo_ignore_broadcasts=1 Tells the system not to respond to a
    ping to a broadcast address. On systems this is the default.

    - net.ipv4.conf.all.accept_redirects=0 & net.ipv4.conf.all.send_redirects=0 Tells
    the system not to listen to ICMP redirects, which could be used to alter routing
    tables.

    - net.ipv4.conf.all.accept_source_route=0, net.ipv4.conf.forwarding=0 and net.ipv4.conf.all.mc_forwarding=0
    Together disable these source routing, which is rarely used for anything other
    than attack attempts.

    - net.ipv4.conf.all.rp_filter=1 Tells the system to drop packets when the source
    and destination dont make sense on the interface they come in.

    - net.ipv4.conf.all.tcp_synccookies=1 Enables SYN cookies, allowing the connections
    to be made without using the backlog queue at all. If this setting is enabled,
    net.ipv4.tcp_max_syn_backlog setting will have no effect. It is recommended to
    enable this setting.


    # Automated Hardening Scripts


    Because there are many settings to adjust and configure, it can be easy to miss
    a step. As a result, many people have developed semiautomated scripts to help
    harden a Linux system.'
