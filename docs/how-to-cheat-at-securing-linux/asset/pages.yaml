  md: 'Chapter 9 • Perimeter Security, DMZs, Remote Access, and VPNs


    # # Providing VPN Access


    A virtual private network (VPN) is exactly what it sounds like, the network connection
    you create is virtual, because you can use it over an otherwise public network.
    Basically, you take two endpoints for the VPN tunnel, and all traffic between
    these two endpoints will be encrypted so that the data being transmitted is private
    and unreadable to the systems between. Different VPN solutions use different protocol
    algorithms and encryption algorithms to accomplish this level of privacy. VPNs
    tend to be protocol independent, at least to some degree, in the VPN configuration
    is not on a per-port basis. Rather, once you have established the VPN tunnel,
    all applicable traffic will be routed through the tunnel, extending the boundaries
    of your internal network to include the remote host.


    One of your first considerations when planning to implement a VPN solution is
    the network design. Because the VPN tunnel needs two endpoints, one will be the
    remote workstation. The other will be a specially configured device for that purpose.This
    called a VPN concentrator, because it acts as a common endpoint for multiple VPN
    tunnels. The remote systems will effectively be using the concentrator as a gateway
    into the internal network, such as the placement of the concentrator is important.
    In a highly secured environment, the concentrator is placed in a DMZ sandwiched
    between two firewalls, one firewall facing the Internet, and the other facing
    internally (see Figure 9.29). While this type of arrangement is the most secure,
    it takes more hardware to implement.


    # Figure 9.29 VPN Concentrator Design


    ![](img/b38c01d2fda8509e8449e32f876ae148_340_0.png)'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9 327


    Another way to place the VPN concentrator inside a DMZ is to use an additional
    interface on the firewall as the DMZ in a "one-legged" configuration. This saves
    you to implement an additional firewall, but still provides some isolation from
    the concentrator and the rest of the internal network. If an attacker compromised
    a remote host who VPN''d into the concentrator or compromised the concentrator
    itself, they would still have a firewall between them and the internal network.
    The least preferable option it to place the concentrator inside the internal network.
    With this type of design, if the concentrator is compromised, the attacker would
    have full access to the internal network, with no firewalls to inhibit their activities.
    With any of these designs, you will have to permit the required ports through
    the firewall and forward them to your VPN concentrator.


    Another consideration is the type of VPN protocol you want to use. IPSec is the
    most widely deployed VPN technology for good reason. One is interoperability.
    As a widely used and tested standard, IPSec will work with virtually any modern
    firewall and operating system. The disadvantage of IPSec is that it can sometimes
    be difficult to configure, and there is zero margin for error on the configuration.
    Both ends have match or the tunnel cannot be established. SSL is an increasingly
    popular choice for VPNs, largely because it''s simple to implement.


    Once you have chosen a VPN technology, you will need to consider the administrative
    ramifications of offering remote access. Level of training will be required, the
    very least so they can use the VPN software. You should educate the users on good
    security habits as well. A determination will also need to be made as whether
    remote users are allowed to use their own personal computers, or if they use a
    company-provided computer for remote access. When a remote user connects their
    computer to the corporate network (via a VPN) they may have spyware, a virus,
    or any number or potentially damaging conditions present on their system. Due
    to the fact that you probably do not have any administrative access to their systems,
    even if you wanted to. This is why many companies require that only corporate
    resources be allowed to connect to the company network. In the case of remote
    users, this typically means a company provided desktop, but you have also seen
    instances of old desktops being sent home for remote access.


    A final consideration is whether productivity applications typically place very
    little strain on an remotely modern processor. The same is not true when it comes
    to VPN connections. A single VPN connection requires little overhead and rarely
    impacts the remote user''s system unless it is especially underpowered. The VPN
    concentrator, however, will handle the encryption and decryption of multiple connections,
    in addition to managing the volume of network data that will be accessed through
    it. For this reason, if you anticipate more than just a couple of VPN connections
    to be used simultaneously, you will want to test and evaluate your hardware needs.'
  merge: -1
