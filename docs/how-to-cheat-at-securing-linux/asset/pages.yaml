  md: 'Chapter 2 • Hardening the Operating System


    # Determining Ports to Block


    When determining ports to block on your server, you must first determine which
    services you require. In most cases, block all ports are not exclusively required
    by these services. This is tricky, because you can easily block yourself from
    services you need, especially if you use ephemeral ports, as explained earlier.


    If your server is an exclusive-mail server running SMTP and IMAP, you can block
    all TCP ports except 25 and 143. If your server is an exclusive HTTP server, you
    can block all ports except TCP port 80. In both cases, you can block all UDP ports
    since SMTP and IMAP use TCP services exclusively.


    If you want to use your server as an HTTP client (i.e., for accessing operating
    system updates) or as an e-client to a remote mail server, you will restrict the
    system by doing this. Clients require UDP ports for DNS, as well as registered
    TCP ports for establishing connections with Web servers.


    If you open only the corresponding UDP ports 25, 80, and 143, DNS requests are
    blocked because DNS queries use UDP port 53, and DNS answers use a UDP registered
    port (e.g., the response that www.ingress.com=155.212.56.73). Even if you open
    port 53, a different registered port may be assigned each time for the answer.
    Attempting to allow access to a randomly assigned registered port is almost impossible
    and a waste of time. The same problem applies with TCP connections that require
    ephemeral ports.


    Therefore, you should either all TCP/UDP registered ports (so you can use your
    server as a client), or block them (except for the services you require) and access
    resources, such as operating system updates, another way. You can download the
    updates from another computer.


    # Blocking Ports


    To block TCP/UDP services in Linux, you must disable the service that uses the
    specific port. You may use the GUI interface of firewall services offered by most
    of the Linux distributions. In Red Hat Enterprise Linux (RHEL) 5, Administration
    | Security Level and Firewall opens up the firewall configuration utility. Figure
    2.5 shows the firewall enabled and the selected services are trusted to run.'
  merge: -1
