  md: '# Introduction


    IDS is the high-tech equivalent of a burglar alarm, that is configured to monitor
    information gateways, hostile activities, and known intruders. IDS is a specialized
    tool that knows how to parse and interpret network traffic/or host activities.
    This data can range from network packet analysis to the contents of log files
    from routers, firewalls, and servers, local log access and calls, network flow
    data, and more. Furthermore, IDS stores a database of known attack signatures
    and can compare patterns of activity, traffic, or behavior it sees in the data
    it monitoring against those signatures to recognize when a close match between
    a signature and current or recent behavior occurs. At that point, the IDS can
    issue alerts or actions, various kinds of automated actions ranging from shutting
    down Internet links or servers for back-traces, and make other active attempts
    to identify attackers and collect evidence of their nefarious activities.


    By analogy, an IDS does for a network what an antivirus software package does
    for that system: it inspects the contents of network traffic to look and deflect
    possible attacks, just as an antivirus software packages the contents of incoming,
    e-mail attachments, active Web content, and so forth to look for virus signatures
    (patterns that match malware) or for possible malicious actions (patterns of behavior
    that are at least suspicious, if not downright unacceptable).


    To be more specific, intrusion detection means detecting unauthorized use of or
    attacks upon a system or network. IDS is designed to detect such attacks or unauthorized
    use of systems, networks, and related resources, and in many cases to deflect
    or determine them if possible. Like firewalls, IDSees can be software-based or
    can combine hardware and software in the form of preinstalled and preconfigured
    stand-alone IDS devices. IDS software may run on the same devices or servers where
    firewalls, proxies, or other boundary services operate, though separate IDS sensors
    and managers are more popular. Nevertheless, an IDS not running on the same device
    or where the firewall or other services are installed will monitor those devices
    with particular closeness and care. Although such devices tend to be deployed
    at network peripheries, IDSees can detect and deal with insider attackers as well
    as external attacks, and are often very useful in detecting violations of security
    policy and internal threats.


    You are likely to encounter several kinds of IDSees in the field. First, it is
    possible to distinguish IDSees by the kinds of activities, traffic, transactions,
    or systems they monitor. IDSees that monitor network links and backbones for attack
    signatures are called network-based IDSees, whereas those that operate on host
    and defend the operating and file systems for signs of intrusion are called host-based
    IDSees. Groups of IDS functioning as remote sensors and reporting to a central
    management station are known as distributed IDSees (DIDSees). A gateway IDS is
    a network IDS deployed at the gateway between your network and another network,
    monitoring the traffic passing in and out of your network at the transit point.
    IDSees that focus on understanding and parsing application-specific'
  merge: -1
  pgno: 136
- img_proc: true
  md: '# Introducing Intrusion Dectection and Smart • Chapter 4


    traffic with regard to the flow of application logic as well as the underlying
    protocols are often called application IDSes.


    In practice, most commercial environments use some combination of network-, host-,
    and/application-based IDSes to observe what is happening on the network while
    also monitoring key hosts and applications more closely. IDSes can be distinguished
    by their differing approaches to event analysis. Some IDSes primarily use a technique
    signature detection to recognize and infected files, programs, or active Web content
    from entering a computer system, except that it use a database of traffic or activity
    patterns related to known attacks, called attack signatures. Indeed, signature
    detection is the most widely used approach in commercial IDS technology. Another
    approach is called anomaly detection. It uses rules or predefined concepts “normal”
    and “abnormal” system activity (called heuristics) to distinguish anomalies from
    normal system behavior and to monitor, report, or block anomalies they occur.
    Some anomaly detection IDSes implement user profiles. These profiles are baseline
    of normal activity and can be constructed using statistical sampling, rule-based
    approaches, or neural networks.


    Hundreds of vendors offer various forms of commercial IDS implementations. Most
    effective solutions combine network- and host-based IDS implementations. Likewise,
    the majority of implementations are signature-based, with limited anomaly-based
    detection capabilities present in specific products or solutions. Finding, most
    modern IDSes include some limited automatic response capabilities, that these
    usually concentrate on automated traffic filtering, blocking, or disconnects as
    a last resort. Although some systems claim to be able to launch counterstrikes
    against attacks, best practices indicate that automated identification and back-trace
    facilities are the most useful aspects that facilities provide and are those most
    likely to be used.


    IDSes are classified by their functionality and loosely grouped into the following
    three main categories:


    +   - Network-based intrusion detection system (NIDS)

    - Host-based intrusion detection system (HIDS)

    - Distributed intrusion detection system (DIDS)


    # How an IDS Works


    We''ve already touched on this some degree in our survey of the different kinds
    of IDSes out there, but let''s take a look at exactly what makes an IDS tick.
    First, you have to understand what the IDS is watching. The particular kinds of
    data input will depend on the kind of IDS (indeed, what sorts of information an
    IDS watches is one of the hallmarks used to classify it), but in general there
    are three major divisions:'
  merge: -1
  pgno: 137
- img_proc: true
  md: '# Chapter 4 • Introducing Intrusion Dectection and Snort


    +   - Application-specific information such as correct application data flow

    - Host-specific information such as system calls used, local log content, and
    file system permissions

    - Network-specific information such as the contents of packets on the wire or
    hosts known to be attackers


    A IDS may watch any or all of these, depending on what kinds of IDSes remote sensors
    are. The IDS can use a variety of techniques to gather this data, including packet
    sniffing (generally in promiscuous mode to capture as much network data as possible),
    log parsing for local system and application logs, system watching in the kernel
    to regulate the activate behavior of local applications, and file system watching
    in order to detect attempted violation of permissions.


    After the IDS has gathered the data, it uses several techniques to find intrusions
    and intrusion attacks. Like firewalls, the IDS is set to recognize a known-good
    or a known-bad policy. With the former technique, the many of anomaly detection
    engines embrace this model, triggering alerts when anything outside of a defined
    set of statistical parameters occur. Some complex protocol models also operate
    on known-good policies, defining the kinds of traffic that the protocol allows
    and alerting on anything that breaks that mold. Language-based models for application
    logic also tend to be structured as known-good policies, alerting on anything
    not permitted in the predefined structure of acceptable application or operation
    flow.


    Known-bad policies are much simpler, as they do not require a comprehensive model
    of allowed input, and alert only on data or traffic known to be a problem. Most
    signature-based IDS engines work with a known-bad model, with an ever-expanding
    database of malicious attack signatures. Known-good and known-bad policies can
    work in conjunction within a single IDS deployment, using the known-signature
    detection and the known-good pro-tocol anomaly detection to find more attacks.


    Finally, we should consider what the IDS does when it finds an attempted attack.
    There are two general categories of response: passive response, which may generate
    alerts or log entries but does not interfere with or manipulate the network traffic,
    and active response, which may send reset packets to disrupt Transmission Control
    Protocol (TCP) connections, drop traffic if the IDS is inline, adding the attack
    to block lists, or otherwise actively interact with the flow of dubious activity.


    Having outlined these principles in the abstract, let''s take a look at some real
    network-based attacks.


    # What Will an IDS Do for Me?


    The strengths of IDSes are their capability to continuously watch packets on your
    network, understand them in binary, and alert you when suspicious matches matches
    a sigma'
