    # Full Install


    The full install is the traditional method to a system''s hard disk. Unlike Windows,
    you boot up an install CD and walk through a guided installation. Most of the
    Linux distributions installed on the hard disk offer graphical user interface
    (GUI) programs that walk you through the installation steps. There is no great
