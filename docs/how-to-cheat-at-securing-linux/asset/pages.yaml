  md: '# Introducing Intrusion Detection and Snort • Chapter 4


    ture occurs. Unlike human analysts, the speed of IDS detection allows alerting
    and response almost immediately, even if it''s 3 A.M. and everyone''s sleeping.
    The alerting capability of IDS can allow you to page people and wake them up,
    or, if you''re deploying an IDS online or intrusion prevention system [IPS], block
    the suspicious traffic, and potentially other traffic from the attacking host.)
    An IDS can allow to read gigabytes of logs daily, looking for specific issues
    and violations. The enhancement of computing and analysis is tremendous, and a
    well-tuned IDS will act as a force multiplier for a competent system/network administrator
    or security person, allowing them to monitor data from more systems. By letting
    you know quickly when it looks like you are under attack, potential compromises
    may be prevented or minimized.


    It is important to realize that IDS is likely to create tremendous amounts of
    data not matter how well you tune it. Without tuning, most IDS will create so
    much data and so many false positives the analysis time may swamp response to
    the legitimate alerts in a sea of false alerts. A new IDS is almost like a new
    baby—it needs lots care and feeding to be able to mature in a productive and healthy
    way. If you don''t tune your IDS, you might not have it.


    Another positive feature of an IDS is that it will allow the skilled analyst to
    find subtle trends in large amounts of data that might not otherwise noticed.
    By noticing correlation between alerts and hosts, the IDS can show patterns that
    might not have been noticed through other means of network analysis. This is one
    example of how an IDS can supplement your network defenses, working cooperatively
    to enact a defense-in-depth strategy.


    # What''''t an IDS Do for Me?


    No IDS will replace the need for staffers knowledgeable about security.You''ll
    need skilled analysts to go through those alerts that the IDS produces, determining
    which are real threats and which are false positives. Although the IDS can gather
    data from many devices on a network-segment, they won''t understand the ramifications
    of threats to each machine, or the importance of every server on the network.
    You need clever, savvy people to take action on the information that the IDS provides.


    In addition, no IDS will catch every single attack that occurs, or prevent people
    from trying to attack you. The limitations of any kind of IDS and the timing between
    the development of new attacks or the ability to hide within acceptable parameters
    of an anomaly-based system make it exceedingly likely that there will be a small
    window in which 0-day attacks will not be detected by a given IDS. The Internet
    can be a cruel and hostile place, and although it is advisable to implement strong
    network defenses and prepare to be attacked, IDSes cannot psychically make people
    decide not to attack your network after all. In most cases, an IDS will not prevent
    attacks from succeeding automatically, as its function is primarily to detect
    and alert. There are some mechanisms that'
