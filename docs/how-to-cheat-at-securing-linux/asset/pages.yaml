  md: '# Figure 9.13 Lokkit Customization Screen


    ![](img/b38c01d2fda8509e8449e32f876ae148_315_0.png)


    If you attempt to configure an interface for MASQUERADE, it must also be marked
    as trusted or Lokkit will generate an error. Bear in mind that although MASQUERADE
    is limited, it has enough flexibility to configure a firewall similar to a typical
    home firewall/router device. This makes Lokkit a handy little utility to have
    in your repertoire should you need to configure a simple firewall quickly. The
    value of this utility is increased, because it is available for a wide number
    of Linux distributions.


    # Firestarter


    Firestarter is a GUI front for netfilter and iptables, and its goal is to make
    it simple for the average user to configure their firewall and protect themselves.
    Firestarter runs on many Linux distributions and the installation is supported
    by many automated package management systems (such as yum, apt-get, and portage).
    Firestarter is an excellent choice if your needs are relatively simple for your
    firewall configuration. To install manually, downloaded from www.fs-security.com/download.php.
    Once it is installed, the first time you start the GUI interface you will need
    to perform some initial configuration. Follow these steps to configure firestarter:


    +   Start the Firestarter GUI. In Fedora Core 5 this is done by navigating to
    Applications | System Tools | Firestarter. This will start the Firewall wizard.
    Click Forward on the Welcome to Firestarter screen.'
