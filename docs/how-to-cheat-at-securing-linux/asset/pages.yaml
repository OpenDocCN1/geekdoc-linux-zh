  md: '+   **Commands** These are specific uppercase options on the command line to
    manipulate the rules themselves, for example, -A to append a rule to a chain,
    -D to delete a rule from a chain, and so on.


    +   **Options** These are used to specify options for the rule-matching criteria,
    such as -s for source address and -p to specify the protocol to.


    Certain tables process certain chains by default. The one we focus on for a bastion
    host is the filter table. If you do not specify what table to use when adding
    rules ( -t <table>) the default is to assume you are working with the filter table.
    The filter table processes the FORWARD, INPUT, and OUTPUT chains by default. Referring
    to the chain list, you can see that the target for the built-in chains is to jump
    to the custom-created chain RH-Firewall-1-INPUT.This means all packets traversing
    the system will go through the same chain. You don''t have to set it up this way.
    In jumping out to custom chains back to the built-in chains can be much more efficient.
    For an example, let''s suppose that you have a long list of rules that only need
    to be checked against traffic to or from the accounting subnet. Now let this list
    on its own chain called ACCOUNTING. You can make a single rule that matches the
    accounting subnet and jumps into the ACCOUNTING chain containing the lengthy list
    of rules. In this way the majority of your traffic is only checked against the
    single rule matching the accounting subnet instead of the entire list of rules
    found in the ACCOUNTING chain.


    The page for IPTables contains a wealth of knowledge, and the IPTables Web site
