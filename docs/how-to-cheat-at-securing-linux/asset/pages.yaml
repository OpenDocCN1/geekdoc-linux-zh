    # Protocol Dissection


    Now that we''ve reviewed many of the critical portions of layers 1 through 4 of
    the OSI networking model, some attention should be paid to some of the protocols
    that you may run across while using Wireshark. The larger the network that you
    are sniffing, the more types of protocols (and protocol anomalies) you are likely
    to encounter.


    # DNS


    The DNS translates hostnames to IP addresses, and vice versa. Most DNS traffic
    is forwarded over UDP port 53 in a client/server fashion. DNS can be considered
    forward or reverse. Forward DNS translates a hostname to an IP address, and reverse
    DNS translates an IP address to a hostname. On the protocol level, forward and
    reverse lookups are nearly identical.


    To get an IP address from a given hostname, a DNS system (also known as a resolver)
    requests an (A) record from a DNS server. In the following example, we use the
    authoritative name server for the IP address of www.example.com. In tcpdump format,
    we see the following:


    ```

    IP 192.168.0.1.33141 > 192.0.34.43.53: 42827+ A? www.example.com.

    IP 192.0.34.43.53 > 192.168.0.1.33141: 42827*- 1/2/2 A 192.0.34.166

    ```'
