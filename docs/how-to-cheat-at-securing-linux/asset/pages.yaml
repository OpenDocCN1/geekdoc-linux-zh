    changes from the command line, you could:


    ```

    iptables -A INPUT -p tcp -m state --state NEW --dport 22 -j ACCEPT

    ```


    This would tell the firewall to append (-A) rule to the INPUT chain. It will match
    the TCP protocol (-p) and look for state to be a newly initiated connection (-m
    state --state NEW). When all is true and the destination port (-dport) is 22,
    it will ACCEPT (-j ACCEPT). Remember, the INPUT chain is one of the built-in chains;
    yours might be different. In the case of Fedora Core 5, checking the box in the
