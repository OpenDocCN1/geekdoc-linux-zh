  md: '# Chapter 2 • Hardening the Operating System


    on the network. Scanlogd can alert an administrator when the network is being
    mapped, but it cannot stop the intrusion.


    # SECURITY ALERT!


    Scanlog was originally designed to illustrate attacks, not to fix them.

    Therefore, even though it is safe to run on your system, it does not prevent hacking
    attacks. You must read the system log to discover what happened to your system,
    and then determine the appropriate solution.


    Scanlog writes one line per scan using the syslog(3) mechanism. It also logs when
    a source address sends many packets to different ports in a short amount of time.
    You can learn about scanlog and download the program at openwall.com/scanlogd.
    The scanlog home page is shown in Figure 2.23.


    # Figure 2.23 Scanlog Home Page


    ![](img/b38c01d2fda8509e8449e32f876ae148_74_0.png)


    scanlog is a TCP port scan tool, originally designed to illustrate various attacks
    an IDS developer has to deal with, for a Phrack Magazine article (see below).
    Unlike some of the other port scan tools out there, scanlog is designed to be
    totally safe to use.


    This release of scanlog can be built with support for several packet capture interfaces.
    In addition to the raw socket interface on Linux (which does not require any libraries,
    scanlog is now using libids and libpcap.


    The use of libpcap also is deared. If you''re on a system other than Linux and/or
    to monitor the traffic of an entire network at once, you should be using libids
    in order to handle fragmented packets.


    Please read the scanlog(8) manual page and the original Phrack Magazine article.


    Because scanlog is only meant to detect scans, it is totally safe to run on your
    system. It must have access to raw IP packets to function, and can capture packets
    coming in and out'
