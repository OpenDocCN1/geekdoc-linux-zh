    # Handling Maintenance Issues


    +   - After your system goes live, you must always maintain it by making sure
    the most current patches and errata are installed, which includes the fixes, corrections,
    and updates to the system, as well as the applications running on it.


    +   - You should always check the Red Hat or the appropriate vendor site for the
    latest errata news and security advisories.


    +   - For example, Red Hat security advis provide updates that eliminate security
    vulnerabilities on the system. Red Hat recommends that all administrators download
    and install the security upgrades to avoid deny-of-service (DoS) and intrusion
    attacks that can result from these weaknesses.


    # Manually Disabling Unnecessary Services and Ports


    +   - You should always disable vulnerable services and ports on your system that
    are not used. You are removing risk when you remove unnecessary services.


    +   - The /etc/xinetd.d directory makes it simple to disable services that your
    system is not using. For example, you can disable the FTP and Telnet services
    by commenting out the FTP and Telnet entries in the respective file and restarting
    the service. If the service is commented out, it will not restart.


    # Locking Down Ports


    +   - When determining which ports to block on your server, you must first determine
    which services you require. In most cases, block all ports that are not exclusively
    required by these services.


    +   - To block TCP/UDP services in Linux, you must disable the service that uses
    the specific port.


