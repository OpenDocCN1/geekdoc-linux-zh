- img_proc: true
  md: '# Chapter 10 • Linux Bastions Hosts


    Linux distribution as a bastion host is technical support. Some distributions,
    such as Red Hat Enterprise, are available with full technical support, which can
    be a major consideration for a corporate bastion host.


    # Note


    Red Hat is one of the oldest Linux distributions that is still active. The naming
    of Red Hat Enterprise Linux servers can be confusing. Red Hat Enterprise Linux
    (RHEL) is the commercial product that includes various levels of technical support.
    It comes in a few flavors, such as RHEL WS (appropriate in a workstation role),
    RHEL AS (which contains advanced server functionality such as database support
    or an application server) and RHEL ES (appropriate in a small to medium-sized
    server). See www.redhat.com/rhel/compare/ for more information. To further muddy
    the waters, the Fedora Core distribution is basically the same software as RHEL
    but without any support. Fedora Core is the freely downloadable consumer version.
    See http://fedora.redhat.com/ for information and downloads.


    Once you have selected your preferred distribution, you should go through the
    installation process. If you are presented with choices to install additional
    software, select No. We want to keep things to a minimum because our next steps
    will be removing any unnecessary software. The following steps assume you have
    the base Linux operating system installed and functional. I used the latest Fedora
    Core distribution for screenshots (V5) with the default GNOME window manager,
    but the procedures should be similar for most distributions.


    # Removing Optional Components


    Windows has been the target of much scrutiny and ridicule for the size of its
    installation. Typically, Linux is seen as sleek and efficient. Well, this is partially
    true. The fact is out of the box, if you don''t care to remove components, Linux
    can be pretty bloated. The default install of Fedora with none of the high-level
    optional software categories selected was just of 2GB, which isn''t all slim.
    The key difference between Linux and Windows is that with Linux you can remove
    or disable unwanted components (even including parts of the kernel itself) and
    strip the system down to a very lean and efficient machine. By contrast, tampering
    with the core OS files in Windows isn''t really an option for most people.'
  merge: -1
