    # nmap: Speed Options


    nmap allows the user to specify the "speed" of the scan, or the amount of time
    from probe sent to reply received, and therefore how fast packets are sent. On
    a fast LAN, you can optimize your scanning by setting the -T option to 4, or Aggressive,
    usually without dropping any packets during sending. If you find that a normal
    scan is taking very long due to ingress filtering, or a firewall device, you may
    want to Enable Agile scanning. If you know that an IDS sits between you and the
    target, and you want to be as stealthy as possible, then using -T0 or Paranoid
    should do what you want; however, it will take a long time to finish a scan, perhaps
    several hours, depending on your scan parameters.'
