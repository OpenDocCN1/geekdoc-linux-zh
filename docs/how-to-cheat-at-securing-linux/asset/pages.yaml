  md: '# Summary


    This chapter provided practical knowledge of the open-source IDS called Snort,
    and how it can help you with your security concerns. You learned about the history
    of Snort, how the Snort architecture works, and system requirements.


    Additionally, you learned about Snort''s different uses, including using Snort
    as a packet sniffer, a packet logger, and an IDS. You also learned about pitfalls
    with Snort, including false positives.


    Finally, this chapter also touched on security issues that you should consider
    when running a Snort system. It''s critical to keep the system as secure as possible,
    especially as an active packet logger or IDS.


    # Solutions Is Fast Track


    # What Is Snort?


    +   - Snort is a packet sniffer, a packet logger, and a network IDS.

    - We highly recommended having a large hard disk for data storage. Additionally,
    it is recommended to have two network interfaces on the system: one to run in
    promiscuous mode and the other for typical network connectivity (for example,
    SSH and HTTPS).


    # Exploring Snort’s Features


    +   - Snort''s major components are the preprocessor, the detection engine, and
    the alert/logging components. All of Snort''s components are implemented as plug-ins
    to increase flexibility.

    - The preprocessor is used to take the packet data and process it before the data
    gets checked against the rules in the detection engine.

    - The detection engine works by checking the data in each packet against a ruleset.
    Snort comes with a standard set of rules, but administrators can write their own
    as well.

    - The alert/logging component takes the output of the data after it gets checked
    against the ruleset. The data can go straight into a log file in text or binary
    (TCPDump data) format. In addition, the data can be stored in SQL databases or
    be sent over the network through SNMP traps or WinPopup messages.'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# Using Snort on Your Network


    +   - Snort can be used in various ways on your network.You can use it as a packet
    sniffer or as a packet logger in addition to for network intrusion detection.


    +   - Snort can write packets in both text and binary mode. Binary mode is also
    known as TCPDump data format.This is not human readable, but is a standard that
    Snort, TCPDump, and Ethereal all use to read and write network data. In addition
    to writing data, Snort can also filter the data to human-readable format from
    the binary format.


    +   - Snort as an IDS needs to go on each of the private subnets you plan to monitor.
    It also helps to be able to place a Snort system behind the screening router as
    well.


    # Security Considerations with Snort


    +   - Like any other application, Snort is subject to security vulnerabilities,
    including buffer overflows and DoS attacks.


    +   - Snort should be upgraded on a regular basis to keep up-to-date with the
    latest signatures and the latest bug fixes with the application itself.


    +   - In addition to securing the Snort application, you also need to secure the
    OS. This includes disabling unnecessary services, regularly applying patches,
    and proper configuration. It also includes encrypting sensitive traffic, such
    as login sessions with SSH and HTTP traffic with SSL.'
