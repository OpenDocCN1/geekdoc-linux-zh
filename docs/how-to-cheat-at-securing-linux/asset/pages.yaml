- img_proc: true
  md: '# Introduction


    When it comes to securing networks, the first items that come to mind are firewalls,
    which are the primary gatekeepers between an organization’s internal network and
    the outside world. While a properly implemented firewall can be one of the most
    effective security tools in your arsenal, it shouldn''t be the only tool. The
    adage “defense-in-depth” means that you should have multiple layers of security.
    Using a defense-in-depth configuration, if one component of your defense failed
    or was defeated, there would still be a variety of other fallbacks to protect
    your network. With the availability of increasingly affordable firewalls such
    as popular Linksys cable/digital subscriber line (DSL) router, using the free
    alternatives may not be as attractive as some. With a little effort, however,
    you will find the free alternatives are more configurable, allowing greater flexibility
    and control than the “home office” grade offerings.


    This chapter focuses on securing your network perimeter. Remember that although
    the most common way to implement a firewall is between an internal network and
    the outside world (the Internet), you should not limit yourself to placing firewalls
    only on the network edge. A firewall should be in any place you want to restrict
    the flow of traffic. The current trend of security breaches originating from the
    inside of the network (often employees or ex-employees) are increasingly relying
    on firewalls to isolate and filter traffic between portions of the internal network.


    This chapter reviews some basic firewall concepts and briefly discusses the different
    architectural ways to implement a firewall. The meat of this chapter discusses
    the installation and configuration of free firewalls to run on your Linux-based
    systems. Finally, once the network edge has been adequately secured, we discuss
    how to create controlled, secure paths through the perimeter for remote connectivity,
    including administrative access or remote office/work from home scenarios.


    # Firewall Types


    This firewall is particularly true in this context, as it allows you to better
    understand exactly where in the spectrum the free firewall offerings lie. In the
    networking sense, a firewall is basically any component (software or hardware)
    that restricts the flow of network traffic. This is a sufficiently broad definition
    to allow for all of the various ways people have been chosen to implement firewalls.
    Some firewalls are notoriously limited in capability and others are extremely
    difficult to use.


    Within the realm of firewalls there are many different ways to restrict network
    traffic. Most of these methods vary in the level of intelligence that is applied
    to the decision-making process. For example, to permit or deny traffic based on
    which network device is the sender or recipient, you would use a packet-filtering
    firewall. In reality, even the simplest'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9


    packet filtering firewalls can typically make decisions on the source Internet
    Protocol (IP) address, the destination IP address, and the source and/or destination
    port number. While this type of firewall may sound overly simplistic, consider
    if you have a server running a Web site for the Internet. In all likelihood, the
    only traffic you need to allow the server uses a destination port of Transmission
    Control Protocol (TCP) 80 or 443; thus, you could configure your firewall to permit
    only that traffic. These ports are used for HTTP and HTTPS, respectively Because
    the server is available for the Internet, you cant filter traffic based on the
    source address or source port, which will be different for each connection.


    The drawback with using a simple packet filter is that the packet filtering firewall
    has rely on very primitive means to determine when traffic should be allowed (e.g.,
    synchronous [SYN] or acknowledgement [ACK] bits being set). While this was adequate
    in the early days of the Internet when security was not big of a concern, it won''t
    work anymore. It is trivial to set the bits on the packet using freely available
    software to make the traffic look like it is a reply to another connection. The
    stateful inspection firewall was born of necessity. This type of firewall monitors
    all connections (inbound or outbound), and as the connection is permitted (based
    on the firewall''s configured rules) it enters this connection into a table. When
    the reply to this connection comes back, even if the reply uses a port that was
    not previously permitted to configure, it can intelligently recognize the traffic
    as a response to a permitted session and permit the traffic.


    Unfortunately, the firewalls get better so the methods hackers use to circumvent
    them. There are no holes: every permitted port is one you expressly want to allow.
    Using the previous example, no traffic is allowed to the Web server except Web
    traffic. Sounds good, but the problem is, if the firewall is completely secure,
    the server might not be. Flaws in the Web server software could allow the attacker
    to send a HTTP request that is 10,000 characters long, overflowing the buffers
    and allowing the attacker to execute the code of his choice. The packets used
    to transport the 10,000-character HTTP request are all legal TCP packets as the
    firewall is concerned; therefore, it would permit this to pass through to the
    Web server. The next step in firewall evolution serves to combat this type of
    attack. These types of firewalls are application gateways, or layer 7 firewalls.


    This type of firewall not only filters network traffic based on the standard network
    parameters, but they also understand the higher layer protocol information contained
    within the packet, in this example HTTP. The firewall itself knows what a legitimate
    HTTP request looks like and can filter out a malformed or malicious request even,
    from a network perspective, which might be a permitted packet. There is a down
    side to this type of approach, which is that the firewall must be programmed with
    all the same intelligence needed to filter normal traffic, plus the firewall fully
    understand the protocols it is inspecting. This means additional programming for
    any protocol you will want the firewall to understand. Most of the major commercial
    application gateways offer support for the major'
  merge: -1
  pgno: 287
- img_proc: true
  md: 'protocols such as HTTP, File Transfer Protocol (FTP), and Simple Mail Transfer
    Protocol (SMTP).


    With all of this information circulating in your head, you are probably wondering
    which type is available for free? Generally speaking, you can find free varieties
    of firewalls that perform some type of state inspection. Application layer gateways
    are not readily available for free. In reality, few organizations have the funds
    to use application gateways extensively. One ramification of not using an application
    gateway is that you need to ensure that the service that is exposed to untrusted
    traffic is configured as securely as possible and that the server itself is hardened
    against attack. Keeping the service patches up-to-date will help reduce the odds
    that an application-level attack will be successful.


    # Firewall Architectures


    The most configured firewall in existence will not provide much protection if
    a network was not designed properly. For example, if the firewall was installed
    into an environment that allows an alternate network path that bypasses the firewall,
    the firewall would only be providing a false sense of security.This is an architectural
    error that would render the firewall useless. In short, where the firewall is
    implemented is every bit as important as how it is implemented. The first step
    to installing anything is always planning. What follows is a discussion of the
    most common firewall architectures, in increasing order of security. Remember,
    these sections are discussing firewall architectures independent of the firewall
    type. For example, you could use a packet-filtering firewall, a stateful inspection
    firewall, or an application gateway in any of the designs discussed in the next
    section.


    # Screened Subnet


    A screened subnet is the simplest and most common firewall implementation. Most
    small businesses and homes use this type of firewall (see Figure 9.1).This design
    places the firewall on the edge of your network, dividing everything (from the
    firewall''s point of view) into internal and external, with nothing in between.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Figure 9.1 Screened Subnet Firewall


    ![](img/b38c01d2fda8509e8449e32f876ae148_289_0.png)


    The screened subnet firewall (or edge firewall) is as straightforward as you can
    get. Internet users who need access to an internal server (e.g., Web, FTP, SMTP,
    and so on) must traverse the firewall to do so. Internal users needing access
    to those same servers would be able to access them directly. Internet traffic
    not destined for any Web-based server would be blocked at the firewall to prevent
    attacks on internal systems. All internal users must also traverse firewalls to
    access the Internet. This is the same type of firewall architecture you would
    have at home with a small network behind a Linksys router. This configuration
    has several advantages. The primary advantage is simplicity. With only two interfaces,
    the Access Control Lists (ACLs) (the filters that define the criteria for permitting
    or denying traffic) are much simpler.


    Although this configuration is effective and simple to implement, it is not without
    its drawbacks. In addition, the hacker has several chances to penetrate your network.
    If he or she can find a security hole in the firewall, or if the firewall is improperly
    configured, he or she might be able to gain access to the internal network. Even
    if the firewall is executed flawlessly, the hacker has a second opportunity to
    gain access. If the hacker can compromise any available Web-based services and
    take control of the servers, he or she would then have an internal system to launch
    additional attacks. Finally, if the servers are critical to the business function,
    by allowing internal users to access them without going through the firewall,
    you may loose some audit capability that the firewall might otherwise offer. By
    far the biggest security weakness in this configuration is that you are exposing
    any Web-based services: the servers hosting those services will be attacked frequently,
    and a compromise of one of those servers may expose your entire network.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# One-Legged


    The one-legged demilitarized zone (DMZ) still has the advantage of cost, because
    you are building a DMZ using only a single firewall (see Figure 9.2). Commonly,
    the firewall interfaces are called Internal or Inside, External or Outside, and
    DMZ. (See Chapter 10 for details on configuring a Linux Bastion server.)


    # Figure 9.2 One-legged DMZ


    ![](img/b38c01d2fda8509e8449e32f876ae148_290_0.png)


    With this type of configuration you get to keep the low cost benefit, but add
    some isolation to your Internet-based servers. Internal users must traverse the
    firewall to access the servers or the Internet. External users must traverse the
    firewall to access the Web-based servers. The real strength of this configuration
    is that if the servers are hosting the Web-based services are compromised, the
    hacker still needs to contend with the firewall to continue attacking the internal
    network. As an added feature, because all users (internal or external) must traverse
    the firewall to access the Web-based servers, you may gain a higher degree of
    auditing from the firewall logs. If you wanted to provide even further isolation,
    assuming you have the available interfaces on the firewall, you could implement
    a separate DMZ for each Web-based server you needed.


    The only disadvantages to this configuration are complexity, and to a small degree,
    cost. As you add interfaces to the firewall, the configuration will become more
    complex. Not'
