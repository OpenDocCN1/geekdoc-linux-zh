    # HTTP


    HTTP is the most widely used protocol that supports the web. HTTP uses TCP to
    transmit data exclusively, and in a default configuration it uses port 80. Each
    object (e.g., Web page, image, audio) fetched from a Web server is transmitted
    via an individual HTTP session.


    To begin an HTTP session, a client establishes a regular TCP connection on port
    80 and sends a packet with the SYN flag set. A packet is returned from the Web
    server, with an ACK flag added to the SYN flag. Finally, the client sends a packet
    with the ACK flag set, and then sends another packet requesting a specific HTTP
    object.


    The following is an example of a client''s request to a HTTP server:


    ```

    GET /index.html HTTP/1.1

    ```


    The client requests the index.html page using HTTP v1.1:


    ```

    Host: www.example.com

    ```'
