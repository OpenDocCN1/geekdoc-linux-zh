  md: '# Chapter 4 • Introducing Intrusion Dection and Snort


    if there''s no preprocessor or signature written to cover them yet. This is one
    of the primary reasons why it''s important to keep your rules as up-to-date as
    possible—you stand a greater chance of detecting attacks if you have the most
    recent rules. Because rules actively developed as new attacks show up on the Internet,
    Snort''s detection capabilities continually improve in response to the evolution
    of new attacks.


    # Snort''s Uses


    Snort has three major uses:


    +   - A packet sniffer

    - A packet logger

    - An NIDS


    All the rules relate to each other in a way that builds on each other. However,
    it''s easiest to put the packet sniffer and the packet logger together in the
    same category—basically, it''s the same functionality. The difference is that
    with the logging functionality, you can save the packets into a file. Conversely,
    you can read the packet logs with Snort as well.


    # Using Snort as a Packet Sniffer and Logger


    In its simplest form, Snort is a packet sniffer. That said, it''s the easiest
    way to start. The command-line interface for packet sniffing is very easy to remember:


    ```

    # snort -d -e -v

    ```


    Note that the -v option is required. If you run Snort on a command line without
    any options, it looks for the configuration file (.snortrc) in your home directory.
    Snort configuration files are discussed in Chapter 5.


    Table 4.2 lists Snort options and their function.


    | Option | What It Does |

    |---|---|

    | -v | Put Snort in packet-sniffing mode (TCP headers only) |

    | -d | Include all network layer headers (TCP, UDP, and ICMP) |

    | -e | Include the data link layer headers |


    You cannot use options -d and -e together without also using the -v option. If
    you do, you get the same output as you use snort without any options:


    ```

    florida:/usr/share/doc/snort-doc# snort -de

    Log directory = /var/log/snort

    ```'
