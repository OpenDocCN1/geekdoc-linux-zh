  md: '# Network Analysis, Troubleshooting, and Packet Sniffing • Chapter 7


    # Summary


    Network analysis is the key to maintaining an optimized network and detecting
    security issues. Proactive management can help find issues before they turn into
    serious problems and cause network downtime or compromise confidential data. In
    addition to identifying attacks and suspicious activity, your network analyzer
    can be used to identify security vulnerabilities and weaknesses and enforce your
    company''s security policy. Sniffer logs can be correlated with IDSes, firewalls,
    and router logs to provide evidence for forensics and incident handling. A network
    analyzer allows you to capture data from the network (packet-by-packet), decode
    the information, and view it in an easy-to-understand format. Network analyzers
    are easy to find, free and easy to use; they are a key part of any administrator''s
    toolbox.


    This chapter covered the basics of networking, Ethernet, the OSI model, and the
    hardware that is used in a network architecture; however, it only scratched the
    surface. A good networking and protocol reference should be on every administrator''s
    bookshelf. It will come in handy when you discover some unknown or unusual traffic
    on your network.


    As an administrator, you should know how to detect the use of sniffers by intruders.
    You should keep up-to-date on the methods that intruders use to get around security
    measures that are meant to protect against sniffing. Always, you also need to
    make sure that your computer systems are up-to-date with patches and security
    fixes to prevent rootkits and other backdoors.


    This chapter also a variety of methods used to protect data from eavesdropping
    sniffers. It is important to remain up-to-date on the latest security technologies,
    encryption algorithms, and authentication processes. Intruders are constantly
    finding ways to defeat current security practices, thus more powerful methods
    are developed (e.g., cracking the Data Encryption Standard [DES] encryption scheme
    and its subsequent replacement with Triple Data Encryption Standard (3DES), followed
    by the Advanced Encryption Standard (AES).


    Finally, remember the rule of network analysis—only do it if you have permission
    and the law is on your side. A curious, up-and-coming administrator could easily
    be mistaken for an intruder. Make sure you have permission, or use your own private
    network to experiment.


    # Solutions Fast Track


    # What is Network Analysis and Sniffing?


    +   - Network analysis is capturing and decoding network data.

    - Network analyzers can be hardware or software, and are available both free and
    commercially.

    - Network analyzer interfaces usually have three panes: Summary, Detail, and Data.'
