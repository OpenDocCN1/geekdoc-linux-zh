    # Protecting Against Sniffers


    +   - Switches offer little protection against sniffers.


    +   - Encryption is the best method of protecting your data from sniffers.


    +   - SSH, SSL/TLS, and IPSec are all forms of VPNs that operate at various layers
    of the OSI model.


    +   - IPSec tunnel mode can protect the source and destination addresses in the
