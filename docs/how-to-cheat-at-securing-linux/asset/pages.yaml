  md: '# Choosing Distribution Media


    You can find distributions that are capable of running off off a CD-ROM, full
    installs to the systems hard disk, and distributions that can run off a USB drive
    or even a floppy disk. Each media type offers some security pros and cons, and
    not distribution is available on every media. If you need the features of a specific
    distribution that doesn''t come on the media you prefer, you might need to make
    a compromise.Theisions of media type and distribution selection will be made concurrently,
    unless you have very specific requirements.You will need to research the media
    options and choose one that fits your environment; we review some of the pros
    and cons of each type in the following sections.


    # Full Installs


    With the traditional install to the systems hard disk, much like Windows, you
    will boot up an installation CD and walk through a guided install process. Although
    it wasn''t always the case, most of the distributions that are intended to be
    installed to the hard disk offer GUI install programs that are pretty easy to
    get through. There is no great advantage to using this type of distribution other
    than the size of the hard disk will allow you to install a lot of extra software.
    In a DMZ on a bastion host, this isn''t necessarily desirable, and in many cases
    of the smaller, more streamlined distributions would be more appropriate.


    On the down side, this type of install will have all the same disadvantages of
    a Windows bastion host—name; the entire system is sitting on the hard disk, and
    if an attacker manages to compromise the root account, he will be able to install
    a virus or Trojan of the system that can survive future reboots, in addition to
    tampering with the contents of what is running in memory. Typically, if you discover
    that your bastion host has been compromised, unless you have means of ensuring
    that the contents of the hard disk have not been tampered with, you must reinstall
    the entire system from scratch to guarantee the system''s integrity. This type
    of install isn''t really better or worse than if you were using Windows for your
    bastion operating system.


    # CD-ROMs


    There are many versions of Linux designed specifically to run from a CD-ROM, allowing
    you to turn virtually any machine into a firewall, router, or general-purpose
    PC. There is an obvious advantage to having all your configuration information
    on read-only media. If a hacker manages to compromise the system, all it takes
    is reboot and your configuration can be restored to its previous condition. The
    system can still fall victim to a virus or Trojan but until it is rebooted. Further,
    if there is a hardware failure, restoring the system is as difficult as moving
    the CD to a new system and rebooting.


    This same advantage also serves as a disadvantage. If you burn the OS and configuration
    settings to a CD, time you need to make any adjustment you would need to burn
    and load a new CD-ROM disk. The cost of the CD media probably isn''t an issue,'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# Linux Bastion Hosts • Chapter 10


    because CD-ROMs are inexpensive, but such a configuration could hinder your ability
    to remotely administer the system.You would only be able to make changes to the
    running configuration, changes that will remain after a reboot will require someone
    local to burn and swap the CDs. If you needed to implement and test changes that
    required a reboot before they take effect, this type of setup would make things
    a little more difficult. Finally, due to simple space limitations on a CD-ROM,
    you might not be able to fit all the needed software or functionality on CD. All
    being said, if the role of your bastion host allows the configuration and data
    to be relatively static, a live CD could be a very attractive option.


    # USB Drives


    A Linux bastion booting from a USB disk could offer the best compromise in security
    and flexibility. If you purchase a USB disk that includes a physical write-protect
    switch, you can make changes on the fly, as a live system, and write-protect the
    disk against modification when you are done. As the storage capacity of USB drives
    increases, you will be able to use a USB-based distribution that includes increasingly
    greater functionality. Whether you use the micro hard drive version or the solid-state
    USB disk, either will be more reliable than a diskette while offering the same
    benefit of allowing you to toggle the write-protect feature.


    # Diskettes


    Although they probably won''t be able to provide the functionality you are looking
    for in a Linux bastion host, most versions of Linux can fit on a 3.5-inch diskette.
    The primary advantage of these distributions is their very low resource requirements.
    Often these systems require only 8MB or 16MB of memory to function. The ability
    to toggle the write-protect switch on the diskette can also provide a high degree
    of configuration flexibility and security. Considering the unreliable nature of
    diskettes, they probably wouldn''t be appropriate for any critical roles, though.
    Another disadvantage of diskettes is simple functionality. Whereas they can act
    as a simple router or firewall, they typically lack much in the way of features.
    Generally, these diskette-based distributions are single-purpose devices. Due
    to the space restrictions and small footprint, diskette-based distributions are
    almost always command line only, with no GUI for configuration or management.


    # Choosing a Specific Distribution


    In conjunction with the media to be used, you will need to choose the exact Linux
    distribution that you want to employ. This decision can include a host of factors
    such as included features, personal preference, availability of documentation
    and support, and availability of technical support. Some distributions are known
    for being beginner friendly or for supporting better security controls. One of
    the key differentiators for selecting a'
