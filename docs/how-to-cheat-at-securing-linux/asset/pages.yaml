  md: '# SMTP


    SMTP is the mechanism by which most e-mail is sent over the Internet. SMTP uses
    TCP to transmit data exclusively, and in most situations the server use port 25.
    The entire e-mail (headers and contents) is sent in one SMTP session. It is easy
    to emulate a SMTP session using the Telnet program to port 25 of an e-mail server.


    Think of an SMTP connection the same as sending a memo through the regular mail.
    On the outside of the envelope is a return address and a destination. The return
    address and destination might also be repeated inside the envelope, but the mail
    carrier doesn''t care about what is inside the envelope. In an SMTP connection,
    the message envelope is transmitted, first followed by the letter contents inside.


    The following is an example of an SMTP conversation. The client sends in normal
    text, and the server responds in italics:


    ```

    220 example.org SMTP Mail Service

    HELO client.example.com

    250 Ok

    ```


    Upon connection, the server indicates its presence with a banner that includes
    the version of the e-mail server program, but can also be configured by the user
    to be an arbitrary banner, as it begins with the hostname of.server. The client
    says “HELO” to the server, and tells it what it wants to go by. The HELO command
    is also used for clients that support advanced SMTP features such as encryption.
    The server acknowledges the client with an “OK” response.


    ```

    MAIL FROM:<person@example.com>

    ```


    ```

    250 Ok

    ```


    The client sends a MAIL FROM command, indicating the return address, which may
    or not match the letter’s contents.Your Mail User Agent or e-mail reader normally
    shows the address in the letter, disregarding the envelope.


    ```

    RCPT TO:<anotherperson@example.com>

    ```


    ```

    250 Ok

    ```


    The client sends the destination of the envelope and the server acknowledges it.

    At this point, you may see a “Relaying Denied” message, indicating that the server
    will not accept the e-mail. At the beginning of e-mail, systems were free to send
    e-mail directly to each other, or by relaying it through any other system on the
    Internet. However, this arrangement broke down in the 1990s when spam became a
    major issue on the Internet. Most systems now accept e-mail for themselves only,
    and relaying is generally relevant to ISPs.


    ```

    DATA

    ```'
