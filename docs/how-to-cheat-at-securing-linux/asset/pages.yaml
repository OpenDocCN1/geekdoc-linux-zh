    ![](img/b38c01d2fda8509e8449e32f876ae148_111_0.png)


    # RPC Enumeration


    Some services are wrapped in other frameworks, such as Remote Procedure Call (RPC).
    On UNIX-like systems, an open TCP port 111 indicates this. UNIX-style RPC (used
    extensively-by systems like Solaris) can be queried with the rpcinfo command,
    or a scanner can send NULL commands on the RPC-bound ports to enumerate what function
    that particular RPC service performs.


    # Fingerprinting


    The goal of fingerprinting is to determine the operating system version and type.
    There are two common methods of performing system fingerprinting: active and passive
    scanning. The more common active methods use responses to TCP or ICMP packets.
    The TCP fingerprinting process involves setting flags in the header that different
    operating systems and versions respond differently. Usually, several different
    TCP packets are sent and the responses are compared to known baselines (or fingerprints)
    to determine the remote OS. Typically, ICMP-based methods use fewer packets than
    TCP-based methods, and when you need to be more stealthy and afford a less-specific
    fingerprint, ICMP may be'
