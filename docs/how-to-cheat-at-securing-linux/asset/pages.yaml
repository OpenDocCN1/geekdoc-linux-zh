  md: '# Removing SUID Programs


    Programs with the user ID (SUID) bit set will run with the permissions of the
    *owner*, not the user who is executing them. Obviously this could pose a big security
    risk. If an attacker were to locate a script with the SUID bit set and that was
    owned by root, and if the attacker could find a way to modify the script, he could
    do anything he wanted to the system, as he were root. Although a script is the
    most likely target, an attacker could also gain root access if he executed a buffer
    overflow against a binary program with the SUID bit set as well. The same considerations
    hold true for files with the group ID (SGID) bit set. You can create a list of
    all SUID and SGID files by entering the following command:


    ```

    find / -perm -4000 -print

    ```


    To list files with the SGID bit set, use the following command:


    ```

    find / -perm -2000 -print

    ```


    The list may be long, redirecting the output to a file review might be advisable.
    Unfortunately, some programs will not function without having the SUID or SGID
    bits set. Each instance will need to be researched and possibly tested in a lab
    environment to determine whether you can safely remove the bit. In all likelihood,
    either of those bits will be needed on some files, but reducing the number of
    files to a minimum will leave your bastion more secure.


    With all the obvious risks for using SUID and SGID programs, you might be wondering
    if using them is a good idea or simply evil to be lived with. These bits can improve
    security in the right situation. For example, if a user needs to perform a routine
    maintenance action that normally he needs the root password to temporarily gain
    root access and perform the task. By setting the file SUID and having owned by
    root, you can give the user only permissions to execute the file but not modify
    it. Now he can perform the required task without ever knowing the root password.


    # SELinux Policy Development


    SELinux, which stands for *security-enhanced Linux*, was developed in partnership
    with the National Security Agency (NSA). It provides a higher level of security
    by enforcing mandatory access control (MAC) through the kernel itself rather than
    by running additional processes in the user space. Because the enforcement is
    through the kernel, it can restrict the actions of any process, even a superuser
    (i.e., root) process. In fact, as are the underlying components of SELinux are
    concerned, there is no concept of a root user, only security policies and security
    contexts. SELinux is available for many Linux distributions (see which ones at
    http://selinux.sourceforge.net/redhat/php3) and also comes included in, such as
    Fedora Core. You can read the FAQ from the NSA at www.nsa.gov/selinux/info/faq.cfm
    for more information.'
  merge: -1
  pgno: 371
