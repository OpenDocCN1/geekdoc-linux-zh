  md: 'Detection plug-ins are installed exactly the same way as statically built preprocessor
    plug-ins are.


    # Output Plug-Ins


    Output plug-ins, also known as preprocessor plug-ins, run after the Snort detection
    engine. These plug-ins control where the result of the analysis will be sent.
    This can be a log file, a database, or a socket for communicating with another
    process. Currently, these plug-ins have to be statically compiled into Snort when
    it is built; they cannot be dynamically loaded.


    The database plug-ins are particularly useful for using Snort for special purposes.
    They allow most of the useful information about the network activity into an SQL
    database. The information can then be extracted and analyzed by other applications
    or for doing things as a historical analysis of events on your network (e.g.,
    when we did first seeing port 0 probes?).


    The API for output plug-ins is very similar to that of static preprocessor plug-ins.
    They registers modules and functions for the main processing, for a clean exit,
    and one for a restart that must be registered. Documentation and examples for
    the output plug-ins do not explicitly exist, again you will need to look at the
    source code for the standard output plug-ins. It''s really not hard as it sounds;
    if you are comfortable with creating a static preprocessor plug-in, you will have
    no problems with writing an output plug-in if you really need to create a new
    one.


    By appropriately combining custom rules, preprocessing plug-ins, detection plug-ins
    and postprocessing plug-ins, you can create a highly crafted Snort installation
    that can be utilized for many special purposes beyond the stock IDS function that
    it provides.


    # Snort Inline


    Snort is traditionally used as an IDS, but it can also play an active role in
    your network security and be as an intrusion prevention system. Snort must be
    specially compiled to use this mode, and you must be running on a Linux system
    that supports iptables. Once Snort inline is built and installed, you now have
    a system that can act as an integrated IDS and firewall system. When running in
    this mode, you have three additional rule types that you can use.


    The first is drop, which will drop any packet that satisfies the rule. The second
    is reject, which will send a TCP reset or an ICMP unreachable message to the originator
    and drop the packet when the rule is triggered. Both of these forms will log the
