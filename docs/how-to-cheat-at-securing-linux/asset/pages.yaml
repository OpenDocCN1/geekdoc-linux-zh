    # Layer 4: Transport


    Layer 4 is the Transport layer, and is responsible for transporting the data from
    one node to another. It provides transparent data transfer between nodes, and
    manages the end-to-end flow control, error detection, and error recovery.


    The Transport layer protocols initiate contact between specific ports on different
    computers, and set up a virtual circuit. The Transport protocols on each host
    verify that the application sending the data is authorized to access the network
    and that both ends are ready to initiate the data transfer. When this synchronization
    is complete, the data is sent. As the data is being transmitted, the transport
    protocol on each host monitors the data and watches for transport errors. If transport
    errors are detected, the transport protocol provides error recovery.


    The functions performed by the Transport layer are very important to network communication.
    As the Data Link layer provides lower-level reliability and orientation or connectionless
    communications, the Transport layer does the same thing but at a higher level.
    The two protocols most commonly associated with the Transport layer are the TCP,
    which is connection-oriented and the User Datagram Protocol (UDP), which is connectionless.'
