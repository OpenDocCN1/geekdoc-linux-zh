    # Manually Disabling Unnecessary Services and Ports


    As a Linux administrator or a security administrator it is essential for you to
    define the following:


    +   - Role of the server (web, database, proxy, ftp, dns, dhcp or others)

    - Services that are required to perform a specific server role (for example, Apache
    and locking web server)

    - Ports required to be opened (for example, HTTP, port 80)


    All the other services should be disabled and all other ports to be closed. When
    the above tasks are performed, the server becomes a specialized server to play
    only the designated role.

    To harden a server, you must first disable any unnecessary services and ports.
    This process involves removing any unnecessary services, such as the Linux login,
    and locking unnecessary Transmission Control Protocol/User Datagram Protocol (TCP/UDP)
    ports. Once these services and ports are secure, you must regularly maintain the
    system. Figure 2-4 shows Service Configuration in Red Hat Linux.


    System | Administration | Services opens the Service Configuration utility. You
    may select or deselect the services, start, stop or restart and edit the run level
    of individual services. In the Figure 2.4 you may notice the service ‘iptables’
    is enabled, and the Description of the service and status is displayed.'
  merge: -1
