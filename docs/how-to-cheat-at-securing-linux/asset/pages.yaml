  md: '# Advancsned Snort Deployment • Chapter 6


    used typically in a context that is too complex to readily express in terms of
    a rule. Standard Snort includes several preprocessors, such as Frag3, Stream4,
    Flow, Portscan, and several for processing specific protocols (such as HTTP).
    Frag3 is for reconstructing fragmented packets before further analysis. Packets
    become fragmented as a natural consequence of traveling across the network, but
    they can also be fragmented deliberately in an attempt to avoid notice by simpler
    IDSes. Stream4 and Flow are for tracking a connection and following it through
    all the changes in state as it goes from open to closed.


    Writing your own preprocessor plug-ins is actually quite straightforward. For
    the dynamic plugin, there are three functions to write, and one of those is well
    fixed in its forms. The first one registers the initialization function for the
    plug-in to Snort. Let''s walk through the example from the Snort manual.


    ```

    #define DYNAMIC_PREPROC_SETUP ExampleSetup

    extern void ExampleSetup();

    extern DynamicPreprocessorData _dpd;


    void ExampleInit(unsigned char);

    void ExampleProcess(void *, void);


    void ExampleSetup()

    ```


    > * register the init function with Snort */

    dpd.registerPreproc("dynamic_example", ExampleInit\);


    ```

    DEBUG_WRAP(_dpd.debugMsg(DEBUG_PLUGIN, "Preprocessor: Example is setup\n"));

    ```


    Snort knows to call this particular function because the compiled module''s symbol
    table equates DYNAMIC_PREPROC_SETUP to ExampleSetup. Snort will invoke ExampleSetup()
    and load these modules from the file system when it starts up. It is informed
    by the dynamicpreprocessor keyword in the configuration file. For example


    dynamicpreprocessor directory /usr/local/lib/snort_modules/


    will cause all the modules in the directory /usr/local/lib/snort_modules to be
    loaded.

    When Snort encounters a preprocessor setup line in the configuration file (e.g.,
    preprocessor dynamic_example: port 123), it will run the function passed as the
    second argument of the registration function, in this case ExampleInit(). This
    function will parse any keywords that go with your preprocessor from the configuration
    file, and if it is satisfied with the configuration settings, it should also register
    the primary processing function.'
