  md: '# Chapter 2 • Hardening the Operating System


    Administrators must also regularly test their systems using security analyzer
    software. Security analyzer software scans systems to uncover security vulnerabilities,
    and recommends fixes to close the security hole.


    This section discusses the maintenance required to ensure that your systems are
    safe from the daily threats of the Internet.


    # Red Hat Errata: Fixes and Advisories


    Once your Red Hat system is live, you must make sure that the most current required
    Red Hat errata include bug fixes, corrections, and updates to Red Hat products.
    You should always check the Red Hat site at www.redhat.com/apps/support for the
    latest err. The following list defines the different types of errata found at
    the Red Hat Updates and Errata site.


    +   **Bug fixes** Addressing coding errors discovered after the release of the
    product, and may be critical to program functionality. These Red Hat Package Manager
    tools (RPMs) can be downloaded for free. Bug fixes provide a fix to specific issues,
    such as a certain error message that may occur when completing an operating system
    task. Bug fixes should only be installed if your system experiences a specific
    problem. Another helpful resource is Bugzilla, the Red Hat bug-tracking system
    at https://bugzilla.redhat.com/. You may report a bug that you have encountered
    in your system through Bugzilla. Figure 2-2 shows one such notification of a bug
    by a user.


    +   **Security advisories** Provide updates that eliminate security vulnerabilities
    on the system. Red Hat recommends that all administrators download and install
    the security upgrades to avoid denial-of-service (DoS) and intrusion attacks that
    can result from these weaknesses. For example, a security update can be downloaded
    for a vulnerability that caused a memory overflow due to improper input verification
    in Netscape''s Joint Photographic Experts Group (JPEG) code. Security updates
    are located at http://www.redhat.com/security/updates/


    +   **Package enhancements** Provide updates to the functions and features of
    the operating system or specific applications. Package enhancements are usually
    not critical to the system''s integrity; they often fix functionality programs,
    such as an RPM that provides new features.'
