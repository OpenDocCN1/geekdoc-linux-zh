  md: '# Bastion Maintenance and Support


    At this point you should be comfortable with the tools required to securely administer
    your Linux bastion host. Ongoing maintenance must be performed on a schedule.
    Changes should be handled in a systematic fashion. You should define maintenance
    windows and a change control policy whereby patches and upgrades are approved,
    implemented, and reviewed. Joining one of the many vulnerability mailing lists
    will help you stay informed about new vulnerabilities as quickly as possible.
    You can bet the security hackers are all members of those mailing lists, so you
    probably should be too.


    There should be a policy in place for log collection and review. Logs should be
    recorded, preferably on a read-only media for archival purposes. Logs should be
    regularly reviewed and suspicious activity investigated. This last point is key;
    all often logs are generated but in many cases no one looks at them. Use of automated
    tools like swatch and Logwatch help minimize the human labor involved in log analysis,
    but there will still be events that need to be looked at more closely. Remember
    that security is an ongoing process that requires continued education and effort
    to stay hacker-proof as possible.


    # Linux Bastion Host Checklist


    Use the following checklist when hardening your Linux bastion host. These steps
    are not specific to any particular role (such as a web server or SMTP relay).
    All these steps are critical; missing any one could leave you vulnerable to hackers
    and result in a compromised system.


    +   Research your needs for a Linux bastion host (support, media, functionality),
    and select a distribution accordingly.

    Plan the partition layout, and give some foresight to providing space for the
    operating system, swap partition, system logs, and system data.

    Install the OS, and remove and disable any optional software and services.

    Apply patches and updates to the system kernel and software as needed.

    Remove/minimize processes using the SUID or SGID bit.

    If mandatory access control is desired, implement SELinux.

    Harden the TCP/IP stack.

    Configure TCP Wrappers.

    Configure the Netfilter firewall via via the GUI or IPTables tools.

    Apply any needed encryption for sensitive data.

    Enable and configure auditing as required.

    Apply scheduled maintenance to keep the system secure.'
