  md: '# Who Uses Network Analysis?


    System administrators, network engineers, security engineers, system operators,
    and programmers all use network analyzers, which are invaluable tools for diagnosing
    and troubleshooting problems, system configuration issues, and application difficulties.
    Historically, network analyzers were dedicated hardware devices that were expensive
    and difficult to use. However, new advances in technology have allowed for the
    development of software-based network analyzers, which make it more convenient
    and affordable for administrators to effectively troubleshoot a network. It also
    brings the capability of network analysis.


    The art of network analysis is a double-edged sword. While network, system, and
    security professionals use it for troubleshooting and monitoring the network,
    intruders use network analysis for harmful purposes. A network analyzer is a tool,
    and like all tools, it can be used for good and bad purposes.


    +   A network analyzer is used for:

    - Converting the binary data in packets to readable format

    - Troubleshooting problems on the network

    - Analyzing the performance of a network to discover bottlenecks

    - Network intrusion detection

    - Logging network traffic for forensics and evidence

    - Analyzing the operations of applications

    - Discovering faulty network cards

    - Discovering the origin of virus outbreaks or Denial of Service (DoS) attacks

    - Detecting spyware

    - Network programming to debug in the development stage

    - Detecting a compromised computer

    - Validating compliance with company policy

    - As an educational resource when learning about protocols

    - Reverse-engineering protocols to write clients and supporting programs


    # How Are Intruders Using Sniffers?


    When used by malicious individuals, sniffers can represent a significant threat
    to the security of a network. Network intruders use sniffing to capture confidential
    information, and the terms sniffing and eavesdropping are often associated with
    this practice. However sniffing is'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# 208 Chapter 7 • Network Analysis, Troubleshooting, and Packet Sniffing


    becoming a non-negative term; most people use the terms sniffing and network analysis
    interchangeably.


    Using a sniffer in an illegitimate way is considered a *passive attack*, it does
    not directly interface or connect to any other systems on the network. A sniffer
    can also be installed as part of the compromise of a computer on a network using
    an *active attack*. The passive nature of sniffers is what makes detecting them
    difficult. (The methods used to detect sniffers are detailed later in this chapter).


    Intruders use sniffers on networks for:


    +   - Capturing cleartext usernames and passwords

    - Discovering the usage patterns of the users on a network

    - Compromising proprietary information

    - Capturing and replaying Voice over IP (VoIP) telephone conversations

    - Mapping the layout of a network

    - Passive OS fingerprinting


    The above are all illegal uses of a sniffer unless you are a penetration tester
    whose job is to find and report these types of weaknesses.


    For sniffing to occur, an intruder must first gain access to the communication
    cable of the systems of interest, which means being on the same shared network
    segment or tapping into the cable somewhere between the communication path. If
    the intruder is not physically present at the target system or communications
    access point (AP), there are still ways to sniff network traffic, involving:


    +   - Breaking into a target computer and installing remotely controlled sniffing
    software.

    - Breaking into a communications AP (e.g., an Internet Service Provider [ISP])
    and installing sniffing software.

    - Locating a system at the ISP that already has sniffing software installed.

    - Using social engineering to gain physical access to an ISP in order to install
    a packet sniffer.

    - Having an inside accomplice at the target computer organization or the ISP install
    the sniffer.

    - Redirecting or copying communications to take a path that includes the intruder’s
    computer.


    Sniffing programs are included with most *rootkits* that are typically installed
    on compromised systems. Rootkits are used to cover the tracks of an intruder by
    replacing commands'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# Network Analysis, Troubleshooting, and Packet Sniffing • Chapter 7


    and utilities and clearing log entries. Intruders also install other programs
    as sniffers, loggers, and backdoor access software. Windows sniffing can be accomplished
    as part of a Remote Admin Trojan (RAT) as SubSeven or Back Office. Intruders often
    use sniffing programs that are configured to detect specific things (e.g., passwords),
    and then electronically send them to the intruder (or store them for later retrieval
    by the intruder). Vulnerable protocols for this type of गतिविधि include Telnet,
    File Transfer Protocol (FTP), Post Office Version 3 (POP3), Internet Message Protocol
    (IMAP), Simple Mail Transfer Program (SMTP), Hypertext Transfer Protocol (HTTP),
    Remote Login (rlogin), and Simple Network Management Protocol (SNMP).


    One example of a rootkit is “TornKit”, which works on Solaris and Linux. The sniffer
    that is included with this rootkit is called “tornis” and is installed in the
    hidden directory /usr/sec/.put. Another example of a rootkit is Rootkit 5 (Lrk5),
    which installs with the lsniffer.


    Intruders commonly use sniffers to control back doors. One method is to install
    a sniffer on a target system that listens for specific information and sends the
    backdoor control information to a neighboring system. This type of backdoor control
    is hard to detect, due to the passive nature of sniffers.


    cd00r is an example of a backdoor sniffer that operates in non-promiscuous mode,
    making it even harder to detect. Using a product like Networked Messaging Application
    Protocol (Nmap) to send a series ofTCP synchronous (SYN) packets to several predefined
    ports will trigger the backdoor to open up on a pre-configured port. More information
    about cd00r can be found at www.phenolit.de/stuff/cd00rc.


    # Note


    > A rootkit is a collection of Trojan programs that are used to replace the legitimate
    programs on a compromised system in order to avoid detection. Some common commands
    that are replaced are ps, ifconfig, and ls. Rootkits can also install additional
    software as sniffers.


