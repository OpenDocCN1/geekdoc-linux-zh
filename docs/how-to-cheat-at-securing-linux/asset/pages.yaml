  md: "# Chapter 10 • Linux Bastion Hosts\n\noptions are available. The most notable\
    \ one from a security perspective is the remote machine action. This allows you\
    \ to send the logs to a remote machine, which is a good idea. The syntax for the\
    \ remote machine action is simple @host. If your bastion host were to be compromised\
    \ by a hacker, any logs on that host would become suspect and of less value if\
    \ legal action had to be taken. By sending the syslog events to a syslog daemon\
    \ on another machine, you can ensure their integrity.\n\n# Viewing and Managing\
    \ the Logs\n\nNot that you have enabled all these logs, you will hopefully generating\
    \ a log of useful auditing information. The issue becomes what to do with all\
    \ that.You need a way to sort through it and pick out the most interesting pieces,\
    \ do something about it where necessary, preferably by all in an automated fashion.\
    \ The way to do this is through several heavy log tools. One of the simplest utilities\
    \ is dmesg. It lacks any real features; it is merely a quick way to display the\
    \ system message buffer.\n\nA good Web site covering log analysis is loganalysis.org\
    \ by Tina Byrd. You can probably find a utility to do just about you want to do\
    \ with logs, sending e-mails for certain events to shutting down processes or\
    \ color-coding the events on the console. Two popular tools are swatch and logwatch.\
    \ Of the two, swatch is the more lightweight, being easy to set up and having\
    \ fewer options. Swatch is intended to parse the logs in real time and act on\
    \ what it finds the logs according to the configuration you specify. Logwatch\
    \ has a slightly different role: Its focus is on analyzing and reporting on log\
    \ files, but not in real time.\n\n# Configuring Swatch\n\nSince swatch (short\
    \ for simple watcher) is relatively focused in its purpose, the setup and configuration\
    \ are pretty simple. Some behaviors can be set from the command line, but the\
    \ rules must be in a configuration file. An example command to invoke swatch would\
    \ be swatch -c /etc/swatch.conf -t /var/log/syslog, which would tell swatch to\
    \ use the configuration file (-c) at /etc/swatch.conf. If you do not specify which\
