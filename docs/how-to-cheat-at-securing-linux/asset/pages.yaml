    # NOTE


    > At the time of this writing, version 3.2.2 of SWATCH was available for down-load.


    SWATCH uses two required fields: pattern(s) and action(s).


    +   - Patterns The SWATCH configuration file looks for patterns in logging entries.
    For example, bad login attempts display a “Failed Authentication” error.'
