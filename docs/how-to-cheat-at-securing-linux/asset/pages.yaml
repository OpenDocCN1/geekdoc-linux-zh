    # nmap: Stealth Scanning


    For any scanning you perform, it is not a good idea to use a connect (-sT), which
    fully establishes a connection to a port. Excessive port connections can cause
    a DoS to other machines, and will definitely raise any IDS system. Therefore,
    you should use a stealth testing method with nmap, with a SYN scan. To launch
    a SYN scan from nmap, use the -sS flag, which produces a listing of the open ports
    on the target, and possibly open/filtered ports if the target is behind a firewall.
    The ports returned as open are listed with what service port corresponds to, based
    on IANA port registrations, and as commonly used ports, such as 31337 for Back
    Orifice.


    In lowering your power with half-open scans, you may also consider the ftp "bounce”
    scan and idle scans that can mask your IP from the target. The ftp scan takes
    advantage of a feature of FTP servers, which allow anonymous users to proxy connections
    to other systems. If you find during your enumeration that an anonymous FTP server
    exists, or one to which you have login credentials, try using the -b option with
    user:pass@server.ftport. If the server does not require authentication, you can
    skip the user:pass, and unless FTP is on a nonstandard port, you can leave the
    fftport option as well. The idle scan, using -s zombiehost:port, has a similarity
    but a different method of scanning. This is detailed further by Fyodor''s Web
    page


    (www.insecure.org/nmap/idescan.html), the short version is that if you can identify
    a target with low traffic and predictable IP values, you can send spoof packets
    to your target, with the source set to the idle target. The result is that an
    IDS sees the idle scan target as the system performing scanning, keeping your
    system hidden. If the idle target is a trusted IP address and can bypass host-based
    access control lists (ACLs), even better! Do not expect to be able to use a bounce
    or idle scan on every penetration test engagement, but keep looking around for
    potential targets. Older systems, which do not offer useful services, may be the
    best targets for some of these scans option.


    # nmap: OS Fingerprinting


    You should be able to create a general idea of the remote target’s operating system
    using the services and ports open. For example, ports 135, 137, 139, or 445 indicate
    a Windows-based better. However, if you want to get more specific, you can use
    nmap’s -O flag, which invokes nmap’s fingerprinting mode. Care to be taken here
    is, as well as older operating systems such as AIX prior to 4 and older OS versions
    are known to die when presented with a malformed packet. Keep this in mind before
    using -O across a Class B subnet. Figures 3.4 and 3.5 show the output from a fingerprint
    scan using nmap -O. Note that the fingerprint option without any scan types will
    invoke a SYN scan, the equivalent of -sS, so ports can be found for the fingerprinting
    process occur.'
