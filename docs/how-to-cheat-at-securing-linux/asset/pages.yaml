  md: '# Chapter 1 • Presenting the Business Case for Open Source Software


    Many of the free solutions are also open source, allowing unequaled flexibility
    to customize, alter, or rewrite the software in question.


    # “Selling” a Free Solution


    +   - Be informed of the pros and cons of the solution, and be honest about your
    data.

    - Remember that it''s not a contest to implement a particular solution, but rather
    the objective is to be well informed so that the best solution can be chosen.


    +   - Real life examples are always better than theory. A sample graph of data
    from your current network (policy allowing) is always going to drive home the
    point better than a bullet that says the product will generate.


    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure both your understanding of the concepts presented in this
    chapter and assist you with real-life implementation of these concepts. To have
    your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” format.


    Q: How do I know when I have found the best solution?


    A: The solution that is “best” today, might not be tomorrow. The selection of
    free software is rapidly changing. While there are certain leaders who will continue
    to be picks for the foreseeable future, many other free solutions will come and
    go. The only way to make a good decision is to “do your homework,” and if possible,
    consult an expert in the area you are interested in.


    Q: If some of these free tools are so good, why doesn''t everyone use them?


    A: In the case of a large organization, the features or functionality of the free
    software are vital, a commercial solution may be the only option for some. For
    smaller organizations for whom a free solution can satisfy their needs, it typically
    comes down to knowing what the options are. No one is paying to advertise free
    products in computer magazines, so generally the more experienced and knowledgeable
    Information Technology (IT) people know all the available products.


    Q: Is free software really free?


    A: Not in every sense of the word. While the software itself may cost nothing,
    you have to consider the costs of the hardware required to run it, the training
    required to implement the software, and potential maintenance costs (in terms
    of manhours and actual dollars) when considering a free solution. After adding
    all of this up, some free solutions can be very “cost effective,” even if not
    truly.'
