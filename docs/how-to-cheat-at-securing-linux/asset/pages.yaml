  md: '# Chapter 3 • Enumeration and Scanning Your Network


    the way to. Higher degrees of accuracy can be achieved by combining TCP/UDP and
    ICMP methods, assuming that no device between you and the target is reshaping
    packets and mismatching the signatures.


    For the ultimate in stealthy detection, passive fingerprinting can be used. Similar
    to the active method, this style of fingerprinting does not send any packets,
    but relies on sniffing techniques to analyze the information sent in network traffic.
    If your target is running publicly available services, passive fingerprinting
    may be a good way to start your fingerprinting. A drawback of passive fingerprinting
    is that it is less accurate than a targeted active fingerprinting session and
    relies on an existing traffic stream.


