- img_proc: true
  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the "Ask the Author" form.


    Q: Why log the Snort in binary format? What can I gain from this?


    A: Snort''s binary format is also known as the TCPDump data format. Logging the
    packets to binary format makes packet collection faster. It also means that later
    you can look through the data and filter it after collection instead of during.
    Logging in binary format saves time because Snort does not have to translate the
    data from binary to human-readable format on the fly.


    Q: How does Snort use plug-ins?


    A: Snort uses plug-ins in various ways. The preprocessor can take plug-ins to
    translate data such as HTTP data into a more readable format, or it can take plug-ins
    that check for patterns such as checking for port scans. The detection engine
    can take rulesets of various types, but it can also take plug-ins. The alerting/logging
    component is the most obvious place you''ll see plug-ins. The plug-ins for alerting/logging
    include functionality for SQL databases, SNMP traps, and WinPopup messages.


    Q: How do I keep my Snort system secure?


    A: Keeping your Snort system secure is just a matter of good system administration.
    This includes proper configuration, disabling unnecessary services, regular updates,
    and encrypting sensitive data.'
  merge: -1
