    # Damage & Defense...


    Logging Your Configurations in Bastille

    As many security programs, Bastille is relatively simple to implement, but it’s
    easy to lose track of the changes you implemented. This can be a problem if you
    are unable to perform a typical operation on the system, or denied access to a
    command or service. Many times, it is because you have locked down part of the
    system by mistake, or misjuded the impact of a Bastille choice.

    It is always a good idea to create a hard-copy log of the options you select in
    Bastille, or any security configurations you implement on your system. Create
    a log with answers given to each question during the implementation and keep the
    hard copies in a safe place.

