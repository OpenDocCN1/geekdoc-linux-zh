  md: '# Introduction


    You have now hardened your system using open source tools. Changes are constantly
    made to production systems. In addition, malicious users are constantly discovering
    and exploiting new weaknesses.This chapter discusses ways to scan or penetration
    test your own systems for weaknesses that may already exist or may develop. Penetration
    testing your network will help you to see potential weaknesses through the eyes
    of an attacker, and will help you to close up the holes. You will learn how to
    scan your hard drive, and then scouring processes to identify problems. Finally,
    you will learn how to deploy the Nessus scanner for common vulnerabilities. By
    the end of this chapter, you will have a system that is reasonably secure, and
    can actually test additional servers for vulnerabilities.


    # Scanning


    During the scanning phase, you will begin to gather information about your network''s
    purpose, specifically which ports (and possibly what services) it offers. Information
    gathered during this phase is traditionally used to determine the operating system
    (or firmware version) of the target devices. The list of active targets gathered
    from the footprinting phase is used as the target list for this phase. This is
    not to say that you cannot target any host within your approved ranges, but that
    you may lose time trying to scan a system that perhaps does not exist, or may
    not reachable from your network location. Often, your penetration tests are limited
    in time frame, so your steps should be streamlined as possible to keep your time
    productive. Put another way; only scan those hosts that appear to be alive, unless
    you literally have "time to kill."


    # Enumeration


    So, what is enumeration? Enumeration is a fancy term for listing and identifying
    the specific services and resources that are offered by a network. You perform
    enumeration by starting with a set of parameters, like an IP address, or a specific
    Domain Name Service (DNS) entry, and the open ports on the system.Your goal for
    enumeration is a list of services that are known and reachable from your source.
    From those services, you move further into deeper scanning, including security
    scanning and fingerprinting, the core of penetration testing. Terms such as banner
    grabbing and fingerprinting fall under the category of enumeration. The most common
    tools associated with enumeration include nmap, run with -sV and -O flags.


    An example of successful enumeration would be to start with host 10.0.0.10, and
    TCP port 22 open. After enumeration, you should be able to state that OpenSSH
    v3.91 is running with protocol versions 1, 1.5, and 2. Moving into fingerprinting,
    ideal results would being Linux v10.1, kernel 2.4.30. Granted, often your enumeration
    will not get to this'
