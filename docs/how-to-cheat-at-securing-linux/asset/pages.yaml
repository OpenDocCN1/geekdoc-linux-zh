  md: '# Chapter 10 • Linux Bastion Hosts


    # NOTE


    Different services are handled differently with respect to the time at which your
    changes take effect. When changes are made to services managed through xinetd,
    xinetd is immediately restarted; thus your changes will take effect immediately.
    When the service is not managed by xinetd the same is not true. In those cases
    you will need to stop the service manually, to a command prompt, use telnet <runlevel>
    and press Enter to reinitialize the run level, or simply reboot.


    If you are daemoning the bastion host without access to a GUI front end, you will
    need to control daemons via startup scripts. It’s also a good idea to know how
    to control the daemons without the GUI because the GUI interface will vary from
    system to system. The methods for startup scripts also vary from one distribution
    to another. The startup services in Fedora Core are managed by startup scripts
    located in /etc/rc.d/init.d All you need to do is comment out the line that calls
