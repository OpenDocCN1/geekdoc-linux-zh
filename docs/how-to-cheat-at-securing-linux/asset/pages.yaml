  md: '# OpenSSL VPN


    One of the most commonly used open source SSL VPNs is Open VPN, which uses TAP
    and TUN virtual drivers. For Linux 2.4.x or later, these are already bundled with
    the kernel. Open VPN tunnels traffic over the UDP port 5000. Open VPN can either
    use TUN driver to allow the IP traffic or TAP driver to pass the Ethernet traffic.
    Open VPN requires configuration to be set in the configuration files. Open VPN
    has two secure modes. The first is based on SSL/TLS security using keys like RSA,
    and the second is based on using symmetric keys or pre-shared secrets. RSA certificates
    and the keys for the first mode can be generated by using the openssl command.
    Details about these certificates or the private keys are stored in our .*cnf files
    to establish Open VPN connection.


    The cert extension will denote the certificate file, and key will be to denote
    private keys. The SSL-VPN connection will be established between two entities,
    one of which will be a client, which can be your laptop, and the other will be
    a server running at your office or lab. Both these computers use .conf files,
    which define the parameters required to establish SSL-VPN connection.


    For the server side, let''s call the file tls-server.conf, details of which are
    shown in Figure 9.30.


    # Figure 9.30 Configuration of the *.conf File on Server Side


    # may be used to delimit comment. (Line 1)

    tun

    # 12.23.34.56 is the IP address of Server (Line 2)

    # 12.23.34.57 is the IP address of the Client (Line 3)

    lifconfig 12.23.34.56 12.23.34.57

    #script will establish routes when a VPN is alive (Line 4)

    up -server.rtp

    # the script will be for server (Line 5)

    tls-server

    # Diffie -Hellman parameters (Line 6)

    db dh254.pem

    # Certificate Authority File (Line 7)

    ca noca.crt

    # Our certificate / Public Key (Line 8)

    cert srv.crt

    # Private Key of Server (Line 9)

    key srv.key

    # Open VPN uses port 5000 by default

    # Each VPN must use a different Port (Line 10)

    Port 5000

    # UID and GID should be initialized to "nobody" (Line 11)

    user nobody

    ngroup nobody

    #Verbosity Level (Line 12)

    # 0 - quiet except for fatal error

    # 1 - mostly quiet, but can display non-fatal network error

    # 3 - Medium output, good for normal operations

    # 5 - Verbose, good for trouble shooting

    verb 5'
