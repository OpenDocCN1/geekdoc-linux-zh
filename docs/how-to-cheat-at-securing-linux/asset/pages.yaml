    # # Explaining Ethernet


    Ethernet is the most popular protocol standard used to enable computers to communicate.
    A protocol is like speaking a particular language. Ethernet was built around the
    principle of a shared medium where all computers on the local network segment
    share the same cable. It is known as a broadcast protocol because it sends data
    to all other computers on the same network segment. Thisinformation is divided
    into manageable chunks called packets, and each packet has a header containing
    both the destination and source computers. Even though this information is sent
    out to all computers on a segment, only the computer with the matching address
    responds. All of the other computers on the network still see the packet, but
    if they are not the intended receiver they disregard it, unless a computer is
    running a sniffer. When running a sniffer, the packet capture driver puts the
    computer’s NIC into promiscuous mode. This means that the sniffer can see all
    of the traffic on the segment regardless of who it is sent to. Normally computers
    run in non-promiscuous mode, listening for information designated only for themselves.
    However, when a NIC is in promiscuous mode, it can see conversations to and from
    all of its neighbors.


    Ethernet addresses are also known as Media Access Control (MAC) addresses and
    hardware addresses. Because many computers may share a single Ethernet segment,
    each one must have an individual hard-coded address to the NIC. A MAC address
    is a 48-bit number, which is stated as a 12-digit hexadecimal number. This number
    is broken down into two halves; the first 24 bits identify the vendor of the Ethernet
    card, and the second 24 bits comprise a serial number assigned by the vendor.


    The following steps allow you to view your NIC’s MAC address:


    +   - Windows 9xe/ME Access Start | Run winipcfg.exe. The MAC address will be
    listed as the “Adapter Address.”


    +   - Windows NT, 2000, XP, and 2003 Access the command line and type ipconfig
    /all. The MAC address will be listed as the “Physical Address.”'
