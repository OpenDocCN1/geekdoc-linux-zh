    and click on the "Ask the Author" form.


    Q: Are the concepts of confidentiality, integrity, and authentication limited
    to cryptography?


    A: Absolutely not! The concepts of confidentiality and integrity are part of the
    CIA principles and you will find them turning up in information security. In fact,
    a large portion of information security is concerned with keeping information
    on a need-to-basis (confidentiality), making sure that you can trust information
    that you have (integrity). A non-cryptography-related example of each would be
    operating system access controls, file verification tools like Tripwire, and firewall
    rules. It is not to say that authentication is not important, however. If you
    cannot determine which or or people they claim to be, your security precautions
    become useless.


    Q: All of the algorithms looked at in this chapter are theoretically vulnerable
    in some way, either by brute-force attacks or mathematical advances. Why are they
    used?


    A: Although none of the algorithms in this chapter are 100 percent unbreakable,
    they are an effective method for protecting confidential information. The main
    principle is that with algorithms like 3DES, AES, and RSA, decrypting a single
    piece of information takes tens, hundreds, or thousands of years. By that time,
    it is assumed that the information will no longer be valuable.


    Q: Are there any cryptography techniques which are 100 percent secure?


    A: Yes. Only the OTP algorithm is absolutely unbreakable if implemented correctly.
    The OTP algorithm is actually a Vernam cipher, which was developed by AT&T in
    1917. The Vernam cipher belongs to a family of ciphers called stream ciphers,
    which encrypt data in continuous stream format instead of the chunk-by-chunk method
    of block ciphers. There are two problems with using OTP: however you must have
    a source of truly random data, and the source must be bit-for-bit as long as the
    message to be encoded. You also have to transmit both the message and the key
    (separately), the key must remain secret, and the key can never be reused to encode
    another message. If an eavesdropper intercepts two messages encoded with the same
    key, then it is trivial for the'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Chapter 8 • Basics of Cryptography and Encryption


    eavesdropper to recover the key and decrypt both messages. The reason OTP ciphers
    are not used more commonly is the difficulty in collecting truly random numbers
    for the key (as mentioned in one of the sidebars for this chapter) and the difficulty
    of the secure distribution of the key.


    Q: How long are DES and 3DES expected to remain in use?


    A: Most systems are capable of either 3DES or AES encryption. Both are considered
    secure and reliable, and no computer system in use today can crack them for the
    foreseeable future. DES, on the other hand, can already be broken within a day,
    so its use is highly discouraged. With high performance machines and dedicated
    processors and card, there should be no reason to use DES.


    Q: Why was the Content Scrambling System (CSS), the encryption technology used
    to protect DVDs from unauthorized copying, able to be broken easily?


    A: Basically, DVD copy protection was broken so easily because one entity, Xing
    Technologies, left their key lying around in the open, which as we saw in this
    chapter, a cardinal sin. The data encoded on a DVD-Video disc is encrypted using
    the CSS algorithm, which can be unlocked using a 40-bit key. Using Xing''s 40-bit
    key, hackers were able to brute force and guess at the keys for over 170 other
    licensees at a rapid pace. That way, since the genie was out of the bottle, so
    to speak, for so many vendors, the encryption for the entire format was basically
    broken. With so many keys to choose from, others in the underground had no difficulty
    in leveraging these keys to develop the CSS program, which allows data copied
    off of the DVD to be saved to another media in an unencrypted format. Ultimately,
    the CSS scheme was doomed to failure. You can''t put a key inside millions of
    DVD players, distribute them, and not expect someone to eventually pull it out.'
  merge: -1
