    given an equal opportunity; no device has priority over others. Carrier sense
    describes how an Ethernet interface on a network device listens to the cable before
    transmitting. The network interface ensures that there are no other signals on
    the cable before it transmits, and listens while transmitting to ensure that no
    other network device transmits data at the same time. When two network devices
    transmit at the same time, a collision occurs. Because Ethernet interfaces listen
    to the media while they are transmitting, they can identify the presence of others
