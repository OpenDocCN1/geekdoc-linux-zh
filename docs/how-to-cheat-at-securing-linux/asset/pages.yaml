  md: '# Figure 4.10 A Switched Network


    ![](img/b38c01d2fda8509e8449e32f876ae148_162_0.png)


    In this case, you''ll have to decide which other ports on your switch you want
    to monitor with the SPAN port. You can monitor just one port, or you can forward
    all traffic from a VLAN or even all traffic from the switch to the SPAN port.
    If you take that last option, it is important to keep an eye on traffic levels
    and make sure that the SPAN port is not overwhelmed; a flooded SPAN port drops
