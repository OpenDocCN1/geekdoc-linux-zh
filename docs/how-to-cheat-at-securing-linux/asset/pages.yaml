  md: '# Controlling Access to Resources


    The majority of the steps so far have been focused on controlling how a user can
    interact with the bastion host. Most of the steps so far were made under the assumption
    that the user already has connectivity to the bastion host, from which programs
    have the SUID bit set to the security context they use and the services that are
    available. Following a defense-in-depth philosophy, the next steps are to restrict
    who can interact with the bastion host. By restricting who may communicate with
    the bastion host, in restricting what they do once they have established communication,
    we come closer to having a hacker-proof system.


    # Address-Based Access Control


    From a networking perspective, the most common way to limit access is based on
    the IP address of the foreign system. A traditional firewall falls into this category.
    In this section we discuss the ways you can restrict access based on the IP address
    of the systems.


    # Configuring TCP Wrappers


    TCP Wrappers functions similarly to a firewall, except where a firewall permits
    or denies traffic based on data contained in the IP header of the packet, TCP
    Wrappers filters access to the services on the host it is running. Services are
    compiled against the libwrap library to make use of TCP Wrappers. When enabled,
    TCP Wrappers'' attempts to access a given services will be compared sequentially,
    and of the /etc/hosts.allow file and then the /etc/hosts.deny file. Rules are
    checked sequentially. For example, if you want allow only connections from Syngress
    to SSH on your bastion host while rejecting all other attempts, you would have
    the following lines in your hosts.allow and hosts.deny files:


    ```

    /etc/hosts.allow

    sshd : .syngress.com

    ```


    ```

    /etc/hosts.deny

    sshd : ALL

    ```


    These two files accept several wildcards, such as ALL, LOCAL, KNOWN, UNKNOWN,
    and PARANOID. You can enable logging in the rule files as well, and configure
    the facility and severity of the log entry. With TCP Wrappers'' limited functionality
    and syntax, you might wonder why you would ever use it over simply the Linux firewall,
    IPTables. Because IPTables works at the packet level, if you want to deny access
    to a particular process, such as HTTP, you must deny by port number. If you use
    IPTables to explicitly block attempts to port 80, and then you starts the Web
    server and tells it to listen on port 8080, the connection will be allowed. With
    TCP Wrappers, you can permit or deny access to a process. This distinction could
    prove invaluable if you have a service that'
  merge: -1
  pgno: 376
- img_proc: true
  md: 'uses a large number of listening ports or some type of service that is spawned
    as needed and the port number isn''t always consistent, or if the packets are
    tunneled in another protocol, rendering identification by port numbers impossible.


    # Configuring IPTables


    IPTables comes with virtually every distribution of Linux. It is a very functional
    firewall with an impressive array of features and options. To enable the IPTables
    firewall, simply navigate to **System | Administration | Security Level and Firewall**.
    On the **Firewall Options** tab, ensure that it is **Enabled**, as shown on Figure
    10.10.


    **Figure 10.10** Enabling an IPTables Firewall


    ![](img/b38c01d2fda8509e8449e32f876ae148_377_0.png)


    Depending on the distribution you choose, the default rules for IPTables may vary.
    In the case of Fedora Core 5, the default rule set is to permit all outbound traffic
    and to permit all inbound traffic that is part of an established session. As you
    can see in the Figure 14.10, SSH was checked. Because the default configuration
    blocked all inbound connection attempts, creating a rule to box this case will
    be created to allow an inbound connection for SSH (TCP 22). In addition to the
    preconfigured ports (services), you can add your custom port in the **Other Ports**
    section. This interface works well for simple packet filtering, but IPTables is
    capable of much more than filtering. To get more advanced, you need to be comfortable
    with the command line. Next we will discuss what the rules look like and their
    meanings.


    To use an example, this is the default output from the command `iptables -L`,
    which is to list all chains (we will see what a chain is shortly), shown in Figure
    10.11.Your default rules probably won''t look exactly like these.'
  merge: -1
