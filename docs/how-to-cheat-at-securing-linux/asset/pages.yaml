  md: '# Perimeter Security, DMZs, Remote Access, and VPNs • Chapter 9


    +   - -d specifies the destination address to match (works with !), iptables -A
    FORWARD

    -d 192.168.1.99 will match any packet with a destination address of 192.168.1.99.


    +   - -i specifies the network interface that the traffic was received on (works
    with !)

    iptables -A FORWARD -i eth0 will match any packet entering the eth0 interface.


    +   - -j specifies the target. iptables -A FORWARD -p tcp -j DENY would create
    a rule

    at the bottom of the FORWARD chain that will DENY any TCP packet.


    +   - -o specifies the network interface that the traffic was sent out of (works
    with "!")

    iptables -A FORWARD -o eth1 would match any packet leaving the eth1 interface

    face.


    +   - -t specifies the table to manipulate. iptables -t nat -A POSTROUTING -p
    tcp -j

    DENY would add a rule to the bottom of the POSTROUTING chain in the NAT

    table, by DENY any TCP packet.


    If you don''t specify the -f option, iptables assumes you are working with the
    filter table.


    +   - -v to be verbose. iptables -L -v lists all of the rules and includes packet

    counts per chain and rule.


    +   --line-numbers specifies that the rule list should be numbered:

    iptables -L --line-numbers


    This makes it easier to know what number to use for the commands that

    take a rule as an argument, such as insert, delete, replace, and so on.


    +   -m will match packets based on certain protocol-specific criteria. Because
    the

    options are protocol specific, -p (tcp/udp/icmp) must be used with -m. Some

    common examples include:


    +   -m --sport allows you to match packets based on the TCP or User Datagram

    Protocol (UDP) source port.


    +   -m --dport allows you to match packets based on the TCP or UDP destination

    port.


    +   -m multi-port allows you to match packets based on multiple ports

    within the same rule. iptables -A FORWARD -p tcp -m multiport --dport

    22,25,53 -j DROP will DROP any TCP packet with a destination port of

    22, or 53.


    +   -m state --state will allow you to match packets based on the state of the
    con-

    nection. iptables -A FORWARD -p tcp -m state --state NEW -j LOG

    LOG any TCP packets that were being used to initiate a new connection.


    There are four recognized states: NEW, ESTABLISHED, RELATED, and INVALID'
