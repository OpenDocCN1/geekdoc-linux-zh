  md: '# Contributing Authors


    Mohan Krishnamurthy Madwachar (OPSA, OPST) is the GM – Network Security, Almoayed
    Group, Bahrain. Mohan is a key contributor to their projects division and plays
    an important role in the organization’s Network Security initiatives. Mohan comes
    from a strong networking, security and training background. His tenure with companies,
    such as Schlumberger Omnes and Secure Network Solutions India adds to his experience
    and expertise in implementing large and complex network security projects.


    Mohan holds leading IT industry standard and vendor certifications in systems,
    networking and security. He is a member of the IEEE and PMI.


    Mohan would like to dedicate his contributions to this book to his brother Anand,
    wife Preethi Anand and their sweet daughter Janani.


    Mohan co-authored two books Designing & Building Enterprise DMZs (ISBN: 1597491004)
    and Configuring Juniper Netscreen & SSG Firewalls (ISBN: 1597491187) published
    by Syngress. He writes in newspaper columns on various subjects and has contributed
    to leading content companies as a technical writer and a subject matter expert.


    Eric S. Seabgren (CISA, CISP-ISSAP, SCPN, CCNA, CNE-4, MCP+1, MCSE-NT) has 10
    years of experience in the computer industry, with the last eight years spent
    in the financial services industry working for a Fortune 100 company. Eric started
    his computer career working with Novell and performing general network troubleshooting
    for a small Houston-based company. Since he has been working in the financial
    services industry, his position and responsibilities have advanced steadily. His
    duties have included server administration, disaster recovery responsibilities,
    business continuity coordinator, Y2K remediation, network vulnerability assessment,
    and risk management responsibilities. He has spent the last few years as an IT
    architect and risk analyst, designing and evaluating secure, scalable, and redundant
    networks.'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'Eric has worked on several books as a contributing author or technical editor.
    These include Hardening Network Security (McGraw-Hill), Hardening Network Infrastructure
    (McGraw-Hill), Hacking Exposed: Cisco Networks (McGraw-Hill), Configuring Check
    Point NGX VPN-1/FireWall-1 (Syngress), Firewall Fundamentals (Cisco Press), and
    Designing Enterprise DMZs (Syngress). He has also received a CTM from Toastasters
    of America.


    Aaron W. Sayles is a senior security consultant with Sentigy, Inc. of Houston,
    TX. He provide services to Sentigy''s clients with penetration testing, vulnerability
    assessment, and risk assessments for enterprise networks. He has over 9 years
    experience with INFOSEC, with specific experience in wireless security, penetration
    testing, and incident response. Aaron''s background includes work as a senior
    security engineer with SAIC in Virginia and Texas. He is also the author of the
    Syngress book, InSec Career Hiring, Sell your Skills, Not Your Soul.


    Aaron has provided INFOSEC support and penetration testing for multiple agencies
    in the U.S. Department of the Treasury, as the Financial Management Service and
    Securities and Exchange Commission, and the Department of Homeland Security, such
    as U. S. Customs and Border Protection. He holds a Bachelor’s degree in Computer
    Science with post-graduate work in Embedded Linux Programming from Sam Houston
    State University and is also a CISSP.


    Raven Alder is a Senior Security Engineer for IOActive, a consulting firm specializing
    in network security design and implementation. He specializes in scalable enterprise-level
    security, with an emphasis on defense in depth. He designs large-scale firewall
    and IDS systems, and performs vulnerability assessments and penetration tests
    to make sure they are performing optimally. In his copious spare time, he teaches
    network security for Linuxch and checks cryptographic vulnerabilities for the
    Open Source Vulnerability Database. Raven lives in Seattle, WA. Raven was a contributor
    to Nessus Network Auditing (Syngress Publishing, ISBN: 1-931836-08-6).'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'Dr. Everett F. (Skip) Carter, Jr. is President Taygeteta Network Security Services
    (a division of Taygeteta Scientific Inc.), Taygeteta Scientific Inc. provides
    contract and consulting services in the areas of scientific computing, smart instrumentation,
    and specialized data analysis.Taygeteta Network Security Services provides security
    services for real-time firewall and IDS management and monitoring, passive network
    traffic audits, external security reviews, forensics, and incident investigation.


    Skip holds a Ph.D. and an M.S. in Applied Physics from Harvard University. In
    addition he holds two Bachelor of Science degrees (Physics and Geophysics) from
    the Massachusetts Institute of Technology. Skip is a member of the American Society
    for Industrial Security (ASIS). He was contributing author of Syress Publishing’s
    book, Hack Proofing XML (ISBN: 1-931836-50-7). He has authored several articles
    for Dr. Dobbs Journal and Computer Language as well as numerous scientific papers
    and is a former columnist for Forth Dimensions magazine. Skip resides in Monterey,
    CA, with his wife, Trace, and his son, Rhett.


    Josh Burke (CISSP) is an independent information security consultant in Seattle,
    Washington. He has held positions in networking, systems, and security over the
    past seven years in the technology, financial, and media sectors. A graduate of
    the business school at the University of Washington, Josh concentrates on balancing
    technical and business needs for companies in the many areas of information security.
    He also promotes an inclusive, positive security philosophy for companies, which
    encourages communicating the merits and reasons for security policies, rather
    than educating only on what the policies forbid.


    Josh is an expert in open-source security applications as Snort, Ethereal, and
    Nessus. His research interests include improving the security and resilience of
    the Domain Name System (DNS) and the Network Time Protocol (NTP). He also enjoys
    reading about the mathematics and history of cryptography, but afterward often
    knows less about the subject than when he started.'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'Eli Faskha (Security+, Check Point Certified Master Architect, CCSI, CCSE,
    CCSE+, MCP). Based in Panama City, Panama, Eli is Founder and President of Soluciones
    Seguras, a company that specializes in network security and is a Check Point Gold
    Partner and Nokia Authorized Partner. He was Assistant Technical Editor for Syngress’
    Configuring Check Point NGX VPN-1/Firewall-1 (ISBN: 1597490318) book and Contributing
    Author for Syngress’ Building DMZs for the Enterprise (ISBN: 1597491004). Eli
    is the most experienced Check Point Certified Security Instructor and Nokia Instructor
    in the region, and has taught participants from over twenty different countries,
    in both English and Spanish. A 1993 graduate of the University of Pennsylvania’s
    Wharton School and Moore University in 1995. He also received an MBA from Georgetown
    University. He has more than 8 years of Internet development and networking experience,
    starting with web development of the largest Internet portal in Panama in 1999
    and 2000, managing a Verisign affiliate in 2001, and running his own company since
    then. Eli has written several articles for the local media and has been recognized
    for his contributions to Internet development in Panama.'
