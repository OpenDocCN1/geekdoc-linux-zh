    # Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to measure your understanding of the concepts presented in this chapter
    and to assist you with real-life implementation of these concepts. To have your
    questions about this chapter answered by the author, browse to www.synergy.com/solutions
    and click on the “Ask the Author” form.


    Q: How do I configure Snort to send e-mail alerts?


    A: You don''t. Snort includes no native way to send e-mail alerts. This was an
    intentional decision because processing e-mail alerts would place an undue burden
    on the Snort process, possibly resulting in dropped packets and missed alerts.
    Instead, the simplest way to accomplish this is with a lag parsing tool, such
    as watch.


    Q: How do I turn Snort into an IPS instead of IDS?


    A: Snort (www.snort.net/) is designed to automatically adjust the rules on a firewall
    based on certain Snort alerts. It-is-a mature tool with relatively active development.
    Also check the user-contribution section of the Snort Web site for an assortment
    of utilities at www.snort.org/dl/contrib/patches/. Snort itself has some limited
    capability to take actions, specifically when acting in “inline mode.” Refer to
    the documentation at www.snort.org/docs/snort_htmanuals/htmanual_260/node7.html
    for more on Snort’s native IPS support. See Chapter 11 for more on Snortams.


    ![](img/b38c01d2fda8509e8449e32f876ae148_192_0.png)'
