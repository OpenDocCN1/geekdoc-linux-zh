  md: '# Chapter 2 • Hardening the Operating System


    +   **Checks for parse errors** Visudo will not save changes if a syntax error
    exists. It will state the line number of the error and prompt you for guidance.
    You will be offered a “What Now?” prompt and three choices: “e” to re-edit the
    file, “x” to exit without saving, and “Q” to quit and save changes. A syntax error
    result is shown in Figure 2.16.


    # Figure 2.16 Visudo Parse Error


    ```

    root@localhost:~/sudo-1.6.9p5

    [root@localhost sudo-1.6.9p5]# vi sudoers

    [root@localhost sudo-1.6.9p5]# visudo

    visudo:/etc/sudoers.tmp unchanged

    [root@localhost sudo-1.6.9p5]# visudo

    >>> sudoers file: syntax error, line 76 <<<

    What now?

    ```


    If a syntax error exists in the sudoers file and you choose Q to quit and save
    the visudo changes, sudo will not run until the problem is corrected. You must
    run sudo again, fix the problem, and save the file again. It is recommended that
    you select e to attempt to fix the problem, or x to exit without saving (if you
    are not sure of what went wrong).


    +   **Prevents multiple edits to the file simultaneously** If you attempt to run
    sudo while the sudoers file is being edited, you will receive an error message
    informing you to try again at a later time


