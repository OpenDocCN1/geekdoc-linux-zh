    B, with a spoofed source IP host on Network C, Network C will see traffic going
    to it that originates from Network B, perhaps without any indication that Network
    A is involved at all.


    The best practice for network administrators is to ensure that the network only
    originate packets with a proper Source IP address (i.e., an IP address in the
    network itself).


    # Internet Control Message Protocol


    The Internet Control Message Protocol (ICMP) manages errors that occur between
    networks on the IP. The following are common types of ICMP messages:


    +   **Echo Request/Reply** Used by programs as ping to calculate the delay in
    reaching another IP address.


    +   **Destination Unreachable: Network Unreachable and Port Unreachable** Sent
    to the source IP address of a packet when a network or port cannot be reached.
    This happens when a firewall rejects a packet or if there is a network problem.
    There are a number of subtypes of Destination Unreachable messages that are helpful
    at diagnosing communication issues.


    +   **Time Exceeded** Occurs when a packet reaches 0.


    # TCP


    TCP packets are connection-oriented, and are used most often to transmit data.
    The connection-oriented nature of TCP packets makes it a poor choice for source
    IP address spoofing. Many applications use TCP, including the Web (HTTP), e-mail
    (SMTP), FTP, SSH, and many Windows FTPs.'
