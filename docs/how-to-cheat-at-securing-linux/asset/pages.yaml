    # Where Snort Fits


    Snort is an open source network IDS capable of performing real-time traffic analysis
    and packet logging on Internet Protocol (IP) networks. Snort can perform protocol
    analysis and content searching/matching, and you can use it to detect a variety
    of attacks and probes, such as buffer overflows, stealth port scans, Common Gateway
    Interface (CGI) attacks, Server Message Block (SMB) probes, operating system fingerprinting
    attempts, and more. Snort is rapidly becoming the tool of choice for intrusion
    detection.


    You can configure Snort in three modes: sniffer, packet logger, and network intrusion
    detection. Sniffer mode reads the packets off the network and displays them in
    a continuous stream on the console. Packet logger mode logs the packets to the
    disk. Network intrusion detection mode is the most complex and configurable, allowing
    Snort to analyze network traffic for matches against a user-defined ruleset and
    to perform one of several actions, based on what it sees.


    In addition to the community signatures provided with Snort and the Sourcefire
    VDB signatures for download to registered users, you can write your own signatures
    with Snort to suit the particular needs of your network. This capability adds
    immense customization and flexibility to meet the unique needs of your own. In
    addition, there are several online communities where leading-edge intrusion analysts
    and incident responders swap their newest Snort rules for detecting exploits and
    recent viruses.


    Snort’s pattern matching behavior serves immediately practical applications. For
    example, it allows the detection of hosts infected with viruses or worms that
    have distinctive behavior. Because many modern worms spread by scanning the Internet
    and attacking hosts that they deem vulnerable, signatures can be written for either
    this scanning behavior or for the exploit attempt itself. Although it is not the
    job of the IDS to clean up infected machines, this identification capability can
    be immensely useful. In cases of massive virus infection, watching for the same
    behavior after supposed virus cleanup can help to confirm that the cleanup was
    successful.


    Snort also has signatures that match the network behavior of known network reconnaissance
    and exploit tools. Although for the most part, rule writers make an effort to
    match the signature of the exploit and not of a particular tool, sometimes it
    is helpful to be able to identify the tool scanning or attacking you. For example,
    there are rules that identify the SolarWinds scanner’s tendency to embed its name
    in the payload of its scanning Internet Control Message Protocol (ICMP) packets,
    making for easy device identification. The vast'
