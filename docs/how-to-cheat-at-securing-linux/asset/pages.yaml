    # Syslogd-ng


    Syslogd-ng is a logging daemon that is the replacement for the traditional syslogd.
    The “ng” is an acronym for “next generation.”The original syslogd was the Unix
    logging daemon that lacked features for syslog services, but was difficult to
    configure. Syslogd-ng is easier to configure and offers additional logging features,
    such as more configurations. For example, syslog-ng allows administrators to filter
    messages based on priority, as well as the content of the messages. You can also
    forward logs to TCP, sort them to different destinations, and create a direct
    log stream to various hosts. The syslog-ng home page is shown in Figure 2.24 and
    is located at www.balabit.com/network-security/syslog-ng/.


    # Figure 2.24 Syslog-ng Home Page


    ![](img/b38c01d2fda8509e8449e32f876ae148_75_0.png)


    The basic problem with system logs is that they contain a lot of unimportant information.
    This information is often called noise. Many events are lost because they are
    buried in the noise. Syslogd made it difficult to choose only the important messages.

    The reason this occurs is that messages are sent to different destinations depending
    on the assigned facility/priority pair. These destinations are broad, and include
    general'
  merge: -1
