    # httpprint


    Suppose you run across a Web server and want to know the HTTP daemon running,
    without loading a big fingerprint tool that might trigger IDS sensors? httpprint
    is designed for such purpose. It only fingerprints HTTP servers, and does both
    grabbing as a signature matching against possible signatures files. In Figure
    3.14, we run httpprint against a Web server at 10.0.0.10, using -h, and designated
    the signatures with -s /audit/httpprint/signatures.txt. The resulting banner specifies
    Apache 2.0.53 (Fedora), while the nearest match is Apache 2.0.x, which matches
    up. Beneath that output are all the signatures that we identified, a score and
    confidence rating for that particular.'
