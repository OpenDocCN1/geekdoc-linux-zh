  md: '# Frequently Asked Questions


    The following Frequently Asked Questions, answered by the authors of this book,
    are designed to both measure your understanding of the concepts presented in this
    chapter and to assist you with real-life implementation of these concepts. To
    have your questions about this chapter answered by the author, browse to www.syngress.com/solutions
    and click on the “Ask the Author” form.


    Q: I have a server that is strictly a mail server and uses SMTP and POP3. However,
    I want to download security patches from my vendor''s Web site directly to the
    server. Even though I open the TCP/UDP port 80 (HTTP) and port 53 (DNS), I am
    unable to download the patches on the mail server.


    A: You can download your updates from another system on your network and install
    the updates on your server through a CD.


    Q: Should I place my e-mail server behind the firewall, or in a service network
    (that is, a “demilitarized zone?”)


    A: Standard practice is to place the e-mail server in the DMZ. A DMZ is usually
    comprised of a screening router that blocks most attacks (denial-of-service, system
    scanning, attacks against Microsoft NetBIOS ports,), and a firewall device that
    authoritatively blocks incoming traffic, effectively separating the internal network
    from the world. The DMZ exists between the screening router and the firewall.
    However, it is often a best practice to place the e-mail server behind the firewall
    itself. If you do this, however, you must make your firewall is configured correctly.
    Otherwise, a malicious user can take advantage of a misconfigured firewall and
    gain access to your internal network.


    Q: When I install Bastille and run configure, why does the program report that
    the compiler cannot create an executable?


    A: This error most likely indicates that your system does not have a functioning
    compiler. It often occurs because you do not have a license, or part of the compiler
    suite cannot be located. Access and view the config.log to determine the cause.
    Many compiler components are found in /usr/css/bin.This path may not be identified
    in the environment variable PATH.


    Q: By default, sudo uses syslog(3) for logging. Since I did not change this default
    during setup, why am I not generating any logging messages?'
  merge: -1
  pgno: 103
