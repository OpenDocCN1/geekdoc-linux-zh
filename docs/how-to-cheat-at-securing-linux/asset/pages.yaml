    # Summary


    This chapter covers the basics of hardening a server to avoid security vulnerabilities
    using Linux. The main sections covered disabling unnecessary services, locking
    down ports, Bastille, sudo, and logging enhancers.


    It is extremely important to install the latest service pack or updates to the
    operating system, which fix many security vulnerabilities and bugs before you
    install any programs. Many services provided by operating systems are not required
    and can be removed. The key to remember is that the fewer services running, the
    less potential vulnerability. TCP/UDP ports were covered in this chapter, and
    how each port is used by specific services. If you block ports on your server,
    you block the services that use those ports. Locking down ports is an excellent
    way to reduce exploitations of your system.


    Maintaining your server involves installing service packs and updates, and regularly
    installing bug fixes, security patches, and software updates. These items are
    available through the operating system vendors, and as well as the specific vendors
    that created the soft-ware you implement.


    Bastille is an open source program that facilitates the hardening of a Linux system.
    It performs many of the tasks listed previously, disabling services and ports
    that are not required for the system''s job functions. Bastille is powerful and
    can save administrators time from configuring each individual file and throughout
    the operating system. Administrators answer a series of “Yes” and “No” questions
    through an interactive graphical interface. The program automatically implements
    the administrators’ preferences based on the answers to the questions.


    SuperUser (sudo) is an open source security tool that allows an administrator
    to give specific users or groups the ability to run commands as root or as another
    user. The program can also log commands entered by specified system users. The
    developers of sudo state that the basic philosophy of the program is to “give
    as few privileges as possible, but still allow people to get their work done."


    Logging enhancers are tools that simplify logging by allowing logging information
    to be filtered and often displaying logs in simplified formats. Many open source
    logging programs exist to make system administration easier.You were introduced
    in this chapter to SWATCH, scananlog, and syslog-ng.'
  merge: -1
