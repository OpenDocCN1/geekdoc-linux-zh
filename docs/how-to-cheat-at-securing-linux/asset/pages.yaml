    \ download and compile the software into the Apache Web server. Adding mod_security\
    \ increases the secure operation of your Apache Web server and adds functionality,\
    \ but not limited to, the following:\n\n+   - HTTP protocol awareness\n- Anti-evasion\
    \ technique prevention such as URL encoding validation and URL decoding\n- Enhanced\
    \ audit logging\n- Built-in chroot functionality\n- Buffer overflow protection\n\
    - HTTPSPS filtering\n\nWe'll enable mod_security in our example because it adds\
