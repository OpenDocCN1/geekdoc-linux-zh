    # Enumeration


    Next, we will discuss tools that aid in the enumeration phase of an assessment.
    Remember, these tools will scan a list of targets and ports to help determine
    more information about each target. The enumeration phase usually reveals program
    names, version numbers, and other detailed information that will eventually be
    used to determine vulnerabilities on those systems.


    # nmap: Banner Grabbing


    The version-scanning feature of nmap is invoked with the -sV flag. Based on a
    returned banner, or on a specific response to an nmap-provided probe, a match
    is made between the service response and the nmap service fingerprints. This is
    a newer feature and it discovers services, which IDS vendors believe writing signature
    files for this type of behavior, so use it with caution.


    Figure 3.11 shows a successful scan using nmap -sV -O against a Linux server.
    This performs a SYN-based port scan, a version scan, and the OS fingerprinting
    function, with verbose output.'
