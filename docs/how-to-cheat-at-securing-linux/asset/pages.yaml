  md: '# Understanding Common Vulnerabilities Within Apache Web Server


    All software systems have four general types of vulnerability. Apache is no different
    and can be negatively affected by any of the following problems:


    +   - Poor application configuration

    - Unsecured Web-based code

    - Inherent Apache security flaws

    - Foundational OS vulnerabilities


    We''ll investigate these four types in detail through the remaining sections of
    this Chapter.


    # Poor Application Configuration


    Apache has many default settings that require modification for secure operation.
    Nearly all configuration information for Apache Web server exists within the httpd.conf
    file and associated Include files. Because many configuration options exist within
    these files, it can be easy to make configuration errors that expose the application
    to attack.


    # Unsecured Web-Based Code


    The second manner in which vulnerabilities are exposed is via poorly implemented
    code on the Apache server. Often, Web developers are far more concerned with business
    functionality than the security of their code. For instance, poorly written dynamic
    Web pages can be easy DOS targets for attackers, should coded limitations be absent
    from backend database queries. Simply publishing confidential or potentially harmful
    information without authentication can provide enemies with ammunition for attack.
    For these reasons, you must review and understand not only the Apache application
    but the information and functionality delivered via the system.


    # Inherent Apache Security Flaws


    Like the IIS server, vulnerabilities can exist within the Apache application code
    itself. There are many means by which hackers can breech or disable an Apache
    system, as as:


    +   - Denial of service

    - Buffer overflow attacks

    - Attacks on vulnerable scripts

    - URL manipulation'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Apache Web Server Hardening • Chapter 11


    Occasionally, Apache security flaws are discovered and announced by Apache or
    by various security groups. The Apache development team is typically quick to
    respond and distribute patches in response to events. For this reason, it is critical
    that you remain vigilant in your attention to security newsgroups and Apache’s
    security advisory site at http://httpd.apache.org/security_report.html


    # Foundational OS Vulnerabilities


    Another source of vulnerability within an Apache Web server could occur as a result
    of foundational security flaws on the OS on which Apache is installed. Apache
    can be run on just any OS. You should be very familiar with the specific security
    vulnerabilities for any OS on which you run Apache. This brings us to the next
    section, in which we discuss the merits of patching and securing the Microsoft
    OS.


    # Patching and Securing the OS


    Code deficiencies can exist in OSs and lead to OS and application vulnerabilities.
    It is imperative that you fully patch newly deployed systems and remain current
    with all released functional and security patches. At regular intervals, thoroughly
    review the published vulnerabilities at your OS manufacturer’s Web site.


    Some OSs and their respective security sites are listed in Table 11.1.


    # Table 11.1 Popular Operating Systems and Their Security Sites


    | Operating System | Vendor Security Information Site |

    | --- | --- |

    | Sun Solaris | http://sunsolve.sun.com/security |

    | Microsoft | www.microsoft.com/technet/security/default.mspx |

    | Mac OS | www.apple.com/support/security/ |

    | Debian Linux | www.debian.org/security/ |

    | RedHat Linux | www.redhat.com/security/ |

    | SuSE Linux | www.novell.com/linux/security/securitysupport.html |

    | FreeBSD | www.freebsd.org/security/ |

    | NetBSD | www.netbsd.org/security/ |

    | OpenBSD | www.openbsd.org/security.html |


    It might be a good idea to subscribe to your OS vendor’s mailing list to receive
    security-related updates and to monitor security newsgroups for 0-day exploits.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '# Patching Unix, Linux, and BSD Operating Systems


    Because Apache is so often run on various Unix, Linux, and BSD distributions,
    we include patching steps so that you can confidently deploy your Apache Web server
    on a well-hardened foundational OS. In general, each vendor provides a full suite
    of tools and information designed to help you remain current of their released
    software updates. Become familiar with each of your vendor''s patching methodologies
    and software tools. As the security administrator, you should reserve predetermined
    periods for maintenance windows during episodes of low customer activity. However,
    the discovery of serious OS vulnerabilities could necessitate emergency downtime
    while patches are applied.


    # Configuring a Secure Operating System


    Like patching, all systems used to provide services such as HTTP and HTTPS to
    customers should be thoroughly hardened before they are placed in a production
    environment. Hardening includes many steps such as the following:


    +   - Setting file permissions

    - Locking down accounts

    - Establishing proper OS security policies

    - Configuring host-based firewalls

    - Disabling vulnerable services


    Now that we have a solid, secure OS, let''s move on to discuss how to properly
    install and securely configure the Apache Web server.


    # Hardening the Apache Application


    The Apache Web server is a powerful application through which you can deliver
    critical business functionality to customers. With this power comes the possibility
    of misuse and attack. To ensure that your Apache server is running securely, we
    have compiled a series of steps to harden the Apache application. You might also
    want to read additional information or review other Apache security checklist
    documents before deploying your Apache server. Two excellent reference guides
    are the CIS Apache Benchmark document available at the Center for Internet Security
    (www.cissecurity.org) and the NIST Apache Benchmark document available at http://crc.nist.gov/checklists/repository/1043.html.


    You should follow three general steps when securing the Apache Web server as follows:


    +   - Prepare the OS for Apache Web server

    - Acquire, compile, and install the Apache Web server software

    - Configure the httpd.conf file'
  merge: -1
  pgno: 400
- img_proc: true
  md: '# Apache Web Server Hardening • Chapter 11


    Within these general tasks there are many steps, which we cover in the following
    sections.


    # Prepare the OS for Apache Web Server


    After you''d patched and hardened your OS, you''ll need to accomplish a couple
    quick tasks prior to obtaining, compiling, and installing the Apache software.
    A critical part of installing Apache is to provide a user account and group that
    will run the Web server. It is important that the user and group you select be
    unique and unprivileged to avoid reduce exposure to attack.


    > WARNING\Do not run your Apache Web server as the user Nobody. Although this
    is often a system administrator favorite and seemingly unprivileged account for
    running Apache and other services, the Nobody account has historically been used
    for root-like operations in some OSs and should be avoided.


    ![](img/b38c01d2fda8509e8449e32f876ae148_401_0.png)


    Choose and configure a user and group account using the following Unix OS steps.
    In this example, we will wwwuser and wwwgrp as the Apache username and group,
    respectively.


    +   1. As root from the command line, type groupadd wwwgrp to add a group.

    2. Type useradd -d /usr/local/apache/htdocs -g wwwgrp -c “Apache Account” -m wwwuser
    to add the user.


    The second step creates the user account also creates a home directory for the
    user in /usr/local/apache/htdocs.

    After creating the user and group accounts, you''ll need to lock down the wwwuser
    account for use with Apache. By locking the account and providing an unusable
    shell, this action ensures that no one can actually log into the Web server using
    the Apache account:


    +   1. As root from the command line, type passwd -l wwwuser to lock the Apache
    account.

    2. Type usermod -s /bin/false wwwuser to configure an unusable shell account for
    the Apache account.


    Now you''re ready to get the Apache software and begin installation.'
