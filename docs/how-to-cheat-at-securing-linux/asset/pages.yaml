  md: 'Presenting the Business Case for Open Source Software • Chapter 1


    # # “Selling” a Free Solution


    If you are in a position where you can implement a new security solution without
    having to receive anyone else''s approval, you probably don''t need to read this
    section. If on the other hand, you have to get someone to sign off on your plan,
    this should be helpful. If you do need approval, you are basically going to try
    and “sell” your solution, like a salesman, highlighting the benefits, and realistically
    noting any disadvantages to your proposed solution. Remember, the objective of
    presenting a solution is not to “win” by getting to do your way. The objective
    is to provide the decision makers with the most complete and accurate information
    so that the best decision can be made. Your judgment of the environment and your
    target audience will play a large part in what constitutes the best approach for
    you to take. Hopefully, some helpful guidelines as to how to approach gaining
    approval can help improve your odds of success.


    # # Selling by Doing


    One method of demonstrating the power and effectiveness of a given solution is
    to actually demonstrate the solution. If the environment allows, and you have
    the resources, it might be feasible to install the software in question, generate
    the reports, and present the facts, along with a demonstration of what the software
    can do. You don''t want to do anything that is inappropriate; if the change control
    procedures don''t allow such spontaneity, you will need to revise your approach.
    Assuming you have the freedom to do so, saying the software generates graphs and
    reports and traffic usage, broken up by protocol and the computer in question,
    rarely has the same impact as seeing that graph. Not only does it provide factual
    evidence of the utilities value, it also demonstrates your initiative and foresight.


    > WARNING


    Let''s be perfectly clear here, I''m not advocating that you go and implement
    some solution without proper management approval when policy says you shouldn''t.
    You need to evaluate your environment and factor in things such as climate, policy,
    risks, benefits, and so on, to determine if it''s wise to implement something
    without getting all the proper approvals ahead of time. Again, in some environments
    this would be perfectly okay and your manager would be elated at your ingenuity
    and initiative, while in others you could end up looking for a new job. As always,
    exercise good judgment and when in doubt, take the conservative approach.'
  merge: -1
