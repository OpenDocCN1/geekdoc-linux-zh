  md: '# Chapter 13


    # Maintaining Linux


    Now that you''ve set your system up the way you want it, you''ve crossed into
    the next phase of being a system administrator. Instead of focusing on setting
    everything up, you will now focus on maintaining and improving your site (improving
    is covered in Part V, “Upgrading and Adding to Your Site”). After all, an Internet
    site is somewhat like a car or a house—you need to constantly attend to it, rather
    than wait for times to get out of hand that major repairs are necessary.


    In this chapter, you learn how to manage:


    +   - Users

    - Disk space

    - Network resources


    # Managing Your Users


    The majority of what happens on most Internet sites is done by users. Therefore,
    the majority of what you''ll need to attend to management-wise deals with users.
    This is especially true if you run a site that has a user base that changes on
    a regular basis (e.g., a commercial site with people signing on and leaving, or
    an educational site with people coming in and out each semester.


    # Interacting with Your Users


    Part of being a system administrator is dealing with people. These people are
    the others responsible for your site (if you don''t run it alone), occasionally
    the administrators of other sites, and the users who utilize your site. Users
    can be the most difficult of the three to deal with because most of your communications
    with them involve complaints and requests. You may'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Chapter 13—Maintaining Linux


    want to save any compliments or thank-you''s that come along for your own morale!


    There are a few things to keep in mind when dealing with user calls or requests.


    Professional. Being a site administrator may be a labor of love for you, but it''s
    also a job. If you find you dislike a user, or find one difficult to deal with,
    sometimes it''s best to just smile and be friendly and efficient. The sooner the
    problem is solved, the sooner you can go on to other things.


    Patient. You will run into users who are technophobes, unsure of their abilities,
    or simply computer illiterate. Often with these kinds of users you have to drag
    the information you need out of them to solve your problem. You may find that
    a simple e-mail that includes some of the basic questions you need answers to
    (e.g., what platform they''re running on, what software the problem occurs with,
    error messages they see). After all, most of the complaints you get through e-mail
    or local newsgroup postings. If you tell the user you''re sending the form while
    you''re on the phone with them, do as you''re talking to him so you won''t forget.


    Be prompt as possible. There is little more frustrating to a user with a serious
    problem than having to wait weeks or months for a solution. If you''re swamped
    with system problems, try to organize yourself so you don''t lose individual people''s
    problems under piles of paper—perhaps set aside a special e-box, and/or a special
    In


    Be firm. Many system administrators work themselves to death to make their users
    happy, which includes fulfilling special requests. Remember, you''re only human,
    and there are times the line needs to be drawn between a legitimate request and
    a request that goes against an important and necessary policy. Keep a copy of
    your Acceptable Use agreement to refer to.


    Be authoritative when necessary. You will run into the occasional user. This person
    is someone who is either a program on the Internet itself (e.g., spamming newsgroups,
    stalking, and so on) or a problem on your site (e.g., is a resource hog or uses
    your system for illegal purposes). Be sure your Acceptable Use policy gives you
    the power to deal with such people.


    > Tip

    Spamming newsgroups means sending the same post to many unrelated groups. For
    example, sending out an advertisement for a computer you''re selling to every
    single newsgroup in the comp hierarchy.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# Managing Your Users


    # 255


    # Note


    For some fiction involving the exploits of a ruthless and frightening system operator,
    see the BOFH articles by Simon Travaglia by FTP at sunsite.unc.edu, in /pub/docs/humor/bastard-operator.
    You may also see these articles on the Web in HTML at http://www.renaissance.com/bofh/bofh-index.html.


    # IV


    # Dealing with Problem Users


    Dealing with problem users on your site is likely one of your more difficult jobs.
    It requires a mix of patience, fairness, tact, and determination. There are a
    number of reasons such users are challenging to deal with.


    You have to be sure the user is a problem. After all, the account may have been
    hacked, or the person complaining may not be entirely honest about the situation.
    It''s helpful to require some proof of forwarded news posts, e-mail, IRC logs,
    and so on. Keep in mind however this proof may be altered or false. State in your
    Acceptable Use policy (making this policy is discussed in more detail in section
    5, “Setting Up Your Site For General Use”) what measures you will take to verify
    a complaint against a user.


    The user may threaten legal action. If you make sure to have a solid Acceptable
    Use policy stating the things you will not put up with on your site, and how offenders
    will be generally covered. If you run a large site and are concerned, you may
    need to have a lawyer look over your Acceptable Use policy and help you tune it.


    Some problem users are both spiteful and computer-knowledgeable. These users are
    actually capable of damaging your system. It is important if you tell a user you
    intend to remove his account to so right away (more on removing users in the next
    section!) State in your Acceptable Use policy the number of days, hours, or minutes
    it will be between you say you will remove an account, and when you will remove
    it. You can give a flexible time or a time range.


    # Removing and Suspending Users


    There are times when you will need to remove users, whether they''re simply leaving
    your provider or in violation of your Acceptable Use policy. There are few scenarios
    you may want to handle differently:


    +   - If a user informs you that he wants his account canceled at the end of the
    month, inform him that all the data in his home directory will be erased on a
    particular date. Once that date is reached, you can expect'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# Chapter 13—Maintaining Linux


    that the user has copied all the files he wanted to keep. You can then proceed
    to completely remove the account by erasing the appropriate home directory, and
    the account''s mention in the /etc/passwd file and the /etc/shadow file (if you
    use it).


    +   - Suspending access to a user''s account (be sure your Acceptable Use policy
    covers reasons for account suspension) is simple. Go into the /etc/passwd file
    or /etc/shadow file and simply add an asterisk (*) to the beginning of the person''s
    password. Be sure to deal promptly with problem users, especially disgruntled
    and computer-able ones. You don''t want to risk damage to your site. If you decide
    to remove the account eventually, follow the same procedure detailed above.


    # Managing Your Disk Space


    A precious resource for any Internet site is hard disk space. After all, you need
    to be able to store all that news, mail, and general stuff that users like to
    collect.


    It''s important to keep up with your disk space management. If you let it go too
    long, you''ll find that your site suddenly starts kicking back mail or news saying
    that there''s no more room!


    # Disk Quotas


    You may find at some point that a number of users on your site are using a large
    amount of disk space for personal file storage. You can deal with this problem,
    of course, by simply asking them to cut their disk usage down to a level you find
    more appropriate. However, this may not always help.


    There are two solutions to this problem. You can either add more hard drive space
    to your site or implement disk quotas. Adding more space, while a nice solution
    for the users, won''t solve the problem if hogs continue to eat your disk space.
    You can set disk quotas; give users a bit of fair warning so that they have time
    to clean up their directories. Installing disk quotas is covered in detail in
    chapter 5, “Setting Up Your Site for General Use."


    To set a quota for only one person:


    +   - Log in as **root**.


    +   - Type **edquota user**. You can also set quotas for multiple users by simply
    listing the users, such as typing **edquota user1 user2**.'
