- img_proc: true
  md: '# Setting Up User Quotas


    Now we''ll set up the quotas themselves. To set a quota for all users, do the
    following:


    +   1. Change to /home.


    +   2. Type touch quota.group. This creates the data file that handles user quotas,
    and the rest of the quota system needs it to be before you proceed in defining
    those quotas. You could also use quota.user, but then you''d have to create a
    new quota every time you assigned a new user account!


    +   3. Type chmod 600 quota.group. This changes the file''s permissions to only
    readable and writable by the owner, root.


    +   4. Type edquota -g users. This invokes the command that will handle setting
    your quotas for you, making sure files are in their proper places and to their
    proper settings.


    > Note

    The edquota command is used to assign disk quotas to users and groups. Its general
    format:


    edquota -flag who_to_assign


    The edquota flags:


    u You intend to define a user quota

    g You intend to define a group quota

    np Use a "prototypical" user definition to simply copy to the users you are assigning.
    When using this flag, the format of the edquota command becomes edquota -p username_of_protouser
    username_to_be_defined

    t You want to edit the soft time limits for each of the filesystems that have
    quotas assigned.


    Edquota opens a temporary file where you can define how you want the quota handled.
    For the definition of this line is:


    ```

    fs /filesystem_to_have_the_quota blocks (soft=number_of_blocks,hard=number_of_blocks)
    inodes (soft=number_of_inodes,hard=number_of_inodes)

    ```


    An example follows.'
  merge: -1
  pgno: 123
- img_proc: true
  md: '5. Once the temporary file comes up, add the line that defines the quota space
    you want to assign to your user home directories. For example, if you wanted to
    set your limits to a soft of around 10M, and a hard of around 20:


    ```

    fs /home blocks (soft=10000, hard=20000) inodes (soft=0,hard=0)

    ```


    > > ### Tip

    > One block of disk space is one kilobyte (k, or 1024 bytes) of disk space.


    > > ### Note

    > Every file needs 1 inode. The inode contains the filesystem information about
    this file. Unless you want to limit the number of actual files someone can have,
    set the inode limit to 0, which disables that limit option. By this way, the user
    can have as many files as he wants as long as he stays within the limits.


    6. Save and exit the file.


    7. Type quotaan -a. This tells your system to use the quotas you''ve set, and
    to use all quotas you''ve defined.


