  md: '# Compiling Your Web Server


    > Note


    There are precompiled binaries available of httpd, I highly recommend you compile
    the server yourself. For one thing, sysadmin you''re going to have to compile
    a lot of programs as time goes by, so the more experience you get in the beginning,
    the better. For another, the risk of getting precompiled binaries instead of source
    is that they may not be compiled for a system''s set up the way you have yours
    up. It may be compiled for a different set of source libraries than you have,
    and in this case the binaries don''t come with some of the extra scripts that
    your source does.


    If you want to try the binary, you can find it via FTP at ftp.ncsa.uluc.edu in
    /Web/httpd/Unix/ncsa_httpd/httpd_1.4.2/ httpd_1.4.2_linux.Z. While this file contains
    the source code, it also contains a precompiled binary.


    Then, to rid of the .tar (a utility that groups items together, but doesn''t compress)
    type tar -xvf httpd_1.4.2_source.tar.


    > Note


    Some tarred files are set to create a particular directory for themselves, and
    some are not. If they create their own directory, you want to untar them straight
    in /usr/src. However, if they don''t, you''ll end up with a bunch of files directly
    in /usr/src instead of a subdirectory. I know httpd creates its own directory.
    If you''re not sure about a program, you may want to create a directory for it,
    untar the file inside that that directory, and if it creates its own directory
    move the tar file back to /usr/src and erase the untarred version. You can then
    untar it again and let it create its own directory.


    > Tip


    In Linux, you''ll use tar to cluster items into one file and gzip (or the UNIX
    command compress) to compress the file. These two commands are like PKZip in the
    MS-DOS world.'
  merge: -1
