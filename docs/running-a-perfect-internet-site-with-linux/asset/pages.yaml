  md: '# Final Installation Steps


    There are just a few more things you need to do to install your FTP server:


    +   1. Log in as root.


    +   2. Go to the directory in which you stored your FTP precompilation files.


    +   3. Change to the bin directory.


    +   4. Run the file ckconfig to double-check that you''ve installed the extra
    files properly. This program will tell you if all of the extra configuration were
    put where they need to be. You may want to redirect the output to a file (I''ll
    blot again here) so you can catch any mistakes, by typing instead:


    ```

    ckconfig > blot

    ```


    # Starting Your FTP Server


    Starting your FTP server is now easy! Just do the following:


    +   1. Find the process ID for inetd.


    +   2. Type kill -HUP process ID # (i.e., kill -HUP 345) to kill and restart your
    server.


    # Verifying That Your FTP Server Works


    After all of this work, it will feel good to be able to use your FTP server! Let''s
    put a file into your FTP site to look at, install a better FTP client, and test
    the server to make sure it works.


    # Storing Files in Your FTP Server


    If you want to know what people will see when they log in to your FTP server,
    take a look in the directory "ftp. This is the directory in which they start.
    From there, you can structure your server''s filesystem as you wish. As a general
    rule, the "ftp/pub directory you already created is where the you want to make
    accessible to the public are placed.


    Another standard is the "ftp/incoming directory, from which people can upload
    materials to your site. If you do create this directory, be sure the permissions
    are set so that people can write to it!'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# Verifying That Your FTP Server Works 217


    # Caution


    Only create an incoming directory if you''re certain you want to allow people
    to FTP materials onto your site. You may find that you have problems with people
    using this directory to upload any number of illegal items so their friends can
    pick them up before you see and remove them, as pirated software and child pornography.


    If you do an incoming directory, be sure to check it on a regular basis and look
    over the files it contains beyond just looking at the file name.


    If you are seriously concerned with determining what kind of files are illegal,
    you''ll need to contact a local lawyer. You can also contact the EFF (Electronic
    Freedom Foundation). The URL for its home page is given in chapter 9, "Installing
    UseNet Software."


    Also, check all MS-DOS and Macintosh files that appear in your incoming directory
    for viruses, especially if you''re not sure who uploaded them!


    If you have any files you want to make available, go ahead and start arranging
    them in your FTP server! Be sure that the permissions on your directories and
    files are as you want them.


    # Alternative FTP Client


    Even though you already have an FTP client, another alternative is NcFTP. This
    is a more flexible and "fancy" client that allows you to do extra things, such
    as view files without downloading them and resumes file transfers that died for
    one reason or another.


    # Finding and Uncompressing the Client


    The FTP client you''re going to install here is nctfp-2.1.0.


    To locate and uncompress FTP:


    +   1. Locate the file /slackware/n4/tcpip.tgz

    2. Copy it to /user/src or /incoming.

    3. Type gunzip tcpip.tgz.

    4. Type tar -xvf wu tcpip.tar.


    Inside this package is the binary file for NcFTP. See the README file for where
    this package belongs.'
  merge: -1
