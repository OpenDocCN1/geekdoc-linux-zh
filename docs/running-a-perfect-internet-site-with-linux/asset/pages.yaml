  md: '# Partitioning Syslog


    You can partition your syslog file according to the items kept in it. To do this,
    edit the file /etc/syslog.conf. You can tell this file to save the log data for
    any type of system process. The following minitable shows examples of the processes
    for which you can make separate log files.


    | Process Type | Description |

    |---|---|

    | auth | Login authorization processes |

    | daemon | Server processes |

    | kern | Kernel processes |

    | lpr | Printing processes |

    | mail | Mail processes |

    | user | User processes |

    | uucp | UCP processes |


    When you assign a log file to a particular type of process (e.g., daemon), you
    can also assign what kinds of messages you want written to the file. The levels
    of messages are shown in the following minitable, from most to least serious (not
    all these levels are used by all the process types).


    | Message Type | Description |

    |---|---|

    | emerg | A kernel panic (mostly used with kern) |

    | alert | A serious error that your system needs to deal with immediately |

    | crit | A critical error such as hardware failure |

    | err | All errors |

    | warn | All warnings |

    | notice | General, noncritical messages |

    | info | General information messages |


    Two special levels are debug (include all debugging information) and none (don''t
    include anything).'
  merge: -1
  pgno: 279
- img_proc: true
  md: 'Now, you just put these items together. For example, let''s say I want my mail
    and daemon processes all error messages in general to have each their own log
    files. Also, I need to choose the levels for each of them. The entries I might
    use are:


    ```

    mail.info      /var/admin/mail.log

    ```


    Send all information produced by mail to the specified log file.


    ```

    daemon.notice  /var/admin/daemon.log

    ```


    Send all notices produced by my daemons to the specified log.


    ```

    *err      /var/admin/err.log

    ```


    Send all error messages to the specified log.


    # Backups


    It''s important to keep backups of data from your site. The extent of the back-ups
    depends on your own needs. Today, a tape drive for backups isn''t all that

    expensive, so most people shouldn''t have to resort to floppy disks. In fact,

    unless you''re not doing the minor of backups involving only one more file,

    you want to avoid floppy disks for backing up. They''re simply not feasible for

    most sites'' backup needs!


    To use a tape drive for your backups, you''ll need two programs. First, you

    need a driver to actually run the tape drive: ftape. Second, you''d need a pro-

    gram to actually do the backups. You can use tar, or AFIO.


    > Tip

    Another form of backup is to keep an extra hard drive and to compress your entire

    primary drive onto it.


    > Tip

    See the Hardware How-To for the other backup technologies supported by Linux.


    # Ftape


    Ftape is one of the packages included with Slack. It''s the actual driver

    that runs your tape drive. Once you install it from the Slack disks, that''s

    it! No setup is required.'
  merge: -1
