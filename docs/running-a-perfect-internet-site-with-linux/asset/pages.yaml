  md: '4. To add the news aliases so that it points to root (to enable people to send
    e-mail to the user news and have that mail go to the system administrator), add
    the following line:


    ```

    news: root

    ```


    5. To add the usenet aliases so that it points to root (because some programs
    and scripts want to send mail to usenet instead of news), add the following line:


    ```

    usenet: root

    ```


    6. Save and exit the file.


    Now, to make your system has the new version of the aliases file in memory, type
    newaliases and press Enter.


    # Adding INN to System Startup


    With most of the servers you''ll deal with in this book, add them to the file
    inetd. In this case, INN goes in the file rc.local. The reason for this is that
    the servers listed in inetd are started when they''re needed; for example, when
    someone tries to get into your system via Gopher, the Gopher server starts up
    and handles the request. INN, on the other hand, sits quietly in the background
    all of the time, so it needs to be listed in rc.local among the other startup
    processes. The file rc.local is the last system startup script that''s run when
    you''re booting your machine. It''s used to start up daemons and servers.


    To add INN to the startup items for your system, do the following:


    +   1. Log in as root.


    +   2. Change to the /etc/rc.d directory.


    +   3. Edit the file rc.local.


    +   4. To add INN to the list of items to run at startup, add the following line:


    ```

    /usr/lib/news/etc/rc.news

    ```


    The program rc.news is your INN startup script.


    +   5. Save and exit the file.'
