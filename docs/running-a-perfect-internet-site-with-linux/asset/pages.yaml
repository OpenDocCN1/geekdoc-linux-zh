  md: '# Installing Linux


    Type unless you''re just adding more software packages at the moment, then hit
    Enter.


    There are two main filesystem types that are used for Linux. There are the xafs
    filesystem, and the second extended filesystem (ext2).

    If you are adding new software to a system that has already been installed, you
    must enter the filesystem type it currently uses.

    If you''re installing to a new system, you can try either filesystem type.


    # Note


    By either filesystem type the installation program is referring to the filesystems
    or ext2.


    Which of these two filesystems to use is one of those that some Linux users like
    to argue about needlessly. Both are good filesystems, and it''s hard to say whether
    one has a significant speed or reliability advantage. Ext2 does feature that xafs
    doesn''t have yet-as an ext2 partition is unmounted before being written to it.
    When the machine is rebooted, checking is skipped for any partitions that have
    the clean bit on. For this reason, ext2 systems boot faster than xafs systems,
    checking in /etc/rc.d/rc.s. If you use xafs for your root partition, you will
    see some warnings when you shut the system down. These are harmless and can be
    ignored.


    What filesystem do you have (or do you plan to use) for your root partition (/dev/hd1),
    [ext2]fs or [xafs]fs


    Note that the last sentence refers to the root partition you defined a couple
    of steps earlier. Now, if you have any preferences, go ahead and follow this.
    I recommend ext2fs for the reasons given above, such as a fast booting system,
    so I will type e. If you would like to use the xafs file type, type x.


    Since you''ve chosen to install Linux from scratch, we want to be sure how to
    proceed, and we also want to give you one last chance to change your mind. When
    using this option, you must install to a blank partition. If you have not already
    formatted manually you must format it when prompted.


    Enter [i] again to install from scratch, or [a] to add software to your existing
    system.


    Install fresh, or add software to your current system? ([i]nstall, [a]dd)?


    Once again, if you''re installing a brand new version of Linux, type i. If you
    are adding more software to set your setup (for example, perhaps you realize later
    you wanted a package that you said no to before), type a.'
