- img_proc: true
  md: '# Chapter 2

    What Kind of Hardware and Connection You Need


    Equipment and connection types are important, but they become even important when
    you set up a site. This is especially true if you make your site an Internet provider,
    in which case you need to seriously consider what you want to be able to provide
    with early; its much harder to make additions later. Keep in mind that as hardware
    updates are, adding one thing to a system will usually cause three seemingly unrelated
    things to break. If you''re going to provide service to outside users, it''s an
    excellent idea to be as ahead of the game on hardware as possible. Users don''t
    need to be very patient when systems have to go down for upgrades and unexpected
    glitches!


    In this chapter, you learn how to:


    +   - Choose necessary hardware

    - Determine the connection type you need

    - Find the best provider for your site


    # Choosing Your Hardware


    Choosing hardware is mostly a matter of mixing technical understanding with common
    sense. The technical side is that each aspect of your computer''s hardware affects
    the speed and efficiency of your services. The common sense'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'side is to get the best hardware you can afford, focusing on which pieces will
    give you the most bang for your buck when it comes to what services you want to
    have available.


    What hardware you need is subject to many variables. If you determine that what
    you need is more than you can currently afford to buy, decide what is most important
    to you in the beginning and where you can skip for. Some hardware is more easily
    upgraded or added to than others, for example.


    # Note


    Because you''re focusing on setting up an Internet service, some hardware is more
    important than others. For example, your main server''s graphics capabilities
    can easily be next to nil. The only machines that will need to be able to display
    graphics are the ones you want to be able to display graphics (e.g., for Web page
    development). Other items that aren''t necessarily important are:


    +   - Sound card Your main server likely won''t need a sound card. Again, this
    hardware is only really necessary on machines where you want that capability.


    +   - CD-ROM drive The presence of the CD-ROM drive is entirely up to what you
    want to do with a machine. If you have a number of machines that you will occasionally
    use a CD-ROM with, one option is to get an external SCSI CD-ROM and SCSI cards
    in all machines where you want to use it. Then, you could shuffle the drive to
    whichever machine you''d like it on at the moment.


    +   - Backup system You likely won''t need a tape (or other type) backup on every
    machine on your network. You can use your tape backup on more than one machine
    on the network even if it''s internally mounted on just your server! (Chapter
    13, "Maintaining Linux," covers tape backups.)


    For the services you offer, there are both server and client machines. The server
    machine provides the service in question (e.g., FTP, World Wide Web, X-Windows).
    The client machine accesses the server machine and utilizes its services (e.g.,
    FTPing files, browsing the World Wide Web, using X-Windows). The server doesn''t
    need to have all the capabilities necessary to run the service unless it''s a
    client using the service as well. For example, a server that provides X-Windows
    to other machines doesn''t need to have the graphics card and monitor to run X-Windows
    unless you need to run X-Windows on it.'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'However, be sure to provide yourself with a way of testing your services! The
    server offering a particular service cannot use that service (e.g., provides X-Windows
    but doesn''t have the graphics capability to use it), be sure you have a way of
    testing it. Once again, with the X-Windows example, be sure you have at least
    one machine that is capable of using X-Windows. Otherwise, if you install X-Windows
    items for remote users, you''ll have to trust that the server and software is
    working properly; you can''t verify that they are.


    # Caution


    Consult the Linux Hardware How-To (listed in Appendix F) for brands of hardware
    Linux supports a wide range of makes and models, but drivers aren''t always available—occasionally
    new items come out or specs are unobtainable. You can save yourself a lot of hassle
    by consulting the hardware how-to carefully.


    # Tip


    For-to-date information on the types of hardware available, check out the PC Hardware
    FAQ by FTP rtfm.mit.edu, in the directory /pub/usenet/news.answers/pc-hardware.
    It comes in five parts.


    # How Your CPU Affects Performance


    The speed of the CPU directly affects how quickly your computer processes. The
    speed of the CPU is the baseline speed from which all other performance is measured.
    If you''re going to run a site for yourself and one or two others, and you''re
    going to use your server as your primary console, you can get it by a 486DX33.
    However, even with a low load, this server may be a little slow (especially if
    you intend to use X-Windows). If you''re going to have multiple machines, and
    you''re going to use your server as a server and not as a console, a 486DX33''s
    speed can be sufficient.


    If you will have more than three or four users, you will likely want a faster
    server (see table 2.1). It becomes es important as you get more users that your
    server be used as a server, not as a console, except for server maintenance. However,
    do keep in mind that things like program compilation are heavily influenced by
    CPU speed. A compilation can take over an hour to do on a 486DX33, but only a
    few minutes on a Pentium. While you compile the code, everything else slows down
    (mail processing, mail writing, file editing, and whatever other things you may
    be trying to do).'
  merge: -1
  pgno: 44
- img_proc: true
  md: '> Using your server as a console on a regular basis means you''re taking up
    RAM that would normally be used for server functions for your other tasks. You''re
    also using the server''s hard drive, CPU, CPU, and so on. The combination of these
    things means slower server response for all the services handled by your main
    server. Compiling large programs is especially slow unless you severely nice the
    process (nicing processes are discussed in chapter 5, "Setting Up Your Site for
    General Use")


    There are various types of motherboards on the market:


    +   - ISA, Intel Standard Architecture This motherboard is the old "standard."
    New machines don''t typically come with this motherboard because the computer
    world is becoming more graphics intensive, and this motherboard is particularly
    slow with graphics.

    - EISA, auEnhanced ISA This motherboard is a faster version of the ISA motherboard,
    but still compatible with hardware that was built to work with standard ISA boards.

    - VLB, VESA (Video Electronics Standards Association) Local Bus This board is
    a modern version (as of the writing of this book) of the ISA/EISA board. Its makers
    concentrated on speeding up the graphics handling of the previous boards. If you''re
    buying a machine that''s below the speed of a Pentium, you want to get a VESA
    board.

    - PCI, Peripheral Component Interconnect Step up from VLB, used on Pentium machines
    and faster. This is the best motherboard architecture for Intel and Intel-compatible
    machines.


    | Table 2.1 CPU Requirements Relative to Number of Users |

    | CPU | Usage |

    | 486DX33 | Two users Mailing list |

    | 486DX-2 66 | Five users Mailing list Small compilation |

    | Pentium | Ten or more users Three mailing lists Two compilations |'
  merge: -1
  pgno: 45
- img_proc: true
  md: '# Note


    The motherboard is the hardest part of your computer to upgrade, and the CPU is
    built into the motherboard. If you have to get a slower computer than you would
    initially, be sure to get that it is easily upgraded to faster speeds.


    A motherboard may require two basic types of RAM chips distinguished by the number
    of pins that connect the chip to the motherboard: 30-pin RAM, and 72-pin RAM.
    You should get a motherboard that uses 72 pin RAM, which is the newer type of
    chip and more technologically advanced (e.g., faster memory access).


    The type of RAM motherboard goes beyond pins. The time it takes to access the
    RAM in nanoseconds (ns) is also important. The higher the ns is, the slower the
    access. Also, the bus size (expressed in bits) is important for bandwidth. The
    more bits in the bus, the faster things pass through your RAM. Your motherboard
    manual will list the other important features your RAM must have, but I''ve discussed
    the ones that are important to look at when buying the RAM.


    # Tip


    Be sure that your motherboard is easy to upgrade memory-wise. The fewer requirements
    on what kinds of combinations of chips you have to have, the more flexibility
    you have in buying RAM.


    # Tip


    If you''re being offered a "steal" on a Pentium, chances are that you''re getting
    low-quality materials. Be sure that you''re getting fast memory.


    You can do a good number of things with a slower server, they will simply take
    longer—sometimes a lot longer.


    # How Your RAM Affects Performance


    The amount of RAM your computer has is a significant factor in how many processes
    your server can handle at once, and how quickly it can change through them. RAM
    can make the difference with things like:'
  merge: -1
  pgno: 46
- img_proc: true
  md: '+   - Processing mailing lists


    +   - Handling your news server


    +   - Processing multiple Web page requests


    +   - General X-Windows usage and using multiple processes within X-Windows


    In all the above cases, the more RAM you have, the more items (Web pages, pieces
    of e-mail, Gopher files) you can load simultaneously. This means that multiple
    requests are processed faster, because instead of going through one at a time,
    they''re going through 2, 5, or more at a time (see table 2.2). If you have a
    mailing list of 500 people, this can make *quite* a difference in how quickly
    the mail gets sent out.


    You should have *least* 8M of RAM for a site for personal use. If you have a few
    users, and one server handling everything, you will likely want 16M of RAM. If
    you have more than 4 or 5 simultaneous users, you may want more than 16M. This
    is especially true as the numbers get even higher.


    How much you need as number of simultaneous users depends often on what the users
    are doing on your system. Once you get about 8 simultaneous users, one rule of
    thumb is 2M of memory for each simultaneous user. I stress *simultaneous* users
    because you don''t need 200M of RAM if you have 100 users registered on your system.
    Instead, if you have 28 users to cover these cases, you need 28x2 or 56M.


    If most of your users don''t use applications that take up a lot of memory, you
    can do with less than 2M per user.


    | Table 2.2 RAM Requirements Relative to Number of Users and Usage Requirements
    |

    | Users | Usage | Amount of RAM |

    | Two | Mailing list<br>Incoming news | 8M |

    | Five | Two mailing lists<br>Incoming news<br>Two Web page requests | 16M |

    | Ten | Three mailing lists<br>Incoming news<br>Six Web page requests<br>Three
    Gopher requests | 24M |


    ![](img/df069eac9f46c8d8f72de31230fb3cab_47_0.png)'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# Choosing Your Hardware


    # 29


    > Note

    You may find that you can live with the results of less RAM recommended. RAM is
    simple to upgrade when it comes to your system, as long as the RAM works on your
    motherboard. There''s no software reconfiguration required after the upgrade,
    if you would rather skimp on the RAM for now and see how it does, it''s not really
    a problem. If you have lots of users lined up, simply be prepared to dash out
    and buy more RAM as payments come in. See chapter 15, "Upgrading Your System"
    for considerations on how to handle the upgrade.


    If you have skimp on RAM, you can make up for it with swap space. Swap space is
    the space you assign on your hard drive to act as spare RAM, so that when you''re
    using your RAM at full capacity, you still have room to do other things. For a
    more detailed discussion of swap space, see chapter 3, "Getting Ready To Install
    Linux from the CD-ROM."


    # How Your Hard Drive Affects Performance


    For a site with one or just a few users, the hard drive isn''t the primary consideration
    when it comes to performance. However, as the number of users and demand on services
    increases, the size and type of your hard drive becomes more important.


    # Choosing the Size of Your Hard Drive


    The size of hard drive you choose depends on how much you want to store. You will
    want a minimum of 200M for a full site Linux installation. Unless you''re running
    a site for yourself and don''t intend to do much, you will want more space than
    that. With the prices of large hard drives dropping as they, aim for a minimum
    of 850M hard drive.


    You can set quotas for your users. Often, 10M per user may be a good starting
    place (I have seen as low as 1M per user). Because there are free people get a
    bit excessive, up to 20M in the home directories. Drive space usage depends on
    how much mail and news people say, how many personal clients install, and how
    many other programs and files keep lying around. Using quotas forces people to
    keep their home directories tidied and not to let old stuff lying around.


    Remember that the 10M per user does cover mail storage, news storage (if you run
    your own server), POP storage, UUCP storage, and so on. You need to include space
    for storage of all these items (the ones you''re using) in your estimates. Try
    to anticipate on the high side to save yourself some grief later.'
  merge: -1
  pgno: 48
- img_proc: true
  md: '# 30 Chapter 2—What Kind of Hardware and Connection You''ll Need


    > Tip

    If you''re unfamiliar with POP and UUCP, see chapter 6, "Installing E-mail Software."


    # Choosing the Type of Hard Drive


    As you get more users, the access speeds for your hard drive, and therefore the
    drive type, become more important. Even if you don''t have a huge number of users,
    the drive type is important if you have a lot of traffic among services that are
    drive intensive. These services include:


    +   - Electronic mail, mailing lists especially

    - News, especially if you run your own server

    - Web pages with a lot of pictures


    The hard drives that most people buy with their computers are IDE drives (the
    standard internal hard drive most people own). These drives are great for most
    users, but they can access only one file at a time. If you''ll be running a large
    site you should seriously consider getting a SCSI drive.


    SCSI hard drives can access multiple files concurrently; get one of these drives
    if you want faster, more efficient file access. A SCSI drive speeds up mail and
    news processing immensely!


    > Tip

    A fast SCSI drive also makes for faster swap space than an IDE drive.


    Once your site has hundreds of users, consider buying a Redundant Array of Inexpensive
    Disks unit (RAID). A RAID unit contains a number of disks all working in parallel.
    It acts like one huge drive, but instead stores your site''s information on a
    number of disks instead of just one. When your site has thousands of users, one
    of these storage units is absolutely necessary.


    # How Your Monitor and Card Affect Performance


    The monitor and video card are only important on machines where you will run X-Windows.
    You will want an SVGA card (if you can afford it, get an accelerated one) and
    a monitor that works with the card. Be sure to have enough memory on the card
    to handle the graphics modes you want to'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# Choosing Your Hardware 31


    able to use (this information should be available in the card''s manual, or from
    the salesperson). This would be typically 1 to 2M of VRAM (Video RAM).


    Of course, if you don''t to run X-Windows (or see graphics) on a particular machine,
    there''s no need to have a high-end graphics setup for it. You only need to consider
    graphics capability on machines where you want to be able to use graphics.


    # Caution


    It is imperative that you check with the Hardware How-To to be sure that Linux
    X-Windows supports your card and monitor.


    # Dealing with Power Outages


    You don''t want UNIX systems like to die with a power outage. Not only will all
    your users be unhappy, but you will lose all the partial files and bits of data
    sitting around in your system''s memory that were supposed to be written to disk.
    One item you''ll want to seriously consider for your site is an Uninterruptible
    Power Supply (UPS).


    UPS''s have power ratings on the packaging. Take a look at the power supplies
    on the backs of your computers, monitors, and any other devices you want to plug
    into them. Add up the wattage on all of these and find a UPS rated for many watts.
    If you have a large number of machines, you may find that it''s easier and more
    economical to buy a number of UPS''s. There''s nothing wrong with having more
    than one, and in fact it''s a nice redundant system.


    The more items you have plugged into a UPS, the faster its battery will drain
    out, so it''s not a good idea to put important equipment on one UPS. You may want
    a single UPS for your main server and its monitor, and another one for peripheral
    machines.


    A great feature to have on the UPS is a network port, which is a serial port going
    into the back of the device. You connect this to a serial port on one of the machines
    is connected to. You can then use the unipower package (the Hardware How-To lists
    to get this item by FTP). This package watches your UPS serial port. If it gets
    a signal from the UPS, it knows that the power has gone out and needs to start
    a shutdown (you set the amount of time before it shuts down). If it gets a second
    signal before shutdown, the program knows that the power is back or it was just
    a spike, and cancels the


    ![](img/df069eac9f46c8d8f72de31230fb3cab_50_0.png)'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'shutdown. This gives your system a chance to save everything from its buffers.


    | Caution |

    |---|-

    Be sure to look in the Hardware How-To to make sure you get a UPS that has a driver
    available. |


    | Tip |

    |---|-

    You need a nonstandard serial cable for the network port. Be sure to ask about
    the cable(s) when you go to buy the UPS(es). |


    # Providing Dial-ins


    If you intend to provide dial-ins for your users, you need to provide mo-ems for
    them to dial into. What method you use to provide these dial-ins depends on the
    number of people you want to allow to connect at once.


    # Small Number of Dial-in Users


    If you want to only allow 16 or less dial-ins at one time, you can get multiport
    serial cards. See the Hardware How-To for what multiport cards have drivers available.
    Be sure to get the DB25 boards, which have cabling for external modem hookups.


    These cards come with various numbers of ports, typically 4, 8, and 16. Remember,
    you will need an incoming phone line for each dial-in, and a modem to connect
    the phone line and the card.


    Total number of modems you need = (number of people trying to get in during your
    peak hours) × (average length of each connection in minutes) × (0.0238)


    Chapter 5, “Setting Up Your Site for General Use,” has more information.'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Large Number of Dial-In Users


    If you need more than 16 incoming connections, you should get a terminal server.
    You might be able to fit extra multiport cards into one machine, but it will be
    so slowed down by handling all the logins that your you server won''t be very
    useful for anything else. If you get a terminal server, it can handle the logins,
    and your site server can handle everything else.


    Use the same formula as listed in the previous section to keep track of how many
    dial-ins you have.


    The key to buying a terminal server is to buy one that has plenty of room to upgrade.
    Buy one that supports the number of dial-ins you feel you need, and with room
    to expand as far as you think you may need in the near future. If necessary, you
    can always buy another terminal server.


    For information the terminal servers available, look in the following places:


    +   - Your service provider may be able to give recommendations. However, they
    may not know the competition, so be careful if you intend to be their direct competitor
    at some point down the road. If they see you as a threat, they may not be eager
    to be helpful.


    +   - Computer trade shows will likely have companies selling terminal servers.


    +   - There are a lot of ads on the World Wide Web for high-end computer equipment,
    terminal servers included. Check out http://www.infocomnet/~linuxisp/equip.html,
    which is a list of Linux Internet service providers. You can follow a link to
    see what specific equipment these providers use for everything from servers to
    ISDN, to multiport cards, to terminal servers. There are links from here to the
    companies who make this equipment.


    # Choosing Your Connection Type


    The speed, or bandwidth, of your connection makes all the difference in the world
    when it comes to how quickly your data will travel to and from the Internet. Think
    of your bandwidth as lanes on a highway. The wider the road, the more data can
    pass through.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# 34 Chapter 2—What Kind of Hardware and Connection You''ll Need


    If you think you may want something faster than the SLIP/PPP modem connection,
    check around units with your local service providers and phone company to see
    what options you have, and what the costs are. Costs and availability of connections
    vary widely from place to place. There may even be alternative companies that
    can offer you faster digital connections.


    > Note

    When I discuss numbers of users regarding bandwidth, I''m talking about the number
    of users who are using the Internet connection at the same time.


    The bandwidth you need depends on your site''s demands. Let''s take a look at
    the options.


    # SLIP/PPP Over a Standard Voice Line


    If you will have only a few users, a 28.8 kbps permanent connection is sufficient
    for most occasions. Also, this option is probably the least expensive you will
    find in your area. Make sure that the number you dial to connect to your provider
    is not a toll number because you''ll use it all the time!


    > Note

    If you want to move up to the next step factor in connections (ISDN, which is
    discussed in moment), but it is far too expensive, another alternative may be
    to use two 28.8 KB modems and two standard phone lines. Using a technique called
    EQ load balancing, you can then use the two lines together to double your bandwidth
    (if your provider supports this). If you consider this option, be sure to check
    into the cost of upgrading to ISDN and into the cost of permanent connections
    to the provider. You can then weigh the options and choose the least expensive.
    See the Net-2 How-To for more information.


    # ISDN


    ISDN (Integrated Services Digital Network) doesn''t use standard modems. Instead,
    it uses digital modems (or a computer designated to only be your router, routing
    your data into ISDN protocols). With this type of connection, you get 64 kbps
    speeds, and it still has a spare channel you can use for voice (and fax, and anything
    else you''d like to use it for) over the same line! If you don''t want to use
    your ISDN line for voice communications, you can combine the two primary channels
    (called bonding) to get 128 kbps! Small providers and businesses often use ISDN
    connections.'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'The ISDN line has two types of channels, labeled D and B. The D channel carries
    16 kbps and is used for signaling, which means it carries all the control information
    necessary to handle the connections data channels use. The B channel (the primary
    channel I referred to earlier) carries 64 kbps and is used for data transmission.


    Often an ISDN connection comes with a D channel plus two B channels, giving you
    16 kbps of data transfer plus 128 kbps of data transfer. However, sometimes the
    phone company charges extra for the second B channel. This can be for a number
    of reasons, one being that phone company''s lines might need to be upgraded before
    it can offer that high of a transfer rate to your location.


    Unfortunately, ISDN is not available in some areas yet, because while it runs
    on standard copper phone lines, it doesn''t behave like a standard phone line.
    The phone company has to be set up in your area to support its special behavior
    before it can offer ISDN. Some of the differences are:


    +   - An ISDN line has no dial tone. It simply “connects” to the hardware at the
    other end.


    +   - ISDN requires special 8-pin phone jacks at your end, instead of the standard
    4 pin.


    +   - ISDN requires 4-wire phone cabling instead of the standard 2, so your house
    or office would need to be rewired.


    > Note

    The ISDN I''m discussing here, the one that works over copper wire, is technically
    Narrow ISDN. There is another version that works over fiber optics lines, called
    Broadband ISDN (B-ISDN). Of course, fiber line is much faster for data transfer
    than copper. At the time this book was written, B-ISDN was still moving in development
    stages, but you may want to ask your phone company how close it is to a reality
    in your area.


    You need to buy extra equipment if you use an ISDN connection. You''ll need at
    least one of the following:


    +   - Digital equipment Digital modem, phones, fax, and so on. Any equipment used
    to work on your analog phone line will not work on the new digital setup. This
    is because the new setup won''t have a dial tone. Keep in mind that you can have
    only one device per B channel.'
  merge: -1
  pgno: 54
- img_proc: true
  md: '+   Terminal adaptor (TA) This piece of hardware can serve as an interface
    between your old equipment and the new line. You could then connect your computer
    via Ethernet to the TA, and your other devices directly to it as well without
    having to buy digital equipment.


    +   Router A dedicated machine can feed your data to the Internet, plus serve
    as a terminal adaptor (if you buy a router, you may not have to buy a TA). Linux
    doesn’t require a special routing machine, however, as it can handle routing itself.


    # Caution


    Be sure that one of the units you buy to handle your connection also provide power—a
    number of them are designed to do so. If they are, you don’t have to add extra
    power outlets to your office. ISDN lines don’t contain enough power in themselves
    to run your phones. If your power goes out, you will also lose phone service and
    your connection. A UPS may be helpful in giving you some time to shut things down.


    Your phone company and service provider should be able to advise you of the best
    equipment options available at the time you’re looking into buying. Shop around
    as much as you can, as rates can vary widely even within a small area. You may
    find that you can lease or rent the equipment you need.


    # Tip


    You may want to pick up Que’s Special Edition Using ISDN if you plan to use an
    ISDN connection. The WWW also has a great deal of information about ISDN.


    Linux drivers for ISDN cards are still in the experimental stage. See the Net-2
    How-To for up-to-date information on what’s available. You’ll need to keep in
    mind what equipment you can get drivers for when you make your purchases.


    # T1


    T1 lines are even faster digital connections—1.544 mb divided over 24 channels
    (which can be subdivided further) traveling along twisted-pair copper wires. These
    are serious, expensive connections that also require the phone company to lay
    a line to your location (which means you will need to discuss it with your phone
    company and find out the costs involved).'
  merge: -1
  pgno: 55
- img_proc: true
  md: '# Choosing Your Connection Type


    You will also need to buy or rent special hardware to run and maintain your connection,
    and find a provider that has the bandwidth to be able to feed your T1 connection
    to the Internet.


    As ISDN, a T1 is a digital line, with the same types of considerations involved
    (lack of dial tone, special digital equipment required). Often, you can lease
    or rent the necessary equipment for your end and/or phone company (e.g., a router
    machine to handle your Internet connection, phones, and so on).


    With T1, you can use the software in the router to manage each of the 24 channels
    goes. You can assign them to voice transmission (phones), video transmission,
    and so on and even change them dynamically according to your needs. The handy
    is the thing that you don''t need special software or drivers on your Linux machines
    to use the T1 connection. You simply network the router to the rest via Ethernet
    and the router handles the rest.


    Again, as with ISDN, talk to your phone company and your provider for up-to-date
    information on the hardware and software available. Shop around. Check out the
    Web—a number of companies are already offering hardware there.


    The advantage of buying from your service provider, phone company, or a local
    computer consultant is that you can probably get your router preconfigured to
    the necessary settings. Then, you can simply take it, plug it in, and just do
    a little setup. If you buy from a remote manufacturer, you may have to go through
    the headaches of getting all the settings from your phone company, provider, and
    so on. If you find''d rather buy from a remote manufacturer, be sure to discuss
    what you will need to do when the machine arrives so that you''re prepared as
    possible.


    | Tip |

    | You can get a router machine for ISDN connections as well. You don''t need one,
    however, because of the availability of digital modems. Linux machines can handle
    routing yourselves.|


    | Tip |

    | You might not be able to afford a T1 line for your site, but you may be able
    to find an affordable FT1 (fractional T1) connection. These lines are generally
    offered in a multiple of 56 kbps, up to the T1 bandwidth of 1.54 mbps.|'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'Large corporations, universities, and large service providers generally use
    T1 lines and FT1 lines.


    > ### Tip

    nYou can use parallel T1 lines to gain bandwidth. A provider I dealt with recently
    around 8,000 subscribers, and was using multiple T1 lines.


    # T3


    T3 lines are the cream of the crop, at 45 mbps (equivalent to 28 T1 lines) traveling
    along special cabling containing fiber optics. T3 connections are rare because
    the expense and the special cabling.


    An important thing to note about T3 is that no specific standard for all T3 lines
    exists. You''ll need to ask your phone company about the specifics of how its
    T3 connections are set up. What they all have in common is they are all high-speed
    digital lines. Therefore, again, you will need specialized equipment to handle
    the connection, the phones, and so on. Your phone company and/or provider can
    be of assistance with either leasing the equipment, or with pointing you to a
    good manufacturer.


    > ### Tip

    You can get a partial FT3 connection. In fact, you can get partial FT3 through
    T1 technology.


    Only the largest sites will need and can afford T3 lines. If you find that no
    combination of T1 lines is enough for your site, it''s time to move to T3.


    # Cable Companies


    Cable companies are slowly maneuvering themselves into the market of service providing.
    Their coaxial cable can handle up to 10 mbps, which makes it an excellent transmitter
    for voice, video, Internet data, and so on. Most cable companies are not yet poised
    to enter the providing market. There are some interesting experiments going on
    in various communities, however.


    These experiments mostly involve the principle of the Information Superhighway,
    integrating video-on-demand services, video catalogs to browse, multiplayer games,
    home shopping, standard cable television, Internet access and more. The techniques
    and technologies used in the various test runs are different, as well as the services
    offered.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Choosing Your Connection Type


    You may want to check with your cable company and see how far they are from offering
    such services in your area. The connections they offer are digital, requiring
    "cable modems to handle the Internet connection, and special boxes often containing
    high-powered computer motherboards to handle the video aspects.


    # Phone Companies


    Phone companies are also maneuvering into the Internet service providing business.
    Some are already there to a limited extent, while others are just entering the
    market. To find out what your phone company has available, contact its customer
    service department or if it has one, its technology or networking department.


    Often, the networking services offered by the phone company are bundled with digital
    connections (e.g., ISDN, T1, and so on.


    One new item to watch out for is a new method of high-speed communication over
    standard copper phone lines developed by AT&T Paradyne. It''s called GlobeSpan;
    it''s digital; and it gets an amazing 6 Mbps!


    # Connection Summary


    The connection''s section contains a lot of important information to digest. In
    general, the speed of the connection you need is related to the number of simultaneous
    users you''ll have on your site (see table 2.3). These are simultaneous users—users
    who are all logged in and taxing your connection at the same time.


    Your mileage may vary. It''s best to make sure that you have room to upgrade your
    connection if you need to.


    | Table 2.3 Which Kind of Connection You''ll Need for Number of Users, Considering
    Usage Time |

    | Max Simult. Users | Usage | Connection Type | Notes |

    | --- | --- | --- | --- |

    | 5 | Low | 28.8 Modem | |

    | 3 | High | 28.8 Modem | |

    | 20 | Low | ISDN, 1B | If available in your area |

    | 12 | High | ISDN, 1B | If available in your area |


    (continues)'
  merge: -1
  pgno: 58
- img_proc: true
  md: '| Table 2.3 Continued |

    | Max Simult. Users | Usage | Connection Type | Notes |

    | --- | --- | --- | --- |

    | 40 | Low | ISDN, 2B | If available in your area |

    | 30 | High | ISDN, 2B | If available in your area |

    | 100''s | Low | T1 | If available in your area, if you run into thousands of
    users you will eventually need more than one T1 |

    | 100 | High | T1 | If available in your area |


    > > Note: By low, I''m referring to that number of users doing things that don''t
    take up a lot of solid Internet connection time. These are things like using the
    Web (not a lot of graphics or FTP links), Gopher, IRC, and other nonbandwidth-intensive
    services.

    >

    By high, I''m referring to that number of users doing things that take up a lot
    of bandwidth. These are things such as using the Web and accessing a lot of Web
    graphics or FTP links.


    # # Choosing Your Provider


    It''s important to shop around when you''re looking for a provider to carry your
    site to the Internet. Your location will determine how many providers you have
    to choose from, and what services they can offer you.


    Some things to consider in choosing your provider are:


    +   1. Expandability How much do you think you will expand with time? Are you
    starting with a 28.8 SLIP connection and think one day you may need an ISDN or
    T1? Try to pick a provider that can support at least one step of growth. You don''t
    want to have to tell InterNIC that you''ve moved too often because of the time
    it can take to get all your routing straightened out. You could end up in limbo
    if the Internet thinks it''s supposed to send your packets to one location, but
    you''re at another.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# Choosing Your Provider


    2. **Affordability** Prices for services can vary widely. One local provider quoted
    me a setup fee of over two thousand dollars for a standard 28.8 SLIP permanent
    connection while another provider waived the fee because it was a simple setup,
    and I could handle most of the setup on my own. To realistically assess how much
    assistance you want when discussing setup fees. I had set up such a connection
    before, so, for me, doing it wasn''t a big deal. Setting up a much more complex
    connection where I''m unfamiliar with the technology involved might be something
    I don''t have time to fool until I get it right. Sometimes, it''s worth paying
    a setup fee to have the extra technical support. Some providers won''t waive the
    setup fee because they assume you will need their technical help at some point.


    3. **Reliability** Ask around, find out other people in your area have to say
    about the available providers. Keep in mind that you will not be going through
    the provider''s normal system. Basically, with a permanent connection (even a
    modem at 28.8) you''re connecting to a machine that goes straight to the Internet
    instead of going through the provider''s internal network. Therefore, you probably
    want to find someone who has a permanent connection of the same type you want
    with the provider you''re checking out (e.g., if you want an ISDN 2B connection,
    see if you can find someone who has one, and ask him how reliable it is and what
    is the technical support and customer service).


    When it comes to permanent connections, providers will sometimes offer references
    in the form of other customers. You can also check on local newsgroups through
    Internet connection.


    Note


    If you''re eager to get the installation, you can get your server machine and
    install Linux now. You don''t need to be connected to your provider to set up
    the basic system or the servers themselves but you won''t be able to test the
    servers until you''ve got your system connected to your provider. Also, you don''t
    need any other machines for your site until you have the server set up, because
    it''s the machine that will run your entire network. Once you set up the server,
    you can install Linux on the other machines.


    If you don''t want to set up any extra machines until the server is fully functional,
    you can install client programs on the server to test it. However, if you don''t
    want to bog down the server with such items, you may want to set up one additional
    machine, network it to the server, and test your clients on that machine. You
    should do this especially if you want to test Web items with graphics, and don''t
    intend to get a server that can handle graphics display.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_60_0.png)'
  merge: -1
