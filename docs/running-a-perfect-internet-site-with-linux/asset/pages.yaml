  md: 'Will you need to use subnets? Reasons for using a subnet include the following:


    You will mix networking technologies (e.g., token-ring and Ethernet networks on
    the same site). This requires one subnet for each technology.


    You need to have one portion of your network set aside for extra security.


    There''s a chance that part of your network will crash often, perhaps because
    it''s experimental. You will want this part on a separate subnet it won''t take
    down your whole network.


    Your network will be too physically spread out to be all on one network because
    of cable length restrictions.


    If you have to use a subnet, lose the use of possible IP addresses. For example,
    if you want a network with 2 subnets and you have a class D address, you would
    have two networks (subnets) each with 126 possible hosts. If you have 4 subnets,
    each could have at most 62 hosts. Setting up subnets is discussed in more detail
    in chapter 5, "Setting Up Your Site for General Use."


    Address space is scarce on the Internet. If InterNIC feels that you''re being
    overzealous during registration time, it will try to talk you down to lower numbers.
    If you need more IP addresses later, you can get them; they just won''t be in
    sequence with the ones you already have.


    Getting Your IP Addresses Assigned. To get IP addresses assigned to your site,
    you need to write to InterNIC or to the appropriate agency for your country (if
    you''re unsure of where your country is covered, write to the service that looks
    likely for clarification). Any region not covered is probably covered by InterNIC.


    | Table 1.1 IP Registration Services for Sites Outside the United States |

    | Country | Service |

    | Asia-Pacific Region | AP-NIC E-mail: hostmaster@apnic.net Fax: +81-3-5276-6239
    |


    (continues)'
