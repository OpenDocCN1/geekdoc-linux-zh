  md: '# Chapter 7—Installing Web Server Software


    ```

    <Directory /usr/local/etc/httpd/cgi-bin>

    Options Indexes FollowSymlinks

    </Directory>

    ```


    Rather than just being a one line item, the Directory directive is a statement.
    It begins with setting the directory. Just take a look in your server configuration
    file and see what you set ServerRoot to, in case you changed it from /usr/local/etc/httpd/.
    Then, add cgi-bin after it. In my case, I left it at the default, so I''ll just
    enter:

    Directory /usr/local/etc/httpd/cgi-bin


    Now, tell your server the features available in this directory (Options). Your
    choices are the following:


    +   - None enables no features in this directory. This is the ultimate security,
    as someone using your Web server would be completely unable to do anything in
    this directory.


    +   - All enables all features in this directory. Don''t use this unless you really
    want to give users access to everything, including users'' home directories. In
    fact, if a symlink is created from a user''s home directory to a directory that
    you don''t want outsiders to be in, this option will let outside Web users employ
    that link.


    +   - FollowSymLinks enables the server to follow symlinks out of this directory.
    Watch out, though, if the symlink is in a user''s home directory, a link may be
    created to something you don''t want outsiders to access.


    +   - SymIfOwnerMatch enables the server to follow symlinks out of this directory
    if the link points to is owned by the same person who made the link. This one
    takes care of part of the symlink problems mentioned above. Outsiders won''t be
    able to follow a link unless the file it''s linked to is also owned by the user.


    +   - Indexes enables the server to let people request indexes of the current
    directory and lets outside users get HTML indexes of the directory they''re in.
    If you don''t use this option, users won''t be able to get any other index files
    in this directory. If you intend to offer HTML file indexes with descriptions,
    use this option.


    +   - Includes enables the server to let users offer information on the fly, as
    the date file was last modified.'
