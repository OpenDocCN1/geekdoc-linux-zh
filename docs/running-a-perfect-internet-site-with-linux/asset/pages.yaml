  md: '# Keeping Track of Usage Time for Accounting Purposes


    If you''re running a site that requires you to bill for SLIP line usage, you''ll
    need to recompile your kernel and say yes to the IP accounting option (see chapter
    16, "Upgrading Your Software" for more on compiling a new kernel).


    Check out the Linux Documentation Project Web pages for pointers to accounting
    programs (see appendix C for a listing of URLs for the LDP pages).


    # Informing Users of Internet Etiquette


    It is the responsibility of system administrators to be sure that users know where
    to find resources explaining Internet etiquette. This is partially to ensure a
    good reputation for your site, especially if it is a large one. You don''t want
    a reputation for having clueless users who consistently don''t appear to have
    any idea of what they''re doing!


    You can''t force people to read documentation, or be sure they read it if you
    put in safeguards that they say they did. However, you can provide an explanation
    of why it''s important to understand a bit of how the Internet works (most people
    don''t want to look clueless) and pointers to recommended reading. The best way
    to do this is through including this information in the initial e-mail you send
    to users as their account is set up (more about this in a moment).


    There are a number of excellent resources on the Internet regarding Internet etiquette
    (netiquette). On UseNet, these resources (which you may want to require your users
    to read):


    +   - **news.announce.newusers** Periodic postings (twice a month) to aid new
    users to UseNet. Includes technical explanations of how things work, and netiquette
    advice.

    - **news.newusers.questions** A place where users use UseNet can ask questions
    and get answers from more experienced users.


    Also, if your users want FAQs for almost any newsgroup, you can find them by FTPing
    to **rtfm.mit.edu** and going to /pub/usenet.


    # Acceptable Use Policy


    It''s important to set up an Acceptable Policy for your site. This policy should
    detail:'
  merge: -1
  pgno: 120
- img_proc: true
  md: '+   Any time limitation policy you might have, such as not allowing users to
    camp on your lines 24 hours a day, 7 days a week.


    +   Any service limitation policy you might have, such as not using your FTP server
    to transfer items that are illegal where your site is located.


    +   Any general Internet abuse policies you have, such as not harassing other
    people on the net and not spam newsgroups.


    +   The actions that can be taken if your rules are broken.


    +   Any other rules you feel you need to state.


    The basic idea of your Acceptable Use Policy is to state the rules for your site
    up front. This helps new users to understand a bit of what is unacceptable behavior,
    and also gives you the room to deal with problem users without getting sued. If
    they break one of the rules in your AUP, you can point to it and show them exactly
    which rule they broke, and exactly where you said how that infraction would be
    dealt with.


    Some tips on putting together an Acceptable Use Policy are:


    +   Look at the policies the other providers in your area put together. They should
    be available on the providers'' Web pages.


    +   If you plan to run a large site, you may want to show your policy to a lawyer.


    +   Think through the things you don''t want people using your site for, or that
    you would consider excessive use of your site.


    Keep in mind that if you develop serious problems with a user that affect a good
    portion of the Internet, other system administrators may put a lot of pressure
    on your site to deal with them. It''s important to have the legal backing of your
    Acceptable Use Policy so you can deal with someone who''s flooding Usenet, or
    otherwise abusing the Internet.


    # Assigning User Disk Quotas


    If you''re concerned that your users will overrun your site''s hard drive space
    through their home directories, you can assign quotas to keep them limited to
    a particular amount of drive space.


    There are two types of quotas you can use, hard and soft. If you are seriously
    hard-pressed for disk space, you may want to use hard quotas. With hard'
  merge: -1
  pgno: 121
- img_proc: true
  md: 'quotas, the system will not allow the user to exceed the quota you assign,
    which can cause whatever they''re doing at the moment to crash. They won''t be
    allocated any disk space until they clean their usage down below the quota.


    However, if you have a leeway in your space, you may want to assign soft quotas.
    When a user reaches his limit with a soft quota, he can exceed that limit temporarily.
    This allows the user to finish the particular task he''s working on, and then
    clean out space. If the user doesn''t clean out space, and leaves usage higher
    than his quota, each time he logs in he will be warned. If the user persists in
    not cleaning the space, he won''t be allowed to use any additional disk space
    until he cleans his home directory back down below the quota.


    # Setting Your System To Use Disk Quotas


    Before you can assign user quotas, you have to tell your system that you intend
    to use them. First, however, you need to decide what particular directories you
    want to apply the quotas to. If you just want to assign user quotas, /home is
    a good choice, as all of the user home directories inside it would be affected.


    To set your site up to handle disk quotas, do the following:


    +   1. Log in as **root**.

    2. Edit the file /etc/fstab.

    3. To tell your system to expect quotas to be applied to, for example, /home and
    everything beneath it (with your home directories being for this case example
    on /dev/hda1 using the filesystem ext2), enter the following:

    ```

    /dev/hda1 /home ext2 rw,quota

    ```nThis sets the home directories to both readable and writable, and tells the
    system they''ll have quotas assigned to them.

    4. Save and exit the file.


    > > Tip

    If you mounted home directories from a separate drive, you can change the default
    entry to rw, quota instead of adding a new line.'
