  md: '# Installing LILO


    If you installed Ftape, a tape backup program, you''ll next get a prompt asking
    if the Ftape module should be loaded at boot time. If you want to activate Ftape
    at boot time so you can back up your system, type y. If you don''t intend to back
    up your system to tape, type n.


    > Note

    If you purchase a tape backup system in the future, or find that you want to install
    another package off the CD after installing, you don''t have to go through the
    install process again. To install something from the CD, do the following:

    1. Log in as root.

    2. Go to /slakware/ap1 on the CD-ROM.

    3. Copy the appropriate .tgz file (ftape.tgz) to the / directory (same thing as
    .tar.gz).

    4. Uncompress the file with the command gunzip ftape.tgz. You will get a file
    with the same package name, but a .tar extension.

    5. Untar the file with command tar -xvf ftape.tar. This will unpack the file and
    place it in the appropriate directories, relative to the / directory. It will
    also set the appropriate permissions.


    Next, you''re given the opportunity to set your default modem speed. You can change
    this value later, so don''t worry too much if you''re not exactly sure what you
    want to use. Select the option your modem can best support (if you''re using a
    modem) and press Enter.


    # Installing LILO


    At this point, you''ve installed most of your Linux system. Now you need to decide
    if you want to install LILO. LILO is the Linux Loader, a program that tells you
    which computer what operating system or kernel to boot.


    > Caution

    Be sure to have boot disks available for any other operating systems you may have
    on this drive. If something goes wrong with your LILO installation, your boot
    disk will be the only way to get back to OS until your LILO setup is fixed.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_96_0.png)'
