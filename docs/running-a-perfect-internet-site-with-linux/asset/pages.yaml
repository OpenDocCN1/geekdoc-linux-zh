  md: '# Adding Machines to Your Network


    Once you get your main server set up, you can start setting up the other machines
    in your network (if there are other machines). You can add all or some of them
    now if you want to be able to install some servers on separate machines, or have
    at least one machine other than the main server from which to test your services.
    Or, you can proceed and get your main server completely set up, and then come
    back and set up all or your other machines. The order you work in when it comes
    to adding machines to your network really depends on your personal preferences
    and needs.


    The work you need to do when adding machines is identical regardless of when in
    the site setup process you decide to add them.


    > Note

    You need to go back to chapters 3 and 4 to install Linux on each machine you''ll
    add. However, keep in mind that others are not your main server. You won''t need
    to install any of the main services on these machines, because they will use clients
    and look to your server instead. Other differences will be addressed in this section,
    so be sure to read it before you begin setting up the added machines.


    > Caution

    Be sure to pick your Ethernet cards from the list in the Hardware How-To. Also,
    be sure to get the proper cable types.


    # Telling the Server About Other Machines


    When you add a machine to your network, you have to tell the server that it exists.
    This ensures that the main server knows how to route each machine''s packets to
    and from the Internet, and within your own network. Fortunately, since the Linux
    setup utility takes care of storing the network information required for the other
    machines, all you have to worry about is adding them to the server.


    To add these files to your server, log in as **root** and edit the file /etc/hosts.
    For each machine—and each incoming modem line, and each device you want people
    to be able to connect to such as printers—you''ll need to enter two pieces of
    information: the IP address and a list of aliases.'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# Assigning IP Addresses


    Assign each machine and device its own IP address from within those as-signed
    to you. There''s no necessary order of what numbers to use. Most simply choose
    one number up as they add machines to the network.


    > Tip

    It''s helpful to put physical labels on machines, and especially modems. On a
    machine, use the IP address and name. On a modem, use the IP address and its phone
    number. This will save on running around time when dealing with technical problems.


    > Caution

    If you''re setting up subnets, be sure to read ahead in the section “Setting Subnets”
    before proceeding.


    # Assigning the Alias List


    This alias list includes the actual full domain name plus host name for the machine,
    plus any aliases you want to add, all separated by spaces. Aliases might include:


    +   - The host name itself, so people can telnet without having to type in the
    full host plus domain name.


    +   - Alternate host names, or alternate host domain names. You can use this to
    assign more than one name to a machine. For example, if you go to a Web URL of
    the format www.site.com, you''re really going to an alias for another machine.
    This both disguises which service is actually on, and makes it easier for people
    to find your Web server and FTP server.


    > Note

    Many sites like to name their hosts on a theme. It''s much more interesting to
    the sysadmin than looking at a list of meaningless host names like machine1, machine2,
    and so on. If you have a favorite hobby, sport, genre of movies or books, or time
    period, you can use it to come up with related host names. Just make sure not
    to pick something that will run out of options too quickly!'
  merge: -1
  pgno: 112
