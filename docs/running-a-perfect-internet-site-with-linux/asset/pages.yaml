  md: '# Configuring Your Web Server


    Build your personalized config file, conf/httpd.conf, and fill it in, following
    the same order as the example above. The following is a walk-through of the choices
    I made for my server configuration file:


    +   1. # ServerType is either inetd, or standalone.


    When reading this line, it''s easy to think you want inetd because you''ll be
    running a site on the Internet. You want to use standalone because you will have
    a lot less CPU load by letting httpd handle itself than you will if inetd has
    to take care of it. Therefore, the first line in your conf/httpd.conf file is
    the:


    ```

    ServerType standalone

    ```


    +   2. # Port: The port standalone listens to.


    The standard httpd port is 80. Generally, you''ll want to stick with standard
    ports, as doing this will make it easier for people to access your services. So,
    your second line reads as follows:


    ```

    Port 80

    ```


    +   3. # StartServers: The number of servers to launch at startup.


    Although there is a compiled default for the number of server processes that initially
    fork off, it''s best to go ahead and set a number anyway so you know you''re using.
    If you accept the defaults, you won''t know what settings you''re using unless
    you dig through the source code to find what they are.


    I chose to use the same number of servers (five) used in the configuration file.
    My system can easily handle five HTTP requests simultaneously without having to
    use extra resources to start up more httpd processes. Also, idle daemons won''t
    hog your resources. Therefore, the next line in your configuration file is:


    ```

    StartServers 5

    ```


    +   4. # MaxServers: The number of servers to launch until mim''ic the

    # 1.3 scheme (new server for each connection).


    Once again, there is a compiled default available to you, I recommend that you
    include a value for this variable in your configuration file as well. The value
    included in the sample config file is 20. This may seem like a lot of servers
    to run at once, but remember that the more inline image, bullets, etc., on a Web
    page, the more server processes are needed to load that page. So, for example,
    if you have a page with three'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# 136 Chapter 7—Installing Web Server Software


    pictures, five bullets, and text, it would need a total of 9 server processes
    to send all of that information to the person accessing the page. I''ll stick
    with the default, so my next line is:


    ```

    MaxServers 20

    ```


    5. # User/Group: The name (or #number) of the user/group to run httpd.


    The defaults for ownership for httpd are nobody and nogroup. However, some people
    prefer to have it run as owned by another known process, such as FTP. To set me
    up to run as user ftp and group bin, my next two lines are:


    ```

    User ftp

    ```


    ```

    Group bin

    ```


    > Caution

    Be sure the user and group you select exist in /etc/passwd file.


    6. # ServerAdmin: Your address, where problems with the server should # be e-mailed.


    Make easy for people to contact you about your services. It is,, of course, great
    to hear positive comments, but it is also a good idea to make it simple for people
    to complain or offer "constructive" criticisms. If it takes users a while to figure
    out how to contact you to make a complaint or comment, they tend to be more irate
    than they might other-wise have been.


    Therefore, include the e-mail address of the person in charge of maintaining your
    Web services. If this person may change often, you might want to go back to your
    aliases file (discussed in chapter 5, "Setting Up Your Site for General Use")
    and add an alias for an address like webadmin or webmaster, so you don''t risk
    forgetting to change it in the httpd config file later. Use the following:


    ```

    ServerAdmin webadmin@renaisoft.com

    ```


    7. # ServerRoot: The directory the server''s config, error, and log # files are
    kept in'
