  md: '+   6. Type t to define the type of partition.


    +   7. Enter 3 for the Linux partition number.


    +   8. Enter 82 for a Linux swap partition.


    Just to double-check everything, press p to get a listing of the partitions on
    your hard drive. One should be listed as Linux swap, as Linux native, and one
    as DOS partition if you''ve got a DOS partition. Now, write down the table on
    your screen. You will need this information!


    If everything looks okay, press w for write and quit. If something''s wrong, go
    back and follow the instructions again, then as mentioned before.


    # Setting Up Your Swap Space


    Now, you have to format your swap partition. Type mkswap -c <partition name> <size
    of partition in blocks> (you''ll get the partition name and size from the table
    you just wrote down).


    > TipnPartition name refers to the Device field of the table you copied down in
    the previous section (e.g., /dev/hda2). Size of partition refers to the size of
    the partition in blocks from the same table.


    Once the swap partition is formatted, type swapon <name of partition>.


    # Creating Your Linux File System


    Finally, all you really have to do is create the file system or format the drive.
    Type mk2fs <name of partition> <size of partition in blocks>. This time, the partition
    I''m referring to is your Linux partition itself—number three in my example above
    (the name of this partition would then be /dev/hda3).


    > TipnI left out the -c option this time because it checks for bad blocks and
    can take overnight on large drives. If you still want to use the -c option, you
    certainly can.'
