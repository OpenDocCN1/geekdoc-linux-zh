- img_proc: true
  md: '![](img/df069eac9f46c8d8f72de31230fb3cab_138_0.png)


    +   - Anything that''s specific to the machine you''re working on is probably
    at the beginning of the file.


    +   - Commands are grouped accord to type, so the commands that are similar will
    be in the same area of the file.


    +   - Most of a sendmail.cf file is made up of rewrite rules, which are used to
    rewrite e-mail addresses if you need to have this done.


    +   - The end of the file is probably made up of mailer definitions and their
    associated rewrite rules. Mailer definitions tell Sendmail where mail should go
    and where it''s to a user or a program.


    +   - The first character on a line is the command for that line, as Sendmail
    variables and commands are only one character length.


    Fortunately, there''s really little you have to change at first if you chose the
