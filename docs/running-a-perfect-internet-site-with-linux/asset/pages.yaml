    # InterNIC Billing


    InterNIC charges $100 for initial domain registration. This covers the first two
    years of your site exists. After that time, you have to pay $50 per year for domain
    name maintenance. You''ll get an invoice to remind you, which will come through
    e-mail or postal mail, depending on what you selected on your domain name registration
    form.


    It’s important that you read the instructions where and when to send your payments,
    and that you meet these deadlines. If you''re late, InterNIC will shut down your
