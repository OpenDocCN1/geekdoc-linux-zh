  md: 'If you look at the last line in the moderators file, you will see it covers
    all newsgroups because of the asterisk in the first field. Therefore, the only
    lines you need to add are those for any local moderated groups you have at your
    site.


    # The newsfeeds File


    The newsfeeds file defines how you distribute incoming news to the sites you feed.
    The basic structure for feed definition is:


    ```

    site[/exclude,exclude...]\


    :pattern,pattern...[/distrib,distrib...]\


    :flag,flag..._\


    :param

    ```


    The terms used above each have a particular function, as follows:


    +   - The full name of one of your feed sites (the name it uses to identify itself
    in the path lines of articles it passes through or posts), or an alias if you''re
    referring to special local items, such as archivers and gateways. This item is
    used by your server to decide whether each article comes in should be forwarded
    to the sites you feed. If it doesn''t see this name in the article''s path header,
    it is forwarded.


    To avoid confusion, if you use an alias for a local item (e.g., if you have an
    archiver program that you use to archive posts from certain groups, use the alias
    archive for it), to put an exclamation point (!) at the end of it. If I just used
    archive, and there''s actually a news site out with the word archive in its name
    (e.g., news.archive.com), any post that change through news.archive.com won''t
    be resent to your archive because INNd it has already been there. If you use archive!
    instead, there''s no risk of having your alias mistaken for an actual host.


    +   - You can use this item to tell your server not to forward articles to a particular
    site if they''ve already passed through other specific sites listed in the paths.'
