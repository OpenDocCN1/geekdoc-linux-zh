    # The moderators File


    The moderators tell your system where to mail posts for moderated groups to their
    moderators instead of trying to post them directly to the group. The example moderators
    file is as follows:


    ```

    ## $Revision: 1.4

    ## Mailing addresses for moderators.

    ## Format:

    ## <newsgroup>:<pathname>

    ## First match found is used.

    ## <newsgroup>

    Shell-style newsgroup pattern or specific newsgroup

    ## <pathname> Mail address, "% becomes newsgroup with dots

    ## changed to dashes.

    gnu.*=$s@ut.cis.ohio-state.edu

    *:%s@u.unet.net

    ```


    The line assigning the reroute address, from left to right (using the first listed
    as an example), is as follows:


    +   * gnu.* is the newsgroup''s name, or a hierarchy with asterisk (*) wild card.

    * % represents the newsgroup''s name, but with hyphens (-) instead of periods
    (.) to break the hierarchy. This is used as the username in the e-mail address
    the post is rerouted.

    * tut.cis.ohio-state.edu represents the host e-mail address to which the post
    is rerouted.'
