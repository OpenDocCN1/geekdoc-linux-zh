  md: '# Chapter 14


    # Maintaining Your System


    An important aspect of site maintenance is maintaining your servers. Because these
    programs perform all of the services your site offers to both your own users and
    other people on the Internet, you’ve got to keep them running smoothly.


    In this chapter, you learn how to:


    +   - Maintain each server you installed

    - Maintain the file areas associated with each server


    # Maintaining Your E-mail Servers


    It’s important to keep your e-mail running smoothly, as it’s in many ways the
    most essential service on your site. If you lose access to e-mail, you lose communication
    with your users and the rest of the Internet.


    You have one server to maintain in this case, Sendmail. It’s not the server software
    itself you’re maintaining here. You’ll be keeping track of the log files, mail
    spool space, and other mail-related features.


    # Maintaining Sendmail


    There are only a few things you need to do maintain your Sendmail server. The
    rest is taken care of by the software itself. Things to take care of include the
    following:


    +   - Sometimes your mail spool will get jammed, and mail will sit in the queue
    without being delivered. You may want to add a cron job'
  merge: -1
  pgno: 290
- img_proc: true
  md: '(a section to your root cron file) to run the command sendmail - once a day.
    This will flush any mail that''s still sitting in the queue (sometimes mail doesn''t
    go out immediately because of technical problems, and so it will sit in the queue
    until it''s flushed.)


    The mail queue will get especially jammed if a lot of mail is sent while your
    connection is down. You may want to make it a habit to flush the mail queue whenever
    your connection goes down and comes back up.


    +   - Be sure to keep an eye on your mail logs (the default path would be /var/adm/messages/,
    if you aren''t using the default, look in your /etc/syslog.conf file to see what
    file you assigned your mail files to go to) so they don''t take over your hard
    drive space. They often aren''t worth archiving unless you''re having problems
    with mail forgery. If people are forging mail from users on your site, you may
    want to start keeping logs for a while you can determine if mail really came from
    the user or not. Otherwise, you may just want to delete (with the rm command)
    once a day.


    # Maintaining Mailing Lists


    Most mailing list maintenance involves adding and removing users by hand. While
    the software does handle this aspect itself, there are times you''ll need to do
    the following:


    +   - If an account is subscribed to your mailing list ceases to exist, you''ll
    get email to the listmaster for that specific mailing list after every single
    post that goes out to the list, telling you that particular account no longer
    exists. You''ll definitely want to remove this user from the list.


    To remove a user from a list in Majordomo, go to the directory where you keep
    your list user files (likely /usr/local/majordomo/lists) and locate the list of
    users for the mailing list you''re working on, which will be the same filename
    as the list''s name. Edit the user list and find the e-mail address you want to
    remove. Delete the e-mail address, and exit the file.


    +   - Sometimes people move between sites or parts of sites, and the list no longer
    recognizes them. They''ll likely contact you and complain that they''re no longer
    on the list. You''ll need to get the address they subscribed to and go in by hand
    and adjust their subscription if they can''t return to the old account, unsubscribe,
    then resubscribe from the new account.'
  merge: -1
  pgno: 291
- img_proc: true
  md: 'To do this, e-mail them and ask what address they originally subscribed from.

    Then, locate and edit the user list for the mailing list. Find the old e-mail
    address—if they weren''t sure, look for the same userid and the same site as the
    person making the complaint, it''s just the host that may be different. Delete
    the old e-mail address and replace it, or edit it to match the new one. Then,
    save and exit the file.


    +   - Keep in mind that sometimes it''s easier to simply remove a troublesome
