- img_proc: true
  md: '# Chapter 9—Installing UseNet Server Software


    +   - pattern


    Use this item to define what newsgroups you pass along to the sites you feed news
    to. The default is to just pass everything, which is fine if they don''t want
    specific groups or hierarchies, put an exclamation point (!) in front of it (e.g.,
    if they don''t want anything in the alt.binaries hierarchy, you would add !alt.binaries.pictures*).
    If they don''t want all of groups your site takes in, then you can specify what
    groups or hierarchies to pass by listing them as usual (e.g., if they want everything
    in the comp, news, and rec.arts hierarchies, you would use comp*, rec.arts*).


    If they want nothing in a specific hierarchy except one particular group, you
    can assign this as well. For example, if they wanted everything in rec, but not
    in rec.pets except rec.pets.cats, you would use the line rec*, !rec.pets*, rec.pets.cats.


    +   - distrib


    If used, checks the Distribution header of an article for the following items,
    in order:


    +   1. If the Distribution header matches anything you list here in the distrib
    section, the article is forwarded to the news server the distrib section relates
    to.


    +   2. If the Distribution header matches anything you list in the distrib section
    with an exclamation point in front of it, the article is not forwarded to the
    news server the distrib section relates to.


    +   3. If the Distribution header doesn''t match anything you listed in the distrib
    section, and you don''t have anything in the distrib section with an explanation
    point in front of it, the article is not forwarded to the news server the distrib
    section relates to.


    +   4. If the Distribution header doesn''t match anything you listed in the distrib
    section, but there are items listed that start with an exclamation point, the
    article is forwarded to the news server the distrib section relates to.


    The default, if you don''t include any dists, is to send all articles in the groups
    to which they subscribe to all of your sites.


    +   - flag'
