    | menu02.1.linux.tar.gz | Menu based shell tool w/ user customizations |

    | modules-1.1.87.tar.gz@ | Utilities for making/using kernel modules |

    | old/ | Old versions of the kernel - history mostly |

    | patches/ | Various kernel enhancements and fixes |

    | pcmcia/ | Support for PCMCIA card & card services |

    | scend-0.5.tar.gz | Full-screen editor for structured configuration data |

    | sound/ | Support for SoundBlaster


    Upgrading and Adding'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# Chapter 16—Upgrading Your Software


    | Table 16.1 Continued |

    | Item | Description |

    | v1.1/ | Version 1.1 developers track (obsolete) |

    | v1.2/ | Version 1.2 and patches (stable) |

    | v1.3/ | Latest development kernels (ALPHA) |


    # Getting the Full Kernel Source


    If you want to start from scratch and grab a full version of kernel source, first
    you need to move your old source directory to another location. Your kernel source,
    if you have it on your system, is in the directory /usr/src/linux. As root, simply
    move this to another directory (e.g., /usr/src/linux-old).


    You could have no real /usr/src/linux directory, and instead put kernel source
    into directories related to the version (e.g., /usr/src/linux-1.2.13) and then
    make a soft link from the current version''s directory to /usr/src/linux.


    Now, set up your source for compilation. Log in as root and FTP to Sunsite or
    your favorite mirror.


    Change to the directory /pub/linux/kernel.


    Then, change to the directory v1.2 unless Linux has reached version 1.4 at the
    time that you are following these instructions; then, change to v1.4.


    > Tip

    If an experimental kernel has options you want to use, it''s often safe to try
    it out. Ask around the Linux newsgroups and see if the problems it has will affect
    you, and be sure to test it out for a while before trusting it completely. If
    you choose to use one, you''ll be going to 1.3 or 1.5.


    Currently, the latest kernel version is 1.2.13, so I''ll download the file linux-1.2.13.tar.gz.
    This is about a 2.3M file, depending on the speed of your connection, it might
    take a while. Then, move the file to /usr/src, gunzip and untar it.


    > Tip

    If you''re on hard drive space, then go ahead and delete the old kernel when you''re
    sure the new one is working fine.'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Getting Patches To Apply to Kernel Source


    If you want to add a patch or a few patches to the source you already have instead
    of downloading a whole new source version, follow these instructions Log in as
    root and FTP to Sunset or your favorite site.


    Change to the directory /pub/linux/kernel, then to the directory v1.2 (same version
    notation as previous). All of the files that start with patch are the patch files.
    You must apply all patches below the one you want in the end, as they make changes
    to your source code. For example, if you want to apply patch 1.2.5, you need get
    patches 1.2.1 through 1.2.5. Then, just move the patch files to /usr/src.


    # Applying Patches to Source


    If you downloaded patches, you need to apply them to the source code before you
    can compile it. To apply your patches, log in as root and change to /usr/src.
    You must apply the patches in order. To apply a patch, type zcat pathname.gz |
    patch -p0 (e.g., zcat patch-2.1.1.gz | patch -p0).


    > Caution

    nYou must apply the patches in numerical order. Each one makes changes to the
    source code, and the source must be in the full state that it''s expecting.


    Apply the next patch in line. Continue applying patches until you''ve reached
    the last one you need. If the patch fails, double-check and make sure you have
    the patch for exactly the kernel after the source you''re using. You can even
    look through the patch file and see the changes that are made, and make them by
    hand.


    If you can''t seem to solve the patch problem, you can always download the full
    version of the source for the kernel you want to compile.


    # Configuring the Source To Fit Your Needs


    Now, it''s time to configure the kernel so it''s compiled for your site''s specific
    needs. Because the instructions are here for when this book was written, I recommend
    you read the README file in your new /usr/src/linux directory. In the "INSTALLING
    the kernel" section, you will find detailed instructions on how to proceed.'
  merge: -1
  pgno: 316
