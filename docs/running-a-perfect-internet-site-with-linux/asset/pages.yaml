- img_proc: true
  md: 'File permissions are broken down into groups to determine the access for the
    file''s owner, the owner''s group, and everyone.


    | t | rwx | rwx | rwx |

    |---|---|---|--|

    | | The type of file |

    | rwx | Permissions related to the user |

    | rwx | Permissions related to the user''s same group |

    | rwx | Permissions related to everyone (other) |


    The structure of file permissions is, reading the line above from left to right:


    The first item in the permissions values describes the file type. It can be one
    of the following:


    +   - | Average ordinary file (e.g., text file, program) |

    - d | Directory |

    - l | Symbolic (soft) link |

    - b | Block device (e.g., hard drive) |

    - c | Character device (e.g., modem, keyboard, tty) |


    The following three sets of three each have the same permission options:


    +   - r | The ones the permission is defined for (user, group, or everyone) can
    read the file. This item can only be in the first position |

    - w | The ones the permission is defined for can write to the file, plus delete
    and rename it. This item can only be in the second position |

    - x | The ones the permission is defined for execute the file, or enter it if
    it''s a directory. This item can only be in the third position |

    - | Permission is not given for the item defined in that particular position |


    For example, the file permissions:


    ```

    -rwxrw-r---

    ```'
  merge: -1
  pgno: 105
- img_proc: true
  md: 'The preceding permissions define a normal file. Its user can read, write, and
    execute it. The user''s group can read and write it, but not execute it. Anyone
    outside the user''s group can only read it.


    Now, to set these permissions, you use the command chmod. Since each item (except
    for the type definition) is either on or off, either blank or with a letter, permissions
    can be expressed with the binary numbering system.


    In the case of permissions, the binary usage is 1 for "allowed," and 0 for "disallowed."
    However, instead of using binary to enter the permissions, you''ll use the decimal
    versions. Each variation on permission combinations has its own decimal value,
    which is the sum of the binary components (see table 5.1).


    # Table 5.1 Decimal Equivalents of the Permission Combinations


    | Permission Set | Binary | Decimal |

    |---|---||

    | - | 000 | 0 |

    | -x | 001 | 1 |

    | -w- | 010 | 2 |

    | -wx | 011 | 3 |

    | r-- | 100 | 4 |

    | r-x | 101 | 5 |

    | rw- | 110 | 6 |

    | rwx | 111 | 7 |


    Let''s break down the example from above, -rwxrwr-:


    +   - The leading - is the file type. This doesn''t factor into the numbers used
    with chmod in general. Using a filetype other than - is discussed in a moment.'
  merge: -1
