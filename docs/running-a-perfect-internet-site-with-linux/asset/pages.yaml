  md: '# Partitioning Your Hard Drive


    # Note


    Keep in mind that if you''re going to switch between different operating systems,
    your machine will not be an Internet site when it''s not running Linux. Using
    multiple operating systems is only recommended for secondary machines if you don''t
    want to have your site down on a regular basis.


    The size of each partition depends on the size of the hard drive and the following
    considerations:


    +   Decide how large you want your swap space to be. As stated in the previous
    section, your total memory (RAM plus swap) should at least add to 16M. See the
    section, "Linux-Only Drive," for an in-depth discussion of the capabilities of
    swap space.


    +   Using an OS like MS-DS 6.0 or higher that can run on a compressed drive is
    a factor in determining partition size. Keep in mind that if you drivespace your
    DOS drive, you won''t be able to access that data from Linux. If you don''t drivespace
    it, you will be able to access it. Software is in the works to enable Linux to
    read data from a drivespaced drive.


    +   Determine how much drive space you need for Linux based on the issues discussed
    in chapter 2, "What Kind of Hardware and Connection You''ll Need." You''ll want
    at least the minimum recommended: 200M.


    +   You might want to leave a blank partition for installing another operating
    system later. This will take some planning, as you''ll need to determine how much
    space the spare partition will need.


    # Caution


    If you plan to install Windows 95 after you''ve installed Linux, be prepared to
    use your boot and root disks. Windows 95 erases the boot sector (the very first
    sector) of your hard drive when you install it. You can avoid this problem by
    using a floppy disk to store the information you might otherwise store on your
    hard drive''s boot sector (discussed in more detail in chapter 4, "Installing
    Linux from the CD-ROM").


    You will not have this problem in reverse. Win95 doesn''t actually use the boot
    sector of your hard drive, so you don''t have to worry about Linux causing any
    problems there.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_74_0.png)'
  merge: -1
  pgno: 74
- img_proc: true
  md: '# Caution


    If you''ve got a drivespaced drive (or it''s compressed with another drive compression
    program), you''re going to need undrivespace before you partition the drive. If
    the drive is almost full, you''ll have to remove enough information to free space
    forcompressing the drive. If you have a tape backup, this would be a good time
    to back up your drive and get the items you want off the tape when you''re finished.
    No matter how you decide to do this, back up your most important files!


    You could also zip up the important files and copy them to disk if you don''t
    have a drive tape. This will take you much less time than copying the files to
    disk without zipping them first.


    Use the following method to determine the actual size of each partition that you
    want to create:


    +   1. Look at your total hard drive space.


    +   2. Determine the size of the swap partition(s) you would like to use.


    +   3. Decide on a hierarchy of partitions (for Linux and your other operating
    systems), and allocate space accordingly.


    +   4. Decide how large you''d like your primary partition to be.


    +   5. Determine the minimum amount of space you''d like to have on the remaining
    partitions.


    +   6. Add the amounts in steps two through five, and see if that sum fits into
    the total drive space.


    +   7. If it, you''re set! Just work the remaining space into partitions as you
    desire. If it''s too large, go back over steps two through five, and trim partitions
    until they add up correctly.


    For example, let''s say I''ve got a 540M drive and 8M of RAM, and I want both
    Linux and MS-DOS partitions on it. Following the process described above, my answers
    would be as follows:


    +   1. 540M.


    +   2. Minimally, I should have an 8M swap partition to make 16M of RAM. However,
    I''d love to have 30M of RAM available, so I''ll first plan to create a swap partition
    of 22M.'
