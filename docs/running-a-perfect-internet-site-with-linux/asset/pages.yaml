  md: '# How To Follow Linux Version Numbers


    Linux has two different sets of version numbers called *version trees*. It''s
    important to understand the difference between the two trees so that you see updates
    on the Internet, you know which patch files to get. One tree, the *experimental
    tree*, is a line of versions that is experimental; the code is still in the testing
    stages. The other tree, the *production tree*, has the code that is considered
    to be stable.


    # How To Tell the Difference Between Experimental and Stable


    To determine the type of Linux version, look at the version numbers. Each number
    is made up of three digits, and the second that indicates the type. If the second
    digit is even, it''s a production version. If it''s odd, it''s an experimental
    version. For example, 1.2.0 is a production version and 1.3.0 is an experimental
    version.


    # How do the Two Trees Relate?


    The two Linux version trees are related. They''re done in tandem, with each tree
    starting at the same time. In fact, the appropriate x.y.0 versions are identical
    (e.g., 1.0 and 1.1.0 are the same, 1.2 and 1.3.0 are the same). From each, each
    tree grows individually with stable code added to the production version while
    the code still in the testing stages is added to the experimental version.


    When Linus Torvalds determines that an experimental version has enough new features
    and is stable, he calls a code freeze. At that point, the stable version becomes
    the new x.y.0 set, and development starts all over again in a new pair of trees.


    # History of the Version Trees


    To get a feel for how Linux developed over time and how the version trees work,
    take a look at figure 1.2.'
