  md: 'HTML has a number of word-processor-like codes as well. Some of them are:


    | Code | Meaning |

    | <H1>...</H1> | Main header |

    | <H2>...</H2> | Secondary header. There are 6 headers, one less prominent than
    the one before it. |

    | <B>...</<B> | Bold |

    | <I>...</<I> | Italics |

    | <U>...</<U> | Underline |

    | <UL>...</<UL> | Bulleted list. Each bulleted item should begin with <LI. There
    is no ending </LI>. |


    This is a very basic guide to HTML code. For a more in-depth guide, check out
    QUE''s Special Edition Using HTML.


