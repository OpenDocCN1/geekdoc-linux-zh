  md: '# Chapter 7—Installing Web Software


    3. Type xf86config. This will start a program that makes your life much easier.
    It configures most of your X-Windows items for you, especially the graphics-intensive
    ones! Hit Enter to continue and follow the-instructions. I''ll walk you through
    the items I entered during my configuration.


    4. First is the mouse configuration. I have a Logitech mouse''s Microsoft compatible,
