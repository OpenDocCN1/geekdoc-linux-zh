  md: '# # Appendix D

    Contents of the CD-ROM


    The CD-ROM included with this book is full of software and documentation.

    Since most of the software and applications are labeled sufficiently to tell you
    what they''re used for, this appendix addresses exactly what the things on the
    CD-ROM are. This appendix is broken down into the directories you''ll find on
    the CD-ROM, so it will be easy for you to find information on the package you''re
    looking for.


    All the text files on this CD are "Linux/Unix" format—each line ends only with
    a CR, not CR-LF. This means that if the files are viewed with Notepad in Windows,
    they''ll be unreadable. Use Word, Write, or Wordpad instead of Notepad, and, of
    course, once in Linux, any text editor will work.


    The text files each have two names, one is the long name for Linux, the other
    is the short name for MS-DOS, MS-Windows, and Windows 95. The file trans.t1 in
    each directory stores the names for the files in DOS on the left, and Linux on
    the right.


    # ## The / (root) Directory


    The root directory on the CD-ROM contains everything that comes with the Slack
    3.0 distribution, plus a directory /extras that contains most of the servers we
    install in this book.


    # ## Files Contained in the root Directory


    There are a few informative files included in this directory:


    | MS-DOS | Linux | Description |

    |---|---|---|

    | booting.txt | BOOTING.TXT | Advice on what to do if, once your system is installed,
    you have trouble booting it. |


    *continues*'
