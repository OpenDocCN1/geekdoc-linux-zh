  md: '# Creating Your Boot and Root Floppies


    In order to install Linux, you must create two floppy disks: one for the necessary
    boot information, and one for the necessary root information. After installing
    Linux, keep these disks handy for system emergencies that you may run into later.


    Creating your boot and root disks is a simple but important step in the Linux
    installation process. You will use an MS-Windows program provided on the CD-ROM,
    Linstrix, to create it. Now, take one of 3.5" or 5.25" disks and place it in the
    a: (or appropriate) drive. Then, in the File Manager, change to your CD-ROM (I
    will assume d; but use the appropriate drive letter). Now, change to the \linist
    directory on the CD-ROM and double-click on the program Linstrix (see figure 3.1
    for what you will see at this point).


    **Fig. 3.1**nThe initial screen

    for Linlist from

    the CD-ROM.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_67_0.png)


    Now choose the appropriate options for the machine you''re installing Linux on
    this time. For example, my hard drive is an IDE, not SCSI, so I''ll make sure
    IDE is marked under Disk Controller. I''m using 3.5" floppies for my boot and
    root disks, so I''ll check 3.5 Inch under Floppy Size. Since I''m using a:, click
    A-Drive under Floppyppy Drive. If you''re installing NFS (installing Slackware
    from another machine to this one), click Yes under Networking. If not, click No.


    Now, choose the install program you want to use. I''ll walk you through the Text
    installer in this chapter, because it gives you more complete error messages,
    and the Color install program doesn''t work properly on a few types of systems.'
  merge: -1
  pgno: 67
- img_proc: true
  md: "# Creating Your Boot and Root Floppies\n\n> Tip\n you would like to try the\
