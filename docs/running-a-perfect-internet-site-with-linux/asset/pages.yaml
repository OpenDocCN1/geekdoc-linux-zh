  md: '# Chapter 10


    # Installing FTP Server

    Software


    Having an FTP server is an excellent way to make information available to people,
    regardless of what kind of Internet software they’re using. You can also use it
    to allow people to upload files to your system, either anonymously or through
    an account with a password. So, whether you want to make information on your company’s
    services available, or allow the people with whom you’re working on an important
    project to upload your work to your system so you can take a look at it, setting
    up your FTP server is worth the time and effort.


    In this chapter, you learn how to:


    +   - Compile your FTP server

    - Install your FTP server

    - Make sure your FTP server is secure

    - Verify that your FTP server works


    # How To Compile Your FTP Server


    Slack comes with an FTP server that you can install automatically, but I’ve chosen
    a more feature-rich server to install. If you would rather use the simple FTP
    server that comes with Slack for now, you can access the man pages for it by typing
    man ftftpd. However, this is a very basic server. Installing the one included
    in this chapter will give you better site'
  merge: -1
  pgno: 224
- img_proc: true
  md: '206 Chapter 10—Installing FTP Software


    security. It will also give you more features, since the FTP server installed
    in this chapter supports a number of nonstandard FTP services, including the capability
    to:


    +   - Log file transfers

    - Compress and archive files in the middle of tasks

    - Classify users

    - Define what each class of users can do

    - Set upload permissions for individual directories

    - Create restricted guest accounts, so unknown users can only get to a limited
    number of files


    # Finding and Uncompressing the Server Source


    The FTP server you''re going to use wu-ftptd-2.4, from Washington University (the
    site of WUArchive). The features it has, to offer in addition to the standard
    FTP protocols make it a worthwhile addition to your site''s servers.


    To locate and uncompress wuftpd:


    +   1. Locate the file wu-ftptd-2.4.tar.z on the CD-ROM.

    2. Copy it to /user/src/.

    3. Type gunzip wu-ftptd-2.4-fixed.tar.gz (you may see this file as wu-ftptd-.000).

    4. Type tar-xvf wu-ftptd-2.4-fixed.tar.


    # Editing pathnames.h


    Before compiling your FTP server, you need to look at the file that defines wuftpd''s
    configuration and data files go. To do this, you will edit the file pathnames.h
    (located in the directory where you have stored your wuftpd files in the src subdirectory)
    and determine whether the defaults set for your needs. If they don''t, change
    them to where you want the files listed to be stored.


    > You either choose to have the various configuration files used for wuftpd in
    various locations, or within one directory. I generally prefer to keep the configuration
    files for an individual program all in one place. This makes my life easier when
    I try to locate problems with the server, or make configuration changes later.'
