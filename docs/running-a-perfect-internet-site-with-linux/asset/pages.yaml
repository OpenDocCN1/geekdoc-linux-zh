    # Maintenance


    # Tip


    You may occasionally want to backup a file listing for your site with all of the
    permissions intact (type **ls -IR listing** to save this to a file called listing).
    Then, if something happens that messes up your permissions you have something
    to look back to!


    # Managing Your Network Resources


    The major site resource you''ll need to watch over your network resources. Without
    close management, you''ll find that your system will get annoyingly bogged down
    at at times. By *network resources*, I mean your actual CPU and bandwidth.


    # Managing Processes


    One thing that can slow your system down is the processes people are running on
    it. There are, however, ways for the system administrator to adjust the load so
    that the system runs most processes at a speed that''s comfortable for both yourself
    and your users.'
  merge: -1
  pgno: 286
- img_proc: true
  md: '# Determining Process Intensity


    If you feel the response time of your system is slow, it''s good to find the culprit
    process. First, take a look at how badly bogged down your system is using the
    uptime command. This program lists what time it is, how long the system''s been
    up, how many users are on, and the load average from three quick samples. Generally,
    you want to keep the load average below 3 or so.


    If you feel your load average is too high, you can get a listing of the top processes
    running to see what''s happening. To get a listing of, say, the top 10 processes,
    type ps aux | head -10.


    > > Tip

    T Typing ps aux by itself lists all processes.


    Take a look at the process listing and see how much of your system''s effort the
    top ones are taking up (percent CPU). Any process taking more than 50 percent
    of your CPU time for 30 seconds or longer is a problem.


    > > Tip

    If you find that your system is constantly having load problems, it may be time
    to add more RAM to the CPU.


    # Slowing Some Processes Down


    You can start a CPU-intensive process with the nice command to make sure it takes
    up of the processor. You can also change the nice value of a process that''s already
    running.


    In Linux, the nice range is from -20 to 19, with -20 being highest priority and
    19 being lowest. The default nice value is zero, and if you type it without an
    argument the process''s nice value goes up by 10. For example, if you wanted to
    start the calculate process and really weren''t in much of a hurry, you could
    give it a nice of 15 to slow it down: renice 15 calculate. Or, if you were starting
    the rush process and wanted to make sure it got done quickly, you might need it
    to -20: nice -20 rush.


    If you see a process running is taking up too much of your CPU time, you can use
    the renice command as root to change its nice value. Get the process number from
    the ps listing, and decide on the new value for it. For example, if rush was process
    235 and you realized it was just bogging things down too much, you could use:
    renice -15 235.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Tip


    All users can nice their own processes. If you have users who are constantly running
    CPU-intensive processes, they may be willing to nice them for you.


    # Getting Rid of Useless Processes


    Sometimes a process just plain dies, or hangs. In this case, you may need to kill
    it so it''s not wasting your CPU''s time. Once again, you''ll need a process''s
    id (PID) number to do this.


    # Caution


    Killing a process kills its child processes. If you kill one of your shells, you
    will also kill the processes you were running in that shell.


    You''ll want to try killing a process in the following order (for example, process
    number 345):


    +   1. kill 345


    +   This is the most gentle and clean kill from your system''s point of view.
    If the process you''re trying to kill is too much much of a mess, this version
    won''t work. Try a ps 345 to see if it''s still running.


    +   2. kill -9 345


    This is a harsher kill, but probably the one you''ll use most often. Since the
    process its killing doesn''t get clean up after itself, the files involved may
    be a bit of a mess.


    # Managing Bandwidth


    Managing bandwidth isn''t as simple as managing other features of your site. A
    few tips are:


    +   * If you have dial-in users, don''t allow more on your site than it can handle.
    Also, make sure the dial-in connection is slower than your connection to the Internet.
    This, even if they max out their own bandwidth, they don''t max out yours as.


    +   * Don''t overreach your resources. If you want to run a news server, get it
    up, and discover that it sucks down too much of your bandwidth, seriously consider
    taking down your news server and setting up your site to use your uplink''s instead.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '+   * Watch the number and size of mailing lists you run. They''re not only
    CPU intensive while being processed, but all those posts have to be sent back
    out as well.


    +   * Watch your logs. Perhaps someone is offering something like a Web page that''s
    getting so many hits that your bandwidth is suffering. If so, you may need to
    ask them to move it elsewhere.'
  merge: -1
