  md: '# Tip


    > If you have only one tape backup, you can use the first resource file on the
    machine with the drive and the second file on the machines connected to it.


    Choose the file you want for this machine (I''ll choose the first).


    +   Edit the rc file so that it suits your needs. The default file listing is
    as follows:


    ```

    # Resource file for tob (version 0.01 and higher), using

    # afio="diff" compressed archives. Use "ftape.o" as loadable

    # module, hence the PRECMD and POSTCMD. See the docs for a

    # full explanation.


    VERBOSE=''yes''

    TOBOME="/usr/etc/tob"

    BACKUPDEV="/dev/ftape"

    PRECMD="insmod /sbin/ftape.o"

    POSTCMD="rmmod ftape"

    ```


    ```

    Let''s see what we''re up to.

    if [ "TYPE" = "full" ]; then

    echo "About to make a FULL backup of volume $VOLUMENAME."

    elif [ "TYPE" = "diff" ]; then

    echo "About to make a DIFFERENTIAL backup of volume

    VOLUMENAME."

    elif [ "TYPE" = "inc" ]; then

    echo "About to make INCREMENTAL backup of volume

    VOLUMENAME."

    fi

    ```


    The variables in this script are as follows:


    +   VERBOSE=''yes''

    Tells all the messages displayed during backup to be displayed. If you set this
    to "no" some of them will be suppressed.


    +   TOBOME="/usr/etc/tob"

    Tells your system where to find tob. If you put the tob script somewhere other
    than /usr/etc/tob, be sure to change this here. For example, I put it in /sbin,
    so I''ll use:


    ```

    TOBOME="/sbin/tob"

    ```


    +   BACKUPDEV="/dev/ftape"

    Defines the device used in the backup. Be sure this matches where your ftape is
