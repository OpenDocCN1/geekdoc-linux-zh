  md: '# Configuring Your News Server


    +   2. MAILTO=root


    This tells your system to send any mail regarding error messages to root.


    +   3. 0,15,30,45 * * * /usr/lib/news/bin/sendbatch -c manlobi > /dev/null


    This tells your system to send any outgoing news batches to your news every hour
    over the hour, and at 15, 30, and 45 minutes past the hour.


    Change manlobi to an alias you''d like to use for your provider''s news server.
    You''ll soon add this alias to your newsfeeds.


    +   4. 0 22 * * /usr/lib/news/bin/news.daily < /dev/null


    This tells your system to do its daily housekeeping chores (i.e., expiring news)
    every day at 22:00 (10 pm). The exact tasks covered under “daily housekeeping”
    are listed in the file news.daily shown above.


    +   15 * * * /usr/lib/news/rn -U


    This tells your system to handle any spooled news to INNd that, for some reason,
    couldn''t be dealt with in the previous attempt. This is done every hour at 15
    minutes after.


    If you don''t like the intervals assigned to any of the processes above, feel
    free to change them to match your preferences and needs. (cron files are covered
    in more detail in Chapter 5, “Setting Up Your Site for General Use").


    # Making Sure Newsreaders Can Find the Necessary Configuration Files


    A lot of newsreaders are hardcoded to look for news configuration files in /usr/local/lib/news.
    However, your configuration files are in /usr/lib/news.


    An easy way to ensure that people won''t have problems when they use a particular
    newsreader is by using a symbolic (soft) link. A soft link creates a pointer to
    a file that if someone tries to access the pointer, they are redirected to the
    file references.


    Create a soft link from the location some clients expect to find your configuration
    files, to where yours actually are. The syntax is:


    ```

    ln -s /original_path /non-existent_path_to_point_from

    ```'
