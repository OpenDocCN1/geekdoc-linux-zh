    # Preparing Your Clients


    All of your client applications needs to be recompiled to know how to talk to
    your firewall. Fortunately, even if your client of choice doesn''t have an option
    in its source to work with a firewall, it''s simple to add the necessary code
    (if you have access to the source).


    > Tip

    Some preconfigured clients come with the firewall software in the clients directory.
    Compile them and give them a try if you like.


    To determine whether a client''s source can be changed to allow it to work with
    your firewall, do the following:


    +   1. Go to the source directory for the client you want to convert.


    +   2. Search for it for the following item:


    ```

    SOCK_DGRAM

    To search this, use grep SOCK_DGRAM * to search all of the files in the directory
    for the term SOCK_DGRAM.

    ```


    +   3. If this shows up, you cannot use this client with Socks. SOCK_DGRAM is
    a UDP protocol and does not get along with your firewall software.


    +   4. Find another acceptable client that does not contain this item.


    To change a client''s source to allow it to work with your firewall, do the following:


    +   1. Edit the file.


    +   2. Locate the beginning of the main procedure.


    +   3. Enter the following near the beginning of this procedure:

    SocksInit(argv[0]);'
  merge: -1
  pgno: 368
- img_proc: true
  md: '4. Locate all lines that begin with cc. Add the following to the end of each
    of those lines:


    ```

    -Dconnect=Rconnect -Dgetsockname=Rgetsockname -Dbind=Rbind \

    -Daccept=Raccept -Dlisten=Rlisten -Dselect=Rselect

    ```


    | Tip |

    | If the client is compiled with a Makefile, add the above to the FLAGS macro.
    |


    5. Locate the final target in the Makefile, which starts with cc or 0d.


    6. Add the following library:


    ```

    -DSHORTENED_RBIND

    ```


    7. Compile the client.


    8. Test the client.


    # Locating Assistance


    If you need assistance in setting up your firewall, there are a number of excellent
    sources you can look to for help. These sources are supported by the people who
    program the server itself.


    # The NEC Socks Home Page


    NEC has an excellent home page with everything you want to know Socks. Check it
    out at


    http://www.socks.nec.com/


    # The Socks Mailing List


    You can subscribe to a mailing list for discussions of Socks problems, postings
    of new FAQs, announcements, etc. To subscribe, send e-mail to


    majordomo@syl.dl-nec.com


    This mail should have no subject and have in the body only


    subscribe socks your_e-mail_address'
