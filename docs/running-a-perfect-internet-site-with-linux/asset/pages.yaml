    # Modifying Your News Configuration Files


    There are a number of configuration files found in /usr/lib/news that need to
    be set up to meet your system''s requirements. Let''s go through them one by one
    and see what needs to be changed.


    # The expire.ctl File


    The expire.ctl file is used to tell INN how article expiration is to be handled
    (i.e., how long to keep an old article around removing it from the hard drive).
    Take a look at the example file first, and then I''ll discuss the modifications
    you want to make:


    ```

    ## $Revision: 1.8 $

    ## expire.control file

    ## Format:

    ## /remember/:<keep>

    ## <patterns>:<modflag>:<keep>:<default>:purge

    ## First line gives history retention; other lines specify expiration for newsgroups.
    We must have a "*A:*" line which is the default.

    ## wildcat-style patterns for the newsgroups

    ## <patterns>

    ## <modflag> Pick one of M U A -- modifies pattern to be only moderated, unnamed
    or all groups

    ## <keep> Minimum number of days to keep article

    ## <default> Default number of days to keep the article

    ## <purge> Flush article after this many days

    ## <keep>, <default>, and <purge> can be floating-point numbers or the word ''never.''
    Times are based on when unless -p is used;

    ## see expire.8

    ```


    If an article expires before 14 days, we still remember it for 14 days in the
    case we get offered it again. Depending on what you use for the INND -c flag and
    paranoid you are about old news, you might want to make this 28, 30, etc.

    /remember/:14


    +   Keep for 1-10 days, Allow Expires headers to work.

    *A:1:never

    * Some particular groups stay forever.

    doc.dancing*:A:never:never:never

    unet*:A:never:never:never'
