    +   - You can set majordomo to put a small line at the bottom of every post that
    points people to where to get help with the list. This can cut down on headaches
    with people posting to the list asking for help.


    +   - Majordomo comes with a standard help file. However, you can customize it
    to fit your needs. If you find you have a problem with people always asking you
    the same question about the list, add the solution to the question to either the
