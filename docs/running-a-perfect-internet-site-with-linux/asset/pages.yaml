  md: "# Mounting Directories by NFS\n\nNetwork File System (NFS) is a method of mounting\
    \ directories across a network as though they were on your local machine. There\
    \ are two aspects to NFS mounting. You have to set up the machine whose directory\
    \ is being mounted to allow it, and you have to set up the machine's access to\
    \ the directory to do so.\n\n# Setting the NFS Server To Allow Access\n\nThe machine\
    \ whose directory is mounted the NFS server for particular directory. There are\
    \ a few files you need to attend to in order to set up a server to allow other\
    \ machines to access its files via NFS.\n\nFirst, you need to edit the file /etc/exports\
    \ (create if it doesn't already exist). Each line in this file contains two pieces\
    \ of information. The first is the path for the directory you're allowing other\
    \ machines to access. The second is a list of who are allowed to access the directory,\
    \ and their permissions. An example (rw stands for read and write):\n\n```\n/home\
    \  hockey(rw) baseball(rw) soccer(rw)\n```\n\nMake sure the file /etc/rpc.d/netcm1\
    \ has the following components in:\n\n+   In the beginning of the file, where\
    \ the variables are defined, make sure the following variable definitions are\
    \ present: NFSD=/etc/rpc.mount and NFSMUNT=/etc/rpc.mount.\n\n+   In the file,\
    \ there are a series of if/then statements. Right after the INETd if/then, make\
    \ sure the following statements are present:\n\n```\nif [ -X $NFSD ]; then\n \
    \ echo -n ' basename $NFSD '\n  $NFSD -f /etc/exports\nif [ -X $SMOUNT ]; then\n\
    \  echo -n ' basename $SMOUNT '\n  $SMOUNT\n```\n\n# Setting Other Machines To\
    \ Access NFS Mounted Directories\n\nThe machines NFS mounting the directories\
    \ are clients. Sometimes you'll have a machine being both server and client, if\
    \ it needs to both offer and mount NFS directories. Make sure if a machine is\
    \ performing this dual function that you do both the server and client setup.\n\
    \nThere is one file you need to attend to the machines you want to mount an NFS\
    \ directory. This file is /etc/fstab (covered in depth in the\n\n![](img/df069eac9f46c8d8f72de31230fb3cab_116_0.png)"
