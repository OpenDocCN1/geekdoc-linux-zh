  md: '# Testing Your FTP Server


    Now let''s see if everything works! There are a number of access avenues and features
    that need to be tested.


    # FTPing into Your Site


    Test both the ability to FTP anonymously in ftpsoft, and FTP into a user account.


    For example, I''ll FTP anonymously to ftp.renaissoft.com. From my personal account,
    I''ll just type **ftp.renaissoft.com**. NcFTP is smart enough to figure out your
    e-mail address for itself, so you don''t have to type it in as your password.
    Then, I get the welcome message to the machine and am given a prompt (see fig.
    10.1).


