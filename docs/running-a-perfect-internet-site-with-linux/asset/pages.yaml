    6. Take a look in the sample rc (resource) files in the tob/sample-rc direc-

    tory. The two files that exist for AFIO are:


    +   - tob.rc-afio: Uses compressed AFIO backups.

    - tob.remote-afio: Uses compressed AFIO backups, but backs

