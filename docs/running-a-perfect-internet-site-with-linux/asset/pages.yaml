  md: '# Commands in a sendmail.cf File


    It takes a little getting used to, but just remember that commands are only one
    character long in your sendmail.cf file, and the first letters on the line are
    the commands, as shown in table 6.1.


    | Table 6.1 Commands Used in sendmail.cf

    | Command | Use | Syntax |

    | --- | --- | --- |

    | D | Defining macros | D[macro][value] |

    | C | Defining class macro | C[class][word1][...] |

    | F | Defining class macros from pipes | F[class][filename] |

    | H | Defining headers | H[?flag][name]:[format] |

    | M | Defining mailers | M[name],field]=[value] |

    | O | Defining options | O[option][value] |

    | P | Defining delivery priorities | P[name]=[value] |

    | R | Defining rewriting rules | R[lhs][rhs)[comment] |

    | S | Declaring new ruleset starts | S[number] |

    | T | Declaring trusted users | T[user1][user2][...] |


    The following are some examples and a more in-depth discussion of the two straightforward
    sendmail.cf commands:


    +   The P command is used to set mail priorities. Whether you use priorities is
    your choice. As more mailer programs and people out there start using mail priorities,
    it may be worthwhile to define in your sendmail.cf file. The main problem with
    defining priorities is coming up with the right terms. For example, you may want
    to use something like this:


    ```

    Purgent=100

    Pjunk=--100

    ```


    The larger the number, the higher the priority. The smaller the lower the priority.
    Just keep in mind that you need to use priority'
  merge: -1
