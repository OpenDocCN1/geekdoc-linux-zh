    When a site is supposed to get a particular article, a line is written to the
    file that tracks articles need to be sent. |

    | Program | Each time an article comes in that goes to the site being defined,
    a process starts up to handle this article. |

    | Channel | Each time an article comes in goes to the site being defined, a line
    is sent to a process telling it about the article. If this process exits, it''s
    restarted or the data is written to a file if it can''t be restarted for the moment,
    and handled later when the process starts back up. This differs from the program
    feed in that there''s only one process handling the articles. |


    What you need for the param statement differs for each feed type, as follows:


    +   - Log: No param statement is necessary.

    - File: This is the full path name telling the server where to save the article
    data. If you only include a file name, the file is saved to /usr/ spool/news/out.going.
    The default value if you don''t use the param statement is /usr/spool/news/out.going/sitename
    where sitename is the name assigned to the site you''re feeding.

    - Program: This is the path name to the article. Use a simple %s to insert the
    path name relative to the spool directory.

    - Channel: This is the full path name for the process to start.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '# ME Definitions


    You must have one and only one ME definition in this file. It also needs to be
    the very first server entry in the file. The ME item also serves as the base sub-subscription
    for the sites you feed. It''s added onto the beginning of each site''s subscription
    list.


    An example ME line is as follows:


    ```

    ME\n:*,junk,foo.*,control.*

    ```


    This example breaks down as follows:


    +   - ME: This is the name of the site being defined—in this case, your own site.


    +   - *,junk,foo.*,control: This is the patterns used for your newsgroup subscriptions.
    You''re subscribing to all newsgroups (the first item in the list is a *) and
    then telling it to not get the junk groups from your feed site, the foo hierarchy,
    or the control group.


    > Note

    The control group carries control messages, which are used to make changes in
    your newsgroups on your site. If you run a large news server with a large group
    list, it''s a good idea to use control because otherwise, you''ll have to maintain
    it by hand. However, if you run a small site, you''ll have problems with the month
    posting to control of the checkgroups file. This resets the newsgroup listings
    of the server it goes to, so your partial listing would become a full listing!
    If you don''t have the space to hold this, you definitely don''t want the control
    group.


    Also, the control group is used to carry control messages, such as article cancellations.


    # Other Site Definitions


    Here are some examples of setting up site definitions for various purposes.


    You can set a site definition to handle archiving the posts for specific groups
    by sending the appropriate attributes to an archiving program. Let''s say you
    want to archive the posts to all of the comp.os.linux groups. It would look like
    this:


    ```

    source-archive!\n:*,comp.os.linux.*\n:Tp/news/bin/archive %s

    ```'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Chapter 9—Installing UseNet Server Software


    One method of feeding news to a site is by sending news batch files to the site
    downstream. Here I''ll set the definition to send everything but local administration
    traffic to the site news.downstream.net.


    ```

    downstream\

    ::!junk/!foo\

    ::Tf,Wmn:news.downstream.net

    ```


    Another method of providing newsfeeds through UUCP. Here''s an example of sending
    all of the comp groups to the UUCP site buddy.


    ```

    buddy\

    :!*,comp.*\

    ::Tf,Wfb

    ```


    # The nnnrp.access File


    The nnnrp.access file defines what clients can access your news server, and from
    what they are allowed to do (read and/post). The example file is as follows:


    ```

    ## SRevision: 1.4 $

    ## nnnrp.access - access file for on-campus NNTP sites

    ## Format:

    ## <host>:<perm>:<user>:<pass>:<groups>

    ## Connecting host must be found in this file; the last match found is##used,
    so put defaults first.

    ## <host> Wildcard name or IP address

    ## <perm> R to read; P to post

    ## <user> Username for authentication before posting

    ## <pass> Password, for same reason

    ## <groups> Newsgroup patterns that can be read or not read

    ## To disable posting a space in the <user> and <pass> fields, since##there is
    no way for client to enter one.

    ## Default is no access, no way to authentication, and no groups.

    ## *:-no- -no-: -no-:!*

    ## Foo, Incorporated, hosts have no password, can read anything.

    ## *:.foo.com:Read Post::*:

    ```


    ```

    *:-no- -no-: -no-:!*

    *:Read Post::*

    ```


    An example access definition is as follows:


    ```

    catherine.renaissaoft.com:Read Post:::

    ```


    This definition breaks down as follows:


    +   - The host being defined is catherine.renaissaoft.com.

    - People from this host can both read and post articles.

    - The client doesn''t need a user id to connect to the server.'
