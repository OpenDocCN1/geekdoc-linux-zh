  md: '# The fthosts File


    If you want some control over where various users can FTP in from (allowing and
    disallowed hosts), you can use the fthosts file to allow or deny access. This
    is useful if you only want people to be able to FTP in from particular locations,
    or if you find someone is using your site in a way to prevent from particular
    locations (e.g., uploading files you don''t allow, such as copyrighted material).
    The contents of the fthosts file are:


    ```

    # Example host access file

    # Everything after a ''# '' is treated as comment,

    # empty lines are ignored


    allow bartm somehost.domain

    deny fred otherhost.domain 131.211.32.*

    ```


    Note that the syntax is in three columns:


    +   - allow or deny

    - Username of the account whose access you want to allow or restrict

    - List of full domain names or IP address(es) from which the person is allowed
    or forbidden to log in, including the name of the specific host (or an * if you
    are referring to all hosts at that site). Only a space is required between names/IPs.


    > Caution

    If you use allows, only people coming from the hosts you explicitly listed can
    FTP as the specified username.


    # Setting Up Site EXEC Programs


    If you want to allow anonymous users to run executables on your FTP server, put
    these programs into the directory assigned in pathnames.h.


    > Caution

    Be extra careful what you put in this directory; you do not want to create a security
    hole for yourself!'
  merge: -1
