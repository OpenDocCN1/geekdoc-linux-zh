    # The slip.login File


    The slip.login file is what''s run when someone logs in via dial-up as just slip.
    There is only one change you need to make in this file, which is the hardware
    address for your Ethernet card. To get this, type ifconfig. The Ethernet address
    in the example is below 00:20:AF:6E:E1:47.


    ```

    #!/bin/sh

    # (@)slip.login 5.1 (Berkeley) 7/1/90

    # # generic login file for a slip line. slipinvokes with this

    # the parameters:

    #      1       2       3       4       5       6       7

    # B-n # slipunit tyspeed pid loginname local-addr remote-addr mask

    opt-args

    #/sbin/ifconfig $1 $5 pointoint m mtu 1500 arp -trailers up

    /sbin/route add $6

    #in case you have an ethernet card this will announce the slip

    client

    #xx:xx:xx:xx has to be replaced by your hardware address

    /sbin/arp -s $6 00:20:AF:6E:E1:47 pub

    echo $4 > /var/run/$6

    exit 0

    ```


    # Accessing the Internet from Winsock on the Same Network


    If you have machines on your local network which you switch between Linux and
    Windows, or on which you use only Windows, you can use them to access the Internet
    over Ethernet even if they''re not in Linux. Just configure your Winsock program
    to use a direct connection instead of SLIP or PPP, and set the appropriate network
    values.


    # Using Your Virtual Consoles


    One wonderful feature of UNIX that Linux shares is of having virtual consoles.
    By virtual consoles, I mean that you can be logged in to the system more than
    once and through different accounts.'
