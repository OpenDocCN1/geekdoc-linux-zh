  md: '# # Chapter 6

    Installing E-mail Server Software


    Now that you''ve got Linux installed and accounts created, you can move on getting
    your servers set up. Start with the one that''s often the most necessary and your
    electronic mail server. After all, e-mail is the most used tool on the Internet
    other than, haps, Ping!


    There are three e-mail servers you may want to install. One is the Sendmail server,
    which will handle your SMTP mail to and from the Internet. Simple Mail Transport
    Protocol (SMTP) is the standard method for transmitting electronic mail from one
    site to another.


    The second is a Post Office Protocol (POP) mail server. A POP server holds mail
    for people just like a post office box. Users can connect to the POP server as
    they wish and it will transfer their mail to them. Some POP servers can also send
    mail out to the rest of the Internet.


    Finally, there is a Unix-to-Unix Copy (UUCP) server. UUCP, in a way, is between
    SMTP and POP. It sends and sends its files in batches at regular intervals, and
    doesn''t require a permanent connection as long as it''s connected during its
    file transfers. Many sites are more likely to have their users UUCP from home
    to send their mail, than to use it for their own mail transfer. This server is
    useful for more e-mail, it also can transfer news. Chapter 9, “Installing UseNet
    Server Software,” has more about setting up this function.'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# 114 Chapter 6—Installing E-mail Software


    In this chapter, you learn how to set up:


    +   * Sendmail for local mail

    * Sendmail for Internet mail

    * Sendmail for UUCP mail

    * A POP mail server

    * A UUCP mail server


    # Setting Up Sendmail


    The Sendmail server was conveniently installed during the Linux setup process
    that you went through in chapter 4, “Installing Linux from the CD-ROM.” This includes
    a basic Sendmail configuration file (sendmail.cf). Although the basic configuration
    file was set up during the installation process, there is more work to be done
    to configure it for your particular needs.


    | Tip |

    | If you have not installed Sendmail, log in as root and type setup. Add a package;
    the Sendmail items are on disk set N. To save a little time, choose the option
    that sets up your sendmail.cfg file. |


    Although there are entire books on the subject of Sendmail, I''m going to show
    you how to set up your Sendmail server for the basic tasks that you need to be
    able to perform. In the section, “Setting Up Sendmail for Local Mail Delivery,”’ll
    learn how to configure your mail server to handle the following functions:


    +   * Mail within your local system

    * Mail to the Internet

    * UUCP mail


    > Caution

    Don''t get the Sendmail files confused with the smail files. Smail is a completely
    different mail server!'
  merge: -1
