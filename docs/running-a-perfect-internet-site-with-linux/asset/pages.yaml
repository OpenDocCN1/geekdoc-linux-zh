  md: '# Chapter 12


    # Security


    Being on the Internet full time leaves your site open to potential problems with
    hackers and mischief. I don''t want to blow this out of proportion; many sites
    will have no problems with such things. However, as the saying goes, “Better safe
    than sorry.”


    When it comes to security, it''s best to decide what kinds of security measures
    you''re going to take before you start any more of your site. Your security route
    will determine how each of your servers contacts the Internet.


    In this chapter, you learn:


    +   - The security options open to you

    - How to set up security for your site

    - About the infamous SATAN program


    # Security Options


    There are two basic routes you can take with Internet site security. You can use
    some basic Internet smarts and other tricks to make your site as secure as possible,
    or you can set up a firewall to cut off access to most of your site from the outside
    world.


    # Basic Internet Smarts and Tricks


    You can make a fairly secure site on the Internet without doing anything spectacular.
    The things you should consider doing are discussed in detail in the section “Setting
    Up Your Security.” A brief list of what you''ll want to consider includes:'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Chapter 12—Security


    +   - Disable services you don''t want to offer to the outside


    +   - Limit access to logging in as root to make it more difficult for attackers
    outside your site to get root access


    +   - Address Linux and Internet security issues


    +   - Test your security


    You can run a fairly secure site this way (and many sites of all sizes do), but
    this method isn''t sufficient for people who have the need to ensure that no one
    can get into their systems. If you absolutely, positively have a need to keep
    people out, and if you have an extra computer to devote to it, see the next section
    on firewalls (instructions on installing firewalls are in appendix E).


    # Firewalls


    A firewall is like a one-way mirror. It lets your users see out of your site,
    but doesn''t let anyone (even your users) in from outside. The firewall acts as
    a central server, somewhat like directing traffic. It knows where the packets
    for your services and your users all need to go, and routes them to the proper
    machines and ports accordingly. However it looks to the rest of the Internet if
    all your users are on that machine.


    Running a site with a firewall is a lot of extra work for the system administrator
    (you), but worthwhile if you think a firewall is necessary. You have to implement
    many extra security measures on each computer on your network, and you can''t
    allow users to install their own software.


    You might want to use a firewall for one of the following reasons:


    +   - If you have data on your site that you absolutely need to make sure people
    can''t get to. The type of data you might want to protect with a firewall is data
    you think people might actively try to get. Moreover, it''s data that you can''t
    afford for people to get. For example, vital data that can make or break it for
    your business may not be a good thing to keep on a computer that''s accessible
    to the Internet without being protected by a firewall. However, keep in mind that
    to get that information someone has first get into your site, or find it accidentally,
    know what to do with it. If you don''t want to have a firewall but also are concerned
    about some files you have on your system, consider keeping them on floppies or
    on a computer that isn''t connected to your network, and only having them on your
    network when you''re working on them.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# Setting Up Your Security


    +   - If you feel that your site in particular will be a target for intruders
    because of its nature. For example, if you are in a highly competitive field and
    there have been problems with people stealing information from one another, you
    may want to consider a firewall.


    +   - If you want experience in setting up and maintaining a firewall


    You also may not want to run a firewall for the following reasons:


    +   - Firewalls make a lot of extra work for the system administrator. If a user
    wants to run a program that reaches out to the Internet, you have to compile that
    client/program yourself and add it to the server knows how to route properly.
    So, you have the choice between restricting what users can do from site, or spending
    a good amount of time recompiling programs to be able to use the firewall, and
    setting up the firewall to know what they are. If you prefer a fairly low maintenance
    site, you may not want to use a firewall.


    +   - If you have a small network (2-3 machines) where you can physically keep
    an eye on what''s happening on each of them on a regular basis, you probably don''t
    need a firewall. As long as you can check on the processes running on your site
    and the devices being mounted, you will have a good feeling for what''s going
    on and what looks a little funny. As you get more machines (10 and up), it''s
    easier for things to slip past.


    If you intend to run a firewall, first go through the basic Internet security
    setup in this chapter, and then appendix E for how to set up the firewall itself.
    After all, you''ll want some security on the machines behind your firewall! The
    next section covers how to set up your basic security.


    # Setting Up Your Security


    Now that we''ve talked a bit about the kinds of security options you have, and
    why you might or not want to go as far as a firewall, we can get started on setting
    up everything. If you''re not sure whether you want to use a firewall, you can
    see how happy you are with the security on your site as it stands after the basic
    setup, and then make the decision.


    You can take a number of simple precautions to increase your site''s security.
    The idea is to deadbolt as many doors as you and to make sure the rest are securely
    locked and the keys are properly protected.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_254_0.png)'
  merge: -1
  pgno: 254
- img_proc: true
  md: '# User Passwords


    Onehuge security hole most system administrators have to deal with that of user
    passwords. Of course, it''s imperative that intruders not be able to guess a user''s
    password.


    Initially, you need to ask the user for a password to use for the first login.
    Be sure to emphasize that this password should be changed as soon as possible
    to prevent anyone breaking into the user''s account.


    > > Tip: If you offer SLIP accounts without shell account access, you''ll have
    to handle changing their passwords for them! Or, you can let them telnet in and
    use their limited shell account and use the passwd command from there.


    One of the initial pieces of e-mail you send to your users should be a guide to
    selecting passwords. Remember, the more informed your users are, the better choices
    they will make and the better off your site will be! Many passwords are poor because
    they can be readily obtained by someone who takes the effort to learn about your
    users (see table 12.1).


    | Table 12.1 Passwords That Make for Poor System Security |

    | Type | Examples |

    | Family Names | Your name, your spouse or significant other''s name, any of your
    parents'', pets'', or children''s names. |

    | Other Names | Your friends'', coworkers and boss'' names, names of favorite
    fictional or historical characters. Names in general are a bad idea. |

    | System Related | The name of your computer, operating system, site, user name.
    |

    | Personal Information | Your phone number, social security number, birthday,
    or other easily found personal info. |

    | Dates | Any birthday of your friends or family. Your wedding anniversary or
    favorite holiday. |

    | Ego Trips | Don''t choose anything like God, Wizard, famous wizard''s names,
    famous leaders'' names or titles. |'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# Examples


    | Type | Examples |

    | --- | --- |

    | General | Because so many system break-ins happen due to people having access
    to it that simply try passwords one by one until they get into an account, it''s
    really best to avoid any of the following: words from the English dictionary,
    words from any foreign dictionary supported by your system, place names, or proper
    nouns. Also, avoid any of the words listed in any of these dictionaries spelled
    backwards or with a number at the front. |

    | Garbage | Passwords of all one letter, or simple junk keyboard patterns like
    asdf. |


    The best choices for a password are acronyms or two unrelated words placed together.
    You can also interperse numbers and any other keyboard characters. An example
    is TMY^stack (This Is My first account), where you''ve got acronyms, a non-letter
    character, a number, and abbreviations. Of course, now that I used this here,
    it''s a bad password, so choose another one!


    # Shadow Passwords


    Pretty much anyone breaking into your system knows to whatever they can try to
    get the /etc/passwd file. If they do that, they''ve got every password for every
    user and process on your site. Of course, the passwords in this file are encrypted,
    but people have access to the encryption program and can just compare items they
    encrypt themselves to the ones in your file. This is one reason why it''s so important
    not to choose a password that''s easy to guess!


    > Note

    Remember, your /etc/passwd file has to be world-readable! That''s not really the
    best security, because anyone can read the file. If everyone can read the file,
    they can also copy the contents. Then, they can decode the passwords contained
    in this file; the encryption used in /etc/passwd isn''t as secure as most of us
    would like.


    To better protect the passwords for your site, you can replace the standard password
    system with Shadow passwords. This program keeps your password file in a separate
    file that doesn''t have to be world readable, and that has better encryption.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Chapter 12—Security


    Of course, there are down sides to using Shadow passwords. You need to compile
    a few of your servers so that they don''t look in the /etc/passwd file for your
    user passwords. You can''t use the adduser command to add a new user to your system
    because the standard adduser utility looks straight at the /etc/passwd file. I
    will walk you through how to deal with these things once you have Shadow passwords
    installed.


    | Tip |

    | The first part of installing Shadow passwords is to save things out so you can
    easily uninstall Shadow password''s changes, so it''s not that risky of a change
    to your system |


    I highly recommend that you install Shadow passwords to make your system more
    secure. It''s worth the extra work.


    **Installing Shadow Passwords**

    If you want to use or try Shadow passwords, you need to install the Shadow passwords
    package. First, to prepare for the installation, do the following:


    +   1. Login as **root**.

    2. On the CD-ROM, go to the directory /extras.

    3. Copy the file shadow.tgz to the directory where you unzip your file for compilation
    (e.g., incoming).

    4. Uncompress the file using gunzip.

    5. Untar the file using tar -xvf shadow.tar.

    6. Change into the new directory shadow-mk.

    7. Type **make save** to save all the old binaries that will be replaced by Shadow
    password''s binaries. This makes it easy to backtrack if you decide to go back
    to not using Shadow passwords. The binaries are all saved into the shadow-mk/save
    directory.


    | Tip |

    | You can restore the old nonshadow binaries by typing **make restore** in this
    directory. |'
  merge: -1
  pgno: 257
- img_proc: true
  md: 'Now, to compile and install shadow passwords on your system, do the following
    (you are logged in as root, in the shadow-mk directory):


    +   1. To compile the shadow passwords group of programs, type make all. This
    compilation can take a while.


    +   2. To install the shadow passwords group of programs, type make install. This
    puts all compiled binaries where they should go, sets permissions, and so on.


    Finally, you need to perform a few housekeeping tasks to complete your shadow
    passwords initial setup (you are logged in as root, in the shadow-mk directory):


    +   1. Type /usr/sbin/pwconv to run the binary that converts your system to shadow
    passwords.


    +   2. Type mv /.npasswd /etc/passwd to move the file shadow-mk/npasswd to /etc/passwd.
    Now you''ve replaced your old password file with one that contains no passwords.
    All the passwords are in the next file.


    +   3. Type mv /.nshadow /etc/shadow to move the new password file into place.


    +   4. Change the modes of the password file back to world readable, but only
    owner writer, by typing chmod 644 /etc/passwd.


    +   5. Change the modes of the shadow file (your new password file) to owner writable,
    group readable, and world nothing (who''s not the owner or group has absolutely
    no access to the file) by typing chmod 640 /etc/shadow.


    +   6. Change the ownership of the shadow file by typing chown root.shadow /etc/shadow.
    The shadow file is much more secure than /etc/passwd.


    +   7. Create the following log files with the touch command:


    ```

    /var/adm/lastlog

    /var/adm/ftmp

    /var/adm/faillog

    /var/adm/sulog

    ```'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# Changing Your Binaries for Shadow Passwords


    Some of the programs you run on your system will no longer work with Shadow passwords.
    Basically, any server that needs to handle logins—and, hence, passwords—needs
    to be recompiled to handle Shadow passwords (e.g., FTP). All the source for the
    binaries on the CD-ROM is also included there. Often there''s an option in the
    Makefile itself to compile for Shadow passwords.


    # Adding Users Using Shadow Passwords


    The aduser script automatically uses the /etc/shadow file, you need to replace
    it with something that will use the /etc/shadow file. Fortunately, the Shadow
    passwords package comes with a program you can use! From now on, while adding
    users, use the program useradd instead of the program adduser. The program useradd
    understands how to handle Shadow passwords.


    > Tip

    For more on the /etc/shadow file see the man page for shadow (man shadow) and
    the man 4 page for shadow (man 4 shadow).


    # Disabling Outside Access to Root


    Now is the time to decide what you want people to have access from outside your
    site and individual machines. Be careful not to cut yourself off completely because
    you might want to telnet into your site to maintain it if you''re away.


    In the file /etc/security is the list of all the ttys (the specific terminal addresses
    each session uses) that are considered secure that people can log in as root from
    them. It is important not to allow root logins from anywhere, because it becomes
    too easy for people to have a chance at trying to get your root password. The
    terminals you want to allow access to are the straight ones (e.g. tty1, tty2,
    and so on). Even there, you may not want to limit how many of these people can
    log into root. In a typical Linux setup, tty1 through tty12 are your function
    keys. Therefore, if you only allow tty1 through tty6 to log in as root, you can
    only log in as root with function keys F1 through F6.'
  merge: -1
  pgno: 259
- img_proc: true
  md: '# Setting Up Your Security


    # Note


    You cannot log in as root from terminals not listed in the securetty file, but
    you can su (superuser) into root. By typing su you can temporarily act as though
    you''re in another account. Typing su by itself means you''re trying to superuser
    into root. To access another account you''d use su userid (e.g. su joe). You''ll
    be asked for the account''s password, then you''re in.


    While this fact may seem like the security measure useless, keep in mind that
    someone trying to break into your system would first have to get a password into
    another account before they could try for the root password. This slows down them
    bit, which gives you more time to catch onto the problem.


    # Tip


    To see what ttys you have available, go to the /dev directory and type tty* (see
    table 12.2 for an explanation of tty naming). All the files listed refer to a
    single terminal.


    | Table 12.2 Terminal Naming Conventions and Types |

    | tty Type | Purpose |

    | tty | Console login, directly from the keyboard. The numbering for ttys is in
    hexadecimal, so ttya, ttyb, and tty are actually tty10, tty11, and tty12. |

    | ttyS | Serial login (e.g., modem) |

    | ttyp | Telnet login |


    # Note


    To add a tty, use the mknod command. Type Is -l tty* in /dev and look at the file
    listing. Notice that instead of a file size, there are two numbers separated by
    commas. The first number is the major number, and the second is the minor.


    (continues)'
  merge: -1
  pgno: 260
- img_proc: true
  md: '# 242


    # Chapter 12—Security


    (continued)


    The major number is the same for every tty definition. For the minor number use
    the next one in the sequence for the particular tty type unless it is already
    being used for another tty definition.


    For example, if I wanted to add another modem dial-in terminal, and the last one
    available was tty3, at 4, 6, 7, I would type in `mknod -m 660 /dev/tty5c 4 68`.
    This line breaks down as follows:

    - mknod: The command being run.

    - -m 660: Sets the mode of the file to 660 (owner can read and write, group can
    read and write, others have no access).

    - /dev/tty54: The device name for this terminal.

    - c: Creates a device that handles characters (e.g., on a terminal, you''re typing
    one letter at a time, but on a disk—a block device—sends data in blocks/chunks).

    - 4: Major number for the device. All devices of the same type will have the same
    major number. For example, all tty definitions are the same type of device, so
    every tty entry will have the same major number (4 in this example).

    - 68: Minor number for the device. This number is specific to this definition.
    Follow the sequence of numbers that already exist for the type of tty.


    If you occasionally find the need to be able to log in directly as root remotely,
    you can choose one terminal to allow this from and then disable it again once
    the need has passed.


    # Disabling Services You Don''t Want To Offer to the Outside


    If you don''t want outside users to have access to a specific service (for example,
    FTP), be sure to disable this access. See the chapter covering the service you
    want to limit for your options on limiting access to services (e.g., chapter 7
    for your Web server).'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'If you decide that you don''t want to offer a service at all, don''t install
    the server or disable it. To make sure the daemon isn''t running, go to the appropriate
    file (e.g., /etc/inetd) and comment out or remove the line that refers to the
    server, and then be sure the process is killed:


    +   - If the item was in inetd, kill and restart inet.

    - If the item was not in inetd, kill the process itself.


    > Caution


    Be sure to remove the item from the file that starts it up in the first place.
    Otherwise, it will restart the next time you reboot your system.


    # Keeping Up with Linux Security Issues


    It is important to keep up with Linux security issues. When a security hole is
    found, information is broadcast along a few channels to sysadmins about it. Unfortunately,
    in explaining how to correct the problem, the problem itself must be revealed.
    So, if you don''t fix the problem at your site, suddenly become vulnerable to
    attack along the lines of the correctable problem.


    You can join two mailing lists to keep track of security issues:


    +   2. linux-security This mailing list is for the discussion of linux security
    issues. To join the list, send E-mail with the message subscribe linux-security
    youaddress@your.site (e.g., subscribe linux-security dee@renaissoft.com) to majdomordo@linux.nrao.edu.
    You can also access list archives by FTPing to linux.nrao.edu, going to the directory
    /pub/linux/security/list-archive and getting the file linux-security.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# Chapter 12—Security


    If you want to subscribe to only one of these lists, subscribe to linux-alert.

    You may still want to take a look at the archives for the linux-security list
    on occasion to keep up-to-date on current happenings.


    # Testing Your Security


    Testing your site''s security is a good way to make sure to catch any holes.

    One excellent method of testing security is the SATAN program (see the section
    on SATAN later in this chapter for information on installing and using this program).


    The reason SATAN is such a useful tool is that it finds security holes and tells
    you how to fix them! It''s also important to use SATAN to test your system because
    people outside your site can also use it on your system. It''s better to catch
    the problems you understand and fix them than to have an intruder find the problems
    first and exploit them.


    > Tip

    One interesting security avenue to follow is to locate hacker FAQs on the Internet.
    Search the Web for hack and ask around.


    > Tip

    There is a program on sunsite.unc.edu in /pub/linux/system/admin called Crack.
    You can use it to check the passwords on your site and see how many of them it
    can figure out (how many it can crack). Then, notify the users whose passwords
    they found that they need to change them, and give them suggestions on how to
    choose a secure password.


    # Using SATAN on Your System


    You can use SATAN to test your system security. It attacks a good number of entry
    points to see if it can get anywhere, and then reports back to you to let you
    know how far it got, and how to seal up the holes. This is definitely worth doing!'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Getting the Source


    The source for SATAN is on the CD-ROM in /estras/satan.tgz. Copy it to /usp/src,
    un-gzip, and un-tar it. It will create the directory satan-1.1.1.


    # Applying the Patch from the CD-ROM


    You first need to apply a patch file to the source. This file is available at
    Sunsite in /pub/Linux/system/network/admin/satan-linux.1.1.1.diff.gz, and there
    is a README file. Copy it into the directory where your satan-1.1.1 directory
    is.


    > Caution

