- img_proc: true
  md: '# Chapter 9

    Installing UseNet Server

    Software


    Reading news and participating in UseNet and other news hierarchies is almost
    as popular as an activity on the Internet as reading and writing e-mail. News
    is a way for people to participate in worldwide discussion forums or simply follow
    how various issues are viewed in other places.


    Now is the time to decide whether you need to run a news server to handle news
    on your own site. If you do, it''s time to install it!


    In this chapter, you learn the following:


    +   - How to decide whether you need a news server

    - How to decide which kind of news server you want to run

    - How to configure your news server

    - How to verify your news server


    # Do You Need a News Server on Your Site?


    Many sites don''t need to run their own news servers. Instead, their software
    is configured to access the news server of their own provider. While this process
    takes a bit longer on the user''s end, it saves a lot of your system resources
    for other tasks.'
  merge: -1
  pgno: 196
- img_proc: true
  md: '# 178 Chapter 9—Installing UseNet Server Software


    The following are two different types of news service that your site can offer:


    +   - Organizational news server, which occasionally downloads limited newsgroups
    for your users


    +   - Full news server, which passes news onto other sites as well


    # Do You Want To Run an Organizational News Server?


    Disk space, bandwidth, and your users'' privacy are important considerations for
    when deciding you want to run an organizational news server.


    # Disk Space Considerations


    Depending on the number of groups your users want access to and how much traffic
    each of these groups has, news can take up a small or huge amount of disk space.
    If you know which groups are on your site you can get an idea of the amount of
    material that comes through them on a regular basis by reading the file USENET_Readership_report
    for whichever month you are curious about. You can find this via FTP at rftm.mit.edu
    in the directory /pub/usenet-hierarchy/lists. This is an example of what you will
    see in this:


    ```

    Estimated total number of people who read the group, worldwide.

    +- Actual number of readers in sampled population

    +-- Propagation: how many sites receive this group at all

    +-- Recent traffic (messages per month)

    +-- Recent traffic (megabytes per month)

    +-- Crossposting percentage

    +-- Cost ratio: $/US/monthrdr

    +-- Share: % of newsreaders

    +-- who read this group.


    V V V V V V V V V V V

    1 510000 3373 91 0.6 22 0.0 5.7% news.announce.newusers

    2 250000 2759 57 1.5 11088 45 0.02 1.6% alt.sex

    3 240000 2700 80 7.3 0 0.0 3.0% rec.hum.funny

    4 220000 2508 51 8.3 5387 54 3.7 4.2% alt.stories

    5 180000 1342 38 5.7 99 0.0 2.3% news.answers

    6 180000 1205 87 1 0 0.0 2.0% news.announce.important

    7 170000 1218 47 1861 829.6 25 2.0 3.7% alt.binaries.pictures.eretica

    8 170000 1204 84 3432 51.9 24 0.22 2.1% misc.jobs.offered

    9 160000 1119 87 8296 14 2 0.07 1.9% news.newusers.questions

    10 150000 1104 83 5161 7.0 21 0.03 1.8% comp.lang.c

    ```


    In the July 95 version of the USENET Readership Report, 3095 groups are listed,
    so it''s fairly easy to get a feel for most of the groups your users might want
    to read.'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'When you have the raw numbers in front of you, it just takes a bit of math
    to figure out how much disk space a group might occupy. Take a look at the group
    misc.jobs.off. The data passing through this group in a month totaled 51.9M. If
    you look at a 30 day month, it is 1.73M per day. If you want to be able to keep
    news on your site for a week (7 days) before it expires, then this group will
    consume around 12.11M of hard drive space as a general rule.


    This is just one group, albeit one that takes up more disk space than many pure
    text groups such as news.answers, which only requires .5M in a month of traffic).
    However, as you can see with a quick glance at the top 10 groups listed above,
    if you are going to carry binary groups, you are going to be even more concerned
    about space!


    If you don''t think you''ll have the hard drive space to handle the group load,
    consider using your uplink''s news server—especially if you feel you''re able
    to purchase the kind of hard drive space you really need to meet your site''s
    needs. When everything is up and running, you can take a look at how much hard
    drive space you have available and determine how you want to install a news server.


    | Tip |

    | Traffic in newsgroups can fluctuate from month to month. If you''re particularly
    concerned about disk space, you may want to average the traffic for the groups
    you''re looking at over a few months'' worth of samplings.|


    | Tip |

    | You can mount /var/spool/news from a hard drive dedicated to that directory
    just like you do with /home. The process for mounting remote directories is discussed
    in chapter 5, Setting Up Your Site for General Use.\.|


    # Bandwidth Considerations


    If you run your own news server, your site must periodically download the new
    news for every group you carry (e.g., once an hour). If you have a "slow"'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'connection, such as one at 28.8 kbps, and unless you carry a minimal num-ber
    of groups (high traffic binary groups count for more than one in this case), your
    news transfer can take a painful bite out of the bandwidth you have available
    every time you downloads new news postings. Even with an ISDN connection at 64
    kbps, a large amount of news traffic can take a chunk out of your bandwidth for
    every download.


    To get a feel for the effect your news traffic will have on your bandwidth, use
    the calculations you made in the previous section. If you calculate that your
    news traffic will be around 750M per month, that''s 25M per day (for a 30 day
    month). If you download new news posts once per hour, that''s approxi-mate 1M
    per hour.


    If your connection is 64 kbps, it will take approximately 2 minutes for 1M of
    data to pass through your connection if only news traffic is traveling the time
    (time taken from experience). So, an hour for an average of two minutes, your
    connection would be rather slow until the news transfer finishes.


    This in it can be annoying if you are trying to do something bandwidth-intensive
    when the news transfer hits. The more groups your users want, the more news traffic
    you will have. So if you find that you need to carry 2M or 3M worth of news, suddenly
    your bandwidth is slow for 4 or 6 minutes. That doesn''t count anything else you
    and your users are doing that also eats up bandwidth, which will slow the news
    transfer down.


    > Another solution to this problem is to download news from your feed site only
    at off times. The longer you wait between news downloads, the longer it will take.
    However, if you only update your newsgroups at 1 AM and 5 AM, for example, it
    won''t matter much to most folks if your bandwidth is slowed down for an hour
    or two. It depends on how often you want to have news updates available to yourself
    and your users.


    However, if your provider has limited bandwidth, they may not appreciate the long
    drain on their resources.


    # User Privacy Considerations


    Although it''s easy to talk about asking your users for the newsgroups they want
    to read, or asking them to tell you if they want to add anything, it can be an
    invasion of their privacy to do so. For example, a user may want to'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Do You Need a News Server on Your Site? 181


    read or participate in a counseling newsgroup of some sort, and it''s really none
    of the provider''s business. After all, users can post anonymously, so there is
    no need for anyone to know who is reading and/or participating in a particular
    group.


    Dealing with this issue is tricky. You may seriously want to consider using your
    provider''s news server unless you have one of the following:


    +   - A small personal site where the few users really don''t mind telling you
    what groups want


    +   - A site where you have a reason to only offer a select list of groups, as
    a business site that carries only groups in its field


    > Note

    Privacy is an important issue for Internet users. No matter how many users you
    have, it is important to try to deal with them in a professional manner as a system
    administrator. Unless there is a serious reason to do so, you should not look
    into users'' directories.


    If you offer paying accounts and require users to list the newsgroups they want
    to read, then perhaps decide against using your site.


    An excellent place to start looking regarding legalities and privacy issues on
    the Internet is the Electronic Foundation''s (EFF''s) Web pages. This group, according
    to the first portion of their main Web page, is "A non-profit civil liberties
    organization working in the public interest to protect free, expression, and access
    to online resources and information." The URL for the EFF is http://www.eff.org/


    # Do You Want To Run a Full News Server?


    If you have a large bandwidth (e.g., T1), you may want to run your own full news
    server. By full news server, I mean a server just like your provider''s: one that
    only brings news to your site, but passes news to other sites, who may pass it
    on to other sites (see fig. 9.1).


    A full news server always has a connection to its feed site and the site it feeds,
    using a program called NNTPlink. Your provider has certain requirements that must
    be met by those who want to connect to their news servers. Sometimes they may
    require a T1 or better, but there is no standard. This is something you will have
    to ask your provider about.'
