    ```


    In this case, text refers to the file type (standard file type), and plain refers
    to the subtype (what MIME calls the file type).


    +   13. AddType allows you to tweak mime.types without actually editing # it,
    or to make certain files to be certain types.


    If you want to assign a particular type to files with certain extensions, you''ll
    use this directive. The types you assign override the types already listed in
    your TypesConfig file. This file already contains a list of file types and corresponding
    MIME types.


    Although you might want to take a look at it (you can find it in conf/ mime.types),
    you shouldn''t need to edit this file. Instead, make your changes by using the
    AddType directive here.


    Let''s say, for example, that I intend to use the extension .help a lot, and all
    .help files will be text files. I would therefore add the following to my resource
    config file:


    ```

    AddType text/plain help

    ```


