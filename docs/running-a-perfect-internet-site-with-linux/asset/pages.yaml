  md: '# Chapter 5—Setting Up Your Site for General Use


    > > Note

    nYou can set up a skeleton directory to mirror what you want your users’ directories
    to look like (particular files you know everyone will need). Just create the directory
    /etc/skel and put everything in there that you want to be in all user directories
    by default.


    It''s common practice to send a standard form letter piece of electronic mail
    to a new account when you set it up. If you write your own account setup program
    or a special script, you can configure your system to do this for you automatically
    so you don''t have to remember to send the mail each time. A simple example script
    I''ll call newUser calls the adduser program, and after-sends the mail you want
    by typing newUser username:


    ```

    #!/bin/sh

    /needpathfor/adduser

    mail -s ''Subject line for the mail'' $1 < /path/file_to_send.txt

    ```


    The lines in this script do the following:


    +   1. /bin/sh

    nTells Linux to run the /bin/sh shell, which interprets everything that comes
    after that.

    2. /needpathfor/adduser

    Runs the adduser program for you. Fill it in just like you filled it in before.

    3. mail -s ''Subject line for the mail'' $1 < /path/file_to_send.txt

    Invokes the mail program. The -s states that the next item is the subject of the
    mail, which you''ll put inside single quotes. The $1 refers to the username (the
    username mentioned above) to send the mail. The < tells the script to include
    what follows in the mail. The item /path/file_to_send.txt refers to the full path
    and filename of the text file you included in the new user $e-mail.


    For example, if I typed newUser dee, I would first go through the adduser program
    as described earlier in this section, and then the script would send dee e-mail
    containing the text file I created for this purpose.'
