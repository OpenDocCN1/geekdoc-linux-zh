    # Creating Data Files


    There are a few files you need to create now for server security. The examples
    shown in this section can be found by going to the directory where you stored
    your precompilation FTP server files, and then changing to the doc/examples directory.


    # The ftpconversions File


    You might not need to change the ftpconversions file, as its purpose is to handle
    file compression and decompression. The contents are as follows:


    ```

    :Z: :bin/compress -c %s:T_REG|T_ASCII:O_UNCOMPRESS

    -UNCOMPRESS

    : :Z:/bin/compress -c %s:T_REG|T_ASCII:O_COMPRESS

    : :gz: /bin/gzip -c %s:T_REG|T_ASCII:O_COMPRESS:GUNZIP

    : :gz:/bin/gzip -9 -c %s:T_REG|O_COMPRESS:GZIP

    : :tar:/bin/tar -c -f %s:T_REG|T_DIR:O_TAR:TAR

    : :tar.Z:/bin/tar -c -z -f %s:T_REG|T_DIR:O_COMPRESS

    -O_TAR+COMPRESS

    : :tar.gz:/bin/tar -c -z -f %s:T_REG|T_DIR:O_COMPRESS

    -TAR+GZIP

    ```


    If the paths above are not correct, change them to the appropriate value.


    Now, copy this file to the location assigned in pathnames.h.


    # The ftpusers File


    First, take a look at the example file for ftpusers:


    ```

    root

    bin

    boot

    daemon

    digital

    field

    gateway

    guest

    nnbody

    operator

    ris

    sccs

    sys

    uucp

    ```'
