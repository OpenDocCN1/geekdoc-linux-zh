- img_proc: true
  md: '# Note


    Smail is an older program that was written so people wouldn''t have to deal with
    the complexity of Sendmail. However, because you can now start with a generic
    sendmail.cf file and simply modify it, Sendmail has become much easier to use
    (you used to have to do it all from scratch). So, smail is not so necessary anymore.


    Additionally, smail is only really suited for small use. Sendmail is necessary
    for running a full Internet site.


    # Tip


    Anything that you do in this chapter, you''ll do from your root account.


    # Setting Up Sendmail for Local Mail Delivery


    You''re already equipped for basic local mail delivery if you chose to let the
    Linux installation program set up your sendmail.cfg file (see fig. 6.1). You''ll
    need to take care of a few items, though, to make sure things run smoothly.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_134_0.png)'
