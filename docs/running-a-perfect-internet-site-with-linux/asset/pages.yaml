    to the world.


    Offering Finger is a simple way to let people set up something to tell the world
    a little bit about themselves. In a way, Finger offers the chance to make a simple,
    personal Web page! Also, outside users can use Finger to find out someone''s e-mail
    address.


    In this chapter, you learn how to:


    +   * Configure your Finger server

    * Compile your Finger server

    * Install your Finger server

    * Configure Finger output

    * Verify that your Finger server works properly


