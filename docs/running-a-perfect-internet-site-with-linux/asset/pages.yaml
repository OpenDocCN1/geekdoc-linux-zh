    # 4. CPU/FPU


    Intel/AMD/Cyrix 386SX/DX/SL/DXL/SLC, 486SX/DX/SL/SX2/DX2/DX4, Pentium. All 386
    or better processors will have built-in FPU emulation if you don''t have a math
    coprocessor.


    Linux does not support SMP yet. Multi-processor systems will run Linux but only
    the first processor will be used. There''s some work being done right now, check
    the Linux Project Map for details.


    A few very early AMD 486DX''s may hang in some special situations. Current chips
    should be okay and getting a chip swap for old CPU''s should not be a problem.


    ULSI Math*Co series has a bug in the FSAVE and FRSTOR instructions that causes
    problems with all protected mode operating systems. Some older IIT and Cyrix chips
    may also have this problem.


    There are problems with TLB flushing in UMC US5 chips. Fixed in newer kernels.


    +   - enable cache on Cyrix processors


