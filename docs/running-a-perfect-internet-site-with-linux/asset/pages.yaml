  md: '# Configuring Finger Output for Users


    > reboot your system to get Kfingerd running, or type kill -HUP # where # is inetd''s
    process ID number, and then type /etc/inetd to get it running again.


    # # Configuring Finger Output for Users


    One reason I chose Kfingerd instead of the standard, normal, everyday Finger is
    because it is a more configurable program. The standard Finger handles out a list
    of information that not everyone wants people to have access to. Kfingerd allows
    each user to choose what information is available to outsiders finger-ing their
    accounts, and what information is not available.


    The file used to individually configure Finger output is called .fingerrc.


    # .fingerrc Commands


    There are a number of commands available to users who want to configure their
    Finger output (see 11.1).


    | Table 11.1 Commands Available in a .fingerrc File |

    | Command | Function |

    | [no]mail | [doesn''t] provide information on new mail, or if all mail has been
    read |

    | [no]remote | [doesn''t] provide information on where people are logged in from
    it''s an outside site |

    | [no]ttys | [doesn''t] provide information on what wty someone is logged in |

    | [no]idle | [doesn''t] provide information on how long someone has been idle
    |

    | [no]log | [doesn''t] log the Finger request in ".fingerrlog |

    | [no]plan | [don''t] show the user''s plan file |

    | [no]proj | [don''t] show the user''s project file |

    | [no]auth | [doesn''t] use ident to get a username for the person making the
    Finger request |

    | profjnm | Define the name of the project file |'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# Chapter 11—Installing Finger Server Software


    | Table 11.1 Continued |

    | Command | Function |

    | planfn | Define the name of the plan file |

    | progfn | Define a program Finger should call |

    | subdfnm | Define a subdirectory where plan files are kept |


    > > Note

    > Items in brackets ([]) are optional.

    > For the last four items (those define files to call or use), if you don''t include
    the name of the file, the item is disabled. For example, if you just enter proffnm
    without a file name, project files are disabled.


    You can also add the parameters in table 11.2 in front of the commands listed
    in table 11.1.


    | Table 11.2 Additional Command Parameters |

    | Parameter | Function |

    | IP[!] | [Don''t] execute the command following this parameter unless it comes
    from the IP address listed |

    | HN[!] | [Don''t] execute the command following this parameter unless it comes
    from the host name listed |

    | HNR | Remap host names somewhere else |


    # Example .fingerrc File


    Now, to get a feel for all of these commands work together, create a sample .fingerrc
    file. Let''s say that I would like to have the following information available
    and not available:


    +   - Let outsiders see what my mail status.

