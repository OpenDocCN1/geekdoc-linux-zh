  md: '# 8. Controllers (I/O)


    Any standard serial/parallel/IDE combo cards. Linux supports 8250,

    16450, 16550, and 1650A UART''s.


    See National Semiconductor’s “Application Note AN-493” by Martin S.

    Michael. Section 5.0 describes in detail the differences between the NS16550\and
    NS16550A. Briefly, the NS16550 had bugs in the FIFO circuits, but

    NS16550A (and later) chips fixed those. However, there were very few

    NS16550’s produced by National, long ago, so these should be very rare. And

    many of the “1650” parts in actual modern boards, which may not use the National
    “A” sup-

    fix. Also, some multiport boards will be 16552 or 16554 or various other

    multipro or multifunction chips from National or other suppliers (generally

    in a dense package soldered to the board, not 40 pin DIP). Mostly, don’t

    worry about it unless you encounter a very old 40 pin DIP National

    “NS16550” (no A) chip loose or in an old board, in which case treat it as

    16450 (no FIFO) rather than a 16550A.—Zahai Stewart

    <zstewart@https.com>


