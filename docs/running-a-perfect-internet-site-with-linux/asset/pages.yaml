- img_proc: true
  md: '# Setting Up Sendmail 121


    names that are used in the mailer clients that send e-mail to your system if you
    want to take full advantage of mail priorities.


    For example, the e-mail program Eudora uses the following priorities:

    High, High, Normal, Low, Lowest. So, you may add the following list of definitions:


    ```

    Phighest=100

    Phigh=50

    Normal=0

    Plow=-50

    Plowest=-100

    ```


    The T defines a trusted user—a user who is allowed to send mail as another user
    (a normal user can only send mail as coming from their own account, while a trusted
    user can send mail as coming from wherever). The standard trusted users are root,
    daemon, and uucp. You will likely find these users already listed as trusted in
    your sendmail.cf file, as follows:


    ```

    Troot daemon uucp

    ```


    You will probably not want to have any other users defined as trusted. After all,
    root should be trusted to do everything on your site, the system administrator.
    Daemons need to be trusted so they can send mail when it''s one of their tasks,
    and that mail should go out as coming from the daemon itself, but from the user
    assigned to it. UUCP should be to be able to shuttle mail around. Other than that,
    you don''t want people on your site being able to pretend to send mail as other
    people from other accounts.


    The rest of the Sendmail commands have their own extra parameters, and there are
    entire books on how to use them properly. Instead of going into an exhaustive
    discussion about what each parameter can do, I recommend the changes that you
    should make.


