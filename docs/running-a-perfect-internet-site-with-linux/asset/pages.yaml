  md: '#  Chapter 11


    # # Installing Finger Server Software


    If you want people to be able to get particular types of information about your
    users, such as when they were last online, or when they last checked mail (which
    information is configurable), you will want to install a Finger server. Instead
    of installing the default Finger server, you are going to install a more configurable
