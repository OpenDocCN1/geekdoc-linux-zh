  md: '# # Partitioning Your Hard Drive


    The next step in the Linux installation process is partitioning your hard drive.
    Even if you plan to have only Linux on the drive, and not MS-DOS at all, you must
    partition your drive to create swap space. However, if you are using multiple
    hard drives in one machine that is used for Linux only, you don''t need a swap
    partition on each drive. Only one swap space per system is necessary.


    > Note

    A swap partition is Linux''s version of virtual memory. The less RAM you have
    in a computer, the more important the size of your swap partition is, as it serves
    as RAM.


    > Note

    From this point, you no longer need MS-DOS capability unless you need to try another
    boot or root disk option. So, if you have MS-DOS on your drive but don''t intend
    to use it, feel free to pretend the drive is blank. For your piece of mind, however,
    you may want to make sure you have access to an MS-DOS system somewhere—just in
    case.


    > Caution

    If you''re installing Linux on a drive that you use for other work and files you''d
    really like to keep, be sure to back them up! Repartitioning a hard drive can
    destroy data if something goes wrong. Back up everything you don''t want to lose.


    # ## Choosing Partition Sizes


    In chapter 2, “What Kind of Hardware and Connection You''ll Need,” I discussed
    things that affect hard drive requirements. I seriously recommend that you get
    at least a 200M drive (not much of a worry since 200M is on the low price end
    of hard drives today) if you want to do anything with your site other than look
    at it. And the more space you have the the better. As I know you''ve discovered,
    no matter how much hard drive space you have, you can find a way to fill it all.'
  merge: -1
  pgno: 72
- img_proc: true
  md: "# Chapter 3—Getting Ready To Install Linux from the CD-ROM\n\n> ### Caution\n\
    Be sure to look at the physical hard drive space, and not compressed hard drive\
    \ space. If you have your hard drive compressed (e.g., by Microsoft's DriveSpace),\
    \ it looks to your computer like the data in that compressed drive is in one huge\
    \ file. If you partition that drive, you will lose your data because the file\
    \ will be broken in pieces.\n\n# Linux-Only Drive\n\nIf you're going to use only\
    \ Linux on a machine, deciding partition sizes is fairly easy. You'll only need\
    \ two partitions: main and swap.\n\n recommend that you make the total available\
    \ memory at least 16M (your RAM plus your virtual memory should total 16M). Of\
    \ course, even if you have a lot of memory on your machine, a server can often\
    \ use even more. Decide how much space on your hard drive you can spare, and give\
    \ yourself as much swap space as you can.\n\n> ### Note\nThe maximum size for\
    \ a swap partition is 128M. If you want more than that, you can create several\
    \ swap partitions, but no more than 16.\n\nTo find the size of your main partition,\
    \ just subtract the swap size from the drive size. (For example, if your drive\
    \ is 540M and your swap partition is 20M, your main partition is 520M.) If you\
    \ have to use multiple swap partitions, total their sizes and subtract them from\
    \ your hard drive space to see how much space you have left for your main partition.\n\
    \n> ### Tip\nOne function of swap space is to handle overflow from your physical\
    \ RAM, and this can be slower. If you find that your applications are consistently\
    \ going into swap space because they have used up all of your physical RAM, you\
    \ should consider purchasing more RAM for your server.\n\n# Linux Plus Other File\
    \ Systems\n\nIf you want to install Linux on a drive that contains MS-DOS and\
    \ Microsoft Windows, you'll need to make three partitions: Linux, swap, and MS-DOS."
