    # Mailing Lists


    One thing many Internet sites run mailing lists. With mailing lists, you can

    have a centralized distribution point to send a piece of mail to a small or

    large number of people. You can have them for all of you users, for people

    interested in a particular hobby or discussion topic, or really anything else

    you might want a number of people to be able to talk about together.


    In a way, a mailing list is like a members-only newsgroup. Everyone sees the

    posts that go to the list, but only if they''re subscribed to it through the list

    software.


    You can find majordomo on the FTP site ftp.greatcircle.com, in the direc-

    tory /pub/majordomo. The first file you should look at is majordomo-1.93.README

    (the version number may be different when you go to download the file). It

    walks you through the installation process. The file itself is majordomo-

    1.93.tar.z. You may also want to take a look through the other files in

    this directory, such as the CERT file and SECURITY file.


    > Tip

    You may want to wait until you''ve installed all of the servers in this book before

    installing majordomo if you are new to compiling programs.


    Some tips on running mailing lists:


    +   - In the stock "Welcome to the list" message, you should have a list

    policy stated. This is a lot like an Acceptable Use policy, in that you

    define what is acceptable behavior on the list, the list''s purpose, accept-

    able subjects for the list (and how closely you''ll try to keep it to those

    subjects).'
