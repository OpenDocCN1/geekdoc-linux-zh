  md: '# Chapter 4


    # Installing Linux from the CD-ROM


    You''ve finally made it to the last preliminary step before you can set up your
    Internet site. It''s time to actually install Linux. Fortunately, this is the
    easier part of setting up the program. You already did the hard stuff! These days,
    the installation is largely an automated process; you make your choices and the
    software is installed for you.


    In this chapter, you learn how to:


    +   - Begin your Linux installation

    - Make your Linux installation choices

    - Install LILO

    - Finish your Linux installation


    # Starting Your Linux Installation


    All you have to do to begin setting up Linux is type **setup** at your prompt!
    From there, follow the choices you''ve given, and take your time answering the
    questions. You probably feel like rushing through this section so you can get
    your site up and running, but don''t. You''ll be much happier if you don''t have
    to reinstall everything again because you missed something!'
