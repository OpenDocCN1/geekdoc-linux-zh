  md: '# Preparing Your Linux Partition for Installation


    Before you can install Linux on the new partition, you need to prepare that partition
    for the operating system. All of fiddling with the hard drive may be a bit tedious,
    remember, each step brings you closer to setting up your Internet site.


    # Setting Up the Linux Partition


    It''s time to boot your computer with Linux! Find the Linux boot disk made at
    the beginning of the chapter, and put it in the floppy drive. Reboot and do the
    following:


    +   1. Ignore most of the information scrolling past until you Welcome to the
    Slack Linux Bootkernel!

    2. Press Enter at the first prompt, where you are given the option to enter extra
    parameters.

    3. At the prompt, pop your boot disk out of the drive, insert the root disk (ramdisk),
    and press Enter.

    4. Login as root.

    5. A # prompt appears.


    Now you''re going to use Linux''s fdisk program to finish with your drive partitions.
    Look below for the device names assigned to various hard drives.


    ```

    /dev/hda First IDE Drive

    /dev/hdb Second IDE Drive

    /dev/sda First SCSI Drive

    /dev/sdb Second SCSI Drive

    ```


    Choose the appropriate device name, and then run fdisk using that device name
    (for example, fdisk /dev/hda).


    > Tip

    To see the fdisk menu options, type m at the prompt.'
