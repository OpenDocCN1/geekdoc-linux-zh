  md: '# # Chapter 8

    Installing Gopher Server Software


    Some people today think that if you''re going to provide information, the Web
    is the only way to go. This isn''t entirely true. The Web is certainly flashy
    for those with graphical browsers, but if you are trying to track down information
    on a specific subject, it''s easy to get sidetracked following other interesting
    links, or to end up at a dead end and have to backtrack. When it comes down to
    it, the Web is a great catch-all tool, but if you have specific tasks in mind
    often a more focused tool is more efficient (e.g., an FTP client instead of a
    Web client.


    Gopher, instead, offers an interface that is as simple to use as the Web, but
    with a menu-driven setup enabling you to narrow down your subjects without quite
    as much sidetr. Also, because Gopher is text based, it''s faster to use and available
    to those on the Net who don''t have access to the fancier tools—so you can reach
    a wider audience.


    If you don''t intend to install a Gopher server, feel free to go on to the next
    chapter. Or, read the first section describing Gopher and then decide whether
    you want to use a Gopher server on your site.


    In this chapter, you learn how to:


    +   - Define a Gopher server

    - Configure your Gopher server

    - Compile your Gopher server

    - Install your Gopher server

    - Test your Gopher server'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# # What Is a Gopher Server?


    Gopher is somewhat obscure on today''s Internet. Developed at the University of
    Minnesota, it is the predecessor of the World Wide Web and offers several types
    of documents in an easy-to-navigate format. The primary difference between Gopher
    and the WWW is that Gopher is strictly a text interface—though it has graphically
    based clients, Gopher itself is only text. To look at a picture through Gopher,
    for instance, you must download it first, then pull it up with your graphics viewer.


    Gopher''s name comes from its function, in that it gets files for you: go-for.
    Gopher servers are menu based, each server pointing to items on its own site and
    on other sites; you simply select which menu item you want and press Enter to
    follow it or get the appropriate file. The type of file the menu points to is
    unimportant. Unlike the Web, it can point to text, graphics, word processor, sound
    files, and so on. It can also, like the Web, use clients'' pointers to other applications
    to follow telnet, FTP, and other such links using the appropriate application.


    # # Configuring Your Gopher Server


    As a system administrator, you will discover over time that you have to compile
    most of the applications that you use on your site. Because of all the assumptions
    that have to be made in preparing something as a precompiled binary, it''s common
    to find that binaries don''t work on any individual setups.


    Gopher is one such instance of a program that you need to compile. However, this
    compilation should be fairly painless.


    # # Finding and Decompressing the Gopher Source


    The Gopher server you''re going to use is the University of Minnesota''s (the
    very same university that initially developed Gopher) Internet+ distribution for
    Linux version 2.1.3. This is a daemon that will run in the background and wait
    for Gopher requests to come in.


    > **Tip**nIf you find that the instructions for unpacking files in this section
    are too sketchy, the process is covered in more detail in chapter 7, “Installing
    Web Server Software."'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Configuring Your Gopher Server


    To unpack the file containing everything necessary to compile your Gopher server,
    do the following:


    +   1. Locate the file gopher2_1_3.tar.gz on the CD-ROM.

    2. Copy it to /usr/src.

    3. Type gunzip gopher2_1_3.tar.gz.

    4. Type tar -xvf gopher2_1_3.tar.


    # Editing Files


    The source code for Gopher isn''t set specifically for Linux; instead it''s set
    up for UNIX systems in general. There are special cases included for the more
    popular UNIX systems so you can choose which one you want to compile it for. Therefore,
    since you need to tell the source code which UNIX OS you intend to use the binary
    on, you have some files to edit. And, of course, there are the usual changes you
    can make before compilation to configure the binary for your particular setup.


    There are two files you will need to edit before beginning your compilation:

    Makefile.config and conf.h.


    # Editing Makefile.config


    Because this is a generic UNIX server, you need to go through Makefile.config
    and edit it to ensure that it will not only compile for Linux, but also for your
    needs. As this is not a book on programming or compiling, I am going to show you
    the quickest ways of getting such programs ported to Linux.


    Each part of Makefile.config is clearly labeled with commented lines explaining
    what it''s used for. Let''s jump past the revision listings and walk through the
    changes step by step:


    # Step 1


    ```

    # --------------------------------------------------------------------------------------

    # Your favorite C compiler

    # Note that sun international users should use /usr/5bin/cc instead of cc

    # Sco''s cc compiler gives lots of problems that gcc will fix, and gcc

    # is now reasonably easy to get running under SCO. Using this removes

    # the need for -UM_XENIX -DSCO_UNIX as used for Gopher1.1

    # note that if you use gcc, you''ll also need -lintl in SCOLIBS

    #


    CC = cc

    ```'
  merge: -1
  pgno: 184
