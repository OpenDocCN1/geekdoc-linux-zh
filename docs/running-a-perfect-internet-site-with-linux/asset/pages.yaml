  md: '# Moving Server Files Where They Need To Be


    Now for a bit of cleanup work: you''ve got everything set up, but your files are
    still sitting in the directory that you decompressed them.


    Look in your server configuration file and remind yourself of what you used for
    ServerRoot. Now, move all of the following into the appropriate directory (in
    my case I used /usr/local/etc/httpd):


    +   - The file httpd

    - The conf directory

    - The logs directory

    - The support directory

    - The cgi-bin directory


    Make sure your logs directory''s permissions and ownerships are set so it can
    be written by whoever the Web server is set to run as. In my case, this user is
    ftp, and the group is bin (set with the User directive in the configuration file).


    # Starting Your Web Server


    Here''s the final step: actually starting your Web server! You may want to find
    a friend out on the Internet to help you test it when it''s up.


    Set things up so that the server will automatically start every time you boot
    your system. To set this, do the following:


    > Tip

    If you configured your server as standalone instead of inetd, you don''t need
    to follow this process.


    +   1. Edit the file /etc/services.

    2. Add the following line:


    ```

    http        80/tcp

    ```'
  merge: -1
  pgno: 172
- img_proc: true
  md: 'You don''t have to use port 80, but it''s the standard http port, and people
    will have to use the port number in the URL’s going to you links if you use another
    number.


    +   3. Save and edit /etc/services.


    +   4. Edit the file /etc/inetd.conf.


    +   5. Add the line:


    ```

    http stream tcp nowait /usr/local/etc/httpd/

    -httpd httpd

    ```


    > Tip

    First, look to see if this line already exists. It may already be there.


    > Caution

    If you didn''t use /usr/local/etc/httpd/httpd, be sure to use the proper path.

    If you didn''t use FTP for the user server runs as (remember, I used FTP), be
    sure to replace it with the proper user.


    +   6. Close and save /etc/inetd.conf.


    +   7. Log on as root.


    > Tip

    Type su at your prompt if you''re not already root, and then type your password.


    +   8. Type ps aux.


    +   9. Find the process number for inetd.


    +   10. Type kill <process#> -HUP.


    > Note

    You may see some warnings about unsupported features (such as max servers) as
    your httpd starts up. However, if it starts and works otherwise, don''t worry
    about it. I ran into this myself and had no problems.'
