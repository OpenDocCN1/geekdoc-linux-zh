    find out which brands of tape backup systems

    supported by Linux.|


    You have two main choices when it comes to actually making your backups.

    You can use tar itself. However, if a small portion of any file among the data

    dgets damaged, you won''t be able to recover even a part of the file. If you

    don''t want to worry about damaged files, the better choice is AFIO. It''s de-

