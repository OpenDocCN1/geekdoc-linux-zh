  md: '# Checking Links


    If you have Web pages set up for your site in general (e.g., a Web page with a
    list of frequently asked user tech support questions), and it has any links to
    outside sources, it is important to check it regularly for accuracy. Things on
    the Internet change constantly, so you may find the links you point to go up and
    down or move to another URL. The sooner you find out, the more likely you are
    to get a page letting you know where the new resource is.


    To check out a link, just click it and see if it takes you where it''s supposed
    to.


    # Basic HTML


    All HTML formatting commands have an opening code, and a closing code. The difference
    between them is that the closing code ends with a slash (/). For example, the
    code that begins every document should be <HTML>. The entire Web page goes after
    this, and at the end of the page, the last code should be </HTML>.


    As shown in chapter 7, "Installing Web Server Software," this is the most basic
    Web page you can have:


    ```

    <HTML>

    <HEAD><TITLE>My first test page</TITLE></HEAD>

    <BODY>

    This is my test page.

    </BODY>

    </HTML>

    ```


    Note that the page begins and ends with an HTML code. The second code you always
    need to have is the HEAD code, which marks off the header for the page, which
    is displayed at the top of the browser window if you''re using Netscape. The next
    one is the TITLE code, which defines the page''s title, which is displayed within
    the page itself. Finally, the last necessary code is the BODY code, which defines
    marks off the main portion of the page.


    > Tip

    nYou don''t have to capitalize the codes. A lot of people do it as a way to make
    sure they stand out from the rest of the text.'
  merge: -1
  pgno: 293
