  md: '# How To Compile FTP Server 207


    Other sysadmins have other ways of handling such configuration files, of course.
    If you have another structure in mind, or prefer to go with the defaults given,
    go ahead and use it. There is no one true way to structure your files.


    For example, perhaps you prefer to keep all path configuration files for the programs
    you compile in one directory. Or maybe you prefer to keep your program configuration
    files together, but grouped around program type (e.g., all server configuration
    files in a single directory, all configuration files for programs for the sysadmin
    in one place, and so on).


    To change a statement to what you want for your own system, just change the path
    within the quotes. The various path statements stand for:


    +   - _PATH_FTPUSERS

    Points to the file that lists the users that are not allowed to FTP in. For example,
    most services don''t allow access by anyone using root or "services" accounts
    (nobody, ftp, etc.). If you prefer to keep such files centralized in one particular
    directory to make them easier to locate later, change this item. The default location
    is /etc/ftpusers.


    +   - _PATH_FTPACCESS

    Points to the server''s configuration file. If you prefer to keep your server
    configuration files together or all of your FTP files together, change this item
    to the same as _PATH_FTPUSERS. The default location is /etc/ftpaccess.


    +   - _PATH_EXECPATH

    Points to the directory that contains the binary files used with the SITE exec
    command (''ftp''). This directory is relative to the FTP home directory. If you
    prefer to keep all of your FTP files together, change this item to the same location
    as the others. The default location is /bin/ftp-exec.


    +   - _PATH_PIDNAMES

    Points to the file template that handles classes which get PIDs (process ids).
    The percent sign (%) in the file name refers to a specific class. The server will
    automatically choose the proper pid file for each class (as long as that file
    exists). If you prefer to keep all of your FTP files in one place, change this
    item to match the others. The default location is /usr/adm/ftpd/ftp.pids-%.


