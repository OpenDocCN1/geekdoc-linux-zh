  md: '# How To Register Your Site


    IP addresses are made up of 32 bits of information, divided between network and
    host. Network bits are those that tell the Internet the particular site to which
    the IP address belongs. Host bits are those that tell your own network the particular
    machine to which the address belongs.


    IP addresses are written in four pieces, separated by periods, for example, www.xxx.yyy.zzz.
    Each of these pieces contains eight bits of information. The way bits are used
    depends on the class of address involved.


    Class A addresses are for large sites such as universities and huge corporations;
    a single class A address can be used to define millions of hosts. The chance of
    getting a class address today is slim because of the shortage of address space.
    A class A address has 8 network bits and 24 host bits. For the address www.xxx.yyy.zzz,
    www contains the network information, and xxx.yyy.zzz defines the machine. The
    8 network bits making up www is any number between 1 and 126. The host bits for
    yyy and zzz are numbers from 0 to 255. An example class A is 34.152.25.4, where
    34 represents the site itself, and 152.25.4 represents a machine. In a class A,
    this machine is one of many within the network.


    Class B addresses are for mid-size schools and companies. Each class B address
    can define thousands of hosts. These addresses are also difficult to get in today''s
    address shortage. A class B address has 16 network bits and 16 host bits. For
    the address www.xxx.yyy.zzz, www contains the network information, and yyy.zzz
    defines the machine. The 16 network bits that make up xxx is any number between
    128 and 191. The host bits for the yyy and zzz are numbers from 0 to 255. An example
    class B is 142.96.133.6, where 142.96 represents the site itself, and 133.6 represents
    a machine. This machine, just as a class A address, is likely to be one among
    network many many within that same site.


    Class C addresses are the largest addresses most are likely to get today unless
    they are for an O or B. Each class C address has 24 or fewer hosts, but there
    are millions of possible class C network addresses. Sites may find they can get
    multiple class C addresses instead of a single B or A address. A class C address
    has 24 network bits and 8 host bits. For the address www.xxx.yyy.zzz, www.xxx.yyy
    contains the network information, and zzz defines the machine. The 24 network
    bits that make up www.xxx.yyy are numbers between 192 and 223. The host bits making
    up zzz is any number from 0 to 255. An example class C is 214.130.78.10, where
    214.130.78 represents the site itself, and 10 represents a particular machine.
    This machine may be on one network among many within that site, or may be a machine
    on one large network.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_32_0.png)'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# Chapter 1—Way Create Your Own Site with Linux


    Once your IP addresses are assigned, the second step of the registration process
    involves registering your site''s domain name. The domain name is the part of
    a site''s address that is the same for all machines. Once registered, it is linked
    to your IP addresses throughout the Internet''s nameservers. You can assign machine
    and subnetwork names later (see chapter S, “Setting Up Your Site for General Use”).


    Because the registration process takes over six weeks, it''s important to get
    things started. This registration process takes longer and longer because of the
    number of site registrations being submitted. Although your site does not have
    to be up when you submit the forms, it does have to be up when they are processed.
    Be sure that your site is within six weeks from the time you submit the forms;
    otherwise, you may find yourself waiting another six weeks.


    > Tip

    Some service providers do site registration; check into it because you may save
    some work.


    # What Is the Process for Site Registration?


    This section details the two step site registration process: applying for your
    IP address(es) and then your domain name.


    It''s important that you submit the forms for domain name registration after your
    IP address registration has been processed. Sending in the domain forms too early
    means you''ll have to wait a lot longer for your registration to be complete because
    the IP information is needed to assign to the domain.


    # Getting Your IP Address


    Before you get the appropriate IP address(es) assigned to your site, you need
    to decide how many of them you need. Let''s take a look at how to determine the
    number of hosts you may eventually have and then how to apply for the addresses.


    How Large Might Your Site Get? The following are some questions to consider deciding
    how many IP addresses you will need:


    +   - Do you plan to be a large provider that might need an entire Class C address
    (254 possible hosts)?


    +   - How far do you think your site will expand? Is it possible you might eventually
    need 100 or 150 hosts, or will 50 or even 20 be sufficient?'
