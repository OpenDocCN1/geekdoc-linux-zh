  md: '# Installing and Starting Your FTP Server 211


    Once it does this, it can''t see outside of ~ftp, and so a soft link pointing
    to /bin/ compress would be pointing to somewhere that wouldn''t exist to wuftpd.
    Wuftpd would try to find it in ~ftp/bin/compress, which is where you''re putting
    it, not where it''s coming from.


    # Some Initial Security Measures


    Now, you''re going to set up some necessary directories and files, according to
    smart security precautions. To accomplish this, do the following:


    +   1. Change to the ~ftp directory.


    +   2. Make sure this new directory has the following ownerships and permissions
    to ensure it''s secure:


    ```

    chmod 111 bin

    ```


    Using 111 sets the permissions so that everyone can execute what''s in this directory,
    but no one can read or write to it. This makes it hard for people to Snoop around
    this directory.


    +   3. Change to the bin directory.


    +   4. Copy /bin/1s into ~ftp/bin. For the same reasons as with compress, you
    can''t use a soft link for this.


    +   5. Change the ownerships and permissions of 1s, once again, to root.wheel
    and 111.


    +   6. Change to ~ftp/etc.


    +   7. Create the files passwd and group, just as you find in /etc.


    +   8. Make these files mode 444. Using 444 sets the files as readable by everyone.
    This might seem to be lax security, but keep in mind that even your standard /etc/passwd
    and /etc/group files are encrypted. For some, this is a good reason to use shadow
    passwords (discussed in chapter 12).


    +   9. If you use user and group names when doing an 1s -1 someone is in your
    FTP server, do the following:


    +   * Edit ~ftp/passwd. You want the users in this file: root, daemon, uucp, and
    ftp. You can also add users for people who want to show as owning various files.
