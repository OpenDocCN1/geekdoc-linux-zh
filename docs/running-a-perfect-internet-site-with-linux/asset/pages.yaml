    # How To Register Your Site


    All system administrators on the Internet must register their sites with InterNIC
    or with the appropriate agency for their part of the world. Site registration
    is the only centralized requirement on the Internet; a site cannot exist without
    it.


    # What Is Site Registration?


    Site registration is a two part process. In the first part, you apply for the
    number of IP addresses you think your site will need. These addresses are then
    permanently assigned to your site for you to assign to your own machines as need
    arises.'
