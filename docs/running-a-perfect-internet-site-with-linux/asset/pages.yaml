    being mapped to names.


    +   10. Return to the `ftp` directory.


    +   11. Create the directory pub. This is where the files you want to offer to
    the public are that will be stored. Now, set its ownership to maintain the FTP
    server and root (i.e., ftpadmin.root). Set the permissions to 2555. Mode 2555
    sets the item so that everyone can read and execute it. The 2 in the front (set-group
    -id) sets the directory so that every file created inside it will also be group
    of the group assigned to the directory (in this case, group ftp).


    Additional simple things you can do to ensure that no one can take advantage of
    the user ftp existing on your system are the following:


    +   1. Log in as `root`.


    +   2. Change to the directory `ftp`.


    +   3. Create the file `.hosts`, but leave it empty.


    > Tip

    If you want to create an empty file, you can use the command touch.


    +   4. Create the empty file `.forward`.


    +   5. Change the permissions of the two new empty files to 400. This makes the
