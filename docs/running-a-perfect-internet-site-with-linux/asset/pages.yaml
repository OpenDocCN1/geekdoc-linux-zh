    # ## Basic wuftpd Installation


    To complete the basic wuftpd installation, do the following:


    +   1. Log in as root.

    2. Change to the directory in which your wuftpd files are stored.

    3. Type build install to install your server.

    4. Go to the directory in which your precompilation FTP server files are stored.

    5. Copy /bin/bin/compress to ~ftp/bin/compress. When I refer to any directory
    with a tilde (~) at the beginning, I''m talking about /home/directory_name (e.g
    ftp is the same as saying /home/ftp). Just like ~fred would be the same as /home/fred.


    > Note

    Often, you would use a soft link to handle this instead of copying the program.
    However, when wuftpd starts up, it changes its definition of "root directory"
