    information on the fly.


    If you want to enable your server to decompress files as it sends them (so you
    can use less drive space storing the files), this directive is for. For example,
    let''s say I want my server to be able to decompress UNIX com- pressed (.z) files
    and gzipped (.gz) files (as shown as an example in the resource configuration
    file listing). I would enter the following in my config file:


