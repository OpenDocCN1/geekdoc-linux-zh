  md: '# Chapter 10—Installing FTP Software


    These are usernames that cannot log into your FTP server. You can remove or add
    to this list as you wish, but keep in mind that the defaults were chosen because
    of the possible security holes they cause.


    When finished with this file, copy it to the location assigned in pathnames.h.


    # The ftpgroups File


    The ftpgroups file is meant to allow you to create a group of predefined people
    who are allowed to FTP into your system. The contents of the example of the ftpgroups
    file is as follows:


    ```

    test:ENCRYPTED PASSWORD HERE:archive

    ```


    The items in the example above stand for:


    +   test

    This is the access group name. You can make this name up out of letters, num-bers,
    and punctuation.


    +   ENCRYPTED PASSWORD HERE

    This is the password for the group, en-crypt via crypt (which is also the program
    that encrypts the passwords for

    etc/passwd).


    +   archive

    This is the group name from the /etc/

    group file with which this entry is associ-ated.


    > Tip One way to create this password is to create a dummy user, give that user
    a password, and then copy that password straight from /etc/passwd to where you
    need it. Then, just delete the dummy user.


    For a user to take advantage of this feature, he would log in to your FTP server
    through the standard anon procedure. Then, he would execute the commands SITE
    GROUP and SITE GPASS to gain the additional group privileges assigned to the /etc/group
    item to which he assigned himself.


    Once you finish editing this file (if you want to use it at all; I didn''t), copy
    it to the directory to which it''s assigned in your pathnames.h file.'
