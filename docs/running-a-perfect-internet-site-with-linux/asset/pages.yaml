    ![](img/df069eac9f46c8d8f72de31230fb3cab_237_0.png)


    > Tip

    A handy feature of NcFTP is that it remembers site names. Next time I wanted to
    go to ftp.renaissoft.com anonymously, I could just type ftp.renaissoft.com.


    As you noticed, you didn''t even have to type in **anonymous** as userid. This
