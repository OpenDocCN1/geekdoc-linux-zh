    learn to use the sendmail.cf file. Fortunately, you''ve got a sample config9 file
    already on your system that''s preset to meet your TCP/IP and UUOCP needs, so
    your work''s started for you!


    # Finding Your Way Through a sendmail.cf File


    The following are a few tips to keep in mind when you''re digging for your way
    through a sendmail.cf file:


    +   - The file is divided into specific sections, and each section is labeled
    to tell you what it contains. (These labels are indicated by the pound (#) sign.)'
