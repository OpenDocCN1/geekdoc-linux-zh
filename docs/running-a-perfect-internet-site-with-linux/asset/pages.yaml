  md: '# Chapter 5—Setting Up Your Site for General Use


    An example of an entry (pulling an IP address and domain name out of the air,
    both may actually exist on the Net) for a machine is


    ```

    195.85.231.5 baseball baseball.sports

    ```


    Your main server might have a longer entry, for example


    ```

    195.85.231.1 fencing fencing.sports.net www.sports.net-

    ftp.sports.net

