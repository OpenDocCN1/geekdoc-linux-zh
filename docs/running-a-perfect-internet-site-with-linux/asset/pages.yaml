    to have a lot of work to do! Many lists really don''t need a moderator, as you
    can still step in and remove someone if it becomes necessary.


    # # Verifying that Your E-mail Works


    Once you get a server installed, it''s time to test it. With Sendmail, this is
    simple! Just send two pieces of mail. The first one you should send to yourself.
    The second to another site on the Internet. Then, get the person to write you
    back (or to write to an autoresponder that will write you back immediately).


    If the mail you send to yourself doesn''t come back, check root''s (or postmaster''
    if you gave it a different account). An error message was likely sent telling
    you where things might be misconfigured. If there''s no mail in there, type **mailq**
    as root. If the mail you sent was stuck in the queue, then you can force it to
    process (flush) the queue by typing **sendmail -q**.


    If the mail you send to yourself comes back, but the mail you sent out to the
    Internet doesn''t arrive once first check root''s (or postmaster''s) mail for
    any error messages. Also, check the mail queue again. If it''s not in the queue,
    you can look in your system''s logs for sendmail statements. If Accepted for delivery,
    your uplink server (say, your provider''s mail server) hasn''t accepted the mail.
    If it wasn''t accepted, there will be an error message—if you keep getting deferred
    as an error you may need to talk to your provider and see if it''s having problems
    with its mail system.


