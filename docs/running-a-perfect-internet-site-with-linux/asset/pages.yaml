  md: '# Verifying Your News Server


    # Can''t Send Out Posts


    If you can''t send posts out from your site, make sure you have a newsfeeds listing
    the site posts are supposed to go to! If do, try to telnet into the machine that''s
    your provider''s news server to the nntp port (e.g., telnet news.server.com nntp).
    You''ll get messages back from the news server telling you what permissions you
    have. Type help for help on what you can do at this stage, and quit to leave.
    If it doesn''t tell you that you have posting permissions, contact your provider.


    # Connecting to the Sites You Feed


    Make sure you have the sites you feed news to set as feeders, which means that
    you include them in hosts.nntp. Also, if you require passwords and userids, make
    sure the news admin on the other end knows exactly what they need to use!


    To figure out what''s wrong with feeder connections, configure one of the machines
    on your site as a feeder, and try to log into your server. Take a look for the
    error messages you get from the server when you try.


    > Tip


    If you have to edit your host.nntp file, don''t forget to run ctlinnd reload forwards.
    This command takes a fresh look at the hosts.nntp file.


    # Clients Connecting to Your Server


    When you set up shell accounts, include default configuration files for the newsreaders
    (in the skeleton file). This will cut down on a lot of problems from shell users!


    # Individual Host Can''t Connect


    Make sure the host having problems connecting to your news server via clients
    is listed in your nntp.access file.


    # Posting Problems


    To make sure people can post both on your site and locally, try from a few machines
    to post to a local group, and also to the group misc.test on the Internet, which
    is where all test posts should go. If you can''t post locally/ or on the Internet,
    it''s a problem with the server, not the client.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_222_0.png)'
