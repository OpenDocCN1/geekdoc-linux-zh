    # History and Log File Creation


    There are now a few empty files you need to create for your news server''s use.
    Do the following:


    +   1. Log in as **root**.

    2. Change to the directory `/usr/lib/news`.

    3. Type **touch history**.

    4. Type **touch history.dir**.

    5. Type **touch history.pag**.

    6. Type **touch erlog**.

    7. Type **touch log**.

    8. Type **chmod 664 history** to change the permissions: the owner can read and
    everyone else to read only.

    9. Repeat the chmod for each of the files you just created.

    10. Type **chown news.news history** to set the file''s owner and group to news.

    11. Repeat the chown for each of the files you just created.


    # Making the Final Necessary Directories


    Fortunately, this last part is taken care of for you! There is a script that will
    set up all the remaining directories on its own. To run it, do the following:


