  md: '# 358 Appendix F—The Linux Hardware How-To


    $199, X Inside, Inc. <info@xinside.com>.


    Accel-X supports most cards in 16 and 32 bpp modes and it also supports 24 bit
    packed pixel modes for cards that have these modes, including ATI Mach32, Mach64
    (1280hrx1024@24bpp), ET4000/W32p, S3-866/868/968, and more.


    Accel-X also supports XVVideo (Xv) extensions (on Matrox Comet, Marvel-II, and
    SPEA ShowTime Plus), PEX, and XIE.


    # 5.8.2. Metro-X 2.3.2


    $199, Metro Link <sales@metrolink.com>.


    Metro-X supports more boards than XFree but less than Accel-X, however


    I don''t have much information as I can''t seem to view the PostScript files they
    sent me. Mail them directly for more info.


    # 6. Controllers (hard drive)


    Linux will with standard IDE, MFM and RLL controllers. When using MFM/RLL controllers
    it is important to use ext2fs and the block checking options when formatting the
    disk.


    Enhanced IDE (EIDE) interfaces are supported. With up to two IDE interfaces and
    up to four hard drives and/or CD-ROM drives.


    ESDI controllers that emulate the ST-506 (that is MFM/RLL/IDE) interface will
    also work. The bad block checking comment also applies to these controllers.


    Generic 8 bit XT controllers also work.


    # 7. Controllers (SCSI)


    It is important to pick a SCSI controller carefully. Many cheap ISA SCSI controllers
    are designed to drive CD-ROM''s rather than anything else. Such low SCSI controllers
    are no better than IDE. See the SCSI HOWTO and look at performance figures before
    buying a SCSI card.


    # 7.1. Supported


