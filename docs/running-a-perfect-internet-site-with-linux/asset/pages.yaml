- img_proc: true
  md: '# Compiling Your Web Server


    Now you can actually compile the server. With any luck, it will be a painless
    process, but you may have to use some of your programming skills to put it together.
    Yes, programming skills. As a system administrator, you will find that if you
    don''t have them, you will slowly develop them as a necessity.


    First, make sure that your Makefile is in your current directory. Then, **make
    linux** to begin the compilation, and watch what happens. Don''t worry too much
    about the warnings unless there''s an overwhelming number of them. If any serious
    errors occur, the compilation will stop.


    Note


    When you see an error kill your compilation that claims that a particular header
    file with an .h extension doesn''t exist, that''s often not true. Take a look
    in `/usr/include` and `/usr/include/linux` (for example), and see if you can find
    particular elsewhere.


    When you find the file that was missing, you''ll need to edit the source file
    (with a .c extension) referenced when the error was displayed and change the call
    to the file so it''s correct.


    If you get an error that says something about an *undefined function*, a particular
    function is probably in a different .h file than it was used to be. Instead of
    looking through every header file you can find, go to directories like `/usr/include/linux`
    and type the following:


    ```

    `grep ''string you are searching for'' ''*h`

    ```


    For example, if I were looking for the function `foo()`, I would type **grep ''foo''
    ''*h** in each directory until found what I was looking for.


    Now the initial installation is complete!


    # Configuring Your Web Server


    Now that the server is compiled, you need to configure it to suit your system
    and needs. Once you finish with this process, it''s not something you''ll have
    to worry about until you have a need to change your configurations. You may need
    to change your configurations if you decide to offer a set of features, or change
    your system in a significant way.'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Note


    It''s become common practice for people to alias their site''s Web server to www.your.domain_name.
    This is because it makes it simple for people to guess at the URL for your site''s
    main Web page. If you don''t want people to be able to easily locate your site''s
    main Web pages then you probably won''t want to alias it to www.domain_name. In
    fact, if you only want key people to be able to access it, you may want to alias
    it


    As I covered in Chapter 5, "Setting Up Your Site for General Use," you can set
    aliases for a machine in the /etc/named.d/named.hosts file by adding the new machine
    name right after the other ones in its list. Then, after you added the new machine
    alias, you may kill your named process and restart it. For example, if the process
    ID for your named is 210, type kill -HUP 210. HUP tells your system to reload
    the config files without actually killing the process.


    # General httpd Configuration File Rules


    There are three configuration files you need to set up. All of them observe the
    following rules:


    +   - The only place where case matters within these files is in file paths and
    names.


    +   - To comment out a line, use a pound (#) sign.


    +   - When you use the directive command (discussed in the next section), you
    can only have one directive per line.


    +   - To make your directive and following data statements easier to follow at
    a glance, you can include extra white space. It will be ignored by the Web server.


    # Setting Up the Server Configuration File


    The first configuration file you''ll set up is for your Web server. Use the file
    httpd.conf-dist (listed here) as a template for suggestions, but you won''t want
    to use it as is.


    ```

    # This is the main server configuration file. It is best to

    # leave the directives in this file in the order they are in, or

    # things may not go the way you''d like. See URL http://

    # hoohoo.ncsa.uiuc.edu/

    # for instructions.

    # Do NOT simply read the instructions here without understanding

    # what they do, if you are unsure consult the online docs. You have

    # been warned.

    ```


    (continues)'
