- img_proc: true
  md: '# Setting Sendmail To Start as a Daemon


    First, you need to make the Sendmail daemon launch at boot time. A daemon is a
    program that runs in the background and watches for the items it''s supposed to
    handle, in this case, mail. If you don''t have your Sendmail daemon running, it
    won''t be sitting and waiting to process incoming and outgoing mail.


    To make sure the Sendmail daemon is loaded, do the following:


    +   1. Go to the directory /etc/rc.d.


    +   2. Open the file rc.net.


    +   3. Look for the following lines of code toward the bottom of the file:


    ```

    if [ -f /usr/lib/sendmail ]; then

    (cd /usr/spool/mqueue; rm -f l*)

    /usr/lib/sendmail -bd -qih; echo -n ''sendmail'' > /dev/console

    fi

    ```


    +   4. If you find these lines, you can close the file. If you don''t, add them
    in the section where the other daemons are started. You can easily recognize them
    because each item that starts a daemon looks similar to the Sendmail code in step
    3.


    > Note

    The code for the Sendmail daemon is not as complicated as it looks. It breaks
    down as follows:

    1. The first line looks to see if the file /usr/lib/sendmail exists.

    2. The second line changes to your mail queue directory and removes any lock files
    that might be left over if you had to reboot while your system was processing
    mail.

    3. The third line actually starts the Sendmail daemon. The switches that you use
    mean the following:

    bd tells your system to run Sendmail as a daemon, which will sit on port 25 and
    wait for mail to process. You need to use this option, because otherwise Sendmail
    won''t be listening to mail coming in from the Internet. If you don''t run it
    as a daemon, you can only send mail out; you won''t receive it.

    qih tells your system to process the mail queue once an hour. If you want it processed
    more often, every 30 minutes for example, enter -q30m. The rest of this line simply
    tells your system to put the word sendmail on your screen (/dev/console).'
  merge: -1
  pgno: 135
- img_proc: true
  md: '# Setting Up Sendmail 117


    How often you have the mail queue processed depends on how much mail goes out
    of your site. If it''s a lot, you may want to process the queue more often because
    it will take up smaller chunks of your CPU time and bandwidth than it does in
    large pieces. If your site sends a lot of mail—especially if it has mailing lists—you
    may want to process the queue as often as every 15 minutes.


    +   4. The final line just ends the if/then statement.


    Setting Aliases

    Now, set a few aliases for Sendmail to make life a little more convenient and
    to make your system a little more in tune with the other sites on the.


    To set the aliases, do the following:


    +   1. Open the file /etc/aliases.


    +   2. Add the aliases you want; it doesn''t matter what you put them in the file.
    I recommend that you keep them together and add comment lines to remind yourself
    what the aliases are for. An example of what I might add at this stage is as:


    ```

    #sendmail aliases

    postmaster: root

    admin: root

    info: dee

    rob: rjl

    steven: stephen

    ```


    +   3. Save the aliases file.


    +   4. Type newaliases to activate the aliases you just added.


    The following are some general aliases:

    If there''s a user that people keep mistyping, you can add a line for it. For
    example, people type rjl for rjl, so I''d add the line rjl: rjl


    +   If you have accounts on other systems with different users than the one you
    use on your own site, you may want to add an alias for them as well in case people
    assume the same userid on all sites. For example, if you''re fred on your own
    system, fot2351 on another, you may want to add: fot2351: fred


    +   If there are generic users you want to write to at your site, can simply make
    aliases for them rather than create a whole new e-mail'
  merge: -1
