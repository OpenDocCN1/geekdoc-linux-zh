  md: '# Setting Up X-Windows


    > ### Caution

    > If you used su, remember to type exit to leave the superuser mode at this point.


    From now on, one of the processes that starts automatically when you reboot your
    system will be httpd.


    # # Setting Up X-Windows


    Before we can proceed to setting up Web clients, we''ll want to set up X-Windows.
    There is a non-graphics oriented Web client (lynx), but the beauty of the World
    Wide Web is in the graphics! X-Windows is to Linux what MS-Windows is to MS-DOS:
    a graphical interface.


    > ### Note

    > Remember, you need to have purchased the proper monitor and graphics card to
    run X-Windows (see the Hardware How-To for which hardware is appropriate).

    > Also, you need to have at least 8M of RAM on the machine you''re running X-Windows
    down, and at least another 8M of swap space. If you''re to do 5 things at a time
    while using a GUI (Graphical User Interface, like MS-Windows), you''ll likely
    need 16M of RAM.


    # # Setting Up the XF86Config File


    The main part to setting up X-Windows is the XF86Config file. Follow the instructions
    in this section carefully. If you find you''re getting confused or are unsure
    of what to do, consult the documents in /usr/X386/lib/X11/doc.


    > ### Caution

    > Read through this whole XF86Config section before you proceed.


    To set up your XF86Config file, do the following:


    +   1. **Log in as root**, then go to the directory /usr/X11RB/bin.

    2. **Type SuperProbe**. This program will take a look at your video card and tell
    you the details you need to know. Write this information (chipset, memory, and
    RAMDAC) down for use while running the next program.'
  merge: -1
  pgno: 174
