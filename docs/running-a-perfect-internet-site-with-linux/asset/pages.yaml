- img_proc: true
  md: '# Chapter S—Setting Your Site for General Use


    You have twelve virtual consoles by default. You switch between them by holding
    down the Alt key and the appropriate function key. For example, right now you''re
    probably on Alt+F1. Hold down the Alt key and press F2. You''ll find yourself
    at another login prompt. Keep doing that on Alt+F3 through Alt+F12;they''re all
    new login prompts. You can do completely different things with each terminal.
    For example, you can log into all of them with the same account or all different
    accounts.


    # Shutting Down Your Linux System


    With Linux, you really don''t want to just shut the computer right away. There
    may be important data stored in the buffers that won''t get saved if you just
    turn the machine off, or you may be shutting off a process that you didn''t notice,
    before it finishes what it''s doing.


    To shut down your system, do the following:


    +   1. Log in as **root**.

    2. Type **shutdown [-hrf] [time]**

    3. Watch and wait.


    > Note

    "h" stands for hard shutdown: The computer will shut down all processes and then
    sit and wait for you to hit reset or shut it off.

    "r" stands for restart or reboot: The computer will automatically reboot once
    all processes are shut down. A restart shutdown is particularly useful if you
    intend to reboot and use LILO to access another operating system.

    "f" stands for fast shutdown: The computer writes the fastboot file as it goes
    down so that when it comes back it knows it doesn''t have to check the filesystem.


    I commonly use **shutdown -h now**. That tells me my system to immediately shut
    down all processes, and then sit and wait for me to either shut the power off
    or hit the reset key.


    If you want to tell it to shut down in a certain amount of time, give the time
    in minutes. For example, type **shutdown -h 5**.


    Now you''re all set up and ready to start installing your servers!'
