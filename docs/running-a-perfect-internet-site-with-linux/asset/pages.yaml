    # # Creating Accounts


    Since it''s not a good idea to do anything except system administration tasks

    from root, now''s a good time to create some accounts on your site. It''s also

    important to set up some accounts aside from root so you can use them to

    test your servers as you get them set up. It''s important not to assume that

    because your software works for root, it will work for everyone!


    # # Creating User Accounts


    To create an account by hand, type adduser at the prompt. You''ll get the

    following sequence of prompts:


    ```

    Login to add (-C to quit):

    Full Name:

    GID [100]:

    UID [501]:

    Home Directory [/home/username entered in first prompt]:nShell [/bin/bash]:nPassword
    [username entered in first prompt]:nInformation for new user [username entered
    in first prompt]:nHome directory: Shell: you entered at [shell you entered

    [home directory] the earlier prompt] earlier]

    Password: UID: GID: [password you entered earlier]

    [UID you entered earlier] [GID you entered earlier]

    Is this correct? [y/n]:

    ```'
