  md: '# # Appendix F

    The Linux Hardware How-To


    In order for an operating system to work properly with a computer system, the
    appropriate software drivers for all of the hardware components must be available.
    Fortunately, the “Linux Hardware Compatibility HOWTO” tells you exactly what hardware
    is and is not supported by Linux, so you don’t have to guess! It is Important
    that you consult this document to avoid any incompatibility problems.


    # ## Linux Hardware Compatibility HOWTO


    FRIC (Boy of Destiny), frac@pobox.com

    v6699, 16 July 1995


    This document lists most of the hardware supported by Linux and helps you locate
    any necessary drivers.


    +   1. Introduction


    +   1.1. Welcome


    Welcome to the Linux Hardware Compatibility HOWTO. This document lists most of
    the hardware supported by Linux, now if only people would read this first before
    posting their questions on Usenet.


    Subsections titled Other list hardware with alpha or beta drivers in varying degrees
    of usability or other drivers that aren’t included in standard kernels. Note that
    some drivers only exist in alpha kernels, so if you see something listed as supported
    but isn’t in your version of the Linux kernel, upgrade.'
