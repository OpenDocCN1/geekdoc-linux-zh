  md: '# Chapter1

    Why Create Your Own Site with Linux?


    Because you bought this book, I obviously don''t need to sell you on the idea
    of having your own Internet site nor on the idea of using Linux. After all, Linux
    is a full-fledged version of UNIX. Servers and clients for all the major Internet
    services (electronic mail, the World Wide Web, and so on) are available for this
    operating system. This makes Linux an excellent choice for running an Internet
    server.


    Linux makes an especially good Internet server because you don''t have to get
    any programs to teach it how to speak TCP/IP (the protocol the computers on the
    Internet use to communicate with one another). Most operating systems require
    extra software to be able to handle it.


    In this chapter, you learn the following about Linux:


    +   * What Linux is

    * How to follow Linux versions

    * How to register a name for your site


    # What Is Linux?


    Linux is a free clone of the UNIX operating system for machines with 386, 486,
    and 586 (Pentium) processors (see fig. 1.1). It''s full-featured and flexible,
    and is constantly being updated and improved.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Fig. 1.1


    The Linux shark is the unofficial Linux logo.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_27_0.png)


    # Who Wrote and Who Maintains Linux?


    The Linux operating system began in 1991 in Finland when Linus Torvalds wrote
    *Minix* (mini-UNIX) for a school project. As he enhanced the system during that
    year on his own, it grew from the mini-UNIX “Minix” to “Linux.”


    Torvalds wrote the initial Linux (which was little more than a kernel way back
    then) and still oversees its progression. A team of people worldwide contribute
    to its growth and maintenance.


    > **Tip**nAre you wondering exactly how Linux is pronounced? On the World Wide
    Web, you can actually find a sound file of Torvalds himself pronouncing it! Just
    go to **http://sunisite.unc.edu/mdw/mdw.html** and choose the link to Linux’s
    pronunciation.


    # Linux Features


    With Linux, you won''t feel as though you''re using a backwater version of UNIX
    because of a lack of key features. You get the same features you expect with any
    other version of UNIX, including the following:


    +   - *True multitasking* Very few operating systems offer full multitasking.
    Many OS''s claim to do multitasking but their claim is only half correct.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# What Is Linux?


    These OSs let you do more than one thing at a time, but processes are not fully
    running at the same time. If you try to background one process to finish it, it
    either stops or crawls along until you return to it.


    With an operating system like Linux, while the priority is given to the task you
    are working on at that very second, the tasks in your background continue until
    completed or they need input.


    +   **Virtual memory** Sometimes you need to be able to access more RAM than you
    physically have in system. Virtual memory is space on your hard drive that acts
    as extra RAM for when you need it.


    +   **Shared libraries** Many operating systems require that your programs be
    completely self-contained, which makes them a lot larger than they need to be.
    OS''s like Linux can generate binaries (programs) that access libraries of code
    that already exist on your system. This way, the size of your binaries is kept
    down. Smaller binaries save RAM and hard drive space.


    +   **Demand loading** Many operating systems keep everything in physical RAM
    until they run out of space, and then start using their virtual memory (if they
    have). This means that if you leave a process open but don''t use it for a while,
    it''s probably sitting there eating up your RAM space and pushing the new things
    you''re going to swap!


    This works a bit differently with OS''s that can handle demand loading. When processes
    are still active, but not in use for some time, a Linux system will move them
    over to their swap space to free up more of their physical RAM for tasks that
    are being attended to.


    +   **Proper memory management** An important thing in any operating system is
    memory management. If your OS doesn''t manage memory properly, you can end up
    with unpredictable crashes of your programs that can vary from just having to
    restart to having to completely reboot your machine. Needless to say, this is
    not what most people consider a productive working environment. Linux does have
    proper memory management, which is a relief when you''re fond of running a lot
    of programs at once!


    +   **TCP/IP networking** Most operating systems for personal computers don''t
    have TCP/IP networking built-in. Instead, if you want to connect to the Internet,
    you must get a program to handle the connection and conversion of the computer''s
    own internal communication protocols to the Internet''s TCP/IP protocols.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_28_0.png)'
  merge: -1
  pgno: 28
- img_proc: true
  md: '# Chapter 1—Why Create Your Own Site with Linux


    Linux uses TCP/IP for its own networking. Therefore, you don''t need a conversion
    program. This makes for faster access to the Internet, and less chance for error
    since your processes don''t go through as many program layers.


    Linux also aims for the UNIX POSIX (Portable Operating System Interface) Federal
    Information Processing Standard set forth by the National Institute of Standards
    and Technology. This fact means that applications for other flavors of UNIX port
    to Linux without much difficulty.


    # Linux and Microsoft DOS and Windows Programs


    Linux itself cannot run MS-DOS or Windows applications. However, a DOS emulator
    (dosemu) can run most DOS applications and is constantly improving. You can run
    Windows applications on top of the DOS emulator, but you can''t run Windows in
    enhanced 386 mode. So, while it will be possible to run Windows on Linux top of
    the DOS emulator, the process will be slower than you may prefer. To run Windows
    for serious use with multiple applications on top of Linux will require the Windows
    emulator that is still under development.


    # Copyright Status


    The "ownership" of Linux can get a little complex. Linus Torvalds owns the copyright
    on the Linux kernel. However, Linux itself (including the kernel) is all under
    the GNU Public License (GPL), often referred to as the *copyleft* because of how
    different it is from most copyright agreements. The full GPL is in Appendix B,
    "The GNU General Public License."


    The GPL requires that those who use items that they create to programs make the
    source of those programs available to those who ask, and it insists that a copy
    of the GPL document included with the product. This agreement allows the programmers
    to offer their software to the general public while retaining copyright over it
    so that it remains their work. It also ensures code is available for others to
    enhance and modify (giving proper credit to the previous programmers, of course).
    The goal is to increase the total amount of free software available.'
