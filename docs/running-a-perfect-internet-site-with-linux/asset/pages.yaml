  md: '5. Normal MFM/RLL disk IDE disk/cdrom support: Answer y if you need support
    for any of this hardware. Otherwise, answer n.


    6. Now you''re given a few options, and you only want to choose one of them, as
    follows:


    +   - Use old disk-only driver for primary: This driver would only allow one interface
    with two drives. If this is all you require for the computer you''re working on,
    press y for yes. Otherwise, press n for no.

    - Use old IDE driver for primary/secondary: This driver allows a secondary interface
    (through which would add items like IDE/ATAPI CD-ROM drives). If you intend to
    use this equipment on your computer, press y for yes. Otherwise, press n for no.

    - Include support for IDE/ATAPI CD-ROMs: If you intend to use this equipment,
    press y. If not, press n.


    | Tip |

    | The hardware discussed here is explained in more detail in chapter 2. |


    7. XT hard disk support: If you intend to use this equipment, press y. If not,
    press n.


    8. Networking support: Because you''re running an Internet site, choose y.


    9. Limit memory to low 16M: This item is directly related to 386 machines. If
    you have a 386 machine and it has a DMA controller that doesn''t properly handle
    16M of RAM, choose y. Otherwise, choose n.


    10. PCI bus support: If the computer you''re working on using PCI BIOS, choose
    y. If you choose yes, you''ll be asked for more information on the PCI bridge
    organization.


    11. System V IPC: Perl this option to allow processes to talk to one another.
    Choose y.


    12. Kernel support for ELF binaries: You installed an all-ELF Slack version, so
    choose y.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '13. Use -m486 flag for 486-specific optimizations: If the computer''s working
    on a 486 or Pentium machine, choose y. It will optimize things to run on its processor.


    14. Set version information on all symbols for modules: This tells modules to
    check your kernel version and, if the module''s version doesn''t match, it won''t.
    Often, a module will work even if it''s older than the kernel you''re using, so
    this can be a pain as it requires you to compile modules every time you update
    your kernel. However, if you don''t want to take the chance of running into problems,
    go ahead and choose y. Otherwise, choose n.


    > Note A module, or loadable module, is a piece of kernel code that isn''t always
    needed. Instead, it''s saved out into a piece of code that can be loaded into
    memory when it''s necessary (e.g., FTAPE). This helps to keep down on how much
    RAM your system kernel eats on a regular basis.


    15. TCP/IP networking: Your computers need this option to speak to the Internet
    (which uses the TCP/IP protocol), so choose y.


    16. IP forwarding/gatewaying: You need this on your main server, but not on other
    machines. Choose the appropriate answer.


    17. IP multicasting: This is the capability of a machine to have multiple IP addresses.
    If you don''t need this option, choose n.


    18. IP firewalling: You won''t need this option if you want to use a firewall,
    you''ll install Socks, which doesn''t require it. Choose n.


    19. IP accounting: Choose n.


    20. You should leave the following options at their defaults:


    +   PC/TCP compatibility mode

    Reverse ARP

    Assume subnets are local

    Disable NAGLE algorithm

    The IPX protocol'
  merge: -1
  pgno: 319
- img_proc: true
  md: '21. SCSI support: If you have any SCSI hardware, choose **y**. It will ask
    you further configuration questions. If you don''t have SCSI hardware, choose
    **n**.


    22. Network device support: Choose **y**. You need this to connect to your provider.


    23. Dummy net driver: This allows you to set up "dummy addresses," as aliases
    for a machine named "ftp" that physically doesn''t exist. Choose **y** to be able
    to use this.


    24. SLIP (serial line) support: If you want to be able to use SLIP or allow your
    users to use SLIP, choose **y**.


    25. CSLIP compressed headers: Choose **y**. This will make your SLIP connections
    more secure.


    26. 16 channels instead of 4: By default, you can have only four simultaneous
    SLIP connections. If you want to be offered more than four, choose **y**. Otherwise,
    choose **n**.


    27. PPP support: If you''re using PPP, choose **y**.


    28. PLIP support: This allows you to connect computers using parallel ports. You
    can only connect two machines in this way because computers generally have only
    one parallel port. Choose **n** unless you intend to use this.


    29. Do you want to be offered ALPHA test drivers: Because you''re running a site,
    you probably don''t want to risk running experimental drivers unless it''s a driver
    that isn''t available otherwise. It doesn''t automatically add them, so if you''re
    not sure, choose **y**. Otherwise, choose **n**.


    30. Now you''ll be asked which networking card you''re using. Choose **n** for
    all of those you''re not using and **y** for the one you are:


    Western Digital/SMC


    AMD LANCE and Pcnet


    3COM (default)


    Other ISA cards


    EISA, VLB, PCI, and other on board controllers


    Pocket and portable adapters'
  merge: -1
  pgno: 320
- img_proc: true
  md: '# Chapter 16—Upgrading Your Software


    31. Now you''ll be asked if you need a number of CD-ROM drivers, none of which
    are for SCSI or IDE/ATAPI drives. Answer n for anything you don''t have and y
    for anything you do:


    Sony CDU31A/CDU33A


    Mitsumi (not IDE/ATAPI)


    Matsushita/Panasonic


    Matsushita/Panasonic second controller


    Aztech/Orchid/Okano/Wearneas non IDE


    Sony CDU535


    32. Now you are asked which file systems you want to support:


    +   - Standard (minix) fs support: Choose y for this one. It''s nice and small
    and good for making rescue disks.


    +   - Extended fs support: This is a slightly older file system than the one you
    used during your Linux installation. Choose n.


    +   - Second extended fs support: Choose y. You installed Linux with this file
    system initially.


    +   - xiafs file system support: If you used xiafs instead of ext2fs, choose y.
    Otherwise, choose n.


    +   - mdsdos fs support: Choose y if you want to read from MS-DOS formatted disks,
    floppies, or hard drives.


    +   - umsdos: Choose n. UMSDOS (UNIX in MS-DOS) is a Linux filesystem that operates
    much like an MS-DOS FAT file system, but allows the user to have long file names,
    permissions, group ownerships, and other UNIX-like file settings.


    +   - /proc file system support: Choose y. This item makes up for some deficiencies
    in the Linux kernel compared to other UNIX systems when it comes to process handling.
    You definitely need this for your site


    +   - NFS file system support: If you want to mount any file systems via NFS,
    choose y.


    +   - ISO9660 cdrom file system support: If you use a CD-ROM at all, choose y.'
  merge: -1
  pgno: 321
- img_proc: true
  md: 'OS/2 HPFS file system support: If you want to access an OS/2 file system, choose
    **y**.


    System V and Coherent file system support: If you have access to a machine that
    runs one of these flavors of UNIX and therefore will have access to disks formatted
    for them, choose **y**. Otherwise, choose **n**.


    You''ll now be asked which character devices (mouse, printer, etc.) you want to
    use:


    +   - Cyclades asynch mux: This is a multiport serial card. If you have one, choose
    **y**


    +   - Parallel printer: If you want to hook a parallel printer up to this machine,
    choose **y**.


    +   - Logitech busmouse: If the mouse on this machine is a Logitech busmouse,
    choose **y**.


    +   - PS/2 mouse: If you have a PS/2 mouse on this machine, choose **y**.


    +   - Microsoft busmouse: If you have a Microsoft busmouse on this machine, choose
    **y**.


    +   - ATIXL busmouse: If you have this type of mouse, choose **y**.


    +   - QIC-02 tape: If you have this kind of tape drive on your machine, choose
    **y**.


    +   - QIC-117: If you have this kind of tape drive on your machine, choose **y**.


    34. Sound card support: If you have a sound card on the machine you''re configuring
    the kernel for, choose **y**. If you do, you will be asked for specific configuration
    information involving your sound card.


    35. The Kernel hacking section: Answer **n** to Kernel profiling support to avoid
    any problems with your site.


    36. Don''t be startled if your system briefly compiles something! If it does,
    that''s because there are some special configuration options it can continue to
    make your life easier down the road. For example, if you said you have a sound
    card, it compiles a small program to configure sound support.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '37. The configuration program exits. Look through the Makefile and make sure
    that it''s what you want.


    # Creating Your Kernel


    Now, you can create your kernel! This requires the following steps:


    +   1. Log in as **root**.


    +   2. Change to /usr/src/linux.


    +   3. Type **make dep** to make sure key files are in the right place.


    +   4. Type **make clean** to be assured that everything is up-to-date.


    +   5. Now, to compile the kernel itself, type **make zimage**.


    > **Note**

    The speed it takes to compile a kernel depends on how fast your machine is and
    how much RAM it has. On a 386 machine, it can take over an hour, while on a Pentium
    or high end 486, it may take less than 30 minutes. You''ll probably want to recompile
    your kernel when you have something else you can do while wait.


    +   6. Move /vmlinuz to /vmlinuz2 so you don''t overwrite your previous kernel.


    +   7. Edit the file /etc/lilo.


    > **Note**nn of completely replacing the old kernel at the moment, I''m going
    to add a reference for the new one. This way, I can reboot with the new kernel
    and test it to make sure it works. Then, if it works satisfactorily, I can come
    back and remove the old one.


    +   8. Locate the section


    ```

    image = /vmlinuz

    label = Linux

    root = /dev/hda1

    ```'
  merge: -1
  pgno: 323
- img_proc: true
  md: '> Note

    The value assigned to root may be different if you didn''t use /dev/hda1 initially.
    Just make sure the original root reference and the following one match.


    9. Copy this section and create a new one below.


    10. Change it to read


    ```

    image = /zImage2

    label = linux-new

    root = /dev/hda1

    ```


    11. Save and exit the file.


    12. Type lilo to install the new settings.


    Now, when you boot with LILO, you can type linux-new instead of linux and boot
    with the new kernel. When you''re confident it''s stable, erase the old kernel
    (the old zimage file) and move zimage2 to zImage.


    # Upgrading Your Servers


    When new versions of servers come out, it often means that they have—or are meant
    to have—fewer bugs than previous versions. In this itself is a good reason to
    upgrade. There might also be new features that are useful to you, as in more functions
    being automated, or even more functions available. Also, if new standards have
    come out, a new server will be released to support those standards.


    To actually upgrade a server, first download the new source code for the server.
    You should be able to find its home location in its own documentation files. If
    you can''t, try looking on Sunsite first. Then, move it to /usr/src.


    Next, take a look through the information files (e.g., README) that came with
    the source to see what you need to do before compilation. The differences between
    the previous version and the new version could be minor or massive, depending
    on how many bug fixes there are, how many new features were added, how standards
    have changed, and how the interface has changed.'
  merge: -1
  pgno: 324
- img_proc: true
  md: '> Back up your old server in case you find would rather return to it, or the
    new server simply doesn''t work.


    Follow the precomp instructions carefully. After all, if there are any options
    that need to be configured before you compile the program, you don''t want to
    forget about them until you''re almost finished setting up! Then you''d have to
    turn around and start all over. Once, you''ve set it up for compilation, compile
    the program according to the instructions in the README files.


    As you''ve seen throughout this book, once you get the program compiled there
    is often more configuration to do. Follow the instructions in the information
    files on any post-compilation configuration necessary.


    Test the new server and make sure it does what you expected and wanted it to do.
    If you don''t like the new server, erase it. If you do like it, erase the server.
    Though, you may want to keep the old one for a week or so in case it takes a while
    for problems with the new server to show themselves.


    # Adding New Applications


    Every once in awhile, you''ll see a new application that you decide you want for
    your site, a particular machine, or even a particular user (could be an IRC client
    or server, a game, a WAIS server, graphics viewer for a graphics-capable machine
    where you don''t have to use X-Windows, fax programs, or any other number of applications
    available on the Internet).


    > To find most of the applications, go to Sunsite /pub/Linux and look through
    the directories there. You can also find the Linux Software Map on the Linux Documentation
    Project pages, which is a catalog of applications available for Linux and where
    to find them.


    The difficulty or ease of installing this application depends on the application
    itself and how diligently you read the instructions before going at it.'
  merge: -1
  pgno: 325
- img_proc: true
  md: 'The basic instructions for installing a new application are similar to the
    in-instructions listed in the previous section.


    Download the application, and take a look through the information files (e.g.,
    README) that came with it. It may have come as source, or as a binary. If it came
    as source, see what configuration you need to do before compilation, follow the
    instructions, and compile the program according to the instructions in the README
    files.


    Follow the instructions in the information files on any further setup, whether
    you got the file as source or as a binary. Then, test the program to make sure
    it does what you want and does it the way you want it done.'
  merge: -1
