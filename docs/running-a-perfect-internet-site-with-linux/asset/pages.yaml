- img_proc: true
  md: '# Installing Kfingerd


    There are a number of fairly small and simple steps involved in installing your
    Finger server.


    # Creating Finger’s Home Directory


    First, create a home directory for Finger itself. This is where you will put your
    dummy accounts later. To create this directory, the following:


    +   1. Log in as **root**.


    +   2. Change to the directory home.


    +   3. Create the directory finger.


    +   4. Change the permissions of the Finger directory so only trusted persons
    (owners) are allowed to write to it (type **chmod 755 finger**). This will permit
    other people to read in this directory, but considering that they can get the
    same information by just fingering accounts, this isn’t generally a problem.


    # Moving Kfingerd


    Move the compiled file, Kfingerd, to somewhere like /usr/sbin, where most daemons
    and other items that only *root* should be running.


    # Adding Kfingerd to the Startup Daemons


    To run Kfingerd at startup with the other inetd items, do the following:


    +   1. Log in as **root**.


    +   2. Go to the /etc directory.


    +   3. Edit the file inetd.conf.


    +   4. Make sure the following line exists as you see it here:


    ```

    finger      stream      tcp      nowait      root      /usr/sbin/tcp

    =/usr/sbin/kfingerd

    ```


    > Tip

    You will find this line already in your inetd.conf file, but the user is incorrect.
    All you need to do is change the user daemon to root in this line.


    +   5. Save and exit the file /etc/inetd.conf.'
  merge: -1
