  md: '# Chapter 7—Installing Web Software


    For example, if I wanted to use the icon sound.xbm for my sound files,

    ''d add sound.xbm to the path statement, making it /icons/sound.xbm

    (which would really refer to /usr/local/etc/http/htdocs/icons/

    sound.xbm).


    Finally, the last piece of the icon statement is where you''ll identify

    file types to use the icon with. In the case of our sound file ex-\ample, I would
    now add *.au. This makes the entire statement /icons

    sound.xbm *.au.


    Other examples of icon definitions are:


    ```

