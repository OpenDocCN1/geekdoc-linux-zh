  md: '# Users Connecting to Your Site via Modem


    If you have users dialing in SLIP connections, you need to have a program waiting
    to pick up the phone. The program I recommend for this task is sliplogin. You
    can find this program by FTP at sunsite.unc.edu, /pub/ Linux/system/Network/serial/sliplogin-1.5.tar.gz
    (the version number may be different when you go to fetch the file).


    This program has a number of configuration files associated with it. These files
    contain all the information necessary for it to run all of your incoming SLIP
    connections, and some of them require some alterations. The ones requiring changes
    are discussed here.


    > You can set up accounts that only allow people to use SLIP through your machine.
    The sliplogin program documentation spells out in detail how to set up these accounts.


    # The slip.hosts File


    In the slip.hosts file, you define types of logins and how they''re treated. The
    following is an example of this file.


    ```

    # login local-addr remote-addr netmask slipmode opt2 ...

    # valid slipmodes: normal, compressed,ax25,6bit,auto

    #

    slip 199.60.103.1 DYNAMIC 0xffffffff normal

    cslip 199.60.103.1 DYNAMIC 0xffffffff compressed

    bob 199.60.103.1 DYNAMIC 0xffffffff normal

    susan 199.60.103.1 DYNAMIC 0xffffffff compressed

    ```


    I''ll walk you through the slip definition line. The IP number given is that of
    the site''s server. Then, when you tell it DYNAMIC, it knows that you will dynamically
    assign IP addresses as people dial in. The hex 0xffffffff (you would need to use
    the appropriate hex for a non-class C address) is 255.255.255.0, which tells sliplogin
    to replace the last digit in the server''s IP number with the appropriate digit
    for the line. Finally, you define the connection type as either compressed (using
    CSIP compression) or normal.


    # The slip.tty File


    In the tty file, you define what IP addresses to use for tty''s dialing. This
    tells your system address to use for DYNAMIC definitions. An'
