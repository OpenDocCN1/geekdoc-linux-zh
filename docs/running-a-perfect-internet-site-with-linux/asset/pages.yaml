    # Compiling the Client and Server


    Now you''ve configured both Makefile.config and conf.h, you can compile your Gopher
    client and server. Take your time handling any compilation errors—though there
    shouldn''t be many!


    To compile your Gopher server and client, do the following:


    +   1. Log in as root.

    2. Enter the directory where the Gopher files are stored (such as /tmp/gopher2_1_3).

