  md: '# Introduction


    As this book is being written, a new Internet site is “born” every 15 minutes
    somewhere in the world. Why?


    Because the number of people on the Internet is skyrocketing, more and more people
    are able to make a living by providing Internet connections. Businesses find the
    Net useful for disseminating information about themselves; communicating with
    clients, potential clients, and co-workers; as well as networking with people
    who may be helpful to the company in the future. Even governments are staking
    claims in cyberspace. They make information about their country and people available
    online, and they use the Net to help their citizens track down information they
    otherwise might have to stand in line in a government office to obtain.


    One of the first problems you run into when setting up a site is deciding which
    operating system to use. Many people choose Linux. After all, it’s a free version
    of UNIX, and constantly being updated; there is an amazing amount of support for
    it on the Internet in forums used by other Linux users; and it’s a stable operating
    system.


    Linux is also, in a strange way, a more “social” operating system than most. Its
    primary designer reads and responds to the Linux newsgroups; anyone who develops
    the proper skills—and good ideas—can help Linux continue to evolve; and it’s fully
    available online with its documentation.


    The true beauty of Linux for our purposes is that it’s feasible to set up an Internet
    site with whether you’re a hobbyist, business user, or service provider! You can
    also make the operating system as bare bones or feature-rich as you like.'
  merge: -1
