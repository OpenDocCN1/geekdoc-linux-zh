- img_proc: true
  md: '# Chapter 4—Installing Linux from the CD-ROM


    The LILO installer gives you the following options:


    +   1. Start LILO configuration with a new LILO header


    Start a new LILO. If you have an old one, this will overwrite it when you save.
    However, if you don''t have a LILO configuration set up yet (perhaps from a previous
    version of Linux), this won''t erase anything.


    +   2. Add a LILO partition to the LILO config file


    Start to configure LILO to know how to boot up your computer into Linux.


    +   3. Add an OS/2 partition to the LILO config file


    Start to configure LILO to know how to boot up your computer into OS/2, if you
    have an OS/2 drive or partition.


    +   4. Add a DOS partition to the LILO config file


    Start to configure LILO to know how to boot up your computer into MS-DOS, if you
    have an MS-DOS partition.


    +   5. Install LILO


    Save your LILO settings.


    +   6. Reinstall LILO using existing lilo.conf


    Your LILO data is in /etc/lilo.conf. If you install Windows 95 after-installing
    Linux (which erases your boot sector and gets rid of LILO), you can select this
    option to copy your LILO settings from the file to the boot sector of your hard
    drive.


    +   7. Skip LILO installation and exit this menu


    If you decide you''re not sure you want to install LILO at the moment, select
    this option to exit without saving.


    +   8. View your current /etc/lilo.conf


    Take a look at what you have so far in your LILO settings.


    +   9. Read the Linux Loader HELP file


    Read the online help for LILO.


    Since this is your first time using LILO, pick option one. First, you''ll be given
    the chance to enter any extra parameters you need to use at boot time.'
