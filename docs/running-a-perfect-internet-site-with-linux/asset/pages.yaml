  md: '# Managing Your Disk Space 259


    > Tip

    To edit the crontab file for an account you''re not logged into, you must be logged
    into root. No one else can edit a crontab for an account other than the one they''re
    using.


    Before I erase the syslog file, I want to compress and save it. There are the
    three commands I''ll use, in order:


    ```

    gzip /var/admin/syslog

    ```


    This compresses the log file.


    ```

    mv /var/admin/syslog.gz /var/admin/stored_logs

    ```


    This moves the compressed log into the directory I created earlier to keep my
    old log files.


    ```

    rm /var/admin/syslog

    ```


    If /var/admin/syslog still exists, delete it with this command. It''s likely that
    gzip already deleted it for you.


    Now, I need to decide when I want to do. I already decided that I''ll do it once
    a week because it takes long for the file to get large enough for me to compress
    it to save disk space, now I just have to determine the particular times. I''ll
    take a look through the crontab file and see when the machine doesn''t have any
    other tasks to do—not that this is very process-intensive task, but it''s a good
    habit to get into. I''ll choose every Wednesday at 3 am, since my system looks
    to be fairly idle at that point when it comes to cron jobs. The crontab entry
    for this choice likes:


    ```

    * 3 * * Wed

    For

    Minute Hour Day Month Day-of-Week

    ```


    Now, to put this all together, I have two choices. I can string all the commands
    into one line, or write a small script. I''ll demonstrate here to include them
    all in one line:


    ```

    * 3 * * Wed gzip /var/admin/syslog; mv /var/admin/syslog.gz /

    ->var/admin/stored_logs; rm /var/admin/syslog

    ```


    Save and exit the file. Every minute the cron daemon checks all the cron files
    to see what it needs to do; you don''t need to kill and restart any processes
    to ensure that your new file is used.'
