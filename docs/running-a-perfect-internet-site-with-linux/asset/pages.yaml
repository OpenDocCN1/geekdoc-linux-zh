  md: '# CHAPTER 3

    Getting Ready To Install Linux from the CD-ROM


    Now that you''ve got the right equipment, the appropriate connection type, and
    a service provider to feed your site''s data to the Internet, let''s get down
    to business. The most important part of installing Linux, believe it or not, is
    preparation. Installing the operating system (which you''ll do in chapter 7, "Installing
    Web Server Software") is the easy part and is fairly well-automated nowadays.
    First, however, you have to get up properly.


    In this chapter, you learn:


    +   - How to make boot disks

    - What size to make the partitions on your hard drive

    - How to partition your hard drive

    - How to create the file system


    # Preparations


    There are a few things you need to do before you continue. Make sure to carefully
    go through this section if you want your Linux installation to go smoothly!


    # Have These Items Handy


    Have the following ready to use before you go any farther.'
  merge: -1
  pgno: 64
- img_proc: true
  md: '+   - You need two MS-DOS formatted high density floppies, either 3.5" or 5.25".
    Both disks must be the same size, as the installation program will expect to use
    the same drive for both of them. It will not even check the other drive for the
    second disk.


    +   - If the hard drive you''re setting up will only have Linux on it (no MS-DOS),
    you''ll need access to another computer that has MS-DOS. If you''re partitioning
    the hard drive to run both operating systems, the MS-DOS partition on that drive
    will suffice.


    +   - If you don''t have a CD-ROM drive and plan to take the CD-ROM that came
    with this book somewhere else to copy it onto disks, keep in mind that you need
    one 3.5" disk for each distribution disk you want to install (except for the *a*
    series, which can be on either 3.5" or 5.25" floppies).


    > It may seem that you cannot install from your CD-ROM drive if you don''t have
    the operating system installed, because you don''t have the drivers. However,
    when you select your boot disk later in this chapter, you will select the disk
    containing the appropriate drivers.


    +   - You need all the information that you can find on the hardware in your computer,
    including brand names and exact versions.


    # Deciding How Many Disks You Need


    The CD-ROM comes with a full set of Slackware distribution disks on it. Slackware
    is a popular way Linux is distributed; it''s a nice neat package containing everything
    you need to install and set up the operating system. Slackware has divided Linux
    into the distribution disks we discuss a bit later in this chapter.


    If you''re going to install from the CD-ROM, you need not worry about which disks
    you''ll need at the moment. However, if you''re going to copy the CD-ROM to floppies
    to install Linux, you can save yourself extra work by deciding which disks you''ll
    need. Remember, you''ll need one floppy disk for each distribution disk.


    The Slackware distribution included on the CD-ROM contains the necessary distribution
    disks for a full Linux installation. To help you determine which'
