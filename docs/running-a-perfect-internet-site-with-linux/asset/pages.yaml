  md: '# Chapter 7


    # # Installing Web Server Software


    One of the hottest services available on the Internet right now is the World Wide
    Web. Everyone seems to be creating home pages and reveling in the multimedia experience
    of it all. If you''d like to offer Web pages from your site, you must have a WWW
    server running to handle the page requests. If you don''t intend to run a WWW
    server, feel free to skip ahead to the next chapter.


    Why wouldn''t you want to run a Web server? Primarily, if you don''t intend to
    offer Web pages, there is no reason to run a Web server. You and your users can
    still look at Web pages outside of your site without a Web server. Some reasons
    to not offer Web pages on your site might be:


    +   - You have limited bandwidth and disk space and can''t afford to strain it
    with the added service of providing WWW pages.


    +   - Neither nor your users are interested in offering WWW pages at the moment.


    +   - Your provider stores Web pages for free or at virtually no cost, and you''d
    rather use their bandwidth for access than your own.


    In this chapter, you learn how to:


    +   - Compile your Web server


    +   - Configure your Web server


    +   - Select server scripts


    +   - Move all of your server files to the proper places'
