  md: '# How To Register Your Site


    To register, just fill out the appropriate form and send it to the appropriate
    place. This chapter covers the InterNIC file for nonservice providers. If you''re
    going to be a service provider, you need to fill out another form. At this time,
    the service provider form is isp-ip-template.txt.


    The following are a number of the least self-explanatory excerpts from the general
    InterNIC IP registration form template (version 2.0 of internet-number-template.txt
    was the most current version at the time this book was written):


    +   1. 2a. NIC handle (if known) .....................


    If you have a NIC handle, include it here. If you have ever applied to InterNIC
    for something before, you were assigned a handle. If you have a handle and forgotten
    about it, not including it is not a critical problem.


    +   2. 3. Network name........................


    You need to make a name for your network. It should end in "net," and be original.
    To get some ideas, think of what your network will be used for. Examples are GAMENET,
    PROVIDENET, HELPNET, or COMPANYENET.


    > Tip

    When you come up with something, do a search on the network name (see the next
    section for more information on whos). If nothing for your network name comes
    up, that means no one''s registered yet.


    +   3. Justification


    Host Information


    +   6a. Initially........................................


    +   6b. Within 1 year........................................


    You need to justify to InterNIC why you need the address space you''ve applied
    for. InterNIC wants to know how many hosts you intend to use when your site first
    starts up. In 6b, you need to predict the number of hosts you''ll have in a year.
    If InterNIC doesn''t feel you have sufficient reason to need a large block of
    addresses, it may offer you a smaller portion in tune with your one-year projection.
    However, don''t overestimate what you think you need. Address space is scarce,
    but you can get more later if you need it.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_36_0.png)'
