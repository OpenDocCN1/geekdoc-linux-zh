- img_proc: true
  md: 'Include the word set to tell it you''re setting a logging or display definition.


    Specify the variable you want to set. The items you can set are as follows:


    ```

    SOCKS5_DEBUG      Turns on all debugging information

    ```


    ```

    SOCKS5_LOG_STDERR  Logs all messages to stderr

    ```


    ```

    SOCKS5_LOG_SYSLOG  Logs all messages to syslog

    ```


    For example, I can send all messages to the syslog. Then, I can set the syslog
    to separate these items according to type and save them to specific files. To
    do this, I would:


    ```

    set SOCKS5_LOG_SYSLOG

    ```


    +   8. If your Socks server has services it needs access through other Socks servers,
    you need to assign some proxies. A proxy definition line contains the following
    items:


    +   Indicate the type of proxy, which can be s5 (socks5), s4 (socks4), or np (no
    proxy necessary).


    +   Indicate the address for the service or host you are defining. This address
    can be expressed in the form of step 4: a full host + domain name or a domain
    name.


    +   Specify either the port number or the name of the service you''re defining.


    +   Specify either the IP address or the name of the proxy server to use for the
    service.


    +   Indicate the port on the proxy server to contact for the service.


    For example, if the Web server I discussed earlier has to go through another Socks
    server, and if this proxy is also a Socks5 setup at proxy.renaissoft.com and is
    set to wait for Web items at port 85, I would enter the following:


    ```

    s5 ..renaissoft.com 80 proxy.renaissoft.com 85

    ```


    +   9. Now access controls to determine which requests for services will be honored
    and will be denied. There are two types of access definitions: permit and deny.
    Both options require the same list of parameters, as follows:'
