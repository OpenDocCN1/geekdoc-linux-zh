- img_proc: true
  md: 'Press p to look at your current partition table. If you don''t want any MS-DOS
    partitions left (or if you have extras you want to delete), press d to delete
    a partition. Then, enter the number of the partition you want to delete, and press
    Enter.


    Now, press n to define a new partition and p to make that a primary (one of the
    four partitions you were looking at using the fips program). Enter partition number
    2 if you kept a DOS partition and the Linux partition is the second one on the
    drive. (If you don''t have an MS-DOS partition, you''d enter 1.) To keep from
    having to do a lot of math and count cylinders, I recommend you make your swap
    partition at the very beginning of the Linux partition. Therefore, enter the first
    cylinder number listed on your screen. Then, instead of having to calculate a
    last cylinder number, enter the size in megabytes of your swap partition, such
    as +30M.


    # Tip


    If you get the message, Warning: Linux cannot currently use XXXXX sectors of this
    partition, ignore it. It''s no longer valid for today''s versions of Linux.


    # Note


    Adjust the partition numbers if you don''t have an MS-DOS partition. Basically,
    just subtract one from every partition number that I say to type in.


    Now, type t to see a partition type, and enter the partition number you want to
    define. If your MS-DOS partition is one, your swap partition is two, and your
    Linux partition is three, then you''d first enter 2 for your swap partition. When
    it gives you the hex code, make sure it says 83 for a swap partition.


    Now, you''ll define your main partition. Follow essentially the same steps before:


    +   1. Press n to define a new partition.


    +   2. Press p to say you want a primary partition.


    +   3. For partition number, enter 3 for the Linux partition.


    +   4. Enter the first cylinder number listed.


    +   5. Enter the last cylinder number listed.'
