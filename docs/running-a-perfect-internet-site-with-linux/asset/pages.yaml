    ABC company''s network where there are the following computers: red, green, blue,
    and yellow. Their domain name is abc.com. Our main server is red, and the other
    three go through it to the Internet. On green, blue, and yellow, I would put in
    their sendmail.cf files the line:


    ```

    DSred.abc.com

    ```


    ABC''s feed site is direct.ca. On red, I use the location of my provider''s mail
    server instead of my own:


    ```

    DSmail.direct.ca

    ```


    +   2. DRyour.main_server.name

    This line determines where mail goes to unqualified names, telling Sendmail to
    send e-mail that''s going to someone who doesn''t exist. On the three machines
    that aren''t ABC''s main server, I would use the line:


    ```

    DRred.abc.com

    ```


    On the main server, I would use nothing. That resolves it to the same file that
    the sendmail.cf file is on, which would be the main server, red.abc.com.


    +   3. DHyour.main_server.name

    This determines where all local e-mail traffic goes. If you are using a centralized
    mail server, you''ll want to use the same settings as in the DR section. If you''re
    using a separate mail server, you''ll use the name of that on all the machines.


    +   4. DMyour.site_domain.name

    You use this line to have all of your site''s e-mail masquerade as though it were
    coming from a particular common area. In all the sendmail.cf files on all the
    computers in ABC''s network, I have:


    ```

    DMabc.com

    ```


    This means that if someone sends e-mail to user@domain, it won''t be rejected
    because it''s missing its host name. For example, people can write to me at either
    dee@abc.com or dee@green.abc.com, and the the'
