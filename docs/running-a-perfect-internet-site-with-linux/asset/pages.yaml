    +   - If you find that some groups are building up too large for you to handle,
    go into the expire.ctl file to change their expiration times. This can help considerably
    with binary groups.


    +   - You may find that you have the resources to access more groups than you
    originally planned for, or that you don''t have room for the groups you originally
    thought your site could carry. If the latter proves true, trim down the newsgroups
    that you set your site to get.'
  merge: -1
  pgno: 299
- img_proc: true
  md: '# Maintaining Your Finger Server


    > Tip

    Every day INN runs a script called news.daily, which sends you information on
    your site. This includes statistics for your site, including hard drive usage
    of your news spool, and errors that occurred during the day.


    # Maintaining Your FTP Server


    Once again, FTP server maintenance is fairly simple—server maintenance is fortunately
    easier and less time-consuming than server installation! It''s important to keep
    an eye on your FTP files, especially if you have a server with an incoming directory
    where outside users are dropping files off.


    Keep the following in mind while maintaining your FTP server:


    +   - Keep your files up-to-date. If you offer software packages, stay current
    with new releases so you aren''t offering ones that are versions old.

    - Watch incoming directories carefully. You don''t want your site used for illegal
    traffic (e.g., copyrighted material).

    - Check all new MS-DOS and Macintosh files for viruses. You will need to do this
    on the appropriate machine (e.g., a Mac or an MS-DOS machine).

    - If the load on your site is too high on a consistent basis because of your FTP
    server, and getting higher bandwidth isn''t an option, you may want to find an
    FTP site to mirror yours. There is missing software available on sunsite.nc.edu
    /pub/Linux/system/Network/file-transfer/mirror-1.6.tar.gz, and you would need
    to locate a site that''s willing to mirror yours.

    - Keep any special user permissions up-to-date.


    # Maintaining Your Finger Server


    Finger servers, due to their simple nature, don''t have much to maintain. All
    you need to keep an eye on them to keep track of your dummy users. Keep their
    info up-to-date, and be sure not to leave unnecessary ones around.'
  merge: -1
