  md: '+   Determine the type of authentication methods necessary to trust the service
    connecting. Your choices are one or more of the following:


    +   n no authentication necessary

    uu username authentication required with optional password

    k Kerberos 5 authentication required


    +   Establish the types of commands your server will accept from the process making
    the connection. You can choose one or more of the following:


    +   c Accept connections

    b Accept bind

    u Accept udp

    c Accept any and all commands


    +   Decide the address for the service or host the command is approved to come
    from. This address can be expressed in the form of step 4: a full host + domain
    name or a domain name.


    +   Decide the address for the service or host the command is approved to go to.
    This address can be expressed in the form of item 4: a full host + domain name
    or a domain name.


    +   Specify the port for the service or host the command is authorized to come
    from.


    +   Specify the port for the service or host the command is authorized to go to.


    +   Create an optional list of user names you are specifically authorizing, excluding
    all others.


    For example, if I wanted to authorize all commands from the site neighbor.com
    from port 40, to be sent to the machine catherine.renaissoft.com on port 45 with
    no authentication required, then my line would read as follows:


    ```

    permit a neighbor.com catherine.renaissoft.com 40 45

    ```'
