    If you want your standard backup to be a differential backup, you''ll want to
    do the following:


    +   1. Put a tape in your tape drive.

    2. Type **tob -full volumename** (e.g., tob -full everything). This command will
    do a full backup of your hard drive, and likely take a while. It''s best to do
    this at a time when things are very slow or not being used at all.

    3. Now, use crontab to enter a cron job for your differential backups.

    4. Save and exit the crontab file.


    Make sure to keep a tape in the differential backups! Do fazem frequently, at
    least every couple of days, if not every day.


    > Note

    A way to ensure you have a good backup system going is to follow the son, father,
    grandfather tape backup method (which requires 10 tapes). The son tapes use every
    day of the week except one, maybe Sunday, one per day. On the seventh day (the
    day you use the other tape, Sunday in this case) you use the father tape, one
    each Sunday. Then, you go back using the son tapes. Then, once a month, once daily
    you use the grandfather tape instead of the father tape.


    So, your schedule may look like this:'
