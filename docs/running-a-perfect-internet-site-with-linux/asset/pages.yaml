  md: '# Chapter 5—Setting Up Your Site for General Use


    > (continued)

    The kernel is stored as a compressed file, and loaded into memory as your system
    boots. The file is /zImage or /vmlinuz (only one of these will exist on your system).
    To see the file size, type ls -l filename. The compressed file is expanded, and
    then loaded into memory, if it looks like the size you will see take up more memory
    than you''d like, imagine how much it might take up when expanded.


    Information for replacing your kernel, see chapter 16, "Upgrading Your Software."


    # Booting Your System

    The first thing you need to do before proceeding is to reboot your Linux system
    if you haven''t done it yet. When you see the LILO prompt, press either the Alt
    key or the Ctrl key. Then, at the prompt, enter the name you assigned to Linux
    in your LILO setup, linux.


    | Tip | If you can''t remember what you called your Linux session, just press
    the Tab key. That will list your options. |


    Now, you can watch screens and screens of messages flash as Linux boots, telling
    you what''s happening in the process. Finally, you should get to the following
    (note that your machine name will appear in place of catherine):


    Welcome to Linux 1.2.8.

    catherine login:


    | Note | If you didn''t set your machine name during the installation process
    and are instead using the defaults, you can edit the file /etc/rc.d/rc.M. Find
    the lines in this file that refer to hostname and change it from the default to
    the name of the computer you''re setting up (e.g., catherine). |


    # Linux and Drives

    Unlike MS-DOS and Macintosh systems, UNIX systems look at drives (hard drive,
    floppy drives, and so on) as directories in their filesystem. The general format
    of the command used to mount a device is:


    ```

    device_name location_to_mount_to

    ```'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'For example, if you wanted to mount a data CD, and your CD-ROM is de- fined
    as /dev/cdrom (all of your devices are listed in the /dev directory), and wanted
    to mount the CD at /mount/cd you would use:


    ```

    mount -t iso96660 /dev/cdrom /mount/cd

    ```


    This breaks down as follows:


    | mount | Command you''re running |

    | --- | --- |

    | -t | Tells your system the next item defines the filesystem type |

    | is099660 | Filesystem type for IDE CD-ROM |

    | /dev/cdrom | The device you''re mounting |

    | /mount/cdrom | The location for the item you''re mounting. To access anything
    on the CD-ROM, the path of the file would start with /mount/cdrom |


    If you wanted to mount a floppy disk using the filesystem ext2, at /dev/fd0 (the
    A drive in MS-DOS terms), and to /mount/floppy, you would use the following:


    ```

    mount -t ext2 /dev/fd0 /mount/floppy

    ```


    When you''re finished using the filesystem you mounted, you can''t just re- the
    disk, CD, etc. You need to first unmount the drive. This tells your system to
    finish writing any data that is left, and that the path you mounted it no longer
    exists. To unmount something, use:


    ```

    mount device_name

    ```


    To unmount the CD-ROM in the first example in this section, you would simply use:


    ```

    mount /dev/cdrom

    ```


    # Linux and File Permissions


    While UNIX users are familiar with file permissions, it is important to understand
    them as a system administrator. It''s through setting your file permissions appropriately
    that you will keep your system secure. The easiest way to make an insecure system
    is to have permissions that make an intruder''s work easy.'
