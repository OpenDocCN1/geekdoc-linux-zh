  md: '# Appendix E


    # Setting Up a Firewall


    Sometimes the standard security precautions aren''t considered stringent enough
    to protect a site''s data. If this is the case for your site, you may need to
    set up a firewall to protect your systems from intrusive data. (See chapter 12,
    “Security,” for help on deciding whether or not your site needs a firewall.)


    The firewall software you''ll install with this book is Socks version 5. It allows
    the hosts behind your firewall to access the Internet without permitting hosts
    outside the firewall access them.


    > Note

    > Be sure to have a separate machine for your firewall for good security. Then,
    the machine that contains your servers (e.g., ftppd, httpd) should be outside
    the firewall, so people from the outside world can access it. Your users should
    be inside the firewall.


    > Note

    > There are also commercial firewall packages available for Linux, but they are
    often expensive for anyone except those who are running large sites. The best
    way to find the commercial system (generally software and hardware) is by searching
    the Web. For example, try http://www.zebu.com.


    # Compiling and Installing the Binaries


    First, you need to get the binaries compiled before you can set up your server.
    So, let''s go through that process now.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Preparing To Compile Socks


    Before you can compile Socks, you need to set up a Makefile containing the specific
    settings you need for your site. This will ensure that the firewall soft- ware
    is compiled for your needs.


    To configure your source for compilation, complete the following steps on the
    machine you intend to use as your firewall server (as root):


    +   1. FTP to ftp.nec.com.


    +   2. Go to the directory /pub/security/socks.cstc/socks5.


    +   3. Get the source file socks 5-beta-0.10.tar.gz.


    +   4. Copy the source to /user/src.


    +   5. Gunzip the source.


    +   6. Untar the source.


    +   7. Change to the socks5 directory.


    +   8. Type configure to run the script that will look over your system and configure
    things for you. This is an automated script that locates all of the items it needs
    to be able to compile Socks, and sets up the Makefile and a list of other necessary
    files accordingly. A few scrolls of worth slide as it looks for what it needs
    and then creates the files.


    # Compiling and Installing the Binaries


    Compiling and installing the general Socks binary is fairly simple. Just do the
    following (as root):


    +   1. Go to your Socks directory.


    +   2. Type make to compile Socks. Use what you''ve learned throughout this book
    about fixing source (e.g. in chapter 10, "Installing FTP Server Soft- ware") that
    won''t compile to get it working if you run into any problems.


    +   3. Type make check to run any self-test programs included with the distribution.


    +   4. Type make install to install the binaries and documentation for Socks.


    +   5. Type make clean to get rid of the mess of interim files created during
    the compilation.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '6. Type makeclean to get rid of the interim files the configuration script
    created.


    # # Setting Up Your Socks Server


    Now, it''s time to set up your firewall itself. Take your time and put a lot of
    thought into this section. Whatever you leave out now, you''ll have to add later.


    # ## Setting Up socks5.conf


    The socks5.conf file is where you will define most of your firewall''s permissions
    and how it handles cases. To set this up, do the following (as root):


    +   1. Edit the file /etc/services.


    +   2. Add the line:


    ```

    socks 1080/tcp

    ```


    +   3. Edit the file /etc/socks5.conf.


    +   4. First, you''re going to determine your site''s most basic IP address and
    your netmask. For example, my site''s IP addresses will all start with 199.60.103,
    with one more number specifying the machine. If I use 199.60.103.0, the 0 in the
    last digit tells Socks that any machine with the same initial three parts of the
    IP address is one of mine. For the netmask, because I have a C class address,
    I''d use 255.255.255.0. This item is used in a few of the definitions you''ll
    encounter in this file.


    +   5. Now, assign what kind of authentication is required for each location.
    Your choices are as follows:


    +   - no authentication required

    - username, plus password if you require one

    - kerberos 5 required

    - any form of authentication required


    For each item you want to assign a type of authentication to, you need to have
    a line containing the following items:


    +   - Use the word auth to tell the server this is an authentication assignment
    line.'
  merge: -1
  pgno: 364
- img_proc: true
  md: '# Appendix E—Setting Up a Firewall


    +   - Supply the address for the service the authentication type is being assigned
    to. This address can be the one determined in step 4: a full host + domain name
    or a domain name.


    +   - Specify the port for the above mentioned service.


    +   - Specify the type of authentication required.


    If, for example, I had a Web server on port 80 with the address www.renaissoft.com
    and I didn''t want to require authentication so outside users could access it,
    I would use the following for its authentication line:


    ```

    auth www.renaissoft.com 80 n

    ```


    +   6. If you have any machines with multiple IP addresses, you need to tell your
    firewall how to handle them. The items you need to have on a line assigning routing
    are the following:


    +   - Use the word route to tell the server this is a routing definition.


    +   - Supply the address for the service or host you are defining. This address
    can be expressed in the form of step 4: a full host + domain name or a domain
    name.


    +   - Specify the port number of the service you are defining or the name of the
    service.


    +   - Specify the IP address of the interface card or the name assigned to the
    interface.


    | Caution |

    | If you don''t have machines with multiple IP addresses, a routing definition
    is not necessary. |


    ![](img/df069eac9f46c8d8f72de31230fb3cab_365_0.png)


    For example, if the Web server I referred to in the previous example is on a machine
    with two IP addresses, I need to assign its routing here. If the name of the interface
    card is 1ie, the definition would be as follows:


    ```

    route www.renaissoft.com 80 1ie

    ```


    +   7. Now, you can set how you want your server to log some items, and what kinds
    of messages it should display. A line with this type of definition consists of
    the following items:'
  merge: -1
