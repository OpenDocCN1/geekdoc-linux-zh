    # Compiling wuftpd


    To compile wuftpd, do the following:


    +   1. Log in as root.


    +   2. Change to the directory in which your wuftpd precomp files are stored.


    +   3. Type build lnx to build the Linux version of the daemon. This is a script
    that comes with wuftpd that handles compiling (which you would otherwise do with
    make) and installation (which you would otherwise usually do make install).


    +   4. Watch the compilation progress. Keep in mind that just because it finished,
    it didn’t necessarily compile correctly. So, if you find that you try to move
    on to the installation and nothing is happening, check over your compilation and
    make sure it completed properly.


    > Note


    If you aren’t sure the compilation finished correctly, and want to make sure that
    didn’t miss any error messages, use the following syntax when telling it to compile:

    build lnx > blort 2>&1

    The first > redirects the output from the command build lnx to the file blort.
    The second instance, 2>&1 tells your system to send any error messages to the
    file blort as well. Therefore, when you’re done compiling, you’ll have a file
    containing all the messages the compiler gave, both standard and error.

    nYou won’t see any of the compiler messages on your screen because of this. The
    redirecting tells your system to send them to the file blort instead of your screen.'
