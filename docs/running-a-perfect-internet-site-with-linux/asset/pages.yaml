    # The hosts.nntp File


    The hosts.nntp file tells your server sites gets news from. An example of this
    file is:


    ```

    ## $Revision: 1.4 $$

    ## hosts.nntp - names and addresses that feed us news

    ## Format

    ## <host>

    ## <host>:<password>

    ## <host> can be a name or IP address; no wildcards. Any hosts not

    ## listed here are handed off to nnrpd

    # news.foo.com:

    ```


    All you need to have in this file is the site that feeds news. If it doesn''t
    require a password, you just need the site name followed by a colon, as follows:


    ```

    machine.site.com:

    ```


    If it does require a password, you need to include it after the colon, as follows:


    ```

    machine.site.com:Password

    ```


    # The INN.conf File


    The INN.conf file tells your site the important data it needs to know about itself,
    such as its domain and host. The example file is as follows:


    ```

    ## $Revision: 1.5 $$

    ## INN.conf -- INN configuration data

    ## Format:

    ## <parameter>:<whitespace><value>

    ```'
