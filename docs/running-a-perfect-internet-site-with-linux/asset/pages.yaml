  md: '# Configuring Your Web Server


    FancyIndexing refers to showing directories and files with icons and file sizes.
    If you want to display your files and directories in this fashion, turn this option
    on. If not, set it to off. My next line, setting it to on, is as follows:


    FancyIndexing on


    +   5. # AddIcon tells the server which icon to show for different files # or
    file names. extensions


    You can use this directive to define what icons your Web server will use to display
    the types of files in a directory. This is a simple way to jazz up your directories
    a bit. There are no defaults, so if you don''t define something, no icons will
    be used.


    The path you use to the icons will be taken to be inside the beginning of the
    DocumentRoot variable that you defined at the beginning of this configuration
    file (which I set to be /usr/local/etc/http/htdocs). Therefore, the first variable
    refers to the directory you want to keep the icons in, and this directory will
    be inside your DocumentRoot directory. So, for example, if you use the icons in
    /usr/local/etc/http/htdocs/icons, just enter **/icons** for the directory.


    The next item is the particular icon. While there are no defaults, the server
    does come with icons you can use, which are in the /icons subdirectory of your
    server files. The icons available are shown in figure 7.1.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_160_0.png)'
