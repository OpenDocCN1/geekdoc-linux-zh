  md: '# # Appendix C

    Where To Find Linux Help and Discussions on the Net


    Because Linux is developed, maintained, and distributed over the Internet, Linux
    users have a strong support network online. This appendix is broken down into
    what you can find within newsgroups and down the Web.


    # ## Newsgroups


    A number of newsgroups offer discussions on a wide range of Linux topics. Newgroups
    are presented in this appendix according to their top-level hierarchy (indicated
    by the first part of each newsgroup''s full name, e.g., **comp**).


    > > Tip: If a particular top-level hierarchy contains a UNIX group but not a Linux
    group, and you want to discuss Linux within that hierarchy, the UNIX group is
    often the appropriate location.


    # ## The comp.os.linux Hierarchy


    The hierarchy **comp.os.linux** is the primary collection of Linux newsgroups
    on the net. These groups are where the majority of Linux discussions, support,
    and development take place in Internet news forums.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Appendix C—Where To Find Help and Discussions on the Net


    | Linux Newsgroup | Topic |

    |---|---|

    | comp.os.linux.advocacy | Reasons that Linux is better than other operating systems
    |

    | comp.os.linux.announce | Linux-related announcements |

    | comp.os.linux.answers | Helpful documents that are posted monthly to the comp.os.linux.*
    groups: FAQs, How-To, READMEs, and so on |

    | comp.os.linux.development.apps | Writing applications for Linux and portant
    applications from other operating systems to Linux |

    | comp.os.linux.development.system | The development of Linux kernels, device
    drivers, and modules |

    | comp.os.linux.hardware | Linux and hardware compatibility |

    | comp.os.linux.misc | General Linux topics that don''t fit into one of the other
    groups in the comp.os.linux.* hierarchy |

    | comp.os.linux.networking | Networking and communications under Linux |

    | comp.os.linux.setup | Setting up Linux, and Linux system administration |

    | comp.os.linux.x | X-Windows with Linux |


    Other Linux Newsgroups

    A number of other Linux newsgroups are on the Internet. Many of these are local
    groups, used by Linux user groups in various cities around the world. A sample
    of the groups available are listed below, sorted according to the top-level hierarchy
    they''re found in.


    alt


    The alt hierarchy stands for *alternative*. This set of newsgroups contains anything
    and everything, and is the most loosely governed of the newsgroup top-level hierarchies.


    alt.os.linux


    This old newsgroup is left over from the days before Linux found a home in the
    **comp.os.*** hierarchy. I recommend that you go to the **comp.os.linux.** groups
    instead of **alt.os.linux.**'
  merge: -1
