  md: 'Here you tell your system where it can find httpd files. Where you keep them
    really depends on your preferences, but instead of making up something like /servers/htpd,
    stick with the default so you become familiar with Linux file organization:


    ServerRoot /usr/local/etc/httpd


    +   8. Now you tell your system where it can find httpd logs. if you don''t start
    the paths with a slash (/), it is assumed that the directory starts in the directory
    assigned by ServerRoot. The log files are as follows:


    +   - ErrorLog keeps track of clients that take time out, scripts that produce
    no output, .htaccess files that fail to override items that you don''t have the
    permissions to override, serious server bugs (producing segmentation faults or
    bus errors), and problems with user authentication.


    +   - TransferLog keeps track of the following information on accesses: client
    host, identd offered, user authentication if used, date and time of access, first
    line of the HTTP request, server status code, and the total number of bytes sent.


    +   - AgentLog keeps track of the client agent software that is used. This is
    mostly employed for gathering statistics and for tracking which clients follow
    protocol that cause errors in your server.


    +   - ReferralLog keeps track of the documents that referred people to your links.


    There is a variable associated with this log file called Referignore, which overlooks
    references to particular referring links. You use it if you don''t record every
    time someone looks at one of your pages following a link on your own site, for
    example. Because I have renalsoft.com set up, I''d tell it to ignore that host.


    +   - PidFile keeps track of your server process ID numbers.


    You can choose to keep your logs in some sort of central log area. Because I decided
    that I want to keep my logs with the other httppd items, the next few items in
    my config file will be the following:


    ```

    ErrorLog logs/error_log

    TransferLog logs/access_log

