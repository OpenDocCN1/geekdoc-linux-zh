    multisound/>


    # 11.3. Unsupported


    The ASP chip on Sound Blaster 16 series and AWE32 is not supported.

    AWE32''s onboard MIDI synthesizer is not supported. They will probably never be
    supported.


    Sound Blaster 16''s with DSP 4.11 and 4.12 have a hardware bug that causes hung/stick
    notes when playing MIDI and digital audio at the same time. The problem happens
    with either Wave Blaster daughterboards or MIDI devices attached to the MIDI port.
    There is no known fix.


    # 12. Hard drives


    All hard drives should work if the controller is supported.


    > (From the SCSI HOWTO) All direct access SCSI devices with a block size of 256,
    512, or 1024 bytes should work. Other block sizes will not. (Note that this can
    often be fixed by changing the block and/or sector sizes using the MODE SELECT
    SCSI command.)


    Large IDE (EIDE) drives work fine with newer kernels. The boot partition must
    lie in the first 1024 cylinders to PC BIOS limitations.


    Some Conner CP10605 drives may have problems with Linux and ext2fs. The symptoms
    are idle errors during e2fsck and corrupt system files. Conner has released a
    firmware upgrade to fix this problem, contact at 1-800-4CONNER (US) or +44-1294-315333
    (Europe). Have the microcode version (found on the drive label, 9WA1.6x) handy
    when you call.


    Certain Microlip drives have problems with Adaptec and BusLogic cards, contact
    the drive manufacturers for firmware upgrades if you suspect problems.


    +   ■ Multiple device driver (RAID-0, RAID-1)


    <http://sweet-smoke.ufr-info-p7.ibp.fr/public/Linux/>'
