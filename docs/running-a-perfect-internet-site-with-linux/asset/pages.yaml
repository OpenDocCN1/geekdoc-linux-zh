    The rest of mail list maintenance involves wading through e-mail that comes back
    to the list owner for various reasons. A lot of this mail is:


    +   - Warnings about e-mail that was held on its way, but will still be delivered.
    This e-mail will be taken care of by the site holding it, so no further-action
    is necessary.


    +   - If a user''s mailbox is full, their mail will bounce back. Hopefully, the
