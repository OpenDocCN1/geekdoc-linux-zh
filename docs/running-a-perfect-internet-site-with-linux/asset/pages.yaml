  md: '# linux


    The **linux** hierarchy is a top-level hierarchy for Linux itself. It''s not as
    busy as it could be because a lot of sites don''t carry the top-levels that don''t
    fall within UseNet''s main ones. It contains a lot of Linux development newsgroups.


    This hierarchy is large for a non-UseNet top-level: One has over 55 groups of
    its own. If you have access to it, you may find it worthwhile. Subscribe to the
    groups that you find interesting or useful. Note, however, that the primary Linux
    discussion groups are in the hierarchy **comp.os.linux**.


