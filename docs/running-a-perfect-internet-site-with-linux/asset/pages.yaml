    # Setting Up Subnets


    If the discussion of subnets in chapter 1, “Why Create Your Own Site with Linux?”
    led you to determine that you need to use subnets within your site, follow this
    section carefully. If you don''t intend to use subnets, go ahead and skip to the
    next.


    Typically, you''ll see the number 255.255.255.0 and be told that this is your
    netmask (on a class C address, on class B it would be 255.255.0.0 and class A
    it would be 255.0.0.0). However, this can become your subnet mask.


    In order to tell your site what your subnets are, you need to assign a subnet
    mask. In order to assign a subnet mask, you need to think of IP addresses in terms
    of bits. An IP address is made of 4 bits of 8 bits.


    ```

    11111111.11111111.11111111.00000000

    ```


    The decimal for the first set is


    ```

    128+64+32+16+8+4+2=255

    ```


    So, these bits all together form the class C netmask:


    ```

    255.255.255.0

    ```


    When you assign subnets, you use the last set of 8 bits to tell your site how
    many subnets you''re going to have. Because of this, if you want a number of subnets
    that doesn''t work out in binary, you''ll need to estimate the next step. Let''s
    say you want 6 subnets. You need to look and see how many binary combinations
    you have to use to get this number of subnets.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# Adding Machines to Your Network


    | Binary Digits | Possibilities | Subnets |

    |---|---|---|

    | One | 0, 1 | Two |

    | Two | 00, 01, 10, 11 | Four |

    | Three | 000, 001, 010, 011, 100, 101, 110, 111 | Eight |


    To get six subnets, you need to start with eight subnets and use only the first
    six combinations: 000, 001, 010, 011, 100, 101. The last two combinations aren''t
    used: 110 and 111.


    As you can see, you will need to waste a bit of address space to get six subnets.
    Now that we know how many binary digits we need to get six subnets, we need to
    figure out the final IP decimal to use.


    The netmask we''re using for six subnets is:


    ```

    11111111.11111111.11111111.11000000

    ```


    The decimal for 11000000 is 128+64+32=224.


    So, if you wanted six subnets, your netmask would suddenly become 255.255.255.224.
    In fact, if you wanted seven or eight subnets you''d use the same netmask.


    Each of the six subnets will be within a particular IP range. To determine these
    IP numbers, we have to go back to the bit format. In figure 5.3, we determined
    which bits our six subnets would start with. From there, we can determine the
    IP ranges for each of these subnets.'
