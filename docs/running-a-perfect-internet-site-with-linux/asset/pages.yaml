  md: '# alt.os.linux.caldera


    This Linux group discusses the Caldera Network Desktop.


    > Note

    >Discussions in the country or region-specific hierarchies listed below are generally
    conducted in the country’s home language rather than in English. They are also
    generally comprised of people in or near that country, though others can certainly
    participate.


    # at


    The **at** hierarchy stands for *Austria*.


    # at.linux


    This is an Austrian Linux discussion group.


    # at.fido.linux


    Austrian Fidonet users discuss Linux in this group. (*Fidonet* is a method of
    linking BBS systems.)


    # aus


    The **aus** hierarchy stands for *Australia*.


    # aus.computers.linux


    This is an Australian Linux discussion group.


    # dc


    The **dc** hierarchy stands for *Washington, DC*.


    # dc.org.linux-users


    Because this is an **org** subhierarchy, this group is somewhat of a club for
    Washington, DC Linux users.


    # de


    The **de** hierarchy stands for *Germany*.


    # de.alt.sources.linux.patches


    Here, Germans post patches for Linux source code.'
