  md: 'Build your personalized config file, conf/srm.conf, and fill it in following
    the same order as the example above. The following is a walk-through of the choices
    I made for my server resource configuration file:


    +   1. # DocumentRoot: The directory out of which you will serve your # documents.


    With this variable, you specify the main directory that your server will show
    files from. As usual, I am going to stick with the standards (though if you prefer
    to keep all of your log files in one central place, you can certainly change this
    to suit your needs), this configuration file will start with the following:


    ```

    DocumentRoot /usr/local/etc/httpd/htdocs

    ```


    +   2. # UserDir: The name of the directory that is appended onto a user''s #
    home directory if a ~user request is received.


    This directive is used to assign a directory that will exist in user directories
    where the users can keep their own HTML files for Web access. The standard is
    the directory public_html: any time someone follows a link to, say, http://www.server.com/~user,
    they would actually be going to http://www.server.com/~user/public_html. It''s
    mostly a way of keeping things tidy and keeping the proper security, outsiders
    can''t get into your directories.


    The next line in my config file, because I''m using the default, will be as follows:


    ```

    UserDir public_html

    ```


    +   3. # DirectoryIndex: Name of the file to use as a pre-written HTML # directory
    index.


    With this directive, you can set an assumed file name when an outside user follows
    a link into someone''s home directory. In the example URL''s above, note that
    there were no file names listed. That is because a default file name is set, so
    the server looks at that file first (generally, index.html). I''m going to use
    the default once again, so my next line will be:


    ```

    DirectoryIndex index.html

    ```


    +   4. # FancyIndexing determines whether you want fancy directory indexing #
    or standard.'
