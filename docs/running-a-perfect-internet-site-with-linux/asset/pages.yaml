  md: '# Configuring Your News Server 187


    Now it''s time to configure your expiration times for news articles. Common choices
    are anywhere from three days to a week, depending mostly on how much hard drive
    space is available to store the files. You can even set some hierarchies expire
    differently than others, which is useful for large binary groups that may threaten
    to overrun your drive space in a matter of two days.


    The following is an example of setting up an expire.ctl file and the decision
    process that goes into it:


    +   1. /remember/:25


    News articles aren''t sent to a sight just once. As they circulate, they''ll pass
    through your site a number of times. The remember function retains the history
    of the article (the official article number and other identifying features) after
    the article has expired.


    The line above tells your news server to remember a particular article for 25
    days from the time it arrived at your site. This ensures that within those 25
    days, you won''t storing another copy of the article.


    +   2. *:A:1:5:25


    This is a line defining what the server should do with articles for particular
    groups. You must have one line of this structure, starting with an asterisk (*:A),
    which refers to all groups, moderated and unmoderated. It''s the only way the
    server will know how to handle groups to which you don''t assign specific expiration
    procedures.


    The line reads as follows, from left to right:


    +   * All groups. You can use wild cards in this statement to refer to group hierarchies
    instead of complete group names.

    * A: All groups once again, but this time choose among A (All), U (Unmoderated),
    or M (Moderated).

    * 1: All articles should be kept a minimum of one day. You could also put never
    here if you don''t ever want articles expired (a quick way to run out of hard
    drive space).

    * 25: Sets the default to five days for the period that articles are kept. You
    could also put never here if you don''t ever want articles expired (once again,
    a quick way to run out of hard drive space).

    * 25: Sets the maximum amount of time an article is kept to 25 days (you can also
    use never here if you''d like).


    ![](img/df069eac9f46c8d8f72de31230fb3cab_206_0.png)'
  merge: -1
  pgno: 206
