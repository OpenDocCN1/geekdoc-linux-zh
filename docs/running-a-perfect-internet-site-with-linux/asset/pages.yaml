- img_proc: true
  md: '# Mounting Remote Home Directories


    variable defines all the paths the system automatically searches when you enter
    a command. You can modify your PATH statement in your .login or .profile file.


    How you set an environment variable as exported depends on the shell

    you''re using:


    +   - Root typically uses the sh shell. In this shell, to set an environment

    variable as to be exported, define it with the setenv command. For

    example, setenv NNTPSERVER news.provider.com.

    - Users typically use the csh, tc shells. In these shells, to set an envi-

    nment variable as to be exported, define it with the export com-\mand. For example,
    export NNTPSERVER=news.provider.com.


    Local environment variables are only used within the shell script. When the

    script is finished running, the variable no longer exists. Keep in mind that

    your .login or profile script actually runs the entire time you are logged in.

    Local environment variables are mostly used in scripts written for specific

    purposes, when you don''t need the values to set past the running of the

    script. To set a local environment variable regardless of the shell type, simply

    use the format:


    ```

    VARIABLE=value

    ```


    For example, TERM=console tells your system that you typically log in from the

    actual console instead of dialing in.


    # Mounting Remote Home Directories


    If you''re running a large site you will likely want to have user home directo-

    ries on their own drive. This is because home directories can take up a lot of

    space, depending on whether or not you set disk quotas, and how large those

    disk quotas are per user. Remember, space tends to fill.


    If you haven''t set this hard drive up for use yet, there are a few things you

    eed to do:


    +   - Make sure your computer''s BIOS recognizes this hard drive, and take

    note of which hard drive it shows up as (1, 2, 3, etc).

    - In Linux, take note of the last hard drive name you have assigned (hda,

    hdb, etc.).


