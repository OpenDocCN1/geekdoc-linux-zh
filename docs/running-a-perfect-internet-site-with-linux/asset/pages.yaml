  pgno: 200
- img_proc: true
  md: '# Chapter 9—Installing UseNet Server Software


    # Fig. 9.1


    Full news servers take in news from a feed and pass it on to other sites, who
    may pass it along as well.


    ![](img/df069eac9f46c8d8f72de31230fb3cab_201_0.png)


    Of course, your newsfeed will also require an immense amount of disk space if
    you''re going to carry a full feed. You''ll need several gigabytes of disk space
    to store all of the news you''ll be carrying. So, basically, unless you are running
    a large provider or company site, you probably won''t have the necessary resources
    for a full feed.


    # Configuring Your News Server


    The news server you are going to use (if you choose to run one) is INN. Fortunately,
    Slackware handles the actual installation for you, so this is one server you won''t
    have to compile! There is quite a bit of configuration to do, however, so, take
    it one step at a time.


    # Assigning Mail Aliases


    You need two mail aliases on your site for INN: news and usenet. (In this example,
    you point them to root.) To add these, do the following:


    +   1. Log in **root**.


    +   2. Change to the directory /usr/lib.


    +   3. Edit the file aliases.'
