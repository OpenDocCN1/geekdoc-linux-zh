  md: "I'll walk you through the compiling of this kernel: version 1.2.13. First,\
    \ I'll make sure that everything is properly in place, as follows:\n\n+   1. Change\
    \ to the directory /usr/include.\n\n+   2. Type `rm -rf linux` to remove any old\
    \ C header files.\n\n+   3. Type `ln -s /usr/src/linux/include/linux linux` to\
    \ make a soft link that points your system to the new C header files included\
    \ with the new kernel source.\n\n+   4. Type `rm -rf asm` to remove any old assembler\
    \ header files.\n\n+   5. Type `ln -s /usr/src/linux/include/asm-i386 asm` to\
    \ make a soft link that points your system to the new assembler header files included\
    \ with the new kernel source.\n\n+   6. Change to /usr/src/linux.\n\n+   7. Type\
    \ `make mrproper` to clean up any additional extra source that could cause problems\
    \ with your compilation.\n\nNow, to configure the kernel to suit your needs, do\
    \ the following as **root**:\n\n+   1. Change to `/usr/src/linux` if you're not\
    \ already there.\n\n+   2. Type `make config` to start the script that walks you\
    \ through specific configuration options. From here, I will walk you through the\
    \ questions I got and the answers I gave in this particular version.\n\n| Tip\
    \ |\n When in doubt over whether you need a feature, it's generally safe to choose\
    \ y for yes. Then at least, you won't have to recompile to add a needed feature.\
    \ If you choose for nothing, it's not included in the compiled kernel, and you'll\
    \ have to go back and compile it all over again! The main difference is the more\
    \ things you say yes to, the larger the kernel |\n\n+   3. Kernel math emulation:\
    \ Answer n for no unless you are running a 386 without a coprocessor on this machine.\n\
    \n+   4. Normal floppy disk support: Answer y for yes so your kernel will support\
    \ standard PC floppy disks."
