  md: '| Subnets | Bit Format | IP Range |

    |---|---|--|

    | 000 | 00000001-00111110 | 1-30 |

    | 001 | 00100001-00111110 | 33-62 |

    | 010 | 01000001-01111110 | 65-94 |

    | 011 | 01100001-01111110 | 97-126 |

    | 100 | 10000001-10111110 | 129-158 |

    | 101 | 10100001-10111110 | 161-190 |

    | 110 | | 193-222 |

    | 111 | | 225-254 |


    00000001 is the lowest valid host; 00000000 is reserved. 255 (11111111) is also
    reserved.


    So, if you have the IP assigned 235.23.42, a machine in subnet one might be 235.23.42.13.
    A machine in subnet three might be 235.23.42.68.


    # Telling Your Nameserver About Your Machines


    Your nameserver—since you''re providing your own nameserver—needs to know about
    the other machines on your network as well, so it can translate them into the
    appropriate IP numbers for the rest of the Internet.


    As root, edit the file /etc/named.rev. Now, for each machine and incoming modem
    line, plus any devices you want people to be able to access from outside your
    network, you need to make a nameserver entry. This entry is in four parts:


    +   * The distinguishing IP numbers for the machine. For example, if your network''s
    assigned IP address begins with 195.85.231, you would only need to include the
    host-specific number. If the host you''re setting up is 195.85.231.5, you would
    enter a 5 as the first item in the nameserver definition.

    * The second entry will be the letters IN. This defines the entry as a DNS (Domain
    Name Service) resource record.

    * The third will be the letters PTR. PTR stands for Pointer, which tells your
    nameserver that this entry is used to convert a host IP address to a host name.

    * The final entry is the full host plus name for the machine you''re defining.
    For example, baseball.sports.com.


    Putting this entry together, it would look like:


    ```

    5       IN      PTR      baseball.sports.com

    ```'
