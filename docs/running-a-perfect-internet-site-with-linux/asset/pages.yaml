  md: '# 68 Chapter 4—Installing Linux from the CD-ROM


    > Tip

    If you shut your system down between chapter 3 and now, remember you need to boot
    using your boot disk, then your root disk. Also, you can remove your root disk
    once you reach the login prompt.


    The following are error messages to watch out for:


    +   - The installation program complains that there''s a lock file already in
    place, and stops the installation process. Instead, it keeps going from disk to
    disk. Cancel (with Ctrl+C), reformat or erase the drive, and start over.


    > Note

    A lock file is used to tell a program that something is in use. For example, in
    this case, the installation program tries to run itself and finds a file that
    tells it''s already running. Lock files are supposed to be erased by the programs
    that created them, but if they exit abnormally this will not happen.


    +   - If the error device file starts cropping up, your Linux partition is full.
    As I said, a full Linux installation takes up a lot of space. If you chose to
    make your main Linux partition close to 200M, you may find you don''t have enough
    room if you install a large portion of the packages. Either repartition your drive
    for more space, or install fewer packages. Erase the installation you''ve done,
    and start from scratch.


    # Installing Linux


    As said in the previous section, take your time. You can always reinstall if you
    need to, so don''t get nervous!


    First, type setup at your Linux prompt. What you see from now on depends on which
    root disk you choose. I''ll walk you through the Text installation because that''s
    what I selected. However, both versions of the installation have the same goal
    and will produce similar results.'
