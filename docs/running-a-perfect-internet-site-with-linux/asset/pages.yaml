  md: '# Mounting Remote Home Directories


    The general options available are:


    +   - rw Read-write filesystem

    - ro Read-only filesystem

    - suid (Default) SUID access is allowed

    - nosuid No SUID access is allowed

    - noauto Don''t automatically mount this particular filesystem (default is to
    mount)

    - usrquota Use of user quotas are allowed on this filesystem

