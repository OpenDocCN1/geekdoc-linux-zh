- img_proc: true
  md: 'To set the above permissions, you would use:


    ```

    chmod 764 filename

    ```


    If you want to set the file to run as something other than the standard, you can
    do this with chmod as well. In particular, you can set this file to run as SUID
    (set user ID), or SGID (set group ID). By doing this, you tell the file to run
    as though it''s a member of the particular group or owner.


    Setting a file to SUID or SGID simply requires adding an extra digit to the permissions
    you use with chmod. Technically, if you don''t use anything, it assumes a 0.


    | Decimal | SID Setting |

    |---|---|n| 0 | Standard file. Runs as the user who invokes it. |

    | 2 | SGID: File runs as a member of its group. |

    | 4 | SUID: File runs as its owner. |

    | 6 | Both SUID and SGID. |


    The example we''ve been using in this section would be permission set 0764. If
    it were 2764, it would look like -rwxrxr--. 4764 would be -rwrsr-x--. 6755 would
    be -rwsr-xr.


    # Linux and Environment Variables


    When you log into an account, it starts a shell. This shell runs in an environment,
    with its variables that define your preferences and settings. There are two types
    of environment variables, exported and local.


    Exported environment variables exist outside of your shell script. They''re mostly
    defined in your startup script, which is .login or .profile. To get a list of
    your current environment variable settings, type env. Some examples of environment
    variables and their settings for the user fred might be:


    ```

    HOME=/home/fred

    SHELL=/bin/tcsh

    ```


    The export environment variable people are most likely to want to change will
    be the PATH statement. Just as with an MS-DOS path statement, this'
  merge: -1
