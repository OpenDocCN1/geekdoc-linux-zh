    \n# 使用 Subversion 的注意事项\n\n## 使用 Subversion 的注意事项\n\n如果您想使用 `Subversion`（例如更新\
    \ ports 树），您应该注意以下问题：\n\n(1) 如果您的服务器运行在代理之后，您应该修改您的 `Subversion` 配置文件：\n\n```bash\n\
