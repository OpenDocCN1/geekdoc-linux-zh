    \ size Including Total Amount of Free and Used Memory Size](http://www.cyberciti.biz/faq/freebsd-command-to-get-ram-information/).\n\
    \n# Notices of using Subversion\n\n## Notices of using Subversion\n\nIf you want\
    \ to use `Subversion`, for example, updating ports tree, you should pay attention\
    \ to the following issues:\n\n(1) If your server works behind a proxy, you should\
    \ modify your `Subversion` configuration file:\n\n```\n# cat ~/.subversion/servers\n\
    [global]\nhttp-proxy-host = web-proxy.xxxx.com\nhttp-proxy-port = 8080\nhttp-compression\
    \ = no\n```\n\nOtherwise, you may encounter following errors:\n\n```\n# svn checkout\
    \ https://svn.FreeBSD.org/ports/head /usr/ports\nError validating server certificate\
    \ for 'https://svn.freebsd.org:443':\n - The certificate is not issued by a trusted\
    \ authority. Use the\n   fingerprint to validate the certificate manually!\n -\
    \ The certificate hostname does not match.\nCertificate information:\n - Hostname:\
    \ FG3K6C3A15800021\n - Valid: from Mar 21 09:15:26 2015 GMT until Mar 21 09:15:26\
    \ 2025 GMT\n - Issuer: FG3K6C3A15800021, Fortinet Ltd.\n - Fingerprint: 1D:F4:21:20:2F:06:41:45:3F:7A:18:FB:79:F3:BB:30:36:32:22:A3\n\
    (R)eject, accept (t)emporarily or accept (p)ermanently? p\nsvn: E170013: Unable\
    \ to connect to a repository at URL 'https://svn.freebsd.org/ports/head'\nsvn:\
    \ E000054: Error running context: Connection reset by peer\n```\n\nOr:\n\n```\n\
    # svn checkout https://svn.FreeBSD.org/ports/head /usr/ports\n......\nsvn: E175002:\
    \ REPORT request on '/ports/!svn/me' failed\n```\n\n(2) If you meet similar errors\
    \ like as follows executing `svn` command:\n\n```\nsvn: E200030: SQLite compiled\
    \ for 3.11.1, but running with 3.9.2\n```\n\nYou should update your `SQLite`:\n\
    \n```\n# pkg upgrade sqlite3\n```\n\nReferences:\n\n[Using FreeBSD inside a controlled\
    \ network – A required HTTP Proxy and No FTP](http://www.rhyous.com/2012/04/13/using-freebsd-inside-a-controlled-network-a-required-http-proxy-and-no-ftp/);\n\
    \n[How to configure a HTTP proxy for svn](http://stackoverflow.com/questions/1491180/how-to-configure-a-http-proxy-for-svn).\n\
    \n# Print PCI devices info\n\n## Print PCI devices info\n\n`FreeBSD` provides\
    \ `pciconf` command which can list `PCI` devices info:\n\n```\n# pciconf -lv\n\
    hostb0@pci0:0:0:0:  class=0x060000 card=0x197615ad chip=0x71908086 rev=0x01 hdr=0x00\n\
    vendor = 'Intel Corporation'\ndevice = '440BX/ZX/DX - 82443BX/ZX/DX Host bridge'\n\
    class  = bridge\nsubclass   = HOST-PCI\npcib1@pci0:0:1:0:   class=0x060400 card=0x00000000\
    \ chip=0x71918086 rev=0x01 hdr=0x01\nvendor = 'Intel Corporation'\ndevice = '440BX/ZX/DX\
    \ - 82443BX/ZX/DX AGP bridge'\nclass  = bridge\nsubclass   = PCI-PCI\nisab0@pci0:0:7:0:\
    \   class=0x060100 card=0x197615ad chip=0x71108086 rev=0x08 hdr=0x00\nvendor =\
    \ 'Intel Corporation'\ndevice = '82371AB/EB/MB PIIX4 ISA'\nclass  = bridge\nsubclass\
    \   = PCI-ISA\n......\n```\n\nIf you are accustomed to `lspci` which is shipped\
    \ on `GNU/Linux`, you can install it yourself:\n\n```\n# pkg install pciutils\n\
    ......\n# lspci\n00:00.0 Host bridge: Intel Corporation 440BX/ZX/DX - 82443BX/ZX/DX\
    \ Host bridge (rev 01)\n00:01.0 PCI bridge: Intel Corporation 440BX/ZX/DX - 82443BX/ZX/DX\
    \ AGP bridge (rev 01)\n00:07.0 ISA bridge: Intel Corporation 82371AB/EB/MB PIIX4\
    \ ISA (rev 08)\n......\n```\n\nReference:\n\n[\"lspci\" & pciconf commands in\
    \ FreeBSD](http://kazaonfreebsd.blogspot.com/2012/12/lspci-pciconf-commands-in-freebsd.html).\n\
    \n# Mount procfs file system\n\n## Mount procfs file system\n\n`FreeBSD` doesn't\
    \ mount `procfs` file system by default, if you need it, you can mount it yourself:\n\
    \n```\nmount -t procfs proc    /proc\n```\n\nIf you want the `procfs` is automatically\
    \ mounted at boot time, you can add the following line in `/etc/fstab` file:\n\
    \n```\nproc         /proc   procfs  rw    0 0 \n```\n\nReferences:\n\n[procfs:\
    \ Gone But Not Forgotten](https://www.freebsd.org/doc/en/articles/linux-users/procfs.html);\n\
    \n[procfs -- process file system](https://www.freebsd.org/cgi/man.cgi?query=procfs&sektion=&n=1).\n\
    \n# Kldstat command\n\n## Kldstat command\n\nOn `FreeBSD`, you can use `kldstat`\
    \ command to display the status of any files dynamically linked into the kernel:\n\
    \n```\n# kldstat\nId Refs Address            Size     Name\n 1    6 0xffffffff80200000\
    \ 17bc6a8  kernel\n 2    1 0xffffffff81a11000 56c6     fdescfs.ko\n 3    1 0xffffffff81a17000\
    \ 2ba8     uhid.ko\n```\n\nIf you want more detailed info, you can use `-v` option:\n\
    \n```\n# kldstat -v\nId Refs Address            Size     Name\n 1    6 0xffffffff80200000\
    \ 17bc6a8  kernel (/boot/kernel/kernel)\n Contains modules:\n  Id Name\n  386\
    \ if_lo\n  398 newreno\n  373 elf32\n  372 elf64\n  374 shell\n.....\n```\n\n\
    Reference:\n\n[KLDSTAT(8)](https://www.freebsd.org/cgi/man.cgi?kldstat(8)).\n\n\
    # Load and unload files into kernel\n\n## Load and unload files into kernel\n\n\
    You can use `kldload` command to load files into kernel. For example, enter `/boot/kernel`\
    \ directory, and use `kldstat` to check currently loaded files:\n\n```\n# cd /boot/kernel\n\
    # kldstat\nId Refs Address            Size     Name\n 1    6 0xffffffff80200000\
    \ 17bc6a8  kernel\n 2    1 0xffffffff81a11000 56c6     fdescfs.ko\n 3    1 0xffffffff81a17000\
    \ 2ba8     uhid.ko\n```\n\nUse `kldload` to load `zfs.ko` file:\n\n```\n# kldload\
    \ zfs.ko\n# kldstat\nId Refs Address            Size     Name\n 1   15 0xffffffff80200000\
    \ 17bc6a8  kernel\n 2    1 0xffffffff81a11000 56c6     fdescfs.ko\n 3    1 0xffffffff81a17000\
    \ 2ba8     uhid.ko\n 7    1 0xffffffff81a1a000 1ee0c8   zfs.ko\n 8    1 0xffffffff81c09000\
    \ 3330     opensolaris.ko\n```\n\nYou can see the `zfs.ko` is loaded successfully.\n\
    \nUnloading file uses `kldunload` command:\n\n```\n# kldunload zfs.ko\n# kldstat\n\
    Id Refs Address            Size     Name\n 1    6 0xffffffff80200000 17bc6a8 \
    \ kernel\n 2    1 0xffffffff81a11000 56c6     fdescfs.ko\n 3    1 0xffffffff81a17000\
    \ 2ba8     uhid.ko\n```\n\nReference:\n\n[kldload](https://www.freebsd.org/cgi/man.cgi?kldload(8));\n\
    \n[kldunload](https://www.freebsd.org/cgi/man.cgi?kldunload(8))."
