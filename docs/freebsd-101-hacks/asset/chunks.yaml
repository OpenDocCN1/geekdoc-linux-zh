    \ to the following issues:\n\n(1) If your server works behind a proxy, you should\
    \ modify your `Subversion` configuration file:\n\n```bash\n# cat ~/.subversion/servers\n\
    [global]\nhttp-proxy-host = web-proxy.xxxx.com\nhttp-proxy-port = 8080\nhttp-compression\
    \ = no\n```\n\nOtherwise, you may encounter following errors:\n\n```bash\n# svn\
    \ checkout https://svn.FreeBSD.org/ports/head /usr/ports\nError validating server\
    \ certificate for 'https://svn.freebsd.org:443':\n - The certificate is not issued\
    \ by a trusted authority. Use the\n   fingerprint to validate the certificate\
    \ manually!\n - The certificate hostname does not match.\nCertificate information:\n\
    \ - Hostname: FG3K6C3A15800021\n - Valid: from Mar 21 09:15:26 2015 GMT until\
    \ Mar 21 09:15:26 2025 GMT\n - Issuer: FG3K6C3A15800021, Fortinet Ltd.\n - Fingerprint:\
    \ 1D:F4:21:20:2F:06:41:45:3F:7A:18:FB:79:F3:BB:30:36:32:22:A3\n(R)eject, accept\
    \ (t)emporarily or accept (p)ermanently? p\nsvn: E170013: Unable to connect to\
    \ a repository at URL 'https://svn.freebsd.org/ports/head'\nsvn: E000054: Error\
    \ running context: Connection reset by peer\n```\n\nOr:\n\n```bash\n# svn checkout\
    \ https://svn.FreeBSD.org/ports/head /usr/ports\n......\nsvn: E175002: REPORT\
    \ request on '/ports/!svn/me' failed\n```\n\n(2) If you meet similar errors like\
    \ as follows executing `svn` command:\n\n```bash\nsvn: E200030: SQLite compiled\
    \ for 3.11.1, but running with 3.9.2\n```\n\nYou should update your `SQLite`:\n\
    \n```bash\n# pkg upgrade sqlite3\n```\n\nReferences:\n\n[Using FreeBSD inside\
    \ a controlled network – A required HTTP Proxy and No FTP](http://www.rhyous.com/2012/04/13/using-freebsd-inside-a-controlled-network-a-required-http-proxy-and-no-ftp/);\n\
    \n[How to configure a HTTP proxy for svn](http://stackoverflow.com/questions/1491180/how-to-configure-a-http-proxy-for-svn).\n\
    \n# Print PCI devices info\n\n## Print PCI devices info\n\n`FreeBSD` provides\
    \ `pciconf` command which can list `PCI` devices info:\n\n```bash\n# pciconf -lv\n\
    hostb0@pci0:0:0:0:  class=0x060000 card=0x197615ad chip=0x71908086 rev=0x01 hdr=0x00\n\
    vendor = 'Intel Corporation'\ndevice = '440BX/ZX/DX - 82443BX/ZX/DX Host bridge'\n\
    class  = bridge\nsubclass   = HOST-PCI\npcib1@pci0:0:1:0:   class=0x060400 card=0x00000000\
    \ chip=0x71918086 rev=0x01 hdr=0x01\nvendor = 'Intel Corporation'\ndevice = '440BX/ZX/DX\
    \ - 82443BX/ZX/DX AGP bridge'\nclass  = bridge\nsubclass   = PCI-PCI\nisab0@pci0:0:7:0:\
    \   class=0x060100 card=0x197615ad chip=0x71108086 rev=0x08 hdr=0x00\nvendor =\
    \ 'Intel Corporation'\ndevice = '82371AB/EB/MB PIIX4 ISA'\nclass  = bridge\nsubclass\
    \   = PCI-ISA\n......\n```\n\nIf you are accustomed to `lspci` which is shipped\
    \ on `GNU/Linux`, you can install it yourself:\n\n```bash\n# pkg install pciutils\n\
    ```\n"
