    \n# Use \"procstat\" to get process info\n\n## Use \"procstat\" to get process\
    \ info\n\nOn `FreeBSD`, you can use `procstat` command to get detailed info of\
    \ process. E.g.:\n\n```\n# procstat 521\nPID  PPID  PGID   SID  TSID THR LOGIN\
    \    WCHAN     EMUL          COMM\n521     1   521   521     0   1 root     select\
    \    FreeBSD ELF64 syslogd\n```\n\nThe above outputs describe the info of process\
    \ whose `PID` is `521`: its `PID`, parent `PID`, command name, etc.\n\nIf you\
    \ want to display all processes' info, use `-a` option:\n\n```\n# procstat -a\n\
    PID  PPID  PGID   SID  TSID THR LOGIN    WCHAN     EMUL          COMM\n0     0\
    \     0     0     0  10 -        -         -             kernel\n1     0     1\
    \     1     0   1 root     wait      FreeBSD ELF64 init\n2     0     0     0 \
    \    0   2 -        -         -             cam\n3     0     0     0     0   1\
    \ -        idle      -             mpt_recovery0\n4     0     0     0     0  \
    \ 1 -        waiting_  -             sctp_iterator\n5     0     0     0     0\
    \   2 -        umarcl    -             pagedaemon\n6     0     0     0     0 \
    \  1 -        psleep    -             vmdaemon\n7     0     0     0     0   1\
    \ -        pgzero    -             pagezero\n```\n\nThere are many options you\
    \ can use for `procstat`, i.e., if you are curious about thread info, use `-t`\
    \ option:\n\n```\n# procstat -t 521\nPID    TID COMM             TDNAME      \
    \     CPU  PRI STATE   WCHAN\n521 100065 syslogd          -                  0\
    \  120 sleep   select\n```\n\nFor details of every option, please refer the [manual](https://www.freebsd.org/cgi/man.cgi?procstat).\n\
    \n# Sockstat command\n\n## Sockstat command\n\nOn `FreeBSD`, we can employ `sockstat`\
    \ command to list both open Internet and `UNIX`domain sockets:\n\n```\n# sockstat\n\
    USER     COMMAND    PID   FD PROTO  LOCAL ADDRESS         FOREIGN ADDRESS\nroot\
    \     sshd       45768 3  tcp4   192.168.80.129:22     192.168.80.1:60803\nroot\
    \     sshd       22144 3  tcp4   192.168.80.129:22     192.168.80.1:54834\nroot\
    \     sshd       19097 3  tcp4   192.168.80.129:22     192.168.80.1:58174\nsmmsp\
    \    sendmail   662   3  dgram  -> /var/run/log\nroot     sendmail   659   3 \
    \ tcp4   127.0.0.1:25          *:*\nroot     sendmail   659   4  dgram  -> /var/run/logpriv\n\
    root     sshd       656   3  tcp6   *:22                  *:*\nroot     sshd \
    \      656   4  tcp4   *:22                  *:*\n......\n```\n\nWe can see the\
    \ output of `sockstat` lists which process owns the socket, the file descriptor\
    \ number of the socket, etc. So it is a really awesome tool to diagnose network\
    \ related issues.\n\nReference:\n\n[SOCKSTAT(1)](https://www.freebsd.org/cgi/man.cgi?query=sockstat&sektion=1).\n\
    \n# Use \"freecolor\" to display memory and swap usage\n\n## Use \"freecolor\"\
    \ to display memory and swap usage\n\n`Freecolor` on `FreeBSD` is equal to `free`\
    \ on `GNU/Linux`. Install it:\n\n```\n# cd /usr/ports/sysutils/freecolor\n# make\
    \ install clean \n```\n\nDisplay the memory and swap usage in bar format:"
