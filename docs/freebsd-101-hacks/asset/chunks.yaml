  trans: "\n\n`FreeBSD-STABLE` 独立于 `FreeBSD-CURRENT`，适用于生产版本。它主要接受错误修复和安全更新。\n\n你应该注意到，分支不是一个点，而是持续的开发流。而\
    \ `FreeBSD RELEASE` 版本是一个点，它只是 `FreeBSD-STABLE` 分支在某个时刻的快照。\n\n引用：\n[跟踪开发分支](https://www.freebsd.org/doc/handbook/current-stable.html);\n\
    [发布工程](http://www.over-yonder.net/~fullermd/rants/bsd4linux/05).\n\n# 更新 Ports\
    \ 集合\n\n位于 `/usr/ports` 下的内容被称为 Ports 集合（Ports Collection），我们可以使用 `portsnap` 命令来更新它：\n\
    \n(1) 如果是第一次使用 `portsnap`，你应该运行以下命令：\n\n```\n# portsnap fetch extract\n```\n\n\
    否则，你可能会遇到如下所示的错误：\n\n```\n......\n/usr/ports was not created by portsnap.\nYou\
    \ must run 'portsnap extract' before running 'portsnap update'.\n```\n\n(2) 此后，你只需要执行\
    \ `portsnap fetch update` 即可更新 Ports 集合。\n\n引用：\n[使用 Ports 集合](https://www.freebsd.org/doc/handbook/ports-using.html);\n\
    [关于使用 portsnanp 升级源码树的问题](https://lists.freebsd.org/pipermail/freebsd-questions/2016-June/272255.html).\n\
    \n# 安装 port 时接受默认选项\n\n在编译和安装 port 过程中，如果你厌倦了提示并想使用所有默认选项，可以利用 `BATCH`：\n\n```\n\
    # make install clean BATCH=yes \n```\n\n引用：\n[如何在安装 FreeBSD port 时避免提示？](http://unix.stackexchange.com/questions/5257/how-can-i-avoid-the-prompts-when-installing-a-freebsd-port).\n\
    \n# 启用 ls 彩色输出\n\n`ls -G` 可以让 `ls` 输出彩色。如果你使用 `csh`，可以在 `.cshrc` 中添加以下语句：\n\n\
    ```\nalias ls        ls -G\n```\n\n引用：\n[FreeBSD: 启用彩色 ls 输出](https://www.cyberciti.biz/tips/freebsd-how-to-enable-colorized-ls-output.html).\n\
    \n# 清晰的目录结构\n\n`FreeBSD` 在基础操作系统和用户添加的应用程序之间有清晰的分，这意味着所有不属于基础系统的内容都在 `/usr/local`\
    \ 目录下，而 `/usr/local` 目录的结构在很大程度上镜像了 `/` 或 `/usr` 目录中的结构。\n\n例如，从源码树或通过 `package`\
    \ 命令安装的应用将位于 `/usr/local/bin` 或 `/usr/local/sbin`，对应于 `/bin``/sbin`/`/usr/bin`\
    \ 和 `/usr/local/sbin`；`/etc` 目录包含基础系统的配置文件，而 `/usr/local/etc` 则用于用户添加的应用程序。\n\n\
    引用：\n[给 Linux 用户的 FreeBSD 对比介绍](https://www.digitalocean.com/community/tutorials/a-comparative-introduction-to-freebsd-for-linux-users);\n\
    [目录结构](https://www.freebsd.org/doc/handbook/dirstructure.html);\n[我喜欢 FreeBSD\
    \ 的十件事](https://bsdmag.org/download/the_begginers_guide/).\n\n# 修改 shell\n\n如果你之前在\
    \ `Linux` 上工作，你可能会怀念 `Bash`，并且不习惯 `FreeBSD` 默认提供的 `csh`。你可以按照以下指令将 shell 改为 `Bash`：\n\
    \n(1) `Bash` 必须已经安装在你的 `FreeBSD` 上，并且其完整路径也应包含在 `/etc/shells` 中。例如：\n\n```\n #\
    \ pkg install bash\nUpdating FreeBSD repository catalogue...\nFreeBSD repository\
    \ is up-to-date.\nAll repositories are up-to-date.\nThe following 1 package(s)\
    \ will be affected (of 0 checked):\n\nNew packages to INSTALLED:\n        bash:\
    \ 4.3.42_1\n......\n```\n\n你会发现 `Bash` 路径自动显示在 `/etc/shells` 中：\n\n```\n # cat\
    \ /etc/shells\n# $FreeBSD: releng/10.3/etc/shells 59717 2000-04-27 21:58:46Z ache\
    \ $\n#\n# List of acceptable shells for chpass(1).\n# Ftpd will not allow users\
    \ to connect who are not using\n# one of these shells.\n\n/bin/sh\n/bin/csh\n\
    /bin/tcsh\n/usr/local/bin/bash\n/usr/local/bin/rbash\n```\n\n(2) 执行 `chsh -s /usr/local/bin/bash`：\n\
    \n```\n# chsh -s /usr/local/bin/bash\nchsh: user information updated\n```\n\n\
    重新登录后，你会发现 shell 现在是 `bash` 了：\n\n```\n# echo $SHELL\n/usr/local/bin/bash\n```\n\
    \n引用：\n[Shells](https://www.freebsd.org/doc/handbook/shells.html).\n\n# 修改 PATH\
    \ 变量\n\n在 `csh` 中，如果你想更改 `$PATH` 环境变量，你应该修改 `.cshrc` 文件：\n\n```\n# cat .cshrc\n\
    ......\nset path = (/sbin /bin /usr/sbin /usr/bin /usr/games /usr/local/sbin /usr/local/bin\
    \ $HOME/bin $HOME/gocode/bin)\n......\n```\n\n例如，将 `/usr/local/go/bin` 添加到 `$PATH`\
    \ 中：\n\n```\n# cat .cshrc\n......\nset path = (/sbin /bin /usr/sbin /usr/bin /usr/games\
    \ /usr/local/sbin /usr/local/bin $HOME/bin $HOME/gocode/bin /usr/local/go/bin)\n\
    ......\n```\n\n然后执行 `source .cshrc` 命令，你会发现新的 `$PATH` 生效了：\n\n```\n# source .cshrc\n\
    # echo $PATH\n/sbin:/bin:/usr/sbin:/usr/bin:/usr/games:/usr/local/sbin:/usr/local/bin:/root/bin:/root/gocode/bin:/usr/local/go/bin\n\
    ```\n\n引用：\n[杂项与技巧](http://www.freebsdmadeeasy.com/tutorials/freebsd/freebsd-tricks.php).\n\
    \n# 为 bash 着色\n\n(1) 在你的 `$HOME` 目录下创建 `..dir_colors` 文件：\n\n"
- fmt: "\n# Below, there should be one TERM entry for each termtype that is colorizable\n\
    \n```\nTERM ansi\nTERM color-xterm\nTERM con132x25\nTERM con132x30\nTERM con132x43\n\
    TERM con132x60\nTERM con80x25\nTERM con80x28\nTERM con80x30\nTERM con80x43\nTERM\
    \ con80x50\nTERM con80x60\nTERM cons25\nTERM console\nTERM cygwin\nTERM dtterm\n\
    TERM Eterm\nTERM gnome\nTERM konsole\nTERM kterm\nTERM linux\nTERM linux-c\nTERM\
    \ mach-color\nTERM putty\nTERM rxvt\nTERM rxvt-cygwin\nTERM rxvt-cygwin-native\n\
    TERM rxvt-unicode\nTERM screen\nTERM screen-bce\nTERM screen-w\nTERM screen.linux\n\
    TERM vt100\nTERM xterm\nTERM xterm-256color\nTERM xterm-color\nTERM xterm-debian\n\
    ```\n\n# Below are the color init strings for the basic file types. A color init\n\
    # string consists of one or more of the following numeric codes:\n# Attribute\
    \ codes:\n# `00=none` `01=bold` `04=underscore` `05=blink` `07=reverse` `08=concealed`\n\
    # Text color codes:\n# `30=black` `31=red` `32=green` `33=yellow` `34=blue` `35=magenta`\
    \ `36=cyan` `37=white`\n# Background color codes:\n# `40=black` `41=red` `42=green`\
    \ `43=yellow` `44=blue` `45=magenta` `46=cyan` `47=white`\n\nNORMAL 00       \
    \    # global default, although everything should be something.\nFILE 00     \
    \        # normal file\nDIR 01;34           # directory\nLINK 01;36          #\
    \ symbolic link. (If you set this to 'target' instead of a\n                 \
    \   # numerical value, the color will match the file pointed to)\nFIFO 40;33 \
    \         # pipe\nSOCK 01;35          # socket\nDOOR 01;35          # door\nBLK\
    \ 40;33;01        # block device driver\nCHR 40;33;01        # character device\
    \ driver\nORPHAN 01;05;37;41  # orphaned syminks\nMISSING 01;05;37;41 # ... and\
    \ the files they point to\n\n# This is for files with execute permission:\nEXEC\
    \ 01;32\n\n# List any file extensions like '.gz' or '.tar' that you would like\
