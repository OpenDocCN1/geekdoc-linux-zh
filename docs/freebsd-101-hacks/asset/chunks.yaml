    \ /dist\n```\n\n(3) 安装包（例如 `xorg`）：\n\n```\nenv REPOS_DIR=/dist/packages/repos\
    \ pkg install xorg\n```\n\n引用：\n\n- [Packages and Ports: Adding Software in FreeBSD](https://www.freebsd.org/doc/en_US.ISO8859-1/articles/linux-users/software.html)\n\
    - [Get started with FreeBSD: A brief intro for Linux users](http://www.infoworld.com/article/2858288/unix/intro-to-freebsd-for-linux-users.html)\n\
    - [FreeBSD 10 install packages from DVD](https://forums.freebsd.org/threads/44430/#post-300633)\n\
    \n# 搜索软件\n\n如果你想搜索特定的应用程序，可以使用 `pkg search` 命令。例如：\n\n```\n# pkg search lsof\n\
    lsof-4.90.b,8                  Lists information about open files (similar to\
    \ fstat(1))\np5-Unix-Lsof-0.0.5_2           Unix::Lsof -- a wrapper to the Unix\
    \ lsof utility\n```\n\n如果你想知道软件在 ports 树中的路径，可以使用 `-o` 选项：\n\n```\n# pkg search\
    \ -o lsof\nsysutils/lsof                  Lists information about open files (similar\
    \ to fstat(1))\nsysutils/p5-Unix-Lsof          Unix::Lsof -- a wrapper to the\
    \ Unix lsof utility\n```\n\n万情况下 Ports Collection 已经安装，你可以使用 `whereis` 命令：\n\n\
    ```\n# whereis lsof\nlsof: /usr/local/sbin/lsof /usr/local/man/man8/lsof.8.gz\
    \ /usr/ports/sysutils/lsof\n```\n\n另一个技巧方法是使用 `echo` 命令：\n\n```\n# echo /usr/ports/*/*lsof*\n\
    /usr/ports/distfiles/lsof_4.90B.freebsd.tar.bz2 /usr/ports/sysutils/lsof\n```\n\
    \n引用：\n\n- [Finding Software](https://www.freebsd.org/doc/handbook/ports-finding.html)\n\
    \n# 移除软件\n\n安装应用程序后，你可以使用 `pkg delete` 删除它：\n\n[content] (注：此处原文未提供具体移除操作文本，根据指令保持格式逻辑)\n\
    \n"
- fmt: "\n`FreeBSD-STABLE` is span off from `FreeBSD-CURRENT`, and for production\
    \ version. It mainly accepts bug and security fixes.\n\nYou should notice, branches\
    \ are not points but constant streams of development. And the `FreeBSD RELEASE`\
    \ version is a point, and it is just a snapshot of `FreeBSD-STABLE` branch at\
    \ some time.\n\nReferences:\n[Tracking a Development Branch](https://www.freebsd.org/doc/handbook/current-stable.html);\n\
    [Release Engineering](http://www.over-yonder.net/~fullermd/rants/bsd4linux/05).\n\
    \n# Update Ports Collection\n\nThe stuff under `/usr/ports` is referred as Ports\
    \ Collection, and we can employ `portsnap` command to update it:\n\n(1) If it\
    \ is the first time to use `portsnap`, you should run following command:\n\n```\n\
    # portsnap fetch extract\n```\n\nOtherwise, you can encounter errors as shown\
    \ here:\n\n```\n......\n/usr/ports was not created by portsnap.\nYou must run\
    \ 'portsnap extract' before running 'portsnap update'.\n```\n\n(2) Hereafter,\
    \ you only need to execute `portsnap fetch update` to update the Ports Collection.\n\
    \nReference:\n[Using the Ports Collection](https://www.freebsd.org/doc/handbook/ports-using.html);\n\
    [A question about using portsnanp to upgrade ports tree](https://lists.freebsd.org/pipermail/freebsd-questions/2016-June/272255.html).\n\
    \n# Accept default options during installing port\n\nDuring building and installing\
    \ port, if you are tired of the prompt, and want to use all default options, you\
    \ can utilize `BATCH`:\n\n```\n# make install clean BATCH=yes \n```\n\nReference:\n\
    [How can I avoid the prompts when installing a FreeBSD port?](http://unix.stackexchange.com/questions/5257/how-can-i-avoid-the-prompts-when-installing-a-freebsd-port).\n\
    \n# Enable ls colour output\n\n`ls -G` can make `ls` output colourful. If you\
    \ use `csh`, you can add following statement in `.cshrc`:\n\n```\nalias ls   \
    \     ls -G\n```\n\nReference:\n[FreeBSD: Enable Colorized ls Output](https://www.cyberciti.biz/tips/freebsd-how-to-enable-colorized-ls-output.html).\n\
    \n# Clear Directory Structure\n\n`FreeBSD` has a clear separation between base\
    \ operating system and user-added applications, that means everything which does\
    \ not belong to the base operating system is under `/usr/local` directory, and\
    \ the `/usr/local` directory contains a directory structure that mostly mirrors\
    \ the structure found in the `/` or `/usr` directory.\n\nFor example, the application\
    \ installed from port tree or `package` command will be located in `/usr/local/bin`\
    \ or `/usr/local/sbin`, corresponding to `/bin`, `/sbin`, `/usr/bin` and `/usr/local/sbin`;\
    \ and `/etc` directory contains configuration files for the base operating system\
    \ while `/usr/local/etc` for user-added applications.\n\nReferences:\n[A Comparative\
    \ Introduction to FreeBSD for Linux Users](https://www.digitalocean.com/community/tutorials/a-comparative-introduction-to-freebsd-for-linux-users);\n\
    [Directory Structure](https://www.freebsd.org/doc/handbook/dirstructure.html);\n\
    [Ten Things I like About FreeBSD](https://bsdmag.org/download/the_begginers_guide/).\n\
    \n# Change the shell\n\nIf you were previously working on `Linux`, you may miss\
    \ `Bash`, and not accustomed to `csh` which is shipped on `FreeBSD` by default.\
    \ You can change the shell to `Bash` following the below instructions:\n\n(1)\
    \ The `Bash` must already be installed on your `FreeBSD`, and its full path should\
    \ also be included in `/etc/shells`. E.g:\n\n```\n # pkg install bash\nUpdating\
    \ FreeBSD repository catalogue...\nFreeBSD repository is up-to-date.\nAll repositories\
    \ are up-to-date.\nThe following 1 package(s) will be affected (of 0 checked):\n\
    \nNew packages to INSTALLED:\n        bash: 4.3.42_1\n......\n```\n\nThen you\
    \ will find the `Bash` path is presented in `/etc/shells` automatically:\n\n```\n\
    \ # cat /etc/shells\n# $FreeBSD: releng/10.3/etc/shells 59717 2000-04-27 21:58:46Z\
    \ ache $\n#\n# List of acceptable shells for chpass(1).\n# Ftpd will not allow\
    \ users to connect who are not using\n# one of these shells.\n\n/bin/sh\n/bin/csh\n\
    /bin/tcsh\n/usr/local/bin/bash\n/usr/local/bin/rbash\n```\n\n(2) Execute `chsh\
    \ -s /usr/local/bin/bash`:\n\n```\n# chsh -s /usr/local/bin/bash\nchsh: user information\
    \ updated\n```\n\nAfter you login again, you can find the shell is `bash` now:\n\
    \n```\n# echo $SHELL\n/usr/local/bin/bash\n```\n\nReference:\n[Shells](https://www.freebsd.org/doc/handbook/shells.html).\n\
    \n# Change the PATH variable\n\nIn `csh`, if you want to change `$PATH` environment\
    \ variable, you should modify `.cshrc` file:\n\n```\n# cat .cshrc\n......\nset\
    \ path = (/sbin /bin /usr/sbin /usr/bin /usr/games /usr/local/sbin /usr/local/bin\
    \ $HOME/bin $HOME/gocode/bin)\n......\n```\n\nFor example, you add `/usr/local/go/bin`\
    \ into `$PATH`:\n\n```\n# cat .cshrc\n......\nset path = (/sbin /bin /usr/sbin\
    \ /usr/bin /usr/games /usr/local/sbin /usr/local/bin $HOME/bin $HOME/gocode/bin\
    \ /usr/local/go/bin)\n......\n```\n\nThen executing `source .cshrc` command, you\
    \ will find the new `$PATH` takes effect:\n\n```\n# source .cshrc\n# echo $PATH\n\
    /sbin:/bin:/usr/sbin:/usr/bin:/usr/games:/usr/local/sbin:/usr/local/bin:/root/bin:/root/gocode/bin:/usr/local/go/bin\n\
    ```\n\nReference:\n[Misc Tips & Tricks](http://www.freebsdmadeeasy.com/tutorials/freebsd/freebsd-tricks.php).\n\
    \n# Colorize bash\n\n(1) In your `$HOME` directory, create `..dir_colors` file:\n"
