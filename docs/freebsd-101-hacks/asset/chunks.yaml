    # Introduction


    # FreeBSD-101-Hacks


    A collection of FreeBSD hacks.


    # Project Homepage


    [https://github.com/NanXiao/FreeBSD-101-Hacks](https://github.com/NanXiao/FreeBSD-101-Hacks)


    # Get system version


    ## Get system version


    There are `2` versions of `FreeBSD`: kernel and userland. Use `freebsd-version
    -ku` can output both versions:


    ```

    # freebsd-version -uk

    10.3-RELEASE-p4

    10.3-RELEASE-p5

    ```


    The first one is kernel version info. You can see the versions of both kernel
    and userland is `10.3`, but kernel patch level is `p4`, while userland is `p5`.
    That''s because in some cases, only the userland requires a patch whilst kernel
    not, so kernel patch level doesn''t change. If there is no option, `freebsd-version`
    prints userland version only:


    ```

    # freebsd-version

    10.3-RELEASE-p5

    ```


    `uname -r` command also outputs the kernel version:


    ```

    # uname -r

    10.3-RELEASE-p4

    ```


    Reference:


    [Why the outputs of “freebsd-version” and “freebsd-version -k” are different?](http://stackoverflow.com/questions/3780013/why-the-outputs-of-freebsd-version-and-freebsd-version-k-are-different).


    # Enable root login over SSH


    ## Enable root login over SSH


    By default, `FreeBSD` box''t allow `root` user login over `SSH`, to enable it
    you need to modify `SSH` daemon file (`/etc/ssh/sshd_config`).


    Change the following:


    ```

    PermitRootLogin no

    ```


    to:


    ```

    PermitRootLogin yes

    ```


    Then restart `SSH` daemon:


    ```

    # /etc/rc.d/sshd restart

    ```


    Reference:


    [How to enable root login over SSH on FreeBSD 8.2](http://blog.obbyallen.me/2011/07/22/how-to-enable-root-login-over-ssh-).


    # Configure proxy


    ## Configure proxy


    If your `FreeBSD` box works behind a proxy, you may need to configure proxy to
    access network.


    For `csh` or `tcsh`, set proxy in `/etc/cshrc`:


    ```

    setenv HTTP_PROXY http://web-proxy.xxxxxx:8080

    setenv HTTPS_PROXY https://web-proxy.xxxxxx:8080

    ```


    For `sh`, set proxy in `/etc/profile`:


    ```

    export HTTP_PROXY http://web-proxy.xxxxxx:8080

    export HTTPS_PROXY https://web-proxy.xxxxxx:8080

    ```


    Reference:


    [Using FreeBSD inside a controlled network – A required HTTP Proxy and FTP](http://www.rhyous.com/2012/04/13/using-freebsd-inside-a-controlled-network-a-required-http-proxy-and-ftp/).


    # Shutdown


    ## Shutdown


    Compared to some `GNU/Linux` flavors, `shutdown -h now` command just halts the
    `FreeBSD`, not turns off the power. Refer the following shot from my Virtual Machine:


    ![](b16a35c0.JPG)


    You can see, after running `shutdown -h now`, the system is just halted, and press
    any key can reboot the system. If you want to halt and power off the system, you
    should execute `shutdown -p now`.


    Reference:


    [SHUTDOWN](https://www.freebsd.org/cgi/man.cgi?shutdown(8)).


    # Reboot


    ## Reboot


    If you want to reboot `FreeBSD` immediately, you can use the following methods:


    (1) Run `reboot` command directly:


    ```

    # reboot

    ```


    (2) Utilize `shutdown` command:


    ```

    # shutdown -r now

    ```


    `-r` option stands for `reboot`.


    # Upgrade system


    ## Upgrade system


    You should make use of `freebsd-update` utility to upgrade your system non-periodically
    to keep your system safe and not stale. E.g., after installing a fresh `10.3`
    version:


    ```

    # freebsd-version -ku

    10.3-RELEASE

    10.3-RELEASE

    ```


    You should update the patches released by `FreeBSD` team:


    ```

    # freebsd-update fetch install

    ```


    When it is done, check the system version again:


    ```

    # freebsd-version -ku

    10.3-RELEASE-p4

    10.3-RELEASE-p5

    ```


    Yep! your system is refreshed now!


    References:


    [FreeBSD Man Pages](https://www.freebsd.org/cgi/man.cgi?query=freebsd-update&sektion=8);


    [What are the first commands I run after installing FreeBSD? Or How to patch FreeBSD?
    Or How to install ports on FreeBSD?](http://www.rhyous.com/2009/11/03/what-are-the-first-commands-i-run-after-installing-freebsd/).


    # Upgrade to new release


    ## Upgrade to new release


    This article takes upgrading system from `10.2-RELEASE` to `10.3-RELEASE` as an
    example, but you must notice this tutorial may not apply to other versions. So
    please read the related release notes.


    (1) Check current version:


    ```

    # freebsd-version -ku

    10.2-RELEASE

    10.2-RELEASE

    ```


    (2) Run `freebsd-update upgrade` command to upgrade current system to a new version:


    ```

    # freebsd-update upgrade -r 10.3-RELEASE

    ......

    To install the downloaded upgrades, run `/usr/sbin/freebsd-update install`.

    ```


    (3) The last log of `freebsd-update upgrade -r 10.3-RELEASE` prompts executing
    `freebsd-update install`:


    ```

    # freebsd-update install

    src component not installed, skipped

    Installing updates...

    Kernel updates have been installed.  Please reboot and run

    "/usr/sbin/freebsd-update install" again to finish installing updates.

    ```


    (4) Reboot the system and execute `freebsd-update install` again:


    ```

    # reboot

    # freebsd-update install

    src component not installed, skipped

    Installing updates... done.

    ```


    (5) Now check the version:


    ```

    # freebsd-version -ku

    10.3-RELEASE-p4

    10.3-RELEASE-p5

    ```


    The system has been upgraded to `10.3-RELEASE` now.


