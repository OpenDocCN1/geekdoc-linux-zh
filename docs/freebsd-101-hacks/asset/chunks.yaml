- fmt: "\nIf you don't have any specific requirements for needed software, you can\
    \ use `pkg` utility to install the pre-built package on `FreeBSD`, and it looks\
    \ like using `yum` or `apt-get` on `GNU/Linux` boxes. E.g., install `python` on\
    \ your host:\n\n```\n# pkg install python \n......\n```\n\nNote that some standard\
    \ Python modules are provided as separate ports\nas they require additional dependencies.\
    \ They are available as:\n\nbsddb           databases/py-bsddb\ngdbm         \
    \   databases/py-gdbm\nsqlite3         databases/py-sqlite3\ntkinter         x11-toolkits/py-tkinter\n\
    \nNow you can run `python` now:\n\n```\n# python\nPython 2.7.11 (default, Jun\
    \  5 2016, 01:23:11)\n[GCC 4.2.1 Compatible FreeBSD Clang 3.4.1 (tags/RELEASE_34/dot1-final\
    \ 208032)] on freebsd10\nType \"help\", \"copyright\", \"credits\" or \"license\"\
    \ for more information.\n>>>\n```\n\nBut the end logs of installing `python` prompts\
    \ we still need to install other `4` packages: `py-bsddb`, `py-gdbm`, `py-sqlite3`\
    \ and `py-tkinter`, otherwise `import sqlite3` will complain:\n\n```\n>>> import\
    \ sqlite3\nTraceback (most recent call last):\n  File \"<stdin>\", line 1, in\
    \ <module>\n  File \"/usr/local/lib/python2.7/sqlite3/__init__.py\", line 24,\
    \ in <module>\n    from dbapi2 import *\n  File \"/usr/local/lib/python2.7/sqlite3/dbapi2.py\"\
    , line 28, in <module>\n    from _sqlite3 import *\nImportError: No module named\
    \ _sqlite3\n```\n\nThis introduces another installation method: using ports. This\
    \ method will download, compile and install from source code, and the benefit\
    \ of this approach is you can do some customizations if you want. You can find\
    \ all ports under `/usr/ports` directory. Now you begin to install `py-bsddb`\
    \ (follow this method to set up `py-gdbm`, `py-sqlite3` and `py-tkinter`):\n\n\
    ```\n# cd /usr/ports/databases/py-bsddb\n# make install clean\n```\n\nAfter all\
    \ are installed, we can use `sqlite` in `python` now:\n\n```\n# python\nPython\
    \ 2.7.11 (default, Jun  5 2016, 01:23:11)\n[GCC 4.2.1 Compatible FreeBSD Clang\
    \ 3.4.1 (tags/RELEASE_34/dot1-final 208032)] on freebsd10\nType \"help\", \"copyright\"\
    , \"credits\" or \"license\" for more information.\n>>> import sqlite3\n```\n\n\
    The other method is installing from `DVD`:\n\n(1) Put `DVD` in the drive;\n\n\
    (2) Mount `DVD`:\n\n```\nmkdir -p /dist\nmount -t cd9660 /dev/cd0 /dist\n```\n\
    \n(3) Install the package (E.g., `xorg`):\n\n```\nenv REPOS_DIR=/dist/packages/repos\
    \ pkg install xorg\n```\n\nReferences:\n\n- [Packages and Ports: Adding Software\
    \ in FreeBSD](https://www.freebsd.org/doc/en_US.ISO8859-1/articles/linux-users/software.html)\n\
    - [Get started with FreeBSD: A brief intro for Linux users](http://www.infoworld.com/article/2858288/unix/intro-to-freebsd-for-linux-users.html)\n\
    - [FreeBSD 10 install packages from DVD](https://forums.freebsd.org/threads/44430/#post-300633)\n\
    \n# Search software\n\nIf you want to search a specified application, you can\
    \ use `pkg search` command. For example:\n\n```\n# pkg search lsof\nlsof-4.90.b,8\
    \                  Lists information about open files (similar to fstat(1))\n\
    p5-Unix-Lsof-0.0.5_2           Unix::Lsof -- a wrapper to the Unix lsof utility\n\
    ```\n\nIf you want to know the software's path in the ports tree, you can use\
    \ `-o` option:\n\n```\n# pkg search -o lsof\nsysutils/lsof                  Lists\
    \ information about open files (similar to fstat(1))\nsysutils/p5-Unix-Lsof  \
    \        Unix::Lsof -- a wrapper to the Unix lsof utility\n```\n\nIn case the\
    \ Ports Collection is already installed, you can employ `whereis` command:\n\n\
    ```\n# whereis lsof\nlsof: /usr/local/sbin/lsof /usr/local/man/man8/lsof.8.gz\
    \ /usr/ports/sysutils/lsof\n```\n\nAnother tricky method is using `echo` command:\n\
    \n```\n# echo /usr/ports/*/*lsof*\n/usr/ports/distfiles/lsof_4.90B.freebsd.tar.bz2\
    \ /usr/ports/sysutils/lsof\n```\n\nReference:\n\n- [Finding Software](https://www.freebsd.org/doc/handbook/ports-finding.html)\n\
    \n# Remove software\n\nAfter installing application, you can use `pkg delete`\
    \ command to remove it:\n\n```\n# pkg delete lsof\nChecking integrity... done\
    \ (0 conflicting)\nDeinstallation has been requested for the following packages\
    \ (of 0 packages in universe):\n\nInstalled packages to be REMVED:\n        lsof-1.0\
    \ \n\nProceed with deinstalling packages? [y/N]: y\n[1/1] Deinstalling lsof-1.0\n\
    ```\n\nYou can also enter the port directory, and execute `make deinstall` instruction:\n\
    \n```\n# pwd\n/usr/ports/sysutils/lsof\n# make deinstall\n===> Deinstalling for\
    \ lsof\n===>   Deinstalling lsof-1.0\nUpdating database digests: 100%\nChecking\
    \ integrity... done (0 conflicting)\nDeinstallation has been requested for the\
    \ following packages (of 0 packages in universe):\n\nInstalled packages to be\
    \ REMVED:\n        lsof-1.0\n[1/1] Deleting files for lsof-1.0\n100%\n```\n\n\
    Reference:\n\n- [Using Ports Collection](https://www.freebsd.org/doc/handbook/ports.html)\n\
    \n# Install source code\n\nDownload `FreeBSD` source code, architecture, version:\n\
    \n```\nfetch ftp://ftp.freebsd.org/pub/releases/$(uname -s)/$(uname -m)/$(uname\
    \ -r | cut -d'-' -f1,2)/src.txz\ntar -C /xvzf src.txz\n```\n\nMake sure `src`\
    \ is included in `Components` line in `/etc/freebsd-update.conf`, so when using\
    \ `freebsd-update` to update system, also the source code is refreshed.\n\n```\n\
    # cat /etc/freebsd-update.conf\n......\n# Components of base system which should\
    \ be kept updated.\nsrc kernel\n```\n\nReferences:\n\n- [A question about downloading\
    \ FreeBSD kernel](https://lists.freebsd.org/pipermail/freebsd-questions/2016-July/272497.html)\n\
    - [Install FreeBSD kernel after installed freebsd](https://www.netroby.com/view/3595)\n\
    \n# Build kernel\n\nIf you want to build a custom kernel yourself, you need to\
    \ install the source code firstly. Then enter the configuration directory of your\
    \ machine:\n\n```\n# cd /usr/src/sys/$(uname -m)/conf\n```\n\nCopy a new kernel\
    \ configuration file:\n\n```\n# cp GENERIC NAN_FIRST_BUILD\n```\n\nYou can modify\
    \ the new configuration file `NAN_FIRST_BUILD` according to your needs.\n\nBuild\
    \ the kernel:\n\n```\n# cd /usr/src\n# make buildkernel KERNCONF=\"NAN_FIRST_BUILD\"\
    \n```\n\nOnce it is finished, install the fresh kernel binary and reboot:\n\n\
    ```\n# make installkernel KERNCONF=\"NAN_FIRST_BUILD\"\n# reboot\n```\n\nCheck\
    \ the kernel version, you will find now the OS is harnessing your newly built\
    \ kernel:\n\n```\n# uname -a\nFreeBSD FreeBSD 10.3-RELEASE-p5 FreeBSD 10.3-RELEASE-p5\
    \ #0: Tue Jul 19 17:52:57 CST 2016     root@FreeBSD:/usr/obj/usr/src/sys/NAN_FIRST_BUILD\
    \  amd64\n```\n\nReference:\n\n- [How to build a custom kernel in FreeBSD](https://www.youtube.com/watch?v=KVNxaKu1F0)\n\
    \n# Backup old kernel\n\nEvery time, when a new kernel is installed, the last\
    \ installed kernel will be backed up in a directory who called `kernel.old`. So\
    \ it is important to remember to save a copy of usable kernel in case the newly-built\
    \ kernel can't work. For example:\n\n```\n# mv /boot/kernel.old /boot/kernel.good\
    \    \n# mv /boot/kernel /boot/kernel.bad\n# mv /boot/kernel.good /boot/kernel\n\
    ```\n\nDuring boot, you can press `5` to select which kernel to run:\n\n![](a07bda0c.JPG)\
    \ ![](633d263d.JPG)\n\nReferences:\n\n- [FreeBSD: reverting to previous kernel](http://www.linuxquestions.org/questions/bsd-17/freebsd-reverting-to-previous-kernel-4175429007/)\n\
    - [If Something Goes Wrong](https://www.freebsd.org/doc/en_US.ISO8859-1/books/handbook/kernelconfig-trouble.html)\n\
    \n# CURRENT VS STABLE\n\n`FreeBSD` has two development branches: `FreeBSD-CURRENT`\
    \ and `FreeBSD-STABLE`.\n\n`FreeBSD-CURRENT` is the active development branch\
    \ of `FreeBSD`, and all new development work, such as adding new feature, will\
    \ occur in `FreeBSD-CURRENT` branch firstly.\n"
