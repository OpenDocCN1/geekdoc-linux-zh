  \n## 使用 Subversion 的注意事项\n\n## 使用 Subversion 的注意事项\n\n如果您想使用 `Subversion`（例如更新 ports\
  \ 树），您应该注意以下问题：\n\n(1) 如果您的服务器运行在代理之后，您应该修改您的 `Subversion` 配置文件：\n\n```bash\n###\
  \ cat ~/.subversion/servers\n[global]\nhttp-proxy-host = web-proxy.xxxx.com\nhttp-proxy-port\
  \ = 8080\nhttp-compression = no\n```\n\n否则，您可能会遇到以下错误：\n\n```bash\n### svn checkout\
  \ https://svn.FreeBSD.org/ports/head /usr/ports\nError validating server certificate\
  \ for 'https://svn.freebsd.org:443':\n - 证书不是由信任的机构颁发的。请使用\n   指纹手动验证证书！\n - 证书主机名不匹配。\n\
  证书信息：\n - Hostname: FG3K6C3A15800021\n - Valid: from Mar 21 09:15:26 2015 GMT until\
  \ Mar 21 09:15:26 2025 GMT\n - Issuer: FG3K6C3A15800021, Fortinet Ltd.\n - Fingerprint:\
  \ 1D:F4:21:20:2F:06:41:45:3F:7A:18:FB:79:F3:BB:30:36:32:22:A3\n(R)eject，临时接受 (t)\
  \ 还是永久接受 (p)? p\nsvn: E170013: Unable to connect to a repository at URL 'https://svn.freebsd.org/ports/head'\n\
  svn: E000054: Error running context: Connection reset by peer\n```\n\n或：\n\n```bash\n\
  ### svn checkout https://svn.FreeBSD.org/ports/head /usr/ports\n......\nsvn: E175002:\
  \ REPORT request on '/ports/!svn/me' failed\n```\n\n(2) 如果您在执行 `svn` 命令时遇到类似下面的错误：\n\
  \n```bash\nsvn: E200030: SQLite compiled for 3.11.1, but running with 3.9.2\n```\n\
  \n您应该更新您的 `SQLite`：\n\n```bash\n### pkg upgrade sqlite3\n```\n\n参考文献：\n\n[在受控网络中使用\
  \ FreeBSD – 必须的 HTTP 代理且无 FTP](http://www.rhyous.com/2012/04/13/using-freebsd-inside-a-controlled-network-a-required-http-proxy-and-no-ftp/)；\n\
  \n[如何为 svn 配置 HTTP 代理](http://stackoverflow.com/questions/1491180/how-to-configure-a-http-proxy-for-svn).\n\
  \n## 输出 PCI 设备信息\n\n## 输出 PCI 设备信息\n\n`FreeBSD` 提供了 `pciconf` 命令，可以列出 `PCI` 设备信息：\n\
  \n```bash\n### pciconf -lv\nhostb0@pci0:0:0:0:  class=0x060000 card=0x197615ad chip=0x71908086\
  \ rev=0x01 hdr=0x00\nvendor = 'Intel Corporation'\ndevice = '440BX/ZX/DX - 82443BX/ZX/DX\
  \ Host bridge'\nclass  = bridge\nsubclass   = HOST-PCI\npcib1@pci0:0:1:0:   class=0x060400\
  \ card=0x00000000 chip=0x71918086 rev=0x01 hdr=0x01\nvendor = 'Intel Corporation'\n\
  device = '440BX/ZX/DX - 82443BX/ZX/DX AGP bridge'\nclass  = bridge\nsubclass   =\
  \ PCI-PCI\nisab0@pci0:0:7:0:   class=0x060100 card=0x197615ad chip=0x71108086 rev=0x08\
  \ hdr=0x00\nvendor = 'Intel Corporation'\ndevice = '82371AB/EB/MB PIIX4 ISA'\nclass\
  \  = bridge\nsubclass   = PCI-ISA\n......\n```\n\n如果您习惯了 `GNU/Linux` 自带的 `lspci`，您可以自行安装：\n\
  \n```bash\n### pkg install pciutils\n```\n\n"
