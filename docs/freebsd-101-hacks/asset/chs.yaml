- "# FreeBSD 101 技巧指南\n\n\n\n![](img/cover_image.jpg)\n\n\n# 介绍\n\n# FreeBSD-101-技巧\n\
  \n一个 FreeBSD 技巧集。\n\n## 项目主页\n\n[`github.com/NanXiao/FreeBSD-101-Hacks`](https://github.com/NanXiao/FreeBSD-101-Hacks)\n\
  \n## 获取系统版本\n\n## 获取系统版本\n\n`FreeBSD` 有 `2` 个版本：内核（kernel）和用户态空间（userland）。使用 `freebsd-version\
  \ -ku` 可以同时输出这两个版本：\n\n```\n### freebsd-version -uk\n10.3-RELEASE-p4\n10.3-RELEASE-p5\n\
  ```\n\n第一个是内核版本信息。你可以看到内核和用户态的版本都是 `10.3`，但内核补丁级别是 `p4`，而用户态是 `p5`。这是因为在某些情况下，只有用户态需要补丁而内核不需要，因此内核补丁级别不会改变。如果没有使用该选项，`freebsd-version`\
  \ 仅打印用户态版本：\n\n```\n### freebsd-version\n10.3-RELEASE-p5\n```\n\n`uname -r` 命令也会输出内核版本：\n\
  \n```\n### uname -r\n10.3-RELEASE-p4\n```\n\n参考自：\n\n[为什么“freebsd-version”和“freebsd-version\
  \ -k”的输出不同？](http://stackoverflow.com/questions/3780013/why-the-outputs-of-freebsd-version-and-freebsd-version-k-are-different)。\n\
  \n## 通过 SSH 启用 root 登录\n\n## 通过 SSH 启用 root 登录\n\n默认情况下，`FreeBSD` 不允许 `root` 用户通过\
  \ `SSH` 登录，要启用它，你需要修改 `SSH` 守护进程文件（`/etc/sshd_config`）：\n\n找到以下项：\n\n```\nPermitRootLogin\
  \ no\n```\n\n修改为：\n\n```\nPermitRootLogin yes\n```\n\n重启服务：\n\n```bash\nservice\
  \ sshd restart\n```\n\n参考自：\n\n[在 FreeBSD 上启用 root 登录](https://allen.me/2011/07/22/how-to-enable-root-login-free)\n\
  \n## 配置代理\n\n## 配置代理\n\n如果 `FreeBSD` 位于代理之后，可能需要配置代理。\n\n对于 `csh` 或 `tcsh`，在 `/etc/cshrc`\
  \ 中设置：\n\n```csh\nsetenv http_proxy http://proxy:port\n```\n\n对于 `sh`，在 `/etc/profile`\
  \ 中设置：\n\n```sh\nexport http_proxy=http://proxy:port\n```\n\n参考自：\n\n[在 FreeBSD\
  \ 中使用 Subversion](https://www.rhyous.com/2012/04/13/using-subversion-freebs)\n\n\
  ## 关机\n\n## 关机\n\n与某些 `Linux` 发行版相比，`shutdown` 命令现在会停止 `FreeBSD`：\n\n```bash\n###\
  \ shutdown -h now\n```\n\n参考自：\n\n[FreeBSD 手页](https://www.freebsd.org/cgi/man.cgi)\n\
  \n## 重启\n\n## 重启\n\n如果你想立即重启 `FreeBSD`，可以使用以下方法：\n\n(1) 直接运行 `reboot` 命令：\n\n```bash\n\
  ### reboot\n```\n\n(2) 使用 `shutdown` 命令：\n\n```bash\n### shutdown -r\n```\n\n`-r`\
  \ 代表重启。\n\n## 升级系统\n\n## 升级系统\n\n你应该定期使用 `freebsd-update` 工具来保持系统安全不不过时。例如，更新 `10.3`\
  \ 版本：\n\n```bash\n### freebsd-update -r 10.3\n```\n\n安装补丁后，检查系统版本：\n\n```bash\n\
  ### freebsd-version -ku\n10.3-RELEASE-p4\n10.3-RELEASE-p5\n```\n\n你应该更新 `FreeBSD`\
  \ 团队发布的补丁：\n\n```bash\n### freebsd-update fetch\n```\n\n安装完成后，再次检查系统：\n\n```bash\n\
  ### freebsd-version -ku\n10.3-RELEASE-p4\n10.3-RELEASE-p5\n```\n\n好了！你的系统已刷新！\n\n\
  参考自：\n\n[FreeBSD)\n\n## 升级到新版本\n\n## 升级到新版本\n\n本文以从 `10.2-RELEASE` 升级到 `10.3-RELEASE`\
  \ 为例，但你必须注意此教程可能不适用于其他版本。因此请阅读相关的发行说明。\n\n(1) 检查当前版本：\n\n```bash\n### freebsd-version\
  \ -ku\n10.2-RELEASE\n10.2-RELEASE\n```\n\n(2) 运行 `freebsd-update upgrade` 命令将系统升级到新版本：\n\
  \n```bash\n# freebsd-update upgrade -r 10.3-RELEASE\n......\n要安装下载的升级，请运行 \"/usr/sbin/freebsd-update\
  \ install\"。\n```\n\n(3) `freebsd-update upgrade -r 10.3-RELEASE` 的最后日志提示执行 `freebsd-update\
  \ install`：\n\n```\n# freebsd-update install\nsrc component not installed, skipped\n\
  Installing updates...\n内核更新已安装。请重启并再次运行\n\"/usr/sbin/freebsd-update install\" 以完成更新安装。\n\
  ```\n\n(4) 重启系统并再次执行 `freebsd-update install`：\n\n```bash\n### reboot\n# freebsd-update\
  \ install\nsrc component not installed, skipped\nInstalling updates... done.\n```\n\
  \n(5) 现在检查版本：\n\n```bash\n### freebsd-version -ku\n10.3-RELEASE-p4\n10.3-RELEASE-p5\n\
  ```\n\n你的系统现在已升级到 `10.3-RELEASE`。\n\n## 安装软件\n\n## 安装软件\n\n\n\n\n\n如果你对需要的软件没有特定要求，可以使用\
  \ `pkg` 工具在 `FreeBSD` 上安装预编译的包，这看起来就像在 `GNU/Linux` 离盒上使用 `yum` 或 `apt-get` 一样。例如，在你的主机上安装\
  \ `python`：\n\n```\n# pkg install python \n......\n```\n\n请注意，某些标准 Python 模块作为独立的\
  \ ports 提供的，因为它们需要额外的依赖项。它们可以通过以下方式获取：\n\nbsddb           databases/py-bsddb\ngdbm\
  \            databases/py-gdbm\nsqlite3         databases/py-sqlite3\ntkinter  \
  \       x11-toolkits/py-tkinter\n\n现在你可以运行 `python` 了：\n\n```\n### python\nPython\
  \ 2.7.11 (default, Jun  5 2016, 01:23:11)\n[GCC 4.2.1 Compatible FreeBSD Clang 3.4.1\
  \ (tags/RELEASE_34/dot1-final 208032)] on freebsd10\nType \"help\", \"copyright\"\
  , \"credits\" or \"license\" for more information.\n>>>\n```\n\n但安装 `python` 最后的日志提示我们还需要安装其他\
  \ `4` 个包：`py-bsddb`、`py-gdbm`、`py-sqlite3` 和 `py-tkinter`，否则 `import sqlite3` 将报错：\n\
  \n```\n>>> import sqlite3\nTraceback (most recent call last):\n  File \"<stdin>\"\
  , line 1, in <module>\n  File \"/usr/local/lib/python2.7/sqlite3/__init__.py\",\
  \ line 24, in <module>\n    from dbapi2 import *\n  File \"/usr/local/lib/python2.7/sqlite3/dbapi2.py\"\
  , line 28, in <module>\n    from _sqlite3 import *\nImportError: No module named\
  \ _sqlite3\n```\n\n引入了另一种安装方法：使用 ports。这种方法将从源代码下载、编译并安装，这种方法的优点是如果你需要，可以进行一些自定义。你可以在\
  \ `/usr/ports` 目录下找到所有的 ports。现在你开始安装 `py-bsddb`（按照此方法设置 `py-gdbm`、`py-sqlite3`\
  \ 和 `py-tkinter`）：\n\n```\n### cd /usr/ports/databases/py-bsddb\n### make install\
  \ clean\n```\n\n在全部安装完成后，我们现在可以在 `python` 中使用 `sqlite` 了：\n\n```\n### python\nPython\
  \ 2.7.11 (default, Jun  5 2016, 01:23:11)\n[GCC 4.2.1 Compatible FreeBSD Clang 3.4.1\
  \ (tags/RELEASE_34/dot1-final 208032)] on freebsd10\nType \"help\", \"copyright\"\
  , \"credits\" or \"license\" for more information.\n>>> import sqlite3\n```\n\n\
  另一种方法是从 `DVD` 安装：\n\n(1) 将 `DVD` 放入驱动器；\n\n(2) 挂载 `DVD`：\n\n```\nmkdir -p /dist\n\
  mount -t cd9660 /dev/cd0 /dist\n```\n\n(3) 安装包（例如 `xorg`）：\n\n```\nenv REPOS_DIR=/dist/packages/repos\
  \ pkg install xorg\n```\n\n引用：\n\n- [Packages and Ports: Adding Software in FreeBSD](https://www.freebsd.org/doc/en_US.ISO8859-1/articles/linux-users/software.html)\n\
  - [Get started with FreeBSD: A brief intro for Linux users](http://www.infoworld.com/article/2858288/unix/intro-to-freebsd-for-linux-users.html)\n\
  - [FreeBSD 10 install packages from DVD](https://forums.freebsd.org/threads/44430/#post-300633)\n\
  \n## 搜索软件\n\n如果你想搜索特定的应用程序，可以使用 `pkg search` 命令。例如：\n\n```\n### pkg search lsof\n\
  lsof-4.90.b,8                  Lists information about open files (similar to fstat(1))\n\
  p5-Unix-Lsof-0.0.5_2           Unix::Lsof -- a wrapper to the Unix lsof utility\n\
  ```\n\n如果你想知道软件在 ports 树中的路径，可以使用 `-o` 选项：\n\n```\n### pkg search -o lsof\nsysutils/lsof\
  \                  Lists information about open files (similar to fstat(1))\nsysutils/p5-Unix-Lsof\
  \          Unix::Lsof -- a wrapper to the Unix lsof utility\n```\n\n万情况下 Ports Collection\
  \ 已经安装，你可以使用 `whereis` 命令：\n\n```\n### whereis lsof\nlsof: /usr/local/sbin/lsof\
  \ /usr/local/man/man8/lsof.8.gz /usr/ports/sysutils/lsof\n```\n\n另一个技巧方法是使用 `echo`\
  \ 命令：\n\n```\n### echo /usr/ports/*/*lsof*\n/usr/ports/distfiles/lsof_4.90B.freebsd.tar.bz2\
  \ /usr/ports/sysutils/lsof\n```\n\n引用：\n\n- [Finding Software](https://www.freebsd.org/doc/handbook/ports-finding.html)\n\
  \n## 移除软件\n\n安装应用程序后，你可以使用 `pkg delete` 删除它：\n\n[content] (注：此处原文未提供具体移除操作文本，根据指令保持格式逻辑)\n\
  \n\n\n\n\n`FreeBSD-STABLE` 独立于 `FreeBSD-CURRENT`，适用于生产版本。它主要接受错误修复和安全更新。\n\n你应该注意到，分支不是一个点，而是持续的开发流。而\
  \ `FreeBSD RELEASE` 版本是一个点，它只是 `FreeBSD-STABLE` 分支在某个时刻的快照。\n\n引用：\n[跟踪开发分支](https://www.freebsd.org/doc/handbook/current-stable.html);\n\
  [发布工程](http://www.over-yonder.net/~fullermd/rants/bsd4linux/05).\n\n## 更新 Ports\
  \ 集合\n\n位于 `/usr/ports` 下的内容被称为 Ports 集合（Ports Collection），我们可以使用 `portsnap` 命令来更新它：\n\
  \n(1) 如果是第一次使用 `portsnap`，你应该运行以下命令：\n\n```\n### portsnap fetch extract\n```\n\n\
  否则，你可能会遇到如下所示的错误：\n\n```\n......\n/usr/ports was not created by portsnap.\nYou must\
  \ run 'portsnap extract' before running 'portsnap update'.\n```\n\n(2) 此后，你只需要执行\
  \ `portsnap fetch update` 即可更新 Ports 集合。\n\n引用：\n[使用 Ports 集合](https://www.freebsd.org/doc/handbook/ports-using.html);\n\
  [关于使用 portsnanp 升级源码树的问题](https://lists.freebsd.org/pipermail/freebsd-questions/2016-June/272255.html).\n\
  \n## 安装 port 时接受默认选项\n\n在编译和安装 port 过程中，如果你厌倦了提示并想使用所有默认选项，可以利用 `BATCH`：\n\n```\n\
  ### make install clean BATCH=yes \n```\n\n引用：\n[如何在安装 FreeBSD port 时避免提示？](http://unix.stackexchange.com/questions/5257/how-can-i-avoid-the-prompts-when-installing-a-freebsd-port).\n\
  \n## 启用 ls 彩色输出\n\n`ls -G` 可以让 `ls` 输出彩色。如果你使用 `csh`，可以在 `.cshrc` 中添加以下语句：\n\n```\n\
  alias ls        ls -G\n```\n\n引用：\n[FreeBSD: 启用彩色 ls 输出](https://www.cyberciti.biz/tips/freebsd-how-to-enable-colorized-ls-output.html).\n\
  \n## 清晰的目录结构\n\n`FreeBSD` 在基础操作系统和用户添加的应用程序之间有清晰的分，这意味着所有不属于基础系统的内容都在 `/usr/local`\
  \ 目录下，而 `/usr/local` 目录的结构在很大程度上镜像了 `/` 或 `/usr` 目录中的结构。\n\n例如，从源码树或通过 `package`\
  \ 命令安装的应用将位于 `/usr/local/bin` 或 `/usr/local/sbin`，对应于 `/bin``/sbin`/`/usr/bin` 和\
  \ `/usr/local/sbin`；`/etc` 目录包含基础系统的配置文件，而 `/usr/local/etc` 则用于用户添加的应用程序。\n\n引用：\n\
  [给 Linux 用户的 FreeBSD 对比介绍](https://www.digitalocean.com/community/tutorials/a-comparative-introduction-to-freebsd-for-linux-users);\n\
  [目录结构](https://www.freebsd.org/doc/handbook/dirstructure.html);\n[我喜欢 FreeBSD 的十件事](https://bsdmag.org/download/the_begginers_guide/).\n\
  \n## 修改 shell\n\n如果你之前在 `Linux` 上工作，你可能会怀念 `Bash`，并且不习惯 `FreeBSD` 默认提供的 `csh`。你可以按照以下指令将\
  \ shell 改为 `Bash`：\n\n(1) `Bash` 必须已经安装在你的 `FreeBSD` 上，并且其完整路径也应包含在 `/etc/shells`\
  \ 中。例如：\n\n```\n # pkg install bash\nUpdating FreeBSD repository catalogue...\n\
  FreeBSD repository is up-to-date.\nAll repositories are up-to-date.\nThe following\
  \ 1 package(s) will be affected (of 0 checked):\n\nNew packages to INSTALLED:\n\
  \        bash: 4.3.42_1\n......\n```\n\n你会发现 `Bash` 路径自动显示在 `/etc/shells` 中：\n\n\
  ```\n # cat /etc/shells\n# $FreeBSD: releng/10.3/etc/shells 59717 2000-04-27 21:58:46Z\
  \ ache $\n#\n# List of acceptable shells for chpass(1).\n# Ftpd will not allow users\
  \ to connect who are not using\n# one of these shells.\n\n/bin/sh\n/bin/csh\n/bin/tcsh\n\
  /usr/local/bin/bash\n/usr/local/bin/rbash\n```\n\n(2) 执行 `chsh -s /usr/local/bin/bash`：\n\
  \n```\n### chsh -s /usr/local/bin/bash\nchsh: user information updated\n```\n\n\
  重新登录后，你会发现 shell 现在是 `bash` 了：\n\n```\n### echo $SHELL\n/usr/local/bin/bash\n```\n\
  \n引用：\n[Shells](https://www.freebsd.org/doc/handbook/shells.html).\n\n## 修改 PATH\
  \ 变量\n\n在 `csh` 中，如果你想更改 `$PATH` 环境变量，你应该修改 `.cshrc` 文件：\n\n```\n### cat .cshrc\n\
  ......\nset path = (/sbin /bin /usr/sbin /usr/bin /usr/games /usr/local/sbin /usr/local/bin\
  \ $HOME/bin $HOME/gocode/bin)\n......\n```\n\n例如，将 `/usr/local/go/bin` 添加到 `$PATH`\
  \ 中：\n\n```\n### cat .cshrc\n......\nset path = (/sbin /bin /usr/sbin /usr/bin /usr/games\
  \ /usr/local/sbin /usr/local/bin $HOME/bin $HOME/gocode/bin /usr/local/go/bin)\n\
  ......\n```\n\n然后执行 `source .cshrc` 命令，你会发现新的 `$PATH` 生效了：\n\n```\n### source .cshrc\n\
  ### echo $PATH\n/sbin:/bin:/usr/sbin:/usr/bin:/usr/games:/usr/local/sbin:/usr/local/bin:/root/bin:/root/gocode/bin:/usr/local/go/bin\n\
  ```\n\n引用：\n[杂项与技巧](http://www.freebsdmadeeasy.com/tutorials/freebsd/freebsd-tricks.php).\n\
  \n## 为 bash 着色\n\n(1) 在你的 `$HOME` 目录下创建 `..dir_colors` 文件：\n\n\n\n\n\n# 下面每种可着色的终端类型都应有一个对应的\
  \ TERM 条目\n\n```\nTERM ansi\nTERM color-xterm\nTERM con132x25\nTERM con132x30\n\
  TERM con132x43\nTERM con132x60\nTERM con80x25\nTERM con80x28\nTERM con80x30\nTERM\
  \ con80x43\nTERM con80x50\nTERM con80x60\nTERM cons25\nTERM console\nTERM cygwin\n\
  TERM dtterm\nTERM Eterm\nTERM gnome\nTERM konsole\nTERM kterm\nTERM linux\nTERM\
  \ linux-c\nTERM mach-color\nTERM putty\nTERM rxvt\nTERM rxvt-cygwin\nTERM rxvt-cygwin-native\n\
  TERM rxvt-unicode\nTERM screen\nTERM screen-bce\nTERM screen-w\nTERM screen.linux\n\
  TERM vt100\nTERM xterm\nTERM xterm-256color\nTERM xterm-color\nTERM xterm-debian\n\
  ```\n\n# 下面是基础文件类型的颜色初始化字符串。颜色初始化\n# 字符串由一个或多个以下数字代码组成：\n# 属性代码：\n# `00=none` `01=bold`\
  \ `04=underscore` `05=blink` `07=reverse` `08=concealed`\n# 文字颜色代码：\n# `30=black`\
  \ `31=red` `32=green` `33=yellow` `34=blue` `35=magenta` `36=cyan` `37=white`\n\
  # 背景颜色代码：\n# `40=black` `41=red` `42=green` `43=yellow` `44=blue` `45=magenta` `46=cyan`\
  \ `47=white`\n\nNORMAL 00           # 全局默认，尽管所有内容都应该是某种状态\nFILE 00             #\
  \ 普通文件\nDIR 01;34           # 目录\nLINK 01;36          # 符号链接。（如果你将此设置为 'target'\
  \ 而不是\n                    # 数值，则颜色将匹配所指向的文件）\nFIFO 40;33          # 管道\nSOCK 01;35\
  \          # 套接字\nDOOR 01;35          # 门\nBLK 40;33;01        # 块设备驱动\nCHR 40;33;01\
  \        # 字符设备驱动\nORPHAN 01;05;37;41  # 孤立符号链接\nMISSING 01;05;37;41 # ... 以及它们指向的文件\n\
  \n# 这用于具有执行权限的文件：\nEXEC 01;32\n\n# 在下方列出任何希望 ls 着色的文件扩展名，如 '.gz' 或 '.tar'。\n# 放入扩展名、一个空格和颜色初始化字符串。\n\
  # （以及任何你想在 '# ' 之后添加的注释）\n\n.cmd 01;32 # 可执行文件（亮绿色）\n.exe 01;32\n.com 01;32\n.btm\
  \ 01;32\n.bat 01;32\n.sh  01;32\n.csh 01;32\n\n.tar 01;31 # 归档/压缩（亮红色）\n.tgz 01;31\n\
  .arj 01;31\n.taz 01;31\n.lzh 01;31\n.zip 01;31\n.z   01;31\n.Z   01;31\n.gz  01;31\n\
  .bz2 01;31\n.bz  01;31\n.tbz2 01;31\n.tz  01;31\n.deb 01;31\n.rpm 01;31\n.rar 01;31\
  \        # app-arch/rar\n.ace 01;31        # app-arch/unace\n.zoo 01;31        #\
  \ app-arch/zoo\n.cpio 01;31       # app-arch/cpio\n.7z  01;31        # app-arch/p7zip\n\
  .rz  01;31        # app-arch/rzip\n\n.jpg 01;35 # 图像格式\n.jpeg 01;35\n.gif 01;35\n\
  .bmp 01;35\n.ppm 01;35\n.tga 01;35\n.xbm 01;35\n.xpm 01;35\n.tif 01;35\n.tiff 01;35\n\
  .png 01;35\n.mng 01;35\n.xcf 01;35\n.pcx 01;35\n.mpg 01;35\n.mpeg 01;35\n.m2v 01;35\
  \  # 仅 MPEG-2 视频\n.avi 01;35\n.mkv 01;35  # Matroska (http://matroska.org/)\n.ogm\
  \ 01;35  # Ogg 文件\n.mp4 01;35  # MPEG-4 的“官方”容器\n.m4v 01;35  # 仅 MPEG-4 视频\n.mov\
  \ 01;35  # QuickTime \n.flv 01;35  # Adobe Flash 视频\n.wmv 01;35  # Windows Media\
  \ Video\n.3gp 01;35   # 3 视频\n\n\n\n\n\n```\n### swapinfo -m\nDevice          1M-blocks\
  \     Used    Avail Capacity\n/dev/da0p3           1023        0     1023     0%\n\
  ```\n\n引用：\n\n[PSTAT](https://www.freebsd.org/cgi/man.cgi?query=swapinfo&sektion=8)。\n\
