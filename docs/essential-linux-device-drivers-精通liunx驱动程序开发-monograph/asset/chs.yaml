  \ 子系统实现了 SPI 闪存芯片的驱动。一个示例是 `drivers/mtd/devices/mtd_dataflash.c`，它是访问 Atmel DataFlash\
  \ SPI 芯片的驱动。\n\n`drivers/w1/` 目录包含了内核对 `w1` 协议的支持。`w1` 接口主机控制器端的驱动位于 `drivers/w1/masters/`，而\
