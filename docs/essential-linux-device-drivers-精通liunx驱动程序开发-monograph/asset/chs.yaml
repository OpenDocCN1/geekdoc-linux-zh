- "# Linux 设备驱动程序精要\n\n\n\n![](img/cover_image.jpg)\n![](img/index-1_1.jpg)\n\n\n\n\
  \n\n\n开源技术彻底改变了计算机世界。许多大型项目已在全球范围内投入生产，例如 `Apache`、`MySQL` 和 `Postgres`，程序员使用包括\
  \ `Perl`、`Python` 和 `PHP` 在内的多种语言编写应用程序。这些技术应用于许多不同的系统，从专有系统到 Linux 系统，再到传统的 UNIX\
  \ 系统和大型机。\n\n`普伦廷出版社（Prentice Hall）开源软件开发系列` 旨在为你带来这些开源技术的精华。你不仅将学习如何将它们应用于你的项目，还将从中*学习*。通过查看真实应用程序的真实代码，你将学习到全球开源开发者的最佳实践。\n\
