  \ `give_up_console()` | `drivers/char/vt.c` | |\n\n## 音频驱动\n\n音频硬件为计算机提供了生成和采集声音的能力。音频是\
  \ PC 和嵌入式领域中不可或缺的组件，无论是在笔记本电脑上聊天、手机通话、听 MP3 播放器、从机顶盒流式传输多媒体，还是在医疗级系统上发布指令。如果你在这些任何一个设备上运行\
  \ Linux，就需要 Linux-Sound 子系统提供的服务。\n\n在本章中，让我们找出内核是如何支持音频控制器和编码器的。让我们学习 Linux-Sound\
  \ 子系统的架构及其导出的编程模型。\n\n图 13.1 显示了 PC 兼容系统上的音频连接。南桥上的音频控制器与外部编码器共同与模拟音频电路接口。\n\n**处理器**\n\
  **北桥**\n**南桥**\nHub 接口\nAC’97\n**音频**\n控制器\n**编码器**\n回声\n麦克风\nAC’97 链路\n消除器\nPCI\n\
  AC’97\nAC’97 配置\n音频空间\n\n392 音频架构\n\n### 本章内容\n- 音频架构\n- Linux-Sound 子系统\n- 设备示例：MP3\
  \ 播放器\n- 调试\n- 源码\n\n\n\n\n\n`kernel.*Open Sound System` (OSS) 是 2.4 内核中的音频层，现在已过时并被弃用。为了帮助从\
  \ OSS 到 ALSA 的迁移，后者提供了 OSS 仿真，允许符合 OSS API 的应用程序在不更改的情况下在 ALSA 上运行。Linux-Sound 框架（如\
  \ ALSA 和 OSS）使得音频应用程序独立于底层硬件，就像 AC’97 和 I2S 等编解码器标准消除了为每块声卡编写单独音频驱动程序的需求一样。\n\n\
  查看图 13.3 以理解 Linux-Sound 子系统的架构。该子系统的各个组成部分如下：\n\n*   **音频核心（sound core）**，这是一个由程序和结构组成的代码库，供\
  \ Linux-Sound 层的其他组件使用。与属于其他驱动子系统的核心层一样，音频核心提供了一个间接层，使得音频子系统中的每个组件都相互独立。核心在向高层应用导出\
  \ ALSA API 时也起着重要作用。图 13.3 所示的后续 `/dev/snd/` 设备节点由 ALSA 核心创建并管理：`/dev/snd/controlC0`\
  \ 是控制节点（应用程序使用它控制音量增益等），`/dev/snd/pcmC0D0p` 是播放设备（设备名称末尾的 `p` 代表播放），`/dev/snd/pcmC0D0c`\
  \ 是录制设备（设备名称末尾的 `c` 代表采集）。在这些设备名称中，`C` 之后的整数是卡号，`D` 之后的是设备号。对于具有电话编解码器和音乐立体声编解码器的卡，其\
  \ ALSA 驱动可能会导出 `/dev/snd/pcmC0D0p` 来读取指向前者的音频流，并导出 `/dev/snd/pcmC0D1p` 来通道指向后者的音乐。\n\
  \n*   **特定于控制器硬件的音频驱动程序**。例如，要驱动 Intel ICH 南桥芯片组中的音频控制器，请使用 `snd_intel8x0` 驱动。\n\
  \n*   **辅助控制器与编解码器之间通信的音频编解码接口**。对于 AC’97 编解码器，使用 `snd_ac97_codec` 和 `ac97_bus`\
  \ 模块。\n\n*   **OSS 仿真层**，作为感知 OSS 的应用程序与启用 ALSA 的内核之间的通道。该层导出 `/dev` 节点，镜像了 2.4\
  \ 内核中 OSS 层提供的内容。这些节点（如 `/dev/dsp`、`/dev/adsp` 和 `/dev/mixer`）允许 OSS 应用程序在不更改的情况下在\
  \ ALSA 上运行。OSS 的 `/dev/dsp` 节点映射到 ALSA 节点 `/dev/snd/pcmC0D0`，`/dev/adsp` 对应 `/dev/snd/pcmC0D1`，`/dev/mixer`\
  \ 与 `/dev/snd/controlC0`。\n\n*   **Procfs 和 sysfs 接口实现**，通过 `/proc/asound/` 和 `/sys/class/sound/`\
  \ 访问信息。\n\n*   用户空间 ALSA 库 `alsa-lib`，它提供了 `libasound.so` 对象。该库通过提供多个访问 ALSA 驱动的内置程序，简化了\
  \ ALSA 应用程序程序员的工作。\n\n*   **`alsa-utils` 软件包**，包含 `alsamixer`、`amixer`、`alsactl`\
  \ 和 `aplay` 等工具。使用 `alsamixer` 或 `amixer` 更改线路输入、线路输出或麦克风等音频信号的音量级，使用 `alsactl`\
  \ 控制 ALSA 驱动的设置。要在 ALSA 上播放音频，请使用 `aplay`。\n\n为了更好地理解 Linux-Sound 层的架构，让我们结合图 13.3\
  \ 查看在笔记本电脑上运行的 ALSA 驱动模块（→ 用于附加注释）：\n\n```bash\nlsmod|grep snd\nsnd_intel8x0 33148\
  \ 0\n→ Audio 控制器驱动\nsnd_ac97_codec 92000 1 snd_intel8x0\n→ 音频编解码接口\nac97_bus 3104\
  \ 1 snd_ac97_codec\n→ 音频编解码总线\nsnd_pcm_oss 40512 0\n→ OSS 仿真\nsnd_mixer_oss 16640\
  \ 1 snd_pcm_oss\n→ OSS 音量控制\nsnd_pcm 73316 3 snd_intel8x0,snd_ac97_codec,snd_pcm_oss\n\
  → 核心层\nsnd_timer 22148 1 snd_pcm\n→ 核心层\nsnd 50820 6 snd_intel8x0,snd_ac97_codec,snd_pcm_oss,\n\
  snd_mixer_oss,snd_pcm,snd_timer\n→ 核心层\nsoundcore 8960 1 snd\n→ 核心层\nsnd_page_alloc\
  \ 10344 2 snd_intel8x0,snd_pcm\n→ 核心层\n```\n\n### Linux-Sound 子系统\n\n为了更好地理解 Linux-Sound\
  \ 层的架构，让我们结合图 13.3 查看在笔记本电脑上运行的 ALSA 驱动模块（→ 用于附加注释）：\n\n| 模块 | 大小 | 使用者 | 描述 |\n\
  | :--- | :--- | :--- | :--- |\n| `snd_intel8x0` | 33148 | 0 | → 音频控制器驱动 |\n| `snd_ac97_codec`\
  \ | 92000 | 1 `snd_intel8x0` | → 音频编解码接口 |\n| `ac97_bus` | 3104 | 1 `snd_ac97_codec`\
  \ | → 音频编解码总线 |\n| `snd_pcm_oss` | 40512 | 0 | → OSS 仿真 |\n| `snd_mixer_oss` | 16640\
  \ | 1 `snd_pcm_oss` | → OSS 音量控制 |\n| `snd_pcm` | 73316 | 3 `snd_intel8x0,snd_ac97_codec,snd_pcm_oss`\
  \ | → 核心层 |\n| `snd_timer` | 22148 | 1 `snd_pcm` | → 核心层 |\n| `snd` | 50820 | 6\
  \ `snd_intel8x0,snd_ac97_codec,snd_pcm_oss,snd_mixer_oss,snd_pcm,snd_timer` | →\
  \ 核心层 |\n| `soundcore` | 8960 | 1 `snd` | → 核心层 |\n| `snd_page_alloc` | 10344 |\
  \ 2 `snd_intel8x0,snd_pcm` | → 核心层 |\n\n### ALSA 架构\n\n为了更好地理解 Linux-Sound 层的架构，让我们结合图\
  \ 13.3 查看在笔记本电脑上运行的 ALSA 驱动模块（→ 用于附加注释）：\n\n*   符合 OSS API 的**应用程序**（`rawplay`,\
  \ `rawrec`, `...`）\n*   符合 ALSA API 的**应用程序**（`aplay`, `arecord`, `...`）\n*   `/proc/asound/`\n\
  *   `/sys/class/sound/`\n*   `alsa-lib`\n*   `/dev/dsp`\n*   `/dev/adsp`\n*   `/dev/mixer`\n\
  *   `/dev/snd/pcmC0D0`\n*   `/dev/snd/pcmC0D1`\n*   `/dev/snd/controlC0`\n\n为了更好地理解\
  \ Linux-Sound 层的架构，让我们结合图 13.3 查看在笔记本电脑上运行的 ALSA 驱动模块（→ 用于附加注释）：\n\n```bash\nlsmod|grep\
  \ snd\nsnd_intel8x0 33148 0\n→ Audio 控制器驱动\nsnd_ac97_codec 92000 1 snd_intel8x0\n\
  → 音频编解码接口\nac97_bus 3104 1 snd_ac97_codec\n→ 音频编解码总线\nsnd_pcm_oss 40512 0\n→ OSS\
  \ 仿真\nsnd_mixer_oss 16640 1 snd_pcm_oss\n→ OSS 音量控制\nsnd_pcm 73316 3 snd_intel8x0,snd_ac97_codec,snd_pcm_oss\n\
  → 核心层\nsnd_timer 22148 1 snd_pcm\n→ 核心层\nsnd 50820 6 snd_intel8x0,snd_ac97_codec,snd_pcm_oss,\n\
  snd_mixer_oss,snd_pcm,snd_timer\n→ 核心层\nsoundcore 8960 1 snd\n→ 核心层\nsnd_page_alloc\
  \ 10344 2 snd_intel8x0,snd_pcm\n→ 核心层\n```\n\n\n\n\n\n# `CONTROL_REGISTER`\n启用中断、配置中断原因（如缓冲区传输完成）、重置硬件、启用/禁用总线操作等。\n\
  \n# `STATUS_REGISTER`\n音频编解码器（codec）音频事件的状态。\n\n# `DMA_ADDRESS_REGISTER`\n示例硬件支持单个\
  \ DMA 缓冲区描述符。现实中的显卡可能支持多个描述符，并可能带有额外的寄存器来存储参数，例如正在处理的描述符、当前采样在缓冲区内的位置等。DMA 是在音频控制器的缓冲区上执行的，因此此寄存器位于控制器的内存空间中。\n\
  \n# `DMA_SIZE_REGISTER`\n存储与 SoC 之间 DMA 传输的大小。该寄存器也位于音频控制器内部。\n\n一个音频驱动程序由三个主要部分组成：\n\
  1. 处理播放的例程\n2. 处理捕获的例程\n3. 混音器控制函数\n\n我们的驱动程序实现了播放功能，但不支持录制，因为示例中的 MP3 器没有麦克风。驱动程序还简化了混音器功能。它没有提供完整的音量控制（如扬声器、耳机和线路输出），而是只允许单一通用的音量控制。\n\
  \n表 13.1 显示的 MP3 播放器硬件寄存器布局反映了这些假设和简化，并不符合之前提到的 AC'97 等标准。因此，编解码器有一个 `SAMPLING_RATE_REGISTER`\
  \ 来配置播放（数字转模拟）采样率，但没有设置捕获（模拟转数字）速率的寄存器。`VOLUME_REGISTER` 配置全局全局音量。\n\n列表 13.1 是\
  \ MP3 播放器的骨干 ALSA 音频驱动程序，大量使用了伪代码（在注释中）来省略多余细节。ALSA 是一个复杂的框架，符合标准的音频驱动程序通常有几千行代码。列表\
  \ 13.1 仅让你开启音频驱动探索的大门。你可以通过回到顶层 `sound/` 目录下强大的 Linux-Sound 来继续学习。\n\n### 设备示例：MP3\
  \ 播放器\n\n我们的示例驱动程序是作为一个平台驱动程序实现的。让我们来看平台驱动程序的 `probe()` 方法 `mycard_audio_probe()`\
  \ 所执行的步骤。我们将在每个步骤下进行简单的旁白，解释我们遇到的相关概念和重要数据结构，这将引导我们进入驱动程序的其他部分并帮助将它们联系起来。\n\n`mycard_audio_probe()`\
  \ 执行以下操作：\n\n1. 通过调用 `snd_card_new()` 创建声卡实例：\n```c\nstruct snd_card *card = snd_card_new(-1,\
  \ id[dev->id], THIS_MODULE, 0);\n```\n`snd_card_new()` 的第一个参数是卡索引（用于在系统中多个声卡中标识此卡），第二个参数是要存储在返回的\
  \ `snd_card` 结构 `id` 字段中的 ID，第三个参数是所有者模块，最后一个参数是私有数据字段的大小，该字段将通过返回的 `snd_card` 结构的\
  \ `private_data` 字段可用（通常用于存储特定芯片的数据，如中断电平和及 I/O 地址）。\n\n`snd_card` 代表创建的声卡，在 `include/sound/core.h`\
  \ 中定义如下：\n\n```c\nstruct snd_card {\n    int number; /* 卡索引 */\n    char id[16];\
  \ /* 卡 ID */\n    /* ... */\n    struct module *module; /* 所有者模块 */\n    void *private_data;\
  \ /* 私有数据 */\n    /* ... */\n    struct list_head controls;\n    /* 此卡的所有控制项 */\n\
  \    struct device *dev; /* 分配给此卡的设备*/\n    /* ... */\n};\n```\n\nprobe 方法对应的移除方法\
  \ `mycard_audio_remove()` 释放 `snd_card`。\n\n2. 使用 `snd_pcm_new()` 创建 PCM 播放实例并与步骤\
  \ 1 中创建的卡关联：\n```c\nint snd_pcm_new(struct snd_card *card, char *id,\nint device,\n\
  int playback_count,\nstruct snd_pcm **pcm);\n```\n参数分别是步骤 1 中创建的声卡实例、标识字符串、设备索引、支持的播放流数量、支持的捕获流数量以及分配的\
  \ PCM 实例指针。分配的 PCM 实例在 `include/sound/pcm.h` 中定义如下：\n\n```c\nstruct snd_pcm {\n\
  \    struct snd_card *card; /* 关联的声卡 */\n    /* ... */\n    struct snd_pcm_substream\
  \ streams[2]; /* 播放和捕获流 */\n    /* ... */\n    struct device *dev; /* 关联的硬件设备 */\n\
  };\n```\n\n3. 通过 `snd_pcm_set_ops()` 将播放操作与步骤 2 创建的 PCM 实例关联。`snd_pcm_ops` 结构规定了传输到编解码器的\
  \ PCM 操作。列表 13.1 实现如下：\n```c\n/* PCM 流的操作 */\nstatic struct snd_pcm_ops mycard_playback\
  \ = {\n    .open = mycard_pb_open, /* 打开 */\n    .close = mycard_pb_close, /* 关闭\
  \ */\n    .ioctl = snd_pcm_ioctl, /* 处理通用 ioctl */\n    .hw_params = mycard_pb_hw_params,\
  \ /* 当上层设置硬件参数时 */\n    .hw_free = mycard_pb_hw_free, /* 释放资源 */\n    .prepare =\
  \ mycard_pb_prepare, /* 准备音频流 */\n    .trigger = mycard_pb_trigger, /* 当 PCM 启动、停止或暂停时\
  \ */\n};\n/* 将操作与 PCM 实例关联 */\nsnd_pcm_set_ops(pcm, SNDRV_PCM_PLAYBACK, &mycard_playback);\n\
  ```\n在列表 13.1 中，`mycard_pb_prepare()` 配置 `SAMPLING_RATE_REGISTER` 中的采样率、`CLOCK_INPUT_REGISTER`\
  \ 中的时钟源以及 `CONTROL_REGISTER` 中的传输完成中断。`trigger()` 方法 `mycard_pb_trigger()` 使用 `dma_map_single()`\
  \ 映射由 ALSA 框架填充的缓冲区（我们在第 10 章讨论过流式 DMA）。映射的缓冲区地址被写入 `DMA_ADDRESS_REGISTER`。该寄存器属于音频控制器，而不是编解码器内部。音频控制器将\
  \ DMA 数据转发到编解码器进行播放。\n\n另一个相关对象是 `snd_pcm_hardware` 结构，它宣布 PCM 组件的硬件能力。对于我们的示例设备，它在列表\
  \ 13.1 中定义如下：\n\n```c\n/* 播放流的硬件能力 */\nstatic struct snd_pcm_hardware mycard_playback_stereo\
  \ = {\n    .info = (SNDRV_PCM_INFO_MMAP | SNDRV_PCM_INFO_PAUSE | SNDRV_PCM_INFO_RESUME),\
  \ /* 支持 mmap()。流具有暂停/恢复能力 */\n    .formats = SNDRV_PCM_FMTBIT_S16_LE, /* 每个通道 16\
  \ 位符号，小端序 */\n    .rates = SNDRV_PCM_RATE_8000_48000, /* DAC 采样率范围 */\n    .rate_min\
  \ = 8000, /* 最小采样率 */\n    .rate_max = 48000, /* 最大采样率 */\n    .channels_min = 2,\
  \ /* 支持左右通道 */\n    .channels_max = 2, /* 支持左右通道 */\n    .buffer_bytes_max = 32768,\
  \ /* 最大缓冲区大小 */\n};\n```\n该对象通过 `open()` 操作符 `mycard_playback_open()` 与关联的 `snd_pcm`\
  \ 绑定，使用 PCM *运行时*实例。每个打开的 PCM 流都有一个名为 `snd_pcm_runtime` 的运行时对象，包含所有信息-\n\n\n\n\n\
  需要管理该流的宏定义。这是一个在 `include/sound/pcm.h` 中定义的巨大的软件和硬件配置结构，它包含 `snd_pcm_hardware` 作为其组件字段之一。\n\
  \n### 4. 使用 `snd_pcm_lib_preallocate_pages_for_all()` 预分配缓冲区\n\nDMA 缓冲区随后通过 `mycard_hw_params()`\
  \ 使用 `snd_pcm_lib_malloc_pages()` 从此预分配区域获取，并存储在步骤 3 中提到的 PCM 运行时实例中。`mycard_pb_trigger()`\
  \ 在启动 PCM 操作时对该缓冲区进行 DMA 映射（DMA-maps），并在停止 PCM 操作时取消映射。\n\n### 5. 使用 `snd_ctl_add()`\
  \ 将混音器控制元素与声卡关联用于全局音量控制：\n\n```\nsnd_ctl_add(card, snd_ctl_new1(&mycard_playback_vol,\
  \ &myctl_private));\n```\n\n`snd_ctl_new1()` 取一个 `snd_kcontrol_new` 结构作为第一个参数，并返回一个指向\
  \ `snd_kcontrol` 结构的指针。列表 13.1 将定义如下：\n\n```c\nstatic struct snd_kcontrol_new mycard_playback_vol\
  \ = {\n    .iface = SNDRV_CTL_ELEM_IFACE_MIXER,\n    /* 控制元素类型为 MIXER */\n    .name\
  \ = \"MP3 volume\", /* 名称 */\n    .index = 0, /* Codec 编号: 0 */\n    .info = mycard_pb_vol_info,\
  \ /* 音量信息 */\n    .get = mycard_pb_vol_get, /* 获取音量 */\n    .put = mycard_pb_vol_put,\
  \ /* 设置音量 */\n};\n```\n\n`snd_kcontrol` 结构描述了一个控制元素。我们的驱动程序将其用作通用音量控制的旋钮。`snd_ctl_add()`\
  \ 向 ALSA 框架注册一个 `snd_kcontrol` 元素。当执行如 `alsamixer` 等用户应用程序时，会调用相应的控制方法。在列表 13.1\
  \ 中，`snd_kcontrol` 的 `put()` 方法 `mycard_playback_volume_put()` 将请求的音量设置写入 codec\
  \ 的 `VOLUME_REGISTER`。\n\n### 6. 最后，将声卡注册到 ALSA 框架：\n\n```\nsnd_card_register(card);\n\
  ```\n\n`codec_write_reg()`（在列表 13.1 中已使用但未实现）通过连接 SoC 中的音频控制器和外部 codec 的总线进行通信，将值写入\
  \ codec 寄存器。如果底层总线协议是 `I2C` 或 `SPI`（例如），`codec_write_reg()` 将使用第 8 章“集成电路接口协议”中讨论的接口函数。\n\
  \n如果你想在驱动程序中创建一个 `/proc` 接口，以便在调试期间转储寄存器，或在正常运行期间导出参数，请使用 `snd_card_proc_new()`\
  \ 等函数的服务。列表 13.1 没有使用 `/proc` 文件。如果你编译并加载列表 13.1 中的驱动模块，你将在现在 MP3 播放器上出现了两个新的设备节点：`/dev/snd/pcmC0D0p`\
  \ 和 `/dev/snd/controlC0`。前者是音频播放接口，后者是混音器控制接口。MP3 解码器应用程序在 `alsa-lib` 的帮助下，通过操作这些设备节点来流传输音乐。\n\
  \n#### 列表 13.1 用于 Linux MP3 播放器的 ALSA 驱动\n\n```c\n#include <linux/platform_device.h>\n\
  #include <linux/soundcard.h>\n#include <sound/driver.h>\n#include <sound/core.h>\n\
  #include <sound/pcm.h>\n#include <sound/initval.h>\n#include <sound/control.h>\n\
  \n/* codec 支持的播放率 */\nstatic unsigned int mycard_rates[] = {\n    8000,\n    48000,\n\
  };\n\n/* 播放通道的硬件限制 */\nstatic struct snd_pcm_hw_constraint_list mycard_playback_rates\
  \ = {\n    .count = ARRAY_SIZE(mycard_rates),\n    .list = mycard_rates,\n    .mask\
  \ = 0,\n};\n\nstatic struct platform_device *mycard_device;\nstatic char *id[SNDRV_CARDS]\
  \ = SNDRV_DEFAULT_STR;\n\n/* PCM 流的硬件能力 */\nstatic struct snd_pcm_hardware mycard_playback_stereo\
  \ = {\n    .info = (SNDRV_PCM_INFO_MMAP | SNDRV_PCM_INFO_BLOCK_TRANSFER),\n    .formats\
  \ = SNDRV_PCM_FMTBIT_S16_LE, /* 每个通道 16 位，小端序 */\n    .rates = SNDRV_PCM_RATE_8000_48000,\
  \ /* DAC 采样率范围 */\n    .rate_min = 8000, /* 最小采样率 */\n    .rate_max = 48000, /*\
  \ 最大采样率 */\n    .channels_min = 2, /* 支持左通道和右通道 */\n    .channels_max = 2, /* 支持左通道和右通道\
  \ */\n    .buffer_bytes_max = 32768, /* 最大缓冲区大小 */\n};\n\n/* 以播放模式打开设备 */\nstatic\
  \ int mycard_pb_open(struct snd_pcm_substream *substream) {\n    struct snd_pcm_runtime\
  \ *runtime = substream->runtime;\n    /* 初始化 */\n    /* ... */\n    /* ... */\n\
  \    runtime->hw = mycard_playback_stereo;\n    /* ... */\n    /* ... */\n    snd_pcm_hw_constraint_list(runtime,\
  \ SNDRV_PCM_RATE, &mycard_playback_rates);\n    return 0;\n}\n\n/* 关闭设备 */\nstatic\
  \ int mycard_pb_close(struct snd_pcm_substream *substream) {\n    /* ... */\n  \
  \  /* ... */\n    return 0;\n}\n\n/* 通过总线写入 codec 寄存器 */\nvoid codec_write_reg(uint\
  \ reg, uint value) {\n    /* ... */\n}\n\n/* 准备音频流 */\nstatic int mycard_pb_prepare(struct\
  \ snd_pcm_substream *substream) {\n    /* ... */\n    /* ... */\n    return 0;\n\
  }\n\n/* 触发/停止 */\nstatic int mycard_pb_trigger(struct snd_pcm_substream *substream,\
  \ int cmd) {\n    switch (cmd) {\n        case SNDRV_PCM_TRIGGER_START:\n      \
  \      /* ... */\n            break;\n        case SNDRV_PCM_TRIGGER_STOP:\n   \
  \         /* ... */\n            break;\n        default:\n            return -EINVAL;\n\
  \    }\n    return 0;\n}\n\n/* 分配 DMA 缓冲区 */\nstatic int mycard_pb_hw_params(struct\
  \ snd_pcm_substream *substream, struct snd_pcm_hw_params *hw_params) {\n    /* ...\
  \ */\n    return snd_pcm_lib_malloc_pages(substream, buffer_bytes(hw_params));\n\
  }\n\n/* 释放 */\nstatic int mycard_pb_hw_free(struct snd_pcm_substream *substream)\
  \ {\n    return snd_pcm_lib_free_pages(substream);\n}\n\n/* 音量信息 */\nstatic int\
  \ mycard_pb_vol_info(struct snd_kcontrol *kcontrol, struct snd_ctl_elem_info *uinfo)\
  \ {\n    uinfo->type = SNDRV_CTL_ELEM_TYPE_INTEGER;\n    /* 整数类型 */\n    uinfo->count\
  \ = 1; /* 值的数量 */\n    uinfo->value.integer.min = 0; /* 最小音量 */\n    uinfo->value.integer.max\
  \ = 10; /* 最大音量 */\n    uinfo->value.integer.step = 1; /* 步长为 1 */\n    return 0;\n\
  }\n\n/* 播放音量旋钮 */\nstatic int mycard_pb_vol_put(struct snd_kcontrol *kcontrol, struct\
  \ snd_ctl_elem_value *uvalue) {\n    int global_volume = uvalue->value.integer.value[0];\n\
  \    /* 将 global_volume 写入 VOLUME_REGISTER\n    使用 codec_write_reg() */\n    /*\
  \ ... */\n}\n\n/* 获取播放音量 */\nstatic int mycard_pb_vol_get(struct snd_kcontrol *kcontrol,\
  \ struct snd_ctl_elem_value *uvalue) {\n    /* 从 VOLUME_REGISTER 读取 global_volume\n\
  \    并通过 uvalue->integer.value[0] 返回 */\n    /* ... */\n    return 0;\n}\n```\n\n\
  \n\n\n```c\n.index = 0, /* Code 器编号: 0 */\n\n.info = mycard_pb_vol_info, /* 音量信息\
  \ */\n\n.get = mycard_pb_vol_get, /* 获取音量 */\n\n.put = mycard_pb_vol_put, /* 设置音量\
  \ */\n\n};\n\n/* PCM 播放流的操作符 */\nstatic struct snd_pcm_ops mycard_playback_ops =\
  \ {\n.open = mycard_playback_open, /* 打开 */\n.close = mycard_playback_close, /*\
  \ 关闭 */\n.ioctl = snd_pcm_lib_ioctl, /* 通用 ioctl 处理器 */\n.hw_params = mycard_hw_params,\
  \ /* 硬件参数 */\n.hw_free = mycard_hw_free, /* 释放硬件参数 */\n.prepare = mycard_playback_prepare,\
  \ /* 准备传输音频流 */\n.trigger = mycard_playback_trigger, /* 当 PCM 引擎启动/停止/暂停时调用 */\n\
  };\n\n/* 平台驱动 probe() 方法 */\nstatic int __init\nmycard_audio_probe(struct platform_device\
  \ *dev)\n{\nstruct snd_card *card;\nstruct snd_pcm *pcm;\nint myctl_private;\n/*\
  \ 实例化 snd_card 结构 */\ncard = snd_card_new(-1, id[dev->id], THIS_MODULE, 0);\n/*\
  \ 创建一个包含 1 个播放子流和 0 个采集流的 PCM 实例 */\nsnd_pcm_new(card, \"mycard_pcm\", 0, 1, 0,\
  \ &pcm);\n/* 设置初始 DMA 缓冲区 */\nsnd_pcm_lib_preallocate_pages_for_all(pcm,\nSNDRV_DMA_TYPE_CONTINUOUS,\n\
  snd_dma_continuous_data\n(GFP_KERNEL), 256*1024,\n256*1024);\n/* 将播放操作与 PCM 实例关联\
  \ */\nsnd_pcm_set_ops(pcm, SNDRV_PCM_STREAM_PLAYBACK,\n&mycard_playback_ops);\n\
  /* 将混声器控制元素与此卡关联 */\nsnd_ctl_add(card, snd_ctl_new1(&mycard_playback_vol,\n&myctl_private));\n\
  strcpy(card->driver, “mycard\");\n/* 注册声卡 */\nsnd_card_register(card);\n/* 存储卡供其他方法访问\
  \ */\nplatform_set_drvdata(dev, card);\nreturn 0;\n}\n\n/* 平台驱动 remove() 方法 */\n\
  static int\nmycard_audio_remove(struct platform_device *dev)\n{\nsnd_card_free(platform_get_drvdata(dev));\n\
  platform_set_drvdata(dev, NULL);\n设备示例：MP3 播放器\nreturn 0;\n}\n\n/* 平台驱动定义 */\nstatic\
  \ struct platform_driver mycard_audio_driver = {\n.probe = mycard_audio_probe, /*\
  \ 探测方法 */\n.remove = mycard_audio_remove, /* 移除方法 */\n.driver = {\n.name = \"mycard_ALSA\"\
  ,\n},\n};\n\n/* 驱动初始化 */\nstatic int __init\nmycard_audio_init(void)\n{\n/* 注册平台驱动和设备\
  \ */\nplatform_driver_register(&mycard_audio_driver);\nmycard_device = platform_device_register_simple(\"\
  mycard_ALSA\",\n-1, NULL, 0);\nreturn 0;\n}\n\n/* 驱动退出 */\nstatic void __exit\n\
  mycard_audio_exit(void)\n{\nplatform_device_unregister(mycard_device);\nplatform_driver_unregister(&mycard_audio_driver);\n\
  }\nmodule_init(mycard_audio_init);\nmodule_exit(mycard_audio_exit);\nMODULE_LICENSE(\"\
  GPL\");\n```\n\n为了理解用户空间的 `alsa-lib` 库如何与内核空间的 ALSA 驱动交互，让我们编写一个简单的应用程序来设置 MP3 播放器的音量增益。我们将应用程序使用的\
  \ `alsa-lib` 服务映射到列表 13.1 中定义的混声器控制方法。让我们从加载驱动程序并检查混声器的能力开始：\n\n**bash> amixer contents**\n\
