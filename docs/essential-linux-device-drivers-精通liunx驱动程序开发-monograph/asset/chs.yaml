  \ 蓝牙 467\n\n一些小型足迹设备由无线技术和 Linux 的双重组合驱动。蓝牙、红外、WiFi 和蜂窝网络是具有良好 Linux 支持的成熟无线技术。蓝牙消除了电缆，为哑设备注入了智能，并开启了大量新颖的应用。红外是一种低成本、短距离、中速率的无线技术，可以使笔记本电脑联网、连接手持设备或将文档发送到打印机。WiFi\
  \ 是以太网局域网形式存在的无线技术。使用 GPRS 或码分多址 (CDMA) 的蜂窝网络只要你的活动在服务提供者的覆盖范围内，就能让你随时访问互联网。\n\n\
  由于这些无线技术在流行的外形中广泛可用，你很快就会拥有一个无法立即在 Linux 上运行的网卡。在开始尝试启用不支持的网卡之前，你需要详细了解内核是如何实现对相应技术的支持。在本章中，让我们学习\
  \ Linux 如何启用蓝牙、红外、WiFi 和蜂窝网络。\n\n## 无线权衡\n\n蓝牙、红外、WiFi 和 GPRS 服务于不同的领域。权衡可以根据速度、范围、成本、功耗、硬件/软件协同设计的易用性以及\
  \ PCB 空间占用来衡量。\n\n表 16.1 提供了关于这些参数的思路，但在实际测量数值时，你必须应对多个变量。列出的速度是理论最大值。所示的功耗是相对的，但在现实世界中它们还取决于厂商的实现技术、技术子类和工作模式。成本效益取决于芯片的外形以及芯片是否包含实现某些协议层的内置微代码。电路板的的占用不仅取决于芯片组，还取决于收发器、天线以及你是否使用现成的\
  \ (OTS) 模块构建。\n\n### 表 16.1 无线权衡\n\n| 设备 | 速度 | 范围 | 功耗 | 成本 | 协同设计工作 | 空间占用 |\n\
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 蓝牙 | 720Kbps | 10m 到 100m\
  \ | ** | ** | ** | ** | ** |\n| 红外 (快速红外) | 4Mbps | 高达 1 米 (30 度锥形) | * | * | *\
  \ | * | * |\n| WiFi | 54Mbps | 150 米 (室内) | **** | *** | *** | *** | *** |\n| GPRS\
  \ | 170Kbps | 服务提供者覆盖范围 | *** | **** | * | *** | *** |\n\n注意：最后四列给出的是相对测量（取决于 `*`\
  \ 符号的数量），而非绝对值。\n\n本章的部分章节更多关注“系统编程”而非设备驱动程序。\n\n蓝牙\n\nWiFi 是以太网局域网形式存在的无线技术。蓝牙消除了电缆，为哑设备注入了智能，并开启了大量新颖的应用。红外是一种低成本、短距离、中速率的无线技术...\n\
  \n## 第 16 章 无线 Linux\n\n根据蓝牙规范，协议栈由图 16.1 所示的层组成。无线电、链路控制器和链路管理器大致对应于开放系统连接 (OSI)\
  \ 标准参考模型中的物理层、数据链路层网络层。主机控制接口 (HCI) 是在硬件进出传输数据的协议，因此映射到传输层。蓝牙逻辑控制和适配协议 (L2CAP) 属于会话层。使用射频通信\
  \ (RFCOMM) 的串口端口仿真、使用蓝牙网络封装协议 (BNEP) 的以太网仿真以及服务发现协议 (SDP) 都是丰富的表示层的一部分。栈的顶部是称为配置\
  \ (profiles)的应用环境。无线电、链路控制器和链路管理器通常是蓝牙硬件的一部分，因此操作系统的支持从 HCI 层开始。\n\n```\n| OSI 模型\
  \ | 蓝牙栈 |\n| :--- | :--- |\n| 应用 | 配置 |\n| 表示 | RFCOMM / BNEP / SDP |\n| 会话 | L2CAP\
  \ |\n| 传输 | Linux BlueZ (等一下，BlueZ 是实现，HCI 是传输层) |\n| 传输 | 主机控制接口 (HCI) |\n| 网络\
  \ | 蓝牙芯片组 |\n| 数据链路 | 链路管理器 |\n| 物理 | 链路控制器 |\n| 物理 | 无线电 |\n```\n\nBlueZ 蓝牙实现是是主线内核的一部分，也是官方的\
  \ Linux 蓝牙栈。图 16.2 显示了 BlueZ 如何将蓝牙协议层映射到内核模块、内核线程、用户空间守护进程、配置工具和实用程序。\n\n\n\n\n\n\
  # BlueZ 组件\n\n以及库。这里解释了主要的 BlueZ 组件：\n\n1. `bluetooth.ko` 包含了 BlueZ 的核心基础设施。所有其他\
  \ BlueZ 模块都利用它的服务。它还负责向用户空间导出蓝牙套接字族（AF_BLUETOOTH）并填充相关的 sysfs 条目。\n\n2. 对于通过 UART\
  \ 传输蓝牙 HCI 数据包，相应的 BlueZ HCI 实现是 `hci_uart.ko`。对于 USB 传输，则是 `hci_usb.ko`。\n\n3.\
  \ `l2cap.ko` 实现 L2CAP 适配层，负责分段和重组。它还可以在不同的高层协议之间进行复用。\n\n4. 要要在蓝牙上运行 TCP/IP 应用程序，你需要使用\
  \ BNEP 在 L2CAP 上模拟以太网端口。这通过 `bnep.ko` 实现。为了处理 BNEP 连接，BlueZ 会启动一个名为 `kbnepd` 的内核线程。\n\
  \n5. 要要在蓝牙上运行终端模拟器等串口应用程序，你需要在 L2CAP 上模拟串口。这通过 `rfcomm.ko` 实现。RFCOMM 还作为支持 PPP 网络的支柱功能。为了处理接入的\
  \ RFCOMM 连接，`rfcomm.ko` 会启动一个名为 `krfcommd` 的内核线程。要设置并维护到目标设备上单个 RFCOMM 通道的连接，请使用\
  \ `rfcomm` 工具。\n\n6. HID 层通过 `hidp.ko` 实现。用户态守护进程 `hidd` 让 BlueZ 处理蓝牙鼠标等输入设备。\n\n\
  7. 音频通过 `sco.ko` 实现的“同步面向连接”（SCO）层进行处理。\n\n现在让我们追踪两个示例蓝牙设备的内核代码流：一个紧凑型 `Flash` 卡（CF\
  \ 卡）和一个 USB 适配器。\n\n```\nhicid, hciconfig, hcitool, hciattach, hcidump\n/usr/lib/libbluetooth.so\n\
  hciX\ntelnet, ftp, ssh. …\nSerial Apps\nsdpd\nBluetooth\nrfcomm\nSocket App\npand\n\
  dund\nhidd\n/dev/rfcommX\nbnepX\npppX\nAudio app\nMice app\nUser Space\nKernel Space\n\
  TCP/IP\nPPP\nService\nDiscovery\nrfcomm.ko\nkrfcommd\nbnep.ko\nAF_BLUETOOTH\nkbnepd\n\
  (Serial\nhidp.ko\n(Network\n(Human\nLayer)\nDevices)\nEncapsulation Interface\n\
  bluetooth.ko\n(core, sysfs, sockets)\nTransport Layer\nNetwork Layer\nl2cap.ko\n\
  (Logical Link Control and Adaptation Layer)\nhci_uart.ko\nsco.ko\nhci_usb.ko\n(SCO\n\
  Audio)\nhcihci.ko\n(Virtual\nHost Control\nInterface)\nBluetooth Chipset\n(Link\
  \ Manager, Link Control, Baseband, Radio)\n```\n图 16.2 蓝牙协议层映射到 BlueZ 内核模块。\n\n\
  ### 设备示例：CF 卡\n\nSharp 蓝牙 Compact Flash 卡使用 Silicon Wave 芯片构建，并使用串口传输传输 HCI 数据包。HCI\
  \ 数据包有三种串口传输方式：\n\n1. H4 (UART)，用于 Sharp CF 卡。H4 是蓝牙规范定义的通过 UART 传输蓝牙数据的标准方法。查看\
  \ `drivers/bluetooth/hci_h4.c` 可了解 BlueZ 的实现。\n\n2. H3 (RS232)。使用 H3 的设备很难找到。BlueZ\
  \ 不支持 H3。\n\n3. `BlueCore Serial Protocol` (BCSP)，这是来自 `Cam-bridge Silicon Radio`\
  \ (CSR) 的专用协议，支持错误检查和重传。BCSP 用于基于 CSR BlueCore 芯片的非 USB 设备，包括 PCMCIA 和 CF 卡。BlueZ\
  \ 的 BCSP 实现位于 `drivers/bluetooth/hci_bcsp.c`。\n\nSharp 蓝牙卡的读取数据路径如图 16.3 所示。卡与内核之间的第一个接触点是\
  \ UART 驱动程序。正如你在第 9 章“PCMCIA 和 Compact Flash”中的图 9.5 所示，串口卡服务驱动 `drivers/serial/serial_cs.c`\
  \ 允许操作系统的其余将 Sharp 卡视为串口设备。串口驱动程序将接收到的 HCI 数据包传递给 BlueZ。BlueZ 以内核线路（line discipline）的形式实现\
  \ HCI 处理。正如你在第 6 章“串口驱动程序”中学到的，线路规范位于串口驱动程序之上并塑造其行为。HCI 线路规范调用相关的协议程序（在本例中为 H4）来协助处理数据。从那时起，L2CAP\
  \ 和更高的 BlueZ 层接管了工作。\n\n### 设备示例：USB 适配器\n\n现在让我们看看使用 USB 传输 HCI 数据包的设备。Belkin 蓝牙\
  \ USB 适配器就是其中的例子。在这种情况下，USB 层 (`usb/**`)、HCI USB 传输驱动 (`drivers/bluetooth/hci_usb.c`)\
  \ 和 BlueZ 协议栈 (`bluetooth/**`) 是获取数据的主要参与者。让我们看看这些内核层是如何交互的。\n\n## 蓝牙管道 (Pipes)\n\
  \n正如你在第 11 章中学到的，当 USB 设备插入系统时，主机控制器使用一个或多个四个管道（pipes）对其进行枚举。对于蓝牙设备，每个管道负责一种特定类型的数据：\n\
  \n1. 控制管道用于传输 HCI 命令。\n2. 中断管道负责携带 HCI 事件。\n3. 批量管道传输异步无连接连接 (ACL) 数据。\n4. 等时管道携带\
  \ SCO 数据。\n\n蓝牙规范将 USB 设备的（类，子类，协议）代码定义为 (0xE, 0x01, 0x01)。HCI USB 传输驱动 `hci_usb`\
  \ 在初始化期间向 USB 核心注册了这些值。当插入 Belkin 适配器时，USB 核心从设备描述符中读取（类，子类，协议）信息。由于这些信息与 `hci_usb`\
  \ 注册的值匹配，该驱动程序就会连接到适配器上。\n\n### RFCOMM\n\nRFCOMM 在蓝牙上模拟串口。终端模拟器等应用程序以及 PPP 等协议可以在\
  \ RFCOMM 创建的虚拟串口接口上运行。\n\n设备示例：药盒机\n\n举个例子，假设你有一个支持蓝牙的感应药盒机。当你从药盒机中弹出一粒药时，它会通过蓝牙\
  \ RFCOMM 通道发送消息。一台 Linux 手机（如第 6 章图 6.5 所示）使用一个简单的应用程序通过药盒机建立 RFCOMM 连接来读取此警报。然后，手机通过其\
  \ GPRS 接口将此信息发送到互联网上的医疗保健者服务器。\n\nLinux 手机上一个使用 BlueZ socket API 读取来自药盒机数据的骨架应用程序如列表\
  \ 16.1 所示。该列表假设你已经熟悉 socket 编程的基础。\n\n```\nLISTING 16.1 通过 RFCOMM 与药盒机通信\n#include\
  \ <sys/socket.h>\n#include <bluetooth/rfcomm.h> /* For struct sockaddr_rc\n\nvoid\n\
  sense_dispenser()\n{\nint pillfd;\nstruct sockaddr_rc pill_rfcomm;\nchar buffer[1024];\n\
  }\n```\n\n\n\n\n\n```c\n/* ... */\n\n/* Create a Bluetooth RFCOMM socket */\n\n\
  if ((pillfd = socket(PF_BLUETOOTH, SOCK_STREAM, BTPROTO_RFCOMM))\n< 0) {\n\n  printf(\"\
  Bad Bluetooth RFCOMM socket\");\n\n  exit(1);\n}\n\n/* Connect to the pill dispenser\
  \ */\n\npill_rfcomm.rc_family = AF_BLUETOOTH;\npill_rfcomm.rc_bdaddr = PILL_DISPENSER_BLUETOOTH_ADDR;\n\
  pill_rfcomm.rc_channel = PILL_DISPENSER_RFCOMM_CHANNEL;\nif (connect(pillfd, (struct\
  \ sockaddr *)&pill_rfcomm,\nsizeof(pill_rfcomm))) {\n\n  printf(\"Cannot connect\
  \ to Pill Dispenser\\n\");\n\n  exit(1);\n}\n\nprintf(\"Connection established to\
  \ Pill Dispenser\\n\");\n\n/* Poll until data is ready */\nselect(pillfd, &fds,\
  \ NULL, NULL, &timeout);\n\n/* Data is available on this RFCOMM channel */\nif (FD_ISSET(pillfd,\
  \ fds)) {\n\n  /* Read pill removal alerts from the dispenser */\n  read(pillfd,\
  \ buffer, sizeof(buffer));\n\n  /* Take suitable action; e.g., send a message to\
  \ the health\n  care provider's server on the Internet via the GPRS\n  interface\
  \ */\n  /* ... */\n}\n/* ... */\n```\n\n## 蓝牙\n\n### 网络\n\n追踪从图 16.2 中的 `telnet/ftp/ssh`\
  \ 框的代码路径，查看如何在 BlueZ 蓝牙上构建网络架构的。如你所见，通过蓝牙建立网络有两种不同的方式：\n\n1. 直接在 `BNEP` 上运行 `TCP/IP`。生成的网络被称为`个人局域网`\
  \ (PAN)。\n2. 通过 `PPP` 运行在 `RFCOMM` 上运行 `TCP/IP`。这被称为`拨号上网` (DUN)。\n\n蓝牙网络的内核实现可能对设备驱动程序编写者感兴趣，因此未探讨。然而，表\
  \ 16.2 显示了使用 `PAN` 连接两台笔记本电脑所需的步骤。使用 `DUN` 进行网络与此类似，未进行检查。这两台笔记本电脑分别使用之前讨论过的 Sharp\
  \ CF 卡和 Belkin USB 适配器启用蓝牙。你可以使用被动式 CF 转 PCMCIA 适配器将 CF 卡插入第一台笔记本电脑的 PCMCIA 插槽。结合图\
  \ 16.2 和表 16.2 查看以理解与对应 BlueZ 组件的映射。表 16.2 使用 `bash-sharp>` 和 `bash-belkin>` 作为两台笔记本电脑的\
  \ shell 提示符。\n\n### 表 16.2 使用蓝牙 PAN 连接两台笔记本电脑\n\n#### 在笔记本电脑上\n\n1. 使用 Sharp 蓝牙\
  \ CF 卡启动 HCI 和服务发现守护进程：\n```bash\nbash-sharp> hcid\nbash-sharp> sdpd\n```\n由于此设备拥有\
  \ UART 接口，你必须将 BlueZ 栈挂载到相应的串口。在这种情况下，假设 `serial_cs` 已将 `/dev/ttyS3` 分配给该卡：\n```bash\n\
  bash-sharp> hciattach ttyS3 any\n```\n2. 验证 HCI 接口已启动：\n```bash\nbash-sharp> hciconfig\
  \ -a\n```\nhci0: Type: UART\nBD Address: 08:00:1F:10:3B:13 ACL MTU: 60:20 SCO MTU:\
  \ 31:1\nUP RUNNING PSCAN ISCAN\n...\nManufacturer: Silicon Wave (11)\n\n3. 验证基础\
  \ BlueZ 模块已加载：\n```bash\nbash-sharp> lsmod\n```\nModule Size Used by\nhci_uart 16728\
  \ 3\nl2cap 26144 2\nbluetooth 47684 6 hci_uart,l2cap\n...\n\n4. 插入实现网络封装的 BlueZ\
  \ 模块：\n```bash\nbash-sharp> modprobe bnep\n```\n5. 监听入站的 PAN 连接：\n```bash\nbash-sharp>\
  \ pand –s\n```\n\n#### 在带有 Belkin USB 蓝牙适配器的笔记本电脑上\n\n1. 启动守护进程（如 `hcid` 和 `sdpd`）并插入必要的内核模块（如\
  \ `bluetooth.ko` 和 `l2cap.ko`）。\n2. 因为这是一个 USB 设备，你不需要调用 `hciattach`，但要确保已插入 `hci_usb.ko`\
  \ 模块。\n3. 验证 HCI 接口已启动：\n```bash\nbash-belkin> hciconfig -a\n```\nhci0: Type: USB\n\
  BD Address: 00:02:72:B0:33:AB ACL MTU: 192:8 SCO MTU: 64:8\nUP RUNNING PSCAN ISCAN\n\
  ...\nManufacturer: Cambridge Silicon Radio (10)\n\n4. 搜索并发现附近的设备：\n```bash\nbash-belkin>\
  \ hcitool -i hci0 scan --flush\n```\nScanning....\n08:00:1F:10:3B:13 bash-sharp\n\
  ```\n5. 与第一台笔记本电脑建立 PAN。你可以从它的 `hciconfig` 输出获取其蓝牙地址 (08:00:1F:10:3B:13)：\n```bash\n\
  bash-belkin> pand -c 08:00:1F:10:3B:13\n```\n如果你现在查看两台笔记本电脑上的 `ifconfig` 输出，你会发现两端都出现了一个名为\
  \ `bnep0` 的新接口。为两个接口分配 IP 地址并准备好 telnet 和 FTP！\n\n## 人机设备\n\n参阅第 7 章“输入驱动”中的“USB\
  \ 和蓝牙键盘”以及“USB 和蓝牙鼠标”部分，了解蓝牙人机设备的讨论。\n\n### 音频\n\n让我们以 HBH-30 索尼蓝牙耳机为例了解蓝牙 SCO 音频。在耳机开始与\
  \ Linux 设备通信之前，后者的蓝牙链路层必须先发现前者。为此，通过按下标记为设备发现的按钮将耳机置于`discover`模式。此外，你必须通过向 `/etc/bluetooth/pin`\
  \ 添加蓝牙耳机的`个人识别码` (PIN) 来配置 BlueZ。Linux 设备上使用 BlueZ SCO API 的应用程序现在可以向耳机发送音频数据。音频数据应为耳机能理解的格式。HBH-30\
  \ 使用 A-law PCM（脉冲编码调制）格式。有公有领域的工具可以将音频转换为各种 PCM 格式。蓝牙芯片组除了 HCI 传输接口外，通常具有 PCM 接口引脚。如果设备同时支持蓝牙和\
  \ GSM，来自 GSM 芯片组的 PCM 线可以直接连接到蓝牙芯片的 PCM 音频线。这时你可能需要配置蓝牙芯片通过其 HCI 接口而非 PCM 接口接收和发送\
  \ SCO 音频包。\n\n## 调试\n\n有两个用于调试的 BlueZ 工具：\n\n1. `hcidump` 拦截往返的 HCI 数据包并将其解析为人类可读的格式。以下是设备查询进行时的转储示例：\n\
  ```bash\nbash> hcidump -i hci0\n```\nHCIDump - HCI packet analyzer ver 1.11\ndevice:\
  \ hci0 snap_len: 1028 filter: 0xffffffff\nHCI Command: Inquiry (0x01|0x0001) plen\
  \ 5\nHCI Event: Command Status (0x0f) plen 4\nHCI Event: Inquiry Result (0x02) plen\
  \ 15\n...\nHCI Event: Inquiry Complete (0x01) plen 1 < HCI Command: Remote Name\
  \ Request (0x01|0x0019) plen 10\n...\n2. 虚拟 HCI 驱动（`hci_vhci.ko`）如图 16.2 所示，在没有实际硬件的情况下可以模拟蓝牙接口。\n\
  \n\n\n\n\n## 红外\n\n479 或将文档发送到打印机。`IR` 在 30 度的锥形范围内范围可达 1 米，扩散角度从 –15 到 +15 度。\n\
  \n红外通信有两种流行的类型：`标准红外`（`SIR`），它支持高达 115.20 Kbaud 的速度；以及`快速红外`（`FIR`），其带宽为 4Mbps。\n\
  \n图 16.4 显示笔记本电脑上的 `IR` 连接。Super I/O Chip 组中的 `UART1` 启用了 `IR`，因此 `IR` 收发器直接连接到它。Super\
  \ I/O 芯片不支持 `IR` 的笔记本电脑可能依赖于外部 `IR` 狗器（参见“设备示例：IR 狗器”部分），类似于连接到 `UART0` 的那种。图 16.5\
  \ 显示了具有内置 `IR` 狗器并连接到系统 `UART` 的嵌入式 SoC 上的 `IR` 连接。\n\n**处理器**\n**北桥**\n**南桥**\n\
  \nSuper I/O\nUART0\nUART1\nRS232\nIR\n收发器\n(SIR/FIR)\nIR 狗器\n\n图 16.4 笔记本电脑上的 IrDA。\n\
  \n**嵌入式 SoC**\nCPU\n核心\n外设总线\nRX\nRXIR\n红外\n控制器\n光学红外\nUART\n(SIR 收发器 TX 狗器)\nTXIR\n\
  \n图 16.5 嵌入式设备上的 IrDA（例如，EP7211）。\n\n480 第 16 章 无线 Linux\n\nLinux 在两个层面上支持 `IR`\
  \ 通信：\n\n1. 通过`红外数据协会`（`IrDA`）指定的协议进行智能数据传输。这由 `Linux-IrDA` 项目实现。\n2. 通过远程遥控器控制应用程序。这由\
  \ `Linux 红外遥控器`（`LIRC`）项目实现。\n\n本节主要探讨 `Linux-IrDA`，但在结束之前会快速查看 `LIRC`。\n\n### Linux-IrDA\n\
  \n`Linux-IrDA` 项目 (http://irda.sourceforge.net/) 为内核带来了 `IrDA` 能力。为了了解 `Linux-IrDA`\
  \ 组件相对于 `IrDA` 堆栈以及可能的硬件配置的关系，让我们交叉查看图 16.6：\n\n1. 设备驱动程序构成了底层。兼容 16550 的 `SIR`\
  \ 芯片组在使用 `IrDA` 行规律 `IrTTY` 塑造其行为后，可以重用原生 Linux 串口驱动程序。这种组合的替代方案是 `IrPort` 驱动程序。`FIR`\
  \ 芯片组有自己特殊的驱动程序。\n2. 接下来是核心协议栈。它由`红外链路访问协议`（`IrLAP`）、`红外链路管理协议`（`IrLMP`）、`微传输协议`（`TinyTP`）和\
  \ `IrDA socket`（`IrSock`）接口组成。`IrLAP` 提供可靠的传输以及发现邻近设备的状态机。`IrLMP` 是 `IrLAP` 之上的复用器。`TinyTP`\
  \ 提供分段、重组和流控制。`IrSock` 提供了 `IrLMP` 和 `TinyTP` 之上的 socket 接口。\n3. 堆栈的高层将 `IrDA` 与数据传输应用相结合。`IrLAN`\
  \ 和 `IrNET` 实现了网络，而 `IrComm` 允许串口通信。\n4. 你还需要那些最终决定该技术成败的应用程序。例如 `openobex` (http://openobex.sourceforge.net/)，它实现了用于交换文档和名片等对象的`对象交换`（`OBEX`）协议。如需要配置\
  \ `Linux-IrDA`，你需要许多发行版中附带的 `irda-utils` 软件包。它提供了诸如 `irattach`、`irdadump` 和 `irdaping`\
  \ 等工具。\n\n红外\n\n481\n串口应用\nirattach, irdadump, irdaping, irsend\ntelnet , ft p,\
