  ```\n\n\n\n开发者，让我们通过驱动开发者的视角，通过观察几个内核区域来熟悉一些基础内核概念。我们将学习内核定时器、同步机制和内存分配。但让我们先从高处开始我们的探险；浏览一下内核发出的启动信息，每当发现看起来有趣的内容时停下来。\n\
  \n### 启动\n\n图 2.1 显示了基于 x86 计算机的 Linux 启动序列。在基于 x86 的硬件上，Linux 启动是在 BIOS 从启动设备加载`主引导记录`（`MBR`）时开始的。位于\
  \ MBR 中的代码查看分区表，并从活动分区读取如 `GRUB`、`LILO` 或 `SYSLINUX` 等 Linux 引导程序。引导加载程序的最后阶段加载压缩的内核镜像并将控制权交给它。内核随后进行解压并启动。\n\
  \n基于 x86 的处理器有两种运行模式：实模式模式（`real` mode）和保护模式（`protected` mode）。在实模式模式下，你只能访问前 1MB\
  \ 的内存，而且没有任何没有任何保护。保护模式非常复杂，允许你利用处理器的许多高级功能（如分页）。CPU 在通往保护模式的途中必须经过实模式。\n\n第一级内核初始化是在实模式汇编代码中完成的。随后的启动由\
  \ `init/main.c` 中定义的函数 `start_kernel()` 在保护模式下执行，该文件在上一章中修改过。`start_kernel()` 从初始化\
  \ CPU 子系统开始。随后建立内存进程管理。接下来启动外设总线和 I/O 设备。启动序列的最后一步是调用 `init` 程序，它是所有 Linux 进程的父进程。`init`\
  \ 执行用户空间脚本以启动必要的内核服务。最后在控制台上创建终端并显示登录提示。\n\n```\n开机\nBIOS\n引导程序 (GRUB/LILO/…)\n\
  实模式内核\nx86 实模式\n*arch/x86/boot/pm.c*\n保护模式内核\nx86 保护模式\n*init* 进程\n用户进程和守护进程\n```\n\
  图 2.1 `基于 x86 硬件的 Linux 启动序列。`\n\n后续每个章节都是 x86 笔记本电脑在启动过程中生成的图 2.2 中的信息。如果你在其他架构上启动内核，语义和信息可能会发生变化。如果本节中的某些解释听起来相当晦涩，不要担心；这里的意图只是给你提供一个从\
  \ 100 英尺高处俯瞰的视角，让你初步感受内核的味道。这里顺带提到的许多概念稍后会详细介绍。\n\n## BIOS 提供的物理 RAM 映射\n\n内核从 BIOS\
  \ 组装系统内存映射，这是你看到的第一个启动信息之一：\n\nBIOS 提供的物理 RAM 映射：\n```\nBIOS-e820: 0000000000000000\
  \ - 000000000009f000 (usable)\n...\nBIOS-e820: 00000000ff800000 - 0000000100000000\
  \ (reserved)\n```\n图 2.2 `内核启动信息。`\n\n实模式初始化代码使用 BIOS `int 0x15` 服务以及功能号 `0xe820`（因此前面的消息中会有字符串\
  \ `BIOS-e820`）来获取系统内存映射。内存映射指示了预留和可用的内存范围，内核随后使用这些范围创建其空内存池。我们将在附录“Linux 与 BIOS”中的“实模式调用”部分进一步讨论\
  \ BIOS 提供的内存映射。\n\n通常可寻址的内核内存区域（`< 896MB`）称为低内存（`low memory`）。内核内存分配器 `kmalloc()`\
  \ 从该区域返回内存。896MB 之外的内存（称为高内存 `high memory`）只能通过特殊映射访问。在启动期间，内核会计算并显示这些内存区域的总页数。我们将在本章晚些时候深入研究内存区域。\n\
  \n## 内核命令行：\n\n```\nro root=/dev/hda1\n```\n\nLinux 引导程序通常会将命令行传递给内核。命令行中的参数类似于传递给\
  \ C 程序 `main()` 函数的 `argv[]` 列表，不同之处在于它们是传递给内核的。你可以在引导程序的配置文件中添加命令行参数，或在运行时从引导程序提示符提供它们。如果你使用\
  \ `GRUB` 引导程序，根据你的发行版，配置文件文件为 `*/boot/grub/grub.conf` 或 `*/boot/grub/menu.lst`。如果你是\
  \ `LILO` 用户，配置文件为 `*/etc/lilo.conf`。这里列出了 `grub.conf` 文件的示例（添加了注释）。如果你查看 `kernel\
  \ 2.6.23` 标题后的行，你就能弄清楚上述启动信息的来源：\n\n```\ndefault 0 #启动 2.6.23\ntimeout 5 #切换到运行级别\
  \ 3\ntitle kernel 2.6.23\nkernel /vmlinuz-2.6.23 root=/dev/hda1\n```\n758MB LOWMEM\
  \ Available\n\n\n\n\n```c\nticks = jiffies; /* 如你将在“内核定时器”章节中发现的，jiffies 变量包含了\n\
  自内核启动以来的定时器滴答次数，\n并在定时器中断\n处理程序中递增 */\nwhile (ticks == jiffies); /* 等待到下一个\njiffy\
  \ 的开始 */\nticks = jiffies;\n\n/* 延迟 */\n__delay(loops_per_jiffy);\n\n/* 等待时间是否超过了当前的\
  \ jiffy？如果\n没有，则继续 */\nticks = jiffies - ticks;\n\nif (ticks) break;\n\n}\n\nloops_per_jiffy\
  \ >>= 1; /* 这修复了最高位，并且是\nloops_per_jiffy 的下界 */\n```\n\n24 第 2 章 深入内核内部\n\n前面的代码首先假设\
  \ `loops_per_jiffy` 大于 4096，这相当于大约每秒执行一百万条指令（MIPS）的处理器速度。然后，它等待一个新的 `jiffy` 开始并执行延迟循环\
  \ `__delay(loops_per_jiffy)`。如果延迟循环持续时间超过了 `jiffy`，则 `loops_per_jiffy` 的旧值（通过向右位移一位获得）将固定其最高位（MSB）。否则，函数将通过检查是否能通过向左位移\
  \ `loops_per_jiffy` 获取 MSB 来继续执行。在内核确定了 `loops_per_jiffy` 的 MSB 后，它会对低位进行处理并按如下方式微调其精度：\n\
  \n```c\nloopbit = loops_per_jiffy;\n\n/* 逐渐处理低位 */\nwhile (lps_precision-- && (loopbit\
  \ >>= 1)) {\n    loops_per_jiffy |= loopbit;\n    ticks = jiffies;\n    while (ticks\
  \ == jiffies); /* 等待到下一个\n    jiffy 的开始 */\n    ticks = jiffies;\n    /* 延迟 */\n\
  \    __delay(loops_per_jiffy);\n    if (jiffies != ticks)\n        /* 长于 1 个 tick\
  \ */\n        loops_per_jiffy &= ~loopbit;\n}\n```\n\n前面的代码段落在延迟循环跨越 `jiffy` 边界时，计算出\
  \ `loops_per_jiffy` 低位的精确组合。这个校准值被用于推导出一个非科学的处理器速度衡量标准，称为 BogoMIPS。你可以将 BogoMIPS\
  \ 评分作为 CPU 运行速度的相对测量值。在基于 1.6GHz Pentium M 的笔记本电脑上，如前面的启动消息所示，延迟循环校准产生的 `loops_per_jiffy`\
  \ 值为 2394935。BogoMIPS 的获取方式如下：\n\n`BogoMIPS = loops_per_jiffy * 每秒 jiffies 数 * 内部延迟循环消耗的指令数（以百万为单位）\
  \ = (2394935 * HZ * 2) / (1 million) = (2394935 * 250 * 2) / (1000000) = 1197.46\
  \ (如前面的启动消息所示)`\n\n### 启动\n\n25\n\n我们将在本章稍后的“内核定时器”章节进一步讨论 `jiffies`、`HZ` 和 `loops_per_jiffy`。\n\
  \n### 检查 HLT 指令\n\n由于 Linux 内核支持多种硬件平台，因此启动代码会检查与架构相关的 bug。验证停止（HLT）指令的合理性就是此类检查之一。\n\
  \nx86 处理器支持的 HLT 指令会将 CPU 置于低功耗睡眠模式，直到下一次硬件中断发生。当内核想要将 CPU 置于空闲状态时，会使用 `HLT` 指令（参见\
  \ `arch/x86/kernel/process_32.c` 中定义的 `cpu_idle()` 函数）。\n\n对于问题的 CPU，可以使用 `no-hlt`\
  \ 内核命令行参数禁用 HLT 指令。如果开启了 `no-hlt`，内核在空闲时将进行忙等（busy-wait），而不是将 CPU 置于 HLT 状态以保持冷却。\n\
  \n前面的启动消息是在 `init/main.c` 中的启动代码调用 `include/asm-your-arch/bugs.h` 中定义的 `check_bugs()`\
  \ 时生成的。\n\n### NET: 注册的协议族 2\n\nLinux socket 层是一个统一接口，用户应用程序通过它访问各种网络协议。每个协议都使用分配给它的唯一族号（定义在\
  \ `include/linux/socket.h` 中）向 socket 层注册自己。前面消息中的族 2 代表 `AF_INET`（互联网协议）。启动消息中经常遇到的另一个注册协议族是\
  \ `AF_NETLINK`（族 16）。Netlink socket 提供了一种在用户进程和内核之间通信的方法。通过 netlink socket 实现的功能包括访问路由表和地址解析协议（ARP）表（完整用法列表请参见\
  \ `include/linux/netlink.h`）。相比系统调用，netlink socket 更适合完成此类任务，因为它们是异步的、实现更简单且支持动态链接的。\n\
  \n内核中常见的启用的另一个协议族是 `AF_UNIX` 或 UNIX 域套字。如 X Windows 等程序使用它们在同一系统上进行进程间通信。\n\n###\
  \ 释放 Initrd 内存：释放了 387k\n\n*Initrd* 是由引导加载程序加载的内存驻留磁盘镜像，用于存放根文件系统。由于内核运行在不同的硬件平台上上因此在基础内核中启用所有存储控制器的驱动程序是不可能的。使用\
  \ `initrd` 需要包含关联的文件系统驱动。\n\n26 第 2 章 深入内核内部\n\n2.6 内核包含一个名为 *initramfs* 的特性，相比\
  \ *initrd* 具有许多优势。与模拟磁盘（因此称为 *initdisk* 或 *initrd*）并承受缓存相关的开销不同，*initramfs* 像页缓存一样动态伸缩。你可以将初始根文件系统打包成压缩的\
  \ cpio 归档，并使用 `initrd=` 参数将其传递给内核，或者在内核配置期间使用 `INITRAMFS_SOURCE` 将其作为内核镜像的一部分构建。\n\
  \n对于后者，你可以提供 cpio 归档的文件名或包含 initramfs 的目录路径。在启动期间，内核会将文件提取到 initramfs（也称为 *rootfs*），并如果找到，则执行顶层\
  \ `/init` 程序。这种获取初始根文件系统的方法对于资源紧张的嵌入式平台特别有用。创建 initramfs，请使用 `mkinitramfs`。更多文档请参见\
  \ *Documentation/filesystems/ramfs-rootfs-initramfs.txt*。\n\n在这种情况下，我们通过使用 `initrd=`\
  \ 命令行向内核提供压缩的初始根文件系统 cpio 归档来使用 initramfs。在将归档内容解压到 rootfs 后，内核会释放归档所在的内存（在本例中为\
  \ 387K）并发布上述启动消息。释放的页面随后分配给请求内存的内核部分。正如我们将在第 18 章讨论的，initrd 和 initramfs 有时用于在开发期间存放嵌入式设备上的实际根文件系统。\n\
  \n2 cpio 是一种 UNIX 文件存档格式。你可以从 GNU.org/software/cpio 下载。\n\n### IO 调度器 Anticipatory\
  \ (默认)\n\nI/O 调度器的主要目标是通过最小化磁盘寻道时间（磁头从当前位置移动到目标位置的延迟）来增加系统吞吐量\n\n\n\n\n到感兴趣的磁盘扇区。2.6\
  \ 内核提供了四种不同的 I/O 调度器：\n\n`Deadline`、`Anticipatory`、`Complete Fair Queuing` 和 `Noop`。如前面的内核消息所示，内核将\
  \ `Anticipatory` 设置为默认 I/O 调度。我们将在第 14 章“块驱动程序”中介绍 I/O 调度。\n\n## 设置标准 PCI 资源\n\n\
  启动过程的下一阶段是探测并初始化 I/O 总线和外围控制器。内核通过遍历 PCI 总线探测 PCI 硬件，然后初始化其他 I/O 子系统。查看图 2.3 中的启动消息，可以找到关于\
  \ SCSI 子系统、USB 控制器、视频芯片（下方消息中为 855 北桥芯片组的一部分）、串口（本例中为 8250 UART）、PS/2 键盘和鼠标、软驱器、内存磁盘（ramdisk）、回环设备、IDE\
  \ 控制器（本例中为 ICH4 南桥芯片组的一部分）、触控板、以太控制器（本例中为 `e1000`）以及 PCMCIA 控制器的初始化公告。\n\n相应的 I/O\
  \ 设备标识通过 `→` 标记。\n\n本书将在单独的章节讨论这些许多驱动程序子系统。请注意，如果驱动程序作为可加载模块动态链接到内核，其中某些消息可能在启动过程的后期才会出现。\n\
  \n## EXT3-fs: 已挂载的文件系统\n\nEXT3 文件系统已成为 Linux 上的事实文件系统。它在老牌 EXT2 文件系统之上添加了一个日志层，以便在崩溃后快速恢复。其目标是恢复一致的文件系统状态，而无需经过耗费时间的文件系统检查\
  \ (`fsck`) 操作。EXT2 仍然是工作引擎，而 EXT3 层在将实际更改提交磁盘之前，会在名为 `journal` 的内存区域额外记录文件事务。EXT3\
  \ 与 EXT2 兼容，因此你可以为现有的 EXT2 文件系统添加 EXT3 封装，或剥离 EXT3 回到原始的 EXT2 文件系统。\n\n28 第 2 章\
