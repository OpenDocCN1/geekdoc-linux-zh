  \n# 集成电路协议 (I2C)\n\n集成电路，或 `I2C`（读作 *I squared C*）总线及其子集`系统管理总线`（`SMBus`）是同步串行接口，广泛存在于台式机和嵌入式设备中。让我们通过实现示例驱动来访问\
  \ `I2C EEPROM` 和 `I2C RTC`，了解内核如何支持 `I2C/SMBus` 主适配器和客户端设备。在本章结束之前，让我们也查看内核支持的另外两种串行接口：串行外接口\
  \ `SPI`（通常读作 *spy*）总线和单线制总线。\n\n所有这些串行接口（`I2C`、`SMBus`、`SPI` 和 `1-wire`）共享两个共同特征：\n\
  \n- 交换的数据量小。\n- 需要的数据传输率较低。\n\n## 什么是 I2C/SMBus？\n\n`I2C` 是一种串行总线，广泛用于台式机和笔记本电脑，将处理器与\
  \ `EEPROM`、音频解码器以及监控温度和电源电压等参数的专用芯片连接起来。此外，`I2C` 还广泛用于嵌入式设备，与 `RTC`、智能电池电路、多路复用器、端口扩展、光收发器和其他类似设备通信。由于许多微控制器都支持\
  \ `I2C`，如今市场上有很多廉价的 `I2C` 设备。\n\n`I2C` 和 `SMBus` 是一种主从协议，通信发生在`主机适配器`（或`主机控制器`）与`客户端设备`（或`从设备`）之间。`主机适配器`通常是台式机南桥芯片的一部分，也是嵌入式设备上控制器的一部分。\n\
  \n## I2C 核心\n\n`I2C core` 是一个代码库，由主机适配器驱动和客户端驱动可用的例程和数据结构组成。核心中的通用代码使驱动开发人员的工作变得更容易。核心还提供了一种间接层，使得客户端驱动独立于主机适配器，当客户端设备用于带有不同\
  \ I2C 主适配器的板卡时，它们可以在无需更改的情况下工作。这种核心层及其辅助收益的哲学也适用于内核中的许多其他设备类，例如 PCMCIA、PCI 和 USB。\n\
  \n除了核心之外，基础设施还包括以下内容：\n\n- I2C 主适配器的设备驱动。它们属于总线驱动领域，通常由一个*适配器*（或*控制器*）驱动和一个*算法*驱动程序组成。前者使用后者与\
  \ I2C 总线通信。\n- I2C 客户端设备的设备驱动。\n- `i2c-dev`，允许实现用户态 I2C 客户端驱动程序。\n\n你更有可能实现客户端驱动而不是适配器或算法驱动，因为\
  \ I2C 设备的数量远多于 I2C 主适配器。因此，在本章中我们将局限于客户端驱动。\n\n\n\n\n\n代码片段展示了与 I2C EEPROM 通信以及总线上发生的相应的事务。这些事务是在运行代码片段时通过连接\
  \ I2C 总线分析仪捕获的。代码使用了用户态 I2C 函数。（我们将在第 19 章“用户空间驱动程序”中详细讨论用户态 I2C 编程。）\n\n### 列表\
  \ 8.1 I2C-2C 总线上的事务\n\n```c\n/* ... */\n\n/*\n* 连接到 EEPROM。0x50 是设备地址。\n* smbus_fp\
  \ 是指向 SMBus 设备的指针指针。\n*/\nioctl(smbus_fp, 0x50, slave);\n\n/* 在 EEPROM 内存偏移量 0 处写入一个字节\
  \ (0xAB) */\ni2c_smbus_write_byte_data(smbus_fp, 0, 0xAB);\n\n/*\n* 这是写入后在总线上观察到的\n\
  * 相应的事务：\n*** S 0x50 Wr [A] 0 [A] 0xAB [A] P**\n*\n* **S** 是起始位，**0x50** 是 7 位从机地址\
  \ (0101000b)，\n* **Wr** 是写命令 (0b)，**A** 是主机从从机接收到的\n* 接受位（或确认位），**0** 是\n* 从机设备上的地址偏移量，在该处写入字节，\n\
  * **0xAB** 是要写入的数据，而 **P** 是停止位。\n* 位于 **[]** 内的数据是从从机发送到\n* 主机的，而其余位由主机发送到\n* 从机。\n\
  */\n\n/* 从 EEPROM 偏移量 0 处读取一个字节 */\nres = i2c_smbus_read_byte_data(smbus_fp, 0);\n\
  \n/*\n* 这是读取后在总线上观察到的\n* 相应的事务：\n*** S 0x50 Wr [A] 0 [A] S 0x50 Rd [A] [0xAB] NA\
  \ P**\n*\n* 位的解释与之前相同，不同之处\n* **Rd** 代表读命令 (1b)，**0xAB** 是从从机接收到的数据，\n* 而 **NA**\
  \ 是非接受位（或主机发送到从机的\n* 确认位）。\n*/\n```\n\n设备示例：EEPROM\n\n我们的第一个示例客户端设备是位于 I2C 总线上的\
  \ EEPROM，如图 8.1 所示。几乎所有的笔记本电脑和台式电脑都有这样一个 EEPROM，用于存储 BIOS 配置信息。示例 EEPROM 有两个内存库。驱动程序导出与每个内存库对应的\
  \ `/dev` 接口：`/dev/eep/0` 和 `/dev/eep/1`。应用程序通过操作这些节点来与 EEPROM 交换数据。\n\n每个 I2C/SMBus\
  \ 客户端设备都分配有一个作为设备标识符的从机地址。示例中的 EEPROM 响应两个从机地址：`SLAVE_ADDR1` 和 `SLAVE_ADDR2`，每个库一个。\n\
  \n示例驱动程序使用了与 SMBus 的 I2C 命令，因此它可以同时适用于 I2C 和 SMBus EEPROM。\n\n### 初始化\n\n与所有的驱动类一样，I2C\
  \ 客户端驱动程序也拥有一个 `init()` 入口。初始化包括分配数据结构、向 I2C 核心注册驱动程序，以及挂载 sysfs 和 Linux 设备模型。这在列表\
  \ 8.2 中完成。\n\n### 列表 8.2 初始化 EEPROM 驱动程序\n\n```c\n/* 驱动入口点 */\nstatic struct file_operations\
  \ eep_fops = {\n    .owner = THIS_MODULE,\n    .llseek = eep_llseek,\n    .read\
  \ = eep_read,\n    .ioctl = eep_ioctl,\n    .open = eep_open,\n    .release = eep_release,\n\
  \    .write = eep_write,\n};\n\nstatic dev_t dev_number; /* 分配的设备号 */\nstatic struct\
  \ class *eep_class; /* 设备类 */\n\n/* 每个驱动程序支持的每个\n* 内存库的设备客户端数据结构\n */\nstruct eep_bank\
  \ {\n    struct i2c_client *client; /* 此内存库的 I2C 客户端 */\n    unsigned int addr;\
  \ /* 该库的从机地址 */\n    unsigned short current_pointer; /* 文件指针 */\n    int bank_number;\
  \ /* 实际内存库编号 */\n    /* ... */ /* 自旋锁、慢速设备的数据缓存... */\n};\n\n#define NUM_BANKS 2\
  \ /* 支持的两个库 */\n#define BANK_SIZE 2048 /* 每个库的大小 */\nstruct ee_bank *ee_bank_list;\
  \ /* 私有数据结构列表，每个库一个 */\n\n/*\n* 设备初始化\n */\nint __init\neep_init(void)\n{\n    int\
  \ err, i;\n    /* 分配每个设备的数据结构 ee_bank */\n    ee_bank_list = kmalloc(sizeof(struct\
  \ ee_bank)*NUM_BANKS, GFP_KERNEL);\n    memset(ee_bank_list, 0, sizeof(struct ee_bank)*NUM_BANKS);\n\
  \n    /* 注册并创建 /dev 接口 */\n    if (alloc_chrdev_region(&dev_number, 0, NUM_BANKS,\
  \ \"eep\") < 0) {\n        printk(\"Can't register\\n\");\n        return -1;\n\
  \    }\n    eep_class = class_create(THIS_MODULE, \"eep\");\n    if (IS_ERR(eep_class))\
  \ {\n        printk(\"Can't create class\\n\");\n        return PTR_ERR(eep_class);\n\
  \    }\n\n    for (i=0; i < NUM_BANKS; i++) {\n        /* 使用 eep 操作初始化 cdev */\n\
  \        cdev_init(&ee_bank[i].cdev, &eep_fops);\n        /* 将 cdev 连接到主设备号 */\n\
  \        if (cdev_add(&ee_bank[i].cdev, MKDEV(dev_number, i)) < 0) {\n         \
  \   printk(\"Bad cdev\\n\");\n            goto err_cdev;\n        }\n        /*\
  \ 在 /etc/udev/rules.d/ 下创建设备节点 */\n        if (!device_create(eep_class, NULL, MKDEV(dev_number,\
  \ i), NULL, \"eep%d\", i)) {\n            printk(\"Can't create device\\n\");\n\
  \            goto err_device;\n        }\n    }\n    printk(\"EEPROM Driver Initialized\\\
  n\");\n    return 0;\n\nerr_device:\n    // ... 清理逻辑\nerr_cdev:\n    // ... 清理逻辑\n\
  }\n```\n\n这创建了 `/dev/eep/0` 和 `/dev/eep/1` 接口。应用程序操作这些节点与 EEPROM 交换数据。列表 8.3 实现了\
  \ EEPROM 驱动的 `open()` 方法。\n\n```c\nint\neep_open(struct inode *inode, struct file\
  \ *file)\n{\n    /* 要打开的 EEPROM 库 */\n    n = MINOR(file->f_dentry->d_inode->i_dev);\n\
  \    /* 将私有数据存储在 private_data 中 */\n    file->private_data = (struct ee_bank *)ee_bank_list[n];\n\
  \    /* ... */\n}\n```\n\n\n\n\n以及总线 2 上的温度传感器，两者都响应相同的从机地址。\n\n### 3. 主机控制器遍历总线，寻找第\
  \ 2 步中指定的从机设备。为了实现这一点，它会生成一个总线事务，例如 `S SLAVE_ADDR Wr`，其中 `S` 是起始位，`SLAVE_ADDR` 是设备数据表中所指定的关联\
  \ 7 位从机地址，而 `Wr` 是“总线事务”节中描述的写命令。如果总线上存在一个正常工作的从机设备，它将通过发送确认位（`[A]`）来做出响应。\n\n###\
  \ 4. 如果主机控制器在第 3 步检测到从机设备，I2C 核心将调用第 2 步中通过 `i2c_probe()` 的第三参数提供的 `attach()` 例程。对于\
  \ EEPROM 驱动程序，该例程是 `eep_attach()`，它注册一个每个设备的客户端数据结构，如列表 8.5 所示。如果你的设备期望一个初始编程序列（例如，I2C\
  \ 数字显示接口传输器芯片上的寄存器在芯片开始工作之前必须进行初始化），请在此例程中执行这些操作。\n\n#### 列表 8.4 探测 EEPROM 库的存在\n\
  ```c\n#include <linux/i2c.h>\n\n/* EEPROM 有两个内存库，地址分别为 SLAVE_ADDR1\n* 和 SLAVE_ADDR2\n\
  */\nDevice Example: EEPROM\n243\nstatic unsigned short normal_i2c[] = {\n    SLAVE_ADDR1,\
  \ SLAVE_ADDR2, I2C_CLIENT_END\n};\nstatic struct i2c_client_address_data addr_data\
  \ = {\n    .normal_i2c = normal_i2c,\n    .probe = ignore,\n    .ignore = ignore,\n\
  \    .forces = ignore,\n};\nstatic int\neep_probe(struct i2c_adapter *adapter)\n\
  {\n    /* 回调函数 eep_attach() 显示\n    * 在列表 8.5 中\n    */\n    return i2c_probe(adapter,\
  \ &addr_data, eep_attach);\n}\n```\n\n#### 列表 8.5 挂载客户端\n```c\nint\neep_attach(struct\
  \ i2c_adapter *adapter, int address, int kind)\n{\n    static struct i2c_client\
  \ *eep_client;\n    eep_client = kmalloc(sizeof(*eep_client), GFP_KERNEL);\n   \
  \ eep_client->driver = &eep_driver; /* 在列表 8.2 中注册 */\n    eep_client->addr = address;\
  \ /* 检测到的地址 */\n    eep_client->adapter = adapter; /* 主机适配器 */\n    eep_client->flags\
  \ = 0;\n    strlcpy(eep_client->name, \"eep\", I2C_NAME_SIZE);\n    /* 填充关联的每个设备数据结构中的字段\
  \ */\n    /* ... */\n    /* 挂载 */\n    i2c_attach_client(new_client);\n}\n```\n\n\
  244 第 8 章 协议\n\n### 检查适配器能力\n每个主机适配器可能受到一组约束条件的限制。适配器可能不支持表 8.1 中包含的所有命令。例如，它可能允许\
  \ SMBus 的 `read_word` 命令但不支持 `read_block` 命令。客户端驱动程序必须在使用命令之前检查适配器是否支持该命令。\n\nI2C\
  \ 核心提供了两个函数来实现此：\n1. `i2c_check_functionality()` 检查是否支持某个特定功能。\n2. `i2c_get_functionality()`\
  \ 返回一个包含所有支持功能的掩码。\n\n查看 `include/linux/i2c.h` 获取可能的功能列表。\n\n### 访问设备\n要从 EEPROM\
  \ 读取数据，首先从与设备节点关联的私有数据字段获取其调用线程的信息。接下来，使用 I2C 核心提供的兼容 SMBus 的数据访问例程（表 8.1 显示了可用函数）读取数据。最后，将数据发送到用户空间并增加内部文件指针，以便下次\
  \ `read()/write()` 操作从上一次结束的地方开始。这些步骤由列表 8.6 执行。为了方便起见，列表省略了健全性和错误检查。\n\n#### 表\
  \ 8.1 I2C 核心提供的兼容 SMBus 的数据访问函数\n| 函数 | 用途 |\n| :--- | :--- |\n| `i2c_smbus_read_byte()`\
  \ | 从设备读取单个字节，不指定位置偏移量。使用与之前发送命令相同的偏移量。 |\n| `i2c_smbus_write_byte()` | 以与之前发送命令相同的内存偏移量向设备发送单个字节。\
  \ |\n| `i2c_smbus_write_quick()` | 向设备发送单个位（以代替列表 8.1 所示的 `Rd/Wr` 位）。 |\n| `i2c_smbus_read_byte_data()`\
  \ | 在指定的偏移量从设备读取单个字节。 |\n| `i2c_smbus_write_byte_data()` | 在指定的偏移量向设备发送单个字节。 |\n\
  | `i2c_smbus_read_word_data()` | 从指定的偏移量读取 2 字节。 |\n| `i2c_smbus_write_word_data()`\
  \ | 向指定的偏移量发送 2 字节。 |\n| `i2c_smbus_read_block_data()` | 从指定的偏移量读取一块数据。 |\n| `i2c_smbus_write_block_data()`\
  \ | 向指定的偏移量发送一块数据（<= 32 字节）。 |\n\n#### 列表 8.6 从 EEPROM 读取\n```c\nDevice Example:\
  \ EEPROM\n245\nssize_t\neep_read(struct file *file, char *buf,\nsize_t count, loff_t\
  \ *ppos)\n{\n    int i, transferred, ret;\n    char ebuf[SIZE];\n    /* 获取此库的私有数据\
  \ */\n    struct ee_bank *my_bank = (struct ee_bank *)file->private_data;\n    /*\
  \ 检查是否支持 smbus_read() 功能 */\n    if (i2c_check_functionality(my_bank->client, I2C_FUNC_SMBUS_READ_DATA))\
  \ {\n        /* 读取数据\n        while (transferred < count) {\n            ret = i2c_smbus_read_word_data(my_bank->client,\
  \ my_bank->current_pointer+i);\n            ebuf[i++] = (u8)(ret & 0xFF);\n    \
  \        ebuf[i++] = (u8)(ret >> 8);\n            transferred += 2;\n        }\n\
  \        /* 将拷贝到用户空间并增加\n        文件指针。 */\n        if (copy_to_user(buf, ebuf, transferred))\
  \ {\n            my_bank->current_pointer += transferred;\n        }\n    }\n  \
  \  return transferred;\n}\n```\n246 第 8 章 协议\n\n写入设备的方法类似，只是使用了 `i2c_smbus_write()`\
  \ 函数。要从用户空间访问 EEPROM 库，请开发操作 `od -a /dev/eep0` 的应用程序。\n\n作为一项练习，尝试修改 EEPROM 驱动程序，为\
  \ EEPROM 库创建 */sys* 接口而不是 */dev* 接口。你可以复用第 5 章列表 5.7“使用 Sysfs 控制并行板”中的代码来帮助你完成这一任务。\n\
  \n247 设备示例：实时时钟\n\n现在让我们来看一个通过 I2C 总线连接到嵌入式控制器的 RTC 芯片示例。连接图如图 8.3 所示。\n\n\n\n##\
  \ I2C 总线\n\n## 嵌入式\nSDA/SCL\n\n### RTC\n### 控制器\n电池\n备份\nCLK\nGND\n\n8.3 嵌入式系统上的\
  \ I2C RTC\n\n假设 RTC 的 I2C 从机地址为 `0x60`，其寄存器布局如表 8.2 所示。\n\n### 表 8.2 I2C RTC 寄存器布局\n\
  \n| 寄存器 | 名称 | 描述 | 偏移量 |\n| :--- | :--- | :--- | :--- |\n| `RTC_HOUR_REG` | 小时计数器\
  \ | 0x0 |\n| `RTC_MINUTE_REG` | 分钟计数器 | 0x1 |\n| `RTC_SECOND_REG` | 秒计数器 | 0x2 |\n\
  | `RTC_STATUS_REG` | 标志和中断状态 | 0x3 |\n| `RTC_CONTROL_REG` | 启用/禁用 RTC | 0x4 |\n\n\
  让我们基于之前讨论过的 EEPROM 驱动来编写该芯片的驱动。我们将假设 I2C 客户端驱动架构、从机注册和 I2C 核心函数已经存在，仅实现与 RTC 通信的代码。\n\
  \n248 第 8 章 整合电路协议\n\n当 I2C 核心在 I2C 总线上检测到具有 RTC 从机地址 (`0x60`) 的设备时，它会调用 `myrtc_attach()`。该调用链与列表\
  \ 8.5 中的 `eep_attach()` 类似。假设你需要在 `myrtc_attach()` 中执行以下芯片初始化：\n\n1. 清空 RTC 状态寄存器\
  \ (`RTC_STATUS_REG`)。\n2. 通过开启 RTC 控制寄存器 (`RTC_CONTROL_REG`) 中的适当位位来启动 RTC（如果它尚未运行的话）。\n\
  \n为了实现这一点，让我们构建一个 `i2c_msg` 并使用 `i2c_transfer()` 在总线上生成 I2C 传输事务。这种传输机制是 I2C 特有的，不兼容\
  \ SMBus。要写入前文提到的的两个 RTC 寄存器，你需要构建两个 `i2c_msg` 消息。第一条消息设置寄存器偏移量。在我们的情况下，它是 3，即 `RTC_STATUS_REG`\
  \ 的偏移量。第二条消息携带要写入指定偏移处的所需的字节数。在此语文中，它传输了 2 个字节，分别发送到 `RTC_STATUS_REG` 和 `RTC_CONTROL_REG`。\n\
  \n```c\n#include <linux/i2c.h> /* 用于 struct i2c_msg */\n\nint myrtc_attach(struct\
  \ i2c_adapter *adapter, int addr, int kind)\n{\n    u8 buf[2];\n    int offset =\
  \ RTC_STATUS_REG; /* 状态寄存器位于 */\n    struct i2c_msg rtc_msg[2];\n    /* 向 RTC 写入\
  \ 1 字节偏移信息 */\n    rtc_msg[0].addr = addr; /* 从机地址。在我们的情况下，这是 0x60 */\n    rtc_msg[0].flags\
  \ = I2C_M_WR; /* 写命令 */\n    rtc_msg[0].buf = &offset; /* 下次事务的寄存器偏移量 */\n    rtc_msg[0].len\
  \ = 1; /* 偏移量长度为 1 字节 */\n    /* 在之前的 i2c_msg 编程的偏移量处写入 2 字节数据（状态和控制寄存器的内容） */\n\
  \    rtc_msg[1].addr = addr; /* 从机地址 */\n    rtc_msg[1].flags = I2C_M_WR; /* 写命令\
  \ */\n    rtc_msg[1].buf = &buf[0]; /* 要写入控制和状态寄存器的数据 */\n    rtc_msg[1].len = 2;\
  \ /* 两个寄存器值 */\n    buf[0] = 0; /* 清零状态寄存器 */\n    buf[1] |= ENABLE_RTC; /* 开启启动\
  \ RTC 的控制器位 */\n    /* 生成对应消息的总线事务 */\n    i2c_transfer(adapter, rtc_msg, 2);\n\
  \    /* ... */\n    printk(\"My RTC Initialized\\n\");\n}\n```\n\n现在 RTC 已经初始化并开始计时，你可以通过读取\
  \ `RTC_HOUR_REG`、`RTC_MINUTE_REG` 和 `RTC_SECOND_REG` 的内容来获取当前时间。操作方法如下：\n\n```c\n\
  #include <linux/rtc.h> /* 用于 struct rtc_time */\n\nint myrtc_gettime(struct i2c_client\
  \ *client, struct rtc_time *r_t)\n{\n    u8 buf[3]; /* 用于携带小时/分/秒的空间 */\n    int\
  \ offset = 0; /* 计时寄存器从偏移 0 开始 */\n    struct i2c_msg rtc_msg[2];\n    /* 向 RTC\
  \ 写入 1 字节偏移信息 */\n    rtc_msg[0].addr = addr; /* 从机地址 */\n    rtc_msg[0].flags =\
  \ 0; /* 写命令 */\n    rtc_msg[0].buf = &offset; /* 下次事务的寄存器偏移量 */\n    rtc_msg[0].len\
  \ = 1; /* 偏移量长度为 1 字节 */\n    /* 从偏移 0 处获取 3 字节数据以读取当前时间（即从 RTC_HOUR_REG, RTC_MINUTE_REG\
  \ 和 RTC_SECOND_REG） */\n    rtc_msg[1].addr = addr; /* 从机地址 */\n    rtc_msg[1].flags\
  \ = I2C_M_RD; /* 读命令 */\n    rtc_msg[1].buf = &buf[0]; /* 要从小时、分、秒寄存器读取的数据 */\n\
  \    rtc_msg[1].len = 3; /* 三个寄存器 */\n    /* 生成对应消息的总线事务 */\n    i2c_transfer(adapter,\
  \ rtc_msg, 2);\n    /* ... */\n    return 0;\n}\n```\n\n设备示例：实时钟\n249\n\n\n\n\n\
  `/hwmon/` 目录，而不是 `/drivers/i2c/chips/`。一个例子是国家半导体（National Semiconductor）的 LM87\
  \ 芯片，它可以监控多个电压、温度和风扇。查看 `drivers/hwmon/lm87.c` 可以了解其驱动实现。1000 到 1999 I2C 驱动 ID 留给传感器芯片（查看\
  \ `include/linux/i2c-id.h`）。\n\n一些传感器芯片通过 ISA/LPC 总线而非 I2C/SMBus 与 CPU 接口。另一些芯片产生模拟输出，通过`模数转换器`（`ADC`）到达\
  \ CPU。此类芯片的驱动程序与 I2C 传感器驱动共享 `drivers/hwmon/` 目录。非 I2C 传感器驱动的一个示例是 `drivers/hwmon/hdaps.c`，它是我们在第\
  \ 7 章“输入驱动程序”中讨论过的某些 IBM/联想笔记本电脑中加速度计的驱动。另一个非 I2C 传感器示例是华邦（Winbond）83627HF 超 I/O\
  \ 芯片，它由 `drivers/hwmon/w83627hf.c` 驱动。\n\n### 串行外接口总线\n\n`串行外接口`（`SPI`）总线是一种类似于\
  \ I2C 的串行主从接口，并内置在许多微控制器中。它使用四根线（而 I2C 使用两根）：`串行时钟`（`SCLK`）、`片选`（`CS`）、`主出从`（`MOSI`）和`主入从`（`MISO`）。`MOSI`\
  \ 用于将数据移入从设备，`MISO` 用于从从设备移数据。由于 SPI 总线具有传输接收数据的专用线路，它可以全双工模式运行，与 I2C 总线不同。SPI 的典型运行速度在兆赫范围内，而\
  \ I2C 在千赫范围内，因此前者具有更高的吞吐量。\n\n目前市场上有的 SPI 外设包括`射频`（`RF`）芯片、智能卡接口、EEPROMs、RTC、触摸传感器和\
  \ ADC。内核提供了一个用于在 SPI 总线上上传输消息的核心 API。一个典型的 SPI 客户端驱动程序执行以下操作：\n\n1. 在 SPI 核心注册 `probe()`\
  \ 和 `remove()` 方法。可选地注册 `suspend()` 和 `resume()` 方法：\n\n```c\n#include <linux/spi/spi.h>\n\
  \nstatic struct spi_driver myspi_driver = {\n    .driver = {\n        .name = \"\
  myspi\",\n        .bus = &spi_bus_type,\n        .owner = THIS_MODULE,\n    },\n\
  \    .probe = myspidevice_probe,\n    .remove = __devexit_p(myspidevice_remove),\n\
  };\nspi_register_driver(&myspi_driver);\n```\n\nSPI 核心创建一个与此设备对应的 `spi_device` 结构，并在调用注册的驱动方法时将其作为参数传递。\n\
  \n2. 使用 `spi_sync()` 和 `spi_async()` 等访问函数与 SPI 设备交换消息。前者等待操作完成，而后者在消息传输完成时异步触发已注册的回调程序的调用。这些数据访问例程从合适的地方调用，例如\
  \ SPI 中断处理程序、sysfs 方法或定时器处理程序。以下代码段说明了 SPI 消息的提交：\n\n```c\n#include <linux/spi/spi.h>\n\
  \nstruct spi_device *spi; /* SPI 设备的表示 */\nstruct spi_transfer xfer; /* 包含传输缓冲区细节\
  \ */\nstruct spi_message sm; /* spi_transfer 分段的序列 */\nu8 *command_buffer; /* 要传输的数据\
  \ */\nint len; /* 要传输的数据长度 */\n\nspi_message_init(&sm); /* 初始化 spi_message */\n\
  xfer.tx_buf = command_buffer; /* 设备特定数据 */\nxfer.len = len; /* 数据长度 */\nspi_message_add_tail(&xfer,\
  \ &sm); /* 添加消息 */\nspi_sync(spi, &sm); /* 阻塞传输请求 */\n```\n\n对于一个示例 SPI 设备，考虑我们在第\
  \ 7 章中简要讨论过的 ADS7846 触摸屏控制器。该驱动程序执行以下操作：\n\n1. 使用 `spi_register_driver()` 在 SPI\
  \ 核心注册 `probe()`、`remove()`、`suspend()` 和 `resume()` 方法。\n2. `probe()` 方法使用 `input_register_device()`\
  \ 将驱动程序注册到输入子系统，并使用 `request_irq()` 请求 IRQ。\n3. 驱动程序使用 `spi_async()` 从其中断处理程序收集触摸坐标。该函数在\
  \ SPI 消息传输完成时触发已注册的回调程序的调用。\n4. 回调函数反通过 `input_report_abs()` 和 `input_report_key()`\
  \ 通过事件接口 `/dev/input/eventX` 报告触摸坐标和点击，如第 7 章所述。如 X Windows 和 gpm 等应用程序可以无缝地与事件接口工作并响应触摸输入。\n\
  \n通过抖动 I/O 引脚使其与协议通信的驱动程序被称为`位带`（`bit-banging`）驱动程序。关于 SPI 位带驱动的示例，请查看 `drivers/spi/spi_butterfly.c`，它是用于与构建的\
  \ `Butterfly` 板上的 DataFlash 芯片通信的驱动程序。\n\n\n\n\n\n`drivers/i2c/busses/` 目录包含适配器驱动，`drivers/i2c/algos/`\
  \ 目录包含算法驱动，而 `drivers/i2c/chips/` 目录包含客户端驱动。你也可以在源码树的其他区域找到客户端驱动。例如，`drivers/sound/`\
  \ 目录包含了使用 I2C 控制接口的音频芯片组驱动程序。请查看 `Documentation/i2c/` 目录以获取提示和更多示例。\n\n内核 SPI 服务函数位于\
  \ `drivers/spi/spi.c` 中。ADS7846 触摸屏控制器的 SPI 驱动实现在 `drivers/input/touchscreen/ads7846.c`\
  \ 中。第 17 章“存储技术设备”中讨论的 MTD 子系统实现了 SPI 闪存芯片的驱动。一个示例是 `drivers/mtd/devices/mtd_dataflash.c`，它是访问\
  \ Atmel DataFlash SPI 芯片的驱动。\n\n`drivers/w1/` 目录包含了内核对 `w1` 协议的支持。`w1` 接口主机控制器端的驱动位于\
  \ `drivers/w1/masters/`，而 `w1` 从机驱动存在于 `drivers/w1/slaves/`。\n\n表 8.3 总结了本章使用的主要数据结构及其在内核树中的位置。表\
  \ 8.4 列出了你在本章中使用的主要内核编程接口以及它们定义的所在位置。\n\n### 表 8.3 数据结构总结\n\n| 数据结构 | 位置 | 描述 |\n\
