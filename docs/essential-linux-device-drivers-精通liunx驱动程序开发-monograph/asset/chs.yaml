  对于大量的低速 I2C 设备，从用户空间驱动它们是有意义的。\n\n`i2c-dev` 模块使得开发用户态 I2C/SMBus 设备驱动程序成为可能。\n\n\
  用户空间代码可以通过设备节点访问 I2C 主机适配器。要操作第 `n` 个适配器，请打开 `/dev/i2c-n.*`。在你获得与主机适配器设备节点关联的文件描述符后，可以通过\
  \ `ioctl` 命令将其连接到连接上面的特定从机设备。然后，你可以使用一系列数据访问例程的服务与从机设备交换数据。\n\n列表 19.7 是一个简单的用户态驱动程序，它在用户空间对\
  \ I2C EEPROM 执行常用操作。该 EEPROM 与第 8 节讨论的相同，具有两个存储库，且每个库对应一个从机地址。\n\n该列表使用了 `i2c-dev.h`\
  \ 中的内联函数来操作与存储库相关的设备节点。从 `www.lm-sensors.org` 下载 `lm-sensors` 包（在第 8 节中讨论过）来获取此头文件。该文件包含了第\
  \ 8 节表 8.1 列出的所有内核空间 I2C 访问函数的用户空间等效函数。\n\n列表 19.7 用户态 I2C/SMBus 驱动\n\n```c\n#include\
  \ <linux/i2c.h>\n#include <linux/i2c-dev.h>\n\n/* 存储库的总线地址 */\n#define SLAVE_ADDR1\
  \ 0x60\n#define SLAVE_ADDR2 0x61\n\nint main(int argc, char *argv[])\n{\n    /*\
  \ 打开主机适配器 */\n    if ((smbus_fp = open(\"/dev/i2c-0\", O_RDWR)) < 0) {\n       \
  \ exit(1);\n    }\n    /* 连接到第一个存储库 */\n    if (ioctl(smbus_fp, I2C_SLAVE, SLAVE_ADDR1)\
  \ < 0) {\n        exit(1);\n    }\n    /* ... */\n\n    /* 从设备转储数据 */\n    for (reg=0;\
  \ reg < length; reg++) {\n        /* 查看 lm-sensors 包中的 i2c-dev.h 以获取\n         \
  \  以下内联函数的实现 */\n        res = i2c_smbus_read_byte_data(smbus_fp, (unsigned char)\
  \ reg);\n        if (res < 0) {\n            exit(1);\n        }\n        /* 转储数据\
  \ */\n        /* ... */\n    }\n    /* ... */\n    /* 切换到存储库 2 */\n    if (ioctl(smbus_fp,\
  \ I2C_SLAVE, SLAVE_ADDR2) < 0) {\n        exit(1);\n    }\n    /* 清除存储库 2 */\n \
  \   for (reg=0; reg < length; reg+=2){\n        i2c_smbus_write_word_data(smbus_fp,\
  \ (unsigned char) reg, 0x0);\n    }\n    /* ... */\n    close(smbus_fp);\n}\n```\n\
  \n### UIO\n\n从 2.6.23 版本开始，内核包含一个名为 `UIO`（用户空间 IO）的子系统，它简化了某些用户态驱动的实现。`UIO` 的意图是允许诸如中断处理等任务的骨干内核驱动开发，并将大部分设备\
  \ I/O 逻辑推到用户空间。`UIO` 对于某些类工业 I/O 卡特别别重要。\n\n查看 `drivers/uio/` 目录下的 `UIO` 源码。在 `Documentation/DocBook/uio-howto.tmpl.`\
  \ 下提供了用户指南。探索 `UIO` 超出了本章的范围。\n\n## 查看源码\n\nLinux 调度器位于 `kernel/sched.c`。SCSI 通用实现实现在\
  \ `drivers/scsi/sg.c` 中，而 `drivers/usb/core/devio.c` 负责支持用户态 USB 驱动。支持用户态 I2C 编程的\
  \ `i2c-dev` 驱动位于 `drivers/i2c/i2c-dev.c`。\n\n表 19.1 包含了本章使用的主要数据结构，表 19.2 列出了我们用于辅助用户态驱动程序开发的函数。\n\
  \n### 表 19.1 数据结构总结\n\n| 数据结构 | 位置（用户空间） | 描述 |\n| :--- | :--- | :--- |\n| `sched_param`\
  \ | `/usr/include/bits/sched.h` | 与调度优先级相关的信息。 |\n| `fb_var_screeninfo` | `/usr/include/linux/fb.h`\
  \ | 用于操作帧缓冲区。包含可变屏幕信息，如分辨率和像素时。更多细节见第 11 节。 |\n| `sg_io_hdr_t` | `/usr/include/scsi/sg.h`\
  \ | 管理 SCSI 通用设备的信息。 |\n| `usb_dev_handle` | `libusb` 包中的头文件 | 从用户空间操作 USB 设备的结构。\
  \ |\n| `usb_bus` | | | |\n\n#### 表 19.2 用户态函数总结\n\n| 用户态函数 | 描述 |\n| :--- | :---\
  \ |\n| `sched_getparam()` | 获取与给定进程相关的调度参数 |\n| `sched_setscheduler()` | 设置与给定进程相关的调度参数\
  \ |\n| `mlockall()` | 将调用进程的页锁定在内存中，从而避免缺错误 |\n| `ioperm()` | 控制对前 0x3FF 个 I/O 端口的访问权限\
  \ |\n| `iopl()` | 修改调用进程的 I/O 权限 |\n| `outb()/outw()/outl()` | 向指定端口输出字节/字/长字 |\n\
  | `inb()/inw()/inl()` | 从指定端口输入字节/字/长字 |\n| `mmap()` | 将文件或设备地址区域与一段用户虚拟内存关联 |\n\
  | `msync()` | 刷新对 mmap 内存区域所所的更改 |\n| `munmap()` | `mmap()` 的反操作 |\n| `usb_init()`\
  \ | `libusb` 库提供的函数，帮助你通过 usb 进行操作 |\n| `usb_find_buses()` | `usbfs` |\n| `usb_find_devices()`\
  \ | |\n| `usb_open()` | |\n| `usb_control_msg()` | |\n| `usb_close()` | |\n| `i2c_smbus_read_byte_data()`\
  \ | 作为 `lm-sensors` 包一部分的用户态 I2C/SMBus 数据访问例程 |\n| `i2c_smbus_write_word_data()`\
  \ | |\n\n\n\n\n让我们为一个尚未支持的内存控制器添加 EDAC 支持。假设你正在将 Linux 安装到一种嵌入式 x86 衍生医疗级设备上。你板上的北桥芯片（参见第\
  \ 12 章“视频驱动程序”侧边栏“北桥”，其中包含了内存控制器）是 `Intel 855GME`，它具备 ECC 报告能力。系统中连接到 `855GME` 的所有\
  \ DRAM 库都是 ECC 芯片，因为这是一个生命关键型设备。EDAC 尚未支持 `855GME`，所以让我们尝试实现它。\n\nECC DRAM 控制器有两个与\
  \ ECC 相关的寄存器：错误状态寄存器和错误地址指针寄存器，如表 20.1 所示。当发生 ECC 错误时，前者包含状态（错误是 SBE 还是 MBE），而后者包含错误发生的物理地址。EDAC\
  \ 核心定期检查这些寄存器，并通过 `sysfs` 将结果报告给用户空间。从配置的角度来看，`855GME` 内部的所有设备似乎都在 PCI 总线 0 上。DRAM\
  \ 控制器位于该总线的设备 0。DRAM 接口控制寄存器（包括 ECC 特有寄存器）映射到相应的 PCI 配置空间。要为 `855GME` 添加 EDAC 支持，需要添加读取这些寄存器的钩子，如列表\
  \ 20.1 所示。请参考第 10 章“外围组件互连”关于 PCI 设备驱动方法和数据结构的解释。\n\n### 表 20.1 DRAM 控制器上的 ECC 相关寄存器\n\
  \n| 位于 DRAM 控制器 PCI 配置空间中的 ECC 特有寄存器 |or |\n| :--- | :--- |\n| `I855_ERRSTS_REGISTER`\
  \ | 错误状态寄存器，指示 ECC 错误的发生。显示错误是 SBE 还是 MBE。 |\n| `I855_EAP_REGISTER` | 错误地址指针寄存器，包含最近一次\
  \ ECC 错误的物理地址。 |\n\n### 列表 20.1 针对 855GME 的 EDAC 驱动\n\n```c\n/* 基于 drivers/edac/i82860_edac.c\
  \ */\n#define I855_PCI_DEVICE_ID 0x3584 /* 855 GME 中内存控制器的 PCI 设备 ID */\n#define\
  \ I855_ERRSTS_REGISTER 0x62 /* 错误状态寄存器在 PCI 配置空间中的偏移 */\n#define I855_EAP_REGISTER\
  \ 0x98 /* 错误地址指针寄存器在 PCI 配置空间中的偏移 */\n\nstruct i855_error_info {\n    u16 errsts;\
  \ /* 错误类型 */\n    u32 eap; /* 错误位置 */\n};\n\n/* 获取错误信息 */\nstatic void\ni855_get_error_info(struct\
  \ mem_ctl_info *mci,\n    struct i855_error_info *info)\n{\n    struct pci_dev *pdev;\n\
  \    pdev = to_pci_dev(mci->dev);\n    /* 读取错误类型 */\n    pci_read_config_word(pdev,\
  \ I855_ERRSTS_REGISTER, &info->errsts);\n    /* 读取错误位置 */\n    pci_read_config_dword(pdev,\
  \ I855_EAP_REGISTER, &info->eap);\n}\n\n/* 处理错误 */\nstatic int\ni855_process_error_info(struct\
  \ mem_ctl_info *mci,\n    struct i855_error_info *info,\n    int handle_errors)\n\
  {\n    int row;\n    info->eap >>= PAGE_SHIFT;\n    row = edac_mc_find_csrow_by_page(mci,\
  \ info->eap); /* 找到罪祸行 */\n    /* 使用 EDAC 核心提供的服务进行处理。\n    填充 sysfs，生成错误消息等。 */\n\
  \    if (is_MBE()) { /* is_MBE() 检查 I855_ERRSTS_REGISTER 并检查是否存在 MBE。实现未显示 */\n\
  \        edac_mc_handle_ue(mci, info->eap, 0, row, \"i855 UE\");\n    } else if\
  \ (is_SBE()) { /* is_SBE() 检查 I855_ERRSTS_REGISTER 并检查是否存在 SBE。实现未显示 */\n      \
  \  edac_mc_handle_ce(mci, info->eap, 0, info->derrsyn, row, 0, \"i855 CE\");\n \
  \   }\n    return 1;\n}\n\n/* 此方法从 i855_probe() 注册到 EDAC 核心 */\nstatic void\ni855_check(struct\
  \ mem_ctl_info *mci)\n{\n    struct i855_error_info info;\n    i855_get_error_info(mci,\
  \ &info);\n    i855_process_error_info(mci, &info, 1);\n}\n\n/* PCI 驱动探测方法，是 pci_driver\
  \ 结构的一部分 */\nstatic int\ni855_probe(struct pci_dev *pdev, int dev_idx)\n{\n    struct\
  \ mem_ctl_info *mci;\n    /* ... */\n    pci_enable_device(pdev);\n    /* 为此内存控制器分配控制内存。\n\
  \    edac_mc_alloc() 的三个参数分别对应于\n    请求的私有存储数量、选通行数\n    以及内存布局中的通道数 */\n    mci\
  \ = edac_mc_alloc(0, CSROWS, CHANNELS);\n    /* ... */\n    mci->edac_check = i855_check;\
  \ /* 向 EDAC 核心提供检查方法 */\n    /* 进行其他内存控制器初始化 */\n    /* ... */\n    /* 将此内存控制器注册到\
  \ EDAC 核心 */\n    edac_mc_add_mc(mci, 0);\n    /* ... */\n}\n\n/* 移除方法 */\nstatic\
  \ void __devexit\ni855_remove(struct pci_dev *pdev)\n{\n    struct mem_ctl_info\
  \ *mci = edac_mc_find_mci_by_pdev(pdev);\n    if (mci && !edac_mc_del_mc(mci)) {\n\
  \        edac_mc_free(mci); /* 释放控制器的内存。edac_mc_alloc() 的反向操作 */\n    }\n}\n\n/*\
  \ PCI 设备 ID 表 */\nstatic const struct pci_device_id i855_pci_tbl[] __devinitdata\
  \ = {\n    {PCI_VEND_DEV(INTEL, I855_PCI_DEVICE_ID),\n    PCI_ANY_ID, PCI_ANY_ID,\
  \ 0, 0,},\n    {0,},\n};\nMODULE_DEVICE_TABLE(pci, i855_pci_tbl);\n\n/* 此设备的 pci_driver\
  \ 结构。\n请复阅第 10 章获取详细解释 */\nstatic struct pci_driver i855_driver = {\n    .name =\
  \ \"855\",\n    .probe = i855_probe,\n    .remove = __devexit_p(i855_remove),\n\
  \    .id_table = i855_pci_tbl,\n};\n\n/* 驱动初始化 */\nstatic int __init\ni855_init(void)\n\
  {\n    /* ... */\n    pci_rc = pci_register_driver(&i855_driver);\n    /* ... */\n\
  }\n```\n\n查看 `drivers/edac/` 获取 EDAC 源文件，查看 `Documentation/drivers/edac/edac.txt`\
  \ 获取 EDAC `sysfs` 节点的详细语义。\n\n### 频率缩放\n\nCPU 频率 (`cpufreq`) 子系统通过动态缩放频率来帮助电源管理。如果你使用合适的缩放算法（称为调度器），设备电池可能会更持久。`cpufreq`\
  \ 支持多种架构，如 x86、ARM 和 PowerPC。为了获得 `cpufreq` 能力，你还需要启用相应的处理器驱动（例如支持 SpeedStep 的 Pentium）。\n\
  \n你可以通过 `/sys/devices/system/cpu/cpuX/` 目录下的文件来控制 `cpufreq` 的行为，其中 `X` 是 CPU 编号。设置最大最小频率限制，请将所需的值写入\
  \ `scaling_max_freq` 和 `scaling_min_freq`。\n\n- `performance` 调度器将 CPU 频率设置为 `scaling_max_freq`。\n\
  - `powersave` 调度器将 CPU 频率设置为 `scaling_min_freq`。\n- `ondemand` 调度器根据 CPU 负载调整频率。\n\
  - `conservative` 是 `ondemand` 的变体，速度变化以平稳的阶进方式进行。\n- `userspace` 允许应用程序决定缩放技术。某些发行版将调度器设置为\
  \ userspace 并在启动时通过名为 `cpuspeed` 的守护进程来实现缩放算法。\n- 你也可以使用 `cpufreq_register_governor()`\
  \ 接口实现自己的内核调度器。\n\n每个支持的调度器都作为内核模块实现。要看到 `cpufreq` 运行，请分配一个调度器并改变系统负载：\n\n```bash\n\
  cd /sys/devices/system/cpu/cpu0/cpufreq\ncat scaling_max_freq\n# 最大频率\n1700000\n\
  cat scaling_min_freq\n# 最小频率\n600000\ncat cpuinfo_cur_freq\n# 当前频率\n600000\ncat\
  \ scaling_governor\n# 使用的缩放算法\npowersave\ncat scaling_available_frequencies\n1700000\
  \ 1400000 1200000 1000000 800000 600000\ncat scaling_available_governors\nconservative\
  \ ondemand powersave userspace performance\necho conservative > scaling_governor\n\
  # 分配 'conservative' 调度器\nls -lR /\n# 切换到另一个终端并递归加载系统\n```\n\n\n\n遍历所有目录。\n\n如果你现在通过查看\
  \ `/sys/devices/system/cpu/cpu0/cpufreq/cpuinfo_cur_freq` 来监控运行频率，你将看到它随着 CPU 负载的变化而“波动”。\n\
  \nCPU 缩放代码位于 `drivers/cpufreq/` 目录下。查看 `Documentation/cpu-freq/` 可以获取 `cpufreq`\
  \ sysfs 节点的详细语义。\n\n## 嵌入式控制器\n\n笔记本电脑及其衍生产品通常包含一个内置的`嵌入式控制器`（EC），用于处理各种旁路职责，包括以下内容：\n\
  \n- 与键盘控制器接口\n- 管理热事件\n- 处理特殊按钮和 LED\n- 控制系统和 CPU 风扇速度\n- 监控电池电压\n\n这些功能大部分都特定于\
  \ OEM 的硬件实现。不同的 OEM 使用不同的 EC；例如，IBM/联想笔记本电脑嵌入了瑞萨萨 H8 微控制器来辅助主处理器工作。然而，无论控制器的品牌如何，访问\
  \ EC 的接口都是标准的。BIOS 和操作系统在 I/O 端口 `0x80` 操作以从 EC 读取信息，并在 I/O 端口 `0x81` 操作以向 EC 写入数据。在桌面电脑上，这些端口提供对键盘控制器的访问，而不是通用\
  \ EC。\n\n下一节将引用一个通过访问 EC 内存空间来检测信号强度的示例驱动。\n\n## ACPI\n\n`高级配置与电源接口`（ACPI）是一种电源管理规范，取代了早期的标准，如`高级电源管理`（APM）。ACPI\
  \ 负责在系统的不同电源状态之间进行转换。它还承担与连接到 EC 的设备和传感器建立接口的任务。此类设备被称为`ACPI 设备`，而用于处理它们的内存被称为`ACPI\
  \ 空间`。\n\n正如你在书的其他地方看到的，低级代码不是实现策略的地方。这是 APM 的主要问题，大多数电源管理策略都是 BIOS 固件的一部分。ACPI\
  \ 将策略向上推了一层到了操作系统。通过使用一个名为 `acpid` 的守护进程，ACPI 甚至允许将策略进一步向上推一级，到用户空间的配置文件。通过向 `acpid`\
  \ 配置文件添加规则，你可以决定在按下热键或发生热触发时采取什么措施。\n\n即使有了 ACPI，低级 BIOS 固件仍然保留了与硬件建立接口以及检测 ACPI\
  \ 事件（如按下电源按钮或热传感器报告）的责任。为了执行此操作，BIOS 利用一种通过`系统管理中断`（SMIs）触发的特殊 x86 执行模式。SMI 执行模式对操作系统是透明的。为了通知操作系统\
  \ SMI 模式下检测到的 ACPI 事件，BIOS 会断出`系统控制中断`（SCI）。查看 `drivers/acpi/osl.c` 可以请求 SCI IRQ\
  \ 的 Linux ACPI 代码。\n\nLinux ACPI 组件包含以下内容：\n\n1. 核心层，提供 ACPI 基础要素，例如`ACPI 语言`（AML）解释器。ACPI\
  \ 特定的 BIOS 代码用 AML 编写，这是一种运行在操作系统 AML 解释器实现的虚拟机上的语言。\n2. 用于与标准组件接口的 ACPI 驱动，例如 EC（`drivers/acpi/ec.c`）、按钮（`drivers/acpi/button.c`）和风扇（`drivers/acpi/fan.c`）。OEM\
  \ 特定驱动为标准 ACPI 驱动不支持的功能提供支持。例如，`drivers/misc/thinkpad_acpi.c` 是为 IBM/联想 Thinkpad\
  \ 实现额外功能的 OEM 特定驱动。在 IBM/联想 Thinkpad 上，`/proc/acpi/` 下的文件是由标准 ACPI 驱动生成的。在 2.6.22\
  \ 之前，该驱动曾是 `drivers/acpi/ibm_acpi.c`，而 `/proc/acpi/ibm/` 中的文件是由 OEM 特定驱动产生的。因此，要获取当前温度，请执行以下操作：\n\
  \n```bash\ncat /proc/acpi/thermal_zone/THM0/temperature\n```\ntemperature: 39 C\n\
  \n但要开启 LCD 显示器上方的夜光，需要寻求 OEM 特定驱动的帮助：\n```bash\necho on > /proc/acpi/ibm/light\n\
  ```\n3. ACPI 用于排队执行工作的内核线程 `kacpid`。\n4. 各个设备驱动程序，它们使用 ACPI 服务来响应系统电源状态的转换。为了实现这一点，驱动程序向内核设备模型注册了\
  \ `suspend()` 和 `resume()` 方法。我们在讨论第 6 章的 `platform_driver` 结构、第 8 章的 `spi_driver`\
  \ 结构、第 9 章的 `pcmcia_driver` 结构以及第 10 章的 `pci_driver` 结构时提到了这些方法。\n5. 用户空间工具，例如 `acpitool`，它可以报告各种\
  \ ACPI 设备的状态，显示热区信息信息并将系统挂起到不同的睡眠状态：\n\n```bash\nacpitool\n```\nBattery #1 : charging,\
  \ 69.08%, 01:14:02\nAC adapter : on-line\nThermal zone 1 : ok, 38 C\n6. `acpid`\
  \ 守护进程，它是 ACPI 事件的策略启用器。它在 `/proc/acpi/events` 上监听内核报告的电源管理事件。当你按下电源按钮或发生热触发时，内核\
  \ ACPI 驱动通过 `/proc/acpi/events` 向用户空间分发事件。`acpid` 守护进程读取此内容，通过 `/etc/acpi/events/`\
  \ 中的配置脚本进行传递并采取指定的操作。假设你想在按下笔记本电脑盖子按钮时执行一个特定程序（`/bin/lidhandler`）。为此，请向 `/etc/acpi/events/acpi_handler.sh`\
  \ 添加以下内容：\n\n```bash\nevent=button/lid.*\naction=/bin/lidhandler\n```\n\n你可以结合 `cpufreq`\
  \ 使用 ACPI。例如，你可以在 `/bin/lidhandler` 内部添加此行，在关闭笔记本盖子时降低处理器频率：\n```bash\necho powersave\
  \ > /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor\n```\n你可以从 www.acpi.info\
  \ 下载 ACPI 规范。\n\n作为一个练习，考虑你在嵌入式笔记本衍生产品中内置了一个遥测卡，并且 EC 连接到一个测量信号强度的传感器。要通过 `/proc/acpi/`（或\
  \ `/sys/bus/acpi/`）访问信号强度，请更新 `drivers/misc/` 中对应笔记本型号的“额外”驱动。如果你的板卡是 IBM/联想 Thinkpad\
  \ 的衍生产品，请相应地修改 `drivers/misc/thinkpad_acpi.c`。你可以使用 `ec_read()` 和 `ec_write()` 内核函数来访问\
  \ EC ACPI 空间中存储信号强度的位置。\n\n## ISA 和 MCA\n\n`工业标准架构`（ISA）最初作为 PC 与 I/O 设备接口的总线，但后来演变成了事实上的标准。几年前，ISA\
  \ 驱动程序本应单独占用一个章节；但今天，随着 PCI 总线的出现，ISA 几乎消失了。\n\nISA 设备驱动程序必须应对的两个主要的总线因素是：\n\n-\
  \ ISA 不提供驱动程序可用于检测电气接线或引导固件分配的资源信息的标准接口。实现复杂的探测逻辑（通常利用设备特定的特性）是 ISA 驱动初始化的重要部分。这与\
  \ PCI 总线不同，在 PCI 总线上，设备驱动程序可以清晰地解析由引导固件分配的中断请求线和 I/O 基地址等资源的身份。当我们在第 10 章讨论 PCI\
  \ 配置空间时，你学习了如何做到这一点。\n- 我们在第 15 章“网络接口卡”的“ISA 网络驱动程序”部分中也简要查看了 ISA 探测。\n\nISA *即插即用*（PnP）规范尝试引入某种程度的自动-\n\
  \n\n\n然而，ISA 的可配置性。\n\n• ISA 总线宽度为 24 位，因此设备只能访问系统底部的 16MB 内存。例如，为了从 ISA 以太网卡 DMA\
  \ 网络数据，DMA 缓冲区必须位于名为 `ZONE_DMA` 的低 16MB 范围内。然而，`扩展工业标准架构`（`EISA`）将 ISA 总线扩展到 32\
  \ 位。你可以将 ISA 设备插入 EISA 插槽中。\n\n如今，在 PC 兼容系统中，使用 `LPC` 总线而非 ISA 总线来将传统外围设备连接到 CPU。我们在前面的章节中讨论过\
  \ `LPC` 设备，如 Super I/O 芯片组、固件集线器热传感器。\n\n`微通道架构`（`MCA`）克服了 ISA 家族的许多局限性。MCA 支持总线主、自动配置和\
  \ 32 位总线宽度。尽管技术上优于 ISA，但由于其专有性质，MCA 并不流行。\n\n查看 `drivers/net/tokenring/skisa.c`\
  \ 可以看到令牌环卡的示例 ISA 驱动程序。IBM 令牌环驱动程序 `drivers/net/tokenring/ibmtr.c` 支持 IBM 令牌环硬件的\
  \ ISA、PnP 和 MCA 形式。3COM 以太网驱动程序 `drivers/net/3c509.c` 驱动 3COM 以太网卡的 MCA、PnP 和 EISA\
  \ 形式。内核为 PnP、EISA 和 MCA 驱动程序的使用提供了核心例程。这些实现分别位于 `drivers/pnp/`、`drivers/eisa/` 和\
  \ `drivers/mca/` 中。\n\n## FireWire\n\n`FireWire`（又称 IEEE 1394）是 Apple 发明的一种高速串行总线协议，用于将外围设备连接到系统。它提供高达\
  \ 800Mbps 的数据速率（IEEE 1394b）。第 10 章的图 10.1 显示了 x86 笔记本电脑上 FireWire 控制器的连接情况。\n\n\
  FireWire 与 USB 2.0 相似，因为它们都是支持高速和设备热插拔的外部 I/O 总线。然而，FireWire 是一种点对点协议，与主从结构的 USB\
  \ 2.0 不同，因此两个支持 FireWire 的设备可以在无需 PC 干预的情况下交换信息。由于这一特性，FireWire 在摄像机等多媒体设备上非常流行。正如你在第\
  \ 11 章中学到的，On-The-Go 扩展模块也为 USB 2.0 带来了点对点能力。\n\n### 智能输入输出\n\nLinux 上的 FireWire\
  \ 设计如下：\n\n• 如 `ohci1394` 等与 FireWire 控制器接口的设备驱动程序。\n• 用于存储、视频和网络等应用的协议驱动程序。FireWire\
  \ `串口 2`（`SBP2`）驱动程序是一个底层 FireWire 协议驱动程序，允许你像使用 SCSI 磁盘或 USB 大容量存储设备一样使用 FireWire\
  \ 存储介质。SBP2 必须与高级 SCSI 驱动程序（如 `sd_mod` 用于磁盘或 `sr_mod` 用于 CD-ROM）配合使用。诸如 `cdrecord`\
  \ 的应用程序在 FireWire CD 光驱上的工作方式与在 USB CD 光驱上完全相同。`dv1394` 和 `video1394` 协议驱动程序允许你通过\
  \ FireWire 捕捉视频，而 `eth1394` 协议驱动程序允许你在 FireWire 上运行 TCP/IP。\n• 为上述两者提供服务的 FireWire\
  \ 核心。\n• 如 `libraw1394` 等辅助开发感知 FireWire 应用程序的用户空间库。\n\n查看 `drivers/ieee1394/` 获取\
  \ FireWire 内核源码，并访问 www.linux1394.org 获取详细文档。\n\n从 2.6.22 版本开始，内核在 `drivers/firewire/`\
  \ 目录下有一个备用的、更精简的 FireWire 栈。\n\n## 智能输入输出\n\n`智能输入输出`（或 I2O）是一种标准，要求将 I/O 活动从主处理器卸载到驻留在\
  \ I2O 适配器上的 I/O 协处理器上。I2O 在今天已基本废弃，`I2O 特别兴趣小组`（`I2O SIG`）也停止存在。然而，包括 Linux 在内的许多操作系统继续支持\
  \ I2O。I2O 硬件适用于 SCSI、RAID 和网络等技术。\n\nI2O 将软件架构划分为运行在主处理器上的 `操作系统特定模块`（`OSM`）和执行在\
  \ I2O 适配器上的 `硬件特定模块`（`HDM`）。HDM 与操作系统无关，可以在不同操作系统之间复用，因此 OSM 变得更加简单。\n\nLinux 以\
  \ I2O 核心、I2O 适配器驱动程序以及各种 OSM 的形式支持 I2O。访问 http://i2o.shadowconnect.com 的 Linux I2O\
  \ 主页以及 `drivers/message/i2o/` 中的源码获取更多详情。\n\n## 业余无线电\n\n业余（ham）无线电是一种爱好者用于全球通信的数据包无线电技术。它也经常用于响应洪水和气旋等灾害。要在\
  \ Linux 上使用业余无线电，你需要：\n\n• 用于访问收音机的底层调制解调器驱动程序。若干业余无线电设备的解调器驱动程序存在 `drivers/net/hamradio/`\
  \ 中。\n• 一个或多个包协议，如 AX.25、Rose 和 Netrom。AX.25 协议是 X.25 协议在业余无线电上的适配。查看 Linux Amateur\
  \ Radio AX.25 HOWTO 获取该协议的解释，查看 `net/ax25/` 目录获取源码，并访问 http://hams.sourceforge.net\
  \ 获取在 AX.25 上运行的用户空间工具和库。Rose (`net/rose/`) 和 Netrom (`net/netrom/`) 是使用 AX.25 作为数据链路层的网络协议。你可以分别使用\
  \ `AF_AX25`、`AF_ROSE` 和 `AF_NETROM` 协议族编写运行在 AX.25、Rose 和 Netrom 上的 Linux socket\
  \ 应用程序。\n\n## IP \n\n`互联网语音协议`（`VoIP`）是一种利用互联网传输语音流量的技术。VoIP 让你能够以廉廉的价格拨打音质电话。PC\
  \ 环境中已有多种基于 PCI、PC 卡 和 USB 的 VoIP 解决方案。Linux 提供了这些卡中若干的设备驱动程序。然而，并没有许多被集成到主内核中。`drivers/telephony/`\
  \ 目录包含几个 VoIP 设备的驱动程序以及未来驱动程序可以使用的注册 API。\n\n随着 Linux 在嵌入式电信领域的日益普及，如今市场上已有多种 Linux\
  \ IP 电话。图 20.1 显示了一个支持 VoIP 的设备，它具有一个硬件语音编解码器，可以实现 G.711 和 G.729 等用于语音流编解码的标准。该设备使用一种名为`以太网供电`（`PoE`）的技术，通过以太网线同时传输电源。设备驱动程序与\
  \ VoIP 硬件通信。\n\nVoIP 驱动程序与传输协议（如实时传输协议 `RTP`）以及链路控制信号栈（如会话协议 `SIP` 和 H.323）协同工作。在这些协议之上是各种\
  \ IP 电话应用程序。\n\n在软件中实现 VoIP 编解码器的解决方案在嵌入领域同样流行。它们通常位于用户空间，并与以下项交互：\n\n• 使用 OSS 或\
  \ ALSA API 的内核音频驱动程序\n• 使用 socket API 的内核网络驱动程序\n\n图 20.1 VoIP 电话。\n\n面向`视频和语音 IP`（V2IP）市场的\
  \ SoC 通常包含 H.264 等视频编解码器的硬件支持。如果你将 Linux 接入 V2IP 手机，你还需要实现与此类解码器接口的驱动程序。\n\n## 高速互连\n\
  \nInfiniBand、RapidIO、Hyper-Transport 和 10 Gigabit 以太网等高速互连技术在 PC 或低端嵌入式环境中并不常见。你更有可能在集群、刀片服务器或游戏系统中发现它们。\n\
  \n\n\n终端、交换机或高速路由器。光纤通道（Fibre Channel）和 `Internet SCSI` (iSCSI) 等网络技术常见于由`存储区域网络`（SAN）提供的环境中。\n\
  \n让我们查看其中一些技术的驱动程序子系统。\n\n## InfiniBand\n\nInfiniBand 是一种高速串行总线标准，最初旨在取代 PCI。然而，PCI\
  \ Express 已成为广泛接受的未来总线。今天，InfiniBand 技术常用于刀片服务器设计，以提供高性能的存储和网络架构。InfiniBand 支持 `Remote\
  \ DMA` (RDMA)，它允许数据从一个计算机系统的内存 DMA 到另一个计算机系统。\n\nLinux InfiniBand 子系统包括对 InfiniBand\
  \ 的核心支持、主机通道适配器的设备驱动程序，以及 InfiniBand 之上的 IP 的实现。查看 `drivers/infiniband/` 获取 Linux\
  \ InfiniBand 子系统，查看 `Documentation/infiniband/` 获取相关文档。\n\n## RapidIO\n\nRapidIO\
  \ 是另一种高速串行总线技术，用于通过背板连接板。它支持 10Gbps 级的速度。支持 RapidIO 的处理器示例是 Freescale 的基于电源的 MPC8540，目标用于网络路由器和交换机等嵌入式设备。\n\
  \nLinux RapidIO 子系统提供了一组核心程序，可驱动 RapidIO 总线上的设备。在 RapidIO 互连上进行通信有两种方式：\n\n1. 使用\
  \ `doorbells`（门铃）的短带外消息。RapidIO 核心提供的门铃服务有 `rio_request_inb_dbell()`、`rio_release_inb_dbell()`、`rio_request_outb_dbell()`\
  \ 和 `rio_release_outb_dbell()`。\n2. 使用 `mailboxes`（邮箱）的高带宽数据传输送。RapidIO 核心提供的邮箱服务有\
  \ `rio_request_inb_mbox()`、`rio_release_inb_mbox()`、`rio_request_outb_mbox()` 和\
  \ `rio_release_outb_mbox()`。\n\n查看 `drivers/rapidio/` 获取源码。\n\n## Fibre Channel\n\
  \n`Fibre Channel`（光纤通道）是一种用于与存储系统通信的现代高速串行总线协议。光纤通道接口卡具有光纤端口，用于与 SAN 上的存储设备通信。光纤通道与\
  \ SCSI 兼容，因此相关的设备驱动程序本质上是带有处理光纤通道额外功能的 SCSI 驱动程序。\n\nLinux 支持处理光纤通道硬件的光纤通道核心和设备驱动程序。查看\
  \ `drivers/fc4/` 获取源码。\n\n## iSCSI\n\n`iSCSI` 是另一种 SAN 技术。它允许通过 TCP/IP 网络传输 SCSI\
  \ 数据包。通过 iSCSI，远程块设备在你的系统中就像本地存储一样。拥有存储的远程系统被称为 `iSCSI target`（目标），使用存储的本地系统被称为\
  \ `iSCSI initiators`（启动器）。\n\nLinux 通过内核驱动 `drivers/scsi/iscsi_tcp.c` 以及名为 `iscsid`\
  \ 的用户态守护进程支持 iSCSI。Linux-iSCSI 项目首页位于 http://linux-iscsi.sourceforge.net。\n\n##\
  \ 内核调试器\n\n现在我们已经学习了如何实现各种设备驱动程序，让我们退后一步，探索一些调试技术。在代码开发之前在逻辑设计和软件工程上投入时间，并在开发后紧盯着代码，可以最大限度地减少甚至消除\
  \ bug。但由于这说起来容易做起来难，而且因为我们都是人类，开发者需要调试工具。在本章中，让我们看看调试内核代码的各种方法。\n\n### 可靠性、可用性、可维护性\n\
  \n许多系统（尤其是任务关键型）对可靠性、可用性和可维护性（RAS）有需求。Linux RAS 的工作促成了几个强大工具。。如 Linux Test Project\
  \ (LTP) 等练习工具可以测量你的内核移植的可靠性和健壮性。CPU 热插拔和 Linux 高可用 (HA) 项目属于可用性范围。内核调试器、Kprobes、Kdump、EDAC\
  \ 和 Linux Trace Toolkit (LTT) 属于可维护性范畴。这些分类之间的界限有时很模糊；你可以使用这些方法的任何一种或组合来适应你的调试需求。例如，`OProfile`\
  \ 等内核分析器的输出既可以搜索潜在的代码瓶颈（可靠性），也可以用于调试现场问题（可维护性）。\n\nLinux 内核没有内置的调试器支持。是否将调试器作为标准内核的一部分包含进来内核邮件列表中经常讨论的话题。指令级\
  \ `Kernel Debugger` (kdb) 和源码级 `Kernel GNU Debugger` (kgdb) 是两个主要的 Linux 内核调试器。截至今天，无论你使用\
  \ `kdb` 还是 `kgdb`，都需要下载相关的补丁并将其应用到你的内核源码中。即使你想避免带有调试器支持的补丁内核源码的麻烦，也可以通过普通的 `GNU\
  \ Debugger` (gdb) 获取有关内核崩溃的信息并窥视内核变量。JTAG 调试器使用硬件辅助调试，功能强大但价格昂贵。\n\n内核调试器让内核内部变得更加透明。你可以单步执行指令、反汇编指令、显示并修改内核变量，以及查看堆栈跟踪。在本章中，让我们通过一些示例学习内核调试器的基础知识。\n\
  \n### 进入调试器\n\n你可以通过多种方式进入内核调试器。一种方法是传递命令行参数，要求内核在启动期间进入调试器。另一种方法是通过软件或硬件 `breakpoints`（断点）。`breakpoint`\
  \ 是你希望停止执行并将控制权移交给调试器的地址。软件断点会将该地址处的指令替换为其他会导致异常的内容。你可以使用调试器命令或通过将它们插入代码中来设置软件断点。对于基于\
  \ x86 的系统，你可以如下所示在内核源码中设置软件断点：\n\n```\nasm(\" int $3\");\n```\n\n或者，你可以调用 `BREAKPOINT`\
  \ 宏，它会翻译为相应的体系相关的指令。\n\n如果需要停止的指令位于闪存中，调试器无法将其替换，那么可以使用硬件断点代替软件断点。硬件断点需要处理器的支持。相应的地址必须添加到调试寄存器中。你拥有的硬件断点数量等于处理器支持的调试寄存器数量。\n\
  \n你还可以请求调试器对变量设置 `watchpoint`（观察点）。每当指令修改观察点地址处的数据时，调试器就会停止执行。另一种进入调试器的常用方法是按下中断键（attention\
  \ key），但在某些情况下这不起作用。如果你的代码在禁用中断后处于紧密循环中，内核将没有机会处理中断键并进入调试器。例如，如果你的代码执行如下，你就无法通过中断键进入调试器：\n\
  \n```\nunsigned long flags;\nlocal_irq_save(flags);\nwhile (1) continue;\nlocal_irq_restore(flags);\n\
  ```\n\n\n\n\n\n# 598 第 21 章调试设备驱动程序\n\n当控制权交给调试器时，你可以使用各种调试器命令开始分析。\n\n### 内核调试器\
  \ (kdb)\n\n`kdb` 是一个指令级调试器，用于调试内核代码和设备驱动程序。在使用它之前，你需要用支持 `kdb` 的补丁修复内核源码并重新编译内核。（请参考“下载”部分获取有关下载\
  \ `kdb` 补丁的信息。）`kdb` 的主要优势是易于设置，因为你不需要额外的机器来完成调试（与 `kgdb` 不同）。主要缺点是你需要将源代码与反汇后的代码进行对应（同样，与\
  \ `kgdb` 不同）。\n\n让我们通过一个示例来初步接触 `kdb`。这里是案发现现场：你修改了一个内核串口驱动以适配你的 x86 硬件。但该驱动程序无法工作，你希望\
  \ `kdb` 帮助你抓住罪魁祸首。\n\n让我们通过在串口驱动的 `open()` 入口处设置断点来开始寻找指纹。记住，由于 `kdb` 不是源码级调试器，你必须打开源代码并尝试将指令与你的\
  \ C 代码进行匹配。让我们列出相关的源码片段：\n\n**drivers/serial/myserial.c**:\n\n```c\nstatic int rs_open(struct\
  \ tty_struct *tty, struct file *filp)\n{\n    struct async_struct *info;\n    /*\
  \ ... */\n    retval = get_async_struct(line, &info);\n    if (retval) return(retval);\n\
  \    tty->driver_data = info;\n    /* Point A */\n    /* ... */\n}\n```\n\n按下暂停\
  \ 键并进入 `kdb`。让我们看看反汇后的 `rs_open()` 看起来什么样。按照习惯，本章显示的所有调试会话都使用符号 `A` 附加解释。\n\n###\
  \ 内核调试器\n\n由于键盘输入，在处理器 0 上进入 `kdb` (current=0xc03f6000, pid 0)\n```\nkdb> id rs_open\n\
  → Disassemble rs_open\n0xc01cce00 rs_open: sub $0x1c, %esp\n0xc01cce03 rs_open+0x03:\
  \ mov $ffffffed, %ecx\n...\n0xc01cce4b rs_open+0x4b: call 0xc01ccca0, get_async_struct\n\
  ...\n0xc01cce56 rs_open+0x56: mov 0xc(%esp,1), %eax\n0xc01cce5a rs_open+0x5a: mov\
  \ %eax, 0x9a4(%ebx)\n...\n```\n\n源码中的 Point A 是设置断点的良好位置，因为你可以同时查看 `tty` 结构和 `info`\
  \ 结构来观察发生了什么。\n\n并排查看源码和反汇编代码，`rs_open+0x5a` 对应于 Point A。注意，如果内核是在没有优化标志的情况下编译的，对应关系会变得更容易。\n\
  \n在 `rs_open+0x5a`（地址为 `0xc01cce5a`）设置断点，并通过退出调试器继续执行：\n\n```\nkbd> bp rs_open+0x5a\n\
  → Set breakpoint\nkbd> go\n→ Continue execution\n```\n\n现在，你需要让内核调用 `rs_open()`\
  \ 以触发断点。为了触发这一点，请执行一个适当的用户空间程序。在这种情况下，向相应的串口（`/dev/ttySX`）回显一些字符：\n\n```bash\necho\
  \ “kerala monsoons” > /dev/ttySX\n```\n\n这导致了 `rs_open()` 的调用。断点被命中，`kdb` 接管了控制：\n\
  \n```\nEntering kdb on processor 0 due to Breakpoint @ 0xc01cce5a\nkdb>\n```\n\n\
  现在让我们查看 `info` 结构的内容。如果你查看反汇编代码，在断点之前的一个指令（`rs_open+0x56`），你会发现 `EAX` 寄存器包含 `info`\
  \ 结构的地址。让我们查看寄存器内容：\n\n```\nkbd> r\n→ Dump register contents\neax = 0xcf1ae680 ebx\
  \ = 0xce03b000 ecx = 0x00000000\n...\n```\n\n因此，`0xcf1ae680` 是 `info` 结构的地址。使用 `md`\
  \ 命令转储其内容：\n\n```\nkbd> md 0xcf1ae680\n→ Memory dump\n0xcf1ae680 00005301 0000ABC\
  \ 00000000 10000400\n...\n```\n\n为了理解这个转储，让我们查看对应的结构定义。`info` 在 `include/linux/serial.h`\
  \ 中定义为 `struct async_struct`，如下：\n\n```c\nstruct async_struct {\n    int magic;\
  \ /* Magic Number */\n    unsigned long port; /* I/O Port */\n    int hub6;\n  \
  \  /* ... */\n};\n```\n\n如果转转储与定义匹配，`0x5301` 是魔数，`0xABC` 是端口。嗯，这很有趣吧！`0xABC` 看起来不像一个有效的端口。如果你做过足够的串口调试，就会知道\
  \ I/O 端口基地址和 IRQ 在 `include/asm-x86/serial.h` 中为 x86 硬件进行了配置。将端口定义更改为正确的值，重新编译内核并继续你的测试！\n\
  \n## 内核 GNU 调试器 (kgdb)\n\n`kgdb` 是一个源码级调试器。它比 `kdb` 更容易使用，因为你不需要花时间将汇编代码与源码对应。但是它的设置更困难，因为需要额外的机器作为调试前端。\n\
  \n你必须结合 `kgdb` 使用 `gdb` 来逐步执行内核代码。`gdb` 运行在主机上，而打了 `kgdb` 补丁的内核（参考“下载”部分获取 `kgdb`\
  \ 补丁的信息）运行在目标硬件上。主机和目标通过串口空调制解调器线连接，如图 21.1 所示。\n\n图 21.1 Kgdb 设置。\n运行打了 kgdb 补丁内核的目标机器\
  \ | 运行 gdb 的主机。\n\n你必须通过命令行参数告知内核串口的标识和波特率。根据使用的启动加载程序，在 `syslinux.cfg`、`lilo.conf`\
  \ 或 `grub.conf` 中添加以下内核参数：\n\n```\nkgdbwait kgdb8250=X,115200\n```\n\n`kgdbwait`\
  \ 请求内核等待直到与主机端的 `gdb` 建立连接，`X` 是连接主机的串口，`115200` 是用于通信的波特率。\n\n现在在主机端配置相同的波特率：\n\
  \n```bash\nstty speed 115200 < /dev/ttySX\n```\n\n如果你的主机是没有串口的笔记本电脑，你可以使用 USB 转串口转换器进行调试。在这种情况下，不要使用\
  \ `/dev/ttySX`，而是使用由串口驱动创建的 `/dev/ttyUSBX` 节点。第 6 章“串口驱动”中的图 6.4 说明了这种场景。\n\n让我们通过一个错误模块示例学习\
  \ `kgdb` 基础。模块更容易调试，因为代码更改后不需要重新编译整个内核，但记住在编译模块时使用 `-g` 选项生成符号信息。由于模块是动态加载的，需要告知调试器模块所包含的符号信息。你也可以通过以太网启动\
  \ `kgdb` 调试会话。\n\n# 602 第 21 章调试设备驱动程序\n\n列表 21.1 包含一个有错误的 `trojan_function()`。假设它定义在\
  \ `drivers/char/my_module.c` 中。\n\n### 列表 21.1 错误函数\n\n```c\nchar buffer;\n\nint\
  \ trojan_function()\n{\n    int *my_variable = 0xAB, i;\n    /* ... */\n    Point\
  \ A:\n    i = *my_variable; /* Kernel Panic: my_variable 指向错误的内存 */\n    return(i);\n\
  }\n```\n\n在目标机上插入 `my_module.ko` 并查看 `/sys/module/my_module/sections/*` 内容以解析 ELF（可执行和链接格式）段地址。ELF\
  \ 中的 `.text` 段包含代码，`.data` 段包含初始化变量，`.rodata` 段包含只读变量（如字符串），`.bss` 段包含启动时不初始化的变量。如果在内核配置期间启用了\
  \ `CONFIG_KALLSYMS`，就可以 `/sys/module/my_module/sections/*` 中以 `.text`、`.data`、`.rodata`\
  \ 和 `.bss` 文件的形式获取这些段的地址。例如，获取代码段地址的方法：\n\n```bash\ncat /sys/module/my_module/sections/.text\n\
  0xe091a060\n```\n\n如果你仍使用 2.4 内核，请使用 `insmod` 的 `-m` 选项获取段地址：\n\n```bash\ninsmod\
  \ my_module.o -m\n```\n使用 /lib/modules/2.x.y/kernel/drivers/char/my_module.o\nSections:\
  \ Size Address Align\n.this 00000060 e091a000 2**2\n.text 00001ec0 e091a060 2**4\n\
  ...\n.rodata 0000004c e091d1fc 2**2\n.data 00000048 e091d260 2**5\n.bss 000000e4\
  \ e091d2c0 2**5\n...\n\n\n\n\n可以通过 `/proc/modules` 和 `/proc/kallsyms` 获取更多模块加载信息。\n\
  \n在获取段地址后，在主机侧机器上调用 `gdb`：\n\n```bash\n> gdb vmlinux\n```\n\n→ `vmlinux` 是未压缩的内核\n\
  \n```gdb\n(gdb) target remote /dev/ttySX → 连接到目标机\n```\n\n由于你将 `kgdbwait` 作为内核命令行参数传递，当内核在目标机启动时，`gdb`\
  \ 会获得控制权。现在使用 `add-symbol-file` 命令告知 `gdb` 之前的段地址：\n\n```gdb\n(gdb) add-symbol-file\
  \ drivers/char/mymodule.ko 0xe091a060 -s .rodata 0xe091d1fc -s .data 0xe091d260\
  \ -s .bss 0xe091d2c0\n```\n\n从文件 \"drivers/char/mymodule.ko\" 添加符号表\n\n`.text_addr\
  \ = 0xe091a060`\n`.rodata_addr = 0xe091d1fc`\n`.data_addr = 0xe091d260`\n`.bss_addr\
  \ = 0xe091d2c0`\n\n`(y or n) y`\n\n正在从 `drivers/char/mymodule.ko` 读取符号...完成。\n\n\
  为了调试内核崩溃（kernel panic），让我们在 `trojan_function()` 设置一个断点：\n\n```gdb\n(gdb) b trojan_function\n\
  → 设置断点\n```\n\n```gdb\n(gdb) c\n→ 继续执行\n```\n\n当 `kgdb` 命中断点时，让我们查看栈回溯，单步执行到点 A，并显示\
  \ `my_variable` 的值：\n\n```gdb\n(gdb) bt\n→ 回溯（栈）轨迹\n#0 trojan_function () at my_module.c\
  \ :124\n#1 0xe091a108 in my_parent_function (my_var1=438, my_var2=0xe091d288)\n\
  ..\n```\n\n```gdb\n(gdb) step\n(gdb) step\n→ 继续单步到点 A\n```\n\n```gdb\n(gdb) p my_variable\n\
  $0 = 0\n```\n\n604 第 21 章 调试设备驱动\n\n这里有一个明显的错误。`my_variable` 指向 `NULL`，因为 `trojan_function()`\
  \ 忘记为它分配内存。让我们直接使用 `kgdb` 分配内存，绕过内核崩溃并继续测试：\n\n```gdb\n(gdb) p &buffer\nA 打印 buffer\
  \ 的地址\n$1 = 0xe091a100 \"\"\n```\n\n```gdb\n(gdb) set my_variable=0xe091a100\nA\
  \ my_variable = &buffer\n(gdb) c\nA 继续你的测试\n```\n\n`kgdb` 适用于多种架构，如 x86、ARM 和 PowerPC。当你使用\
  \ `kgdb` 调试目标嵌入式设备时（而不是图 21.1 所示的 PC），你在主机系统上运行的 `gdb` 前端需要被编译以与你的目标平台配合工作。例如，为了从你的\
  \ x86 主机开发系统调试为基于 ARM 的嵌入式设备开发的驱动程序，必须使用适当生成的 `gdb`，通常命名为 `arm-linux-gdb`。具体名称取决于你使用的发行版。\n\
  \nGNU 调试器 (gdb)\n\n如前所述，你可以使用普通的 `gdb` 来收集一些内核调试信息。然而，你无法单步执行内核代码、设置断点或修改内核变量。让我们使用\
  \ `gdb` 调试由列表 21.1 中错误函数引起的内核崩溃，但假设这次 `trojan_function()` 被编译为内核的一部分而不是模块，因为你无法使用\
  \ `gdb` 轻松查看模块内部。这是执行 `trojan_function()` 时生成的“oops”消息的一部分：\n\n```\n无法处理内核空指针解引用，虚拟地址\n\
  virtual address 000000ab\n...\neax: f7571de0 ebx: ffffe000 ecx: f6c78000 edx: f98df870\n\
  ...\nStack: c019d731 00000000\n...\nbffffbe8 c0108fab\nCall Trace: [<c019d731>]\
  \ [<c013b8ac>] [<c0108fab>]\n...\n```\n\n将此晦涩的“oops”消息复制到 `oops.txt` 并使用 `ksymoops`\
  \ 工具获取更详细的输出。如果系统挂起，你可能需要手动复制消息：\n\n内核调试器\n605\n\n```bash\n> ksymoops oops.txt\n\
  ```\n\n```\nCode; c019d710 <trojan_function+0/10>\n00000000 <_EIP>:\nCode; c019d710\
  \ <trojan_function+0/10> <=====\n0: a1 ab 00 00 00 mov 0xab,%eax <=====\nCode; c019d715\
  \ <trojan_function+5/10>\n5: c3 ret\n```\n\n如果在内核配置期间开启了 `CONFIG_KALLSYMS`，2.6 内核生成的“oops”输出可以直接使用，而无需使用\
  \ `ksymoops` 解码。查看之前的 dump，“oops”发生在 `trojan_function()` 内部。让我们使用 `gdb` 获取更多信息。在以下调用中，`vmlinux`\
  \ 是未压缩的内核镜像，`/proc/kcore` 是内核地址空间：\n\n```bash\n> gdb vmlinux /proc/kcore\n```\n\n\
  ```gdb\n(gdb) p xtime\n→ 通过打印内核变量来测试\n$0 = 1113173755\n```\n\n由于 `gdb` 的缓存访问，重复访问同一个变量不会产生刷新的值。你可以通过使用\
  \ `gdb` 的 `core-file` 命令重新读取核心文件来强制刷新访问。现在让我们查看 `trojan_function()` 的反汇编：\n\n```gdb\n\
  (gdb) x/2i trojan_function\n→ 反汇编 trojan_function\n0xc019d710 <trojan_function>:\
  \ mov 0xab, %eax\n0xc019d715 <trojan_function+5>: ret\n```\n\n由于编译器优化，`trojan_function()`\
  \ 在汇编代码中看起来非常简练。它实际上是将 `EAX` 寄存器（其中持有来自 `my_variable` 的返回值）复制到基于 x86 的系统中。\n\nJTAG\
  \ 调试器\n\n如前所述，你可以使用普通的 `gdb` 来收集一些内核调试信息。然而，你无法单步执行内核代码、设置断点或修改内核变量。让我们使用 `gdb`\
  \ 调试由列表 21.1 中错误函数引起的内核崩溃，但假设这次 `trojan_function()` 被编译为内核的一部分而不是模块，因为你无法使用 `gdb`\
  \ 轻松查看模块内部。这是执行 `trojan_function()` 时生成的“oops”消息的一部分：\n\n```\n无法处理内核空指针解引用，虚拟地址\n\
  virtual address 00000ab\n...\neax: f7571de0 ebx: ffffe000 ecx: f6c78000 edx: f98df870\n\
  ...\nStack: c019d731 00000000\n...\nbffffbe8 c0108fab\nCall Trace: [<c019d731>]\
  \ [<c013b8ac>] [<c0108fab>]\n...\n```\n\n（注：此处提供的原始文本包含大量重复和混乱，已根据逻辑进行了清理和翻译。）\n\
  \n\n\n通过 TFTP 传输到目标机的闪存或 RAM。JTAG 调试器通常支持 `ELF` 和 `binary` 等文件格式。\n\n- 单步执行代码、设置断点、检查寄存器并转储内存区域。\n\
  - 重置目标设备。\n\nJTAG 调试有时可能会不稳定，因此如果你正在进行远程调试，通过远程电源控制开关为目标供电可能是一个好主意，如图 21.2 所示。这样，你就可以使用网络浏览器从主机硬重置目标，如终端\
  \ 4 所示。你也可以选择通过远程开关为 JTAG 硬件供电。这将允许你直接从闪存测试运行引导程序，而无需 JTAG 及其定义文件的干预。\n\n如果目标板具有网络接口，它可以通过\
  \ NFS 从开发主机挂载其根文件系统。（有关此操作的细节，请参见第 18 章中的“NFS Mounted Root”章节。）主机上的终端 5 在导出的根文件系统上本地运行。\n\
  \n如果你的团队地理位置分散在各地，可以在 `Virtual Network Computing` (VNC) 等环境中运行终端 1 到 5。如果你的发行版尚未包含\
  \ VNC，请从 `www.realvnc.com` 下载。有了这样的配置，你就可以在家里舒适地调试远程板上的电子设备了！一些 JTAG 供应商提供复杂的集成开发环境，涵盖了之前详述的所有功能，因此如果你在使用其中一个工具，就不需要管理\
  \ VNC 终端会话了。\n\n4 根据你的调试场景，你可能有更多此类终端。例如，如果你正在使用具有远程显示功能的示波器，你可以通过另一个终端上的网络浏览器对其进行操作。\n\
  5 虽然 JTAG 硬件独立于目标操作系统，但前端接口可能具有操作系统的依赖性。\n\n### 第 21 章 调试设备驱动程序\n\n#### 图 21.2 一个基于\
  \ JTAG 的远程调试设置示例。\n\n```\nRemote Linux Development Host (10.1.1.4, 10.1.1.3)\nTarget\
  \ Hardware\nSerial Port JTAG Debugger (10.1.1.2, 10.1.1.1)\nEthernet\nVNC Session\n\
  Terminal 1 (GDB Session): bash> gdb vmlinux\nTerminal 2 (Target Console): bash>\
  \ telnet 10.1.1.2\nTerminal 3 (JTAG Control): bash> telnet 10.1.1.2\ngdb> target\
  \ remote\n50\njtag> 10.1.1.2:1001\ngdb>\ntarget:bash> Terminal 4 (Hard Reset): bash>\
  \ elinks 10.1.1.4\nTerminal 5 (Exported Root Filesystem): bash> cat /etc/exports\n\
  /path/to/exported/root/\nTarget PowerON 10.1.1.3(rw,sync,no_root_squash,no_all_squash))\n\
  bash> cp testcode /path/to/exported/root\nTarget PowerOFF\n```\n\n在硬件调通期间，当你将引导程序或其他独立代码移植到目标机时，先生成一个\
  \ `ELF` 镜像并在 RAM 中对其进行调试，然后再从闪存运行，这是一个好主意。但是，请记住消除与 JTAG 定义脚本执行的操作重复的引导程序初始化。\n\n\
  JTAG 调试器的一个关键优势是，你可以使用单一工具来调试构成固件解决方案的不同部分。因此，你可以使用同一个调试器在源代码级别调试 BIOS、引导程序、基础内核、设备驱动模块以及用户空间应用程序。\n\
  \n### 内核探针 (Kernel Probes)\n\n你可以从 `http://oss.sgi.com/projects/kdb` 下载适用于 `x86`\
  \ 和 `IA64` 架构的 `kdb` 补丁。每个支持的内核版本都需要两个补丁：一个通用和一个依赖架构。\n\n`kgdb` 项目的主页为 `http://kgdb.sourceforge.net`。该网站还有关于配置和使用\
  \ `kgdb` 的文档。\n\n如果你的 Linux 发行版尚未包含 `gdb`，可以从 `www.gnu.org/software/gdb/gdb.html`\
  \ 获取它。\n\n内核探针可以进入内核函数并提取调试信息或应用修复补丁。对于调查客户现场无法解释的行为，这是你调试工具箱中一个非常有用的补充，特别是当你没有机会重启系统时。Linux\
  \ 支持一种名为 `Kprobes` 的通用内核探针，以及两种特殊变体：`Jprobes` 和 `return probes`。\n\n#### Kprobes\n\
  \nKprobes 通过提供动态转储内核数据结构或向运行中的内核插入代码的能力，可以节省你构建和引导调试内核的麻烦。例如，你可以在不重新编译内核的情况下，在调度程序内部动态添加几个\
  \ `printks`。你甚至可以在不重启火星探测器的情况下修补其一个漏洞。\n\n要在内核函数内部插入 `kprobe`，请按照以下步骤操作：\n\n1. 在内核配置菜单中打开\
  \ `CONFIG_KPROBES`（`Instrumentation Support` `Kprobes`）。\n2. 实现一个内核模块，在感兴趣的指令处注册\
  \ `kprobe`。你需要注册一个 `pre-handler`（`Kprobes` 在执行被探测的指令之前将运行它）和一个一个 `post-handler`（`Kprobes`\
  \ 在执行被探测的指令之后将运行它）。你还可以提供一个 `fault-handler`，如果在执行预处理器或后处理器时检测到故障，将运行它（因为你不想因为一个调试\
  \ bug 导致“oops”！）。\n\n当注册了 `kprobe` 时，它会保存被探测的指令并将其替换为断点（基于 x86 的系统上为 `0x03`）。当命中断点时，`Kprobes`\
  \ 执行 `pre-handler`。接着，它单步执行探测指令的副本。最后，运行 `post-handler`。\n\n让我们通过示例学习如何使用 `Kprobes`。考虑列表\
  \ 21.2 中的代码段，这是一个内核线程，每当递送 `SIGUSR1` 信号时就会向空内存池添加 `npages` 数量的页面。你发现当 `npages` 超过\
  \ 10 时会出现糟糕的情况，因此你想应用一个运行时补丁将其限制为 10。\n\n#### 列表 21.2 问题代码 (mydriv.c)\n\n```c\n\
  int npages=0;\nEXPORT_SYMBOL(npages);\n\nstatic int memwalkd(void *unused)\n{\n\
  \    long curr_pfn = (64*1024*1024 >> PAGE_SHIFT);\n    struct page *curr_page;\n\
  \    /* ... */\n    daemonize(\"memwalkd\"); /* kernel thread */\n    sigfillset(&current->blocked);\n\
  \    allow_signal(SIGUSR1);\n    for (;;) {\n        /* 如果有挂起的信号则将其取出 */\n     \
  \   if (signal_pending(current)) {\n            sig = dequeue_signal(current, &current->blocked,\
  \ &info);\n            /* Point A */\n            /* 当接收到 SIGUSR1 时释放 npages 页面\
  \ */\n            if (sig == SIGUSR1) {\n                /* Point B */\n       \
  \         /* 当 npages 在以下循环中超过 10 时出现问题。\n                让我们通过 Kprobes 在这里应用运行时修复。\
  \ */\n                for (i=0; i < npages; i++, curr_pfn++) {\n               \
  \     /* ... */\n                }\n            }\n        }\n        /* ... */\n\
  \    }\n    /* ... */\n}\n```\n\n#### 列表 21.3 注册 Kprobe 处理程序\n\n```c\n#include <linux/kernel.h>\n\
  #include <linux/module.h>\n#include <linux/kprobes.h>\n#include <linux/kallsyms.h>\n\
  #include <linux/sched.h>\n\nextern int npages; /* 定义在列表 21.2 中 */\n\n/* 每个探针结构 */\n\
  ```\n\n\n\n\n```c\nstatic struct kprobe bandaid;\n\n/* 前置处理器：在执行被探测指令前调用 */\nint\
  \ bandaid_pre(struct kprobe *p, struct pt_regs *regs)\n{\n    if (npages > 10) npages\
  \ = 10;\n    return 0;\n}\n\n/* 后置处理器：在执行被探测指令后调用 */\nvoid bandaid_post(struct kprobe\
  \ *p, struct pt_regs *regs,\nunsigned long flags)\n{\n    /* 无需执行的操作 */\n}\n```\n\
  \n612 第 21 章 调试设备驱动\n\n/* 异常处理器：当前置/后置处理器遇到异常时调用 */\nint bandaid_fault(struct kprobe\
  \ *p, struct pt_regs *regs,\nint trapnr)\n{\n    return 0;\n}\n\nint init_module(void)\n\
  {\n    int retval;\n    /* 填充 kprobe 结构体 */\n    bandaid.pre_handler = bandaid_pre;\n\
  \    bandaid.post_handler = bandaid_post;\n    bandaid.fault_handler = bandaid_fault;\n\
  \    /* 如前文所示到达目标地址 */\n    bandaid.addr = (kprobe_opcode_t*)\n    kallsyms_lookup_name(\"\
  memwalkd\") + 0xaa;\n    if (!bandaid.addr) {\n        printk(\"Bad Probe Point\\\
  n\");\n        return -1;\n    }\n    /* 注册 kprobe */\n    if ((retval = register_kprobe(&bandaid))\
  \ < 0) {\n        printk(\"register_kprobe error, return value=%d\\n\",\n      \
  \  retval);\n        return -1;\n    }\n    return 0;\n}\n\nvoid module_cleanup(void)\n\
  {\n    unregister_kprobe(&bandaid);\n}\n\nMODULE_LICENSE(\"GPL\"); /* 除非你的用户模块是\
  \ GPL 的，否则你无法链接 Kprobes API */\n\n内核探针 (Kernel Probes)\n613\n\n列表 21.3 使用 Kprobes\
  \ 在 `kallsyms_lookup_name(\"memwalkd\")` + 0xaa 处插入一个补丁，将 `npages` 限制为 10。要弄如何到达这个探测地址，请再次查看列表\
  \ 21.2。你希望补丁被插入在点 B。要计算点 B 处的内核地址，使用 `objdump` 反汇编 `mydrv.ko` 的内容：\n\n```bash\n\
  bash> objdump -D mydrv.ko\n```\n\n```\nmydrv.ko: file format elf32-i386\nDisassembly\
  \ of section .text:\n00000000 <memwalkd>:\n0: 55 push %ebp\n1: bd 00 40 00 00 mov\
  \ $0x4000,%ebp\n6: 57 push %edi\n7: 56 push %esi\n8: 53 push %ebx\n9: bb 00 f0 ff\
  \ ff mov $0xfffff000,%ebx\ne: 81 ec 90 00 00 00 sub $0x90,%esp\n...\n...\n7a: 83\
  \ f8 0a cmp $0xa,%eax\nA 点 A\n7d: 74 2b je aa <memwalkd+0xaa>\n7f: 83 f8 09 cmp\
  \ $0x9,%eax\n82: 75 cc jne 50 <memwalkd+0x50>\n...\na9: c3 ret\naa: a1 00 00 00\
  \ 00 mov 0x0,%eax\nA 点 B\naf: 85 c0 test %eax,%eax\nb1: 0f 8e b5 00 00 00 jle 16c\
  \ <memwalkd+0x16c>\nb7: 81 fd 7b f6 00 00 cmp $0xf67b,%ebp\n...\nfa: a1 00 00 00\
  \ 00 mov 0x0,%eax\n```\n\n如果你是在为不同的处理器平台进行交叉编译，则必须使用特定于架构的 `objdump`。如果你正在反汇编一个为\
  \ ARM 目标设备交叉编译的二进制文件，你需要类似 `arm-linux-objdump` 的工具。向 `objdump` 传递 `-S` 选项可以将源代码与反汇编输出混合混合：\n\
  \n```bash\nbash> arm-linux-objdump –d –S mydrv.ko\n```\n\n614 第 21 章 调试设备驱动\n\n\
  如果你尝试将列表 21.2 中的 C 代码与上方的反汇编输出进行匹配，你可以将点 A 和点 B 与显示的内核地址关联。`kallsyms_lookup_name()`\
  \ 定位 `memwalkd()` 的地址，而 `0xaa` 是点 B 所在的偏移量，因此在 `kallsyms_lookup_name(\"memwalkd\"\
  ) + 0xaa` 处应用 kprobe。\n\n注册 kprobe 后，`memwalkd()` 的效果等如下：\n\n```c\nstatic int memwalkd(void\
  \ *unused)\n{\n    /* ...*/\n    for (;;) {\n        /* ... */\n        /* 点 A */\n\
  \        /* 当接收到 SIGUSR1 时释放 npages 页面 */\n        if (sig == SIGUSR1) {\n     \
  \       /* 点 B */\n            if (npages > 10) npages = 10; /* 修复补丁！ */\n     \
  \       for (i=0; i < npages; i++, curr_pfn++) {\n                /* ... */\n  \
  \          }\n        }\n        /* ... */\n    }\n    /*...*/\n}\n```\n\n每当 `npages`\
  \ 被赋值大于 10 的值时，kprobe 补丁就会将其拉回 10，从而绕过问题。\n\n在接下来的两个章节中，让我们来看看一些在函数进入退出时方便使用 Kprobes\
  \ 的辅助工具。\n\n*jprobe* 是一种特殊的 kprobe。当调查点位于内核函数的入口处时，它简化了添加探测点的工作。jprobe 处理器与被探测函数具有相同的原型。它以与被探测函数相同的参数列表被调用，因此你可以轻松地从\
  \ jprobe 处理器访问函数参数。如果你使用 Kprobes 而不是 Jprobes，想象一下你的探测处理器需要经历的麻烦：必须在函数栈的阴暗小巷中穿行以提取函数参数！而且这些深入堆栈以获取参数值的代码必须高度特定于函数，更不用说它是依赖架构的且不可移植的。\n\
  \n要学习如何使用 Jprobes，让我们回到一个示例。假设你正在通过查看网络设备驱动程序（该程序作为内核的一部分构建）生成的 `printk()` 消息来调试它。驱动程序正在以八进制（基\
  \ 8）输出关键值，但让你糟糕的是，驱动程序编写者在打印格式字符串中引入了一个类型错误，编码为 `%O` 而不是 `%o`。因此，你只能看到这样的消息：\n空闲接收缓冲区数量\
  \ = %O。\n\nJprobes 救场。你可以在几秒钟修复它，而无需重新编译或重启内核。首先，查看 `kernel/printk.c` 中定义的 `printk()`：\n\
  \n```c\nasmlinkage int printk(const char *fmt, ...)\n{\n    va_list args;\n    int\
  \ r;\n    va_start(args, fmt);\n    r = vprintk(fmt);\n    va_end(args);\n    return\
  \ r;\n}\n```\n\n等待，提供的文本在结尾有一些杂乱的章节（可能是复制粘贴错误）。我根据提供的代码片段重构了逻辑流：\n\n```c\n#include\
  \ <linux/kernel.h>\n#include <linux/module.h>\n#include <linux/kprobes.h>\n#include\
  \ <linux/kallsyms.h>\n\n/* 探测 printk 的入口 */\nasmlinkage int jprintk(const char *fmt,\
  \ ...)\n{\n    for (; *fmt; ++fmt)\n        if (*fmt=='%'&&*(fmt+1) == 'O')\n  \
  \          *(char *)(fmt+1) = 'o';\n    jprobe_return();\n}\n```\n\n### 注册 Jprobe\
  \ 处理器\n\n```c\n#include <linux/kernel.h>\n#include <linux/module.h>\n#include <linux/kprobes.h>\n\
  #include <linux/kallsyms.h>\n\n/* 每个探测器的结构体 */\nstatic struct jprobe jprobe_eg =\
  \ {\n    .entry = (kprobe_opcode_t *) jprintk\n};\n\nint init_module(void)\n{\n\
  \    int retval;\n    jprobe_eg.kp.addr = (kprobe_opcode_t*)kallsyms_lookup_name(\"\
  printk\");\n    if (!jprobe_eg.kp.addr) {\n        printk(\"Bad probe point\\n\"\
  );\n        return -1;\n    }\n    /* 注册 Jprobe */\n    if ((retval = register_jprobe(&jprobe_eg))\
  \ < 0) {\n        printk(\"register_jprobe error, return value=%d\\n\",\n      \
  \  retval);\n        return -1;\n    }\n    printk(\"Jprobe registered.\\n\");\n\
  \    return 0;\n}\n\nvoid module_cleanup(void)\n{\n    unregister_jprobe(&jprobe_eg);\n\
  }\n\nMODULE_LICENSE(\"GPL\");\n```\n\n\n\n\n\n定义在 `drivers/char/tty_io.c` 中的函数 `tty_open()`\
  \ 有七条返回路径。\n\n成功路径返回 0，其他路径返回如 `-ENXIO` 和 `-ENODEV` 等错误值。无论关联的代码路径如何，单个 `kretprobe`\
  \ 就足以向你报警失败情况。列表 21.5 实现了这个 `kretprobe`。\n\n列表 21.5 注册返回探测处理程序\n\n```c\n#include\
  \ <linux/kernel.h>\n#include <linux/module.h>\n#include <linux/kprobes.h>\n#include\
  \ <linux/kallsyms.h>\n\n/* 退出 tty_open() 时执行的 kretprobe */\nstatic int\nkret_tty_open(struct\
  \ kretprobe_instance *kreti,\nstruct pt_regs *regs)\n{\n/* 在 x86 系统上，EAX 寄存器包含函数的返回值\
  \ */\n    if ((int) regs->eax) {\n    /* tty_open() 失败。宣布返回码 */\n    printk(\"tty_open\
  \ returned %d\\n\", (int)regs->eax);\n    }\n    return 0;\n}\n\n/* 探测结构体 */\nstatic\
  \ struct kretprobe kretprobe_eg = {\n    .handler = (kretprobe_handler_t)kret_tty_open\n\
  };\n\nint\ninit_module(void)\n{\n    int retval;\n    kretprobe_eg.kp.addr = (kprobe_opcode_t*)\n\
  \    kallsyms_lookup_name(\"tty_open\");\n    if (!kretprobe_eg.kp.addr) {\n   \
  \     printk(\"Bad Probe Point\\n\");\n        return -1;\n    }\n    /* 注册 kretprobe\
  \ */\n    if ((retval = register_kretprobe(&kretprobe_eg) < 0)) {\n        printk(\"\
  register_kretprobe error, return value=%d\\n\", retval);\n        return -1;\n \
  \   }\n    printk(\"kretprobe registered.\\n\");\n    return 0;\n}\n\nvoid module_cleanup(void)\n\
  {\n    unregister_kretprobe(&kretprobe_eg);\n}\nMODULE_LICENSE(\"GPL\");\n```\n\n\
  ### 内核探测 (Kernel Probes)\n\n当列表 21.5 调用 `register_kprobes()` 时，一个 `kprobe` 会内部插入到\
  \ `tty_open()` 的开头。当此探测被触发时，该内部 kprobe 处理程序会将函数返回地址替换为特殊例程的地址（在 Kprobes 术语中称为 `trampoline`）。查看\
  \ `arch/your-arch/kernel/kprobes.c` 以获取 trampoline 的实现。\n\n当 `tty_open()` 通过其七条返回路径之一返回时，控制权将返回到\
  \ trampoline 而不是调用函数。trampoline 调用由列表 21.5 注册的 `kretprobe` 处理程序 `kret_tty_open()`，如果\
  \ `tty_open()` 没有成功返回，该程序将打印返回值。\n\n### 局限性\n\nKprobes 有其局限性。其中某些是显而易见的。例如，如果你在内联函数（inline\
  \ function）内部插入 `kprobe`，将无法得到预期的结果。而且，你显然无法探测 Kprobes 自身的代码。\n\nKprobes 在应用于基础内核内部探测时更有用。如果目标代码是动态加载模块的一部分，你可能不如重写并重新编译你的模块，而不是编写并编译一个新模块来对其进行“kprobe”。然而，如果强制卸载该模块是不可接受的，你可能仍然想使用\
  \ Kprobes。\n\n也存在不那么明显的局限性。优化是在编译时完成的，而 Kprobes 是在运行时插入的。因此，通过 Kprobes 插入指令的效果并不等同于在原始源文件中添加代码。例如，这段有缺陷的代码片段：\n\
  \n```c\nvolatile int *integerp = 0xFF;\nint integerd = *integerp;\n```\n被编译器简化为\n\
  ```assembly\nmov 0xff, %eax\n```\n\n因此，如果你想在那两行 C 代码之间溜入、分配一个字的内存、让 `integerp` 指向分配的字并规避内核崩溃，你无法轻易使用\
  \ Kprobes 实现。\n\nSystemTap 是一种简化 Kprobes 使用的诊断工具。\n\n## 查看源码\n\nKprobes 的实现由两部分组成：`kernel/kprobes.c`（以及\
  \ `include/linux/kprobes.h`）中的通用部分，以及位于 `arch/your-arch/kernel/kprobes.c`（以及 `include/asm-your-arch/kprobes.h`）的体系相关部分。深入查看\
  \ `Documentation/kprobes.txt` 获取关于 Kprobes、Jprobes 和 Kretprobes 的更多信息。\n\n### Kexec\
  \ 和 Kdump\n\n现在你已经学会了如何使用 Kprobes，让我们继续查看 Linux RAS 的更多方面。`Kexec` 和 `kdump` 是 2.6\
  \ 内核引入的可用性特性。\n\n`Kexec` 使用 UNIX `exec()` 系统调用的镜像叠加理念，在运行的内核之上启动新内核，而无需启动固件的开销。这可以节省几秒的重启时间，因为启动固件需要花费周期遍历总线并识别设备。重启延迟越低，系统停机时间越短；因此，这是开发\
  \ `kexec` 的主要动机之一。然而，`kexec` 最受欢迎的用户是 `kdump`。在内核崩溃后捕捉转储本质上是不可靠的，因为访问转储设备的内核代码可能处于不稳定状态。`kdump`\
  \ 通过通过 `kexec` 进入健康内核启动后收集转储来规避这个问题。\n\n### Kexec\n\n在可以 `kexec` 内核之前，你需要进行一些准备工作：\n\
  \n1. 编译并启动一个支持 `kexec` 的内核。为此，请在内核配置菜单中开启 `CONFIG_KEXEC`（处理器类型和特性 Kexec 系统调用）。此内核被称为第一个内核或运行中的内核。\n\
  2. 准备要被 `kexec-ed` 的内核。这第二个内核可以与第一个内核相同。\n3. 下载 `kexec-tools` 软件包并生成名为 `kexec` 的用户空间工具。\n\
  \n`kexec` 工具分两个阶段执行。第一阶段将第二个内核镜像加载到运行中内核的缓冲区中，而第二阶段则真正叠加运行中的内核：\n\n1. 使用 `kexec`\
  \ 命令加载第二个（叠加）内核：\n```bash\nkexec -l /path/to/kernels/arch/x86/boot/bzImage append=\"\
  root=/dev/hdaX\" --initrd=/boot/initrd.img\n```\n`bzImage` 是第二个内核，`hdaX` 是根设备，`initrd.img`\
  \ 是初始根文件系统。该阶段的内核实现大部分与体系无关。该阶段的核心是 `sys_kexec()` 系统调用。`kexec` 命令使用该系统调用服务将新内核加载到缓冲区中。\n\
  \n2. 进入第二个内核：\n```bash\nkexec -e\n```\n\n`kexec` 直接启动新内核，而不优雅地关闭操作系统。若要在重启前关闭，请在\
  \ `halt` 脚本（通常为 `/etc/rc.d/rc0.d/S01halt`）底部调用 `kexec` 而不是 `halt`。第二阶段的实现取决于体系。该阶段的关键是一个包含用于放置新内核的汇编代码缓冲区。\n\
  \n实现 `kexec` 的一个挑战是内核与启动固件之间发生的交互（在 x86 系统上是 BIOS，在 POWER 机器上是 Open firmware，等等）。在\
  \ x86 系统上，由 BIOS 传递给内核的 e820 内存映射等信息需要提供给 `kexec-ed` 内核。\n\n### 带有 Kdump 的 Kexec\n\
  \n当与 `kdump` 配合使用时，`kexec` 的调用语义有些特殊。在这种情况下，`kexec` 需要在遇到内核恐慌（panic）时自动启动新内核。如果运行中的内核崩溃，将启动新内核（称为捕捉内核）以可靠地收集转储。典型的调用语法如下：\n\
  \n```bash\nkexec -p /path/to/capture-kernel-sources/vmlinux\n```\n\n\n\n\n\n`--args-linux\
  \ --append=\"root=/dev/hdaX irqpoll\"` \n\n`--initrd=/boot/myinitrd.img`\n\n`-p`\
  \ 选项要求 `kexec` 在发生内核恐（kernel panic）时触发重启。`vmlinux` ELF 内核镜像作为捕获内核。由于 `vmlinux` 是一个通用的\
  \ ELF 启动镜像，且 `kexec` 在理论上与操作系统无关，因此你需要通过 `--args-linux` 选项指定后续参数必须以 Linux 特有的方式解释。捕获内核在内核崩溃期间异步启动，因此使用共享中断的设备驱动程序在启动过程中可能会致命地表现出不友好”。为了照顾这些驱动，可以使用\
  \ `--append` 在传递给捕获内核的命令行中指定 `irqpoll`。\n\n要在 `kdump` 中使用 `kexec`，你需要额外的内核配置。捕获内核需要访问崩溃内核的内核内存以生成完整的转储（dump），因此后者不能像非\
  \ kdump 情况下的 `kexec` 那样直接覆盖前者。运行中的内核需要预留一段内存区域来运行捕获内核。要标记该区域：\n\n- 使用带有命令行参数 `crashkernel=64M@16M`（或其他合适的\
  \ `size@start` 值）启动第一个内核。同时，通过启用配置菜单中的 `CONFIG_DEBUG_INFO`（*Kernel Hacking Compile\
  \ Kernel with Debug Info*）在内核镜像中包含调试符号。\n- 在配置捕获内核时，将 `CONFIG_PHYSICAL_START` 设置为上方分配相同起始值（在本例中为\
  \ 16M）。如果你 `kexec` 进入捕获内核并查看 `/proc/meminfo`，你将发现该大小（在本例中为 64M）是该内核可见的物理内存总量。\n\n\
  现在你已经熟悉了 `kexec` 并从 `kdump` 用户的角度掌握了它，让我们深入研究 `kdump` 并使用它来分析一些现实世界的内核崩溃。\n\n# Kdump\n\
  \n在内核崩溃或挂起后捕获的系统内存镜像被称为 `crash dump`（崩溃转储）。分析转储可以为内核问题的事后分析提供宝贵的线索。然而，在内核崩溃后获取转储本质上是不可靠的，因为负责将数据记录到转储设备的存储驱动程序可能处于未定义状态。\n\
  \n在 `kdump` 出现之前，*Linux Kernel Crash Dump* (LKCD) 是获取和分析转储的流行机制。LKCD 使用临时转储设备（如交换分区）来捕获转储。然后它热重启回健康状态，并将转储从临时设备复制到持久位置。使用名为\
  \ `lcrash` 的工具来分析转储。LKCD 的缺点包括：\n\n- 即使在已崩溃的内核上，将转储复制到临时设备也可能是不可靠的。\n- 转储设备的配置并不简单。\n\
  - 重启可能会缓慢，因为只有在转储安全保存到持久位置后，交换空间才能被激活。\n- LKCD 不是主内核的一部分，因此为你的内核版本安装适当的补丁是一个障碍。\n\
  \n`kdump` 并不受这些缺陷的困扰。它通过通过 `kexec` 启动到健康内核后收集转储，从而消除了不确定性。此外，由于内存状态在 `kexec` 重启后得以保留，因此可以从捕获内核准确访问内存镜像。\n\
  \n让我们先完成初步的 `kdump` 设置：\n\n1. 如果运行中的内核遇到 panic，要求其 `kexec` 进入捕获内核。捕获内核还应额外开启 `CONFIG_HIMEM`\
  \ 和 `CONFIG_CRASH_DUMP`。（这两个选项位于内核配置菜单中的 *Processor type and Features* 内。）\n2. 捕获内核启动后，将收集到的转储信息从\
  \ `/proc/vmcore`（通过启用内核配置菜单中的 `CONFIG_PROC_VMCORE` 获取）复制到硬盘上的文件：\n\n```bash\ncp\
  \ /proc/vmcore /dump/vmcore.dump\n```\n你也可以通过 `/dev/oldmem` 保存其他信息，例如崩溃内核的原始内存快照。\n\
  3. 回到第一个内核。你现在准备好开始转储分析了。\n\n让我们使用收集转储文件和 `crash` 工具分析一些示例内核崩溃。在 RTC 驱动的中断处理程序（`drivers/char/rtc.c`）内部引入这个：\n\
  \n```\nirqreturn_t rtc_interrupt(int irq, void *dev_id)\n{\n+ volatile int *integerp\
  \ = 0xFF;\n+ int integerd = *integerp; /* 错误的内存引用！ */\nspin_lock(&rtc_lock);\n/*\
  \ ... */\n}\n```\n\n通过通过 `hwclock` 命令启用中断来触发处理器的执行：\n\n```bash\nhwclock\n```\n\n\
  → 当执行遇到 `rtc_interrupt()` 时发生内核 panic，导致 `kexec` 启动进入捕获内核。\n\n将 `/proc/vmcore` 保存到\
  \ `/dump/vmcore.dump`，重启回到第一个（崩溃的）内核，并使用 `crash` 工具开始分析。在现实情况下，当然，转储可能在客户现场捕获，而分析在支持中心完成：\n\
  \n```bash\ncrash /usr/src/linux/vmlinux /dump/vmcore.dump\n```\n\n```\ncrash 4.0-2.24\n\
  ...\nKERNEL: /usr/src/linux/vmlinux\nDUMPFILE: /root/vmcore.dumpfile\nCPUS: 1\n\
  DATE: Mon Nov 26 04:15:49 2007\nUPTIME: 00:17:22\nLOAD AVERAGE: 0.82, 1.02, 0.87\n\
  TASKS: 63\n...\nPANIC: \"Oops: 0000 [#1]\" (查看日志获取详情)\ncrash>\n```\n\n检查堆栈跟踪以理解崩溃原因：\n\
  \n```\ncrash> bt\nPID: 0 TASK: c03a32e0 CPU: 0 COMMAND: \"swapper\"\n#0 [c0431eb8]\
  \ crash_kexec at c013a8e7\n#1 [c0431f04] die at c0103a73\n#2 [c0431f44] do_page_fault\
  \ at c0311f4\n```\n\n堆栈跟踪将怀疑指向了 `rtc_interrupt`。让我们反汇编 `rtc_interrupt()` 附近的指令：\n\
  \n```\ncrash> dis 0xf8ac000\n0f8ac000 <rtc_interrupt>: push %ebx\n0f8ac001 <rtc_interrupt>:\
  \ sub $0x4,%esp\n0f8ac004 <rtc_interrupt>: mov 0xff,%eax\n0f8ac009 <rtc_interrupt>:\
  \ mov $0xc03a640,%eax\n0f8ac00e <rtc_interrupt>: call 0xc034230 <_spin_lock>\n```\n\
  \n`0xf8ac004` 处的指令尝试将 `EAX` 寄存器的内容移动到 `0xff`，这显然是导致崩溃的无效引用。如果你使用 `irq` 命令，可以确定崩溃期间处于激活状态的中断身份：\n\
  \n```\ncrash> irq\nIRQ: 8\nSTATUS: 1 (IRQ_INPROGRESS)\n...\n...\nhandler: f8a8c000\
  \ <rtc_interrupt>\nflags: 20000000 (SA_INTERRUPT)\nmask: 0\nname: f8a8c29d \"rtc\"\
  \n```\n\n```bash\ncrash> quit\n```\n\n现在让我们切换一下，看看内核冻结而不是产生“oops”的情况。考虑以下有误的 `init()`\
  \ 例程：\n\n```c\nstatic int __init\nmydrv_init(void)\n{\nspin_lock(&mydrv_wq.lock);\
  \ /* 初始化前的使用！ */\nspin_lock_init(&mydrv_wq.lock);\n/* ... */\n}\n```\n\n该代码在初始化之前错误地使用了自旋锁。实际上，CPU\
  \ 将无限旋转尝试获取锁，内核看起来似乎挂起了。让我们使用 `kdump` 调试这个问题。在这种情况下，由于没有 panic，因此不会自动触发，请通过按下魔法\
  \ Sysrq 键组合 Alt-Sysrq-c 来强制触发崩溃转储。你可能需要通过向 `/proc/sys/kernel/sysrq` 写入 1 来启用 Sysrq：\n\
  \n```bash\necho 1 > /proc/sys/kernel/sysrq\ninsmod mydrv.ko\n```\n\n这导致内核在 `mydrv_init()`\
  \ 内部挂起。按下 Alt-Sysrq-c 组合触发崩溃转储：\n\n**Alt-Sysrq-c**\n\n→ 宣布已触发崩溃转储的消息\n\n\n\n\n在\
  \ `kexec` 启动捕捉内核后，将转储保存到磁盘，返回原始内核，并对保存的转储运行 `crash`：\n\n```bash\ncrash vmlinux vmcore.dump\n\
  ```\n\n...\n\nPANIC: \"SysRq : Trigger a crashdump\"\n\nPID: 2115\n\nCOMMAND: \"\
  insmod\"\n\nTASK: f7c57000 [THREAD_INFO: f6170000]\n\nCPU: 0\n\nSTATE: TASK_RUNNING\
  \ (SYSRQ)\n\n`crash>`\n\n# Kexec 和 Kdump\n\n627\n\n通过检查崩溃发生时运行的进程身份来测试一下。在这种情况下，它显然是\
  \ `insmod`（来自 `mydrv.ko`）：\n\n```bash\ncrash> ps\n```\n\n...\n\n2171 2137 0 f6bb7000\
  \ IN 0.5 11728 5352 emacs-x\n2214 1 0 f6b5b000 IN 0.1 2732 1192 login\n2230 2214\
  \ 0 f6bb0550 IN 0.1 4580 1528 bash\n> 2261 2230 0 c596f550 RU 0.0 1572 376 insmod\n\
  \n堆栈回溯没有提供太多信息，除了告诉你是按下 Sysrq 键导致了转储：\n\n```bash\ncrash> bt\n```\n\nPID: 2115 TASK:\
  \ f7c57000 CPU: 0 COMMAND: \"insmod\"\n#0 [c0431e68] crash_kexec at c013a8e7\n#1\
  \ [c0431eb4] __handle_sysrq at c0254664\n#2 [c0431edc] handle_sysrq at c0254713\n\
  \n接下来让我们尝试查看崩溃内核生成的日志消息。`log` 命令从转储文件中的内核 `printk` 环形缓冲区中读取消息：\n\n```bash\ncrash>\
  \ log\n```\n\n...\n\nBUG: soft lockup detected on CPU#0!\nPid: 2261, comm: insmod\n\
  EIP: 0060:[<c010ec1b>] CPU: 0\nEIP is at delay_pmtmr+0xb/0x20\nEFLAGS: 00000246\
  \ Tainted: P (2.6.16.16 #11)\nEAX: 5caaa48c EBX: 00000001 ECX: 5caaa459 EDX: 00000012\n\
  ESI: 02e169c9 EDI: 00000000 EBP: 00000001 DS: 007b ES: 007b\nCR0: 8005003b CR2:\
  \ 08062017 CR3: 35e89000 CR4: 000006d0\n[<c01fede9>] __delay+0x9/0x10\n[<c0200089>]\
  \ _raw_spin_lock+0xa9/0x15\n[<f893d00d>] mydrv_init+0xd/0xb2 [wqdrv]\n[<c0136565>]\
  \ sys_init_module+0x175/0x17a2\n[<c015d834>] do_sync_read+0xc4/0x100\n[<c013ce4d>]\
  \ audit_syscall_entry+0x13d/0x170\n[<c0105578>] do_syscall_trace+0x208/0x21a\n[<c0102f05>]\
  \ syscall_call+0x7/0xb\nSysRq : Trigger a crashdump\n\n`crash>`\n\n628 第 21 章 调试设备驱动\n\
  \n日志提供了两个有用的调试信息。首先，它让你知道在崩溃内核上检测到了软锁（soft lockup）。正如第 5 章“字符设备程序”中“设备示例：看门定时器”节所述的，内核检测软锁的方式如下：内核看门线程每秒运行一次，并更新每个\
  \ CPU 时间戳变量。如果 CPU 处于死循环中，看门线程将无法更新此时间戳。在定时器中断期间，使用 `softlockup_tick()`（定义在 `kernel/softlockup.c`\
  \ 中）进行更新检查。如果看门时间戳超过 10 秒，它就会认为发生了软锁，并发出相应的内核消息。\n\n其次，日志对 `mydrv_init()+0xd`（或\
  \ `0xf893d00`）表示不满，因此让我们看看周围代码区域的反汇编代码：\n\n```bash\ncrash> dis f893d000 5\n```\n\
  \ndis: WARNING: f893d000: no associated kernel symbol found\n0xf893d000: mov $0xf89f1208,%eax\n\
  0xf893d005: sub $0x8,%esp\n0xf893d008: call 0xc0342300 <_spin_lock>\n0xf893d00d:\
  \ movl $0xffffffff,0xf89f1214\n0xf893d017: movl $0xffffffff,0xf89f1210\n\n堆栈中的返回地址是\
  \ `0xf893d00d`，因此内核挂在了上一条指令内部，即对 `spin_lock()` 的调用。如果你将其与之前的代码片段结合并仔细观察，你可以看到错误序列\
  \ `spin_lock()/spin_lock_init()` 正在忧伤地回视着你。通过交换顺序来解决这个问题。\n\n你也可以使用 `crash` 查看感兴趣的数据结构，但请注意，崩溃期间被换出的内存区域不属于转储的一部分。在前面的示例中，你可以按照以下方式检查\
  \ `mydrv_wq`：\n\n```bash\ncrash> rd mydrv_wq 100\n```\n\nf892c200: 00000000 00000000\
  \ 00000000 00000000 ................\n...\nf892c230: 2e636373 00000068 00000000\
  \ 00000011 scc.h...........\n\nGdb 已与 `crash` 集成，因此你可以从 `crash` 将命令传递给 `gdb` 进行评估。例如，你可以使用\
  \ `gdb` 的 `p` 命令打印数据结构。\n\n`kexec` 中依赖于架构的部分位于 `arch/your-arch/kernel/machine_kexec.c`\
  \ 和 `arch/your-arch/kernel/relocate_kernel.S`。通用部分位于 `kernel/kexec.c`（以及 `include/linux/kexec.h`）。深入查看\
  \ `arch/your-arch/kernel/crash.c` 和 `arch/your-arch/kernel/*`\n\n\n\n\n```bash\n\
  opreport -l /path/to/kernelsources/vmlinux\n```\n\nCPU: P4 / Xeon, speed 2992.9\
  \ MHz (estimated)\n\n计数了 `GLOBAL_POWER_EVENTS` 事件（处理器未停止的时间），单位掩码为 `0x01`（在处理器活动状态时计数周期）\n\
  \ncount 100000\n\nsamples % 符号名\n\n914506 24.2423 vgacon_scroll\n→ 输出到控制台 `ls` 输出\n\
  \n406619 10.7789 do_con_write\n\n273023 7.2375 vgacon_cursor\n\n206611 5.4770 __d_lookup\n\
  \n...\n\n1380 0.0366 vfs_readdir\n→ 我们感兴趣的例程\n\n...\n\n1 2.7e-05 vma_prio_tree_next\n\
  \n现在我们通过在 `vfs_readdir()` 中引入 1 毫秒的延迟来模拟 VFS 代码中的瓶颈。这在列表 21.6 中所示。\n\n列表 21.6 定义在\
  \ `fs/read_dir.c` 中的 `vfs_readdir()`\n\n```c\nint vfs_readdir(struct file *file,\
  \ filldir_t filler, void *buf)\n{\n    struct inode *inode = file->f_ dentry->d_inode;\n\
  \    int res = -ENOTDIR;\n+ /* 引入毫秒级瓶颈 */\n+ /* (在此系统上 HZ 设置为 1000) */\n+ unsigned\
  \ long timeout = jiffies+1;\n+ while (time_before(jiffies, timeout));\n+ /* 瓶颈结束\
  \ */\n    /* ... */\n}\n```\n\n632 第 21 章调试设备驱动\n\n使用此更改编译内核并重新收集性能数据。新数据如下：\n\n\
  ```bash\nopreport -l /path/to/kernelsources/vmlinux\n```\n\nCPU: P4 / Xeon, speed\
  \ 2993.08 MHz (estimated)\n\n计数了 `GLOBAL_POWER_EVENTS` 事件（处理器未停止的时间），单位掩码为 `0x01`（在处理器活动状态时计数周期）\n\
  \ncount 100000\n\nsamples % 符号名\n\n6178015 57.1640 vfs_readdir\nA 我们感兴趣的例程\n\n1065197\
  \ 9.8561 vgacon_scroll\nA 输出到控制台 `ls` 输出\n\n479801 4.4395 do_con_write\n\n...\n\n\
  如你所见，瓶颈清晰地反映在性能数据中。`vfs_readdir()` 现在跳到了列表顶端！\n\n你可以使用 OProfi 获取更多信息。例如，你可以收集数据缓存行缺失的百分比。缓存是靠近处理器的快速内存。缓存的取取是以处理器缓存行为单位进行的（Pentium\
  \ 4 为 32 字节）。如果你需要访问的数据不在缓存中（缓存缺失），处理器就必须从主内存中提取，这会消耗更多的 CPU 周期。对该内存的后续访问（以及被触入缓存的周围字节）将更快，直到相应的缓存行失效。你可以通过对你的内核代码进行（针对\
  \ Pentium 4 的）`BSQ_CACHE_REFERENCE` 事件分析，来配置 OProfi 计数缓存缺失次数。然后你可以调整代码，可能通过重新对齐数据结构中的字段，来实现更好的缓存利用率：\n\
  \n```bash\nopcontrol --setup\n--event=BSQ_CACHE_REFERENCE:50000:0x100:1:1\n--vmlinux=/path/to/kernelsources/vmlinux\n\
  ```\nA 单位掩码 `0x100` 表示 L2 缓存缺失\n\n```bash\nopcontrol --start\n```\nA 开始数据收集\n\n\
  ```bash\nls -lR /**\n```\nA 压力测试\n\n```bash\nopcontrol --dump\n```\nA 保存性能数据\n\n\
  ```bash\nopreport -l /path/to/kernelsources/vmlinux\n```\n性能分析\n\n633\n\nCPU: P4\
  \ / Xeon, speed 2993.68 MHz (estimated)\n\n计数了 `BSQ_CACHE_REFERENCE` 事件（总线单元看到的缓存引用），单位掩码为\
  \ `0x100`（读取二级缓存缺失）count 50000\n\nsamples % 符号名\n\n```3\n73 29.6748 find_inode_fast\n\
  \n59 23.9837 __d_lookup\n\n27 10.9756 inode_init_once\n\n...\n\n```\n\n如果你在不同的内核版本上运行\
  \ OProfi 并查看相应的变更日志，你可能找出内核不同部分代码更改的原因。\n\n你仅仅接触了使用 OProfi 可以实现的功能冰一角。更多信息请访问 [`oprofi.sourceforge.net/`](http://oprofi.sourceforge.net/)。\n\
  \n使用 Gprof 进行应用程序分析\n\n如果你只需要孤立地对应用程序进程进行分析，而不分析可能代表其执行的内核代码，请使用 `gprof` 而不是 OProfi。gprof\
  \ 依赖于编译器生成的额外代码来分析 C、Pascal 或 Fortran 程序。让我们使用 `gprof` 分析以下代码段：\n\n```c\nmain(int\
  \ argc, char *argv[])\n{\n    int i;\n    for (i=0; i<10; i++) {\n        if (!do_task())\
  \ { /* 执行任务 */\n            do_error_handling(); /* 处理错误 */\n        }\n    }\n\
  }\n```\n\n使用 `-pg` 选项要求编译器包含在程序运行时生成调用图分析的额外代码。`-g` 选项生成符号信息：\n\n```bash\ngcc -pg\
  \ -g -o myprog myprog.c\n./myprog\n```\n\n634 第 21 章调试设备驱动\n\n这产生 `gmon.out`，它是\
  \ `myprog` 的调用图。运行 `gprof` 查看性能数据：\n```bash\ngprof -p -b myprog\n```\n\n平化分析（Flat\
  \ profile）：\n\n每个样本计为 0.01 秒。\n\n% 累计 自有 总计\ntime seconds seconds calls s/call s/call\
  \ name\n65.17 2.75 2.75 2 1.38 1.38 do_task\n34.83 2.22 1.47 10 0.15 0.15 do_error_handling\n\
  这显示错误路径被触发了两次。你可以调整代码以减少对错误路径的遍历次数。\n\n追踪（Tracing）为在不同代码模块交互期间显现的行为问题提供了洞察。与 Oprofile\
  \ 通过定期间隔采样事件来收集数据不同，LTT 提供了事件发生时的精确轨迹追踪。\n\nLTT 由四个部分组成：\n- 核心模块，为内核的其他部分提供追踪服务。收集到的轨迹被复制到内核缓冲区。\n\
  - 使用追踪服务的代码。这些代码被插入在你想要捕获轨迹快的点。\n- 追踪守护进程，从内核缓冲区提取轨迹信息并保存到文件系统中的永久位置。\n- 工具程序，如\
  \ *tracereader* 和 *tracevisualizer*，用于解释原始轨迹数据并转换为人类可读的形式。如果你为没有 GUI 支持的嵌入式设备开发代码，可以在另一台机器上透明地运行这些工具。\n\
  \n事后分析（postmortem analysis）在无法使用调试器的情况下非常有价值。LTT 不是主内核的一部分。你可以从 [www.kernel.org](http://www.kernel.org)\
  \ 下载 LTT 内核补丁、守护进程和用户空间追踪工具。\n\n让我们通过一个简单的例子来看看 LTT 提供了什么。假设你的应用程序从设备读取数据时遇到了数据损坏。你首先想确定是设备发送了坏数据，还是内核层引入了损坏。为了做到这一点，在设备驱动程序级转储数据包和数据结构。列表\
  \ 21.7 初始化了你计划生成的 LTT 事件。\n\n列表 21.7 创建 LTT 事件\n\n```c\n#include <linux/trace.h>\n\
  \nint data_packet, driver_data; /* 追踪事件 */\n\n/* 驱动初始化 */\nstatic int __init mydriver_init(void)\n\
  {\n    /* ... */\n    /* 用于转储从设备接收的数据包事件 */\n    data_packet = trace_create_event(\"\
  data_pkt\",\n    NULL,\n    CUSTOM_EVENT_FORMAT_TYPE_HEX,\n    NULL);\n\n    /*\
  \ 用于转储驱动结构的事件 */\n    driver_data = trace_create_event(\"dvr_data\",\n    NULL,\n\
  \    CUSTOM_EVENT_FORMAT_TYPE_HEX,\n    NULL);\n\n    /* ... */\n}\n```\n\n8 LTT\
  \ 作为发布候选版本包含在 *2.6.11-rc1-mm1* 补丁中。\n\n635 追踪\n\n636 \n\n接下来，让我们添加追踪钩子，以便驱动从设备读取数据时转储接收到的包和数据结构。这在列表\
  \ 21.8 的驱动 read() 中所示。\n\n\n\n\n\n# 方法\n\n## 列表 21.8 获取跟踪转储 (Trace Dumps)\n\n```c\n\
  struct mydriver_data driver_data; /* 私有设备结构 */\n\n/* 驱动 read() 方法 */\nssize_t\n\
  mydriver_read(struct file *file, char *buf,\nsize_t count, loff_t *ppos)\n{\n  \
  \  char *buffer;\n    /* 从设备读取 numbytes 字节数据到 buffer */\n    /* ... */\n    /* 转储数据包。如果只在某些特定条件下遇到问题，\n\
  \    例如当数据包长度大于某个值时，请使用该值作为过滤器 */\n    if (condition) {\n        /* data_packet\
  \ 的定义请参见列表 21.7 */\n        trace_raw_event(data_packet, numbytes, buffer);\n  \
  \  }\n    /* 转储驱动数据结构体 */\n    if (some_other_condition) {\n        /* driver_data\
  \ 的定义请参见列表 21.7 */\n        trace_raw_event(driver_data, sizeof(driver_data), &driver_data);\n\
  \    }\n    /* ... */\n}\n```\n\n将此代码作为内核的一部分或模块编译并运行。记住在配置内核时，通过设置 `CONFIG_TRACE`\
  \ 来开启内核的跟踪支持。\n\n下一步是启动跟踪守护进程：\n\n```bash\ntracedaemon -ts60 /dev/tracer mylog.txt\
  \ mylog.proc\n```\n\n`/dev/tracer` 是跟踪守护进程访问跟踪缓冲器的接口，`-ts60` 请求守护进程运行 60 秒，`mylog.txt`\
  \ 是你想要存储生成的原始跟踪的文件，而 `mylog.proc` 是你想要保存从 procfs 获取的系统状态的地方。较新版本的 LTT 使用了名为 `relayfs`\
  \ 的机制而不是 `/dev/tracer` 设备，以便有效地将数据从内核跟踪缓冲区传输到用户空间。\n\n运行你从设备读取数据的应用程序：\n\n```bash\n\
  ./application\n```\n\n## `mydriver_read()` 的触发调用\n\n`mylog.txt` 现在应该包含请求的跟踪数据。可以使用\
  \ `tracevisualizer` 工具对生成的原始跟踪进行分析。选择 `Custom Events`（自定义事件）选项并搜索 `data_pkt` 和 `dvr_data`\
  \ 事件。输出如下：\n\n```\n####################################################################\n\
  Event Time SECS MICROSEC PID Length Description\n####################################################################\n\
  data_pkt 1,110,563,008,742,457 0 27 12 43 AB AC 00 01 0D 56\ndata_pkt 1,110,563,008,743,151\
  \ 0 27 01 D4 73 F1 0A CB DD 06\ndvr_data 1,110,563,008,743,684 0 25 0D EF 97 1A\
  \ 3D 4C\n...\n```\n\n最后一列持有跟踪数据。时间戳显示了收集跟踪的瞬间。如果数据看起来已损坏，设备可能正在发送错误数据。否则，问题一定在更高层的内核层，可以通过获取来自数据流路径中不同点的跟踪来进一步隔离问题。\n\
  \n下一代 LTT 称为 LTTng，可以从 http://ltt.polymtl.ca/ 下载。该项目还包含一个名为 `Linux Trace Toolkit\
  \ Viewer` (LTTV) 的后跟踪分析器。\n\n如果你只需要对用户应用程序进行有限的跟踪，可以使用 `strace` 工具而不是 LTT。strace\
  \ 使用内核中的 `ptrace` 支持来拦截系统调用。它会打印出应用程序发出的系统调用列表，以及相应的参数和返回值。\n\n`Linux Test Project`\
  \ (LTP) 托管在 http://ltp.sourceforge.net/，是一个包含约 3000 个测试的套件，旨在测试内核的不同部分。大多数测试在不需要用户干预的情况下运行。其他测试（如网络和存储媒体测试）需要手动配置。\n\
  \n从 LTP 主页下载源码 tar 包，运行 `make`，并在源码树根目录下调用封装脚本 `runltp` 来启动测试。要将结果捕获到 `results/`\
  \ 目录下的 `logfile` 中，请执行：\n\n```bash\nrunltp –p –l logfile\n```\n\nLTP 生成的一些错误是“意料之中的”。LTP\
  \ 网站记录了各种内核版本的预期错误列表。网站上还对几个内核版本的 LTP 代码覆盖率（总体覆盖率、路径中的行和命中的不同行）进行了有趣的分析，分布在内核树目录中。\n\
  \n`User Mode Linux` (UML) 托管在 http://user-mode-linux.sourceforge.net/，让你可以在不导致机器崩溃（Oops）的情况下调试内核。为了实现这一点，内核实例（称为\
  \ `guest` 内核）作为用户态进程运行在运行中的内核（称为 `host` 内核）之上。\n\nUML 用户多样。它可以作为内核和应用程序代码的环境、实验不稳定内核的工具、托管\
  \ Web 服务器等服务的安全伪计算机，或者学习 Linux 内部原理的工具。对于调试内核中与硬件无关的部分，UML 比调试设备驱动程序更有用。\n\n`sysfsutils`\
  \ 包帮助你浏览 sysfs 内部的海量数据。以及其他 Linux 诊断工具（如 `sysdiag` 和 `lsvpd`）可以从 http://linux-diag.sourceforge.net/\
  \ 下载。\n\n## 内核破解配置选项\n\n在内核配置菜单的 `Kernel hacking*` 下有几个选项可以产生价值贵的调试信息。如果你启用了某个选项，在构建内核时就会编译相应的调试代码。以下是几个例子：\n\
  \n1. `Show Timing information on printks` (`CONFIG_PRINTK_TIME`) 为 `printk()` 输出添加插桩，因此你可以使用\
  \ `printk` 作为检查点来测量执行时间并识别慢代码区域。\n\n2. 使用已释放的内存会导致内存中毒。`Debug slab allocations`\
  \ (`CONFIG_DEBUG_SLAB`) 帮助你检测此类问题。\n\n3. `Spinlock and rw-lock debugging: basic\
  \ checks` (`CONFIG_DEBUG_SPINLOCK`) 发现锁相关问题，如未初始化的自旋锁使用，有助于捕捉非 SMP（多处理器）安全的代码。\n\
  \n4. 你在学习使用 kdump 时已经接触过 `Magic SysRq key` (`CONFIG_MAGIC_SYSRQ`)。如果你开启了它，当内核在调试期间崩溃时，你将会有一些途径。例如，按下\
  \ Alt-Sysrq-t 会产生当前任务的转储，而 Alt-Sysrq-p 会打印处理器寄存器的内容。\n\n5. `Detect Soft Lockups`\
  \ (`CONFIG_DETECT_SOFTLOCKUP`) 利用看门狗服务来检测内核代码中持续超过 10 秒的紧密循环。当我们使用 kdump 分析内核挂起时查看过这一点。注意，无法通过这种方法发现硬件锁定。如果你的平台支持，请使用不可掩断中断\
  \ (NMI)看门狗的服务。\n\n6. 如果在配置内核时启用 `CONFIG_DEBUG_SLAB`、`CONFIG_DEBUG_HIMEM` 或 `CONFIG_DEBUG_PAGE_ALLOC`，将编译额外的错误检查代码帮助调试与内存管理相关的问题。\n\
  \n7. `Check for stack overflows` (`CONFIG_DEBUG_STACKFLOW`) 在可用栈空间低于阈值时添加代码发出警告。`Stack\
  \ utilization instrumentation` (`CONFIG_DEBUG_STACK_USAGE`) 在魔术 Sysrq 输出中添加栈空间插桩。另一个相关选项\
  \ `CONFIG_4KSTACK` 允许将内核栈大小设置为 4KB 而不是 8KB。\n\n8. `Verbose BUG() reporting` (`CONFIG_DEBUG_BUGVERBOSE`)\
  \ 在任何内核代码调用 `BUG()` 时产生额外的调试信息，假设你在内核配置期间开启了 `CONFIG_BUG`。\n\n某些调试选项也存在于 `Kernel\
  \ hacking` 子菜单之外。例如，在本章中我们启用了 `CONFIG_KALLSYMS` 以使用 gdb 调试 “oops”消息和\n\n\n\n\n对内核模块进行\
  \ kprobe。此选项位于配置菜单中 *General setup* 下的 *Configure Standard Kernel Features (for\
  \ small systems)*。\n\n内核黑客（Kernel hacking）选项会产生开销并增加占用，因此不要在生产级内核中开启这些选项。\n\n##\
  \ 测试设备\n\n不言而喻，调试设备驱动程序时你需要全套相关的测试设备。例如，如果你在纯数字实验室环境中测试调制解调器接口，手机模拟器将大有益益。\n\n如果高速串口驱动程序出现奇偶错误，示波器将帮助你分析问题。如果你正在编写\
  \ I/O 设备驱动程序，拥有一个相关的总线分析仪将会有帮助。如果你正在编写网络驱动程序，相应的协议行抓取器将减轻你的调试工作。\n\n![](img/index-672_1.jpg)\n\
  ![](img/index-672_2.jpg)\n\n## 维护与交付\n\n### 本章内容\n- 编码风格\n- 变更标记\n- 版本控制\n- 一致的校验和\n\
  - 构建脚本\n- 可移植代码\n\n你已经到达了设备驱动之旅的终点，但实现驱动程序只是软件开发生命周期的一部分。在结束之前，让我们讨论一些有助于软件维护和交付期间提高效率的想法。\n\
  \n### 编码风格\n许多 Linux 设备的寿命范围为 5 到 10 年，因此遵循标准的编码风格有助于在你离开项目很后仍继续支持该产品。\n\n强大的编辑器配合有组织的写作风格，可以更容易将代码与思想联系起来。良好的风格不存在万无一失的准则，因为这取决于个人偏好，但如果有多个开发者共同维护一个项目，统一的编码方式是无价的。\n\
  \n在启动项目之前，与团队成员和客户达成通用的编码标准。内核开发者偏好的编码风格描述在源码树的 `Documentation/CodingStyle` 中。\n\
  \n### 变更标记\n使用如 `CONFIG_MYPROJECT` 之类的标记来标记现有内核源文件的添加和删除，有助于突出源码树中项目特定的更改。可以从代码树根目录递归\
  \ grep 该标记字符串，以了解为项目实现的所有内核更改的位置。以下示例标记了 `drivers/i2c/busses/i2c-i801.c` 中的代码更改。该修改在设置期间引入了对新\
  \ PCI 设备 ID 的检查，并消除了对配置字节的访问：\n\n```c\n/* ... */\nswitch(dev->device) {\ncase PCI_DEVICE_ID_INTEL_82801DB_3:\n\
  #if defined (CONFIG_MYPROJECT)\ncase PCI_DEVICE_ID_MYID :\n#endif\n}\n/* ... */\n\
  #if !defined (CONFIG_MYPROJECT)\npci_write_config_byte(I801_dev, SMBHSTCFG, temp);\n\
  #endif\nreturn 0;\n/* ... */\n```\n\n`CONFIG_MYPROJECT` 还可以作为配置时的开关，用于启用或禁用项目特定的更改。\n\
  \n为项目中的各种子任务设置子标记是一个好主意。因此，如果你作为项目的一部分为了快速启动而修改内核，请将这些更改封装在如 `CONFIG_MYPROJECT_FASTBOOT`\
  \ 之类的子标记中。\n\n### 版本控制\n如果没有健壮的版本控制库的服务，你就无法执行一个严肃的项目。版本控制系统帮助管理源代码的多个版本，并规范团队成员的文件访问。并发版本系统或\
  \ `CVS` 是一种存在很久的开源修订控制软件，并附带在许多 Linux 发行版中。另一个名为 `subversion` 的版本系统旨在作为 `CVS` 的替代品。`Git`\
  \ 是内核开发者首选的版本控制系统，用于维护多个开源项目，包括 Linux 内核。互联网上有关于这些系统的丰富文档。\n\n### 一致的校验和\n由于发布内核时潜藏的法律问题，公司通常以针对约定基础生成的源补丁形式将内核修改发送给客户。客户随后将补丁集成到内部代码库并在本地构建软件。\n\
  \n将你的二进制镜像的 MD5 校验和与客户的进行比较可以防止补丁错误，但这些值可能无法匹配，因为内核和模块镜像通常包含特定于构建环境的信息。\n\n为了强制生成相同的\
  \ MD5 和，在两端生成内核和模块镜像时排除此类数据。以下是一些向对象镜像注入环境数据的典型场景：\n\n- 某些驱动方法会调用 `BUG()` 来宣布本不应该发生的情况。`BUG()`\
  \ 会输出（除外）错误的文件名和行号。文件路径取决于你的构建沙箱的位置。它会被打印在生成的镜像中，并导致 MD5 差异。例如，查看 `fs/nfs/pagelist.c`\
  \ 中的 `nfs_unlock_request()`：\n\n```c\nvoid nfs_unlock_request(struct nfs_page *req)\n\
  {\n  if (!NFS_WBACK_BUSY(req)) {\n    printk(KERN_ERR \"NFS: Invalid unlock attempted\\\
  n\");\n    BUG();\n  }\n  /* ... */\n}\n```\n\n`BUG()` 定义在 `include/asm-your-arch/bug.h`\
  \ 中：\n```c\n#define BUG() do {\\\n__asm__ __volatile__ (\"ud2\\n\"\\\n...\n: : \"\
  I\" (____LINE__), \"I\"__FILE__))\n```\n\n你可以在内核配置期间通过禁用 `CONFIG_BUG` 来编译掉 `BUG()`。或者你也可以通过关闭\
  \ `CONFIG_DEBUG_BUGVERBOSE` 来消除 `BUG()` 输出的行号和文件名。\n\n- `wd33c93` 驱动（`drivers/scsi/wd33c93.c`）在初始化期间编译时间。如果你去初始化程序\
  \ `wd33c93_init()` 的末尾，你会发现这段代码：\n\n```c\nvoid wd33c93_init(struct Scsi_Host *instance,\n\
  const wd33c93_regs regs, dma_setup_t setup,\ndma_stop_t stop, int clock_freq)\n\
  {\n  /* ... */\n  printk(\"Version %s - %s, Compiled %s at %s\\n\",\n  WD33C93_VERSION,\
  \ WD33C93_DATE, __DATE__, __TIME__););\n}\n```\n\n构建时间因此被嵌入镜像内部，导致 MD5 校验和依赖于它。\n\
  \n- 如果启用 `CONFIG_IKCONFIG_PROC` 配置选项，内核镜像中引入配置时间。此信息在运行时作为 `/proc/config.gz` 的一部分。\n\
  \n- 内核树中 `scripts/` 目录下的工具通过将 `hostname`、`date`、`whoami` 和 `domainname` 等程序的输出注入\
  \ `include/linux/compile.h` 等内核头文件，会导致 MD5 差异。\n\n寻找并屏蔽此类对信息的直接和间接引用，以便在两端生成相同的校验和。当然，你不需要担心不相关的内核模块。将你的代码修改封装在如\
  \ `CONFIG_MYPROJECT_SAME_MD5` 之类的变更标记中，并创建一个内核配置开关来开启或关闭一致的 MD5 生成。完成后，在剥离后的 `vmlinux`\
  \ 镜像上运行 `md5sum`。\n\n### 构建脚本\n客户通常会在开发周期内要求定期软件构建。每次构建都包含新功能或错误修复。例如，嵌入式 PC 衍生品的交付物可能包括固件组件，如基础内核、可加载设备驱动程序模块、文件系统工具、引导程序、BIOS\
  \ 和板上\n\n\n\n\n为了自动化构建生成，最好是实现一组通用的构建脚本，这些脚本从版本控制仓库获取源代码快照，并生成封装好的交付物。\n\n列表 22.1\
  \ 显示了一个骨架构建脚本，它假设使用 `CVS` 进行版本控制。这是一个简单的脚本，仅展示了内核构建。在现实世界，你可能需要一套复杂的脚本来封装多个软件组件并管理不同的安装场景。\n\
  \n### 列表 22.1 简单的构建脚本\n\n```bash\n# 检查编译工具是否已安装\n#...\n\n# 假设 $user 包含用户名，$cverver\
  \ 包含\n# CVS 服务器名称，且 /path/to/repository 是\n# 项目仓库在 CVS 服务器上的位置\nCVS=\"cvs –d :pserver:$user@$cvsserver:/path/to/repository\"\
  \n$CVS login\n\n# 检出内核\n$CVS checkout kernel\n\n# 构建内核\ncd kernel\nmake mrproper\n\
  \n# 获取你平台的 .config 文件\ncp arch/your-arch/configs/your_platform_defconfig .config\n\
  make oldconfig\nmake –j5 bzImage # 通过启动 5 个 'make' 实例来加速\n\nif [ $? != 0 ]\nthen\n\
  \  echo \"Error building Kernel. Bailing out..\"\n  exit 1\nfi\n\n# 将内核镜像拷贝到目标目录\n\
  cp arch/x86/boot/bzImage /path/to/target_directory/productname.kernel\n\n# 构建模块并将它们安装到适当目录\n\
  make modules\nif [ $? != 0 ]\nthen\n  echo \"Error building modules. Bailing..\"\
  \n  exit 2\nfi\nexport INSTALL_MOD_PATH=\"$TARGET_DIRECTORY/modules\"\nmake modules_install\n\
  \n# 在强制生成相同的 MD5 和后\n# 并打包生成的校验和信息。\n#...\n\n# 从基础起点生成源码补丁，假设\n# KERNELBASE 是原生内核的\
  \ CVS tag\ncvs rdiff –u –r KERNELBASE kernel > patch.kernel\n\n# 使用 \"cvs log\"\
  \ 生成变更日志\n#...\n\n# 将所有内容良好地打包成一个 tar 包\n#...\n```\n\n当你对生成的交付物圆满完成构建验证测试后，启动构建后过程，用构建标识符为版本控制系统的当前状态打标记。这本质上是为对应构建的源码快照赋予名称，有助于追溯问题到代码版本。当你以后在实验室尝试重现报告的现场问题时，可以根据相关的构建标识符检出源码版本。\n\
  \n### 可移植代码\n\n可移植性直接意味着代码的可重用性和易维护性。这在当今的市场中非常重要，因为有各种处理器和无数的外围芯片组。如果你必须为每个处理器编写单独的总线驱动程序，为每个主机控制器编写不同的客户端设备驱动程序，事情将迅速失控。以下是编写可移植驱动的一些提示：\n\
  \n* 在设计驱动程序时，将可移植性作为设计目标。\n* 使用适当的内核 API 会自动注入某种可移植性。使用 `USB` 核心服务的 `USB` 驱动将独立于\
  \ `USB` 主机控制器。它可以在不同的系统中运行，无论它们使用的是 `UHCI`、`OHCI` 还是其他。\n* 编写 `SMP` 安全的代码。\n* 编写\
  \ 64 位干净的代码。例如，即使有有效的类型转换，也不要将指针赋值给整数。own* 编写驱动程序，使其能够轻松适应其他类似的设备。\n* 在尽可能可用的地方使用体系无关的\
  \ API。例如，对 `outb()` 或 `inb()` 的调用无论处理器使用 I/O 映射还是内存映射寻址都能工作。如果你确实需要使用特定体系的代码（如内联汇编），将其存放在相应的\
  \ `arch/your-arch/` 目录下。\n* 将策略推向头文件和用户空间。在适当的地方使用宏和定义。\n\n### 检查清单\n\n在过渡到 `init`\
  \ 运行级别 `0` 之前，让我们总结一下获取新设备时如何开启 Linux 支持之路。这里有一个快速检查清单：\n\n1. 识别设备的功能和接口技术。根据你的发现，查看描述相关设备驱动子系统的章节。正如你所学到的，Linux\
  \ 上几乎每个驱动子系统都包含一个提供驱动服务的内核层，和一个使应用程序与底层硬件无关的抽象层（回顾第 18 章“嵌入 Linux”中的图 18.3）。你的驱动需要适应这个框架并与子系统中的其他组件交互。如果你的设备是调制解调器，学习\
  \ `UART`、`tty` 和线路规律（line discipline）层是如何工作的。如果你的芯片是 `RTC` 或看门狗，学习如何符合相应的内核 API。如果你手里是鼠标，找出如何将其与输入事件层绑定。如果你的硬件是视频控制器，获取帧缓冲（frame\
  \ buffer）子系统的专业知识。在开始编写音频解码器驱动程序之前，调查 `ALSA` 框架。\n2. 获取设备的数据表并理解其寄存器编程模型。例如，对于 `I2C`\
  \ DVI 传输器，获取设备的从机地址和初始的编程序列。对于 `SPI` 触摸控制器，理解如何实现其有限状态机。对于 `PCI` 以太网，查找配置空间语义。对于\
  \ `USB` 设备，弄清楚支持的端点并学习如何与它们通信。\n3. 在强大的内核源码树中搜索一个起点驱动。研究候选驱动并锁定一个合适的。如果你没有找到非常匹配的，某些子系统提供了可以供你进行建模的骨架驱动。示例有\
  \ `sound/drivers/dummy.c`、`drivers/usb/usb-skeleton.c`、`drivers/net/pci-skeleton.c`\
  \ 和 `drivers/video/skeletonfb.c`。\n4. 如果你获得了一个起点驱动，通过比较各自的数据表和原理图，调查相关设备与你的硬件之间的准确差异。作为说明，假设你正在将\
  \ Linux 部署基于发行版支持的参考硬件的定制板上。你的发行版包含了在参考硬件上测试过的 `USB` 控制器驱动，但你的定制板是否使用了不同的 `USB`\
  \ 收发器？你有一个用于 LCD 控制器的帧缓冲驱动程序，但你的板是否使用了不同的显示面板接口（如 `LVDS`）？也许位于参考板上 `I2C` 总线上的 `EEPROM`\
  \ 现在位于 1 线的总线上。以太网控制器是否连接到不同的 `PHY` 芯片甚至到二层交换机芯片？或者连接到 `UART` 的 `RS-352` 接口已让位于\
  \ `RS-485` 以获得更好的范围和保真度。\n5. 如果你没有接近的起点，或者你决定从零开始编写自己的驱动程序，请花时间设计和构建驱动程序及其数据结构。\n\
  6. 现在你已经拥有了所有需要的信息，准备好软件工具（如 `ctags`、`cscope` 和调试器）和实验室设备（如示波器、万用表和分析仪），开始编写代码。\n\
  \n### 接下来做什么？\n\nLinux 将长久存在，但内部内核接口一旦有人发现了更聪明的实现方法，往往就会固化。没有任何内核代码是刻在石碑上的。正如你所学到的，即使是被视为神圣的调度器，自\
  \ 2.4 时代以来也经历了两次重写。内核树中每年出现的新代码行数数百万。随着内核的演进，新功能和抽象\n\n\n\n\n不断被添加，编程接口被重新设计，子系统为了提取更好的性能而被重构，可重用区域被过滤到通用内核。\n\
  \n你现在有了一个坚实的基础，因此可以适应这些变化。为了保持前沿性，请定期刷新内核树，经常浏览内核邮件列表，并尽可能编写代码。Linux 是未来，成为内核大师是有回报的。留守前线吧！\n\
  \n*本页故意留白*\n\n![](img/index-684_1.jpg)\n\nA\n\n# Linux 汇编\n\n653\n\n设备 设备驱动程序有时需要用汇编实现一些代码段，因此让我们来看看\
  \ Linux 上汇编编程的不同方面。\n\n图 A.1 显示了 PC 兼容系统上的 Linux 启动序列，它是第 2 章“窥探内核”图 2.1 的简化版本。图中的固件组件使用不同的汇编语法实现：\n\
  \n* `BIOS` 通常完全用汇编编写。一些流行的 PC BIOS 使用如 `Microsoft Macro Assembler` (`MASM`) 等汇编器编码。\n\
  * Linux 启动器如 `LILO` 和 `GRUB` 使用 C 和汇编的混合实现。`SYSLINUX` 启动器使用 `Netwide Assembler`\
  \ (`NASM`) 完全用汇编编写。\n* 实模式下的 Linux 启动代码使用 `GNU Assembler` (`GAS`)。\n* 保护模式 BIOS\
  \ 调用是通过 `内联汇编` 完成的，这是 `GCC` 支持的在 C 语句之间插入汇编的结构。\n\n在图 A.1 中，前两个组件通常遵循基于 Intel 的汇编语法，而后两个使用\
  \ AT&T（或 `GAS`）语法编码。存在例外；`GRUB` 的汇编部分使用了 `GAS`。\n\n**开机**\n\nBIOS (MASM)\nSYSLINUX\
  \ 启动器 (NASM)\n实模式内核 (GAS)\n保护模式内核 (GCC 内联汇编)\n\n图 A.1 固件组件与汇编语法。\n\n654\n\nLinux\
  \ 汇编\n\n655\n\n为了说明这两种语法之间的区别，考虑一段向并行端口输出字节的代码。在 BIOS 或启动器使用的 Intel 格式中，你将写下以下代码：\n\
  \n```\nmov dx, 03BCh ;0x3BC 是并行端口的 I/O 地址\nmov al, 0ABh ;0xAB 是要输出的数据\nout dx, al\
  \ ;将数据发送到并行端口\n```\n\n然而，如果你想在 Linux 实模式启动代码中执行相同任务，你需要这样做：\n\n```\nmovw $0x3BC,\
  \ %dx\nmovb $0xAB, %al\noutb %al, %dx\n```\n\n你可以看到，与 Intel 格式不同，在 AT&T 语法中，源操作数在前，目标操作数在后。AT&T\
  \ 格式中的寄存器名称前有 `%`，立即数操作数前有 `$`。AT&T 操作码带有如 `b`（代表字节 byte）和 `w`（代表字 word）之类的后缀，用于指定内存操作数的大小，而\
  \ Intel 语法通过查看操作数而非操作码来实现此。在 Intel 语法中移动指针引用时，你必须指定操作数前缀，如 `byte ptr`。\n\n学习 AT&T\
  \ 语法的优势是它可以被 `GAS` 和内联 `GCC` 识别，它们不仅工作于基于 Intel 的系统，还适用于各种处理器架构。\n\n接下来，让我们使用 `GCC\
  \ 内联汇编` 重新编写前面的代码段，这是你在保护模式内核中使用的：\n\n```c\nunsigned short port = 0x3BC;\nunsigned\
  \ char data = 0xAB;\nasm(\"outb %%al, %%dx\\n\\t\"\n:\n: \"a\" (data), \"d\" (port)\n\
  );\n```\n\n656 附录 A Linux 汇编\n\n`GCC` 支持的 `asm` 结构的通用格式如下：\n\n```\nasm(assembly\n\
  : 输出操作数约束\n: 输入操作数约束\n: 破坏操作数指定符\n);\n```\n\n在操作数部分，`a`、`b`、`c`、`d`、`S` 和 `D` 分别代表\
  \ `EAX`、`EBX`、`ECX`、`EDX`、`ESI` 和 `EDI` 寄存器。输入操作数约束在执行汇编指令之前将数据从提供的变量复制到指定的寄存器，而输出操作数约束（写为\
  \ `=a`、`=b` 等）在执行汇编指令之后将数据从指定的寄存器复制到提供的变量。破坏操作数约束要求 `GCC` 假设列出的寄存器不可用。更多关于 `GCC\
  \ 内联汇编语法` 的细节请参阅 `GCC Inline Assembly HOWTO` (`www.ibiblio.org/gferg/ldp/GCC-Inline-Assembly-HOWTO.html`)。\n\
  \n我们示例使用的唯一约束是针对输入操作数的。这有效地将 `data` 的值复制到 `AL` 寄存器并将 `port` 的值复制到 `DX` 寄存器。在内联汇编中，寄存器名称前有\
  \ `%%`，因为 `%` 用于引用提供的操作数。`%i` 代表第 *i* 操作数；因此，如果你想在示例内联汇编段内部引用 `data` 和 `port`，你可以分别使用\
  \ `%0` 和 `%1`。\n\n为了更清晰地了解内联汇编转换，让我们通过向 `GCC` 提供 `-s` 命令行参数，查看对应的内联汇编段生成的汇编代码。查看生成的每行代码对应的注释说明：\n\
  \n```\nmovw $956, -2(%ebp) # data 的值被复制到 AL 寄存器\nmovb $171, -3(%ebp) # port 的值被复制到\
  \ DX 寄存器\nmovb -3(%ebp), %al # 0xAB\nmovw -2(%ebp), %dx # 0x3BC\n#APP # 标记内联汇编开始\n\
  outb %al, %dx       # 写入并行端口\n#NO_APP # 标记内联汇编结束\n```\n\n你也可以在用户模式程序中使用内联汇编。这里有一个使用内联汇编编写的调用\
  \ `syslog()` 系统调用的应用程序：\n\n657 附录 A Linux 汇编\n\n```c\n#define READ_COMMAND 103\n\
  #define MSG_LENGTH 128\n\nint main(int argc, char *argv[]) {\n    int syslog_command\
  \ = READ_COMMAND;\n    char buffer[MSG_LENGTH];\n    int retval;\n    asm volatile(\n\
  \    \"movl %1, %%ebx\\n\"\n    \"movl %2, %%ecx\\n\"\n    \"movl %3, %%edx\\n\"\
  \n    \"movl $128, %%eax\\n\"\n    \"movl %%eax, %0\"\n    =\":r\" (retval)\n  \
  \  :\"m\"(syslog_command),\"r\"(buffer),\"m\"(MSG_LENGTH)\n    :\"%eax\",\"%ebx\"\
  ,\"%ecx\",\"%edx\");\n    if (retval > 0) printf(\"%s\\n\", buffer);\n    return\
  \ 0;\n}\n```\n\n如果你编译并运行代码，你将看到从内核环缓冲区获取的输出：\n\n658 附录 A Linux 汇编\n\n```\n0:0:0:0:\
  \ Attached scsi removable disk sda\n<5>sd 0:0:0:0: Attached scsi generic sg0 type\
  \ 0\n<7>usb-storage: device scan complete\n```\n\n`arch/x86/kernel/entry_32.S` 中的内核系统调用异常会将所有寄存器内容保存到栈，因此真正的系统调用在栈上看到它们的参数，尽管用户空间代码是通过\
  \ CPU 寄存器传递它们的。为了确保系统调用例程在栈上期望参数，它们都标记了 GCC 属性 `asmlinkage`。注意\n\n\n\n\n\n`asmlinkage`\
  \ 与用于声明内联汇编的 `asm`（或 `__asm__`）没有任何关系。\n\n让我们通过说明一个针对基于 PowerPC 板板的 Linux 引导程序的内联汇编修改示例来结束本节。假设板板上的闪存不支持`后台操作`（`BackGround\
  \ Operation`，`BGO`）。这意味着引导程序代码在从闪存执行时无法写入闪存，例如，当引导程序需要更新存储在闪存其他部分的内核镜像时，就需要这样做。一种解决方案是修改引导程序，使得用于写入和擦除闪存的引导代码完全从`指令缓存`（`I-cache`）执行，而数据段驻留在`数据缓存`（`D-cache`）中。这里用\
  \ GCC 内联汇编编写的示例宏实现了将必要的引导程序指令预取到 I-cache 上的工作。你需要具备 PowerPC 汇编的实用知识才能理解这段代码段：\n\n\
  ```c\n/* instr_length 是要加载到 I-cache 的指令数\nload_i$_copy 和 _end_i$_copy 是\n程序标签 */\n\
  #define load_into_icache_copy(instr_length) \\\nasm volatile(\"lis %%r3, 0x1@h\\\
  n \\\nori %%r3, %%r3, 0x1@l\\n \\\nmticcr %%r3\\n \\\nisync\\n \\\nn \\\nlis %%r6,\
  \ _end_i$_copy@h\\n \\\nori %%r6, %%r6, _end_i$_copy@l\\n \\\nicbt %%r0, %%r6\\\
  n \\\nlis %%r4, %0@h\\n \\\nDebugging\n659\nori %%r4, %%r4, %0@l\\n \\\nmtctr %%r4\\\
  n \\\n_load_i$_copy: \\\naddis %%r6, %%r6, 32@ha\\n \\\naddi %%r6, %%r6, 32@l\\\
  n \\\nicbt %%r0, %%r6\\n \\\nbdnz _load_i$_copy\\n \\\n_end_i$_copy: \\\nnop\\n\"\
  \ \\\n: \\\n: \"i\"(instr_length) \\\n:\"%r6\",\"%r4\",\"%r0\",\"r8\",\"r9\");\n\
  ```\n\n## 调试\n\n要调试实模式内核，你不能使用我们在第 21 章“调试设备驱动程序”中讨论过的`内核调试`（`Kernel Debug`，`kdb`）或`内核\
  \ GNU 调试`（`kgdb`）。调试内核汇编代码段的一种快速方法是将代码转换为 Intel 风格的语法后，使用 DOS 的 `debug` 工具。但 `debug`\
  \ 是在 16 位时代创建的，因此你无法单步执行初始化 `EAX` 寄存器的代码。你可以在互联网上找到可下载的 32 位 `debug` 类免费软件工具。在第\
  \ 21 章中也讨论过的 JTAG 调试器是一种“万灵药”，因为可以使用同一个工具来调试 BIOS、引导程序、Linux 实模式代码以及内核与 BIOS 之间的交互。\n\
  \n*本页特意留白*\n\n![](img/index-692_1.jpg)\n\n### Linux 与 BIOS\n\nx86 内核的部分，例如视频帧缓冲区驱动程序（`vesafb`）和`高级电源管理`（`Advanced\
  \ Power Management`，`APM`），显式使用 BIOS 服务来完成某些功能。内核的其他部分（如串口驱动程序）隐式地依赖 BIOS 来初始化 I/O\
  \ 基地址和中断级别。实模式内核代码在启动期间大量使用 BIOS 调用来执行组装系统内存映射等任务。由于某些设备驱动程序直接或间接地依赖 BIOS，让我们学习如何与它交互。\n\
  \n### 实模式调用\n\n内核的许多部分在实模式下从 BIOS 获取信息，并在保护模式正常运行期间使用这些信息。完成此所需的步骤如下：\n\n1. 实模式内核代码调用\
  \ BIOS 服务并将返回的信息填充在第一个物理内存页中，称为`零页`（zero page）。这是通过 `arch/x86/boot/` 目录下的源文件完成的。零页的完整布局可以在\
  \ `Documentation/i386/zero-page.txt` 中找到。\n2. 在内核切换到保护模式之后但在清除零页之前，获取的数据被保存在内核数据结构中。这在\
  \ `arch/x86/kernel/setup_32.c` 中完成。\n3. 保护模式内核在正常运行期间充分利用已保存的信息。\n\n例如，让我们看看内核如何从\
  \ BIOS 组装系统内存映射。列表 B.1 是 2.6.23.1 源码树中 `arch/x86/boot/memory.c` 的片段，它调用了 BIOS `int\
  \ 0x15` 服务来获取系统内存映射。\n\n#### 列表 B.1 获取系统内存映射 (*arch/x86/boot/memory.c*)\n\n```c\n\
  static int detect_memory_e820(void)\n{\n    int count = 0;\n    u32 next = 0;\n\
  \    u32 size, id;\n    u8 err;\n    /* boot_params 结构包含了零页 */\n    struct e820entry\
  \ *desc = boot_params.e820_map;\n    do {\n        size = sizeof(struct e820entry);\n\
  \        asm(\"int $0x15; setc %0\"\n        : \"=d\" (err), \"+b\" (next), \"=a\"\
  \ (id), \"+c\" (size),\n        \"=m\" (*desc)\n        : \"D\" (desc), \"d\" (SMAP),\
  \ \"a\" (0xe820));\n        /* ... */\n        count++;\n        desc++;\n    }\
  \ while (next && count < E820MAX);\n    return boot_params.e820_entries = count;\n\
  }\n```\n\n在列表中，`0xe820` 是调用 `int 0x15` 获取内存映射后 `AX` 寄存器中的函数号。如果你查看 `int 0x15` 函数，你会发现\
  \ BIOS 将内存映射的当前元素写入 `DI` 指向的零页。在列表 B.1 中，`DI` 指向存储内存映射的零页。BIOS 循环直到内存映射中的所有元素都被收集。数量存储在\
  \ `boot_params.e820_entries` 中。\n\n```c\nstruct e820entry {\n    u64 addr; /* 内存段起始地址\
  \ */\n    u64 size; /* 内存段大小 */\n    u32 type; /* 内存段类型 */\n} __attribute__((packed));\n\
  \nstruct e820map {\n    u32 nr_map;\n    struct e820entry map[E820MAX];\n};\n```\n\
  \n内核稍后在 `arch/x86/boot/pm.c` 中切换到保护模式。在保护模式下，内核通过 `copy_e820()` 保存收集到的内存映射。这在列表\
  \ B.2 所示。\n\n#### 列表 B.2 拷贝内存映射 (*arch/x86/kernel/e820.c*)\n\n```c\nstruct e820map\
  \ e820;\n\nstatic __init copy_e820(struct e820entry *biosmap, int nr_map)\n{\n \
  \   int x;\n    /* ... */\n    do {\n        /* 将从 BIOS 的映射信息拷贝到局部变量 */\n      \
  \  unsigned long long start = biosmap->addr;\n        unsigned long long size =\
  \ biosmap->size;\n        unsigned long long end = start + size;\n        unsigned\
  \ long type = biosmap->type;\n        /* 检查起始地址和大小 */\n        /* ... */\n     \
  \   /* 填充内核数据结构 e820 */\n        x = e820.nr_map;\n        e820.map[x].addr = start;\n\
  \        e820.map[x].size = size;\n        e820.map[x].type = type;\n        e820.nr_map++;\n\
  \    } while (biosmap++,--nr_map); /* 对映射中的所有元素执行 */\n    /* ... */\n}\n```\n\n\
  查看 `arch/x86/mm/init_32.c` 以了解列表 B.2 中填充的 `e820` 结构在稍后的启动过程中是如何使用的。\n\n\n\n\n\n\
  从实模式内核（通过 `int 0x15`，函数 `0x2100`）获取错误代码，并在正常运行通过 `/proc` 文件系统显示它们。\n\n引导加载程序在实模式下也使用了\
  \ BIOS 服务。如果你浏览 `LILO`、`GRUB` 或 `SYSLINUX` 的源码，你会看到大量的 `int 0x13` 调用，用于从引导设备读取内核镜像。\n\
  \n## 保护模式调用\n\n为了查看内核如何进行保护模式下的 BIOS 调，让我们来看 APM 的实现。\n\nAPM 是一种 BIOS 接口规范，现在几乎已经过时了（参见第\
  \ 4 章“打基础”中的“电源管理”章节）。电源管理策略定义在 BIOS 中，一个名为 `kapmd` 的内核线程每秒轮询一次以确定操作方案。轮询是通过保护模式\
  \ BIOS 调用完成的。为了做到，`kapmd` 需要知道保护模式的入口段地址和偏移量。这些地址是在启动过程中使用 `int 0x15` 函数 `0x5303`\
  \ BIOS 服务从实模式内核获取的。实际的保护模式 BIOS 调用是使用 `apm_bios_call_simple_asm()` 中的内联汇编实现的，该函数定义在\
  \ `include/asm-x86/mach-default/apm.h` 中：\n\n```assembly\n__asm__ __volatile__(APM_DO_ZERO_SEGS\n\
  \"pushl %%edi\\n\\t\"\n\"pushl %%ebp\\n\\t\"\n\"lcall *%%cs:apm_bios_entry\\n\\\
  t\"\n\"setc %%bl\\n\\t\"\n\"popl %%ebp\\n\\t\"\n\"popl %%edi\\n\\t\"\nAPM_DO_POP_SEGS\n\
  : \"=a\" (*eax), \"=b\" (error), \"=c\" (cx), \"=d\" (dx),\n\"=S\" (si)\n: \"a\"\
  \ (func), \"b\" (ebx_in), \"c\" (ecx_in)\n: \"memory\", \"cc\");\n```\n\n`APM_DO_ZERO_SEGS`\
  \ 清零段寄存器。`apm_bios_entry` 包含保护模式的入口地址。输入约束 `\"a\"`(`func`) 在调用前将所需的 BIOS 函数号复制到\
  \ EAX 寄存器。例如，函数号 `APM_FUNC_GET_EVENT (0x530b)` 从 BIOS 触发 APM 事件，而函数号 `APM_FUNC_IDLE\
  \ (0x5305)` 通知 BIOS 处理器处于空闲状态。结果由 BIOS 通过寄存器 `EAX`、`EBX`、`ECX` 和 `EDX` 返回。根据之前的输出操作约束，这些分别传递给调用者的变量\
  \ `eax`、`error`、`cx` 和 `dx`。在汇编体内，寄存器在 BIOS 调用之前保存到内核栈中，并在之后恢复，以防止 BIOS 覆盖它们。\n\n\
  ## BIOS 与遗留驱动程序\n\nBIOS 为某些 Linux 驱动程序提供了某种硬件抽象。让我们以 PC 串口驱动程序（第 6 章“串口驱动”中讨论）为例。BIOS\
  \ 探测 Super I/O 芯片组，并为相应的串口（和红外）端口分配 I/O 基地址和 IRQ。串口驱动需要被告知 BIOS 分配的资源，可以通过头文件中的硬编码值（`include/asm-x86/serial.h`）或通过用户态命令来实现。作为一个练习，请研究你的\
  \ Super I/O 芯片组的数据手册，并在串口驱动中添加支持以探测 BIOS 设置的资源值。\n\n举另一个例子，即使你在内核中禁用了 USB 支持，也可以通过\
  \ BIOS 的帮助在 PC 系统上使用 USB 键盘和鼠标。BIOS 在南桥中开启仿真模式，将 USB 键盘和鼠标输入从 USB 控制器路由到键盘控制器。这欺骗操作系统认为正在使用遗留键盘或鼠标。\n\
  \n内核曾依赖 BIOS 遍历 PCI 总并配置检测到的设备。这现在已经过时了，但可以查看 `arch/x86/pci/pcbios.c` 来了解如何从内核访问\
  \ PCI BIOS。第 10 章“外围组件连接”讨论了 PCI 驱动。\n\n## C - Seq 文件\n\nprocfs 提供的监控和趋势数据点可能有助于在症状原因模糊时诊断设备驱动程序问题。但有时，特别是当数据量很大时，相应的\
  \ procfs `read()` 实现会变得复杂。seq file 接口是一种内核辅助机制，旨在简化此类实现。seq 文件使 procfs 操作变得清晰且易于维护。\n\
  \n让我们逐步为 procfs `read()` 例程引入复杂度，看看 seq file 接口如何将繁琐的例程转换为优雅的。我们还将更新少数几个尚未利用 seq\
  \ 文件的驱动之一。\n\n### Seq 文件的优势\n\n让我们通过示例来发现 seq 文件提供的优势。与许多设备驱动程序一样，假设你有一个数据结构链表，列表中的每个节点包含一个字符串字段（称为\
  \ `info`）。列表 C.1 中的示例代码使用一个名为 `/proc/readme` 的 procfs 文件将这些字符串导出到用户空间。当用户读取此文件时，会调用\
  \ procfs `read()` 方法 `readme_proc()`。该例程遍历链表，并将每个节点的 `info` 字段附加到传递给它的文件系统缓冲区。\n\
  \n#### 列表 C.1：通过 Procfs 读取\n\n```c\n/* 私有数据结构 */\nstruct _mydrv_struct {\n    /*\
  \ ... */\n    struct list_head list; /* 指向下一个节点的链 */\n    char info[10]; /* 通过 procfs\
  \ 文件传递的信息 */\n    /* ... */\n};\n\nstatic LIST_HEAD(mydrv_list); /* 链表头 */\n\n/*\
  \ 初始化 */\nstatic int __init\nmydrv_init(void)\n{\n    int i;\n    static struct\
  \ proc_dir_entry *entry = NULL ;\n    struct _mydrv_struct *mydrv_new;\n    /* ...\
  \ */\n    /* 创建 /proc/readme */\n    entry = create_proc_entry(\"readme\", S_IWUSR,\
  \ NULL);\n    /* 将其附加到 readme_proc() */\n    if (entry) {\n        entry->read_proc\
  \ = readme_proc;\n    }\n    /* 为了测试手动构建 mydrv_list。\n       在现实世界中，设备驱动逻辑\n   \
  \    会维护链表并填充 'info' 字段 */\n    for (i=0;i<100;i++) {\n        mydrv_new = kmalloc(sizeof(mydrv_struct),\
  \ GFP_ATOMIC);\n        sprintf(mydrv_new->info, \"Node No: %d\\n\", i);\n     \
  \   list_add_tail(&mydrv_new->list, &mydrv_list);\n    }\n    return 0;\n}\n\n/*\
  \ procfs read 入口 */\nstatic int\nreadme_proc(char *page, char **start, off_t offset,\n\
  int count, int *eof, void *data)\n{\n    int i = 0;\n    off_t thischunk_len = 0;\n\
  \    struct _mydrv_struct *p;\n    /* 遍历链表并将 info 拷贝到提供的缓冲区 */\n    list_for_each_entry(p,\
  \ &mydrv_list, list) {\n        thischunk_len += sprintf(page+thischunk_len, p->info);\n\
  \    }\n    *eof = 1; /* 表示完成 */\n    return thischunk_len;\n}\n```\n\n带有这些更改启动内核并查看\
  \ `/proc/readme` 内容：\n\n```bash\ncat /proc/readme\nNode No: 0\nNode No: 1\n...\n\
  Node No: 99\n```\n\n当 procfs `read()` 方法被调用时，它们会获得一页内存，用于将信息传递到用户空间。如列表 C.1 所示，传递给\
  \ `readme_proc()` 的第一个参数是指向该页大小缓冲区的指针。第二个参数 `start` 用于辅助实现大于一页的 procfs 文件。当我们查看列表\
  \ C.2 中的示例时，该参数的作用将清晰。接两个参数分别指定请求读取操作的偏移量要读取的字节数。`eof` 参数用于告诉调用者是否有更多数据待读。如果在返回之前未设置\
  \ `eof`，则再次调用 procfs read 入口获取更多数据。在列表 C.1 中，如果注释掉设置 `eof` 的行，`readme_proc()` 将再次被调用，此时\
  \ `offset` 参数设置为 1190（字符串中包含的 ASCII 字节数，从 Node No: 0 到 Node No: 99）。`readme_proc()`\
  \ 返回拷贝到提供的缓冲区字节数。\n\n列表 C.1 中 procfs read 例程生成的数据量在一个页的限制之内。然而，如果你增加链表中的节点数量\n\n\
  \n\n\n在 `myddrv_init()` 中，从 `100` 到 `500`，读取 `*/proc/*` 时产生的数据量\n\n`readme` 跨越了一个页面并触发了以下输出：\n\
  \n```bash\ncat /proc/readme\n```\n\nNode No: 0\n\nNode No: 1\n\n...\n\nNode No:\
  \ 322\n\nproc_file_read: Apparent buffer overflow!\n\n如你所见，在产生了一页（在本情况下为 `4,096`）的\
  \ ASCII 字符后，就发生了溢出。\n\n为了处理此类大型 procfs 文件，你需要使用前文提到的 `start` 参数来重构列表 C.1 中的代码。这使得函数变得有些复杂，如列表\
  \ C.2 所示。该修改后的实现语义如下：\n\n- `readme_proc()` 被多次调用，每次调用产生从 `offset` 开始的最多 `count`\
  \ 字节。每次调用时请求的 `count` 小于一页的大小。\n- 在每次调用期间，内核根据上一次调用返回的字节数增加 `offset`。\n- 只有当产生的数据量小于或等于请求的\
  \ `count` 加上当前 `offset` 时，`readme_proc()` 信号 `eof`。如果没有设置 `eof`，则根据之前返回的字节数增加偏移后再次调用函数。\n\
  - 每次调用后，仅收集从 `start` 开始的字节并返回给调用者。\n\n打印 `start`、`offset`、`count` 和 `page` 的值，并查看每次调用生成的输出，以更好地理解操作序列。\n\
  \n通过这种技巧（hack），你的 procfs 文件可以向用户空间提供大量数据，而没有大小限制：\n\n```bash\ncat /proc/readme\n\
  ```\n\nNode No: 0\n\nNode No: 1\n\n...\n\nNode No: 499\n\n### 列表 C.2: 大型 Procfs\
  \ 读取\n\n```c\nstatic int\nreadme_proc(char *page, char **start, off_t offset,\n\
  int count, int *eof, void *data)\n{\n    int i = 0;\n    off_t thischunk_start =\
  \ 0;\n    off_t thischunk_len = 0;\n    struct _mydrv_struct *p;\n    /* 遍历列表收集设备信息\
  \ */\n    list_for_each_entry(p, &mydrv_list, list) {\n        thischunk_len +=\
  \ sprintf(page+thischunk_len, p->info);\n        /* 仅当增加 thischunk_start 使得下次读取\n\
  \         * 不会导致总字节数超过 (offset+count) 时\n         */\n        if (thischunk_start\
  \ + thischunk_len < offset) {\n            thischunk_start += thischunk_len;\n \
  \           thischunk_len = 0;\n        } else if (thischunk_start + thischunk_len\
  \ > offset+count) {\n            break;\n        } else {\n            continue;\n\
  \        }\n    }\n    /* 实际起始位置 */\n    *start = page + (offset - thischunk_start);\n\
  \    /* 计算写入的字节数 */\n    thischunk_len -= (offset - thischunk_start);\n    if (thischunk_len\
  \ > count) {\n        thischunk_len = count;\n    } else {\n        *eof = 1;\n\
  \    }\n    return thischunk_len;\n}\n```\n\n当你面临像列表 C.2 那样尴尬地实现大型 procfs 文件的前景时，seq\
  \ 文件接口就派上用场了。顾其名，seq 文件接口将 procfs 文件的内容视为对象序列。它提供了编程接口来遍历此对象序列。你的代码必须提供 seq 接口期望的以下迭代器（iterator）方法：\n\
  \n1. `start()`，由 seq 接口首次调用。它初始化迭代器序列中的位置，并返回第一个感兴趣的迭代器对象。\n2. `next()`，增加迭代器位置并返回指向下一个迭代器的指针。此函数不依赖于迭代器的内部结构，并将其视为一个不透明对象。\n\
  3. `show()`，解释传递给它的迭代器，并生成在用户读取相应的 procfs 文件时要的输出字符串。该方法利用了 `seq_printf()`、`seq_putc()`\
  \ 和 `seq_puts()` 等辅助函数来格式化输出。\n4. `stop()`，在结束时调用用于清理。\n\nseq 文件接口会自动调用这些迭代器方法，以响应用户对相关\
  \ procfs 文件的操作产生输出。你不再需要担心页面大小的缓冲区和数据结束的信号。\n\n让我们利用 seq 文件重写列表 C.2。这在列表 C.3 中通过将链表视为节点序列来完成。基本的迭代器对象是节点，每次调用\
  \ `next()` 方法都会返回列表中的下一个节点。\n\n### 列表 C.3: 使用 Seq 文件简化列表 C.2\n\n```c\n#include <linux/seq_file.h>\n\
  /* start() 方法 */\nstatic void *\nmydrv_seq_start(struct seq_file *seq, loff_t *pos)\n\
  {\n    struct _mydrv_struct *p;\n    loff_t off = 0;\n    /* 在请求的偏移处的迭代器 */\n  \
  \  list_for_each_entry(p, &mydrv_list, list) {\n        if (*pos == off++) return\
  \ p;\n    }\n    return NULL;\n}\n/* next() 方法 */\nstatic void *\nmydrv_seq_next(struct\
  \ seq_file *seq, void *v, loff_t *pos)\n{\n    /* 'v' 是指向由 start() 或\n     上一次调用\
  \ next() 返回的迭代器的指针 */\n    struct list_head *n = ((struct _mydrv_struct *)v)->list.next;\n\
  \    ++*pos; /* 推进位置 */\n    /* 返回下一个迭代器，即列表中的下一个节点 */\n    return(n != &mydrv_list)\
  \ ?\n    list_entry(n, struct _mydrv_struct, list) : NULL;\n}\n/* show() 方法 */\n\
  static int\nmydrv_seq_show(struct seq_file *seq, void *v)\n{\n    const struct _mydrv_struct\
  \ *p = v;\n    /* 解释迭代器 'v' */\n    seq_printf(seq, p->info);\n    return 0;\n}\n\
  /* stop() 方法 */\nstatic void\nmydrv_seq_stop(struct seq_file *seq, void *v)\n{\n\
  \    /* 此示例中不需要清理 */\n}\n/* 定义迭代器操作 */\nstatic struct seq_operations mydrv_seq_ops\
  \ = {\n    .start = mydrv_seq_start,\n    .next = mydrv_seq_next,\n    .stop = mydrv_seq_stop,\n\
  \    .show = mydrv_seq_show,\n};\nstatic int\nmydrv_seq_open(struct inode *inode,\
  \ struct file *file)\n{\n    /* 注册操作符 */\n    return seq_open(file, &mydrv_seq_ops);\n\
  }\nstatic struct file_operations mydrv_proc_fops = {\n    .owner = THIS_MODULE,\n\
  \    .open = mydrv_seq_open, /* 用户提供 */\n    .read = seq_read, /* 内置辅助函数 */\n  \
  \  .llseek = seq_lseek, /* 内置辅助函数 */\n    .release = seq_release, /* 内置辅助函数\n};\n\
  static int __init\nmydrv_init(void)\n{\n    /* ... */\n    /* 替换列表 C.1 中对 entry->read_proc\
  \ 的赋值，\n       改为对 entry->proc_fops 的更基础的赋值。因此\n       不要执行 \"entry->read_proc;\"\
  ，而是执行以下操作： */\n    entry->proc_fops = &mydrv_proc_fops;\n    /* ... */\n}\n```\n\
  \n### 更新 NVRAM 驱动程序\n\nseq 文件接口自 2.4 内核后期版本以来一直存在，但在 2.6 中变得广泛使用。让我们更新 NVRAM 驱动（`drivers/char/nvram.c`），它是少数尚未切换到使用\
  \ seq 文件的驱动之一。（像往常，+ 显示与原始文件的差异。）要做到这一点，你可以使用 seq 文件的极简版本，仅使用 `show()` 方法。使用 `single_open()`\
  \ 来注册此方法。\n\n列表 C.4 包含了更新后的 NVRAM 驱动。由于 seq 接口在调用迭代器方法之间不会睡眠，因此你可以在方法内部持有锁。\n\n\
  ### 列表 C.4: 使用 Seq 文件更新 NVRAM 驱动\n\n```c\nstatic struct file_operations nvram_proc_fops\
  \ = {\n    .owner = THIS_MODULE,\n    .open = nvram_seq_open,\n    .read = seq_read,\n\
  \    .llseek = seq_lseek,\n    .release = single_release,\n};\n\nstatic int nvram_seq_open(struct\
  \ inode *inode, struct file *file)\n{\n    return single_open(file, nvram_show,\
  \ NULL);\n}\n\nstatic int nvram_show(struct seq_file *seq, void *v)\n{\n    unsigned\
  \ char contents[NVRAM_BYTES];\n    int i;\n    spin_lock_irq(&rtc_lock);\n    for\
