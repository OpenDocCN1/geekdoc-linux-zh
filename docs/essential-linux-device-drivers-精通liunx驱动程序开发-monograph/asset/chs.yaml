  \n## 第 9 章 PCMCIA 和紧凑型\n\n`Linux-PCMCIA` 支持适用于 Intel 基的笔记本电脑，也适用于基于架构-\n\n\n\n\n\
  架构如 ARM、MIPS 和 PowerPC。PCMCIA 子系统由 PCMCIA 主控制器的设备驱动程序、不同卡的客户端驱动程序、辅助热插拔的守护进程、用户态实用程序以及一个与所有这些交互的\
  \ `Card Services` 模块组成。\n\n图 9.3 展示了构成 Linux-PCMCIA 子系统的模块之间的交互关系。\n\n## 旧的 Linux-PCMCIA\
  \ 子系统\n\nLinux-PCMCIA 子系统最近经历了重构。要在 2.6.13 及更高版本的内核上运行 PCMCIA，你需要 `pcmciautils`\
  \ 包（http://kernel.org/pub/linux/utils/kernel/pcmcia/howto.html），它取代了用于早期内核的 `pcmcia-cs`\
  \ 包（http://pcmcia-cs.sourceforge.net）。内核内部编程接口和数据结构也发生了变化。早期的内核依赖名为 `cardmgr` 的用户空间守护进程来支持热插拔，但新的\
  \ PCMCIA 实现使用 `udev` 处理热插拔，就像其他总线子系统一样。因此，在新的环境中，你不需要 `cardmgr` 并应该确保它没有启动。在 http://kernel.org/pub/linux/utils/kernel/pcmcia/cardmgr-to-pcmciautils.html\
  \ 处有一份迁移指南。\n\n图 9.3 包含以下组件：\n\n*   主控制器设备驱动程序，实现与 PCMCIA 主控制器通信的低级例程。你的手持设备和笔记本电脑具有不同的主控制器，因此使用不同的主控制器驱动程序。主控制器支持的每个\
  \ PCMCIA 插槽被称为一个 `socket`。\n*   PCMCIA 客户端驱动程序（图 9.3 中的 `XX_cs`），响应卡片插入和拔出等 socket\
  \ 事件。当你尝试为 PCMCIA 卡添加 Linux 支持时，你最可能实现的此类驱动程序。`XX_cs` 驱动程序通常与通用驱动程序（图 9.3 中的 `XX`）协同工作，该驱动程序并非\
  \ PCMCIA 特有的。结合图 9.3 ，如果你的设备是 PCMCIA IDE 磁盘，`XX` 是 IDE 磁盘驱动程序，`XX_cs` 是 `ide_cs`\
  \ 驱动程序，`XX`-依赖层是文件系统层，而 `XX`-应用程序是访问数据文件的程序。`XX_cs` 使用 IRQ、I/O 基地址和内存窗口等资源配置通用驱动程序（`XX`）。\n\
  *   PCMCIA 核心，为主控制器驱动程序和客户端驱动程序提供服务。核心提供了一个使驱动实现变得简单的基础设施，并增加了一层间接性，使得客户端驱动程序独立于主控制器。无论你是在基于\
  \ XScale 的手持设备还是基于 x86 的笔记本电脑上蓝牙 CF 卡，都可以相同的客户端驱动程序。\n*   `driver services` 模块 (`ds`），为客户端驱动程序提供注册接口和总线服务。\n\
  *   `pcmciautils` 包，包含如 `pccardctl` 等工具，用于控制 PCMCIA socket 的状态并在不同的配置方案之间选择。\n\n\
  ```\npcmciautils\nXX-Applications\nUser Space\nKernel Space\nPCMCIA Core\nsysfs/udev\n\
  CIS Routines\nInterface\nDriver Services\n(ds)\nCard Services\npccardd\nXX-Dependent\
  \ Layers\nIRQ, I/O Mem\nHost Controller\nXX *_cs\nXX\nDriver\nKernel Space\nCIS\
  \ Space\nHardware\nData\nPCMCIA/CardBus\nHost Controller Bridge\nPCMCIA PCMCIA\n\
  Socket Card XX\n```\n图 9.3 Linux-PCMCIA 子系统。\n\n图 9.4 在图 9.1 之上胶合了内核模块，以说明 Linux-PCMCIA\
  \ 子系统如何与 PC 兼容系统上的硬件交互。\n\n```\nHigher Layers/Applications\nPCMCIA Core\nHost Controller\n\
  XX *.ko\nDriver\nProcessor\nInterrupts that\nDevice Resources\nmonitor card status\n\
  Interrupts\nNorth Bridge\nPCMCIA/\nCardBus\nXX *_cs.ko\nController\nSocket PCMCIA\n\
  Card XX\nPCI Bus\nSouth Bridge\nPCI Slot\nPCI Slot\n```\n图 9.4 PCMCIA 驱动组件与 PC 硬件的关系。\n\
  \n在接下来的章节中，让我们更仔细地观察构成 Linux-PCMCIA 子系统的组件。为了更好地理解这些组件的作用及其交互，我们将在笔记本电脑中插入一张 PCMCIA\
  \ WiFi 卡，并在“整合各个部分”章节中跟踪代码流。\n\n## 主控制器驱动程序\n\n通用卡驱动程序（`XX`）负责处理由卡功能产生中断（例如，当 PCMCIA\
  \ 网卡接收数据包时接收中断），而主控制器驱动程序负责处理由卡片插入和拔出等事件触发的特定总线中断。\n\n图 9.2 显示了围绕内置 PCMCIA 支持的嵌入式设计的嵌入式设备框图。即使你使用的是内核\
  \ PCMCIA 层支持的控制器，你可能需要根据主板的设计微调主控制器驱动程序（例如，配置用于检测卡片插入事件或切换插槽电源的 GPIO 线）。例如，如果你正在将内核移植到基于\
  \ StrongARM 的手持设备上，请调整 `drivers/pcmcia/sa1100_assabet.c` 以适应你的硬件。\n\n本章不涵盖主控制器设备驱动程序的实现。\n\
  \n## PCMCIA 核心\n\nCard Services 是 PCMCIA 核心的主要组成部分。它为客户端驱动程序和主控制器驱动程序提供一系列服务。它包含一个名为\
  \ `pccardd` 的内核线程，用于轮询与 socket 相关的事件。当主控制器报告卡插入和移除等事件时，`pccardd` 通知 Driver Services\
  \ 事件处理程序（下节讨论）。\n\nPCMCIA 核心的另一个组件是一个库，用于操作 PCMCIA 卡的一部分——卡信息结构（CIS）。PCMCIA/CF 卡有两个内存空间：属性内存和通用内存。属性内存包含\
  \ CIS 和配置寄存器。例如，PCMCIA IDE 磁盘的属性内存包含其 CIS 以及指定扇区和柱数的寄存器。在这种情况下，通用内存包含磁盘数据的数组。PCMCIA\
  \ 核心为客户端驱动程序提供 CIS 操作例程，如 `get_first_tuple()`、`get_next_tuple()` 和 `parse_tuple()`。代码例程\
  \ 9.2 使用了其中一些函数的辅助。\n\nPCMCIA 核心通过 `sysfs` 和 `udev` 将 CIS 信息传递到用户态。如 `pcmciautils`\
  \ 包中的 `pccardctl` 等工具的操作依赖 `sysfs` 和 `udev`。这简化了早期在内核缺少这些功能时依赖自定义基础设施的设计方法。\n\n\
  ## Driver Services\n\nDriver Services 提供了一个提供以下功能的基础设施：\n\n*   处理由 `pccardd` 内核线程发送的事件警报的处理程序扫描并验证卡的\
  \ CIS 空间，并触发加载相应的客户端驱动程序。\n*   负责与内核总线核心通信的层。为此，Driver Services 实现了 `pcmcia_bus_type`\
  \ 和相关的总线操作。\n*   客户端驱动程序用于向 PCMCIA 核心注册自身的的服务例程，如 `pcmcia_register_driver()`。例程\
  \ 9.1 中的示例驱动程序使用了其中一些例程。\n\n## 客户端驱动程序\n\n客户端设备驱动程序（图 9.3 中的 `XX_cs`）查看卡的 CIS 空间，并根据收集的信息配置卡片。\n\
  \n## 数据结构\n\n\n\n\n\n在开始开发示例 PCMCIA 客户端驱动之前，让我们先认识一些相关的数据结构：\n\n1. PCMCIA 设备通过在\
  \ `include/linux/mod_devicetable.h` 中定义的 `pcmcia_device_id` 结构来标识：\n\n```c\nstruct\
  \ pcmcia_device_id {\n    /* ... */\n    __u16 manf_id; /* 厂商 ID */\n    __u16 card_id;\
  \ /* 卡片 ID */\n    __u8 func_id; /* 功能 ID */\n    /* ... */\n};\n```\n\n`manf_id`、`card_id`\
  \ 和 `func_id` 分别持有卡片的厂商 ID、卡片 ID 和功能 ID。PCMCIA 核心层提供了一个名为 `PCMCIA_DEVICE_MANF_CARD()`\
  \ 的宏，它可以根据提供的厂商 ID 和卡片 ID 创建一个 `pcmcia_device_id` 结构。另一个名为 `MODULE_DEVICE_TABLE()`\
  \ 的内核宏标记了模块镜像中支持的 `pcmcia_device_ids`，这样当卡片插入时，模块可以按需加载，PCMCIA 子系统会从卡片的 CIS 空间中获取匹配的厂商/卡片/功能\
  \ ID。我们在第 4 章“准备工作”的“模块自动加载”部分中探讨过这种机制。该过程与另外两种支持热插拔的流行 I/O 总线的驱动程序使用的过程（PCI 和 USB）类似。表\
  \ 9.1 概述了这三种总线技术驱动之间的相似之处。如果难以理解请不要担心；我们将在接下来的章节中详细讨论 PCI 和 USB。\n\n### 客户端驱动\n\n\
  表 9.1 PCMCIA、PCI 和 USB 的设备 ID 和热插拔方法\n\n| | PCMCIA | PCI | USB |\n| :--- | :---\
  \ | :--- | :--- |\n| 设备 ID 表 | `pcmcia_device_id` 结构 | `pci_device_id` | `usb_device_id`\
  \ |\n| 创建设备 ID 的宏 | `PCMCIA_DEVICE_MANF_CARD()` | `PCI_DEVICE()` | `USB_DEVICE()`\
  \ |\n| 设备 ID 表示 | `struct pcmcia_device` | `struct pci_dev` | `struct usb_device`\
  \ |\n| 驱动表示 | `struct pcmcia_driver` | `struct pci_driver` | `struct usb_driver`\
  \ |\n| 热插拔方法 | `probe()` 和 `remove()` | `probe()` 和 `remove()` | `probe()` 和 `disconnect()`\
  \ |\n| 热插拔事件检测 | `pccardd` 内线程 | 取决于 PCI 族的 `khubd` 内线程 |\n\n2. PCMCIA 客户端驱动需要将其\
  \ `pcmcia_device_id` 表与其 `probe()` 和 `remove()` 方法关联。这种绑定通过 `pcmcia_driver` 结构实现：\n\
  \n```c\nstruct pcmcia_driver {\n    int (*probe)(struct pcmcia_device *dev); /*\
  \ 探测方法 */\n    void (*remove)(struct pcmcia_device *dev); /* 移除方法 */\n    /* ...\
  \ */\n    struct pcmcia_device_id *id_table; /* 设备 ID 表 */\n    /* ... */\n};\n\
  ```\n\n3. `struct pcmcia_device` 在内部表示一个 PCMCIA 设备，并在 `drivers/pcmcia/ds.h` 中定义如下：\n\
  \n```c\nstruct pcmcia_device {\n    /* ... */\n    io_req_t io; /* I/O 属性 */\n \
  \   irq_req_t irq; /* IRQ 设置 */\n    config_req_t conf; /* 配置 */\n    /* ... */\n\
  \    struct device dev; /* 连接到设备模型 */\n    /* ... */\n};\n```\n\n4. CIS 操作例程使用在\
  \ `include/pcmcia/cistpl.h` 中定义的 `tuple_t` 结构来持有 CIS 信息单元。例如，`CISTPL_LONGLINK_MFC`\
  \ 元组类型包含与多功能卡片相关的信息。有关元组的完整列表及其描述，请参阅 `include/pcmcia/cistpl.h` [以及 http://pcmcia-cs.sourceforge.net/ftp/doc/PCMCIA-PROG.html]。\n\
  \n```c\ntypedef struct tuple_t {\n    /* ... */\n    cisdata_t TupleCode; /* 见 include/pcmcia/cistpl.h\
  \ */\n    /* ... */\n    cisdata_t DesiredTuple; /* 所需元组的标识 */\n    /* ... */\n\
  \    cisdata_t *TupleData; /* 缓冲区空间 */\n};\n```\n\n5. CIS 包含了卡片支持的每个配置的配置表项。定义在\
  \ `include/pcmcia/cistpl.h` 中的 `cistpl_cftable_entry_t` 持有此类条目：\n\n```c\ntypedef\
  \ struct cistpl_cftable_entry_t {\n    /* ... */\n    cistpl_power_t vcc, vpp; /*\
  \ 电压 */\n    cistpl_io_t io; /* I/O 属性 */\n    cistpl_irq_t irq; /* IRQ 设置 */\n\
  \    cistpl_mem_t mem; /* 内存 */\n    /* ... */\n};\n```\n\n6. `cisparse_t` 定义在 `include/pcmcia/cistpl.h`\
  \ 中，持有由 PCMCIA 解析的数据：\n\n```c\ntypedef union cisparse_t {\n    /* ... */\n    cistpl_manfid_t\
  \ manfid; /* 厂商 ID */\n    /* ... */\n    cistpl_cftable_entry_t cftable; /* 配置表项\
  \ */\n    /* ... */\n} cisparse_t;\n\n### 设备示例：PCMCIA\n\n让我们开发一个骨架客户端驱动来学习 PCMCIA\
  \ 的工作原理（该实现是通用的，无论你的卡片实现网络、存储还是其他技术都可以可以使用它）。PCMCIA 子系统注册驱动程序的 `probe()` 方法、`remove()`\
  \ 方法和设备 ID 表。当卡片插入时调用 `probe()`，当卡片取出时调用 `remove()`。\n\n9.1 注册客户端驱动\n\n```c\n#include\
  \ <pcmcia/ds.h>\n\nstatic struct pcmcia_driver XX_cs = {\n    .owner = THIS_MODULE,\n\
  \    .name = \"XX_cs\", /* 名称 */\n    .probe = XX_probe, /* 探测 */\n    .remove =\
  \ XX_remove, /* 移除 */\n    .id_table = XX_ids, /* ID 表 */\n    .suspend = XX_suspend,\
  \ /* 电源管理 */\n    .resume = XX_resume, /* 电源管理 */\n};\n\n#define XX_MANUFACTURER_ID\
  \ 0xABCD /* 厂商 ID */\n#define XX_CARD_ID 0xCDEF /* 卡片 ID */\n\nstatic struct pcmcia_device_id\
  \ XX_ids[] = {\n    PCMCIA_DEVICE_MANF_CARD(XX_MANUFACTURER_ID, XX_CARD_ID),\n \
  \   NULL,\n};\n\nMODULE_DEVICE_TABLE(pcmcia, XX_ids); /* 用于模块自动加载 */\n\n/* 初始化 */\n\
  static int __init init_XX_cs(void) {\n    return pcmcia_register_driver(&XX_cs);\n\
  }\n\n/* 探测方法 */\nstatic int XX_probe(struct pcmcia_device *link) {\n    /* 核心为此卡片分配\
  \ pcmcia_device 结构。首先填充通用信息 */\n    XX_config(link); /* 见 9.2 */\n}\n```\n\n9.2\
  \ 显示了配置通用驱动程序的程序。在此步骤之后，PCMCIA 卡片的数据流通过 XX，对其他层是透明的。PCMCIA 卡片产生的任何中断（例如网络卡的数据接收或传输完成完成）都由\
  \ XX 中的中断处理程序处理。列表 9.2 宽松基于 `drivers/net/wireless/airo_cs.c`，这是 Cisco Aironet 4500\
  \ 和 4800 系列 PCMCIA 卡片的客户端驱动。列表使用 PCMCIA 核心的服务来执行以下操作：\n- 从卡片 CIS 获取适当的配置表项元组\n-\
  \ 解析元组\n- 从解析的元组中提取如 I/O 基地址和电源设置之类的配置信息\n- 请求分配中断行\n\n然后使用获取的信息配置特定芯片的驱动程序（XX）。\n\
  \n列表 9.2 配置通用驱动\n\n```c\n#include <pcmcia/cistpl.h>\n#include <pcmcia/ds.h>\n#include\
  \ <pcmcia/cs.h>\n#include <pcmcia/cisreg.h>\n\n/* 使 XX 设备可用。XX_config() 基于 airo_config()，定义在\
  \ drivers/net/wireless/airo_cs.c 中 */\nstatic int XX_config(struct pcmcia_device\
  \ *link) {\n    tuple_t tuple;\n    cisparse_t parse;\n    u_char buf[64];\n\n \
  \   /* 用所需元组的标识填充 tuple_t 结构。在这种情况下，我们正在寻找一个配置表项元组 */\n    tuple.DesiredTuple =\
  \ CISTPL_CFTABLE_ENTRY;\n    tuple.Attributes = 0;\n    tuple.TupleData = buf;\n\
  \    tuple.TupleDataMax = sizeof(buf);\n}\n```\n\n\n\n```c\n/* 遍历 CIS 以匹配元组并获取卡配置信息，例如\
  \ I/O 窗口基地址 */\n\n/* 获取第一个元组 */\n\nCS_CHECK(GetFirstTuple, pcmcia_get_first_tuple(link,\
  \ &tuple));\n\nwhile (1){\n  cistpl_cftable_entry_t dflt = {0};\n  cistpl_cftable_entry_t\
  \ *cfg = &(parse.cftable_entry);\n  /* 从卡的 CIS 空间读取配置元组 */\n  if (pcmcia_get_tuple_data(link,\
  \ &tuple) != 0 ||\n      pcmcia_parse_tuple(link, &tuple, &parse) != 0) {\n    goto\
  \ next_entry;\n  }\n\n  /* 我们找到了匹配的元组！ */\n  /* 根据解析的元组条目中发现的内容为 pcmcia_device 配置电源设置\
  \ */\n  if (cfg->vpp1.present & (1<<CISTPL_POWER_VNOM))\n    link->conf.Vpp = cfg->vpp1.param[CISTPL_POWER_VNOM]/10000;\n\
  \n  /* ... */\n  /* 根据解析的元组条目中发现的内容为 pcmcia_device 配置 I/O 窗口设置 */\n  if ((cfg->io.nwin\
  \ > 0) || (dflt.io.nwin > 0)) {\n    cistpl_io_t *io = (cfg->io.nwin) ? &cfg->io\
  \ : &dflt.io;\n    /* ... */\n    if (!(io->flags & CISTPL_IO_8BIT)) {\n      link->io.Attributes1\
  \ = IO_DATA_PATH_WIDTH_16;\n    }\n    link->io.BasePort1 = io->win[0].base;\n \
  \   /* ... */\n  }\n  /* ... */\n  break;\n\nnext_entry:\n  CS_CHECK(GetNextTuple,\
  \ pcmcia_get_next_tuple(link, &tuple));\n}\n\n/* 分配 IRQ */\nif (link->conf.Attributes\
  \ & CONF_ENABLE_IRQ) {\n  CS_CHECK(RequestIRQ, pcmcia_request_irq(link, &link->irq));\n\
  }\n\n/* ... */\n/* 调用 init_XX_card()，它是通用 XX 驱动程序的一部分（因此在此列表中未显示），\n并传递上述获得的 I/O\
  \ 基地址和 IRQ 信息 */\ninit_XX_card(link->irq.AssignedIRQ, link->io.BasePort1,\n  1,\
  \ &handle_to_dev(link));\n\n/* 特定芯片（与外形无关）的驱动程序现在已准备好接管这张卡了！ */\n}\n```\n\n# 衔接各个部分\n\
  \n如你在图 9.3 所示，PCMCIA 层由各种组件组成。组件之间的数据流路径有时会变得复杂。让我们追踪从插入 PCMCIA 卡到应用程序开始向卡传输数据的代码路径。假设在一台具有兼容\
  \ 82365 PCMCIA 主机控制器的笔记本电脑上插入了一张 Cisco Aironet PCMCIA 卡：\n\n1. PCMCIA 主机控制器驱动程序（`drivers/pcmcia/yenta_socket.c`）通过其中断服务程序检测到插入事件，并使用适当的数据结构对其记录。\n\
  2. 作为 Card Services（`drivers/pcmcia/cs.c`）的 `pccardd` 内核线程在等待队列上睡眠，直到主机控制器驱动程序在检测到第\
  \ 1 步中的插入时唤醒它。\n3. Card Services 将插入事件分发给 Driver Services（`drivers/pcmcia/ds.c`）。这触发了由\
  \ Driver Services 在初始化期间注册的事件处理程序的执行。\n4. Driver Services 验证卡的 CIS 空间，确定所插设备的信息（如制造商\
  \ ID 和卡 ID），并在内核中注册该设备。然后加载相应的客户端设备驱动程序（`drivers/net/wireless/airo_cs.c`）。重新回顾我们之前关于\
  \ `MODULE_DEVICE_TABLE()` 的讨论，查看它是如何实现的。\n5. 第 4 步加载的客户端驱动程序（`airo_cs.c`）使用 `pcmcia_register_driver()`\
  \ 初始化并注册自身，如列表 9.1 所示。该注册接口内部将设备的线类型设置为 `pmcia_bus_type`。由 Driver Services（`ds.c`）定义的\
  \ `probe()` 和 `remove()` 等 PCMCIA 总线操作也在内部进行了注册。\n6. 内核调用由 Driver Services 注册的总线\
  \ `probe()` 操作，该操作反过来调用第 5 步注册的匹配客户端驱动程序拥有的 `probe()` 方法（`airo_probe()`）。客户端 `probe()`\
  \ 例程填充 I/O 窗口和中断线等设置，并配置通用的芯片组特定驱动程序（`drivers/net/wireless/airo.c`），如列表 9.2 所示。\n\
  7. 芯片组驱动程序（`airo.c`）创建一个网络接口（`ethX`），并从现在起负责正常运行。正是此驱动程序处理卡响应数据包接收和传输完成产生的中断。设备的外形（例如，它是\
  \ PCMCIA 卡还是 PCI 卡）也是如此。\n\n# PCMCIA 存储\n\n许多网络技术如 GPRS、GSM、GPS 和蓝牙使用串行传输机制与主机系统进行通信。在本节中，让我们看看\
  \ PCMCIA 层如何处理具有此类技术的卡。这些技术本身将在第 16 章“无线 Linux”中详细讨论。\n\n通用串行 Card Services 驱动程序\
  \ `serial_cs` 允许系统的其他部分将 PCMCIA/CF 卡视为串行设备。第一个未使用的串行设备 `/dev/ttySX` 被分配给该卡。因此，`serial_cs`\
  \ 在 GPRS、GSM 和 GPS 卡上模拟了串口。\n\n点对点协议（PPP）允许 TCP/IP 等网络协议在串行链路上运行。在图 9.5 的背景下，PPP\
  \ 在 GPRS 和 GSM 拨号上运行 TCP/IP 。PPP 进程 `pppd` 连接到 `serial_cs` 模拟的虚拟串口上。为了让 `pppd` 工作，必须加载\
  \ PPP 内核模块——`ppp_generic`、`ppp_async` 和 `slhc`。按如下方式调用 `pppd`：\n\n```bash\npppd\
  \ ttySX call connection-script\n```\n\n其中 `connection-script` 是包含 pppt 与 服务提供商交换以建立链路的命令序列的文件。脚本取决于所使用的特定卡。GPRS\
  \ 卡需要在连接脚本中发送上下文字符串，而 GSM 卡可能需要交换密码。\n\n## 调试\n\n为了有效调试 PCMCIA/CF 客户端驱动程序，你需要看到\
  \ PCMCIA 核心发出的调试消息。为此，请启用 `CONFIG_PCMCIA_DEBUG`（ *Bus options* →）。\n\n\n\n\n\n`PCCARD\
  \ support` → 在内核配置期间`启用 PCCARD 调试`。调试输出的详细程度可以通过 `pcmcia_core.pc_debug` 内核命令行参数或使用\
  \ `pc_debug` 模块插入参数进行控制。\n\n# 第 9 章 PCMCIA 与紧闪存\n\n关于 PC Card 客户端驱动程序的信息可以在进程文件条目\
  \ `*/proc/bus/pccard/drivers.*` 中。查看 **/sys/bus/pcmcia/devices/**` 可以获取特定卡的信息，例如制造商和显卡\
  \ ID。如果你的系统使用 PCI 转 PCMCIA 桥器，请查看 **/proc/bus/pci/*` 以了解更多关于你的 PCMCIA 主控制器的信息。**/proc/interrupts*`\
  \ 列出了系统中活跃的 IRQ，包括 PCMCIA 层使用的 IRQ。\n\n有一个专门用于 Linux-PCMCIA 的邮件列表，地址为：[`lists.infradead.org/mailman/listinfo/linux-pcmcia/mailman/listinfo/linux-pcmcia.`](http://lists.infradead.org/mailman/listinfo/linux-pcmcia.)\n\
  \n## 查看源码\n\n在 Linux 源码树中，`drivers/pcmcia/*` 目录包含了卡服务（Card Services）、驱动服务（Driver\
  \ Services）和主控制器驱动程序的源码。查看 `drivers/pcmcia/yenta_*socket.c` 可以获取在许多 x86 笔记本电脑上的主控制器驱动程序。`include/pcmcia/*`\
  \ 中的头文件包含了 PCMCIA 相关的结构定义。\n\n客户端驱动程序与属于关联设备类的其他驱动程序并存。因此，你会在 `drivers/net/pcmcia/.*`\
  \ 找到 PCMCIA 网卡的驱动程序。\n\n模拟 IDE 的 PCMCIA 内存设备客户端驱动程序是 `drivers/ide/legacy/*ide-cs.c.*`。查看\
  \ `drivers/serial/serial_cs.c` 可获取 PCMCIA 调制解调器使用的客户端驱动。\n\n表 9.2 总结了本章使用的主要数据结构及其在内核树的位置。表\
  \ 9.3 列出了本章中使用的主要内核编程接口及其定义位置。\n\n### 表 9.2 数据结构总结\n\n| 数据结构 | 位置 | 描述 |\n| :---\
  \ | :--- | :--- |\n| `pcmcia_device_id` | `include/linux/mod_devicetable.h` | PCMCIA\
  \ 卡的标识。 |\n| `pcmcia_device` | `include/pcmcia/ds.h` | PCMCIA 设备的表示。 |\n| `pcmcia_driver`\
  \ | `include/pcmcia/ds.h` | PCMCIA 客户端驱动程序的表示。 |\n| `tuple_t` | `include/pcmcia/cistpl.h`\
  \ | CIS 操作例程使用 `tuple_t` 结构存储信息。 |\n| `cistpl_cftable_entry_t` | `include/pcmcia/cistpl.h`\
  \ | CIS 空间中的配置表项。 |\n| `cisparse_t` | `include/pcmcia/cistpl.h` | 解析后的 CIS 元组。 |\n\
  \n### 表 9.3 内核编程接口总结\n\n| 内核接口 | 位置 | 描述 |\n| :--- | :--- | :--- |\n| `pcmcia_register_driver()`\
  \ | `drivers/pcmcia/ds.c` | 向 PCMCIA 核心注册驱动程序 |\n| `pcmcia_unregister_driver()`\
  \ | `drivers/pcmcia/ds.c` | 从 PCMCIA 核心注销驱动程序 |\n| `pcmcia_get_first_tuple()` |\
  \ `include/pcmcia/cistpl.h` | 操作元组的库例程 |\n| `pcmcia_get_tuple_data()` | `drivers/pcmcia/cistpl.c`\
  \ | CIS 空间 |\n| `pcmcia_parse_tuple()` | - | |\n| `pcmcia_request_irq()` | `drivers/pcmcia/pcmcia_resource.c`\
  \ | 获取分配给 PCMCIA 卡的 IRQ |\n\n## PCI Family (PCI)\n\n*外围组件部件连接* (PCI) 是一种无处不在的 I/O\
  \ 后干。无论你是在存储服务器上备份数据、从桌面捕获视频，还是在笔记本电脑上上网，PCI 可能正在存储服务器上备份数据、从桌面捕获视频，或在笔记本电脑上上网……（注：原文此处存在大量重复，已按要求保留翻译）。\n\
  \n串行通信由于不存在信号干扰等因素，比并行传输更快、更便宜，因此行业趋势是从并行转向串行。PCIe 及其变体旨在取代 PCI 及其衍生产品。书中提到的几种 I/O\
  \ 接口如 RS-232、USB、FireWire、SATA、以太网、光纤通道和 InfinityBand 都是串行架构。PCIe 家族中对应 CardBus\
  \ 的 Express Card。Express Card 通过 PCIe 链路或 USB 2.0（下一节讨论）直接连接系统总线，跳过了卡控制器等中间环节。Mini\
  \ PCI 在 PCIe 家族中的表亲是 PCI Express Mini。现代笔记本电脑使用 Express 卡槽取代 CardBus，并用 PCI Express\
  \ Mini 卡槽取代 Mini PCI。与后者相比，前者占用空间更小，速度更快。\n\n所有技术都是相互兼容的。内核 PCI 驱动程序将适用于之前提到的所有相关技术；尽管我们本章的示例代码基于\
  \ CardBus 卡，但这些概念也适用于其他 PCI 衍生产品。基于 PCI 家族的解决方案涵盖广泛的硬件领域：\n\n- 网络技术，如千兆以太网、WiFi、ATM、令牌环和\
  \ ISDN。\n- 存储技术主机适配器，如 SCSI。\n- I/O 总线主机控制器，如 USB、FireWire、IDE、I2C 和 PCMCIA。在 PC\
  \ 兼容系统中，这些主机控制器充当南桥上的 PCI 控制器与其源总线技术之间的桥梁。通过运行 `lspci`（后文讨论）可以验证这一点。\n- 图形、视频流和数据捕获。\n\
  \n\n\n\n\n*   串口卡和并行卡。\n*   声卡。\n*   如看门狗（Watchdogs）、具备 EDAC 功能的内存控制器和游戏端口等设备。\n\
  \n# 第 10 章 通用部件互连总\n\n## 表 10.1 PCI 的兄弟、孩子和表亲\n\n| 总线名称 | 特性 | 形式因子 |\n| :--- |\
  \ :--- | :--- |\n| PCI | 33MHz 或 66MHz 的 32 位总线；带宽高达 266MBps。 | 台式机和服务器的内部插槽。 |\n\
  | Mini PCI | 33MHz 的 32 位总线。 | 笔记本电脑的内部插槽。 |\n| CardBus | 33MHz 的 32 位总线。兼容 PCI。\
  \ | 笔记本电脑的外部 PC 卡槽。 |\n| PCI 扩展型 | 133 MHz 的 64 位总线，带宽高达 1GBps。比 PCI 宽，但 PCI 卡可以插入\
  \ PCI-X 插槽。 | 台式机和服务器的内部插槽。 |\n| PCI Express (PCIe) | 每个传输方向每个 PCIe 链路 250MBps，每个方向最大吞吐量为\
  \ 8GBps。PCIe 是串行协议，与原生的并行 PCI 不同。 | 在新系统中取代内部 PCI 插槽。 |\n| PCI Express Mini Card\
  \ | 如果接口基于 PCIe 链路，每个方向 250MBps；如果基于 USB 2.0，则 60MBps。 | 在新笔记本电脑中取代 Mini PCI 作为内部插槽。形式因子比\
  \ Mini PCI 小。 |\n| Express Card | 如果接口基于 PCIe 链路，每个方向 250MBps；如果基于 USB 2.0，则 60MBps。\
  \ | 新笔记本电脑中取代 CardBus 的薄型外部插槽。通过 PCIe 或 USB 2.0 与系统总线接口。 |\n\n对于驱动开发者来说，PCI 家族提供了一个极具吸引力的优势：设备自动配置系统。与旧\
  \ ISA 代驱动不同，PCI 驱动不需要实现复杂的探测逻辑。在启动过程中，BIOS 类型固件（或如果配置为内核本身）会遍历 PCI 总线并分配中断电平和 I/O\
  \ 基地址等资源。设备驱动程序通过查看称为“PCI 配置空间”的内存区域获取这些分配。PCI 设备拥有 256 字节的配置内存。配置空间的前 64 字节是标准化的，包含包含状态、中断线和\
  \ I/O 基地址等细节的寄存器。PCIe 和 PCI-X 2.0 提供了 4KB 的扩展配置空间。我们稍将学习如何操作 PCI 配置空间。\n\n图 10.1\
  \ 显示了兼容 PC 系统中的 PCI。集成在南桥中的组件（如 USB、IDE、I2C、LPC 和以太网控制器硅）位于 PCI 总线之外。这些控制器中的一些包含内部\
  \ PCI 转 PCI 桥，以为相应的 I/O 技术提供专用 PCI 总线。南桥还包含一个外部 PCI 总线，用于连接 CardBus 控制器和 WiFi 芯片组等\
  \ I/O 外设。图 10.1 还显示了与每个连接子系统对应的 PCI 地址对。在我们学习 PCI 寻址时，这一点将变得清晰。\n\n```\n图 10.1 PC\
  \ 南桥内部的 PCI。\n处理器\n北桥\n南桥\n集线器接口\n0:1e.0\n3:0.0 & 3:0.1\nUSB\nIDE\n以太网调制解调卡\n0:1d.X\n\
  0:1f.0\n以太网\n3:X.Y\nI2C\nWiFi\n1:0.0\nCard Bus\n0:1f.1\n芯片组控制器\n外部\n2:X.Y\n2:0.0\n\
  LPC\nPCI\n0:1f.2\n0:1e.0\nSCSI 主适配器\n火线\nAC’97\n0:1f.3\n音频\n0:1f.1\n```\n\n## 寻址与识别\n\
  \nPCI 设备使用 `bus`（总线）、`device`（设备）和 `function`（函数）进行寻址，并通过 `vendorIDs`（厂商 ID）、`deviceIDs`（设备\
  \ ID）和 `class codes`（类代码）进行识别。让我们借助从 http://mj.ucw.cz/pciutils.shtml 下载的 `PCI Utilities`\
  \ 软件包中的 `lspci` 工具来学习这些概念。\n\n假设你正在一台由德州仪器 PCI4510 CardBus 控制器服务的奔腾级笔记本电脑上使用 Xircom\
  \ 以太网调制解调多功能 CardBus 卡，如图 10.1 所示。运行 `lspci`：\n\n```bash\nlspci\n```\n00:00.0 主桥:\
  \ Intel Corporation 82852/82855 GM/GME/PM/GMV Processor to I/O Controller (rev 02)\n\
  ...\n02:00.0 CardBus 桥: Texas Instruments PCI4510 PC card Cardbus Controller (rev\
  \ 03)\n...\n03:00.0 以太网控制器: Xircom Cardbus Ethernet 10/100 (rev 03)\n03:00.1 串口控制器:\
  \ Xircom Cardbus Ethernet + 56k Modem (rev 03)\n\n```\n\n考虑上述输出每个条目开头的元组 `XX:YY.Z`。`XX`\
  \ 代表总线号。一个 PCI 域可以容 256 条总线。在之前使用的笔记本电脑中，CardBus 桥连接到 PCI 总线 2。该桥产生另一个编号为 3 的总线，用于托管\
  \ Xircom 卡。`YY` 是 PCI 设备号。每条总线可以连接最多 32 个设备。每个设备转而实现最多 `Z` 个函数。因此，`03:00.0` 是卡的以太网函数，而\
  \ `03:00.1` 对应其调制调器函数。执行 `lspci -t` 以获取系统上 PCI 总线设备的树状布局。\n\n```bash\nlspci -t\n\
  -[0000:00]-+-00.0+-00.1+-00.3\n+-02.0+-02.1\n+-1d.0+-1d.1\n+-1e.0\n```\n\n\n\n从前面的输出（以及图\
  \ 10.1）可以看出，要遍历 PCI 总线并到达 Xircom 调制调器（`03:00.1`）或以太网控制器（`03:00.0`），必须从你的 PCI 域（标记为\
  \ `0000`）开始，经过 PCI 桥（`00:1e.0`），然后跨越 PCI 转 CardBus 控制器（`02:0.0`）。`sysfs` 的表示如下：\n\
  \n```bash\nls /sys/devices/pci0000:00/0000:00:1e.0/0000:02:00.0/0000:03:00.0\neth2\n\
  ls /sys/devices/pci0000:00/0000:00:1e.0/0000:02:00.0/0000:03:00.1\nttyS1\n```\n\n\
  正如之前看到的，PCI 设备拥有一个持有寄存器的 256 字节内存区域。该空间是识别卡的关键。让我们查看之前使用的 CardBus 控制器和 Xircom 双功能的配置空间。Xircom\
  \ 卡具有两个配置空间：\n\n```bash\nlspci -x\n00:00.0 主桥: Intel Corporation 82852/82855 GM/GME/PM/GMV\
  \ Processor to I/O Controller (rev 02)\n00: 86 80 80 35 06 01 90 20 02 00 06 00\
  \ 00 80\n10: 08 00 00 00 00 00 00 00 00 00 00 00\n20: 00 00 00 00 00 00 00 00 00\
  \ 00 00 00 14 10 5c 05\n30: 00 00 00 00 40 00 00 00 00 00 00 00 00 00 00 00\n...\n\
  02:00.0 CardBus 桥: Texas Instruments PCI4510 PC card Cardbus Controller (rev 03)\n\
  00: 4c 10 44 ac 07 00 10 02 03 00 07 06 20 a8 82 00\n10: 00 00 00 b0 a0 00 00 22\
  \ 02 03 04 b0 00 00 00 f0\n20: 00 f0 ff f1 00 00 00 d2 00 f0 ff d3 00 30 00 00\n\
  30: fc 30 00 00 00 34 00 00 fc 34 00 00 0b 01 00 05\n...\n03:00.0 以太网控制器: Xircom\
  \ Cardbus Ethernet 10/100 (rev 03)\n00: 5d 11 03 00 07 00 10 02 03 00 02 00 40 80\
  \ 00\n10: 01 30 00 00 00 10 00 d2 00 18 00 d2 00 00 00 00\n20: 00 00 00 00 00 00\
  \ 00 00 07 02 00 00 5d 11 81 11\n30: 00 00 00 00 dc 00 00 00 00 00 00 00 0b 01 14\n\
  03:00.1 串口控制器: Xircom Cardbus Ethernet + 56k Modem (rev 03)\n00: 5d 11 03 01 03\
  \ 00 10 02 03 02 00 07 00 00 80 00\n10: 81 30 00 00 00 10 00 d2 00 18 00 d2 00 00\
  \ 00 00\n20: 00 00 00 00 00 00 00 00 07 02 00 00 5d 11 81 11\n30: 00 00 00 00 dc\
  \ 00 00 00 00 00 00 00 0b 01 00 00\n\nPCI 寄存器是小端序，因此在解释前面的输出时要考虑这一点。你也可以通过 sysfs\
  \ 转储 PCI 配置区域。因此，为了查看 Xircom 卡以太网函数的配置空间，可以这样操作：\n\n```bash\nod -x /sys/devices/pci0000:00/0000:00:1e.0/0000:02:00.0/0000:03:00.0/config\n\
  ```\n0000000 115d 0003 0007 0210 0003 0200 4000 0080\n\n\n\n\n\n```\n0000020 3001\
  \ 0000 0000 d200 0800 d200 0000 0000\n\n0000040 0000 0000 0000 0000 0107 0000 115d\
  \ 1181\n...\n```\n\n表 10.2 解释了前述转储中显示的一些值。前两个字节包含 `vendor ID`（厂商 ID），用于识别制造该卡的公司。PCI\
  \ `vendor IDs` 在全球范围内维护和分配的。（在浏览器中访问 `[www.pcidatabase.com]` 查看数据库。）如你从前述输出中解读的那样，英特尔（Intel）、德州仪器（Texas\
  \ Instruments）和 Xircom（现已被英特尔收购）分别拥有 `0x8086`、`0x104C` 和 `0x115D` 的 `vendor IDs`。接下来两个字节特定于卡的功能，并成了它的\
  \ `device ID`（设备 ID）。从前述输出来看，Xircom 卡以太网功能拥有 `0x0003` 的 `device ID`，而调制解调器对应 `0x0103`\
  \ 的 `device ID`。PCI 卡还拥有 `subvendor`（子厂商）和 `subdevice IDs`（子设备 ID）（参见前述转储中偏移 44\
  \ 和 46 处的字），以进一步确定其身份。\n\n配置空间第 10 字节处是描述设备类型的代码。PCI 桥器具有以 `0x06` 开头的 `class code`（类代码），网络设备拥有以\
  \ `0x02` 开头的 `class code`，通信设备拥有以 `0x07` 开头的 `class code`。因此，在前面的示例中，CardBus 桥、以太网卡和串口调制解调器分别拥有\
  \ `0x0607`、`0x0200` 和 `0x0700` 的 `class codes`。你可以在 `include/linux/pci_ids.h` 中找到\
  \ `class code` 的定义。\n\n### 表 10.2 PCI 配置空间语义\n\n| 空间偏移 | 语义 | Xircom 卡转储输出值 |\n\
  | :--- | :--- | :--- |\n| 0 | Vendor ID | `0x115D` |\n| 2 | Device ID | `0x0003`\
  \ |\n| 10 | Class code | `0x0200` |\n| 16 to 39 | 基地址寄存器 0 (BAR 0) 到 BAR5 | `0x3001...0000`\
  \ |\n| 44 | Subvendor ID | `0x115D` |\n| 46 | Subdevice ID | `0x1181` |\n\nPCI 驱动程序向\
  \ PCI 子系统注册它们支持的 `vendor IDs`、`device IDs` 和 `class codes`。使用此数据库，PCI 子系统在从配置空间中获取卡身份后，将插入的卡绑定到相应的设备驱动程序。我们将在稍后实现示例驱动程序时看到这是如何实现的。\n\
  \n### 访问 PCI 区域\n\nPCI 设备包含三个寻址区域：配置空间、I/O 端口和设备内存。让我们学习如何从驱动程序访问这些内存区域。\n\n####\
  \ 配置空间\n\n内核提供了六个函数，你的驱动程序可以使用它们来操作 PCI 配置空间：\n\n```\npci_read_config_byte|word|dword;\n\
  ```\n\n以及\n\n```\npci_write_config_byte|word|dword;\n```\n\n在参数列表中，`struct pci_dev`\
  \ 是 PCI 设备结构，`offset` 是你想访问的配置空间中的字节位置。对于读取函数，`value` 是指向所提供的数据缓冲的指针；对于写入例程，它包含要写入的数据。\n\
  \n让我们考虑一些例子：\n\n*   要解码分配给卡功能的 IRQ 号，请使用以下代码：\n```c\nunsigned char irq;\npci_read_config_byte(pdev,\
  \ PCI_INTERRUPT_LINE, &irq);\n```\n根据 PCI 规范，PCI 配置空间内部偏移 60 处持有分配给卡的 IRQ 号。所有配置寄存器偏移都在\
  \ `include/linux/pci_regs.h` 中显式定义，因此使用 `PCI_INTERRUPT_LINE` 而不是 60 来指定此偏移。同样，读取\
  \ PCI 状态寄存器（配置空间偏移 6 处的两个字节），请这样做：\n```c\nunsigned short status;\npci_read_config_word(pdev,\
  \ PCI_STATUS, &status);\n```\n\n*   只有配置空间的前 64 字节是标准的。设备制造商为其余部分定义所需的语义。之前使用的 Xircom\
  \ 卡在偏移 64 处分配了四个字节用于电源管理。为了禁用电源管理，Xircom CardBus 驱动 `drivers/net/tulip/xircom_cb.c`\
  \ 执行以下操作：\n```c\n#define PCI_POWERMGMT 0x40\npci_write_config_dword(pdev, PCI_POWERMGMT,\
  \ 0x0000);\n```\n\n### I/O 和内存\n\nPCI 卡有多三个寻址区域：配置空间、I/O 端口和设备内存。（此处由于原文存在大量重复文本，已按要求保留并翻译）\n\
  \nPCI 卡有多三个寻址区域：配置空间、I/O 端口和设备内存。PCI 卡有多三个寻址区域：配置空间、I/O 端口和设备内存……（省略重复部分）……这些区域：配置空间、I/O\
  \ 端口和设备内存。让我们学习从驱动程序访问这些内存区域。\n\n\n\n\n并且 IDE 磁盘驱动器是依赖 `DMA` 进行数据传输的外设备的常见示例。\n\n\
  `DMA` 由 `DMA` 主设备启动。PC 主板的南桥上设有一个 `DMA` 控制器，它可以主控 I/O 总线并向外设或从外设启动 `DMA`。这对于旧的 ISA\
  \ 卡通常是如此。然而，像 `PCI` 这样的总线可以主总线并启动 `DMA` 传输。`CardBus` 卡与 `PCI` 类似，也支持 `DMA` 主控。另一方面，`PCMCIA`\
  \ 设备不支持 `DMA` 主控，但通常连接到 `PCI` 总线的 `PCMCIA` 控制器可能具有 `DMA` 主控能力。\n\n`缓存一致性`（cache\
  \ coherency）问题与 `DMA` 是同义的。为了获得最佳性能，处理器会缓存最近访问的字节，因此 CPU 和主内存之间传递的数据流通过处理器缓存。然而，在\
  \ `DMA` 期间，数据直接在外设和主内存之间传输，因此跳过了处理器缓存。这种规避可能会引入不一致性，因为处理器可能会处理其缓存中过旧的数据。某些架构使用一种名为\
  \ `bus snooping`（总线监听）的技术自动将缓存与主内存同步。然而，许多其他架构依赖软件来实现一致性。在介绍更多几个主题后，我们将学习如何执行一致的\
  \ `DMA` 操作。\n\n`DMA` 可以`同步`或`异步`地发生。前者的例子是从系统帧缓冲区到 LCD 控制器的 `DMA`。用户应用程序通过 `/dev/fbX`\
  \ 向 `DMA` 映射的帧缓冲区写入像素数据，而 LCD 控制器使用 `DMA` 按时间间隔同步地收集这些数据。我们将在第 12 章“视频驱动程序”中详细讨论这一点。异步\
  \ `DMA` 的示例是 CPU 和网卡之间数据帧的发送和接收，这在第 15 章“网络接口卡”中进行了讨论。\n\n作为 `DMA` 传输源或目的地的系统内存区域被称为\
  \ `DMA` 缓冲区。如果总线接口具有地址限制，这将影响可以存放 `DMA` 缓冲区的内存范围。因此，适用于 24 位总线（如 `ISA`）的 `DMA` 缓冲区只能存在于系统内存底部的\
  \ 16MB 中，称为 `ZONE_DMA`（参见第 2 章“深入内核内部”中的“分配内存”章节）。`PCI` 总线默认宽度为 32 位，因此在 32 位平台上你通常不会遇到此类限制。要让内核了解对\
  \ `DMA` 可用缓冲区的任何特殊需求，请使用以下代码：\n\n```c\ndma_set_mask(struct device *dev, u64 mask);\n\
  ```\n\n如果此函数返回成功，你就可以对任何长度为掩码位长度地址进行 `DMA` 操作。例如，`e1000` `PCI-X` 千兆以太网驱动 `drivers/net/e1000/e1000_main.c`\
  \ 执行了以下操作：\n\n```c\nif (!(err = pci_set_dma_mask(pdev, DMA_64BIT_MASK))) {\n   \
  \ /* 系统支持 64 位 DMA */\n    pci_using_dac = 1;\n} else {\n    /* 检查是否支持 32 位 DMA\
  \ */\n    if ((err = pci_set_dma_mask(pdev, DMA_32BIT_MASK))) {\n        /* 不，放弃\
  \ */\n        E1000_ERR(\"No usable DMA configuration, aborting\\n\");\n       \
  \ return err;\n    }\n    /* 32 位 DMA */\n    pci_using_dac = 0;\n}\n```\n\nI/O\
  \ 设备通过总线控制器和任何中间的 `I/O 内存管理单元`（`IOMMU`）来看待 `DMA` 缓冲区。由于由于原因，I/O 设备使用的是`bus`地址，而不是物理地址或内核虚拟地址。因此，当你通知\
  \ `PCI` 卡 `DMA` 缓冲区的位置时，你必须让它知道缓冲区的总线地址。`DMA` 服务程序将 `DMA` 缓冲区的内核虚拟地址映射到总线地址，以便设备和\
  \ CPU 都能访问缓冲区。总线地址类型为 `dma_addr_t`，定义在 `include/asm-your-arch/types.h.` 中。\n\n关于\
  \ `DMA` 几个值得了解的概念。一个是`弹性缓冲区`（bounce buffers）的概念。`弹性缓冲区`位于 `DMA` 可用区域，当请求从向非 `DMA`\
  \ 可用内存区域进行 `DMA` 操作时，它们被用作临时内存。例如在没有中间 `IOMMU` 的情况下，从 32 位 `PCI` 外设向高于 4GB 的地址进行\
  \ `DMA`。数据首先传输到`弹性缓冲区`，然后复制到最终目标。第二个概念是一种称为`离散聚集`（scatter-gather）的 `DMA`。当要 `DMA`\
  \ 的数据分散在不连续的区域时，`离散聚集`能力允许硬件一次性收集分散缓冲区的内容。当数据从卡 `DMA` 到分散在内存中的缓冲区时，情况则相反。`离散聚集`能力通过消除处理多次\
  \ `DMA` 请求的需求来提高性能。\n\n内核提供了一个良好的 API，掩盖了许多配置 `DMA` 的内部细节。如果你正在为支持总线主控的 `PCI` 卡编写驱动程序，该\
  \ API 会变得简单。（大多数 `PCI` 卡都支持）。`PCI` `DMA` 例程本质上是通用 `DMA` 服务程序的封装，定义在 `include/asm-generic/pci-dma-compat.h.`\
  \ 中。在本章中，我们只使用以下 `PCI` `DMA` 例程：\n\n内核提供了两类 `DMA` 例程给 `PCI` 驱动程序：\n\n1. 一致（或相干）DMA\
  \ 访问方法。这些例程保证一致性。代价是性能影响。为了获取一致的 `DMA` 缓冲区，调用此例程：\n\n```c\nvoid *pci_alloc_consistent(struct\
  \ pci_dev *pdev, size_t size, dma_addr_t *dma_handle);\n```\n\n此函数分配 `DMA` 缓冲区，生成其总线地址并返回内核虚拟地址。前两个参数分别是\
  \ PCI 设备结构和缓冲区的大小。第三个参数 `dma_handle` 是生成的总线地址的指针。\n\n```c\n/* 分配 */\nvoid *vaddr\
  \ = pci_alloc_consistent(pdev, size, &dma_handle);\n/* 使用 ... */\n/* 释放 */\npci_free_consistent(pdev,\
  \ size, vaddr, dma_handle);\n```\n\n2. 流式 DMA 访问方法。这些例程不保证一致性，因此更快。当 CPU 和 I/O 设备之间有频繁访问时，它们非常有用。当流式缓冲区已映射供设备访问时，驱动程序在\
  \ CPU 可可靠地操作之前必须显式地取消映射（或同步）。有两个家族：`pci_[map|unmap|dma_sync]_single()` 和 `pci_[map|unmap|dma_sync]_sg()`。\n\
  \n第一个家族映射、取消映射并同步单个预分配的 `DMA` 缓冲区。`pci_map_single()` 定义如下：\n\n```c\ndma_addr_t pci_map_single(struct\
  \ pci_dev *pdev, void *ptr, size_t size, int direction);\n```\n\n前三个参数分别是 PCI 设备结构、预分配\
  \ `DMA` 缓冲区的内核虚拟地址以及提供的缓冲区的大小。第四个参数 `direction` 可以是以下之一：`PCI_DMA_BIDIRECTION`、`PCI_DMA_TODEVICE`、`PCI_DMA_FROMDEVICE`\
  \ 或 `PCI_DMA_NONE`。名称自言易懂，但第一个选项代价很大，最后一个用于调试。我们稍后开发示例驱动程序时进一步讨论流式 `DMA` 映射。\n\n\
  第二个家族映射、取消映射并同步离散聚集列表的 `DMA` 缓冲区。`pci_map_sg()` 定义如下：\n\n```c\nint pci_map_sg(struct\
  \ pci_dev *pdev, struct scatterlist *sgl, int num_entries, int direction);\n```\n\
  \n离散列表使用第二个参数 `struct scatterlist` 指定，定义在 `include/asm-your-arch/scatterlist.h.`\
  \ 中。`num_entries` 是 scatterlist 中的项数。第一个和最后一个参数与 `pci_map_single()` 描述的相同。该函数返回映射的项数。\n\
  \n\n\n\n```c\nnum_mapped = pci_map_sg(pdev, sgl, num_entries, PCI_DMA_TODEVICE);\n\
  \nfor (i=0; i<num_mapped; i++) {\n    /* sg_dma_address(&sgl[i]) returns the bus\
  \ address\n    of this entry */\n    /* sg_dma_len(&sgl[i]) returns the length of\
  \ this region\n    */\n}\n```\n\n让我们来总结一下相性（coherent）DMA 和流式（streaming）DMA 的特性，以帮助你判断它们是否适用于你的使用场景：\n\
  \n*   相性映射的代码编写简单，但使用成本较高。流式映射具有相反的特性。\n*   当 CPU 和 I/O 设备都需要频繁操作 DMA 缓冲区时，优先选择相性映射。这通常是同步\
  \ DMA 的情况。例如之前提到的帧缓冲区驱动程序，其中每个 DMA 操作都在同一个缓冲区上进行。由于 CPU 和视频控制器会不断访问帧缓冲区，在这种情况下使用相性映射是有意义的。\n\
  *   当 I/O 设备长时间持有缓冲区时，请使用流式映射。流式 DMA 常见异步操作，此时每个 DMA 操作都在不同的缓冲区上进行。例如网络驱动程序，其中携带传输数据包的缓冲区是动态映射和取消映射的。\n\
  *   DMA 描述符（descriptors）是相性映射的理想选择。DMA 描述符包含了关于 DMA 缓冲区的元数据（如地址和长度），并且会被 CPU 和设备频繁访问。动态映射描述符成本很高，因为这涉及到频繁的取消映射和重新映射（或同步操作）。\n\
  \n## 设备示例：以太网调制调器卡\n\n利用目前学到的知识，让我们尝试为一个虚拟的以太网调制调器双功能 CardBus 卡编写一个骨架设备驱动程序，看看它如何用于局域网联网以及与互联网服务提供商建立拨号连接。你基本上需要为每个支持的功能编写一个设备驱动。假设你已经有一个串口驱动程序（我们在第\
  \ 6 章“串口驱动程序”中学习了编写串口驱动）和一个以太网驱动程序（我们将在第 15 章学习实现网络驱动），并且它们支持该卡上使用的芯片组，让我们修改这些驱动程序并让它们与\
  \ CardBus 接口工作。这里的示例是通用的，但它大致基于我们之前使用的 Xircom 卡内核驱动。Xircom 驱动的以太网和调制调器部分分别位于 `drivers/net/tulip/xircom_cb.c`\
  \ 和 `drivers/serial/8250_pci.c`。\n\n## 初始化与探测\n\nPCI 驱动程序使用在 `include/linux/mod_devicetable.h`\
  \ 中定义的 `pci_device_id` 结构体数组来描述它们支持的卡的标识：\n\n```c\nstruct pci_device_id {\n    __u32\
  \ vendor, device; /* 厂商和设备 ID */\n    __u32 subvendor, subdevice; /* 子厂商和子设备 ID\
  \ */\n    __u32 class, classmask; /* 类和类掩码 */\n    kernel_ulong_t driver_data; /*\
  \ 私有数据 */\n};\n```\n\n`pci_device_id` 中前六字段的语义符合之前讨论的 PCI 术语。最后一个字段 `driver_data`\
  \ 是驱动程序私有的，通常用于在驱动支持多个卡时关联配置信息。\n\n以太网调制调器卡对于其两个功能中的每一个都有对应的设备 ID 和配置空间。由于这两个卡功能是不连接的，你需要单独\
  \ PCI 驱动程序来处理它们。`drivers/net/` 目录是存放以太网驱动的好地方，而 `drivers/serial/` 是放置其串口对应部分的正确位置。列表\
  \ 10.1 中的以太网驱动支持网络功能，并在其 `pci_device_id` 表中公布一组关联 ID。列表 10.2 中的串口驱动程序类似，只是它负责调制调器功能。两个驱动程序都未标明相关的类代码和类掩码，因为厂商\
  \ ID/设备 ID 的组合本身就唯一标识了它们的功能。\n\nPCI 子系统提供了如 `PCI_DEVICE()` 和 `PCI_DEVICE_CLASS()`\
  \ 等宏，以简化创建 `pci_device_id` 表。例如，`PCI_DEVICE()` 根据指定的厂商 ID 和设备 ID 创建 `pci_device_id`\
  \ 元素。因此，你可以如下重写列表 10.1 中的 `network_device_pci_table`：\n\n```c\nstruct pci_device_id\
  \ network_driver_pci_table[] __devinitdata = {\n    {PCI_DEVICE(MY_VENDOR_ID, MY_DEVICE_ID_NET)\n\
  \    .driver_data = (unsigned long)network_driver_private_data},\n    {0},\n};\n\
  ```\n\n列表 10.1 和列表 10.2 中的 `MODULE_DEVICE_TABLE()` 宏标记了模块镜像中的 `pci_device_id` 表。这些信息在插入\
  \ CardBus 卡时按需加载模块。我们在第 4 章“打下基础”的“模块自动加载”章节中探索了这种机制，并在上下文中使用了它。当 PCI 热插拔层感知到与 `pci_device_id`\
  \ 表公布的卡匹配的卡存在时，它会调用该驱动程序的 `probe()` 方法。\n\n### 列表 10.1：网络功能\n\n```c\n#include <linux/pci.h>\n\
  \n#define MY_VENDOR_ID 0xABCD\n#define MY_DEVICE_ID_NET 0xEF01\n\n/* 此驱动程序支持的 PCI\
  \ 卡集 */\nstruct pci_device_id network_driver_pci_table[] __devinitdata = {\n   \
  \ {PCI_DEVICE(MY_VENDOR_ID, MY_DEVICE_ID_NET)\n    .driver_data = (unsigned long)network_driver_private_data},\n\
  \    {0},\n};\n\n/* struct pci_driver 定义在 <linux/pci.h> */\nstruct pci_driver network_pci_driver\
  \ = {\n    .name = \"ntwrk\",\n    .probe = net_driver_probe,\n    .remove = net_driver_remove,\n\
  \    .id_table = network_driver_pci_table,\n};\n\n/* 以太网驱动初始化 */\nstatic int __init\
  \ network_driver_init(void) {\n    pci_register_driver(&network_pci_driver);\n \
  \   return 0;\n}\n\n/* 以太网驱动退出 */\nstatic void __exit network_driver_exit(void)\
  \ {\n    pci_unregister_driver(&network_pci_driver);\n}\n\nmodule_init(network_driver_init);\n\
  module_exit(network_driver_exit);\nMODULE_DEVICE_TABLE(pci, network_driver_pci_table);\n\
  ```\n\n### 列表 10.2：调制调器功能\n\n```c\n#include <linux/pci.h>\n\n#define MY_VENDOR_ID\
  \ 0xABCD\n#define MY_DEVICE_ID_MDM 0xEF02\n\n/* 此驱动程序支持的 PCI 卡集 */\nstruct pci_device_id\
  \ modem_driver_pci_table[] __devinitdata = {\n    {PCI_DEVICE(MY_VENDOR_ID, MY_DEVICE_ID_MDM)\n\
  \    .driver_data = (unsigned long)modem_driver_private_data},\n    {0},\n};\n\n\
  struct pci_driver modem_pci_driver = {\n    .name = \"mdm\",\n    .probe = mdm_driver_probe,\n\
  \    .remove = mdm_driver_remove,\n    .id_table = modem_driver_pci_table,\n};\n\
  ```\n\n\n\n\n\n```c\n.probe = modem_driver_probe, /* 查看列表 10.4 */\n\n.remove = __devexit_p(modem_driver_remove),/*\
  \ 查看列表 10.4 */\n\n.id_table = modem_driver_pci_table, /* 查看上文 */\n\n/* suspend()\
  \ 和 resume() 方法实现了电源管理\n\n未被此驱动使用 */\n};\n\n/* 调器驱动初始化 */\nstatic int __init\nmodem_driver_init(void)\n\
  {\n    pci_register_driver(&modem_pci_driver);\n    return 0;\n}\n```\n\n## 设备示例：以太网调制调器卡\n\
  297\n\n```c\n/* 调器驱动退出 */\nstatic void __exit\nmodem_driver_exit(void)\n{\n    pci_unregister_driver(&modem_pci_driver);\n\
  }\n\nmodule_init(modem_driver_init);\nmodule_exit(modem_driver_exit);\nMODULE_DEVICE_TABLE(pci,\
  \ modem_driver_pci_table);\n```\n\n列表 10.3 为网络功能实现了 `probe()` 方法。该方法用于：\n\n* 启用\
  \ PCI 设备\n* 发现资源信息，如 I/O 基地址和 IRQ\n* 分配并填充与此设备关联的网络数据结构\n* 将自身注册到内核网络层\n\n列表 10.4\
  \ 为调制调器功能执行了类似的工作。在这种情况下，驱动程序注册到内核串行层，而不是网络层。\n\n列表 10.3 和 10.4 还实现了 `remove()`\
  \ 方法，该方法在 CardBus 卡拔出或驱动模块被卸载时被调用。`remove()` 是 `probe()` 的反向操作；它释放资源并从相关子系统中注销驱动程序。列表\
  \ 10.1 用于声明 `remove()` 方法的 `__devexit_p()` 宏在您没有启用热插拔支持且驱动程序不是动态可加载模块时，会在编译时丢弃所提供的函数。\n\
  \nPCI 子系统带两个参数调用 `probe()`：\n\n1.  own 一个指向 `pci_dev` 的指针，该指针是描述此 PCI 设备的数据结构。该结构定义在\
  \ `include/linux/pci.h` 中，由 PCI 子系统为系统上的每个 PCI 设备维护。\n2.  own 指向 `pci_device_id`\
  \ 的指针，它是驱动程序 `pci_device_id` 表中的项，与在插入的显卡配置空间中找到的信息相匹配。\n\n298 第 10 章 外设组件互连\n\n\
  ### 列表 10.3：探测网络功能\n```c\n#include <linux/pci.h>\nunsigned long ioaddr;\n\n/* 探测方法\
  \ */\nstatic int __devinit\nnet_driver_probe(struct pci_dev *pdev,\nconst struct\
  \ pci_device_id *id)\n{\n    /* net_device 结构定义在 include/linux/netdevice.h 中。\n\
  \    描述请参阅第 15 章“网络接口卡” */\n    struct net_device *net_dev;\n    /* 请求低级 PCI 代码为此设备启用\
  \ I/O 和内存区域。\n    查找 PCI 子系统在遍历总线时分配给该设备的 IRQ */\n    pci_enable_device(pdev);\n\
  \    /* 在总线主模式下使用此设备，因为\n    此卡的网络功能支持 DMA */\n    pci_set_master(pdev);\n    /*\
  \ 分配一个以太网接口并在 net_dev 结构中填充通用值。\n    prv_data 是私有驱动数据结构，包含缓冲区、锁等。\n    此项被留为未定义。请等候第\
  \ 15 章了解更多关于\n    alloc_etherdev() 的信息 */\n    net_dev = alloc_etherdev(sizeof(struct\
  \ prv_data));\n    /* 使用你的网络设备驱动方法填充 net_dev */\n    net_dev->hard_start_xmit =\
  \ &mydevice_xmit; /* 查看列表 10.6 */\n    /* 更多 net_dev 初始化 */\n    /* ... */\n   \
  \ /* 获取此 PCI 区域的 I/O 地址。表 10.3 中指定的\n    所有卡寄存器均认为在 bar 0 中 */\n    ioaddr = pci_resource_start(pdev,\
  \ 0);\n    /* 一个 128 字节的 I/O 区域 */\n    request_region(ioaddr, 128, \"ntwrk\");\n\
  \    /* 填充从 PCI 层获取资源信息 */\n    net_dev->base_addr = ioaddr;\n    net_dev->irq =\
  \ pdev->irq;\n    /* ... */\n    /* 设置 DMA。定义在列表 10.5 中 */\n    dma_descriptor_setup(pdev);\n\
  \    /* 将驱动注册到网络层。这将分配一个\n    未使用的 ethX 接口 */\n    register_netdev(net_dev);\n \
  \   /* ... */\n}\n\n/*  方法 */\nstatic void __devexit\nnet_driver_remove(struct pci_dev\
  \ *pdev)\n{\n    /* 释放传输和接收 DMA 缓冲区。\n    定义在列表 10.5 中 */\n    dma_descriptor_release(pdev);\n\
  \    /* 释放内存区域 */\n    /* ... */\n    /* 从网络层注销 */\n    unregister_netdev(dev);\n\
  \    free_netdev(dev);\n    /* ... */\n}\n```\n\n### 列表 10.4：探测调制调器功能\n```c\n/*\
  \ 探测方法 */\nstatic int __devinit\nmodem_driver_probe(struct pci_dev *pdev,\nconst\
  \ struct pci_device_id *id)\n{\n    struct uart_port port;\n    /* net_device 结构定义在\
  \ include/linux/netdevice.h 中。\n    描述请参阅第 15 章“网络接口卡” */\n300 第 10 章 外设组件互连\n \
  \   /* 请求低级 PCI 代码为此设备启用 I/O 和内存区域。\n    查找 PCI 子系统在遍历总线时分配给该设备的 IRQ */\n    pci_enable_device(pdev);\n\
  \    /* 在总线主模式下使用此设备，因为\n    此卡的网络功能支持 DMA */\n    pci_set_master(pdev);\n    /*\
  \ 获取此 PCI 区域的 I/O 地址。\n    include/linux/pci.h\n    /* ... */\n    /* 将驱动注册到网络层。这将分配一个\n\
  \    未使用的 ethX 接口 */\n    serial250_port(&port);\n    /* ... */\n}\n\n/* 方法 */\n\
  static void __devexit\nmodem_driver_exit(struct pci_dev *pdev)\n{\n    /* 从网络层注销\
  \ */\n    serial250_port(&port);\n    /* 禁用设备 */\n    pci_disable_device(dev);\n\
  }\n```\n\n设备示例：以太网调制调器卡\n299\n\n回顾一下，让我们跟踪插入以太网调制调器 CardBus 卡时的代码路径：\n\n1. 对于每个功能，相应的驱动初始化一个\
  \ `pci_device_id` 表和一个 `probe()` 例程。这如列表 10.1 和 10.2 所示。\n2. PCI 热插拔层检测到插入，从配置空间获取每个厂商\
  \ ID 和设备 ID。\n3. 因为 ID 与注册的 ID 匹配，相应的 `probe()` 方法被调用。这分别在列表 10.3 和 10.4 中导致 `net_driver_probe()`\
  \ 和 `modem_driver_probe()`。\n4. `probe()` 方法通过 PCI 层配置以太网和调制调器部分。这导致分配一个网络接口 (`ethX`)\
  \ 和一个串口端口 (`ttySX`) 给卡。从现在开始，应用程序数据通过这些接口流动。\n\n301\n\n## 数据传输\n示例 CardBus 设备的网络功能使用以下数据传输策略：卡期望设备驱动程序为其提供两个\
  \ DMA 描述符数组和一个传输 描述符数组。每个 DMA 描述符包含关联的数据缓冲区地址、长度和一个控制字。你可以使用控制字来告诉设备描述符是否包含有效数据。对于传输描述符，你还可以编写它在数据传输后请求中断。卡寻找有效描述符并向/从关联缓冲区进行\
  \ DMA。为了适应这种简单方案，示例驱动仅使用一致 DMA 接口。驱动程序一致分配一个大缓冲区来存储描述符及其关联缓冲区。接收和传输缓冲区长度为 1536 字节，以匹配以太帧的*最大传输单元*\
  \ (MTU)。描述符和缓冲区在图 10.2 中所示。图中每个数组的前 24 字节持有两个 12 字节的 DMA 描述符，其余内存被两个 1536 字节的 DMA\
  \ 缓冲区占据。图中所示的 12 字节描述符布局假设与卡数据表中指定的格式相匹配。\n\n表 10.3 显示了卡的网络功能的寄存器布局。\n\n| 偏移 | 寄存器名称\
  \ | 描述 |\n| :--- | :--- | :--- |\n| I/O 空间 | `DMA_RX_REGISTER` | 持有接收 DMA 描述符数组的总线地址\
  \ |\n| 0x0 | | |\n\n\n\n\n\n### (dma_bus_rx)\n`DMA_TX_REGISTER`\n持有传输 DMA 描述符数组的总线地址\n\
  `0x4`\n\n### (dma_bus_tx)\n`CONTROL_REGISTER`\n命令卡启动 DMA、停止 DMA 等控制字\n`0x8`\n\n\
  #### 接收 DMA 描述符和缓冲区\n#### 传输 DMA 描述符和缓冲区\n\n| (dma_buffer_rx/dma_bus_rx) | (dma_buffer_tx/dma_bus_tx)\
  \ |\n| :--- | :--- |\n| 0 | 0 |\n| DMA Buffer 1 总线地址 | DMA Buffer 1 总线地址 |\n| 4\
  \ | 4 |\n| DMA Buffer 1 长度 | DMA Buffer 1 长度 |\n| 8 | 8 |\n| 控制字 1 | 控制字 1 |\n|\
  \ 12 | 12 |\n| DMA Buffer 2 总线地址 | DMA Buffer 2 总线地址 |\n| DMA Buffer 2 长度 | DMA\
  \ Buffer 2 长度 |\n| 控制字 2 | 控制字 2 |\n| 24 | 24 |\n| 1536 字节 RX DMA 缓冲区 1 | 1536 字节\
  \ TX DMA 缓冲区 1 |\n| 1560 | 1560 |\n| 1536 字节 RX DMA 缓冲区 2 | 1536 字节 TX DMA 缓冲区 2\
  \ |\n| 3096 | 3096 |\n\n图 10.2 用于 CardBus 设备的 DMA 描述符和缓冲区。\n\n#### 列表 10.5 设置 DMA\
  \ 描述符和缓冲区\n```c\n/* 在设备初始化期间分配的以太网功能特定的设备数据结构 */\nstruct device_data {\n    struct\
  \ pci_dev *pdev; /* PCI 设备结构 */\n    struct net_device *ndev; /* 网络设备结构 */\n   \
  \ void *dma_buffer_rx; /* 接收描述符的内核虚拟地址 */\n    dma_addr_t dma_bus_rx; /* 接收描述符的总线地址\
  \ */\n    void *dma_buffer_tx; /* 传输描述符的内核虚拟地址 */\n    dma_addr_t dma_bus_tx; /*\
  \ 传输描述符的总线地址 */\n    /* ... */\n    spin_lock_t device_lock; /* 序列化 */\n} *mydev_data;\n\
  ```\n\n#### 设备示例：以太网调制解调卡\n```c\n/* 与 DMA 相关的卡上寄存器 */\n#define DMA_RX_REGISTER_OFFSET\
  \ 0x0 /* 保存 RX 描述符总线地址的寄存器偏移 */\n#define DMA_TX_REGISTER_OFFSET 0x4 /* 保存 TX 描述符总线地址的寄存器偏移\
  \ */\n#define CONTROL_REGISTER 0x8 /* 控制寄存器的偏移 */\n\n/* 控制寄存器定义 */\n#define INITIATE_XMIT\
  \ 0x1\n/* 描述符控制字定义 */\n#define FREE_FLAG 0x1 /* 空描述符 */\n#define INTERRUPT_FLAG\
  \ 0x2 /* DMA 后触发中断 */\n\n/* 从列表 10.3 调用 */\nstatic void\ndma_descriptor_setup(struct\
  \ pci_dev *pdev)\n{\n    /* 分配接收 DMA 描述符和缓冲区 */\n    mydev_data->dma_buffer_rx =\
  \ pci_alloc_consistent(pdev, 3096, &mydev_data->dma_bus_rx);\n\n    /* 如图 10.2 所示填充两个接收描述符\
  \ */\n    /* RX 描述符 1 */\n    mydev_data->dma_buffer_rx[0] = cpu_to_le32((unsigned\
  \ long)(mydev_data->dma_bus_rx + 24)); /* 缓冲区地址 */\n    mydev_data->dma_buffer_rx[1]\
  \ = 1536; /* 缓冲区长度 */\n    mydev_data->dma_buffer_rx[2] = FREE_FLAG; /* 描述符空闲 */\n\
  \    /* RX 描述符 2 */\n    mydev_data->dma_buffer_rx[3] = cpu_to_le32((unsigned long)(mydev_data->dma_bus_rx\
  \ + 1560)); /* 缓冲区地址 */\n    mydev_data->dma_buffer_rx[4] = 1536; /* 缓冲区长度 */\n\
  \    mydev_data->dma_buffer_rx[5] = FREE_FLAG; /* 描述符空闲 */\n\n    wmb(); /* 写内存屏障\
  \ */\n    /* 将接收描述符的地址写入卡中相应的寄存器。I/O 基地址 ioaddr 已在列表 10.3 中填充 */\n    outl(cpu_to_le32((unsigned\
  \ long)mydev_data->dma_bus_rx), ioaddr + DMA_RX_REGISTER_OFFSET);\n\n    /* 分配传输\
  \ DMA 描述符和缓冲区 */\n    mydev_data->dma_buffer_tx = pci_alloc_consistent(pdev, 3096,\
  \ &mydev_data->dma_bus_tx);\n\n    /* 如图 10.2 所示填充两个传输描述符 */\n    /* TX 描述符 1 */\n\
  \    mydev_data->dma_buffer_tx[0] = cpu_to_le32((unsigned long)(mydev_data->dma_bus_tx\
  \ + 24)); /* 缓冲区地址 */\n    mydev_data->dma_buffer_tx[1] = 1536; /* 缓冲区长度 */\n  \
  \  mydev_data->dma_buffer_tx[2] = FREE_FLAG; /* 此处逻辑逻辑有误，，应为描述描述符 */\n    /* 修正：：逻辑逻辑逻辑\n\
  \n            _________________          */\n    mydev_data->dma_buffer_tx[1] =\
  \ 1536; /* 缓冲区长度 */\n    mydev_data->dma_buffer_tx[2] = FREE_FLAG; /* 有效的描述符 */\n\
  \    mydev_data->dma_buffer_tx[2] = FREE_FLAG | INTERRUPT_FLAG; /* DMA 完成后生成中断 */\n\
  \    /* TX 描述符 2 */\n    mydev_data->dma_buffer_tx[3] = cpu_to_le32((unsigned long)(mydev_data->dma_bus_tx\
  \ + 1560)); /* 缓冲区地址 */\n    mydev_data->dma_buffer_tx[4] = 1536; /* 缓冲区长度 */\n\
  \    mydev_data->dma_buffer_tx[5] = FREE_FLAG | INTERRUPT_FLAG;\n\n    wmb(); /*\
  \ 写内存屏障 */\n    /* 将传输描述符的地址写入卡中相应的寄存器。I/O 基地址 ioaddr 已在列表 10.3 中填充 */\n    outl(cpu_to_le32((unsigned\
  \ long)mydev_data->dma_bus_tx), ioaddr + DMA_TX_REGISTER_OFFSET);\n}\n\n/* 从列表 10.3\
  \ 调用 */\nstatic void\ndma_descriptor_release(struct pci_dev *pdev)\n{\n    pci_free_consistent(pdev,\
  \ 3096, mydev_data->dma_bus_tx);\n    pci_free_consistent(pdev, 3096, mydev_data->dma_bus_rx);\n\
  }\n```\n列表 10.5 通过调用 `wmb()` 强制执行写屏障，以防止 CPU 在填充描述符之前对 `outl()` 进行重排序。在 x86 处理器上，`wmb()`\
  \ 变为 `NOP`，因为 Intel CPU 强制按程序顺序写入。当将描述符写入卡并填充 DMA 描述符内部缓冲区地址时，驱动程序使用 `cpu_to_le32()`\
  \ 将原生字节序转换为小端格式。在 Intel CPU 上，PCI 和 Intel 处理器都以小端通信。在其他几个架构上（例如运行大端模式的 ARM CPU），`wmb()`\
  \ 和 `cpu_to_le32()` 非常重要。\n\n现在你已经有了就绪的描述符和缓冲区，是时候查看系统与 CardBus 设备之间如何交换数据了，如列表\
  \ 10.6 所示。我们将网络接口和网络结构留给第 15 章。\n\n#### 列表 10.6 接收数据\n```c\n/* 中断处理器 */\nstatic\
  \ irqreturn_t\nmydevice_interrupt(int irq, void *dev)\n{\n    struct sk_buff *skb;\n\
  \    /* ... */\n    /* 如果是接收中断，收集数据包并传递给上层。查看每个 DMA 描述符中的控制字以判断其是否包含数据。为了方便，见，卡使用第一个\
  \ RX 描述符 DMA 了此接收包 */\n    packet_size = mydev_data->dma_buffer_rx[1];\n    /* 在真正的驱动中，sk_buff\
  \ 是预分配、流映射并在设备打开期间通过设置 FREE_FLAG 后提供给卡的。接收到的数据直接 DMA 到此 sk_buff，而不是在此处执行 memcpy，你将在第\
  \ 15 章中学习。卡在 DMA 之前清除 FREE_FLAG */\n    skb = dev_alloc_skb(packet_size); /* 见第\
  \ 15 章图 15.2 */\n    skb->dev = mydev_data->ndev; /* 所有的网络设备 */\n    memcpy(skb,\
  \ mydev_data->dma_buffer_rx[24], packet_size);\n    /* 将接收的数据传递给上层协议 */\n    skb_put(skb,\
  \ packet_size);\n    netif_rx(skb);\n    /* ... */\n    /* 再次让描述符对卡可用 */\n    mydev_data->dma_buffer_rx[2]\
  \ |= FREE_FLAG;\n}\n\n/* 此函数在列表 10.3 中注册并从网络层调用 */\nstatic int\nmydevice_xmit(struct\
  \ sk_buff *skb, struct net_device *dev)\n{\n    /* 使用有效的 TX 描述符。查看图 10.2 */\n  \
  \  /* 为了简单起见省略了锁 */\n    if (mydev_data->dma_buffer_tx[2] & FREE_FLAG) {\n     \
  \   /* 使用第一个 TX 描述符 */\n        /* 在现实世界中，DMA 直接从 sk_buff 发生，你稍后会学！ */\n       \
  \ memcpy(mydev_data->dma_buffer_tx[24], skb->data, skb->len);\n        mydev_data->dma_buffer_tx[1]\
  \ = skb->len;\n        mydev_data->dma_buffer_tx[2] &= ~FREE_FLAG;\n        mydev_data->dma_buffer_tx[2]\
  \ |= INTERRUPT_FLAG;\n    } else if (mydev_data->dma_buffer_tx[5] & FREE_FLAG) {\n\
  \        /* 使用第二个 TX 描述符 */\n        memcpy(mydev_data->dma_buffer_tx[1560], skb->data,\
  \ skb->len);\n        mydev_data->dma_buffer_tx[4] = skb->len;\n        mydev_data->dma_buffer_tx[5]\
  \ &= ~FREE_FLAG;\n        mydev_data->dma_buffer_tx[5] |= INTERRUPT_FLAG;\n    }\
  \ else {\n        return –EIO; /* 向调用者信号错误 */\n    }\n}\n```\n\n\n\n\n\n```c\nwmb();\
  \ /* 不要跨越此屏障重排序写操作 */\n\n/* 请求网卡启动 DMA。ioaddr 定义在列表 10.3 中 */\noutl(INITIATE_XMIT,\
  \ ioaddr + CONTROL_REGISTER);\n\n}\n```\n\n当 CardBus 设备接收到以太网数据包时，它会将数据包 DMA 到空闲的\
  \ RX 描述符（descriptor）并中断 CPU。中断处理程序 `mydevice_interrupt()` 从接收 DMA 缓冲区收集数据包，将其拷贝到网络数据结构（`sk_buff`）中，并传递给上层协议层。\n\
  \n发送例程 `my_device_xmit()` 负责以反向启动 DMA。它将发送数据包 DMA 到网卡内存。为此，`my_device_xmit()` 会选择一个网卡未使用的\
  \ TX DMA 描述符（或 `FREE_FLAG` 被设置的描述符），并使用关联的发送缓冲区进行数据传输。`FREE_FLAG` 很快会被清除，表示该描述符现在属于网卡。当网卡在完成发送后断言中断时（未在列表\
  \ 10.6 中显示），描述符会在中断处理程序中释放（再次设置 `FREE_FLAG`）。\n\n此示例驱动程序使用了一种简化的缓冲区管理方案，该方案对性能不敏感。高速网络驱动程序会实现更复杂的方案，结合使用一致性（coherent）\
  \ DMA 映射和流（streaming） DMA 映射。它们维护发送和接收描述符的链表，并实现空闲和备用池以进行缓冲区管理。它们的接收和发送数据结构如下：\n\
  \n```c\n/* 接收缓冲区环形 */\nstruct rx_list {\n    void *dma_buffer_rx; /* 接收描述符的内核虚拟地址\
  \ */\n    dma_addr_t dma_bus_rx; /* 接收描述符的总线地址 */\n    unsigned int size; /* 缓冲区大小\
  \ */\n    struct list_head next_desc; /* 指向下一个元素的指针 */\n    struct sk_buff *skb;\
  \ /* 网络数据包 */\n    dma_addr_t sk_bus; /* 网络数据包的总线地址 */\n} *rxlist;\n\n/* 发送缓冲区环形\
  \ */\nstruct tx_list {\n    void *dma_buffer_tx; /* 发送描述符的内核虚拟地址 */\n    dma_addr_t\
  \ dma_bus_tx; /* 发送描述符的总线地址 */\n    unsigned int size; /* 缓冲区大小 */\n    struct list_head\
  \ next_desc; /* 指向下一个元素的指针 */\n    struct sk_buff *skb; /* 网络数据包 */\n    dma_addr_t\
  \ sk_bus; /* 网络数据包的总线地址 */\n} *txlist;\n```\n\n接收和发送 DMA 描述符（`rxlist->dma_buffer_rx`\
  \ 和 `txlist->dma_buffer_tx`）按照列表 10.5 所示进行一致性映射。然而，负载缓冲区（`rxlist->skb->data` 和 `txlist->skb->data`）使用的是流式\
  \ DMA 映射。接收缓冲区在设备打开时预分配并流式映射到空闲池中，而发送缓冲区则是即时映射的。这避免了 `mydevice_interrupt()` 从一致映射的接收\
  \ DMA 缓冲区到网络缓冲的额外数据拷贝（以及 `mydevice_xmit()` 在反向执行的额外拷贝）。\n\n```c\n/* 预分配/补充接收缓冲区。另见第\
  \ 15 节的“缓冲区管理与并发控制”部分 */\n/* ... */\nstruct sk_buff *skb = dev_alloc_skb();\nskb_reserve(skb,\
  \ NET_IP_ALIGN);\n\n/* 使用流式 DMA 映射 */\nrxlist->sk_bus = pci_map_single(pdev, rxlist->skb->data,\
  \ rxlist->skb->len, PCI_DMA_TODEVICE);\n/* 分配 DMA 描述符并填充上述映射的地址。将描述符添加到接收描述符环中 */\n\
  /* ... */\n```\n\n## 调试\n\n在内核配置菜单中启用 *Bus Options* -> *PCI Support* -> *PCI Debugging*，以请求\
  \ PCI 核心输出调试信息。探索 `/proc/bus/pci/devices` 和 `/sys/devices/pciX:Y/` 获取有关系统中 PCI 设备的信息，例如本章讨论的\
  \ CardBus 以太网调制解调器卡。`/proc/interrupts` 列出了系统上活跃的 IRQ，包括 PCI 层使用的 IRQ。\n\n如你所见，`lspci`\
  \ 收集了系统中所有 PCI 总线和设备的信息。你也可以用它来转储 PCI 卡的配置空间。PCI 总线分析器可以帮助调试底层问题并调整性能。\n\n## 查看源码\n\
  \nPCI 核心和总线访问例程位于 `drivers/pci/`。要获取 PCI 子系统提供的辅助例程列表，请在该目录内搜索 `EXPORT_SYMBOL`。关于\
  \ PCI 层的定义和原型，请查看 `include/linux/pci.h`。\n\n你可以在 `drivers/net/`、`drivers/scsi/`\
  \ 和 `drivers/video/` 的子目录下发现多个 PCI 设备驱动程序。要找到所有 PCI 驱动程序，可以递归搜索 `drivers/*` 树中的\
  \ `pci_register_driver()`。\n\n如果你没有找到开发自定义 PCI 网络驱动程序的良好起点，可以从骨架化的 PCI 网络驱动程序 `drivers/net/pci-skeleton.c`\
  \ 开始。关于 PCI 编程的简短教程，请查看 `Documentation/pci.txt`。关于 PCI API 的描述，请阅读 `Documentation/DMA-mapping.txt`。\n\
  \n### 表格 10.4 数据结构总结\n表 10.4 总结了本章使用的主要数据结构。\n\n### 表格 10.5 内核接口总结\n表 10.5 列出了本章使用的主要内核接口及其定义位置。\n\
  \n\n\n\n\n从 PCI 核心注销驱动程序。\n\n`pci_enable_device()`\n\n`drivers/pci/pci.c`\n\n请求底层\
  \ PCI 代码为此设备 `.*` 启用 I/O 和内存区域。\n\n`pci_disable_device()`\n\n`drivers/pci/pci.c`\n\
  \n`pci_enable_device()` 的反操作。\n\n`pci_set_master()`\n\n`drivers/pci/pci.c`\n\n将设备设置为\
  \ DMA 总线主模式。\n\n![](img/index-342_1.jpg)\n![](img/index-342_2.jpg)\n\n# 通用串行总\n\n\
  ## 本内容\n- USB 架构 (312)\n- Linux-USB 子系统 (317)\n- 驱动程序数据结构 (317)\n- 枚举 (324)\n- 设备示例：遥测卡\
  \ (324)\n- 类驱动程序 (338)\n- Gadget 驱动程序 (348)\n- 调试 (349)\n- 查看源码 (351)\n\n通用串行总 (USB)\
  \ 是当今计算机中事实上的外部总线。USB 由于支持热插拔、通用类驱动程序和多用途数据传输模式，是消费电子领域将多样化技术引入计算机系统的常规途径。其巨大的普及以及随之而来的规模经济在推动全球范围内计算机外设技术的采用和接受发挥了重要作用。\n\
  \n### USB 架构\nUSB 是一种主从协议，由主机控制器与客户端设备进行通信。图 11.1 显示了 PC 环境下的 USB。USB 主机控制器是南桥芯片组的一部分，通过\
  \ PCI 总线与处理器通信。图 11.2 展示了嵌入式设备上的 USB。图中的 SoC 内置了 USB 控制器硅，支持四种总线和三种工作模式：\n\n- **总线\
  \ 1** 运行在主机模式，通过 USB 收发器连接到 A 型插座（参见侧边栏“USB 插座与收发器”）。你可以向此端口连接 USB 优盘或键盘。\n- **总线\
  \ 2** 同样在主机模式下工作，但相关的收发器连接到内部 USB 设备而非插座。内部 USB 设备的示例包括生物识别扫描仪、加密引擎、打印机、`片上磁盘` (DOCs)、触摸控制器和遥测卡。\n\
  - **总线 3** 运行在设备模式，并通过收发器连接到 B 型插座。B 型插座通过 B 转 A 线连接到主机计算机。在这种模式下，嵌入式设备充当 USB 优盘，向外部导出存储分区。相对于\
  \ PC 系统，MP3 播放器和手机等嵌入式设备位于 USB 设备端，因此许多嵌入式 SoC 除了主机控制器外还支持 USB 设备控制器。\n- **总线 4**\
  \ 由 `On-The-Go` (OTG) 控制器驱动。你可以使用此端口例如将优盘连接到你的系统，或者将你的系统变成优盘并连接到主机。与总线 1 到 3 不同，总线\
  \ 4 使用智能收发器，通过 `I2C` 与处理器交换控制信息。该收发器连接到 Mini-AB OTG 插座。如果两个嵌入式设备都支持 OTG，它们可以在没有主机计算机干预的情况下直接通信。\n\
  \n本章的大部分内容是从 USB 主机侧的角度编写的。我们在“Gadget 驱动程序”节中简要介绍设备功能。主流的`主机控制器驱动程序` (HCDs) 已经可用，因此在本章中，我们进一步限制于\
  \ USB 设备驱动程序（也称为 `客户端驱动程序`）。\n\n**图 11.1 PC 环境下的 USB。**\n\n### USB 插座与收发器\nUSB 主机使用四脚\
  \ A 型矩形插座，而 USB 设备通过四脚 B 型正方形插座连接。在两种情况下，四个引脚分别为差分数据信号 `D+` 和 `D-`、电压线 `VBUS` 和地线。`VBUS`\
  \ 用于从 USB 主机向 USB 设备供电。因此，`VBUS` 在 A 连接器上拉高，但在 B 连接器上接收电源。USB OTG 控制器连接到五脚 Mini-AB\
  \ 矩形插座，外形更小。Mini-AB 的四个引脚与我们之前讨论的相同；第五个是 `ID` 引脚，用于检测连接的外设是主机还是设备。\n\n相同的收发器芯片（例如德州仪的\
  \ `TUSB1105`）可以用于 USB 主机和设备。因此，你可以选择在图 11.2 的总线 1 到 3 上使用相同的收发器部件。然而，OTG 需要特殊的收发器芯片（例如飞利浦半导体的\
  \ `ISP1301`）。\n\n**图 11.2 嵌入式系统上的 USB。**\n\n### 总线速度\nUSB 支持三种速度。原始 USB 1.0 规范支持\
  \ 1.5MBps，称为低速 USB。USB 1.1 是规范的下一个版本，处理 12MBps，称为全速 USB。目前的规范是 USB 2.0，它支持 480MBps，或高速\
  \ USB。如今的 PC 系统符合 USB 2.0 标准并允许所有目标速度，但某些嵌入式控制器遵循 USB 1.1，仅支持全速和低速工作模式。\n\n### 主机控制器\n\
  USB 主机控制器符合几种标准之一：\n\n- **通用主机控制器接口 (UHCI)**：UHCI 规范由英特发起，因此你的 PC 可能具有这种控制器。\n-\
  \ **开放主机控制器接口 (OHCI)**：OHCI 规范源于康贝和微软等公司。兼容 OHCI 的控制器在硬件中内置了比 UHCI 更智能的功能，因此 OHCI\
  \ HCD 相对 UHCI HCD 更简单。\n- **增强主机控制器接口 (EHCI)**：这是支持高速 USB 2.0 设备的主机控制器。EHCI 控制器通常配有一个\
  \ UHCI 或 OHCI 辅助控制器来处理较的设备。\n- **USB OTG 控制器**：它们越来越多出现在嵌入式微控制器中。支持 OTG 的每个通信端都可以作为*双角色设备*\
  \ (DRD)。通过`主机协商协议 (HNP)`启动对话，DRD 可以根据所需的功能切换到主机模式或设备模式。\n\n除了这些主流 USB 主机控制器外，Linux\
  \ 还支持更多控制器。例如用于 `ISP116x` 芯片的 HCD。\n\n### 传输类型\n与 USB 设备之间的数据交换可以是四种类型之一：\n\n- 控制传输，用于携带配置和控制信息\n\
  - 批量传输，用于传输大量对时间不敏感的数据\n- 中断传输，用于交换少量对时间敏感的数据\n\n\n\n\n\n-   用于具有可预测比特率的实时数据的等时传输。\n\
  \n例如，USB 存储驱动器使用控制传输来发布磁盘访问命令，并使用批量传输来交换数据。键盘使用中断传输在可预测的延迟内传输按键值。需要实时流传输音频数据的设备使用等时传输。关于\
  \ USB 设备四种传输类型的职责将在第 16 章《没有无线的 Linux》中的“设备示例：USB 适配器”节中讨论。\n\n## 端点 (Endpoints)\n\
  \nUSB 设备中的每个可寻址单元被称为 `endpoint`（端点）。分配给端点的地址称为 `endpoint address`（端点地址）。每个端点地址都有关联的数据传输类型。例如，如果一个端点负责批量数据传输，则它被称为\
  \ `bulk`（批量）端点。端点地址 `0` 专门用于设备配置。该端点上接有一个控制管道，用于设备枚举（见参见“枚举”节）。\n\n端点可以与上行或下行数据传输关联。从设备到达上行的数据称为\
  \ `IN` 传输，而流向设备的下行数据是 `OUT` 传输。`IN` 和 `OUT` 传输拥有独立的地址空间。因此，你可以有一个响应相同地址的 `bulk IN`\
  \ 端点 `bulk OUT` 端点。\n\n如表 11.1 所示，USB 在某些方面类似于 I2C，在其他方面类似于 PCI。USB 设备寻址类似于 I2C，但它支持像\
  \ PCI 一样的热插拔。USB 设备地址像标准 I2C 一样不占用 CPU 地址空间的一部分。相反，它们位于 1 到 127 的私有空间内。\n\n### 表\
  \ 11.1 USB 与 I2C 和 PCI 的相似之处\n\nUSB 与 I2C 的相似之处：\n- USB 和 I2C 都是主从协议。\n- 设备地址存在于私有的\
  \ 7 位空间内。\n- 设备驻内存未映射到 CPU 的内存或 I/O 空间，因此它不消耗 CPU 资源。\n\nUSB 与 PCI 的相似之处：\n- 设备可以热插拔。\n\
  - 设备驱动程序架构类似于 PCI 驱动程序。这两类驱动程序都拥有 `probe()`/`disconnect()` 方法以及识别它们支持设备的 ID 表。（注意：在\
  \ PCI 术语中，`disconnect()` 被称为 `remove()`。）\n- 支持高速。但速度比 PCI 慢。请参第 10 章《外围组件互连》中的表\
  \ 10.1 获取 PCI 家族不同成员支持的速度。\n- USB 主控制器像 PCI 控制器一样，通常内置了可以主控线的 DMA 引擎。\n- 支持多功能设备。USB\
  \ 支持每个功能一个接口描述符。每个 PCI 设备功能都有自己的设备 ID 和配置空间。\n\n## Linux-USB 子系统\n\n查看图 11.3 以理解\
  \ Linux-USB 子系统的架构。该子系统的组成部分如下：\n\n- **USB 核心 (USB core)**。与你在之前的章节中看到的驱动程序子系统的核心层类似，USB\
  \ 核心是一个由可供 `HCDs` 和客户端驱动程序使用的例程和结构组成的代码库。核心还提供了一种指示，使用客户端驱动程序独立于主机控制器。\n- 驱动不同主机控制器的\
  \ **HCDs**。\n- 用于根集线器（以及物理集线器）的**集线器驱动程序 (hub driver)** 以及监控所有连接到集线器端口的辅助内核线程 `khubd`。检测端口状态变化和配置热插拔设备是耗时的，由于你在第\
  \ 3 章《内核设施》中学到的原因，最好使用辅助线程来完成。`khubd` 线程默认处于睡眠状态。每当集线器驱动程序检测到连接的 USB 端口状态变化时，就会唤醒\
  \ `khubd`。\n- 用于 USB 客户端设备的**设备驱动程序 (Device drivers)**。\n- **USB 文件系统** `usbfs`，它允许你从用户空间驱动\
  \ USB 设备。我们将在第 19 章《用户空间中的驱动程序》中讨论用户态 USB 驱动程序。\n\n为了端到端操作，USB 子系统调用其他内核层寻求协助。例如，支持\
  \ USB 存储设备时，USB 子系统与 SCSI 协同工作如图 11.3 所示。驱动 USB 蓝牙时相关者有四个：USB 子系统、蓝牙层。\n\n## usb_device\
  \ 结构\n\n每个设备驱动程序都依赖一个特殊数据结构在内部表示设备。`usb_device` 结构对于 USB 子系统，就像 `pci_dev` 之于 PCI\
  \ 层，`net_device` 之于网络层。`usb_device` 结构在 `include/usb.h` 中定义如下：\n\n```c\nstruct usb_device\
  \ {\n    /* ... */\n    enum device_state state;\n    /* ... */\n    struct usb_device\
  \ *parent;\n    /* ... */\n    struct device_descriptor descriptor;\n    /* ...\
  \ */\n    struct host_config *config;\n    /* ... */\n    int maxchild;\n    struct\
  \ usb_device *children[USB_MAXCHILDREN];\n    /* ... */\n};\n```\n我们在开发 USB 示例驱动程序时使用该结构。\n\
  \n## USB 请求块\n\n`USB Request Block` (URB) 是 USB 传输机制的核心。URB 对于 USB 栈，就像 `sk_buff`（于第\
  \ 15 章“网络接口卡”）对于网络栈一样。让我们看看 URB 内部。以下定义来自 `include/usb.h`，省略了设备驱动程序特别感兴趣的字段：\n\n\
  ```c\nstruct urb {\n    struct kref kref;\n    /* ... */\n    struct usb_device\
  \ *dev;\n    unsigned int pipe;\n    int status;\n    unsigned int transfer_flags;\n\
  \    void *transfer_buffer;\n    dma_addr_t transfer_dma;\n    int transfer_buffer_length;\n\
  \    /* ... */\n    unsigned char *setup_packet;\n    /* ... */\n    int interval;\n\
  \    /* ... */\n    void *context;\n    usb_complete_t complete;\n    /* ... */\n\
  };\n```\n使用 URB 有三个步骤：创建、填充和提交。创建 URB 时使用 `usb_alloc_urb()`。该函数分配并清零 URB 内存，初始化与\
  \ URB 关联的 kobject，并初始化自旋锁来保护 URB。填充 URB 时使用 USB 核心提供的以下辅助例程：\n\n```\nvoid usb_fill_[control|int|bulk]_urb(\n\
  \    struct urb *urb,\n    struct usb_device *usb_dev,\n    unsigned int pipe,\n\
  \    unsigned char *setup_packet,\n    void *transfer_buffer,\n    int buffer_length,\n\
  \    usb_complete_t completion_fn,\n    void *context,\n    int interval);\n```\n\
  \n\n\n\n当我们稍后开发示例驱动程序时，之前的例程语义将变得更加清晰。这些辅助程序用于控制、中断和批量 URB，但不能用于等时（isochronous）URB。\n\
  \n要提交一个数据传输 URB，请使用 `usb_submit_urb()`。URB 的提交是异步的。之前列出的 `usb_fill_[control|int|bulk]_urb()`\
  \ 函数接受回调函数的地址作为参数。回调程序在 URB 提交完成后执行，完成诸如检查提交状态和释放数据传输缓冲区等任务。\n\nUSB 核心还提供了封装接口，提供了同步\
  \ URB 提交的伪界面支持：\n\n```\nint usb_[control|interrupt|bulk]_msg(struct usb_device *usb_dev,\
  \ unsigned int pipe, ...);\n```\n\n## 驱动数据结构\n\n例如，`usb_bulk_msg()` 会构建一个批量 URB，提交它，并阻塞直到操作完成。你不需要提供回调函数，因为一个通用的完成例程会实现该目的。你也不需要显式地创建和填充\
  \ URB，因为 `usb_bulk_msg()` 会替你完成这些工作且无需额外代价。我们将在示例驱动程序中使用此接口。\n\n`usb_free_urb()`\
  \ 用于释放已完成 URB 的引用，而 `usb_unlink_urb()` 则取消悬挂的 URB 操作。\n\n如第 4 章“奠定基础”中“Sysfs, Kobjects\
  \ and Device Classes”章节所示，URB 包含一个 `kref` 对象来跟踪其引用。`usb_submit_urb()` 使用 `kref_get()`\
  \ 增加引用计数。`usb_free_urb()` 使用 `kref_put()` 减少引用计数，并仅在没有剩余引用时才执行释放操作。\n\nURB 与名为 `pipe`（管道）的抽象关联，我们接下来将讨论它。\n\
  \n### 管道 (Pipes)\n\n管道是以下组合的整数编码：\n* 端点地址\n* 数据传输的方向（IN 或 OUT）\n* 数据传输的（控制、中断、批量或等时）\n\
  \n管道是每个 USB 数据传输的地址元素，是 URB 结构中的一个重要字段。为了帮助填充该字段，USB 核心提供了以下辅助宏：\n\n```\nusb_[rcv|snd][ctrl|int|bulk|isoc]pipe(struct\
  \ usb_device *usb_dev, __u8 endpointAddress);\n```\n\n其中 `usb_dev` 是指向关联的 `usb_device`\
  \ 结构的指针，`endpointAddress` 是在 1 到 127 之间分配的端点地址。例如，创建一个 OUT 方向的批量管道，调用 `usb_sndbulkpipe()`。对于\
  \ IN 方向的控制管道，调用 `usb_rcvctrlpipe()`。\n\n在引用 URB 时，通常会通过关联管道的传输类型进行限定。例如，如果 URB 附加到批量管道上，则它被称为\
  \ `批量 URB`。\n\n### 描述符结构 (Descriptor Structures)\n\nUSB 规范定义了一系列描述符（descriptors）来用于存储设备信息。Linux-USB\
  \ 核心定义了与每个描述符对应的数据结构。描述符有四种类型：\n* `Device descriptors` 设备描述符：包含通用信息，如设备的产 ID（product\
  \ ID）和厂商 ID（vendor ID）。`usb_device_descriptor` 是对应设备描述符的结构。\n* `Configuration descriptors`\
  \ 配置描述符：用于描述不同的配置模式，例如总供电和自供电操作。`usb_config_descriptor` 是与配置描述符关联的数据结构。\n* `Interface\
  \ descriptors` 接口描述符：允许 USB 设备支持多个功能。`usb_interface_descriptor` 定义了接口描述符。\n* `Endpoint\
  \ descriptors` 端点描述符：带有与设备最终端点相关的信息。`usb_endpoint_descriptor` 是所述结构。\n\n这些描述符格式定义在\
  \ USB 规范的第 9 章，而相应的结构定义在 `include/linux/usb/ch9.h` 中。列表 11.1 显示了描述符的层级拓扑，并打印了与 USB\
  \ 设备关联的所有端点地址。为此，它遍历了由前述四类描述符组成的树。以下是列表 11.1 针对 USB 光驱驱动器生成的输出：\n\n```\nEndpoint\
  \ Address = 1\nEndpoint Address = 82\nEndpoint Address = 83\n```\n\n第一个地址属于一个批量\
  \ IN 端点，第二个地址由批量 OUT 端点所有，第三个地址指向中断 IN 端点。\n\n还有更多与 USB 客户端驱动关联的数据结构，例如 `usb_device_id`、`usb_driver`\
  \ 和 `usb_class_driver`。我们将在“设备示例：遥测卡”章节的实战开发中遇到它们。\n\n#### 列表 11.1 打印设备上所有的 USB\
  \ 端点地址\n\n```c\n/* ... */\n/* USB device */\nstruct usb_device *udevice;\n/* ...\
  \ */\nstruct usb_device_descriptor u_d_desc = udevice->descriptor;\n/* 设备的激活配置 */\n\
  struct usb_host_config *uconfig;\nstruct usb_config_desriptor u_c_desc;\n/* 激活配置中的接口\
  \ */\nstruct usb_interface *uinterface;\n/* 此接口的备用设置 */\nstruct usb_host_interface\
  \ *ualtsetting;\nstruct usb_interface_descriptor u_i_desc;\n/* 此备用设置的端点 */\nstruct\
  \ usb_endpoint *uendpoint;\nstruct usb_endpoint_descriptor u_e_desc;\n\nuconfig\
  \ = udevice->actconfig;\n/* 描述符 */\nu_c_desc = uconfig->desc;\nfor (i = 0; i < u_c_desc.bNumInterfaces;\
  \ i++) {\n    uinterface = uconfig->interface[i];\n    /* 配置 */\n    for (j = 0;\
  \ j < uinterface->bNumAltSettings; j++) {\n        ualtsetting = &uinterface->altsetting[j];\n\
  \        /* 接口 */\n        u_i_desc = ualtsetting->desc;\n        for (k = 0; k\
  \ < u_i_desc.bNumEndpoints; k++) {\n            uendpoint = &ualtsetting->endpoint[k];\n\
  \            /* 端点 */\n            u_e_desc = uendpoint->desc;\n            printk\
  \ (\"Endpoint Address = %d\\n\", u_e_desc.bEndpointAddress);\n        }\n    }\n\
  }\n/* ... */\n```\n\n### 枚举 (Enumeration)\n\n热插设备的生命始于称为*枚举*的过程，通过该过程主机了解设备能力并对其进行配置。驱动程序是\
  \ Linux-USB 子系统中负责枚举的组件。让我们看看插入优盘时实现设备枚举的步骤序列：\n\n1. 根集线器由于设备接入导致电流变化。驱动程序检测到这种状态变化，在\
  \ Linux-USB 术语中称为 `USB_PORT_STAT_C_CONNECTION`，并唤醒 khubd。\n2. khubd 识别遭受状态变化的 USB\
  \ 端口身份。在这种情况下，它是你插入优盘的端口。\n3. 接下来，khubd 选择一个 1 到 127 之间的设备地址，并使用附加到端点 0 上的控制 URB\
  \ 分配给优盘。\n4. khubd 使用上述附加到端点 0 上的控制 URB 从优盘获取设备描述符。然后它请求设备的配置描述符并选择一个合适的配置。在优盘的情况下，仅提供一个配置描述符。\n\
  5. khubd 请求 USB 核心将匹配的客户端驱动程序绑定到插入的设备。\n\n枚举完成且设备绑定到驱动程序后，khubd 调用关联的客户端驱动程序的 `probe()`\
  \ 方法。在这种情况下，khubd 调用定义在 *drivers/usb/storage/usb.c* 中的 `storage_probe()`。从现在开始，块存储驱动程序负责正常的设备操作。\n\
  \n### 设备示例：遥测卡\n\n现在你已经了解了 Linux-USB 的基础知识，是时候看一个示例设备了。考虑一个配备了遥测卡的系统，该卡通过内部 USB\
  \ 连接到处理器，如图 11.2 所示。该卡从远程设备获取数据并通过 USB 传输到处理器。一个示例遥测卡是一个介\n\n\n\n\n用于监控或对植入式设备进行编程的卡。\n\
  \n假设我们的示例遥测卡具有以下端点，其语义如表 11.2 所示：\n\n### 设备示例：遥测卡\n\n- 一个连接到卡上配置寄存器的控制端点。\n- 一个批量\
  \ IN（bulk IN），用于将卡采集的远程遥测信息传递给处理器。\n- 一个批量 OUT（bulk OUT），用于向反方向传输数据。\n\n#### 表 11.2\
  \ 遥测卡中的寄存器空间\n\n| 寄存器 | 关联端点 |\n| :--- | :--- |\n| 遥测配置寄存器 | 控制端点 0（寄存器偏移 `0xA`）。\
  \ |\n| 遥测数据输入寄存器 | 批量 IN 端。端点地址在设备枚举期间分配。 |\n| 遥测数据输出寄存器 | 批量 OUT 端。端点地址在设备枚举期间分配。\
  \ |\n\n我们将部分基于 USB 骨架驱动 `/drivers/usb/usb-skeleton.c` 为此卡构建一个最小驱动程序。*\n\n由于 PCMCIA、PCI\
  \ 和 USB 设备具有热插拔支持等相似特性，属于这些子系统的某些驱动方法和数据结构彼此非常相似。这在负责初始化和探测的部分尤其为如此。当我们继续研究遥测驱动程序并注意到它与我们在第\
  \ 10 章中学习的 PCI 驱动之间的相似之处时，我们将停下来并留意。\n\n## 初始化与探测\n\n像 PCI 和 PCMCIA 驱动一样，USB 驱动具有\
  \ `probe()`/`disconnect()` 方法以支持热插拔，并有一个包含它们支持的设备标识的表格。\n\nUSB 设备通过在 `include/linux/mod_devicetable.h`\
  \ 中定义的 `usb_device_id` 结构识别。你可能记得上一个章节提到，定义在同一头文件中 `pci_device_id` 结构用于识别 PCI 设备。\n\
  \n```c\nstruct usb_device_id {\n  /* ... */\n  __u16 idVendor; /* 厂商 ID */\n  __u16\
  \ idProduct; /* 设备 ID */\n  /* ... */\n  __u8 bDeviceClass; /* 设备类 */\n  __u8 bDeviceSubClass;\
  \ /* 设备子类 */\n  __u8 bDeviceProtocol; /* 设备协议 */\n  /* ... */\n};\n```\n\n`idVendor`\
  \ 和 `idProduct` 分别持有厂商 ID 和产品 ID，而 `bDeviceClass`、`bDeviceSubClass` 和 `bDeviceProtocol`\
  \ 根据其功能对设备进行分类。这种由 USB 规范的分类允许在后续“类驱动程序”章节中讨论的通用客户端驱动的实现。\n\n列表 11.2 实现了遥测驱动的初始化程序\
  \ `usb_tele_init()`，它调用 `usb_register()` 将 `usb_driver` 结构注册到 USB 核心。如列表所示，`usb_driver`\
  \ 将驱动的 `probe()` 方法、`disconnect()` 方法和 `usb_device_id` 表结合在一起。`usb_driver` 与 `pci_driver`\
  \ 类似，区别在前者的 `disconnect()` 方法在后者中命名为 `remove()`。\n\n#### 列表 11.2 初始化驱动\n\n```c\n\
  #define USB_TELE_VENDOR_ID 0xABCD /* 厂商 ID */\n#define USB_TELE_PRODUCT_ID 0xCDEF\
  \ /* 设备产品 ID */\n/* 指定此驱动支持的设备的 USB ID 表 */\nstatic struct usb_device_id tele_ids[]\
  \ = {\n  { USB_DEVICE(USB_TELE_VENDOR_ID, USB_TELE_PRODUCT_ID) },\n  { } /* 终止 */\n\
  };\nMODULE_DEVICE_TABLE(usb, tele_ids);\n/* 此驱动的 usb_driver 结构 */\nstatic struct\
  \ usb_driver tele_driver\n{\n  .name = \"tele\", /* 唯一名称 */\n  .probe = tele_probe,\
  \ /* 见列表 11.3 */\n  .disconnect = tele_disconnect, /* 见列表 11.3 */\n  .id_table =\
  \ tele_ids, /* 见上文 */\n};\n/* 模块初始化 */\nstatic int __init\nusb_tele_init(void)\n\
  {\n  /* 注册到 USB 核心 */\n  result = usb_register(&tele_driver);\n  /* ... */\n  return\
  \ 0;\n}\n/* 模块退出 */\nstatic void __exit\nusb_tele_exit(void)\n{\n  /* 从 USB 核心注销\
  \ */\n  usb_deregister(&tele_driver);\n  return;\n}\nmodule_init(usb_tele_init);\n\
  module_exit(usb_tele_exit);\n```\n\n`USB_DEVICE()` 宏根据其提供的厂商 ID 和产品 ID 创建 `usb_device_id`。这类似于比上一个章节中讨论的\
  \ `PCI_DEVICE()` 宏。`MODULE_DEVICE_TABLE()` 宏在模块镜像中标记 `tele_ids`，以便当卡被热插拔时，可以按需加载模块。这与我们在前两个章节中讨论的\
  \ PCMCIA 和 PCI 设备再次相似。\n\n当 USB 核心检测到属性与客户端驱动程序所属的 `usb_device_id` 表中声明的属性匹配的设备时，它会调用该驱动注册的\
  \ `probe()` 方法。当设备被拔出或模块被卸载时，USB 核心会调用驱动的 `disconnect()` 方法。\n\n列表 11.3 实现了遥测驱动的\
  \ `probe()` 和 `disconnect()` 方法。它首先定义了一个特定于设备的结构 `tele_device_t`，该结构包含：\n\n- 指向关联的\
  \ `usb_device` 的指针。\n- 指向 `usb_interface` 的指针。\n- 一个用于与遥测器通信的控制 URB (`ctrl_urb`)，以及用于构建请求的\
  \ `ctrl_req`。\n- 卡有一个批量 IN 端点，你可以从中获取信息。与该端点相关的三个字段：`bulk_in_addr`（端点地址）、`bulk_in_buf`（数据缓冲区）和\
  \ `bulk_in_len`（缓冲区大小）。\n- 卡有一个批量 OUT 端点用于向下数据传输。`tele_device_t` 有一个名为 `bulk_out_addr`\
  \ 的字段用于存储该端点的地址。OUT 方向的数据结构较少，因为在这个简单案例中我们使用了同步 URB 提交接口。\n\nUSB 核心在枚举后立即调用卡的 `probe()`\
  \ 方法 `tele_probe()`。`tele_probe()` 执行三个任务：\n\n1. 为特定设备结构 `tele_device_t` 分配内存。\n\
  2. 初始化 `tele_device_t` 中与设备批量端点相关的字段：`bulk_in_buf`、`bulk_in_len`、`bulk_in_addr`\
  \ 和 `bulk_out_addr`。为此，它使用了驱动程序在枚举期间采集的数据。这些数据在“描述符结构”章节中讨论。\n3. 向用户空间导出字符设备 `/dev/tele*`。应用程序通过\
  \ `/dev/tele*` 与遥测卡交换数据。`tele_probe()` 调用 `usb_register_dev()` 并向其提供通过 `usb_class_driver`\
  \ 结构形成的底层 `file_operations`。\n\n在步骤 1 中分配的结构地址必须被保存，以便其他方法可以访问它。为了实现这一点，遥测驱动根据各种驱动程序可用的参数使用了三种策略。为了在\
  \ `probe()` 和 `open()` 调用线程之间保存此结构指针，驱动通过 `usb_set_intfdata()` 和 `usb_get_intfdata()`\
  \ 函数对使用设备的 `driver_data` 字段。为了在 `open()` 线程和其他入口之间保存结构指针地址，`open()`将其存储在 `/dev/tele*`\
  \ 的 `file->private_data` 字段中。这是因为内核向这些字符入口提供的是 `/dev/tele*` 的 `inode` 指针，而不是 `usb_interface`\
  \ 指针。为了从 URB 回调函数中获取特定设备结构的地址，相关的提交线程使用 URB 的 `context` 字段作为存储区域。\n\n所有 USB 字符设备都响应主设备\
  \ 180。如果你启用了 CONFIG_\n\n\n\n\n在内核配置期间，如果启用 `USB_DYNAMIC_MINORS`，USB 核心将从可用池中动态选择一个从设备号。这种行为类似于在\
  \ `miscdevice` 结构体中指定 `MISC_DYNAMIC_MINOR` 后注册杂项驱动程序（参见第 5 章“字符驱动程序”中的“杂项驱动”节）。如果你选择不启用\
  \ `CONFIG_USB_DYNAMIC_MINORS`，USB 子系统将从 `usb_class_driver` 结构体中设置的主设备号开始选择可用从设备号。\n\
  \n### 列表 11.3 探测与断开\n\n```c\n/* 设备特定结构体 */\ntypedef struct {\n    struct usb_device\
  \ *usbdev; /* 设备表示 */\n    struct usb_interface *interface; /* 接口表示*/\n    struct\
  \ urb *ctrl_urb; /* 用于寄存器访问的控制 URB */\n    struct usb_ctrlrequest ctrl_req; /* 符合的控制请求\
  \ */\n    unsigned char *bulk_in_buf; /* 接收数据缓冲区 */\n    size_t bulk_in_len; /*\
  \ 接收缓冲区大小 */\n    __u8 bulk_in_addr; /* IN 端点地址 */\n    __u8 bulk_out_addr; /* OUT\
  \ 端点地址 */\n    /* ... */ /* 锁、等待队列、统计信息.. */\n} tele_device_t;\n\n#define TELE_MINOR_BASE\
  \ 0xAB /* 由 Linux-USB 子系统维护者分配 */\n\n/* 常规字符驱动入口点。\n参见第 5 章“字符驱动程序”。 */\nstatic\
  \ struct file_operations tele_fops = {\n    .owner = THIS_MODULE, /* 所有者 */\n  \
  \  .read = tele_read, /* 读取方法 */\n    .write = tele_write, /* 写入方法 */\n    .ioctl\
  \ = tele_ioctl, /* Ioctl 方法 */\n    .open = tele_open, /* 打开方法 */\n    .release\
  \ = tele_release, /* 关闭方法 */\n};\n\nstatic struct usb_class_driver tele_class =\
  \ {\n    .name = \"tele\",\n    .fops = &tele_fops, /* 与 /dev/tele* 关联 */\n    .minor_base\
  \ = TELE_MINOR_BASE, /* 从设备号起始 */\n};\n```\n\n`probe()` 方法在设备枚举后由 `khubd` 调用。第一个参数\
  \ `interface` 包含了在枚举过程中收集的信息。`id` 是驱动程序 `usb_device_id table` 中与从遥测卡读取的值匹配的项。`tele_probe()`\
  \ 基于在 `drivers/usb/usb-skeleton.c` 中定义的 `skel_probe()`。\n\n```c\nstatic int\ntele_probe(struct\
  \ usb_interface *interface, const struct usb_device_id *id)\n{\n    struct usb_host_interface\
  \ *iface_desc;\n    struct usb_endpoint_descriptor *endpoint;\n    tele_device_t\
  \ *tele_device;\n    int retval = -ENOMEM;\n\n    /* 分配设备特定结构体 */\n    tele_device\
  \ = kzalloc(sizeof(tele_device_t), GFP_KERNEL);\n\n    /* 填充 usb_device 和 usb_interface\
  \ */\n    tele_device->usbdev = usb_get_dev(interface_to_usbdev(interface));\n \
  \   tele_device->interface = interface;\n\n    /* 根据设备枚举期间收集的数据设置端点信息 */\n    iface_desc\
  \ = interface->cur_altsetting;\n    for (int i = 0; i < iface_desc->desc.bNumEndpoints;\
  \ ++i) {\n        endpoint = &iface_desc->endpoint[i].desc;\n        if (!tele_device->bulk_in_addr\
  \ && usb_endpoint_is_bulk_in(endpoint)) {\n            /* Bulk IN 端点 */\n      \
  \      tele_device->bulk_in_len = le16_to_cpu(endpoint->wMaxPacketSize);\n     \
  \       tele_device->bulk_in_addr = endpoint->bEndpointAddress;\n            tele_device->bulk_in_buf\
  \ = kmalloc(tele_device->bulk_in_len, GFP_KERNEL);\n        }\n        if (!tele_device->bulk_out_addr\
  \ && usb_endpoint_is_bulk_out(endpoint)) {\n            /* Bulk OUT 端点 */\n    \
  \        tele_device->bulk_out_addr = endpoint->bEndpointAddress;\n        }\n \
  \   }\n\n    if (!(tele_device->bulk_in_addr && tele_device->bulk_out_addr)) {\n\
  \        return retval;\n    }\n\n    /* 将设备特定结构体附加到此接口。\n    我们将从 tele_open() 中获取它\
  \ */\n    usb_set_intfdata(interface, tele_device);\n\n    /* 注册设备 */\n    retval\
  \ = usb_register_dev(interface, &tele_class);\n    if (retval) {\n        usb_set_intfdata(interface,\
  \ NULL);\n        return retval;\n    }\n    printk(\"Telemetry device now attached\
  \ to /dev/tele\\n\");\n    return 0;\n}\n\n/* 断开方法。当设备拔出或模块卸载时调用 */\nstatic void\n\
  tele_disconnect(struct usb_interface *interface)\n{\n    tele_device_t *tele_device;\n\
  \    /* ... */\n    /* 在 tele_probe() 中调用的 usb_set_intfdata() 的反操作 */\n    tele_device\
  \ = usb_get_intfdata(interface);\n    /* 清空接口数据 */\n    usb_set_intfdata(interface,\
  \ NULL);\n    /* 释放 /dev/tele* */\n    usb_deregister_dev(interface, &tele_class);\n\
  \     /* 将接口置空。在现实世界中使用锁保护此操作 */\n    tele_device->interface = NULL;\n}\n```\n\n\
  ### 访问寄存器\n\n`open()` 方法初始化卡上的遥测寄存器。为了设置配置，`tele_open()` 会提交一个 URB。在浏览列表之前，请再次查看\
  \ 11.3 中定义的 `tele_device_t` 结构体，关注两个字段：`ctrl_urb` 和 `ctrl_req`。前者用于与配置寄存器通信的 URB，而后者是\
  \ `usb_ctrlrequest`。\n\n为了编程配置寄存器，`tele_open()` 执行以下操作：\n1. 分配一个控制 URB 以准备写入寄存器。\n\
  2. 创建一个 `usb_ctrlrequest` 并填充请求标识符、类型、寄存器偏移量和要编程的值。\n3. 创建一个连接到遥测卡端点 0 的控制管道以携带控制\
  \ URB。\n4. 因为 `tele_open()` 是异步提交 URB 的，它需要在返回给调用者之前等待关联的回调函数完成。为此，`tele_open()`\
  \ 使用 `init_completion()` 调用内核的完成 API 协助。步骤 7 调用匹配的 `wait_for_completion()`，它将等待直到回调函数调用\
  \ `complete()`。\n5. 使用 `usb_fill_control_urb()` 初始化控制 URB 中的字段。这包括在步骤 2 中填充的 `usb_ctrlrequest`。\n\
  6. 使用 `usb_submit_urb()` 将 URB 提交给 USB 核心。\n7. 等待直到回调函数信号寄存器编程完成。\n8. 返回状态。\n\n\
  ### 列表 11.4 初始化遥测配置寄存器\n\n```c\n/* 遥测配置寄存器在卡上寄存器空间中的偏移量 */\n#define TELEMETRY_CONFIG_REG_OFFSET\
  \ 0x0A\n\n/* 编程到配置寄存器的值 */\n#define TELEMETRY_CONFIG_REG_VALUE 0xBC\n\n/* 用于编程配置寄存器的厂商定义\
  \ bRequest */\n#define TELEMETRY_REQUEST_WRITE 0x0D\n\n/* 厂商定义的 bRequestType */\n\
  #define TELEMETRY_REQUEST_WRITE_REGISTER 0x0E\n\n/* 打开方法 */\nstatic int tele_open(struct\
  \ inode *inode, struct file *file)\n{\n    struct completion tele_config_done;\n\
  }\n```\n\n\n\n\n```c\ntele_device_t *tele_device;\n\nvoid *tele_ctrl_context;\n\n\
  char *tmp;\n\n__le16 tele_config_index = TELEMETRY_CONFIG_REG_OFFSET;\n\n334 Chapter\
  \ 11 Universal Serial Bus\n\nunsigned int tele_ctrl_pipe;\n\nstruct usb_interface\
  \ *interface;\n\n/* 获取设备特定结构体的指针。\n\n我们在 tele_probe() 中通过 usb_set_intfdata() 保存了它。\
  \ */\ninterface = usb_find_interface(&tele_driver, iminor(inode));\ntele_device\
  \ = usb_get_intfdata(interface);\n\n/* 为控制传输分配一个 URB */\ntele_device->ctrl_urb =\
  \ usb_alloc_urb(0, GFP_KERNEL);\nif (!tele_device->ctrl_urb) {\n    return -EIO;\n\
  }\n/* 填充控制请求 */\ntele_device->ctrl_req.bRequestType = TELEMETRY_REQUEST_WRITE;\n\
  tele_device->ctrl_req.bRequest =\nTELEMETRY_REQUEST_WRITE_REGISTER;\ntele_device->ctrl_req.wValue\
  \ =\ncpu_to_le16(TELEMETRY_CONFIG_REG_VALUE);\ntele_device->ctrl_req.wIndex =\n\
  cpu_to_le16p(&tele_config_index);\ntele_device->ctrl_req.wLength = cpu_to_le16(1);\n\
  tele_device->ctrl_urb->transfer_buffer_length = 1;\ntmp = kmalloc(1, GFP_KERNEL);\n\
  *tmp = TELEMETRY_CONFIG_REG_VALUE;\n\n/* 创建连接到端点 0 的控制管道 */\ntele_ctrl_pipe = usb_sndctrlpipe(tele_device->usbdev,\
  \ 0);\n\n/* 初始化完成机制 */\ninit_completion(&tele_config_done);\n/* 设置 URB 上下文。上下文是\
  \ URB 的一部分，将作为参数传递给回调函数。在这种情况下，\n上下文是完成结构体，tele_config_done */\ntele_ctrl_context\
  \ = (void *)&tele_config_done;\n/* 初始化控制 URB 中的字段 */\nusb_fill_control_urb(tele_device->ctrl_urb,\
  \ tele_device->usbdev,\ntele_ctrl_pipe,\n(char *) &tele_device->ctrl_req,\ntmp,\
  \ 1, tele_ctrl_callback,\ntele_ctrl_context);\n\n设备示例：遥测卡\n335\n/* 提交 URB */\nusb_submit_urb(tele_device->ctrl_urb,\
  \ GFP_ATOMIC);\n/* 等待回调返回，表示遥测\n配置寄存器已成功初始化 */\nwait_for_completion(&tele_config_done);\n\
  /* 释放我们对 URB 的引用 */\nusb_free_urb(urb);\nkfree(tmp);\n/* 将设备特定对象保存到文件的 private_data\
  \ 中，\n这样你就可以直接从 tele_read() 和 tele_write() 等其他入口点检索它 */\nfile->private_data = tele_device;\n\
  /* 返回 URB 传输状态 */\nreturn(tele_device->ctrl_urb->status);\n}\n\n/* 回调函数 */\nstatic\
  \ void\ntele_ctrl_callback(struct urb *urb)\n{\n    complete((struct completion\
  \ *)urb->context);\n}\n```\n\n你可以使用 `usb_control_msg()` 简化 `tele_open()`，它是 `usb_submit_urb()`\
  \ 的阻塞版本，在内部隐藏了控制 URB 的同步和回调细节。出于学习目的，我们更倾向于使用异步方法。\n\n## 数据传输\n\n列表 11.5 实现了遥测驱动程序的\
  \ `read()` 和 `write()` 入口点。当应用程序读取或向 `/dev/tele.*` 写入数据时，这些方法会执行实际工作。`tele_read()`\
  \ 执行同步 URB 提交，因为调用进程想要阻塞直到遥测数据可用为止。然而，`tele_write()` 使用异步提交，并返回到调用线程，而无需等待驱动程序接受的数据已成功传输到设备。\n\
  \n336 第 11 通用总线\n由于异步传输与回调例程紧密相关，列表 11.5 实现了 `tele_write_callback()`。该例程检查 `urb->status`\
  \ 以解析提交状态。它还释放了 `tele_write()` 分配的传输缓冲区。\n\n#### 列表 11.5 与遥测卡的数据交换\n\n```c\n/* 读取入口点\
  \ */\nstatic ssize_t\ntele_read(struct file *file, char *buffer,\nsize_t count,\
  \ loff_t *ppos)\n{\n    int retval, bytes_read;\n    tele_device_t *tele_device;\n\
  \    /* 获取 tele_device 的地址 */\n    tele_device = (tele_device_t *)file->private_data;\n\
  \    /* ... */\n    /* 同步读取 */\n    retval = usb_bulk_msg(tele_device->usbdev, /*\
  \ usb_device */\n    usb_rcvbulkpipe(tele_device->usbdev,\n    tele_device->bulk_in_addr),\
  \ /* 管道 */\n    tele_device->bulk_in_buf, /* 读取缓冲区 */\n    min(tele_device->bulk_in_len,\
  \ count), /* 读取的字节数 */\n    &bytes_read, /* 读取的字节数 */\n    5000); /* 5 秒超时 */\n\
  \    /* 将遥测数据拷贝到用户空间 */\n    if (!retval) {\n        if (copy_to_user(buffer, tele_device->bulk_in_buf,\
  \ bytes_read)) {\n            return -EIO;\n        } else {\n            return\
  \ bytes_read;\n        }\n    }\n    return retval;\n}\n\n/* 写入入口点 */\n设备示例：遥测卡\n\
  337\nstatic ssize_t\ntele_write(struct file *file, char *buffer,\nsize_t count,\
  \ loff_t *ppos)\n{\n    char *tele_buf = NULL;\n    struct urb *urb = NULL;\n  \
  \  tele_device_t *tele_device;\n    /* 获取 tele_device 的地址 */\n    tele_device =\
  \ (tele_device_t *)file->private_data;\n    /* ... */\n    /* 分配一个 URB */\n    urb\
  \ = usb_alloc_urb(0, GFP_KERNEL);\n    if (!urb) {\n        return -ENOMEM;\n  \
  \  }\n    /* 分配 DMA 缓冲区并从用户空间拷贝 */\n    tele_buf = kmalloc(count, GFP_KERNEL);\n\
  \    if (copy_from_user(tele_buf, buffer, count)) {\n        usb_free_urb(urb);\n\
  \        kfree(tele_buf);\n        return -EFAULT;\n    }\n    /* 填充控制 URB 字段 */\n\
  \    usb_fill_bulk_urb(urb, tele_device->usbdev,\n    usb_sndctrlpipe(tele_device->usbdev,\n\
  \    tele_device->bulk_out_addr), /* 管道 */\n    tele_buf, count, tele_write_callback,\n\
  \    tele_device);\n    /* 异步提交 URB */\n    usb_submit_urb(urb, GFP_ATOMIC);\n \
  \   return 0;\n}\n\n/* 回调函数 */\nstatic void\ntele_write_callback(struct urb *urb)\n\
  {\n    tele_device_t *tele_device;\n    /* 获取 tele_device 的地址 */\n    tele_device\
  \ = (tele_device_t *)urb->context;\n    /* urb->status 包含提交状态。如果成功则为 0。对于 -ENOENT,\
  \ -ECONNRESET, -ESHUTDOWN 的错误重新提交 URB */\n    if (urb->status) {\n        usb_submit_urb(urb,\
  \ GFP_KERNEL);\n    }\n    /* 释放传输缓冲区。buffer_free() 是 tele_write() 调用的对项 */\n  \
  \  kfree(urb->transfer_buffer);\n}\n```\n\n\n\n\n以及 SCSI 子系统。如图所示，SCSI 子系统被分为三层：\n\
  \n1. 针对磁盘（`sd.c`）和光光光驱（`sr.c`）等设备的顶层驱动程序\n2. 中间层，它负责扫描总线、配置设备并将顶层驱动程序与底层驱动程序连接在一起\n\
  3. 底层 SCSI 适配器驱动程序\n\n大容量存储驱动程序将自己注册为虚拟 SCSI 适配器。该虚拟适配器通过 SCSI 命令与上游通信，并使用 URB 与下游通信。USB\
  \ 磁盘在较高层级中表现为连接到该虚拟适配器的 SCSI 设备。\n\n为了更好地理解 USB 层和 SCSI 层之间的交互，让我们对 USB 大容量存储驱动程序进行修改。`usbfs`\
  \ 节点 `/proc/bus/usb/devices` 包含了所有连接到系统的 USB 设备的属性和连接详情。例如，`/proc/bus/usb/devices`\
  \ 输出中的“T:”行包含总线编号、设备从根集线器（hub）计算的深度、运行速度等。“P:”行包含设备的厂商 ID（vendor ID）、产品 ID（product\
  \ ID）和修订版本号。`/proc/bus/usb/devices` 中的所有可用信息都由 USB 子系统管理，但缺少了一个由 SCSI 子系统管辖的信息。\n\
  \n与 USB 存储设备关联（磁盘为 `sd[a-z][1-9]`，光驱为 `sr[0-9]*`）的 `/dev` 节点名称未出现在 `/proc/bus/usb/devices`\
  \ 中。为了克服这一局限性，让我们添加一个“N:”行，用于显示与设备相关的 `/dev` 节点名称。列表 11.6 以源码补丁的形式展示了 2.6.23.1 内核树中所需的代码更改。\n\
  \n图 11.4 USB 大容量存储与 SCSI。\n\n### 列表 11.6 为 usbfs 添加磁盘的 /dev/ 名称\n\n**include/scsi/scsi_host.h:**\n\
  ```c\nstruct Scsi_Host {\n  /* ... */\n  void *shost_data;\n  + char snam[8]; /*\
  \ 此磁盘的 /dev*节点名称 */\n  /* ... */\n};\n```\n\n**drivers/usb/storage/usb.h:**\n```c\n\
  struct us_data {\n  /* ... */\n  + char magic[4];\n};\n```\n\n**include/linux/usb.h:**\n\
  ```c\nstruct usb_interface {\n  /* ... */\n  + void *private_data;\n};\n```\n\n\
  **drivers/usb/storage/usb.c:**\n```c\nstatic int storage_probe(struct usb_interface\
  \ *intf, const struct usb_device_id *id)\n{\n  /* ... */\n  memset(us, 0, sizeof(struct\
  \ us_data));\n  + intf->private_data = (void *) us;\n  + strncpy(us->magic, \"disk\"\
  , 4);\n  mutex_init(&(us->dev_mutex));\n  /* ... */\n}\n```\n\n**drivers/scsi/sd.c:**\n\
  ```c\nstatic int sd_probe(struct device *dev)\n{\n  /* ... */\n  add_disk(gd);\n\
  \  + memset(sdp->host->snam,0, sizeof(sdp->host->snam));\n  + strncpy(sdp->host->snam,\
  \ gd->disk_name, 3);\n  sdev_printk(KERN_NOTICE, sdp, \"Attached scsi %sdisk %s\\\
  n\",\n    sdp->removable ? \"removable \" : \"\", gd->disk_name);\n  /* ... */\n\
  }\n```\n\n**drivers/scsi/sr.c:**\n```c\nstatic int sr_probe(struct device *dev)\n\
  {\n  /* ... */\n  add_disk(disk);\n  + memset(sdev->host->snam,0, sizeof(sdev->host->snam));\n\
  \  + strncpy(sdev->host->snam, cd->cdi.name, 3);\n  sdev_printk(KERN_DEBUG, sdev,\
  \ \"Attached scsi CD-ROM %s\\n\",\n    cd->cdi.name);\n  /* ... */\n}\n```\n\n**drivers/usb/core/devices.c:**\n\
  ```c\n/* ... */\n#include <asm/uaccess.h>\n+ #include <scsi/scsi_host.h>\n+ #include\
  \ \"../storage/usb.h\"\nstatic ssize_t usb_device_dump(char __user **buffer, size_t\
  \ *nbytes,\nloff_t *skip_bytes, loff_t *file_offset,\nstruct usb_device *usbdev,\n\
  struct usb_bus *bus, int level,\nint index, int count)\n{\n  /* ... */\n  ssize_t\
