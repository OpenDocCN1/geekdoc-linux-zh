  \ DVI 发射器寄存器。DVI 发射器的示例是 Silicon Image 的 `SiI164`。\n\n## Linux 视频子系统\n359\n帧缓冲区概念是\
  \ Linux 视频的核心，让我们先找出它提供了什么。由于视频适配器基于不同的硬件架构，高级内核层和应用程序的实现可能需要根据显卡进行变化。这导致了处理不同显卡的方案不统一。随之而来的不可移植性和额外代码增加了投入和维护。帧缓冲区概念通过描述通用抽象并指定编程接口解决了这个问题，该接口允许应用程序和高级内核层以平台无关的方式编写。图\
  \ 12.4 显示了帧缓冲区的优势。内核的帧缓冲区接口使得应用程序不受底层图形硬件变化的影响。如果应用程序及其显示驱动程序都符合帧缓冲区接口，它们可以在不同类型的视频硬件上无缝运行。你很快就会发现，常见的帧缓冲区编程\n\
  \n\n\n接口为内核层带来了硬件无关性，例如帧控制台驱动程序（frame buffer console driver）。\n\n今天，许多应用程序（如浏览器和电影播放器）直接在帧接口上工作。此类应用程序可以在没有窗口系统帮助的情况下进行图形处理。X\
  \ Windows 服务器（Xfbdev`）能够在帧接口上工作，如图 12.5 所示。\n\n### GUI、控制台、电影播放器……\n通用帧 API\n帧驱动程序\
  \ I\n帧驱动程序 N\n…\n具有不同图形能力的显卡\n显卡 I\n显卡 N\n控制器\n**图 12.4** 帧优势。\n\n360 第 12 章 视频驱动程序\n\
