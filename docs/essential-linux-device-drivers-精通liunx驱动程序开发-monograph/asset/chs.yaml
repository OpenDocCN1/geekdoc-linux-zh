  \ `drivers/ata/` |\n| RAID: 软件 RAID | 在 Linux 上，多磁盘 (`md`) 驱动程序在软件中实现了若干 RAID 级别。\
  \ | `drivers/md/` |\n| SD/miniSD/ microSD | 相机、手机等消费电子设备中流行的小型存储介质。支持高达 10MBps 的传输速率。\
  \ | `drivers/mmc/` |\n| MMC | 较旧、较慢但兼容的技术，支持 2.5MBps 的数据速率。 | `drivers/mmc/` |\n\
  | PCMCIA/CF | 不同的 PCMCIA/CF 存储卡及其相应的内核驱动程序。 | `drivers/ide/legacy/ide.c`, `drivers/ata/ata_pcmcia.c`\
  \ |\n| IDE | microdrive 等 PCMCIA 内存卡支持真正的 IDE 操作，而内部使用固态内存的卡则仿真 IDE 并向内核导出 IDE 编程模型。\
  \ | `drivers/ide/legacy/ide.c`, `drivers/ata/ata_pcmcia.c` |\n| 块设备 | 在闪存上仿真 IDE。\
  \ | `drivers/mtd/mtdblock.c`, `drivers/mtd/mtdblkdevs.c` |\n| RAM 磁盘 | 实现将内存区域作为块设备的使用。\
  \ | `drivers/block/rd.c` |\n| 回环设备 | 实现将普通文件作为块设备的使用。 | `drivers/block/loop.c` |\n\
  \n*(注：页脚和页码已根据核心内容保留原则进行省略)*\n\n\n\n\n连同相应的请求。新请求被插入到队列中，以保持这种顺序。如果队列中的现有请求与相邻的磁盘扇区相关，则新请求将与之合并。由于这些特性，I/O\
  \ 调度器在操作上类似于电梯——它们在单方向上调度请求，直到队列末尾的最后一名请求者得到服务为止。\n\n2.4 内核中的 I/O 调度器实现了该算法的简单版本，并被称为\
  \ `Linus elevator`。然而，这在现实条件下被证明是不够的，在 2.6 内核中被一组四个调度器取代：`Deadline`、`Anticipatory`、`Complete\
  \ Fair Queuing` 和 `Noop`。默认使用的调度器是 Anticipatory，但可以在内核配置期间或通过更改 `/sys/block/[disk]/queue/scheduler`\
  \ 的值来更改（如果你使用的是 IDE 磁盘，请将 `[disk]` 替换为 `hda`）。表 14.2 简要描述了 Linux I/O 调度器。\n\n###\
  \ 表 14.2 Linux I/O 调度器\n\n| I/O 调度器 | 描述 | 源文件 |\n| :--- | :--- | :--- |\n| Linus\
  \ elevator | 标准合并并排序 I/O 调度算法的简单实现。（在 2.4 内核树中） | `drivers/block/elevator.c` |\n\
  | Deadline | 除了 Linus elevator 执行的功能外，Deadline 调度器为每个请求关联了过期时间，以确保对同一磁盘区域的突发请求不会导致较远区域的请求饥饿。此外，读操作的优先级高于写操作，因为用户进程通常会阻塞直到其读请求完成。因此，Deadline\
  \ 调度器确保每个 I/O 请求都在时间限制内得到服务，这对某些数据库负载非常重要。 | `block/deadline-iosched.c`（在 2.6 内核树中）\
  \ |\n| Anticipatory | 与 Deadline 调度器类似，不同在于处理完读请求后，Anticipatory 调度器会等待预定的时间以期待后续请求。这种调度技术适用于工作站/交互式负载。\
  \ | `block/as-iosched.c`（在 2.6 内核树中） |\n| Complete Fair Queuing (CFQ) | 与 Linus\
  \ elevator 类似，CFQ 调度器为每个源进程维护一个请求队列，而不是一个通用队列。这确保了每个进程（或进程组）都能获得公平的 I/O，并防止一个进程饥饿其他进程。\
  \ | `block/cfq-iosched.c`（在 2.6 内核树中） |\n| Noop | Noop 调度器不花费时间遍历请求队列寻找最佳插入点。相反，它只是将新请求添加到请求队列的尾部。这种调度器对于没有移动部件因此没有寻道延迟的半导体存储介质非常理想。例如\
  \ `Disk-On-Module` (DOM)，它内部使用闪存内存。 | `block/noop-iosched.c`（在 2.6 内核树中） |\n\n在概念层面上，I/O\
  \ 调度类似于进程调度。I/O 调度为进程提供了一种它们拥有磁盘的幻觉，而进程调度为进程提供了它们拥有 CPU 的幻觉。Linux 上的 I/O 和进程调度器近期都经过了巨大的变化。进程调度将在第\
  \ 19 章讨论。\n\n### 块驱动程序数据结构和方法\n\n现在让我们将注意力转移到本章的主题：块设备驱动程序。在本节中，我们将查看在实现块设备驱动程序时可能会遇到的重要数据结构和驱动程序方法。在下一节中，当我们为一个虚拟存储控制器实现块驱动程序时，将使用这些结构和方法。\n\
  \n以下是主要的块驱动数据结构：\n\n1. 内核使用 `include/linux/genhd.h` 中定义的 `gendisk`（generic disk\
  \ 的缩写）结构表示磁盘：\n\n```c\nstruct gendisk {\n    int major; /* 设备主号 */\n    int first_minor;\
  \ /* 起始次号 */\n    int minors; /* 最大次号数量。每个磁盘分区有一个次号 */\n    char disk_name[32];\
  \ /* 磁盘名称 */\n    /* ... */\n    struct block_device_operations *fops; /* 块设备操作。稍后描述。\
  \ */\n    struct request_queue *queue; /* 与此磁盘关联的请求队列。接下来讨论。 */\n    /* ... */\n\
  };\n```\n\n2. 每个块驱动程序关联的 I/O 请求队列使用 `include/linux/blkdev.h` 中定义的 `request_queue`\
  \ 结构描述。这是一个大结构，但你可能使用的唯一组成字段是 `request` 结构，它将在后续描述。\n\n3. `request_queue` 中的每个请求使用\
  \ `include/linux/blkdev.h` 中定义的 `request` 结构表示：\n\n```c\nstruct request {\n    /*\
  \ ... */\n    struct request_queue *q; /* 容器请求队列 */\n    /* ... */\n    sector_t\
  \ sector; /* 请求数据访问的扇区 */\n    /* ... */\n    unsigned long nr_sectors; /* 剩余提交的扇区数量\
  \ */\n    /* ... */\n    struct bio *bio; /* 关联的 bio。稍后描述。 */\n    /* ... */\n \
  \   char *buffer; /* 数据传输的缓冲区 */\n    /* ... */\n    struct request *next_rq; /*\
  \ 队列中的下一个请求 */\n};\n```\n\n4. `block_device_operations` 是字符驱动程序使用的 `file_operations`\
  \ 结构的块驱动对应物。它包含以下入口点：\n\n- 与块驱动程序相关的标准方法，如 `open()`、`release()` 和 `ioctl()`\n- 与可插拔设备的特殊方法，如\
  \ `media_changed()` 和 `revalidate_disk()`\n\n`block_device_operations` 在 `include/fs.h`\
  \ 中的定义如下：\n\n```c\nstruct block_device_operations {\n    int (*open)(struct inode\
  \ *, struct file *); /* 打开 */\n    int (*release)(struct inode *, struct file *);\
  \ /* 关闭 */\n    int (*ioctl)(struct inode *, struct file *, unsigned, unsigned long);\
  \ /* I/O 控制 */\n    /* ... */\n    int (*media_changed)(struct gendisk *); /* 介质可用\
  \ */\n    int (*revalidate_disk)(struct gendisk *); /* 为新插入的介质准备 */\n    /* ...\
  \ */\n};\n```\n\n5. 当我们查看请求结构时，看到它关联了一个 `bio`。`bio` 结构是对块操作的低级描述。它在 `include/linux/bio.h`\
  \ 中定义如下：\n\n```c\nstruct bio {\n    sector_t bi_sector; /* 请求数据访问的扇区 */\n    struct\
  \ bio *bi_next; /* bio 节点列表 */\n    /* .. */\n    unsigned long bi_rw; /* bi_rw\
  \ 的低位包含数据传输方向 */\n    /* ... */\n    struct bio_vec *bi_io_vec; /* 指向 bio_vec 数组的指针\
  \ */\n    unsigned short bi_vcnt; /* bio_vec 数组的大小 */\n    unsigned short bi_idx;\
  \ /* 数组中当前 bio_vec 的索引 */\n    /* ... */\n};\n```\n\n块数据内部使用 `bio_vec` 结构数组表示为 I/O\
  \ 向量。bio_vec 数组的每个元素由 (页、页偏移、长度) 元组组成，描述 I/O 块的片段。将 I/O 请求维护为页向量带来了许多优点，包括更简洁的实现和高效的聚集。\n\
  \n在结束本节之前，让我们简要查看块驱动程序的入口点。块驱动程序大致通过三种方法构建：\n\n- 常用的初始化和退出方法。\n- 前述 `block_device_operations`\
  \ 中的方法。\n- 请求方法。与字符设备不同，块驱动程序不支持用于数据传输的 `read()`/`write()` 方法。相反，它们使用名为*请求方法*的特殊程序进行磁盘访问。\n\
  \n块核心层提供了一组驱动方法可以利用的库程序。\n\n\n\n下一节中的示例驱动程序调用了这些库例程的服务。\n\n### 设备示例：简单存储控制器\n\n\
  考虑图 14.3 所示的嵌入式设备。 SoC 包含一个与块设备通信的内置存储控制器。架构类似于 SD/MMC 媒体，但我们的示例存储控制器由表 14.3 列出的基础寄存器组描述。`SECTOR_NUMBER_REGISTER`\
  \ 指定请求访问数据的扇区。`SECTOR_COUNT_REGISTER` 包含要传输的扇区数量。数据通过 `DATA_REGISTER` 移动。`COMMAND_REGISTER`\
  \ 程序设置存储控制器必须执行的操作（例如，从介质读取或写入介质）。`STATUS_REGISTER` 包含指示控制器是否正在执行操作的位。\n\n媒体槽/\n\
  **嵌入式 SoC**\n连接器\n存储\n块\n控制器\n媒体\nCPU\n核心\nCPU 内部总线\n\n图 14.3 嵌入式设备上的存储。\n\n我们示例设备中的存储媒体具有平面扇区几何结构。相比之下，IDE\
  \ 控制器除了扇区寄存器外，还支持由设备头寄存器、低磁道寄存器和高磁道寄存器指定的*柱面头扇区*（CHS）几何结构。\n\n### 设备示例：简单存储控制器\n\
  427\n\n表 14.3 存储控制器的寄存器布局\n\n| 寄存器名称 | 内容描述 |\n| :--- | :--- |\n| `SECTOR_NUMBER_REGISTER`\
  \ | 执行下一次磁盘操作的扇区。 |\n| `SECTOR_COUNT_REGISTER` | 要读取或写入的扇区数量。 |\n| `COMMAND_REGISTER`\
  \ | 要执行的操作（例如，读取或写入）。 |\n| `STATUS_REGISTER` | 操作结果、中断状态和错误标志。 |\n| `DATA_REGISTER`\
  \ | 在读取路径中，存储控制器从磁盘获取数据到内部缓冲区。驱动程序通过此寄存器访问内部缓冲区。在写入路径中，驱动程序写入此寄存器的数据被传输到内部缓冲区，然后由控制器复制到磁盘。\
  \ |\n\n让我们把存储控制器称为 `myblkdev`。这个简单的设备既不是中断驱动的也不支持 DMA。我们还假设媒体是可拆卸的。我们的任务是为 `myblkdev`\
  \ 写一个块驱动程序。我们的驱动程序非常精简，尽管它是完整的。它不处理电源管理，且对性能并不敏感。\n\n### 初始化\n\n列表 14.1 包含了驱动程序初始化方法\
  \ `myblkdev_init()`，它执行了以下步骤：\n\n1.  使用 `register_blkdev()` 注册块设备。此块库例程为 `myblkdev`\
  \ 分配一个未使用的的主设备号，并在 `/proc/devices` 中添加设备条目。\n2.  将请求方法与块设备关联。它通过向 `blk_init_queue()`\
  \ 提供 `myblkdev_request()` 的地址来实现。`blk_init_queue()` 的调用返回 `myblkdev` 的 `request_queue`。请回看图\
  \ 14.2 以查看 `request_queue` 相对于驱动程序的位置。`blk_init_queue()` 的第二个参数 `myblkdev_lock`\
  \ 是一个自旋锁，用于保护 `request_queue` 免受并发访问。\n3.  硬件以*扇区*为单位执行磁盘事务，而软件子系统（如文件系统）以*块*为单位处理数据。常见的扇区大小为\
  \ 512 字节；通常的块大小为 4096 字节。你需要告知块层你的存储硬件支持的扇区大小，以及你的驱动程序每个请求可以接收的最大扇区数。`myblkdev_init()`\
  \ 通过分别调用 `blk_queue_hardsect_size()` 和 `blk_queue_max_sectors()` 完成这些任务。\n4.  使用\
  \ `alloc_disk()` 为 `myblkdev` 分配相应的 `gendisk` 并填充它。`myblkdev_init()` 提供的一个重要 `gendisk`\
  \ 字段是驱动程序的 `block_device_operations` 的地址。`myblkdev_init()` 填充的另一个参数是以扇区为单位的 `myblkdev`\
  \ 存储容量。这通过调用 `set_capacity()` 实现。每个 `gendisk` 还包含一个指示底层存储硬件属性的标志。例如，如果驱动器是拆卸的，`gendisk`\
  \ 的标志字段应标记为 `GENHD_FL_REMOVABLE`。\n6.  将第 4 步准备的 `gendisk` 与第 2 步获取的 `request_queue`\
  \ 关联。此外，将 `gendisk` 与设备的主/次设备号及名称连接起来。\n7.  通过调用 `add_disk()` 将磁盘添加到块 I/O 层。完成后，驱动程序必须准备好接收请求。因此，这通常是初始化序列的最后一步。\n\
  \n该块设备现在作为 `/dev/myblkdev` 可供可用。如果设备支持多个磁盘分区，它们将显示为 `/dev/myblkdevX`，其中 `X` 是分区号。\n\
  \n### 列表 14.1 初始化驱动程序\n\n```c\n#include <linux/blkdev.h>\n#include <linux/genhd.h>\n\
  static struct gendisk *myblkdisk; /* 磁盘的表示 */\nstatic struct request_queue *myblkdev_queue;\n\
  \n/* 关联的请求队列 */\nint myblkdev_major = 0; /* 分配的主号 */\nstatic DEFINE_SPINLOCK(myblkdev_lock);\
  \ /* 保护 myblkdev_queue 免受并发访问的自旋锁 */\nint myblkdisk_size = 256*1024; /*以 KB 为单位的磁盘大小\
  \ */\nint myblkdev_sect_size = 512; /* 硬件扇区大小 */\n\n/* 初始化 */\nstatic int __init\
  \ myblkdev_init(void)\n{\n    /* 在内核中注册此块设备 */\n    if ((myblkdev_major = register_blkdev(0,\
  \ \"myblkdev\")) <= 0) {\n        return -EIO;\n    }\n    /* 为此设备分配请求队列 */\n  \
  \  myblkdev_queue = blk_init_queue(myblkdev_request, &myblkdev_lock);\n    if (!myblkdev_queue)\
  \ {\n        return -EIO;\n    }\n    /* 设置硬件扇区大小和最大扇区数 */\n    blk_queue_hardsect_size(myblkdev_queue,\
  \ myblkdev_sect_size);\n    blk_queue_max_sectors(myblkdev_queue, 512);\n    /*\
  \ 分配一个 gendisk */\n    myblkdisk = alloc_disk(1);\n    if (!myblkdisk) {\n     \
  \   return -EIO;\n    }\n    /* 填充与 gendisk 关联的参数 */\n    myblkdisk->fops = &myblkdev_fops;\n\
  \    /* 以扇区为单位设置存储媒体容量 */\n    set_capacity(myblkdisk, myblkdisk_size);\n    myblkdisk->queue\
  \ = myblkdev_queue;\n    myblkdisk->major = myblkdev_major;\n    myblkdisk->first_minor\
  \ = 0;\n    sprintf(myblkdisk->disk_name, \"myblkdev\");\n    /* 将 gendisk 添加到 I/O\
  \ 子系统 */\n    add_disk(myblkdisk);\n    return 0;\n}\n\n/*  */\nstatic void __exit\
  \ myblkdev_exit(void)\n{\n    /* 使分区信息失效并清理 */\n    del_gendisk(myblkdisk);\n  \
  \  /* 释放 gendisk 的引用以便释放 */\n    put_disk(myblkdisk);\n    /* 将驱动程序与请求队列分离 */\n\
  \    blk_cleanup_queue(myblkdev_queue);\n    /* 取消块设备注册 */\n    unregister_blkdev(myblkdev_major,\
  \ \"myblkdev\");\n}\n\nmodule_init(myblkdev_init);\nmodule_exit(myblkdev_exit);\n\
  MODULE_LICENSE(\"GPL\");\n```\n428 第 14 章 块驱动\n\n### 块设备操作\n\n接下来让我们查看块驱动程序 `block_device_operations`\
  \ 中包含的主要方法。\n\n块驱动程序的 `open()` 方法在挂载介质上的文件系统或执行文件系统检查 (fsck) 等操作期间被调用。在 `open()`期间完成的许多任务取决于硬件。例如，CD-ROM\
  \ 驱动程序会锁定驱动器门。SCSI 驱动程序检查设备是否设置了写保护页，如果是，则在请求启用写入打开时失败。如果设备是可拆卸的，`open()` 会调用服务例程\
  \ `check_disk_change()` 来检查介质是否发生了变化。\n\n如果你的驱动程序需要支持特定命令，请使用以下方式实现支持\n\n\n\n\n\n\
  -   使用 `ioctl()` 方法。例如，软盘驱动程序支持一个弹出介质的命令。\n\n`media_changed()` 方法检查存储介质是否发生变化，因此对于像\
  \ `myblkdev` 这样的固定设备并不相关。例如，SCSI 磁盘驱动程序的 `media_changed()` 方法可以检测插入的 USB 优存盘是否发生了变化。\n\
  \n### 设备示例：简单存储控制器\n\n`myblkdev` 支持的唯一块设备操作是 `ioctl()` 方法，即 `myblkdev_ioctl()`。块层本身处理通用的\
  \ `ioctls`，并仅调用驱动程序的 `ioctl()` 方法来处理特定于设备的命令。在列表 14.2 中，`myblkdev_ioctl()` 实现了 `GET_DEVICE_ID`\
  \ 命令，从控制器获取设备 ID。该命令通过 `COMMAND_REGISTER` 发送，ID 数据从 `DATA_REGISTER` 获取。\n\n### 列表\
  \ 14.2 块设备操作\n\n```c\n#define GET_DEVICE_ID 0xAA00 /* Ioctl 命令定义 */\n\n/* ioctl\
  \ 操作 */\nstatic int\nmyblkdev_ioctl (struct inode *inode, struct file *file,\n \
  \               unsigned int cmd, unsigned long arg)\n{\n    unsigned char status;\n\
  \    switch (cmd) {\n    case GET_DEVICE_ID:\n        outb(GET_IDENTITY_CMD, COMMAND_REGISTER);\n\
  \        /* 当控制器忙碌时等待 */\n        while ((status = inb(STATUS_REGISTER)) & BUSY_STATUS);\n\
  \        /* 获取 ID 并返回到用户空间 */\n        return put_user(inb(DATA_REGISTER), (long\
  \ __user *)arg);\n    default:\n        return -EINVAL;\n    }\n}\n\n/* 块设备操作 */\n\
  static struct block_device_operations myblkdev_fops = {\n    .owner = THIS_MODULE,\
  \ /* 该结构体的所有者 */\n    .ioctl = myblkdev_ioctl,\n    /* 我们的示例存储控制器未实现以下操作：\n    open(),\
  \ release(), unlocked_ioctl(),\n    compat_ioctl(), direct_access(), getgeo(), revalidate_disk(),\
  \ 以及\n    media_changed() */\n};\n```\n\n## 磁盘访问\n\n如前所述，块驱动程序使用 `request()` 方法执行磁盘访问操作。当块\
  \ I/O 子系统想要处理位于驱动程序 `request_queue` 中的等待请求时，就会调用驱动程序的 `request()` 方法。然而，`request()`\
  \ 方法并不在请求数据传输的用户进程上下文中运行。相关的 `request_queue` 的地址作为参数传递给 `request()` 方法。\n\n正如你之前看到的，内核在调用\
  \ `request()` 方法之前会持有请求锁。这是为了保护相关的请求队列免受并发访问。由于由于，如果你的 `request()` 方法必须调用任何可能导致睡眠的函数，它必须在执行调用之前释放锁，并在返回之前重新获取锁。\n\
  \n列表 14.3 包含了我们驱动程序的请求方法 `myblkdev_request()`。该函数使用 `elv_next_request()` 的服务从 `request_queue`\
  \ 获取下一个请求。如果队列中没有更多待处理的请求，`elv_next_request()` 返回 `NULL`。`elv_next_request()` 之所以命名是因为正如你之前学到的，I/O\
  \ 调度算法是电梯用于处理请求的基本操作的变体。在处理完请求后，驱动程序通过调用 `end_request()` 请求块层结束该请求的 I/O。你可以使用 `end_request()`\
  \ 的第二个参数来指定成功或错误代码。\n\n从 `request_queue` 收集的请求包含了请求数据访问的起始扇区（列表 14.3 中的 `req->sector`）、需要执行\
  \ I/O 的扇区数量（`req->nr_sectors`）、包含要传输数据的缓冲区（`req->buffer`）以及数据移动的方向（`rq_data_dir(req)`）。如列表\
  \ 14.3 所示，`myblkdev_request()` 在这些参数的帮助执行所需的寄存器编程。\n\n### 列表 14.3 请求函数\n\n```c\n\
  #define READ_SECTOR_CMD 1\n#define WRITE_SECTOR_CMD 2\n#define GET_IDENTITY_CMD\
  \ 3\n#define BUSY_STATUS 0x10\n#define SECTOR_NUMBER_REGISTER 0x20000000\n#define\
  \ SECTOR_COUNT_REGISTER 0x20000001\n#define COMMAND_REGISTER 0x20000002\n#define\
  \ STATUS_REGISTER 0x20000003\n#define DATA_REGISTER 0x20000004\n\n/* 请求方法 */\nstatic\
  \ void\nmyblkdev_request(struct request_queue *rq)\n{\n    struct request *req;\n\
  \    unsigned char status;\n    int i, good = 0;\n    /* 遍历队列中的等待请求 */\n    while\
  \ ((req = elv_next_request(rq)) != NULL) {\n        /* 编写起始扇区和扇区数量 */\n        outb(req->sector,\
  \ SECTOR_NUMBER_REGISTER);\n        outb(req->nr_sectors, SECTOR_COUNT_REGISTER);\n\
  \        /* 我们只对文件系统请求感兴趣。SCSI 命令\n        另一种可能的请求类型。完整列表请参阅\n        *include/linux/blk.h\
  \ 中的 rq_cmd_type_bits 枚举*/\n        if (rq_data_dir(req)) {\n            switch\
  \ (req) {\n            case READ:\n                /* 发出读命令 */\n               \
  \ outb(GET_IDENTITY_CMD, COMMAND_REGISTER);\n                /* 当控制器忙碌时等待 */\n \
  \               while ((status = inb(STATUS_REGISTER)) & BUSY_STATUS);\n       \
  \         /* 获取 ID 并返回到用户空间 */\n                return put_user(inb(DATA_REGISTER),\
  \ (long __user *)arg);\n            case WRITE:\n                /* 发出写命令 */\n \
  \               outb(WRITE_SECTOR_CMD, COMMAND_REGISTER);\n                /* ...\
  \ (为了简起省略逻辑) ... */\n                break;\n            }\n        }\n    }\n}\n\
  ```\n\n## 高级主题\n\nDMA 操作在 bio 级别工作。正如你之前看到的，I/O 请求由 bios 组成，每个 bio 包含一个 `bio_vecs`\
  \ 数组，而这些数组反过来持有关于组成页的信息。假设 `bio` 指向与 I/O 请求相关的 bio 结构，`bio->bi_sector` 包含请求数据访问的起始扇区，`bio_cur_sectors(bio)`\
  \ 返回要执行 I/O 的扇区数量，而 `bio_data_dir(bio)` 提供数据传输的方向。与缓冲区相关的物理页地址由 `bio->io_vec` 指向的\
  \ bio_vec 数组描述。若要遍历请求中的每个 bio，可以使用 `rq_for_each_bio()`。若要进一步遍历 bio 中的每个页段，使用 `bio_each_segment()`。\n\
  \n在前面的代码段中，`blk_rq_map_sg()` 内部调用 `rq_for_each_bio()` 和 `bio_each_segment()` 来遍历请求的所有页，并构建一个分散聚集列表\
  \ `tmp_sg`。创建的分散聚集列表中每个页的流式 DMA 映射通过 `pci_map_page()` 完成。\n\n```c\nstatic void do_map_request(struct\
  \ request_queue *q)\n{\n    struct request *creq;\n    struct scatterlist tmp_sg[SG_MAX];\n\
  \    cmdlist_t *c;\n    ctrl_info_t *h = q->queuedata;\n    int seg;\n    /* ...\
  \ */\n    creq = elv_next_request(q);\n    /* ... */\n    c->rq = creq;\n    seg\
  \ = blk_rq_map_sg(q, creq, tmp_sg);\n    /* ... */\n    for (i=0; i<seg; i++) {\n\
  \        c->req.sg[i].size = tmp_sg[i].length;\n        c->req.sg[i].addr = (__u32)\
  \ pci_map_page(h->pci_dev, tmp_sg[i].page,\n                            tmp_sg[i].offset,\
  \ tmp_sg[i].length, dir);\n    }\n    /* ... */\n}\n```\n\n\n\n\n与我们忙等待（busy-wait）请求操作完成的示例驱动不同，`cpqarray`驱动实现了一个中断处理程序\
  \ `do_ida_intr()`，以便在命令完成时接收硬件告报。\n\n某些驱动程序，例如内存盘驱动（`drivers/block/rd.c`）和回环驱动（`drivers/block/loop.c`），运行在虚拟块设备上，这些设备无法从请求队列的优化排序和合并操作中受益。此类驱动程序完全跳过了请求队列，并使用\
  \ `make_request()` 函数直接从块层获取 bios。因此，`drivers/block/rd.c` 没有使用 `blk_init_queue()`\
  \ 注册请求队列处理器，而是通过 `blk_queue_make_request()` 提供了一个 `make_request()` 例程，如下所示：\n\n\
  ```c\nstatic int __init rd_init(void)\n{\n    /* ... */\n    blk_queue_make_request(rd_queue[i],\
  \ &rd_make_request);\n    /* ... */\n}\n\nstatic int rd_make_request(struct request_queue\
  \ *q, struct bio *bio)\n{\n    /* ... */\n}\n```\n\n## 调试\n\n`hdparm` 工具可以从底层内核驱动程序提取各种\
  \ PATA/SATA 磁盘参数。例如，要在 SATA 驱动器上测试磁盘读取速度，可以执行以下操作：\n\n```bash\nhdparm -T -t /dev/sda\n\
  ```\n\n`/dev/sda`:\nTiming cached reads: 2564 MB in 2.00 seconds = 1283.57 MB/sec\n\
  Timing buffered disk reads: 132 MB in 3.03 seconds = 43.61 MB/sec\n\n欲了解 `hdparm`\
  \ 的完整功能，请阅读帮助页（man pages）。\n\n*自监控*、分析与报告技术*（SMART）是内置在许多现代 ATA 和 SCSI 磁盘中的系统，用于监控故障和执行自检。名为\
  \ `smartd` 的用户空间守护进程在底层设备驱动程序的帮助下收集支持 SMART 的磁盘收集的信息。查看 `smartd`、`smartctl` 和 `smartd.conf`\
  \ 的帮助页可以学习如何从支持 SMART 的磁盘获取健康状态。\n\n如果你的发行版没有预装 `hdparm` 和 SMART 工具，你可以分别从 `http://sourceforge.net/projects/hdparm/`\
  \ 和 `http://sourceforge.net/projects/smartmontools/` 下载。\n\n`/proc/ide/*` 下的文件包含有关系统中\
  \ IDE 磁盘驱动器的信息。例如，要获取第一个 IDE 磁盘的几何结构，请查看 `/proc/ide/ide0/hda/geometry.*` 的内容。有关\
  \ SCSI 设备的信息位于 `/proc/scsi/` 下。你可以从 `/proc/partitions` 收集磁盘分区信息。\n\nIDE 设备感兴趣的 sysfs\
  \ 目录是 `/sys/bus/ide/*`，SCSI 是 `/sys/bus/scsi/`。此外，系统上每个活动的块设备在 `/sys/block/*` 下都有一个子目录，其中包含了相关的请求队列参数、组成分区详情和状态信息。\n\
  \n提供了一些内核配置选项可以触发块子系统输出调试输出。`CONFIG_BLK_DEV_IO_TRACE` 跟踪块层的能力。`CONFIG_SCSI_CONSTANTS`\
  \ 和 `CONFIG_SCSI_LOGGING` 分别开启 SCSI 错误报告和日志。\n\nlinux-ide 邮件列表是讨论 Linux-IDE 子系统相关问题的论坛。订阅\
  \ linux-scsi 邮件列表并浏览其存档，可以获取与 Linux-SCSI 子系统相关的讨论。\n\n## 查看源码\n\n表 14.1 包含了各种存储技术的内核驱动程序源码位置。查看\
  \ `Documentation/ide.txt`、`Documentation/scsi/**` 和 `Documentation/cdrom/*` 获取有关相关存储驱动程序的信息。\n\
  \n顶层 `block/*` 目录包含 I/O 调度算法和块核心层。表 14.2 列出了该目录中实现各种 I/O 调度器的源文件。查看 `Documentation/block/*`\
  \ 获取相关文档。\n\n表 14.4 包含了本章使用的主要数据结构及其在源码树中的位置。表 14.5 列出了你在本章中使用的主要内核编程接口，以及它们定义的位置。\n\
  \n### 表 14.4 数据结构总结\n\n| 数据结构 | 位置 | 描述 |\n| :--- | :--- | :--- |\n| gendisk | `include/linux/genhd.h`\
  \ | 磁盘的表示。 |\n| request_queue | `include/linux/blkdev.h` | 与 `gendisk` 关联的 I/O 请求队列。\
  \ |\n| request | `include/linux/blkdev.h` | `request_queue` 中的每个请求都使用此结构描述。 |\n\
  | block_device_operations | `include/linux/fs.h` | 块设备驱动方法。 |\n| bio | `include/linux/bio.h`\
  \ | 块 I/O 操作的低级描述。 |\n\n#### 表 14.5 内核编程接口总结\n\n| 内核接口 | 位置 | 描述 |\n| :--- | :---\
  \ | :--- |\n| register_blkdev() | `block/genhd.c` | 向内核注册块驱动程序 |\n| unregister_blkdev()\
  \ | `block/genhd.c` | 从内核中注销块驱动程序 |\n| alloc_disk() | `block/genhd.c` | 分配一个 `gendisk`\
  \ |\n| add_disk() | `block/genhd.c` | 将填充好的 `gendisk` 添加到内核块层 |\n| del_gendisk()\
  \ | `fs/partitions/check.c` | 释放 `gendisk` |\n| blk_init_queue() | `block/ll_rw_blk.c`\
  \ | 分配 `request_queue` 并注册处理队列请求的 `request()` 函数 |\n| blk_cleanup_queue() | `block/ll_rw_blk.c`\
  \ | `blk_init_queue()` 的逆操作 |\n| blk_queue_make_request() | `block/ll_rw_blk.c`\
  \ | 注册 `make_request()` 函数，该函数跳过请求队列直接从块层获取请求 |\n| rq_for_each_bio() | `include/linux/blkdev.h`\
  \ | 遍历请求中的每个 `bio` |\n| bio_for_each_segment() | `include/linux/bio.h` | 遍历 `bio`\
  \ 中的每个页段 |\n| blk_rq_map_sg() | `block/ll_rw_blk.c` | 遍历构成请求的 `bio` 段并构建散聚集列表 |\n\
  | blk_queue_max_sectors() | `block/ll_rw_blk.c` | 设置关联队列中请求的最大扇数 |\n| blk_queue_hardsect_size()\
  \ | `block/ll_rw_blk.c` | 硬件支持的扇大小。 |\n| set_capacity() | `include/linux/genhd.h`\
  \ | 以扇数设置存储介质的容量 |\n| blk_fs_request() | `include/linux/blkdev.h` | 检查从请求队列获取的请求是否为文件系统请求\
  \ |\n| elv_next_request() | `block/elevator.c` | 从请求队列获取下一个项 |\n| end_request()\
  \ | `block/ll_rw_blk.c` | 完成请求的 I/O |\n\n连接赋予了智能。今天你很少遇到不支持某种形式网络系统的计算机系统。在本章中，让我们专注于在局域网（LAN）上传输网际协议（IP）流量的网络接口卡（NIC）设备驱动程序。本章的大部分内容与总线无关，但在涉及特定总线的情况下，假设使用\
  \ PCI。为了让你了解其他网络技术的风味，我们还提到了异步传输模式（ATM）。\n\n**本章内容**\n- 驱动数据结构\n- 与协议层通信\n- 缓冲区管理与并发控制\n\
  - 设备示例：以太网 NIC\n- ISA 网络驱动程序\n- 异步传输模式\n- 网络吞吐量\n- 查看源码\n\n当你为 NIC 编写驱动程序时，你必须操作三类数据结构：\n\
  \n\n\n\n\n1. 构成网络协议栈构建单元的结构。定义在 `/include/linux/sk_buff.h` 中的 `socket buffer` 或\
  \ `struct sk_buff` 是内核 TCP/IP 栈使用的关键结构。\n\n2. 定义网卡（NIC）驱动与协议栈之间接口的结构。定义在 `/include/linux/netdevice.h`\
  \ 中的 `struct net_device` 是构成该接口的核心结构。\n\n3. 与 I/O 总线相关的结构。`PCI` 及其衍生变是当今网卡常用的总线。\n\
  \n我们将在接下来两个节中详细查看套缓冲区（socket buffers）和 `net_device` 接口。我们在第 10 章“外围组件互连”中介绍过 `PCI`\
  \ 数据结构，因此在这里不再重复介绍。\n\n# 440 驱动数据结构\n# 441 \n\n## 套缓冲区 (Socket Buffers)\n\n`sk_buffs`\
  \ 为 Linux 网络层提供了高效的缓冲区处理和流控机制。类似于包含 DMA 缓冲区元数据的 DMA 描述符，`sk_buffs` 存储控制信息，描述承载网络数据包的内存缓冲区（见图\
  \ 15.1）。`sk_buffs` 是拥有数十个元素的巨大结构，但在本章中，我们仅关注对网络设备驱动编写者感兴趣的部分。一个 `sk_buff` 通过五个主要字段与其关联的数据包缓冲区链接：\n\
  \n* `head`，指向数据包的起始\n* `data`，指向数据包负载的起始\n* `tail`，指向数据包负载的结束\n* `end`，指向数据包的末尾\n\
  * `len`，数据包包含的数据量\n\n假设 `skb` 指向一个 `sk_buff`，当数据包向任一方向遍历协议栈时，`skb->head`、`skb->data`、`skb->tail`\
  \ 和 `skb->end` 会移动关联的缓冲区。例如，`skb->data` 指向当前处理数据包的协议头。当数据包通过接收路径到达 IP 层时，`skb->data`\
  \ 指向 IP 头；但当数据包传递给 TCP 时，`skb->data` 会移动到 TCP 头的起始。随着数据包通过各种协议并添加或丢弃头部数据，`skb->len`\
  \ 也会被更新。`sk_buffs` 还包含上述四个主要字段以外的指针。例如，`skb->nh` 记录网络协议头的位置，无论 `skb->data` 的当前位置如何。\n\
  \n为了说明网卡驱动如何与 `sk_buffs` 工作，图 15.1 显示了接收数据路径上的数据流转换。为了方便说明，该图简单地假设所示的操作是按顺序执行的。然而，为了真实世界中的操作效率，前两个步骤（`dev_alloc_skb()`\
  \ 和 `skb_reserve()`）在初始预分配接收缓冲区环形时执行；第三步由网卡硬件完成，它直接将接收到的数据包通过 DMA 传输到预分配的 `sk_buff`\
  \ 中；最后两个步骤（`skb_put()` 和 `netif_rx()`）则从接收中断处理程序中执行。\n\n为了创建一个持有接收到的数据包的 `sk_buff`，图\
  \ 15.1 使用了 `dev_alloc_skb()`。这是一个中断安全的例程，用于为 `sk_buff` 分配内存并将其与数据包缓冲区关联。`dev_kfree_skb()`\
  \ 完成了 `dev_alloc_skb()` 的相反操作。图 15.1 接着调用 `skb_reserve()` 在数据缓冲区起始和负载起始之间添加 2 字节的填充。这使得\
  \ IP 头从一个性能友好的 16 字节边界处开始，因为之前的以太网头部部长为 14 字节。图 15.1 中的其余代码语句用接收到的数据包填充负载缓冲区，并移动\
  \ `skb->data`、`skb->tail` 和 `skb->len` 以反映这一操作。\n\n还有更多与某些网卡驱动相关的 `sk_buff` 访问例程。例如，`skb_clone()`\
  \ 创建提供的 `sk_buff` 副本，而不拷贝关联数据包缓冲区的内容。查看 `/net/core/skbuff.c` 可获取完整的 `sk_buff` 库函数列表。\n\
  \n```c\nstruct sk_buff *skb;\n/* ... */\n\nData Buffer\nsk_buff\n\nskb = dev_alloc_skb(length\
  \ + length + data, NET_IP_ALIGN);\nNET_IP_ALIGN\nhead, tail, skb\n\nData Buffer\n\
  head\nsk_buff\nNET_IP_ALIGN\nskb_reserve(skb, NET_IP_ALIGN);\ndata, length, tail,\
  \ skb\n\nData Buffer\nhead\nsk_buff\nNET_IP_ALIGN\nmempcy(skb->data, dma_buffer,\
  \ (PACKET DATA))\ndata, length, tail, skb\n\nData Buffer\nhead\nsk_buff\nNET_IP_ALIGN\n\
  (PACKET DATA)\nskb_put(skb, length);\ndata, length, tail, skb\n\nProtocol\nTCP Stack\n\
  IP\nnetif_rx(skb);\nskb\nNIC Driver\n```\n图 15.1 sk_buff 操作。\n\n# 442 第 15 章 网络接口卡\n\
  # 443 驱动数据结构\n\n## 网络设备接口 (The Net Device Interface)\n\n网卡驱动使用标准接口与协议栈栈进行交互。`net_device`\
  \ 结构比 `sk_buff` 结构更复杂，它定义了该接口。为了探索 `net_device` 的内部构造，让我们遵循以下步骤：\n\n* 驱动使用 `alloc_netdev()`\
  \ 分配 `net_device` 结构。以以太网驱动为例，调用 `alloc_etherdev()`。WiFi 驱动（下一章讨论）调用 `alloc_80211()`。\n\
  * 接下来，驱动填充分配的 `net_device` 的各种字段，并使用 `register_netdev()` 将其注册。\n* 驱动从附属 EEPROM 读取网卡的介质访问控制（MAC）地址，并根据需要配置远程网络唤醒（WOL）。\n\
  * 如果网卡需要板载固件才能运行，驱动使用 `request_firmware()` 下载它，如第 4 章“准备基础工作”中的“微代码下载”节所述。\n\n```c\n\
  struct net_device *netdev;\nstruct priv_struct *mycard_priv;\n\nnetdev = alloc_etherdev(sizeof(struct\
  \ priv_struct));\nmycard_priv = netdev->priv;\nregister_netdev(netdev);\n```\n\n\
  ## 激活 (Activation)\n\n`net_device` 接口需要常规方法，如 `open()`、`close()` 和 `ioctl()`。当你使用\
  \ *ifconfig* 等工具激活接口时，内核会打开它：\n\n```bash\nifconfig eth0 up\n```\n\n`open()` 设置接收和传输\
  \ DMA 描述符以及其他驱动数据结构。它通过调用 `request_irq()` 注册网卡的中断处理程序。`net_device` 结构作为 `devid`\
  \ 参数传递给 `request_irq()`，以便中断处理程序可以直接访问关联的 `net_device。（查看列表 15.1 中的 `mycard_open()`\
  \ 和 `mycard_interrupt()` 以了解如何实现。）\n\n当你关闭一个激活的网络接口时，内核会调用 `close()`。这完成了 `open()`\
  \ 的相反操作。\n\n## 数据传输 (Data Transfer)\n\n数据传输方法是 `net_device` 接口的核心。在传输路径中，驱动提供了一个名为\
  \ `hard_start_xmit` 的方法，协议层通过该方法传递数据包以进行后续发送。\n\n\n\n\n\n```c\nnetdev->hard_start_xmit\
  \ = &mycard_xmit_frame; /* Transmit Method. See Listing 15.1 */\n```\n\n直到最近，网络驱动程序还没有提供用于收集接收数据的\
  \ `net_device` 方法。相反，它们通过带有数据包负载异步中断协议层。然而，这种旧接口已被`New API`（`NAPI`）所取代，`NAPI` 是中断驱动的驱动推送和轮询驱动的协议拉取的混合体。因此，感知\
  \ NAPI 的驱动程序需要提供一个 `poll()` 方法以及一个控制轮询公平性的关联 `weight`：\n\n```c\nnetdev->poll = &mycard_poll;\
  \ /* Poll Method. See Listing 15.1 */\nnetdev->weight = 64;\n```\n\n我们将在“与协议层通信”章节中详细介绍数据传输方法。\n\
  \n# 驱动程序数据结构\n\n`net_device` 接口提供了一个钩子，可以将无响应的 NIC 恢复到工作状态。如果协议层在预设时间内没有检测到任何传输，它将假设\
  \ NIC 已挂起，并调用驱动程序提供的恢复方法来重置网卡。驱动程序通过 `netdev->watchdog_timeo` 设置看狗超时，并通过 `netdev->tx_timeout`\
  \ 注册恢复函数的地址：\n\n```c\nnetdev->tx_timeout = &mycard_timeout; /* Method to reset the\
  \ NIC */\nnetdev->watchdog_timeo = 8*HZ; /* 如果 8 秒内未检测到活动则重置 */\n```\n\n由于恢复方法在定时器中断上下执行，它通常会调度一个上下文之外的任务来重置\
  \ NIC。\n\n### 统计信息\n\n为了让用户态收集网络统计信息，NIC 驱动程序填充 `net_device_stats` 结构并提供 `get_stats()`\
  \ 方法来检索它。本质上，驱动程序执行了以下操作：\n\n1. 从相关的入口点更新不同类型的统计信息：\n\n```c\n#include <linux/netdevice.h>\n\
  \nstruct net_device_stats mycard_stats;\n\nstatic irqreturn_t\nmycard_interrupt(int\
  \ irq, void *dev_id)\n{\n    /* ... */\n    if (packet_received_without_errors)\
  \ {\n        mycard_stats.rx_packets++; /* 多接收了一个数据包 */\n    }\n    /* ... */\n\
  }\n```\n\n2. 实现 `get_stats()` 方法以检索统计信息：\n\n```c\nstatic struct net_device_stats\n\
  *mycard_get_stats(struct net_device *netdev)\n{\n    /* House keeping */\n    /*\
  \ ... */\n    return(&mycard_stats);\n}\n```\n\n3. 为上层提供检索方法：\n\n```c\nnetdev->get_stats\
  \ = &mycard_get_stats;\n/* ... */\nregister_netdev(netdev);\n```\n\n要从你的 NIC 收集统计信息，可以通过执行适当的用户态命令来触发\
  \ `mycard_get_stats()` 的调用。例如，要查找通过 `eth0` 接口接收的数据包数量，请执行：\n\n```bash\nbash> cat\
  \ /sys/class/net/eth0/statistics/rx_packets\n124664\n```\n\nWiFi 驱动程序需要跟踪几个与常规 NIC\
  \ 无关的参数，因此它们除了 `get_stats()` 之外还实现了一种名为 `get_wireless_stats()` 的统计收集方法。为了便于感知 WiFi\
  \ 的用户态工具而注册 `get_wireless_stats()` 的机制，将在下一章的“WiFi”章节中讨论。\n\n### 配置\n\nNIC 驱动程序需要支持负责设置和获取设备参数的用户态工具。`Ethtool`\
  \ 为以太网 NIC 配置参数。为了支持 `ethtool`，底层的 NIC 驱动程序执行了以下操作：\n\n1. 填充在 `include/linux/ethtool.h`\
  \ 中定义的、具有规定入口点的 `ethtool_ops` 结构：\n\n```c\n#include <linux/ethtool.h>\n/* Ethtool_ops\
  \ methods */\nstruct ethtool_ops mycard_ethtool_ops = {\n    /* ... */\n    .get_eeprom\
  \ = mycard_get_eeprom, /* Dump EEPROM contents */\n    /* ... */\n};\n```\n\n2.\
  \ 实现 `ethtool_ops` 包含的方法：\n\n```c\nstatic int\nmycard_get_eeprom(struct net_device\
  \ *netdev,\n                  struct ethtool_eeprom *eeprom,\n                 \
  \ uint8_t *bytes)\n{\n    /* Access the accompanying EEPROM and pull out data */\n\
  \    /* ... */\n}\n```\n\n3. 导出其 `ethtool_ops` 的地址：\n\n```c\nnetdev->ethtool_ops\
  \ = &mycard_ethtool_ops;\n/* ... */\nregister_netdev(netdev);\n```\n\n完成这些操作后，`ethtool`\
  \ 就可以在你的以太网 NIC 上操作。使用 `ethtool` 转储 EEPROM 内容，请执行：\n\n```bash\nbash> ethtool -e\
  \ eth0\nOffset Values\n------ ------\n0x0000 00 0d 60 79 32 0a 00 0b ff ff 10 20\
  \ ff ff ff ff\n...\n```\n\nEthtool 随某些发行版一起发布；但如果你没有它，可以从 http://sourceforge.net/projects/gkernel/\
  \ 下载。详情请参阅手册页。\n\n### 偏移值\n\n### 总线相关\n\n# 与协议层通信\n\n### 接收路径\n\n### 发送路径\n\n\n\n\
  \n\n当发生传输操作完成的信号时，驱动程序可以回收或释放与发送的数据包相关的资源，例如 `DMA descriptors`、`DMA buffers` 和 `sk_buffs`。\n\
  \n## 流控制\n\n驱动程序通过分别调用 `netif_start_queue()` 和 `netif_stop_queue()` 来传达其接收协议数据的就绪情况或拒绝意愿。\n\
  \n在 `device open()` 期间，NIC 驱动程序调用 `netif_start_queue()` 请求协议层开始向出站队列添加发送数据包。然而，在正常运行期间，驱动程序可能需要停止出站队列。例如在驱动程序正在补充数据结构的时间窗口，或者当它正在关闭设备时。通过调用\
  \ `netif_stop_queue()` 实现对下游流的限流。要请求网络栈重启出站队列（例如当有足够的空闲时），NIC 驱动程序调用 `netif_wake_queue()`。\n\
  \n要检查当前的流控制状态，请调用 `netif_queue_stopped()`。\n\n450 第 15 章节 网络接口卡\n\n## 缓冲区管理与并发控制\n\
  \n高性能 NIC 驱动程序是一个复杂的软件，需要复杂的数据结构管理。正如第 10 节“数据传输”部分讨论的，NIC 驱动程序维护了发送和接收 DMA 描述符的链表（或“环形”），并实现了用于缓冲区管理的空闲和使用池。驱动程序通常采用多重策略来维护缓冲区水平：在\
  \ `device open` 期间预分配环环 `DMA descriptors` 和相关的 `sk_buffs`；当空闲缓冲区低于预设水位线时，通过分配新内存来补充空闲池；以及当\
  \ NIC 生成发送完成和接收中断时，将已用缓冲区回收到空闲池。\n\n例如，NIC 驱动程序接收环形中的每个元素填充方式如下：\n\n```c\n/* 分配一个\
  \ sk_buff 和关联的数据缓冲区。\n   见图 15.1 */\nskb = dev_alloc_skb(MAX_NIC_PACKET_SIZE);\n\
  \n/* 对齐数据指针 */\nskb_reserve(skb, NET_IP_ALIGN);\n\n/* 用于 NIC 访问的 DMA 映射。以下调用假设为\
  \ PCI\nNIC。pdev 是指向关联 pci_dev 结构体的指针 */\npci_map_single(pdev, skb->data, MAX_NIC_PACKET_SIZE,\
  \ PCI_DMA_FROMDEVICE);\n\n/* 创建包含此 sk_buff 的描述符并将其\n加入 RX 环形 */\n/* ... */\n```\n\
  \n在接收期间，NIC 直接将数据 DMA 到先述预分配环形中的 `sk_buff` 中，并中断处理器。接收中断处理程序随后将数据包传递给高层协议层。开发环形数据结构将使本讨论以及下一节中的示例驱动程序变得复杂，因此请参考\
  \ `drivers/net/e1000/` 目录下的 Intel PRO/1000 驱动程序以获取完整说明。\n\n在面对多个执行线程（如发送、接收、发送完成中断、接收中断和\
  \ NAPI 轮询）时，并发访问保护与管理此类复杂的数据结构密不可分。我们在第 2 节“探究内核”中讨论了多种并发控制技术。\n\n## 设备示例：以太网 NIC\n\
  \n现在你已经有了背景知识，是时候通过组合目前讨论的部分来编写 NIC 驱动程序了。列表 15.1 实现了一个骨架化的以太网 NIC 驱动程序。它只实现了主要的\
  \ `net_device` 方法。如需开发其他方法的帮助，请参考早些提到的 `e1000` 驱动程序。列表 15.1 通常独立于底层 I/O 总线，但略微偏向\
  \ PCI。如果你正在编写 PCI NIC 驱动程序，你必须将列表 15.1 与第 10 节实现的示例 PCI 驱动程序相结合。\n\n### 列表 15.1\
