  - TTY 驱动程序 (192)\n- 线路规范 (194)\n- 查看源码 (205)\n\n串口是许多技术和应用程序使用的基本通信通道。一种被称为 `通用异步收收发器`（UART）的芯片常用于实现串口通信。在\
  \ PC 兼容硬件上，UART 是 Super I/O 芯片组的一部分，如图 6.1 所示。\n\n尽管 RS-232 通信通道是常见的串口硬件类型，但内核的串口子系统以通用的方式构建，以服务于不同的用户。如果你执行以下操作，将接触到串口子系统：\n\
  - 通过 RS-232 串口链路运行终端会话\n- 通过拨号、蜂窝或软件调制解调器连接互联网\n- 与触摸控制器、智能卡、蓝牙芯片或红外适配接器等设备交互，这些设备使用串口传输\n\
  - 使用 USB 转串口转换器模拟串口\n- 通过 RS-485 链路进行通信，该链路具有更大的范围和更好的抗能力\n\n在本章中，让我们发现内核如何构建串口子系统。PC\
  \ 上常见的 UART 是国家半导体的 `16550`，或其他厂商的芯片，因此你会发现文档。`8250` 是之前的类型。\n\n### 分层架构\n\n正如你看到的，串口子系统的用户众多且多样。这促使开发者使用以下构建块构建分层架构：\n\
  1. **底层驱动程序**，关注 UART 或其他硬件。\n2. **tty 层**，与底层驱动程序接口。\n3. **线路规范**，对与 tty 层交换的数据进行处理。\n\
  \n为了帮助自定义实现，串口子系统还提供了核心 API，将这些层的共性提取出来。\n\n图 6.2 显示了这些层级。`N_TTY`、`N_IRDA` 和 `N_PPP`\
  \ 分别支持终端、红外和拨号网络线路规范。\n\n### 串口驱动程序\n\n为了说明分层架构的优势，让我们来看一个例子。假设你正在使用 USB 转串口适配器在没有串口的笔记本电脑上获取串口能力。一种可能的场景是你正通过\
  \ `kgdb` 从主笔记本电脑调试目标嵌入式设备上的内核（kgdb 在第 21 章“调试设备驱动程序”中讨论）。\n\n如图 6.3 所示，你首先需要在主笔记本电脑上一个合适的\
  \ USB 物理层驱动程序（UART 驱动程序的 USB 版本）。它位于内核 USB 子系统 `drivers/usb/` 中。接下来，你需要一个位于 USB\
  \ 物理层之上的 tty 驱动程序。`usbserial` 驱动程序（`drivers/usb/serial/usb-serial.c`）是在 USB 转串口转换器上实现通用\
  \ tty 的核心层。该驱动与转换器注册的特定 tty 方法（例如，如果你使用的是 Keyspan 适配器，则为 `drivers/usb/serial/keyspan.c`）共同构成\
  \ tty 层。最后，我们需要 `N_TTY` 线路规范来进行终端 I/O 处理。\n\n\n\n\n\n# 串口驱动程序\n\n16550 型 UART\n\n\
  红外\n\nUSB 转串口转换器\n\n## 物理层\n\n图 6.3 映射到内核源码的串口层。\n\nUSB\n目标设备\n嵌入式\nUART\n设备\n主机电脑\n\
  \n图 6.4 使用 USB 转串口转换器。\n\n176 页 第 6 章 串口驱动程序\n\n`tty` 驱动程序将线路规律（line discipline）和高层与\
  \ `USB` 的内部实现隔离开。事实上，线路规律仍然认为自己运行在传统的 `UART` 之上。这是因为 `tty` 驱动程序从 USB 请求块（`USB Request\
  \ Blocks` 或 `URBs`，在第 1 章“通用串行总线”中讨论）获取数据，并将其封装为 `N_TTY` 线路规律预期的格式。分层架构使得实现变得更加简单——从线路规律以上的所有块都可以不加修改地重用。\n\
  \n上一个示例使用了特定技术的 `tty` 驱动程序和通用的线路规律。反向用法也很常见。在第 16 章“无线的 Linux”中讨论的红外栈使用了通用的 `tty`\
  \ 驱动程序和名为 `N_IRDA` 的特定技术线路规律。\n\n正如你在图 6.2 和图 6.3 中所示，尽管 `UART` 驱动程序是字符驱动程序，但它们不像我们在上一节看到的普通字符驱动程序那样直接向内核系统调用暴露接口。相反，`UART`\
  \ 驱动程序（如下一章讨论的键盘驱动程序）为另一个内核层——`tty` 层服务。I/O 系统调用的之旅始于顶层线路规律之上，最终通过 `tty` 层向下传递到\
  \ `UART` 驱动程序。\n\n在本章的剩余部分，让我们仔细观察串口层的不同驱动程序组件。我们从串口栈底部的底层 `UART` 驱动程序开始，移动中层 `tty`\
  \ 驱动程序，然后到顶层线路规律驱动程序。\n\n## UART 驱动程序\n\n`UART` 驱动程序围绕三个关键数据结构。这三个结构都定义在 `include/linux/serial_core.h`\
  \ 中：\n\n1. 每个 UART 驱动程序的结构，`struct uart_driver`：\n\n```c\nstruct uart_driver {\n\
  \    struct module *owner; /* 拥有此结构的模块 */\n    const char *driver_name; /* 如 ttyS\
  \ 的名称 */\n    const char *dev_name; /* 设备节点名称 */\n    /* ... */\n    int major;\
  \ /* 主号 */\n    int minor; /* 从号 */\n    /* ... */\n    struct tty_driver *tty_driver;\
  \ /* tty 驱动程序 */\n};\n```\n\n每个字段旁边的注释解释了相关的语义。`owner` 字段提供了与上一节中讨论的 `file_operations`\
  \ 结构相同的益处。\n\n2. `struct uart_port`。每个 `UART` 驱动程序拥有的每个端口都存在该结构的实例：\n\n```c\nstruct\
  \ uart_port {\n    spinlock_t lock; /* 端口锁 */\n    unsigned int iobase; /* 输入/输出[bwl]\
  \ */\n    unsigned char __iomem *membase; /* 读取/写[bwl]*/\n    unsigned int irq;\
  \ /* 中断号 */\n    unsigned int uartclk; /* 基础 UART 时钟 */\n    unsigned char fifosize;\
  \ /* 发送 FIFO 大小 */\n    unsigned char x_char; /* xon/xoff 流控 */\n    /* ... */\n\
  };\n```\n\n3. `struct uart_ops`。这是每个 `UART` 驱动程序必须支持的入口点的超集，描述了在物理硬件上可以执行的操作。该结构中的方法由\
  \ `tty` 层调用：\n\n```c\nstruct uart_ops {\n    uint (*tx_empty)(struct uart_port *);\
  \ /* 发送 FIFO 是否为空? */\n    void (*set_mctrl)(struct uart_port *, unsigned int mctrl);\
  \ /* 设置调制解器控制参数 */\n    uint (*get_mctrl)(struct uart_port *); /* 获取调制解器控制参数 */\n\
  \    void (*stop_tx)(struct uart_port *); /* 停止传输 */\n    void (*start_tx)(struct\
  \ uart_port *); /* 开始传输 */\n    /* ... */\n    void (*shutdown)(struct uart_port\
  \ *); /* 关闭端口 */\n    void (*set_termios)(struct uart_port *, struct termios *new,\
  \ struct termios *old); /* 设置终端接口参数 */\n    /* ... */\n    void (*config_port)(struct\
  \ uart_port *, int); /* 配置 UART 端口 */\n    /* ... */\n};\n```\n\n`UART` 驱动程序与内核结合时需要采取两个重要步骤：\n\
  \n1. 通过调用 `uart_register_driver(struct uart_driver *);` 向串口核心层注册。\n2. 调用 `uart_add_one_port(struct\
  \ uart_driver *, struct uart_port *)` 注册它支持的每个独立端口。如果你的串口硬件是热插拔的，端口将在探测设备存在的入口点处注册到核心。查看第\
  \ 10 章“外设组件互连”中列表 10.4 中的 CardBus 调制解器驱动程序，这是一个串口设备热插的示例。注意，某些驱动程序使用封装注册函数 `serial8250_register_port(struct\
  \ uart_port *)`，它在内部调用了 `uart_add_one_port()`。\n\n这些数据结构和注册函数构成了所有 `UART` 驱动程序中存在的共同特征。有了这些结构和例程，让我们开发一个示例\
  \ `UART` 驱动程序。\n\n## 设备示例：手机\n\n考虑一个基于嵌入式系统级芯片（`SoC`）构建的 Linux 手机。该 SoC 有两个内置的 `UART`，但如图\
  \ 6.5 所示，它们都被用掉了——一个与蜂窝调制解器通信，另一个用于蓝牙。两个 USB 转串口芯片的串口侧通过复杂的可编程逻辑器件（`CPLD`）连接到 SoC（参见第\
  \ 18 章“嵌入式 Linux”）。`CPLD` 通过提供访问 USB 转串口的三个寄存器接口创建两个虚拟 `UART`（`UART`）。\n\n在 PC 端，使用相应的\
  \ Linux `usbserial` 驱动程序（如果是使用 FT232AM 芯片则使用 `drivers/usb/serial/ftdi_sio.c`）来创建并管理对应于\
  \ USB 端口的 `/dev/ttyUSBX` 设备节点。你可以在这些设备节点之一上运行 `minicom` 等从手机获取控制台或调试终端。在手机端，我们必须为这些\
  \ `UART` 实现一个 `UART` 驱动程序。该驱动程序创建并管理 `/dev/ttyUUX` 节点，负责设备侧的通信。\n\n图 6.5 显示的手机可以作为蓝牙设备的智能网关——连接到\
  \ GSM 网络，从而连接到互联网。例如，手机可以将来自蓝牙血压计的数据传输到位于互联网的医疗服务提供者的服务器。\n\n表 6.1 **USB_UART**\
  \ 寄存器布局\n\n| 寄存器名称 | 描述 | 离 **USB_UART** 的偏移 | 内存基 |\n| :--- | :--- | :--- | :---\
  \ |\n| `UU_STATUS_REGISTER` | 检查发送 FIFO 是否满或接收 FIFO 是否空的位 | 0x0 | |\n| `UU_READ_DATA_REGISTER`\
  \ | 从 `USB_UART` 读取字符 | 0x1 | |\n| `UU_WRITE_DATA_REGISTER` | 向 `USB_UART` 写入字符\
  \ | 0x2 | |\n\n\n\n\n互联网。或者当它在与支持蓝牙的心率监测器通信时检测到问题，它可以向医生发出警报。第 13 章“音频驱动”中使用的蓝牙\
  \ MP3 播放器以及第 16 章中使用的蓝牙胶囊分配器也是使用 Linux 手机联网设备的示例。\n\n列表 6.1 实现了 `USB_UART` 驱动。它被实现为一个\
  \ `platform driver`（平台驱动程序）。平台是一个伪总线，通常用于将集成到 SoC 中的轻量级设备与 Linux 设备模型连接起来。一个平台包含：\n\
  \n1. 一个平台设备（platform device）。特定架构的设置代码使用 `platform_device_register()` 或其更简单的版本 `platform_device_register_simple()`\
  \ 添加平台设备。你也可以使用 `platform_add_devices()` 一次性注册多个平台设备。在 `include/linux/platform_device.h`\
  \ 中定义的 `platform_device` 结构表示一个平台设备：\n\n```c\nstruct platform_device {\n    const\
  \ char *name; /* 设备名称 */\n    u32 id; /* 使用此字段注册多个\n    平台设备的实例。在\n    此示例中，两个 USB_UART\n\
  \    有不同的 ID。 */\n    struct device dev; /* 包含 release() 方法和\n    平台数据 */\n    /*\
  \ ... */\n};\n```\n\n2. 一个平台驱动程序（platform driver）。平台驱动程序通过 `platform_driver_register()`\
  \ 将自己注册到平台中。同样在 `include/linux/platform_device.h` 中定义的 `platform_driver` 结构表示一个平台驱动程序：\n\
  \n```c\nstruct platform_driver {\n    int (*probe)(struct platform_device *); /*Probe\
  \ 方法*/\n    int (*remove)(struct platform_device *);/*Remove 方法*/\n    /* ... */\n\
  \    /*后续结构中的 name 字段应与关联的 platform_device\n    结构中的 name 字段匹配 */\n    struct device_driver\
  \ driver;\n};\n```\n\n更多关于平台设备和驱动程序的信息请参见 `Documentation/driver-model/platform.txt`。为了简单起见，我们的示例驱动同时注册了平台设备和平台驱动程序。\n\
  \n在初始化期间，`USB_UART` 驱动首先使用 `uart_register_driver()` 注册到串口内核核心（serial core）。完成后，你会在\
  \ `/proc/tty/drivers*` 中找到一个以 `usb_uart` 开头的新行。接下来，驱动使用 `platform_device_register_simple()`\
  \ 注册两个平台设备（每个 `USB_UART` 一个）。如前所述，平台设备的注册通常在启动时的板级设置期间完成。之后，驱动使用 `platform_driver_register()`\
  \ 注册平台驱动入口点（`probe()`、`remove()`、`suspend()` 和 `resume()`）。`USB_UART` 平台驱动连接到上述两个平台设备并具有匹配的名称（`usb_uart`）。在此步骤之后，你将看到\
  \ sysfs 中两个两个目录，每个对应一个 USB_UART 端口：`/sys/devices/platform/usb_uart.0/` 和 `/sys/devices/platform/usb_uart.1/`。\n\
  \n由于 Linux 设备层现在检测到与已注册的 `USB_UART` 平台设备名称匹配的平台驱动，它会为每个 `USB_UART` 调用一次属于平台驱动的 `probe()`\
  \ 入口点（`usb_uart_probe()`）。probe 入口点使用 `uart_add_one_port()` 添加关联的 `USB_UART` 端口。这触发了\
  \ `config_port()` 入口点（之前讨论过的 `uart_ops` 结构的一部分）的调用，用于占用并映射 `USB_UART` 寄存器空间。如果两个\
  \ `USB_UART` 端口都成功添加，串口内核将发出以下内核消息：\n\n```\nttyUU0 at MMIO 0xe8000000 (irq = 3)\
  \ is a USB_UART\nttyUU1 at MMIO 0xe9000000 (irq = 4) is a USB_UART\n```\n\n然而，占用\
  \ IRQ 会延迟到应用程序打开 `USB_UART` 端口。当应用程序关闭 `USB_UART` 时，释放 IRQ。表 6.2 追踪了驱动占用和释放内存区域及\
  \ IRQ 的代码路径。\n\n### 表 6.2 占用和释放内存与 IRQ 资源\n\n| 模块 | 动作 | 函数 |\n| :--- | :--- | :---\
  \ |\n| `usb_uart_uart` | 插入 | `request_mem_region()` |\n| `usb_uart_driver` | init\
  \ | `register_uart_driver()` |\n| `usb_uart_port` | probe | `uart_add_one_port()`\
  \ |\n| `usb_uart_port` | - | `config_port()` |\n| `usb_uart_uart` | Unload | `unregister_uart_driver()`\
  \ |\n| `usb_uart_driver` | exit | `remove()` |\n| `usb_uart_port` | remove | `remove_one_port()`\
  \ |\n| `usb_uart_port` | - | `release_mem_region()` |\n| `usb_uart_startup` | Open\
  \ | `request_irq()` |\n| `/dev/ttyUUX` | - | - |\n| `usb_uart_shutdown` | Close\
  \ | `free_irq()` |\n| `/dev/ttyUUX` | - | - |\n\n在发送路径中，驱动从与 `UART` 端口关联的循环缓冲区收集输出数据。从\
  \ `UART` 驱动的 `start_tx()` 点可以看出，数据存在于 `port->info->xmit.buf[port->info->xmit.tail]`\
  \ 中。\n\n在接收路径中，驱动使用 `tty_flip()` 将数据从 `UART` 推送到 `tty` 缓冲区。这是在 `UART` 中断处理程序中完成的。\n\
  \n UART Drivers\n\n```c\n#include <linux/console.h>\n#include <linux/platform_device.h>\n\
  #include <linux/tty.h>\n#include <linux/tty_flip.h>\n#include <linux/serial_core.h>\n\
  #include <linux/serial.h>\n#include <asm/irq.h>\n#include <asm/io.h>\n\n#define\
  \ USB_UART_MAJOR 2\n#define USB_UART_MINOR 7\n#define USB_UART_PORTS 2\n#define\
  \ USB_UART_START 3\n\n#define USB_UART1_BASE 0xe8000000\n#define USB_UART2_BASE\
  \ 0xe9000000\n#define USB_UART_REGISTER_SPACE 0x3\n#define USB_UART_TX_FULL 0x20\n\
  #define USB_UART_RX_EMPTY 0x10\n#define USB_UART_STATUS 0x0F\n#define USB_UART1_IRQ\
  \ 3\n#define USB_UART2_IRQ 4\n#define USB_UART_FIFO_SIZE 32\n#define USB_UART_CLK_FREQ\
  \ 16000000\n\nstatic struct uart_port usb_uart_port[];\n\n/* 向 USB_UART 端口写入字符 */\n\
  static void\nusb_uart_putc(struct uart_port *port, unsigned char c)\n{\n    /* 等待\
  \ UART FIFO 有空间\n    通过查看状态寄存器中的 USB_UART_TX_FULL 位来感知 */\n    while (__raw_readb(port->membase)\
  \ & USB_UART_TX_FULL);\n    /* 将字符写入数据端口 */\n    __raw_writeb(c, (port->membase+1));\n\
  }\n\n/* 从 UART 读取字符 */\nstatic unsigned char\nusb_uart_getc(struct uart_port *port)\n\
  {\n    /* 等待 RX_FIFO 中可用数据 */\n    while (__raw_readb(port->membase) & USB_UART_RX_EMPTY);\n\
  \    /* 获取数据 */\n    return(__raw_readb(port->membase+2));\n}\n\n/* 获取 USB_UART\
  \ 状态 */\nstatic unsigned char\nusb_uart_status(struct uart_port *port)\n{\n    return(__raw_readb(port->membase)\
  \ & USB_UART_STATUS);\n}\n\n/*\n* 占用连接到 USB_UART 端口的内存区域。\n* 当驱动通过 uart_add_one_port()\
  \ 添加 USB_UART 端口时调用。 */\nstatic int\nusb_uart_request_port(struct uart_port *port)\n\
  {\n    if (!request_mem_region(port->mapbase, USB_UART_REGISTER_SPACE,\n\"usb_uart\"\
  )) {\n        return -EBUSY;\n    }\n}\n```\n\n\n\n\n```c\n/* 释放与 USB_UART 端口关联的内存区域。\n\
  * 当驱动程序通过 uart_remove_one_port() 移除 USB_UART 端口时调用。\n */\nstatic void\nusb_uart_release_port(struct\
  \ uart_port *port)\n{\n  release_mem_region(port->mapbase, USB_UART_REGISTER_SPACE);\n\
  }\n\n/*\n* 配置 USB_UART。当驱动程序添加 USB_UART 端口时调用。\n*/\nstatic void\nusb_uart_config_port(struct\
  \ uart_port *port, int flags)\n{\n  if (flags & UART_CONFIG_TYPE && usb_uart_request_port(port)\
  \ == 0)\n  {\n    port->type = PORT_USB_UART;\n  }\n}\n\n/* 接收中断处理程序 */\nstatic\
  \ irqreturn_t\nusb_uart_rxint(int irq, void *dev_id)\n{\n  struct uart_port *port\
  \ = (struct uart_port *) dev_id;\n  struct tty_struct *tty = port->info->tty;\n\
  \  unsigned int status, data;\n  /* ... */\n  do {\n    /* ... */\n    /* 读取数据 */\n\
  \    data = usb_uart_getc(port);\n    /* 正常、溢出、校验错误、帧错误? */\n    status = usb_uart_status(port);\n\
  \    /* 分发到 tty 层 */\n    tty_insert_flip_char(tty, data, status);\n    /* ... */\n\
  \  } while (more_chars_to_be_read()); /* 更多字符 */\n  /* ... */\n  tty_flip_buffer_push(tty);\n\
  \  return IRQ_HANDLED;\n}\n\n/* 当应用程序打开 USB_UART 时调用 */\nstatic int\nusb_uart_startup(struct\
  \ uart_port *port)\n{\n  int retval = 0;\n  /* ... */\n  /* 请求 IRQ */\n  if ((retval\
  \ = request_irq(port->irq, usb_uart_rxint, 0,\n  \"usb_uart\", (void *)port))) {\n\
  \    return retval;\n  }\n  /* ... */\n  return retval;\n}\n\n/* 当应用程序关闭 USB_UART\
  \ 时调用 */\nstatic void\nusb_uart_shutdown(struct uart_port *port)\n{\n  /* ... */\n\
  \  /* 释放 IRQ */\n  free_irq(port->irq, port);\n  /* 通过向适当寄存器写入禁用中断 */\n  /* ...\
  \ */\n}\n\n/* 设置 UART 类型为 USB_UART */\nstatic const char *\nusb_uart_type(struct\
  \ uart_port *port)\n{\n  return port->type == PORT_USB_UART ? \"USB_UART\" : NULL;\n\
  }\n\n/* 开始传输字节 */\nstatic void\nusb_uart_start_tx(struct uart_port *port)\n{\n \
  \ while (1) {\n    /* 从 UART 圆形缓冲区中获取数据并\n    * 写入 USB_UART 的 WRITE_DATA 寄存器 */\n\
  \    usb_uart_putc(port,\n    port->info->xmit.buf[port->info->xmit.tail]);\n  \
  \  /* 调整 UART 缓冲区尾部 */\n    port->info->xmit.tail = (port->info->xmit.tail + 1)\
  \ &\n    (UART_XMIT_SIZE - 1);\n    /* 统计信息 */\n    port->icount.tx++;\n    /* 如果\
  \ UART 缓冲区中没有更多可用数据则结束 */\n    if (uart_circ_empty(&port->info->xmit)) break;\n\
  \  }\n  /* ... */\n}\n\n/* UART 操作结构 */\nstatic struct uart_ops usb_uart_ops = {\n\
  \  .start_tx = usb_uart_start_tx, /* 开始传输 */\n  .startup = usb_uart_startup, /*\
  \ 应用打开 USB_UART */\n  .shutdown = usb_uart_shutdown, /* 应用关闭 USB_UART */\n  .type\
  \ = usb_uart_type, /* 设置 UART 类型 */\n  .config_port = usb_uart_config_port, /* 当驱动添加\n\
  \  * USB_UART 端口时进行配置 */\n  .request_port = usb_uart_request_port,# 申请与\n  * USB_UART\
  \ 端口关联的资源 */\n  .release_port = usb_uart_release_port,# 释放与\n  * USB_UART 端口关联的资源\
  \ */\n#if 0 /* USB_UART 尚未实现 */\n  .tx_empty = usb_uart_tx_empty, /* 发送器忙? */\n\
  \  .set_mctrl = usb_uart_set_mctrl, /* 设置调制解器控制 */\n  .get_mctrl = usb_uart_get_mctrl,\
  \ /* 获取调制解器控制\n  .stop_tx = usb_uart_stop_tx, /* 停止传输 */\n  .stop_rx = usb_uart_stop_rx,\
  \ /* 停止接收 */\n  .enable_ms = usb_uart_enable_ms, /* 启用调制解器状态\n  * 信号 */\n  .set_termios\
  \ = usb_uart_set_termios, /* 设置 termios */\n#endif\n};\n\nstatic struct uart_driver\
  \ usb_uart_reg = {\n  .owner = THIS_MODULE, /* 所有者 */\n  .driver_name = \"usb_uart\"\
  , /* 驱动名称 */\n  .dev_name = \"ttyUU\", /* 节点名称 */\n  .major = USB_UART_MAJOR, /*\
  \ 主号 */\n  .minor = USB_UART_MINOR_START, /* 次号起始 */\n  .nr = USB_UART_PORTS, /*\
  \ UART 端口数量 */\n  .cons = &usb_uart_console, /* 控制台\n  * 结构。在第 2 章“驱动”中讨论 */\n};\n\
  \n/* 当平台驱动被注销时调用 */\nstatic int\nusb_uart_remove(struct platform_device *dev)\n\
  {\n  platform_set_drvdata(dev, NULL);\n  /* 从串口核心移除\n  * USB_UART 端口 */\n  uart_remove_one_port(&usb_uart_reg,\
  \ &usb_uart_port[dev->id]);\n  return 0;\n}\n\n/* 挂起事件 */\nstatic int\nusb_uart_suspend(struct\
  \ platform_device *dev, pm_message_t state)\n{\n  uart_suspend_port(&usb_uart_reg,\
  \ &usb_uart_port[dev->id]);\n  return 0;\n}\n\n/* 挂起后恢复 */\nstatic int\nusb_uart_resume(struct\
  \ platform_device *dev)\n{\n  uart_resume_port(&usb_uart_reg, &usb_uart_port[dev->id]);\n\
  \  return 0;\n}\n\n/* 每个支持的 USB_UART 端口参数 */\nstatic struct uart_port usb_uart_port[]\
  \ = {\n  {\n    .mapbase = (unsigned int) USB_UART1_BASE,\n    .iotype = UPIO_MEM,\
  \ /* 内存映射 */\n    .irq = USB_UART1_IRQ, /* IRQ */\n    .uartclk = USB_UART_CLK_FREQ,\
  \ /* 时钟频率 */\n    .fifosize = USB_UART_FIFO_SIZE, /* FIFO 大小 */\n    .ops = &usb_uart_ops,\
  \ /* UART 操作 */\n    .flags = UPF_AUTOCF, /* UART 端口标记 */\n    .line = 0, /* UART\
  \ 端口号 */\n  },\n  {\n    .mapbase = (unsigned int) USB_UART2_BASE,\n    .iotype\
  \ = UPIO_MEM, /* 内存映射 */\n    .irq = USB_UART2_IRQ, /* IRQ */\n    .uartclk = USB_UART_CLK_FREQ,\
  \ /* 时钟频率 */\n    .fifosize = USB_UART_FIFO_SIZE, /* FIFO 大小 */\n    .ops = &usb_uart_ops,\
  \ /* UART 操作 */\n    .flags = UPF_AUTOCF, /* UART 端口标记 */\n    .line = 1, /* UART\
  \ 端口号 */\n  }\n};\n\n/* 平台驱动 probe */\nstatic int __init\nusb_uart_probe(struct\
  \ platform_device *dev)\n{\n  /* ... */\n  /* 添加 USB_UART 端口。此函数在 tty 层注册该设备\n \
  \ *并触发 config_port() 入口的调用 */\n  uart_add_one_port(&usb_uart_reg, &usb_uart_port[dev->id]);\n\
  \  platform_set_drvdata(dev, &usb_uart_port[dev->id]);\n  return 0;\n}\n\nstruct\
  \ platform_device *usb_uart_plat_device1; /* USB_UART 1 的平台设备 */\nstruct platform_device\
  \ *usb_uart_plat_device2; /* USB_UART 2 的平台设备 */\nstatic struct platform_driver\
  \ usb_uart_driver = {\n  .probe = usb_uart_probe, /* probe 方法 */\n  .remove = __exit(usb_uart_remove),\
  \ /* detach 方法 */\n  .suspend = usb_uart_suspend, /* 电源挂起 */\n  .resume = usb_uart_resume,\
  \ /* 挂起后恢复 */\n  .driver = {\n    .name = \"usb_uart\", /* 驱动名称 */\n  },\n};\n\n\
  /* 驱动初始化 */\nstatic int __init\nusb_uart_init(void)\n{\n  int retval;\n  /* 向串口核心注册\
  \ USB_UART 驱动 */\n  if ((retval = uart_register_driver(&usb_uart_reg))) {\n    return\
  \ retval;\n  }\n  /* 注册 USB_UART 1 的平台设备。通常在\n  * 特定架构配置期间调用 */\n  usb_uart_plat_device1\
  \ = platform_device_register_simple(\"usb_uart\", 0, NULL, 0);\n  if (IS_ERR(usb_uart_plat_device1))\
  \ {\n    uart_unregister_driver(&usb_uart_reg);\n    return PTR_ERR(usb_uart_plat_device1);\n\
  \  }\n  /* 注册 USB_UART 2 的平台设备。通常在\n  * 特定架构配置期间调用 */\n  usb_uart_plat_device2 =\
  \ platform_device_register_simple(\"usb_uart\", 1, NULL, 0);\n  if (IS_ERR(usb_uart_plat_device2))\
  \ {\n    uart_unregister_driver(&usb_uart_reg);\n    platform_device_unregister(usb_uart_plat_device1);\n\
  \    return PTR_ERR(usb_uart_plat_device2);\n  }\n  /* 为上述注册的平台设备宣布\n  * 匹配驱动 */\n\
  \  if ((retval = platform_driver_register(&usb_uart_driver))) {\n    uart_unregister_driver(&usb_uart_reg);\n\
  \    platform_device_unregister(usb_uart_plat_device1);\n    platform_device_unregister(usb_uart_plat_device2);\n\
  \  }\n  return 0;\n}\n\n/* 驱动退出 */\nstatic void __exit\nusb_uart_exit(void)\n{\n\
  \  /* 注销顺序非常重要。在注销平台驱动之前\n  * 注销 UART 驱动会导致系统崩溃 */\n  /* 注销平台驱动 */\n  platform_driver_unregister(&usb_uart_driver);\n\
  \  /* 注销平台设备 */\n  platform_device_unregister(usb_uart_plat_device1);\n  platform_device_unregister(usb_uart_plat_device2);\n\
  \  /* 注销 USB_UART 驱动 */\n  uart_unregister_driver(&usb_uart_reg);\n}\n```\n\n\n\n\
  \n\n```\nmodule_init(usb_uart_init);\n\nmodule_exit(usb_uart_exit);\n```\n\n## RS-485\n\
  \nRS-485 像 RS-232 那样的标准 PC 接口，但在嵌入式领域，你可能会遇到使用 RS-485 连接与控制系统进行可靠通信的计算机。RS-485 使用差分信号，使其能够在长达几千英里的距离内交换数据，而\
  \ RS-232 的范围仅为几十英尺。在处理器端，RS-485 接口是一个以半双工模式运行的 `UART`。因此，在从发送 FIFO 发送数据到总线之前，`UART`\
  \ 设备驱动程序需要额外启用 RS-485 发送器并禁用接收器，这可能通过翻转相关的 GPIO 引脚来实现。要从总线获取数据并放入接收 FIFO，`UART`\
  \ 驱动程序必须执行相反的操作。\n\n你必须在串口层中适当的位置启用/禁用 RS-485 发送器/接收器。如果你过早禁用发送器，它可能没有足够的时间来清空发送\
  \ FIFO 中的最后字节，这会导致数据截断。另一方面，如果你禁用发送器太太晚，你会阻止这段时间的数据接收，这可能导致接收数据丢失。\n\nRS-485 支持多点连接，因此如果你有多个设备连接到总线，高层协议必须实现适当的寻址机制。RS-485\
  \ 不支持使用 `请求发送` (RTS) 和 `清除发送` (CTS) 的硬件流控线。\n\n192 第 6 章 串口驱动\n\n## TTY 驱动\n\n现在让我们来看\
  \ tty 驱动核心的结构和注册函数。三个结构对于它们的运行至关重要：\n\n1. 定义在 `include/linux/tty.h` 中的 `struct tty_struct`。该结构包含了与打开的\
  \ tty 关联的所有状态信息。它是一个巨大的结构，但这里是一些重要的字段：\n\n```c\nstruct tty_struct {\n    int magic;\
  \ /* 魔数标记 */\n    struct tty_driver *driver; /* 指向 tty 驱动的指针 */\n    struct tty_ldisc\
  \ ldisc; /* 绑定的线路规律 */\n    /* ... */\n    struct tty_flip_buffer flip; /* 翻转缓冲区。见下文。\
  \ */\n    /* ... */\n    wait_queue_head_t write_wait; /* 查看“线路规律”章节 */\n    wait_queue_head_t\
  \ read_wait; /* 查看“线路规律”章节 */\n    /* ... */\n};\n```\n\n2. `struct tty_flip_buffer`\
  \ 或嵌入在 `tty_struct` 内部的翻转缓冲区。这是数据采集和处理机制的核心：\n\n```c\nstruct tty_flip_buffer {\n\
  \    /* ... */\n    struct semaphore pty_sem; /* 序列化 */\n    char *char_buf_ptr;\
  \ /* 指向翻转缓冲区的指针 */\n    /* ... */\n    unsigned char char_buf[2*TTY_FLIPBUF_SIZE];\
  \ /* 翻转缓冲区 */\n    /* ... */\n};\n```\n\n底层串口驱动程序使用翻转缓冲区的一半来收集数据，而线路规律使用另一半来处理数据。串口驱动和线路规律使用的指针随后会被翻转，然后继续过程。查看\
  \ `drivers/char/tty_io.c` 中的函数 `flush_to_ldisc()` 来查看翻转的实际运作。\n\n在最近内核中，`tty_flip_buffer`\
  \ 结构经过了某种重新设计。它现在由一个缓冲区头 (`tty_bufhead`) 和缓冲区列表 (`tty_buffer`) 组成：\n\n```c\nstruct\
  \ tty_bufhead {\n    /* ... */\n    struct semaphore pty_sem; /* 序列化 */\n    struct\
  \ tty_buffer *head, tail, free; /* 查看下文 */\n    /* ... */\n};\n\nstruct tty_buffer\
  \ {\n    struct tty_buffer *next;\n    char *char_buf_ptr; /* 指向翻转缓冲区的指针 */\n  \
  \  /* ... */\n    unsigned long data[0]; /* 翻转缓冲区，其内存动态分配 */\n};\n```\n\n3. 定义在\
  \ `include/linux/tty_driver.h` 中的 `struct tty_driver`。它规定了 tty 驱动与高层之间的编程接口：\n\n\
  ```c\nstruct tty_driver {\n    int magic; /* 魔数 */\n    /* ... */\n    int major;\
  \ /* 主设备号 */\n    int minor_start; /* 从设备号起始 */\n    /* ... */\n    /* tty 驱动与高层之间的接口例\
  \ */\n    int (*open)(struct tty_struct *tty, struct file *filp);\n    void (*close)(struct\
  \ tty_struct *tty, struct file *filp);\n    int (*write)(struct tty_struct *tty,\
  \ const unsigned char *buf, int count);\n    void (*put_char)(struct tty_struct\
  \ *tty, unsigned char ch);\n    /* ... */\n};\n```\n\n像 UART 驱动一样，tty 驱动需要执行两个步骤来向内核注册自己：\n\
  \n1. 调用 `tty_register_driver(struct tty_driver *tty_d)` 向 tty 核心注册自己。\n2. 调用 `tty_register_device(struct\
  \ tty_driver *tty_d, unsigned device_index, struct device *device)` 注册每个 tty。\n\n\
  我们不会开发一个示例，但这里是 Linux 中常见的：\n\n- 蓝牙串口仿真，在第 16 章中讨论，实现在 `drivers/net/bluetooth/rfcomm/tty.c`，初始化期间调用\
  \ `tty_register_driver()`并在处理接入连接时调用 `tty_register_device()`。\n- 为了与控制台工作，文本模式需要虚拟终端\
  \ (VT) 的服务，图形模式则需要伪终端 (PTY)。VT 和 PTY 分别实现在 `drivers/char/vt.c` 和 `drivers/char/pty.c`。\n\
  - 传统 UART 的串口驱动位于 `drivers/serial/serial_core.c`。\n- USB 串口\n\n## 线路规律\n\n线路规律提供了一种优雅的机制，允许使用相同的串口驱动运行不同的技术。底层物理驱动和\
  \ tty 驱动处理与硬件之间的数据传输，而线路规律负责在内核空间和用户空间之间处理数据。\n\n串口子系统支持 17 种标准线路规律。打开串口时默认绑定的线路规律是\
  \ `N_TTY`，它实现了终端 I/O 处理。`N_TTY` 负责对来自键盘的字符进行“加工”。根据用户请求，它可以将字符映射为换行、将小写转换为大写、扩展制表符并将字符回显到关联\
  \ VT。`N_TTY` 还支持编辑器使用的*原始*模式，它将所有处理交给用户应用程序。查看下一章“输入驱动”中的图 7.3 可以了解键盘子系统如何连接到 `N_TTY`。上一节“TTY\
  \ 驱动”末尾列出的示例 tty 驱动默认使用 `N_TTY`。\n\n线路规律还通过串口传输协议实现网络接口。例如，作为*点对点协议* (`N_PPP`) 和\
  \ *串口链路 IP 协议* (`N_SLIP`) 子系统的线路规律负责封装数据包、分配并填充相关的网络数据结构，并将数据传递给相应的网络协议栈。其他线路规律处理*红外数据*\
  \ (`N_IRDA`) 和*蓝牙主机控制接口* (`N_HCI`)。\n\n## 设备示例：触摸控制器\n\n让我们通过为一个串口触摸控制器实现一个简单的线路规律来查看线路规律的内部。图\
  \ 6.6 显示了触摸控制器在嵌入式笔记本衍生上的连接方式。触摸控制器的*有限状态机* (FSM) 是实现为线路规律的候选者，因为它可以利用串口层提供的设施和接口。\n\
  \n```\n图 6.6 PC 衍生设备上触摸控制器的连接图。\n\n**处理器**\n**北桥**\n**南桥**\n**超级 I/O** (Super I/O)\n\
  \nLPC 总线\nUART\n**触摸控制器**\n\n触摸面板\n```\n\n196 第 6 章 串口驱动\n\n打开和关闭\n\n\n\n\n\n要创建一个行律（line\
  \ discipline），需要定义一个 `struct tty_ldisc` 并向内核注册一组指定的入口点。列表 6.2 包含了一段代码片段，它为示例触摸控制器执行了这两个操作。\n\
  \n### 列表 6.2 行律操作\n\n```c\nstruct tty_ldisc n_touch_ldisc = {\n    TTY_LDISC_MAGIC,\
  \ /* 幻术数字 */\n    \"n_tch\", /* 行律名称 */\n    N_TCH, /* 行律 ID 编号 */\n    n_touch_open,\
  \ /* 打开行律 */\n    n_touch_close, /* 关闭行律 */\n    n_touch_flush_buffer, /* 刷新行律的读缓冲区\
  \ */\n    n_touch_chars_in_buffer, /* 获取行律读缓冲区中已处理的字符数 */\n    n_touch_read, /*\
  \ 当从用户空间请求数据时调用 */\n    n_touch_write, /* 写入方法 */\n    n_touch_ioctl, /* I/O 控制命令\
  \ */\n    NULL, /* 我们没有 set_termios 例程 */\n    n_touch_poll, /* 轮询 */\n    n_touch_receive_buf,\
  \ /* 由底层驱动调用以将数据传递给用户空间*/\n    n_touch_receive_room, /* 返回行律读缓冲区中剩余空间 */\n    n_touch_write_wakeup\
  \ /* 当底层设备驱动准备好传输更多数据时调用 */\n};\n\n/* ... */\nif ((err = tty_register_ldisc(N_TCH,\
  \ &n_touch_ldisc))) {\n    return err;\n}\n```\n\n### 行律\n\n在列表 6.2 中，`n_tch` 是行律的名称，`N_TCH`\
  \ 是行律标识符。你必须在 `include/linux/tty.h` 中指定 `N_TCH` 的值，该头文件包含了所有的行律定义。系统中活跃的行律可以在 `/proc/tty/ldiscs`\
  \ 中找到。\n\n行律从 tty 翻转缓冲区（flip buffer）的一半收集数据，对其进行处理，并将结果数据复制到本地读缓冲区。对于 `N_TCH`，`n_touch_receive_room()`\
  \ 返回读缓冲区中剩余的内存，而 `n_touch_chars_in_buffer()` 返回读缓冲区中准备好交付给用户空间的已处理字符数。`n_touch_write()`\
  \ 和 `n_touch_write_wakeup()` 什么都不做，因为 `N_TCH` 是一个只读设备。`n_touch_open()` 负责为主行律数据结构分配内存，如列表\
  \ 6.3 所示。\n\n### 列表 6.3 打开行律\n\n```c\n/* 用于实现触摸控制器有限状态机 (FSM) 的私有结构。控制器和处理器使用 FSM\
  \ 实现的协议进行通信 */\nstruct n_touch {\n    int current_state; /* 有限状态机 */\n    spinlock_t\
  \ touch_lock; /* 自旋锁 */\n    struct tty_struct *tty; /* 关联的 tty */\n    /* 统计和其他管理工作\
  \ */\n    /* ... */\n} *n_tch;\n\n/* 设备 open() */\nstatic int\nn_touch_open(struct\
  \ tty_struct *tty)\n{\n    /* 为 n_tch 分配内存 */\n    if (!(n_tch = kmalloc(sizeof(struct\
  \ n_touch), GFP_KERNEL))) {\n        return -ENOMEM;\n    }\n    memset(n_tch, 0,\
  \ sizeof(struct n_touch));\n    tty->disc_data = n_tch; /* 其他入口点现在可以直接访问 n_tch */\n\
  \    /* 分配用于从 tty 翻转缓冲区拷贝数据数据的行律本地读缓冲区 */\n    tty->read_buf = kmalloc(BUFFER_SIZE,\
  \ GFP_KERNEL);\n    if (!tty->read_buf) return -ENOMEM;\n    /* 清除读缓冲区 */\n    memset(tty->read_buf,\
  \ 0, BUFFER_SIZE);\n    /* 初始化锁 */\n    spin_lock_init(&ntch->touch_lock);\n   \
  \ /* 初始化其他必要的 tty 字段。示例参见 drivers/char/n_tty.c */\n    /* ... */\n    return 0;\n\
  }\n```\n\n你可能希望在当连接到触摸控制器的串口打开时，将 `N_TCH` 设置为默认行律（而不是 `N_TTY`）。请参见“更改行律”章节以查看如何从用户空间更改行律。\n\
  \n### 读取路径\n\n对于中断驱动的设备，读取数据路径通常由两个协同工作的线程组成：\n\n1. 源自请求读取的用户进程的顶端线程（top thread）。\n\
  2. 源自中断处理程序的下半线程（bottom thread），负责从设备收集数据。\n\n图 6.7 显示了这些线程与读取数据流关联。中断处理程序将 `receive_buf()`\
  \ 方法（我们的示例中的 `n_touch_receive_buf()`）作为一个任务放入队列。你可以通过设置 `tty->low_latency` 标志来覆盖此行为。\n\
  \n触摸控制器和处理器使用控制器数据表中描述的特定协议进行通信。如前所述，驱动使用 FSM 实现了这一通信协议。列表 6.4 将此 FSM 编码为 `receive_buf()`\
  \ 入口点 `n_touch_receive_buf()` 的一部分。\n\n### 列表 6.4 n_touch_receive_buf() 方法\n\n```c\n\
  /* 在行律的 tty 翻转缓冲区一半上工作 */\nstatic void n_touch_receive_buf(struct tty_struct *tty,\
  \ unsigned char *cp, int count) {\n    /* 使用有限状态机解释命令/数据 */\n    switch (tty->disc_data->current_state)\
  \ {\n        case RESET:\n            /* 向控制器发出重置命令 */\n            driver->write(tty,\
  \ 0, mode_stream_command, sizeof(mode_stream_command));\n            tty->disc_data->current_state\
  \ = STREAM_DATA;\n            break;\n        case STREAM_DATA:\n            /*\
  \ ... */\n            break;\n        case PARSING:\n            /* ... */\n   \
  \         tty->disc_data->current_state = PARSED;\n            break;\n    }\n\n\
  \    if (tty->disc_data->current_state == PARSED) {\n        /* 如果解析了一个数据包，将坐标和方向信息拷贝到读缓冲区\
  \ */\n        spin_lock_irqsave(&tty->disc_data->touch_lock, flags);\n        for\
  \ (i=0; i < PACKET_SIZE; i++) {\n            tty->disc_data->read_buf[tty->disc_data->read_head]\
  \ = tty->disc_data->current_pkt[i];\n            tty->disc_data->read_head = (tty->disc_data->read_head\
  \ + 1) & (BUFFER_SIZE - 1);\n            tty->disc_data->read_cnt++;\n        }\n\
  \        spin_lock_irqrestore(&tty->disc_data->touch_lock, flags);\n    }\n}\n```\n\
  \n### 列表 6.5 唤醒读取线程并对串口驱动限流\n\n```c\n/* n_touch_receive_buf() 继续.. */\n/* 1. 唤醒顶端线程\
  \ */\nwake_up_interruptible(&tty->read_wait);\n\n/* 2. 如果行律的读缓冲区空间不足，请求驱动进行限流 */\n\
  if (tty->disc_data->read_cnt > THROTTLE_THRESHOLD) {\n    driver->throttle(tty);\n\
  }\n```\n\n\n\n\n\n```c\n/* 唤醒任何等待数据的线程 */\n\nif (waitqueue_active(&tty->read_wait)\
  \ &&\n    (tty->read_cnt >= tty->minimum_to_wake)) {\n    wake_up_interruptible(&tty->read_wait);\n\
  }\n\n/* 如果缓冲区空间即将耗尽，请求串口驱动程序节流传入的数据 */\nif (n_touch_receive_room(tty) < TOUCH_THROTTLE_THRESHOLD)\
  \ {\n    tty->driver.throttle(tty);\n}\n\n/* ... */\n```\n\n# 第 6 章：串口驱动程序\n\n等待队列（`tty->read_wait`）用于在\
  \ `ldisc.read()` 和 `ldisc.receive_buf()` 线程之间同步。当 `ldisc.read()` 未找到可读数据时，它会将调用进程加入等待队列；而当\
  \ `ldisc.receive_buf()` 有数据可读时，它会唤醒 `ldisc.read()` 线程。因此，`n_touch_read()` 执行了以下操作：\n\
  \n- 如果还没有可读数据，则将调用进程置于 `read_wait` 队列上休眠。当数据到达时，`n_touch_receive_buf()` 会唤醒该进程。\n\
  - 如果数据可用，则从本地读取缓冲区（`tty->read_buf[tty->read_tail]`）收集数据并将其调度到用户空间。\n- 如果串口驱动程序已被节流，且在此次读取后读取缓冲区有足够的空间，则请求串口驱动程序取消节流。\n\
  \n网络线路规通常分配一个 `sk_buff`（第 15 章“网络接口卡”中讨论的基础 Linux 网络数据结构）并将其作为读取缓冲区。它们没有 `read()`\
  \ 方法，因为相应的 `receive_buf()` 将接收到的数据拷贝到分配的 `sk_buff` 中，并直接传递给相关的协议栈。\n\n## 写路径\n\n\
  线路规的 `write()` 入口会在将数据传递给底层驱动程序之前执行任何必要的后处理。\n\n如果底层驱动程序无法接受线路规提供的所有数据，线路规会将请求线程置于休眠。驱动的中断处理程序在准备好接收更多数据时会唤醒线路规。为了做到这一点，驱动程序会调用线路规注册的\
  \ `write_wakeup()` 方法。相关的同步通过等待队列（`tty->write_wait`）完成，操作与上一节描述的 `read_wait` 队列类似。\n\
  \n许多网络线路规没有 `write()` 方法。协议实现直接将帧发送到串口设备驱动程序。然而，这些线路规通常仍然有一个 `write_wakeup()` 入口，以响应串口驱动对更多传输数据的请求。\n\
  \n## 线路规\n\n`N_TCH` 也不需要 `write()` 方法，因为触控控制器是一个只读设备。正如你在列表 6.4 中看到的，接收路径中的程序在需要向控制器发送命令帧时直接与底层\
  \ UART 驱动程序通信。\n\n## I/O 控制\n\n用户程序可以通过 `ioctl()` 调用向设备发送命令，如第 5 章“字符驱动程序”所述。当应用程序打开串口设备时，通常可以对其发出三类\
  \ `octls`：\n\n- 串口驱动程序支持的命令，例如设置调制解调器信息的 `TIOCMSET`\n- `tty` 驱动支持的命令，例如更改连接的线路规的\
  \ `TIOCSETD`\n- 所连接线路规支持的命令，例如在 `N_TCH` Case 中重置触控控制器的命令\n\n`N_TCH` 的 `ioctl()`\
  \ 实现很大程度上是标准的。支持的命令取决于触控控制器数据表中描述的协议。\n\n## 更多操作\n\n另一个线路规操作是 `flush_buffer()`，用于刷新读取缓冲区中任何待处理的数据。当线路规关闭时也会调用\
  \ `flush_buffer()`。它如下所示唤醒任何等待更多数据的读取线程：\n\n```c\nif (tty->link->packet){\n    wake_up_interruptible(&tty->disc_data->read_wait);\n\
  }\n```\n\n另一个入口（`N_TCH` 不支持）是 `set_termios()`。`N_TTY` 线路规支持 `set_termios()` 接口，用于设置特定的线路规数据处理选项。例如，你可以使用\
  \ `set_termios()` 将线路规置于原始模式（raw mode）或热模式（cooked mode）。某些特定的触控控制器的选项（如更改波特率、校验和停止位数量）是由底层设备驱动程序的\
  \ `set_termios()` 方法实现的。\n\n其余入口（如 `poll()`）相当标准，如果你需要帮助，可以返回第 5 章。\n\n你可以将线路规作为内核的一部分编译，也可以将其作为模块动态加载。如果你选择将其编译为模块，当然，还必须提供在模块初始化和退出时调用的函数。前者通常与\
  \ `init()` 方法相同。后者需要清理私有数据结构并注销线路规。注销线路规只需要一行代码：\n\n```bash\ntty_unregister_ldisc(N_TCH);\n\
  ```\n\n驱动串口触控控制器的更简单方法是利用内核 *input* 子系统提供的服务和内置的 *serport* 线路规。我们将在下一章中讨论该技术。\n\n\
  ## 更改线路规\n\n当用户空间程序打开串口时，`N_TCH` 会绑定到底层驱动程序。但有时，用户空间应用程序可能想向设备上附加不同的线路规。\n\n\n\n\
  \n# UART 支持的入口点\n\nUART 支持的入口点\n\n`drivers`\n\n`platform_device`\n\n`include/linux/platform_device.h`\n\
  \n平台设备的表示。\n\n`platform_driver`\n\n`include/linux/platform_device.h`\n\n平台驱动的表示。\n\
  \n`tty_struct`\n\n`include/linux/tty.h`\n\n关于 tty 的状态信息。\n\n`tty_bufhead`, `tty_buffer`\n\
  \n`include/linux/tty.h`\n\n这两个结构实现了与 tty 相关的翻转缓冲区（flip buffer）。\n\n`tty_driver`\n\
  \n`include/linux/tty_driver.h`\n\ntty 驱动与上层之间的编程接口。\n\n`tty_ldisc`\n\n`include/linux/tty_ldisc.h`\n\
  \n线路调度（line discipline）支持的入口点。\n\n## 表 6.4 内核编程接口总结\n\n| 内核接口 | 位置 | 描述 |\n| :---\
  \ | :--- | :--- |\n| `uart_register_driver()` | `drivers/serial/sderial_core.c`\
  \ | 向串口核心层注册 UART 驱动 |\n| `uart_add_one_port()` | `drivers/serial/sderial_core.c`\
  \ | 注册 UART 驱动支持的 UART 端口 |\n| `uart_unregister_driver()` | `drivers/serial/sderial_core.c`\
  \ | 从串口核心层移除 UART 驱动 |\n| `platform_device_register()` | `drivers/base/platform.c`\
  \ | 注册平台设备 |\n| `platform_device_register_simple()` | `drivers/base/platform.c`\
  \ | - |\n| `platform_add_devices()` | `drivers/base/platform.c` | - |\n| `platform_device_unregister()`\
  \ | `drivers/base/platform.c` | 注销平台设备 |\n| `platform_driver_register()` | `drivers/base/platform.c`\
  \ | 注册/注销平台驱动 |\n| `platform_driver_unregister()` | `drivers/base/platform.c` |\
  \ - |\n| `tty_insert_flip_char()` | `include/linux/tty_flip.h` | 向 tty 翻转缓冲区添加字符\
  \ |\n| `tty_flip_buffer_push()` | `drivers/char/tty_io.c` | 队列将翻转缓冲区推送到线路调度的请求 |\n\
  | `tty_register_driver()` | `drivers/char/tty_io.c` | 向串口核心层注册 tty 驱动 |\n| `tty_unregister_driver()`\
  \ | `drivers/char/tty_io.c` | 从串口核心层移除 tty 驱动 |\n| `tty_register_ldisc()` | `drivers/char/tty_io.c`\
  \ | 通过注册指定的入口创建线路调度 |\n| `tty_unregister_ldisc()` | `drivers/char/tty_io.c` | 从串口核心层移除线路调度\
  \ |\n\n某些串口数据传输场景是复杂的。正如你在图 6.3 中看到的，你可能需要混合和组合不同的串口层模块。某些情况可能需要数据路径通过多个线路调度。例如，在蓝牙上建立拨号连接涉及数据通过\
  \ HCI 线路调度和 PPP 线路调度的移动。如果可以，请建立这样的连接并使用内核调试器单步代码流。\n\n## 输入驱动程序\n\n内核的 `input`\
  \ 子系统的创建是为了统一处理各种类数据输入设备的驱动程序，例如键盘、鼠标、轨迹球、摇杆、滚轮、触摸屏、加速度计和平板电脑。输入子系统带来了以下优势：\n\n\
  *   即使功能相似的输入设备在物理上不同，也能统一处理。例如，所有鼠标（如 PS/2、USB 或蓝牙鼠标）都被一同对待。\n*   提供了一个易用的 `event`\
  \ 接口，用于将输入报告调度到用户应用程序。你的驱动不需要创建和管理 `/dev` 节点及相关的访问方法。相反，它可以简单地调用输入 API 将鼠标移动、按键或触摸事件向上发送到用户态。X\
  \ Windows 等应用程序可以在输入子系统导出的事件接口上无缝工作。\n*   从输入驱动程序中提取共同部分，并产生的抽象简化了驱动程序并引入了一致性。例如，输入子系统提供了一组名为\
  \ `serio` 的低级驱动程序，提供了对串口和键盘控制器等输入硬件的访问。\n\n图 7.1 展示了输入子系统的操作。该子系统包含两类协同工作的驱动程序：`event`\
  \ 驱动和 `device` 驱动。`event` 驱动负责与应用程序接口，而 `device` 驱动负责与输入设备进行低级通信。鼠标事件生成器 `mousedev`\
  \ 是前者例子，而 PS/2 鼠标驱动是后者的例子。`event` 驱动和 `device` 驱动都可以利用高效、无错、可复用的内核服务，它是输入子系统的核心。\n\
  \n由于 `event` 驱动是标准化的且适用于所有输入类，你更有可能实现一个设备驱动程序而不是 `event` 驱动。你的设备驱动程序可以通过输入内核使用合适的现有\
  \ `event` 驱动来与用户应用程序接口。注意，本章使用 `device driver` 一词是指输入设备驱动程序，而不是输入事件驱动程序。\n\n## Evdev\
  \ 接口\n\n输入子系统导出的事件接口已演变为许多图形系统理解的标准。`event` 驱动与帧缓冲区驱动配合，将 GUI 与底层硬件隔离开。\n\n`Evdev`\
  \ 是一个通用输入驱动程序。`evdev` 产生的每个事件包具有以下格式，定义在 `include/input.h` 中：\n\n```c\nstruct input_event\
  \ {\n    struct timeval time; /* 时间戳 */\n    __u16 type; /* 事件类型 */\n    __u16 code;\
  \ /* 事件代码 */\n    __s32 value; /* 事件值 */\n};\n```\n\n为了学习如何使用 `evdev`，让我们为虚拟实现一个输入设备驱动程序。\n\
  \n### 设备示例：虚拟鼠标\n\n这是我们虚拟鼠标的工作原理：应用程序 (`coord.c`) 模拟鼠标移动并通过 sysfs 节点 `/sys/devices/platform/vms/coordinates`\
  \ 将坐标信息发送给虚拟鼠标驱动程序 (`vms.c`)。虚拟鼠标驱动程序（简称 vms 驱动）通过 evdev 将这些移动向上发送。\n\n通用鼠标程序 (`gpm`)\
  \ 是一个服务器，允许你在文本模式下使用鼠标而无需 X 服务器协助。Gpm 理解 evdev 消息，因此 vms 驱动可以直接与其通信。当一切就绪后，你可以看到光标随着\
  \ `coord.c` 的虚拟移动在屏幕上跳动。\n\n列表 7.1 包含 `coord.c`，它持续生成随机 X 和 Y 坐标。鼠标与摇杆或触摸屏不同，产生的是相对坐标，这就是\
  \ `coord.c` 所做的。vms 驱动在列表 7.2 中。\n\n```c\n// LISTING 7.1 模拟鼠标移动的应用 (coord.c)\n#include\
  \ <fcntl.h>\n\nint main(int argc, char *argv[])\n{\n    int sim_fd;\n    int x,\
  \ y;\n    char buffer[10];\n\n    /* 打开 sysfs 坐标节点 */\n```\n\n\n\n\n```c\nsim_fd\
  \ = open(\"/sys/devices/platform/vms/coordinates\", O_RDWR);\n\nif (sim_fd < 0)\
  \ {\n    perror(\"Couldn't open vms coordinate file\\n\");\n    exit(-1);\n}\n\n\
  while (1) {\n    /* 生成随机相对坐标 */\n    x = random()%20;\n    y = random()%20;\n  \
  \  if (x%2) x = -x; if (y%2) y = -y;\n    /* 将模拟坐标传递给虚拟鼠标驱动 */\n    sprintf(buffer,\
  \ \"%d %d %d\", x, y, 0);\n    write(sim_fd, buffer, strlen(buffer));\n    fsync(sim_fd);\n\
  \    sleep(1);\n}\nclose(sim_fd);\n```\n\n### 列表 7.2 虚拟鼠标输入驱动 (vms.c)\n\n```c\n\
  #include <linux/fs.h>\n#include <asm/uaccess.h>\n#include <linux/pci.h>\n#include\
  \ <linux/input.h>\n#include <linux/platform_device.h>\n\nstruct input_dev *vms_input_dev;\
  \ /* 输入设备的表示 */\nstatic struct platform_device *vms_dev; /* 设备结构 */\n\n/* 向虚拟\n\
  鼠标驱动输入模拟\n坐标的 sysfs 方法 */\nstatic ssize_t\nwrite_vms(struct device *dev,\n     \
  \     struct device_attribute *attr,\n          const char *buffer, size_t count)\n\
  {\n    int x,y;\n    sscanf(buffer, \"%d%d\", &x, &y);\n    /* 通过事件\n    接口报告相对坐标\
  \ */\n    input_report_rel(vms_input_dev, REL_X, x);\n    input_report_rel(vms_input_dev,\
  \ REL_Y, y);\n    input_sync(vms_input_dev);\n    return count;\n}\n\n/* 挂载 sysfs\
  \ 写入方法 */\nDEVICE_ATTR(coordinates, 0644, NULL, write_vms);\n\n/* 属性描述符 */\nstatic\
  \ struct attribute *vms_attrs[] = {\n    &dev_attr_coordinates.attr,\n    NULL\n\
  };\n\n/* 属性组 */\nstatic struct attribute_group vms_attr_group = {\n    .attrs =\
  \ vms_attrs,\n};\n\n/* 驱动初始化 */\nint __init\nvms_init(void)\n{\n    /* 注册平台设备 */\n\
  \    vms_dev = platform_device_register_simple(\"vms\", -1, NULL, 0);\n    if (IS_ERR(vms_dev)){\n\
  \        printk (\"vms_init: error\\n\");\n        return PTR_ERR(vms_dev);\n  \
  \  }\n    /* 创建 sysfs 节点以读取模拟坐标 */\n    sysfs_create_group(&vms_dev->dev.kobj, &vms_attr_group);\n\
  \    /* 分配输入设备数据结构 */\n    vms_input_dev = input_allocate_device();\n    if (!vms_input_dev)\
  \ {\n        printk(\"Bad input_allocate_device()\\n\"); return -ENOMEM;\n    }\n\
  \    /* 声明虚拟鼠标将产生\n    相对事件 */\n    set_bit(EV_REL, vms_input_dev->evbit);\n   \
  \ set_bit(REL_X, vms_input_dev->relbit);\n    set_bit(REL_Y, vms_input_dev->relbit);\n\
  \    /* 向输入子系统注册 */\n    input_register_device(vms_input_dev);\n    printk(\"Virtual\
  \ Mouse Driver Initialized.\\n\");\n    return 0;\n}\n\n/* 驱动退出 */\nvoid\nvms_cleanup(void)\n\
  {\n    /* 从输入子系统注销 */\n    input_unregister_device(vms_input_dev);\n    /* 清理 sysfs\
  \ 节点 */\n    sysfs_remove_group(&vms_dev->dev.kobj, &vms_attr_group);\n    /* 注销驱动\
  \ */\n    platform_device_unregister(vms_dev);\n    return;\n}\n\nmodule_init(vms_init);\n\
  module_exit(vms_cleanup);\n```\n\n让我们仔细观察列表 7.2。在初始化期间，`vms` 驱动将自己注册为一个输入设备驱动程序。为此，它首先使用内核\
  \ API `input_allocate_device()` 分配了一个 `input_dev` 结构：\n\n`vms_input_dev = input_allocate_device();`\n\
  \n接着它声明虚拟鼠标产生相对事件：\n\n`set_bit(EV_REL, vms_input_dev->evbit); /* 事件类型为 EV_REL */`\n\
  \n接下来，它声明了虚拟鼠标产生的事件代码：\n\n`set_bit(REL_X, vms_input_dev->relbit); /* 相对 'X' 移动 */`\n\
  `set_bit(REL_Y, vms_input_dev->relbit); /* 相对 'Y' 移动 */`\n\n如果你的虚拟鼠标能够产生按钮点击，你需要在\
  \ `vms_init()` 中添加这些：\n\n`set_bit(EV_KEY, vms_input_dev->evbit); /* 事件类型为 EV_KEY\
  \ */`\n`set_bit(BTN_0, vms_input_dev->keybit); /* 事件代码为 BTN_0 */`\n\n最后是注册：\n\n\
  `input_register_device(vms_input_dev);`\n\n`write_vms()` 是挂载到 `*/sys/devices/coordinates/*`\
  \ 的 sysfs `store()` 方法。当 `write_vms()` 执行以下操作时：\n\n`input_report_rel(vms_input_dev,\
  \ REL_X, x);`\n`input_report_rel(vms_input_dev, REL_Y, y);`\n`input_sync(vms_input_dev);`\n\
  \n`input_sync()` 表示该事件完成。第一个语句产生 X 方向的相对事件。第二个语句产生 Y 方向的相对事件。\n\n\n\n通过兼容 `i8042`\
  \ 的键盘控制器与前身连接。台式电脑通常有专用的键盘控制器，但在笔记本上，键盘接口是通用嵌入式控制器的职责之一（参见第 20 章“更多设备和驱动程序”中的“嵌入式控制器”章节）。当你按下\
  \ PC 键盘上的键时，路径如下：\n\n1. 键盘控制器（或嵌入式控制器）扫描并解码键盘矩阵，并处理键消抖等细节。\n2. 键盘设备驱动程序在 `serio`\
  \ 的帮助下，为每次按键和释放从键盘控制器读取原始的 `scancodes`（扫描码）。按下和释放的区别在于最高位，释放时该位被设置为 1。例如，按下“a”键会产生一对扫描码：`0x1e`\
  \ 和 `0x9e`。特殊键使用 `0xE0` 进行转义，因此按一下右箭头键会产生序列 `(0xE0 0x4D 0xE0 0xCD)`。你可以使用 `showkey`\
  \ 工具来观察从控制器发出的扫描码（Asymbol 附带了说明）：\n\n```bash\nbash> showkey -s\nkb mode was UNICODE\n\
  [ 如果你是在 X 下尝试这样做，它可能不起，因为\n X 服务器也在读取 /dev/console ]\npress any key (程序将在最后一次按键后\
  \ 10 秒内终止)...\n...\n0x1e 0x9e\nA A push of the \"a\" key\n```\n\n3. 键盘设备驱动程序根据输入模式将接收到的扫描码转换为\
  \ `keycodes`（键码）。查看对应“a”键的键码：\n\n```bash\nbash> showkey\n...\nkeycode 30 press\n\
  A A push of the \"a\" key\nkeycode 30 release\nA Release of the \"a\" key\n```\n\
  \n为了向上游报告键码，驱动程序生成一个输入事件，该事件将控制权交给键盘事件驱动程序。\n\n4. 键盘事件驱动程序根据加载的键位映射承担键码翻译。（参见 `loadkeys`\
  \ 的手册页以及存在 `/lib/kbd/keymaps/` 中的映射文件）。它会检查翻译后的键码是否关联了切换虚拟控制台或重启系统等操作。为了在响应 Ctrl+Alt+Del\
  \ 按下时亮起 CAPSLOCK 和 NUMLOCK LED 灯而不是重启系统，请在键盘事件驱动程序 `drivers/char/keyboard.c` 的 Ctrl+Alt+Del\
  \ 处理函数添加以下内容：\n\n```c\nstatic void fn_boot_it(struct vc_data *vc, struct pt_regs\
  \ *regs)\n{\n+ set_vc_kbd_led(kbd, VC_CAPSLOCK);\n+ set_vc_kbd_led(kbd, VC_NUMLOCK);\n\
  - ctrl_alt_del();\n}\n```\n\n5. 对于普通键，翻译后的键码会被发送到关联的虚拟终端和 `N_TTY` 行规。（我们在第 6 章“串口驱动程序”中讨论过虚拟终端和行规）。这是通过\
  \ `drivers/char/keyboard.c` 如下实现的：\n\n```c\n/* 将键码插入翻缓冲区 */\ntty_insert_flip_char(tty,\
  \ keycode, 0);\n/* 调度 */\ncon_schedule_flip(tty);\n```\n\n`N_TTY` 行规处理从键盘接收到的此类输入，将其回显到虚拟控制台，并允许用户空间应用程序从连接到虚拟终端的\
  \ `/dev/ttyX` 节点读取字符。\n\n图 7.3 显示了从你按下键盘键到其在虚拟控制台上回显的数据流。图的左半部分是硬件特定的，右半部分是通用的。根据输入系统的设计目标，底层硬件接口对于键盘事件驱动程序和\
  \ tty 层是透明的。输入核心和明确定义的事件接口将输入用户与硬件复杂性隔离开。\n\n### USB 和蓝牙键盘\n\n与“人机接口”（HID）相关的 USB\
  \ 规范规定了 USB 键盘、鼠标、键垫和其他输入外设备用于通信的协议。在 Linux 上，这通过 `usbhid` USB 客户端驱动程序实现，该程序负责 USB\
  \ HID 类 (0x03)。`usbhid` 将自己注册为输入设备驱动程序。它符合输入 API 并报告适用于连接的 HID 的输入事件。\n\n要理解 USB\
  \ 键盘的代码路径，请回到图 7.3 并修改硬件特定的左半。将“输入硬件”框中的键盘控制器替换为 USB 控制器，将 `serio` 替换为 USB 核心层，并将“输入设备驱动程序”框替换为\
  \ `usbhid` 驱动。\n\n对于蓝牙键盘，请将图 7.3 中的键盘控制器替换为蓝牙芯片组，将 `serio` 替换为蓝牙核心层，并将“输入设备驱动程序”框替换为蓝牙\
  \ hidp 驱动。\n\nUSB 和蓝牙分别在第 11 章“通用串总线”和第 16 章“无线 Linux”中进行了详细讨论。\n\n\n\n\n\n```c\n\
  + /* 用于 //sys/class/input/inputX/id 中的项 */\n+ roller_mouse->dev->id.bustype = ROLLER_BUS;\n\
  + roller_mouse->dev->id.vendor = ROLLER_VENDOR;\n+ roller_mouse->dev->id.product\
  \ = ROLLER_PROD;\n+ roller_mouse->dev->id.version = ROLLER_VER;\n+ /* 向输入子系统注册 */\n\
  + input_register_device(roller_mouse->dev);\n+ }\n```\n\n/* 全局变量 */\n\n- `spinlock_t\
  \ roller_lock = SPIN_LOCK_UNLOCKED;`\n- `static DECLARE_WAIT_QUEUE_HEAD(roller_poll);`\n\
  \n/* Roller 中断处理器 */\n\n```c\nstatic irqreturn_t\nroller_interrupt(int irq, void\
  \ *dev_id)\n{\n    int i, PA_t, PA_delta_t, movement = 0;\n    /* 如图 7.1 所示，从 Port\
  \ D 的位 0, 1 和 2 获取波形 */\n    PA_t = PORTD & 0x07;\n    /* 等待引脚状态改变。\n    （为循环添加某些超时）\
  \ */\n    for (i=0; (PA_t==PA_delta_t); i++){\n        PA_delta_t = PORTD & 0x07;\n\
  \    }\n    movement = determine_movement(PA_t, PA_delta_t);\n    spin_lock(&roller_lock);\n\
  \    /* 将滚轮移动存储在缓冲区中，\n    供后续 read()/poll() 入口访问 */\n    store_movements(movement);\n\
  \    spin_unlock(&roller_lock);\n    /* 唤醒可能因等待滚轮移动而进入睡眠的 poll 入口 */\n    wake_up_interruptible(&roller_poll);\n\
  \n    if (movement == CLOCKWISE) {\n        input_report_rel(roller_mouse->dev,\
  \ REL_Y, 1);\n    } else if (movement == ANTICLOCKWISE) {\n        input_report_rel(roller_mouse->dev,\
  \ REL_Y, -1);\n    } else if (movement == KEYPRESSED) {\n        input_report_key(roller_mouse->dev,\
  \ BTN_LEFT, 1);\n    }\n    input_sync(roller_mouse->dev);\n    return IRQ_HANDLED;\n\
  }\n```\n\n### 指点板 (Trackpoints)\n\n*trackpoint* 是一种集成在某些笔记本电脑的 PS/2 类型键盘上的指针设备。该设备包括一个位于按键之间的摇杆以及位于空格键下方的鼠标按钮。指点板本质上充当鼠标工作，因此你可以使用\
  \ PS/2 鼠标驱动程序操作它。\n\n与普通鼠标不同，指点板提供了更多的移动控制。你可以命令指点控制器更改灵敏度和惯性等属性。内核有一个特殊的驱动 `drivers/input/mouse/trackpoint.c`，用于创建和管理相关的\
  \ sysfs 节点。完整的指点板配置选项，请查看 `/sys/devices/platform/i8042/serioX/serioY/`。\n\n### 触摸板\
  \ (Touchpads)\n\n*touchpad* 是一种在笔记本电脑上常见的类鼠标指针设备。与传统鼠标不同，触摸板没有运动部件。它可以生成与鼠标兼容的相对坐标，但操作系统通常以更强大的模式使用它，产生绝对坐标。绝对模式使用的通信协议与\
  \ PS/2 鼠标协议相似，但与之并不兼容。\n\n基础 PS/2 鼠标驱动能够支持符合不同基础 PS/2 鼠标协议变体的设备。你可以通过通过 `psmouse`\
  \ 结构提供协议驱动，为基础驱动添加对新鼠标协议的支持。例如，如果你的笔记本电脑使用绝对模式下的 Synaptics 触摸板，基础 PS/2 鼠标驱动将使用 Synaptics\
  \ 协议驱动的服务来解释流数据。要端端理解 Synaptics 协议如何与基础 PS/2 驱动协同工作，请查看列表 7.4 的四个代码区域：\n\n- PS/2\
  \ 鼠标驱动 `drivers/input/mouse/psmouse-base.c` 实例化了一个 `psmouse_protocol` 结构，其中包含有关支持的鼠标协议的信息（包括\
  \ Synaptics 触摸板协议）。\n- 定义在 `drivers/input/mouse/psmouse.h` 中的 `psmouse` 结构将各种 PS/2\
  \ 协议结合在一起。\n- `synaptics_init()` 在 `psmouse` 结构中填充了相关协议函数的地址。\n- 在 `synaptics_init()`\
  \ 中填充的协议处理函数 `synaptics_process_byte()` 在 serio 感应到鼠标移动时从中断上下文中被调用。如果你展开 `synaptics_process_byte()`，你将看到触摸板移动通过\
  \ `mousedev` 向用户应用程序报告。\n\n#### 列表 7.4 用于 Synaptics 触摸板的 PS/2 鼠标协议驱动程序\n\n**`drivers/input/mouse/psmouse-base.c`:**\n\
  \n```c\n/* 支持的 PS/2 鼠标协议列表 */\nstatic struct psmouse_protocol psmouse_protocols[]\
  \ = {\n{\n    .type = PSMOUSE_PS2, /* 基础 PS/2 处理器 */\n    .name = \"PS/2\",\n  \
  \  /* 输入驱动 223 */\n    .max = 1,\n    .detect = PSMOUSE_PS2,\n},\n/* ... */\n{\n\
  \    /* Synaptics 触摸板 */\n    .type = PSMOUSE_SYNAPTICS, /* 基础 PS/2 */\n    .name\
  \ = \"PS/2\",\n    .max = 1,\n    .detect = PSMOUSE_PS2,\n},\n/* ... */\n```\n\n\
  **`drivers/input/mouse/psmouse.h`:**\n\n```c\n/* 结合各种 PS/2 协议的结构 */\nstruct psmouse\
  \ {\n    struct input_dev *dev; /* 输入设备 */\n    /* ... */\n    /* 协议方法 */\n    irq_t\
  \ (*protocol_handler)(struct psmouse, struct pt_regs);\n    void (*set_rate)(struct\
  \ psmouse, unsigned int rate);\n    int (*reconnect)(struct psmouse);\n    void\
  \ (*disconnect)(struct psmouse);\n    /* ... */\n};\n```\n\n**`drivers/input/mouse/synaptics.c`:**\n\
  \n```c\n/* Synaptics 协议的 init() 方法 */\nint synaptics_init(struct psmouse *psmouse)\n\
  {\n    struct synaptics_data *priv;\n    psmouse->private = priv = kmalloc(sizeof(struct\
  \ synaptics_data),\n    GFP_KERNEL);\n    /* ... */\n    /* 感应到移动时在中断上下文中调用 */\n\
  \    psmouse->protocol_handler = synaptics_process_byte;\n    /* 更多协议方法 */\n   \
  \ psmouse->set_rate = synaptics_set_rate;\n    psmouse->disconnect = synaptics_disconnect;\n\
  \    psmouse->reconnect = synaptics_reconnect;\n    /* ... */\n}\n```\n\n```c\n\
  /* 如果你展开 synaptics_process_byte()，你将看到触摸板\n事件通过 mousedev 向用户应用程序报告 */\nstatic void\
  \ synaptics_process_packet(struct psmouse *psmouse)\n{\n    /* ... */\n    if (hw.z\
  \ > 0) {\n        /* 绝对 X 坐标 */\n        input_report_abs(dev, ABS_X, hw.x);\n \
  \       /* 绝对 Y 坐标 */\n        input_report_abs(dev, ABS_Y,\nYMAX_NOMINAL + YMIN_NOMINAL\
  \ - hw.y);\n    }\n    /* 绝对 Z 坐标 */\n    input_report_abs(dev, ABS_PRESSURE, hw.z);\n\
  \    /* ... */\n    /* 左触摸板按钮 */\n    input_report_key(dev, BTN_LEFT, hw.left);\n\
  \    /* 右触摸板按钮 */\n    input_report_key(dev, BTN_RIGHT, hw.right);\n    /* ... */\n\
  }\n```\n\n### USB 和蓝牙鼠标\n\nUSB 鼠标由驱动 USB 键盘的相同驱动程序 (`usbhid`) 处理。同样，实现蓝牙键盘支持的 `hidp`\
  \ 驱动也负责蓝牙鼠标。正如你预期的，USB 和蓝牙鼠标通过 mousedev 通道设备数据。\n\n输入子系统提供了一种更好更简单的方法来实现该设备驱动程序。将\
  \ N_TCH 中的有限状态机重构为输入驱动程序，更改如下：\n\n1. Serio 提供了一种名为 *serport* 的线路调度，用于访问连接到串口的设备。使用\
  \ serport 服务与触摸控制器通信。\n2. 不要将坐标信息传递给 tty 层，而是像你在列表 7.2 中为虚拟鼠标那样通过 evdev 生成输入报告。\n\
  \n这样，用户空间可以通过 `/dev/input/eventX.` 访问触摸屏。实际的驱动程序实现留作为练习。\n\n一种不通过串口接口的触摸控制器示例是 Analog\
  \ Devices ADS7846 芯片，它通过 *串行外接口* (SPI) 进行通信。\n\n\n\n\n\n(SPI ) 该设备的驱动程序使用 `SPI`\
  \ 核心服务而非串口。第 8 章“集成电路协议”中的“串行外设备总线”节讨论了 `SPI`。与大多数触摸驱动程序一样，`ADS7846` 驱动使用 `evdev`\
  \ 接口将触摸信息分发给用户应用程序。\n\n某些触摸控制器通过 USB 接口。例如由 `/drivers/input/touchscreen/usbtouchscreen.c`\
  \ 驱动的 3M USB 触摸控制器。\n\n许多 PDA 在其 LCD 上叠加了四线制电阻触摸屏。面板的 `X` 和 `Y` 板（两个轴各两根线）连接到模数转换器\
  \ (`ADC`)，该设备提供触摸屏幕产生的模拟电压差的数字读取。输入驱动程序从 `ADC` 收集坐标并将其调度到用户空间。\n\n由于制造工艺的细差异，同一触摸面板的不同实例可能会产生略不同的坐标范围（`X`\
  \ 和 `Y` 方向的最大值）。为了使应用程序免受这种变化的影响，触摸屏在使用前会进行校准`。校准通常由 GUI 启动，通过在屏幕边界和其他位置显示十字标记，并要求用户触摸这些点。如果触摸控制器支持自校准，则使用适当命令将生成的坐标写回控制器；否则则在软件中对坐标流进行缩放。\n\
  \n输入子系统还包含一个名为 `tsdev` 的事件驱动程序，它根据 Compaq 触摸屏协议生成坐标信息。如果你的系统通过 `tsdev` 报告触摸事件，理解此协议的应用程序就可以从\
  \ `/dev/input/tsX` 获取触摸输入。然而，该驱动程序计划从主内核移除，取而代之的是用户空间的 `tslib` 库。`Documentation/feature-removal-schedule.txt`\
  \ 列出了从内核源码树中移除的功能。\n\n### 加速度计\n\n加速度计测量加速度。某些 IBM/联想笔记本电脑配有检测突然运动的加速度计。生成的信息用于通过名为`硬盘活动保护系统`\
  \ (`HDAPS`) 的机制保护硬盘免受损坏，类似于汽车气囊保护乘客免于受伤。\n\n`HDAPS` 驱动程序实现为在输入子系统中注册的平台驱动程序。它使用\
  \ `evdev` 流式传输检测到的加速度的 `X` 和 `Y` 分量。应用程序可以通过 `/dev/input/eventX` 读取加速度事件以检测冲击和震动等状况，并执行防御性动作，例如停止硬盘头。当你移动笔记本电脑时，执行以下命令会输出（假设\
  \ `event3` 被分配给 `HDAPS`）：\n\n```bash\nod –x /dev/input/event3\n0000000 a94d 4599\
  \ 1f19 0007 0003 0000 ffed ffff\n...\n```\n\n加速度计还提供温度、键盘活动和鼠标活动等信息，所有这些都可以通过 `/sys/devices/platform/hdaps/`\
  \ 中的文件获取。由于此，`HDAPS` 驱动程序是内核源码中硬件监控 (`hwmon`) 子系统的一部分。我们将在下一章的“使用 LM-Sensors 进行硬件监控”节中讨论硬件监控。\n\
  \n### 输出事件\n\n某些输入设备驱动程序也处理输出事件。例如，键盘驱动可以点亮 `CAPSLOCK` LED，PC 扬声器驱动可以发出蜂鸣声。\n\n\
  让我们详细关注后者。在初始化期间，扬声器驱动程序通过设置适当的 `evbits` 并注册一个处理输出事件的回调函数来声明其输出能力：\n\n```c\ndrivers/input/misc/pcspkr.c:\n\
  static int __devinit pcspkr_probe(struct platform_device *dev)\n{\n    /* ... */\n\
  \    /* 能力位 */\n    pcspkr_dev->evbit[0] = BIT(EV_SND);\n    pcspkr_dev->sndbit[0]\
  \ = BIT(SND_BELL) | BIT(SND_TONE);\n    /* 回调函数 */\n    pcspkr_dev->event = pcspkr_event;\n\
  \    err = input_register_device(pcspkr_dev);\n    /* ... */\n}\n\n/* 回调函数 */\n\
  static int pcspkr_event(struct input_dev *dev, unsigned int type,\nunsigned int\
  \ code, int value)\n{\n    /* ... */\n    /* 发出蜂鸣声的 I/O 编程 */\n    outb_p(inb_p(0x61)\
  \ | 3, 0x61);\n    /* 设置计数器 2 的命令，2 字节写入 */\n    outb_p(0xB6, 0x43);\n    /* 选择所需的\
  \ HZ */\n    outb_p(count & 0xff, 0x42);\n    outb((count >> 8) & 0xff, 0x42);\n\
  \    /* ... */\n}\n```\n\n为了发出蜂鸣声，键盘事件驱动程序产生一个声音事件 (`EV_SND`)，如下：\n\n```c\ninput_event(handle->dev,\
  \ EV_SND, /* 类型 */\nSND_TONE, /* 代码 */\nhz /* 值 */);\n```\n\n这将触发回调函数 `pcspkr_event()`\
  \ 的执行，你就能听到蜂鸣声。\n\n\n\n\n\nserio 子系统位于 `drivers/input/serio/`。serport 行规律的源码位于 `drivers/input/serio/serport.c`。`Documentation/input/`\
  \ 包含了更多关于不同输入接口的详细信息。\n\n表 7.1 总结了本章使用的主要数据结构及其在源码树中的位置。表 7.2 列出了你在本章中使用的主要内核编程接口及其定义的位置。\n\
  \n### 表 7.1 数据结构总结（引用自源码）\n\n| 数据结构 | 位置 | 描述 |\n| :--- | :--- | :--- |\n| `input_event`\
  \ | `include/linux/input.h` | evdev 产生的每个事件包都采用这种格式。 |\n| `input_dev` | `include/linux/input.h`\
  \ | 输入设备的表示。 |\n| `input_handler` | `include/linux/serial_core.h` | 包含事件驱动支持的入口点。\
  \ |\n| `psmouse_protocol` | `drivers/input/mouse/psmouse-base.c` | 关于支持的 PS/2 鼠标协议驱动的信息。\
  \ |\n| `psmouse` | `drivers/input/mouse/psmouse.h` | PS/2 鼠标驱动支持的方法。 |\n\n### 表\
  \ 7.2 内核编程接口总结（引用自源码）\n\n| 内核接口 | 位置 | 描述 |\n| :--- | :--- | :--- |\n| `input_register_device()`\
  \ | `drivers/input/input.c` | 在输入核心中注册设备。 |\n| `input_unregister_device()` | `drivers/input/input.c`\
  \ | 从输入核心中移除设备。 |\n| `input_report_rel()` | `include/linux/input.h` | 在指定方向产生相对移动。\
  \ |\n| `input_report_abs()` | `include/linux/input.h` | 在指定方向产生绝对移动。 |\n| `input_report_key()`\
  \ | `include/linux/input.h` | 产生按键或按钮按下事件。 |\n| `input_sync()` | `include/linux/input.h`\
  \ | 表示输入子系统可以将之前生成的事件收集到 evdev 包中，并通过 `/dev/input/inputX` 发送到用户空间。 |\n| `input_register_handler()`\
  \ | `drivers/input/input.c` | 注册自定义事件驱动。 |\n| `sysfs_create_group()` | `fs/sysfs/group.c`\
  \ | 创建带有指定属性的 sysfs 组。 |\n| `sysfs_remove_group()` | `fs/sysfs/group.c` | 移除使用 `sysfs_create_group()`\
  \ 创建的 sysfs 组。 |\n| `tty_insert_flip_char()` | `include/linux/tty_flip.h` | 将字符发送到行规律层。\
  \ |\n| `platform_device_register_simple()` | `drivers/base/platform.c` | 创建简单的平台设备。\
