  \ `intelfb`）提供了额外的配置选项，可以生成驱动特定的调试信息。\n\n387 [调试]\n\n要讨论与缓冲区驱动相关的问题，请订阅 `linux-fbdev-devel`\
  \ 邮件列表，[`lists.sourceforge.org/listinfo/linux-fbdev-devel/`](https://lists.sourceforge.org/listinfo/linux-fbdev-devel/)。\n\
  \n调试控制台不是一项容易的工作，因为你无法在驱动内部调用 `printk()`。如果你有一个空闲的控制台设备（如串口），你可以先实现你的控制台的 UART/tty\
  \ 形式（正如在本章中为 `USB_UART` 设备所的那样），通过操作 `/dev/tty` 并向空闲控制台打印消息来调试该驱动。然后你可以将调试过的代码区域重新封装为控制台驱动。\n\
  \n## [查看源码]\n\n帧缓冲区核心层和底层帧缓冲区驱动位于 `drivers/video/` 目录。通用帧缓冲区结构定义在 `include/linux/fb.h`\
  \ 中，而芯片特定的头文件留在 `include/video/` 中。`fbmem` 驱动 `drivers/video/fbmem.c` 创建 `/dev/fbX`\
  \ 字符设备，它是处理用户应用程序发布的帧缓冲区 ioctl 命令的前端。\n\n`intelfb` 驱动 `drivers/video/intelfb/` 是某些\
  \ Intel 图形控制器的底层帧缓冲区驱动，例如集成在 855 GME 北桥上的控制器。`radeonfb` 驱动 `drivers/video/aty/`\
  \ 是来自 ATI Technologies Radeon Mobility AGP 图形硬件的帧缓冲区驱动。源文件 `drivers/video/`\n\n\n\
  \n\n\n`video/*fb.c*` 都是图形控制器的帧缓冲驱动，包括集成在多个 SoC 中的驱动程序。如果你正在编写自定义的低层帧缓冲驱动程序，可以使用\
  \ `drivers/video/skeletonfb.c` 作为起点。查看 `Documentation/fb/` 可以获取更多关于帧缓冲层的文档。\n\n\
  Linux 帧缓冲项目的主页是 [www.linux-fbdev.org。](http://www.linux-fbdev.org)。该网站包含 HOWTO 教程、帧缓冲驱动程序和工具的链接，以及指向相关网页的索引。\n\
  \n控制台驱动程序（无论是基于帧缓冲的还是其他的）都位于 `drivers/video/console/` 内部。要了解 `printk()` 如何将内核日志到内部缓冲区并调用控制台驱动程序，请查看\
  \ `kernel/printk.c`。\n\n表 12.2 包含了本章使用的主要数据结构及其在源码树中的位置。表 12.3 列出了你在本章使用的主要内核编程接口及其定义位置。\n\
