  \ | 创建 `/proc` 条目并将其分配给卡实例 |\n\n## 块驱动程序\n\n块设备是能够随机访问的存储媒体。与字符设备不同，块设备可以包含文件系统数据。在本章中，让我们看看\
  \ Linux 如何支持存储总线和设备。\n\n## 存储技术\n\n让我们先浏览一下今天计算机系统中常见的存储技术。我们将这些技术与内核源码树中相应的设备驱动子系统相关起来。\n\
  \n集成电子设备（IDE）是 PC 环境常用的存储接口技术。ATA（`Advanced Technology Attachment` 的缩写）是相关规范的正式名称。IDE/ATA\
  \ 标准始于 ATA-1；最新版本是 ATA-7，支持高达 133MBps 的带宽。\n\n中间版本的包括 ATA-2，它引入了`逻辑块寻址` (`LBA`)；ATA-3\
  \ 使得支持 SMART 的磁盘成为可能（后文讨论）；ATA-4 带来了对 Ultra DMA 及其 33MBps 吞吐量的支持；ATA-5 将最大传输速度提高到\
  \ 66MBps；以及 ATA-6 提供了 100MBps 的速率。\n\nCD-ROM 和磁带等存储设备通过名为 `ATA Packet Interface`\
  \ (`ATAPI`) 的特殊协议连接到标准的 IDE 线缆。ATAPI 是随着 ATA-4 引入的。\n\nPC 系统中的软磁盘控制器传统上是 Super I/O\
  \ 芯片的一部分，我们在第 6 章“串口驱动程序”中学习过它。然而，在今天的 PC 环境中，这些内部驱动器已被更快的 USB 软磁盘驱动器取代。\n\n图 14.1\
  \ 显示了一个 ATA-7 磁盘驱动器连接到 IDE 主适配器，适配器是 PC 系统南桥芯片的一部分。图中还显示了连接的 ATAPI CD-ROM 驱动器和软磁盘。\n\
  \n### libATA\n\n*libATA* 是内核中新的 ATA 子系统。它由一组 ATA 库例和一组使用这些例的低级驱动程序组成。libATA 同时支持\
  \ SATA 和 PATA。libATA 中的 SATA 驱动在 `drivers/scsi/*` 下存在了一段时间，但 PATA 驱动以及现在存放所有 libATA\
  \ 源码的新目录 `drivers/ata/*` 是在 2.6.19 内核版本中引入的。\n\n如果你的系统启用了 SATA 存储，你需要 libATA 服务来配合\
  \ SCSI 子系统使用。libATA 对 PATA 的支持仍是实验性的，默认情况下，PATA 驱动继续使用位于 `drivers/ide/*` 中的遗留 IDE\
  \ 驱动。\n\n假设你的系统通过 Intel ICH7 南桥芯片启用了 SATA。你需要以下 libATA 组件来访问你的磁盘：\n\n1. **libATA\
  \ 核心**：要启用此项，请在内核配置期间设置 `CONFIG_ATA`。核心提供的库函数列表，请在 `drivers/ata/*` 目录内搜索 `EXPORT_SYMBOL_GPL`。\n\
  2. **高级主机控制器接口 (AHCI) 支持**：AHCI 指定了 SATA 主适配器支持的寄存器接口，并在配置时选择 `CONFIG_AHCI` 来启用。\n\
  3. **主机控制器适配器驱动**：对于 ICH7，启用 `CONFIG_ATA_PIIX`。\n\n此外，你还需要中层和上层 SCSI 驱动（`CONFIG_SCSI`\
  \ 等）。在加载所有这些内核组件后，你的 SATA 磁盘分区将以 `/dev/sd*` 的形式出现在系统中，就像 SCSI 或 USB 批量存储分区一样。\n\n\
  \n\n\n`Small Computer System Interface (SCSI)` 是服务器和高端工作站的首选存储技术。SCSI 的速度比 SATA\
  \ 快一些，并支持 320MBps 左右的速度。SCSI 传统上是一种并行接口标准，但像 ATA 一，随着名为 `Serial Attached SCSI` (SAS)\
  \ 总线技术的出现，最近已转向串行操作。\n\n内核的 SCSI 子系统架构分为三层：针对磁盘、CD-ROM 和磁带等媒体的顶层驱动；扫描 SCSI 总线并配置设备的中间层；以及低级主机适配器驱动程序。我们在第\
  \ 11 章“通用串行总线”的“大规模存储”节中学习了这些层。请回阅该章节的图 11.4，查看 SCSI 子系统的不同组件是如何相互作用的。USB 大容量存储驱动器内部使用闪存，但使用\
  \ SCSI 协议与主机系统通信。\n\n本书的其他部分也讨论了 SCSI 支持。第 19 章“用户空间中的驱动程序”中的“用户模式 SCSI”节讨论了 `SCSI\
  \ Generic` (`sg`) 接口，该接口允许你直接从用户空间将命令调度到 SCSI 设备。第 20 章“更多设备和驱动程序”中的“iSCSI”节简述了\
  \ iSCSI 协议，该协议允许通过 TCP/IP 网络将 SCSI 数据包传输到远程块设备。\n\n## 存储技术\n\n`Redundant array of\
  \ inexpensive disks` (RAID) 是内置在某些 SCSI 和 SATA 控制器中的技术，用于实现冗余和可靠性。定义了多种 RAID 级别。例如，RAID-1\
  \ 规定了 `disk mirroring`，即数据在独立的磁盘上复制。Linux 为若干支持 RAID 的磁盘驱动器提供了驱动程序。内核还提供了一个多磁盘 (`md`)\
  \ 驱动程序，在软件中实现了大多数 RAID 级别。\n\n在嵌入式消费电子产品领域，小型化存储是核心。该领域的传输速度远低于目前讨论的技术所提供的速度。`Secure\
  \ Digital` (SD) 卡及其更小尺寸的衍生产品（`miniSD` 和 `microSD`）是相机、手机和音乐播放器等设备中流行的存储介质。符合 SD\
  \ 卡规范 1.01 版本的卡支持高达 10MBps 的传输速度。SD 存储已从一种较旧、较慢但兼容的名为 `MultiMediaCard` (MMC) 的技术演变而来，后者支持\
  \ 2.5MBps 的数据速率。内核在 `drivers/mmc/` 中包含一个 SD/MMC 子系统。\n\n第 9 章“PCMCIA 和闪存”中的“PCMCIA\
  \ 存储”节查看不同的 PCMCIA/CF 存储卡及其相应的内核驱动程序。microdrive 等 PCMCIA 内存卡支持真正的 IDE 操作，而内部使用固态内存的卡则仿真\
  \ IDE 并向内核导出 IDE 编程模型。在这两种情况下，都可以内核的 IDE 子系统来启用该卡。\n\n表 14.1 总结了重要的存储技术以及在内核源码树中相关设备驱动程序的位置。\n\
  \n### TABLE 14.1 存储技术与相关设备驱动程序\n\n| 存储技术 | 描述 | 源文件 |\n|---|---|---|\n| | PC 环境下的存储接口技术。ATA-7\
  \ 支持 133MBps 的数据速率。 | `drivers/ide/ide-disk.c`, `driver/ide/ide-io.c`, `drivers/ide/ide-probe.c`\
  \ 或 `drivers/ata/` (实验性) |\n| ATAPI | CD-ROM 和磁带等存储设备使用 ATAPI 协议连接到标准 IDE 线。 | `drivers/ide/ide-cd.c`\
  \ 或 `drivers/ata/` (实验性) |\n| 软磁盘（内部） | 磁盘控制器位于 PC 兼容系统中 LPC 总线 Super I/O 芯片上。支持\
