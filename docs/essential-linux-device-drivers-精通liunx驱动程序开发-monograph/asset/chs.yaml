  \n# 内核线程\n\n出于以下原因，该任务可以实现为内核线程：\n\n- 它是一项后台任务，因为它必须等待异步事件。\n- 它需要访问内核数据结构，因为事件的实际检测是由内核的其他部分完成的。\n\
  - 它必须调用用户态辅助程序，这是一个耗时的操作。\n\n## 内置内核线程\n\n要查看运行在你的系统上的内核线程（也称为 `kernel processes`），请运行\
  \ `ps` 命令。内核线程的名称用方括号括起来：\n\n```bash\nps -ef\n```\nUID PID PPID C STIME TTY TIME\
  \ CMD\nroot 1 0 0 22:36 ? 00:00:00 init [3]\nroot 2 0 0 22:36 ? 00:00:00 [kthreadd]\n\
  root 3 2 0 22:36 ? 00:00:00 [ksoftirqd/0]\nroot 4 2 0 22:36 ? 00:00:00 [events/0]\n\
  root 38 2 0 22:36 ? 00:00:00 [pdflush]\nroot 39 2 0 22:36 ? 00:00:00 [pdflush]\n\
  root 29 2 0 22:36 ? 00:00:00 [khubd]\nroot 695 2 0 22:36 ? 00:00:00 [kjournald]\n\
  ...\nroot 3914 2 0 22:37 ? 00:00:00 [nfsd]\nroot 3915 2 0 22:37 ? 00:00:00 [nfsd]\n\
  ...\nroot 4015 3364 0 22:55 tty3 00:00:00 -bash\nroot 4066 4015 0 22:59 tty3 00:00:00\
  \ ps -ef\n\n`[ksoftirqd/0]` 内核线程是实现 `softirqs` 的辅助。Softirqs 由中断处理程序触发，用于请求处理程序中可以延迟执行的部分进行“下半部”处理。我们将在第\
  \ 4 章“基础工作”中详细查看下半部和 softirqs，但这里的基本思想是尽可能少留在中断处理程序中的代码。较小的中断处理程序可以减少系统中的中断关闭时间，从而降低延迟。`ksoftirqd`\
  \ 的工作是确保高负载的 softirqs 既不会饿死 softirqs，也不会让系统过载。在支持`对称多处理` (SMP) 机器上，多个线程实例可以在不同的处理器上并行运行，每个\
  \ CPU 都会创建一个 `ksoftirqd` 实例以提高吞吐量（`ksoftirqd/n`，其中 `n` 是 CPU 编号）。\n\n`events/n`\
  \ 线程（其中 `n` 是 CPU 编号）帮助实现 `work queues`，这是内核中延迟工作的另一种方式。希望延迟执行工作的内核部分可以创建自己的工作队列，也可以使用默认的\
  \ `events/n` 工作线程。\n\n工作队列在第 4 章中也将进行详细剖析。\n\n`pdflush` 内核线程的任务是从页缓存中刷出脏页。页缓存缓冲了对磁盘的访问。为了提高性能，实际的磁盘写入会被推迟，直到\
  \ `pdflush` 守护进程将脏数据写入磁盘。如果可用空内存低于阈值，或者页面处于脏状态足够长时间，就会执行此操作。在 2.4 内核中，这两个任务分别由单独内核线程\
  \ `bdflush` 和 `kupdated` 执行。\n\n你可能注意到在 `ps` 输出中存在两个 `pdflush` 实例。如果内核检测到现有实例在处理磁盘队列时已经忙不过来，就会创建一个新实例。这提升了吞吐量，特别是当你的系统有多个磁盘且许多磁盘处于忙碌状态时。\n\
  \n正如你在上一节看到的，`kjournald` 是通用的内核日志线程，被 `EXT3` 等文件系统使用。\n\nLinux `网络文件系统` (NFS) 服务器使用一组名为\
  \ `nfsd` 的内核线程实现。\n\n我们的示例内核线程在被负责监控感兴趣数据结构的内核部分唤醒之前，会放弃处理器。当唤醒时，它会调用用户态辅助程序并在其环境中传递适当的身份代码。\n\
  \n要创建内核线程，请使用 `kernel_thread()`：\n\n```c\nret = kernel_thread(mykthread, NULL,\n\
  CLONE_FS | CLONE_FILES | CLONE_SIGHAND | SIGCHLD);\n```\n\n标志指定了父子线程之间共享的资源。`CLONE_FILES`\
  \ 指定要共享打开的文件，`CLONE_SIGHAND` 请求共享信号处理程序。\n\n列表 3.1 显示了示例实现。由于内核线程作为处理程序运行，它们从 `init`\
  \ 创建。在这种情况下，示例将父进程重新指定为 `init`。\n\n```c\n/* 列表 3.1 实现内核线程 */\nstatic DECLARE_WAITQUEUE_HEAD(mye_wait);\n\
  static rwlock_t myevent_lock;\nextern int myevent_id;\n\nstatic int mykthread(void\
  \ *unused)\n{\n    unsigned int event_id;\n\n     /* 线程在此等待队列上睡眠 */\n    add_wait_queue(&myevent_wait,\
  \ &current);\n    for (;;) {\n        /* 在事件发生前释放处理器 */\n        set_current_state(TASK_INTERRUPIBLE);\n\
  \        schedule(); /* 让内核其他部分运行 */\n\n        /* 如果接收 SIG SIG 则退出 */\n       \
  \ if (signal_pending(current))\n            break;\n\n        read_lock(&myevent_lock);\
  \ /* 临界区开始\n        /* 防止虚假唤醒 */\n        if (myevent_id) {\n            event_id\
  \ = myevent_id;\n            read_unlock(&myevent_lock); /* 临界区结束\n            /*\
  \ 调用注册的用户辅助程序并在环境中传递身份 */\n            run_umode_handler(event_id);\n        } else\
  \ {\n            read_unlock(&myevent_lock);\n        }\n    }\n    set_current_state(TASK_RUNNING);\n\
  \    remove_wait_queue(&myevent_wait, &current);\n    return 0;\n}\n```\n\n如果你将此作为内核的一部分编译并运行，你可以在\
  \ `ps` 输出中看到新创建的线程 `mykthread`：\n\n```bash\nps -ef\n```\n\n\n\n\n\n/* ... */\n\n\
  列表 3.1 在进程上下文中执行，而之前的代码段运行在进程或中断上下文中。进程上下文和中断上下文通过内核数据结构进行通信。我们的示例使用 `myevent_id`\
  \ 和 `myevent_waitqueue` 进行这种通信。`myevent_id` 包含问题数据结构的标识。对 `myevent_id` 的访问使用锁进行序列化。\n\
  \n请注意，内核线程只有在编译时开启了 `CONFIG_PREEMPT` 才是可抢占。如果关闭了 `CONFIG_PREEMPT`，或者你仍在运行没有抢占补丁的\
  \ 2.4 内核，你的线程如果没有进入睡眠，将会冻结系统。如果你注释掉列表 3.1 中的 `schedule()` 并在内核配置中禁用 `CONFIG_PREEMPT`，你的系统将锁死。\n\
  \n在第 19 章“用户空间中的驱动程序”讨论调度策略时，我们将学习如何从内核线程获取软实时响应。\n\n## 进程状态与等待队列\n\n这里是列表 3.1 中的代码区域，它在等待事件时让\
  \ `mykthread` 进入睡眠状态：\n\n```\nadd_wait_queue(&myevent_waitqueue, &wait);\n\nfor\
  \ (;;) {\n    /* ... */\n    set_current_state(TASK_INTERRUPTIBLE);\n    schedule();\
  \ /* 交出处理器 */\n    /* Point A */\n    /* ... */\n}\n\nset_current_state(TASK_RUNNING);\n\
  remove_wait_queue(&myevent_waitqueue, &wait);\n```\n\n上述代码段的操作基于两个概念：*等待队列*和*进程状态*。\n\
  \n等待队列持有需要等待事件或系统资源的线程。等待队列中的线程进入睡眠，直到被另一个线程或负责检测事件的中断处理程序唤醒。入队和出队分别使用 `add_wait_queue()`\
  \ 和 `remove_wait_queue()` 完成，唤醒队列任务通过 `wake_up_interruptible()` 实现。\n\n内核线程（或普通进程）处于以下进程状态的任何一种：*运行*（running）、*可中断*（interruptible）、*不可中断*（uninterruptible）、*僵尸*（zombie）、*停止*（stopped）、*跟踪*（traced）或*死亡*（dead）。这些状态定义在\
  \ `include`/`linux*/sched.h 中：\n\n- 处于**运行**状态（`TASK_RUNNING`）的进程位于调度器的运行队列中，是调度器分配\
  \ CPU 时间的候选。\n- 处于**可中断**状态（`TASK_INTERRUPTIBLE`）的任务正在等待事件发生，不在调度器的运行队列中。当任务被唤醒或接收到信号时，它会重新进入运行队列。\n\
  - **不可中断**状态（`TASK_UNINTERRUPTIBLE`）与**可中断**状态类似，接收信号不会将任务放回运行队列。\n- **停止**任务（`TASK_STOPPED`）由于接收某些信号而停止执行。\n\
  - 如果像 `strace` 这样的应用程序使用内核中的 `ptrace` 支持来拦截任务，它将处于**跟踪**状态（`TASK_TRACED`）。\n- 处于**僵尸**状态（`EXIT_ZOMBIE`）的任务已经终止，但其父进程没有等待任务完成。正在退出的任务处于\
  \ `EXIT_ZOMBIE` 状态或死亡（`EXIT_DEAD`）状态。\n\n你可以使用 `set_current_state()` 来设置内核线程的运行状态。\n\
  \n现在回到之前的代码段。`mykthread` 在等待队列（`myevent_waitqueue`）上睡眠并将其状态更改为 `TASK_INTERRUPTIBLE`，信号它想要退出调度器运行队列。调用\
  \ `schedule()` 请求调度器从其运行队列中选择并运行新任务。当负责健康监控的代码使用 `wake_up_interruptible(&myevent_waitqueue)`\
  \ 唤醒 `mykthread` 时，该线程被放回调度运行队列。进程状态同时也会更改为 `TASK_RUNNING`，因此即使唤醒发生在任务状态设置为 `TASK_INTERRUPTIBLE`\
  \ 与调用 `schedule()` 之间，也不会发生竞态条件。如果向其发送了 `SIGKILL` 信号，线程也会回到运行队列。当调度器随后从运行队列中选取 `mykthread`\
  \ 时，执行从 Point A 继续。\n\n## 用户模式辅助程序\n\n为了通知用户空间检测到的事件，`mykthread` 调用了列表 3.1 中的 `run_umode_handler()`。\n\
  \n```c\n/* 从列表 3.1 调用 */\nstatic void run_umode_handler(int event_id)\n{\n    int\
  \ i = 0;\n    char *argv[2], *envp[4], *buffer = NULL;\n    int value;\n    argv[i++]\
  \ = myevent_handler; /* 定义在 kernel/sysctl.c 中 */\n    /* 填充对应问题数据结构的 id */\n   \
  \ if (!(buffer = kmalloc(32, GFP_KERNEL))) return;\n    sprintf(buffer, \"TROUBLED_DS=%d\"\
  , event_id);\n    /* 如果没有找到用户模式辅助程序，返回 */\n    if (!argv[0]) return; argv[i] = 0;\n\
  \    /* 准备环境 */\n    i = 0;\n    envp[i++] = \"HOME=/\";\n    envp[i++] = \"PATH=/sbin:/usr/sbin:/bin\"\
  ;\n    envp[i++] = buffer;\n    envp[i] = 0;\n    /* 执行用户模式程序 */\n    value = call_umodehelper(argv[0],\
  \ argv, envp, 0);\n    /* 检查返回值 */\n    kfree(buffer);\n}\n```\n\n### 辅助接口\n\n内核中存在许多实用的辅助接口，让设备驱动开发人员的工作更轻松。一个例子是双向链表库的实现。许多驱动需要维护和操作数据结构的链表。内核的\
  \ *list* 接口例程消除了追踪链表指针以及调试与列表维护相关的混乱问题的需要。让我们学习使用辅助接口，如列表、hlists、工作队列、完成函数（completion）、通知器块和\
  \ kthreads。\n\n\n\n\n\n# 链表\n\n要编织数据结构的双向链表，请使用 `include/linux/list.h` 中提供的函数。本质上，你需要在数据结构内部嵌入一个\
  \ `struct list_head`：\n\n```c\n#include <linux/list.h>\n\nstruct list_head {\n \
  \   struct list_head *next, *prev;\n};\n\nstruct mydatastructure {\n    struct list_head\
  \ mylist; /* 嵌入 */\n    /* ... */ /* 实际字段 */\n};\n```\n\n`mylist` 是连接不同 `mydastructure`\
  \ 实例的链。如果你在 `mydastructure` 中嵌入了多个 `list_heads`，它们中的每一个都构成一个链接，使 `mydastructure`\
  \ 成为新列表的成员。你可以使用链表库从单个列表中添加或删除成员。\n\n在进入细节之前，为了了解整体情况，让我们总结一下链表库提供的链表编程接口。这在表 3.1\
  \ 中。\n\n### 表 3.1 链表操作函数\n\n| 函数 | 用途 |\n| :--- | :--- |\n| `INIT_LIST_HEAD()` |\
  \ 初始化链表头 |\n| `list_add()` | 在链表头之后添加元素 |\n| `list_add_tail()` | 将元素添加到链表末尾 |\n\
  | `list_del()` | 从列表中删除元素 |\n| `list_replace()` | 用另一个元素替换列表中的元素 |\n| `list_entry()`\
  \ | 遍历列表中的所有节点 |\n| `list_for_each_entry()` | 更简单的列表迭代接口 |\n| `list_for_each_entry_safe()`\
  \ | |\n| `list_empty()` | 检查列表中是否有任何元素 |\n| `list_splice()` | 将一个列表与另一个列表合并 |\n\n\
  为了说明链表的使用，让我们实现一个示例。该示例也可以作为理解工作队列（work queues）概念的基础，工作队列将在下一节中进行讨论。假设你的内核驱动程序需要从入口点执行一项耗时任务。一个示例是一个强制调用线程进入睡眠等待的任务。自然地，你的驱动程序不喜欢阻塞直到任务完成，因为这会降低依赖它的应用程序的响应速度。因此，每当驱动程序需要执行这项昂贵的工作时，它通过将相应的例程添加到工作函数链表来延迟执行。实际工作由内核线程执行，该线程在后台遍历列表并执行工作函数。驱动程序将工作函数提交到链表末尾，而内核线程从链表头部开始处理，从而确保先排队的任务先完成。当然，驱动程序的其他部分需要设计得以适应这种延迟执行的方案。然而，在理解此示例之前，请注意我们将使用列表\
  \ 3.5 中的工作队列接口以更简单的方式实现相同的任务。\n\n让我们首先介绍示例中用到的关键驱动数据结构：\n\n```c\nstatic struct _mydrv_wq\
  \ {\n    struct list_head mydrv_worklist; /* 工作链表 */\n    spinlock_t lock; /* 保护链表\
  \ */\n    wait_queue_head_t todo; /* 同步提交者和工作者 */\n} mydrv_wq;\n\nstruct _mydrv_work\
  \ {\n    struct list_head mydrv_workitem; /* 工作链 */\n    void (*worker_func)(void\
  \ *); /* 要执行的工作 */\n    void *worker_data; /* 传递给 worker_func 的参数 */\n    /* ...\
  \ */ /* 其他字段 */\n} mydrv_work;\n```\n\n`mydrv_wq` 对所有工作提交是全局的。它的成员包括指向工作列表头的指针，以及一个用于在提交工作的驱动函数与执行工作的内核线程之间通信的等待队列。链表辅助函数不保护对列表成员的访问，因此你需要使用并发机制来对同时的指针引用序列化。这是通过使用\
  \ `mydrv_wq` 部分的自旋锁（spinlock）实现的。列表 3.2 中的驱动初始化程序 `mydrv_init()` 初始化了自旋锁、链头和等待队列，并启动了工作线程。\n\
  \n#### 列表 3.2 初始化数据结构\n```c\nstatic int __init\nmydrv_init(void)\n{\n    /* 初始化锁以防止并发访问链表\
  \ */\n    spin_lock_init(&mydrv_wq.lock);\n    /* 初始化用于提交者和工作者通信的等待队列 */\n    init_waitqueue_head(&mydrv_wq.todo);\n\
  \    /* 初始化链表头 */\n    INIT_LIST_HEAD(&mydrv_wq.mydrv_worklist);\n    /* 启动工作线程。参见列表\
  \ 3.4 */\n    kernel_thread(mydrv_worker, NULL,\n    CLONE_FS | CLONE_FILES | CLONE_SIGHAND\
  \ | SIGCHLD);\n    return 0;\n}\n```\n\n在检查执行提交工作的工作线程之前，让我们先看工作提交本身。列表 3.3 实现了一个内核其他部分可以使用它来提交工作的函数。它使用\
  \ `list_add_tail()` 将工作函数添加到链表的末尾。查看图 3.1 以了解工作表的物理结构。\n\n**图 3.1 工作函数链表。**\n(`mydrv_work`,\
  \ `mydrv_work`, 包含 `myddrv worklist` 和 `mydrv_workitem` 的 `mydrv_wq`）\n\n#### 列表\
  \ 3.3 提交待执行的工作\n```c\nint\nsubmit_work(void (*func)(void *), void *data)\n{\n  \
  \  struct _mydrv_work *mydrv_work;\n    /* 分配工作结构体 */\n    mydrv_work = kmalloc(sizeof(struct\
  \ _mydrv_work), GFP_ATOMIC);\n    if (!mydrv_work) return -1;\n    /* 填充工作结构体 */\n\
  \    mydrv_work->worker_func = func; /* 工作函数 */\n    /* 传递给 worker_func 的参数 */\n\
  \    mydrv_work->worker_data = data;\n    /* 保护链表 */\n    spin_lock(&mydrv_wq.lock);\n\
  \    /* 将工作添加到链表末尾 */\n    list_add_tail(&mydrv_work->mydrv_workitem, &mydrv_wq.mydrv_worklist);\n\
  \    /* 唤醒工作线程 */\n    wake_up(&mydrv_wq.todo);\n    spin_unlock(&mydrv_wq.lock);\n\
  \    return 0;\n}\n```\n\n要从驱动提交工作函数，请执行 `submit_work(job, NULL)`。在提交工作后，列表 3.3\
  \ 唤醒了工作线程。列表 3.4 所示的工作线程结构与之前讨论的类似。仔细查看列表 3.4 中的相关行：`mydrv_work = list_entry(mydrv_wq.mydrv_worklist.next,\
  \ struct _mydrv_work, mydrv_workitem);`。\n\n`mydrv_workitem` 嵌入在 `mydrv_work` 中，因此\
  \ `list_entry()` 返回指向容器 `mydrv_work` 的指针。传递给 `list_entry()` 的参数是列表节点的地址、容器类型以及嵌入节点的字段名。在执行提交的工作后，工作线程从列表中删除相应的节点\
  \ `list_del()`。注意，在执行工作期间，`mydrv_wq.lock` 是释放的。这是因为工作函数可能会睡眠，导致新调度的代码尝试获取同一个自旋锁时死锁。\n\
  \n#### 列表 3.4 工作线程\n```c\nstatic int\nmydrv_worker(void *unused)\n{\n    DECLARE_WAITQUEUE(wait,\
  \ current);\n    void (*worker_func)(void *);\n    void *worker_data;\n    struct\
  \ _mydrv_work *mydrv_work;\n    set_current_state(TASK_INTERRUPIBLE);\n    /* 等待被要求退出\
  \ */\n    while (!asked_to_die()) {\n        add_wait_queue(&mydrv_wq.todo, &wait);\n\
  \        if (list_empty(&mydrv_wq.mydrv_worklist)) {\n            schedule();\n\
  \            /* 被提交者唤醒 */\n        } else {\n            set_current_state(TASK_RUNNING);\n\
  \        }\n        remove_wait_queue(&mydrv_wq.todo, &wait);\n    }\n    /* 保护链表的并发访问\
  \ */\n    spin_lock(&mydrv_wq.lock);\n    /* 遍历列表并处理每个节点中的\n       工作函数 */\n   \
  \ while (!list_empty(&mydrv_wq.mydrv_worklist)) {\n        /* 获取列表中的第一个节点 */\n \
  \       mydrv_work = list_entry(mydrv_wq.mydrv_worklist.next,\n        struct _mydrv_work,\
  \ mydrv_workitem);\n        worker_func = mydrv_work->worker_func;\n        worker_data\
  \ = mydrv_work->worker_data;\n        /* 此节点已处理。将其从\n           列表中移出 */\n     \
  \   list_del(&mydrv_work->mydrv_workitem);\n        spin_unlock(&mydrv_wq.lock);\n\
  \        worker_func(worker_data);\n        spin_lock(&mydrv_wq.lock);\n    }\n\
  \    spin_unlock(&mydrv_wq.lock);\n    return 0;\n}\n```\n\n\n\n\n\n```c\nlist_del(mydrv_wq.mydrv_worklist.next);\n\
  \nkfree(mydrv_work); /*释放节点 */\n\n/* 执行此节点中的工作函数 */\n\nspin_unlock(&mydrv_wq.lock);\
  \ /* 释放锁 */\n\nworker_func(worker_data);\n\nspin_lock(&mydrv_wq.lock); /* 重新获取锁\
  \ */\n\n}\n\nspin_unlock(&mydrv_wq.lock);\n\nset_current_state(TASK_INTERRUPTIBLE);\n\
  \n}\n\nset_current_state(TASK_RUNNING);\n\nreturn 0;\n\n}\n```\n\n为了简单起见，示例代码没有进行错误处理。例如，如果列表\
  \ 3.2 中的 `kernel_thread()` 调用失败，你需要释放为相应的工作结构分配的内存。此外，列表 3.4 中的 `asked_to_die()`\
  \ 尚未编写。它的本质作用是：如果检测到已递送的信号，或者收到来自 `release()` 入口的通信（指示模块即将从内核中卸载），则跳出循环。\n\n在结束本节之前，让我们来看另一个有用的列表库例程\
  \ `list_for_each_entry()`。使用此宏，迭代变得更加简单且易于读，因为你不需要在循环内部使用 `list_entry()`。如果你会在循环内部删除列表元素，请使用\
  \ `list_for_each_entry_safe()` 变体。你可以替换列表 3.4 中的以下代码段：\n\n```c\nwhile (!list_empty(&mydrv_wq.mydrv_worklist))\
  \ {\n    mydrv_work = list_entry(mydrv_wq.mydrv_worklist.next,\n    struct _mydrv_work,\
  \ mydrv_workitem);\n    /* ... */\n}\n```\n\n替换为：\n\n```c\nstruct _mydrv_work *temp;\n\
  list_for_each_entry_safe(mydrv_work, temp,\n    &mydrv_wq.mydrv_worklist,\n    mydrv_workitem)\
  \ {\n    /* ... */\n}\n```\n\n在这种情况下，你不能使用 `list_for_each_entry()`，因为你在列表 3.4 的循环内部删除了\
  \ `mydrv_work` 指向的条目。`list_for_each_entry_safe()` 使用传递作为第二个参数的临时变量（`temp`）来保存列表中下一个条目的地址，从而解决了这个问题。\n\
  \n### 哈希列表 (Hash Lists)\n\n之前讨论的双链表实现对于实现哈希表等链式数据结构的情况并不是最优的。这是因为哈希表只需要一个包含单个指针的列表头。为了减少此类应用程序的内存开销，内核提供了哈希列表（或\
  \ `hlists`），它是列表的一种变体。与对列表头和列表节点使用相同结构的普通列表不同，`hlists` 具有分离的定义：\n\n```c\nstruct\
  \ hlist_head {\n    struct hlist_node *first;\n};\nstruct hlist_node {\n    struct\
  \ hlist_node *next, **pprev;\n};\n```\n\n为了适应单指针 hlist 头的方案，节点维护了指向上一个节点的指针地址，而不是指针本身。\n\
  \n哈希表是通过 `hlist_heads` 数组来实现的。每个 `hlist_head` 都是一个由 `hlist_nodes` 组成的双向链表。使用哈希函数来定位\
  \ `hlist_head` 数组中的索引（或桶）。完成后后，你可以使用 `hlist` 辅助例程（也定义在 `include/linux/list.h` 中）来操作链接到所选桶的节点列表。查看\
  \ `fs/dcache.c` 中目录缓存 (`dcache`) 的实现作为示例。\n\n### 工作队列 (Work Queues)\n\n工作队列是在内核内部延迟工作的一种方法。延迟工作在无数情况下都是很有用的。示例包括：\n\
  \n*   响应错误中断以触发网络适配器的重启\n*   文件系统任务，例如同步磁盘缓冲区\n*   向磁盘发送命令并执行存储协议状态机\n\n工作队列的功能与列表\
  \ 3.2 到 3.4 中描述的示例相似。然而，工作队列可以帮助你以更简单的方式完成任务。\n\n工作队列辅助库向用户暴露了两个接口结构：`workqueue_struct`\
  \ 和 `work_struct`。按照以下步骤使用工作队列：\n\n1.  创建一个带有一个或多个关联内核线程的工作队列（或 `workqueue_struct`）。要创建一个为\
  \ `workqueue_struct` 服务的内核线程，请使用 `create_singlethread_workqueue()`。要为系统中的每个 CPU\
  \ 创建一个工作线程，请使用 `create_workqueue()` 变体。内核还有默认的每个 CPU 工作线程（`events/n`，其中 `n` 是 CPU\
  \ 编号），你可以共享它们，而不是请求单独的工作线程。根据你的应用程序，如果没有专用的工作线程，可能会产生性能影响。\n2.  创建一个工作元素（或 `work_struct`）。使用\
  \ `INIT_WORK()` 初始化 `work_struct`，它会填充入你的工作函数的地址和参数。\n3.  将工作元素提交到工作队列。可以使用 `queue_work()`\
  \ 将 `work_struct` 提交到专用队列，或使用 `schedule_work()` 提交到默认内核线程。\n\n```c-c\n#include <linux/workqueue.h>\n\
  struct workqueue_struct *wq;\n\n/* 驱动初始化 */\nstatic int __init mydrv_init(void)\n\
  {\n    /* ... */\n    wq = create_singlethread_workqueue(\"mydrv\");\n    return\
  \ 0;\n}\n\n/* 提交工作。第一个参数是工作函数，第二个参数是函数的参数 */\nint submit_work(void (*func)(void\
  \ *data), void *data)\n{\n    struct work_struct *hardwork;\n    hardwork = kmalloc(sizeof(struct\
  \ work_struct), GFP_KERNEL);\n    /* 初始化工作 */\n    INIT_WORK(hardwork, func, data);\n\
  \    /* 入队工作 */\n    queue_work(wq, hardwork);\n    return 0;\n}\n```\n\n如果你使用工作队列，除非声明模块为\
  \ GPL，否则会导致链接错误。这是因为内核只向 GPL 代码导出这些函数。如果你查看内核的工作队列实现，你会看到这样的限制：\n\n```c\nEXPORT_SYMBOL_GPL(queue_work);\n\
  ```\n\n要宣布你的模块基于 GPL 许可，请声明以下：\n\n```c\nMODULE_LICENSE(\"GPL\");\n```\n\n### 通知链\
  \ (Notifier Chains)\n\n*通知链*用于向请求它的代码区域发送状态变更消息。与硬编码机制不同，通知提供了一种在感兴趣的事件生成时获取警报的通用技术。通知最初被用于向内核相关部分传递网络事件，但现在用于许多其他用途。内核对重大事件实现了预定义的通知。此类通知的示例包括：\n\
  \n*   **死亡通知 (Die notification)**：当内核函数触发陷阱或故障时（由“oops”、页错误或命中断点引起）。例如，如果你正在为医疗级显卡编写设备驱动程序，你可能希望注册死亡通知，以便在内核崩溃时尝试关闭医疗电子设备。\n\
  *   **网络设备通知 (Net device notification)**：当网络接口启动或关闭时生成。\n*   **CPU 频率通知 (CPU frequency\
  \ notification)**：当处理器频率转换时分发。\n*   **IP 地址通知 (Internet address notification)**：当检测到网络接口\
  \ IP 地址变化时发送。\n\n通知的一个示例用户是*高级数据链路控制* (HDLC) 协议驱动程序 *drivers/net/wan/hdlc.c*，它注册到网络设备通知链以感知载波变化。\n\
  \n要将你的代码附加到通知链，你需要注册一个事件处理程序到\n\n\n\n\n相关的链。当关心的事件发生时，一个事件标识符和一个特定于通知器的参数将作为参数传递给处理程序例程。要定义自定义的通知器链，你必须额外实现在检测到事件时触发该链的基础设施。\n\
  \n`Listing 3.6` 包含了使用预定义和用户定义通知器的示例。\n\n表 `3.2` 包含了 `Listing 3.6` 中用到的通知器链及其传播的事件的简要描述，因此请结合列表和表格一起查看。\n\
  \n### 表 3.2 通知器链及其传播的事件\n\n| 通知器链 | 描述 |\n| :--- | :--- |\n| **死亡通知器链 (Die Notifier\
  \ Chain)** | `my_die_event_handler()` 使用 `register_die_notifier()` 挂接到死亡通知器链 `die_\
  \ (die_chain)chain` 上。要触发 `my_die_event_handler()` 的调用，请在代码某处引入无效解引用，例如：\n```c\n\
  int *q = 0;\n*q = 1;\n```\n当执行这段代码段时，将调用 `my_die_event_handler()`，你会看到类似以下的消息：\n\
  `my_die_event_handler: OOPs! at EIP=f00350e7`\n死亡事件通知器将 `die_args` 结构传递给已注册的事件处理器。该参数包含指向\
  \ `regs` 结构的指针，该结构携带故障发生时处理器寄存器内容的快照。`my_die_event_handler()` 打印指令指针寄存器的内容。*继续*\
  \ |\n| **网络设备通知器链 (Netdevice Notifier Chain)** | `my_dev_event_handler()` 使用 `register_netdevice_notifier()`\
  \ 挂接到网络设备通知器链 `(netdev_chain)netdev_chain` 上。你可以通过更改网络接口（如以太网 `ethX` 或环回接口 `lo`）的状态来生成此事件：\n\
  ```bash\nifconfig eth0 up\n```\n这将导致 `my_dev_event_handler()` 的执行。处理程序接收一个 `struct\
  \ net_device` 指针作为参数，其中包含网络接口的名称。`my_dev_event_handler()` 使用此信息产生以下消息：\n`my_dev_event_handler:\
  \ Val=1, Interface=eth0`\n`Val=1` 对应于 `include/linux/*notifier.h.*` 中定义的 `NETDEV_UP`\
  \ 事件。 |\n| **用户定义通知器链 (User-Defined Notifier Chain)** | `Listing 3.6` 还实现了一个自定义通知器链\
  \ `my_noti_chain`。假设你希望当用户从进程文件系统中的特定文件读取内容时生成一个事件。在相关的 procfs 读取例程中添加以下内容：\n```c\n\
  blocking_notifier_call_chain(&my_noti_chain, 100, NULL);\n```\n每当你读取对应的 `*/proc*`\
  \ 文件时，都将调用 `my_event_handler()` 并产生以下消息：\n`my_event_handler: Val=100`\n`Val` 包含生成的事件标识，在本例中为\
  \ 100。函数参数被留空未使用。 |\n\n当你的模块从内核释放时，必须从通知器链中注销事件处理器。例如，如果你在卸载 `Listing 3.6` 中的代码后对网络接口执行\
  \ `up` 或 `down` 操作，除非从模块的 `release()` 方法中执行 `unregister_netdevice_notifier(&my_dev_notifier)`，否则会被一个“oops”困扰。这是因为通知器链会认为处理器代码仍然有效的，尽管它已经从内核中移除了。\n\
  \n#### LISTING 3.6 通知器事件处理器 \n\n```c\n#include <linux/notifier.h>\n#include <asm/kdebug.h>\n\
  #include <linux/netdevice.h>\n#include <linux/inetdevice.h>\n\n/* 死亡通知器定义 */\nstatic\
  \ struct notifier_block my_die_notifier = {\n  .notifier_call = my_die_event_handler,\n\
  };\n\n/* 死亡通知事件处理器 */\nint\nmy_die_event_handler(struct notifier_block *self,\n\
  \  unsigned long val, void *data)\n{\n  struct die_args *args = (struct die_args\
  \ *)data;\n  if (val == 1) { /* '1' 对应于 \"oops\" */\n    printk(\"my_die_event:\
  \ OOPs! at EIP=%lx\\n\", args->regs->eip);\n  } /* 否则忽略 */\n  return 0;\n}\n\n/*\
  \ 网络设备通知器定义 */\nstatic struct notifier_block my_dev_notifier = {\n  .notifier_call\
  \ = my_dev_event_handler,\n};\n\n/* 网络设备通知事件处理器 */\nint my_dev_event_handler(struct\
  \ notifier_block *self,\n  unsigned long val, void *data)\n{\n  printk(\"my_dev_event:\
  \ Val=%ld, Interface=%s\\n\", val,\n    ((struct net_device *) data)->name);\n \
  \ return 0;\n}\n\n/* 用户定义通知器链实现 */\nstatic BLOCKING_NOTIFIER_HEAD(my_noti_chain);\n\
  static struct notifier_block my_notifier = {\n  .notifier_call = my_event_handler,\n\
  };\n\n/* 用户定义通知事件处理器 */\nint my_event_handler(struct notifier_block *self,\n  unsigned\
  \ long val, void *data)\n{\n  printk(\"my_event_handler: Val=%ld\\n\", val); //\
  \ 注意：原文此处逻辑似乎不符，此处按原意翻译\n  return 0;\n}\n\n/* 驱动初始化 */\nstatic int __init\nmy_init(void)\n\
  {\n  /* ... */\n  /* 注册死亡通知器 */\n  register_die_notifier(&my_die_notifier);\n  /*\
  \ 注册网络设备通知器 */\n  register_netdevice_notifier(&my_dev_notifier);\n  /* 注册用户定义通知器链\
  \ */\n  blocking_notifier_call_chain(&my_noti_chain, 100, NULL);\n  /* ... */\n\
  \  return 0;\n}\n```\n*(注：原文代码中 `my_event_handler` 内部 printk 似乎与定义处逻辑有出入，翻译已保持原文逻辑一致)*\n\
  \n#### 旧版通知器接口\n2.6.17 之前的内核仅支持通用通知器链。注册函数 `notifier_register()` 在内部使用自旋锁保护，但遍历分发事件的例程\
  \ `call_chain()` 是无锁的。无锁是因为函数可能会睡眠、在运行时自注销，或者从中断文中调用。新的通知器 API 是在原始接口的基础上构建的，旨在克服这些局限性。\n\
  \n#### Completion 接口\n内核许多部分启动某些活动作为独立的执行线程，然后等待它们完成。*completion*接口是实现此类模式高效且简单的方法。一些示例场景包括：\n\
  \n- 你的驱动模块由内核线程辅助。如果你 `rmmod` 模块，会在从内核空间移除代码之前调用 `release()` 方法。释放例程请求线程自杀并阻塞直到线程完成。`Listing\
  \ 3.7` 实现了这种情况。\n- 你正在编写块设备驱动的一部分（在第 14 章“块驱动”中讨论），向设备队列读取请求。这将触发作为独立线程或工作队列实现的状态机。驱动想要等待操作完成后继续其他活动。查看\
  \ `drivers/block/floppy.c` 示例。\n- 应用程序请求数模转换器（ADC）驱动以进行数据采样。驱动启动转换请求并等待，直到中断信号转换完成并返回数据。\n\
  \n#### LISTING 3.7 使用 Completion 函数同步\n\n```c\nstatic DECLARE_COMPLETION(my_thread_exit);\
  \ /* Completion */\nstatic DECLARE_WAIT_QUEUE_HEAD(my_thread_wait); /* 等待队列 */\n\
  int pink_slip = 0; /* 退出标志 */\n\n/* 辅助线程 */\nstatic int\nmy_thread(void *unused)\n\
  {\n  DECLARE_WAITQUEUE(wait, current);\n  daemonize(\"my_thread\");\n  add_wait_queue(&my_thread_wait,\
  \ &wait);\n  while (1) {\n    /* 直到事件发生前释放处理器 */\n    set_current_state(TASK_INTERRUPTIBLE);\n\
  \    schedule();\n  }\n}\n```\n\n\n\n\n```c\n/* 当线程从 my_thread_wait 等待队列\n唤醒时，控制流到达此处\
  \ */\n\n/* 如果被释放，则退出 */\n\nif (pink_slip) {\n\nbreak;\n}\n\n80 第 3 章 内核设施\n\n/*\
  \ 执行实际工作 */\n\n/* ... */\n\n}\n\n/* 退出等待队列 */\n\n__set_current_state(TASK_RUNNING);\n\
  \nremove_wait_queue(&my_thread_wait, &wait);\n\n/* 原子性地信号完成并退出 */\n\ncomplete_and_exit(&my_thread_exit,\
  \ 0);\n\n}\n\n/* 模块初始化 */\n\nstatic int __init\n\nmy_init(void)\n\n{\n\n/* ... */\n\
  /* 启动线程 */\nkernel_thread(my_thread, NULL,\n\nCLONE_FS | CLONE_FILES | CLONE_SIGHAND\
  \ | SIGCHLD);\n\n/* ... */\n}\n\n/* 模块释放 */\nstatic void __exit\n\nmy_release(void)\n\
  {\n\n/* ... */\npink_slip = 1; /* my_thread 必须退出 */\n\nwake_up(&my_thread_wait);\
  \ /* 激活 my_thread */\n\nwait_for_completion(&my_thread_exit); /* 等待 my_thread\n\
  退出 */\n\n/* ... */\n}\n```\n\n一个完成对象（completion object）可以使用 `DECLARE_COMPLETION()`\
  \ 静态声明，也可以用 `init_completion()` 动态创建。线程可以通过 `complete()` 或 `complete_all()` 的帮助信号完成。调用者可以通过\
  \ `wait_for_completion()` 等待完成。\n\n### 辅助接口\n\n81\n\n在列表 3.7 中，`my_release()` 在唤醒\
  \ `my_thread()` 之前，通过设置 `pink_slip` 提升了一个退出请求标志。随后它调用 `wait_for_completion()` 等待\
  \ `my_thread()` 完成其退出。方面，`my_thread()` 唤醒后发现 `pink_slip` 已设置，并执行以下操作：\n\n1. 向 `my_release()`\
  \ 发送完成信号\n2. 杀死自身。`my_thread()` 使用 `complete_and_exit()` 原子性地完成这两个步骤。使用 `complete_and_exit()`\
  \ 可以关闭在分别调用 `complete()` 和 `exit()` 时会在模块退出和线程退出之间产生的窗口。\n\n当我们在第 11 章开发一个示例遥测驱动时，将使用完成\
  \ API。\n\n### Kthread 辅助函数\n\nKthread 辅助函数在原始线程创建程序之上增加了一层封装，简化了线程管理任务。\n\n列表 3.8\
  \ 使用 kthread 辅助接口重写了列表 3.7。`my_init()` 现在使用 `kthread_create()` 而不是 `kernel_thread()`。你可以将线程名称传递给\
  \ `kthread_create()`，而不是在线程内部显式地调用 `daemonize()`。\n\n`kthread` 接口提供了免费访问一个使用完成接口实现的内置退出同步机制的权限。因此，正如列表\
  \ 3.8 中 `my_release()` 所做的那样，你可以直接调用 `kthread_stop()`，而不是费力地设置 `pink_slip`、唤醒 `my_thread()`\
  \ 并使用 `wait_for_completion()` 等待其完成。同样，`my_thread()` 可以整洁地调用 `kthread_should_stop()`\
  \ 来检查它是否应该收工。\n\n#### 列表 3.8 使用 Kthread 辅助函数进行同步\n\n```c\n/* ' '+' 和 '-' 显示了与列表\
  \ 3.7 的差异 */\n#include <linux/kthread.h>\n\n/* 辅助线程 */\nstatic int\n\nmy_thread(void\
  \ *unused)\n\n{\n\nDECLARE_WAITQUEUE(wait, current);\n\n- daemonize(\"my_thread\"\
  );\n- while (1) {\n\n+ /* 如果没有其他线程调用\n+ * kthread_stop()，则继续工作 */\n+ while (!kthread_should_stop())\
  \ {\n/* ... */\n- /* 如果被释放，则退出 */\n- if (pink_slip) {\n- break;\n- }\n/* ... */\n\
  }\n\n/* 退出等待队列 */\n\n__set_current_state(TASK_RUNNING);\n\nremove_wait_queue(&my_thread_wait,\
  \ &wait);\n\n- complete_and_exit(&my_thread_exit, 0);\n\n+ return 0;\n}\n\n+ struct\
  \ task_struct *my_task;\n\n/* 模块初始化 */\nstatic int __init\n\nmy_init(void)\n\n{\n\
  \n/* ... */\n- kernel_thread(my_thread, NULL,\n- CLONE_FS | CLONE_FILES | CLONE_SIGHAND\
  \ |\n- SIGCHLD);\n+ my_task = kthread_create(my_thread, NULL, \"%s\", \"my_thread\"\
  );\n+ if (my_task) wake_up_process(my_task);\n/* ... */\n}\n\n/* 模块释放 */\nstatic\
  \ void __exit\n\nmy_release(void)\n\n{\n\n/* ... */\n- pink_slip = 1;\n- wake_up(&my_thread_wait);\n\
  - wait_for_completion(&my_thread_exit);\n+ kthread_stop(my_task);\n/* ... */\n}\n\
  ```\n\n与其像列表 3.8 那样使用 `kthread_create()` 创建线程并通过 `wake_up_process()` 激活它，你可以使用以下单一调用：`kthread_run(my_thread,\
  \ NULL, \"%s\", \"my_thread\");`。\n\n### 错误处理辅助\n\n多个内核函数返回指针值。虽然调用者通常通过与 `NULL`\
  \ 比较来检查失败，但它们更多信息来解释发生的错误性质。由于内核地址具有冗余位，它们可以使用 `IS_ERR()`。\n\n```c\n#include <linux/err.h>\n\
  \nint function(void)\n{\n/* ... */\nvoid *buffer = kmalloc(100, GFP_KERNEL);\n\n\
  if (IS_ERR(buffer)) {\n    printk(\"错误返回=%ld\\n\", PTR_ERR(buffer));\n    return\
  \ PTR_ERR(buffer);\n}\n/* ... */\ntask = kthread_create(thread, NULL, \"%s\", \"\
  mydrv\");\nif (!IS_ERR(task)) {\n    /* 成功 */\n    wake_up_process(task);\n} else\
  \ {\n    /* 失败 */\n    printk(\"错误返回=%ld\\n\", PTR_ERR(task));\n}\n/* ... */\n}\n\
  \n### 查看源代码\n\n`ksoft`、`pdflush` 和 `khub` 内核线程分别位于 `kernel/softirq.c`、`mm/pdflush.c`\
