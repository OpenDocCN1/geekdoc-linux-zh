  \ Linux\n\n## [设备示例：Super I/O 芯片\n\n为了初步体验 `Linux-IrDA`，让我们两台笔记本电脑通过 `IR` 通通信。Super\
  \ I/O 芯片组通常支持 IrDA 之外的若干外设，如串口、并行端口、*乐器数字接口*（MIDI）和软盘控制器。\n\n注意，与可以建立一对多连接的蓝牙物理层不同，`IR`\
  \ 每个物理设备一次只能支持一个单一连接。\n\n*狗器*是插入串口或 USB 端口的红外设备。某些微控制器（如图 16.5 所示的 Cirrus Logic\
  \ EP7211）具有片上红外控制器并连接到它们的 UART 上，也被视为狗器。\n\n狗器驱动程序是一组控制方法，负责更改通信速度等操作。它们有四个入口点：`open()`、`reset()`、`change_speed()`\
  \ 和 `close()`。这些入口点被定义为 dongle_driver 结构的一部分，并在 IrDA 内核线程 `irda_` 的上下文中被调用。\n\n\n\
  \n\n\n`sir_wq`。Dongle 驱动方法允许阻塞，因为它们是在进程上下文中调用的且没有持有锁。IrDA 核心为 dongle 驱动提供了三个辅助函数：`sirdev_raw_write()`\
  \ 和 `sirdev_raw_read()` 用于与关联的 UART 交换控制数据，以及 `sirdev_set_dtr_rts()` 用于切换连接到 UART\
  \ 的调制解调器线路。\n\n由于你更有可能为 dongle 添加内核支持，而不是修改 Linux-IrDA 的其他部分，让我们来实现一个示例 dongle 驱动程序。假设你正在启用一个尚未支持的简单串口\
  \ IR dongle，它仅在 19200 或 57600 波特率下通信。同样假设当用户想要在这两个值之间切换波特率时，你必须将 UART 的发送请求（`RTS`）引脚拉低\
  \ 50 微秒，然后将其拉高 25 微秒。列表 16.2 实现了该设备的 dongle 驱动。\n\n#### 列表 16.2 示例 dongle 驱动\n```c\n\
  #include <linux/delay.h>\n\n#include <net/irda/irda.h>\n\n#include \"sir-dev.h\"\
  \ /* 假设此示例驱动位于\n*drivers/net/irda/* */\n\n/* 打开方法。当在关联的 UART 上发布 irattach 时调用此方法\
  \ */\nstatic int\nmydongle_open(struct sir_dev *dev)\n{\n    struct qos_info *qos\
  \ = &dev->qos;\n    /* 通过设置调制解调器控制线路 DTR/RTS 为 dongle 电 */\n    sirdev_set_dtr_rts(dev,\
  \ TRUE, TRUE);\n    /* mydongle 可以接受的速度 */\n    qos->baud_rate.bits &= IR_19200|IR_57600;\n\
  \    irda_qos_bits_to_value(qos); /* 设置 QoS */\n    return 0;\n}\n\n/* 更改波特率 */\n\
  static int\nmydongle_change_speed(struct sir_dev *dev, unsigned speed)\n{\n    if\
  \ ((speed == 19200) || (speed == 57600)){\n        /* 通过将 RTS 拉低 50 us 并拉回高位 25\
  \ us 来切换速度 */\n        sirdev_set_dtr_rts(dev, TRUE, FALSE);\n        udelay(50);\n\
  \        sirdev_set_dtr_rts(dev, TRUE, TRUE);\n        udelay(25);\n        return\
  \ 0;\n    } else {\n        return -EINVAL;\n    }\n}\n\n/* 重置 */\nstatic int\n\
  mydongle_reset(struct sir_dev *dev)\n{\n    /* 根据规范重置 dongle，例如\n    通过将 DTR 拉低\
  \ 50 us */\n    sirdev_set_dtr_rts(dev, FALSE, TRUE);\n    udelay(50);\n    sirdev_set_dtr_rts(dev,\
  \ TRUE, TRUE);\n    dev->speed = 19200; /* 重置速度为 19200 波特率 */\n    return 0;\n}\n\
  \n/* 关闭 */\nstatic int\nmydongle_close(struct sir_dev *dev)\n{\n    /* 根据规范关闭 dongle，\n\
  \    例如通过将 DTR 和 RTS 拉低... */\n    sirdev_set_dtr_rts(dev, FALSE, FALSE);\n    return\
  \ 0;\n}\n\n/* Dongle 驱动方法 */\nstatic struct dongle_driver mydongle = {\n    .owner\
  \ = THIS_MODULE,\n    .type = MY_DONGLE, /* 将此项添加到\n    *include/linux/irda.h* 中的枚举中\
  \ */\n    .open = mydongle_open, /* 打开 */\n    .reset = mydongle_reset, /* 重置 */\n\
  \    .set_speed = mydongle_change_speed, /* 更改速度 */\n    .close = mydongle_close,\
  \ /* 关闭 */\n};\n\n/* 初始化 */\nstatic int __init\nmydongle_init(void)\n{\n    /* 注册入口点\
  \ */\n    return irda_register_dongle(&mydongle);\n}\n\n/* 释放 */\nstatic void __exit\n\
  mydongle_cleanup(void)\n{\n    /* 取消入口点 */\n    irda_unregister_dongle(&mydongle);\n\
  }\n\nmodule_init(mydongle_init);\nmodule_exit(mydongle_cleanup);\n```\n对于真实世界的示例，请查看\
  \ `drivers/net/irda/tekram.c` 和 `drivers/net/irda/ep7211_ir.c`。现在你已经运行了物理层，让我们来研究\
  \ IrDA 协议。\n\n### IrComm\nIrComm 仿真串口端口。终端模拟器等应用程序以及 PPP 等协议可以在 IrComm 创建的虚拟串口接口上不受更改地运行。IrComm\
  \ 由两个相关的模块实现：`ircomm.ko` 和 `ircomm_tty.ko`。前者提供核心协议支持，而后者创建并管理仿真的串口端口节点 `/dev/ircommX*`。\n\
  \n#### 网络化\n有三种方式可以在 IrDA 上运行 TCP/IP 应用程序：\n1. 基于 IrComm 的异步传输\n2. 基于 IrDA 的同步传输\n\
  3. 基于 IrComm 的以太网传输\n\n在 IrComm 上进行网络传输等于串口上的 PPP。\n已删除文本。（注：原文在网络部分包含重复/损坏的片段，已进行清理以保持三种方法的核心含义完整。）\n\
  \n\n\n\n如果你的嵌入式设备只需要简单的红外接收功能，它可能使用一个微型红外接收器（例如 Vishay Semiconductors 的 `TSOP1730`\
  \ 芯片）。一个示例应用设备是安装在病房内的红外定位器，用于读取护士佩戴的红外标志发射的数据。在这种情况下，由于不存在 `IrDA` 协议交互，`IrDA` 栈是不相关的。如果定位器使用精简的私有协议来解析接收的数据，那么移植\
  \ `LIRC` 可能是大材小用。一个简单的解决方案可能是实现一个微小的只读字符驱动或杂项驱动程序，通过 `/dev` 或 `/sys` 接口将原始红外数据导出到合适的应用程序。\n\
  \n## WiFi\n\n## 查看源码\n查看 `/drivers/net/irda/` 以查找低级 `IrDA` 驱动，查看 `net/irda/` 以查找协议实现，查看\
  \ `include/net/irda/` 以查找头文件。可以通过 `/proc/sys/` 进行实验。\n\n通过 `/net/irda/` 调整 `IrDA`\
  \ 栈，并探索 `/proc/net/irda/` 以获取与不同 `IrDA` 层的状态信息。\n\n表 16.3 包含了本节使用的主要数据结构以及它们在源码树中的位置。表\
  \ 16.4 列出了你在本节中使用的主要内核编程接口及其定义的位置。\n\n### 表 16.3 数据结构摘要\n| 数据结构 | 位置 | 描述 |\n| :---\
  \ | :--- | :--- |\n| `dongle_driver` | `drivers/net/irda/sir-dev.h` | Dongle 驱动入口点\
  \ |\n| `sir_dev` | `drivers/net/irda/sir-dev.h` | SIR 设备的表示 |\n| `qos_info` | `include/net/irda/qos.h`\
  \ | 服务质量信息 |\n\n### 表 16.4 内核编程接口摘要\n| 内核接口 | 位置 | 描述 |\n| :--- | :--- | :--- |\n\
  | `irda_register_dongle()` | `drivers/net/irda/sir_dongle.c` | 注册一个 dongle 驱动 |\n\
  | `irda_unregister_dongle()` | `drivers/net/irda/sir_dongle.c` | 取消注册 dongle 驱动\
  \ |\n| `sirdev_set_dtr_rts()` | `drivers/net/irda/sir_dev.c` | 拨动连接到 IR 设备的串口上的调制解器控制线\
  \ |\n| `sirdev_raw_write()` | `drivers/net/irda/sir_dev.c` | 写入连接到 IR 设备的串口 |\n\
  | `sirdev_raw_read()` | `drivers/net/irda/sir_dev.c` | 从连接到 IR 设备的串口读取\n\n## WiFi\n\
  WiFi 或 *无线局域网* (WLAN) 是有线局域网的替代方案，通常用于校园内。IEEE 802.11a WLAN 标准使用 5GHz ISM（工业、科学医学）频段，支持高达\
  \ 54Mbps 的速度。802.11b 和 802.11g 标准使用 2.4GHz 段，分别支持 11Mbps 和 54Mbps 的速度。\n\nWLAN 与有线以太网相似之处在于，两者都从同一个地址池分配\
  \ MAC 地址，并且在操作系统中都表现为常规网络接口。例如，*地址解析协议* (ARP) 表包含 WLAN MAC 地址以及以太网 MAC 地址。\n\n然而然而，WLAN\
  \ 和有线以太网在链路层有显著差异：\n- 802.11 WLAN 标准使用冲突规避 (CSMA/CA)，而不是有线以太网使用的冲突检测 (CSMA/CD)。\n\
  - 与以太网帧不同，WLAN 帧是有确认的。\n- 由于无线网络固有的安全问题，WLAN 使用了一种名为 *有线等效隐私* (WEP) 的加密机制来提供与有线以太网同等的安全性。WEP\
  \ 将 40 位或 104 位密钥与随机的 24 位初始化向量结合，对数据进行加密解密。\n\nWLAN 支持两种通信模式：\n1. *自持模式* (Ad-hoc\
  \ mode)，一小组附近的站直接通信，不使用接入点。\n2. *基础模式* (Infrastructure mode)，数据交换通过接入点进行。接入点定期广播*服务集标识符*\
  \ (SSID 或 ESSID)，用于区分不同的 WLAN 网络。\n\n让我们看看 Linux 如何支持 WLAN。\n\n### 配置\n*无线扩展* (Wireless\
  \ Extensions) 项目定义了一个通用的 Linux API，以与设备无关的方式配置 WLAN 设备驱动程序。它还提供了一常用工具，用于设置和访问来自\
  \ WLAN 驱动的信息。各个驱动程序实现对无线扩展的支持，以便将其连接到通用接口，从而与工具连接。\n\n通过无线扩展，主要有三种方法与 WLAN 驱动程序通信：\n\
  1. 使用 `iwconfig` 工具进行标准操作。要将你的驱动连接到 `iwconfig`，你需要实现与设置 ESSID 和 WEP 密钥等参数的命令对应的规定函数。\n\
  2. 使用 `iwpriv` 进行特殊操作。要在你的驱动上使用 `iwpriv`，请定义与硬件相关的私 ioctl 并实现相应的处理函数。\n3. 通过 `/proc/net/wireless`\
  \ 获取 WiFi 特有的统计信息。为此，请在你的驱动中实现 `get_wireless_stats()` 方法。\n\n```c\n#include <linux/wireless.h>\n\
  #include <net/iw_handler.h>\n\n// ... (通过 /proc/net/wireless 实现统计信息)\n490-491\n\
  ```\n\n\n\n\n在编译了无线扩展（Wireless Extensions）的情况下，你可以使用 `iwconfig` 来配置 ESSID 和 WEP\
  \ 密钥、查看支持的私有命令并导出网络统计：\n\n```bash\nbash> iwconfig eth1 essid blue key 1234-5678-9012-3456-7890-1234-56\n\
  bash> iwconfig eth1\n```\n\n```text\neth1 IEEE 802.11b ESSID:\"blue\" Nickname:\"\
  ipw2100\"\nMode:Managed Frequency:2.437 GHz Access Point: 00:40:96:5E:07:2E\n...\n\
  Encryption key:1234-5678-9012-3456-7890-1234-56\nSecurity mode:open\n...\n```\n\n\
  ```bash\nbash> dhcpcd eth1\nbash> ifconfig\n```\n\n```text\neth1 Link encap:Ethernet\
  \ Hwaddr 00:13:E8:02:EE:18\ninet addr:192.168.0.41 Bcasr:192.168.0.255\nMask:255.255.255.0\n\
  ...\n```\n\n```bash\nbash> iwpriv eth1\n```\n\n```text\neth1 Available private ioctls:\n\
  myparam (8BE2): set 2 int & get 0\n```\n\n```bash\nbash> cat /proc/net/wireless\n\
  ```\n\n```text\nInter-| sta-| Quality | Discarded packets | Missed | WE\nface |\
  \ tus |link level noise|nwid crypt frag retry misc| beacon | 19\neth1: 0004 10\\\
  . 207\\. 0\\. 0 0 0 2 1 0\n```\n\n494 第 16 章 摆离线线的 Linux\n\n本地的 `iwconfig` 参数（如\
  \ ESSID 和 WEP 密钥）应与接入点的配置匹配。\n\n还有另一个名为 `cfg80211` 的项目，其目标与无线扩展相似。该项目从 2.6.22 内核版本开始已合并到主内核中。\n\
  \n## 设备驱动\n\n市场上存在数百个 WLAN 原始设备制造商（OEM），网卡有多种外形式，如 PCI、Mini PCI、CardBus、PCMCIA、Compact\
  \ Flash、USB 和 SDIO（参见侧边栏“WiFi over SDIO”）。然而，作为这些设备的核心的芯片数量以及相应的 Linux 设备驱动数量相对较少。Intersil\
  \ Prism 芯片组、Lucent Hermes 芯片组、Atheros 芯片组和 Intel Pro/Wireless 是流行的 WLAN 控制器。以下是使用这些控制器构建的示例设备：\n\
  \n*   **Intersil Prism2 WLAN Compact Flash 卡—** 内核源码树中的 Orinoco WLAN 驱动支持基于 Prism\
  \ 和 Hermes 的卡。查看 `drivers/net/wireless/*` 下的 `orinoco.c` 和 `hermes.c`。`orinoco_cs`\
  \ 提供了 PCMCIA/CF 卡服务。\n*   **Cisco Aironet CardBus 适配器—** 该卡使用 Atheros 芯片组。`Madwifi`\
  \ 项目 (http://madwifi.org/) 提供了一个适用于基于 Atheros 控制器构建的硬件的 Linux 驱动。由于许可问题，Madwifi\
  \ 源码库并不是内核源码树的一部分。Madwifi 驱动中一个名为“硬件访问层”（HAL）的模块是闭源的。这是因为 Atheros 芯片能够在允许的 ISM 频段之外的频率运行，并可以在各种功率水平下工作。美国联邦通信委员会（FCC）规定此类设置不应让用户轻易更改。HAL\
  \ 的部分以纯二进制的形式分发以符合 FCC 法规。这二进制部分与内核版本无关。\n*   **嵌入在许多笔记本电脑中的 Intel Pro/Wireless\
  \ Mini PCI（以及 PCIe Mini）卡—** 内核源码树包含了这些卡的驱动程序。2100 和 2200 BG 系列卡的驱动分别是 `drivers/net/wireless/ipw2100.c`\
  \ 和 `drivers/net/wireless/ipw2200.c`。这些设备需要网卡固件才能工作。你可以根据拥有的是 2100 还是 2200 卡，从 http://ipw2100.sourceforge.net/\
  \ 或 http://ipw2200.sourceforge.net/ 下载固件。第 4 章“打下基础”中的“微代码下载”章节描述了向这些卡下载固件所需的步骤。Intel\
  \ 对固件的分发条款具有限制性。\n*   **WLAN USB 设备—** Atmel USB WLAN 驱动 (http://atmelwlandriver.sourceforge.net/)\
  \ 支持使用 Atmel 芯片组构建的 USB WLAN 设备。WLAN 驱动的任务是让你的卡显示为普通网络接口。驱动实现通常分为以下几部分：\n\n    1.\
  \  **与 Linux 网络栈通信的接口—** 我们在第 15 章的“网络设备接口”部分详细讨论过这一点。你可以使用该章的列表 15.1 作为模板来实现你 WLAN\
  \ 驱动的这部分。\n    2.  **特定外形式的代码—** 如果你的卡是 PCI 卡，它必须设计成符合第 10 章“外围部件互连”所述的内核 PCI 子系统。同样，PCMCIA\
  \ 和 USB 卡必须与各自的核心层对接。\n    3.  **芯片组特定部分—** 这是 WLAN 驱动的基石，基于芯片数据表中的寄存器规范。然而，许多公司没有为编写开源设备驱动提供足够的文档，因此某些\
  \ Linux WLAN 驱动的这部分至少部分基于逆向工程。\n    4.  **对无线扩展的支持—** 前文所示列表 16.3 实现了一个示例。\n\n802.11\
  \ 协议栈中与硬件无关的部分可以在驱动程序间复用，因此它们被实现 `net/*ieee80211/*` 目录下的通用库函数集合。`ieee80211` 是核心协议模块，但如果你想通过\
  \ `iwconfig` 命令配置 WEP 密钥，你还需要加载 `ieee80211_crypt` 和 `ieee80211_crypt_wep`。要生成 802.11\
  \ 栈的调试输出，在配置内核时启用 `CONFIG_IEEE80211_DEBUG`。你可以使用 `/proc/net/ieee80211/debug_level`\
  \ 作为节点来微调你想看到的调试消息类型。从 2.6.22 版本开始，内核有一个由名为 Devicescape 公司捐赠的替代 802.11 栈 (`net/mac80211/*`)。WiFi\
  \ 设备驱动程序可能会在未来迁移到这个新栈。\n\n## WiFi over SDIO\n\n就像 PCMCIA 卡的功能从存储扩展到各种其他技术一样，SD 卡不再局限于消费电子产品的内存空间。安全数字输入/输出\
  \ (SDIO) 标准将 WiFi、蓝牙和 GPS 等技术引入了 SD 领域。托管在 http://sourceforge.net/projects/sdio-linux/\
  \ 的 Linux-SDIO 项目为多种 SDIO 卡提供了驱动。访问 www.sdcard.org 浏览 SD 卡协会网站。该协会采用最新标准是 microSD\
  \ 和 miniSD，它们是 SD 卡的微型外形式版本。\n\n## 查看源码\n\nWiFi 设备驱动存在于 `drivers/net/wireless/`。查看\
  \ `net/wireless/*` 以获取无线扩展和新的 `cfg80211` 配置接口的实现。两个 Linux 802.11 协议栈分别位于 `net/ieee80211/*`\
  \ 和 `net/mac80211/*`。\n\n## 蜂窝网络\n\n### GPRS\n\n由于 GPRS 芯片是蜂窝调制解调器，它们向系统提供 UART\
  \ 接口，通常不需要特殊的 Linux 驱动。以下是 Linux 支持常见 GPRS 硬件的方式：\n\n1. 对于带有内置 GPRS 支持的系统，例如一个带有西门子\
  \ MC-45 模块连接到微控制器 UART 通道的板卡，传统的 Linux 串口驱动就可以驱动该链路。\n\n497\n\n\n\n2. 对于像 Options\
  \ GPRS 卡（`serial_cs`）这样的 PCMCIA/CF GPRS 设备，通用的串口卡服务（Card Services）驱动程序允许操作系统的其他部分将该卡视为一个串口设备。第一个未使用的串口设备（`/dev/ttySX`）被分配给该卡。请查看第\
  \ 9 章中的图 9.5 获取说明。\n\n3. 对于 USB GPRS 调制解器，USB 转串口转换器通常将 USB 端口转换为虚拟串口。`usbserial`\
  \ 驱动让系统的其他部分将 USB 调制解器视为串口设备（`/dev/ttyUSBX`）。第 11 章中的“USB-Serial”节讨论了 USB 转串口转换器。\n\
  \n上述驱动描述也适用于驱动 GPS 接收器和通过 GSM 进行网络连接。\n\n串口链路建立后，您可以通过 AT 命令建立网络连接，AT 命令是与调制解器通信的标准语言。蜂窝设备支持扩展的\
  \ AT 命令集。具体的命令序列取决于所使用的特定蜂窝技术。例如用于通过 GPRS 连接的 AT 字符串。在进入数据模式并通过`GPRS 支持网关节点`（GGSN）连接到外部网络之前，GPRS\
  \ 设备必须使用 AT 命令定义上下文。这里有一个上下文字符串示例：\n\n`AT+CGDCONT=1,\"IP\",\"internet1.voicestream.com\"\
  ,\"0.0.0.0\",0,0`\n\n其中 1 代表上下文号，`IP` 是数据类型，`internet1.voicestream.com` 是特定于服务供应商的`接入点名称`APN），`0.0.0.0`\
  \ 请求服务供应商选择 IP 地址。最后两个参数涉及数据和头部压缩。通常不需要用户名和密码。\n\n正如您在第 9 章所看到的，PPP 被用作 GPRS 传输\
  \ TCP/IP 负载的媒介。调用 PPP 守护进程 `pppd` 的常用语法如下：\n\n```bash\npppd ttySX call connection-script\n\
  ```\n\n其中 `ttySX` 是运行 PPP 的串口，`connection-script` 是 `/etc/ppp/peers/5` 中的一个文件，其中包含建立链路的\
  \ AT 命令序列。在建立连接并完成身份验证后，PPP 会启动`网络控制协议`（NCP），例如`IP 控制协议`（IPCP）。当 IPCP 成功协商 IP 地址后，PPP\
  \ 开始与 TCP/IP 协议栈通信。\n\n这里有一个以 57600 波特率连接 GPRS 服务供应商的示例 PPP 连接脚本（`/etc/ppp/peer/gprs-seq`）。关于脚本中所有组成行的语义，请参阅\
  \ `pppd` 的 man 手页：\n\n```text\n57600\nconnect \"/usr/sbin/chat -s -v \"\" AT+CGDCONT=1,\"\
  IP\",\"internet2.voicestream.com\",\"0.0.0.0\",0,0 OK AT+CGDATA=\"PPP\",1\"\ncrtscts\n\
  noipdefault\nmodem\nusepeerdns\ndefaultroute\nconnect-delay 3000\n```\n\n### CDMA\n\
  \n出于性能考虑，许多 CDMA PC 卡具有内部 USB 控制器，CDMA 调制解器通过连接。插入此类卡时，系统会在 PCI 总线上看到一个或多个新的 PCI\
