  \n类驱动程序\n\n347\n\n低层 USB 转串口转换器驱动程序本质上执行以下操作：\n\n1. 使用 `usb_serial_register()` 向\
  \ USB 串口核心注册 `usb_serial_driver` 结构。作为 `usb_serial_driver` 提供的入口点构成了驱动程序的核心。\n2.\
  \ 填充 `usb_driver` 结构并使用 `usb_register()` 将其在 USB 核心中注册。\n\n\n\n\n\n## 硬件规格\n\n硬件规格隐藏在\
  \ gadget 内部。API 由各个设备控制器驱动程序提供实现，因此 gadget 驱动程序本身是硬件无关的。\n\n`Documentation/DocBook/gadget.tmpl`\
  \ 提供了 gadget API 的概览。访问 http://linux-usb.org/gadget/ 可以获取更多关于 gadget 项目的信息。\n\n\
  ## 调试\n\nUSB 总线分析仪可以放大总线上的活动情况，对于调试低级问题非常有用。如果你无法获得分析仪，或许可以使用内核的软 USB 追踪器 `usbmon`。该工具可以捕获\
  \ USB 主机控制器和设备之间的流量。要收集跟踪信息，请读取 `debugfs` 文件 `/sys/kernel/debug/usbmon/X`，其中 `X`\
  \ 是你的设备连接的总线号。\n\n例如，考虑一个连接到 PC 的 USB 磁盘。从 `/proc/bus/usb/devices` 中相关的“T:” 行，你可以看到该驱动器已连接到总线\
  \ 1：\n\n```bash\nT:\nBus=01 Lev=01 Prnt=01 Port=03 Cnt=01 Dev#= 2 Spd=480 MxCh=\
  \ 0\n```\n\n确保你的内核中已启用 `debugfs` (`CONFIG_DEBUG_FS`) 和 `usbmon` (`CONFIG_USB_MON`)\
  \ 支持。这是从磁盘拷贝文件时 `usbmon` 输出的快：\n\n```bash\nmount -t debugfs none_debugs /sys/kernel/debug/\n\
  cat /sys/kernel/debug/usbmon/1u\n```\n\n```\nee6a5c40 3718782540 S Bi:1:002:1 -115\
  \ 20480 <\nee6a5cc0 3718782567 S Bi:1:002:1 -115 65536 <\nee6a5d40 3718782595 S\
  \ Bi:1:002:1 -115 36864 <\nee6a5c40 3718788189 C Bi:1:002:1 0 20480 = 0f846801 118498f\
  \ 15c60500 01680106\n5e846801 608498fe 6f280087 68000000\nee6a5cc0 3718800994 C\
  \ Bi:1:002:1 0 65536 = 118498fe 15c60500 01680106 5e846801\n608498fe 6f280087 68000000\
  \ 00884800\nee6a5d40 3718801001 C Bi:1:002:1 0 36864 = 13608498 fe4f4a01 00514a01\
  \ 006f2800\n87680000 00008848 00000100 b7f00100\n...\n```\n\n每行输出都以 URB 地址开头，紧接着是事件时间戳。下一列中的\
  \ `S` 表示 URB 提交，`C` 表示回调完成。随后的字段格式为 `URBType:Bus#:DeviceAddress:Endpoint#`。在之前的输出中，`URBType`\
  \ 为 `Bi` 代表来自 `IN` 方向的批量（bulk）URB。之后，`usbmon` 会转储 URB 状态、数据长度、数据标记（之前输出中的 `=` 或\
  \ `<`）以及数据字（如果标记为 `=`）。之前输出的最后三行是与早期行中提交的批量 URB 相关的回调。你可以使用 URB 地址将回调与相关的提交匹配。`Documentation/usb/usbmon.txt`\
  \ 详细说明了 `usbmon` 语法，并包含了将输出解析为人类可读格式的示例代码。\n\n## 查看源码\n\n如果你在内核配置期间开启 `Device Drivers`（设备驱动）→\
  \ `USB Support`（USB 支持）→ `USB Verbose Debug Messages`（USB 详细调试信息），内核将输出 USB 子系统中存在的所有\
  \ `dev_dbg()` 语句的内容。你可以从 USB 文件系统 (`usbfs`) 节点 `/proc/bus/usb/devices` 中获取设备和总线的特定信息。正如我们在第\
  \ 19 章“用户空间中的驱动”中所讨论的，`usbfs` 还允许你在用户空间中实现 USB 设备驱动。即使你的 USB 驱动程序的最终目标是在内核内部，从用户空间驱动开始也可以简化调试和测试。\n\
  \n`linux-usb-devel` 邮件列表是讨论 USB 设备驱动相关问题的论坛。访问 https://lists.sourceforge.net/lists/listinfo/linux-usb-devel\
  \ 获取订阅和存档检索信息。阅读 http://www.linux-usb.org/usbtest 获取 USB 测试的思路。\n\nLinux-USB 项目的主页为\
  \ www.linux-usb.org。你可以从 www.usb.org/developers/docs 下载 USB 2.0 规范、OTG 补充说明以及其他相关标准。\n\
  \n\n\n\n`usb_find_interface()`\n`drivers/usb/core/usb.c`\n获取与 USB 驱动程序相关的 USB 接口。\n\
