  \ | 内核线程可以轮询此函数来检测另一个线程是否通过 `kthread_stop()` 请求其停止。 |\n| `IS_ERR()` | `/include/linux/err.h`\
  \ | 检查返回值是否为错误代码。 |\n\n## 查看源码\n\n87\n\n我们现在离编写设备驱动只有一步之遥。但在在此之前，让我们自己配备一些驱动程序概念。在本章的开头，我们将了解书的问题陈述；我们将查看\
  \ PC 兼容系统和嵌入式计算机上常见的设备和 I/O 接口。中断处理是大多数驱动程序的不可缺的一部分，因此我们接下来介绍编写中断处理程序的艺术。然后我们将注意力转向新的设备模型。新模型围绕\
  \ `sysfs`、`kobjects`、设备类和 `udev` 等抽象构建，这些抽象提炼了设备驱动程序的共性。新模型还将功能从内核空间推向用户空间，导致了设备驱动程序的彻底重构。\n\
  \n### 本章内容\n- 介绍设备和驱动程序 (90)\n- 中断处理 (92)\n- Linux 设备模型 (103)\n- 内存屏障 (114)\n- 电源管理\
  \ (114)\n- 查看源码 (115)\n\n89\n\n自然，访问外围设备的能力是系统运行的关键部分。设备驱动程序提供了实现这一点的引擎。本书的其余章节将专注于特定的设备接口，并教你如何实现相应的驱动程序。\n\
  \n用户应用程序无法直接与硬件通信，因为这需要特权。设备驱动程序承担了与硬件交互的负担，并导出应用程序和内核的其他部分可以使用的接口。应用程序通过 `/dev/`\
  \ 目录操作设备并通过 `/sys/` 目录获取设备信息。\n\n图 4.1 显示了典型 PC 兼容系统的硬件图。可以看出系统支持多种设备和接口技术，如内存、视频、音频、USB、PCI、WiFi、PCMCIA、I2C、IDE、以太网、串口、键盘、鼠标、软盘驱动器、并行端口红外。内存控制器和图形控制器是北桥芯片的一部分，而外围总线来自南桥。\n\
  \n90\n\n# 介绍设备和驱动程序\n\n91\n\n图 4.2 为一个假设的嵌入式设备说明了类似的框图。该图包含了 PC 世界中常见的接口，如闪存、LCD、触摸屏和手机调制器。\n\
  \n1 正如你之后将学的，网络应用程序使用不同的机制将其请求路由到底层驱动程序。\n\n![图 4.1]\n![图 4.2]\n\n\n\n\n以及处理器，设备通过异步断言某些硬件信号来请求处理器的关注。这些硬件信号被称为\
  \ `interrupts`（中断）。每个中断设备都被分配了一个关联的标识符，称为 `interrupt request` (`IRQ`) 编号。\n\n当处理器检测到\
  \ `IRQ` 上生成了中断时，它会突然停止正在的工作，并调用为相应的 `IRQ` 注册的 `interrupt service routine` (`ISR`，中断服务程序）。中断处理程序\
  \ (`ISRs`) 在中断上下文中执行。\n\n## 中断上下文\n\nISRs 是直接与硬件交互的关键代码。为了系统性能的整体利益，它们被赋予了立即执行的权限。然而，如果\
  \ ISRs 不快速且轻量，它们就违背了自身的哲学。VIP 享有优待待遇，但他们有责任将对公众造成的不便降至最低。为了补偿粗暴地中断当前的执行线程，ISRs 必须在一个名为中断上下文（或\
  \ `atomic context`）的受限环境中礼貌地执行。\n\n以下是位于中断上下文中执行代码的准则和禁忌列表：\n\n1. 如果你的中断上下文代码进入了睡眠，那将是严重的犯罪行为。中断处理程序不能通过调用如\
  \ `schedule_timeout()` 等睡眠函数来放弃处理器。在从中断处理程序中调用内核 API 之前，要透视嵌套调用链并确保它在内部不会触发阻塞等待。例如，`input_register_device()`\
  \ 从表面上看是无害，但在底层会触发对 `kmalloc()` 的调用，并指定 `GFP_KERNEL` 作为参数。正如你在第 2 章“深入内核内部”中所看到的，如果系统的空闲内存低于水位，一旦你以这种方式调用它，`kmalloc()`\
  \ 将会睡眠等待交换程序释放内存。\n\n2. 为了保护中断处理程序内部的临界区，你不能使用 `mutexes`（互斥锁），因为它们可能会睡眠。请改用 `spinlocks`（自旋锁），并且仅在必要时使用。\n\
  \n3. 中断处理程序不能直接与用户空间交换数据，因为它们没有通过进程上下文连接到用户态。这引出了中断处理程序不能睡眠的另一个原因：调度器是以进程为粒度工作的，因此如果中断处理程序睡眠并被调度出去，它们如何被放回运行队列呢？\n\
  \n4. 中断处理程序应该快速离开，但预计要完成工作。为了规避这个左右为难的困境，中断处理程序通常将工作拆分为两部分。处理器的精简 `top half`（上半部分）标记一个确认，声称它已处理中断，但实际上它将所有繁重的工作卸给了肥大的\
  \ `bottom half`（下半部分）。下半部分的执行被延迟到以后所有中断开启的时间。你将在以后讨论 `softirqs` 和 `tasklets` 时学习开发下半部分。\n\
  \n5. 你不需要设计可重入的中断处理程序。当一个中断处理程序运行时，相应的 `IRQ` 被禁用，直到处理程序返回。因此，与进程上下文代码不同，同一个处理程序的不同实例不会在多个处理器上同时运行。\n\
  \n6. 中断处理程序可能会被与高优先级 `IRQs` 关联的处理程序中断。你可以通过专门请求内核将你的中断处理程序视为 `fast`（快速）处理程序来防止这种嵌套中断。快速处理程序在本地处理器上禁用所有中断的情况下运行。在禁用中断或将你的中断处理程序标记为快速之前，请注意，中断关闭时间对系统性能是有害的。关闭时间越长，中断延迟（即生成的异常被处理之前的延迟）就越大。中断延迟与系统的实时响应能力成反比。函数可以检查\
  \ `in_interrupt()` 返回的值，以确定它是否在中断上下文中执行。\n\n与由外部硬件生成的异步中断不同，还有几类同步到达的中断。同步中断之所以被称为同步，是因为它们不是意外发生的——处理器本身通过执行指令来生成它们。外部中断和同步中断都由内核使用相同的机制处理。\n\
  \n同步中断的示例包括：\n- 异常（Exceptions），用于报告严重的运行时错误\n- 软件中断，例如在 x86 架构上实现系统调用的 `int 0x80`\
  \ 指令。\n\n### 分配 IRQ\n\n设备驱动程序必须将它们的 `IRQ` 编号连接到中断处理程序。为了实现这一点，它们需要知道分配给所驱动设备的 `IRQ`。`IRQ`\
  \ 分配可以是简单的，也可能需要复杂的探测。例如，在 PC 架构中，定时器中断被分配 `IRQ 0`，RTC 中断响应 `IRQ 8`。现代总线技术（如 `PCI`）足够复杂，可以响应关于其\
  \ `IRQs` 的查询（由 `BIOS` 在启动时遍历总线时分配）。`PCI` 驱动程序可以探测设备配置空间中的预留区域并确定 `IRQ`。对于较旧的设备，例如基于\
  \ `Industries Standard Architecture` (`ISA`) 的卡，驱动程序可能需要利用特定的硬件知识来探测和解码 `IRQ`。\n\
  \n查看 `/proc/interrupts` 获取系统上活动 `IRQs` 的列表。\n\n### 设备示例：滚轮\n\n现在你已经学习了中断处理的基础知识，让我们为示例滚轮设备实现一个中断处理程序。滚轮可以在某些手机和\
  \ PDA 上找到，用于方便菜单导航，并能够三种运动：顺时针旋转、逆时针旋转和按键。我们想象的滚轮接线方式使得这些任何一种运动都会在 `IRQ 7` 上中断处理器。处理器的\
  \ `General Purpose I/O` (`GPIO`) 端口 D 的三个低位连接到滚轮设备。这些引脚上对应不同轮子运动的波形如图 4.3 所示。中断处理程序的任务是通过查看端口\
  \ D `GPIO` 器来解码轮子运动。\n\n驱动程序必须首先请求 `IRQ` 并与其关联中断处理程序：\n\n```c\n#define ROLLER_IRQ\
  \ 7\n\nstatic irqreturn_t roller_interrupt(int irq, void *dev_id);\n\nif (\n   \
  \ request_irq(ROLLER_IRQ, roller_interrupt, IRQF_DISABLED |\nIRQF_TRIGGER_RISING,\
  \ \"roll\", NULL)) {\n    printk(KERN_ERR \"Roll: Can't register IRQ %d\\n\", ROLLER_IRQ);\n\
  \    return -EIO;\n}\n```\n\n让我们看看传递给 `request_irq()` 的参数。`IRQ` 编号不是查询或探测的，而是根据硬件连接硬编码为\
  \ `ROLLER_IRQ`。第二个参数 `roller_interrupt()` 是中断处理程序。它的原型指定返回类型为 `irqreturn_t`，如果中断处理成功，可以返回\
  \ `IRQ_HANDLED`，如果不是，则返回 `IRQ_NONE`。返回值对于 `PCI` 等 I/O 技术具有重要意义，因为多个设备可以共享同一个 `IRQ`。\n\
  \n`IRQF_DISABLED` 标志指定该中断处理程序被视为快速处理程序，因此内核在调用处理程序时必须禁用中断。`IRQF_TRIGGER_RISING`\
  \ 标志宣布滚轮在想要信号中断时会在中断线上产生上升沿。换句话说，滚轮\n\n\n\n是一种 `edge-sensitive`（边缘敏感）设备。某些设备则是 `level-sensitive`（电平敏感），它们会在\
  \ CPU 处理之前一直保持中断线有效状态。要将中断标记为电平敏感，请使用 `IRQF_TRIGGER_HIGH` 标志。该参数的其他可能值包括 `IRQF_RANDOM`（用于第\
  \ 5 章“字符驱动程序”中的“伪字符驱动程序”节）和 `IRQF_SHARED`（用于指定该 IRQ 由多个设备共享）。\n\n下一个参数 `\"roll\"\
  ` 用于在来自 `/proc/interrupts*` 等文件生成的数据中标识此设备。最后一个参数在本文例中被设置为 `NULL`，它仅与共享中断处理程序相关，用于识别共享该\
  \ IRQ 线的每个设备。\n\n从 2.6.19 内核开始，中断处理接口发生了一些变化。中断处理程序以前接收一个第三个参数 `(struct pt_regs\
  \ *)`，其中包含一个指向 CPU 寄存器的指针，但从 2.6.19 内核开始该参数已被移除。此外，`IRQF_xxx` 系列中断标志取代了 `SA_xxx`\
  \ 系列。例如，在较早的内核中，你必须使用 `SA_INTERRUPT` 而不是 `IRQF_DISABLED` 来标记中断处理程序为快速。\n\n驱动程序初始化不是请求\
  \ IRQ 的良好位置，因为即使设备未被使用，它也会占用这一宝贵的资源。因此，设备驱动通常在应用程序打开设备时请求 IRQ。同样，当应用程序关闭设备时释放 IRQ，而不是在退出驱动模块时释放。\n\
  \n释放 IRQ 的方法如下：\n\n```\nfree_irq(int irq, void *dev_id);\n```\n\n### 中断处理\n\n列表\
  \ 4.1 显示了滚轮中断处理程序的实现。\n\n`roller_interrupt()` 接收两个参数：IRQ 和作为关联的 `request_irq()`\
  \ 最后一个参数传递的设备标识符。请结合图 4.3 对应的此列表。\n\n#### 列表 4.1 滚轮中断处理程序\n\n```\nspinlock_t roller_lock\
  \ = SPIN_LOCK_UNLOCKED;\nstatic DECLARE_WAIT_QUEUE_HEAD(roller_poll);\n\nstatic\
  \ irqreturn_t\nroller_interrupt(int irq, void *dev_id)\n{\n    int i, PA_t, PA_delta_t,\
  \ movement = 0;\n    /* 获取端口 D 位 0, 1 和 2 的波形，\n    如图 4.3 所示 */\n    PA_t = PA_delta_t\
  \ = PORTD & 0x07;\n\n    /* 等待引脚状态改变。\n    （为循环添加一些超时） */\n    for (i=0; (PA_t==PA_delta_t);\
  \ i++){\n        PA_delta_t = PORTD & 0x07;\n    }\n\n    movement = determine_movement(PA_t,\
  \ PA_delta_t); /* 见下文 */\n    spin_lock(&roller_lock);\n    /* 将滚轮移动存储在缓冲区中，\n \
  \   供后续 read()/poll() 入口点访问 */\n    store_movements(movement);\n    spin_unlock(&roller_lock);\n\
  \n    /* 唤醒可能由于等待滚轮移动\n    而进入睡眠的 poll 入口点 */\n    wake_up_interruptible(&roller_poll);\n\
  \    return IRQ_HANDLED;\n}\n\nint\ndetermine_movement(int PA_t, int PA_delta_t)\n\
  {\n    switch (PA_t){\n        case 0:\n            switch (PA_delta_t){\n     \
  \           case 1:\n                    movement = ANTICLOCKWISE;\n           \
  \         break;\n                case 2:\n                    movement = CLOCKWISE;\n\
  \                    break;\n                case 4:\n                    movement\
  \ = KEYPRESSED;\n                    break;\n            }\n            break;\n\
  \        case 1:\n            switch (PA_delta_t){\n                case 3:\n  \
  \                  movement = ANTICLOCKWISE;\n                    break;\n     \
  \           case 0:\n                    movement = CLOCKWISE;\n               \
  \     break;\n            }\n            break;\n        case 2:\n            switch\
  \ (PA_delta_t){\n                case 0:\n                    movement = ANTICLOCKWISE;\n\
  \                    break;\n                case 3:\n                    movement\
  \ = CLOCKWISE;\n                    break;\n            }\n            break;\n\
  \        case 3:\n            switch (PA_delta_t){\n                case 2:\n  \
  \                  movement = ANTICLOCKWISE;\n                    break;\n     \
  \           case 1:\n                    movement = CLOCKWISE;\n               \
  \     break;\n            }\n            break;\n        case 4:\n            movement\
  \ = KEYPRESSED;\n            break;\n    }\n}\n```\n\n驱动程序入口点（如 `read()` 和 `poll()`）与\
  \ `roller_interrupt()`协同工作。例如，当处理程序解析滚轮移动时，它会唤醒任何等待的 `poll()` 线程，这些线程可能是响应 X Windows\
  \ 等应用程序发出的 `select()` 系统调用而进入睡眠。在学习了第 5 章字符驱动程序的内部原理后，重新查看列表 4.1 并实现完整的滚轮驱动程序。\n\
  \n第 7 章“输入驱动程序”中的列表 7.3 利用内核的输入接口将此滚轮转换为滚轮鼠标。\n\n让我们通过引入一些启用和禁用特定 IRQ 中断的函数来结束本节。enable_irq(ROLLER_IRQ)`\
  \ 在滚轮移动时启用中断生成，而 `disable_irq(ROLLER_IRQ)` 执行相反操作。`disable_irq_nosync(ROLLER_IRQ)`\
  \ 禁用滚轮中断但不等待任何正在执行的任务。\n\n\n\n`softirq` 正在等待执行。内核将在下一个可用机会执行它。这可能发生在退出中断处理程序期间，或者通过\
  \ `ksoftirqd` 内核线程完成。\n\n### 列表 4.3 使用 Tasklets 从中断处理程序中卸载工作\n\n```c\nstruct roller_device_struct\
  \ { /* 设备特定结构体 */\n    /* ... */\n    struct tasklet_struct tsklt;\n    /* ... */\n\
  };\n\nvoid __init roller_init()\n{\n    struct roller_device_struct *dev_struct;\n\
  \    /* ... */\n    /* 初始化 tasklet */\n    tasklet_init(&dev_struct->tsklt, roller_analyze,\
  \ dev);\n}\n\n/* 下半部 */\nvoid roller_analyze()\n{\n    /* 分析波形并在需要时切换到轮询模式 */\n\
  }\n\n/* 中断处理程序 */\nstatic irqreturn_t roller_interrupt(int irq, void *dev_id)\n\
  {\n    struct roller_device_struct *dev_struct;\n    /* 捕波流 */\n    roller_capture();\n\
  \    /* 标记 tasklet 为待处理 */\n    tasklet_schedule(&dev_struct->tsklt);\n    return\
  \ IRQ_HANDLED;\n}\n```\n\n`tasklet_init()` 动态初始化一个 tasklet。该函数并不为 `tasklet_struct`\
  \ 分配内存，而是要求你传递一个已分配结构体的地址。`tasklet_schedule()` 宣布相应的 tasklet 正在等待执行。与中断一样，内核提供了一系列函数，用于在多处理器系统上控制\
  \ tasklets 的执行状态：\n\n*   `tasklet_enable()` 启用 tasklets。\n*   `tasklet_disable()`\
  \ 禁用 tasklets 并等待任何正在执行的 tasklet 实例退出。\n*   `tasklet_disable_nosync()` 的语义与 `disable_irq_nosync()`\
  \ 类似。该函数不会等待活动中的 tasklet 实例完成执行。\n\n你已经看到了中断处理程序和下半部之间的区别，但它们也有一些相似之处。中断处理程序和 tasklets\
  \ 都是不可重入的。而且它们都不能进入睡眠。此外，中断处理程序、tasklets 和 `softirqs` 都不能被抢占。\n\n工作队列（Work queues）是从中断处理程序中延迟工作的第三种方法。它们在进程环境中执行并允许睡眠，因此它们可以使用诸如\
  \ `mutexes` 等休眠函数。我们在前一章查看各种内核辅助设施时讨论过工作队列。表 4.1 比较了 `softirqs`、`tasklets` 和工作队列。\n\
  \n#### 表 4.1 Softirqs、Tasklets 和工作队列的比较\n\n| 特性 | Softirqs | Tasklets | 工作队列 |\n\
  | :--- | :--- | :--- | :--- |\n| **执行上下文** | 延迟工作在中断上下文中运行。 | 延迟工作在中断上下文中运行。 | 延迟工作在进程环境中。\
  \ |\n| **重入性** | 可以在不同的 CPU 上同时运行。 | 不可以在不同的 CPU 上同时运行。然而，不同的 CPU 可以运行不同的 tasklet。\
  \ | 可以在不同的 CPU 上同时运行。 |\n| **睡眠** | 不能睡眠。 | 不能睡眠。 | 可以进入睡眠。 |\n| **抢占** | 不能被抢占/调度。\
  \ | 不能被抢占/调度。 | 可以被抢占/调度。 |\n| **易用性** | 不容易使用。 | 容易使用。 | 容易使用。 |\n| **使用场景** |\
  \ 如果延迟工作不会睡眠，且你有关键的可扩展性或速度要求时。 | 如果延迟工作不会睡眠。 | 如果延迟工作可能会睡眠。 |\n\nLKML 上正在就消除 tasklet\
  \ 接口的可性进行讨论。tasklets 的优先级高于进程上下文代码，因此它们会导致延迟问题。此外，正如你所学的，它们受限于不能睡眠且在同一 CPU 上执行。目前建议根据情况将所有现有的\
  \ tasklet 转换为 `softirqs` 或工作队列。第 2 章提到的 –rt 补丁集将中断处理移动到内核线程，以实现更广泛的抢占范围。\n\n###\
  \ Linux 设备模型\n\n新的 Linux 设备模型引入了类似 C++ 的抽象，将设备驱动程序中的共性提取到总线层和核心层。让我们来看构成设备模型的不同组件，如\
  \ `udev`、`sysfs`、`kobjects` 和“设备类”，以及它们对关键内核子系统（如 `/dev` 节点管理、热插拔、固件下载和模块自动加载）的影响。`Udev`\
  \ 是观察设备模型优势的最佳视角，所以让我们从那里开始。\n\n#### Udev\n\n多年前 Linux 尚幼时，管理设备节点并不是件趣的。所有需要的节点（可能达数千个）都必须静态地创建在\
  \ `/dev` 目录下。事实上这个问题一直追溯到原始的 UNIX 系统。随着 2.4 内核的出现，`devfs` 引入了动态设备节点创建。`devfs` 提供了在内存文件系统中生成设备节点的服务，但命名节点的责任仍然由设备驱动程序承担。然而，设备命名策略是管理性的，与内核结合得并不好。设备命名策略应该位于头文件、用户空间。udev\
  \ 依赖于以下内容：\n\n1.  `sysfs` 支持，这是 Linux 设备模型的重要组成部分。\n2.  一组用户空间守护进程，如 `udev`。\n3.\
  \  位于 `/etc/udev/rules` 的用户指定规则。\n\n为了理解如何使用 `udev`，让我们来看一个例子。假设有一个 DVD 驱动和一个 CD-RW\
  \ 驱动。根据热插拔的顺序，其中一个分配为 `/dev/sr0`，另一个分配为 `/dev/sr1`。在 udev 时代，你必须在使用设备之前弄清楚对应的名称。但有了\
  \ `udev`，无论插入顺序如何，都可以都可以查看 DVD（假设 dvd*）和 CD-RW（假设 cdrw*）。\n\n首先，从 sysfs 获取设备属性。假设是\
  \ DVD 驱动：\n\n```bash\nudevinfo -a -p /sys/block/sr0\n```\n...\n查看 `/sys/devices/pci0000:00/0000:00:1d.7/usb1/1-4`\
  \ 设备链：\n\n*   `BUS=\"usb\"`\n*   `ID=\"1-4\"`\n*   `bConfigurationValue=\"1\"`\n\
  ...\n*   `idProduct=\"0701\"`\n*   `idVendor=\"05e3\"`\n*   `manufacturer=\"Genesyslogic\"\
  `\n*   `maxchild=\"0\"`\n*   `product=\"USB Storage Device\"`\n\n现在，查看 CD-RW 驱动：\n\
  \n```bash\nudevinfo -a -p /sys/block/sr1\n```\n...\n查看 `/sys/devices/pci0000:00/0000:00:1d.7/usb1/1-3`\
  \ 设备链：\n\n*   `BUS=\"usb\"`\n*   `ID=\"1-3\"`\n*   `bConfigurationValue=\"2\"`\n\
  ...\n*   `idProduct=\"0302\"`\n*   `idVendor=\"0dbf\"`\n*   `manufacturer=\"Addonics\"\
  `\n*   `maxchild=\"0\"`\n*   `product=\"USB to IDE Cable\"`\n\n接下来，让我们利用收集的产品信息来识别设备并添加\
  \ udev 命名规则。创建一个 `/etc/udev/rules.d/40-cdvd.rules` 文件，并在其中添加以下规则：\n\n`BUS=\"usb\"\
  , idProduct=\"0701\", idVendor=\"05e3\", KERNEL=\"sr[0-9]*\", NAME=\"%k\", SYMLINK=\"\
  usbdvd\"`\n\n`BUS=\"usb\", idProduct=\"0302\", idVendor=\"0dbf\", KERNEL=\"sr[0-9]*\"\
  , NAME=\"%k\", SYMLINK=\"usbcdrw\"`\n\n第一个规则告诉 udev，当它发现一个产品 ID 为的 USB 设备时\n\n\n\
  \n\n\n`0x0701`、厂商 ID `0x05e3` 以及以 `sr` 开头的名称，应该会在 `/dev` 下创建一个同名的节点，并生成一个名为 `usbdvd`\
  \ 的符号链接指向该节点。同样，第二条规则规定为 CD-RW 驱动器创建一个名为 `usbcdrw` 的符号链接。\n\n要测试规则中的语法错误，请在 `/sys/block/sr*`\
  \ 上运行 `udevtest`。若要在 `/var/log/messages` 中开启详细消息，请在 `/etc/udev/udev.conf` 中将 `udev_log`\
  \ 设置为 `\"yes\"`。要使用新添加的规则重新填充 `/dev` 目录，请使用 `udevstart` 重启 `udev`。完成后，你的 DVD 驱动器在系统中始终显示为\
  \ `/dev/usbdvd`，而 CD-RW 驱动器始终显示为 `/dev/usbcdrw`。你可以通过像脚本使用类似的命令确定地挂载它们：\n\n```bash\n\
  mount /dev/usbdvd /mnt/dvd\n```\n\n设备节点（以及网络接口）的一致命名并不是 `udev` 的唯一功能。它也演变成了 Linux\
  \ 的热插拔管理器。`udev` 还负责根据需要自动加载模块，并将微代码下载到需要的设备上。但在深入研究这些功能之前，让我们对设备模型的内部结构有一个基本的了解。\n\
  \n### Sysfs, Kobjects 和设备类\n\n`Sysfs`、`kobjects` 和设备类是设备模型的构建块，但它们非常“低调”，倾向于留在幕后。它们大多位于总线和核心实现的用用领域，并隐藏在为设备驱动程序提供服务的\
  \ API 内部。\n\n`Sysfs` 是内核结构化设备模型在用户空间的表现。它与 `procfs` 类似，因为两者都是包含内核数据结构信息的内存文件系统。`procfs`\
  \ 是查看内核内部的通用窗口，而 `sysfs` 专门用于设备模型。因此，`sysfs` 并不是 `procfs` 的替代。进程描述符和 `sysctl` 参数等信息属于\
  \ `procfs` 而不是 `sysfs`。很快就会发现，`udev` 的大部分扩展功能都依赖于 `sysfs`。\n\n`Kobjects` 对通用对象属性（如引用计数）引入了封装。它们通常嵌入在更大的结构中。以下是\
  \ `kobject` 的主要字段，定义在 `include/linux/kobject.h` 中：\n\n1. 一个执行引用计数管理的 `kref` 对象。`kref_init()`\
  \ 接口初始化 `kref`，`kref_get()` 增加与 `kref` 关联的引用计数，`kref_put()` 减少引用计数并在没有剩余引用时释放对象。例如，`URB`\
  \ 结构（在第 11 章“通用串总线”中解释）包含一个 `kref` 用于跟踪指向它的引用数。\n2. 指向 `kset` 的指针，`kobject` 所属的对象集。\n\
  3. 一个 `kobj_type`，用于描述 `kobject` 的对象类型。\n\n> [!NOTE] \n> `usb_alloc_urb()` 接口调用\
  \ `kref_init()`，`usb_submit_urb()` 调用 `kref_get()`，而 `usb_free_urb()` 调用 `kref_put()`。\n\
  \n`Kobjects` 与 `sysfs` 是织在一起的。内核中实例化的每个 `kobject` 都有 `sysfs` 表示。\n\n设备类的概念是设备模型的另一个特性，它是你更有可能在驱动程序使用的接口。类接口抽象了每个设备都属于更广泛设备类（或类别）的想法。USB\
  \ 鼠标、PS/2 键盘和摇杆都属于 `input` 类，并在 `/sys/class/input/` 下拥有条目。\n\n图 4.4 显示了连接了外部 USB\
  \ 鼠标的笔记本电脑上的 `sysfs` 结构。顶层 `bus`、`class` 和 `device` 目录被展开，显示 `sysfs` 根据设备类型及其物理连接提供了\
  \ USB 鼠标的视图。该鼠标是一个输入类设备，但物理上是一个响应两个端点地址的 USB 设备：控制端点 `ep00` 和中断端点 `ep81`。该 USB 口属于总线\
  \ 2 上的 USB 主控制器，而 USB 主控制器本身通过 PCI 总线桥接到 CPU。如果这些细节现在读起来不太理解，不要担心；在读完介绍输入驱动（第 7\
  \ 章）、PCI 驱动（第 10 章“外围组件互连”）和 USB 驱动（第 11 章）的章节后，回到这一部分即可。\n\n```text\n[/sys]\n+[block]\n\
  -[bus]—[usb]—[devices]—[usb2]—[2-2]—[2-2:1.0]-[usbendpoint:usbdev2.2-ep81]\n-[class]-[input]—[mouse2]—[device]—[bus]—[usbendpoint:usbdev2.2-ep81]\n\
  -[usb_device]—[usbdev2.2]—[device]—[bus]\n-[usb_endpoint]—[usbdev2.2-ep00]—[device]\n\
  —[usbdev2.2-ep81]—[device]\n-[devices]—[pci]\n```\n\n\n\n\n设备模型的另一部分抽象是 `bus-device-driver`\
  \ 编程接口。内核设备支持被清晰地结构化为线（bus）、设备（device）和驱动（driver）。这使得各个驱动实现变得更加简单通用。例如，`Bus` 实现可以搜索处理特定设备的驱动。\n\
  \n考虑内核的 `I2C` 子系统（在第 8 章“相互集成电路协议”中探讨）。`I2C` 层由核心基础设施、总线适配器设备驱动以及客户端设备驱动组成。`I2C`\
  \ 核心层使用 `bus_register()` 注册每个检测到的 `I2C` 总线适配器。当一个 `I2C` 客户端设备（例如电学可擦除编程只读存储器 [EEPROM]\
  \ 芯片）被探测并检测到，其存在性通过 `device_register()` 被记录。最后，`I2C` EEPROM 客户端驱动使用 `driver_register()`\
  \ 注册自己。这些注册是通过 I2C 核心层提供的服务函数间接完成的。\n\n`bus_register()` 在 `/sys/bus/` 中添加相应的条目，而\
  \ `device_register()` 则在 `/sys/devices/` 下添加条目。`struct bus_type`、`struct device`\
  \ 和 `struct device_driver` 分别是总线、设备和驱动使用的主要数据结构。可以 `include/linux/device.h` 查看它们的定义。\n\
  \n### 热插与冷插\n\n在运行的系统中即时连接的设备被称为“热插”（hotplugged），而在系统启动之前连接的设备被认为是“冷插”（coldplugged）。早些时候，内核通过调用通过\
  \ `/proc` 文件系统注册的辅助程序来向用户空间通知热插事件。但当前的内核在检测到热插时，会通过 netlink sockets 向用户空间分发 uevents。netlink\
  \ sockets 是一种使用 socket API 在内核空间和用户空间之间进行通信的高效机制。在用户端，管理设备节点创建和删除的守护进程 `udevd` 接收\
  \ uevents 并管理热插。\n\n为了查看热插处理是如何演变的，让我们考虑运行不同版本 2.6 内核的 `udev` 逐渐：\n\n1. 使用 `udev-039`\
  \ 包和 2.6.9 内核，当内核检测到热插事件时，它会调用在 `/proc/sys/kernel/hotplug` 注册的用户空间辅助程序。这默认为 `/sbin/hotplug`，它在环境变量环境中接收热插设备的属性。`/sbin/hotplug`\
  \ 检查热插配置目录（通常为 `/etc/hotplug.d/default/`），并在执行完 `/etc/hotplug/` 下的其他脚本后，运行例如 `/etc/hotplug.d/default/10-udev.hotplug`。\n\
  \n```bash\nls -l /etc/hotplug.d/default/\n...\nlrwcrwxrwx 1 root root 14 May 11\
  \ 2005 10-udev.hotplug -> /sbin/udevsend\n...\n```\n\n因此，当 `/sbin/udevsend` 执行时，它会将热插设备信息传递给\
  \ `udevd`。\n\n2. 使用 `udev-058` 和 2.6.11 内核，情况发生了一些变化。`udevsend` 工具替换了 `/sbin/hotplug`：\n\
  \n```bash\ncat /proc/sys/kernel/hotplug\n/sbin/udevsend\n```\n\n3. 使用最新版本的 `udev`\
  \ 和内核，`udevd` 承担了管理热插的全责任，不再依赖 `udevsend`。它现在通过 netlink sockets 直接从内核拉取热插事件（见图 4.4）。`/proc/sys/kernel/hotplug`\
  \ 为空：\n\n```bash\ncat /proc/sys/kernel/hotplug\n```\n\n`udev` 也处理冷插。由于 `udev` 是用户空间的一部分，且仅在内核启动后启动，因此需要一种特殊的机制来在冷插设备上模拟热插事件。在启动时，内核会为所有设备在\
  \ sysfs 下创建一个名为 `uevent` 的文件，并向这些文件发射冷插事件。当 `udev` 启动时，它从 `/sys` 读取所有的 `uevent`\
  \ 文件，并为每个冷插设备生成热插 uevents。\n\n### 微码下载\n\n你必须在某些设备准备绪之前向它们提供微码。微码由卡上的微控制器执行。设备驱动程序曾将微码存储在头文件中的静态数组中。但这已变得不可行，因为微码通常由设备供应商以专有二进制镜像的形式分发，这与\
  \ GPL 授权的内核无法良好混合。反对将固件与内核源码混合的另一个原因是它们运行在不同的发布时间线上。解决方案是在用户空间中单独维护微码，并在需要时将其传递给内核。`Sysfs`\
  \ 和 `udev` 提供了实现此点的基础设施。\n\n以在几台笔记本电脑上常见的 Intel PRO/Wireless 2100 WiFi mini PCI\
  \ 卡为例。该卡围绕一个微控制器构建，该控制器需要执行外部提供的微码才能正常工作。让我们看看 Linux 驱动程序下载微码到卡的步骤。假设你已经从 `http://...`\
  \ 获取了所需的微码镜像 (`ipw2100-1.3.fw`)。\n\n1. 在初始化期间，驱动程序调用 `request_firmware(\"ipw2100-1.3.fw\"\
  )`。\n2. 这向用户空间分发一个热插 uevent。\n3. `udev` 接收 uevent 并通过 `/etc/udev/rules.d/` 中类似的规则做出响应：`ACTION==\"\
  add\", SUBSYSTEM=\"firmware\", RUN=\"/sbin/helper\"`。\n4. `/sbin/helper` 检查 `/sys/class/`\
  \ 并找到镜像。\n5. 驱动程序接收微码并将其下载到设备。\n6. 完成后，它调用 `release_firmware()` 释放数据结构。\n\n### 模块加载\n\
  \n按需加载内核模块是 Linux 支持的一种方便功能。为了理解内核如何发射故障以及 `udev` 如何处理它，让我们插入一个 Xircom CardBus 适配器：\n\
  \n1. 在编译期间，支持设备的身份作为驱动对象的一部分生成。查看支持 Xircom CardBus 的驱动 (`drivers/net/tulip/xircom_cb.c`)\
  \ 并找到这段代码：\n\n```c\nstatic struct pci_device_id xircom_pci_table[] = {\n    {0x115D,\
  \ 0x0003, PCI_ANY_ID, PCI_ANY_ID,},\n    {0,},\n};\n\n/* 标记设备表 */\nMODULE_DEVICE_TABLE(pci,\
  \ xircom_pci_table);\n```\n\n这声明了驱动可以支持任何 PCI  ID 为 `0x115D` 且 PCI 设备 ID 为 `0x0003`\
  \ 的卡（详见第 10 章）。当你安装驱动模块时，`depmod` 工具检查模块镜像并解析设备表中的 ID。然后它在 `/lib/modules/kernel-version/modules.alias`\
  \ 中添加以下条目：`alias pci:v0000115Dd00000003sv*sd*bc*sc*i* xircom_cb`，其中 `v` 代表 VendorID，`d`\
  \ 代表 DeviceID，`sv` 代表 subvendorID，`*` 代表通配符。\n\n2. 当你将 Xircom 卡插入 CardBus 插槽时，内核会生成一个\
  \ uevent 来宣布新插入设备的身份。你可以使用 `udevmonitor` 查看生成的 uevent：\n\n```bash\nudevmonitor --env\n\
  ...\nMODALIAS=pci:v0000115Dd00000003sv0000115Dsd00001181bc02sc00i00\n...\n```\n\n\
  3. `udevd` 通过 netlink socket 接收 uevent 并调用 `modprobe` 带有\n\n\n\n\n\n内核传递给它的上述 `MODALIAS`\
  \ 为：\n\n`modprobe pci:v0000115Dd00000003sv0000115Dsd00001181bc02sc00i00`\n\n4. `modprobe`\
  \ 在第 1 步创建的 `/lib/modules/kernel-version/modules.alias` 中找到匹配的条目，并继续插入 `xircom_cb:`：\n\
  \n```bash\nlsmod\nModule Size Used by\nxircom_cb 10433 0\n...\n```\n\n卡现在准备好进行上网了。\n\
  你可能想在阅读第 10 章后重新回顾本节。\n\n## 嵌入式设备上的 Udev\n\n一种观点认为在嵌入式设备上应废弃使用 `udev`，转而使用静态创建的设备节点，原因如下：\n\
  \n- `udev` 在每次重启时都会创建 `/dev` 节点，而静态节点仅在软件安装时创建一次。如果你的嵌入式设备使用闪存存储，在这种情况下，持有 `/dev`\
  \ 节点的闪存页在每次启动时都会经历擦写周期，这会缩短闪存寿命。（在第 17 章“内存技术设备”中详细讨论了闪存）。不过，你也可以选择在基于 RAM 的文件系统上挂载\
  \ `/dev`。\n- `udev` 会增加启动时间。\n- `udev` 的功能（如 `/dev` 节点的动态创建和模块的自动加载）产生了一种不确定性，某些解决方案设计者希望在特殊用途嵌入式设备上避免这种性，特别是那些不通过热插拔总线与外界交互的设备。根据这种观点，静态节点创建和启动时插入任何模块可以对系统提供更多控制并使其更容易测试。\n\
  \n## 内存屏障\n\n许多处理器和编译器会重排指令以实现最佳执行速度。重排是为了使得新的指令流在语义上与原始流等效。然而，如果你正在向 I/O 设备上的内存映射寄存器写入数据，指令重排可能会产生意想不到的副作用。为了防止处理器重排指令，你可以在代码中插入一个屏障（barrier）。`wmb()`\
  \ 函数插入一个路障，防止写操作通过它，`rmb()` 提供一个读屏障，不允许读取跨越它，而 `mb()` 则产生一个读写屏障。\n\n除了之前提到的 CPU\
  \ 与硬件的交互外，内存屏障对于 SMP 系统上的 CPU 与 CPU 之间的交互也相关。如果你的 CPU 数据缓存在写回模式下运行（即在绝对必要之前，数据不会从缓存复制到内存），你可能希望挂起指令流直到缓存到内存队列排空。例如，当你遇到获取或释放锁的指令时，这就相关。在这种情况下，使用屏障是为了获得跨\
  \ CPU 的一致感官。\n\n当我们在第 10 章讨论 PCI 驱动程序和第 17 章讨论内存驱动程序时会回到内存屏障。在此期间，可以通过 `Documentation/memory-barriers.txt`\
  \ 了解不同类型内存屏障的解释。\n\n## 电源管理\n\n电源管理对于电池供电设备（如笔记本电脑和手持设备）至关重要。Linux 驱动需要感知电源状态并响应\
  \ `standby`（待机）、`sleep`（睡眠）和低电等事件进行状态转换。驱动程序在切换到低功耗模式时利用底层硬件支持的节能功能。例如，存储驱动程序会让磁盘停止，而视频驱动程序则会让显示器空白。\n\
  \n设备驱动程序中的电源感知代码只是整个电源管理框架的一部分。电源管理还涉及用户空间守护进程、工具、配置文件和引导固件的参与。两种流行的电源管理机制是 APM（在附录\
  \ B“Linux 与 BIOS”的“保护模式调用”节中讨论）和 `Advanced Configuration and Power Interface` (ACPI)。APM\
  \ 正变得过时，而 ACPI 已成为 Linux 系统上的事实电源管理策略。ACPI 在第 20 章中进一步讨论。\n\n## 查看源码\n\n核心中断处理代码是通用的，位于\
  \ `kernel/irq/` 目录。特定架构的部分可以在 `arch/your-arch/kernel/irq.c` 中找到。该文件中定义的 `do_IRQ()`\
  \ 函数是开启内核中断处理机制之旅的良好起点。\n\n内核软 irq 和 tasklet 的实现在 `kernel/softirq.c` 中。该文件还包含额外的函数，可以对\
  \ softirq 和 tasklet 提供更细粒度的控制。查看 `include/linux/interrupt.h` 获取实现中断处理程序所需的 softirq\
  \ 向量枚举和原型。要编写中断处理程序和下半部分的实际示例，请从 `drivers/net/lib8390.c` 中的处理程序开始，并顺着路径进入网络栈。\n\n\
  kobject 实现和相关的编程接口位于 `lib/kobject.c` 和 `include/linux/kobject.h` 中。查看 `drivers/base/sys.c`\
  \ 获取 sysfs 的实现。你会在 `drivers/base/class.c` 中找到设备类 API。通过 netlink socket 分发热插 uevent\
  \ 是由 `lib/kobject_uevent.c` 完成的。你可以从 `www.kernel.org/pub/linux/utils/kernel/hotplug/udev.html`\
  \ 下载 udev 源和文档。\n\n为了充分了解 APM 在 x86 Linux 上如何实现，请查看 `arch/x86/kernel/apm_32.c`、`include/linux/apm_bios.h`\
  \ 以及 `include/asm-x86/apm.h`。如果你好奇在没有 BIOS 的架构（如 ARM）上如何实现 APM，请查看 `include/linux/apm-emulation.h`。内核的\
  \ ACPI 实现位于 `drivers/acpi/`。表 4.2 包含了本章使用的主要数据结构及其在源码树中的定义。\n\n### 表 4.2 数据结构总结\n\
