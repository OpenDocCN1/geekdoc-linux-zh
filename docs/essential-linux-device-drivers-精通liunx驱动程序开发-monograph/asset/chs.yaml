  `H` 值指定水平扫描率，即视频硬件每秒内扫描的水平显示行数。这是 `pixclock` 乘以 `X-resolution` 的倒数。`V` 值是整个显示器的刷新率。这是\
  \ `pixclock` 乘以可见 X 分辨率乘以可见 Y 分辨率的倒数，在本例中约为 60Hz。换句话说，LCD 每秒刷新 60 次。\n\n视频控制器在每行结束时发出水平同步\
  \ (`HSYNC`) 脉冲，并在每个显示帧后发出垂直同步 (`VSYNC`) 脉冲。`HSYNC`（以像素为单位）和 `VSYNC`（以像素行为单位）的持续时间显示为以“timings”开头的行的最后两个参数。显示器越大，`HSYNC`\
  \ 和 `VSYNC` 的可能值越大。`timings` 行中 `HSYNC` 持续之前的四个数字分别表示右边距（或水平前肩）、左边距（或水平后肩）、下边距（或垂直前肩）和上边缘（或后肩）的长度。\n\
  \n帧 API\n\n有时，配置与显示面板关联的属性可能是你为了在设备上启用视频而需要做的唯一驱动程序更改，因此，让我们通过查看常见的显示参数开始学习视频驱动程序。我们假设相关驱动程序符合帧接口，并使用\
  \ `fbset` 工具获取显示特性：\n\n`/dev/fbX` 是与帧设备节点。帧内核导出节点到用户空间以便应用程序访问 `/dev/fbX`。\n\n输出中的\
  \ `D` 值代表 `dotclock`，即视频硬件在显示器上绘制像素的速度。前述输出中的 `65.003MHz` 值意味着视频控制器花费 (1/65.003*1000000)\
  \ 或约 15,384 皮秒来绘制单个像素。这个持续时间被称为 `pixclock`，显示为以 `timings` 开头的行的第一个数字参数。“geometry”旁边的数字表示可见和虚拟分辨率为\
  \ 1024×768 (SVGA)，且存储与像素相关信息的位数为 8。\n\n`H` 值指定水平扫描率，即视频硬件每秒内扫描的水平显示行数。这是 `pixclock`\
  \ 乘以 `X-resolution` 的倒数。`V` 值是整个显示器的刷新率。这是 `pixclock` 乘以可见 X 分辨率乘以可见 Y 分辨率的倒数，在本例中约为\
  \ 60Hz。换句话说，LCD 每秒刷新 60 次。\n\n视频控制器在每行结束时发出水平同步 (`HSYNC`) 脉冲，并在每个显示帧后发出垂直同步 (`VSYNC`)\
  \ 脉冲。`HSYNC`（以像素为单位）和 `VSYNC`（以像素行为单位）的持续时间显示为以“timings”开头的行的最后两个参数。显示器越大，`HSYNC`\
  \ 和 `VSYNC` 的可能值越大。`timings` 行中 `HSYNC` 持续之前的四个数字分别表示右边距（或水平前肩）、左边距（或水平后肩）、下边距（或垂直前肩）和上边缘（或后肩）的长度。\n\
  \n### 与显卡相关的变量信息\n\n上一节的输出保存在 `fb_var_info` 中。此结构包含了 X 分辨率、Y 分辨率、像素位数、pixclock、HSYNC\
  \ 持续时间、VSYNC 持续时间和边缘长度。这些值允许用户编程：\n\n```c\nstruct fb_var_info {\n    u32 xres; /*\
  \ X 轴可见分辨率 */\n    u32 yres; /* Y 轴可见分辨率 */\n    ...\n    u32 bits_per_pixel; /*\
  \ 存储像素的位数 */\n    ...\n    u32 pixclock; /* 皮秒单位的像素时钟 */\n    u32 left_margin; /*\
  \ 从同步到图像的时间 */\n    u32 right_margin; /* 从图像到同步的时间 */\n    ...\n    u32 hsync_len;\
  \ /* 水平同步长度 */\n    u32 vsync_len; /* 垂直同步长度 */\n};\n```\n\n关于视频硬件的固定信息（如帧内存的起始地址和大小）保存在\
  \ `fb_fix_info` 中。这些值无法由用户更改：\n\n```c\nstruct fb_fix_info {\n    char id[16]; /*\
  \ 标识字符串 */\n    unsigned long smem_start; /* 帧内存起始 */\n    u32 smem_len; /* 帧内存长度\
  \ */\n    ...\n};\n```\n\n### 映射\n\n`fb_cmap` 结构指定颜色映射，用于将用户的颜色定义传递给底层视频硬件。你可以使用此结构定义你所需的\
  \ RGB（红、绿、蓝）比例：\n\n```c\nstruct fb_cmap {\n    u32 start; /* 第一条目 */\n    u32 len;\
  \ /* 条目数 */\n    u16 red; /* 红色值 */\n    u16 green; /* 绿色值 */\n    u16 blue; /*\
  \ 蓝色值 */\n    u16 transp; /* 透明度。后文讨论 */\n};\n```\n\n列表 12.1 是在帧 API 上运行的简单应用程序。该程序通过操作\
  \ `/dev/fb0`（对应显示器的帧设备节点）来清除屏幕。它首先使用帧 API `FBIOGET_VSCREENINFO` 以硬件无关的方式解析可见分辨率和*像素位数*。\n\
  \n此显示命令通过操作来获取显示器的变量参数\n\n\n\n\n\n`fb_var_screeninfo` 结构。程序随后通过 `mmap()` 映射帧缓冲区内存并清除每个成分的像素位。\n\
  \n# 第 12 章 视频驱动\n\n## 列表 12.1 以硬件无关的方式清除显示\n\n```c\n#include <stdio.h>\n#include\
  \ <fcntl.h>\n#include <linux/fb.h>\n#include <sys/mman.h>\n#include <stdlib.h>\n\
  \nstruct fb_var_screeninfo vinfo;\n\nint main(int argc, char *argv[])\n{\n    int\
  \ fbfd, fbsize, i;\n    unsigned char *fbbuf;\n\n    /* 打开视频内存 */\n    if ((fbfd\
  \ = open(\"/dev/fb0\", O_RDWR)) < 0) {\n        exit(1);\n    }\n\n    /* 获取可变显示参数\
  \ */\n    if (ioctl(fbfd, FBIOGET_VSCREENINFO, &vinfo)) {\n        printf(\"Bad\
  \ vscreeninfo ioctl\\n\");\n        exit(2);\n    }\n\n    /* 帧缓冲区大小 = (X 分辨率 *\
  \ Y 分辨率 * 每个像素字节数) */\n    fbsize = vinfo.xres*vinfo.yres*(vinfo.bits_per_pixel/8);\n\
  \n    /* 映射视频内存 */\n    if ((fbbuf = mmap(0, fbsize, PROT_READ|PROT_WRITE, MAP_SHARED,\
  \ fbfd, 0)) == (void *) -1) {\n        exit(3);\n    }\n\n    /* 清除屏幕 */\n    for\
  \ (i=0; i<fbsize; i++) {\n        *(fbbuf+i) = 0x0;\n    }\n\n    munmap(fbbuf,\
  \ fbsize);\n    close(fbfd);\n}\n```\n\n## 帧缓冲区驱动\n\n我们在第 19 章“用户空间中的驱动”中学习从用户空间访问内存区域时，将查看另一个帧缓冲区应用。\n\
  \n现在你已经对帧缓冲区 API 以及它如何提供硬件无关性有了初步了解，让我们通过导航系统的示例来发现低级帧缓冲区设备驱动的架构。\n\n### 设备示例：导航系统\n\
  \n图 12.6 显示了基于嵌入式 SoC 构建的示例车辆导航系统的视频操作。GPS 接收器通过 `UART` 接口向 SoC 流传输坐标。应用程序根据接收到的位置信息生成图形并更新系统内存中的帧缓冲区。帧缓冲区驱动通过\
  \ DMA 将此图像数据传输到作为 SoC LCD 控制器一部分的缓冲区。控制器将像素数据转发到 QVGA LCD 面板进行显示。\n\n我们的目标是为该系统开发视频软件。假设\
  \ Linux 支持该导航设备上使用的 SoC，并且内核支持如 `DMA` 等所有依赖于架构的服务。\n\n图 12.6 所示设备的一种可能的硬件实现是使用 Freescale\
  \ 的 `i.MX21` SoC。在这种情况下，CPU 核心是 `ARM9` 核心，片上视频控制器是液晶晶显示控制器 (`LCDC`)。SoC 通常具有高性能的内部本地总线，连接到如\
  \ `DRAM` 和视频等控制器。对于 `iMX.21`，此总线被称为高级高性能总线 (`AHB`)。`LCDC` 连接到 `AHB`。\n\n导航系统的视频软件大致架构设计为一个运行在针对\
  \ `LCD controller` 的低级帧缓冲区驱动之上的 GPS 应用程序。应用程序通过读取 `/dev/ttySX` 获取 GPS 接收器的坐标，其中\
  \ `X` 是连接到接收器的 `UART` 编号。然后将地理定位信息转换为图像，并将像素数据写入与 `LCD controller` 关联的帧缓冲区。这与列表\
  \ 12.1 中的代码类似，不同之处在于分发图像数据而不是用于清除屏幕的零。\n\n**（图 12.6 Linux 导航设备上的显示。）**\n\n本节的其余部分仅关注低级帧缓冲区设备驱动。与许多其他驱动程序子系统一样，帧缓冲区核心层提供的全套功能、模式和选项是非常复杂的，只有通过编程经验才能掌握。该示例导航系统的帧缓冲区驱动相对简单，仅作为进行更深层次探索的起点。\n\
  \n表 12.1 描述了图 12.6 所示 `LCD controller` 的寄存器模型。列表 12.2 中的帧缓冲区驱动在这些寄存器上运行。\n\n###\
  \ 表 12.1 图 12.6 所示 LCD 控制器的寄存器布局\n\n| 寄存器名称 | 用于配置 |\n| :--- | :--- |\n| `SIZE_REG`\
  \ | LCD 面板的最大 X 和 Y 尺寸 |\n| `HSYNC_REG` | `HSYNC` 持续时间 |\n| `VSYNC_REG` | `VSYNC`\
  \ 持续时间 |\n| `CONF_REG` | 每个像素位数、像素极性、生成像素时钟的时钟分频器、颜色/单色模式等 |\n| `CTRL_REG` | 启用/禁用\
  \ LCD 控制、时钟和 `DMA` |\n| `DMA_REG` | 帧缓冲区的 `DMA` 起始地址、突发长度和水位大小 |\n| `STATUS_REG`\
  \ | 状态值 |\n| `CONTRAST_REG` | 对比度 |\n\n我们的帧缓冲区驱动（称为 `myfb`）被实现为一个平台驱动。正如你在第 6 章中学到的，`platform`\
  \ 用于集成设备，`arch/your-platform/` 中的 `probe()` 方法通过 `platform_add()` 注册自身。\n\n## 数据结构\n\
  \n让我们来看看主要的结构，然后聚焦 `fb`。以下是两个结构：\n\n1. `struct fb_info` 是核心数据结构。该结构在 `include/fb.h`\
  \ 中的定义如下：\n\n```c\nstruct fb_info {\n    /* ... */\n    struct fb_var_screeninfo\
  \ var; /* 可变显示信息。之前讨论过。 */\n    struct fb_fix_info fix; /* 固定显示信息。之前讨论过。 */\n  \
  \  /* ... */\n    struct fb_cmap cmap; /* 颜色映射。之前讨论过。 */\n    /* ... */\n    struct\
  \ fb_ops *fbops; /* 驱动操作。将讨论。 */\n    /* ... */\n    char __iomem *screen_base;\
  \ /* 帧缓冲区地址 */\n    unsigned long screen_size; /* 帧缓冲区大小 */\n    /* ... */\n   \
  \ /* 从此处开始设备 */\n    void *par; /* 私有区域 */\n};\n```\n\n`fb_info` 的内存由帧缓冲区核心提供的库程序\
  \ `framebuffer_alloc()` 分配。该函数还将私有区域的大小作为参数并将其附加 `fb_info` 的末尾。可以使用 `fb_info` 结构中的\
  \ `par` 指针引用该私有区域。`fb_info` 字段（如 `fb_var_screeninfo` 和 `fb_fix_info`）的语义已经在“帧缓冲区\
  \ API”中讨论过。\n\n2. `fb_ops` 结构包含了低级帧缓冲区驱动提供的所有入口点地址。`fbops` 中的前几个方法对于驱动的运行是必要的，而其余提供图形加速的可选方法。每个函数的职责在注释中都有简要解释：\n\
  \n```c\nstruct fb_ops {\n    struct module *owner;\n    /* 驱动打开 */\n    int (*fb_open)(struct\
  \ fb_info *info, int user);\n    /* 驱动关闭 */\n    int (*fb_release)(struct fb_info\
  \ *info, int user);\n    /* ... */\n    /* 视频参数的健全检查 */\n    int (*fb_check_var)(struct\
  \ fb_var_screeninfo *var, struct fb_info *info);\n    /* 配置视频控制器寄存器 */\n    int\
  \ (*fb_set_par)(struct fb_info *info);\n    /* 创建伪颜色调色板 */\n    int (*fb_setcolreg)(unsigned\
  \ regno, unsigned red, unsigned green, unsigned blue, unsigned transp, struct fb_info\
  \ *info);\n    /* 显示器/取消显示 */\n    int (*fb_blank)(int blank, struct fb_info *info);\n\
  \    /* ... */\n    /* 用像素行填充矩形的加速方法 */\n    void (*fb_fillrect)(struct fb_info\
  \ *info, const struct fb_fillrect *rect);\n    /* 从一个屏幕区域拷贝矩形区域到另一个区域的加速方法 */\n\
  \    void (*fb_copyarea)(struct fb_info *info, const struct fb_copyarea *region);\n\
  };\n```\n\n\n\n\n```c\n/* 将图像绘制到显示器上的加速方法 */\n\nvoid (*fb_imageblit)(struct fb_info\
  \ *info, const struct fb_image *image);\n\n/* 旋转显示器的加速方法 */\n\nvoid (*fb_rotate)(struct\
  \ fb_info *info, int angle);\n\n# 帧缓冲驱动\n369\n\n/* 支持设备特定命令的 Ioctl 接口 */\nint (*fb_ioctl)(struct\
  \ fb_info *info, unsigned int cmd, unsigned long arg);\n\n/* ... */\n};\n```\n\n\
  现在让我们来看列表 12.2 为 `myfb` 驱动程序实现的驱动方法。\n\n### 检查和设置参数\n\n`fb_check_var()` 方法对 X 分辨率、Y\
  \ 分辨率和像素位等变量进行合理性检查。因此，如果你使用 `fbset` 设置的低于 LCD 控制器支持的（在示例中为 64）的 X 分辨率，该函数将将其限制为硬件允许的最小值。\n\
  \n`fb_check_var()` 还会设置合适的 RGB 格式。我们的示例使用每像素 16 位，控制器将帧缓冲区中的每个数据字映射到常用的 RGB565 编码：5\
  \ 位红色、6 位绿色和 5 位蓝色。三种颜色在数据字中的偏移量也相应地设置。\n\n`fb_set_par()` 方法根据 `fb_info.var` 中找到的值配置\
  \ LCD 控制器的寄存器。这包括设置：\n* `HSYNC_REG` 中的水平同步时间、左边距和右边距\n* `VSYNC_REG` 中的垂直同步持续、上边缘和下边缘\n\
  * `SIZE_REG` 中的可见的 X 和 Y 分辨率\n* `DMA_REG` 中的 DMA 参数\n\n假设 GPS 应用程序尝试将 QVGA 显示的分辨率更改为\
  \ 50×50。以下是序列：\n\n1. 显示器初始为 QVGA 分辨率：\n\n```bash\nfbset mode \"320x240-76\"\n# D:\
  \ 5.830 MHz, H: 18.219 kHz, V: 75.914 Hz\ngeometry 320 240 320 240 16\ntimings 171521\
  \ 0 0 0 0 0 0\nrgba 5/11,6/5,5/0,0/0\nendmode\n```\n\n370 第 12 章 视频驱动\n\n2. 应用程序执行如下操作：\n\
  \n```c\nstruct fb_var_screeninfo vinfo;\nfbfd = open(\"/dev/fb0\", O_RDWR);\nvinfo.xres\
  \ = 50;\nvinfo.yres = 50;\nvinfo.bits_per_pixel = 8;\nioctl(fbfd, FBIOPUT_VSCREENINFO,\
  \ &vinfo);\n```\n\n注意，这等于命令 `fbset -xres 50 -yres 50 -depth 8`。\n\n3. 上一步中的 `FBIOPUT_VSCREENINFO`\
  \ `ioctl` 触发了 `myfb_check_var()` 的调用。该驱动方法表示不满，并将请求的分辨率向上取到硬件支持的最小值，在这种情况下为 64×64。\n\
  \n4. 帧缓冲核心调用 `myfb_set_par()`，它将新的显示参数程序到 LCD 控制器寄存器中。\n\n5. `fbset` 现在输出新参数：\n\n\
  ```bash\nfbset mode \"64x64-1423\"\n# D: 5.830 MHz, H: 91.097 kHz, V: 1423.386 Hz\n\
  geometry 64 64 320 240 16\ntimings 171521 0 0 0 0 0\nrgba 5/11,6/5,5/0,0/0\nendmode\n\
  ```\n\n### 颜色模式\n\n视频硬件支持的常用颜色模式包括*伪色*（pseudo color）和*真色彩*（true color）。在前者，索引值映射到\
  \ RGB 像素编码。通过选择可用颜色的子集并使用对应的索引而不是像素值本身，你可以减少对帧缓冲区内存的需求。然而，你的硬件需要支持这种可修改颜色集（或*调色板*）方案。\n\
  \n在真色彩模式下（我们的示例 LCD 控制器支持的），可修改的调色板并不相关。但是，你仍然必须满足帧缓冲控制台驱动的需求，它只使用 16 种颜色。为此，你必须通过将相应的\
  \ 16 个原始 RGB 值编码为可以直接供给硬件的位，来创建一个伪调色板。此伪调色板存储在 `fb_info` 结构的 `pseudo_palette` 字段中。\n\
  \n帧缓冲驱动\n371\n\n在列表 12.2 中，`myfb_setcolreg()` 如下填充它：\n\n```c\n((u32*)(info->pseudo_palette))[color_index]\
