  **图 12.5** Linux-Video 子系统。\n\n361\n\n### 显示参数\n\n有时，配置与显示面板关联的属性可能是你为了在设备上启用视频而需要做的唯一驱动程序更改，因此，让我们通过查看常见的显示参数开始学习视频驱动程序。我们假设相关驱动程序符合帧接口，并使用\
  \ `fbset` 工具获取显示特性：\n\n```bash\nfbset mode \"1024x768-60\"\n# D: 65.003 MHz, H:\
  \ 48.365 kHz, V: 60.006 Hz\ngeometry 1024 768 1024 768 8\ntimings 15384 168 16 30\
  \ 2 136 6\nhsync high\nvsync high\nrgba 8/0,8/0,8/0,0/0\nendmode\n```\n\n输出中的 `D`\
  \ 值代表 `dotclock`（点时钟），即视频硬件在显示器上绘制像素的速度。前述输出中的 `65.003MHz` 值意味着视频控制器花费 (1/65.003*1000000)\
  \ 或约 15,384 皮秒来绘制单个像素。这个持续时间被称为 `pixclock`（像素时钟），显示为以 `timings` 开头的行中的第一个数字参数。“geometry”旁边的数字表示可见和虚拟分辨率为\
  \ 1024×768 (SVGA)，且存储与像素相关信息所需的位数为 8。\n\n`H` 值指定水平扫描率，即视频硬件每秒内扫描的水平显示行数。这是 `pixclock`\
  \ 乘以 `X-resolution` 的倒数。`V` 值是整个显示器的刷新率。这是 `pixclock` 乘以可见 X 分辨率乘以可见 Y 分辨率的倒数，在本例中约为\
  \ 60Hz。换句话说，LCD 每秒刷新 60 次。\n\n视频控制器在每行结束时发出水平同步 (`HSYNC`) 脉冲，并在每个显示帧后发出垂直同步 (`VSYNC`)\
  \ 脉冲。`HSYNC`（以像素为单位）和 `VSYNC`（以像素行为单位）的持续时间显示为以“timings”开头的行的最后两个参数。显示器越大，`HSYNC`\
  \ 和 `VSYNC` 的可能值越大。`timings` 行中 `HSYNC` 持续之前的四个数字分别表示右边距（或水平前肩）、左边距（或水平后肩）、下边距（或垂直前肩）和上边缘（或后肩）的长度。\n\
  \n362 第 12 章 视频驱动程序\n\n显示参数\n\n有时，配置与显示面板关联的属性可能是你为了在设备上启用视频而需要做的唯一驱动程序更改，因此，让我们通过查看常见的显示参数开始学习视频驱动程序。我们假设相关驱动程序符合帧接口，并使用\
