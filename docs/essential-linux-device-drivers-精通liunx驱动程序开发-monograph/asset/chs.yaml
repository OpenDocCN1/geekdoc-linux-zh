  \ (387)\n- 查看源码 (388)\n\n视频硬件为计算机系统生成视觉输出。在本章中，让我们了解内核如何支持视频控制器，并发现帧缓冲区抽象带来的优势。我们还将学习编写控制台驱动程序，以显示内核发布的消息。\n\
  \n## 显示架构](#index_split_000.html_14)\n图 12.1 显示了 PC 兼容系统上的显示组件。作为北桥一部分的显卡控制器（参阅侧边栏“北桥”）使用多种多种接口标准连接到不同类型的显示设备（参阅侧边栏“视频接口标准”）。\n\
  \n*视频图形阵列* (VGA) 是 IBM 引入的原始显示标准，但今天它更多的是一种分辨率规范。VGA 指 640×480 的分辨率，而较新的标准如 *超级视频图形阵列*\
  \ (SVGA) 和 *扩展图形阵列* (XGA) 分别支持 800×600 和 1024×768 的更高分辨率。分辨率为 320×240 的 *季度 VGA*\
  \ (QVGA) 面板在手持设备和手机等嵌入设备中很常见。x86 世界中兼容 VGA 及其衍生标准的控制器提供了基于字符的文本模式和基于像素的图形模式。然而，非\
  \ x86 嵌入空间并非 VGA，且没有专用文本模式的概念。\n\n**处理器**\n**北桥**\n图形显示控制器单元\n模拟/LVDS/DVI/HDMI\n\
  **南桥**\n\n图 12.1 PC 系统上的显示连接。\n356\n显示架构\n357\n\n### 北桥\n在早的章节中，你学习了外设总线，如 LPC、I2C、PCMCIA、PCI\
  \ 和 USB，它们在以 PC 为中心的系统中都源自南桥。然而，显示架构带我们进入了北桥内部。在基于 Intel 的 PC 架构中，北桥可以是 *图形和内存控制器中心*\
  \ (GMCH) 或 *内存控制器中心* (MCH)。前者包含一个内存控制器、一个 *侧边总线* (FSB) 控制器和一个图形控制器。后者缺少集成图形控制器，但提供\
  \ *加速图形端口* (AGP) 通道以连接外部图形硬件。\n\n例如，考虑 Intel 855 GMCH 北桥芯片组。855 GMCH 中的 FSB 控制器与\
  \ Pentium M 处理器接口。内存控制器支持 *双数据速率* (DDR) SDRAM 颗粒。集成图形控制器允许你使用模拟 VGA、LVDS 或 DVI 连接到显示设备（参阅侧边栏“视频接口标准”）。855\
  \ GMCH 你同时向两个显示器发送输出，因此你可以同时向笔记本电脑的 LCD 屏幕和外部 CRT 显示器发送相同或独立的信息。最近的北桥芯片组（如 AMD 690G）除了\
  \ VGA 和 DVI 之外还包含对 HDMI 的支持（见下侧边栏）。\n\n### 视频接口标准\n几种接口标准规定了视频控制器与显示设备之间的连接。显示设备及其使用的接口技术遵循：\n\
  - 模拟显示器，例如带有标准 VGA 连接器的 *阴射线管* (CRT) 显示器。\n- 数字平板显示器，例如笔记本电脑 *薄膜晶体管* (TFT) LCD，它接收\
  \ *低压差分信号* (LVDS)。\n- 符合 *数字视觉接口* (DVI) 规范的显示器。DVI 是由 *数字显示工作组* (DDWG) 开发的用于传输高质量视频的标准。DVI\
  \ 显示器接收 *传输极最小化差分信号* (TMDS)。DVI 有三类子类：*仅数字* (DVI-D)、*仅模拟* (DVI-A) 和 *数字和模拟通用* (DVI-I)。\n\
  - 符合 *高清电视* (HDTV) 的显示器。HDMI 是一种现代数字音视频电缆，支持高数据率。与 DVI 等仅视频的标准不同，HDMI 可以同时传输图像和声音。\n\
  \n### 视频驱动程序\n358\n第 12 章 视频驱动程序\n嵌入式 SoC 通常具有内置 LCD 控制器，如 12.2 所示。从 LCD 控制器输出的是\
  \ TTL（*晶体管-晶体管逻辑*）信号，封装了 18 位视频数据，每个对应三种主色：红、绿、蓝。一些手持设备和手机使用 QVGA 型内部 LCD 面板，直接接收\
