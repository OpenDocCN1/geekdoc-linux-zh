  \n\n\n# 实现工作队列，这是在内核内部延迟工作的一种方式\n\n## `notifier_block`\n`/include/linux/notifier.h`\n\
  实现通知链，用于向请求状态更改的代码区域发送状态变化。\n\n## `completion`\n`/include/linux/completion.h`\n\
  用于将活动作为独立线程启动，然后等待它们完成。\n\n# 86 第 3 章 内核设施\n\n## 表 3.4 内核编程接口总结\n\n| 内核接口 | 路径 |\
  \ 描述 |\n| :--- | :--- | :--- |\n| `DECLARE_WAITQUEUE()` | `/include/linux/wait.h`\
  \ | 声明一个等待队列。 |\n| `add_wait_queue()` | `/kernel/wait.c` | 将任务加入等待队列。任务将进入睡眠，直到被另一个线程或中断处理程序唤醒。\
  \ |\n| `remove_wait_queue()` | `/kernel/wait.c` | 从等待队列中移除任务。 |\n| `wake_up_interruptible()`\
  \ | `/include/linux/wait.h` | 唤醒在等待队列 `/kernel/sched.c` 中睡眠的任务并将其放回调度器运行队列。 |\n\
  | `schedule()` | `/kernel/sched.c` | 释放处理器并允许内核的其他部分运行。 |\n| `set_current_state()`\
  \ | `/include/linux/sched.h` | 设置进程的运行状态。状态可以是 `TASK_RUNNING`、`TASK_INTERRUPTIBLE`、`TASK_UNINTERRUPTIBLE`、`TASK_STOPPED`、`TASK_TRACED`、`EXIT_ZOMBIE`\
  \ 或 `EXIT_DEAD` 之一。 |\n| `kernel_thread()` | `/arch/your-arch/kernel/process.c`\
  \ | 创建内核线程。 |\n| `daemonize()` | `/kernel/exit.c` | 在不附加用户资源的情况下激活内核线程，并将调用线程的父进程改为\
