  \ */\n/* ... */\n}\n```\n\n### 以太网 PHY\n\n以太网控制器实现了 MAC 层，并且必须与物理层（PHY）收发器配合使用。前者对应开放系统互连（OSI）模型的数据链路层，而后者实现了物理层。某些\
  \ SoC 内置了 MAC，可连接到外部 PHY。介质独立接口（MII）是一种连接快速以太网 MAC 与 PHY 的标准接口。以太网设备驱动程序通过 MII 与\
  \ PHY 通信，以配置 PHY ID、线路速率、双工模式和自动协商等参数。查看 `include/linux/mii.h` 可获取 MII 寄存器定义。\n\n\
  现在让我们来看一个 ISA NIC。CS8900 是来自 Crystal Semiconductor（现为 Cirrus Logic）的一款 10Mbps 以太网控制器芯片。该芯片常用于为嵌入式设备启用以太网功能，特别是用于调试。图\
  \ 15.2 显示了 CS8900 周围的连接图。根据板上的处理器以及用于驱动芯片的片选信号，CS8900 寄存器映射到 CPU I/O 地址空间中的不同区域。该控制器的设备驱动程序是\
  \ ISA 类型驱动程序（参见第 20 章“更多设备和驱动程序”中的“ISA 和 MCA”部分），通过探测候选地址区域来检测控制器是否存在。ISA 探测方法通过查找如芯片\
  \ ID 等签名来获取控制器的 I/O 基地址。\n\n查看 `drivers/net/cs89x0.c` 获取 CS8900 驱动程序的源码。`cs89x0_probe1()`\
  \ 探测 I/O 地址范围以感知 CS8900。它随后读取芯片的当前配置。在这一步中，它访问 CS8900 的配套 EEPROM 并获取控制器的 MAC 地址。与列表\
  \ 15.1 中的驱动一样，`cs89x0.c` 同样使用 `netif_*()` 和 `skb_*()` 接口例进行构建。某些使用 CS8900 的平台允许\
  \ DMA。与 PCI 卡不同，ISA 设备不具备 DMA 主能力，因此它们需要 DMA。\n\n\n\n\n\n在为快速网卡设计驱动程序时，考虑一个具有 1MB\
  \ 板载内存的 1Gbps 以太网适配器。在行速率下，网卡内存可以存储多达 8 毫秒的接收数据。这直接决定了允许的最大指令路径长度。在这个长度范围内，传入的数据包必须经过重组、通过\
  \ `DMA` 传输到内存、由驱动程序处理、防止并发访问，并交付给高层协议。\n\n- 在`程序化 I/O` (`PIO`) 期间，数据从设备一直传输到 CPU，然后写入内存。此外，每当设备需要传输数据时，CPU\
  \ 就会被中断，这会导致延迟和上下文切换延迟。`DMAs` 不会受到这些瓶颈的影响，但如果传输的数据少于阈值，其成本可能比 `PIOs` 更高。这是因为小 `DMAs`\
  \ 在构建描述符和为了数据一致性而刷新相应的处理器缓存行方面具有较高的相对开销。一个性能敏感的设备驱动可能会在实验确定阈值后，对小数据包使用 `PIO`，对大数据包使用\
  \ `DMA`。\n\n- 对于具有 `DMA` 主能力的 PCI 网卡，你必须确定最佳的 `DMA` 突发大小，即网卡连续控制总线的时间。如果网卡突发持续过长，可能会占用总线，导致处理器无法跟上之前\
  \ `DMA` 的数据。`PCI` 驱动通过 `PCI` 配置空间中的寄存器程序设置突发大小。通常，网卡的突发大小被程序设置为与处理器的缓存行大小相同，即处理器每次发生缓存缺失时从系统内存读取的字节数。但在实践中，你可能需要连接总线分析仪来确定有利的突发持续时间，因为系统中是否存在拆分总线（如\
  \ `ISA` 和 `PCI` 等多种类型）等因素会影响最佳值。\n\n- 许多高速网卡提供了从协议栈中卸载 CPU 密集型 TCP 校验和计算的能力。某些网卡支持我们在第\
  \ 10 章中访问过的 `DMA` 散聚集传输（scatter-gather）。驱动程序需要利用这些能力来实现底层网络所产生的最大实际带宽。\n\n- 有时，如果驱动程序对高层协议的实现细节不敏感，驱动优化可能会产生意外的速度障碍。考虑在配备了高速网卡的计算机上挂载\
  \ `NFS` 文件系统。假设网卡驱动程序仅偶尔发送完成中断以最小化延迟，但 `NFS` 服务器实现使用释放其发送缓冲区作为一种流量控制机制。由于驱动程序仅在稀疏产生的发送完成中断期间才释放\
  \ `NFS` 发送缓冲区，导致通过 `NFS` 的文件拷贝变得缓慢，而 Internet 下载却能飞速运行并产生最大吞吐量。\n\n## 协议性能\n\n现在让我们深入研究一些可以提高或损害网络吞吐量的特定特性：\n\
  \n- `TCP` 窗口大小会影响吞吐量。窗口大小衡量在接收确认之前可以传输的数据量。对于快速网卡，小的窗口大小可能导致 `TCP` 处于空闲状态，等待已发送数据包的确认。即使窗口很大，少量丢失的\
  \ `TCP` 数据包也会影响性能，因为丢失的帧在行速率下会耗尽窗口。在 `UDP` 的情况下，窗口大小是不相关的，因为它不支持确认。然而，由于缺乏流量控制机制，少量的丢包可能会导致速率的急剧下降。\n\
  \n- 随着写入 `TCP` 套接字的应用程序数据块大小增加，从用户空间拷贝到内核空间的缓冲区数量就会减少。这降低了对处理器利用率的需求，有利于性能。然而，如果块大小超过了对应网络协议的\
  \ `MTU`，处理器周期就会浪费在分片上。因此，理想的块大小是输出接口的 `MTU`，或者在 `Path MTU` 发现机制运行时通过 `IP` 路径无需分片即可发送的最大包。例如，在\
  \ `ATM` 上运行 `IP` 时，由于 `ATM` 适配层具有 64K 的 `MTU`，块大小几乎没有上限（`RFC 1626` 将此设置为 9180）。但如果你在\
  \ `ATM LANE` 上运行 `IP`，块大小应该镜像所仿真相应 LAN 技术的 `MTU` 大小。因此，标准 `Ethernet` 应为 1500，巨型千太比特\
  \ `Ethernet` 为 8000，16Mbps 的 `Token Ring` 为 18K。\n\n## 查看源码\n\n`drivers/net/` 目录包含各种网卡驱动程序的源码。查看\
  \ `drivers/net/e1000/` 可以找到一个网卡驱动示例。你将在 `net/` 目录中找到网络协议实现。`sk_buff` 访问程序位于 `net/core/skbuff.c`\
  \ 中。辅助你的驱动程序的 `net_device` 接口实现的库函数留在 `net/core/dev.c` 和 `include/linux/netdevice.h`\
  \ 中。\n\n### TUN/TAP 驱动\n\n用于协议隧道的 `TUN/TAP` 设备驱动 `drivers/net/tun.c` 是虚拟网络驱动和伪字符驱动结合的示例。伪字符设备（`/dev/net/tun`）作为虚拟网络接口的底层硬件。`TUN`\
  \ 驱动不是将帧传输到物理网络，而是从应用程序接收。同样，`TUN` 驱动不是从物理网络接收数据，而是将其发送给应用程序。查看 `Documentation/networking/tuntap.txt`\
  \ 可获得更多说明和使用场景。由于驱动程序的网络和字符部分都不需要处理硬件交互，它是一个非常易读、简单的驱动示例。查看 `/sys/class/net/` 下的节点可以操作网卡参数。使用\
  \ `/proc/sys/net/` 配置特定协议变量。例如，将所需值映射到 `/proc/net/arp` 查看 ARP 表。查看 `/proc/net/dev`\
  \ 获取所有网卡的统计信息。\n\n### 表：数据结构总结\n\n| 数据结构 | 位置 | 描述 |\n| :--- | :--- | :--- |\n|\
