  \n## 内核模式与用户模式\n\n某些操作系统（如 MS-DOS）始终在单 CPU 模式运行，但 UNIX 类操作系统使用双模式来有效实现分时。\n\n在 Linux\
  \ 机器上，CPU 处于受信任的*内核模式*或受限的*用户模式*。所有用户进程都在用户模式下执行，而内核本身在内核模式下执行。\n\n内核模式代码不受限制地访问整个指令集以及完整的内存和\
  \ IO 空间。如果用户模式进程需要这些权限，它必须通过系统调用通过驱动程序或其他内核模式代码请求。然而，用户模式代码允许缺页，而内核模式代码不允许。在 2.4\
  \ 及早期的内核中，只有用户模式进程可以被切换出并替换。内核模式代码可以占用处理器，直到它主动释放 CPU 或发生中断或异常。随着 2.6 版本引入内核抢占，大多数内核模式代码也可以进行上下文切换。\n\
  \n## 进程上下文与中断上下文\n\n内核通过进程上下文和*中断上下文*的结合完成有用工作。为用户应用程序发出的系统服务的内核代码代表相应的应用程序进程运行，并认为在进程上下执行。相反，中断处理程序在中断中异步执行。\n\
  \n\n\n\n\n`context`（上下文）。处理的上下文与任何中断上下文都没有绑定，反之亦然。\n\n# 内核定时器\n\n在进程上下运行的内核代码是可抢占的。然而，中断上下文始终运行到完成且是不可抢占的。正因如此，在中断文中可以执行的操作受到限制。从中断文中执行的代码不能进行以下操作：\n\
  \n- 进入睡眠或让出处理器\n- 获取互斥锁（mutex）\n- 执行耗时任务\n- 访问用户空间虚拟内存\n\n请参阅第 4 章中的“中断处理”章节以获取中断上下文的完整讨论。\n\
  \n## 内核定时器（续）\n\n内核许多部分的工作关键地取决于时间的流逝。Linux 内核利用硬件支持的不同定时器来提供依赖时间的服务，例如忙等（busy-waiting）和睡眠等待（sleep-waiting）。处理器在忙等时会浪费周期，但在睡眠等待时会释放\
  \ CPU。自然地，前者仅在后者不可行时才会使用。内核还促进了希望在指定的持续时间过去后运行的函数的调度。\n\n让我们先讨论一些重要的内核定时器变量的语义，例如\
  \ `jiffies`、`HZ` 和 `xtime`。接下来，让我们在基于奔腾（Pentium）的系统上使用奔腾时间戳计数器（`TSC`）测量执行时间。我们再看看\
  \ Linux 如何使用实时时钟（`RTC`）。\n\n## HZ 和 Jiffies\n\n系统定时器以可编程的频率中断处理器（或称为“弹出”）。这个频率，或者说每秒定时器滴答（ticks）的数量，包含在内核变量\
  \ `HZ` 中。选择 `HZ` 的值是一种权衡。较大的 `HZ` 会导致更细粒度的定时器粒度，从而获得更好的调度分辨率。然而，更大的 `HZ` 值也会导致更大的开销和更高的功耗，因为在定时器中断上下文中消耗了更多的周期。\n\
  \n`HZ` 的值取决于架构。在 x86 系统上，在 2.4 内核中，`HZ` 默认被设置为 100。在 2.6 版本中，该值变为 1000，但在 2.6.13\
  \ 版本中，它被降低到了 250。在基于 ARM 的平台上，2.6 内核将 `HZ` 设置为 100。在当前的内核中，你可以在编译时通过配置菜单选择 `HZ`\
  \ 的值。该选项的默认设置取决于你的发行版。\n\n2.6.21 内核引入了无滴答内核（`CONFIG_NO_HZ`）的支持，它根据系统负载动态触发定时器中断。无滴答系统的实现不在本章的范围内。\n\
  \n`jiffies` 存储了自系统启动以来系统定时器弹出的次数。内核每秒增加 `HZ` 次 `jiffies` 变量。因此，在 `HZ` 值为 100 的内核上，一个\
  \ jiffy 的持续时间是 10 毫秒；而在一个 `HZ` 设置为 1000 的内核上，一个 jiffy 只有 1 毫秒。\n\n为了更好地理解 `HZ` 和\
  \ `jiffies`，考虑以下来自 IDE 驱动（`drivers/ide/ide.c`）的代码片段，它轮询磁盘驱动器的忙状态：\n\n```c\nunsigned\
  \ long timeout = jiffies + (3*HZ);\n\nwhile (hwgroup->busy) {\n    /* ... */\n \
  \   if (time_after(jiffies, timeout)) {\n        return -EBUSY;\n    }\n    /* ...\
  \ */\n}\n\nreturn SUCCESS;\n```\n\n如果忙状态在 3 秒内清除，上述代码返回 `SUCCESS`，否则返回 `-EBUSY`。`3*HZ`\
  \ 是 3 秒内存在的 `jiffies` 数量。因此，计算出的超时时间 `(jiffies + 3*HZ)` 是 3 秒超时后 `jiffies` 的新值。`time_after()`\
  \ 宏比较 `jiffies` 的当前值与请求的超时时间，并考虑了由于溢出导致的绕回。用于进行类似比较的相关函数有 `time_before()`、`time_before_eq()`\
  \ 和 `time_after_eq()`。\n\n`jiffies` 被定义为 `volatile`，这要求编译器不要优化对变量的访问。这确保了在每次滴答期间由定时器中断程序更新的\
  \ `jiffies` 在每次循环循环中被重新读取。\n\n对于从 `jiffies` 到秒的反向转换，请看来自 USB 主机控制器驱动（`drivers/usb/host/ehci-sched.c`）的这段片段：\n\
  \n```c\nif (stream->rescheduled) {\n    ehci_info(ehci, \"ep%ds-iso rescheduled\
  \ \" \"%lu times in %lu seconds\\n\", \n              stream->bEndpointAddress,\
  \ is_in? \"in\":\"out\", \n              stream->rescheduled,\n              ((jiffies\
  \ – stream->start)/HZ));\n}\n```\n\n上述调试语句计算了该 USB 端点流（我们在第 11 章“通用串行总线”中讨论 USB）被重新调度\
  \ `stream->rescheduled` 次所需的秒数。`(jiffies-stream->start)` 是自重新调度开始以来经过的 `jiffies`\
  \ 数量。除以 `HZ` 将该值转换为秒。\n\n假设 `HZ` 值为 1000，32 位的 `jiffies` 变量大约在 50 天后溢出。由于系统运行时间可能是该持续时间的许多倍，内核提供了一个名为\
  \ `jiffies_64` 的变量来存储 64 位（`u64`）的值。无滴答系统的实现不在本章的范围内。\n\n`jiffies` 被定义为 `volatile`，这要求编译器不要优化对变量的访问。这确保了在每次滴答期间由定时器中断程序更新的\
  \ `jiffies` 在每次循环循环中被重新读取。\n\n对于从 `jiffies` 到秒的反向转换，请看来自 USB 主控制器驱动（`drivers/usb/host/ehci-sched.c`）的这段片段：\n\
  \n```c\nif (stream->rescheduled) {\n    ehci_info(ehci, \"ep%ds-iso rescheduled\
  \ \" \"%lu times in %lu seconds\\n\", \n              stream->bEndpointAddress,\
  \ is_in? \"in\":\"out\", \n              stream->rescheduled,\n              ((jiffies\
  \ – stream->start)/HZ));\n}\n```\n\n上述调试语句计算了该 USB 端点流（我们在第 11 章“通用串行总线”中讨论 USB）被重新调度\
  \ `stream->rescheduled` 次所需的秒数。`(jiffies-stream->start)` 是自重新调度开始以来经过的 `jiffies`\
  \ 数量。除以 `HZ` 将该值转换为秒。\n\n32 位的 `jiffies` 变量大约在 50 天后溢出，假设 `HZ` 值为 1000。由于系统运行时间可能是该持续时间的许多倍，内核提供了一个名为\
  \ `jiffies_64` 的变量来存储 64 位（`u64`）的值。\n\n\n\n\n这三个调度器属性随着 2.6.23 内核中 CFS 调度器的出现而变化。Linux\
  \ 进程调度器将在第 19 章“用户空间驱动程序”中讨论。\n\n# 内核定时器\n\n35\n\n带有你的处理函数的地址和参数，并使用 `add_timer()`\
  \ 将其注册：\n\n```c\n#include <linux/timer.h>\n\nstruct timer_list my_timer;\ninit_timer(&my_timer);\
  \ /* 同样参见 setup_timer() */\nmy_timer.expire = jiffies + n*HZ; /* n 是秒为单位的超时时间 */\n\
  my_timer.function = timer_func; /* n 秒后执行的函数 */\nmy_timer.data = func_parameter;\
  \ /* 传递给 timer_func 的参数 */\nadd_timer(&my_timer); /* 启动定时器 */\n```\n\n这是一个单次定时器（one-shot\
  \ timer）。如果你想定期运行 `timer_func()`，你还需要将上述代码添加到 `timer_func()` 内部，以便在下次超时后调度它自己：\n\
  \n```c\nstatic void timer_func(unsigned long func_parameter)\n{\n    /* 定期执行的工作\
  \ */\n    /* ... */\n    init_timer(&my_timer);\n    my_timer.expire = jiffies +\
  \ n*HZ;\n    my_timer.data = func_parameter;\n    my_timer.function = timer_func;\n\
  \    add_timer(&my_timer);\n}\n```\n\n你可以使用 `mod_timer()` 更改 `my_timer` 的过期时间，使用\
  \ `del_timer()` 取消 `my_timer`并使用 `timer_pending()` 查看 `my_timer` 目前是否处于等待状态。如果你查看\
  \ `kernel/timer.c`，你会发现 `schedule_timeout()` 内部使用了这些相同的 API。\n\n用户空间函数如 `clock_settime()`\
  \ 和 `clock_gettime()` 用于从用户空间访问内核定时器服务。用户应用程序可以使用 `setitimer()` 和 `getitimer()`\
  \ 来控制在指定的超时到达时传递闹闹信号。\n\n36 第 2 章 深入内核内部\n\n## 短延迟\n\n在内核术语中，小于 jiffy（sub-jiffy）的延迟被视为短时间。这种延迟通常在进程上下文和中断上下文中请求。由于无法使用基于\
  \ jiffy 方法来实现小于 jiffy 的延迟，因此在前节中讨论的睡眠等待（sleep-wait）方法无法用于小超时。唯一的解决方案是忙等（busy-wait）。\n\
  \n实现短延迟的内核 API 有 `mdelay()`、`udelay()` 和 `ndelay()`，它们分别支持毫秒、微秒和纳秒延迟。这些函数的实际实现取决于特定架构，并且可能在所有平台上都不可用。\n\
  \n短时间的忙等通过测量处理器执行指令所需的时间并循环必要的迭代次数来实现。正如本章早些时候讨论的，内核在启动期间执行此测量，并将值存储在名为 `loops_per_jiffy`\
  \ 的变量中。短延迟 API 使用 `loops_per_jiffy` 来决定它们需要忙循环的次数。为了在握手过程中实现 1 微秒的延迟，USB 主机控制器驱动\
  \ `drivers/usb/host/ehci-hcd.c` 调用了 `udelay()`，它在内部使用了 `loops_per_jiffy`：\n\n```c\n\
  result = ehci_readl(ehci, ptr);\n/* ... */\nif (result == done) return 0;\nudelay(1);\
  \ /* 内部使用 loops_per_jiffy */\nusec--;\n} while (usec > 0);\n```\n\n## 奔腾时间戳计数器\n\
  \n*时间戳计数器*（Time Stamp Counter，TSC）是兼容奔腾处理器中的一个 64 位寄存器，计算处理器自启动以来消耗的时钟周期数。由于 TSC\
  \ 以处理器周期速度递增，它提供了一个高分辨率定时器。TSC 通常用于性能分析和\n\n内核定时器\n\n37\n\n代码的插测量。它使用 `rdtsc` 指令进行访问，以微秒级测量中间代码的执行时间。TSC\
  \ 滴答可以通过除以 CPU 时钟频率转换为秒，该频率可以从内核变量 `cpu_khz` 中读取。\n\n在下面的片段中，`low_tsc_ticks` 包含\
  \ TSC 的低 32 位，而 `high_tsc_ticks` 包含高 32 位。低 32 位根据你的处理器速度在几秒钟内溢出，但对于此处所示的许多代码插测量目的已经足够：\n\
  \n```c\nunsigned long low_tsc_ticks0, high_tsc_ticks0;\nunsigned long low_tsc_ticks1,\
  \ high_tsc_ticks1;\nunsigned long exec_time;\nrdtsc(low_tsc_ticks0, high_tsc_ticks0);\
  \ /* 之前的时间戳 */\nprintk(\"Hello World\\n\"); /* 要分析的代码 */\nrdtsc(low_tsc_ticks1,\
  \ high_tsc_ticks1); /* 之后的时间戳 */\nexec_time = low_tsc_ticks1 - low_tsc_ticks0;\n\
  ```\n\n在一台 1.8GHz 的奔腾机器上，`exec_time` 测量值为 871（或半微秒）。\n\n对高分辨率定时器的支持（`CONFIG_HIGH_RES_TIMERS`）已合并到\
  \ 2.6.21 内核中。它利用了特定硬件的高速定时器。\n\n## 实时时钟\n\nRTC 在非易失性内存中维护时间。在 x86 PC 上，寄存器构成了*互补金属氧化半导体*（CMOS）内存。电池可以使用多年，且通常超过计算机的寿命。在系统中，RTC\
  \ 可能是内部的，或者通过 I2C 或 SPI 总线外部连接，参见第 8 章“集成电路协议”。你可以使用 RTC 执行以下操作：\n\n- 读取和设置绝对时间，并在在更新期间产生中断。\n\
  - 生成频率从 2HZ 到 192HZ 的周期性中断。许多应用程序需要绝对时间或*墙上时间*。由于 jiffies 是相对于系统启动时间的，它不包含墙上时间。内核在名为\
  \ `xtime` 的变量中维护墙上时间。在系统停止时，墙上时间会被写回 RTC。你可以使用 `do_gettimeday()` 以最高分辨率读取墙上时间：\n\
  \n```c\n#include <linux/time.h>\nstatic struct timeval curr_time;\ndo_gettimeday(&curr_time);\n\
  my_timestamp = cpu_to_le32(curr_time.tv_sec); /* 记录时间戳 */\n```\n\n38 深入内核内部\n\n\
  从用户空间使用 RTC 的另一种方法是通过字符设备 `/dev/rtc`。一次允许一个进程访问该设备。我们在第 5 章和第 8 章中讨论更多关于 RTC 驱动的内容。在第\
  \ 19 章中，我们将开发一个示例用户应用程序，使用 `/dev/rtc` 以微秒级执行周期性工作。\n\n## 内核中的并发性\n\n让我们讨论保护共享内核资源免受并发访问的基础知识。我们从简单的示例开始，逐渐引入中断、内核抢占和\
  \ SMP 等复杂性。\n\n[自旋锁与互斥锁]\n\n\n\n访问共享资源的代码区域被称为 `critical` 临界区。自旋锁（Spinlocks）和互斥锁（mutexes，mutual\
  \ exclusion 的缩）是内核中保护临界区的两种基本机制。让我们逐一查看。\n\n自旋锁确保一次只有一个线程进入临界区。任何其他想要进入临界区的线程都必须在门口保持自旋（spinning），直到第一个线程退出。注意，我们使用术语\
  \ `thread` 来指代执行线程，而不是内核线程。\n\n自旋锁的基本用法如下：\n\n```c\n#include <linux/spinlock.h>\n\
  \nspinlock_t mylock = SPIN_LOCK_UNLOCKED; /* 初始化 */\n\n/* 获取自旋锁。如果临界区内没有人，这个\n *\
  \ 操作是非常廉价的。在竞争的情况下，\n * spin_lock() 必须进行忙等待。\n */\nspin_lock(&mylock);\n\n/* ...\
  \ 临界区代码 ... */\n\nspin_unlock(&mylock); /* 释放锁 */\n```\n\n与在尝试进入繁忙临界区时让线程进入旋转状态的自旋锁不同，互斥锁会将竞争的线程置睡眠，直到轮到它们占据临界区。因为消耗处理器周期来自旋是一件糟糕，所以当估计等待时间较长时，互斥锁比自旋锁更适合保护临界区。在互斥锁的术语中，超过两次上下文切换即被视为长时间，因为互斥锁必须将竞争的线程切换出去睡眠，并在需要唤醒它时将其切换回。\n\
  \n因此，在许多情况下，很容易决定是使用自旋锁还是互斥锁：\n\n* 如果临界区需要睡眠，你别选择使用互斥锁。在获取自旋锁后，进行调度、抢占或在等待队列上睡眠都是非法的。\n\
  * 因为互斥锁在遇到竞争时会将调用线程置睡眠，所以你在中断处理程序内部别选择使用自旋锁。（你将在第 4 章中学习更多关于中断上下文限制的知识。）\n\n互斥锁的基本用法如下：\n\
  \n```c\n#include <linux/mutex.h>\n\n/* 静态声明一个互斥锁。要动态创建\n * 互斥锁，请使用 mutex_init()\
  \ */\nstatic DEFINE_MUTEX(mymutex);\n\n/* 获取互斥锁。如果临界区内没有人，这个\n * 操作是非常廉价的。在竞争的情况下，\n\
  \ * mutex_lock() 将调用线程置睡眠。\n */\nmutex_lock(&mymutex);\n\n/* ... 临界区代码 ... */\n\n\
  mutex_unlock(&mymutex); /* 释放互斥锁 */\n```\n\n为了说明并发保护的使用，让我们从一个仅存在于进程上下文中的临界区开始，按照以下顺序逐渐引入复杂性：\n\
  \n1. 在运行非抢占内核的单处理器（UP）箱上，仅存在于进程上下文的临界区。\n2. 在运行非抢占内核的 UP 机器上，存在于进程和中断上下文的临界区。\n\
  3. 在运行可抢占内核的 UP 机器上，存在于进程和中断上下文的临界区。\n4. 在运行可抢占内核的 SMP 机器上，存在于进程和中断上下文的临界区。\n\n\
  ### 旧的信号量接口\n\n互斥锁接口取代了旧的信号量接口，源于 –rt 并在 2.6.16 内核发布时合并到主线。然而，信号量接口仍然存在。信号量接口的基本用法如下：\n\
  \n```c\n#include <asm/semaphore.h> /* 体系相关的头文件 */\n\n/* 静态声明一个信号量。要动态创建\n * 信号量，请使用\
  \ init_MUTEX() */\nstatic DECLARE_MUTEX(mysem);\n\ndown(&mysem); /* 获取信号量 */\n\n\
  /* ... 临界区代码 ... */\n\nup(&mysem); /* 释放信号量 */\n```\n\n信号量可以配置为允许指定数量的线程同时进入临界区。然而，允许同时多个持有者的信号量很少被使用。\n\
  \n### 案例 1：进程上下文，UP 机器，无抢占\n\n这是最简单的情况，不需要锁定，因此我们不再进一步讨论它。\n\n### 案例 2：进程和中断上下文，UP\
  \ 机器，无抢占\n\n在这种情况下，你只需要禁用中断来保护临界区域。为了理解为什么，假设 `A` 和 `B` 是进程上下文线程，而 `C` 是中断上下文线程，它们都在竞争进入同一个临界区，如图\
  \ 2.4 所示。\n\n（图 2.4 临界区内的进程和中断上下文线程。）\n\n由于 `Thread C` 在中断上下文中执行，并且在让给 `Thread A`\
  \ 或 `Thread B` 之前总是运行完成，因此它不需要担心保护。`Thread A` 本身不需要担心 `Thread B`（反之亦然），因为内核是不可抢占的。因此，`Thread\
  \ A` 和 `Thread B` 需要防止 `Thread C` 在它们处于同一区域时践踏临界区的可能性。它们通过在进入临界区之前禁用中断来实现这一点：点 A：\n\
  \n```c\nlocal_irq_disable(); /* 禁用本地 CPU 的的中断 */\n/* ... 临界区 ... */\nlocal_irq_enable();\
  \ /* 启用中断 */\n```\n\n然而，如果执行到达点 A 时中断已经禁用了，`local_irq_enable()` 会产生重新启用中断的这一不妙的副作用，而不是恢复中断状态。可以通过以下方式修复：\n\
  \n```c\nunsigned long flags;\nPoint A:\nlocal_irq_save(flags); /* 禁用中断 */\n/* ...\
  \ 临界区 ... */\nlocal_irq_restore(flags); /* 恢复中断 */\n```\n\n### 案例 3：进程和中断上下文，UP\
  \ 机器，抢占\n\n如果启用了抢占，仅禁用中断将无法保护你的临界区域被践踏。存在多个线程同时进入临界区的可能性。回到图 2.4，在这种情况下，`Thread\
  \ A` 和 `Thread B` 现在不仅需要相互保护，还需要防御 `Thread C`。解决方案是在临界区开始之前禁用内核抢占，并在结束时重新启用，除了禁用/启用中断之外。为此，`Thread\
  \ A` 和 `Thread B` 使用自旋锁的变体：\n\n```c\nunsigned long flags;\nPoint A:\n/* 保存中断状态。禁用中断\
  \ - 这隐式地禁用了抢占 */\nspin_lock_irqsave(&mylock, flags);\n/* ... 临界区 ... */\n/* 恢复到点\
  \ A 时的中断状态 */\nspin_unlock_irqrestore(&mylock, flags);\n```\n\n抢占状态不需要显式恢复到点 A，因为内核通过一个名为\
  \ `preemption counter` 的变量内部为你完成。在禁用抢占时（使用 `preempt_disable()`）计数器加增，在启用抢占时（使用 `preempt_enable()`）计数器减小。只有当计数器值为零时，抢占才会发生。\n\
  \n### 案例 4：进程和中断上下文，SMP 机器，抢占\n\n现在让我们假设临界区执行在 SMP 机器上。你的内核配置了 `CONFIG_SMP` 并开启了\
  \ `CONFIG_PREEMPT`。在目前为止讨论的场景中，自旋锁原型仅仅是启用/禁用抢占和中断。实际的锁定功能被编译掉了。在存在 SMP 的，锁定逻辑被编译进来，自旋锁原语变得\
  \ SMP 安全。SMP 启用的语义如下：\n\n```c\nunsigned long flags;\nPoint A:\n/*\n```\n\n\n\n\n\
  -   在本地 CPU 上保存中断状态\n-   禁用本地 CPU 上的中断。这隐式地禁用了抢占。\n-   锁定节区以调节其他 CPU 的访问\n\n```c\n\
  spin_lock_irqsave(&mylock, flags);\n\n/* ... Critical 节区 ... */\n\n/*\n- 将本地 CPU\
  \ 的中断状态和抢占恢复到 A 点之前的状态\n- 释放锁\n*/\nspin_unlock_irqrestore(&mylock, flags);\n```\n\
  \n在 SMP 系统上，当获取自旋锁时，只有本地 CPU 的中断会被禁用。因此，一个进程上下文线程（例如图 2.4 中的 `Thread A`）可能运行在一个\
  \ CPU 上，而另一个中断处理程序（例如图 2.4 中的 `Thread C`）正在另一个 CPU 上执行。因此，非本地处理器上的中断处理程序需要自旋等待，直到本地处理器上的进程上下文代码退出临界区。中断上下文代码调用\
  \ `spin_lock()`/`spin_unlock()` 来完成此操作：\n\n```c\nspin_lock(&mylock);\n\n/* ... Critical\
  \ 节区 ... */\nspin_unlock(&mylock);\n```\n\n与 irq 变类似，自旋锁还有下半部（BH）变。`spin_lock_bh()`\
  \ 在获取锁时禁用下半部，而 `spin_unlock_bh()` 在释放锁时重新启用下半部。我们在第 4 章中讨论下半部。\n\n## 内核并发\n\n##\
  \ –rt 树\n\n实时 (-rt) 树也称为 `CONFIG_PREEMPT_RT` 补丁集，实现了内核的低延迟修改。补丁集可以从 `www.kernel.org/pub/linux/kernel/projects/rt`\
  \ 下载，它允许大部分内核被抢占，部分通过将许多自旋锁替换为互斥锁。它还包含了高分辨率定时器。若干 -rt 特性已集成到主内核。你可以在托管在 `http://rt.wiki.kernel.org/`\
  \ 的项目 wiki 上找到详细文档。\n\n内核库中具有特殊的锁原语，有助于在特定条件下提高性能。使用针对你的需求定制的互斥方案会让你的代码更强大。让我们来看一些特殊的互斥机制。\n\
  \n## 原子操作\n\n原子操作用于执行轻量级的单次操作，例如增加计数器、条件递增和设置位位置。原子操作保证是序列化的，不需要锁来保护防止并发访问。原子操作的实现取决于架构。\n\
  \n为了在释放内核网络缓冲区（称为 `skbuff`）之前检查是否还有剩余的数据引用，定义在 `net/*core/skbuff.c` 中的 `skb_release_data()`\
  \ 例程执行以下操作：\n\n```c\nif (!skb->cloned ||\n    /* 原子地递减并检查返回值是否为零 */\n    !atomic_sub_return(skb->nohdr\
  \ ? (1 << SKB_DATAREF_SHIFT) + 1 :\n    1,&skb_shinfo(skb)->dataref)) {\n    /*\
  \ ... */\n    kfree(skb->head);\n}\n```\n\n当 `skb_release_data()` 执行时，另一个使用 `skbuff_clone()`（定义在同一文件中）的线程可能同时增加数据引用计数器：\n\
  \n```c\n/* ... */\n/* 原子地增加数据引用计数 */\natomic_inc(&(skb_shinfo(skb)->dataref));\n\
  /* ... */\n```\n\n使用原子操作保护数据引用计数器不被这两个线程践踏。它还消除了使用锁来保护单个整数变量免受并发访问的麻烦。\n\n内核还支持如\
  \ `set_bit()`、`clear_bit()` 和 `test_and_set_bit()` 等运算符，以原子方式进行位操作。查看 `include/asm-your-*arch/atomic.h`\
  \ 获取你架构支持的原子操作。\n\n## 读者写锁\n\n另一种特殊的并发调节机制是自旋锁的读者写变体。如果临界区的使用情况使得不同的线程要么从共享数据结构读取要么写入，但两者不兼顾，那么这些锁非常适合。允许多个读取线程同时位于临界区域内。读取自旋锁定义如下：\n\
  \n```c\nrwlock_t myrwlock = RW_LOCK_UNLOCKED;\nread_lock(&myrwlock); /* 获取读取锁 */\n\
  /* ... Critical 节区 ... */\nread_unlock(&myrwlock); /* 释放锁 */\n```\n\n然而，如果写线程进入临界区，则不允许其他读取或写线程进入。若要使用写自旋锁，你可以这样写：\n\
  \n```c\nrwlock_t myrwlock = RW_LOCK_UNLOCKED;\nwrite_lock(&myrwlock); /* 获取写锁 */\n\
  /* ... Critical 节区 ... */\nwrite_unlock(&myrwlock); /* 释放锁 */\n```\n\n查看 `net/ipx/ipx_route.c`\
  \ 中存在的 IPX 路由代码，这是一个读写自旋锁的真实示例。名为 `ipx_routes_lock` 的读写锁保护 IPX 路由表免受并发访问。需要查找路由表以转发数据包线程获取读取锁。需要从路由表中添加或删除条目的线程获取写锁。与普通自旋锁一样，读写锁也有对应的\
  \ irq 变体——`read_lock_irqsave()`、`read_unlock_irqrestore()`、`write_lock_irqsave()`\
  \ 和 `write_unlock_irqrestore()`。这些函数的语义与普通自旋锁相似。\n\n## 序列锁\n\n序列锁或 *seqlocks* 引入\
  \ 2.6 内核，是写者优先的读写锁。如果写操作会阻塞读取者，这非常有用。例如之前讨论的 `jiffies_64` 变量。由于此，读取线程可能会发现它们在临界区进入失败并可能需要重试：\n\
  \n```c\nu64 get_jiffies_64(void) /* 定义在 kernel/time.c */\n{\n    unsigned long seq;\n\
  \    u64 ret;\n    do {\n        seq = read_seqbegin(&xtime_lock);\n        ret\
  \ = jiffies_64;\n    } while (read_seqretry(&xtime_lock, seq));\n    return ret;\n\
  }\n```\n\n写者使用 `write_seqlock()` 和 `write_sequunlock()` 保护临界区域。\n\n## 调试\n\n并发问题通常很难调试，因为它们通常难以复现。开启\
  \ SMP (`CONFIG_SMP`) 和抢占是一个好主意。\n\n\n\n\n\n在编译和测试代码时开启 ( `CONFIG_PREEMPT` )，即使你的生产内核将运行在禁用了抢占的\
  \ UP 机器上。在*Kernel hacking*（内核黑客）下有一个内核配置选项称为 *Spinlock and rw-lock debugging* (`CONFIG_DEBUG_SPINLOCK`)，它可以帮助你捕捉一些常见的自旋锁错误。\n\
  \n此外，诸如 `lockmeter` (http://oss.sgi.com/projects/lockmeter/) 等工具可以收集与锁相关的统计信息。\n\
  \n当你忘记对共享资源的访问加锁时，就会发生常见的并发问题。这导致不同的线程以无节章的方式“竞争”该访问。这种问题被称为*竞态条件*（race condition），它可能表现为偶尔出现的异异代码行为。\n\
  \n另一个潜在问题出现在你在某些代码路径中漏掉了释放持有的锁，导致死锁。为了理解这一点，请考虑以下示例：\n\n```c\nspin_lock(&mylock);\
  \ /* 获取锁 */\n/* ... 临界区 ... */\nif (error) { /* 此错误条件很少发生 */\nreturn -EIO; /* 忘记释放锁了！\
  \ */\n}\nspin_unlock(&mylock); /* 释放锁 */\n```\n\n错误条件发生后，任何尝试获取 `mylock` 的线程都会死锁，内核可能会冻结。\n\
  \n如果问题在写编写代码几个月或几年后才出现，那么回过来调试它将更加困难。（在第 21 章“调试设备驱动程序”的“Kdump”部分有一个相关的调试示例。）为了避免此类不愉快的遭遇，应该在设计软件时设计好并发逻辑。\n\
  \n# 分配内存\n\n进程文件系统 (*procfs*) 是一个虚拟文件系统，它提供了查看内核内部的窗口。当你浏览 `procfs` 时看到的数据是由内核动态生成的。`procfs`\
  \ 中的文件用于配置内核参数、查看内核结构、从设备驱动程序中收集统计信息以及获取通用系统信息。\n\n`procfs` 是一个伪文件系统。这意味着存在于 `procfs`\
  \ 中的文件并未与硬盘等物理存储设备关联。相反，这些文件中的数据是由内核相应的入口点按需动态创建的。由于由于，`procfs` 中的文件大小显示为零。`procfs`\
  \ 通常在内核启动期间挂载在 `/proc` 目录下；你可以通过调用 `mount` 命令看到这一点。\n\n为了初步感受 `procfs` 的功能，请检查 `/proc/cpuinfo`、`/proc/meminfo`、`/proc/interrupts`、`/proc/tty/driver/serial`、`/proc/bus/usb/devices`\
  \ 和 `/proc/stat` 的内容。\n\n某些内核参数可以通过写入 `/proc/sys/` 下的文件在运行时更改。例如，你可以通过向 `/proc/sys/kernel/printk`\
  \ 回一组新值来更改内核 `printk` 日志级别。许多实用（如 `ps`）和系统性能监控工具（如 `sysstat`）内部从存在于 `/proc` 下的文件派生信息。\n\
  \n*Seq files* 在 2.6 内核中引入，简化了大型 procfs 操作。它们在附录 C“Seq Files”中进行了描述。\n\n# 分配内存\n\n\
  某些设备驱动程序必须意识到*内存区域*（memory zones）的存在。此外，许多驱动程序需要内存分配函数的服务。在本节中，让我们简要讨论这两者。\n\n内核将物理内存划分为*页*（pages）。页大小取决于架构。在基于\
  \ x86 的机器上，它是 4096 字节。物理内存中的每一页都有一个关联的 `struct page`（定义在 `include/linux/mm_types.h`\
  \ 中）：\n\n```c\nstruct page {\n    unsigned long flags; /* 页状态 */\n    atomic_t _count;\
  \ /* 引用计数 */\n    /* ... */\n    void * virtual; /* 稍会解释 */\n};\n```\n\n在 32 位 x86\
  \ 系统上，默认内核配置将可用的 4GB 地址空间划分为 3GB 的用户进程虚拟内存空间和 1GB 的内核空间，如图 2.5 所示。这对比内核能够处理的物理内存数量施加了\
  \ 1GB 的限制。实际上，限制是 896MB，因为 128MB 的地址空间被内核数据结构占用。你可以通过在内核配置期间更改 3GB/1GB 的划分来增加此限制，但如果你减少了用户进程的虚拟地址空间，将会引起内存密集型应用程序产生。\n\
  \n**图 2.5 32 位 PC 系统上的默认地址空间划分。**\n\n映射到低 896MB 的内核地址与物理地址之间存在一个常量偏移量，并称为*逻辑地址*（logical\
  \ addresses）。有了“高内存”支持，内核可以通过使用特殊映射为这些区域生成*虚拟地址*（virtual addresses）来访问超过 896MB 的内存。所有的逻辑地址都是内核虚拟地址，但反之不然。\n\
  \n这引导我们进入以下内核区域：\n\n1. `ZONE_DMA` (<16MB)，用于*直接内存访问*（DMA）的区域。传统的 ISA 设备有 24 条地址线，只能访问前\
  \ 16MB。\n2. `ZONE_NORMAL` (16MB 到 896MB)，通常的可寻址区域，也称为低内存。低内存 `struct page` 中的 `virtual`\
  \ 字段包含相应的逻辑地址。\n3. `ZONE_HIGH` (>896MB)，内核只有在映射了 ZONE_NORMAL 中的驻留页后才能访问的空间。\n\n\
  # 分配内存\n\n相应的内核地址是虚拟的而非逻辑的。高内存 `struct page` 中的 `virtual` 字段如果页未被映射，则指向 NULL。\n\n\
  `kmalloc()` 是一个从 `ZONE_NORMAL` 返回连续内存的内存分配函数。其原型如下：\n\n```c\nvoid *kmalloc(int count,\
  \ int flags);\n```\n\n其中 `count` 是要分配的字节数，`flags` 是指定的模式。所有支持的标志列在 `include/linux/gfp.h`\
  \ 中（gfp 代表获取空页），但常用的：\n\n1. `GFP_KERNEL`：用于进程上下文分配内存。如果指定此标志，`kmalloc()` 允许睡眠等待页面释放。\n\
  2. `GFP_ATOMIC`：用于中断上下文获取内存。在此模式下，`kmalloc()` 不允许睡眠，因此 `GFP_ATOMIC` 的分配概率低于 `GFP_KERNEL`。\n\
  \n由于 `kmalloc()` 返回的内存保留了之前的内容，如果暴露给用户空间，可能会存在安全风险。要获取零值的 kmalloc 内存，请使用 `kzalloc()`。\n\
  \n如果你需要分配大型缓冲区，且不需要内存物理连续，请使用 `vmalloc()` 而不是 `kmalloc()`：\n\n```c\nvoid *vmalloc(unsigned\
  \ long count);\n```\n\n在这里 `count` 是请求分配的大小。该函数返回内核虚拟地址。`vmalloc()` 享有 `kmalloc()`\
  \ 更大的分配限制，但速度较慢，且不能从中断上下文调用。此外，你无法使用 `vmalloc()` 返回的物理不连续内存来执行*直接内存访问*（DMA）。高性能网络驱动程序通常在设备打开时使用\
  \ `vmalloc()` 分配描述符环。\n\n内核提供了更复杂的内存分配技术。这些包括*旁路缓冲区*（look aside buffers）、*slabs*\
  \ 和*内存池*（mempools），这些超出了本章的范围。\n\n## 查看源码\n\n内核启动于执行位于 *arch/* 下的实模式汇编代码。\n\n\n\n\
  \n`x86/boot/` 目录。查看 `arch/x86/kernel/setup_32.c` 可以了解保护模式内核如何获取实模式内核收集的信息。\n\n第一条启动消息由位于\
  \ `init/main.c` 中的代码打印。深入 `init/` 目录：\n\n查看 `calibrate.c` 以了解更多关于 BogoMIPS 准的知识，查看\
  \ `include/asm-your-arch/bugs.h` 以了解架构相关的检查。\n\n内核中的定时器服务由依赖架构的部分组成，这些部分位于 `arch/your-arch/kernel/`\
  \ 中，以及在 `kernel/timer.c` 中实现的通用部分。有关的定义，请参阅头文件 `include/linux/time.h`。\n\n`jiffies`\
  \ 定义在 `linux/jiffies.h` 中。`HZ` 的值取决于处理器，并可以在 `include/asm-your-arch/param.h` 中找到。\n\
  \n内存管理源码位于顶层 `mm/` 目录。\n\n表 2.1 总结了本章使用的主要数据结构以及它们在源码树中的定义位置。表 2.2 列出了本章中使用的主要内核编程接口及其定义位置。\n\
  \n### 表 2.1 数据结构总结\n\n| 数据结构 | 位置 | 描述 |\n| :--- | :--- | :--- |\n| `HZ` | `include/asm-your-arch/param.h`\
  \ | 系统定时器每秒滴答的次数 |\n| `loops_per_jiffy` | `init/main.c` | 处理器在 1 个 jiffy 内执行一次内部分延迟循环的次数\
  \ |\n| `timer_list` | `include/linux/timer.h` | 用于存放你想在未来某个时刻执行的例程的地址 |\n| `timeval`\
  \ | `include/linux/time.h` | 时间戳 |\n| `spinlock_t` | `include/linux/spinlock_types.h`\
  \ | 一种自旋锁机制，确保只有一个线程进入临界区 |\n| `semaphore` | `include/asm-your-arch/semaphore.h`\
  \ | 一种睡眠锁机制，允许规定数量的用户进入临界区 |\n| `mutex` | `include/linux/mutex.h` | 替换信号量的新接口 |\n\
  | `rwlock_t` | `include/linux/spinlock_types.h` | 读写自旋锁 |\n| `page` | `include/linux/mm_types.h`\
  \ | 内核对物理内存页的表示 |\n\n### 表 2.2 内核编程接口总结\n\n| 内核接口 | 位置 | 描述 |\n| :--- | :--- | :---\
  \ |\n| `time_after()` | `include/linux/jiffies.h` | 将 `time_after_eq()` 的当前值与 `jiffies`\
  \ 的指定未来值进行比较 |\n| `time_before()` | | |\n| `time_before_eq()` | | |\n| `schedule_timeout()`\
  \ | `kernel/timer.c` | 在指定的超时过期后调度进程进行运行 |\n| `wait_event_timeout()` | `include/linux/wait.h`\
  \ | 如果指定的条件变为真或发生超时，则恢复执行 |\n| `DEFINE_TIMER()` | `include/linux/timer.h` | 静态定义一个定时器\
  \ |\n| `init_timer()` | `kernel/timer.c` | 动态定义一个定时器 |\n| `add_timer()` | `include/linux/timer.h`\
  \ | 在超时后调度定时器执行 |\n| `mod_timer()` | `kernel/timer.c` | 修改定时器过期时间 |\n| `timer_pending()`\
  \ | `include/linux/timer.h` | 检查定时器当前是否处于等待状态 |\n| `udelay()` | `include/asm-your-arch/delay.h`\
  \ | 忙等待指定的微秒数，`arch/your-arch/lib/delay.c` |\n| `rdtsc()` | `include/asm-x86/msr.h`\
