  \ USB 设备进行原始访问。`usbfs` 通常挂载在 `/proc/bus/usb/` 下。`usbfs` 树包含与系统中每个 USB 控制器（或总线）对应的目录。这些目录中的每一个又包含了对应于该总线上的\
  \ USB 设备的节点。\n\n568\n\n为了更好地理解 `usbfs`，让我们来看一个带有 Intel ICH4 南桥芯片组的系统。正如你在第 11 章“通用串行总线”中学到的，USB\
  \ 控制器是 PC 系统南桥芯片组的一部分。`ICH4` 支持一个 USB EHCI（高速 USB 2.0）控制器和三个 USB UHCI 控制器，可以连接六个物理\
  \ USB 端口。EHCI 控制器可以与所有六个端口通信，而三个 UHCI 控制器每个可以与两个端口。让我们把 EHCI 控制器命名为 `bus1`，三个 UHCI\
  \ 控制器分别命名为 `bus2`、`bus3` 和 `bus4`。现在假设系统只有两个物理 USB 端口，并且它们连接到对应于 `bus3` 的 UHCI 控制器。（A\
  \ 符号在命令输出后添加注释。）\n\n**bash> `ls –lR /proc/bus/usb`**\n\n```\n/proc/bus/usb:\ntotal\
