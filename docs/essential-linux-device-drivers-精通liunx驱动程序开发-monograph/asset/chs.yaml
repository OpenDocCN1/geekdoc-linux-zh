  \ | `/include/linux/sched.h` | 检查信号是否已传递。内核内部没有信号处理程序，因此你必须显式检查信号是否已递送。 |\n| `call_usermodehelper()`\
  \ | `/include/linux/kmod.hkernel/kmod.c` | 执行用户态程序。 |\n| 链表库 | `/include/linux/list.h`\
  \ | 参见表 3.1。 |\n\n### 函数\n| `register_die_notifier()` | `/arch/your-arch/kernel/traps.c`\
  \ | 注册死亡通知器。 |\n| `register_netdevice_notifier()` | `/net/core/dev.c` | 注册网络设备通知器。\
  \ |\n| `register_inetaddr_notifier()` | `/net/ipv4/devinet.c` | 注册网地址通知器。 |\n| `BLOCKING_NOTIFIER_HEAD()`\
