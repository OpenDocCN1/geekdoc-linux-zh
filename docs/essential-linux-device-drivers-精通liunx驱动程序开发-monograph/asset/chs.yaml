  \ `spi_async()` | `include/linux/spi/spi.h` | 异步在 SPI 总线上传输数据。 |\n\n## 第 8 集成电路协议\n\
  \n`drivers/i2c/busses/` 目录包含适配器驱动，`drivers/i2c/algos/` 目录包含算法驱动，而 `drivers/i2c/chips/`\
  \ 目录包含客户端驱动。你也可以在源码树的其他区域找到客户端驱动。例如，`drivers/sound/` 目录包含了使用 I2C 控制接口的音频芯片组驱动程序。请查看\
