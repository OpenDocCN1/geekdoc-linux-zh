    # Adding Repositories to Your sources.list


    The servers that hold the software for particular distributions of Linux are known
    as *repositories*. Nearly every distribution has its own repositories of software—developed
    and configured for that distribution—that might not work well, or at all, with
    other distributions. Although these repositories often contain the same or similar
    software, they aren''t identical, and sometimes have different versions of the
    same software or entirely different software.


    You will, of course, be using the Kali repository, which has a large amount of
    security and hacking software. But because Kali specializes in security and hacking,
    it doesn''t include some specialty software and tools or even run-of-the-mill
    software. It''s worth adding a backup repository or two that your system can search
    in case it doesn''t find specific software in the Kali repository.


    The repositories your system will search for are stored in the *sources.list*,
    and you can alter this file to define from which repositories you want to download
    software. I often add the Ubuntu repositories after the Kali repositories in my
    sources.list file; that, when I want to download a new software package, if it
    isn''t in the Kali repository, my system may find it in the Ubuntu repository.


    You can find the *sources.list* file at */etc/apt/sources.list*/ and open it with
    any text editor. I will be using mousepad. To open the sources.list file, enter
    the following into your terminal, replacing mousepad with the name of your editor:


    ```

    kali> sudo /etc/apt/sources.list

    ```


    After entering this command, you should see a window like the one in Figure 4-1,
    with a list of Kali''s default repositories.'
