  md: '# # 6

    PROCESS MANAGEMENT


    ![](img/7f106d14d88c19c5eac20858e43b615b_100_0.png)


    At any given time, a typical Linux system has hundreds, or sometimes even thousands,
    of processes running simultaneously. A process is simply a program that runs and
    uses resources, whether it be a terminal, a web server, or running commands, any
    databases, the GUI interface, or something else.


    Any good Linux administrator, and particularly any hacker, needs to understand
    how to manage their processes to optimize their systems. For example, once a hacker
    takes control of a target system, they might want to find and stop an antivirus
    application or firewall. To do so, the hacker would first need to know how to
    find this process. The hacker might also want to set a scanning script that runs
    periodically to find vulnerable systems, so we will also look at how to schedule
    such a script.


    In this chapter, you''ll learn to manage these processes. First, you''ll learn
    to view and find processes and how to discover which processes are using the most
    resources. Then, you''ll learn to manage processes by'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'running them in the background, prioritizing them, and killing them if

    necessary (no blood involved). Finally, you''ll learn to schedule processes to

    run on specified days and dates at specific times.


    # Viewing Processes


    In most cases, the first step in managing processes is to view what processes

    are running on your system. The primary tool for viewing processes, and

    one of the Linux administrator''s best friends, is the ps command. Run it in

    your command line to see what processes are active:


    ```

    kali> ps

    PID TTY TIME CMD

    39659 pts/0 00:00:01 bash

    39665 pts/0 00:00:00 ps

    ```


    The Linux kernel, the inner core of the operating system that controls

    early everything, assigns a unique process ID (PID) to each sequence-

    tentially, as the processes are created. When working with these processes in

    Linux, you often need to specify their PIDs, so it is far more important to

    ote the PID of the process than the name of the process.


    Alone, the ps command does not really provide you with much info-

    running. The ps command without any options lists the processes

    started (or invoked) by the currently logged-in user (in our case, root) and

    what processes are running on that. Here, it simply says that the

    bash shell is open and running and that we ran the ps command.


    We generally far information than that. In particular, we''re

    like to know about processes running by other users and by the system in the back-

    ground. Without this information, we won''t understand what of is actu-\ally taking
    place on our system. Running the ps command with the option

    processes running on the system for all users, as shown

    in Listing 6-1. Note that you should not prefix this with a dash (-) and

    that you should write it in lowercase; because Linux is case-sensitive, using

    upper options would show you significantly different results.


    ```

    kali> ps

    USER %CPU %MEM VSZ TTY STAT START TIME COMMAND

    root 1 0.0 0.4 202540 6396 7 S Ss Apr24 0:46 /sbin/init

    root 2 0.0 0.0 0 0 ? S Apr24 0:00 [kthread]

    root 3 0.0 0.0 0 0 ? S Apr24 0:26 [ksftirqd/0]

    ---

    root 39706 0.0 0.2 36096 324 pts/0 R+ 15:05 0:00 ps aux

    ```


    Listing 6-1: Using the options to see processes for all users


    As you can see, this command now shows many processes that

    likely run off the bottom of your screen. The first process is list, listed in

    t final column, and the last process is the command we just ran, ps aux.

    Many of the details (PID, %CPU, TIME, COMMAND, and so on) may be different on'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'your system should have the same format. For our purposes, here are the most
    important columns in this output:


    USER The user who invoked the process

    PID The process ID


    %CPU The percent of CPU this process is using

    %MEM The percent of memory this process is using

    %COMMAND The name of the command that started the process


    In general, to perform any action on a process, we must specify its PID. Let''s
    see how this identifier works to our advantage.


    # Filtering by Process Name


    When we inquire about processes, we usually don''t want every single process displayed
    on the screen. It''s simply a problem of too much information. Most often, we
    want to find information about a single process. To do so we can use the filtering
    command grep, which I introduced in Chapter 1.

    To demonstrate, we''ll use the Metasploit exploitation framework, the most widely
    used exploitation framework (and nearly every hacker''s friend). It comes installed
    on my Kali system, so you can start it with the following:


    ```

    kali> msfconsole

    ```


    After the exploitation framework has started, let''s see whether we can find it
    in the list of processes. Metasploit has now taken over this terminal, so open
    another terminal. Now, use the ps aux command and pipe it to grep (), looking
    for msfconsole, in Listing 6-2:


    ```

    kali> ps aux | grep msfconsole

    kali 39756 0.0.0 43040 716 pts/2 Ss+ 15:13 00:00 sh -c service

    postgresql start &&& msfconsole

    kali 39759 35.1 15.2 43040 22788 pts/2 Sl+ 15:13 1:36 ruby /usr/bin/msfconsole

    kali 39892 0.0.0 43040 940 pts/2 S+ 15:18 00:00 grep msfconsole

    ```


    Listing 6-2: Filtering a ps search to find a particular process


    From the filtered output in this listing, you will see all the processes that
    match the term msfconsole. The PostgreSQL database, which is the data Metasploit
    uses, is first, followed by the msfconsole process itself, from /usr/bin/msfconsole.
    Finally, you will see the grep command you used to look for msfconsole. Notice
    that the output did not include the column header from ps. Since the keyword is
    not in the header, it is not displayed. Even so, the results show up in the same
    format.


    From this, you can learn important information. For example, you need to know
    how many resources Metasploit is using, to see that it''s using 35.1 percent of
    your CPU, and consult the fourth column (CPU), to see that it''s using 15.2 percent
    of your system memory. That''s quite a bit. It''s a demanding beast!'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Finding the Greediest Processes with top


    When you enter the ps command, it displays the processes in the order they were
    started. In many cases, though, we want to know which processes are using the
    most resources. This is where the top command comes in handy; it displays the
    processes ordered by resources, starting with the largest. Unlike the ps command,
    which gives us a one-time snapshot, top refreshes the list every two seconds by
    default. This lets you monitor resource-hungry processes, as seen in Listing 6-3.


    ```

    kali~ top

    top - 15:31:17 2 days, 6:50, load average: 0.00, 0.04, 0.09

    Tasks: 176, 1 running, 15 sleeping, 0 stopped, 0 zombie

    CPU(%s): 1.3 us, 0.7 sy, 0.0 ni, 97.4 id, 0.0 wa, 0.0 hi 0.0 si 0.0

    Mem : 1491220 total, 64848 free, 488722 used, 93810 buff/cache

    Swap : 1046524 total, 104356 free, 2168 used, 784476 avail Mem

    \PID PR NI VIRT RES SHR S %CPU %MEM TIME+ COMMAND

    39759 20 0 893180 247232 S 0.7 16.6 1:47:88 ruby

    39859 20 0 273088 16796 S 0.3 1.2 1:47:88 postgres

    39933 20 0 299336 61500 S 0.7 4.1 1:47:88 Xorg

    --snap--

    ```


    Listing 6-3: Finding the greediest processes with top


    System administrators keep top running in a terminal to monitor the process resources.
    As a hacker, you might want to do the same, especially if you have multiple tasks
    running on your system. While you have top running, pressing the H or ? key will
    bring up a list of interactive commands, and pressing Q will quit top. You''ll
    use top again to manage your processes in “Changing Process Priority with nice”
    and below “Killing Processes” on page 66.


    # Managing Processes


    Hackers often need to multiprocess. For example, they may simultaneously run a
    process scanner, a vulnerability scanner, and an exploit. This requires that the
    hacker manage these processes efficiently to use system resources. In this section,
    I will show you how to manage multiple processes.


    # Changing Process Priority with nice


    You don''t hear the word nice used in the context of hackers, but here is an exception.
    The nice command is used to influence the priority of a process. As you saw when
    we ran the ps command, numerous processes run on the system at once, contending
    for the available resources. The kernel will have final say over the priority
    of a process, but you can use nice to suggest that a process should be elevated
    in priority.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'The idea behind the use of the term nice is that, when you use it, you''re
    determining how nice you''ll be to other users; if your process is using most
    of the system resources, you aren''t being very nice.


    The values passed to nice range from -20 to +19, with zero being the default value
    (see Figure 6-1). A high nice value translates to a low priority, and a low nice
    value translates to a high priority (meaning you''re not being so nice to other
    users and processes). When a process is started, it inherits the nice value of
    its parent process. The owner of the process can lower the priority. Of course,
    the superuser or root user can arbitrarily set the nice value to whatever they
    please.


    ![](img/7f106d14d88c19c5eac20858e43b615b_104_0.png)


    Figure 6-1: Niceness priority values


    When you start a process, you can set the priority level with the nice command
    and then alter the priority after the process has started running with the renice
    command. The syntax for these two commands is slightly different and can be confusing.
    The nice command requires that you *increment the nice value*, whereas the renice
    command wants an *absolute value* for niceness. Let''s look at an example to demonstrate
    this.


    # Setting the Priority When Starting a Process


    For demonstration purposes, let''s assume we have a process named slowprocess
    located at /bin/slowprocess. If we wanted to speed up its completion, we could
    start the process with the nice command:


    ```

    kali sudo nice -n 10 /bin/slowprocess

    ```


    This command would increment the nice value by -10, increasing its priority and
    allocating it more resources.


    On the other hand, if we want to be nice to our fellow users and processes and
    give slowprocess a lower priority, we could increment its nice value by 10:


    ```

    kali sudo nice -n 10 /bin/slowprocess

    ```


    Give this a try on a process you have currently running and run ps to see how
    it changes, if at all.


    # Changing the Priority of a Running Process with renice


    The renice command takes values between –20 and 19 and sets the priority to that
    particular level, rather than increasing or decreasing it from the level at which
    it started. In addition, renice requires you to supply the'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'PID of the process you are targeting rather than its name. So, if slowprocess
    is using an inordinate amount of resources on your system and you want to give
    it a lower priority to allow others access to more resources, you could renice
    the slowprocess (which has a PID of 6996) and give it a much higher nice value,
    like so:


    ```

    kali$ sudo renice 19 6996

    ```


    As nice, only the root user can renice a process to a negative value to give it
    higher priority, but any user can reduce priority.

    You can also use the top utility to change the nice value. With the top utility
    running, simply press the R and then supply the process''s PID and a nice value.
    Listing 6-4 shows the top utility running and its output when I press the R key
    and supply the PID and nice value.


    ```

    top - 21:56 up 21:41, 2 users, load average: 0.60, 0.22, 0.11

    Tasks: 128, 1 running, 127 sleeping, 0 stopped, 0 zombie

    %CPU(s): 1.5 us, 0.7 sy, 0.0 ni, 96.7 id, 1.1 wa, 0.0 hi, 0.0 si

    KiB Mem: 511864 total, 500780 used, 11084 free, 152308 buffers

    KiB Swap: 90116 total, 14444 used, 86672 free, 171376 cached

    ```


    | USER PR NI VIRT RES SHR R %CPU MEM TIME COMMAND |

    | 5451 20 0 1577m 20m 14m S 5.2 3.9 42:46:26 OLLYDBG.EXE |

    | 2766 20 0 55880 20m 5480 S 2.6 4.0 01:01:42 Xorg |

    | 5456 20 0 63956 4272 1780 S 1.3 0.8 13:21:69 wineserver |

    | 7 20 0 0 0 - S 0.3 0.0 00:30:12 rcu_sched |

    | 5762 20 0 174m 20m 17m S 0.3 4.1 00:04:74 gnome-terminal |


    Listing 6-4: Changing a nice value when top is in use


    When I press the R key, I''m asked for the PID with the text replace PID [value]
    to value. The output should then change to reflect the new priorities.


    # Killing Processes


    At times, a process will consume too many system resources, exhibit unusual behavior,
    or worst, freeze. Such a process is often referred to as a zombie process. For,
    probably the most problematic symptom will be wasted resources used by the zombie
    that could be better allocated using.


    When you identify a problematic process, you want to stop it with the kill command.
    There are many ways to kill a program, as the kill command has 64 signals, and
    each does something slightly different. Here, we focus on a few you will likely
    find most useful. The syntax for the kill command is -killPID, where the switch
    is optional. If you don''t provide a signal flag, it defaults to SIGTERM. Table
    6-1 lists the common signals.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Table 6-1: Commonly Used Kill Signals


    | Signal name | Number option | Description |

    |---|---|--|

    | SIGHUP | 1 | This is known as the Hangup (HUP) signal. It stops the designated
    process and restarts it with the same PID. |

    | SIGINT | 2 | This is the Interrupt (INT) signal. It is a weak kill signal that
    isn''t guaranteed to work in most cases. |

    | SIGQUIT | 3 | This is known as the core dump. It terminates the process and
    saves the process information in memory. Then it saves this information in the
    current working directory to a file named core. [The reasons for doing this are
    beyond the scope of this book.] |

    | SIGTERM | 15 | This is the Termination (TERM) signal. It is the kill command''s
    default kill signal. |

    | SIGKILL | 9 | This is the absolute kill signal. It forces the process to stop
    by sending the process''s resources to a special device, /dev/null.|


    Using the top command, you can identify which processes are too many resources;
    often, those processes will be legitimate, but there may also be malicious processes
    taking resources that you''ll want to kill.


    If you merely want to restart a process with the HUP signal, enter the -1 option
    with kill, like so:


    ```

    kali> sudo kill -1 6996

    ```


    In the case of a zombie or a malicious process, you likely want to send the kill
    -9 kill signal, to the process. This makes the process terminated.


    ```

    kali> sudo kill -9 6996

    ```


    If you don''t know a PID, you can use the killall command to kill the process.
    This command takes the name of the process, instead of the PID, as argument.


    For example, you could terminate a hypothetical zombieprocess like this:


    ```

    kali> sudo killall -9 zombieprocess

    ```


    Finally, you can also terminate a process in the top command. Simply press the
    K key and then enter the PID of the offending process.


    # Running Processes in the Background


    In Linux, whether you''re working from the command line or the GUI, you''re operating
    in a shell. All commands you run are executed from within that shell, even if
    they run from the graphical interface. When you execute a command, the shell waits
    until the command is completed before offering another command prompt.'
  merge: -1
  pgno: 106
- img_proc: true
  md: 'At times, you may want a process to run in the background, rather than having
    to wait for it to complete in that terminal. For instance, say we want to work
    on a script in a text editor. We''d enter the following to call our text editor
    (mousepad):


    ```

    kali sudo mousepad newscript

    ```


    The bash shell will open mousepad to create newscript. While we work in mousepad,
    the terminal will be running it and won''t display a new prompt that would allow
    us to enter more commands.


    We could, of course, open another terminal to run more commands, but a better
    option to save resources and screen estate is to start the text editor running
    in the background. Running a process in the background simply means that it continues
    to run without needing the terminal. In this way, the terminal is free for other
    duties.


    To start the text editor in the background, just append an ampersand (&) to the
    end of the command, like so:


    ```

    kali sudo mousepad newscript &

    ```


    Now, when the text editor opens, the terminal returns a new prompt so we can enter
    other commands on our system while editing our newscript. This is effective for
    any process that may run for a significant length of time when you want to use
    the terminal. As a hacker, you''ll find this useful for running multiple terminals
    with multiple tasks, allowing you to save resources and screen space.


    You can also move a process to the background using the bg command followed by
    the PID of the process. If you don''t know the PID, you can use the ps command
    to find it.


    # Moving a Process to the Foreground


    If you want to move a process running in the background to the foreground, you
    can use the fg (foreground) command. The fg command requires the name of the process
    you want to return to the foreground, as shown here:


    ```

    kali sudo fg newscript

    ```


    # Scheduling Processes


    Both Linux system administrators and hackers often need to schedule processes
    at a particular time of day. A system administrator might want to schedule a system
    backup every Saturday at 2:00 AM, for example. A hacker might want to set a script
    to run on a regular basis that looks for open ports or vulnerabilities. In Linux,
    you can accomplish this at at least two ways: with and cron.'
  merge: -1
  pgno: 107
- img_proc: true
  md: 'The command is used to set up the daemon (a background process) atd, which
    is useful for scheduling a job to run once at some point in the future. The cron
    daemon is more suited for scheduling tasks to occur every day, week, month, and
    we''ll cover it in detail in Chapter 16. To use it at, you must install it on
    your system:


    ```

    kali sudo apt install at

    ```


    We use the daemon to schedule the execution of a command or set of commands in
    the future, following the command by the time at which to execute the process.
    The time argument can be provided in various formats. Table 6-2 contains the most
    common time formats.


    # Table 6-2: Time Formats Accepted by the Command


    | Time format | Meaning |

    | --- | --- |

    | 7:20pm | Scheduled to run at 7:20 PM on the current day |

    | 7:20pm June 25 | Scheduled to run at 7:20 PM on June 25 |

    | noon | Scheduled to run at noon on the current day |

    | noon June 25 | Scheduled to run at noon on June 25 |

    | tomorrow | Scheduled to run tomorrow |

    | now + 20 minutes | Scheduled to run in 20 minutes from the current time |

    | now + 10 hours | Scheduled to run in 10 hours from the current time |

    | now + 5 days | Scheduled to run in five days from the current date |

    | now + 3 weeks | Scheduled to run in three weeks from the current date |

    | 7:20pm 06/25/2024 | Scheduled to run at 7:20 PM on June 25, 2024 |


    When you enter the daemon with the specified time, as goes into interactive mode,
    and you''ll be greeted with an > prompt. Here is how you enter the command you
    executed at the specified time:


    ```

    kali sudo at 7:20am

    >/root/myscanningscript

    ```


    This snippet will schedule myscanningscript to execute today at 7:20 AM. When
    you want to stop entering commands, press CTRL-D.


    # Summary


    Managing processes in Linux is a key skill for every Linux user. You must be able
    to view, find, kill, and schedule processes to manage your Linux instance optimally.
    A hacker will often need to find processes on the target they want to kill, such
    as the antivirus software or a firewall. They will also need to manage multiple
    processes in an attack and prioritize them.'
  merge: -1
  pgno: 108
- img_proc: true
