    Download Kali Linux. You''ll then be faced with multiple choices. It''s important
    to choose the right download. Along the left side of the table, you will see the
    image name, which is the name of the version that the link downloads. For instance,
    you may see an image name called Kali 64Bit, meaning it''s the full Kali Linux
    and is suitable for 64-bit systems (most modern systems use a 64-bit Intel or
    AMD CPU).


    To determine what type of CPU is on your system, go to Control Panel > System
    and Security, where it should be listed. If your system is 64-bit, download and
    install the 64-bit version of the full Kali (not Light, Lxde, or any of the other
    alternatives). If you are running an older computer with a 32-bit CPU, you will
    need to install the 32-bit version, which appears later on the page.


    You have a choice of downloading the file via HTTP or Torrent. Kali will download
    directly to your system just like any download and be in your Downloads folder.
    The torrent download is the peer-to-peer download used by many file-sharing sites.
    You will need a torrent-sharing application like BitTorrent to use this option.
    The Kali will download to the folder in which the torrent application stores downloads.


    There are other versions for types of CPUs, such as the commonly used ARM architecture
    in many mobile devices. If you are using a Raspberry Pi, tablet, or other mobile
    device, make sure you download and install the ARM architecture of Kali by scrolling
    down to Download ARM Images and clicking Kali ARM Images. (Phone users will likely
    prefer KaliHunter).


    You should now have Kali downloaded, but before you install anything, I want to
    talk about virtual machines. Generally, for the beginner, installing a Kali virtual
    machine and running it in a virtual machine such as VirtualBox or VMware Workstation
    is the best solution for learning and practicing.


    # Virtual Machines


    Virtual machine (VM) technology allows you to run multiple operating systems from
    one piece of hardware like your laptop or desktop. This means that you can continue
    to run the Windows or macOS operating system you are familiar with, then run a
    VM of Kali inside that operating system. You don''t need to overwrite your existing
    operating system to learn Linux.


    Numerous VM applications are available from VMware, Oracle, Microsoft, and other
    vendors. All are excellent, but here I will show you how to download and install
    Oracle’s free VirtualBox.'
