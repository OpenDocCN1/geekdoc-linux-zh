    each case may be different.


    When you enter ifconfig, you should see that the DHCP server has assigned a new
    IP address, a new broadcast address, and a new netmask

    to your eth0 network interface.


    # Manipulating the Domain Name System


    Hacker can find a treasure trove of information on a target in its DNS

    (Domain Name System). DNS is a critical component of the internet, and although
    it''s designed to translate domain names to IP addresses, hacker can use it to
    get information on the target.


    # Examining DNS with dig


    DNS is the service that translates a domain name like hackers-arise.com to the
    appropriate IP address; that is, your system knows how to get to it. Without DNS,
    we would all have to remember thousands of IP addresses for our favorite websites--no
    small task, even for a saint.


    One of the most useful commands for the aspiring hacker is dig, which offers a
    way to gather DNS information about a target domain. The stored information can
    include the IP address of the nameserver(the server that translates the target''s
    name to an IP address), the target''s email server, and potentially any subdomains
    and IP addresses.


    For instance, enter dig hackers-arise.com and add the ns option (short for nameserver):


    ```

    kali> dig hackers-arise.com ns

    --snip--

    ;; QUESTION SECTION:

    ;hackers-arise.com.      IN      NS


    ;; ANSWER SECTION:

    hackers-arise.com.      IN      NS      ns7.wixdns.net.

    hackers-arise.com.      IN      NS      ns6.wixdns.net.


    ;; ADDITIONAL SECTION:

    s6.wixdns.net.          5      IN      A       216.239.32.100

    --snip--

    ```'
  merge: -1
