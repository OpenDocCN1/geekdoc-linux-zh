- img_proc: true
  md: 'To remove a module, use the -r (remove) switch with modprobe followed by the
    name of the module:


    ```

    kali sudo modprobe -r module to be removed

    ```


    A major advantage of using modprobe instead of insmod is that modprobe understands
    dependencies, options, and installation and removal procedures and it takes all
    of these into account before making changes. Thus, it is easier and safer to remove
    kernel modules with modprobe.


    # Inserting and Removing a Kernel Module


    Let''s try inserting and removing a test module to help you familiarize yourself
    with this process. Let''s imagine that you just installed a new video card and
    you need to install the drivers for it. Remember, for devices are usually installed
    directly into the kernel to give them the necessary access to function properly.
    This also makes fertile ground for malicious hackers to install a rootkit or other
    listening device.


    Let''s assume for demonstration purposes (don''t actually run these commands)
    that we want to add a new video driver named HackAriseNewVideo. You can add it
    to your kernel by entering the following:


    ```

    kali> sudo modprobe -a HackAriseNewVideo

    ```


    To test whether the new module loaded properly, you can run the dmesg command,
    which prints out the message buffer from the kernel, and look for any alerts that
    would indicate a problem:


    ```

    kali> dmesg | grep Video

    ```


    If there are any kernel messages with the word "Video" in them, they will be displayed
    here. If nothing appears, there are no messages containing that keyword.


    Then, to remove this module, you can enter the -r (remove) command but with the
    switch:


    ```

    kali> sudo modprobe -r HackAriseNewVideo

    ```


    Remember, the loadable kernel modules are a convenience to a Linux user/admin,
    but they are also a major security weakness and one that professional hackers
    should be familiar with. As I said before, the LKMs can be the perfect vehicle
    to get your rootkit into the kernel and wreak havoc!'
