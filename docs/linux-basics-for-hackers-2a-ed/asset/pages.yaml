  md: '# 15

    MANAGING THE LINUX KERNEL

    AND LOADABLE KERNEL MODULES


    ![](img/7f106d14d88c19c5eac20858e43b615b_202_0.png)


    All operating systems are made up of at least two major components. The first
    and most important of these is the *kernel*.


    The kernel is at the center of the operating system and controls everything the
    operating system does, including managing memory, controlling the CPU, and even
    controlling what the user sees on the screen. The second element of the operating
    system is often referred to as *user land* and includes nearly everything else.


    The kernel is designed to be a protected or privileged area that can only be accessed
    by root or other privileged accounts. This is for good reason, as access to the
    kernel can provide nearly unfettered access to the operating system. As a result,
    most operating systems provide users and services access only to user land, where
    the user can access nearly anything they need without taking control of the operating
    system.'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'Access to the kernel allows the user to change how the operating system works,
    looks, and feels. It also allows them to crash the operating system, making it
    unworkable. Despite this risk, in some cases, the system admin must very carefully
    access the kernel for operational and security reasons.


    In this chapter, we will examine how to alter the kernel and add new modules to
    the kernel. It probably goes without saying that if a hacker can alter the target''s
    kernel, they can control the system. Furthermore, an attacker may need to alter
    how the kernel functions for some attacks, such as a man-in-the-middle (MITM)
    attack, where the hacker places themselves between a client and server and can
    eavesdrop on alter the communication. First, we''ll take a closer look at the
    kernel structure and its modules.


    # Is a Kernel Module?


    The kernel is the central nervous system of your operating system, controlling
    everything it, including managing interactions between hardware components and
    starting the necessary services. The kernel operates between the user applications
    you see and the hardware that runs everything, like the CPU, memory, and hard
    drive.


    Linux is a monolithic kernel that enables the addition of kernel modules. Such
    modules can be added and removed from the kernel. The kernel occasionally need
    updating, which might entail installing new device drivers (such as video cards,
    Bluetooth devices, or USB devices), files, and even system extensions. These drivers
    must be embedded in the kernel to be fully functional. In some systems, a driver,
    have to rebuild, compile, and reboot the entire kernel, but Linux has the capability
    of adding some modules to the kernel without going through that process. These
    modules are referred to as loadable kernel modules, or LKMs.


    LKMs access to the lowest levels of the kernel by necessity, making them incredibly
    vulnerable target for hackers. A particular type of malware known as a rootkit
    embeds itself into the kernel of systems, often through these LKMs. If malware
    embeds itself in the kernel, the hacker can take complete control of the operating
    system.


    If a hacker can get the Linux admin to load a new module to the kernel, the hacker
    can not only gain control over the target system, because they''re operating at
    the kernel level of the operating system, can also control what the target system
    is reporting in terms of processes, ports, services, hard space, and almost anything
    else you can think of.


    So, if a hacker can successfully tempt the Linux admin into installing a video
    or other device driver that is a rootkit embedded in it, the hacker can take total
    control of the system and kernel. This is the way of the most insidious rootkits
    take advantage of Linux and other operating systems.


    Understanding LKMs is absolutely key to being an effective Linux admin and being
    very effective and stealthy hacker.


    Let''s take a look at how the kernel can be managed for good and ill.'
  merge: -1
  pgno: 203
