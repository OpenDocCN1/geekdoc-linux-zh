  md: '# Checking the Kernel Version


    The first step to understanding the kernel is to check what your system is running.
    There are at least two ways to do this. First, we can enter the following:


    ```

    kali> uname -a

    Linux kali 6.6.9-amd64 #1 SMP PREEMPT_DYNAMIC Kali 6.6.9-1kali1 (2024-01-08) x86_64
    GNU/Linux

    ```


    The kernel responds by telling us which OS is running Linux Kali, the kernel build
    is 6.6.9, and the architecture it''s built for is x86_64. It also tells us if
    symmetric multiprocessing (SMP) capabilities can run on machines with multiple
    cores or processors and was built on January 8, 2024. Your output might be different,
    depending on which kernel was used in your build and the CPU in your system. This
    can be required when you install or load a kernel driver, so it is useful to understand
    how to get it.


    One other way to get this information is to use some other utility like the cat
    command on the /proc/version file, like:


    ```

    kali> cat /proc/version

    Linux 6.6.9-amd64 (gcc-13 (Debian 13.2.0-9) 13.2.0, GNU lu 2.41.50.20231227 #1
    SMP PREEMPT_DYNAMIC Kali 6.6.9-1kali1 (2024-01-08)

    ```


    Here you can see that the /proc/version file returned the same information.


    # Kernel Tuning with sysctl


    With the right commands, you can tune your kernel, meaning you can change memory
    allocations, enable networking features, and even harden the kernel against outside
    attacks.


    Modern Linux kernels use the sysctl command to tune kernel options. All changes
    you make with sysctl remain until you reboot the system. To make permanent changes,
    you have to edit the configuration file for sysctl directly at /etc/sysctl.conf.


    A word of warning: to be careful when using sysctl because without the proper
    knowledge and experience, you can easily make your system unstable and unusable.
    Make sure you''ve considered what you''re doing before making any permanent changes.


    Let''s take a look at the contents of sysctl now. By now, you should recognize
    the options we give with the command shown here:


    ```

    kali> sudo sysctl -a | less

    dev.cdrom.autoclose = 1

    dev.cdrom.cdromeject = 0

    dev.cdrom.check_media = 0

    dev.cdrom.debug = 0

    ----

    ```'
