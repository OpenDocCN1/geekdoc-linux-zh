  md: '# # Renaming a File


    Unfortunately, Linux doesn''t have a command intended solely for renaming a file,
    as Windows and some other operating systems do, but it does have the mv (move)
    command.


    The mv command can be used to move a file or directory to a new location, or simply
    to give an existing file a new name. To rename newfile2, you would enter the following:


    ```

    kali> mv newfile newfile

    kali> ls

    ```


    Now, when you list (ls) that directory, you should see newfile2 but not newfile,
    because it has been renamed. You can do the same with directories.


    # # Removing a File


    To remove a file, you can simply use the rm command, like so:


    ```

    kali> rm newfile2

    ```


    If you now do a long listing on the directory, you can confirm that the file has
    been removed.


    # # Removing a Directory


    The command for removing a directory is similar to the rm command for removing
    files with dir (for directory) appended, like so:


    ```

    kali> rmdir newdirectory

    rmdir:failed to remove ''newdirectory'': Directory not empty

    ```


    It''s important to note that rmdir won''t remove a directory that is not empty.
    Instead, it will give you a warning message that the directory is not empty, as
    you can see in this example. You must first remove all the contents of the directory
    before removing it. This is to stop you from accidentally deleting things you
    didn''t intend to delete.


    If you want to remove a directory and its content all in one go, you can use the
    -r switch after rm, like so:


    ```

    kali> rm -r newdirectory

    ```


    Just a word of caution, though: by using the -r option with rm, at least first,
    it is very easy to remove valuable files and directories by mistake. Using rm
    -r in your home directory, for instance, would delete every file and directory
    there—probably not what you were intending.'
  merge: -1
  pgno: 54
