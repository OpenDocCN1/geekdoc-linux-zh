  md: '# 10


    # FILESYSTEM AND STORAGE DEVICE MANAGEMENT


    ![](img/7f106d14d88c19c5eac20858e43b615b_142_0.png)


    If you are coming from a Windows environment, the way that Linux represents and
    manages storage devices will look rather different to you. You''ve already seen
    that the filesystem has no physical representation of the drive, like the C;,
    D;, or E: system in Windows, but rather has a file tree structure with / at the
    top, or root, of it. This chapter takes a look at how Linux represents storage
    devices such as hard drives, flash drives, and other storage devices.'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'We first look how additional drives and other storage devices are mounted upon
    filesystem, leading up to the / (root) directory. Mounting in this context simply
    means attaching drives or disks to the filesystem to make them accessible to the
    operating system. For you as a hacker, it''s necessary to understand the file
    and storage device management system, both on your own system and, often of your
    target. Hackers commonly use external media to load data, hacking tools, or their
    operating system. You''re on your target system, you need to understand what you''re
    working with, where to find confidential or critical files, how to mount a drive
    to your system. We cover all of these topics, plus how to manage and monitor storage
    devices, in this chapter.


    We begin with the directory known as *dev*, which you''ve probably already noticed
    in the directory structure: *dev* is short for *device*, and every device in Linux
    is represented by its own file within the /dev directory. Let''s start out by
    working with /dev.


    # The Device Directory /dev


    Linux has a special directory that contains files representing each attached device:
    the appropriately named /dev directory. As your first introduction, navigate to
    the /dev directory and then perform a long listing on it. You should see something
    Listing 10-1.


    ```

    kali> cd /dev

    kali> ls -1

    total 0

    crw---- 1 root root 10, 175 May 16 12:44 appgart

    crw---- 1 root root 10, 235 May 16 12:44 autofs

    drw-xr-x 1 root root 160 May 16 12:44 block

    --snip-

    lrwxrxr-x 3 May 16 12:44 cdrom -> s0

    --snip-

    drwx-xr-x 2 root root 60 May 16 12:44 cpu

    ```


    Listing 10-1: A long listing of the /dev directory


    The devices are displayed in alphabetical order by default. You may recognize
    some names of the devices, such as cdrom and cpu, but others have cryptic names.
    Each device on your system is represented by a file in the /dev directory, including
    devices you''ve probably never used or really existed. On the off chance you do,
