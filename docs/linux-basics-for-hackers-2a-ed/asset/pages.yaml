    # Our Task


    A hacker by the name of Max Butler, also known as Max Vision throughout the hacker
    world, was released from US prison in 2021. Max was a kind of gray hacker. By
    day, he was an IT professional in Silicon Valley, and by night, he was stealing
    and selling credit card numbers on the black market. At one time, he ran the world''s
    largest credit card hack, CardsMarket. Max served a 13-year prison term while
    at the same time assisting the Computer Emergency Response Team (CERT) in Pittsburgh
    with defending against hackers.


