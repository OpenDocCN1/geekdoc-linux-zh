  md: '# Accessing a Remote Database


    To access a MySQL database on the localhost, we use the following syntax:


    ```

    kali mysql -u <username> -p

    ```


    This command defaults to using the MySQL instance on the localhost if it isn''t
    given a hostname or IP address. To access a remote database, then, we need to
    provide the hostname or IP address of the system that is hosting the MySQL database.
    Here''s an example:


    ```

    kali mysql -u root -p 192.168.1.101

    ```


    This will connect us to the MySQL instance at 192.168.1.101 and prompt us for
    a password. For demonstration purposes, I am connecting to a MySQL instance on
    my local area network (LAN). If you have a system on your network with MySQL installed,
    use its IP address. I will assume you''ve already bypassed the password and have
    logged in as the root (you already know by default, the mysql database has no
    password).


    This opens up the MySQL command line interface, which provides us with the mysql
    prompt. As this command line interface, MySQL has GUI interfaces—native (MySQL
    Workbench) and third-party (Navicat and TOAD for MySQL). For you as a hacker,
    the command line interface may be the best opportunity for exploiting the MySQL
    database, so we''ll focus on this. It''s unlikely that an unauthorized entrant
    to the data-base, will be presented with an easy-to-use GUI.


    > Remember that all commands must end in a semicolon or \ (unlike Microsoft''s
    SQL Server) and that we can get help by entering help; or \n.


    Now that we are logged in as the system admin, we can navigate unimpeded through
    the database. If we had as a regular user, our navigation would be limited by
    the permissions provided by the system administrator for that user.


    # Connecting to a Database


    With access to the system, we want tonoop around. Our next step is to find out
    whether there are any databases worth accessing. Here is the command to find which
    databases are on the accessed system:


    ```

    mysql> show databases;

    ```


