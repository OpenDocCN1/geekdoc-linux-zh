    # Summary


    Understanding how Linux designates and manages its devices is crucial for any
    user and hacker. Hackers will need to know what devices are attached to a system
    and how much space is available. Because storage devices often develop errors,
    we can check and repair those errors with fsck. The dd command is capable of making
    a physical copy of a device, including any deleted files.


    # Exercises


    +   1. Use the mount and ummount commands to mount and unmount your flash drive.

    2. Check the amount of disk free on your primary hard drive.

