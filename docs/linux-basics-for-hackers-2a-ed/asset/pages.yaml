  md: '# Navigating the Linux Filesystem


    Navigating the filesystem from the terminal is an essential Linux skill. To get
    anything done, you need to be able to move around to find applications, files,
    and directories located in other directories. In a GUI-based system, you can visually
    see the directories, but when you''re using the command line interface, the structure
    is entirely text based, and navigating the file-system means using some commands.


    # Changing Directories with cd


    To change directories from the terminal, use the change directory command, cd.
    For example, here''s how to change to the /etc directory used to store configuration
    files:


    ```

    kali> cd /etc

    kali:/

    ```


    The prompt changes to kali:/etc, indicating that we''re in the /etc directory.
    We can confirm this by entering pwd:


    ```

    kali::/etc> pwd

    etc

    ```


    To move up one level in the file structure (toward the root of the file structure,
    or /), we use cd followed by double dots (..), as shown here:


    ```

    kali::/etc> cd ..

    kali> pwd

    /

    ```


    This moves us up one level from /etc to the root (/) directory, but you can move
    up as many levels as you need. Just use the same number of double-dot pairs as
    the level you want to move:


    +   - You would use .. to move up one level.

    - You would use ../ to move up two levels.

    - You would use ../../ to move up three levels, and so on.


    So, for example up two levels, enter cd followed by two sets of double dots with
    a forward slash in:


    ```

    kali> cd ../

    ```


    You can also move up to the root level in the file structure from anywhere-by
    entering cd /, where / represents the root of the filesystem.


    # Listing the Contents of a Directory with ls


    To see the contents of a directory (the files and subdirectories), we can use
    the ls (list) command. This is very similar to the dir command in Windows.'
  merge: -1
  pgno: 45
- img_proc: true
  md: '```

    kali> ls

    Debian Music usr

    Desktop Picture Videos

    Documents Public

    Downloads Templates

    ```


    This command lists the files and directories contained in the directory. You can
    also use this command on any directory, not just the one you are currently in,
    by listing the directory name after the command; for example, `ls /etc shows what''s
    in the /etc directories.


    To get more information about the files and directories, such as their permissions,
    owner, size, and when they were last modified, you can add the -l switch after
    ls. (The 1 stands for long) This is often referred to as long listing. Let''s
    try it here:


    ```

    kali> ls -l

    total 32

    dr-xr-- 1 kali 4096 Dec 5 11:15 Debian

    dr-xr-- 2 kali 4096 Dec 5 11:15 Desktop

    dr-xr-- 3 kali 4096 Dec 9 13:10 Documents

    dr-xr-- 18 kali 4096 Dec 9 13:43 Downloads

    --snip--

    dr-xr-- 1 kali 4096 Dec 5 11:15 Videos

    ```


    As you can see, ls -1 provides us with significantly more information, such as
    whether an object is a file or directory, the number of links, the owner, group,
    its size, when it was created or modified, and its name.

    i typically add the -l switch whenever listing in Linux, but to each their own.
    We''ll talk more about ls -1 in Chapter 5.


    Some files in Linux are hidden and won''t be revealed by a simple ls or -1 command.
    To show hidden files, add a lowercase -a switch, like so:


    ```

    kali> ls -la

    ```


    If you aren''t seeing a file you expect to see, it''s worth trying ls with a flag.
    When using multiple flags, you can combine them into one, as we''ve done here
    with -la instead of -a.


    # Getting Help


    Nearly every command, application, or utility has a dedicated help file in Linux
    that provides guidance for its use. For instance, if I needed help using the best
    cracking tool, aircrack-ng, I could simply type the aircrack-ng followed by the
    --help command:


    ```

    kali> aircrack-ng --help

    ```


    Note the double dash here. The convention in Linux is to use a double dash (--)
    before word options, such as help, and a single dash (-) before single-letter
    options, such as -h.'
