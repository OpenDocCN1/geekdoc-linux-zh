- img_proc: true
  md: 'The nameserver for hackers-arise.com is displayed in the ANSWER SECTION.

    Also note in the ADDITIONAL SECTION that this dig query reveals the IP address
    (216.239.32.100) of the DNS server hackers-arise.com. This section may look slightly
    different on your system or may not show at all.


    You can also use the dig command to get information on email servers connected
    to a domain by the mx option (mx is for mail exchange server). This information
    is critical for attacks on email systems. For example, information on the hackers-arise.com
    email servers is shown in the AUTHORITY SECTION:


    ```

    kali dig hackers-arise.com mx

    --snip----

    ;; QUESTION SECTION:

    ;hackers-arise.com. IN MX


    ;; AUTHORITY SECTION:

    hackers-arise.com. 5 IN SOA ns6.wixdns.net.

    support.wix.com 2016052216 1800 600 800 3600

    --snip--

    ```


    The most common Linux DNS server is the Berkeley Internet Name Domain (BIND).
    In some cases, Linux users will refer to DNS as BIND, but do not be confused:
    DNS and BIND both map individual domain names to IP addresses.


    # Changing Your DNS Server


    In some cases, you may want to use another DNS server. To do so, you will edit
    a plaintext file named /etc/resolv.conf on the system. Open that file in a text
    editor as mousepad. Then, on your command line, enter the precise name of your
    editor followed by the location of the file and the filename:


    ```

    kali sudo mousepad /etc/resolv.conf

    ```


    This example will open the resolv.conf file in the /etc directory in the server.
    The file should look something like Figure 3–4.


    ```

    1 Generated by NetworkManager

    search networksettings

    nameserver 192.168.1.1

    4

    ```


    Figure 3-4: A typical resolv.conf file in a text editor


    As you can see line 3, my nameserver is set to a local DNS server at 192.168.1.1.
    That works, but if I want to replace the DNS server with, say, Google''s public
    DNS server at 8.8.8.8, I could place the following line in the /etc/resolv.conf
    file to specify the nameserver:


    ```

    nameserver 8.8.8.8

    ```'
