  md: '# PRAISE FOR

    LINUX BASICS FOR HACKERS


    “If you''re just getting started or working your way to expert level, getting
    a copy of this book might be one of the best things you can do to develop your
    cybersecurity skills.


    —SANDRA HENRY-STOCKER,

    NETWORK WORLD


    “The information provided can help even a general user to get more comfortable
    with the Linux operating system without feeling overwhelmed by more complex, security-related
    topics and usage. While we could all benefit from more attention to security,
    Linux Basics for Hackers just might inspire the next crop of budding techs into
    the security rock stars of tomorrow.”


    —TIM EVERSON, THE ETHICAL

    HACKER NETWORK


    “Linux Basics for Hackers is immediately practical. Its quick-and-dirty approach
    to exploring and using a Linux system was welcome.”


    —JESSE SMITH, DISTROWATCH WEEKLY


    “A Crisp, well-written, and highly effective introduction to Linux for buddingters
    and SOC analysts . . . an ideal book on Linux for any aspiring red or blue team
    member, and reading it is well worth your time.”


    —CYBRARY


    “If you are starting out in computer science and want to get up to speed quickly
    on Linux- and Unix-like operating systems, working through this book will put
    you well ahead of your fellow students, and quickly.”


    —GREG LADEN, GREG LADEN’S BLOG'
