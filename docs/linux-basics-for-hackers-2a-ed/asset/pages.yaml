    # Performing More Searches with find


    The find command is the most flexible of the searching utilities. It is capable
    of beginning in any designated directory and looking for a number of different
    parameters, including, of course, the filename, but also the date of creation
    or modification, the owner, permissions, and the size. Here''s the basic syntax
    for find:


    ```

    find directory options expression

    ```


    So, I wanted to search for a file with the name apache2(an open web server member)
    starting in the root directory, I would enter the following:


    ```

    kali> find / -type f -name apache2

    ```


    First, I state the directory in which to start the search, in this case /. Then
    I specify which type of file to search for, in this case -f for an ordinary file.
    Finally, I give the name of the file I''m searching for, in this case apache2.
    Here are my results for search:


    ```

    kali> find / -type f -name apache2

    /usr/lib/apache2/mpm-itk/apache2

    /usr/lib/apache2/mpm-event/apache2

    /usr/lib/apache2/mpm-worker/apache2

    /usr/lib/apache2/mpm-prefork/apache2

    /etc/cron.daily/apache2

    /etc/logrotate.d/apache2

    /etc/init.d/apache2

    /etc/default/apache2

    ```


    The find command started at the top of the filesystem (/), went through every
    directory looking for apache2 in the filename, and then listed all instances.


    As might imagine, a search that looks in every directory can be slow. One way
    to speed up it is to look only in the directory where you would expect find the
    files you need. For example, if we were looking for a configuration file, we could
    start the search in the /etc directory, and Linux would search only far as its
    subdirectories. Let''s try it:'
  merge: -1
  pgno: 49
- img_proc: true
  md: '```

    kali> find /etc -type f -name apache2

    /etc/init.d/apache2

    /etc/logrotate.d/apache2

    /etc/cron.daily/apache2

    /etc/default/apache2

    ```


    This much faster search found occurrences of apache2 only in the /etc directory
    and its subdirectories.


    It''s important to note that unlike some other search commands, find displays
    only exact name matches. If the file apache2 has an extension, such as apache2.conf,
    the search will not find a match. We can remedy this limitation by using wildcards,
    which enable us to match multiple characters.


    Wildcards can come in a few forms: * ? [].


    Let''s look in the /etc directory for all files that begin with apache2 and have
    any extension. For this, we could write a find command using the following:


    ```

    kali> sudo find /etc -type f -name apache2.*

    /etc/apache2.conf

    ```


    When we run this command, we find that there is one in the /etc directory that
    fits the apache2.* pattern. When we use a period followed by the * wildcard, the
    terminal looks for any extension after the filename apache2. This can be a very
    useful technique for finding files when you don''t know the extension.


    I run this command, I find two files that start with apache2 in the /etc directory,
    including the apache2.conf file.


    # A QUICK LOOK AT WILCARDS


    Let''s say we''re doing a search on a directory that has the files cat, hat, what,
    and bat. The ? wildcard is used to represent a single character, so for ?at find
    cat, hat, and bat but not what, because at this filename is preceded by two letters.
    The [] wildcard is used to match the characters that appear inside the square
    brackets. For example, a search for [c,b]at would match cat and bat but not what.
    Among the most used wildcards is the asterisk [*], which matches any character(s)
    of any length, from none to an unlimited amount of characters. A search for *at,
    for example, would find cat, hat, what, and bat.


    # Filtering with grep


    Very often when using the command line, you''ll want to search for a particular
    keyword. For this, you can use the grep command as a filter to search for keywords.'
