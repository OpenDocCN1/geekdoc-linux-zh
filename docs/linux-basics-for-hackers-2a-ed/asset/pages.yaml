    kali sudo mysql -u root -np

    Enter password:

    Welcome to MariaDB monitor. Commands end with ; or \g.

    Your MariaDB connection id is 31

    Server version: 11.4.4-MariaDB-3 Debian n/a

    --snip--nType ''help'' or ''\h'' for help. Type ''\c'' to clear the current input
    statement

    MariaDB([none]) >

    ```


    In the default configuration of MySQL or MariaDB, the root user''s password is
    empty. Obviously, this is a security vulnerability, and you should remedy it by
    adding a password after your first login. Note that usernames and passwords for
    your operating system and MySQL are separate and distinct. Let''s change the password
    for the MySQL root user now in order to be safe.


    # Interacting with SQL


    SQL is an interpreted programming language for interfacing with a data-base. The
    database is often a relational database, meaning data is stored in multiple tables
    that interact, and each table has values in one or more columns and rows.


    There are several implementations of SQL, each with its own commands and syntax,
    but here are a few common commands:


    +   select Retrieves data

    union Combines the results of two or more select operations

    insert Adds new data

    update Modifies existing data

    deletes De data


    You can supply conditions to each command to be more specific about what you want
    to do. For example, the line


    ```

    select user, password from customers where user=''admin'';

    ```


    returns the values for the user and password fields for any user whose value is
    equal to admin in the customers table.


    # Setting a Password


    Let''s see what users are already in our MySQL system by entering the following-.
    (Note that commands in MySQL are terminated with a semicolon).


    ```

    mysql> select user, host, password from mysql.user;

    ```


    | user | host | password |

    |------++--------+----------|

    | root | localhost | |

    | --snip-- | |'
