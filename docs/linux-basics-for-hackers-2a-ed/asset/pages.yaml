  md: '# Social Engineering Attacks with AI


    Over 80 percent of all successful cyberattacks include an element of social engineering.
    Social engineering relies upon manipulating human vulnerabilities rather than
    technical vulnerabilities. Tactics like phishing, email impersonation, and pretexting
    are becoming increasingly sophisticated and prevalent. For instance, ransomware
    attacks, presently the most successful financial attacks, usually begin with someone
    within the targeted organization opening a file or clicking a link. This simple
    action gives that attacker an opening into into the organization, allowing them
    to encrypt all the data in the organization, which leads to the crippling of the
    organization. Eventually, the company must pay the ransom to get its data back.


    In the initial phases of AI in cybersecurity, attackers will likely focus on using
    AI to craft email messages that entice their targets to click a link or open a
    document. Writing email may be one of the best uses for artificial intelligence
    for hackers right now, as AI can gather the key information and draft an excellent
    and effective email to the intended targets.


    Let''s say our favorite AI writes an email to OccupyTheWeb to purchase translation
    rights to the video company (this is a real life social engineering attack where
    I was a target). The key is that AI can write email messages that are highly targeted
    and tailored to the individual recipient. Here''s its draft:


    > Subject: Offer to Purchase Rights to "Linux Basics for Hackers"

    training videos


    Dear OccupyTheWeb Team,


