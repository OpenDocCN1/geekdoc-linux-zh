    system used by many restaurants had a technical support backdoor built into it.
    In this case, the backdoor enabled tech support to assist their clients. Aloha
    tech support could use the user''s system through 5505 to provide assistance when
    the user called for help. Max realized that if he found a system connected to
    the internet with the Aloha POS system, he could access the system with sysadmin
    (the all-powerful system administrator) privileges through port 5505. Max was
    able to enter many of these systems and steal tens of thousands of credit card
    numbers.


    Eventually Max wanted to find every system that had port 5505 so he could go stealing
    thousands of credit card numbers to stealing millions. Max decided to write a
    script that would scan millions of IP addresses for systems with port 5505. Of
    course, most systems do not have port 5505, so if they did, it was like they were
