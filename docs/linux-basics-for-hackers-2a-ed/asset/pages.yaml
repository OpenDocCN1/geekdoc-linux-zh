- img_proc: true
  md: 'modern distributions of Linux have now added the modprobe command, which automatically
    loads dependencies and makes loading and removing kernel modules less risky. We''ll
    cover modprobe in a moment. First, let''s see how to get more information about
    our modules.


    # Finding More Information with modinfo


    To learn about any of the kernel modules, you can use the modinfo command. The
    syntax for this command is straightforward: modinfo followed by the name of the
    module you want to learn about. For example, if you wanted to retrieve basic information
    on the bluetooth kernel module you saw when you ran the lsmod command earlier,
    you could enter the following:


    ```

    kali> modinfo bluetooth

    filename: /lib/modules/4.19.0-kali-amd64/kernel/net/bluetooth/bluetooth.ko

    alias: net-pf-31

    license: GPL

    version: 2.22

    description:Bluetooth Core ver 2.22

    author: Marcel Holman <cmamel@holtmann.com>

    srcversion: 41D78022CC17839AEOD188

    depends: rfkill, ecdh_generic, crc16

    intree:

    vermagic: 6.6.9-amd64 SMP SMP mod unload modules\sparm: disable_esco: Disable
    ESCO connection creation (bool)\sparm: disable_ertm: Disable enhanced retransmission
    mode (bool)

    ```


    As you can see, the modinfo command reveals significant information about this
    module, which is necessary to use Bluetooth on your system. Note that among other
    things, it lists the module dependencies: rfkill, ecdh_generic, and crc16. Dependencies
    are modules that must be installed for the bluetooth module to function properly.


    Typically, this is useful when troubleshooting why a particular hardware device
    is not working. Besides noting things like the dependencies, you can get information
    about the version of the module and make sure the version of the kernel it was
    developed for and then make they match the version you are running.


    # Adding and Removing Modules with modprobe


    Most distributions of Linux, including Kali Linux, include the modprobe command
    for LKM management. To add a module to your kernel, you will use the modprobe
    command with the -a (add) switch, like so:


    ```

    kali> sudo modprobe -a module name

    ```'
  merge: -1
