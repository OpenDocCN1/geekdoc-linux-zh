    | break | Puts a job in the background |

    | cd | Exits the current loop |

    | continue | Changes directory |

    | echo | Resumes the command arguments |

    | eval | Evaluates the following expression |

    | exec | Executes the following command without creating a new process, replacing
    the current process |

    | exit | Quits the shell |

    | export | Makes a variable or function available to other programs that are executed
    from this shell |

    | fg | Brings a job to the foreground |

    | getopts | Parses arguments to the shell script |

    | jobs | Lists background [bg] jobs |

    | pwd | Displays the current directory |

    | read | Reads a line from standard input |

    | readonly | Declares a variable as read-only |

    | set | Lists all variables |

    | shift | Moves the script''s input parameters to the left, dropping the first
    parameter [useful for consuming all parameters one at a] |

    | test | Evaluates arguments |

    | times | Prints the user and system times |

    | trap | Traps a signal so the script can handle it (untrapped signals terminate
    the script) |

    | type | Displays how each argument would be interpreted as a command |

