    of that subclass might be the model 320i.

    Each object might have properties (make, model, year, and color) and methods (start,
    drive, and park), as shown in Figure 17-3.


    ![](img/7f106d14d88c19c5eac20858e43b615b_229_1.png)


    Figure 17-3: OOP properties and methods


