  md: '# PREFACE


    Welcome to the new, updated second edition of Linux Basics for Hackers!


    I want to begin by thanking all my readers for making the first edition such a
    resounding success. Not only is Linux Basics for Hackers the top-selling Linux
    book on Amazon, but it is also the best-selling operating system book on Amazon,
    far outpacing all the Windows 10 and 11 books. I am so grateful. I think people
    like this book.


    The first edition of Linux Basics for Hackers was written in 2017 and published
    in 2018. Much has changed in Linux generally and, specifically, Kali Linux. With
    this second edition, we are targeting to bring in new tools and techniques that
    make using Linux (2025), in a cybersecurity environment easy.


    One of the major changes you will note is the use of sudo before all the commands
    that require root privileges. In the first edition, I logged into the root account
    and operated from there. As an attacker, if is the case, but as a learner, you
    should avoid logging into the root account unless absolutely necessary. In this
    edition, I am amending this as a safety measure of those learning Linux from my
    book, and every command that requires root privileges is preceded with a sudo.


    Every so often, the software utilities in Linux change. This has happened in the
    intervening years where systemd utilities have replaced SysV utilities. These
    utilities control the system and service manager in Linux. They affect the way
    services are started and stopped in Linux. You will notice changes, for instance,
    in how we start a service transitioning from'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'the service (SysV) command to systemctl (systemd) command. Both work, but Linux
    is rapidly moving to the latter, and the former will likely be deprecated (or
    discontinued) in the near future, so it is best to adapt to this new style now.


    Kali Linux has converted its default shell to the Z shell (zsh). If you are a
    beginner, I think you should stay with the bash shell (Bourne-again shell) because
    nearly every other Linux system uses bash, not the Z shell. Fortunately, the developers
    of Kali gave us an easy option to revert to the bash shell in their GUI application,
    kali-tweaks.


    We have also updated the sections on Bluetooth and the Linux logging functions,
    as both have changed significantly in the intervening time.


    Finally, Chapter 18 discusses the future of artificial intelligence in our industry.
    Artificial intelligence will not make you obsolete; it will make you better. Embrace
    and use it. Those who refuse to learn to use AI will be the next leaders in our
    field.


    I''m hoping you enjoy this book even more than the first edition.'
  merge: -1
  pgno: 21
