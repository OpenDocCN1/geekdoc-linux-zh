- img_proc: true
  md: 'In the output, you should edit hundreds of lines of parameters that a Linux
    administrator can edit to optimize the kernel. There are a few lines here that
    are useful to you as a hacker. As an example of how you might use sysctl, we''ll
    look at enabling packet forwarding.


    In the man-in-themiddle (MITM) attack, the hacker places themselves between communicating
    hosts to intercept information. The traffic passes through the hacker''s system,
    so they can view and possibly alter the communication. One way to achieve this
    routing is to enable packet forwarding.


    If you scroll down a few pages in the output or filter for "ipv4" (sudo sysctl
    -a | grep ipv4), you should see the following somewhere in the output:


    ```

    net.ipv4.ip_dynaddr = 0

    net.ipv4.ip_early_demux = 0

    net.ipv4.ip_forward = 0

    net.ipv4.ip_forward_use_pmtu = 0

    -snip-

    ```


    The line.ipv4.ip_forward = 0 is the kernel parameter that enables the kernel to
    forward on the packets it receives. In other words, the packets sends back out.
    The default is 0, which means that packet forwarding is disabled.


    To enable IP forwarding, change the 0 to 1 by entering the following:


    ```

    kali> sysctl -w net.ipv4.ip_forward=1

    ```


    Remember that sysctl changes take place runtime but are lost when the system is
    rebooted. To make permanent changes edit configuration file /etc/sysctl.conf.
    Let''s change the kernel handles IP forwarding for MITM attacks and make this
    change permanent.


    To enable IP forwarding, open the /etc/sysctl.conf in any text editor and uncomment
    the line for ip_forward. Open /etc/sysctl.conf with any text editor and take a
