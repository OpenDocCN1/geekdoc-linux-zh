    Get:4: http://mirrors.of.berkeley.edu/kali-rolling/contrib amd64 Packages [107
    kb]

    Fetched 15.2 MB in 1 min 4s (236 KB/s)

    Reading package lists... Done

    ```


    The list of available software in the repository your system will be updated.
    If the update is successful, your terminal will state Reading package lists...
    Done. Note that the name of the repository and the values (time, size, and on)
    may be different on your system.


    # # Upgrading Packages


    To upgrade the existing packages on your system, use apt upgrade. Because upgrading
    your packages may make changes to your software, you must be logged in as root
    entering apt upgrade. This command will upgrade every package on your system that
    apt knows, meaning only those stored in the repository. Upgrading can be time-consuming,
    so you might not be able for a while.


    ```

    kali> sudo apt upgrade

    [sudo] password for kali:

    Reading package lists... Done

    Building dependency tree... Done

    Calculating upgrade... Done

    ```'
