    # ## Spoofing Your MAC Address


    You can use ifconfig to change your MAC address (or hwaddr). The MAC address is
    globally unique and is often used as a security measure to keep hackers out of
    networks, or services to trace them. Changing your MAC address to a different
    value is easy to do and neutralizes those security measures. Thus, it''s a very
    useful technique for bypassing network access controls.


    ```

    kali> sudo ifconfig eth0 down

    kali> sudo ifconfig eth0 hw ether 00:11:22:23:34:55

    kali> sudo ifconfig eth0 up

    ```


    Now, when you check your settings with ifconfig, you should see that hwaddr has
    changed to your spoofed MAC address!


    # ## Assigning New IP Addresses from the DHCP Server


    Linux has a Dynamic Host Configuration Protocol (DHCP) server that runs a daemon
    (a process that runs in the background) called dhcpd, or the dhcp daemon. The
    DHCP server assigns IP addresses to all the systems on the subnet and keeps logfiles
    of which IP address is allocated to which machine at any time. This makes it a
    great resource for forensic analysts hoping to trace hackers after an attack.
    For that reason, it''s useful to understand how the DHCP server works.


    Usually, to connect to the internet from a LAN, you have DHCP-assigned IP. Therefore,
    after setting a static IP address, you must also get a new DHCP-assigned IP. To
    do this, you can always reboot your system, but I''ll show you how to retrieve
    a new DHCP without shutting your system and restart it.


    To request an IP address from DHCP, simply call the DHCP server with the command
    dhclient followed by the interface to which you want the address assigned. Different
    Linux distributions use different DHCP clients, but Kali is built on Debian, which
    uses dhclient, so you can assign a new address like this:


    ```

    kali> sudo dhclient eth0

    ```'
