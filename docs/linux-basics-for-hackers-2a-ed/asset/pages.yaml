    # Managing Kernel Modules


    Linux has at least two to manage kernel modules. The older way is to use a group
    of commands built around the insmod (insmod stands for insert module) and is intended
    to deal with modules. The second way, using the modprobe command, we will employ
    a little later in this chapter. Here we will use the lsmod command from the insmod
    suite to list the installed modules in the kernel:


    ```

    kali> lsmod

    Module Size Used by

    netlink_queue 20480 0

    netlink_log 201480 0

    netlink 16384 2 netlink_log,netlink_queue

    bluetooth 516096 0

    rkfill 28672 2 bluetooth

    ```


    As you see, the lsmod command lists all the kernel modules as well as information
    on their size and what other modules may use. So, for instance, the netlink module—a
    message-based protocol for communication between the kernel and user space—is
    16,384 bytes and used by the nnetlink_log module and the nf_netlink_queue module.


    From the insmod suite, we can load or insert a module with insmod and remove a
    module with rmmod, which stands for remove module. These commands are not perfect
    and may not take into account module dependencies, so using them can leave your
    kernel unstable or unusable. As a result,'
  merge: -1
