  md: '# 9


    # COMPRESSING AND ARCHIVING


    ![](img/7f106d14d88c19c5eac20858e43b615b_134_0.png)


    Hackers often need to download and install new software, as well as send and download
    multiple scripts and large files. These tasks are easier if these files are compressed
    and combined into a single file. If you come from the Windows world, you will
    probably recognize this concept from the .zip format, which combines and compresses
    files to make them smaller for transferring over the internet or removable media.
    There are many ways to do this in Linux, and we look at a few of the most common
    tools for doing so in this chapter. We also look at the dd command, which allows
    you to copy entire drives, including deleted files on those drives.'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# # What Is Compression?


    The interesting subject of compression could fill an entire book by itself, but
    for this book we need only a rudimentary understanding of the process.

    *Compression*, as the term implies, makes data smaller, thereby requiring less
    storage capacity and making the data easier to transmit. For your purposes as
    a beginning hacker, it will suffice to categorize compression as either lossy
    or lossless.


    Lossy compression is very effective in reducing the size of files


    However, lossy compression is unacceptable when you are sending files or software
    and data integrity is crucial. For example, if you are sending a script or document,
    the integrity of the original file must be retained when it is decompressed. This
    chapter focuses on *lossless* type of compression, which is available from a number
    of utilities and algorithms. Unfortunately, lossless compression is not as effective
    as lossy compression, as you might imagine, but for the hacker, integrity is often
    far more important than compression ratio.


    # # Tarring Files Together


    Usually, the first thing you do when compressing files is to combine them into
    an archive. In most cases, when archiving files, you''ll use the tar command.
    *Tar stands for *tape archive*, a reference to the prehistoric days of computing
    systems used tape to store data. The tar command creates a single file from many
    files, which is then referred to as an *archive*, tar file, or *tarball*.


    For instance, say you had three script files like the ones we used in Chapter
    8, named hackersarise1, hackersarise2, and hackersarise3. If you navigate to the
    directory that holds them and perform a long listing, you will clearly see the
    files and the details you''d expect, including the size of the files, as shown
    here:


    ```

    kali> ls -l

    -rwxr-xr-x 1 kali kali 22311 Nov 27 2024 13:00 hackersarise1.sh

    -rwxr-xr-x 1 kali kali 8791 Nov 27 2024 13:00 hackersarise2.sh

    -rwxr-xr-x 1 kali kali 3992 Nov 27 2024 13:00 hackersarise3.sh

    ```'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'Let''s say you want to send all three of these files to another hacker you''re
    working on a project. You can combine them and create a single archive file using
    the command in Listing 9-1.


    ```

    kali -cvf HackersArise.tar hackersarses1.sh hackersarsesise2.sh hackersarise3.sh

    hackarsesise1.sh

    hackarsesise2.sh

    hackarsesise3.sh

    ```


    # Listing 9-1: Creating a tarball of three files


    Let''s break down this command to better understand it. The -c option means create,
    v (which stands for verbose and is optional) lists the files that tar is dealing
    with, and f means writing to the following file. This last option will also work
    for reading from files. Then we give the new archive-name you want to create from
    the three scripts: HackersArise.tar.


    In full, this takes all three files and creates a single file, HackersArise.tar,
    out of them. When you do longer listing of the directory, you will see that it
    also contains the .tar file, as shown next:


    ```

    kali> ls -1l

    --snap-

    -Tw-rw-r-- 1 kali 40960 Nov 27 2024 13:32 HackersArise.tar

    --snap--

    ```


    Note the size of the tarball: 40,960 bytes. When the three files are archived,
    the sum of the three files before archiving was 35,094 bytes, after archiving,
    the tarball had grown to 40,960 bytes. In other words, the archiving process has
    added over 5,000 bytes. Although this overhead can be significant with small files,
    it is less significant with larger and larger files.


    We can display those files from the tarball, without extracting them, by using
    the tar command with the -t content switch, as shown next:


    ```

    kali> -tvf HackersArise.tar

    -Fwx-xr-x 1 root root 22311 Nov 27 2024 13:00 hackersarses1.sh

    -Fwx-xr-x 1 root root 8791 Nov 27 2024 13:00 hackersarsesise2.sh

    -Fwx-xr-x 1 root root 3992 Nov 27 2024 13:00 hackersarise3.sh

    ```


    Here, we see our three files and their original sizes. You can then extract those
    files from the tarball using the tar command with the -x switch, as shown next:


    ```

    kali> tar -xvf HackersArise.tar

    hackarsesise1.sh

    hackarsesise2.sh

    hackarsesise3.sh

    ```


    Because you''re still using the -v switch, this command shows which files are
    being extracted in the output. If you want to extract the files and do so'
