    # Removing Software


    When removing software, use apt with the remove option, followed by the name of
    the software to remove:


    ```

    kali> sudo apt remove ufw

    Reading package lists... Done

    Building dependency tree... Done

    Reading state information... Done

    The following packages will be REMOVED:

    ufw

    0 upgraded, 0 newly installed, 1 to remove and 151 not upgraded.

    After this operation, 853 kB disk space will be freed.

    Do you want to continue? [Y/n]

    ```


    Again, you''ll see the tasks being done in real time and you will be asked whether
    you want to continue. You can enter y to uninstall, but what you want to keep
    ufw since you''ll be using it. The remove command doesn''t remove the configuration
    files, which means you can reinstall the same package in the future without reconfiguring.


    If you want to remove the configuration files at the same time as the package,
    use the purge option:


    ```

    kali> sudo apt purge ufw

    Reading package lists... Done

    Building dependency tree... Done

    Reading state information... Done

    The following packages will be REMOVED:

    ufw*

    0 upgraded, 0 newly installed, 1 to remove and 151 not upgraded.

    After this operation, 0 B of additional disk space will be used.

    Do you want to continue? [Y/n]

    ```'
