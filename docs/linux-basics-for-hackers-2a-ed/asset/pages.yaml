    # # OpenSSH and the Raspberry Pi Spy


    SSH is an acronym for Secure Shell and is basically what enables us to connect
    securely to a terminal on a remote system—a replacement for the insecure telnet
    that was common decades ago. When we''re building a web server, SSH enables us
    to create an access list (a list of users who can use this service), authenticate
    users with encrypted passwords, and encrypt all communication. This reduces the
    chance of unwanted users using the remote terminal (due to intercepting the communication
    (due to encryption). The probably most widely used Linux SSH service is OpenSSH,
    which is installed on every Linux distribution, including Kali.


    System administrators often use SSH to manage remote systems, and hackers often
    use SSH to connect to compromised remote systems, so we''ll do the same here.
    In this example, we use SSH to set up a Raspberry Pi system for spying, something
    I call the “Raspberry Pi Spy.” For this, you''ll need a Raspberry Pi and the attendant
    Raspberry Pi camera module.


    Before we do that, though, start OpenSSH on your Kali system with the following:


    ```

    kali sudo systemctl start ssh

    ```


    We''ll be using SSH to build and control a remote spying Raspberry Pi. If you''re
    not familiar with it, the Raspberry Pi is a tiny but powerful, credit card-sized
    computer that works great as a remote spying tool. We will employ a Raspberry
    Pi with a camera module to use as a remote spying device. You can purchase a Raspberry
    Pi at nearly any electronics retailer, including Amazon, for less than $50, and
    you can get the camera module for about $15.


    Here, we''ll the Raspberry Spy Pi on the same network as our Kali system, which
    allows us to use private, internal IP addresses. Of course, when hacking in the
    real world, you''d probably want to set it up on another remote network, but that
    would be a touch more difficult and beyond the scope of this book.'
