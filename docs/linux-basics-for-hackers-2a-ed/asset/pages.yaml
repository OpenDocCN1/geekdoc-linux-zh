  md: '# A Tour of Kali


    Once you start Kali, you''ll be greeted with a login screen. Log in using the
    Kali account username and the default password kali (if you changed the password
    earlier, use your new password here). You should now have access to your Kali
    desktop. We''ll quickly look at two of the most basic aspects of the desktop:
    the terminal interface and file structure.


    # The Terminal


    The first step to using Kali is to open the terminal, which is the command line
    interface we''ll use in this book. You''ll find the icon for the terminal along
    the left of the desktop. Click this icon to open the terminal. Your new terminal
    should look like the one shown in Figure 1-1.


    ![](img/7f106d14d88c19c5eac20858e43b615b_42_0.png)


    Figure 1-1: The Kali terminal


    This opens the command line environment, known as the shell, which enables you
    to run commands on the underlying operating systems and write scripts. Although
    Linux has many different environments, the most popular is the bash shell, which
    is the default shell in many Linux distributions.


    To change your password, you can use the command password.


    # The Linux Filesystem


    The Linux filesystem structure is somewhat different from that of Windows. Linux
    doesn''t have a physical drive (such as the C: drive) at the base of the filesystem
    but uses a logical filesystem instead. At the very top of the filesystem structure
    is /, often referred to as the root of the filesystem, as it were an upside-down
    tree (see Figure 1-2). Keep in mind that this is different from the root user.
    These terms may seem confusing at first, but they will become easier to differentiate
    once you get used to Linux.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '![](img/7f106d14d88c19c5eac20858e43b615b_43_0.png)


    Figure 1-2: The Linux filesystem


    The root (/) of files is the top of the tree, and the following are the most important
    subdirectories to know:


    +   **root** The home directory of the all-powerful root user

    /**etc** Generally contains the Linux configuration files—files that control and
    when programs start up

    /**home** The user''s home directory

    /**mnt** Where other filesystems are attached or mounted to the filesystem

    /**media** Where CDs and USB devices are usually attached or mounted to the filesystem

    /**bin** Where application binaries (the equivalent of executables in Microsoft
    Windows or applications in macOS) reside

    /**lib** Where you''ll find libraries (shared programs that are similar to Windows
    DLLs)


    We''ll spend more time with these key directories throughout this book. Understanding
    these first-level directories is important to navigating through the filesystem
    from the command line.


    It''s also important to know before you start that you should not log in root
    when performing routine tasks, because anyone who hacks your system (yes, hackers
    get hacked) when you''re logged in root would immediately gain root privileges
    and thus “own” your system. Log in as a regular user when starting regular applications,
    browsing the web, running tools like Wireshark, and so on. For the practice you''ll
    do in this book, staying logged as root should be fine.


    # # Basic Commands in Linux


    To begin, let''s look at some basic commands that will help you get up and running
    in Linux.'
