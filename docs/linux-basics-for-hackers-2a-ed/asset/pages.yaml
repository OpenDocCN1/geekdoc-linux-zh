  md: '# Detecting and Connecting to Bluetooth


    These days, nearly every gadget, mobile device, and system has Bluetooth built
    in, including our computers, smartphones, tablets, speakers, game controllers,
    keyboards, and many other devices. Being able to hack Bluetooth can lead to the
    compromise of any information on the device, control of the device, and the ability
    to send unwanted information to and from the device, among other things.


    To exploit the technology, we need to understand how it works. An in-depth understanding
    of Bluetooth is beyond the scope of this book, but I will give you some basic
    knowledge that will help you scan for and connect to Bluetooth devices in preparation
    for hacking them.


    # How Bluetooth Works


    Bluetooth is a universal protocol for low-power, near-field communication operating
    at 2.4 GHz to 2.485 GHz using spread spectrum, frequency hopping at 1,600 hops
    per second (this frequency hopping is a security measure). It was developed in
    1994 by Ericsson Corp. of Sweden and named after the 10th-century Danish king
    Harald "Bluetooth" Gormsson (note that Sweden and Denmark were a single country
    in the 10th century).


    The Bluetooth specification has a minimum range of 10 meters, but there is no
    limit to the upper range manufacturers may implement in their devices. Many devices
    have ranges as large as 100 meters. With special antennas, range can be extended
    even further.


    Connecting two Bluetooth devices is referred to pairing. Pretty much any two Bluetooth
    devices can connect to each other, but they can only pair if they are in discoverable
    mode. A Bluetooth device in discoverable mode transmits the following information:


    +   - Name

    - Class

    - List of services

    - Technical information


    When the two devices pair, they exchange a secret or link key. Each device stores
    this link key so it can identify the other in future pairings. Every device has
    a 48-bit identifier (a MAC-like address) and usually a manufacturer-assigned name.
    These will be useful pieces of data that we want to identify and access a device.


    # Bluetooth Scanning and Reconnaissance


    Linux has an implementation of the Bluetooth protocol stack BlueZ that we''ll
    use to scan for Bluetooth signals. Most Linux distributions, including Kali Linux,
    have it installed by default. If yours doesn''t, you can usually find it in your
    repository using the following command:


    ```

    kali sudo apt install bluez

    ```'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'BlueZ has a number of simple tools we can use to manage and scan Bluetooth
    devices, including the following:


    **hcitfig** This tool operates very similarly to ifconfig in Linux, but for Bluetooth
    devices. As you can see in Listing 14-1, I have used it to bring up the Bluetooth
    interface and query the device for its specs.


    **hcitool** This inquiry tool can provide us with device name, device ID, class,
    and device clock information, which enables the devices to work synchronously.


    **hcidump** This tool enables us to sniff the Bluetooth communication, meaning
    we can capture data sent over the Bluetooth signal.


    The first scanning and reconnaissance step with Bluetooth is to check whether
    the Bluetooth adapter on the system we use is recognized and enabled we can use
    it for other devices. We can do this with the built-in BlueZ tool, hcitool, as
    shown in Listing 14-1.


    ```

    kali sudo hcitool

    hci0: BR/EDR Bus: USB

    BD Address: AE:60:58:F1:37 ACL MTU: 310:100 SCO: 64:8

    UP RUNNING PSCAN INQUIRY

    RX bytes: 131433 acl5 sco:10519 errors:0

    TX bytes: 42881 acl5 sco:5081 errors:0

    ```


    Listing 14-1: Scanning for a Bluetooth device


    As you see, my Bluetooth adapter is recognized with a MAC address of 10:AE:60:58:F1:37.
    This adapter has been named hci0.

    The next step is to check that the connection is enabled, which we can also do
    with hcitfig by providing the name and the up command:


    ```

    kali sudo hcitfig hci0 up

    ```


    If the command runs successfully, we should see no output, just a new prompt.

    Good, hci0 is up and ready! Let''s put it to work.


    # Scanning for Bluetooth Devices with hcitool


    Now we know our adapter is up, we can use another tool in the BlueZ suite hcitool,
    which is used to scan for other Bluetooth devices within range.


    Let''s first use the scanning function of this tool to look for Bluetooth devices
    that are sending out their discover beacons, meaning they''re in discovery-mode,
    with the simple scan command in Listing 14-2.


    ```

    kali sudo hcitool scan

    ...

    72:6E:46:65:72:66 ANDROID BT

    22:C5:96:08:5D:32 SCH-1535

    ```


    Listing 14-2: Scanning for Bluetooth devices in discovery mode'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'As the output shows, on my system, hcitool found two devices: ANDROID BT and
    SCI-I535. Yours will likely provide you with different output depending on what
    devices you have around. For testing purposes, try putting your phone or other
    Bluetooth device in discovery mode and see if it gets picked up in the scan.


    Let''s gather more information about the detected devices with the inquiry ing:


    ```

    kali> sudo hcitool inq

    Inquiring...

    24:CS:96:08:50:32  clock offset:0x4e8b  class:0x5a20c

    76:6F:46:65:72:67  clock offset:0x21c0  class:0x5a20c

    ```


    This gives us the addresses of the devices, the clock offset, and the class of
    the devices. The class indicates what type of Bluetooth device you found, and
    you can look up the code and see what type of device it is by going to the Bluetooth
    SIG at https://www.bluetooth.com/specifications/assigned-numbers/


    The hcitool is a powerful command line interface to the Bluetooth stack that can
    do many, many things. Listing 14-3 shows the help page with some of the commands
    you can use. Take a look at the help page yourself to see the full list.


    ```

    kali> sudo hcitool --help

    hcitool HCI Tool for v5.50

    Usage:

    hcitool [options] <command> [command parameters]

    ```


    +   Options:

    --help Display help

    -i dev HCI device


    +   Commands:

    dev Display local devices

    inq Inquire remote devices

    can Scan for remote devices

    name Get name from remote devices

    --sn--


    Listing 14-3: Some hcitool commands


    Many Bluetooth-hacking tools you''ll encounter you can easily create your own
    tool by using these commands in your own bash or Python script—we’ll look at scripting
    in Chapter 17.


    # Scanning for Services with sdptool


    Service Discovery Protocol (SDP) is a Bluetooth protocol for searching for Bluetooth
    services (Bluetooth is a suite of services), and, happily, BlueZ provides the
    sdptool for browsing a device for the services it provides.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'It is also important to note that the device does not have to be in discovery
    mode to be scanned. The syntax is as follows:


    ```

    sudo sdptool browse MACaddress

    ```


    Listing 14-4 shows using sdptool to search for services on one of the devices
    detected earlier in Listing 14-2.


    ```

    kali> sudo sdptool browse 76:E:46:63:72:66

    Browsing 76:E:46:63:72:66...

    Service RecHandle: 0x10002

    Service Class ID List:

    "(0x1800)

    Protocol Descriptor List:

    "L2CAP" (0x0100)

    PSM: 31

    "ATT" (0x0001)

    uint16: 0x0007

    uint16: 0x0005

    ```


    ```

    --snip:-

    ```


    Listing 14-4: Scanning with sdptool


    Here, the output shows that the sdptool was able to pull information on all the
    services this device is capable of using. In particular, we notice that this device
    supports the ATT Protocol, which is the Low Energy Attribute Protocol. It can
    provide us more as to what the device is and potentially avenues to interact with
    it further.


    # Seeing Whether the Devices Are Reachable with l2ping


    Once we''ve gathered the MAC addresses of all nearby devices, we can send pings
    to these devices, whether they''re in discovery mode or not, to see whether they
    are in reach. This lets us know whether they are active and within range. To send
    out a ping, we use the l2ping command with the following syntax:


    ```

    sudo l2ping MACAddress -c NumberOfPackets

    ```


