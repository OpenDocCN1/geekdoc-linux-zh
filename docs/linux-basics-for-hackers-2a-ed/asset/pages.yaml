    # Security Concerns


    The intelligence and spy services of the United States and other nations consider
    the Tor network a threat to national security, believing that such an anonymous
    network enables foreign governments and terrorists to communicate without being
    watched. As a result, a number of robust, ambitious research projects are working
    to break the anonymity of Tor.

    Tor''s anonymity has been broken by these authorities and will likely broken again.
    The NSA, as one instance, runs its own Tor routers meaning that your traffic may
    be traversing the NSA''s routers when you use Tor. If your traffic is exiting
    the NSA''s routers, that''s even worse, because the exit router always knows your
    destination. The NSA also has a method known as *traffic correlation*, which involves
    looking for patterns in incoming and outgoing traffic, that has been able to break
    Tor''s anonymity. These attempts to break Tor''s effectiveness by obscuring your
    identity from commercial services, such as Google, they may limit the browser''s
    effectiveness in keeping you anonymous from spy agencies.


    # Proxy Servers


    Another strategy for achieving anonymity on the internet is to use *proxies*,
    which are intermediate systems that act as middlemen for traffic: the user connects
    to a proxy, and the traffic is given the IP address of the proxy before it''s
    passed on (see Figure 13-4). When the return from the destination, the proxy sends
    the traffic back to the source. In this way, traffic appears to come from the
    proxy and not the originating IP address.'
  merge: -1
  pgno: 180
- img_proc: true
  md: '![](img/7f106d14d88c19c5eac20858e43b615b_181_0.png)


    Of course, the proxy will likely log your traffic, but an investigator would have
    to fetch a subpoena or search warrant (or hack the server, something the NSA is
    known to do) to obtain the logs. make your traffic even harder to trace, you can
    use more than one proxy, in a strategy known as a proxy chain, which we’ll look
    at a little later in this chapter.


    Kali Linux has an excellent proxying tool called proxchains that you can set up
    to obscure your traffic. The syntax for the proxchains command is straightforward,
    as shown here:


    ```

    kali> proxchains <command you want proxied> <arguments>

    ```


    The arguments you provide might include an IP address. For example, if you wanted
    to use proxchains to scan a site with nmap anonymously, you would enter the following:


    ```

    kali> proxchains nmap -sS -Pn <IP address>

    ```


    This would send the nmap -sS stealth scan command to the given address through
    a proxy. The tool then builds the chain of proxies itself, so you don’t have to
    worry about it.


    # Setting Proxies in the Config File


    In this section, we set a proxy for the proxchains command to use. With nearly
    every application in Linux/Unix, configuration of proxchains is managed by the
    config file—specifically `/etc/proxchains4.conf`. Open the config file in your
    text editor of choice with the following command (replacing mousepad with your
    chosen editor if necessary):


    ```

    kali> mousepad /etc/proxchains4.conf

    ```


    You should see a file like the one shown in Listing 13-1.'
