  md: '# 11


    # THE LOGGING SYSTEM


    ![](img/7f106d14d88c19c5eac20858e43b615b_152_0.png)


    For any Linux user, it''s crucial to be knowledgeable in the use of logfiles.
    Logfiles store information about events that occur when the operating system and
    applications are run, including any errors and security alerts. Your system will
    log information automatically based on the series of rules that I will show you
    how to configure in this chapter.


    As a hacker, you should be aware that a system''s logfiles can be a trail to your
    target''s activities and identity, but they can also be a trail to your own activities
    on someone else''s system. A hacker, therefore, needs to know what information
    they can gather, as well as what can be gathered about their own actions and methods
    in order to hide that evidence.'
  merge: -1
  pgno: 152
- img_proc: true
  md: 'On the other side, anyone securing Linux systems needs to know how manage the
    logging functions to determine whether a system has been attacked and then decipher
    what happened and who did it.


    This chapter shows you how to examine and configure logfiles, as well as how to
    remove evidence of your activity and enable disable logging altogether. First,
    we''ll look at the daemon that does logging.


    # # The journalctl Utility


    Since the publication of the first edition of Linux Basics for Hackers, the logging
    system in Linux distributions, including Kali, has changed. Previous versions
    used the syslog daemon (also known as syslogd). The newer Linux use a software
    suite known as systemd, which is intended to standardize how Linux works across
    all distributions of Linux.


    Systemd has a similar control for logging known as journalctl (a journal-space
    is a place where the computer stores activities and events—in other words, a logging
    system). This journalctl utility makes retrieving and viewing much easier.


    One of the differences between the older syslog and journald is that syslog stored
    logs as simple files, while journald stores files as zeros and ones. This means
    that the user (you) has a much easier interpreting the logfiles and searching
    them. Older-style syslog files were notoriously hard to search and interpret.
    System administrators often had to write scripts to search and sort the logs,
    but journalctl can now do these types of tasks automatically. To sum up, journalctl
    will make your life, as new as Linux, much easier.


    Let''s take a look at it. When we enter the command journalctl at the prompt,
    all of the logs are displayed on the screen via the more


    As you can see, journalctl displays all the logs to your screen, which can be
    useful but may be too much for anyone. As we see later in the chapter, we can
    have journalctl display a selected portion of its logs that are of particular
    interest to us.'
  merge: -1
  pgno: 153
- img_proc: true
  md: 'First, though, let''s look at the journalctl help screen:


    kali `journalctl -h`


    `journalctl [OPTIONS...] [MATCHES...]`


    # Query the journal.


    Source Options:


    +   -system Show the system journal

    -user Show the user journal for the current user

    -M --machine=CONTAINER Operate on local container

    -m merge Show entries from all available journals

    -D --directory=PATH Show journal files from directory

    --file=PATH Show journal file

    --root=PATH Force operate on an alternate filesystem root

    --image=PATH Show entries on disk image as filesystem root

    --image-policy=POLICY Specify disk image policy

    --namespace=NAMESPACE Show journal data from specified namespace


    Filtering Options:


    +   -S --since=DATE Show entries not older than the specified date

    -U --until=DATE Show entries not newer than the specified date

    -c --cursor=CURSOR Show entries starting at the specified cursor

    --after-cursor=CURSOR Show entries after the specified cursor

    --cursor-file=FILE Show entries after cursor in FILE and update FILE

    -b --boot=[ID] Show current boot or the specified boot

    -u --unit=UNIT Show logs from the specified unit

    --user=UNIT Show logs from the specified user unit

    -t --identifier=STRING Show entries with the specified syslog identifier

    -p --priority=RANGE Show entries with the specified priority

    --facility=FACILITY... Show entries with the specified facilities

    -g --grep=PATTERN Show entries with MESSAGE matching PATTERN

    --case-sensitive=[BOOL] Force case sensitive insensitive matching

    -k --dmesg Show kernel message log from the current boot


    Note journalctl has options for (-user), date (--since=DATE), priority (-p), and
    facility (-facility).


    # Log Priorities and Facilities


    Logging and Facilities reflect the different priorities and facilities of the
    operating system and the system administrator. Some logs are very important and
    are given a priority of 0 for emerg(ency), while others are less important and
    are given priorities of 6 (info) or 7 (debug). The system administrator can determine
    which logs have which priority. In addition, the system administrator can select
    which priority logs they want to view.'
