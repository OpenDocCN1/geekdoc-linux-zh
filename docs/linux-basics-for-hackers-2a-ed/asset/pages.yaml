  md: '# # 13


    # ## BECOMING SECURE AND ANONYMOUS


    ![](img/7f106d14d88c19c5eac20858e43b615b_176_0.png)


    Today, nearly everything we do on the internet is tracked. Whoever is doing the
    tracking—whether it be Google tracking our online searches, website visits, and
    email or the National Security Agency (NSA) cataloging all our activities—our
    every online move is being recorded, indexed, and then mined for someone’s benefit.
    The average individual—and the hacker, in particular—needs to understand how to
    limit this tracking and remain relatively anonymous on the web to limit this ubiquitous
    surveillance.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'In this chapter, we look at how you can navigate the World Wide Web anonymously
    (or as close as you can get) using four methods:


    +   - The Onion Network

    - Proxy servers

    - Private encrypted email


    No method is sure to keep your activities safe from prying eyes, and given enough
    time and resources, anything can be tracked. However, these methods will likely
    make the tracker''s job much more difficult.


    # How the Internet Gives Us Away


    To begin, let''s discuss at a high level some of the ways our activities on the
    internet are ranked. We won''t go into all tracking methods or into much detail
    about any method, as would be beyond the scope of this book. Indeed, such a discussion
    could take up an entire book on its own.


    First, your IP address identifies you as you traverse the internet. Data sent
    from your machine is generally tagged with your IP address, making your activities
    easy to track. Second, Google and other email services will “read” your email,
    looking for keywords to more efficiently serve you. Although there are many more
    sophisticated methods that are far more time and resource intensive (cookie tracking,
    user-agent, and so on), these are the ones we try to prevent in this chapter.
    Let''s start by taking a look at how IP addresses give us away on the internet.


    When you send a packet of data across the internet, it contains the IP addresses
    of the source and destination for the data. In this way, the packet knows where
    it is going and where to return the response. Each packet hops through multiple
    routers until it finds its destination and then hops back to the sender. For internet
    surfing, each hop can be as many as 20 to 30 hops between the sender, and usually
    any packet will find its way to the destination in less than 15 hops.


    As the packet traverses the internet, anyone intercepting the packet can see who
    sent it, where it has been, and where it''s going. This is one way websites can
    tell who you are when you arrive and log you in automatically, and also how someone
    can track where you''ve been.


    To see what a packet might make between you and the destination, you can use the
    traceroute command, and the command will send out packets to the destination and
    trace the route of those packets:'
  merge: -1
  pgno: 177
- img_proc: true
  md: '```

    kali> traceroute google.com

    taceroute to google.com (172.217.1.78), 30 hops, 60 bytes packets

    1  192.168.1.1 (192.168.1.1)  4.152 ms  3.834 ms  32.964 ms

    2  10.0.0.1 (10.0.0.1)  5.797 ms  6.995 ms  7.679 ms

    3  96.120.96.45 (96.120.96.45)  27.952 ms  30.377 ms  32.964 ms

    --  18gal15s4-in14.le100.net (172.217.1.78)  94.666 ms  42.990 ms  41.564 ms

    ```


    As the output shows, www.google.com is 18 hops across the internet. Your results
    will likely be different because your request would be coming from a different
    location and because Google has many servers across the globe. In addition, packets
    don''t always take the same route across the internet, so you might send another
    packet from your address to the same site and receive a different route. Let''s
    see how we can disguise all this with the Tor network.


    # # The Onion Router System


    In the 1990s, the US Office of Naval Research (ONR) set out to develop a method
    for anonymously navigating the internet for espionage purposes. The plan was to
    set up a network of routers that was separate from the internet''s routers, which
    could encrypt the traffic, and stored only the unencrypted IP of previous router—meaning
    all other router addresses along the way were encrypted. The idea was that anyone
    watching the traffic could not determine the origin or destination of the data.
    This research known as “The Onion Router (Tor) Project” in 2002, and it is now
    available to use for relatively safe and anonymous navigation on the web.


    # # How Tor Works


    Packets sent over Tor are not sent over the regular routers that are closely monitored
    by some, but rather they are sent over a network of more than 7,000 routers around
    the world—thanks to volunteers who allow Tor to use their computers. On top of
    using a separate router network, Tor encrypts the data, destination, and sender
    IP address of each packet. At each hop, the information is encrypted and then
    decrypted by the hop when it’s received. In this way, each packet contains information
    about only the previous hop along the path and not the IP address of the origin.
    If someone intercepts the traffic, they can see only the IP address of the previous
    hop, and the website owner can see only the IP address of the last router that
    sent the traffic (see Figure 13-1). This ensures anonymity across the internet.'
  merge: -1
  pgno: 178
- img_proc: true
  md: '![](img/7f106d14d88c19c5eac20858e43b615b_179_0.png)


    +   + Tor node

    ---> Encrypted path

    ---> Clear path


    Figure 13-1: How Tor uses encrypted traffic data


    To enable the use of Tor, just install the Tor browser from https://www.torproject.org.
    Once installed, it will look something like Figure 13-2, and you can use it like
    any old internet browser. By using this browser, you''ll be navigating the internet
    through a separate set of routers and will be able to visit sites without being
    tracked by Big Brother. Unfortunately, the trade-off is surfing with the Tor browser
    can be a slower; because there are not nearly many routers, the bandwidth is limited
    in the network.


    ![](img/7f106d14d88c19c5eac20858e43b615b_179_1.png)


    Figure 13-2: The landing page for the Tor browser


    In addition to being capable of accessing nearly any website on the traditional
    internet, the Tor browser is capable of accessing the dark web. The websites that
    make the dark web require anonymity, so they allow access only through the Tor
    browser, and they have addresses ending in .onion for their top-level domain.
    The dark web is infamous for illegal activity, but a number of legitimate services
    are also available there. A word of caution, however: when accessing the dark
    web, you may come across material that many find will offensive.


    140 Chapter 13'
