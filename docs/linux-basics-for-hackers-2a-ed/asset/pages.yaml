  md: '# 12


    # USING AND ABUSING SERVICES


    ![](img/7f106d14d88c19c5eac20858e43b615b_162_0.png)


    In Linux terminology, a service is an application that runs in the background
    waiting for you to use it. Your Linux system has dozens of services preinstalled.
    Of these, the most well known is the ubiquitous Apache HTTP server, which is used
    for creating, managing, and deploying web servers, but there are so many more.
    For the purposes of this chapter on services, I have selected just three that
    are of particular importance to the hacker: Apache, OpenSSH, MySQL/MariaDB, and
    PostgreSQL.


    In this chapter, you''ll learn how to set up a web server with Apache, physically
    spy with OpenSSH, and access data with MySQL/MariaDB.'
  merge: -1
