    network. The MAC address 00:25:9C:97:4F:48 is, as you might, the MAC of the API
    I am connected to. What type of security a Wi-Fi network uses, whether it is running
    at 2.4 GHz or 5 GHz, what its ESSID is, and what the AP''s MAC address is all
    critical pieces of information that are necessary for Wi-Fi hacking. Now that
    you know the basic commands, let''s get into some hacking.


    # Wi-Fi Recon with aircrack-ng


    One of the most popular exploits for new hackers is cracking Wi-Fi access points.
    As mentioned, before you can even consider attacking a Wi-Fi AP, you need the
    MAC address of the target AP (BSSID), the MAC address of a client, and the channel
    on which the AP is operating.


    We can get all information and using more tools from the aircrack-ng suite. I''ve
    mentioned this suite of Wi-Fi hacking tools a few times before, and now it''s
    time to actually use it. This suite of tools is included in every version of Kali,
    so you don''t need to download or install anything.


    To use these tools effectively, you need to put your wireless network card into
    monitor mode so that the card can see all the traffic passing its way. Normally,
    a network card captures only traffic specifically for that card. Monitor mode
    is similar to promiscuous mode on wired networks.'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'To put your wireless network card in monitor mode, use the airmon-ng command
    from the aircrack-ng suite. The syntax for this command is simple:


    ```

    sudo airmon-ng start|stop|check interface

    ```


    So, if you want to put your wireless network card, which is designated wlan0,
    into monitor mode, you would enter the following:


    ```

    kali > sudo airmon-ng start wlan0

    ```


    Found three processes that could cause trouble

    If airdump-ng, replay-ng, or airturn-ng stops after a short period of time, you
    may want to run ''airmon-ng check kill''

    --snip--


    | PHY | INTERFACE | DRIVER | Chipset |

    |---|---|---|--|

    | phy0 | | rt81187 | Realtek Semiconductor Corp RTL8187 |


    (mac8311 monitor mode vif enabled for [phy0]wlan0 on [phy0]wlan0)

    --snip--


    The stop and check commands, respectively, stop monitor mode and check for problems
    in monitor mode if you run into it.

    With your wireless card in monitor mode, you can access all the wireless traffic
    passing within the range of your wireless network adapter and antenna (standard
    is about 300 to 500 feet). Note that airmon-ng will rename your wireless interface:
    mine has been renamed wlan0, yours may be different. Make certain to note the
    new designated name of your wireless interface because you''ll need that information
    in the next step.


    Now we''ll use another tool from the aircrack-ng suite to find key data from the
    wireless traffic. The airdump-ng command captures and displays the key data from
    broadcasting APs and any clients connected to those APs or within the vicinity.
    The syntax is straightforward: simply plug in airodump-ng, followed by the interface
    name you get from running airmon-ng just now:


    ```

    kali> sudo airdump-ng wlan0

    ```


    ```

    CH 9[ Elapsed: 28 s ][ 2025-02-08 10:27

    ```


    | BSSID | PWR | Beacons | #Data #s | CH | ENC | CIPHER | AUTH | ESSID |

    |---|---|---|---|---|---|---|---|--|

    |01:01:AA:BB:CC:22 | -1 | 4 | 26 | 0 | 10 | WPA2 | CCMP | PSK | Hacker-Arises


    --snip--


    | BSSID | Station | Pwr | Rate | Lost | Frames | Probe |

    |---|---|---|---|---|---|--|

    |(not associated) | 01:02:CC:DD:03:CF | 01:01:AA:BB:CC:22 | A:03:E2:44:7C:E5 |
    | |'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'When you issue this command, your wireless card will pick up crucial information
    (listed next) from all the wireless traffic of the APs nearby:


    +   **BSSID** The MAC address of the AP or client

    **PWR** The strength of the signal

    **ENC** The encryption used to secure the transmission

    **Data** The data throughput rate

    **CH** The channel on which the AP is operating

    **ESSID** The name of the AP


    Note that airdump-ng splits the screen into an upper and lower portion. The upper
    portion has information on the broadcasting APs, including the BSSID, the power
    of the AP, how many frames have been detected, the data throughput rate, how many
    packets have traversed the wireless card, the channel (1 to 14), the theoretical
    limit, the encryption protocol, the cipher used for encryption, the authentication
    type, and the ESSID (commonly referred to as SSID). In the client portion, the
    output tells us that client is not associated, meaning it has detected but not
    connected to any AP, and that another is associated with a station, meaning it''s
    connected to the AP at that address.


    Now you have all the information you need to crack the AP! Although it''s the
    scope of this book, to crack the wireless AP, you need the client MAC address,
    the AP MAC address, the channel on which the target is operating, and a password
    list.


    To crack the Wi-Fi password, you would open three terminals. In the first terminal,
    you would enter commands similar to the following, in the client and AP MAC addresses
    and the channel:


    ```

    sudo airdump-ng -c 10 --ssid 01:01:AA:BB:CC:22 -w Hacker-ArisePSK wlan0mon

    ```


    This command captures all the packets traversing the AP on channel 10 using the
    -c option.


    In another terminal, you can use the airplay-ng command to kick off (deauthenticate)
    anyone connected to the AP and force them to reauthenticate to the AP, as shown
    next. When they reauthenticate, you can capture the hash of their password that
    is exchanged in the WPA2-PSK four-way handshake. The password hash will appear
    in the upper-right corner of the airdump-ng terminal.


    ```

    sudo airplay-ng --auth 10 -a 01:02:CC:DD:03:CF -c 00:A3:E2:44:7C:E5 wlan0mon

    ```


    Finally, in the final terminal, enter to the following:


    ```

    sudo aircrack-ng -w wordlist.dic -b 01:01:AA:BB:CC:22 Hacker-ArisePSK.cap

    ```


    You can use a password list (wordlist.dic) to find the password in the captured
    hash (Hacker-ArisePSK.cap).'
  merge: -1
