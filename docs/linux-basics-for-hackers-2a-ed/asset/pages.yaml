  md: '# Extracting Information from MySQL/MariaDB


    MySQL is the most widely used database behind database-driven applications. In
    our modern era of web technologies, where nearly every website is database-driven,
    means this MySQL or another open source database called MariaDB holds the data
    for most of the web.


    Databases are the "golden fleece" for hackers. They contain critical information
    about users as well as confidential information such as credit numbers. For this
    reason, hackers are most often targeting databases.


    Like Linux, MySQL and MariaDB are open source and licensed under GPL (Gnu General
    Public License), and you''ll find at least one of them pretrained on nearly every
    Linux distribution.


    Being free, open source, and powerful, MySQL and MariaDB have become the databases
    of choice for many web applications, including popular websites such as WordPress,
    Facebook, LinkedIn, X (formerly Twitter), Kayak, Walmart.com, and YouTube. Other
    content management systems (CMSs) use Joomla, Drupal, and Ruby on Rails all use
    MySQL, too. You get the idea. If you want to develop or attack the backends of
    web applications, you should know a little MySQL.


    In the following sections, I''ll assume you''re working from MySQL, though the
    commands will work for either MariaDB or MySQL; the output will be a little different.
    Let''s get started.


    # PAST AND FUTURE OF MYSQL


    MySQL was first developed by MySQL AB of Sweden in 1995 and was purchased by Sun
    Microsystems in 2008, which in turn was purchased by Oracle in 2009, so MySQL
    is now owned by Oracle. Oracle is the world''s largest database software publisher,
    so the open source community has significant trepidations about Oracle''s commitment
    to keeping MySQL open source. As a result, there is now a fork of the MySQL database
    software called "Maria" that is committed to keeping this software and its subsequent
    versions open source. As a Linux admin or hacker, you should keep an eye on Maria.


    # Starting MySQL or MariaDB


    Fortunately, Kali has either MySQL or MariaDB already installed (if you''re using
    another distribution, you can download and install MySQL from the software repository
    or directly from https://www.mysql.com/downloads/).


    To start your MySQL or MariaDB service, enter the following into terminal:


    ```

    kali> systemctl start mysql

    ```


    Next, you need to authenticate yourself by logging in. Enter the following, and
    when prompted for a password, just press ENTER:'
  merge: -1
  pgno: 169
