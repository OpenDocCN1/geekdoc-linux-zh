  md: '# Modules


    A module is simply a section of code saved into a separate file so you can use
    it many times as you need in your program without having to type it all again.
    If you want to use a module or any code from a module, you need to import it.
    As discussed earlier, using standard and third-party modules is one of the key
    features that makes Python so powerful for the hacker. If we wanted to use the
    nmap module we installed earlier, we would add the following line to our script:


    ```

    import nmap

    ```


    Later in this chapter, we will use two very useful modules: socket and ftplib.


    # Object-Oriented Programming (OOP)


    Before we delve deeper into Python, it''s probably worth taking a few to discuss
    the concept of object-oriented programming (OOP). Python, like many programming
    languages today (C++, Java, and Ruby, to name a few) adheres to the OOP model.


    Figure 17-1 shows the basic concept behind OOP: the language''s main tool is the
    object, which has properties in the form of attributes and states, as well as
    methods that are actions performed or on the object.


    | Property | Method |

    | --- | --- |

    | Attribute or state | Function or procedure |


    Figure 17-1: Illustration of object-oriented programming


    The idea behind OOP-based programming languages is to create objects that act
    like things in the real world. For example, a car is an object that has properties,
    such as its wheels, color, size, and engine type; it also has methods, which are
    the actions the car takes, as accelerating and locking the doors. From the perspective
    of natural human language, an object is a noun, a property is an adjective, and
    a method is generally a verb.


    Objects are members of a class, which is basically a template for creating objects
    with shared initial variables, properties, and methods. For instance, say we had
    a class called cars; our car (a BMW) would be a member of the class of cars. This
    class would also include other objects/cars, such as Mercedes and Audi, as shown
    in Figure 17-2.'
