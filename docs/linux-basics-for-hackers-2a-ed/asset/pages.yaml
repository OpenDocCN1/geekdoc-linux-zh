  md: 'When you enter this command, you should see a short description of the tool
    and guidance on how to use it. In some cases, you can use either -h or ? to get
    the help file. For instance, if I need help using the hacker''s best port-scanning
    tool, nmap, I would enter the following:


    ```

    kali> nmap

    ```


    Unfortunately, although many applications support all three options (--help, -h,
