- img_proc: true
  md: 'Here is a list of the logging system priorities:


    +   - emerg (0)

    - alert (1)

    - crit (2)

    - err (3)

    - warning (4)

    - notice (5)

    - info (6)

    - debug (7)


    To view the highest-priority logfiles, we can construct a journalctl query using
    the -p option, as such:


    ```

    kali> journalctl -p "emerg"


    Jun 30 22:59:13 kali kernel: watchdog: BUG: soft lockup CPU# stuck for 23s! [swapper:0:0]

    Jul 01 03:28:06 kali kernel: watchdog: BUG: soft lockup CPU# stuck for 24s! [swapper:0:0]

    Jul 02 10:10:26 kali kernel: watchdog: BUG: soft lockup CPU# stuck for [swapper:0:0]

    --snap--

    ```


    Notice that we can also use the priority number as 6 (info):


    ```

    kali> journalctl -p 6

    ```


    The journalctl utility enables us to view the logs of a specific service using
    the -u option. To view the logs associated with the apache2 web server, we can
    construct a query as such:


    ```

    kali> journalctl -u apache2


    May 28 14:25:48 kali systemd[1]: Starting apache2.service - The Apache HTTP Server...

    May 28 14:25:48 kali apachectl[118241]: apache2:AH0058: Could not reliably determine...

    May 28 14:25:48 kali systemd[1]: Started apache2.service - The Apache HTTP Server.

    May 29 00:00:31 kali systemd[1]: Reloading apache2.service - The Apache HTTP Server...

    --snap--

    ```


    This query can be used to find the logs of any service in Linux by appending the
    -u option followed by the name of the service.


    # journalctl Queries


    One of the major advantages of journalctl is the ability to view the logs specifically
    for events, users, and time, as journalctl has a query language that is very similar
    to normal human language. For instance, if I wanted to see only the events in
    the last 24 hours, I can query:


    ```

    kali> journalctl -q --since "24 hours ago"

    ```'
