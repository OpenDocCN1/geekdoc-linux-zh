- img_proc: true
  md: '![](img/7f106d14d88c19c5eac20858e43b615b_188_0.png)


    ProtonMail was founded by a group of young scientists at the CERN supercollider
    facility in Switzerland. The Swiss have long and storied history of protecting
    secrets (remember those Swiss bank accounts you heard so about?), and ProtonMail''s
    servers are based in the European Union, which has much stricter laws regarding
    the sharing of personal data than does the United States. ProtonMail does not
    charge for a basic account but offers premium accounts for a nominal fee. It is
    important to note that when exchanging email with non-ProtonMail users, there
    is the potential for some or all of the email not to be encrypted. See the ProtonMail
    support knowledge base for full details.


    # Summary


    We are constantly being surveilled by commercial firms and national intelligence
    agencies. To keep your data and web travels secure, you need to implement at least
    one of the security measures discussed in this chapter. By employing them in combination,
    you can minimize your footprint on the web and keep your data much secure.'
