  md: '# 4


    # # ADDING AND REMOVING

    SOFTWARE


    ![](img/7f106d14d88c19c5eac20858e43b615b_78_0.png)


    One of the most fundamental tasks in Linux—or any operating system—is adding and
    removing software. You’ll often need to install software that didn’t come with
    your distribution or remove unwanted software so it doesn’t take up hard drive
    space.


    Some software requires other software to run, and you’ll sometimes find that you
    can download everything you need at once in a software package, which is a group
    of files—typically libraries and other dependencies—that you need a piece of software
    to run successfully. When you install a package, all the files within it are installed
    together, along with a script to make loading the software simpler.


    In this chapter, we examine three key methods for adding new software using the
    apt package manager, GUI-based installation managers, and git.'
  merge: -1
