    option doesn''t work, try another.


    # Referencing Manual Pages with man


    In addition to the help switch, most commands and applications have a manual (man)
    page with more information, such as a description and synopsis of the command
    or application. You can view a man page by simply typing before the command, utility,
    or application. To see the man page for aircrack-ng, for example, you would enter
    the following:


    ```

    kali> man aircrack-ng

    ```


    ```

    NAME

    aircrack-ng -a 802.11 WEP / WPA-PSK key cracker

    SYNOPSIS

    aircrack-ng [options] <.cap /.ivs file(s)

    ```


    ```

    DESCRIPTION

    aircrack-ng is an 802.11 WEP and WPA/WPA2 cracking program. It can recover the
    WEP key only once encrypted packets have been captured with airdump-ng. This part
    of the aircrack-ng suite determines the WEP key using two fundamental methods.
    The first method is via the PTW approach (Pyshkin, Tews, Weinmann). The main advantage
    of the PTW approach is that very few data packets are required to crack the WEP
    key. The second method is the FMS/KoreK method. The FMS/KoreK method incorporates
    various statistical attacks to discover the WEP key and uses these in combination
    with brute force. Additionally, the program offers a dictionary method for determining
    the WEP key. For cracking WPA/WPA2 shared keys, a wordlist (for strdin) or an
    arolist-ng has to be used.

    ```


    This opens the manual for aircrack-ng, providing you with more detailed information
    than the help screen. You can scroll through this manual file using the ENTER
    keys, or you can page up and down using the PAGE DOWN and PAGE UP keys, respectively;
    you can also use the arrow keys. To exit, simply enter q (for quit), and you''ll
    return to the command prompt.


