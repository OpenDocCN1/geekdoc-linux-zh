    ```


    # Using rc Scripts to Run Jobs at Startup


    Whenever you start Linux system, a number of scripts are run to set up the environment
    for you. These are known as the rc scripts. After the kernel has initialized and
    loaded all its modules, the kernel starts a daemon known as init or itd. This
    daemon begins to run a number of scripts found in /etc/init.d/rc. These scripts
    include commands for starting many of the services necessary to run your Linux
    system as you expect.'
