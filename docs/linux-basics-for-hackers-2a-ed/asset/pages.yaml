    As you saw in Chapter 1, the Linux filesystem is structured significantly differently
    than Windows and other proprietary operating systems. On top of this, the files
    are stored and managed in Linux. New versions of Windows use an NTFS filesystem,
    whereas older Windows systems use File Allocation Table (FAT) systems. Linux uses
    a number of different types of filesystems, but the most common are ext2, ext3,
