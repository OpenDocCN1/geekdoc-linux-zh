    # Changing Your Network Information


    Being able to change your IP address and other network information is a useful
    skill because it will help you access other networks while appearing to be a trusted
    device on those networks. For example, in a denial-of-service (DoS) attack, you
    can spoof your IP address so that the attack appears to come from another source,
    which will cover your tracks during forensic analysis. This is a relatively simple
    task in Linux, and it''s done with ifconfig command.


    # Assigning a New IP Address


    To change your IP address, enter ifconfig followed by the interface you want to
    reassign and the new IP address assigned to that interface. For example, to assign
    the IP address 192.168.181.115 to interface eth0, you would enter the following:


    ```

    kali> sudo ifconfig eth0 192.168.181.115

    kali>

    ```


    Note that you preface this command with sudo, as it requires root privileges.
    When you do this, Linux will simply return the prompt and saying nothing. This
    is a good thing!


    When you check your network connections with ifconfig, you should see that your
    IP address has changed to the new IP address you just assigned.


    # Changing Your Network Mask and Broadcast Address


    You can also change your network mask (netmask) and broadcast address with the
    ifconfig command. For instance, if you want to assign that same eth0 interface
    with a netmask of 255.255.0.0 and a broadcast address of 192.168.1.255, you would
    enter the following:


    ```

    kali> sudo ifconfig eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255

    kali>

    ```'
