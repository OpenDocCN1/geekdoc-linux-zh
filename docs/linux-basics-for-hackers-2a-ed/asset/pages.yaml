- img_proc: true
  md: 'We can then decompress that same file using the gzip command, short for GNU
    unzip:


    ```

    kali> gunzip HackersArise.*

    ```


    Once uncompressed, the file is no longer saved with the .tar.gz extension but
    with the .tar extension instead. Also, notice that it has returned to its original
    size of 40,960 bytes. Try doing a list to confirm this. It''s worth noting that
    gzip can also be used to extract .zip files.


    # Compressing with bzip2


    Another of the widely used compression utilities in Linux is bzip2, which works
    similarly to gzip but has better compression ratios, meaning that the result will
    be even smaller. You can compress your HackersArise.tar file by entering the following:


    ```

    kali> bzip2 HackersArise.*

    ```


    When you do a long listing, you can see that bzip2 has compressed the file down
    to 2,081 bytes! Also note that the file extension is now .tar.bz. To decompress
    the compressed file, use bunzip2, like so:


    ```

    kali> bunzip2 HackersArise.*

    ```


    When you do, the file returns to its original size, and its file extension returns
    to .tar.


    # Compressing with compress


    Finally, you can use the compress command to compress the file. This is probably
    the least commonly used compression utility, but it''s easy to remember: To use,
    simply enter the compress command followed by the filename, like so:


    ```

    kali> compress HackersArise.*

    ls -l

    --rw-rw-r-- 1 kali 5476 Nov 27 2024 13:32 HackersArise.tar.Z

    ```


    Note that the compress utility reduced the size of the file to 5,476, twice the
    size of bzip2. Also note that the file extension is now .tar.Z (with an uppercase
    Z).


    To decompress the same file, use uncompress:


    ```

    kali> uncompress HackersArise.*

    ```


    You can also use the gzip command with files that have been compressed with compress.'
