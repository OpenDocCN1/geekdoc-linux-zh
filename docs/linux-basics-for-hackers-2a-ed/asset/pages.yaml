    # Installing Kali Through the Windows Subsystem for Linux


    For those looking for a less intrusive method of running Linux, Microsoft offers
    the Windows Subsystem for Linux (WSL). Using it, you can learn the Linux operating
    system without the hassle of installing a VM. The drawback is that not all networking
    (and, therefore, hacking) capabilities are enabled. This means that you can learn
    Linux but not study hacking with this subsystem. That said, here''s how to install
    this WSL on your Windows operating system.


    The first step is to enable WSL. Open PowerShell at the command prompt or running
    PowerShell in your application menu. Then enter the following at PowerShell prompt:


    ```

    >Enable_windowsOptionalFeature -Online -FeatureName Microsoft-Subsystem-Linux

    Do you want to restart the computer to complete this operation now?

    [Y] [N] [?] (default is Y)?

    ```


    As you can see, PowerShell will then ask you whether you want to restart your
    system to enable WSL. Press ENTER.


    Now that you have enabled this feature and restarted your system, Go to the Windows
    Application store (https://apps.microsoft.com/store/apps). There you will see
    icons for many Linux distributions. Click Kali Linux, then select Get.


    Kali will begin to download. This is a stripped-down, essentials-only version
    of Kali, so the download will be quick. Once it''s complete, you will be prompted
    for a username and password.'
