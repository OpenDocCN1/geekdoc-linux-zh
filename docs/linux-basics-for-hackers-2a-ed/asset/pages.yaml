  md: '# Setting Up the Raspberry Pi


    Make certain that your Raspberry Pi is running the Raspberry Pi OS; this is simply
    another Linux distribution specifically ported for the Raspberry Pi CPU. You can
    download and installation instructions for Raspberry Pi OS at https://www.raspberrypi.com/software/operating-systems/.
    Nearly everything you''ve learned in this book applies to the Raspberry Pi OS
    on the Raspberry Pi as well as Kali, Ubuntu, and other Linux distributions.


    Once you have your Raspberry Pi OS downloaded and installed, you''ll need to connect
    your Raspberry Pi to a monitor, mouse, keyboard and then connect it to the internet.
    If this is all new to you, check the instructions at https://www.raspberrypi.com/documentation/accessories/keyboard-and-mouse.html.
    With everything set up, you can log in with the username and password raspberrypi,
    or create your own username and password on later versions of Raspberry Pi (see
    https://www.raspberrypi.com/documentation/computers/getting-started.html for details).


    # Building the Raspberry Spy Pi


    The first step is to make certain that SSH is running and enabled on the Raspberry
    Spy Pi. SSH is usually off by default, so check the documentation for version
    details on how to enable it.


    When SSH is enabled, you can start it on your Raspberry Spy Pi by opening a terminal
    and entering the following:


    ```

    pi> sudo systemctl ssh start

    ```


    Next you need to attach your camera module. If you''re using a Raspberry Pi version
    3 board, there''s only one place to connect it. Switch the Pi off, attach the
    module to the camera port, and then switch it on again. Note that the camera is
    very fragile and must never come into contact with the general-purpose input/output
    (GPIO) pins; otherwise, it might short and die. (Other boards will be different;
    check the documentation.)


    Now, with the SSH service up and running, the Raspberry Spy Pi somewhere within
    your home, school, or some other location you want to spy on. It must, of course,
    be connected to the local area network, either by Ethernet cable or, ideally,
    via Wi-Fi.


    Now you need to obtain the IP address of your Raspberry Pi. As you learned in
    Chapter 3, you can get a Linux device''s IP address by using ifconfig


    ```

    pi> ifconfig

    ```


    The IP address of your Pi is 192.168.1.101, but make certain you are using the
    IP address of your Raspberry Spy Pi wherever it appears in this chapter. Now,
    from your Kali system, you should be able to connect directly and control your
    Raspberry Spy Pi and use it as a remote spying system. In this simple example,
    your system will need to be on the same network as the Pi.'
