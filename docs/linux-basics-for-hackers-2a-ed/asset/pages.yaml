    # Scheduling a Backup Task


    Let''s view this utility from the system administrator''s perspective. As a system
    administrator, you''d often want to run backups of all your files after hours,
    while the system is not being used and resources are readily available. (System
    backups tend to require resources that are in short demand during business hours.)
    The ideal time would be in the middle of the weekend. Rather than having to log
    in at 2:00 AM on Saturday/night/Sunday morning (I''m sure you have other priorities
    at that time), you could schedule the backup to start automatically at that time,
    even though you''re not at your computer.


    Note that the field uses a 24-hour clock rather than using AM and PM, so 1:00
    PM is, for example, 13:00. Also, note that the days of the week (DOW) start with
    Sunday (0) and end with Saturday (6).


    To create a job


    ```

    00 2 * * 0 backup /bin/systembackup.sh

    ```


    Note that the wildcard is used to indicate "any," and using it in place of a digit
    for the day of the month, month, or day of the week is read as "all" days or months.
    If you read this across this line, it says:


    +   1. At the top of the hour (00),

    2. Of the second hour (2),

    3. Of any day of the month (*),

    4. Of any month (*),

    5. On Sunday (0),

    6. As the backup user,

    7. Execute the script at /bin/systembackup.sh.


    The cron daemon will execute that script every Sunday morning at 2:00 AM, every
    month.'
  merge: -1
  pgno: 213
- img_proc: true
  md: 'If you only wanted the backup to run on the 15th and 30th of every month, regardless
    of what days of the week those dates fell on, you could revise the entry in `crontab`
    to appear as follows:


    ```

    00 15,30 * * * /root/system.sh

    ```


    Note that the day of the month (DOM) field now has 15,30. This tells the system
    to run the script only on the 15th and 30th of every month, so around every two
    weeks. When you want to specify multiple days, hours, or months, you need to list
    them separated by comma, as we did here.

    Next, let''s assume the company requires you to be especially vigilant with its
    backups. It can''t afford to lose even a day of data in the event of a power outage
    or system crash. You would then need to back up the data weekly by adding the
    following line:


    ```

    00 23 * * 1-5 backup /root/system.sh

    ```


    This job would run at 11:00 PM (hour 23), every day of the month, but only on
    Monday through Friday (days 1-5). Especially note that we designated the days
    Monday through Friday by providing an interval of days (1-5) designated by a dash
    (-). This could also have been designated as 1,2,3,4,5; either ways work perfectly.


    # Using crontab to Schedule Your MySQLscanner


    Now that you understand the basics of scheduling a job with the crontab command,
    let''s execute the MySQLscanner.sh script, which seeks out MySQL ports, that you
    find in Chapter 8. This scanner searches for systems running MySQLscanner.sh by
    looking for open port 3306.

    To enter your MySQLscanner.sh to the crontab file, edit the file to provide the
    particulars of this job, just as we did with the system backups. We''ll schedule
    it to run during the day while you''re at work or using your home system. To do
    this, enter the following line in your crontab:


    ```

    00 9 * * * user /usr/share/MySQLscanner.sh

    ```


    We''ve set up the job to run at 0 minutes, at the ninth hour, every day of the
