  md: '# ASPIRING HACKER?

    START HERE.


    If you''re just getting started along the exciting path of hacking, cybersecurity,
    and pentesting, Linux Basics for Hackers is an excellent introduction. With Kali
    Linux, an operating system designed for digital forensics and penetration testing,
    you''ll learn the basics of using Linux and acquire the tools and techniques you''ll
    need to take control of a Linux environment.


    +   - Write a bash script to find potential attack targets over a range of IP
    addresses

    - Use and abuse services like MySQL, the Apache web server, and OpenSSH

    - Build your own hacking tools, such as remote spy cameras and password crackers


    First, you''ll learn to install Kali on a virtual machine and get an introduction
    to basic Linux concepts. Next, you''ll tackle broader Linux topics like manipulating
    text, controlling file and directory permissions, and managing user environment
    variables. You''ll focus on foundational hacking concepts like security and anonymity
    and learn scripting skills with bash and Python.


    > New to this edition: this second edition has been updated to address recent
    changes to Kali and Linux, including a more secure approach to root privileges,
    updates to Bluetooth and Linux logging functions, and a new chapter with advice
    on cybersecurity.


    Practical tutorials and exercises throughout will reinforce and test your skills
    as you learn how to:


    +   - Cover your tracks by changing your network information and manipulating
    the journalctl utility

    - Write a tool to scan for network connections, and connect and listen to wireless
    networks

    - Keep your internet activity stealthy using Tor, proxy servers, VPNs, and encrypted
    email


    Hacking is complex, and there is no single way in. Why not start at the beginning
    with Linux Basics for Hackers?


    # ABOUT THE AUTHOR


    OccupyTheWeb is an infose consultant, forensic investigator, and trainer with
    more than 20 years in the industry. He maintains the Hackers A rising site (hackers-aise.com)
    and trains US military personnel, Department of Defense contractors, and employees
    in information security and hacking.


    # Covers Kali Linux and Python 3.x'
