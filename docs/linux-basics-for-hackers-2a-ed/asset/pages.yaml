- img_proc: true
  md: '# 8


    # BASH SCRIPTING


    ![](img/7f106d14d88c19c5eac20858e43b615b_120_0.png)


    Any self-respecting hacker must be able to write scripts. For that matter, any
    self-respecting Linux administrator must be able to script. Hackers often need
    to automate commands, sometimes from multiple tools, and this is most efficiently
    done through short programs they write themselves.


    In this chapter, we build a few bash shell scripts to start you off with scripting.
    We''ll add capabilities and features as we progress, eventually building a script
    capable of finding potential attack targets over a range of IP addresses.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'To become an elite hacker, you also need the ability to script in one of the
    widely used scripting languages, such as Ruby (Metasploit exploits are written
    in Ruby), Python (many hacking tools are Python scripts), or Perl (Perl is the
    best text-manuscripting language). I give a brief introduction to Python scripting
    in Chapter 17.


    # A Crash Course in Bash


    A shell is an interface between the user and the operating system that enables
    you to manipulate files and run commands, utilities, programs, and much more.
    The advantage of a shell is that you perform these tasks immediately from the
    computer and not through an abstraction, like a GUI, which allows you to customize
    your task to your needs. As mentioned in Chapter 7, a number of different shells
    are available for Linux, including the Korn shell, the Z shell, and the Bourne-again
    shell, more widely known as bash.


    In recent years, the developers of Kali Linux have changed from the bash shell
    to the Z as the default shell. Although there is nothing wrong with the Z shell
    (macOS has changed as well) since Linux and Unix distributions (Red Hat, Ubuntu,
    Solaris, and so on) still use the bash shell, I think we too. Luckily, the developers
    of Kali Linux have made it easy to switch your default shell back to bash using
    the command kali-tweaks.


    Simply enter this command


    ```

    kali> kali-tweaks

    ```


    and it opens a graphical user interface like that shown in Figure 8-1.


    | Main Menu |

    |---||

    | Hardening | Configure the system for extra security |

    | Metapackages | Install specific subsets of tools for particular needs |

    | Network Repositories | Configure network repositories for APT |

    | Shell & Prompt | Configure the shell and command prompt |

    | Virtualization | Additional configurations for Virtual Machines |

    | <Select> | <Quit> |


    Figure 8-1: The main Kali menu


    Use your down arrow key to select the fourth option, Shell & Prompt, and press
    ENTER. This will open the screen shown in Figure 8-2.'
  merge: -1
  pgno: 121
- img_proc: true
  md: '# Figure 8-2: The Shell & Prompt setting


    Scroll down to the second option, **Default Login Shell**, and press ENTER. This
    will open the screen shown in Figure 8-3.


    # Figure 8-3: Selecting the bash shell


    Use your spacebar to select Bash and then scroll down to **Apply** and press ENTER.
    You will then be prompted for your password, and when you enter it, your system
    will respond with the message shown in Figure 8-4.


    # Figure 8-4: Kali lets you know that the login shell has changed.


    Now, press ENTER, log out and log back in, and your shell will be changed to the
    most common shell in the Linux/Unix world, bash!

    The shell can run any system commands, utilities, or applications your usual command
    line can run, but it also includes some of its built-in commands. Table 8-1 later
    in the chapter provides a reference to some useful commands that reside within
    the bash shell.'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'In earlier chapters, you used the cd, pwd, set, and umask commands. In this
    chapter, you will be using two more commands: the echo command, used in Chapter
    7, which displays messages to the screen, and the read command, which reads in
    data and stores it somewhere. Learning these two commands alone will enable you
    to build a simple but powerful tool.


    You''ll need a text editor to create scripts. A text editor is a program that
    can edit plain, unformatted text, like Notepad in Windows or TextEdit in macOS.
    You can use whichever Linux text editor you like best. Popular hacker choices
    include vi, emacs, geic, kate, and so on. I''ll be using mousepad in this book,
    as I have in previous chapters. Using a different editor should not make any difference
    in your script or its functionality.


    # ## First Script: "Hello, Hackers-Arise!"


    For your first script, we will start with a simple program that returns a message
    to the script that says Hello, Hackers-Arise! Open your text editor, and let''s
    go.


    To start, you will need to tell operating system which interpreter you want to
    use for a script. To do this, enter a shebang, which is a combination of a hash
    mark and an exclamation mark, like so:


    ```

    #!

    ```


    Then follow the shebang (#) with /bin/bash to indicate that you want the operating
    system to use the bash interpreter. As you''ll see in later chapters, you could
    also use the shebang to use other interpreters, such as Perl or Python. Here,
    you want to use the bash interpreter, so enter the following:


    ```

    #! /bin/bash

    ```


    Next, enter the echo command, which tells the system to simply repeat (or echo)
    back to your monitor whatever follows the command.


    In this case, we want the system to echo back to Hello, Hackers-Arise!, as done
    in Listing 8-1. Note that the text or message we want to echo back must be in
    double quotation marks.


    #! This is my first bash script. Wish me luck.


    ```

    echo "Hello, Hackers-Arise!"

    ```


    Listing 8-1: Your "Hello, Hackers-Arise!" script


    Here, you also see a line that preceded by a hash mark (#). This is a comment,
    which is a note to yourself or anyone else reading the code, to explain what you''re
    doing in the script. Programmers use comments in every coding language. These
    comments are not read or executed'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'by the interpreter, so you don''t need to worry about messing up your code.
    They are visible only to humans. The bash shell knows a line is a comment if it
    starts with the # character.


    Now, save this as HelloHackersArise with no extension, and exit your text editor.


    # Setting Execute Permissions


    By default, a newly created bash script is not executable even by you, the owner.
    Let''s look at the permissions on our new file in the command line by using cd
    to move into the directory and entering ls -l. It should look something like this:


    ```

    kali| ls -l

    --snip--

    --rw-r--r-- 1 kali 90 Oct 22 14:32 HelloHackersArise

    --snip--

    ```


    As you can see, our new file has rw-r-r-- (644) permissions. As you learned in
    Chapter 5, this means the owner of this file has only read (r) and write (w) permissions,
    but no execute (x) permissions. The group and all other users have only read permissions.
    We need to give ourselves execute permissions in order to run this script. We
    change the permissions with the chmod command, as you saw in Chapter 5. To give
    the owner, group, and all others execute permissions, enter the following:


    ```

    kali chmod 755 HelloHackersArise

    ```


    When we do a long listing on the file, like so, we can see that we have execute
    permissions:


    ```

    kali| ls -l

    --snip--

    --rwx-xr-x 1 kali 42 Oct 22 14:32 HelloHackersArise

    --snip--

    ```


    The file will also be in green, another indicator of its execute permissions.
    The script is now ready to run!


    # Running HelloHackersArise


    To run our simple script, enter the following:


    ```

    kali ../HelloHackersArise

    ```


    The / before the filename tells us that we want to execute this script in the
    file HelloHackersArise from the current directory. It also tells the system that
    if there is another file in another directory HelloHackersArise, please ignore
    it and run HelloHackersArise only in the current directory. It may seem unlikely
    that there''s another file with this name'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'on your system, but it''s good practice to use the ./ / when executing files,
    as this localizes the file execution to the current directory, and many directories
    will have duplicate filenames, such as start and setup.

    When we press ENTER, our very simple script returns our message to the monitor:


    Hello, Hackers-Arise!


    Success! You just completed your first shell script!


    # Adding Functionality with Variables and User Input


    So, now we have a simple script. All it does is echo back a message to standard
    output. If we want to create more advanced scripts, we will likely need to add
    some variables.


    A variable is an area of storage that can hold something in memory. That "something"
    might be some letters or words (strings) or numbers. It''s known as a variable
    because the value held within are changeable; this is an extremely useful feature
    for adding functionality to a script.


    In our next script, we will add functionality to prompt the user for their name,
    whatever they input into a variable, prompt the user for the chapter they''re
    in this book, and place that keyboard input into a variable. After that, we''ll
    echo a welcome message that includes their name and the chapter back to the user.


    Open a new file in your text editor and enter the script shown in Listing 8-2.


    ```

    # /bin/bash

    n# This is your second bash script. In this one, you prompt

    # the user for input, place the input in a variable, and

    # display the variable contents in a string.

    echo "What is your name?"

    read name

    echo "What chapter are you on in Linux Basics for Hackers?"

    read chapter

    echo "Welcome $name to Chapter $chapter of Linux Basics for Hackers!"

    ```


    Listing 8-2: A simple script use of variables


    We open with ! /bin/bash to tell the system we want to use the bash interpreter
    for our script. We add a comment that describes the script and its functionality.
    After that, we prompt the user for their name and ask the interpreter to read
    the input and place it into a variable called name. Then we prompt the user to
    enter the chapter they are currently working through in this book, and we again
    read the keyboard input into a variable, this time called chapter.'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'In the final line, we construct a line of output that welcomes the reader by
    their name to the chapter they are on. We use the echo command and provide the
    text we want to display on the screen in double quotes. Then, to fill in the name
    and chapter number the user entered, we add the variables where they should appear
    in the message. As noted in Chapter 7, to use the values contained in the variables,
    you must precede the variable name with the $ symbol.


    Save this as WelcomeScript.sh The .sh extension is the convention for script files.
    You might have noticed we didn''t include the extension earlier; it''s not strictly
    required, and it makes no difference if you leave the extension off. The extension
    can be a useful indicator for other people that this is a shell script, though.


    Now, let''s run this script. Don''t forget to give yourself permission with chmod
    first; otherwise, the operating system will scold you with a Permission denied
    message.


    ```

    kali> ./WelcomeScript.sh

    What is your name?

    OccupyWeb

    What chapter are you on Linux Basics for Hackers?

    8

    Welcome OccupyWeb to Chapter 8 of Linux Basics for Hackers!

    ```


    As you can see, your script took input from the user, placed it into variables,
    and then used those inputs to make a greeting for the user. This is a simple script,
    but it taught you how to use variables and take input from the keyboard. These
    are both crucial concepts in scripting that you will need to use in more complex
    scripts in future.


    # Your Very First Hacker Script: Scan for Open Ports


    Now that you have some basic scripting, let''s move to slightly more advanced
    scripting that has real-world application to hacking. We''ll use an example from
    the world of black hacking. Black hackers are those with malicious intentions,
    such as stealing credit card numbers or defacing websites. White hackers are those
    with good intentions, such as helping software developers or system administrators
    make their systems more secure. Gray hackers are those who tend to move between
    these two.


    Before you continue, you need to become familiar with a simple essential tool
    nmap that comes installed on Kali by default. You''ve likely learned the name;
    nmap is used to probe a system to see what it is open. From the open ports discovered,
    you can surprise what services are running on the target system. This is a crucial
    skill for any hacker or system administrator.


    In its simplest form, the syntax for running an nmap scan looks like this:


    ```

    nmap<type of scan><target IP><optionally, target port>

    ```'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'Not too difficult. The simplest and most reliable nmap scan is the TCP connect
    scan, designated with the -sT switch in nmap. So, if you wanted to scan IP address
    192.168.181.1 with a TCP scan, you would enter the following:


    ```

    nmap -sT 192.168.181.1

    ```


    To take things step further, if you wanted to perform a TCP scan of address 192.168.181.1,
    looking to see whether port 3306 (the default port for MySQL and MariaDB) was
    open, you could enter this:


    ```

    nmap -sT 192.168.181.1 -p 3306

    ```


