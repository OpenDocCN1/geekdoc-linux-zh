  md: '# Viewing and Modifying Environment Variables


    You can view all your default environment variables by entering env into your
    terminal from any directory:


    ```

    kali> env

    XDG_VTNR=7

    SSHAGENT_PID=922

    XDG_SESSION_ID=2

    XDG_GREETER_DATA_DIR=/var/lib/lightdm/data/root

    TERM=xterm-256color

    SHELL=/bin/bash

    --snip--

    USER=kali

    --snip--

    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/bin

    --snip--

    HOME=/kali

    --snip--

    ```


    As shown here, variables are simply strings in key-value pairs. Generally, each
    pair follows the format KEY=value, though variables with multiple values will
    look like this: KEY=value1:value2. With most things in Linux, if the value contains
    spaces, they need to be contained in quotation marks.


    Environment variables are always uppercase, as in HOME, PATH, SHELL, and so on.
    The ones shown here are only the default environment variables that come on your
    system. Users can also create their own variables, and as you will see, we need
    a different command to include those in the output.


    # Viewing All Environment Variables


    To view all environment variables, including shell variables, local variables,
    and shell functions, such as any user-defined variables and command aliases, use
    the set command. This command lists all environment variables unique to your system,
    which in most cases will give you an output so long you want to be able to view
    it all on a single screen. You can request to view each variable, line by line,
    in a more accessible fashion using set and piping it to the more command:


    ```

    kali> set | more

    B=/bin/bash

    BASHOPTS=checkwins:cmdlist_complete_fullquote:expand_aliases:extglob...

    BASH_ALIASES=()

    BASH_ARGC={0} = ""

    BASH_ARGV=()

    --snip--

    ```'
  merge: -1
  pgno: 113
- img_proc: true
  md: 'Now the list of variables fills up one screen, line by line, and then stops.

    When you press ENTER, the terminal advances to the next line, taking you to

    t next variable, so you can scroll through by pressing or holding ENTER.

    As you might recall from Chapter 2, whenever you use the more command

    for output, you can enter q to quit (or exit) and return to the command

    prompt.


    # Filtering for Particular Variables


    Although using set with more gives more manageable results than looking

    through the huge chunk of variable names you get with set alone, it can still

    rather tedious if you''re looking for a particular variable. Instead, you can

    use the filtering grep to find your variable of interest.


    Let''s use HISTSIZE as an example. This variable contains the

    maximum number of commands that your command history file will store.

    The command history file contains the commands you previously typed into

    your command prompt in this session, which you can retrieve with the up

    d down arrow keys. Note that HISTSIZE doesn''t store the commands them-

    elves, just the number of them that can be stored.


    Pipe your output with grep to find the HISTSIZE variable, like so:


    ```

    kali> set | grep HISTSIZE

    HISTSIZE=1000

    ```


    As you can, by default, this finds the variable HISTSIZE and displays its

    value. it is probably set to 1000 on your system. This indicates that

    the terminal will store your last 1,000 commands by default.


    # Changing Variable Values for a Session


    Let''s see how to change a variable''s value. As noted, the HISTSIZE variable

    contains the number of commands to store in the history file. Sometimes,

    you won''t want your system to pass past commands. Perhaps because you

    don''t want to leave any evidence of your activity on a target system. In that

    case, you can set the HISTSIZE to 0 so the system won''t store any

    of your past commands. Because this variable has a single value, you can-

    ply it a new value in the familiar way shown in Listing 7-1.


    ```

    kali> HISTSIZE=0

    ```


    Listing 7-1: Changing the value of HISTSIZE


    Now, when you try to use the up and down arrow keys to recall your

    commands, nothing happens because the system no longer stores them.

    This is stealthy, although it can be inconvenient.'
  merge: -1
