- img_proc: true
  md: '# Changing Your PATH


    One of the most important variables in your environment is your PATH variable,
    which controls where on your system your shell will look for the commands you
    enter, as grep, ls, and echo. Most commands are located in the sbin bin subdirectory,
    like /usr/local/sbin or /usr/local/bin. If the bash shell doesn''t find the command
    in one of the directories in your PATH, it will return the error command not found,
    even that command exists in a directory not in your PATH.


    You can find out which directories are stored in your PATH variable by using echo
    on its contents, so:


    ```

    kali> echo $PATH

    /usr/local/sbin:/usr/local/bin:/usr/bin:/sbin:/bin

    ```


    Your terminal will search the directories listed here for all commands. When you
    enter ls, for example, the system will know to look in each of these directories
    for it, then execute it.


    Each directory is separated by a colon (:). Don''t forget to add the $ content
    symbol to PATH. When we put a $ before a variable, we are asking the system for
    the content of the variable.


    # Adding to the PATH Variable


    You probably see why it''s important to know what is in your PATH variable: if
    you downloaded and installed a new tool (say, newhackingtool) you could use commands
    from that tool only when you were in that directory, because that directory is
    not in the PATH variable. Every time you wanted to use that tool, you would first
    have to navigate to /root/newhackingtool, which is a bit inconvenient if you want
    to use the tool often.


    To be able to use this tool from any directory, you need to add the directory
    holding this tool to your PATH variable. To add newhackingtool to your PATH variable,
    enter the following:


    ```

    kali> PATH:$PATH:/root/newhackingtool

    ```


    This assigns the original PATH plus the /root/newhackingtool directory to the
    new PATH variable, so the variable contains everything it did before, plus the
    new tool directory.


    If you examine the contents of PATH variable again, you should see that the directory
    has been appended to the end of PATH, as shown here:


    ```

    kali> echo $PATH

    /usr/local/sbin:usr/local/bin:usr/bin:bin:/root/newhackingtool

    ```


    Now you can execute newhackingtool applications from anywhere, rather than having
    to navigate to its directory. The bash shell will look in all directories listed
    for your new tool.'
  merge: -1
  pgno: 117
- img_proc: true
  md: 'Adding to PATH can be a useful technique for directories you use often but
    be careful not to add too many directories to your PATH variable. Because the
    system will have to search through each and every directory in PATH to find commands,
    adding a lot of directories could slow down your terminal.


    # Not Add to the PATH Variable


    One mistake commonly made by few Linux users is assigning a new directory, such
    as /root/newhackingtool, directly to the PATH variable in this way:


    ```

    kali> PATH=/root/newhackingtool

    kali> echo $PATH

    /root/newhackingtool

    ```


    If you use this command, your PATH variable will contain only the /root/newhackingtool
    directory and no longer contain the system directories such as /bin, /sbin, and
    others that hold critical commands. When you go to use any of the system commands,
    you''ll receive the error command not found, as shown next, unless you first navigate
    to the system binaries when you execute the command:


    ```

    kali> ls

    bash: ls: command not found

    ```


    Remember that you want to append to the PATH variable, not replace it. If you''re
    in doubt, save the contents of the variable somewhere before you modify it.


    # Creating a User-Defined Variable


    You can create your own, user-defined variables in Linux by simply assigning a
    value to a new variable that you name. This may be useful when you are doing more
    advanced shell scripting or that you''re find using a long command that you get
    tired of typing over and over.


    The syntax is straightforward: enter the name of your variable, the assignment
    symbol (=) without a space, and the value to put in the variable, as shown here:


    ```

    kali> MYNEWVARIABLE="Hacking is the most valuable skill set in the 21st century"

    ```


    This assigns a string to the variable MYNEWVARIABLE. To see the value in that
    variable, use the echo command and the $ symbol with the variable name, as we
    did earlier:


    ```

    kali> echo $MYNEWVARIABLE

    Hacking is the most valuable skill set in the 21st century

    ```


    Just like our environment variables, user-defined variables must be exported to
    persist to new sessions.'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'If you want to delete this new variable, or any variable, use the unset command.
    Always think before deleting a system variable, though, because your system will
    probably operate much differently afterward.


    ```

    kali> unset MYNEWVARIABLE

    kali> echo $MYNEWVARIABLE

    kali>

    ```


    As you can see, when you enter unset MYNEWVARIABLE, you delete the variable along
    with its value. If you use echo on that same variable, Linux will now return a
    blank line.


    # Summary


    You might find environment variables foreign, but it''s worth getting to know
    them. They control your working environment in Linux looks, acts, and feels. You
    can manage these variables to tailor your environment to your needs by changing
    them, exporting them, and even creating your own. In some cases, they may be useful
    for covering your tracks as a hacker.


    # Exercises


    +   1. View all of your environment variables with the more command.

    2. Use the echo command to view the HOSTNAME variable.

    3. Find a method to change the slash (/) to a backslash (\) in the faux Microsoft
    cmd Ps1 example (see Listing 7-2).

    4. Create a variable named MYNEWVARIABLE and put your name in it.

    5. Use echo to view the contents of MYNEWVARIABLE.

    6. Export MYNEWVARIABLE so that it''s available in all environments.

    7. Use the echo command to view the contents of the PATH variable.

    8. Add your home directory to the PATH variable so that any binaries in your home
    directory can be used in any directory.'
  merge: -1
