  md: '# # 7


    # # MANAGING USER

    ENVIRONMENT VARIABLES


    ![](img/7f106d14d88c19c5eac20858e43b615b_110_0.png)


    To get the most from your Linux hacking system, you need to understand environment
    variables and be adept at managing them for optimal performance, convenience,
    and even stealth. *Environment variables* are process-wide variables built into
    your system and interface acts, and “feels” to the user, and they are inherited
    by any child shells or processes. *Shell variables*, on the other hand, are typically
    listed in lowercase and are valid only in the shell they are set in.'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'Among the topics that Linux newcomers find problematic, managing the user environment
    variables might be the most difficult to master. We cover some of the most useful
    skills for environment and shell variables in this chapter, without going too
    deep into the differences between them. In Kali, your environment is your bash
    shell. Each user, including root, has a default set of environment variables that
    determine how the system looks, acts, and feels. You can change the values for
    these variables to make your system work more efficiently, tailor your work environment
    to best meet your individual needs, and potentially cover your tracks if you need.


    # Changing the Default Shell to Bash


    At this time, I need to delve into some Linux esoterica. I apologize before I
    start. I''ll try to keep it brief.


    What we refer to as the terminal is technically a "shell." It provides us with
    access through the command line to the operating system, in this case, Linux.
    Almost from its birth, Linux has used the Bourne-Again Shell (BASH) as its default
    shell. Of course, it is not the only one available, but most people have grown
    accustomed to its quirks and features. In recent years, there has been a movement
    toward another known as the Z shell (zsh), which offers some new and different
    features from the bash shell. It was recently adopted by both Apple and the developers
    of Kali. It is now the default shell in Kali.


    A major purpose of this book is to teach Linux in a concise and understandable
    way. Bash is used on nearly every other Linux distribution you might work on,
    except Kali. For that reason, I think it is best, at this point in time, to change
    the default shell in our Kali system to the more widely used bash. Fortunately,
    the developers of Kali have made it extraordinarily simple to change from the
    default Z shell to tried-and-true bash, so let''s do that.


    At the Kali prompt, enter kali-tweaks:


    ```

    kali> sudo kali-tweaks

    ```


    After pressing ENTER, a simple graphical interface will pop up, the one shown
    in Figure 7-1, bringing you fond memories of Windows 98 (a simple design with
    primary colors).'
  merge: -1
  pgno: 111
- img_proc: true
  md: '![](img/7f106d14d88c19c5eac20858e43b615b_112_0.png)


    Figure 7-1: kali-tweaks


    Using this menu, you can harden your command line interface to make it more secure,
    install additional tools for hacking, configure your repositories, change your
    shell and prompt, and configure your virtual machines.


    Press the down arrow until **Shell & Prompt** is highlighted, then press ENTER
    to select it. The next screen should offer you three choices: Configure Prompt,
    Set the Default Login Shell, and Reset the Shell Config files. Highlight the second
    option and press **ENTER**.


    Now you should see two options for the default login shell, bash or Z. Highlight
    **bash**, press the spacebar to select it, then click **Apply**. Close the shell
    and log out. When you log back in, you will be in the bash shell.'
