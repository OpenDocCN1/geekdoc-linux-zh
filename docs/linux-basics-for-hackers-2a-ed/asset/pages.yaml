  md: 'The grep command is often used when output is piped from one command to another.
    I cover piping in Chapter 2, but for now, suffice to say that Linux (and Windows,
    for that matter) allows us to take the output of one command and send it as input
    to another command. This is called piping, and we use the | command to do it.
    (The | key is usually above the ENTER key on keyboards.)


    The ps command is used to display information about processes running on the machine.
    We cover this in more detail in Chapter 6, but for this example, I want to see
    all the processes running on my Linux system. In this case, I can use the ps (processes)
    command followed by the aux switches to specify which process information to display,
    like so:


    ```

    kali> ps aux

    ```


    This provides me with a listing of all the processes in this system—but if I want
    to find just one process to see if it is running? I can do this by piping the
    output from ps to grep and searching for a keyword. For instance, to find out
    which apache service is running, I would enter the following:


    ```

    kali> ps aux | grep apache2

    kali 4851 0.2 0.7 37572 7668 ? Ss 10:14 00:00 /usr/sbin/apache2-k start

    kali 4906 0.0 0.4 37572 4228 ? S 10:14 00:00 /usr/sbin/apache2-k start

    kali 4910 0.0 0.4 37572 4228 ? Ss 10:14 00:00 /usr/sbin/apache2-k start

    --snap

    ```


    This command tells Linux to display all my services and then send that output
    to grep, which will look through the output for the keyword apache2 and then display
    only the relevant output, thus saving me considerable time (and my eyesight).


    # # Modifying Files and Directories


