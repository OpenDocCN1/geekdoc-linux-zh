    # Character and Block Devices


    Something else to note about the naming of device files in the /dev directory
    is that the first position contains either c or b. You can see this in List 10-1
    at the start of most of entries, and it looks like this:


    ```

    cwd---- 1 root 10, 175 May 16 12:44 aggart

    ```


    These letters represent the two ways that devices transfer data in and out. The
    c stands for character, and these devices are known, as you might expect, character
    devices. External devices that interact with the system by sending and receiving
    data by character, such as mice or keyboards, are character devices.


    The b stands for the second type: block devices. They communicate in blocks of
    data (multiple bytes at a time) and include devices like hard drives and DVD drives.
    These devices require higher-speed data throughput and therefore receive data
    in blocks (many characters or bytes at a time). Once you know whether a device
    is a character or block device, you can easily get more information about it,
    as you will see.


    # List Block Devices and Information with Isblk and Isblk


    The Linux command lsblk, short for block list, lists some basic information about
    each block device listed in /dev. The result is similar to the output of fdisk
    -l, but it will also display devices with multiple partitions in a kind of tree,
    showing each device with its partitions as branches, and does not require root
    privileges to run. In Listing 10-3, for example, we see sda, sda1, sda2, sda5.


    ```

    kali$ lsblk

