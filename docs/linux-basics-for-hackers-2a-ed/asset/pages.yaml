    Figure 3-5: Changing the resolv.conf file to specify Google''s DNS server


    If you open the /etc/resolv.conf file now, you should see that it points the DNS
    requests to Google''s DNS server rather than your local DNS server. Your system
    will now go out to the public DNS server to resolve domain names to IP addresses.
    This can mean that domain names take a little longer (probably milliseconds).
    Therefore, to maintain speed but keep the option of using a public server, you
    might want to retain the local DNS server in the resolv.conf file and follow it
    with a public DNS server. The operating system queries each DNS server listed
    in the order so the system will only refer to the public DNS server if the domain
    name can''t be found in the local DNS server.


    If you''re using a DHCP address and the DHCP server provides a DNS setting, the
    DHCP server will replace the contents of the file when it renew the DHCP address.


    #  Your Own IP Addresses


    A special file on your system called the hosts file also performs name-IP address
    translation. The hosts file is located at /etc/hosts, and you can use it to specify
    your own IP address-domain mapping. In other words, you can determine which IP
    address your browser goes to when entering www.microsoft.com (or any other domain)
    into the browser, rather than letting the DNS server decide. As a hacker, this
    can be useful for hijacking a TCP connection on your local area network to direct
    traffic to a malicious web server with a tool such as spoof.


    From the command line, enter the following command (substitute your preferred
    text editor for mousepad):


    ```

    kali> sudo mousepad /etc/hosts

    ```


    You should now see your hosts file, which will look something like Figure 3-6.'
