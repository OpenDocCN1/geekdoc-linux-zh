  md: '# Mounting Storage Devices Manually


    In some versions of Linux, you need to mount a drive manually in order to access
    its content, so this is a skill worth learning.  To mount a drive on the filesystem,
    use the mount command. The mount point for the device should be an empty directory;
    if you mount a device on a directory that has subdirectories and files, the mounted
    device will cover the contents of the directory, making them invisible and unavailable.
    So, to mount the new drive sdb1 at the /mnt directory, you would enter the following:


    ```

    kali> sudo mount /dev/sdb1 /mnt

    ```


    That drive should then be available for access. If you want to mount the flash
    drive sdc1 at the /media directory, you would enter this:


    ```

    kali> sudo mount /dev/sdc1 /media

    ```


    The filesystems on a system that are mounted at boot-time are kept in a file at
    /etc/fstab (short for filesystem table), which is read by the system at every
    bootup.


    # Unmounting with unmount


    If you''re coming from a Mac or Windows background, you''ve probably unmounted
    a drive without knowing it. Before removing a flash drive from your system, "eject"
    to keep from causing damage to the files stored on the device. Eject is just another
    word for unmount.


    Similar to the mount command, you canmount a hard drive by entering the unmount
    command followed by the file entry of the device in the /dev directory, such as
    /dev/sdb. Note that the command is not spelt unmount but umount (no n).


    ```

    kali> sudo unmount /dev/sdb1

    ```


    You cannot unmount a device that is busy, so if the system is reading or writing
    to the device, you will just receive an error.


    # Monitoring Filesystems


    In this section, we look at some commands for monitoring the state of the filesystem—a
    skill necessary for any hacker or system administrator. We''ll get some information
    about mounted disks and then check for fix errors. Storage devices are particularly
    error prone, so it''s worth learning this skill.


    # Getting Information on Mounted Disks


    The command df (for disk free) will provide us with basic information on any hard
    disks or mounted devices, such as CD, DVD, and flash drives, including how much
    space is being used and how much is available'
