- img_proc: true
  md: '# Using apt to Handle Software


    In Debian-based Linux distributions, which include Kali and Ubuntu, the default
    software manager is the Advanced Packaging Tool, or apt, whose primary command
    is apt. In its simplest and most common form, you can use apt to download and
    install new software packages, but you can also update and upgrade software with
    it.


    # Searching for a Package


    Before downloading a software package, you can check whether the package you need
    is available from a repository, which is a place where operating system stores
    information. The apt tool has a search function that can check whether the package
    is available. The syntax is straightforward:


    ```

    sudo apt search keyword

    ```


    Note that we use the apt command to search the apt cache, or the place it stores
    the package names. If you were searching for the uncomplicated firewall (ufw),
    the simple but powerful Linux firewall to protect your network or system, for
    example, you would enter the following command:


    ```

    kali> sudo apt search ufw

    gufw/kali-rolling,kali-rolling 24.0.0-2 all

    graphical interface for ufw

    libqt6-protobuf-wellknownypes6/kali-rolling 6.7.2-7 amd64

    Qt 6 grpc protocol buffers Well Nodes types library

    librust-io-dev/kali-rolling 0.3.7-1+b3 amd64

    Extension trait for safely dropping I/O writers such as File and

    BufWriter - Rust source code

    plasma-firewall/kali-rolling 6.2.4-1 amd64

    Plasma configuration module for firewalls

    ufw/kali-rolling,kali-rolling 0.36.2-8 all

    program for managing a Netfilter firewall

    ```


    Numerous files have the ufw in them, but at the end of the output, we see ufw...program
    for managing a Netfilter firewall. That''s what we are looking for!


    # Adding Software


    Now that the ufw package exists in your repository, you can use apt to download
    the software.

    To install a piece of software from your operating system''s default repository
    in the terminal, then use the apt command, followed by the keyword and install
    the name of the package you want to install. The syntax looks like this:'
  merge: -1
  pgno: 79
- img_proc: true
