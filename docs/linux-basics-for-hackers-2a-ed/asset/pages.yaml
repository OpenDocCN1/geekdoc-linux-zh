  md: 'The kernel of any operating system is its heart. It controls the entire operating
    system, and it is what makes Linux. If the kernel is having problems, we probably
    want to be aware of that. To view kernel logs, we can use the -k option (kernel).
    For kernel logs within the last 24 hours, we can enter:


    ```

    kali> journalctl -k --24 hours ago"

    ```


    # # Using journalctl to Cover Your Tracks


    If you have compromised a system, you want to make sure you do not leave evidence
    that can be traced back to you. Remember, the best hack is the one that the target
    never knew happened!


    If we compromised the apache2 web server to take control of the system, the most
    important place to clean up is the apache2 logs. We can do this with journalctl,
    but we will need root privileges to use the command:


    ```

    kali sudo journalctl -u apache2 --time=1d

    ```


    This command will delete all the logs associated with the apache2 server in the
    day.


    ```

    Vacuuming done, freed 08 of archived journals from /var/log/journal/d3a0b2de9e6b40ad551c7593a25/system-0006...

    Deleted archived journal /var/log/journal/d3a0b2de9e6b40ad551c7593a25/user-10000...

    --snap--

    ```


    A more secure solution is to shred the logfiles. With other file deletions, a
    skilled investigator is still able to recover the deleted files (deleted are simply
    made available to be overwritten by the file-system; they still exist until they
    are overwritten). But suppose there was a way to delete the file and overwrite
    it several times, making it much harder to recover. Lucky for us, Linux has a
    built-in command, appropriately named shred, for just this purpose.'
  merge: -1
  pgno: 157
- img_proc: true
  md: 'To understand how the shred command works, take a quick look at the help screen
    by entering the following command:


    ```

    kali shred --help

    Usage: shred [OPTION]...FILE...

    Overwrite the specified FILE(s)repeatedly in order to make it harder

    for even very expensive hardware probing to recover data

    snip--

    ```


    The output on your screen shows that the shred command has many options. In its
    most basic form, the syntax is:


    ```

    shred <FILE>

    ```


    On its own, shred will delete the file and overwrite several times—by default,
    shred overwrites four times. Generally, the more times it is overwritten, the
    harder it is to recover, but keep in mind that each overwrite takes time, so for
    very large files, shredding may be time-consuming.


    Two useful options to include are the -f option, which changes the permissions
    on the files to allow overwriting if a permission is necessary, and the -n option,
    which lets you choose how many times to overwrite the files. As an example, we
    will shred all the logfiles in /var/log/journal/subdirectory/* 10 times using
    the following command:


    ```

    kali shred -f -n 10 /var/log/journal/subdirectory name.*

    ```


    We need the -f option to give us permission to shred auth files, and we follow
    the -n option with the desired number of times to overwrite. After the path of
    the file we want to shred, we include the wildcard asterisk so we''re shredding
    everything in the subdirectory. Now try to open a logfile:


    ```

    kali mousepad /var/log/journal/filename

    ```


    Once you''ve shredded a file, you''ll see that the contents are indecipherable,
    gibberish, as seen in Figure 11-3.


    ![](img/7f106d14d88c19c5eac20858e43b615b_158_0.png)


    Figure 11-3: A shredded logfile


    Now if the security engineer or forensic investigator examines the files, they
    will find nothing of use because none of it is recoverable!'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# # Disabling Logging


    Another option for covering your tracks is simply to disable logging. When a hacker
    takes control of a system, they could immediately disable logging to prevent the
    system from keeping track of their activities. This, of course, requires root
    privileges.


    To disable logging, the hacker could simply stop using journalctl to send logs
    to null. This means instead of writing the logs to a storage device such as a
    hard drive, the system will send the logs to a null place (nowhere). We can accomplish
    this by opening and editing the journal daemon configuration file. It is at /etc/systemd/journald.conf.
    You can open with any text editor, but here I opened with mousepad preceded by
    sudo to gain root privileges:


    ```

    kali> sudo mousepad /etc/systemd/journald.conf

    ```


    ```

    # This is part of system.

    # systemd is software; you can redistribute it and/or modify it under the

    # terms of the GNU General Public License as published by the Free

    # Software Foundation; either version 2.1 of the License, or (at any later)

    # any later version.

    #

    # Entries in file show the compile defaults. Local configuration

    # should be created by modifying this file (a copy of it placed in

    # /etc/ if the original file is shipped in /usr/), or by creating "drop-ins" in

    # the /etc/systemd/journald.conf/ directory. The latter is generally

    # recommended. Defaults can be restored by deleting the main

    # configuration file and all drop-ins located in /etc.

    #

    # Use ''systemd-analyze cat-config systemd/journald.conf'' to display the full
    config.

    #

    # See journald.conf(5) for details.

    ```


    ```

    [Journal]

    #Storage=auto

    #Compress=yes

    --snip--

    ```


    Note the line at end that says #Storage=auto. Change that line to Storage=null
    and delete the comment mark before it (#). Now save the file and restart journal:


    ```

    kali> sudo systemctl restart system-journal

    ```


    This will stop and start journal, and when it restarts, it will use the new configuration
    file that sends all logs to null.

    Now Linux will stop generating any logs until the service is restarted, enabling
    you to operate without leaving any evidence in the logfiles!'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Summary


    Logfiles track nearly everything that happens on your Linux system. They can be
    an invaluable resource in trying to analyze what has occurred, whether it be a
    malfunction or a hack. For the hacker, logfiles can be evidence of their activities
    and identity. However, an astute hacker can remove and shred these files and disable
    logging entirely, thus leaving no evidence behind.


    # Exercises


    +   1. Query your logfiles with journalctl to find all the logfiles generated
    in the last 12 hours.

    2. Query your logfiles with journalctl to find all the logfiles associated with
    your browser.

    3. Edit your journald.conf file to send all the logs to nowhere.

    4. Query your logfiles with journalctl to find all the logs of apache2 within
    the last 36 hours that are critical.'
