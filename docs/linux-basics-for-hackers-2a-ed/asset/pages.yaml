  md: '# 16


    # # AUTOMATING TASKSnWITH JOB SCHEDULING


    ![](img/7f106d14d88c19c5eac20858e43b615b_210_0.png)


    Like anyone using Linux, the hacker often has jobs, scripts or other tasks, that
    they want to run periodically. You might, for example, want to schedule automatic
    regular file backups of your system, or maybe you want to rotate logfiles as we
    did in Chapter 11. The hacker, on the other hand, may also want to have their
    system run the MySQLscanner.sh script from Chapter 8 every night or while they''re
    at work or school. These are all examples of scheduling automatic jobs. Scheduling
    jobs allows you to run tasks without having to think about them, and you can schedule
    jobs to run when you''re otherwise not using your system so you have plenty of
    free resources.'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'The Linux admin—the hacker, for that matter—may also want to set certain scripts
    or services to start automatically when their system boots up. In this, you''ll
    learn more about how to use the cron daemon and crontab to set up scripts to run
    automatically, while even the system is unattended. You will also learn how to
    set up startup scripts that automatically run whenever the system is booted, which
    will provide you with the necessary services that you''ll need to run during your
    day of hacking.


    # Scheduling an Event or Job to Run on an Automatic Basis


    The cron daemon and the cron table (*crontab*) are the most useful tools for scheduling
    tasks. The first, *cron*, is a daemon that runs in the background. The cron daemon
    checks the cron table for commands to run at specified times. We can alter the
    cron table to schedule a task or job to execute regularly on a particular day
    or date, at a particular time daily, or every many weeks or months.

    To schedule these tasks or jobs, enter them into the cron file, located at /etc/crontab.
    The cron table has seven fields: the first five are used to schedule the time
    to run the task, the sixth field specifies the user, and the seventh field is
    used for the absolute path to the command you want to execute. If we are using
    cron to schedule a script, we could simply put the absolute path to the seventh
    field.


    Each of the five time fields represents a different element of time: the minute,
    hour, day of the month, month, and day of the week. Every element of time must
    be represented numerically, so March is represented as 3 (you cannot simply input
    "March"). Days of the week begin at 0, which is Sunday, and end at 7, which is
    also Sunday. Table 16-1 summarizes.


    Table 16-1: Time Representations for Use in the crontab

    | Field | Time unit | Representation |

    |---|---||

    | 1 | Minute | 0–59 |

    | 2 | Hour | 0–23 |

    | 3 | Day of the month | 1–31 |

    | 4 | Month | 1–12 |

    | 5 | Day of the week | 0–7 |


    So, if we had written a script to scan the globe for vulnerable ports and wanted
    it to run every night at 2:30 AM, Monday through Friday, we could schedule it
    in the *crontab* file. We will walk through the process of how to get this information
    into the *crontab* shortly, but let''s discuss the format we need to follow, shown
    in Listing 16-1.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '```

    M H DOM MON USER COMMAND

    30 2 * * 1-5 root /root/myscanningscript

    ```


    Listing 16-1: The format for scheduling commands


    The crontab file helps the columns for you. Note that the first field provides
    the minute (30), the second field provides the hour (2), the fifth field provides
    the days (1-5, or Monday through Friday), the sixth field defines the user (root),
    and the seventh field is the path to the script. The third and fourth fields contain
    asterisks (*) because we want to script to run every day Monday through Friday
    regardless of the day of the month or the month.


    In Listing 16-1, the first field defines a range for the day of the week by a
    dash (-) between the numbers. If you want to execute a script on multiple noncontiguous
    days of the week, you can select those days with commas (,). Thus, Tuesday and
    Thursday would be 2,4.


    To edit crontab, you can run the crontab command followed by the -e (option):

    krontab -e

    Select an editor. To change later, run ''select-editor''.

    1. /bin/nano <----easiest

    2. /usr/bin/mcedit

    3. /usr/bin/vim.basic

    4. /usr/bin/vim.gtk

    5. /usr/bin/vim.tiny

    Choose 1-5 [1]:


    The first time you run this command, it will ask which editor you would like to
    use. The default is /bin/nano, the option that tells you it is the easiest. If
    you choose this option, the terminal will open directly to crontab.


    Another option, and often a better one for the newcomer to Linux, is to open crontab
    directly in your favorite text editor, which you can do so:

    kali> sudo mousepad /etc/crontab


    I''ve used this command to open crontab in mousepad. You can see a snippet of
    /etc/crontab in Listing 16-2.


    ```

    # /etc/crontab: system-wide crontab

    # Unlike any other crontab, you don''t have to run the ''crontab''

    # command to install the new version when you edit this file

    # and files in /etc/cron.d. These files also have username fields,

    # which no other crontabs do.


    SHELL=/bin/sh

    PATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin


    # h dom mon dow user command

    ```'
