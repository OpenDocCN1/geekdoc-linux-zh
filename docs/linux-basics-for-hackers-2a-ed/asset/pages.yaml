    # Mounting and Unmounting


    Most modern operating systems, including new versions of Linux, automount storage
    devices when they''re attached, meaning the flash drive or hard drive is automatically
    attached to the filesystem. For those new to Linux, mounting might be a foreign
    subject.


    A storage device must be physically connected to the filesystem and logically
    attached to the filesystem in order for the data to be available to the operating
    system. In other words, if the device is physically attached to the system, it
    is not necessarily logically attached and available to the operating system. The
    term mount is a legacy from the early days of computing when storage tapes (before
    hard drives) had to be physically mounted to the computer system—think of those
    big computers with spinning drives you might have seen in sci-fi movies.


    As mentioned, the point in the directory tree where devices are attached is known
    as the mount point. The two main mount points in Linux are /mnt and /media. As
    a convention, devices such as external USB devices and flash drives can be manually
    mounted at /mnt, but when automatically mounted, the /media directory is used
    (though technically any directory can be used).'
