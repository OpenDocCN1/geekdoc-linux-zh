  md: '# Installing Software with git


    Sometimes the software you want isn''t available in any of the repositories—especially
    if it’s brand new—but it may be available on GitHub (https://www.github.com),
    a site that allows developers to share their software with others to download,
    and provide feedback. For instance, if you want to install cameradar, an IP camera
    hacking tool (this is one of the tools used to hack cameras in Ukraine to spy
    on Russian activities), but can''t find it in the Kali repository, you can search
    GitHub for the software by entering cameradar into the search bar. If it exists
    on GitHub, you will see the repository in the search results.


    Once you''ve found the software on GitHub, you can install it from the terminal
    by entering the git clone followed by its GitHub URL. For instance, cameradar
    is located at https://github.com/Ullaikut/cameradar-git. To clone it into your
    system, enter the following command:


    ```

    kali git clone github.com/Ullaikut/cameradar

    Cloning into ''cameradar...''

    remote: Enumerating objects: 2661, done.

    remote: Counting objects: 100% (81/81), done.

    remote: Compressing objects: 100% (53/53), done.

    remote: Total 2661 (delta 32), reused 53 (delta 25), pack-reused 2580

    Receiving objects: 100% (2661/2661), 36.35 MiB/s, done.

    Resolving deltas: 100% (1042/1042).

    ```


    The git command copies all the data and files from that location onto your system.
    You can check to see that they''ve been successfully downloaded by using the long
    listing command -1 on the target directory, like so:


    ```

    kali ls -1

    ```


    If you''ve successfully cloned cameradar to your system, you should see something
    like the following output:


    ```

    total 80

    drwxr-xr-x 7 kali 4096 Jan 10 22:19 cameradar

    drwxr-xr-x 2 kali 4096 Dec 5 11:17 Desktop

    drwxr-xr-x 2 kali 4096 Dec 5 11:17 Documents

    drwxr-xr-x 2 kali 4096 Dec 5 11:17 Downloads

    drwxr-xr-x 2 kali 4096 Dec 5 11:17 Music

    --snip--

    ```


    The output shows that cameradar has been successfully cloned to the system, and
    a new directory named cameradar has been created for its files.'
