  md: '# Viewing Files


    As demonstrated in Chapter 1, the most basic text display command is probably
    cat, but it has its limitations. Use cat to display the apache2 config file (apache2.conf)
    found in /etc/apache2:


    ```

    kali > /etc/apache2/apache2.conf

    ```


    Your screen should now display the entire apache2.conf file, which will stream
    until it comes the end of the file, as shown here, which isn''t the most convenient
    or practical way to work with this file:


    ```

    LogFormat "%{Referer} -> %" referer

    LogFormat "%{User-agent" agent

    ```


    ```

    # Include of directories editors'' and dpkg''s backup files,

    # seeREADME.Debian details.

    ```


    ```

    # Include generic snippets of statements:

    IncludeOptional conf-enabled/*.conf

    ```


    ```

    # Include the virtual host configurations:

    IncludeOptional sites-enabled/*.conf

    ```


    ```

    # vim: syntax=apache ts=4 sw=4 sts=4 srnoet

    ```


    In the following sections, I will show you the head and tail commands, which are
    two methods for displaying just part of a file''s content in order to more easily
    view the key content.


