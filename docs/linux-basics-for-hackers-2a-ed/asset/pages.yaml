  md: '# Finding Yourself with pwd


    Unlike when you''re working in a graphical user interface (GUI) environment like
    Windows or macOS, the command line in Linux does not always make it apparent which
    directory you are presently in. To navigate to a new directory, you usually need
    to know where you are currently. The print working directory command, pwd, returns
    your location within the directory structure.


    Enter pwd in your terminal to see where you are:


    ```

    kali> pwd

    home/kali

    ```


    In this case, Linux returned /home/kali, telling me I''m in the kali user''s directory.
    And because you logged in kali when you started Linux, you should be in the kali
    user''s directory, too, which is two levels below the top of the filesystem structure
    (/).


    If you''re in another directory, pwd will return that directory name


    # Checking Your Login with whoami


    In Linux, the one "all-powerful" superuser or system administrator is named root,
    and it has all the system privileges needed to add users, change passwords, change
    privileges, and so on. Obviously, you don''t want anyone who has the ability to
    make these changes; you want someone who can be trusted and has proper knowledge
    of the operating system. As a hacker, you usually need to have all privileges
    to run the programs and commands you need (any hacker tools work unless you have
    root privileges), so you''ll want to log in as root.


    If you''ve forgotten whether you''re logged in as root or another user, you can
    use the whoami command to see which user you''re logged in as:


    ```

    kali> whoami

    kali

    ```


    If I had been logged in as another user, such as my personal account, whoami would
    have returned my username instead, as here:


    ```

    kali> whoami

    OTW

    ```


    It''s also important to know that you should not log in as root when performing
    routine tasks, because anyone who hacks your system (yes, hackers sometimes get
    hacked) would immediately gain those root privileges. Log in as a regular user
    when starting regular applications, browsing the web, running tools like Wireshark,
    and so on.'
