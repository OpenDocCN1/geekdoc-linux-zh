  md: '# About the Author


    OccupyTheWeb (OTW) is the pseudonym for the founder and primary writer for the
    hacker and pentester training website https://www.hackers-arise.com. He is a former
    college professor and has over 20 years of experience in the information technology
    industry. He has trained hackers throughout the US, including branches of the
    US military (Army, Air Force, and Navy) and the US intelligence community (CIA,
    NSA, DNI), and he played a key role in the hacker community''s resistance to the
    Russian invasion of Ukraine. He is also an avid mountain biker and snowboarder.


    # About the Technical Reviewer


    Artur Zielinski is a penetration tester who mostly focuses on offensive security
    (penetration testing, ethical hacking, red teaming, OSINT, ICS/SCADA hacking,
    and biohacking). Zielinski also leads cybersecurity-related activities for children
    in schools (a day in the life of an ethical hacker, cybersecurity tournaments,
    and escape rooms), and he''s the father of three fantastic children.'
