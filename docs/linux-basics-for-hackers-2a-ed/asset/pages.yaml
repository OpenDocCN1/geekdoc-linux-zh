- img_proc: true
  md: '# Starting, Stopping, and Restarting Services


    Before we begin to work with these crucial services, let''s examine how to start,
    stop, and restart services in Linux.


    Some services can be stopped and started via the GUI in Kali Linux, much as you
    would on an operating system like Windows or macOS. However, some services require
    use of the command line, which we''ll look at here. Here is the basic syntax for
    managing services:


    ```

    sudo systemctl start servicename

    ```


    To start the apache2 service (web server or HTTP service), enter the following:


    ```

    kali> sudo systemctl start apache2

    ```


    To stop the Apache web server, enter:


    ```

    kali> sudo systemctl stop apache2

    ```


    Usually, when you make a configuration change to an application or service by
    altering its plaintext configuration file, you need to restart the service to
    capture the new configuration. Thus, you would enter the following:


    ```

    kali> sudo systemctl restart apache2

    ```


    Now that you understand how to start, stop, and restart services from the command
    line, let''s move on to the three most critical Linux services to hackers.


    # Creating an HTTP Server with the Apache Web Server


    The Apache web server is probably the most used service on Linux systems. Apache
    is found on over 55 percent of the world''s webs, so any self-respecting Linux
    admin should be familiar with it. As a hacker aspiring to hack websites, it''s
    critical to understand the inner workings of Apache, websites, and the backend
    databases of these sites. You can also use Apache to set up your own web server,
    from which you could malware through cross-scripting (XSS) to anyone who visits
    your site, or you could clone a website and redirect traffic to your site via
    abuse of DNS (Domain Name System). In either of these cases, a basic knowledge
    of Apache is required.


    # Starting with Apache


    If you have Kali running on your system, Apache is already installed. Many other
    Linux distros have it installed by default as well. If you don''t have Apache
    installed, you can download and install it from the repositories by entering the
    following:


    ```

    kali> sudo apt install apache2

    ```'
