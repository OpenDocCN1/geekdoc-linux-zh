- img_proc: true
  md: '# Making Variable Value Changes Permanent


    When you change an environment variable, that change occurs only in that particular
    environment (in this case, the bash shell session). This means that when you close
    the terminal, any changes you are lost, and values return to their defaults. If
    you want to make the changes permanent, you need to use the export command. This
    command exports the new value from your current environment to the rest of the
    system, making it available in every environment until you change and export a
    new value.


    Variables are strings, if you run them on the cautious side, it isn''t a bad idea
    to save their contents to a text file before you modify them. For example, we''re
    about to change the PS1 variable, which controls the information you display in
    the prompt, you can first run the following command to save the values to a text
    file in the current user''s home directory:


    ```

    kali> echo $HISTSIZE > ~/valueofHISTSIZE.txt

    ```


    This way, you can always undo your changes. To be more cautious and create a text
    file with all the current settings, you can save the output of the set command
    to a text file with a command like this:


    ```

    kali> set ~/valueofALLon0101202s.txt

    ```


    After you''ve changed a variable, as we did in Listing 7-1, you can make the change
    permanent by entering export and then the name of the variable changed, as shown
    here:


    ```

    kali> export HISTSIZE

    ```


    Now the HISTSIZE variable will still be set to 0 in this environment and will
    no longer store your commands. If you want to reset the HISTSIZE variable to 1,000,
    simply enter this:


    ```

    kali> HISTSIZE=1000

    kali> export HISTSIZE

    ```


    This code snippet sets your HISTSIZE variable''s value to 1,000 and exports it
    to all your environments.


    # Changing Your Shell Prompt


    Your shell prompt, another environment variable, provides you with useful information
    such as the user you''re operating as and the directory in you''re currently working.
    The default shell prompt in Kali takes the following format:


    ```

    username@hostname:current_directory$

    ```'
  merge: -1
  pgno: 115
