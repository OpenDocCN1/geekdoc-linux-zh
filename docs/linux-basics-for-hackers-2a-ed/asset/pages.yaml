- img_proc: true
  md: 'Some of the best and most popular commercial VPN services, according to CNET,
    are the following:


    +   * ExpressVPN

    * SurfShark

    * NordVPN

    * ProtonVPN (I use this service)

    * PIA


    Most of these VPN services charge $50 to $100 per year, and many offer a free
    30-day trial. To find out more about how to set up a VPN, choose one from the
    list and visit its website. You should find download, installation, and usage
    instructions that are pretty easy to follow.


    The strength of a VPN is that all your traffic is encrypted when it leaves your
    computer, protecting you against sniffing, and your IP address when you visit
    a site. With a proxy server, the owner of the VPN has your originating IP address
    (otherwise they couldn''t send your traffic back to you). If they are pressed
    by espionage agencies or law enforcement, they might give up your identity. One
    way to prevent this is to use only VPNs that do not store or log any of your information
    (and hope they are being truthful). In this way, if someone insists that the VPN
    provider turn over its data on its users, there is no data.


    # Encrypted Email


    Free commercial email services such as Gmail, Yahoo!, and Outlook Mail (formerly
    Hot) are free for a reason: they are vehicles for tracking your interests and
    serving advertisements. As mentioned already, if a service is free, you are the
    product, not the customer. In addition, the services of the email provider (Google,
    for example) have access to the unencrypted contents of your email, even if you''re
    using HTTPS.


    One way to prevent eavesdropping on your email is to use encrypted email. ProtonMail,
    shown in Figure 13-6, encrypts your email from end to end or browser to browser.
    This means that your email is encrypted on ProtonMail servers—even the ProtonMail
    administrators can''t read your email.'
  merge: -1
