    #  Creating Files


    There are many ways to create files in Linux, but for now we''ll use two simple
    methods. The first is cat, which is short for concatenate, meaning to combine
    pieces together (not a reference to your domesticated feline). The cat command
    is generally used for displaying the contents of a file, but it can also be used
    to create small files. For creating bigger files, it''s better to edit the code
    in a text editor such as vim, emacs, mousepad, edit, or save it as a file.'
