    --snip--


    The output reveals numerous files that have the SUID bit set. Let''s navigate
    to the /usr/bin directory where many of these files reside, and run a long listing
    on that directory and scroll down to the sudo file:


    ```

    root@kali cd /usr/bin

    root@kali ls -l

    --snip--

    -rwxr-xr-x 1 root 176272 Jul 18 2024 stunnel4

    -rwxr-xr-x 1 root 266966 Mar 17 2024 sucrack

    -rwxr-xr-x 1 root 140944 Jul 5 2024 sudo

    --snip--

    ```


    Note that the first set of permissions (those for the owner) has an s in place
    of the x. This is how Linux represents that the SUID bit is set, and it means
    that anyone who runs the sudo file has the privileges of root user, which can
    be a security concern for the sysadmin and a potential attack vector for the hacker.
    For instance, some applications need to access the /etc/shadow file to successfully
    complete their tasks. If the attacker can gain control of that application, they
    can use that application''s access to the passwords on a Linux system.


    Linux has a well-developed security system to protect files and directories from
    unauthorized access. The aspiring hacker needs to have a basic understanding of
    this system not only to protect their files but also to execute new tools. In
    some cases, hackers can exploit the SUID and SGID permissions to escalate privileges
    from a regular user to a root user.


    # Summary


    Linux uses permissions to protect a user''s or group''s files and directories
    from other users, and you can take advantage of these for both offensive and defensive
    purposes. You should now know how to manage permissions and how to exploit weak
    points in this security system, in particular SUID and SGID bits.'
