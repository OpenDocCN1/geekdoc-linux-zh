- img_proc: true
  md: '# Linux Runlevels


    Linux has multiple runlevels that indicate what services should be started at
    bootup. For instance, runlevel 1 is single-user mode, and services such as networking
    are not started in runlevel 1. The rc scripts are set to run depending on what
    runlevel is selected:


    ```

    0 Halt the system

    1 Single-user/minimal mode

    2–5 Multiuser modes

    6 Reboot the system

    ```


    # Adding Services to rc.d


    You can add services for the rc.d script to at startup using the update-rc.d command.
    This command enables you to add or remove services from the rc.d script. The syntax
    for update-rc.d is straightforward; you simply list the command followed by the
    name of the script and then the action to perform, like:


    ```

    kali> update-rc.d name of the script or service remove|defaults|disable|enable

    ```


    As an example of how you can use update-rc.d, let''s assume you always want the
    PostgreSQL database to start upon boot using your Metasploit framework it can
    use for store testing and hacking results. You would use update-rc.d to add a
    line to your rc.d script to have it up and running every time you boot your system.


    Before you do that, let''s check whether PostgreSQL is running on your system.
    You can do so using the ps command and piping it to a filter looking for PostgreSQL
    using grep, like so:


    ```

    kali> ps aux | grep postgresql

    root 3876 0.0 0.0 12720 964pts/1 S+ 14.24 0.0 grep postgresql

    ```


    This output tells us that the only process ps found running for PostgreSQL was
    the command we ran for it, so there is no PostgreSQL data-base running on this
    system presently.


    Now, let''s update our rc.d to have PostgreSQL run automatically at boot:


    ```

    kali> update-rc.dpostgresql defaults

    ```'
  merge: -1
