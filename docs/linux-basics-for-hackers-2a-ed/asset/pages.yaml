    and the configuration files.


    You may have noticed the line The following packages were automatically installed
    and are no longer required in the output. To keep things small and modular, many
    Linux packages are broken into software units that many programs might use. When
    you installed ufw, you installed several dependencies or libraries with it ufw
    requires in order to run. Now that you are removing ufw, those other libraries
    or dependencies are no longer required, so they are removed.


    # # Updating Packages


    Software repositories will be periodically updated with new software or new versions
    of existing software. These updates do not reach you automatically, so you have
    to request them in order to apply these updates to your own system. Updating is
    not the same as upgrading: updating updates the list of packages available for
    download from the repository, whereas upgrading upgrades you to the latest version
    in the repository.


    You can update your individual system by entering the apt command followed by
    the update. This will search all the packages on your system and check whether
    updates are available. If so, the updates are downloaded.


    ```

    kali> sudo apt update

    [sudo] password for kali:

    Get:1: http://mirrors.of.berkeley.edu/kali kali-rolling InRelease [30.5kb]

    Get:2: http://mirrors.of.berkeley.edu/kali-rolling/main amd64 Packages [14.9MB]

