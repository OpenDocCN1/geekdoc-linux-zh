  md: '# # 2

    TEXT MANIPULATION


    ![](img/7f106d14d88c19c5eac20858e43b615b_56_0.png)


    In Linux, nearly everything you deal with directly is a file, and most often these
    will be text files; for instance, all configuration files in Linux are text files.
    So, to reconfigure an application, you simply open the configuration file, change
    the text, save the file, and then restart the application—your reconfiguration
    is complete.


    With so many text files, manipulating text becomes crucial in managing Linux and
    Linux applications. In this chapter, you will use several commands and techniques
    for manipulating text in Linux.


    For illustrative purposes, I''ll use files from the world''s most widely used
    web server, apache2. The free and open source apache2 web server is used by some
    of the busiest websites in the world, such as spotify.com, dropbox.com, netflix.com,
    tencent.com, bbc.com, and many others. It''s installed by default on your Kali
    system (we''ll be doing more with the apache2 web server in Chapter 12).'
