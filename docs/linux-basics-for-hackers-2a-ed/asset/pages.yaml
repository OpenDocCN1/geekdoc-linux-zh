  md: '# 5


    # CONTROLLING FILE AND

    DIRECTORY PERMISSIONS


    ![](img/7f106d14d88c19c5eac20858e43b615b_88_0.png)


    Not every user of a single operating system should have the same level of access
    to its files and directories. Like any professional or enterprise-level operating
    system, Linux has methods for securing file and directory access. This security
    system allows the system administrator—the root user—or the file owner to protect
    their files from unwanted access or tampering by granting select users permissions
    to read, write, or execute files. For each file and directory, we can specify
    the permission status for the file''s owner, for particular groups of users, and
    for all other users. This is a necessity in a multiser, enterprise-level operating
    system that requires permissions. The alternative would be chaotic.


    In this chapter, I''ll show you how to check for change permissions on files and
    directories for select users, how to set default file and directory permissions,
    and how to set special permissions. Finally, you will see how a hacker''s understanding
    of permissions might help them exploit a system.'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Different Types of Users


    As you know, in Linux the root user is all-powerful. The root user can do basically
    anything on the system. Other users on the system have more limited capabilities
    and permissions and almost never have the access that the root user has.


    These other users are usually collected into groups that generally share a similar
    function. In a commercial entity, these groups might consist of such finance,
    engineering, sales, and so on. In an IT environment, these groups might include
    developers, network administrators, and database administrators. The idea is to
    put people with similar needs into a group that is granted relevant permissions;
    then each member of the group inherits the group permissions. This is primarily
    for the ease of administering permissions and, security.


    The root user is part of the root group by default. Each new user on the system
    must be added to a group in order to inherit the permissions of that group.


    # Granting Permissions


    Each and every file must be allocated a particular permission level for the different
    identities using it. The three levels of permission are as follows:


    +   * Permission to read grants permission only to open and view a file.

    * Permission to write allows users to view and edit a file.

    * Permission to execute allows users to execute a file (but not necessarily view
    or edit it).


    In this way, the root user can grant users a level of permission depending on
    what they need the files for. When a file is created, the user who created it
    is typically the file''s owner, and the owning group is the user''s current group.
    The owner of the file can grant various privileges to it. Let''s look at how to
    change permissions to pass ownership to individual and to groups.


    # Granting Ownership to an Individual


    To move ownership of a file to a different user so that they have the ability
    to control permissions, we can use the chown (or change owner) command:


    ```

    kali > chown bob:tmp/bobsfile

    ```


    Here, we give the command, the name of the user we are giving ownership to, and
    then the location and name of the relevant file. This command grants the user
    account for Bob ownership of bobsfile.'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Granting Ownership to a Group


    To transfer ownership of a file from one group to another, we can use the `chgrp
    (change group) command.

    Hackers are often more likely to work alone than in groups, but it''s not unheard
    of several hackers and pentesters to work together on a project, and in that case,
    using groups is necessary. For instance, you might have a group of pentesters
    and a security team members working on the same project. The pentesters in this
    example are the root group, meaning they have all permissions and access. The
    root group needs access to the hacking tools, whereas the security folks only
    need access to defensive tools such as an intrusion detection system (IDS).

    Let''s say the root group downloads and installs a defensive program named newIDS;
    they will then need to transfer ownership to the security group so the security
    group can use it at all. To do so, the root group can enter the following command:


    ```

    kali> sudo chgrp security newIDS

    ```


    This command passes the security group ownership of newIDS. Now you need to know
    how to check whether these allocations have worked. You''ll do that by checking
    a file''s permissions.


    # Checking Permissions


    When you want to find out what permissions are granted to users for a file or
    directory, use the ls -l (long) switch to display the contents of a directory
    in long format. This list will contain the permissions. The following example
    shows the ls -1 command on the file /usr/share/hashcat (one of my favorite password-cracking
    tools) in order to see what we can learn from the following:


    ```

    kali> ls -l /usr/share/hashcat

    t32952

    drwxr-xr-x 5 root root 4096 Dec 5 10:47 charsets

    -rw-r--r-- 1 root root 33685504 June 28 2024 hascat,hcstat

    -rw-r--r-- 1 root root 33685504 June 28 2024 hascat,hctune

    drwxr-xr-x 2 root root 4096 Dec 5 10:47 masks

    drwxr-xr-x 2 root root 4096 Dec 5 10:47 OpenCL

    drwxr-xr-x 3 root root 4096 Dec 5 10:47 rules

    ```


    On each line, we get information about:


    +   - The file type (this is the first character listed)

    - The file''s permissions for the owner, groups, and users, respectively (this
    is the rest of this section)'
  merge: -1
  pgno: 90
- img_proc: true
  md: '+   - The number of links (a topic that is beyond the scope of the book)

    - The owner of the file

    - The size of the file in bytes

    - The time at which the file was created or last modified

    - The name of the file


    For now, let''s focus on the seemingly incomprehensible strings of letters and
    dashes on the left edge of each line. These tell us whether an item is a file
    or what permissions, if any, are on it.

    The first character tells you the file type, where d stands for a directory and
    a dash (-) indicates a file. These are the two most common file types.

    The next section defines the permissions on the file. There are three sets of
    characters, made of some combination of (r), w ( and execute (x), in that order.
    The first set represents the permissions of the owner; the second, of the group;
    and the last, of all other users.

    Regardless of which three letters you are looking at, for files, if you see an
    r, that user or group of users has permission to open and read file or directory.
    As w at the middle means they can modify the file, and an x at the end means they
    can execute (or run) the file or directory. If any r, w, or x is replaced with
    a dash (-), the respective permission has not been given. Note that users have
    permission to execute either binaries or scripts.

    Use the third line of that as an example:


    ```

    -rw-r--r-- root root 33685504 June 28 2024 hascat.hcstat

    ```


    The file is called, as we know from the right end of the line, hascat.hcstat.
    After the initial - (which indicates it''s a file), the permissions rw- tell us
    that the owner has read and write permissions but not execute permission.

    The next set of permissions (r--) represents those of the group and shows that
    the group has read permission but not write or execute permissions. And, finally,
    we see that the rest of the users also have only read permission (r--).

    These permissions aren''t set in stone. As a root user or file owner, you can
    change them. Next, we''ll do just that.


    # Changing Permissions


    We can use the Linux command chmod (or change mode) to change the permissions.
    Only a root user or the file''s owner can change permissions.

    In this section, we use chmod to change permissions on hascat.hcstat using two
    different methods. First, we use a numerical representation of permissions, and
    then we use a symbolic representation.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Changing Permissions with Decimal Notation


    We can use a shortcut to refer to permissions by using a single number to represent
    one set of permissions. Like everything underlying the operating system, permissions
    are represented in binary, so ON and OFF are represented by 1 and 0, respectively.
    You can think of the permissions as three ON/OFF switches, so when all permissions
    are granted, this equates to 7 in binary.


    We can then easily represent a binary set like this as a single digit by converting
    it into octal, an eight-digit number system that starts with 0 and ends with 7.
    An octal digit represents a set of three binary digits, meaning we can represent
    an entire rwx set with one digit. Table 5-1 contains all possible permissions
    and their octal and binary representatives.


    Table 5-1: Octal and Binary Representations of Permissions


    | Binary | Octal | rwx |

    |---|---|---|

    | 000 | 0 | -- |

    | 001 | 1 | --x |

    | 010 | 2 | -w- |

    | 011 | 3 | -wx |

    | 100 | 4 | r-- |

    | 101 | 5 | r-x |

    | 110 | 6 | rw- |

    | 111 | 7 | rwx |


    Using this information, let''s go through some examples. First, if we want to
    set only the read permission, we could consult Table 5-1 and locate the value
    for read:


    ```

    r w x

    4 - -

    ```


    Next, if we want to set the permission to rw-, we could use the same methodology
    and look for what sets the w and what sets the x:


    ```

    r w x

    2 - 1

    ```


    Notice in Table 5-1 that the octal representation for -wx is 3, which is so coincidentally
    happens to be the same value when we add the two values for setting w and x individually:
    2 + 1 = 3.


    Finally, when all three permissions are on, it looks like this:


    ```

    r w x

    4 2 1

    ```'
  merge: -1
  pgno: 92
- img_proc: true
  md: 'And 4 + 2 + 1 = 7. We see that in Linux, when all the permission switches are
    on, they are represented by the octal equivalent of 7. So, if we wanted to represent
    all permissions for the owner, group, and all users, we could write it as follows:


    # 7 7


    Here''s where the shortcut comes in. By passing chmod three octal digits (one
    for each user), followed by a filename, we can change permissions on the file
    for each type of user. Enter into your command line:


    ```

    kali sudo chmod 774 hashcat.hcstat

    ```


    Looking at Table 5-1, we can see that this statement gives the owner all permissions,
    the group all permissions, and everyone else only the read permission.


    Now we can see whether permissions have changed by running ls -l on the directory
    and looking at the hashcat.hcstat line. Navigate to the directory and run that
    command:


    ```

    kali ls -l

    total 32952

    drwxr-xr-x 5 root 4096 Dec 05 10:47 charsets

    -rwxr-xr-x 1 root 3368504 June 28 2024 hashcat.hcstat

    -rw-r--r 1 root 3368504 June 28 2024 hashcat.hctune

    drwxr-xr-x 2 root 4096 Dec 05 10:47 masks

    drwxr-xr-x 2 root 4096 Dec 05 10:47 OpenCL

    drwxr-xr-x 3 root 4096 Dec 05 10:47 rules

    ```


    You should see -rwxrxrxr-- on the left side of the hashcat.hcstat line. This confirms
    that the chmod call successfully changed permissions on the file to give both
    the owner and the group ability to execute the file.


    # Changing Permissions with UGO


    Although the numeric method is probably the most common method for changing permissions
    in Linux, some people find chmod''s symbolic method more intuitive. Both methods
    work well equally, so choose the one that suits you (or owner), group, and others.


    UGO syntax is very simple. Enter the chmod command followed by the users you want
    to change permissions for: user, g for group, or o for others, and of three operators:


    +   - Removes a permission

    - Adds a permission

    - Sets a permission


    After the operator, include the permission you want to add or remove (rw*) and,
    finally, the name of the file to apply it to. For example, if you'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'want to remove the write permission from the user that the file hashcat

    .hestcat belongs to, you could enter the following:


    ```

    kali> sudo chmod u-w hashcat.hstat

    ```


    This command says to remove (-) the write (w) permission from hashcat

    .hestcat for the user (w).


    Now when you check the permissions with ls -l again, you should see

    that the hashcat.hestcat file no longer has permission for the user:


    ```

    kali> ls -l

    total 32952

    drwxr-xr-x 5 root root 4096 Dec 5 10:47 charsets

    -r-xr-x-- 1 root root 3368504 June 28 2024 hashcat.hstat

    -rw-r--r-- 1 root root 3368504 June 28 2024 hashcat.htune

    drwxr-xr-x 2 root root 4096 Dec 5 10:47 masks

    drwxr-xr-x 2 root root 4096 Dec 5 10:47 OpenCL

    drwxr-xr-x 3 root root 4096 Dec 5 10:47 rules

    ```


    You can also change multiple permissions with just one command. If

    yant to give both the user and other users (not including the group)

    the execute permission, you could enter the following:


    ```

    kali> chmod u+x, o+x hashcat.hstat

    ```


    This command tells Linux to add the execute permission for the user

    as well as the execute permission for others for the hashcat.hstat file.


    # Giving Root Execute Permission on a New Tool


    As a hacker, you will need to download hacking tools, but because

    Linux automatically assigns all files and directories default permissions

    of 666 and 777, respectively, you won''t be able to execute a file immediately

    after downloading it. If you try, you''ll usually get a message that says some-

    thing "Permission denied." In these cases, you''ll need to give yourself

    and execute permissions using chmod in order to execute the file.


    For example, say we download a hacker tool called newhackertool

    and place it into the root user''s directory (/).


    ```

    kali> ls -l

    total 80

    drwxr-xr-x 7 root root 4096 Dec 5 11:17 Desktop

    drwxr-xr-x 7 root root 4096 Dec 5 11:17 Documents

    drwxr-xr-x 7 root root 4096 Dec 5 11:17 Downloads

    drwxr-xr-x 7 root root 4096 Dec 5 11:17 Music

    -rw-r--r-- 1 root root 1072 Dec 5 11:17 newhackertool

    drwxr-xr-x 7 root root 4096 Dec 5 11:17 Pictures

    drwxr-xr-x 7 root root 4096 Dec 5 11:17 Public

    drwxr-xr-x 7 root root 4096 Dec 5 11:17 Templates

    drwxr-xr-x 7 root root 4096 Dec 5 11:17 Videos

    ```'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'We can see newhackertool, along with the rest of the contents of the root directory.
    We can see that our newhackertool doesn''t have execute permission for anyone.
    This makes it impossible to use. It might seem strange that, by default, Linux
    won''t let you execute a file you downloaded, overall, this makes your system
    more secure.


    We can give permission to execute newhackertool by entering the following:


    ```

    kali> sudo chmod 766 newhackertool

    ```


    Now, we perform a long listing on the directory, we can see that our newhackertool
    has execute permission for the owner:


    ```

    root@kali ~1 ls -l

    total 88

    --snip--

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Music

    drwxr-rw-w 7 root root 1072 Dec 5 11.17 newhackertool

    drwxr-xr-x 7 root root 4096 Dec 5 11.17 Pictures

    --snip--

    ```


    This grants us (as the owner) all permissions, including execute, and grants the
    group and everyone else only read and write permissions (4 + 2 = 6).


    # Setting More Secure Default Permissions with Masks


    As previously mentioned, Linux automatically assigns base permissions (usually
    666 for files and 777 for directories). You can change the default permissions
    allocated to files and directories created by each user with the umask (or file-creation
    mask) method. The umask represents the permissions you want to remove from a file
    or directory to make them more secure.


    The umask is a three-digit octal number corresponding to the three permissions;
    this number is subtracted from the permissions number to give the new permissions
    status. This means that when a new file or directory is created, the permissions
    are set to the default value minus the value in umask, as shown in Figure 5-1.


    | New files | New directories | |

    |---|---|-|

    | 666 | 777 | Linux base permissions |

    | -022 | -022 | umask |

    | 644 | 755 | Resulting permissions |


    Figure 5-1: How a umask value of 022 affects the permissions on new files and
    directories'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'For example, if the umask is set to 022, a new file with the original default
    permissions of 666 will now have the permissions 644, meaning the owner has both
    read and write permissions, and the group and all other users have only read permission.


    In Kali, with most Debian systems, the umask is preconfigured to 022, meaning
    the Kali default is 644 for files and 755 for directories.


    The umask value is not universal to all users on the system. Each user can set
    a default umask value for the files and directories in their personal .profile
    file. To see the current value when logged in as a certain user, simply enter
    the command umask and note what is returned. To change the umask value for that
    user, edit the file /home/username/.profile and, for example, add umask 007 to
    set it only the user and members of the user''s group permissions.


    # Special Permissions


    In addition to the three general-purpose permissions, Linux has three special
    permissions that are slightly more complicated. These special permissions are
    set user ID (or SUID), set group ID (or SGID), and stick by it. You''ll discuss
    each in turn in the next three sections.


    # Granting Temporary Permissions with SUID


    As you should know now, a user can execute a file only if they have permission
    to execute that particular file. If the user has only read and/ write permissions,
    they cannot execute the file. This may seem strange, but there are exceptions
    to this rule.


    You may have encountered files that require the permissions of the root user during
    execution, even for users who are not root. A file that allows users to change
    their password would need access to the /etc/shadow file, which holds the users''
    passwords in Linux, and so requires root-user privileges to execute.


    In such a case, you can temporarily grant the owner''s privileges to execute the
    file by setting the SUID bit on the program. Basically, the SUID says any user
    can execute the file with the permissions of the owner but those permissions do
    not extend beyond the use of that file.


    To set the SUID bit, enter a 4 before the regular permissions. For example, a
    file with a new resulting permission of 644 is represented as 4644 when the SUID
    bit is set. Setting the SUID on a file is not something a typical user would do,
    but if you want to do so, you''ll use the chmod command, as in chmod 4644 filename.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# Granting the Root User''s Group Permissions SGID


    The SGID bit also grants temporary elevated permissions, but it grants the permissions
    of the file owner''s group, rather than that of the owner. This means that, with
    an SGID bit, someone without execute permission can execute a file if the owner
    belongs to the group that has permission to execute that.


    The SGID bit works slightly differently when applied to a directory: when the
    bit is set on a directory, ownership of new files created in that directory goes
    to the directory creator''s group, rather than the file creator''s group. This
    is very useful when a directory is shared by multiple users, as all users in that
    group, not just a single user, can execute the files.


    The SGID bit is represented as 2 before the regular permissions, so a new file
    with the resulting permissions 644 would be represented as 2644 when the SGID
    bit is set. Again, you will use the chmod command for this—example, chmod 2644
    filename.


    # The Outdated Sticky Bit


    The sticky bit is a permission that you can set on a directory to allow a user
    to delete or rename files within that directory. However, the sticky bit is a
    legacy of older Unix systems, and modern systems (like Linux) ignore it. As such,
    I will not discuss it here, but you should be familiar with the term you might
    hear it in the Linux world.


    # Special Permissions, Privilege Escalation, and the Hacker


    As a hacker, you can use these permissions to exploit Linux systems through privilege
    escalation, where a regular user gains root or sysadmin privileges and the associated
    permissions. With root privileges, you can do anything on the system.


    One way to do this is to exploit the SUID bit. A system administrator or software
    developer might set the SUID bit on a program to allow that access to files with
    root privileges. For instance, scripts that change passwords often have the SUID
    bit set. Then, the hacker can use permission to gain temporary root privileges
    and do something malicious, as get access to the passwords at /etc/shadow.


    Let''s look for files with the SUID bit set on our Kali system to try this out.
    Back in Chapter 1, I introduced you to the find command. We''ll use its power
    to find files with the SUID bit set.


    As you''ll remember, the find command is powerful, but the syntax is more complicated
    than some of the other location commands, such as locate and. Take a moment to
    review the find syntax in Chapter 1 if you need to.


    In this case, we want to find files anywhere on the filesystem, for the root user
    or other sysadmin, with the permissions 4000. To do this, we can use the following
    command:


    ```

    kali> sudo find / -user root -perm -4000

    ```'
