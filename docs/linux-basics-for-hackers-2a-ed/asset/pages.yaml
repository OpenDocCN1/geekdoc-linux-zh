  md: '# INTRODUCTION


    ![](img/7f106d14d88c19c5eac20858e43b615b_24_0.png)


    Hacking is the most important skill set of the 21st century! I don’t make that
    statement lightly. In recent years, every morning’s headlines reaffirm it. Nations
    spy on one another to gain secrets, cybercriminals steal billions of dollars,
    digital worms demand ransoms from their victims, adversaries influence each other’s
    elections, and combatants take down each other’s utilities. Consider the cyberwar
    between Ukraine and Russia as an example. These events are all the work of hackers,
    and we’re only beginning to understand their power in our increasingly digital
    world.


    I decided to write this book after working with tens of thousands of aspiring
    hackers through Null-Byte, Hackers Arise (https://www.hackers-arise.com), and
    nearly every branch of the US military and intelligence agencies'
  merge: -1
  pgno: 24
- img_proc: true
  md: '(including the NSA, DIA, CIA, and FBI). These experiences taught me that many
    aspiring hackers have little or no experience with Linux, and this lack of experience
    is the primary barrier to their starting journey to becoming professionals. Almost
    all the best hacker tools are written in Linux, so you''ll need some basic Linux
    skills as a prerequisite to becoming an experienced, hacker. I have written this
    book to help you get over this barrier.


    H is an elite profession within the IT field. As such, it requires an extensive
    and detailed understanding of IT concepts and technologies. The most fundamental
    level, Linux is a requirement. I strongly suggest you invest time and energy into
    understanding it if you want to make hacking and information security your career.


    This book is not intended for the experienced hacker or Linux admin. Instead,
    it is intended for those who want to get started along the exciting path of hacking,
    cybersecurity, and pentesting. It is also intended not as a complete treatise
    on Linux or having rather a starting point into these worlds. With the essentials
    of Linux and extends into some basic scripting in both bash and Python. Wherever
    appropriate, I use examples to teach you these Linux principles.


    In this introduction, we''ll look at the growth of ethical hacking for information
    security, and I''ll take you through the process of installing a virtual machine
    so you can install Kali Linux on your system without disturbing the operating
    system you are already running.


    # What''s in This Book


    In the first set of chapters, you''ll become comfortable with the fundamentals
    of Linux. Chapter 1 will get you to use the filesystem and the terminal, and give
    you some basic commands. Chapter 2 shows you how to manipulate text to find, examine,
    and alter software and files.


    In Chapter 3, you manage networks. You''ll scan for networks, find information
    on connections, and disguise yourself by masking your network and DNS information.


    Chapter 4 teaches you to add, remove, and update software, and how to keep your
    system streamlined. In Chapter 5, you will manipulate file and directory permissions
    to control who can access what. You''ll also learn some privilege escalation techniques.


    Chapter 6 teaches how to manage services, including starting and stopping processes
    and allocating resources to give you greater control. Chapter 7, you will manage
    environment variables for optimal performance, convenience, and even stealth.
    You''ll find and filter variables, change your PATH variable, and create new environment
    variables.


    Chapter 8 introduces you to bash scripting, a staple for any serious hacker. You''ll
    learn the basics of bash and build a script to target ports that you may infiltrate.


    Chapters 9 and 10 give you some essential filesystem management skills, showing
    you how to compress and archive files to keep your system'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'clean, copy entire storage devices, and get information on files and con-

    nected disks.


    The latter chapters dig deeper into hacking topics. In Chapter 11,

    You''ll use and manipulate the logging system to get information on a tar-

    get activity and cover your tracks. Chapter 12 shows you how to use\and abuse
    three Linux servers: Apache web server, OpenSSH, and

    MySQL. You''ll create a web server, build a remote video spy, and learn

    out databases and their vulnerabilities. Chapter 13 will show you how to

    secure and anonymous with proxy servers, the Tor network, virtual pri-

    networks, and encrypted email.


    Chapter 14 deals with wireless networks. Learn commands, then crack Wi-Fi access
    points and detect and connect

    toBluetooth signals.


    Chapter 15 dives deeper into Linux with a high-level view of

    the kernel works and how its drivers are bound to deliver malicious soft-

    are. In Chapter 16, you''ll learn essential scheduling skills in order to auto-

    m your hacking scripts. Chapter 17 will teach you Python concepts,

    and you''ll script hacking tools: a scanner to spy on TCP/IP connections

    and a simple password cracker. Chapter 18 explores the intersection of

    hacking and artificial intelligence, introducing basic concepts and demon-

    ating how AI can assist in cybersecurity.


    # What Is Ethical Hacking?


    With the growth of the information security field in recent years has

    dramatic growth in the field of ethical hacking, also known as white hat

    (good) hacking. Ethical hacking is the practice of attempting to infil-

    trate and exploit a system in order to find out its weaknesses and

    secure it. I segment the field of ethical hacking into two primary comp-

    ents: penetration testing for a legitimate information security firm and

    working for your nation''s military or intelligence agencies. Both are rapidly\growing
    areas, and demand is strong.


    # Penetration Testing


    As organizations become increasingly conscious and the cost of

    security breaches rises exponentially, many large organizations are begin-

    ing to contract out security services. One of these key security services is\penetration
    testing. A penetration test is essentially a legal, commissioned

    hack to demonstrate the vulnerability of a firm''s network and systems.


    Generally, organizations conduct a vulnerability assessment to find

    pot vulnerabilities in their network, operating systems, and services.

    emphas potential, as this vulnerability scan includes a significant number

    of false positives (things identified as vulnerabilities that are really not).
    It

    is the role of the penetration tester to attempt to hack, or penetrate,

    vulnerabilities. Only then can the organization know whether the vulner-

    ability is real and decide to invest time and money to close the vulnerability.'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Military and Espionage


    Nearly every nation on Earth engages in cyber espionage and cyber warfare. The
    cyber in Ukraine has brought cyberwar to the forefront of everyone''s consciousness,
    as hackers worldwide have supported Ukraine''s efforts to remain free. (The hackers
    at https://www.hackers-arxiv.com have played a crucial role in this cyberwar.)
    In heated times, one only needs to scan headlines to see that governments use
    cyber tactics to spy, and even attack, military and industrial systems.


    Over time, the impact of hacking in these military and intelligence-gathering
    activities will become only more significant. Imagine a the future in which hackers
    can gain access to their adversary''s war plans and knock out their electric grid,
    oil refineries, and water systems. In such a world, the hacker becomes a key component
    of their nation''s defense.


    # Why Hackers Use Linux


    So, why do hackers use Linux over other operating systems? Mostly because Linux
    offers a far higher level of control via a few different methods.


    # Linux Is Open Source


    Unlike Windows, Linux is open source, meaning that the source code of the operating
    system is available to you. As such, you can change and manipulate it as you please.
    If you are trying to make a system operate in ways it was not intended to, being
    able to manipulate the source code is essential.


    # Linux Is Transparent


    To hack effectively, you must know and understand your operating system and, to
    a large extent, the operating system you are attacking. Linux is totally transparent,
    meaning we can see and manipulate all its working parts.


    Not so with Windows. Microsoft tries hard to hide the inner workings of its operating
    systems, so you never really know what''s going on "under the hood," whereas in
    Linux, you have a spotlight shining directly on each and every component of the
    operating system. This makes working with Linux more effective.


    # Linux Offers Granular Control


    Linux is granular. That means that you have an almost infinite amount of control
    over the system. In Windows, you can control only what Microsoft allows you to.
    In Linux, everything can be controlled by the terminal, at the most minuscule
    level or the most macro level. In addition, Linux makes scripting in any of the
    scripting languages simple and effective.


    # Most Hacking Tools Are Written for Linux


    Well over 90 percent of all hacking tools are written for Linux. There are exceptions,
    of course, such as Cain and Abel and Wikto, but those'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'exceptions prove the rule. Even when hacking tools such as Metasploit nmap
    are ported for Windows, not all capabilities transfer from Linux.


    # The Future Belongs to Linux/Unix


    This might seem like a radical statement, but I firmly believe that the future
    of information technology belongs to Linux and Unix systems. Microsoft had its
    day in the 1980s and 1990s, but its growth is slowing.


    Since the internet began, Linux/Unix has the operating system of choice for web
    servers due to its stability, reliability, and robustness. Even today, Linux/Unix
    is used in two-thirds of web servers and dominates the market. Embedded systems
    in routers, switches, and other devices almost always use a Linux kernel, and
    the world of virtualization is dominated by Linux, with both VMware and Citrix
    built on the Linux kernel.


    Over 80 percent of mobile devices run Linux/Unix (iOS and Android is Linux), if
    you believe that the future of computing lies in mobile devices as tablets and
    phones (it would be hard to argue otherwise), then the future is Linux/Unix. Microsoft
    Windows has 7 percent of the mobile devices market. That is the wagon you want
    to be hitched to?


    # Downloading Kali Linux


    Before getting started, you need to download and install Kali Linux on your computer.
    This is the Linux distribution we will be working with throughout this book. Linux
    was first developed by Lin Torvalds in 1991 as an open source alternative to Unix.
    Since it is open source, volunteer developers code the kernel, the utilities,
    and the applications. This means there is no overriding corporate entity overseeing
    development, and as a result, conventions and standardization are lacking.


    Kali Linux was developed by Offensive Security as a hacking operating system built
    on a distribution of Linux called Debian. There are probably most familiar with
    Ubuntu as a popular desktop distribution of Linux. Ubuntu is also built on Debian.
    Other distributions include Red Hat, CentOS, Arch, and SUSE. Although they all
    share the same Linux kernel (the heart of each) has its own utilities, applications,
    and graphical interface (GNOME, KDE, and others) for different purposes. As a
    result, each of these distributions of Linux looks and feels different. Kali was
    designed for penetration testers and hackers comes with a significant complement
    of hacking tools.


    I strongly recommend that you use Kali for this book. If you use another distribution,
    you will likely have to manually download and install the various tools we will
    be using, which could mean many hours of downloading and installing software.
    In addition, if that distribution is not built on Debian, there may be other minor
    differences. You can download and install Kali from https://www.kali.org.'
  merge: -1
  pgno: 28
