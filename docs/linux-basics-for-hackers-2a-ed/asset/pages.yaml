  md: '# # Oracle VirtualBox Manager


    ![](img/7f106d14d88c19c5eac20858e43b615b_31_0.png)


    # The VirtualBox Manager


    As we will be a new VM with Kali Linux, click New at the top. This opens the Create
    Virtual Machine dialog.


    Give your machine name (any name is okay, but I simply used Kali) and select Linux
    from the Type drop-down menu. Finally, select Debian (64-bit) from the third drop-down
    menu (unless you are using the 32-bit version of Kali, in which case you''ll see
    a screen for selecting how much RAM you want to allocate to this new VM.


    As a rule of thumb, I don''t recommend using more than 25 percent of your system
    RAM. That means if you''ve installed 4GB on your physical or host system, then
    select 1GB for your VM, and if you have 16GB on your physical system, then select
    4GB (or 4096MB). The more RAM you give your VM, the better and faster it will
    run, but you must also leave enough RAM for your host operating system and any
    other VMs you might want to run simultaneously. Your VMs will not use RAM when
    they are inactive, but they will use hard drive space.


    Click Next, and you''ll get to the Hard disk screen. Choose Virtual Hard and click
    Create. You should agree which hard disk file type to use. Select the suggested
    default of VDI.


    In the next screen, you can decide whether the hard drive you are creating to
    be allocated dynamically or at a fixed size. If you choose Dynamically Allocated,
    the system will not take the maximum size you allocate for the virtual hard disk
    until you need it, saving unused disk space for your host system. I suggest you
    select dynamically allocated.


    Click Next, and you''ll choose the amount of hard drive space to allocate to the
    VM and the location of the VM (See Figure 3).'
  merge: -1
  pgno: 31
