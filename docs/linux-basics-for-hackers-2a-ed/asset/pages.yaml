  md: 'With this command, we ask Kali to start looking at the top of the file-system
    with the /syntax. It looks everywhere below / for files that are owned by root,
    specified with user root, and that have the SUID permission bit set (-perm -4000).\When
    we run this command, we get the following output:


    ```

    /usr/bin/chsh

    /usr/bin/gpasswd

    /usr/bin/pkexec

    /usr/bin/sudo

    /usr/bin/passwd

    /usr/bin/kismet_capture

