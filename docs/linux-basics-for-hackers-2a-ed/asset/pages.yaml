    # File Creation with touch


    The second command for file creation is touch. This command was originally developed
    so a user could simply touch a file to change some of its details, such as the
    date it was created or modified. However, if the file doesn''t already exist,
    this command creates that file by default.

    Let''s create newfile with touch:


    ```

    kali> touch newfile

    ```


    Now when I use ls -l to see the long list of the directory, I see that a new file
    has been created named newfile. Note that its size is 0 because there is no content
    in newfile.


    # Creating a Directory


    The command for creating a directory in Linux is mkdir, a contraction of make
    directory. To create a directory named newdirectory, enter the following command:


    ```

    kali> mkdir newdirectory

    ```


    To navigate to this newly created directory, simply enter this:


    ```

    kali> cd newdirectory

    ```


    # Copying a File


    To copy files, use the cp command. This creates a duplicate of the file in the
    new location and leaves the old one in place.

    Here, we will create the file oldfile in /home/kali/newdirectory, renaming it
    in the process and leaving the original oldfile in place:


    ```

    kali> touch oldfile

    kali> cp oldfile /home/kali/newdirectory/newfile

    ```


    Renaming the file is optional and is done simply by adding the name you want to
    give it to the end of the directory path. If you don''t rename the file you copy
    it, the file will retain the original name by default.

    When we navigate to newdirectory, we see that there is an exact copy of oldfile
    called newfile:


    ```

    kali> cd newdirectory

    kali> ls

    newfile

    ```'
