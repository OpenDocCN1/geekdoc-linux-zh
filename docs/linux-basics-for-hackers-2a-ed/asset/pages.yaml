  md: '# # 14


    UNDERSTANDING AND INSPECTING WIRELESS NETWORKS


    ![](img/7f106d14d88c19c5eac20858e43b615b_190_0.png)


    The ability to scan for and connect to other network devices from your system
    is crucial to becoming a successful hacker, and with wireless technologies like
    Wi-Fi (IEEE 802.11) and Bluetooth being the standard, finding and controlling
    Wi-Fi and Bluetooth connections is key. If someone can hack a wireless connection,
    they can gain entry to a device and access to confidential information. The first
    step, of course, is to learn how to find these devices.


    In Chapter 3, we looked at some basic networking commands in Linux, including
    some of the fundamentals of wireless networking, with a promise of more wireless
    networking to come in Chapter 14. As promised, here we examine two of the most
    common wireless technologies in Linux: Wi-Fi and Bluetooth.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Wi-Fi Networks


    We''ll start with Wi-Fi. In this section, I''ll show you how to find, examine,
    and connect to Wi-Fi access points. Before doing so, let''s go over basic Wi-Fi
    terms and technologies to help you better understand the output from a lot of
    queries we''ll make in this chapter:


    +   - **AP (access point)** This is the device wireless users connect to for internet
    access.

    - **ESSID (extended service set identifier)** This is the same as the SSID, which
    we discussed in Chapter 3, but can be used for multiple APs in a wireless LAN.

    - **BSSID (basic service set identifier)** This is the unique identifier of each
    AP, and it is the same the MAC address of the device.

    - **SSID (service set identifier)** This is the name of the network.

    - **Channels** Wi-Fi can operate on any one of 14 channels (1 to 14). In the United
    States, Wi-Fi is limited to channels 1 to 11.

    - **Power** The closer you are to the Wi-Fi AP, the greater the power, and the
    easier the connection is to track.


    **Security** This is the security protocol used on the Wi-Fi AP that is being
    read. There are three primary security protocols for Wi-Fi. The original, Wired
    Equivalent Privacy (WEP), was badly flawed and easily cracked. Its replacement,
    Wi-Fi Protected Access (WPA), was a bit more secure. WPA2-PSK, which is more secure
    and uses a shared key (PSK) that all users share, is used by nearly all Wi-Fi
    APs (except enterprise Wi-Fi). In recent years, the industry has adopted WPA for
    new APs, which makes it more difficult to crack Wi-Fi passwords.


    **Modes** Wi-Fi can operate in three modes: managed, master, or monitor. You''ll
    learn what these modes mean in the following section.

    **Wireless range** In the United States, a Wi-Fi AP must legally broadcast its
    signal at an upper limit of 0.5 watts. At this power, it has a normal range of
    about 300 feet (100 meters). High-gain antennas can extend this range to as much
    as 20 miles.

    **Frequency** Wi-Fi is designed to operate on 2.4 GHz and 5 GHz. Modern Wi-Fi
    APs and wireless network cards often use both.


    # Basic Wireless Commands


    In Chapter 3, you were introduced to the basic Linux networking command `ifconfig`,
    which lists each activated network interface on your system with some basic statistics,
    including (most importantly) the IP address of each interface. Let''s take another
    look at your results from running `ifconfig` and focus on the wireless connections
    this time. (Please note that if you running Kali from a virtual machine, you will
    need an external USB Wi-Fi adapter such those from Alfa).'
  merge: -1
  pgno: 191
- img_proc: true
  md: '```

    kali ifconfig

    eth0 Linkencap:EthernetWaddr 00:0c:29:ba:82:0

    inet:192.168.181.131 Bcast:192.168.181.255 Mask:255.255.255.0

    --snip--nlo Linkencap:local Loopback

    inet:127.0.0.1 Mask:255.255.0.0

    --snip--

    ```


    The Wi-Fi interface here is shown as wlan0. In Kali Linux, Wi-Fi interfaces are
    usually designated as wlanX, with X representing the number of that interface.
    In other words, the first Wi-Fi adapter on your system would be labeled wlan0,
    the second wlan1, and so on.


    If you want to see your Wi-Fi interfaces and their statistics, Linux has a specific
    command that''s similar to ifconfig dedicated to wireless. That command is iwconfig.
    When you enter it, only your wireless interfaces and their data are displayed:


    ```

    kali iwconfig

    lo wireless extensions

    wlan0 IEEE 802.11bg SSID:off/any

    Mode:Managed Point:Not-Associated Tx-Power=20 dBm

    Retry short limit:7 RTS thr:off Fragment thr:off

    Encryption key:off

    Power Management:off

    ```


    We, we see the wireless interfaces, also known as network cards, and key data
    about them, including the wireless standard utilized, whether the SSID is off,
    and the mode. The mode has three settings: managed, which means it is ready to
    join or has joined an AP; monitor, which means it is ready to act as or is already
    an AP; we''ll discuss a little later in the chapter. We can discover which device
    has associated with it and how its transmit power is, among other things. You
    can tell from this example that wlan0 is in the mode required to connect to a
    Wi-Fi network, but it is not connected to any network yet. We will revisit this
    again once the wireless interface is connected to a Wi-Fi network.


    If you are not certain which Wi-Fi AP you want to connect to, you can see all
    the wireless access points your network card can reach using the iwlist command.
    The syntax for iwlist is as follows:


    ```

    iwlist interface action

    ```


    You can perform multiple actions with iwlist. For our purposes, we''ll use the
    scan to see all the Wi-Fi APs in your area (Note that with a standard antenna,
    your range will be 300 to 500 feet, but this can be extended with an inexpensive
    high-gain antenna.)'
  merge: -1
  pgno: 192
- img_proc: true
  md: '```

    kali> iwlist wlan0 scan

    wlan0  Scan completed:

    Cell 01 - Address: 88:AD:43:75:B3:82

    Channel:1

    Frequency:2.412GHz (Channel 1)

    Quality=70/70 Signal level =-38 dB

    Encryption:key-off

    SSID="Hackers-Arise"

    ```


    The output from this command should include all Wi-Fi APs within range of your
    wireless interface, along with key data about each AP, as the MAC address of the
    AP, the channel and frequency it is operating on, its quality, signal level, and
    whether its encryption is enabled, and its SSID.


    You will need the MAC address of the target AP (BSSID), the MAC address of a client
    (another wireless network card), and the channel the AP is operating on in to
    perform any kind of hacking, so this is valuable information.


    Another command that is very useful in managing your Wi-Fi connections is nmcli
    (the network manager command line interface). The Linux daemon that provides a
    high-level interface for the network interfaces (including the wireless ones)
    is known as the network manager. Generally, Linux users are familiar with this
    daemon from its graphical user interface, but it can also be used from the command
    line.


    We can use the nmcli command to view the Wi-Fi APs near you and their data, as
    we did with iwlist, but this command gives us a little more information. We use
    it in the format nmcli dev networktype, and the type (in this case) is wifi like
    so:


    | SSID MODE CHAN RATE SIGNAL BARS SECURITY |

    | Hackers-Arise Infra 1 54 Mbits/s 100 | | WPA1 WPA2 |

    | Xfinity Infra 1 54 Mbits/s 75 | | WPA2 |

    | TPTV1 Infra 11 54 Mbits/s 44 | | WPA1 WPA2 |


    In addition to displaying the Wi-Fi APs within range and key data about them,
    the SSID, the mode, the channel, the rate of transfer, the signal strength, and
    the security protocols enabled on the device, we can use nmcli to connect to APs.
    The syntax to connect to an AP is as follows:


    ```

    nmcli dev connect AP-SSID password Apppassword

    ```'
