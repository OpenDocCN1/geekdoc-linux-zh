- img_proc: true
  md: '"silently," meaning without showing any output, you can simply remove the -v
    (verbose) switch, as shown here:


    ```

    kali tar -xf HackersArise.tar

    ```


    The files have been extracted into the current directory; you can do a long listing
    on the directory to double-check. Note that by default, if an extracted file exists,
    tar will remove the existing file and replace it with the extracted file.


    # Compressing Files


    Now we have one archived file, but that file is bigger than the sum of the original
    files. What if you want to compress files for ease of transport? Linux has several
    commands capable of compressing files:


    +   - gzip, which uses the extension .tar.gz or .gz

    - bzip2, which uses the extension .tar.bz2

    - compress, which uses the extension .tar.z


    These commands are all capable of compressing our files, but they use different
    compression algorithms and have different compression ratios. Therefore, we''ll
    look at each one and what it''s capable of.


    In general, compress is the fastest, the result files are larger; bzip2 is the
    slowest, the result files are the smallest and gzip falls somewhere between. The
    main reason you, as a hacker, should know all three methods is that when accessing
    other tools, you will run into various types of compression. Therefore, this section
    shows you how to deal with the main methods of compression.


    # Compressing with gzip


    Let''s try (GNU zip) first, as it is the most commonly used compression utility
    in Linux. You can compress HackersArise.tar file by entering the following (making
    sure you''re in the directory that holds the archived file):


    ```

    kali sudo gzip HackersArise.*

    ```


    Notice that we used the wildcard * for the file extension; that the command should
    apply to any file that begins with HackersArisewith any file extension. You will
    use similar notation for the following examples. When we do a long listing on
    the directory, we can see that HackersArise.tar has been replaced by HackersArise.tar.gz,
    and the file size has been compressed to just 3,299 bytes!


    ```

    kali ls -l

    --snip--n--rw-r--r-- 1 root 3299 Nov 27 2024 13:32 HackersArise.tar.gz

    --snip--

    ```'
  merge: -1
