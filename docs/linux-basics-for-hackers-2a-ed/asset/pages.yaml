  md: '# Configuring Some Interesting Options


    Now that we have proxychains working, let''s look at some other options we can
    configure through proxychains4/file. As new we have set up, we are simply using
    a single proxy. However, we can put in multiple proxies and use all of them; we
    can use a limited number from the list; or we can have proxychains change the
    order randomly. Let''s try all these options.


    # Adding More Proxies


    First, let''s add some more proxies to our list. Go back to the site https://geonode.com/free-proxy-list
    and find some more proxy IP addresses. Then add a few of these proxies to your
    proxychains.com/file, like so:


    ```

    [ProxyList]

    # add proxy here...

    socks4 114.134.186.12 22020

    socks4 188.187.190.59 8888

    socks4 181.113.121.158 335551

    ```


    Now save this config file and try running the following command:


    ```

    kali> proxychains firefox www.hackers-arise

    ```


    > You won''t notice any difference, but your packet is now traveling through several
    proxies.


    # Setting Up Dynamic Chaining


    With multiple IPs in our proxychains4/file, we can set up dynamic chaining, which
    runs our traffic through every proxy on our list, and if one of the proxies is
    down or not responding, it automatically goes to the next proxy in the list without
    throwing an error. If we didn''t set this up, a single failing proxy would break
    our request.


    Go back into your proxychains configuration file, and find the dynamic_chain line
    (line 10). Uncomment it, and also make sure you comment out the strict_chain line
    if it isn''t already:


    ```

    # dynamic_chain

    #

    # Dynamic - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    --snip--

    ```


    This will enable dynamic chaining of our proxies, allowing for greater anonymity
    and trouble-free hacking. Save the config file and feel free to try it out.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '# Using Random Chaining


    Our final proxy trick is the random chaining option, where proxchains will randomly
    choose a set of IP addresses from our list and use them to create our proxy chain.
    This means that each time we use proxchains, the proxy will look different from
    the target, making it harder to track our traffic from its source. This option
    is also considered "dynamic" if one of the proxies is down, it will skip to the
    next one.


    Go back inside /etc/proxchains.conf file and comment out the lines dynamic_chain
    and strict_chain by adding a # at the start of each line; then uncomment the random_chain
    line. We can use one of these options at a time, so make sure you comment out
    the other options before using proxchains.


    Next, find and uncomment the line with chain_len and give it a reasonable number.
    This line determines how many of the IP addresses in your chain will be in creating
    your proxy chain:


    ```

    # dynamic_chain

    # Dynamic - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # at least one proxy must be online to play in chain

    #

    # strict_chain

    # Strict - Each connection will be done via chained proxies

    # all proxies chained in the order as they appear in the list

    # all proxies must be online to play in chain

    # otherwise EINTR is returned to the app

    #

    random_chain

    # Random - Each connection will be done via random proxy

    # (or proxy chain, chain_len) from the list.

    # this option is good to test your IDS )


    # Makes sense only if random_chain

    chain_len = 3

    ```


    Here, I have uncommented chain_len and given it a value of 3, meaning proxchains
    will now use three proxies from my list in /etc/proxchains.conf file, choosing
    them randomly and moving onto the next one if a proxy is down. Note that although
    method certainly enhances your anonymity, it also increases the latency of your
    online activities.


    Now that you know how to use proxchains, I say "relative" because there is no
    surefire way to remain anonymous with the NSA and FSB spying on our online activities—but
    we can make detection much harder with the help of proxchains.'
  merge: -1
  pgno: 185
- img_proc: true
  md: '# Concerning Security


    As a last note on proxy security, be sure to choose your proxies wisely: proxychains
    is as good as the proxies you use. If you are intent on remaining anonymous, do
    not use a free proxy, as mentioned earlier. Hackers paid-for proxies that can
    be trusted. In fact, the free proxies are likely selling your IP address and browsing
    history. As Bruce Schneider, the famous cryptographer and security expert, once
    said, "If something is free, you''re not the customer; you''re the product." In
    other words, any free product is likely gathering your data and selling it. Why
    would they offer a proxy for free?


    Although the IP address of your proxy leaving the anonymity, there are other ways
    for surveillance agencies to identify you. For instance, the owner of the proxy
    will know your identity, and pressed enough by espionage or law enforcement agencies
    with jurisdiction, may offer up your identity to protect their business. It is
    important to be aware of the limitations of proxies as a source of anonymity.


    # Virtual Private Networks


    Using a virtual private network (VPN) can be an effective way to keep your web
    traffic relatively anonymous and secure. A VPN is used to connect to an intermediary
    device as a router that sends your traffic to your ultimate destination tagged
    with the IP address of the router.


    Using a VPN can certainly enhance your security and privacy, but it''s not a guarantee
    of anonymity. The internet device you connect to must record or log your IP address
    to be able to properly send the data back to you, so anyone able to access these
    records can uncover information about you.


    The beauty of VPNs is that they are simple and easy to work with. You can open
    an account with a VPN provider and then seamlessly connect to the VPN each time
    you log on to your computer. You use your browser as usual to navigate the web,
    but it will appear to anyone that your traffic is coming from the IP address and
    location of the internet VPN device and not yours. In addition, all traffic between
    you and the VPN device is encrypted, so even your internet service provider can''t
    see your traffic.


    Among things, a VPN can be effective in evading governmentcontrolled content and
    information sensors. For instance, if your national government limits your access
    to websites with a particular political message, you can likely use a VPN based
    outside your country in order to access limit access to their content. Some media
    corporations, such as Netflix, Hulu, and HBO, limit access to their content to
    IP addresses originating from their nation. Using a VPN based in a nation that
    those services allow you to get around those access limitations.'
  merge: -1
