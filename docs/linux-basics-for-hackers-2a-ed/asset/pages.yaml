  md: '# # Installing VirtualBox


    You can download VirtualBox at https://www.virtualbox.org. Click the Download
    link at the page and select the VirtualBox package for your computer''s current
    operating system, which will host VirtualBox VM. Make sure to download the latest
    version. When the download has completed, click the setup file, and you will be
    greeted by a familiar Virtual Wizard. Click Next, and you should be greeted with
    the Custom Setup screen, as in Figure 1.


    ![](img/7f106d14d88c19c5eac20858e43b615b_30_0.png)


    **Figure 1: The Custom Setup dialog**


    > NOTE These instructions were written with Windows in mind. If you''re using
    a Mac, the process may be a little different but you should be able to follow
    along.


    From this screen, simply click Next. Keep clicking Next until you get to the Network
    Interfaces waking screen and then click Yes.

    Click Install to begin the process. During this process, you will likely be prompted
    several times about installing device software. These are the virtual networking
    devices necessary for your VMs to communicate. Click Install for each one.


    When the installation is complete, click Finish.


    # ## Setting Up Your Virtual Machine


    Now let''s get started with your VM. VirtualBox should open once it has installed
    (if not, open it), and you should be greeted by the VirtualBox Manager, as seen
    in Figure 2.'
