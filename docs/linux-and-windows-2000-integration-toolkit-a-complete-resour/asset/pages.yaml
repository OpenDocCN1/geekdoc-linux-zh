  md: '# Why Integrate Linux and Windows 2000?


    # Considerations for Integration


    In the present-day IT world, it''s very much in vogue to adopt one single way
    of getting work or IT operations done. This gives rise to some interesting conversations,
    in which older, legacy operating systems are retired or removed entirely from
    the organization, and all computing is moved over to the new system. CIOs often
    make suspect decisions, influenced by what the market thinks is sexy, or whatever
    vendor makes the biggest impression.


    We used to refer to woo managers over NT as the "Aruba Factor," due mostly to
    the company''s executive steering committee being flown en masse to Aruba for
    a "sales meeting." Novell was definitely in the running to Aruba until this event,
    and then Net-Ware 4.x was deemed to be "too complex" for the companies'' infrastructure.
    Shortly thereafter, the decision was made to go with Windows NT 4.0. We witnessed
    this series of events sent sent e-mails to the Novell marketing department describing
    what happened, and asking them if they wanted to up and try to compete. Judging
    from the lack of a reply, we they did not.


    In my experience at many organizations, either as an administrator, consultant,
    or trainer, things are not always so simple that a corporation can afford to make
    its corporate philosophy one of designating a single system type or operating
    system to be the "chosen one."


    It may sound like an oversimplification, but it seems to me that the best mix
    of systems is the one that does the job for the most population of users, while
    keeping administrative overhead to a minimum. Many organizations will hire an
    IT manager or CIO who has formed an attachment or firm opinion that one OS or
    the other is the best. Deciding up front, and always adhering to that path is
    one way to do things, but it can be disruptive, to say the least. Many a good
    techie has quit his or her position, often after years of hard work for an organization,
    because of the real or perceived bumbling of such a switchover of systems.


    # Software-Driven Needs


    Choosing your application software first and letting that your hardware and OS
    is something that happens less and less days. Although someone who needs a certain
    type of software can still find him or herself "stuck" choosing one OS/hardware
    platform, it is more of an overall set of choices in this day and age.


    There are still some areas where the software drives the hardware and OS, such
    as in engineering, very large databases, reality simulation, certain types of
    Computer Aided Design/Computer Aided Manufacturing (CAD/CAM), to'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Chapter 1


    note a few. While there are a number of mainframes in use there, we are going
    to focus on distributed computing systems.


    I remember a meeting at one organization I was contracting for where a systems
    analysis team came up with a solution for storing and managing their data. From
    the beginning, it sounded pretty good, plausible, and even my boss, a curmudgeon
    from way back. It wasn''t until we got the hardware and software requirements
    that we learned about the costs involved in implementing the system. It would
    have required all personal computers (PCs) to have loaded an IBM ISA card installed
    for host terminal access, and a product called PC Support from IBM to be loaded
    on all others. This was early in the days of Windows NT; Windows 3.1 was still
    widely used and we had there weird 2MB beta diskettes for Windows 95. There were
    already some Terminate-Stay-Resident (TSR) programs that made lower memory a scarce
    resource. Even with Qem and MemMaker, we had problems getting WordPerfect and
    other programs to run. Loading the hardware and software needed to access this
    system would have effectively turned those PCs into terminals. We quickly put
    the kibosh on that proposal and to implement a Web server/database method to access
    the data.


    While there are alternative operating systems out, it really boils down to whether
    you want to use a Unix/Linux or something on the Windows/2000 size. Before all
    the OS/2 zealous and Macintosh Guru''s flame into a crispy critter, let''s take
    the issue of market share into consideration, shall we Macintoshes have a very
    solid and established niche market, but it is small and concentrated, ensures
    enthusiasm almost bordering on religious fervor, and doesn''t make much of a dent
    on corporate operating system policy as a whole. It has to wrankle the Macintosh
    zealous that without Microsoft''s active support, might not be an Apple leaf.


    As an OS/2 veteran, who has taught many times at IBM facilities and was a system
    tester for client server applications at large organizations that ran OS/2 on
    the desktop and server, I feel qualified to comment on its demise! As many more
    people now know, there were some shenanigans that occurred in the Microsoft/IBM
    software battle, but it''s definitely over, and though very technically proficient
    and very stable, OS/2 has been retired, and those who rooted for it since have
    migrated to other camps in the OS arena. R.I.P. It is just to run a VMware session
    with Warp 4.0 installed, just to play with the OS now and then, little nostalgia,
    or a good lesson as to how far we have come!


    # Customer-Driven Needs


    If you work for a software development company (or run one), you have some choices
    to make. In the desktop applications market you can choose between the 5 percent
    (being generous) of Mac users, the 5 (being generous'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Why Integrate Linux and Windows 2000?


    again!) percent of Linux/Unix users, and the 90 percent of Windows users to develop
    software. Strictly voting with one''s pocketbook, the obvious choice is OS/2!
    (Just kidding.) It''s no wonder developers decides to throw more of their resources
    behind the Windows platform; it promises the most income.


    It''s a foolish company that doesn''t listen to the needs of its customers. Sometimes,
    however, it''s not a good thing to pay undue attention to what the customer needs
    now, and think a little ahead to what the customer is going to need then. I define
    “then” as the point that the customer (who can shift alliances and loyalties)
    will look at your options, possibly decide you don''t, that another company offers
    what you do, and switch to their products.


    A good example of this need is a company at which I recently Linux OS classes.
    This company creates large-scale reality simulation software that runs on clustered
    computers to speed the calculations. A customer approached them whether they had
    considered releasing their software for Linux, as they customer had recently calculated
    the cost of refreshing his current Unix cluster. When the software company dug
    a little deeper, their customer revealed it was going to cost him around $5 million
    to update his cluster to leading-edge hardware and software. The customer had
    done some investigating and found that he could have a 50-percent larger cluster,
    including corresponding increase in calculation speed, for around $700,000 using
    Linux as the OS! The software company had been looking into releasing their software
    on Linux, and so had had some betas and other good news for the customer (see
    the section Economic-Driven Needs).


    # Client/Server


    Software and systems expand and contract in a cycle similar to waves on a shore
    or the Big Bang and the Black Hole. It seems every time we finally free ourselves
    from the “glass house” of centralized management and the systems grow to a certain
    level, it''s time to recentralize the control so we can guarantee data integrity,
    central backups, and system uptime!


    One thing we can seemingly depon is on the victory of the PC over the mainframe
    style of computing. Frankly, the days of using serial lines for terminal access
