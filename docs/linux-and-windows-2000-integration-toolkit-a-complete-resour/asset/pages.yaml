- img_proc: true
  md: '# Assigning and Managing IP Address Information


    # Query Functionality for DHCP Server 2000


    DHCP Server 2000 introduces some very exciting new features. DHCP Server wasn’t
    ever hard to use; it just had many options. This new version has an improved MMC
    interface and makes initial setup and configuration simple and easy. What follows
    is a good overview of the more important enhancements.


    # Detecting Rogue DHCP Servers


    Windows 2000 has protection against rogue DHCP servers. When you have an Active
    Directory domain running and DHCP Server is used, there is an object created in
    AD that is the authorization list for DHCP servers in network. Whenever a DHCP
    server is started on that network, it will look for an AD domain, and query that
    object in AD to see if it is allowed to provide DHCP address services on the network.
    If the server is not authorized, the DHCP Server is shut down automatically.


    I (blush) have been the cause of a couple of DHCP “crash and burns” caused from
    installing on a test box on the local network, or firing up my laptop with a test
    scope running. I have talked to a number of other consultants who have done this
    as well!


    # Improvements to the DHCP Manager


    Previous versions had a clunky and nonintuitive interface that made it hard to
    see options and reservations. The new DHCP Manager is MMC-based and walks new
    administrators through a very intuitive Scope Wizard that will produce a fully
    configured server with all needed options for the clients.


    Despite these similarities, there are significant differences in the ways BOOTP
    and DHCP perform client configuration:


    +   - BOOTP supports a limited number of client configuration parameters called
    vendor extensions, while DHCP supports a larger and extensible set of client configuration
    parameters called options.


    +   - BOOTP uses a two-phase bootstrap configuration process in which clients
    contact BOOTP servers to perform address determination and boot file name selection,
    and clients contact Trivial File Transfer Protocol (TFTP) servers to perform transfer
    of their boot image. DHCP uses a single-phase boot configuration process whereby
    a DHCP client negotiates with a DHCP server to determine its IP address and obtain
    any other initial configuration details it needs for network operation.


    +   - BOOTP clients do not rebind or renew configuration with the BOOTP server
    except when the system restarts, while DHCP clients do not require'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'a system restart to rebind or renew configuration with the DHCP server. Instead,
    clients automatically enter the rebinding state at set timed intervals to renew
    their leased address allocation with the DHCP server. The process occurs in the
    background and is transparent to the user.


    # How DHCP 2000 Works

    with DNS 2000


    DHCP Server can be integrated with the Dynamic DNS in Windows 2000 and other operating
    systems. Before this version, anyone using DHCP to assign addresses would have
    been adventurous indeed to enter static records into DNS. They would be doomed
    to be always out of date and cause conflicts. It was recommended to install and
    use the WINS Server to provide a dynamic registration mechanism for DHCP clients.
    Microsoft DNS was able to query the WINS Server for registered hosts and return
    that information to the requester. The process is slow and traffic-intensive,
    but workable.


    In Windows 2000, DHCP servers and/or DHCP clients can register with DNS. This
    can happen in two ways:


    +   - For clients that understand DNS, they can choose to update their records
    themselves.


    +   - For clients that don''t have Dynamic Update functionality, the DHCP Server
    can help them register with DNS.


    DHCP and static DNS service are not compatible for keeping name-to-address mapping
    information synchronized. This might cause problems with using DHCP and DNS together
    on a network if older, static DNS servers are employed that are incapable of interacting
    dynamically when DHCP client configurations change.


    # Leasing Addresses in DHCP


    Similar in function to how we lease an apartment, a machine needs to get an IP
    address from the DHCP Server and to keep it for a given period of time, while
    the server needs to know that the address is leased out, and not only should it
    reserve that address for that period, but that it can reassign that address after
    the period expires.


    # Assigning an IP Address


    Assigning addresses in DHCP is initially a four-step process, called DORA.


    +   1. Client broadcasts a DHCP DISCOVER on the local subnet, looking for a DHCP
    server.'
  merge: -1
  pgno: 167
- img_proc: true
  md: '2. The DHCP server gets the request, selects an appropriate address, broadcasts
    a DHCP OFFER to the client. It sends only the address, which is marked on the
    DHCP server as having offered to that client.


    3. The client samples the other and sends a DHCP REQUEST back to the server requesting
    the address offered.


    4. The DHCP server receives the request, bundles up all the assigned and pertinent
    options for delivery, and broadcasts to the client a DHCP ACK, or Acknowledge,
    packet. The client does not officially have an IP address until this ACK packet
    is received and the information is bound into the IP stack.


    # Using ipconfig and winipcfg


    ipconfig is a TCP/IP utility that you can use at the command prompt. You can use
    the ipconfig command to get information about the configured TCP/IP parameters
    on local or remote computers on the network. For more information on how to use
    the ipconfig command, type ipconfig / at a command prompt. Typical options to
    use include:


    +   /? Display this help message

    /all Display full configuration information

    /release Release the IP address for the specified adapter

    /renew Renew the IP address for the specified adapter

    /flushdns Purge the DNS Resolver cache

    /registerdns Refresh all DHCP leases and re-register DNS names

    /displaydns Display the contents of the DNS Resolver Cache


    winipcfg is a similar utility for Windows 95 and Windows 98 clients.


    # Understanding DHCP Leases


    One drawback in using DHCP in your environment is the capability to timeout the
    assignment of addresses to clients. On networks where clients move frequently
    or are in and at varying intervals, addresses can become horribly out of sync
    with records and cause industrial-strength “Exedrin headaches” for administrators.
    Murphy’s Law of DHCP states that if a duplicate address is going to occur, it
    will most often be a router, switch, or executive’s address that is duplicated,
    causing loss of face and time for the administrator.


    # Lease Timeouts


    In this light, setting a lease time on a scope is a great idea. When the client
    leases the address, the timer is set to whatever the administrator decided.'
  merge: -1
  pgno: 168
- img_proc: true
  md: 'Longer leases will keep DHCP traffic to a minimum, but can become quickly outdated
    and cause you to run out of addresses on a dynamic network. Shorter leases will
    increase traffic needed to confirm leases, but will keep much closer track of
    the pool of available addresses.


    Halfway through a given lease period, the DHCP client requests a lease renewal,
    and the DHCP server extends the lease, while getting any new options. At approximately
    7/8ths of the lease time, if unable to contact the DHCP server, the machine despairs
    and begins the four-packet DORA process again. If a machine is not long enough,
    it will timeout the lease and have an address of 0.0.0.0. The DHCP server will
    keep track of the lease timeout and will return the expired address to the available
    pool for another machine to lease.


    >  DHCP Server now offers a conflict detection option that will see if an address
    is already assigned before offering it to a host. When DHCP server crashes or
    is unavailable, the replacement can use this option to intelligently assign addresses
    without causing utter havoc and hundreds of duplicate addresses on your production
    network!


    # Installing the DHCP Server for Windows 2000


    If you know you are going to need DHCP services, you can always specify that it
    be installed during setup of the server. It''s not a good idea to have installed
    unless you are actually going to use it, as the loaded service will consume a
    certain amount of memory and processor.


    >  While it is actually possible to have a DHCP server that gets its own IP address
    from another DHCP server, it''s pure folly to allow this to happen. You should
    completely configure the DHCP server''s IP address and all other parameters statically.
    This might require looking up on other machines of the correct DNS servers, and
    so forth. Frankly, you won''t normally have to reboot the machine to make these
    changes.


    To install a DHCP server:


    +   1. Click Start, point to “Settings,” and then point to “Administrative Tools.\n2.
    Click on the “Configure Your Server” selection.

    3. Select the “Networking” menu, and then choose “DHCP,” which will give the screen
    shown in Figure 7.1.'
