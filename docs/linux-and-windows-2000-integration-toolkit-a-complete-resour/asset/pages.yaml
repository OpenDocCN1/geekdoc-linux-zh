  md: '# The Backslash


    The backslash character ''\\'' is also used differently on both systems. Windows
    2000 uses it for separating files and directories, where Unix/Linux system shells
    generally reserve the ''\'' for literal characters.


    For example, if you wanted to have a string in a command line that included a
    special character, like a percent sign, ampersand, or other punctuation, you could
    precede it with a ''\''. Sometimes a single quote or a double quote won''t escape
    a character, such as the $. If you had a string as $NAME in a command line, the
    system would assume it was a variable, and try to replace the $NAME string with
    a variable from the environment.


    If you want the system to print or use the $NAME string literally, you would put
    a backslash in front, like so: $NAME. Simply put, it makes the system take the
    next character literally, just as a character, nothing special.


    Dual administrators have often wished there was a quick and easy option on Windows-based
    systems to enable the use of the ''/'' forward slash, to help us stop having to
    use the Backspace key to correct all those cross-platform typing mistakes.


    # Feeling at Home with Aliases


    Aliases are a way to make life easier for everyone, not just the visiting system
    administrator or user from the other side. Everyone has a few commands, or a set
    of finger-breaking options to a particular command he she would love to shorten.
    An alias is usually placed in the .bashrc (the config file for Bash, or equivalent
    file so it''s available to the shell without having to export it to the environment.


    If you are working on a number of systems as a particular user, aliases can give
    you a consistent experience by making your favorite command shortcuts available
    anywhere. You can take your .bashrc or a portion of it and place it on a diskette
    to take offsite or out of your work environment machines.


    # Setting Up an Alias


    Let''s say you do a lot of work on file and directory permissions, and typing
    in "ls -la" is giving you carpet tunnel syndrome, or a pain in the arms because
    you use it so much. You can declare an alias to make this command lot shorter
    and easier by putting the following into your rc file:


    ```

    alias la=''ls -la''

    ```'
  merge: -1
