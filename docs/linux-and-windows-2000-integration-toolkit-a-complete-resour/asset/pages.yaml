  md: '![](img/7c4d65772d38b487e72eb8750e4f3691_248_0.png)


    # # Local and Remote Filesystem Integration


    In any heterogeneous network, whether it is configured of Windows 2000 and Linux
    systems or of Windows 3.11 and Macintosh systems, certain challenges present themselves
    to the network administrator. One of the most persistently aggravating issues
    is simply getting all the client systems to access a shared network filesystem
    and be able to modify it without leading to corrupted files. In this chapter,
    I''ll attempt to explain the filesystem structure of both Windows 2000 and Linux,
    introduce a couple of methods for accessing files remotely from client systems
    of both persuasions, and supply configuration examples for using SAMBA for a heterogeneous
    network file-sharing system.


    # ## Overview of Local Filesystems


    With modern operating systems, in order to operate with any efficiency, the filesystem
    structure must be stored locally, on the system itself. In most cases, the filesystem
    is stored on a local hard disk drive, giving the user several hundred or even
    thousands of megabytes of file storage. However, using a flash EEPROM, floppy
    disk, or even CD-ROM or DVD disk as a local filesystem is'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'possible. The basic definition of a local filesystem, therefore, is not dependent
    on the media on which the filesystem is stored; instead, it is derived from the
    core functionality of a local filesystem: to store, access, modify, and delete
    data on some form of medium directly connected to the computer. The next few pages
    cover in depth the options available for local filesystems in Linux and Windows
    2000; even as operating systems are closely tied to the networks they serve data
    to and request data from, once the Ethernet is unplugged, the local filesystem
    is all the computer has access to.


    # Understanding Mounting and Drive Letters


    Once an administrator has decided to attach a physical device to a system, there
    are usually some steps that are required before the media is actually recognized
    by the computer; one of the first is setting up the media so that it can be easily
    accessed from the root filesystem. Linux, this requires, at the very least, mounting
    the filesystem to a physical mount point. This is usually done by invoking the
    following command, or something similar:

    /home to the local system, so that all users'' home directories map to the second
    hard drive on the secondary IDE controller. Conversely, with Windows 2000, to
    make the same drive available for user usage, we would either choose to use "idisk"
    from the command prompt, or opt to use the disk manager to attach the drive as
    F: on the local machine. Windows 2000 uses two methods to map drives and partitions
    to the local filesystem. The first, which works with both FAT32 and NTFS, is restricts
    the system to use no more than 24 drives (26 letters in the English alphabet.
    A and B reserved for floppy drives = 24 drive letters available) mounted or mapped
    to the filesystem. The second is to mount a physical drive as a directory under
    the root filesystem; with this method, the number of drives that can be mounted
    is virtually infinite.


    ```

    mount -t ext2 /dev/hdd1 /home

    ```


    # Linux Local Filesystems


    Linux, as a constantly changing and open operating system, supports several filesystems
    natively; at this time, however, the native filesystem installed by default and
    used with Linux is the ext2fs, or Second Extended FileSystem. Support for alternate
    filesystems is usually achieved by recompiling the kernel or loading a kernel
    module; in some cases, a source code patch is required.'
  merge: -1
  pgno: 249
- img_proc: true
  md: '# The Ext2 Filesystem


    The default filesystem for Linux, ext2fs sports many robust features that were
    added as the operating system grew in popularity; these features were found to
    be required and expected in a mature filesystem. Some of these features include
    a 255-character limit on filenames, support for files up to 2GB in size, filesystems
    of up to 2TB, and file access and modification timestamps.


    # The Reiser Filesystem


    The Reiser Filesystem, developed initially by Hans Reiser, for whom it is named,
    now the developed responsibility of Naming Systems Venture. Information, patches,
    and other downloads pertaining to reiserfs can be found at www.namesys.com.

    Currently, reiserfs boasts several improvements over ext2fs; namely, metadata
    journaling, quota support, fast balanced trees for filesystem organization, and
    greater speed and space efficiency. These improvements, combined, make for a very
    fast and stable filesystem that does not require a filesystem check when a partition
    is not unmounted cleanly (in the case of a power failure). Although reiserfs support
    is available in the Linux kernel, it is recommended that any user intending to
    implement the filesystem download the latest version and ensure that all relevant
    patches for the host system have been applied, as reiserfs is still considered
    to be in beta stages by the developers, and bug fixes are released regularly.
    Even considering its beta status, reiserfs is still one of the most robust and
    stable filesystems available for Linux.


    # Windows 2000 Local Filesystems


    Windows 2000 supports three filesystems natively: FAT16, FAT32, and NTFS. As FAT16
    and FAT32 are functionally similar—with the primary differences being that FAT32
    has support for long filenames and large disk volumes greater than 2GB under MS-DOS—these
    two filesystems will be discussed in the same section. In addition to FAT16/32,
    Windows 2000 supports NTFS 4 and NTFS 5; again, being functionally similar, they
    will be covered under the same heading. Windows 2000 does not provide support
    for other hard disk filesystems natively; however, there are third-party drivers
    and utilities available to provide support for other filesystems under Windows
    2000; these will not be covered in this book.


    # The FAT16/32 Filesystem


    As the original MS-DOS filesystem, FAT16 is limited to 8.3-character filenames
    (8 characters followed by a 3-character extension) that are stored in'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'UPPERCASE only, 2GB MS-DOS filesystems and 4GB Windows NT filesystems, and
    suffers from severe limitations on partitions larger than 200MB. FAT32 enables
    filenames of up to 255 characters, support for drives up to 8TB in size, and case-sensitive
    files; although duplicates cannot exist under alternate capitalization methods.
    FAT32 also improves file access speed, and has a smaller footprint than FAT16
    on large drives over 400MB.


    # The NTFS Filesystem


    With NTFS, the maximum size of a file or partition was increased to 16EB (exabytes),
    or to be more specific, 18,446,743,709,551,616 bytes. However, according to Microsoft,
    hardware limitations restrict a partition to 2TB, and both partitions cannot be
    larger than 7.8GB. In addition, NTFS is a journaling filesystem; transactions
    to the physical disk are logged, in order to provide faster boot time and a reduced
    incidence of data loss due to system crash or power loss. NTFS supports POSIX
    standards for filesystems: filenames are case sensitive, and multiple files can
    exist with the same filename if each file is a variant with alternate capitalization;
    timestamp dating when the file was last accessed is provided; and hard links can
    exist in NTFS. Like FAT32, NTFS supports filenames of up to 255 characters, although
    this is reduced to 253 characters if creating the file from the command line.
    In addition, NTFS cannot be used on a filesystem smaller than 2MB, eliminating
    the possibility of NTFS boot floppies. However, SysInternals has created a utility
    to create NTFS floppies that is available at www.sysinternals.net/ntw2k/freeway/ntfsloppy.html
    for free download.


    # File Types


    Most sysadmins don''t think much about file types, it''s either an executable,
    a text file, or whatever. This is a distinctly Microsoft point of view. In Linux
    you really need to deconcern yourself with the type of file, as the file extensions
    don''t mean much, and there is not always an extension present.


    In Linux, the main difference between a text file that contains some scripting
    commands and an executable file is the permissions. In Windows 2000, no matter
    what you do to a plain text file, it is not possible to execute unless you have
    the correct extension appended, such as .bat or .cmd.


    # Linux File Types


    Under Linux, a device is one of two types: a character device or a block device.
    The essential difference is that a block device must be read through a buffer,
    and must support random access; whereas a character device can be read di-'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# Local and Remote Filesystem Integration 239


    rectly and sequentially (although this is not necessarily a requirement). Good
    examples of each type of devices are readily available: a hard disk is a block
    device, and must be used through a buffer, and is written to and read from with
    random access. A keyboard, however, is read from sequentially, and although a
    software buffer exists to cache keystrokes, the keyboard itself neither uses a
    buffer, and is therefore a character device.


    Whether the device is character or block, it is certain that it can be accessed
    through its device file. A device file is a pseudofile that represents a drive,
    and allows access to a physical or emulated device through conventional means,
    such as cat or echo. All devices reside in the /dev tree—any files under this
    directory are not actual files, and regardless of what the "du" or "ls" commands
    report, they are not actually up physical space on any hard drive or filesystem.


    The ability to interface directly with areas of the kernel and physical devices
    in your computer through this method allows a great amount of power and flexibility
    with the system. For example, by typing /dev/dsp recording.raw and then breaking
    the stream a few seconds later with Ctrl-C, you can quickly make a recording from
    a microphone plugged into the soundcard on a system—without any special software
    to manage the recording. Likewise, to play back the sound, typing cat recording.raw
    > /dev/dsp will play the sound back through the sound card, again without needing
    to install, load, or run any special software.


    # Windows 2000 File Types


    Windows 2000 doesn''t really deal with "file types" as Linux does. In Linux, you
    can make anything executable solely through permissions (not that the file is
    really executable unless it''s a script or a binary executable, but it could be
    executable).


    Windows 2000 uses file extension associations along with the actual file type
    or headers to determine what''s an executable file. Obviously, you can''t execute
    a file that''s not a binary or script, and even scripts are controlled by the
    interpreter, such as CMD.EXE or .bat or .cmd files.


    # Setting the Default Application for a File Type


