    # Do You Have to Use TCP/IP?


    Use of TCP/IP is a good idea and I highly recommend it. Of all the great reasons
    to use TCP/IP, the Internet and your ability to access it is the killer app. TCP/IP
    is unanimously agreed upon as the Internet Protocol, and in the last few years
    has been the protocol most used in networks worldwide. Yes, there is support for
    other protocols in Windows 2000 and even Linux/Unix, but those protocols are for
    special instances and situations.


    Other than the Internet, you will want to take advantage of the capabilities of
    TCP/IP to organize, manage, and troubleshoot your network of hosts. In your role
    as the network administrator or technical person in your organization, it''s imperative
    that you understand how to plan out a network execute the steps needed to connect
    all your hosts with a minimum of wasted addresses and bandwidth. Table 4.3 outlines
    the advantages and disadvantages of TCP/IP.


    # The OSI Model


    There''s no way we can have a discussion of networking without mentioning the
    OSI Model; it''s way too descriptive, and I think that the other writers in the
    Guild of TCP/IP Geeks would have a stern word with me if I tried to skate on this.


    However crafty and convoluted it, there are some excellent reasons for mentioning
    it. The International Organization for Standardization (Osi) was one of the first
    organizations to put forward a model describing how computers could communicate.
    Its seven-layer model has served as a means of comparing various communications
    protocols over the years. Of course, there is the trouble one has to go to remember
    all of the layers, and Figure 4.1 shows'
  merge: -1
  pgno: 88
- img_proc: true
  md: '# Chapter 4


    Table 4.3 Advantages/Disadvantages of TCP/IP


    | ADVANTAGES OF TCP/IP | DISADVANTAGES OF TCP/IP |

    |--- |--- |

    | Most routable of all protocols | Configuring routers is not for the weak of
    heart; large networks can use hundreds or thousands of routers. |

    | Standards based | Someone is always ''embracing and extending'' the standards,
    or forking the development path in some way. |

    | Completely configurable, with many advanced options | Completely configurable,
    with many advanced options (can be confusing to the beginner). |

    | Name resolution and caching hosts to keep resolved address-host pairs for a
    configurable amount of time | If caches are set too long, resolved hosts become
    ''stale'' and return invalid addresses. |

    | Supported in both Windows 2000 and Linux | Linux is essentially based on TCP/IP,
    and Windows 2000 has the majority of its services and capabilities layered on
    top of it. |


    The Unix/Linux community pays the most attention to the seven layers of the OSI
