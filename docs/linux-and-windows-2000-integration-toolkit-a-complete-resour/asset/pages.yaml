    # Service Records


    Some new types of resource records bear special mention: chief among them is the
    Service, or SRV, record type. RFC 2052 introduces a new record type for DNS called
    an SRV record. In functionality, it is similar to the WINS service (hex) identifiers,
    in that the SRV records help servers advertise the services they run, and make
    it easy for client systems to request information from DNS about what is offered
    on a particular server. Normally, a client will send a request to a DNS server
