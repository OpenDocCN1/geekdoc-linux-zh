  md: '# Planning and Executing an Integration


    > **NOTE** Bottom line about server inventories: I recommend that you inventory
    your servers manually, unless you already have a management system


    # User Inventory


    While it is really a part of the Server phase of inventorying your network, it
    is best to separate the user inventory from the hardware and software portions
    initially. But that user inventory should include a map of the applications and
    services that are accessed to the daily functions and the periodic access that
    might be needed to access other systems.


    We suggest annotating the Visio, Kivio or other chart of your servers and systems
    with the software services and users that will access those systems. This can
    be a minor part of the integration or encompass many people-hours of time, depending
    on the relative complexity of the systems and the data that users need to access.
    Make certain to include the users and their managers in this process, conduct
    at least a cursory Job/Task Analysis for each user and department. Having an 11
    × 17 printer available is a great thing, so that your diagrams are at least readable.


    Let me say a quick word about Windows 2000 versus Linux inventory methods. There
    are lot of ways to remotely access both types of boxes, and while you can telnet
    or ssh into a Linux box from anywhere you have protocol and password access from,
    it''s a manual process at best. Using the Readiness Analyzer on Linux boxes will
    produce some very interesting results with regard to the disk space and OS systems
    of the reporting! Perhaps you could consider using the older NT HQ Tool for inventorying
    these machines. Experiment with the tools to get the results you need.


    # Step 5. Designing Specific Solutions


    Once you have inventoried your base systems and have a better idea of your environment,
    you can proceed to specific solutions for hardware and software challenges.


    For example, one of your servers is currently being used for File and Print services,
    but you will need to enable 10 of your off-site auditors for terminal access from
    Windows desktops. Obviously, this will take hardware upgrades, and depending on
    the current system''s OS installation, perhaps a conversion. Each of the auditors
    has a cable modem and is configured to reach the Internet, and you are running
    a UNIX/Linux-based firewall.


    The first step for this tailored solution would be to determine what the server
    machine''s current HD and RAM level are. Remote Desktop Servers need a lot of
    RAM to function properly and since this will be supporting 10 users, you can take
    the recommendations of the different manufacturers as the'
