    # Custom Subnetting


    The primary reason administrator needs to use custom subnetting is the need to
    expand, or to have multiple subnets with only one leased address block. Let''s
    take a sample scenario to illustrate how this could be done and how out to its
    conclusion.


    Let''s say your boss budgeted for 254-host Class C network, and since you only
    have 14 users in one location, this seems more than adequate. In a year, your
    business has grown out of your current location and you move to offices that are
    in three different buildings of a technical park. You could possibly strengthen
    wires from each of the buildings to the other to connect everyone on a single
    “segment” or loop, but that inviting slowdowns and latency problems because of
    the distances involved. Due to security worries and the need to protect the wires
    from being run over or cut, you decide to look into other options.


    You then decide that you would like to add five more Class C address blocks and
    use wide area networking to accommodate the network needs today and any future
    locations. You present the plan to your boss, who promptly coughs up a structural
    body part over the costs involved. Did mention that your boss is also the head
