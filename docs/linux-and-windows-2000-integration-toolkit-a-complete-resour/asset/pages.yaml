- img_proc: true
  md: '# Now Let’s See, Where Did Those Welding Goggles (Testing the Client)


    It’s time to test the client, to make sure that your server works. You need to
    issue a few commands in the shell on your client machine that will hopefully return
    good data from the server:


    +   - As root, type "domainname yournis_domain" to set the domain name manually.

    - Then type "/etc/rc.d/init.d/ypbind start" to, surprise, start the client daemon.

    - Test your NIS Server connectivity by typing "ypcat passwd", which will show
    the contents of the NIS Server’s /etc/passwd.yp file if everything is working.

    - If you don’t see the results you wanted, or get an error “no such map,” you
    are not properly bound to the server/domain. Check your file’s configuration again
    and fix that typo you made. (I do it all the time; it’s the magic-fingers syndrome!)


    # Justifying NIS Secondary Server


    Clearly, it would be a silly thing to group every machine’s information on a single
    server and then it stays up. Even Linux and Unix servers crash, are struck by
    lightning, or become “caffeinated” by accident.


    In a small environment, you won’t need a slave server—it’s not a very good use
    of a computer—but you will definitely want to install one or more a medium to
    large production network. If the NIS server goes down, or is unavailable, your
    users who depend on it for their authentications are out of luck! You would have
    to provide local accounts for them to continue their work while the NIS server
    is out, and that’s what we are trying to avoid with this whole matter!


    NIS Slave servers need to be an NIS client first. Since we have just gone through
    this configuration, it will be a snap for you to accomplish.


    > NOTE Please, for testing this at all, or on your Basement Area Network, Data
    Area Network (BAN/DAN), don’t try to make a single NIS Server, Client, and Secondary?
    Get a second machine, run VMware, or whatever for installing the secondary. Just’t
    try to run all three on the same box …


    If you didn’t add your secondary server during the initialization of the master
    server, you can now edit the master server’s ”/var/yp/ypversvers” file to add
    your server to the list of secondary servers for the NIS master.'
