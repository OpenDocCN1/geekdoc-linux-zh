  md: '# 302 Chapter 12


    Universal group. Maddeningly, the Universal group is the simplest and most useful
    scope of group, but is unavailable to any domain that is not running in native
    mode. Universal groups can appear in ACLs anywhere in the domain, tree, forest,
    and enterprise. UGs can contain any other Universal groups, Global groups, and
    users from anywhere in the enterprise. If running in native mode, a small enterprise
    could use only Universal groups and avoid Global and Local groups entirely! Universal
    groups and their members are shown in the Global Catalog (GC), for speed of access
    and retrieval of account information.


    Global group. Like Universal groups, Global groups can be included in any ACL
    in the entire enterprise. The Global group is an alternative for those domains
    that are not running in native mode, either by choice or by not being ready to
    convert. GGs can contain users and other Global groups (only when the domain is
    running in native mode) from the same domain. Except for the capability to nest
    groups in native mode, GGs are identical to the NT 4.0 Global groups. A GG will
    appear in the Global Catalog, but its users will not be.


    Local group. Appearing only in ACLs in its local domain, a DLG can contain the
    wildest variety of objects of any group. It can contain Local groups from local
    users, Global groups, and Universal groups from any domain in the enterprise.
    Again, other than the capability to contain other DLGs and UGs, the DLG is identical
    to NT 4.0''s Local groups. A Domain local is only valid for the domain it was
    defined in, and won''t be shown in the Global Catalog.


