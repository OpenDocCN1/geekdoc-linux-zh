    # Naming Restrictions


    Before you get down to actually entering names, we should take a few minutes to
    acquaint ourselves with the naming restrictions for DNS. Originally, the specifications
    for naming were laid out in RFCs 952, 1035, and 1123. These are some of the core
    DNS specifications—the pillars of the DNS temple, as it were. RFC 1035 states
    that the characters A through Z, a through z, 0 through 9, and - (hyphen) are
    the only characters allowed.


    How long can an FQDN be? Can it be 255 bytes (characters, practically) in length,
    with a limit of 63 bytes per section up to that. It’s entirely possible to create
    very long and convoluted names for your computers, but it’s not recommended. Of
    course, you can also use the (.) period character in DNS naming, but only as a
    separator for the components of the FQDN.


    # That Blasted Underscore


    For some reason, NetBIOS system administrators love to use the (_) underscore
    character to name hosts. While it’s supported in some DNS implementations,'
  merge: -1
