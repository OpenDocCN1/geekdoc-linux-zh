    command to set the SUID of smbount to root:


    ```

    $ chmod +S /usr/sbin/smbount

    ```


    This should make it possible to mount that filesystem correctly.


    # Summary


    In this chapter, we investigated the different filesystems available for Linux
    and Windows 2000, with an eye toward understanding not only which are available,
    but how to integrate the two as much as possible.


    System administrators must be careful and do their planning well to avoid problems
    with permissions and users modifying files simultaneously, mostly through reading
    everything you can get your hands on, both from the vendors involved and on the
    Web.'
