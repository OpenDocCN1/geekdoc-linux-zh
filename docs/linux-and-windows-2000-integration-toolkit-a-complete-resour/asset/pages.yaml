  md: '# Shortcuts Inside the Shell


    While everyone can figure out how to edit a command line by moving with the left
    and right cursor arrows or using the up and down arrows to view previously used
    commands, there are many more options to editing the command line. Table 5.3 lists
    most of the important ones for your use.


    # Slash versus Backslash


    A confusing item for many converts, visitors, and thrill seekers in the cross-platform
    game is the use of the forward slash and backslash. Linux gets its usage pattern
    of these two from Unix, its ancestor. Window products get many of their command-line
    forms from the various versions of CPM, and a mixture of other influences.


    # The Forward Slash


    The forward slash is absolutely essential to Linux users; it''s how you separate
    the components of a path, including the directories and filenames. For example:
    # /directory/subdirectory/filename.


    Windows versions use the forward slash to denote an option to a command-line program,
    such as getting help, or an option that changes the output or parameters of a
    given command.


    You can use one parameter after a slash, or stack several together if the command
    supports it:


    ```

    C:\>where /re c:\ notepad.exe

    ```


    # Table 5.3 Option for Editing the Command Line


    | COMMAND | ACTION TAKEN |

    | --- | --- |

    | cd - | Returns you to the previously visited directory |

    | cd ~ | Takes you to your user''s home directory |

    | CTRL-O | Executes a command from history, shows next command in stack |

    | CTRL-T | Switches (transposes) the two characters in front of the cursor |

    | CTRL-W | Cuts all text from left of cursor to the beginning of the word, holds
    in memory for pasting |

    | CTRL-U | Cuts all text from left of the cursor to the beginning of the line
    for pasting |

    | CTRL-Y | Pastes cut material to the current cursor location |'
