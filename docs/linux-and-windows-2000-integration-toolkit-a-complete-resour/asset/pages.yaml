    # Why Unix and Linux Are the Way They Are


    Because of it''s academic roots, Linux is also a multiuser operating system, which
    in practical terms means that multiple concurrent users can get a desktop or shell
    prompt and utilize CPU cycles to accomplish work. Unix was developed in the days
    when computing time was a highly restricted and hotly contested resource, computing
    power was very expensive, and only large corporations could afford such an investment.
    Unix''s ability to handle multiple users was a key component in its acceptance
    in the university environments, where it''s been heavily utilized. While you may
    not have the kind of household where multiple users are playing CPU cycle demands
    on a central server via Windows or kicking off a Secure Shell (SSH) session into
    the refrigerator, you can still utilize terminal sessions to accomplish many things
    on the same machine as different users. (Great when you have hosed X and need
    to edit a file or two to set the world back in order!)


    > NOTE An extreme friend of mine has a climate control system for his newly constructed
    house that he controls by remotely connecting to it by SSH and adjusting the temperature,
    etc. When I asked him: “Why don''t you just put in an automatic climate sensor
    and questing around it?” you can imagine the reaction! That would take all the
    fun out of it, from an engineer''s point of view, the whole goal was to be a geek
    and to have the ultimate control over the house''s climate. (Further note: The
    long-suffering wife of said shares her sentiments ...)


    # What Can You Use Linux For?


    While you can ask this question, it''s more appropriate to list the things that
    Linux is not used for. It''s not very heavily used on desktops in major organizations,
    as it still lacks the user friendliness of the usual Windows box. My organization
    is a very heavy user of Linux desktops and servers because it is in the Linux
    Certification industry and does not like to pay heavy licensing fees for increasingly
    proprietary software.


    Table 3.1 lists some of the tasks that Linux is being used for along with some
    applications that the reader might find useful or interesting in each category.'
