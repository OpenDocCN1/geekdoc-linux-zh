    Windows NT/Windows 2000 CLI commands see both upper and lowercase filenames in
    the same manner, and can indiscriminately delete files, without regard to case
    sensitivity. This is an administrator''s nightmare in an integrated environment.
    This author has seen some truly situations caused by lack of understanding of
    how Unix/Linux and NT/2000 treat filenames. We''ll cover more of this later in
    the chapter.


    Ok, the question begs itself: How often do you run a POSIX application on a Windows
    box? It depends on your job description is.


    You probably won''t run POSIX applications outside of the POSIX tools included
    with the Windows NT or Windows 2000 Source Kits. In Windows NT, these are located
    in the %ntreset%\posix directory when installed by default. Windows 2000 Resource
    Kits don''t install the POSIX utilities by default; you have to navigate to the
    CD-ROM (or the DVD-ROM) in \apps folder and copy and paste them into your path.
    A note of warning: On a Windows machine, if you search your machine before doing
    this for a copy of the LS.EXE command, you will find only one on the machine.
    It''s a fake, barely functional file that only shows the DOS attributes of files
    and really shouldn''t be there. Copy and paste the POSIX utilities from their
    installation directory into your path to install them.


    Users and power users. Some of the functions of the POSIX commands won''t be available
    to normal and power users on your systems. (Power users are accounts that can
    do slightly more than the rank and file, and only on the local machine.) If a
    command or function of the POSIX subsystem requires particular permissions, the
    user invoking the process must have the permissions or be a member of a group
    that has those permissions.


    # How POSIX Works


    The POSIX subsystem is dormant on the system until a POSIX application is started,
    such as the LS command, LiStS a directory or set of files. The POSIX subsystem
    supports 32 processes at a time, allowing you to run many utilities and applications
    simultaneously.


    PSXS.exe is the main component of the POSIX subsystem, which starts when the first
    POSIX application is loaded. POSIX.exe is the Windows NT/2000 (32-bit) program
    that handles the communication between the POSIX application and the Windows 2000
    system.


    POSIX.exe is not loaded until a POSIX application is run; thereafter, a copy is
    loaded for each POSIX application started. Trying running LS.EXE on a large directory
    such as the %systemroot%, press Ctrl-Shift-Esc to bring up Task Manager, and look
    for POSIX.exe on the Processes tab. It will show while the'
