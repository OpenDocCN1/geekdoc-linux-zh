  md: '# # Integrating Network Protocols


    This chapter will acquaint both sides of the integration squad with the basics
    and features of the common protocols you will use to knit your organization''s
    networked hosts together. This chapter assumes that you can can string wiring
    and know the difference between ARCNet and Ethernet hubs.


    The first half of this chapter takes a solid look at our choices for protocols
    and dives fairly deep into TCP/IP and subnetting, since these are absolutely essential
    to working in this day and age. The latter half of the chapter focuses on Windows
    2000 TCP/IP enhancements and extensions that will affect your current network
    when added, both good and bad.


    # ## An Overview of the Available Protocols


    There exists a bit of confusion about exactly what a protocol is, or what it does.
    Network protocols are an agreed-upon definition of how hosts will communicate,
    if you will, a language, that all machines must have in common to accomplish the
    desired actions. Additionally, a protocol can exist on several layers of the OSI
    and TCP/IP stacks, causing one to refer equally to IP (Internet Protocol) and
    FTP (File Transfer Protocol) as protocols, without defining the layer they exist
    upon.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# NetBEUI


    The redheaded stepchild of the networking industry, NetBIOS Enhanced User Interface
    (NetBEUI) is simple, easy, and totally nonconfigurable. Originally, IBM implemented
    it for their LanManager networking needs. Microsoft picked it up as a way to make
    small networks easier to configure, as it required no adressing, no configuration
    parameters, and anyone could run it.


    While it is very easy to use, especially when there is no dedicated network administrator,
    its disadvantages have glaringly apparent in larger networks (see Table 4.1).
    Anything from 25 to 40 workstations with average traffic problems. Because it''s
    not a routable protocol (although IBM has a solution called route bridging), it''s
    next to useless for networks that consist of more than one location. Work with
    me here: if you have a wide area network (WAN), you definitely have more than
    one segment in!


    > The fact that Linux does not provide support for NetBEUI is probably an advantage;
    I get a case of the extreme "willies" (shivers up and down the spine) contemplating
    a Linux network that runs on NetBEUI. The same issue applies for Windows 2000:
    it needs TCP/IP for too many services, and all Windows hosts will load and use
    TCP/IP, so dump NetBEUI as soon as possible. Before anyone takes me to about there
    being after-market Linux for NetBEUI, I mean it''s not available in the installation,
    and isn''t something you would accidentally choose as part of a normal installation.


    # NWLLink or IP/SPX


    NWLLink is Microsoft''s implementation of Novell''s Internet Packet Exchange/Sequenced
    Packet Exchange (IP/SPX) protocol. Networks without a local network administrator
    often use IP/SPX because it requires no configuration other than installation.
    Table 4.2 outlines the advantages and disadvantages of NWLLink.


    Table 4.1 Advantages/Disadvantages of NetBEUI


    | ADVANTAGES OF NETBEUI | DISADVANTAGES OF NETBEUI |

    |---|-|

    | Easy to use (no parameters to mess up or misconfigure) | Nonroutable (no destination
    or source network information is kept) |

    | No addresses needed for network, just a name | Requires constant broadcasting
    to find hosts, causing traffic issues on larger networks |

    | Easy to replace with another protocol that supports the operating system | No
    native support for Linux; Windows 2000 needs TCP/IP for most of its services |'
  merge: -1
  pgno: 87
- img_proc: true
  md: '# Integrating Network Protocols


    Table 4.2 Advantages/Disadvantages of NWLink


    | ADVANTAGES OF NWLINK | DISADVANTAGES OF NWLINK |

    |---| Routable to other networks | Not suitable for very large networks, its overhead
    can produce problems. |

    | Caching for resolved names | Must broadcast for resolution of names, can cause
    traffic issues. |

    | Requires only a few simple configuration steps | Limited options for tuning
