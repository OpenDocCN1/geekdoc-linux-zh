  md: 'Computer Sciences wanted a user interface that could run on any machine processor
    architecture as a program binary for any operating system, while presenting a
    consistent interface.


    Project Athena was born, creating the X Window system. It wasn''t the first time
    an undergraduate program created something good—and it won''t be the last—and
    it had a huge effect on the Unix and open source systems world.


    #  The Convergence of All X Window Environments


    By this time, the dozen odd (I''m being facetious) consortia that were (are) going
    to organize a common set of APIs and a desktop interface have totally organized
    the Unix and Linux environment, making applications work across all platforms
    and behave identically. Ha, Ha, then he woke up, screaming from the nightmare.
    Talk about the triumph of Hope over Experience. It seems every year there was
    another consortium that was going to organize X into a desktop environment.


    Even though X is supported on a large number of platforms, such as DOS, Macintosh,
    Windows NT, Windows 2000, VMS, Unix, and Linux to name a few, there are still
    a number of different environments from which to choose and puzzle out.


    In the Unix environment, as opposed to the Linux world, there is the MIT X Consortium,
    which was founded in the late 1980s with over 40 organizations to support and
    drive the evolution of the X Window System environment.


    In the Linux world, we very nearly achieved anarchy, and it''s a good thing. Keep
    reading—I''ll try to convert you to this point of view.


    # Getting COSE with X


    In the 1980s and 1990s, along came a series of be-all end-all, fix-the-problem
    specifications, chief among them the Common Open Systems Environment (COSE). This
    was supposed to fix all the problems, quell disorder on the borders, and put a
    chicken in every pot. Ok, it was a good idea, but everyone was still focused on
    trying to rope every user and corporation into their particular version of Unix,
    running on their hardware platform, costing mucho bucks.


    This is the main problem with the mainstream Unix environment: it''s too tied
    to a reference platform for hardware, and the vendors really want to lock into
    their solution, and you get to spend your money for hardware/software.


    Linux solves the problem for most users; if they don''t care about support solutions,
    they can run any distribution on any platform it''s ported to, from the Linux
    Watch to the System 390 and AS/400 server platforms. It doesn''t matter which
    distribution you run, just that it works and you can support it either internally
