  md: '# Filesystem Tuning and Performance


    Tweaking a filesystem is often perceived as a dark art of sorts; this is not necessarily
    the case. Through the use of various utilities, formatting parameters, and careful
    planning, a filesystem can be optimized to perform more than adequately under
    any operating system. Remember, this section affects the filesystems, not the
    actual disks themselves.


    # Tuning Linux Filesystems


    The easiest and most efficient way to optimize an ext2 filesystem is to specify
    a few parameters to mke2fs when creating the filesystem, and to mount when mounting
    the filesystem.


    When creating the filesystem, adding the -o none option to mke2fs creates fewer
    superblock copies in the filesystem and removes the ability to store information
    in an inode; both of these features increase file access time and are only necessary
    in a few select cases. If the filesystem already exists, the tune2fs utility can
    be used with the same option to tweak the current filesystem.


    Adding the noatime option when mounting a filesystem will greatly reduce the overhead
    created by filesystem read operations; the option can be added to entries in the
    /etc/fstab (after defaults) as well as specified on the command line when mounting
    a filesystem manually.


    # Tuning Windows 2000 Filesystems


    Tweaking Win2k systems performance is done of two ways. First, you can buy the
    fastest components and match them up well, which will allow NTFS to take full
    advantage of the system''s speed. As a log-file or transaction-based filesystem,
    NTFS will rarely lose data, even under a crashing load. Second, you can investigate
    the NTFS filesystem using TechNet, or some of the Developer Kits available from
    Microsoft. For the average system admin, this is not necessary, and as with all
    custom modifications, you can easily tune your way into a disaster.


    What follows is by means intended to be a conclusive list of actions you can take
    to tune your disk subsystems, but they are all important and require the least
    modifications to your Registry, and so forth.


    # Load Balance Your Filesystems


    Reading your log System Monitor logs on a regular basis is key to understanding
    what''s happening with your disk activity. Overuse of a particular disk will cause
    some bottlenecks and slow your filesystem usage. It''s important'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# Chapter 10


    also to distinguish between putting two partitions on the *same* disk, and putting
    those two partitions on *separate* disks. The first option will gain you no speed
    increase, as the same set of heads, platters, and data channels are being used.
    The second option will allow the I/O subsystems to work independently of each
    other and increase both read and write performance.


    For example, you should try to separate the System partition (where the Windows
    2000 system resides) and your application and data partitions to separate disks,
    or even RAID arrays. Even normal system activity can put a decent load on the
    filesystem, less having a heavy load of video editing or FrameMaker files on the
    same drive.


    Other administrators will put their pagefiles on a separate drive from anything
    else, or group them with the least active set of data on a busy system.


    # Creating Fewer Partitions per Drive


    While you might be totally in love with your ability to create many little partitions,
    it''s an overhead on the system, and can affect your performance negatively. By
    trying only a single logical drive or partition on each of the disks, unless absolutely
    necessary. This will allow the drives to move freely across the disks and increase
    data transfer rates by reducing the amount of movement the heads must make to
    get a particular set of data.


    # Using Like Workloads on a Server


    When you consolidate or group services on a particular server, try to make them
    match as closely as possible to reduce the amount of wasted head movement and
    tracking. For example, if you are already using a server for a file/print server,
    it''s likely it will have a slightly higher read-to-write ratio, depending on
    the data types on the server. Adding a web server to that machine would significantly
    increase the amount of reads versus writes, as Web activity is reading and delivering
    files, not posting information.


    # Setting the Block Size Correctly


    If you are using applications or services that have very large files, you will-get
    better performance out of a larger block size. If you have many smaller files,
    a smaller block size will yield somewhat better performance, and waste space.


    For example, when writing a 40MB FrameMaker file to a drive with 8k block size,
    you will make significantly fewer writes if the block size were 512 bytes! Larger
    data is much easier to read and write when it can be laid down in larger strips
    over the drive. The fewer revolutions that a drive has to make to access data
    or write it to disk, the better.


    ![](img/7c4d65772d38b487e72eb8750e4f3691_257_0.png)'
  merge: -1
  pgno: 257
