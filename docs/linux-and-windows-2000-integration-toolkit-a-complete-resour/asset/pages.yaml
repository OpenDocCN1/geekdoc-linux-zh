    # The Light Bulb Method


    Sometimes you have to resort to desperate measures to envision how the bit patterns
    are used to determine the actual number that goes into an octet. An interesting
    example to illustrate this method would be to have you imagine a room that has
    a set of eight wall-mounted light switches in it. The eight switches control lights
    that have a wattage (brightness) of 128 watts, 64 watts, 32 watts, and so on.


    Your task is to produce the exact number of watts needed in the room for a variety
    of purposes. When told to alter the room''s brightness to represent 100 watts,
    a very common number, you turn to the wall and figure out what switches to flip
    to get that amount. Let''s take this example by step.


    First, you need to remember that any bit whose value is larger than the target
    number will be off. If you have a number like 100, then obviously the 128 bit
    will stay off. The 64 bit will be on, because it''s below the target number. Then,
    if you turn on the 32 bit, that gives you a total of 96. You only need to add
    4 to this to get the right number, and since there is a bit that is valued at
    4, turn it on, and you are done (see Figures 4.3 and 4.4)!


    | 0 | 64 | 32 | 0 | 0 | 4 | 0 | 0 |

    |---|---|---|---|---|---|---|---|

    | | | | | | | | |

    | | | | | = 100 | |


    Figure 4.3 Representing a value of 100 watts.


    | 128 | 64 | 32 | 0 | 0 | 0 | 0 | 0 |

    |---|---|---|---|---|---|---|---|

    | | | | | | | | |

    | | | | | | = 224 |


    Figure 4.4 Representing a value of 224 watts.'
