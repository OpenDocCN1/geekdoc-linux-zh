  md: '# System, User, and Group Administration 207


    deleted data directories on the servers. If someone tells you to do this insane
    thing, make sure you take a deep breath before you calmly explain the ramifications—simply,
    slowly, and with great care.


    # Linux Users and Groups


    Linux users and groups are very easy to find, modify, and back up. Linux uses
    /etc/passwd and /etc/group files by default, along with the /etc/shadow file when
    the “shadow” suite of tools is installed. These are text files, with permissions
    that allow only the root user to modify them. The relationship and presence of
    the shadow files exist for the reason that all users must be able to “read” the
    passwd and group files to log in, and it’s possible to copy the file if you can
    read it. Once copied, the file can be subjected to password-cracking tools that
    will eventually guess the passwords that match the plain-text user accounts. By
    comparing a known password’s encrypted string, a patient and crafty user could
    decipher even an encrypted password, if kept in /etc/passwd file. Normally, there
    will be an “x” in the password field to indicate that the passwords are kept in
    /etc/shadow.


    # Disabling a User Account


    Interestingly enough, just about any string in the “password” field other than
    an “x” will disable your ability to log in. The most often used to disable logins
    is the “*” asterisk character. If you find that a user is misbehaving or acting
    strangely (this may be very normal in some work environments!), you can disable
    him or her account very quickly and investigate. Don’t attempt to put a “real”
    user password in this field by typing it manually. If you follow me, the word
    you typed will not be interpreted as that, but would represent the encrypted version
    of a word that you won’t know! Talk about restricting logins …


    # /etc/passwd file


    Entries in the passwd file take the form of fields separated by the colon (:)
    character. Normally, there exists a few service-level accounts as “ftp,” “uucp,”
    “shutdown,” and “halt” that will vary according to the daemons are installed and
    what the machine is used for. You might notice that the user accounts are ordered
    by their UID, with the root account being UID “0”.


    > NOTE Those who use Windows usernames being insensitive will have to exercise
    extreme caution when entering or modifying Linux users and groups. Linux and Unix
    are absolutely case sensitive when it comes to users, groups, files, passwords,
    and just about anything else I can think of.'
