    # Groups in Active Directory


    Groups in Active Directory are somewhat of a drawback to Windows NT 4.0. You might
    have assumed so far that organizational units (OUs) will take care of all grouping
    or organizational needs, not entirely. Sometimes you will need to make a grouping
    of users or objects solely for security reasons, and moving them from OU to OU
    is slightly impractical and confusing for such a common occurrence. Groups are
    a great way to designate a logical set of users for any reason.


    # Types of Groups


    Some confusion always exists when you first begin to look at the groups in AD.
    Not only are there types of groups, but each group also has a scope that affects
    how it''s used, what it does, and what it can contain. All the groups in an Active
    Directory domain fall into one or the other of these two types:


    **Security groups.** A security group can be included in an ACL, the definition
    of a resources permissions for users, groups, and objects in the domain. In NT
    4.0, you find the same type of groups, although an added capability of being an
    e-mail distribution list is added in Windows 2000.


    **Distribution groups.** A distribution group can''t be listed in ACLs for security.
    They can, however, be used for e-mail distribution lists, and not much else. Those
    used to Microsoft Exchange will find that many of the elements of Active Directory
    already exist in Exchange 5.5 and later, including distribution lists.


    # The Scope of a Group''s Operation


    Whereas a group''s type describes what it is used for, the scope of a group affects
    how that group can operate, what it can contain, and if the group can be used
    across domain boundaries for trust relationship operations.


    Windows NT 4.0 had the concept of Global and Local groups, which is still there
    in AD, but enhanced with new features.'
