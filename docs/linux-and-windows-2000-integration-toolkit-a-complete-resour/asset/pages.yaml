    The groups and owner of a file can be changed with the “chown” utility, while
    the file permissions can be set with the “chmod” command.


    # Linux File Attributes


    By default, a new file created on a Linux system with the ext2fs will have no
    special bits set. The “chattr” utility allows the user to set any number of bits;
    there are some bits that can only be set by root. In alphabetical order, the bits
    that can be set on Linux files are:


    +   a. Tell the filesystem not to modify the file’s atime (access time) record;
    speeds up access on some laptop and slow desktop systems.

    a. This file can only be opened in order to append data to it; this bit can only
    be set by root.

    c. File is compressed and decompressed on the fly by the kernel.

    d. File will not be backed up by the “dump” utility.

    i. File cannot be modified, in any way, shape, or form; strangely enough, only
    root can set this option.

    s. Enables immediate synchronization for data written to this file when the file
    is modified.

    s. File is immediately deleted by overwriting the file with zeroes.

    u. File is saved when deleted so that it can be undeleted, if necessary.


    To list the current attributes of a file, use the lsattr command.


    # Windows 2000 File Permissions


    When you think about the permissions of a file in Windows NT, you know it has
    read, write, execute, and a few others. These have been enhanced in Windows 2000,
    to include the capability to have the permissions cascade down the file tree when
    set on a directory, to all its files, all subdirectories, and their files (see
    Figure 10.18).


    The permissions include:


    **Full Control.** All the other permissions.


    **Modify.** Read, Write, Execute, and Delete either the folder or file.


    **Read and Execute.** Users can navigate to the files they are able to execute,
    even if they don’t have permissions to all the folders above them.


    **Read.** The ability to read the file, including its contents.


    **Write.** The ability to change the file’s contents, its attributes, and permissions.'
  merge: -1
