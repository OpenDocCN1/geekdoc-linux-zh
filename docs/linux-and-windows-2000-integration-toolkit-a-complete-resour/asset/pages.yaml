  md: 'Keep in mind the Linux OS is very much like Unix. It''s been described as “immensely
    powerful,” which is really a catch phrase meaning “bloody difficult.” Difficult
    to those raised on the GUI environments, that is. DOS and CPM users will feel
    somewhat at home and be typing in no time. GUI administrators will have a hard
    time understanding and navigating a command-line-oriented environment, and most
    Linux and Unix administrators would faint if they ran X on their production servers.
    They would want you something that would only steal RAM and CPU time from the
    task is performing? Despite Microsoft and others might say, it''s a nice design
    feature to be able to not load all GUI bloat and still have a perfectly functional
    and speedy server!


    The Windows 2000 interface can be managed and supported by a relatively inexperienced
    IT staff. Many experienced system administrators on the Windows side (the author
    is a good example) will accomplish a plethora of functions in the command line
    mode, but they are usually converted DOS and OS/2 users or have Unix experience
    somewhere in their family trees. The presence of the GUI inmates from the vagaries
    of the hardware, which is not always a good thing. It''s nice to be able to kick
    back and use the GUI to get really neat and snazzy, but you have to fix things
    and get done in the shell.


    On the Linux side, almost every distribution requires a higher level of skill
    and improvisation or lots of budget for telephone support to someone who has that
    skill. Linux uses an eclectic mix of command line, X windows text mode with menus
    to accomplish each basic system administration. Anything more complex than the
    base level requires in-depth knowledge and plenty of experience. (Some would say
    the two were mutually inclusive.) While not as fragmented as Unix, Linux has an
    expansive set of distributions that utilize different methods and programmatic
    philosophies to configure and administer that distribution. Training your administrators
    on the basics of Linux while familiarizing them with the different tool sets will
    result in returns to your team and integration project.


    There are many toolkits; some commercial and some free, that can make fence-straddling
    administrators feel more at home. From the MKS Toolkit from Morten Kern Systems
    to Services for Unix from Microsoft, all will have their pleases and minutes.
    I will take a good look at these in a later chapter.


    In all honesty, programmers/administrators will find similar methods for automating
    tasks in both Linux and Windows 2000. The Windows Scripting Host, with its GUI
    and command line versions, allows for almost total automation of Windows 2000.
    For those normal souls (like the author) who think heavy batch scripting or shell
    programming are about as far as they want to go, there are a lot of other methods
    for accomplishing things. It''s all about choice, doing whatever you the way you
    want to.'
