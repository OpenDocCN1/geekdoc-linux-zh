- img_proc: true
  md: '# Setting up the NIS Slave Server


    Initializing the secondary server is quite similar to initializing the master,
    with the only difference being the use of the "-s" parameter to specify what server
    is the master. This should be specified during the initialization.


    Follow these steps to initialize your slave server:


    +   1. In a shell, as root, type "usr/lib/yp/ypinit -s masterservername.

    2. You''ll see a bunch of messages informing you that the secondary is copying
    the databases from the master server, listing them by name and using the "ypxfrd"
    program.

    3. You can safely ignore the messages about the ypxfrd daemon not running, unless
    you''ve altered the rpc.ypxfrd to allow this machine to pull changes by itself.

    4. Save the file and reboot the machine to make sure that all changes take effect
    and everything works.


    # Setting the NIS Master to Push Changes


    This is it, the last step to a functional NIS environment. Ok, so it''s a small
    environment, but it will scale to larger networks.


    In order for the NIS master to do the actual push, you need to change the Makefile
    as I show here:


    +   1. Edit the Makefile on the master server.

    2. Change the line that reads: NOPUSH=True to read #NOPUSH="True".

    3. Change the line that reads: DOMAIN = ''basename \pwd\'' to read DOMAIN=''/bin/yourdomainname''.


    With these changes made, you can now force all the maps on the machine to be rebuilt
    and pushed out to the configured secondary server(s).


    # Testing the NIS Server''s Ability to Push the Changes


    To cause all the maps to be rebuilt and pushed out, you need to do the following.


    On the NIS Master Server:


    +   1. Type cd /var/yp to enter the correct directory.'
  merge: -1
  pgno: 359
- img_proc: true
  md: '# Linux''s NIS and Microsoft''s Server for NIS 347


    2. Type make to cause the maps to be rebuilt.


    3. You will see a series of messages like this:


    ```

    Updating passwd.byname...

    npushed passwd.byname map.

    Updating passwd.byuid...

    npushed passwd.byuid map.

    Updating hosts.byname...

    npushed hosts.byname.

    Updating hosts.byaddr...

    npushed hosts.byaddr.

    ```


    On the NIS slave server:


    +   1. Modify the /etc/yp.conf file so that the "ypserver" setting is pointing
