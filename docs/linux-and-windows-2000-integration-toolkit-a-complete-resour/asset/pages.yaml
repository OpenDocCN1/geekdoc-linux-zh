  md: '![](img/7c4d65772d38b487e72eb8750e4f3691_344_0.png)


    # Linux’s NIS and Microsoft’s

    Server for NIS


    While the previous chapter focused on the newer directory service from Mi-

    soft called the Active Directory, we will concentrate in this chapter on the

    Network Information Service (NIS) component for Linux, and some Microsoft

    tools for integrating NIS and Active Directory.


    Your patience is appreciated; these are heady and difficult topics to try to in-

    tegrate, less explain. If there''s any sure cure for insomnia, it''s either

    RFC''s or documentation about NIS/NFS/DNS. I have spent many hours try-

    ing to pre-digest this information for my attendees and clients; I hope you will

    find it much easier to understand this section as a result!


    # Getting Acquainted with the Network

    Information Service


    The heart of the NIS system is a relatively simple client/server database. While

    NIS can be, and sometimes is, used for all sorts of networking tasks, its primary

    ocus is to store, manage, distribute, and organize user, group, and password

    information for a network.


    We’re going to cover what NIS is, how it works overall, and then set about

    configuring it for a small/medium business’s needs on their network. Keep in'
  merge: -1
  pgno: 344
- img_proc: true
  md: 'mind that NIS performs a somewhat simplistic function, while appearing to be
    quite difficult to install and configure.


    # Ancient History


    I''m sure the Guild of Networking Authors would send me a stern letter of reprimand
    if I dared to pen (key?) a chapter about NIS without some tried and true chestnuts
    such as:


    "NIS was developed by Sun Microsystems to originally be a part of SUNOS," or "Originally
    called Yellow Pages, or YP, it suffered a lawsuit and name change due to a Certain
    Phone Company''s objection."


    Ooh, ooh; don''t forget how: "All of NIS''s commands are prefixed with ‘yp’, in
    apparent defence of the outcome of the lawsuit that forced its name change.


    While I might make a little fun of the same old information that every author
    has to draw from, the preceding statements (being my own) are very indicative
    of what everyone has to relate about NIS and its development.


    # Why Using NIS Your Network


    NIS became, and is, quite popular because it allows a network administrator to
    enter usernames, groups, membership and passwords once, and have them replicated
    or pushed out to backup/load-balancing servers whenever and wherever he wants.


    This capability to provide fault tolerance for users'' authentication and entrance
    to the network is very important to a large organization, as there never seems
    to be enough hours in the day, or administrators in the IS department, to keep
    up with changes to the user base with normal unautomated methods.


    Sun''s NIS protocols and construction was made available to the computing community,
    and in rapid fashion became the directory service of choice in the Unix world.
    While a relative newcomer to the *Nix world, Linux has included support for NIS
    from the early beginnings of its individualized existence. The beauty of having
    a common NIS suite of protocols and work-alike applications for all of the Unix/Linux
    world is obvious—less typing!


    # The Components of NIS


    The components of NIS are as follows:


    +   NIS servers. An NIS master server is the computer that has the original copy
    of the files to be distributed via NIS. Just as DNS primary and sec-'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# Linux''s NIS and Microsoft''s Server for NIS 333


    ondary servers, both the NIS master and slave servers can answer queries from
    bound clients for any map in that domain.


    **NIS slave servers.** NIS slave servers exist for assisting the NIS master server
    with client queries. They are normally nearby, or on client subsets for load balancing
    and reduction of cross-subnet traffic. They provide a high degree of fault tolerance
    in case of network or master server failure. As is the case on NIS master servers,
    database maps that have been replicated to NIS slave servers are strictly read-only
    copies and assist the NIS server in responding to queries from clients.


    **NIS clients.** Any NIS-capable client computer is able to be Bound to an NIS
    server. Slight changes to the client''s local configuration files bind it and
    give it access to the authentication of NIS servers.


    **NIS maps.** The original files (such as /etc/passwd) are converted into the
    NIS “maps,” or the databases that are replicated out to the NIS slave servers.
    The files are in a DBM format, which is a database type that is indexed through
    a hash table. Changes to the source data files are best performed solely on the
    NIS master server, to ensure that there are no duplicate master copies of the
    files. While the source data files are considered to be “read/write” files, once
    a file has been converted into a database “map,” it’s considered to be read only.


    **NIS domains.** An NIS domain is defined by a set of NIS maps that are used by
    a particular named group of computers and users that are bound to that domain
    via their configuration and presence in that domain''s maps. It is possible to
    query others'' information, and to use more than one set of maps, although cumbersome
    in practice.


    **Pushing (replication).** This refers to the “pushing” of the NIS master database
    files to the NIS slave servers. It is possible to automate pushing of the database
    files, although deliberate pushes once changes are made help you control what’s
    sent to where and when.


    # What Happens When You Add Users


    In a correctly configured NIS master/slave/client environment, some neat things
    happen when you add a user. You perform the changes to the source configuration
    file on the NIS master server, such as “passwd.yp”. Changes are reflected in the
    map files that are distributed out to the secondary servers when desired, or it
    can be automated. Users just need to log in to their machine, and if the account
    information has been entered and distributed, they are authenticated by their
    closest NIS server and gain access to whatever NIS client machine they are attempting
    to use.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Sharing Files with NIS


    A key element to NIS is the capability to allow you to configure hosts to refer
    to a centralized set of configuration files for access. If all machines are configured
    to allow NIS to authenticate users and groups, the administrators are freed from
    having to edit either a centralized set of files and copy them manually, or edit
    manually those same files on local machines.


    Moving from a local copy of files such as the /etc/passwd and /etc/group files
    to a centralized version on a server allows users to access their network resources
    from a variety of machines, seemingly independent of the operating system or location.


    NIS''s main role in most organizations is to central the /etc/passwd and /etc/group
    files. On a server called a master server, expanded versions of these files are
    kept in databases that provide quick and configurable access for all included
    users and groups.


    By configuring your client computers to refer to the NIS master server for requests
    to these files, you improve your security and reliability. As long as you have
    a correctly identified and functioning NIS slave in your environment, you can
    take down the NIS master, or suffer catastrophic failure with little or no interruption
    to your clients'' login and networking experience.


    # Files Typically Distributed by NIS


    While the files listed in Table 13.1 are typically distributed by NIS, they are
    not all of the files that are capable of being propagated. You can check the Makefile
    mentioned later, and of course, the man pages for more information on additional
    files supported by NIS.


    **Table 13.1** Files Distributed by NIS


    | FILE | DEFINITION |

    | --- | --- |

    | /etc/ethers | Ethernet MAC to IP address mappings |

    | /etc/passwd | User accounts, passwords, home directory... |

    | /etc/group | Group information |

    | /etc/netmasks | IP network masks |

    | /etc/hosts | IP address to hostname mappings |

    | /etc/protocols | Network protocol and number mappings |

    | /etc/services | Port number to TCP/UDP protocol mappings |

    | /etc/rpc | RPC number assignments |'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Prerequisites for Importing Files into NIS


    Before you can import a passwd file into an NIS database, you need to ensure the
    files meet the following criteria, and are comprised of:


    +   - Tabular data. Uniqueness is guaranteed by the username or UID.

    - Straight text. No fancy formatting or tags, just plain ASCII text.


    Once converted, the database files are searchable and manageable. Searching is
    important for NIS database files; they must be keyed on items such as the username,
    or the UID for the passwd file.

    NIS databases are not changed within the database structure itself. The original
    files that are used to make the DBM files initially are where all changes are
    made, and by running the conversion process again, the DBM files on the NIS master
    server are updated. SQL DBA’s will recognize this process; it’s the the only way
    to reproduce a table consistently, by modifying the source script or file.


    # NIS Domains


    Unlike the Active Directory cross-domain searches and trust relationships, NIS
    servers, clients, and users must all be in the same NIS domain to interact. NIS
    domains are often mistaken for, or confused with, DNS domains, although their
    functions are different.


    Two schools of thought exist about how to handle your NIS and DNS names:


    **Separate names.** Using separate names for NIS and DNS is often cited as necessary
    for security reasons, and less confusion in referring to either.

    **Same names.** Using a single name for both NIS and DNS domains is acceptable,
    and doesn’t seem to pose any real security risks that I can find. Users will still
    be confused if you separate your NIS and DNS names; as long as the systems administrators
    know the difference, it''s Ok. Many of us have tried explaining things to a user,
    then concluded the conversation with a strongly felt “Don’t worry, I’ve got it
    taken care of, just go back to work!”


    # Clients and NIS Domains


    While possible, it is highly irregular for an NIS client to belong to more than
    one NIS domain. When a client belongs to an NIS domain, it is referred to as being
    “bound” to that domain.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# Chapter 13


    NIS clients can be bound to an NIS server via the "ypbind" command, which uses
    broadcasts to locate and connect to the NIS server. If the closest NIS server
    is not on the local subnet, broadcasts will not work properly, and the "ypset"
    command should be used to achieve the correct binding to the NIS server.


    # Configuring a Master NIS Server


    Hopefully, you have a good idea of the structure of your NIS domain by now, as
    you will need to configure slave servers during this whole process, using their
    hostnames.


    Let''s assume an NIS domain name of: blahwo. Again, you can use the same name
    as your DNS domain, but some security types would caution it to be different.
    It''s of little consequence for our discussion.


    > NOTE In order to use hostnames for your NIS slave servers, they should be entered
    into your /etc/hosts file, so they are able to be resolved.


    # Setting the NIS Domain Name


    There are two ways to accomplish setting your NIS Domain name:


    +   - Short-term. Use the command "domainname blahwoof."

    - Long-term. Edit the correct startup configuration file to make the active every
    time the system reboots. Depending on the distribution, the ypyserv daemon will
    look in the /etc/sysconfig/network file for the parameter "NIS_DOMAIN = blahwoof."


    # Setting Up Files to Be Distributed


    For NIS beginners, it''s important to share the absolute minimum files to get
    the job done. Then, when things are working right you will feel more comfortable,
    you can get more complex and start doing some slick things with NIS.


    > NOTE I am referring, of course, to the close cousin of the Heisenberg Principle
    (mentioned earlier in the book) the "Parameter Poisoning Principle."

    Parameter poisoning is the practice of adding new and cool things to a not-yet
    working configuration, and making a troubleshooting nightmare, or troubleshooting
    so many things that you don''t have a clue what''s wrong and right. Start simple,
    and then go for the gold. (Also known as "Scope Creep.")'
  merge: -1
