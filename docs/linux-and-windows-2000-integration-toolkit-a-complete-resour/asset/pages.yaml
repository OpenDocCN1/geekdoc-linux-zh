  md: '# Linux Printing Commands


    Unlike Windows 2000, which has very heavily engineered interfaces for its

    Linux allows you to use the GUI printing options that programs pro-

    vide, or dive down into the shell and get the printing done manually.


    Either way is fine, be aware that not all programs support printing sim-

    ilarly. This is an area where Linux lags behind other operating systems, at least

    in terms of uniformity and being able to expect that a given action will produce

    a given result.


    # Files Needed for Printing in Linux


    The following files are needed for printing in Linux:


    +   - lpd is the service or daemon that watches the spool directories, sends

    then, according to the control file information for a particular job, sends

    print job to the physical device or other queue it''s intended for. The

    nlpd daemon is normally started by an init script. Depending on the distri-

    bution, it might exist as the lpd.init script in the /etc/rc.d/lpd.directory

    or somewhere else in the hierarchy of rc files and directories. Check out the

    man page for the lpd.init file, if it''s included, or check out the man

    lpd daemon.


    +   - printcap. The printcap file is where printers are defined, their options,

    names, and other pertinent information. The printcap file is normally kept

    in the /etc directory, and should be editable by the root user, but readable

    by all users.


    +   - lpc. The lpc command is used to configure and control the printers, spools,

    devices, and their job control settings. This utility could be a less

    flaky; it doesn''t behave well at times. It uses an FTP-like interface that lets

    type in commands to configure the spools, the printer devices, and to

    manage jobs.


    +   - lpr. The lpr command is the workhorse of the Linux printing system. It''s

    used to take a file and submit it to the spool directory, formatted in the

    way the particular printer is expecting it, as defined in the printcap file.

    You can use the lpr command in the shell, or put it into a script for

    ating some printing. Interestingly enough, few of the graphical

    applications will call the lpr command to print, instead of using the print-

    ing APIs directly. Whatever, as long as it prints, right?


