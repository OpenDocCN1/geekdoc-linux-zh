    # Windows 2000 File Attributes


    In contrast to the many options available for files on a Linux system, Windows
    provides only a few special bits that can be set for files on an NTFS filesystem.
    These options can be manipulated with either the "attrib" command, or simply by
    right-clicking on the file in question in the file manager or Explorer windows,
    selecting Properties from the drop-down list, and checking or unchecking the appropriate
    check boxes.


    **Archive–a.** Sets the archive bit; this bit is used by many backup utilities
    to keep track of what files need to be backed up, and what files should be ignored.


    **Read-Only–r.** Alerts the user that the file is "read only" when the user attempts
    to modify, delete, or overwrite the file; usually, the operation can be continued
    after confirming your intentions to the operating system.


    **System–s.** Tells the operating system that the file is a "system" file; like
    "read-only" files, most destructive operations on a "system" file must be confirmed
    before Windows 2000 will allow the user to modify or delete the file.'
