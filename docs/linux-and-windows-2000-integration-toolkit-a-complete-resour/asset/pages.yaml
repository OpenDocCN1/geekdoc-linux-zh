  md: '# Chapter 2


    Three variables affect the Scope of a project, and they must be balanced correctly
    in order to succeed:


    +   **Resources.** People and financial support.


    +   **Scheduling.** Time and its management.


    +   **Features.** The actual changes, updates, or additions that make up the solution.


    You can affect the project by reducing or expanding any, or all, of these variables,
    such as allocating more people for the implementation process to shorten the time
    involved, or dropping unnecessary or fluff features to make the tight schedule
    with the number of people assigned.


    This stage is also where the champions of certain methods will toss their hats
    in the ring, and make passionate pleas for a particular method, platform, or software
    choice. Everything goes into the original document or spreadsheet, and then in
    subsequent reviews the really silly things will get rejected or will will be removed
    through the process of recognizing that they won’t work or are too complicated.


    # Step 3. Doing a High-Level Design


    The documents that make up your plan will be the basis for a high-level design
    of the integration. This design can be any parts of documents, charts, graphs,
    Visio, or CAD drawings and stone tables from very high hills. Whatever it is for
    you and is explainable to the Management Team that will approve the initial design.


    Some teams will use a conference room floor of whiteboards or those new whiteboard
    paints on the walls of a planning room to get everything ready and laid out for
    the project, but the task of committing this design to paper remains a thorny
    one. I find that something can be projected on the wall or a large screen in the
    planning room and a good high-lumen projector is a wonderful thing.


    Good designs will include all the elements of interest, the budget considerations,
    and the proposed levels of integration for each component. One of our clients
    from years ago at a design college came up with little Velcro-backed laminations
    of servers, printers, users, routers, and hubs that could be put on the wall of
    the design studio and we used them to make our high-level design. The client used
    a video camera to record the process from start to finish, and when we changed
    things, the little components could be put back on the wall and we reited portions
    of the plan. I gave this client an “A” for innovation, and while it was different
    than anything we had ever seen, it worked very well and we have used several times
    when we have groups that are highly creative and very fluid about their planning
    process.'
