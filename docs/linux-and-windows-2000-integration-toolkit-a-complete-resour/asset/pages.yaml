    -rw-r--r-- 1 user users 100 Mar 15 21:46 rocquefort_cheese

    -rw-r--r-- 1 user users 100 Mar 15 21:46 wensleydale_cheese

    [user@dellbert/store]#

    ```


    As you can see, the $string variable expanded into the character "cheese" for
    each and every file that matched the pattern. The patterns for substitution and
    shortcuts are endless. Hopefully, this little demonstration will give you some
    ideas for how to use shell variables.


    # Slashdot, Not DotSlash


    When executing programs, there is a definite difference between the Linux shells
    and Windows 2000. Both systems have a path, and will execute programs in that
    path, but Linux handles "out of path" programs differently, with an eye toward
    security.


    Because of the possibility of buffer overruns and break-ins, Linux doesn’t allow
    you to simply execute a program in the local directory, unless that directory
    is in the path. The idea is that a cracker will try to blow up the HTTP server,
    or otherwise execute a program in a given directory without being specifically
    allowed, or included in the PATH statement. This can be frustrating to migrating
    Windows users/administrators. A cubicle-hopping help has been spawned by this
    very problem. In order to execute a program in the local directory that’s not
    in the path, you prefix it with a dot and forward slash (./).


    Windows 2000, on the other hand, indiscriminately execute programs in the local
    directory by default, which can easily lead to security problems for hosted Web
    servers and servers that have both home directories and Web servers.'
