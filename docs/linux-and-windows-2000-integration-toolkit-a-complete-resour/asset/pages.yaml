    you involve multiple users you should do all of your permission work by groups,
    except for the root account.


    Let’s take a typical day in the life of Ivan D., the sysadmin for a group of programmers
    on a project. A common situation is where a single developer needs access to a
    directory that he she doesn’t have already.


