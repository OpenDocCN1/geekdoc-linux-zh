  md: '# Setting Up a Printer with Linux


    There are two main choices when you want to configure a printer in Linux: edit
    the /etc/printcap file with a text editor (the old way), or use a GUI or menu-based
    tool to do it. For space and sanity''s sake, I''ll demonstrate adding printers
    with the tools commonly found on a RedHat 7.x box. If you are using another distribution,
    the text mode options will likely work with no problems, but your GUI options
    will vary.


    Printool isn''t the only way to set up a printer, but it''s much easier editing
    the file by hand, especially for those who are new to Linux and just want to get
    the printer working. Get a victory first, and then play around and fully understand
    it.


    Moreover, having added a printer using a graphical tool is a cool and quick way
    to get an example in the /etc/printcap file to help you understand the format
    for entries is like.


    > NOTE I hope you will excuse the similarities between adding a local and remote
    printer in this section''s examples, but the process is nearly identical. Don''t
    try unless you are very certain you know what you are doing; any typo whatsoever
    will disable printing for that entry, and might mess up others.


    # Adding a Local Printer (Text Mode)


    The procedure for adding a local printer (text mode) is as follows:


    +   1. Open up a shell prompt, or pull up a graphical editor.

    2. Edit the /etc/printcap file (as root, or say bye-bye to your changes!).

    3. To add a local printer, add the following lines, or your equivalent:


    ```

    hpdj540:

    :sd=/var/spool/lpd/lp0:\ (This is the spool directoryprinter)

    :mx0#:\n:sh:\n:lp=/dev/lp0:\ (This is the local printer)

    :if=/var/spool/lpd/lp0/filter: (This is the filter for the printer)

    Restart the lpd daemon (normally located in /etc//.init.d/lpd) by typing in:

    # /etc/rc.d/init.d/lpd restart

    ```


    > NOTE This will be different for other distributions, please check where the
    init.d directory is using the find command or exploratory completion by the Tab
    key!'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# Adding a Remote Printer (Text Mode)


    The procedure for adding a remote printer (text mode) is as follows:


    +   1. Open up a shell prompt, or pull up a graphical editor.

    2. Edit the /etc/printcap file (again, do this as root, or changes won''t be saved).

    3. To add a local printer, add the following lines, or your equivalent:

    ```

    sd=/var/spool/lpd/lp0:\ (This is the local spool directory)

    mx#0:

    sh:

    rm=192.168.1.221:\ (This is the IP of the remote host running lpd)

    xrp=lp:\ (This is the printer name on the remote host in printcap)

    lpd bounce=true:

    if=/var/spool/lpd/lp0/filter:\ (This is the filter for the printer)

    ```

    4. Restart the lpd daemon (normally located in /etc/.../init.d/lpd) by typing
    in:


    ```

    # /etc/rc.init.d/lpd restart

    ```


    > NOTE This will be different for other distributions; please check where the
    init.d directory is by using the find command or exploratory completion by the
    Tab key!


    # Adding a Local Printer (GUI)


    +   1. As root, pop up a shell prompt or Run the dialog and type "printtool."

    2. An error box about ncpfs and NetWare might pop up (see Figure 11.2), but you
    can safely ignore it unless you have NetWare printers you are trying to print.

    3. The Printtool main dialog appears next; press Add to add a printer (see Figure
    11.3).

    4. Choose the printer type you want to add, such as a local printer (see Figure
    11.4).

    5. Fill in the dialog with the correct information (see Figure 11.5). The name
    is usually Lp for the first printer, the spool should already be filled in for,
    the file size limit is up to you, and the printer device will need to be entered
    depending on what you have connected. (Hint: this is usually /dev/lp0 for the
    first parallel printer.) Then select the input filter.'
