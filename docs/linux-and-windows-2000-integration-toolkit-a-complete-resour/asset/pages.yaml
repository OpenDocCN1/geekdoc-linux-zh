    # Using SAMBA


    SAMBA is a suite of utilities that allows non-Windows systems to provide and access
    file shares using the SMB (Server Message Block) protocol, the protocol developed
    and used for Windows File and Printer Sharing in all versions of Windows since
    Windows 95, including Windows 2000. Recently, SMB has been renamed CIFS, from
    Common Internet System.


    # Installing SAMBA on Linux


    Installation of SAMBA on a Linux system is fairly simple. Fire up an ftp client,
    point it at ftp.samba.org, log in anonymously, browse to the /pub/samba-directory,
    and get the latest version; at this time, it is samba-2.2.0.tar.gz, but you can
    always get the latest version by downloading the samba-latest.tar.gz file.


    Extract the file from the download destination with tar xvzf samba-latest.tar.gz.
    Several directories and files will be extracted once named samba-2.2.0; the current
    version of the software will replace the 2.2.0 in the directory name. Change to
    this directory with cd samba-2.2.0; feel free to read the README file in this
    directory for more information about the installation and configuration of SAMBA.


    To compile and install SAMBA, change to the source directory and run the configuration
    script by typing ./configure and pressing Enter. The script will check for several
    required libraries and programs needed to compile and use SAMBA, most of which
    should already be installed on your system. If you get errors from the configure
    script, write down the error and install the appropriate libraries and/or programs.
    After the configure script runs, type make and press Enter to complete the suite,
    and type make install <enter> to install SAMBA on the system; the default location
    is in the /usr/local/SAMBA


    # Configuring SAMBA on the Server


    SAMBA configuration is handled entirely with the smb.conf file. In most cases,
    the SAMBA daemons will have to be restarted once changes have been made to this
    file for the changes to take effect. Typically, you can issue (as root) the command:


    ```

    $ samba restart

    ```'
