- img_proc: true
  md: '# Assigning and Managing IP Address Information


    # Performance Enhancements


    NT 4.0''s WINS Server had scalability problems, specifically related to connections
    with other WINS servers. WINS 2000 allows for persistent connections, which allows
    a WINS server to stay connected to its partners, instead of establishing and breaking
    repeated short connections. This allows for increased speed of replication and
    less overhead for those connections. Additional performance enhancements include:


    +   - Keeping records that should not be replicated and sent to other WINS servers.
    The state of the record and its imminent deletion on all WINS servers is communicated,
    but not the actual record content.


    +   - Comparing version numbers by querying multiple WINS servers, reconciling
    the differences, and then updating them all with the new version information.
    Version information is used to decide when a record is replicated, if it is to
    be marked for deletion, or of host''s current status. This helps keep consistent
    databases of client''s data.


    +   - New filters and searching options will allow easy handling of the largest
    WINS databases.


    +   - Better deletion and record management allows for GUI-based management that
    was previously only possible using Resource Kit utilities such as WINSCL.EXE.


    Windows NT 4.0 needed WINS to register its dynamically assigned DHCP addresses,
    to answer queries from DNS Server for IP addresses. You are freed from having
    to use WINS to register names in Windows 2000 except for legacy hosts, and even
    then only in certain situations.


    # Mixing DNS 2000 with DHCP Server


    Windows 2000''s name resolution cycle is simplified by having a DHCP server that
    can assign addresses, and optionally assist those clients by registering their
    hostname and IP address information with the Dynamic DNS service.


    Clients will follow these steps when entering the network:


    +   1. Clients lease addresses from DHCP Server.


    +   2. If client can do dynamic update with DNS, it does so.


    +   3. If a legacy OS, DHCP can register the address and name with DNS.


    +   4. Clients requesting name resolution will contact DNS.


    +   5. DNS does a database query and returns hostname/IP address information.'
  merge: -1
  pgno: 184
- img_proc: true
  md: '+   6. Clients cache name and address information for future use.

    7. When leases expire, DHCP notifies DNS, and DNS purges records.


    # Dynamic DHCP Update with DNS


    For the first time, Windows machines can interact with Dynamic DNS Servers, even
    if the client isn''t aware of the interaction. Microsoft has designed in backward-compatibility
    for all Windows clients that can get an address from DHCP Server 2000.


    # Method 1: Dynamic DNS-Aware Clients


    Windows 2000 DHCP clients have the capability to interact on a one-to-one basis
    with Dynamic DNS servers. As the DHCP client is getting its leased address from
    DHCP Server, it will negotiate how it will update its information in the DNS Server
    database. Either DHCP Server or the client computer will initiate the update of
    forward and reverse lookup records in DNS.


    # Method 2: Legacy DNS Clients


    Hosts that run legacy versions of Windows (anything previous to 2000) do not support
    dynamic update. With this mind, Microsoft constructed the Windows 2000 DHCP servers
    to act as an intermediary for these clients and them to register their forward
    and reverse records with the DNS servers.


    If you will primarily use Windows 2000 clients, leave the default client setting
    in place. This setting will allow the Windows 2000 clients to update their own
    A or Host records and employ DHCP Server''s help in updating only the reverse
    or PTR records.


    This helps keep the utilization of the DHCP server to a minimum while allowing
    the greatest client flexibility. Legacy clients will defer to the DHCP server''s
    settings, as they are totally unaware of the possibility of dynamic update.


    To changing dynamic update options on client systems:


    +   1. Right-click My Network Places, and select Properties.

    2. Right-click the network connection to be configured, and select Properties.

    3. Select Internet Protocol (TCP/IP), click Advanced, and select the DNS tab.

    4. Ensure that the Append Primary radio button is selected and the Append Parent
    check box has a check mark in.

    5. Finally, ensure there is a check mark in the “Register this connection” check
    box.'
  merge: -1
