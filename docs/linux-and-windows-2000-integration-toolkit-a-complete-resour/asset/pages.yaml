  md: '# AutoConfiguration of Proxy/Firewalls


    Often times corporate users travel to other locations to do work, check e-mail,
    or access the Web. Probably the most irritating issue to affect these users isn''t
    getting an IP address, it''s usually finding out what the proxy servers address
    is; Some users can be trusted to configure their own network and internet settings,
    but many are simply dead in the water until a support person can help them out.


    AutoConfiguration will assist these users by attempting to automatically detect
    the address of a proxy or firewall servers. Once detected, it will configure the
    user''s Internet connection settings as needed. Don''t confuse this with getting
    an IP address via a DHCP Server; there isn''t an option on DHCP Servers to distribute
    an internet/proxy server address, so far.


    # Offline Browsing


    Offline browsing isn''t just doing a File Save As in Explorer or Netscape. It
    is part and parcel of the suite of features known as IntelliMirror (Figure 3.5).
    IntelliMirror is primarily for intelligently managing user preferences and configurations.
    Offline browsing allows a user to secure pages from the Internet and to seem to
    browse the Internet when disconnected from networking. To make a site available
    offline, the user browses to the site and selects Favorites Add to Favorites,
    and then checks the Make available offline checkbox.


    ![](img/7c4d65772d38b487e72eb8750e4f3691_72_0.png)


    **Figure 3.5** IntelliMirror feature in Windows 2000.'
