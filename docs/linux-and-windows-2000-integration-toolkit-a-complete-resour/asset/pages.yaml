  md: '# Running the NIS Daemon


    You will need to reboot the server (yes, I know, but it''s not as often as Windows
    2000) to make sure everything loads properly.


    # Manually Starting ypserv


    Check to see if ypserv is running after the reboot by typing: "ps aux | grep ypserv".
    If you have to run it manually, it''s usually in the /usr/sbin directory.


    # Starting the NIS Daemons at Boot Time


    Typical installations of NIS will also make the correct symbolic links in the
    startup files, but if they don''t and you have to manually add them, runlevel
    3 is the best time to initialize NIS, although you can add more in in the different
    runlevels if you desire. Do this in the following steps:


    +   1. Change directory to the /etc/rc.d/rc3d directory.

    2. Create a symbolic link by typing: ln -s ../init.d/ypserv K84ypserv.

    3. This will start the program in order of filename sorting as the server reaches
    runlevel 3.


    Additionally, you will need to set the ypppasswd daemon to run at boot time, so
    your users can change their passwords on the NIS server.


    +   1. Change directory to the /etc/rc.d/rc3d directory.

    2. Create a symbolic link by typing: ln -s ../init.d/ypppasswd K34ypasswd

    3. This will start the program in order of filename sorting as the server reaches
    runlevel 3.


    Now, your NIS server is most likely functional, and you are ready to set up any
    secondary or slave NIS servers, if you want to. It''s important to perform the
    client setup on any secondary servers, as they will need to know about NIS as
    a client to function properly as a secondary server. After all the servers are
    configured, it''s time for your NIS clients, so they can take advantage of the
    newly available centralized login and security information!


    # Configuring an NIS Client


    After all of the steps and configuration hoops for the NIS master server, we have
    a comparatively easy installation for the NIS clients. While your Windows 2000
    machines might be beholden to the Active Directory DC in your'
