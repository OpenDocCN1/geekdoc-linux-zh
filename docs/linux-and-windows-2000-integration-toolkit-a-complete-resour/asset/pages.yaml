- img_proc: true
  md: 'Shortcuts. You can set up tons of hotkey combinations to open windows, close
    workspaces; just about anything can be bound to a set of keystrokes. (Hint: the
    Meta key usually refers to the Alt key.).


    Sound. Somewhat of a conflicting dialog with the Desktop/System sound properties.
    Best deice: Leave this one alone; try configuring sound in the Desktop Sound properties.


    Workspaces. Sawfish''s (or whatever WM) workspaces section, which might conflict
    with the desktop''s configuration. You are safest right-clicking on the Taskbar''s
    Desktop Pager (the little paneled thing), choosing Properties, and configuring
    it from there. If you want a good standard layout, choose four workspaces, one
    column, and one row.


    The Session section mostly contains startup information:


    Startup Hints. Options to display normal hints "Plant your corn early,Don''t drink
    and drive". Fortunes (messages that sound like fortune cookies or other), or message
    of the day (MOTD), which is a file that can select. If you want to, you can put
    that on a shared drive and update to provide session login information to all
    users.


    Startup Programs. Not allows only you to set the configuration choices for showing
    the Splash Screen on login, but also whether you are prompted (an extra step)
    when you choose to log out. You can set your own startup programs and view the
    running programs.


    The User Interface section contains:


    Applications. You can use this dialog to set the Menubar, Statusbar, and Toolbar
    options such as text labels, tearing menus off (for placement wherever), and icons
    on the menus.


    Dialogs. Sets the layout and behavior for all dialogs. Some dialogs can use the
    Statusbar of the application to display information, mostly items that don''t
    require your input or are simply results from an action.


    MDI. Multiple Document Interface options for GNOME. These settings affect how
    certain windows and the client documents in them are affected and shown.


    # GNOME Desktop for Windows


    As horrifying as it might sound, it''s worst! Yes, hide the children, lock all
    the doors—there is a way to run GNOME on a Windows machine. In this section, I
    borrow and quote liberally from the listed Web sites (hey, they say it best!).'
