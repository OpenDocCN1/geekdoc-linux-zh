    # # Loading the NIS Database


    At this point, we''re ready to get the NIS database loaded using the command

    “ypinit”. The command prompts you for any NIS slave servers you might

    have, and is dependent on your setting the NIS domain name already.

    If you did not, do it now, or you''ll get error messages and have to do it anyway!

    Unless you are ready to use an NIS slave server, you won''t name any other

    hosts, just the NIS master server. For the small scenario we are setting up, it''s

    not to have a slave server.


    The following are steps to initialize the NIS master server:


    +   1. Open up a shell prompt as root.

    2. Type /usr/lib/yp/ypinit -m (the -m parameter is used when the local

    host is the master server).

    3. The local hostname is automatically added, and the prompt will wait at

    the second name, which you won''t enter.

    4. Press Ctrl-D to quit adding hosts.

    5. The program will show you a list of the added NIS servers.

    6. Confirm the list by pressing “y”.

    7. The building of the databases is noted by the program, giving you an op-portunity
