- img_proc: true
  md: '# Graphical User Environments 125


    Turn off all screensavers. No one has had phosphor-burn for years. When you leave
    the console, press Ctrl-Alt-Del, then press the "K" key to lock the console. This
    locked mode will kick you into a screensaver in a few minutes, but a very low
    overhead one. Never, for any reason, run those damn OpenGL screensavers on your
    production servers. They will take a server up to around 90 percent and keep it
    there, especially the "Maze" screensaver.


    Keep the resolution low. Never take the GUI resolution over 800x600 and 16-bit.
    If you can possibly use 640x480 and 256 colors, do so. Every time you move the
    mouse around the screen, it sends a message for each X-Y coordinate to the message
    queue on the server, generating interrupts and taking a slight bit of processor
    activity. Don''t believe me? Run System Monitor for Processor Utilization and
    move the cursor around the screen at a fast rate, and look at what it does to
    the processor. With a large monitor for 1400×1050 and a fast mouse-controlled
    cursor, you can turn a $20,000 server into an expensive space heater.


    Don''t load special video card drivers. Never load any ATI graphics drivers or
    utilities, or any other screen enhancement tool. Why do you need to enable high-end
    video capabilities on a server? You don''t, and if they are loaded on the machine
    you can safely get rid of them when you set it up, do so.


    Keep the Clock Tray empty. If it puts an icon in the Clock Tray, it probably takes
    up RAM and processor. Do yourself a favor and disable all network card icons (3Com
    loves to put stuff in your Clock Tray), all video card tools and tools, and anything
    else that could possibly be unloaded. Try to eradicate all clock tray junk, even
    disabling the speaker icon—who knows, it might use a bit of RAM.


    How it isn''t! Never run the Symantec Norton SystemWorks, McAfee, or other "suites"
    of tools on servers. Running these sorts of tools on workstations are fine; there
    aren''t hundreds and thousands of people trying to wrest every last erg of performance
    of a workstation, usually. All I have gone to organizations for server problems
    and found these sorts of tools running on servers that were causing resource "brown-outs"
    by kicking in all sorts of automatic diagnostics, disk defragmenters, and such.


    Remotely monitor servers. When you have to monitor a server''s performance, try
    to do it from a workstation on the same subnet, as the network traffic is usually
    lighter in impact than the graphical utilization on the console will be to the
    server''s performance. If you have a service network (second card to a maintenance
    subnet), use that for monitoring to further reduce the load on the network.'
