  md: '# Milestone 2: Get the Project Approved


    This can be the hardest part of the whole project process, getting that first
    round of approval for your lovingly assembled work of high art, otherwise known
    as the Project Plan.


    It''s very important that the presentation to higher management be very clear,
    concise, and contain all significant buzz words. Ok, so I am kidding a little,
    but produce some nicely rendered 3-D color charts and graphs for most management
    teams and the real question in their minds is: "Note to self: find out what you
    used to make these charts." Make sure that you do not have a single iota of anything
    to hide in terms of agenda or budget. Nothing looks worse than having to go begging
    back to management because you left something out of the plan on purpose. Do first
    and ask forgiveness later is a great maxim for some situations, but this may not
    be the time for it. Get the budget approved first, then innovate with what you
    have and and can do. This will invariably free up some budget slush for cool things
