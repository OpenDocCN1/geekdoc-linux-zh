  md: '# Understanding Hosts and Subnets


    In the world of TCP/IP, there are two main components: hosts and subnets. A host
    is defined (by me) as anything that can be addressed by TCP/IP, or can be pinged.
    IP addresses consist of two parts: the network (subnet) ID and the host ID. The
    network or subnet is similar to a street, where the hosts are houses on that street.
    You can generally find a street in a city, and by traveling along that street,
    you can quickly identify where a house number is. In the world of networks, you
    can direct traffic to a host on that network by sending that traffic to the router
    that has an interface in that network. This router is responsible for contacting
    that host and delivering the packets that have been sent to it.


    To finish the analogy, hosts or houses are situated on networks or streets and
    are connected by routers or intersections (see Figure 4.5). This can help you
    understand why a particular host must be configured to know where a router is;
    otherwise, it cannot reach the other network in order to communicate with a remote
    host.


    A subnet is a logical thing that is largely referred to by associating it with
    a physical location. When you string cables and place computers on the 23rd floor
    of a building and then connect them all together to a hub, they are then a network
    or subnet/segment. When you configure a router’s interface on that network, and
    another interface on a separate network, you have connected


