    # NFS for File Sharing


    One of the really neat things about using NFS is the ability to attach and use
    data, no matter what the client OS or server OS are, as long as they support NFS
    proper. A user with the right permissions can access the needed data.


    If your company has a large number of Windows clients who need to access resources
