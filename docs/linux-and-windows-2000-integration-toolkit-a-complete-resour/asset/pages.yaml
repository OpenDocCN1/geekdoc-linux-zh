    # Using DHCP to Automatically Assign IP Addresses


    The most common method of assigning client IP addresses, DHCP only requires a
    few minutes to configure the DHCP server. Then, the clients start and automatically
    receive an IP address from the DHCP server with no manual intervention. This guarantees
    that duplicate addresses are not assigned and provides an easy mechanism for making
    changes. For example, you can change the IP address of the DNS server. When a
    client renews its IP address information or the client receives the new DNS server
    IP address.


    Microsoft recommends that you set an infinite lease time to your DHCP clients
    for permanent addresses. Although this is easier than visiting each computer to
    manually enter IP configuration, you should use this option cautiously, because
    changes in the IP configuration are not refreshed to the client during normal
    renewal cycles.


    # Using APIPA to Assign Addresses


    In the absence of a DHCP server, clients self-assign an IP address in the 169.254.x.x
    range described earlier in this chapter. You can also use APIPA to deliberately
    assign an automatic address to a client. However, you should not use this option
    in a routed environment, because APIPA does not provide a default gateway IP address.


    # Optimizing TCP/IP Availability and Performance


    Your network design is of little use if clients cannot access the network, or
    cannot access it in a timely fashion. When designing or revising a network design,
    evaluate all factors between hosts that might affect availability and performance.


