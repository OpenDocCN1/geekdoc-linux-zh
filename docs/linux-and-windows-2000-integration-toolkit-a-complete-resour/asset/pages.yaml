  md: "The forwarder resolves the name query and passes the result back to the original\
    \ name server. If the forwarder cannot resolve the query, the name server that\
    \ received the original query attempts to resolve the name on its own.\n\n# Exclusive\
    \ Mode\n\nIn exclusive mode, name servers rely completely on the name-resolving\
    \ capability of the forwarders. Name servers using forwarders in exclusive mode\
    \ are called slaves.\n\nWhen a slave receives a DNS query that it cannot resolve\
    \ through its own zone files, it passes the query to a forwarder. The forwarder\
    \ resolves the name and returns the query to the slave, which returns the query\
    \ result to the solver. The slave doesn't attempt to resolve the query on its\
    \ own if the forwarder cannot satisfy the query.\n\n# The Sun Sets on WINS\n\n\
    For the most part, you can safely move NetBIOS naming (WINS) to the status of\
    \ a legacy technology, even if you use a mixed environment. Every current MS Client\
    \ OS has the capability to use DNS as a name resolver, although not every host\
    \ will be to register itself with the DNS servers. That's where Windows 2000 DHCP\
    \ Server steps in. \n\nI've been using a variation on Table 8.3 for a long time,\
    \ either as a slide or on a whiteboard to explain the differences and similarities\
    \ of WINS, DNS and DDNS. Hopefully, it will prove as useful to you as it has to\
    \ all my students.\n\nThe WINS Server, resolves, and releases NetBIOS names with\
    \ IP addresses, is still available and even enhanced in Windows 2000, but you\
    \ will use this mostly for legacy OS integration.\n\n# Summary\n\nIn this chapter,\
    \ we took a fairly deep look into the use of DNS and naming on our two contestant\
    \ operating systems. We configured name resolution on both systems, configured\
    \ zones, and looked at the types of name servers, queries, and zone transfer methods."
