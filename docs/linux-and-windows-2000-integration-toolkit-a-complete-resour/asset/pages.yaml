    # Getting All the Players in Line


    Before you begin serving up IP addresses to clients, you have to set the options
    that govern your scope, its starting and ending addresses, and many other options
    that you can fully configure your clients with.


    You will either edit or create a new file: /etc/dhcpd.conf. On a Red Hat 7.x system
    (as of others), you will also need to create the lease data by issuing the command:
    “touch /var/lib/dhcp/dhcpd.leases”.


    nearly always mandate to attendees in classes that use the text mode configuration
    for their first several configurations of DHCP server. While there are several
    graphical options, including a simply linuxconf interface for DHCPD configuration,
    very few servers have a graphical interface loaded to handle any remote X or a
    Web server for Webmin requests.


    Remember that GUI interfaces usually don''t show you all the error messages when
    something doesn''t work. There will be times during the setup of a service or
    daemon you might have to revert back to the text mode to troubleshoot. You can
    always use the “d-” logging function to report errors, or if you are worried that
    your logging is not correctly saving the error information.


    # Understanding the DHCP Configuration File


    Let''s look at the /etc/dhcpd.conf file in sections, explaining how things work,
    and the various options you might see or use to provide IP addresses and other
    information to your clients. This file, as explained in the dhcpd.conf man page,
    contains parameters and declarations. For example, the “subnet 192.168.33.0 etc.”
    will be a declaration, as it sets the topology and scope of the file, while the
    “option routers” line would be an example of a parameter.


    Each declaration or parameter is explained on the same line as its name in Table
    7.1.'
