  md: '# Understanding Windows 2000 Printing


    Windows 2000 brings a load of new features and improvements to the printing arena,
    a few of which are listed next, and a number of which we will investigate in the
    last half of our chapter.


    # Components of the Windows 2000 Printing Subsystem


    Windows produces in general and Windows 2000 specifically use the follow-terms
    to define the printing process. Once you understand what''s involved, we can get
    to adding printers, configuring them, and printing jobs (See Figure 11.13).


    Print devices. When you see the term print device, does it make you think of the
    actual printer, or a control box that attaches to a printer? Previous versions
    of Windows systems have used printers and print devices interchangeably, which
    can be confusing. I always help students and clients understand this by saying
    the print device is the thing the printer paper comes out of. (Sometimes you have
    to get down to basics to get a foundation to work with.)


    ![](img/7c4d65772d38b487e72eb8750e4f3691_293_0.png)'
  merge: -1
  pgno: 293
- img_proc: true
  md: '![](img/7c4d65772d38b487e72eb8750e4f3691_294_0.png)


    Figure 11.13 Overview of Windows 2000 printing process.


    **Printer.** Confusing the issue even further, Microsoft uses the word printer
    to denote the software interface between the computers printing a job and the
    print device. When you see reference to a logical printer, this is often used
    to indicate a remote printer (for example, a printer that is not actually located
    on the local machine).


    The term printer actually refers to the unique name you see in the Start | Settings
    | Printers interface. Included in the Printer definition is the totality of printer
    drivers, special files, and anything else that is installed with the printer.


    Defined in the Printer interface are things such as the print device is located
    on, or the remote machine and printer name. Also specified are the protocols that
    are used to connect and deliver the print jobs to those devices, they are Data
    Link Control (typically HP printers), TCP/IP, or other protocols for special printers.


    **Print client.** Print clients are just what they sound like, an application
    on a local computer that is used to submit a print job to the printer software
    and from there to its eventual destination. It''s misleading to think of'
  merge: -1
  pgno: 294
- img_proc: true
  md: 'refer to a person as a print client, as the actual application is the making
    the request to the printing subsystem.


    **Print job.** A Windows 2000-generated print job is typically not formatted by
    the Print service for SMB data when it received. The print job is typically shown
    as two separate files in the spool directory:


    ```

    %systemroot\System32\spool\PRINTERs (this can vary and is easy to change)

    ```


    If you want to see what your print jobs look like, you can pause the printer,
    print a job, and then look in the spool directory. Typically, the directory will
    be two files per print job, both numbered and ending in a .shd for the control
    file and .spl for the spool or data file.


    **Local print provider.** The print job is accepted by the LPP (Localspl.dll),
    which is the entity that produces the spool (.spl) file and drops the control
    for job into a shadow (.shd) file to make sure the spool file can be reprinted,
    or processed if the job is interrupted or has to be restarted.


    **Remote print providers.** Since we are mostly concerned with integrating printing
    services, we need to take a hard look at the RPPs in Windows 2000. There are a
    total of three RPs, whose is to receive print jobs from the clients


    When a server is contacted and sent a print job, it compares the printer name
    in the list of print providers, sending the print job to the one whose name matches
    the print job''s control file item.


    When a Windows 2000 Print server receives a print job, it makes an RPC connection
    to the Spooler Service (spoolsv.exe), which in turn calls upon the printer router
    (spool.dll), which submits the print job to the Local Print Provider as if a local
    client were the sender.


    **Print Server.** The Print Server Service is the component that examines the
    spooled information and determines whether the spooler has to modify the printed
    document. Once it''s detected any changes, it modifies the job''s format and note
    data type in the shadow file.


    If the print job is not a recognizable data type, the spooler can simply forward
    it as. The Print Server Service normally sets a data type of RAW (which means
    ready to print, don''t touch!) for any print job that isn''t from a Windows NT
    or Windows 2000 machine.


    The Print Service for Unix usually accepts print jobs from Linux/Unix hosts as
    RAW, and won''t change their format data unless the data tells it. Linux and Unix
    applications that print to the Postscript driver will format the print job as
    it''s needed, and the print job won''t need reformatting as long as the target
    printer is a Postscript-compatible printer.


    **Printer pooling.** Another great feature of Windows NT and Windows 2000 is being
    able to define a single printer interface that actually governs multiple physical
    print devices. The print devices should be similar or to'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# Cross-Platform Printing 283


    identical, to reduce the possibility of formatting errors. You can also do the
    complete opposite, and define multiple Printer interfaces with differing options,
    to control the printing of a particular group, set time limits for color printers,
    and in general separate your printer users for more control.


    **PostScript printer driver.** Windows 2000 supplies a PostScript printer driver
    that conforms to Adobe''s version 4.3 Postscript printer description standard.
    This support is very important for Linux users, where the use of Postscript is
    rampant. Often, a print device is able to print almost anything a Linux user can
    submit as a job, simply because both are talking in Postscript.


    # Finding Printers in a Mixed Environment


    In order to add a printer, especially one''s not attached to your local computer,
    you first have to find the device! If it''s located on the network and is an object
    that is catalogued in Active Directory, you can use any number of options to find
    it.


    You can now find printers by a number of methods:


    +   - Browsing the network

    - Typing in a UNC (\\server\printer) name

    - Browsing to an IPP (Internet Printing Protocol) printer''s URL

    - Searching for the printer using the Active Directory features


    # Adding Your Newfound Printers


    When you find a printer, you can either add it via the Add Printer Wizard (the
    old way), or use the new Point and Print options. Point and Print is unique in
    that the server will interpret your print request, gather the drivers and files
    to add that printer to your computer''s configuration, and send them across the
    network, automatically! Point and Print is normally accomplished by right-clicking
    a printer in My Network Places, and then clicking Connect.


    Meanwhile, back at your local machine, you can add printers very easily by navigating
    to the Add Printer Wizard. Plug and Play works very well for printers that support
    it, or are supported by it. If not, you can easily add the printer via the wizard,
    specifying the printer make and model, and deciding to share it or not.


    # What Is IPP?


    Most Windows 2000 administrators don''t know they have enabled Internet printing
    until they accidentally discover it, or a user does. You actually enable'
