- img_proc: true
  md: 'We didn’t exactly slap him around at the next meeting, but he retracted his
    suggestion and we rolled them out with 64MB of RAM. The users were quite happy
    when they tested NT with that amount of memory.


    Another instance was when the project manager for the Windows 95 project at a
    large manufactured food organization decided to prove just how ludicrous "Minimum
    Requirements" on the box were. He set up an old Compaq 386-16 with 8MB RAM and
    a 150-MB hard drive, hooked up a VGA monitor and a mouse and keyboard, and put
    it on a pedestal outside his office for all to see. It took somewhere north of
    20 minutes for the whole OS to boot up and present the user with a login prompt,
    and loading MS Word took even longer. This did did to show that the minimums were
    really just that, the low end of the scale, and the users all got a big kick out
    of the museum relic. Interesting note about all of this that we had never had
    a complaint from the users about how slow their machines, even though the majority
    of their PC’s were 25 to 33 MHZ 486’s Viva la la difference!


    It’s also a good idea to let other teams evaluate their results; it helps some
    good feelings and lets them see your lab environment. I have learned some valuable
    tips from other teams when they come for a visit; a fresh perspective really can
    help, especially when you are eyebrow deep in your project!


    When planning the equipment for the labs, make sure you duplicate the two sections
    exactly, down to every detail. It’s also a very good idea to make the labs easy
    to separate from the production networks and from each other by simple cable removal
    or switching connections. Remember, you are about to mirror two networks, and
    they might not work properly if they find others on the network with the same
    naming or IP addresses


    A final note about separating the labs. You should consider getting the labs their
    own firewall and connect to the Internet if possible, thereby reducing their dependence
    (and possible impact!) upon your production network. Your network and geeks will
    thank you!


    Consider using Ghost or Drive Image Pro to make your labs easy to refresh with
    the pre-integration setup. Ghost and Drive Image Pro are not the only packages
    that can help, but they are the most common. I particularly like the pricing on
    Drive Image Pro. You pay one fee for a "Technician License" and that tech can
