  md: '# Cross-Platform Printing


    Linux is very Unix-like in its printing, and small wonder! Mostly adhering to
    RFC 1179, or the BSD-Style printing, it''s relatively simple to get a printer
    set up.


    While Solaris and other SVR4 systems typically use the Termio service for printing,
    Linux defaults to using the lpd daemon for printing, and a host of commands for
    printing, managing printers options, and managing the printer spools.


    Windows 2000 uses a very similar printing process to Windows NT 4.0, where data
    is sent from a program to the printer queue, which is really spool directory,
    and then across to wherever the printer is hosted. It, too, has compatibility
    with BSD-Style printing via its Print Services For Unix. (see Figure 11.1) a logical
    progression from Windows NT 4.0''s TCP/IP Printing Service.


    # Understanding the Linux Printing Process


    A good number of Linux newcomers feel that they have really arrived in Linux when
    they have overcome the barrier of getting things to print correctly. There'
