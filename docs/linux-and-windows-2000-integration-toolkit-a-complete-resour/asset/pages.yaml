  md: '# Configuring DHCP Server Properties


    There are several things you can do to managing DHCP even more pleasant. The interface
    is quite easy to use and understand, but still is not as easy as editing a text
    file, as you did in Linux. I guess it''s really what you are used to, isn''t it?


    # Getting Statistics on DHCP Server


    By right-clicking on the server name and choosing Properties, you can now configure
    how often the statistics for the server will be updated. Take care not to set
    this to so small a value that it constantly checks the statistics and negatively
    affects the performance of your server!


    # Logging Performance and Troubleshooting Information


    Next, you have the option to write daily performance and troubleshooting information
    to a log file that can save a great deal of research and time for a malfunctioning
    DHCP server. For those who will still be using BO, there is an option to enable
    its support and set up its options for clients. Finally, and probably the greatest
    option that can be set for a DHCP server in a busy production environment, is
    conflict detection, found on the Advanced tab. In addition, there are some log
    file settings and server bindings, which are out of the scope of this discussion.


    # Superscope


    A superscope is made by combining multiple child or single subnet scopes into
    a larger scope. This is very helpful when you have several subnets on the same
    physical segment and want to reduce your need for routers. Essentially, you can
    aggregate two or more scopes into as large an IP pool as you want or manage. The
    wizard will walk you through this process, although many will never need or want
    to configure superscopes.


    # Multicast Scopes


    Multicast is a newer implementation of network traffic, where groups of hosts
    are listening for traffic on specifically configured port. Let''s understand the
    three main types of traffic on a network:


    Unicast (direct send). One host addresses traffic directly to the other, similar
    to a person-to-person telephone call.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Assigning and Managing IP Address Information


    Broadcast. A host sends out a set of packets that are addressed to all hosts on
    that network. A broadcast is like using the intercom at work to page someone whose
    location you are unsure of.


    Multicast. A multicast is similar to a conference call with a particular group
    of people, all who are listening for information on a specific port or who will
    do something with the information. Using multicast will reduce the amount of traffic
    needed for special purposes, like collaboration using NetShow and NetMeeting,
    or RealNetworks Media Servers.


    # Scope Classes


    Scope classes are a feature that makes sense on paper, and probably will gain
    some popularity in the sort of organization that knows exactly where all its istanbul
    desks are, but normal folks won''t get use out of this feature yet.


    # Vendor-Specific Options


    In NT 4.0''s DHCP Server implementation, there were no classes of clients, they
    were all the same; they get an address or they had a reservation. In DHCP Server
    for Windows 2000, there is a powerful new function called scope classes that allows
    options to be assigned based on vendor-specific information. Because the standards
    process for new DHCP options can make the FDA''s drug approval process look speedy,
    vendors can choose various options and have them triggered by data bits that are
    embedded in systems or BIOS. They are described in excruciating detail in RFC
    2132.


    # User Class Support


    Historically, all DHCP clients systems were equal and users did not even matter
    to the DHCP process. The advent of User classes allows DHCP clients to specify
    what type of a client they are. There is a world of difference between the optimum
    configuration for a desktop and a laptop, for example. A laptop client would receive
    a shorter lease, as its long absences from the network couldn''t orphan an address
    each time. Similarly, a regular desktop client would be able to have a much longer
    lease, as it would be moved infrequently, if at all. A variety of options can
    be set this way, including WINS, DNS, and length of the lease.


    # Using the DHCP Relay Agent


    If your routers do not conform to RFC 1452 for the forwarding of DHCP broadcast
    packets and cannot be upgraded, you can set up a Windows 2000 or'
  merge: -1
  pgno: 178
- img_proc: true
  md: 'Windows NT Server 4.0 server to act as the relay agent between subnets by installing
    and configuring DHCP Relay Agent service. A relay agent is a device or application
    that can pass DHCP or BOOTP messages from one subnet to another.


    # Installing DHCP Server for Linux


    The package or install files for the DHCP daemon are included in every distribution
    I have ever seen, so it''s a matter of either picking that particular option from
    a "Customized" install or choosing the "Server" option that most distributions
    offer. Obviously, you should not install daemons or services if you don''t need
    them, and certainly they should not be running if needed.


    # Package or Compile?


    If you have a running system that doesn''t have the DHCPD daemon on it, you can
    either download a prebuilt package and install it (RPM, TGZ, DEB), or download
    the source files and compile it. What you choose to depends depends on your comfort
    level. Compiling can be somewhat confusing to novices to Linux environment, while
    some "seasoned" admins won''t touch an RPM or DEB package with a 10-foot pole,
    preferring to compile everything from the source. I usually recommend using a
    package manager to install things like this on running machine, at least the first
    couple of times.


    # Fixing an Older DHCPD for Use with Windows Clients


    To be fair, Linux commits a violation of the DHCP Protocol specification by converting
    an overall network broadcast address (255.255.255.255) into the local subnet''s
    broadcast address (192.168.40.255). This doesn''t affect a number of other DHCP
    clients, but of Microsoft''s DHCP clients will issue a DHCPCOVER, and then ignore
    the resulting DHCPPOFFER that returns from the Linux server.


