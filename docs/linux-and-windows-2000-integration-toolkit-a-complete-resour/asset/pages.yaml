    binary on your physical machine or from a mapped drive, you are using your CPU
    cycles to run that application; hence, it’s local.


    Linux uses the Xfree86 implementation of the X Window system, which is compatible
    with, and operates like, X11R. Xfree86 uses a separate X server for each type
    of controller; for example, VGA, MACH32, 8514, SVGA, S3, Mach64, and so forth.
    Most will use the free implementation of Xfree86, which are commercially distributed
    versions, such as the AcceleratedX MetroX or MicroX servers. They are very well
    designed and polished, but usually regarded as an unnecessary expense. Some of
    the older or “mature” distributions of Linux such as Slackware have included free
    versions of MetroX.


    # Components of the Graphical Interface


    The graphical display portion of the X Window environment can be a little confusing
    and get a little cluttered with the different pieces. Let’s take a look at the
    three most important parts, and explain how they work together (mostly).


    # Display Managers


    Display Managers (DM) are the hardest part of the whole graphical environment
    to get your mind around, since nothing can happen without the DM. But you really
    dont “see” the DM, you see the different Window Managers or Desktops, and they
    provide the user’s interface to the DM.


    Display Managers can control one or more X servers, which are required to run
    X clients. Unless something catastrophic happens, if an X server dies or is killed,
    it will restart itself and continue to provide display functions.


    If you have configured your Linux machine to run in multiuser mode with networking
    and graphics, and it reboots to a graphical login screen, you are really looking
    at the face of the Display Manager at that time.


    Before users log in, they typically have the option to select their preferred
    Window Manager and other options from the opening screen of the Display Manager.
    When users type in their username and password, and gain entrance to the console
    or desktop environment, they can face the XDM, GDM, or KDM Display Managers, depending
    on what Window Manager or desktop is loaded.


    You can change what the machine boots up with the command-line interface (CLI)
    or the graphical user interface (GUI) by altering the /etc/initab file, setting
    its default runlevel. The different distributions use the runlevels in a slightly
    different way. For example, Red Hat machines use runlevel 3 for multiuser, with
    networking and Text Mode. If you alter the /etc/initab file to reflect a default
    runlevel 5, it will boot to the state, but running present you with a Display
    Manager for login (see Table 6.1).'
