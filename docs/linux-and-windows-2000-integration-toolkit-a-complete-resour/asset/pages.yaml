    # # Modifying Your Prompt


    Your prompt can take many different forms, from the merely decorative, to the
    informative, to the simplistic. Sometimes it''s essential to security and system
    integrity to know certain information on the command prompt, such as the current
    user and the current directory.


    Others have made the suggestion that you could color-code your systems, particularly
    with several to many X-term sessions open on your desktop doing maintenance, and
    so forth.


    The wily sysadmin will just enough information on his or her prompt to keep from
    deleting the wrong files, configuring the wrong files, shutting down or rebooting
    the wrong systems.


    # # The PS1 and PS2 Prompts


    Four variables affect the different prompts, PS1–PS4. The normal user will never
    see the last two, and rarely the PS2 prompt.


    PS1 is the main system prompt, the one shown to the user in every shell session
    for which it''s configured. It''s configured by the shell variable PS1. The PS2
    prompt shows itself when you accidentally type in the wrong thing, causing the
    system to wait for a command continuation, or press a character like the backslash
    \".


    You can feel around with changing your prompt simply by entering the control strings
    at the current command prompt. If you do this, that session only will be affected,
    and you don''t have to worry about munging up your prompts for good.


    Let''s start simple and work our way up to the complicated ones. The first and
    easiest prompt is the number sign, (#). Make sure to put it in double quotes and
    insert a space after the # sign; it makes things much more readable.


    ```

    [root@ildebian] PS1="#"

    # ls

    data test stuff

    #

    ```'
