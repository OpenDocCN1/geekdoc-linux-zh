    # Users and Ownership


    System Administrators will need to follow closely in this section; it''s very
    important to get the ownership of files right, otherwise shared resources won''t
    be accessible to the various users who need them.


    # How Windows 2000 HandlesHandles Ownership


    When you are a user on a Windows 2000 system, you have an account, which is assigned
    to a group called Everyone and usually to a few others. When you create a file,
    by default there isn''t a group that “owns” that file. It is possible to cause
    a group to be assigned to a file or directory, but it''s not easy or intuitive.
    Let''s do an experiment to show you how this looks from the DOS perspective and
