- img_proc: true
  md: 'Multimedia. This section allows you to choose the Sound selection and the options
    for the Sound Server''s startup, if sounds are enabled. Then, on another tab in
    the dialog, you can set which sounds are assigned to what action. Not used very
    much, sound is nice, but there''s less need to be totally cute like on a Windows
    or Mac machine.


    The Peripherals section contains three choices:


    +   **CD Properties.** You can set the autorun program handling, auto-mounting
    options and the instantiation of a new File Manager when a CD is mounted.


    +   **Keyboard.** You can set the key repeat rate and other such exciting touch-typist
    things.


    +   **Mouse.** The acceleration and threshold are set (threshold is the speed
    at which the acceleration parameters take effect).


    The Window Manager section is comprised of:


    +   **Appearance.** A duplicate and sometimes conflicting area with the desktop,
    best left alone. The Desktop properties to configure this if possible.


    +   **Focus Behavior.** Allows you to set what happens when your mouse enters
    a window''s “airspace,” or if you have to click a window to set the focus. (Focus
    is similar to the Windows Foreground/Background situation).


    +   **Matched Windows.** Allows you to exercise the most exquisite control over
    your windows'' size, position, and so forth. You basically enter the method for
    recognizing a window, and all the parameters to be matched to that window. For
    example, you could set it so that all instances of a given shell or application
    were set to the lower right of the screen, a certain size, and other properties


    +   **Meta.** This sets the level of menu options available to the current user,
    beginner, intermediate, and advanced.


    +   **Minimize and Maximize.** Sets the actions a window takes when you Alt+Tab
    to reach it, and/or bring it back to maximized.


    +   **Miscellaneous.** Lots of different window and tooltip options.


    +   **Moving and Resizing.** The tiny options that control how a window is moved
    and resized, including if the window is attracted, magnetized, or shows resistance
    to other windows, and also things like if the contents are updated while it''s
    being moved, or after it''s released.


    +   **Placement.** One of the hidden jewels among the crowd, this is where you
    can remember the size, position, and other attributes of windows. Some options
    are turned off by default, a very irritating situation to one who has ever spent
    15-30 minutes rearranging his her various desktop to achieve “state” anywhere
    from one to several times a day.'
