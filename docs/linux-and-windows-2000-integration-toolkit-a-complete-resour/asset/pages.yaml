  md: '# Integrating Network Protocols


    Local packets. When sending to a local host, it first checks the ARP cache to
    see if the needed host is listed, and what its Media Access Control (MAC) address
    is. If it doesn''t find the MAC address and IP address listed in the local cache,
    it will broadcast on the local subnet with a request for the host to reply with
    its MAC address. If the host exists, or is up, it will reply with the correct
    information and update its ARP cache for that host. Then they can communicate
    with each other.


    Remote packets. When a host needs to contact a host on a remote subnet, it will
    first look in the routing table for a specific route to that particular subnet.
    If it finds one, it will then do the local packet scenario for the gateway address,
    and send the traffic to the gateway to deliver it to the target host, or forward
    along its way. If you look at the routing table, you will see an entry "0.0.0.0,"
    which is shorthand for the default gateway. Hosts that know how to send traffic
    to their default gateway don''t have to have routing entries for remote subnets.
    Of course, the routers and gateways must know how to route these packets to the
    remote networks and hosts, but that''s another book in itself.


    The only thing you really need to understand about this process is if you cannot
    reach a host, you should check that both your and that host''s subnet mask are
    correct; it''s the combination of the IP address and the subnet mask that produces
    the AND''ed total (see Figure 4.10).


    Once you have determined what the AND''ed total is, it can be compared with the
    other hosts'' AND''ed total to find out what subnet they are on, your local one
    or the remote (see Figure 4.11).


