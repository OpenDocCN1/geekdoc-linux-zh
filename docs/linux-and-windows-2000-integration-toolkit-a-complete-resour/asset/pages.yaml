    # Filesystem Permissions and File Attributes


    To prevent unauthorized access or tampering of files on a filesystem, permissions
    are implemented. Permissions are checked on a file whenever a user or a program
    attempts to open, modify, or delete the file. Similarly, permissions on a directory
    are checked whenever a modification is attempted on the directory, directly, by
    opening or deleting the directory, or indirectly, by creating or modifying files
    contained within that directory.


    # Linux Filesystem Permissions


    Permissions under Linux restrict files and directories under a three-tiered hierarchy:
    Owner Permissions, Group Permissions, and World Permissions; and each of these
    divisions can be granted permission bits for read, write, and execute privileges.
    If a file has read and execute bits for Owner, Group, and World, but only has
    write bits set for Owner and Group, then the file can only be modified by the
