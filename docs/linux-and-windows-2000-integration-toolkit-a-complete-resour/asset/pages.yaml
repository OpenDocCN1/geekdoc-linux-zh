    # Windows 2000 Server for NIS


    On the Windows 2000 side of the NIS integration is the Services for Unix and the
    Server for NIS (which is nearly all environments, I believe), the ability to interoperate
    between systems is key, and interoperation between naming and management services
    is even more important. Microsoft takes an interesting (but predictable) tack
    with its Server for NIS, by requiring Windows 2000 and the Active Directory to
    function at all; they tie you into your schema for NIS.


    Server for NIS is an extremely compatible NIS server implementation that runs
    on Windows 2000, and emulates (replaces) a Unix or Linux NIS server completely.
    Point of fact, Microsoft makes you use Active Directory and Server for NIS as
    the Primary (Master) Server, and made it incapable of being a Slave Server for
    Unix/Linux NIS Masters.


    # Problems that a Server for NIS Can Solve


    The problems that an NIS Server for can solve are as follows:


    Disparate or Duplicate Accounts. The very fact that you have Windows and Linux
    systems on your network means that you are already maintaining'
  merge: -1
  pgno: 360
- img_proc: true
  md: 'separate accounts on each system type. Even if you do have Active Directory
    for your Windows 2000 accounts and NIS for your Linux accounts, you have to manage
    them separately, equaling twice the work. This is analogous to running two discrete
    NT Domains and having to constantly try to set passwords and keep user accounts
    updated across these systems, with no common management interface.


    Different Logical Schema. No one could argue that Windows 2000 and Linux have
    different methodologies, interfaces, and security mechanisms. Managing both can
    be much more work than integrating the two, and a common interface can make life
    a little easier, if you can ever get over the horror of running your NIS Master
    Server on a Windows 2000 book. Yeeesh, it''s creeping me out right now. Next topic.


    # Why Microsoft Developed Server

    for NIS


    Remember Novell? Remember how Microsoft came out with a plethora of tools designed
    to integrate (migrate) users and data from Novell servers? Remember how well those
    tools worked? Do you also remember how clueless Novell was, or apparently secure
    it was in how technically superior its products were? Finally do you also remember
    the giant sucking as people locked, stock, and keyboard over NT Servers and Domain
    instead of going through all the tough planning needed for Novell Directory Services
    (NDS)? I jokingly (sort of) call Active Directory “Novell''s Revenge,” as those
    people who jumped for NT now have to do the exact planning they were trying to
    escape, and in a hurry too!


    We''d have to be to miss the real intent of Server for NIS and any other tool
    that comes for Linux and Unix “Integration” from Microsoft. Microsoft will cheerfully
    try to get customers to their accounts, management, and business on Active Directory,
    in order to secure the business and continue the profit margins. It''s ok, all
    businesses do something like that, but the Open Source and Free Software community
    has a great way of dealing with things like this. We give better software for
    free, and continue to develop and enhance it, all while keeping an eye on what
    Microsoft is doing.


    For the most part, we don''t do these things for cold hard cash (especially with
    the state of the economy currently!) but we do so that everyone has a chance to
    choose software, modify it, and get patches much faster.


    # What Are the Good Things about SFN

    (Server for NIS)?


    Some of the good things about SFN are listed here:'
  merge: -1
  pgno: 361
- img_proc: true
  md: '# Linux''s NIS and Microsoft''s Server for NIS 349


    NIS Maps in Active Directory. SFN uses the Active Directory schema management
    and stores NIS maps in Active Directory. This allows for replication to SFN servers
    via one method, reducing some of the overhead and traffic of propagating two systems''
    worth of information.


    Creation of Unix attributes in AD. This allows NIS Map files to be stored as AD
    Objects, so they are available to any other AD Domain Controller. Simply install
    SFN and activate it, the maps will be available almost instantly.


    Migration of NIS Domains to AD. This isn''t really a good thing about SFN, but
    if you really must have everything based on AD, and integration is the best thing
    to do, I suppose you could. You might want to have a NIS wake first, and start
    the grieving process.


    Single Management Interface. While this is a good thing, it does mask some of
    the complexity, do so well. There will be occasions where you will curse the day
    you migrated over, and to edit a text file so you can fix it, and not have to
    use the GUI interface.


    Password Synchronization between AD and NIS. This is a good thing. Anything that
    can help users not have to type in multiple passwords and isn''t actually going
    to land you at the Gates of Hell is a great thing. As a Linux sysadmin, you might
    still be unsure if you will head south after parting this mortal life, especially
    if you consign NIS to Active Directory.


    # How NIS Maps Are Integrated into Active Directory


    When you perform an integration, or migration if you prefer, SFN takes the existing
    NIS map files and creates users, groups, and host objects in the Active Directory
    Schema. Here''s what happens when the migration occurs:


    User Accounts. SFN will take each entry from the NIS passwd entry for the user,
    and make that user a full AD citizen. If an account entry matches an existing
    user in AD, the user attributes that are needed for SFN are added to the user,
    modifying the schema accordingly, and the user in AD is also a NIS domain user
    now.


    > WARNING You can freely overwrite user account information when integrating these
    two services! Inventory your accounts on both sides for matches, and make certain
    that conflicts between two users don''t occur. This can become a complete nightmare
    with large organizations, as there currently isn''t an “UNDO” button in the integration
    tools.


    Groups. SFN again takes each entry in the NIS group''s map file and does both
    a creation for new groups and updates existing groups in AD with'
  merge: -1
  pgno: 362
- img_proc: true
  md: 'their new members. That’s where the similarity with the user account-integration
    process ends. AD treats NIS groups and AD groups in a strange manner. If your
    SFN migration creates a group for NIS, and there are NIS accounts that are members
    of that group, they are treated properly and will be members of NIS group in AD.
    However, NIS and AD don’t keep the group memberships synchronized, they keep separate
    membership lists.


    NOTE Frankly, this is due to the way Linux and Windows 2000 handle groups. When
    a user is created on a Linux box, he or she has a default group that is stated
    in the /etc/passwd entry, and this group is the primary group for all items that
    user creates on the system. The Linux user can belong to other groups, but they
    can only have one primary group, unless they use the newgrp command to switch
    to another. Windows 2000 allows for an account to have any number of different
    groups, with the same significance, and by default doesn’t even assign a group
    to the object owns.


    This situation can be vexing to the integrating system admin, and it is a level
    of complexity that can make complicated situations worse and cause a lot of rounded
    shoulders and flat foreheads. You know that old military, don’t you? “Why do second
    lieutenants have rounded shoulders and flat foreheads? Because when you ask them
    a question, they shrug and say ‘dunno’ and then you tell them the answer, they
    slap their forehead and reclaim ‘Oh, of course!’ My sincere apologies to all the
    officers out there reading this, but you know how you were when you first got
    that butter bar, admit it, come on!


    Hosts – Hosts are handled in a straightforward manner. The NIS hosts map entries
    are created as members of the computer class in AD, and their address and name
    information is resolved by the Windows 2000 DNS Server functionality on that AD
    is based.


