  md: '# System, User, and Group Administration


    # User and Group Accounts


    Nearly everything you can do in either Linux or Windows 2000 requires access or
    permissions through an account: superuser, administrator, system account, or normal
    user. No matter if it’s Linux or Windows 2000, there are accounts created by default
    during the installation process. Chief among those are the “root” account on Linux
    and the “administrator” account on Windows 2000.


    It’s vitally important for system administrators to know how to add, manage, delete,
    and take advantage of user and group accounts. A clear understanding of how to
    manage users and groups can make the difference between a smoothly functioning
    system and a total mess, insecure and dangerously open.


    # “God, Root, What Is the Difference?”


    With apologies (and many thanks for inventing, drawing, and “BEING” User-Friendly)
    to J. D. Frazier, there isn’t much difference between being the “root”/“superuser”
    and the “administrator” on Linux and Windows 2000 systems, respectively. All allow
    you (mostly) unhampered access to the system, its'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'devices, and files. Along with all this power comes an unprecedented ability
    to screw things up. Nearly every newbie, no matter the operating system, has committed
    that quick and easy deletion that results in hours of attempts at re- and sometimes
    forces a reinstall or restore from backup.


    # Resisting Temptation


    The temptation to run as root on a Linux system is addictive to most newbie users,
    and some system admins regularly run as root, the functional equivalent of playing
    catch with a hand grenade.


    If you are new to Linux, or haven''t been root on a system before, the best thing
    you can do is learn how to do everything without being root. For anyone who has
    ever been denied the ability to use portions of the De-bian distribution (such
    as Netscape Communicator) while running as root will know what I mean. Go on,
    run as a normal user, be the mouse, be the mouse...


    # Administrator on a Windows 2000 System


    While administrator access is very similar to the Linux root user, there are some
    important differences. Chief among these is the safety net (some would say it''s
    fool-proofing) that Windows products impose on the system, mainly to keep you
    from deleting important stuff. Microsoft has gotten an incredible number of people
    calling to report bugs that actually deleted important files or otherwise “improved”
    their systems. It''s apparently a design goal to put as many layers of protection
    and abstraction between the typical user and the sys-tem as possible.


    While it''s heresy and a really bad idea to run as root on a Linux system, you
    can often get away with running as the administrator on Windows 2000. The usual
    Windows 2000 system is not secured well as far as the local file sys-tem''s permissions,
    and often any attempt to make it really safe and secure will get the poor system
    admin yelled at and worse. The Windows 2000 Administrator is more of a minor deity
    or an Apostle than a God on the sys-tem, there being some things you just can''t
    do, no matter how much you want to go. Ahead, try deleting the %systemroot while
    Windows 2000 is running, it won''t let you.


    # Giving Normal Users

    Administrator Access


    It''s not a good idea for bosses and supervisors to force administrators to give
    a normal user (sometimes the CFO or CEO) administrator access “just to make it
    work.” Myriad things can go wrong here, from trashed local systems to'
