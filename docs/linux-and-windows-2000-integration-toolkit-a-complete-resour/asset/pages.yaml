    It''s a total tradeoff, depending on the number of users and their applications.

    If you have UNIX/Linux expertise in the organization, you are likely to be

    shouting "Use X!" at the book as you are reading this. That is my first choice.

    Running X emulation simulations on remote machines is a very useful

    basically unsecured. The other choice would be Windows 2000 Server,

