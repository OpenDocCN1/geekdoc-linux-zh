    # Servers and Domain Controllers in AD


    In Windows 2000 and Active Directory networks, you are no longer bound to the
    primary and backup domain controller scenario! All servers that are domain-controllers
    fulfill essentially the same purpose, to keep and replicate the Active Directory
    objects and information.


    All of Active Directory''s domain controllers are equal in their functionality.
    Although some assume different functional responsibilities, the servers are all
    capable of being any of the roles. In addition, each DC contains a read/write
    copy of the domain''s directory. Changes are possible from any point of the Active
    Directory, and will take place using multimaster replication to propagate the
    changes to all other DCs, eventually. The different functional roles assist this
    operation, and are discussed a later in the chapter.


    # Manipulating the Server''s Roles


    Windows 2000''s peer domain controller architecture makes any server capable of
    being a domain controller! You can enable/disable this capability for any given
    server via a wizard at any time, requiring only the right authorization and some
    names and IP address information. This relieves one of the main frustrations with
    NT 4.0''s DC, which has the inability to move a domain controller between domains
    without major surgery and reinstallation, or buying a third-party utility. With
    Windows 2000, you can easily deploy the DC to a member server, shut it down, move
    it, and boot and run the Active Directory Promotion Wizard to make it a DC in
    that domain.


    A DC can either join an existing domain or be the first DC in a new domain. When
    a DC joins an existing domain, it becomes a replica DC, receiving its own read/write
    copy of the directory and is a full partner in domain replication.


