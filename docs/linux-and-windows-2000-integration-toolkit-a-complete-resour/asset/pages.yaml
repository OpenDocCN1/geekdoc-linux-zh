    or Administrators groups.


    # Configuring Scopes for DHCP 2000


    DHCP has many new features and interface improvements in the DHCP Manager and
    how it handles the setup of scopes and adding options. Remember that scopes are
    the available pools of IP addresses you will be leasing out to your client systems.
    Only one scope per subnet per server is allowed.


    # To Add a Scope to DHCP Server


    +   1. Choose Start, Programs, Administrative Tools, DHCP.

    2. If you have more than one server, select the correct name and IP address of
