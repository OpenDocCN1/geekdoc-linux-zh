  md: '# Naming


    When you are considering a migration or conversion, you will have to give a certain
    amount of attention to naming conventions. Linux is completely and consistently
    case sensitive. If there is a single character that is uppercase or lowercase
    between two filenames, they are considered totally different files. Windows 2000
    is very inconsistent, or "differently consistent," with regard to a filenames
    case. Some serious errors can occur if you don''t take care of naming of files
    and directories on systems that will be accessed by clients of both system types.


    Windows 2000''s developers and marketers call it "case aware." This is analogous
    to being a little bit dead, or sort of pregnant. If the file is longer than the
    old DOS 8.3 file. If so, the system will generate a long filename (LFN) and short
    filename (SFN). The Windows 2000 system will automatically and usually generate
    both LFN and SFN for a created file, as long as the file is longer than the 8.3
    specification.


    The Windows 2000 documentation states:


    When there are five or more files that would result in duplicate short filenames,
    Windows NT uses a slightly different method for creating short filenames. For
    the first and subsequent files, Windows NT:


    +   - Uses only the first two letters of the short filename.


    +   - Generates the next four letters of the short filename by mathematically
    manipulating the remaining letters of the long filename.


    +   - Appends ~1 (or another number, if necessary, to avoid a duplicate filename)
    to the result.


    You can prove this by creating six files with names longer than 8.3 characters,
    but it''s best to take their word. The excuse for this confusing arrangement is
    that it will increase performance when a large number of files with both LFN and
    SFN need to be created.


    To prove the inconsistent nature of the Windows case-sensitivity structure, try
    the following:


    +   - Create a file "ALLCAPS.TXT" (Note: Don''t use the POSIX "touch" command;
    try "copy con ALLCAPS.TXT" and type in "ALLCAPS.TXT" and press F6 and Enter to
    close the file.


    +   - The system will create a file named "ALLCAPS.TXT", and there won''t be an
    LFN and SFN generated because of the length of the name.


    +   - Try deleting the file by issuing the "del allcaps.txt" command. The "case-aware"
    nature of the Windows 2000 system will allow that command to delete the file we
    created, even though it uses a lowercase filename for a supposedly uppercase name.'
  merge: -1
  pgno: 131
- img_proc: true
  md: 'Ok, we proved that Windows 2000 is not consistent, in that it will delete an
    uppercase name with the del command and a lowercase filename. Now, let''s see
    what happens when we create a file that is longer than the 8.3 format. To create
    a file that generates both the LFN and SFN, do the following:


    +   - Create a file named "ALLCAPSLONGERTHAN8CHARACTERS.TXT" using the copy command
    as shown previously. Don''t forget to type the filename into the file as a way
    of determining later what file has been deleted.

    - Type "dir/x" to view both the LFN and SFN.

    - The file shows up, complete with the LFN; "ALLCAPSLONGERTHAN8CHARACTERS.TXT",
    and the SFN; "ALLCAP-1.TXT".

    - Create another by typing in "copy with allcapslongthan8characters.txt", entering
    that filename into the file in lowercase and pressing F6 and Enter.

    - Notice that the system asks you if you want to overwrite that filename? Answer
    Yes and press Enter.


    # Lessons Learned from This Demonstration


    First, there are two filenames created whenever a file exceeds the old DOS 8.3
    filename convention. Second, Windows 2000 is hampered by the creation and referral
    to SFN; it can mistakenly overwrite a discrete filename and its data with another,
    based on the SFN, not the LFN. Third, there are numerous instances where the programs
    involved will not be so courteous as the COPY command, and will simply overwrite
    the existing filename and its data with the new file. Disaster can strike in unexpected
    places in this scenario.


    # The Cure for LFN/SFN Blues


    Disable the generation of SFNs. The Microsoft Knowledge Base article Q210638 details
    how and why of disabling SFNs.


    Here is how to edit the Registry to accomplish the disabling of SFN generation:


    +   - Click Start, click Run, type "regedit32" (without the quotation marks),
    and then click OK.

    - On the Windows menu, click "HKEY_LOCAL_MACHINE on Local Machine".'
  merge: -1
