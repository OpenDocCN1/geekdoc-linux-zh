    # Declaring Variables in the Shell


    There are really two types of variables on your Linux system. Both are similar,
    an environment variable behaves much like a shell variable, and they are both
    strings, or character based. You can see your environment by issuing the "env"
    command. It is helpful to pipe this to the "more" or "less" commands.


    An environment variable is visible to all shells on the system, while a shell
    variable is initially available to the current shell. You can make subsequent
    shells aware of that variable by issuing the "export" command.


    # Defining Shell Variables


    For the sake of argument, let''s say you wanted to be able to insert the variable
    "cheese" whenever you wanted in a script you are doing for a local shop, the Cordon
    Bleu. You would issue the command:'
