    # Windows 2000 Server Types


    Contrary to the Windows NT 4.0 server types, a Windows 2000 server is always installed
    as a stand-alone server. As a stand-alone, which denotes that not being a member
    of a domain, it can stay as, join a domain, or become a DC.


    Here are the different types of servers in Windows 2000:


    +   * a standalone server is a server that runs Windows 2000 Server, and is a
    member of a workgroup. It is not able to remain a stand-alone if it joins a domain.
    The stand-alone server type is very useful for roles such as doesn''t require
    domain, web server, database, or any other role that doesn''t require main membership.

    * a member server is a server that is running Windows 2000 Server and is a member
    of a domain, but hasn''t been promoted to a DC. A member server is fully part
    of the domain, for purposes of assigning permissions and permitting users access,
    but it does not receive a copy of the directory database. Member normally perform
    as application servers, such as Exchange, SQL Server, Intranet/IIS, file and print
    servers, and anything else that will benefit from domain membership.

    * a domain controller is a server that is running Windows 2000 Server, has been
    made a member of the domain, and has been promoted to take part in the running,
    replication and authentication roles that the DCs handle. You can demote this
    server to a member server without any loss of data, replace it, perform maintenance
    on it, and so forth.


    # Replication of Domain Objects


    A key feature of Active Directory is the ability to make changes to accounts or
    other information in a DC and it will automatically replicate those changes to
    the other DCs in that domain. Because all DCs are each other''s peers, any controller
    can be taken down, or suffer a catastrophic failure, and if any information is
    lost, it will be a small amount.


    # Surfing at FSMO Beach


    Although Windows 2000 domain controllers can all share the load of making and
    replicating changes to the domain and directory info bases, there is still a need
    for special roles amongst the servers.'
  merge: -1
  pgno: 323
- img_proc: true
  md: '# Understanding the Active Directory Service 311


    These Flexible Single-Master Operations (FSMOs) server roles are necessary, since
    there are still operations that must be made at one location and propagated from
    there to all the other servers. Let''s say you need to alter the schema for an
    entire domain for administrative reasons, and you don''t want any of the other
    servers accepting changes to that domain while it''s being changed—that would
    be the role of the schema master. Many changes at a domain or enterprise scope
    require an FSMO, with some sort of lockout that will not allow changes to function
    during the lockout.


    Again, since certain operations require a single master to perform, there can
    only be one of each FSMO in a domain at a given time, not counting Global Catalog
    servers. The first server that is installed is by default a "kitchen-sink" server,
    and contains all the necessary FSMO roles, all on one server. This can use a good
    bit of memory, and it''s a decent idea to get another couple of servers installed
    and promoted soon, to take the load off the single server.


    # Flexible Single-Master Operation Roles


    When a server that is fulfilling an FSMO role fails, it will (eventually) automatically
    replaced in that FSMO role with another DC. A very complex algorithm known to
    certain druidic types in Redmond determine these roles, or you can do it manually
    with the NTDSUTIL program on the command line. Microsoft has a few must-read Knowledge
    Base articles about this process, the most important of which are:


    +   - Flexible Single Master Operation Transfer and Seizure Process [Q223787]

    - Windows 2000 Active Directory FSMO Roles [Q197132]

    - FSMO Placement and Optimization on Windows 2000 Domains [Q223346]


    The FSMO roles are as follows:

    PDC emulator. Domain-level in its scope, the role is the most like the previous
    domain master. The DC holding this role has responsibility for all legacy BDCs
    (NT 4.0/3.5x BDCs) and legacy (non-Windows 2000 clients. This role is active even
    when the domain has been switched to native mode. Active Directory attempts to
    always register these with the PDC emulator. If a user types in a password that
    is deemed to be incorrect, the DC that produced the error will first attempt to
    confirm the password (to see if it''s been changed elsewhere) with the PDC emulator.


    Schema master. Enterprise-level in its scope (not just a single domain), this
    is the DC that is allowed to lock and make changes to the schema. The schema master
    is normally located on the first DC in the domain.


    ![](img/7c4d65772d38b487e72eb8750e4f3691_324_0.png)'
  merge: -1
  pgno: 324
- img_proc: true
  md: 'Domain-naming master. Enterprise-level again, the DN master is the DC that
    controls the adding and removing of domains, and external references to directory
    services for the entire enterprise.


    Infrastructure master. Domain level, this role is for the DC that holds the references
    to objects from other domains. This ensures consistency of objects for operations
    that cross between domains.


    RID master. Domain level, this role lives on the DC that manages the pool of Resource
    Identifiers (RIDs). RIDs are needed to create a new SID for a user, group, or
    computer. RIDs are doled in 512 increments, which means that the DC that is creating
    the object can make 512 objects before it needs to refer back to the RID master.
    Another use of the RID master is to move an object from one domain to another,
    as the RID and SID must be changed when moving from one domain to the other.


    # Global Catalogs–Speeding Up Logons and Searching


    When creating a directory that can potentially hold hundreds of thousands and
    millions of objects, it makes good sense to include a method for finding objects
    in a timely manner. Global Catalogs are interesting beasts; they really fulfill
    only a couple of functions, but those are massively important to the directory
    and its denizens.


    The first very important role of a Global Catalog (GC) server is to provide a
    search function for all objects among a number of different domains, trees, and
    partitions. Instead of burdening the GC server with a complete replica of all
    objects, the Active Directory engineers decided to include the attributes most
    likely to help find an object, or to allow a user to be authenticated.


    For example, if you need to find a printer, but didn’t know the full Distinguished
    Name (DN) of that printer (and small wonder!), you could simply use the Search
    function of Active Directory to find that printer by any piece of information
    you might have about it.


    The Search function allows you to select what you want to search for, and presents
    some attributes that the local GC server will have for that object, that will
    help you locate the object. You can see an example of searching for people in
    Figure 12.5. Notice the attributes that are shown; these are representative of
    the fields that will be available on the Global Catalog server for searching.


    Some of the searches allow for finer control of what’s being looked for. For example,
    you can search for the printers based on their model, name, features such as capability
    to do double-sided printing, envelop trays, and so forth (see Figure 12.6).'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# Understanding the Active Directory Service 313


    ![](img/7c4d65772d38b487e72eb8750e4f3691_326_0.png)


    Figure 12.5 Finding people with AD Search.


    The GC helps your users and their applications search and find AD objects, even
    if the user is only aware of an attribute or two of the desired object. Let’s
    say a user only knows a person’s first name; he or she can easily search for all
    first names that match the known one, and pick the correct user. A user can also
    search for all printers that will print double-sided and have an envelope feeder!


    ![](img/7c4d65772d38b487e72eb8750e4f3691_326_1.png)


    Figure 12.6 Finding printers with AD Search.'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'The key roles of the GC are to facilitate searching and finding objects, and
    even more importantly, to quickly authenticate users to the Active Directory domain,
    without having to have all details of the user.


    The GC server holds a replica of every object in Active Directory, it must necessarily
    only a few attributes for those objects, for performance''s sake. While the default
    subset of attributes is defined by Microsoft at the factory, administrators can
    modify the set of attributes that GCs hold, after suitable research and reading
    of the Software Developers Directory and ADSI, the Active Directory Services Interface.


    # Sites and Subnets in Active Directory


    Replication of a directory service is necessary to ensure the integrity of the
    database upon which most everything is based. Given that we cannot avoid replication
    of data, we need to have some method and sanity to channeling its flow along our
    network paths.


    Replication is different from synchronization. When you replicate data in Active
    Directory, it''s between peer servers, such as domain controllers. When you synchronize
    data in Active Directory, it''s between the Active Directory domain and another
    directory service.


    Sites are sets of well-connected subnets, or a physical location that is overlaid
    with a boundary within which high-speed replication and faster logons are accomplished.
    Simply said, a site is a physical area of networked computers that is usually
    anywhere from one to several subnets, all networked together with high-speed connections.
    By this I mean that everything within a building that is connected by hubs and
    routers is a perfect setting for a site, but anywhere that is separated from initial
    area by such connections as cable, DSL, or TI would be a candidate for another
    physical site (see Figure 12.7).


    # How Do Workstations Discover Their Site?


    Workstations will find their logon server by contacting the first Active Directory
    DC available, presenting their subnet ID, and receiving back server address or
    alternate server addresses to contact for their authentication.


    # Placement of DC and GC Servers


    When you are building a site from one or more well-connected subnets, it is very
    important to include a Global Catalog server in that site, for quick searching
    of the domain and enterprise, but most importantly to provide a local copy for
    authentication (login) purposes. A client''s ability to quickly log in and get'
  merge: -1
  pgno: 327
- img_proc: true
  md: '# Understanding the Active Directory Service 315


    Site B


    Site A


    ![](img/7c4d65772d38b487e72eb8750e4f3691_328_0.png)


    Figure 12.7 Active Directory site example.


    access to his or her assigned resources is linked closely to how quickly the login
    information can be received, checked, and access granted by a GC server. The following
    are guidelines for Global Catalog server placement:


    +   * Major hubs and routes

    * Nearest to large user concentrations

    * Remote sites or locations

    * Every subnet (ideally!) to reduce intersite queries


    It''s a good idea to keep GCs to a minimum; they really increase replication traffic!
    Having too many GCs can cause network problems, slow logins, and replication.


    The following are guidelines for domain controller placement:


    +   * Place a DC in every site in your domain.

    * Place at least two in a given site (in case one fails).

    * Expect more queries than updates (fast hard drives and NICs).

    * Make sure at least one DC is running per site at all times.

    * Consider using a service network (separate hubs/links) for DCs to replicate
    with.


    In summary, put at least one DC in a site, preferably two, and only one GC in
    each site.


    # Local (Intrasite) Replication


    Within a given site, the DCs act as if they own the bandwidth. I am sure that
    future patches and fixes will help this situation, but you need to be aware of'
  merge: -1
  pgno: 328
- img_proc: true
  md: 'the amount of traffic generated by the changes you make and the number of times
    the servers trade information about what needs to be replicated.


    Active Directory has a process that runs the Knowledge Consistency Checker (KCC)
    which automatically creates a replication topology that''s similar to a ring between
    all the domain controllers in that site. Figure 12.8 shows you a simplified view
    of this ring.


    Within the replication ring, the KCC lays out the flow of directory services data
    updates, making sure that all DCs are included and will be brought up to date.
    Redundancy is a hallmark of this ring, with the KCC creating at least two paths
    to each DC, in case one is broken by a down server or other problem.


    Finally, in order not to create a replication problem for very large sites, the
    KCC uses an algorithm when creating the ring that guarantees any update won''t
    have to make more than three connections or hops from its origin to the destination.
    Wherever seven or more DCs are in a ring, the KCC will initiate the creation of
    extra connections to ensure that the three-hop rule is followed.


    The KCC is quite active, checking the status and recalculating any changes every
    15 minutes. Of course, like anything else in AD, this is configurable, but not
    simple to accomplish, by editing the Registry.


    # Remote (Intersite) Replication


    Once you have set up a site, you will likely want to connect it to others in the
    domain. Unlike most aspects of Active Directory, you will normally connect your
    sites to each other manually. The only way you currently can have AD


    ![](img/7c4d65772d38b487e72eb8750e4f3691_329_0.png)


    Figure 12.8 Intrasite replication.'
