    printing will work if you have to. You can''t use the printer and the scanner
    at

    same time; or one or the other will work.


    # Printer Drivers


    As a systems administrator, you will have to deal with any number of differ-

    ent printer types and drivers for those printers. As a general rule, if the printer'
  merge: -1
  pgno: 281
- img_proc: true
  md: 'supports Postscript, you can choose to install a Postscript printer driver
    and get very good results. If the printer doesn''t support Postscript, you can
    either try the manufacturer for an appropriate Linux printer driver (good luck
    with this!), or spend some quality time with Google and some of the printer-related
    sites.


    Postscript is the most popular print format in Linux, and many of the applications
    on Linux will support and produce Postscript output. As of late, applications
    and suites have been supporting more than print formats, including graphical modes
    like those in StarOffice, GhostScript, and WordPerfect''s Office for Linux.


    Unlike a Windows computer, the Linux printing system is dedicated to converting
    print data to the correct device, not converting data from the original format
    to a meta-file that can be printed on a printer. The programs in Linux are generally
    responsible for producing printable output by themselves, independent of the operating
    system.


    # Print Filters


    Print filters are nondcript, generic programs whose job is to convert a particular
    file format to another, for the purpose of printing something that isn''t generally
    supported by a print device. There are a number of ways to invoke or use a filter,
    such as the command line, in the /etc/printcap file as an option, and finally
    by invoking the filter through an application or program that calls the filter.


    A typical filter reads data from the standard input, and then operates on that
    data according to its coded instructions for the data format to be produced. It
    then sends the resulting data to the standard output. This is necessary for many
    printers, as they might not support ASCII or graphical data directly, and need
    that data be converted to a particular format for that printer or class of printers.


    In short, a Linux printer filter''s main job is to convert formatted data into
    printer-specific codes, applying formatting commands to otherwise unadorned text
    print jobs, and running out of paper now and then.


    # Printer Devices


    Printer devices are usually character devices, which means that they accept data
    in characters, not blocks of data. Typically, you will find your printer''s device
    files in the /dev directory. For example, your first parallel printer will usually
    be represented by the device file /dev/lp0, whereas the first serial printer would
    be shown as /dev/tty0. Print devices normally start at 0 and end at 3.'
