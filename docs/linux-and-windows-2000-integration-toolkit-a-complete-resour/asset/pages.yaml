    is a lot of truth in this idea, it''s a basic fact of all workstation life: you
    have

    to get e-mail, type and print, and almost everything is an extension of those

    c own.


    Linux and Windows 2000 use different terms to describe the various parts of

    the printing process, from software to hardware. In Linux, the actual printer—nthe
    object that gets warm, makes noises, and spits out a printed sheet of

    paper—is called a printer device.


    Let''s start with turning your on ... Ok, not fair, but I have seen itnhappen
    all too often. Plug it in, and attach it to the computer/server''s parallel

    port (assuming that you are using a parallel printer). If you are using a serial

    printer, there''s a lovely HOWTO for that—have a lot of fun . . .


    In this day of USB peripherals and USB hubs, you might not have to use a

