- img_proc: true
  md: 'it can wreak havoc in many cases, causing hosts to be invisible, unable to
    register with Dynamic DNS services, and plenty of other dandy little challenges
    to figure out. Stay away from the underscore, it''s a troublemaker.


    # What''s a Few RFCs between Friends?


    Microsoft’s tendency to get a little too friendly with protocols and standards
    rears its ugly head with the addition of several specifications about using UTFcharacter
    encoding for DNS names. UTF-8 is a superset of the ASCII character set, similar
    in function to Unicode, and encompasses many characters from the world’s languages
    and alphabets. On the surface, this would seem to be a logical extension of the
    standards, allowing many different societies to name their hosts as they please,
    and not have to use the English alphabet and character sets. Unfortunately, it’s
    also a way to unnecessarily complicate the working of what are now fairly simplistic
    servers and services. (Did I really just DNS simplistic?)


    Microsoft wants to make sure that large implementations of NetBIOS won''t have
    to go through the pain of mass-renaming hosts to be compliant with DNS name restrictions.
    There is already an extension to the DNS naming set out in RFC 2181 (Clarifications
    to the DNS Specification), which allows for a much larger character set. RFC 2044
    is the real interesting proposals for would expand DNS names to encompassing UTF-encoded
    names, significantly increase DNS Service’s use of processing power and bandwidth,
    and complicate interoperability with the different implementations from competing
    vendors. Surprise—the Windows 2000 DNS Service includes support for UTF-character
    encoding.


    Ok, some people out think this will be a good thing, and your author (and many
    others) are in the opinion that it will complicate and possibly break portions
    of our hard-won and smoothly functioning (mostly) name resolution systems. Let
    the games begin!


    As a final note, some of the latest RFCs haven''t been ratified as standards,
    so jumping on the bandwagon with Microsoft’s DNS Server Unicode option might not
    be a good idea, or it might be a great one. It’s something to consider, but I
    recommend strictly adhering to the RFCs that make up DNS, and only using the letters
    of the U.S. alphabet, the minus or hyphen character, and through 9.


