    Chastened and determined to get your plan implemented somehow, you pick up a book
    and learn about subnetting. You find that it''s not difficult to break up your
    Class C address block into smaller separate address blocks that can all communicate
    with the use of a thing router. You know you have three locations already and
    that you need to connect them—this will affect the matter.


    You grab a piece of paper and begin to plan out your subnets. If you have 254
    possible hosts, and to break things up into six pieces, then you will have to
    take some rules into account before beginning the actual process.


    +   - Each subnet requires a unique network ID. This means that any wide area
