    +   - -t TYPE domain Shows records of a certain type (for example, NS, A, PTR).


    # Resolving Domain Names

    on Wide Area Networks


    On a wide area network (the public Internet being the best known), DNS queries
    outside its local zone. Interaction with a DNS name server across a wide area
    link is necessary. A special DNS server called a forwarder is required. Only forwarders
    can carry wide area communication across the Internet.


    Nonforward DNS servers are configured with the IP address of a forwarder that
    serves as a link to the Internet zone of authority. A DNS server can use as a
    forwarder in nonexclusive or exclusive mode.


    # Nonexclusive Mode


    In nonexclusive mode, when a name server receives a DNS query that it cannot resolve
    through its own zone, it passes the query to a designated forwarder.'
