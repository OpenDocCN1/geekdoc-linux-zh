- img_proc: true
  md: '# 344 Chapter 13


    | Table 13.3 Types of Status Messages |

    | STATUS VALUE | EXPLANATION | DEFAULT ACTION (IF ANY) |

    |---|---|--|

    | SUCCESS | The entry was found, no errors were present. | Return (no further
    action is taken). |

    | NOTFOUND | No errors, but the requested item wasn''t found in the source. |
    Continue (this causes it to move on to the next option). |

    | UNAVAIL | The service specified was unavailable for reason. | Continue (this
    causes it to move on to the next option). |

    | TRYAG | The service isn''t available presently, either a file is locked or a
    server is down | Continue (this causes it to move on to the next option).


    # An Example of Using an Action Statement


    Some examples are in order to demonstrate this. Let''s say we have an entry for
    the hosts file, shown as follows:


    ```

    hosts: dns [NOTFOUND=return] files

    ```


    The result of this configuration would be to resolve the hostname query via the
    configured DNS server(s), and all returned status messages, except NOTFOUND, would
    cause the host to continue with a local file lookup of that host. If the UNAVA
    status was returned, it would simply stop looking and the resolver software would
    signal an error.

    Make the changes you need to match your network and host configurations to save
    unnecessary network traffic and enhance your network''s security.


    # Setting the Client Daemon to Start at Boot


    We have got everything set up properly (hopefully, you are paying close attention?)
    and we should set the client daemon to start at the system boot.

    It''s not hard to do, we''ll create a symlink named /etc/rc.d/rc.3/S60yp- to point
    to the daemon /etc/rc.d/init.d/ypbind.


    ```

    [root@hostname /root]# cd /etc/rc.d/rc.3

    [root@hostname rc3.d]# ln -s ../init.d/ypbind S60ypbind

    ```


    You might have to restart the machine, although Red Hat derivatives don''t usually
    need a reboot.'
  merge: -1
