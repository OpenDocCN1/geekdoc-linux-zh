    $ string=cheese


    There are several restrictions when defining a shell variable: it cannot begin
    with a numeral (0–9), and contain anything but characters (A–Z, and 0–9). Additionally,
    you cannot have any spaces around the = sign; it won’t work properly.


    # Viewing (Verifying) Shell Variables


    The easiest way to view the variable you just set is with the "echo" command.
    Typing "$string" will display "cheese". You can get a little more complicated
    by using the variable in a command such as:


    ```

    [user@dellbert/store]# ls -la "$String"

