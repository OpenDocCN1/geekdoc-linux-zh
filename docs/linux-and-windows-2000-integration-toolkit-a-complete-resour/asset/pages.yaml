  md: '# # Steps for Getting the Project Started Successfully

    (A Quick Overview of a Long Process)


    Step 1. Determine exactly what has to be done. This is much easier in hindsight,
    or slightly after you discover a necessary component is not available for many
    weeks. Decide what level of integration you desire, and then plan out each step
    of the way there. See the next section about integration types for inspiration.


    Step 2. Assign components to the right personnel/teams. Getting the right people
    is crucial; there is no room for ill thought out placeholders here. The future
    of your computing environment may depend on the work done by these individuals.
    Volunteers and corporate thrill-seekers are best, but as all concentrations of
    Pioneers, a few Settlers have to exist. (Someone has to care about the day-to-day
    tasks.)


    Step 3. Draw a outline of events to take place. It doesn''t have to be done in
    project management software; an Excel or Star Office spreadsheet and some lines
    and shading will do the job fine for most projects. In my experience, the projects
    that really need project management software will need a person just for that
    purpose. That''s a big project, and that person''s resources are lost except for
    keeping tabs on a project that will constantly move its objective timelines and
    completion dates. It takes a special kind of person to endlessly keep track of
    something that never moving and to continue about it.


    Step 4. Start accomplishing objectives. This is where it all gets done. Painting
    your project''s goals and objectives in broad strokes allows for ajust-timelines
    when things go wrong, and they will—at the worst possible time and usually spectacularly.
    Peter Drucker in the Mythical Man Month says to plan to throw away one, because
    you will anyway. I firmly believe in trial and error, specifically using trials
    to show where errors are likely to occur and then planning for them. Trials can
    be strategically used to show off the project, particularly if they go well…


    # # Stepping through an Integration Project

    (The Aforementioned Long Process!)


    # # Milestone 1: Mission and Vision


    The major objective for the Mission and Vision milestone is to get the whole team
    together and a solid plan in place that can be explained to management and receive
    approval.'
