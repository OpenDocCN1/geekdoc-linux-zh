    including all subdirectories and their contents.


    Example of changing the ownership of a file: Chown rbrunson/home/rbrunson/filename.txt.


    Example of changing the user ownership and group ownership of a file: Chown rbrunson.users/home/rbrunson/filename.txt.


    Example of changing an entire directory tree to another owner: Chown -R rbrunson
    /opt/staroffice.


    # Using Groups


    If you mistakenly try to change to another group, which you are not a member of,
    the system will politely, (but firmly) let you know by telling you "sorry."


    This Windows 2000/Linux group thing will take some experimentation to become proficient
