    Users And Computers. Right-click on the OU where you want to create the group.


    +   Choose New, and select Group. This opens the New Object—Group dialog box.


    +   Type a name for the group. The same rules as user account names apply. Groups
    must be unique in the domain, and up to 20 characters are used for the NT 4.0
