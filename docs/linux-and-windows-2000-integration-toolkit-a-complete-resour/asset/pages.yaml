    # Router Discovery


    You typically configure TCP/IP''s properties so that it receives its addressing
    information from a DHCP server. In addition to an address and subnet mask, the
    host also receives information about other servers (DNS, WINS, and so on) and
    default gateway (router) configuration. If the client does not receive a de-fault
    gateway IP address from the DHCP server, Windows 2000 clients obtain ICMP router
    discovery advertisements (RFC 1256) to obtain the router address. Configure this
    capability by implementing Scope Option 031, Per-form Router Discovery. (The router
    interface must also be configured to issue ICMP advertisements.)


