  md: '# Understanding the Active Directory Service 297


    Fault tolerance. Since Active Directory is based structurally on DNS, it inherits
    the hierarchical layout and nature of one of the most widely used and tested technologies
    on the planet. In contrast with NT 4.0''s paltry actual limit of 26,000 (supposedly
    40,000) objects, the Active Directory data structure is capable of handling millions
    of objects, as has already been proved in companies such as IBM and Compaq, through
    extensive testing.


    # Upgrade, or Rent a Forklift?


    The question of upgrading versus replacement is entirely appropriate with regard
    to Active Directory. With the advent of NT 4.0 and its flat, unimaginative, and
    limited domain database structure, we entered the era of "not-quite-good-enough."
    NT 4.0''s DS gave us hope for the future of directory services, but it didn''t
    do a good job when beyond its actual limits of functionality (as opposed to the
    marketing limits!)


    Some of the problems from NT 4.0''s DS being easy to implement in a small organization,
    but it''s almost embarrassingly limited in nature when used in large companies.
    While the whole, Active Directory is supposed to be ridiculously expandable and
    extendable, supporting all sorts of additional entries in the data schema for
    applications to take advantage of.


    Additionally, the whole issue of trust relationships is different and more intelligently
    handled in Active Directory. Where 4.0 trusts were one way and didn''t extend
    the target domain to its trusted domains, Active Directory trusts are two way
    and transitive by default. That means that if Domain A trusts B and B trusts C,
    then all of them have two-way paths to each other, and users from all can be granted
    access to any resource in any of the three domains. In NT 4.0, each and every
    domain needed an explicit trust to establish between it and any other domains
    that needed access, or would grant it access to their resources. The management
    of this web of connections was quickly too much even for the experts.


    If you want the smoothest and most error-free installation of Active Directory,
    put everything over. Don''t laugh, it for it has happened just that way for some
    very complex domains. There comes a time when you recognize that your directories''
    structure has become evil and it''s time to put it to sleep. Having said that,
    the vast majority of organizations will do an in-place upgrade, and not have any
    significant errors while doing so.


