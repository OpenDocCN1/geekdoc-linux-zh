  md: '# Step 10. Rolling Out Test Pilots


    The process of conducting a pilot test is to selectively have a group of end users
    put the systems through their paces before they are rolled out to the entire user
    community. It''s amazing what can be avoided by even a small, relatively simple
    pilot test. How far you go and for how long will depend on the size and complexity
    of your integration project. If you have a large project, it will pay off hands
    to carefully plan out a detailed test. Keep detailed records of problems, possible
    fixes, and changes to be made. Regardless of the size of the integration project,
    you should test pilot the most intrusive changes.


    There are several possibilities for conducting your pilot testing. One school
    of thought is to use more experienced users for your testing because they will
    give you better feedback and less of a headache during the test. The more savvy
    users will probably require less support or you can conduct the test explicitly
    without support, so it''s not such a drain on your resources. The payoff from
    this is that you can get technically useful feedback, fix the problems, and retest,
    all without having to suffer through typical end user “what a mouse for?” types
    of support questions. Of course, these more sophisticated users have much bigger
    egos and delight in pestering your support staff (who are already overtaken, right?)
    with erroneous or intentionally-caused errors or simply refuse to keep records
    or otherwise help you conduct the pilot properly.


    Another school of thought suggests that you take an unsuspecting set of lab rats,
    erats, or users, and put them through the whole integration cycle, at game speed.
    The idea behind this type of test pilot is to see what will happen to the user
    community at large when the integration team makes its changes. You huddle after
    the test pilot and try to plan for the problems that cropped up in this small
    group of typical users and try it again on another unsuspecting group of victims.
    This method is the Heisenberg Maneuver, after the Heisenberg Principle, which
    states whenever you measure something, you change it. The goal of this method
    is to get as pure a set of data as possible by using unsavy and typical users
    instead of experienced users who know they are getting through a test pilot. It
    is also sort of cruel to perform this type of pilot; have the bad pun on the Heimlich
    Maneuver. You might get good data, or you could stress out an otherwise productive
    and unspecting set of people who hate the IS team for eternity. If you pulled
    the wings off flies and scorched ants with a magnifying glass as a child, this
    is your test methodology!


    I recommend a phased approach, where you initially pilot with experienced users
    who will give high-quality input, then fix the problems that crop up. After you
    fix the more grievous problems, and adjust the process, you can conduct the actual
    normal user pilot program. Make sure to inform them that they are pioneers; give
    them coffee mugs, have meetings with lots of refreshments,'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'and do a lot of ego stroking. Remember, these are the same users who regularly
    call you about CD-ROM trays that were broken from putting coffee cups on them
    and forward around that stupid IBM memo about replacing mouse balls!


    After the dust settles, gather the input, fix the problems, and consider a third
    and larger pilot, this time using an entire department. I suggest not conducting
    pilots in the shipping or accounting departments. People get a little touch when
    the product they ordered doesn''t arrive on time or employees don''t get a timely
    paycheck.


    # Milestone 4: Redesigning/Rescheduling


    After all the pilots and tests are rolled out, and the smoke is settled, it’s
    time to incorporate the lessons learned. The trouble with some integration projects
