    # Address Classes and Default Subnet Masks


    According to the standards, you can categorize IP addresses into five classes,
    A to E. D and E are reserved for special or future uses, and the most commonly
    used are Classes A, B, and C.


    The entirety of all possible addresses is equal to the number of bits available.
    There are 32 bits of possible addressing total, so the calculation 232 will tell
    us that we have a total of 4,294,967,296 addresses in the entire world of TCP/IP
    version 4. While 4.2 billion addresses may seem a lot, we waste addresses when
    we subnet they are going out of style. Speaking of that, there is a movement to
    IP version 6, which is outside the scope of this chapter.


    TCP/IP addresses are organized into classes to make them easier to assign. The
    first octet used to determine the class of the address. When we subnet later,
    an inexperienced user will see an address 135.100.125 with a subnet mask of 255.255.255.0
    and assume it’s a Class C address. I use the technique of asking students what
    city they were born in and where they live now to help them understand that it
    doesn''t matter where you live now, you can''t change the city you were born in.
    When you view an address that uses a subnet mask that is usually associated with
    another class of address, it’s still the original class, just a smaller block
    of addresses caused by altering the subnet mask.


    Here are how the classes break down and are determined by the bits:


    +   - Class A uses the first octet to define the network ID, and the last three
    octets to define the host ID. This allows for 126 network IDs and 16,777,214 host
    IDs. Class A addresses always begin with 1 to 126 in the first octet.


    +   - Class B uses the first two octets to define the network ID, and the last
    two octets to define the host ID. This allows for 16,384 networks with 65,534
    hosts per network. Class B addresses always begin with 128 to 191 in the first
    octet.


    +   - Class C uses the first three octets to determine the network ID, with the
    last octet being used to address hosts. This allows for 2,097,152'
