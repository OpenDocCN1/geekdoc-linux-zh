  md: '![](img/7c4d65772d38b487e72eb8750e4f3691_160_0.png)


    # # Assigning and Managing IP Address Information


    # ## Name Resolution in an Integrated Environment


    Let''s face it, resolving names to IP addresses is one of the most important services
    running on a network. IP addresses are fine for referring to systems if you only
    have a small network (or a bunch of alpha geek engineers ...), but just having
    the accounting department try to remember all those IP and MAC addresses!


    Windows Name Resolution is slightly different since the release of Windows 2000.
    Older Windows machines had to layer NetBIOS on the Transport protocol—in this
    case, TCP/IP—even to get the simplest mapping of a drive, the use of a printer.
    In fact, almost anything that fell in the realm of networking between machines
    required NetBB (NetBIOS over TCP/IP).


    All this commotion regarding NetBIOS has been a source of tolerance and amusement
    from the Linux/Unix crowd; they only have to worry about NetBIOS when they have
    Windows machines on their networks. In other words, introduce one Windows PC and
    you have another set of traffic on the network, and it''s a chatty one!'
  merge: -1
  pgno: 160
- img_proc: true
  md: 'Finally, except for the older legacy OS machines (anything that is Win 3.x/Win
    9x), you can completely do away with the NetBIOS naming altogether and take full
    advantage of name resolution via DNS. Your Windows clients are typically assigned
    their IP addresses via DHCP, so it''s easy to slip all the needed IP addresses
    to your DNS servers in their configurations.


    In this chapter, we will investigate how DHCP can help assign all the IP address
    information your clients and servers will need, with the exception of a few choice
    machines. Windows 2000''s DHCP Server now includes the capability to help register
    the clients'' names and related services with a DNS server, or can be configured
    to allow the client to do most or all of the registration.


    # Legacy DHCP in a Mixed Environment


    The Old Unix sysadmin argument against DHCP is really outdated and spurious. The
    conversation usually went like this:


    +   - Manager Meg: Can we look into DHCP for assigning our IP addresses?

    - Techie Ted: No, why would we ever use dynamic addresses? It would cause chaos;
    we use DNS.

    - Manager Meg: Um, so we let clients get their own IP address? It takes too long
    to get someone out to the users when they need a new IP address.

    - Techie Ted: If we use DHCP, we''ll never be able to know what hostname is what
    IP address, it''s madness! Who said we are too slow? Was it Accounting?

    - Manager Meg: But, I read in MCP Magazine that we can have DHCP assign WINS and
    DNS addresses and it works really well!

    - Techie Ted: Why would we pollute our network? It works now, why change it?

    - Manager Meg: Um, we were going to talk about reductions in your team at the
    managers'' meeting today. All departments have to lose one headcount.

    - Techie Ted: Ok, I''ll put our on it. (Stomps to reorganize his .ogg and .mp3
    files and plot revenge)


    Ok, so I am making fun, but tell me that you haven''t had a conversation like
    that, or been on the sidelines when someone has proposed it? Better than a cable
    tv, sometimes . . .'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Windows 2000 DHCP and DNS Work with Linux


    Unless you were using the WINS record to have Windows NT''s DNS Server look up
    resolutions to client requests, you wouldn''t want to run WINS and DNS in a mixed
    environment. Linux and Unix DNS servers don''t get along with NT DNS servers and
    are blissfully unaware of WINS servers, except for SAMBA. Now you can actually
    justify having Windows 2000 DNS Servers in your mixed environment, as long as
    you are careful with your settings.


    # The Sun Sets on WINS


    For the most part, you can safely move NetBIOS naming (WINS) to the status of
    a legacy technology, even if you used a mixed environment. Every current MS OS
    has the capability to use DNS as a name resolver, although not every host will
    be able to register itself with the DNS servers. That''s where Windows 2000 DHCP
    Server steps in.


    The WINS Server, which registers, resolves, and releases NetBIOS names with IP
    addresses, is still available and even enhanced in Windows 2000, but you will
    use this mostly for legacy OS integration.


    # Understanding How Hosts Access the Network


    First, what is a host? A host is anything that can load an IP stack and be pinged
    from another machine on a network, whether it''s satellite, local area, or microwave.


    # Mapping a MAC Address to an IP Address


    When a machine has a network interface installed, such as an Ethernet card, a
    48-bit MAC address is assigned to that card. MAC stands for Media Access Control,
    a set of numbers that are in hexadecimal and assigned in large blocks to manufacturers
    of network devices. (Some of the more gullible users think the MAC Address is
    1 Apple Way, Cupertino, CA.)


    Mapping a MAC address to an IP address can be done a few ways. You can assign
    an IP address manually by editing the configuration files, or by using a configuration
    tool such as Linuxconf or YaST. You can also use DHCP to dynamically assign IP
    addresses to a machine, thereby associating the MAC and IP addresses.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# Resolving Names to IP Addresses


    There are at least four methods of accomplishing name resolution on Linux and
    Windows 2000. Both systems have similar HOSTS files, and support DNS. Windows
    2000 adds the legacy LMHOSTS files and the declining in popularity WINS server.


    If you only have a few systems, and don''t want the overhead or configuration
    headaches of running a DNS or WINS server, then the HOSTS file will do the trick.
    Many options can complicate setting up one of these servers, but you really can''t
    have a large organization running on HOSTS files without wearing out a few sysadmins
    along the way!


    # Resolving Remote Hostnames to IP Addresses


    When you are a sysadmin of one of the previously mentioned large organizations,
    the capability to reliably resolve names to addresses is key to having clients
    access servers across your network. Failed name servers can bring a busy network
    to a screeching halt in about 10 minutes. Many times the author has been onsite
    at a company working on their networks and found either a single DNS server with
    no secondaries, or the primary and secondary DNS servers on the same subnet! An
    accident waiting to happen, just ask Microsoft ... It only takes a "Size 12 Open"
    or a "Backhoe Open" to cut the rest of the network off from the Name Servers,
    with only 10 minutes of cache on the Windows-2000 clients and no cache on the
    Linux/Unix clients.


    # Configuring Clients'' IP Addresses in Windows 2000


    After deciding to use TCP/IP, and whether you are going to use DHCP, you need
    to assign addresses to the machines, some of which you will make DHCP clients,
    and others you will want to manually assign addressing.


    # Option 1: Configure Clients Manually


    Manually configuring TCP/IP clients is a valid and functional way to get them
    on the network. However, with any network over about 150 clients, it becomes an
    exercise in futility to keep track of who has what address, and if any are outdated,
    missing, or incorrectly assigned. This situation has given rise to the "If it
    doesn''t answer a PING, use it" school of client configuration—not a forward-looking
    method for larger companies. Anyone who has had to renumber and'
  merge: -1
  pgno: 163
- img_proc: true
  md: '# Assigning and Managing IP Address Information 151


    reconfigure 200+ client systems in a single night or weekend will attest to the
    fact that typos are not only possible, but highly likely. As the song says, “There’s
    got to be a better way”—and there is.


    # Option 2: Configure Clients Dynamically


    In larger organizations, Dynamic Host Configuration Protocol (DHCP) is already
    a ready favorite and its use is growing rapidly. Administrators in Linux shops
    are discovering the joys of automatically assigning addresses to hundreds and
    thousands of clients.


    Just about every version of Microsoft operating systems will support DHCP, including
    (surprise!) the Microsoft DOS Networking Client. Setting up hosts to DHCP clients
    couldn''t be easier; just a click on the radio button in the IP dialog and (sometimes)
    a quick reboot and the client will get its IP address and all necessary information
    from the DHCP server.


    # Option 3: IP Address Auto-Configuration


    Windows 2000 has an interesting and initially confusing new feature called auto-configuration
    for its DHCP Clients. If you install and boot Windows 2000-based clients with
    network card and cable, TCP/IP set to use DHCP, but without networking hardware
    attached, it will auto-configure itself with a 169.254.0.0 class address. this
    would enable networking for them and not you about the details. However, if you
    have larger networks, with one to many subnets, the clients will be able to see
    their own subnets but can''t reach anyone on a remote subnet. This feature is
    great for home and small business networks, but most large organizations will
    know the DHCP server is down almost before the Automatic IP Addressing (APIPA)
    feature can kick in.


    Finally, Microsoft Windows 2000 DHCP clients support the local storage of DHCP
    information on the client''s local hard drive. The main benefit of this feature
    is the capability to attempt renewal of the same address it had leased. If the
    DHCP server is unavailable, it will use the local address until the lease expires
    and then go through finding the DHCP server or IP auto-configuration.


    # General DHCP 2000 Overview


    DHCP is derived from the venerable (old) BOOTP (Bootstrap Protocol). DHCP is actually
    a super or subset of BOOTP, as the original idea was to enable'
  merge: -1
  pgno: 164
- img_proc: true
  md: 'use of the protocol without having to load new versions of routing soft-ware,
    or do any hardware changes to start using it. DHCP can also assist small and large
    organizations to dynamically assign IP addresses to clients that support DHCP.
    It also allows the wily administrator to assign multiple options to all clients,
    specific groups scopes, or individual hosts.


    Using DHCP servers will effectively centralize all IP address configuration and
    administration. It allows the administrator to manage all addresses and options
    from a single seat (the administrator’s) and effect changes to all clients or
    just a few with simple and easy processes.


    Whenever a new host is installed and contacts the network and asks to be assigned
    an IP address, the DHCP server assigns it one from the pool of available IP addresses.
    If the client had been assigned an address previously, it will confirm the address
    lease and receive any new or updated options that have been configured on the
    DHCP server.


    # DHCP Terms


    Here are the terms used to describe and affect DHCP servers and how the addresses
    are organized:


    +   DHCP server. This must be a server-class machine, and it runs the Microsoft
    DHCP Server service. This is where all scopes and options are kept and manipulated.

    DHCP client. Any machine that can run a DHCP-compliant client service and contact
    a DHCP server for assignment of an address.


    +   Scopes. Scopes are groups of addresses, usually as much of a subnet full of
    addresses as possible. Only one scope is allowed per subnet, so plan wisely and
    have the largest contiguous pool per subnet.


    +   Options. These parameters are shipped to the client as part of the address
    assignment. Server options affect all hosts that are leasing addresses from this
    server, and scope options affect only a single pool of addresses


    +   Reservations. When one or two clients need options defined that are different
    from everyone else in their scope, you will assign an address reservation that
    matches the machine’s MAC address with the IP address you define. The client will
    get all other options that the server and scope get in addition to the specific
    options.


    Options take precedence over each other in order of how close to the client they
    are defined. A server option affects every host in the DHCP server’s scopes, but
    it is the farthest from them. The scope options are closer, and affect all hosts
    that lease from a particular pool. Client reservation options have the highest
    priority and are the closest to the actual client, having been signed to one specific
    host.'
  merge: -1
