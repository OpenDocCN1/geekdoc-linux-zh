    # Step 6. Developing Realistic Timelines


    Its very important to both determine the resources available to you and also try
    to do more than just gess about the time needed for the project''s completion.
    It''s not enough to have people who can install software, they must support it,
    fix problems that occur on the desktop as a result of the software install, and
    respond to many other items that can go wrong. I didn’t know there were so many
    underpowered and scrap-heap-ready machines until we tried installing the venerable
    Groupwise product on 6000 medical company desktops a few years ago. Another item
    to consider when putting together timelines is whether you have competent employees
    or will you want to do the “rent-a-brain” thing.


    Once you have answered these questions, you can then begin to develop a resource
    plan, put together your cost estimates, and establish some realistic timelines.


    Try having some test installs or planning a pilot project that will give you a
    better idea of the amount of time and trouble you will likely experience in your
    integration project. As the saying goes:“If you want to truly understand something,
    just try to replace it with something else.


    Plot out your results on a spreadsheet and then do some multiplication by the
    number of clients/servers needed to complete the project. Then go have a drink
    and look at the Truck Driving School ads; I hear they are paying pretty good days.
    Ok, kidding, but be prepared for a shock; integration will take some time as a
    rule. You should also realize that people will be getting much better and wlier
    as their project skills increase. Those that were nearly insurmountable earlier
    on the project will become commonplace-place and the thing which will seem to
    go a lot faster. It’s called “the groove” or “the zone,” and every project that
    succeeds will hit this about 25 percent to 30 percent of the way to completion
    and stay there for the most part.'
