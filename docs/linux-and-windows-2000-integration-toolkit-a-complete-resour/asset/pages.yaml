    # Managing Resource Access by Group


    # Granting Resource Access on a File Server


    If you want to give a set of users access to a share on a file server, here is
    the recommended process:


    +   1. Set up all the user accounts.

    2. Add a Local group account named appropriately.

    3. Place the users in the group.

    4. Assign the Local group access to the resource by navigating to that resource
    and adding the Local group, not the individual users, to the ACL of the resource.

    5. Have the users log out and back in; they will get a newly updated security
    access token (SAT) and be able to use the resources.


    This is all done on a single machine by adding a single group. This becomes more
    complex when using a domain, but not so bad that we can''t quickly overview and
    understand it.


    # Granting Resource Access on a Member Server


    When you need to allow domain users to access a file share or resource on a member
    server, you will need to do the following:


    +   1. Add the user accounts into the domain on a domain controller.

    2. Create a Global group in Active Directory and add the accounts as members.'
