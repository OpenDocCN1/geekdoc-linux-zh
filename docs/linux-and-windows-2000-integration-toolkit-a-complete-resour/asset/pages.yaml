    # An Example of SFN Problems


    A client teleoned with the following situation, Unix, wanting an expert opinion:
    They had a database system written on Unix, and then ported over NT. In Unix,
    the original file existed in a directory in uppercase format. When the file was
    “read in”, there was a temporary file written, of the same name, but in lowercase
    format.


    These were two absolutely different files in Unix. When this was ported over NT,
    there were many corruptions, crashes, and other problems. We discovered that NT
    would actually overwrite the original file with the temporary file. The original
    uppercase file was being overwritten by the working copy, the lowercase version
    of it. This wouldn''t change a bit in Windows 2000, or even XP, the file systems
    treat the 8.3 SFN problem the same way.


    The fix: Rewriting the program to prefix the temporary version of the file with
    a "_" (underscore) character fixed the problem.


    # POSIX and Windows 2000 Native Commands


    The POSIX subsystem will help you handle files that are hosted on NFS or network
    shared volumes. The potential conflicts between Windows and Linux clients are
    enough to make you standardize your hosted file systems on one platform for simplicity.


    If you regularly use the POSIX commands to manage files and directories based
    on Linux servers, or those accessed by Linux clients, you will have very few problems.
    There is one situation called the “file delete child” error that can affect you
    because you have the POSIX subsystem enabled.


    NT and Windows 2000 support a hidden permission (by default) called “File Delete
    Child” (FDC) on any NTFS volumes.


    Any user who is granted or possesses full control permissions to a volume or directory
    also possesses the FDC permission. The FDC permission permits a user to delete
    files at the root level of any directory where he or she has full control. The
    frightening part of this issue is that the user can delete files if he or she
    does not have any permissions on the specific file itself.


    As an administrator, you may well desire not to grant your users the FDC permission.
    The only way to fix this situation is to use the Windows 2000 File'
