    # Table 5.6 TCP/IP Utilities That Can Help Integration of the Two Systems


    +   - ARP In a Microsoft networking environment, ARP broadcast is the most basic
    level of communication on a network. ARP goes out with an IP address and matches
    it with the MAC address of the other machine, so communication can take place
    quickly. (ARP times after 10 minutes.)


    +   - FINGER Find out about users on any given server.


    +   - FTP Client Command-line interface that allows you to connect to another
    box''s running FTP server, establish a session, log in, and begin to transfer
    files.


    +   - IPCONFIG Very similar to the ifconfig command in Linux, for viewing the
    current IP address information.


    +   - LPQ Line Printer Queue allows you to find out the status of print jobs in
    the queue.


    +   - LPR Line Printer Remote is used for submitting print jobs to lp services
    and daemons.


    +   - NETSTAT Used for getting statistics about the NetBIOS interface. This is
    useful for viewing NetBIOS name, workday/domain info and even who is logged onto
    a machine, such as "netstat -a 192.168.1.1", which will show all the names and
    info for that computer, if it supports NetBIOS.


    +   - NETSTAT Allows you to get NetBIOS session statistics and information.


    +   - PING Packet Internet Groper, or Ping, is a standard tool for checking connectivity
    with a remote host.


    +   - RCP Client only in Windows 2000; not a server device; used for remote copying
    of files to a server.


    +   - REXEC Allows you to use a command and execute it on a remote machine.


    +   - ROUT Route show you the routing table, very similar to the Linux route command,
    use "route print" to show the table in Windows 2000.


    +   - RSH Remote allows you to start up a command prompt on the other machine,
    and actually do some processing (for example, compiling programs with a command-line
    compiler).


    +   - TELNET The Internet standard protocol for remote login. Telnet runs on top
    of TCP/IP.


    +   - TRACERT Tracer is the Windows equivalent of the traceroute command in Linux,
    it shows the latest set of routers a set of packets takes to a destination.'
