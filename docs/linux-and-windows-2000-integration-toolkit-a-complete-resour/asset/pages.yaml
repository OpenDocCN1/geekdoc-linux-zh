    # # Testing and Troubleshooting


    I''m not so foolish as think everyone who reads this book will have an easy time
    with the steps we''ve just talked about. There are too many different situations
    to be able to write something that will handle them all in such a short space.
    This section is designed to help you troubleshoot and fix what are some common
    mistakes, problems, and scenarios.


    # # Monitoring Windows 2000

    DNS Servers


    Not only do you want to make sure that the DNS server is still alive and functioning,
    you also want to know when and if it fails. Windows 2000 DNS servers contain an
    internal monitoring function that will monitor the server at a specified interval,
    and if it does not perform the query configured, it will write an event to the
    log.


    To configure monitoring for your zones:


    +   1. Choose Start | Programs | Administrative Tools | DNS.


    +   2. Right-click on your DNS server''s name and select Properties.


    +   3. Select the Monitoring tab.


    +   4. You will perform manual testing, a quick query against a zone, or configure-automated
    testing of the server at a specified interval.


    To perform a manual test:


    +   1. Select either a simple query against this server or a recursive query over
    other DNS servers.


    +   2. Click Test Now and look at the log at the bottom of the dialog for success
    or failure.


    To configure automated monitoring:


    +   1. Select the check box for “Perform Automatic Testing at the following interval."


    +   2. Determine how often you want to test this server’s functionality.


    +   3. Note: Keep in mind that over-testing will affect performance.


    +   4. Click OK and return to the DNS Server console.'
