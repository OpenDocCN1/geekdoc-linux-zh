  md: '# Table 6.1 Display Managers


    | | |

    |---|---n| XFree86 | xdm |

    | K Desktop Environment (KDE) | kdm |

    | GNOME | gdm |


    # Window Managers


    Window Managers are software packages that provide a layer of control and enhancement
    between the raw XDM Display Manager and the user’s experience. While not usually
    as full-featured as the desktops we will talk about later, some of the more advanced
    Window Managers are very configurable and useful. The applications that run in
    the Window Manager’s area of responsibility are supposed to at least give a few
    clues about its requirements and methods for controlling and configuring.


    Window Managers also allow you to change the look and feel of your application’s
    windows, borders, and general look and feel of the controls and widgets that make
    the application’s interface. Some of these controls are redundant with the desktops
    featured later, causing some confusion as to where you should make changes to
    your configuration.


    To say there is a large number of Window Managers would be an understatement;
    it seems that every week or so there is YAWM, or Yet Another Window Manager. The
    fervor of some WM users borders on psychosis, or just really personally loyalty.
    Examples of Window Managers include ICEwm, Enlightenment, FVWM95, AfterStep, AnotherStep,
    Blackbox, WindowMaker, and many others.


    If you have ever had your display move around in that irritating manner that makes
    your monitor look like a little square porthole on a much larger screen, that
    is your virtual display, and typically governed by the Window Manager. Another
    great feature of Window Managers and the desktops is the virtual desktop list,
    or the icon on the toolbar that usually has two rows of squares for a total of
    four different windows on your “virtual desktop.”


    Many power users and sysadmins will spend a certain amount of time getting back
    into “state,” or the working set of tools in different virtual desktops needed
    to get down to business. This is in direct contrast to the Windows 2000 environment,
    which only presents one desktop to the user, and while it’s possible to trick
    it by logging into the same machine as a Terminal Server Client, you are really
    working pretty hard to do something that Linux users take for granted.


    For a good look at the different Window Managers and the options they contain,
    visit the Fresh.net archive (www.freshmeat.net), and type “Window Manager” in
    the Search dialog.'
