  md: '# 94 Chapter 4


    their implementation of TCP/IP in this version. That said, they have put-gether
    a very good, if not totally interoperable, product. Microsoft''s extensions to
    the standards are mostly out of necessity; some are absolutely necessary to support
    the updated set of services in Windows 2000.


    Modifying standards is a great way to get the industry mad at, but Microsoft has
    implemented some breakthrough through new services and incorporated a few new
    proposals to present a very functional protocol suite. It remains to be seen how
    these enhancements will play out in the larger networks, particularly loads they
    will place on the routers and hosts that connect and inhabit them.


    Changes to the TCP/IP stack itself are among the top reasons to win Windows 2000''s
    implementation. Let''s take a hard look at some of the most-important.


    **TCP selective acknowledgement.** Known as a SACK, and mentioned in RFC 2018,
    this option finally breaks the "two-by-two." Noah''s Ark, Navy swim-buddy style
    of sending and receiving TCP packets in the new pairs. TCP packets were sent out
    in two and hopefully acknowledged in the pairs by the target host. If a packet
    that was one-half of a pair was damaged or lost, the set had to be sent again,
    causing extra delays. This feature now lets the target request only the missing
    packets, effectively cutting the resulting traffic to complete the missing data
    in half! Not bad for a bunch of packets?


    **TCP window size.** One of the features that shows that TCP was designed for
    slower networks with high collision rates was the default 8k window size. As networks
    got larger, higher speed, and more efficient, the need to increase the window
    size became evident. This means that more packets can be sent at a given time,
    which combined with Selective Axes will make the data flow much faster. This feature
    is laid out in RFC 1323.


    **Round trip time (RTT/RTO).** With all of the larger window sizes and improvements
    to delivery, comes the need to assess how long it takes to get packets from one
    to another. The RTT interval is the amount of time it should take for a round-trip
    communication between a sending host and a receiving host. The main benefit for
    this is determining how long the hosts should wait for lost packets before re-sending.
    This value is also known as the Retransmission Time Out (RTO) value.


