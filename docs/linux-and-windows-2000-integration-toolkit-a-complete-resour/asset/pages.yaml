    and which are local files for the sole use of the NIS master and its configuration.


    # What Files Are Going to Be Shared?


    The section that defines what files are to be shared will look like Figure 13.2.

    The line that begins with “all:” and a list of filenames where you specify which
    maps will be made available through NIS. Some conventions to be aware of, any
    line that is preceded by a #, or has the # character and then information after
    it is commented out, will be ignored.


    In many system administrators'' opinions, you can get away with just sharing out
    the passwd, group, and hosts files. The rest of the files shown are just to give
    you a suggestion or two, not that you need to build a map from every file and
    pollute your network with it.


    The intention of this section is to get you a good start, not teach every single
    thing about NIS. Therefore, leave the rest of the file alone until you have a
    chance to study the pages, the TOs and a few books about NIS.


    > NOTE A word about users and the UIDs that will be distributed by default.

    You might want to give some attention to the distribution of users who have a
    UID lower than the default of 500, or the groups that have a default lower than
    500. Figure 13.3 shows how the file is configured.


    Most organizations will not use UID or GID numbers lower than 500 for normal users
    anyway, so this is just fine. However, check your files for anything you want
    to distribute out, and set the value accordingly.


    ```

    # /etc/passwd - example of NIS-map entries

    # all:root:0:0:root:/root:/bin/bash

    user user:501:501:User:/home/user:/bin/bash

    group group:502:502:Group:/home/group:/bin/bash

    ```


    Figure 13.2 Files that will be shared in NIS.'
