  md: 'Networking/Linux


    $44.99 USA/$69.95 CAN


    # An in-depth, hands-on guide on how to successfully integrate Linux with your
    Windows 2000 systems


    # Linux and Windows 2000 Integration Toolkit


    As companies implement Linux alongside Windows, there is a critical need for guidance
    on how to make these two systems work together effectively. This book provides
    you with an in-depth understanding of the technical issues involved in implementation
    as well as the project management issues that will arise. Addressing version 2.4
    of the Linux kernel, as well as Windows XP and .NET, it offers the most up-to-date
    working resource for all your Linux with Windows 2000 integration questions. Expert
    Ross Bryson takes you through the process for integrating both systems, offering
    proven tips and techniques to get the job done right. Throughout the book are
    numerous practical examples that clearly explain all topics from the ground up,
    such as architectures and features,


    strengths and weaknesses of both systems. You''ll also find real-world solutions
    for the project management problems you''ll face in your daily tasks so you''ll
    be able to effectively use Linux Windows 2000 system.


    ROSS BRUNSON Director of Course Development and Instruction with Saur Linux, Inc.
    He is certified as MCSE, Inet+, and Saur LCI with extensive experience as a trainer,
    consultant and administrator. He has developed curricula for Linux and Windows
    2000 use for over twenty countries, and has implemented solutions for integrating
    Windows, Linux, and Unix across many and varied enterprises.


    Whether you''re a network manager, system administrator, or IT professional, this
    book covers the critical issues you''ll need to know, such as:


    +   - Project management issues, including setting objectives and creating action
    plans


    +   - Protocols, including TCP/IP, DHCP, and DNS


    +   - System, user, and group administration


    +   - Cross-platform scripting, printing, file access, and permissions


    +   - System configuration and troubleshooting


    +   - Applications, Virtual Machines, and Terminal Client Configurations


    ![](img/7c4d65772d38b487e72eb8750e4f3691_387_0.png)


    The CD-ROM provides you with:


    +   - Utilities


    +   - Programs


    +   - White papers and articles


    The companion Web site includes updated information and resource links.


    ![](img/7c4d65772d38b487e72eb8750e4f3691_387_1.png)


    Wiley Computer Publishing


    Timely. Practical. Reliable.


    Visit our Web site at www.iley.com/compbooks/

    Visit the companion Web site at www.iley.com/compbooks/branson


    ISBN 0-471-41747-6


    ![](img/7c4d65772d38b487e72eb8750e4f3691_387_2.png)


    54999


