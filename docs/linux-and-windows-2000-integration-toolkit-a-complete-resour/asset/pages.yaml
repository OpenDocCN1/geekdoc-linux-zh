- img_proc: true
  md: '# Understanding the Active Directory Service 317


    ![](img/7c4d65772d38b487e72eb8750e4f3691_330_0.png)


    Figure 12.9 Intersite replication.


    automatically create a link between sites is to install a DC in a particular site,
    then down it and move it to another site. This will cause AD to automatically
    create a site link between the two sites, like those shown in Figure 12.9.


    The only problem with creating site links in this manner is that it will only
    create one link, and your topology might be such that you will want to create
    two or more. The more experienced AD technicians will always create site links
    by hand, preferring to exercise exquisite control over their intersite replication.


    # Site Links


    Unlike trusts in Active Directory, site links are unidirectional (one way) and
    nontransitive. For example, a site link between Site A and Site B will do nothing
    to configure replication between Site A and Site C. You must create that link
    manually, and on purpose (see Figure 12.10).


    # Options for Site Links


    Some options for site links are as follows:


    **Transport.** The method used by AD to transfer the replicated data. Your choices
    are Remote Procedure Call (RPC) and Simple Mail Transfer Protocol (SMTP). Yes,
    that''s the e-mail SMTP! RPC is compressed and very efficient for transferring
    data. The tradeoff for using RPC is the CPU and memory needed to perform the compression.
    SMTP replication between sites is currently almost functional, with some problems
    with very busy sites and lots of data. Global Catalog information, which is not
    read/write, is perfect for SMTP replication.'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 318 Chapter 12


    ![](img/7c4d65772d38b487e72eb8750e4f3691_331_0.png)


    Figure 12.10 Site links.


    Cost. Similar to the metric used in routing on Windows 2000 gateways and routers,
    cost is used to prioritize the link to be selected first, then others. For example,
    you would likely use a T1 line for your lowest-cost site link, and use a higher
    cost for a DSL or cable backup link. The default cost of a site link is 100.


    Frequency. What''s the frequency, Kenneth? Determined in minutes, this option
    tells how often the link should be checked for data needing replication.


    Schedule. The times when replication is possible on this link. The default schedule
    is every 180 minutes, 24 hours a day, 7 days a week. Mostly changed for conserving
    bandwidth on expensive connections, it''s best to leave these at their defaults
    until you know you need to change them.'
