    9. Right after the program output shows it''s leaving the directory of the files

    will be stored in, you''ll (hopefully!) see a message about “NIS Map up-date completed.”

    10. Examine the screen for errors, such as missing or empty files in the Make-file
    list.

    11. Ypint is supposed to be run to initialize the database, and you shouldn''t

    have to rerun it if you experience errors; just edit the files and rerun

    the “make” command from the /var/yp directory.'
