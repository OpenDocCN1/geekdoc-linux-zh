    # The Problem with Pico


    The two problems with pico are that, first, it''s not an open source program!
    It''s a “free” program, and therefore inherently slight in the minds of most people
    in our community. The second problem is that it doesn''t handle CR and LF correctly
    when a line is longer than the screen width default of 80 characters. For example,
    editing the /etc/fstab file and adding a very long entry will almost produce an
    error if the file is edited using pico, but if you use vi, nano, emacs, or any
    of the other editors.


    The solution is to use emacs, or install use nano, which is a free and open source
    pico replacement.


