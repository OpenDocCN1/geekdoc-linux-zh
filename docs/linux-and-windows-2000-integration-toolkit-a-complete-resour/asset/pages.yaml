    Some interviewers for consulting firms and administrative posi-

    t are already including DNS skills as a requirement for nearly any open

    systems position, and smart IT staffers are busy taking classes and reading up

    ion the subject. If it''s not already one of the most important services you can
    run

    in your working environment, it will be very soon. Nearly every system or

