    of the wizards, it will attempt to verify the existing configured DNS server as
    the authoritative primary server. If this information doesn''t exist, or is wrong,
    the wizard might fail. One of the problems with wizards is that you may or not
    get a decent and informative message about errors. I would be warping reality
    severely if I referred to the Linuxconf GUI as a wizard, so I will of course refrain
