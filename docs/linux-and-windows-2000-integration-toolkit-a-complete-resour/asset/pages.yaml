    # DNS and Windows Computers


    DNS is a key component for organizations needing to access the Internet for

    everything from casual surfing to e-commerce, and also forms the underlying

    structure for Active Directory Services in Windows 2000. Microsoft''s decision

    to base Active Directory on DNS was very good planning, and a definite nod

    of recognition to the open systems community that it wasn''t Microsoft stan-

    dards that won an important battle.


    Many of you remember when Microsoft introduced the WINS, or

    Windows Internet Name Server, which resolves a Microsoft host''s computer

    name or an IP address. They assumed that the world would

    deighted to use it, and the whole Internet would switch over to using

    the WINS Server for all name resolution. So, I''m being facetious, but if

    y were around and had read the press releases from that time, it''s not far off

    the mark!


    On TCP/IP networks (for instance, those used by Linux or Unix

    systems), DNS is normally the only naming system used. Microsoft Linux and Unix

    sadmins look, with something approaching pity, upon Microsoft adminis-

    trators are still stuck with NetBIOS and its problems. All the same, there

    are many similarities between DNS and NetBIOS names. Both namespaces

    use to identify the accessible resources on the network in a more user-friendly

    way than IP addresses.


    When you want to gain access to a server''s resources, you will normally

    connect using the server''s name, not an IP address. The thought of endlessly

    explaining and reminding your average user of your different servers'' IP ad-

    dresses is enough to cause even the most patient sysadmin to invent name

    resolution! Most users will not comprehend or have any familiarity with a

    network address, nor should they. Let''s talk about a battle that you can

    win, OK?'
