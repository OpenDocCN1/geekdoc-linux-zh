  md: 'IPSec. Another technology designed to keep your network data secure is Internet
    Protocol security (IPSec). It is used to encrypt network traffic between selected
    servers. IPSec helps organizations set up authenticated and encrypted connections
    between two hosts. You can utilize IPSec for protecting data on networks that
