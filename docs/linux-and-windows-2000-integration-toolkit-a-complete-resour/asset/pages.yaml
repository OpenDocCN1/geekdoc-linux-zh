- img_proc: true
  md: 'GTL Inc. (www.gtlinc.com) has ported the Linux Gnome Desktop to the Microsoft
    Windows operating system. In order to actually install and use it, you need the
    following:


    +   * A copy of a Microsoft Windows operating system

    * The U/WIN environment Release 2.8 or greater

    * An X11 server running on the Windows system


    The U/WIN product runs as a standard Win32 application; consequently, you won''t
    have to make any changes to the underlying system other than stalling the software
    packages. U/WIN is based on the uwin research efforts of Dr. David Korn, AT&T
    Research, and many others.


    # Where to Get U/WIN


    You can download U/WIN from the AT&T''s research Web site for any purpose—educational,
    research, commercial, to chew up some bandwidth. While it might be free to download
    and use for some purposes, you must purchase a commercial use license if you plan
    to do any development and distribution of software packages using U/WIN.

    Currently, three U/WIN versions are available:


    +   * The GTL distribution

    * The Winpro distribution

    * The AT&T distribution


    The three distributions represent the different stages of the product''s development.
    The most stable versions are the commercial (GTL and Winpro) ones, aiding in troubleshooting
    and planning for upgrades and the resulting problems. As the POSIX.DLL in the
    Windows environment is the arbiter of the operating system calls, the different
    versions strive to remain compatible with it. The AT& research version is the
    repository of the latest changes, and should be considered relatively unstable
    and experimental. If you have to use this in a production environment, either
    choose a commercial version, or wait until they (hopefully!) merge all the code
    forks back in time for U/WIN 3.0.


    # How to Install GNOME on Windows


    +   1. Download an evaluation version of U/WIN. You''ll need to download the evaluation
    version of the U/WIN base environment from GTL. For now, use their code, unless
    you want the experimental AT&T research edition for the bleeding-edge stuff.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '+   2. Install an X11 server. The current release of U/WIN doesn''t include
    an X11 server, so get a copy of any of the free ones (http://winfiles.com http://32bitonline.com,
    and so forth), or get a commercial version from Hummingbird (www.hummingbird.com)
    or WRQ (www.wrq.com). Just bout about any compatible X server will work for this
    product.


    +   3. Download and install the GNOME components. GTL has broken down the packages—too
    far in in my opinion, there are a bazillion of them to download and keep track
    of. (Maybe it''s easier to get the $25 CD-ROM?) You can get it from their site
    at www.gtlinc.com.)


    # # Summary


    In this chapter, we took a detailed look at the graphical user interface (GUI)
    for Windows 2000 and Linux (using the GNOME Desktop). Sysadmins from either camp
    should have learned enough to make them really dangerous, and to have a lot of
    fun discovering further areas of the GUI.'
  merge: -1
