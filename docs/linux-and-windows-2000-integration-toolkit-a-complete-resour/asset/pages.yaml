  md: '# Table 7.1 dhcpd.conf Parameters


    | ENTRY FILE | EXPLANATION |

    | --- | --- |

    | subnet | Sets the subnet being serviced by the server, and its subnet mask |

    | option routers | Sets the default gateway, normally 1 or 2 for sending traffic
    off of the subnet to other networks; multiple entries are separated by a comma.
    |

    | option subnet-mask | Sets the client''s subnet mask, single entry. |

    | option nis-domain | Passes the correct NIS/NIS+ domain for authentication, leave
    commented out ( put a # at the front of the line) unless you run NIS. |

    | option domain-name | The DNS domain for example the client will suffix to its
    hostname. This might require using the -D or -H option on the client end to force
    the clients to accept domain.com. |

    | option domain-name-servers | The server(s) that provide DNS name resolution
    for the client''s name -> IP address resolution requests. These can also be entered
    as a FDN, such as dns1.bigsite.com, dns2.bigsite.com. |

    | option time-offset | The difference in hours from Greenwich Mean Time (GMT)
    that the client is. (GMT is Zulu time for all U.S. military and ex-military.)
    |

    | option ntp-servers | The spot where the IP address of the Network Time Protocol
    server (which would enable you to sync your machine''s clock) is set. |

    | option netbios-name-servers | The WINS or other NetBIOS Server IP addresses,
    these enabling the client to resolve NetBIOS names (16-character, Microsoft Networking)
    to their correct IP addresses. Essential for Microsoft Windows compatibility in
    pre-Windows 2000 environments. |

    | option netbios-node-type | This option will be familiar to NT or Windows 2000
    administrators who must deal with WINS servers; it''s the client''s node type,
    which governs the order in which it searches the resources to resolve NetBIOS
    names. |

    | range dynamic-boot | By itself, the "range" parameter will allow the DHCP daemon
    to dynamically assign the addresses in that range. If you add the "dynamic-boot"
    parameter, the server/daemon will also serve dynamically and automatically both
    DHCP and BOOT clients. |

    | default-lease-time | Noted in seconds, this is the lease time that is assigned
    to all clients that do not specify as a particular lease length. (All Microsoft
    clients will get the default lease time, as they don''t have the capability to
    request a lease of length.) |

    | max-lease-time | Again, in seconds, the maximum time for a lease that can be
    assigned when a client asks for a specific lease length.'
