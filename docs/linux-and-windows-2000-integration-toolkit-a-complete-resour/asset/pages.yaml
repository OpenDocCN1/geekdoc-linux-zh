  md: '# Active Directory Installation


    Preplanning your domain and tree structure is very important—about 10 minutes
    to do it! Ok, all kidding aside, don''t make the mistake that many NT 4.0 system
    administrators committed, just installing as needed and worrying about the consequences
    later.


    A few questions to ask yourself before you install:


    +   Q. Is this the first Active Directory domain controller I have?


    +   A. Yes, then do the install as shown in the next section, and be ready to
    supply the Active Directory domain name and FQDN for your new tree.


    +   Q. Is this a new tree, or am I installing into an existing tree?


    +   A. If a new tree, follow the defaults; you are the one creating the whole
    tree. If one exists, you will find out from that administrator user-name/password
    and other information needed. Hopefully, it''s all you, or your team.


    +   Q. Is this a new forest, or am I installing into an existing forest?


    +   A. Same as the preceding tree question.


    +   Q. Am I an administrator? Do I have access to the right administrator account?


    +   A. If you are installing a new forest, tree, and domain, who cares? You will
    be typing in anything you want; just make sure you are the Administrator on the
    server you are promoting into a DC. If not, turn yourself in your system administrator
    and take the consequences!


    +   Q. Will I run in mixed mode or native mode?


    +   A. If you will have any pre-Windows 2000 BDCs in the domain, you will have
    to continue to run in mixed mode. When you have upgraded all your legacy domain
    controllers, the original DC that held the role of PDC master will no longer be
    the single master of the domain. In mixed mode, you still need that particular
    server to fill that role. In native mode, all DCs get along as peer servers. This
    won''t change the FSMO roles; they will still need to exist on a single physical
    domain controller, although the roles can move around.


    # Installing a New Domain from Nothing


    +   1. Enough of the small talk. Fire up your server, and log in as the Administrator
    account.'
