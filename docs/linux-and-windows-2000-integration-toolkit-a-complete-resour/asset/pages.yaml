    +   2136 (DNS-UPDATE) Dynamic Updates in the Domain Name System (DNS UPDATE)


    +   2137 (SDNSU) Secure Domain Name System Dynamic Update


    Of these, the current section discusses options outlined in RFC 2136 for dynamically
    registering and resolving names with a DNS server, and RFC 2052


