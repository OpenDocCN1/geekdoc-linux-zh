    # Assigning IP Addresses


    You can assign IP addresses to your clients manually, using DHCP or APIPA.


    # Manually Assigning IP Addresses


    When you manually (statically) assign IP addresses, you gain a high degree of
    control over the exact IP address assigned to a particular client. Some hosts
    should always have a static IP address or a manually assigned DHCP address (see
    next topic).


    The following types of hosts normally have statically assigned IP addresses:


    +   * DNS and WINS name resolvers.

    * DHCP servers.

    * Routers.

    * Non-Microsoft hosts that do not support DHCP assigned addresses.

    * Any server with direct public Internet connectivity, such as Web, mail, FTP,
    proxy, and NAT servers.


    Using manually assigned IP addresses presents the following disadvantages:


    **Human error.** A wrongly entered IP address can be very difficult to locate,
    and sometimes intermittent network errors. For example, if two hosts have the
    same IP address, conflicting IP address messages only appear when both hosts are
    online at the same time.


    **IT staff resources.** Unless the network is very small, manually assigning IP
    addresses requires a great deal of time and personnel. Changing an IP configuration,
    such as the subnet mask or DNS server address, requires someone to revisit every
    affected client and manually reconfigure the IP information.


    # Using DHCP to Manually Assign IP Addresses


    You can use the DHCP server to manually assign an IP address to any given client.
    The purpose of this is to allow the host to renew other IP configuration information
    when it changes (such as a new or changed DNS server address), while always guaranteeing
    that the host keeps the same IP address. You normally assign IP addresses using
    this method when you have servers'
