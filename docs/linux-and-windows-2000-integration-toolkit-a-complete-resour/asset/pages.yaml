  md: '# Linux Commands


    Creating a partition in Linux can be done with the fdisk utility; the command
    must be run with the device you wish to partition as an argument:


    ```

    fdisk /dev/hdc

    ```


    From this point, several options are available. To display the current partition
    map, type “p”. Assuming the drive has an existing partition you wish to delete,
    and then create a new Linux partition and a new swap partition of 124MB, you would
    type:


    +   d <enter> (to delete a partition)

    1 <enter> (to select the first partition)

    n <enter> (to create a new partition)

    p <enter> (to select a new primary partition)

    124M <enter> (to size the new partition to 124MB)

    n <enter> (to create another new partition)

    p <enter> (to select primary again)

    <enter> (to use all of the remaining space)

    t <enter> (to change the 124MB swap partition to a swap partition)

    1 <enter> (to select the first partition)

    82 <enter> (to select swap from the choices)

    w <enter> (to write the changes to disk)

    q <enter> (quit the program)


    To format this partition under Linux, the mke2fs command is used; the easiest
    usage of this command is simply:


    ```

    mke2fs -b 4096 /dev/hdc2

    ```


    where 4096 is the block size, and /dev/hdc2 is the partition you wish to create
    the new ext2fs filesystem. (In this scenario, you might consider running mkswap
    /dev/hdc to format the swap partition as such, and then swapon /dev/hdc1 to use
    it.)


