  md: '# Linux''s NIS and Microsoft''s Server for NIS 343


    ```

    passwd: files nis

    group: files nis

    hosts: files nis dns

    services: nis files

    ```


    Why do we have the option to look at different sources? There are times when you
    don''t want a machine to have any local username entries in the passwd file, either
    for management simplicity or because it''s a kiosk in the break room, or It would
    be a bad idea to pool all requests for the passwd information to NIS, as the machine
    will be effectively disabled if the network is down and you don''t have a local
    file entry to login with.


    The previous example shows that we are looking at the local passwd file, first
    off to NIS for the information if it''s not found locally. This is very useful
    when you need to login as the root user now and then, particularly when you are
    a sysadmin who needs to troubleshoot a machine. Very seldom will you allow users
    a local login if you are using NIS in the company; it defeats the purpose of NIS.
    Typically, the group''s entry will show identical options to the passwd entry.


    In case of the host''s entry, you would want to consider the layout of your DNS
    Primary and Secondary Servers. If the machine is on a far-elung network and there
    are no DNS Servers locally, or easily available, set the machine to look first
    for the resolution in its local files, then to use DNS, and finally resort to
    NIS for the resolution of the hostname. Particularly for systems that are configured
    to reach a set number of hosts and not much else, this would decrease the network
    traffic for resolution to a minimum. The only problem is the alter the local file
    when names and addresses change. Table 13.2 shows the six options for place, each
    of the file entries.


    When a lookup takes place, whatever happens to that request produces a STATUS
    message, and the various types are listed in Table 13.3


    As you probably have concluded from the Tables 13.2 and 13.3, there are two possible
    actions for when an option doesn''t present a successful lookup of that information:
    "return" and "continue."


    # Table 13.2 Six Options for Each of the File Entries


    | nis | Uses NIS to determine the information. |

    | yp | Uses NIS to determine the information (backward compatible alias for nis).
    |

    | dns | Uses DNS to determine the information (only for hosts). |

    | files | Uses the local file on that machine for the information. |

    | nisplus | Uses NIS+ to determine the information. |

    | STATUS="action" | For a particular STATUS performs the supplied action. |'
  merge: -1
