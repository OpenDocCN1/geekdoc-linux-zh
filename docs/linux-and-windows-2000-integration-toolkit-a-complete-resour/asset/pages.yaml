    Encrypted File System (EFS). Some of our military administrators will be glad
    to use EFS to secure not only the desktops of secure systems, but especially the
    laptops that are carried by military and security professionals. EFS enables the
    user/administrator to encrypt the data on a NTFS Version 5 file system with a
    very high probability of not being decoded. When you open or close a file, EFS
    will automatically decrypt the file for use and reencrypt the file when it is
    closed or saved. Because the security is keyed to the user''s information and
    login, no one can read these files except the particular user they belong to and
    the administrator. Even the administrator must have an EFS recovery certificate
    to recover and read the files. Microsoft has built this feature to the file system
    and can secure every file on the system with very little in the way of performance.
    It’s very difficult to get all the pieces needed to crack this system, but you
    can bet that someone in the Linux or UNIX system will try, just for kicks and
    to say they! EFS file systems will also protect the data from someone trying to
    use disk utilities to read the data. Users should be aware that if the data is
    moved or copied from the EFS enabled file system, such as to another hard drive
    or a floppy, or even across the network from one EFS system to an unencrypted
    state!


    # NTFS5 Volumes


    NTFS5 (as opposed to Windows NT 3.X/4.0 NTFS) offers several enhancements, including
    file and folder encryption, user quotas, remote storage, and sparse files. With
    sparse files, applications that reserve a large portion of disk space for a file
    actually occupies only the space in actual use by the data.


    # Windows File Protection


    Windows systems often require a reinstallation when critical files are missing
    or corrupt. Windows 2000 protects against file loss and corruption by replacing
    them. The System File Checker (SFC.EXE) scans the system and replaces files as
    necessary.'
