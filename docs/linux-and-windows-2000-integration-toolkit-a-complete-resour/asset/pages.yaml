- img_proc: true
  md: '# 216 Chapter 9


    +   3. On the Member server, create a Local group to use as an anchor for assigning
    permissions.

    4. Assign resource permissions to that Local group.

    5. Make the Global group member of the Local group.

    6. Have the users log out and back in to regenerate the SAT.


    # Granting Resource Access on

    a Domain Controller


    +   1. Add the user accounts into the domain on a domain controller.

    2. Create a Global group in Active Directory and add the accounts as members.

    3. On the domain controller, create a Local group to use as an anchor for assigning
    permissions.

    4. Assign resource permissions to that Domain Local group.

    5. Make the Global group member of the Domain Local group.

    6. Have the users log out and back in to regenerate the SAT.


    # Granting Access without Disrupting Users


    The key to granting access to a resource for a group of users is to have them
    pre-preged in acceptable Global groups, that can then be dropped into any Local
    or Domain Local group to grant the access. This means the user will not have to
    log out and back in to regenerate the SAT, as their group membership has not changed,
    only the group membership of their Global group has changed!


    With a bit of luck and good planning, you can change permissions and shares for
    users and never have them know or about the difference.


    # Administration Interfaces


    Both of our subject operating systems have GUI and CLI methods for adding users
    and groups. Of the two, Linux sysadmins are usually comfortable manipulating the
    shell to accomplish their additions and changes, while Windows 2000 administrators
    normally take the stance that if you have to resort to the command line to add
    users, the system is probably in dire need of a reload of the operating system.
    Not all Win2k admins take this attitude; there are a number of us dual-mode folks
    taking advantage of batch scripting, Windows Scripting Host interfaces, and Perl
    on Windows to count.'
