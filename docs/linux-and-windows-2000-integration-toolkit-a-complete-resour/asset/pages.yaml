  md: '# Assigning and Managing IP Address Information 173


    ensures that the client will request that its information be updated in DNS, but
    it depends on the DHCP server settings to determine exactly how. For legacy hosts
    that are not dynamic update aware, you will want to modify the DHCP server or
    scope properties to ensure the update of both the PTR and the A resource records
    for the client.


    # Modifying DHCP Server to Update DNS Information


    There are three ways to configure your Windows 2000 DHCP Server:


    +   * Update whichever records the client requests that it update (Win 2000 clients).

    * Always update both A and PTR resource records, regardless of the quest of the
    client (both Win 2000 and legacy clients).

    * Not update any DNS records (just to be ornery, or Unix/Linux clients).


    To configure dynamic update for the Windows 2000 DHCP Server:


    +   1. Start, Programs, Administrative Tools, DHCP.

    2. Click on the plus sign next to the server to see all scopes.

    3. Right-click on scope you''re configuring, and select Properties.

    4. Select the DNS tab.

    5. If it is not already selected, select “Automatically update DHCP client information
    in DNS."

    6. If you want the server to register the records the client requested that it
    register, select the option “Update DNS only if client requests."

    7. If you want the server to always register both A and PTR resource records,
    select the option “Always update DNS."

    8. If you want the server to always register both A and PTR resource records on
    behalf of clients that do not support the FQDN option, select “Enable updates
    for DNS clients that do not support dynamic update."


    # How Active Directory Manages DHCP Servers


    The ability to detect and disable automatically unauthorized DHCP servers gets
    a thumbs-up from all administrators. Ask anyone who has had a well-meaning technic
    set up a test DHCP server on a busy and well-populated production subnet. To say
    that mayhem ensues is an understatement. Client'
