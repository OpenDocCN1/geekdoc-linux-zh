  md: '# Local and Remote Filesystem Integration


    # Remote Filesystem Access


    In this section, we discuss how to access remote filesystems from the different
    client bases, and give a fairly comprehensive overview of some of the packages
    that are available, most notably Microsoft''s Services For Unix, currently in
    version 2.x.


    Whether you use SFU, SAMBA, or plain old UNC, you have plenty of options for all
    your clients to access remote filesystems. Those wishing to take the hobbyist
    route should look very closely at using SAMBA and/or using smb to attach to Windows
    servers. Those who want a polished solution (and the accompanying price and service)
    should choose the Services For Unix or other NFS Suites.


    > WARNING NFS isn''t the most secure or fastest method for sharing filesystems
    across a network, especially over wide area network lines such as cable, T1, or
    DSL. The cost for a copy of Microsoft''s SFU or other similar package is a problem
    for many organizations, multiplying $100+ by the number of workstations needing
    access will give you a ballpark figure to plan with.


    # Microsoft''s Services for Unix


    Through the use of either Microsoft''s Services For Unix 2.x or third-party tools,
    you can have Windows 2000 both share and attach/mount NFS filesystems.


    The Services For Unix package is very economical and easily purchased online or
    in major software stores. For those who are looking for a smooth install, Microsoft''s
    staff of approval (for support reasons), and a warm fuzzy feeling of enriching
    "Big Bad Bill," SFU is the way to go.


    The NFS portion of the SFU package is threefold:


    Server for NFS. For a Windows 2000 host to share out its data via the Industry
    Standard NFS (Network File System) protocol to all other NFS clients. The Server
    for NFS is completely compliant with NFS 2 and 3, allows username mapping, and
    sets the access for users via their UID, GID, and NFS permissions.


    Client for NFS. This allows a Windows machine to mount or map NFS exported filesystems
    from any compliant host, with full support for NFS 2 and 3. For Windows clients
    in a predominantly Unix/Linux environment, this is an easy way to accomplish file
    sharing. The client can either use command-line tools to map filesystems or the
    Network Connections dialogs, choosing the NFS Network instead of the Microsoft
    Windows Net


