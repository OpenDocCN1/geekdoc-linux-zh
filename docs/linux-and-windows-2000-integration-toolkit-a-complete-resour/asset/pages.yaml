- img_proc: true
  md: 'machines will often lease themselves an address from the new server, and refuse
    (rightly) to connect to any of your network resources. Your helpdesk people will
    route all support calls to the DHCP administrator, and go to lunch.


    DHCP Server 2000 uses several steps to insulate your network from unautherized
    DHCP installations. Instead of the old method of running around to find out who
    did it, you can perform the authorization step at your desktop in Active Directory.


    In an Active Directory network, the steps are very easy. When the DHCP Server
    service is installed on a Windows 2000 Server or Advanced Server, the DHCP service
    will check to see if it is a part of an Active Directory domain. If it is, it
    will send out a DCPINFORM message that attempts to validate itself with the list
    of authorized DHCP servers in the domain.


    If it is not in the authorization list, it will not respond to DHCP packets. It
    will continue to check its status every five minutes to see if it is authorized.
    course, if it finds itself in the list, it will immediately start to function
    as a DHCP server.


    # What If There’s Only a Workgroup?


    The workgroup member DHCP server will still send out a DCPINFORM message on the
    network. Any other DHCP server that is a domain member will respond to this message
    with a DHCP packet that contains the domain and directory information. If the
    workgroup member DHCP server receives a response from a DHCP server that is a
    member of a domain, it assumes it is unauthorized and will not serve requests.


    However, if no DHCP servers are members of a domain, or if they are also workgroup
    members, it will ignore them and begin to service requests. It is a great reason
    to make sure your DHCP servers are members of the Active Directory domain.


    # Summary


    This chapter turned out the heat for the integrating sysadmins with a full explanation
    of the DHCP options for both operating systems, how to manage those addresses,
    setup scopes and understand all the parameters for the configuration files and
    interfaces. Armed with this knowledge, sysadmins will be able to provide IP addresses
    for any client, and integrate those clients into the corporate network to take
    advantage of the name resolution possibilities, especially those legacy clients
    that need a little help from the likes of WINS.'
