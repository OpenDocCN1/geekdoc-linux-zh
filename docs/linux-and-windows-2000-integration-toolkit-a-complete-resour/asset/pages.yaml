- img_proc: true
  md: '# The smbconf File


    The next step is to configure smbconf by copying the default smbconf file from
    the install directory to a location where SAMBA expects it to reside, namely /usr/local/samba/lib;
    accomplished easily enough by typing cp samba-2.2.0/examples/smbconf.default /usr/local/samba/lib/smb.conf
    and pressing Enter. Some distributions that pre-install SAMBA put the smbconf
    file in /etc or /etc/samba; in this case, simply use that file. The location in
    which SAMBA looks for the smbconf file can be specified at compile time, allowing
    the smbconf file to be in virtually any location. If you have a hard time locating
    the smbconf file, try using the command:


    ```

    $ slocate -u (this updates the locate database)

    $ locate smb.conf (this will show you where it is)

    ```


    # Configuring the Sections


    The default configuration should be more suitable; however, there might be a couple
    of areas you will want to change. The workgroup and server names are the first
    two entries in the file; changing them to something more suitable is recommended.


    Also, if you wish to eliminate the bickering between Windows systems concerning
    browser master elections, uncomment the "local master" and "os level" fields,
    and change the values to "local master = yes" and "os level = 65". An OS level
    of greater than 60 is not possible on Windows systems, including primary domain
    controllers (PDCs). Setting this value to 65 on the Linux system ensures that
    no matter how many Windows systems of any breed, the Linux system will always
    take precedence in browser master elections; this eliminates many issues with
    browsing the local network and waiting for newly booted systems to be recognized
    in (or recently shutdown systems to be cleared from) Network Neighborhood.


    The last step in installing SAMBA is to start the service:


    ```

    /usr/local/samba/bin/nmbd -D

    /usr/local/samba/bin/nmbd -D

    ```


    You might wish to add the two previous lines to your startup scripts, perhaps
    rc.local, in order to have the SAMBA service started in the event the system is
    rebooted. Some systems will allow the use of the command:


    ```

    $ samba start

    ```


    # Configuring Windows Clients for SAMBA


    Accessing a SAMBA share from a Windows system is no different from accessing any
    other shared service in Network Neighborhood—just browse In.'
