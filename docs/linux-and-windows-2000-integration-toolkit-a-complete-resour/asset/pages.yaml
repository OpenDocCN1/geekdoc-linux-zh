  md: '# Integrating DNS Environments 197


    even in zones that are not Active Directory integrated, such as DNS servers in
    the Linux arena that support this new RFC and record type.


    # Dynamic Updates to DNS Zones


    The other important new record type is defined in RFC 2136 Dynamic Updates in
    the Domain Name System (DNS UPDATES). This record type allows your hosts to register
    their domain name and IP address information with the DNS server dynamically!
    Until this innovation, it was necessary to update hostname and IP address mappings
    manually, or rely on some of the proprietary offerings from third-party vendors.


    Windows 2000 makes extensive use of this record type as a way to get requesting
    machines attached and communicating quickly with the servers that contain the
    needed services. All properly configured DHCP clients in Windows2000 environment
    can either choose to register themselves (if they are Dynamic DNS-aware) or have
    the DHCP server register them on their behalf. Linux and Unix machines can take
    advantage of this feature of the DHCP server for Windows 2000, and have their
    information registered automatically with the corresponding DNS server. As painful
    as it is for dyed-in-the-wool Linux and Unix sysadmins to admit, this might be
    a possible reason to install and use a DHCP/DNS server for Windows 2000 in their
    mixed environments. (Interesting side note: this is similar to the way the kudzu
    vine was introduced into the American South, and is currently carpeting the entire
    landscape.)


    # Demystifying Zone Transfers


    Zones are treated differently in Windows 2000 and Linux. Windows 2000 automatically
    nearly everything concerning DNS for you the administrator, as you would expect.
    Linux retains its usual semidiffundant and not-so-intuitive nature, requiring
    you to make serial number changes in order to cause zone transfers.


    # Zone Transfer Methods


    There are two varieties of zone transfer, all or just changes. A zone transfer
    is initiated when a master or primary server sends notice that changes have occurred
    in a zone in its secondary server or servers. The secondary server(s) will then
    (in good time) query the master server for changes to the zone database file.
    Propagating zones is essential for name resolution, fault tolerance, and the reduction
    of cross-subnet name resolution traffic. If you plan and place your secondary
    servers correctly, you can reclaim large amounts of bandwidth that'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'was previously needed to query a distant name server. Additionally, it''s necessary
    to guarantee that clients can access a local name server in case of primary name
    server failure, or broken connections to that server or its subnet.


    # The Basketball and the Garden Hose


    Older DNS versions, including the ones that have been ported in the past to the
    Windows NT environment, use AXFR-style (full zone) transfer. For years as a trainer
    and consultant, I have characterized this as the “Basketball through a Garden
    Hose” method. Realistically, most of the zones in the world aren''t that large,
    but a significant amount of traffic can result for a medium-sized zone transferred
    several times in a day.


    The method to control when a zone is propagated is a single serial number that
    tracks the state and version of the entire zone database. Even a single change
    accompanied with a serial number can update the transfer of an entire zone. An
    unwitting and well meaning (basically the root of all evil) system administrator
    making a few database changes each day can keep a zone in constant transfer, eating
    up bandwidth, and worst of all, reducing the accuracy of their name resolution
    for the remote clients on secondary servers that haven''t received a full zone
    transfer!


    Windows 2000 introduces the concept and function of incremental zone transfer,
    IXFR. This method will only send changes for records that have changed, added,
    or deleted. Each record has a serial number (both the primary and secondary serial
    numbers for comparison) to determine what should be replicated. The master server
    will notify the secondary server of the changes and keep them in cache until they
    are replicated and committed onto the secondary.


    # Just the Changes, Please”


    Full zone transfers consume a great deal of network bandwidth, especially for
    complex DNS configurations. To solve this problem, RFC 1995, Incremental Zone
    Transfer, outlines an updated method for transferring zones intelligently. When
    you are using a server that supports incremental zone transfer, you are sending
    only the modifications that have been made to the zone database, not the entire
    thing.


    Although sometimes radical in its positive effects on available bandwidth, incremental
    zone transfer works similarly to full zone transfer. You still have the primary/secondary
    server relationship, based on the Start of Authority (SOA) record. The major difference
    is that it will not initiate a full zone transfer unless a new secondary has just
    been installed, and instead sends on the changes to the records that have been
    made since the last serial number change. You might be wondering how the changes
    to the records themselves'
