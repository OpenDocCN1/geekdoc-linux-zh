- img_proc: true
  md: '# Planning and Executing an Integration 13


    # Step 1. Gathering the Team


    Not much explanation is needed, but there is some detail in this step. You should
    be getting together a team that you can count on to focus on the task at hand,
    give you good advice, and not disrupt the process unduly. You should have one
    gadfly or "Devil''s Advocate" on the team, someone to take the role of the pessimist,
    or to be Murphy, the spoiler of projects and the best laid plans of integration
    teams.


    The size of the team depends on the size or scope of the project. I usually try
    to keep the planning team down to about four to six people, with the option to
    bring people in from the trenches when needed, with sort of like DLL''s that are
    loaded when removed from memory when not needed. This allows your planning team
    to focus and not have a lot of people spending too much time waiting for their
    sections of the project to be discussed.


    # Step 2. Determining the Project''s Goals and Scope


    My experience with this step tells me that everything you ever wanted in an integration
    but were afraid to ask for should be tossed into the mix. Then priorities should
    be assigned—either by using a spreadsheet and a lightshow projector on the conference
    or war room wall or a whiteboard that has a print and snapshot option. I prefer
    a high-resolution laptop and a lightshow box on the wall; it lets you move around
    a lot and not spend a lot of time erasing and rewriting things.


    A project''s Scope is defined by the features or functionality that can be accomplished
    sanely during the implementation of the project. When you suspect that "Scope
    Creep" will make its way into the mix, it''s wise to define the phases of the
    project will be broken into and what functionality should be implemented in what
    phase. Creeping Scope is capable of stalling or killing any project, especially
    an integration project.


    Scope Creep is the phenomenon that occurs when a plan is agreed upon, then someone
    has a great idea about half way through the implementation phase, features or
    functionalities are changed, resulting in the need to make other changes. You
    will find, very quickly, that you have a patchwork quilt of fixes to fixes that
    will cause premature gray (as if we don''t have all gray hairs already!) and what
    appear to be spontaneous nonfatal aneurisms among the implementation team leaders.
    Getting the project team''s buy-in to the phases approach will smooth the way
    for telling people that a possible added feature will be considered for the next
    phase. Whether or not you will really add that feature in the next phase of the
    project isn''t germane to this phase, but it keeps the project on track.'
