- img_proc: true
  md: '# Secondary Name Servers


    A secondary server receives its zone information from a primary server through
    a process called a zone transfer (a basic copy procedure). It is important to
    understand and configure the relationship between the primary and secondary servers
    correctly. Through the DNS interface, you can easily configure the secondary server
    by dragging the hand icon to the primary zone. The only other item you need to
    configure is the notify list, which instructs the primary server to notify its
    configured secondary servers of changes. For security reasons, it is also a good
    idea to configure the notify list to communicate only with designated secondary
    servers. The major benefit of having secondary servers is fault tolerance and
    load balancing, especially in a large network. It is not fun to rebuild a DNS
    server from scratch when it maintains several hundred or even thousands of host
    records and specialized domain information.


    # Master Name Servers


    A master name server is used in conjunction with a secondary server. When you
    are configuring a secondary server, it is necessary to designate a master server
    as the source for zone information. The master server can be a primary or secondary
    server for the zone. When a secondary DNS server initializes, it contacts its
    master server and transfers zone information.


    # Caching-Only Servers


    A caching-only server maintains no local host information. It retrieves all of
    its information through queries against other name servers, and then stores that
    information locally in a cache file. The benefits of this type of server are little
    to no maintenance is required, and all information contained in the server is
    automatically retrieved through the query process. No zone transfers are carried
    out.


    # DNS Query Types


    The main object of querying DNS for name resolution is to turn a human-friendly
    name to an IP address, so that the source host can determine if the target host
    is on the same subnet or not and direct its traffic accordingly.


    # Fully Qualified Query


    This is used most often and is similar to a FQDN (for example, myserver.mydomain.net).
    Myserver is the hostname, mydomain is the registered'
  merge: -1
  pgno: 194
- img_proc: true
  md: 'domain name, and .net is the top-level domain. This query will be much easier
    than other types to resolve. Before the client sends the query to DNS, the client
    system''s resolver first checks the cache. If the requested name is in the cache,
    the result is returned to the user. If the name is not found in the cache, the
    client resolver then queries the listed DNS servers in each adapter''s properties.
    If the DNS servers configured in the adapter''s properties don''t find the resolution,
    they will most likely throw the query to a root server and it will be resolved
    fairly quickly.


    # # Unqualified Single-Label Query


    If a name contains no dots, it is called an unqualified single-label name; for
    example, myserver. If you need to resolve such a name, it must be modified into
    a fully qualified query. A domain suffix can come from several sources, the first
    being the Global Suffix Search Order. This is configured in the TCP/IP Properties
    and is not adapter specific. The second place a domain suffix can be obtained
    from the Primary and adapter-specific suffixes. The Primary suffix is the preferred
    one, but each adapter can contain its own suffix information. If you specify suffix
    searches to occur in a certain order, they will, but if not, the Primary is used
    and it defaults to the per-adapter suffixes.


    # # Unqualified Multilabel Query


    If a name contains dots is not a proper fully qualified query, it is known as
    an unqualified multilabel name. An example of this would be to leave off the .net
    and refer to the host as myserver.myd. The whole objective being to resolve the
    name, not to quble over semantics, the query is submitted as a fully qualified
    query as it appears. If the query is resolvable as, a response is returned to
    the client. If query times out, the client will retry the query. If the query
    is returned negatively, it will be tried as a single-label query by stripping
    off the .myd. This will cause the default suffixes to be attached and the query
    will most likely receive a positive response.


    # # Configuring Query Settings for Windows 2000


    To set the DNS query settings:


    +   - Right-click My Network Places, and then click Properties.

    - Right-click the connection that you want to view, and then click Properties.

    - Click Internet Protocol (TCP/IP), and then click Properties.

    - Click Advanced, and then select the DNS tab.'
