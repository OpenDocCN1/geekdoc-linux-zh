    If your company has a larger number of Unix/Linux clients needing to access a
    Windows 2000 server, then you already have the client software needed on the Linux
    boxes, and need only get a NFS Server package on the Windows 2000 servers.


    # Windows 2000 File Sharing


    Windows 2000 file sharing are extremely similar to Windows NT’s process. They
    use the same tools, the same interface (mostly), and have the same vulnerabilities.
    If you have a set of Linux boxes that need to mount and access data on Windows
    2000 machines, you can install the SAMBA utilities and use them to access those
    systems.


    All Windows 2000, NT 4.x, and NT 3.5x will be able to host a share that your clients
    can access, but take care to set the appropriate permissions on those shares,
    lest you cause issues.


