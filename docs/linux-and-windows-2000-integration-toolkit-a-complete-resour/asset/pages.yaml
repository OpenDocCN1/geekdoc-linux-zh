    # Windows 2000 Users and Groups


    Windows 2000 uses the local Service Account Manager (SAM) database or

    Registry to hold the user and computer accounts. Obviously, there are some

    advantages to placing the accounts and related information inside a binary, en-

    crypted, and most secure container. One of the main disadvantages is not

    being able to easily repair a garbled password or group file with a boot

    diskette/CD-ROM or your favorite text editor!


    # Windows 2000 Account Conventions


    Windows 2000 is a slightly looser structure for naming users and groups

    like Linux. Because the accounts are kept in a structured database and

    not a flat text file, things can be represented in a more visually complex man-

    er. (Ok, I know, Linuxconf is about as complex as you can get in its full ver-\sion-stick
    with me.)


    # Case Sensitivity and Names


    Users and groups in Windows 2000 can have upper/lowercase characters, and

    it probably won''t matter unless you are, surprise, coexisting with Linux/Unix

    machines. If you want to have maximum interoperability, make sure your ac-

    counts are all lowercase. Win 2000 passwords are case sensitive just as Linux

    words.


    As in Linux, the user account name must be unique; even if the UID is dif-

    erent, the accounts cannot match. As far as lower- and uppercase, you can''t

    specify either in Windows 2000; it might show the account in uppercase, al-

    ough it''s really not.


    The allowable characters for a Windows 2000 user or group account are

    the usual suspects: 0–9, a–z, dashes, and underscores are fine for use. Anything

    that is considered punctuation, such as the “” character, `=`, "|", and so forth

    is off limits for account names.


    # Account Length


    Accounts can be up to 20 characters long, which is useful, but who wants to

    type in 10+ characters for a login name? Make sure to build in some handling

    for multiple users with the same or similar names.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# Planning for Account Name Conflicts


    The two most likely methods for naming multiple similar accounts are:


    +   - First character of the first name, the last name up to a total of eight
    characters (for example, rbrunson)

    - The first name and at least the first character of the last name (e.g., rossb)


    I have seen a lot of password mangling and renaming of accounts because someone
    didn''t take a little time to plan things out correctly. Experiment around and
    then choose a method that will scale with your organization.


    # The Security Side of Windows 2000 Accounts


    On the Windows side, even in Windows 2000 and XP, there are still security identifiers
    (SIDs) associated with all the user and group accounts. Computers in Windows 2000
    also have accounts in domains, and are tracked by SIDs.


    # The Security ID


    SIDs are very long and complex unique numbers that are generated by Windows 2000
    for new accounts. The SID is like a one-time or page-per-day code book; the number
    is used once, and even if the account is created again in exactly the same manner,
    names, and so forth, the new SID will be unique.

    Windows 2000 depends on the SID being universally unique in the domain, as the
    name can change. The SID is actually comprised of two parts: the first section
    identifies the domain that issued the SID, whereas the second part, called a relative
    security identifier (RID), is used to identify that object within the domain.


    > NOTE It''s never a good idea to thoughtlessly delete an account in Windows 2000.
    Since the security is predicated (fancy word for based) on the SID and not the
    actual account name, you will lose the assigned permissions and rights that included
    SID on the access control list (ACL). Instead of deleting, disable the account
    and change the name/password until the new user who is replacing the old one arrives,
    or when you are sure you can replicate the situation with another account or group.


    # The Security Descriptor


    Everything is an object in Windows 2000, and every object has a unique header,
    which is called a security descriptor (SD). SIDs define what access'
  merge: -1
  pgno: 224
- img_proc: true
  md: 'permissions a given object has, such as who can access it, what rights a user

    might have, and so forth.

    Important SD components include:


    **Owner security ID.** This what indicates the user or group who is the

    owner of the object. This owner can change the access permissions for the

    object, thus keeping him or herself from being blocked access to the object.


    **Discretionary access control list (DACL).** This ACL contains the users and

    groups who have been granted or denied particular access permis-

    sions. DACLs directly modifiable and under the control of the owner of

    the object.


    **System ACL.** For auditing purposes, the system uses the system ACL to

    gerate messages indicate who or what is accessing the object, and

    when. Unlike the previous ACLs, which are controlled by the owners,

    system ACLs are controlled by the system''s security administrators.


    # Security Access Tokens


    The user is issued, well, a “hallway pass” upon successful login called a secu-

    rity access token (SAT). It contains the RID/SID combination and a list

    of SIDs of groups that the user belongs to (at the time of login), and the

    privileges or rights the user possesses. If the user is added to a new group,
    or

    deleted from a group, the SAT is still valid as issued and the user will need
    to

    nout to realize the changes. This is a cause of much wailing and gnashing of

    teeth when users can''t get access to something, and all they needed to do was

    log out and log back in.


    # What Exactly Is Access Control List?


    ACLs are, well, a list of access control entries (ACEs) the system uses to look

    see who or what has access to that object, and grant or deny to individuals or

    groups specific access rights or permissions to the object, by specifying the

    particular SID.


    # The Access Control Entry


    ACEs are the items that populate the ACLs. Each ACE on an ACL includes an

    access mask, which defines all the possible actions for that particular object

    type. You can easily understand an access mask if you think of it as a menu of

    permissions, any of which can be explicitly denied or granted.'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# Built-In User Accounts


    The concept of a built-in account is more understandable in Windows products,
    since the system itself forces few accounts and groups that cannot be substantially
    altered or deleted, and any knucklehead who can edit or delete a text file as
    root can do both to the passwd file in Linux. Yet another reason not to give anyone
    root access, even on his or her own workstation!


    Built-in accounts include the Administrator account, the Guest account (which
    is disabled by default, and should remain so), and a few groups. These accounts
    and groups are there for a standard base-level set of actions and roles that Microsoft
    has chosen to anchor in the Windows 2000 system—a sort of idiot-proofing of the
    operating system.


    # UID/GID versus SID


    Some administrators/system admins are confused by the differences between Linux
    and Windows 2000 accounts IDs. The UID and GID in are very simple numbers, and
    they don''t go away when you delete the account. Deleting an account for someone
    who has left and then reinstating a different user in the departee''s place is
    easy in Linux, but dangerous and wasteful in Windows2000.


    Don''t delete Windows 2000 accounts unless you are sure the user and his job responsibilities/files
    are going away too. If not, and the user is going to be replaced, just disable
    the account and change the password. Then, when the new user comes along to fill
    that role, rename the account, reset the password, and the new user is fully in
    the same spot as the previous user.


    # Windows 2000 Groups


    Unlike Linux, which doesn''t allow any nesting of groups, or support such things
    as Global and Local groups, Windows 2000 has by comparison a full-featured, well,
    group of options...


    # Group Types


    There are two types of groups in Windows 2000:


    +   - **Security groups.** These are used to assign permissions to resources,
    but can also be used as an e-mail distribution list.


    +   **Distribution groups.** You can only use these to distribute e-mail, not
    to assign resources.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# 214 Chapter 9


    While you can use a Distribution group for just e-mail, a Security group is much
    more useful, as you can assign access to a resource to a group of people, and
    can also keep them up to date concerning that resource via the group.


    Due to the nature of Active Directory and how Distribution groups are identified
    on the system, some older or non-Active Directory-aware applications and services
    might not be able to see or use Distribution groups.


    # The Scope of a Group


    Each group in Windows 2000 can have not only a type but also a certain scope of
    operations or responsibility it encompasses. The advent of Active Directory introduces
    some changes in how groups are used and treated, but the underlying principle
    of using them to grant access to a resource hasn''t changed.


    **Global groups.** These contain groups accounts that need to be given permissions
    and rights to a resource. Global groups have a limited set of what can be placed
    in them. You can add Global groups from the local domain, and you can nest Global
    groups within each other. You can only place Global groups in Universal groups
    and in other domains'' Global groups in Native Mode of Active Directory.


    **Domain Local groups.** These are primarily used to assign access to resources
    in a local domain, and are similar to the Windows NT Global groups. Members of
    Domain Local groups can be user accounts, Active Directory Universal groups, and
    Global groups from any domain. Unlike Global groups, you cannot nest these groups,
    and you cannot add this scope of group to groups in other domains.


    **Universal groups.** These are unique to Active Directory and will not be available
    in any pre-Windows 2000 domain. Universal groups are a type of "macro" group that
    can be used to grant access to resources across domains. Membership of this scope
    of group can be just about anything, and they can be nested within other Universal
    groups and Domain groups in any domain for which you have administrative rights.


    # Local Groups


    Unlike the Active Directory and legacy domain groups we just discussed, a Local
    group exists only on a particular machine, such as a file server. If a server
    is a member of the AD domain, but not a domain controller, it will have Local
    groups on it, and you can use these as the final point of adding users to access
    resources. If it''s a domain controller, it won''t have an independent registry
    of users and group accounts to add/remove from, but will force you to use a Domain
    Local group.'
  merge: -1
