  md: 'Let’s take a sample line from the /etc/passwd file and demystify it.


    ```

    username:password:userid:groupid:comments:home/dir:logincommand

    ```


    **Username.** A (hopefully) unique name or identifier for that user, eight or
    alphanumeric characters long.


    **Password.** Either the user’s encrypted password or an “x” if the shadow suite
    is used.


    **User ID.** This must be a unique number that is assigned only to that user.
    Normal user accounts traditionally start before 500; for example, 501.


    **Group ID.** This ID is a number that reflects one of the groups in the /etc/group
    file. It’s used to assign group ownership to files and directories, and to allow
    that user to access resources that are restricted to that group.


    **Comments.** The user’s real name, a “pet” name for the user (remember that users
    can read the passwd file), or just about anything else you want to put in there.
    Yes, I have seen the password reflected in this field in some companies, a breathtaking
    example of poor security and understanding of how to run a system.


    **Home directory.** The user’s home or “drop” directory. This is where users will
    be allowed to enter the system, the first directory they will be “dropped” into
    after login. Normally, this will follow the “home/user-name” convention.


    **Login command.** Almost always the user’s specified/preferred shell. For point-of-sale
    applications or specialty use, this can be replaced with just anything that’s
    executable.


    # ## /etc/group File


    All Unix and Linux systems have users and groups of some kind. The user accounts
    are associated with at least one group, which makes it much easier to assign groups
    (pun intended) of users permissions to resources.


    # ## Managing by Group


    It’s been a standard rant of mine for many years that permission assignment by
