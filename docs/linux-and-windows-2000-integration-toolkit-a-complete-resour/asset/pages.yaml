    # What''s with All the Distributions?


    Outiders and those just coming into awareness of Linux need to understand how
    Linux can have so many different distributions and still not be fragmented. Although
    Linux is usually associated with some amount of Libertarianism or slight Socialism
    of being so vehemently free, it''s actually the most market driven by the Operating
    Systems. What, you don''t believe that? Darwin''s theory of the survival of the
    fittest is what drives the Linux distribution market relentlessly; if someone
    does a bad thing, they lose market share, it''s that simple!


    # Quit Complaining, It''s Free!


    First off, remember that all of GNU /Linux is free software. It''s freely available
    for everyone and everyone to modify, package, and sell, as long as they give credit
    to the writers, make the source code freely available (like from a Web site),
    and put all changes back into the code community with adequate documentation.


    # Switch Licensing to Support Budgets


    Secondly, the money that is usually made from proprietary licensing and upgrades
    is simply transferred over providing support via telephone or other options, training,
    and documentation by third parties. Linux itself is like the road, and we can
    take different routes to get what and where we please, depending on what we need
    to accomplish.'
