  md: '# Testing the Server for NIS Configuration on Your Domain Controller


    Let''s see if we have entered our map files correctly, and if the server is returning-data
    in a usable manner:


    +   1. Open a shell prompt/command prompt.


    +   2. Issue the following command to see if the server is functioning correctly:

    `ypcat -d yourdomain.com passwd`


    +   3. This will return the passwd file information from the NIS Server, and prove
    you are cooking with gas.


    +   4. Try the ypcat command with some of the other maps you have migrated to
    check if they return the results you were expecting.


    # Other NIS Command Line Utilities


    At this point, it''s useful to introduce the other two main utilities that can
    make your life a little easier:


    **Nisadmin.exe**. This utility is very useful for altering the configuration of
    your Server for NIS DC, synchronizing the data maps immediately and changing their
    role as the Slave or Master, plus the ability to control the state of the service
    itself.


    **Nism.exe**. When you need to add a map, or make a quick change to your AD contents
    for your NIS Domain, this is the tool to use. You can add, delete, alter, and
    set up map entries in AD, with a number of helpful options.


    Running these utilities with no arguments on the command line or the command with
    a "/?" after it will show the included help. These are very useful utilities and
    can make managing a server much easier on the ssh prompt or telnet command line.


    # What to Do after the Migration


    Once the appropriate maps are migrated over, it''s recommended that you either
    take the old (Linux/Unix) NIS Master offline or stop the NIS daemons. You don''t
    want all the clients to go to the wrong machine, do you?'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# Linux''s NIS and Microsoft''s Server for NIS 361


    Also, you will need to either use the same IP address and name for the new server
    or alter all the client configuration files, as they will be pointing to a defunct/missing
    server.


    Once the migration is finished, the Server for NIS on the Active Directory Domain
    Controller is the central authoritative NIS server on your domain. From that point
    on, you will need to administer the Server for NIS on the Domain Controller, which
    will make the changes in Active Directory. Essentially, you can administer the
    Server for NIS and its maps from anywhere with the appropriate command line utilities
    or the GUI admin.


    # Managing the Server for NIS


    The Server for NIS administration interfaces are two-fold: (1) the command tools
    mentioned earlier and (2) the Services for Unix Microsoft Management Console (MMC)
    plugin. Ordinarily, I merely tolerate the GUI interface (you probably have figured
    out by now!) and use the hook of the text mode utilities. However, I like the
    MMC interface, with its left-side focus pane and the right-side results pane.
    This makes for a more intuitive interface, and I applaud MS for getting this right.


    Remember, one of the interesting things about migrating NIS objects into Active
    Directory is the ability to have them propagated via AD mechanisms and to manage
    those and regular AD objects such as users, groups, and computers, all in the
    same interface.


    Lastly, take a good look at the Technet Knowledge Base articles that mention Services
    for Unix, particularly the Server for NIS and Username Mapping Service. When you
    run into little problems, most of them are listed there.


    # Summary


    This has been a very busy chapter, with almost everything working, but the problems
    that I—and many others—have had with the NIS Migration Wizard are unfortunate,
    but understandable, as this tool is not the highest selling product that Microsoft
    makes.


    Although I still experience a shiver and a bit of horror at the thought of running
    a Windows 2000 Active Directory DC as my NIS Master server, I can see some benefits,
    especially if you are trying to integrate Linux into your current Windows 2000
    network. You have to work and play well with the status quo, at least until you
    convince management of the viability of those Linux systems.'
