  md: '# # Introduction


    Welcome to the world of integration. It’s a weird world, filled with projects
    and clients, training and timelines. There’s nothing quite like doing a large-scale
    integration of two (or three, or four) Operating Systems. It’s especially fun
    when one of those is Linux, as it’s the most exciting OS development for a number
    of years.


    Long gone are the days when you only had to deal with a single operating system,
    wait, no Long gone are the days when you only had to deal with a single operating
    system, probably never to be seen again. It’s a “blended solutions” world now,
    and we as systems admins, engineers, and professionals have to blend our talents.


    I cut my teeth in the U.S. Army, in Air Defense and then the Signal Corps, learning
    about computers (really old ones, with the computing power of a Casio calculator
    watch) and getting my start in the world of IT. I progressed from there to hoc
    consulting and then, while in Minneapolis, I got my first big break at a law firm
    and my first integration/migration. We moved 600+ users from a matched brace of
    Wang VS systems to Wang 2MB, 386-16, Windows 3.0 PCs. I learned quickly that there
    was a lot more to integrate than just putting new machines; there were literally
    hundreds of items to check off, to make sure worked, and to fix them after they
    had been broken by the users or our team.


    I’ve worked for a lot of companies and on a lot of projects in between, and this
    is still of the most interesting (that’s the Chinese version of interesting, mind
    you) fields in Information Technology—it’s always changing and once you get a
    good set of skills for the tasks at hand, you can translate your knowledge into
    almost any system or situation that you can encounter.


    Most of the projects over the years were unparallel successes, and others sort
    of limped along, due to many factors. I’ve tried to put my experiences into'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    good use with this book, to help you out in any way I can, to not only avoid mistakes
    yourself, if possible, but to avoid situations that will cause you to fail, or
    not to be totally successful.


    I''ve definitely walked away from projects over the years, always in the assessment
    stage, after determining that a factor or set of them would cause the project
    to fail. As professional integrators, we have a responsibility not only to the
    client but also to ourselves.


    It''s been quite a few years since that migration, but the situation remains the
    same; you still have to plan carefully, fix the things that break, and try to
    bring things into budget and on time. And it still doesn''t work well most of
    the time! You''d think we have learned over the years, but there are still too
    many factors out of the integration staff''s control and under the operating system
    developers control.


    After a number of years in the trenches with Bryan Views, Lan Manager, OS/2, Network
    of many Windows NT, BSD, HP-UX, Solaris and SCO, Windows 2000, and Linux I found
    always elected to be the presenter in our technical groups, showed to the front
    because I could explain to management what we were trying to do, without getting
    overly defensive or mumbling. Finally, I discovered in a hands-class one day in
    Washingon, D.C. the real thing I wanted to do, and that was to help others learn
    what they needed to succeed in their own integration/migration projects and careers.


    I think that instructors and officers in the military are both at their best when
    they have been in the trenches or noncommissioned officers before they get promoted;
    it gives a sense of perspective and makes you humble, out of those ivory towers.


    College professors (no offense!) assume they are the final authority in their
    subjects, that the information goes one way, out of the Professor unto the huddled
    masses. I can speak for most Instructors, we know better than that. We have all
    attendees who know much more than we did, usually in a very focused way, whereas
    we try to bring things about our topics. I found an easy way to cope with knowledgeable(and
    sometimes-highly opinionated) attendees; you incorporate their knowledge into
    the presentation, keeping the focus and control, and use that knowledge to help
    everyone in the room. I jokingly call this situation the "Instructor Relay Agent"
    and it works well quite de.


    There''s nothing standing up in front of 20 to 50 people for a week and pouring
    out everything you can tell/teach/answer to give you a sense of perspective. Nothing
    like getting your evaluations back each week, and reading what people thought
    of the class—you, the materials, the break room, and sometimes random passersby.


    I''m a Director of Courseware Development and Instructors these days, working
    hard to get great courses out the door, to make the instructors lives'
