    ```


    Some other neat tricks for the lpr command include the number of copies:


    ```

    lpr -P printer -K10 myprintfile.doc

    ```


    Also neat is the capability to e-mail yourself when a job is finished printing:


    ```

    Lpr -P printer -m username@server.com myprintfile.doc

    ```


