- img_proc: true
  md: '# Consider Using DNS


    DNS is a well-known widely Internet standard for naming, registering resources,
    and it can also be used on private TCP/ networks. DNS names are constructed in
    a slightly different way than NetBIOS names are because the world of NetBIOS is
    as flat as a board, whereas DNS is a hierarchical, treelike structure. DNS computer
    names consist of several parts (or hierarchies), each of which is separated by
    a period.


    Another important consideration for moving to DNS naming is that NetBIOS names
    are limited to a maximum of 15 characters, while DNS names consist of at least
    three parts: a hostname, a domain, or zone and the TLD (top-level domain, com,net,
    etc.). When you combine the pieces of the DNS name, you get a hierarchical and
    logical location for that host. The complete DNS name of a host is referred to
    as a fully qualified domain name (FQDN) as “thewho.slashdot.org,” where the computer
    name is “thewho” and the domain name is “slashdot.org.” It’s possible to have
    more complex DNS names, such as “host1.research.linuxcertification.com,” where
    the name of the host is “host1,”research” is a subdomain or zone contained within
    the linuxcertification domain, and of course, the .com suffix is the TLD, right
    under the root of the whole structure.


    # DNS from a Historical Perspective


    If you are like me, you’ve probably read a book or two (or 20!) about DNS, worked
    with it in a production environment, and maybe have a decent understanding of
    it. However, a bit of historical perspective is needed. DNS was designed in 1984
    to solve escalating problems with the old name-to-address mapping system used
    on the Internet. The old system consisted of a single file, known as the host
    table, maintained by the Stanford Research Institute’s Network Information Center
    (SRI-NIC). As new hosts trickled in, SRI-NIC added to the table.


    Systems administrators would grab the newest version and update their domain name
    servers. However, as the Internet grew, the host table became unwieldy and clearly
    was not the most practical or effective way to update and distribute the information.


    # Understanding DNS Terms


    Because of the bleed-over between Microsoft’s use of certain terms and the original
    meanings in the Unix and open systems community, we should define a few of them
    before we get too much further. Table 8.1 compares Linux/Windows terms.'
  merge: -1
  pgno: 190
- img_proc: true
  md: '# Table 8.1 Linux/Windows Terms


    | LINUX TERM | WINDOWS TERM | WHAT THEY MEAN |

    |---|---|---|

    | domain | DNS domain | The logical entity or organization that represents a part
    of a network. Most often used to refer to an administrative or security boundary.
    The culprit in confusion between Microsoft and open systems was the NetBIOS domain
    name, or the clunky 16-character (15 for the name, 1 character for the hexadecimal
    service type) name that represented an administrative boundary they called a domain.
    |

    | domain name | domain name | Both systems use the "domain name" as a way of expressing
    the "domainname.com" portion of an FQDN. A "domain name" consists of a registered
    name, a "." (dot), and a top-level domain such as "net," "org," or "edu." Very
    commonly used interchangeably with the term "domain." |

    | host or node | computer | Anything that can load an IP stack and be pinged |

    | host name | DNS or host name | The hostname of that computer or client, as it
    pertains to the DNS Name System |

    | name server | DNS server | Linux and Unix mostly use the "name server" term
    to denote DNS servers (mostly because it only uses DNS for name resolution!).
    Microsoft has historically used "NetBIOS Name Server" for WINS, and "DNS Server"
    for a DNS Name Server. Both versions of the term that refer to DNS are a host
    that provides DNS services and maps DNS names to IP addresses |

    | resolve | resolve | The act of translating a DNS name into the matching IP address,
    so the client can begin communication with the target host |

    | resolver | client | A program or library routine that extracts DNS information
    from a name server |

    | reverse resolution | reverse lookup | The act of checking what domain and hostname
    is returned for the IP address that a host uses to connect to another host. Typically
    used for security purposes, and not very effectively at that.'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# The Structure of the Domain Name Space


    The DNS namespace a treelike structure that extends from the root of the Internet
    to its branches (domains), and then to its leaves (hosts). At each of the branching
    points (name servers), information is kept on the hosts and domains under that
    section of the tree. When a client (resolver) makes a query, it attempts to extract
    the needed information from the correct servers to satisfy its needs. For all
    its conceptual complexity, DNS is quite simple in its main function, to resolve
    names to IP addresses.


    There are any number of smaller networks that are connected together to make this
    massive network of networks. There are numerous explanations of how the Internet
    and domain names work; here is a pretty good whack at it, polished by many seminars
    and classroom discussions.


    # Resolvers


    On the bottom end of the IP address and naming food chain are the clients, called
    resolvers by those in the technical know, although most of them are referred to
    as “that darn computer,” or simply a client. These can be anything that needs
    to resolve a friendly name, either an unqualified one (a hostname example: womprat)
    or a qualified one (a FQDN example: womprat.sairinc.com) to an IP address.


    On these resolvers are usually Internet-related programs that contain bits of
    code that make up a software resolver. This code’s sole purpose is to take the
    friendly name that is entered and to query the configured name(s) for the resolution
    of that name to an IP address. Some specialized programs contain many full-featured
    resolvers, but the majority are very simple in their function.


    These hosts consist of client machines, servers, specialty resolvers, handheld
    devices, and many other types of requestors. They are the great unwashed, hoping
    to get a name resolved by one of the relatively fewer name servers.


    # Name Servers


    The word server is somewhat misleading. You don’t have to set aside an entire
    server for running your name resolution services. I usually refer to DNS as a
    server service or daemon. Name servers normally contain complete information for
    the areas where they are the authority. Think of an Authoritative name server
    as a stake in the ground that says, “This domain or namespace begins here!” Linux
    or Unix name servers contain their information in files on that machine’s local
    storage. This same sort of information can be on local storage or distributed
    into Active Directory as an object in Windows 2000.'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'Name servers are informed of each other by both the hierarchical nature of
    DNS and their configuration. If a server receives a request for a zone that is
    on another server, it can either forward directly to that server (if that server
    is known to it, or in its cache of resolved names), or give it a list of servers
    that are authoritative for that zone.


    Each name server contains information about its specific part of the Internet
    namespace, and has the capability to point to an upstream server, or to the 13
    root servers.


    Those 13 root servers only contain the information about the top-level domains,
    such as .com, .net, .edu, .org, and so forth. In addition to the root name servers,
    distributed around the United States and the world for redundancy, almost every
    country in the world has a name server. These name servers hold the information
    for the companies and organizations in that area of responsibility. Each of these
    name servers only contains enough information about the entire structure to make
    an educated guess about who can resolve names to addresses that it does not directly
    or indirectly know.


    The company and organization name servers hold the information about that domain
    and all subordinate domains. Therefore, hosts named "server.domain.net" and "hostname.domain.net"
    would be part of the same domain, but one is located in a subzone or subdomain
    of that domain, called "research."


    On your domain''s name server will reside the address, zone files, pointer records,
    and other specialized records that can resolve names, route mail, help load balance
    your Internet service servers, and many other things.


    Microsoft and Linux clients are easy to configure with name server information.
    DHCP is the preferred method, making massive amounts of client configuration changes
    at once with a single change to a file or scope.


    # DNS Server Types


    DNS Servers are fairly easy to set up, as you will see later on in this chapter,
    but you need to understand what type of Name Server you need, and where. The placement
    of a Caching server when you needed a Secondary will yield unpredictable and unfortunate
    results.


    # Primary Name Servers


    A primary server maintains its zone file (containing DNS records) on the local
    hard drive. If you add HOSTS, domains, or additional resource records, it is done
    on the primary server. Primary Name Servers hold the master copy of the zone files
    (the data used for name resolution) and they propagate that information to the
    Secondary Name Servers.'
