    # Specifying Multiple Files or Variables


    In addition to being able to execute multiple commands, you can often issue multiple
    filename arguments, or variables with a single command or utility. This is especially
    useful for looking at a number of files for some bit of information manually,
    or concatenating a series of files into one larger file.


    For example, if you wanted to see the contents of three different text files,
    you could use the following commands:


    ```

    cat *.txt This will show the contents of all files beginning with "file" and ending
    with ".txt"

    ```


    ```

    head file1.txt file2.txt file3.txt This will show you the first 10 lines of the
    specified by default.

    ```


    ```

    tail file1.txt file2.txt file3.txt This will show you the last 10 lines of the
    specified by default.

    ```


    Other useful commands include the "more" command, which shows you entire screens
    of data, and the "less" command, which allows scrolling and other commands, gives
    you so much, well, more than the "more" command.


    # Wildcards and Expressions


    Metacharacters or wildcards are often used to perform a particular action task
    with multiple files. Linux systems include support for several, including the
    most used, the asterisk (*) and question mark (?). The asterisk (*) takes the
    place of one to many characters. If you needed to see a number of files that ended
    in a particular extension, you could issue the following command to see all files
    that matched in that directory:


    ```

    $ ls -1 *.txt [ENTER]

    ```


    Perhaps you want to see all files that begin with a particular string, such as:


    ```

    $ ls -1 string* $ ls -1 string.*

    ```


    would show the same thing.


    If for some reason you wanted to see all the .txt and .exe files in a given directory,
    you would use the following command:


    ```

    $ ls -1 *.?x? [ENTER]

    ```'
