    # Extra Groups


    There will be a number of groups in the group file, most of them will be system
    groups such as the "bin," "daemon," "tty," and "wheel" groups. Never allow a normal
    user to be made a member of a system group; he or can possibly have full access
    to the system, creating havoc and much work on your part. Here is an example of
    an entry in the group file:


    ```

    username:password:groupID:usernames

    ```


    **GroupName.** A unique name of or fewer standard alphanumeric characters, often
    as descriptive as possible of the function the group performs.


    **Grouppasswd.** Normally, the installation routines will put an "x" in the password
    field, which indicates the use of shadow passwords, and is normally indicative
    of a blank password. This item isn''t normally used, and is mostly there to provide
    access to a group’s resources by allowing a user to enter the password and gain
    access.


    **GroupID.** A unique number that’s used by the system to identify the groups.
    The Users group is normally group 100, and all others traditionally start at 500
    and go upward in value


    **Users.** The users in that group by their account name, separated by a comma.


    # Oddities about Linux Groups


    A couple of things mentioning about Linux and its groups. When you create users,
    they should be at least members of the Users group, which would of course the
    group ID (GID) in their passwd entry. When those users create files and directories,
    the file system takes that group ID in their passwd entry and uses that to assign
    a group ownership to the object.


    If you have users who create files and no one else can access them, don’t have
    to change the user’s ownership of the object—that’s moving the problem around.
    You certainly don’t want to set the object so everyone in the world (or machine)
    can access it freely. If an object must be accessed by everyone in a given group,
    the trick is to use the chgrp command to make that object owned by the common
    group. By making all users who need'
