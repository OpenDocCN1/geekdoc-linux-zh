  md: '# Request for Comments


    On a regular basis, the IAB meets and reviews proposed changes to the Internet
    and TCP/IP that Internet Society members have submitted. Contrary to public perception,
    this committee does not develop the standards; they are responsible for coming
    to a consensus that meets the needs of all involved, if possible. This can take
    a considerable amount of time.


    Once the IAB reviews the RFCs, they are given one of the following classifications:


    +   - Required. Must be implemented by systems on the Internet.

    - Recommended. Should be implemented by systems on the Internet.

    - Elective. Can be implemented by systems on general use.

    - Limited Use. Not intended for general use.

    - Not Recommended. Historical, specialized, or experimental protocols that are
    not recommended for use by systems on the Internet.


    Once classified, the new standard is assigned an RFC number. In the interest of
    maintaining a trail of the evolution of a standard, the original RFCs are never
    updated; they are simply superseded by new ones. Some of the more popular ones
    have been superseded by a dozen or more that have followed.


    It''s very important to check if there is a current RFC on a particular topic,
    what other RFCs it obsotes, and the RFCs it draws upon for its supporting information.
