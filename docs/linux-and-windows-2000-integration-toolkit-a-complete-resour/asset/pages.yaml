  md: '![](img/7c4d65772d38b487e72eb8750e4f3691_306_0.png)


    # # Understanding the Active Directory Service


    This is the hard one, the toughie, the worst part of any integration. Trying to
    get NIS and Active Directory to work together is doable if you want to use Microsoft''s
    method to accomplish it. If you don''t want to use a proprietary solution, several
    methodologies will get you acceptable results. We''ll look at Active Directory
    in detail in this chapter—its features, setup, and configuration and management.


    # ## Overview of Active Directory


    If you listen to the boosters, Active Directory is the best thing to hit the directory
    services (DS) arena since sliced bread, or even the wheel! It''s a great product,
    but suffers from a great deal of complexity when implementing it on large-scale
    networks.


    My experience with Active Directory is fairly broad, and mostly positive. It installs
    easily, but scales rather grudgingly. It''s essential to fully determine if your
    organization really needs AD, or will a “lesser” directory service be more appropriate?'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# Active Directory in a Nutshell


    Active Directory can be summed up in one sentence: It is a hierarchical, DNS-like
    directory service that is scalable, flexible, and manageable. AD is very much
    dependent on based on DNS (Domain Name Service), and won''t run without a properly
    configured DNS server somewhere within reach. You can possibly use a non-Microsoft
    DNS Server as the basis of Active Directory, but it''s extremely unlikely you
    would want to do that. I can''t imagine the amount of troubleshooting and issues
    that would possibly present themselves ever worth it. You won''t save any money
    because you have to win Windows 2000 Server to get Active Directory, and the Microsoft
    DNS Server come with Windows 2000 Server and higher.


    # Brand New, but Backward Compatible


    In comparison to the NT 4.0 Directory Service (which wasn''t really a proper directory
    service, a flat domain with entries in it), Active Directory appears to be almost
    magic in its abilities and scope. While it''s different in many aspects, Microsoft
    knew better than to make incompatible with previous iterations of Microsoft directory
    services. In fact, it seemed to forget to get Active Directory and Windows 2000
    ready for market, and much of that time must have been spent on backward compatibility.


    Some of the backward-compatibility features for embracing the NT 4.x legacy systems
    include:


    +   * Single network logon

    * Single point of administration and replication

    * Full integration with the Windows 2000

    * Encasing the NT 4.0 functions in Active Directory


    Having pushed up the compatibility features of Active Directory, let''s be fair
    and not just about how it interfaces and handles the older systems. After all,
    the whole point to go with Active Directory is the lack of flexibility and scalability
    of the previous NT Directory Services.


    # Active Directory Features


    Here are some of the features that set Active Directory apart from NT''s DS, focusing
    on the things that can ensure prospective implementers that it can do what it''s
    purported to do.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Understanding the Active Directory Service 295


    Built using Internet standards. To Microsoft''s credit, Active Directory was built
    not from the ashes of NTDS, but from the ground up, encompassing and using Internet-standard
    technologies. It''s much more secure than NTDS, and its object-oriented nature
    helps distribute, partition, and replicate those objects where they are most needed
    and without undue bandwidth-use.


    Scalable and flexible. Active Directory has been designed to work well out of
    the box in installations ranging from small single-server businesses with a couple
    of hundred objects to huge corporate behemoths with thousands of objects in the
    database.


    Replication. Active Directory''s information is stored on domain controllers and
    replicated by sending the changes to the database. It''s also very controllable
    using sites and replication partners, which allows the administrator to decide
    and implement different bandwidth use options.


    The whole idea of moving yet another directory service is repugnant to many organizations,
    some of which have just gotten NTDS and Windows NT stable. Keep in mind that all
    of Microsoft is focused on "encouraging" to take full advantage of Active Directory,
    and moving as much of your organization to Windows 2000 and XP as possible.


    Having said that, many organizations are realizing definite gains in management
    of their servers and environments by implementing Active Directory in their environment,
    and it will only get better from the present. On the other side of the coin, some
    organizations will treat it like a plague and keep running NT 4.x for a while,
    waiting on the settlement talks, XP''s future, and whatever is happening with
    .Net.


    # Do We Really Need a Directory Service?


    This question is difficult to answer for all organizations. Many don''t use any
    sort of unified directory other than a DNS server, and there are many companies
    that don''t use any sort of name resolution other than broadcasting for NetBIOS
    and IP addresses (This is referred to as "Spray and Pray Resolution" among the
    most jaded of integrators).


    The whole concept of using a directory service is born of the need to resolve
    hostnames to IP addresses across an enterprise, hopefully without having to statically
    assign all addresses and type in matching names by hand. This is the functional
    equivalent of what our parents told us about having walk to school in 8 feet of
    snow, uphill both ways! Static name resolution is only for the smallest or most
    budget-challenged outfits.'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# Chapter 12


    One of the IDC/Gartner Group think tank did a study that said the typical larger
    company had 20 or more directory services to try to integrate! I''ve been there,
    tried along with everyone else, and been successful to a degree, but there''s
    a lot of wasted effort in situations such as that.


    Companies don''t implement an enterprise-wide unified directory service to make
    life easier; the needs to provide better security, increase flexibility, and centrality
    important data can be even more important. One of my favorite quotes about this
    situation is from the CFO of a large pacemaker manufacturer in the 1980s, who
    said: "Oh yes, I contribute to the XXXX Consulting Group, they''re my favorite
    charity." It can be very expensive to do the planning for a Directory Services
    conversion or initial rollout, much less the actual implementation.


    Done properly, a smooth-functioning directory service can serve double duty as
    an e-mail distribution list repository, a Human Resources Employee database, a
    security access database, and many other things that make decentralized use of
    a central source of data.


    On the networking side, your enterprise directory service performs a critical
    role in setting, managing, and enforcing your corporate policies that affect your
    network traffic, your use of bandwidth, and access to your corporate data.


    # Key Points that Make a Directory Service Worthwhile


    In the search for the perfect directory service, there are some key items that
    are agreed upon as being necessary for a directory to support, such as:


    **Increased security.** DS administrators use the integrated tools such as the
    MMC and its snap-tools to do all tasks. The single point of administration keeps
    security holes to a minimum. Using the MMC tools makes for a better integrated
    picture of security for administrators.


    **Account info distribution.** Key to the network''s performance is getting client
    hosts authenticated and routed to the correct servers. The use of record serial
    numbers and incremental replication help ease the bandwith load, while Global
    Catalog servers in strategic locations make for quick logins.


    **Granularity of administration.** The use of Global Policies and increased levels
    of permissions help busy administrators redistribute the administration to decentralized
    hubs.


    **Protection of resources.** The advent of Global Policies allows for almost total
    predictability of the user''s login and computer environment, using layered policies
    to cover all areas with appropriate legal and procedural rules.'
