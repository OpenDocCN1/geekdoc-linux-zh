  md: '# Troubleshooting DNS


    Nslookup is your buddy, pal and best friend all rolled rolled up in one. It and
    the "dig" tool are how much of the testing and troubleshooting get done in Linux,
    while nslookup alone is used in Windows 2000, there being no real equivalent for
    dig.


    # NSLOOKUP


    When an administrator installed NT 4.0''s DNS Server, the best way to check that
    the server was functional was to run the NSLOOKUP.exe utility. It is an old standard
    in Unix/Linux, but it has some wonderful options that will help savvy Windows
    2000 administrators keep ahead of the problems that come along with installing
    production DNS boxes.


    NSLOOKUP uses a command-line interface (known as "The Dark Place") to those young
    to have never used a DOS machine) and can give you a wealth of important and valuable
    information about your zones. Most admins will use NSLOOKUP instead of the previously
    mentioned automated monitoring because of the configuration options possible and
    the interactivity of using the command line.


    Once you have installed and configured Windows 2000 DNS Server, you can simply
    open a command prompt, type NSLOOKUP, and press Enter. If you get a response from
    the configured DNS server and the IP address of that server, you are in business!


    # NSLOOKUP for ADD Sufferers


    To check your host for configuration problems:


    +   1. Open a command-line session, whichever OS you are on.

    2. You should get a prompt with the name and IP address of the name server immediately
    after. If you do not, there is a configuration problem.

    3. If you get a name server prompt, type the name of a host you know exists, to
    check for full functionality, or enter the FQDN of your DNS server and inspect
    the reply. You should get a query reply that looks very similar to the initial
    NSLOOKUP query.


    To get more information about NSLOOKUP and its options:


    +   1. Type "Help," and press Enter. Inspect the output.

    2. You can set your server to other than the default to check other servers’ configurations.
    Also very useful is the ability to see just the records that are staticially entered.'
