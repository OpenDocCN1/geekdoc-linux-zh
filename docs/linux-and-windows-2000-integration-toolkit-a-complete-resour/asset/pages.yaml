    format is not readable to the computer, which at the lowest level understands
    information as a series of ones (1) and zeros (0). Known as binary, it’s an absolute
    method of determining what addresses are. In the lexicon of bits, a “1” indicates
    a bit that is turned on, while a “0” indicates a bit that is turned off. If you
    have ever been in a locale where the light switches have a 1 and a 0 on them to
    denote “On” and “Off,” it’s the same thing. In most cases, it’s sufficient to
    use the dotted decimal numbers for addressing and subnetting, a particularly thorny
    issue or problem might cause the troubleshooting staff to dive for the nearest
    whiteboard or HP 12c for a round of “bit-twiddling.”


    In those instances forced to convert from dotted decimal to binary, you can use
    Figure 4.2 to understand the process. When an IP address is represented as dotted
    decimal format, such as 192.168.33.134, each set of these numbers ending with
    a period is represented by (or represents) 8 bits. Thus, an entire address consists
    of four sets of 8 bits, or 32 bits total. Converting to binary is best done on
    an octet-by-octet basis, assigning every bit in the octet a particular decimal
    value.


    For example, let’s take the first octet and convert it to binary. The number 192
    is arrived at by turning, “on” the 128 bit and the 64 bit. When you add these
    bit values, they make 192. All the rest of the bits are still there; they don’t
    show any values.


    | 1 | 1 | 0 | 0 | 0 | 0 | 0 | 0 |

    | 128+ | 64+ | 0+ | 0+ | 0+ | 0+ | 0+ = 192 |


    Now, you move to the next octet, the 168, and it gets a little more interesting.
    The pattern that makes 168 is shown here:


    | 1 | 0 | 1 | 0 | 1 | 0 | 0 | 0 |

    | 128+ | 0+ | 32+ | 0+ | 8+ | 0+ | 0+ = 168 |'
