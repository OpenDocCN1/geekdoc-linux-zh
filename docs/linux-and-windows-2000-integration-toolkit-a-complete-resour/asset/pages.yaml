- img_proc: true
  md: 'Panel Settings. Settings comprising many animation types, button look and feel,
    size of buttons, and movement of items on the panel. Of special note is the Panel
    selection, and the Miscellaneous tab, which among other things you lets select
    the equivalent of the Windows Key, in this case, causing the Foot Button to pop
    up whenever Ctrl+Esc is pressed. Also, for those who really like a run dialog
    (Me! Me!), the default is set to Ctrl+Shift+R. A very handy key sequence to know,
    as I use the Ctrl+Esc, R sequence in Windows incessantly.


    Screensaver. This section is pretty much self-explanatory; you will be able to
    choose from any number of amusing (and quite odd) screensavers that will eat up
    precious processor and memory resources on a server, but can serve as a handy
    tool for a workstation.


    Theme Selector. This section opens up a whole world of possibilities for your
    GUI look and feel. Experiment with setting your Control Center, Panels, and other
    menus to look like Swiss Cheese, an Iceberg, or Brushed Steel. You can obtain
    and install new themes using the button, if it works, or visit www.themes.org
    for a full set of available themes and tools to install, recover and manage them.


    Window Manager. You need to exercise some caution. You can, of course, change
    your default Window Manager here, and also get into the current one''s configuration.
    Some changes are best left to the wrapper settings that the desktop environment
    provides. Many user have hosed his or her by changing too much here and not being
    able to get things back to usable. Note: You can also change your Window Manager
    on the login screen.


    Default Editor. Very self-explanatory. Running the different choices in a Term
    window, and then pick the one you prefer. One irritating error that can plague
    newbies when they try to use the GUI to invoke an editor on a text file, or right-click
    and choose Edit, and an error dialog pops informing them that that application
    couldn''t be invoked. This might derive from the default editor being set to Emacs,
    which is an optional package. Try setting it to VI, or Joe, or even (careful!)
    Pico.


    Mime Types. This refers to the mapping between the type or extension of a file
    and when certain actions are invoked or used when performed on the file. The Windows
    side of the house calls this File Associations, and they are set in the Windows
    Explorer by clicking on a type file and choosing what application to open it with,
    that time or for all time.


    URL Handlers. Somewhat self-explanatory, in that when you select a URL, you can
    choose which application or browser is used, depending on what the type of URL
    is. You could easily open an FTP:// with the browser, a special graphical FTP
    client such as ''ftp,'' or even feed that to a command-line session.'
