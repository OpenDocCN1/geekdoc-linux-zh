    # Executing Multiple Commands on One Line


    Another situation that often occurs for the experienced Linux administrator is
    having to run several utilities on the same command line. The reasons stretch
    from "gee, that''s cool" to a need to run various commands in a certain way to
    produce output, but they don''t need to be chained together like we say in our
    section concerning redirection of data.


    Executing multiple commands makes sense when input from one program is not needed
    directly by another, but instead need to be committed to a file, then read, parsed,
    or otherwise used. A good example would be the following commands, which search
    the system for the current users, direct that output to a file, and then search
    the file for a particular user:


    ```

    who > users.txt;grep users.txt bob

    ```


    You separate the commands with a "; semicolon character. The first will execute,
    then the next, and so on order. You can tell the commands occur in order, the
    users.txt file didn''t exist until you ran the preceding com-'
