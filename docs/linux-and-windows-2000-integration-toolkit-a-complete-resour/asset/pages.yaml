  md: 'System, User, and Group Administration


    # GUI User and Group Management


    Both Operating Systems offer GUI options for managing users and groups, offering
    an easy way to add a user or two. Linux''s methods are a little, um, rustic, while
    Windows 2000 offers the most visually appealing and organized GUI for this task.


    # Linux Options


    If you are going to use the GUI tools to add users in Linux, at least understand
    why it is not such a good idea! Many times there will be an error, or text output
    from an action that is not represented or handled right by such tools as Linuxconf.
    This causes problems for the Linux administrator; you end up looking at the error
    logs multiple times, and generally resorting to the CLI tools sooner or later.
    Having such dire forebodings of disaster, I will now show you how to use the GUI
    tools.


    Linuxconf. It''s installed and available by default in the majority of distributions
    (see Figure 9.1). Although it''s maligned (even by me) and thorny at times, Linuxconf
    is darn useful, especially for those arcane things that even hardened shells have
    forgotten My general rule is that if the particular machine happens to be running
    X when I need to do something, I will give it a whack in Linuxconf, and switch
    to the shell if it doesn''t work or if something happens to clue me to a problem.
    If I am working on a serve—those don''t normally run the X Window environment
    for performance purposes—I always use the shell to get things done. You can visit
    the Linux site at www.solucorp.qc.ca/linuxconf/


    COAS. Caldera''s delivery to machine management, COAS works well, performing many
    of the functions that Linuxconf and other tools do, and looks very good during
    it! Caldera is at this busy incorporating bits and pieces of SCO Unix into its
    offerings, so we expect to see more management tools, such as Volution coming
    out soon.


    Drakconf. Mandrake''s easy installation and multitude of tools makes a hands-down
    favorite for new users, and draws a lot ire from the greyboards for being “too”
    graphical (see Figure 9.2). Nevertheless, Drakconf is a nicely designed tool and
