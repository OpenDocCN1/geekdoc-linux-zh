    ```

    /usr/local/samba/bin/smbpasswd -a username

    ```


    The program will ask for the password and ask for confirmation. After this point,
    the user should have access to private shares, such as his or her home directory,
    from any system—Linux or Windows.


    # Configuring Linux Clients to Access Windows 2000 Shares


    Two methods are available to access Windows 2000 shares from a Linux client: to
    browse the share in an FTP-like environment using "smclient," or to mount the
    share and access as if it were a local filesystem.


    The first method—using smclient—is fairly intuitive to someone who uses a command-line
    FTP client regularly. To connect to a share, type:


    ```

    smclient //server/share -U username <enter>

    ```


    After asking for the password, the client will connect to the Windows 2000 share
    and present you with a prompt. Usage here is similar to FTP, except the client
    does not need to be told how to transfer files in (binary or ASCII). Explore directories
    with the “cd” command, list files with the “ls” or “dir” commands, and transfer
    files with the “put” and “get” commands. For a full list of the commands available
    in smclient and their usage, use the “help” command.


    By far, the simplest method of accessing Windows 2000 shares is by using the “mount”
    command, specifying the smbfs filesystem, and browsing them as if they were local
    filesystems. This is most easily accomplished like so:


    ```

    mount -t smbfs //server/share /mnt/point -o username=bill password=bogus

    ```


    Once mounted, simply change to the /mnt/point directory and browse the shares.
    Shares can be added to the /etc/fstab file as well, to simplify mounting shares.


    Additionally, you may have to set a particular bit on the smbmount program to
    mount the filesystem as a normal user. This doesn’t affect all systems, but it
    happens often enough to mention.


    If logging in as a normal user (you shouldn’t use root—bad sysadmin) you might
    be unable to mount the remote Windows filesystem through the'
