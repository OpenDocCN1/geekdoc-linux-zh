    # Using the Sudo Command


    You might be asking yourself right now, "What is Sudo?" Sudo is a program that
    you install will allow you (or the system administrator) to edit a file and give
    certain users the right to run specific commands as the root user.


    Some confusion about the sudo command exists: does it allow any user in the sudoers
    file to run among on the system? If I want to crack a system, is that all I have
    to do, edit that file? No, sudo is for allowing certain users to do very specific
    tasks, such as:


    +   * Edit the /etc/groups file to add users to a group.

    * Edit the hosts.allow and hosts.deny files to allow certain users to access services
    on a given machine.

    * Edit the message-of-the-day files to post the latest news to all users.

    * Many other single tasks that require special access, for which you don''t want
    the user to have the root password.


    Sudo is better than the su command in many cases because it is logged; all commands
    and access are logged for later perusal. Because you can set certain users to
    only be able to accomplish a single or several commands, you are more secure than
    giving them the ability to become the root. I usually refer to this as the "trust
    but verify" method of letting users do things you don''t want to fool endlessly.


