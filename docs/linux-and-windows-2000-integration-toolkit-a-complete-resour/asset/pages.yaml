    # Graphical User Environments


    The purpose of this chapter is to compare and contrast the single Windows 2000
    GUI with the large number of possible options on the Linux side to help the migrating
    administrator understand what the graphical user interface (GUI) is useful for,
    when to use it, and most importantly, not when to use or load it at all.


    # Who Really Cares about the GUI?


    Those who are entering the integration arena from a purely Windows standpoint
    should understand that while Windows NT and Windows 2000''s design mandates they
    can only be fully operational when in GUI mode, Linux and Unix are designed to
    use the GUI as an add-on, and not to require the GUI at all for some functions.


    Some of reading this will probably conclude from this section that I am leaning
    towards Linux and its implementation of a GUI, and you are probably correct. The
    two systems, Windows 2000 and Linux, both have a graphical user interface, but
    the real difference lies in the ability to change the options of those GUIs. Linux
    has a tremendous set of possible desktops, window managers, and themes; enough
    to make even the most picky user happy. Windows'
