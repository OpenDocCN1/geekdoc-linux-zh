    # How Linux Handles Ownership


    When you create a file in Linux, you are the owner of that file, and the group
    that is the owner of the file is also attached to that file. Unlike in Windows
    2000, there is always ownership of a group for a file or directory object. Since
    Linux breaks its permissions up to Read, Write, and Execute (RWX) for the Owner,
    the Group, and The World, or everyone, it’s imperative that the group ownership
    exists.


    What’s interesting about Linux’s use of the group for file ownership is where
    it gets the group for that! When you create a user account, there is both a UID
    for the User ID and a GID for the Group ID that is entered. Think of this as the
    default group for all users; all other group membership is set in the /etc/group
    file by adding the username to right line for membership in that particular group.'
