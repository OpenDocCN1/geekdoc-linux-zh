    # # Why Integrate Linux and Windows 2000?


    This chapter focuses on the soft side of the integration process. In it, I attempt
    to lead you down the path of why you should consider integrating Linux and Windows
    2000 products, instead of the ever-popular and very disruptive “casting out of
    the unbelievers.” I refer of course to the slash-and-burn school of introducing
    new products, in which all the existing systems are thrown out or converted fully
    to the new system, and most of the support staff is converted also, or let go.


    # ## Why Businesses Should Integrate


    Many businesses would love to toss out their existing systems and start over.
    There isn''t much chance of this, except for new companies starting up, or a much
    smaller business unit being integrated into an existing corporate behemoth. Even
    businesses that have an older systems architecture realize that there is decided
    value in that system, as long as it has been working and still does much of the
    job presented.


    It''s very important to consider how businesses get where they are. No-architecture
    springs to life fully installed and operating, unless in a technical'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'nocturnal dream. There is a real value attached to the systems installed in
    a corporation, and when you introduce new platforms and protocols, the need exists
    to tie these systems together. Forklift upgrades may be immensely satisfying,
    but rarely are they shining examples of fiduciary responsibility.


    A truly good integration will accomplish the respecting and valuing of an existing
    system while adding new capabilities and functionality by the addition of any
    of a number of choices of platforms, protocols, and applications.


    # # What about All Legacy Data?


    In any Information business, there exists data that represents the majority of
    the value held for that business. Even companies that produce products that are
    made of atoms (as opposed to bits) have a lot of historical data about customers''
    orders, shipments, and payments. Too many an integration of systems will ignore
    what to do with the old (current) data. What about an accounting and auditing
    firm that does a lot of work each year? How could they do business and keep its
    doors open when its data from years past is inaccessible, or involves many steps
    to access that data?


    In some cases, it''s possible to convert that data into another newer and more
    full-featured system. Imagine leaving all your old e-mail behind, having no idea
    who sent what and when? (Of course, when most people'' computers crash, they get
    to do that!) It makes much more sense to have historical data when it pertains
    to current customers or years that are open to audit by the IRS.


    There does come a time when it''s necessary to retire a costly-to-maintain system.
    Often it''s a host-based system that (I refer to mainframe mine systems when I
    use the word "host.") Due to major advancements and enhancements in reliability,
    replacement by Client/Server systems is considered safe and prudent. Client/Server
    is only considered a viable alternative to mainframes when the business benefits
    of the mainframe system no longer justifies its costs.


    I have involved in several projects where an older business system was completely
    reengineered into a Client/Server solution (in most cases, successfully). There
    still exists a significant risk and the possibility of failure. Remember, no matter
    how good your intentions, things can still go wrong, or become too difficult or
    too costly to solve completely. I heartily recommend assessing the risks involved
    in converting data against the potential cost of the conversion, and the access
    to the data in an online manner is necessary. If not, then it can be safely archived,
    or pressed to a series of CD-ROMs, DVDs, or tape media.'
  merge: -1
  pgno: 15
