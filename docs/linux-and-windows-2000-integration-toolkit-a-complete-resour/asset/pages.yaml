    # # Linux and Its Shells


    Linux and Unix share a lot of commonality in the area of shells. A shell is a
    command-line interface, scripting container, repository of internal (in memory)
    commands, and much more. Linux’s shells are command-line interpreters that take
    user commands, filter data for variables and other exceptions and keywords, then
    pass control to the operating system to authenticate and execute the commands.
    Some confusion about the role of the shell is inherent in Linux’s structure. Linux
    itself is the kernel, not the host of other programs that are almost always included
    in the distribution.


    Some sysadmins are religious about what shell they use, preferring the Korn Shell
    to the Bash or Bourne Again Shell, named after the creator of the first interactive
    shell for Unix, Stephen Bourne.


    For the sake of sanity, and a certain amount of brevity, let’s understand Linux’s
    use of shells better through the Bash shell. It’s the most common, and a very
    good place to start.


    Although anyone could and sometimes create shells, (Ross’s Awesome Shell, yep,
    RASH) it’s important to understand the real function of the shell be a simple
    interface to type commands into and view output. Shells should support the user’s
    ability to script common tasks and to manipulate data. Many a task for a Linux
    system administrator is made up of many small and varied programs interacting
    with one another in a series of inputs and outputs.'
