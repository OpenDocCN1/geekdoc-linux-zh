    # Naming Questions to Ask Yourself


    A few recommendations about naming are in order; these being a list of the situations
    you might want to consider will affect or be affected by your naming choices.


    +   * Is there an adequate existing name structure?

    * Can you integrate the names without suffering from schizophrenia?

