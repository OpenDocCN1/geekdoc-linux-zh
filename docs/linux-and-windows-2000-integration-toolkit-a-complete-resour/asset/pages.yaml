- img_proc: true
  md: '# Desktops


    The computer press really likes a good war. First we had the Operating System
    War, then the Spreadsheet War, then the Office Suite War, now the Server War,
    and then lately in the Linux world, the GNOME versus KDE Desktop Yawn.


    I submit the opinion that other than selling computer magazines and newspapers,
    and giving the various pundits and waged things to talk about, there isn''t a
    war going on about who likes KDE or GNOME—some use one and some the other. Admitted,
    the formation of the GNOME Foundation, including such technically “closed-source
    organizations as Sun Microsystems, did touch off a little uproar from the KDE
    crowds. For the most part, though, they formed the KDE League and have run a series
    of articles that seek to better inform users as why you would run KDE. Officially,
    I am desktop agnostic, and privately: I use the GNOME desktop, but only because
    KDE reminds me way too much of Windows 95/98. Lately, though, I have been looking
    at the anti-aliased KDE 2.2x desktop with a certain amount of fondness, especially-wise
    when using a desktop publishing tool.


    Regardless of which you choose, the different desktops seek to provide a full-featured
    user environment as possible. Both the major desktops have budding office suites,
    lots of similar graphics and sound applications, and the usual crop of games and
    utilities, including some tools that are written for both desktops, just different
    binaries to download, or source code to compile.


    # Themes


    One of the cool things that makes working with highly configurable software a
    pleasure is the ability to use themes that can change nearly every aspect or component
    of your graphical environment. Visit the Themes.org Web site and not only will
    you find scripts to help you install themes, thousands of varied and visually
    pleasing themes, but a great list of the different Window Managers that are supported,
    or support themes, whichever way you look at it.


    # The Desktop Competition


    There used to be only the K desktop environment, or KDE in the Linux desktop space.
    Some of the older distributions, such as Caldera and Slackware, provided their
    users with the option to install and use the KDE desktop. Initially, there only
    a few Window Managers from which to choose, all of them looked very similar to
    Windows 95, and it took an observant user to notice a glance that it was really
    Linux. Your author and his compatriots used to love'
  merge: -1
  pgno: 149
- img_proc: true
  md: '# Graphical User Environments 137


    to swap out gullible coworkers'' Windows desktops with early versions of Caldera
    with similar color schemes and background wallpaper. KDE has grown immeasurably
    in features and capabilities, and is currently in the 2.x series. Full anti-aliasing
    support is here here, which brings Linux graphics abilities to nearly a par with
    Windows.


    The GNU Network Object Model Environment (GNOME) desktop was started by Manuel
    D''Icaza, a brilliant programmer from Mexico, as a way to provide a completely
    free and open-source alternative to the KDE desktop. Admitedly, the only part
    of the KDE desktop that were distributed by TrollTch, and although most users
    wouldn''t have to pay a dime, the possibility of having complications was enough
    to cause a second desktop to blossom in the Linux space.


    This brings up the subject of competing anything in Linux, and why there is a
    war going on. It''s not a surprise to any of us who have been around Linux and
    even Unix for a few years, or a lot of years, that there are competing desktops,
    application suites and feature-based race that allows those who feel very strong
    about a particular method to try sway others to follow, support, and develop applications
    for that method. So be it. If developers take issue with something that is done
    in a certain way in a program, project, or even operating system, then they have
    the complete freedom to branch the code right there and go for what they believe
    in and want to accomplish. This was the general idea behind the GNOME desktop.


    # Logging on to a Linux Desktop


    When you start a Linux machine that has X installed, and the /etc/initab reflects
    a default runlevel will cause the machine to present a GUI for the user to log
    in, and you are ready to experience the machine.


    I am using the GNOME login as an example, but you can easily switch to another
    desktop or Window Manager at the screen shown in Figure 6.6.


    To change to KDE:


    +   1. Click on the Session menu.

    2. Select the KDE menu item.

    3. Click in the Login: dialog and enter your username.

    4. Enter your password when prompted.


    > NOTE If this doesn''t work, you need to enter your login name first, then do
    the preceding steps. This seems to anchor the selection on some systems.'
