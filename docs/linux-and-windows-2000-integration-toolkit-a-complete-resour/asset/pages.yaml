    # # An Introduction to Windows 2000


    Windows 2000 is Microsoft''s most aggressive (and most delayed) effort in developing
    a truly enterprise level operating system. Windows 2000 will eventually offer
    all support for businesses of all sizes, from home offices to the really large
    environments. Microsoft seems to have learned from some of its mistakes in the
    past, and taken a more robust approach to expanding the operating system''s capabilities
    overall, but especially for the enterprise, Windows 2000 runs on nearly all types
    of hardware, and its improvements include the user interface, overall functionality,
    management and monitoring tools, and lastly it is remarkably stable, especially
    compared to Windows NT 4.0.


    To oblige a wide variety of business needs, Microsoft offers multiple targeted
    versions of Windows 2000, each with its own distinct set of advantages. One key
    to Windows 2000''s success, at least to the author, is that all the different
    versions (Ok, distributions) share common drivers and support techniques. This
    combined with the new features and technologies you have some that potentially
    benefits everyone from the user to the support staff to the management of the
    organization.


    # # What? Another New Interface?


    While may be initially very similar to the previous versions of Windows, you will
    soon find some important and somewhat puzzling differences. Start it up, and you
    still see a Windows desktop with usual icons such as My Computer, and My Documents.
    You will soon notice the My Network Places and the snazzy new Recycling Bin. Does
    anyone feel lousy yet? Thank heavens the Start menu and taskbar are in the usual
    places, though they have hidden the Windows Explorer in the Accessories menu!
    After some initial confusion, I found it and then thought of a better place to
    store it, the Recycle Bin ...


    Let''s take a serious look at some of the new functions and tools we can use to
    manage this operating system.


    # # Internet Explorer 5.0


    Ok, so you can easily download Internet Explorer 5.0 (IE) and apply it to your
    Windows 9X or Windows NT 4.0 computer, Windows 2000 loads automatically. Microsoft
    has achieved a more complete integration of IE to the rest of Windows 2000, which
    means some new functions and enhancements need to be explored to fully exploit
    Windows 2000.'
