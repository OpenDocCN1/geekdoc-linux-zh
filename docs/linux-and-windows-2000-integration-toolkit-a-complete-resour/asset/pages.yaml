  md: '# X Window Servers


    This is an area that can induce the type of confusion usually relegated to explanations
    over cocktails of estate planning and tax law. The concept of where an X server
    and an X client is very hard for the average user to comprehend.


    There needs to be an X server wherever an X Display Manager shows graphics on
    a screen. When you want to run an X client, or an application, session needs to
    be hosted on an X server. Therefore, all machines that need to run and display
    an X session (be it local or remote) have to run a local X server.


    Take a look at Figure 6.5, and see where Application 1 is running on the local
    machine, hosted by the local X server, and is being displayed on the local screen.
    Then you see that Application 2 is actually hosted on another machine on the network,
    and through the local X server, it''s being displayed on the local screen. The
    same is true for Application 3; it''s not running on the local machine, just being
    displayed. There are also functioning X servers on the remote machines, accepting
    requests for the use of X applications.


    The X server runs on a machine and manages the physical display that is hooked
    to the machine. Various controls have use of the display, and accept and handle
    events from a particular physical display.


    X servers and clients communicate using the X11 protocol, which manipulates device
    drivers for drawing the graphics on the screen and managing


    ![](img/7c4d65772d38b487e72eb8750e4f3691_146_0.png)


    Figure 6.5 Local and remote X clients.'
