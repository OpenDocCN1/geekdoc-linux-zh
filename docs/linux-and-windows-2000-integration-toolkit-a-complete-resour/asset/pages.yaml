    ration for higher cost.


    You will have to buy the Client Access Licenses (CAL) for the terminal

    server users, which will drive the costs. You can achieve a terminal

    server with Linux, but it will be much more difficult; aren''t the types

    of software available for the Linux platform yet, but it makes sense

    sense. (Developers reading this will happily feel the need to code

    one for the Linux platform, thereby earning our gratitude.)


    Also, trickier than all the rest, will be the fact that you are utilizing the

    X protocols over a semigroup-speed line. X is very network intensive, and

    even the most gum-ho X maven will admit that 10 remote users and all

    associated traffic will be significant!


    Using Windows 2000 Terminal Server for remote desktop users. It causes

    no small amount of pay to say this will be the best option, given

    the constraints. Getting terminal access to a backend server running Terminal

    Server 2000 from a Windows desktop is a matter of gathering the costly

