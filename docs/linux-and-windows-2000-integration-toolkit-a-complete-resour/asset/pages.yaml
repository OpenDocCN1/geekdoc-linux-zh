  md: 'In the actual presentation:


    +   1. Dress Business Casual or better. Get all members of the project team to
    at least *iron* their clothing. Remember, you are dealing with *suits* here, not
    other technogegeeks.


    +   2. Have your spokesperson be on his or her feet and already in the most-expansive
    and greeting "Game" mode when attendees arrive.


    +   3. Meet everyone, have someone put names up, and don''t fumble their names.
    These people are supposedly important, they are the management team! Never actually
    fawn over them, but at least treat them like executives, and then revert to normal
    *after* they approve the project!


    +   4. Try to have the spokesperson answer all questions, unless someone asks
    a specific member of the team. By seating the team off to the side away from the
    table, if you even bring all of them to the meeting. Envision your co-workers;
    you know the ones who collect all Star Wars Phantom Menace action figures, and
    ask yourself if you really need their help in the presentation. Aren''t there
    some demons to kill -HUP, or first posts on Slashdot to accomplish?


    +   5. When asked one of those “So, when did you stop beating your sysadmins?”
    type of questions, acknowledge that person''s cleverness and reward him or by
    saying: “Great question, here''s how we planned to handle that.” Don''t punish
    question askers, that''s their job. If you have done your preparation right, they
    can''t bother you.


    +   6. Don''t turn everyone into glazed donuts by being overly technical.


    +   7. Be confident and give them a good show.


    # Milestone 3: Labs and Pilots


    Ok, so the presentation went well, the project is approved, your budget is bloated
    and floating, and all is well. Time to earn some of that good feeling with your
    integration labs and pilots.


    # Step 8. Lab Test all Solutions


    So many companies regrettably forget or decide to forgo the integration lab stage.
    Many a problem could be found and corrected in this stage, saving untold embarrassment
    and delays later.


    Dedicating some resources to an integration lab or incubation environment can
    solve many problems beforehand and tighten up your knowledge of exactly what is
    needed, so your changes don''t negatively impact your production systems. Exactly
    how many computers do you need in a testing lab?'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'Experience suggests that at least one of each major and minor type computer
    in the company would be a great place to start. I consulted on one integration
    project where management decided to forgo a lab from "extra" machines and managed
    to finish a complete stopper before the actual rollout commenced. The older HP
    Vectra 466E machines were totally incompatible with NT 4.0, which came comprised
    40 percent of the total targeted desktops. You will want to find out things like
    this before you have to stand on the carpet and explain why your team didn''t
    foresee this problem.


    Here are some tips for getting your lab setup and running:


    +   1. Unless you already have a lab set up for another project, you will most
    likely be to build one. For a small integration, this may well be dispensable.
    You don''t want to take longer than the actual integration timeline to build a
    lab! Larger integrations warrant building a comprehensive lab. There is nothing
    like proving that something works, in believing the marketing folks about it.
    I don''t know about you, but I''ve found that Microsoft and other big commercial
    vendors are completely truthful about their products and function. Ha Ha, stop
    it, I''m going to stop writing now, this is killing me!


    +   2. Good test labs should consist of servers and desktops that closely represent
    the new user environment. If you have a large number of computers in Windows,
    I feel for you. You should obviously include a like number in the lab environment.
    If the majority of your users access back-end Linux/UNIX boxes for services from
    Windows desktops, mirror that in your lab.


    +   3. You should break the lab into two pieces: (1) the development lab or "incubator"
    and (2) the proving lab or "user" lab. This allows you to cook things until they
    are ready to be tested or publicized within the company, and then serve them to
    the users in the public portion of the lab. This helps build user confidence and
    if I use the word "half-baked" here, the analogy will be complete. Seriously,
    don''t roll out things for the users to test until they are ready for public review
    and criticism. There are circumstances where you should actually publicly show
    things in the user lab that An example of this would be the project where management
    (one numbskill in particular) decided that we should restrict the RAM on the new
    user desktops to 24MB. This would have been ok, but the desktops were running
    Windows NT 4.0 Workstation! Glaciers in Alaska move faster than NT Workstation
    with 24MB! In this instance, we have an option in the BOOT.INI file to limit the
    available memory to 24MB, and let the users beat that particular manager''s supposition
    all to pieces. It was really ugly to watch their faces, and read the comments
    on their evaluation reports.'
