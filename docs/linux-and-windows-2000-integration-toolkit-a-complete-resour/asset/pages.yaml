  md: '# 140 Chapter 6


    ![](img/7c4d65772d38b487e72eb8750e4f3691_153_0.png)


    Figure 6.9 Common Desktop elements.


    # The Mouse and Your Desktop


    There are a couple of ways to use your mouse skills in Linux. One school of thought
    is that the only reason to use the mouse is to click on the icon that opens a
    shell and then you can do the rest of your work from there. The other method is
    to take advantage of some special features of the mouse that make working with
    the GUI Desktop much easier.


    Transitioning administrators will find the Linux method, which is really the X
    Window method, a little confusing. Double-clicking on window titles will not fill
    the screen; it will "shade" it, or cause it to roll up like a window to show only
    the title bar. To make a window full screen, you just need to click the Maximize
    button.


    Cut, Copy, and Paste are another matter in Linux. There are some applications
    that can trap and enable Ctrl+V, Ctrl+C, and Ctrl+X Windows/CUA keystrokes. StarOffice
    is just such an application, the Core WordPerfect Suite being another.


    If you find the need to copy text from one window to another, there is a method
    that is counterintuitive to Windows people, but once learned makes text manipulation
    really easy and fast. This method requires either a three-'
  merge: -1
  pgno: 153
- img_proc: true
  md: "button mouse, or a lot of manual dexterity, or the ability to press the left\
    \ and right mouse buttons equally and at the same time, called *chording*.\n\n\
    To copy from one text-based window to another: \n\n+   1. Select the text to be\
    \ cut or copied in the first window by clicking the left mouse button and holding\
    \ it down while selecting the text.\n2. Set the focus to the other window using\
    \ the mouse and left-clicking on the title, in the window or the borders.\n3.\
    \ Position the mouse cursor to the point you want to paste the text.\n4. Either\
    \ chord (press both the left and right mouse buttons simultaneously) or press\
    \ the middle mouse button, which will paste the text.\n\n# The Control Thing\n\
    \nTo conclude our look at the Linux graphical user interface, let's take a little\
    \ time and understand the Control Center, as GNOME calls it, or the Control Panel\
    \ by KDE refers to it (see Figure 6.10). Whichever desktop you use, there are\
    \ some common pieces we need to cover, as the usefulness of your environment can\
    \ be heightened or lessened by a few details.\nWe'll go through the different\
    \ areas and cover the important facts and tips. First is the desktop section:\n\
    \n**Background.** By clicking on the Background selection, you invoke a right\
    \ side pane that allows you to select and apply a background bitmap that can be\
    \ any number of formats, including .bmp, .jpg, and .gif. The options are excellent,\
    \ allowing you to title, stretch, and keep aspect on the pictures you choose for\
    \ your background. If you don't want to spend the time, or the memory putting\
    \ a large background file on your desktop(s), you can always choose a color and\
    \ a gradient, or the progression from one to the second for a visually pleasing,\
    \ and very economical background for your desktop.\n\n![](img/7c4d65772d38b487e72eb8750e4f3691_154_0.png)\n\
    \n**Figure 6.10** Control Center or Control Panel Settings."
