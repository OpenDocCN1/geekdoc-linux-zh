  md: '# CHAPTER 8


    # # Integrating DNS Environments


    # ## Overview of DNS


    The main function of Domain Name System (DNS) is to help you assign and

    use a hierarchical, friendly structure for naming and resolving the names of

    hosts on your network. Many professionals pride themselves on remembering

    a large number of IP addresses and other related information, but there are

    s compelling reasons to use names to find, access, and manage the hosts on

    your corporate and personal networks.


    DNS uses a classic client/server model to resolve names. A client or resolver

    such as a Web browser will package a resolution request and submit it to the

    configured DNS server, which, if resolved, returns the actual IP address of the

    destination host and initiates the process of determining if it is local or remote.

    On the server end, DNS is made up of a server service and a distributed data-base
    maps DNS domain names to IP addresses and other data.


    # ## The Job Market


    System administrators during the 2000s will have to possess an excellent

    working knowledge of DNS (Domain Name System). At the helpdesk level of'
