    # Legacy Name Resolution for Windows 2000


    In case you do have to maintain legacy name resolution, let''s discuss the role
    of the WINS Server in Windows 2000 and how it has been improved for this version.


    # WINS Role in Windows 2000


    Although you do not need to use WINS servers for name resolution anymore with
    the introduction of Windows 2000, you do need them for legacy name resolution.
    WINS true role in any Microsoft network is to translate NetBIOS names into IP
    addresses. Once a client has mapping, it can determine if it is on the same subnet
    or not, by contacting that host. WINS also helps hosts browse multiple subnets
    easily by being a central point for registering names and their associated IP
    addresses.


    Any networks that support older versions of Windows clients are going to still
    deploy a few WINS servers to carry those clients until the whole world runs on
    Windows 2000. Ahem, anyway, those of us who are responsible for full-featured
    Microsoft networks are going to be dancing in the streets when WINS servers are
    retired once for all. For of all its qualities, running large wide area networks
    based on multiple WINS servers and complicated replication is difficult.


    # Improved WINS Manager


    The NT 4.0 version of the WINS Manager was a little hard to work with. You could
    not expand the window unless you grabbed the bottom right-hand corner and adjusted
    it to suit. Unless you had the correct service pack, you were unable to enable
    individual registrations in the database, the entire server and all its entries.
    Not a real timesaver, the new WINS management console is contained in the MMC
    and provides an updated and much friendlier environment to configure and manage
    your WINS servers.


    Additional improvements to the interface made it possible to assign the capability
    to view the WINS console to a new special local group called the WINS Users group.
    This is a great way to have Help Desk or non-administrator users keep an eye on
    WINS resources and information.'
  merge: -1
