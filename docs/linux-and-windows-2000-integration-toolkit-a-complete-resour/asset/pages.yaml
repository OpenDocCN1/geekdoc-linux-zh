  md: '# Signed Drivers


    Buggy drivers can stop a system and prevent it from booting properly. Microsoft
    tests drivers submitted by vendors, and if found stable and compatible with Windows
    2000, Microsoft adds a digital signature file to the drivers. If you attempt to
    add drivers that are not signed, Windows 2000 warns you of the potential danger
    of incompatibility or instability.


    # Improved Startup Options


    Several startup options, including Safe Mode, allow you to boot an ailing system,
    while NT Mode might leave you with no choice to reinstall or repair the operating
    system when experiencing boot problems.


    # Versions of Windows 2000


    Windows 2000 is available in four different versions: Windows 2000 Professional,
    Server, Advanced Server, and Datacenter Server. This section discusses the various
    capabilities and purpose of each version.


    # Windows 2000 Professional


    Windows 2000 Professional is designed to replace both Windows NT 4.0 and Windows
    9X on the corporate desktop. Although Windows 2000 Professional is certainly suitable
    for the home desktop, it is not Microsoft’s primary focus for this operating system.
    Instead, look for Windows Millennium Edition (Windows ME) to replace Windows 9X
    on the home desktop. Windows 2000 Professional supports up to two processors and
    4GB of system memory.


    # Windows 2000 Server


    Windows 2000 Server supports a variety of services such as DNS, DHCP, WINS, and
    Routing Remote Access, as well as serving as an excellent file and print server.
    Windows 2000 Server also serves as a Domain Controller in an Active Directory
    environment, and is designed to replace Windows NT 4.0 Servers, member servers,
    stand-alone servers, IIS servers, and file and print servers. Windows 2000 Server
    supports up to four processors and 4GB of system memory.


    # Windows 2000 Advanced Server


    Windows 2000 Advanced Server delivers all the capabilities of Windows 2000 Server,
    and provides better support for Terminal Services because it can'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'support more processors and memory. Terminal Services allows users to run applications
    or the Windows 2000 desktop from a central server. This version of Windows 2000
    replaces Windows NT Server 4.0, Enterprise Edition.


    In addition, Windows 2000 Advanced Server provides for clustering, which connects
    two or more servers together programmatically and physically to provide failover,
    should one server become unavailable, and network load balancing to evenly distribute
    the workload between cluster members.


    > NOTE For failover, you can cluster two nodes using Windows 2000 Advanced Server
    and four nodes using Windows 2000 Datacenter Server. For network load balancing,
    you can cluster 32 nodes using either version.


    Windows 2000 Advanced Server supports up to eight processors and 8GB of system
    memory with Intel''s Physical Address Extension (PAE).


    # Windows 2000 Datacenter Server


    Windows 2000 Datacenter Server delivers all the capabilities of Windows 2000 Advanced
    Server, and adds processor and memory capacity to support high-end data warehouses
    and large-scale line-of-business and enterprise backend usage. Windows 2000 Datacenter
    Server supports up to 32 processors and 64GB of system memory.


    # Summary


    In our first look at both of the contenders, we see a lot of underlying similarities,
    and a number of surface differences. The main idea here is that both will have
    their place, win over certain hearts and minds with their features, and so forth.
    We have seen seen some changes in the market share for the server area, desktop
    systems are overwhelmingly Windows systems.'
