  \ `checksum`，并将结果与原始文件的 `checksum` 值进行比较。相同的值表示文件完整到达。不同的值表示传输过程中发生了损坏。\n\n**命令行界面\
  \ (CLI)**\n一种使用命令向操作系统发送输入的界面。\n\n**命令替换 (command substitution)**\n一种输入命令的方法，允许运行一个命令并将其输出粘贴回命令行作为另一个命令的参数。命令替换允许同时执行多个任务。\n\
