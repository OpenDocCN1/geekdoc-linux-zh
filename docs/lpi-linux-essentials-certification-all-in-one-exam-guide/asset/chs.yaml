  \ 第 11 章: 管理 Linux 进程和日志文件\n> **目标：** 4.3: Linux 操作系统：数据存储位置\n\n**A 正确。** `SIGHUP`\
  \ 杀进程信号会重启进程。重启后，该进程将具有与之前完全相同的 PID。对于重启你修改过配置文件的服务，这是一个非常有用的选项。\n\nB、C 和 D 是错误的。`SIGINT`\
  \ 信号向进程发送 `CTRL-C` 键位序列。`SIGKILL` 信号是一个强制性信号，用于杀死进程。如果进程严重挂起，此选项将强制其停止。`SIGTERM`\
  \ 信号告诉进程立即终止。该信号允许进程在退出前自行进行清理工作。\n\n### Q26: 识别系统用户账户\n\n`/etc/passwd` 文件中的以下哪个条是系统用户账户？\n\
