  \ 用户作为组成员，从模式中获得了读取权限。因此，他可以打开文件并查看内容，但无法保存更改。\n\n> B、C 和 D 错误原因恰。\n\n### Q23: 管理特殊权限\n\
  \n一个目录由 users 组所有，并为该组分配了 `rwxrwxr-T` 模式。这对目录内的文件有什么影响？\n\nA. users 组的成员只能删除他们所属的目录文件。\n\
