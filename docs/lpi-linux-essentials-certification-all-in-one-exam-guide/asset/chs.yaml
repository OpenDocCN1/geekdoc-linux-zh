  \ login`\nD. `fgrep –l login /var/log/* $(tail)`\n\n> **提示：** 回忆在提示符处使用命令替换的正确语法\n\
  > **参考：** 第 12 章: 创建脚本\n> **目标：** 2.1: 在 Linux 系统中寻找路径：命令行基础\n\n**B 正确。** `tail\
  \ $(fgrep –l login /var/log/*)` 命令将使用 `fgrep` 命令生成 `/var/log` 中包含“login”的文件列表。然后该列表将被替换为\
  \ `tail` 命令的参数，显示 `fgrep` 发送它的每个文件的内容。\n\n\n\n\n\nA, C 和 D 都是错误的。`fgrep –l login\
  \ /var/log/* | tail` 命令使用了管道，并仅在屏幕上显示 `fgrep` 命令的输出。`tail /var/log/* | grep –l login`\
  \ 命令也使用了管道，但由于错误信息被发送到了 `grep` 的输入，会产生“无此类文件”的错误。`fgrep –l login /var/log/* $(tail)`\
  \ 命令在这种场景下反转了使用命令替换时所需的命令顺序。\n\n### Q32: 在 shell 脚本中使用 test 命令\n哪一个 `test` 命令选项用于检查指定指定的文件是否存在，并测试该文件是否为符号链接？\n\
  A. `-e`\nB. `-f`\nC. `-L`\nD. `-O`\n\n**提示：** 这些选项都会检查文件是否存在，但只有一个选项会测试它是否为符号链接。\n\
  \n**参考：** 第 12 章：创建脚本\n**目标：** 3.3: 命令行的力量：将命令转换为脚本\n\n**C 是正确的。** `-L` 选项告诉 `test`\
  \ 命令测试指定的文件是否存在，以及它是否为符号链接。\n\n**A、B 和 D 都是错误的。** `-e` 选项仅检查指定的文件是否存在。`-f` 选项检查指定的文件是否存在以及它是否为普通文件。`-O`\
  \ 选项检查指定的文件是否存在以及它是否由指定的用户 ID 所有。\n\n### Q33: 使用 IP 协议\n哪种协议在发送 IP 数据包时，不需要目标主机确认已收到这些数据包？\n\
  A. TCP\nB. UDP\nC. RDP\nD. SPX\n\n**提示：** 不需要确认接收的协议被称为无连接协议。\n\n**参考：** 第 13 章：将\
  \ Linux 连接到网络\n**目标：** 4.4: Linux 操作系统：网络上的计算机\n\n**B 是正确的。** 使用 `UDP` 时，IP 数据包在不经确认的情况下发送。它通常由一次发送极少量数据的应用程序进行实现。它假设错误检查和修正不是必要的，或者将由应用程序执行，从而避免处理开销。\n\
  \n**A、C 和 D 都是错误的。** `TCP`、`RDP` 和 `SPX` 协议都需要确认数据包的接收。\n\n### Q34: 使用 IP 端口\n你在\
  \ Linux 系统上配置的服务在端口 `389` 上传输数据。这是哪种端口？\nA. 常用端口 (Well-known)\nB. 注册端口 (Registered)\n\
  C. 动态端口 (Dynamic)\nD. 私有端口 (Private)\n\n**提示：** 回想为每个类别定义的端口范围。\n\n**参考：** 第 13\
  \ 章：将 Linux 连接到网络\n**目标：** 4.4: Linux 操作系统：网络上的计算机\n\n**A 是正确的。** 常用端口是 0 到 1023\
  \ 之间的端口。\n\n**B、C 和 D 都是错误的。** ICANN 留了 1024 到 49151 作为注册端口。动态端口和私有端口是同一个，被指定为 49152\
  \ 到 65535 端口。\n\n### Q35: 使用私有 IP 地址\n哪个 IP 地址是私有 B 类地址？\nA. 10.0.0.3\nB. 178.7.8.44\n\
  C. 172.17.8.1\nD. 192.168.1.4\n\n**提示：** B 类地址的首位二进制值必须为 1。\n\n**参考：** 第 13 章：将\
  \ Linux 连接到网络\n**目标：** 4.4: Linux 操作系统：网络上的计算机\n\n**C 是正确的。** B 类私有地址范围是 172.16.0.0–172.31.255.255。\n\
  \n**A、B 和 D 都是错误的。** 10.0.0.3 是私有 A 类地址。178.7.8.44 不是私有 IP 地址。192.168.1.4 是私有 C\
  \ 类地址。\n\n### Q36: 使用 IPv6 地址\n以下哪项是有效的 IPv6 地址？\nA. 35BC:FA77:4898:DAFC:200C:FBBC:A007:8973\n\
  B. 35BC:FP77:4898:DAFC:200C:FBBC:A007:8973\nC. 35BC:FA77:4898:DAFC\nD. 35BC:FA77:4898:DAFC:200C:FBBC:A007\n\
  \n**提示：** IPv6 地址使用十六进制数。\n\n**参考：** 第 13 章：将 Linux 连接到网络\n**目标：** 4.4: Linux 操作系统：网络上的计算机\n\
  \n**A 是正确的。** 35BC:FA77:4898:DAFC:200C:FBBC:A007:8973 是一个有效的 IPv6 地址。\n\n**B、C 和\
  \ D 都是错误的。** B 使用无效的十六进制（`FP77`）。C 和 D 使用的地址太短。\n\n### Q37: 添加路由\n你需要通过 IP 地址为 `192.168.2.254`\
  \ 的路由器为 `192.168.2.0/24` 网络添加路由。哪条命令可以实现此操作？\nA. `route –net 192.168.2.0 netmask\
  \ 255.255.255.0 192.168.2.254`\nB. `route add netmask 255.255.255.0 gw 192.168.2.254`\n\
  C. `route add –net 192.168.2.0 subnetmask 255.255.255.0 gw 192.168.2.254`\nD. `route\
  \ add –net 192.168.2.0 netmask 255.255.255.0 gw 192.168.2.254`\n\n**提示：** 回想 `route`\
  \ 命令的语法。\n**参考：** 第 13 章：将 Linux 连接到网络\n**目标：** 4.4: Linux 操作系统：网络上的计算机\n\n**D 是正确的。**\
  \ `route add –net 192.168.2.0 netmask 255.255.255.0 gw 192.168.2.254` 将通过路由器向 `192.168.2.0/24`\
  \ 网络添加路由。\n\n**A、B 和 C 都是错误的。** `route add –net 192.168.2.0 netmask 255.255.255.0\
  \ 192.168.2.254` 缺少了 `gw` 选项。`route add netmask 255.255.255.0 gw 192.168.2.254`\
  \ 缺少了 `-net` 选项。`route add –net 192.168.2.0 subnetmask 255.255.255.0 gw 192.168.2.254`\
  \ 使用了无效的选项（`subnetmask`）。\n\n### Q38: 使用系统日志\n哪个系统日志文件包含 Linux 系统的身份验证尝试列表？\nA.\
  \ `lastlog`\nB. `warn`\nC. `wtmp`\nD. `faillog`\n\n**提示：** 该日志文件不能用 `cat`、`tail`\
  \ 或 `less` 等文本读取器查看\n**参考：** 第 11 章：管理 Linux 进程和日志\n**目标：** 4.3: Linux 操作系统：数据存储位置\n\
  \n**D 是正确的。** `/var/log/faillog` 文件包含系统的身份验证尝试列表。它必须在 shell 提示符中使用 `faillog` 命令查看。\n\
  \n**A、B 和 C 都是错误的。** `lastlog` 文件包含用户的最后登录信息。`warn` 文件包含警告信息。`wtmp` 文件包含登录用户的列表。\n\
  \n### Q39: 配置 ssh 客户端\n`/etc/ssh/ssh_config` 中的哪个参数用于指定在连接到 `sshd` 服务器主机时使用 SSH\
  \ 版本 1？\nA. `Port`\nB. `Protocol`\nC. `Version`\nD. `StrictHostKeyChecking`\n\n\
  **提示：** 该参数也可指定 ssh 客户端使用 SSH 版本 2。\n**参考：** 第 13 章：将 Linux 连接到网络\n**目标：** 4.4:\
  \ Linux 操作系统：网络上的计算机\n\n**B 是正确的。** `/etc/ssh/ssh_config` 中的 `Protocol` 参数用于指定在连接到\
  \ `sshd` 服务器主机时使用 SSH 版本 1（或版本 2）。\n\n**A、C 和 D 都是错误的。** `Port` 参数配置 ssh 客户端建立 SSH\
  \ 连接的端口。`ssh_config` 文件中没有名为 `Version` 的参数。此响应为干扰项。`StrictHostKeyChecking` 参数用于限制\
  \ ssh 客户端仅与公钥已添加到 `~/.ssh/known_hosts` 或 `/etc/ssh/ssh_known_hosts` 文件的 SSH 服务器建立连接。\n\
  \n\n\n\n\n### Q40: Linux 的演变\n哪一个 UNIX 克隆系统启发了 Linus Torvalds 开发 Linux 内核？\nA. CPM\n\
  B. DR-DOS\nC. Minix\nD. Solaris\n\n> **提示：** 这个 UNIX 克隆系统是由 Andrew Tanenbaum 编写的\n\
  > **参考：** 第 1 章:Linux 简介\n> **目标：** 1.1: Linux 社区与开源职业：Linux 演变与流行操作系统\n\nC 正确。当大学不再被允许访问\
  \ UNIX 源代码时，Andrew Tanenbaum 编写了 `Minix` 操作系统。Linus Torvalds 受 `Minix` 的启发，创建了自己的操作系统内核，并将其命名为\
  \ `Linux`。\n\nA、B 和 D 错误。`CP/M` 和 `DR-DOS` 是早期的类 DOS 操作系统，与 Linux 没有紧密联系。`Solaris`\
  \ 是一个最初由 Sun Microsystems 创建的派自 UNIX 的操作系统。然而，它是在专有模型下开发的，源代码对 Torvalds 并不开放。\n\n\
  ### Q41: Linux 应用与服务\n哪些服务可以用于将 Linux 配置数据库服务器？（选择两个）\nA. MySQL\nB. NFS\nC. PostgreSQL\n\
  D. Samba\nE. NIS\n\n> **提示：** 这些服务使用结构化查询语言\n> **参考：** 第 2 章:在 Linux 中畅游\n> **目标：**\
  \ 1.2: Linux 社区与开源职业：主要的开源应用程序\n\nA 和 C 正确。`MySQL` 和 `PostgreSQL` 都是你可以在 Linux 上安装的强大数据库服务。这两个服务都使用行业标准的结构化查询语言\
  \ (`SQL`)，使得数据库管理员相对容易学习如何使用它们。但是，请注意，变化正在发生。`Fedora` 和 `openSUSE` 发行版将在不久的将来用 `MariaDB`\
  \ 数据库管理系统替换 `MySQL`。\n\nB、D 和 E 错误。`NFS` 和 `Samba` 是文件共享服务。`NIS` 是一个允许多个 Linux 系统共享一组公共用户和组账户的服务。\n\
  \n### Q42: 开源软件\n哪些术语试图弥补自由软件基金会 (FSF) 和开源倡议 (OSI) 之间的哲学差异？（选择两个）\nA. BSD\nB. GNU\n\
  C. FOSS\nD. FLOSS\nE. Creative Commons\n\n> **提示：** FSF 的哲学被认为比 OSI 更激进\n> **参考：**\
  \ 第 4 章:开源软件\n> **目标：** 1.3: Linux 社区与开源职业：理解开源软件与许可\n\nC 和 D 正确。自由与开源软件 (`FOSS`)\
  \ 和自由自由开源软件 (`FLOSS`) 均指自由且开源的软件。这些术语的设计旨在通过不将软件标记为“开源”或“自由软件”，来克服 `OSI` 和 `FSF`\
  \ 之间的分歧。\n\nA、B 和 E 错误。`BSD` 是一个派自 UNIX 的操作系统。`GNU` 是一个与 `FSF` 密切相关的运动。`Creative\
  \ Commons`（知识共享）是一个其目标是为共享版权作品创建新模型的组织。\n\n### Q43: 强密码\n以下哪项是强密码的示例？\nA. password\n\
  B. P@ssw0rd\nC. Rover1\nD. mustang\n\n> **提示：** 回想强密码的标准\n> **参考：** 第 2 章:在 Linux\
  \ 中畅游\n> **目标：** 1.4: Linux 社区与开源职业：ICT 技能与在 Linux 工作\n\nB 正确。`P@ssw0rd` 是一个强密码，因为它有\
  \ 8 个字符，使用了大小写字母、数字和符号。它也没有出现在字典中。\n\nA、C 和 D 错误。密码 `mustang` 和 `password` 容易被猜，且出现在字典中。`Rover1`\
  \ 是一个稍微强一点的密码，但太短了。\n\n\n\n\n\n![image](img/00018.jpg)\n\n# 术语表\n\n## 术语\n\n**绝对路径\
  \ (absolute path)**\n从根目录开始的 Linux 文件系统中文件或目录的完整路径。例如，引用 `tmp` 目录下名为 `myfile.txt`\
  \ 的文件，将使用绝对路径 `/tmp/myfile.txt`。\n\n**加速图形端口 (AGP)**\n在许多 PC 系统中，仅用于视频扩展卡的特殊扩展总线。\n\
  \n**高级配置与电源接口 (ACPI)**\n一种用于现代 PC 系统的电源管理标准。通过 `ACPI`，可以管理系统设备以降低功耗。`ACPI` 在 `BIOS`\
  \ 和操作系统之间分配电源管理任务。\n\n**高级电源管理 (APM)**\n`APM` 是一种逐渐被淘汰的旧电源管理实现。`APM` 使用 `BIOS` 内的软件来管理系统功耗。为了实现这一点，`APM`\
  \ 使用设备活动超时来决定何时将设备切换到低功率状态。\n\n**AGP**\n参见加速图形端口。\n\n**别名 (alias)**\n`alias` 是 Linux\
  \ 系统上指向不同文件或命令的快捷方式。当 Linux 系统启动时会自动定义许多别名。例如，`md` 别名实际上运行 `mkdir –p` 命令。你也可以定义自己的自定义别名。\n\
  \n**APM**\n参见高级电源管理。\n\n**应用程序 (application)**\n设计用于执行特定功能的计算机软件。应用程序通常设计供终端用户使用。常用的应用程序包括文字处理器、数据库程序、图形/绘画程序、网络浏览器或电子邮件程序。`Application`\
  \ 也指选择、演示、执行过程、解决、绘图、计算、更改、解释和操作的过程。\n\n**非对称加密 (asymmetric encryption)**\n使用两个密钥（公钥和私钥）的过程。私钥加密的数据只能用公钥解密。公钥加密的数据只能用私钥解密。\n\
  \n**身份验证 (authentication)**\n当用户提供的凭据（通常是用户名和密码）与 Linux 用户名密码存储器中存储的内容匹配时发生，允许用户访问系统。\n\
  \n**后台 (background)**\n当在后台启动命令时，程序将正常运行。然而，控制权将立即返回给 shell。你可以使用 shell 启动其他程序或执行其他\
  \ shell 任务。\n\n**备份 (backup)**\n在 Linux 文件系统上将数据复制到次级存储设备的过程。你可以使用大多数 Linux 备份工具创建三种类型的备份：\n\
  * **全备 (Full)**：备份所有指定的文件，无论它们自上次备份以来是否被修改。备份后，每个文件都会被标记为已备份。\n* **增量备份 (Incremental)**：仅备份自上次备份（全备或增量备份）以来修改的文件。备份后，每个文件都会被标记为已备份。\n\
  * **差异备份 (Differential)**：仅备份自上次全备以来修改的文件。尽管这些文件在差异备份期间已被备份，但涉及的文件不会被标记为已备份。\n\n\
  **基准 (baseline)**\n系统性能的快照。要创建系统基准，你可以监控并记录各种系统参数，包括：\n* 处理器利用率\n* 内存利用率\n* 交换分区利用率\n\
  * 空闲磁盘空间\n* 磁盘写入性能\n* 磁盘读取性能\n* 网络吞吐量\n\n**bash**\nBourne-Again Shell (`bash`)。`sh`\
  \ shell 的改进版本，也是今天最流行的 shell 之一。它是大多数 Linux 发行版使用的默认 shell。\n\n**基本输入输出系统 (BIOS)**\n\
  集成在主板上的 ROM 芯片，包含了一系列非常小的程序和驱动程序，允许 `CPU` 与基本系统设备通信，如键盘、I/O 端口、系统扬声器、系统 RAM、软盘驱动器和硬盘。\n\
  \n**广场模型 (Bazaar Model)**\n一种依赖全球软件开发者广泛协作的软件开发模型。\n\n**伯克利软件发行版 (BSD)**\nLinux\
  \ 的亲戚。`BSD` 是源自 `UNIX` 的操作系统，由加州大学伯克利分校开发。原始版本与 `UNIX` 共享源代码，因此是有的，不被认为是开源软件。然而，与\
  \ Linux 一样，`BSD` 最终启发了系统的几个开源版本，最著名的 `FreeBSD` 和 `NetBSD`。\n\n**BIOS**\n参见基本输入输出系统。\n\
  \n**启动 (boot)**\n将 Linux 操作系统内核加载到 `RAM` 中的过程。\n\n**引导扇 (boot sector)**\n硬盘上包含主引导记录\
  \ (`MBR`) 的扇区。\n\n**引导加载程序 (bootloader)**\n`BIOS` 可以从硬盘 `MBR` 加载的软件，允许 `CPU` 将 Linux\
  \ 内核加载到 `RAM`。为了实现这一点，`bootloader` 配置了硬盘上操作系统文件的位置。`bootloader` 软件本身可能在或不在 `MBR`\
  \ 中。你可以在 `MBR` 中安装一些引导加载程序，也可以将它们安装在硬盘其他处的分区中，并在 `MBR` 中放置指针。其他引导加载程序会在两个地方安装组件。`LILO`\
  \ 和 `GRUB` 引导加载程序常用于大多数 Linux 发行版。\n\n**缓存 (cache)**\n实现在 `CPU` 内部的静态 RAM，用于存储频繁访问的数据。\n\
  \n**大教堂模型 (Cathedral Model)**\n一种非常有组织性的软件开发模型。软件开发被限制为特定开源软件项目的一组特定程序员。当项目完成后，源代码将向公众发布。\n\
  \n**中央处理器 (CPU)**\nPC 中用于解释程序指令并处理数据的组件。\n\n**更改日志 (change log)**\n由 Linux 系统管理员维护的日志，每当系统发生更改（例如操作系统升级或更换硬盘）时，就会包含一个条目。\n\
  \n**CMOS**\n参见互氧化半导体。\n\n**校验和 (checksum)**\n使用消息摘要 5 (`MD5`) 算法计算文件内容的值。你可以对下载的文件运行\
  \ `checksum`，并将结果与原始文件的 `checksum` 值进行比较。相同的值表示文件完整到达。不同的值表示传输过程中发生了损坏。\n\n**命令行界面\
  \ (CLI)**\n一种使用命令向操作系统发送输入的的界面。\n\n**命令替换 (command substitution)**\n一种输入命令的方法，允许运行一个命令并将其输出粘贴回命令行作为另一个命令的参数。命令替换允许同时执行多个任务。\n\
  \n**互氧化半导体 (CMOS)**\nPC 主板上的可重写芯片，与 `BIOS` 配合工作，以存储系统参数，如软盘驱动器、硬盘类型、主板电源管理功能以及系统设备顺序。\n\
  \n**控制结构 (control structures)**\n可以添加到 shell 脚本中的决策程序。控制结构包括 `if/then/else`、`case`、`while`\
  \ 循环和 `until` 结构。\n\n**通用打印系统 (CUPS)**\nLinux 打印系统。`CUPS` 服务由 `cupsd` 提供，自动宣布本地网络打印队列的可用性。`CUPS`\
  \ 客户端监听公告，允许用户选择他们想要的打印机。此外，`CUPS` 支持通过互联网打印协议 (`IPP`) 在端口 631 进行网络打印。\n\n**CPU**\n\
