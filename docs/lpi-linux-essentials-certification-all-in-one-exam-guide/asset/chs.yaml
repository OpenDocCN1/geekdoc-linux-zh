  **A 正确。** 因为分配给 `mwilliams` 用户账户的 `UID` 小于 100，所以它是一个系统用户账户。\n\nB、C 和 D 是错误的。这些用户账户的\
  \ `UID` 都大于 1000，因此它们不是系统用户账户。\n\n### Q27: 设置用户密码\n\n哪个 `passwd` 命令选项设置了密码必须更改前的最大天数？\n\
