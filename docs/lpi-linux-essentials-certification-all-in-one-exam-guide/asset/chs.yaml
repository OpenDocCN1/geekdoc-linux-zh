  \ 选项递归显示目录内容。`-m` 选项用逗号的项目列表填充屏幕。\n\n### Q17: 使用链接文件\n\n关于硬链接（hard link），哪个描述是正确的？\n\
  \nA. 链接文件和目标文件共享相同的 inode。\nB. 链接文件和目标文件各自拥有 inode。\nC. 链接文件和目标文件可以很容易确定。\nD. 硬链接只能在\
