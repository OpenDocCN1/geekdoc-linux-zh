  \ `named`、`httpd` 和 `dhcpd`。\n\n**默认网关 (default gateway)**\nIP 路由器。如果系统尝试向不在同一网络上的主机发送数据，IP\
  \ 将数据重定向到网段的默认网关。路由器将使用各种协议确定数据应该发送到哪里。\n\n**依赖 (dependency)**\n软件包依赖于系统中安装的另一个软件包的状态。\n\
  \n**DHCP**\n参见动态主机配置协议。\n\n**直接内存访问 (DMA)**\n主板上的芯片，在没有 `CPU` 干预的情况下在系统 `RAM` 和系统设备之间传输数据。\n\
  \n**发行版 (distribution)**\nLinux 的自定义版本。目前有数百种发行版。\n\n**DMA**\n参见直接内存访问。\n\n**域名系统\
  \ (DNS)**\nIP 网络上的系统，将字母名称解析为 IP 地址。`DNS` 是一个客户端/服务器系统。`DNS` 客户端向 `DNS` 服务器发送请求。`DNS`\
  \ 服务器将域名解析为 IP 地址并将结果返回给 `DNS` 客户端。\n\n**驱动程序 (driver)**\n`CPU` 需要与系统硬件设备通信的软件。系统启动时，操作系统从硬盘将驱动程序加载到\
  \ `RAM`。一旦完成，CPU 就有了与关联硬件通信的指令。在 Linux 上，驱动程序使用内核模块实现。\n\n**动态主机配置协议 (DHCP)**\n\
  用于向网络主机自动分配 IP 地址、子网掩码、路由器地址和 DNS 服务器地址的协议。DHCP 是一种客户端/服务器协议。当 DHCP 客户端启动时，它发送 DHCPDISCOVER\
  \ 广播。`DHCP` 服务器接收广播并从可用地址范围内选择一个可以分配给 DHCP 客户端的 IP 地址。服务器通过 DHCP OFFER 消息向主机发送建议的\
  \ IP 分配。DHCP 客户端查看其收到的报价，然后选择它想要接受的报价。DHCP 客户端随后发送 DHCPREQUEST 广播。此广播通知 DHCP 服务器它接受了地址报价。`DHCP`\
  \ 服务器向客户端响应 DHCPACK 消息，其中包含 IP 分配。\n\n**Emacs**\n一种常用的菜单驱动用户界面的 Linux 文本编辑器。\n\n\
  **环境变量 (environment variable)**\n由操作系统创建、命名并填充的变量。环境变量用于配置系统的计算环境。Linux 系统上常用的环境变量包括\
  \ `MAN-PATH`、`HOST`、`SHELL` 和 `DISPLAY`。\n\n**ext2**\n第二扩展文件系统 (`ext2`)。一种以大多数文件系统使用的标准分级方式存储数据的文件系统。数据存储文件中；文件存储在目录中。目录可以包含文件或其他子目录。文件名最长为\
  \ 255 个字符。`ext2` 文件系统支持 Linux 文件系统用户、组和权限（称为 POSIX 权限）。它还支持文件压缩。\n\n**ext3**\n第三扩展文件系统\
  \ (`ext3`)。`ext2` 的更新版本。`ext3` 文件系统提供日志功能。在将事务提交到硬盘之前，`ext3` 文件系统会将事务记录到日志中并标记为未完成。事务完成后，`ext3`\
  \ 文件系统在日志中标记事务为已完成。通过这种方式，`ext3` 文件系统可以保留最近事务日志以及它们是否实际完成。\n\n**ext4**\n第四扩展文件系统\
  \ (`ext4`)。`ext3` 的更新，于 2008 年发布。`ext4` 文件系统支持大卷和文件，并使用校验和来验证文件的完整性，有助于提高系统的可靠性。\n\
  \n**FHS**\n参见文件系统层次标准。\n\n**FIFO**\n参见先进入先出。\n\n**文件描述符 (file descriptors)**\nLinux\
  \ 提示符输入的每个命令都有三个文件描述符：\n* **stdin**：标准输入。提供给特定命令的输入。`stdin` 对于命令用 0 表示。\n* **stdout**：标准输出。特定命令的输出。`stdout`\
  \ 对于命令用 1 表示。\n* **stderr**：标准错误。命令生成的错误代码。`stderr` 对于命令用 2 表示。\n\n**文件系统 (file\
  \ system)**\n执行磁盘 I/O 操作时，操作系统需要知道数据存储在哪里、如何访问它以及在哪里安全地写入新信息。文件系统的作用是在硬盘上可靠地存储数据并以于访问的方式组织。\n\
  \n**文件系统层次标准 (FHS)**\n定义 Linux 系统根目录下必须存在的目录的方法。\n\n**防火墙 (firewall)**\n硬件和软件的结合，充当你的网络和其他网络之间的守门人，监控网络之间的流量。你通过配置规则定义允许的流量类型。任何违反规则的流量是不允许的。\n\
  \n**FireWire**\n也称为 IEEE1394。FireWire 设备是 PnP 兼容且可热插的。FireWire 经常用于外部硬盘、外部 DVD 驱动器、数字相机，并以\
  \ 400 Mbps 的速度传输数据。FireWire 以真正的总线方式从一个设备到另一个设备连接，形成链。最多可以连接 6 个设备。\n\n**先进入先出 (FIFO)**\n\
  一种将数据从系统上运行的一个进程移动到另一个进程的文件。FIFO 文件是一个队列，先添加到队列的数据是先从队列中移除的。\n\n**闪存存储 (flash storage)**\n\
  不再使用磁编码盘片或光盘来存储数据，闪存驱动器使用称为 flash 的内存。闪存内存可以电子擦除和重新编程。闪存内存也是持久的。即使关闭电源，它也会保留内容。基本上闪存驱动器是一个安装了闪存内存的电路板，连接到\
  \ USB 或 SATA 接口。\n\n**FLOSS**\n参见自由开源软件。\n\n**软磁盘驱动器 (floppy diskette drive)**\n\
  PC 中旧的存储设备。软磁盘使用涂有氧化层的磁盘来存储数据。软磁盘驱动器正在被淘汰。\n\n**前景 (foreground)**\n在提示符输入命令时，创建一个子\
  \ shell。一旦进程退出，子 shell 就会销毁。在进程运行期间，父 shell 的提示符消失。\n\n**派生 (forking)**\n创建一个新子\
  \ shell 的过程。\n\n**正向查找 (forward lookup)**\n在正向查找中，DNS 客户端向 DNS 服务器请求将主机名解析为 IP 地址。\n\
  \n**开源软件 (FOSS)**\n一个指代自由和开源软件的术语，通过不将软件标记为“开源”或“自由”来克服 OSI 和 FSF 之间的分歧。目标是让每个人将这两种软件都称为\
  \ FOSS。\n\n**自由开源软件 (FLOSS)**\n一个术语，通过不将软件标记为“开源”或“自由”来克服 OSI 和 FSF 之间的分歧。目标是让每个人将这两种软件都称为\
