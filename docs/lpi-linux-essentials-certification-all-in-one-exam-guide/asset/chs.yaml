  \ inode，它们具有相同的模式（mode）。\n\n### Q18: 使用 `grep`\n\n你需要为 `/etc` 目录下的文件生成一个列表，这些文件内部包含文本字符串“eth0”。你可以使用使用哪条命令来执行此操作？\n\
