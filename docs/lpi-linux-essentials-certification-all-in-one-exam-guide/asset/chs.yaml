  \ 文件不存在，是一个干扰项。`/etc/default/useradd` 文件包含了 `useradd` 命令的默认值。\n\n### Q30: 创建脚本\n\
  \n你在家目录（`~`）创建了一个名为 `myapp` 的 shell 脚本。如何执行它？（选择两个。）\n\nA. 在 提示符输入 `/bin/bash ~/myapp`。\n\
