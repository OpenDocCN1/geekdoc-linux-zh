- pgno: 122
  md: '# Make regular backups


    Although a Linux distro is pretty stable and more immune to common malicious programs
    floating around online, the hardware it runs on and the operator are not infallible.
    Therefore, it’s good to implement a back-up strategy.


    The average desktop user should back up their home directories as well as any
    configuration files. A weekly backup should suffice for most desktop users. You
    can store several weeks of backups on an external USB drive. Once you start running
    out of disk space, you can either discard the older ones or burn them on an optical
    disc.


    There are several open source back-up tools with varying degrees of complexity
    and features. The command line tar is arguably the most popular Linux back-up
    utility. You can use it to make compressed archives of entire directories. This
    command will create an archive of the Downloads directory:


    ```

    tar cvf downloads.tar ~/Downloads

    ```


    To compress the backup, modify the command to:


    ```

    tar cvzf downloads.tar.gz ~/Downloads

    ```


    The only difference between the two commands is the addition of the z option,
    which asks tar to create a gzip compressed archive. The resulting filename changes,
    too.


    Depending on the size of the directories that you are backing up, tar may take
    some time to create the compressed back-up file. If you have large amounts of
    data that needs backing up, it is often more useful to make incremental backups,
    which will only back up those files that have changed since the last time one
    was carried out.


    Before you can create an incremental backup, you need to first take a full backup
    of the intended directory using the command listed above. Next, you’ll have to
    create a special file that contains a list of all the files included in the backup:


    ```

    tar cvzg increment-file -f downloads.tar.gz ~/Downloads

    ```


    When you return to back up the folder in a week, use increment-file to only back
    up files that have changed.


    The following command creates a new back-up file that is considerably smaller
    than a full backup because it contains only the changed files:


    ```

    tar cvzg increment-file -f 31052014-downloads.tar.gz ~/Downloads

    ```


    Use this last command to create incremental backups every week. Remember to use
    a different name each time you create an incremental back-up file.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_122_0.png)


    KDE''s system monitor can visualise all kinds of resources inside the computer.


    When you want to restore data from these back-up files, begin by extracting the
    full back-up file, followed by the increment files in chronological order. This
    means that after extracting the full back-up file, you’ll extract the first incremental
    back-up file that you created, and end with the latest incremental back-up file,
    like so:


    ```

    $ tar xzvf downloads.tar.gz

    $ tar xzvf 31052014-downloads.tar.gz

    $ tar xzvf 07062014-downloads.tar.gz

    ```


    The contents of the folder will then be restored as they were when you created
    that last snapshot. If you aren’t interested in creating incremental backups,
    and are looking for an easy-to-use tool, check out the graphical Déjà Dup app.
    The app has a minimal interface and doesn’t overwhelm new users with very many
    options. It is used as the default back-up tool on several distros, including
    Ubuntu.


    To use Déjà Dup, mark the folders you wish to back up and specify where you want
    them to be saved. This can be on the hard disk, or a remote location that you
    can connect to via SSH, FTP or Samba. You can also set a schedule and the app
    will back up the selected folders in the background.


    While this tutorial is by no means an exhaustive list of a system administrator’s
    role, you should now have the skills required to take adequate care of your computer.
    If you need more detail, jump back to page 104 for our Terminal series.


    # Schedule tasks


    There are some admin tasks – creating backups and large downloads, for example
    – that are far more effective when you execute them as per a schedule.


    The at command helps you schedule tasks that you need to run at a specific time
    and date. For example, if you need to download a large file, it’s best to schedule
    it late in the night or very early in the morning. The command at 1am tomorrow
    will change the prompt to at> and everything you type at this prompt will be run
    at the specified time. To download a file, point to its location with the wget
    command. Press the [Enter] key to specify another command – for example, if you
    want to move the file to a specific folder. When you are done, press [Ctrl]+[D]
    to save the job. At the designated time, the at command will perform the actions
    specified. The at command allows fairly complex time specifications. In addition
    to AM and PM, it also accepts times in the HH:MM format and recognises particular
    dates as well.


    When you press [Ctrl]+[D] to submit a job, the command prints a job ID. Use the
    atq command to list all submitted jobs, which you can then remove with the atrm
    command by suffixing the ID of the job you wish to delete.


    If you wish to run a task repeatedly, you’re better off using the cron daemon.
    Use this command to edit your crontab file:


    ```

    crontab -e

    ```


    The first time you run the command, you will be asked to select one of the available
    command line text editors.


    Each job is specified in seven fields that define the time to run, the owner,
    and the command. The first five commands specify the execution time, the sixth
    defines the day of the week, and the last field lists the command to be executed.
    You can use the crontab -l command to list your scheduled jobs. System-wide crontabs
    are stored in /etc/crontab, whereas user-specific crontabs can be found under
    the /var/spool/cron directory.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_122_1.png)


    You can find utilities on the internet which help you to set up crontabs easily.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# Sudo: Control root access


    If you''ve come this far it''s time to revel in the god-like powers of the superuser,
    using sudo to grant the wishes of lesser beings.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_123_0.png)


    Linux keeps the administrative user separate from any of the other users on the
    system. Even if you are the only user on your computer, there is still a root
    or superuser account that has to be used for certain tasks. Some distros, such
    as Ubuntu, attempt to hide the superuser account, you cannot log in as root but
    it''s still there – the system would not work without it. So why do you sometimes


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_123_1.png)


    The various desktops have UI versions of sudo, which are used when running root
    commands from the desktop.


    need to work as root, how do you do it and how can you allow other users to perform
    root tasks without giving them carte blanche with your system? The traditional
    way to give root access is with the su command. This command, which stands for
    switch user, not superuser, enables you to become another user for as long as
    it is running. When run in a shell with no arguments, it lets you into the root
    account (provided you know the root password). It is not exactly the same as logging
    in as root, you still retain some elements of your current environment. To provide
    as close as is possible to a login environment, add the -l option. We said the
    su stands for switch user as it defaults to switching to root, but you can give
    a username to the command, eg:


    ```

    $ su -l fred

    ```


    Once you have run su, you will stay as that user until you type exit, or press
    Ctrl+D. This is not necessarily a good thing, leaving a shell open as root is
    not good security practice, so you can pass it a single command to run with the
    -c option:


    ```

    $ su -c "ifconfig eth0 up"

    ```


    This doesn''t open a shell session, instead, after asking for the root password,
    it runs the command given.


    # Then came sudo


    The traditional su has some drawbacks: it requires the user to know the root password,
    it then lets them run anything they like and they can leave a root shell running
    after they have done what they need. The su -c method is clumsy if you want to
    run more than one command, requiring the root password for each one. The answer
    to all of these is sudo, which most distros use nowadays.


    The sudo command works differently. First, it''s used to run a single command,
    such as:


    ```

    $ sudo ifconfig eth0 up

    ```


    Note: We don''t need to enclose the command in quotes now. Second, it asks for
    your passwords, not the superuser''s, so there is no need to give anyone the root
    password (in fact, Ubuntu doesn''t have one by default). Try running another command
    with sudo and you will see another difference, it doesn''t ask for your password
    again. It will also allow you to run another command within five minutes of the
    previous one without entering a password. That timeout can be changed in the configuration
    file if you wish.


    If the user only needs to give their own password to run a'
