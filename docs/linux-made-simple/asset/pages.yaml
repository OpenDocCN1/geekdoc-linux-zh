- pgno: 88
  md: '# Low-resource distros


    # The verdict


    The goal of this roundup was to help you find a Linux distro that runs as fast
    as possible even on old computers, while still being usable by people with little
    Linux experience. This distro should support both office productivity jobs (text,
    spreadsheets and presentations) and popular web services, from home banking to
    online video. Ideally, it should do so through the same apps used for such activities
    on mainstream Linux desktops, if not on Windows, or using alternatives with comparable
    features and user friendliness. The system should satisfy these requirements right
    after install, or by installing packages from the internet with more or less the
    same skills necessary to perform the same tasks on more popular Linux systems.
    Oh, and it should also look good, if possible. Puppy can do more or less all those
    things, is fast and really small, too (the version tested is a 168MB download).
    To tell the truth, Puppy is also such a great


    package, engineering-wise, that we were really tempted to declare it the winner.
    We can''t, though, for one reason: it is not multi-user, at least not in a way
    that would easily allow Linux novices to share one computer. Absolute Linux could
    be perfect for people who need only an office suite and a modern browser, especially
    if they prefer vintage interfaces. The bare default styling of Manjaro and Crunchbang
    may be even more intimidating than the ancient-looking icons and menus of Puppy
    and Absolute. This issue, however, can be easily fixed, and both systems make
    software installation and upgrades easier than the other two. Online galleries
    of Enlightenment screenshots show how easy it is to misuse its flexibility, making
    it so baroque that getting things done becomes harder. That said, Elive is fast
    even with its default animations, and turning them off is easy. Elive''s


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_88_0.png)


    Elive makes it easy to love and use Linux, even if all you have is a five-year-old
    (or even older) computer.


    Enlightenment configuration is a very good balance between performance, ease of
    use and visual appeal. On top of that, software management is done with the same
    GUI tools already familiar to many Linux users. So let''s declare Elive the winner,
    even if it is the biggest download here (about 2GB).


    > "Elive offers a balance of performance, ease of use and visual appeal"


    1st Elive ★★★★☆

    Web: www.elivecd.org Licence: N/A Version: 2.2.1 Alpha Hybrid

    » Fast, good looking, and easy to manage with common Linux tools.


    4th Puppy Linux ★★★☆☆

    Web: http://puppylinux.org Licence: N/A Version: Slacko 5.7 NO-pae

    » For very old or single-user computers, it could well be the best solution.


    2nd Crunchbang ★★★★☆

    Web: http://crunchbang.org Licence: N/A Version: 11-20130506

    » A great window manager and a more flexible browser than Manjaro.


    5th Absolute Linux ★★★☆☆

    Web: www.absolutelinux.org Licence: N/A Version: 14.05 large

    » Ideal if all you need is a browser and office suite; a bit limited otherwise.


    3rd Manjaro ★★★★☆

    Web: http://manjaro.org Licence: N/A Version: 0.8.9 OpenBox

    » Almost on a par with Crunchbang, with more OpenBox config tools.


    Over to you...

    Did we overlook your favourite little low-resources distro? Email your opinions
    to lxf.letters@futurenet.com


    # Also consider...


    This roundup isn''t just for those who need to keep old hardware up and running.
    Even if you''re satisfied with the performance of your current Linux desktop,
    why not try alternatives that may be even faster?

    You should try Puppy Linux at least once, to get a taste of what Linux desktop
    development may have been. However, while Puppy is in a


    world of its own, the other distros here have one thing in common: most of their
    speed gains over the vanilla versions of both their ancestors (Slackware, Arch
    Linux and Debian) and other common distros come from not using any form of Gnome
    or KDE.

    So the lesson to take home is this: if your computer is slower than you can tolerate,
    don''t


    change distro. Install and tweak OpenBox, Enlightenment or IceWM instead. If that
    isn''t enough, turn off file indexers and similar resource-hungry daemons. If
    that still isn''t enough, try what is advertised as a ''low-resource'' derivative
    of the distro that you are already using. Making Linux run faster could be much
    easier than you may think!'
