    # Remember Moore’s Law


    Moore’s Law predicts a doubling of computer capacity every two years. Unless you
    plan to build a new computer every year, you should allow for your needs increasing
    during its lifetime. Always allow for spare capacity, if you want 16GB of RAM,
    buy a motherboard that takes 32GB and half-fill it. Your storage use will


    tend to increase too. 4K video is on the way, so build a system with more drive
    bays and SATA connectors than you need now. Storage and memory are easy to increase,
    provided you have left yourself the option. Hopefully your processor and motherboard
    will last you several years.


    # What do you need?


    There are several standard building blocks needed to build a computer. As a minimum,
    you will need: processor, motherboard, memory, storage drive, graphics card, case
    and power supply. You may also need a monitor, keyboard and mouse; but you could
    be building a media centre that uses a remote control and plugs into a TV, or
    a headless server such as a NAS box.


    so an SSD is ideal. A NAS is the opposite, lots of space needed but speed is not
    critical, so a slower spinning hard drive would be better. Linux users have another
    aspect to consider: compatibility. While the situation is far better than at any
    time in the past, there are still components that are better supported than others.
    Let’s work through the main components you will need and look at your options.


    Over the next few pages we will look more closely at each of these, explaining
    the choices to be made. The idea is not to tell you which components to choose
    but to give you the information to make that decision for yourself based on your
    particular needs. When you have built your computer, you will then need to install
    an operating system and software. Naturally, we assume you will install Linux
    but you may also need to install Windows for gaming or some other particular software
    needs, so we will look at how to install the two OSes in perfect (well, almost)
    harmony.


    # Processor


    The first decision to be made is which processor to use, as this affects your
    choice of motherboard and then just about everything else. The choice may seem
    obvious: get the fastest you can afford, but things are never that simple. The
    fastest processors are also the most expensive, often by a substantial


    You can buy one of these and get whatever the maker puts inside, or you can assemble
    it yourself and get exactly what you want.


    Why build your own computer? You may be able to save money by sourcing the components
    yourself, but don’t bank on this. What you do get to do is pick the exact specification
    you want – no throwing away parts to upgrade to what you really wanted. You also
    get to choose the quality of components you use. A pre-built PC may say


    > “There are still components that are better supported than others.”


    it has a 2TB hard drive, but that tells you very little. Most hard drive manufacturers
    produce several drives of that size, with varying speeds, power consumption and
    intended usage. You will learn a lot more about components doing it yourself,
    and while putting together a desktop PC is not difficult, doing so will give you
    the confidence to dive back inside it when you want to upgrade. You can also upgrade
    incrementally – once you have a computer you understand, you can increase its
    hard disk or memory capacity now, then add a faster processor and motherboard
    next year.


    # Choosing the components


    When it comes to choosing your components, you need to take into account what
    you will use the computer for now and what other uses are likely. The usage can
    dramatically alter the choices you make, eg a gaming system needs fast storage
    but not a lot of it for the OS and current games you are playing.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_48_1.png)


    Find the price-performance sweet spot for your preferred processor manufacturer.


    # Linux compatiblity


    Hardware support in Linux is very good nowadays. Most devices are supported directly
    in the kernel. There is no need to go trawling manufacturers’ websites for drivers.
    When you are buying components for your own computer, you need to know whether
    there’s support for the hardware before you buy a component. The first step is
    to determine the exact component in use, which is not as easy as it sounds. The
    motherboard maker’s website may state it has a Gigabit Ethernet port, but not
    tell you which chipset, so you will have to do some research. Typing the full
    product code and the word Linux into your favourite search engine will normally
    give plenty of hits. It’s worth restricting your search to recent posts, there
    is no point reading complaints about your choice not being supported a year ago
    when it is now. Look for posts that give details, such as chipset codes and module
    names and avoid the


    rants. Asking in web forums, like our own (www.linuxformat.com/forums) or at www.linuxquestions.org,
    about the support for a particular device should get you some first-hand experiences,
    but search the forums yourself first. Your question may have already been answered
    and no one like questions from people too lazy to do their own research. Compatibility
    problems usually arise because the manufacturer gives no help to the kernel driver
    developers so everything has to be reverse engineered – this commonly applies
    to wireless adaptors but some sound cards are also affected. Another reason may
    be that the hardware you are looking at is so new that support has not yet been
    added to the kernel of your current favourite distro. You may need to look at
    a newer, more bleeding edge release to get support. This seems to affect things
    like network adaptors, wired and wireless, the most.'
