- pgno: 124
  md: 'command as root, what is to stop any user running any command as root? The
    answer lies in the configuration file at /etc/sudoers. This specifies exactly
    who can do what, giving fine-grained control over execution permissions. The default
    configuration is to allow members of the wheel group to execute any command. Some
    distros change this to a different group name, such as admin (wheel – as in you’re
    a big wheel – is a traditional name for a group with elevated privileges that
    predates even Unix). Most installers make the user created during installation
    a member of that group, subsequent users are not unless added specifically. This
    means the user that installed the distro is automatically given admin privileges,
    without the need for anyone to open a root terminal or even know the root password.


    # visudo not vi


    You can grant sudo privileges to other users by editing /etc/sudoers, but you
    should never do this manually. If you were to edit this file and introduce a syntax
    error, you could potentially stop sudo working. As you need it to edit this file,
    you need to be root to even read the file for security reasons, you would not
    be able to undo your mistake. The answer is the visudo command, which creates
    a temporary copy of /etc/sudoers and loads it into your editor. After you have
    edited the file, visudo checks that it’s correct before overwriting the real /etc/sudoers
    file. The name may imply that this uses vi to do the editing, but fear not, that’s
    only the fallback option. In fact, visudo uses your default editor, which may
    be defined in the EDITOR environment variable, or the system-wide setting in the
    alternatives system on Ubuntu and other Debian-based distros.


    To change the system default editor, run:


    ```

    $ sudo update-alternatives --config editor

    ```


    You can set the EDITOR environment variable in your profile or choose it on the
    command line, like this


    ```

    $ EDITOR="gedit" sudo -E visudo

    ```


    The -E is needed to make sure the environment variable is passed through to the
    root user, more on environment variables later. Now we know how to edit the sudoers
    file, let’s see what we can do with it. The file contains two main types of entries:
    aliases, which are basically variable definitions, and user specifications. The
    latter entry sets who can do what, eg the default file contains a line like:


    ```

    %wheel ALL=(ALL) ALL

    ```


    The basic format of this line is "who where = (as_whom) what". The % at the start
    of the name means this is a group and applies to all members of it. The ''where''
    is the hostname of the computer and the next item states which users the commands
    may be run as. The last item is a list of commands that can be run. ALL is the
    sudo wildcard, so this line means that members of the wheel group can run anything
    anywhere, a standard entry for the admin user. If you want to give the same privileges
    to another user, the simplest option is to add them to the wheel (or admin, depending
    on your distro) group:


    ```

    $ sudo gpasswd -a george wheel

    ```


    # Restricting root access


    What if you don’t want george to be able to do anything, but you want him to be
    able to edit web files, owned by the Apache user? You could use something like


    ```

    george ALL=(apache) ALL

    ```


    # Logging in as root


    Although the root account is disabled in some distros, you can work around this
    by running one of the following:

    $ sudo bash

    $ sudo -login

    If you want to prevent this, you can use ! to negate commands that cannot be run
    by the user to, eg:


    %wheel ALL=(ALL) ALL, /bin/bash,/bin/sh,/bin/zsh

    Why would you want to do this? One reason is that every command run with sudo
    is logged, making it easy to see who did what on a system with multiple administrative
    users. Switching to a root shell, as above, would negate that.


    There’s no leading %, so this is a username. We are still allowing all commands
    on all hosts, but only as the Apache user


    ```

    $ sudo emacs index.html

    ```


    would give an error, because sudo, like su, defaults to the superuser if none
    is specified. This would work because it’s run as the allowed user.


    ```

    $ sudo -u apache emacs index.html

    ```


    Of course, it still allows george to run any non-root command, although the scope
    in which he can run them is severely restricted. If we want to restrict his activities
    to editing files, we can do so like this:


    ```

    george ALL=(apache) /usr/bin/emacs, /usr/bin/vi

    ```


    We have replaced the final ALL with a list of commands, using the full paths and
    separated them by commas. We can also specify allowable arguments, so:


    ```

    george ALL=(ALL) /bin/mount /dev/sd[c-f]*, /bin/umount /dev/sd[c-f]*

    ```


    This will allow george to mount and unmount filesystems, but not on sda or sdb,
    so he can work with removable drives. There’s one more important addition to this
    line (although there are many more covered in the documentation), the NOPASSWD
    option means the user will not be prompted for their password – use with care!


    ```

    george ALL=(apache) NOPASSWD: /usr/bin/emacs, /usr/bin/vi

    ```


    # Environment variables


    Linux uses a number of environment variables to keep track, such as $HOME and
    $DISPLAY. The default behaviour of sudo is to clear most of these for the execution
    of the command. Which may not always be what you want. A brute force way around
    this is to run sudo with the -E option to keep them all. A more structured solution
    is to specify the ones you want to keep in sudoers, eg you may need this to be
    able to run GUI programs with sudo :


    ```

    Defaults env_keep += "DISPLAY HOME"

    ```


    There are various other settings you can add to /etc/sudoers, all of which are
    thoroughly documented, but this should be more than enough to get you started.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_124_0.png)


    The default configuration includes throwing mild insults at you if you give an
    incorrect password. You can turn this off for a more professional appearance.'
