- pgno: 130
  md: '![](img/57f4a2d286909b0a84c8ecfefbbe15f2_130_0.png)


    The bridge connects our wired and wireless interfaces, meaning wireless clients
    can be part of the 192 fun too


    simultaneously. Furthermore, some cards lack Linux support for Access Point mode
    entirely. To check the capabilities of your wireless adapter use the iw tool (sudo
    apt-get install iw, if you don''t have it). Running


    ```

    $ iw list

    ```


    will show you everything you could possibly want to know about your wireless devices.
    Check the ''Supported interface modes'' section and ensure that ''AP'' features
    somewhere. For a repeater set up you''ll want to check ''valid interface combinations''
    for ''AP, mesh point.'' Bear in mind that mesh protocols haven''t yet been standardised
    so we won''t try and cover them here. You''ll need to be sure your wireless driver
    supports 4-address frames if you want to have a go.


    # Building bridges


    So let''s reverse our previous setup – we''ll have an internet-facing wired connection
    to the gateway machine and we want to set up a local wireless network which provides
    access to this. In the previous section we used NAT to direct traffic between
    the internal and external networks, for this part we''ll show you the alternative:
    network bridging. In many ways this is easier to understand than NAT, since it
    effectively unifies the two (or more) networks – providing a transparent bridge
    over which traffic flows unimpeded. However, the NAT approach is a little more
    flexible and provides more granular control, so you may prefer to use it again.
    Whatever your preference, the first task is to install and configure the hostapd
    package (see the Hotspots With Hostapd box, p129).


    A network bridge amalgamates two disparate interfaces (eg our eth0 and wlan0)
    into a single interface, which in our example will be br0. Traffic will flow unimpeded
    between the two interfaces, and machines connected to our wireless hotspot will
    behave exactly as if they were connected to the same network as eth0. Hopefully,
    anyway. The first thing we''ll need to sudo apt-get install bridge-utils, or equivalent.


    ```

    $ sudo brctl addbr br0

    ```


    ```

    $ sudo brctl addif br0 eth0

    ```


    ```

    bridge=br0

    ```


    ```

    $ sudo service hostapd start

    ```


    Replace with systemctl start hostapt if you''re using Systemd. If everything works
    then enable the service. You can recreate the bridge setup in Network Manager,
    or by modifying /etc/network/interfaces. And that concludes our foray into the
    world of bespoke routers. We''ve covered two different set ups, but don''t be
    afraid to mix and match if you require, all these technologies will work together
    where it makes sense. We''ll also be covering replacing the firmware on your home
    router with Linux one of these days. For now we''re all huddled round an overclocked
    Raspberry Pi for Wi-Fi warmth.


    # Anonymising gateway


    A nice thing about this setup is that any routing beyond the gateway machine propagates
    trivially to our internal network. So if you have your gateway machine''s traffic
    routed through a VPN or Tor, then so can all our internal network traffic. Installing
    Tor is straightforward, the default config sets up a SOCKS proxy which you must
    connect your applications to. You can make this proxy available to the internal
    network by adding a line, such as SOCKSPort 10.1.0.254:9050 and TransPort 10.1.0.254:9040
    to /etc/tor/torrc.


    Then you can set up any applications running on our internal network to use that
    proxy. A more passive approach is to set the gateway machine up as a transparent
    proxy or an isolating proxy, but this is beyond the scope of this little box.
    You may subscribe to a commercial VPN provider, or even be running your own OpenVPN
    server somewhere on the internet. Either way, connection is usually achieved by
    setting up a TUN device (usually called tun0) on the client end. The routing table
    is then modified so that all traffic travels via tun0, redirecting everything
    through the VPN. If you have already successfully set this up on your gateway
    machine, then all that is required is a small addition to our NAT rules:


    ```

    $ sudo iptables -t nat -A POSTROUTING -o tun0 -j MASQUERADE

    ```


    Since VPN traffic travels through the tun0 interface, this line ensures that it
    can still find its way back to the internal network. As before, you can use SNAT
    here if ext0 has a static IP.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Minix 3: Test a microkernel OS


    Minix 3 has gone way beyond its educational origins with ARM compatibility, but
    microkernel reliability is still at its heart.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_131_0.png)


    Minix 3 is a microkernel-based Unix clone, targeted towards robustness, reliability,
    and a small memory footprint. In a microkernel, drivers and servers are isolated,
    running in User Mode, and restricted in the effects they can have on the rest
    of the system (more on this later). The price for this is a small performance
    overhead, and some design challenges, but performance is not as important here
    as security and stability for most users.


    Microkernels have a long history. In the ''80s, academics were convinced they
    were the only way forward for OS development, and Minix author Andrew Tanenbaum
    never considered designing Minix in any other way. It also meant Richard Stallman
    turned to a microkernel as the basis of the Hurd, the kernel of the GNU OS. The
    imminent arrival of GNU – and BSD Unix – motivated Tanenbaum to keep Minix as
    an academic OS, but that fitted well with the aims of having something small enough
    to teach from, and cover in his famous book, Operating Systems: Design and Implementation.


    Legal problems, and then technical challenges, held up the development of the
    Hurd, but Minix''s tight focus enabled Tanenbaum to produce Minix 1 more or less
    single-handed, and three decades of putting the few thousands of lines of kernel
    code under close scrutiny while his doctoral students at Vrije Universiteit, Amsterdam
    worked on every area, have built a solid foundation for Minix 3.


    Despite historical spats with Linux (see Ancient history, opposite) and the education-targeted
    early releases, Minix has become an appealing OS for many users, particularly
    as it''s gradually integrated the NetBSD userland. This has been achieved largely
    because of millions in EU funding focused on ''secure and reliable'' OS development,
    and many generous contributions from the Google Summer of Code.


    The Minix team presented the latest version at FOSDEM this year and the ''MINI
    UnIX'' has grown in scope, but not in bloat. ARM support, for instance, has made
    it into the master code branch, and the team say that version 3 has "more complete
    source compatibility with NetBSD in terms of utilities, calls, types (lots of
    64-bit), toolchain, codebase and packages", with "all Minix-specific code in a
    top-level minix/ subdir".


    Minix 3.3.0 isn''t really production-ready, but it could make a stable base for
    a number of projects, so we''d encourage you to try it, whether on a BeagleBoard
    or a virtual machine, and keep an eye on developments.


    Unfortunately, for those wanting to tinker outside of ARM boards on an old PC,
    in a desktop fashion, there''s a major stumbling block: the X Window System, which
    was working in the previous release (based on a monolithic XFree86 server), has
    spectacularly broken. At time of writing, the current release of Xorg was being
    ported, but still wasn''t ready, so it''s command-line only for now. You can,
    however, download previous releases if you really want to try the desktop. Not
    all NetBSD packages will run, but compatibility is improving and building from
    source may enable you to get favourite packages onto your system that aren''t
    in the repos.


    # Inside the (virtual) box


    Minix 3 will install on your x86 PC, but hardware compatibility is limited. Any
    i586 processor or later should be fine, although problems have been reported on
    Pentium 4, and the system can work with as little as 32MB of RAM. Peripherals
    are another matter, however: the list of compatible network cards is short, but
    includes those emulated by Bochs, Qemu, VirtualBox, Virtual PC and VMware, as
    well as the BeagleBone''s LAN8701A. The remainder of the list is mostly old classics,
    which will seem familiar if you happen to have experimented with alternative OSes
    from a decade or more ago: 3Com 509, NE2000, Realtek RTL8139. At least the Intel
    PRO option is one you''re more likely to have on hardware that hasn''t been consigned
    to the attic.


    It''s probably better to grab a recent Qemu or VirtualBox from your distro''s
    repository: we did most of our installs on'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Ancient history: Tanenbaum vs Torvalds


    The Minix 1 source code was available on floppy disks, and in the appendix to
    Andrew S. Tanenbaum''s 1987 book Operating Systems: Design and Implementation.
    Soon a Usenet group grew around Minix with 40,000 subscribers, including Linus
    Torvalds who added new features. However, he grew frustrated with Tanenbaum''s
    unwillingness to let Minix grow away from its tight educational focus, so in 1991,
    Torvalds announced on comp.os.minix: "I''m doing a (free) operating system (just
    a hobby.


    won''t be big and professional like GNU." When Torvalds was later accused in a
    book of stealing Minix code, Tanenbaum defended him, but rather waspishly said:
    "Linus didn''t sit down in a vacuum and suddenly type in the Linux source code.
    He had my book, was running Minix, and undoubtedly knew the history (since it''s
    in my book). But the code was his. The proof of this is that he messed the design
    up." The Tanenbaum–Torvalds debate, revisited in the appendix to the 1999 book
    Open Sources:


    Voices from the Open Source Revolution was a comp.os.minix thread over two weeks
    early in 1992, over the merits of monolithic kernels and microkernels – starting
    with a Tanenbaum contribution best summed up as ''monolithic kernels are obsolete.''
    It trailed off inconclusively, but after a few years many claimed ''Linus won'',
    simply because of Linux''s market share. The debate continues, but you can find
    Tanenbaum''s more recent thoughts on the matter at http://bit.ly/ReliableOS.


    the latter. Click the big New button at the top left of the VirtualBox window,
    and name your VM. We used MINIX3. Choose Other in both dropdown menus for OS type
    and version; on the next screen give it as much RAM as you can spare. We''d suggest
    that 256MB is adequate for Minix 3, but naturally more is better while you''re
    exploring a new environment and pushing to see what it can do. We kept the default
    2GB disk size on one VM install, and expanded to 8GB for another. Be inclined
    towards the latter if you''re going to install everything Minix 3 has to offer,
    but bear in mind 3.3.0''s lack of some software from previous releases.


    Click Create and you''ll see a MINIX3 VM listed in the left pane. Before starting,
    go to Settings, and tick the Hardware clock in UTC time checkbox, and check that
    Storage points to your downloaded ISO file. You can now start up the VM from the
    GUI. On a Core 2 Duo machine, without VT-x/AMD-V/ nested paging, we had to start
    VirtualBox with:


    ```

    VBoxSDL --startvm MINIX3 --norawr0 --norawr3

    ```


    Now follow the instructions in the walkthrough overleaf. Once the installation
    is complete, use poweroff instead of shutdown to halt the machine. Go back to
    Settings > Storage in VirtualBox, get rid of the ISO, and point at the newly created
    virtual disk image instead. Now boot with VirtualBox''s Start button (or use the
    workaround on PCs without VT-x and AMD-V virtualisation extensions).


    # Running on a BeagleBoard


    With 3.3.0, the ARM port of Minix is finally integrated in the master code branch,
    along with the official x86 port. Targeted at the BeagleBoard, with its Cortex-A8-based
    system on a chip (SoC), it runs with varying degrees of success on the


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_132_0.png)


    VirtualBox is your best bet for trying out Minix 3, sweeping away hardware compatibility
    issues.


    BeagleBoard-xM (and its Qemu-based emulator), the BeagleBone, and the BeagleBone
    Black. Pre-built 3.3.0 images are available, but you''ll miss out on the latest
    developments. To build a disk image for your BeagleBoard, make a directory at
    ~/minix and cd to it – or to wherever you prefer to do the cross-compile – then
    get the source code:


    ```

    $ git clone git://git.minix3.org/minix minixsrc

    ```


    Now cd to minixsrc/ and make a .settings file for BeagleBoard-xM use:


    ```

    # beagleboard-xm

    U_BOOT_BIN_DIR=build/omap3_beagle/

    CONSOLE=tty02

    ```


    And for the BeagleBone:


    ```

    #beaglebone (and black)

    U_BOOT_BIN_DIR=build/am335x_evm/

    CONSOLE=tty00

    ```


    Provided you have g++, the GNU C++ compiler, installed, the build tools in Minix
    will provide you with everything almost else. On Ubuntu you''ll also need to:


    ```

    apt-get install zlib1g zlib1g-dev

    ```


    The build tools are based on NetBSD''s build.sh. Call the ARM-specific version
    with:


    ```

    ./releasetools/arm_sdimage.sh

    ```


    and you should find a minix_arm_sd.img waiting for you to copy across to your
    SD card, for booting your BeagleBoard or BeagleBone:


    ```

    sudo dd if=minix_arm_sd.img of=/dev/mmcblk0 bs=1M oflag=direct

    ```


    Put the card in your BeagleBoard, boot up and you can log in as root. Ethernet
    isn''t working on the BeagleBone, but on the BeagleBoards run netconf and select
    the LAN8710A. USB support on the BeagleBone is tagged as experimental, and there
    are known issues with hot-plugging on USB hubs in 3.3.0. Audio and the analogue-to-digital
    aren''t yet working either, but GPIO is.


    This is a promising first release of the port, and if you''ve got a BeagleBoard,
    it''s a good sandbox for trying out Minix, particularly as this port will receive
    a lot of developer time, so you''ll see improvements if you keep checking out
    the code. You can also try the ARM port under emulation with Linaro Qemu, the
    custom version of Qemu for the BeagleBoard-xM. You can find instructions at: http://bit.ly/LinaroQemu.


    # Reliability through architecture


    Although at an early stage, the ARM port makes sense for an OS that sells itself
    on reliability and low resource use. The embedded ARM space covers thousands of
    different devices where the job of the operating system is, essentially, not to
    fall


    # Quick tip


    So often *nix problems come down to either permissions or DNS. If you can''t get
    pkin to work after you install on VirtualBox with NAT, put our old friend 8.8.8.8
    in /etc/resolv.conf, instead of 127.0.0.1'
