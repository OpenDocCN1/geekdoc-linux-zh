    a listing of functions defined in the currently opened file, and much more.

    www.geany.org


    # APTonCD


    Suddenly realise that you need to move your Ubuntu installation or need to give
    a friend a copy of your setup? With APTonCD Ubuntu users can back up all of their
    installed packages to an ISO image, which can then be added as a software source
    on another installation. You can use this source to restore the packages on to
    the system or keep everything in the APT cache.

    aptoncd.sourceforge.net


