- pgno: 67
  md: '# Link a Pibrella to Minecraft


    # 1 Attach Pibrella to your Raspberry Pi


    We''ll use the big red button on the Pibrella.com to set off TNT in Minecraft.
    The Pibrella fits over the first 26 GPIO pins. Never attach while the power is
    on! Use a blob of blu tack or modelling clay to prevent the underside shorting
    out the HDMI. Now connect the other cables as usual, but insert the power into
    the micro USB port.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_67_0.png)


    # 2 Setup Pibrella


    With our Pi booted to the desktop, open LXTerminal and type:


    ```

    sudo apt-get update

    sudo apt-get install python-pip

    sudo pip install pibrella

    ```


    This installs the software that we need to use Pibrella with Python.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_67_1.png)


    # 3 Get the code


    We''ve created a GitHub repository that contains the code for this tutorial, visit
    https://github.com/lesp/Pibrella-Minecraft-TNT and download a copy. Next open
    LXTerminal and type


    ```

    sudo idle

    ```


    This opens idle, a Python editor, with elevated privileges enabling us to use
    Pibrella with Python. Now open the example code.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_67_2.png)


    # 4 Examining the code


    Our code is written in Python 2 as the Minecraft module is currently only available
    for that version. The code is fairly easy to read. Note the line starting with
    # are comments. The first few lines are imports, they import extra functionality,
    in the form of Pibrella and Minecraft libraries, for our project. After that we
    use a variable called mc to store connection details to Minecraft.


    ```

    import mcpi.minecraft as minecraft

