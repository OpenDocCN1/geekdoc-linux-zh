    in which case you can try another card.


    While the Intel vs AMD CPU war and the Nvidia vs AMD graphics war will continue
    to rage on, Intel provides excellent support for its components. If your laptop
    has both Intel graphics and wireless cards, it won''t go far wrong and everything
    should just work with no need to install extra drivers. Now grab your favourite
    distro and enjoy the speed and freedom of Linux!


    # Careful now


    Building a PC isn''t difficult, but some care is needed when working with electronic
    components. Prepare a large working area, clear of any clutter and with a non-conductive
    surface. Static electricity can kill electronic components, and it can build up
    on your body without you noticing, until you pick up a component and zap it. You
    can avoid this by earthing yourself to discharge and static build up. The simplest
    way to do this is to touch


    a grounded object, such as a central heating radiator or the kitchen sink before
    touching a component. You can also buy anti-static wrist straps that connect to
    a grounded point by flexible cable to keep you static free during your build.
    The computer you build will not have a warranty, but the individual components
    will. As long as the fault wasn''t caused by damage while fitting them, any reputable
    vendor will replace them.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_54_0.png)


    # 8 Testing, testing


    Connect a monitor and keyboard and power up the computer. Hold down the relevant
    key that loads the BIOS/firmware menu and go straight to the system health page
    to make sure your CPU is running cool enough. Only then should you check that
    all of your memory and drives are recognised. Some motherboards may need a setting
    changed to make all memory visible, but your new PC is now built!


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_54_1.png)'
