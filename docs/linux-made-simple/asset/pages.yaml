    a handy Windows


    # Access your data


    You can also access the graphical Nautilus file manager by clicking the ''Files''
    shortcut on the Launcher. It provides a familiar two-paned window, with a series
    of shortcuts on the left and the contents of the currently selected folder or
    drive on the right. By default, items are displayed in a grid, but you can switch
    to list view using the buttons in the top-right. You''ll also see a ''Search''
    button, which enables you to search the currently selected folder (and any sub-folders).


    > "Ubuntu can detect both FAT32 and NTFS, so accessing your old data shouldn''t
    be an issue"


    If you want to copy data from your Windows partition to your user folders in Ubuntu,
    browse to one of your user folders – Documents, for example – then click and drag
    all of its contents to the ''Documents'' shortcut in the left-hand pane. It pays
    to make sure you have enough free drive space. If you plan to continue using Windows
    alongside Ubuntu, a better solution is to set up a spare drive or partition as
    a dedicated data drive, allowing both Ubuntu and Windows to access the same copy.
    This needs to be a FAT32 or NTFS partition so Windows can access it as well as
    Ubuntu.


    Network shortcut for accessing Windows PCs. Alternatively, if you know the computer
    name, click ''Connect to server'' and type smb://comp-name then click ''Connect''.
    Have your username and password ready if necessary.


    Assuming such a partition is in place, set it up by first booting back into Windows.
    Now create dedicated folders for Documents, Pictures, Music and Videos on your
    data partition. Open your Windows User folder, right-click your ''Documents''
    folder and choose ''Properties > Location tab''. Click ''Move'' and select the
    ''Documents'' folder on your data partition. Click ''OK'', then enable it to move
    all your existing data to the data partition. Repeat for your other folders.


    Ubuntu should automatically handle all of your PC''s hardware, using generic drivers
    if necessary, but you can review what''s been installed, plus look for additional
    drivers (specifically for gaming, Wi-Fi or printing) using the Software & Updates
    app. Open a Search box, type software and then click the ''Additional Drivers''
    shortcut. It will search for any driver updates that may exist and alert you to
    any alternative or proprietary drivers you may have installed.


    Once done, boot back into Ubuntu. Your files should now be easily accessible from
    the data partition, enabling you to make changes to them using both Windows and
    Ubuntu


    If you store data in the cloud, the good news is that Ubuntu supports a wide range
    of cloud providers – a good thing, seeing as it recently dropped its own Ubuntu
    One cloud storage service. Some providers are officially supported on Linux, such
    as Dropbox (www.dropbox.com/install). If you''re looking for heaps of free storage,
    then Google Drive offers 15GB, but as yet there''s no official Ubuntu support.
    A number of third-party offerings do exist, though, and if you''re prepared to
    pay $15, InSync (http://insynchq.com) is the tool of choice. You could even use
    OwnCloud to set up your own storage...'
