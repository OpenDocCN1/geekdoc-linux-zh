  img_proc: true
- pgno: 141
  md: '![](img/57f4a2d286909b0a84c8ecfefbbe15f2_141_0.png)


    Part of an Nmap ping scan on a LAN as captured by Wireshark.


    extremely difficult to discuss TCP/IP without talking about the Internet and vice
    versa. Every device that uses it has:


    +   - An IP address This address must be unique at least to its local network.

    - A network mask Used for dividing big IP networks into smaller networks that''s
    related to the current network,

    - One or more DNS servers Used for translating an IP address to a human-memorable
    format and vice versa

    - A Default Gateway This is optional if you want to communicate with devices beyond
    your local network. A Default Gateway is the network device that TCP/IP sends
    a network packet to when it doesn''t ''know'' where else to actually send it.


    Every TCP service listens to a port that is unique to each machine. A machine
    that supports the HTTP protocol, the protocol that serves WWW, is also called
    an HTTP server. Similarly there exist FTP servers, DNS servers, etc. It''s the
    two pairs of the IP addresses and port numbers on both ends of a TCP/IP interaction
    that uniquely identify a connection between two machines that use TCP/IP.


    A TCP packet (see the format of a TCP and an IP packet segment, pictured on p140)
    can be used to establish connections; transfer data; send acknowledgements, advertise
    the buffer that holds incoming data, which is called Window Size, and close connections.
    As you can see in the packet screenshot (see p141), each TCP segment has a header
    part and a data part.


    # The TCP 3-way handshake


    TCP provides a connection-oriented, reliable byte stream service. It''s a full
    duplex protocol, which means that each TCP connection supports a pair of byte
    streams, one flowing in each direction. The term ''connection-oriented'' means
    the two applications using TCP must first establish a TCP connection with each
    other before exchanging any data.


    The TCP header includes a 6-bit flags field that''s used to relay control information
    between TCP peers. The possible flags include SYN, FIN, RESET, PUSH, URG, and
    ACK. SYN and ACK flags are used for the initial TCP 3-way handshake as you will
    see in a while. The RESET flag signifies that the receiver wants to abort the
    connection.


    The TCP three-way handshake goes like this: the client sends a TCP SYN packet
    to the server, and its TCP header includes a sequence number field that has an
    arbitrary value


    Quick tip

    When you put your network card in promiscuous mode, you allow the network device
    to catch and read every network packet that arrives to it even if the receiver
    is another device on the network. Network packets still go to their original destination.


    in the SYN packet. The server sends back a TCP (SYN, ACK) packet which includes
    the sequence number of the opposite direction and an acknowledgement of the previous
    sequence number. Finally, in order to truly establish the TCP connection, the
    client sends a TCP ACK packet to acknowledge the sequence number of the server.
    After the TCP three-way handshake, the connection is established and is ready
    to send and receive data.


    The traffic for this case was produced by running the following command:


    ```

    $ wget http://www.linuxformat.com/

    ```


    After some necessary DNS, ARP and ICMP network traffic, the TCP three-way handshake
    begins (pictured top, p71). The client IP address is 10.0.2.15 and the destination
    IP address is 80.24.178.150. A pretty simple display filter (tcp && !http) makes
    Wireshark display 63 out of 82 packets. The three packet numbers used in the handshake
    are sequential because the host wasn''t performing any other network activity
    at the time of capturing, but this is rarely the case.


    # Ping scans


    This part will examine the network traffic that''s produced by Nmap when it performs
    a ping scan.


    LAN ping scans are executed using the ARP protocol. Hosts outside a LAN are scanned
    using the ICMP protocol, so if you execute a Nmap ping scan outside of a LAN,
    the traffic will be different from one presented. In the example below, the Nmap
    command scans 255 IP addresses, from 10.67.93.1 to 10.67.93.255. The results show
    that at execution time only 10 hosts were up or, to be precise, only ten hosts
    answered the Nmap scan:


    ```

    $ sudo nmap -sP 10.67.93.1-255

    ```


    ```

    Starting Nmap 6.47 ( http://nmap.org ) at 2014-09-05 11:51 EEST

    Nmap scan report for xxxxx.yyyyy.zzzzz.gr (10.67.93.1)

    Host is up (0.0030s latency).

    MAC Address: 64:70:02:AD:E9:44 (Tp-link Technologies CO.)

    Nmap scan report for srv-gym-ag-anarg.att.sch.gr (10.67.93.10)

    Host is up (0.0051s latency).

    MAC Address: 00:0C:F1:E8:1D:6E (Intel)

    Nmap scan report for 10.67.93.20

    Host is up (0.0066s latency).

    MAC Address: D0:27:88:1D:15:20 (Hon Hai Precision Ind. Co.Ltd)

    Nmap scan report for 10.67.93.21

    Host is up (0.0053s latency).

    MAC Address: D0:27:88:1D:D6:FB (Hon Hai Precision Ind. Co.Ltd)

    Nmap scan report for 10.67.93.22

    Host is up (0.0080s latency).

    MAC Address: 00:1A:92:44:D7:67 (Asustek Computer)

    Nmap scan report for 10.67.93.29

    Host is up (0.0057s latency).

    MAC Address: 00:78:E2:47:49:E5 (Unknown)

    Nmap scan report for 10.67.93.78

    Host is up (0.0023s latency).

    MAC Address: 00:80:48:24:6A:CC (Compex Incorporated)

    Nmap scan report for 10.67.93.147

    Host is up (0.0028s latency).

    MAC Address: 00:14:38:64:5D:35 (Hewlett-Packard)

    Nmap scan report for 10.67.93.172

    Host is up (0.016s latency).

    ```'
