- pgno: 58
  md: '# Recovery disks


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_58_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_58_1.png)


    # 1 Back up to USB


    Plug in a USB stick or SD card of at least 2GB capacity, open Chrome and type
    chrome://imageburner into the location bar. Chrome OS downloads and installs the
    recovery image for your Chromebook. If you have more than one model of Chromebook,
    run this separately for each one; it gets the correct image for that device.


    # 2 Create the recovery disk


    After downloading, the image is written to your USB stick. If you don''t create
    a recovery disk, it''s also possible to get this image from another computer and
    copy it manually, by following the instructions at http://google.com/chromeos/recovery,
    but you have to make sure you get the right image – they are specific to each
    model.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_58_2.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_58_3.png)


    # 3 In case of emergency


    If you corrupt Chrome OS and get the following scary ''Chrome OS is missing or
    damaged'' message, plug in your recovery medium. You can also force a recovery,
    if you want to go ahead and restore it anyway, by pressing the hard reset button
    or key combination, which varies from model to model. Check your Chromebook''s
    documentation for whatever applies.


    # Crouton: the pros and cons


    Comparing a £200 Chromebook to a full laptop may seem unfair – it is more in the
    netbook price range, and aimed at a similar market – but we''ll do that anyway.
    Running Ubuntu or Debian on a Chromebook is just like running it on a proper laptop.
    The only differences are down to the use of a chroot. This means you have to boot
    into Chrome OS first and then open a shell to start the chrooted session, but
    Chromebooks are designed to be suspended rather than shut down, so this isn''t
    necessarily often. Because it uses the hardware through Chrome OS, you need to
    do things such as set up your network connection in there, but as you can switch
    between the operating systems at will, this is not a problem. This isn''t dual
    boot; it''s running both systems at once – far more convenient. The main limitation
    with this setup is the lack of storage space and dependence on a network connection
    and cloud services. While Chrome OS handles this transparently, you need to set
    up some sort of online syncing from your chrooted distro, using services, such
    as OwnCloud, Spideroak or Dropbox. There are other ways of installing Linux on
    a Chromebook but Crouton does it in the least intrusive way, leaving your existing
    OS untouched (apart from needing to enable Developer Mode). Trying multiple options,
    and removing them when done, is also a key benefit of this approach. Not least
    of its strengths is that Crouton is developed by the Chrome OS authors and isn''t
    a third-party hack. Future updates to Chrome OS could break your chroots temporarily,
    but an update through Crouton will fix that.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_58_4.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Build your own Steam Machine


    Explosive AAA gaming has arrived on Linux with over 1,000 titles available. Building
    your own dedicated gaming box has never been easier.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_59_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_59_1.png)


    Gaming on Linux has been plagued with problems in the past, usually because many
    developers rush out Linux support – or leave it out altogether – and focus on
    Windows. The hard truth is Microsoft’s OS is found on the vast majority of gaming
    PCs (eg Steam’s Hardware Survey (Feb 2015) has the Windows user base at 95.68%
    out of over 125 million active clients), and that’s even with the company leaving
    a trail of broken promises and an even more broken online infrastructure and DRM
    – try mentioning Games for Windows Live to a PC gamer and see them visibly shudder.


    Thankfully, the tide has turned and gaming on Linux is in rude health. Microsoft’s
    desire to create a walled garden with Windows 8 worried Valve, the video game
    developer behind the much-loved Half-Life series, and the company behind the Steam
    service, of course, enough to create a Debian-based distro called SteamOS that
    is squarely focused on gaming. Although Valve’s embrace of Linux left a lot of
    us wondering what took them so long, it was high profile enough to grab the attention
    of PC gamers who hadn’t considered Linux before. With Valve’s backing, an increasing
    number of developers are porting their games to Linux, while hardware manufacturers,
    particularly graphics vendors, are making decent strides in supporting Linux through
    their drivers. It’s now easier than ever to game on Linux – we get access to the
    latest titles, powerful hardware is supported and we don’t have to struggle getting
    games working via Wine or waste money on a Windows licence. Even better, many
    PC gamers can even see an impressive improvement in performance just by switching
    to Linux.


    > “It’s now easier than ever to game on Linux – we get access to the latest titles.”'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You could, of course, buy a Steam Machine from many reputable manufacturers
    now (such as Alienware, Asus, Cyberpower, Scan and Zotac etc), but to get yourself
    a dedicated machine for playing Linux games, we think your best bet is to download
    and install SteamOS yourself. This distro has been designed from the ground up
    for gaming, with Steam''s Big Picture Mode as the default interface. The interface
    has been specially built for navigating with a control pad on a big screen, such
    as a TV, though this means if you want to use your machine for tasks other than
    gaming then SteamOS isn''t for you in it''s current form.


    However, if you want to make the ultimate Linux gaming machine that blows the
    PS4 and Xbox One consoles out of the water, then head over to http://bit.ly/BYOSteamOS.


    On this page you''ll find two options, the first is to download the default SteamOS
    beta installation. Although this is probably the most straightforward way of installing
    SteamOS, it does require a hard drive with a whopping 1TB capacity, which is probably


    Agreement. It''s worth reading this to understand what SteamOS and Valve''s Steam
    service is.


    Although SteamOS is Linux-based and uses open source software, it''s primarily
    an interface for Valve''s proprietary Steam Store. Proprietary drivers are also
    used, and although Steam is less obnoxious than some DRM-infused store fronts,
    you should know what you''re getting into before you install it. You will, for
    instance, be able to access the Gnome desktop that''s installed as part of SteamOS
    to install non-Steam programs and games at least.


    Another thing to consider is that the SteamOS is a 1GB download, so if your internet
    connection isn''t the fastest, it''s best to have a cup of tea (or four) while
    you wait. If you agree to the terms of use click the Download SteamOS Beta button
    to begin.


    Once downloaded you''ll need to extract the contents of the SteamOSinstaller.zip
    file onto a USB stick.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_60_0.png)


    You can enable a Gnome desktop in the SteamOS settings, which will allow you to
    run non-Steam programs and games.


    > “The UI has been specially built for navigating with a control pad on a big
    screen.”


    a lot more than what most people have – or even need. The second option is to
    download the custom SteamOS beta installation. This method gives you more control
    over the install, using an installer that''s based on Debian''s default, and it
    means you can install SteamOS on to a more realistically sized hard drive. Clicking
    Download, the default SteamOS beta installation takes you to a page which displays
    the Steam End User Licence


    to have a capacity of 4GB or higher and will need to be formatted to the FAT32
    filesystem.


    To format the USB drive to FAT32, insert it and bring up the terminal. Next, type
    in df to bring up a list of the drives installed in your machine. Look carefully
    at the list to identify your USB stick (capacity is a good indicator). It''s almost
    goes without saying, but what the hell we''ll say it anyway, but it''s vital you
    correctly identify your drive before you format it, as going ahead and formatting
    the wrong one can be devastating.


    Once you''ve identified your USB drive make a note of its path under where it
    says Filesystem, for example /dev/sdc1. You''ll need to unmount the drive by using:


    where sdc1 is put the path of your USB drive. Next format the drive with the FAT32
    filesystem with:


    Once again, where we''ve written dev/sdc1, make sure you put the correct path.
    Also the -n ''SteamOS'' part of the code is optional. This just names the partition
    you''ve created on the drive for ease of use. If you''d rather not name the partition,
    feel free to leave this out.


    Hopefully, by this point the SteamOS file will have downloaded as a ZIP file.
    We''ll need to unzip the files to the freshly-formatted USB drive. To do this,
    you''ll first need to make sure you have the correct programs installed.


    As root user type in:


    ```

    sudo umount /dev/sdc1

    ```


    ```

    sudo mkfs.vfat -n ''SteamOS'' -I /dev/sdc1

    ```


    ```

    apt-get install zip

    ```


    ```

    apt-get install unzip

    ```


    # The hard stuff for your Steam Machine


    When building a machine to play games in the living room you need to consider
    a few things. For starters, since this is for the living room you''ll want it
    to look good, not take up too much space and run quietly.


    For a great looking, yet small PC case we''d suggest going for the BitFenix Phenom
    Mini-ITX, which can be bought for around £60. Next you''ll want a CPU, and although
    Intel''s processors are more expensive than AMD''s, they perform better, and will
    future-proof your Steam machine.


    The quad-core Core i5-4570 is a great choice that runs at 3.2GHz and costs around
    £150. Choosing a case and a CPU narrows down our motherboard options. We''ve gone
    for the MSI Z87I AC, which costs


    around £50, as it''s a Mini-ITX board and compatible with our processor. Even
    better, the board comes with built-in Wi-Fi so you don''t have to trail Ethernet
    cables through your living room.


    Next up you''ll want to think about a graphics card. For ease of compatibility
    we''ve gone with Nvidia. Some micro-ITX cases have limited space for GPUs, so
    we''ve gone for the Asus GeForce GTX 970 DirectCU Mini. This is an excellent and
    tiny card that will run the latest games with ease. It is, however, a bit pricey
    at £280, but well worth the money. If you want to save some cash then the slightly
    older Asus Nvidia GeForce GTX 760 2GB GDDR5 DirectCU II Mini is a great choice
    and costs a more palatable £187.


    You''ll also want a cooler (such as the Gelid SlimHero for £25), memory (Crucial
    Ballistix


    Tactical LP DDR3, 8GB for £70 is a good shout), a power supply unit (GX Lite 500W
    PSU for £41) and a hard drive (any old one will do, we''d recommend 500GB if you''re
    thinking of having lots of games). Hey presto, you''ve now got an amazing Steam
    Machine that blows the PS4 and Xbox One out of the water.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_60_1.png)


    > All these lovely components will build a formidable gaming machine.'
