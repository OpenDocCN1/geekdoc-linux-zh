- pgno: 55
  md: '# Install Linux

    on your new Chromebook


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_55_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_55_1.png)


    For those who’ve bought a Chromebook and miss a full operating system, we’ll show
    you how to get an assortment of Linux distros up and running.


    Chrome OS is brilliant – for the type of user the Chromebooks are generally aimed
    at, it does exactly what it needs to do. It is fast and easy to use – what more
    could you ask for? Well, after a while, you may find yourself missing some of
    the features associated with more traditional operating systems. But don’t fret,
    because help is at hand, in the form of Crouton.


    Crouton is a set of programs that set up a chroot environment within Chrome OS,
    from which you can run a Linux OS, with Debian and Ubuntu currently supported.
    A chroot is not the same as a virtual machine – you are still running on the standard
    operating system, but within a new environment. This method has several key advantages:
    for example, it does not touch the existing OS installation, making reversal easy;
    it uses the Chrome OS drivers for video, wireless and other devices, so there
    are no compatibility issues; and it is written by the Chrome OS authors, so it
    should remain compatible with future updates.


    > Jargon buster!


    apt-get

    The program used to install software packages on Debian, Ubuntu and other Linux
    distros.


    The only real disadvantage of using Crouton is that there may be a slight performance
    hit, but you didn’t buy a Chromebook for its blazing speed anyway. Oh, and in
    case you’re interested, the name Crouton is a convoluted acronym (standing for
    ChRromium Os Universal chrooT EnvirONment) that was clearly thought up after the
    name.


    Before you start installing other distros, it’s a good idea to create a rescue
    disk to restore your Chromebook should anything go awry. Even if you’re not installing
    another OS, this is a wise step, especially as it’s so simple – all you need is
    a USB stick or SD card of at least 2GB in capacity. Because of the cloud-based
    nature of Chrome OS, 2GB is enough, as you only need to back up the operating
    system – your data and settings are safe on Google’s servers. (See the ‘Recovery
    disks’ walkthrough on page 59 for details.)


    # Shell shocked


    When you’re ready, start downloading Crouton from http://goo.gl/fd3zc. This is
    a script that downloads and installs everything you need. You run it from a shell
    – yes, Chromebooks come with a shell. Press [Ctrl]+[Alt]+[T] to open the Crosh
    shell in a browser tab. This is a limited shell, but run shell to start a proper
    Bash shell. Crouton needs to know which distro you want to install; it calls these
    releases and selects them with the -r option. Then it needs to know the target
    environment you want to install. A target is a collection of software packages,
    such as a particular desktop. These two commands will list the options:


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_55_2.png)


    LXDE running on a Chromebook, but Chrome OS is still there.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Enabling Developer Mode


    Using Crouton means putting your Chromebook into Developer Mode, in which you
    get root access and even a Bash shell. This isn’t a hack, but a fully supported,
    if hidden, official option. A warning first: enabling Developer Mode wipes your
    storage. It doesn’t affect your cloud storage but any files stored locally should
    be uploaded to Google Drive before you proceed. The method of enabling Developer
    Mode is device-specific – you can find instructions at the Chromium website here:
    http://bit.


    ly/1gDHPGd. On the Acer C720 we used for testing, as with most Samsung devices,
    you turn the device off and then hold down the [Escape] and [Refresh] keys before
    pressing the power button. This gets you to the recovery screen, then press [Ctrl]+[D]
    to enable Developer Mode. Other devices have a hardware button for this. Once
    Developer Mode is enabled, you will see the ‘OS verification is OFF’ screen each
    time you turn on – press [Ctrl]+[D] to continue booting, or wait 30 seconds.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_56_0.png)


    Head to www.chromium.org to pick up the Developer Mode switch for your device.


    ```

    sh -e ~/Downloads/crouton -r list

    ```


    ```

    sh -e ~/Downloads/crouton -t list 2>&1 | more

    ```


    The second command needs to be passed to more because it is several screenfuls;
    hit [Space] to page through them all. Once you’ve decided the release and target
    you want, you can run Crouton. To install Ubuntu 13.10 (Saucy Salamander) with
    the Unity desktop, for example, run:


    ```

    sudo sh -e ~/Downloads/crouton -r saucy -t unity

    ```


    This uses sudo because you need root to install the software. You can also specify
    multiple targets, like this example that installs Debian Wheezy with the LXDE
    desktop and the XBMC media centre:


    ```

    sudo sh -e ~/Downloads/crouton -r \wheezy -t lxde,xmbc

    ```


    # Starting up


    Depending on the target(s) selected and the speed of your internet connection,
    this could take a while. When it has finished, it tells you the command needed
    to start your chosen distro in the chroot, such as:


    ```

    sudo startunity

    ```


    Run that command and you will be in a standard Ubuntu desktop. When you’ve finished,
    log out in the usual way and you go back to Chrome OS. You can switch between
    the two by holding [Ctrl]+[Alt]+[Shift] and pressing [Forward] or [Back]. In fact,
    the Chrome OS navigation keys above the numeric row are treated as [F] keys by
    Linux, so these are really [Ctrl]+[Alt]+[Shift]+[F1] and [Ctrl]+[Alt]+[Shift]+[F2].


    The installation you end up with is not the complete distro as you would get installing
    it natively, but any extra packages can be installed in the usual way. If using
    Unity, the Software Centre is not installed, so open a terminal in Unity ([Ctrl]+[Alt]+[T])
    and run:


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get install software-center

    ```


    Now you can install any other packages you need from the GUI. You can also install
    extra target environments with the -u flag. For example, to add the LXDE environment
    to the Ubuntu chroot we created before, we would run:


    ```

    sudo sh -e ~/Downloads/crouton -r saucy -u -t lxde

    ```


    # Adding some privacy


    As you may have noticed, enabling Developer Mode gives you root access through
    sudo, without requiring a password. This is slightly less secure for Chrome OS,
    but your login and files are still protected by your Google login, but it means
    that all the files in your chroot are readable, even with a passwordless guest
    login. If this concerns you, it is possible to encrypt the entire chroot by using
    the -e flag for Crouton. This prompts


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_56_1.png)


    Unity is perfect for running everything in full-screen.


    # Jargon buster!


    chroot

    A directory into which a program is locked. It can’t see


    for a password and uses that to encrypt the entire chroot directory, meaning you
    can neither read nor run the chroot without the password. For example:


    ```

    sudo sh -e ~/Downloads/crouton -e -r wheezy -t xfce

    ```


    There are lots of distribution releases and targets to choose from; you could
    install them all at once but that would get pretty bloated, so how do you try
    them all out? The answer is that you can have as many chroots as you have space
    for.


    If you plan to do this, you may find it easier to use Crouton’s -n option to give
    each chroot a name, otherwise they are simply names after the release. Naming
    is important when installing multiple releases, because the name is needed when
    running the start-up commands, otherwise Crouton just loads the first release
    in which it finds the target you gave. Adding -n, like this, lets you ensure the
    correct release is loaded:


    ```

    sudo startunity -n saucy

    ```


    Crouton also installs a couple of useful tools, particularly edit-chroot. This
    can be used to back up a chroot.


    ```

    sudo edit-chroot -b saucy

    ```


    creates a back-up file in ~/Downloads, which you can restore with the following:


    ```

    sudo edit-chroot -r ~/Downloads/backup-file.tar.gz

    ```


    Copy this somewhere safe. Even if you do a full reset/recovery, you can still
    restore it by downloading Crouton again and running:


    ```

    sudo sh -e ~/Downloads/crouton -f backup-file.tar.gz

    ```


    You can also use delete-chroot to delete a chroot, which you could have worked
    out for yourself, or you can simply delete the directory holding it from /usr/local/chroots
    to go back to a vanilla Chrome OS. Assuming, of course, that you’d want to do
    that. Follow the steps over the page…


    # Quick tip


    When trying multiple distros or targets, clean out any you have finished with.
    At several GB each, your storage will soon disappear.'
  merge: -1
