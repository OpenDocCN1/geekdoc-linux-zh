- pgno: 9
  md: '# What is Linux?


    There’s... a penguin? And something called a distro? Don’t worry: we’ve got the
    answers.


    The word ''Linux'' is one of the most used in this book, but what does it mean?
    It means different things to different people, from the purist who considers it
    to be the kernel, to the GNU advocate who sees it as a part of GNU/Linux and the
    new user who thinks it is another name for Ubuntu. In truth, Linux is all of these,
    depending on your point of view. Strictly speaking, the term Linux used alone
    refers to the kernel of the operating system, while GNU/Linux is the whole operating
    system, comprising the Linux kernel and GNU tools – either would be useless without
    the other (or one of its alternatives).


    If you then add a collection of application software, along with some tools to
    manage the whole thing, you have a distro, such as Ubuntu.


    There are lots of individual components that make up the operating system we know
    as Linux, but they are not that individual – they all have to fit together, so
    here we will try to explain how the whole is the sum of its parts, and what those
    parts do.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_9_0.png)


    # What is an OS?

    What is a distro?


    An operating system can be defined as the software needed to enable the applications
    to run on the hardware – as such, it consists of several interleaved layers. At
    the heart we have the kernel, which interacts directly with the hardware through
    its drivers and allows other software to use that hardware. On top of that, we
    have various layers that handle things such as input devices, networking, sound
    and video. Normally, you don’t need to know anything about this. It can be helpful
    to know some of it when things go wrong, but even then it is not essential, especially
    if you can find someone to fix the computer for you. But if you are reading this
    book, there is a good chance that you are interested in what is happening ‘down
    below’, so we will try to give you an idea of what goes where, and what it does
    when it gets there. A Linux distribution is just that, a way of distributing a
    Linux-based operating system and accompanying software. At the start, it was just
    the files the OS needs and a way of installing them on your computer. Along the
    way, distros acquired package managers, update tools, configuration GUIs and a
    host of other niceties. However, underneath the user-friendly (or not if you are
    a Gentoo user) gloss, all distros are still Linux.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# The kernel


    The nerve centre at the heart of your Linux operating system.


    The kernel is the beating heart of the system, but what is it? The kernel is the
    software interface to the computer''s hardware. It communicates with the CPU,
    memory and other devices on behalf of any software running on the computer. As
    such, it is the lowest-level component in the software stack, and the most important.
    If the kernel has a problem, every piece of software running on the computer shares
    in that problem.


    The Linux kernel is a monolithic kernel – all the main OS services run in the
    kernel. The alternative is a microkernel, where most of the work is done by external
    processes, with the kernel doing little more than co-ordinating.


    While a pure monolithic kernel worked well in the early days, when users compiled
    a kernel for their hardware, there are so many combinations of hardware nowadays
    that building them all into the kernel would result in a huge file. So the Linux
    kernel is now modular, the core functions are in the kernel file (you can see
    this in /boot as vmlinuz-version) while the optional drivers are built as separate
    modules in /lib/modules (the .ko files in this directory).


    For example, Ubuntu 14.04''s 64-bit kernel is 5MB in size, while there are a further
    3,700 modules occupying over 100MB. Only a fraction of these are needed on any
    particular machine, so it would be insane to try to load them all with the main
    kernel. Instead, the kernel detects the hardware in use and loads the relevant
    modules, which become part of the kernel in memory, so it is still monolithic
    when loaded even when spread across thousands of files. This enables a system
    to react to changes in hardware. Plug in a USB memory stick and the usb-storage
    module is loaded, along with the filesystem module needed to mount it.


    In a similar way, connect a 3G dongle, and the serial modem drivers are loaded.
    This is why it is rarely necessary to install new drivers when adding hardware;
    they''re all there just waiting for you to buy some new toys to plug in. Computers
    that are run on specific and unchanging hardware, such as servers, usually have
    a kernel with all the required drivers compiled in and module loading disabled,
    which adds a small amount of security.


    If you are compiling your own kernel, a good rule of thumb is to build in drivers
    for hardware that is always in use, such as your network interface and hard disk
    filesystems, and build modules for everything else.


    # Even more modules


    The huge number of modules, most of which are hardware drivers, is one of the
    strengths of Linux in recent years – so much hardware is supported by default,
    with no need to download and install drivers from anywhere else.


    > “So much hardware is supported, with no need to download drivers”


    There is still some hardware not covered by in-kernel modules, usually because
    the code is too new or its licence prevents it being included with the kernel
    (yes ZFS, we''re looking at you). The drivers for Nvidia cards are the best known
    examples. Usually known as third-party modules, although Ubuntu also refers to
    ''restricted drivers,'' these are installed from your package manager if your
    distro supports them. Otherwise, they have to be compiled from source, which has
    to be done again each time you update your kernel, because they are tied to the
    kernel for which they were built.


    There have been some efforts to provide a level of automation to this, notably
    DKMS (Dynamic Kernel Module Support), which automatically recompiles all third-party
    modules when a new kernel is installed, making the process of upgrading a kernel
    almost as seamless as upgrading user applications.


    Phrases that you will see bandied about when referring to kernels are “kernel
    space” and “user space”. Kernel space is memory that can only be accessed by the
    kernel; no user programs (which means anything but the kernel and its modules)
    can write here, so a wayward program cannot corrupt the kernel''s operations.
    User space, on the other hand, can be accessed by any program with the appropriate
    privileges. This contributes towards the stability and security of Linux, because
    no program, even running as root, can directly undermine the kernel.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_10_0.png)


    The number of options when building a kernel is truly staggering, and the majority
    of them relate to hardware device support. Aren’t you glad we have distro maintainers
    to work it all out for us?


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_10_1.png)'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Boot sequence


    The mysterious sequence of flashes and beeps at startup.


    Most distros go straight to a splash screen when booting, so we don’t see what
    is happening. In fact, there’s a lot going on both before the splash screen appears
    and then hidden by the screen. The BIOS starts up first, in the motherboard’s
    hardware. It looks for a boot device and loads code from there.


    In the case of a hard drive using the traditional DOS partition system, this is
    contained in the Master Boot Record (MBR) of the drive – just 512 bytes of storage.
    64 bytes are used to hold the partition table for the drive (which is why only
    four primary partitions are available), leaving all of 446 bytes for the bootloader
    code, usually Grub. 446 bytes doesn’t give room for much in the way of features,
    so all this code does is load the rest of the boot code from elsewhere on the
    disk, from a location set when the MBR code was installed by the bootloader.


    The bootloader reads its configuration file, usually /boot/grub2/grub.cfg, for
    a list of boot options, and either displays a menu or goes straight to the default
    boot. Linux is not involved at this point, because there is only the bootloader
    code running.


    file it may need, plus other settings such as the root partition, and whether
    to hide all this behind a splash screen. If you want to see what happens from
    here on, you can disable the splash screen on most distros by pressing the [E]
    key to edit the Grub menu entry, removing any quiet and splash options and pressing
    [F10] to continue booting.


    # Why use a ramdisk?


    Most distros use an initramfs file. The main reason for this is that certain drivers
    have to be loaded with the kernel, particularly those needed to load anything
    for the disk drive (like SATA controllers and filesystem code). For a generic
    distro, building all possible options into the kernel would make it unworkably
    large, so everything is built as modules and those needed for booting are included
    in the initramfs. This is a type of ramdisk that is loaded with the kernel by
    the bootloader (using the BIOS routines to read it from the disk) containing all
    the files needed to mount the root partition. This is done using the kernel’s
    device detection to decide which to load, and then control is passed to the hard
    disk proper. The initramfs is also used to load any splash screens, so they appear
    right at the start of the boot process.


    > “The config file tells the bootloader the location of the Linux kernel”


    Removing the boot splash screen shows the boot process in its entirety, including
    the status of the services being started.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_11_0.png)


    Once the root partition is mounted, directly or via the initramfs, the init sequence
    starts in earnest. Traditionally, this involves running /sbin/init, which then
    runs everything else, as controlled by /etc/inittab, and is responsible for the
    list of service start-up messages you see scrolling up the console if you have
    no splash screen. This also allows you to see where the boot process is hanging
    or taking an unreasonable time if you experience such problems.


    # Newer options


    Time moves on, and all of these systems are subject to change. On the latest hardware,
    the BIOS has been replaced by UEFI, although once the bootloader is installed
    you won’t


    # The GNU of GNU/Linux


    The GNU (Gnu’s not Unix) project predates Linux by several years. It had created
    most of the basic tools needed by a computer of the early 1980s – compilers, text
    editors, file and directory manipulation commands and much more – but did not
    have a usable kernel (some would say their kernel, GNU Hurd, is still not that
    usable). When Linus Torvalds started tinkering with his small project in 1991,
    he had a kernel without the tools to run on it.


    The two were put together and GNU/Linux was born – an operating system using the
    Linux kernel and the GNU toolset. It is not only the programs in /bin and /usr/bin
    that come from GNU; glibc is the core C library used in Linux and it also comes
    from GNU. So just about any time you do anything on your computer, every time
    you type a command or click an icon, GNU software is being run at some level.


    No wonder the GNU die-hards get upset when we refer to our operating system as
    Linux and not GNU/Linux. It is worth mentioning that no one really denies the
    importance of the GNU aspect; calling the OS Linux rather than GNU/Linux has far
    more to do with convenience and laziness than politics – the full title is just
    too cumbersome.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_11_1.png)


    Sorry Richard, we can’t be bothered to say ‘GNU slash’ every time.'
