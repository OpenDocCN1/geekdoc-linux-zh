  md: '# Development


    Power tools and programs for power users.


    # jEdit


    This is a text editor for programmers that supports auto indent, and syntax highlighting
    for more than 140 different programming languages. The app enables you to define
    complex macros and offers a powerful and user-friendly keyboard mapping system.
    It''s highly configurable and customisable, and you can extend its functionality
    by adding plugins.

    www.jedit.org


    # Meld


    A graphical diff tool, Meld enables you to compare two or three files as well
    as whole directories. It includes features, such as syntax highlighting and direct
    file editing, and using the tool you can easily isolate and merge the differences.
    Meld can also be used to browse various popular version control systems such as
    CVS and Subversion.

    www.meldmerge.org


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_94_0.png)


    # Eclipse


    There''s no beating Eclipse, the most feature-rich IDE. Although Java is its speciality,
    Eclipse supports a range of languages via plugins. In fact, its plugin marketplace
    is an indispensable resource. Eclipse does code refactoring and you can use it
    to extract the selection as a local variable or method. Since it can target multi-person
    installs, it handles version control very maturely

    www.eclipse.org


    # KompoZer


    New and experienced HTML programmers will save a lot of amount of time and effort
    with the KompoZer editor. It has an intuitive interface and includes a colour
    picker, an FTP site manager, CSS editor, customisable toolbars, forms, spell checker,
    markup cleaner and can also validate code using W3C''s HTML validator.

    www.kompozer.net


    # BlueFish


    Do you develop for the web? Bluefish is a multi-language editor that''s designed
    for web developers. It supports many programming and markup languages and focuses
    on dynamic and interactive websites. It supports code block folding, unlimited
    undo/redo, automatic tag closing, and syntax highlighting. Another useful feature
    is the snippets bar from where you can add the most common snippets of code for
    a variety of languages. Bluefish also has support for popular open source web
    apps such as MediaWiki and Wordpress.

    http://bluefish.openoffice.nl


    # Gimp


    Despite its name, Gimp is a powerful, comprehensive image manipulation program.
