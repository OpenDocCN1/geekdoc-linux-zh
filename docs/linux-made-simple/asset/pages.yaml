  md: '# Accessing your documents


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_36_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_36_1.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_36_2.png)


    # 1 Identify mount point


    Click ''Search'' in the App Launcher, type disks and click the ''Disks'' shortcut
    under ''Applications''. Assuming you''ve moved your data to a new drive, select
    this drive in the left-hand pane. Now highlight the partition that your data is
    stored on under ''Volumes'' and make a note of where it''s mounted.


    # 2 Install Ubuntu Tweak


    Open the Firefox web browser and browse to http://ubuntu-tweak.com, ignore the
    Launchpad prompt, then click the latest Deb Package link (0.8.7 at time of writing).
    Click ''OK'' to launch it with Ubuntu Software Center, then review the package
    description before clicking the ''Install'' button.


    # 3 Move user folders


    Click the ''Search'' button, type Ubuntu and select ''Ubuntu Tweak'' under ''Applications''.
    Select ''Admins > User Folder''. Each folder will be listed – select one and click
    ''Change''. Browse your data partition for the corresponding folder, select it
    and click ''Open''. Repeat for all the other user folders.


    creating folders, managing existing icons and changing the desktop background,
    should you wish.


    Ubuntu can detect both FAT32 and NTFS partitions, so accessing your old data shouldn''t
    be too much of an issue. You should see these drives appear in the App Launcher
    – clicking one will open its contents for viewing. If you''re looking for your
    personal data, unless you''ve specifically moved the folders in Windows, you should
    find all your documents in the Users folder under your username.


    programs. To make the change complete, follow the step-by-step guide above to
    point your Ubuntu user folders to the same location. We recommend following the
    advice given and leaving the Ubuntu desktop folder alone. Once done, test that
    the tweaks work by opening Nautilus and clicking the ''Documents'' shortcut in
