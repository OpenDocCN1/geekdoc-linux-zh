    worse when it is on show.


    # Power supply


    One of the most overlooked components is the power supply (PSU). Avoid the cheap
    PSUs that are included with cases (in fact, avoid cases that are cheap enough
    to include a PSU). A PSU must be reliable and good quality. That may seem an obvious
    statement that applies to all components, but when a PSU fails it can do so in
    a way that takes out other components. Having a £100 motherboard or hard drive,
    or both components, wrecked by a £15 PSU is not a good way of saving money.


    Other aspects to consider when choosing a PSU are: that it must supply sufficient
    power for your needs, now and in the future, that it is


    # Case


    The computer’s case is often left as an afterthought, but a larger, well made
    case makes life so much easier. A Cheap case will make cable routing harder and
    will often have sharp edges that will mean bleeding knuckles and blood stains
    on your nice new motherboard (you can probably sense the first-hand experience
    in that statement).


    A larger case also provides better airflow for improved cooling. If you are building
    a media centre that goes in the living room, a high WAF (See Terminology, p34)
    is a major consideration, but pay attention to noise levels. What initially seemed
    like a whisper can become annoying while watching TV. If you choose to go for
    a case with a window in the side, bear in mind that you will have to be extra
    careful when routing cables. A rat’s nest of cables is never a good idea, but
    it’s even


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_51_0.png)


    efficient (any PSU worth its salt is rated 80 Plus, but look for Gold, Platinum
    and Titanium models) and that it’s quiet (particularly for a living room computer).
    There are several websites where you can list the components you are using and
    get a recommendation of the power supply you need, for example http://support.asus.com/PowerSupply.aspx?SLanguage=en.
    Check that the PSU you choose has connectors you need, most motherboards take
    a 24+4-pin ATX connector and a separate CPU power lead. Also ensure you have enough
    drive power connectors of the right type, some PSUs still come with more of the
    old Molex connectors than the useful SATA power plugs. If you are using a large
    case with a bottom mounted PSU, check that the leads are long enough to reach
    the drives at the top, although you can buy SATA power extender leads cheaply
    enough that deal with the last two points. You’ll be pleased to know there are
    no special considerations to be taken regarding Linux compatibility!


    # Specialised systems


    So far we have looked mainly at a general purpose desktop system, but there are
    some specialist users to consider, such as a home server or a high-performance
    gaming systems. If you want to build a home server, your requirements will be
    very different from a desktop or gaming system.


    As all data is transferred over the network, a fast SSD is pointless. You could
    use one for the operating system, but servers are rarely rebooted, so you wouldn’t
    even benefit from the fast boot speed they offer, and they only run a limited
    number of programs, so loading time is not that important either. Servers generally
    run headless, so a fancy graphics


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_51_1.png)


    # 3 Memory slots


    Insert the memory DIMMS into the sockets on the motherboard. Make sure they are
    the right way round; slots in the DIMMS should line up with protrusions in the
    socket and they only go in one way. If you are not using all the slots, consult
    your motherboard manual for the optimum slots to use and to ensure you take advantage
    of any dual-channel abilities.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_51_2.png)


    # 4 Motherboard backplate


    Fit the motherboard’s I/O plate to the opening in the back of the case and then
    place the motherboard in the case. There are small posts that it should stand
    on, you may need to screw them into the case before going ahead and fitting the
    motherboard. Then secure the motherboard to the posts with the supplied screws
    – do not overtighten them.'
