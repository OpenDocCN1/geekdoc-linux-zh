  md: '# GTK+ and Qt: the Bloods and Cripps of the Linux desktop


    GTK+ and Qt are cross-platform widget toolkits. These enable a unified look and
    feel across applications with respect to menus, dialog boxes and the like. GTK+
    is used by Gnome, while LXDE, XFce and Qt are used by KDE and Razor Qt. If you
    want a truly minimal desktop, then ideally you would only install applications
    that use one particular toolkit. On one level, GTK+ is lighter than Qt, but the
    situation is complicated by the fact that some applications prefer version 2 and
    others version 3. Further, while there are many GTK+ themes out there, very few
    work well with both versions, hence the many forum posts of the genus, "my GTK{2,3}
    apps look awful". Some applications work with either version, and in this case
    distributions tend to package their GTK+3 incarnations. If you want a GTK2+ version,
    then building one is usually pretty straightforward if you''re OK with making
    minor edits to configure scripts. If you''re an Arch Linux user, then the Arch
    User Repository has a bunch of +gtk2 packages ready made for you, saving you the
    indignity of 100MB of GTK3 and friends to install. If you don''t mind having a
    heterogeneous GTK+ and Qt setup, then you can get a reasonable degree of consistency
    by using something such as QGtkStyle to make Qt look like your GTK+ theme, or
    the GTK-Qt engine for the other direction.


    # “MPlayer can play pretty much anything you throw at it”


    on the Pillow library, and uses ANSI escape codes to display images in as many
    colours as your terminal supports. If you are working outside of an X server,
    but have KMS enabled (or are otherwise willing to fiddle with things such as uvesafb
    in order to get a high resolution framebuffer), then you can use fbi (framebuffer
    image viewer) to display images slightly more faithfully.


    You can also process images with the convert and mogrify commands from ImageMagick.
    If you have a graphical environment, then the latter''s display program is about
    as lightweight an image viewer as you can get, although it''s entirely command-line
    driven. Likewise the popular feh program. Both of these can work with multiple
    files and be used to set the desktop background in standalone window manager situations.
    For a more traditional image viewer, you should direct your attention towards
    Geeqie – a simple GTK+2 program that can work with EXIF data and raw images. If
    you want basic image-editing capabilities as well, then Mirage (built on PyGTK)
    and Converseen (Qt4) are both good candidates.


    It would be remiss not to mention the stalwart MPlayer here – it can play pretty
    much anything you throw at it (and can do so on a framebuffer device, or as ascii
    art) and can fulfil all your encoding requirements via mencoder. Sadly,


    despite the codebase still being actively maintained, it has become fragmented
    and spaghetti-like over the years. In an attempt to modernise it, the imaginatively-titled
    mplayer2 fork was set up, although this project seems to have been eclipsed by
    the superb MPV, which has ripped out most of the old zombie code and – at the
    time of writing – enjoys rapid development. Its internal GUI works like a charm
    (compare it with the abomination that is the original mplayer GUI), so there''s
    no need for the desktop frontends, such as Gnome-mplayer and smplayer (Qt), which
    many considered de rigueur for its predecessor.


    # Media players


    VLC, the media player of choice for most multi-format fans, remains as reliable
    as ever, though its GUI does rely on Qt4. That said, it has all manner of other
    interfaces (ncurses, web, remote-control) and can output to a framebuffer or as
    ascii art. Snappy is a medium-weight GTK+3 player which is built on the GStreamer
    and Clutter frameworks, but has few other Gnome dependencies and looks pretty.


    And that concludes our summary of diminutive applications. Hopefully you''ve found
    something lightweight with which to replace something heavy, and have clawed back
    some of your precious resources. Even if you have a powerful computer, there''s
    much to be gained from learning the tools we''ve covered here, or others of similar
    ilk. They can inspire a more efficient workflow, show you new ways to get stuff
    done, and improve your memory through the learning of keyboard shortcuts.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_100_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_100_1.png)


    Ncmpcpp and Conky running on Fluxbox. Sleek.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_100_2.png)


    SpaceFM compiled for GTK2+ with three tabs and a 15MB memory footprint.'
