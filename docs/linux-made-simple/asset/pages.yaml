  md: '# Ditch XP part 2


    So you’ve made the switch from Windows XP to Linux. But how do you make sure you
    can open all your documents and carry on using your PC?


    Just because you have switched from Windows XP to Linux, it doesn’t mean that
    you won’t be able to access your existing files, or will have to radically change
    the way you use your computer. The aim of this tutorial, along with the walkthrough
    on the previous page, is to make the switch from Windows to Linux as smooth and
    painless as possible. For many Linux users, the concept of a Microsoft operating
    system is but a hazy memory. If you are one of those people, these guides are
    ideal for handing over to friends or family who have yet to make the leap to Linux.


    One of the biggest worries for people moving from Windows to Linux is that they
    won’t be able to open their old files, or use the programs that they’re used to.
    Thankfully, this worry is easily allayed, because an increasing number of applications
    have Linux versions. The beauty of open source software is that if an application
    isn’t available on Linux, there’s a very good chance of there being an alternative
    that will do just as good a job – if not better.


    # Getting your files


    If you followed the guide on the previous pages, you’ll have installed Mint while
    keeping your Windows XP installation and personal files intact. This means that
    while you are in Mint, you will be able to browse the drive on which Win XP is
    installed, and access all your files. In Windows XP, these are usually kept in
    My Documents, My Pictures and so on. Mint, and many other Linux distributions,
    have similar folders (usually without the ‘My’ prefix). While it’s feasible to
    copy and paste your documents and files from your Windows XP partition to the
    equivalent folder in Linux, it’s a better idea to leave the files where they are.
    When you then edit them in Linux, the changes will still appear if you then open
    them in Windows.


    Ta-dah! Linux Mint at your service – and isn’t it nice?


    Windows. To make life easier, it’s worth creating shortcuts to your XP folders
    so they are easily accessible in Linux. When you open the file browser, you should
    be able to see the drive or partition on which Windows XP is installed.


    Depending on what distribution you’re using, the process might be slightly different,
    but in Linux Mint you can quickly access the file manager by double-clicking the
    computer icon on the desktop. In the window that opens, you will see all the drives
    connected to your computer. By double-clicking the drive on which Windows XP is
    installed, you can browse to your existing files by going to ‘Documents and Settings
    > Username > My Documents’, where Username is the name of the account that you
    use to log in to Windows XP. If you right-click ‘My Documents’, or on any folder
    you want to have quick access to, and select ‘Make Link’, you can then drag the
    newly made link to your desktop for quick access. You can also add the folder
    to the left-hand Places bar in the File Explorer menu. To do this, open up the
    folder, click on ‘Bookmarks’, then ‘Add Bookmark’. The folder will now appear
    on the left underneath bookmarks.


    As Linux adoption grows, so does the number of Linux ports of popular Windows
    and Mac programs. Dropbox, the popular file synchronisation program, has a Linux
    client, as does Skype. Steam also has a Linux client, and an increasing number
    of recent games are Linux compatible.


    # Browse the web


    If you use Google Chrome or Mozilla Firefox to browse the internet, then you’ll
    be able to continue using them in Linux. And the best bit is they will both let
    you synchronise your bookmarks, passwords and browsing history. If you’ve been
    using Internet Explorer, you’re going to have to make do with


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_41_0.png)'
