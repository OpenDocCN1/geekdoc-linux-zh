    mindset, you''ll be surprised how much more efficient you can be.


    Furthermore, in so doing you''ll look much cooler. If you still don''t want to
    go down that road, there are plenty of slimline graphical applications worth considering.


    Files are important, so a functional file manager is vital. Our first suggestion,
