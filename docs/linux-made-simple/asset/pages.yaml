- pgno: 105
  md: '# Terminal: Apt-


    New to Linux? Then allow us to guide you through your first steps with **apt-get**,
    the powerful command line tool.


    One of the biggest changes that catches Windows users moving to Linux is the way
    that software is installed. Instead of downloading an executable file from some
    website or other, running it and hoping it doesn''t clobber your existing library
    files (DLLs) or install some dubious adware or malware, Linux distributions maintain
    repositories of software, which are all packaged up for that distro and tested
    for compatibility with the rest of the distro.


    In this tutorial, we will look at how this is done by distros that use the Advanced
    Packaging Tool (apt) software management system, as developed by Debian and used
    by distros from Ubuntu to Raspbian on the Raspberry Pi.


    # Repositories


    A repository is a collection of software packages for a distro. Each major release
    of a distro will have its own repositories, and the packages will have been built
    for and tested with that release, but a repository is more than a collection of
    files. Each repo (as they are usually called) is indexed, making it easy to find
    what you want. It can also be quickly checked for updates for your package manager
    without any need to visit websites to check for updates, or the need for software
    to ''phone home'' to check.


    More importantly, each package in a repo is signed with the repository''s GPG
    (encryption) key, which is checked when installing packages. This means you can
    trust the software installed from there to be what it says it is, and not some
    infected trojan that''s been uploaded maliciously.


    A repository also makes dependency handling simple. A dependency is a program
    that the program you want to install needs to run, such as a library. Instead
    of bundling everything in the package and ending up with multiple copies of the
    same library on your computer (which is what Windows does), a package simply lists
    its dependencies so that your package manager can check whether they are already
    installed, and grab them from the repo if not.


    In addition to the default repositories provided by the distro, there are several
    third-party ones that can be added to your package manager. These are not guaranteed
    to be tested to the same standards as the official repos, but many of them are
    very good, and if you stick to the popularly recommended repos for your distro,
    you won''t go far wrong.


    Ubuntu has also introduced the concept of the PPA, or Personal Package Archive,
    which are small repositories for individual projects. These may each be added
    individually to your package manager, but be careful about adding any untrusted
    sources.


    # Package management


    We have used the term ''package manager'' a few times now but what is it? Basically,
    this is a program that enables you to install, update and remove software, including
    taking care of dependencies. It also enables you to search for programs of interest,
    as well as performing other functions. All distros will have command line package
    management tools. You can access them either by using your system''s search and
    looking for terminal or using [Ctrl]+[Alt]+[T] in desktops such as Unity, Gnome
    or Xfce, even if they also provide a fancy graphical front end. The main commands
    are:


    +   » apt-get Installs, upgrades and uninstalls packages.

    » apt-cache This works with the repository index files, such as searching for
    packages.


    # Package management


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_105_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_105_1.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_105_2.png)


    # 1 Install


    Using apt-get install will check the dependencies of the packages you want and
    install any that are needed. Adding --dry-run to apt-get install enables you to
    see what would be done, without actually writing anything to your hard drive.
    If you are happy, run the command again without --dry-run.


    # 2 Search


    Use apt-cache search to find what''s available. The --names-only option can give
    a more manageable set of results if you know the program''s name. Otherwise let
    apt-cache search go through the descriptions, too, and view the results in less.
    You don''t need to use sudo as search doesn''t write to your drive.


    # 3 Update


    Run apt-get update to update all your package lists, followed by apt-get upgrade
    to update all your installed software to the latest versions. In our case, it''s
    well overdue. Then apt will show you what needs to be updated, and how much needs
    to be downloaded, before asking whether you want to proceed.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# get in action


    # In-depth | Apt-get


    Less displays text from any source – from a file, the output of another program
    or its built-in help if you manage to get stuck.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_106_0.png)


    add-apt-repository Adds extra repositories to the system.


    dpkg A lower level package manipulation command.


    These commands generally require root (superuser) access, so should be run at
    the root user or with sudo – we will stick with the sudo approach here. We’ve
    already mentioned that repos are indexed, so the first thing to do is update your
    index files to match the current contents of the repositories with:


    ```

    sudo apt-get update

    ```


    Then you probably want to make sure that your system is up to date:


    ```

    sudo apt-get upgrade

    ```


    This will list the packages it wants to install, tell you how much space it needs
    for the download, and then get on with it when you tell it to. When you want to
    install some new software, unless you have been told the exact name to install,
    you may want to search for it first, like this:


    ```

    apt-cache search gimp

    ```


    This will spit out a long list of packages, because it searches both name and
    description, and lists anything mentioning gimp, and there are a lot of them.
    To search only the names, use the -n or --names-only option:


    ```

    apt-cache search -n gimp

    ```


    This often gives a more manageable output, but still a lot in this case, perhaps
    too much to fit in your terminal window. The solution to this is to pipe the output
    from this command to the program less:


    ```

    apt-cache search -n gimp | less

    ```


    The less command is a pager – it lets you read text page by page and scroll through
    it. It can be used with any program that generates lots of terminal output to
    make it easier to read (see the ‘Package management’ walkthrough opposite for
    more details). Once you have found the package you want, installation is as simple
    as:


    ```

    sudo apt-get install gimp

    ```


    You can install multiple programs by giving them all to apt-get at once:


    ```

    sudo apt-get install program1 program2...

    ```


    Not every program you try will be what you want, so you can tidy up your hard
    drive by uninstalling it with:


    ```

    sudo apt-get remove program1

    ```


    Or you can use:


    ```

    sudo apt-get purge program1

    ```


    Both commands remove the program, but remove leaves its configuration files in
    place while purge deletes those, too.


    There are a number of extra options you can use with apt-get, the man page lists
    them all (type man apt-get in the terminal), but one of the most useful is --dry-run.
    This has apt-get show you what it would do without actually doing it, a useful
    chance to check that you are giving the right command. Remember, computers do
    what you tell them to, not what you want them to do! Finally, you don’t normally
    need to use dpkg, but it is useful for listing everything you have installed with
    dpkg -L.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# Terminal: Disk management


    We continue our tutorials about using the terminal by explaining how to manage
    your disks, partitions and filesystems.


    We store data in a variety of ways. On our hard disks, on optical discs (CDs and
    DVDs) and on removable devices such as USB sticks and external hard drives. In
    Windows, each would be given a drive letter, starting with C (A and B were reserved
    for floppy drives. You may see words such as partition and filesystem bandied
    about, so let’s clarify them before we go any further. A disk is divided into
    partitions, separate physical areas each used to store data. Hard disks always
    have partitions, even when it appears you are using the whole disk, as in a Windows
    C drive, but there is a distinction. Removable devices such as USB sticks may
    or may not have partitions – most do. The only types of media that are never partitioned
    are floppy and optical discs.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_107_0.png)


    There are graphical tools for managing partitions and filesystems, the most popular
    of which is GParted.


    Each partition contains one filesystem. A filesystem is a means of storing files,
    directories and their associated data – it organises the ones and zeros stored
    in the device’s memory into useful objects. It is important to understand the
    differences between these terms before we continue, even though they are often
    used interchangeably.


    use). There are other native filesystems such as reiserfs, BTRFS and XFS. Why
    do we have these variants? Because not every system has the same needs; a mail
    server needs to store many thousands of small files, a database server works with
    a smaller number of much larger files, and requires access to random points in
    those files. A laptop’s filesystem needs to be resilient to unplanned shutdowns,
    such as when a battery fails. So we end up with different filesystems for different
    purposes, although for general use ext4 does a fine job. In fact, the enhancements
    to ext4 over ext3 mean it works well in a wider variety of situations and is a
    sensible choice for a standard desktop or laptop system.


    # Types of filesystem


    There are several different filesystems supported on Linux. A native filesystem
    is one that is designed for use with Linux or other Unix-like systems. The most
    commonplace of these is ext4 (along with its predecessors ext3 and ext2 that are
    still in


    # Creating partitions and filesystems


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_107_1.png)


    Here we’re creating an ext4 filesystem using the standard defaults. Get the partition
    right, because mkfs doesn’t ask whether you are sure.


    Partitioning a drive is normally done by a distro’s installer, but there are graphical
    and command-line programs to work with partitions and filesystems. At the command
    line, fdisk and gdisk are the standard commands, the former working with old style
    MS-DOS partition tables, while gdisk works with the newer, more reliable and flexible
    GPT partitions. They work in much the same way. See the step by step guide for
    more information. Once you have created partitions, you need to make filesystems
    on them, which is done with the mkfs range of commands. These all have names of
    the form mkfs.FSTYPE, such as:


    ```

    sudo mkfs.ext4 /dev/sdb1

    ```


    There are different options you can use for each filesystem type, depending on
    that particular filesystem’s features, so you will have to consult the man page
    for that flavour of mkfs to see what you need, although they all have sensible
    defaults. There is also a generic mkfs command that takes a -t option to specify
    the filesystem type, but the versions with the filesystem added save having to
    remember the exact name. The main ones you will need are mkfs.ext4, mkfs.ext3
    and mkfs.vfat, with the last one being used for OS-independent media, such as
    flash drives.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Step-by-step: Partition a disk


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_108_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_108_1.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_108_2.png)


    # 1 sudo gdisk /dev/sda


    You need to use fdisk for hard drives partitioned with the old MBR system (gdisk
    will warn you if this is needed). You must give the name of the drive, then press
    [m] in fdisk or [?] in gdisk for a list of all the main commands. Any changes
    you make here stay in memory and are only written to the disk when you press [w].


    # 2 Create some partitions


    Press [n] to create a partition – you normally can press [Enter] to accept the
    defaults for partition number and start point. The default end point is the end
    of the available space – if you want to use a specific size, enter + followed
    by the size you want, for example +50G. For anything but a Linux partition, you
    should give its type; entering L lists them.


    # 3 Show the partition layout


    Press [p] to list the current partition layout, either the existing layout from
    a freshly loaded disk or the layout you have created in fdisk/gdisk. Make sure
    everything is as you want before you use [w] to commit to the disk, as there is
    no going back from [w]. Until then, you can make further changes or press [q]
    to abort without writing anything to disk.


    Non-native filesystems are those developed for use with other platforms, but supported
    in Linux. The most notable of these is FAT, the default Windows filesystem for
    many years and still the standard choice for USB sticks, camera memory cards and
    other removable media. Also supported to a certain extent are the newer exFAT
    and NTFS filesystems from Microsoft and Apple’s HFS and HFS+ filesystems. The
    collection of supported filesystems is rounded out by the likes of ISO9660 and
    UDF, used by CD and DVD media.


    Most of the time, you don’t need to worry about the type of filesystem used on
    a media device, just plug it in and the Linux kernel recognises the filesystem
    in use.


    # Mounting a filesystem


    Making the contents of a filesystem available to the OS and user is called mounting.
    In Linux, each filesystem is mounted at a particular point within the filesystem
    hierarchy, known as the mount point. The root filesystem, the one containing the
    core OS components, is mounted at /, the root of the filesystem tree. Many distros
    use a separate partition and filesystem for the user’s home directories; it separates
    the OS from the user’s files so you can update, re-install or switch the OS without
    affecting your personal files. Users’ home directories reside at /home/username,
    so a separate home filesystem would be mounted at /home, the mount point for the
    home filesystem. This directory must exist on the root filesystem but is usually
    empty – as soon as the home filesystem is mounted, its contents appear at /home.
    Anything that was there before is no longer visible, but is still there and will
    reappear when home is unmounted.


    There are three main ways to mount a filesystem: at boot, manually or automatically.
    The system filesystems, such as / and /home, are mounted automatically at boot,
    using information stored in the filesystem table /etc/fstab – remember, /etc is
    where system settings are stored. Here is a typical fstab entry for mounting the
    a partition.


    ```

    /dev/sda2 /home ext4 defaults 0 2

    ```


    Each filesystem’s entry is on a single line, with six fields: 1. Device name Linux
    disks are named sda, sdb and so on, with the partition’s number added to the disk’s
    device, so /dev/sda2 is the second partition on the first disk.


    2. Mount point Where the filesystem is to be mounted – it must exist.


    3. Filesystem type It is possible to use auto here and let the kernel figure it
    out for you, but with a fixed disk it makes sense to be specific.


    4. Mount options The keyword defaults means use whatever is standard for that
    filesystem. Specific settings can be given here, separated by commas.


    5. Dump Used for a particular type of backup, normally left at zero.


    6. This is used by fsck to set the order in which filesystems are checked when
    booting. Set to 1 for the root partition and either 2 or 0 for others – 0 means
    do not check.


    Mounting manually is done with the mount command:


    ```

    sudo mount /dev/sda4 /mnt/backup -t ext4

    ```


    The first two options are the device and mount point, -t specifies the filesystem
    type; if you omit this, auto is used. You can also use -o to add other options,
    such as:


    ```

    sudo mount /dev/sda4 /mnt/backup -t ext4 -o noatime

    ```


    The noatime option is often used in fstab to improve performance; it reduces the
    number of writes to the disk by only recording when files are modified, not simply
    read. If a device is listed in fstab, you need only give either the device or
    mount point, and mount will take the rest from fstab:


    ```

    sudo mount /dev/sda3

    ```


    ```

    sudo mount /mnt/music

    ```


    We have used sudo in all of these examples because mounting is generally only
    permitted by the root user. This behaviour can be changed for mounts listed in
    fstab by adding user or users to the options:


    ```

    /dev/sda3 /mnt/music ext4 users,noatime 0 0

    ```


    ```

    mount /mnt/music

    ```


    Now any user can mount this with: The difference between user and users is that
    with the former, only the user who mounted the filesystem can unmount it. Speaking
    of unmounting, that is done with the umount command, followed by either the mount
    point or device. This command also accepts multiple paths to unmount several at
    once:


    ```

    sudo umount /mnt/music /mnt/photos /dev/sda5

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Tar: Archiving your files


    Archiving contains many mysteries, such as zips and tarballs, but we are on hand
    to expand your knowledge of their uses.


    Most people reading this are probably pretty familiar with creating, sending or
    receiving ZIP files. Zip takes a collection of files and stores them in a ZIP
    archive file, compressing the data in the process. As well as storing the contents
    of the files, it also stores all their metadata, which is extra information associated
    with an object. In the case of files, it includes the modification times, their
    owners and permissions, and, of course, the name of each file. When you unzip
    an archive, all of this information is extracted, which recreates the original
    set of files exactly as they were. This is pretty handy.


    Archives have several uses, but the most popular include bundling up a set of
    files for download – a single file is easier to handle and the compression makes
    it faster to download – and creating backups. As Zip has been around for ages,
    everyone can use it and all OSes can handle it. Nonetheless, Zip does have a number
    of drawbacks. The main issue is that its compression is poor by modern standards.
    Over the past 25 years, compression technology has moved on and even though there
    have been improvements to Zip, there are better alternatives available. Another
    disadvantage of Zip is that it is intended for archiving to a file, whereas sometimes
    we want to send the data to another device or service.


    The standard archival program for Unix-like operating systems is Tar, so called
    because Tar was originally used to store backups on tape drives (Tape ARchive).
    It works in a different way to Zip because it sends all the archived data to its
    standard output and doesn’t compress the data by default. This is because many
    tape drives already had hardware compression built in. The lack of compression
    code may seem like a disadvantage, but it’s actually a convenience. As Tar is
    able to pipe its data via an external compression program, it can use any compressor
    it likes – even one that wasn’t in existence when Tar was developed.


    Compression programs work on one file or stream of data and produce one compressed
    file or stream, so this splits the job into two parts: archival and compression.
    While this may seem more complex, Tar is capable of handling the details itself.
    Let’s say we have a directory that is called foo. We want to create an archive
    of it, which is often referred to as a tarball. We can use one of these options:


    ```

    ```

    tar cf foo.tar foo

    tar czf foo.tar.gz foo

    tar cjf foo.tar.bz2 foo

    tar cJf foo.tar.xz foo

    ```

    ```


    The c option tells the Tar program that we are creating an archive, while f tells
    it that we are storing the archive in a file using the given name. Therefore,
    the first command creates an uncompressed archive that is called foo.tar. The
    subsequent commands add an extra option that tells Tar


    # Pipes and streams


    A core part of the philosophy of Unix-like operating systems is for tools to be
    specialised – each tool should do one job and do it well. That means we need a
    way to chain programs together to achieve more complex tasks, and this is done
    with pipes. Every terminal program has streams for standard input, standard output
    and standard error (usually referred to as stdin, stdout and stderr). Standard
    input is how the program accepts information and it defaults to the keyboard when
    running a command from a terminal. Standard output is the output from the command
    that defaults to printing to the terminal window. Standard error goes to the same
    place, but all of these can be changed. Consider the example of:


    ```

    ```

    tar c foo | sdc >foo.tar.sdc

    ```

    ```


    The | character is the pipe and it connects the standard output of one program
    to the standard input of another. So Tar archives the contents of foo and sends
    it to stdout, which is then piped to the input of sdc. Most compressors default
    to working on a file:


    ```

    ```

    gzip somefile

    ```

    ```


    This compresses a file to somefile.gz. When no file is given, it compresses standard
    input and sends the result to standard output. The > character performs redirection
    and diverts standard output from the terminal to a file, so you get a compressed
    archive in foo.tar.sdc. Standard error is not redirected by >. If something goes
    wrong, error messages are printed to the terminal – if they were sent to the file,
    you wouldn’t know something was wrong.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_109_0.png)


    Running Tar with the t (test) option not only checks that the archive is correct,
    but also shows you the full contents – usually enough for you to need to pipe
    it through a pager such as Less.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# Compression types


    There are two types of compression: lossless and lossy. Lossy compression achieves
    a greater reduction in file sizes by carefully discarding data that doesn’t greatly
    affect the results. JPEG and MP3 files, for example, use lossy compression. Archiving
    uses lossless compression and uncompresses the result to get you back exactly
    where you started. There are a number of lossless compression methods available,
    here are some of the most common.


    Deflate This is the default compression used by Zip, it is old and not particularly
    effective, but is fast and well supported.

    Compress This is an old Unix compression program. Its files have a .Z extension,
    but you are unlikely to see many in the wild. There are also patent issues with
    it.


    Gzip This Compress replacement is completely open and still in use today. Gzip
    uses Deflate, but generally produces smaller archives than Zip with its default
    settings. It does not give the best compression, but it compresses and decompresses
    quickly, making it a good choice when size is not the most vital consideration.

    Bzip2 This is a more efficient compressor, but at the expense of speed. Compression
    in particular can be slower, but it produces more compact results.

    xz This more recent program uses the LZMA2 compression algorithm also used by
    7-Zip. It is fast – particularly for decompression – and works brilliantly. It
    is the compressor of choice for many key Linux projects, including Coreutils and
    the kernel itself.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_110_0.png)


    Here is the same archive using different compression programs. The Gzip version
    is significantly larger, but faster to compress and decompress.


    which particular type of compression to use: z uses gzip compression, j uses bzip2
    compression and J uses xz compression. (Watch the capitalisation!)


    There are also long versions of these arguments that make the commands more readable,
    but most of us are lazy and use the version that is shorter to type. However,
    we could also have used this command line if we wanted to:


    ```

    tar --create --gzip --file foo.tar.gz foo

    ```


    The file extension is not required, but it’s a convention that makes it easier
    for people to see what type of archive it is – the system itself needs no such
    help as it can work all this out for itself. Unpacking an archive is simply a
    matter of replacing c with x, or --create with --extract. However, you don’t need
    to give the compression type, as Tar figures it out:


    ```

    tar xf foo.tar.gz

    ```


    Another option you may want to add is v or --verbose, to show you what Tar is
    doing. If you have been given a tarball, you may want to see what is inside it
    without unpacking it. If you have created an archive, particularly a backup, you
    may want to check it’s correct before relying on it. The test option checks the
    integrity and lists the contents of the archive.


    ```

    tar tvf foo.tar.gz

    ```


    Those are the main Tar options, but the program has many more, such as A or --concatenate
    to add files to an existing archive instead of creating a new one.


    # Future proofing


    We mentioned that Tar can handle any new compression format that comes along because
    it passes compression to another program. There are command line options to do
    this automatically for gzip, bzip2 and xz, but what if someone comes up with a
    new compressor? Say something like sdc – super-duper compressor? You could create
    an uncompressed tarball and then use sdc to compress it, but that’s wasteful and
    slow, so instead use a pipe:


    ```

    tar c foo | sdc >foo.tar.sdc

    ```


    ```

    unsdc foo.tar.sdc | tar xv

    ```


    Here, we use only the --create option with Tar. The lack of destination causes
    Tar to send the archive data to standard output, which is then piped to the sdc
    compressor program. The second command reverses the process, decompressing the
    archive and sending it to Tar for extraction.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_110_1.png)


    Tar and the compressors have man pages, with many options. You’ll usually only
    need the ones covered here.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_110_2.png)


    Most environments can view the archive contents. Shown above is the result of
    double-clicking a tarball in LXDE (the preferred desktop for Raspberry Pi).'
  merge: -1
  img_proc: true
- pgno: 111
  md: "# Terminal: Core programs\n\nOut of the hundreds of different terminal commands\
    \ available, here's a handy summary of some of the more useful ones.\n\nWe've\
    \ looked at various shell commands in the last few tutorials, but they have each\
    \ been in the context of performing a particular task. It's time to take an overview\
    \ of some of the general-purpose commands. There are thousands of terminal commands,\
    \ from the commonplace to the arcane, but you need only a handful of key commands\
    \ to get started. Here we will look at some of the core workhorse commands, giving\
    \ a brief description of what each one is for. As always, the man pages give far\
    \ more detail on how to use them. Many of these produce more output than can fit\
    \ in your terminal display, so consider piping them through less.\n\nCentral to\
    \ any terminal activity is working with files, creating, removing, listing and\
    \ otherwise examining them. Here are the main commands for this.\n\n+   - **ls**\
    \ Lists the contents of the current or given directory.\n- **ls -l** As for ls,\
    \ but gives more information about each item. Add human-readable file sizes with\
    \ **-h**:\n  `ls -lh MyPhotos`\n- **rm** Deletes a file. Use the **-i** option\
    \ for confirmation before each removal or **-f** to blitz everything. With **-r**\
    \ it deletes directories and their contents, too.\n- **rmdir** Deletes a directory,\
    \ which must be empty.\n- **df** Shows free disk space on all filesystems or just\
    \ those given on the command line.\n- **du** Shows the amount of space used by\
    \ individual files or directories.\n  `df -h /home`\n  `du -sh /home/user/*`\n\
    - **file** Identifies the type of a file. Unlike Windows, which uses the file\
    \ name extension, this command looks inside the file to see what it really contains.\n\
    \nfind Searches the current or given directory for files matching certain criteria.\
    \ For example, you could find all LibreOffice spreadsheets with:\n\n```\nfind\
    \ Documents -name \"*.ods\"\n```\n\nlocate This also looks for files but using\
    \ a much faster system. The locate database is automatically rebuilt each day\
    \ by updatedb, and locate then searches this. It's fast, but doesn't know about\
    \ very recent changes.\n\n# Text handling\n\nText files are all around us, from\
    \ emails to configuration files, and there are plenty of commands that deal with\
    \ them. If you want to edit a text file, for example, there are a number of choices,\
    \ with the two big ones being Emacs and Vi. Both are overkill if you just want\
    \ to tweak a configuration file; in this instance, try nano instead:\n\n```\n\
    nano -w somefile.txt\n```\n\nThe -w option turns off word wrapping, which you\
    \ certainly don't want when editing configuration files. The status bar at the\
    \ bottom shows the main commands – for example, press [Ctrl]+[X] to save your\
    \ file and exit. This assumes you know which file you want, but what if you know\
    \ what you're looking for but not the name of the file? In that case, use grep.\
    \ This searches text files for a string or regular expression.\n\n```\ngrep sometext\
    \ * txt\n```\n\nwill search all .txt files in the current directory and show any\
    \ lines containing the matching text from each file, along with the name of the\
    \ file. You can even search an entire directory hierarchy with -r (or --recursive):\n\
    \n# Getting help\n\nThe command line may appear a little unfriendly, but there's\
    \ plenty of help if you know where to look. Most commands have a --help option\
    \ that tells you what the options are. The man and info pages are the main sources\
    \ of information about anything. To learn all the options for a program and what\
    \ they do, run:\n\n```\nman progname\n```\n\nThe man pages are divided into numbered\
    \ sections. The ones that are most applicable to using the system are: 1 User\
    \ commands\n\n5 File formats and conventions 8 System administration tools If\
    \ you don't specify the number, man will pick the first available, which usually\
    \ works. But man pages are not limited to programs; they also cover configuration\
    \ files. As an example, passwords are managed by the passwd command, and information\
    \ is stored in the /etc/passwd file, so you could use:\n\n```\nman passwd\nman\
    \ 1 passwd\nman 5 passwd\n```\n\nThe first two would tell you about the passwd\
    \ command, while the third would explain the content and format of the /etc/passwd\
    \ file. Man pages have all the information on a single page but info pages are\
    \ a collection of hypertext-linked pages contained in a single file. They often\
    \ provide more detail but aren't very intuitive to read – try info info to see\
    \ how to use them. It's often easier to use a search engine to find the online\
    \ version of info pages, which contain the same information in the more familiar\
    \ HTML format."
  merge: -1
