    www.gnumeric.org


    # AbiWord


    The wide gap between rich text editors and word processors is occupied by AbiWord.
    It''s lightweight but still offers commonly-used word processing features, which
    makes it a popular for lightweight distros. It also offers cloud-based collaboration
    capabilities via its AbiCollab.net service.


    # KMyMoney


    Designed for KDE users, KMyMoney is a feature-rich accounting app. It supports
    different account types, such as Cash, Checking, Savings, etc and can categorise
    incomes and expenses, and can reconcile bank accounts. If your bank allows it,
    you can have KMyMoney connect to your bank directly to retrieve your account activity.

