  md: '# Distro differences


    Taking baby steps with Linux.


    One of the biggest difference that foxes users coming from proprietary OSes is
    the lack of a consistent ''look and feel'' to the Linux desktop. The default desktops
    on Ubuntu, Fedora and Mageia distros all look and behave differently from each
    other. We say default because unlike other proprietary OSes, a Linux distro enables
    you to swap out the desktop and replace it with an entirely different one to better
    suit your workflow.


    The idea of the desktop as a separate entity from the operating system sounds
    foreign to users coming from Windows or Mac. But like all things Linux and open
    source, users are spoilt for choice when it comes to putting a face on top of
    their Linux distro.


    # Unity in diversity


    The Ubuntu distribution uses its own home-brewed Unity desktop. The most prominent
    component on the desktop is the vertical Launcher which functions pretty much
    like a taskbar. It houses icons for the frequently used apps for quick access
    that you can modify as per your requirements. Also, some icons have specialised
    right-click context menus that give you quick access to frequently used features.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_23_0.png)


    Users of Gnome-based distros should use the Gnome Tweak Tool to tweak the behaviour
    of their desktop.


    The first icon on the Launcher brings up the Dash, which is Ubuntu''s take on
    the traditional menu-based navigation system. It features a search box at the
    bottom and anything you type here is used to look for matching apps, documents,
    music, videos, instant messages, contacts and other content. Furthermore, you
    can also use the Dash to install and uninstall apps and preview media files. Unity
    also includes the Heads Up Display (HUD), which is an innovative take on the application
    menus. Using HUD helps you avoid the trouble of looking for options embedded deep
    within nested menus. To access HUD press the Alt key from inside any app and use
    the Dash-like search box to perform a task.


    The default Unity experience is the result of extensive usability research by
    Canonical. But you''ll find some options to tweak the desktop from under the System
    Settings tool accessible via the gear & spanner icon in the Launcher. The settings
    are grouped into three broad categories. The Personal group houses settings for
    customising the look and feel of the desktop by changing the wallpaper and modifying
    the behaviour of the launcher. Pay attention to the Online Accounts settings which
    you can use to sign into several online services, such as Facebook and Google
    Docs, and integrate their contents with the desktop apps. For example, adding
    your Flickr account will integrate it with the Shotwell photo manager.


    # Gnome thyself


    Gnome is another popular desktop, and the Gnome 3 desktop contains more or less
    the same elements as Ubuntu''s Unity but presents them in a different way. For
    starters the desktop is very bare. Click on the Activities button in the top-left
    corner to reveal the Overview which is very similar to Unity''s Dash. In this
    view, you also get a Launcher-like Favourites bar for accessing frequently used
    apps.


    In the centre you get a preview of all open windows. To the right is the Workspace
    Switcher, which always shows the current Workspace and an additional one. If you
    add windows


    # Resuscitate an old workhorse


    One Linux speciality is infusing life into machines doubling up as paperweights
    because they can''t keep up with the hardware demands of modern OSes. While there
    are many distros that are designed to power older hardware, our all-time favourite
    is Puppy Linux.


    The distro uses one of the lightest window managers (JWM) and though it might
    not be pretty to look at, it''ll turn that old lethargic work horse into a galloping
    stallion. But the main reason for Puppy''s stellar performance on hardware with
    limited resources is its sheer number of lightweight custom apps. The distro has
    graphics apps, productivity apps,


    apps to playback, edit and even create multimedia. Using its custom apps, you
    can block website ads, grab podcasts, do internet telephony, burn optical media,
    and a lot more.


    The distro is available in different flavours. The Wary Puppy edition uses an
    older kernel and includes additional drivers to support peripherals like dial-up
    modems. There are flavours based on the recent Ubuntu releases too, such as Tahrpup
    based on Ubuntu 14.04 and Slacko Puppy based on Slackware Linux. These editions
    use a newer kernel than Wary but take advantage of Puppy''s custom apps for limited
    resources.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_23_1.png)


    Puppy Linux has very helpful forum boards and loads of documentation written specifically
    for new users.'
