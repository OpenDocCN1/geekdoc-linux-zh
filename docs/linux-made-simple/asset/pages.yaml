    MPD (Music Player Daemon) is a superb program that will maintain a database of
    your music collection and play tracks in response to commands from a (possibly
    remote) client program, of which there are many. It is incredibly lightweight,
    which means it''s possible to use it with a ncurses-based console client such
    as ncurses (or the even more confusingly named ncmpcpp) without your CPU even
    noticing. MPD isn''t shy of features; it plays anything the FFmpeg library understands
    (in other words, anything), Spotify and SoundCloud playlists are supported, and
    all manner of plug-ins are available. If you just want a simple ncurses music
    player, then your first stop should be Cmus or Herrie.


    There are graphical clients for MPD, too, such as Xfmpc for XFCE and Gimmix, but
    development seems to have dried up on most of the other GTK+ ones. On the Qt front,
    all we were able to come up with was Cantata. In terms of standalone applications,
