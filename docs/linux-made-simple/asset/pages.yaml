  md: 'overclocking are divided; it does give better performance but at the cost of
    possibly shortened component life and unreliability if you push it too far, plus
    more heat to get rid of. Some CPUs are locked at a particular speed, so you need
    to make sure the processor you choose is able to be overclocked. You also need
    a suitable motherboard. They all offer some control over frequencies and voltages,
    but some motherboards are intended for overclockers and offer far more control
    – you’ll need to do your research carefully.


    Building your own laptop is not a reasonable proposition, but you can still research
    the components to make sure you get what you need.


    have more fan connectors and some speed control for them. When choosing cooling
    fans, go for the largest you can fit. A larger fan shifts more air; fast spinning
    fans create more noise.


    If noise is an issue, consider water cooling.


    Overclocking used to be a specialist field that required you to buy and assemble
    various components then spend ages bleeding the system and performing leak tests
    (it may surprise you, but water and electronic do not mix well). Nowadays pre-built
    units are available where you bolt the radiator assembly to a suitable point on
    the case and clip the heat sink in place of the CPU fan. Some kits also include
    GPU coolers; as mentioned, gaming works them hard too. Water cooling is not only
    for gamers and overclockers, it can be use on a standard desktop system to reduce
    the noise. The


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_53_0.png)


    loudest noise from such a setup comes from the hard drive stepper motors.


    # Sealed systems


    Assembling a desktop or server computer is a fairly straightforward task, creating
    your own laptop isn’t. While it’s possible to buy laptops piecemeal, it’s not
    the usual way of doing things. Still, much of what we have covered in this feature
    still applies. It is just as important to choose suitable components for a laptop;
    even more so really because you cannot


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_53_1.png)


    Even with this four-year-old system, the CPU spends a lot time of doing nothing,
    but it’s nice to have the capacity.


    # Installing an operating system


    Once you have built your computer, you will need to install an operating system.
    We will not look at that here, the distro installers are well enough documented,
    but there are a couple of points to consider. New motherboards will use UEFI rather
    than the older BIOS. They may also have Secure Boot enabled. You will almost certainly
    need to turn this off in the firmware. Press the relevant key at boot to configure
    the firmware, the motherboard’s manual will tell you


    which it is (one of the joys of building your own computer is that you get a manual
    for your motherboard). You should be able to use UEFI to boot the computer, most
    distros now work with it, and it’s nicer to work with than the old MBR system.
    If you need to use MBR booting, there will be an option for this in the firmware
    menu. Some have a UEFI boot option that you can turn off, others have the cryptically
    named CSM (Compatibility


    Support Module) that has to be enabled for MBR booting. If you are building a
    Linux-only system, you can just boot from your favourite DVD and install. If you
    want to dual boot with Windows, you should install Windows first and then Linux.
    The Linux installer will pick up the Windows installation and set up a dual-boot
    menu, whereas the Windows installer would just trample over the Linux bootloader
    if you did things the other way round.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_53_2.png)


    # 7 Graphic card


    Fit your graphics card into the PCI-16 slot. Check its documentation to see if
    it needs an external power feed or whether it gets all the power it needs from
    the PCI slot. Fit any other PCI cards you may be using at the same time. Many
    new power supplys (PSU) offer modular cable systems, else adaptors are available
    if your PSU is missing suitable connectors, but ensure it’s powerful enough.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_53_3.png)


    # 8 Tidy cables, tidy mind


    Keep your cables tidy, even if you don’t have a window in the case. Untidy cables
    will disrupt airflow and make life harder the next time you try to add or replace
    a component. If your case doesn’t have clips to hold cables out of the way, small
    cable ties do a very good job of it. You can also often feed cables behind the
    motherboard tray or inside the hard drive fixtures.'
