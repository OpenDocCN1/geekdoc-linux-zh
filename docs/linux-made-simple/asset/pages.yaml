  md: '# Sound


    A once thorny subject.


    The Linux sound system has been through many changes. We had OSS (Open Sound System)
    for years, before ALSA (Advanced Linux Sound Architecture) came along. ALSA is
    still with us, but we also have PulseAudio and Jack now.


    ALSA supports multiple sound cards, each of which may have multiple inputs and
    outputs. It also provides support for hardware mixing, where the hardware supports
    it, and software mixing where it does not. This removes the need for sound managers,
    as provided by KDE and Gnome in the past, to enable more than one application
    to play sound at the same time. ALSA works at a low level, close to the hardware,
    so it gives low latency. Most hardware is directly supported now, and installing
    a distro should result in sound working from the first boot. ALSA is a combination
    of kernel code and user-space applications. It also provides an API so that other
    programs can control it directly, like the mixer control panels included with
    desktop environments.


    # PulseAudio performance


    PulseAudio is a newer audio framework, but it is not a replacement for ALSA. Instead,
    it sits on top of the kernel audio system, providing a greater amount of control.
    It works as a server, accepting input from sources and forwarding it to sinks
    (output hardware or capture software). In many cases, the sink is ALSA, and the
    source can be an ALSA driver, too, for applications that don’t directly support
    PulseAudio. Hence


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_18_0.png)


    If anyone tries to tell you that PulseAudio is complicated, it’s best not to argue
    with them. Not that the complexity of this layout matters too much if it just
    works for you.


    you can end up with an application sending output to an ALSA device, which intercepts
    the stream and routes it through PulseAudio back to ALSA. It is no surprise that
    many found PulseAudio complex. A good setup should render all of this chicanery
    transparent to the user, which is where we are now with distro installers and
    PulseAudio, so most of the time we are back at the ‘just works’ situation of ALSA,
    but with better support for multiple devices. ALSA supports multiple output devices,
    but the default is a global setting. PulseAudio allows you to direct music through
    speakers while using a Bluetooth headset for VOIP calls. It also allows for less
    complex but equally useful separation, such as separate volume settings for each
    application. PulseAudio is network-aware – it can be used to find other PulseAudio
    servers and play audio through their speakers – great for streaming music around
    the house.


    JACK (Jack Audio Connection Kit) is a sound server designed for professional audio
    applications. Its forte is providing low-latency real-time connections between
    applications, for audio and MIDI data. It is not needed for typical desktop use,
    only for budding musicians.


    # Printing


    CUPS and drivers.


    While open source encourages choice, and therefore several programs that do the
    same thing but in slightly different ways, there are some areas where one program
    is virtually unchallenged. X.org is used universally to provide graphical displays,
    and CUPS maintains a similar position in the printing arena.


    If you have a printer attached to your Linux box, you need two things – CUPS and
    drivers for your printer. In many cases, these come together. CUPS is a server
    that sits in the background waiting for print requests. Just about any program
    that prints knows about the Internet Printing Protocol (IPP) that CUPS speaks.
    Hit ‘Print’ in your word processor or browser, and a window pops up showing your
    printer, and giving a choice if you have more than one.


    The application only needs to send the data to be printed, usually as PostScript,
    to CUPS, which takes care of everything else – including waiting for you to remember
    to switch the printer on. CUPS does not even need to be running on the same computer;
    it is a networked service and a printer on one computer should be available to
    everyone on the same


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_18_1.png)


    Taking care of printers with CUPS is as easy as following a few links in a browser,
    thanks to its built-in web interface.


    network. CUPS is useless without drivers that tell it how to speak to the printer.
    It includes a large number of drivers by default, and many more are available
    by installing the gutenprint driver package (so many that your distro may well
    have installed this by default). HP also provides a driver (and scanner) driver
    package called hplip, which you need if you use its products.


    However, some printer companies insist on providing their own drivers instead
    of having them bundled with CUPS, usually for licensing reasons. In that case,
    you have the choice of trawling the printer manufacturer’s website for a driver
    package suitable for your system and installing it separately. After that, the
    drivers should appear in CUPS and your distro’s printer configuration tool. The
    other choice is to check with linuxprinting.org before buying a printer, and stick
    to the more enlightened manufacturers.'
