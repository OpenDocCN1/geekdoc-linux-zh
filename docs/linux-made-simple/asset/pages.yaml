  md: '# Hardware | Build a Linux PC


    margin. There''s a value for money sweet spot that''s usually a couple of steps
    down from the ultimate. Processor speed is not everything, as memory can have
    a greater effect on your computer''s performance. Going down a step in processor
    speed and spending the savings on more memory, or an SSD, will usually result
    in a faster computer. Try leaving a system monitor like top running while you
    use your computer and see how often you use all of your current processor''s performance.
    Unless you are a gamer, or spend your spare time compiling custom kernels, you
    will be surprised at how rarely your processor usage becomes a limitation.


    The other choice to be made is between Intel or AMD hardware. You could try a
    web search on which is best but be prepared to spend some time searching for real
    facts among the religious fervour. The truth is that processors are so fast nowadays
    that for a home system, you would be happy with either. Processor choice affects
    the choice of motherboard, so it may be that, depending on your needs and budget,
    you end up choosing a CPU to go with the motherboard you want.


    # Motherboard


    If the processor is the heart of your computer, the motherboard is the central
    nervous


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_49_0.png)


    system. Everything plugs into this board. In the past, that was all a motherboard
    did: connected everything together. Now they contain a lot of previously separate
    components built in, such as network interfaces and sound cards. As Intel and
    AMD use different CPU sockets, choosing your processor immediately reduces the
    number of motherboards you have to choose from. Now there are some questions you
    need to ask, such as do I need more than one network interface? How much memory
    will I want to fit – now and in the future? How many SATA connectors will I need
    – don’t forget to allow for one for your optical drive and possibly an external
    eSATA connector too. Also, how fast are the SATA interfaces? This is especially
    important if you are using an SSD. How many USB ports do I need, and what type?
    While USB 2.0 is fine for a keyboard and mouse, you will want USB 3.0 connectors
    for storage devices, and possibly a USB-C connector.


    Consider the built-in devices of a motherboard you are interested in, such as
    network interfaces and sound ''cards.'' While the motherboards themselves will
    work with Linux, will the peripheral devices? Sound cards aren’t much of an issue
    these days as most support the Intel HD Audio standard but check anyway as the
    codecs in use can vary. Wired network devices are also generally well supported,
    but you may have problems with a very new motherboard that uses a device not yet
    supported by the current kernel of your chosen distro. As usual, a quick search
    of your favourite search engine, using the name of the


    > When it comes to assembling a PC, the motherboard is just the thing that everything
    else plugs into.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_49_1.png)


    > Memory may seem unassuming, but it has a greater effect on the performance of
    your computer than many other components.


    board and the Linux distribution should turn up and potential problems and solutions.
    Support for onboard devices may not be a critical issue if you have enough PCI
    slots you can install alternatives and then disable the built in hardware.


    Size can be important. If you are building a system in a large tower case, a full-sized
    ATX motherboard is easier to work with, but for a media centre you may want a
    smaller form factor that will fit in an attractive case that can go under your
    TV.


    # Memory


    Memory is one of the simplest ways to boost the performance of a modern computer.
    It enables more tasks and data to be handled at once and any memory that’s left
    over is used by the Linux kernel to cache disk data which, incidentally, is why
    your computer shows almost no memory free after it has been running for a while.
    There are three things to consider when buying memory, the physical layout, the
    size and the speed. The current memory standard is DDR3 and DDR4. Don’t try to
    fit the older DDR or DDR2 sticks into these slots, they are incompatible. Size
    is obvious, and it is worth getting the most your budget allows. Check your motherboard’s
    manual for the maximum size for each slot because, although the spec allows for
    up to 16GB per DIMM, most Intel systems are limited to 8GB per unit. Motherboards
    usually use a dual-channel architecture for memory,


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_49_2.png)


    > Some memory vendors provide databases that are very handy for seeing which memory
    is best for your motherboard.


    # Terminology


    You will encounter plenty of abbreviations and jargon when looking at hardware,
    here are some of the common terms used:


    +   » DDR 2/3/4 Double Data Rate, a technology using in memory chips.

    » DIMM Dual Inline Memory Module, this is plug-in memory module.

    » WAF Wife Acceptance Factor, seen on male-dominated forums and considered important
    for hardware that will be in the home.


    +   » Northbridge/Southbridge Chips on the motherboard that handle core logic
    and communication between the CPU and other components.

    » SATA Serial ATA, the current standard for connecting storage devices to computers.

    » ATX A motherboard configuration specification, meaning most boards are interchangeable
    in physical format and standard connectors.'
