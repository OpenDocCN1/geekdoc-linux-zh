  md: '# All about Grub


    When you install Ubuntu alongside Windows, it adds a special boot loader to your
    system that provides a boot menu for choosing between Ubuntu and Windows on startup.
    That boot loader is called Grub 2, and as you’ll have seen, it’s designed to wait
    a short period of time before automatically loading Ubuntu. You can configure
    how Grub behaves – choose a shorter or longer time before it starts loading the
    default choice, and even change that choice, by editing its configuration file
    and updating Grub via the terminal. Before doing so, make sure you’ve backed up
    the system.


    Once done, open the terminal, then type sudo apt-get install gksu followed by
    gksu edit/etc/default/grub &. This opens the Grub configuration file in a Gedit
    window. From here, you need to edit the existing file with whatever changes you
    wish to implement. First, the GRUB_DEFAULT=0 line is what makes Ubuntu the default
    choice at boot time. To make Windows the default choice, and assuming there are
    five entries in the boot menu (Ubuntu, Ubuntu advanced options, two memory test
    options and finally Windows), change this to GRUB_DEFAULT=4.


    Alternatively, to switch default OS to whichever one was selected previously,
    change GRUB_DEFAULT=0 to GRUB_DEFAULT=saved, then add a new line immediately below
    this: GRUB_SAVEDDEFAULT=true. You can also change the length of time – in seconds
    – that Grub waits before it boots the default choice. Simply change GRUB_TIMEOUT=10
    accordingly. When you have done this, click the ‘Save’ button and close the Gedit
    window. Ignore the warning and type sudo update-grub to update the boot loader.


    includes a handy Apps tab that makes it easy to locate and install new software.
    Also take the time to explore the Tweaks section and – in particular – the Unity
    component where you can do things such as resize the Launcher icons.


    Two other tweaking tools that are worth exploring are the Unity Tweak Tool, which
    gives you even more fine control over the desktop, and Tweak Tool. Both can be
    found via the Ubuntu Software Center – choose the trusty-backports version of
    the Unity Tweak Tool. Both offer similar point-and-click access to hidden system
    settings.


    # Repositories


    Although you can download programs from websites, it’s far easier to use the centralised
    Software Center. Ubuntu provides its own software repository, which is a server
    containing hundreds of Linux programs specially compiled to work with Ubuntu.
    This means any software you find in the Software Center should work without problems,
    which makes it a little like having your very own Linux app store. The Center
    also looks out for program updates, alerting you when they’re available and installing
    them for you.


    You’re not restricted to one app store – sorry, repository – either; install a
    program such as Dropbox from its own website, for example, and it’ll add its own
    repo to the Center, enabling it to alert you when updates are available.


    To manage these repos, open Software Center and select ‘Edit > Software Sources.’
    A list can be found under the ‘Other Software’ tab, where you can manually add
    your own.


    So far we’ve not dealt with Terminal, which is Linux’s equivalent of the Windows
    command prompt. While it’s technically possible to avoid this, if you want to
    make the


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_38_0.png)


    Configure Grub to choose which OS loads by default.


    most of your new OS, then learning to navigate it is essential. Opening Terminal
    is simple enough – simply press [Ctrl]+[Alt]+[T]. A new window appears and at
    superficial glance it looks a lot like the command line in Windows. In Ubuntu,
    you start off in the ~ directory, which basically means your personal home folder.
    Type dir and you’ll see a list of folders to confirm this. To change directory,
    use the cd command – to move up a level, type cd …, or type cd home/nick/Pictures
    to jump directly to another folder (note that directory paths are case-sensitive).
    You can return to your home directory at any time using the cd ~ command. Other
    file-management commands include cp (copy), mv (move), mkdir (create folder) and
    rm (delete). One key command you’ll need to learn is sudo. Linux is very tight
    on security, and in normal day-to-day operations your access is quite restricted.
    You can’t, for example, modify files on your Linux partition outside of your home
    directory. What sudo does is give you elevated access, enabling you to manipulate
    files and perform commands – think of it like right-clicking a program in Windows
    and choosing ‘Run as


    > “If you want to make the most of your new OS, learning to navigate Terminal
    is essential”


    administrator’. You can prefix any command with sudo to gain this access, but
    you’ll need to provide your password.


    You can install software directly from the command line, too, using the apt-get
    command. To install GIMP directly from the terminal, for example, you type sudo
    apt-get install gimp. The apt-get command can also be used to update all existing
    software (apt-get upgrade), check for broken dependencies (apt-get check) and
    fix problems with missing dependencies (apt-get -f install). Over time you can
    use it to free up disk space by removing Deb packages you’ve uninstalled (apt-get
    autoclean).


    It’s even possible to download files using wget – simply type wget followed by
    the full URL of the file you wish to download, which will automatically be saved
    to your personal downloads folder. To find out more about these and other commands,
    check out our Terminal core skills tutorials, starting on page 102.


    Now you’ve installed Ubuntu alongside Windows and grasped the basics of Linux,
    there’s no turning back – in fact, we suspect you’ll wonder why you didn’t try
    it before.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_38_1.png)'
