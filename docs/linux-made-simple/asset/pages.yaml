- pgno: 61
  md: 'Now navigate to the folder where the **SteamOSInstaller.zip** was downloaded
    (usually Downloads), for example:

    then type in

    where **/path/** is enter the path of your USB drive. Next, you''ll need to install
    the USB stick into the machine that you''re using for the installation. With the
    USB stick installed, start up the PC and load up the BIOS. This can usually be
    done by repeatedly tapping F8, F11, or F12 as soon as your system is turned on.


    ```

    cd ~/Downloads/

    ```


    ```

    unzip SteamOSInstaller.zip -d /path/

    ```


    Once in your BIOS make sure that UEFI support is enabled and select the UEFI entry
    to boot from.

    If you don''t mind having the entire hard drive formatted and replaced with SteamOS,
    select the Automated install option from the menu when it appears. If you have
    additional disks and partitions that you want to keep, and you want to install
    SteamOS in a select location choose Expert install.

    If you''ve ever used the Debian installer you''ll be pretty familiar with what
    comes next. First, you''ll be asked to choose your language,


    location and keyboard layout. The installer will then begin setting up your hardware
    which will usually take a few minutes. Once done you''ll see your hard drives
    and partitions. This is where you can decide which partitions and drives to use
    to install SteamOS – useful if you don''t want to use all of your hard drive or
    if you''re planning on going the dual-booting route with SteamOS for gaming and
    another distro for day-to-day tasks.

    Select the free space for installing SteamOS – it should be a minimum of 10GB.
    Select Create a New Partition if you need to


    # Peripherals


    So you''ve built an amazing, yet compact, Steam Machine and loaded up SteamOS.
    Now what? You''ll want to get some great gaming peripherals for comfy gaming from
    your sofa. Valve itself has been working on a dedicated Steam controller with
    the lofty ambition that it will combine the convenience of a game controller with
    the precision of a keyboard and mouse setup. It''s certainly a tall order and
    one that Valve appears to have struggled with as the controller has been delayed
    until late 2015. While we wait for Valve''s official controller, which will cost
    $50, a number of other


    companies offer some great alternatives for controlling SteamOS games. Roccat
    has built a Sova lapboard especially for SteamOS which offers a small mechanical
    keyboard and large mouse pad that can rest on your lap. You can also use games
    controllers from game consoles, such as the Xbox 360 and PS4 as SteamOS does a
    good job of recognising them as soon as you plug them in. If you''re a fan of
    racing games then the good news is that renowned racers, such as *Project Cars*
    are coming to Linux. What''s not so great is the support for steering wheel controllers.


    If you have a Logitech controller you can install the LTWheelConf tool. Full instructions
    on how to use it can be found on the Steam network (http://bit.ly/LTWheelConf).


