  md: '![](img/57f4a2d286909b0a84c8ecfefbbe15f2_66_0.png)


    The raspi-config overclock menu comes with the required warning that pushing too
    far will break your Pi.


    attached. But the OpenLX SP team behind these boards has released special versions
    for the B+ and Raspberry Pi 2.


    # 3D graphics test


    Every Raspberry Pi comes with the same VideoCore IV GPU (Graphical Processing
    Unit) that enables the Raspberry Pi to play back high-definition video at 1080p.
    The new Pi also comes with this GPU, also made by Broadcom just like the BCM2836
    powering the new Pi. Did you know that there’s a test suite for the GPU?


    You can find the test suite by opening LXTerminal and typing the following:


    ```

    cd /opt/vc/src/hello_pi/

    ```


    In there you will find a number of directories containing many different demos.
    But before we can use them we need to build the demos from source, and to make
    this easier the Foundation have provided an automated build script that will only
    need to run once. To run the script, in LXTerminal type


    ```

    ./rebuild.sh

    ```


    This build script will run the build process for all of the demos so it may take
    a few minutes, even on our new speedy Raspberry Pi.


    Once completed there are a number of demos that you can try out and the first
    on the list should be hello_teapot. To run it, in LXTerminal make sure that you
    are still in the hello_pi directory and type:


    ```

    cd hello_teapot

    ```


    ```

    ./hello_teapot.bin

    ```


    You will now see a 3D render of a teapot with video that’s been directly rendered
    on to its surface. To exit out of the teapot demo hold Control+C together and
    you will be returned to LXTerminal.


    Another demo to try is hello_triangle2 and to get to that


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_66_1.png)


    you will need to go back to the hello_pi directory and we can do that by typing.


    ```

    cd ..

    ```


    From hello_pi we can change our directory to hello_triangle2 and run the demo
    by typing


    ```

    cd hello_triangle2

    ```


    ```

    ./hello_triangle2

    ```


    This demo appears to be rather static at first, but try moving the mouse around
    and you will see two fractals superimposed one over the other moving and reacting
    to your mouse movements. Apparently, you can also control the fractals to create
    a perfect circle. To exit out of the hello_triangle2 demo hold Control+C together
    and you’ll be returned to LXTerminal


    So we’ve taken a look around the new Raspberry Pi 2, seen how it performs out
    of the box and taken time to supercharge our Pi. On the next page we will interface
    Minecraft with Pibrella to create a pushbutton bomb deployment system!


    # Quick tip


    The Raspberry Pi 2 shares the same dimensions as the B+ but for those of you looking
    to reuse a B+ case, such as the Pibow, it’s worth noting that some surface mount
    components have been moved. These changes don’t affect the overall size of the
    board but as the Pibow uses layers to build, a new layer will be required for
    your Pibow.


    # Updating your Pi


    The Raspberry Pi Foundation has released many new updates to the existing Raspbian
    install and keeping your Raspberry Pi up to date is a really good practice. There
    are a few handy Terminal commands to help you, such as


    ```

    sudo apt-get update

    ```


    which will update the list of installable software. Using the following


    ```

    sudo apt-get upgrade

    ```


    will check for the latest software, while


    ```

    sudo apt-get dist-upgrade

    ```


    is similar to upgrade, but a more intelligent updater that removes old kernels.


    If you would like to install the new desktop, and who wouldn’t as it is a really
    great piece of work by Simon Long, type the following three lines into a terminal:


    ```

    sudo apt-get update

    ```


    ```

    sudo apt-get dist-upgrade

    ```


    ```

    sudo apt-get install raspberrypi-ui-mods

    ```


    Once completed, reboot your Raspberry Pi for the changes to fully take effect.
    Once logged back in you will be greeted with the new and improved interface. Updating
    is done via the terminal using the very powerful apt package management system
    that’s used by all Debian-based distributions.'
