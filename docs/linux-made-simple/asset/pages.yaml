  md: '# Genus Mandrake


    A distro which has a lot to scream about.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_78_0.png)


    Until the release of Mandrake, Linux was generally thought of as a geek''s OS.
    Mandrake was the first distribution that focused on the convenience of the user.
    The goal was to provide a distro that could be operated by regular computer users.
    It had features such as the ability to auto-mount CDs without messing around with
    configuration files, which brought greater convenience to the Linux desktop.


    The Mandrake project has perhaps the most convoluted existence for a free software
    project. Over the years, the project has undergone various name changes, mergers
    and forks. However, it has spawned many distros and there are several major ones
    that are still active and can trace their lineage to Mandrake.


    The distro has developed a bunch of custom tools – collectively known as drakxtools
    – to aid its users, who are called Drakes or Drak s. One of the most distinguishing
    components created by the project is its Mandrake Control Center (MCC), which
    is now a centrepiece of all the derivatives. The MCC provides a single interface
    to access many different configuration tools. Using the Control Center in text
    mode is very useful in case of display problems or other serious issues, such
    as when the graphical server refuses to start. It''s also interesting to note
    that all modules can be run as autonomous apps, without necessarily having to
    go through the MCC.


    # On life support


    Mandrake Linux was first released in July 1998. It was based on Red Hat Linux
    5.1 and featured the inaugural KDE desktop release. After the positive response,
    lead developer Gaël Duval, along with a bunch of others, created the company MandrakeSoft
    and in 2001 the company decided to go public. It faced its first major cash issue
    in late 2002 and asked its users to bail it out by subscribing to a paid service
    offering extra benefits, such as early access to releases and special editions.
    That wasn''t enough and the company filed for bankruptcy protection in 2003. However,
    later that year MandrakeSoft announced its first quarterly profit and, in March
    2004, a French court approved its plan to emerge from bankruptcy and return to
    normal operations.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_78_1.png)


    The company also had to rename its product to Mandrakelinux, after losing a legal
    battle with the American Hearst Corporation over the Mandrake name and changed
    its name to Mandriva S.A. after acquiring the Brazilian company Conectiva in 2005.
    The distro became Mandriva Linux, but in 2006 Mandriva laid off several employees,
    including co-founder Duval. Amidst all the booing, the company continued putting
    out releases and created a niche for itself in the BRIC region (Brazil, Russia,
    India and China) as well as France and Italy.


    Despite all their efforts, the company struggled to keep its balance sheet in
    the black. In 2010, Mandriva abandoned development of the community Linux distro
    to avoid


    Rosa Linux is a Mageia fork that features some dramatic user interface mods such
    as this Simple Welcome app launcher.


    > > “One of the most distinguishing components created by the project is its Control
    Center.”


    bankruptcy. Immediately afterwards, former Mandriva employees announced Mageia,
    which has gone onto be one of the most popular Mandrake-derivatives. Mandriva
    S.A. transferred development to the community-driven Open Mandriva Association.
    The association’s second release called OpenMandriva 2014.0 got a positive review
    from Duval.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_78_2.png)


    # Salix Mageia


    Mageia is one of the best-assembled community distros and does a wonderful job
    of carrying forward the Mandrake legacy. It has an expansive support infrastructure
    and very good documentation. The distro follows a nine-month release cycle and
    each is supported for 18 months. Mageia has installable live media as well as
    install-only DVD images.


    Mageia boasts intuitive custom tools for managing various aspects of the distro.
    One of the best tools is the Mageia Control Center, which has modules for managing
    software, hardware peripherals and system services. Advanced users can employ
    it to share internet, set up a VPN and configure network shares. The distro uses
    the URPMI package management


    system and ships with three official repos. The Core repo contains open source
    packages, the Non-free hosts proprietary apps and drivers, and the Tainted repo
    includes patent-encumbered apps. The distro ships with several desktop environments,
    and the developers have made sure the user experience is consistent across all
    of them.'
