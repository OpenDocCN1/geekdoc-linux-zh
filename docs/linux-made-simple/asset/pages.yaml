  md: '# Elive


    Elive is a great showcase for the Enlightenment desktop. In the 90s, when it appeared,
    people (including us) would have rolled on the floor laughing if told that one
    day Enlightenment would be a low-resource choice. Today, we can testify that Elive
    gives the best compromise between visual effects and performance on limited hardware.


    The system monitor, with its gauges for battery charge, CPU temperature and power
    policy, is attractive as well as useful, and there are enough apps, including
    the Unison file synchronisation tool. If you have the patience to configure it,
    everything will look just as you want, from the font of window titles to sticky
    notes. Before that, though, turn off the fading and zooming effects if you''re
    really short of RAM.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_86_0.png)


    # Manjaro


    If distracted users confused Manjaro with Crunchbang, they would be justified
    – both systems are Arch Linux spin-offs dressed in OpenBox. The main difference,
    besides a smaller selection of apps, is in the default browser. Manjaro uses Midori,
    which is enough to run Gmail and similar web services based on Ajax, but it can''t
    play YouTube videos.


    On the other hand, Manjaro includes tools that you may never have heard of before,
    from the Parcelite clipboard manager to Avahi browsers for SSH and VNC servers.
    Manjaro also makes it easier than Crunchbang to fiddle with OpenBox, especially
    if you already know how to handle it. Besides the Tint2 configurator, the system
    menu contains all the possible tools to configure the workspaces and dynamic menus
    of this powerful window manager.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_86_1.png)


    # Puppy


    Slacko 5.7, the member of the Puppy pack we''re looking at in this context, is
    at the time of writing the "recommended first stop for all newcomers" to the Puppy
    family. Its user interface is the result of a careful mix of the JWM window manager,
    the ROX Filer and many big and small apps, from household names such as Firefox
    to really obscure utilities. The System sub-menu even has a floppy disk formatting
    utility, together with the GParted partition manager.


    We don''t understand the rationale behind separate sub-menus for ''Document,''
    ''Business'' and ''Personal'' applications, but there they are. This said, JWM
    and ROX work well together, and ROX is one of those apps that every Linux user
    should try at least once – fast, simple and cute. Lean and mean doesn''t mean
    ugly or lacking in features.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_86_2.png)


    # Choices


    # What if the version tested here is almost what you want?


    Are these distros a ''take it or leave it'' deal? It depends on what you''d like
    to change. If all you want is alternative window managers, no problem. Absolute
    is declared ''package compatible'' with Slackware releases with the same number,
    while Crunchbang and Manjaro have access to the Arch repositories; you should
    find enough packaged, easily installable alternatives to make you happy. Ditto
    for Elive, which may reuse stuff from Debian and also has an Experimental Mobile
    mode for touchscreen phones, tablets and similar devices.


    Manjaro has three official variants, all with Tulliana and KFaenza icons: two
    for Xfce (full or stripped-down) and one with KDE 4.12 (with KDE Connect http://community.kde.org/KDE
    Connect), deliberately configured to "give all Windows users a new home".


    Want more? Try the Manjaro community editions for other desktop environments (Mate,
    Cinnamon, LXDE and more), the netbook spin for its Atom-optimised kernel or ManjaroISO,
    which facilitates the creation of clones with all or only the packages you want.


    We''ve left the most interesting part for last: Puppy. The Woof Puppy Builder
    (http://bkhome.org/woof) can build a Puppy from the binary packages of any other
    distro. This has already produced a Barebone Puppy, which is said to run even
    on 200MHz CPUs with 64MB RAM, plus too many, wildly different other clones to
    list here.


    # Verdict


    Absolute ★★★★★

    Crunchbang ★★★★☆

    Elive ★★★★★

    Manjaro ★★★★☆

    Puppy ★★★★☆


    » For variants, go to Manjaro.

    To build your own, try Woof Puppy Builder.'
