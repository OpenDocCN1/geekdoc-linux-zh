  md: '![](img/57f4a2d286909b0a84c8ecfefbbe15f2_37_0.png)


    # The vitals of Linux


    Discover the key tools and techniques you’ll need to know.


    Now you’ve familiarised yourself a little with the Unity desktop, it’s time to
    plunge deeper into the Linux ocean and arm yourself with more of the important
    knowledge you’ll need to use it going forward. Before diving in, however, it’s
    a good idea to take a system backup – as you start to learn Ubuntu, you may make
    mistakes that could lock you out of your system. (See ‘Take another backup,’ below.)


    First, let’s take a look at the Linux filesystem and how it’s organised into folders.
    First, Linux uses a different filesystem to Windows (NTFS or FAT32) called ext4.
    This makes your Linux folders invisible to Windows, which can’t natively read
    ext-based drives. That’s fine – we’ve moved your data on to a shared partition
    that both OSes can see, and it’s better that you can’t accidentally access your
    Ubuntu partitions.


    Now, open Nautilus, where you’ll be taken to your Home folder. This works in a
    similar way to your Windows user folder, and normally contains all your personal
    files, although we’ve moved key folders across to your data partition so you can


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_37_1.png)


    Take a backup of your dual-boot system using Redo for extra security.


    share files with your Windows installation. Shortcuts to these key folders can
    be found in the left-hand pane.


    Now click the ‘Computer’ link under ‘Devices’ and you’ll get a look at a load
    of other folders, too. Most of these can be safely ignored on a day-to-day basis
    – the bin folder is where your programs are stored, for example – but two worth
    noting are media and mnt. These are where shortcuts to any external drives and
    network folders you’ve connected to can be found. The key difference between the
    two folders is that drives mounted in the /media folder are mounted on a per-user
    basis, and don’t require elevated access before they are mounted. This means they’re
    not available to the system before you log into your account, which can cause
    some issues with start-up programs. See http://bit.ly/MountWinParts for more information
    – jump to the ‘Configuring /etc/fstab’ section for a guide to mounting partitions
    before login occurs to circumvent this problem.


    # Key system tools


    While Ubuntu will require you to access the command line to perform some complicated
    tasks, there’s a lot you can do without it. We introduced the Disks utility in
    the step-by-step guide (page 17). Disks lets you view and manage your drives and
    their partitions – by selecting one, clicking the ‘Settings’ button and choosing
    ‘Edit Mount Options’ you can make changes to the way partitions are mounted without
    having to edit the fstab file directly. But use with care – if drives don’t behave
    as you expect, flick the ‘Automatic Mount Options’ switch back to ‘On’ to restore
    the status quo.


    Many system preferences can be accessed via the System Settings tool – click the
    ‘Settings’ button on the menu bar to access it. You’ll see three section buttons:
    ‘Personal’, ‘Hardware’ and ‘System’. From there you can access a particular preferences
    tool. Select ‘Appearances’, for example, to tweak some desktop settings, such
    as automatically hiding the App Launcher when it’s not required and moving an
    application’s menus to its own window rather than the main menu bar.


    You can also install a dedicated tweaking tool. We’ve already seen how the Ubuntu
    Tweak Tool can be used to move your home folders to another drive (page 17). It
    also


    # Take another backup


    Now that Ubuntu is safely installed on your PC, it’s time to consider taking a
    fresh backup of your hard drive. You can, of course, use SystemRescueCD for this
    purpose (see page 17). If this sounds like too much hassle, you could try Redo
    Backup and Recovery instead. Download the ISO file from SourceForge (http://bit.ly/Redobackup)
    and burn it to disc – in Ubuntu, insert a blank disc and click ‘Cancel’ when the
    ‘Choose application to launch’ window


    appears. Locate the ISO file (typically in your Downloads folder), right-click
    it and choose ‘Write to Disc’, then click ‘Burn’. When the disc has been created,
    reboot your PC and choose to boot from the disc – you may need to tweak your UEFI
    settings before it will work; enabling CSM for storage should be sufficient. Select
    ‘Start Redo Backup’ (choose the Safe Mode option if this doesn’t work) and click
    ‘Backup’ when the main screen appears.


    Select your drive, then choose which partitions to back up. Then it’s a case of
    selecting your back-up drive and creating a folder into which your backup will
    be stored. Give your backup a name and then Redo Backup do the rest. Should the
    worst happen, recovery is as simple as clicking ‘Restore’ instead of ‘Backup’
    and following the prompts. You’ll also find a ‘Settings’ button in the bottom-left
    where a number of useful disk-related tools reside.'
