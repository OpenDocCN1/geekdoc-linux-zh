- pgno: 40
  md: '# Bye-bye, Windows XP


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_40_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_40_1.png)


    # 1 Gpart it


    Boot the system from the cover disc and select ''SystemRescueCD'', or create and
    boot your own. Select the default boot – the alternatives will help solve potential
    problems you might experience. Select the default keyboard and type startx at
    the final command prompt. This will fire up the default Windows environment.


    # 2 Resize it


    You need to start GParted. This is the icon on the bottom-left, or you can just
    type gparted into the open terminal. What you see next depends on the complexity
    of the host system''s partition structure. It could be a single partition, or
    it could be several. You need to right-click on the one that has the most unused
    space.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_40_2.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_40_3.png)


    # 3 Move it


    Grab the right-hand handle and resize that partition, you''ll want the free space
    to read at least 8,096MB – ideally this should be a lot more. You''ll see over
    the page how you can still access your Windows XP partition, so you don''t have
    to worry about things there. Click ''Resize/Move'' to make the selection, but
    nothing will happen yet.


    # 4 Create it


    Now you''ve found some space for your Linux partition, we''re ready to go. You
    won''t need to partition or format this space. The installer we''re about to follow
    will identify this as where it should install itself. To apply these changes,
    click the ''Apply All Operations'' button. Depending on the amount of stuff, this
    can be a quick or slow process.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_40_4.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_40_5.png)


    # 5 Install it


    Reboot and switch to Linux Mint. Select ''Install Mint'' and you''ll see a familiar
    install system. It''ll eventually ask to install Linux Mint alongside Windows
    XP. Accept and you''re on your way. Just like with Windows, you will need a username,
    network PC name and a decent user password to protect your admin – aka root –
    access.


    # 6 Boot it


    It won''t take long to install Mint and download the latest updates from the internet.
    Once in, you should find Linux Mint to be a pretty similar experience to the long
    outdated XP, except it will be far more secure and – most importantly – it is
    still supported as an operating system. See over the page for all your replacement
    Linux programs.'
