    # Hands-on with the Raspberry Pi 2


    Our experts get early access to the first batch of Raspberry Pi 2s and take one
    for a test drive.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_63_1.png)


    The new Raspberry Pi comes with much more power than it''s predecessors. This
    is thanks to the improved ARM 7 processor running four cores at 800MHz each and
    the generous 1GB of RAM. This increase in both CPU and RAM is a massive benefit
    to projects that require pure CPU grunt, such as OpenCV and Minecraft.


    The Raspberry Pi 2 also benefits from the design improvements made for the B+
    with more USB ports thanks to the LAN9514 providing four ports over the 9512''s
    two. The B+ also introduced better power management and this, again, is also present
    in the Raspberry Pi 2. "Power consumption while performing a given task is comparable
    to that of B+," explains Eben Upton, CEO of Raspberry Pi Trading. "Obviously if
    you push Pi 2 hard it will consume more power as it''s doing more work. Power
    consumption of B+ under heavy load is roughly the same as the old Model B."


    > The Raspberry Pi 2 also benefits from the design improvements made for the B+.


    So now that we have the latest Raspberry Pi, lets take it for a test drive! And
    for this extended tutorial we will be using the latest version of Raspbian available
    via the Raspberry Pi website (www.raspberrypi.org/downloads) as it comes with
    the kernel7.img necessary to use the ARM7 CPU.


    The easiest method to setup your microSD card is to use NOOBS (New Out Of The
    Box Software) To use it you will need at least an 8GB microSD card. Download NOOBS
    as an archive from the Raspberry Pi website and extract the contents to your 8GB
    microSD card which should be formatted to use a FAT32 filesystem. With NOOBS copied
    to your microSD card, unmount and remove the card from your computer and insert
    it into your Raspberry Pi 2, you should hear a gentle click once it is firmly
    in place. Connect up your Raspberry Pi to a monitor via the HDMI port and then
    attach a keyboard and mouse via the USB ports. You will also need to ensure that
    you have Internet access for your Pi. The easiest method is to use the'
