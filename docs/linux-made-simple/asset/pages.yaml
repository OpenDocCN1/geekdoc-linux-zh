  md: '# The Suckless and KISS philosophies


    Growing frustrated with the seemingly inexorable bloat of core tools and libraries,
    a community of motivated hackers have established http://suckless.org. This collective
    aims to produce software based on the key principles of simplicity, clarity and
    frugality – “software that sucks less”, to use their own words. The project is
    geared towards more advanced users, because this group is generally the most frustrated
    by the aforementioned symptoms. The collective’s


    efforts to date include, but are far from limited to: the dwm window manager,
    the dmenu menuing system, the Surf web browser and st, a simple terminal. On their
    website you’ll find a list of software that “rocks”, some of which is included
    in this article. Also, you’ll find lists of software, and assumptions made by
    software, that are deemed to “suck”. The more general KISS (Keep It Simple, Stupid)
    idealogy, oft-uttered on the Arch Linux


    wiki but apropos to so many situations in life, aims for simplicity, eschews unnecessary
    complexity and strives for elegance through minimality. In terms of software,
    this speaks to the underlying UNIX ethos of small tools that do one thing and
    do it well. One can equally see it encompassing those applications (particularly
    graphical ones) that avoid over-worked interfaces, unnecessary features and pull
    in myriad software and library dependencies.


    actions performed by Function keys are helpfully shown at the bottom. You can
    even use the mouse and open files in their native applications (via xdg-open)
    if you run it in an X session. Midnight Commander also has a native viewer and
    editor (hex and ascii), can open archives natively, can browse FTP sites and windows
    shares, and comes with some lovely themes. If you want something a little more
    advanced, then direct your attention to vifm, which features ‘vi-like keybindings’.
    As such, we shall say no more about it.


    Moving on to graphical species, we’ll begin with SpaceFM. This offers a multi-panel
    tabbed interface and its own virtual filesystem, and it is highly customisable
    beyond recognition. It can be built for GTK+2 or 3 and works seamlessly with the
    dependency-light Udevil device-mounting program, so you’re spared asking yourself,
    “What is this, 2004?” when you’re prompted for the root password in order to mount
    a USB stick. SpaceFM can even manage desktop icons, which may appeal to you if
    you’re using a standalone window manager, or may be irrelevant if you consider
    desktop icons to be a relic from 1995.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_98_0.png)


    SpaceFM, a lightweight file manager running in Gnome 3.


    SpaceFM was forked from the venerable PcManFM back in the HAL days. The latter
    is the default file manager in Raspbian and LXDE and differs mainly in its reliance
    on the Gnome VFS (and hence the Udisks2 framework) for mounting of drives, shares
    and whatnot. If you don’t mind installing a bunch of Gnome 2 libs and want an
    OFM, then Gnome Commander is probably a worthy candidate. If you are a KDE person
    with similar desires, then try Krusader.


    # Terminal emulators/multiplexers


    If you’re using a desktop environment, then chances are you’re satisfied with
    the terminal program provided therein. But there are alternatives, some of them
    rather good.


    Of particular note is rxvt-unicode, which builds on the venerable Rxvt with features
    such as unicode support, transparency (pseudo and true) and support for Xft fonts.
    It supports Perl extensions which can provide clickable URLs and a tabbed interface,
    although that relies on GTK+2. Somewhat uniquely, it’s built around a client server
    model, so once the daemon is loaded, opening terminal windows is both swift and
    memory-light.


    If you want to be really minimal, then you should use st (Simple Terminal) from
    http://suckless.org, but it might come as a surprise that there’s no scrollback
    buffer, and that you have to edit a file to make the [Del] key work in Bash.


    Next, we have the GTK-based Lilyterm, Sakura and EvilVte. Lilyterm works best
    with GTK+2, Sakura only with 3, and EvilVte can work with either 2 or 3. All three
    have very few dependencies besides the venerable Gnome VTE library and offer tabs,
    transparency and unicode support.


    Terminals that slide down from the top of the screen à la Quake are popular too.
    These include Yakuake for KDE and Guake, which doesn’t require much besides VTE
    and the Python bindings for GTK+. There is also Tilda (the tilde key summoned
    the terminal in the original Quake), which doesn’t require these bindings. Having
    a terminal with a hotkey away is pretty useful, but sometimes you do need multiple
    windows, so this might not be a complete solution.


    We should also mention Terminator (“the robot future of terminals”) here, since
    it enables the user to tile sessions in all manner of wild configurations.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_98_1.png)


    Remember also that you get a whole bunch of console terminals for free too (accessible
    via [Ctrl]+[Alt]+[Fn] keys). If you’re stuck at the console, you can use these
    as primitive tabs. Or you could up your game and get a terminal multiplexer such
    as tmux or screen.


    These are mainly used for keeping remote programs running after logout, but can
    do much more – multiple sessions, scrollback buffers, copy and paste, awkward
    keyboard shortcuts, the list goes on.


    > “If you want to be really minimal, then you should use st”


    # Web browsers


    Depending on what you’re doing, surfing from the console might be entirely reasonable
    – for example, if you simply'
