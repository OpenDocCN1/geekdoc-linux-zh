- pgno: 112
  md: '# Commands, options and arguments


    You''ll often see references to command arguments and options, but what are they?
    Options and arguments are the things that tell a program what to do. Put simply,
    arguments tell a command what to do, while options tell it how to do it – although
    the lines can get a little blurred. Take the ls command as an example – this lists
    the contents of a directory. With no options or arguments, it lists the current
    directory using the standard format:


    ```

    ls

    Desktop  Downloads  Music  Public

    Videos

    Documents  examples.desktop  Pictures

    Templates

    ```


    If you want to list a different directory, give that as an argument:


    ```

    ls Pictures

    ```


    ```

    ls Desktop Downloads

    ```


    Arguments are given as just the names you want listed, but options are marked
    as such by starting with a dash. The standard convention among GNU programs, and
    used by most others, it to have long and short options. A short option is a single
    dash and one letter, such as ls -l, which tells ls to list in its long format,
    giving more detail about each file.


    The long options are two dashes followed by a word, such as ls --reverse, which
    lists entries in reverse order, as is pretty apparent from the name. ls -r does
    the same thing but it is not so obvious what it does. Many options, like this
    one, have long and short versions, but there are only 26 letters in the alphabet,
    so less popular options are often available only in the long version. The short
    options are easier to type but the long ones are more understandable. Compare


    ```

    ls -l --reverse --time

    ```


    ```

    ls -l -r -t

    ```


    ```

    ls -lrt

    ```


    Each gives a long listing in reverse time/date order. Notice how multiple short
    options can be combined with a single dash. While we''re talking about ls, this
    is a good time to mention so-called hidden files. In Linux, any files or directories
    beginning with a dot are considered hidden and do not show up in the output from
    ls or in most file managers by default. These are usually configuration files
    that would only clutter up your display – but if you want to see them, simply
    add the -A option to ls.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_112_0.png)


    By piping the output from du through sort, and adding extra options to both commands,
    we can see which directories use the most space.


    ```

    grep -r -I sometext somedir

    ```


    Be careful when you are searching large directory trees, because it can be slow
    and return strange results from any non-text files it searches. The -I option
    tells grep to skip such binary files.


    Text is also the preferred way of passing data between many programs, using the
    pipes we looked at previously. Sometimes you want to pass data straight from one
    program to the next, but other times you want to modify it first. You could send
    the text to a file, edit it and then send the new file to the next program, or
    you could pass it though a pipe and modify it on-the-fly. Nano edits files interactively,
    grep searches them automatically, so we just need a program to edit automatically;
    it''s called sed (Stream EDitor). Sed takes


    a stream of text, from a file or pipe, and makes the changes you tell it to. The
    most common uses are deletion and substitution. Normally, sed sends its output
    to stdout, but the -i option modifies files in place:


    ```

    sed -i ''s/oldtext/newtext/g'' somefile.txt

    ```


    ```

    sed -i ''/oldtext/d'' somefile.txt

    ```


    The second example deletes all lines containing oldtext. Another useful program
    is awk, which can be used to print specific items from a text file or stream.


    ```

    awk ''{print $1}'' somefile.txt

    ```


    ```

    cat *.txt | awk ''/^Hello/ {print $2}''

    ```


    The first example prints the first word from each line of the file. The second
    takes the contents of all files ending in .txt, filters the lines starting with
    Hello (the string between the slashes is a pattern to match) and then prints the
    second word from each matching line.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_112_1.png)


    KDE''s Filelight, shown here, and Gnome''s GDU provide a graphical alternative
    to du, representing disk usage visually.


    # Networking


    We normally think of big graphical programs like Chromium and Thunderbird when
    we think of networked software, but there are many command line programs for setting
    up, testing and using your network or internet connection.


    Ping Sends a small packet to a remote server and times the response, which is
    useful if you want to check whether a site is available, or if your network is
    working.


    ```

    ping -c 5 www.google.com

    ```


    wget Downloads files. The only argument it needs is a URL, although it has a huge
    range of options that you will not normally need.


    hostname Shows your computer''s host name, or its IP address with -i.


    lynx A text mode web browser. While not as intuitive as Chromium or Firefox, it
    is worth knowing about in case you ever suffer graphics problems.'
