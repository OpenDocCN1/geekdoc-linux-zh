    this indicates whether it is just a single file (1), or the number of additional
    hard-linked files. A hard-linked file is an exact copy of the file that might
    be located elsewhere on the system.


    Next up is the name of the owner (the user who created the file), and the group
    whose users can access the file. The next pieces of information indicate the size
    of the file in bits, and the date when it was last modified.


    Let’s get back to file permissions. As you can see in the listing, permissions
    are indicated by three characters: r for reading, w for writing and x for executing
    a file or reading a directory. The permissions are grouped for owner, group and
    others. The owner of somefile.txt, bodhi, can read and write (rw) the file, while
    other members of the group bodhi – as well as all other users – can only read
    the file (r--).


    Many users prefer to use numeric codes, based on octal (base 8) values, to represent
    permissions. Read permissions are assigned a value of 4, write gets 2, and execute
    gets 1. Applying this to the listing, the file has a permission of 644, because
    the user with read (4) and write (2) permissions gets a value of 6, while the
    group members and other users with read permissions get 4 each.


    You can alter the permission of a file, using either form of permission notation,
    with the chmod command. There are several options if you wish to use the mnemonic
    forms with chmod. The three permissions for the owner are controlled with u, while
    g controls the permissions for the group, and o controls them for others not in
    the group. The character a influences all permissions for all users, while the
    r, w, and x characters control the read, write and execute permissions. You can
    use any of these with either the plus sign to add a permission, or the minus sign
    to revoke permission for a file.


    ```

    chmod u+rw somefile.txt

    ```


    The command listed here, for example, will give read and write permissions to
    the owner of the file:


    However, you are advised to use the octal values to alter the permission, which
    is easier to comprehend. The above task can also be accomplished with this command:


    ```

    chmod 600 somefile.txt

    ```


    Here, we have given the owner permission to read and


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_120_0.png)


    Tools such as Déjà Dup help take the sting out of complex and involved tasks such
    as backups.


    write to the file while denying permissions from other users. Then there’s the
    chown command, with which you can transfer ownership of a file. The command chown
    chris somefile.txt hands the file to user chris. Similarly, you can also move
    a file from one group to another with the chgrp command. For example, this command
    will move the index.htm file to the Apache web server’s www-data group:


    ```

    chgrp www-data index.html///

    ```


    # Compile software


    Compiling software is another skill you need in your arsenal. Although most popular
    software is available as pre-compiled binaries via the distro’s package manager,
    sooner or later you’ll run into some that you’ll have to compile yourself. It
    could be a bleeding edge version that is critical to your workflow but hasn’t
    been packaged by your distro yet.


    Compiling software from source isn’t difficult and only slightly more involved
    than installing binary packages. But make sure you have all the tools required
    to compile packages. If you are using a Debian-based distro, such as Ubuntu, you
    can install the build-essential package with this:


    ```

    sudo apt-get install build-essential

    ```


    Users of RPM-based systems, such as Fedora, will need to grab the individual components
    with this command:


    # Quick tip


    If the compile happens to fail, check the error messages and then run the make
    clean command before you start again. Run make uninstall as the root user to remove
    any software that you have installed from source.


    # Restore the bootloader


    If you dual-boot Linux, there’s a risk that the other operating system may replace
    your distro’s bootloader with its own. The good news is that you can restore the
    Grub2 bootloader – the default for a majority of distributions – with little effort.


    The recommended way is to boot off your distro’s Live CD and open a terminal window
    from inside the Live session. Now figure out the device on which you have installed
    the distro. Use this command to figure out the device with the Linux installation:


    ```

    sudo fdisk -l command

    ```


    Once you have this info, issue the following command in the terminal:


    ```

    sudo grub-install /dev/sdX

    ```


    Make sure that you replace the X in the command with the letter that represents
    your disk, such as sda or sdb. This should reinstall the Grub2 bootloader in the
    master boot record of the disk. When it’s done, the normal Grub boot menu should
    appear when you restart the computer.


    Alternatively, you can use the graphical Boot-Repair tool by installing it inside
    the Live environment using the recommended method for that particular distro.
    Once the tool is installed, fire up the tool, which then scans your system before
    it launches. When it’s running, hit the big ‘Recommend Repair’ button, which should
    fix the boot loader.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_120_1.png)


    The Boot-Repair tool offers the easiest option to fix issues within the Grub bootloader.'
