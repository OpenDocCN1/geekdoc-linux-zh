- pgno: 24
  md: 'to the second Workspace, a third will automatically be added. At the top is
    a search box that will match any text to apps and documents on the local computer
    as well as online services. Gnome includes an Online Accounts app that enables
    you to sign into online services, such as Google Docs and Flickr. In fact, Fedora
    will ask you to sign into these online services when you boot into the distro
    for the first time.


    The Gnome desktop also has several custom apps of its own that can fetch information
    and data from the added online accounts. For example, the Gnome Contacts apps
    can pull in contacts from various online sources, such as Gmail. Similarly, Gnome
    Documents will help you find documents from online repositories such as Google
    Docs.


    New users should also keep an eye out for the desktop''s peculiarities. For one,
    you won''t find the Minimise buttons on any of the windows in Gnome. When you
    want to switch to another app, head to the Activities Overview and launch a new
    window or select an existing open one. Another esoteric aspect is the lack of
    any desktop icons as well as the ability to create any shortcuts or place any
    folders on the desktop.


    However, Gnome''s redeeming aspect is its tweakability: you can add new features
    literally with a single click. Gnome supports a plethora of extensions that you
    can enable without any installation. Just head to the Gnome Extensions website
    (http://extensions.gnome.org), find the plugin you wish to enable and toggle the
    button to activate it on your desktop. Some of the popular extensions are designed
    to help ease the transition for users moving to Gnome from proprietary operating
    systems, such as Windows.


    # Kick off with KDE


    Unlike the other two desktops, the layout and behaviour of the KDE desktop and
    the placement of its Kickoff app launcher will certainly feel familiar to users
    from non-Linux operating systems. But KDE is so malleable that many KDE distros
    look unlike each other. In many ways, KDE is the quintessential Linux desktop
    with its flexibility and myriad number of options. There''s literally no end to
    KDE''s customisation options.


    One of the most useful KDE features is Activities. Using this feature, you can
    create several context-aware activities, each with its own set of apps and desktop
    furniture. For example, you can create a Social activity that signs you into all
    your instant messaging accounts and displays updates and feeds from various social
    networks. Many KDE distros ship with just the default activity, called the Desktop
    Activity. However, you can fetch more activities from the internet and build on
    them to suit your workflow.


    Furthermore, KDE ships with multiple interfaces or Views designed to make the
    best of the available desktop real-estate. There are different Views for regular
    screens and netbook though you can use any View on any type of computer. To switch
    Views, right-click on the desktop and from the context-menu select the Default
    Desktop Settings option. In the window that opens up, select the View tab and
    checkout the different views from the Layout pull-down list.


    Many KDE distros place the Folder View widget on the desktop which displays the
    contents of a folder in a neat little box that you can place anywhere on your
    screen. Then there''s the Folder View which lets you place files and folders anywhere
    on the desktop. The Search and launch View is designed for devices with a small
    screen or a touchscreen. Each View has additional configurable elements.


    In addition to bundling the configuration options along with the individual elements,
    KDE also houses them all under the System Settings panel, alongside other system-wide
    configuration options to administer the underlying Linux distro. It might seem
    daunting, but you don''t need to set up or review each and every option before
    using the desktop. Customising KDE is an on-going process and not a one-time


    > > “Ubuntu, Fedora and Mageia are available in multiple editions with a different
    desktops.”


    affair. The desktop is designed to grow and mutate as per your usage requirements.


    # 31 flavours


    In addition to these three chief desktop environments, there are a lot more that
    you can put atop your distro. There are fully fledged environments, such as Cinnamon,
    as well as lightweight ones, such as Xfce, LXDE and Mate. In fact, most mainstream
    distros, including Ubuntu, Fedora and Mageia are available in multiple editions
    with a different desktops.


    For example, the Ubuntu distro has a number of officially supported spins. There''s
    Kubuntu which dresses Ubuntu with KDE as well as a Gnome spin, a Xfce spin and
    another that uses the Mate desktop. The Fedora distro, which was once known as
    the premier Gnome distro, now also has a wonderful KDE flavour as well. Similarly,
    you can also use Mageia with the Gnome desktop as well. In fact, Mageia and Fedora,
    also have install-only DVD images that give the user the option to install multiple
    desktops.


    # Switch desktop environments


    You can also install multiple desktops on top of your distribution, such as the
    popular Cinnamon desktop. It''s available in the official repositories of Fedora
    and Mageia and you can install it via their respective graphical package managers.


    On Ubuntu, it''s available via the ppa:gwendal-lebihan-dev/cinnamon-stable PPA.
    Add this PPA to your system [as explained in the main text] and then install the
    desktop environment from the Software Center.


    Once you''ve installed multiple desktop environments you can easily switch to
    another one. To do this you just log out of the current desktop environment, and
    use the login manager and enter your login credentials. Before logging into the
    desktop, explore the buttons on the login manager. One of the buttons will reveal
    a drop-down list of all the installed desktops. Select the desktop environment
    you want to use and the login manager will log you into that desktop. This way
    you can try them out and choose one you like the best. Choice!


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_24_0.png)


    There are several desktop environments that you can install using your distro''s
    package manager.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_24_1.png)'
