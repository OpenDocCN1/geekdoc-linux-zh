  md: 'so fit sticks in pairs and check the manual to see which slots go together.
    This is unnecessary if you are filling all four slots, but unless you are using
    the maximum size stick, it is better to use two larger sticks. If you want to
    fit 16GB of RAM, two 8GB sticks give you the option of adding more later, four
    4GB sticks does not.


    # Storage drives


    It used to be that the only question to ask about a hard drive was: How big? Now
    we have to add: How many? And what type? The choice of type is mainly between
    traditional hard drives with spinning platters and solid state drives (SSDs).
    (Although there are also hybrid drives that use a spinning disk with an SSD as
    a cache.) SSDs are much faster than hard drives but cost a lot more per gigabyte,
    a 256GB SSD costs about the same as a 3TB drive. So an SSD gives much faster booting
    and program loading but a hard drive holds much more. An SSD also uses less power
    and is more robust, making it the obvious choice for a laptop. With a desktop,
    you have the luxury of being able to use more than one


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_50_0.png)


    SSDs are the obvious choice for a laptop but are idea on a desktop system for
    installing an OS and the programs you use.


    drive, so the optimum is an SSD for the operating system and programs and a hard
    drive for your data. You could put the operating system on the SSD and /home on
    the HD, or you could leave /home on the SSD, which means you''ll get the benefit
    of the extra speed for things like your web browser and mail caches. Then you
    can mount the storage hogs, such as your media collections, on the hard drive.
    Either way, you will not need a particularly large SSD, 128GB should be more than
    enough, which should mean you can make sure you get a good one. There is quite
    a variance in the performance of SSDs, so make sure you get one with decent read
    and write speeds, in the region of 500Mb/s is good. Apart from that, setting up
    an SSD is pretty much the same as a hard disk.


    Another option to consider is using multiple drives in a RAID array. This gives
    you redundancy, if one drive in the array fails your data is still on the other.
    This isn''t a replacement for taking regular backups but it does protect you against
    a drive failure. With RAID 1, the simplest configuration, two drives are mirrored.
    All data is written to both drives but read from one (which can give improved
    read performance as the data comes from whichever drive seeks to it first). Most
    distro installers will handle installing to a RAID array, but with RAID 1 you
    can also install to a single drive and add the second to create the array. RAID
    is handled by the Linux kernel, do not enable any RAID settings on your motherboard.
    These are so-called fakeRAID and require Windows drivers to work. Just let the
    installer see that you have two drives and the kernel take care of them.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_50_1.png)


    Graphics cards are computers in their own right, but you may be able to use the
    onboard graphics for many systems.


    # Graphics card


    Most motherboards have reasonable onboard graphics these days, so you may not
    need a separate card. If you want one, the choice is between Nvidia and AMD, and
    this is another topic likely to provoke religious flamewars. Nvidia graphics cards
    will work as far as booting the computer into a graphical display, but the in-kernel
    nv drivers are limited. You have a couple of options. The newer open source nouveau
    drivers work well now – we use them ourselves – and give reasonable performance.
    If you want the best performance from your graphics card though you will need
    to install Nvidia''s own drivers. As these are closed source they are often not
    enabled by default so you need to enable the option for restricted or third-party
    drivers in your distro. You can also download and


    # Putting it all together


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_50_2.png)


    # 1 Motherboard layout


    Find the diagram of the motherboard''s layout and connectors in its manual and
    keep it open at the section. You should refer to it before making each connection
    to the board. Many of the connectors are simply header pins on the board, making
    it easy to put something in the wrong way. Murphy''s Law is definitely lurking
    here. RTFM aplies to hardware as much as software.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_50_3.png)


    # 2 Zero Insertion Force


    Lift the release lever on the CPU socket, insert the CPU aligning the corner dot
    on the chip with the mark on the socket. It should drop in with no pressure, then
    lock it with the lever. Remove the tape from the conductive pad on the heatsink
    and fit it over the CPU, following the instructions that came with the CPU and
    motherboard. Connect the fan cable to the motherboard.'
