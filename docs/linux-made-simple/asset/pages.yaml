- pgno: 113
  md: '# Terminal: Time-savers


    The terminal has a host of handy tricks that will save you time and make your
    life easier. Let’s introduce a few of the most useful techniques.


    Earlier, we mentioned that using the terminal can be faster and more productive
    than using a GUI, especially with repeated operations. To get the most out of
    this, it helps to know a few of the shell’s secrets.


    Do you often find yourself typing in the same command options over and over again?
    Do you sometimes have trouble remembering the correct options? Are you just plain
    lazy and want to avoid typing wherever possible? If you answered yes to any of
    these, aliases are for you. You already have some shell aliases set up. To list
    them, type:


    ```

    alias

    ```


    which will return entries like this (from Ubuntu):


    ```

    alias ll=''ls -alF''

    ```


    ```

    alias ls=''ls --color=auto''

    ```


    The first of these examples is simple – if you type in ll, it runs ls -A. The
    second is cleverer, because the alias is the same as the command name, so the
    old ls behaviour disappears and it’s always run with the --color=auto option.
    If you find yourself always using certain options with particular commands, aliases
    like this effectively make those options the defaults. The alias is expanded before
    the rest of the command line is interpreted, so:


    ```

    ll X Y Z

    ```


    becomes


    ```

    ls -aF X Y Z

    ```


    These aliases aren’t always easy to remember, but fear not – you can create your
    own aliases using exactly the same syntax as in the output from the alias command:


    ```

    alias myalias=''somecommand --option1 --option2''

    ```


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_113_0.png)


    Aliases save you typing and enable you to use more memorable command abbreviations.
    You choose these yourself, so you have no excuse for forgetting!


    Aliasing a command to its own name is a neat trick, but what if you then need
    to use the original command? Don’t worry – the developers have thought of that.
    Prefix the command with a backslash and your alias will be ignored:


    ```

    \ls Documents

    ```


    # Profiles


    You can customise your terminal experience with aliases and custom prompts, but
    to make them even more convenient, you need a way of applying these automatically
    when you open a terminal. That can be done through your profile, which is a file
    containing commands that are read and run whenever you open a shell session.


    There are several locations that are read, the first of which is /etc/profile,
    which contains global profile settings. This in turn runs any files in /etc/profile.d,
    which makes it easy to add global settings without touching the default profile.
    Then the user’s profile is read from one of ~/.bash_profile, ~/.bash_login and
    ~/.profile. Only the first of these files that exists is run, and any settings
    in here override those in the global profile if the same thing is set in both.


    The profile is simply a set of shell commands, one per line, that are run when
    the shell starts up. These can set up aliases or environment variables, or set
    the command prompt. A typical use of environment variables would be to change
    the default text editor to nano:


    ```

    EDITOR=/usr/bin/nano

    ```


    # Word completion


    If you aren’t a particularly confident touch typist, you’ll soon get fed up with
    typing out command and file names in full, then dealing with the error messages
    resulting from misspellings. Fortunately, the shell provides a way to both save
    typing and avoid mistakes, called tab completion. The name is fairly self-explanatory
    – it uses the [Tab] key to complete the word you are typing. If this is the first
    word on a line, it will be a command, so it looks in the command path for matches
    – for example, typing chm and hitting [Tab] will complete to chmod. Used after
    the command, hitting [Tab] completes file names, so instead of typing:


    ```

    cat /pathto/somelongdirectory/someevenlongerfilename.txt

    ```


    you can use:


    ```

    cat /pa[Tab]som[Tab]som[Tab]

    ```


    Isn’t that easier? When more than one file matches, the [Tab] key will complete
    up to the point where it becomes ambiguous; pressing [Tab] again at this point
    shows a list of options, which you can cycle through with [Tab], or add'
  merge: -1
