  md: '![](img/57f4a2d286909b0a84c8ecfefbbe15f2_82_0.png)


    Puppy Linux has become a handy distro for recovering data from PCs and removing
    malware from Windows.


    older hardware that had been rendered useless due to lack of support in other
    distros.


    The real power of the distro lies in its plethora of custom apps. There are custom
    apps to block website ads and add internet telephony, a podcast grabber, a secure
    downloader, an audio player, a DVD burning app and more. First-time users might
    be intimidated by Puppy’s installer as it has no automatic partitioner, and fires
    up Gparted for you to format the disk. But each step in the installer is well-documented
    within the installer itself.


    Packages for Puppy Linux are called pets, and have a .pet extension. You can install
    packages using its custom Puppy Package Manager tool, and you can configure it
    to download packages from other Puppy repos. The distro includes tools which can
    be used to easily churn out variants. Puppy Linux variants are called puplets.
    Popular puplets are WaryPuppy for supporting older hardware, RacyPuppy for newer
    hardware, the Slackware-based SlackoPuppy, and PrecisePuppy which is based on
    the Ubuntu LTS release.


    # SliTaz GNU/Linux


    SliTaz stands for Simple Light Incredible Temporary Autonomous Zone and had its
    first stable release in 2008. The distro is built with home-brewed tools known
    as cookutils and uses BusyBox for many of its core functions. The distro includes
    a mixture of the LXDE and OpenBox window manager and is designed to perform on
    hardware with only 192MB of RAM. The distro weighs under 30MB and uses a mere
    80MB of hard disk space.


    The distro also has a bunch of custom tools such as the Tazpkg package manager
    and SliTazPanel for administering all aspects of the distro. SliTaz repos include
    over 3,000 packages for every popular open source app and it’s a common option
    for powering low-powered machines.


    # PCLinuxOS


    PCLinuxOS began life as a repository of RPM packages for the Mandrake distro in
    2000 and became a distro in late 2003 as a branch of Mandrake Linux 9.2.


    Although it retains a similar look and feel to Mandriva Linux, and its configuration
    tool and installer give away its Mandriva lineage, PCLinuxOS has diverged significantly.


    The distro has replaced Mandrake’s URPMI package management system, opting instead
    for APT-RPM. This is based on Debian’s APT but uses RPM packages, together with
    the Synaptic package manager. PCLinuxOS is a KDE distro, but also has community
    spins around the LXDE and Mate desktops.


    We’re going to tread on that hallowed patch of earth where angels fear to tread
    (and not because a bushy-bearded Russell Crowe is eyeballing them) and attempt
    to pick an overall distro winner. This means we had to pick a criteria that allowed
    for ease of use alongside the ability to build in complexity for specific use
    cases and, we admit, the result is purely subjective. Don’t agree with us? Why
    not email your top picks for each genus to Linux Format magazine at lxf.letters@futurenet.com.


    # Mageia


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_82_1.png)


    The community supported distro has everything you want from a modern Linux distribution
    – an active and vibrant user and developer community, a well-defined support structure,
    support for multiple desktops and install mechanisms.


    # OpenSUSE


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_82_2.png)


    Coming in at second place, the OpenSUSE distribution loses out because of recent
    activities of its corporate parent. Also, the distro still focuses on introducing
    changes that make it fit more snugly on the corporate desktop, rather than home
    user.


    # Korora


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_82_3.png)


    This is your best bet if you want a RPM-based distribution that works out of the
    box. However, Korora is still essentially a one-man show and inherits some of
    the less flattering features of its parent distro, Fedora.'
