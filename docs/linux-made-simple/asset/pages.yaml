    # High-performance gaming


    Gaming, and we mean the graphically intense kind and not gambling, places specific
    requirements on a computer. Performance is the obvious factor, but not just the


    performance of the CPU. The GPU on the graphics card plays a more important role
    than the CPU with some games. Clearly you want a fast CPU and graphics card. Many
    of the higher performance graphics cards take up the space of two PCI-e slots
    so you need to make sure both your computer’s case and motherboard have room for
    it and that your PSU is capable of


    If you are building a media server, like this media server, your needs are different.
    You need plenty of disk space and a fast network connection (or two). You may
