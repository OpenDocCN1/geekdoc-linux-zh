  md: '# LINUX

    MADE SIMPLE


    # Welcome!


    Linux might seem intimidating, but you’ve come to the right place if you want
    to get started.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_4_0.png)


    Every time I come to write an introduction to one of these guides, I seem to relate
    a story of how I’ve ruined something by being unprepared. This guide is no different.
    My first experience with Linux was one of desperation: I really had to try it,
    being an unabashed computer nerd, and when I finally got my hands on an early
    copy of Mandrake Linux – in a box, on a real CD-ROM! – I set to installing it
    without thinking. I didn’t need that software or those documents, it seems. I
    also didn’t need a working computer, clearly, as Linux wasn’t particularly friendly
    when it came to compatibility at the time. Things have changed. Modern Linux distributions
    tend to work first time with


    whatever hardware you have. Every recent distro I’ve tried installs nicely alongside
    other operating systems like Windows and other flavours of Linux. You can also
    get by – just – without ever touching the command line, as long as you’re not
    looking to push your OS too far. However you want to use Linux, from GUI to command
    line and beyond to more practical purposes, Linux Made Simple has you covered.
    I’ve collected together a host of guides and tutorials from my expert colleagues
    at Linux Format magazine, which will get you up and running and take you further,
    too. And if you get hooked, I’d highly recommend subscribing to LXF (see page
    144). You won’t find a better Linux magazine.


    Alex Cox, Editor


    # The MADE SIMPLE Manifesto


    Made Simple books are designed to get you up and running quickly with a new piece
    of hardware or software. We won’t bombard you with jargon or gloss over basic
    principles, but we will…


    +   - ✓ Explain everything in plain-English so you can tackle your new device
    or software with confidence and really get to know how to use it

    - ✓ Break instructions down into easy-to-follow steps so you won’t be left scratching
    your head over what to do next

    - ✓ Teach you new skills you can take with you through your life and apply at
    home or even in the workplace

    - ✓ Help you discover exciting new things to do and try – exploring new technology
    should be fun and our guides are designed to make the learning journey as enjoyable
    as possible for you

    - ✓ Make it easy for you to take our advice everywhere with you by giving you
    a free digital edition of this book you can download and take with you on your
    tablet, smartphone or laptop – see page 146 for more details on this offer


    How are we doing? Email techbookseditor@futurenet.com and let us know if we’ve
    lived up to our promises!'
