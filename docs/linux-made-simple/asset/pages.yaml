    # Email clients


    Mutt is a terminal-based email client that''s been around since the mid-90s. It
    supports IMAP, SMTP, SSL, GPG and third-party plug-ins. Of course, there are some
    keyboard shortcuts to learn, and if you want to look at your mail offline you''ll
    need to set up offlineimap (IMAP) or getmail (POP). Mutt uses the external text
    editor of your choosing, and you can make a sort of address book using aliases,
    or use the purpose-built Abook application. Back in 1991, the Pine email client
    was released, but source code was only available for UNIX. Pine was pretty easy
    to learn, and came bundled with a simple-but-powerful text editor called Pico.
    The GNU Nano editor we all know and love is a clone of this. The Apache-licensed
    Alpine (Alternatively Licensed Pine) was released in 2007 and although it is no
    longer under active development, a project


    called Re-alpine sought to continue it. The latest release of Re-alpine was in
    mid-2013.


    On the graphical front we have Sylpheed and its slightly more featureful fork
    Claws Mail, both of which use GTK+2 and support various plug-ins. Sylpheed does
    almost everything you need and absolutely nothing more. Claws Mail, meanwhile,
    offers support for spam filtering, GPG and can render HTML mail through Webkit.
    If you like Qt and IMAP, then you should have a look at Troidy* which supports
    HTML mail (through Webkit) and has been designed to be as gentle as possible with
    respect to resource usage.


