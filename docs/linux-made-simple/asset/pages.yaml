- pgno: 85
  md: '# User interface


    Is it customisable, attractive, but not too resource-hungry?


    The interface of any computing device, from smartphone to traditional desktop,
    is a balance of conflicting requirements: minimal consumption of RAM and CPU cycles,
    which in our case is a must, usability by non-experts, room for customisation,
    and finally good looks (whatever ''good'' might mean for each user). After testing,
    we were pretty happy with our choice of distros. The reason is that each of them
    gives a different but equally valid answer to the requirements above. Some people
    will prefer the easy but infinite visual configuration possibilities of Elive,
    others the rich but relatively rigid structure of Absolute or Slacko. Others still
    will love the no-frills approach of Manjaro and Crunchbang. But there should be
    something for everybody.


    # Absolute ★★★☆☆


    Absolute uses the IceWm window manager to give you a fast and discreet desktop.
    A right-click on the root window, which by default would launch the tool to change
    wallpaper and screen resolution, can be set to open the system menu.


    The file manager is SpaceFM; not state of the art by any means, but adequate for
    all basic tasks. Of all the distros in this roundup, Absolute is perhaps the one
    that looks more like a basic Linux of 15 years ago. Just for this reason, however,
    it may be perfect for many users, especially when you consider that it''s just
    a first sight impression – you do get a modern browser (Chrome) and office suite
    (Libre Office), and often that''s all that counts, isn''t it?


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_85_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_85_1.png)


    # Crunchbang ★★★☆☆


    The first time you start it, Crunchbang is all business and no frills. All you
    see is a visually dull but well configured OpenBox window manager with two workspaces,
    a system monitor and the list of shortcut keys. However, changing the wallpaper
    – if a solid grey screen really bothers you – is a quick and easy job.


    One right-click on the root window opens a menu with apps for all desktop tasks.
    That menu, plus the Terminator terminal emulator and the Thunar file manager,
    let you work with the mouse or keyboard very efficiently. Crunchbang is also the
    distro most interested, so to speak, in working in the cloud with common tools;
    the system menu includes entries to start Google Docs and install the Dropbox
    client.


    # Documentation


    Is it easy to learn how these distros work?


    If you need Linux just to run a few apps on an older computer, the mere number
    of available pages of documentation may matter much less than two other things.
    First, check if those apps, rather than the distro, have good documentation. Second,
    look for distros that hold your hand well in the first two to three hours of usage,
    when you really need to get familiar with them and their community. Crunchbang''s
    default wallpaper is what all distros for newcomers should have: a cheatsheet
    with all the main keyboard bindings. Most Debian material will apply to Elive,
    too, so if anything, there may actually be too much documentation. Manjaro and
    Absolute are the best here. At first login, Manjaro welcomes you with a window
    full of links to documentation, online support and descriptions of the available
    desktops. The ''Getting Started'' icon in the Absolute desktop loads a 14-point,
    task-oriented guide, with sections such as ''Multimedia files,'' ''Wireless setup,''
    adding software and Nvidia drivers. The Documentation menu links to the manuals
    of the distro and its main packages. The same happens in Puppy. Speaking of Puppy,
    note that many of its online guides and tutorials may only be valid for a specific
    version (read ''Choices'' opposite to understand why). Therefore, before trying
    any Puppy, ask at www.murga-linux.com/puppy what are the best and most up-to-date
    resources for that version.


    Verdict

    Absolute ★★★★☆

    Crunchbang ★★★☆☆

    Elive ★★★★☆

    Manjaro ★★★★☆

    Puppy ★★☆☆☆

    All have OK documentation. In Manjaro and Absolute it''s easier to reach.'
