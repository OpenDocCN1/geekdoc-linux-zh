  md: 'a new browser – though that might not be such a bad thing. You can make life
    easier by exporting your bookmarks from *Internet Explorer* and importing them
    into *Firefox* in Linux. To do this, open up *Internet Explorer* in Windows and
    click on the star icon. Click the down arrow to open up the drop-down list, and
    select ''Import and export'', then ''Export to a file''. Select what you want
    to export and click ''Next'' until you get to ''Export'' to create the bookmark.htm
    file.


    In Linux, open the *Firefox* browser and click ''Bookmarks'' then ''Show all Bookmarks''.
    A window will open, and you need to click ''Import and Backup'' then ''Import
    Bookmarks from HTML'' and select ''bookmark.htm''.


    If you were already using *Thunderbird* to get your emails in Windows XP, then
    getting *Thunderbird* set up in Linux won''t be difficult at all. In Windows XP,
    navigate to the **\Documents and Settings\%username%\Application**


    **Data\Thunderbird\Profiles\** folder. In this folder there will be another folder
    that has a string of random letters and numbers, followed by **.default** as the
    name. Copy this folder to a USB stick or another hard drive, then load up Linux.
    Open up the file manager and go to your Home folder (this is sometimes shown as
    the default view). Press [Ctrl]+[H] on your keyboard to display hidden files and
    folders, then find the **.thunderbird**. Open it, and paste the **.default** folder
    you saved earlier there. Then, open up the **profiles.ini** file in the **.thunderbird**
    folder, and where it says Path= type in the name of the newly-pasted **.default**
    folder. When you next load *Thunderbird*, your emails and folders and so on should
    be waiting for you. If you''re using *Outlook* in XP, the easiest way is to install
    *Thunderbird* on XP, open it up and then go to ''Tools'' then ''Import'' to import
    your *Outlook* files. Then, copy the **.default** folder as we described earlier.


    # Top Linux alternatives


    | Windows app | Linux replacement |

    |---|---|

    | Microsoft Office | *LibreOffice* (www.libreoffice.org). It''s incredibly easy
    to replace Microsoft Office in Linux, with *LibreOffice* being arguably the best
    choice. It has plenty of tools for word processing, spreadsheets, presentations
    and more. It''s what we use! |

    | MS Paint | *Gimp* (www.gimp.org). *Gimp* is actually much more advanced than
    *MS Paint*''s simple image editor, and can even give *Photoshop* a run for its
    money. It comes pre-installed on many distros. |

    | Windows Photo Gallery | *Shotwell* (www.yorba.org/projects/shotwell). *Shotwell*
    is a great replacement for Windows'' photo organiser. You can import photos from
    digital cameras and smartphones, add tags and ratings, and do some light editing
    to tidy up the shots. |

    | Windows Movie Maker | *Open Movie Editor* (www.openmovieeditor.org). For quickly
    importing and editing home movies, *Open Movie Editor* is a great alternative
    to *Windows Movie Maker*. It''s easy to use, but has enough power to make some
    great-looking clips. |

    | Windows Media Player | *VLC* (www.videolan.org). *VLC* is a very popular alternative
    to *Windows Media Player*, and supports lots of different media formats, and can
    even play Blu-ray discs with a few tweaks. |

    | iTunes | *Amarok* (http://amarok.kde.org). If you have an iPad, iPhone or iPod,
    you might have thought you''d be stuck with *iTunes*. Thankfully, *Amarok* does
    an excellent job of replacing it, has loads of features, and lets you manage songs
    and files from your iDevice. |

    | Nero Burning ROM | *Brasero* (https://wiki.gnome.org/Apps/Brasero#download).
    Burning files to a rewritable DVD or CD is made incredibly easy with this user-friendly
    disc burning software. |

    | WinZip | *File Roller* (http://fileroller.sourceforge.net). It''s likely you
    already have *File Roller* installed. It can open or create a wide range of compressed
    files that are ideal for sending across the internet. |

    | Norton Anti Virus | *Avast! Linux Home Edition* (www.avast.com). Linux is far
    less prone to viruses and malware than Windows, but that''s not to say there aren''t
    any or will be in the future, so get some protection. |

    | Adobe Acrobat Reader | *Foxit Reader* (www.foxitsoftware.com). The Linux distro
    you''ve installed will probably be able to view PDF documents; *Foxit Reader*
    is an excellent alternative that''s fast, light and full of features. |'
