- pgno: 114
  md: 'another letter or two and press [Tab] again. It is actually a lot easier to
    use than to describe – just try it.


    # Wild, wild cards


    There are times you want to include more than one file in a command, but don’t
    want to type them all out. The Linux shell has a couple of wildcard operators
    to help you out with this. The most frequently used one is the star, which is
    used as a replacement for any string of characters. So * on its own will match
    every file in the current directory (note that this is different from MS-DOS shells,
    where * does not match . and you need to use *.* to match any file with an extension).
    You can also use * to match one part of a file name – *.txt matches all files
    that end with .txt, and a*.txt only matches those that also start with a. This
    matching is performed by the shell. It expands the matches to a list of files
    before passing them to the command, which never sees the wildcard or even knows
    that you’ve used one. This can be an important distinction, especially if you
    want to pass a * to the program you’re running. For example, if you’re using scp
    to copy files from a remote computer and run:


    ```

    scp user@othercomputer:Documents/*.txt Documents/

    ```


    you may expect it to copy all .txt files from the other computer’s Documents directory
    to the same one here, but it won’t. The shell expands the *.txt to match all .txt
    files on the local system, so you only copy the files you already have. In such
    an instance, you need to tell the shell not to expand the * by preceding it by
    a backslash, known as escaping it:


    ```

    scp user@othercomputer:Documents/\*.txt Documents/

    ```


    Now it passes Documents/*.txt unchanged to the remote computer and lets its shell
    handle the expansion.


    There’s a second wildcard character. While * matches any number of characters,
    including none, ? matches exactly one. So ab?.txt matches abc.txt and ab1.txt
    but not ab.txt or abcd.txt, whereas ab*.txt would match all of them.


    # Bring on the substitute


    There is a powerful feature in shells called command substitution. This allows
    you to embed the output from one command in another. As a simple example, there
    is a command called foo on your system, and let’s say you want to know what type
    of program it is: compiled, Python or even a shell script. The which command gives
    you the path to a program, and file reports the type of a file. You could use:


    ```

    which foo

    ```


    to get /usr/local/bin/foo and then


    ```

    file /usr/local/bin/foo

    ```


    to get the file type, but even with copy and paste, this is a lot of work and
    easy to mistype. Alternatively, you could do:


    ```

    file $(which foo)

    ```


    ```

    /usr/local/bin/foo: a /usr/bin/perl script, ASCII text executable

    ```


    What happens is that the shell runs whatever is inside $(...) and substitutes
    the output from that into the command line before running it. You can also use
    backticks for this:


    ```

    file `which foo`

    ```


    This is quicker to type but less readable, especially when posted to a forum where
    the reader’s font can make ` and ’ look similar. With the first format there is
    no such confusion.


    One of the great advantages of the shell is that it’s simple to repeat commands,
    no matter how complex, with a couple of keypresses. At its simplest, you can press
    the [Up] key to show previous commands, then press [Enter] to run your chosen
    one again. You can also edit the command before running it, if you like. That’s
    fine if you want to use one of the


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_114_0.png)


    As the name suggests, tab completion lets you use the [Tab] key to complete the
    word you’re typing, helping save time and avoid mistakes.


    last few commands you ran, but most shells keep a history of the last 500 or so
    commands that you an access again.


    # Please repeat that


    To avoid wearing out your keyboard’s [Up] arrow key (and your eyes), press [Ctrl]+[R]
    and then type in part of the command. The terminal will now show you the most
    recent command that matches what you are typing, updating with each keypress you
    make. If you have run several very similar commands, you


    don’t need to keep typing – just type a few characters and press [Ctrl]+[R] again
    to see the previous match.


    > The Linux shell has a couple of wildcard operators to help you


    Keep going until you find the one you want. (Don’t be alarmed – this is one of
    those things that takes far longer to describe than to actually do.) You can edit
    the command before running it. The search term that you type in doesn’t have to
    be the command itself – any part of the command line will match, so you could
    start with the file name.


    You can also access commands within the history directly. The ! character tells
    the shell that you are referring to its history. !! is a shortcut for the previous
    command, while !n means ‘execute the command run n commands ago’ (so !! is the
    same as !-1). !xyz runs the last command starting with xyz, and !?xyz does the
    same for the last command containing xyz (much the same as [Ctrl]+[R]).


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_114_1.png)


    The history command shows recently executed commands – use ! and [Ctrl]+[R] to
    find and run again the commands you used before.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Terminal:

    User accounts


    Whether you want to have one user or a hundred on your computer, it’s time to
    explain the basics of user accounts on Linux.


    Linux is a multi-user operating system, even if you are the only person using
    your computer. The most basic of systems has two users: you and the superuser,
    also called root. Every file or directory is owned by a user and has settings,
    called permissions, that specify who can read or write to it. This safeguards
    your files from being overwritten by another user, or possibly even read by them
    if so set. It also safeguards system files because they are owned by root and
    can only be changed by root. This includes writing to system directories, so only
    the root user can install new software there. So how do you install software?
    See the ‘Becoming root’ box opposite for the answer.


    One word of caution when using data on multiple computers, such as with an external
    hard disk. While you may see your username as a name, say johnny99, the computer
    sees and stores it as a number, a UID or user ID. During installation, your distro
    will have created a root user, who always has a UID of 0, and a normal user. Most
    distros start at 1000 for the first general user, but some start at 500. The point
    is, it’s that number stored on the disk as the owner of a file, so the same username
    may not own the file when you move the disk to another computer.


    # Create a user


    Every user has a home directory. This is usually /home/username but it can actually
    be anywhere – the user created


    to run a web server will have a home directory somewhere like /var/www. In addition
    to users, Linux also has groups. A group is basically a collection of users. For
    example if you have a USB scanner on your computer, you often need to be a member
    of the scanner group to be able to use it. Now that we understand usernames, groups,
    UIDs and home directories, we can create a user:


    ```

    sudo useradd -m -c "John Smith" -g users -G scanner,audio john

    ```


    We use sudo here because only the root user can create users. The -m option creates
    a home directory at /home/john. -c specifies a comment to store for the user,
    which is usually the user’s full name. -g sets the primary group of the user,
    while -G adds secondary groups. Finally, we give the username. Not all of these
    options are necessary – if you omit -g, a default group will be used. Some distros
    use a single group called users for all non-system users, while others create
    a separate group for each user. The groupadd command works in a similar way, as
    do both of their counterparts – userdel and groupdel.


    # Add a password


    We have created a user but he cannot log in yet because we haven’t given him a
    password.


    ```

    sudo passwd john

    ```


    will ask you for the password twice. The passwd command


    # Different filesystems


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_115_0.png)


    Running the mount command on its own shows the options a filesystem was mounted
    with. Here you see the mask setting for a FAT formatted USB stick (fmask and dmask
    do the same as umask, but only for files and directories respectively).


    One area that causes confusion is that of permissions of mount points. It makes
    no difference what permissions and ownership are set on a mount point before a
    filesystem is mounted there; it acquires the permissions of the root directory
    of the filesystem you mount there. How you change things for the top-level directory
    of a filesystem depends on its type. In the case of Linux filesystems, this is
    simple: mount it and then use chmod or chown to set it up as you want. These settings
    will then apply whenever, and wherever, you subsequently mount that filesystem.


    Windows filesystems, such as FAT on USB sticks, are treated differently. FAT has
    no concept of file ownership and NTFS has a system which is incompatible with
    Linux permissions, so the filesystem driver imposes default permissions. These
    generally set all files and directories to be owned by the user who mounted the
    device, otherwise you couldn’t write to it. File permissions usually default to
    rwxr-xr-x (or 755 if you prefer) by the automounter.


    If you are mounting a filesystem manually, use the uid option to set ownership
    and umask for default permissions, like this:


    ```

    sudo mount /dev/sdb1 /mnt/removable -o uid=john,umask=022

    ```


    The umask is subtracted from 777 to give the permissions – 755 in this case. A
    umask of 0 enables all permissions.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Becoming root


    Almost all of the user management commands require root access. The superuser,
    often referred to as root, can do anything anywhere, regardless of any permissions.
    So how does a humble user do anything that requires root privileges? There are
    two ways of doing this.


    The traditional way is to use the su (for switch user) command, which allows you
    to become another user, provided you know their password. Run su in a terminal
    (it switches to root if you don''t specify a user), and it will ask for the root
    password. Once you have entered this, you are root in that terminal session, and
    can do anything you like – muhaha!


    Of course, this is a bit risky, especially if you don''t log straight out after
    doing what you need. It also means that you have to give the root password, and
    therefore full access, to any user who needs to run a root command – so sudo was
    invented. Sudo is used to run individual


    commands as root (or another user) but does not require you to know the root password.
    Instead, the root user must have set things up to allow you to run some or all
    commands as root, so it asks for your password. The normal installation of most
    distros allows the first user created to have sudo rights to everything, so you
    can install software, or do anything else, without ever having to log in as root,
    or spread the root password. In fact, some distros have no root password by default,
    and sudo is the only way to run administrative commands.


    Sudo can be used to give individual users the right to execute only specific commands,
    plus it records every command it runs in the system log, along with who ran it,
    giving a far more secure and accountable system.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_116_0.png)


    With sudo, each user can have all, some or no administrative rights. This is a
    typical definition that allows members of the admin group to do anything.


    can also be used to change the password of an existing account. If you run it
    without sudo or a username, however, it will change your own user''s password,
    because only root can set passwords for anyone else. It is considered good practice
    to change passwords regularly, and you can enforce this by using passwd:


    ```

    sudo passwd --maxdays 60 -warndays 7 john

    ```


    This password will become invalid after 60 days and john will be warned about
    the expiry a week before. The usual rules about passwords – make them long and
    mixed case, preferably with numbers – apply here, and doubly so to the root password,
    the key to the kingdom.


    User details are stored in /etc/passwd, which may be edited should you wish to
    change them. However, making a mistake could prevent you from logging in, so use


    ```

    vipw

    ```


    to edit it. This loads a copy of /etc/passwd into your preferred editor (as defined
    in $EDITOR) and checks its


    validity when you save it, before replacing the existing file. The format of /etc/passwd
    is explained fully with:


    ```

    man 5 passwd

    ```


    # Transfer ownership


    If you want to change the owner of a file, you need chown:


    ```

    chown john somefile

    ```


    ```

    chown john:users someotherfile

    ```


    ```

    chown john: someotherfile

    ```


    ```

    chown -R john: somedir

    ```


    The first makes john the owner of a single file. The second command also changes
    the group. If you do not give a group after the colon, as in the third example,
    the group is changed to the user''s default group. When applied to a directory,
    the -R option also changes all files and sub-directories in that directory. You
    can change just the group with chgrp. These commands must be run as root. Changing
    file permissions is done with chmod.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_116_1.png)


    Most desktops provide graphical alternatives for user management – this is KDE''s
    Kuser – but they still need root privileges.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Man pages:

    Accessing help


    Need more advice? Then you need to browse the ultimate collection of useful self-help
    books that resides inside the Linux operating system.


    RTFM has long been considered the battle cry of the supposed Linux experts, and
    is claimed to scare new users away. If you haven''t come across it before, it
    stands for something like ''Read the fine manual.'' It is perhaps easy to appreciate
    the frustration some individuals feel when asked a question for the umpteenth
    time when the information is clearly covered in the manual. However, it''s only
    possible for a user to read a program''s documentation if they know where to find
    it. Happily, there are some sources of help within Linux, so let''s look at each
    of them.


    Before you even look for the manual, remember that many programs have built-in
    help. Run the command from a


    terminal with the --help option to see a synopsis of its options. This applies
    to GUI programs, as well as shell commands. For example:


    ```

    firefox --help

    ```


    If you need more detail, then it may be time to RTFM, which on Linux systems usually
    means the man page. Man pages document just about everything on your system and
    are viewed by keying in the man command. If you want to know how man itself works,
    the classic recursive example is to open a terminal and run:


    ```

    man man

    ```


    A man page is a single page containing the reference documentation for its topic.
    The man command renders this document as readable text and displays it in your
    default pager, usually less. This means you use the same keyboard controls as
    less for navigating the page: cursor keys to scroll up and down, [Spacebar] to
    page down, and so on. Some man pages can be very long, so try man bash to enable
    you to search. In less, press [/] to start searching (or [?] if you want to search
    backwards), followed by your search term. Then use [n] to jump to the next match
    or [N] for the previous one. The man pages are divided into sections:


    +   1. User commands

    2. System calls

    3. C library functions

    4. Devices and special files

    5. File formats and conventions

    6. Games et al

    7. Miscellany

    8. System administration tools and daemons


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_117_0.png)


    This is the man page for ls, and it helpfully lists the various options that you
    can use in alphabetical order.


    # Desktop viewing


    Man and info are intended to be readable in a terminal, because you may need to
    use them on a system without a desktop. There are GUI viewers for them, though,
    the most convenient being in KDE, where you can press [Alt]+[F2] and type man:/command
    or info:/command and get an HTML formatted version of the document displayed in
    Konqueror. There are also the tkInfo and tkMan programs to display the respective
    formats in a GUI window.


    There are several websites containing comprehensive man page collections: such
    as http://linux.die.net, www.linuxmanpages.com and http://manpages.ubuntu.com.
    These are particularly useful if you want to read about something that you do
    not have installed locally.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_117_1.png)


    KDE users can read info and man pages in a browser, with clickable links, thanks
    to KDE''s KIO slaves.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'As a normal user, you would normally only use sections 1, 5 and 8 (and possibly
    6). If you use the section number with the man command, it will only look in that
    section, otherwise it will show the first match it finds. This is necessary because
    you can have more than one page with the same name. The passwd command is used
    to set user passwords, which are stored in the file /etc/passwd. Try:


    ```

    man passwd

    ```


    ```

    man 1 passwd

    ```


    ```

    man 5 passwd

    ```


    The first two document the passwd command from section 1, while the third shows
    the man page for the passwd file. This is one of the strengths of the man page
    system – it documents everything: commands, configuration files, library functions
    and more. It''s not limited to specific commands or files, and section 7 contains
    man pages for all sorts of things. Ever wondered how symbolic links work, or what
    happens when you turn on your computer? Try:


    ```

    man 7 symlink

    ```


    ```

    man 7 boot

    ```


    # Quick help


    There is more to man than a bunch of formatted text pages and a program to display
    them in a pager. Man maintains a searchable database of pages, which is automatically
    updated by Cron, and has some other programs for working with it. Each man page
    has a NAME section, which includes a short description of the page''s topic. The
    whatis command gives the description – it tells you what the program (or file)
    is, without going into details of options. Here is the classic geeky, recursive
    example:


    ```

    whatis whatis

    ```


    ```

    whatis (1) - search the whatis database for complete words

    ```


    This is a faster way to see what commands do, especially if you want to check
    more than one:


    ```

    whatis grep sed symlink

    ```


    The whatis command searches only the name, and only matches on whole words, so
    it assumes you know the name of the command and just want to know what it does.
    For a more wide-ranging search, use apropos, which does a similar job but searches
    the descriptions as well and returns all matches – compare these two commands:


    ```

    whatis png

    ```


    ```

    apropos png

    ```


    There is another form of documentation that''s favoured by the GNU project: info
    pages. While a man page is basically one very long text file with a bit of formatting
    markup, an info document contains a tree of linked pages in a single file. It''s
    more like HTML than plain text, but is designed for reading in a text console
    and all the ''pages'' are contained in a single file.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_118_0.png)


    Unsurprisingly, the command used to read info pages is this:


    ```

    info info

    ```


    This time, the self-referencing is not gratuitous. Man pages are usually quite
    intuitive to navigate – it''s just like reading any other text in a page. Info
    uses a different set of key commands, so reading its own info page is a good place
    to start. You move around individual pages as you would normally, but if you press
    [Enter] when the cursor is on a link (noted by an asterisk), you descend into
    that node, getting further information on the topic at hand. To go back up to
    the parent node, press [u]. You can also navigate within a level of the documentation
    tree with [n] and [p], which take you to the next and previous nodes. If you have
    ever looked at any GNU documentation online (http://bit.ly/grubmanual) you will
    recognise this layout. It''s simpler than HTML, with the navigation commands generally
    moving around the same level of the tree or up and down one level.


    You may be asking yourself what the point of this structure is. Well, if you''ve
    ever tried to find information in a long man page, such as man bash or man mplayer,
    you''ll know how frustrating and time-consuming the ''everything on one page''
    approach can be. Info documents are divided into sections and chapters, enabling
    clearer and more succinct presentation. The majority of GNU programs have fairly
    brief man pages, but have more detail in their info pages. Splitting the document
    up into pages alters the way that searching is carried out. Press [s] followed
    by a search string and then [Enter]. Info will jump to the next occurrence of
    the string, even if it''s in a different node. Continue to press [s] then [Enter],
    with no search string, to jump to subsequent occurrences of the same string. Those
    keys, plus [q] to quit, should enable you to navigate info pages with ease. You
    might be wondering why we''re not using HTML. The main reasons are that info pre-dates
    HTML, and that info documents are contained within a single file. Conceptually,
    they are similar – so much so that info2html (http://info2html.sourceforge.net)
    can be used to convert an info document to a series of HTML pages.


    > The ls info page goes into more detail and groups options according to their
    function. Info pages generally provide more detail than man pages.


    # Printing manuals


    There may be times you want a hard copy. As man pages are stored in a markup format
    and converted for display by the man program, you can use -t to convert them to
    a printable format, Postscript by default, like this:


    ```

    man -t somecommand | lpr

    ```


    The Postscript is output to stdout; piping it to lpr like this sends it straight
    to the printer. You could also convert the Postscript to PDF, and therefore create
    versions of your man pages suitable for carrying around on a tablet or e-reader:


    ```

    man -t somecommand | ps2pdf - somecommand.pdf

    ```


    Print info documents by passing them through the col command:


    ```

    info somecommand | col -b | lpr

    ```'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Sysadmin:

    Back to basics


    You need some basic admin skills under your belt if you want to be able to use
    Linux effectively. Read on and refresh your memory...


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_119_0.png)


    Managing users is one of the most basic Linux admin skills you should possess,
    even if you are the only person using the computer. That''s because knowledge
    about users and groups is imperative in order to secure and control access to
    data. Although you can manage users from the command line, almost all modern Linux
    distros include a graphical tool to help you add, control and remove user accounts.
    However, there are a few things you should keep in mind when managing users and
    groups.


    It may sound obvious, but a user is anyone who uses a computer. Some system services
    also run using restricted or privileged accounts. The superuser, root, has complete
    access to the operating system and its configuration. Unprivileged users can use
    the su and sudo commands for controlled privilege escalation.


    Behind the scenes, a username has a unique string of numbers known as a user ID
    (UID). Similarly, groups have group IDs (GID). The root user is UID 0. Numbers
    from 1 through 499 – and number 65,534 – are the system users, sometimes called
    logical or pseudo-users. Regular users have UIDs beginning with 1,000. When creating
    a user, the system admin can add other users to an existing group, in which case
    they''ll all bear the same GID. Alternatively, they can create a new group, in
    which case the GID will probably be the same as the unique UID for each user.
    Remember that a group cannot be a member of another group in Linux.


    Since you''ve read this far, there''s a high probability that you''ve already
    set up your Linux distribution. You''ve probably also used the distro''s package
    manager to pull-in additional software, and are capable of browsing the web and
    perhaps playing games. While you might get some fair mileage with your current
    setup, sooner or later you''ll need to tweak things, whether you want to install
    a new piece of hardware, troubleshoot the performance of an app or share your
    computer with others.


    Most distributions bundle tools to help users manage various aspects of their
    system. Some distros, such as Ubuntu, have fairly easy to grasp administration
    tools, while others have quite an expansive administration section with tools
    that aren''t very intuitive at first glance. The average home user doesn''t need
    to have the proficiency and the dexterity of a professionally qualified system
    admin, yet there are a few skills that should be in your repertoire to help you
    manage your computer efficiently.


    Quick tip


    By using various combinations of permission settings, you can quickly set up a
    more secure environment.


    # Files and permissions


    Under Linux, everything is a file, including directories and devices. Every file
    has an accompanying set of ownership permissions, which provide data security
    by giving specific permission settings to every single item. They control who
    can read, write or execute a file. These three access permissions are set individually
    for three types of users: the file''s owner, the members of the group the file
    belongs to, and all others on the system.


    To list the permissions, type in this command:


    ```

    ls -l

    ```


    When used without specifying a filename, it will list the permissions of all files
    within the directory in this format:


    ```

    -rw-r--r-- 1 bodhi bodhi 8980 Apr 24 09:21 somefile.txt

    ```


    ```

    drwxr-xr-x 9 bodhi bodhi 4096 May 29 07:42 Downloads

    ```


    The first character in the output indicates the type of file. The hyphen in the
    truncated listing above represents a plain file and the d represents a directory.
    There are other characters as well to identify the different types of devices.
    This is followed by the file''s read, write and execute'
