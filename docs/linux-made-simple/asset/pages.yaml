    core. We won’t be going quite that high, but we will overclock our Raspberry Pi
    to a stable 900MHz using the Overclock menu. While this is a relatively safe activity
    it should be noted that going too far with overclocking can severely damage the
    CPU due to the excessive heat generated by it working harder. We asked the Raspberry
    Pi team and it confirmed that the core can reach temperatures of 85 degrees, and
    when it does it will automatically turn off the Raspberry Pi for protection. For
    ‘extreme’ tinkerers who want to push their Raspberry Pi 2 to the limit, now might
    be the time to invest in a set of heat sinks. If at anytime you wish to return
    the CPU to it’s normal speed, re-enter the raspi-config menu and return the values
    to the stock 800MHz. With our configuration changes made, and after a few reboots
    we have successfully ‘turbo charged’ our new Raspberry Pi. Let’s start the graphical
    user interface. After logging back in use the LXTerminal to type startx to return
    to the desktop. Now, lets see how the changes have improved our Pi to 10,000 score
    by repeating the test. Open LXTerminal and repeat the test code which was time
    echo "scale=10000; 4*a(1)" | bc -l The code will run and in our test it took 15
    minutes 28.519 seconds – that’s an improvement of two minutes! The Raspberry Pi
    Foundation has taken great care to build upon the legacy created by the Raspberry
    Pi Classic: “Raspberry Pi 2 has been in development for a couple of


    ```

    startx

    ```


    ```

    time echo "scale=10000; 4*a(1)" | bc -l

    ```


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_65_0.png)


    The Hello_Pi demos are a great way to show off your Raspberry Pi 2. You can wrap
    video around the teapot using any H.264 compliant video.


    years,” say Upton and Hollingsworth, and that includes the time spent developing
    BCM2836. “The first silicon arrived at the start of last May; there will be a
    video on the blog of me, James and Dom in the lab at Broadcom at 1am, the day
    after silicon came back, with the ‘video on a teapot’ demo running from Linux
    on a Broadcom “Ray” dev board. The design of the Raspberry Pi 2 board started
    last August (2014), and we’ve had samples since October (2014). We went through
    three iterations of prototypes to get exactly the right performance,” says Upton.


    # Compatibility


    The performance is reflected in the choice of CPU for the Raspberry Pi 2. Rather
    than choose another architecture the Foundation has stuck with an ARM-based CPU
    that is compatible with the ARM11 found in the earlier Raspberry Pi. The quad-core
    ARM7 can run software written for the older Raspberry Pi: “Raspbian works out
    of the box, but requires a new v7 kernel, which will be included in the downloads
    from our website” said Eben. As for hardware compatibility, the Raspberry Pi 2
    shares the same GPIO as the B+, which means that boards made for the A+ and B+
    will also work with the Raspberry Pi 2 and this even includes HAT boards (Hardware
    Attached on Top), which contain an onboard chip that communicates with the Raspberry
    Pi to set up the board quickly. There are some boards, however, that are not compatible
    with the B+ and the Raspberry Pi 2 due to their size and design. Boards such as
    PiFace [see LXF180] and PiFace Control and Display – that was used to control
    a camera rig for the Royal Institution Christmas Lectures – cannot be


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_65_1.png)


    The raspi-config advanced menu contains configuration options that enable you
    to really make the Pi your own.


    # The making of Raspberry Pi 2


    The Raspberry Pi Foundation are rather excited about the new Raspberry Pi 2. We
    spoke to the engineering team and Gordon Hollingsworth about development: “The
    Raspberry Pi 2 is 100% awesome. It’s as close to a typical PC as we wanted when
    we first started the project.” And the amount of effort that’s gone into development
    is impressive: “The team have put the equivalent of 20 years of work into the
    new Raspberry Pi and it’s processor, and that runs at a cost of between £2-3 million.”
    But there’s still a lot of enthusiasm for the older Raspberry Pi, Eben Upton explains:
    “There are a lot of industrial customers who won’t want to switch, and, of course,
    we still have the Model A+. To give you an idea of the ‘stickiness’ of an old
    platform, we sold something like 80,000 Model Bs after the Model B+ launch.” The
    Foundation also has its Compute Module, which was created to embed the Raspberry
    Pi inside industrial applications. We asked Eben if the Compute would be seeing
    a similar upgrade or not: “We’ll do a Compute Module 2 at some point, but probably
    not in the first half of 2015.” And what of the A+? Would there be a similar upgrade
    for it: “Nothing is currently planned as the A+ price point is quite challenging.”
    No upgrade for now then, but the Raspberry Pi family has grown considerably since
    2012 and now features six devices.'
