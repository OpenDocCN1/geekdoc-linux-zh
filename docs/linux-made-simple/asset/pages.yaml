- pgno: 133
  md: 'over. In consumer devices the mean-time-to-failure should be longer than the
    life of the device, and Andrew Tanenbaum''s stated aim of being finished when
    "computers don''t need a reset button" seems even more applicable here.


    Minix''s reliability comes from modularity and fighting bloat. There are 6,000
    lines of code in the kernel (see A minimalist codebase, foot of page). Outside
    of those 6 KLoC (which manage little more than interrupts, scheduling, and message
    passing) Minix runs everything else in the OS (all the drivers, from the console
    to the disk drive) in User Mode protecting against bugs and malicious attacks
    alike. To access memory, drivers and servers have to ask the kernel. No process
    is permitted to access anything beyond what it needs: the audio driver cannot
    access the disk drive, for example. The principle of least authority only allows
    kernel calls relevant for that class of driver, and allocates time slices to prevent
    infinite loops bringing down the system.


    On top of that driver layer sits virtual memory management, the process manager,
    file systems and the remainder that traditional Unix regards as part of the kernel.
    These run in User Mode, with the MMU turned on.


    User programs sit above this, but all three layers in User Mode are just – as
    the kernel is concerned – user processes. A crash in the code would bring down
    the system under Linux, but Minix 3 would merely need to restart the process.
    The data store server saves the state from crashed drivers, which is retrieved
    by the new one starting as a replacement.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_133_0.png)


    Building the SD card image for a BeagleBoard uses the NetBSD build.sh script and
    downloads most of the build tools needed on the fly.


    Monitoring all of the servers, and restarting them after a crash, if appropriate,
    is the reincarnation server.


    This is safe to do as most failures are caused by random timing errors and races.
    Tanenbaum''s team have tested this, injecting millions of faults to overwrite
    100 machine instructions in the running Ethernet driver binary. They injected
    800,000 faults into each of the three different Ethernet drivers, causing 18,000
    driver crashes – every time, the reincarnation server automatically replaced the
    driver.


    Of course, you could start attacking the kernel yourself – a comprehensive test
    suite is included – but first get your system the way you like it. As noted in
    the walkthrough, repositories.conf needs editing to have the correct Minix FTP
    address. Uncomment the NetBSD repo while you''re there. If you''ve never been
    on a server where vi is the only editing option, I''d recommend installing bsdgames
    on your laptop, and playing command-line Robots, until HJKL keystrokes are in
    muscle memory. Now run:


    ```

    pkgin update

    ```


    If there''s a problem, particularly via NAT on VirtualBox, our best guess is DNS,
    so put:


    ```

    nameserver 8.8.8.8

    ```


    in /etc/resolv.conf. Now you can use pkgin search to find packages, for example:


    ```

    pkgin install vim

    ```


    to install. If you made a larger hard disk partition, and want to install everything
    at once, use:


    ```

    pkgin_all

    ```


    If you want to delve deeper, start with the wiki at http://minix3.org, which has
    a good tutorial on writing device drivers, for example, and plenty of other developer
    documentation. The user docs aren''t too bad, but occasionally pages lag behind
    by a release version for a while. Naturally, help on updating the wiki would be
    appreciated by the project as much as more coders – it''s actually at the top
    of the wish list on the wiki!


    # A bright future for microkernels?


    That concludes this overview of Minix 3 – and of microkernels in general. We might
    be a long way from a usable Hurd, but microkernels have proved their worth in
    Qnx-powered cars, Cisco routers and elsewhere. Just as a stable alternative for
    embedded ARM development, Minix 3 is well worth considering. Given its (nearly
    integrated) NetBSD userland, Minix makes the most usable microkernel OS for those
    familiar with GNU/Linux, and we confidently expect good things in the next release.


    # A minimalist codebase


    A few years ago, Linux passed 15 million lines of code (LoC). Minix 3 has 6,000
    (6 KLoC) in the kernel, and about the same again for the drivers (that''s traditional
    kernel code running in User Mode). With a thousand times more code in Linux, we
    could assume that it has a thousand times more bugs. But it''s worse than that.


    All code has bugs, typically five to ten bugs per KLoC, although FreeBSD comes
    out somewhat better with three per KLoC. At FOSDEM, Tanenbaum cited a Stanford
    study showing that Linux driver code had three to seven times more bugs than the
    rest of the kernel – simply because there''s no fun in looking at messy driver
    code, rather than the important (and interesting) algorithms in the core kernel.
    In Linux 70% of the code is drivers. In Windows, 85% of the crashes are caused
    by drivers (which are mostly third-party). Running those buggy drivers in kernel
    space means vulnerabilities can bring down the whole system; in protected memory,
    isolated from other processes, the


    reach of vulnerabilities is strictly limited. Take Netfilter, which replaced Linux
    2.2''s ipchains to control packet direction – offering options for packet filtering,
    network address translation and port translation. Netfilter sits inside the kernel,
    whereas Minix Netfilter sits in user space. If malicious executable code targets
    Netfilter again (such as the 2.6 ''packet of death'' kernel vulnerability) in
    Minix the User Mode process would be compromised, but in Linux the whole system
    would be owned.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Installing the Minix 3 ISO


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_134_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_134_1.png)


    # 1 Booting


    Boot the ISO image from the default menu choice: Regular MINIX 3. Ignore the warning
    over cd9660 (this is a known problem and the buggy isofs driver has been disabled),
    the other modules will load just fine (for a VM on older processors, see the workaround
    in the main text), followed by the usual disk-mounting, and starting of services
    and daemons, and the familiar login prompt.


    # 2 Inline documentation


    Log in as root (you won’t need to supply a password yet). You’re now in the live
    disc’s environment, and can start exploring all that Minix has to offer from here
    – but if you’ve got VirtualBox running a full installation there’s a better sandbox
    in which to discover Minix 3. Type setup to start the install program. Read the
    four notes that are output, and then hit Enter.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_134_2.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_134_3.png)


    # 3 Not Ukrainian?


    Your first choice is keyboard layout. Unlike on your Linux distro, the relevant
    option is UK, not GB. If you can’t believe that won’t give you a Ukrainian keyboard,
    try Shift+3 at the next prompt, and you’ll get the £ sign. Backspace that £, and
    hit Enter for automatic disk partitioning, unless you really have a specific partition
    plan, in which case, type expert.


    # 4 Disk partitioning


    Even if you choose the automatic partitioning process, you still get to make many
    choices, provided the correct disk region is chosen (which isn’t a problem on
    VirtualBox installations). Just hit Enter, and again at the disk size prompts
    for partitions and block sizes. Minix gives most of the disk to the /usr partition,
    as this is where most files will live.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_134_4.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_134_5.png)


    # 5 Network cards


    Your network card – if it’s compatible – should be auto-detected with all the
    VM options well covered, and that includes some older (but well documented) cards.
    Take a good look at the list if you’re planning on a hardware install of Minix
    3 somewhere down the line. Now hit Enter to accept the discovered card (which
    will be AMD LANCE on VirtualBox and VMWare).


    # 6 Up and running


    After power cycling and booting, log in and use passwd to set a root password.
    In /usr/pkg/etc/pkgin/repositories.conf, change: http://www.minix3.org/pub/pkgsrc/packages/$osrelease/$arch/All
    which should be the only uncommented line, to: ftp://ftp.minix3.org/pub/minix/packages/3.3.0/i386/All/
    and, finally, run pkgin update.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Rescatux:

    System repairs


    All those commands feeling a bit complex? Repair common system problems without
    resorting to the command line.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_135_0.png)


    Linux live CDs are a wonderful invention, they let you try new distros, show Linux
    off to your unenlightened friends, and fix broken systems. There are live distros
    aimed specifically at repairing damaged systems, but they have a common drawback.
    They all require a certain amount of expertise and most of us don’t break our
    systems often enough to gain that sort of experience. When your computer sits
    there showing you nothing but a glum message from the bootloader, your main priority
    is fixing it as quickly as possible, not spending time using a search


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_135_1.png)


    Rescatux works with 32 and 64 bit systems. Booting 32 on a 64 bit system is usually
    safe, but not optimal. The reverse will fail.


    engine from a live CD to try and find the correct Grub incantation for your situation.
    I consider myself reasonably knowledgeable about bootloaders, but I still don’t
    break them so often that I feel comfortable fixing them from the command line
    without at least a cursory RTFM to check my options.


    # Prep for live surgery


    What we need is a live distro that is designed for fixing common problems without
    a great deal of background knowledge or research, and preferably one that doesn’t
    require typing long commands where an error could make the situation worse. What
    we need is something like Rescatux.


    Rescatux boots like a typical live CD to a lightweight LXDE desktop, but the window
    that opens on startup is the key difference. Called Rescapp, this is a one-stop
    centre for fixing various problems. Rather than simply list them, let’s look at
    some of the problems that can arise when a computer system starts misbehaving
    at a low level, and how Rescatux can be used to fix them. This is not for dealing
    with minor user-level problems, a live CD such as Rescatux is usually brought
    out when things go seriously wrong.


    Many system recovery operations require you to be booted from a live CD, either
    because normal booting is broken or because you need your root filesystem to be
    unmounted. You normally also need to use command line tools, and Rescatux provides
    all of this, but the Rescapp makes life much easier for many tasks.


    When you press any of the operation buttons in Rescapp, it does not directly perform
    the operation. It displays a documentation page explaining how to use the option
    and, considering the low-level aspect of many of the operations, it’s a good idea
    to read this. Then press the Run! button at the top right to perform the operation.


    # #1 Hard disk errors during boot


    The first step when filesystem errors appear is to run fsck (that is short for
    filesystem check, not the expletive you use when you see the errors). This must
    be done while a filesystem is unmounted, hence the use of a live CD. Press the
    File System Check button. Rescapp temporarily mounts partitions in order to determine
    which distro they belong to. Of course, the corruption may prevent mounting (distro
    startup sequences are able to fix minor filesystem corruption transparently) so
    you may well be looking for one marked ‘Cannot mount.’ Only distro root directories
    can be identified,'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Getting more help


    While Rescapp is able to fix many problems with a couple of mouse clicks, sometimes
    you need more help. Rescapp has some tools to help with this; first of all there
    is a web browser to search for answers, possibly using error messages you received
    when trying to repair your system. Everything Rescapp does is logged, the Show
    Log button presents you with a list of log files – remember, this is a live CD
    so you will only see logs from the current session. You can also view the logs
    directly, they are saved in rescapp/logs. Looking through the log for the operation
    you are attempting may give information useful to you. If it does not help you
    understand the problem, it may help others, which is where the Share logs button
    comes in. After selecting a log to share, Rescapp will send the log to a pastebin
    on Debian’s servers and give you the URL. Copy this somewhere safe and you can
    give it to anyone else for them to take a look at your logs. For a real time response,
    try the Chat button. This opens an IRC client to the #rescatux channel, where
    you can paste the URL of your pastebin and ask for help. You are not restricted
    to their own channel, of course, you could also try a channel dedicated to your
    distro for more specific advice. The ‘Share log on forum’ option works similarly,
    allowing you to ask for help on the LXF forums or your second favourite web forum.
    Before you ask for help online, use the Boot Info Script button. This generates
    a file in logs containing information about your system, and you can share this
    with the ‘Share log’ option. Information about your system may be crucial to someone
    finding a solution to your problem.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_136_0.png)


    The Share Log button sends a log file to a pastebin and gives you the URL so you
    can share it with anyone who wants to help you.


    if you have a separate home, it will appear as ‘Not detected’ (or ‘Cannot mount’
    if it is damaged). There may be other reasons for a partition being unmountable;
    it may be your swap partition or an extended partition, so choose carefully. If
    in doubt, the Boot Info Script log (covered later) lists your partitions and their
    types.


    computer with sudo shutdown -n

    This kills processes without using the usual init system, which reduces the number
    of disk writes. Now you can boot Rescatux. If you partitioned a drive, you can
    use testdisk to search for the old partition boundaries and restore them. Repartitioning
    a drive only writes to the partition table, the actual data on the rest of the
    disk isn’t touched until you format the new partitions. So if you can find the
    old partition boundaries and write them back into the partition table, everything
    should be back as it was. This is what testdisk does. After accepting the option
    to create a log file, that may be useful later, pick the disk to scan. The partition
    type should be Intel for the old-style MBR partition tables or EFI


    ```

    sudo shutdown -n

    ```


    # #2 My password is not recognised!


    Aside from boot merely resulting in an unfriendly grub> prompt, this is one of
    the most scary moments of computer use. You checked that you typed it correctly
    and that the caps-lock is not on. You may have forgotten it or, on a new install,
    have mis-typed it on setup.


    Resetting a password involves booting a live CD and messing around with chroots
    – you cannot simply edit a file – or you can use Rescapp. Press the ‘Change Gnu/Linux
    password’ button and, after reading the explanation, press Run!, pick the distro
    (there will always be at least two, your installed distro and Rescatux, which
    appears as Debian 7) and then select the user to change. Enter the new password
    and the job is done. Try not to forget this one! This button is only for Linux
    passwords. If you run a dual-boot system with Windows, there is a separate option
    to reset your Windows password.


    # #3 I deleted the wrong files


    It is both amazing and terrifying how a simple typing mistake can cause so much
    damage. For example if you meant to type rm -f *.txt but typed rm -f * .txt instead.
    Or you wanted to reformat /dev/sdc but typed sdb instead. There is the odd filesystem-specific
    tool for recovering deleted files, such as extundelete – but a really determined
    typo can easily beat that, and it can’t help if your partitions are gone. The
    first thing to do in such a situation is to stop writing to the disk – if the
    damage is on the partition containing your root filesystem you should shut down
    the


    ```

    rm -f *.txt

    ```


    ```

    rm -f * .txt

    ```


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_136_1.png)


    If a filesystem needs repair, select it and Rescapp will do the rest. Cannot-mount
    may mean damage, but here it indicates swap and extended partitions.'
  merge: -1
  img_proc: true
- pgno: 137
  md: "# #4 I'm having problems with Windows\n\nGo on, own up, some of you also use\
    \ Windows, or have a \"friend\" who does. Rescapp also has options for repairing\
    \ Windows systems, from resetting passwords to making users into administrators\
    \ and other user management. It also has an option to restore the Windows MBR.\
    \ The section on repairing Grub only applies if you still have at least one Linux\
    \ distro installed. If you want to remove all Linux partitions from a drive, you\
    \ will need to remove Grub from its boot sector and reinstall the Windows bootloader.\
    \ Rescapp does this with the Restore Windows MBR button. Choose a disk, as with\
    \ the Grub restore, and it will set up your hard disk to use the Windows bootloader.\n\
    \n# #5 It's complicated\n\nSo far, we have looked at solutions to standard problems\
    \ that can be deal with by a couple of mouse clicks. If things get more complicated.\
    \ Rescatux contains much of the other software found on rescue discs, and you\
    \ can just open a terminal and use it, but it will come as no surprise that you\
    \ can also use more advanced tools from the Expert Tools section of Rescapp. These\
    \ tools include:\n\n+   - **Gparted** – for (re)partitioning your hard disk.\n\
    - **Testdisk** – to find partitions and filesystem on disks with a damaged partition\
    \ table.\n- **PhotoRec** – to recover deleted or otherwise lost files from a disk,\
    \ and not only photos.\n- **OS Uninstaller** – for removing extra distros from\
    \ a multi-boot system\n\nIt is worth noting that the Expert Tools buttons still\
    \ open a help page first, but this is generic help for Rescatux, not help for\
    \ the individual programs.\n\nApart from those single-use programs, there is also\
    \ Boot Repair which opens a window containing many options for altering the boot\
    \ process.\n\nThis covers a number of operations, especially if you enable the\
    \ Advanced options. It allows you to back up your partition tables and log files\
    \ to a USB device, a wise step before you start changing things. Most of the other\
    \ options in here let you tweak how the bootloader works. You can reinstall, as\
    \ with the separate button covered elsewhere,\n\nGPT for the newer GPT variant,\
    \ the other choices are rather specialist. Removable drives occasionally use the\
    \ None option, but usually have a single partition with an MBR partition table.\
    \ Select Analyse to scan the disk's partition table and then Deeper Scan to search\
    \ for lost partitions. If you find what you are looking for, Write will hopefully\
    \ restore your lost settings. Although it is not mentioned in all the menus, pressing\
    \ Q usually takes you back to the previous menu. Testdisk is a very low-level\
    \ tool, and its effects may not be reversible, where possible use dd to make a\
    \ backup of your disk before proceeding.\n\nIf you deleted files rather than partitions,\
    \ the tool you want is PhotoRec. Photorec scans the disk for evidence of files\
    \ and then attempts to reconstruct them – you will need another disk attached\
    \ for saving these files to. Photorec can only find the contents of files, metadata\
    \ such as ownerships, permissions and even the file name is not available to it.\n\
    \nSo you end up with a lot of files with numeric names, although PhotoRec does\
    \ give them a suitable extension based on the contents of the file. If the files\
    \ are digital camera photos (PhotoRec was originally written to recover files\
    \ from an erased memory card) or music files, you should find that any EXIF or\
    \ ID3 tagging is preserved, making identification of the files relatively simple.\
    \ Otherwise, you may have to spend some time trawling through the files to identify\
    \ them, but that is better than losing your data altogether.\n\nForget your password?\
    \ Rescapp lets you reset the password of any Linux or Windows users, including\
    \ root, with a couple of mouse clicks.\n\n![](img/57f4a2d286909b0a84c8ecfefbbe15f2_137_0.png)\n\
    \n# Boot an ISO from Grub\n\nRescue discs are great, as long as you can find the\
    \ thing when you really need it. You can copy an ISO image to a USB drive with\
    \ dd\n\n```\ndd if=/lxfdvd/downloads/rescatux_cdrom_usb_hybrid_i386_amd64-486_0.32b1.iso\
    \ of=/dev/sdX bs=4k\n```\n\nwhere sdX is your USB drive. That is more convenient,\
    \ but Murphy's Law states that you won't be able to find the drive when you need\
    \ it, so there is a more convenient option. To save you going through your pile\
    \ of LXF DVDs to find the one with Rescatux on it, here is how to boot it from\
    \ your hard drive.\n\nYou need a working Grub2, so it is not an option in all\
    \ cases, but if Grub and your boot partition are working it is more convenient,\
    \ and faster. Put the ISO image into your /boot\n\ndirectory, then add the following\
    \ to the bottom of the file /etc/grub.d/40_custom (do not modify the existing\
    \ lines.)\n\n```\nsubmenu \"Rescatux 0.32\" {\n  set isofile=/Rescatux/rescatux_cdrom_usb_hybrid_i386_amd64-486_0.32b1.iso\n\
    \  loopback loop $isofile\n  menuentry \"Rescatux 0.32 - 64 bit\" {\n    linux\
    \ (loop)/live/vmlinuz1 findiso=$isofile\n    boot=live config quiet splash\n \
    \   initrd (loop)/live/initrd1.img\n  }\n  menuentry \"Rescatux 0.32 - 32 bit\"\
    \ {\n    linux (loop)/live/vmlinuz2 findiso=$isofile\n    boot=live config quiet\
    \ splash\n    initrd (loop)/live/initrd2.img\n  }\n}\n```\n\n```\ninitrd (loop)/live/initrd2.img\n\
    }\n```\n\nNow run update-grub or grub-mkconfig, or use the Update Grub Menus option\
    \ in Rescapp, to update your menu. Then, when you reboot your system, you will\
    \ have an option to boot into Rescatux.\n\n```\nsudo grub-mkconfig -o /boot/grub/grub.cfg\n\
    ```\n\nIf trying to boot from it gives an error that the ISO file could not be\
    \ found, add this below the submenu line\n\n```\nset root='(hd0,1)'\n```\n\nwhere\
    \ hd0,1 refers to the first partition on the first disk (for some reason Grub\
    \ counts disks from zero and partitions from one. Adjust to suit your system."
  merge: -1
  img_proc: true
- pgno: 138
  md: 'but you can also change the location of the bootloader and the options it uses.
    How often have you searched for a solution to an issue only to be told to "add
    option xyz to Grub". You could go editing configuration files, but the Boot Repair
    window has a tab from which you can add various options without editing system
    critical files with the inherent risk of making things worse.


    The current release of Rescatux is a beta and it does have some bugs. One or two
    of the options do not work properly, although we have not found anything dangerous.
    It''s more a case of the option not doing anything rather than doing the wrong
    thing. We expect these bugs to be fixed in due course, but Rescatux is still worth
    keeping around as it can save a lot of heartache in many situations.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_138_0.png)


    Tweak your Grub options as well as performing other Grub backup and repair operation
    from the Expert tools section.


    # Fixing Grub


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_138_1.png)


    # 1 Restore Grub


    Select Restore Grub from the main Rescapp window and read the help text to make
    sure you understand what is going on. Rescapp does most of the work, but you still
    need to know which distro and which disk you want to use for Grub. Press Run!
    when you are ready.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_138_2.png)


    # 2 Select a distro


    Rescapp will scan your disk partitions for installed distros, trying to recognise
    them by name when possible. Pick the one you want to use as your ''main'' distro.
    This is the one that you are unlikely to want to remove, as that would involve
    repeating this process.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_138_3.png)


    # 3 Grub selection


    Now choose the disk to which you want to install Grub, usually sda. It doesn''t
    have to be the one containing the distro you chose, but that is normally the case.
    If you boot from a USB stick, that may be recognised as sda with your hard disk
    on sdb.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_138_4.png)


    # 4 Auto-fix


    Press OK, and Rescapp will perform the necessary steps, mounting and unmounting
    filesystems as needed and running grub-install with the correct --boot-directory,
    --root-directory and device arguments. Now you can reboot! It''s as simple as
    that.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Wireshark: Analyse traffic


    We''ll explain the necessary things that you need to know to start using Wireshark,
    and analyse three kinds of network traffic.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_139_0.png)


    Wireshark is a very popular and extremely capable network protocol analyser that
    was developed by Gerald Combs. Wireshark was born in June 2006 when Combs renamed
    the network tool Ethereal, which he also created, as he was changing jobs and
    couldn''t use the old name anymore. Nowadays, most people use Wireshark


    and Ethereal has been consigned to history. Your Linux distribution will have
    a ready to install package for analyser too, so go ahead and install it.


    You may ask what makes Wireshark different to other network analysers – apart
    from the fact that it''s free – and why we''re not simply advocating using tcpdump
    for packet capturing? The main advantage of Wireshark is that it''s a graphical
    application. Capturing and inspecting network traffic using a graphical user interface
    is a very helpful thing because it cuts through the complexity of network data.


    To help the beginner understand Wireshark they will need to understand network
    traffic. The aim of this article then is to supply a comprehensive introduction
    to TCP/IP to enable you to come to useful conclusions about the network traffic
    data you''re analysing.


    If you run Wireshark as a normal user, you won''t be able to use any network interfaces
    for capturing, because of the default Unix file permission that network interfaces
    have. It''s more convenient to run Wireshark as root (sudo wireshark) when capturing
    data and as a normal user when analysing network data. Alternatively, you can
    capture network data using the tcpdump command line utility as root and analyse
    it using Wireshark afterwards. Please keep in mind that on a truly busy network,
    capturing using Wireshark might slow down a machine or, even worse, might not
    enable you to capture everything because Wireshark needs more system resources
    than a command line program. In such cases using tcpdump for capturing network
    traffic is the wisest solution.


    # Capturing network data


    The easiest way to start capturing network packets is by selecting your preferred
    interface after starting Wireshark and then pressing Start. Wireshark will show
    network data on your screen depending on the traffic of your network. Note that
    you can select more than one interface. If you know nothing about TCP, IP or the
    other TCP/IP protocols, you may find the output complicated and difficult to read
    or understand. In order to stop the capturing process you just select Capture
    > Stop from the menu. Alternatively, you can press the fourth icon from the left,
    the one with a red square (which is shorthand for ''Stop the running live capture'')
    on the Main toolbar (Note: its exact location depends on your Wireshark version).
    This button can only be pressed while you are capturing network data.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_139_1.png)


    The TCP packet and the IP packet format.'
