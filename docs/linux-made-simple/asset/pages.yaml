- pgno: 39
  md: '# Ditch XP and switch to Linux


    Linux can be a bit scary for newbies, so we''re on hand to demonstrate how to
    swap dusty old Windows XP for sparkly Linux Mint.


    Do you know one of the 12% of desktop PC users out there (www.netmarketshare.com)
    who still uses Windows XP? Yes? Then do them a favour – tell them to stop and
    hand them this article. As of 8 April 2014, Microsoft ended all support for its
    ageing closed-source operating system. This means every new exploit and security
    flaw will go unpatched and unfixed, and will remain as a gaping hole in people''s
    digital lives. It really is a bad situation, because it''s going to lead to identity
    theft, an increase in spam and more botnet activity. Of course, it also means
    that vulnerable people will potentially be exploited. One of the problems is that
    Windows XP works well for a large number of users, and because of this, they''re
    unwilling to change their habits – irrespective of security concerns. We''re here
    to try to help shift people away from Windows XP. In our view, many people simply
    don''t care what their underlying system is, just as long as it works and offers
    the same programs and online access – and what better system could we offer than
    Linux Mint?


    # Get started now


    We''ll show you how you can take an existing Windows XP PC, rejig the partitions,
    install Linux Mint and retain access to your old Win XP files, while gaining the
    benefits of a modern Linux OS. You can get all of this by following the article
    and using the cover disc or with a couple of easy downloads. On the disc you''ll
    find a 64-bit version of Mint, plus the SystemRescueCD bootable live CD. That
    means you need a 64-bit compatible processor. See the box below on alternative
    distros if you need a 32-bit build, because it''s likely that you''ll want a low-requirement
    distro as well. Are you unsure about whether you have 64-bit compatibility? Well,
    Intel 64-bit support was introduced with its Pentium 4 Prescott back in 2004 and
    has been mostly across the board for desktop processors since 2005 and its entire
    Core 2/iX range.


    In regards to AMD, it introduced the 64-bit compatible Athlon 64 back in late
    2003 and this had filtered through its entire line by 2005. So unless a system
    is more than nine years old, it should be compatible with 64-bit. Don''t worry
    if yours isn''t – all distros offer 32-bit alternatives for non-64-bit systems.
    Linux Mint can squeeze into 8GB of HDD space, but more is really recommended.
    Our guide is going to suggest reducing the Windows XP partition (or a suitable
    data/file partition) to squeeze in room for the Linux boot partition. For this,
    there needs to be at least 8GB of free space on that partition. In some circumstances,
    you''ll need to delete any unwanted files before this can happen. It''s better
    if you have a lot more free space, but we''ll work with what we can get. You might
    be wondering why we''re working with an additional partitioning program when Ubuntu-based
    distros like Linux Mint have one built in. The truth is that while the built-in
    partition tool works well, it''s awkward to use and we''re really trying to make
    things as simple as possible. The GParted tool is far slicker, and if people finally
    plump for Linux – and why wouldn''t they? – a partition tool is going to be needed
    for removing Windows and resizing the root partition. In most cases, that''s best
    done from a boot CD. If you run into issues, there are plenty of online support
    sites with answers – often these involve the terminal. What''s that you say? The
    terminal is often portrayed as a black slab of death in circles outside the Linux
    world. It''s nothing more than the Linux version of the command line but is far,
    far, far more powerful. The terminal allows entire servers to be administered
    – you can hack the world from here! See the tutorials in section 6 if you want
    to know more. And that''s it. You''ll have Linux up and running. Turn the page
    to see how easy it is to access your old Windows documents and check out the alternative
    programs you can use. They''re free, easy to install and waiting to be discovered.


    # Distro divas


    As we''ve mentioned, we''ve based this guide on what''s available on the accompanying
    cover disc, but there''s no reason you can''t substitute these options with your
    own choices. In some circumstances, this could be for compatibility. A 32-bit
    lightweight option (such as www.puppy linux.com at 161MB or www.bodhi linux.com
    at 613MB) may well be the only real choices for the more ancient XP systems out
    there. When XP was launched in late 2001, 32-bit was all the rage and remained
    so, especially on mobile systems, until the mid-2000s. There are also various
    releases of both Ubuntu and Linux Mint in 32-bit offerings, and you can grab yourself
    a download from www.linuxmint.com or www.ubuntu.com. For repartitioning, we''re
    going with the all-powerful SystemRescueCD distro, which is on the cover disc.
    It might be overkill for a basic repartitioning job, but it''s always handy to
    have around. You might want to consider the more direct GParted Live distro at
    175MB from www.gparted.org, which boots directly into a graphical desktop with
    GParted ready for action.'
