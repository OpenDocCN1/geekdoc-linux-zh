- pgno: 87
  md: '# System administration


    From hardware configuration to file management, how hard is it to manage?


    If you have basic Linux admin skills and want a Linux box that different users
    can share for basic desktop work, don''t install Puppy. This is not a critique,
    just a service announcement. Puppy is very well done, but mainly conceived for
    live usage off a CD or USB key, by single users. Some Puppy configuration tools
    (such as the Menu Manager or the Application Chooser) are easy and good looking.
    Others, like the Firewall configurator, are effective but archaic. But the real
    issue is that Puppy does not really want multiple, normal user accounts. By default,
    you


    are root – it''s your computer, so you should always be able to do whatever you
    want to it. Browsers and other apps that must expose themselves online run as
    the user spot, with a non-writable home directory and limited privileges. When
    spot is not enough, you can still become fido, a normal account like you find
    in any other distro. Besides, in order to boot and run as fast as possible, Puppy
    always tries to stay entirely in memory. Kernel, libraries, binaries, configuration
    files –everything works that way, without even looking for a swap partition. End
    user files, together


    with software installed or updated after first boot, all go into one special file
    with a .3fs extension, on the host system or in external storage. Your main Puppy
    admin skill may be as simple as ''always back up your .3fs files''!


    Next to Puppy, the other four distros are much more like ''ordinary'' Linux. You
    may need the command line for certain tasks in Absolute and Crunchbang, unless
    you install extra packages. Absolute, for example, has a simple graphical front-end
    for adding users, but to remove any you should use the normal userdel command.


    Elive has a nice mix of Internet Configurator, Model Dialer and 3G Mobile Phone
    interface but not much in the ''GUI for system administration'' department. The
    risk is that you''ll spend so much time experimenting with the addictive Enlightenment
    control panel that you neglect anything else. If you must work at the console,
    Elive makes it easier with the powerful Terminology emulator.


    Crunchbang and Manjaro use the Turbulence configuration interface, at least in
    the OpenBox versions. Manjaro also includes MHWD to install non-free graphics
    drivers. Apart from that, they are similar to their ancestor, Arch Linux.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_87_0.png)


    Puppy''s .3fs saver, Manjaro''s Pacman configurator, and Absolute Control Panel.


    +   Verdict

    Absolute ★★★★☆

    Crunchbang ★★★★☆

    Elive ★★★★☆

    Manjaro ★★☆☆☆

    Puppy ★★★☆☆

    GUI-based config tools (but maybe not ones you expect) are available in all.


    # Installing and managing apps


    What if you need a program that is not installed?


    No matter how good it might look, a distro is worthless if there is no way to
    install new programs, or update existing ones, without being a real programmer
    and/or fighting dependency hell. Elive is the easiest to deal with – it basically
    uses the same mechanisms, online repositories and graphical front-ends available
    in Debian and its derivatives. Crunchbang has menu entries such as ''Install LibreOffice''.
    Clicking this opens a terminal in which a script asks you to confirm, then proceeds
    to download and compile the sources, and install the result. In Absolute, crude
    dialogs ask, for example, if you want to download the


    ''Multimedia'' packages, that is codecs and similar libraries not included by
    default. Another tool will list the installed packages and offer to remove them,
    or install new ones previously downloaded in TXZ format. Manjaro can find and
    download fully tested packages in online repositories such as AUR (Arch1 User
    Repository), with interfaces like Pamac, which can compile and install from source
    archives with a double-click too. Puppy works differently, on-screen and behind
    the scenes. Each version gives access to a different combination of online repositories.
    Also, the first time you launch a program, Puppy checks if a newer version is
    available online and


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_87_1.png)


    Elive uses the Synaptic interface, as on Debian, Ubuntu and other distros.


    offers to install it. In all cases, new software is installed in the .3fs file
    described in the section above.


    +   Verdict

    Absolute ★★★★☆

    Crunchbang ★★★★☆

    Elive ★★★★★

    Manjaro ★★☆☆☆

    Puppy ★★☆☆☆

    Elive offers the easiest app management; it uses standard Debian tools.'
