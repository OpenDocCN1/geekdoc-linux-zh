- pgno: 30
  md: '# Escape Windows


    The time has come – follow us as we help you evade Windows and make a bid for
    Linux and freedom.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_30_0.png)


    > “Microsoft has finally lost the plot – now is the perfect time to switch to
    a better OS”


    If, having bought a new PC that has Windows pre-installed, you''ve come to the
    conclusion that Microsoft has finally lost the plot, now is the perfect time to
    switch to a better OS. Macs are shiny and expensive, so why buy one when you can
    keep your existing PC and move to Linux? Gone are the days when Linux meant immersing
    yourself in command-line chicanery – we''ll show you how you can install a user-friendly
    flavour of Linux alongside your existing Windows installation without losing any
    data, so you can dip your toes into the free and open waters of Linux. To make
    the transition as smooth as possible, we''ve chosen Ubuntu 14.04 LTS (on the cover
    disc) as our Linux distro of choice. Ubuntu is one of the most user-friendly Linux
    distros out there, and 14.04 LTS has just been released. LTS stands for Long Term
    Support, which means it gets five years of updates and support. Here''s what you''re
    going to do. Firstly, we would be remiss if we didn''t instruct you about how
    to back up your current PC. You have two basic choices here: the backup tools
    which are built into Windows itself, or SystemRescueCD, which you''ll find as
    part of the cover disc. Next, we''ll explain how modern PCs ship with a new system
    called the UEFI, which may cause minor problems. But don''t worry, because we''ll
    show you how to overcome any issues if they arise. Finally, we''ll step you through
    the installation process itself, which is a piece of cake. And we won''t leave
    you hanging – once you''ve booted into Ubuntu for the first time, we''ll take
    you on a tour of the new desktop, reveal how to access existing documents and
    other files, and show you how to get to grips with your brand new operating system.
    There''s never been a better time to make the life-changing switch to Linux, so
    grab our hand and take the plunge.'
