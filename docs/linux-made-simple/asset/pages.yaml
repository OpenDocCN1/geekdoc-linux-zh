- pgno: 34
  md: 'pressure from end users and provided a UEFI update on its website to enable
    the required options – Advent’s DT2410 PC is an example where this happened.


    With your Windows system backed up and the UEFI configured correctly, it’s time
    to press on and install Ubuntu alongside your existing setup. One of the reasons
    we’ve chosen Ubuntu is that its user-friendliness is apparent from the moment
    you install it. The set-up process is painless and relatively straightforward
    to follow: pop your cover disc into the drive, start your PC and, if necessary,
    select your optical drive from the boot menu. When the cover disc menu appears,
    choose the Ubuntu option to begin.


    Wait for a few minutes, then after a short pause, when the screen goes grey and
    then red, the Welcome screen will appear. You’ll be given the option of either
    trying Ubuntu or installing it – select the ‘Install’ option. Next, tick both
    boxes: ‘Download updates while installing’ and ‘Install this third-party software’.
    Click ‘Continue’, then wait while the updates are downloaded in the background.


    # Install Ubuntu 14.04 LTS


    The Installation Type screen should then appear. In most cases, it should seamlessly
    detect your Windows installation – leave ‘Install Ubuntu alongside…’ and click
    ‘Continue’.


    If Windows isn’t offered as an option, this means Ubuntu hasn’t detected it. If
    you’re running a newer PC with an UEFI installed in place of the traditional BIOS,
    you’ll need to make sure you boot from the optical disc using the same option
    that Windows was installed with. Reboot your PC, then choose the alternative optical
    disc option from the boot menu to see whether Ubuntu now detects your Windows
    installation. If the option doesn’t appear whether you choose UEFI or the legacy
    option, it could be down to your partition table containing both MBR and GPT records
    (see below for the step-by-step guide for a way to resolve this issue).


    The next screen sees Ubuntu automatically find some free space for itself – either
    by carving up your current Windows partition, or by locating more space on another
    attached drive and repartitioning that instead. If you don’t want it installing
    on a USB drive, power down your PC, disconnect the offending drive, then start
    again. Ubuntu needs a


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_34_0.png)


    Check your UEFI shell’s boot settings to see whether Legacy, UEFI or mixed mode
    is selected.


    minimum of 6.4GB of free space, but will take up to 40-odd GB if it can. You can
    alter this figure by clicking and dragging the grey space between both suggested
    partitions. It’s smart enough to not allow you to swallow up your entire Windows
    partition, but if you plan to continue using it going forward, try to leave at
    least 10GB of free space if you can, and preferably more. In most cases, the default
    choice should be fine anyway, so click ‘Install Now’. Note the comment about partition
    resizing, and click ‘Continue’.


    Next you’ll be prompted to choose your region – the installer should automatically
    detect this – then click ‘Continue’ to select your keyboard layout. In most cases,
    the default UK keyboard layout is the one to pick, so click ‘Continue’ again.
    You’ll now be prompted to enter your name. As you enter it, Ubuntu will populate
    both the computer’s name and username fields based on your choice – you’re free
    to edit both should you choose. The final choice available to you is to pick a
    password. Select one that you’ll easily remember, because you’ll need this not
    just to log into Ubuntu but also to perform administrator-level tasks. Click ‘Continue’
    again, and you can sit back and wait for Ubuntu to install itself on your PC –
    it really is that simple. It’s worth hanging around because the installer will
    reveal some useful pointers for your first steps into using Ubuntu. But turn the
    page and we’ll take you on your own personal tour of your shiny, new desktop and
    operating system.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_34_1.png)


    # Fix Windows detection issues


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_34_2.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_34_3.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_34_4.png)


    # 1 Launch Ubuntu Live


    If your Windows install isn’t detected, click ‘Back’ until you return to the Welcome
    screen. Click ‘Try Ubuntu’ to load the live CD. When it’s loaded, press [Ctrl]+[Alt]+[T]
    to open a terminal window. Type the following command and hit [Enter]:


    ```

    sudo gdisk /dev/sda

    ```


    # 2 Verify and fix


    If gdisk says it’s found both an MBR and a GPT, then the presence of GPT is the
    problem – removing it will enable Ubuntu to see your Windows partition. First,
    select the GPT entry by typing 2 and hitting [Enter]. When prompted, type x and
    hit [Enter] to access Expert command mode.


    # 3 Apply and reboot


    Type z and hit [Enter]. When prompted to wipe the GPT on /dev/sda, type y and
    hit [Enter]. When asked if you’d like to blank the MBR, make sure you type n,
    hit [Enter] and close the terminal, then reboot and try to install Ubuntu again.
    This time you’ll see the option to install it alongside Windows.'
