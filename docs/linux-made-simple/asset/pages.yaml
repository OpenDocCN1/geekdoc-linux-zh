  md: '![](img/57f4a2d286909b0a84c8ecfefbbe15f2_83_0.png)


    Software | Low-resource distros


    # Low-resource distros


    Do low-resource Linux desktops for the average user still exist? We test five
    less well known distributions that are fast and not so furious to use.


    # Our selection


    +   - Absolute Linux

    - Crunchbang2

    - Elive

    - Manjaro

    - Puppy


    Computer hardware has made huge progress in the last 20 years. So have Linux desktops,
    but in a different way. Modern computers – in whatever format, from smartphones
    to laptops – are orders of magnitude more powerful than their predecessors of
    the 90s. But Linux desktops have not become tens of times faster. So what options
    do you have if you want a faster Linux, particularly on older hardware? Many Linux
    developers produce so-called ''low-resource'' distros, which require much less
    RAM and processor cycles than Ubuntu and similar state of the art products. Unfortunately,
    this too often creates graphical desktops that are useless for most people. Damn
    Small Linux (DSL), for example, is great for software engineering, but how many
    mainstream things can it do? Can you really use DSL to edit an Excel spreadsheet,
    browse YouTube clips, use Ajax-based cloud services such as Gmail, or easily upgrade
    software? This is what led us to this roundup. We did not want the smallest possible
    Linux desktop, or the one that will boot with the least RAM. We looked, instead,
    for distros in which ordinary users, without advanced Linux skills, can work with
    office documents, check their email and use popular web services – even on older
    computers – with the least possible effort.


    # How we tested...


    We did not consider Lubuntu and other ''light'' Ubuntu spin-offs, simply because
    they are the ones that most Linux novices who need a low-resource distro are more
    likely to know already. After a lot of investigation, we chose one distro with
    a truly unique architecture (Puppy) and four that are lightweight derivatives
    of more popular systems, namely Slackware, Arch Linux and Debian. We then ran
    them live on a low-end laptop and/or installed them in virtual machines with different
    RAM sizes, but never more than 2GB. In all cases, we tested the systems with ordinary
    day-to-day desktop activities, from browsing and using office suites to displaying
    photographs. We also tried some of the usual system administration tasks, from
    installing software to adding users and changing the general system configuration.'
