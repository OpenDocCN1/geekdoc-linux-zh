- pgno: 27
  md: '# Play multimedia


    Turn your distro into the ultimate media centre.


    Most Linux distros designed for desktop users are capable of handling all types
    of content you throw at them. But some content, especially most audio and video,
    is distributed in closed formats that are encumbered by patents. The distros can''t
    play these files straight out of the box, however, most have clearly outlined
    procedures to allow users to install components to play these popular non-free
    media formats.


    Ubuntu gives you the option to install the components that can play files in restricted
    formats, such as MP3s, during the installation itself. If you''ve already installed
    the distro, you should then use the package manager to install the ubuntu-restricted-extras
    package, which includes popular proprietary codecs and plugins.


    On Fedora these codecs are bundled in the third-party RPM Fusion repository. You''ll
    have to first enable the repo as mentioned earlier and then fire up a terminal
    and enter the following commands to fetch the codecs:


    ```

    su -

    ```


    ```

    yum install gstreamer1{,}-[plugin-crystalhd,ffmpeg,plugins-{good,ugly,bad,free,nonfree,freeworld,-extras}{,-extras}]
    ffmpeg libmpg123 lame-libs

    ```


    If you''re using Mageia, you''ll find the multimedia codecs under the Tainted
    repository, so make sure you enable it following the procedure mentioned earlier.
    Then launch the Welcome app from under the Tools menu and switch to the Applications
    tabs. From here you can install several useful and popular packages including
    multimedia codecs.


    # Where''s the bling?


    Despite the rise of the open source WebM format, many websites still require Adobe''s
    Flash plugin to properly stream multimedia content. Getting the Flash plugin on
    Linux is tricky since Adobe is no longer developing Flash for Firefox on Linux.
    The only way to use the latest Adobe Flash plugin on Linux is to use Google''s
    Chrome browser which includes the Pepper-based Flash plug-in.


    Mageia''s Welcome app is a wonderful utility to setup the distro for all kinds
    of users.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_27_0.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_27_1.png)


    You can tweak Linux''s Grub bootloader with the Grub-Customizer tool (ppa:danielrichter2007/grub-customizer).


    That said, if you don''t want to switch to Chrome you can still install the out-of-date
    Flash plugin and continue using the Firefox browser. Or, you can extract the newer
    Pepper-based Flash plugin from the Chrome browser and use it on Chrome''s open
    source cousin, the Chromium browser.


    Ubuntu users can install Flash for Firefox with the sudo apt-get install flashplugin-installer
    command. If you''re using Chromium, you can use the latest Pepper Flash plugin
    by installing the pepperflashplugin-nonfree package.


    Fedora users can download the Firefox plugin from Adobe''s website by adding its
    repo. If you are running a 64-bit installation, this command:


    ```

    yum -y install http://linuxdownload.adobe.com/adobe-release/adobe-release-x86_64-1.0-1.noarch.rpm

    ```


    will download and install the correct repo. You can then import the key for the
    repo with:


    ```

    rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-adobe-linux

    ```


    before installing the plugin with:


    ```

    yum -y install flash-plugin

    ```


    Mageia users can simply enable the nonfree repository which houses the Flash plugin
    and then install it from the Applications tab in the Welcome app.


    # Best multimedia apps


    Most distros ship with audio and video players. The popular ones are Rhythmbox
    which is the default on Gnome-based distros and is well integrated in Ubuntu,
    and KDE''s default Amarok. In addition to local tracks, both players can also
    stream Internet radio and podcasts. If you want more attractive looking players,
    fire up the package manager and look for Banshee and Clementine.


    Similarly, the default video player on most Gnome-based distros is Totem (now
    simply called Videos). If you want something with more feature you can grab MPlayer.
    This is essentially a command-line media player but it has a number of frontends.
    Gnome users can use Gnome-Mplayer and KDE users can use KMPlayer. There''s also
    the popular cross-platform VLC that can handle pretty much any file format.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Play games


    Full steam ahead.


    Gaming has long been considered Linux’s Achilles’s heel. Over the years we’ve
    had several quality open source games, but they’ve lacked the mass-appeal of popular
    gaming titles available on proprietary desktops. All that changed in early 2013
    with Valve’s announcement of Steam for Linux client for its hugely popular game
    distribution service.


    You can install the proprietary client in your distro with ease. Ubuntu users
    should enable the Partner repo and then install the client from the Software Center.
    Fedora users should install the RPM Fusion repos and then install Steam using
    the package manager. Similarly, Mageia users should enable the non-free repo and
    then use the Mageia Welcome app to install the Steam client.


    But before you fire up the Steam client make sure you’ve got the proper drivers
    for your graphics hardware. This tends to be the major sticking point for users,
    as card manufacturers restrict distribution of their closed-source driver elements.
    Start by getting details about the make and model of your graphics card using
    the


    ```

    lspci | grep VGA

    ```


    command. You can get more details, such as its clock speed and capabilities, with:


    ```

    sudo lshw -C video

    ```


    Your distro will ensure you are using the most suitable open source driver as
    soon as you boot into the distro. The Oibaf PPA (ppa:oibaf/graphics-drivers) is
    popular with Ubuntu users for getting the latest bleeding edge open source drivers.
    However, users of Nvidia and ATI/AMD hardware should use proprietary drivers from
    the respective vendor for the best gaming performance.


    Ubuntu users should use the X-Swat PPA (ppa:ubuntu-x-swat/x-updates) for the latest
    stable Nvidia drivers. Once enabled fetch the drivers with:


    ```

    sudo apt-get install nvidia-current

    ```


    Fedora users will find the latest GeForce drivers in the RPM Fusion repo. After
    adding the repo, install the driver with


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_28_0.png)


    ```

    yum install kmod-nvidia xorg-x11-drv-nvidia-libs kernel-devel acpid

    ```


    Mageia users should first enable the non-free repo and then launch the Mageia
    Control Center and head to Hardware > Set up the graphical server. In the window
    that open click on the toggle next to the Graphic Card label which will display
    a list of graphics card. Browse the list and select yours. If Mageia has a proprietary
    driver for the card, it’ll install it.


    Mageia’s list also includes AMD cards, but if you are using Ubuntu or Fedora,
    the best source for the proprietary driver is AMD’s website (http://support.amd.com/en-us/download).
    This page has several dropdown menus that you can use to pinpoint the exact driver
    for your graphics card. Then download the suggested driver and extract it to reveal
    a .run script. Before you install the driver make sure you install its dependencies
    with:


    ```

    sudo apt-get install dh-make dh-modaliseses execstack libc6-i386 lib32gcc1

    ```


    Once that’s done, you can execute the script with:


    ```

    sh ./amd-driver-installer-13.35.1005-x86.x86_64.run

    ```


    This will launch the graphical AMD Catalyst proprietary driver installer and will
    also install the Catalyst Control Center GPU management software. When the installer
    has finished, head back to the terminal and enter


    ```

    /usr/bin/aticonfig --initial

    ```


    to configure the driver.


    While distros do come with open source games in their repos, Steam offers access
    to AAA gaming titles like Dying Light.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_28_1.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_28_2.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_28_3.png)


    # User admin basics


    When Linux is installed, it’s automatically configured for use by a single user,
    but you can easily add separate user accounts. The superuser, root, has complete
    access to the OS and its configuration; it’s intended for administrative use only.
    Unprivileged users can use the su and sudo programs for controlled privilege escalation.
    Users are grouped together into a group, and inherit the group’s access privileges.
    Every Linux user is a member of at least one group. Now, you can control which
    files and folders are accessible by a user or a group. By default, a user’s files
    are only accessible by that user, and system files are only accessible by the
    root user. In Linux files


    and folders can be set up so that only specific users can view, modify, or run
    them. This allows you, for instance, to share a file with other users so they
    can read the file but not make any changes. Access to files is controlled via
    a system of ownership permissions. You can use the ls -l to list the permissions.
    When used without specifying a filename it will list the permissions of all files
    within the directory. The different characters in the output represent a file’s
    read (r), write (w), and execute (x) permissions for the owner, group, and all
    other users. You can alter the permissions of files and folders with the chmod
    command or graphically from the file manager.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_28_4.png)


    The file manager of almost every distro allows you to tweak the group associated
    with a file or folder.'
  merge: -1
  img_proc: true
