- pgno: 90
  md: '# Essential apps


    A Linux desktop isn''t complete without them.


    # LibreOffice


    Forked from OpenOffice.org. LibreOffice has become one of the most popular office
    productivity suites. It includes programs for word processing, and can create
    spreadsheets, slide shows, diagrams and drawings, maintain databases, and compose
    mathematical formulae. It also offers good compatibility with documents in proprietary
    formats and has recently had a face lift. www.libreoffice.org


    # Thunderbird


    Another gem from the Mozilla Foundation. Thunderbird is one of the best email
    clients, being easy to setup and is brimming with features. Simple setup wizards
    aid syncing with popular web-based email services and it can manage multiple accounts,
    supports encryption and is extended through add-ons. www.mozilla.org/thunderbird


    # Gufw


    You may not be using a firewall currently, and if that''s because they are difficult
    to set up then you need Gufw. It features an intuitive graphical interface for
    managing the inbound and outbound traffic rules for various apps and services
    and even individual ports. Its wizard-like graphical menus are designed especially
    for inexperienced users. www.gufw.org Gufw has profiles and preconfigured rules
    to aid inexperienced users.


    # Wine


    Despite the increasing number of cross-platform apps that work on Linux, there
    are some that still only support Windows. This includes big third-party proprietary
    apps, such as Adobe Photoshop or just small niche home-grown tools that you can''t
    do without. For such situations, you can use Wine, which generally run these Windows-only
    apps and games with ease. The project supports over 20,000 apps. Some work flawlessly
    out-of-the-box while others require minor configuration tweaks. www.winehq.org


    # KeePassX


    Trying to remember different passwords for the various services is a challenge
    for most humans (that don''t count cards in Las Vegas for fun). You can defer
    this task to KeePassX which stores password in an encrypted database. It can fill
    in the password automatically and also includes a random password generator. www.keepassx.org


    # VirtualBox


    When Wine doesn''t cut it you can use VirtualBox to run an entire Windows installation
    inside a virtual machine. The software is also useful for installing experimental
    apps that you don''t want to deploy on a real computer, and for testing other
    OSes without exposing it to real hardware. www.virtualbox.org


    # BleachBit


    A distro accumulates a lot of digital gunk over time. BleachBit helps you spring
    clean it and protect your privacy. It also removes temporary and other unnecessary
    files, and has tools to securely delete files or wipe them. http://bleachbit.sourceforge.net


    # Remmina


    With Remmina you can access a remote computer from the comforts of your desktop.
    It supports the widest range of protocols and will connect to all kinds of remote
    desktop servers. The app is easy to use, and has enough features that make it
    a viable option for occasional use. http://remmina.sourceforge.net


    # OpenSSH


    When you need to interface with a remote computer, you cannot do without OpenSSH.
    It''s a family of tools that provides secure tunnelling capabilities by encrypting
    all traffic and includes several authentication methods, and supports all SSH
    protocols. www.openssh.org


    # Clonezilla


    This is a cloning solution that''s distributed as a live CD and is popular for
    doing bare metal backup and restoration of individual PCs. It can also deploy
    an image to multiple computers in a lab. Clonezilla can work with a large number
    of popular disks, partitions and filesystem types. www.clonezilla.org


    # VLC


    Distros ship with a functional video player. But if you need more control, there''s
    no beating VLC. It supports virtually every video and audio format out there and
    includes handy CLI tools for advanced users. www.videolan.org/vlc


    # PeaZip


    PeaZip is a graphical archiving tool that can work with over 130 different types
    of archive files and can even create encrypted ones. It integrates with popular
    desktops and also has a CLI for advanced users. http://bit.ly/PeaZipSF


    # Gparted


    Use Gparted to restructure a disk on your computer. It''s available as a live
    CD and can also be installed inside your distro. Gparted can create, resize, move,
    delete, reformat or check partitions and supports many filesystems. www.gparted.org


    # ZuluCrypt


    Create an encrypted disk within a non-system partition or USB disk. ZuluCrypt
    has an intuitive user interface and can be used to encrypt individual files with
    GPG. http://bit.ly/zuluCrypt


    # HomeBank


    This is a feature-rich finance app. It can import data from other apps and bank
    statements in popular formats. It can also detect duplicate transactions and features
    dynamic reports and is easy to use for budgeting. http://homebank.free.fr'
