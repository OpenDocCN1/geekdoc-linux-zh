  md: '# Genus Red Hat


    Millinery on a massive scale.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_76_0.png)


    Another distribution that has played a crucial role in shaping Linux’s DNA is
    Red Hat Linux, which was created in 1994 by Marc Ewing. Bob Young and his ACC
    Corporation bought Ewing’s business and created Red Hat Software. The company
    went public in 1999 and achieved the eighth-biggest first-day gain in the history
    of Wall Street. It rode on the success of Red Hat Linux to become the first open
    source billion dollar company.


    Over the years, some of the biggest and brightest Linux developers have worked
    with Red Hat. Soon after it went public, it acquired Michael Tiemann’s Cygnus
    Solutions which had authored the GNU C++ Compiler and worked on the GNU C Compiler
    and the GNU Debugger.


    One of Red Hat’s most influential pieces of technology is its RPM packaging format.
    The file format is now the baseline package format of the Linux Standard Base
    (LSB). which aims to standardise the software system structure, including the
    filesystem hierarchy used in the Linux operating system. The LSB is a joint project
    by several Linux distros managed by the Linux Foundation. Red Hat was also one
    of the first Linux distros to support Executable and Linkable Format (ELF) instead
    of the older a.out format. ELF is the standard file format for executables, shared
    libraries and other files. Red Hat was also the first distro to attempt to unify
    the look of its Gnome and KDE desktop with the Bluecurve theme – which caused
    tension with the KDE developers. The distro has won laurels for its easily navigable
    graphical Anaconda installer.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_76_1.png)


    When Red Hat Linux was discontinued, the company handed over development of the
    free distro to the community. The new project was called Fedora (see p36). The
    company steers the direction of the Fedora project and does so in order to use
    Fedora to incubate technologies that will eventually show up in RHEL.


    Since the GPL prohibits it from restricting redistribution of RHEL, the company
    uses strict trademark rules to govern the redistribution. This has led to popular
    third-party derivatives that are built and redistributed after stripping away
    non-free components like Red Hat’s trademarks. Distros such as CentOS, Scientific
    Linux and Oracle Linux offer 100% binary compatibility with RHEL.


    Red Hat has served as the starting point for several other distros, such as Mandriva
    Linux.


    # Life after death


    Initially, the Red Hat distro was offered as a free download and the company sustained
    itself by selling support packages. In 2003, however, Red Hat discontinued the
    Red Hat Linux distro and it now focuses solely on the Red Hat Enterprise Linux
    (RHEL) distro for enterprise environments. RHEL supports popular server architectures
    including x86, x86-64, Itanium, PowerPC and IBM System z. The lifecycle of newer
    RHEL releases spans 13 years, during which time the users get technical support,
    software updates, security updates and drivers for new hardware. Red Hat also
    has a very popular training and certification program called RHCP that’s centred
    around RHEL.


    > “Some of the biggest and brightest Linux developers have worked with Red Hat.”


    Red Hat has pioneered the professional open source business model, successfully
    mixing open source code and community development together with professional quality
    assurance, and a subscription-based support structure. The company also has employees
    working full-time on free and open source projects, such as Radeon, Nouveau and
    CentOS.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_76_2.png)


    # CentOS


    The CentOS distro has been the premier community-supported enterprise distro based
    on Red Hat Enterprise Linux (RHEL). The distro is built using the open source
    SRPMS from the RHEL distro. CentOS is one of the most popular server distros,
    suitable for all kinds of use cases, from web servers to enterprise desktops,
    and has been able to pitch itself as an


    ideal choice for anyone who wants to put together their own server but can’t afford
    the RHEL subscription fees. CentOS ships with RHEL’s Anaconda installer and can
    run unattended installations across multiple machines thanks to Kickstarter. The
    installer provides various installation targets such as a web server, database
    server etc.


    In January 2014, Red Hat announced that it would start to sponsor a bunch of core
    CentOS developers to work on the distro full-time. However, the developers and
    Red Hat have both insisted that the project remain independent of RHEL. The sponsorship
    ensures that all updates will be provided within 24 to 48 hours of upstream releases
    in RHEL.'
  merge: -1
  img_proc: true
