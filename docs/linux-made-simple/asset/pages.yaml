- pgno: 33
  md: '# Handling UEFI & Ubuntu


    Get your system configured correctly, even Windows 8 systems.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_33_0.png)


    Modern PCs, particularly those with Windows 8 pre-installed, have replaced the
    traditional BIOS with a new system called UEFI. Both perform the same job, detecting
    and initialising your hardware before handing it over to your OS, but UEFI represents
    a quantum leap forward from the somewhat primitive capabilities of the traditional
    BIOS. The UEFI offers a much wider range of features than that found in the BIOS,
    all wrapped up in a much more user-friendly, graphically pleasing interface.


    There are, however, potential issues to circumvent. First, because UEFI is a newer
    standard, it’s not compatible with legacy hardware. This problem is circumvented
    by a special Compatibility Support Module (CSM), which enables you to emulate
    the BIOS to run older hardware and OSes.


    More controversially, UEFI also ship with a Secure Boot mode, which, while making
    PCs less susceptible to malware, were used to lock them to Windows 8. Again, this
    feature can – in most cases – be disabled, but the good news is that Ubuntu 14.04
    LTS fully supports newer hardware and Secure Boot, so you won’t need to disable
    either to install it alongside


    > > “Because UEFI is a newer standard, it’s not compatible with legacy hardware”


    Windows. One UEFI feature you’ll need to disable, however, is FastBoot (also called
    QuickBoot or FastStartup).


    # Tweak the UEFI


    Accessing the UEFI is the same as entering the BIOS setup. Switch on your PC,
    then tap the key prompted to enter setup when it appears on-screen (typically
    [F2] or [Del]). Verify that FastBoot has been disabled by looking for a section
    called Windows 8 Configuration, or – if it’s not present – Boot. Once located,
    make sure it’s switched off or disabled.


    You may need to tweak the CSM and Secure Boot settings if you intend backing up
    your system using SystemRescueCD on the cover disc. Again, look in the Windows
    8 Configuration, if it exists, for Secure Boot, which may be listed as Windows
    8


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_33_1.png)


    Make sure your FastBoot settings are disabled before attempting to install Ubuntu.


    Logo Requirement. Either way, disable it if you have problems booting SystemRescueCD.
    If the section isn’t present, look under Security instead.


    The CSM module may be part of the Windows 8 Logo Requirement screen, or it’ll
    be hidden away on its own (we found it buried away at the bottom of the Boot menu
    on our ASRock motherboard, for instance). Click this to reveal a selection of
    different options covering different hardware – look for references to PXE (pre-boot
    environment), GOP (graphics) and Storage (or SATA), as well as USB and PS2, if
    applicable. This enables you to selectively switch CSM on and off for specific
    devices as required.


    Some motherboards – including our ASRock – enable you to run both modes as required.
    (In the case of ASRock, we set each one to ‘Do not launch’ to make this setting
    the norm.) If there’s no apparent options for editing the Secure Boot or CSM settings,
    contact your PC manufacturer to verify whether or not these can be disabled. In
    most cases, PCs built using off-the-shelf motherboards should have the required
    options intact, but some manufacturers have been known to provide hobbled boards.


    Upgrading a PC’s graphics card often requires enabling CSM support, so even if
    the controls aren’t already supported, the manufacturer may have relented under


    # Choose the right boot option


    Many modern PCs now give you the option of booting either in UEFI or legacy BIOS
    mode, with the latter mode enabling you to install older operating systems. Ubuntu
    works fine with both UEFI and Legacy modes, but other environments – including
    SystemRescueCD – require booting from a legacy option. Some PCs even support mixed-mode
    booting, presenting both legacy and UEFI choices direct from the boot menu, so
    you don’t


    need to wade into the UEFI shell to switch between them. If you’ve wondered why
    some boot options are displayed twice in the boot menu, this is why: look more
    closely and you’ll see one option is prefixed by UEFI. This gives you the option
    of choosing which mode to boot that drive in, which is a good way of testing whether
    or not a certain OS or bootable disc works with UEFI or not. If you’re only offered
    a single set of boot options, your UEFI shell will


    only allow you to boot in either UEFI mode or legacy. The latter requires that
    CSM is enabled, but once done you should be able to change boot settings – including
    device priority – from within the Boot section of the UEFI shell. If your PC does
    support mixed-mode booting, you may need to set a different default boot device,
    in which case take care to select the right mode when choosing which device (typically
    optical drive or boot hard drive) to make the default.'
