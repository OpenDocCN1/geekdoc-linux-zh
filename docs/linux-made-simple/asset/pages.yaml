- pgno: 84
  md: '# Desktop completeness


    What can you actually do with this distro?


    The main reasons why many people interested in Linux never try a ''low-resource''
    distro are probably lack of need, support and apps. For somebody who just got
    a high-end computer, it would be easy to not care. Newcomers to Linux also often
    stay clear of ''niche'' distros because, understandably, they want to remain where
    there are more tutorials and fellow users. We discuss that issue overleaf. Here,
    let''s test that ''lack of apps'' complaint.


    The bottom line is that, for the distros here, there is no ''lack of apps'' and
    your real limit is going to be the hardware. No choice of software will let you
    edit high-definition video, or process spreadsheets with thousands of rows, in
    (say) 128MB of RAM.


    As far as traditional SOHO tasks go, you''ll find apps to do almost everything
    you want with any of these desktops, sometimes the same tools available on more
    famous Linux desktops. If an app is missing, no problem – you should still be
    able to install it from predefined archives with a few clicks or keystrokes.


    The default dock in Elive is pretty impressive; the tested version is still at
    LibreOffice 3, but it''s accompanied by Clementine, Skype, Scribus, Chromium,
    Blender, Inkscape, RawTherapee, Gimp and VLC. And that''s just what you find in
    plain view in the dock.


    Puppy is also impressive, but in a very different way. Some versions come with
    SeaMonkey as browser, email client and RSS reader. In Slacko Puppy we found Firefox
    and the Sylpheed email client.


    Besides that, the Slacko menu is built, it seems, in the good old Unix tradition,
    with so many – often little-known – small tools that we lost count, often with
    a vintage look and interface, each specialising in one activity. Combining them,
    you can do pretty much whatever you want, if you take the time to learn. The default
    word processor is AbiWord, but adding OpenOffice 3.1 is easy.


    Absolute, Crunchbang and Manjaro are broadly in the middle ground between these
    two extremes, each in its own way. In Absolute you''ll find several


    specialised development applications (HtmlPage, Qt Designer and a hex editor)
    and can get Libre Office 4.1.4. The Internet apps menu includes Filezilla and
    a YouTube viewer. Crunchbang comes with the IceWeasel browser, which works fine,
    even if it is a little stuttery at times. The Multimedia choices are limited to
    volume control, VLC and Xfburn for DVD mastering. Manjaro, which contains Libre
    Office 4.1.5, is in a similar situation – Alsa mixer and little else. Apart from
    this, it is the only distro here that couldn''t play YouTube videos out of the
    box.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_84_0.png)


    > > The Elive system menu is simple, but between that and the dock, there really
    is everything you need.


    **Verdict**

    Absolute ★★★★★

    Crunchbang ★★★★☆

    Elive ★★★★★

    Manjaro ★★★★☆

    Puppy ★★★☆☆

    > Elive has the fullest set of apps, but others can pretty much do it all too.


    # Installation


    Is it easy to get started with these systems?


    In general, the installation of these five distros, or their usage as live systems,
    should not present any particular problems, unless you put them on very new, more
    or less closed hardware, or on complex combinations of hard drives.


    The installer of Absolute Linux, for example, is text-only, and uses the LILO
    bootloader. If you didn''t know Linux existed in 1994, try Absolute to see what
    installing it looked like. Don''t worry, though – the look may be ugly, it''s
    all keyboard and no mouse, and it takes more time than you might like to read
    through some panels, but there is little real difficulty involved. The hardware
    detection works fine and you can safely accept the default settings and answers
    to each question that you don''t understand immediately.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_84_1.png)


    > > Absolute Linux''s installer makes you ask what year it is but isn''t hard
    to use.


    The most friendly installers (or boot managers, for live versions) are the graphical
    ones of Manjaro and, above all, Elive. The former, called Thus, is maybe the one
    that looks most like Ubuntu. It may also encrypt partitions. The latter has a
    very polished language and keyboard selector, plus interesting options (see ''Choices''
    on page 93).


    The Slacko Puppy boot manager doesn''t put any special effort into eye candy,
    but works without problems. Besides, most of the actual system configuration is
    delegated, after login, to a friendly set-up wizard. That is where you must set
    country encoding, time, keyboard, network settings, graphics stuff and other parameters.
    And it even barks in approval when you''re done.


    **Verdict**

    Absolute ★★★☆☆

    Crunchbang ★★★★☆

    Elive ★★★★★

    Manjaro ★★★★☆

    Puppy ★★★☆☆

    > Absolute''s installer is basic but Elive''s is the one that''ll make novices
    happy.


    Software | Low-resource distros'
  merge: -1
