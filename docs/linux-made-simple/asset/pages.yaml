- pgno: 75
  md: '# Genus Ubuntu


    Derivatives, they’re coming outta the walls.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_75_0.png)


    Ubuntu is, in many respects, the first distro to make a serious effort to bring
    in new users. The distro brought Linux into the mainstream, played a significant
    part in changing the notion and misconceptions about Linux and was able to successfully
    pitch itself as a viable OS alternative to Windows and Mac OS.


    Ubuntu was started by Mark Shuttleworth. He formed Canonical after selling his
    security firm, Thawte, to VeriSign. Shuttleworth was a huge fan of the Debian
    project. However, there were many things about Debian that didn’t fit in with
    Shuttleworth’s vision of an ideal OS. He therefore invited a dozen or so Debian
    developers he knew and respected to his flat in London in April 2004 and hashed
    out the groundwork for the Ubuntu project.


    The group decided on a bunch of characteristics for the distro. For one, Ubuntu’s
    packages would be based on those from Debian’s unstable branch. However, unlike
    Debian, Ubuntu was to have a predictable cycle with frequent releases. To put
    the plan into action, it was decided that Ubuntu would release updated versions
    every six months and each release would receive free support for nine months.
    The plan was refined in later years and now every fourth release receives long-term
    support (LTS) for five years.


    The group also decided to give emphasis to localisation and accessibility in order
    to appeal to users across the world. There was also a consensus on concentrating
    development


    A number of vendors, such as Dell and Lenovo, offer computers pre-installed with
    Ubuntu.


    efforts on ease of use and user-friendliness of the distro on the desktop. The
    first release of Ubuntu was in October 2004.


    Ubuntu’s development is funded by Shuttleworth’s UK-based Canonical, which is
    a privately held computer software company. The company also supports development
    of other Ubuntu-related projects, for instance, Ubuntu’s Ubiquity installer is
    one of the best tools for the job, and one of its distinguishing features is that
    it gives users the option to install closed source or patented third-party software,
    such as Fluendo’s MP3 codec. Other useful user-centric projects that have tried
    to change the status quo are the Ubuntu Software Center and the recently discontinued
    Ubuntu One cloud hosting service.


    # Test by fire


    But perhaps no other piece of technology has polarised the Linux community like
    Ubuntu’s Unity desktop interface. The distro first introduced Unity with the Ubuntu
    Netbook Edition version 10.10. By the time 11.04 rolled off the press, the Netbook
    Edition had merged into the desktop edition and Unity became the default graphical
    interface for the Ubuntu distro. However, Shuttleworth has insisted that the Unity
    desktop plays a crucial role in Ubuntu’s multi-device strategy. Unity will help
    standardise the display on smartphones, tablets, TV and other devices beyond the
    computer.


    Thanks to its malleable nature, the distro has always been very popular with developers
    who want to create a custom distro for their particular niche. Ubuntu has perhaps
    seeded more distros than any other, and Ubuntu itself has several officially-supported
    spins: Kubuntu, Xubuntu, Ubuntu Gnome, Edubuntu and Ubuntu Studio. In addition
    to the main desktop edition, there’s also a server edition that doesn’t ship with
    a graphical desktop.


    Ubuntu has helped give Linux mainstream coverage and has several celebrity users,
    including Cory Doctorow and Stephen Fry. However, pushing the envelope has its
    drawbacks and the award-winning distro has had its fair share of brickbats. It’s
    still reeling under the Amazon controversy that arose when the distro included
    search results from the shopping giant in Unity’s Dash whenever users searched
    for stuff on their computer.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_75_1.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_75_2.png)


    # Trisquel GNU/Linux


    Trisquel GNU/Linux goes to great lengths to do justice to its free software tag.
    Not only does the distro not include any proprietary software, it also strips
    out all non-free code from the components it inherits from Ubuntu, such as the
    kernel. Instead of the stock Ubuntu kernel, Trisquel uses the Linux-libre kernel
    that doesn’t include any binary blobs. Thanks to its


    efforts, the distro has been endorsed by the Free Software Foundation. There are
    several variants of the distro, the most common ones are the standard Trisquel
    release, which is available as a 700MB image with the Gnome desktop, and Trisquel
    mini, which is designed for older hardware and low-power systems, and uses LXDE,
    the lightweight desktop.


    While the distro doesn’t ship with any proprietary codecs, you can watch YouTube
    videos as it provides HTML5 support as well as Gnash, which is the free alternative
    to Adobe Flash. Trisquel includes all the usual desktop productivity apps, such
    as LibreOffice, Evolution, Gwibber, Pidgin and more. These are complemented by
    an impressive software repository.'
  merge: -1
