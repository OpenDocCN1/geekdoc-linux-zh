- pgno: 14
  md: 'notice any difference. There are also moves to replace the traditional SysVinit
    system, which has been around for many years. Ubuntu introduced Upstart, while
    Red Hat and Fedora are championing systemd.


    While they all do the same basic job – start the tasks that need to be started
    to get the OS running – the methods differ. The main difference is that SysVinit
    is sequential – each service must be started before the next is tackled; one slow
    starting service affects everything else. Upstart and systemd start services in
    parallel, avoiding such bottlenecks. Of course, there are those who argue that
    Linux is so stable that boot times are irrelevant – if you hibernate instead of
    shutting the machine down, reboots become rare.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_14_0.png)


    Grub is the most popular bootloader. Live CDs and USB sticks are more likely to
    use isolinux or syslinux.


    # Libraries


    The logic behind sharing functions between programs.


    Linux uses libraries to share code between applications. If a program, foo, uses
    functions that could be useful elsewhere, it places them in libfoo. Then when
    another program, such as the imaginatively named bar, wants to use the same function,
    it has only to link to libfoo rather than reinventing the wheel.


    This means that there is only one copy of the code on your computer; if either
    project discovers a bug in the code, it will be fixed for both. It also introduces
    the concept of dependencies; both foo and bar depend on libfoo and are useless
    without it. This led to the phenomenon of ''dependency hell'', where trying to
    install a program errored out with a list of unsatisfied dependencies, and trying
    to install those gave more dependencies. This is largely an unpleasant memory
    nowadays, as distro repositories became more comprehensive and package managers
    better at sorting things out.


    If you stick with your distro''s package manager and repositories, all dependencies
    should be taken care of without you even having to think about them. Try installing
    somerandom.deb or somerandom.rpm you downloaded from www.somerandomsite.com and
    you''ll soon discover


    why you should let the package manager take care of things. One solution proposed
    to this is that all programs should be compiled statically. This means that instead
    of dynamically linking to the code in libfoo and loading when needed at run time,
    foo and bar each include the code in their executable programs. This means each
    program file is a standalone object with no dependencies; it can also make it
    a lot larger than it would be with dynamic linking and means that if a bug or
    security flaw is found in the libfoo code, both foo and bar will need to be recompiled
    and repackaged for your distro to fix the situation. Generally, dynamic linking
    is preferred on non-embedded devices, but there is one place where statically
    linked programs are useful: in an initramfs loaded at boot time, because it avoids
    the


    > "You can see which libraries a program is linked to with ldd"


    ```

    ldd /usr/bin/someprogram

    ```


    need to include libraries in the ramdisk image. If you are curious, you can see
    which libraries any program is linked to with the ldd command.


    shows all the libraries that program needs, and the libraries they need and so
    on, until you almost always end up at libc – the granddaddy of Linux libraries.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_14_1.png)


    Shared libraries enable a more efficient system, by sharing code between applications.
    Here are just some of the libraries the K3b disc burner links to.


    # Package managers


    The great flexibility of Linux distributions means that most elements can be changed.
    Default applications, desktops, even kernels can be swapped around, so it''s best
    to think of a Linux distribution such as Fedora or Ubuntu as merely a starting
    point for any customisation that you want to do.


    The one thing that can''t be changed so easily is the package manager, so the
    only way to try a different package manager is to try a different distro. Try
    comparing SUSE''s YaST with Debian''s Synaptic, for example, and you''ll be amazed
    at the difference that such a fundamental tool can make to your experience of
    using Linux.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_14_2.png)'
