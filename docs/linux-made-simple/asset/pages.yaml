    powering it in terms of raw power and physical connectors it can offer. Memory
    is also important, you want plenty of it and the fastest available. Disk storage
    space is less important than speed, so an SSD is the preferred choice for storage.
    Gamers always want more performance and one of the ways of getting it is by overclocking
    their systems. This is where you run your processor and memory at higher than
    its rated speed. For general purpose use, opinions on


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_52_1.png)


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_52_2.png)


    # 5 Connectors


    Fit the power supply and connect the power and CPU cables to the motherboard.
    This is a good time to connect all fan cables. Add your hard drives or SSDs and
    your optical drive. They may either screw to the case or in some cases they have
    screwless fittings. Connect the SATA cables from the drives to the motherboard.
    Connect their power cables for the PSU.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_52_3.png)


    # 6 Case LEDs


    Connect the cables from the case switches and LEDs to the motherboard. These are
    fiddly connectors but make sure you get them right, the motherboard manual will
    tell you what goes where. Some of the cables come with a block connector to make
    the job easier. This is also the time to connect the case’s USB ports to the relevant
    points on the motherboard.'
