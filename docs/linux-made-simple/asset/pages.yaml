    that won''t eat up all your memory.


    We''ve covered a few lightweight Linux distros (see page 84), but the plethora
    of pint-sized applications out there deserves attention, too. For the vast majority
    of all your other Linuxing, there are some small yet perfectly formed programs
    that do everything you need, and do so without pulling in a truckload of dependencies
    and eating all your memory.


    If you''re really serious about resource usage, you should consider using console
    applications. This can be daunting at first, but once you learn


