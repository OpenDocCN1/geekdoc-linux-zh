- pgno: 25
  md: '# Install and manage apps


    Fleshing out your chosen distribution.


    Unlike Windows, a typical Linux desktop distribution is more ready-to-use right
    out of the box. Instead of shipping with basic apps, such as a vanilla text editor
    or a barebones drawing tool, your average Linux distro will include a fully fledged
    office suite and a comprehensive graphics editor. This is in addition to the basic
    set of apps for common tasks, such as browsing the Internet, checking email, instant
    messaging with your friends across various networks, organising photos, listening
    to music and watching videos.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_25_0.png)


    In addition to enabling repositories you can also select a different mirror for
    downloading software.


    That said, since we all use our computers differently, you''ll likely want a piece
    of software that isn''t included by default. Your distro has specialised tools
    that''ll help you install gazillions of quality open source software without clicking
    through complex setup wizards.


    Linux distros use a collection of software tools, both graphical and command-line
    based, that are together referred to as a package management system. These tools
    help you install, remove, and upgrade software (also called packages) with ease.
    Individual pieces of software are grouped inside packages. In addition to the
    software itself, packages also include other information, such as a list of other
    packages or dependencies which are required for the app to function properly.
    Furthermore, the package management system relies on a database known as the repository
    to keep track of all the available packages.


    management system. You can use the Software & Updates tool for manipulating Ubuntu''s
    repositories (or repos). The tool lists repos in four different tabs. By default,
    the four official repos under the Ubuntu Software tab are enabled. The Main repo
    includes officially supported software, and the Restricted repo includes software
    that isn''t available under a completely free license. The two interesting repos
    are Universe and Multiverse repos, which include software maintained by the community
    and software that isn''t free, respectively.


    # Package Management 101


    The Linux world is divided broadly into two different package formats – RPM and
    Deb. These are precompiled binary packages that are designed to simplify the installation
    process for desktop users. RPM was created by Red Hat Linux, and is used by distros
    such as Fedora, and Mageia while Deb is used on Debian-based systems, such as
    Ubuntu. Additionally, almost every major distro maintains its own set of graphical
    tools to enable desktop users to install, upgrade and remove app. You must also
    be familiar with the distro''s repository structure and how and where it houses
    software.


    Unlike Ubuntu the Fedora distro uses the RPM package management system. The distro
    houses repositories under the /etc/yum.repos.d directory and the main repository
    is named fedora.repo.


    Mageia uses the urpmi package which is a wrapper for the RPM package management
    system. The distro has three official repos. The core repository contains open
    source packages, the non-free repository contains closed-source apps, and the
    tainted repository has packages that might infringe on patents and copyright laws
    in some countries.


    Each of these repos is further divided into four sub-repos. The release repo includes
    stable packages, the updates repo includes packages that have been updated since
    the release,


    Ubuntu uses the Advanced Packaging Tool or APT package


    # A backup primer


    Your distribution will include a tool to help you backup your data and you should
    take some time out to get familiar with it. Ubuntu, for instance, ships with the
    Deja Dup backup app which is designed for new users. You can also install it on
    top of Fedora and Mageia. No matter what backup tool you use, you should take
    a moment to consider what you should backup and where. Backing up the entire home
    directory might be convenient but is usually just an overkill. Instead you should
    just include the directories under your home directory such as Downloads and Documents.


    Also check with important app, such as email clients, who keep downloaded emails,
    attachments and address books under hidden directories (prefixed with a ./) beneath
    the home folder. Also, keeping the backed up data on another partition of the
    same disk isn''t going to be of much use, since the whole disk might fail and
    render the backup copy useless. One solution is to keep the backup on another
    separate disk or external drive. Or, if you have good Internet bandwidth, the
    backup app might also help you store the backups on a cloud storage service.


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_25_1.png)


    Déjà Dup has a simple interface that shouldn''t intimidate even first time users.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'and the backports repo contains packages of new versions backported from the
    Cauldron repository, which will eventually become the stable repo for the next
    release. There''s also the testing repo which will contain software primary for
    QA purposes.


    To configure repos, launch the Mageia Control Center and head to Software management
    > Configure media sources for install and update. To install the official online
    repositories, click on Add and then either on Update sources only or Full set
    of sources. The first choice is the minimum to keep the distro updated, while
    the second allows you to install new software. These options will populate the
    window with a list of repos. Then toggle the Enabled checkbox next to the repo
    you want to fetch software from.


    # FedEx packages


    All major desktop distros include a graphical tool for managing packages. Ubuntu''s
    Software Center is one of the best tools for the job. You can find software by
    clicking on the category reflecting the type of software that you''re looking
    for. When you select a category, you will be shown a list of apps. There''s also
    a search box in the upper-right corner of the window which will look for software
    matching any entered keywords. Once you''ve found the software you want, click
    the Install button to its right. This will fetch the software as well as any required
    dependencies and automatically install it. All newly installed software is added
    to the Launcher and you can also find it from under the Dash.


    Fedora uses the PackageKit graphical tool that''s listed as Software in the Gnome''s
    Activities menu. It too lists software categories as well as a keyword-matching
    search box at the top to help you find software. Once you''ve found the software
    that you''re looking for, click on the Install button and the app will add it
    to your installation.


    The graphical package management tool for Mageia is named DraKrpm. The tool isn''t
    as pretty as the software centres in Ubuntu and Fedora, but is very functional
    and intuitive enough to get the job done. You can filter its list of available
    apps to show only packages with GUI, security updates, bug fix updates, and more.
    Applications groups are listed in the sidebar and there''s also a search box to
    hunt for packages based on keywords. When you find a package you wish to install,
    simply toggle its corresponding checkbox and click on Apply.


    # The Repo men


    The larger open source community offers a lot more packages than the ones listed
    in your distro''s official repos


    ![](img/57f4a2d286909b0a84c8ecfefbbe15f2_26_0.png)


    and almost every distro has a mechanism to add and install software from these
    third-party repos.


    External repos in Ubuntu are known as a Personal Package Archive or PPA. You can
    add a PPA repo to your distro using the Software & Updates tool. But first you
    need the address of the PPA. This is listed on the PPA''s Launchpad site and will
    be something like ppa:example-ppa/example. Now fire up the tool and switch to
    the Other Software tab. Then click on the Add button and paste the address of
    the PPA in the window that opens. Ubuntu will then ask you to refresh the repos
    to enable the PPA.


    Most desktop distros have an easy to use graphical package manager.


    > “Unlike Windows, a typical Linux desktop distro is ready-to-use right out of
    the box.”


    Similarly, Mageia has a number of third-party repos as well and you''ll need their
    URL to add them to your distro. Once you have the URL, fire up the Mageia Control
    Center and head to Software management > Configure media sources for install and
    update and click on the Add a medium option. Enter the address of the repo in
    the window that pops up along with its type such as HTTP or FTP.


    Fedora also has a number of third-party software repos but the most popular is
    RPMFusion. The repo is further subdivided into two independent repos that house
    free and non-free software. You can install both of these repos from within the
    browser itself by following the instructions on the repos website (www.rpmfusion.org/configuration).


    # Grabbing Google


    All popular Google software, such as Chrome, Earth, the audio and video plugin
    for Hangouts and others can be installed on Linux. But you won''t find them in
    the official repos of major distros because of their licensing. However, you now
    have all the know-how to install them with ease if we point you in the right direction.
    The downloads page of each supported Google app contains links to both 32-bit
    and 64-bit versions of the software in both RPM and Deb formats. Download the
    package for your particular distro and double-click on the file to install it
    with the distro''s package manager. All official packages for Google apps will
    also install the appropriate external Google repository in your distribution to
    keep the software updated. Another popular proprietary software that you may want
    to install is Skype. Ubuntu users can simply enable Partner Repositories by visiting
    Software & Updates > Other Software. This will add the official Skype repos and
    you can then install the software from the Software Center as for any other software
    package. Mageia, on the other hand, includes the Skype package in its non-free
    repo. If you''ve enabled this repo, then simply search for the get-skype package
    which will download Skype from its website. You can also head to the Linux download
    page on Skype''s website and choose your distro and architecture from the pull-down
    list which will download either a Deb file or an RPM file. Double-click on the
    file to install it with the distro''s package manager.'
