  gedit filename.txt\n```\n\n### gedit 插件\n\ngedit 支持许多插件，可以扩展编辑器的功能。你可以通过“插件”（Plugins）菜单来启用或禁用它们。一些常用的插件包括：\n\
  \n*   **拼写检查 (Spell Checker)**：在输入时检查拼写错误。\n*   **代码片段 (Code Snippets)**：快速插入常用的代码模板。\n\
  *   **终端 (Terminal)**：在编辑器中嵌入一个终端窗口。\n\n通过这些插件，你可以将 gedit 变成一个更适合你的强大工具。\n\n\n\n\
  \n\n在这里你可以自定义 `gedit` 编辑器的操作。`Preferences`偏好）对话框包含五个标签区域，用于设置编辑器的功能和行为。\n\n## 视图\n\
  \n`View”（视图）标签页提供了 `gedit` 在编辑器窗口中显示文本的选项：\n\n*   文本换行：决定如何处理编辑器中的长文本行。`启用（Enabling）`\
  \ 选项会将长行折叠到编辑器的下一行。`不跨两行拆分单词（Do Not Split Words Over Two Lines）` 防止在长单词中自动插入连字符，以防止它们被分割在两行之间。\n\
  *   行号：在编辑器窗口的左边距中显示行号。\n*   当前行：高亮光标当前所在的行，方便你轻松找到光标位置。\n*   右边距：启用右边距并允许你设置编辑器窗口中应有的列数。默认值为\
  \ 80 列。\n*   括号匹配：启用后，它会高亮编程代码中的括号对，允许你轻松匹配 `if-then` 语句、`for` 和 `while` 循环以及其他使用括号的编码元素中的括号。\n\
  \n行号计数和括号匹配功能为程序员提供了一个环境，这种环境在普通的文本编辑器中并不常见。\n\n## 编辑器 \n\n`Editor”（编辑器）标签页提供了 `gedit`\
  \ 编辑器处理制表符和缩进的选项，以及文件保存的方式：\n\n*   制表符停止：设置按下 `Tab` 键时跳过的空格数。默认值为八个。此功能还包含一个复选框，勾选后插入空格而不是制表符跳转。\n\
  *   自动缩进：启用后，使 `gedit` 自动对文本中的段落和代码元素（如 `if-then` 语句和循环）进行行缩进。\n*   文件保存：提供了两种保存文件的功能：在编辑窗口中打开文件时是否创建文件的备份副本，以及是否在预设间隔内自动保存文件。\n\
  \n自动保存功能是确保你的更改定期保存的好方法，可以防止因崩溃或断电导致的灾难性后果。\n\n## 字体与颜色\n\n`Font & Colors”（字体与颜色）标签页允许你配置（意不意外地）两个项目：\n\
  \n*   字体：允许你选择 `Monospace 10` 作为默认字体，或者从对话框中选择自定义的字体和字体大小。\n*   颜色方案：允许你选择用于文本、背景、选定文本和选择颜色的默认颜色方案，或为每个类别选择自定义颜色。\n\
  \n`gedit` 的默认颜色通常与桌面上选择的标准 GNOME 桌面主题匹配。这些颜色将发生变化以匹配你为桌面选择的方案。\n\n## 插件\n\n`Plugins”（插件）标签页提供了对\
  \ `gedit` 中使用的插件的控制。插件是独立的程序，可以与 `gedit` 接口以提供额外功能。`Plugins`标签页见图 9.14。\n\n图 9.14\
  \ `gedit` 插件偏好标签页\n\n![9.14](img/c09f014.jpg)\n\n`gedit` 有多个可用插件，但并非所有插件都默认安装。表\
  \ 9.4 描述了目前 `gedit` 中可用的插件。\n\n表 9.4 `gedit` 插件\n\n| 插件 |  |\n| :--- | :--- |\n\
  | 更改大小 (Change Case) | 更改所选文本的大小 |\n| 文档统计 (Document Statistics) | 报告单词、行、字符和非空格字符的数量\
  \ |\n| 外部工具 (External Tools) | 在编辑器中提供 shell 环境以执行命令和脚本 |\n| 文件浏览器面板 (File Browser\
