  \ 18 14:39:00 EDT 2010\nThis is the end of the script\n```\n\n任何发往 `STDOUT` 或 `STDERR`\
  \ 的输出都会通过邮件系统发送给用户。\n\n（省略）\n\n## 调度定期脚本\n\n使用 `at` 命令在预设时间调度脚本是极佳的，但如果你需要该脚本每天、每周或每月运行一次呢？与其不断提交\
  \ `at` 作业，你可以使用系统的另一个功能。\n\nLinux 系统使用 `cron` 程序允许你调度需要定期运行的作业。`cron` 程序在后台运行，并检查特殊的表（称为\
  \ `cron` 表）查找调度的任务。\n\n### cron 表\n\n`cron` 表使用特殊的格式允许你指定何时运行作业。`cron` 表的格式为：\n\n\
  ```\nmin hour dayofmonth month dayofweek command\n```\n\n`cron` 表允许将条目指定为特定值、范围（例如\
  \ `1–5`）或通配符（星号）。例如，如果你想在每天 10:15 运行命令，你将使用以下 `cron` 表项：\n\n```\n15 10 * * * command\n\
  ```\n\n在 `dayofmonth`、`month` 和 `dayofweek` 字段中使用通配符表示 `cron` 将在每天的 10:15 执行命令。要指定在每周一下午\
  \ 4:15 运行命令，你将使用：\n\n```\n15 16 * * 1 command\n```\n\n你可以将 `dayofweek` 条目指定为三字符文本值（mon,\
  \ tue, wed, thu, fri, sat, sun）或数值值，其中 0 代表周日，6 代表周六。\n\n\n\n\n\n这是另一个示例：要在每个月的第一天中午\
  \ 12 点执行命令，你将使用以下格式：\n\n```\n00 12 1 * * command\n```\n\n`dayofmonth` 条目指定该月的日期值（1–31）。\n\
  \n### 注意事项\n\n敏锐的读者可能会想知道，你如何能够设置命令在每个月的最后一天执行，因为你无法将 `dayofmonth` 值设置为覆盖每个月。这个问题一直困扰着\
  \ Linux 和 Unix 程序员，并催生了许多不同的解决方案。一种常见的方法是添加一个 `if-then` 语句，使用 `date` 命令检查明天的日期是否为\
  \ 01：\n\n```\n00 12 * * * if ['date +d -d tomorrow' = 01] ; then ; command\n```\n\
  \n这将在每天中午 12 点检查今天是否为该月的最后一天，如果是，cron 将运行该命令。\n\n命令列表必须指定要运行的命令或 shell 脚本的完整路径。你可以像普通命令行一样，添加任何喜欢的命令行参数或重定向符号：\n\
  \n```\n15 10 * * * /home/rich/test4 > test4out\n```\n\ncron 程序使用提交作业的用户账户运行脚本。因此，你必须拥有相应的权限来访问命令列表中指定的命令和输出文件。\n\
  \n### 构建 cron 表\n\n每个系统用户都可以有自己的自己的 cron 表（包括 root 用户）来运行调度作业。Linux 提供了 `crontab`\
  \ 命令来处理 cron 表。要列出现有的 cron 表，请使用 `-l` 参数：\n\n```\n$ crontab -l\n```\n\n```\nno crontab\
  \ for rich\n$\n```\n\n默认情况下，每个用户的 cron 表文件不存在。要向你的 cron 表中添加条目，请使用 `-e` 参数。当你这样做时，`crontab`\
  \ 命令会启动文本编辑器（见第 9 章）并打开现有的 cron 表（如果尚不存在则打开空文件）。\n\n### cron 目录\n\n当你创建一个对执行时间要求没有那么精确的脚本时，使用预配置的\
  \ cron 脚本目录之一更容易。有四个基本目录：每 (hourly)、每日 (daily)、每月 (monthly) 和每周 (weekly)。\n\n```\n\
  $ ls /etc/cron.*ly\n```\n\n`/etc/cron.daily`:\n\n```\nanacron      aptitude    \
  \           exim4-base           man-db               sysstat\napt         bsdmainutils\
  \      logrotate               popularity-contest\napport      dpkg            \
  \     mlocate             standard \n```\n\n`/etc/cron.hourly`:\n\n`/etc/cron.monthly`:\n\
  \n```\nanacron\n```\n\n`/etc/cron.weekly`:\n\n```\nanacron  apt-xapian-index  man-db\n\
  ```\n\n因此，如果你有一个每天运行一次的脚本，只需将脚本复制到 daily 目录，cron 每天都会执行它。\n\n### anacron 程序\n\n\
  cron 程序唯一的问题是，它假设你的 Linux 系统每天 24 小时、每周 7 天都在运行。除非你在服务器环境中运行 Linux，否则这并不一定成立。\n\n\
  如果 Linux 系统在 crontab 调定的作业运行时处于关闭状态，该作业将不会运行。cron 程序不会在系统重新启动后追溯运行错过的作业。为了解决这个问题，许多\
  \ Linux 发行版还包含了 `anacron` 程序。\n\n如果 `anacron` 确定某个作业错过了预定的运行时间，它将尽快运行该作业。这意味着如果你的\
  \ Linux 系统关闭了几天，当它重新启动时，在关闭期间调度运行的所有作业都会自动运行。\n\n这是一个经常用于执行例行日志维护脚本的功能。如果系统在脚本应该运行时一直处于状态，日志文件将永远不会被修剪并可能增长到不可理想的大小。有了\
  \ `anacron`，你可以确保日志文件每次系统启动时至少会被修剪一次。\n\n`anacron` 程序仅处理位于 cron 目录中的程序，例如 `/etc/cron.monthly`。它使用时间戳来确定作业是否在适当的调度间隔内运行。每个\
  \ cron 目录都有一个时间戳文件，位于 `/var/spool/anacron`：\n\n```\n$ sudo cat /var/spool/anacron.monthly\n\
  20101123\n$\n```\n\n`anacron` 程序有它自己的表（通常位于 `/etc/anacrontab`）来检查作业目录：\n\n```\n\
  $ cat /etc/anacrontab\n# /etc/anacrontab: anacron 配置文件\n# 详情请参阅 anacron(8) 和 anacrontab(5)。\n\
  SHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\n\
  # 这些替换了 cron 的条目\n1 5 cron.daily nice run-parts --report /etc/cron.daily\n7 10 cron.weekly\
  \ nice run-parts --report /etc/cron.weekly\n@monthly 15 cron.monthly nice run-parts\
  \ --report /etc/cron.monthly\n$\n```\n\n`anacron` 表的基本格式与 cron 表略有不同：\n\n`period\
  \ delay identifier command`\n\n`period` 条目定义了作业运行的频率，以天为单位。`anacron` 程序使用此条目与作业的时间戳文件进行对比。`delay`\
  \ 条目指定了在系统启动多少分钟后 `anacron` 程序应该运行错过的脚本。`command` 条目包含 `run-parts` 程序和 cron 脚本目录名称。`run-parts`\
  \ 程序负责运行传递给它的目录中的任何脚本。\n\n注意，`anacron` 不运行位于 `/etc/cron.hourly` 中的脚本。这是因为 `anacron`\
  \ 程序不处理执行时间需求小于每天的脚本。\n\n`identifier` 条目是一个唯一的非空字符字符串——例如，`cron-weekly`。它用于在日志消息和错误电子邮件中唯一标识作业。\n\
  \n### 从开始启动\n\n启动 shell 脚本的最后方法是让你的脚本在 Linux 系统启动时或当用户启动新的 bash shell 会话时自动运行。在启动时启动脚本通常留给执行系统功能的特殊脚本，例如配置网络接口或启动服务器进程。然而，如果你是\
  \ Linux 系统管理员，你可能需要在每次 Linux 系统启动时执行某项功能，例如重置自定义环境。\n\n在用户每次启动新的 bash shell 运行时运行脚本的能力（即使只是用户启动\
  \ shell 时）也可能很有用。有时你想为 shell 会话设置 shell 特性，或只需确保某个文件已设置。\n\n本节介绍了如何配置你的 Linux 系统，以便在启动时或每次新\
  \ shell 启动时运行你的脚本。\n\n#### 在启动时启动脚本\n\n在让你的 shell 脚本在启动时运行之前，你需要了解一点启动过程是如何工作的。Linux\
  \ 使用特定的顺序来在启动时启动脚本，了解该过程可以帮助你的脚本按照你期望的方式运行。\n\n#### 启动过程\n\n打开 Linux 系统后，Linux 内核加载到内存并运行。它做的第一件事是启动\
  \ System V init 进程或 Upstart init 进程，取决于你的发行版及其版本。该进程随后负责启动 Linux 系统上的所有其他进程。\n\n\
  ##### System V init 进程\n\n作为启动过程的一部分，System V init 进程读取 `/etc/inittab` 文件。`inittab`\
  \ 文件列出了系统的运行级别（run level）。不同的 Linux 运行级别启动不同的程序和脚本表 15.3 列出了基于 Red Hat 的发行版的 Linux\
  \ 运行级别。\n\n| 运行级别 | 描述 |\n| :--- | :--- |\n| 0 | 停止 (Halt) |\n| 1 | 单用户模式 |\n| 2\
  \ | 多用户模式，通常不支持网络 |\n| 3 | 全功能多用户模式，带有网络 |\n| 4 | 用户定义 |\n| 5 | 多用户模式，带有网络和图形 X\
  \ Window 会话 |\n| 6 | 重启 (Reboot) |\n\n\n\n\n\nLinux 发行版通常使用表 15.3 列出的运行级别（run levels）来对系统启动的服务进行更细粒的控制。然而，基于\
  \ Debian 的发行版（如 Ubuntu 和 Linux Mint）并不区分运行级别 2 到 5 之间的，如表 15.4 所示。\n\n### 表 15.4\
  \ Linux 运行级别——基于 Debian 的发行版\n\n| 运行级别 | 描述 |\n| :--- | :--- |\n| 0 | 停止 (Halt)\
  \ |\n| 1 | 单用户模式 |\n| 2 - 5 | 多用户模式，带有网络和图形化 X Window 会话 |\n| 6 | 重启 (Reboot) |\n\
  \nUbuntu 发行版甚至没有用于设置运行级别的 `/etc/inittab` 文件。默认情况下，Ubuntu 进入运行级别 2。如果你想更改默认运行级别，必须在\
  \ Ubuntu 发行版上创建一个 `/etc/inittab` 文件。\n\n每个运行级别定义了 System V init 进程启动或停止的脚本。这些启动脚本是启动应用程序的\
  \ shell 脚本，为它们的运行提供必要的环境变量。\n\n在基于 System V init 的启动过程中，这部分开始变得有些模糊，主要是因为不同的 Linux\
  \ 发行版放置启动脚本的位置略有不同。某些发行版将启动脚本放在 `/etc/rc#.d` 目录，其中 `#` 代表运行级别。另一些使用 `/etc/init.d`\
  \ 目录，还有一些使用 `/etc/init.d/rc.d` 目录。通常，快速查看你的 `/etc` 目录结构就可以轻松确定你的发行版使用的是什么格式。\n\n\
  ### Upstart init 进程\n\nUpstart init 进程是管理服务进程的新标准，许多 Linux 发行版现在正转向它。Upstart 不专注于系统运行级别，而是关注事件，例如系统启动。在\
  \ Upstart 中，系统启动被称为启动事件（startup event）。\n\nUpstart 根据你的发行版及其版本，使用位于 `/etc/event.d`\
  \ 或 `/etc/init` 目录的文件来启动进程。为了保持向后兼容，许多 Upstart 实现仍然调用来自 `/etc/init.d` 和/或 `/etc/rc#.d`\
  \ 的旧 System V init 脚本。\n\nUpstart init 进程标准在目前仍在高度演进中。对于你创建并希望在系统启动事件期间启动的脚本，使用旧的\
  \ System V init 进程方法是稳妥的。该方法将在下一节描述。\n\n#### 定义你的脚本\n\n最好不要弄 Linux 发行版中单个启动脚本文件。发行版通常提供工具，在你添加服务器应用程序时自动构建这些脚本，手动更改这些脚本可能会导致问题。\n\
  \n相反，大多数 Linux 发行版都提供了一个本地启动文件，专门允许系统管理员输入在启动时运行的脚本。当然，该文件的名称和位置在不同的 Linux 发行版中是不同的。表\
  \ 15.5 识别了五种流行的 Linux 发行版中启动文件的位置。\n\n### 表 15.5 Linux 本地启动文件位置\n\n| 发行版 | 文件位置\
  \ |\n| :--- | :--- |\n| debian | `/etc/init.d/rc.local` |\n| Fedora | `/etc/rc.d/rc.local`\
  \ |\n| Mandriva | `/etc/rc.local` |\n| openSuse | `/etc/init.d/boot.local` |\n|\
  \ Ubuntu | `/etc/rc.local` |\n\n在本地启动文件中，你可以指定特定的命令和语句，也可以输入任何你想在启动时运行的脚本。记住，如果你使用脚本，需要指定脚本的完整路径，以便系统在启动时找到它。\n\
  \n#### 注意事项\n\n不同的 Linux 发行版在启动过程的不同阶段执行本地启动脚本。有时，脚本会在网络支持等项目启动之前运行。请咨询你特定的 Linux\
  \ 发行版文档，以确定本地启动脚本在你的发行版中何时运行。\n\n### 从新 Shell 开始\n\n每个用户的家目录都包含两个 bash shell 用于自动启动脚本和设置环境变量的文件：\n\
  \n*   `.bash_profile` 文件\n*   `.bashrc` 文件\n\n当由于新登录运行新 shell 时，bash shell 会运行 `.bash_profile`\
  \ 文件。将任何你想在登录时运行的脚本放在此文件中。\n\nbash shell 在任何启动新 shell 时都会运行 `.bashrc` 文件，包括发生新登录时。你可以通过在家目录的\
  \ `.bashrc` 文件中添加简单的 `echo` 语句然后启动新 shell 来测试这一点：\n\n```bash\n$ bash\nThis is a\
  \ new shell!!\n$\n```\n\n如果你想为系统上的每个用户运行脚本，大多数 Linux 发行版都提供了 `/etc/bashrc` 文件（注意\
  \ bashrc 文件名前面没有点）。当系统上的任何用户启动新的 bash shell 时，bash shell 都会执行该文件中的语句。\n\n## 总结\n\
  \nLinux 系统允许你通过信号（signals）来控制你的 shell 脚本。bash shell 接受信号并传递给任何进程。你可以在脚本中使用 `trap`\
  \ 语句来捕获信号并执行命令。此功能提供了一种简单的方法，来控制用户是否可以在脚本运行时中断它。\n\n默认情况下，当你在终端会话中运行脚本时，交互式 shell\
  \ 会挂起直到脚本完成。你可以在命令名后添加取符符号 `&` 来使脚本或命令在后台模式运行。当你以后台模式运行命令时，交互式 shell 会返回，允许你继续输入命令。使用此方法运行的后台进程仍然与终端会话绑定。如果你退出终端会话，后台进程也会退出。\n\
  \n为了防止这种情况发生，请使用 `nohup` 命令。该命令会拦截任何旨在停止命令的信号——例如，当你退出终端会话时。这允许脚本即使在你退出终端会话后继续在后台运行。\n\
  \n当你将进程移动到后台模式时，你仍然可以控制它发生什么。`jobs` 命令允许你查看从 shell 会话启动的进程。一旦你知道了后台进程的作业 ID，就可以使用\
  \ `kill` 命令向进程发送 Linux 信号，或使用 `fg` 命令将进程带回 shell 会话的前台。你可以通过使用 `Ctrl+Z` 键组合挂起正在运行的前台进程，然后使用\
  \ `bg` 命令将其置于后台。\n\n`nice` 和 `renice` 命令允许你更改进程的优先级级别。通过赋予进程较低的优先级，你允许 CPU 为其分配较的时间。这在运行可能消耗大量\
  \ CPU 时间的长进程时非常有用。\n\n除了控制运行中的进程外，你还可以确定进程在系统上启动的时间。你可以不直接从命令行提示符运行脚本，而是调度进程在另一个时间运行。有几种不同的方法可以实现这一点。`at`\
  \ 命令允许你在预设时间运行一次脚本。`cron` 程序提供了一个可以按计划的时间间隔运行脚本的接口。\n\n\n\n\n最后，Linux 系统提供了脚本文件，供你调度脚本以便在系统启动时或每当用户启动新的\
  \ bash shell 时运行。不同的发行版具有不同的文件，允许你列出每次系统启动时启动的脚本。这使得系统管理员可以在启动时运行用于系统维护的特殊脚本。同样，`.bash_profile`\
  \ 和 `.bashrc` 文件位于每个用户的家目录下，用于存放在新建 shell 运行时运行的脚本和命令。`.bash_profile` 文件在用户每次登录系统时运行脚本，而\
  \ `.bashrc` 文件在每个新的 shell 实例上运行脚本。\n\n在下一章中，我们将介绍如何编写脚本函数。脚本函数允许你只写一次代码块，然后在脚本的多个位置使用它们。\n\
  \n# 第三部分：高级 Shell 脚本\n\n### 本部分内容\n- 第 16 章：创建函数\n- 第 17 章：为图形化桌面编写脚本\n- 第 18 章：引入\
  \ `sed` 和 `gawk`\n- 第 19 章：正则表达式\n- 第 20 章：高级 `sed`\n- 第 21 章：高级 `gawk`\n- 第 22\
  \ 章：使用替代 Shell\n\n# 第 16 章：创建函数\n\n### 本章内容\n- 基础脚本函数\n- 返回值\n- 在函数中使用变量\n- 数组和变量函数\n\
  - 函数递归\n- 创建库\n- 在命令行上使用函数\n\n在编写 shell 脚本时，你经常会发现自己在多个位置使用了相同的代码。如果只是一个很小的代码片段，通常并没什么大碍。然而，在\
  \ shell 脚本中多次重写大段代码会很疲惫。`bash` shell 通过支持用户自定义函数来为你提供帮助。你可以将 shell 脚本代码封装进函数中，然后在脚本的任何地方根据需要多次次使用它。本章将引导你完成创建自己的\
  \ shell 脚本函数的过程，并演示如何在其他 shell 脚本应用程序中使用它们。\n\n## 基础脚本函数\n当你开始编写更复杂的 shell 脚本时，你会发现自己正在复用执行特定任务的代码部分。有时这些代码是简单的内容，例如显示文本消息和从脚本用户处获取答案。其他时候，它们是作为较大流程的一部分在脚本中多次使用的复杂计算。\n\
  \n在这些每情况下，在脚本中反复编写相同的代码块会非常乏味。如果只需要写一次代码块，然后就能在脚本的任何地方引用该代码块而无需重写，那就太好了。\n\n`bash`\
  \ shell 提供了一个允许你执行此操作的功能。函数是脚本代码块，你为其分配一个名称，然后在代码的任何地方复用它。每当你需要在脚本中使用该代码块时，只需使用你分配的函数名（这被称为调用函数）。本节描述了如何在\
  \ shell 脚本中创建和使用函数。\n\n### 创建函数\n在 `bash` shell 脚本中，可以使用两种格式来创建函数。第一种格式使用关键字 `function`\
  \ 以及你分配给代码块的函数名：\n\n```bash\nfunction name {\n    commands\n}\n```\n\n`name` 属性定义了分配给函数的唯一名称。你在脚本中定义的每个函数必须分配一个唯一的名称。\n\
  \n`commands` 是构成你函数的一个或多个 `bash` shell 命令。当你调用函数时，`bash` shell 会按照命令在函数中出现的顺序执行每条命令，就像在普通脚本一样。\n\
  \n在 `bash` shell 脚本中定义函数的第二种格式更符合其他编程语言中函数的定义方式：\n\n```bash\nname() {\ncommands\n\
  }\n```\n\n函数名后的空括号表示你正在定义一个函数。这种格式的命名规则与原始 shell 脚本函数格式相同。\n\n### 使用函数\n要在脚本中使用函数，请在某行中指定函数名，就像指定任何其他\
  \ shell 命令一样：\n\n```bash\n$ cat test1\n#!/bin/bash\n\n# 在脚本中使用函数\nfunction func1\
  \ {\n    echo \"This is an example of a function\"\n}\n\ncount=1\nwhile [ $count\
  \ -le 5 ]\ndo\n    func1\n    count=$[ $count + 1 ]\ndone\n\necho \"This is the\
  \ end of the loop\"\nfunc1\necho \"Now this is the end of the script\"\n$ \n$ ./test1\n\
  \nThis is an example of a function\nThis is an example of a function\nThis is an\
  \ example of a function\nThis is an example of a function\nThis is an example of\
  \ a function\nThis is the end of the loop\nThis is an example of a function\nNow\
  \ this is the end of the script\n$\n```\n\n每当你引用 `func1` 函数名时，`bash` shell 都会返回\
  \ `func1` 函数定义并执行你在那里定义的任何命令。\n\n函数定义不需要是 shell 脚本中的第一个内容，但要小心。如果你尝试在函数定义之前使用它，你将收到错误消息：\n\
  \n```bash\n$ cat test2\n#!/bin/bash\n\n# 使用脚本中间定义的函数\ncount=1\necho \"This line\
  \ comes before the function definition\"\n\nfunction func1 {\n    echo \"This is\
  \ an example of a function\"\n}\n\nwhile [ $count -le 5 ]\ndo\n    func1\n    count=$[\
  \ $count + 1 ]\ndone\n\necho \"This is the end of the loop\"\nfunc2\necho \"Now\
  \ this is the end of the script\"\n\nfunction func2 {\n    echo \"This is an example\
  \ of a function\"\n}\n$ \n$ ./test2\n\nThis line comes before the function definition\n\
  This is an example of a function\nThis is an example of a function\nThis is an example\
  \ of a function\nThis is an example of a function\nThis is an example of a function\n\
  This is the end of the loop\n./test2: func2: command not found\nNow this is the\
  \ end of the script\n$\n```\n\n第一个函数 `func1` 是在两个语句后定义的，这完全没有问题。然而，脚本在定义 `func2`\
  \ 之前尝试使用它。因为 `func2` 未定义，当脚本到达它时，产生了错误。\n\n你还需要注意你的函数名称。记住，每个函数名必须是唯一的。如果你重新定义一个函数，新定义将覆盖原始定义，且不会产生任何错误：\n\
  \n```bash\n$ cat test3\n#!/bin/bash\n\n# 测试重复的函数名\nfunction func1 {\necho \"This\
  \ is the first definition of the function name\"\n}\nfunc1\n\nfunction func1 {\n\
  \    echo \"This is a repeat of the function name\"\n}\nfunc1\necho \"This is the\
  \ end of the script\"\n$ \n$ ./test3\n\nThis is the first definition of the function\
  \ name\nThis is a repeat of the function name\nThis is the end of the script\n$\n\
  ```\n\n`func1` 函数的原始定义正常，但在重新定义 `func1` 函数后，后续对函数的调用都将使用第二个定义。\n\n## 返回值\n`bash`\
  \ shell 将函数视为微脚本，拥有退出状态（见第 10 章）。你有三种不同的方法为你的函数生成退出状态。\n\n#### 默认退出状态\n默认情况下，函数的退出状态是函数中最后一个命令返回的退出状态。在函数执行后，你使用标准的\
  \ `$?` 变量确定函数的退出状态：\n\n```bash\n$ cat test4\n#!/bin/bash\n\n# 测试函数的退出状态\nfunc1()\
  \ {\n    echo \"trying to display a non-existent file\"\n    ls -l badfile\n}\n\
  echo \"testing the function: \"\nfunc1\necho \"The exit status is: $?\"\n$ \n$ ./test4\n\
  \ntesting the function:\ntrying to display a non-existent file\nls: badfile: No\
  \ such file or directory\nThe exit status is: 1\n$\n```\n\n\n\n\n函数的退出状态为 1 是因为函数中的最后一个命令执行失败。然而，你无法得知函数中的其他命令是否成功执行完成。请看这个示例：\n\
  \n```bash\n$ cat test4b\n\n#!/bin/bash\n\n# testing the exit status of a function\n\
  func1() {\n    ls -l badfile\n    echo \"This was a test of a bad command\"\n}\n\
  \necho \"testing the function:\"\nfunc1\n\necho \"The exit status is: $?\"\n```\n\
  \n```bash\n$\n$ ./test4b\ntesting the function:\nls: badfile: No such file or directory\n\
  This was a test of a bad command\nThe exit status is: 0\n```\n\n这一次，因为函数是以一个成功执行的\
  \ `echo` 语句结束的，所以函数的退出状态为 0，尽管函数中的其中一个命令失败了。使用函数的默认退出状态是一种危险的做法。幸运的是，我们还有其他两种解决方案。\n\
  \n## 使用 return 命令\n\nbash shell 使用 `return` 命令以特定的退出状态退出函数。`return` 命令允许你指定一个单一整数值来定义函数的退出状态，这为你提供了一种简单的方法来通过程序化设置函数的退出状态：\n\
  \n```bash\n$ cat test5\n\n#!/bin/bash\n\n# using the return command in a function\n\
  function dbl {\n    read -p \"Enter a value: \" value\n    echo \"doubling the value\"\
  \n    return $[ $value * 2 ]\n}\n\ndbl\n\necho \"The new value is $?\"\n```\n\n\
  `dbl` 函数将用户输入提供的 `$value` 变量中的值翻倍。然后它使用 `return` 命令返回结果，脚本通过 `$?` 变量显示该结果。\n\n然而，当你使用这种技术从函数返回数值时，必须小心。请记住以下两点以避免问题：\n\
  \n- 记住在函数完成后立即获取返回值。\n- 记住退出状态必须在 0 到 255 的范围之内。\n\n如果你在通过 `$?` 变量获取函数返回值之前，先执行了任何其他命令，函数的返回值将会丢失。记住\
  \ `$?` 变量返回的是上一个执行的命令的退出状态。\n\n第二个问题为使用这种返回值技术定义了局限性。由于退出状态必须小于 256，你的函数执行结果必须产生一个小于\
  \ 256 的整数值。任何大于该值都会返回错误值：\n\n```bash\n$ ./test5\nEnter a value: 200\ndoubling the\
  \ value\nThe new value is 1\n```\n\n如果你需要返回较大的整数值或字符串值，就无法使用这种返回值技术。相反，你将需要另一种方法，将在下一节中演示。\n\
  \n## 使用函数输出\n\n就像你可以将命令的输出转换为 shell 变量一样，你也可以将函数的输出转换为 shell 变量。你可以使用这种技术从函数获取任何类型的输出并赋值给变量：\n\
  \n`result='dbl' `\n\n此命令将 `dbl` 函数的输出赋值给 shell 变量 `$result`。以下是在脚本中使用该方法的一个示例：\n\
  \n```bash\n$ cat test5b\n\n#!/bin/bash\n\n# using the echo to return a value\nfunction\
  \ dbl {\n    read -p \"Enter a value: \" value\n    echo $[ $value * 2 ]\n}\n\n\
  result='dbl'\necho \"The new value is $result\"\n```\n\n```bash\n$\n$ ./test5b\n\
  Enter a value: 200\nThe new value is 400\n\n$\n$ ./test5b\nEnter a value: 1000\n\
  The new value is 2000\n```\n\n现在函数使用 `echo` 语句来显示计算结果。脚本捕获的是 `dbl` 函数的输出，而不是通过退出状态获取答案。\n\
  \n这个示例展示了一个微妙的技巧。你会发现 `dbl` 函数实际上输出了两条消息。`read` 命令输出了一条短消息，向用户查询数值。bash shell 脚本足够聪明，不会将此视为\
  \ `STDOUT` 输出的一部分并忽略了它。如果你使用 `echo` 语句向用户产生这条查询消息，那么它也将连同输出值一起被 shell 变量捕获。\n\n\
  > **注意**\n> 使用这种技术，你还可以返回浮点数和字符串值，这使其成为从函数返回数值的一种极其多用途的方法。\n\n## 在函数中使用变量\n\n你可能已经注意到上一节的\
  \ `test5` 示例中，我们在函数内部使用了一个名为 `$value` 的变量来存储它处理的值。当你在函数中使用变量时，需要对定义和处理它们的方式加小心。这是\
  \ shell 脚本中问题的常见原因。本节将介绍在 shell 脚本函数内部和外部处理变量的几种技巧。\n\n### 向函数传递参数\n\n正如我们在之前的“返回数值”部分中提到的，bash\
  \ shell 将函数视为类似于微型脚本。这意味着你可以像对待普通脚本一样向函数传递参数（参见第 13 节）。\n\n函数可以使用标准的参数环境变量来表示从命令行传递给函数的任何参数。例如，函数名定义在\
  \ `$0` 变量中，函数命令行上的任何参数都使用变量 `$1`、`$2` 等定义。你还可以使用特殊变量 `$#` 来确定传递给函数的参数个数。\n\n在脚本中指定函数时，你必须在函数的同一命令行上提供参数，如下所示：\n\
  \n`func1 $value1 10`\n\n函数随后可以使用参数环境变量检索参数值。这里是使用这种方法向函数传递数值的示例：\n\n```bash\n$ cat\
  \ test6\n\n#!/bin/bash\n\n# passing parameters to a function\nfunction addem {\n\
  \    if [ $# -eq 0 ] || [ $# -gt 2 ]\n    then\n        echo -1\n    elif [ $# -eq\
  \ 1 ]\n    then\n        echo $[ $1 + $1 ]\n    else\n        echo $[ $1 + $2 ]\n\
  \    fi\n}\n\necho -n \"Adding 10 and 15: \"\nvalue='addem 10 15'\necho $value\n\
  echo -n \"Let's try adding just one number: \"\nvalue='addem 10'\necho $value\n\
  echo -n \"Now trying adding no numbers: \"\nvalue='addem'\necho $value\necho -n\
  \ \"Finally, try adding three numbers: \"\nvalue='addem 10 15 20'\necho $value\n\
  ```\n\n```bash\n$\n$ ./test6\nAdding 10 and 15: 25\nLet's try adding just one number:\
  \ 20\nNow trying adding no numbers: -1\nFinally, try adding three numbers: -1\n\
  ```\n\n文中的 `addem` 函数首先检查脚本传递给它的参数个数。如果没有参数，或者参数多于两个，`addem` 将返回值 -1。如果只有一个参数，`addem`\
  \ 将其与自身相加得到结果。有两个参数，`addem` 将它们相加得到结果。\n\n由于函数使用了特殊的环境变量来处理自己的值，它无法直接从脚本的命令行访问脚本值。下面的示例将失败：\n\
  \n```bash\n$ cat badtest1\n\n#!/bin/bash\n\n# trying to access script parameters\
  \ inside a function\nfunction badfunc1 {\n    echo $[ $1 * $2 ]\n}\n\nif [ $# -eq\
  \ 2 ]\nthen\n    value='badfunc1'\n    echo \"The result is $value\"\nelse\n   \
  \ echo \"Usage: badtest1 a b\"\nfi\n```\n\n```bash\n$\n$ ./badtest1\nUsage: badtest1\
  \ a b\n\n$ ./badtest1 10 15\n./badtest1: * : syntax error: operand expected (error\
  \ token is '*')\nThe result is\n```\n\n尽管函数使用了 `$1` 和 `$2` 变量，但它们并不是脚本主部分可用的那些 `$1`\
  \ 和 `$2` 变量。相反，如果你想在函数中使用这些值，你必须在调用函数时手动传递它们传递：\n\n```bash\n$ cat test7\n\n#!/bin/bash\n\
  \n# trying to access script parameters inside a function\nfunction func7 {\n   \
  \ echo $[ $1 * $2 ]\n}\n\nif [ $# -eq 2 ]\nthen\n    value='func7 $1 $2'\n    echo\
  \ \"The result is $value\"\nelse\n    echo \"Usage: badtest1 a b\"\nfi\n```\n\n\
  ```bash\n$\n$ ./test7\nUsage: badtest1 a b\n\n$ ./test7 10 15\nThe result is 150\n\
  ```\n\n$\n\n\n\n\n通过将 `$1` 和 `$2` 变量传递给函数，它们就可以供函数使用，就像其他参数一样。\n\n# 在函数中处理变量\n\n\
  让 shell 脚本编程人员遇到问题之一是变量的作用范围。作用范围是指变量可见的地方。函数中定义的变量的作用范围可能普通变量不同。也就是说，它们可以对脚本的其他部分隐藏。\n\
  \n函数使用两种类型的变量：\n\n* 全局\n* 局部\n\n接下来的章节描述了如何在函数中使用这两种变量。\n\n## 全局变量\n\n全局变量是在 shell\
  \ 脚本任何地方有效的变量。如果你在脚本的主部分定义了一个全局变量，你可以在函数内部获取它的值。同样，如果你在函数内部定义了一个全局变量，可以在脚本的主部分获取它的值。\n\
  \n默认情况下，你在脚本中定义的任何变量都是全局变量。在函数外部定义的变量可以在函数内部正常访问：\n\n```bash\n$ cat test8\n#!/bin/bash\n\
  \n# 使用全局变量传递值\nfunction dbl {\n   value=$[ $value * 2 ]\n}\n\nread -p \"Enter a\
  \ value: \" value\ndbl\necho \"The new value is: $value\"\n$\n$ ./test8\nEnter a\
  \ value: 450\nThe new value is: 900\n$\n```\n\n`$value` 变量在函数外部定义，并在函数外部赋值。当调用 `dbl`\
  \ 函数时，该变量及其值在函数内部仍然有效。当在函数内部为变量分配新值时，该新值在脚本引用变量时仍然有效。\n\n然而，这是一种危险的做法，特别是当你打算在不同的\
  \ shell 脚本中使用这些函数时。它要求你确切知道函数使用了哪些变量，包括任何用于计算未返回给脚本值的变量。这里有一个情况变糟的例子：\n\n```bash\n\
  $ cat badtest2\n#!/bin/bash\n\n# 演示变量的不当使用\nfunction func1 {\n   temp=$[ $value\
  \ + 5 ]\n   result=$[ $temp * 2 ]\n}\ntemp=4\nvalue=6\nfunc1\necho \"The result\
  \ is $result\"\nif [ $temp -gt $value ]\nthen\n   echo \"temp is larger\"\nelse\n\
  \   echo \"temp is smaller\"\nfi\n$\n$ ./badtest2\nThe result is 22\ntemp is larger\n\
  $\n```\n\n因为在函数使用了 `$temp` 变量，它的值在脚本中受到了影响，导致产生一个可能不是你预期的结果。在函数中解决这个问题有种简单的方法，如下一节所示。\n\
  \n## 局部变量\n\n与其在函数中使用全局变量，函数内部使用的任何变量都可以声明为局部变量。要做到这一点，只需在变量声明前使用 `local` 关键字：\n\
  \n```bash\nlocal temp\n```\n\n你也可以在赋值语句中为变量赋值时使用 `local` 关键字：\n\n```bash\nlocal\
  \ temp=$[ $value + 5 ]\n```\n\n`local` 关键字确保该变量仅限于函数内部。如果脚本中函数外部出现了同名的变量，shell 会保持这两个变量值相互独立。现在你可以轻松地将函数变量与脚本变量隔离开，并且只共享你想共享的：\n\
  \n```bash\n$ cat test9\n#!/bin/bash\n\n# 演示 local 关键字\nfunction func1 {\n   local\
  \ temp=$[ $value + 5 ]\n   result=$[ $temp * 2 ]\n}\ntemp=4\nvalue=6\nfunc1\necho\
  \ \"The result is $result\"\nif [ $temp -gt $value ]\nthen\n   echo \"temp is larger\"\
  \nelse\n   echo \"temp is smaller\"\nfi\n$\n$ ./test9\nThe result is 22\ntemp is\
  \ smaller\n$\n```\n\n现在当你在 `func1` 函数内部使用 `$temp` 变量时，它不会影响赋值给主脚本中 `$temp` 变量的值。\n\
  \n# 数组变量和函数\n\n5 章讨论了使用数组允许单个变量持有多个值的高级方法。在函数中使用数组变量值有点复杂，并且有一些特殊的考虑。本节描述了一种允许你执行此操作的技术。\n\
  \n### 将数组传递给函数\n\n向脚本函数传递数组变量的艺术可能会令人困惑。如果你尝试将数组变量作为单个参数传递，它是起不起作用的：\n\n```bash\n\
  $ cat badtest3\n#!/bin/bash\n\n# 尝试传递数组变量\nfunction testit {\n   echo \"The parameters\
  \ are: $@\"\n   thisarray=$1\n   echo \"The received array is ${thisarray[*]}\"\n\
  }\nmyarray=(1 2 3 4 5)\necho \"The original array is: ${myarray[*]}\"\ntestit $myarray\n\
  $\n$ ./badtest3\nThe original array is: 1 2 3 4 5\nThe parameters are: 1\n./badtest3:\
  \ thisarray[*]: bad array subscript\nThe received array is\n$\n```\n\n如果你尝试将数组变量作为函数参数，函数只会获取数组变量的第一个值。\n\
  \n要解决这个问题，你必须将数组变量拆分为单独的值，然后将这些值作为函数参数。在函数内部，你可以将所有参数重新组合成一个新的数组变量。以下是这样操作的例子：\n\
  \n```bash\n$ cat test10\n#!/bin/bash\n\n# 数组变量传递给函数 test\nfunction testit {\n  \
  \ local newarray\n   newarray=(echo \"$@\")\n   echo \"The new array value is: ${newarray[*]}\"\
  \n}\nmyarray=(1 2 3 4 5)\necho \"The original array is ${myarray[*]}\"\ntestit ${myarray[*]}\n\
  $\n$ ./test10\nThe original array is 1 2 3 4 5\nThe new array value is: 1 2 3 4\
  \ 5\n$\n```\n\n脚本使用 `$myarray` 变量持有所有的单独数组值，将它们全部放在命令行上供函数使用。函数然后从命令行参数重新构建数组变量。一旦进入函数内部，数组就可以像任何其他数组一样被使用：\n\
  \n```bash\n$ cat test11\n#!/bin/bash\n\n# 在数组中相加\nfunction addarray {\n   local\
  \ sum=0\n   local newarray\n   newarray=(echo \"$@\")\n   for value in ${newarray[*]}\n\
  \   do\n      sum=$[ $sum + $value ]\n   done\n   echo $sum\n}\nmyarray=(1 2 3 4\
  \ 5)\necho \"The original array is: ${myarray[*]}\"\nresult=$(addarray ${myarray[*]})\n\
  echo \"The result is $result\"\n$\n$ ./test11\nThe original array is: 1 2 3 4 5\n\
  The result is 15\n$\n```\n\n`addarray` 函数遍历数组值，并将它们相加。你可以在 `myarray` 数组中放入任何数量的值，`addarray`\
  \ 函数会将它们相加。\n\n### 从函数返回数组\n\n从函数将数组变量传回脚本使用了类似的技术。函数使用 `echo` 语句输出单独的值，然后脚本必须将它们重新组合成一个新的数组变量：\n\
  \n```bash\n$ cat test12\n#!/bin/bash\n\n# 返回数组值\nfunction arraydbl {\n   local origarray\n\
  \   local newarray\n   local elements\n   local i\n   origarray=(echo \"$@\")\n\
  \   newarray=(echo \"$@\")\n   elements=$[ $# - 1 ]\n   for (( i = 0; i <= $elements;\
  \ i++ ))\n   do\n      newarray[$i=$[ ${origarray[$i]} * 2 ]\n   done\n   echo ${newarray[*]}\n\
  }\nmyarray=(1 2 3 4 5)\necho \"The original array is: ${myarray[*]}\"\nresult=$(arraydbl\
  \ ${myarray[*]})\necho \"The new array is: ${result[*]}\"\n$\n$ ./test12\nThe original\
  \ array is: 1 2 3 4 5\nThe new array is: 2 4 6 8 10\n$\n```\n\n## 函数递归\n\n\n\n\n\
  \n局部函数变量提供的一个特性是自包含性。一个自包含的函数不使用函数外部的任何资源，脚本从命令行传递给它的变量除外。\n\n这一特性使得函数可以被递归调用，这意味着函数通过调用自己来得到答案。通常，递归函数有一个最终会迭代到的基础值（base\
  \ value）。许多高级数学算法使用递归将复杂方程反复降低一层，直到达到基础值定义的级别。\n\n递归算法的一个经典示例是计算阶乘。一个数字的阶乘是其之前数字与该数字相乘的值。因此，要找到\
  \ 5 的阶乘，你需要执行以下方程：\n\n`5! = 1 * 2 * 3 * 4 * 5 = 120`\n\n使用递归，该方程被简化为以下格式：\n\n`x!\
  \ = x * (x-1)!`\n\n用英文表达为：`x` 的阶乘等于 `x` 乘以 `x-1` 的阶乘。这可以通过一个简单的递归脚本表示：\n\n```bash\n\
  function factorial {\n   if [ $1 -eq 1 ]\n   then\n      echo 1\n   else\n     \
  \ local temp=$[ $1 - 1 ]\n      local result='factorial $temp'\n      echo $[ $result\
  \ * $1 ]\n   fi\n}\n```\n\n阶乘函数使用自己来计算阶乘的值：\n\n```bash\n$ cat test13\n#!/bin/bash\n\
  \n# using recursion\n\nfunction factorial {\n   if [ $1 -eq 1 ]\n   then\n     \
  \ echo 1\n   else\n      local temp=$[ $1 - 1 ]\n      local result='factorial $temp'\n\
  \      echo $[ $result * $1 ]\n   fi\n}\n\nread -p \"Enter value: \" value\nresult='factorial\
  \ $value'\necho \"The factorial of $value is: $result\"\n$ \n\n$ ./test13\nEnter\
  \ value: 5\nThe factorial of 5 is: 120\n$\n```\n\n使用阶乘函数非常简单。创建了这样一个函数后，你可能想在其他脚本中使用它。接下来，我们将看看如何高效地做到。\n\
  \n## 创建库\n\n很容易看出函数如何帮助在单个脚本中减少输入量，但如果你恰好在多个脚本之间使用同一个代码块又呢？如果你必须在每个脚本中定义相同的函数，却在每个脚本中只使用一次，这显然是挑战性的。\n\
  \n这个问题有一个解决方案！bash shell 允许你为函数创建一个库文件，然后在所需的任意脚本中引用该唯一的库文件。\n\n该过程的第一步是创建一个公共库文件，其中包含脚本中需要的函数。这是一个名为\
  \ `myfuncs` 的简单库文件，定义了三个简单的函数：\n\n```bash\n$ cat myfuncs\n# my script functions\n\
  \nfunction addem {\n   echo $[ $1 + $2 ]\n}\n\nfunction multem {\n   echo $[ $1\
  \ * $2 ]\n}\n\nfunction divem {\n   if [ $2 -ne 0 ]\n   then\n      echo $[ $1 /\
  \ $2 ]\n   else\n      echo -1\n   fi\n}\n$\n```\n\n下一步是在想要使用任何函数的脚本文件中包含 `myfuncs`\
  \ 库文件。这就是事情变得复杂的地方。\n\n问题出在 shell 函数的作用域上。与环境变量一样，shell 函数仅在定义它们的 shell 会话中有效。如果你从\
  \ shell 命令行界面提示符中运行 `myfuncs` shell 脚本，shell 会创建一个新的 shell 并在新 shell 中运行脚本。这将为该\
  \ shell 定义这三个函数，但当你尝试运行另一个使用这些函数的脚本时，它们将不可用。\n\n这同样适用于脚本。如果你尝试将库文件作为普通脚本文件运行，函数将不会你的脚本中：\n\
  \n```bash\n$ cat badtest4\n#!/bin/bash\n\n# using a library file the wrong way\n\
  \n./myfuncs\nresult='addem 10 15'\necho \"The result is $result\"\n$ \n\n$ ./badtest4\n\
  ./badtest3: addem: command not found\nThe result is\n$\n```\n\n使用函数库的关键是 `source`\
  \ 命令。`source` 命令在当前 shell 上下文中执行命令，而不是创建一个新的 shell 来执行它们。你使用 `source` 命令在你的 shell\
  \ 脚本内部运行库文件脚本。这使得函数对脚本可用。\n\n`source` 命令有一个快捷别名，称为点运算符（dot operator）。要在 shell 脚本中\
  \ source `myfuncs` 库文件，你只需要添加以下行：\n\n`. ./myfuncs`\n\n此示例假设 `myfuncs` 库文件与 shell\
  \ 脚本位于同一目录。如果不是，你需要使用适当的路径来访问该文件。这里有一个使用 `myfuncs` 库文件的脚本示例：\n\n```bash\n$ cat test14\n\
  #!/bin/bash\n\n# using functions defined in a library file\n\n. ./myfuncs\nvalue1=10\n\
  value2=5\nresult1='addem $value1 $value2'\nresult2='multem $value1 $value2'\nresult3='divem\
  \ $value1 $value2'\necho \"The result of adding them is: $result1\"\necho \"The\
  \ result of multiplying them is: $result2\"\necho \"The result of dividing them\
  \ is: $result3\"\n$ \n\n$ ./test14\nThe result of adding them is: 15\nThe result\
  \ of multiplying them is: 50\nThe result of dividing them is: 2\n$\n```\n\n该脚本成功使用了库文件中定义的函数。\n\
  \n## 在命令行上使用函数\n\n你可以直接在 shell 中使用函数。因为 shell 会在你输入时解释命令，所以你可以定义函数。有两种方法可以实现。\n\n\
  ### 在行内创建函数\n\n第一种方法是在行内定义函数：\n\n```bash\n$ function divem { echo $[ $1 / $2 ] }\n\
  $ divem 100 5\n20\n$\n```\n\n当你在行内定义函数时，必须在每个命令的末尾包含分号，以便 shell 知道在哪里分隔命令：\n\n```bash\n\
  $ function doubleit { read -p \"Enter value: \" value; echo $[ value * 2 ]; }\n\
  $ doubleit\nEnter value: 20\n40\n$\n```\n\n另一种方法是使用多行来定义函数。当你这样做时，bash shell 会使用次级提示符提示输入更多命令。使用这种方法，你不需要在每个命令末尾放置分号；只需按回车键：\n\
  \n```bash\n$ function multem {\n> echo $[ $1 * $2 ]\n> }\n$ multem 2 5\n10\n$\n\
  ```\n\n当函数结尾使用括号时，shell 知道你已经完成了函数的定义。\n\n注意：在命令行上创建函数时要非常小心。如果你使用与内置命令或其他命令同名的函数，该函数将覆盖原始命令。\n\
  \n## 在 .bashrc 文件中定义函数\n\n直接在命令行上定义 shell 函数的缺点是当你退出 shell 时，你的函数就会消失。对于复杂的函数，这可能会变成一个问题。\n\
  \n简单得的方法是在地方定义函数，让 shell 在每次启动新 shell 时都重新加载它。这样做最好的地方是 `.bashrc` 文件。bash shell\
  \ 每次启动时都会在你的主目录下查找此文件，无论是交互式启动还是从现有 shell 启动新 shell。\n\n### 直接定义函数\n\n你可以直接在主目录下的\
  \ `.bashrc` 文件中定义函数。大多数 Linux 发行版已经在 `.bashrc` 文件中定义了一些内容，因此请不要删除这些项目。只需将你的函数添加到现有文件的末即可。这是一个示例：\n\
  \n```bash\n$ cat .bashrc\n# .bashrc\n\n# Source global definitions\nif [ -r /etc/bashrc\
  \ ]; then\n   . /etc/bashrc\nfi\n```\n\n\n\n```bash\nfunction addem {\n    echo\
  \ $[ $1 + $2 ]\n}\n```\n$\n\n该函数在在你下次启动新的 bash shell 之前生效。之后，你可以在系统的任何地方使用该函数。\n\
  \n### 引入函数文件 (Sourcing Function Files)\n\n就像在 脚本中一样，你可以使用 `source` 命令（或其别名 `.`）将现有库文件中的函数添加到你的\
  \ `.bashrc` 脚本中：\n\n```bash\n$ cat .bashrc\n\n# .bashrc\n\n# 引入全局定义\n\nif [ -r /etc/bashrc\
  \ ]; then\n    . /etc/bashrc\nfi\n. /home/rich/libraries/myfuncs\n$\n```\n\n请确保你包含了正确的路径，以便\
  \ bash shell 能够找到该库文件。当你下次启动 shell 时，库中的所有函数都可以在命令行界面中可用：\n\n```bash\n$ addem 10\
  \ 5\n15\n\n$ multem 10 5\n50\n\n$ divem 10 5\n2\n```\n\n更好的是，shell 还会将任何定义的函数传递给子\
  \ shell 进程，因此你的函数对于从当前 shell 会话运行的任何 shell 脚本自动可用。你可以通过编写一个使用这些函数但不定义或引入它们的脚本来测试这一点：\n\
  \n```bash\n$ cat test15\n#!/bin/bash\n# 使用在 .bashrc 文件中定义的函数\nvalue1=10\nvalue2=5\n\
  result1='addem $value1 $value2'\nresult2='multem $value1 $value2'\nresult3='divem\
  \ $value1 $value2'\necho \"The result of adding them is: $result1\"\necho \"The\
  \ result of multiplying them is: $result2\"\necho \"The result of dividing them\
  \ is: $result3\"\n$ \n\n$ ./test15\nThe result of adding them is: 15\nThe result\
  \ of multiplying them is: 50\nThe result of dividing them is: 2\n$\n```\n\n即使不引入库文件，这些函数在\
  \ shell 脚本中也能运行良好。\n\n## 总结\n\nShell 脚本函数允许你将整个脚本中重复出现的脚本代码放在一个地方。你不需要重写代码块，可以创建一个包含该代码块的函数，然后在脚本中只需引用函数名。每当\
  \ bash shell 看到脚本中使用函数名时，它就会跳转到函数代码块。\n\n你甚至可以创建返回值的脚本函数。这允许你创建与脚本交互的函数，返回数值数据和字符数据。脚本函数可以通过使用函数中最后一个命令的退出状态，或通过使用\
  \ `return` 命令来返回数值数据。`return` 命令允许你根据函数的执行结果程序化地将函数的退出状态设置为特定值。\n\n函数还可以使用标准的 `echo`\
  \ 语句返回值。你可以使用反引号（backtick character）像处理任何其他 shell 命令一样捕获输出数据。这使得你能够从函数返回任何类型的数据，包括字符串和浮点数。\n\
  \n你可以在函数中使用 shell 变量，为变量赋值并从现有变量中检索值。这允许你从主脚本程序向脚本函数传入和传出任何类型的数据。函数还允许你定义局部变量，这些变量仅在函数代码块内部访问。局部变量允许你创建自包含的函数，它们不会与主\
  \ shell 脚本使用的任何变量或进程冲突。\n\n函数还可以调用其他函数，包括调用本身。当一个函数调用自身时，就称为递归。递归函数通常有一个基准值，它是函数的终止值。函数会不断以减小的参数值继续调用自己，直到达到基准值。\n\
  \n如果你在 shell 脚本中使用大量函数，可以创建脚本函数的库文件。可以通过使用 `source` 命令或其别名 `.` 运算符将库文件包含在任何 shell\
  \ 脚本文件中。这被称为引入库文件（sourcing）。shell 不会运行库文件，但会在运行脚本的 shell 中使这些函数可用。你可以使用相同的技术创建可以在普通\
  \ shell 命令行上使用的函数。你可以直接在命令行上定义函数，也可以将它们添加到 `.bashrc` 文件中，以便在你启动的每个新 shell 会话中可用。这是一种创建工具的方便方法，无论你的\
  \ `PATH` 环境变量如何设置，它们都可以使用。\n\n下一章将讨论在脚本中使用文本图形。在如今这个现代图形界面的时代，有时纯文本界面是不够的。bash shell\
  \ 提了一些简单的方法，让你在脚本中加入简单的图形功能，帮助内容增添趣味。\n\n# 第 17 章：为图形化桌面编写脚本\n\n### 本章内容\n* 创建文本菜单\n\
  * 构建文本窗口小部件\n* 添加 X Windows 图形\n\n多年来，shell 脚本一直带有单调无聊的声誉。然而，如果你计划在图形环境中运行脚本，情况就不如此了。有很多方法可以与脚本用户交互，而不需要依赖\
  \ `read` 和 `echo` 语句。本章将深入探讨你可以使用的几种不同方法，帮助为交互式脚本增加活力，让它们看起来不那么过时。\n\n## 创建文本菜单\n\
  \n创建交互式 shell 脚本常用的方法是利用菜单。为客户提供各种选项的选择有助于引导他们了解脚本可以做什么和不能做什么。\n\n菜单脚本通常会清除显示区域，然后显示可用选项列表。用户可以通过按下分配给每个选项的相关字母或数字来选择选项。图\
  \ 17.1 显示了示例菜单的布局。\n\n图 17.1 从 shell 脚本显示菜单\n\n![17.1](img/c17f001.jpg)\n\nshell\
  \ 脚本菜单的核心是 `case` 命令（参见第 11 章）。`case` 命令根据客户从菜单中选择的字符执行特定的命令。\n\n接下来的章节将引导你完成创建基于菜单的\
  \ shell 脚本时应该遵循的步骤。\n\n#### 创建菜单布局\n\n创建菜单的第一步显然是确定你想在菜单中显示的哪些元素，并按照你想要的方式对其进行布局。\n\
  \n在创建菜单之前，清除显示器内容通常是一个好主意。这让你在一个没有干扰文本的洁环境中显示菜单。\n\n`clear` 命令使用你终端会话的 terminfo\
  \ 数据（参见第 2 章）来清除显示器上显示的任何文本。执行 `clear` 命令后，你可以使用 `echo` 命令显示你的菜单元素。\n\n默认情况下，`echo`\
  \ 命令只能显示可打印的文本字符。在创建菜单项时，使用不可打印的项（如制表符和换行符）通常很有帮助。要在你的 `echo` 命令中包含这些字符，你必须使用 `-e`\
  \ 选项。因此，命令：\n\n`echo -e \"1.\\tDisk space\"`\n\n结果输出为：\n`1.    Disk space`\n\n这极大有助于格式化菜单项的布局。只需几个\
  \ `echo` 命令，你就可以创建一个看起来合理的菜单：\n\n```bash\nclear\necho\necho -e \"\\t\\t\\tSys Admin\
  \ Menu\\n\"\necho -e \"\\t1. Display disk space\"\necho -e \"\\t2. Display logged\
  \ on users\"\necho -e \"\\t3. Display memory usage\"\necho -e \"\\t0. Exit menu\\\
  n\\n\"\necho -en \"\\t\\tEnter option: \"\n```\n\n最后一行的 `-en` 选项在不在结尾添加换行符的情况下显示该行。这使得菜单看起来更专业，因为光标将停留在行尾等待客户的输入。\n\
  \n\n\n\n创建菜单的最后一部分是从客户处获取输入。这是通过 `read` 命令来实现（参见第 13 章）。因为我们预计只接收单字符输入，很好的做法是使用\
  \ `read` 命令中的 `-n` 选项来只获取一个字符。这允许客户输入数字而无需按回车键：\n\n```bash\nread -n 1 option\n```\n\
  \n接下来，你将需要创建菜单函数。\n\n## 创建菜单函数\n\nShell 脚本的菜单选项作为一组独立的函数来创建会更简单。这让你能够创建一个简单、简洁且易于维护的\
  \ `case` 命令。\n\n要做到这一点，你需要为每个菜单选项创建一个独立的 shell 函数。创建菜单 Shell 脚本的第一步是确定你想让脚本执行哪些函数，并将它们作为独立的函数列在代码中。\n\
  \n对于尚未实现的函数，创建“存根函数”（stub functions）是一种常见的做法。存根函数是一个尚未包含任何命令的函数，或者只包含一个 `echo` 语句来指示将来应该放置的内容：\n\
  \n```bash\nfunction diskspace {\n    clear\n    echo “This is where the diskspace\
  \ commands will go”\n}\n```\n\n这使得你在编写各个函数时，菜单能够顺畅运行。你不需要为了菜单运行就写完所有函数。你会发现函数是以\
  \ `clear` 命令开头的。这让你能够在洁的显示器屏幕上启动函数，而不会显示菜单。\n\n在 Shell 脚本菜单中，很有帮助的一是将菜单布局本身创建一个函数：\n\
  \n```bash\nfunction menu {\n    clear\n    echo\n    echo -e \"\\t\\t\\tSys Admin\
  \ Menu\\n\"\n    echo -e \"\\t1. Display disk space\"\n    echo -e \"\\t2. Display\
  \ logged on users\"\n    echo -e \"\\t3. Display memory usage\"\n    echo -e \"\\\
  t0. Exit program\\n\\n\"\n    echo -en \"\\t\\tEnter option: \"\n    read -n 1 option\n\
  }\n```\n\n这让你能够通过随时调用 `menu` 函数来轻松地重新显示菜单。\n\n## 添加菜单逻辑\n\n现在你已经有了菜单布局和函数，你需要做的就是创建编程逻辑将两者结合起来。如提到的，这需要用到\
  \ `case` 命令。\n\n`case` 命令应该根据菜单预期的字符选择调用相应的函数。使用默认的命令字符（星号 `*`）来捕获任何错误的菜单输入是一个好主意。\n\
  \n下面的代码演示了典型菜单中 `case` 命令的用法：\n\n```bash\nmenu\ncase $option in\n0)\n    break ;;\n\
  1)\n    diskspace ;;\n2)\n    whoseon ;;\n3)\n    memusage ;;\n*)\n    clear\n \
  \   echo “Sorry, wrong selection”;\nesac\n```\n\n这段代码首先使用 `menu` 函数清除显示器屏幕并显示菜单。`menu`\
  \ 函数中的 `read` 命令会暂停，直到客户在键盘上击击字符。一旦完成，`case` 命令就会接管。`case` 命令根据返回的字符调用相应的函数。函数执行完成后，`case`\
  \ 命令退出。\n\n## 整合在一起\n\n现在你已经了解了构成 Shell 脚本菜单的所有部分，让我们把它整合在一起，看看它们是如何协同运作的。这是一个完整的菜单脚本示例：\n\
  \n```bash\n$ cat menu1\n#!/bin/bash\n# simple script menu\nfunction diskspace {\n\
  \    clear\n    df -k\n}\nfunction whoseon {\n    clear\n    who\n}\nfunction memusage\
  \ {\n    clear\n    cat /proc/meminfo\n}\nfunction menu {\n    clear\n    echo\n\
  \    echo -e \"\\t\\t\\tSys Admin Menu\\n\"\n    echo -e \"\\t1. Display disk space\"\
  \n    echo -e \"\\t2. Display logged on users\"\n    echo -e \"\\t3. Display memory\
  \ usage\"\n    echo -e \"\\t0. Exit program\\n\\n\"\n    echo -en \"\\t\\tEnter\
  \ option: \"\n    read -n 1 option\n}\nwhile [ 1 ]\ndo\n    menu\n    case $option\
  \ in\n0)\n        break ;;\n1)\n        diskspace ;;\n2)\n        whoseon ;;\n3)\n\
  \        memusage ;;\n*)\n        clear\n        echo “Sorry, wrong selection”;;\n\
  \    esac\n    echo -en \"\\t\\tHit any key to continue\"\n    read -n 1\ndone\n\
  ```\n\n\n\n\n# 对话组件 (Widgets)\n\n| 组件 | 描述 |\n| :--- | :--- |\n| calendar | 提供一个日历用于选择日期\
  \ |\n| checklist | 显示多个条目，每个条目都可以开启或关闭 |\n| form | 允许你构建包含标签和待填文本字段的表单 |\n| fselect\
  \ | 提供一个文件选择窗口用于浏览文件 |\n| gauge | 显示显示完成百分比的仪表盘 |\n| infobox | 显示消息而无需响应 |\n| inputbox\
  \ | 显示一个用于输入文本的单文本框 |\n| inputmenu | 提供一个可编辑的菜单 |\n| menu | 显示一个供选择的选项列表 |\n| msgbox\
  \ | 显示消息并要求用户选择 OK 按钮 |\n| pause | 显示显示指定暂停期间状态的仪表盘 |\n| passwordbox | 显示一个隐藏输入文本的单文本框\
  \ |\n| passwordform | 显示一个带有标签和隐藏文本字段的表单 |\n| radiolist | 提供一组菜单项，只能选择其中一项 |\n|\
  \ tailbox | 使用 tail 命令在滚动窗口中显示文件内容 |\n| tailboxbg | 与 tailbox 相同，但在后台模式运行 |\n| textbox\
  \ | 在滚动窗口中显示文件内容 |\n| timebox | 提供一个用于选择小时、分、秒的窗口 |\n| yesno | 提供带有 Yes 和 No 按钮的简单消息\
  \ |\n\n如表 17.1 所示，有很多不同的组件可以选择。这可以让你花费极少的努力就让你的脚本看起来更专业。\n\n要在命令行上指定特定的组件，你需要使用双横线格式：\n\
  \n```\ndialog --widget parameters\n```\n\n其中 `widget` 是表 17.1 中所示组件名称，`parameters`\
  \ 定义了组件窗口的大小以及组件所需的任何文本。\n\n每个对话组件以两种形式提供输出：\n\n- 使用 `STDERR`\n- 使用退出代码状态\n\n`dialog`\
  \ 命令的退出代码状态取决于用户选择的按钮。如果选择了 OK 或 Yes 按钮，`dialog` 命令返回退出状态 `0`。如果选择了 Cancel 或 No\
  \ 按钮，`dialog` 命令返回退出状态 `1`。你可以使用标准变量 `$?` 来确定在对话组件中选择了哪个按钮。\n\n如果组件返回了任何数据（例如菜单选择），`dialog`\
  \ 命令会将数据发送到 `STDERR`。你可以使用标准的 bash shell 技术，将 `STDERR` 输出重定向到另一个文件或文件描述符：\n\n```\n\
  dialog --inputbox \"Enter your age:\" 10 20 2>age.txt\n```\n\n此命令将 `textbox` 中输入的文本重定向到\
  \ `age.txt` 文件。\n\n接下来的章节将介绍你在 shell 脚本中常用的某些 dialog 组件的示例。\n\n## msgbox 组件\n\n\
  `msgbox` 组件是最常见的对话框类型。它在窗口中显示简单的消息，并等待用户点击 OK 按钮后才消失。使用 `msgbox` 组件需要以下格式：\n\n```\n\
  dialog --msgbox text height width\n```\n\n`text` 参数是你想放置在窗口中的任何字符串。`dialog` 命令将根据\
  \ `height` 和 `width` 参数自动对文本换行，以适应你创建的窗口大小。如果你想在窗口顶部放置标题，还可以使用 `--title` 参数以及标题文本。这里有一个使用\
  \ `msgbox` 组件的示例：\n\n```\n$ dialog --title Testing --msgbox \"This is a test\" 10\
  \ 20\n```\n\n输入此命令后，消息框将出现在你正在使用的终端模拟器会话屏幕上。图 17.2 显示了它的。\n\n图 17.2：在 dialog 命令中使用\
  \ msgbox 组件\n![17.2](img/c17f002.jpg)\n\n如果你的终端模拟器支持鼠标，你可以点击 OK 按钮关闭对话框。你也可以使用键盘命令来模拟点击——只需按\
  \ Enter 键即可。\n\n## yesno 组件\n\n`yesno` 组件比 `msgbox` 更进一步，允许用户回答窗口中显示的是/否问题。它在窗口底部产生两个按钮，一个用于\
  \ Yes，另一个用于 No。用户可以使用鼠标、Tab 键或键盘方向键在按钮之间切换。要选择按钮，用户可以按下空格键或 Enter 键。\n\n这里使用 `yesno`\
  \ 组件的示例：\n\n```\n$ dialog --title \"Please answer\" --yesno \"Is this thing on?\"\
  \ 10 20\n$ echo $?\n1\n```\n\n这产生了图 17.3 所示的组件。\n\n图 17.3：在 dialog 命令中使用 yesno 组件\n\
  ![17.3](img/c17f003.jpg)\n\n`dialog` 命令的退出状态根据用户选择的按钮而设置。如果选择了 No 按钮，退出状态为 `1`；如果选择了\
  \ Yes 按钮，退出状态为 `0`。\n\n## inputbox 组件\n\n`inputbox` 组件提供了一个简单的文本区域供用户输入文本字符串。`dialog`\
  \ 命令将文本字符串的值发送到 `STDERR`。你必须重定向它来获取答案。图 17.4 展示了 `inputbox` 组件的样子。\n\n图 17.4：inputbox\
  \ 组件\n![17.4](img/c17f0004.jpg)\n\n如图 17.4 所示，`inputbox` 提供两个按钮：OK 和 Cancel。如果选择了\
  \ Cancel 按钮，命令的退出状态为 `1`；否则，退出状态将为 `0`：\n\n```\n$ dialog --inputbox \"Enter your\
  \ age:\" 10 20 2>age.txt\n$ echo $?\n0\n$ cat age.txt\n12\n```\n\n你会发现，当你使用 `cat`\
  \ 命令显示文本内容时，值后面没有换行符。这允许你轻松地将文件内容重定向到 shell 脚本中的变量中，以提取用户输入的字符串。\n\n## textbox 组件\n\
  \n`textbox` 组件是在窗口中显示大量信息的好方法。它会产生一个滚动窗口，其中包含参数中指定的文件的文本：\n\n```\n$ dialog --textbox\
  \ /etc/passwd 15 45\n```\n\n`/etc/passwd` 文件的内容显示在滚动窗口中，如图 17.5 所示。\n\n图 17.5：textbox\
  \ 组件\n![17.5](img/c17f005.jpg)\n\n你可以使用方向键在文本文件中左右滚动，以及上下滚动。窗口底部的行显示了你正在查看的文件百分比位置。`textbox`\
  \ 只包含一个 Exit 按钮，选择该按钮即可退出组件。\n\n## menu 组件\n\n`menu` 组件允许你创建一个我们在本章之前创建的文本菜单的窗口版本。你只需要提供选择标签和每个项的文本：\n\
  \n```\n$ dialog --menu \"Sys Admin Menu\" 20 30 10 1 \"Display disk space\" 2 \"\
  Display users\" 3 \"Display memory usage\" 4 \"Exit\" 2> test.txt\n```\n\n第一个参数定义了菜单的标题。接两个参数定义了菜单窗口的高度和宽度，而第三个参数定义了窗口中一次显示的菜单项数量。如果有更多菜单项，你可以使用方向键进行滚动。\n\
  \n在这些参数之后，你必须添加菜单项对。第一个元素是用于选择菜单项的标签。每个标签对于每个菜单项应该是唯一的，可以通过按下键盘相应的键进行选择。第二个元素是菜单中使用的文本。图\
  \ 17.6 展示了示例命令产生的菜单。\n\n图 17.6：带有菜单项的 menu 组件\n![17.6](img/c17f006.jpg)\n\n\n\n\n\
  \n如果用户通过按下对应标签的键来选择菜单项，该菜单将被将被亮但不会被选中。只有当使用鼠标或 Enter 键选中 OK 按钮时，才会完成选择。`dialog`\
  \ 命令会将选中的菜单项文本发送到 `STDERR`，你可以根据需要对其进行重定向。\n\n## fselect 小部件\n\n`dialog` 命令提供了几个华酷的内置部件。在处理文件名时，`fselect`\
  \ 小部件非常有用。你不需要强制用户输入文件名，而是可以使用 `fselect` 小部件浏览到文件位置并选择文件，如图图 17.7 所示。\n\n图 17.7\
  \ fselect 小部件\n\n![17.7](img/c17f007.jpg)\n\n`fselect` 小部件的格式如下：\n\n```\ndialog\
  \ --title \"Select a file\" --fselect $HOME/ 10 50 2>file.txt\n```\n\n`fselect`\
  \ 选项后的第一个参数是窗口中使用的起始文件夹位置。`fselect` 小部件窗口左侧是目录列表，右侧是显示所选目录中所有文件的列表，以及一个包含当前选中文件或目录的简单文本框。你可以手动在文本框中输入文件名，也可以使用目录和文件列表进行选择。\n\
  \n## dialog 选项\n\n除了标准部件外，你还可以在 `dialog` 命令中自定义许多不同的选项。你已经看到过 `--title` 参数的作用。它允许你为窗口顶部的部件设置标题。\n\
  \n还有许多其他可用选项，允许你完全自定义窗口的外观和行为。表 17.2 显示了 `dialog` 命令的可用选项。\n\n表 17.2 dialog 命令选项\n\
  \n| 选项 | 描述 |\n| :--- | :--- |\n| `--add-widget` | 除非按下 Esc 或 Cancel 按钮，否则进入下一个对话框。\
  \ |\n| `--aspect ratio` | 指定窗口的宽高比。 |\n| `--backtitle title` | 指定显示在屏幕顶部背景上的标题。\
  \ |\n| `--begin x y` | 指定窗口左上角的起始位置。 |\n| `--cancel-label label` | 为 Cancel（取消）按钮指定替代标签。\
  \ |\n| `--clear` | 使用默认的 dialog 背景色清除显示。 |\n| `--colors` | 在 dialog 文字中嵌入 ANSI 颜色代码。\
  \ |\n| `--cr-wrap` | 允许 dialog 文字中包含换行符并强制换行。 |\n| `--create-rc file` | 将示例配置文件导出到指定文件。\
  \ |\n| `--defaultno` | 将是/否对话框的默认值设置为 No（否）。 |\n| `--default-item string` | 设置检查列表、表单或菜单对话框中的默认项。\
  \ |\n| `--exit-label label` | 为 Exit（退出）按钮指定替代标签。 |\n| `--extra-button` | 在 OK 和\
  \ Cancel 按钮之间显示一个额外按钮。 |\n| `--extra-label label` | 为 Extra（额外）按钮指定替代标签。 |\n| `--help`\
  \ | 显示 dialog 命令的帮助信息。 |\n| `--help-button` | 在 OK 和 Cancel 按钮后显示 Help（帮助）按钮。 |\n\
  | `--help-label label` | 为 Help（帮助）按钮指定替代标签。 |\n| `--help-status` | 在选中 Help 按钮后的帮助信息之后写入检查列表、单选列表或表单信息。\
  \ |\n| `--ignore` | 忽略 dialog 不识别的选项。 |\n| `--input-fd fd` | 指定 `STDIN` 的替代文件描述符。\
  \ |\n| `--insecure` | 将密码部件改为输入时显示星号。 |\n| `--item-help` | 为检查列表、单选列表或菜单中的每个标签项在屏幕底部添加帮助列。\
  \ |\n| `--keep-window` | 不从屏幕上清除旧部件。 |\n| `--max-input size` | 指定输入的最大字符串长度。默认值为\
  \ 2048。 |\n| `--nocancel` | 抑制 Cancel（取消）按钮。 |\n| `--no-collapse` | 不将 dialog 文字中的制表符转换为空格。\
  \ |\n| `--no-kill` | 将 tailboxbg dialog 放在后台并禁用进程的 `SIGHUP`。 |\n| `--no-label label`\
  \ | 为 No（否）按钮指定替代标签。 |\n| `--no-shadow` | 不为 dialog 窗口显示阴影。 |\n| `--ok-label label`\
  \ | 为 OK 按钮指定替代标签。 |\n| `--output-fd fd` | 指定 `STDERR` 的替代输出文件描述符。 |\n| `--print-maxsize`\
  \ | 将允许的 dialog 窗口的最大尺寸输出。 |\n| `--print-size` | 将每个 dialog 窗口的尺寸输出。 |\n| `--print-version`\
  \ | 将 dialog 版本信息输出。 |\n| `--separate-output` | 逐行无带引号输出检查列表部件的结果。 |\n| `--separator\
  \ string` | 指定分隔输出的字符串。 |\n| `--separate-output` | 指定分隔输出的字符串。 |\n| `--shadow` |\
  \ 在右侧绘制阴影。 |\n| `--single` | 需要时使用单引号。 |\n| `--sleep sec` | 延迟指定的秒数。 |\n| `--stderr`\
  \ | 将输出发送到 `STDERR`。 |\n| `--stdout` | 将输出发送到 `STDOUT`。 |\n| `--tab` | 将制表符转换为空格。\
  \ |\n| `--tab-len n` | 指定制表符使用的空格数（默认 8）。 |\n| `--timeout sec` | 指定退出前的秒数。 |\n|\
  \ `--title` | 指定标题。 |\n| `--trim` | 领先空格。 |\n| `--yes-label label` | 为 Yes（是）按钮指定替代标签。\
  \ |\n\n## 在脚本中使用 dialog 命令\n\n在脚本中使用 `dialog` 命令非常简单。你只需要记住两点：\n\n*   如果有 Cancel\
  \ 按钮，请检查 `dialog` 命令的退出状态。\n*   重定向 `STDERR` 以获取值。\n\n如果你遵循这两个规则，你就将拥有看起来专业的交互式脚本。这是一个使用我们之前创建的\
  \ dialog 部件的示例：\n\n```bash\n#!/bin/bash\n# 使用 dialog 创建菜单\ntemp=$(mktemp -t test.XXXXXX)\n\
  temp2=$(mktemp -t test2.XXXXXX)\n\nfunction diskspace() {\n  df -k > $temp\n  dialog\
  \ --textbox $temp 20 60\n}\n\nfunction whoseon() {\n  who > $temp\n  dialog --textbox\
  \ $temp 20 50\n}\n\nfunction memusage() {\n  cat /proc/meminfo > $temp\n  dialog\
  \ --textbox $temp 20 50\n}\n\nwhile [ 1 ]\ndo\n  dialog --menu \"Sys Admin Menu\"\
  \ 20 30 10 \\\n  1 \"Display disk space\" \\\n  2 \"Display users\" \\\n  3 \"Display\
  \ memory usage\" \\\n  0 \"Exit\" 2> $temp2\n\n  if [ $? -eq 1 ];\n  then\n    break\n\
  \  fi\n\n  selection=$(cat $temp2)\n  case $selection in\n    1)\n      diskspace\
  \ ;;\n    2)\n      whoseon ;;\n    3)\n      memusage ;;\n    0)\n      break ;;\n\
  \    *)\n      dialog --msgbox \"Sorry, invalid selection\" 10 30 ;;\n  esac\ndone\n\
  \nrm -f $temp 2> /dev/null\nrm -f $temp2 2> /dev/null\n```\n\n该脚本使用带有恒真值的 `while`\
  \ 循环来创建一个无限循环，显示菜单对话框。这意味着在执行完每个函数后，脚本都会返回到显示菜单。\n\n\n\n\n\n菜单对话框包含一个“取消”按钮，因此脚本会检查\
  \ `dialog` 命令的退出状态，以防用户按下“取消”按钮退出。因为它位于一个 `while` 循环中，退出只需使用 `break` 命令跳出 `while`\
  \ 循环即可。\n\n脚本使用 `mktemp` 命令创建两个临时文件，用于存储 `dialog` 命令的数据。第一个文件 `$temp` 用于存储 `df`\
  \ 和 `meminfo` 命令的输出，以便它们在文本框对话框中显示（请参见 图 17.8）。第二个临时文件 `$temp2` 用于存储来自主菜单对话框的选择值。\n\
  \n图 17.8 使用文本框对话框选项显示的 `meminfo` 命令输出\n\n![17.8](img/c17f008.jpg)\n\n现在这看起来越来越像一个可以展示给别人看的真实应用程序了！\n\
  \n## 获取图形界面\n\n如果你正在为你的交互式脚本寻找更多图形界面，你可以更进一步。KDE 和 GNOME 桌面环境（见第 1 章）都扩展了 `dialog`\
  \ 命令的概念，并包含了可以为各自环境生成 X Windows 图形小部件的命令。\n\n本节介绍了 `kdialog` 和 `zenity` 软件包，它们分别为\
  \ KDE 和 GNOME 桌面提供了图形窗口小部件。\n\n## KDE 环境\n\nKDE 图形环境默认包含 `kdialog` 软件包。`kdialog`\
  \ 包使用 `kdialog` 命令在你的 KDE 桌面中生成标准窗口，类似于 `dialog` 风格的小部件。然而，这些窗口并没有笨拙的感觉，而是与你其他的\
  \ KDE 应用程序完美融合在一起！这允许你直接从 shell 脚本生成 Windows 级质量的用户界面！\n\n### 注意\n\n仅仅因为你的 Linux\
  \ 发行版使用了 KDE 桌面，并不意味着它默认安装了 `kdialog` 软件包。你可能需要从发行版仓库手动安装它。\n\n### kdialog 小部件\n\
  \n与 `dialog` 命令一样，`kdialog` 命令使用命令行选项来指定要使用哪种类型的窗口小部件。以下是 `kdialog` 命令的格式：\n\n```\n\
  kdialog display-options window-options arguments\n```\n\n`window-options` 选项允许你指定使用哪种类型的窗口小部件。可用选项如表\
  \ 17.3 所示。\n\n表 17.3 kdialog 窗口选项\n\n| 选项 | 说明 |\n| -- | -- |\n| --checklist title\
  \ [tag item status] | 复选列表菜单，用状态位指定项目是否被选中。 |\n| --error text | 错误消息框。 |\n| --inputbox\
  \ text [init] | 输入文本框。你可以使用 `init` 值指定默认值。 |\n| --menu title [tag item] | 菜单选择框标题和一组由标签标识的项目列表。\
  \ |\n| --msgbox text | 带有指定文本的简单消息框。 |\n| --password text | 隐藏用户输入的密码输入文本框。 |\n\
  | --radiolist title [tag item status] | 单选列表菜单，用状态位指定项目是否被选中。 |\n| --separate-output\
  \ | 为复选列表和单选列表菜单分行返回项目。 |\n| --sorry text | 抱歉消息框。 |\n| --textbox file [width] [height]\
  \ | 显示文件内容的文本框，也可通过宽度和高度指定。 |\n| --title title | 为对话框的标题栏区域指定标题。 |\n| --warningyesno\
  \ text | 带有“是”和“否”按钮的警告消息框。 |\n| --warningcontinuecancel text | 带有“继续”和“取消”按钮的警告消息框。\
  \ |\n| --warningyesnocancel text | 带有“是”、“否”和“取消”按钮的警告消息框。 |\n| --yesno text | 带有“是”和“否”按钮的问框。\
  \ |\n| --yesnocancel text | 带有“是”、“否”和“取消”按钮的问框。 |\n\n如你从表 17.3 所示，所有的标准窗口对话框类型都被包含了。然而，当你使用\
  \ `kdialog` 窗口小部件时，它作为 KDE 桌面上的独立窗口出现，而不是在终端模拟器会话内部！\n\n复选列表和单选列表小部件允许你在列表中定义单个项目，以及它们默认是否被选中：\n\
  \n```\n$kdialog --checklist \"Items I need\" 1 \"Toothbrush\" on 2 \"Toothpaste\"\
  \ off 3 \"Hair brush\" on 4 \"Deodorant\" off 5 \"Slippers\" off\n```\n\n生成的复选列表窗口显示在图\
  \ 17.9 中。\n\n图 17.9 kdialog 复选列表对话框窗口\n\n![17.9](img/c17f009.jpg)\n\n指定为 \"on\"\
  \ 的项目在复选列表中高亮显示。要在复选列表中选择或取消某个项目，只需点击它。如果你点击了“确定”按钮，`kdialog` 将将标签值发送到 `STDOUT`：\n\
  \n```\n\"1\" \"3\" \"5\" \n```\n\n当你按下回车键时，`kdialog` 框带有选择结果。当你点击“确定”或“取消”按钮时，`kdialog`\
  \ 命令会将每个标签作为字符串值返回到 `STDOUT`（这些就是你在输出中看到的 \"1\"、3\" 和 \"5\"）。你的脚本必须能够解析结果值并将其与原始值进行匹配。\n\
  \n### 使用 kdialog\n\n你可以像使用 `dialog` 小部件一样，在 shell 脚本中使用 `kdialog` 窗口小部件。主要的区别在于\
  \ `kdialog` 窗口小部件通过 `STDOUT` 而不是 `STDERR` 输出。\n\n这里有一个将之前创建的系统管理员菜单转换为 KDE 的脚本：\n\
  \n```bash\n$ cat menu4\n\n#!/bin/bash\n\n# 使用 kdialog 创建菜单\n\ntemp='mktemp -t temp.XXXXXX'\n\
  temp2='mktemp -t temp2.XXXXXX'\n\nfunction diskspace {\n    df -k > $temp\n    kdialog\
  \ --textbox $temp 1000 10\n}\n\nfunction whoseon {\n    who > $temp\n    kdialog\
  \ --textbox $temp 500 10\n}\n\nfunction memusage {\n    cat /proc/meminfo > $temp\n\
  \    kdialog --textbox $temp 300 500\n}\n\nwhile [ 1 ]\ndo\nkdialog --menu \"Sys\
  \ Admin Menu\" \"1\" \"Display diskspace\" \"2\" \"Display users\" \"3\" \"Display\
  \ memory usage\" \"0\" \"Exit\" > $temp2\nif [ $? -eq 1 ]\nthen\n    break\nfi\n\
  selection='cat $temp2'\ncase $selection in\n1)\n    diskspace ;;\n2)\n    whoseon\
  \ ;;\n3)\n    memusage ;;\n0)\n    break ;;\n*)\n    kdialog --msgbox \"Sorry, invalid\
  \ selection\"\nesac\ndone\n$\n```\n\n使用 `kdialog` 和 `dialog` 命令在脚本上没有太大区别。生成的主菜单显示在图\
  \ 17.10 中。\n\n图 17.10 使用 kdialog 的系统管理员脚本\n\n![17.10](img/c17f010.jpg)\n\n现在你的简单\
  \ shell 脚本看起来就像一个真实的应用程序了！你的交互式脚本可以发挥无限可能。\n\n## GNOME 环境\n\nGNOME 图形环境支持两个生成标准窗口的流行软件包：\n\
  \n*   `gdialog`\n*   `zenity`\n\n`zenity` 是大多数 GNOME Linux 发行版中最常见的软件包（在 Ubuntu\
  \ 和 Fedora 中都是默认安装）。本节介绍了 `zenity` 的功能，并演示了如何在 shell 脚本中使用它。\n\n### zenity 小部件\n\
  \n正如所料，`zenity` 允许你通过命令行选项创建不同的窗口小部件。表 17.4 显示了 `zenity` 可以产生的不同部件。\n\n| 选项 | 说明\
  \ |\n| -- | -- |\n| --calendar | 显示全月日历。 |\n| --entry | 显示文本输入对话框。 |\n| --error\
  \ | 显示错误消息对话框。 |\n| --file-selection | 显示完整路径和文件名对话框。 |\n| --info | 显示信息提示对话框。 |\n\
  | --list | 显示复选列表或单选列表对话框。 |\n| --notification | 显示通知图标。 |\n| --progress | 显示进度条对话框。\
  \ |\n| --question | 显示是/否问题对话框。 |\n\n\n\n\n\n| --scale | 显示一个比例对话框。 |\n| --text-info\
  \ | 显示一个包含文本的文本框。 |\n| --warning | 显示一个警告对话框。 |\n\n`zenity` 命令行程序的工作方式与 `kdialog`\
  \ 和 `dialog` 程序略有不同。许多组件类型是通过使用命令行上的额外选项定义的，而不是将它们作为选项的参数包含。\n\n`zenity` 命令确实提供了一些非常酷的高级对话框。`calendar`\
  \ 选项可以生成一个完整的月份日历，如图 17.11 所示。\n\n图 17.11 `zenity` 日历对话框\n\n![17.11](img/c17f011.jpg)\n\
  \n当你从日历中选择一个日期时，`zenity` 命令会将该值返回给 `STDOUT`，就像 `kdialog` 一样：\n\n```\n$ zenity --calendar\n\
  12/25/2011\n$\n```\n\n`zenity` 中另一个非常酷的窗口是文件选择选项，如图 17.12 所示。\n\n图 17.12 `zenity`\
  \ 文件选择对话框\n\n![17.12](img/c17f012.jpg)\n\n你可以使用对话框浏览到系统上的任何目录位置（只要你有查看该目录的权限）并选择文件。当你选择文件时，`zenity`\
  \ 命令会返回完整的文件和路径：\n\n```bash\n$ zenity --file-selection\n/home/ubuntu/menu5\n$\n\
  ```\n\n有了这些工具供你使用，你的 shell 脚本创作将无尽可能！\n\n## 在脚本中使用 zenity\n\n正如你预期的那样，zenity 在 shell\
  \ 脚本中表现良好。遗憾的是，zenity 选择没有遵循 `dialog` 和 `kdialog` 使用的选项规范，因此将现有的交互式脚本转换为 `zenity`\
  \ 可能具有挑战性。\n\n在将系统管理员菜单从 `kdialog` 转换为 `zenity` 时，我们发现我们必须对组件定义进行大量的操作：\n\n```bash\n\
  $cat menu5\n#!/bin/bash\n\n# 使用 zenity 创建菜单\n\ntemp='mktemp -t temp.XXXXXX'\ntemp2='mktemp\
  \ -t temp2.XXXXXX'\nfunction diskspace {\n    df -k > $temp\n    zenity --text-info\
  \ --title \"Disk space\" --filename=$temp --width 750 --height 10\n}\n\nfunction\
  \ whoseon {\n    who > $temp\n    zenity --text-info --title \"Logged in users\"\
  \ --filename=$temp --width 500 --height 10\n}\n\nfunction memusage {\n    cat /proc/meminfo\
  \ > $temp\n    zenity --text-info --title \"Memory usage\" --filename=$temp --width\
  \ 300 --height 500\n}\n\nwhile [ 1 ]\ndo\n    zenity --list --radiolist --title\
  \ \"Sys Admin Menu\" --column \"Select\" --column \"Menu Item\" FALSE \"Display\
  \ diskspace\" FALSE \"Display users\" FALSE \"Display memory usage\" FALSE \"Exit\"\
  \ > $temp2\n    if [ $? -eq 1 ]\n    then\n        break\n    fi\n    selection='cat\
  \ $temp2'\n    case $selection in\n        \"Display disk space\")\n           \
  \ diskspace ;;\n        \"Display users\")\n            whoseon ;;\n        \"Display\
  \ memory usage\")\n            memusage ;;\n        Exit)\n            break ;;\n\
  \        *)\n            zenity --info \"Sorry, invalid selection\"\n    esac\n\
  done\n$\n```\n\n由于 `zenity` 不支持菜单对话框，我们使用单选列表（radiolist）类型的窗口作为主菜单，如图 17.13 所示。\n\
  \n图 17.13 使用 zenity 的系统管理员菜单\n\n![17.13](img/c17f013.jpg)\n\n单选列表使用两列，每列都有一个标题。第一列包含用于选择的单选按钮。第二列是项目文本。单选列表也没有为项目使用标签。当你选择一个项目时，该该项目的完整文本将返回到\
  \ `STDOUT`。这让 `case` 命令变得变得稍微有趣了一些。你必须在 `case` 选项中使用项目中的完整文本。如果文本中包含任何空格，你需要在文本周围使用引号。\n\
  \n使用 `zenity` 软件包，你可以为 GNOME 桌面环境中的交互式 shell 脚本添加 Windows 风格。\n\n## 总结\n\n交互式 shell\
  \ 脚本通常以单调和无聊而闻名。你可以通过使用大多数 Linux 系统上提供的几种不同技术和工具来改变这一点。首先，你可以通过 `case` 命令和 shell\
  \ 脚本函数为你的交互式脚本创建菜单系统。\n\n`case` 命令允许你使用标准的 `echo` 命令绘制菜单，并使用 `read` 命令读取用户的响应。然后\
  \ `case` 命令将根据输入的值选择相应的 shell 脚本函数。\n\n`dialog` 程序提供了几个预构建的文本组件，用于在基于的终端模拟器上创建类似\
  \ Windows 的对象。你可以使用 `dialog` 程序创建用于显示文本、输入文本以及选择文件和日期的对话框。这有助于为你的 shell 脚本带来更多活力。\n\
  \n如果你在图形化的 X Windows 环境中运行 shell 脚本，你还可以在交互式脚本中使用更多的工具。对于 KDE 桌面，有 `kdialog` 程序。该程序提供了简单的命令，用于创建所有基本\
  \ Windows 功能的窗口组件。对于 GNOME 桌面，有 `gdialog` 和 `zenity` 程序。这些程序中的每一个提供的窗口组件都能像真实的 Windows\
  \ 应用程序一样融入 GNOME 桌面中。\n\n下一章将深入探讨编辑和处理文本数据文件的主题。通常，shell 脚本最大的用途围绕着解析和显示日志文件和错误文件等文本文件中的数据。Linux\
  \ 环境包含了两个非常有用的工具 `sed` 和 `gawk`，用于在 shell 脚本中处理文本数据。下一章将向你介绍这些工具，并展示如何使用它们的基础知识。\n\
  \n# 第 18 章：介绍 sed 和 gawk\n\n### 本章内容\n- 文本处理\n- `sed` 编辑器基础\n\n到目前，人们使用 shell 脚本最常见的功能之一就是处理文本文件。在检查日志文件、读取配置文件和处理数据元素之间，shell\
  \ 脚本可以帮助自动化处理文本文件中任何类型数据的任务。Linux 环境包含了两个非常有用的工具 `sed` 和 `gawk`，用于在 shell 脚本中处理文本数据。然而，仅使用\
  \ shell 脚本来操作文本文件可能会有些笨拙。如果你在 shell 脚本中执行任何类型的数据操作，你将需要熟悉 Linux 提供的这些工具。\n\n## 文本处理\n\
  \n第 9 章向你展示了如何使用 Linux 环境中不同的编辑器来编辑文本文件。这些编辑器允许你通过简单的命令或鼠标点击轻松地操作文件中的文本。但在某些情况下，你会发现自己想要实时处理文本文件中的内容，无需调用完整的交互式文本编辑器。在这种情况下，如果有一个简单的命令行编辑器可以轻松地格式化、插入、修改或删除文本将非常有用。Linux\
  \ 系统提供了两种常用的工具来实现这些功能。本节描述了 Linux 世界中最流行的两种命令行编辑器：`sed` 和 `gawk`。\n\n## sed 编辑器\n\
  \n`sed` 编辑器被称为流编辑器，而不是普通的交互式文本编辑器。在交互式文本编辑器（如 `vim`）中，你交互式地使用键盘命令插入、删除或替换文本。流编辑器则根据你预先提供的一组规则对数据流进行编辑。\n\
  \n`sed` 编辑器根据你输入命令行或存储在命令文本文件中的命令来操作数据流中的数据。它每次从输入读取一行数据，将该数据与提供的编辑器命令匹配，根据命令更改流中的数据，并将新数据输出到\
  \ `STDOUT`。当流编辑器对一行数据匹配了所有命令后，会读取下一行数据并重复该过程。当流编辑器处理完流中的所有行后，它就会终止。\n\n\n\n\n由于命令是按行顺序应用的，`sed`\
  \ 编辑器只需要对数据流进行一次扫描即可完成。这使得 `sed` 编辑器比交互式编辑器快得多，并允许你对文件中的数据进行快速实时更改。\n\n`sed` 命令的使用格式为：\n\
  \n`sed options script file`\n\n`options` 参数允许你自定义 `sed` 命令的行为，包含了 表 18.1 所示的选项。\n\
  \n### 表 18.1 sed 命令选项\n\n| 选项 | 描述 |\n| - | - |\n| `-e script` | 将脚本中指定的命令添加到处理输入时运行的命令中。\
  \ |\n| `-f file` | 将文件中指定的命令添加到处理输入时运行的命令中。 |\n| `-n` | 不为每个命令产生输出，而是等待打印命令。 |\n\
  \n`script` 参数指定了要应用于流数据的单个命令。如果需要一个或多个命令，你必须使用 `-e` 选项在命令行中指定它们，或者使用 `-f` 选项在单独的文件中指定。有许多命令可用于处理数据。我们将在本章后面检查\
  \ `sed` 编辑器使用的一些基本命令，然后在第 20 章查看一些更高级命令。\n\n#### 在命令行中定义编辑器命令\n\n默认情况下，`sed` 编辑器将指定的命令应用于\
  \ `STDIN` 输入流。这允许你将数据直接管道到 `sed` 编辑器进行处理。这里有一个演示如何操作的快速示例：\n\n```bash\n$ echo \"\
  This is a test\" | sed 's/test/big test/'\nThis is a big test\n```\n\n此示例使用了 `sed`\
  \ 编辑器中的 `s` 命令。`s` 命令将正斜杠指定的第一个文本字符串模式替换为第二个文本字符串。在这个示例中，单词 `big test` 替换了单词 `test`。\n\
  \n当你运行此示例时，结果几乎会瞬间显示。这就是使用 `sed` 编辑器的强大之处。你可以在大约启动某些交互式编辑器所需的时间内，对数据进行多次编辑。\n\n\
  当然，这个简单的测试只编辑了一行数据数据。在编辑完整的数据文件时，你也应该会获得同样快速的结果：\n\n```bash\n$ cat data1\nThe quick\
  \ brown fox jumps over the lazy dog.\nThe quick brown fox jumps over the lazy dog.\n\
  The quick brown fox jumps over the lazy dog.\nThe quick brown fox jumps over the\
  \ lazy dog.\n\n$ sed 's/dog/cat/' data1\nThe quick brown fox jumps over the lazy\
  \ cat.\nThe quick brown fox jumps over the lazy cat.\nThe quick brown fox jumps\
  \ over the lazy cat.\nThe quick brown fox jumps over the lazy cat.\n```\n\n`sed`\
  \ 命令执行并几乎瞬间返回数据。当它处理每行数据时，结果就会显示出来。你会在 `sed` 编辑器完成整个文件的处理之前开始看到结果。需要注意的是，`sed` 编辑器不会修改文本文件中的数据。它只是将修改后的文本发送到\
  \ `STDOUT`。如果你查看文本文件，它仍然原始数据：\n\n```bash\n$ cat data1\nThe quick brown fox jumps\
  \ over the lazy dog.\nThe quick brown fox jumps over the lazy dog.\nThe quick brown\
  \ fox jumps over the lazy dog.\nThe quick brown fox jumps over the lazy dog.\n```\n\
  \n#### 在命令行中使用多个编辑器命令\n\n要从 `sed` 命令行执行多一个命令，只需使用 `-e` 选项：\n\n```bash\n$ sed -e\
  \ 's/brown/green/; s/dog/cat/' data1\nThe quick green fox jumps over the lazy cat.\n\
  The quick green fox jumps over the lazy cat.\nThe quick green fox jumps over the\
  \ lazy cat.\nThe quick green fox jumps over the lazy cat.\n```\n\n两个命令都应用于文件中的每行数据。命令之间必须用分号隔开，命令结束与分号之间不应有任何空格。与其使用分号分隔命令，你可以使用\
  \ `bash` shell 的次级提示符。只需输入第一个引号打开脚本，`bash` 将继续提示输入更多命令，直到你输入结束引号：\n\n```bash\n$\
  \ sed -e '\n> s/brown/green/\n> s/fox/elephant/\n> s/dog/cat/' data1\nThe quick\
  \ green elephant jumps over the lazy cat.\nThe quick green elephant jumps over the\
  \ lazy cat.\nThe quick green elephant jumps over the lazy cat.\nThe quick green\
  \ elephant jumps over the lazy cat.\n```\n\n你必须记住在结束引号出现的同一行上完成命令。一旦 `bash` shell\
  \ 检测到结束引号，它就会处理该命令。一旦开始，`sed` 命令会将你指定的每个命令应用于文本文件中的每行数据。\n\n#### 从文件中读取编辑器命令\n\n\
  最后，如果你有许多 `sed` 命令需要处理，通常将它们存储在单独的文件中更简单。使用 `-f` 选项在 `sed` 命令中指定文件：\n\n```bash\n\
  $ cat script1\ns/brown/green/\ns/fox/elephant/\ns/dog/cat/\n\n$ sed -f script1 data1\n\
  The quick green elephant jumps over the lazy cat.\nThe quick green elephant jumps\
  \ over the lazy cat.\nThe quick green elephant jumps over the lazy cat.\nThe quick\
  \ green elephant jumps over the lazy cat.\n```\n\n在这种情况下，你不需要在每个命令后都加分号。`sed` 编辑器知道每行包含一个独立的命令。与在命令行上输入命令一样，`sed`\
  \ 编辑器从指定文件中读取命令并将其应用于数据文件中的每行。\n\n#### gawk 程序\n\n虽然 `sed` 编辑器是实时修改文本文件的方便工具，但它也有其局限性。通常，你需要一个更高级的工具来处理文件中的数据，一个能够提供更像编程的环境、允许你修改和重新组织文件中数据的工具。这就是\
  \ `gawk` 派上用场的地方。\n\n`gawk` 程序是 Unix 原 `awk` 程序的 GNU 版本。`gawk` 程序通过提供编程语言而非简单的编辑器命令，将流编辑推向前了一步。在\
  \ `gawk` 语言中，你可以执行以下操作：\n\n* 定义变量来存储数据。\n* 使用算术和字符串运算符对数据进行操作。\n* 使用结构化编程概念（如 `if-then`\
  \ 语句和循环）为你的数据处理添加逻辑。\n* 通过提取数据文件中的数据元素并将其重新排列为另一种顺序或格式，生成格式化报告。\n\n`gawk` 程序的报告生成能力通常用于从大型文本文件中提取数据元素并将其格式化为可读的报告。这方面的完美例子就是格式化日志文件。试图仔细查看日志中的错误行是很。`gawk`\
  \ 程序允许你从日志文件中过滤出你想要查看的数据元素，然后以易于阅读重要数据的方式进行格式化。\n\n#### gawk 命令格式\n\n`gawk` 程序的基本格式如下：\n\
  \n`gawk options program file`\n\n表 18.2 显示了 `gawk` 程序可用的选项。\n\n### 表 18.2 gawk 选项\n\
  \n| 选项 | 描述 |\n| - | - |\n| `-F fs` | 指定文件分隔符以界定行数据字段。 |\n| `-f file` | 指定用于读取程序的文件。\
  \ |\n| `-v var=value` | 定义 `gawk` 程序中使用的变量和默认值。 |\n| `-mf N` | 指定数据文件中要处理的最大字段数。\
  \ |\n| `-mr N` | 指定数据文件中最大的记录大小。 |\n| `-W keyword` | 为 `gawk` 指定兼容模式或警告级别。 |\n\n\
  \n\n\n\n命令行选项提供了一种自定义 `gawk` 程序特性的方便方法。在探索 `gawk` 的过程中，我们将更深入地研究这些选项。\n\n`gawk`\
  \ 的强大在于程序脚本。你可以编写脚本来读取文本行中的数据，然后对数据进行处理和显示，以创建任何类型的输出报告。\n\n## 从命令行读取程序脚本\n\n`gawk`\
  \ 程序脚本通过大括号的开启和关闭来定义。你必须将脚本命令放在两个大括号之间。由于 `gawk` 命令行假设脚本是一个文本字符串，因此你必须将脚本包含在单引号中。以下是一个在命令行上指定的简单\
  \ `gawk` 程序脚本示例：\n\n```\n$ gawk '{print “Hello John!”}’\n```\n\n该程序脚本定义了一个命令，即 `print`\
  \ 命令。`print` 命令的作用正如其名：它将文本打印到 `STDOUT`。如果你尝试运行此命令，你可能会有些失望，因为并不会立即发生任何事情。由于命令行中没有定义文件名，`gawk`\
  \ 程序将从 `STDIN` 获取数据。当你运行程序时，它只是在等待通过 `STDIN` 输入的文本。\n\n如果你输入一行文本并按下回车键，`gawk` 将通过程序脚本运行该文本：\n\
  \n```\n$ gawk '{print “Hello John!”}’\nThis is a test\nHello John!\nhello\nHello\
  \ John!\nThis is another test\nHello John!\n$\n```\n\n就像 `sed` 编辑器一样，`gawk` 程序会对数据流中的每行文本执行程序脚本。由于程序脚本被设置为显示固定的文本字符串，无论你在数据流中输入什么文本，你将得到相同的文本输出。\n\
  \n要终止 `gawk` 程序，你必须指示数据流已结束。`bash` shell 提供了一个键组合来生成文件结束（EOF）字符。`Ctrl+D` 键组合会在 `bash`\
  \ 中生成一个 EOF 字符。使用该键组合可以终止 `gawk` 程序并返回命令行界面提示符。\n\n## 使用数据字段变量\n\n`gawk` 的主要功能之一是处理文本文件中数据的能力。它通过自动为行中的每个数据元素分配变量来实现这一点。默认情况下，`gawk`\
  \ 为其在文本行中检测到的每个数据字段分配以下变量：\n\n- `$0` 代表整行文本。\n- `$1` 代表文本行中的第一个数据字段。\n- `$2` 代表文本行中的第二个数据字段。\n\
  - `$n` 代表文本行中的第 n 个数据字段。\n\n文本行中的每个数据字段是通过字段分隔符确定的。当 `gawk` 读取一行文本时，它使用定义的字段分隔符来划分每个数据字段。`gawk`\
  \ 中默认的字段分隔符是任何空白字符（如制表符或空格）。\n\n以下是一个 `gawk` 程序示例，它读取文本文件并仅显示第一个数据字段的值：\n\n```\n\
  $ cat data3\nOne line of test text.\nTwo lines of test text.\nThree lines of test\
  \ text.\n$\n\n$ gawk '{print $1}' data3\nOne\nTwo\nThree\n$\n```\n\n该程序使用 `$1` 字段变量仅显示每行文本的第一个字段。\n\
  \n如果你正在读取一个使用不同字段分隔符的文件，可以使用 `-F` 选项指定它：\n\n```\n$ gawk -F: '{print $1}' /etc/passwd\n\
  root\ndaemon\nbin\nsys\nsync\ngames\nman\nlp\nmail\n...\n```\n\n这个短程序显示了系统密码文件中的第一个数据字段。由于\
  \ `/etc/passwd` 文件使用冒号分隔数据字段，如果你想分离每个数据元素，必须在 `gawk` 选项中指定指定字段分隔符。\n\n## 在程序脚本中使用多个命令\n\
  \n如果只能执行一个命令，那么编程语言将非常不好用。`gawk` 语言允许你将命令组合成一个正常的程序。要在命令行指定的程序脚本中使用多个命令，只需在每个命令之间放置一个分号即可：\n\
  \n```\n$ echo \"My name is Rich\" | gawk '{$4=\"Christine\"; print $0}'\nMy name\
  \ is Christine\n$\n```\n\n第一个命令为 `$4` 字段变量分配一个值。第二个命令打印整个数据字段。你也可以使用次级提示符逐个输入命令：\n\
  \n```\n$ gawk '{\n> $4=\"testing\"\n> print $0\n}'\nThis is another test\n$\n```\n\
  \n## 从文件读取程序\n\n与 `sed` 编辑器一样，`gawk` 程序允许你将程序存储在文件中并引用它们：\n\n```\n$ gawk -F: '{print\
  \ $1}' /etc/passwd\nroot\ndaemon\nbin\nsys\nsync\ngames\nman\nlp\nmail\n...\n```\n\
  \n## 在数据处理之前运行脚本\n\n`gawk` 程序允许你指定程序脚本运行的时机。默认情况下，`gawk` 读取一行文本，然后在该文本上执行程序脚本。有时你可能需要在处理数据之前运行脚本，例如为报告创建表头。`BEGIN`\
  \ 关键字用于实现这一点。它强制 `gawk` 在读取数据之前执行 `BEGIN` 关键字之后指定的脚本：\n\n```\n$ gawk 'BEGIN{print\
  \ \"Hello World!\"}'\nHello World!\n$\n```\n\n如果你想用普通程序脚本处理数据，必须使用另一个脚本部分来定义程序：\n\
  \n```\n$ cat data4\nLine 1\nLine 2\nLine 3\n$\n\n$ gawk 'BEGIN{print \"The data4\
  \ File Contents:\"} {print $0}' data4\nThe data4 File Contents:\nLine 1\nLine 2\n\
  Line 3\n$\n```\n\n## 在处理数据后运行脚本\n\n与 `BEGIN` 关键字类似，`END` 关键字允许你指定一个 `gawk` 在读取数据后执行的程序脚本：\n\
  \n```\n$ gawk 'BEGIN{print \"The data4 File Contents:\"} {print $0} END{print \"\
  End of File\"}' data4\nThe data4 File Contents:\nLine 1\nLine 2\nLine 3\nEnd of\
  \ File\n$\n```\n\n\n\n\n当 `gawk` 程序完成文件内容的打印后，它会执行 `END` 脚本中的命令。这是一个在处理完所有普通数据后为报告添加页脚数据的极佳技巧。\n\
  \n你可以将所有这些元素组合成一个精美的程序脚本文件，以便从简单的数据文件中创建一个完整的报告：\n\n```bash\ncat script4\nBEGIN\
  \ {\n  print \"The latest list of users and shells\"\n  print \"Userid       Shell\"\
  \n  print \"--------       -------\"\n  FS=\":\"\n}\n{\n  print $1      \"\" $7\n\
  }\nEND {\n  print \"This concludes the listing\"\n}\n```\n\n该脚本使用 `BEGIN` 脚本为报告创建了一个头部部分。它还定义了一个名为\
  \ `FS` 的特殊变量。这是定义字段分隔符的另一种方法。通过这种方式，你不需要依赖脚本用户在命令行选项中定义字段分隔符。\n\n以下是运行此 `gawk` 程序脚本的某些截略输出：\n\
  \n```bash\ngawk -f script4 /etc/passwd\nThe latest list of users and shells\nUserid\
  \       Shell\n--------       -------\nroot        /bin/bash\ndaemon      /bin/sh\n\
  bin         /bin/sh\n...\nSamantha    /bin/bash\nTimothy     /bin/sh\nChristine\
  \    /bin/sh\nThis concludes the listing\n```\n\n如所预期，`BEGIN` 脚本创建了头部文本，程序脚本处理了指定数据文件（`/etc/passwd`\
  \ 文件）中的信息，而 `END` 脚本产生了页脚文本。\n\n这让你领略了使用简单 `gawk` 脚本时可用的力量。第 21 章描述了适用于你的 `gawk`\
  \ 脚本的一些更基本的编程原理，以及你可以在 `gawk` 程序脚本中更高级的编程概念，以便从最晦的数据文件中创建看起来专业的报告。\n\n# Sed 编辑器基础\n\
  \n成功使用 `sed` 编辑器的关键在于了解它的许多命令和格式，这些可以帮助你自定义文本编辑。本节描述了你可以纳入脚本的一些基本命令和功能，以开始使用 `sed`\
  \ 编辑器。\n\n## 更多替换选项\n\n你已经看到如何使用 `s` 命令用新文本替换行中的文本。然而，替换命令还有几个额外的选项可用，可以让你的工作变得更轻松。\n\
  \n### 替换标志\n\n替换命令在文本字符串中替换匹配模式时有一个注意事项。看这个示例中发生了什么：\n\n```bash\ncat data5\nThis\
  \ is a test of the test script.\nThis is the second test of the test script.\n```\n\
  \n```bash\nsed 's/test/trial/' data5\nThis is a trial of the test script.\nThis\
  \ is the second trial of the test script.\n```\n\n`substitute` 命令在替换多行文本时运行良好，但默认情况下它只替换每行中的第一次出现。要让替换命令作用于文本的不同出现处，你必须使用替换标志。替换标志设置在替换命令字符串之后：\n\
  \n`s/pattern/replacement/flags`\n\n共有四种类型的替换标志：\n\n- 一个数字，表示应该用新文本替换的模式出现次数。\n-\
  \ `g` — 表示应该用新文本替换现有文本的所有出现处。\n- `p` — 表示应该打印原始行的内容。\n- `w file` — 将替换结果写入文件。\n\n\
  在第一种替换中，你可以指定 `sed` 编辑器应该为匹配模式的哪一次出现替换新文本：\n\n```bash\nsed 's/test/trial/2' data5\n\
  This is a test of the trial script.\nThis is the second test of the trial script.\n\
  ```\n\n由于指定了 `2` 作为替换标志，`sed` 编辑器只替换每行中第二次出现的模式。`g` 替换标志允许你替换文本中模式的所有出现处：\n\n```bash\n\
  sed 's/test/trial/g' data5\nThis is a trial of the trial script.\nThis is the second\
  \ trial of the test script.\n```\n\n`p` 替换标志打印包含文本中匹配模式的行。\n\n```bash\nsed 's/test/trial/'\
  \ data5\nThis is a trial of the test script.\nThis is the second trial of the test\
  \ script.\n```\n\n```bash\nsed -n 's/test/trial/p' data5\nThis is a trial of the\
  \ test script.\nThis is the second trial of the test script.\n```\n\n`w` 替换标志将替换结果写入文件。\n\
  \n## 替换字符\n\n有时你运行的字符并不容易使用。一个例子是正斜杠。例如，如果你想替换 `/etc/passwd` 中的 bash shell，你必须这样做：\n\
  \n```bash\nsed 's/\\/bash/\\/bin\\/sh/' /etc/passwd\n```\n\n因为正斜杠被用作分隔符，为了解决这个问题，`sed`\
  \ 编辑器允许你使用不同的字符：\n\n```bash\nsed 's!bash!/bin/sh!' /etc/passwd\n```\n\n## 使用地址\n\
  \n默认情况下，你使用的命令适用于所有行。如果你只想对特定行或一组行应用命令，必须使用行地址（address）。行地址有两种形式：\n\n- 数字范围\n- 文本模式\
  \ 全这两种形式对 `address` 均使用相同的格式：\n\n你还可以为特定地址组合多个命令：\n\n```sed\naddress {\n  command1\n\
  \  command2\n  command3\n}\n```\n\n`sed` 编辑器将每个命令都应用到匹配的行。\n\n### 数字行地址\n\n使用数字地址时，你通过行在文本流中的位置来引用行。`sed`\
  \ 编辑器将文本流中的第一行分配为行一，并对每个新行继续顺序计数。\n\n你在命令中指定的地址可以是单个数字，也可以是由起始数字、逗号和结束数字指定的行范围。这里有一个指定\
  \ `sed` 命令将应用的行号的示例：\n\n```bash\nsed '2s/dog/cat/' data1\nThis is a test of the\
  \ test script.\nThe brown fox jumps over the lazy cat.\nThis is the second test\
  \ of the test script.\nThis is the fourth line.\n```\n\n`sed` 编辑器根据地址仅修改了行二的文本。这是另一个例子，这次使用了行地址范围：\n\
  \n```bash\nsed '2,3s/dog/cat/' data1\nThis is a test of the test script.\nThe brown\
  \ fox jumps over the lazy cat.\nThe brown fox jumps over the lazy cat.\nThis is\
  \ the second test of the test script.\nThis is the fourth line.\n```\n\n如果你想对从文本中某处开始但持续到文本末尾的一组行应用命令，可以使用特殊地址——美元符号：\n\
  \n```bash\nsed '2,$s/dog/cat/' data1\nThis is a test of the test script.\nThe brown\
  \ fox jumps over the lazy cat.\nThe brown fox jumps over the lazy cat.\nThis is\
  \ the second test of the test script.\nThis is the fourth line.\n```\n\n\n\n\n那只敏捷的棕色狐狸跳过了那只懒猫。\n\
  \n`$`\n\n因为你可能不知道文本中有多少行数据，所以美元符号通常非常有用。\n\n## 使用文本模式过滤器\n\n限制命令作用行的另一种方法方法要复杂一些。`sed`\
  \ 编辑器允许你指定一个文本模式，它使用该模式来过滤用于命令的行。其格式为：\n\n`/pattern/command`\n\n你必须将指定的模式封装在正斜杠中。`sed`\
  \ 编辑器仅对包含你所指的文本模式的行执行该命令。\n\n例如，如果你只想为用户 Samantha 更改默认 shell，可以使用 `sed` 命令：\n\n\
  `$`\n\n```\n$ grep Samantha /etc/passwd\n```\nSamantha:x:1001:1002:Samantha,4,,:/home/Samantha:/bin/bash\n\
  \n`$`\n\n```\n$ sed ‘/Samantha/s/bash/csh/’ /etc/passwd\n```\nroot:x:0:0:root:/root:/bin/bash\n\
  ...\nSamantha:x:1001:1002:Samantha,4,,:/home/Samantha:/bin/csh\nTimothy:x:1002:1005::/home/Timothy:/bin/sh\n\
  Christine:x:1003:1006::/home/Christine:/bin/sh\n\n`$`\n\n该命令仅应用于匹配该文本模式的行。虽然使用固定文本模式对于过滤特定值（如\
  \ userid 示例）可能很有用，但它的功能范围相当有限。`sed` 编辑器在文本模式中使用了一种称为“正则表达式”的功能，允许你创建非常复杂的模式。\n\n\
  正则表达式允许你创建高级的文本模式匹配公式来匹配各种数据。这些公式结合了一系列通配符、特殊字符和固定文本字符，产生一个简洁的模式，可以匹配几乎任何文本情况。正则表达式是\
  \ shell 脚本编程中最令人畏的部分之一，第 19 章将详细介绍它们。\n\n## 命令分组\n\n如果你需要对单行执行多个命令，请使用大括号将命令分组在一起。`sed`\
  \ 编辑器将处理地址行上列出的每个命令：\n\n`$`\n```\n$ sed ‘2{\n> s/fox/elephant/\n> s/dog/cat/\n>\
  \ }’ data1\n```\n那只敏捷的棕色狐狸跳过了那只懒狗。\n那只敏捷的棕色大象跳过了那只懒猫。\n那只敏捷的棕色狐狸跳过了那只懒狗。\n那只敏捷的棕色狐狸跳过了那只懒狗。\n\
  \n`$`\n\n两个命令都会针对该地址进行处理。当然，你可以在分组命令之前指定一个地址范围：\n\n`$`\n```\n$ sed ‘3,$\n> s/brown/green/\n\
  > s/lazy/active/\n> }’ data1\n```\n那只敏捷的棕色狐狸跳过了那只懒狗。\n那只敏捷的棕色狐狸跳过了那只懒狗。\n那只敏捷的绿色狐狸跳过了那只活跃的狗。\n\
  那只敏捷的绿色狐狸跳过了那只活跃的狗。\n\n`$`\n\n`sed` 编辑器将所有命令应用到地址范围内的所有行。\n\n## 删除行\n\n文本替换命令并不是\
  \ `sed` 编辑器中唯一的可用命令。如果你需要删除文本流中的特定文本行，可以使用删除命令。\n\n删除命令 `d` 的作用基本上如其名。它将删除任何匹配所提供的地址方案的文本行。使用删除命令要小心，因为如果你忘记包含地址方案，流中的所有行都将被删除：\n\
  \n`$`\n```\n$ cat data1\n```\n那只敏捷的棕色狐狸跳过了那只懒狗\n那只敏捷的棕色狐狸跳过了那只懒狗\n那只敏捷的棕色狐狸跳过了那只懒狗\n\
  那只敏捷的棕色狐狸跳过了那只懒狗\n`$`\n```\n$ sed ‘d’ data1\n```\n\n`$`\n\n删除命令显然与指定的地址结合使用时最有用。这允许你通过行号从数据流中删除特定的文本行：\n\
  \n`$`\n```\n$ sed ‘3d’ data7\n```\n这是第 1 行。\n这是第 2 行。\n这是第 4 行。\n\n`$`\n\n或者通过特定的行范围：\n\
  \n`$`\n```\n$ sed ‘2,3d’ data7\n```\n这是第 1 行。\n这是第 4 行。\n\n`$`\n\n或者使用特殊的文件结束符：\n\
  \n`$`\n```\n$ sed ‘3,$d’ data7\n```\n这是第 1 行。\n这是第 2 行。\n\n`$`\n\n`sed` 编辑器的模式匹配功能也适用于删除命令：\n\
  \n`$`\n```\n$ sed ‘/number 1/d’ data7\n```\n这是第 2 行。\n这是第 3 行。\n这是第 4 行。\n\n`$`\n\
  \n`sed` 编辑器会移除包含你指定的模式文本的行。\n\n### 注意\n\n请记住，`sed` 编辑器不会修改原始文件。你删除的任何行只会从 `sed`\
  \ 编辑器的输出中消失。原始文件仍然包含被“删除”的行。\n\n你也可以使用两个文本模式删除范围内的行，但这样做时要小心。你指定的第一个模式会“开启”行删除，而第二个模式会“关闭”行删除。`sed`\
  \ 编辑器会删除两个指定行之间的任何行（包括指定的行）：\n\n`$`\n```\n$ sed ‘/1/,/3/d’ data6\n```\n这是第 4 行。\n\
  \n`$`\n\n此外，你需要小心，因为每当 `sed` 编辑器在数据流中检测到起始模式时，删除功能就会“开启”。这可能会产生意想不到的结果：\n\n`$`\n\
  ```\n$ cat data8\n```\n这是第 1 行。\n这是第 2 行。\n这是第 3 行。\n这是第 4 行。\n这又是第 1 行。\n这是你想要保留的文本。\n\
  这是文件的最后一行。\n`$`\n`$`\n```\n$ sed ‘/1/,/3/d’ data7\n```\n这是第 4 行。\n\n`$`\n\n包含数字\
  \ 1 的行的第二次出现再次触发了删除命令，删除了数据流中的剩余所有行，因为没有识别到停止模式。当然，如果你指定的停止模式在文本中从未出现过，也会发生另一个而而的问题：\n\
  \n`$`\n```\n$ sed ‘/1/,/5/d’ data8\n```\n`$`\n\n由于删除功能在第一次模式匹配时“开启”，但从未找到结束模式匹配，整个数据流都被删除了。\n\
  \n## 插入和追加文本\n\n正如你所预期，像任何其他编辑器一样，`sed` 编辑器允许你向数据流插入和追加文本行。这两个操作之间的区别可能会令人困惑：\n\n\
  *   插入命令 (`i`) 在指定行之前添加一个新行。\n*   追加命令 (`a`) 在指定行之后添加一个新行。\n\n这两个命令中令人困惑的是它们的格式。你不能在单行命令上使用这些命令。你必须在单独的一行上指定要插入或追加的行。此操作格式为：\n\
  \n`sed ‘[address]command\\new line’`\n\n新行中的文本将出现在 `sed` 编辑器中你指定的位置。记住，当你使用插入命令时，文本会出现在数据流之前：\n\
  \n`$`\n```\n$ echo “Test Line 2” | sed ‘i\\Test Line 1’\n```\nTest Line 1\nTest\
  \ Line 2\n\n`$`\n\n当你使用追加命令时，文本会出现在数据流之后：\n\n`$`\n```\n$ echo “Test Line 2” | sed\
  \ ‘a\\Test Line 1’\n```\nTest Line 2\nTest Line 1\n\n`$`\n\n当你从命令行界面使用 `sed` 编辑器时，你会收到次级提示以输入新行数据。你必须在这一行上完成\
  \ `sed` 命令。一旦你输入结束引号，bash shell 就会处理该命令：\n\n`$`\n```\n$ echo “Test Line 2” | sed\
  \ ‘i\\\n> Test Line 1’\n```\nTest Line 1\nTest Line 2\n\n`$`\n\n这在数据流文本之前或之后添加文本很好，但在数据流内部添加文本呢？\n\
  \n要在数据流行内部插入或追加数据，你必须使用地址告诉 `sed` 编辑器你希望数据出现的地方。在使用这些命令时，你可以指定单行地址。你可以匹配数字行号或文本模式，但不能使用地址范围。这是符合逻辑的，因为你只能在单行之前或之后插入或追加，而不能在一个范围内。\n\
  \n以下是在数据流第 3 行之前插入新行的示例：\n\n`$`\n```\n$ sed ‘3i\\\n> This is an inserted line.’\
  \ data7\n```\n这是第 1 行。\n这是第 2 行。\n这是插入的行。\n这是第 3 行。\n这是第 4 行。\n\n`$`\n\n以下是在数据流第\
  \ 3 行之后追加新行的示例：\n\n`$`\n```\n$ sed ‘3a\\\n>This is an appended line.’ data7\n```\n\
  这是第 1 行。\n这是第 2 行。\n这是第 3 行。\n这是追加的行。\n这是第 4 行。\n\n\n\n\n\n这是一行追加的行。\n\n这是第 4 行。\n\
  \n$\n\n此操作过程与 `insert` 命令相同；它只是将新文本行放置在指定的行号之后。如果你有一个多行数据流，并且想在数据流的末尾添加新行文本，只需使用美元符号，它代表最后一行数据：\n\
  \n```\n$ sed ‘$a\\\n> This is a new line of text.’ data7\n```\n\n这是第 1 行。\n这是第 2\
  \ 行。\n这是第 3 行。\n这是第 4 行。\n这是一行新文本。\n\n$\n\n如果你想在数据流的开头添加新行，也适用相同的原理。只需在第 1 行之前插入一个新行即可。\n\
  \n要插入或追加多行文本，你必须在每一行新文本后都使用反斜杠，直到达到想要插入或追加文本的最后一行文本：\n\n```\n$ sed ‘1i\\\n> This\
  \ is one line of new text.\\\n> This is another line of new text.’ data7\n```\n\n\
  这是其中一行新文本。\n这是另一行新文本。\n这是第 1 行。\n这是第 2 行。\n这是第 3 行。\n这是第 4 行。\n\n$\n\n指定的两个行都已添加到数据流中。\n\
  \n### 修改行\n\n`change` 命令允许你更改数据流中整行文本的内容。它的工作方式与 `insert` 和 `append` 命令相同，即你必须将新行与\
  \ `sed` 命令的其他部分分开指定：\n\n```\n$ sed ‘3c\\\n> This is a changed line of text.’ data7\n\
  ```\n\n这是第 1 行。\n这是第 2 行。\n这是一行修改过的文本。\n这是第 4 行。\n\n$\n\n在示例中，`sed` 编辑器更改了第 3 行的文本。你也可以使用文本模式作为地址：\n\
  \n```\n$ sed ‘/number 3/c\\\n> This is a changed line of text.’ data7\n```\n\n这是第\
  \ 1 行。\n这是第 2 行。\n这是一行修改过的文本。\n这是第 4 行。\n\n$\n\n文本模式更改命令将更改数据流中任何匹配模式的行文本。\n\n```\n\
  $ sed ‘/number 1/c\\\n> This is a changed line of text.’ data8\n```\n\n这是一行修改过的文本。\n\
  这是第 2 行。\n这是第 3 行。\n这是第 4 行。\n这是一行修改过的文本。\n这是另一行。\n这是文件中的最后一行。\n\n$\n\n你可以在 `change`\
  \ 命令中使用地址范围，但结果可能不是你预期的：\n\n```\n$ sed ‘2,3c\\\n> This is a new line of text.’ data7\n\
  ```\n\n这是第 1 行。\n这是一行新文本。\n这是第 4 行。\n\n$\n\n`sed` 编辑器并没有用该文本替换两行，而是使用该行文本替换了这两行。\n\
  \n### 转换命令\n\n转换命令（`y`）是唯一一个对单个字符操作的 `sed` 编辑器命令。转换命令的格式为：\n\n`[address]y/inchars/outchars/`\n\
  \n转换命令对 `inchars` 和 `outchars` 的值进行一对一的映射。`inchars` 中的第一个字符转换为 `outchars` 中的第一个字符。`inchars`\
  \ 中的第二个字符转换为 `outchars` 中的第二个字符。这种映射持续到指定字符的长度。如果 `inchars` 和 `outchars` 长度不相同，`sed`\
  \ 编辑器将产生错误信息。\n\n使用转换命令简单示例是：\n\n```\n$ sed ‘y/123/789/’ data8\n```\n\n这是第 7 行。\n\
  这是第 8 行。\n这是第 9 行。\n这是第 4 行。\n这又是第 7 行。\n这是另一行。\n这是文件中的最后一行。\n\n$\n\n从输出中可以看出，`inchars`\
  \ 模式中指定字符的每个实例都已被 `outchars` 模式中相同位置的字符所替换。\n\n转换命令是一个全局命令；也就是说，它会自动对文本行中找到的任何字符执行转换，而不考虑其出现次数：\n\
  \n```\n$ echo “This 1 is a test of 1 try.” | sed ‘y/123/456/’\n```\n\nThis 4 is\
  \ a test of 4 try.\n\n$\n\n`sed` 编辑器转换了文本行中匹配字符 `1` 的两个实例。你无法将转换限制为字符的特定出现次数。\n\n\
  ### 重新回顾打印\n\n“更多替换选项”章节向你展示了如何在替换命令中使用 `p` 标志来显示 `sed` 编辑器更改的行。还有三个命令也可以从数据流中打印信息：\n\
  \n*   小写 `p` 命令用于打印文本行\n*   等号（=`）命令用于打印行号\n*   `l`（小写 `L`）命令用于列行\n\n后续章节将查看 `sed`\
  \ 编辑器中的这三个打印命令。\n\n#### 打印行\n\n与替换命令中的 `p` 标志一样，`p` 命令在 `sed` 编辑器的输出中打印一行。单独使用它并没有什么意义：\n\
  \n```\n$ echo “this is a test” | sed ‘p’\n```\n\nthis is a test\nthis is a test\n\
  \n$\n\n它只是打印你已经知道在那里的数据。打印命令最常用的用途是打印包含文本模式的行：\n\n```\n$ sed -n ‘/number 3/p’ data7\n\
  ```\n\n这是第 3 行。\n\n$\n\n通过使用 `-n` 选项，你可以抑制所有行，只打印包含匹配模式的行。你也可以将其作为快速打印部分行的方法：\n\n\
  ```\n$ sed -n ‘2,3p’ data7\n```\n\n这是第 2 行。\n这是第 3 行。\n\n$\n\n当你需要在行被修改之前查看它时（例如使用替换命令），也可以使用打印命令。你可以创建一个显示行的脚本：\n\
  \n```\n$ sed -n ‘/3/{\np\ns/line/test/\n}’ data7\n```\n\n这是第 3 行。\n这是 test。\n\n\
  $\n\n#### 打印行号\n\n等号命令打印数据流中的行号。行号由数据流中的换行符决定。每当换行符出现在数据流中时，`sed` 编辑器就认为它结束了一行：\n\
  \n```\n$ sed ‘=’ data1\n```\n\n1 The quick brown fox jumps over the lazy dog.\n\
  2 The quick brown fox jumps over the lazy dog.\n3 The quick brown fox jumps over\
  \ the lazy dog.\n4 The quick brown fox jumps over the lazy dog.\n\n$\n\n`sed` 编辑器在实际行之前打印行号。如果你在数据流中搜索特定的文本模式，等号命令非常有用：\n\
  \n```\n$ sed -n ‘/number 4/{\n=\np\n}’ data7\n```\n\n4 这是第 4 行。\n\n$\n\n通过使用 `-n`\
  \ 选项，你可以让 `sed` 编辑器仅显示包含匹配行的行号和文本。\n\n#### 列出行\n\n列表命令（`l`）允许你打印数据流中的文本和不可打印字符。任何不可打印字符都使用其八进制值（前加反斜杠）或常用不可打印字符的标准\
  \ C 风格命名法，例如用 `\\t` 表示制表符：\n\n```\n$ cat data9\n```\n\nThis    line    tabs.\n\n\
  $\n\n```\n$ sed -n ‘l’ data9\n```\n\nThis\\tline\\ttabs.$\n\n制表符的位置使用 `\\t` 命名法显示。行尾的美元符号表示换行符。如果你有一个的数据流包含转义字符，列表命令将使用八进制代码显示它：\n\
  \n```\n$ cat data10\n```\n\nThis line contains an escape character\n\n$\n\n```\n\
  $ sed -n ‘l’ data10\n```\n\nThis line contains an escape character \\033[44m$\n\n\
  \n\n\n然而，使用 `list` 命令可以显示所使用的转义控制代码。`\\033` 是转义键 ASCII 码的八进制值。\n\n## 使用 sed 处理文件\n\
  \n替换命令包含允许你处理文件的标志。还有一些常规的 `sed` 编辑器命令可以让你在无需替换文本的情况下完成这些操作。\n\n### 写入文件\n\n`w`\
  \ 命令用于将行写入文件。`w` 命令的格式为：\n\n`[address]w filename`\n\n`filename` 可以指定为相对路径或绝对路径，但无论哪种，运行\
  \ `sed` 编辑器的人都必须对该文件具有写权限。`address` 可以是 `sed` 中使用的任何类型寻址方法，例如单行号、文本模式，或者行号或文本模式的范围。\n\
  \n以下是一个示例，它仅将数据流的前两行打印到文本文件中：\n\n```\n$ sed ‘1,2w test’ data7\n\nThis is line number\
  \ 1.\nThis is line number 2.\nThis is line number 3.\nThis is line number 4.\n$\n\
  \n$ cat test\n\nThis is line number 1.\nThis is line number 2.\n$\n```\n\n当然，如果你不想让这些行显示在\
  \ `STDOUT` 上，可以使用 `sed` 命令的 `-n` 选项。\n\n如果你需要根据常见的文本值（如邮件列表中的值）从主文件创建一个数据文件，这是一个非常好用的工具：\n\
  \n```\n$ cat data11\n\nBlum, Katie      Chicago, IL\nMullen, Riley    West Lafayette,\
  \ IN\nSnell, Haley      Ft. Wayne, IN\nWoenker, Matthew      Springfield, IL\nWisecarver,\
  \ Emma      Grant Park, IL\n$\n\n$ sed -n ‘/IN/w INcustomers’ data11\n\n$\n\n$ cat\
  \ INcustomers\n\nMullen, Riley    West Lafayette, IN\nSnell, Haley      Ft. Wayne,\
  \ IN\n$\n```\n\n`sed` 编辑器仅会将包含文本模式的数据行写入目标文件。\n\n### 从文件中读取数据\n\n你已经看到过如何通过 `sed`\
  \ 命令行向数据流插入数据和在末尾追加文本。`read` 命令 (`r`）允许你插入包含在独立文件中的数据。\n\n`read` 命令的格式为：\n\n`[address]r\
  \ filename`\n\n`filename` 参数指定包含数据的文件的绝对路径或相对路径。你不能对 `read` 命令使用地址范围。你只能指定单行号或文本模式地址。`sed`\
  \ 编辑器会在 `address` 之后插入文件中的文本。\n\n```\n$ cat data12\n\nThis is an added line.\nThis\
  \ is the second added line.\n$\n\n$ sed ‘3r data12’ data7\n\nThis is line number\
  \ 1.\nThis is line number 2.\nThis is line number 3.\nThis is an added line.\nThis\
  \ is the second added line.\nThis is line number 4.\n$\n```\n\n`sed` 编辑器会将数据文件中所有的文本行插入到数据流中。在使用文本模式地址时，同样同样有效：\n\
  \n```\n$ sed ‘/number 2/r data12’ data7\n\nThis is line number 1.\nThis is line\
  \ number 2.\nThis is an added line.\nThis is the second added line.\nThis is line\
  \ number 3.\nThis is line number 4.\n$\n```\n\n如果你想在数据流的末尾添加文本，只需使用美元符号地址符号：\n\n\
  ```\n$ sed ‘$r data12’ data7\n\nThis is line number 1.\nThis is line number 2.\n\
  This is line number 3.\nThis is line number 4.\nThis is an added line.\nThis is\
  \ the second added line.\n$\n```\n\n`read` 命令的一个酷应用是将其结合 `delete` 命令使用，用另一个文件中的数据替换文件中的占位符。例如，假设你在文本文件中存储了一个格式如下的表单信：\n\
  \n```\n$ cat letter\n\nWould the following people:\n\nLIST\n\nplease report to the\
  \ office.\n$\n```\n\n该表信使用通用占位符 `LIST` 代替人员列表。要在占位符之后插入人员列表，你只需要使用 `read` 命令。然而，输出中仍然保留占位符文本。要删除它，只需使用\
  \ `delete` 命令。结果如下：\n\n```\n$ sed ‘/LIST/{\n> r data11\n> d\n}’ letter\n\nWould\
  \ the following people:\n\nBlum, Katie      Chicago, IL\nMullen, Riley    West Lafayette,\
  \ IN\nSnell, Haley      Ft. Wayne, IN\nWoenker, Matthew      Springfield, IL\nWisecarver,\
  \ Emma      Grant Park, IL\nplease report to the office.\n$\n```\n\n现在，占位符文本已被数据文件中的姓名列表替换。\n\
  \n## 总结\n\n虽然 shell 脚本可以完成很多工作，但仅通过 shell 脚本处理数据通常很困难。Linux 提供了两个实用的工具来帮助处理文本数据。`sed`\
  \ 编辑器是一个流编辑器，可以在读取数据时快速实时处理。你必须为 `sed` 编辑器提供一个编辑命令列表，它会将这些命令应用于数据。\n\n`gawk` 程序是\
  \ GNU 组织的一个工具，它模仿并扩展了 Unix `awk` 程序的功能。`gawk` 程序包含一种内置编程语言，你可以用它编写脚本来处理和处理数据。你可以使用\
  \ `gawk` 程序从大型数据文件中提取元素，并以你所需的几乎任何格式输出。这使得处理大型日志文件变得轻而易举，也可以从数据文件创建自定义报告。\n\n使用\
  \ `sed` 和 `gawk` 的关键元素是理解正则表达式。\n\n*   定义\n*   扩展\n*   查看\n\n第 19 章：正则表达式\n\n在本章中，我们将探索正则表达式。正则表达式是定义搜索模式的字符序列。正则表达式用于在文本中查找和替换模式。\n\
  \n\n\n`da*` 参数指示 `ls` 命令仅列出名称以 `da` 开头的文件。文件名中 `da` 之后可以有任意数量的字符（包括没有）。`ls` 命令会读取目录中所有文件的信息，但只显示匹配通配符字符的文件。\n\
  \n正则表达式通配符模式的工作原理类似。正则表达式模式包含文本和/或特殊字符，为 `sed` 编辑器和 `gawk` 程序在匹配数据时定义了一个遵循的模板。在正则表达式中，可以使用不同的特殊字符来定义用于过滤数据的特定模式。\n\
  \n# 正则表达式的类型\n\n使用正则表达式最大的问题是它并不只有一套。在 Linux 环境中，有多个不同的应用程序使用不同类型的正则表达式。这些包括了多种多样化的应用程序，如编程语言（Java、Perl\
  \ 和 Python）、Linux 实用工具（如 `sed` 编辑器、`gawk` 程序和 `grep` 实用程序）以及主流应用程序（如 `MySQL` 和 `PostgreSQL`\
  \ 数据库服务器）。\n\n正则表达式是通过正则表达式引擎实现的。正则表达式引擎是解释正则表达式模式并使用这些模式来匹配文本的底层软件。\n\n在 Linux\
  \ 世界中，有两个流行的正则表达式引擎：\n\n* `POSIX` 基础正则表达式 (`BRE`) 引擎\n* `POSIX` 扩展正则表达式 (`ERE`)\
  \ 引擎\n\n大多数 Linux 实用工具至少符合 `POSIX` `BRE` 引擎规范，识别其定义的所有模式符号。遗憾的是，某些实用工具（如 `sed` 编辑器）仅符合\
  \ `BRE` 引擎规范的子集。这是由于速度限制，因为 `sed` 编辑器试图尽可能地处理数据流中的文本。\n\n`POSIX` `ERE` 引擎通常出现在依赖正则表达式进行文本过滤的语言中。它提供了高级模式符号，以及用于常见模式的特殊符号，例如匹配数字、单词和字母数字字符。`gawk`\
  \ 程序使用 `ERE` 引擎来处理其正则表达式模式。\n\n由于实现正则表达式的方式有很多种，很难对所有可能的正则表达式提供一个单一、简洁的描述。接下来的章节将讨论最常见的正则表达式，并演示如何在\
  \ `sed` 编辑器和 `gawk` 程序中使用它们。\n\n## 定义 BRE 模式\n\n最基础的 `BRE` 模式是匹配数据流中的文本字符。本节演示了你如何在正则表达式模式中定义文本，以及对结果的预期是什么。\n\
  \n## 纯文本\n\n第 18 章演示了如何在 `sed` 编辑器和 `gawk` 程序中使用标准文本字符串来过滤数据。这里有一个示例可以刷新你的记忆：\n\n\
  ```bash\necho \"This is a test\" | sed -n '/test/p'\nThis is a test\n\necho \"This\
  \ is a test\" | sed -n '/trial/p'\n$\n\necho \"This is a test\" | gawk '/test/{print\
  \ $0}'\nThis is a test\n\necho \"This is a test\" | gawk '/trial/{print $0}'\n$\n\
  ```\n\n第一个模式定义了一个单单词，`test`。`sed` 编辑器和 `gawk` 程序脚本分别使用它们自己版本的 `print` 命令来打印任何匹配正则表达式模式的行。由于\
  \ `echo` 语句的文本字符串中包含单词 \"test\"，数据流文本匹配了定义的正则表达式模式，因此 `sed` 编辑器显示了该行。\n\n第二个模式再次定义了一个单单词，这次是单词\
  \ \"trial\"。由于 `echo` 语句的文本字符串不包含该单词，正则表达式模式不匹配，因此 `sed` 编辑器和 `gawk` 程序都不会打印该行。\n\
  \n你可能已经注意到，正则表达式并不关心模式出现在数据流的哪个位置。模式出现的次数也并不重要。只要正则表达式可以匹配文本字符串中的任何位置模式，它就会将字符串传递给使用它的\
  \ Linux 实用工具。\n\n关键是将正则表达式模式与数据流文本匹配。要记住，正则表达式对匹配模式非常挑剔。要记住的第一条规则是正则表达式模式是区分大小写的。这意味着它们只会匹配字符大小写完全正确的模式：\n\
  \n```bash\necho \"This is a test\" | sed -n '/this/p'\n$\n\necho \"This is a test\"\
  \ | sed -n '/This/p'\nThis is a test\n$\n```\n\n第一次尝试匹配失败，是因为单词 \"this\" 在文本字符串中不是全小写形式出现，而使用模式中大写字母的第二次尝试运行良好良好。\n\
  \n你不需要在正则表达式中将自己限制在整个单词上。如果定义的文本出现在数据流的任何地方，正则表达式都将匹配以下内容：\n\n```bash\necho \"The\
  \ books are expensive\" | sed -n '/book/p'\nThe books are expensive\n$\n```\n\n\
  尽管数据流中的文本是 `books`，但流中的数据包含了正则表达式 `book`，因此正则表达式模式匹配了数据。当然，如果你尝试相反的操作，正则表达式将失败：\n\
  \n```bash\necho \"The book is expensive\" | sed -n '/books/p'\n$\n```\n\n完整的正则表达式文本没有出现在数据流中，因此匹配失败，`sed`\
  \ 编辑器没有显示该文本。\n\n你不需要在正则表达式中将自己限制在单个文本单词。你也可以在文本字符串中包含空格和数字：\n\n```bash\necho \"\
  This is line number 1\" | sed -n '/ber 1/p'\nThis is line number 1\n```\n\n空格在正则表达式中像其他字符一样被处理：\n\
  \n```bash\necho \"This is line number1\" | sed -n '/ber 1/p'\n$\n```\n\n最后，如果你在正则表达式中定义了一个空格，它必须出现在数据流中。你甚至可以创建一个匹配多个连续空格的正则表达式模式：\n\
  \n```bash\ncat data1\nThis is a normal line.\nThis is  a line with many spaces.\n\
  \nsed -n '/  /p' data1\nThis is  a line with many spaces.\n$\n```\n\n单词之间的两个空格匹配了正则表达式模式。这是发现文件中空格问题的好方法！\n\
  \n## 特殊字符\n\n当你在正则表达式中使用文本字符串时，有一点是你需要注意的。在正则表达式中定义文本字符存在某些例外。正则表达式模式为某些字符赋予了特殊含义。如果你在文本模式中使用这些字符，将无法得到预期的结果。\n\
  \n正则表达式识别的特殊字符有：\n\n`.*[]ˆ${}\\+?()`\n\n随着章节进行，你将发现这些特殊字符在正则表达式中的作用。但目前，只需记住你不能在文本模式中单独使用这些字符。\n\
  \n如果你想将特殊字符之一作为文本字符，你需要转义它。当你转义特殊字符时，在前面添加一个特殊字符，指示正则表达式引擎将下一个字符解释为普通文本字符。执行此作用的特殊字符是反斜杠（`\\\
  `）。\n\n例如，如果你要在文本中搜索美元符号，只需在其加上反斜杠字符：\n\n```bash\ncat data2\nThe cost is $4.00\n\
  \nsed -n '/\\$/p' data2\nThe cost is $4.00\n$\n```\n\n由于反斜杠是特殊字符，如果你需要在正则表达式模式中使用它，你也需要转义它，从而产生双反斜杠：\n\
  \n```bash\necho \"\\ is a special character\" | sed -n '/\\\\/p'\n\\ is a special\
  \ character\n$\n```\n\n最后，虽然正斜杠不是正则表达式特殊字符，但如果你在 `sed` 编辑器或 `gawk` 程序的正则表达式模式中使用它，将得到错误：\n\
  \n```bash\necho \"3 / 2\" | sed -n '///p'\n```\n\n\n\n\n```\nsed: -e expression\
  \ #1, char 2: No previous regular expression\n```\n\n$\n\n要使用正斜杠，你也需要对其进行转义：\n\n\
  ```bash\n$ echo “3 / 2” | sed -n ‘/\\//p’\n3 / 2\n```\n\n$\n\n现在 sed 编辑器可以正确解释正则表达式模式了，一切正常。\n\
  \n# 锚点字符 (Anchor Characters)\n\n如“纯文本”部分所示，默认情况下，当你指定一个正则表达式模式时，如果该模式出现在数据流的任何位置，它就会被匹配。你可以使用两个特殊字符将模式锚定在数据流的行首或行尾。\n\
  \n### 从开头开始\n\n脱字符（`^`）定义了一个从数据流中某行开始的模式。如果模式位于行首以外的任何位置，则正则表达式模式将匹配失败。\n\n要使用脱字符字符，你必须将其放在正则表达式中指定的模式之前：\n\
  \n```bash\n$ echo “The book store” | sed -n `/ˆbook/p’\n\n$ echo “Books are great”\
  \ | sed -n `/ˆBook/p’\nBooks are great\n```\n\n$\n\n脱字符锚点会检查由换行符确定的每行新数据开头的模式：\n\
  \n```bash\n$ cat data3\nThis is a test line.\nthis is another test line.\nA line\
  \ that tests this feature.\nYet more testing of this\n$ sed -n `/ˆthis/p’ data3\n\
  this is another test line.\n```\n\n$\n\n只要模式出现在新行的开头，脱字符锚点就能捕获它。\n\n如果你将脱字符放置在模式起始点的任何位置，它将像普通字符一样作用，而不是特殊字符：\n\
  \n```bash\n$ echo “This ˆ is a test” | sed -n `/s ˆ/p’\nThis ˆ is a test\n```\n\n\
  $ \n\n由于脱字符在正则表达式模式中列在最后，sed 编辑器将其作为普通字符来匹配文本。\n\n**注意**\n\n如果你只需要使用脱字符来指定正则表达式模式，则不需要用反斜杠对其进行转义。但是，如果你在模式中先指定脱字符，后面跟着额外的文本，则你需要在脱字符之前使用转义字符。\n\
  \n### 寻找结尾\n\n在行首寻找模式的反面是在行尾寻找模式。美元符号（`$`）特殊字符定义了结尾锚点。在文本模式后添加此特殊字符，表示数据行必须以该文本模式结束：\n\
  \n```bash\n$ echo “This is a good book” | sed -n `/book$/p’\nThis is a good book\n\
  \n$ echo “This book is good” | sed -n `/book$/p’\n```\n\n$\n\n结尾文本模式的问题在于，你必须小心你正在寻找什么：\n\
  \n```bash\n$ echo “There are a lot of good books” | sed -n `/book$/p’\n```\n\n$\n\
  \n在行尾将“book”一词变为复数，意味着它不再匹配该正则表达式模式，尽管 `book` 存在于数据流中。文本模式必须是该行的最后内容，模式才能匹配成功。\n\
  \n### 组合锚点\n\n在两种常见情况下，你可以在同一行上结合使用起始和结束锚点。在第一种情况下，假设你想查找仅包含某个特定文本模式的数据行：\n\n```bash\n\
  $ cat data4\nthis is a test of using both anchors\nI said this is a test\nthis is\
  \ a test\nI'm sure this is a test.\n$ sed -n `/ˆthis is a test$/p’ data4\nthis is\
  \ a test\n```\n\n$\n\nsed 编辑器会忽略除指定文本外包含其他文本的行。\n\n第二种情况初看起来有点奇怪，但非常有用。通过在没有文本的模式中结合两个锚点，你可以从数据流中过滤空行。考虑这个示例：\n\
  \n```bash\n$ cat data5\nThis is one test line.\nThis is another test line.\n$ sed\
  \ `/ˆ$/d’ data5\nThis is one test line.\nThis is another test line.\n```\n\n$\n\n\
  定义的正则表达式模式寻找行首和行尾之间没有任何内容的行。因为空行在两个换行符之间没有文本，所以它们匹配该正则表达式模式。sed 编辑器使用 `d` 删除命令删除匹配正则表达式模式的行，从而移除文本中的所有空行。这是从文档中删除空行的有效方法。\n\
  \n### 点字符 (The Dot Character)\n\n点特殊字符（`.`）用于匹配除换行符以外的任意字符。然而，点字符必须匹配一个字符；如果点的位置没有字符，则模式将失败。\n\
  \n让我们来看几个在正则表达式模式中使用点字符的示例：\n\n```bash\n$ cat data6\nThis is a test of a line.\n\
  The cat is sleeping.\nThat is a very nice hat.\nThis test is at line four.\nat ten\
  \ o'clock we'll go home.\n$ sed -n `/.at/p’ data6\nThe cat is sleeping.\nThat is\
  \ a very nice hat.\nThis test is at line four.\n```\n\n$\n\n你应该能推出为什么第一行失败了，以及为什么第二行和第三行通过了。第四行有点棘手。注意我们匹配了\
  \ `at`，但它前面没有字符来匹配点字符。哦，其实有的！在正则表达式中，空格被算作字符，所以 `at` 前面的空格匹配了模式。第五行证明了这一点，它将 `at`\
  \ 置于行首，导致无法匹配模式。\n\n### 字符类 (Character Classes)\n\n点特殊字符对于与任意字符匹配某个字符位置非常有用，但如果你想限制匹配的字符范围呢？这在正则表达式中被称为字符类。\n\
  \n你可以定义一个字符类，用于匹配文本模式中的某个位置。如果字符类中的任意一个位于数据流中，它就会匹配该模式。\n\n要定义字符类，你使用方括号 `[]`。括号内应包含你想要包含在类中的任何字符。然后你可以像使用任何其他通配符一样，在模式中使用整个类。这起初需要一点时间适应，但一旦掌握，它就能产生非常惊人的结果。\n\
  \n以下是创建一个字符类的示例：\n\n```bash\n$ sed -n `/[ch]at/p’ data6\nThe cat is sleeping.\n\
  That is a very nice hat.\n```\n\n$\n\n使用与点特殊字符示例相同的数据文件，我们得到了不同的结果。这次我们成功过滤了仅仅包含\
  \ `at` 单词的行。匹配此模式的单词只有 `cat` 和 `hat`。另外注意，以 `at` 开头的行也没有匹配。字符类中必须有一个字符能匹配相应的位置。\n\
  \n当你不确定字符是大写还是小写时，字符类就变得非常有用：\n\n```bash\n$ echo “Yes” | sed -n `/[Yy]es/p’\nYes\n\
  \n$ echo “yes” | sed -n `/[Yy]es/p’\nyes\n```\n\n$\n\n你可以在单个表达式中使用多个字符类：\n\n```bash\n\
  $ echo “Yes” | sed -n `/[Yy][Ee][Ss]/p’\nYes\n\n$ echo “yEs” | sed -n `/[Yy][Ee][Ss]/p’\n\
  yEs\n\n$ echo “yeS” | sed -n `/[Yy][Ee][Ss]/p’\nyeS\n```\n\n$\n\n该正则表达式使用了三个字符类来涵盖所有三个位置的大写和小写。\n\
  \n字符类并不非要包含字母；你也可以使用数字：\n\n```bash\n$ cat data7\nThis line doesn't contain a number.\n\
  This line has 1 number on it.\nThis line a number 2 on it.\nThis line has a number\
  \ 4 on it.\n$ sed -n `/[0123]/p’ data7\nThis line has 1 number on it.\nThis line\
  \ a number 2 on it.\n```\n\n$\n\n正则表达式模式匹配包含数字 0、1、2 或 3 的行。其他数字会被忽略，没有数字的行也是如此。\n\
  \n你可以组合字符类来检查格式正确的数字，例如电话号码和邮政编码。然而，当你尝试匹配特定格式时，必须非常小心。这里有一个邮政编码匹配失败的示例：\n\n```bash\n\
  $ cat data8\n60633\n46201\n223001\n4353\n22203\n$ sed -n `>/[0123456789][0123456789][0123456789][0123456789][0123456789]/p’\
  \ data8\n60633\n46201\n223001\n22203\n```\n\n$\n\n\n\n\n\n这可能不是你预期的结果。它很好地过滤掉了长度短到无法作为邮政编码的数字，因为最后一个字符类没有用于匹配的字符。然而，它仍然通过了六位数的匹配，尽管我们只定义了五个字符类。\n\
  \n记住，正则表达式模式可以出现在数据流文本的任何地方。除了匹配的模式字符外，总会有额外的字符。如果你想确保只匹配五个数字，你需要以某种方式对它们进行界定，可以使用空格，或者像本例所示，显示它们位于行的开头和结尾：\n\
  \n```bash\nsed -n ‘/^[0123456789][0123456789][0123456789][0123456789][0123456789]$/p’\
  \ data8\n```\n```\n60633\n46201\n22203\n$\n```\n现在好多了！在本章的后面部分，我们将介绍如何进一步简化它。\n\n\
  字符类的一个非常流行的用途是解析可能拼错误的单词，例如从用户表单输入的数据。你可以轻松创建可以接受数据中常见拼写错误的正则表达式：\n\n```bash\ncat\
  \ data9\nI need to have some maintenence done on my car.\nI'll pay that in a seperate\
  \ invoice.\nAfter I pay for the maintenance my car will be as good as new.\n```\n\
  \n```bash\nsed -n ‘/maint[ea]n[ae]nce/p\n/sep[ea]r[ea]te/p’ data9\n```\n```\nI need\
  \ to have some maintenence done on my car.\nI'll pay that in a seperate invoice.\n\
  After I pay for the maintenance my car will be as good as new.\n$\n```\n这个示例中的两个\
  \ `sed` 打印命令利用正则表达式字符类来帮助捕捉文本中拼写错误的单词 maintenance 和 separate。相同的正则表达式模式也会匹配拼写正确的“maintenance”。\n\
  \n### 反向字符类\n\n在正则表达式模式中，你也可以反转字符类的效果。与其寻找包含在类中的字符，倒不如查找任何不在该类中的字符。要做到这一点，只需在字符类范围的开头放置一个脱字符字符\
  \ `^` 即可：\n\n```bash\nsed -n ‘/[^ch]at/p’ data6\n```\n```\nThis test is at line\
  \ two.\n$\n```\n通过反向字符类，正则表达式模式会匹配任何既不是 c 不是 h 的字符，连同文本模式。由于空格字符符合这一类，所以它通过了模式匹配。然而，即使使用了反向，字符类也必须匹配一个字符，因此行首为\
  \ `at` 的行仍然不匹配该模式。\n\n### 使用范围\n\n你可能注意到，当我之前展示邮政编码示例时，必须在每个字符类中列出所有可能的数字有些笨拙。幸运的是，你可以使用快捷方法，这样就不需要那样做了。\n\
  \n你可以通过使用连字符符号 `-` 在字符类内部使用字符范围。只需指定范围内的第一个字符、一个连字符，然后是范围内的最后一个字符。正则表达式将根据 Linux\
  \ 系统使用的字符集包含任何指定字符范围内的字符（参见第 2 章）。\n\n现在你可以通过指定数字范围来简化邮政编码示例了：\n\n```bash\nsed -n\
  \ ‘/^[0-9][0-9][0-9][0-9][0-9]$/p’ data8\n```\n```\n60633\n46201\n45902\n$\n```\n\
  这节省了大量的打字量！每个字符类将匹配从 0 到 9 的任何数字。如果数据任何地方出现字母，模式将失败：\n\n```bash\necho \"a8392\"\
  \ | sed -n ‘/^[0-9][0-9][0-9][0-9][0-9]$/p’\necho \"1839a\" | sed -n ‘/^[0-9][0-9][0-9][0-9][0-9]$/p’\n\
  echo \"18a92\" | sed -n ‘/^[0-9][0-9][0-9][0-9][0-9]$/p’\n```\n\n同样的技术也适用于字母：\n\n\
  ```bash\nsed -n ‘/[c-h]at/p’ data6\n```\n```\nThe cat is sleeping.\nThat is a very\
  \ nice hat.\n$\n```\n新模式 `[c-h]at` 匹配第一个字母在 c 和字母 h h 之间的单词。在这种情况下，只有单词 `at` 的行未能匹配该模式。\n\
  \n你还可以在单个字符类中指定多个非连续的范围：\n\n```bash\nsed -n ‘/[a-ch-m]at/p’ data6\n```\n```\nThe\
  \ cat is sleeping.\nThat is a very nice hat.\n$\n```\n该字符类允许范围 a 到 c 以及 h 到 m 出现在\
  \ `at` 文本之前。此范围将拒绝任何在 d 和 g 之间的字母：\n\n```bash\necho \"I'm getting too fat.\" | sed\
  \ -n ‘/[a-ch-m]at/p’\n```\n该模式拒绝了包含 `fat` 文本，因为它不在指定的范围内。\n\n### 特殊字符类\n\n除了定义自己的字符类外，BRE\
  \ 还包含了你可以使用的特殊字符类，用于匹配特定类型的字符。\n\n| 类 | 描述 |\n| :--- | :--- |\n| `[:alpha:]` | 匹配任何字母，无论大写还是小写。\
  \ |\n| `[:alnum:]` | 匹配任何数字 0–9、A–Z 或 a–z。 |\n| `[:blank:]` | 匹配空格。 |\n| `[:digit:]`\
  \ | 匹配数字 0 到 9。 |\n| `[:lower:]` | 匹配任何小写字母 a–z。 |\n| `[:print:]` | 匹配任何可打印字符。 |\n\
  | `[:punct:]` | 匹配任何标点字符。 |\n| `[:space:]` | 匹配任何空白字符：空格、NL、FF、CR。 |\n| `[:upper:]`\
  \ | 匹配任何大写字母 A–Z。 |\n\n你像使用普通类一样使用这些特殊类：\n\n```bash\necho \"abc\" | sed -n '[:alpha:]'\n\
  echo \"abc\" | sed -n '[:alnum:]'\necho \"123\" | sed -n '[:digit:]'\necho \"This\
  \ is a test\" | sed -n '[:punct:]'\n```\n\n### 星号\n\n在字符后放置星号 `*` 表示该字符必须出现零或多次：\n\
  \n```bash\necho \"ik\" | sed -n '/ie*k/'\necho \"iek\" | sed -n '/ie*k/'\necho \"\
  eeek\" | sed -n '/ie*k/'\necho \"eeek\" | sed -n '/ie*k/'\n```\n可能的额外字母旁边的星号允许你接受拼错误的单词。该符号通常用于处理拼写有变化的单词。例如，如果你需要编写一个可能使用美式英语或英式英语的脚本，你可以写：\n\
  \n```bash\necho \"I'm getting a color TV\" | sed -n '/colou*r/'\necho \"I'm getting\
  \ a colour TV\" | sed -n '/colou*r/'\n```\n模式中的 `u*` 表示字母 u 可能出现在文本中也可能不。同样，如果你知道一个经常拼错误的单词，你可以通过星号来适应它：\n\
  \n```bash\necho \"I ate a potatoe with my lunch.\" | sed -n '/potato*/'\necho \"\
  I ate a potato with my lunch.\" | sed -n '/potato*/'\n```\n\n另一个方便的功能是将特殊字符 `.`\
  \ 与星号 `*` 结合。这种组合提供了一个匹配任意数量任意字符的模式。它通常用于两个在数据流中相邻或不相邻的字符串之间：\n\n```bash\necho \"\
  this is a regular pattern expression\" | sed -n '/regular.*expression/'\n```\n使用此模式，你可以轻松搜索数据流中行内出现在任何位置的多个单词。星号也可以应用于字符类。这允许你指定在文本中出现多次的字符组或范围：\n\
  \n```bash\necho \"bt\" | sed -n '/b[ae]*t/'\necho \"bat\" | sed -n '/b[ae]*t/'\n\
  echo \"bet\" | sed -n '/b[ae]*t/'\necho \"bitt\" | sed -n '/b[ae]*t/'\necho \"baat\"\
  \ | sed -n '/b[ae]*t/'\n```\n\n\n\n\n\nbaat\n\n```bash\n$ echo \"baaeeet\" | sed\
  \ -n '/b[ae]*t/p'\n```\nbaaeeet\n\n```bash\n$ echo \"baeeaeeat\" | sed -n '/b[ae]*t/p'\n\
  ```\nbaeeaeeat\n\n```bash\n$ echo \"baakeeet\" | sed -n '/b[ae]*t/p'\n```\n$\n\n\
  只要 `a` 和 `e` 字符在 `b` 和 `t` 字符之间任意组合出现（包括完全不出现），该模式就会匹配。如果出现了定义字符类之外的任何其他字符，模式匹配将失败。\n\
  \n## 扩展正则表达式\n\nPOSIX ERE 模式包含了一些被某些 Linux 应用程序和工具使用的额外符号。`gawk` 程序可以识别 ERE 模式，但\
  \ `sed` 编辑器不识别。\n\n### 注意事项\n\n重要的是记住，`sed` 编辑器和 `gawk` 程序中的正则表达式引擎是有区别的。`gawk`\
  \ 程序可以使用大多数扩展正则表达式模式符号，并能提供 `sed` 编辑器不具备的一些额外过滤功能。然而，由于这种原因，它在处理数据流时通常较慢。\n\n本节描述了你可以在\
  \ `gawk` 程序脚本中更常用的 ERE 模式符号。\n\n## 问号\n\n问号 `?` 与星号类似，但但略有不同。问号表示前面的字符可以出现零次或一次，仅此而已。它不会匹配字符的重复出现：\n\
  \n```bash\n$ echo \"bt\" | gawk '/be?t/{print $0}'\n```\nbt\n\n```bash\n$ echo \"\
  bet\" | gawk '/be?t/{print $0}'\n```\nbet\n\n```bash\n$ echo \"beet\" | gawk '/be?t/{print\
  \ $0}'\n```\n$\n\n```bash\n$ echo \"beeet\" | gawk '/be?t/{print $0}'\n```\n$\n\n\
  如果 `e` 字符不在文本中出现，或者只要它在文本中只出现一次，模式就会匹配。\n\n与星号一样，你可以将问号符号配合字符类使用：\n\n```bash\n$\
  \ echo \"bt\" | gawk '/b[ae]?t/{print $0}'\n```\nbt\n\n```bash\n$ echo \"bat\" |\
  \ gawk '/b[ae]?t/{print $0}'\n```\nbat\n\n```bash\n$ echo \"bot\" | gawk '/b[ae]?t/{print\
  \ $0}'\n```\n$\n\n```bash\n$ echo \"bet\" | gawk '/b[ae]?t/{print $0}'\n```\nbet\n\
  \n```bash\n$ echo \"baet\" | gawk '/b[ae]?t/{print $0}'\n```\n$\n\n```bash\n$ echo\
  \ \"beat\" | gawk '/b[ae]?t/{print $0}'\n```\n$\n\n```bash\n$ echo \"beet\" | gawk\
  \ '/b[ae]?t/{print $0}'\n```\n$\n\n如果字符类中出现了零个或一个字符，则模式匹配即通过。然而，如果两个字符都出现了，或者其中一个字符出现了两次，模式匹配将失败。\n\
  \n## 加号\n\n加号 `+` 是另一个与星号类似的模式符号，但与问号的含义不同。加号表示前面的字符可以出现一次或多次，但必须至少出现一次。如果字符不存在，则模式不匹配：\n\
  \n```bash\n$ echo \"beeet\" | gawk '/be+t/{print $0}'\n```\nbeeet\n\n```bash\n$\
  \ echo \"beet\" | gawk '/be+t/{print $0}'\n```\nbeet\n\n```bash\n$ echo \"bet\"\
  \ | gawk '/be+t/{print $0}'\n```\nbet\n\n```bash\n$ echo \"bt\" | gawk '/be+t/{print\
  \ $0}'\n```\n$\n\n如果 `e` 字符不存在，则模式匹配失败。加号也可以与字符类一起工作，就像星号和问号一样：\n\n```bash\n$ echo\
  \ \"bt\" | gawk '/b[ae]+t/{print $0}'\n```\n$\n\n```bash\n$ echo \"bat\" | gawk\
  \ '/b[ae]+t/{print $0}'\n```\nbat\n\n```bash\n$ echo \"bet\" | gawk '/b[ae]+t/{print\
  \ $0}'\n```\nbet\n\n```bash\n$ echo \"beat\" | gawk '/b[ae]+t/{print $0}'\n```\n\
  beat\n\n```bash\n$ echo \"beet\" | gawk '/b[ae]+t/{print $0}'\n```\nbeet\n\n```bash\n\
  $ echo \"beeat\" | gawk '/b[ae]+t/{print $0}'\n```\nbeeat\n\n这次，只要字符类中定义的任意一个字符出现，文本就会匹配。\n\
  \n## 使用大括号\n\nERE 中提供了大括号 `{}`，允许你对可重复的正则表达式指定限制。这通常被称为间隔（interval）。你可以用两种格式表示间隔：\n\
  \n* `m`: 正则表达式恰好出现 `m` 次。\n* `m,n`: 正则表达式至少出现 `m` 次，不超过 `n` 次。\n\n此功能允许你精细调整字符（或字符类）在模式中出现的次数。\n\
  \n### 注意事项\n\n默认情况下，`gawk` 程序不识别正则表达式间隔。你必须为 `gawk` 程序指定 `--re-interval` 命令行才能识别正则表达式间隔。这里有一个使用简单一次间隔的示例：\n\
  \n```bash\n$ echo \"bt\" | gawk --re-interval '/be{1}t/{print $0}'\n```\n$\n\n```bash\n\
  $ echo \"bet\" | gawk --re-interval '/be{1}t/{print $0}'\n```\nbet\n\n```bash\n\
  $ echo \"beet\" | gawk --re-interval '/be{1}t/{print $0}'\n```\n$\n\n通过指定一次的间隔，你限制了字符出现的次数，以便字符串匹配该模式。如果字符出现次数更多，则模式匹配将失败。在很多时候，指定下限上限非常有用：\n\
  \n```bash\n$ echo \"bt\" | gawk --re-interval '/be{1,2}t/{print $0}'\n```\n$\n\n\
  ```bash\n$ echo \"bet\" | gawk --re-interval '/be{1,2}t/{print $0}'\n```\nbet\n\n\
  ```bash\n$ echo \"beet\" | gawk --re-interval '/be{1,2}t/{print $0}'\n```\nbeet\n\
  \n```bash\n$ echo \"beeet\" | gawk --re-interval '/be{1,2}t/{print $0}'\n```\n$\n\
  \n在这个示例中，`e` 字符可以出现一次或两次，模式匹配才能通过；否则，模式匹配失败。间隔模式匹配也适用于字符类：\n\n```bash\n$ echo \"\
  bt\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\n$\n\n```bash\n$ echo \"\
  bat\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbat\n\n```bash\n$ echo\
  \ \"bet\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbet\n\n```bash\n\
  $ echo \"beat\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbeat\n\n```bash\n\
  $ echo \"beet\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\n$\n\n```bash\n\
  $ echo \"beet\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbee\n\n\n\n\
  bash\n\n$ echo \"beeat\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbeeat\n\
  \n```bash\n$ echo \"baet\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\n\
  $\n\n``` \n在这个示例中，`e` 字符可以出现一次或两次，模式匹配才能通过；否则，模式匹配失败。间隔模式匹配也适用于字符类：\n\n```bash\n\
  $ echo \"bt\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\n$\n\n```bash\n\
  $ echo \"bat\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbat\n\n```bash\n\
  $ echo \"bet\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbet\n\n```bash\n\
  $ echo \"\n\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\n\n\n\n```bash\n\
  $ echo \"beet\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\n$\n\n```bash\n\
  $ echo \" \"et\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbeat\n\n```bash\n\
  $ echo \"beat\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\nbeat\n\n```bash\n\
  $ echo \"beeet\" | gawk --re-interval '/b[ae]{1,2}t/{print $0}'\n```\n$\n\n```bash\n\
