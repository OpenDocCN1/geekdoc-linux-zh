  \ | Find 可执行文件的位置。 |\n| `zip` | Unix 版本的命令。 |\n\n## Environment Variables\n\nbash\
  \ shell 还利用了许多环境变量。虽然环境变量不是命令，但它们经常影响 shell 的运行方式，因此了解这些变量非常重要。表 A.2 显示了默认环境变量。\n\
