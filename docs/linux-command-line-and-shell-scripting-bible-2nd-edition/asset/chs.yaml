  \n遵循 `README` 文件中的建议，下一步是为你的系统配置 `sysstat`。这会检查你的 Linux 系统，以确保它拥有正确的库依赖项，此外还有用于编译源代码的正确编译器：\n\
  \n```bash\n# ./configure\n```\n\n检查程序：\n\n```text\n.\nchecking for gcc... gcc\n\
  checking for C compiler default output name... a.out\nchecking whether the C compiler\
  \ works... yes\n...\nchecking for ANSI C header files... (cached) yes\nchecking\
  \ for dirent.h that defines DIR... yes\nchecking for library containing opendir...\
  \ none required\nchecking for ctype.h usability... yes\nchecking for ctype.h presence...\
  \ yes\nchecking for ctype.h... yes\nchecking for errno.h usability... yes\n...\n\
  ```\n\n检查库函数：\n\n```text\n.\nchecking for strchr... yes\nchecking for strcspn...\
  \ yes\nchecking for strspn... yes\nchecking for strstr... yes\nchecking for sensors\
  \ support... yes\n...\n```\n\n检查配置：\n\n```text\n...\nconfig.status: creating Makefile\n\
  \    Sysstat version:           9.1.5\n    Installation prefix:      /usr/local\n\
  \    rc directory:             /etc/rc.d\n    Init directory:           /etc/rc.d/init.d\n\
  \    Configuration directory:  /etc/sysconfig\n    Man pages directory:      /usr/local/man\n\
  \    Compiler:                 gcc\n    Compiler flags:           gcc\n```\n\n现在\
  \ tar 压缩包已经解压，文件已整齐地放入名为 `sysstat-9.1.5` 的目录中，你可以进入该目录继续操作。\n\n```bash\n# make install\n\
  ```\n\n\n\n\n\n在你开始 Shell 脚本之旅之前，你将需要知道如何在 Linux 中至少使用一种文本编辑器。你对搜索、剪切和粘贴等高级功能了解得越深，你开发\
  \ Shell 脚本的速度就越快。本章将讨论你在 Linux 世界中会看到的几个主要的文本编辑器。\n\n# vim 编辑器\n\n如果你在命令行模式下工作，你可能想熟悉至少一种在\
  \ Linux 控制台运行的文本编辑器。`vi` 编辑器是 Unix 系统上使用的原始编辑器。它使用控制台图形模式来模拟文本编辑窗口，允许你查看文件的行、在文件内移动，以及插入、编辑和替换文本。\n\
  \n虽然它可能是世界上最复杂的编辑器（至少在那些讨厌它的人看来是如此），但它提供了许多功能，使其几十年来一直是 Unix 管理员的必备工具。\n\n当 GNU\
  \ 项目将 `vi` 编辑器移植到开源世界时，他们选择对其进行一些改进。由于它不再像 Unix 世界中的原始 `vi` 编辑器那样，开发者还将其重命名为 vi\
  \ improved 版，即 `vim`。\n\n为了方便使用，几乎所有的 Linux 发行版都会创建一个名为 `vi`（见第 5 章）的别名，指向 `vim`\
  \ 程序：\n\n```bash\n$ alias vi\nalias vi='vim'\n```\n\n本节将带你了解使用 `vim` 编辑器编辑文本 Shell\
  \ 脚本文件的基础知识。\n\n## vim 基础知识\n\n`vim` 编辑器在内存缓冲区中工作。要启动 vim 编辑器，只需输入 `vim` 命令（如果有别名则输入\
  \ `vi`）以及要编辑的文件名：\n\n```bash\n$ vim myprog.c\n```\n\n如果你在启动 vim 时没有提供文件名，或者文件不存在，vim\
  \ 会打开一个新的缓冲区区域进行编辑。如果你在命令行中指定了一个现有文件，vim 将将文件的整个内容读入缓冲区区域，准备进行编辑，如图 9.1 所示。\n\n\
  图 9.1 vim 主窗口\n\n![9.1](img/c09f001.jpg)\n\n`vim` 编辑器会检测会话的终端类型（见第 2 章），并使用全屏模式将整个控制台窗口作为编辑器区域。\n\
  \n初始的 vim 编辑窗口显示文件内容（如果有的话）以及窗口底部的消息行。如果文件内容没有占据整个屏幕，vim 会不属于文件的行上放置波浪号 `~`（如图 9.1\
  \ 所示）。\n\n底部的消息行显示有关所编辑文件的信息，取决于文件状态以及你 vim 安装中的默认设置。如果文件是新文件，会显示消息 `[New File]`。\n\
  \n`vim` 编辑器有两种工作模式：\n\n*   普通模式 (Normal mode)\n*   插入模式 (Insert mode)\n\n当你第一次打开一个文件（或开始编辑一个新文件）时，`vim`\
  \ 编辑器进入普通模式。在普通模式下，`vim` 编辑器会将输入解释为命令（稍后会详细介绍）。\n\n在插入模式下，vim 将你输入的每个键插入到缓冲区中当前光标位置。要进入插入模式，按\
  \ `i` 键。要退出插入模式并返回普通模式，按键盘上的 `Escape` 键。\n\n在普通模式下，你可以使用方向键在文本区域移动光标（只要 vim 正确识别了你的终端类型）。如果你恰好处于一个没有定义方向键的不稳定的终端连接上，也完全不必放弃。vim\
  \ 命令中包含了移动光标的命令：\n\n*   `h` 向左移动一个字符\n*   `j` 向下移动一行（文本中的下一行）\n*   `k` 向上移动一行（文本中的上一行）\n\
  *   `l` 向右移动一个字符\n\n在大型文本文件中逐行移动可能会很乏味。幸运的是，vim 提供了几个命令来加速进程：\n\n*   `PageDown`（或\
  \ `Ctrl+F`）向前移动一屏数据\n*   `PageUp`（或 `Ctrl+B`）向后移动一屏数据\n*   `G` 移动到缓冲区最后一行\n*   `num\
  \ G` 移动到缓冲区第 `num` 行\n*   `gg` 移动到缓冲区的第一行\n\n`vim` 编辑器在普通模式下有一个特殊功能叫做命令行模式 (command\
  \ line mode)。命令行模式提供了一个交互式命令行，你可以在其中输入额外的命令来控制 vim 的操作。要进入命令行模式，在普通模式下按冒号键。光标移动到消息行，并出现一个冒号，等待你输入命令。\n\
  \n命令行模式中有几个将缓冲区保存到文件并退出 vim 的命令：\n\n*   `q` 如果缓冲区数据未发生任何更改，则退出\n*   `q!` 退出并丢弃对缓冲区数据做的任何更改\n\
  *   `w filename` 以不同的文件名保存文件\n*   `wq` 将缓冲区数据保存到文件并退出\n\n在看到了几个基本的 vim 命令后，你可能就能理解为什么有些人绝对讨厌\
  \ vim 编辑器了。但要充分利用 vim，必须了解许多晦涩的命令。\n\n## 编辑数据\n\n在插入模式下，你可以向缓冲区插入数据；但有时，你需要在输入数据到缓冲区后添加或删除数据。在普通模式下，`vim`\
  \ 编辑器提供了几个编辑数据的命令。表 9.1 列出了一些常用的编辑命令。\n\n| 命令 |  |\n| :--- | :--- |\n| `x` | 删除当前光标位置的字符。\
  \ |\n| `dd` | 删除当前光标位置的行。 |\n| `dw` | 删除当前光标位置的单词。 |\n| `d$` | 从当前光标位置删除到行尾。 |\n\
  | `J` | 删除当前光标位置所在行尾的换行符（合并行）。 |\n| `u` | 撤销上一个编辑命令。 |\n| `a` | 在当前光标位置后追加数据。 |\n\
  | `A` | 在当前光标位置所在的行尾追加数据。 |\n| `r char` | 用 `char` 替换当前光标位置的单个字符。 |\n| `R text`\
  \ | 用 `text` 覆盖当前光标位置的数据，直到按下 `Escape` 为止。 |\n\n某些编辑命令还允许使用数字修饰符来指示执行命令的次数。例如，命令\
  \ `2x` 从当前光标位置开始删除两个字符，命令 `5dd` 从光标所在行开始删除五行。\n\n### 注意事项\n\n在 vim 编辑器中尝试使用 PC 键盘的退格键（Backspace）或删除键（Delete）时要小心。vim\
  \ 编辑器通常将删除键识别为 `x` 命令的功能，删除当前光标位置的字符。通常 vim 编辑器不识别退格键。\n\n## 复制和粘贴\n\n现代编辑器的标准功能是可以剪切或复制数据，然后将其粘贴到文档的其他地方。vim\
  \ 编辑器提供了实现这一方法。\n\n剪切和粘贴相对简单。你已经看到过表 9.1 中可以从缓冲区移除数据的命令。然而，当 vim 删除数据时，它实际上将其存储在一个单独的寄存器中。你可以通过使用\
  \ `p` 命令来获取这些数据。\n\n\n\n\n\n例如，你可以使用 `dd` 命令来删除一行文本，然后将光标移动到缓冲区中你想放置文本的位置，再使用 `p`\
  \ 命令。`p` 命令会将文本插入到当前光标所在行的之后。你可以使用任何删除文本的命令来执行此操作。\n\n复制文本稍微复杂一点。vim 中的复制命令是 `y`（代表\
  \ yank，意为剪取）。你可以配合 `y` 使用与 `d` 命令相同的第二个字符（例如 `yw` 复制一个单词，`y$` 复制到行尾）。复制完文本后，将光标移动到你想放置文本的位置，并使用\
  \ `p` 命令。被复制的文本现在就会出现在该位置。\n\n剪取（Yanking）的复杂之处在于，你无法看到发生了什么，因为你并没有影响到被复制的文本。在将它粘贴到某处之前，你永远无法确切自己到底复制了什么。但\
  \ vim 中还有另一个功能可以帮助你剪取。\n\n可视模式（visual mode）会在你移动光标时高亮文本。你使用可视模式来选择要复制并粘贴的文本。要进入可视模式，将光标移动到你想开始复制的位置，然后按下\
  \ `v`。你会发现光标位置的文本现在被高亮显示了。接下来，移动光标覆盖你想复制的文本（你甚至可以向下移动行来复制多行文本）。随着光标的移动，vim 会高亮显示剪取区域内的文本。在你覆盖了想要复制的文本后，按下\
  \ `y` 键激活剪取命令。现在你已经将文本放入寄存器中，只需将光标移动到你想粘贴的地方，并使用 `p` 命令即可。\n\n## 搜索与替换\n\n你可以使用\
  \ vim 的搜索命令轻松查找缓冲区中的数据。要输入搜索字符串，按下正斜杠（`/`）键。光标会跳转到消息行，vim 会显示一个正斜杠。输入你想查找的文本，然后按回车键。vim\
  \ 编辑器会响应响应之一：\n\n- 如果单词出现在当前光标位置之后，它将跳转到该文本出现的第一个位置。\n- 如果单词没有出现在当前光标位置之后，它将从文件末尾绕回到文件中文本出现的第一个位置（并用消息提示）。\n\
  - 它会产生一条错误信息，说明文件中未找到该文本。\n\n要继续搜索同一个单词，按下正斜杠字符然后按回车键，或者你可以使用 `n` 键（next，下一个）。\n\
  \n替换命令（substitute）允许你快速将文本中的一个单词替换为另一个。要使用替换命令，你必须处于命令行模式。替换命令的格式为：\n\n```\n:s/old/new/\n\
  ```\n\nvim 编辑器会跳转到文本 `old` 的第一次出现处并将其替换为文本 `new`。你可以对替换命令进行一些修改，以替换文本的多次出现：\n\n\
  - `:s/old/new/g` 替换行中所有的 `old` 出现\n- `:n,ms/old/new/g` 替换行号 `n` 和 `m` 之间所有的 `old`\
  \ 出现\n- `:%s/old/new/g` 替换整个文件中所有的 `old` 出现\n- `:%s/old/new/gc` 替换整个文件中所有的 `old`\
  \ 出现，但在每次出现时进行提示\n\n正如你所看到的，对于一个命令行文本编辑器来说，vim 包含了许多高级功能。由于每个 Linux 发行版都包含了它，因此至少了解\
  \ vim 编辑器的基础知识是一个好主意，这样无论你在何处或手头有什么工具，都可以编辑脚本。\n\n## emacs 编辑器\n\nemacs 编辑器是一个非常流行的编辑器，它甚至在\
  \ Unix 出现之前就已经存在。开发者们非常喜欢它，并将其移植到 Unix 环境中，现在它也被移植到了 Linux 环境。emacs 编辑器最初是一个控制台编辑器，类似于\
  \ `vi`，但它已经迁移到了图形化世界。\n\nemacs 编辑器仍然提供原始的控制台模式编辑器，但现在它还具有使用图形化 X Windows 窗口的能力，允许在图形环境中编辑文本。通常，当你从命令行启动\
  \ emacs 编辑器时，编辑器将判断你是否有可用的 X Window 会话并以图形模式启动。如果没有，它将在控制台模式启动。\n\n本节将描述控制台模式和图形模式的\
  \ emacs 编辑器，以便在你想（或需要）使用时知道如何使用其中一种。\n\n### 在控制台下使用 emacs\n\n控制台模式版本的 emacs 是另一个使用大量键命令来执行编辑功能的编辑器。emacs\
  \ 编辑器使用涉及 Control （PC 键盘上的 `Ctrl` 键）和 Meta 键的组合键。在大多数 PC 终端模拟器包中，Meta 键被映射为 PC 的\
  \ `Alt` 键。emacs 文档将 Ctrl 键缩写为 `C-`，将 Meta 键缩写为 `M-`。因此，如果你输入 `Ctrl-x` 组合键，文档会显示\
  \ `C-x`。本章也将这样做以免让你混淆。\n\n### emacs 基础\n\n要从命令行使用 emacs 编辑文件，输入：\n\n```\n$ emacs\
  \ myprog.c\n```\n\nemacs 控制台模式窗口会出现，并带有简短的介绍和帮助屏幕。不要担心；只要你按下任意键，emacs 就会将文件加载到活动缓冲区并显示文本，如图\
  \ 9.2\n\n你会发现控制台窗口的顶部显示了一个典型的菜单栏。遗憾的是，你无法在控制台模式下使用菜单栏，只能在图形模式下使用。\n\n**注意**\n\n\
  如果你有图形桌面，但倾向于在控制台模式下使用 emacs 而不是 X Windows 模式，请在命令行使用 `-nw` 选项。\n\n与 vim 编辑器不同（你需要在进入和退出插入模式之间切换以输入命令和插入文本），emacs\
  \ 编辑器只有一个模式。如果你输入可打印字符，emacs 会将其插入到当前光标位置。如果你输入命令，emacs 会执行该命令。\n\n要在缓冲区区域移动光标，你可以使用方向键以及\
  \ `PageUp` 和 `PageDown` 键，假设 emacs 正确检测到了你的终端模拟器。如果没有，则有命令可以移动光标：\n\n- `C-p` 向上移动一行（文本中的上一行）。\n\
  - `C-b` 向左（向后）移动一个字符。\n- `C-f` 向右（向前）移动一个字符。\n- `C-n` 向下移动一行（文本中的下一行）。\n\n还有用于在文本内进行更长距离跳转的命令：\n\
  \n- `M-f` 向右（向前）移动到下一个单词。\n- `M-b` 向左（向后）移动到上一个单词。\n- `C-a` 移动到行首。\n- `C-e` 移动到行尾。\n\
  - `M-a` 移动到句子开头。\n- `M-e` 移动到句子结尾。\n- `M-v` 向上翻一页。\n- `C-v` 向下翻一页。\n- `M-<` 移动到文本的第一行。\n\
  - `M->` 移动到文本的最后一行。\n\n还有几个常用的命令可以将编辑器缓冲区保存回文件并退出 emacs：\n\n- `C-x C-s` 将缓冲区内容保存到文件。\n\
  - `C-z` 退出 emacs 但保持其在会话中运行，以便返回。\n- `C-x C-c` 退出 emacs 并停止程序。\n\n你会注意到这些功能中有两个需要组合键的。`C-x`\
  \ 命令被称为扩展命令。这提供了另一套完整的命令集。\n\n### 编辑数据\n\nemacs 编辑器在插入和删除缓冲区文本方面非常强大。要插入文本，只需将光标移动到你想插入文本的位置并开始打字。要删除文本，emacs\
  \ 使用 `Backspace` 键删除光标位置前的字符，使用 `Delete` 键删除光标所在位置的字符。\n\n\n\n\n\nemacs 编辑器也有用于杀死（kill）文本的命令。删除（delete）文本与杀死（kill）文本的区别在于，当你杀死文本时，emacs\
  \ 会将其放在一个临时区域，你可以从中检索它（参见“复制与粘贴”章节）。而删除的文本将永久消失。\n\n在缓冲区（buffer）中有几个杀死文本的命令：\n\n\
  * `M-Backspace`：杀死当前光标位置之前的单词\n* `M-d`：杀死当前光标位置之后的单词\n* `C-k`：从当前光标位置到行尾\n* `M-k`：从当前光标位置到句尾\n\
  \nemacs 编辑器还包含一种快捷的批量杀死文本的方法。只需将光标移动到你想删除的区域开头，然后按下 `C-@` 或 `C-Spacebar` 键。接着，将光标移动到你想删除区域的末尾，按下\
  \ `C-w` 命令。这两个位置之间的所有文本都会被杀死。\n\n如果你在杀死文本时不小心犯了错，`C-u` 命令将撤销杀死命令，并将数据恢复到杀死之前的状态。\n\
  \n## 复制与粘贴\n\n你已经看到了如何从 emacs 缓冲区剪切数据；现在是时候查看如何粘贴到其他地方了。遗憾的是，如果你使用 vim 编辑器，这个过程在用\
  \ emacs 编辑器时可能会让你感到困惑。\n\n由于巧合的是，在 emacs 中粘贴数据被称为 yanking（取回）。在 vim 编辑器中，复制被称为 yanking，如果你恰好同时使用这两个编辑器，这会是一个很难记忆的事情。\n\
  \n在使用一个杀死命令杀死数据后，将光标移动到你想粘贴数据的位置，并使用 `C-y` 命令。这会将文本从临时区域取出（yank）并粘贴到当前光标位置。`C-y`\
  \ 命令取回的是上一次杀死命令的文本。如果你执行了多次杀死命令，可以使用 `M-y` 命令在它们之间循环。\n\n要复制文本，只需将其 yank 回到你杀死它的原始位置，然后移动到新位置并再次使用\
  \ `C-y` 命令。你可以根据需要无限次地将文本 yank 回。\n\n## 搜索与替换\n\n在 emacs 编辑器中搜索文本是通过使用 `C-s` 和 `C-r`\
  \ 命令完成的。`C-s` 命令在缓冲区中从当前光标位置到末尾执行向前搜索，而 `C-r` 命令在缓冲区中从当前光标位置到开头执行反向搜索。\n\n当你输入 `C-s`\
  \ 或 `C-r` 命令时，底部会出现一个提示符，询问你想要搜索的文本。emacs 可以执行两种类型的搜索。\n\n在增量搜索中，emacs 编辑器会在你输入单词时以实时模式执行文本搜索。当你输入第一个字母时，它会高亮缓冲区中该字母的所有出现处。当你输入第二个字母时，它会高亮文本中该字母组合的所有出现处，以此此类推，直到你完成要搜索的文本。\n\
  \n在非增量搜索中，在输入 `C-s` 或 `C-r` 命令后按回车键。这会将搜索查询锁定在底部区域，允许你在搜索之前输入完整的搜索文本。\n\n要用新文本字符串替换现有文本字符串，你必须使用\
  \ `M-x` 命令。该命令需要一个文本命令以及参数。\n\n文本命令是 `replace-string`。输入命令后，按回车键，emacs 将询问你现有的文本字符串。输入该内容后，再次按回车键，emacs\
  \ 将询问你新的替换文本字符串。\n\n## 在 emacs 中使用缓冲区\n\nemacs 编辑器通过拥有多个缓冲区区域允许你同时编辑多个文件。你可以将文件加载到缓冲区并在编辑过程中切换缓冲区。\n\
  \n在 emacs 运行时将新文件加载到缓冲区中，请使用 `C-x C-f` 键组合。这是 emacs 的“查找文件”（Find a File）模式。它会将你带到窗口底部，并允许你输入想要编辑的文件名。如果你不知道文件的名称或位置，只需按回车键。这会在编辑窗口中弹出一个文件浏览器，如图\
  \ 9.3 所示。\n\n图 9.3 emacs 查找文件模式浏览器\n\n![9.3](img/c09f003.jpg)\n\n从这里，你可以浏览到想要编辑的文件。要向上移动目录级，进入双点项并按回车键。要向下进入目录，进入目录项并按回车键。当你找到了想要编辑的文件，只需按回车键，emacs\
  \ 就会将其加载到新的缓冲区区域。\n\n你可以通过按下 `C-x C-b` 扩展命令组合来列出活动缓冲区区域。emacs 编辑器会分割窗口并在底部窗口显示缓冲区列表。除了主编辑缓冲区外，emacs\
  \ 总是提供两个缓冲区：\n\n* 一个名为 `scratch` 的空白区域\n* 一个名为 `Messages` 的消息区域\n\n`scratch` 区域允许输入\
  \ LISP 编程命令，还可以给自己写笔记。消息区域显示 emacs 生成的消息。\n\n切换到缓冲区区域有两种：\n\n* `C-x o`：切换到缓冲区列表\n\
  * `C-x b`：输入你想进入的缓冲区名称\n\n## 控制台模式下使用窗口\n\n控制台模式 emacs 编辑是在图形窗口概念出现很多年前开发的。然而，它在那个时代是非常先进的，因为它能够支持多个窗口。\n\
  \n你可以使用以下命令之一将 emacs 编辑窗口拆分为多个窗口：\n\n* `C-x 2`：将窗口水平分为两个窗口。\n* `C-x 3`：将窗口垂直分为两个窗口。\n\
  \n要从一个窗口移动到另一个窗口，使用 `C-x o` 命令。你会发现当你创建一个新窗口时，emacs 使用原始窗口的缓冲区。要关闭窗口，移动到该窗口并使用 `C-x\
  \ 0`（数字 0）命令。如果你想关闭除当前窗口外的所有窗口，使用 `C-x 1`（数字 1）命令。\n\n## 在 X Windows 中使用 emacs\n\
  \n如果你在 X Windows 环境（如 KDE 或 GNOME 桌面）中使用 emacs，它将在图形模式下启动，如图 9.4 所示。\n\n图 9.4 emacs\
  \ 图形窗口\n\n![9.4](img/c09f004.jpg)\n\n如果你已经在控制台模式下使用过 emacs，你应该应该对 X Windows 模式非常熟悉。所有的快捷命令都可以作为菜单栏项可用。emacs\
  \ 菜单栏包含以下项目：\n\n* File（文件）：允许在窗口中打开文件、创建新窗口、关闭窗口、保存和打印缓冲区。\n* Edit（编辑）：允许剪切和复制选中文到剪贴板、将剪贴板数据粘贴到当前光标位置、搜索文本并替换文本。\n\
  * Options（选项）：提供更多 emacs 功能的设置，例如高亮、换行、光标类型和设置字体。\n* Buffers（缓冲区）：列出当前可用的缓冲区并允许你轻松地在缓冲区区域之间切换。\n\
  \n\n\n\n\n*   `Tools`: 提供访问 `emacs` 高级功能的权限，例如命令行界面访问、拼写检查、文件间的文本比较（称为 `diff`）、发送电子邮件、日历和计算器。\n\
  *   `Help`: 提供在线的 `emacs` 手册，用于获取有关特定 `emacs` 函数的帮助。\n\n除了普通的图形化 `emacs` 菜单栏项目外，编辑器缓冲区中通常还有一个针对特定文件类型的单独项目。图\
  \ 9.4 显示了打开一个 C 程序，因此 `emacs` 了一个了一个 C 菜单项，允许对 C 语法高亮进行高级设置，并从命令行提示符编译、运行和调试代码。\n\
  \n图形化 `emacs` 窗口是一个旧控制台应用程序向图形化世界迁移的示例。现在，许多 Linux 发行版都提供了图形化桌面（即使对于不需要它们的服务器也是如此），图形化编辑器变得越来越常见。流行的\
  \ Linux 桌面环境（`KDE` 和 `GNOME`）也专门为自己的环境提供了图形化文本编辑器，这些将在本章的其余部分介绍。\n\n## KDE 编辑器家族\n\
  \n如果你正在使用使用 `KDE` 桌面的 Linux 发行版（见第 1 章），在文本编辑器方面你有几个选择。`KDE` 项目正式支持两个不同的文本编辑器：\n\
  \n*   `KWrite`: 单屏文本编辑包。\n*   `Kate`: 功能全、多窗口的文本编辑包。\n\n这两个编辑器都是包含许多高级功能的图形化文本编辑器。`Kate`\
  \ 编辑器提供了更高级的功能，以及一些在标准文本编辑器中不常见的额外便利功能。本节描述了每种编辑器，并展示了一些你可以利用它们来帮助编辑 shell 脚本的功能。\n\
  \n## KWrite 编辑器\n\n`KDE` 环境的基础编辑器是 `KWrite`。它提供了简单的字字处理风格的文本编辑，并支持代码语法高亮和编辑。默认的\
  \ `KWrite` 编辑窗口如图图 9.5 所示。\n\n图 9.5 正在编辑 shell 脚本程序的 `KWrite` 窗口\n\n![9.5](img/c09f005.jpg)\n\
  \n从图 9.5 中看不出来，但 `KWrite` 编辑器识别几种类型的编程语言，并使用颜色编码来区分常量、函数和注释。此外，注意 `for` 循环有一个连接前后大括号的图标。这被称为折叠标记。通过点击图标，你可以将函数折叠为单行。这在处理大型应用程序时是一个非常棒的功能。\n\
  \n`KWrite` 编辑窗口提供了完整的剪切和粘贴功能，可以使用鼠标和方向键。像文字处理器一样，你可以在缓冲区区域任何地方高亮并剪切（或复制）文本，并粘贴到任何其他地方。\n\
  \n要使用 `KWrite` 编辑文件，你可以从桌面的 `KDE` 系统中选择 `KWrite`（某些 Linux 发行版甚至为它创建了面板图标），或者从命令行提示符启动它：\n\
  \n```bash\nkwrite factorial.sh\n```\n\n`kwrite` 命令有几个你可以用于自定义其启动方式的命令行参数：\n\n* \
  \  `--stdin` 导致 `KWrite` 从标准输入设备读取数据而不是文件。\n*   `--encoding` 指定用于文件的字符编码类型。\n* \
  \  `--line` 指定编辑器窗口中开始位置的文件行号。\n*   `--column` 指定编辑器窗口中开始位置的文件列号。\n\n`KWrite` 编辑器在编辑窗口顶部提供了菜单栏和工具栏，允许你选择功能并更改\
  \ `KWrite` 编辑器的配置设置。\n\n菜单栏包含以下项目：\n\n*   `File`: 用于从文件中加载、保存、打印和导出文本。\n*   `Edit`:\
  \ 用于操作缓冲区区域的文本。\n*   `View`: 管理文本在编辑器窗口中的显示方式。\n*   `Bookmarks`: 用于处理返回文本中特定位置的指针（此选项可能需要在配置中启用）。\n\
  *   `Tools`: 包含用于操作文本的特殊功能。\n*   `Settings`: 用于配置编辑器处理文本的方式。\n*   `Help`: 用于获取有关编辑器和命令的信息。\n\
  \n`Edit` 菜单栏项目为你所有的文本编辑需求提供了命令。你不需要记忆晦涩的键命令（顺便说一下，`KWrite` 也支持这些），你只需选择 `Edit` 菜单栏中的项目即可，如表\
  \ 9.2 所示。\n\n表 9.2 KWrite 编辑菜单项\n\n| 项目 |  |\n| :--- | :--- |\n| Undo (撤销) | 反转上一次操作或过程\
  \ |\n| Redo (重做) | 反转上一次撤销操作 |\n| Cut (剪切) | 删除选中文本并将其放入剪贴板 |\n| Copy (复制) | 将选中文本复制到剪贴板\
  \ |\n| Copy as HTML (复制为 HTML) | 将选中文本作为 HTML 代码复制到剪贴板 |\n| Paste (粘贴) | 将剪贴板当前内容插入到当前光标位置\
  \ |\n| Select All (全选) | 选中编辑器中的所有文本 |\n| Deselect (取消选择) | 取消当前选中的任何文本 |\n| Overwrite\
  \ Mode (覆盖模式) | 将插入模式切换到覆盖模式，用新输入的文本替换文本，而不仅仅插入新文本 |\n| Find (查找) | 生成“查找文本”对话框，允许你自定义文本搜索\
  \ |\n| Find Next (查找下一个) | 在缓冲区区域内向前重复上一次查找操作 |\n| Find Previous (查找上一个) | 在缓冲区内向后重复上一次查找操作\
  \ |\n| Replace (替换) | 生成“替换”对话框，允许你自定义文本搜索和替换 |\n| Find Selected (查找选中) | 查找选中文本的下一次出现\
  \ |\n| Find Selected Backwards (反向查找选中) | 查找选中文本的上一次出现 |\n| Go to Line (转行) | 生成“转到”对话框，允许你输入行号。光标移动到指定行\
  \ |\n\n`Find` (查找) 功能有两种模式——普通模式（可以执行简单的文本搜索）和高级搜索与替换模式（必要时你可以进行高级的搜索和替换）。你使用 `Find`\
  \ 部分中的绿色箭头在两种模式之间切换，如图 9.6 所示。\n\n图 9.6 KWrite 查找部分\n\n![9.6](img/c09f006.jpg)\n\
  \n`Find` 高级模式允许你不仅可以使用单词搜索，还可以使用正则表达式（在第 19 章中讨论）进行搜索。你还可以使用其他选项来自定义搜索，例如指示是否执行区分大小写的搜索，或者只查找整个单词而不是在单词内查找文本。\n\
  \n`Tools` 菜单栏项目为处理缓冲区中的文本提供了几个方便的功能。表 9.3 描述了 `KWrite` 中可用的工具。\n\n表 9.3 KWrite 工具\n\
  \n| 工具 |  |\n| :--- | :--- |\n| Read Only Mode (只读模式) | 锁定文本以便在编辑器中无法进行任何更改 |\n\
  | Encoding (编码) | 设置文本使用的字符集编码 |\n| Spelling (拼写) | 在文本开始启动拼写检查程序 |\n| Spelling\
  \ (from cursor) (从光标拼写) | 从当前光标位置启动拼写检查程序 |\n| Spellcheck Selection (检查选中) | 仅对选文本部分启动拼写检查程序\
  \ |\n| Indent (缩进) | 增加段落缩进 |\n| Unindent (取消缩进) | 减少段落缩进 |\n| Clean Indentation\
  \ (清理缩进) | 将所有段落缩进恢复原始设置 |\n| Align (对齐) | 强制当前行或选定行返回默认缩进设置 |\n| Uppercase (大写)\
  \ | 将选中文本或当前光标处的字符设置为大写 |\n| Lowercase (小写) | 将选中文本或当前光标处的字符设置为小写 |\n\n\n\n\n\n\
  | 大写 (Capitalize) | 将所选文本或当前光标位置单词的首字母大写 |\n| 合并行 (Join Lines) | 将所选行或当前光标位置行与下一行合并为一行\
  \ |\n| 自动换行 (Word Wrap Document) | 启用文本自动换行。如果某行超过了编辑器窗口边缘，该行将继续在下一行显示 |\n\n简单的文本编辑器有很多工具！\n\
  \n设置（Settings）菜单包含“配置编辑器”（Configure Editor）对话框，如图 9.7 所示。\n\n图 9.7 KWrite 配置编辑器对话框\n\
  \n![9.7](img/c09f007.jpg)\n\n该配置对话框在左侧使用图标，供你选择在 KWrite 中要配置的功能。当你选择一个图标时，对话框的右侧会显示该功能的配置设置。\n\
  \n外观（Appearance）功能允许你设置若干控制文本在文本编辑器窗口中显示方式的功能。你可以从这里启用自动换行、行号（对程序员非常有帮助）以及文件夹标记。通过“字体与颜色”（Fonts\
  \ & Colors）功能，你可以自定义编辑器的完整配色方案，决定程序代码中每种类文本显示什么颜色。\n\n## Kate 编辑器\n\nKate 编辑器是 KDE\
  \ 项目的旗舰编辑器。它使用了与 KWrite 应用程序相同的文本编辑器（因此大多数功能都是相同的），但它将许多其他功能集成到了一个单一包中。\n\n当你启动\
  \ Kate 编辑器时，首先会的是编辑器并没有启动！相反，你会看到一个对话框，如图 9.8 所示。\n\n图 9.8 Kate 会话对话框\n\n![9.8](img/c09f008.jpg)\n\
  \nKate 编辑器以“会话”（sessions）的形式处理文件。你可以在一个会话中打开多个文件，并保存多个会话。当你启动 Kate 时，它会为你提供返回哪个会话的选项。当你关闭\
  \ Kate 会话时，它会记住你之前打开的文档，并在下次启动 Kate 时显示它们。这允许你通过为每个项目使用独立的工作空间来轻松管理来自多个项目的文件。\n\n\
  选择会话后，你将看到 Kate 编辑器的主窗口，如图 9.9 所示。\n\n图 9.9 Kate 主编辑窗口\n\n![9.9](img/c09f009.jpg)\n\
  \n左侧框架显示当前会话中打开的文档。你只需点击文档名称即可在文档之间切换。要编辑新文件，点击左侧的“文件系统浏览器”（Filesystem Browser）标签。左侧框架现在是一个完整的图形化文件系统浏览器，允许你通过图形化浏览来定位文件。\n\
  \nKate 编辑器的一大强大功能是内置终端窗口，如图 9.10 所示。\n\n图 9.10 Kate 内置终端窗口\n\n![9.10](img/c09f010.jpg)\n\
  \n文本编辑器窗口底部的终端标签会启动 Kate 内置的终端模拟器（使用 KDE Konsole 终端模拟器）。此功能会将当前编辑窗口水平拆分，创建一个运行着\
  \ Konsole 的新窗口。你现在可以输入命令行命令、启动程序或检查系统设置，而无需离开编辑器！要关闭终端窗口，只需在命令提示符处输入 `exit`。\n\n\
  正如你从终端功能中看到的那样，Kate 也支持多窗口。“窗口”（Window）菜单栏项提供了以下选项：\n\n*   使用当前会话创建一个新的 Kate 窗口\n\
