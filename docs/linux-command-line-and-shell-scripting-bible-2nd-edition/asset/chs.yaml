  \ [kworker]\nroot     190     0  1 11:29 ?           00:00:00 [kworker]\nroot  \
  \   191     0  1 11:29 ?           00:00:00 [kworker]\nroot     192     0  1 11:29\
  \ ?           00:00:00 [kworker]\nroot     193     0  1 11:29 ?           00:00:00\
  \ [kworker]\nroot     194     0  1 11:29 ?           00:00:00 [kworker]\nroot  \
  \   195     0  1 11:29 ?           00:00:00 [kworker]\nroot     196     0  1 11:29\
  \ ?           00:00:00 [kworker]\nroot     197     0  1 11:29 ?           00:00:00\
  \ [kworker]\nroot     198     0  1 11:29 ?           00:00:00 [kworker]\nroot  \
  \   199     0  1 11:29 ?           00:00:00 [kworker]\nroot     200     0  1 11:29\
  \ ?           00:00:00 [kworker]\n```\n\n参数非常多，而且记住，还有更多！使用 `ps` 命令的关键不在于背诵所有可用参数，而在于记住你认为最有用的那些。大多数\
  \ Linux 系统管理员都有自己的一套常用参数集，他们记住这些参数以提取相关信息。例如，如果你需要查看系统上运行的所有内容，请使用 `-ef` 参数组合（`ps`\
  \ 命令允许你这样组合参数）：\n\n### Unix 风格参数\n\nUnix 风格参数源于 Bell Labs 发明的 AT&T Unix 系统上运行的原始\
  \ `ps` 命令。这些参数如表 4.1 所示。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| -A | 显示所有进程。 |\n| -N\
  \ | 显示指定参数的反向。 |\n| -a | 显示所有非会话头和无终端的进程。 |\n| -d | 显示所有非会话头的进程。 |\n| -e | 显示所有进程。\
  \ |\n| -C cmslist | 显示包含在列表 `cmdlist` 中的进程。 |\n| -G grplist | 显示组 ID 在 `grplist`\
  \ 列表中的进程。 |\n| -U userlist | 显示由 `userlist` 列表中 userid 拥有的进程。 |\n| -g grplist |\
  \ 按 `grplist` 的会话或组 ID 显示进程。 |\n| -p pidlist | 显示 PID 在 `pidlist` 列表中的进程。 |\n| -s\
  \ sesslist | 显示会话 ID 在 `sesslist` 列表中的进程。 |\n| -t ttylist | 显示终端 ID 在 `ttylist`\
  \ 列表中的进程。 |\n| -u userlist | 按 `userlist` 列表中有效 userid 显示进程。 |\n| -F | 使用额外的完整输出。\
  \ |\n| -O format | 在列表格式中显示特定列，同时显示默认列。 |\n| -M | 显示关于进程的安全信息。 |\n| -c | 显示关于进程的额外调度信息。\
  \ |\n| -f | 显示完整格式列表。 |\n| -j | 显示作业信息。 |\n| -l | 显示长列表。 |\n| -o format | 仅显示 `format`\
  \ 中列出的特定列。 |\n| -y | 不显示进程标志。 |\n| -Z | 显示安全上下文信息。 |\n| -H | 以分级格式显示进程（显示父进程）。 |\n\
  | -n namelist | 定义在 `WCHAN` 列中显示的值。 |\n| -w | 使用宽输出格式，用于无限宽度显示。 |\n| -L | 显示进程线程。\
  \ |\n| -V | 显示 `ps` 的版本。 |\n\n\n\n\n为了节省空间，输出中删减了一些行，但正如你所见，Linux 系统上运行着许多进程。此示例使用了两个参数：`-e`\
  \ 参数显示系统上运行的所有进程，`-f` 参数扩展输出以显示几列有用的信息：\n\n*   `UID`: 负责启动进程的用户\n*   `PID`: 进程的\
  \ ID（进程标识）\n*   `PPID`: 父进程的 PID（如果一个进程是由另一个进程启动的）\n*   `C`: 进程在生命周期内的 CPU 占用率\n\
  *   `STIME`: 进程启动的系统时间\n*   `TTY`: 启动进程的终端设备\n*   `TIME`: 运行进程所需的累计 CPU 时间\n*  \
  \ `CMD`: 启动的程序名称\n\n这产生了相当丰富的信息，也是许多系统管理员想要看到的内容。如需更多信息，可以使用 `-l` 参数，它会产生长格式输出：\n\
  \n```\n$ ps -l\n\n F S  UID PID  PPID  C  PRI  NI ADDR  SZ  WCHAN  TTY      TIME\
  \    CMD\n 0 S  500 3081  3080  0   80   0  -  1173  wait  pts/0    00:00:00  bash\n\
  \ 0 R  500 4463  3081   1   80   0  -  1116  -     pts/0    00:00:00  ps\n$\n```\n\
  \n注意当使用 `-l` 参数时出现的额外列：\n\n*   `F`: 内核为进程分配的系统标志位\n*   `S`: 进程状态（O = 正在处理器上运行；S\
  \ = 睡眠；R = 可运行，等待运行；Z = 僵尸，进程已终止但父进程不存在；T = 进程已停止）\n*   `PRI`: 进程优先级（数字越大优先级越低）\n\
  *   `NI`: Nice 值，用于确定优先级\n*   `ADDR`: 进程的内存地址\n*   `SZ`: 如果进程被交换出内存，所需的近似交换空间大小\n\
  *   `WCHAN`: 进程睡眠时的内核函数地址\n\n在继续之前，还有一个极其实用的参数需要记住，即 `-H`。`-H` 参数以层级格式组织进程，显示哪些进程启动了哪些其他进程。以下是从\
  \ `-efH` 格式列表提取的内容：\n\n```\n$ ps -efH\n\nUID    PID    PPID  C STIME TTY       TIME\
  \             CMD\nroot   3078  1981  0 12:00 ?           00:00:00      sshd: rich\
  \ [priv]\nrich   3080  3078  0 12:00 ?           00:00:00        sshd: rich@pts/0\n\
  rich   3081  3080  0 12:00 pts/0     00:00:00          -bash\nrich   4803  3081\
  \  1 14:31 pts/0     00:00:00          ps -efH\n```\n\n注意 `CMD` 列输出的偏移。这显示了正在运行进程的层级结构——首先是由\
  \ root 用户启动的 sshd 进程（这是安全外壳 SSH 服务器会话，它监听远程 SSH 连接）。接下来，由于此会话是从远程终端连接到系统的，主 SSH\
  \ 进程产生了一个终端进程（`pts/0`），该进程又产生了一个 bash shell。\n\n从那里开始运行了 `ps` 命令，它显示为 bash 进程的子进程。在多用户系统中，当尝试排查失控进程（runaway\
  \ processes）或尝试追踪它们属于哪个用户 ID 或终端时，这是一个非常有用的工具。\n\n## BSD 风格参数\n\n现在你已经了解了 Unix 参数，让我们让我们来看看\
  \ BSD 风格的参数。伯克利软件发行版（BSD）是在（当然是）加州大学伯克利分校开发的一个 Unix 版本。它与 AT&T Unix 系统有许多细微差别，因此多年来引发了多次“Unix\
  \ 战争”。`ps` 命令参数的 BSD 版本见表 4.2。\n\nTable 4.2 ps 命令 BSD 参数\n\n| 参数 | 说明 |\n| :---\
  \ | :--- |\n| T | 显示与此终端关联的所有进程。 |\n| a | 显示与任何终端关联的所有进程。 |\n| g | 显示包括会话头的所有进程。\
  \ |\n| r | 仅显示运行中的进程。 |\n| x | 显示所有进程，即使是没有分配终端设备的进程。 |\n| U userlist | 显示 userlist\
  \ 中列出的 userid 拥有的进程。 |\n| p pidlist | 显示 PID 在 pidlist 中的进程。 |\n| t ttylist | 显示与\
  \ tty 关联的进程。 |\n| O | 定义列。 |\n| X | 定义状态。 |\n| Z | 定义状态。 |\n| j | 定义输出。 |\n| l |\
  \ 定义输出。 |\n| o | 定义列。 |\n| s | 定义输出。 |\n| u | 定义列。 |\n| v | 定义输出。 |\n| c | 定义输出。\
  \ |\n| h | 定义输出。 |\n| n | 定义列。 |\n| w | 定义输出。 |\n| H | 定义输出。 |\n| m | 定义输出。 |\n\
  | V | 定义输出。 |\n\n许多系统管理员喜欢 BSD 风格的 `l` 参数，因为它为进程产生了更详细的状态代码（`STAT` 列）。这种双字符代码比单字符的\
  \ Unix 输出更精确地定义了进程发生的情况。\n\n第一个字符使用的值与 Unix 风格的 S 输出列相同，显示进程是在睡眠、运行还是等待状态。第二个字符进一步定义了进程的状态：\n\
  \n*   `<`: 进程以高优先级运行。\n*   `N`: 进程以低优先级运行。\n*   `L`: 进程的页面被锁定在内存中。\n*   `s`: 进程是一个会话首。\n\
  *   `l`: 进程是多线程的。\n*   `+`: 进程在前台运行。\n\n从之前显示的简单示例中，你可以看到 bash 命令处于睡眠状态，但它是一个会话首（它是我会话中的主进程），而\
  \ `ps` 命令在系统中在前台运行。\n\n当你使用 BSD 风格参数时，输出会自动变化。这里是一个使用 BSD 风格 `l` 的示例：\n\n```\n$\
  \ ps -l\n\n F S  UID PID  PPID  C  PRI  NI ADDR  SZ  WCHAN  TTY      TIME    CMD\n\
  \ 0 S  500 3081  3080  0   80   0  -  1173  wait  pts/0    00:00:00  bash\n 0 R\
  \  500 4463  3081   1   80   0  -  1116  -     pts/0    00:00:00  ps\n$\n```\n\n\
  注意虽然许多输出列与我们使用 Unix 参数时相同，但有两个不同的：\n\n*   `VSZ`: 进程在内存中的大小（KB 为单位）\n*   `RSS`: 进程使用的未交换出的物理内存大小\n\
  *   `STAT`: 表示当前进程状态的双字符状态码\n\n## GNU 长参数\n\n最后，GNU 开发者通过在参数组合中添加更多选项，对新的改进后的 `ps`\
  \ 命令添加了他们自己的记。一些 GNU 长参数复制了现有的 Unix 或 BSD 风格参数，而另一些则提供了新功能。表 4.3 列出了可用的 GNU 长参数。\n\
  \n\n\n\n# `ps` 命令 GNU 参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `--deselect` | 显示命令行中列出之外的所有进程。\
  \ |\n| `--Group grplist` | 显示组 ID 在 `grplist` 中的进程。 |\n| `--User userlist` | 显示用户\
  \ ID 在 `userlist` 中的进程。 |\n| `--group grplist` | 显示有效组 ID 在 `grplist` 中的进程。 |\n\
  | `--pid pidlist` | 显示进程 ID 在 `pidlist` 中的进程。 |\n| `--ppid pidlist` | 显示父进程 ID 在\
  \ `pidlist` 中的进程。 |\n| `--sid sidlist` | 显示会话 ID 在 `sidlist` 中的进程。 |\n| `--tty ttylist`\
  \ | 显示终端设备 ID 在 `ttylist` 中的进程。 |\n| `--user userlist` | 显示有效用户 ID 在 `userlist`\
  \ 中的进程。 |\n| `--format format` | 仅显示格式中指定的列。 |\n| `--context` | 显示额外的安全信息。 |\n|\
  \ `--cols n` | 设置屏幕宽度为 `n` 列。 |\n| `--columns n` | 设置屏幕宽度为 `n` 列。 |\n| `--cumulative`\
  \ | 停止的子进程信息。 |\n| `--forest` | 以分级列表显示进程，显示父进程。 |\n| `--headers` | 在输出的每一页上重复列标题。\
  \ |\n| `--no-headers` | 不显示列标题。 |\n| `--lines n` | 设置屏幕高度为 `n` 行。 |\n| `--rows n`\
  \ | 设置屏幕高度为 `n` 行。 |\n| `--sort order` | 定义用于排序输出的列。 |\n| `--width n` | 设置屏幕宽度为\
  \ `n` 列。 |\n| `--help` | 显示帮助信息。 |\n| `--info` | 显示调试信息。 |\n| `--version` | 显示 `ps`\
  \ 程序的版本。 |\n\n你可以将 GNU 长参数与 Unix 或 BSD 风格的参数结合，以真正自定义你的显示。GNU 长参数中我们非常喜欢的酷功能是 `--forest`\
  \ 参数。它显示分级进程信息，但使用 ASCII 字符绘制可爱的图表：\n\n```\n1981 ?          00:00:00  sshd\n  3078\
  \ ?          00:00:00   \\_  sshd\n  3080 ?          00:00:00      \\_  sshd\n \
  \ 3081 pts/0    00:00:00          \\_  bash\n16676 pts/0    00:00:00           \
  \   \\_  ps\n```\n\n这种格式使得追踪子进程和父进程变得轻而易举！\n\n## 实时进程监控\n\n`ps` 命令对于获取系统上运行进程的信息非常有用，但它有一个缺点。`ps`\
  \ 命令只能显示特定时间点的信息。如果你试图寻找频繁在内存中交换换出的进程的趋势，那么使用 `ps` 命令很难做到这一点。\n\n相反，`top` 命令可以解决这个问题。`top`\
  \ 命令以类似于 `ps` 命令的方式显示进程信息，但它是实时模式运行的。图 4.1 是 `top` 命令运行时的快照。\n\n图 4.1 `top` 命令运行时的输出\n\
  \n![4.1](img/c04f001.jpg)\n\n输出的第一部分显示常规系统信息。第一行显示当前时间、系统已运行时间、登录用户数以及系统的平均负载（load\
  \ average）。\n\n平均负载显示三个数字，分别为 1 分钟、5 分钟和 15 分钟的平均负载。值越高，系统承受的负载越重。1 分钟负载值在短时间内出现高值值并不稀奇。如果\
  \ 15 分钟的负载值很高，你的系统可能出了问题。\n\n> **注意**：Linux 系统管理的诀窍在于精确定义什么是“高平均负载值”。这个值取决于你的系统上通常运行的程序以及硬件配置。对于一个系统来说很高的值，对于另一个系统可能是正常的。通常情况下，如果你的平均负载开始超过\
  \ 2，说明你的系统变得忙碌了。\n\n第二行显示常规进程信息（在 `top` 中称为 `tasks`）：运行中、睡眠中、停止和僵尸（已完成但其父进程未响应）的进程数量。\n\
  \n接下来的行行显示常规 CPU 信息。`top` 显示将 CPU 利用率细分为几类，取决于进程的所有者（用户进程与系统进程）以及进程的状态（运行、空闲或等待）。\n\
  \n此之后，有两行详细说明了系统内存的状态。第一行显示系统物理内存的状态，包括总内存、当前使用内存和空闲内存。第二行内存显示系统交换内存区域（swap memory）的状态（如果已安装），具有相同的信息。\n\
  \n最后，下一部分显示当前运行进程的详细列表，其中一些信息列在 `ps` 命令的输出中看起来很熟悉：\n\n*   `PID`: 进程的 ID\n*   `USER`:\
  \ 进程所有者的用户名\n*   `PR`: 进程的优先级\n*   `NI`: 进程的 nice 值\n*   `VIRT`: 进程使用的总虚拟内存\n* \
  \  `RES`: 进程正在使用的物理内存量\n*   `SHR`: 进程与其他进程共享的内存量\n*   `S`: 进程状态（D = 可中断睡眠，R = 运行，S\
  \ = 睡眠，T = 跟踪或停止，或 Z = 僵尸）\n*   `%CPU`: 进程使用的 CPU 时间比例\n*   `%MEM`: 进程使用的可用物理内存比例\n\
  *   `TIME+`: 进程自启动以来使用的总 CPU 时间\n*   `COMMAND`: 进程的命令行名称（启动的程序）\n\n默认情况下，启动 `top`\
  \ 时，它根据 `%CPU` 值对进程进行排序。你可以在 `top` 运行时使用多个交互式命令之一更改排序顺序。每个交互式命令都是可以在 `top` 运行时按的单个字符，并改变程序的行为。这些命令如表\
  \ 4.4 所示。\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `1` | 切换单 CPU 和对称多处理器 (SMP) 状态。 |\n\
  | `b` | 切换表格中重要数字的加粗。 |\n| `I` | 切换 Irix/Solaris 模式。 |\n| `z` | 配置表格颜色。 |\n| `l`\
  \ | 切换显示平均负载行。 |\n| `t` | 切换显示 CPU 信息行。 |\n| `m` | 切换显示 MEM 和 SWAP 信息行。 |\n| `f`\
  \ | 添加或删除不同的信息列。 |\n| `o` | 更改信息列的显示顺序。 |\n| `F` 或 `O` | 选择用于排序进程的字段（默认为 %CPU）。\
  \ |\n| `<` 或 `>` | 将排序字段向左一列 (<) 或向右移动 (>) |\n| `r` | 切换正常或反向排序顺序。 |\n| `h` | 切换显示线程。\
  \ |\n| `c` | 切换显示进程的命令名称或完整命令行（包括参数）。 |\n| `i` | 切换显示空闲进程。 |\n| `S` | 切换显示累积 CPU\
  \ 时间或相对 CPU 时间。 |\n| `x` | 切换排序字段的高亮。 |\n| `y` | 切换运行中任务的高亮。 |\n| `z` | 切换颜色和单色模式。\
  \ |\n| `b` | 切换 x 和 y 模式的加粗模式。 |\n| `u` | 显示特定用户的进程。 |\n| `n` 或 `#` | 设置显示的进程数。\
  \ |\n| `k` | 杀死特定进程（仅限进程所有者或 root 用户）。 |\n| `r` | 更改特定进程的优先级 (renice)(仅限进程所有者或 root\
  \ 用户）。 |\n| `d` 或 `s` | 更改更新间隔（默认三秒）。 |\n| `W` | 将当前设置写入配置文件。 |\n| `q` | 退出 `top`\
  \ 命令。 |\n\n你对 `top` 命令的输出有很大的控制权。使用这个工具，你经常可以找到接管你系统的故障进程。当然，一旦你找到了，下一项工作就是停止它，这引出了我们的下一个话题。\n\
  \n## 停止进程\n\n\n\n\n\n作为系统管理员，至关重要的一点是知道何时以及如何停止一个进程。有时进程会挂起，只需要轻轻“推”一下就能重新运行或停止。在其他时候，进程会过度占用\
  \ CPU 并拒绝让出。在这两种情况下，你都需要一个允许你控制进程的命令。Linux 遵循 Unix 的进程间通信方法。\n\n在 Linux 中，进程之间通过使用信号（signals）进行通信。进程信号是一种预定义的消息，进程可以识别它，并选择忽略或处理。开发者通过编程来规定进程如何处理信号。大多数编写良好的应用程序都有能力接收并处理标准的\
  \ Unix 进程信号。这些信号显示在表 4.5 中。\n\nTable 4.5 Linux 进程信号\n\n| 信号值 | 名称 | 描述 |\n| :---\
  \ | :--- | :--- |\n| 1 | HUP | 挂断（Hang up）。 |\n| 2 | INT | 中断（Interrupt）。 |\n| 3\
  \ | QUIT | 停止运行。 |\n| 9 | KILL | 无条件终止。 |\n| 11 | SEGV | 段错误（Segment violation）。\
  \ |\n| 15 | TERM | 如果可能，则终止。 |\n| 17 | STOP | 无条件停止，但不终止。 |\n| 18 | TSTP | 停止或暂停，但在后台继续运行。\
  \ |\n| 19 | CONT | 在 STOP 或 TSTP 后恢复执行。 |\n\nLinux 中有两个可用命令允许你向运行中的进程发送进程信号。\n\n\
  ## kill 命令\n\n`kill` 命令允许你根据进程 ID（PID）向进程发送信号。默认情况下，`kill` 命令会向命令行中列出的所有 PID 发送\
  \ `TERM` 信号。遗憾的是，你只能使用进程 PID 而不是其命令名称，这使得 `kill` 命令有时变得难用。\n\n要发送进程信号，你必须是该进程的所有者，或者以\
  \ root 用户身份登录。\n\n```bash\n$ kill 3940\n-bash: kill: (3940) - Operation not permitted\n\
  $\n```\n\n`TERM` 信号告诉进程礼貌地停止运行。遗憾的是，如果你有一个失控的进程，它很可能会忽略该请求。当你需要采取强制手段时，`-s` 参数允许你指定其他信号（使用其名称或信号数字）。\n\
  \n通常的程序是首先尝试 `TERM` 信号。如果进程忽略了该信号，则尝试 `INT` 或 `HUP` 信号。如果程序识别这些信号，它将尝试在关闭之前优雅地停止正在执行的操作。最强制的信号是\
  \ `KILL` 信号。当进程接收此信号时，它会立即停止。这可能会导致文件损坏。\n\n如接下来的示例所示，`kill` 命令没有相关的输出。\n\n```bash\n\
  # kill -s HUP 3940\n#\n```\n\n要查看命令是否生效，你必须执行另一个 `ps` 或 `top` 命令来查看违规进程是否已停止。\n\n\
  ## killall 命令\n\n`killall` 命令是一种通过名称而非 PID 数字来停止进程的强大方法。`killall` 命令还允许你使用通配符字符，当当系统出现故障时这是一个非常有用的工具：\n\
  \n```bash\n# killall http*\n#\n```\n\n此示例将杀死所有以 `http` 开头的进程，例如 Apache Web 服务器的\
  \ `httpd` 服务。\n\n#### 注意事项\n\n在以 root 用户登录时，使用 `killall` 命令要极度小心。很容易沉迷于通配符字符并意外停止重要的系统进程。这可能导致文件系统损坏。\n\
  \n## 监控磁盘空间\n\n系统管理员的另一个重要任务是跟踪系统的磁盘使用情况。无论你运行的是简单的 Linux 桌面还是大型的 Linux 服务器，你都需要知道为应用程序留了多少空间。\n\
  \n有几个命令行命令可以帮助你管理 Linux 系统上的媒体环境。本节描述了你在执行系统管理职责可能会遇到的核心命令。\n\n## 挂载介质\n\n正如第 3\
  \ 章所述，Linux 文件系统将所有介质磁盘合并到一个虚拟目录中。在系统上使用新的介质磁盘之前，你需要将其放置在虚拟目录。这项任务被称为挂载（mounting）。\n\
  \n在当今的图形化桌面世界中，大多数 Linux 发行版都有自动挂载特定类型可移动介质的能力。可移动介质设备是（显然）可以从 PC 上轻松移除的媒介，例如 CD-ROM、软盘和\
  \ USB 闪存。\n\n如果你没有使用自动挂载和卸载可移动介质的发行版，你必须自己手动完成。本节描述了帮助你管理可移动介质设备的 Linux 命令行命令。\n\
  \n#### mount 命令\n\n奇怪的是，用于挂载介质的命令叫做 `mount`。默认情况下，`mount` 命令显示当前挂载在系统上的介质设备列表：\n\
  \n```bash\n$ mount\n/dev/mapper/VolGroup00-LogVol00 on / type ext3 (rw)\nproc on\
  \ /proc type proc (rw)\nsysfs on /sys type sysfs (rw)\n```\n\n`mount` 命令提供了四部分信息：\n\
  - 介质的设备名称\n- 虚拟目录中的挂载点\n- 文件系统类型\n- 挂载介质的访问状态\n\n要在虚拟目录中手动挂载设备，你需要以 root 用户身份登录。以下是手动挂载设备的基本命令：\n\
  \n```bash\n$ mount -t ext3 /dev/sda1 /mnt\n```\n\n`-t` 参数定义磁盘格式化时使用的文件系统类型。Linux\
  \ 识别的各种文件系统类型非常多。如果你与 PC 共享可移动介质，你可能遇到的类型有：\n- `vfat`: Windows 长文件系统。\n- `ntfs`:\
  \ 用于 Windows NT、XP 和 Vista 的 Windows 高文件系统。\n- `iso9660`: 标准 CD-ROM 文件系统。\n\n后两个参数定义了介质设备文件的位置以及虚拟目录中挂载点的位置。例如，要将\
  \ `/dev/sdb1` 处的 USB 闪存手动挂载到 `/media/disk`，你需要使用：\n\n```bash\n$ mount -t vfat /dev/sdb1\
  \ /media/disk\n```\n\n一旦介质设备挂载到虚拟目录，root 用户将拥有该设备的完全访问权限，但其他用户的访问将被限制。你可以使用目录权限（第\
  \ 6 章讨论）来控制谁可以访问该设备。\n\n如果你需要使用 `mount` 命令的一些更高级的功能，可用参数见表 4.6。\n\n[Table 4.6] mount\
  \ 命令参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| -a | 挂载 /etc/fstab 文件中指定的所有文件系统。 |\n|\
  \ -f | 导致 mount 命令模拟挂载设备，但不实际执行挂载。 |\n| -F | 与 -a 参数一起使用时，同时挂载所有文件系统。 |\n| -v |\
  \ 详细模式，解释挂载设备所需的所有步骤。 |\n| -I | 不使用 /sbin/mount.filesystem 下任何文件系统辅助文件。 |\n| -l\
  \ | 自动为 ext2、ext3 或 XFS 文件系统添加文件系统标签。 |\n\n\n\n\n\n| 选项 | 描述 |\n| :--- | :--- |\n\
  | `-n` | 挂载设备不在 `/etc/mstab` 挂载设备文件中注册。 |\n| `-p num` | 对于加密挂载，从文件描述符 `num` 读取口令。\
  \ |\n| `-s` | 忽略内核不支持的挂载选项。 |\n| `-r` | 以只读模式挂载设备。 |\n| `-w` | 以读写模式挂载设备（默认值）。 |\n\
  | `-L label` | 使用指定的标签挂载设备。 |\n| `-U uuid` | 使用指定的 uuid 挂载设备。 |\n| `-O` | 与 `-a`\
  \ 参数配合使用时，限制应用的文件系统。 |\n| `-o` | 为文件系统添加特定选项。 |\n\n`-o` 选项允许你通过逗号分隔的附加选项列表来挂载文件系统。常用的选项包括：\n\
  \n*   `ro`: 以只读模式挂载。\n*   `rw`: 以读写模式挂载。\n*   `user`: 允许普通用户挂载文件系统。\n*   `check=none`:\
  \ 在不进行完整性检查的情况下挂载文件系统。\n*   `loop`: 挂载文件。\n\n如今 Linux 中一种流行的做法是将 CD 分发为 `.iso` 文件。`.iso`\
  \ 文件是 CD 的完整镜像文件。大多数光盘刻录软件软件包都可以根据 `.iso` 文件创建新的 CD。`mount` 命令的一个功能是你可以直接将 `.iso`\
  \ 文件挂载到你的 Linux 虚拟目录中，而无需将其刻录到 CD。这是通过使用 `-o` 参数配合 `loop` 选项实现的：\n\n```bash\n$ mkdir\
  \ mnt\n$ su\nPassword:\n# mount -t iso9660 -o loop MEPIS-KDE4-LIVE-DVD_32.iso mnt\n\
  # ls -l mnt\ntotal 16\n-r--r--r-- 1 root root 702 2007-08-03 08:49 about\ndr-xr-xr-x\
  \ 3 root root 2048 2007-07-29 14:30 boot\n-r--r--r-- 1 root root 2048 2007-08-09\
  \ 22:36 boot.catalog\n-r--r--r-- 1 root root 894 2004-01-23 13:22 cdrom.ico\n-r--r--r--\
  \ 1 root root 5229 2006-07-07 18:07 MCWL\ndr-xr-xr-x 2 root root 2048 2007-08-09\
  \ 22:32 memis\ndr-xr-xr-x 2 root root 2048 2007-04-03 16:44 OSX\n-r--r--r-- 1 root\
  \ root 107 2007-08-09 22:36 version\n# cd mnt/boot\n## ls -l\ntotal 4399\ndr-xr-xr-x\
  \ 2 root root 2048 2007-06-29 09:00 grub\n-r--r--r-- 1 root root 2392512 2007-07-29\
  \ 12:53 initrd.gz\n-r--r--r-- 1 root root 94760 2007-06-14 14:56 memtest\n-r--r--r--\
  \ 1 root root 2014704 2007-07-29 14:26 vmlinuz\n```\n\n`mount` 命令挂载 `.iso` CD 镜像文件就像它是一个真实的\
  \ CD 一样，并允许我们在其文件系统内移动。\n\n### umount 命令\n\n要移除可移动介质设备，你不应该直接将其从系统中移除。相反，你应该总是先卸载它。\n\
  \n#### 提示\nLinux 不允许你弹出已挂载的 CD。如果你在尝试从驱动器弹出 CD 时遇到困难，很可能是 CD 仍然挂载在虚拟目录中。请先卸载它，然后再尝试弹出。\n\
  \n用于卸载设备的命令是 `umount`（是的，命令中没有“n”，这有时会引起混淆）。`umount` 命令的格式非常简单：\n\n```bash\numount\
  \ [directory | device]\n```\n\n`umount` 命令允许你通过设备位置或其挂载目录名称来定义介质设备。如果有任何程序打开了设备上的文件，系统将不允许你卸载它。\n\
  \n```bash\n[root@testbox mnt]# umount /home/rich/mnt\numount: /home/rich/mnt: device\
  \ is busy\numount: /home/rich/mnt: device is busy\n[root@testbox mnt]# cd /home/rich\n\
  [root@testbox rich]# umount /home/rich/mnt\n#root -l mnt\ntotal 0\n```\n\n在这个例子中，命令提示符仍然位于文件系统结构中的目录内，因此\
  \ `umount` 命令无法卸载镜像文件。一旦命令提示符移出镜像文件系统目录，`umount` 命令就能成功卸载该镜像文件。\n\n### 使用 df 命令\n\
  \n有时你需要查看单个设备上可用的磁盘空间。`df` 命令允许你轻松地查看所有挂载磁盘的状况：\n\n```bash\n$ df\nFilesystem   \
  \        1K-blocks      Used  Available Use% Mounted on\n/dev/sda2            18251068\
  \   7703964    9605024   45%  /\n/dev/sda1             101086      18680      77187\
  \   20%  /boot\ntmpfs                119536           0     119536    0%  /dev/shm\n\
  /dev/sdb1             127462   113892     13570   90%  /media/disk\n```\n\n`df`\
  \ 命令显示每个包含数据的挂载文件系统。正如你之前从 `mount` 命令看到的，某些挂载设备被用于系统内部目的。该命令显示以下内容：\n\n*   设备的设备位置。\n\
  *   它能容纳多少 1024 字节块的数据。\n*   已使用多少 1024 字节块的数据。\n*   可用多少 1024 字节块的数据。\n*   已用百分比。\n\
  *   设备挂载的挂载点。\n\n`df` 命令有几个不同的参数，其中大部分你都会用到。其中一个流行的是 `-h`，它以人类可读的格式显示空间：\n\n```bash\n\
  $ df -h\nFilesystem           1K-blocks      Used  Available Use% Mounted on\n/dev/sda2\
  \            18251068   7703964    9605024   45%  /\n/dev/sda1             101086\
  \      18680      77187   20%  /boot\ntmpfs                119536           0  \
  \   119536    0%  /dev/shm\n/dev/sdb1             127462   113892     13570   90%\
  \  /media/disk\n```\n\n### 使用 du 命令\n\n`du` 命令用于估计文件和目录的磁盘空间占用。默认情况下，它显示当前目录下的所有文件和子目录。以下是使用\
  \ `du` 的部分列表：\n\n```bash\n$ du\n484\t.gstreamer-0.10\n8K\t.Templates\n8K\t.Download\n\
  8K\t.ccache/7/0\n24K\t.ccache/7\n368K\t.ccache/a/d\n384K\t.ccache/a\n424K\t.ccache\n\
  8K\t.Public\n8K\t.gphp/plugins\n32K\t.gphp\n72K\t.gconfd\n128K\t.nautilus/metafiles\n\
  384K\t.nautilus\n72K\t.bittorrent/data/ainfo\n20K\t.bittorrent/data/resume\n144K\t\
  .bittorrent/data\n152K\t.bittorrent\n8K\t.Videos\n8K\t.Music\n16K\t.config/gtk-2.0\n\
  40K\t.config\n8K\t.Documents\n```\n\n`du` 命令本身可能没什么用。能够看到每个单独的文件和目录占用多少空间是好事，但当你必须翻阅数页的信息来寻找你需要的内容时，它可能是毫无意义的。\n\
  \n有几个命令行参数可以配合 `du` 命令使用，使情况变得更容易读：\n\n*   `-c`: 生成所有列出文件的总计。\n*   `-h`: 以人类可读的格式打印大小，使用\
  \ K 表示千字节，M 表示兆字节，G 表示吉字节。\n*   `-s`: 汇总每个参数。\n\n\n\n\n\n系统管理员的下一步是使用一些文件处理命令来操作大量数据。这正是下一节所涵盖的内容。\n\
  \n# 与数据文件工作\n\n当你拥有大量数据时，处理这些信息并使其变得有用通常是困难的。正如你在上一节中通过 `du` 命令看到的那样，在处理系统命令时，很容易产生数据过载。\n\
  \nLinux 系统提供了几个命令行工具来帮助你管理大量数据。本节涵盖了每个系统管理员——以及任何日常 Linux 用户都应该学会如何使用的基本命令，以使生活变得更轻松。\n\
  \n## 排序数据\n\n在处理大量数据时，一个非常实用的功能是 `sort` 命令。`sort` 命令的作用顾如其名——对数据进行排序。\n\n默认情况下，`sort`\
  \ 命令使用你为会话指定的默认语言的标准排序规则，对文本文件中的数据行进行排序。\n\n```\n$ cat file1\none\ntwo\nthree\n\
  four\nfive\n$ sort file1\nfive\nfour\none\nthree\ntwo\n$\n```\n\n非常简单。然而，事情并不总是看起来那么容易。看下面这个例子：\n\
  \n```\n$ cat file2\n1\n2\n100\n45\n3\n10\n145\n75\n$ sort file2\n1\n10\n100\n145\n\
  2\n3\n45\n75\n$\n```\n\n如果你期望数字按数值顺序排序，那么你可能会失望的。默认情况下，`sort` 命令将数字视为字符并执行标准的字符排序，产生的输出可能不是你想要的。要解决这个问题，请使用\
  \ `-n` 参数，它告诉 `sort` 命令将数字识别为数字而非字符，并根据它们的数值值进行排序：\n\n```\n$ sort -n file2\n1\n\
  2\n3\n10\n45\n75\n100\n145\n$\n```\n\n现在，这好多了！另一个常用的参数是 `-M`，即按月份排序（month sort）。Linux\
  \ 日志文件通常在行开头有一个时间戳，指示事件发生的时间：\n\n```\nSep 13 07:10:09 testbox smartd[2718]: Device:\
  \ /dev/sda, opened\n```\n\n如果你使用默认排序对使用时间戳日期的文件进行排序，你会得到这样的结果：\n\n```\n$ sort file3\n\
  Apr\nAug\nDec\nFeb\nJan\nJul\nJun\nMar\nMay\nNov\nOct\nSep\n$\n```\n\n这并不是你想要的。如果你使用\
  \ `-M` 参数，`sort` 命令会识别三个字母的月份命名法，并进行相应的排序：\n\n```\n$ sort -M file3\nJan\nFeb\nMar\n\
  Apr\nMay\nJun\nJul\nAug\nSep\nOct\nNov\nDec\n$\n```\n\n还有其他几个实用的排序参数可以使用，如表 4.7\
  \ 所示。\n\n### sort 命令参数\n\n| 单横线 | 双横线 | 描述 |\n| :--- | :--- | :--- |\n| `-b` | `--ignore-leading-blanks`\
  \ | 排序时忽略行前的空格。 |\n| `-C` | `--check = quiet` | 不排序，但如果数据超出排序顺序时不报告。 |\n| `-c` |\
  \ `--check` | 不排序，但检查输入数据是否已经排序。如果未排序则报告。 |\n| `-d` | `--dictionary-order` | 仅考虑空格和字母数字字符；不考虑特殊字符。\
  \ |\n| `-f` | `--ignore-case` | 默认情况下，大写字母在前。此参数忽略大小写。 |\n| `-g` | `--general-numeric-sort`\
  \ | 使用通用数值进行排序。 |\n| `-i` | `--ignore-nonprinting` | 排序时忽略不可打印字符。 |\n| `-k` | `--key\
  \ = POS1[,POS2]` | 根据位置 POS1 排序，如果指定则在 POS2 处结束。 |\n| `-M` | `--month-sort` | 使用三个字母的月份名称按月份顺序排序。\
  \ |\n| `-m` | `--merge` | 合并两个已经排序的数据文件。 |\n| `-n` | `--numeric-sort` | 按字符串数值值排序。\
  \ |\n| `-o` | `-output = file` | 将结果写入指定的文件。 |\n| `-R` | `--random-sort` | 按键的随机哈希值排序。\
  \ |\n| | `--random-source = FILE` | 指定用于 `-R` 参数的随机字节的文件。 |\n| `-r` | `--reverse`\
  \ | 反转排序顺序（降序而非升序）。 |\n| `-S` | `--buffer-size = SIZE` | 指定使用的内存量。 |\n| `-s` | `--stable`\
  \ | 禁用最后的比较手段。 |\n| `-T` | `--temporary-direction = DIR` | 指定存储临时工作文件的位置。 |\n| `-t`\
  \ | `--field-separator = SEP` | 指定用于区分键位置的字符。 |\n| `-u` | `--unique` | 与 `-c` 参数配合时检查严格排序；若无\
  \ `-c` 参数，仅输出两个相似行中的第一次出现。 |\n| `-z` | `--zero-terminated` | 使用 NULL 字符而非换行符结束所有行。\
  \ |\n\n在对使用字段（如 `/etc/passwd` 文件）的数据，`-k` 和 `-t` 参数非常方便。使用 `-t` 参数指定字段分隔符，使用 `-k`\
  \ 参数指定要对哪个字段进行排序。例如，根据数值用户 ID 对密码文件排序，只需执行：\n\n```\n$ sort -t ':' -k 3 -n /etc/passwd\n\
  root:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/sbin/nologin\ndaemon:x:2:2:daemon:/sbin:/sbin/nologin\n\
  adm:x:3:4:adm:/var/adm:/sbin/nologin\nlp:x:4:7:lp:/var/spool/lpd:/sbin/nologin\n\
  sync:x:5:0:sync:/sbin:/bin/sync\nshutdown:x:6:0:shutdown:/sbin:/sbin/shutdown\n\
  halt:x:7:0:halt:/sbin:/sbin/halt\nmail:x:8:12:mail:/var/spool/mail:/sbin/nologin\n\
  news:x:9:13:news:/etc/news:\nuucp:x:10:14:uucp:/var/spool/uucp:/sbin/nologin\noperator:x:11:0:operator:/root:/sbin/nologin\n\
  games:x:12:100:games:/usr/games:/\n```\n\n## 搜索数据\n\n在大文件中，你通常需要查找隐藏在中间某处的特定行。与其手动滚动整个文件，不如让\
  \ `grep` 命令为你搜索。`grep` 命令的命令行格式为：`grep [options] pattern [file]`\n\n`grep` 命令在输入或你指定的文件中搜索包含指定模式的行。`grep`\
  \ 的输出是包含匹配模式的行。\n\n以下在使用“排序数据”节中的 `file1` 使用 `grep` 命令的两个简单示例：\n\n```\n$ grep three\
  \ file1\nthree\n$ grep t file1\ntwo\nthree\n$\n```\n\n第一个示例在 `file1` 中搜索匹配模式 `three`\
  \ 的文本。`grep` 命令产生匹配模式的行。下一个示例在 `file1` 中搜索匹配模式 `t` 的文本。在这种情况下，有两行匹配指定的模式，它们都被显示出来。\n\
  \n由于 `grep` 命令的流行，它在生命周期经历了许多开发变化。`grep` 命令添加了许多功能。如果你查看 `grep` 命令的帮助页面（man pages），你会发现它是多么功能强大。\n\
  \n如果你想反向搜索（输出不匹配模式的行），使用 `-v` 参数：\n\n```\n$ grep -v t file1\none\nfour\nfive\n$\n\
  ```\n\n如果你需要找到匹配模式所在的行号，请使用 `-n` 参数：\n\n```bash\n$ grep -n t file1\n2:two\n3:three\n\
  $\n```\n\n如果你只需要查看包含匹配模式的行计数，请使用 `-c` 参数：\n\n```bash\n$ grep -c t file1\n2\n$\n\
  ```\n\n\n\n\n如果你需要指定多个匹配模式，请使用 `-e` 参数指定每个单独的模式：\n\n```bash\n$ grep -e t -e f file1\n\
  two\nthree\nfour\nfive $\n```\n\n此示例输出了包含字符串 `t` 或字符串 `f` 的行。\n\n默认情况下，`grep` 命令使用基本\
  \ Unix 风格的正则表达式来匹配模式。Unix 风格的正则表达式使用特殊字符来定义如何查找匹配模式。\n\n有关正则表达式的更详细的解释，请参阅第 19 章。\n\
  \n这里是一个在 `grep` 搜索中使用正则表达式的简单示例：\n\n```bash\n$ grep [tf] file1\ntwo\nthree\nfour\n\
  five $\n```\n\n正则表达式中的方括号 `[]` 表示 `grep` 应该查找包含字符 `t` 或 `f` 的任意一个匹配项。如果不使用正则表达式，`grep`\
  \ 将搜索匹配字符串 `tf` 的文本。\n\n`egrep` 命令是 `grep` 的分支，它允许你指定 POSIX 扩展正则表达式，该正则包含更多用于指定匹配模式的字符（详情请再次参阅第\
  \ 19 章）。`fgrep` 命令是另一个版本，允许你将匹配模式指定为固定字符串值的列表，并以换行符分隔。这允许你将字符串列表放在文件中，然后在 `fgrep`\
  \ 命令中使用该列表在较大的文件中搜索这些字符串。\n\n# 压缩数据\n\n如果你在 Microsoft Windows 世界中做过任何工作，毫无疑问用过 `zip`\
  \ 文件。它已成为一个非常受欢迎的功能，微软最终将其整合到了 Windows XP 操作系统。`zip` 工具允许你轻松地将大文件（包括文本和可执行文件）压缩成占用空间更小的文件。\n\
  \nLinux 包含多个文件压缩工具。虽然这听起来很棒，但在下载文件时往往会导致混乱和无章。[表 4.8 列出了 Linux 可用的文件压缩工具。\n\n###\
  \ 表 4.8 Linux 文件压缩工具\n\n| 工具 | 文件扩展名 | 描述 |\n| :--- | :--- | :--- |\n| `bzip2` |\
  \ `.bz2` | 使用 Burrows-Wheeler 块排序文本压缩算法和霍夫曼编码 |\n| `compress` | `.Z` | 原始 Unix 文件压缩工具；开始被遗忘\
  \ |\n| `gzip` | `.gz` | GNU 项目的压缩工具；使用 Lempel-Ziv 编码 |\n| `zip` | `.zip` | 用于 Windows\
  \ 的 PKZIP 程序的 Unix 版本 |\n\n`compress` 文件压缩工具在 Linux 系统上并不常见。如果你下载了一个带有 `.Z` 扩展的文件，通常可以使用第\
  \ 8 章讨论的软件安装方法安装 `compress` 软件包（在许多 Linux 发行版中称为 `ncompress`），然后使用 `uncompress`\
  \ 命令解压缩文件。\n\n## bzip2 工具\n\n`bzip2` 工具是一个较新的压缩包，正变得流行，特别是在压缩大型二进制文件时。`bzip2` 软件包中的工具包括：\n\
  \n* `bzip2` 用于压缩文件\n* `bzcat` 用于显示压缩文本文件的内容\n* `bunzip2` 用于解压缩压缩的 `.bz2` 文件\n* `bzip2recover`\
  \ 用于尝试恢复损坏的压缩文件\n\n默认情况下，`bzip2` 命令尝试压缩原始文件并用具有相同文件名 `.bz2` 扩展名的压缩文件替换它：\n\n```bash\n\
  $ ls -l myprog\n-rwxrwxr-x 1 rich rich 4882 2007-09-13 11:29 myprog\n$ bzip2 myprog\n\
  $ ls -l my*\n-rwxrwxr-x 1 rich rich 2378 2007-09-13 11:29 myprog.bz2 $\n```\n\n\
  `myprog` 程序的原始大小为 4882 字节，经过 `bzip2` 压缩后现在为 2378 字节。此外，注意 `bzip2` 命令自动重命名了原始文件并带有\
  \ `.bz2` 扩展名，这表明我们使用了什么压缩技术。\n\n要解文件，只需使用 `bunzip2` 命令：\n\n```bash\n$ bunzip2 myprog.bz2\n\
  $ ls -l myprog\n-rwxrwxr-x 1 rich rich 4882 2007-09-13 11:29 myprog $\n```\n\n你可以看到，解压缩的文件恢复到了原始大小。一旦你压缩了文本文件，就无法使用标准的\
  \ `cat`、`more` 或 `less` 命令来查看数据。相反，你需要使用 `bzcat` 命令：\n\n```bash\n$ bzcat test.bz2\n\
  This is a test text file.\nThe quick brown fox jumps over the lazy dog.\nThis is\
  \ the end of the test file. $\n```\n\n`bzcat` 命令在不解压缩实际文件的情况下显示压缩文件内部文本。\n\n## gzip\
  \ 工具\n\n到为止 Linux 中最受欢迎的压缩工具是 `gzip` 工具。`gzip` 软件包是 GNU 项目的产，目的是创建原始 Unix `compress`\
  \ 工具的免费版本。该软件包包含以下文件：\n\n* `gzip` 用于压缩文件\n* `gzcat` 用于显示压缩文件的内容\n* `gunzip` 用于解压缩文件\n\
  \n这些工具的工作方式与 `bzip2` 工具相同：\n\n```bash\n$ gzip myprog\n$ ls -l my*\n-rwxrwxr-x 1\
  \ rich rich 197 2007-09-13 11:29 myprog.gz $\n```\n\n`gzip` 命令压缩你在命令行上指定的文件。你也可以指定多个文件或使用通配符一次性压缩多个文件：\n\
  \n```bash\n$ gzip my*\n$ ls -l my*\n-rwxrr-- 1 rich rich 0 2007-09-13 13:43 myprog.c.gz\n\
  -rwxr-xr-x 1 rich rich 178 2007-09-13 13:43 myprog.gz\n-rwxrr-- 1 rich rich 9 2007-09-13\
  \ 13:46 myscript.gz\n-rwxrr-- 1 rich rich 60 2007-09-13 13:44 myscript!square.gif.gz\
  \ $\n```\n\n`gzip` 命令压缩目录中匹配通配符的每一个文件。\n\n## zip 工具\n\n`zip` 工具与 Phil Katz 为 MS-DOS\
  \ 和 Windows 创建的流行的 `PKZIP` 软件包兼容。Linux `zip` 软件包中有四个工具：\n\n* `zip` 创建包含文件和目录的压缩文件\n\
  * `zipcloak` 创建一个包含文件和目录的加密压缩文件\n* `zipnote` 从 `zip` 文件中提取注释\n* `zipsplit` 将 `zip`\
  \ 文件拆分为一组固定大小的小文件（用于将大文件拷贝到软磁盘）\n* `unzip` 从压缩的 `zip` 文件提取文件和目录\n\n要查看 `zip` 工具的所有可用选项，只需在命令行上单独输入它：\n\
  \n```\n$ zip\nCopyright (C) 1990-2005 Info-ZIP\nType “L” for software license.\n\
  Zip 2.31 (March 8th 2005). Usage:\nzip [-options] [-b path] [-t mmddyyyy] [-n suffixes]\
  \ [zipfile list] [-xi list]\n  其默认操作是从 list 中添加或替换 zipfile 条目，\n  这可以包括特殊名称 - 来压缩标准输入。\n\
  \  如果省略 zipfile 和 list，zip 将 stdin 压缩到 stdout。\n  -f freshen: 仅更改的文件 -u update:\
  \ 仅更改的或新的文件\n  -d delete entries in zipfile -m move into zipfile (delete files)\n\
  \  -r recurse into directories -j junk directory names\n  -0 store only -l convert\
  \ LF to CR LF\n  -1 compress faster -9 compress better\n  -q quiet operation -v\
  \ verbose operation\n  -c add one-line comments -z zipfile comment\n  -@ read names\
  \ from stdin -o make file as old as latest entry\n  -x exclude the following names\
  \ -i include only the following names\n  -F fix zipfile (-FF try harder) -D do not\
  \ add directory entries\n  -A adjust self-extracting exe -J junk zipfile prefix\
  \ (unzipsfx)\n  -T test zipfile integrity -X exclude extra file attributes\n  -y\
  \ store symbolic links as the link instead of the referenced file\n  -R PKZIP recursion\
  \ (see manual)\n  -e encrypt -n don't compress these suffixes\n```\n\n`zip` 工具的强大在于它可以将整个目录的文件压缩成单个压缩文件。这使得它非常归档整个目录结构：\n\
  \n```bash\n$ zip -r testzip test\n  adding: test/ (stored 0%)\n  adding: test/test1/\
  \ (stored 0%)\n  adding: test/test1/myprog2 (stored 0%)\n  adding: test/test1/myprog1\
  \ (stored 0%)\n```\n\n\n\n\n\n```\nadding: test/myprog.c (deflated 39%)\nadding:\
  \ test/file3 (deflated 2%)\nadding: test/file4 (stored 0%)\nadding: test/test2/\
  \ (stored 0%)\nadding: test/file1.gz (stored 0%)\nadding: test/file2 (deflated 4%)\n\
  adding: test/myprog.gz (stored 0%)\n$\n```\n\n此示例创建了一个名为 `testzip.zip` 的 zip 文件，并递归遍历\
  \ `test` 目录，将找到的每个文件和目录添加到 zip 文件中。从输出可以看出，zip 文件中存储的所有并不都能被压缩。`zip` 工具会自动为每个单独的文件确定最佳的压缩类型。\n\
  \n### 注意事项\n\n当你使用 `zip` 命令的递归功能时，文件将以相同的目录结构存储在 zip 文件中。包含在子目录中的文件将存储在 zip 文件中相同的子目录内。在提取文件时必须小心；`unzip`\
  \ 命令将在新位置重建整个目录结构。当你有大量的子目录和文件时，这可能会让人困惑。\n\n### 归档数据\n\n虽然 `zip` 命令在将数据压缩并归档到单个文件中效果很好，但它不是\
  \ Unix 和 Linux 世界中的标准工具。目前 Unix 和 Linux 中最流行的归档工具是 `tar` 命令。\n\n`tar` 命令最初用于将文件写入磁带设备进行归档。然而，它也可以将输出写入文件，这已成为\
  \ Linux 中存档数据的流行方式。\n\n以下是 `tar` 命令的格式：\n\n`tar function [options] object1 object2\
  \ …`\n\n函数参数定义了 `tar` 命令应该执行的操作，如表 4.9 所示。\n\n#### 表 4.9 tar 命令函数\n\n| 函数 | 完整名称\
  \ | 描述 |\n| :--- | :--- | :--- |\n| -A | --concatenate | 将现有的 tar 归档文件合并到另一个现有的\
  \ tar 归档文件中。 |\n| -c | --create | 创建一个新的 tar 归档文件。 |\n| -d | --diff | 检查 tar 归档文件与文件系统之间的差异。\
  \ |\n| | --delete | 从现有的 tar 归档文件中删除。 |\n| -r | --append | 将文件添加到现有的 tar 归档文件的末尾。\
  \ |\n| -t | --list | 列出现有 tar 归档文件的内容。 |\n| -u | --update | 向现有的 tar 归档文件添加比现有归档中同名文件更新的文件。\
  \ |\n| -x | --extract | 从现有的归档文件中提取文件。 |\n\n每个函数都使用选项来定义 tar 归档文件的特定行为。表 4.10 列出了你可以与\
  \ `tar` 命令一起使用的选项。\n\n#### 表 4.10 tar 命令选项\n\n| 选项 | 描述 |\n| :--- | :--- |\n| -C\
  \ dir | 切换到指定的目录。 |\n| -f file | 将结果输出到文件（或设备）file。 |\n| -j | 将输出重定向到 `bzip2` 命令进行压缩。\
  \ |\n| -p | 保留所有文件权限。 |\n| -v | 在处理时列出文件。 |\n| -z | 将输出重定向到 `gzip` 命令进行压缩。 |\n\n\
  这些选项通常组合使用以创建以下场景。首先，你可能想使用此命令创建一个归档文件：\n\n`tar -cvf test.tar test/ test2/`\n\n\
  上述命令创建了一个名为 `test.tar` 的归档文件，其中包含 `test` 目录和 `test2` 目录的内容。接下来，此命令：\n\n`tar -tf\
  \ test.tar`\n\n列出（但并不提取）tar 文件 `test.tar` 的内容。最后，此命令：\n\n`tar -xvf test.tar`\n\n\
  提取 tar 文件 `test.tar` 的内容。如果 tar 文件是从目录结构创建的，则将从当前目录开始重建整个目录结构。\n\n如你所见，使用 `tar`\
  \ 命令是创建整个目录结构归档文件的简单方法。这是 Linux 世界中分发开源应用程序源码文件的常用方法。\n\n### 提示\n\n如果你下载开源软件，经常会看到以\
  \ `.tgz` 结尾的文件。这些是经过 gzip 压缩的 tar 文件，可以使用命令 `tar -zxvf filename.tgz` 进行提取。\n\n##\
  \ 总结\n\n本章讨论了 Linux 系统管理员和程序员使用的一些较高级的 bash 命令。`ps` 和 `top` 命令对于确定系统状态至关重要，允许你看到哪些应用程序正在运行以及它们消耗多少资源。\n\
  \n在如今的可移动媒体时代，系统管理员的另一个热门话题是挂载存储设备。`mount` 命令允许你将物理存储设备挂载到 Linux 虚拟目录结构中。要移除设备，请使用\
  \ `umount` 命令。\n\n最后，章节讨论了用于处理数据的工具。`sort` 工具可以轻松排序大型数据文件帮助帮助组织数据，`grep` 工具允许你快速扫描大型数据文件以查找特定信息。Linux\
  \ 中有几种不同的文件压缩工具，包括 `bzip2`、`gzip` 和 `zip`。每种工具都允许你压缩大文件以节省文件系统空间。Linux `tar` 工具是将目录结构归档为单个文件的流行方法，可以轻松地迁移到另一个系统。\n\
  \n下一章将讨论 Linux 环境变量。环境变量允许你从脚本访问系统信息，并提供了一种在脚本中存储数据的方便方法。\n\n# 第 5 章：使用 Linux 环境变量\n\
  \n### 本章内容\n\n* 什么是环境变量？\n* 设置环境变量\n* 环境变量\n* 默认 shell 环境变量\n* 设置 `PATH` 环境变量\n\
  * 定位系统环境变量\n* 变量数组\n* 使用命令别名\n\nLinux 环境变量有助于定义你的 Linux shell 体验。然而，对于新的 Linux 用户来说，这可能是一个令人混乱的话题。许多程序和脚本使用环境变量来获取系统信息并存储临时数据和配置信息。Linux\
  \ 系统中有很多设置环境变量的地方，了解这些地方非常重要。本章将带你进入 Linux 环境变量的世界，展示它们在哪里、如何使用它们，甚至如何创建你自己的环境变量。本章最后以一个相关主题结束，即在你的\
  \ shell 会话中定义和使用别名。\n\n### 什么是环境变量？\n\n`bash` shell 使用名为环境变量的功能来存储有关 shell 会话和工作环境的信息（因此名为环境变量）。此功能还允许你在内存中存储数据，供从\
  \ shell 运行的任何程序或脚本轻松访问。这是存储标识用户账户、系统、shell 或任何你需要的持久数据的方便方法。\n\n`bash` shell 中有两种类型的环境变量：\n\
  \n* 全局变量\n* 局部变量\n\n###节描述了每种类型的环境变量，并展示如何查看和使用它们。\n\n### 注意\n\n尽管 `bash` shell\
  \ 使用特定的特定环境变量，但不同的 Linux 发行版通常会添加自己的环境变量。在本章中看到的环境变量示例可能与你特定发行版有所不同。如果你遇到此处未涵盖的环境变量，请检查你\
  \ Linux 发行版的文档。\n\n### 全局环境变量\n\n全局环境变量在 shell 会话以及从该 shell 启动的任何子进程中可见。局部变量仅在创建它们的\
  \ shell 中可用。这使得全局环境变量对于需要来自父进程信息的应用程序非常有用。\n\n\n\n\n当你启动 `bash` 会话时，Linux 系统会设置几个全局环境变量（关于当时启动了哪些变量的更多信息，请参阅本章后文的“定位系统环境变量”章节）。系统环境变量始终使用大写字母，以区别于普通用户环境变量。\n\
  \n要查看全局环境变量，请使用 `printenv` 命令：\n\n```\n$ printenv\n```\n\n```\nORBIT_SOCKETDIR=/tmp/orbit-user\n\
  HOSTNAME=localhost.localdomain\nIMSETTINGS_INTEGRATE_DESKTOP=yes\nTERM=xterm\nSHELL=/bin/bash\n\
  XDG_SESSION_COOKIE=787b3cf537971ef8462260960000006b-1284670942.440386-1012435051\n\
  HISTSIZE=1000\nGTK_RC_FILES=/etc/gtk/gtkrc:/home/user/.gtkrc-1.2-gnome2\nWINDOWID=29360131\n\
  GNOME_KEYRING_CONTROL=/tmp/keyring-Egjauk\nIMSETTINGS_MODULE=none\nUSER=user\nLS_COLORS=rs=0:di=01;34:ln=01;36:mh=00:pi=40;33:so=01;35:do=01;35:\n\
  bd=40;33;01:cd=40;33;01:or=40;31;01:mi=01;05;37;41:su=37;41:sg=30;43\n...\nSSH_AUTH_SOCK=/tmp/keyring-Egjauk/ssh\n\
  SESSION_MANAGER=local/unix:@/tmp/.ICE-unix/1331,unix/unix:/tmp/.ICE-unix/1331\n\
  USERNAME=user\nDESKTOP_SESSION=gnome\nMAIL=/var/spool/mail/user\nPATH=/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:\n\
  /bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin\nQT_IM_MODULE=xim\nPWD=/home/user/Documents\n\
  XMODIFIERS=@im=none\nGDM_KEYBOARD_LAYOUT=us\nLANG=en_US.utf8\nGNOME_KEYRING_PID=1324\n\
  GDM_LANG=en_US.utf8\nGDMSESSION=gnome\nSSH_ASKPASS=/usr/libexec/openssh/gnome-ssh-askpass\n\
  HISTCONTROL=ignoredups\nHOME=/home/user\nSHLVL=2\nGNOME_DESKTOP_SESSION_ID=this-is-deprecated\n\
  LOGNAME=user\nDBUS_SESSION_BUS_ADDRESS=unix:abstract=/tmp/dbus-\nifKtHnDKnU,guid=6f061c07be822c134f12956b00000081\n\
  LESSOPEN=|/usr/bin/lesspipe.sh %s\nWINDOWPATH=1\nDISPLAY=:0.0\nG_BROKEN_FILENAMES=1\n\
  XAUTHORITY=/var/run/gdm/auth-for-user-GIU7sE/database\nCOLORTERM=gnome-terminal\n\
  _=/usr/bin/printenv\nOLDPWD=/home/user\n```\n\n你可以看到，有很多为 `bash` shell 设置的全局环境变量。其中大多数是由系统在登录过程中设置的。\n\
  \n要显示单个环境变量的值，请使用 `echo` 命令。在引用环境变量时，必须在环境变量名称之前放置一个美元符号 $：\n\n```\n$ echo $HOME\n\
  /home/user\n$\n```\n\n如前所述，全局环境变量也适用于当前 shell 会话下运行的子进程：\n\n```\n$ bash\n$ echo\
  \ $HOME\n/home/user\n$\n```\n\n在这个示例中，在运行 `bash` 命令启动新 shell 后，你显示了 `HOME` 环境变量的当前值，该值系统在你登录主\
  \ shell 时设置的。果然，该值在子 shell 进程中同样可用。\n\n## 本地环境变量\n\n本地环境变量顾其名，仅在定义它们的本地进程中可见。尽管它们是局部的，但它们与全局环境变量同样重要。事实上，Linux\
  \ 系统默认也会为你定义标准的本地环境变量。\n\n尝试查看本地环境变量列表有一有一点棘手。遗憾的是，没有哪个命令可以只显示本地环境变量。`set` 命令会显示为特定进程设置的所有环境变量。然而，这也包含了全局环境变量。\n\
  \n以下是示例 `set` 命令的输出：\n\n```\n$ set\nBASH=/bin/bash\nBASHOPTS=checkwinsize:cmdhist:expand_aliases:extquote:\n\
  force_fignore:hostcomplete:interactive_comments:\nprogcomp:promptvars:sourcepath\n\
  BASH_ALIASES=()\nBASH_ARGC=()\nBASH_ARGV=()\nBASH_CMDS=()\nBASH_LINENO=()\nBASH_SOURCE=()\n\
  BASH_VERSINFO=([0]=“4” [1]=“1” [2]=“7” [3]=“1”\n[4]=“release” [5]=“i86-redhat-gnu”)\n\
  BASH_VERSION=(4.1)-release\nCOLORS=/etc/DIR_COLORS\nCOLORTERM=gnome-terminal\nCOLUMNS=80\n\
  DBUS_SESSION_BUS_ADDRESS=unix:abstract=/tmp/dbus-\nifKtHnDKnU,guid=6f061c07be822c134f12956b00000081\n\
  DESKTOP_SESSION=gnome\nDIRSTACK=()\nDISPLAY=:0.0\nEUID=500\nGDMSESSION=gnome\nGDM_LANG=en_US.utf8\n\
  GDM_KEYBOARD_LAYOUT=us\nGNOME_DESKTOP_SESSION_ID=this-is-deprecated\nGNOME_KEYRING_CONTROL=/tmp/keyring-\n\
  GNOME_KEYRING_PID=1324\nGROUPS=()\nGTK_RC_FILES=/etc/gtk/gtkrc:/home/user/.gtkrc-1.2-gnome2\n\
  G_BROKEN_FILENAMES=1\nHISTCONTROL=ignoredups\nHISTFILE=/home/user/.bash_history\n\
  HISTSIZE=1000\nHOME=/home/user\nHOSTNAME=localhost.localdomain\nIFS=$'\\t\\n'\n\
  IMSETTINGS_INTEGRATE_DESKTOP=yes\nIMSETTINGS_MODULE=none\nLANG=en_US.utf8\nLESSOPEN='|/usr/bin/lesspipe.sh\
  \ %'\nLINES=24\nLOGNAME=user\nLS_COLORS=rs=0:di=01;34:ln=01;36:mh=00:pi=40;33:so=01;35:do=01;35:\n\
  bd=40;33;01:cd=40;33;01:or=40;31;01:mi=01;05;37;41:su=37;41:sg=30;43\n...\nMACHTYPE=i386-redhat-gnu\n\
  MAIL=/var/spool/mail/user\nMAILCHECK=60\nOLDPWD=/home/user\nOPTERR=1\nOPTIND=1\n\
  ORBIT_SOCKETDIR=/tmp/orbit-user\nOSTYPE=linux-gnu\nPATH=/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:\n\
  /bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin\nPIPESTATUS=([0]=“0”)\nPPID=1674\n\
  PROMPT_COMMAND='echo -ne \"\\033]0;${USER}@${HOSTNAME%%.*}:${PWD/#$HOME};echo -ne\
  \ \"\\007\"'\nPS1='[\\u@\\h \\W$'\nPS2='> '\nPS4='+'\nPWD=/home/user\nQT_IM_MODULE=xim\n\
  SESSION_MANAGER=local/unix:@/tmp/.ICE-unix/1331,unix/unix:/tmp/.ICE-unix/1331\n\
  SHELL=/bin/bash\nSHELLOPTS=braceexpand:emacs:hashall:histexpand:history:interactive-comments:monitor\n\
  SHLVL=2\nSSH_ASKPASS=/usr/libexec/openssh/gnome-ssh-askpass\nSSH_AUTH_SOCK=/tmp/keyring-Egjauk/ssh\n\
  TERM=xterm\nUID=500\nUSER=user\nUSERNAME=user\nWINDOWID=29360131\nWINDOWPATH=1\n\
  XAUTHORITY=/var/run/gdm/auth-for-user-GIU7sE/database\nXDG_SESSION_COOKIE=787b3cf537971ef8462260960000006b-1284670942.440386-1012435051\n\
  XMODIFIERS=@im=none\n_=printenv\ncolors=/etc/DIR_COLORS\n```\n\n\n\n\n如果不使用单引号，`bash`\
  \ shell 会假设下一个字符是另一个要处理的命令。注意，对于你定义的本地环境变量，你使用了小写字母，而你目前为止看到的系统环境变量都使用了大写字母。\n\n\
  这是 `bash` shell 中的一个标准约定。如果你创建新的环境变量，建议（但不是必须）使用小写字母。这有助于将你的个人环境变量与大量的系统环境变量区分开来。\n\
  \n### 注意事项\n\n环境变量名、等号和值之间不能有空格，这至关重要。如果你在赋值中放入任何空格，`bash` shell 将将值解释为单独的命令：\n\n\
  ```bash\n$ test2 = test\n-bash: test2: command not found\n```\n\n一旦你设置了本地环境变量，它在你的\
  \ shell 进程中的任何地方都可以。然而，如果你启动了另一个 shell，该变量在子 shell 中是不可用的：\n\n```bash\n$ bash\n\
  $ echo $test\n$ exit\nexit\n$ echo $test\ntesting a long string\n$\n```\n\n在这个示例中，你启动了一个子\
  \ shell。如你所见，`test` 环境变量在子 shell 中是不可用的（它包含一个空值）。在你退出子 shell 并返回原始 shell 后，本地环境变量仍然可用。\n\
  \n同样地，如果你在子进程中设置了本地环境变量，一旦你离开该子进程，该环境变量就不再可用了：\n\n```bash\n$ bash\n$ test=testing\n\
  $ echo $test\ntesting\n$ exit\nexit\n$ echo $test\n$\n```\n\n当我们回到父 shell 时，在子 shell\
  \ 中设置的 `test` 环境变量不存在。\n\n### 设置全局环境变量\n\n全局环境变量对于设置该变量的进程所创建的任何子进程都是可见的。创建全局环境变量的方法是先创建一个本地环境变量，将其导出到全局环境中。\n\
  \n这是通过使用 `export` 命令实现的：\n\n```bash\n$ echo $test\ntesting a long string\n$ export\
  \ test\n$ bash\n$ echo $test\ntesting a long string\n$\n```\n\n在导出本地环境变量 `test`\
  \ 后，我们启动了一个子 shell 进程并查看了 `test` 环境变量的值。这一次，环境变量保留了它的值，因为 `export` 命令使其变为全局的。\n\n\
  ### 注意事项\n\n注意，在导出本地环境变量时，你不需要使用美元符号 `$` 来引用变量名。\n\n## 环境变量\n\n当然，如果你可以创建一个新的环境变量，那么删除一个现有的环境变量也是理所当然的。你可以使用\
  \ `unset` 命令：\n\n```bash\n$ echo $test\ntesting\n$ unset test\n$ echo $test\n$\n\
  ```\n\n在 `unset` 命令中引用环境变量时，记住不要使用美元符号。\n\n在处理全局环境变量时，情况会变得有点复杂。如果你在子进程中 `unset`\
  \ 一个全局环境变量，它只作用于该子进程。全局环境变量在父进程中仍然可用：\n\n```bash\n$ test=testing\n$ export test\n\
  $ bash\n$ echo $test\ntesting\n$ unset test\n$ echo $test\n$ exit\nexit\n$ echo\
  \ $test\ntesting\n$\n```\n\n在这个示例中，你设置了一个名为 `test` 的本地环境变量，然后将其导出以成为全局环境变量。接着你启动了一个子\
  \ shell 进程，并确保全局环境变量 `test` 仍然可用。接下来，在子 shell 中，你继续使用 `unset` 命令删除了全局环境变量 `test`，然后退出了子\
  \ shell。现在回到原始父 shell 中，你检查了 `test` 环境变量的值，它仍然有效。\n\n### 默认 shell 环境变量\n\n`bash`\
  \ shell 默认使用特定的环境变量来定义系统环境。你可以始终认为这些变量在你的 Linux 系统上被设置了。由于 `bash` shell 是原始 Unix\
  \ Bourne shell 的派生物，它也包含了最初在那个 shell 中定义的环境变量。\n\n表 5.1 显示了 `bash` shell 提供的与原始\
  \ Unix Bourne shell 兼容的环境变量。\n\n#### bash Shell Bourne \n\n| 变量 | 描述 |\n| :--- |\
  \ :--- |\n| `CDPATH` | 用冒号分隔的目录列表，作为 `cd` 命令的搜索路径。 |\n| `HOME` | 当前用户的家目录。 |\n|\
  \ `IFS` | 字符列表，用于 shell 分割文本字符串的字段分隔符。 |\n| `MAIL` | 当前用户邮箱的文件名。`bash` shell 会检查此文件是否有新邮件。\
  \ |\n| `MAILPATH` | 用冒号分隔的多个文件名列表，用于当前用户的邮箱。`bash` shell 会检查此列表中的每个文件是否有新邮件。 |\n\
  | `OPTARG` | `getopts` 命令处理的上一个选项参数的值。 |\n| `OPTIND` | `getopts` 命令处理的上一个选项参数的索引值。\
  \ |\n| `PATH` | 用冒号分隔的目录列表，shell 在其中查找命令。 |\n| `PS1` | 主 shell 命令行界面提示符字符串。 |\n\
  | `PS2` | 次级 shell 命令行界面提示符字符串。 |\n\n到目前为止，列表中最重要的环境变量是 `PATH`。当你在 命令行界面 (CLI) 中输入命令时，shell\
  \ 必须搜索系统以找到程序。`PATH` 环境变量定义了它查找命令的目录。在我的 Linux 系统上，`PATH` 变量看起来如下：\n\n```bash\n\
  $ echo $PATH\n/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:\n/bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin\n\
  $\n```\n\n这显示 shell 在六个目录下查找命令。`PATH` 中的每个目录都用冒号分隔。`PATH` 变量末尾没有指示目录列表结束的符号。你可以通过添加另一个冒号和新目录来向\
  \ `PATH` 添加额外的目录。`PATH` 还显示了它查找命令的顺序。\n\n除了默认的 Bourne 环境变量外，`bash` shell 还提供了几个自己的变量，如表\
  \ 5.2 所示。\n\n#### bash Shell 环境变量\n\n| 变量 | 描述 |\n| :--- | :--- |\n| `BASH` | 执行当前\
  \ `bash` shell 实例的完整路径。 |\n| `BASH_ALIASES` | 当前设置的别名的关联数组。 |\n| `BASH_ARGC` | 变量数组，包含传递给子程序或\
  \ shell 脚本的参数个数。 |\n| `BASH_ARCV` | 变量数组，包含传递给子程序或 shell 脚本的参数。 |\n| `BASH_CMDS`\
  \ | shell 已执行命令所在位置的关联数组。 |\n| `BASH_COMMAND` | 当前正在执行或即将执行的 shell 命令。 |\n| `BASH_ENV`\
  \ | 设置时，每个 `bash` 脚本在运行之前都会尝试执行一个由该变量定义的启动文件。 |\n| `BASH_EXECUTION_STRING` | 使用\
  \ `bash -c` 选项传递的命令。 |\n| `BASH_LINENO` | 变量数组，包含当前执行的 shell 函数的源代码行号。 |\n| `BASH_REMATCH`\
  \ | 只读变量数组，包含使用正则表达式比较运算符 `=∼` 进行正匹配的模式及其子模式。 |\n| `BASH_SOURCE` | 变量数组，包含当前执行的\
  \ shell 函数的源代码文件名。 |\n| `BASH_SUBSHELL` | 当前子 shell 环境的嵌套层级。初始值为 0。 |\n| `BASH_VERSION`\
  \ | 当前 `bash` shell 实例的版本号。 |\n| `BASH_VERSINFO` | 变量数组，包含当前 `bash` shell 实例的各个主版本和次版本号。\
  \ |\n\n\n\n\n\n| 变量 | 描述 |\n| :--- | :--- |\n| `BASH_XTRACEFD` | 如果设置为有效的文件描述符（0,1,2），可以重定向由\
  \ `set -x` 调试选项生成的跟踪输出。这通常用于将跟踪输出分离到文件中。 |\n| `BASHOPTS` | 当前启用的 bash shell 选项列表。\
  \ |\n| `BASHPID` | 当前 bash 进程的进程 ID。 |\n| `COLUMNS` | 包含用于当前 bash shell 实例的终端宽度。\
  \ |\n| `COMP_CWORD` | 变量 `COMP_WORDS` 的索引，该变量包含当前光标位置。 |\n| `COMP_LINE` | 当前命令行。\
  \ |\n| `COMP_POINT` | 当前光标位置相对于当前命令起始部分的索引。 |\n| `COMP_KEY` | 调用当前 shell 函数补全时使用的最后一个键。\
  \ |\n| `COMP_TYPE` | 代表导致调用补全 shell 函数的尝试补全类型的整数值。 |\n| `COMP_WORDBREAKS` | 执行单词补全时使用的\
  \ Readline 库单词分隔符字符。 |\n| `COMP_WORDS` | 包含当前命令行中各个单词的变量数组。 |\n| `COMPREPLY` | 包含\
  \ shell 函数生成的可能补全代码的变量数组。 |\n| `DIRSTACK` | 包含目录栈当前内容的变量数组。 |\n| `EMACS` | 设置为‘t’\
  \ 时，表示 emacs shell 缓冲区正在执行且禁用了行编辑。 |\n| `EUID` | 当前用户的数值有效用户 ID。 |\n| `FCEDIT` |\
  \ `fc` 命令使用的默认编辑器。 |\n| `FIGNORE` | 在执行文件名补全时要忽略的后缀列表，用冒号分隔。 |\n| `FUNCNAME` | 当前正在执行的\
  \ shell 函数的名称。 |\n| `GLOBIGNORE` | 用冒号分隔的模式列表，定义文件名扩展时要忽略的文件名集。 |\n| `GROUPS` |\
  \ 包含当前用户所属组列表的变量数组。 |\n| `histchars` | 最多三个字符，用于控制历史扩展。 |\n| `HISTCMD` | 当前命令的历史编号。\
  \ |\n| `HISTCONTROL` | 控制哪些命令会被输入 shell 历史列表。 |\n| `HISTFILE` | 保存 shell 历史列表的文件名（默认为\
  \ `.bash_history`）。 |\n| `HISTFILESIZE` | 历史文件中要保存的最大行数。 |\n| `HISTIGNORE` | 用冒号分隔的模式列表，用于决定哪些命令在历史文件中被忽略。\
  \ |\n| `HISTSIZE` | 历史文件中存储的最大命令数。 |\n| `HOSTFILE` | 包含当 shell 需要补全主机名时应该读取的文件名。\
  \ |\n| `HOSTNAME` | 当前主机的名称。 |\n| `HOSTTYPE` | 描述 bash shell 运行所在机器的字符串。 |\n| `IGNOREEOF`\
  \ | shell 退出前必须接收的连续 EOF 字符数。如果此值不存在，默认值为 1。 |\n| `INPUTRC` | Readline 初始化文件的名称（默认是\
  \ `.inputrc`）。 |\n| `LANG` | shell 的语言区域（locale）。 |\n| `LC_ALL` | 覆盖 `LANG` 变量，定义语言区域类别。\
  \ |\n| `LC_COLLATE` | 设置排序字符串值时使用的排序顺序。 |\n| `LC_CTYPE` | 决定文件名扩展和模式匹配中使用的字符解释。\
  \ |\n| `LC_MESSAGES` | 决定解释以美元符号开头的双引号字符串时使用的语言区域设置。 |\n| `LC_NUMERIC` | 决定格式化数字时使用的语言区域设置。\
  \ |\n| `LINENO` | 当前执行脚本中的行号。 |\n| `LINES` | 定义终端可可用行数。 |\n| `MACHTYPE` | 以 `cpu-company-system`\
  \ 格式定义系统类型的字符串。 |\n| `MAILCHECK` | shell 检查新邮件的频率（秒，默认为 60）。 |\n| `OLDPWD` | shell\
  \ 中使用的上一个工作目录。 |\n| `OPTERR` | 如果设置为 1，bash shell 显示由 `getopts` 命令生成的错误。 |\n| `OSTYPE`\
  \ | 定义 shell 运行所在操作系统的字符串。 |\n| `PIPE_STATUS` | 包含前台进程中退出状态值列表的变量数组。 |\n| `POSIXLY_CORRECT`\
  \ | 如果设置，bash 将以 POSIX 模式启动。 |\n| `PPID` | bash shell 父进程的进程 ID (PID)。 |\n| `PROMPT_COMMAND`\
  \ | 如果设置，在显示主提示符之前执行的命令。 |\n| `PROMPT_DIRTRIM` | ，表示在使用 `\\w` 和 `\\W` 提示符字符串转义符时显示的结尾目录名数量。被删除的目录名用一组省略号替换。\
  \ |\n| `PS3` | 用于 `select` 命令的提示符。 |\n| `PS4` | 使用 `bash -x` 参数时，在命令行回显之前显示的提示符。\
  \ |\n| `PWD` | 当前工作目录。 |\n| `RANDOM` | 返回 0 到 32767 之间的随机数。给此变量赋值会为随机数生成器设置种子。 |\n\
  | `REPLY` | `read` 命令的默认变量。 |\n| `SECONDS` | 自 shell 启动以来的秒数。给此变量赋值会将计时器重置为该值。 |\n\
  | `SHELL` | bash shell 的完整路径。 |\n| `SHELLOPTS` | 启用的 bash shell 选项列表，用冒号分隔。 |\n\
  | `SHLVL` | 表示 shell 层级，每启动一个新的 bash shell 都会加 1。 |\n| `TIMEFORMAT` | 指定 shell 如何显示时间值的格式。\
  \ |\n| `TMOUT` | `select` 和 `read` 命令等待输入的时长（秒）。默认值 0 表示无限等待。 |\n| `TMPDIR` | bash\
  \ shell 创建临时文件的目录名。 |\n| `UID` | 当前用户的数值真实用户 ID。 |\n\n你可能会注意到，在使用 `set` 命令时，并不是所有的默认环境变量都显示出来。\n\
  \n## 设置 PATH 变量\n\n你可能会注意到，在使用 `set` 命令时，并不是所有的默认环境变量都显示出来。\n\n在下一节中，你将看到如何对系统上的环境变量进行永久性更改，以便你能够始终执行你的程序。\n\
  \n## 设置环境变量\n\n## PATH 变量\n\n`PATH` 变量在 Linux 系统上似乎遇到了最多的问题。它定义了 shell 查找命令的位置。\n\
  \n## 设置 PATH 变量\n\n问题在于，应用程序会将可执行文件放置在不在 `PATH` 中的中的目录中。如果它找不到命令，它会产生如下错误信息：\n\n\
  ```bash\n$ myprog\n-bash: myprog: command found\n```\n\n解决方法是确保你的 `PATH` 变量包含应用程序所在的目录。\n\
  \n你不需要从头开始构建就可以向现有的 `PATH` 变量添加新目录。`PATH` 中列出的目录是用冒号分隔的。这样做看起来如下：\n\n```bash\n$\
  \ echo $PATH\n/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:\n/bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin\n\
  \n$ PATH=$PATH:/home/user/test\n\n$ echo $PATH\n/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:\n\
  /bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin:/home/user/test\n\n$ myprog\n\
  ```\n\n## 永久环境变量\n\n程序员的一个常用技巧是将单个点符号包含在他们的 `PATH` 变量中。单个点符号表示当前目录（见第 3 章）：\n\n\
  ```bash\n[user@localhost ~]$ PATH=$PATH:.\n[user@localhost ~]$ cd test2\n[user@localhost\
  \ test2]$ myprog2\n```\n\n在下一节中，你将看到如何对系统上的环境变量进行永久性更改，以便你能够始终执行你的程序。\n\n\n\n\n\n\
  Linux 系统使用环境变量在程序和脚本中标识自身。这为你的程序获取系统信息提供了一种方便的方法。关键在于这些环境变量是如何设置的。\n\n当你通过登录 Linux\
  \ 系统来启动 `bash` shell 时，默认情况下，`bash` 会检查几个文件来获取命令。这些文件被称为启动文件。`bash` 处理的启动文件取决于你启动\
  \ `bash` shell 的方法。启动 `bash` shell 有有三种方式：\n\n*   作为登录时的默认登录 shell\n*   作为非登录 shell\
  \ 的交互式 shell\n*   作为运行脚本的非交互式 shell\n\n接下来的章节将描述 `bash` shell 在这些每种启动方法下执行的启动文件。\n\
  \n# 登录 shell (Login Shell)\n\n当你登录 Linux 系统时，`bash` shell 会作为登录 shell 启动。登录 shell\
  \ 会查找四个不同的启动文件来处理命令。以下是 `bash` shell 处理这些文件的顺序：\n\n* `/etc/profile`\n* `$HOME/.bash_profile`\n\
  * `$HOME/.bash_login`\n* `$HOME/.profile`\n\n`/etc/profile` 文件是系统上 `bash` shell\
  \ 的主要默认启动文件。系统上的每个用户在登录时都会执行此启动文件。另外三个启动文件是每个用户特有的，可以根据每个用户的需求进行定制。让我们仔细查看这些文件。\n\
  \n## /etc/profile 文件\n\n`/etc/profile` 文件是 `bash` shell 的主要默认启动文件。每当你登录 Linux 系统时，`bash`\
  \ 都会执行 `/etc/profile` 启动文件中的命令。不同的 Linux 发行版会在此文件中放置不同的命令。在这个 Linux 系统上，它看起来如下：\n\
  \n```bash\ncat /etc/profile\n\n# /etc/profile\n\n# System wide environment and startup\
  \ programs, for login setup\n# Functions and aliases go in /etc/bashrc\n# It's NOT\
  \ good idea to change this file unless you know what you\n# are doing it. Much better\
  \ way is to create custom.sh shell script in\n# /etc/profile.d/ to make custom changes\
  \ to environment. This will\n# prevent need for merging in future updates.\n\npathmunge\
  \ () {\n    case \":${PATH}:\" in\n        *:\"$1\":*)\n            ;;\n       \
  \ *)\n            if [ \"$2\" = \"after\" ] ; then\n                PATH=$PATH:$1\n\
  \            else\n                PATH=$1:$PATH\n            fi\n    esac\n}\n\n\
  if [ -x /usr/bin/id ]; then\n    if [ -z \"$EUID\" ]; then\n        # ksh workaround\n\
  \        EUID='id -u'\n        UID='id -ru'\n    fi\n    USER=\"'id -un'\"\n   \
  \ LOGNAME=$USER\n    MAIL=\"/var/spool/mail/$USER\"\nfi\n\n# Path manipulation\n\
  if [ \"$EUID\" = \"0\" ]; then\n    pathmunge /sbin\n    pathmunge /usr/sbin\n \
  \   pathmunge /usr/local/sbin\nelse\n    pathmunge /usr/local/sbin after\n    pathmunge\
  \ /usr/sbin after\n    pathmunge /sbin after\nfi\n\nHOSTNAME='/bin/hostname 2>/dev/null'\n\
  HISTSIZE=1000\n\nif [ \"$HISTCONTROL\" = \"ignorespace\" ]; then\n    export HISTCONTROL=ignoreboth\n\
  else\n    export HISTCONTROL=ignoredups\nfi\n\nexport PATH USER LOGNAME MAIL HOSTNAME\
  \ HISTSIZE HISTCONTROL\n\nfor i in /etc/profile.d/*.sh ; do\n    if [ -r \"$i\"\
  \ ]; then\n        if [ \"$PS1\" ]; then\n            . $i\n        else\n     \
  \       . $i >/dev/null\n        fi\n    fi\ndone\nunset pathmunge\n```\n\n\n\n\n\
  \n# 系统级函数和别名\n\n## 环境相关内容放在 `/etc/profile` 中\n\n除非你清楚自己在做什么，否则修改这个文件并不是一个好主意。更好的方法是在\
  \ `/etc/profile.d/` 中创建一个 `custom.sh` shell 脚本，对环境进行自定义更改。这可以防止在未来的更新中需要合并冲突。\n\n\
  默认情况下，我们希望这些设置被加载。即使对于非交互、非登录的 shell 也是如此。目前系统保留 `uid/gids` 的阈值为 200。你可以通过 `/usr/share/doc/setup-*/uidgid`\
  \ 文件检查 `uidgid` 留的有效性。\n\n```bash\nif [ $UID -gt 199 ] && [ \"id -gn\" = \"id -un\"\
  \ ]; then\n    umask 002\nelse\n    umask 022\nfi\n```\n\n我们是否处于交互式 shell？\n\n```bash\n\
  if [ \"$PS1\" ]; then\n    case $TERM in\n    xterm*)\n        if [ -e /etc/sysconfig/bash-prompt-xterm\
  \ ]; then\n            PROMPT_COMMAND=/etc/sysconfig/bash-prompt-xterm\n       \
  \ else\n            PROMPT_COMMAND='echo -ne \"\\033]0;${USER}@${HOSTNAME%%.*}:${PWD/#$HOME/∼}\"\
  ; echo -ne \"\\007\"'\n        fi\n        ;;\n    screen)\n        if [ -e /etc/sysconfig/bash-prompt-screen\
  \ ]; then\n            PROMPT_COMMAND=/etc/sysconfig/bash-prompt-screen\n      \
  \  else\n            PROMPT_COMMAND='echo -ne \"\\033_${USER}@${HOSTNAME%%.*}:${PWD/#$HOME/∼}\"\
  ; echo -ne \"\\033\\\\\"'\n        fi\n        ;;\n    *)\n        [ -e /etc/sysconfig/bash-prompt-default\
  \ ] &&\nPROMPT_COMMAND=/etc/sysconfig/bash-prompt-default\n        ;;\n    esac\n\
  \    # 开启窗口大小检查\n    shopt -s checkwinsize\n    [ \"$PS1\" = \"\\s-\\v\\$ \" ] &&\
  \ PS1=\"[\\u@\\h \\W]\\$\"\n    # 你可能想在提示符中包含 tty（例如，更多的虚拟机）\n    # 以及控制台窗口\n  \
  \  # 如果你想这样做，只需添加例如：\n    # if [ \"$PS1\" ]; then\n    #   PS1=\"[\\u@h:\\1 \\W]\\\
  $\" \n    # fi\n    # 到你 /etc/profile.d/ 中的自定义修改 shell 脚本中\nfi\nif ! shopt -q login_shell\
  \ ; then#我们不是登录 shell\n# 需要重新定义 pathmunge，它在 /etc/profile 的末尾是未定义的\npathmunge ()\
  \ {\n    case \":PATH:\" in\n    *:$1\"*)\n        ;;\n    *)\n        if [ \"$2\"\
  \ = \"after\" ]; then\n            PATH=$PATH:$1\n        else\n            PATH=$1:$PATH\n\
  \        fi\n    esac\n}\n# 只有当我们不是登录 shell 且是交互时，才显示 profile.d 脚本的输出\n# 否则只处理它们来设置环境变量\n\
  for i in /etc/profile.d/*.sh; do\n    if [ -r \"$i\" ]; then\n        if [ \"$PS1\"\
  \ ]; then\n            . $i\n        else\n            . $i >dev/null 2>&1\n   \
  \     fi\n    fi\ndone\nunset i\nunset pathmunge\nfi\n```\n\n# vim:ts=4:sw=4\n\n\
  默认文件设置了几个环境变量，但注意它没有使用 `export` 命令使它们变为全局。记住，交互式 shell 启动文件会在每次启动一个新的交互式 shell 时运行；因此，任何子\
  \ shell 都会自动执行交互式 shell 的启动文件。\n\n你还会注意到 `/etc/bashrc` 文件也会执行位于 `/etc/profile.d`\
  \ 目录下的特定应用程序启动文件。\n\n## 非交互式 shell\n\n最后，最后一种 shell 是非交互式 shell。这是系统启动以执行 shell\
  \ 脚本时启动的 shell。它的不同之处在于没有需要担的 CLI 提示符。然而，你可能希望在每次在系统中启动脚本时运行某些特定的启动命令。\n\n为了适应这种情况，bash\
  \ shell 提供了 `BASH_ENV` 环境变量。当 shell 启动一个非交互式 shell 进程时，它会检查此环境变量以获取要执行的启动文件的名称。如果存在，shell\
  \ 将执行该文件中的命令。在我们的 Linux 发行版中，此环境变量值默认没有设置。\n\n## 变量数组\n\n环境变量的一个非常酷的功能是它们可以被当作数组。数组是一个可以包含多个值的变量。值可以单独被引用，也可以作为整个数组被引用。\n\
  \n要为环境变量设置多个值，只需将它们列在括号中，每个值之间用空格隔开：\n```bash\nmytest=(one two three four five)\n\
  ```\n\n没什么特别兴奋的。如果你尝试像显示普通环境变量一样显示数组，你会感到失望的：\n```bash\necho $mytest\n```\n只有数组中的第一个值会出现。要引用单个数组元素，必须使用数值，该数值代表它在数组中的位置。数值括在方括号中：\n\
  ```bash\necho ${mytest[2]}\n```\n\n### 注意事项\n\n环境变量数组从索引值零开始。这通常会引起困惑。要显示整个数组，你使用\
  \ `*` 字符作为索引值：\n```bash\necho ${mytest[*]}\n```\n你也可以更改单个索引位置的值：\n```bash\nmytest[2]=seven\n\
  echo ${mytest[*]}\n```\n你可以使用 `unset` 命令删除数组中的单个值，但要小心，因为这很复杂。看这个例子：\n```bash\n\
  unset mytest[2]\necho ${mytest[*]}\necho ${mytest[2]}\necho ${mytest[3]}\n```\n\
  这个示例使用 `unset` 命令删除了索引 2 位置的值。当你显示数组时，其他索引值似乎消失了。然而，如果你显式显示索引 2 位置的数据，你会发现该位置是空的。最后，你可以通过在\
  \ `unset` 命令中使用数组名来删除整个数组：\n```bash\nunset mytest\necho ${mytest[*]}\n```\n有时变量数组非常重要，因此它们经常用于\
  \ shell 脚本编程中。它们无法被移植到其他 shell 环境中，如果你为不同的 shell 编写大量的 shell 脚本，这是一个缺点。有几个 bash\
  \ 环境变量使用了数组（例如 `BASH_INFO`），但总的来说你可能不会遇到它们。\n\n## 使用命令别名\n\n虽然不是环境变量，但 shell 命令别名的行为与它们非常相似。命令别名允许你为常用命令创建别名（带有其参数），以减少输入量。\n\
  \n很可能，你的 Linux 发行版已经为你设置了一些命令别名。要查看激活的别名列表，请使用 `alias` 命令配合 `-p` 参数：\n```bash\n\
  alias -p\nalias l='ls -d.*color=auto'\nalias ll='ls -l --color=auto'\nalias ls='ls\
  \ --color=auto'\nalias vi='vim'\nalias which='alias | /usr/bin/which --tty-only\
  \ --read-alias'\n```\n注意在在这个 Linux 上，一个别名被覆盖了标准的 `ls` 命令。它自动提供了 `--color` 参数，表明终端支持颜色。\n\
  \n你可以使用 `alias` 命令创建自己的别名：\n```bash\nalias li='ls -il'\nli\ntotal 32\n75 drwxr-xr-x.\
  \ 2 user user 4096 Sep 16 13:11 Desktop\n79 drwxr-xr-x. 2 user user 4096 Sep 20\
  \ 15:40 Documents\n76 drwxr-xr-x. 2 user user 4096 Sep 15 13:30 Downloads\n80 drwxr-xr-x.\
  \ 2 user user 4096 Sep 15 13:30 Music\n81 drwxr-xr-x. 2 user user 4096 Sep 15 13:30\
  \ Pictures\n78 drwxr-xr-x. 2 user user 4096 Sep 15 13:30 Public\n77 drwxr-xr-x.\
  \ 2 user user 4096 Sep 15 13:30 Templates\n82 drwxr-xr-x. 2 user user 4096 Sep 15\
  \ 13:30 Videos\n```\n一旦你定义了别名值，你可以在 shell 的任何时候使用它，包括在 shell 脚本中。\n\n命令别名就像局部环境变量。它们只在定义它们的\
  \ shell 进程中有效：\n```bash\nalias li='ls -il'\nbash\nli\nbash: li: command not found\n\
  ```\n当然，现在你知道解决该问题的方法了。bash shell 在每次启动新的交互式 shell 时都会读取 `$HOME/.bashrc` 启动文件。这是一个放置命令别名语句的好地方（正如\
  \ `.bashrc` 文件注释所示）。\n\n总结\n\n\n\n\n本章探讨了 Linux 环境变量的世界。全局环境变量可以从定义它的进程所产生的任何子进程中访问。本地环境变量只能从定义它的进程中访问。\n\
  \nLinux 系统同时使用全局和局部环境变量来存储系统环境信息。你可以从 shell 命令行界面访问这些信息，也可以在 shell 脚本中访问。`bash`\
  \ shell 使用了原始 Unix Bourne shell 中定义的系统环境变量，还使用了许多新的环境变量。`PATH` 环境变量定义了 `bash` shell\
  \ 查找可执行命令时采用的搜索模式。你可以修改 `PATH` 环境变量来添加自己的目录，甚至是当前目录符号，以便运行你的程序变得更加方便。\n\n你还可以创建供自己使用的全局和局部环境变量。一旦你创建了环境变量，它在你的整个\
  \ shell 会话期间都是可访问的。\n\n`bash` shell 在启动时会执行几个启动文件。这些启动文件可以包含环境变量定义，用于为每个 `bash`\
  \ 会话设置标准环境变量。当你登录到 Linux 系统时，`bash` shell 会访问 `/etc/profile` 启动文件，还会为每个用户访问三个本地启动文件：`$HOME/.bash_profile`、`$HOME/.bash_login`\
  \ 和 `$HOME/.profile`。用户可以自定义这些文件，包含他们自己使用的环境变量和启动脚本。\n\n`bash` shell 还提供了环境变量数组的支持。这些环境变量可以在单个变量中包含多个值。你可以通过引用索引值来单独访问这些值，也可以通过引用整个环境变量数组名来整体访问这些值。\n\
  \n最后，本章讨论了命令别名（command aliases）的使用。虽然它们不是环境变量，但命令别名的行为与环境变量非常相似。它们允许你为命令定义一个别名以及它的参数。你不再需要输入长长的命令和参数，只需要将其分配给一个简单的别名，并在\
  \ shell 会话中的任何时候使用该别名即可。\n\n下一章将深入 Linux 文件权限的世界。这可能是初学者 Linux 用户最困难的话题。然而，为了编写良好的\
  \ shell 脚本，你需要理解文件权限的工作原理，并能够在你的 Linux 系统中使用它们。\n\n# 第 6 章\n\n# 理解 Linux 文件权限\n\n\
  ## 本章内容摘要\n* 理解 Linux 安全\n* 解码权限\n* 与 Linux 用户组交互\n\n任何系统如果没有某种形式的安全措施是不完整的。必须有一种可用机制来保护文件免受未经授权的查看或修改。Linux\
  \ 系统遵循 Unix 的文件权限方法，允许个人用户和组根据每个文件和目录的一组安全设置来访问文件。本章讨论了如何使用 Linux 文件安全系统在必要时保护数据，并在需要时共享数据。\n\
  \n## Linux 安全\nLinux 安全系统的核心是用户账户。每个访问 Linux 系统的个人都应该分配一个唯一的用户账户。用户对系统对象的权限取决于他们登录时所使用的用户账户。\n\
  \n用户权限使用用户 ID（通常称为 `UID`）进行跟踪，该 ID 在创建创建时被分配给账户。`UID` 是一个数值，对每个用户都是唯一的。然而，你并不是使用\
  \ `UID` 登录 Linux 系统的。相反，你使用的是登录名。登录名是一个长度为 8 个字符或少的字母数字字符串，用户用它登录系统（以及关联密码）。\n\n\
  Linux 系统使用特殊文件和工具来跟踪和管理系统上的用户账户。在讨论文件权限之前，我们需要讨论 Linux 如何处理用户账户。本节描述了用户账户所需的文件和工具，以便你理解在处理文件权限时如何使用它们。\n\
  \n### /etc/passwd 文件\nLinux 系统使用一个特殊文件将登录名与对应的 `UID` 值相匹配。这个文件就是 `/etc/passwd` 文件。`/etc/passwd`\
  \ 文件包含了关于用户的几条信息。以下是 Linux 系统上典型的 `/etc/passwd` 文件内容：\n\n```\ncat /etc/passwd\n\
  root:x:0:0:root:/root:/bin/bash\nbin:x:1:1:bin:/bin:/sbin/nologin\ndaemon:x:2:2:daemon:/sbin:/sbin/nologin\n\
  adm:x:3:4:adm:/var/adm:/sbin/nologin\nlp:x:4:7:lp:/var/spool/lpd:/sbin/nologin\n\
  sync:x:5:0:sync:/sbin:/bin/sync\nshutdown:x:6:0:shutdown:/sbin:/sbin/shutdown\n\
  halt:x:7:0:halt:/sbin:/sbin/halt\nmail:x:8:12:mail:/var/spool/mail:/sbin/nologin\n\
  news:x:9:13:news:/etc/news:\nuucp:x:10:14:uucp:/var/spool/uucp:/sbin/nologin\noperator:x:11:0:operator:/root:/sbin/nologin\n\
  games:x:12:100:games:/usr/games:/sbin/nologin\ngopher:x:13:30:gopher:/var/gopher:/sbin/nologin\n\
  ftp:x:14:50:FTP User:/var/ftp:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
  rpm:x:37:37::/var/lib/rpm:/sbin/nologin\nnobody:x:99:99:Nobody:/:/sbin/nologin\n\
