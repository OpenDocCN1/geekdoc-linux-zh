  \n### 最低要求\n\n《Linux 命令行与 Shell 脚本圣经》（Linux Command Line and Shell Scripting Bible）并没有关注任何特定的\
  \ Linux 发行版，因此你可以使用现有的任何 Linux 系统来跟本书。书中大部分内容引用了 `bash` shell，它是大多数 Linux 系统的默认\
  \ shell。\n\n### 接下来该去哪里\n\n一旦你完成了《Linux 命令行与 Shell 脚本圣经》，你就在了将 Linux 命令整合到日常 Linux\
  \ 工作中的良好道路上了。在不断变化的 Linux 世界中，保持关注新进展总是一个好主意。Linux 发行版经常会变化，增加新功能并移除旧功能。为了保持你的 Linux\
  \ 知识常新，请务必保持消息灵通。找一个良好的 Linux 论坛网站并监控 Linux 世界的动态。有很多流行的 Linux 新闻网站，例如 Slashdot\
  \ 和 Distrowatch，它们提供了关于 Linux 新进展的最新信息。\n\n# 第一部分：Linux 命令行\n\n### 本部分内容\n\n*  \
  \ 第 1 章：从 Linux Shell 开始\n*   第 2 章：进入 Shell\n*   第 3 章：基础 bash Shell 命令\n*   第\
  \ 4 章：更多 bash Shell 命令\n*   第 5 章：使用 Linux 环境变量\n*   第 6 章：理解 Linux 文件权限\n*   第\
  \ 7 章：管理文件系统\n*   第 8 章：安装软件\n*   第 9 章：使用编辑器\n\n## 第 1 章：从 Linux Shell 开始\n\n###\
  \ 本章内容\n\n*   什么是 Linux？\n*   Linux 内核部分\n*   探索 Linux 桌面\n*   访问 Linux 发行版\n\n\
  在你投入 Linux 命令行和 shell 工作之前，首先了解 Linux 是什么、它来自哪里以及如何运作是一个很好的主意。本章将带你了解 Linux 是什么，并解释\
  \ shell 和命令行在 Linux 整体图中处于什么位置。\n\n### 什么是 Linux？\n\n如果你从未工作过 Linux，你可能会困惑为什么会有这么多不同的版本可用。我确定你在查看\
  \ Linux 软件包时，一定听过分发版（distribution）、LiveCD 和 GNU 等各种术语并感到困惑。第一次涉足 Linux 世界可能是一种棘手的体验。本章将在你开始操作命令和脚本之前，揭开\
  \ Linux 系统的一些神秘面纱。\n\n首先，Linux 系统由四个主要部分组成：\n\n*   Linux 内核\n*   GNU 工具集\n*   图形桌面环境\n\
  *   应用程序软件\n\n这四部分中的每一部分在 Linux 系统中都有特定的任务。Linux 系统中的每个部分都承担着特定的工作。图 1.1 显示了这四部分如何协同工作以创建\
  \ Linux 系统。（*注：此处根据示例逻辑保留占位符，原文未提供具体图片链接，此处保持翻译逻辑*）\n\n### 深入内核\n\nLinux 系统的核心是内核。内核控制所有硬件和软件，在需要时分配硬件并执行软件。如果你一直关注\
  \ Linux，一定听过 Linus Torvalds 这个名字。他在赫尔辛基大学开发 Linux 内核时，将其向社区发布。当他还是一个学生时，他就创建了第一个内核。\n\
  \n允许任何人更改内核将导致混乱。为了简化事情，Linus 决定是否使用交换空间（swap space）。内核主要负责这四个主要部分。\n\n*   系统内存\n\
  *   软件管理\n*   硬件管理\n*   文件系统管理\n\n后续章节将详细介绍这些功能。\n\n#### 系统内存\n\n操作系统内核的主要功能之一是内存管理。内核不仅管理可用物理内存，还可以创建并管理虚拟内存，即不存在的内存。\n\
  \n它通过使用磁盘上的空间（交换空间）来实现。内核在交换空间和实际物理内存之间切换内容。这让系统认为内存比实际存在的要多（见图 1.2）。\n\n内存位置被分组为“页”（pages）块。内核在物理内存或交换空间中定位每个内存页。然后，内核维护一张表，指示哪些页在物理内存中，哪些页被交换出。\n\
  \n内核会跟踪哪些内存页正在使用，并自动将一段时间未访问的内存页复制到交换空间（称为“交换出”），即使有其他可用内存。当程序想要访问一个被交换出的内存页时，内核必须通过交换出另一个内存页在物理内存中腾出一个空间，并从交换空间换入所需的页面。显然，这个过程需要时间，并会减慢运行程序的速度。只要\
  \ Linux 系统运行，运行应用程序交换内存页的过程就会持续。\n\n\n\n\n\n```\nActive: 171468 kB\nInactive: 154196\
  \ kB\nActive(anon): 131056 kB\nInactive(anon): 32 kB\nActive(file): 40412 kB\nInactive(file):\
  \ 154164 kB\nUnevictable: 12 kB\nMlocked: 12 kB\nHighTotal: 139208 kB\nHighFree:\
  \ 252 kB\nLowTotal: 886876 kB\nLowFree: 666104 kB\nSwapTotal: 2781176 kB\nSwapFree:\
  \ 2781176 kB\nDirty: 588 kB\nWriteback: 0 kB\nAnonPages: 123500 kB\nMapped: 52232\
  \ kB\nShmem: 7600 kB\nSlab: 17676 kB\nSReclaimable: 9788 kB\nSUnreclaim: 7888 kB\n\
  KernelStack: 2656 kB\nPageTables: 5072 kB\nNFS_Unstable: 0 kB\nBounce: 0 kB\nWritebackTmp:\
  \ 0 kB\nCommitLimit: 3294216 kB\nCommitted_AS: 1234480 kB\nVmallocTotal: 122880\
  \ kB\nVmallocUsed: 7520 kB\nVmallocChunk: 110672 kB\nHardwareCorrupted: 0 kB\nHugePages_Total:\
  \ 0\nHugePages_Free: 0\nHugePages_Rsvd: 0\nHugePages_Surp: 0\nHugepagesize: 4096\
  \ kB\nDirectMap4k: 12280 kB\nDirectMap4M: 897024 kB\n```\n\n`rich@rich-desktop:~$`\n\
  \n`MemTotal` 行显示此台 Linux 服务器拥有 1GB 的物理内存。它还显示约 660MB 内存尚未被使用（`MemFree`）。输出还显示该系统上可用约\
  \ 2.5GB 的交换空间（`SwapTotal`）。\n\n默认情况下，运行在 Linux 系统上的每个进程都有自己的私有内存页。一个进程无法访问另一个进程正在使用的内存页。内核维护着自己的内存区域。出于安全考虑，没有进程可以访问内核进程所使用的内存。\n\
  \n为了方便数据共享，你可以创建共享内存页。多个进程可以对一个公共共享内存区域进行读写。内核维护并管理这些共享内存区域，并允许各个进程访问该共享区域。\n\n\
  特殊的 `ipcs` 命令允许你查看系统上当前的共享内存页。以下是示例 `ipcs` 命令的输出：\n\n```bash\n# ipcs -m\n\n  ------\
  \ Shared Memory Segments --------\n  key         shmid      owner     perms    bytes\
  \      nattch  status\n  0x00000000  0         rich      600      2228       6\n\
  \  0x395ec1c   1         oracle    640      78764      6\n```\n\n每个共享内存段都有创建一个该段的所有者。每个段还具有标准的\
  \ Linux 权限，用于设置该段对其他用户的可可用性。`key` 值用于允许其他用户访问共享内存段。软件管理\n\nLinux 操作系统调用一个运行中的程序。进程可以在前台运行（在显示器上输出），也可以在后台运行（在幕后）。内核控制\
  \ Linux 系统如何管理系统上的所有进程。内核创建第一个进程，称为 `init` 进程，用于启动系统上的所有其他进程。内核启动时，将 `init` 进程加载到虚拟内存中。当内核启动每个额外的进程时，它会在虚拟内存中为其分配一个唯一的区域，用于存储该进程使用的数据和代码。某些\
  \ Linux 实现包含一个在启动时自动启动的进程表。在 Linux 系统上，此表通常位于特殊文件 `/etc/init`。其他系统（例如流行的 Ubuntu\
  \ 发行版）利用 `/etc/init.d`，其中包含启动和停止单个应用程序的脚本。这些脚本通过 `/etc/rc.d` 下的项目启动，其中 `X` 是运行级别。\n\
  \nLinux 操作系统使用运行级别（run levels）。运行级别可以引导 `init` 进程运行由 `/etc/init` 或 `/etc/rc.d` 中定义的特定类型的进程。Linux\
  \ 操作系统共有五个运行级别。在运行级别 1 下，只启动基本进程和一个终端进程。这被称为单用户模式。单用户模式通常用于发生故障时的紧急维护。显然，在这种模式下，一个人（通常是管理员）可以登录系统并进行数据操作。标准运行级别是\
  \ 3。在此运行级别下，会启动大多数应用程序软件（如网络支持）。Linux 中的另一个运行级别是运行级别 5。这是系统启动图形化 X 软件的运行级别，允许你使用图形桌面登录。Linux\
  \ 系统可以通过控制运行级别来控制整体功能。通过将运行级别从 3 更改到 5，系统可以从控制台系统变为高级的图形化 X 系统。在第 4 章中，你将看到如何使用\
  \ `ps` 命令查看当前在 Linux 系统上运行的进程。以下是你使用 `ps` 时看到的示例：\n\n```bash\n$ ps ax\n    PID TTY\
  \         STAT    TIME COMMAND\n      1?   S       0:03    init\n      2?   SW \
  \     0:00    [flush]\n      3?   SW      0:00    [update]\n      4?   SW      0:00\
  \    [piod]\n      5?   SW      0:00    [kswapd]\n     43?   SW      0:00    [portmap]\n\
  \     295?   S       0:00    syslogd\n     305?   S       0:00    klogd\n     320?\
  \   S       0:00    /usr/sbin/atd\n     335?   S       0:00    crond\n     350?\
  \   S       0:00    inetd\n     365?   SW      0:00    [lpd]\n     403 tty0 S  \
  \     0:00    gpm -t ms\n     418?   S       0:00    httpd\n     423?   S      \
  \ 0:00    httpd\n     424?   SW      0:00    [httpd]\n     425?   SW      0:00 \
  \   [httpd]\n     426?   SW      0:00    [httpd]\n     427?   SW      0:00    [httpd]\n\
  \     428?   SW      0:00    [httpd]\n     429?   SW      0:00    [httpd]\n    \
  \ 430?   SW      0:00    [httpd]\n     436?   SW      0:00    [httpd]\n     437?\
  \   SW      0:00    [httpd]\n     438?   SW      0:00    [httpd]\n      70?   S\
  \       0:02    fs -port\n      85?   SW      0:00    [smbd]\n      95?   S    \
  \   0:00    nd\n      33?   SW      0:00    master\n     38 tty1 SW      0:00  \
  \  tty\n     39 tty2 SW      0:00    tty\n     40 tty3 SW      0:00    tty\n   \
  \  41 tty4 SW      0:00    tty\n     42 tty5 SW      0:00    tty\n     43 tty6 SW\
  \      0:00    tty\n     44?   SW      0:00    [fd]\n     49?   SW      0:00   \
  \ [fd]\n     59?   S       0:02    [m]\n     85?   S       0:06    [ikbd]\n    \
  \ 94?   S       0:00    [sound]\n     95?   S       0:03    [panel]\n     96?  \
  \ S       0:02    [fm]\n     97?   S       0:00    [root]\n     98?   S       0:01\
  \    [bgnd]\n    611?   S       0:00    [ktop]\n    666?   S       0:00    /usr/postfix/master\n\
  \    668?   S       0:00    qmgr -l -t fifo\n    787?   S       0:00    pickup\n\
  \    790?   S       0:00    telnetd: 192.168.1.2 [vt100]\n    791 pts/0 S      \
  \ 0:00    login -- rich\n    792 pts/0 S       0:00    -bash\n    805 pts/0 R  \
  \     0:00    ps\n```\n\n输出中的第一列显示进程的进程 ID（或 PID）。注意第一个进程是我们的朋友 `init` 进程，并由 Linux\
  \ 系统分配了 PID 1。在 `init` 之后启动的所有其他进程都按数字顺序分配 PID。两个进程不能具有相同的 PID（尽管在原始进程终止后系统可以重新使用旧的\
  \ PID）。\n\n第三列显示进程的当前状态（S 表示睡眠，SW 表示睡眠并等待，R 表示运行）。最后一列显示进程名称。带有中括号的进程是由于不活动而从内存交换到磁盘交换空间的进程。你可以看到某些进程已被交换出，但大多数运行中的进程并没有。\n\
  \n\n\n\n内核的另一个职责是硬件管理。Linux 系统必须与之通信的任何设备都需要在内核代码中插入驱动程序代码。驱动代码允许内核在设备之间传递数据，充当应用程序与硬件之间的中间人。在\
  \ Linux 内核中，用于插入设备驱动代码的方法有两种方法：\n\n*   编译在内核中的驱动程序\n*   添加到内核的驱动模块\n\n以前，插入设备驱动代码的唯一方法是重新编译内核。每当你向系统添加新设备时，都必须重新编译内核代码。随着\
  \ Linux 内核支持的硬件越来越多，这个过程变得越来越低效。幸运的是，Linux 开发者发明了一种更好的方法来向运行中的内核插入驱动程序代码。\n\n程序员开发了内核模块的概念，允许你在无需重新编译内核的情况下向运行中的内核插入驱动程序代码。此外，当设备使用完毕后，可以从内核中移除内核模块。这极大地简化并扩展了\
  \ Linux 硬件的使用。\n\nLinux 系统将硬件设备识别为特殊文件，称为设备文件。设备文件有三种分类：\n\n*   字符设备\n*   块设备\n\
  *   网络设备\n\n字符设备用于一次只能处理一个字符数据的设备。大多数类型的调制解调器和终端被创建为字符文件。块文件用于一次可以处理大块数据的设备，例如磁盘驱动器。\n\
  \n网络文件类型用于使用数据包发送接收数据的设备。这包括网卡和一个特殊的环回设备，允许 Linux 系统使用常用的网络编程协议与自身进行通信。\n\nLinux\
  \ 为系统上的每个设备创建一个名为“节点”（nodes）的特殊文件。与设备的所有通信都通过设备节点完成。每个节点都有一个唯一的数字对来供 Linux 内核识别。该数字对包括主设备号（major）和次设备号（minor）。相似的设备被分为同一个主设备号。次设备号用于标识主设备组内的特定设备。以下是\
  \ Linux 服务器上几个设备文件的示例：\n\n```\nrich@rich-desktop: ∼$ cd /dev\nrich@rich-desktop:/dev$\
  \ ls -al sda* ttyS*\nbrw-rw---- 1 root disk    8,  0 2010-09-18 17:25 sda\nbrw-rw----\
  \ 1 root disk    8,  1 2010-09-18 17:25 sda1\nbrw-rw---- 1 root disk    8,  2 2010-09-18\
  \ 17:25 sda2\nbrw-rw---- 1 root disk    8,  5 2010-09-18 17:25 sda5\ncrw-rw----\
  \ 1 root dialout 4, 64 2010-09-18 17:25 ttyS0\ncrw-rw---- 1 root dialout 4, 65 2010-09-18\
  \ 17:25 ttyS1\ncrw-rw---- 1 root dialout 4, 66 2010-09-18 17:25 ttyS2\ncrw-rw----\
  \ 1 root dialout 4, 67 2010-09-18 17:25 ttyS3\nrich@rich-desktop:/dev$\n```\n\n\
  不同的 Linux 发行版使用不同的设备名称处理设备。在这个发行版中，`sda` 设备是第一个 ATA 硬盘，`ttyS` 设备是标准的 IBM PC COM\
  \ 端口。列表显示了在示例 Linux 系统上创建的所有 `sda` 设备。并不是所有的设备都被实际使用，但创建它们是为了以防管理员需要。同样，列表显示了了创建的所有\
  \ `ttyS` 设备。\n\n第五列是主设备节点号。注意，所有的 `sda` 设备都具有相同的主设备节点 `8`，而所有的 `ttyS` 设备都使用 `4`。第六列是次设备节点号。主设备号内的每个设备都有自己唯一的次设备节点号。\n\
  \n第一列表示设备文件的权限。权限的第一个字符表示文件类型。注意，ATA 硬盘文件都被标记为块（`b`）设备，而 COM 端口设备文件被标记为字符（`c`）设备。\n\
  \n### 文件系统管理\n\n与其他某些操作系统不同，Linux 内核可以支持不同类型的文件系统，以便在硬盘上读写数据。除了拥有自己的十多种文件系统外，Linux\
  \ 还可以读写其他操作系统（如 Microsoft Windows）使用的文件系统。内核在编译时必须支持系统将要使用的所有类型的文件系统。表 1.1 列出了 Linux\
  \ 系统可以用于读写数据的标准文件系统。\n\n表 1.1 Linux 文件系统\n\n| 文件系统 | 说明 |\n| :--- | :--- |\n| ext\
  \ | Linux 扩展文件系统——原始 Linux 文件系统 |\n| ext2 | 第二扩展文件系统，比 ext 提供了更高级的功能 |\n| ext3 |\
  \ 第三扩展文件系统，支持日志功能 |\n| ext4 | 第四扩展文件系统，支持高级日志功能 |\n| hpfs | OS/2 高性能文件系统 |\n| jfs\
  \ | IBM 的日志文件系统 |\n| iso9660 | ISO 9660 文件系统（CD-ROM） |\n| minix | MINIX 文件系统 |\n\
  | msdos | Microsoft FAT16 |\n| ncp | Netware 文件系统 |\n| nfs | 网络文件系统 |\n| ntfs |\
  \ 对 Microsoft NT 文件系统的支持 |\n| proc | 访问系统信息 |\n| ReiserFS | 用于更好的性能和磁盘恢复的先进 Linux\
  \ 文件系统 |\n| smb | 用于网络访问的 Samba SMB 文件系统 |\n| sysv | 旧版 Unix 文件系统 |\n| ufs | BSD\
  \ 文件系统 |\n| umsdos | 运行在 msdos 之上的 Unix 类文件系统 |\n| vfat | Windows 95 文件系统 (FAT32)\
  \ |\n| XFS | 高性能 64 位日志文件系统 |\n\n\n\n\n\nGNU/Linux shell 是一种特殊的交互式实用。它为用户提供了一种启动程序、管理文件系统上的文件以及管理\
  \ Linux 系统上运行进程的方法。shell 的核心是命令提示符（command prompt）。命令提示符是 shell 的交互部分，它允许你输入文本命令，然后由它解释这些命令并在内核中执行它们。\n\
  \nshell 包含一组内部命令，你可以用它们控制诸如复制文件、移动文件、重命名文件、显示系统当前运行的程序以及停止系统运行的程序。除了内部命令外，shell\
  \ 还允许你在命令提示符处输入程序名称。shell 会将程序名称传递给内核来启动。\n\n你还可以将 shell 命令组合成文件并作为程序执行。这些文件被称为\
  \ shell 脚本（shell scripts）。任何你可以从命令行执行的命令都可以放在 shell 脚本中并作为一组命令运行。这为为常用命令创建工具，或为需要将多个命令组合在一起的过程提供了极大的灵活性。\n\
  \nLinux 系统中有很多不同的 Linux shell 可供。不同的 shell 具有不同的特性，有些更适合创建脚本，而另一些则更适合管理进程。所有 Linux\
  \ 发行版使用的默认 shell 是 `bash` shell。`bash` shell 是由 GNU 项目开发的，用于取代标准的 Unix shell——即\
  \ Bourne shell（以其创建者命名）。`bash` shell 的名字是对这个词的趣味双关，它被称为“Bourne again shell（再次出生的\
  \ Bourne 壳）”。\n\n除了 `bash` shell 外，我们还将在书中介绍其他几种流行的 shell。表 1.2 列出了我们将要检查的不同 shell。\n\
  \n### 表 1.2 Linux Shell\n\n| Shell | 描述 |\n| :--- | :--- |\n| ash | 一种简单轻级的 shell，运行在低内存环境中，但与\
  \ `bash` shell 完全兼容 |\n| korn | 一种与 Bourne shell 兼容的编程 shell，但支持关联数组和浮点运算等高级编程功能\
  \ |\n| tcsh | 一种将 C 语言语言元素整合到 shell 脚本中的 shell |\n| zsh | 一种高级 shell，整合了 `bash`、`tcsh`\
  \ 和 `korn` 的特性，提供了高级编程功能、共享历史文件和主题化提示符 |\n\n大多数 Linux 发行版都包含多个 shell，尽管它们通常会选择其中一个作为默认\
  \ shell。如果你的 Linux 发行版包含多个 shell，请尽管尝试不同的 shell，看看哪一个最符合你的需求。\n\n## Linux 桌面环境\n\
  \n在 Linux 早期（20 世纪 90 年代初），所有可用的只是指向 Linux 操作系统的简单文本界面。这个文本界面允许管理员启动程序、控制程序操作以及在系统中移动文件。\n\
  \n随着微软 Windows 的普及，计算机用户期望有比旧文本界面更丰富的功能。这促进了开源软件（OSS）社区的更多开发，Linux 图形桌面也应运而生。\n\n\
  Linux 以能够以多种方式完成任务而闻名，这一点在图形桌面中尤为突出。在 Linux 中，你有大量的图形桌面可以选择。接下来的章节描述了其中一些最流行的桌面。\n\
  \n## X Windows 系统\n\n有两个基本元素控制着你的视频环境——PC 中的显卡和你的显示器。为了在你的计算机上显示华丽的图形，Linux 软件需要知道如何与它们通信。X\
  \ Windows 软件是呈现图形的核心元素。\n\nX Windows 软件是一个低级程序，直接与 PC 中的显卡和显示器工作，并控制 Linux 如何在你的计算机上展示华丽的窗口和图形。\n\
  \nLinux 并不是唯一使用 X Windows 的操作系统；还有为许多不同操作系统编写的版本。在 Linux 世界中，只有两个软件包可以实现它。\n\n`XFree86`\
  \ 软件包是两者中较旧的，在很一段时间内是 Linux 上唯一的可用 X Windows 软件包。正如其名称所示，它是 X Windows 软件的免费开源版本。\n\
  \n两者中较新的软件包 `X.org` 已经在 Linux 世界中取得了巨大进展，现在已是两者中更流行的一个。它也提供了 X Windows 系统的开源软件实现，但支持今天使用的更多较新显卡。\n\
  \n这两个软件包的工作方式相同，都控制 Linux 如何使用你的显卡在显示器上显示内容。为了做到这一点，必须针对你的特定系统进行配置。这本应该在你安装 Linux\
  \ 时自动发生。\n\n当你首次安装 Linux 发行版时，它会尝试检测你的显卡和显示器，然后创建一个包含所需信息的 X Windows 配置文件。在安装期间，你可能会注意到安装程序扫描显示器以支持的视频模式。有时这会导致你的显示器空白几秒钟。因为世界上有很多不同类型的显卡和显示器，这个过程可能需要一段时间才能完成。\n\
  \n核心 X Windows 软件产生一个图形显示环境，但仅此此。虽然这对于运行单个应用程序足够了，但对于日常计算机使用来说并没有太大用。没有允许用户操作文件或启动程序的桌面环境。要实现这一点，你需要在\
  \ X Windows 系统软件之上运行桌面环境。\n\n## KDE 桌面\n\nKDE 桌面环境（KDE）首次于 1996 年作为一个开源项目发布，旨在产生一个类似于微软\
  \ Windows 环境的图形桌面。KDE 桌面整合了如果你是 Windows 用户可能熟悉的所有功能。图 1.3 显示了在 openSuSE Linux 发行版运行的示例\
  \ KDE 4 桌面。\n\n![1.3](img/c01f003.jpg)\n\nKDE 桌面允许你在桌面的特殊区域放置应用程序图标和文件图标。如果你单击一次应用程序图标，Linux\
  \ 系统就会启动该应用程序。如果你单击一次文件图标，KDE 桌面会尝试启动启动应用程序来处理该文件。\n\n桌面底部的条被称为面板（Panel）。面板由四部分组成：\n\
  \n* K 菜单：非常像 Windows 开始菜单，K 菜单包含启动已安装应用程序的链接。\n* 程序快捷方式：这些是直接从面板启动应用程序的快速链接。\n*\
  \ 任务栏：任务栏显示当前在桌面上运行的应用程序图标。\n* 小组件（Applets）：这些是小型应用程序，在面板中有一个图标，通常可以根据应用程序的信息发生变化。\n\
  \n面板的所有功能都与你在 Windows 中找到的相似。除了桌面功能外，KDE 项目还生产了大量在 KDE 环境中运行的应用程序。这些应用程序在表 1.3 所示。（你可能会注意到\
  \ KDE 应用程序中使用大写 K 的趋势。）\n\n### 表 1.3 KDE 应用程序\n\n| 应用程序 | 描述 |\n| :--- | :--- |\n\
  | amaroK | 音频文件播放器 |\n| digiKam | 数字相机软件 |\n| dolphin | 文件管理器 |\n| K3b | CD 刻录软件\
  \ |\n| Kaffeine | 视频播放器 |\n| Kmail | 电子邮件客户端 |\n| Koffice | 办公应用程序套件 |\n| Konqueror\
  \ | 文件和网络浏览器 |\n| Kontact | 个人信息管理器 |\n\n\n\n\n\n| Kopete | 即时消息客户端 |\n\n这仅是 KDE\
  \ 项目产生的应用程序的部分列表。KDE 桌面还包含了许多其他应用程序。\n\n## GNOME 桌面\n\nGNU 网络对象模型环境（`GNOME`）是另一个流行的\
  \ Linux 桌面环境。`GNOME` 最初于 1999 年发布，现已成为许多 Linux 发行版的默认桌面环境（最流行的是红帽 Linux Red Hat\
  \ Linux）。\n\n虽然 `GNOME` 选择了背离微软 Windows 的视觉外观和体验，但它整合了大多数 Windows 用户熟悉的许多功能：\n\n\
  *   用于放置图标的桌面区域\n*   两个面板区域\n*   拖放操作能力\n\n图 1.4 显示了 Ubuntu Linux 发行版使用的标准 GNOME\
  \ 桌面。\n\n图 1.4 Ubuntu Linux 系统上的 GNOME 桌面\n\n![1.4](img/c01f004.jpg)\n\nGNOME 开发者也不逊输给\
  \ KDE，他们制作了一系列与 GNOME 桌面集成的图形化应用程序。这些显示在表 1.4 中。\n\n如你所见，GNOME 桌面还有许多可用应用程序。除了这些应用程序之外，绝大多数使用\
  \ GNOME 桌面的 Linux 发行版还包含了 KDE 库，允许你可以在 GNOME 桌面上运行 KDE 应用程序。\n\n表 1.4 GNOME 应用程序\n\
  \n| 应用程序 |  |\n| :--- | :--- |\n| epiphany | 网页浏览器 |\n| evince | 文档查看器 |\n| gcalc-tool\
  \ | 计算器 |\n| gedit | GNOME 文本编辑器 |\n| gnome-panel | 用于启动应用程序的桌面面板 |\n| gnome-nettool\
  \ | 网络诊断工具 |\n| gnome-terminal | 终端仿真器 |\n| nautilus | 图形文件管理器 |\n| nautilus-cd-burner\
  \ | CD 刻录工具 |\n| sound juicer | 音频 CD 刻录工具 |\n| tomboy | 笔记软件 |\n| totem | 多媒体播放器\
  \ |\n\n## 其他桌面\n\n图形化桌面环境的缺点是，它们需要大量的系统资源才能正常运行。在 Linux 早期，Linux 的标志和卖点是它能够在旧的、性能较弱的\
  \ PC 上运行，而较新的微软桌面产品无法运行。然而，随着 KDE 和 GNOME 桌面的普及，情况发生了变化，因为运行 KDE 或 GNOME 桌面所消耗的内存与最新的微软桌面环境一样多。\n\
  \n如果你有一台旧 PC，请不要气馁。Linux 开发者们汇聚在一起，让 Linux 回归本。他们创建了几个面向低内存的图形化桌面应用程序，这些程序提供了在旧\
  \ PC 上运行非常良好的基本功能。\n\n虽然这些图形化桌面没有围绕它们设计的海量应用程序，但它们仍然运行许多基础图形化应用程序，支持文字处理、电子表格、数据库、绘图以及当然还有多媒体支持等功能。\n\
  \n表 1.5 显示了一些可以在低性能 PC 和笔记本电脑上使用的较小型 Linux 图形桌面环境。\n\n表 1.5 其他 Linux 图形桌面\n\n| 桌面\
  \ | 描述 |\n| :--- | :--- |\n| fluxbox | 一个极简的桌面，不包含面板，只有一个用于启动应用程序的弹出菜单 |\n| xfce\
  \ | 与 KDE 桌面相似的桌面，但针对低内存环境减少了图形效果 |\n| JWM | Joe's Window Manager，一个非常轻量级的桌面，适合低内存和低磁盘空间环境\
  \ |\n| fvwm | 支持虚拟桌面和面板等高级桌面功能，但在低内存环境中运行 |\n| fvwm95 | 衍生自 fvwm，但外观像 Windows 95\
  \ 桌面 |\n\n这些图形桌面环境没有 KDE 和 GNOME 桌面那么华丽，但它们能够很好地提供基础图形功能。图 1.5 显示了 Puppy Linux antiX\
  \ 发行版使用的 fluxbox 桌面。\n\n图 1.5 Puppy Linux 发行版中的 JWM 桌面\n\n![1.5](img/c01f005.jpg)\n\
  \n如果你正在使用旧 PC，尝试一个使用这些桌面之一的 Linux 发行版看看效果如何。你可能会感到惊喜。\n\n## Linux 发行版\n\n现在你已经了解了完整\
  \ Linux 系统所需的四个主要组件，你可能在好奇如何将它们全部组合成一个 Linux 系统。幸运的是，已经有人为你做好了。\n\n一个完整的 Linux 系统包被称为“发行版”（distribution）。有许多不同的\
  \ Linux 发行版可以满足你可能遇到的任何计算需求。大多数发行版都是针对特定用户群定制的，例如商业用户、多媒体爱好者、软件开发者或普通家庭用户。每个定制的发行版都包含了支持特殊功能所需的软件包，例如为多媒体爱好者提供的音频和视频编辑软件，或者为软件开发者提供的编译器和集成开发环境\
  \ (IDE)。\n\n不同的 Linux 发行版通常分为三类：\n\n*   核心 Linux 发行版\n*   专门化发行版\n*   LiveCD 测试发行版\n\
  \n后续章节描述了这些不同类型的 Linux 发行版，并展示了每个类别中的 Linux 发行版示例。\n\n### 核心 Linux 发行版\n\n核心 Linux\
  \ 发行版包含内核、一个或多个图形桌面环境以及几乎所有针对内核预编译的 Linux 应用程序。它为完整的 Linux 安装提供了一站式服务。表 1.6 显示了一些流行的核心\
  \ Linux 发行版。\n\n| 发行版 | 描述 |\n| :--- | :--- |\n| Slackware | 原始 Linux 发行集之一，深受 Linux\
  \ 极客喜爱 |\n| Red Hat | 一种商用企业级发行版，主要用于互联网服务器 |\n| Fedora | 红帽的衍生版本，但为家庭使用设计 |\n|\
  \ Gentoo | 为进级 Linux 用户设计的发行版，仅包含 Linux 源码 |\n| Mandriva | 主要为家庭使用设计（以前称为 Mandrake）\
  \ |\n| openSuSe | 针对商业和家庭使用的不同发行版 |\n| Debian | 受 Linux 专家和商业 Linux 产品青睐 |\n\n在\
  \ Linux 早期，发行版是以一组软盘的形式发布的。你必须下载多组文件然后将它们拷贝到磁盘上。制作一个完整的发行版通常需要 20 张或更多磁盘！不说说，这是一段痛苦的经历。\n\
  \n如今，随着家用电脑通常内置 CD 和 DVD 播放器，Linux 发行版以 CD Set 或单张 DVD 发发布。这使得安装 Linux 变得简单得多。\n\
  \n然而，初学者在安装核心 Linux 发行版时仍然经常遇到问题。为了涵盖人们可能想要使用 Linux 的任何情况，单个发行版必须包含大量的应用程序软件。它们包含了从高端互联网数据库服务器到常见游戏的一切。由于\
  \ Linux 可用应用程序数量巨大，一个完整的发行版通常需要四张或更多 CD。\n\n\n\n\n\n虽然在发行版中有许多选项对于 Linux 极客来说是件好事，但对于初\
  \ Linux 用户来说可能是一场噩梦。大多数发行版在安装过程中会询问一系列问题，以确定默认加载哪些应用程序、PC 连接了哪些硬件以及如何配置这些硬件。初学者往往觉得这些问题很困惑。结果是，他们要么在计算机上加载了过多的程序，要么加载得不够，后来发现计算机无法按照他们的意愿运行。\n\
  \n幸运的是，初学者有一种简单得多的方法安装 Linux。\n\n## 特化 Linux 发行版\n\n一个新的 Linux 发行版子类开始出现。这些通常基于主要的发行版之一，但仅包含对特定领域有意义的应用程序集。\n\
  \n除了提供专用软件（例如仅为商务用户提供办公产品），定制化的 Linux 发行版还尝试通过自动检测和自动配置常见硬件设备来帮助 Linux 初学者。这使得安装\
  \ Linux 了一个更加愉快的过程。\n\n表 1.7 显示了一些可特化 Linux 发行版及其专长领域。\n\n表 1.7 特化 Linux 发行版\n\n\
  | 发行版 | 说明 |\n| :--- | :--- |\n| Xandros | 为初学者配置的商业级 Linux 软件包 |\n| SimplyMEPIS\
  \ | 适用于家庭使用的免费发行版 |\n| Ubuntu | 适用于学校和家庭使用的免费发行版 |\n| PCLinuxOS | 适用于家庭和办公使用的免费发行版\
  \ |\n| Mint | 适用于家庭娱乐使用的免费发行版 |\n| dyne:bolic | 专为音频和 MIDI 应用设计的免费发行版 |\n| Puppy\
  \ Linux | 一种在旧 PC 上运行良好的免费轻量发行版 |\n\n这只是特化 Linux 发行版的一个小样本。互联网上实际上有成百上种特化 Linux\
  \ 发行版，而且还在不断涌现。无论你的专长是什么，你可能都能找到一个为你定制的 Linux 发行版。\n\n许多特化 Linux 发行版基于 `Debian`\
  \ Linux 发行版。它们使用与 `Debian` 相同的安装文件，但仅封装了完整 Debian 系统的一小部分。\n\n## Linux LiveCD\n\n\
  Linux 世界中一个相当新的现象是可启动的 Linux CD 发行版。这让你可以在不实际安装的情况下查看 Linux 系统的样貌。大多数现代 PC 都可以从\
  \ CD 而非标准硬盘启动。为了利用这一点，某些 Linux 发行版创建了包含示例 Linux 系统的可启动 CD（称为 `Linux LiveCD`）。由于单张\
  \ CD 尺寸的限制，示例无法包含完整的 Linux 系统，但它们在里面塞入的软件之多会让你大大惊讶。结果是，你可以从 CD 启动 PC 并运行 Linux 发行版，而无需在硬盘上安装任何东西！\n\
  \n这是测试各种 Linux 发行版而无需干扰 PC 的极佳方法。只需插入 CD 并启动即可！所有的 Linux 软件都将直接从 CD 运行。你可以从互联网下载许多\
  \ `Linux LiveCDs` 并将其刻录到 CD 上进行试用。\n\n表 1.8 显示了一些流行的 Linux LiveCD。\n\n表 1.8 Linux\
  \ LiveCD 发行版\n\n| 发行版 | 说明 |\n| :--- | :--- |\n| Knoppix | 德国 Linux，开发的第一个 Linux\
  \ LiveCD |\n| SimplyMEPIS | 为初级家庭 Linux 用户设计 |\n| PCLinuxOS | 位于 LiveCD 上的完整 Linux\
  \ 发行版 |\n| Ubuntu | 全球性的 Linux 项目，为多种语言设计 |\n| Slax | 基于 Slackware Linux 的实时 Linux\
  \ CD |\n| Puppy Linux | 为旧款 PC 设计的全功能 Linux |\n\n你可能在此表中发现某些名称很熟悉。许多特化 Linux 发行版也有\
  \ Linux LiveCD 版本。某些 Linux LiveCD 发行版（如 `Ubuntu`）允许你直接从 LiveCD 安装 Linux 发行版。这让你能够通过\
  \ CD 启动、试用 Linux 发行版，如果你喜欢，就可以将其安装到硬盘上。这个功能非常方便且易于用户。\n\n正如所有好事一样，Linux LiveCD 也有一些缺点。因为你是从\
  \ CD 访问一切，所以应用程序运行速度较慢，特别是当你使用较旧、较慢的计算机和 CD 驱动器时。此外，由于你无法写入 CD，对 Linux 系统所做的任何更改在下次重启时都会消失。\n\
  \n但 Linux LiveCD 世界正在取得进展，帮助解决其中的一些问题。这些进展包括能够：\n\n* 从 CD 将 Linux 系统文件拷贝到内存\n* 将系统文件拷贝到硬盘上的文件\n\
  * 将系统设置存储在 USB 闪存盘上\n* 将用户设置存储在 USB 闪存上\n\n某些 Linux LiveCD（如 Puppy Linux）的设计包含最少数量的\
  \ Linux 系统文件。LiveCD 启动脚本会在 CD 启动时将它们直接复制到内存。这允许你在 Linux 启动后立即将 CD 从计算机中取出。这不仅让你的应用程序运行快得多（因为程序从内存中运行更快），还为你提供了一个免费的\
  \ CD 驱，用于通过 `Puppy Linux` 提供的软件刻录音频 CD 或播放视频 DVD。\n\n其他 Linux LiveCD 使用另一种方法，允许你在启动后将\
  \ CD 从光驱中取出。这涉及将核心 Linux 文件作为单个文件拷贝到 Windows 硬盘上。CD 启动后，它会寻找该文件并从中读取系统文件。`dyne:bolic`\
  \ Linux LiveCD 使用了这种技术，被称为 `docking`。当然，你必须在从 CD 启动之前将系统文件拷贝到你的硬盘上。\n\n存储来自实时 Linux\
  \ CD 会话数据的一种非常流行的技术是使用常用的 USB 闪存盘（也称为 U 盘或优盘）。几乎每个 Linux LiveCD 都能识别插入的 USB 闪存盘（即使该盘是为\
  \ Windows 格式化的），并对其进行读写操作。这允许你启动 Linux LiveCD，使用 Linux 应用程序创建文件，将这些文件存储在闪存盘上，以后从你的\
  \ Windows 应用程序（或从不同的计算机）访问它们。这酷酷吗？\n\n## 总结\n\n本章讨论了 Linux 系统及其基本工作原理。Linux 内核是系统的核心，控制内存、程序和硬件之间如何相互作用。`GNU`\
  \ 工具也是 Linux 系统中的重要组成部分。Linux Shell 是本书的重点，它是 `GNU` 核心工具的一部分。本章还讨论了 Linux 系统的最后一部分：Linux\
  \ 桌面环境。多年来情况已经发生了变化，Linux 现在支持多种图形桌面环境。\n\n本章还讨论了各种 Linux 发行版。Linux 发行版将 Linux 系统的各个部分封装成一个简单的包，你可以轻松将其安装在\
  \ PC 上。Linux 发行版世界包含了完整的 Linux 发行版（包含几乎能想象的所有应用程序），以及仅包含专注于特殊功能的特化 Linux 发行版。Linux\
  \ LiveCD 热潮创造了另一组 Linux 发行版，让你无需将其安装到硬盘上即可轻松试用 Linux。\n\n在下一章中，你将了解开始命令行和 Shell\
  \ 脚本体验需要什么。你将看到从你华丽的图形桌面环境进入 Linux Shell 工具需要做什么。如今这并不总是一件容易的事。\n\n## 第 2 章：进入 Shell\n\
  \n### 本章内容\n\n* 终端仿真\n* Terminfo 数据库\n* Linux 控制台\n\n\n\n\n\n*   xterm 终端\n*   Konsole\
  \ 终端\n*   GNOME 终端\n\n在早期的 Linux 时代，唯一可用的工具就是 shell（壳）。系统管理员、程序员和系统用户都坐在 Linux 控制台终端前，输入文本命令并查看文本输出。如今，随着我们花哨的图形化桌面环境，要在系统中找到一个可以工作的\
  \ shell 提示符反而变得越来越困难。本章将讨论提供命令行环境所需的条件，然后带你逐步了解在各种 Linux 发行版中可能会遇到的终端仿真包。\n\n##\
  \ 终端仿真\n\n在图形化桌面出现之前，与 Unix 系统交互的唯一方法是通过 shell 提供的文本命令行界面 (CLI)。CLI 仅允许文本输入，只能显示文本和基础的图形输出。\n\
  \n由于这种限制，输出设备不需要非常华丽。通常，只需要一个简单的哑终端（dumb terminal）即可与 Unix 系统进行交互。哑终端通常不只是一个显示器和一个键盘（尽管后来它们通过使用鼠标变得越来越华丽），通过通信电缆（通常是多线串口线）连接到\
  \ Unix 系统。这种简单的组合为向 Unix 系统输入文本数据和查看文本结果提供了一种方便的方法。\n\n正如你所知，如今的 Linux 环境已大不相同。几乎每个\
  \ Linux 发行版都使用某种图形化桌面环境。然而，为了访问 shell，你仍然需要一个文本显示器与 CLI 交互。现在的问题是进入获取它。有了所有新的图形化\
  \ Linux 桌面功能，有时在 Linux 发行版中找到 CLI 并不是易事。\n\n获取 CLI 的一种方法是将 Linux 系统退出图形化桌面模式并切换到文本模式。这在显示器上仅提供了一个简单的\
  \ shell CLI，就像图形化桌面之前的时代一样。这种模式被称为 Linux 控制台（Linux console），因为它仿真了旧时代的硬接线控制台终端，是\
  \ Linux 系统的直接接口。\n\n使用 Linux 控制台的替代方案是在图形化 Linux 桌面环境内部使用终端仿真包。终端仿真包在桌面的图形化窗口内模拟在哑终端上的工作。图\
  \ 2.1 显示了在图形化 Linux 桌面环境中运行的终端仿真器示例。\n\n图 2.1 运行在 Linux 桌面上的简单终端仿真器\n\n![2.1](img/c02f001.jpg)\n\
  \n每个终端仿真包都有仿真一种或多种特定类型哑终端的能力。如果你要在 Linux 中使用 shell，遗憾的是，你需要了解一些终端仿真知识。\n\n了解旧哑终端的核心功能将帮助你决定在使用图形化终端仿真器时选择哪种仿真类型，并充分利用所有可用功能。哑终端使用的主要功能可以分为两个领域：图形能力和键盘。本节将描述这些功能，并讨论它们如何与不同类型的终端仿真器相关联。\n\
  \n## 图形能力\n\n终端仿真的最重要的部分是它如何在显示器上显示信息。当你听到“文本模式”这个词时，你最后考虑的担心问题应该是图形。然而，即使是最原始的哑终端也支持某些屏幕操作方法（例如清屏和在屏幕特定位置显示文本）。\n\
  \n本节描述了使每种不同类型的终端独独特的图形功能，以及在终端仿真包中应该寻找什么。\n\n### 字符集\n\n所有终端必须在屏幕上显示字符（否则，文本模式将非常没用）。诀窍在于显示哪些字符，以及\
  \ Linux 系统需要发送哪些代码来显示这些字符。字符集是 Linux 系统发送到显示器以显示字符的二进制命令集。不同的终端仿真包支持几种字符集：\n\n*\
  \   `ASCII`: 美国信息交换标准。该字符集包含使用 7 位代码存储的英语字符，由 128 个英文字母（大小写）、数字和特殊符号组成。该字符集被美国国家标准协会\
  \ (ANSI) 采用为 `US-ASCII`。你经常会在终端仿真器中看到被称为 `ANSI` 字符集。\n*   `ISO-8859-1`（通常称为 `Latin-1`）：由国际标准化组织\
  \ (`ISO`) 开发的 `ASCII` 字符集的扩展。它使用 8 位代码来支持标准的 `ASCII` 字符以及大多数西欧语言的特殊外语字符。`Latin-1`\
  \ 字符集在跨国终端仿真包中很流行。\n*   `ISO-8859-2`: 支持东欧语言字符的 ISO 字符集。\n*   `ISO-8859-6`: 支持阿拉伯语字符的\
  \ ISO 字符集。\n*   `ISO-8859-7`: 支持希腊语字符的 ISO 字符集。\n*   `ISO-8859-8`: 支持希伯来语字符的 ISO\
  \ 字符集。\n*   `ISO-10646`（通常称为 `Unicode`）：ISO 2 字节字符集，包含了大多数英语和非英语的代码。这个单字符集包含了所有\
  \ `ISO-8859-x` 系列字符集中定义的所有代码。`Unicode` 字符集在开源应用中正变得流行。\n\n到目前为止，英语国家最常用的字符集是 `Latin-1`\
  \ 字符集。`Unicode` 字符集变得越来越流行，可能某一天会成为字符集的新标准。大多数流行的终端仿真器都允许你在终端中使用哪种字符集。\n\n### 控制代码\n\
  \n除了能够显示字符外，终端必须具有控制显示器和键盘上特殊功能的能力，例如屏幕上的光标位置。它们使用一套控制代码来实现这一点。控制代码是字符集中不使用的特殊代码，用于信号终端执行某种特殊的、不可打印的操作。\n\
  \n常见的控制代码功能包括回车（将光标返回到行开头）、换行（将光标置于下一水平行）、制表符（将光标移动到预设数量的空格）、箭头键（上、下、左、右）以及上页/下页键。虽然这些代码主要仿真控制光标在显示器上位置的功能，但还有其他几种代码，例如清空整个屏幕，甚至是铃声（仿真旧打字机的回行结束铃声）。\n\
  \n控制代码还用于控制哑终端的通信功能。哑终端通过某种通信通道连接到计算机系统，通常是串口通信电缆。有时需要在通信通道上对数据进行控制，因此开发者专门为数据通信设计了特殊控制代码。虽然现代终端仿真器并不一定需要这些代码，但大多数都支持这些。此类类别中最常见的代码是\
  \ `XON` 和 `XOFF` 代码，它们分别用于启动和停止向终端的数据传输。\n\n## 块模式图形\n\n\n\n\n\n随着哑电终端（dumb terminals）变得越来越流行，制造商开始尝试基础的图形能力。到目前为止，Unix\
  \ 世界中最流行的“图形化”哑电终端类型是数字设备公司（DEC）的 VT 系列终端。哑终端的转折点出现在 1978 年 `DEC VT100` 的发布。`DEC\
  \ VT100` 终端是第一个支持完整 ANSI 字符集的终端，包括块模式图形字符。\n\nANSI 字符集包含的编码不仅允许显示器显示文本，还能显示基础的图形符号，如方框、线条和方块。到目前为止，20\
  \ 世纪 80 年代 Unix 操作中最流行的哑电终端之一是 `DEC VT102`，它是 `VT100` 的升级版。大多数现代终端仿真程序仍然模拟 `VT102`\
  \ 显示器的操作，支持所有创建块模式图形的 ANSI 代码。\n\n## 矢量图形\n\n泰科尼克斯（Tektronix）公司生产了一系列使用“矢量图形”显示方法的流行终端。矢量图形通过将所有屏幕图像（包括字符）变为一系列线段（矢量），偏离了\
  \ DEC 的块模式图形方法。`Tektronix 4010` 终端是最流行的图形化哑电终端。许多终端仿真包仍在模拟其功能。\n\n`4010` 终端通过电子束绘制一系列矢量来显示图像，就像用铅笔画画一样。由于矢量图形不使用点来创建线条，它能够以比大多数点阵式图形终端更高的精度来绘制几何形状。这在数学家和科学家中是一个广受欢迎的功能。\n\
  \n现代终端仿真器使用软件来模拟 `Tektronix 4010` 终端的矢量图形绘制能力。对于需要精确图形绘制的人，或那些仍在运行使用矢量图形程序来绘制复杂图表和图形的人来说，这仍然是一个流行的功能。\n\
  \n## 显示缓冲\n\n图形显示的关键在于终端缓冲数据的能力。数据缓冲需要在终端内部具有额外的内存，以存储当前未在显示器上显示的字符。\n\n`DEC VT`\
  \ 系列终端利用了两种数据缓冲：\n\n*   对数据从主显示窗口滚出进行缓冲（称为 `history`）\n*   缓冲一个完全独立的显示窗口（称为 `alternate\
  \ screen`，备屏）\n\n第一种缓冲被称为 `scroll region`（滚动区域）。滚动区域是终端拥有的内存量，使其能够在数据滚出屏幕时“记住”数据。标准的\
  \ `DEC VT102` 终端包含一个 25 行字符的查看区域。当终端显示新一行字符时，之前的一行会向上滚动。当终端到达显示器的最后一行时，下一行将导致顶行滚出显示。\n\
  \n`VT102` 终端的内部内存允许它保存最后滚出显示器的 64 行内容。用户有能力锁定当前屏幕显示，并使用方向键向后滚动，查看已“滚出”屏幕的之前的行。终端仿真包允许你使用侧边滚动条或鼠标滚轮来滚动已保存的数据，而无需锁定显示。当然，为了完全的仿真兼容，大多数终端仿真包还允许你锁定显示并使用\
  \ `arrow` 以及 `page up`/`page down` 来滚动已保存的数据。\n\n第二种缓冲被称为 `alternative screen`（备屏）。通常，终端将数据直接写入显示器上的普通显示区域。人们开发出了一种粗略实现动画的方法，即使用两个屏幕区域来存储数据。控制代码用于信号终端将数据写入备屏而不是当前显示屏幕。这些数据被保存在内存中。另一个控制代码会信号终端几乎瞬间地在显示器显示的普通屏幕数据和备屏包含的数据之间进行切换。通过在备屏区域存储连续的数据页并进行显示，你可以粗略地模拟运动图形。\n\
  \n仿真 `VT` 系列终端的终端具有同时支持 `scroll region` 和 `alternative screen` 缓冲方法的能力。\n\n## 颜色\n\
  \n即使在黑白（或绿屏）哑电终端时代，程序员已经在尝试不同的方式来呈现数据。大多数终端支持特殊的控制代码来产生以下类型的特殊文本：\n\n*   粗体字符\n\
  *   下划线字符\n*   反色视频（白色背景上的黑色字符）\n*   闪烁\n*   以上所有功能的组合\n\n在过去，如果你想引起某人的注意，你会使用粗体、闪烁、反色视频文本。现在可有些东西会伤眼睛了！\n\
  \n随着彩色终端的出现，程序员增加了特殊的控制代码，以用各种颜色和深浅显示文本。ANSI 字符集包含了用于指定显示器上前景文本颜色和背景颜色的特定控制代码。大多数终端仿真器都支持\
  \ ANSI 颜色控制代码。\n\n## 键盘\n\n终端不仅仅取决于显示器如何工作。如果你曾接触过不同类型的哑电终端，你会发现它们的键盘上通常包含不同的键。对于终端仿真包来说，在特定的哑电终端上仿真特定的键证明是一项艰巨的任务。\n\
  \nPC 键盘的创造者无法为哑电终端中找到每种可能的特殊键都包含键。某些 PC 制造商尝试包含用于特殊功能的特殊键，但最终 PC 键盘键在某种程度上变得标准化了。\n\
  \n一个终端仿真包要完全仿真特定类型的哑电终端，它必须重映射任何在 PC 键盘上没有出现的哑电终端键。这种重映射功能往往会变得困惑，特别是当不同系统对同一个键使用不同的控制代码时。\n\
  \n在终端仿真包中看到的一些常见特殊键有：\n\n*   `Break`：向主机发送一流零。这通常用于中断 shell 中当前执行的程序。\n*   `Scroll\
  \ Lock`：也称为“不滚动”，它会停止显示器的输出。某些终端包含内存来保存显示内容，使用户在启用滚动锁定时可以向后滚动之前查看过的信息。\n*   `Repeat`：当与其他键一起按住时，这会导致终端向主机重复发送另一个键的值。\n\
  *   `Return`：通常用于向主机发送回车符。最常用于指示主机要处理的命令的结束（现在 PC 键盘上称为 `Enter`）。\n*   `Delete`：虽然基本上是一个简单功能，但\
  \ `Delete` 键给终端仿真包带来了麻烦。某些终端删除当前光标所在位置的字符，而另一些则删除前一个字符。为了解决这个困境，PC 键盘包含了两个删除键，`Backspace`\
  \ 和 `Delete`。\n*   `Arrow keys`（方向键）：通常用于将光标置在特定位置——例如在滚动列表时。\n*   `Function keys`（功能键）：特殊键的组合，可以在程序中分配唯一的值，类似于\
  \ PC 的 `F1` 到 `F12` 键。`DEC VT` 系列终端实际上有两组功能键，`F1` 到 `F20` 以及 `PF1` 到 `PF4`。\n\n\n\
  \n\n键盘仿真是终端仿真包中一个至关重要的元素。遗憾的是，应用程序编写时通常要求用户按下特定的按键来实现特定的功能。我见过的许多通信包使用了旧的 DEC `PF1`\
  \ 到 `PF4` 键，而这些键在终端仿真器键盘上往往很难找到。\n\n# terminfo 数据库\n\n既然你已经了解了可以仿真不同类型终端的终端仿真包，你还需要一种方法让\
  \ Linux 系统确切知道你正在仿真哪种终端。Linux 系统需要知道在与终端仿真器通信时应该使用哪些控制代码。这是通过使用一个环境变量（见第 5 章）和一组统称为\
  \ terminfo 数据库的特殊文件来实现的。\n\nterminfo 数据库是一组文件，用于识别在 Linux 系统上可以使用的各种终端的特性。Linux\
  \ 系统将每种终端类型的 terminfo 数据作为单独的文件存储在 terminfo 数据库目录中。该目录的位置通常根据发行版的不同而异。常见的位置包括 `/usr/share/terminfo`、`/etc/terminfo`\
  \ 和 `/lib/terminfo`。\n\n为了方便组织（通常有很多不同的 terminfo 文件），你会发现 terminfo 数据库目录包含按字母表划分的不同子目录。特定终端的单独文件存储在其终端名称对应的字母目录下。例如，在\
  \ `/usr/share/terminfo/v` 目录下存储着 `VT` 终端仿真器。\n\n单个 terminfo 文件是一个二进制文件，它是文本文件编译的结果。该文本文件包含定义屏幕函数的代码字，并与在终端上实现该功能所需的控制代码相关联。\n\
  \n由于 terminfo 数据库文件是二进制的，你无法看到这些文件中的代码。不过，你可以使用 `infocmp` 命令将二进制条转换为文本。使用该命令的示例如下：\n\
  \n```\n$ infocmp vt100\n\n# 通过 infocmp 从文件 /lib/terminfo/v/vt100 重构\n\nvt100|vt100-am|dec\
  \ vt100 (w/advanced video),\n      am, msgr, xenl, xon,\n      cols#80, it#8, lines#24,\
  \ vt#3,\n      acsc=\"aaffggjjkkllmmnnooppqqrrssttuuvvwwxxyyzz{{||}}∼∼,\n      bel=ˆG,\
  \ blink=\\E[5m$<2>, bold=\\E[1m$<2>,\n      clear=\\E[H\\E[J$<50>, cr=ˆM, csr=\\\
  E[%i%p1%d;%p2%dr,\n      cub=\\E[%p1%dD, cub1=ˆH, cud=\\E[%p1%dB, cud1=ˆJ,\n   \
  \   cuf=\\E[%p1%dC, cuf1=\\E[C$<2>,\n      cup=\\E[%i%p1%d;%p2%dH$<5>, cuu=\\E[%p1%dA,\n\
  \      cuu1=\\E[A$<2>, ed=\\E[J$<50>, el=\\E[K$<3>, el1=\\E[1K$<3>,\n      enacs=\\\
  E(B\\E)0, home=\\E[H, ht=ˆI, hts=\\EH, ind=ˆJ, ka1=\\EOq,\n      ka3=\\EOs, kb2=\\\
  EOr, kbs=ˆH, kc1=\\EOp, kc3=\\EOn, kcub1=\\EOD,\n      kcud1=\\EOB, kcuf1=\\EOC,\
  \ kcuu1=\\EOA, kent=\\EOM, kf0=\\EOy,\n      kf1=\\EOP, kf10=\\EOx, kf2=\\EOQ, kf3=\\\
  EOR, kf4=\\EOS, kf5=\\EOt,\n      kf6=\\EOu, kf7=\\EOv, kf8=\\EOl, kf9=\\EOw, rc=\\\
  E8,\n      rev=\\E[7m$<2>, ri=\\EM$<5>, rmacs=ˆO, rmam=\\E[?7l,\n      rmkx=\\E[?1l\\\
  E>, rmso=\\E[m$<2>, rmul=\\E[m$<2>,\n      rs2=\\E>\\E[?3l\\E[?4l\\E[?5l\\E[?7h\\\
  E[?8h,\n      sc=\\E7,\n      sgr0=\\E[m\\017$<2>, smacs=ˆN, smam=\\E[?7h, smkx=\\\
  E[?1h\\E=,\n      smso=\\E[7m$<2>, smul=\\E[4m$<2>, tbc=\\E[3g,\n```\n\nterminfo\
  \ 条目定义了终端名称（在此例中为 `vt100`），以及任何与终端名称关联的别名。注意，第一行显示了提取这些值的 terminfo 文件的位置。\n\n随后，`infocmp`\
  \ 命令列出了终端定义的各项功能，以及用于仿真这些单独功能的控制代码。某些功能被启用或禁用。如果该功能出现在列表中，则它是由终端定义启用的（例如 `am`，即自动右边距功能）。其他功能必须定义特定的控制代码序列来执行任务（例如清除显示器）。[表\
  \ 2.1] 显示了在列出的 `vt100` terminfo 定义文件中看到的一些功能列表。\n\n### 表 2.1 Terminfo 功能代码\n\n|\
  \ 代码 | 说明 |\n| :--- | :--- |\n| am | 设置右侧自动边距 |\n| msgr | 在高亮模式下安全移动光标 |\n| xenl\
  \ | 超过 80 列后忽略换行符 |\n| xon | 终端使用 XON/XOFF 字符进行流控 |\n| cols#80 | 每行 80 列 |\n| it#8\
  \ | 制表符设置为八个空格 |\n| lines#24 | 屏幕 24 行 |\n| vt#3 | 虚拟终端编号 3 |\n| bel | 用于仿真响铃的控制代码\
  \ |\n| blink | 用于产生闪烁文本的控制代码 |\n| bold | 用于产生加粗文本的控制代码 |\n| clear | 清除屏幕的控制代码 |\n\
  | cr | 回车代码 |\n| csr | 更改滚动区域的代码 |\n| cub | 向左移动一个字符而不擦除 |\n| cub1 | 光标后退一个空格 |\n\
  | cud | 光标向下移动一行 |\n| cud1 | 光标向下移动一行的控制代码 |\n| cuf | 向右移动一个字符 |\n| cuf1 | 向右移动一个字符的控制代码\
  \ |\n| cup | 将光标移动到指定的行列 |\n| cuu | 向上移动一行 |\n| cuu1 | 向上移动一行的控制代码 |\n| ed | 清除到行尾\
  \ |\n| el | 清除到行尾 |\n| el1 | 清除到行首的控制代码 |\n| enacs | 启用备字符集 |\n| home | 将光标回到第一行第一列\
  \ |\n| ht | 制表符 |\n| hts | 设置制表停止 |\n| ind | 插入 |\n| ka1 | 键盘左方向键 |\n| ka3 | 键盘右方向键\
  \ |\n| kb2 | 键盘删除 |\n| kbs | 退格键 |\n| kc1 | 键盘左方向键 |\n| kc3 | 键盘右方向键 |\n| kcub1\
  \ | 左方向键 |\n| kcud1 | 下方向键的控制代码 |\n| kcuf1 | 右方向键 |\n| kcuu1 | 上方向键的控制代码 |\n| kent\
  \ | 回车键 |\n| kf0 | F0 键 |\n| kf1 | F1 键 |\n| kf10 | F10 键 |\n| rc | 恢复到上次位置 |\n\
  | rev | 反转视频模式 |\n| ri | 向下滚动 |\n| rmacs | 结束备字符集 |\n| rmam | 关闭自动边距 |\n| rmkx |\
  \ 退出键盘传输模式 |\n| rmso | 退出高亮模式 |\n| rmul | 退出下划线模式 |\n| rs2 | 重置 |\n| sc | 保存光标位置\
  \ |\n| sgr | 定义视频属性 |\n| sgr0 | 关闭所有属性 |\n| smacs | 开始备字符集 |\n| smam | 开启自动边距 |\n\
  | smkx | 开始键盘传输模式 |\n| smso | 开始高亮模式 |\n| smul | 开始下划线模式 |\n| tbc | 清除所有制表停止 |\n\
  \n# Linux 控制台\n\n在 Linux 的早期时代，当你启动系统时，显示器上会显示一个登录提示，仅此而已。正如前面提到的，这被称为 Linux 控制台。它是你输入系统命令的唯一。\n\
  \nLinux Shell 使用 `TERM` 环境变量来定义特定会话使用 terminfo 数据库中的哪种终端仿真设置。当 `TERM` 环境变量设置为 `vt100`\
  \ 时，Shell 知道使用与 `vt100` terminfo 条目关联的控制代码向终端仿真器发送控制代码。要查看 `TERM` 环境变量，你可以直接从命令行\
  \ echo 它：\n\n```\n$ echo $TERM\n\nxterm\n```\n\n\n\n在现代 Linux 系统中，当 Linux 系统启动时，它会自动创建几个虚拟控制台。虚拟控制台是运行在\
  \ Linux 系统内存中的终端会话。与其为 PC 连接多个哑 终端（dumb terminals），大多数 Linux 发行版会启动七个（有时更多）虚拟控制台，你可以通过单个\
  \ PC 键盘和显示器访问它们。\n\n在大多数 Linux 发行版中，你可以使用简单的按键组合访问虚拟控制台。通常，你需要按住 `Ctl+Alt` 组合键，然后按下要使用的虚拟控制台的功能键（`F1`\
  \ 到 `F8`）。功能键 `F1` 生成虚拟控制台 1，键 `F2` 生成虚拟控制台 2，以此此类推。\n\n六个虚拟控制台使用全屏文本终端模拟器来显示文本登录界面，如图图\
  \ 2.2 所示。\n\n图 2.2 Linux 控制台登录界面\n\n![2.2](img/c02f002.jpg)\n\n使用用户 ID 和密码登录后，你将被带到\
  \ Linux bash shell CLI。在 Linux 控制台中，你没有运行任何图形化程序的能力。你只能使用文本程序将其显示在 Linux 文本控制台上。\n\
  \n登录到虚拟控制台后，你可以保持其活动状态并切换到另一个虚拟控制台，而不会丢失活动会话。你可以在所有虚拟控制台之间切换，同时运行多个活动会话。\n\n第一个或最后两个虚拟控制台通常为\
  \ X Window 图形桌面预留。某些发行版只分配一个，因此你可能需要测试所有的 `Ctl+Alt+F1`、`Ctl+Alt+F7` 和 `Ctl+Alt+F8`\
  \ 以查看你的特定发行版使用的是哪一个。大多数发行版在启动序列完成后会自动切换到图形化虚拟控制台之一，提供完整的图形化登录和桌面体验。\n\n登录到文本虚拟终端会话然后切换到图形会话可能会很枯燥。幸运的是，在\
  \ Linux 的图形模式和文本模式之间跳转有一个更好的方法：终端模拟包是从图形桌面会话内部访问 shell CLI 的流行方式。接下来的章节描述了在图形窗口中提供终端模拟的最常见软件包。\n\
  \n## xterm 终端\n\nX Window 终端模拟包中最旧且最基础的是 `xterm`。`xterm` 包自 X Window 的原始时代以来一直存在，并默认包含在大多数\
  \ X Window 软件包中。\n\n`xterm` 包提供了基础的 VT102/220 终端模拟 CLI 和图形化的 Tektronix 4014 环境（类似于\
  \ 4010 环境）。虽然 `xterm` 是一个完整的终端模拟包，但它运行并不需要大量资源（如内存）。正因为如此，`xterm` 包在设计用于在旧版硬件上运行的\
  \ Linux 发行版中仍然流行。某些图形化桌面环境（如 `fluxbox`）使用它作为默认的终端模拟包。\n\n虽然 `xterm` 包没有提供许多花哨的功能，但它在一件事上做得非常好，那就是模拟\
  \ VT220 终端。较新版本的 `xterm` 甚至模拟了 VT 系列颜色控制代码，允许你在脚本中使用颜色。\n\n图 2.3 显示了在图形化 Linux 桌面上运行的基础\
  \ `xterm` 显示界的样子。\n\n图 2.3 基础 xterm 显示\n\n![2.3](img/c02f003.jpg)\n\n`xterm` 包允许你通过命令行参数和一系列四个简单的图形菜单来设置单个功能。接下来的章节将讨论这些功能以及如何更改它们。\n\
  \n### 命令行参数\n\n`xterm` 命令行参数列表非常详尽。你有许多可以控制的特性来定制终端模拟功能，例如启用或禁用单个 VT 模拟。\n\n`xterm`\
  \ 命令行参数使用加号（`+`）和减号（`-`）符号表示特如何设置。加号表示该功能应恢复到默认设置。减号表示你正在将该功能设置为非默认值。表 2.2 列出了你可以使用命令行参数设置的一些较常见的功能。\n\
  \n表 2.2 xterm 命令行参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| 132 | 默认情况下，xterm 不允许每行 132\
  \ 个字符模式。 |\n| ah | 始终高亮文本光标。 |\n| aw | 启用自动换行。 |\n| bc | 启用文本光标闪烁。 |\n| bg color\
  \ | 指定背景使用的颜色。 |\n| cm | 禁用 ANSI 颜色变化控制代码的识别。 |\n| fb font | 指定粗体文本使用的字体。 |\n| fg\
  \ color | 指定前景文本使用的颜色。 |\n| fn font | 指定文本使用的字体。 |\n| fw font | 指定宽字体文本使用的字体。 |\n\
  | hc color | 指定高亮文本使用的颜色。 |\n| j | 使用跳跃滚动，一次滚动多行。 |\n| l | 启用将屏幕数据记录到文件中。 |\n| lf\
  \ filename | 指定用于屏幕日志的文件名。 |\n| mb | 当光标到达行尾时响起边距铃。 |\n| ms color | 指定文本光标使用的颜色。\
  \ |\n| name name | 指定出现在标题栏的应用程序名称。 |\n| rv | 通过交换背景色和前景色启用反转视频。 |\n| sb | 使用侧边滚动条允许滚动保存的滚动数据。\
  \ |\n| t | 以 Tektronix 模式启动 xterm。 |\n| tb | 指定 xterm 应在顶部显示工具栏。 |\n\n需要注意的是，并不是所有的\
  \ `xterm` 实现都支持所有这些命令行参数。你可以在系统上启动 `xterm` 时使用 `-help` 参数来确定你的 `xterm` 实现了哪些参数。\n\
  \n### xterm 主菜单\n\n`xterm` 主菜单包含同时适用于 VT102 和 Tektronix 窗口的配置项。在 x 会话窗口中，你可以通过按住\
  \ `Ctrl` 键并点击一次鼠标按钮（右鼠标的左键，或左鼠标的右键）来访问主菜单。图 2.4 显示了 xterm 主菜单的样子。\n\n图 2.4 xterm\
  \ 主菜单\n\n![2.4](img/c02f004.jpg)\n\nxterm 菜单有四个部分，如后续章节所述。\n\n#### X 事件命令\n\nX 事件命令部分包含允许你管理\
  \ xterm 如何与 X Window 显示交互的特性。\n\n- **工具栏 (Toolbar)**：如果 xterm 安装支持工具栏，此项将启用或禁用 xterm\
  \ 窗口中的工具栏显示（与 `tb` 命令行参数相同）。\n- **安全键盘 (Secure Keyboard)**：将键盘输入限制在特定的 xterm 窗口。这在输入密码时有用，可以确保它们不会被其他窗口拦截。\n\
  - **允许发送事件 (Allow SendEvents)**：允许其他 X Window 生成的 X 事件被 xterm 窗口接受。\n- **重绘窗口 (Redraw\
  \ Window)**：指示 X Window 刷新 xterm 窗口。\n\n再次，所有这些特性可能并不由你特定的 xterm 实现支持。如果不支持，它们在菜单中将显示为灰色。\n\
  \n#### 输出捕获\n\n`xterm` 包允许你捕获窗口显示的数据并将其记录到文件中或发送到 X Window 中定义的默认打印机。此部分出现的特性有：\n\
  \n- **记录到文件 (Log to file)**：将 xterm 窗口显示的所有数据发送到文本文件。\n- **打印窗口 (Print window)**：将当前窗口显示的所有数据发送到默认\
  \ X Window 打印机。\n\n\n\n\n\n*   重定向到打印机：同时将 `xterm` 窗口中显示的所有数据也发送到默认的 X Window 打印机。必须关闭此功能以停止打印数据。\n\
  \n如果你在显示区域使用了图形字符或控制字符（例如彩色文本），捕获功能可能会混乱。发送到显示器的所有字符（包括控制字符）都会存储在日志文件中或发送到打印机。\n\
  \n`xterm` 打印功能假设你已经在 X Window 系统中定义了打印机。如果你没有定义打印机，该功能在菜单中将显示为灰色状态。\n\n## 键盘设置\n\
  \n键盘设置部分包含允许你自定义 `xterm` 如何向主机系统发送键盘字符的功能。\n\n*   8 位控制：发送在 `VT220` 终端中使用的 8 位控制码，而不是\
  \ 7 位 ASCII 控制码。\n*   向左箭头键（Back arrow key）：在向左箭头键上发送退格字符（backspace）或删除字符（delete）之间切换。\n\
  *   Alt/Numlock 修饰键：控制 `Alt` 或 `Numlock` 键是否改变 PC 数字小键盘的行为。\n*   Alt 发送 Escape：`Alt`\
  \ 键连同按下的其他键一起发送 Escape 控制码。\n*   Meta 发送 Escape：控制功能键是否发送一个包含 Escape 控制码的双字符控制码。\n\
  *   Delete 为 DEL：PC Delete 键发送删除字符而不是退格字符。\n*   旧版功能键：PC 功能键模拟 `DEC VT100` 功能键。\n\
  *   Termcap 功能键：PC 功能键模拟 `Berkley Unix Termcap` 功能键。\n*   Sun 功能键：PC 功能键模拟 `Sun\
  \ Workstation` 功能键。\n*   VT220 键盘：PC 功能键模拟 `DEC VT220` 功能键。\n\n如你所见，设置键盘偏好通常取决于你所工作的特定应用程序和/或环境。这还涉及到相当多的个人偏好。通常，这取决于哪种键盘设置对你最有效。\n\
  \n## VT 选项菜单\n\nVT 选项菜单设置 `xterm` 在 `VT102` 仿真使用的功能。你通过按住 `Control` 键并点击鼠标第二个键来访问\
  \ VT 选项菜单。通常，鼠标第二个键是中间键。如果你使用的是双键鼠标，大多数 Linux X Window 配置会在同时点击左键和右键时模拟中间键。图 2.5\
  \ 显示了 VT 选项菜单的样子。\n\n图 2.5 xterm VT 选项菜单\n\n![2.5](img/c02f005.jpg)\n\n如从 图 2.5\
  \ 中看到的，许多你可以从命令行参数设置的 VT 功能也可以从 VT 选项菜单中进行设置。这产生了一份相当大的可用选项列表。VT 选项分为三组命令，在接下来的章节中描述。\n\
  \n### VT 功能\n\nVT 功能命令用于更改 `xterm` 实现 `VT102/220` 仿真的方式。它们包括：\n\n*   启用滚动条\n*  \
  \ 启用跳转滚动条\n*   启用反显视频\n*   启用自动换行\n*   启用反向换行\n*   启用自动行进\n*   启用应用程序光标\n*   启用应用程序数字键盘\n\
  *   按键时滚动到底部\n*   TTY 输出时滚动到底部\n*   允许 80/132 列切换\n*   选择到剪贴板\n*   启用视觉铃声\n*   启用铃声紧急\n\
  *   铃声时弹出\n*   启用光标闪烁\n*   启用备屏幕切换\n*   启用活动图标\n\n你可以通过点击菜单中的功能来启用或禁用这些功能。已启用的功能旁边会有一个勾标记。\n\
  \n### VT 命令\n\nVT 命令部分向 `xterm` 仿真窗口发送特定的重置命令。它们包括：\n\n*   执行软重置（Soft Reset）\n*\
  \   执行全重置（Full Reset）\n*   重置并清除已保存行\n\n软重置发送控制代码来重置屏幕区域。如果程序错误设置了滚动区域，这将非常方便。全重置会清除屏幕、重置任何设置的制位符，并重置会话期间设置的任何终端模式功能到初始状态。重置并清除已保存行命令执行全重置，还会清除滚动区域历史文件。\n\
  \n### 当前屏幕命令\n\n当前屏幕命令部分向 `xterm` 仿真器发送命令，影响哪个屏幕是当前活动屏幕。\n\n*   显示 Tek 窗口：显示 Tektronix\
  \ 终端窗口以及 `VT100` 终端窗口。\n*   切换到 Tek 窗口：隐藏 `VT100` 终端窗口并显示 Tektronix 终端窗口。\n*   隐藏\
  \ VT 窗口：在显示 Tektronix 窗口的同时隐藏 `VT100` 终端窗口。\n*   显示备屏幕：显示当前存储在 `VT100` 备屏幕区域的数据。\n\
  \n`xterm` 终端仿真器提供了以 `VT100` 终端模式（默认）或 Tektronix 终端模式（使用 `t` 命令行参数）启动的能力。启动后，你可以使用此菜单区域在会话期间切换到另一种模式。\n\
  \n## VT 字体菜单\n\nVT 字体菜单设置 `VT100/220` 仿真窗口使用的字体样式。你可以通过按住 `Control` 键并点击鼠标三键（右手鼠标的右键，或左手鼠标的左键）来访问此菜单。图\
  \ 2.6 显示了 VT 字体菜单的样子。\n\n![2.6](img/c02f006.jpg)\n\n后续章节将介绍 VT 字体菜单包含三个三个部分。\n\n\
  ### 设置字体\n\n这些菜单选项设置 `xterm` 窗口使用的字体大小。可用尺寸有：\n\n*   默认 (Default)\n*   不可读 (Unreadable)\n\
  *   极小 (Tiny)\n*   小 (Small)\n*   中 (Medium)\n*   大 (Large)\n*   巨大 (Huge)\n*  \
  \ 转义序列 (Escape Sequence)\n*   选择 (Selection)\n\n默认字体用于在当前 X Window 帧中显示文本的标准尺寸字体。不可读字体如其名，它将\
  \ `xterm` 窗口缩小到无法真正使用的尺寸。然而，当你想要在桌面桌面上最小化窗口而不完全在系统中最小化它时，这非常有用。大字体和巨大字体选项为视障用户提供了极大的字体尺寸。\n\
  \n`Escape Sequence` 选项将字体设置为 `VT100` 设置字体控制码上次设置的字体。`Selection` 选项允许你使用特殊的字体名称保存当前字体。\n\
  \n### 显示字体\n\n此菜单选项定义了创建文本时使用的字符类型。有三个选项：\n\n*   线条绘制字符 (Line Drawing Characters)：告诉\
  \ Linux 系统产生 ANSI 图形线条，而不是使用所选字体中的线条字符。\n*   紧凑字体 (Packed Font)：告诉 Linux 系统使用紧凑字体。\n\
  *   双倍大小字符 (Doublesized characters)：告诉 Linux 系统将设置的字体按正常尺寸的两倍放大。\n\n线条字符允许你决定在文本模式下绘图时使用什么类型的图形特征。你可以使用所选字体源提供的字符，也可以使用\
  \ `DEC VT100` 控制码提供的字符。\n\n### 指定字体\n\n菜单部分提供了用于创建字符的字体类型选项：\n\n*   TrueType 字体\n\
  *   UTF-8 字体\n*   UTF-8 标题\n\nTrueType 字体在图形环境中非常流行。每个字符不再在行中占据相同的空间，而是根据其自然大小按比例分布。因此，字母\
  \ `i` 在行中占据的空间比字母 `m` 少。UTF-8 字体允许在使用不支持外国字符的应用程序临时切换到 Unicode 字符集。`Titles` 选项允许使用\
  \ UTF-8 编码 `xterm` 窗口标题。\n\n## Konsole 终端\n\n\n\n\n\nKDE 桌面项目创建了一个名为 `Konsole` 的自定义终端仿真包。`Konsole`\
  \ 包整合了基础的 `xterm` 功能，以及我们现在在 Windows 应用程序中期望的更高级的功能。本节描述了 `Konsole` 终端的功能，并展示了如何使用它们。\n\
  \n### 命令行参数\n\nLinux 发行版通常提供一种直接从图形桌面菜单系统启动应用程序的方法。如果你的发行版没有提供此功能，你可以使用以下格式手动启动\
  \ `Konsole`：\n\n`konsole parameters`\n\n就像 `xterm` 一样，`Konsole` 包使用命令行参数来设置新会话中的功能。[表\
  \ 2.3] 显示了可用的 `Konsole` 命令行参数。\n\n### 表 2.3 Konsole 命令行参数\n\n| 参数 | 描述 |\n| :---\
  \ | :--- |\n| -e command | 执行命令而非 shell。 |\n| --keytab file | 使用指定的密钥文件定义按键映射。 |\n\
  | `--keytabs` | 列出所有可用的密钥。 |\n| `--ls` | 使用登录界面启动 `Konsole` 会话。 |\n| `--name name`\
  \ | 设置在 `Konsole` 标题栏中显示的名称。 |\n| `--noclose` | 防止在最后一个会话关闭时关闭 `Konsole` 窗口。 |\n\
  | `--noframe` | 不带框架启动 `Konsole`。 |\n| `--nohist` | 防止 `Konsole` 在会话中保存滚动历史。 |\n\
  | `--nomenubar` | 不带标准菜单栏选项启动 `Konsole`。 |\n| `--noresize` | 防止更改 `Konsole` 窗口区域的大小。\
  \ |\n| `--notabbar` | 不带标准会话标签区域启动 `Konsole`。 |\n| `--noxft` | 不支持较小字体别名启动 `Konsole`。\
  \ |\n| `--profile file` | 使用指定文件中保存的设置启动 `Konsole`。 |\n| `--profiles` | 列出所有可用的\
  \ `Konsole` 配置（profiles）。 |\n| `--schema name` | 使用指定的方案名称或文件启动 `Konsole`。 |\n|\
  \ `--schemata` | 列出 `Konsole` 中可用的方案。 |\n| -T title | 设置 `Konsole` 窗口标题。 |\n| `--type\
  \ type` | 使用指定的类型启动 `Konsole` 会话。 |\n| `--types` | 列出所有可用的 `Konsole` 会话类型。 |\n|\
  \ `--vt_sz CxL` | 指定终端列 (C) 和行 (L)。 |\n| `--workdir dir` | 指定 `Konsole` 存储临时文件的工作目录。\
  \ |\n\n## 标签窗口会话\n\n当你启动 `Konsole` 时，你会发现它有一个标签页窗口，其中一个标签打开着一个终端仿真会话。这是默认的标签窗口会话，通常是一个标准的\
  \ `bash` shell 命令行界面。`Konsole` 允许你同时激活多个标签。标签放置在窗口区域的顶部或底部，允许你轻松地在会话之间切换。这对于需要在一个标签中编辑代码，而在另一个标签窗口中测试代码的程序员来说，是一个非常棒的功能。在\
  \ `Konsole` 的不同活动标签之间来回切换非常简单。[图 2.7] 显示了一个带有三个活动标签的 `Konsole` 窗口。\n\n![2.7](img/c02f007.jpg)\n\
  具有三个活动会话的 Konsole 终端仿真器\n\n与 `xterm` 终端仿真器类似，`Konsole` 通过在活动标签区域右键点击提供简单的菜单。如果你在标签区域右键点击，会出现包含以下选项的菜单：\n\
  \n*   `Copy`: 将选中的文本复制到剪贴板。\n*   `Paste`: 将剪贴板的内容粘贴到选定区域。\n*   `Clear Scrollback\
  \ & Reset`: 清空当前标签的所有文本并重置终端。\n*   `Open File Manager`: 在当前工作目录打开 KDE 默认文件管理器 `Dolphin`。\n\
  *   `Change Profile`: 更改当前标签的配置。\n*   `Edit Current Profile`: 编辑当前标签的配置。\n*   `Show\
  \ Menu Bar`: 切换菜单栏显示的的开启/关闭。\n*   `Character Encoding`: 选择用于发送和显示字符的字符集。\n*   `Close\
  \ Tab`: 终止标签窗口会话。如果它是 `Konsole` 窗口中的最后一个标签，`Konsole` 将关闭。\n\n`Konsole` 还提供了另一种快速访问新标签菜单的方法——通过按住\
  \ `Ctrl` 键并在标签区域右键点击。\n\n在修改标签窗口后，你可以可以使用配置（profile）保留这些修改以便以后使用。\n\n## 配置 (Profiles)\n\
  \n`Konsole` 提供了一种名为配置的强大方法，用于保存和重用标签页会话的设置。当你第一次启动 `Konsole` 时，标签会话的设置将从默认配置 `Shell`\
  \ 中读取。这些设置包含诸如使用什么 shell、颜色方案等项目。一旦你修改了当前的标签会话，就可以将这些修改保存为新配置。此功能允许多个标签设置，例如使用与\
  \ `bash` 不同 shell 的标签会话。\n\n配置也可以用于自动执行单调的任务，例如登录另一个系统。你可以定义许多配置，并在每个打开的标签会话中使用不同的配置。要创建新配置，可以使用之前在简单\
  \ `Konsole` 菜单中描述的 `Edit Current Profile` 设置。要将当前配置切换到另一个配置，请使用 `Change Profile`。\n\
  \n`Konsole` 简单菜单可以帮助你查看和更改选项。\n\n默认情况下，`Konsole` 使用菜单栏提供功能，以便修改标签和配置。\n\n## 菜单栏\n\
  \n菜单栏提供了一种方法，允许你查看标签和配置。菜单栏包含以下项：\n\n#### 文件 (File)\n\n`File` 菜单项提供了在当前窗口或新窗口中启动标签的功能。它包含：\n\
  \n*   `New Tab`: 使用默认配置 `Shell` 在当前窗口中启动新标签。\n*   `New Window`: 启动一个带有新标签的终端窗口。\n\
  *   `List of profiles`: 在当前标签中切换到定义的配置。\n*   `Open File Manager`: 在当前工作目录打开文件管理器。\n\
  *   `Close Tab`: 关闭当前标签。\n*   `Quit`: 退出 `Konsole`。\n\n当你首次启动 `Konsole` 时，`List\
  \ of profiles` 中只有 `Shell`。随着更多配置的创建和保存，它们的名称将列表中。\n\n#### 编辑 (Edit)\n\n`Edit` 菜单栏提供了处理会话文本的选项以及一些额外选项：\n\
  \n*   `Copy`: 将选中的文本复制到系统剪贴板。\n*   `Paste`: 将系统剪贴板的内容粘贴到当前光标位置。如果文本包含换行符，它们将由 `shell`\
  \ 处理。\n*   `Rename Tab`: 修改标签名称。除了文本外，还可以以下标记：\n    *   `%#`—会话号\n    *   `%D`—当前目录（绝对路径）\n\
  \    *   `%d`—当前目录（相对路径）\n    *   `%n`—程序名\n    *   `%u`—用户名\n    *   `%w`—Shell\
  \ 设置的标题\n*   `Copy Input To`: 将当前标签中的输入文本发送到一个或多个标签。\n*   `ZModem Upload`: 使用 ZModem\
  \ 协议上传文件。\n*   `Clear and Reset`: 发送控制代码重置终端仿真器，并清除当前会话窗口。\n\n### 查看 (View)\n\n\
  `View` 菜单项包含控制 `Konsole` 窗口中单个会话的项目。这些选择包括：\n\n*   `Split View`: 控制当前终端仿真窗口内的显示。视图可以通过以下方式修改：\n\
  \    *   `Split View Left/Right`: 将当前显示左右拆分为两个相同的屏幕\n\n\n\n\n\n## 分屏视图\n\n-   **分屏上/下**：将当前显示区域分为两个相同的屏幕，一个堆叠在另一个上面。\n\
  -   **关闭活动**：将当前的拆分终端窗口合并回单个窗口。\n-   **关闭其他**：将非当前的拆分终端窗口合并回单个窗口。\n-   **展开视图**：调整终端窗口的活动拆分部分，以占据更多的显示窗口。\n\
  -   **缩小视图**：调整终端窗口的活动拆分部分，以占据较少的显示窗口。\n-   **分离视图**：将当前标签页从 `Konsole` 窗口中移除，并使用当前标签页启动一个新的\
  \ `Konsole` 窗口。这在打开了多个活动标签页时可用。\n-   **显示菜单栏**：开启/关闭菜单栏的显示。\n-   **全屏模式**：开启/关闭终端窗口填充整个显示器区域。\n\
  -   **静默监控**：当标签页在 10 秒内没有新文本时，切换特殊图标的显示/隐藏。这允许你在等待应用程序输出停止（例如编译大型应用程序时）期间切换到另一个标签页。\n\
  -   **活动监控**：当标签页中出现新文本时，切换特殊图标的显示/隐藏。这允许你在等待应用程序输出时切换到另一个标签页。\n-   **字符编码**：选择用于发送和显示字符的字符集。\n\
  -   **增大字体大小**：增大字体的大小。\n-   **减小字体大小**：减小字体的大小。\n\n`Konsole` 中的 `Split View` 选项将保持分屏视图中打开的标签页数量。例如，如果你在终端窗口中有三个标签页并拆分视图，则每个视图将有三个标签页。\n\
  \n## 回滚历史\n\n`Konsole` 为每个标签页保留了一个历史区域，正式称为回滚缓冲区（scrollback buffer）。历史区域包含了超出终端模拟器可视区域的行的输出文本。默认情况下，回滚缓冲区中保留最后\
  \ 1,000 行输出。`Scrollback` 菜单提供了审阅此缓冲器的各种选项。\n\n-   **搜索输出**：在当前标签页底部打开一个对话框。`Find`\
  \ 对话框允许 `Konsole` 在滚动缓冲区中搜索特定文本。它具有大小写、正则表达式和搜索方向的选项。\n-   **查找下一个**：在回滚缓冲区较新的历史中查找下一个文本匹配。\n\
  -   **查找上一个**：在回滚缓冲区更久远的历史中查找下一个文本匹配。\n-   **保存输出**：将回滚缓冲区的内容保存为文本文件或 HTML 文件。\n\
  -   **回滚选项**：控制回滚缓冲区的活动。可修改的：\n    -   **无回滚**：禁用回滚缓冲区。\n    -   **固定回滚**：设置回滚缓冲区的大小（行数）。默认为\
  \ 1,000 行。\n    -   **无限回滚**：允许在回滚缓冲区中存储无限量的行。\n    -   **保存到当前配置**：将回滚缓冲区选项保存到当前配置设置中。\n\
  -   **清除回滚并重置**：移除回滚缓冲区的内容并重置终端窗口。\n\n你可以通过可视区域中的滚动条滚动回滚缓冲区，或者通过按 `Shift` 键和 `向上箭头`逐行滚动，或按\
  \ `Page Up` 键按页（24 行）滚动。\n\n## 书签\n\n`Bookmarks` 菜单项提供了一种管理在 `Konsole` 窗口中设置的书签的方法。书签允许你保存活动会话中的目录位置，然后在相同会话或新会话中轻松返回那里。你是否曾在在\
  \ Linux 系统上深入好几级目录寻找某个东西，退出后就忘记是怎么进入那里的？书签将解决这个问题。当你到达所需的目录位置时，只需添加新书签。当你想返回时，查看\
  \ `Bookmarks` 中的你的新书签，它将自动为你执行目标位置的跳转。书签条目包括：\n\n-   **添加书签**：在当前目录位置创建新书签。\n- \
  \  **将标签页作为文件夹**：为所有当前终端窗口标签页创建一个书签。\n-   **新建书签文件夹**：为书签创建一个新的存储文件夹。\n-   **编辑书签**：编辑现有的书签。\n\
  -   **你的书签列表**：你创建的所有书签。\n\n`Konsole` 中可以存储的书签数量没有限制，但拥有大量书签可能会导致困惑。默认情况下，它们都显示在书签区域的同一层。你可以通过创建新的书签文件夹并使用\
  \ `Edit Bookmarks` 项将单个书签移动到新文件夹来组织它们。\n\n## 设置\n\n`Settings` 菜单栏区域允许你自定义和管理配置（profiles），并为当前标签页会话添加功能。此区域包括：\n\
  \n-   **更改配置**：为当前标签页应用选定的配置。\n-   **编辑当前配置**：打开对话框，可以在其中更改各种配置设置。\n-   **管理配置**：允许将特定配置设置为默认配置，并允许创建和删除配置。还管理配置在文件菜单中顺序。\n\
  -   **配置快捷键**：为 `Konsole` 命令创建键盘快捷键。\n-   **配置通知**：为特定的会话事件设置操作。\n-   **配置 Konsole**：创建自定义的\
  \ `Konsole` Schema 和会话。\n\n`Configure Notifications` 区域非常酷。它允许将会话中可能五个特定事件与六种不同的操作关联。当发生其中一个事件时，将执行定义的操作（或多个操作）。\n\
  \n`Edit Current Profile` 设置是一个强大的工具，提供了对配置功能的高级控制。此对话框提供了一种创建和保存各种配置以备以后使用的方法。图\
  \ 2.8 显示了主编辑当前配置对话框。\n\n图 2.8 Konsole 编辑当前配置对话框\n\n![2.8](img/c02f008.jpg)\n\n在\
  \ `Edit Current Profile` 对话框中有六个标签区域：\n\n-   **通用 (General)**：允许你设置配置的名称、图标、初始文件系统目录等。你还可以指定打开标签页时要执行的命令。这通常指向\
  \ `bash` shell，`/bin/bash`，但也可以经常使用的 shell 命令，如 `top`。\n-   **标签页 (Tabs)**：定义标签页的标题格式和标签栏的位置。\n\
  -   **外观 (Appearance)**：标签的颜色方案和字体设置在此窗口中。\n-   **滚动 (Scrolling)**：包含的设置回滚缓冲区的大小和滚动条在窗口中的位置。\n\
  -   **输入 (Input)**：键绑定，即按下某些组合键时发送到终端模拟器的字符在此设置。\n-   **高级 (Advanced)**：允许在此窗口中配置若干设置。它们包括终端功能、字符编码、鼠标交互和光标功能。\n\
  \n## 帮助\n\n`Help` 菜单项提供了完整的 `Konsole` 手（如果你的 Linux 发行版安装了 KDE 手册）、每次启动 `Konsole`\
  \ 时显示有趣的未知快捷键和提示的“每日提示”功能，以及标准的关于 Konsole 对话框。\n\n## GNOME Terminal\n\n正如预期的那样，GNOME\
  \ 桌面项目有自己的终端模拟程序。`GNOME Terminal` 软件包具有许多与 `Konsole` 相同的功能。本节将介绍 GNOME Terminal\
  \ 的各个部分。\n\n### 命令行参数\n\n`GNOME Terminal` 应用程序提供了丰富的命令行参数，允许你控制启动它时 GNOME 的行为。表\
  \ 2.4 列出了可用的参数。\n\n\n\n\n\n| 参数 | 说明 |\n| - | - |\n| `-e command` | 在默认终端窗口中执行参数。\
  \ |\n| `-x` | 在默认终端窗口中执行此参数之后命令行的全部内容。 |\n| `--window` | 使用默认终端窗口打开一个新窗口。你可以添加多个\
  \ `--window` 参数来启动多个窗口。 |\n| `--window-with-profile=` | 使用指定的配置打开一个新窗口。你也可以在命令行中多次添加此参数。\
  \ |\n| `--tab` | 在最后打开的终端窗口内打开一个新的标签页终端。 |\n| `--tab-with-profile=` | 使用指定的配置在最后打开的终端窗口内打开一个新的标签页终端。\
  \ |\n| `--role=` | 为上一个指定的窗口设置角色。 |\n| `--show-menubar` | 显示终端窗口顶部的菜单栏。 |\n| `--hide-menubar`\
  \ | 禁用终端窗口顶部的菜单栏。 |\n| `--full-screen` | 全最大化显示终端窗口。 |\n| `--geometry=` | 指定 X Window\
  \ 几何参数。 |\n| `--disable-factory` | 不注册激活名称服务器。 |\n| `--use-factory` | 注册到激活名称服务器。\
  \ |\n| `--startup-id=` | 设置 Linux 启动通知协议的 ID。 |\n| `-t, --title=` | 设置终端窗口的标题。 |\n\
  | `--working-directory=` | 设置终端窗口的默认工作目录。 |\n| `--zoom=` | 设置终端的缩放因子。 |\n| `--active`\
  \ | 将上一个指定的终端标签页设置为活动标签。 |\n\nGNOME Terminal 命令行参数允许你在 GNOME Terminal 启动时自动设置许多功能。不过，你也可以在\
  \ GNOME Terminal 启动后在其窗口设置大部分这些功能。\n\n### 标签 (Tabs)\n\n与 Konsole 类似，GNOME Terminal\
  \ 将每个会话称为标签（tab），并使用标签来跟踪窗口内运行的多个会话。图 2.9 显示了一个带有三个活动会话标签的 GNOME Terminal 窗口。\n\n\
  图 2.9 具有三个活动会话的 GNOME Terminal\n\n![2.9](img/c02f009.jpg)\n\n你可以在标签窗口中点击右键来查看快速菜单。此快速菜单为你的标签会话提供了几个操作：\n\
  \n*   打开终端 (Open Terminal)：打开一个带有默认标签会话的新 GNOME Terminal 窗口。\n*   打开标签 (Open Tab)：在现有的\
  \ GNOME Terminal 窗口中打开一个新的会话标签页。\n*   关闭标签或关闭窗口 (Close Tab or Close Window)：如果打开了多个标签，则会显示\
  \ `关闭标签` 菜单选项，它会关闭当前会话标签。如果只打开了一个标签，则显示 `关闭窗口` 菜单选项，它会关闭 GNOME Terminal 窗口。\n* \
  \  复制 (Copy)：将当前会话标签页中的高亮文本复制到剪贴板。\n*   粘贴 (Paste)：将剪贴板中的数据粘贴到当前会话标签页的光的光标位置。\n\
  *   配置 (Profiles)：更改当前会话标签页的配置或编辑当前标签配置。\n*   显示菜单栏 (Show Menubar)：切换菜单栏的显示/隐藏。\n\
  *   输入法 (Input Methods)：允许你将当前输入法更改另一种字符转换法或完全关闭它。\n\n快速菜单可以方便访问终端窗口标准菜单栏中提供的常用操作。\n\
  \n### 菜单栏 (The Menu Bar)\n\nGNOME Terminal 的主要操作发生在菜单栏中。菜单栏包含了你所需的所有配置和自定义选项，让你的\
  \ GNOME Terminal 变成你想要的样子。以下章节描述了菜单栏中的不同项目。\n\n#### 文件 (File)\n\n文件菜单项包含创建和管理终端标签的项：\n\
  \n*   打开终端 (Open Terminal)：在新的 GNOME Terminal 窗口中启动新的 shell 会话。\n*   打开标签 (Open\
  \ Tab)：在现有的 GNOME Terminal 窗口的新标签页上启动新的 shell 会话。\n*   新建配置 (New Profile)：允许你自定义标签会话并将其保存为配置，供以后调回使用。\n\
  *   保存内容 (Save Contents)：将回滚缓冲区的内容保存到文本文件中。\n*   关闭标签 (Close Tab)：关闭窗口中的当前标签。\n\
  *   关闭窗口 (Close Window)：关闭 GNOME Terminal 会话，关闭所有活动标签。\n\n文件菜单中的大多数项也可以通过在会话标签区域点击右键可用。“新建配置”项允许你自定义会话标签设置并将其保存供以后使用。\n\
  \n“新建配置”首先要求你为新配置提供名称；然后生成如图 2.10 所示的编辑配置对话框。\n\n图 2.10 GNOME Terminal 编辑配置对话框\n\
  \n![2.10](img/c02f010.jpg)\n\n这是你可以为会话设置终端仿真区域。它由六个区域组成：\n\n*   通用 (General)：提供通用设置，如字体、铃声和菜单栏。\n\
  *   标题和命令 (Title and Command)：允许你为会话标签设置标题（显示在标签上），并决定会话是否随命令启动。\n*   颜色 (Colors)：设置会话标签的前景和背景颜色。\n\
  *   背景 (Background)：允许为会话设置背景图像，或使其透明以便看到桌面。\n*   滚动 (Scrolling)：控制是否创建滚动区域以及大小。\n\
  *   兼容性 (Compatibility)：允许设置退格键和删除键发送到系统的代码。\n\n一旦配置了配置，可以在打开新标签时指定。\n\n#### 编辑\
  \ (Edit)\n\n编辑菜单包含处理标签内文本的项。你可以使用鼠标在标签内复制和粘贴。这允许你将命令行输出复制到剪贴板并导入编辑器。你也可以将另一个应用程序的文本粘贴到会话标签中。\n\
  \n*   复制 (Copy)：将选中的文本复制到剪贴板。\n*   粘贴 (Paste)：将剪贴板中的文本粘贴到会话标签。\n*   全选 (Select All)：选择整个回滚缓冲区的内容。\n\
  *   配置 (Profiles)：在 GNOME Terminal 中添加、删除或修改配置。\n*   快捷键 (Keyboard Shortcuts)：创建组合键以快速访问\
  \ GNOME Terminal 功能。\n*   配置偏好 (Profile Preferences)：提供快速编辑当前会话使用的配置的方法。\n\n配置功能是一个非常强大的工具，用于自定义多个配置，并在切换会话时切换配置。\n\
  \n#### 视图 (View)\n\n视图菜单项包含控制会话标签窗口显示的项。它们包括：\n\n*   显示菜单栏 (Show Menubar)：切换菜单栏的显示/隐藏。\n\
  *   全屏 (Full Screen)：将 GNOME Terminal 窗口扩大到整个桌面。\n*   放大 (Zoom In)：增大标签窗口中的字体。\n\
  *   缩小 (Zoom Out)：减小标签窗口中的字体。\n*   标准大小 (Normal Size)：将标签字体恢复为默认大小。\n\n如果你隐藏了菜单栏，可以在任何会话标签中点击右键并切换“显示菜单栏”项来恢复它。\n\
  \n#### 终端 (Terminal)\n\n终端菜单项包含控制会话终端仿真功能的项。它们包括：\n\n*   更改配置 (Change Profile)：允许切换到会话标签中的另一个配置。\n\
  *   设置标题 (Set Title)：为会话标签设置标题以便于识别。\n*   设置字符编码 (Set Character Encoding)：选择用于发送和显示字符的字符集。\n\
  *   重置 (Reset)：向 Linux 系统发送重置代码。\n*   重置并清除 (Reset and Clear)：向 Linux 系统发送重置代码并清除标签区域当前显示的所有文本。\n\
  *   窗口大小列表 (Window Size List)：列出当前 GNOME 终端窗口可以调整的不同尺寸。选择一个大小，窗口将会自动调整尺寸。\n\n字符编码提供了大量可供选择的字符集。如果你必须使用英语以外的语言工作，这会非常方便。\n\
  \n\n\n\n标签页（Tabs）菜单项提供了控制标签页位置以及选择哪个标签页激活的项目。只有当你打开了多个标签页会话时，此菜单才会显示。\n\n- **下一个标签页\
  \ (Next Tab)**：使列表中的下一个标签激活。\n- **上一个标签页 (Previous Tab)**：使列表中的上一个标签激活。\n- **将标签向左移动\
  \ (Move Tab to the Left)**：将当前标签移动到上一个标签之前。\n- **将标签向右移动 (Move Tab to the Right)**：将当前标签移动到下一个标签之后。\n\
  - **分离标签页 (Detach Tab)**：移除该标签并使用该标签会话启动新的 GNOME Terminal 窗口。\n- **标签列表 (The Tab\
  \ list)**：列出终端窗口中当前运行的会话标签。选择一个标签即可跳转到该会话。\n\n此节允许你管理标签页，当你同时打开多个标签页时，这会非常有用。\n\n\
  ## 帮助 (Help)\n\n帮助菜单项提供了完整的 GNOME Terminal 手册，以便你可以研究 GNOME Terminal 中使用的各个项目和功能。\n\
  \n## 总结 (Summary)\n\n要开始学习 Linux 命令行，你需要访问命令行。在图形界面的世界里，这有时可能具有挑战性。本章讨论了当你尝试从图形桌面环境进入\
  \ Linux 命令行时应该考虑的不同事项。首先，本章涵盖了终端仿真，并展示了你应该了解哪些功能，以确保 Linux 系统能够与你的终端仿真包进行正常通信，并正确显示文本和图形。\n\
  \n特别是，本章节涵盖了三种不同类型的终端仿真器。`xterm` 终端仿真器包是第一个适用于 Linux 的程序。它仿真了 `VT102` 和 `Tektronix\
  \ 4014` 终端。KDE 桌面项目创建了 `Konsole` 终端仿真包。它提供了许多高级功能，例如在同一个窗口中使用多个会话（同时使用控制台和 `xterm`\
  \ 会话），并对终端仿真参数进行完全控制。\n\n最后，章节讨论了 GNOME 桌面项目的 `GNOME Terminal` 仿真包。`GNOME Terminal`\
  \ 也允许在单个窗口内开启多个终端会话；此外它还提供了设置许多终端功能的方便方法。\n\n在下一章中，你将开始学习 Linux 命令行。我将引导你学习用于在 Linux\
  \ 文件系统中导航，以及创建、删除和操作文件的命令。\n\n## 第 3 章：基础 bash Shell 命令\n\n### 本章内容\n\n- 启动 shell\n\
  - shell 提示符 (shell prompt)\n- bash 手册\n- 文件系统导航\n- 文件和目录列表\n- 文件处理\n- 目录处理\n- 查看文件内容\n\
  \n所有 Linux 发行版默认使用的 shell 是 `GNU bash` shell。本章将描述 `bash` shell 提供的基本功能，并引导你学习如何使用\
  \ `bash` shell 提供的基本命令与 Linux 文件和目录进行操作。如果你已经熟悉在 Linux 环境中处理文件和目录，可以随时跳过本章，继续阅读第\
  \ 4 章查看更高级的命令。\n\n### 启动 shell (Starting the Shell)\n\n`GNU bash` shell 是一个提供对 Linux\
  \ 系统交互式访问的程序。它作为一个普通程序运行，通常在用户登录终端时启动。系统启动的 shell 取决于你的用户 ID 配置。\n\n`/etc/passwd`\
  \ 文件包含了所有系统用户账户的列表，以及关于每个用户的的一些基本配置信息。以下是 `/etc/passwd` 文件中的一个示例条目：\n\n```\nrich:x:501:501:Rich\
  \ Blum:/home/rich:/bin/bash\n```\n\n每个条目有七个数据字段，每个字段由冒号分隔。系统使用这些字段中的数据为用户分配特定功能。这些字段是：\n\
  \n- 用户名\n- 用户密码（如果密码存储在另一个文件中，则为占位符）\n- 用户系统用户 ID 数字 (UID)\n- 用户系统组 ID 数字 (GID)\n\
  - 用户全名\n- 用户默认主目录\n- 用户默认 shell 程序\n\n这些大部分条目将在第 6 章中进行详细讨论。现在，只需注意指定的 shell 程序即可。\n\
  \n大多数 Linux 系统在为用户启动命令行界面（CLI）环境时使用默认的 `bash` shell 程序。`bash` 程序还使用命令行参数来修改你可以启动的\
  \ shell 类型。表 3.1 列出了 `bash` 中可用的定义使用何种类型 shell 的命令行参数。\n\n#### 表 3.1 bash 命令行参数\n\
  \n| 参数 |  |\n| :--- | :--- |\n| `-c string` | 从字符串中读取命令并处理它们。 |\n| `-r` | 启动受限 shell，限制用户位于默认目录。\
  \ |\n| `-i` | 启动交互式 shell，允许用户输入。 |\n| `-s` | 从标准输入读取命令。 |\n\n默认情况下，当 `bash` shell\
  \ 启动时，它会自动处理用户主目录下的 `.bashrc` 文件中的命令。许多 Linux 发行版还使用此文件加载一个包含系统内所有用户通用命令和设置的公共文件。该公共文件通常位于\
  \ `/etc/bashrc` 文件。该文件经常设置在各种应用程序使用的环境变量（见第 5 章）。\n\n### shell 提示符 (The Shell Prompt)\n\
  \n一旦你启动终端仿真包或从 Linux 控制台登录，你就可以访问 shell CLI 提示符。提示符是你通往 shell 的网关。这是你输入 shell 命令的地方。\n\
  \n`bash` shell 的默认提示符符号是美元符号（`$`）。该符号表示 shell 正在等待你输入文本。然而，你可以更改 shell 使用的提示符格式。不同的\
  \ Linux 发行版使用不同的提示符格式。在 Ubuntu Linux 系统上，`bash` shell 提示符看起来如下：\n\n```\nrich@user-desktop:∼$\n\
  ```\n\n在 Fedora Linux 系统上，它看起来如下：\n\n```\n[rich@testbox∼]$\n```\n\n你可以配置提示符来提供关于环境的基本信息。第一个示例显示了提示符中的三部分信息：\n\
  \n- 启动 shell 的用户名\n- 当前的虚拟控制台编号\n- 当前目录（波浪 `~` 是主目录的缩写）\n\n第二个示例提供了类似的信息，但它使用的是主机而不是虚拟控制台编号。有两个环境变量控制命令行提示符的格式：\n\
  \n- `PS1`：控制默认命令行提示符的格式\n- `PS2`：控制二级命令行提示符的格式。\n\nshell 使用默认的 `PS1` 提示符进行 shell\
  \ 的初始数据输入。如果你输入了一个需要额外信息的命令，shell 将显示由 `PS2` 环境变量指定的二级提示符。\n\n要显示你提示符的当前设置，请使用 `echo`\
  \ 命令：\n\n```\nrich@ user-desktop:∼$ echo $PS1\n${debian_chroot:+($debian_chroot)}\\\
  u@\\h:\\w\\$\n\nrich@ user-desktop:∼$ echo $PS2\n>\nrich@ user-desktop:∼$\n```\n\
  \n提示符环境变量的格式看起来可能很奇怪。shell 使用特殊字符来表示命令行提示符中的元素。表 3.2 显示了你可以在提示符字符串中特殊字符。\n\n####\
  \ 表 3.2 Bash shell 提示符字符\n\n| 字符 | 描述 |\n| :--- | :--- |\n| `\\a` | 响铃字符 |\n| `\\\
  d` | “月 月 日”格式的日期 |\n| `\\e` | ASCII 转义字符 |\n| `\\h` | 本地主机名 |\n| `\\H` | 完全域名主机名\
  \ |\n| `\\j` | 当前 shell 管理的作业数 |\n| `\\l` | shell 终端设备名称的基名 |\n| `\\n` | ASCII 换行字符\
  \ |\n| `\\r` | ASCII 回车符 |\n| `\\s` | shell 的名称 |\n| `\\t` | 24 小时制 HH:MM:SS 格式当前时间\
  \ |\n| `\\T` | 12 小时制 HH:MM:SS 格式当前时间 |\n| `\\@` | 12 小时制 am/pm 格式当前时间 |\n\n\n\n\
  \n\n| Symbol | Description |\n| :--- | :--- |\n| `\\u` | 当前用户的用户名 |\n| `\\v` | bash\
  \ shell 的版本 |\n| `\\V` | bash shell 的发布级别 |\n| `\\w` | 当前工作目录 |\n| `\\W` | 当前工作目录的基名\
  \ |\n| `\\!` | 该命令在 bash shell 历史中的编号 |\n| `\\#` | 该命令的编号 |\n| `\\$` | 普通用户时显示美元符号，根用户则显示井号\
  \ |\n| `\\nnn` | 与八进制值 nnn 对应的字符 |\n| `\\\\` | 反斜杠 |\n| `\\[` | 开始控制代码序列 |\n| `\\\
  ]` | 结束控制代码序列 |\n\n注意，所有的特殊提示符字符都以反斜杠（`\\`）开头。这用于在提示符中区分提示符字符和普通文本。在之前的示例中，提示符同时包含提示符字符和普通字符（“at”符号和方括号）。你可以在提示符中创建任何组合的提示符字符。要创建一个新的提示符，只需将新字符串分配给\
  \ `PS1` 变量：\n\n```\n[rich@testbox∼]$ PS1=\"[\\t][\\u]\\$ \"\n[14:40:32][rich]$\n\
  ```\n\n这个新的 shell 提示符现在显示当前时间以及用户名。新的 `PS1` 定义对当前 shell 会话有效。当你启动一个新的 shell 时，默认的\
  \ shell 提示符定义会被加载。在第 5 章中，你将看到如何更改所有 shell 会话的默认 shell 提示符。\n\n# bash 手册\n\n大多数\
  \ Linux 发行版都包含在线手册，用于查询 shell 命令以及包含该发行版中包含的许多其他 GNU 工具。熟悉手册是一个好主意，因为它对于操作工具是无价的，特别是当你试图弄各种命令行参数时。\n\
  \n`man` 命令提供了访问存储在 Linux 系统上的手册页的通道。输入 `man` 命令后跟特定的工具名称，即可提供该工具的手册条目。图 3.1 显示了查询\
  \ `date` 命令手册页的示例。\n\n图 3.1 显示 Linux date 命令的手册页\n\n![3.1](img/c03f001.jpg)\n\n\
  手册页将关于命令的信息分为不同的章节，显示在表 3.3 中。\n\n表 3.3 Linux man 手页格式\n\n| Section | Description\
  \ |\n| :--- | :--- |\n| Name (名称) | 显示命令名称和简短描述 |\n| Synopsis (摘要) | 显示命令的格式 |\n\
  | Description (描述) | 描述每个命令选项 |\n| Author (作者) | 提供开发命令的人员信息 |\n| Reporting bugs\
  \ (报告错误) | 提供报告发现的错误的信息 |\n| Copyright (版权) | 提供命令代码版权状态的信息 |\n| See Also (相关) |\
  \ 指向任何可用的类似命令 |\n\n你可以通过按空格键或使用方向键向前或向后滚动手册页文本来逐页查看手册（假设你的终端仿真包支持方向键功能）。完成手册页查看后，按\
  \ `q` 键退出。\n\n要查看有关 bash shell 的信息，请使用以下命令查看其手册页：\n\n```bash\nman bash\n```\n\n\
  这允许你逐页查看 bash shell 的所有手册页。在编写脚本时非常有用，因为你不需要回过头通过书籍或网站查找命令的特定格式。手册在你的会话中一直供你使用。\n\
  \n# 文件系统导航\n\n正如你从 shell 提示符中看到的，当你启动 shell 会话时，你通常被放置在主目录下。大多数情况下，你会希望离开主目录并探索\
  \ Linux 系统中的其他区域。本节描述了如何使用 shell 命令实现这一点。在此之前，让我们先俯览一下 Linux 文件系统的实际貌，这样我们就知道要去哪里了。\n\
  \n## Linux 文件系统\n\n如果你是 Linux 系统的新手，了解它的布局会有帮助。Linux 文件系统的棘手之处在于它不使用驱动器器。在 Windows\
  \ 中，你可能习惯看到 `C:\\Users\\Documents\\test.doc` 这样的路径。在 Linux 中，虚拟目录是一个单一结构。Linux PC\
  \ 中安装的第一块硬盘包含了虚拟目录的核心。其他一切都从那里构建。\n\n在根驱动器上，Linux 创建了称为挂载点的特殊目录。挂载点是虚拟目录中你用来分配额外存储设备的目录。虚拟目录使得文件和目录出现在这些挂载点目录中，尽管它们物理上存储在不同的驱动器上。\n\
  \n提示：你会发现 Linux 使用正斜杠（`/`）而不是反斜杠（`\\`）来表示路径中的目录。Linux 中的反斜杠字符表示转义字符，使用它时会引起各种问题。如果你是从\
  \ Windows 环境过来的，这可能需要一些适应。\n\n例如，Linux 路径 `/home/rich/Documents/test.doc` 仅表示文件\
  \ `test.doc` 位于 `home` 目录下的 `rich/Documents` 目录。它没有提供关于该文件存储在 PC 哪个物理磁盘的信息。\n\n\
  通常系统文件物理上存储在根驱动器上，而用户文件存储在不同的驱动器上，如图 3.2 所示。\n\n图 3.2 Linux 文件结构\n\n![3.2](img/c03f002.jpg)\n\
  \n在图 3.2 中，PC 上有两块硬盘。一块硬盘与虚拟目录的根相关（由单个正斜杠表示）。其他硬盘可以挂载到虚拟目录结构的任何位置。在例例中，第二块硬盘挂载在\
  \ `/home` 位置，那里是用户目录所在的位置。\n\n\n\n\n\nLinux 文件系统结构已经从 Unix 文件结构演变而来的。遗憾的是，多年来，不同版本的\
  \ Unix 使得 Unix 文件结构变得相当复杂。如今，似乎没有哪两个 Unix 或 Linux 系统遵循相同的文件系统结构。然而，有一些常见的目录名称被用于一些共同的功能。表\
  \ 3.4 列出了一些较为常见的 Linux 虚拟目录名。\n\n### 表 3.4 常见的 Linux 目录名\n\n| 目录 | 用途 |\n| :---\
  \ | :--- |\n| `/` | 虚拟目录的根目录。通常不在此放置文件。 |\n| `/bin` | 二进制目录，存储了许多 GNU 用户级实用程序。 |\n\
  | `/boot` | 启动目录，存储启动文件。 |\n| `/dev` | 设备目录，Linux 在此处创建设备节点。 |\n| `/etc` | 系统配置文件目录。\
  \ |\n| `/home` | 家目录，Linux 在此处创建用户目录。 |\n| `/lib` | 库目录，存储系统和应用程序库文件。 |\n| `/media`\
  \ | 媒体目录，用于可移动介质挂载点的常用位置。 |\n| `/mnt` | 挂载目录，另一个用于可移动介质挂载点的常用位置。 |\n| `/opt` | 可选目录，通常用于存储可选软件软件包。\
  \ |\n| `/root` | root 用户家目录。 |\n| `/sbin` | 系统二进制目录，存储了许多 GNU 管理员级实用程序。 |\n| `/tmp`\
  \ | 临时目录，可以在此处创建和删除临时工作文件。 |\n| `/usr` | 用户安装的软件目录。 |\n| `/var` | 变量目录，用于经常变化的文件，例如日志文件。\
  \ |\n\n当你启动一个新的 shell 提示符时，你的会话从家目录开始，该目录是分配给你用户账户的唯一目录。当你创建一个用户账户时，系统通常会为账户分配一个唯一的目录（见第\
  \ 6 章）。\n\n在 Windows 世界中，你可能习惯于使用图形化界面在目录结构中移动。要从 CLI 提示符在虚拟目录中移动，你需要学习使用 `cd` 命令。\n\
  \n## 遍历目录\n\n你使用切换目录命令（`cd`）将 shell 会话移动到 Linux 文件系统中的另一个目录。`cd` 命令的格式非常简单：\n\n\
  ```bash\ncd destination\n```\n\n`cd` 命令可能接受一个单一参数 `destination`，它指定了你想去的目录名称。如果你在\
  \ `cd` 命令中没有指定目标，它将带你回到你的家目录。\n\n然而，目标参数可以使用两种不同的方法表示：\n\n- 绝对路径\n- 相对路径\n\n接下来的章节将描述这两种方法之间的区别。\n\
  \n#### 绝对文件路径\n\n你可以使用绝对路径引用虚拟目录中的某个目录名。绝对路径精确地定义了该目录在虚拟目录结构中的位置，从虚拟目录的根目录开始，类似于目录的“全名”。\n\
  \n因此，要引用 `lib` 目录中的 `apache` 目录（而 `lib` 目录又位于 `usr` 目录中），你应该使用绝对路径：\n\n`/usr/lib/NetworkManager`\n\
  \n使用绝对路径，对于你想去的确切位置没有疑问。要使用绝对路径移动到文件系统中的特定位置，你只需要在 `cd` 命令中指定完整路径：\n\n```bash\n\
  rich@testbox[~]$cd /etc\nrich@testbox[etc]$\n```\n\n提示符显示执行 `cd` 命令后，shell 的新目录现在是\
  \ `/etc`。你可以使用绝对路径移动到整个 Linux 虚拟目录结构中的任何级别：\n\n```bash\nrich@testbox[~]$ cd /usr/lib/NetworkManager\n\
  rich@testbox[NetworkManager]$\n```\n\n然而，如果你只是在自己的家目录结构内工作，经常使用绝对路径可能会变得很费力。例如，如果你已经在\
  \ `/home/rich` 目录下了，为了进入你的 `Documents` 目录，输入以下命令似乎有些繁琐：\n\n```bash\ncd /home/rich/Documents\n\
  ```\n\n幸运的是，有一个更简单的解决方案。\n\n#### 相对文件路径\n\n相对路径允许你指定相对于当前位置的目标路径，而无需从根目录开始。相对路径不以表示根目录的正斜杠（`/`）开头。\n\
  \n相反，相对路径以目录名开头（如果你正在遍历到当前目录下的某个目录），或者以指示当前目录相对位置的特殊字符开头。用于此的两个特殊字符是：\n\n- 点（`.`）表示当前目录\n\
  - 双点（`..`）表示父目录\n\n在尝试遍历目录层次时，双点字符非常有用。例如，如果你在家目录下的 `Documents` 目录中，需要进入同样位于家目录下的\
  \ `Desktop` 目录，你可以这样做：\n\n```bash\nrich@testbox[Documents]$ cd ../Desktop\nrich@testbox[Desktop]$\n\
  ```\n\n双点字符将你带回上一级到你的家目录；然后 `/Desktop` 部分又会带你进入 `Desktop` 目录。你可以根据需要使用任意数量的双点字符来移动。例如，如果你在家目录（`/home/rich`）中并想去\
  \ `/etc` 目录，你可以输入以下内容：\n\n```bash\nrich@testbox[~]$ cd ../../etc\nrich@testbox[etc]$\n\
  ```\n\n当然在这种情况下，使用相对路径实际上需要你输入更多内容，而不是直接输入绝对路径 `/etc` 简直快得多！\n\n## 文件和目录列表\n\nshell\
  \ 最基本的功能是可以查看系统上有哪些文件。列表命令（`ls`）就是实现此点的工具。本节将描述 `ls` 命令以及所有用于格式化其可提供信息的选项。\n\n####\
  \ 基础列表\n\n`ls` 命令最基本的形式显示位于你当前目录下的文件和目录：\n\n```bash\n$ ls\n4rich  Desktop  Download\
  \  Music  Pictures  store      store.zip test\nbackup  Documents  Drivers  myprog\
  \  Public    store.sql  Templates  Videos\n```\n\n注意，`ls` 命令按字母顺序生成列表（按列而不是行）。如果你使用的是支持颜色的终端模拟器，`ls`\
  \ 命令可能还会以不同的颜色显示不同类型的条目。`LS_COLORS` 环境变量控制此功能。不同的 Linux 发行版根据终端模拟器的能力设置此环境变量。\n\n\
  如果你没有彩色的终端模拟器，可以使用 `-F` 参数配合 `ls` 命令来轻松区分文件和目录。使用 `-F` 参数产生如下输出：\n\n```bash\n$ ls\
  \ -F\n4rich/      Documents/  Music/    Public/   store.zip   Videos/\nbackup.zip\
  \  Download/  myprog*   store/      Templates/\nDesktop/  Drivers/  Pictures/  store.sql\
  \   test\n$\n```\n\n`-F` 参数现在为目录标记了正斜杠，以便在列表中识别它们。同样，它为可执行文件（如上面的 `myprog` 文件）标记了星号，帮助你更容易地找到可以在系统上运行的文件。\n\
  \n基础 `ls` 命令可能会具有误导性。它显示当前目录包含的文件和目录，但并不是所有的。Linux 经常使用隐藏文件来存储配置信息。在 Linux 中，隐藏文件是以点开头的文件名。这些文件不会出现在默认的\
  \ `ls` 列表中（因此它们被称为隐藏文件）。\n\n要与普通文件和目录一起显示隐藏文件，请使用 `-a` 参数。图 3.3 显示了使用 `-a` 参数配合\
  \ `ls` 命令的示例。\n\n\n\n\n哇，这差别可真大了。在一个从图形化桌面登录系统的用户主目录中，你会看到很多隐藏的配置文件。这个特定示例来自一个登录\
  \ GNOME 桌面会话的用户。还要注意，有三个以 `.bash` 开头的文件。这些文件是 `bash` 解释器环境使用的隐藏文件。这些功能将在第 5 章中详细介绍。\n\
  \n`-R` 参数是 `ls` 命令可以使用的另一个选项。它会显示当前目录下各个目录中所包含的文件。如果你有很多目录，这可能会是一个非常长的列表。这里是 `-R`\
  \ 参数产生的一个简单示例：\n\n```\n$ ls -F -R\n\n.:\n\nfile1 test1/  test2/\n\n./test1:\n\n\
  myprog1*  myprog2*\n\n./test2:\n\n$\n```\n\n注意，首先，`-R` 参数显示当前目录的内容，包含一个文件（`file1`）两个目录（`test1`\
  \ 和 `test2`）。随后，`-R` 遍历这两个目录中的每一个，显示每个目录是否包含任何文件。`test1` 目录显示两个文件（`myprog1` 和 `myprog2`），而\
  \ `test2` 目录不包含任何文件。如果 `test1` 或 `test2` 目录中有进一步的子目录，`-R` 参数将继续遍历它们。如你所见，对于大型目录结构，这可能会变成一个巨大的输出列表。\n\
  \n### 修改显示信息\n\n正如你在基础列表中看到的，`ls` 命令并没有关于每个文件产生太多信息。若要列出额外信息，另一个流行的参数是 `-l`。`-l`\
  \ 参数产生长格式列表格式，为目录中的每个文件提供更多信息：\n\n```\n$ ls -l\n\ntotal 2064\ndrwxrwxr-x  2  rich\
  \ rich     4096  2010-08-24  22:04  4rich\n-rw-r--r--  1  rich rich 1766205  2010-08-24\
  \  15:34  backup.zip\ndrwxr-xr-x  3  rich rich     4096  2010-08-31  22:24  Desktop\n\
  drwxr-xr-x  2  rich rich     4096  2009-11-01  04:06  Documents\ndrwxr-xr-x  2 \
  \ rich rich     4096  2009-11-01  04:06  Download\ndrwxrwxr-x  2  rich rich    \
  \ 4096  2010-07-26  18:25  Drivers\ndrwxr-xr-x  2  rich rich     4096  2009-11-01\
  \  04:06  Music\n-rwxr--r--  1  rich rich       30  2010-08-23  21:42  myprog\n\
  drwxr-xr-x  2  rich rich     4096  2009-11-01  04:06  Pictures\ndrwxr-xr-x  2  rich\
  \ rich     4096  2009-11-01  04:06  Public\ndrwxrwxr-x  5  rich rich     4096  2010-08-24\
  \  22:04  store\n-rw-rw-r--  1  rich rich     98772  2010-08-24  15:30  store.sql\n\
  -rw-r--r--  1  rich rich    107507  2010-08-13  15:45  store.zip\ndrwxr-xr-x  2\
  \  rich rich     4096  2009-11-01  04:06  Templates\ndrwxr-xr-x  2  rich rich  \
  \   4096  2009-11-01  04:06  Videos\n```\n\n`[rich@testbox~]$`\n\n长格式列表单行列出目录中包含的每个文件和目录。除了文件名外，列表还显示了额外的有用信息。输出的第一行显示了目录中包含的块总数。随后，每行都包含关于每个文件（或目录）的以下信息：\n\
  \n*   文件类型——例如目录（`d`）、文件（`-`）、字符设备（`c`）或块设备（`b`）\n*   文件的权限（参见第 6 章）\n*   指向文件的硬链接数（参见本章的“链接文件”部分）\n\
  *   文件所有者的用户名\n*   文件所属组的组名\n*   以字节为单位的文件大小\n*   文件最后一次修改的时间\n*   文件或目录名称\n\n`-l`\
  \ 参数是一个非常强大的工具。拥有了这些信息，你可以查看系统上任何文件或目录的几乎需要的信息。\n\n### 完整参数列表\n\n`ls` 命令有很多参数，在进行文件管理时可能会大派用场。如果你对\
  \ `ls` 使用 `man` 命令，你将看到几页可用参数，供你使用以修改 `ls` 命令的输出。\n\n`ls` 命令使用两种类型的命令行参数：\n\n* \
  \  单字母参数\n*   全单词（长）参数\n\n单字母参数前面总是有一个单横杠 `-。全单词参数更具描述性，前面有一个双横杠 `--。许多参数既有单字母版本也有全单词版本，而有些只有一种类型。表\
  \ 3.5 列出了一些有助于你使用 `bash ls` 命令的常用参数。\n\n#### 常用 ls 命令参数\n\n| 单字母 | 全单词 | 描述 |\n\
  | :--- | :--- | :--- |\n| -a | --all | 不忽略以点开头的项。 |\n| -A | --almost-all | 不列出 `.`\
  \ 和 `..` 文件。 |\n| | --author | 打印每个文件的作者。 |\n| -b | --escape | 为不可打印字符打印八进制值。 |\n\
  | | --block-size=size | 使用字节计算块大小。 |\n| -B | --ignore-backups | 不列出带有波浪（`∼`）符号的项（用于表示备份副本）。\
  \ |\n| -c | | 按最后修改时间排序。 |\n| -C | | 按列列出项。 |\n| | --color=when | 何时使用颜色（总是、从不或自动）。\
  \ |\n| -d | --directory | 列出目录项而非内容，并且不跟踪符号链接。 |\n| -F | --classify | 在项后附加文件类型指示符。\
  \ |\n| | --file-type | 仅对某些文件类型附加文件类型指示符（非可执行文件）。 |\n| | --format=word | 将输出格式化为跨、逗号、水平、长、单列、详细或垂直。\
  \ |\n| -g | | 列出除文件所有者外的完整文件信息。 |\n| | --group-directories-first | 在文件之前列出所有目录。\
  \ |\n| -G | --no-group | 在长列表中不组名。 |\n| -h | --human-readable | 使用 K、M 或 G 打印大小。\
  \ |\n| | --si | 与 `-h` 相同，使用 1000 的幂。 |\n| -i | --inode | 显示文件的索引（`inode`）。 |\n\
  | -l | | 显示长格式。 |\n| -L | --dereference | 显示链接文件的信息。 |\n| -n | --numeric | 使用 uid\
  \ 和 gid 代替名称。 |\n| -o | | 在长列表中不显示所有者。 |\n| -r | --reverse | 反向显示文件。 |\n| -R | --recursive\
  \ | 递归列出子目录。 |\n| -s | --size | 打印文件的大小。 |\n| -S | --sort=size | 按文件大小排序。 |\n| -t\
  \ | --sort=time | 按修改时间排序。 |\n| -u | --sort=access | 显示访问时间而非修改时间。 |\n| -U | --sort=none\
  \ | 不排序输出。 |\n| -v | --sort=version | 按版本排序。 |\n| -x | --sort=extension | 按行列出项。\
  \ |\n| -X | --sort=extension | 按扩展名排序。 |\n\n你可以同时使用多个参数。双参数必须分开列出，但单杠参数可以组合成一个字符串。一种常用的组合是\
  \ `-a` 显示所有文件、`-i` 显示 inode、`-l`产生长列表以及 `-s` 显示块大小。文件或目录的 inode 是内核为文件系统中每个对象分配的唯一数字。将这些组合在一起就成了容易记忆的\
  \ `-sail` 参数：\n\n```\n$ ls -sail\ntotal 2360\n301860  8  drwx------  36  rich rich\
  \     4096  2010-09-03  15:12  .\n65473  8  drwxr-xr-x  6  root root     4096  2010-07-29\
  \  14:20  ..\n360621  8  drwxrwxr-x  4  rich rich     4096  2010-08-24  22:04  4rich\n\
  301862  8  -rw-r--r--  1  rich rich     124  2010-02-12  10:18  .bashrc\n361443\
  \  8  drwxrwxr-x  4  rich rich     4096  2010-07-26  20:31  .ccache\n301879  8 \
  \ drwxr-xr-x  3  rich rich     4096  2010-07-26  18:25  .config\n```\n\n\n\n\n\n\
  ```\n301870   8  -rw-------  1 rich rich      26  2009-11-01  04:06  .dmrc\n301872\
  \   8  drwxr-xr-x  2 rich rich      4096  2009-11-01  04:06  Download\n360207  \
  \ 8  drwxrwxr-x  2 rich rich      4096  2010-07-26  18:25  Drivers\n301882   8 \
  \ drwx------  5 rich rich      4096  2010-09-02  23:40  .gconf\n301883   8  drwx------\
  \  2 rich rich      4096  2010-09-02  23:43  .gconfd\n360338   8  drwx------  3\
  \ rich rich      4096  2010-08-06  23:06  .gftp\n```\n\n除了普通的 `-l` 参数输出信息外，你还会看到每行后面都增加了两个数字。列表中的第一个数字是文件或目录的\
  \ inode 节点号。第二个数字是文件的块大小（block size）。第三项是文件类型的图示，以及文件的权限。我们将在第 6 章中详细介绍这些。\n\n紧接着，下一个数字是指向该文件的硬链接数（在后文的“链接文件”部分进行讨论）、文件的所有者、文件所属的组、文件大小（以字节计）、默认显示最后修改时间的时间戳，最后是实际的文件名。\n\
  \n## 过滤列表输出\n\n正如你在示例中所看到的，默认情况下，`ls` 命令会列出目录中的所有文件。有时这可能大大杀边了，尤其是当你只想查找某个特定文件的信息时。\n\
  \n幸运的是，`ls` 命令还提供了一种在命令行中定义过滤器的方法。它使用过滤器来决定应该在输出中显示哪些文件或目录。\n\n过滤器的工作原理是一个简单的文本匹配字符串。在在你想要使用的任何命令行参数之后包含过滤器即可：\n\
  \n```\n$ ls -l myprog\n-rwxr--r--  1 rich rich 30  2007-08-23  21:42  myprog\n$\n\
  ```\n\n当你指定特定文件的名称作为过滤器时，`ls` 命令只显示该一个文件的信息。有时你可能不知道要查找的文件的确切名称。`ls` 命令还能识别标准通配符，并使用它们来匹配过滤器中的模式：\n\
  \n- 问号（`?`）表示一个字符\n- 星号（`*`）表示零或多个字符\n\n问号 `?` 可以用来替换过滤器字符串任何位置的恰好一个字符。例如：\n\n```\n\
  $ ls -l mypro?\n-rw-rw-r--  1 rich rich  0  2010-09-03  16:38  myprob\n-rwxr--r--\
  \  1 rich rich 30  2010-08-23  21:42  myprog\n$\n```\n\n过滤器 `mypro?` 匹配了目录中的两个文件。同样，星号\
  \ `*` 可以用来匹配零或多个字符：\n\n```\n$ ls -l myprob*\n-rw-rw-r--  1 rich rich 0  2010-09-03\
  \  16:38  myprob\n-rw-rw-r--  1 rich rich 0  2010-09-03  16:40  myproblem\n$\n```\n\
  \n星号 `*` 在 `myprob` 文件中匹配了零个字符，但在 `myproblem` 文件中匹配了三个字符。当你不确定文件名时，这是搜索文件时非常强大的功能。\n\
  \n## 文件处理\n\n`bash` shell 提供了许多用于操作 Linux 文件系统上文件的命令。本节将带你熟悉从命令行（CLI）处理文件所需的基本命令，以满足你所有的文件处理需求。\n\
  \n### 创建文件\n\n你偶尔会遇到需要创建一个空文件的情况。有时应用程序在写入日志文件之前，期望该文件已经存在。在这些情况下，你可以使用 `touch`\
  \ 命令轻松地创建一个空文件：\n\n```\n$ touch test1\n$ ls -il test1\n1954793  -rw-r--r--  1 rich\
  \ rich      0  2010-09-01  09:35  test1\n$\n```\n\n`touch` 命令会创建你指定的新文件并将你的用户名指定为所有者。因为对\
  \ `ls` 命令使用了 `-il` 参数，所以第一项显示了 inode 编号。Linux 文件系统上的每个文件都有唯一的 inode 编号。注意到文件大小为\
  \ 0，因为 `touch` 命令只是创建了一个空文件。`touch` 命令也可以用于更改现有文件的访问时间修改修改时间，而不更改文件内容：\n\n```\n\
  $ touch test1\n$ ls -l test1\n-rw-r--r--  1 rich rich      0  2010-09-01  09:37\
  \  test1\n$\n```\n\n`test1` 的修改时间是执行命令时的。`touch` 命令可以用来更改现有文件的访问时间和修改时间，而不更改文件内容。如果你只想更改访问时间，使用\
  \ `-a` 参数。如果你只想更改修改时间，使用 `-m` 参数。默认情况下，`touch` 使用当前时间。你可以使用 `-t` 指定特定时间：\n\n```\n\
  $ touch -t 201112251200 test1\n$ ls -l\n-rw-r--r--  1 rich rich      0  2011-12-25\
  \  12:00  test1\n$\n```\n\n`touch` 命令会创建你指定的新文件并将你的用户名指定为所有者。因为对 `ls` 命令使用了 `-il`\
  \ 参数，所以第一项显示了 inode 编号。Linux 文件系统上的每个文件都有唯一的 inode 编号。注意到文件大小为 0，因为 `touch` 命令只是创建了一个空文件。`touch`\
  \ 命令也可以用于更改现有文件的访问时间和修改时间，而不更改文件内容：\n\n```\n$ touch test1\n$ ls -l test1\n-rw-r--r--\
  \  1 rich rich      0  2010-09-01  09:37  test1\n$\n```\n\n`test1` 的修改时间是执行命令时的。`touch`\
  \ 命令也可以用来更改现有文件的访问时间和修改时间，而不更改文件内容。如果你只想更改访问时间，使用 `-a` 参数。如果你只想更改修改时间，使用 `-m` 参数。默认情况下，`touch`\
  \ 使用当前时间。你可以使用 `-t` 指定特定时间：\n\n```\n$ touch -t 201112251200 test1\n$ ls -l\n-rw-r--r--\
  \  1 rich rich      0  2011-12-25  12:00  test1\n$\n```\n\n### 复制文件\n\n`cp` 命令用于将文件和目录从一个位置复制到另一个位置。这是一个非常常用的操作。`cp`\
  \ 命令使用源文件和目标文件名。如果目标文件已存在， `cp` 命令将覆盖它：\n\n```bash\n$ cp test1 test2\n$ ls -l\n\
  -rw-r--r--  1 rich rich      0  2010-09-01  09:35  test1\n-rw-r--r--  1 rich rich\
  \      0  2010-09-01  09:35  test2\n$\n```\n\n与大多数命令一样，`cp` 命令有一些命令行参数来帮助。\n\n####\
  \ cp 参数\n\n| 参数 | 说明 |\n| :--- | :--- |\n| `-a` | 归档文件。 |\n| `-b` | 备份每个现有的目标文件而不是覆盖它。\
  \ |\n| `-d` | 保留链接。 |\n| `-f` | 强制覆盖现有目标文件无需提示。 |\n| `-i` | 在覆盖目标文件之前提示。 |\n| `-l`\
  \ | 创建文件链接而不是复制文件。 |\n| `-p` | 尽可能保留文件属性。 |\n| `-r` | 递归复制文件。 |\n| `-R` | 递归复制目录。\
  \ |\n| `-s` | 创建符号链接而不是复制文件。 |\n| `-S` | 覆盖备份功能。 |\n| `-u` | 仅当源文件比目标文件新时复制（更新）。\
  \ |\n| `-v` | 详细模式，解释正在发生什么。 |\n| `-x` | 将复制限制在当前文件系统中。 |\n\n使用 `-p` 参数为复制的文件保留原始文件的访问或修改时间。\n\
  \n```bash\n$ cp -p test1 test3\n$ ls -l\ntotal 4\n1954886  drwxr-xr-x  2 rich rich\
  \      4096  2010-09-06  09:42  dir1/\n1954793  -rw-r--r--  1 rich rich      0 \
  \ 2011-12-25  20:11  test1\n1954794  -rw-r--r--  1 rich rich      0  2010-09-01\
  \  09:39  test2\n1954888  -rw-r--r--  1 rich rich      0  2011-12-25  12:00  test3\n\
  $\n```\n\n`-R` 参数非常强大。它允许你在一个命令中递归复制整个目录的内容：\n\n```bash\n$ cp -R dir1 dir2\n```\n\
  \n\n\n\n\n```bash\n$ ls -l\n\ntotal 8\ndrwxr-xr-x     2 rich      rich         \
  \  4096 Sep  6 09:42 dir1/\ndrwxr-xr-x     2 rich      rich           4096 Sep \
  \ 6 09:45 dir2/\n-rw-r--r--     1 rich      rich                0 Dec 25  2011 test1\n\
  -rw-r--r--     1 rich      rich                0 Sep  6 09:39 test2\n-rw-r--r--\
  \     1 rich      rich                0 Dec 25  2011 test3\n```\n\n现在 `dir2` 是 `dir1`\
  \ 的完整拷贝。你还可以在 `cp` 命令中使用通配符：\n\n```bash\n$ cp -f test* dir2\n$ ls -al dir2\n```\n\
  \ntotal 12\ndrwxr-xr-x     2 rich      rich           4096 Sep  6 10:55 ./\ndrwxr-xr-x\
  \     4 rich      rich           4096 Sep  6 10:46 ../\n-rw-r--r--     1 rich  \
  \    rich                0 Dec 25  2011 test1\n-rw-r--r--     1 rich      rich \
  \               0 Sep  6 10:55 test2\n-rw-r--r--     1 rich      rich          \
  \      0 Dec 25  2011 test3\n```\n\n此命令将所有以 `test` 开头的文件都拷贝到了 `dir2`。包含 `-f` 参数是为了强制覆盖目录中已存在的\
  \ `test1` 文件，而无需询问。\n\n## 链接文件\n\n你可能已经注意到 `cp` 命令的几个参数提到了文件链接。这是 Linux 文件系统中可用一个非常酷的选项。如果你需要在系统上维护同一个文件的两个（或多个）副本，而不是拥有多个独立的物理副本，你可以使用一个物理拷贝和多个虚拟副本，这些被称为“链接”（links）。链接是目录中的一个占位符，指向文件的真实位置。Linux\
  \ 中有两种类型的文件链接：\n\n- 符号链接，或软链接（soft link）\n- 硬链接（hard link）\n\n硬链接创建一个单独的文件，其中包含关于原始文件及其所在位置的信息。当你引用硬链接时，就就像在引用原始文件一样：\n\
  \n```bash\n$ cp -l test1 test4\n$ ls -il\ntotal 16\ndrwxr-xr-x     2 rich      rich\
  \           4096 Sep  6 09:42 dir1/\ndrwxr-xr-x     2 rich      rich           4096\
  \ Sep  6 09:45 dir2/\n-rw-r--r--     2 rich      rich                0 Sep  6 09:51\
  \ test1\n-rw-r--r--     1 rich      rich                0 Sep  6 09:39 test2\n-rw-r--r--\
  \     1 rich      rich                0 Dec 25  2011 test3\n-rw-r--r--     2 rich\
  \      rich                0 Sep  6 09:51 test4\n```\n\n`-l` 参数为 `test1` 文件创建了一个名为\
  \ `test4` 的硬链接。在文件列表中，你可以看到 `test1` 和 `test4` 文件的 inode 编号是相同的，这表明实际上它们是同一个文件。还要注意链接计数（列表中的第三项）显示两个文件都有两个链接。\n\
  \n### 注意事项\n你只能在同一物理介质上的文件之间创建硬链接。你不能在不同挂载点的文件之间创建硬链接。在这种情况下，你必须使用软链接。另一方面，`-s`\
  \ 参数创建一个符号链接，或软链接：\n\n```bash\n$ cp -s test1 test5\n$ ls -il test*\ntotal 16\n-rw-r--r--\
  \     2 rich      rich                6 Sep  1 09:51 test1\n-rw-r--r--     1 rich\
  \      rich                0 Sep  6 09:39 test2\n-rw-r--r--     1 rich      rich\
  \                0 Dec 25  2011 test3\n-rw-r--r--     2 rich      rich         \
  \       6 Sep  1 09:51 test4\nlrwxrwxrwx     1 rich      rich                5 Sep\
  \  1 09:56 test5 -> test1\n```\n\n在文件列表中几点需要注意。首先，你会发现新文件 `test5` 的 inode 编号与 `test1`\
  \ 文件不同，这表明 Linux 系统将其视为一个单独的文件。其次，文件大小更小。链接文件只需要存储关于源文件的信息，而不需要文件的实际数据。列表中的文件名区域显示了两个文件之间的关系。\n\
  \n### 提示\n如果你想链接文件，除了使用 `cp` 命令外，还可以使用 `ln` 命令。默认情况下，`ln` 命令创建硬链接。如果你想创建软链接，仍然需要使用\
  \ `-s` 参数。\n\n在拷贝链接文件时要小心。如果你使用 `cp` 命令拷贝链接到另一个源文件的文件，你所做的只是创建了源文件的另一个拷贝。这可能会很快变得混乱。与其拷贝链接文件，不如你可以为原始文件创建另一个链接。你可以对同一个文件创建许多链接而而没有任何问题。然而，你也不希望对其他软链接文件创建软链接。这会创建一个链接链，只会让人困惑而且容易损坏。\n\
  \n## 重命名文件\n\n在 Linux 世界中，重命名文件被称为“移动”（moving）。`mv` 命令可将文件和目录移动到另一个位置：\n\n```bash\n\
  $ mv test2 test6\n$ ls -il test*\ntotal 16\ndrwxr-xr-x     2 rich      rich    \
  \       4096 Sep  6 09:42 dir1/\ndrwxr-xr-x     2 rich      rich           4096\
  \ Sep  6 09:45 dir2/\n-rw-r--r--     1 rich      rich                0 Dec 25  2011\
  \ test3\n-rw-r--r--     2 rich      rich                6 Sep  1 09:51 test4\nlrwxrwxrwx\
  \     1 rich      rich                5 Sep  1 09:56 test5 -> test1\n```\n\n注意，移动文件更改了名称，但保留了相同的\
  \ inode 编号和时间戳。移动带有软链接的文件是个问题：\n\n```bash\n$ mv test1 test8\n$ ls -il test*\ntotal\
  \ 16\n-rw-r--r--     1 rich      rich                0 Dec 25  2011 test3\n-rw-r--r--\
  \     2 rich      rich                6 Sep  1 09:51 test4\nlrwxrwxrwx     1 rich\
  \      rich                5 Sep  1 09:56 test5 -> test1\n-rw-r--r--     1 rich\
  \      rich                0 Sep  1 09:39 test6\n-rw-r--r--     2 rich      rich\
  \                6 Sep  1 09:51 test8\n[rich@test2 clsc]$ mv test8 test1\n```\n\n\
  使用硬链接的 `test4` 文件仍然使用相同的 inode 编号，这是完全没问题的。然而，`test5` 文件现在指向了一个无效的文件，它不再是一个有效的链接。你也可以使用\
  \ `mv` 命令移动目录：\n\n```bash\n$ mv dir2 dir4\n```\n\n目录的所有内容没有改变。唯一改变的是目录名称。因此，`mv`\
  \ 命令的操作速度比 `cp` 命令快得多。\n\n## 删除文件\n\n在你的 Linux 生涯的某个时刻，你很可能希望能够删除现有文件。无论是清理文件系统还是移除软件包，总是有删除文件的机会。\n\
  \n在 Linux 世界中，删除被称为“移除”（removing）。在 bash shell 中移除文件的命令是 `rm`。`rm` 命令的基本形式非常简单：\n\
  \n```bash\n$ rm -i test2\nrm: remove ‘test2’? y\n$ ls -l\ntotal 16\ndrwxr-xr-x \
  \    2 rich      rich           4096 Sep  1 09:42 dir1/\ndrwxr-xr-x     2 rich \
  \     rich           4096 Sep  1 09:45 dir2/\n-rw-r--r--     2 rich      rich  \
  \              6 Sep  1 09:51 test1\n-rw-r--r--     1 rich      rich           \
  \     0 Dec 25  2011 test3\n-rw-r--r--     2 rich      rich                6 Sep\
  \  1 09:51 test4\nlrwxrwxrwx     1 rich      rich                5 Sep  1 09:56\
  \ test5 -> test1\n```\n\n注意，命令会提示你是否确定要移除该文件。bash shell 中没有回收站或垃圾桶。一旦你删除了文件，它就消失了。现在，关于删除带有链接的文件有一个有趣的知识：\n\
  \n```bash\n$ rm test1\n$ ls -l\ntotal 16\ndrwxr-xr-x     2 rich      rich      \
  \     4096 Sep  1 09:42 dir1/\ndrwxr-xr-x     2 rich      rich           4096 Sep\
  \  1 09:45 dir2/\n-rw-r--r--     1 rich      rich                0 Dec 25  2011\
  \ test3\n-rw-r--r--     2 rich      rich                6 Sep  1 09:51 test4\nlrwxrwxrwx\
  \     1 rich      rich                5 Sep  1 09:56 test5 -> test1\n```\n\n`test1`\
  \ 文件被删除了，它曾与 `test4` 文件有一个硬链接，并与 `test5` 文件有一个软链接。注意发生了什么。尽管 `test1` 文件现在已消失，两个链接文件仍然显示（尽管在我的彩色终端上，`test5`\
  \ 文件名现在显示为红色）。当你查看作为硬链接的 `test4` 文件内容时，它仍然显示文件的内容。当你查看作为软链接的 `test5` 文件内容时，bash\
  \ 指明它已经不存在了。\n\n```bash\n$ cat test4\nhello\n\n$ cat test5\ncat: test5: No such\
  \ file or directory\n```\n\n\n\n\n\n请记住，硬链接文件与原始文件使用相同的索引节点（inode number）。硬链接文件会保持该\
  \ inode 号，直到你删除了指向它的最后一个硬链接文件，从而保留数据！软链接文件只知道底层文件已删除，因此它无物可指。这是在处理链接文件时需要记住的一个重要特性。\n\
  \n`rm` 命令的另一个功能是，如果你要删除大量文件且不想被提示困扰，可以使用 `-f` 参数进行强制删除。只需小心即可！\n\n### 提示\n与复制文件一样，你可以在\
  \ `rm` 命令中使用通配符。再次提醒，执行此类操作时要小心，因为你删除的任何内容，即使是误删都会永久消失！\n\n## 目录处理\n在 Linux 中，有一些命令同时适用于文件和目录（例如\
  \ `cp` 命令），而有些命令只适用于目录。要创建一个新目录，你需要使用特定的命令，本节将介绍这一点。删除目录可能会变得很有意思，因此本节也将涵盖这一内容。\n\
  \n### 创建目录\n在 Linux 中创建新目录并不复杂——只需使用 `mkdir` 命令即可：\n\n```\n$ mkdir dir3\n\n$ ls\
  \ -il\n\ntotal 16\n1954886 drwxr-xr-x   2 rich      rich     4096 Sep  1 09:42 dir1/\n\
  1954889 drwxr-xr-x   2 rich      rich     4096 Sep  1 10:55 dir2/\n1954893 drwxr-xr-x\
  \   2 rich      rich     4096 Sep  1 11:01 dir3/\n1954888 -rw-r--r--    1 rich \
  \     rich        0 Dec 25  2011 test3\n1954793 -rw-r--r--   1 rich      rich  \
  \      6 Sep  1 09:51 test4\n$\n```\n系统会创建一个新目录并为其分配一个新的 inode 节点号。\n\n### 删除目录\n\
  删除目录可能很复杂，但这有其原因。当你开始删除目录时，有很多发生意外情况的机会。bash shell 会尽可能保护我们免受意外灾难的影响。删除目录的基础命令是\
  \ `rmdir`：\n\n```\n$ rmdir dir3\n\n$ rmdir dir1\nrmdir: dir1: Directory not empty\n\
  $\n```\n默认情况下，`rmdir` 命令仅适用于删除空目录。因为 `dir1` 目录中有一个文件，`rmdir` 命令拒绝删除它。你可以使用 `--ignore-fail-on-non-empty`\
  \ 参数来删除非空目录。\n\n我们的朋友 `rm` 命令在处理目录时也能提供一些帮助。如果你尝试像处理文件一样不带任何参数使用它，你可能会感到有些失望：\n\n\
  ```\n$ rm dir1\nrm: dir1: is a directory\n$\n```\n然而，如果你真的想删除一个目录，可以使用 `-r` 参数递归删除目录中的文件，然后删除目录本身：\n\
  \n```\n$ rm -r dir2\nrm: descend into directory ‘dir2’? y\nrm: remove ‘dir2/test1’?\
  \ y\nrm: remove ‘dir2/test3’? y\nrm: remove ‘dir2/test4’? y\nrm: remove directory\
  \ ‘dir2’? y\n$\n```\n虽然这种方法可行，但有些笨拙。注意，你仍然必须验证每一个被删除的文件。对于一个包含大量文件和子目录的目录，这可能会变得非常乏味。\n\
  \n抛弃顾虑并删除整个目录（包括所有内容）的终极解决方案是使用带有 `-r` 和 `-f` 参数的 `rm` 命令：\n\n```\n$ rm -rf dir2\n\
  $\n```\n就这样。没有警告，没有张仗，只有另一个 shell 提示符。当然，这是一个极其危险的工具，尤其是当你以 root 用户账户登录时。请谨慎使用，并在经过三次检查以确保你正在执行完全符合你的操作之后再使用。\n\
  \n注意\n你可能在上一个示例中注意到两个命令行参数是通过一个连杠组合在一起的。这是 bash shell 的一个功能，允许你组合命令行参数以减少打字量。\n\n\
  ## 查看文件内容\n到为止，我们已经涵盖了关于文件的所有知识，除了如何查看它们的内部内容。有几条命令可以在不调出编辑器的情况下查看文件内部内容（参见第 11\
  \ 章）。本节演示了你可以使用的几个命令，以帮助你检查文件。\n\n### 查看文件统计\n你已经看到 `ls` 命令可以提供关于文件的许多有用信息。然而，仍然有一些信息是\
  \ `ls` 命令无法看到的（或者至少无法一次性看到）。\n\n```\nstat` 命令提供了文件在文件系统中状态的完整列表：\n\n```\n$ stat\
  \ test10\n  File: “test10”\n  Size: 6          Blocks: 8       Regular File\n  Device:\
  \ 306h/774d   Inode: 1954891   Links: 2\n  Access: (0644/-rw-r--r--)  Uid: (  501/\
  \ rich) Gid: (  501/ rich)\n  Access: Sat Sep  1 12:10:25 2010\n  Modify: Sat Sep\
  \  1 12:11:17 2010\n  Change: Sat Sep  1 12:16:42 2010\n$\n```\n`stat` 命令的结果显示了你想要知道关于被检查文件的一切信息，甚至包含了存储文件的设备的主设备和次设备号。\n\
  \n### 查看文件类型\n尽管 `stat` 命令产生了所有信息，但仍然缺少一项信息——文件类型。在你急着列出一个 1000 字节的文件之前，通常最好先搞清楚它是什么类型的文件。如果你尝试列出一个二进制文件，你的显示器上会出现大量乱码，甚至可能导致你的终端模拟器锁死。\n\
  \n`file` 命令是一个非常有用的小工具。它具有查看文件内部并确定它到底是什么类型文件的能力：\n\n```\n$ file test1\ntest1: ASCII\
  \ text\n\n$ file myscript\nmyscript: Bourne shell script text\n\n$ file myprog\n\
  myprog: ELF 32-bit LSB executable, Intel 8036, version 1 (SYSV), dynamically linked\
  \ (uses shared libs), not stripped\n$\n```\n`file` 命令将文件分为三类：\n* 文件\n* 可执行文件：可以在系统中运行的文件\n\
  * 数据文件：包含不可打印二进制字符但无法系统中运行的文件\n\n第一个示例是一个文本文件。`file` 命令不仅确定它包含文本，还确定了文本格式。第二个示例是一个文本文件。虽然文件是文本，但你可以执行它。最后一个示例是一个二进制执行文件。`file`\
  \ 命令确定了它的编译平台以及所需的库类型。这对于你有二进制执行文件时特别有用。\n\n## 查看整个文件\n如果你有一个很大的文本文件，你可能想要查看它的内部。Linux\
  \ 中有三条命令可以提供帮助。\n\n## cat 命令\n`cat` 命令是显示内部所有数据的方便工具：\n\n```\n$ cat test1\nhello\n\
  This is a test file.\n$\n```\n没什么特别的，只是文本文件的内容。然而，你可以配合 `cat` 命令使用一些参数，这对你有帮助。\n\
  \n`-n` 参数会为你所有行编号：\n\n```\n$ cat -n test1\n  1 hello\n  2\n  3 This is a test file.\n\
  \  4\n  5\n  6\n$\n```\n该功能在你检查脚本时非常有用。如果你只想对包含内容的行进行编号，`-b` 参数适合你：\n\n```\n$ cat\
  \ -b test1\n  1 hello\n  2 This is a test file.\n  3\n$\n```\n如果你需要将多个空行压缩为单个空行，请使用\
  \ `-s` 参数：\n\n```\n$ cat -s test1\nhello\n\nThis is a test file.\n$\n```\n最后，如果你不想让制表符出现，请使用\
  \ `-T` 参数：\n\n```\n$ cat -T test1\nhello^IThis is a test file.\n$\n```\n`-T` 参数会将文本中的任何制表符替换为\
  \ ˆI 字符组合。\n\n\n\n\n\n对于大文件，`cat` 命令可能会有点令人困扰。文件中的文本会迅速滚动过屏幕，而不会停止。幸运的是，有一个简单的方法可以解决这个问题。\n\
  \n## more 命令\n\n`cat` 命令的主要缺点是，一旦启动了它，你就无法控制正在发生的情况。为了解决这个问题，开发者创建了 `more` 命令。`more`\
  \ 命令显示文本文件，但在显示完每页数据后会停止。图 3.4 显示了一个 `more` 屏幕的示例。\n\n图 3.4 使用 more 命令显示文本文件\n\n\
  ![3.4](img/c03f004.jpg)\n\n注意，在图 3.4 的屏幕底部，`more` 命令显示了一个标签，显示你仍处于 `more` 应用程序中，以及你位于文本文件的进度。这是\
  \ `more` 命令的提示符。此时，你可以输入几个选项中的一个，如表 3.7 所示。\n\n表 3.7 more 命令选项\n\n| 选项 | 描述 |\n\
  | :--- | :--- |\n| H | 显示帮助菜单。 |\n| spacebar | 显示文件的下一页文本。 |\n| z | 显示文件的下一页文本。\
  \ |\n| ENTER | 显示文件中多的一行文本。 |\n| d | 显示文件中半屏幕（11 行）的文本。 |\n| q | 退出程序。 |\n| s |\
  \ 向前跳过一行文本。 |\n| f | 向前跳过一屏幕文本。 |\n| b | 向后跳过一屏幕文本。 |\n| /expression | 在文件中搜索文本表达式。\
  \ |\n| n | 搜索上一次指定表达式的下一次出现。 |\n| ’ | 转到指定表达式的第一次出现。 |\n| !cmd | 执行 shell 命令。 |\n\
  | v | 在当前行启动 vi 编辑器。 |\n| CTRL-L | 在文件的当前位置重绘屏幕。 |\n| = | 显示文件中的当前行号。 |\n| . | 重复上一个命令。\
  \ |\n\n`more` 命令允许在文本文件中进行一些基础移动。如需更高级的功能，请尝试 `less` 命令。\n\n## less 命令\n\n尽管从名字上看，它似乎没有\
  \ `more` 命令高级，但 `less` 命令实际上是一个双关语，它是 `more` 命令的增强版本（`less` 命令的名字源于短语“less is more”）。它提供了许多非常实用的功能，可以正向反向滚动文本文件，以及一些相当先进的搜索功能。\n\
  \n`less` 命令还可以在读取完整个文件之前显示文件内容。在查看极大的文件时，这是 `cat` 和 `more` 命令的共同严重缺点。\n\n`less`\
  \ 命令的操作方式与 `more` 命令非常相似，一次显示文件的一屏幕文本。图 3.5 显示了 `less` 命令的用法。\n\n图 3.5 使用 less 命令查看文件\n\
  \n![3.5](img/c03f005.jpg)\n\n注意，`less` 命令在提示符中提供了额外信息，显示文件的总行数和当前显示的行范围。`less` 命令支持与\
  \ `more` 命令相同的命令集，以及更多选项。要查看所有可用选项，请查看 `less` 命令的帮助手册（man pages）。它的功能之一是 `less`\
  \ 命令识别上下方向键以及翻页/翻页键（假设你正在使用定义正确的终端）。这让你在查看文件时具有完全控制权。\n\n## 查看文件的部分\n\n通常，你想要查看的数据位于文本文件的顶部或埋在底部。如果信息在大文件的顶部，你仍然需要等待\
  \ `cat` 或 `more` 命令加载整个文件后才能查看。如果信息位于文件的底部（例如日志文件），你需要穿过数千行文本才能到达最后几条记录。幸运的是，Linux\
  \ 有专门的命令来解决这两个问题。\n\n## tail 命令\n\n`tail` 命令显示文件中的最后一组行。默认情况下，它会显示文件的最后 10 行，但你可以通过命令行参数更改它，如表\
  \ 3.8 所示。\n\n表 3.8 tail 命令命令行参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| -c bytes | 显示文件中最后几个字节数。\
  \ |\n| -n lines | 显示文件中最后几行。 |\n| -f | 保持 tail 程序活动，并在新行被添加到文件时继续显示。 |\n| --pid=PID\
  \ | 与 -f 一起，跟踪文件直到 ID 为 PID 的进程终止。 |\n| -s sec | 与 -f 一起，在每次迭代之间睡眠 sec 秒。 |\n| -v\
  \ | 始终显示带有文件名的输出头。 |\n| -q | 永远不显示带有文件名的输出头。 |\n\n`-f` 参数是 `tail` 命令一个非常酷的功能。它允许你在文件被其他进程使用时窥视其内容。`tail`\
  \ 命令保持活动，并在新行出现在文本文件中出现时继续显示。这是实时监控系统日志文件的极佳方法。\n\n## head 命令\n\n虽然不像 `tail` 命令那么奇特，但\
  \ `head` 命令的作用正如你预期的；它显示文件开头的第一组行。默认情况下，它会显示前 10 行文本。与 `tail` 命令类似，它支持 `-c` 和 `-n`\
  \ 参数，以便你可以更改显示的内容。\n\n通常文件的开头不会改变，因此 `head` 命令不支持 `-f` 参数功能。如果你不确定内部包含什么，`head`\
  \ 命令是一个快速看一眼文件开头的方便方法，而无需忍受显示整个文件的麻烦。\n\n## 总结\n\n本章涵盖了从 shell 提示符操作 Linux 文件系统的基础知识。我们从讨论\
  \ `bash` shell 开始，并向你展示了如何与 shell 交互。命令行界面（CLI）使用提示符字符串来指示它何时准备好让你输入命令。你可以自定义提示符字符串以显示关于你的系统、登录\
  \ ID 甚至日期时间的有用信息。\n\n`bash` shell 提供了丰富的实用程序，你可以它们来创建和操作文件。在开始操作文件之前，了解 Linux 如何存储它们是一个好主。本章讨论了\
  \ Linux 虚拟目录的基础，并向你展示了 Linux 如何引用存储媒体设备。在描述了 Linux 文件系统后，本章引导你如何使用 `cd` 命令在虚拟目录中移动。\n\
  \n在展示了如何进入目录后，本章演示了如何使用 `ls` 命令列出文件和子目录。有很多参数可以自定义 `ls` 命令的输出。你只需要使用 `ls` 命令就可以获取有关文件和目录的信息。\n\
  \n`touch` 命令对于创建空文件以及更改现有文件的访问或修改时间非常有用。本章还讨论了使用 `cp` 命令将现有文件从一个位置复制到另一个位置。它向你演示了链接文件而不是复制文件的过程，提供了一种简单的方法，在两个位置拥有同一个文件而无需创建单独的副本。`cp`\
  \ 命令可以这样做，`ln` 命令也是。\n\n接下来，你学习了如何在 Linux 中使用 `mv` 命令重命名文件（称为移动），并看到了如何使用 `rm` 命令删除文件（称为移除）。它还向你展示了如何对目录执行相同的任务，使用了\
  \ `mkdir` 和 `rmdir` 命令。\n\n\n\n\n最后，本章以讨论查看文件内容结束。`cat`、`more` 和 `less` 命令提供了查看文件全部内容的简单方法，而\
  \ `tail` 和 `head` 命令非常适合查看文件内部的一小部分（窥视）。\n\n下一章将继续对 `bash` shell 命令的讨论。我们将查看更多更高级的管理员命令，这些命令在你管理\
  \ Linux 系统时将大有用场。\n\n# 第 4 章：更多 bash Shell 命令\n\n### 本章内容\n- 管理进程\n- 获取磁盘统计信息\n\
  - 挂载新磁盘\n- 排序数据\n- 数据归档\n\n第 3 章介绍了遍历 Linux 文件系统以及处理文件和目录的基础知识。文件和目录管理是 Linux shell\
  \ 的主要功能；然而，在我们开始编写脚本之前，我们还有一些需要关注的内容。本章将深入探讨 Linux 系统管理命令，向你展示如何使用命令行查看 Linux 内部情况。之后，它将向你展示几个可以来处理系统上数据文件的方便命令。\n\
  \n## 监控程序\n\nLinux 系统管理员最艰手的任务之一就是跟踪系统上运行的程序——尤其是现在，图形化桌面仅仅为了生成单个桌面就需要许多程序。系统上总是运行着大量的程序。\n\
  \n幸运的是，有一些命令行工具可以帮助你的生活变得轻松。本节涵盖了你只需要学会如何使用的以管理 Linux 系统程序的几个基本工具。\n\n### 窥视进程\n\
  \n当一个程序在系统上运行时，它被称为进程（process）。为了检查这些进程，你需要熟悉 `ps` 命令，它是实用程序中的“瑞士军刀”。它可以产生关于你系统上运行的所有程序的大量信息。\n\
  \n遗憾的是，这种健壮性伴随着复杂性——表现为大量的参数——使得 `ps` 命令可能是最难精的命令之一。大多数系统管理员会发现这些参数的一个子集，可以提供他们所需的信息，然后一直只使用那些参数。\n\
  \n尽管如此，基础的 `ps` 命令并没有真的提供多少信息：\n\n```\n$ ps\n    PID TTY             TIME  CMD\n\
  \    3081 pts/0     00:00:00 bash\n    3209 pts/0     00:00:00 ps\n$\n```\n\n没那么有趣。默认情况下，`ps`\
  \ 命令只显示属于当前用户且在当前终端运行的进程。在这种情况下，我们只运行了 `bash` shell（记住，shell 只是系统上运行的另一个程序），当然，还有\
  \ `ps` 命令本身。\n\n基础输出显示程序的进程 ID (`PID`)、它们运行的终端 (`TTY`) 以及进程已使用的 CPU 时间。\n\n**注意**：`ps`\
  \ 命令棘手之处（以及让它变得复杂的因素）在于，它曾经有两个版本。每个版本都有自己的一套命令行参数，控制它显示什么信息以及如何显示。最近，Linux 开发者已将两种\
  \ `ps` 命令格式合并为一个单一的 `ps` 程序（当然添加了他们自己的特色）。\n\nLinux 系统使用的 GNU `ps` 命令支持三种不同类型的命令行参数：\n\
  - Unix 风格参数，以横杠 `-` 开头\n- BSD 风格参数，没有横杠开头\n- GNU 长参数，以双横杠 `--` 开头\n\n接下来的章节将检查这三种不同的参数类型并展示它们如何工作的示例。\n\
  \n### Unix 风格参数\n\nUnix 风格参数源于 Bell Labs 发明的 AT&T Unix 系统上运行的原始 `ps` 命令。这些参数如表 4.1\
  \ 所示。\n\n| 参数 | 描述 |\n| :--- | :--- |\n| -A | 显示所有进程。 |\n| -N | 显示指定参数的反向。 |\n|\
  \ -a | 显示所有非会话头和无终端的进程。 |\n| -d | 显示所有非会话头的进程。 |\n| -e | 显示所有进程。 |\n| -C cmslist\
  \ | 显示包含在列表 `cmdlist` 中的进程。 |\n| -G grplist | 显示组 ID 在 `grplist` 列表中的进程。 |\n| -U\
  \ userlist | 显示由 `userlist` 列表中 userid 拥有的进程。 |\n| -g grplist | 按 `grplist` 的会话或组\
  \ ID 显示进程。 |\n| -p pidlist | 显示 PID 在 `pidlist` 列表中的进程。 |\n| -s sesslist | 显示会话\
  \ ID 在 `sesslist` 列表中的进程。 |\n| -t ttylist | 显示终端 ID 在 `ttylist` 列表中的进程。 |\n| -u\
  \ userlist | 按 `userlist` 列表中有效 userid 显示进程。 |\n| -F | 使用额外的完整输出。 |\n| -O format\
  \ | 在列表格式中显示特定列，同时显示默认列。 |\n| -M | 显示关于进程的安全信息。 |\n| -c | 显示关于进程的额外调度信息。 |\n| -f\
  \ | 显示完整格式列表。 |\n| -j | 显示作业信息。 |\n| -l | 显示长列表。 |\n| -o format | 仅显示 `format` 中列出的特定列。\
  \ |\n| -y | 不显示进程标志。 |\n| -Z | 显示安全上下文信息。 |\n| -H | 以分级格式显示进程（显示父进程）。 |\n| -n namelist\
  \ | 定义在 `WCHAN` 列中显示的值。 |\n| -w | 使用宽输出格式，用于无限宽度显示。 |\n| -L | 显示进程线程。 |\n| -V |\
  \ 显示 `ps` 的版本。 |\n\n参数非常多，而且记住，还有更多！使用 `ps` 命令的关键不在于背诵所有可用参数，而在于记住你认为最有用的那些。大多数\
  \ Linux 系统管理员都有自己的一套常用参数集，他们记住这些参数以提取相关信息。例如，如果你需要查看系统上运行的所有内容，请使用 `-ef` 参数组合（`ps`\
  \ 命令允许你这样组合参数）：\n\n```\n$ ps -ef\nUID      PID  PPID  C  STIME TTY           TIME\
