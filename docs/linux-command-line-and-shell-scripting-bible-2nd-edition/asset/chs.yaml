  \n# 引言\n\n欢迎阅读《Linux 命令行与 Shell 脚本圣经》（`Linux Command Line and Shell Scripting Bible`）第二版。正如“圣经”系列的所有书籍一样，你可以在这里找到实操教程和真实世界的信息，以及为你所学内容提供背景的参考信息。这本书是关于\
  \ `Linux` 命令行和 shell 命令的相当丰富的资源。当你完成《Linux 命令行与 Shell 脚本圣经》时，你已经完全准备好编写自己的 shell\
  \ 脚本，可以自动化 `Linux` 系统上的几乎任何任务。\n\n## 谁应该读这本书\n\n如果你是 `Linux` 环境下的系统管理员，了解如何编写 shell\
  \ 脚本将让你受益匪浅。本书并没有教你设置 `Linux` 系统的过程，但一旦运行起来，你就会想要自动化一些例行的管理任务。这就是 shell 脚本大显身手的地方，而这本书将为你提供帮助。这本书将演示如何使用\
  \ shell 脚本自动化任何管理任务，从监控系统统计和数据文件到为你的老板生成报告。\n\n如果你是一个家庭 `Linux` 爱好者，你也将从《Linux 命令行与\
  \ Shell 脚本圣经》中受益。如今，人们很容易在预制组件的图形化世界中迷失。大多数桌面 `Linux` 发行版都尽力向普通用户隐藏 `Linux` 系统。然而，在某些时候，你必须知道底层发生了什么。这本书向你展示如何访问\
  \ `Linux` 命令行提示符，以及进入那里后该做什么。通常，执行简单的任务（如文件管理）从命令行执行比从华丽的图形界面执行更快。命令行中有大量的命令可以使用，而这本书将教你如何使用它们。\n\
  \n## 本书的结构\n\n本书引导你通过 `Linux` 命令行基础知识进入更复杂的主题，例如创建你自己的脚本。书分为五个部分，每部分都建立在前一部分的基础上。\n\
  \n### 第一部分\n第一部分假设你已经运行了一个 `Linux` 系统，或者正在寻找一个 `Linux` 系统。第一章“开始学习 Shell”描述了 `Linux`\
  \ 系统的组成部分，并展示了 shell 如何融入其中。在描述了 `Linux` 基础后，本部分将包含以下内容：\n\n- 使用终端仿真包访问 shell（第\
  \ 2 章）\n- 介绍基础 shell 命令（第 3 章）\n- 使用更高级 shell 命令查看系统信息（第 4 章）\n- 使用 shell 变量处理数据（第\
  \ 5 章）\n- 理解 `Linux` 文件系统和安全（第 6 章）\n- 从命令行操作 `Linux` 文件系统（第 7 章）\n- 从命令行安装和更新软件（第\
  \ 8 章）\n- 使用 `Linux` 编辑器编写 shell 脚本（第 9 章）\n\n### 第二部分\n在第二部分，你开始编写 shell 脚本。通过这些章节，你将：\n\
  \n- 学习如何创建和运行 shell 脚本（第 10 章）\n- 改变程序的流（第 11 章）\n- 遍历代码段（第 12 章）\n- 在脚本中处理用户数据（第\
  \ 13 章）\n- 不同的存储和显示脚本数据的方法（第 14 章）\n- 控制你的 shell 脚本在系统上的运行方式和时间（第 15 章）\n\n### 第三部分\n\
  第三部分深入了 shell 脚本编程的高级领域，包括：\n\n- 创建供所有脚本使用的自定义函数（第 16 章）\n- 利用 `Linux` 图形桌面与脚本用户交互（第\
