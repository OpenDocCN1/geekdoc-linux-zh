  \n| 操作符 | 描述 |\n| :--- | :--- |\n| `ARG1 \\| ARG2` | 如果两个参数都不空或非零，返回 `ARG1`；否则返回\
  \ `ARG2`。 |\n| `ARG1 & ARG2` | 如果两个参数都不为空或非零，返回 `ARG1`；否则返回 0。 |\n| `ARG1 < ARG2`\
  \ | 如果 `ARG1` 小于 `ARG2`，返回 1；否则返回 0。 |\n| `ARG1 <= ARG2` | 如果 `ARG1` 小于或等于 `ARG2`，返回\
  \ 1；否则返回 0。 |\n| `ARG1 = ARG2` | 如果 `ARG1` 等于 `ARG2`，返回 1；否则返回 0。 |\n| `ARG1 !=\
  \ ARG2` | 如果 `ARG1` 不等于 `ARG2`，返回 1；否则返回 0。 |\n| `ARG1 >= ARG2` | 如果 `ARG1` 大于或等于\
  \ `ARG2`，返回 1；否则返回 0。 |\n| `ARG1 > ARG2` | 如果 `ARG1` 大于 `ARG2`，返回 1；否则返回 0。 |\n\
  | `ARG1 + ARG2` | 返回 `ARG1` 和 `ARG2` 的算术和。 |\n| `ARG1 - ARG2` | 返回 `ARG1` 和 `ARG2`\
  \ 的算术差。 |\n| `ARG1 * ARG2` | 返回 `ARG1` 和 `ARG2` 的算术积。 |\n| `ARG1 / ARG2` | 返回 `ARG1`\
