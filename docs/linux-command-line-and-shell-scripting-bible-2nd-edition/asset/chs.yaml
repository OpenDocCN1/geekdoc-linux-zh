  \ 8225280 bytes`\n\n扇区大小（逻辑/物理）：`512 bytes / 512 bytes`\n\nI/O 大小（最小/最优）：`512 bytes\
  \ / 512 bytes`\n\n磁盘标识符：`0x4beedc66`\n\n| 设备 | 启动 | 开始 | 结束 | 块 | Id | 系统 |\n| :---\
  \ | :--- | :--- | :--- | :--- | :--- | :--- |\n\n# 分区\n\n输出显示该存储设备上具有 5368MB 的空间（5GB）。存储设备详情下的列表显示了该设备上是否存在任何现有分区。此示例中的列表没有显示任何分区，因此该设备尚未进行分区。\n\
  \n接下来，您将需要在存储设备上创建一个新分区。使用 `n` 命令：\n\n```\nCommand (m for help): n\n```\n\n### 命令操作\n\
  - `e` 扩展分区\n- `p` 主分区 (1-4)\n\n```\nPartition number (1-4): 1\nFirst cylinder (1-652,\
  \ default 1): 1\nLast cylinder, +cylinders or +size{K,M,G} (1-652, default 652):\
  \ +2G\nCommand (m for help): \n```\n\n分区可以创建为主分区或扩展分区。主分区可以直接被格式化为文件系统，而扩展分区只能包含其他主分区。设置扩展分区的原因是单个存储设备上只能有四个分区。您可以通过创建多个扩展分区，然后在扩展分区内部创建主分区来扩展此限制。此示例创建了一个主存储设备，将其分配为存储设备上的第\
  \ 1 个分区，然后为其分配了 2GB 的存储设备空间。您可以再次使用 `p` 命令查看结果：\n\n```\nCommand (m for help): p\n\
  ```\n\nDisk `/dev/sdc`: 5368 MB, 5368946688 bytes\n\n255 磁头，63 扇区/道，652 柱面\n\n`Units\
  \ = cylinders of 16065 * 512 = 8225280 bytes`\n\n扇区大小（逻辑/物理）：`512 bytes / 512 bytes`\n\
  \nI/O 大小（最小/最优）：`512 bytes / 512 bytes`\n\n磁盘标识符：`0x4beedc66`\n\n| 设备 | 启动 | 开始\
  \ | 结束 | 块 | Id | 系统 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| `/dev/sdc1`\
  \ | | 1 | 262 | 2104483+ | 83 | Linux |\n\n现在输出中存储设备上有一个分区（称为 `/dev/sdc1`）。`Id`\
  \ 条目定义了 Linux 如何处理该分区。`fdisk` 允许创建许多分区类型。使用 `l` 命令可以列出不同的类型。默认值为 `83`，定义了 Linux\
  \ 文件系统。如果您想为不同的文件系统（如 Windows NTFS）创建分区，请选择不同的分区类型。您可以重复此过程来分配存储设备上的剩余空间。在创建所需的分区后，使用\
  \ `w` 命令将更改保存到存储设备：\n\n```\nCommand (m for help): w\n```\n\n分区表已更改！正在调用 `ioctl()`\
  \ 重新读取分区表。正在同步磁盘。\n\n```\n现在您已经在存储设备上有一个分区了，准备好使用 Linux 文件系统对其进行格式化了。\n```\n\n###\
  \ 注意事项\n有时创建新磁盘最困难的部分是尝试在系统中找到物理磁盘。Linux 使用标准格式为硬盘分配设备名称，但您需要熟悉该格式。对于旧的 IDE 驱动，Linux\
  \ 使用 `/dev/hdx`，其中 `x` 是根据驱动器顺序的字母（第一个为 `a`，第二个为 `b`，依此类推）。对于较新的 SATA 和 SCSI 驱动，Linux\
  \ 使用 `/dev/sdx`，其中 `x` 是根据驱动器顺序的字母（第一个为 `a`，第二个为 `b`，以此此类推）。在格式化之前，双重检查确保您引用的是正确的硬盘始终是一个好主意！\n\
  \n# 创建文件系统\n\n在分区上存储数据之前，您必须将其格式化为文件系统，以便 Linux 使用它。每个文件系统都使用自己的命令行程序来格式化分区。\n\n\
  ### 创建文件系统的命令行程序\n| 工具 | 目的 |\n| :--- | :--- |\n| `mkfs` | 创建 ext 文件系统。 |\n| `m2fs`\
  \ | 创建 ext2 文件系统。 |\n| `mkfs.ext3` | 创建 ext3 文件系统。 |\n| `mkfs.ext4` | 创建 ext4 文件系统。\
  \ |\n| `kreiserfs` | 创建 ReiserFS 文件系统。 |\n| `jfs` | 创建 JFS 文件系统。 |\n| `mkfs.xfs`\
  \ | 创建 XFS 文件系统。 |\n\n每个文件系统命令都有许多命令行选项，允许您自定义在分区中创建文件系统的方式。要查看所有命令行选项，可以使用 `man`\
  \ 命令显示文件系统的手册页（参见第 2 章）。所有的文件系统命令都允许您使用不带选项的简单命令创建默认文件系统：\n\n```\n$ sudo mkfs.ext4\
  \ /dev/sdc1\n```\n\n```\nm2fs 1.41 (14-Mar-2010)\nFilesystem label=\nOS type: Linux\n\
  Block size=4096 (log=2)\nFragment size=4096 (log=2)\nStride=0 blocks, Stripe width=0\
  \ blocks\n131648 inodes, 526120 blocks\n26306 blocks (5.00%) reserved for the super\
  \ user\nFirst data block=0\nMaximum filesystem blocks=54106216\n17 block groups\n\
  32768 blocks per group, 32768 fragments per group\n7744 inodes per group\nSuperblock\
  \ backups stored on blocks: 32768, 98304, 163840, 229376, 294912\nWriting inode\
  \ tables: done\nCreating journal (16384 blocks): done\nWriting superblocks and filesystem\
  \ accounting information: done\nThis filesystem will be automatically checked every\
  \ 34 mounts or 180 days, 以先到者为准。使用 `tune2fs -c` 或 `-i` 来覆盖。\n```\n\n新文件系统使用 `ext4`\
  \ 文件系统类型，这是 Linux 中的日志文件系统。注意，创建过程的一部分是创建新的日志。\n\n为分区创建文件系统后，下一步是将其挂载到虚拟目录中的一个挂载点上，这样您就可以在新文件系统中存储数据了。您可以在虚拟目录中任何需要额外空间的地方挂载新文件系统。\n\
  \n```\n$ sudo mkdir /mnt/testing\n$ sudo mount -t ext4 /dev/sdb1 /mnt/testing\n\
  $ ls -al /mnt/testing\n```\n\n```\ntotal 24\ndrwxr-xr-x 3 root root 4096 2010-09-25\
  \ 19:25 .\ndrwxr-xr-x 3 root root 4096 2010-09-25 19:38 ..\ndrwx------ 2 root root\
  \ 16384 2010-09-25 19:25 lost+found\n```\n\n`mkdir` 命令在虚拟目录中创建挂载点，`mount` 命令将新的硬盘分区添加到挂载点上。现在您可以在新分区上保存新文件和文件夹了！\n\
  \n#### 警告\n这种挂载文件系统的方法只是临时挂载。当您重启 Linux 系统时，文件系统将被自动挂载。要强制 Linux 在启动时自动挂载新文件系统，请将新文件系统添加到\
  \ `/etc/fstab` 文件中。\n\n\n\n\n\n`fsck` 命令用于检查和修复任何类型的 Linux 文件系统，包括本章之前讨论的所有系统——`ext`、`ext2`、`ext3`、`ext4`、`ReiserFS`、`JFS`\
  \ 和 `XFS`。命令格式如下：\n\n```\nfsck options filesystem\n```\n\n你可以在命令行中列出多个文件系统项进行检查。可以使用设备名称、虚拟目录中的挂载点或分配给文件系统的特殊\
  \ Linux UUID 值。\n\n`fsck` 命令使用 `/etc/fstab` 文件自动确定系统中通常挂载的存储设备上的文件系统。如果存储设备没有正常挂载（例如，你刚刚在新的存储设备上创建了文件系统），则需要使用\
  \ `-t` 命令行选项来指定文件系统类型。表 7.4 列出了其他可用的命令行选项。\n\n### 表 7.4 fsck 命令行选项\n\n| 选项 | 说明\
  \ |\n| :--- | :--- |\n| `-a` | 如果检测到错误，则自动修复文件系统。 |\n| `-A` | 检查 `/etc/fstab` 文件列出的所有文件系统。\
  \ |\n| `-C` | 为支持该功能的文件系统显示进度条（仅 `ext2` 和 `ext3`）。 |\n| `-N` | 不运行检查，仅显示将执行哪些检查。\
  \ |\n| `-r` | 发现错误时提示修复。 |\n| `-R` | 使用 `-A` 选项时跳过根文件系统。 |\n| `-s` | 如果检查多个文件系统，则逐一执行检查。\
  \ |\n| `-t` | 指定要检查的文件系统类型。 |\n| `-T` | 启动时不显示页头信息。 |\n| `-V` | 在检查期间产生详细输出。 |\n\
  | `-y` | 如果检测到错误，则自动修复文件系统。 |\n\n你可能会发现某些命令行选项是冗余的。这是在尝试为多个命令实现通用前端时出现的问题之一。某些单独的文件系统修复命令具有可以使用的额外选项。如果你需要进行更高级的错误检查，将需要查看各个文件系统修复工具的帮助页（man\
  \ pages），以查看是否有特定于该文件系统的扩展选项。\n\n#### 警告\n\n你只能在未挂载的文件系统上运行 `fsck` 命令。对于大多数文件系统，你只需要卸载该文件系统进行检查，完成后重新挂载即可。然而，由于根文件系统包含了所有的核心\
  \ Linux 命令和日志文件，你无法在运行中的系统中卸载它。\n\n这时使用 Linux LiveCD 就派上用场了！只需使用 LiveCD 启动系统，然后在根文件系统上运行\
  \ `fsck` 命令即可！\n\n## 逻辑卷管理器\n\n如果你使用硬盘上的标准分区创建文件系统，尝试为现有文件系统添加额外空间可能会是一个相当痛苦的经历。你只能在同一块物理硬盘的可用空间范围内扩展分区。如果该硬盘上没有更多可用空间，你就只能去买一个更大的硬盘，并手动将现有文件系统移动到新硬盘上。\n\
  \n我们需要一种方法，通过仅从另一个硬盘添加一个分区到现有文件系统，来动态地为现有文件系统添加更多空间。Linux 逻辑卷管理器（LVM）软件包允许你实现这一操作。它为你提供了一种简单的方法，让你可以在\
  \ Linux 系统上操作磁盘空间，而无需重建整个文件系统。\n\n### 逻辑卷管理布局\n\n逻辑卷管理的核心在于它如何处理安装在系统上的物理硬盘分区。在逻辑卷管理世界中，硬盘被称为物理卷（`PV`）。每个\
  \ `PV` 映射到硬盘上创建的特定物理分区。\n\n多个 `PV` 元素组合在一起创建一个卷组（`VG`）。逻辑卷管理系统将 `VG` 视为物理硬盘，但实际上，`VG`\
  \ 可能由分布在多个硬盘上的多个物理分区组成。`VG` 为创建逻辑分区提供了一个平台，而逻辑分区实际上包含了文件系统。\n\n结构中的最后一层是逻辑卷（`LV`）。`LV`为\
  \ Linux 创建文件系统提供了分区环境，就 Linux 而言，它的作用类似于物理硬盘分区。Linux 系统对待 `LV` 的方式就像对待物理分区一样。你可以使用任何标准\
  \ Linux 文件系统来格式化 `LV`，然后将其添加到 Linux 虚拟目录中的挂载点。\n\n图 7.1 显示了典型的 Linux 逻辑卷管理环境的基本布局。\n\
  \n图 7.1 逻辑卷管理环境\n\n![7.1](img/c07f001.jpg)\n\n图 7.1 所示的卷组跨越了三个独立的物理硬盘，涵盖了五个独立的物理分区。卷组内部有两个独立的逻辑卷。Linux\
  \ 系统对待每个逻辑卷就像对待物理分区一样。每个逻辑卷都可以格式化为 `ext4` 文件系统，然后挂载到虚拟目录中的特定位置。\n\n注意图 7.1 中第三块物理硬盘有一个未使用的分区。使用逻辑卷管理，你可以在以后轻松地将此未使用的分区分配给现有的卷组，然后使用它来创建一个新的逻辑卷，或者在需要更多空间时将其添加以扩展现有的逻辑卷之一。\n\
  \n同样，如果你向系统添加了新硬盘，本地卷管理系统允许你将其添加到现有的卷组中，然后为现有的逻辑卷之一创建更多空间，或者启动一个新的逻辑卷进行挂载。这是一种处理扩展文件系统好得的方法！\n\
  \n### Linux 中的 LVM\n\nLinux LVM 由 Heinz Mauelshagen 开发，并于 1998 年发布给 Linux 社区。它允许你使用简单的命令行在\
  \ Linux 中管理完整的逻辑卷管理环境。\n\n有两个版本的 Linux LVM 可用：\n\n*   `LVM1`：1998 年发布的原始 LVM 软件包，仅在\
  \ 2.4 Linux 内核可用。它只提供基本的逻辑卷管理功能。\n*   `LVM2`：LVM 的更新版本，在 2.6 Linux 内核可用。它在标准 LVM1\
  \ 功能的基础上提供了额外功能。\n\n大多数使用 2.6 内核版本的现代 Linux 发行版都支持 `LVM2`。除了标准的逻辑卷管理功能外，`LVM2` 还为你提供了其他供你在\
  \ Linux 系统中使用的优秀功能。\n\n#### 快照\n\n原始的 Linux LVM 允许你在逻辑卷激活状态下将现有逻辑卷复制到另一个设备。此功能称为快照。快照对于备份由于高可用性要求而无法锁定的数据非常有用。传统的备份方法在文件复制到备份介质时通常会锁定文件。快照允许你在执行复制的同时继续运行关键任务的\
  \ Web 服务器或数据库服务器。遗憾的是，LVM1 仅允许你创建只读快照。一旦创建了快照，你就无法向其写入。\n\n`LVM2` 允许你为激活的逻辑卷创建读写快照。通过这个读写副本，你可以移除原始逻辑卷并挂载快照作为替换。此功能对于快速故障转移，或者对于尝试那些可能会修改数据（并在发生故障时可能需要恢复）的应用非常有用。\n\
  \n\n\n\n\nLVM2 提供的另一个有趣功能是条带化（striping）。通过条带化，可以在多个物理硬盘上创建一个逻辑卷。当 Linux LVM 向该逻辑卷写入文件时，文件中的数据块会分散在多个硬盘上。每个连续的数据块块都会被写入下一块硬盘。\n\
  \n条带化有助于提高磁盘性能，因为 Linux 可以同时向多个硬盘写入一个文件的多个数据块，而不需要等待单个硬盘将读/写头移动到不同的位置。这种改进也适用于顺序访问文件的读取，因为\
  \ LVM 可以同时从多个硬盘上读取数据。\n\n#### 警告\n\nLVM 条带化与 RAID 条带化不同。LVM 条带化不提供校验项，而校验项是创建容错环境的关键。事实上，LVM\
  \ 条带化可能会增加因硬盘故障导致文件丢失的概率。单个磁盘故障可能导致多个逻辑卷无法访问。\n\n### 镜像（Mirroring）\n\n仅仅因为使用 LVM\
  \ 安装了文件系统，并不意味着文件系统仍然不会出问题。就像物理分区一样，LVM 逻辑卷也受到断电和磁盘崩溃的影响。一旦文件系统损坏，始终可能无法恢复它。\n\n\
  LVM 快照过程提供了一种心理安慰，因为你随时可以创建逻辑卷的备份副本，但对于某些环境来说，这可能还不够。具有大量数据变化的系统（例如数据库服务器）自上次快照以来可能存储了数百或数千条记录。\n\
  \n解决问题的方案是 LVM 镜像。镜像是逻辑卷的完整副本，并实时更新。当你创建镜像逻辑卷时，LVM 会将原始逻辑卷同步到镜像副本。根据原始逻辑卷的大小，这可能需要一些时间完成。\n\
  \n一旦原始同步完成，LVM 会为文件系统中的每个写入过程执行两次写入——一次写入主逻辑卷，一次写入镜像副本。正如你所猜的，这个过程确实会减慢系统的写入性能。然而，如果原始逻辑卷由于某种原因变得损坏，你手头就有一个完整且最新的副本！\n\
  \n## 使用 Linux LVM\n\n现在你已经了解了 Linux LVM 能够做什么，本节将讨论如何实现它来帮助组织你系统上的磁盘空间。Linux LVM\
  \ 软件包仅提供了命令行程序，用于创建和管理逻辑卷管理系统中的所有组件。某些 Linux 发行版包含了命令行命令的图形化前端，但为了完全控制你的 LVM 环境，最好习惯直接使用命令操作。\n\
  \n### 定义物理卷（Physical Volumes）\n\n该过程的第一步是将硬盘上的物理分区转换为 Linux LVM 使用的物理卷范围（physical\
  \ volume extents）。我们的朋友 `fdisk` 命令将在此处提供帮助。在创建了基础 Linux 分区后，你需要使用 `t` 命令更改分区类型：\n\
  \n```\nCommand (m for help): t\nSelected partition 1\nHex code (type L to list codes):\
  \ 8e\nChanged system type of partition 1 to 8e (Linux LVM)\nCommand (m for help):\
  \ p\nDisk /dev/sdc: 2147 MB, 2147992064 bytes\n255 heads, 63 sectors/track, 261\
  \ cylinders\nUnits = cylinders of 16065 * 512 = 8225280 bytes\nDisk identifier:\
  \ 0x4bc26133\nDevice Boot      Start           End     Blocks    Id  System\n/dev/sdc1\
  \               1           261     2096451   8e Linux LVM\nCommand (m for help):\n\
  ```\n\n`8e` 分区类型表示该分区将用作 Linux LVM 系统的一部分，而不是直接作为文件系统，正如你之前看到的 `83` 分区类型那样。\n\n\
  下一步是使用该分区创建实际的物理卷。这通过 `pvcreate` 命令完成：\n\n```\n$ sudo pvcreate /dev/sdc1\nPhysical\
  \ volume \"/dev/sdc1\" successfully created\n```\n\n`pvcreate` 命令定义了用于 PV（物理卷）的物理卷。它只是简单地在\
  \ Linux LVM 系统中将分区标记为物理卷。如果你想查看过程中的进度，可以使用 `pvdisplay` 命令来显示你创建的物理卷列表。\n\n### 创建卷组（Volume\
  \ Groups）\n\n该过程的下一步是从物理卷创建一个或多个卷组。对于为你的系统需要创建多少个卷组没有设定的规则——你可以将所有可用物理卷添加到单个卷组中，也可以通过组合不同的物理卷创建多个卷组。\n\
  \n要从命令行创建卷组，你需要使用 `vgcreate` 命令。`vgcreate` 命令需要几个命令行参数来定义卷组名称，以及你用于创建卷组的物理卷名称：\n\
  \n```\n$ sudo vgcreate Vol1 /dev/sdc1\nVolume group \"Vol1\" successfully created\n\
  ```\n\n输出结果没什么兴奋的！如果你想查看有关新创建卷组的细节，请使用 `vgdisplay` 命令：\n\n```\n$ sudo vgdisplay\n\
  --- Volume group ---\nVG Name               Vol1\nSystem ID             \nID   \
  \                \nSize                   2.00 GB\nTotal PE / Count      4096 /\n\
  Free PE / Count       4096 /\nPE Size                512.00\nActive            \
  \    yes\n```\n\n### 创建逻辑卷（Logical Volumes）\n\n逻辑卷是 Linux 系统用于模拟分区的实体，并承载文件系统。现在你已经创建了一个或多个卷组，准备好创建逻辑卷了。\n\
  \n要创建逻辑卷，请使用 `lvcreate` 命令。虽然在其他 LVM 命令中你通常不需要使用命令行选项，但 `lvcreate` 命令至少需要输入一些选项。\n\
  \n\n\n\n虽然命令行选项看起来可能令人生畏，但对于大多数情况，你只需要少量选项即可完成：\n\n```bash\nsudo lvcreate -l 100%FREE\
  \ -n lvtest Vol1\n```\n逻辑卷 “lvtest” 已创建\n\n如果你想查看所创建内容的详细信息，请使用 `lvdisplay` 命令：\n\
  \n```bash\nsudo lvdisplay\n```\n```\n  --- Logical volume ---\n  LV Name       \
  \      /dev/Vol1/lvtest\n  VG Name             Vol1\n  LV UUID             usDxti-pAEj-fEIz-3kWV-LNAu-PFNx-2LGqNv\n\
  \  LV Write Access      read/write\n  LV Status           available\n  # open  \
  \             0\n  LV Size              2.00 GB\n  Current LE           511\n  Segments\
  \            1\n  Allocation          inherit\n  Read ahead sectors  auto\n  - currently\
  \ set to  256\n  Block device         253:2\n```\n\n现在你可以看到你创建了什么了！注意卷组名称（`Vol1`）用于在创建新的逻辑卷时识别要使用的卷组。\n\
  \n`-l` 参数定义了使用指定卷组中多少可用空间给逻辑卷。注意，你可以将该值指定为卷组中可用空间的百分比。此示例使用了所有（100%）可用空间来创建新的逻辑卷。\n\
  \n你可以使用 `-l` 参数按可用空间的百分比指定大小，或者使用 `-L` 参数按字节、千字节（KB）、兆字节（MB）或吉字节（GB）指定实际大小。`-n`\
  \ 参数允许你为逻辑卷提供名称（在本示例中称为 `lvtest`）。\n\n## 创建文件系统\n\n在运行 `lvcreate` 命令后，逻辑卷已经存在，但还没有文件系统。要执行此操作，你需要根据你想要创建的文件系统使用相应的命令行程序：\n\
  \n```bash\nsudo mkfs.ext4 /dev/Vol1/lvtest\n```\nmke2fs 1.41.9 (22-Aug-2009)\nFilesystem\
  \ label=\nOS type: Linux\nBlock size=4096 (log=2)\nFragment size=4096 (log=2)\n\
  130816 inodes, 523264 blocks\n26163 blocks (5.00%) reserved for the super user\n\
  First data block=0\nMaximum filesystem blocks=536870912\n16 block groups\n32768\
  \ blocks per group, 32768 fragments per group\n8176 inodes per group\nSuperblock\
  \ backups stored on blocks:\n      32768, 98304, 163840, 229376, 294912\nWriting\
  \ inode tables: done\nCreating journal (8192 blocks): done\nWriting superblocks\
  \ and filesystem accounting information: done\n此文件系统将在每 21 次挂载或 180 天后检查一次，以先者为准。使用\
  \ `tune2fs` 的 `-c` 或 `-i` 来覆盖。\n\n创建新的文件系统后，你可以使用标准的 Linux `mount` 命令将卷挂载到虚拟目录中，就像对待物理分区一样。唯一的区别是，使用一个识别逻辑卷的特殊路径：\n\
  \n```bash\nsudo mount /dev/Vol1/lvtest test\ncd test\nls -al\n```\n```\ntotal 24\n\
  drwxr-xr-x.  3 root root  4096 2010-09-17 17:36 .\ndrwx------. 33 rich rich  4096\
  \ 2010-09-17 17:37 ..\ndrwx------.  2 root root 16384 2010-09-17 17:36 lost+found\n\
  ```\n\n注意在 `mkfs.ext4` 和 `mount` 命令中使用的路径有点奇怪。路径没有使用物理分区路径，而是使用了卷组名称以及逻辑卷名称。一旦文件系统挂载，你就可以访问虚拟目录中的新区域。\n\
  \n## 修改 LVM\n\n由于使用 Linux LVM 的好处是可以动态修改文件系统，你可能预期会有一些工具允许你执行此操作。Linux 提供了一些工具允许你修改现有的逻辑卷管理配置。\n\
  \n如果你没有华丽的图形界面来管理你的 Linux LVM 环境，一切也并非全输。在本章中，你已经看到了一些 Linux LVM 命令行程序的操作。一旦安装了\
  \ LVM，你还有许多其他命令行程序可以用于管理 LVM 设置。表 7.6\n\n### LVM 命令\n\n| 命令 | 功能 |\n| :--- | :---\
  \ |\n| `vgchange` | 激活和取消激活卷组 |\n| `vgremove` | 卷组 |\n| `vgextend` | 向卷组添加物理卷 |\n\
  | `vgreduce` | 从卷组中移除物理卷 |\n| `lvext` | 增加逻辑卷的大小 |\n| `lvreduce` | 减小逻辑卷的大小 |\n\n\
  #### 警告\n\n在手动增加或减小逻辑卷大时要小心。存储在逻辑卷中的文件系统需要手动修复以处理。\n\n## 总结\n\n在 Linux 中操作存储设备需要你了解一些文件系统。了解如何从命令行创建和操作文件系统，在你维护系统时将非常帮助。本章讨论了如何从命令行处理文件系统。\n\
  \n\n\n\n在深入学习 Linux 软件包管理世界之前，本章将先介绍一些基础知识。每种主要的 Linux 发行版都使用某种形式的软件包管理系统（PMS）来控制软件应用程序和库的安装。PMS\
  \ 利用数据库来跟踪以下内容：\n\n* Linux 系统上安装了哪些软件包\n* 每个软件包安装了哪些文件\n* 已安装的每个软件包的版本\n\n软件包存储在称为“存储库”（repositories）的服务器上，并通过运行在你本地\
  \ Linux 系统上的 `PMS` 工具跨互联网访问。你可以使用 `PMS` 工具来搜索新的软件包，甚至可以搜索系统中已安装软件包的更新。\n\n一个软件软件包通常具有依赖关系，或者需要必须先安装其他才能运行的软件包，以便该软件能够正常运行。`PMS`\
  \ 工具将检测到这些依赖关系，并在安装目标软件包之前提供安装任何额外所需软件包的选项。\n\n`PMS` 的缺点是没有统一的标准工具。书中目前为止讨论的所有 `bash`\
  \ 终端命令无论你使用哪种 Linux 发行版都能运行，但软件软件包管理的情况并非如此。\n\n不同 Linux 发行版之间的 `PMS` 工具及其相关命令存在巨大差异。Linux\
  \ 世界中常用的两种主要 `PMS` 基础工具是 `dpkg` 和 `rpm`。\n\n基于 Debian 的发行版（如 Ubuntu 和 Linux Mint）在其\
  \ `PMS` 工具的基础上使用 `dpkg` 命令。该命令直接与 Linux 系统上的 `PMS` 交互，用于安装、管理和删除软件包。\n\n基于 Red Hat\
  \ 的发行版（如 Fedora、openSUSE 和 Mandriva）在其 `PMS` 基础上使用 `rpm` 命令。与 `dpkg` 命令类似，`rpm`\
  \ 命令可以列出已安装的软件包、安装新软件包并删除现有软件。\n\n注意，这两个命令是各自 `PMS` 的核心，而不是整个 `PMS` 本。许多使用 `dpkg`\
  \ 或 `rpm` 方法的 Linux 发行版这些基础命令的基础上构建了额外的特殊 `PMS` 工具，以帮助你的生活变得更容易。后续章节将介绍你在流行的 Linux\
  \ 发行版中遇到的各种 `PMS` 工具命令。\n\n# 基于 Debian 的系统\n\n`dpkg` 命令是 Debian 系 `PMS` 工具的核心。该\
  \ `PMS` 包含其他工具有：\n\n* `apt-get`\n* `apt-cache`\n* `aptitude`\n\n到目前为止最常用的命令行工具是\
  \ `aptitude`，这有其道理。`aptitude` 工具本质上是 `apt` 工具和 `dpkg` 的前端。虽然 `dpkg` 是一个 `PMS` 工具，但\
  \ `aptitude` 是一个完整的软件包管理系统。\n\n在命令行使用 `aptitude` 命令将帮助你避免常见的软件安装问题，例如缺少软件依赖、不稳定的系统环境以及大量不必要的麻烦。本节介绍如何从\
  \ Linux 命令行使用 `aptitude` 工具。\n\n## 使用 aptitude 管理软件包\n\nLinux 系统管理员面临的一项常见任务是确定系统中已经安装了哪些软件包。幸运的是，`aptitude`\
  \ 有一个实用的交互界面可以让可以让任务变得简单。\n\n在 shell 提示符处，输入 `aptitude` 并按回车。你将进入 `aptitude` 的全屏模式，如图\
  \ 8.1 所示。\n\n图 8.1 aptitude 主窗口\n\n![8.1](img/c08f001.jpg)\n\n使用方向键在菜单中移动。选择菜单选项\
  \ `Installed Packages`（已安装软件包）查看已安装的软件包。你会看到几组软件包，例如编辑器等。每个组后面都有一个括号内的数字，表示该组包含的软件包数量。\n\
  \n使用方向键高亮某个组并按回车键查看每个软件包子组。你将看到单个软件包的名称及其版本号。在单个软件包上按回车键可以非常详细的信息，例如软件包描述、主页、大小、维护者等。\n\
  \n查看完已安装的软件包后，按 `q` 退出显示。你可以返回方向键并使用回车键切换打开或关闭软件包及其子组。全部完成后，只需多次按 `q` 直到弹出屏幕“Really\
  \ quit Aptitude?”（真的要退出 Aptitude 吗？）。\n\n如果你已经熟悉系统中的软件包，并想快速显示特定软件包的详细信息，无需进入 `aptitude`\
  \ 的交互界面。你可以在命令行中将 `aptitude` 作为单命令使用：\n\n```\naptitude show package_name\n```\n\n\
  以下是显示软件包 `grub2-theme-mint` 详情示例：\n\n```\n$ aptitude show grub2-theme-mint\n\nPackage:\
  \ grub2-theme-mint\nNew: yes\nState: installed\nAutomatically installed: no\nVersion:\
  \ 1.0.3\nPriority: optional\nSection: misc\nMaintainer: Clement Lefebvre <root@linuxmint.com>\n\
  Uncompressed Size: 442k\nDescription: Grub2 theme for Linux Mint\n Grub2 theme for\
  \ Linux Mint\n$\n```\n\n**注意**：`aptitude show` 命令并不表示该软件包已安装在系统中。它仅显示来自软件存储库的详细软件包信息。\n\
  \n你无法通过 `aptitude` 获取与特定软件软件包相关的所有文件列表。要获取此列表，你需要使用 `dpkg` 工具本身：\n\n```\ndpkg -L\
  \ package_name\n```\n\n以下是用 `dpkg` 列出作为 `grub2-theme-mint` 软件包安装的所有文件的示例：\n\n```\n\
  $ dpkg -L grub2-theme-mint\n\n/.\n/boot\n/boot/boot\n/boot/boot/grub\n/boot/boot/grub/linuxmint.png\n\
  /boot/grub\n/boot/grub/linuxmint.png\n/usr\n/usr/share\n/usr/share/doc\n/usr/share/doc/grub2-theme-mint\n\
  /usr/share/doc/grub2-theme-mint/changelog.gz\n/usr/share/doc/grub2-theme-mint/copyright\n\
  /etc\n/etc/grub.d\n/etc/grub.d/06_mint_theme\n$\n```\n\n你也可以反过来操作——查找特定文件属于哪个软件包：\n\
  \n```\ndpkg --search absolute_file_name\n```\n\n注意，你需要使用绝对文件引用才能使其工作：\n\n```\n$\
  \ dpkg --search /boot/grub/linuxmint.png\ngrub2-theme-mint: /boot/grub/linuxmint.png\n\
  $\n```\n\n输出显示 [linuxmint.png](http://linuxmint.png) 文件是作为 `grub2-theme-mint` 软件包的一部分安装的。\n\
  \n## 使用 aptitude 安装软件包\n\n现在你已经更了解如何在系统中列出软件包软件包信息，本节将介绍软件包的安装过程。首先，你需要确定要安装的软件包名称。如何找到特定的软件软件包？使用带有搜索选项的\
  \ `aptitude` 命令：\n\n```\naptitude search package_name\n```\n\n搜索选项的之处在于你不需要需要在 `package_name`\
  \ 周围插入通配符。通配符是隐含的。以下是使用 `aptitude` 查找 `wine` 软件包的示例：\n\n```\n$ aptitude search wine\n\
  \np   gnome-wine-icon-theme          - red variation of the GNOME- ...\nv   libkwineffects1-api\
  \               - \np   libkwineffects1a                  - library used by effects...\n\
  p   q4wine                           - Qt4 GUI for wine (W.I.N.E) \np   shiki-wine-theme\
  \                 - red variation of the Shiki-\np   wine                      \
  \       - Windows Compatibility ...\np   wine-dev                         - Windows\
  \ Compatibility ...\np   wine-gecko                       - Windows Compatibility\
  \ ...\np   wine1.0                          - Windows Compatibility ...\np   wine1.0-dev\
  \                      - Windows Compatibility ...\np   wine1.0-gecko          \
  \          - Windows Compatibility ...\np   wine1.2                          - Windows\
  \ Compatibility ...\np   wine1.2-dbg                      - Windows Compatibility\
  \ ...\n```\n\n\n\n\n\n```\np   wine1.2-dev               - Microsoft Windows Compatibility\
  \ ...\np   wine1.2-gecko             - Microsoft Windows Compatibility ...\np  \
  \ winefish                   - LaTeX Editor based on Bluefish\n```\n\n注意，每个包名称之前是\
  \ `p` 或 `i`。如果你看到 `iu`，则意味着该包已安装在你的系统上。如果你看到 `pv`，则意味着它可用但尚未安装。正如上述列表所示，该系统目前没有安装\
  \ `wine`，但从软件仓库中获取该包。\n\n使用 `aptitude` 从存储库在系统上安装软件包非常简单：\n\n```\naptitude install\
  \ package_name\n```\n\n一旦你通过搜索选项找到了软件包名称，只需使用 `install` 选项将其输入到 `aptitude` 命令中即可：\n\
  \n```\n$ sudo aptitude install wine\n```\n\n将安装以下新软件包：\n\n  cabextract{a} esound-clients{a}\
  \ esound-common{a} gnome-exe-thumbnailer {a}\n  icoutils{a} imagemagick{a} libaudio2{a}\
  \ libaudiofile0{a} libcdt4{a}\n  libesd0{a} libgraph4{a} libgvc5{a} libilmbase6{a}\
  \ libmagickcore3-extra {a}\n  libmpg123-0{a} libnetpbm10{a} libopenal1{a} libopenexr6{a}\n\
  \  libpathplan4{a} libxdot4{a} netpbm{a} ttf-mscorefonts-installer{a}\n  ttf-symbol-replacement{a}\
  \ winbind{a} wine wine1.2{a} wine1.2-gecko{a}\n\n0 个软件包升级，27 个新安装，0 个删除，0 个未升级。\n\
  需要获取 0B/27.6MB 的存档。解压后将使用 121MB。\n你想要继续吗？[Y/n/?] Y\n\n正在预配置软件包 ... ...\n全部完成，无错误。\n\
  所有字体已下载并安装。\n正在为 `/usr/share/fonts/truetype/msttcorefonts` 更新 `fontconfig` 缓存\n\
  正在设置 `winbind` (2:3.5.4~dfsg-1ubuntu7) ...\n  * 启动 Winbind 进程 winbind [ OK ]\n正在设置\
  \ `wine` (1.2-0ubuntu5) ...\n正在设置 `gnome-exe-thumbnailer` (0.6-0ubuntu1) ...\n正在处理\
  \ `libc-bin` 的触发器 ...\nldconfig 延迟处理正在进行\n```\n\n### 注意事项\n在上述列表的 `aptitude` 命令之前，使用了\
  \ `sudo` 命令。`sudo` 命令允许你以 root 用户身份运行命令。你可以使用 `sudo` 命令来执行管理任务，例如安装软件。\n\n要检查安装是否处理正常，只需再次使用搜索选项。这次你应该会看到\
  \ `wine` 软件软件包前面列出了一个 `iu`，表示它已安装。\n\n你可能还会注意到，额外的软件包前面也带有 `iu`。这是因为 `aptitude`\
  \ 自动为我们解析了任何必要的包依赖关系，并安装了所需的额外库和软件包。这是许多包管理系统中都包含的一个非常棒的功能。\n\n### 使用 aptitude 更新软件\n\
  虽然 `aptitude` 帮助你避免安装软件时出现的问题，但尝试协调带有依赖关系的多个包更新可能会变得复杂。要安全地更新系统上存储库中任何新版本的所有软件包，请使用\
  \ `safe-upgrade` 选项：\n\n```\naptitude safe-upgrade\n```\n\n注意，此命令不接受软件包名称作为参数。这是因为\
  \ `safe-upgrade` 选项将所有已安装的包升级到存储库提供的最新版本，这对于系统的稳定性更安全。\n\n以下是运行 `aptitude safe-upgrade`\
  \ 命令的示例输出：\n\n```\n$ sudo aptitude safe-upgrade\n```\n\n以下软件包将被升级：\n  evolution\
  \ evolution-common evolution-plugins gsfonts libevolution xserver-xorg-video-geode\n\
  \n6 个软件包升级，0 个新安装，0 个删除，0 个未升级。 \n需要获取 9,312kB 的存档。解压后将使用 0B。\n你想要继续吗？[Y/n/?] Y\n\
  \nGet:1 http://us.archive.ubuntu.com/ubuntu/ maverick/main libevolution i386 2.30.3-1ubuntu4\
  \ [2,096kB]\n...\n准备替换 xserver-xorg-video-geode 2.11.9-2 (使用 .../xserver-xorg-video-geode_2.11.9-3_i386.deb)\
  \ ...\n正在解压替换 xserver-xorg-video-geode ...\n正在处理 `man-db` 的触发器 ...\n正在处理 `desktop-file-utils`\
  \ 的触发器 ...\n正在处理 `python-gmenu` 的触发器 ...\n...\n当前状态：0 个更新 [-6]。\n```\n\n还有其他不保守的软件升级选项可以可以使用：\n\
  * `aptitude full-upgrade`\n* `aptitude dist-upgrade`\n\n这些选项执行相同的任务，将所有软件包升级到最新版本。它们与\
  \ `safe-upgrade` 的不同之处在于，它们不会检查包之间的依赖关系。整个包依赖问题可能会变得非常糟糕。如果你不完全确定各种包的依赖关系，请坚持使用\
  \ `safe-upgrade` 选项。\n\n### 注意事项\n显然，运行 `aptitude` 的 `safe-upgrade` 选项是你应该经常做的事情，以保持你的系统处于最新。然而，在全新的安装发行版后运行它特别重要。通常情况下，自发行版的上次完整发布以来，发布了许多安全补丁和更新。\n\
  \n### 使用 aptitude 卸载软件\n使用 `aptitude` 移除软件包与安装和升级它们一样简单。你唯一需要做的真实选择是，之后是否保留软件的数据和配置文件。\n\
  \n要移除软件包但不保留数据和配置文件，请使用 `aptitude` 的 `remove` 选项。要移除软件包以及相关数据和配置文件，请使用 `purge` 选项：\n\
  \n```\nsudo aptitude purge wine\n```\n\n[sudo] 用户的密码：\n以下软件包将被移除：\n  cabextract{a}\
  \ esound-clients{a} esound-common{a} gnome-exe-thumbnailer {a}\n  icoutils{a} imagemagick{a}\
  \ libaudio2{a} libaudiofile0{a} libcdt4{a}\n  libesd0{a} libgraph4{a} libgvc5{a}\
  \ libilmbase6{a} libmagickcore3-extra {a}\n  libmpg123-0{a} libnetpbm10{a} libopenal1{a}\
  \ libopenexr6{a}\n  libpathplan4{a} libxdot4{a} netpbm{a} ttf-mscorefonts-installer{a}\n\
  \  ttf-symbol-replacement{a} winbind{a} wine wine1.2{a} wine1.2-gecko{a}\n\n0 个软件包升级，0\
  \ 个新安装，27 个删除，0 个未升级。\n需要获取 0B/27.6MB 的存档。解压后将释放 121MB。\n你想要继续吗？[Y/n/?] Y\n\n(正在读取数据库\
  \ ... 目前安装 12098 个文件和目录。)\n正在移除 `ttf-mscorefonts-installer` ...\n...\n正在处理 `fontconfig`\
  \ 的触发器 ...\n正在处理 `ureadahead` 的触发器 ...\n正在处理 `python-support` 的触发器 ...\n```\n\n\
  要检查软件包是否已移除，只需再次使用 `aptitude` 搜索选项。如果你在软件包前面看到一个 `c`，意味着软件已被移除，但配置文件尚未从系统中清除。`p`\
  \ 表示配置文件也已被移除。\n\n\n\n\n\n# 请访问 http://help.ubuntu.com/community/UpgradeNotes 了解如何升级到发行版的更高版本。\n\
  \n```\ndeb http://us.archive.ubuntu.com/ubuntu/ maverick main restricted\ndeb-src\
  \ http://us.archive.ubuntu.com/ubuntu/ maverick main restricted\n```\n\n## 发行版最终发布后的重大错误修复更新。\n\
  \n```\ndeb http://us.archive.ubuntu.com/ubuntu/ maverick-updates main restricted\n\
  deb-src http://us.archive.ubuntu.com/ubuntu/ maverick-updates main restricted\n\
  ```\n\n## 第三方软件\n### 此软件不是 Ubuntu 的一部分，而是想要提供其最新软件的第三方开发者提供的。\n\n```\ndeb http://extras.ubuntu.com/ubuntu\
  \ maverick main\ndeb-src http://extras.ubuntu.com/ubuntu maverick main\ndeb http://security.ubuntu.com/ubuntu\
  \ maverick-security main restricted\ndeb-src http://security.ubuntu.com/ubuntu maverick-security\
  \ main restricted\ndeb http://security.ubuntu.com/ubuntu maverick-security universe\n\
  deb-src http://security.ubuntu.com/ubuntu maverick-security universe\ndeb http://security.ubuntu.com/ubuntu\
  \ maverick-security multiverse\ndeb-src http://security.ubuntu.com/ubuntu maverick-security\
  \ multiverse\n```\n\n`$`\n\n首先，注意该文件充满了许多有用的注释和警告。指定的存储库源使用以下结构：\n\n`deb (or deb-src)\
  \ address distribution_name package_type_list`\n\n`deb` 或 `deb-src` 值表示软件包的类型。`deb`\
  \ 值表示它是已编译程序的源，而 `deb-src` 值表示它是源代码的源。\n\n`address` 条目是软件库的 Web 地址。`distribution_name`\
  \ 条目是该特定软件库发行版版本的名称。在示例中，发行版名称为 `maverick`。这并不意味着你运行的发行版一定是 Ubuntu 的 Maverick Meercat；它只是意味着\
  \ Linux 发行版正在使用 Ubuntu Maverick Meercat 的软件库！例如，在 Linux Mint 的 `sources.list` 文件中，你将看到\
  \ Linux Mint 和 Ubuntu 软件库的混合。\n\n最后，`package_type_list` 条目可能包含多个单词，表示该库中包含什么类型的软件包。例如，你可能会看到如\
  \ `main`、`restricted`、`universe` 或 `partner` 等值。\n\n当你需要向源文件添加软件库时，你可以尝试自己摸索，但这很可能会导致问题。通常，软件库网站或各种软件包开发者网站会有一行精确的文本，你可以从它们的网站上复制并粘贴到你的\
  \ `sources.list` 文件中。最好的方法是选择更安全的路径，直接复制/粘贴。\n\n前端界面 `aptitude` 为处理基于 Debian 的 `dpkg`\
  \ 工具提供了智能命令行选项。现在是时候查看一下基于 Red Hat 的发行版的 `rpm` 工具及其各种前端界面了。\n\n## 基于 Red Hat 的系统\n\
  与基于 Debian 的发行版一样，基于 Red Hat 的系统也有几种不同的前端工具可用。常用的工具有：\n\n* `yum`: 用于 Red Hat 和 Fedora\n\
  * `urpm`: 用于 Mandriva\n* `zypper`: 用于 openSUSE\n\n这些前端都基于 `rpm` 命令行工具。接部分将讨论如何使用这些各种基于\
  \ `rpm` 的工具来管理软件包。重点将放在 `yum` 上，也会包含 `zypper` 和 `urpm` 的信息。\n\n### 列出已安装的软件包\n要找出系统中当前安装了哪些内容，在\
  \ shell 提示符下输入以下命令：\n\n`yum list installed`\n\n信息可能会在屏幕上飞闪而过，因此最好是将已安装软件列表重定向到文件中。然后你可以使用\
  \ `more` 或 `less` 命令（或 GUI 编辑器）以受控的方式查看列表。\n\n```\nyum list installed > installed_software\n\
  ```\n\n要列出你的 openSUSE 或 Mandriva 发行版上安装的软件包，请参见表 8.1 中的命令。遗憾的是，Mandriva 中使用的 `urpm`\
  \ 工具无法生成当前安装的软件列表。因此，你需要回到底层的 `rpm` 工具。\n\n表 8.1 如何使用 zypper 和 urpm 列出已安装软件\n\n\
  | 发行版 | 前端工具 | 命令 |\n| :--- | :--- | :--- |\n| Mandriva | `urpm` | `rpm -qa > installed_software`\
  \ |\n| openSUSE | `zypper` | `zipper search -s` |\n\n要查找特定软件包的详细信息，`yum` 真正大显身手。它不仅会给你软件包的详细描述，通过另一个简单的命令，你还可以查看软件包是否已安装：\n\
  \n```\nyum list xterm\n```\n\n`$`\n`yum list xterm`\n`Loaded plugins: langpacks,\
  \ presto, refresh-kit`\n`Adding en_US to language list`\n`fedora/metalink | 20 kB\
  \ 00:00`\n`fedora | 4.3 kB 00:00`\n`fedora/primary_db | 11 MB 01:57`\n`updates/metalink\
  \ | 16 kB 00:00`\n`updates | 4.7 kB 00:00`\n`updates/primary_db | 3.1 MB 00:30`\n\
  \n使用 `zypper` 和 `urpm` 列出软件信息的命令在表 8.2 中。\n\n| 细节 | 前端工具 | 命令 |\n| :--- | :--- |\
  \ :--- |\n| 软件包信息 | `urpm` | `rpm -qa` |\n| 是否已? | `urpm` | `rpm -q` |\n| 软件包信息\
  \ | `zypper` | `zipper search -s` |\n\n最后，如果你需要找出哪个软件提供了文件系统上的特定文件，`yum` 也可以做到！只需输入命令：\n\
  \n`yum provides /etc/issue`\n\n`$`\n`yum provides /etc/issue`\n`Loaded plugins:\
  \ langpacks, presto, refresh-kit`\n`Adding en_US to language list`\n`fedora/metalink\
  \ | 20 kB 00:00`\n`fedora | 4.3 kB 00:00`\n`fedora/primary_db | 11 MB 01:57`\n`updates/metalink\
  \ | 16 kB 00:00`\n`updates | 4.7 kB 00:00`\n`updates/primary_db | 3.1 MB 00:30`\n\
  \n## 使用 yum 安装软件\n使用 `yum` 安装软件包非常简单。以下是从存储库安装软件包及其所有所需依赖项的基础命令：\n\n`yum install\
  \ package_name`\n\n这里是安装 `xterm` 软件包的示例：\n\n```\n$\nsu -\nPassword:\n# yum install\
  \ xterm\n```\n\n`Loaded plugins: langpacks, presto, refresh-kit`\n`Adding en_US\
  \ to language list`\n`fedora/metalink | 20 kB 00:00`\n`fedora | 4.3 kB 00:00`\n\
  `fedora/primary_db | 11 MB 01:57`\n`updates/metalink | 16 kB 00:00`\n`updates |\
  \ 4.7 kB 00:00`\n`updates/primary_db | 3.1 MB 00:30`\n`Setting up Install Process`\n\
  `Resolving Dependencies`\n`--> Running transaction check`\n`---> Package xterm.i686\
  \ 0:261-2.fc14 set to be installed`\n`...`\n`Installed:`\n`xterm.i686 0:261-2.fc14`\n\
  `Complete!`\n\n### 注意\n在前面的列表中，`yum` 命令之前使用了 `su -` 命令。该命令允许你切换到 root 用户。在这个 Linux\
  \ 系统上，`#` 符号表示你以 root 身份登录。你应该只临时切换到 root 用户以执行管理任务，例如安装和更新软件。`sudo` 命令也是另一个选择。\n\
  \n你也可以手动下载 `rpm` 安装文件并使用 `yum` 安装它。这被称为本地安装。基础命令是：\n\n```\nyum localinstall package_name.rpm\n\
  ```\n\n你可以开始看到 `yum` 的优势之一是它使用了非常逻辑且易于用户的命令。\n\n\n\n\n\nTable 8.3 显示了如何使用 `urpm`\
  \ 和 `zypper` 执行包安装。你应该注意，如果你没有以 root 身份登录，使用 `urpm` 时将得到“command not found”的错误消息。\n\
  \nTable 8.3 如何使用 zypper 和 urpm 安装软件\n\n| 前端工具 | 命令 |\n| :--- | :--- |\n| `urpm`\
  \ | `urpmi package_name` |\n| `zypper` | `zypper install package_name` |\n\n# 使用\
  \ yum 更新软件\n\n在大多数 Linux 发行版中，当你远离图形界面（GUI）操作时，你会看到那些漂亮的小通知图标提示你有更新。但在命令行中，这需要多花一点精力。\n\
  \n要查看已安装软件包的所有可用更新列表，请输入以下命令：\n\n```\nyum list updates\n```\n\n如果此命令没有任何响应，那总是好的，因为这意味着你没有需要更新的内容！但是，如果你确实发现某个特定的软件包需要更新，请输入以下命令：\n\
  \n```\nyum update package_name\n```\n\n如果你想更新更新列表列出的所有软件包，只需输入以下命令：\n\n```\nyum\
  \ update\n```\n\n在 Mandriva 和 openSUSE 上更新软件包的命令列在 Table 8.4 中。当使用 `urpm` 时，软件库数据库会自动刷新，软件软件包也会被更新。\n\
  \nTable 8.4 如何使用 zypper & urpm 更新软件\n\n| 前端工具 | 命令 |\n| :--- | :--- |\n| `urpm`\
  \ | `urpmi --auto-update --update` |\n| `zypper` | `zypper update` |\n\n# 使用 yum\
  \ 卸载软件\n\n`yum` 工具还提供了一种简单的方法来卸载你系统上不再需要的软件。与 `aptitude` 一样，你需要选择是否保留软件包的数据和配置文件。\n\
  \n只需删除软件包并保留任何配置和数据文件，请使用以下命令：\n\n```\nyum remove package_name\n```\n\n要卸载软件及其所有文件，请使用\
  \ erase 选项：\n\n```\nyum erase package_name\n```\n\n你发现在 Table 8.5 中，使用 `urpm` 和\
  \ `zypper` 卸载软件同样简单。这两个工具都执行了与 `yum` 的 `erase` 选项相似的功能。\n\nTable 8.5 如何使用 zypper\
  \ 和 urpm 卸载软件\n\n| 前端工具 | 命令 |\n| :--- | :--- |\n| `urpm` | `urpme package_name`\
  \ |\n| `zypper` | `zypper remove package_name` |\n\n虽然使用 PMS 软件包生活变得容易得多，但并非总是一无问题的。偶尔还是还是会出错。幸运的是，有帮助方法。\n\
  \n## 处理损坏的依赖关系\n\n有时当多个软件软件包被加载时，一个软件包的软件依赖可能会被另一个软件包的安装所覆盖。这被称为依赖损坏。\n\n如果这种情况在你的系统上发生，请首先尝试以下命令：\n\
  \n```\nyum clean all\n```\n\n然后尝试使用 `yum` 命令中的更新选项。有时，只需清理任何位置错误的文件就能有所帮助。\n\n如果这不能解决问题，请尝试以下命令：\n\
  \n```\nyum deplist package_name\n```\n\n此命令显示该软件包的所有库依赖项以及哪个软件软件包提供了这些依赖项。一旦你知道了软件包所需的库，就可以安装它们。这里有一个确定\
  \ `xterm` 软件包依赖项的示例：\n\n```\n# yum deplist xterm \nLoaded plugins: langpacks, presto,\
  \ refresh-packagekit \nAdding en_US to language list \nFinding dependencies: \n\
  package: xterm.i686 261-2.fc14 \ndependency: libutempter.so.0 \nprovider: libutempter.i686\
  \ 1.1.5-4.fc12 \ndependency: rtld(GNU_HASH) \nprovider: glibc.i686 2.12.90-17 \n\
  provider: glibc.i686 2.12.90-21 \ndependency: libc.so.6(GLIBC_2.4) \nprovider: glibc.i686\
  \ 2.12.90-17 \nprovider: glibc.i686 2.12.90-21 \n...\ndependency: /bin/sh \nprovider:\
  \ bash.i686 4.1.7-3.fc14 \ndependency: libICE.so.6 \nprovider: libICE.i686 1.0.6-2.fc13\
  \ \ndependency: libXmu.so.6 \nprovider: libXmu.i686 1.0.5-2.fc13 \ndependency: libc.so.6(GLIBC_2.3)\
  \ \nprovider: glibc.i686 2.12.90-17 \nprovider: glibc.i686 2.12.90-21 \ndependency:\
  \ libXaw.so.7 \nprovider: libXaw.i686 1.0.6-4.fc12 \ndependency: libX11.so.6 \n\
  provider: libX11.i686 1.3.4-3.fc14 \ndependency: libc.so.6(GLIBC_2.2) \nprovider:\
  \ glibc.i686 2.12.90-17 \nprovider: glibc.i686 2.12.90-21 \n#\n```\n\n如果这还没有解决你的问题，你还有最后一个工具：\n\
  \n```\nyum update --skip-broken\n```\n\n`--skip-broken` 选项允许你忽略具有损坏依赖关系的软件包，并更新其他的软件软件包。这可能无法帮助损坏的软件包，但至少你可以更新系统上剩余的软件包！\n\
  \n在 Table 8.6 中，列出了使用 `urpm` 和 `zypper` 处理损坏依赖的尝试命令。对于 `zypper`，只有一个命令可以验证并修复损坏的依赖关系。对于\
  \ `urpm`，如果 clean 选项不起作用，你可以跳过对问题软件包的更新。要这样做，你必须将问题软件包的名称添加到 `/etc/urpmi/skip.list`\
  \ 文件中。\n\nTable 8.6 zypper 和 urpm 的损坏依赖\n\n|前端工具 | 命令 |\n| :--- | :--- |\n| `urpm`\
  \ | `urpmi --clean` |\n| `zypper` | `zypper verify` |\n\n# Yum 仓库\n\n就像 `aptitude`\
  \ 系统一样，`yum` 在安装时就设置了软件仓库。对于大多数用途，这些预装仓库将很好地满足你的需求。但当你以后需要从不同的仓库安装软件时，这里有一些你需要了解的内容。\n\
  \n> **提示**\n> 明智的系统管理员会坚持使用经过批准的仓库。经过批准的仓库是发行版官方网站认可的仓库。如果你开始添加未批准的仓库，你就会失去稳定性的保证。而且你会进入依赖损坏的领域。\n\
  \n要查看你当前从哪些仓库拉取软件，请输入以下命令：\n\n```\nyum repolist\n```\n\n如果你没有找到所需的获取软件的仓库，那么你需要进行一些配置文件的编辑。`yum`\
  \ 仓库定义文件位于 `/etc/yum.repos.d`。你需要添加正确的 URL 并获取任何必要的加密密钥的访问权限。\n\n\n\n\n\n在本示例中，我们将使用软件包\
  \ `sysstat`。`sysstat` 工具是一个非常优秀的软件包包，它提供了多种系统监控工具。\n\n首先，你需要将 `sysstat` tar 压缩包下载到你的\
  \ Linux 系统。虽然你通常可以在不同的 Linux 网站找到 `sysstat` 包，但最好的办法是直接去程序的源站。在这种情况下，就是网站 [`sebastien.godard.pagesperso-orange.fr/`](http://sebastien.godard.pagesperso-orange.fr/)。\n\
  \n如果你点击 `Download` 链接，将跳转到包含下载文件的页面。本文写作时的当前版本为 `9.1.5`，发行文件名为 `sysstat-9.1.5.tar.gz`。\n\
  \n点击链接将文件下载到你的 Linux 系统。下载完成后，你可以对其解压。\n\n要解压软件 tar 压缩包，请使用标准的 `tar` 命令：\n\n```bash\n\
  tar -zxvf sysstat-9.1.5.tar.gz\n```\n\n```text\nsysstat-9.1.5/\nsysstat-9.1.5/sar.c\n\
  sysstat-9.1.5/iostat.c\nsysstat-9.1.5/sadc.c\nsysstat-9.1.5/sa.h\nsysstat-9.1.5/iconfig\n\
  sysstat-9.1.5/CHANGES\nsysstat-9.1.5/COPYING\nsysstat-9.1.5/CREDITS\nsysstat-9.1.5/sa2.in\n\
  sysstat-9.1.5/README\nsysstat-9.1.5/crontab.sample\nsysstat-9.1.5/nls/\n...\nsysstat-9.1.5/nfsiostat.c\n\
  sysstat-9.1.5/sysstat-9.1.5.lsm\nsysstat-9.1.5/cifsiostat.c\nsysstat-9.1.5/nfsiostat.h\n\
  sysstat-9.1.5/cifsiostat.h\nsysstat-9.1.5/sysstat-9.1.5.spec\n```\n\n现在 tar 压缩包已经解压，文件已整齐地放入名为\
  \ `sysstat-9.1.5` 的目录中，你可以进入该目录继续操作。\n\n首先，使用 `cd` 命令进入新目录，然后列出目录内容：\n\n```bash\n\
  $ cd sysstat-9.1.5\n$ ls\n```\n\n```text\nactivity.c      INSTALL       prf_stats.h\
