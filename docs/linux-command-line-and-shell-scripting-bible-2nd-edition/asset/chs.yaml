  q` | 退出 `mysql` 程序。 |\n| `go` | `\\g` | 将命令发送到 MySQL 服务器。 |\n| `help` | `\\h` |\
  \ 显示帮助。 |\n| `nopager` | `\\n` | 禁用输出分页器并将输出发送到 STDOUT。 |\n| `note` | `\\t` | 不将输出发送到文件。\
