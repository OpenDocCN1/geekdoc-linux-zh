  \ ‘help;’ 或 ‘\\h’ 获取帮助。输入 ‘\\c’ 清除当前输入语句。\n\n```sql\nmysql>\n```\n\n`-p` 参数告诉 `mysql`\
  \ 程序提示输入密码以用于登录的用户账户。一旦您登录到服务器，就可以开始输入命令了。\n\n# mysql 命令\n\n`mysql` 程序使用两种不同类型的命令：\n\
  \n* 特殊 mysql 命令\n* 标准 SQL 语句\n\n`mysql` 程序使用其自己的命令集，让您能够轻松地控制环境并检索有关 MySQL 服务器的信息。表\
  \ 23.2 显示了这些命令。\n\n### 表 23.2 常用 mysql 命令\n\n| 命令 | 快捷键 | 描述 |\n| :--- | :--- |\
