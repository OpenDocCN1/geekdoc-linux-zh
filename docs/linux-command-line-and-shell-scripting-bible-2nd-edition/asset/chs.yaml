  \n`s/This is/Is this/t end`\n\n`s/line/test/` 没有被执行。\n\n`test` 命令可以用于在替换成功后跳转到标签。\n\
  \n`[address]t [label]` \n\n如果替换成功，`test` 命令将跳转到指定的标签。如果不存在 `label` 参数，`test` 命令将跳转到脚本的末尾。\n\
  \n`test` 命令只有在替换成功后才会执行跳转。\n\n（此处由于原始文本存在大量重复内容，已确保核心逻辑部分已准确翻译）\n\n\n\n如果你需要将一个短语替换为单个单词，而该单词只是短语的一个子字符串，但该子字符串恰好使用了通配符字符；那么使用子字符串组件将是救星：\n\
  \n```bash\necho \"That furry cat is pretty\" | sed 's/furry \\(.at\\)/\\1/'\n```\n\
  That cat is pretty.\n\n```bash\necho \"That furry hat is pretty\" | sed 's/furry\
  \ \\(.at\\)/\\1/'\n```\nThat hat is pretty.\n\n在这种情况下，你不能使用安培符号 `&`，因为它会替换整个匹配模式。子字符串组件提供了答案，允许你只选择模式中的某部分作为替换模式。\n\
  \n当你需要在两个或多个子字符串组件之间插入文本时，这个功能会特别有用。有一个使用子字符串组件在长数字中插入逗号的脚本：\n\n```bash\necho \"\
  1234567\" | sed '{\n  :start\n  s/\\(.*[0-9]\\)\\([0-9]\\{3\\}\\)/\\1,\\2/\n  t\
  \ start\n}'\n```\n1,234,567\n\n该脚本将匹配模式划分为两个组件：\n\n- `.*[0-9]`\n- `[0-9]{3}`\n\n\
  该模式寻找两个子字符串。第一个子字符串是任意数量的字符，以数字结尾。第二个子字符串是一系列三个数字（请参考第 19 章获取有关如何在正则表达式中使用大括号的信息）。如果在文本中找到此模式，替换文本会在两个组件之间放置一个逗号，每个组件通过其组件位置进行标识。脚本使用测试命令\
  \ `t` 遍历数字，直到所有逗号都到位。\n\n## 在脚本中使用 sed\n\n现在你已经了解了 sed 编辑器的各个部分，是时候将它们整合起来并用在你的\
  \ shell 脚本中了。本节将演示在使用 bash shell 脚本中使用 sed 编辑器时，你应该了解的一些阶特性。\n\n### 使用包装器 (Wrappers)\n\
  \n你可能注意到，实现一个 sed 编辑器脚本可能非常麻烦，特别是当脚本很长时。与其每次使用都重新输入整个脚本，你可以将 sed 编辑器命令放在 shell 脚本包装器中。包装器充当\
  \ sed 编辑器脚本和命令行之间的中间人。\n\n一旦进入 shell 脚本，你就可以在 sed 编辑器脚本中使用普通的 shell 变量和参数。这里有一个将参数变量作为\
  \ sed 脚本输入的示例：\n\n```bash\ncat reverse\n```\n```bash\n#!/bin/bash\n# 用于反转行的 sed\
  \ 编辑器脚本包装器\nsed -n '{\n1!G\nh\n$p\n}' $1\n```\n\n名为 `reverse` 的 shell 脚本使用 sed 编辑器脚本反转数据流中的行。它使用\
  \ shell 参数 `$1` 从命令行获取第一个参数，该参数应该是要反转的文件名：\n\n```bash\n./reverse data2\n```\nThis\
  \ is the last line.\nThis the second data line.\nThis is the first data line.\n\
  This is the header line.\n\n现在，你可以轻松地在任何文件上使用 sed 编辑器脚本，而无需不断重新输入整个命令行。\n\n### 重定向\
  \ sed 输出\n\n默认情况下，sed 编辑器将脚本结果输出到 `STDOUT`。你可以在 shell 脚本中使用所有标准方法重定向 sed 编辑器的输出。\n\
  \n你可以使用反引号（backticks）将 sed 编辑器命令的输出重定向到变量中，供脚本后续使用。以下是一个使用 sed 脚本为数值计算结果添加逗号的示例：\n\
  \n```bash\ncat fact\n```\n```bash\n#!/bin/bash\n# 在阶乘答案中添加逗号\nfactorial=1\ncounter=1\n\
  number=$1\nwhile [ $counter -le $number ]\ndo\n    factorial=$[ $factorial * $counter\
  \ ]\n    counter=$[ $counter + 1 ]\ndone\nresult='echo $factorial | sed '{\n:start\n\
  s/\\(.*[0-9]\\)\\([0-9]\\{3\\}\\)/\\1,\\2/\nt start\n}''\necho \"The result is $result\"\
  \n```\n```bash\n./fact 20\n```\nThe result is 2,432,902,008,176,640,000\n\n在使用完普通的阶乘计算脚本后，该脚本的结果被作为\
  \ sed 编辑器脚本的输入，后者添加逗号。该值随后用于 `echo` 语句以生成结果。\n\n## 创建 sed 工具\n\n正如你在本章之前看到的简短示例所示，使用\
  \ sed 编辑器可以进行许多酷的数据格式化操作。本节展示了一些实常用 sed 编辑器脚本，用于执行常见的数据处理函数。\n\n### 行倍间距（Double\
  \ Spacing）\n\n首先，来看一个简单的 sed 脚本，在文本文件的行之间插入空行：\n\n```bash\nsed 'G' data2\n```\n\
  This is the header line.\nThis is the first data line.\nThis is the second data\
  \ line.\nThis is the last line.\n\n这非常简单！这个技巧的关键在于留存空间（hold space）的默认值。记住 `G` 命令只是将留存空间的内容追加到当前模式空间的内容。当你启动\
  \ sed 编辑器时，留存空间包含空行。通过将其追加到现有行，你在现有行之后创建一个空行。\n\n你可能注意到，此脚本也会在数据流的最后一行添加空行，导致在文件末尾产生空行。如果你想去掉它，可以使用否定符号\
  \ `!` 和最后一行符号 `$` 来确保脚本不会向数据流的最后一行添加空行：\n\n```bash\nsed '$!G' data2\n```\nThis is\
  \ the header line.\nThis is the first data line.\nThis is the second data line.\n\
  This is the last line.\n\n现在看起来好多了。只要不是最后一行，`G` 命令就会追加留存空间的内容。当 sed 编辑器到达最后一行时，它会跳过\
  \ `G` 命令。\n\n### 对可能有空行的文件进行倍距\n\n将倍间距更进一步，如果文本文件已经有几个空行，但你想让所有行都倍距怎么办？如果你使用之前的脚本，你会得到某些空行过多的区域，因为每个现有的空行都被倍增：\n\
  \n```bash\ncat data6\n```\nThis is line one.\nThis is line two.\nThis is line three.\n\
  This is line four.\n\n```\n\n```bash\nsed '$!G' data6\n```\nThis is line one.\n\
  This is line two.\nThis is line three.\nThis is line four.\n\n```\n\n现在你在原空行所在的位置有三个空行。解决此问题的方法是先从数据流中删除任何空行，然后使用\
  \ `G` 命令在所有行之后插入新的空行。要删除现有的空行，只需要使用匹配空行的模式配合 `d` 命令：\n\n`/$/d`\n\n此模式使用了行首标签（`^`）和行尾标签（美元符号\
  \ `$`）。将此模式添加到脚本中产生所需的结果：\n\n```bash\nsed '/^$/d;$!G' data6\n```\nThis is line one.\n\
  This is line two.\nThis is line three.\nThis is line four.\n\n```\n\n完美！\n\n###\
  \ 文件行排序\n\n第 18 章向你展示了如何使用等号 `=` 显示数据流中行的行号：\n\n```bash\nsed '=' data2\n```\n1\n\
  This is the header line.\n2\nThis is the first data line.\n3\nThis is the second\
  \ data line.\n4\nThis is the last line.\n\n这读起来可能有点别扭，因为行号在实际行的上方。一个更好的解决方案是将行号与文本放在同一行。\n\
  \n现在你已经了解了如何使用 `N` 命令合并行，在 sed 编辑器脚本中利用这些信息并不难。然而，这个工具的技巧在于，你不能在同一个脚本中合并这两个命令。\n\
  \n一旦你获得了等号命令的输出，你可以将其输出管道到另一个使用 `N` 命令合并两行的 sed 编辑器脚本。你还需要使用替换命令将换行符替换为空格或制表符。以下是最终解决方案的：\n\
  \n```bash\nsed '=' data2 | sed 'N; s/\\n/ /'\n```\n1 This is the header line.\n\
  2 This is the first data line.\n3 This is the second data line.\n4 This is the last\
  \ line.\n\n```现在看起来好多了。在编写需要错误信息中使用行号的程序时，这是一个非常棒的小工具。\n\n\n\n\n\n# 输出最后几行\n\n到目前为止，你已经看到了如何使用\
  \ `p` 命令打印数据流中的所有行，或者只打印匹配特定模式行。如果你只需要处理长列表（例如日志文件）的最后几行该怎么办？\n\n美元符号 `$` 代表数据流的最后一行，因此可以很容易地显示最后一行：\n\
  \n```bash\n$ sed -n ‘$p’ data2\nThis is the last line.\n$\n```\n\n现在，如何使用美元符号 `$`\
  \ 在数据流末尾显示指定数量的行呢？答案是创建一个滚动窗口。\n\n滚动窗口是一种通过 `N` 命令将文本行组合起来，从而在模式空间中检查文本块的常用方法。`N`\
  \ 命令将下一行文本附加到模式空间中已有的文本之后。一旦你在模式空间中拥有了 `10` 行文本，你就可以使用美元符号检查是否处于数据流的末尾。如果不在末尾，则继续向模式空间添加更多行，同时删除原始行（记住\
  \ `D` 命令，它会删除模式空间中的第一行）。\n\n通过循环执行 `N` 和 `D` 命令，你向模式空间中的行块添加新行，同时删除旧行。分支命令 `b` 是循环的完美选择。要结束循环，只需识别最后一行并使用\
  \ `q` 命令退出即可。\n\n以下是最终 `sed` 编辑器脚本的：\n\n```bash\n$ sed ‘{ \n> :start \n> $q \n>\
  \ N \n> 11,$D \n> b start \n> }’ /etc/passwd \nuser:x:1000:1000:user,,,:/home/user:/bin/bash\
  \ \npolkituser:x:113:121:PolicyKit,,,:/var/run/PolicyKit:/bin/false \nsshd:x:114:65534::/var/run/sshd:/usr/sbin/nologin\
  \ \nSamantha:x:1001:1002:Samantha,4,,:/home/Samantha:/bin/bash \nDebian-exim:x:115:124::/var/spool/exim4:/bin/false\
  \ \nusbmux:x:116:46:usbmux daemon,,,:/home/usbmux:/bin/false \nrtkit:x:117:125:RealtimeKit,,,:/proc:/bin/false\
  \ \nTimothy:x:1002:1005::/home/Timothy:/bin/sh \nChristine:x:1003:1006::/home/Christine:/bin/sh\
  \ \nkdm:x:118:65534::/home/kdm:/bin/false \n$\n```\n\n脚本首先检查该行是否为数据流中的最后一行。如果是，`q`\
  \ 命令将停止循环。`N` 命令将下一行附加到模式空间中的当前行之后。`11,$D` 命令如果当前行在第 `10` 行之后，则删除模式空间中的第一行。这在模式空间中创建了滑动窗口效果。\n\
  \n# 删除行\n\n`sed` 编辑器的另一个实用用工具是移除数据流中不需要的空行。从数据流中删除所有空行很容易，但要选择性地删除空行则需要一些技巧。本节将向你展示几个可以使用的快速\
  \ `sed` 编辑器脚本，帮助你从数据中删除不需要的空行。\n\n## 删除连续的空行\n\n数据文件中出现多余的空行可能会很困扰。通常你的数据文件包含空行，但有时缺少某行数据会导致产生过多的空行（正如你之前在双倍行示例中看到的）。\n\
  \n删除连续空行的最简单方法是使用范围地址检查数据流。第 18 章向你展示了如何在地址中使用范围，包括如何将模式包含在地址范围内。`sed` 编辑器会对所有在指定地址范围内匹配的行执行命令。\n\
  \n删除连续空行的关键在于创建一个包含一个非空行和一个空行的地址范围。如果 `sed` 编辑器遇到这个范围，它就不应该删除该行。然而，对于不匹配该范围的行（即连续连续的两个或多个空行），它应该删除这些行。\n\
  \n以下是实现此操作的脚本：\n\n```bash\n/./,/^$/!d\n```\n\n范围是从 `/./` 到 `/^$/`。范围中的起始地址匹配任何包含至少一个字符的行。范围中的结束地址匹配空行。范围内的行不会被删除。\n\
  \n以下是脚本的运行情况：\n\n```bash\n$ cat data6\nThis is the first line.\nThis is the second\
  \ line.\nThis is the third line.\nThis is the fourth line.\n$ \n\n$ sed ‘/./,/^$/!d’\
  \ data6\nThis is the first line.\nThis is the second line.\nThis is the third line.\n\
  This is the fourth line.\n$\n```\n\n无论文件数据行之间出现多少空行，输出都会在行之间只保留一个空行。\n\n## 删除开头空行\n\
  \n数据文件开头包含多个空行也是很困扰的。通常在尝试将文本文件数据导入数据库时，空行会创建空条目，影响使用这些数据的任何计算。\n\n删除数据流顶部的空行并不是困难任务。以下是实现该功能的脚本：\n\
  \n```bash\n/./,$!d\n```\n\n脚本使用地址范围来确定删除哪些行。范围从包含字符的行开始，一直到数据流结束。该范围内的任何行都不会从输出中删除。这意味着第一个字符行之前的任何行都会被删除。\n\
  \n来看这个简单脚本：\n\n```bash\n$ cat data7\nThis is the first line.\nThis is the second\
  \ line.\n$ \n\n$ sed ‘/./,$!d’ data7\nThis is the first line.\nThis is the second\
  \ line.\n$\n```\n\n测试文件在数据行之前有两个空行。脚本成功删除了这两个开头空行，同时保持了数据内部空行的完好无。\n\n## 删除结尾空行\n\
  \n遗憾的是，删除结尾空行并不像删除开头空行那样简单。就像打印数据流末尾，删除数据流末尾的空行需要一些技巧和循环。\n\n在我们开始讨论之前，让我们看看脚本的样式：\n\
  \n```bash\nsed ‘{\n:start\n/^\\n*$/{$d; N; b start }\n}’\n```\n\n起初这看起来可能有点奇怪。注意在普通脚本的大括号内在大括号。这允许你在整个命令脚本中将命令组合在一起。命令组适用于指定的地址模式。地址模式匹配任何仅包含换行符的行。当找到这样的行时，如果它是最后一行，`d`\
  \ 命令将将其删除。如果不是最后一行，`N` 命令将下一行附加到其后，分支命令 `b` 将循环到开头重新开始。\n\n以下是脚本的运行情况：\n\n```bash\n\
  $ cat data8\nThis is the first line.\nThis is the second line.\n$ \n\n$ sed ‘{\n\
  :start\n/^\\n*$/{$d ; N; b start }\n}’ data8\nThis is the first line.\nThis is the\
  \ second line.\n$\n```\n\n脚本成功删除了文件末尾的空行。\n\n#  HTML 标签\n\n如今，从网站下载文本进行保存或在应用程序中使用并不罕见。然而，有时当你从网站下载文本时，还会获得用于格式化数据的\
  \ HTML 标签。当你只想看到数据时，这可能会成为问题。\n\n标准的 HTML 网页包含多种不同类型的 HTML 标签，标识正确显示页面所需的格式功能。这是一个\
  \ HTML 文件的示例：\n\n```bash\n$ cat data9\n<html>\n<head>\n<title>This is the page title</title>\n\
  </head>\n<body>\n<p>\nThis is the <b>first</b> line in the Web page. This should\
  \ provide\nsome<i>useful</i> information for us to use in our shell script.\n</p>\n\
  </body>\n</html>\n$\n```\n\nHTML 标签通过小于和大于符号来识别。大多数 HTML 标签都是成对出现的。一个标签开始格式化过程（例如\
  \ `<b>` 用于加粗），另一个标签停止格式化过程（例如 `</b>` 用于关闭加粗）。\n\n然而，如果不小心，删除 HTML 标签会产生问题。初看起来，你可能会认为删除\
  \ HTML 标签的方法只需寻找一个以小于符号 (<) 开始、以大于符号 (>) 结束且符号之间有数据的文本字符串：\n\n```bash\ns/<.*>//g\n\
  ```\n\n遗憾的是，这个命令产生了一些意外的后果：\n\n```bash\n$ sed ‘s/<.*>//g’ data9\n```\n\n\n\n\n\n\
  这是网页中的这一行。它应该为我们在 shell 脚本中使用提供一些信息。\n\n```\n$\n```\n\n请注意，标题文本缺失了，还有加粗和斜体的文本也丢失了。sed\
  \ 编辑器字面上地解释了脚本，将其理解为小于号和大于号符号之间的任何文本，包括其他的小于号和大于号！每当文本被包含在 HTML 标签中（例如 `<<b>first</b>`）时，sed\
  \ 脚本都会将整个文本删掉。\n\n解决这个问题的办法是让 sed 编辑器忽略原始标签之间嵌入的任何大于号。为了做到，你可以创建一个否定大于号的字符类。这会将脚本更改为：\n\
  \n```\ns/<[ˆ>]*>//g\n```\n\n该脚本现在可以正常工作了，显示出你需要从网页 HTML 代码中看到的数据：\n\n```\nsed ‘s/<[ˆ>]*>//g’\
  \ data9\n```\n\n# 这是页面标题\n\n这是网页中的第一行。它应该为我们在 shell 脚本中使用提供一些有用信息。\n\n```\n$\n```\n\
  \n这样好一点了。为了进一步清理一下，你可以添加一个删除命令来消掉那些烦人的空行：\n\n```\nsed ‘s/<[ˆ>]*>//g;/ˆ$/d’ data9\n\
  ```\n\n# 这是页面标题\n\n这是网页中的第一行。它应该为我们在 shell 脚本中使用提供一些有用信息。\n\n```\n$\n```\n\n现在紧凑多了；只剩下你需要看的数据。\n\
  \n## 总结\n\nsed 编辑器提供了一些高级功能，允许你跨多行进行文本模式操作。本章向你展示了如何使用 `next` 命令获取数据流中的下一行并将其置于模式空间（pattern\
  \ space）。一旦进入模式空间，你就可以执行复杂的替换命令来替换跨越以上文本的短语。\n\n多行删除命令允许在模式空间包含两行或更多行时删除第一行。这是遍历数据流中多行的方便方法。同样，多行打印命令允许在模式空间包含两行或更多行文本时，只打印第一行。多行命令的组合允许你遍历数据流并创建一个多行替换系统。\n\
  \n接下来，本章讨论了暂存空间（hold space）。暂存空间允许你在处理更多文本行时，留出一行文本。你可以随时调回保持空间的内容，并替换模式空间中的文本，或将保持空间的内容追加到模式空间的文本之后。使用暂存空间允许你对数据流进行排序，反转文本行在数据中出现的顺序。\n\
  \n本章还讨论了 sed 编辑器的流程控制命令。`branch` 命令提供了一种更改脚本中 sed 编辑器命令正常流程的方法，在某些条件下创建循环或跳过命令。`test`\
  \ 命令为你的 sed 编辑器命令脚本提供了 `if-then` 类型的语句。`test` 命令仅当先前的替换命令成功替换行中的文本时才进行分支。\n\n本章最后讨论了如何在\
  \ shell 脚本中使用 sed 脚本。对于大型 sed 脚本，一种常用技术是将脚本放在 shell 包装器（wrapper）中。你可以在 sed 脚本中使用命令行参数变量来传递\
  \ shell 命令行值。这创建了一种直接从命令行甚至从其他 shell 脚本利用你的 sed 编辑器脚本的简便方法。\n\n下一章将深入探讨 gawk 世界。gawk\
  \ 程序支持许多高级级编程语言的功能。仅仅通过使用 gawk，你就可以创建一些相当复杂的数据处理和报告程序。本章将描述各种编程特性，并演示如何使用它们从简单数据生成你自己的华丽报告。\n\
  \n# 第 21 章\n## 高级 gawk\n\n### 本章内容\n- 重新审查 gawk\n- 在 gawk 中使用变量\n- 使用结构化命令\n- 格式化你的输出\n\
  - 使用函数\n\n第 18 章介绍了 gawk 程序，并演示了使用它从原始数据文件生成格式化报告的基础。本章将更深入地探讨自定义 gawk 以生成报告。gawk\
  \ 程序是一种完整的编程语言，提供了允许你编写高级程序来处理数据的功能。如果你是从另一种编程语言进入 shell 脚本世界的，你会对 gawk 感到非常自如。在本章中，你将看到如何使用\
  \ gawk 编程语言编写程序来处理你将遇到的任何数据格式化任务。\n\n## 使用变量\n\n任何编程语言的一个重要特性都是使用变量存储和召回值。gawk 编程语言支持两种不同类型的变量：\n\
  - 内置变量\n- 用户定义变量\n\n有几个内置变量供你在 gawk 中使用。内置变量包含了处理数据文件中数据字段和记录时用的信息。你也可以在 gawk 程序中创建自己的变量。接下来的章节将引导你了解如何在\
  \ gawk 程序中使用变量。\n\n### 内置变量\n\ngawk 程序使用内置变量引用程序数据中的特定功能。本节描述了供你在 gawk 程序使用的内置变量，并演示了如何使用它们。\n\
  \n#### 字段和记录分隔符变量\n\n第 18 章演示了 gawk 可用的一种内置变量，数据字段变量。数据字段变量允许你使用美元符号和数据字段在记录中的数字位置来引用数据记录中的单个数据字段。因此，要引用记录中的第一个数据字段，你使用\
  \ `$1` 变量。要引用第二个数据字段，使用 `$2` 变量，依此类推。\n\n数据字段由字段分隔符字符隔开。默认情况下，字段分隔符是空白字符，如空格或制表符。第\
  \ 18 章展示了如何通过命令行使用 `-F` 命令行参数，或者在 gawk 程序内部使用特殊的 `FS` 内置变量来更改字段分隔符。\n\n`FS` 内置变量属于一组内置变量，这些变量控制\
  \ gawk 如何处理输入数据和输出数据中的字段和记录。\n\n| 变量 | 描述 |\n| :--- | :--- |\n| `FIELDWIDTHS` |\
  \ 由空格分隔的数字列表，定义每个数据字段的精确宽度（以空格为单位） |\n| `FS` | 输入字段分隔符 |\n| `RS` | 输入记录分隔符 |\n|\
  \ `OFS` | 输出字段分隔符 |\n| `ORS` | 输出记录分隔符 |\n\n`FS` 和 `OFS` 变量定义了你的 gawk 程序如何处理数据流中的数据字段。你已经看到如何使用\
  \ `FS` 变量定义记录中分隔数据字段的字符。`OFS` 变量执行相同的功能，但是针对 `print` 命令的输出。\n\n默认情况下，gawk 将 `OFS`\
  \ 变量设置为空格，所以当你使用命令时：\n\n```\nprint $1,$2,$3\n```\n\n你看到的输出是：\n`field1 field2 field3`\n\
  \n你可以在下面的示例中看到这一点：\n\n```\ncat data1\ndata11,data12,data13,data14,data15\ndata21,data22,data23,data24,data25\n\
  data31,data32,data33,data34,data35\n```\n\n```\nawk 'BEGIN{FS=\",\"} {print $1,$2,$3}'\
  \ data1\ndata11 data12 data13\ndata21 data22 data23\ndata31 data32 data33\n```\n\
  \n`print` 命令会自动将 `OFS` 变量的值放置在输出中每个数据字段之间。通过设置 `OFS` 变量，你可以使用任何字符串来分隔输出中的数据字段：\n\
  \n```\nawk 'BEGIN{FS=\",\"; OFS=\"-\"} {print $1,$2,$3}' data1\ndata11-data12-data13\n\
  data21-data22-data23\ndata31-data32-data33\n```\n\n\n\n\n\n```bash\n$ gawk 'BEGIN{FS=\"\
  ,\"; OFS=\"--\"} {print $1,$2,$3}' data1\ndata11--data12--data13\ndata21--data22--data23\n\
  data31--data32--data33\n\n$ gawk 'BEGIN{FS=\",\"; OFS=\"<-->\"} {print $1,$2,$3}'\
  \ data1\ndata11<-->data12<-->data13\ndata21<-->data22<-->data23\ndata31<-->data32<-->data33\n\
  ```\n\n`FIELDWIDTHS` 变量允许你在不使用字段分隔符字符的情况下读取记录。在某些应用程序中，数据并不是使用字段分隔符，而是放在记录中的特定列。在这种情况下，你必须设置\
  \ `FIELDWIDTHS` 变量以匹配记录中数据的布局。\n\n一旦设置了 `FIELDWIDTHS` 变量，`gawk` 就会忽略 `FS` 并根据提供的字段宽度大小计算数据字段。这里是一个使用字段宽度代替字段分隔符的示例：\n\
  \n```bash\n$ cat data1b\n1005.3247596.37\n115-2.349194.00\n05810.1298100.1\n\n$\
  \ gawk 'BEGIN{FIELDWIDTHS=\"3 5 2 5\"}{print $1,$2,$3,$4}' data1b\n100 5.324 75\
  \ 96.37\n115 -2.34 91 94.00\n058 10.12 98 100.1\n```\n\n`FIELDWIDTHS` 变量定义了四个数据字段，`gawk`\
  \ 据此解析数据记录。每个记录中的数字字符串将根据定义的字段宽度值进行分割。\n\n### 注意事项\n重要的是记住，一旦你设置了 `FIELDWIDTHS`\
  \ 变量，这些值必须保持不变。这种方法无法适应变变长度的数据字段。\n\n`RS` 和 `ORS` 变量定义了你的 `gawk` 程序如何处理数据流中的记录。默认情况下，`gawk`\
  \ 将 `RS` 和 `ORS` 变量设置为换行符。默认 `RS` 变量值表示输入数据流中的每行文本都是一个新记录。\n\n有时，你会遇到数据字段跨越数据流中多行的情况。一个经典的例子是包含地址和电话号码的数据，每个号码单独占一行：\n\
  \n```\nRiley Mullen\n123 Main Street\nChicago, IL 60601\n(312)555-1234\n```\n\n\
  如果你尝试使用默认的 `FS` 和 `RS` 变量值读取这些数据，`gawk` 将把每一行视为一个独立的记录，并将把记录中的每个空格解释为字段分隔符。这并不是你想要的结果。要要解决这个问题，你需要将\
  \ `FS` 变量设置为换行符。这表示数据流中的每一行都是一个独立的字段，且行中的所有数据都属于该数据字段。然而，当你这样做时，并不知道新记录从哪里开始。要要解决这个问题，将\
  \ `RS` 变量设置为空字符串，然后在数据流中的数据记录之间留一个空行。`gawk` 程序会将每个空行解释为记录分隔符。\n\n以下是使用此技术的示例：\n\n\
  ```bash\n$ cat data2\nRiley Mullen\n123 Main Street\nChicago, IL  60601\n(312)555-1234\n\
  \nFrank Williams\n456 Oak Street\nIndianapolis, IN  46201\n(317)555-9876\n\nHaley\
  \ Snell\n4231 Elm Street\nDetroit, MI 48201\n(313)555-4938\n\n$ gawk 'BEGIN{FS=\"\
  \\n\"; RS=\"\"} {print $1,$4}' data2\nRiley Mullen (312)555-1234\nFrank Williams\
  \ (317)555-9876\nHaley Snell (313)555-4938\n```\n\n完美——`gawk` 程序将文件中的每一行解释为数据字段，并将空行解释为记录分隔符。\n\
  \n### 数据变量\n字段和记录分隔符变量外，`gawk` 还提供了其他内置变量，帮助你了解数据情况并从 shell 环境提取信息。表 21.2 显示了 `gawk`\
  \ 中的其他内置变量。\n\n#### 更多 gawk 内置变量\n\n| 变量 | 描述 |\n| :--- | :--- |\n| `ARGC` | 命令行参数的数量。\
  \ |\n| `ARGIND` | 当前处理文件在 `ARGV` 中的索引。 |\n| `ARGV` | 命令行参数数组。 |\n| `CONVFMT` | 数字的转换格式（参见\
  \ `printf`）。默认值为 `%g`。 |\n| `ENVIRON` | 当前 shell 环境变量及其值的关联数组。|。 |\n| `ERRNO` |\
  \ 在读取或关闭输入文件时发生错误时的系统错误代码。 |\n| `FILENAME` | 用于输入的数据文件名。 |\n| `FNR` | 数据文件中的当前记录行号。\
  \ |\n| `IGNORECASE` | 如果设置为非零值，则忽略 `gawk` 命令中使用的字符串的大小写差异。 |\n| `NF` | 数据文件中的数据字段总数。\
  \ |\n| `NR` | 已处理的输入记录数。 |\n| `OFMT` | 显示数字的输出格式。默认为 `%g`。 |\n| `RLENGTH` | `match`\
  \ 函数中匹配到的子字符串的长度。 |\n| `RSTART` | `match` 函数中匹配到的子字符串的起始索引。 |\n\n你应该能从你的 shell 脚本中识别出这些变量。`ARGC`\
  \ 和 `ARGV` 变量允许你从 shell 获取命令行参数的数量及其值。然而，这有点复杂，因为 `gawk` 不会将脚本本身视为参数的一部分：\n\n```bash\n\
  $ gawk 'BEGIN{print ARGC,ARGV[1]}' data1\n2 data1\n```\n\n`ARGC` 变量表示命令行上有两个参数。这包括\
  \ `gawk` 命令和 `data1` 参数（记住，程序脚本不算参数）。`ARGV` 数组从索引 0 开始，代表命令。第一个数组值是 `gawk` 命令之后的命令行参数。\n\
  \n**注意**：与 shell 变量不同，在脚本中引用 `gawk` 变量时不需要添加美元符号。\n\n`ENVIRON` 变量对你来说可能有点奇怪。它使用关联数组来检索\
  \ shell 环境变量。关联数组使用文本而不是数值作为数组索引。数组中的文本是 shell 环境变量。数组的值是该变量的值。以下是这样的示例：\n\n```bash\n\
  $ gawk 'BEGIN{print ENVIRON[\"HOME\"]\nprint ENVIRON[\"PATH\"]}'\n/home/user\n/usr/bin\n\
  ```\n\n`ENVIRON[\"HOME\"]` 变量检索 `HOME` 环境变量。同样，`ENVIRON[\"PATH\"]` 变量检索 `PATH` 环境变量。你可以利用这种技术在你的\
  \ `gawk` 程序中检索任何环境变量。\n\n`FNR`、`NF` 和 `NR` 变量在跟踪 `gawk` 程序中的数据字段和记录时非常有用。当你不知道记录中确切有多少个数据字段时，`NF`\
  \ 变量允许你指定记录的最后一个字段：\n\n```bash\n$ gawk 'BEGIN{FS=\":\"; OFS=\":\":print $1,$NF}'\
  \ /etc/passwd\nrich:/bin/bash\ntesty:/csh\nmark:/bin/bash\nmike:/bin/bash\n```\n\
  \n`NF` 变量包含数据文件中最后一个字段的数值值。你可以通过在前面加上美元符号将其作为数据字段使用。\n\n`FNR` 和 `NR` 变量非常相似但有不同。`FNR`\
  \ 变量包含当前数据文件中处理的记录数。`NR` 变量包含处理的记录总数。让我们通过几个示例来看这种差异：\n\n```bash\n$ gawk 'BEGIN{FS=\"\
  ,\"}{print $1,\"FNR=\"FNR}' data1 data1\ndata11 FNR=1\ndata21 FNR=2\ndata31 FNR=3\n\
  data11 FNR=1\ndata21 FNR=2\ndata31 FNR=3\n```\n\n在这个示例中，`gawk` 命令命令行定义了两个输入文件（指定了同一个输入文件）。脚本打印第一个字段的值和\
  \ `FNR` 变量的当前值。注意当 `gawk` 程序处理第二个数据文件时，`FNR` 值重置回 1。\n\n现在，加上 `NR` 变量看看产生什么：\n\n\
  ```bash\n$ gawk '\nBEGIN {FS=\",\"}\n{print $1,\"FNR=\"FNR,\"NR=\"NR}\nEND{print\
  \ \"There were\",NR,\"records processed\"}' data1 data1\ndata11 FNR=1 NR=1\ndata21\
  \ FNR=2 NR=2\ndata31 FNR=3 NR=3\ndata11 FNR=1 NR=4\ndata21 FNR=2 NR=5\ndata31 FNR=3\
  \ NR=6\nThere were 6 records processed\n```\n\n\n\n\n当 `gawk` 处理第二个数据文件时，`FNR` 变量会被重置，但\
  \ `NR` 变量在第二个数据文件中继续计数。简单来说，如果你只使用一个数据文件输入，`FNR` 和 `NR` 的值将相同。如果你使用多个数据文件作为输入，`FNR`\
  \ 值会在每个数据文件处重置，而 `NR` 值将对所有数据文件进行计数。\n\n### 注意\n你会发现在使用 `gawk` 时，`gawk` 脚本往往比你的\
  \ shell 脚本还要大。在本章的示例中，为了简单起见，我们直接从命令行通过 shell 多行功能运行 `gawk` 脚本。在 shell 脚本中使用 `gawk`\
  \ 时，你应该将不同的 `gawk` 命令放在单独的行上。这将使其更容易阅读和遵循，而不是尝试将所有内容挤在 shell 脚本的一行中。此外，如果你发现在不同的\
  \ shell 脚本使用了相同的 `gawk` 脚本，请记住可以将 `gawk` 脚本保存到单独的文件中并使用 `-f` 参数引用它（参见第 18 章）。\n\n\
  ### 用户定义变量\n就像任何其他像样的编程语言一样，`gawk` 允许你定义自己的变量并在程序代码内部使用。`gawk` 用户定义的变量名可以可以是任意数量的字母、数字和下划线，但不能以数字开头。同样重要的是，`gawk`\
  \ 变量名是区分大小写的。\n\n### 在脚本中为变量\n在 `gawk` 程序中为变量赋值与在 shell 脚本中类似，使用赋值语句：\n\n```bash\n\
  $ gawk '\nBEGIN{\ntesting=\"This is a test\"\nprint testing\n}'\n```\nThis is a\
  \ test\n\n`print` 语句的输出是 `testing` 变量的当前值。与 shell 脚本变量一样，`gawk` 变量可以持有数值或文本值：\n\n\
  ```bash\n$ gawk '\nBEGIN{\ntesting=\"This is a test\"\nprint testing\ntesting=45\n\
  print testing\n}'\n```\nThis is a test\n45\n\n在这个示例中，`testing` 变量的值从文本值变为数值值。\n\n\
  赋值语句还可以包含处理数值的数学算法：\n\n```bash\n$ gawk 'BEGIN{x=4; x=x * 2 + 3; print x}'\n```\n\
  11\n\n如你从这个示例所示，`gawk` 编程语言包含了处理数值的标准数学运算符。这些包括取余符号（`%`）和幂符号（使用 `^` 或 `**`）。\n\n\
  ### 在命令行上为变量\n你也可以使用 `gawk` 命令行为 `gawk` 程序中的变量赋值。这允许你在普通代码之外设置值，动态更改值。这里有一个使用命令行变量显示文件中特定数据字段的示例：\n\
  \n```bash\n$ cat script1\nBEGIN{FS=\",\"}\n{print $n}\n\n$ gawk -f script1 n=2 data1\n\
  data12\ndata22\ndata32\n\n$ gawk -f script1 n=3 data1\ndata13\ndata23\ndata33\n\
  ```\n\n此功能允许你在不实际修改实际脚本代码的情况下更改脚本的行为。第一个示例显示文件中的第二个数据字段，而第二个示例仅通过设置命令行中 `n` 变量的值就显示了第三个数据字段。\n\
  \n使用命令行参数定义变量值存在一个问题。当你设置变量时，该值在代码的 `BEGIN` 部分是不可用的：\n\n```bash\n$ cat script2\n\
  BEGIN{print \"The starting value is\",n; FS=\",\"}\n{print $n}\n\n$ gawk -f script2\
  \ n=3 data1\nThe starting value is\ndata13\ndata23\ndata33\n```\n\n你可以使用 `-v` 命令行参数来解决这个问题。这允许你指定在代码\
  \ `BEGIN` 部分之前设置变量。`-v` 命令行参数必须放在命令行中脚本代码之前：\n\n```bash\n$ gawk -v n=3 -f script2\
  \ data1\nThe starting value is 3\ndata13\ndata23\ndata33\n```\n\n现在 `n` 变量在代码的 `BEGIN`\
  \ 部分包含了命令行中设置的值。\n\n### 使用数组\n许多编程语言提供数组来在单个变量中存储多个值。`gawk` 编程语言通过关联数组提供了数组功能。\n\
  \n关联数组与数值数组的区别在于，其索引值可以是任何文本字符串。你不需要使用顺序数字来标识数组中包含的数据元素。相反，关联数组由一组引用值的字符串混合组成。每个索引字符串必须是唯一的，并唯一地标识分配给它的数据元素。如果你熟悉其他编程语言，这与哈希映射（hash\
  \ maps）或字典的概念相同。接下来的章节将介绍如何在 `gawk` 程序中使用数组变量。\n\n### 定义数组变量\n你可以使用标准的赋值语句定义数组变量。数组变量赋值的格式为：\n\
  `var[index] = element`\n\n其中 `var` 是变量名，`index` 是关联数组索引值，`element` 是数据元素值。以下是 `gawk`\
  \ 中数组变量的一些示例：\n```\ncapital[\"Illinois\"] = \"Springfield\"\ncapital[\"Indiana\"\
  ] = \"Indianapolis\"\ncapital[\"Ohio\"] = \"Columbus\"\n```\n\n当你引用数组变量时，必须包含索引值以检索相应的数据元素值：\n\
  \n```bash\n$ gawk 'BEGIN{\ncapital[\"Illinois\"] = \"Springfield\"\nprint capital[\"\
  Illinois\"]\n}'\n```\nSpringfield\n\n当你引用数组变量时，数据元素值就会出现。这对于数值数据元素值同样有效：\n\n```bash\n\
  $ gawk 'BEGIN{\nvar[1] = 34\nvar[2] = 3\ntotal = var[1] + var[2]\nprint total\n\
  }'\n```\n37\n\n如从这个示例所示，你可以像在 `gawk` 程序中使用任何其他变量一样使用数组变量。\n\n### 遍历数组变量\n关联数组变量的问题在于，你可能没有方法知道索引值是什么。与使用顺序数字作为索引值的数值数组不同，关联数组索引可以是任何值。\n\
  \n如果你需要在 `gawk` 中遍历关联数组，可以使用 `for` 语句的特殊格式：\n```awk\nfor (var in array)\n{\n  statements\n\
  }\n```\n\n`for` 语句循环执行语句，每次将关联数组中的下一个索引值赋值给变量 `var`。重要的是，要记住该变量的值是索引值，而不是数据元素的值。你可以通过将该变量作为数组索引来轻松地提取数据元素值：\n\
  \n```bash\n$ gawk 'BEGIN{\nvar[\"a\"] = 1\nvar[\"g\"] = 2\nvar[\"m\"] = 3\nvar[\"\
  u\"] = 4\nfor (test in var)\n{\n  print \"Index:\",test,\" - Value:\",var[test]\n\
  }\n}'\n```\nIndex: u  - Value: 4\nIndex: m  - Value: 3\nIndex: a  - Value: 1\nIndex:\
  \ g  - Value: 2\n\n$\n\n注意索引值并不是按任何特定顺序返回的，但它们都引用了相应的数据元素值。了解这一点非常重要，因为你不能指望返回的值按相同的顺序，只需索引和数据值匹配即可。\n\
  \n### 删除数组变量\n从关联数组中删除数组索引需要特殊的命令：\n`delete array[index]`\n\n`delete` 命令从数组中移除关联索引值和关联的数据元素值：\n\
  \n```bash\n$ gawk 'BEGIN{\nvar[\"a\"] = 1\nvar[\"g\"] = 2\nfor (test in var)\n{\n\
  \  print \"Index:\",test,\" - Value:\",var[test]\n}\ndelete var[\"g\"]\nprint \"\
  ---\"\nfor (test in var)\n{\n  print \"Index:\",test,\" - Value:\",var[test]\n}\n\
  }'\n```\nIndex: a  - Value: 1\nIndex: g  - Value: 2\n\n---\n\nIndex: a  - Value:\
  \ 1\n\n$\n\n一旦从关联数组中删除了索引值，你就无法检索它了。\n\n## 使用模式\n\n\n\n\n\n`gawk` 程序支持多种类型的匹配模式来过滤数据记录，这与\
  \ `sed` 编辑器非常相似。第 18 章已经展示了两种特殊模式的应用。`BEGIN` 和 `END` 关键字是特殊模式，它们在数据流数据读取之前或之后执行语句。同样，你也可以创建其他模式，当数据流中出现匹配数据时执行语句。\n\
  \n本节演示了如何在 `gawk` 脚本中使用匹配模式，以限制程序脚本作用的记录范围。\n\n## 正则表达式\n\n第 19 章展示了如何使用正则表达式作为匹配模式。你可以使用基本正则表达式\
  \ (BRE) 或扩展正则表达式 (ERE) 来过滤程序脚本应用于数据流中的哪些行。\n\n使用正则表达式时，该正则表达式必须出现在其所控制的程序脚本左括号 `{`\
  \ 之前：\n\n```\n$ gawk ‘BEGIN{FS=“,”} /11/{print $1}’ data1\ndata11\n```\n\n正则表达式\
  \ `/11/` 匹配数据字段中任何位置包含字符串 `11` 的记录。`gawk` 程序会将定义的正则表达式与记录中的所有数据字段进行匹配，包括字段分隔符字符：\n\
  \n```\n$ gawk ‘BEGIN{FS=“,”} /,d/{print $1}’ data1\ndata11\ndata21\ndata31\n```\n\
  \n此示例匹配了正则表达式中用作字段分隔符的逗号。这并不总是好事。在尝试匹配特定数据字段的数据时可能会问题，因为该数据可能出现在另一个字段中。如果你需要为特定的数据实例匹配正则表达式，应该使用匹配运算符。\n\
  \n## 匹配运算符\n\n匹配运算符允许你将正则表达式限制在记录中的特定数据字段。匹配运算符是波浪符号 (`∼`)。你需要指定匹配运算符、数据字段变量以及要匹配的正则表达式：\n\
  \n```\n$1 ∼ /ˆdata/\n```\n\n`$1` 变量代表记录中的第一个数据字段。该表达式过滤出第一个数据字段以文本 `data` 开头的记录。以下是在\
  \ `gawk` 程序脚本中使用匹配运算符的示例：\n\n```\n$ gawk ‘BEGIN{FS=“,”} $2 ∼ /ˆdata2/{print $0}’\
  \ data1\ndata21,data22,data23,data24,data25\n```\n\n匹配运算符将第二个数据字段与正则表达式 `/ˆdata2/`\
  \ 进行比较，该表达式表示字符串以文本 `data2` 开头。\n\n这是一个强大的工具，常用于 `gawk` 程序脚本在数据文件中搜索特定的数据元素：\n\n\
  ```\n$ gawk -F: ‘1 ∼ /rich/{print $1,$NF}’ /etc/passwd\nrich /bin/bash\n```\n\n\
  此示例在第一个数据字段中搜索文本 `rich`。当在记录中找到模式时，它会打印该记录的第一个和最后一个数据字段的值。\n\n你还可以通过 `!` 符号来取反正则表达式匹配：\n\
  \n```\n$1 !∼ /expression/\n```\n\n如果记录中没有找到正则表达式，则程序脚本将作用于该记录数据：\n\n```\n$ gawk\
  \ –F: ‘1 !∼ /rich/{print $1,$NF}’ /etc/passwd\nroot /bin/bash\ndaemon /bin/sh\n\
  bin /bin/sh\nsys /bin/sh\n--- output truncated ---\n$\n```\n\n在这个示例中，`gawk` 程序脚本打印了\
  \ `/etc/passwd` 文件中所有不匹配 userid `rich` 的条目的 userid 和 shell！\n\n## 数学表达式\n\n除了正则表达式，你还可以在匹配模式中使用数学表达式。当在数据字段中匹配数值时，此功能非常有用。例如，如果你想显示所有属于\
  \ root 用户组（组 ID 0）的系统用户，可以使用此脚本：\n\n```\n$ gawk -F: ‘$4 == 0{print $1}’ /etc/passwd\n\
  root\nsync\nshutdown\nhalt\noperator\n```\n\n该脚本检查第四数据字段包含值 `0` 的记录。在这个 Linux 系统上，有五个账户属于\
  \ root 用户组。\n\n你可以使用任何标准的数学比较表达式：\n\n- `x == y`: 值 `x` 等于 `y`。\n- `x <= y`: 值 `x`\
  \ 小于等于 `y`。\n- `x < y`: 值 `x` 小于 `y`。\n- `x >= y`: 值 `x` 大于等于 `y`。\n- `x > y`: 值\
  \ `x` 大于 `y`。\n\n你也可以对文本数据使用表达式，但必须小心。与正则表达式不同，表达式是精确匹配。数据必须与模式完全匹配：\n\n```\n$ gawk\
  \ -F, ‘$1 == “data”{print $1}’ data1\n$\n$ gawk -F, ‘$1 == “data11”{print $1}’ data1\n\
  data11\n```\n\n第一个测试没有匹配到任何记录，因为没有任何记录的第一个数据字段值是 `data`。第二个测试匹配了一个值为 `data11` 的记录。\n\
  \n## 结构化命令\n\n`gawk` 编程语言支持常见的结构化编程命令。本节描述了这些命令中的每一个，并演示了如何在 gawk 编程环境中使用它们。\n\n\
  ### if 语句\n\n`gawk` 编程语言支持 `if` 语句的标准 `if-then-else` 格式。你必须为 `if` 语句定义一个条件，并括在括号内。如果条件为真（TRUE），则执行紧随\
  \ `if` 语句之后的语句。如果条件为假（FALSE），则跳过语句。可以使用以下格式：\n\n```\nif (condition)\n    statement1\n\
  ```\n\n或者你可以将其放在一行，如下：\n\n```\nif (condition) statement1\n```\n\n这是一个演示该格式的简单示例：\n\
  \n```\n$ cat data4\n10\n5\n13\n50\n34\n$ gawk ‘{if ($1 > 20) print $1}’ data4\n\
  50\n34\n```\n\n并不复杂。如果你需要在 `if` 语句中执行多个语句，必须用大括号将其括起来：\n\n```\n$ gawk ‘{\n  if ($1\
  \ > 20)\n  {\n    x = $1 * 2\n    print x\n  }\n}’ data4\n100\n68\n```\n\n注意不要混淆\
  \ `if` 语句的大括号与用于开始和结束程序脚本的大括号。`gawk` 程序可以检测缺失的大括号，如果你弄乱了，它会产生错误信息：\n\n```\n$ gawk\
  \ ‘{\n  if ($1 > 20)\n  {\n    x = $1 * 2\n    print x\n  }’ data4\ngawk: cmd.line:7:\
  \ (END OF FILE)\ngawk: cmd.line:7: parse\n$\n```\n\n`if` 语句还支持 `else` 子句，允许在 `if`\
  \ 条件失败时执行一个或多个语句。这里有一个使用 `else` 子句的示例：\n\n```\n$ gawk ‘{\n  if ($1 > 20)\n  {\n\
  \    x = $1 * 2\n    print x\n  } else\n  {\n    x = $1 / 2\n    print x\n  }\n\
  }’ data4\n$\n```\n\n你可以将 `else` 子句放在一行，但必须在 `if` 语句后使用分号：\n\n```\nif (condition)\
  \ statement1; statement2\n```\n\n这是使用单行的相同示例：\n\n```\n$ gawk ‘{if ($1 > 20) print\
  \ $1*2; else print $1/2}’ data4\n$\n```\n\n这种格式更紧凑，但难以追踪。\n\n### while 语句\n\n`while`\
  \ 语句为 `gawk` 程序提供了基本的循环功能。以下是 `while` 语句的格式：\n\n```\nwhile (condition)\n{\n  statements\n\
  }\n```\n\n`while` 循环允许你遍历一组数据，检查停止迭代的条件。如果你每个记录中有多个需要计算的数据值，这非常有用：\n\n```\n$ cat\
  \ data5\n130 120 135\n160 113 140\n145 170 215\n$ gawk ‘{\n  total = 0\n  i = 1\n\
  \  while (i < 4)\n  {\n    total += $i\n    i++\n  }\n  avg = total / 3\n  print\
  \ \"Average:\",avg\n}’ data5\nAverage: 128.333\nAverage: 137.667\nAverage: 176.667\n\
  ```\n```\n\n`while` 语句遍历记录中的字段，将每个值累加到变量 `total`，然后增加计数变量 `i`。当计数器等于 4 时，`while`\
  \ 条件变为假，循环终止，执行脚本中的下一个语句。此过程会对数据文件中的每个记录重复进行。\n\n`gawk` 编程语言支持在 `while` 循环中使用 `break`\
  \ 和 `continue` 语句，允许你跳出循环中间：\n\n```\n$ gawk ‘{\n  total = 0\n  i = 1\n  while (i\
  \ < 4)\n  {\n```\n\n\n\n\n\n```awk\ntotal += $i\n  if (i == 2) {\n    break\n  }\n\
  \  i++\n}\navg = total / 2\nprint \"The average of the first two data elements is:\"\
  ,avg\n}' data5\n```\n前两个数据元素的平均值是: 125\n前两个数据元素的平均值是: 136.5\n前两个数据元素的平均值是: 157.5\n\
  \n`break` 语句用于在变量 `i` 的值为 2 时跳出 `while` 循环。\n\n### do-while 语句\n\n`do-while` 语句与\
  \ `while` 语句相似，但会在检查条件语句之前先执行语句。以下是 `do-while` 语句的格式：\n\n```\ndo {\n  statements\n\
  } while (condition)\n```\n\n这种格式保证了语句在评估条件之前至少执行一次。当你需要在评估条件之前执行某些语句时，这种格式非常有用：\n\
  \n```awk\ngawk '{\n  total = 0\n  i = 1\n  do {\n    total += $i\n    i++\n  } while\
  \ (total < 150)\n  print total\n}' data5\n```\n250\n160\n315\n\n该脚本从每条记录读取数据字段并进行累加，直到累积值达到\
  \ 150。如果第一个数据字段超过 150（如第二条记录所示），脚本保证在评估条件之前至少读取第一个数据字段。\n\n### for 语句\n\n`for` 语句是许多编程语言中用于循环的常用方法。`gawk`\
  \ 语言支持 C 风格的 `for` 循环：\n\n```\nfor(variable assignment; condition; iteration process)\n\
  ```\n\n这通过在一个语句中组合多个功能，简化了循环：\n\n```awk\ngawk '{\n  total = 0\n  for (i = 1; i <\
  \ 4; i++) {\n    total += $i\n  }\n  avg = total / 3\n  print \"Average:\",avg\n\
  }' data5\n```\nAverage: 128.333\nAverage: 137.667\nAverage: 176.667\n\n通过在 `for`\
  \ 循环中定义迭代计数器，你就不需要像在使用 `while` 语句时那样担心手动递增它。\n\n## 格式化打印\n\n你可能已经，`print` 语句并没有对\
  \ `gawk` 如何显示数据提供太多的控制。你能做的主要是控制输出字段分隔符字符 (`OFS`)。如果你正在创建详细的报告，通常需要将数据放在特定的格式和位置。\n\
  \n解决方案是使用格式化打印命令，称为 `printf`。如果你熟悉 C 语言编程，`gawk` 中的 `printf` 命令的工作方式相同，允许你指定关于如何显示数据的详细指令。\n\
  \n以下是 `printf` 命令的格式：\n\n`printf \"format string\", var1, var2 . .`\n\n格式字符串是格式化输出的关键。它使用文本元素和格式说明符，精确指定了格式化输出的显示方式。格式说明符是一个特殊代码，用于指示显示什么类型的变量以及如何显示它。`gawk`\
  \ 程序将每个格式说明符作为命令列出的每个变量的占位符。第一个格式说明符匹配第一个列出的变量，第二个匹配第二个，依此类推。\n\n格式说明符使用以下格式：\n\n\
  `%[modifier]control-letter`\n\n其中 `control-letter` 是一个字符代码，指示将显示什么类型的数据值，而 `modifier`\
  \ 定义了可选的格式特性。\n\n表 21.3 列出了可以在格式说明符中使用的控制字母。\n\n| 控制字母 |  |\n| :--- | :--- |\n|\
  \ c | 将数字作为 ASCII 字符显示。 |\n| d | 显示整数值。 |\n| i | 显示整数值（与 d 相同）。 |\n| e | 以科学计数法显示数字。\
  \ |\n| f | 显示浮点值。 |\n| g | 显示科学计数法或浮点数，较短者为准。 |\n| o | 显示八进制值。 |\n| s | 显示文本字符串。\
  \ |\n| x | 显示十六进制值。 |\n| X | 显示十六进制值，但对 A 到 F 使用大写字母。 |\n\n因此，如果你需要显示字符串变量，将使用格式说明符\
  \ `%s`。如果你需要显示整数变量，可以使用 `%d` 或 `%i`（%d` 是十进制的 C 风格）。如果你想用科学计数法显示一个大值，将使用 `%e` 格式说明符：\n\
  \n```awk\ngawk 'BEGIN{\n  x = 10 * 100\n  printf \"The answer is: %e\\n\", x\n}'\n\
  ```\nThe answer is: 1.000000e+03\n\n除了控制字母外，还有三种修饰符可以对输出进行更深入的控制：\n\n- `width`:\
  \ 一个指定输出字段最小宽的数值值。如果输出较短，则用空格填充字段。\n- `prec`: 一个指定小数点后数字位数的数值值。\n- `-` (负号): 负号表示应使用左对齐而不是右对齐。\n\
  \n使用 `printf` 时，你对输出外观具有完全的控制权。例如，在 `while` 语句中，我们使用 `print` 命令来显示字段：\n\n```awk\n\
  gawk '{\n  total = 0\n  i = 1\n  do {\n    total += $i\n    i++\n  } while (total\
  \ < 150)\n  print total\n}' data5\n```\n250\n160\n315\n\n该脚本从每条记录读取数据字段并进行累加，直到累积值达到\
  \ 150。如果第一个数据字段超过 150（如第二条记录所示），脚本保证在评估条件之前至少读取第一个数据字段。\n\n\n\n\n\n`gawk` 编程语言提供了许多内置函数，用于执行常见的数学、字符串甚至时间相关的函数。你可以在\
  \ `gawk` 程序中使用这些函数，以减少脚本中的代码编写量。本节将带你了解 `gawk` 中提供的各种内置函数。\n\n## 数学函数\n\n如果你用过任何语言进行过编程，那么你可能已经熟悉在代码中使用内置函数来执行常见的数学运算。`gawk`\
  \ 编程语言不会让寻找高级数学功能的用户失望。\n\n表 21.4 显示了 `gawk` 中可用的数学内置函数。\n\n### 表 21.4 (#9781118087770c21.xhtml_c21_tbl_anc_0004)\
  \ gawk 数学函数\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `atan2(x, y)` | `x` / `y` 的反正切值，其中\
  \ `x` 和 `y` 以弧度表示。 |\n| `cos(x)` | `x` 的余弦值，其中 `x` 以弧度表示。 |\n| `exp(x)` | `x` 的指数。\
  \ |\n| `int(x)` | `x` 的整数部分，向 0 方向截断。 |\n| `log(x)` | `x` 的自然对数。 |\n| `rand()` |\
  \ 大于 0 且小于 1 的随机浮点数。 |\n| `sin(x)` | `x` 的正弦值，其中 `x` 以弧度表示。 |\n| `sqrt(x)` | `x`\
  \ 的平方根。 |\n| `srand(x)` | 为计算随机数指定种子值。 |\n\n虽然 `gawk` 没有详尽的数学函数列表，但它确实提供了一些标准数学处理所需的某些元素。`int()`\
  \ 函数产生值的整数部分，但它不会对值进行四舍五入。它的行为类似于其他编程语言中的地板（向下取整）函数。它产生该值与 0 之间最接近的整数。\n\n这意味着值\
  \ `5.6` 的 `int()` 函数将返回 `5`，而值 `-5.6` 的 `int()` 函数将返回 `-5`。\n\n`rand()` 函数非常适合创建随机数，但你需要一些技巧来获取有意义的值。`rand()`\
  \ 函数返回一个随机数，但只在 `0` 和 `1` 之间（不包括 0 或 1）。要获得更大的数字，你需要对返回值进行缩放。\n\n生成较大的整数随机数的常用方法是创建一个使用\
  \ `rand()` 函数结合 `int()` 函数的算法：\n\n```\nx = int(10 * rand())\n```\n\n这会返回一个 0 到 9\
  \ 之间（包含边界）的随机整数值。只需将公式中的 `10` 替换为你应用程序的上限值，就可以使用了。\n\n在使用某些数学函数时要小心，因为 `gawk` 编程语言能够处理的数值范围是有限的。如果你超过了该范围，将得到一个错误消息：\n\
  \n```bash\n$ gawk 'BEGIN{x=exp(100); print x}'\n```\n268811714181617356094253400435962903546876\n\
  \n```bash\n$ gawk 'BEGIN{x=exp(100); print x}'\n```\n第一个示例计算了 `100` 的指数，这是一个巨大的数字，但在系统的范围内。第二个示例尝试计算\
  \ `100` 的指数，这超过了系统的数值限制并产生了错误消息。\n\n除了标准数学函数外，`gawk` 还提供了几个用于对数据进行位操作函数：\n\n- `and(v1,\
  \ v2)`: 执行 `v1` 和 `v2` 的按位与（AND）操作。\n- `compl(val)`: 执行 `val` 的按位取反。\n- `lshift(val,\
  \ count)`: 将值 `val` 向左移动 `count` 位。\n- `or(v1, v2)`: 执行 `v1` 和 `v2` 的按位或（OR）操作。\n\
  - `rshift(val, count)`: 将值 `val` 向右移动 `count` 位。\n- `xor(v1, v2)`: 执行 `v1` 和 `v2`\
  \ 的按位异或（XOR）操作。\n\n在处理数据中的二进制值时，这些位操作函数非常有用。\n\n## 字符串函数\n\n`gawk` 编程语言还提供了几个可以用于处理字符串值的函数，如表\
  \ 21.5 所示。\n\n### 表 21.5 (#9781118087770c21.xhtml_c21_tbl_anc_0005) gawk 字符串函数\n\
  \n| 函数 | 描述 |\n| :--- | :--- |\n| `asort(s [,d])` | 根据数据元素值对数组 `s` 进行排序。索引值被替换为指示排序顺序的连续数字。或者，如果指定，将排序后的数组存储在数组\
  \ `d` 中。 |\n| `asorti(s [,d])` | 根据索引值对数组 `s` 进行排序。生成的数组包含索引值作为数据元素，并用连续数字指示排序顺序。或者，如果指定，将排序后的数组存储在数组\
  \ `d` 中。 |\n| `gensub(r, s, h [, t])` | 在变量 `$0` 或如果提供的目标字符串 `t` 中搜索正则表达式 `r` 的匹配项。如果\
  \ `h` 是以 `g` 或 `G` 开头的字符串，则将匹配文本替换为 `s`。如果 `h` 是数字，它代表替换第几次 `r`。 |\n| `gsub(r, s\
  \ [,t])` | 在变量 `$0` 或如果提供的目标字符串 `t` 中搜索正则表达式 `r` 的匹配项。如果找到，则全局替换字符串 `s`。 |\n| `index(s,\
  \ t)` | 返回字符串 `t` 在字符串 `s` 中的索引，如果找到则返回 0。 |\n| `length([s])` | 返回字符串 `s` 的长度，如果没有指定，则返回\
  \ `$0` 的长度。 |\n| `match(s, r [,a])` | 返回正则表达式 `r` 在字符串 `s` 中出现的索引。如果指定了数组 `a`，它包含\
  \ `s` 中匹配正则表达式的部分。 |\n| `split(s, a [,r])` | 使用 `FS` 字符或如果提供的正则表达式 `r` 将 `s` 分拆为数组\
  \ `a`。返回字段数。 |\n| `sprintf(format, variables)` | 使用提供的 `format` 和 `variables` 返回一个与\
  \ `printf` 输出相似的字符串。 |\n| `sub(r, s [,t])` | 在变量 `$0` 或目标字符串 `t` 中搜索正则表达式 `r` 的匹配项。如果找到，则替换第一个出现处为字符串\
  \ `s`。 |\n| `substr(s, i [,n])` | 返回从索引 `i` 开始的 `s` 的 `n` 个字符子字符串。如果没有 `n`，则使用 `s`\
  \ 的剩余部分。 |\n| `tolower(s)` | 将 `s` 中的所有字符转换为小写。 |\n| `toupper(s)` | 将 `s` 中的所有字符转换为大写。\
  \ |\n\n将 `s` 中的所有字符转换为大写。\n\n某些字符串函数是自言自明的：\n\n```bash\n$ gawk 'BEGIN{x = \"testing\"\
  ; print toupper(x); print length(x)}\nTESTING\n```\n\n某些字符串函数可能会变得相当复杂。`asort` 和\
  \ `asorti` 是新的 `gawk` 函数，允许你根据数据元素值或索引值对数组排序。这里是使用 `asort` 的示例：\n\n```bash\n$ gawk\
  \ 'BEGIN{\n  var[\"a\"] = 1\n  var[\"g\"] = 2\n  var[\"m\"] = 3\n  var[\"u\"] =\
  \ 4\n  asort(var, test)\n  for (i in test)\n      print \"Index:\",i,\" - value:\"\
  ,test[i]\n  }'\nIndex: 4 - value: 4\nIndex: 1 - value: 1\nIndex: 2 - value: 2\n\
  Index: 3 - value: 3\n```\n\n新数组 `test` 包含了原始数组排序后的元素，但索引值现在变成了数值。\n\n`split` 函数是将数据字段推入数组以便进一步处理的好方法：\n\
  \n```bash\n$ gawk 'BEGIN{FS=\",\"}{\n  split($0, var)\n  print var[1],var[5]\n}'\
  \ data1\ndata11 data15\ndata21 data25\ndata31 data35\n```\n\n新数组使用连续数字作为数组索引，索引\
  \ 1 包含第一个字段。\n\n## 时间函数\n\n`gawk` 编程语言包含几个帮助你处理时间值的函数，如表 21.6 所示。\n\n### 表 21.6\
  \ (#9781118087770c21.xhtml_c21_tbl_anc_0006) gawk 时间函数\n\n| 函数 | 描述 |\n| :--- |\
  \ :--- |\n| `mktime(datespec)` | 将指定为 `YYYY MM DD HH MM SS [DST]` 的日期转换为时间戳。 |\n\
  | `strftime(format [, timestamp])` | 将当前时间戳或提供的 `timestamp` 格式化为格式化的日期字符串，使用 `date()`\
  \ shell 函数格式。 |\n| `systime()` | 返回当前时间的时间戳。 |\n\n\n\n\n\n在处理包含需要比较的日期的日志文件时，经常会用到时间函数。通过将日期的文本表示转换为\
  \ Unix 时间（自 1970 年 1 月 1 日午夜以来的秒数），你可以轻松地比较日期。\n\n以下是在 `gawk` 程序中使用时间函数的一个示例：\n\n\
  ```bash\n$ gawk 'BEGIN{\ndate = systime()\nday = strftime(\"%A, %B %d, %Y\", date)\n\
  print day\n}'\nFriday, December 28, 2010\n$\n```\n\n此示例使用了 `systime` 函数从系统获取当前的\
  \ Unix 时间戳，然后使用 `strftime` 函数利用 `date` shell 命令的日期格式化字符将其转换为人类可读的格式。\n\n## 自定义函数\n\
  \n你并不局限于使用 `gawk` 提供的内置函数。你可以创建自己的函数，并在 `gawk` 程序中使用它们。本节将向你展示如何在你的 `gawk` 程序中定义和使用你自己的函数。\n\
  \n### 定义函数\n\n要定义你自己的函数，必须使用 `function` 关键字：\n\n```awk\nfunction name([variables])\n\
  {\n    statements\n}\n```\n\n函数名必须能够唯一标识你的函数。你可以从调用的 `gawk` 程序向函数传递一个或多个变量：\n\n\
  ```awk\nfunction printthird()\n{\n    print $3\n}\n```\n\n此函数将打印记录中的第三个数据字段。\n\n\
  函数还可以使用 `return` 语句返回值：\n\n```awk\nreturn value\n```\n\n该值可以是一个变量，也可以是一个求值为特定值的表达式：\n\
  \n```awk\nfunction myrand(limit)\n{\n    return int(limit * rand())\n}\n```\n\n\
  你可以将函数返回的值赋值给 `gawk` 程序中的变量：\n\n```awk\nx = myrand(100)\n```\n\n该变量将包含函数返回的值。\n\n\
  ### 使用你的函数\n\n当你定义一个函数时，它必须在定义任何编程部分（包括 `BEGIN` 区域）之前独立出现。初初看起来可能有点奇怪，但它有助于将函数代码与\
  \ `gawk` 程序的其余部分隔离开：\n\n```bash\n$ gawk '\nfunction myprint()\n{\n    printf \"\
  %-16s - %s\\n\", $1, $4\n}\nBEGIN{FS=\"\\n\"; RS=\"\"}\n{\n    myprint()\n}' data2\n\
  Riley Mullen      - (312)555-1234\nFrank Williams   - (317)555-9876\nHaley Snell\
  \      - (313)555-4938\n$\n```\n\n该函数定义了 `myprint()`，它用于格式化记录中的第一个和第四个数据字段以便打印。`gawk`\
  \ 程序随后使用该函数显示来自数据文件的数据。一旦定义了函数，你就可以代码的程序部分中根据需要频繁使用它。在运行复杂的算法时，这可以节省大量工作。\n\n###\
  \ 创建函数库\n\n显然，每次需要时都重写 `gawk` 函数并不是一种愉快的体验。然而，`gawk` 提供了一种方法，让你将函数合并到单个库文件中，你可以在所有的\
  \ `gawk` 编程中使用该文件。\n\n首先，你需要创建一个包含所有 `gawk` 函数的文件：\n\n```bash\n$ cat funclib\nfunction\
  \ myprint()\n{\n    printf \"%-16s - %s\\n\", $1, $4\n}\nfunction myrand(limit)\n\
  {\n    return int(limit * rand())\n}\nfunction printthird()\n{\n    print $3\n}\n\
  $\n```\n\n`funclib` 文件包含三个函数定义。要使用它们，你需要使用 `-f` 命令行参数。遗憾的是，你不能将 `-f` 命令行参数与内联 `gawk`\
  \ 脚本结合，但可以在同一命令行上使用多个 `-f` 参数。\n\n因此，要使用你的库，只需创建一个包含 `gawk` 程序的文件，并在命令行上指定库文件和你的程序文件：\n\
  \n```bash\n$ cat script4\nBEGIN{FS=\"\\n\"; RS=\"\"}\n{\n    myprint()\n}\n$ gawk\
  \ -f funclib -f script4 data2\nRiley Mullen      - (312)555-1234\nFrank Williams\
  \   - (317)555-9876\nHaley Snell      - (313)555-4938\n$\n```\n\n现在，每当你需要使用库中定义的函数时，只需要在\
  \ `gawk` 命令行中添加 `funclib` 文件即可。\n\n## 总结\n\n本章带你介绍了 `gawk` 编程语言的高级特性。每种编程语言都需要使用变量，`gawk`\
  \ 也不例外。`gawk` 语言包含一些内置变量，你可以使用它们引用特定的数据字段值，并获取有关数据文件中处理的数据字段和记录数量的信息。你还可以创建自己的变量供脚本使用。\n\
  \n`gawk` 语言还提供了许多你在编程语言中预期的标准结构命令。你可以使用 `if-then` 逻辑、`while`、`do-while` 和 `for`\
  \ 循环轻松创建复杂的程序。这些命令每一个允许你更改 `gawk` 程序脚本的流，通过遍历数据字段值来创建详细的数据报告。\n\n如果你需要自定义报告输出，`printf`\
  \ 命令是一个非常棒的工具。它允许你指定显示 `gawk` 程序脚本数据的精确格式。你可以轻松地创建格式化报告，将数据元素放置在完全正确的位置。\n\n最后，本章讨论了\
  \ `gawk` 程序中提供的许多内置函数，并向你展示了如何创建你自己的函数。\n\n\n\n\n\nDebian Linux 发行版创建了其自己的 `ash`\
  \ shell 版本（称为 `Debian ash` 或 `dash`），并包含在其 Linux 版本中。在大多数情况下，`dash` 复制了 NetBSD 版本\
  \ `ash` shell 的特性，提供了高级的命令行编辑能力。\n\n然而，为了增加 shell 方面的混淆性，`dash` shell 实际上并不是许多基于\
  \ Debian 的 Linux 发行版的默认 shell。由于 `bash` shell 的流行，大多数基于 Debian 的 Linux 发行版使用 `bash`\
  \ 作为正常的登录 shell，而仅将 `dash` 作为安装脚本的快速启动 shell，用于安装发行版文件。\n\n例外是流行的 Ubuntu 发行版。这经常让\
  \ shell 脚本编写人员感到困惑，并导致在 Linux 环境中运行 shell 脚本出现许多问题。Ubuntu Linux 发行版使用 `bash` 作为默认交互式\
  \ shell，但使用 `dash` 作为默认的 `/bin/sh` shell。这一“特性”真的困扰了 shell 脚本编写人员。\n\n正如你在第 10 章看到的，每个\
  \ shell 脚本必须以声明脚本所用 shell 的行开头。在我们的 `bash` shell 脚本中，我们一直使用以下内容：\n\n```\n#!/bin/bash\n\
  ```\n\n这告诉 shell 使用位于 `/bin/bash` 的 shell 程序来执行脚本。在 Unix 世界，默认 shell 一直是 `/bin/sh`。许多熟悉\
  \ Unix 环境的 shell 脚本编写人员会将此复制到他们的 Linux shell 脚本中：\n\n```bash\n#!/bin/sh\n```\n\n\
  在大多数 Linux 发行版中，`/bin/sh` 文件是指向 `/bin/bash` shell 程序的符号链接（见第 3 章）。这允许你轻松将为 Unix\
  \ Bourne shell 设计的 shell 脚本迁移到 Linux 环境而无需修改。\n\n遗憾的是，Ubuntu Linux 发行版将 `/bin/sh`\
  \ 文件链接到 `/bin/dash` shell 程序。由于 `dash` shell 只包含原始 Bourne shell 可命令的子集，这可能会（通常也是）导致某些\
  \ shell 脚本无法正常工作。\n\n下一节将带你了解 `dash` shell 的基础及其与 `bash` shell 的区别。如果你编写可能需要在 Ubuntu\
  \ 环境下运行的 `bash` shell 脚本，了解这一点特别重要。\n\n## dash Shell 特性\n\n虽然 `bash` shell 和 `dash`\
  \ shell 都是模仿 Bourne shell 设计的，但它们存在一些差异。本节将带你了解 Debian `dash` shell 中的特性，以便在深入研究\
  \ shell 脚本特性之前熟悉 `dash` shell 的工作原理。\n\n## dash 命令行参数\n\n`dash` shell 使用命令行参数来控制其行为。[表\
  \ 22.1] 列出了命令行参数并描述了每个参数的作用。\n\n### 表 22.1 dash 命令行参数\n\n| 参数 |  |\n| :--- | :---\
  \ |\n| `-a` | 导出分配给 shell 的所有变量。 |\n| `-c` | 从指定的命令字符串读取命令。 |\n| `-e` | 如果不是交互模式，任何未测试的命令失败时立即退出。\
  \ |\n| `-f` | 显示路径通配符。 |\n| `-n` | 如果不是交互模式，读取命令但不执行。 |\n| `-u` | 当尝试扩展未设置的变量时向\
  \ `STDERR` 写入错误信息。 |\n| `-v` | 在读取输入时将其写入 `STDERR`。 |\n| `-x` | 在执行每个命令时将其写入 `STDERR`。\
  \ |\n| `-I` | 在交互模式下忽略输入中的 EOF 字符。 |\n| `-i` | 强制 shell 在交互模式下运行。 |\n| `-m` | 开启作业控制（交互模式下默认启用）。\
  \ |\n| `-s` | 从 `STDIN` 读取命令（如果没有文件参数的默认行为）。 |\n| `-E` | 启用 emacs 命令行编辑器。 |\n| `-V`\
  \ | 启用 vi 命令行编辑器。 |\n\nDebian 在原始 `ash` shell 命令行参数列表基础上仅添加了少几个额外的命令行参数。`-E` 和 `-V`\
  \ 命令行参数开启了 `dash` shell 特有的命令行编辑功能。\n\n`-E` 命令行参数允许你使用 emacs 编辑器命令编辑命令行文本（见第 9 章）。你可以使用\
  \ `Ctrl` 和 `Meta` 键组合使用所有 emacs 命令来操作单行文本。\n\n`-V` 命令行参数允许你使用 vi 编辑器命令编辑命令行文本（再次，见第\
  \ 9 章）。此特性允许你使用 `Esc` 键在命令行上的普通模式和 vi 编辑器模式之间切换。当你处于 vi 编辑器模式时，可以使用所有的标准 vi 编辑器命令（例如使用\
  \ `x` 删除字符，使用 `i` 插入文本）。完成命令行编辑后，必须再次按下 `Esc` 键退出 vi 编辑器模式。\n\n## dash 环境变量\n\n\
  `dash` shell 使用相当多的默认环境变量来跟踪信息，你也可以创建自己的环境变量。本节描述了环境变量以及 `dash` 如何处理它们。\n\n### 默认环境变量\n\
  \n[表 22.2] 显示了默认 dash 环境变量并描述了它们的用途。\n\n### 表 22.2 dash Shell 环境变量\n\n| 变量 | 说明\
  \ |\n| :--- | :--- |\n| `CDPATH` | `cd` 命令使用的搜索路径。 |\n| `HISTSIZE` | 历史记录中的行数。 |\n\
  | `HOME` | 用户默认登录目录。 |\n| `IFS` | 输入字段分隔符。默认值是空格、制表符和换行符。 |\n| `MAIL` | 用户邮箱的名称。\
  \ |\n| `MAILCHECK` | 检查邮箱是否有新邮件的频率。 |\n| `MAILPATH` | 用冒号分隔的多文件名列表。 |\n| `OLDPWD`\
  \ | 上一个工作目录的值。 |\n| `PATH` | 可执行文件的默认搜索路径。 |\n| `PPID` | 当前 shell 父进程的进程 ID。 |\n\
  | `PS1` | 主 shell 命令行界面提示符。 |\n| `PS2` | 次级 shell 命令行界面提示符。 |\n| `PS4` | 启用执行跟踪时在每行之前打印的字符。\
  \ |\n| `PWD` | 当前目录的值。 |\n| `TERM` | shell 的默认终端设置。 |\n\n你应该注意到这些环境变量与 `bash` 中使用的环境变量非常相似（见第\
  \ 5 章）。这并非偶然。记住 `dash` 和 `bash` shell 都是 Bourne shell 的扩展，因此它们包含了它的许多特性。然而，由于其简单性的目标，`dash`\
  \ shell 包含的环境变量比 `bash` 少得多。在 `ash` 环境中创建 shell 脚本时，你需要考虑到这一点。\n\n`dash` shell 使用\
  \ `set` 命令显示环境变量：\n\n```bash\n$set\n```\n\n`COLORTERM='`\n`DESKTOP_SESSION=default`\n\
  `DISPLAY=:0.0`\n`DM_CONTROL=/var/run/xdm`\n`GS_LIB=/home/atest/.fonts`\n`HOME=/home/atest`\n\
  `IFS=`\n`KDEROTHOME=/root/.kde`\n`KDE_FULL_SESSION=true`\n`KDE_MULTIHEAD=false`\n\
  `KONSOLE_DCOP=DCOPRef(konsole-5293,konole)`\n`KONSOLE_DCOP_SESSION=DCOPRef(konsole-5293,session-1)`\n\
  `LANG=en_US`\n`LANGUAGE=en`\n`LC_ALL=en_US`\n`LOGNAME=atest`\n`OPTIND=1`\n`PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin`\n\
  `PPID=5293`\n`PS1=$ `\n`PS2=> `\n`PS4=+ `\n`PWD=/home/atest`\n`SESSION_MANAGER=local/testbox:/tmp/.ICE-unix/5051`\n\
  `SHELL=/bin/dash`\n`SHLVL=1`\n`TERM=xterm`\n`USER=atest`\n`XCURSOR_THEME=default`\n\
  `_=ash`\n`$`\n\n你的默认 dash shell 环境可能会有所不同，因为不同的 Linux 发行版在登录时会分配不同的默认环境变量。\n\n##\
  \ 位置参数\n\n除了默认环境变量外，`dash` shell 还会为命令行中定义的任何参数分配特殊变量。以下是 dash shell 中可用的位置参数变量：\n\
  \n\n\n\n\n*   $0`: shell 的名称\n*   $n`: 第 n 个位置参数\n*   $*`: 包含所有参数内容的单个值，用 `IFS`\
  \ 环境变量中的第一个字符分隔；如果 `IFS` 未定义，则用空格分隔\n*   $@`: 展开为由所有命令行参数组成的多个参数\n*   $#`: 位置参数的数量\n\
  *   `?$`: 最近一次命令的退出状态\n*   `$-`: 当前选项标志\n*   `$$`: 当前 shell 的进程 ID (PID)\n*   $!`:\
  \ 最近一次后台命令的进程 ID (PID)\n\n所有以连字符开头的位置参数都模拟了 `bash` shell 中可用的相同位置参数。你可以像在 `bash`\
  \ shell 中一样，在 shell 脚本中使用每个位置参数。\n\n## 用户自定义环境变量\n\n`dash` shell 也允许你设置自己的环境变量。与\
  \ `bash` 一样，你可以使用赋值语句在命令行上定义新的环境变量：\n\n```\n$ testing=10\n$ echo $testing\n10\n\
  $\n```\n\n默认情况下，环境变量仅在定义它们的 shell 会话中可见。要让环境变量在子 shell 或进程中可见，你必须使用 `export` 命令：\n\
  \n```\n$ testing=10 ; export testing\n$ dash\n$ echo $testing\n10\n$\n```\n\n如果没有\
  \ `export` 命令，用户自定义的环境变量仅在当前 shell 或进程中可见。\n\n### 注意\n\ndash 变量和 bash 变量之间有一个巨大的区别。`dash`\
  \ shell 不支持变量数组。这个小小的特性为高级 shell 脚本编写者带来了各种问题。\n\n## dash 内置命令\n\n与 `bash` shell\
  \ 一样，`dash` shell 包含一组它识别的内置命令。你可以直接从命令行界面使用这些命令，也可以将它们包含在 shell 脚本中。表 22.3 列出了\
  \ `dash` shell 内置命令。\n\n### 表 22.3 dash Shell 内置命令\n\n| 命令 | 说明 |\n| :--- | :---\
  \ |\n| `alias` | 创建别名字符串来表示文本字符串。 |\n| `bg` | 在后台模式继续执行指定的作业。 |\n| `cd` | 切换到指定的目录。\
  \ |\n| `echo` | 显示文本字符串和环境变量。 |\n| `eval` | 用空格连接所有参数。 |\n| `exec` | 用指定的命令替换 shell\
  \ 进程。 |\n| `exit` | 终止 shell 进程。 |\n| `export` | 导出指定的环境变量以供所有子 shell 使用。 |\n| `fc`\
  \ | 列出、编辑或重新执行之前在命令行上输入的命令。 |\n| `fg` | 在前台模式继续执行指定的作业。 |\n| `getopts` | 从参数列表中获取选项和参数。\
  \ |\n| `hash` | 维护并检索最近使用的命令及其位置的哈希表。 |\n| `pwd` | 显示当前工作目录的值。 |\n| `read` | 从 STDIN\
  \ 读取一行并将值赋值给变量。 |\n| `readonly` | 从 STDIN 读取一行到不可更改的变量。 |\n| `printf` | 使用格式化字符串显示文本和变量。\
  \ |\n| `set` | 列出或设置选项标志和环境变量。 |\n| `shift` | 将位置参数向移动指定的次数。 |\n| `test` | 评估表达式，为真则返回\
  \ 0，为假则返回 1。 |\n| `times` | 显示 shell 及所有 shell 进程的累计用户时间和系统时间。 |\n| `trap` | 当 shell\
  \ 接收指定的信号时解析并执行操作。 |\n| `type` | 解释指定的名称并显示解析结果（别名、内置、命令、关键字）。 |\n| `ulimit` | 查询或设置进程限制。\
  \ |\n| `umask` | 设置默认文件和目录权限的值。 |\n| `unalias` | 删除指定的别名。 |\n| `unset` | 从导出的变量中移除指定的变量或选项标志。\
  \ |\n| `wait` | 等待指定的作业完成并返回退出状态。 |\n\n你可能在 `bash` shell 中识别过所有这些内置命令。`dash` shell\
  \ 支持与 `bash` shell 许多相同的内置命令。你会发现，没有用于命令历史文件的命令，也没有用于目录栈的命令。`dash` shell 不支持这些功能。\n\
  \n## 在 dash 中编写脚本\n\n遗憾的是，`dash` shell 并不识别 `bash` shell 的所有脚本功能。为 `bash` 环境编写的\
  \ shell 脚本在 `dash` shell 中运行时往往会失败，给 shell 脚本编写者带来各种麻烦。本节描述了你需要注意的差异，以确保你的 shell\
  \ 脚本能够在 `dash` shell 环境中正常运行。\n\n### 创建 dash 脚本\n\n你现在可能猜到了，为 `dash` shell 创建 shell\
  \ 脚本与为 `bash` shell 创建非常相似。你应该始终在脚本中指定想要使用的 shell，以确保脚本使用正确的 shell 运行。\n\n你可以在 shell\
  \ 的第一行这样做：\n\n```bash\n#!/bin/dash\n```\n\n你也可以在这一行指定 shell 命令行参数，正如之前在“dash 命令行参数”部分演示的那样。\n\
  \n### 不可行的功能\n\n遗憾的是，由于 `dash` shell 只是 Bourne shell 特性的子集，`bash` shell 脚本中的某些内容在\
  \ `dash` shell 中无法工作。这些通常被称为 bashisms（bash 特）。本节简要总结了你可能在 `bash` shell 脚本中习惯使用的、但在\
  \ `dash` shell 环境下无法工作的 bash 特性。\n\n#### 使用算术\n\n第 10 章展示了在 `bash` shell 脚本中表示数学操作的三种方法：\n\
  \n*   使用 `expr` 命令：`expr operation`\n*   使用方括号：`$[ operation ]`\n*   使用双括号：`$((\
  \ operation ))`\n\n`dash` shell 支持 `expr` 命令和双括号方法，但不支持方括号方法。如果你有大量使用方括号的数学操作，这可能会成为问题：\n\
  \n```bash\n$ cat test5\n#!/bin/dash\n# testing mathematical operations\nvalue1=10\n\
  value2=15\nvalue3=$[ $value1 * $value2 ]\necho “The answer is $value3”\n$ ./test5\n\
  ./test5: 7: value1: not found\nThe answer is\n$\n```\n\n在 `dash` shell 脚本中执行数学操作的正确格式是使用双括号方法：\n\
  \n```bash\n$ cat test5b\n#!/bin/dash\n# testing mathematical operations\nvalue1=10\n\
  value2=15\nvalue3=$(( $value1 * $value2 ))\necho “The answer is $value3”\n$ ./test5b\n\
  The answer is 150\n$\n```\n\n现在 shell 可以正常进行计算。\n\n#### test 命令\n\n虽然 `dash` shell\
  \ 支持 `test` 命令，但你必须小心如何使用它。`bash` shell 版本的 `test` 命令与 `dash` shell 版本略有不同。\n\n\
  `bash` shell 的 `test` 命令允许你使用双等号 (`==`) 来测试两个字符串是否相等。这是为了适应习惯在其他编程语言中使用这种格式的程序员：\n\
  \n```bash\n$ cat test6\n#!/bin/bash\n# testing the == comparison\ntest1=abcdef\n\
  test2=abcdef\nif [ $test1 == $test2 ]\nthen\n    echo “They're the same!”\nelse\n\
  \    echo “They're different”\nfi\n$ ./test6\nThey're the same!\n$\n```\n\n这很简单。然而，如果你在\
  \ `dash` shell 环境中运行此脚本，你将得到一个不受欢迎的结果：\n\n```bash\n$ ./test6\n[: ==: unexpected\
  \ operator\nThey're different\n$\n```\n\n`dash` shell 中提供的 `test` 命令不识别用于文本比较的 `==`\
  \ 符号。相反，它只识别 `=` 符号。如果你将文本比较符号改为单个等号，那么在 `bash` 和 `dash` shell 环境中一切都正常：\n\n```bash\n\
  $ cat test7\n#!/bin/dash\n# testing the = comparison\ntest1=abcdef\ntest2=abcdef\n\
  if [ $test1 = $test2 ]\nthen\n    echo “They're the same!”\nelse\n    echo “They're\
  \ different”\nfi\n$ ./test7\nThey're the same!\n$\n```\n\n这个小 bash 特导致了 shell 脚本编写者许多小时的沮丧！\n\
  \n## echo 语句选项\n\n\n\n\n\n简单的 `echo` 语句也是 dash shell 程序员感到沮丧的另一个来源。它在 `dash` 和 `bash`\
  \ shell 中的行为并不相同。\n\n在 `bash` shell 中，如果你想在输出中显示特殊字符，必须使用 `-e` 命令行参数：\n\n```\necho\
  \ -e \"This line contains\\ta special character\"\n```\n\n`echo` 语句包含了表示制表符（tab）的特殊字符\
  \ `\\t`。如果不使用 `-e` 命令行参数，`bash` 版本的 `echo` 语句会忽略该特殊字符。这里有一个用于在 `bash` shell 中演示此点的测试：\n\
  \n```\n$ cat test8\n#!/bin/bash\n# testing echo commands\n\necho \"This is a normal\
  \ test\"\necho \"This test uses a\\tspecial character\"\necho -e \"This test uses\
  \ a\\tspecial character\"\necho -n \"Does this work: \"\nread test\necho \"This\
  \ is the end of the test\"\n$ ./test8\n\nThis is a normal test\nThis test uses a\\\
  tspecial character\nThis test uses a special character\nDoes this work: N\nThis\
  \ is the end of the test\n$\n```\n\n没有使用 `-e` 命令行参数的 `echo` 语句将 `\\t` 字符作为普通文本显示，因此为了获取制表符，必须使用\
  \ `-e` 命令行参数。\n\n在 `dash` shell 中，情况有些不同。`dash` shell 中的 `echo` 语句会自动识别并显示特殊字符。正如此，没有\
  \ `-e` 命令行参数。如果你尝试在 `dash` 环境中运行相同的脚本，将得到以下输出：\n\n```\n$ ./test8\nThis is a simple\
  \ test\nThis line uses a      special character\n-e This line uses a      special\
  \ character\nDoes this work: N\nThis is the end of the test\n$\n```\n\n从输出中可以看出，`dash`\
  \ shell 版本的 `echo` 命令在没有 `-e` 命令行参数的情况下完全可以正常识别行中的特殊字符，但对于包含 `-e` 命令行参数的行，它会感到困惑并将\
  \ `-e` 作为普通文本显示。\n\n遗憾的是，这个问题没有简单的解决方案。如果你必须编写可以在 `bash` 和 `dash` shell 环境中运行的脚本，最佳解决方案是使用\
  \ `printf` 命令来显示文本。该命令在两种 shell 环境中的工作方式相同，并且可以正常显示特殊字符。\n\n## function 命令\n\n第\
  \ 16 章向你展示了如何在 shell 脚本中定义自己的函数。`bash` shell 支持两种定义函数的方法。第一种方法是使用 `function` 语句：\n\
  \n```\nfunction name {\n    commands\n}\n```\n\n`name` 属性定义了分配给函数的唯一名称。你在脚本中定义的每个函数必须分配一个唯一的名称。\n\
  \n`commands` 是构成你函数的一个或多个 `bash` shell 命令。当你调用函数时，`bash` shell 会按照命令在函数中出现的顺序执行每条命令，就像在普通脚本中一样。\n\
  \n在 `bash` shell 脚本中定义函数的第二种格式更贴于其他编程语言中函数的定义方式：\n\n```\nname() {\ncommands\n}\n\
  ```\n\n函数名后的空括号表示你正在定义一个函数。这种格式遵循原始 shell 脚本函数格式相同的命名规则。\n\n`dash` shell 不第一种定义函数的方法（不支持\
  \ `function` 语句）。相反，在 `dash` shell 中，你必须使用带括号的函数名来定义函数。如果你尝试在 `dash` shell 中运行为\
  \ `bash` shell 设计的函数，将得到错误消息：\n\n```\n$ cat test9\n#!/bin/dash\n# testing functions\n\
  \nfunction func1() {\n    echo \"This is an example of a function\"\n}\n\ncount=1\n\
  while [ $count -le 5 ]\ndo\n    func1\n    count=$(( $count + 1 ))\ndone\necho \"\
  This is the end of the loop\"\nfunc1\necho \"This is the end of the script\"\n$\
  \ ./test9\n./test9: 4: Syntax error: \"(\" unexpected\n$\n```\n\n`dash` shell 没有将函数代码分配给函数，而是执行了函数定义内部的代码，然后对\
  \ shell 脚本的格式表示不满。\n\n如果你正在编写可能用于 `dash` 环境的 shell 脚本，请务必使用第二种定义函数的方法：\n\n```\n\
  $ cat test10\n#!/bin/dash\n# testing functions\n\nfunc1() {\n    echo \"This is\
  \ an example of a function\"\n}\n\ncount=1\nwhile [ $count -le 5 ]\ndo\n    func1\n\
  \    count=$(( $count + 1 ))\ndone\necho \"This is the end of the loop\"\nfunc1\n\
  echo \"This is the end of the script\"\n$\n```\n\n\n\n\n\n* **History**: 控制命令历史回溯的选项。\n\
  * **初始化**: 控制 shell 在启动时如何处理变量和启动文件的选项。\n* **输入/输出**: 控制命令处理的选项。\n* **作业控制**: 指定\
  \ shell 如何处理和启动作业的选项。\n* **提示符**: 定义 shell 如何与命令行提示符交互的选项。\n* **脚本与函数**: 控制 shell\
  \ 如何处理 脚本和定义 shell 函数的选项。\n* **Shell 仿真**: 允许你设置 zsh shell 的行为以模拟其他类型 shell 的行为。\n\
  * **Shell 状态**: 定义启动何种类型 shell 的选项。\n* **zle**: 控制 zsh 行编辑器 (`zle`) 功能的选项。\n* **选项别名**:\
  \ 可以作为其他选项名称别名的特殊选项。\n\n有了如此许多不同类的 shell 选项，你可以想象 zsh shell 支持多少个实际选项。以下章节展示了在自定义\
  \ zsh shell 环境时可使用的不同 zsh shell 选项示例。\n\n## Shell 状态 (Shell State)\n\n有六种不同的 zsh\
  \ shell 选项定义了启动的 shell 类型：\n\n* `interactive (-i)`: 提供一个命令行界面提示符，用于输入内置命令和程序名。\n\
  * `login (-l)`: 默认的 zsh shell 类型，处理 zsh shell 启动文件并提供命令行界面提示符。\n* `privileged (-p)`:\
  \ 如果有效用户 ID (`UID`) 与真实 UID 不一致（用户已成为 root 用户），则使用此默认。此选项会禁用用户启动文件。\n* `restricted\
  \ (-r)`: 将用户限制在 shell 中指定的目录结构中。\n* `shin_stdin (-s)`: 从 `STDIN` 读取命令。\n* `single_command\
  \ (-t)`: 从 `STDIN` 执行单个命令并退出。\n\nshell 状态决定了 shell 时是否带有命令行界面提示符，以及用户在 shell 内部拥有何种权限。\n\
  \n## Shell 仿真 (Shell Emulation)\n\nShell 仿真选项允许你自定义 zsh shell，使其行为类似于 C shell (`csh`)\
  \ 或 Korn shell (`ksh`)，这两种是程序员中同样受欢迎的其它 shell。这些选项如下：\n\n* `bsd_echo`: 使 `echo`\
  \ 语句与 C shell 的 `echo` 命令兼容。\n* `csh_junkie_history`: 使用不带指定符的 `history` 命令来引用上一个命令。\n\
  * `csh_junkie_loops`: 允许 `while` 和 `for` 循环像 C shell 一样使用 `end` 而不是 `do` 和 `done`。\n\
  * `csh_junkie_quotes`: 修改单双引号的使用规则以匹配 C shell。\n* `csh_nullcmd`: 在执行没有命令的重定向时，不使用\
  \ `NULLCMD` 和 `READNULLCMD` 变量的值。\n* `ksh_arrays`: 使用 Korn 风格的数组，数字数组从 0 开始，并要求使用大括号引用数组元素。\n\
  * `ksh_autoload`: 仿真 Korn shell 的自动加载功能。\n* `ksh_option_print`: 仿真 Korn shell 打印选项的方法。\n\
  * `ksh_typeset`: 更改 `typeset` 命令参数的处理方式。\n* `posix_builtins`: 使用 `builtin` 命令执行内置命令。\n\
  * `sh_file_expansion`: 在执行其他扩展之前执行文件名扩展。\n* `sh_nullcmd`: 在执行重定向时不使用 `NULLCMD` 和\
  \ `READNULLCMD` 变量。\n* `sh_option_letters`: 类似于 Korn shell 解析单字母 shell 命令行选项。\n\
  * `sh_word_split`: 对未加引号的参数扩展进行字段分割。\n* `traps_async`: 在等待程序退出时，立即处理信号并运行捕获函数 (traps)。\n\
  \n通过多个选项，你可以根据需要从 zsh shell 中选择需要仿真的 `csh` 或 `ksh` shell 特性，而必需要仿真整个 shell。\n\n\
  ## 初始化 (Initialization)\n\n有几个处理 shell 启动功能的选项：\n\n* `all_export`: 所有参数和变量都自动导出到子\
  \ shell 进程。\n* `global_export`: 导出到环境的参数不会在 `function` 中变为局部变量。\n* `global_rcs`:\
  \ 如果未设置，zsh shell 不运行全局启动文件，但仍运行本地启动文件。\n* `rcs`: 如果未设置，zsh shell 运行 `/etc/zshenv`\
  \ 启动文件，但不运行其他文件。\n\n初始化选项允许你指定在 shell 环境中运行（如果有）zsh shell 启动文件。你也可以在启动文件内部设置这些值，以限制\
  \ shell 执行哪些文件。\n\n## 脚本与函数 (Scripts and Functions)\n\n脚本和函数选项允许你自定义 zsh shell 中的脚本环境。这是设置函数在\
  \ shell 中执行方式的一种简便方法。\n\n* `c_bases`: 以 C 格式 (0xdddd) 显示十六进制数，而不是 shell 格式 (16#dddd)。\n\
  * `err_exit`: 如果命令以非零状态退出，则执行 `ZERR` 捕获中的命令并退出。\n* `err_return`: 如果命令具有非零退出状态，则立即从封装的\
  \ `function` 中返回。\n* `eval_lineno`: 如果设置，使用 `eval` 内置命令求值的的表达式的行号将与 shell 环境的其他部分分开跟踪。\n\
  * `exec`: 执行命令。如果未设置此选项，则读取命令并报告错误，但不执行命令。\n* `function_argzero`: 将 `$0` 设置为 `function`\
  \ 或脚本的名字。\n* `local_options`: 如果设置，当 shell `function` 返回时，将恢复在 `function` 之前设置的所有选项。\n\
  * `local_traps`: 如果设置，当在 `function` 内设置捕获时，将恢复捕获的上述状态。\n* `multios`: 当尝试多次重定向时，执行隐式的\
  \ `tee` 命令。\n* `octal_zero`: 将任何以零开头的整数字符串解释为八进制。\n* `typeset_silent`: 如果未设置，使用\
  \ `typeset` 配合参数名将显示当前值。\n* `verbose`: 显示读取的 shell 输入行。\n* `xtrace`: 在 shell 执行命令时显示命令及其参数。\n\
  \n## 内置命令 (Built-in Commands)\n\nzsh shell 的独特之处在于，它允许你在退出 shell 中定义的函数时扩展内置命令。这为你的许多不同应用程序提供了丰富且快速的实用工具。\n\
  \n本节描述了核心内置命令，以及当时可用的各种模块。\n\n### 内置命令 (Built-in Commands)\n\nzsh shell 的核心包含了你在其他\
  \ shell 中常见的常用内置命令。\n\n### 核心内置命令 (Core Built-in Commands)\n\n| 命令 | 描述 |\n| :---\
  \ | :--- |\n| `alias` | 为命令和参数定义别名。 |\n| `autoload` | 将 shell 函数预加载到内存中以便快速访问。 |\n\
  | `bg` | 在后台模式下执行作业。 |\n| `bindkey` | 将组合键绑定到命令。 |\n| `builtin` | 执行指定的内置命令，而不是同名的可执行文件。\
  \ |\n| `bye` | 等于 `exit`。 |\n| `cd` | 更改当前工作目录。 |\n| `chdir` | 更改当前工作目录。 |\n| `command`\
  \ | 作为外部文件执行指定的命令，而不是函数或内置命令。 |\n| `declare` | 设置变量的数据类型（等于 `typeset`）。 |\n| `dirs`\
  \ | 显示目录栈的内容。 |\n| `disable` | 临时禁用指定的哈表元素。 |\n| `disown` | 从作业表中移除指定的作业。 |\n| `echo`\
  \ | 显示变量和文本。 |\n| `emulate` | 设置 zsh 仿真另一种 shell，例如 Bourne、Korn 或 C shell。 |\n|\
  \ `enable` | 启用指定的哈表元素。 |\n| `eval` | 在当前 shell 进程中执行指定的命令和参数。 |\n\n\n\n\n\n| Command\
  \ | Description |\n| :--- | :--- |\n| `exec` | 执行指定的命令和参数，替换当前的 shell 进程。 |\n| `exit`\
  \ | 以指定的退出状态退出 shell。如果未指定，则使用上一个命令的退出状态。 |\n| `export` | 允许指定的环境变量名和值在子 shell 进程中使用。\
  \ |\n| `false` | 返回退出状态 1。 |\n| `fc` | 从历史列表中选择一个范围的命令。 |\n| `fg` | 在前台模式执行指定的作业。\
  \ |\n| `float` | 设置指定的变量作为浮点变量使用。 |\n| `functions` | 将指定的名称设置为函数。 |\n| `getln` |\
  \ 从缓冲区栈中读取下一个值并放入指定的变量中。 |\n| `getopts` | 获取命令行参数中的下一个有效选项并将其放入指定的变量中。 |\n| `hash`\
  \ | 直接修改命令哈表的内容。 |\n| `history` | 列出历史文件中包含的命令。 |\n| `integer` | 设置指定的变量作为整数值使用。\
  \ |\n| `jobs` | 列出指定作业或分配给 shell 进程的所有作业的信息。 |\n| `kill` | 向指定的进程或作业发送信号（默认为 SIGTERM）。\
  \ |\n| `let` | 评估数学运算并将结果赋值给变量。 |\n| `limit` | 设置或显示资源限制。 |\n| `local` | 为指定的变量设置数据特征。\
  \ |\n| `log` | 显示所有受 watch 参数影响的当前登录用户。 |\n| `logout` | 与 exit 相同，但仅当 shell 为登录\
  \ shell 时起作用。 |\n| `popd` | 从目录栈中移除下一个项。 |\n| `print` | 显示变量和文本。 |\n| `printf` |\
  \ 使用 C 风格格式字符串显示变量和文本。 |\n| `pushd` | 当前工作目录，并将上一个目录放入目录栈。 |\n| `pushln` | 将指定的参数放入编辑缓冲区栈中。\
  \ |\n| `pwd` | 显示当前工作目录的完整路径。 |\n| `read` | 读取一行并使用 IFS 字符将数据字段分配给指定的变量。 |\n| `readonly`\
  \ | 给不可更改的变量赋值。 |\n| `rehash` | 重建命令哈表。 |\n| `set` | 为 shell 设置选项或位置参数。 |\n| `setopt`\
  \ | 设置 shell 。 |\n| `shift` | 读取并删除第一个位置参数，然后将剩余参数向下移动位置。 |\n| `source` | 找到指定的文件并将其复制到当前位置。\
  \ |\n| `suspend` | 挂起 shell 的执行直到接收到 SIGCONT 信号。 |\n| `test` | 如果指定的条件为真则返回退出状态\
  \ 0。 |\n| `times` | 显示 shell 以及在 shell 中运行的进程的累计用户时间和系统时间。 |\n| `trap` | 禁止 shell\
  \ 处理指定的信号，如果接收到信号则执行指定的命令。 |\n| `true` | 返回零退出状态。 |\n| `ttyctl` | 锁定和解锁显示器。 |\n\
  | `type` | 显示 shell 如何解释指定的命令。 |\n| `typeset` | 设置或显示变量的属性。 |\n| `ulimit` | 设置或显示\
  \ shell 或在 shell 中运行的进程的资源限制。 |\n| `umask` | 设置或显示创建文件和目录的默认权限。 |\n| `unalias` |\
  \ 指定的命令别名。 |\n| `unfunction` | 指定的定义函数。 |\n| `unhash` | 从哈表中删除指定的命令。 |\n| `unlimit`\
  \ | 指定的资源限制。 |\n| `unset` | 指定的变量属性。 |\n| `unsetopt` | 指定的 shell 选项。 |\n| `wait`\
  \ | 等待指定的作业或进程完成。 |\n| `whence` | 显示 shell 如何解释指定的命令。 |\n| `where` | 如果 shell 找到指定的命令，则显示其路径。\
  \ |\n| `which` | 使用 csh 风格输出指定的命令的路径。 |\n| `zcompile` | 编译指定的函数或脚本以便快速自动加载。 |\n\
  | `zmodload` | 对可加载的 zsh 模块进行操作。 |\n\nzsh shell 在提供内置命令方面毫不逊色！你应该能根据它们在 bash 中的对应项识别出大部分命令。zsh\
  \ shell 内置命令最重要的特性是模块。\n\n### 插件模块 (Add-in Modules)\n\n有一个长长的模块列表为 zsh shell 提供额外的内置命令，随着资源丰富的程序员创建新模块，这个列表在不断增长。表\
  \ 22.6 显示了本书时可用的模块。\n\n表 22.6 zsh 模块\n\n| 模块 | 描述 |\n| :--- | :--- |\n| `zsh/cap`\
  \ | POSIX 兼容命令 |\n| `zsh/clone` | 将运行中的 shell 克隆到另一个终端的命令 |\n| `zsh/compctl` | 控制命令补全的命令\
  \ |\n| `zsh/complete` | 命令行补全命令 |\n| `zsh/complist` | 命令行补全列表扩展 |\n| `zsh/computil`\
  \ | 命令行补全实用命令 |\n| `zsh/datetime` | 额外的日期时间命令和变量 |\n| `zsh/deltochar` | 模拟 emacs\
  \ 功能的行编辑器函数 |\n| `zsh/files` | 文件处理的命令 |\n| `zsh/mapfile` | 通过关联数组访问外部文件 |\n| `zsh/mathfunc`\
  \ | 额外的科学函数 |\n| `zsh/parameter` | 通过关联数组访问命令哈表 |\n| `zsh/pcre` | 扩展正则表达式库 |\n|\
  \ `zsh/sched` | 用于提供定时命令执行的调度命令 |\n| `zsh/net/socket` | Unix 域套接字支持 |\n| `zsh/stat`\
  \ | 访问 stat 系统调用提供系统统计 |\n| `zsh/system` | 各种低级系统功能的接口 |\n| `zsh/net/tcp` | 访问 TCP\
  \ 套接字 |\n| `zsh/termcap` | termcap 数据库接口 |\n| `zsh/terminfo` | terminfo 数据库接口 |\n\
  | `zsh/zftp` | 特定的 FTP 客户端命令 |\n| `zsh/zle` | zshell 行编辑器 |\n| `zsh/zleparameter`\
  \ | 使用变量修改 zle |\n| `zsh/zprof` | 允许对 shell 函数分析 |\n| `zsh/zpty` | 在伪终端中启动命令 |\n\
  | `zsh/zselect` | 文件描述符就绪时阻塞并返回 |\n| `zsh/zutil` | 各种 shell 实用程序 |\n\nzsh shell\
  \ 模块涵盖了从提供简单的命令行功能到高级函数的广泛主题。zsh shell 的设计理念是提供一个基础最小环境，并让你添加完成工作所需的组件。\n\n### 查看、添加和删除模块\n\
  \n`zmodload` 命令是 zsh 模块的接口。你使用此命令从 zsh 会话中查看、添加和删除模块。\n\n不带任何命令行参数使用 `zmodload`\
  \ 命令将显示当前你的 zsh shell 中已安装的模块：\n\n```bash\nzmodload\nzsh/zutil\nzsh/complete\nzsh/main\n\
  zsh/terminfo\nzsh/zle\nzsh/parameter\n```\n\n不同的 zsh shell 实现默认包含不同的模块。要添加新模块，只需在\
  \ `zmodload` 命令行中指定模块名称：\n\n```bash\nzmodload zsh/zftp\n```\n\n没有任何指示表明模块已加载。你可以执行另一个\
  \ `zmodload` 命令，新模块应该出现在已安装模块列表中。\n\n一旦加载了模块，与该模块相关的命令即可作为内置命令可用：\n\n```bash\nzftp\
  \ open myhost.com testing\nWelcome to the myhost FTP server.\nzftp cd test\nzftp\
  \ dir\n01-21-11 11:21PM 120823 test1\n01-21-11 11:23PM 118432 test2\nzftp get test1\
  \ > test1.txt\nzftp close\n```\n\n`zftp` 命令允许你直接从 zsh shell 命令行进行完整的 FTP 会话！你可以将这些命令整合到\
  \ zsh shell 脚本中，直接从脚本执行文件传输。\n\n要删除已安装的模块，使用 `-u` 参数以及模块名称：\n\n```bash\nzmodload\
  \ -u zsh/zftp\nzftp\nzsh: command not found: zftp\n```\n\n注意\n\n\n\n\n将 `zmodload`\
  \ 命令放置在 `$HOME/.zshrc` 启动文件中是一种常见的做法，这样你喜欢的函数就会在 zsh shell 启动时自动加载。\n\n## 使用 zsh\
  \ 进行脚本编写\n\nzsh shell 的主要目的是为 shell 脚本程序员提供一个高级的编程环境。考虑到这一点，zsh shell 提供了许多让 shell\
  \ 脚本编写变得更容易的特性，这并不令人意外。\n\n## 数学运算\n\n正如你所预期的那样，zsh shell 允许你轻松地执行数学函数。在过去，Korn\
  \ shell 通过提供对浮点数的支持，在支持数学运算方面一直处于领先。而 zsh shell 在其所有的数学运算中都对浮点数提供了完全支持！\n\n### 执行计算\n\
  \nzsh shell 支持两种执行数学运算的方法：\n\n*   `let` 命令\n*   双圆括号 `(( ... ))`\n\n当你使用 `let` 命令时，你应该将操作括在双引号中，以允许包含空格：\n\
  \n```bash\n% let value1=\" 4 * 5.1 / 3.2 \"\n% echo $value1\n6.3749999999999991\n\
  %\n```\n\n注意，使用浮点数会引入精度问题。为了解决这个问题，最好的做法是使用 `printf` 命令并指定所需的进制精度来正确显示答案：\n\n```bash\n\
  % printf \"%6.3f\\n\" $value1\n6.375\n%\n```\n\n现在这样好多了！\n\n第二种方法是使用双圆括号。这种方法结合了两种定义数学运算的技术：\n\
  \n```bash\n% value1=$(( 4 * 5.1 ))\n% (( value2 = 4 * 5.1 ))\n% printf \"%6.3f\\\
  n\" $value1 $value2\n20.400\n20.400\n%\n```\n\n注意，你可以将双圆括号放在仅操作周围（前面加一个美元符号 `$`），或者放在整个赋值语句周围。两种方法产生相同的结果。\n\
  \n如果你不预先使用 `typeset` 命令声明变量的数据类型，zsh shell 会尝试自动分配数据类型。当在同时处理整数和浮点数时，这可能是危险的。看下这个例子：\n\
  \n```bash\n% value=10\n% value2=$(( $value1 / 3 ))\n% echo $value2\n3\n%\n```\n\n\
  这可能不是你想要得到的计算结果。当你指定不带小数的数字时，zsh shell 将其解释为整数值并执行整数计算。为了确保结果是浮点数，你必须指定带小数的数字：\n\
  \n```bash\n% value=10.\n% value2=$(( $value1 / 3. ))\n% echo $value2\n3.3333333333333335\n\
  %\n```\n\n现在结果是浮点格式了。\n\n### 数学函数\n\n在 zsh shell 中，内置的数学函数要么极多，要么极少。默认的 zsh shell\
  \ 不包含任何特殊的数学函数。但是，如果你安装了 `zsh/mathfunc` 模块，你将拥有比你可能可能用到的多的数学函数：\n\n```bash\n% value1=$((\
  \ sqrt(9) ))\nzsh: unknown function: sqrt\n% zmodload zsh/mathfunc\n% value1=$((\
  \ sqrt(9) ))\n% echo $value1\n3.\n%\n```\n\n这很简单！现在你手头就有一整套数学函数库。\n\n**注意**\n\n\
  zsh 支持许多数学函数。要查看 `zsh/mathfunc` 模块提供的所有数学函数的完整列表，请参阅 `zshmodules` 的手册页。\n\n## 结构化命令\n\
  \nzsh shell 为你的 shell 脚本提供了常用的结构化命令：\n\n*   if-then-else 语句\n*   for 循环（包括 C 风格）\n\
  *   while 循环\n*   until 循环\n*   select 语句\n*   case 语句\n\nzsh shell 对这些每个结构化命令使用的语法与你在\
  \ bash shell 中熟悉的语法相同。zsh shell 还包含一个名为 `repeat` 的不同结构化命令。`repeat` 命令使用以下格式：\n\n\
  ```bash\nrepeat param\ndo\n    commands\ndone\n```\n\n`param` 参数必须是一个数字或求值为数字的数学运算。然后\
  \ `repeat` 命令将执行指定次数的指定的命令：\n\n```bash\n% cat test1\n#!/bin/zsh\n# using the repeat\
  \ command\nvalue1=$(( 10 / 2 ))\nrepeat $value1\ndo\n    echo \"This is a test\"\
  \ndone\n$ ./test1\nThis is a test\nThis is a test\nThis is a test\nThis is a test\n\
  This is a test\n%\n```\n\n此命令允许你根据计算结果重复指定次数的代码段。\n\n## 函数\n\nzsh shell 支持使用 `function`\
  \ 命令或通过带括号的定义函数名来创建你的函数：\n\n```bash\n% function funct1 {\n    echo \"This is the\
  \ test1 function\"\n}\n% funct2() {\n    echo \"This is the test2 function\"\n}\n\
  % funct1\nThis is the test1 function\n% funct2\nThis is the test2 function\n%\n\
  ```\n\n与 bash 函数一样（见第 16 章），你可以在 shell 脚本中定义函数，并使用全局变量或向函数传递参数。这里有一个使用全局变量的例子：\n\
  \n```bash\n% function funct1 {\n    echo \"This is the test1 function\"\n}\n% funct2()\
  \ {\n    echo \"This is the test2 function\"\n}\n% funct1\nThis is the test1 function\n\
  % funct2\nThis is the test2 function\n%\n```\n\n```bash\n% value=10\n% value2=$((\
  \ $value1 / 3 ))\n% echo $value2\n3\n%\n```\n\n```bash\n% value=10.\n% value2=$((\
  \ $value1 / 3. ))\n% echo $value2\n3.3333333333333335\n%\n```\n\n```bash\n% value1=$((\
