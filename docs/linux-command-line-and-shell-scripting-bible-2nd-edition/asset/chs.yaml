  nobody:x:99:99:Nobody:/:/sbin/nologin\nrpm:x:37:37::/var/lib/rpm:/sbin/nologin\n\
  ```\n\n\n\n\n*   用户的 `HOME` 目录位置\n*   用户的默认 shell\n\n`/etc/passwd` 文件中的密码字段被设为 `x`。这并不意味着所有用户账户都具有相同的密码。在\
  \ Linux 的早期时代，`/etc/passwd` 文件包含用户密码的加密版本。然而，由于许多程序需要访问 `/etc/passwd` 文件来获取用户信息，这在某种程度上成了一个安全问题。随着能够轻松解密加密密码的软件出现，坏分子可以毫无顾忌地尝试破解存储在\
  \ `/etc/passwd` 文件中的用户密码。Linux 开发者需要重新考虑这一策略。\n\n现在，绝大多数 Linux 系统将用户密码存储在一个单独的文件中（称为\
  \ shadow 文件，位于 `/etc/shadow`）。只有特殊程序（如登录程序）允许访问此文件。\n\n如你所见，`/etc/passwd` 文件是一个标准的文本文件。你可以使用任何文本编辑器直接在\
  \ `/etc/passwd` 文件中手动执行用户管理功能（如添加、修改或删除用户账户）。然而，这是一种极其危险的做法。如果 `/etc/passwd` 文件损坏，系统将无法读取它，并阻止任何人（甚至是\
  \ root 用户）登录。相反，使用标准的 Linux 用户管理工具来执行所有用户管理功能更为安全。\n\n## `/etc/shadow` 文件\n\n`/etc/shadow`\
  \ 文件对 Linux 系统管理密码提供了更精细的控制。只有 root 用户可以访问 `/etc/shadow` 文件，这使其比 `/etc/passwd` 文件更安全。\n\
  \n`/etc/shadow` 文件为系统的每个用户账户包含一条记录。记录格式如下：\n\n`rich:$1$.FfcK0ns$f1UgiyHQ25wrB/hykCn020:11627:0:99999:7:::`\n\
  \n每个 `/etc/shadow` 文件记录包含九字段：\n\n*   与 `/etc/passwd` 文件中的登录名对应的登录名\n*   加密后的密码\n\
  *   自 1970 年 1 月 1 日以来最后一次更改密码的天数\n*   更改密码前的最少天数\n*   必须更改密码前的天数\n*   密码过期前提醒用户更改密码的天数\n\
  *   密码过期后账户被禁用前的天数\n*   用户账户被禁用的日期（以自 1970 年 1 月 1 日以来的天数存储）\n*   预留以后使用的字段\n\n\
  使用 shadow 密码系统，Linux 系统对用户密码有了更精细的控制。它可以控制用户必须更改密码的频率，以及在密码未更改时何时禁用账户。\n\n## 添加新用户\n\
  \n向你的 Linux 系统添加新用户的主要工具是 `useradd`。该命令提供了一种简单的方法，可以一次性创建新用户账户并设置用户的 `HOME` 目录结构。`useradd`\
  \ 命令使用系统默认值和命令行参数组合来定义用户账户。要查看你的 Linux 发行版上使用的系统默认值，请带有 `-D` 参数输入 `useradd` 命令：\n\
  \n```bash\n# /usr/sbin/useradd -D\n\nGROUP=100\nHOME=/home\nINACTIVE=-1\nEXPIRE=\n\
  SHELL=/bin/bash\nSKEL=/etc/skel\nCREATE_MAIL_SPOOL=yes\n```\n\n### 注意事项\n\n某些 Linux\
  \ 发行版将 Linux 用户和组工具放置在 `/usr/sbin` 目录下，该目录可能不在你的 `PATH` 环境变量中。如果你的 Linux 发行版是这种情况，请将该目录添加到你的\
  \ `PATH` 中，或使用绝对路径来运行它。\n\n`-D` 参数显示了如果在创建新用户账户时没有在命令行中指定参数，`useradd` 命令将使用的默认值。此示例显示了以下默认值：\n\
  \n*   新用户将被添加到组 ID 为 100 的公共组中。\n*   新用户将在 `/home/loginname` 目录下创建一个 `HOME` 账户。\n\
  *   当密码过期时，账户不会被禁用。\n*   新账户不会被设置在特定日期过期。\n*   新账户将使用 `bash` shell 作为默认 shell。\n\
  *   系统会将 `/etc/skel` 目录的内容复制到用户的 `HOME` 目录。\n*   系统将在邮件目录为该用户账户创建一个文件以接收邮件。\n\n\
  倒数第二个值很有趣。`useradd` 命令允许管理员创建一个默认的 `HOME` 目录配置，然后将其作为模板来创建新用户的 `HOME` 目录。这允许你自动将系统默认文件放在每个新用户的\
  \ `HOME` 目录中。在 Ubuntu Linux 系统中，`/etc/skel` 目录包含以下文件：\n\n```bash\n$ ls -al /etc/skel\n\
  total 32\ndrwxr-xr-x  2 root root  4096 2010-04-29 08:26 .\ndrwxr-xr-x 135 root\
  \ root 12288 2010-09-23 18:49 ..\n-rw-r--r--    1 root root      1\n```\n\n（注：原文中似乎存在重复内容，已进行清理以保持清晰）。\n\
  \n\n\n\n\n如你所示，在创建新用户账户时，仅通过命令行参数就可以覆盖所有的系统默认值。然而，如果你发现自己总是需要覆盖某个值，那么直接更改系统默认值会更简单。\n\
  \n你可以使用 `-D` 参数配合代表你需要更改的值的参数来更改系统默认的新用户默认值。这些参数如表 6.2 所示。\n\n### 表 6.2 (#9781118087770c06.xhtml_c06_tbl_anc_0002)\
  \ useradd 修改默认值参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-b default_home` | 更改用户 `HOME`\
  \ 目录创建的位置。 |\n| `-e expiration_date` | 修改新账户的过期日期。 |\n| `-f inactive` | 修改密码过期后账户被禁用前的天数。\
  \ |\n| `-g group` | 修改使用的默认组名或 GID。 |\n| `-s shell` | 更改默认登录 shell。 |\n\n更改默认值非常轻而易举：\n\
  \n```bash\n# useradd -D -s /bin/tsch\n# useradd -D\nGROUP=100\nHOME=/home\nINACTIVE=-1\n\
  EXPIRE=\nSHELL=/bin/tsch\nSKEL=/etc/skel\nCREATE_MAIL_SPOOL=yes\n#\n```\n\n现在，`useradd`\
  \ 命令将使用 `tsch` shell 作为你创建的所有新用户账户的默认登录 shell。\n\n## 删除用户\n\n如果你想从系统中删除一个用户，你需要的是\
  \ `userdel` 命令。默认情况下，`userdel` 命令仅从 `/etc/passwd` 文件删除用户信息。它不会删除该账户在系统上拥有的任何文件。\n\
  \n如果你使用 `-r` 参数，`userdel` 将删除用户的 `HOME` 目录以及用户的邮件目录。然而，系统上可能仍有其他由被删除的用户账户拥的文件。这在某些环境中可能会成为问题。\n\
  \n以下是一个使用 `userdel` 命令删除现有用户账户的示例：\n\n```bash\n# /usr/sbin/userdel -r test\n# ls\
  \ -al /home/test\nls: cannot access /home/test: No such file or directory\n#\n```\n\
  \n使用 `-r` 参数后，用户的旧 `/home/test` 目录已不再存在。\n\n### 注意事项\n\n在用户众多的环境中使用 `-r` 参数时要小心。你不知道用户是否在其\
  \ `HOME` 目录中存储了其他人或其他程序使用的重要文件。在删除用户的 `HOME` 目录之前，请务必检查！\n\n## 修改用户\n\nLinux 提供了几个不同的工具来修改现有用户账户的信息。表\
  \ 6.3 显示了这些工具。\n\n### 表 6.3 (#9781118087770c06.xhtml_c06_tbl_anc_0003) 用户账户修改工具\n\
  \n| 命令 | 描述 |\n| :--- | :--- |\n| `usermod` | 编辑用户账户字段，并指定主组和附加组成关系 |\n| `passwd`\
  \ | 更改现有用户的密码 |\n| `chpasswd` | 读取登录名和密码对的文件并更新密码 |\n| `chage` | 更改密码的过期日期 |\n|\
  \ `chfn` | 更改用户账户的注释信息 |\n| `chsh` | 更改用户账户的默认 shell |\n\n这些工具中的每一个都提供了更改用户账户信息的特定功能。接下来的章节将描述这些这些工具。\n\
  \n### usermod\n\n`usermod` 命令是用户账户修改工具中最稳健的。它提供了更改 `/etc/passwd` 文件中大多数字段的选项。要做到这一点，你只需要使用与你想要更改的值对应的命令行参数。这些参数大部分与\
  \ `useradd` 参数相同（例如用 `-c` 更改注释字段，`-e` 更改过期日期，以及 `-g` 更改默认登录组）。不过，有几个额外的参数可能派上用场：\n\
  \n* `-l` 更改用户账户的登录名\n* `-L` 锁定账户，使用户无法登录\n* `-p` 更改账户密码\n* `-U` 解锁账户，使用户可以登录\n\n\
  `-L` 参数特别方便。使用它来锁定账户，以便使用户无法登录，而无需删除账户和用户数据。要将账户恢复正常，只需使用 `-U` 参数即可。\n\n### passwd\
  \ 和 chpasswd\n\n更改单个用户密码的快速方法是使用 `passwd` 命令：\n\n```bash\n# passwd test\nChanging\
  \ password for user test.\nNew UNIX password:\nRetype new UNIX password:\npasswd:\
  \ all authentication tokens updated successfully.\n#\n```\n\n如果你只单独使用 `passwd` 命令，它将更改你自己的密码。系统中的任何用户都可以更改自己的密码，但只有\
  \ `root` 用户可以更改别人的密码。`-e` 选项是强制用户在下次登录时更改密码的方便方法。这允许你将用户的密码设置为一个简单的值，然后强制他们更改为他们能记住的更复杂的密码。\n\
  \n如果你一直需要对系统上的大量用户进行批量密码更改，`chpasswd` 命令将成为你的救星。`chpasswd` 命令从标准输入读取登录名和密码对的列表（用冒号分隔），自动加密密码并为用户设置。你还可以使用重定向命令将一个\
  \ `userid:password` 文件重定向到命令中：\n\n```bash\nchpasswd < users.txt\n```\n\n### chsh,\
  \ chfn, 和 chage\n\n`chsh`、`chfn` 和 `chage` 工具针对特定的账户功能进行了专门。`chsh` 命令允许你快速更改用户的默认登录\
  \ shell。你必须使用 shell 的完整路径，而不仅仅是 shell 的名称：\n\n```bash\n# chsh -s /bin/sh test\n\
  Changing shell for test.\nShell changed.\n#\n```\n\n`chfn` 命令提供了在注释字段中存储信息的标准方法。与其插入随机文本（如昵称）或留空注释字段，`chfn`\
  \ 命令使用特定的信息。`finger` 命令允许你轻松查找 Linux 系统上某人的信息：\n\n```bash\n# finger rich\nLogin:\
  \ rich Name: Rich Blum\nDirectory: /home/rich Shell: /bin/bash\nsince Sep 20 18:03\
  \ (EDT) on pts/0 from 192.168.1.2\nNo mail.\nNo Plan.\n#\n```**注意**：出于安全考虑，许多 Linux\
  \ 管理员禁用了 `finger` 命令。如果你在不带参数的情况下使用 `chfn` 命令，它会提示输入相应的值：\n\n```bash\n# chfn test\n\
  Changing finger information for test.\nName []: Ima Test\nOffice []: Director of\
  \ Technology\nOffice Phone []: (123)555-1234\nHome Phone []: (123)555-9876\nFinger\
  \ information changed.\n# finger test\nLogin: test Name: Ima Test\nDirectory: /home/test\
  \ Shell: /bin/csh\nOffice: Director of Technology Office Phone: (123)555-1234\n\
  Home Phone: (123)555-9876\nNever logged in.\nNo mail.\nNo Plan.\n#\n```\n\n现在如果你查看\
  \ `/etc/passwd` 文件中的条目，它看起来是这样的：\n\n```bash\n# grep test /etc/passwd\ntest:x:504:504:Ima\
  \ Test,Director of Technology,(123)555-1234,(123)555-9876:/home/test:/bin/csh\n\
  #\n```\n\n所有的 finger 信息都整地存储在 `/etc/passwd` 条目中。\n\n最后，`chage` 命令帮助管理用户账户的密码过期过程。有几个参数用于设置单个值，如表\
  \ 6.4 所示。\n\n### 表 6.4 (#9781118087770c06.xhtml_c06_tbl_anc_0004) chage 命令参数\n\n\
  | 参数 | 描述 |\n| :--- | :--- |\n| `-d` | 设置上次更改密码的天数。 |\n| `-E` | 设置密码将过期的日期。 |\n\
  | `-I` | 设置密码过期后闲置多少天锁定账户。 |\n| `-m` | 设置密码更改之间的最小天数。 |\n\n\n\n\n\n| -W | 设置在密码过期前多少天显示警告信息。\
  \ |\n\n更改日期值可以使用两种方法之一来表示：\n\n- 使用 YYYY-MM-DD 格式的日期\n- 表示自 1970 年 1 月 1 日以来经过天数的数值值\n\
  \n`chage` 命令的一个非常实用的功能是，它允许你为账户设置过期日期。使用此功能，你可以创建临时用户账户，这些账户会在指定日期自动过期，而无需你刻意删除它们！过期的账户类似于锁定的账户。账户仍然存在，但用户无法使用其登录。\n\
  \n# 使用 Linux 组\n\n用户账户对于控制单个用户的安全性非常有效，但它们在允许一组用户共享资源方面并不如人。为了实现这一点，Linux 系统使用了另一个安全概念，称为“组（groups）”。\n\
  \n组权限允许多个用户对系统上的对象（例如文件、目录或设备）共享一组通用的权限（稍后将在“解码文件权限”部分对这部分进行更详细介绍）。\n\n不同的 Linux\
  \ 发行版在处理默认组成员关系方面有所不同。某些 Linux 发行版仅创建一个包含所有用户账户作为成员的组。如果你的 Linux 发行版是这样做，你需要小心，因为你的文件可能被系统上的所有其他用户读取。其他发行版则为每个用户创建一个单独的用户账户，以提供更高的安全性。\n\
  \n每个组都有一个唯一的 `GID`，它和 `UIDs` 一样，是系统上唯一的数值值。除了 `GID` 之外，每个组都有一个唯一的组名。你可以使用一些组工具在\
  \ Linux 系统上创建和管理你自己的组。本节将讨论组信息是如何存储的，以及如何使用组工具来创建新组和修改现有组。\n\n## /etc/group 文件\n\
  \n与用户账户一样，组信息也存储在系统的一个文件中。`/etc/group` 文件包含了系统上使用的每个组的信息。以下是 Linux 系统上典型的 `/etc/group`\
  \ 文件的示例：\n\n```\nroot:x:0:root\nbin:x:1:root,bin,daemon\ndaemon:x:2:root,bin,daemon\n\
  sys:x:3:root,bin,adm\nadm:x:4:root,adm,daemon\nrich:x:500:\nmama:x:501:\nkatie:x:502:\n\
  jessica:x:503:\nmysql:x:27:\ntest:x:504:\n```\n\n与 `UIDs` 类似，`GIDs` 使用特殊格式进行分配。用于系统账户的组被分配\
  \ 500 以下的 `GIDs`，而用户组分配的 `GIDs` 从 500 开始。`/etc/group` 文件使用四个字段：\n\n- 组名\n- 组密码\n\
  - `GID`\n- 属于该组的用户账户列表\n\n组密码允许非组成员通过使用密码临时成为该组的成员。虽然这个功能并不十分常用，但它确实存在。\n\n你永远不应该通过编辑\
  \ `/etc/group` 文件来将用户添加到组。相反，请使用 `usermod` 命令（在前面的“Linux 安全”部分中讨论过）来将用户账户添加到组中。在将用户添加到不同的组之前，你必须先创建这些组。\n\
  \n### 注意\n用户账户列表具有某种误导性。。你会发现列表中有几个组没有列出任何用户。当一个用户账户在 `/etc/passwd` 文件中使用某个组作为默认组时，该用户账户不会出现在\
  \ `/etc/group` 文件的成员列表中。多年来，这曾给多个系统管理员带来过困惑！\n\n## 创建新组\n\n`groupadd` 命令允许你在系统上创建新组：\n\
  \n```bash\n# /usr/sbin/groupadd shared\n# tail /etc/group\nhaldaemon:x:68:\nxfs:x:43:\n\
  gdm:x:42:\nrich:x:500:\nmama:x:501:\nkatie:x:502:\njessica:x:503:\nmysql:x:27:\n\
  test:x:504:\nshared:x:505:\n#\n```\n\n当你创建一个新组时，默认没有用户被分配给它。`groupadd` 命令没有提供将用户账户添加到组的选项。相反，要添加新用户，请使用\
  \ `usermod` 命令：\n\n```bash\n# /usr/sbin/usermod -G shared rich\n# /usr/sbin/usermod\
  \ -G shared test\n# tail /etc/group\nhaldaemon:x:68:\nxfs:x:43:\ngdm:x:42:\nrich:x:500:\n\
  mama:x:501:\nkatie:x:502:\njessica:x:503:\nmysql:x:27:\ntest:x:504:\nshared:x:505:rich,test\n\
  #\n```\n\n现在 `shared` 组有两个两个成员：`test` 和 `rich`。`usermod` 中的 `-G` 参数将新组附加到用户账户的组列表中。\n\
  \n### 注意\n如果你更改了当前登录系统的账户的组，该用户必须注销并重新登录，组更改才能生效。\n\n#### 警告\n在为账户分配组时要小心。如果你使用\
  \ `-g` 参数，你指定的组将替换默认组。\n\n## 修改组\n\n关于修改组，从 `/etc/group` 文件中可以看到关于现有组的并不多信息。`groupmod`\
  \ 命令允许你通过 `-g` 参数修改 `GID`，或者通过 `-n` 参数修改组名。：\n\n```bash\n# /usr/sbin/groupmod -n\
