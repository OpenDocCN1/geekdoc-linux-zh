  \nPOSIX ERE 模式包含了一些被某些 Linux 应用程序和工具使用的额外符号。`gawk` 程序可以识别 ERE 模式，但 `sed` 编辑器不识别。\n\
  \n### 注意事项\n\n重要的是记住，`sed` 编辑器和 `gawk` 程序中的正则表达式引擎是有区别的。`gawk` 程序可以使用大多数扩展正则表达式模式符号，并能提供\
  \ `sed` 编辑器不具备的一些额外过滤功能。然而，由于这种原因，它在处理数据流时通常较慢。\n\n本节描述了你可以在 `gawk` 程序脚本中更常用的 ERE\
  \ 模式符号。\n\n## 问号\n\n问号 `?` 与星号类似，但又略有不同。问号表示前面的字符可以出现零次或一次，仅此而已。它不会匹配字符的重复出现：\n\n\
  ```bash\n$ echo \"bt\" | gawk '/be?t/{print $0}'\n```\nbt\n\n```bash\n$ echo \"\
  bet\" | gawk '/be?t/{print $0}'\n```\nbet\n\n```bash\n$ echo \"beet\" | gawk '/be?t/{print\
  \ $0}'\n```\n$\n\n```bash\n$ echo \"beeet\" | gawk '/be?t/{print $0}'\n```\n$\n\n\
  如果 `e` 字符不在文本中出现，或者只要它在文本中只出现一次，模式就会匹配。\n\n与星号一样，你可以将问号符号配合字符类使用：\n\n```bash\n$\
  \ echo \"bt\" | gawk '/b[ae]?t/{print $0}'\n```\nbt\n\n```bash\n$ echo \"bat\" |\
  \ gawk '/b[ae]?t/{print $0}'\n```\nbat\n\n```bash\n$ echo \"bot\" | gawk '/b[ae]?t/{print\
  \ $0}'\n```\n$\n\n```bash\n$ echo \"bet\" | gawk '/b[ae]?t/{print $0}'\n```\nbet\n\
  \n```bash\n$ echo \"baet\" | gawk '/b[ae]?t/{print $0}'\n```\n$\n\n```bash\n$ echo\
  \ \"beat\" | gawk '/b[ae]?t/{print $0}'\n```\n$\n\n```bash\n$ echo \"beet\" | gawk\
  \ '/b[ae]?t/{print $0}'\n```\n$\n\n如果字符类中出现了零个或一个字符，则模式匹配即通过。然而，如果两个字符都出现了，或者其中一个字符出现了两次，模式匹配将失败。\n\
  \n## 加号\n\n加号 `+` 是另一个与星号类似的模式符号，但其含义与问号也不同。加号表示前面的字符可以出现一次或多次，但必须至少出现一次。如果字符不存在，则模式不匹配：\n\
  \n```bash\n$ echo \"beeet\" | gawk '/be+t/{print $0}'\n```\nbeeet\n\n```bash\n$\
