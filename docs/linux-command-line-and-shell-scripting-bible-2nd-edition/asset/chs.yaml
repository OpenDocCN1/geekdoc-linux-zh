  \n## 管道符号\n\n管道符号 `|` 允许你指定多个模式（逻辑“或”）。如果其中任何一个模式匹配文本，则匹配将通过。如果所有模式都不匹配，则匹配将失败：\n\
  \n```bash\n$ echo \"The cat\" | gawk '/cat|dog/{print $0}'\n```\nThe cat\n\n```bash\n\
  $ echo \"The dog\" | gawk '/cat|dog/{print $0}'\n```\nThe dog\n\n在这个示例中，如果其中任何一个模式匹配文本，则匹配将通过。如果所有模式都不匹配，则匹配将失败。\n\
  \n## 分组表达式\n\n正则表达式模式也可以使用括号 `()` 进行分组。当你对正则表达式模式分组时，该组被视为一个标准字符。你可以像对待普通字符一样对组应用特殊字符。例如：\n\
  \n```bash\n$ echo \"Sat\" | gawk '/Sat(urday)?/{print $0}'\n```\nSat\n\n```bash\n\
  $ echo \"Saturday\" | gawk '/Sat(urday)?/{print $0}'\n```\nSaturday\n\n对 `urday`\
  \ 结尾的分组配合问号允许模式匹配完整的日期名称或缩写 Sat。通常将分组配合管道符号使用以创建可能的模式组：\n\n```bash\n$ echo \"cat\"\
  \ | gawk '/(c|b)a(b|t)//{print $0}'\n```\ncat\n\n```bash\n$ echo \"cab\" | gawk\
  \ '/(c|b)a(b|t)//{print $0}'\n```\ncab\n\n```bash\n$ echo \"bat\" | gawk '/(c|b)a(b|t)//{print\
  \ $0}'\n```\nbat\n\n```bash\n$ echo \"bab\" | gawk '/(c|b)a(b|t)//{print $0}'\n\
  ```\nbab\n\n```bash\n$ echo \"tab\" | gawk '/(c|b)a(b|t)//{print $0}'\n```\n$\n\n\
  ```bash\n$ echo \"tac\" | gawk '/(c|b)a(b|t)//{print $0}'\n```\n$\n\n模式 `(c|b)a(b|t)`\
  \ 匹配第一组中字母的任意组合，连同第二组中字母的任意组合。\n\n\n\n\n\n现在你已经了解了规则以及使用正则表达式模式的几个简单演示，现在是时候将这些知识付诸实践了。接下来的章节将演示\
  \ shell 脚本中常用的正则表达式示例。\n\n## 统计目录文件\n\n首先，让我们来看一个 shell 脚本，它会统计你的 `PATH` 环境变量中定义的目录里存在的可执行文件。为了做到这一点，你需要将\
  \ `PATH` 变量解析为单独目录名称。第 5 章向你展示了如何显示 `PATH` 环境变量：\n\n```bash\necho $PATH\n```\n/usr/local/bin:/bin:/usr/bin:/usr/X11R6/bin:/usr/games:/usr/java/j2sdk1.4.1_01/bin\n\
  \n你的 `PATH` 环境变量会根据应用程序在你的 Linux 系统上的位置而不同。关键是要识别出 `PATH` 中的每个目录都是用冒号 `:` 隔开的。为了获取一个可以在脚本中使用的目录列表，你必须将每个冒号替换为空格。你现在意识到\
  \ `sed` 编辑器可以通过简单的正则表达式来实现这一点：\n\n```bash\necho $PATH | sed 's/:/ /g'\n```\n/usr/local/bin\
  \ /bin /usr/bin /usr/X11R6/bin /usr/games /usr/java/j2sdk1.4.1_01/bin\n\n一旦你分出了目录，就可以在中使用标准的\
  \ `for` 语句（见第 12 章）来遍历每个目录：\n\n```bash\nmypath='echo $PATH | sed 's/:/ /g'''\nfor\
  \ directory in $mypath\ndo\n...\ndone\n```\n\n获取每个目录后，你可以使用 `ls` 命令列出每个目录中的每个文件，并使用另一个\
  \ `for` 语句遍历每个文件，为每个文件增加计数器。\n\n脚本的最终版本如下：\n\n```bash\ncat countfiles\n```\n#!/bin/bash\n\
  # 统计你 PATH 中的文件数量\nmypath='echo $PATH | sed 's/:/ /g'''\ncount=0\nfor directory\
  \ in $mypath\ndo\n    check='ls $directory'\n    for item in $check\n    do\n  \
  \      count=$[ $count + 1 ]\n    done\n    echo \"$directory - $count\"\n    count=0\n\
  done\n```\n\n```bash\n./countfiles\n```\n/usr/local/bin - 79\n/bin - 86\n/usr/bin\
  \ - 1502\n/usr/X11R6/bin - 175\n/usr/games - 2\n/usr/java/j2sdk1.4.1_01/bin - 27\n\
  \n现在我们开始看到正则表达式背后的力量了！\n\n## 验证电话号码\n\n上一个示例展示了如何将简单的正则表达式结合 `sed` 来替换数据流中的字符以处理数据。正则表达式经常用于验证数据，以确保数据符合脚本的正确格式。\n\
  \n一种常见的数据验证应用是检查电话号码。数据输入表通常会要求电话号码，而客户往往无法输入格式正确的电话号码。在美国，显示电话号码有几种常见方式：\n\n- (123)456-7890\n\
  - (123) 456-7890\n- 123-456-7890\n- 123.456.7890\n\n这留下了客户在表单中输入电话号码的四种可能性。正则表达式必须足够健壮，能够处理任何情况。\n\
  \n在构建正则表达式时，最好从左侧开始，并构建你的模式来匹配你可能遇到的字符。在这个示例中，电话号码中可能存在或没有左括号。可以使用以下模式进行匹配：\n\n\
  `^\\(?`\n\n脱字符 `^` 用于指示数据的开头。由于左括号是特殊字符，你必须对其进行转义才能作为普通字符使用。问号 `?` 表示匹配的数据中可能出现也可能不出现左括号。接下来是三位区号。在美国，区号以数字\
  \ 2 开始（没有区号是以数字 0 或 1 开头的），并可以到 9。要匹配区号，你会使用以下模式：\n\n`[2-9][0-9]{2}`\n\n这要求第一个字符必须是\
  \ 2 到 9 之间的数字，后面跟着任意两个数字。在区号之后，结尾的右括号可能存在也可能不存在：\n\n`\\)?`\n\n在区号之后，可以有一个空格、空格、连字符或点。你可以使用字符组配合管道符号\
  \ `|` 对它们进行分组：\n\n`(||-|\\.)`\n\n第一个管道符号紧跟在左括号后面，用于匹配无空格的情况。你必须对点 `.` 使用转义字符；否则它将被解释为匹配任何字符。接下来是三位电话交换机号。这里没有特殊要求：\n\
  \n`[0-9]{3}`\n\n在电话交换机号之后，你必须匹配空格、连字符或点（这次你不需要担心匹配无空格，因为电话交换机号和数字其余部分之间至少有一个空格）：\n\
  \n`((||-|\\.)`\n\n然后为了完成最后工作，你必须匹配字符串末尾的四位本地电话分机：\n\n`[0-9]{4}$`\n\n将整个模式组合在一起结果如下：\n\
  \n`^\\\\(?[2-9][0-9]{2}\\)?(||-|\\.)[0-9]{3}(|-|\\.)[0-9]{4}$`\n\n你可以在 `gawk` 程序中使用这个正则表达式模式来过滤掉错误的电话号码。你现在需要的是使用\
  \ `gawk` 程序中的正则表达式创建一个简单的脚本，然后通过该脚本过滤你的电话列表。记住，在 `gawk` 程序中使用正则表达式区间时，你必须使用 `--re-interval`\
  \ 命令行选项，否则你将得正确的结果。\n\n这里是脚本：\n\n```bash\ncat isphone\n```\n#!/bin/bash\n# 过滤错误电话号码的脚本\n\
  gawk --re-interval '^\\(??[2-9][0-9]{2}\\)?(||-|\\.)[0-9]{3}(|-|\\.)[0-9]{4}/{print\
  \ $0}'\n```\n\n虽然你从这个列表中看不出来，但 `gawk` 是非常强大的。你可以从这个列表中看到 `gawk` 命令。你可以通过重定向来处理：\n\
  \n```bash\necho \"echo $PATH | sed 's/:/ /g'\"\n```\n3276\n```\n\n或者你可以重定向整个文件来过滤掉无效的号码：\n\
  \n```bash\ncat phonelist\n```\n\n## 解析电子邮件地址\n\n在当今，电子邮件地址已成为通信至关重要的形式。验证电子邮件地址对于脚本编写者来说变成了一项挑战，因为创建电子邮件地址有无数方法。电子邮件的基本形式是：\n\
  \n`username@hostname`\n\n`username` 值可以使用任何字母数字字符，以及几个特殊字符：\n\n字体 点\n- 连字符\n- 加号\n\
  - 下划线\n\n这些字符可以任何组合出现在有效的电子邮件用户名中。电子邮件地址的 `hostname` 部分由一个或多个域名和一个服务器名称组成。服务器和域名也必须遵循严格的命名规则，仅允许字母数字字符，以及特殊字符：\n\
  \n- 点\n- 下划线\n\n服务器和域名之间通过点分隔，先指定服务器名称，然后是任何子域名，最后是不带末尾点的顶级域名。\n\n曾经顶级域名的数量相当有限，正则表达式模式构建者尝试将它们全部添加到模式中。遗憾的是，随着互联网的增长，可能的顶级域名也在增加。这种技术不再是可行方案。\n\
  \n让我们从左侧开始构建正则表达式模式。我们知道用户名中可以有多个有效字符。这很容易：\n\n`^([a-zA-Z0-9_\\-\\.\\+]+)@`\n\n\
  这个分组指定了用户名允许的字符，并使用加号表示至少有一个字符。下一个字符显然是 `@` 符号，这没什么意外。`hostname` 模式使用相同的技术来匹配服务器名称和子域名：\n\
  \n`([a-zA-Z0-9_\\-\\.]+)`\n\n此模式匹配文本：\n\n- server\nserver.subdomain\nserver.subdomain.subdomain\n\
  \n\n\n\n\n顶级域名（top-level domain）有特殊的规则。顶级域名仅由字母组成，且长度不少于两个字符（用于国家代码），且于五个字符。以下是顶级域的正则表达式模式：\n\
  \n```\n\\.([a-zA-Z]{2,5})$\n```\n\n将整个模式组合在一起，结果如下：\n\n```\nˆ([a-zA-Z0-9_\\-\\.\\\
  +]+)@([a-zA-Z0-9_\\-\\.]+)\\.([a-zA-Z]{2,5})$\n```\n\n该模式将能够从数据列表中过滤出格式不正确的电子邮件地址。现在，你可以编写脚本来实现这个正则表达式：\n\
  \n```\n$ echo \"rich@here.now\" | ./isemail\nrich@here.now\n\n$ echo \"rich@here.now.\"\
  \ | ./isemail\n$\n\n$ echo \"rich@here.n\" | ./isemail\n$\n\n$ echo \"rich@here-now\"\
  \ | ./isemail\n$\n\n$ echo \"rich.blum@here.now\" | ./isemail\nrich.blum@here.now\n\
  \n$ echo \"rich_blum@here.now\" | ./isemail\nrich_blum@here.now\n\n$ echo \"rich/blum@here.now\"\
  \ | ./isemail\n$\n\n$ echo \"rich#blum@here.now\" | ./isemail\n$\n\n$ echo \"rich*blum@here.now\"\
  \ | ./isemail\n$\n```\n\n## 总结\n\n如果你在 shell 脚本中操作数据文件，你就需要熟悉正则表达式。正则表达式在 Linux\
  \ 工具、编程语言以及使用正则表达式引擎的应用程序中实现。Linux 世界中有许多不同的正则表达式引擎。最流行的两个是 POSIX 基础正则表达式 (BRE)\
  \ 引擎和 POSIX 扩展正则表达式 (ERE) 引擎。`sed` 编辑器主要符合 BRE 引擎，而 `gawk` 程序利用了 ERE 引擎的大部分功能。\n\
  \n正则表达式定义了一个模式，用于过滤数据流中的文本。该模式由标准文本字符和特殊字符组合组成。特殊字符被正则表达式引擎用于匹配一个或多个字符，类似于其他应用程序中通配符的工作方式。\n\
  \n通过组合字符和特殊字符，你可以定义一个匹配几乎任何类型数据的模式。然后，你可以使用 `sed` 编辑器或 `gawk` 程序从更大的数据流中过滤出特定数据，或者验证从数据输入应用程序接收的数据。\n\
  \n下一章将深入探讨如何使用 `sed` 编辑器进行高级文本处理。`sed` 编辑器提供了许多高级功能，使其在处理大型数据流和过滤所需内容时非常有用。\n\n\
  # 第 20 章：高级 sed\n\n### 本章内容\n\n* 多行命令\n* 保持空间 (hold space)\n* 否定命令\n* 改变流程\n* 模式替换\n\
  * 在脚本中使用 sed\n* 创建 `sed` 工具\n\n第 18 章向你展示了如何使用 `sed` 编辑器的基础操作来处理数据流中的文本。基础 `sed`\
  \ 编辑器命令能够处理大多数日常文本编辑需求。本章将介绍 `sed` 编辑器提供的更高级的功能。这些功能你可能不会那么频繁地使用，但当你需要它们时，知道它们的存在以及如何使用它们是非常好的。\n\
  \n## 多行命令\n\n在使用基础 `sed` 编辑器命令时，你可能会注意到一个局限性。所有的 `sed` 编辑器命令都在单行数据上执行功能。当 `sed`\
  \ 编辑器读取数据流时，它根据换行符的存在将数据分为若干行。`sed` 编辑器一次处理一行数据，对该文本执行定义的脚本命令，然后移动到下一行并重复过程。\n\n\
  有时，你需要对跨越多行的数据执行操作。当你尝试查找或替换一个短语时，尤其如此。\n\n例如，如果你在数据中查找 \"Linux System Administrators\
  \ Group\" 这个短语，该短语可能在短语中的任何单词之间被分成两行。如果你使用普通的 `sed` 编辑器命令处理文本，将无法检测出该短语是如何拆分的。\n\
  \n幸运的是，`sed` 编辑器的设计者考虑到了这种情况并设计了解决方案。`sed` 编辑器包含了三个可以处理多行文本的特殊命令：\n\n* `N`: 将数据流中的下一行添加，创建一个处理的多行组。\n\
  * `D`: 删除多行组中的单行。\n* `P`: 打印多行组中的单行。\n\n接下来的章节将更详细地检查这些多行命令，并演示你如何在脚本中使用它们。\n\n\
  ## Next 命令\n\n在检查多行 `next` 命令之前，你首先需要查看单行版本的 `next` 命令是如何工作的。一旦你了解了该命令的作用，理解多行版本\
  \ `next` 命令的操作原理就会容易得多。\n\n### 单行 next 命令\n\n小写 `n` 命令告诉 `sed` 编辑器移动到数据流中的下一行文本，而不返回命令开头。请记住，通常\
  \ `sed` 编辑器会在移动到数据流中的下一行文本之前，处理该行上的所有定义命令。单行 next 命令改变了这种流程。\n\n这听起来有些复杂，有时确实如此。在这个示例中，你有一个包含五行的数据文件，其中两个是空的。目标是移除标题行之后的空行，但保留最后一行之前的空行。如果你写一个\
  \ `sed` 脚本来删除空行，你将删除两个空行：\n\n```\n$ cat data1\nThis is the header line.\nThis is\
  \ a data line.\nThis is the last line.\n\n$\n$ sed '/^$/d' data1\nThis is the header\
  \ line.\nThis is a data line.\nThis is the last line.\n$\n```\n\n由于你要删除的行是空的，因此你没有任何文本可以搜索来唯一标识该行。解决方案是使用\
  \ `n` 命令。在下一个示例中，脚本查找包含 \"header\" 单词的唯一行。一旦脚本识别了该行，`n` 命令就会将 `sed` 编辑器移动到下一行文本，即空行。\n\
  \n```\n$ sed '/header/{n ; d}' data1\nThis is the header line.\nThis is a data line.\n\
  This is the last line.\n$\n```\n\n此时，`sed` 编辑器继续处理命令列表，使用 `d` 命令删除空行。当 `sed` 编辑器到达命令脚本的结尾时，它从数据流中读取下一行文本，并从命令脚本的顶部开始处理命令。`sed`\
  \ 编辑器找不到另一个包含 \"header\" 单词的行；因此没有更多行被删除。\n\n### 合并文本行\n\n现在你已经看到了单行 next 命令，可以查看多行版本了。单行\
  \ next 命令将数据流中的下一行文本移动到 `sed` 编辑器的处理空间（称为模式空间，pattern space）。`next` 命令的多行版本（使用大写\
  \ `N`）将下一行文本添加到模式空间中已有的文本之后。\n\n这样做的效果是将数据流中的两行文本合并到同一个模式空间中。行之间仍然由换行符分隔，但 `sed`\
  \ 编辑器现在可以将这两行文本视为一行。\n\n以下是 `N` 命令如何操作的演示：\n\n```\n$ cat data2\nThis is the header\
  \ line.\nThis is the first data line.\nThis is the second data line.\nThis is the\
  \ last line.\n\n$\n$ sed '/first/{ N ; s/\\n/ /}' data2\nThis is the header line.\n\
  This is the first data line. This is the second data line.\nThis is the last line.\n\
  $\n```\n\n`sed` 编辑器脚本搜索包含“first”单词的文本行。当它找到该行时，它使用 `N` 命令将下一行与该行合并。然后它使用替换命令 (`s`)\
  \ 将换行符替换为空格。结果是文本文件中的两行在 `sed` 编辑器的输出中显示为一行。\n\n\n\n\n\n如果你正在数据文件中搜索一个可能被拆分在两行的文本短语，那么这种方法具有实际应用价值。以下是一个示例：\n\
  \n```\n$ cat data3\nThe first meeting of the Linux System\nAdministrator's group\
  \ will be held on Tuesday.\nAll System Administrators should attend this meeting.\n\
  Thank you for your attendance.\n```\n\n```\n$ sed 's/System Administrator/Desktop\
  \ User/' data3\nThe first meeting of the Linux System\nAdministrator's group will\
  \ be held on Tuesday.\nAll Desktop Users should attend this meeting.\nThank you\
  \ for your attendance.\n```\n\n替换命令正在文本文件中查找特定的双词短语 `System Administrator`。在短该短语的单行中，一切都是正常的；替换命令可以替换文本。但在短语被拆分在两行之间的情况下，替换命令无法识别匹配模式。\n\
  \n`N` 命令有助于解决这个问题：\n\n```bash\n$ sed 'N ; s/System.Administrator/Desktop User/'\
  \ data3\nThe first meeting of the Linux Desktop User's group will be held on Tuesday.\n\
  All Desktop Users should attend this meeting.\nThank you for your attendance.\n\
  ```\n\n通过使用 `N` 命令将下一行与找到第一个单词的行合并，你可以检测短语中何时发生了行拆分。\n\n注意，替换命令在 `System` 和 `Administration`\
  \ 之间使用了通配符模式（`.`）来同时匹配空格和换行情况。然而，当它匹配到换行符时，它将其从字符串中删除，导致两行合并为一行。这可能不是你完全想要的。\n\n\
  为了解决这个问题，你可以在 `sed` 编辑器脚本中使用两个替换命令，一个用于匹配多行出现，另一个用于匹配单行出现：\n\n```bash\n$ sed '\n\
  N\ns/System\\nAdministrator/Desktop\\nUser/\ns/System Administrator/Desktop User/\n\
  ' data3\nThe first meeting of the Linux Desktop\nUser's group will be held on Tuesday.\n\
  All Desktop Users should attend this meeting.\nThank you for your attendance.\n\
  ```\n\n第一个替换命令专门查找两个搜索词之间的换行符，并将其包含在替换字符串中。这允许你在新文本的相同位置添加换行符。\n\n然而，这个脚本仍然存在一个微妙的问题。脚本在执行\
  \ `sed` 编辑器命令之前，总是会将下一行文本读入模式空间（pattern space）。当它到达最后一行文本时，没有下一行可以读取，因此 `N` 命令会导致\
  \ sed 编辑器停止。如果匹配文本位于数据流的最后一行，命令将无法捕获匹配的数据：\n\n```bash\n$ cat data4\nThe first meeting\
  \ of the Linux System\nAdministrator's group will be held on Tuesday.\nAll System\
  \ Administrators should attend this meeting.\n```\n\n```bash\n$ sed '\nN\ns/System\\\
  nAdministrator/Desktop\\nUser/\ns/System Administrator/Desktop User/\n' data4\n\
  The first meeting of the Linux Desktop\nUser's group will be held on Tuesday.\n\
  All System Administrators should attend this meeting.\n```\n\n由于 `System Administrator`\
  \ 文本出现在数据流的最后一行，`N` 命令错过了它，因为没有另一行可以读入模式空间进行合并。你可以通过将单行命令移动到 `N` 命令之前，并仅让多行命令出现在\
  \ `N` 命令之后来轻松地解决这个问题，如下所示：\n\n```bash\n$ sed '\ns/System Administrator/Desktop User/\n\
  N\ns/System\\nAdministrator/Desktop\\nUser/\n' data4\nThe first meeting of the Linux\
  \ Desktop\nUser's group will be held on Tuesday.\nAll Desktop Users should attend\
  \ this meeting.\n```\n\n现在，在数据流最后一行查找单行短语的替换命令可以正常工作，而多行替换命令涵盖了数据流中间出现的情况。\n\n##\
  \ 多行删除命令\n\n第 18 章介绍了单行删除命令（`d`）。`sed` 编辑器使用它来删除模式空间中的当前行。然而，在配合 `N` 命令工作时，使用单行删除命令时必须小心：\n\
  \n```bash\n$ sed 'N ; /System\\nAdministrator/d' data4\nAll System Administrators\
  \ should attend this meeting.\n```\n\n删除命令在不同的行中查找单词 `System` 和 `Administrator`，然后删除了模式空间中的两行。这可能可能不符合你的意图。\n\
  \n`sed` 编辑器提供了多行删除命令（`D`），它只删除模式空间中的第一行。它会删除删除包括换行符在内的所有字符：\n\n```bash\n$ sed 'N\
  \ ; /System\\nAdministrator/d' data4\nAdministrator's group will be held on Tuesday.\n\
  All System Administrators should attend this meeting.\n```\n\n由 `N` 命令添加的模式空间的第二行保持完好无损。这在需要时非常有用。这里有一个删除行的示例：\n\
  \n```bash\n$ cat data5\nThe first meeting of the Linux System\nAdministrator's group\
  \ will be held on Tuesday.\nAll System Administrators should attend this meeting.\n\
  ```\n\n```\n$ sed -n 'N;/header/{D}' data5\nAdministrator's group will be held on\
  \ Tuesday.\nAll System Administrators should attend this meeting.\n```\n\n## 多行打印命令\n\
  \n现在，你可能已经明白了命令的单行和多行版本之间的区别。多行打印命令（`P`）遵循相同的技术。它只打印模式空间中的第一行。当你使用 `-n` 选项抑制输出时，它的用法与单行\
  \ `p` 命令相似。\n\n```bash\n$ sed -n 'N;/System\\nAdministrator/P' data3\nThe first\
  \ meeting of the Linux\n```\n\n当发生多行匹配时，`P` 命令打印模式空间中的第一行。当将其与 `N` 和 `D` 命令结合时，多行\
  \ `P` 命令的威力就显出来了。`D` 命令删除第一行并循环。\n\n## 暂存空间 (Hold Space)\n\n模式空间是一个活动缓冲区，用于保存 sed\
  \ 编辑器在处理命令时正在检查的文本。然而，它不是 sed 编辑器中存储文本的唯一空间。\n\n`sed` 编辑器利用另一个称为暂存空间的缓冲区。你可以使用暂存空间在处理模式空间中的其他行时，临时保存文本行。与操作暂存空间相关的命令有\
  \ 5 个，如表 20.1 所示。\n\n表 20.1 sed 编辑器暂存空间命令\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `h`\
  \ | 将模式空间复制到暂存空间。 |\n| `H` | 将模式空间追加到暂存空间。 |\n| `g` | 将暂存空间复制到模式空间。 |\n\n\n\n\n\n\
  | `G` | 将保持空间的内容追加到模式空间。 |\n| `x` | 交换模式空间和保持空间的内容。 |\n\n| |\n\n这些命令允许你将文本从模式空间（pattern\
  \ space）复制到保持空间（hold space）。这可以释放模式空间，以便加载另一个字符串进行处理。\n\n通常，在用 `h` 或 `H` 命令将字符串移动到保持空间后，你最终会想要使用\
  \ `g`、`G` 或 `x` 命令将存储的字符串移回模式空间（否则，你最初也就不需要保存它们了）。\n\n由于有两个缓冲区区域，尝试确定某行文本在哪个区域有时会很困惑。这里有一个短的示例，演示了如何使用\
  \ `h` 和 `g` 命令在 sed 编辑器的缓冲区之间来回移动数据：\n\n```bash\n$ cat data2\nThis is the header\
  \ line.\nThis is the first data line.\nThis is the second data line.\nThis is the\
  \ last line.\n$ \n```\n\n```bash\n$ sed -n '/first/{\n> h\n> p\n> n\n> p\n> g\n\
  > p\n> }' data2\nThis is the first data line.\nThis is the second data line.\nThis\
  \ is the first data line.\n$\n```\n\n逐步查看上述代码示例：\n\n1. sed 脚本在地址中使用正则表达式来过滤包含包含单词\
  \ `first` 的行。\n2. 当包含单词 `first` 的行出现时，`h` 命令将该行放入保持空间。\n3. `p` 命令打印模式空间的内容，此时模式空间的仍然是第一行数据行。\n\
  4. `n` 命令获取数据流中的下一行（This is the second data line.）并将其放入模式空间。\n5. `p` 命令打印模式空间的内容，现在是第二行数据行。\n\
  6. `g` 命令将保持空间的内容（This is the first data line.）放回模式空间，替换当前文本。\n7. `p` 命令打印模式空间当前的内容，此时已变回了第一行数据行。\n\
  \n通过使用保持空间来洗牌文本行，你能够强制第一行数据行在输出中出现在第二行数据行之后。如果你直接删掉第一个 `p` 命令，就可以按反顺序输出这两行：\n\n\
  ```bash\n$ sed -n '/first/{\n> h\n> n\n> p\n> g\n> p\n> }' data2\nThis is the second\
  \ data line.\nThis is the first data line.\n$\n```\n\n这是一个实用的开始。你可以使用这种技术来创建一个 sed\
  \ 脚本，从而反转整个文件的文本行！然而，要做到这一点，你需要了解 sed 编辑器的否定功能，这正是下一节的重点。\n\n## 否定命令 (Negating a\
  \ Command)\n\n第 18 章展示了 sed 编辑器将命令应用于数据流中的每一行文本，或者应用于由单个地址或地址范围特定指定的行。你也可以配置一个命令，使其不应用于数据流中的特定地址或地址范围。\n\
  \n感叹号命令（`!`）用于否定一个命令。这意味着在命令通常会被激活的情况下，它并不会被激活。这里有一个演示此功能的示例：\n\n```bash\n$ sed\
  \ -n '/header/!p' data2\nThis is the first data line.\nThis is the second data line.\n\
  This is the last line.\n$\n```\n\n正常的 `p` 命令本只会打印 `data2` 文件中包含单词 `header` 的那一行。通过添加感叹号，文件中的所有行都被打印出来，除了地址中引用的文本所在的行。\n\
  \n在几种应用中，使用感叹号非常有用。回在本章前面的“后续命令”部分显示了一种情况：sed 编辑器命令不会在数据流的最后一行文本上操作，因为它后面没有行了。你可以使用感叹号来修复这个问题：\n\
  \n```bash\n$ sed 'N; s/System.Administrator/Desktop User/' data4\nThe first meeting\
  \ of the Linux Desktop User's group will be held on Tuesday\nAll System Administrators\
  \ should attend this meeting.\n$ \n```\n\n```bash\n$ sed '$!N; s/System.Administrator/Desktop\
  \ User/' data4\nThe first meeting of the Linux Desktop User's group will be held\
  \ on Tuesday\nAll Desktop Users should attend this meeting.\n$\n```\n\n这个示例展示了感叹号配合\
  \ `N` 命令以及特殊地址 `$` 使用。美元符号代表数据流中的最后一行，因此当 sed 编辑器到达最后一行时，它不会执行 `N` 命令。然而对于所有其他行，它都会执行该命令。\n\
  \n使用这种技术，你可以反转数据流中文本行的顺序。要反转文本在文本流中出现的顺序（先显示最后一行，最后显示第一行），你需要使用保持空间进行一些“花式操作”。\n\
  \n你需要遵循的模式如下：\n\n1. 将一行放入模式空间。\n2. 将该行从模式空间移动到保持空间。\n3. 将下一行文本放入模式空间。\n4. 将保持空间的内容追加到模式空间。\n\
  5. 将模式空间中的所有内容放入保持空间。\n6–9. 重复步骤 3 到 5，直到你将所有行都按反顺序放在保持空间中。\n10. 获取这些行并打印它们。\n\n\
  \n\n\n`branch` 命令的格式为：\n\n`[address]b [label]`\n\n`address` 参数决定了哪一行或几行数据触发 `branch`\
  \ 命令。`label` 参数定义了跳转的位置。如果不存在 `label` 参数，`branch` 命令将执行到脚本的末尾。\n\n```bash\n$ sed\
  \ ‘{2,3b ; s/This is/Is this/;s/line./test?/’ data2\n\nIs this the header test?\n\
  This is the first data line.\nThis is the second data line.\nIs this the last test?\n\
  $\n```\n\n`branch` 命令跳过了数据流中第二行和第三行的两个替换命令。\n\n与其直接跳转到脚本末尾，你还可以为 `branch` 命令定义一个要跳转的标签。标签以冒号开头，长度最多为七个字符：\n\
  \n`:label2`\n\n要指定该标签，只需将其添加到 `b` 命令之后即可。使用标签允许你跳过与分支地址匹配的命令，但仍然处理脚本中的其他命令：\n\n\
  ```bash\n$ sed ‘{/first/b jump1 ; s/This is the/No jump on/\n> :jump1 \n> s/This\
  \ is the/Jump here on/}’ data2 \n\nNo jump on header line\nJump here on first data\
  \ line\nNo jump on second data line\nNo jump on last line\n$\n```\n\n`branch` 命令指定，如果行中出现匹配的文本“first”，程序应跳转到标记为\
  \ `jump1` 的脚本行。如果 `branch` 命令的模式不匹配，`sed` 编辑器将继续处理脚本中的命令，包括分支标签之后的命令。（因此，所有三个替换命令都会在匹配分支模式的行上执行。）\n\
  \n如果某行匹配分支模式，`sed` 编辑器将跳转到标签行。因此，只会执行最后一个替换命令。\n\n该示例显示了跳转到 `sed` 脚本较靠处的标签。你也可以跳转到脚本中较早出现的标签，从而创建一个循环效果：\n\
  \n```bash\n$ echo “This, is, a, test, to, remove, commas. ” | sed -n ‘{\n> :start\n\
  > s/,//1p\n> b start\n> }’\n\nThis is, a, test, to, remove, commas.\nThis is a,\
  \ test, to, remove, commas.\nThis is a test, to, remove, commas.\nThis is a test\
  \ to, remove, commas.\nThis is a test to remove, commas.\nThis is a test to remove\
  \ commas.\n$\n```\n\n脚本的每次迭代都会删除文本字符串中第一个出现的逗号并打印该字符串。这个脚本有一个问题：它永远不会结束。这种情况创建了一个无限循环，不断搜索逗号，直到你通过组合\
  \ `Ctrl+C` 组合键发送信号来手动停止它。\n\n为了防止这个问题，你应该为 `branch` 命令指定一个要查找的地址模式。如果不存在该模式，分支应该停止：\n\
  \n```bash\n$ echo “This, is, a, test, to, remove, commas. ” | sed -n ‘{\n> :start\n\
  > s/,//1p\n> /,/b start\n> }’\n\nThis is, a, test, to, remove, commas.\nThis is\
  \ a, test, to, remove, commas.\nThis is a test, to, remove, commas.\nThis is a test\
  \ to, remove, commas.\nThis is a test to remove, commas.\nThis is a test to remove\
  \ commas.\n$\n```\n\n现在，`branch` 命令仅在行存在逗号时才跳转。在最后一个逗号被移除后，`branch` 命令将不再执行，允许脚本正常结束。\n\
  \n### 测试\n\n与 `branch` 命令类似，`test` 命令 (`t`) 也是跳转命令。`test` 命令用于在替换成功后跳转到标签。如果替换成功，`sed`\
  \ 编辑器跳转到指定的标签。如果 `test` 命令的模式没有匹配，它将跳转到脚本末尾。\n\n`test` 命令的格式为：\n\n`[address]t [label]`\n\
  \n`address` 参数指定了哪些行或哪些行会触发 `test` 命令。`label` 参数定义了跳转的位置。如果不存在 `label` 参数，`test`\
  \ 命令将跳转到脚本的末尾。\n\n`test` 命令只有在替换成功时才会执行跳转。如果 `test` 命令的模式没有匹配，`sed` 编辑器将继续处理脚本中的命令，包括分支标签之后的命令。\n\
  \n```bash\n$ sed '\ns/This is/Is this/t\ns/line/test/\n' data2\n```\n` ``` 命令\n\n\
  \n\n\n```\nIs this the header test?\nThis is the first data line.\nThis is the second\
  \ data line.\nIs this the last test?\n$\n```\n在上面的例子中，第一个替换 `s/This is/Is this/`\
  \ 成功了，因此 `t` 命令导致跳转到脚本末尾。因此，第二个替换 `s/line/test/` 没有被执行。\n\n你可以让 `test` 命令跳转到特定的标签而不是末尾：\n\
