  \ | `\\w` | 不在每个语句后显示警告。 |\n\n您可以直接从 `mysql` 命令提示符使用完整命令或快捷键命令：\n\n```sql\nmysql>\
  \ \\s\n```\n\n--------------\n\n```text\nmysql Ver 14.12 Distrib 5.0.45, for redhat-linux-gnu\
  \ (i386) using readline 5.0\nConnection id:           10\nCurrent database:\nCurrent\
  \ user:            root@localhost\nSSL:                    Not in use\nCurrent pager:\
  \          stdout\nUsing outfile:         ''\nUsing delimiter:        ;\nServer\
  \ version:         5.1.49-1ubuntu8.1 (Ubuntu) Protocol version:       0\nConnection:\
  \            localhost via UNIX socket\nServer characters:     latin\nDb characters:\
  \         latin\nClient characters:      latin\nConn. characters:      latin\nUNIX\
  \ socket:            /var/lib/mysql/mysql.sock\nUptime:                 4 hours\
  \ 5 min 4 sec\nThreads:               1 Questions: 3 Slow queries: 0 Opens: 23 Flush\
  \ tables: 1\n```\n\n-------------->\n\n`mysql` 程序实现了 MySQL 服务器支持的所有标准查询语言 (SQL)\
  \ 命令。本章的“创建 MySQL 对象”部分将详细讨论此内容。`mysql` 程序实现的一个不常用的 SQL 命令是 `SHOW` 命令。使用该命令，您可以提取有关\
  \ MySQL 服务器的信息，例如数据库：\n\n```sql\nmysql> SHOW DATABASES;\n+--------------------+\n\
  | Database          |\n+--------------------+\n| information_schema |\n| mysql \
  \            |\n+--------------------+\n2 rows in set (0.4 sec)\n\nmysql> USE mysql;\n\
  Database changed\n\nmysql> SHOW TABLES;\n+---------------------------+\n| Tables_in_mysql\
  \  |\n+---------------------------+\n| columns_priv       |\n| db              \
  \  |\n| func              |\n| help_category     |\n| help_keyword      |\n| help_relation\
  \     |\n| help_topic        |\n| host              |\n| proc              |\n|\
  \ procs_priv        |\n| tables_priv       |\n| time_zone         |\n| time_zone_leap_second\
  \ |\n| time_zone_name     |\n| time_zone_transition |\n| time_zone_transition_type\
  \ |\n| user              |\n+---------------------------+\n17 rows in set (0.00\
  \ sec)\n\nmysql>\n```\n\n`mysql` 程序实现了 MySQL 服务器支持的所有标准查询语言 (SQL) 命令。当你处理长命令时，此功能非常有用。你可以在一行中输入命令的一部分并按回车键，然后在下一行继续。这可以一直进行任意行数，直到你使用分号表示命令结束。\n\
  \n注意：在本章中，我们使用大写字母表示 SQL 命令。但 `mysql` 程序允许您使用大写或小写指定 SQL 命令。\n\n# 创建 MySQL 对象\n\n\
  在开始编写与数据库交互的脚本之前，您需要一些数据库对象来操作。至少，您希望拥有以下内容：\n\n* 一个用于存储应用程序数据的唯一数据库\n* 一个用于从脚本访问数据库的唯一用户账户\n\
  * 一个或多个用于组织数据的表\n\n您使用 `mysql` 程序构建所有这些对象。`mysql` 程序直接与 MySQL 服务器交互，并使用 SQL 命令来创建和修改每个对象。\n\
  \n## 创建数据库\n\nMySQL 服务器将数据组织成数据库。一个数据库通常包含单个应用程序的数据，将其与其他使用数据库服务器的应用程序隔离开来。为每个 shell\
  \ 脚本创建一个独立的数据库有助于消除混乱和数据混淆。\n\n创建新数据库所需的 SQL 语句是：\n\n```sql\nCREATE DATABASE name;\n\
  ```\n\n这非常简单。当然，您必须拥有在 MySQL 服务器上创建新数据库的相应权限。这样做最简单的方法是以 root 用户账户身份登录：\n\n```bash\n\
  mysql -u root -p\n```\n\n\n并且你可以在 `GPL v2` 许可下修改并分发它。\n\n输入 `help;` 或 `\\h` 获取帮助。输入\
  \ `\\c` 清除当前输入语句。\n\n```mysql\nmysql> CREATE DATABASE test;\nQuery OK, 1 row affected\
  \ (0.02 sec)\nmysql>\n```\n\n你可以通过使用 `SHOW` 命令查看新数据库是否已创建：\n\n```mysql\nmysql> SHOW\
  \ DATABASES;\n+--------------------+\n| Database           |\n+--------------------+\n\
  | information_schema |\n| mysql              |\n| test               |\n+--------------------+\n\
  3 rows in set (0.01 sec)\nmysql>\n```\n\n是的，它已成功创建。你现在应该可以连接到新数据库：\n\n```mysql\n\
  mysql> USE test;\nDatabase changed;\nmysql> SHOW TABLES;\nEmpty set (0.00 sec)\n\
  mysql>\n```\n\n`SHOW TABLES` 命令允许你查看是否创建了任何表。`Empty set` 结果表示还没有可以操作的表。不过在我们开始创建表之前，还有另一件事我们需要做。\n\
  \n# 创建用户账户\n\n到为止，你已经看到了如何使用 `root` 管理员账户连接到 MySQL 服务器。该账户对所有 MySQL 服务器对象具有完全控制权（类似于\
  \ Linux 的 `root` 账户对 Linux 系统具有完全控制）。\n\n在普通应用程序中使用 `root` MySQL 账户是非常危险的。如果发生安全漏洞，有人破解了\
  \ root 用户账户的密码，你的系统（以及数据）可能会发生各种糟糕的事情。\n\n为了防止这种情况，在 MySQL 中创建一个独立的用户账户是明智的，该账户仅对应用程序所使用的数据库拥有权限。你可以通过\
  \ `GRANT` SQL 语句来实现：\n\n```mysql\nmysql> GRANT SELECT,INSERT,DELETE,UPDATE ON test.*\
  \ TO test IDENTIFIED BY 'test';\nQuery OK, 0 rows affected (0.35 sec)\nmysql>\n\
  ```\n\n这是一个相当长的命令。让我们过一下各个部分，看看它们在做什么。\n\n第一部分定义了用户账户在哪些数据库上拥有的权限。该语句允许用户账户查询数据库数据（`select`\
  \ 权限）、插入新数据记录、删除现有的数据记录以及更新现有的数据记录。\n\n`test.*` 条定义了权限所应用的数据库和表。其指定格式如下：\n\n`database.table`\n\
  \n从这个示例可以看出，在指定数据库和表时允许使用通配符。此格式将指定的权限应用于名为 `test` 的数据库中包含的所有表。\n\n最后，你指定了权限所应用的用户账户。`grant`\
  \ 命令的妙之处在于，如果用户账户不存在，它会创建它。`identified by` 部分允许你为新用户账户设置默认密码。\n\n你可以直接从 `mysql`\
  \ 程序中测试新用户账户：\n\n```bash\n$ mysql test -u test -p\nEnter password:\nWelcome to the\
  \ MySQL monitor. Commands end with ; or \\g.\nYour MySQL connection id is 40\nServer\
  \ version: 5.1.49-1ubuntu8.1 (Ubuntu)\nType 'help;' or '\\h' for help. Type '\\\
  c' to clear the buffer.\nmysql>\n```\n\n第一个参数指定了要使用的默认数据库（`test`），正如你所看到的，`-u` 参数定义了要登录的用户账户，配合\
  \ `-p` 参数提示密码。在输入分配给 test 用户账户的密码后，你就连接到了服务器。\n\n现在你已经有了数据库和一个用户账户，准备好为数据创建一些表了。但首先，让我们来看下另一个你可以使用的数据库服务器。\n\
  \n## PostgreSQL 数据库\n\nPostgreSQL 数据库最初是一个学术项目，展示了如何将先进数据库技术整合到功能性的数据库服务器中。多年来，PostgreSQL\
  \ 已经成为 Linux 环境中可用的最先进的开源数据库服务器之一。\n\n本节将引导你安装并运行 PostgreSQL 数据库服务器，然后设置一个可以在 Shell\
  \ 脚本中使用的用户账户和数据库。\n\n## 安装 PostgreSQL\n\n与 MySQL 一样，你可以通过系统的自动化软件安装系统安装 PostgreSQL\
  \ 数据库服务器包，或者手动从 PostgreSQL 网站（[www.postgresql.org](http://www.postgresql.org））下载。\n\
  \n要使用你 Linux 发行版的自动化软件安装系统，请遵循本章之前“安装 MySQL”部分中概述的相同程序。与 MySQL 类似，PostgreSQL 下载区域包含了适用于多种\
  \ Linux 发行版的预构建包，以及一个源码包。再次，请参考第 8 章以确定你的 Linux 发行版是否使用 PostgreSQL 二进制包支持的包管理系统。如果没有，你需要下载\
  \ PostgreSQL 的源码包并在你的 Linux 系统上手动进行编译。这可能是一个有趣的项目。\n\n**注意**\n\n编译源码包要求你的 Linux\
  \ 系统上加载了 C 软件开发包。现如今这对于服务器来说是非常常见的事，但如果你使用的是桌面 Linux 发行版，它可能没有加载。请咨询你具体的 Linux 发行版文档，关于编译软件以及编译\
  \ C 源码项目需要哪些软件包的内容。\n\n一旦安装了 PostgreSQL 数据库服务器，登录 PostgreSQL 服务器与 MySQL 服务器略有不同。如果你还记得，MySQL\
  \ 服务器维护自己的内部用户数据库，可以授予对数据库对象的访问权限。虽然 PostgreSQL 也具有这种能力，但大多数 PostgreSQL 实现利用现有的\
  \ Linux 系统用户账户来验证 PostgreSQL 用户。\n\n虽然这有时会让人困惑，但它确实为控制 PostgreSQL 用户账户提供了一种优雅、整洁的方法。你只需要确保每个\
  \ PostgreSQL 用户在 Linux 系统上都有有效的账户，而无需担心另一套完全独立的用户账户。\n\nPostgreSQL 的另一个主要区别是，PostgreSQL\
  \ 中的管理员账户被称为 `postgres`，而不是 `root`。由于这一要求，当你在 Linux 系统上安装 PostgreSQL 时，必须有一个名为 `postgres`\
  \ 的 Linux 用户账户。\n\n下一节将如何使用 `postgres` 账户访问 PostgreSQL 服务器。\n\n# PostgreSQL 命令界面\n\
  \nPostgreSQL 命令行客户端程序被称为 `psql`。该程序提供了对 PostgreSQL 服务器中配置的数据库对象的完全访问。本节描述了 `psql`\
  \ 命令并向你如何使用它与你的 PostgreSQL 服务器进行交互。\n\n## 连接到服务器\n\n`psql` 客户端程序提供了 PostgreSQL 服务器的命令行界面。正如你所期的，它使用命令行参数来控制客户端界面中启用哪些功能。每个选项都使用长名称或短名称格式。表\
  \ 23.3 显示了可用的命令行参数。\n\n表 23.3 psql 命令行参数\n\n| 短名称 | 长名称 | 描述 |\n| :--- | :--- |\
  \ :--- |\n| -a | `--echo-all` | 在输出中显示从脚本文件中处理的所有 SQL 行。 |\n| -A | `--no-align`\
  \ | 将输出格式设置为不对齐模式。数据不以格式化表格显示。 |\n| -c | `--command` | 执行指定的 SQL 语句并退出。 |\n| -d\
  \ | `--dbname` | 指定要连接的数据库。 |\n| -e | `--echo-queries` | 将所有查询回显到屏幕。 |\n| -E | `--echo-hidden`\
  \ | 将隐藏的 psql 元命令回显到屏幕。 |\n| -f | `--file` | 从指定文件执行 SQL 命令并退出。 |\n| -F | `--field-separator`\
  \ | 在不对齐模式下指定用于分隔列数据的字符。默认是逗号。 |\n| -h | `--host` | 指定远程 PostgreSQL 服务器的 IP 地址或主机名。\
  \ |\n\n\n\n\n| -l | --list | 显示服务器上可用数据库列表并退出。 |\n| -o | --output | 将查询输出重定向到指定的文件。\
  \ |\n| -p | --post | 指定要连接的 PostgreSQL 服务器 TCP 端口。 |\n| -P | --pset | 将指定的表格打印选项设置为特定值。\
  \ |\n| -q | --quiet | 静默模式，不显示输出消息。 |\n| -R | --record-separator | 使用指定的字符作为记录分隔符。默认是换行符。\
  \ |\n| -s | --single-step | 在每次 SQL 查询后提示继续或取消。 |\n| -S | --single-line | 指定回车键定义为\
  \ SQL 查询的结束而不是分号。 |\n| -t | --tuples-only | 禁用表格输出中的列标题和页脚。 |\n| -T | --table-attr\
  \ | 在 HTML 模式下使用指定的 HTML 表格标签。 |\n| -U | --username | 使用指定的用户名连接到 PostgreSQL 服务器。\
  \ |\n| -v | --variable | 将指定的变量设置为特定值。 |\n| -V | --version | 显示 psql 版本号并退出。 |\n\
  | -W | --password | 强制显示密码提示。 |\n| -x | --expanded | 启用扩展表格输出以显示记录的额外信息。 |\n| -X\
  \ | --nopsqlrc | 不处理 psql 启动文件。 |\n| -? | --help | 显示 psql 命令行帮助并退出。 |\n\n如上一节所述，PostgreSQL\
  \ 的管理员账户名为 `postgres`。由于 PostgreSQL 使用 Linux 用户账户来验证用户，你必须以 `postgres` Linux 账户登录，才能以\
  \ `postgres` 用户身份访问 PostgreSQL 服务器。\n\n为了解决这个问题，你可以使用 `sudo` 命令以 `postgres` 用户身份运行\
  \ `psql` 命令行程序。\n\n```bash\nsudo -u postgres psql\n[sudo password for rich]:\npsql\
  \ (8.4.5)\n\n输入 “help” 获取帮助。\npostgres=#\n```\n\n默认的 `psql` 提示符显示你正在连接的数据库。提示符中的井号（`#`）表示你以管理员用户账户登录。现在你可以开始输入一些命令来与\
  \ PostgreSQL 服务器交互了。\n\n### psql 命令\n\n与 `mysql` 程序类似，`psql` 程序使用两种不同类型的命令：\n\n\
  * 标准 SQL 语句\n* PostgreSQL 元命令（meta-commands）\n\nPostgreSQL 元命令允许你轻松提取有关数据库环境的信息，并为\
  \ `psql` 会话设置功能。元命令通过反斜杠 `\\` 表示。PostgreSQL 有许多针对不同设置和功能的元命令，但没必要立即开始担心所有的它们。最常用的命令有：\n\
  \n* `\\l` 列出可用数据库\n* `\\c` 连接到数据库\n* `\\dt` 列出数据库中的表\n* `\\du` 列出 PostgreSQL 用户\n\
  * `\\z` 列出表权限\n* `\\?` 列出所有可用元命令\n* `\\h` 列出所有可用 SQL 命令\n* `\\q` 退出数据库\n\n如果你需要查找某个元命令，只需输入\
  \ `\\?` 元命令即可。你将看到所有可用元命令的列表及其解释。\n\n要测试元命令，请使用 `\\l` 元命令列出可用数据库：\n\n```sql\npostgres=#\
  \ \\l\nList of databases\n   Name    | Owner  | Encoding | Collation  |   Ctype\
  \    |   Access\n-----------+----------+----------+------------+------------+----------\n\
  \ postgres  | postgres | UTF8     | en_US.utf8  | en_US.utf8  |\n template0 | postgres\
  \ | UTF8     | en_US.utf8  | en_US.utf8  | =c/postgres\n template1 | postgres |\
  \ UTF8     | en_US.utf8  | en_US.utf8  | =c/postgres\n(3 rows)\n\npostgres=#\n```\n\
  \n该列表显示了服务器上的可用数据库及其特性（我们截断了 `Access` 列的内容以适应页面显示）。这些是 PostgreSQL 服务器提供的默认数据库。`postgres`\
  \ 数据库维护着服务器的所有系统数据。`template0` 和 `template1` 数据库为你提供了在创建新数据库时复制的默认数据库模板。\n\n你现在已经准备好在\
  \ PostgreSQL 中处理你自己的数据了。\n\n### 创建 PostgreSQL 数据库对象\n\n本节将引导你完成创建数据库以及访问它的用户账户的过程。你会发现，虽然\
  \ PostgreSQL 中的某些工作与 MySQL 完全相同，但另一些工作又是完全不同的。\n\n#### 创建数据库对象\n\n创建数据库是与 MySQL\
  \ 相同的操作之一。记得以 `postgres` 管理员账户登录以创建新数据库：\n\n```bash\nsudo –u postgres psql\npsql\
  \ (8.4.5)\n\n输入 “help” 获取帮助。\npostgres=# CREATE DATABASE test;\nCREATE DATABASE\n\
  postgres=#\n```\n\n创建数据库后，使用 `\\l` 元命令查看它是否出现在列表中，然后使用 `\\c` 元命令连接到它：\n\n```sql\n\
  postgres=# \\l\nList of databases\n   Name    | Owner  | Encoding | Collation  |\
  \   Ctype    |   Access\n-----------+----------+----------+------------+------------+----------\n\
  \ postgres  | postgres | UTF8     | en_US.utf8  | en_US.utf8  |\n template0 | postgres\
  \ | UTF8     | en_US.utf8  | en_US.utf8  |\n template1 | postgres | UTF8     | en_US.utf8\
  \  | en_US.utf8  | =c/postgres\n test      | postgres | UTF8     | en_US.utf8  |\
  \ en_US.utf8  |\n(4 rows)\n\npostgres=# \\c test\nConnecting to database \"test\"\
  \npostgres=#\n```\n\n### 注意\n\nPostgreSQL 为数据库增加了另一层控制，称为模式（schema）。一个数据库可以包含多个模式，每个模式包含多个表。这允许你为特定的应用程序或用户细分数据库。\n\
  \n默认情况下，每个数据库都包含一个名为 `public` 的模式。如果你只让一个应用程序使用数据库，那么使用 `public` 模式即可。如果你想玩得高级一点，可以创建新的模式。\n\
  \n#### 创建用户账户\n\n创建数据库后，下一步是为你的脚本创建一个具有访问权限的用户账户。正如你已经看到的，PostgreSQL 中的用户账户与 MySQL\
  \ 有显著不同。\n\nPostgreSQL 中的用户账户被称为登录角色（Login Roles）。PostgreSQL 服务器将登录角色匹配到 Linux 用户账户。因此，创建用于运行脚本的登录角色有两种常用方法：\n\
  \n* 创建一个与 PostgreSQL 登录角色匹配的特殊 Linux 来运行所有脚本。\n* 为每个需要运行脚本访问数据库的 Linux 用户账户创建 PostgreSQL\
  \ 账户。\n\n在本例中，让我们选择第二种方法，创建一个与我们的 Linux 系统账户匹配的 PostgreSQL 账户。这样你就可以从 Linux 用户账户直接运行访问\
  \ PostgreSQL 数据库的脚本了。\n\n首先，你必须创建登录角色：\n\n```sql\ntest=# CREATE ROLE rich login;\n\
  CREATE ROLE\n```\n\n这非常简单。如果没有 `login` 参数，该角色将不允许登录 PostgreSQL 服务器，但可以被分配权限。这种类型的角色被称为组角色（group\
  \ role）。如果你在一个拥有大量用户和表的大型环境中工作，组角色会非常好。你不需要不断跟踪哪个用户对哪些表拥有何种类型的权限，只需为特定的表访问创建组角色，然后将登录角色分配给相应的组角色即可。\n\
  \n对于简单的 shell 脚本，你可能不需要担心创建组角色，直接将权限分配给登录角色即可。这就是我们在本例中将做的。\n\n\n\n\n然而，PostgreSQL\
  \ 处理权限的方式与 `MySQL` 有些不同。它不允许你对数据库中的所有对象授予整体权限并将其缩小到表级。相反，你需要为你创建的每个单独表单独授予权限。虽然这在某种程度上有些麻烦，但它确实有助于执行严格的安全策略。你必须在创建表之后推后分配权限。这是我们流程中的下一个步骤。\n\
  \n# 与表进行操作\n\n现在，你已经运行了 `MySQL` 或 `PostgreSQL` 服务器，并为访问它创建了新的数据库和用户账户，现在是时候开始处理数据了！幸运的是，`mysql`\
  \ 和 `psql` 程序都使用标准 SQL 来创建和管理数据表。本节将引导你你学习在两个环境中创建表、插入和删除数据以及查询现有数据所需的 SQL 语句。\n\
  \n## 创建表\n\n`MySQL` 和 `PostgreSQL` 服务器都被视为关系型数据库。在关系型数据库中，数据通过数据字段、记录和表来组织。数据字段是单条信息，例如员工的姓或工资。记录是相关数据字段的集合，例如员工\
  \ ID 号、姓、名、地址和工资。每条记录表示一组数据字段。\n\n表包含所有持有相关数据的记录。因此，你有一个名为 `Employees` 的表，其中存储了每个员工的记录。\n\
  \n要在数据库中创建新表，你需要使用 `CREATE TABLE` SQL 命令：\n\n```bash\nmysql test -u root -p\nEnter\
  \ password:\nmysql> CREATE TABLE employees (\n  -> empid int not null,\n  -> lastname\
  \ varchar(30),\n  -> firstname varchar(30),\n  -> salary float,\n  -> primary key\
  \ (empid));\nQuery OK, 0 rows affected (0.14 sec)\nmysql>\n```\n\n首先，请注意，为了创建新表，我们需要使用\
  \ `root` 用户账户登录 `MySQL`，因为 `test` 用户没有创建新表的权限。接下来，请注意我们在 `mysql` 程序的命令行中指定了 `test`\
  \ 数据库。如果我们没有这样做，就需要使用 `USE` SQL 命令来连接到 `test` 数据库。\n\n### 注意事项\n\n在创建新表之前，确保你正处于正确的数据库中是非常关重要的。此外，请确保你正在使用管理员用户账户（`MySQL`\
  \ 使用 `root`，`PostgreSQL` 使用 `postgres`）来创建表。\n\n表中的每个数据字段都使用数据类型定义。`MySQL` 和 `PostgreSQL`\
  \ 数据库支持许多不同的数据类型。[表 23.4] 显示了你可能需要的一些常用数据类型。\n\n### MySQL 和 PostgreSQL 数据类型\n\n\
  | 数据类型 |  |\n| :--- | :--- |\n| char | 固定长度字符串值 |\n| varchar | 可变长度字符串值 |\n| int\
  \ | 整数值 |\n| float | 浮点值 |\n| Boolean | 布尔真/假值 |\n| Date | YYYY-MM-DD 格式的日期值 |\n\
  | Time | HH:mm:ss 格式的时间值 |\n| Timestamp | 日期和时间组合值 |\n| Text | 长字符串值 |\n| BLOB |\
  \ 大二进制值，如图像或视频剪 |\n\n`empid` 数据字段还指定了一个数据约束。数据约束限制了你可以输入什么类型的数据来创建有效记录。`not null`\
  \ 数据约束表示每条记录都必须指定 `empid` 值。\n\n最后，`primary key` 定义了一个唯一标识每条单独记录的数据字段。这意味着表中的每条数据记录都必须具有唯一的\
  \ `empid` 值。\n\n创建新表后，你可以使用适当的命令来确保它已创建。在 `mysql` 中，它是 `show tables` 命令：\n\n```sql\n\
  mysql> show tables;\n+----------------+\n| Tables_in_test  |\n+----------------+\n\
  | employees       |\n+----------------+\n1 row in set (0.00 sec)\nmysql>\n```\n\n\
  在 `psql` 中，它是 `\\dt` 元命令：\n\n```bash\ntest=# \\dt\n             List of relations\n\
  Schema  | Name    | Type  | Owner\n--------+-----------+-------+----------\npublic\
  \  | employees | table | postgres\n(1 row)\ntest=#\n```\n\n正如你可能在本章较早的“创建 PostgreSQL\
  \ 数据库对象”部分中所记得的，在 `PostgreSQL` 中，你需要在表级分配权限。现在你已经有一张表，你需要赋予你的 `Login Role` 访问它的权限：\n\
  \n```bash\nsudo -u postgres psql\npsql (8.4.5)\nType “help” for help.\npostgres=#\
  \ \\c test\npsql (8.4.5)\nYou are now connected to database “test”.\ntest=# GRANT\
  \ SELECT, INSERT, DELETE, UPDATE ON public.employees TO rich;\nGRANT\ntest=#\n```\n\
  \n指定表的格式必须包含架构（schema）名称，默认架构为 `public`。此外，记住以 `postgres` 登录角身份执行此命令，并连接到 `test`\
  \ 数据库。\n\n表创建完成后，你现在准备好保存一些数据了。下一节将介绍如何操作。\n\n## 插入和删除数据\n\n意不意外的是，你使用 `INSERT`\
  \ SQL 命令向表中插入新的数据记录。每个 `INSERT` 命令都必须指定数据字段的值，`MySQL` 或 `PostgreSQL` 服务器才能接受该记录。\n\
  \n`INSERT` SQL 命令的格式为：\n`INSERT INTO table VALUES (...)`\n\n这些值是每个数据字段的数据值的逗号分隔列表：\n\
  \n```bash\n$ mysql test -u root -p\nEnter password:\nmysql> INSERT INTO employees\
  \ VALUES (1, 'John', 'Doe', 50000.00);\nQuery OK, 1 row affected (0.14 sec)\n```\n\
  \n```bash\n$ sudo -u postgres psql\npsql (8.4.5)\ntest=# INSERT INTO employees VALUES\
  \ (2, 'Jane', 'Smith', 60000.00);\nINSERT 0\n```\n\n如果你尝试添加另一个重复 `empid` 字段的记录，你会得到错误：\n\
  \n```sql\nmysql> INSERT INTO employees VALUES (1, 'Jane', 'Smith', 60000.00);\n\
  ERROR 1062 (23000): Duplicate entry '1' for key 'PRIMARY'\n```\n\n然而，如果你将 `empid`\
  \ 值改为唯一值，一切正常：\n\n```sql\nmysql> INSERT INTO employees VALUES (3, 'Bob', 'Brown',\
  \ 45000.00);\nQuery OK, 1 row affected (0.14 sec)\n```\n\n如果你需要从表中删除数据，可以使用 `DELETE`\
  \ 命令。但是，你需要非常小心地使用它。\n\n基础 `DELETE` 命令格式为：\n`DELETE FROM table;`\n\n其中 `table` 指定要删除记录的表。只有一个小问题：它会删除表中的所有记录。\n\
  \n要指定删除单条记录或一组记录，你必须使用 `WHERE` 子句。`WHERE` 子句允许你创建一个过滤器来识别要删除的记录。你可以像这样使用 `WHERE`\
  \ 子句：\n\n```sql\nmysql> DELETE FROM employees WHERE empid = 2;\nQuery OK, 1 row\
  \ affected (0.29 sec)\n```\n\n## 查询数据\n\n一旦你将所有数据都放入数据库，就是时候开始运行报告来提取信息了。\n\n你所有查询的核心工具是\
  \ SQL `SELECT` 命令。`SELECT` 命令功能非常强大，但多功能性也带来了复杂性。\n\n`SELECT` 语句的基本格式为：\n`SELECT\
  \ datafields FROM table`\n\n`datafields` 参数是你希望查询返回的数据字段名称的逗号分隔列表。如果你想接收所有的数据字段值，可以使用星号\
  \ `*` 作为通配符。\n\n\n\n\n你还必须指定想要查询的特定表。为了获得有意义的结果，你必须将查询数据字段与正确的表相匹配。\n\n默认情况下，`SELECT`\
  \ 命令返回指定表中的所有数据记录：\n\n```sql\nmysql> SELECT * FROM employees;\n\n+-------+----------+------------+--------+\n\
  | empid  | lastname  | firstname  | salary  |\n+-------+----------+------------+--------+\n\
  |      1 | Blum      | Rich       |  25000 |\n|      2 | Blum      | Barbara   \
  \ |  45000 |\n|      3 | Blum      | Katie Jane  |  34500 |\n|      4 | Blum   \
  \   | Jessica    |  52340 |\n+-------+----------+------------+--------+\n4 rows\
  \ in set (0.00 sec)\nmysql>\n```\n\n你可以使用一个或多个修饰符来定义数据库服务器返回查询数据的方式。以下是常用修饰符列表：\n\
  \n- `WHERE`: 显示符合特定条件的记录子集\n- `ORDER BY`: 按指定顺序显示记录\n- `LIMIT`: 仅显示记录子集\n\n`WHERE`\
  \ 子句是最常用的 `SELECT` 命令修饰符。它允许你指定条件来过滤结果集中的数据。这是一个使用 `WHERE` 子句的示例：\n\n```sql\nmysql>\
  \ SELECT * FROM employees WHERE salary > 40000;\n\n+-------+----------+-----------+--------+\n\
  | empid  | lastname  | firstname  | salary  |\n+-------+----------+-----------+--------+\n\
  |      2 | Blum      | Barbara    |  45000 |\n|      4 | Blum      | Jessica   \
  \ |  52340 |\n+-------+----------+-----------+--------+\n2 rows in set (0.01 sec)\n\
  mysql>\n```\n\n现在你可以看到在 shell 脚本中添加数据库访问功能的威力了！你只需要几个 SQL 命令和 `mysql` 或 `psql` 程序，就可以轻松地控制你的数据管理需求。下一节将描述如何将这些功能整合到你的\
  \ shell 脚本中。\n\n## 在脚本中使用数据库\n\n现在你已经有一个可以运行的数据库，终于可以把注意力回到 shell 脚本世界了。本节描述了了使用\
  \ shell 脚本与数据库交互时需要做什么。\n\n## 连接数据库\n\n显然，为了连接数据库，你需要在 shell 脚本以某种方式利用 `mysql` 或\
  \ `psql` 程序。这个过程并不复杂，但有几点你需要注意。\n\n### 寻找程序\n\n你需要完成的第一个障碍是弄清楚 `mysql` 和 `psql`\
  \ 命令行客户端程序在 Linux 系统上的位置。Linux 软件安装的一个缺点是，不同的 Linux 发行版通常将软件包存放在不同的位置。\n\n幸运的是，有一个\
  \ `which` 命令。`which` 命令可以告诉你 shell 在尝试从命令行运行某个命令时会在哪里找到该命令：\n\n```bash\n$ which\
  \ mysql\n/usr/bin/mysql\n\n$ which psql\n/usr/bin/psql\n$\n```\n\n处理此类信息最简单的方法将其赋值给环境变量，然后在需要引用相应程序时在\
  \ shell 脚本中使用它：\n\n```bash\nMYSQL='which mysql'\nPSQL='which psql'\n```\n\n现在 `$MYSQL`\
  \ 变量指向 `mysql` 程序的可执行文件，而 `$PSQL` 变量指向 `psql` 程序的可执行文件。\n\n### 登录服务器\n\n找到客户端程序的位置后，你就可以在脚本中使用它们来访问数据库服务器。对于\
  \ PostgreSQL 服务器，这很简单：\n\n```bash\n$ cat ptest1\n#!/bin/bash\n# test connecting\
  \ to the PostgreSQL server\nPSQL='which psql'\n$PSQL test\n$ ./ptest1\npsql (8.4.5)\n\
  Type \"help\" for help.\ntest=>\n```\n\n因为脚本是从 Linux 用户账户运行的，且存在一个同名的 PostgreSQL\
  \ 账户，你只需要在 `psql` 命令行中指定要连接的数据库名称即可。`ptest1` 脚本连接到了测试数据库，并让你留在该数据库内部的 `psql` 提示符。\n\
  \n如果你在 MySQL 中为 shell 脚本创建了一个特殊的用户账户，你需要在 `mysql` 命令行中指定它：\n\n```bash\n$ cat mtest1\n\
  #!/bin/bash\n# test connecting to the MySQL server\nMYSQL='which mysql'\n$MYSQL\
  \ test -u test -p\n$ ./mtest1\nEnter password:\nReading table information for completion\
  \ of table and column names\nYou can turn off this feature to get a quicker startup\
  \ with -A\nWelcome to the MySQL monitor. Commands end with ; or \\g.\nYour MySQL\
  \ connection id is 43\nServer version: 5.1.49-1ubuntu8.1 (Ubuntu) (c) 2000, 2010,\
  \ Oracle and/or its. All rights reserved. This software comes with ABSOLELY NO WARRANTY.\
  \ This is free software, and you are welcome to modify and distribute it under the\
  \ GPL v2 Type 'help'; or \\h for help. Type \\c to clear the current statement.\n\
  mysql>\n```\n\n这虽然有效，但对于非交互式脚本来说并不理想。`-p` 命令行会导致 `mysql` 暂停并询问密码。你可以通过在命令行中包含密码来解决这个问题：\n\
  \n```bash\n$MYSQL test -u test -pt\n```\n\n然而，这不是一个好主意。任何访问你脚本的人都会知道数据库的用户账户和密码。为了解决这个问题，你可以使用\
  \ `mysql` 程序使用的特殊文件。`mysql` 程序使用 `$HOME/.my.cnf` 来读取特殊的命令和设置。这些设置之一就是用户账户的默认密码。要在文件中设置默认密码，只需创建以下内容：\n\
  \n```bash\n$ cat .my.cnf\npassword = test\n$ chmod 400 .my.cnf\n```\n\n`chmod` 命令用于限制\
  \ `.my.cnf`，使得只有你可以查看它。你可以从命令行进行测试：\n\n```bash\n$ mysql test -u test\nReading table\
  \ information for completion of table and column names\nYou can turn off this feature\
  \ to get a quicker startup with -A\nWelcome to the MySQL monitor. Commands end with\
  \ ; or \\g.\n...\nABSOLELY NO WARRANTY. This is free software, and you are welcome\
  \ to modify and distribute it under the GPL v2 Type 'help'; or \\h for help. Type\
  \ \\c to clear the current input statement.\nmysql>\n```\n\n完美！现在你就不需要在脚本的命令行中包含密码了。\n\
  \n## 向服务器发送命令\n\n在建立与服务器的连接后，你想发送命令来与数据库交互。实现这一点有两种方法：\n\n- 发送单个命令并退出。\n- 发送多个命令。\n\
  \n要发送单个命令，你必须将命令作为 `mysql` 或 `psql` 命令行的一部分。对于 `mysql` 命令，你通过使用 `-e` 参数来实现：\n\n\
  ```bash\n$ cat mtest2\n#!/bin/bash\n# send a command to the MySQL server\nMYSQL='which\
  \ mysql'\n$MYSQL test -u test -e 'select * from employees'\n$ ./mtest2\n+-------+----------+------------+---------+\n\
  | empid  | lastname  | firstname  | salary  |\n+-------+----------+------------+---------+\n\
  |      1 | Blum      | Rich       |  25000 |\n|      2 | Blum      | Barbara   \
  \ |  45000 |\n|      3 | Blum      | Katie Jane  |  34500 |\n|      4 | Blum   \
  \   | Jessica    |  52340 |\n+-------+----------+------------+---------+\n```\n\n\
  对于 `psql` 命令，你通过使用 `-c` 参数来实现：\n\n```bash\n$ cat ptest2\n#!/bin/bash\n# send a command\
  \ to the PostgreSQL server\nPSQL='which psql'\n$PSQL test -c 'select * from employees'\n\
  $ ./ptest2\nempid  | lastname  | firstname  | salary\n-------+----------+------------+--------\n\
  \     1 | Blum      | Rich       |  25000\n     2 | Blum      | Barbara    |  45000\n\
  \     3 | Blum      | Katie Jane  |  34500\n     4 | Blum      | Jessica    |  52340\n\
  ```\n\n数据库服务器将 SQL 命令的结果返回给 shell 脚本，由 shell 脚本在标准输出 (STDOUT) 中显示。\n\n\n\n\n\n如果你需要发送多条\
  \ SQL 命令，可以使用文件重定向（参见第 14 章）。要在 shell 脚本中重定向行，你必须定义一个文件结束字符串。该文件结束字符串指示了重定向数据的开始和结束。\n\
  \n以下是一个定义文件结束字符串并包含包含数据的示例：\n\n```bash\n$ cat mtest3\n\n#!/bin/bash\n\n# sending\
  \ multiple commands to MySQL\nMYSQL='which mysql'\n$MYSQL test -u test <<EOF\nshow\
  \ tables;\n\nselect * from employees where salary > 40000;\nEOF\n$ ./mtest3\n\n\
  Tables_in_test\nemployees\nempid    lastname    firstname    salary\n2        Blum\
  \        Barbara      45000\n4        Blum        Jessica     52340\n$\n```\n\n\
  shell 将带有 `EOF` 分隔符的所有内容都重定向到 `mysql` 命令，该命令执行这些行的方式就像你在提示符处手动输入它们的一样。使用这种方法，你可以向\
  \ `MySQL` 服务器发送任意数量的命令。然而，你会发现，每个命令的输出之间没有分隔符。在下一节“格式化数据”中，你将看到如何解决这个问题。\n\n###\
  \ 注意\n\n你还会注意到，当你使用重定向输入方法时，`mysql` 程序更改了默认的输出样式。`mysql` 程序没有在数据周围创建 ASCII 符号框，而是检测到输入是重定向的，因此它只返回了原始数据。这在你需要提取单个数据元素时将非常有用。\n\
  \n相同的技术也适用于 `psql` 程序：\n\n```bash\n$ cat ptest3\n\n#!/bin/bash\n\n# sending multiple\
  \ commands to PostgreSQL\nPSQL='which psql'\n$PSQL test <<EOF\n\\dt\n\nselect *\
  \ from employees where salary > 40000;\nEOF\n$ ./ptest3\n\n             List of\
  \ relations\n Schema |   Name   | Type  | Owner\n--------+-----------+-------+----------\n\
  \ public | employees | table | postgres\n(1 row)\n\n empid | lastname | firstname\
  \ | salary\n-------+----------+-----------+--------\n      2 | Blum     | Barbara\
  \  |  45000\n      4 | Blum     | Jessica  |  52340\n(2 rows)\n$\n```\n\n`psql`\
  \ 程序按照你指定的顺序，将每个命令的输出直接显示到 `STDOUT`。\n\n当然，你并不限于仅从表中检索数据。你可以在脚本中使用任何类型的 SQL 命令，例如\
  \ `INSERT` 语句：\n\n```bash\n$ cat mtest4\n\n#!/bin/bash\n\n# send data to the table\
  \ in the MySQL database\nMYSQL='which mysql'\nif [ $# -ne 4 ]\nthen\n  echo \"Usage:\
  \ mtest4 empid lastname firstname salary\"\nelse\n  statement=\"INSERT INTO employees\
  \ VALUES ($1, '$2', '$3', $4)\"\n  $MYSQL test -u test << EOF\n  $statement\nEOF\n\
  \  if [ $? -eq 0 ]\n  then\n    echo Data successfully added\n  else\n    echo Problem\
  \ adding data\n  fi\nfi\n$ ./mtest4\nUsage: mtest4 empid lastname firstname salary\n\
  $ ./mtest4 5 Blum Jasper 100000\nData added successfully\n$ ./mtest4 5 Blum Jasper\
  \ 100000\nERROR 1062 (23000) at line 1: Duplicate entry\n$\n```\n\n### 添加数据时问题\n\
  \n上面的示例展示了如何使用变量构建语句。注意使用 `$?` 来检查上一个执行命令的退出状态。\n\n### 将输出赋值给变量\n\n捕获输出的第一步将其放入变量中。这里有一个示例：\n\
  \n```bash\n$ cat mtest3\n\n#!/bin/bash\n\n# sending multiple commands to MySQL\n\
  MYSQL='which mysql'\n$MYSQL test -u test <<EOF\nshow tables;\n\nselect * from employees\
  \ where salary > 40000;\nEOF\n$ ./mtest3\n```\n\nshell 将带有 `EOF` 分隔符的所有内容都重定向到 `mysql`\
  \ 命令，该命令执行这些行的方式就像你在提示符处手动输入它们的一样。使用这种方法，你可以向 `MySQL` 服务器发送任意数量的命令。然而，你会发现，每个命令的输出之间没有分隔符。在下一节“格式化数据”中，你将看到如何解决这个问题。\n\
  \n### 格式化数据\n\n你还会注意到，当你使用重定向输入方法时，`mysql` 程序更改了默认的输出样式。`mysql` 程序没有在数据周围创建 ASCII\
  \ 符号框，而是检测到输入是重定向的，因此它只返回了原始数据。这在你需要提取单个数据元素时将非常有用。\n\n相同的技术也适用于 `psql` 程序：\n\n\
  ```bash\n$ cat ptest3\n\n#!/bin/bash\n\n# sending multiple commands to PostgreSQL\n\
  PSQL='which psql'\n$PSQL test <<EOF\n\\dt\n\nselect * from employees where salary\
  \ > 40000;\nEOF\n$ ./ptest3\n```\n\n`psql` 程序按照你指定的顺序，将每个命令的输出直接显示到 `STDOUT`。\n\n\
  当然，你并不限于仅从表中检索数据。你可以在脚本中使用任何类型的 SQL 命令，例如 `INSERT` 语句：\n\n```bash\n$ cat mtest4\n\
  \n#!/bin/bash\n\n# send data to the table in the MySQL database\nMYSQL='which mysql'\n\
  if [ $# -ne 4 ]\nthen\n  echo \"Usage: mtest4 empid lastname firstname salary\"\n\
  else\n  statement=\"INSERT INTO employees VALUES ($1, '$2', '$3', $4)\"\n  $MYSQL\
  \ test -u test << EOF\n  $statement\nEOF\n  if [ $? -eq 0 ]\n  then\n    echo Data\
  \ successfully added\n  else\n    echo Problem adding data\n  fi\nfi\n$ ./mtest4\n\
  Usage: mtest4 empid lastname firstname salary\n$ ./mtest4 5 Blum Jasper 100000\n\
  Data added successfully\n$ ./mtest4 5 Blum Jasper 100000\nERROR 1062 (23000) at\
  \ line 1: Duplicate entry\n$\n```\n\n### 使用标签\n\n`mysql` 程序还支持另一种格式，称为可扩展标记语言 (XML)。这种语言使用类似\
  \ HTML 的标签来标识数据名称和值。\n\n对于 `mysql` 程序，你通过 `-X` 命令行来实现此操作：\n\n```bash\n$ psql test\
  \ -H -c 'select * from employees where salary > 40000'\n```\n\n<?xml version=\"\
  1.0\"?>\n<resultset statement=\"select * from employees where salary > 40000\">\n\
  <row>\n<field name=\"empid\">2</field>\n<field name=\"lastname\">Blum</field>\n\
  <field name=\"firstname\">Barbara</field>\n<field name=\"salary\">45000</field>\n\
  </row>\n<row>\n<field name=\"empid\">4</field>\n<field name=\"lastname\">Blum</field>\n\
  <field name=\"firstname\">Jessica</field>\n<field name=\"salary\">52340</field>\n\
  </row>\n</resultset>\n```\n\n`psql` 程序提供了相同的选项：\n\n```bash\n$ psql test -H -c 'select\
  \ * from employees where salary > 40000'\n```\n\n<?xml version=\"1.0\"?>\n<resultset\
  \ statement=\"select * from employees where salary > 40000\">\n<row>\n<field name=\"\
  empid\">2</field>\n<field name=\"lastname\">Blum</field>\n<field name=\"firstname\"\
  >Barbara</field>\n<field name=\"salary\">45000</field>\n</row>\n<row>\n<field name=\"\
  empid\">4</field>\n<field name=\"lastname\">Blum</field>\n<field name=\"firstname\"\
  >Jessica</field>\n<field name=\"salary\">52340</field>\n</row>\n</resultset>\n```\n\
  \n## 总结\n\n本章讨论了如何在 shell 脚本中使用变量保存、修改和检索数据。你可以直接从 shell 脚本访问对应的 MySQL 和 PostgreSQL\
  \ 数据库服务器。\n\n第 24 章\n\n使用 Web\n\n在本章中\n\n\n\n\n\n# 使用 Lynx 冲浪\n\n* 使用 cURL 进行探索\n\
  * 在 zsh 中进行客户端/服务器编程\n\n当你考虑到 Shell 脚本编程时，最后想到的往往是互联网。命令行世界对于华丽的图形化互联网世界来说通常显得很陌生。然而，有几种不同的工具可以轻松地在你的\
  \ Shell 脚本中使用，以访问 Web 以及其他网络设备的数据内容。本章将带你介绍三种让 Shell 脚本与网络世界交互的流行方法。\n\n## Lynx\
  \ 程序\n\n`Lynx` 程序几乎和互联网本身一样老了，它是由堪萨斯大学的学生于 1992 年创建的，作为一个基于文本的浏览器。由于它是基于文本，`Lynx`\
  \ 程序允许你直接从终端会话中浏览网页，将网页上华丽的图形替换为 HTML 文本标签。这允许你从几乎任何类型的 Linux 终端冲浪浏览。`Lynx` 屏幕示例如图\
  \ 24.1 所示。\n\n图 24.1 使用 Lynx 查看网页\n\n![24.1](img/c24f001.jpg)\n\n`Lynx` 使用标准键盘键在网页上进行导航。链接以网页内高亮文本的形式出现。使用右箭头键允许你点击链接进入下一个网页。\n\
  \n你可能在奇如何在 Shell 脚本中使用图形化文本程序。`Lynx` 程序还提供了一个功能，允许将网页的文本内容导出到 `STDOUT`（标准输出）。该功能对于挖掘网页中包含的数据非常有用。本节描述了如何在\
  \ Shell 脚本中使用 `Lynx` 程序从互联网网站中提取数据。\n\n### 安装 Lynx\n\n尽管 `Lynx` 程序已经有些老了，但它仍在活跃开发中。在编写本文时，`Lynx`\
  \ 的最新版本是 2.8.8 版本，于 2010 年 6 月发布，新版本正在开发中。由于它在 Shell 脚本程序员中非常受欢迎，许多 Linux 发行版在默认安装中都包含了\
  \ `Lynx` 程序。\n\n如果你使用的安装版本没有提供 `Lynx` 程序，请检查你发行版的安装包。你可能会在那里找到它以便于安装。\n\n如果你的发行版不包含\
  \ `Lynx` 软件包，或者你只需要最新版本，可以从 [lynx.isc.org](http://lynx.isc.org) 网站下载源代码并自行编译（假设你已经在\
  \ Linux 系统上安装了 C 开发库）。请参阅第 8 章获取有关编译和安装源码分发包的信息。\n\n**注意**\n\n`Lynx` 程序在 Linux 中使用了\
  \ `curses` 文本图形库。大多数发行版默认安装了该库。如果你的发行版没有，在尝试编译 `Lynx` 之前，请参考你特定发行版关于安装 `curses`\
  \ 库的说明。下一节描述了如何从命令行使用 `lynx` 命令。\n\n## lynx 命令行\n\n`lynx` 命令行在从远程网站检索信息方面功能极其强大。当你在浏览器中查看网页时，你看到的只是传输到浏览器的部分信息。网页由三类型的数据元素组成：\n\
  \n* HTTP 头部\n* Cookies\n* HTML 内容\n\n`HTTP headers` 提供了有关连接中发送的数据类型、发送数据的数据服务器以及连接中使用的安全类型的信息。如果你正在发送特殊类型的数据（例如视频或音频剪），服务器会在\
  \ `HTTP headers` 中识别这些。`Lynx` 程序允许你查看网页会话中发送的所有 `HTTP headers`。\n\n如果你进行过任何类型的 Web\
  \ 浏览，无疑对网页 Cookie 并不陌生。网站使用 Cookie 存储你访问网站的数据以供将来使用。每个独立站点都可以存储信息，但只能访问它自己设置的信息。`lynx`\
  \ 命令提供了选项，让你查看 Web 服务器发送的 Cookie，以及拒绝或接受从服务器发送的特定 Cookie。\n\n`Lynx` 程序允许你以三种不同的格式查看网页的实际\
  \ HTML 内容：\n\n* 在终端会话中使用 `curses` 图形库的文本图形显示中查看\n* 作为文本文件，导出网页的原始数据\n* 作为文本文件，导出网页的原始\
  \ HTML 源代码\n\n对于 Shell 脚本来说，查看原始数据或 HTML 源代码是一座金矿。一旦你捕获了从网站检索的数据，就可以轻松地提取出单条信息。\n\
  \n如你所见，`Lynx` 程序的功能非常多样。然而，多功能也意味着复杂性，特别是在涉及命令行参数时。`Lynx` 程序是 Linux 世界中你会遇到的较复杂的程序之一。\n\
  \n`lynx` 命令的基本格式为：\n\n```\nlynx options URL\n```\n\n其中 `URL` 是你想要连接的 HTTP 或 HTTPS\
  \ 目标，`options` 是修改 `Lynx` 与远程网站交互时行为的一个或多个选项。对于 `Lynx` 所需的任何类型的 Web 交互，都有相应的选项。表\
  \ 24.1 显示了你可以配合 `lynx` 命令使用的可用命令行参数。\n\n表 24.1 lynx 命令参数\n\n| 参数 | 说明 |\n| :---\
  \ | :--- |\n| - | 从 STDIN 接收选项和参数。 |\n| -accept_all_cookies | 如果开启了 Set-Cookie 处理，则在不提示的情况下接受\
  \ Cookie。默认关闭。 |\n| -anonymous | 为匿名账户应用限制。 |\n| -assume_charset=name | 未指定字符集的文档默认字符集。\
  \ |\n| -assume_local_charset=name | 本地文件的默认字符集。 |\n| -assume_unrec_charset=name\
  \ | 使用未识别字符集时使用的默认字符集。 |\n| -auth=id:pw | 受保护文档的身份验证信息。 |\n| -base | 为 -source 的\
  \ text/HTML 输出前一个请求 URL 注释 BASE 标签。 |\n| -bibhost=URL | 本地 bibp 服务器 URL（默认 [`bibhost/`](http://bibhost/))）。\
  \ |\n| -book | 使用书签页作为首页。默认关闭。 |\n| -buried_news | 切换扫描新闻文章以查找埋藏的引用。默认开启。 |\n| -cache=n\
  \ | 内存中缓存的文档数量。 |\n| -case | 启用区分大小敏感的用户搜索。默认关闭。 |\n| -center | 切换 HTML <table>\
  \ 标签中的居中对齐。默认关闭。 |\n| -cfg=filename | 指定默认 lynx.cfg 文件以外的配置文件。 |\n| -child | 在启动文件中使用左箭头时退出，并禁用保存磁盘。\
  \ |\n| -cmd_log=filename | 将命令行命令记录到指定文件。 |\n| -cmd_script=filename | 从指定文件读取命令行命令。\
  \ |\n| -connect_timeout=n | 设置连接超时（秒）。默认值为 18000 秒。 |\n| -cookie_file=filename |\
  \ 指定用于读取 Cookie 的文件。 |\n| -cookie_save_file=filename | 指定用于存储 Cookie 的文件。 |\n| -cookies\
  \ | 切换 Set-Cookie 头部处理。默认开启。 |\n| -core | 切换致命错误时的强制核心转储。默认关闭。 |\n| -crawl | 配合\
  \ -traversal，使用 -dump 将每个页面输出到文件，格式与 -traversal 相同但输出到 STDOUT。 |\n| -curses_pads\
  \ | 使用 curses pad 功能支持左/右移动。默认开启。 |\n| -debug_partial | 使用 MessageSecs 延迟显示增量显示阶段。默认关闭。\
  \ |\n| -delay=n | 设置状态栏消息延迟（秒）。默认值为 0.000。 |\n| -display=display | 为 X 窗口程序设置显示变量。\
  \ |\n| -display_charset=name | 终端输出的字符集。 |\n\n\n\n\n\n|  | 说明 |\n| :--- | :--- |\n\
  | `-dont_wrap_pre` | 当设置 `-dump` 和 `-crawl` 时，不对 `<pre>` 部分的文本进行换行。在交互会话中标记换行的行。默认开启。\
  \ |\n| `-dump` | 将第一个 URL 导出到 STDOUT 并退出。 |\n| `-editor=editor` | 使用指定的编辑器启用编辑模式。\
  \ |\n| `-emacskeys` | 启用类似 emacs 的按键移动。默认关闭。 |\n| `-enable_scrollback` | 切换与回滚键的兼容性。默认关闭。\
  \ |\n| `-error_file=filename` | 将 HTTP 码写入指定的文件。 |\n| `-exec` | 启用本地程序执行。 |\n| `-force_empty_hrefless_a`\
  \ | 强制没有 `href` 属性的 `<a>` 元素为空。默认关闭。 |\n| `-force_html` | 强制将第一个文档解释为 HTML。默认关闭。\
  \ |\n| `-force_secure` | 要求 SSL cookie 使用安全标志（secure flag）。默认关闭。 |\n| `-forms_options`\
  \ | 使用基于表单的选项菜单。默认开启。 |\n| `-from` | 启用传输 From 头。默认开启。 |\n| `-ftp` | 禁用 FTP 访问。默认关闭。\
  \ |\n| `-get_data` | 从 STDIN 读取 get 表单的数据，以 `---` 结束。 |\n| `-head` | 发送 HEAD 请求。默认关闭。\
  \ |\n| `-help` | 打印用法信息。 |\n| `-hiddenlinks=option` | 指定如何处理隐藏链接。选项可以是 `merge`、`listonly`\
  \ 或 `ignore`。 |\n| `-historical` | 使用 `>` 代替 `-->` 作为注释的结束符。默认关闭。 |\n| `-homepage=URL`\
  \ | 设置独立于起始页的首页。 |\n| `-image_links` | 启用包含所有图像的链接。默认关闭。 |\n| `-index=URL` | 设置默认索引文件名。\
  \ |\n| `-ismap` | 当客户端存在 MAPs 时，包含 ISMAP 链接。默认关闭。 |\n| `-link=n` | 设置 `-crawl` 产生的\
  \ `lnk#.dat` 文件的起始计数。默认设置为 0。 |\n| `-localhost` | 禁用指向远程主机的 URL。默认关闭。 |\n| `-locexec`\
  \ | 仅从本地文件启用本地程序执行。默认关闭。 |\n| `-mime_header` | 包含 MIME 头并强制源导出。 |\n| `-minimal`\
  \ | 使用极简模式而非合法的注释解析。默认关闭。 |\n| `-nested_tables` | 使用嵌套表格逻辑。默认关闭。 |\n| `-newschunksize=n`\
  \ | 设置分块新闻列表中的文章数量。 |\n| `-newsmaxchunk=n` | 在分块之前设置列表中新闻文章的最大数量。 |\n| `-nobold`\
  \ | 禁用视频的粗体属性。 |\n| `-nobrowse` | 禁用目录浏览。 |\n| `-nocc` | 禁用针对邮件自抄副本的 Cc: 提示。默认关闭。\
  \ |\n| `-nocolor` | 禁用颜色支持。 |\n| `-noexec` | 禁用本地程序执行。默认开启。 |\n| `-nofilerferer`\
  \ | 禁用对文件 URL 传输 Referer 头。默认开启。 |\n| `-nolist` | 禁用导出中的链接列表功能。默认关闭。 |\n| `-nolog`\
  \ | 禁止向文档所有者发送错误消息。默认开启。 |\n| `-nonrestarting_sigwinch` | 使窗口大小变化处理程序变为非重启。默认关闭。\
  \ |\n| `-nopause` | 禁用状态行消息的强制暂停。 |\n| `-noprint` | 禁用某些打印函数，例如 `-restrictions=print`。默认关闭。\
  \ |\n| `-noredir` | 不跟随 Location: 重定向。默认关闭。 |\n| `-noreferer` | 禁用传输 Referer 头。默认关闭。\
  \ |\n| `-noreverse` | 禁用反转视频属性。 |\n| `-nostatus` | 禁用杂项信息消息。默认关闭。 |\n| `-nounderline`\
  \ | 禁用视频的下划线属性。 |\n| `-number_fields` | 强制对链接以及表单输入字段编号。默认关闭。 |\n| `-number_links`\
  \ | 强制对链接编号。默认关闭。 |\n| `-partial` | 在下载时显示部分页面。默认开启。 |\n| `-partial_thres=n` | 设置在用部分显示逻辑重新绘制显示之前渲染的行数。默认设置为\
  \ -1，这将禁用此功能。 |\n| `-pauth=id:pw` | 为受保护的代理服务器设置身份验证信息。 |\n| `-popup` | 通过弹出窗口处理单选\
  \ SELECT 选项而不是单选按钮列表。默认关闭。 |\n| `-post_data` | 从 STDIN 读取 post 表单的数据，以 `---` 结束。\
  \ |\n| `-preparsed` | 在 `-source` 和源视图中显示解析后的文本/html MIME 类型，以直观显示 Lynx 如何处理无效的\
  \ HTML。默认关闭。 |\n| `-prettysrc` | 在源视图中使用语法高亮和超链接处理。默认关闭。 |\n| `-print` | 启用打印函数，与\
  \ `-noprint` 相反。默认开启。 |\n| `-pseudo_inlines` | 对于没有 ALT 字符串的内联元素使用伪 ALT。默认开启。 |\n\
  | `-raw` | 使用 8 位字符翻译的默认设置或使用 CJK 模式作为启动字符集。默认关闭。 |\n| `-realm` | 限制访问起始域（realm）中的\
  \ URL。默认关闭。 |\n| `-reload` | 刷新代理服务器上的缓存（仅影响第一个文档）。默认关闭。 |\n| `-restrictions=options`\
  \ | 设置限制选项。使用不带参数的 `-restrictions` 查看列表。 |\n| `-resubmit_posts` | 当使用 `PREV_DOC`\
  \ 命令或从历史列表中请求方法为 POST 的表单返回的文档时，强制重新提交表单（无缓存）。默认关闭。 |\n| `-rlogin` | 禁用 rlogin 功能。默认关闭。\
  \ |\n| `-selective` | 要求通过 `.www_browsable` 文件来浏览目录。 |\n| `-short_url` | 启用在状态行中检查长\
  \ URL 的开头和结尾。默认关闭。 |\n| `-show_cursor` | 当设为关闭时，隐藏右下角的光标，否则显示光标。默认开启。 |\n| `-show_rate`\
  \ | 显示传输速率。默认开启。 |\n| `-soft_dquotes` | 使用旧版 Netscape 和 Mosaic  bug 仿真，该 bug 将 `>`\
  \ 视为双引号和标签的共同结束符。默认关闭。 |\n| `-source` | 将第一个 URL 的源码导出到 STDOUT 并退出。 |\n| `-stack_dump`\
  \ | 禁用 SIGINT 清理处理程序。默认关闭。 |\n| `-startfile_ok` | 配合 `-validate` 非 HTTP 起始页和首页。默认关闭。\
  \ |\n| `-stdin` | 从 STDIN 读取起始页。默认关闭。 |\n| `-tagsoup` | 使用 TagSoup 而非 SortaSGML\
  \ 解析器。默认关闭。 |\n| `-telnet` | 禁用 telnet 会话。默认关闭。 |\n| `-term=term` | 指定要仿真的终端类型。\
  \ |\n| `-tlog` | 当前会话使用 Lynx 跟踪日志。默认开启。 |\n| `-tna` | 使用文本字段激活模式（Textfields Need\
  \ Activation）。默认关闭。 |\n| `-trace` | 使用 Lynx 追踪模式。默认关闭。 |\n| `-trace_mask` | 自定义\
  \ Lynx 追踪模式。默认设置为 0。 |\n| `-traversal` | 遍历所有从起始页派生的 HTTP 链接。 |\n| `-trim_input_fields`\
  \ | 修剪表单中的输入文本/文本域字段。默认关闭。 |\n| `-underline_links` | 为链接使用下划线/粗体属性。默认关闭。 |\n| `-underscore`\
  \ | 在导出中使用下划线格式。默认关闭。 |\n| `-use_mouse` | 启用鼠标支持。默认关闭。 |\n| `-useragent=Name` |\
  \ 设置备用的 Lynx User-Agent 头。 |\n| `-validate` | 仅接受 http URL（用于验证），隐含的限制比 `-anonymous`\
  \ 更多，但允许 http 和 https 的重定向。默认关闭。 |\n| `-verbose` | 使用带有这些图像文件名的 `[LINK]`、`[IMAGE]`\
  \ 和 `[INLINE]` 注释。默认开启。 |\n| `-version` | 显示 Lynx 版本信息。 |\n| `-vikeys` | 启用类似 vi\
  \ 的按键移动。默认关闭。 |\n| `-width=n` | 设置导出格式化的屏幕宽度。默认为 80 列。 |\n| `-with_backspaces` |\
  \ 使用 `-dump` 或 `-crawl` 参数时在输出中产生退格符。默认关闭。 |\n\n\n\n\n\n如你所示，你可以直接从命令行控制几乎任何类型的\
  \ HTTP 或 HTML 设置。例如，如果你想使用 HTTP POST 方法向 Web 表单发布数据，只需将数据包含在 `-post-data` 参数中即可。如果你想将从网站接收的\
  \ cookie 存储在特殊位置，则使用 `-cookie_save_file` 参数。\n\n许多命令行参数定义了你在全屏模式下使用 `Lynx` 时的控制行为，允许你在浏览\
  \ Web 页面时自定义 `Lynx` 的行为。\n\n在正常浏览环境中，你通常会发现某些组命令行参数非常有用。与其每次使用 `Lynx` 时都必须在命令行中输入这些参数，不如\
  \ `Lynx` 提供了一个通用的配置文件，用于定义你使用 `Lynx` 时的基础行为。该配置文件将在下一节中讨论。\n\n# Lynx 配置文件\n\n`lynx`\
  \ 命令通过读取配置文件来设置其许多参数。默认情况下，该文件位于 `/usr/local/lib/lynx.cfg`，尽管你会发现许多 Linux 发行版将其更改了\
  \ `/etc` 目录（`/etc/lynx.cfg`）（而 Ubuntu 发行版将 `lynx.cfg` 文件放置在 `/etc/lynx-curl` 文件夹中）。\n\
  \n`lynx.cfg` 配置文件将相关参数分组，以便更易地查找参数。配置文件中条目的格式为：\n\n`PARAMETER:value`\n\n其中 `PARAMETER`\
  \ 是参数的全名（通常是大写字母，但并非总是），value 是与参数关联的值。\n\n查阅此文件，你会发现许多与命令行参数相似的参数，例如 `ACCEPT_ALL_COOKIES`\
  \ 参数，它等同于设置 `-accept_all_cookies` 命令行参数。\n\n还有几个功能相似但名称不同的配置参数。`FORCE_SSL_COOKIES_SECURE`\
  \ 配置文件参数可以被 `-force_secure` 命令行参数覆盖。\n\n然而，你也会发现相当多与命令行参数不匹配的配置参数。这些值只能从配置文件设置。\n\
  \n你无法在命令行设置的最常见的配置参数是用于代理服务器的。某些网络（尤其是企业网络）使用代理服务器作为客户端浏览器与目标网站服务器之间的中间人。客户端浏览器不再直接向远程\
  \ Web 服务器发送 HTTP 请求，而是将请求发送到代理服务器。代理服务器随后将请求发送到远程 Web 服务器，获取结果并将其传回给客户端浏览器。\n\n\
  虽然这看起来像是在浪费时间，但它是保护客户端免受网络危险的一项功能。代理服务器可以过滤不适当的内容和恶意代码，甚至可以检测用于互联网数据钓鱼计划的网站（伪装成他人以捕获客户数据的恶意服务器）。代理服务器还可以帮助减少互联网带宽消耗，因为它们缓存常用的\
  \ Web 页面并将其返回给客户端，而不是重新下载原始页面。\n\n用于定义代理服务器的配置参数为：\n\n- `http_proxy:http://some.server.dom:port/`\n\
  - `https_proxy:http://some.server.dom:port/`\n- `ftp_proxy:http://some.server.dom:port/`\n\
  - `gopher_proxy:http://some.server.dom:port/`\n- `news_proxy:http://some.server.dom:port/`\n\
  - `newspost_proxy:http://some.server.dom:port/`\n- `newsreply_proxy:http://some.server.dom:port/`\n\
  - `snews_proxy:http://some.server.dom:port/`\n- `snewspost_proxy:http://some.server.dom:port/`\n\
  - `snewsreply_proxy:http://some.server.dom:port/`\n- `nntp_proxy:http://some.server.dom:port/`\n\
  - `wais_proxy:http://some.server.dom:port/`\n- `finger_proxy:http://some.server.dom:port/`\n\
  - `cso_proxy:http://some.server.dom:port/`\n- `no_proxy:host.domain.dom`\n\n你可以为\
  \ `Lynx` 支持的任何网络协议定义不同的代理服务器。`NO_PROXY` 参数是一个由逗号分隔的列表，列出了你希望直接访问而不使用代理服务器的网站。这些通常是不需要过滤的内部网站。\n\
  \n# Lynx 环境变量\n\n如你从丰富的命令行选项和配置文件参数中所看到的，`Lynx` 程序具有极高的定制性。然而，定制并不仅于此。你可以使用环境变量覆盖许多配置文件参数。如果你在一个没有权限访问\
  \ `lynx.cfg` 配置文件的环境中工作，你可以通过设置本地环境变量来覆盖某些默认参数。表 24.2 列出了在受限环境中使用 `Lynx` 时可能需要的常用\
  \ Lynx 环境变量。\n\n### 表 24.2 Lynx 环境变量\n\n| 变量 | 说明 |\n| :--- | :--- |\n| `LYNX_CFG`\
  \ | 指定备配置文件的位置。 |\n| `LYNX_LSS` | 指定默认 Lynx 字符集样式表的位置。 |\n| `LYNX_SAVE_SPACE` |\
  \ 指定文件保存到磁盘的位置。 |\n| `NNTPSERVER` | 指定用于检索和发布 USENET 新闻的服务器。 |\n| `PROTOCOL_PROXY`\
  \ | 覆盖指定协议的代理服务器。 |\n| `SSL_CERT_DIR` | 指定包含访问信任站点所需的信任证书的目录。 |\n| `SSL_CERT_FILE`\
  \ | 指定包含你的信任证书的文件。 |\n| `WWW_HOME` | 定义 Lynx 启动时使用的默认 URL。 |\n\n在运行 `Lynx` 程序之前，你像设置任何其他环境变量一样设置这些环境变量：\n\
  \n```bash\n$ http_proxy=http://myproxy.com:8080\n$ lynx\n```\n\n要指定代理服务器，你必须提供协议、服务器名称以及与代理服务器通信的端口。如果你需要设置此变量，通常建议将其包含在\
  \ shell 的常用启动文件中（例如 `bash` shell 的 `.bashrc` 文件），这样你就不需要每次都输入它。\n\n# 从 Lynx 捕获数据\n\
  \n当你在 shell 脚本中使用 `Lynx` 时，你可能正尝试从 Web 页面获取特定的某部分（或部分）信息。实现这一目标的技术称为屏幕爬取（screen\
  \ scraping）。在屏幕爬取中，你正试图通过程序找到图形屏幕上特定位置的数据，以便将其捕获并在你的 shell 脚本中使用。\n\n使用 `lynx` 执行屏幕爬取的简单方法是使用\
  \ `-dump` 选项。该选项不会尝试在终端屏幕上显示 Web 页面，而是将 Web 页面的文本数据直接输出到 `STDOUT`：\n\n```bash\n\
  $ lynx -dump http://localhost/RecipeCenter/\n```\n\nRecipe Center\n“就像妈妈做的一样”\n\
  欢迎\n   [1]首页\n   [2]登录发布\n   [3]免费注册登录\n   _________________________________________\n\
  \   [4]发布新食\n\n每个链接都由标签数字标识，`Lynx` 在 Web 页面数据之后显示所有标签引用的列表。\n\n一旦获取了 Web 页面的所有文本数据，你可能知道我们要从工具箱中拿出哪些工具来开始提取数据的工作了。没错，我们的老朋友\
  \ `sed` 和 `gawk` 程序（见第 18 章）。\n\n首先，让我们找一些有趣的数据来收集。雅虎天气 Web 页面是查找世界各地当前天气状况的佳来源。每个位置使用单独的\
  \ URL 来显示该城市的天气信息（你可以通过普通浏览器访问网站并输入你的城市信息找到对应城市的特定 URL）。查找伊利诺伊州芝加哥天气的 `lynx` 命令是：\n\
  \n```bash\n$ lynx -dump http://weather.yahoo.com/united-states/illinois/chicago-2379574/\n\
  ```\n\n\n\n\n\n此命令从网页上转储大量数据。第一步是找到你需要的精确信息。为了做到这一点，将 `lynx` 命令的输出重定向到文件，然后在该文件中搜索你的数据。在执行上述命令后，我们在输出文件中发现了以下文本：\n\
  \n```\nCurrent conditions as of 1:54 pm EDT\nMostly Cloudy\n    Feels Like:\n  \
  \        32 °F\n    Barometer:\n          30.13 in and rising\n    Humidity:\n \
  \         50%\n    Visibility:\n          10 mi\n    Dewpoint:\n          15 °F\n\
  \    Wind:\n          W 10 mph\n```\n这基本上就是你需要的关于当前天气的所有信息了。这个输出中有一个小问题：你会发现数字在标题下方的行中。尝试直接提取单个数字将很困难。第\
  \ 18 章讨论了如何处理此类问题。\n\n解决这一问题的关键在于编写一个 `sed` 脚本，该脚本可以先搜索数据标题。当你找到它时，就可以跳转到正确的行提取数据。在这个例子中，我们很幸运，因为我们需要的所有数据都单独成一行。我们应该能够仅通过\
  \ `sed` 脚本解决这个问题。如果同一行中还有其他文本，我们就需要调用 `gawk` 工具来过滤出我们需要的数据。\n\n首先，你需要创建一个 `sed`\
  \ 脚本来查找 `Current conditions` 文本，然后跳转到下一行获取描述当前天气状况的文本，并将其打印出来。它的样子如下：\n\n```bash\n\
  $ cat sedcond\n/Current conditions/{\nn\np\n}\n```\n地址指定查找所需文本的行。如果 `sed` 命令找到了它，`n`\
  \ 命令会跳到下一行，然后 `p` 命令打印该行的内容，即描述该城市当前天气状况的文本。\n\n接下来，你需要另一个 `sed` 脚本，它可以搜索 `Feels\
  \ Like:` 文本，然后跳转到下一行打印温度：\n\n```bash\n$ cat sedtemp\n/Feels Like:/{\nn\np\n}\n```\n\
  完美。现在，你可以在一个 shell 脚本中使用这两个 `sed` 脚本，脚本首先将网页的 `lynx` 输出捕获到临时文件中，然后将这两个 `sed` 脚本应用于网页数据，以仅提取你正在寻找的数据。以下是如何操作的示例：\n\
  \n```bash\n$ cat weather\n#!/bin/bash\n\n# 提取伊利诺州芝加哥的当前天气\nURL=\"http://weather.yahoo.com/united-states/illinois/chicago-2379574/\"\
  \nLYNX='which lynx'\nTMPFILE='mktemp tmpXXXXXX'\n$LYNX -dump $URL > $TMPFILE\nconditions='cat\
  \ $TMPFILE | sed -n -f sedcond'\ntemp='cat $TMPFILE | sed -n -f sedtemp'\nrm -f\
  \ $TMPFILE\necho \"Current conditions: $conditions\"\necho \"The current temp outside\
  \ is: $temp\"\n$ ./weather\nCurrent conditions: Mostly Cloudy\nThe current temp\
  \ outside is: 32 °F\n$\n```\n该天气脚本连接到目标城市的 Yahoo 天气网页，将网页保存到临时文件，提取相应的文本，删除临时文件，然后显示天气信息。这种做法之处在于，一旦你从网站提取了数据，你就可以对其进行任何操作，例如创建温度表。然后你可以创建一个\
  \ `cron` 任务（见第 15 章），每天运行一次以跟踪每日温度。\n\n### 注意事项\n互联网是一个动态的地方。如果你花费了几个小时确定网页上数据的精确位置，结果在几周后发现它已经移动了，导致你的脚本失效，请不要感到意外。事实上，当你读到这本书时，这个例子可能已经无法工作了。重要的是掌握从网页中提取数据的流程，然后你就可以将该原理应用于任何情况。\n\
  \n## cURL 程序\n`Lynx` 的流行催生另一个类似的产品，称为 `cURL`。`cURL` 程序允许你从命令行使用指定的 URL 自动传输文件。它目前支持\
  \ URL 中指定的 FTP, FTPS, HTTP, HTTPS, SCP, SFTP, TFTP, telnet, DICT, LDAP, LDAPS 和\
  \ FILE 协议。\n\n虽然 `cURL` 本身并不作为网页浏览器使用，但它允许你通过一个简单的命令，直接从命令行或你的 shell 脚本无人无人地发送或检索数据。这为你的\
  \ shell 脚本工具箱提供了一个非常棒的工具。\n\n本节将带你了解如何在 shell 脚本中安装和使用 `cURL`。\n\n### 注意事项\n还有一种名为\
  \ `curl` 的编程语言，由 Sumisho Computer System Corporation 拥有并销售。不要将 `cURL` 与 `curl` 编程语言混淆。\n\
  \n## 安装 cURL\n随着其流行度的提高，`cURL` 在许多 Linux 发行版中默认安装。在 Ubuntu 中，你必须从软件仓库手动安装它。只需使用此命令：\n\
  \n```bash\n$ sudo apt-get install curl\n```\n如果你的 Linux 发行版没有 `cURL`，或者你只想使用最新版本，可以从\
  \ `curl.haxx.se` 网站下载源代码并在你的 Linux 系统上编译。\n\n再次，适用标准免责声明；你必须在 Linux 系统上安装 C 开发库才能使其工作。\n\
  \n下一节将描述如何从命令行使用 `curl` 程序。\n\n## 使用 cURL 探索\n默认情况下，`cURL` 将网页的完整 HTML 代码返回到标准输出（STDOUT）：\n\
  \n```bash\n$ curl http://www.google.com\n<!doctype html><html><head><meta http-equiv=\"\
  content-type\" content=\"text/html; charset=ISO-8859-1\"><title>Google</title>\n\
  [ listing truncated ]\n```\n与 `Lynx` 程序一样，你可以使用标准的 shell 脚本技术从转储的网页中提取单个数据元素。\n\n\
  我们喜欢使用 `cURL` 批量下载文件。如今，我们似乎在不断下载最新的 Linux 发行版 ISO 文件。因为 ISO 文件非常大，我们需要开始下载并在下载期间离开。一旦我们知道了\
  \ URL，我们就可以创建一个简单的 shell 脚本来自动化这一过程：\n\n```bash\n$ cat downld\n#!/bin/bash\n\n#\
  \ 自动下载最新的 cURL 文件\ncurl -s -o /home/rich/curl-18.0.tar.gz http://curl.haxx.se/download/curl-18.0.tar.gz\n\
  $\n```\n`-s` 命令行选项将 `curl` 置于静默模式，不向 STDOUT 发任何数据。`-o` 命令行选项将输出重定向到文件。虽然你从列表中无法看出，但脚本中的\
  \ `curl` 命令是一整行。这个简单的脚本直接从 cURL 网站下载文件。你现在可以使用 `at` 或 `cron` 命令（见第 15 章）安排下载在你不使用电脑的晚上进行下载。\n\
  \n## 使用 zsh 进行网络配置\n第 22 章描述了 `zsh` shell 中提供的所有功能。`zsh` shell 是适用于 Linux 和 Unix\
  \ 环境的较新 shell。`zsh` shell 的功能之一是插件模块。与其尝试将许多功能整合到 `zsh` shell 核心中，`zsh` shell 使用专用模块，因此你可以根据需要选择加载的命令。其中一个模块就是\
  \ TCP 模块。\n\n### TCP 模块\nTCP 模块为大量的网络功能提供了内置命令。若要在 `zsh` shell 中安装 TCP 模块，请执行以下操作：\n\
  \n```zsh\n% zmodload zsh/net/tcp\n```\n\n\n\n\n在 shell 中安装模块库的操作就此结束！如果你在 shell\
  \ 脚本中使用 TCP 模块，请记住在脚本中包含此行。该模块仅适用于当前 shell。\n\n一旦加载了 TCP 模块，你就可以使用 `ztcp` 命令了。`ztcp`\
  \ 命令的格式如下：\n\n```\nztcp [-acflLtv] [ -d fd] [args]\n```\n\n可用的命令行选项有：\n\n* `-a`:\
  \ 接受新连接。\n* `-c`: 关闭现有连接。\n* `-d`: 为连接使用指定的文件描述符。\n* `-f`: 强制关闭连接关闭。\n* `-l`: 打开一个新的\
  \ socket 进行监听。\n* `-L`: 列出当前已连接的 socket。\n* `-t`: 如果没有待处理的连接，则退出。\n* `-v`: 显示有关连接的冗长信息。\n\
  \n`ztcp` 命令使用文件描述符与打开的 TCP 连接进行交互。默认情况下，zsh 使用环境变量 `$RESULT` 来引用文件描述符。你只需要向 `$RESULT`\
  \ 变量指定的句描述符发送数据，TCP 模块就会将其转发到远程主机。同样，如果远程主机向你发送任何数据，你只需要从 `$RESULT` 变量指定的句描述符中读取即可。网络编程没有比这更简单的了！\n\
  \n## 客户端/服务器范式\n\n在深入学习使用 zsh shell 创建客户端/服务器程序之前，最好了解客户端和服务器程序具体是如何运行的。显然，它们在连接和传输数据方面承担着不同的责任。\n\
  \n服务器程序监听网络上来自客户端的请求。客户端向服务器发起连接请求。一旦服务器接受了连接请求，每个设备就都有了一个双向通信通道，用于发送和接收数据。这一过程如图\
  \ 24.2 所示。\n\n图 24.2 客户端/服务器通信图\n\n![24.2](img/c24f002.jpg)\n\n如你从图 24.2 中所示，服务器在与客户端通信之前必须执行两个功能。首先，它必须设置一个特定的\
  \ TCP 端口来监听传入的请求。当连接请求进来时，它必须接受该连接。\n\n客户端的责任要简单得多。它只需尝试连接到服务器正在监听的特定 TCP 端口。如果服务器接受了连接，双向通信即可可用并可以发送数据。\n\
  \n一旦服务器和客户端之间建立了连接，两个设备之间必须使用某种通信过程（或规则）。如果两个设备都尝试同时监听消息，它们将发生死锁，什么也不会发生。同样，如果它们都尝试同时发送消息，也将无法完成任何操作。\n\
  \n作为网络编程员，你的工作是决定你的客户端和服务器程序必须遵循的协议规则。\n\n## 使用 zsh 进行客户端/服务器编程\n\n为了演示使用 `ztcp`\
  \ 创建客户端/服务器程序，让我们建立一个简单的网络应用程序。我们将创建的服务器程序将在 TCP 端口 5150 上监听连接请求。当连接请求进来时，服务器将接受它并向客户端发送一条欢迎消息。\n\
  \n然后，服务器程序将等待接收客户端的消息。如果它收到了消息，服务器将显示该消息，并将相同的消息发回给客户端。发送消息后，服务器将循环监听另一条消息。此循环将一直持续，直到服务器收到内容为\
  \ exit 的消息。当这种情况发生时，服务器将终止会话。\n\n我们将创建的客户端程序将向 TCP 端口 5150 服务器发送连接请求。一旦建立连接，客户端需要接收服务器的欢迎消息。\n\
  \n接收消息后，客户端会显示它，然后询问用户要发送到服务器的数据。从用户处获取消息后，客户端程序将其发送到服务器并等待接收返回的消息。如果消息返回，客户端将显示该消息并循环向用户请求另一个消息。此循环将一直持续直到用户输入文本\
  \ exit。当发生时，客户端将退出文本发送到服务器并终止会话。\n\n接下来的章节将展示服务器和客户端程序。\n\n### 服务器程序\n\n这是服务器程序的代码：\n\
  \n```bash\n% cat server\n#!/bin/zsh\n\n# zsh TCP 服务器脚本\nzmodload zsh/net/tcp\n\n\
  ztcp -l 5150\n\nfd=$REPLY\n\necho “Waiting for a client…”\nztcp -a $fd\n\nclientfd=$REPLY\n\
  echo “client connected”\necho “Welcome to my server” > $clientfd\nwhile [ 1 ]\n\
  do\n    read line < $clientfd\n    if [[ $line = “exit” ]]\n    then\n      break\n\
  \    else\n      echo Received: $line\n      echo $line > $clientfd\n    fi\ndone\n\
  echo “Client disconnected session”\nztcp -c $fd\nztcp -c $clientfd\n%\n```\n\n服务器程序遵循图\
  \ 24.2 所示的客户端/服务器范式。它首先使用 `-l` 参数在指定的端口（5150）上监听。变量 `$RESULT` 包含 Linux 系统返回的标识连接的文件描述符。服务器使用\
  \ `-a` 参数接受新的连接请求。此命令等待连接请求到来（阻塞）。每个连接使用独立的监听端口的文件符。这允许你根据需要维护客户端连接。\n\n接受连接后，服务器将欢迎消息重定向到客户端的文件描述符：\n\
  \n```bash\necho “Welcome to my server” > $clientfd\n```\n\nzsh shell 模块处理所有机械机制，确保数据发送到客户端。接下来，服务器程序进入一个无限循环。它使用\
  \ `read` 命令等待从客户端返回数据：\n\n```bash\nread line < $clientfd\n```\n\n如果客户端丢失了连接，此命令也会阻塞脚本的执行。为了防止这个问题，你可以在\
  \ `read` 命令中使用 `-t` 选项来指定超时值（秒）。如果服务器在超时时间内没有从客户端接收到数据，它将继续执行。\n\n如果服务器从客户端接收到数据，它将数据显示在\
  \ STDOUT 上，然后将其发回客户端。如果数据等于文本 `exit`，服务器将退出循环，并使用 `ztcp` 中的 `-c` 参数关闭客户端的文件描述符和监听端口的文件描述符。如果你希望服务器监听另一个连接，可以在关闭客户端的文件描述符后循环。\n\
  \n### 客户端程序\n\n这是客户端脚本的代码：\n\n```bash\n% cat client\n#!/bin/zsh\n\n# zsh TCP 客户端程序\n\
  zmodload zsh/net/tcp\n\nztcp localhost 5150\n\nhostfd=$REPLY\nread line < $hostfd\n\
  echo $line\n\nwhile [ 1 ]\ndo\n    echo -n “Enter text: ”\n    read phrase\n   \
  \ echo Sending $phrase to remote host…\n    echo $phrase > $hostfd\n    if [[ $phrase\
  \ = “exit” ]]\n    then\n      break\n    fi\n    read line < $hostfd\n    echo\
  \ “  Received: $line”\ndone\nztcp -c $hostfd\n%\n```\n\n客户端程序必须指定服务器程序运行系统的 IP 地址（或主机）以及服务器正在监听的正确\
  \ TCP 端口号。一旦服务器接受连接，`ztcp` 程序设置连接的文件描述符并将值保存在变量 `$REPLY` 中。客户端程序读取服务器的欢迎消息并将其显示：\n\
  \n```bash\nread line < $hostfd\necho $line\n```\n\n\n\n\n接下来，客户端程序进入一个 while 循环，查询用户想要发送到服务器的文本，读取输入的文本并将其发送到服务器。发送文本后，它会检查输入的文本是否为\
  \ `exit`。如果是，它将跳出循环并关闭文件描述符，从而关闭 TCP 连接。如果文本不是 `exit`，它将等待服务器的响应并显示。\n\n## 运行程序\n\
  \n你可以在网络上的两个独立 Linux 系统上运行这些程序，也可以在同一系统的两个不同终端会话中运行它们。你必须先启动服务器程序，以便在客户端启动时它能够监听传入的连接：\n\
  \n```bash\n./server\n```\n\n等待客户端连接…\n\n然后你可以启动客户端：\n\n```bash\n./client\nWelcome\
  \ to my server\nEnter text: test\nSending test to remote host…\n    Received: test\n\
  ```\n\n当客户端连接成功时，你将在服务器上看到这些内容：\n\n```text\nclient connected\nReceived: test\n```\n\
  \n这将会持续进行，直到用户在客户端输入文本 `exit`：\n\n```bash\nEnter text: exit\nSending exit to remote\
  \ host…\n%\n```\n\n然后你应该能看到服务器自动退出：\n\n```text\nClient disconnected session\n%\n\
  ```\n\n你现在已经有了一个完整网络程序的雏形！通过 `zsh` shell 和 `TCP` 模块，可以轻松地在运行于网络不同系统的 shell 脚本之间发送数据。\n\
  \n## 总结\n\n本章带你了解了 shell 脚本与互联网交互的世界。实现这一目标最流行的工具之一是 `Lynx` 程序。`Lynx` 是一个命令行程序，可以在终端会话中使用文本模式图形显示网站信息。除了该功能外，`Lynx`\
  \ 还提供了一种从网站获取原始数据并将其显示到 `STDOUT`的方法。你可以使用 `Lynx` 从网站提取数据，然后使用标准的 Linux 文本处理工具（如\
  \ `sed` 和 `gawk`）解析数据以查找特定信息。\n\n`cURL` 程序是与互联网交互时的另一个实用工具。`cURL` 程序还允许你从网站导出数据，并提供了一种轻松编写从许多不同类型的服务器下载文件的方法。\n\
  \n最后，本章向你展示了如何使用 `zsh` shell 的 `TCP` 模块编写自己的网络程序。`zsh` shell 为位于网络上不同系统的 shell 脚本之间的通信提供了一种简单的方法。\n\
  \n在下一章中，我们将研究如何在 shell 脚本中使用电子邮件。通常当你使用 shell 脚本实现过程自动化时，如果能收到一条指示过程成功或失败的消息，会非常有用。通过了解如何使用系统上安装的电子邮件软件，你可以轻松地向世界上任何地方发送自动化消息。\n\
  \n## 第 25 章：使用电子邮件\n\n### 本章内容摘要\n\n- 电子邮件与 Linux\n- 设置电子邮件服务器\n- 发送简单消息\n- 使用 `Mutt`\
  \ 使用附件\n\n随着电子邮件的普及，如今几乎每个人都有一个电子邮件地址。正因如此，人们通常期望通过电子邮件接收数据，而不是查看文件或打印输出。在 shell\
  \ 脚本世界中也是如此。如果你从 shell 脚本生成了任何种类的报告，很可能在某个时刻会被要求将结果通过电子邮件发送给某人。本章向你展示如何配置 Linux\
  \ 系统以直接从 shell 脚本发送电子邮件。它还向你展示了如何确保你的 Linux 系统可以发送外邮件，以及如何确保你有一个可以从命令行执行此操作的邮件客户端。首先，本章将简要概述\
  \ Linux 处理电子邮件的方式。\n\n## Linux 电子邮件基础\n\n有时，在 shell 脚本中使用电子邮件最困难的部分是理解 Linux 电子邮件系统是如何工作的。了解哪些软件包执行特定任务，对于将电子邮件从你的\
  \ shell 脚本发送到收件箱（`Inbox`）关重要。本节将带你了解 Linux 系统使用电子邮件的基础知识，以及在使用之前需要准备就的条件。\n\n###\
  \ Linux 中的电子邮件\n\nUnix 操作系统的主要目标之一是软件模块化。Unix 开发者没有创建一个处理某个功能所需所有部分的单体式程序，而是创建了多个较小的程序，每个程序处理系统总功能中的较小部分。\n\
  \n这种哲学被应用于实现 Unix 中使用的电子邮件系统，并一直延续到 Linux 环境。在 Linux 中，电子邮件功能被分为不同的部分，每个部分分配给不同的程序。[图\
  \ 25.1] 显示了大多数开源电子邮件软件如何在 Linux 环境中将电子邮件功能模块化。\n\n![25.1](img/c25f001.jpg)\n\n正如[图\
  \ 25.1] 所示，在 Linux 环境中，电子邮件过程通常分为三个功能：\n\n- 邮件传输代理 (MTA)\n- 邮件投递代理 (MDA)\n- 邮件用户代理\
  \ (MUA)\n\n这三个功能之间的界限通常是模糊的。某些电子邮件软件包结合了 `MDA` 和 `MTA` 的的功能，而另一些则结合了 `MDA` 和 `MUA`\
  \ 功能。后续章节将详细描述这些基础电子邮件组件以及它们在 Linux 系统中的实现方式。\n\n### 邮件传输代理\n\n`MTA` 软件是 Linux 电子邮件系统的核心。它负责处理系统中的传入和传出邮件。对于每封传出的邮件，`MTA`\
  \ 必须确定收件者地址的目标。如果目标主机是本地系统，`MTA` 可以直接投送到本地信箱，或将消息传递给本地 `MDA` 进行投递。\n\n然而，如果目标主机是远程邮件服务器，`MTA`\
  \ 必须与远程主机上的 `MTA` 软件建立通信链路以传输消息。`MTA` 软件包有两种常用方法向远程主机交付邮件：\n\n- 直接投递\n- 代理投递\n\n\
  如果你的 Linux 系统直接连接到互联网，它通常可以将指向远程主机接收者的消息直接发送到远程主机。`MTA` 软件使用域名系统 (`DNS`) 解析正确的网络\
  \ IP 地址以投递邮件消息，然后使用简单邮件传输协议 (`SMTP`) 建立网络连接。\n\n很多时候，主机并没有直接连接到互联网，或者它不想与其他远程主机直接通信。在这些情况下，通常使用智能主机（smart\
  \ host）。智能主机是一个代理服务器，接受来自 Linux 系统的邮件消息，然后尝试直接将其投递给目标接收者。\n\n> **注意**\n> 由于垃圾邮件的影响，智能主机在互联网上变得越来越难以处理。恶意服务器可以通过从智能主机退回成千上万封未经请求的商业邮件\
  \ (UCE) 来隐藏其身份。大多数智能主机现在在将消息转发到其他主机之前需要某种类型的身份验证。\n\n对于传入的消息，`MTA` 必须能够接受远程邮件服务器的连接请求，并接收指向本地用户的消息。再次，用于此过程的最常用协议是\
  \ `SMTP`。\n\nLinux 环境有许多不同类型的开源 `MTA` 程序。每个程序都提供了与其他程序区别的不同功能。到目前为止，你会遇到最受欢迎的两个是：\n\
  \n- `sendmail`\n- `Postfix`\n\n我们将在“设置你的服务器”部分详细检查这两个电子邮件 `MTA` 软件包。\n\n### 邮件投递代理\n\
  \n\n\n\nMDA 程序的职责是交付发送给本地用户的消息。它从 MTA 程序接收消息，并必须准确确定这些消息应该如何以及在何处投递。图 25.2 展示了 MDA\
  \ 程序如何与 MTA 程序交互以投递邮件。\n\n图 25.2 在邮件服务器上使用 MDA 程序]\n\n![25.2](img/c25f002.jpg)\n\
  \n虽然 MDA 功能有时会在 MTA 程序内部执行，但 Linux 电子邮件实现通常依赖于一个独立的单独 MDA 程序来将消息交付给本地用户。由于这些 MDA\
  \ 程序专门专注于向本地用户投递邮件，因此可以添加一些在包含 MDA 功能的 MTA 程序中不具备的额外功能。这使得邮件管理员能够为用户提供额外的邮件功能，例如垃圾邮件过滤、办公室外自动重定向和邮件自动排序。\n\
  \n当 MDA 程序接收到消息时，它必须确保消息被投送到正确的位置，要么是本地用户的邮箱箱，要么是本地用户定义的替代位置。\n\n目前 Linux 系统上常用的有三种类型的用户邮箱箱：\n\
  \n* `/var/spool/mail` 或 `/var/mail` 文件\n* `$HOME/mail` 文件\n* Maildir 风格的邮箱箱目录\n\n\
  每种邮箱箱类型都有其吸引人胜的特性。大多数 Linux 发行版使用 `/var/spool/mail` 或 `/var/mail` 目录来包含单个邮箱箱文件，系统中的每个用户账户对应一个文件。这是一个所有邮箱箱文件的中心位置，以便\
  \ MUA 程序知道去哪里找到每个人的邮箱箱文件。\n\n少数 Linux 发行版允许你将单个邮箱箱文件移动到每个用户的 `$HOME` 目录。这提供了更高的安全性，因为每个邮箱箱文件都位于已设置好适当访问权限的区域。\n\
  \nMaildir 风格的邮箱箱是一项较新的功能，由一些更高级的 MTA、MDA 和 MUA 支持。每条消息不再是邮箱箱文件的一部分，邮箱箱是一个目录，每条消息都是该目录中的一个独立文件。这有助于减少邮箱箱损坏，因为单条消息不会损坏整个邮箱箱。\n\
  \n虽然 Maildir 风格的邮箱箱目录提供了更高的性能、安全性和容错能力，但有很多流行的 MDA 和 MUA 程序无法使用它们。几乎所有的 MDA 和 MUA\
  \ 程序都可以使用 `/var/spool/mail` 邮箱箱文件。\n\n### 注意\n\nUnix 的原始邮箱箱位置是 `/var/spool/mail`。大多数\
  \ Linux 发行版使用这种文件命名约定；然而，也有少数 Linux 发行版使用 `/var/mail`。\n\n如果你的系统确实使用特殊的 MDA 程序来处理入站邮件消息，那么很可能是流行的\
  \ `Procmail` 程序。`Procmail` 允许每个独立用户创建一个自定义的配置文件来定义邮件过滤器、办公室外投地地址和独立的邮箱箱。\n\n## 邮件用户代理\
  \ (MUA)\n\n到目前为止，我们跟踪了从远程主机到本地主机再到单个用户邮箱箱的电子邮件流量。该过程的下一步是允许单个用户查看他们的电子邮件消息。\n\n\
  Linux 电子邮件模型为每个用户使用本地邮箱箱文件或目录来存放该用户的消息。`MUA` 程序的任务是为用户提供一种与其邮箱箱交互以读取消息的方法。\n\n重要的是记住，`MUA`\
  \ 并不接收消息；它们只显示已经位于邮箱箱中的消息。许多 `MUA` 程序还提供了创建单独邮件文件夹的功能，以便用户可以将邮件从默认邮箱箱（通常称为 `Inbox`\
  \ 收件箱）移动到单独文件夹进行分类。\n\n大多数 `MUA` 程序还提供发送消息的能力。这部分有点模糊，因为正如你已经看到的，发送电子邮件消息是 `MTA`\
  \ 程序的任务。\n\n为了执行此功能，大多数 `MUA` 程序利用 `SMTP` 中的智能主机（smart host）功能。要么是 `MUA` 程序自动将消息交付给本地\
  \ `MTA` 程序进行投递，要么你必须在 `MUA` 配置中定义一个远程智能主机以便其发送消息进行交付。\n\n多年来，Linux 平台提供了许多不同的开源\
  \ `MUA` 程序。接下来的章节描述了你在 Linux 中会遇到的一些流行的 `MUA` 程序。\n\n### Mailx\n\n`Mailx` 程序是 Linux\
  \ 环境下最常用的命令行 `MUA` 程序。在所有安装中，`Mailx` 程序都同可执行文件 `mail` 一起安装，表明它是 `mail` 程序的替代品，而不是一个独立的程序。\n\
  \n### 注意\n\n面向图形桌面的 Linux 发行版（如 `Ubuntu` 和 `openSUSE`）默认不安装命令行 `Mailx` 程序。你必须手动安装它（见第\
  \ 8 章）作为邮件客户端包的一部分。然而，你必须小心，因为并不是所有的 Linux 邮件包都是一样的。对于 `Ubuntu`，该包名为 `mailutils`，它使用的是\
  \ `GNU Mailutils` 包而不是 `Mailx`。它提供了相同的功能，但命令行参数略有不同。\n\n`Mailx` 程序允许用户通过命令行访问其邮箱箱以读取存储的消息，并向其他邮件用户发送消息。这是一个\
  \ `Mailx` 会话示例：\n\n```\n$ mail\n\n“/var/mail/rich”: 2 messages new\n\n>N    1 Rich\
  \ Blum            Thu Dec  9 10:07  13/579   Test message\n\n  N    2 Rich Blum\
  \            Thu Dec  9 10:08  13/593   This is another test\n\n? 1\n\nReturn-Path:\
  \ <rich@Parallels-platform>\n\nX-Original-To: rich@Parallels-platform>\n\nDelivered-To:\
  \ rich@Parallels-platform\n\nReceived: by Parallels-platform (Postfix, from userid\
  \ 1000)\n         id 5C03F260CF; Thu,  9 Dec 2010 10:07:48 -0500 (EST)\n\nTo: <rich@Parallels-platform>\n\
  \nSubject: Test message\n\nX-Mailer: mail (GNU Mailutils 2.1)\n\nMessage-Id: <20101209150748.5C03F260CF@rich-Parallels-platform>\n\
  \nDate: Thu,  9 Dec 2010 10:07:48 -0500 (EST)\n\nFrom: rich@Parallels-platform (Rich\
  \ Blum)\n\nThis is a test message\n\n? d\n\n? q\n\nHeld 1 message in /var/mail/rich\n\
  \n$ \n```\n\n第一行显示执行了没有命令行选项。默认情况下，这允许用户检查他的邮箱箱。输入 `mail` 命令后，会显示邮箱箱中所有消息的摘要。`Mailx`\
  \ 程序只能读取 `/var/mail` 格式或 `$HOME/mail` 格式的消息。\n\n每个用户都有一个包含其所有消息的的文件。对于某些 Linux 发行版，在用户账户接收消息之前，邮箱文件不存在。文件名通常是用户的系统登录名，位于系统邮箱目录中。因此，用户\
  \ `rich` 的所有消息都存储在 Linux 系统的 `/var/mail/rich` 文件中。当收到新消息时，会被追加到文件末尾。\n\n你也可以使用 `mail`\
  \ 命令行程序发送邮件：\n\n```\n$ mail barbara\n\nCc: \n\nSubject: This is a test sent to Barbara\n\
  \nHello Barbara -\n\nThis is a test message I'm sending from the command line.\n\
  \n$ \n```\n\n接收者的名称包含在命令行程序名后面。`Mailx` 程序查询任何要发送副本的地址（CC: 提示）和邮件主题。然后允许你输入消息正文。要结束消息，按\
  \ Ctrl+D。然后 `Mailx` 程序尝试将消息传递给 `MTA` 程序进行投递。\n\n### Mutt\n\n\n\n\n随着 Unix 环境的进步，MUA（用户代理代理）程序变得越来越复杂。Unix\
  \ 系统上图形化的早期尝试之一是使用 `ncurses` 图形库。使用 `ncurses`，程序可以控制终端屏幕上光标的位置，并在终端的任何位置放置字符。\n\n\
  一个利用 `ncurses` 库的 MUA 程序是 `Mutt` 程序。当你启动 `Mutt` 时，它会在终端显示器上绘制一个友好的菜单，列出的消息类似于 `Mailx`\
  \ 程序的输出。你可以选择一条消息并在显示中查看，如图 25.3 所示。\n\n图 25.3 Mutt 程序\n\n![25.3](img/c25f003.jpg)\n\
  \n`Mutt` 程序使用组合键组合来执行标准功能，例如读取消息和开始新消息。对于 shell 脚本程序员来说，可能最有用的功能是直接从命令行发送消息，而无需进入文本图形模式。我们将在后的“Mutt\
  \ 程序”章节中详细详细介绍 `Mutt` 程序。\n\n## 图形化电子邮件客户端\n\n几乎所有的 Linux 系统都支持图形化的 X Window 环境。有很多利用\
  \ X Window 系统显示消息信息的电子邮件 MUA 程序。目前最流行的两种图形化 MUA 程序是：\n\n*   用于 KDE 窗口环境的 `KMail`\n\
  *   用于 GNOME 窗口环境的 `Evolution`\n\n这些软件包都允许你与本地 Linux 邮箱箱进行交互，并连接到远程邮件服务器读取邮件消息。图\
  \ 25.4 显示了一个 Evolution 会话屏幕示例。\n\n图 25.4 Evolution MUA 程序主界面\n\n![25.4](img/c25f004.jpg)\n\
  \n为了连接到远程服务器，`KMail` 和 `Evolution` 都支持邮局协议 (POP) 和更高级的互联网消息访问协议 (IMAP)。虽然 `KMail`\
  \ 和 `Evolution` MUA 程序对于桌面版 Linux 非常出色，但在 shell 脚本中并不那么实用。\n\n## 设置你的服务器\n\n在开始向世界发送你的自动化电子邮件之前，你需要确保你的\
  \ Linux 系统运行着 MTA（邮件传输代理）软件包，并且其配置正确。这本身并不是一项容易的任务，但幸运的是，某些 Linux 发行版提供了一些基本工具来帮助你。\n\
  \n本节将带你了解 Linux 中常用的两种电子邮件 MTA 程序的原理：`sendmail` 和 `Postfix`。虽然已经有专门介绍如何正确配置这些软件包的完整书籍，但我们将查看基础知识，看看如何让邮件离开\
  \ Linux 系统并进入你的收收件箱。\n\n### sendmail\n\n`sendmail` MTA 软件包是互联网邮件服务器最流行的开源 MTA 软件包之一。过去，它一直受到后门和安全漏洞传闻的困扰；然而，它已经过重写，不仅消除了安全漏洞，还整合了许多新的\
  \ MTA 功能，如垃圾邮件控制。新版本的 `sendmail` 程序已被证明是既安全又多功能的。\n\n### sendmail 程序的组成\n\n主执行程序称为\
  \ `sendmail`。它通常在后台模式运行，监听来自远程邮件服务器的 SMTP 连接，并转发本地用户的出站消息。\n\n除了主 `sendmail` 程序外，还有一个配置文件和若干张表，用于存储处理传入和导出邮件消息时所需的信息。表\
  \ 25.1 列出了普通 sendmail 安装中使用的所有部分。\n\n表 25.1 sendmail 配置文件\n\n| 文件 | 描述 |\n| :---\
  \ | :--- |\n| `sendmail.cf` | 控制 `sendmail` 程序行为的文本文件。 |\n| `sendmail.cw` | 包含 `sendmail`\
  \ 程序接收消息的域名列表的文本文件。 |\n| `sendmail.ct` | 包含可以控制 `sendmail` 操作的可信用户列表的文本文件。 |\n|\
  \ `aliases` | 包含有效本地邮件地址列表的二进制文件，可以将邮件重定向到另一个用户、文件或程序。 |\n| `newaliases` | 从文本文件创建新\
  \ `aliases` 数据库文件的可执行执行程序。 |\n| `mailq` | 检查邮件队列并打印任何消息的可执行执行程序。 |\n| `mqueue` |\
  \ 用于存储等待交付的消息的目录。 |\n| `mailertable` | 用于指定特定域名路由路径的文本文件。 |\n| `domaintable` | 用于将旧域名映射到新域名的文本文件。\
  \ |\n| `virtusertable` | 用于将用户和域名映射到替代地址的文本文件。 |\n| `relay-domains` | 列出允许通过 `sendmail`\
  \ 程序转发消息的特定主机的文本文件。 |\n| `access` | 列出特定域名的文本文件，这些域名接收的消息被允许或拒绝。 |\n\n除非你正在运行公司或互联网服务提供商的主邮件服务器，否则你只需要担心\
  \ `sendmail.cf` 配置文件。事实上，许多使用 `sendmail` 的 Linux 发行版会自动为你创建并配置一个核心的 `sendmail.cf`\
  \ 配置文件，它在大多数简单应用程序中都能良好地工作。\n\n### sendmail.cf 文件\n\n`sendmail` 程序需要告知服务器在接收消息时如何处理它们。作为一种\
  \ MTA，`sendmail` 处理传入的邮件将其重定向到远程系统或本地系统上的另一个邮件软件包。配置文件用于指导 `sendmail` 如何操作目标邮件地址，以决定在何以及如何转发消息。配置文件的默认位置是\
  \ `/etc/mail/sendmail.cf`。\n\n`sendmail.cf` 文件由规则集组成，这些规则集解析传入的邮件并决定要采取的操作。每个规则集都用于识别特定的邮件格式并指示\
  \ `sendmail` 如何处理该消息。\n\n当 `sendmail` 程序接收消息时，它解析消息头并将消息通过各种规则集，以确定对消息采取的操作。`sendmail`\
  \ 配置文件包含了允许 `sendmail` 处理许多不同格式邮件的规则。从 SMTP 主机接收的邮件的头部字段与从本地用户接收的邮件不同。`sendmail`\
  \ 程序必须知道如何处理任何情况。\n\n规则在配置文件中还定义了辅助函数。你可以定义三种不同的辅助函数：\n\n*   `Classes`（类）：定义用于帮助规则集识别某些类型消息的常用短语。\n\
  *   `Macros`（宏）：设置值，以简化配置文件中长字符串的输入。\n*   `Options`（选项）：用于设置 `sendmail` 程序运行的参数。\n\
  \n配置文件由一系列类、宏、选项和规则集组成。每个函数在配置文件中定义为单行文本。\n\n配置文件中的每一行都以一个字符开头，该字符定义了该行的操作。以空格或制表符开头的行是上一个操作行的延续行。以井号（#）开头的行表示注释，`sendmail`\
  \ 不处理它们。\n\n文本行开头的动作定义了行的用途。表 25.2 显示了标准的 sendmail 动作及其含义。\n\n| 配置文件行 | 描述 |\n|\
  \ :--- | :--- |\n| `C` | 定义文本类 |\n| `D` | 定义宏 |\n| `F` | 定义包含文本类的文件 |\n| `H` | 定义头部字段和操作\
  \ |\n| `K` | 定义包含搜索文本的数据库 |\n| `M` | 定义邮件器 |\n| `O` | 定义 sendmail 选项 |\n\n\n\n\n\
  \n| Key | Description |\n| --- | --- |\n| P | 定义 sendmail 优先级值 |\n| R | 定义用于解析地址的规则集\
  \ |\n| S | 定义规则集组 |\n\n正如我们提到的，你可能不需要从头开始编写 `sendmail.cf` 配置文件；Linux 发行版应该会为你创建一个标准的模板文件。很大可能，你唯一需要担心的是是否必须使用一个智能主机（smart\
  \ host）来为你转发邮件。`DS` 配置行用于控制此项功能：\n\n`DSmyisp.com`\n\n只需在 `DS` 标签后直接添加智能主机的主机名即可。\n\
  \n# Postfix\n\nPostfix 软件包正迅速成为 Unix 和 Linux 系统上流行的电子邮件软件包之一。Postfix 由 Wietse Venema\
  \ 开发，旨在为标准的 Unix 类型服务器提供一种替代的 MTA（邮件传输代理）。Postfix 软件能够将任何 Unix 或 Linux 系统转换为功能完备的电子邮件服务器。\n\
  \nMTA 软件包的负责管理进入或离开邮件服务器的消息。Postfix 通过使用多个不同的模块化程序和一套邮件队列目录系统来实现这种消息跟踪。每个程序通过各种消息队列处理消息，直到它们被投递到最终目的地。如果邮件服务器在消息传输过程中任何时候崩溃，Postfix\
  \ 可以确定消息最后一次成功存放在哪个队列中，并尝试继续处理消息。\n\n## Postfix 系统的组成\n\nPostfix 系统由多个邮件队列目录和可执行程序组成，所有程序相互作用以提供邮件服务。\n\
  \nPostfix 软件包利用一个始终作为后台进程运行的主程序（master program）。主程序允许 Postfix 派生程序，扫描邮件队列中的新消息并将其发送到正确的目的地。\n\
  \n主程序利用额外的辅助程序，这些程序根据功能按需要启动。它们可以被配置在利用后继续运行一段时间。这使得主程序在需要时可以重用正在运行的辅助程序，从而节省处理时间。在设定的时间限制后，辅助程序会静静地停止。\n\
  \n主程序用于控制 Postfix 的整体运行。[表 25.3] 显示了 Postfix 用于传输邮件消息的辅助程序。\n\n### 表 25.3 Postfix\
  \ 辅助程序\n\n| Program | Description |\n| --- | --- |\n| bounce | 在退信消息队列中记录退信的日志，并将退信邮件返回给发送者\
  \ |\n| cleanup | 处理传入的邮件头并将消息放入入站队列 |\n| error | 处理来自 `qmgr` 的消息投递请求，强制消息退回 |\n\
  | flush | 处理等待远程邮件服务器获取的消息 |\n| local | 投递目标为本地用户的消息 |\n| pickup | 等待 maildrop 队列中的消息并将其发送到\
  \ `cleanup` 程序开始处理 |\n| pipe | 将消息从队列管理器程序转发到外部程序 |\n| postdrop | 当 maildrop 队列对普通用户不可写时，将传入的消息移动到\
  \ maildrop 队列 |\n| qmgr | 处理入站队列中的消息，确定它们应该在何时以及如何投递，并派生程序进行投递 |\n| sendmail | 为程序提供兼容\
  \ sendmail 的接口，以使其向 maildrop 队列发送消息 |\n| showq | 报告 Postfix 邮件队列状态 |\n| smtp | 使用\
  \ SMTP 协议将消息转发到外部邮件主机 |\n| smtpd | 使用 SMTP 协议从外部邮件主机接收消息 |\n| trivial-rewrite |\
  \ 接收来自 `cleanup` 程序的消息，以确保头地址符合 `qmgr` 程序的标准格式，并被 `qmgr` 程序用于解析远程主机地址 |\n\nPostfix\
  \ 使用几种不同的消息队列来管理处理过程中的电子邮件消息。每个消息队列包含处于 Postfix 系统中不同消息状态的消息。[表 25.4] 列出了 Postfix\
  \ 使用的消息队列。\n\n### 表 25.4 Postfix 消息队列\n\n| Queue | Description |\n| --- | --- |\n\
  | maildrop | 从本地用户接收并等待处理的新消息 |\n| incoming | 等待处理或来自远程主机的新消息，以及来自本地用户的消息 |\n| active\
  \ | 准备好由 Postfix 投递的消息 |\n| deferred | 初始投递失败并正在等待再次尝试的消息 |\n| flush | 目标为远程主机的消息，这些主机将连接到邮件服务器获取它们\
  \ |\n| mail | 用于本地用户读取的已投递消息 |\n\n如果随时关闭 Postfix 系统，消息将留在最后所在的队列中。当 Postfix 重启时，它将自动开始从队列处理消息。这是\
  \ Postfix 的一个强大特性，使其成为最稳健的电子邮件系统之一。\n\n## Postfix 配置文件\n\nPostfix 系统的关键部分是配置文件。Postfix\
  \ 使用三个独立的配置文件，允许你设置用于指导 Postfix 如何处理消息的参数。与某些其他 MTA 程序不同，可以在 Postfix 服务器运行时更改配置，并发布命令让\
  \ Postfix 加载新信息而无需停止邮件服务器。\n\n这三个配置文件通常存储在常用的 Postfix 目录中。通常，该目录的默认位置是 `/etc/postfix`。通常，所有用户都有权限查看配置文件，而\
  \ `root` 用户有权更改文件。当然，可以根据你自己的情况进行修改。[表 25.5] 列出了 Postfix 配置文件。\n\n| File | Description\
  \ |\n| --- | --- |\n| install.cf | 包含安装 Postfix 时使用的安装参数信息 |\n| main.cf | Postfix\
  \ 程序在处理消息时使用的参数 |\n| master.cf | Postfix 主程序在运行核心程序时使用的参数 |\n\n`install.cf` 文件允许你检索\
  \ Postfix 软件首次安装到系统时使用的安装参数。这提供了一种简便的方法，来确定设置中有哪些可用用的功能。`master.cf` 文件控制 Postfix\
  \ 核心程序的行为。每个程序单独用一行列出，并附有控制其操作的参数。这是一个带有默认设置的 `master.cf` 示例文件：\n\n```\n================================\n\
  # service type unpriv root maxproc command + args\n#             (yes)  (yes)  (yes)\
  \  (never) (0)\n================================\nsmtp      inet  n  -  n  -   \
  \   smtpd\npickup    fifo  n  -  n  60     1  pickup\ncleanup   unix  -  -  n  -\
  \      0  cleanup\nqmgr      fifo  n  -  n  300    1  qmgr\nrewrite   unix  -  -\
  \  n  -      trivial-rewrite\nbounce    unix  -  -  n  -      0  bounce\ndefer \
  \    unix  -  -  n  -      0  bounce\ntrac      unix  -  -  n  -      0  bounce\n\
  verify    unix  -  -  n  -      1  verify\nflush     unix  n  -  n  1000   0  flush\n\
  proxymap  unix  -  -  n  -      proxymap\nsmtp      unix  -  -  n  -      smtp -o\
  \ fallback_relay=\nrelay     unix  -  -  n  -      smtp -o fallback_relay=\nshowq\
  \     unix  n  -  n  -      showq\nerror     unix  -  -  n  -      error\nlocal\
  \     unix  -  n  n  -      local\nvirtual   unix  -  n  n  -      virtual\n```\n\
  \n\n\n\n\n```\nlmtp    unix  -   -    n   -    -   lmtp\nanvil    unix  -   -  \
  \  n   -    1   anvil\nscache  unix  -   -    n   -    1   scache\n```\n\n`master.cf`\
  \ 配置文件还包含了用于指示 Postfix 如何与外部 MDA 软件交互的行，例如 `Procmail`。\n\nPostfix 的运行参数设置在 `main.cf`\
  \ 配置文件中。所有 Postfix 运行参数都有 Postfix 系统中隐含的默认值。如果 `main.cf` 文件中不存在某个参数值，则其值由 Postfix\
  \ 预设。如果 `main.cf` 文件中存在参数值，则其内容将覆盖默认值。\n\n每个 Postfix 参数在配置文件中单独占一行列，并带有其值，格式如下：\n\
  \n`parameter = value`\n\n`parameter` 和 `value` 都是纯文本字符串，必要时可以轻松读取和修改。Postfix 的 `master`\
  \ 程序在 Postfix 启动时会读取 `main.cf` 文件中的参数值，并在每次执行 Postfix 重载命令时再次读取。\n\nPostfix 参数的两个示例是\
  \ `myhostname` 和 `mydomain` 参数。如果在 `main.cf` 配置文件中未指定，`myhostname` 参数将假设 Linux 系统上\
  \ `gethostname()` 命令的结果，而 `mydomain` 则假设默认 `myhostname` 参数的域名部分。通常，单个邮件服务器会处理整个域的邮件。这是\
  \ Postfix 配置中一个非常简单的设置：\n\n```\nmyhostname = mailserver.smallorg.org\nmydomain =\
  \ smallorg.org\n```\n\n当 Postfix 启动时，它会将本地邮件服务器识别为 `[mailserver.smallorg.org]`，将本地域识别为\
  \ `smallorg.org`，并忽略任何系统设置的值。\n\n如果你需要指定智能主机（smart host），请使用 `relayhost` 参数进行：\n\
  \n```\nrelayhost = myisp.com\n```\n\n你也可以在这里指定 IP 地址，但必须包含在方括号中。\n\n## 使用 Mailx\
  \ 发送消息\n\n你在 Shell 脚本中发送邮件的主要工具是 `Mailx` 程序。你不仅可以用交互方式使用它来读取和发送消息，还可以使用命令行参数指定如何发送消息。\n\
  \n`Mailx` 程序发送消息的命令行格式为：\n\n```\nmail [-eIinv] [-a header] [-b addr] [-c addr] [-s\
  \ subj] to-addr\n```\n\n`mail` 命令使用了表 25.6 所示命令行参数。\n\n### Mailx 命令行参数\n\n| 参数 |\
  \ 说明 |\n| :--- | :--- |\n| `-a` | 指定额外的头部行。 |\n| `-b` | 在消息中添加 BCC：密送收件人。 |\n| `-c`\
  \ | 在消息中添加 CC：抄送收件人。 |\n| `-e` | 如果消息为空则不发送。 |\n| `-i` | 忽略 TTY 信号。 |\n| `-I` |\
  \ 强制 `Mailx` 在交互模式下运行。 |\n| `-n` | 不读取 `/etc/mail.rc` 文件。 |\n| `-s` | 指定主题（Subject）。\
  \ |\n| `-v` | 在终端上显示投递详情。 |\n\n如表 25.6 所示，你完全可以通过命令行参数创建一个完整的邮件消息。你只需要添加消息正文。要做到这一点，你需要将文本重定向到\
  \ `mail` 命令。这里有一个直接从命令行创建并发送邮件消息的简单示例：\n\n```\necho \"This is a test message\" |\
  \ mail -s \"Test message\" rich\n```\n\n`Mailx` 程序将 `echo` 命令的文本作为消息正文。这为你提供了从 Shell\
  \ 脚本发送消息的方便方法。这里有一个快速示例：\n\n```bash\ncat fact\n#!/bin/bash\n# 发送阶乘的答案\nMAIL='which\
  \ mail'\nfactorial=1\ncounter=1\nread -p \"Enter the number: \" value\nwhile [ $counter\
  \ -le $value ]\ndo\n  factorial=$((factorial * $counter))\n  counter=$((counter\
  \ + 1))\ndone\necho \"The factorial of $value is $factorial\" | mail -s \"Factorial\
  \ answer\" $USER\necho \"The result has been mailed to you.\"\n```\n\n此脚本并不假设 `Mailx`\
  \ 程序位于标准位置。它使用 `which` 命令来确定邮件程序的位置。在计算出阶乘结果后，Shell 脚本使用 `mail` 命令将消息发送给用户定义的 `$USER`\
  \ 变量，该变量应该是执行脚本的人。\n\n```\n./factmail\nEnter the number: 5\nThe result has been\
  \ mailed to you.\n```\n\n你只需要做的就是检查你的邮件，查看结果是否到达。\n\n\n\n\n\n`Mutt` 程序是另一个流行的 Linux\
  \ 命令行电子邮件客户端包，由 Michael Elkins 于 1995 年开发。它有一项 `Mailx` 程序不具备的功能，这使得它成为你 Shell 脚本中一个非常顺手的工具。\n\
  \n`Mutt` 程序具有在你的电子邮件消息中将文件作为附件发送的能力。你不再需要像以前使用 `Mailx` 那样，将长文本文件包含在邮件正正文中，而是可以使用\
  \ `Mutt` 程序将文本文件作为独立的附件包含在主邮件正文中。这一功能对于发送长文件（如日志文件）非常有用。\n\n本节将引导你如何在 Linux 系统上安装\
  \ `Mutt`，以及如何在 Shell 脚本中使用它将文件附件到电子邮件消息中。\n\n## 安装 Mutt\n\n在如今这个拥有 `KMail` 或 `Evolution`\
  \ 等高级花化电子邮件客户端的时代，`Mutt` 程序并不是一个流行的软件包，因此你的 Linux 发行版默认可能没有安装它。不过，大多数 Linux 发行版都将其包含在标准的发行文件中，您可以使用标准的软件安装方法进行安装（见第\
  \ 8 章）。对于 Ubuntu 环境，你可以使用命令行命令安装 `Mutt`：\n\n```\nsudo apt-get install mutt\n```\n\
  \n如果你的 Linux 发行版没有包含 `Mutt` 包，或者你只想安装最新版本，可以访问 Mutt 网站（[www.mutt.org](http://www.mutt.org)），下载最新的源码文件，然后使用第\
  \ 8 章中讨论的技术从源码包编译并安装该包。\n\n## Mutt 命令行\n\n`mutt` 命令提供了供你用于控制 `Mutt` 运行方式的参数。表 25.7\
  \ 显示了你可以使用的命令行参数。\n\n### 表 25.7 Mutt 命令行参数\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `-A\
  \ alias` | 将指定别名的扩展版本传递给 `STDOUT`。 |\n| `-a file` | 使用 `MIME` 协议将指定的文件作为附件添加到你的消息中。\
  \ |\n| `-b address` | 指定密抄 (BCC) 收件人。 |\n| `-c address` | 指定抄送 (CC) 收件人。 |\n| `-D`\
  \ | 将所有配置选项的值打印到 `STDOUT`。 |\n| `-e command` | 在处理初始化文件后指定运行的配置命令。 |\n| `-f mailbox`\
  \ | 指定要加载的邮箱文件。 |\n| `-F muttrc` | 指定要读取的初始化文件而非 `$HOME/.muttrc`。 |\n| `-h` | 显示帮助文本。\
  \ |\n| `-H draft` | 指定一个包含头信息和正文的草稿文件用于发送消息。 |\n| `-i include` | 指定要包含在消息正文的文件。\
  \ |\n| `-m type` | 指定默认的邮箱类型。 |\n| `-n` | 忽略系统配置文件。 |\n| `-p` | 恢复推迟的消息。 |\n| `-Q\
  \ query` | 查询配置变量的值。查询在解析了所有配置文件并执行了命令行给出的任何命令后执行。 |\n| `-R` | 以只读模式打开邮箱。 |\n| `-s\
  \ subject` | 指定消息的主题。 |\n| `-v` | 显示 `Mutt` 版本号和编译时定义。 |\n| `-x` | 模拟 `Mailx` 编写模式。\
  \ |\n| `-y` | 从列出 `mailboxes` 命令指定的所有邮箱开始。 |\n| `-z` | 与 `-f` 一起使用时，如果邮箱中没有消息则不启动。\
  \ |\n| `-Z` | 打开 `mailboxes` 命令指定的第一个包含新邮件的邮箱。 |\n\n通过无数的命令行参数，你可以直接从命令行自定义你的电子邮件消息，这正是你会在\
  \ Shell 脚本中想要做的。\n\n与 `Mailx` 程序一样，`Mutt` 程序中有一点是无法无法在命令行中指定的，那就是消息的正文文本。如果你不将文本重定向到\
  \ `Mutt` 程序，它将以文本图形模式启动，并打开一个编辑器窗口让你输入消息正文。\n\n这对于 Shell 脚本来说不是一件好事，因此你总是希望为消息正文重定向某种类型的文本，即使你正在使用附件选项来指定要附加的文件。下一节将演示如何这样做。\n\
  \n## 使用 Mutt\n\n现在，你已经准备好在 Shell 脚本中使用 `Mutt` 程序了。为了在你的 Shell 脚本中创建基础的 `mutt` 命令，你需要包含指定消息主题、附件文件以及所有消息收件人的命令行选项：\n\
  \n```\nmutt -s Subject -a file -- recipients\n```\n\n收件人列表是用于发送消息的电子邮件地址的空格分隔列表。如果你想附加多个文件，可以在\
  \ `-a` 选项后列出空格分隔的文件；`--` 符号用于将文件名与收件人地址列表隔离开。文件参数必须是绝对路径，或者是相对于你运行 `mutt` 命令的当前工作目录的相对路径。\n\
  \n`mutt` 命令还有另一个陷阱。如果你没有为消息正文重定向文本，`Mutt` 将自动进入全屏模式，让你在编辑器窗口中输入文本。这可能不是你想要的操作，所以请务必为消息正文重定向一些文本，即使它是一个空文件：\n\
  \n```bash\necho \"Here's the log file\" | mutt -s \"Log file\" -a /var/log/messages\
  \ -- rich\n```\n\n此命令将系统日志文件作为附件发送到本地系统上的电子邮件地址 `rich`。请注意，你还必须拥有访问想要附加的文件的相应权限。图\
  \ 25.5 显示了 `Evolution` 邮件客户端中收到的电子邮件消息。\n\n图 25.5 使用 `Evolution` 查看带有附件的消息\n\n![25.5](img/c25f005.jpg)\n\
  \n注意，消息包含了来自 `echo` 语句的正文文本，以及一个附件文件的独立图标。你可以直接从 `KMail` 客户端保存附件文件。\n\n### 注意事项\n\
  \n如果你查看附件的文件名，你会发现 `Mutt` 使用附件文件的 `basename` 作为附件中的文件名。在使用临时文件时要小心，因为 `Mutt` 将使用临时文件名作为附件的文件名。使用具描述性的名称来保存临时文件会更好。\n\
  \n## 总结\n\n本章讨论了如何在你的 Shell 脚本中整合电子邮件。定期向客户发送电子邮件是一项非常好的功能。\n\n在通过命令行发送电子邮件消息之前，你需要了解电子邮件在\
  \ Linux 环境中如何工作，以及你需要安装和配置哪些应用程序。Linux 电子邮件环境由三个元素组成：邮件传输代理（MTA）程序、邮件投递代理（MDA）程序（通常是\
  \ MTA 程序的一部分）以及邮件用户代理（MUA）程序。\n\n`MTA` 程序负责发送和接收 Linux 系统的电子邮件消息。它必须知道如何将传入的邮件消息传递给正确的邮箱，以及如何发送指向远程邮件服务器用户的出站邮件消息。通常，`MTA`\
  \ 程序会使用代理服务器（也称为智能主机）来执行详细的邮件投递。它将任何指向远程邮件服务器用户的消息转发到智能主机进行投递。它可以依靠智能主机自行完成投递。\n\
  \n\n\n\n\nMUA（邮件用户代理）程序允许个人系统用户访问其邮箱箱中的消息，并将传出的消息传递给 MTA（邮件传输代理）进行递送。这些程序从简单的命令行程序（如\
  \ `Mailx` 和 `Mutt`）到高级的图形程序（如 `KMail` 和 `Evolution`）。\n\n通过 Shell 脚本发送电子邮件最简单的方法是使用\
  \ `Mailx` 程序。该程序允许你在命令行上指定主题头和一个或多个接收者。你通过将文本重重定向到 `Mailx` 程序来创建消息正文。你可以使用 `echo`\
  \ 命令处理单行文本，或者使用 `cat` 命令将文件内容重定向到邮件消息中。\n\n`Mutt` 程序是一个更高级的命令行 MUA 程序，它提供了在邮件中附加文件的功能，而不是将文本包含在消息正文中。这允许你附加大型文本文件，客户可以轻松将其保存到磁盘上以便在其他程序（如电子表格或文字处理软件包）中检查。\n\
  \n本书的最后两章涵盖了 Shell 脚本的重要部分：编写管理脚本。如果你是 Linux 系统管理员，很可能会遇到需要定期监控某个系统功能状态的情况。通过创建一个\
  \ Shell 脚本并将其放入 `cron job` 中，你可以轻松监控 Linux 系统的运行情况。\n\n## 第 26 章：编写脚本工具\n\n### 本章内容\n\
  * 监控磁盘空间\n* 执行备份\n* 管理用户账户\n\n没有哪个地方比为 Linux 系统管理员编写脚本工具更能体现 Shell 编程的用途了。典型的 Linux\
  \ 系统管理员每天需要大量工作，从监控磁盘空间、备份重要文件到管理用户账户。Shell 脚本工具可以让系统管理员的生活变得简单得多！本章演示了在 `bash`\
  \ Shell 中编写脚本工具的一些能力。\n\n## 监控磁盘空间\n\n多用户 Linux 系统最大的问题之一是可用磁盘空间量。在某些情况下（例如文件共享服务器），仅仅因为一个粗心的用户，磁盘空间就可能迅速被填满。\n\
  \n这个 Shell 脚本工具帮助你确定指定目录下占用磁盘空间最大的十个目录。它生成带有日期标记的报告，允许监控磁盘空间的消耗趋势。\n\n### 所需函数\n\
  \n你需要的第一个工具是 `du` 命令（见第 4 章）。该命令显示单个文件和目录的磁盘占用情况。`-s` 允许你在目录级别汇总总量。在计算单个用户使用的总磁盘空间时，这非常有用。以下是使用\
  \ `du` 命令汇总 `/home` 目录下每个用户 `$HOME` 目录内容的示例：\n\n```bash\n$ du -s /home/*\n6174428\
  \      /home/consultant\n4740         /home/Development\n4740         /home/Production\n\
  3860         /home/Samantha\n7916         /home/Timothy\n140376116  /home/user\n\
  ```\n\n`-s` 选项对于用户的 `$HOME` 目录效果良好，但如果我们想查看如 `/var/log` 等系统目录的磁盘情况怎么办？\n\n```bash\n\
  $ du -s /var/log/*\n4          /var/log/alternatives.log\n44         /var/log/alternatives.log.1\n\
  4          /var/log/apparmor\n176        /var/log/apt\n0          /var/log/aptitude\n\
  4          /var/log/aptitude.1.gz\n4          /var/log/aptitude.2.gz\n4        \
  \  /var/log/aptitude.3.gz\n4          /var/log/aptitude.4.gz\n4          /var/log/aptitude.5.gz\n\
  60         /var/log/auth.log\n```\n\n列表变得太详细了。`-S` 选项更符合我们的需求，它会为每个目录和子目录提供总计。这允许你快速定位区域：\n\
  \n```bash\n$ du -S /var/log\n176        /var/log/apt\n2          /var/log/exim4\n\
  104        /var/log/dist-upgrade/201011-1337\n148        /var/log/dist-upgrade\n\
  248        /var/log/installer\n228        /var/log/gdm\n4          /var/log/news\n\
  4          /var/log/samba/cores/bindd\n4          /var/log/samba/cores\n16     \
  \    /var/log/samba\n4          /var/log/attended-upgrades\n4          /var/log/sysstat\n\
  4          /var/log/speech-dispatcher\n108        /var/log/ConsoleKit\n64      \
  \   /var/log/cups\n4          /var/log/apparmor\n2          /var/log/fsck\n4844\
  \       /var/log\n```\n\n由于我们关注的是占用磁盘空间最大的部分目录，你需要对 `du` 生成的列表使用 `sort` 命令（见第 4\
  \ 章）：\n\n```bash\n$ du -S /var/log | sort -rn\n6148       /var/log/dist-upgrade\n\
  4864       /var/log\n1248       /var/log/installer\n1048       /var/log/dist-upgrade/201011-1337\n\
  228        /var/log/gdm\n176        /var/log/apt\n108        /var/log/ConsoleKit\n\
  64         /var/log/cups\n52         /var/log/exim4\n16         /var/log/samba\n\
  12         /var/log/fsck\n4          /var/log/attended-upgrades\n4          /var/log/sysstat\n\
  4          /var/log/speech-dispatcher\n4          /var/log/samba/cores/bindd\n4\
  \          /var/log/samba/cores\n4          /var/log/news\n4          /var/log/apparmor\n\
  ```\n\n`-n` 选项允许进行数值排序。`-r` 选项将最大的数字列在前。这对于寻找最大的磁盘占用者非常完美。\n\n`sed` 编辑器（见第 18 章和第\
  \ 20 章）将此列表更加清晰。为了关注前十名磁盘空间占用者，当到达第 11 行时，设置 `sed` 删除列表的剩余部分。下一步是为列表中的每行添加行号。第 18\
  \ 章向你展示了如何通过向 `sed` 命令添加等号（=`）来实现这一点。为了让这些行号与磁盘空间文本位于同一行，请使用 `N` 命令合并文本行，就像我们在第\
  \ 20 章中做的那样。需要的 `sed` 命令如下：\n\n```bash\nsed '{11,$D; =}' | sed 'N; s/\\n/ /'\n```\n\
  \n现在可以使用 `gawk` 命令（见第 21 章）对输出进行清理。`sed` 编辑器的输出被传递给 `gawk` 命令，然后使用 `printf` 函数打印出来。\n\
  \n```bash\ngawk '{printf $1 \":\\t$2\\t$3\\n\"}'\n``` 在行号后面添加了冒号（:`），并在字段之间插入了制表符（`\\\
  t`）。这产生了一个格式良好的占用者列表。\n\n## 创建脚本\n\n现在你可以开始工作了！下一步是使用这些信息来创建脚本。\n\n为了节省时间和精力，脚本会为多个指定目录创建一个报告。使用一个名为\
  \ `CHECK_DIRECTORIES` 的变量来实现这一点。对于这里的目的，该变量被设置为两个目录：\n\n```bash\nCHECK_DIRECTORIES=\"\
  \ /var/log /home\"\n```\n\n脚本包含一个 `for` 循环，对列出的每个目录执行 `du` 命令。这种技术（见第 12 章）用于读取和处理列表中的值。每当\
  \ `for` 循环遍历 `CHECK_DIRECTORIES` 变量的值列表时，它会将列表中的下一个值赋值给 `DIR_CHECK` 变量：\n\n```bash\n\
  for DIR_CHECK in $CHECK_DIRECTORIES\ndo\n    du -S $DIR_CHECK\ndone\n```\n\n为了便于识别，使用\
  \ `date` 命令在报告文件名中添加日期标记。使用 `exec` 命令（见第 14 章），脚本将其输出重定向到带有日期标记的报告文件：\n\n```bash\n\
  DATE=$(date '+%m%d%y')\nexec > disk_space_$DATE.rpt\n```\n\n\n\n\n现在为了生成一个格式良好的报告，脚本使用了\
  \ `echo` 命令来添加几个报告标题：\n\n`echo “Top Ten Disk Space Usage\"`\n\n`echo “for $CHECK_DIRECTORIES\
  \ Directories\"`\n\n所以，让我们来看看这个脚本整合后的样子：\n\n```bash\n#!/bin/bash\n\n#\n\n# Big_Users\
  \ - 查找各个目录中占用磁盘空间较大的用户\n###############################################################\
  \ \n# 脚本参数 \n# \nCHECK_DIRECTORIES=\" /var/log /home\"    # 要检查的目录\n# \n##############\
  \ 主脚本 #################################\n#\nDATE=$(date '+%m%d%y')             \
  \  # 报告文件的日期\n# \nexec > disk_space_$DATE.rpt            # 将标准输出重定向到报告文件\n#\necho\
  \ “Top Ten Disk Space Usage”           #整个报告的头部\necho “for $CHECK_DIRECTORIES Directories”\n\
  # \nfor DIR_CHECK in $CHECK_DIRECTORIES    #循环 du 目录\ndo \n  echo \"\"\n  echo “The\
  \ $DIR_CHECK Directory:\"     # 每个目录的标题头部\n#\n# 创建前十名磁盘空间占用用户的列表\n  du -S $DIR_CHECK\
  \ 2>/dev/null | \n  sort -rn | \n  sed '{11,$D;}' | \n  sed 'N; s/\\n/ /' |\n  gawk\
  \ '{printf $1 “:” \"\\t” $2 “\\t” $3 \"\\n”}'\n# \ndone                        \
  \           # du 目录循环结束\n```\n\n就是这样。这是一个简单的 shell 脚本，可以为你选择的每个目录创建一个带有日期标记的前十名磁盘空间消耗报告。\n\
  \n### 运行脚本\n\n在让 Big_Users 脚本自动运行之前，你可能想手动测试几次，以确保它的运行结果符合你的预期：\n\n```bash\n$ \n\
  $ ./Big_Users \n$ \n$ cat disk_space_012311.rpt \nTop Ten Disk Space Usage \nfor\
  \ /var/log /home Directories \nThe /var/log Directory: \n1:          6148      /var/log/dist-upgrade\
  \ \n2:          4892      /var/log \n3:          1248      /var/log/installer \n\
  4:          1048      /var/log/dist-upgrade/20101011-1337 \n5:          176    \
  \   /var/log/apt \n6:          108       /var/log/ConsoleKit \n7:          64  \
  \      /var/log/cups \n8:          52        /var/log/exim4 \n9:          16   \
  \     /var/log/samba \n10:         12        /var/log/fsck \nThe /home Directory:\
  \ \n1:      92365332      /home/user/.VirtualBox/HardDisks \n2:      18659720  \
  \    /home/user/Downloads \n3:      17626092      /home/user/archive \n4:      6174408\
  \      /home/Timothy/Junk/More_Junk \n5:      6174408      /home/Timothy/Junk \n\
  6:      6174408      /home/consultant/Work \n7:      6174408      /home/consultant/Downloads\
  \ \n8:      3227768      /home/user/vmware/Mandriva \n9:      3212464      /home/user/vmware/Fedora\
  \ \n10:     104632      /home/user/vmplayer \n```\n\n运行成功了！现在你可以根据需要设置 shell 脚本自动执行。你可以使用\
  \ cron 表（见第 15 章）来实现这一点。\n\n#### 注意事项\n\n当你运行包含需要 root 权限的 bash shell 命令的脚本时，你需要使用\
  \ `su` 或 `sudo` 命令。否则，脚本将产生意想不到的结果。\n\n你运行此脚本的频率取决于文件服务器的活跃程度。要每周运行一次脚本，请在 cron\
  \ 表中添加以下条目：\n\n`15 7 * * 1 /home/user/Big_Users`\n\n该条目会在每周一上午 7:15 运行该 shell 脚本。\n\
  \n## 执行备份\n\n无论你是负责业务还是仅仅为了家庭，数据丢失都可能是灾难性的。为了防止这种情况，定期进行备份始终是一个好主意。\n\n#### 数据归档\n\
  \n如果你使用的是包含图形化桌面的 Linux 发行版，在归档你的 $HOME 目录时要小心。虽然这看起来很好，但 $HOME 目录包含了许多与桌面相关的配置和临时文件。这将创建一个比你预期大得存档文件。选择一个存储工作文件的子目录，并在归档配置文件中使用该子目录。\n\
  \n你可以让脚本读取配置文件并将每个目录或文件的名称添加到归档中。要实现这一点，请使用简单的 `read` 命令（见第 13 章）从文件中读取每条记录。但不像我们在第\
  \ 13 章中那样使用 `cat` 命令通过传输到 `while` 循环，此脚本将使用 `exec` 命令重定向 STDINPUT（见第 14 章）。它看起来如下：\n\
  \n```bash\nexec < $CONFIG_FILE\nread FILE_NAME\n```\n\n注意，归档配置文件以及从文件中读取的每条记录都使用了变量。只要\
  \ `read` 命令在配置文件中找到新记录进行读取，它就会在 `?` 变量中返回退出值 0 表示成功（见第 10 章）。你可以将其作为 `while` 循环中的测试，以读取配置文件中的所有记录：\n\
  \n```bash\nwhile [ $? -eq 0 ]\ndo\n...\n  read FILE_NAME\ndone\n```\n\n一旦 `read`\
  \ 命令到达配置文件的末尾，它将返回一个非成功状态。此时，`while` 循环将退出。\n\n#### 所需函数\n\nLinux 中归档的核心是 `tar`\
  \ 命令。本节展示了如何使用它来创建一个 tar 包。由于 tar 文件可能会占用大量空间，对其进行压缩是一个好主意。你可以通过简单添加 `-z` 选项来实现。注意\
  \ `.tar.gz` 或 `.tgz` 都可以。这是一个创建一个 tar 包的示例：\n\n```bash\ntar -zcf archive.tar.gz\
  \ /path/to/directory\n```\n\n现在你已经有了归档脚本的主要组件。你不需要为每个想要备份的目录或文件创建新的归档脚本，而是可以使用配置文件。配置文件应该包含你想包含的每个目录或文件：\n\
  \n```text\n/var/log\n/home\n```\n\n\n\n\n在 `while` 循环中，需要完成两件事。首先，你必须将文件或目录名称添加到归档列表中。更重要的是，要检查该文件或目录是否存在！从文件系统中删除一个目录并忘记更新归档配置文件是非常容易发生的错误。你可以使用简单的\
  \ `if` 语句和 `test` 命令进行文件比较来检查文件或目录是否存在（参见第 11 章）。如果文件或目录确实存在，则将其将其添加到待归档文件列表 `FILE_LIST`\
  \ 中。否则，将发出一条警告消息。如下所示：\n\n```bash\nif [ -f $FILE_NAME -o -d $FILE_NAME ] \n    \
  \  then \n             # 如果文件存在，将其名称添加到列表。\n             FILE_LIST=\"$FILE_LIST\
  \ $FILE_NAME\"\n      else\n             # 如果文件不存在，发出警告\n             echo\n   \
  \          echo \"$FILE_NAME, does not exist.\" \n             echo “显然，我不会将其包含在本次归档中。”\n\
  \             echo “它列在配置文件的第 $FILE_NO 行。”\n             echo “继续构建归档列表...” \n \
  \            echo \n      fi \n#\n    FILE_NO=$[$FILE_NO + 1]          # 行号/文件数加\
  \ 1。\n```\n\n由于我们归档配置文件中的记录可以是文件名或目录，因此 `if` 语句使用 `-f` 和 `-d` 选项测试两者的存在性。或选项 `-o`\
  \ 允许文件或目录的存在性测试中任意一个返回真，使得整个 `if` 语句被视为真。\n\n为了在追踪不存在的目录和文件时提供额外帮助，添加了变量 `FILE_NO`。这样，脚本就可以准确告诉你归档配置文件中的哪一行包含了错误或缺失的文件或目录。\n\
  \n你现在应该有了足够的信息来开始构建脚本。下一节将引导你完成创建归档脚本。\n\n### 创建每日归档脚本\n\n`Daily_Archive` 脚本会自动在指定位置创建一个归档，并使用当前日期来唯一标识文件。以下是该脚本部分的代码：\n\
  \n```bash\nDATE='date +y%m%d'          \n#\n# 设置归档文件名\n#\nFILE=archive$DATE.tar.gz\n\
  # \n# 设置配置和目标文件\n#\nCONFIG_FILE=/home/user/archive/Files_To_Backup\nDESTINATION=/home/user/archive/$FILE\n\
  ```\n\n`DESTINATION` 变量附加了归档文件的完整路径。`CONFIG_FILE` 变量指向包含待归档文件的归档配置文件。如果需要，这两个都可以轻松更改为备用目录和文件。\n\
  \n整合后的 `Daily_Archive` 脚本现在如下：\n\n```bash\n#!/bin/bash\n\n# \n# Daily_Archive -\
  \ 归档指定的目录和目录\n###############################################\n#\n# 获取当前日期\n#\n\
  DATE='date +y%m%d'          \n#\n# 设置归档文件名\n#\nFILE=archive$DATE.tar.gz\n# \n# 设置配置和目标文件\n\
  #\nCONFIG_FILE=/home/user/archive/Files_To_Backup\nDESTINATION=/home/user/archive/$FILE\n\
  #\n######### 主脚本 #########################\n#\n# 检查备份配置文件是否存在\n#\nif [ -f $CONFIG_FILE\
  \ ]   # 确保配置文件仍然存在。 \nthen             # 如果存在，则什么都不做，继续执行。  \nelse             #\
  \ 如果不存在，发出错误并退出脚本。\n     echo \n     echo \"$CONFIG_FILE does not exist.\" \n  \
  \   echo “由于缺少配置文件，备份未完成” \n     echo \n     exit \nfi\n#\n# 构建所有待备份文件的名称 \n#\n\
  FILE_NO=1        # 从配置文件的第 1 行开始。 \nexec < $CONFIG_FILE    # 将标准输入重定向到配置文件 \n# \n\
  read FILE_NAME           # 读取第一条记录\n# \nwhile [ $? -eq 0 ]       # 创建待备份文件列表。 \n\
  do \n         # 确保文件或目录存在。\n      if [ -f $FILE_NAME -o -d $FILE_NAME ]  \n    \
  \  then \n               # 如果文件存在，将其名称添加到列表。\n               FILE_LIST=\"$FILE_LIST\
  \ $FILE_NAME\"\n      else\n               # 如果文件不存在，发出警告\n               echo\n\
  \               echo \"$FILE_NAME, does not exist.\" \n               echo “显然，我不会将其包含在本次归档中。”\n\
  \               echo “它列在配置文件的第 $FILE_NO 行。”\n               echo “继续构建归档列表...”\
  \ \n               echo\n\n      fi \n#\n    FILE_NO=$[$FILE_NO + 1]          #\
  \ 行号/文件数加 1。\n```\n\n\n\n\n`Hourly_Archive` 从 `date` 命令中获取日期和月份值，以及用于唯一标识归档文件的时间戳。然后它使用这些信息创建归档目录（如果目录已存在则静默退出）。最后，脚本使用\
  \ `tar` 命令创建归档并将其压缩为 tar 包。\n\n# 运行小时归档\n\n与 `Daily_Archive` 脚本一样，在将其放入 cron 表之前，测试一下\
  \ `Hourly_Archive` 脚本是一个好主意：\n\n```\n$ cat /home/user/archive/Files_To_Backup\n\
  /home/Simulation/Logs\n/home/Production/Errors\n$ ./Hourly_Archive\n$ ls /home/user/archive/hourly/01/02archive.tar.gz\n\
  $ ./Hourly_Archive\n$ ls /home/user/archive/hourly/01/02archive.tar.gz\n``` 脚本第一次运行成功，创建了相应的月份目录，然后创建了归档文件。为了测试，又运行了第二次，看看是否会对已存在的目录产生问题。脚本再次运行正常，并创建了第二个归档文件。它现在可以准备用于\
  \ cron 表了。\n\n## 管理用户账户\n\n管理用户账户不仅仅是添加、修改和删除账户。你必须考虑安全问题、保留工作的需求以及账户的准确管理。这可能是一项耗时的任务。这里是编写实用工具节省时间的另一个实例！\n\
  \n## 所需函数\n\n删除账户是管理账户中更复杂的任务。在删除账户时，至少需要四个独立操作：\n\n1. 获取正确的用户名。\n2. 杀死系统中运行的属于该账户的进程。\n\
  3. 确定系统中属于该账户的所有文件。\n4. 删除用户账户。\n\n很容易漏掉步骤。本节中的 shell 脚本将帮助你避免此类错误。\n\n### 获取账户名称\n\
  \n账户处理的第一步是最重要的，即获取要删除的正确用户名。由于这是一个交互式脚本，你可以使用 `read` 命令（见第 13 章）来获取账户名。如果脚本用户离开并让问题悬挂，你可以使用\
  \ `read` 命令的 `-t` 选项，并在给脚本用户 60 秒回答时间后超时：\n\n```bash\necho \"Please enter the username\
  \ of the user \"\necho -e \"account you wish to delete from system:\"\nread -t 60\
  \ ANSWER\n```\n\n由于中断是生活的一部分，最好给用户三次回答问题的机会。为了实现这一点，请使用 `while` 循环（见第 12 章）并配合 `-z`\
  \ 选项测试 `ANSWER` 变量是否为空。当脚本进入 while 循环时，`ANSWER` 变量长度为零，因为问题会被放在循环末尾：\n\n```bash\n\
  while [ -z \"$ANSWER\" ]\ndo\n  echo \"Please enter the username of the user \"\n\
  \  echo -e \"account you wish to delete from system:\"\n  read -t 60 ANSWER\ndone\n\
  ```\n\n现在你需要方法与脚本用户通信第一个问题超时的情况，告知还有一次回答问题的机会，以此类推。`case` 语句（见第 11 章）是可以在工作的结构化命令。通过递增\
  \ `ASK_COUNT` 变量，你可以设置不同的消息与脚本用户通信。该部分的代码看起来如下：\n\n```bash\ncase $ASK_COUNT in\n\
  \  2)\n    echo \"Please answer the question.\"\n    ;;\n  3)\n    echo \"One last\
  \ try...please answer the question.\"\n    ;;\n  4)\n    echo \"Since you refuse\
  \ to answer the question...\"\n    echo \"exiting program.\"\n    exit\n    ;;\n\
  esac\n```\n\n现在脚本已经有了询问用户要删除哪个账户所需的所有结构。此脚本中还有几个你需要询问用户的问题，仅仅问这一个问题就写了很多代码！因此，让我们把这段代码转换成一个函数（见第\
  \ 16 章），以便在你的 `Delete_User` 脚本的多个位置使用它。\n\n你需要做的第一件事是声明函数名 `get_answer`。接下来，使用 `unset`\
  \ 命令（见第 5 章）清除脚本用户之前提供的任何回答。执行这两项操作的代码如下：\n\n```bash\nfunction get_answer {\n#\n\
  \  unset ANSWER\n```\n\n你对原始代码需要修改的另一项是对向脚本用户的实际问题。脚本不会每次都问同一个问题，所以让我们创建两个新变量 `LINE1`\
  \ 和 `LINE2` 来处理问题行：\n\n```bash\necho $LINE1\necho -e $LINE2\"\\c\"\n```\n\n然而，并不是每个问题都有两行显示。有些只有一行。使用\
  \ `if` 结构（见第 11 章）来协助解决这个问题。函数将测试 `LINE2` 是否为空，如果是则只使用 `LINE1`：\n\n```bash\nif [\
  \ -n \"$LINE2\" ]\nthen\n  echo $LINE1\n  echo -e $LINE2\"\\c\"\nelse\n  echo -e\
  \ $LINE1\"\\c\"\nfi\n```\n\n最后，我们的函数需要通过清除 `LINE1` 和 `LINE2` 变量来清理现场。因此，函数现在看起来如下：\n\
  \n```bash\nfunction get_answer {\n#\n  unset ANSWER\n  ASK_COUNT=0\n  while [ -z\
  \ \"$ANSWER\" ]\n  do\n    ASK_COUNT=$[ASK_COUNT + 1]\n    case $ASK_COUNT in\n\
  \      2)\n        if [ -n \"$LINE2\" ]\n        then\n          echo $LINE1\n \
  \         echo -e $LINE2\"\\c\"\n        else\n          echo -e $LINE1\"\\c\"\n\
  \        fi\n        ;;\n    esac\n    read -t 60 ANSWER\n  done\n  unset LINE1\n\
  \  unset LINE2\n}\n```\n\n为了询问脚本用户要删除哪个账户，你需要设置几个变量并调用 `get_answer` 函数。使用新函数使脚本代码更简单：\n\
  \n```bash\nLINE1=\"Please enter the username of the user \"\nLINE2=\"account you\
  \ wish to delete from system:\"\nget_answer\nUSER_ACCOUNT=$ANSWER\n```\n\n由于可能出现错误，你将想要验证输入的用户账户。这将很容易，因为我们已经有了处理提问的现有：\n\
  \n```bash\nLINE1=\"Is $USER_ACCOUNT the user account \"\nLINE2=\"you wish to delete\
  \ from the system? [y/n]\"\nget_answer\n```\n\n一旦问完问题，脚本需要处理答案。`ANSWER` 变量再次携带了用户对问题的回答。如果用户回答了\
  \ \"yes\"，你就有了正确的账户进行删除并可以在脚本中继续。你可以使用 `case` 语句（见第 11 章）来处理答案。确保编写 `case` 语句时，它能够检查输入“yes”的多种方式。\n\
  \n```bash\ncase $ANSWER in\n  y|Y|yes|Yes|yEs|YEs|yES )\n    ;;\n  *)\n    echo\
  \ \"Because the account, $USER_ACCOUNT, is not \"\n    echo \"the one you wish to\
  \ delete, we are leaving the script...\"\n    exit\n    ;;\nesac\n```\n\n脚本会有很多次需要处理用户的\
  \ yes/no 回答。因此，再次创建一个处理此任务的任务是有意义的。只需要对前面的代码进行少许修改。只需声明函数名并在 `case` 中添加变量 `EXIT_LINE1`\
  \ 和 `EXIT_LINE2`。这些更改加上结尾的一些变量清理，将产生 `process_answer` 函数：\n\n```bash\nfunction process_answer\
  \ {\n#\n  case $ANSWER in\n    y|Y|yes|Yes|yEs|YEs|yES )\n      ;;\n    *)\n   \
  \   echo $EXIT_LINE1\n      echo $EXIT_LINE2\n      exit\n      ;;\n  esac\n#\n\
  \  unset EXIT_LINE1\n  unset EXIT_LINE2\n}\n```\n\n现在一个简单的函数调用就可以处理答案：\n\n```bash\n\
  EXIT_LINE1=\"Because the account, $USER_ACCOUNT, is not \"\nEXIT_LINE2=\"the one\
  \ you wish to delete, we are leaving the script...\"\nprocess_answer\n```\n\n\n\n\
  \n用户已经给了我们要删除的账户名称并进行了验证。现在是再次检查该用户账户是否真的存在系统中的好时机。此外，向脚本用户显示完整的账户记录也是一个好主意，以确保这确实是要删除的账户。为了完成这些项目，请使用变量\
  \ `USER_ACCOUNT_RECORD`，并将其设置为通过 `/etc/passwd` 文件对用户账户进行 `grep` 搜索（见第 4 章）的结果。`-w`\
  \ 允许你在该特定用户账户的记录中进行精确的单词匹配：\n\n```\nUSER_ACCOUNT_RECORD=$(cat /etc/passwd | grep\
  \ -w $USER_ACCOUNT)\n```\n\n如果在 `/etc/passwd` 中没有找到账户记录，则意味着该账户已被删除或从根就不存在。无论哪种情况，你都需要让脚本用户知道并退出脚本。`grep`\
  \ 命令的退出状态将在这里提供帮助。如果未找到账户记录，`?` 变量将被设置为 1：\n\n```bash\nif [ $? -eq 1 ] \nthen \n\
  \    echo \n    echo “Account, $USER_ACCOUNT, not found.” \n    echo “Leaving the\
  \ script...” \n    echo \n    exit \nfi \n```\n\n如果找到了记录，你仍然需要向脚本用户验证这是否是正确的账户。这就是我们设置函数所做的所有工作将真正发挥作用的地方！你只需要设置相应的变量并调用函数即可：\n\
  \n```bash\necho “I found this record:” \necho $USER_ACCOUNT_RECORD \necho \n\n#\n\
  LINE1=\"Is this the correct User Account? [y/n]” \nget_answer\n\n#\nEXIT_LINE1=\"\
  Because the account, $USER_ACCOUNT, is not” \nEXIT_LINE2=\"the one you wish to delete,\
  \ we are leaving the script...” \nprocess_answer\n```\n\n## 移除账户进程\n\n到目前为止，你已经获取并验证了要删除的用户账户正确名称。为了从系统中移除用户账户，该账户不能拥有任何当前运行的进程。因此，你的下一步是找到并杀掉这些进程。这将变得有点复杂！\n\
  \n查找用户进程将简单部分。在这里，脚本可以使用 `ps` 命令（见第 4 章）和 `-u` 选项来定位该账户拥有的任何运行进程。如果存在任何进程，它们将显示给脚本用户。\n\
  \n```bash\nps -u $USER_ACCOUNT\n```\n\n你可以使用 `ps` 命令的退出状态和 case 结构来确定下一步：\n\n```bash\n\
  case $? in \n1)\n    echo “There are no processes for this account currently running.”\n\
  \    echo \n;; \n0)\n    unset ANSWER \n    LINE1=\"Would you like me to kill the\
  \ process(es)? [y/n]” \n    get_answer\n...\nesac\n```\n\n如果退出状态返回 1，则系统中没有属于该用户的运行进程。但是，如果退出状态返回\
  \ 0，则系统中有一个该账户拥有的进程。在这种情况下，脚本需要询问用户是否想要杀死这些进程。你可以通过使用 `get_answer` 函数完成此任务。\n\n\
  你可能认为脚本的下一步操作是调用 `process_answer` 函数。遗憾的是，下一个项目对于 `process_answer` 来说太复杂了。你需要嵌入另一个\
  \ case 语句来处理脚本用户的回答。case 语句的第一部分看起来与我们的 `process_answer` 函数非常相似：\n\n```bash\ncase\
  \ $ANSWER in\n    y|Y|YES|yes|Yes|yEs|yeS|YEs|yES ) # 如果用户回答“yes”， \n          \
  \                           #kill User Account processes.\n...\n;; \n*) # 如果用户回答除“yes”以外的任何内容，不要杀死。\n\
  \    echo \n    echo “Will not kill the process(es)” \n    echo \n;;\nesac\n```\n\
  \n所示，case 语句本身没有特别有趣的。有趣的地方在于 case 语句的“yes”部分。在这里，需要杀死用户账户进程。要做到这一点，重新执行 `ps` 命令，这次将输出发送到临时报告文件而不是屏幕。\n\
  \n```bash\nps -u $USER_ACCOUNT > $USER_ACCOUNT_Running_Process.rpt\n```\n\n你可以使用\
  \ `exec` 命令和 `while` 循环来读取报告文件，类似于我们在 `Daily_Archive` 脚本中读取备份配置文件的方法。\n\n```bash\n\
  exec < $USER_ACCOUNT_Running_Process.rpt\nread USER_REC\nwhile [ $? -eq 0 ]\ndo\n\
  ...\n```\n\n在 while 循环内部，使用 `cut` 命令提取进程 ID (PID)。一旦获得 PID，使用带有 `-9` 的 `kill` 来终止。\n\
  \n```bash\nPID=$(echo $USER_REC | cut -d\" \" -f1)\nkill -9 $PID\necho “Killed $PID”\n\
  ```\n\n### 查找文件\n\n当账户被删除时，重新分配所有属于该账户的文件是一个良好的做法。带有 `-u` 选项的 `find` 命令将精确找到任何文件。\n\
  \n```bash\nfind / -user $USER_ACCOUNT > $_FILE\n```\n\n### 移除账户\n\n移除用户时保持谨慎总是好主意。因此，你应该再次询问脚本是否真的想要移除它。\n\
  \n```bash\nLINE1=\"Do you wish to remove the account? [y/n]”\nget_answer\n```\n\n\
  最后，我们达到了脚本的主要目的，实际上删除用户。在这里，你可以使用 `userdel` 命令（见第 6 章）：\n\n```bash\nuserdel $USER_ACCOUNT\n\
  ```\n\n### 创建脚本\n\n记得 `Delete_User` 脚本与用户的交互性很强。因此，包含大量的文字以让用户了解发生的情况是非常重要的。在脚本顶部，声明了\
  \ `get_answer` 和 `process_answer` 函数。然后脚本进入了移除用户的四个步骤。\n\n```bash\n#!/bin/bash\n\
  #Delete_User - Automates the 4 steps to remove an account\n\n###############################################\n\
  # Define Functions\n#####################################\nfunction get_answer {\n\
  #\nunset ANSWER\nASK_COUNT=0\n#\nwhile [ -z \"$ANSWER\" ] # 如果没有给出回答，继续询问。\ndo\n\
  \    ASK_COUNT=$[ $ASK_COUNT + 1 ]\n#\n    case $ASK_COUNT in # 如果用户在分配的时间内没有回答\n\
  \    2)\n        echo\n        echo “Please answer the question.”\n        echo\n\
  \    ;;\n    3)\n        echo\n```\n\n\n\n\n```bash\necho \"One last try...please\
  \ answer the question.\"\necho\n;;\n4)\necho\necho \"Since you refuse to answer\
  \ the question...\"\necho \"exiting program.\"\necho\n#\nexit \n;;\nesac\n#\necho\n\
  #\nif [ -n \"$LINE2\" ]\nthen #打印 2 行\necho $LINE1\necho -e $LINE2 \"\\c\"\nelse\
  \ #打印 1 行\necho -e $LINE1 \"\\c\"\nfi\n#\n# 在超时前允许留 60 秒进行回答\nread -t 60 ANSWER\n\
  done\n# 对变量进行一些简单的清理工作\nunset LINE1\nunset LINE2\n#\n} # 结束 get_answer 函数\n# \n\n\
  #####################################\nfunction process_answer {\n#\ncase $ANSWER\
  \ in\ny|Y|YES|yes|Yes|yEs|yeS|YEs|yES ) \n# 如果用户回答“yes”，则什么都不做。 \n;;\n*) \n# 如果用户回答“yes”以外的任何内容，退出脚本\
  \ \necho \necho $EXIT_LINE1 \necho $EXIT_LINE2\necho \nexit\n;;\nesac\n#\n# 对变量进行一些简单的清理工作\n\
  #\nunset EXIT_LINE1\nunset EXIT_LINE2\n#\n} # 结束 process_answer 函数\n#\n\n##############################################\n\
  # 函数定义结束\n#\n\n############# 主脚本 #####\n# 获取用户账户名称进行检查 \n#\necho \"步骤 #1 - 确定要删除的用户账户名称\
  \ \"\necho\nLINE1=\"请输入您想要从系统中删除的 \" \nLINE2=\"账户用户名：\"\nget_answer\nUSER_ACCOUNT=$ANSWER\n\
  #\n# 让脚本用户再次确认这是否是正确的用户账户 \n# \nLINE1=\"账户 $USER_ACCOUNT 是您想要从系统 \" \nLINE2=\"中删除的账户吗？[y/n]\"\
  \nget_answer\n# \n# 调用 process_answer 函数: \n#     如果用户回答“yes”以外的任何内容，退出脚本\n#\nEXIT_LINE1=\"\
  由于账户 $USER_ACCOUNT 不是 \" \nEXIT_LINE2=\"您想要删除的那个，我们正在退出脚本...\"  \nprocess_answer\n\
  #\n################################################################\n# 检查 USER_ACCOUNT\
  \ 是否确实是系统上的账户 \n# \nUSER_ACCOUNT_RECORD=$(cat /etc/passwd | grep -w $USER_ACCOUNT)\
  \ \n# \nif [ $? -eq 1 ]          # 如果未找到账户，退出脚本 \nthen \n    echo \n    echo \"\
  未找到账户 $USER_ACCOUNT。\" \n    echo \"正在退出脚本...\" \n    echo \n    exit \nfi \n# \n\
  echo \necho \"我找到了这条记录:\" \necho $USER_ACCOUNT_RECORD \necho \n# \nLINE1=\"这是正确的用户账户吗？[y/n]\"\
  \ \nget_answer\n# \n#\n# 调用 process_answer 函数: \n#     如果用户回答“yes”以外的任何内容，退出\nEXIT_1=\"\
  由于账户 $USER_ACCOUNT 不是 \" EXIT_2=\"您想要删除的那个，我们正在退出脚本...\" \nprocess_answer\n##################################\n\
  # 查找属于该用户账户的所有运行进程 \n#\necho\necho \"步骤 #2 - 查找属于该用户账户的进程\"\necho \"$USER_ACCOUNT\
  \ 有以下进程：\"\necho\nps -u $USER_ACCOUNT  # 列出用户进程。 \ncase $? in\n1)  # 该用户账户没有正在运行的进程\n\
  \    echo \"该账户目前没有运行进程。\" \n    echo\n;;\n0)  # 该用户账户正在运行进程。 \n# 脚本用户希望我们杀死这些进程。\
  \ \nunset ANSWER\nLINE1=\"您想让我杀死这些进程吗？[y/n]\" \nget_answer\ncase $ANSWER in    \
  \  \ny|Y|YES|Yes|yS|YEs|ES )  # 如果用户回答“yes”， \n# 用户账户进程。 \necho\n# 接收信号时清理临时文件\n\
  trap \"rm $USER_ACCOUNT_Running_Process.rpt\" SIGTERM SIGINT QUIT \n# 列出用户进程\nps\
  \ -u $USER_ACCOUNT > $USER_ACCOUNT_Running_Process.rpt \nexec < $USER_ACCOUNT_Running_Process.rpt\
  \  # 将报告设为标准输入 \nread USER_PROCESS_REC      # 第一记录将是空的\nread USER_PROCESS_REC\n\
  while [ $? -eq 0 ]\ndo \n# 获取 PID\nUSER_PID=$(echo $USER_PROCESS_REC | cut -d \"\
  \ \" -f1)\nkill -9 $USER_PID\necho \"已杀死进程 $USER_PID\" \nread USER_PROCESS_REC \n\
  done \n# \necho \nrm $USER_ACCOUNT_Running_Process.rpt      # 临时报告。\n;; \n*)   #\
  \ 如果用户回答“yes”以外的任何内容，则不杀死。 \necho \necho \"不会杀死这些进程\" \necho \nesac \nesac\n################################################\n\
  # 创建所有属于用户账户文件的报告\n#\necho\necho \"步骤 #3 - 查找属于该用户账户的文件\"\necho \"正在创建属于 $USER_ACCOUNT\
  \ 所有文件的报告\"\necho \"建议您备份/归档这些文件\"\necho \"然后执行以下操作之一：\" \necho \"1) 删除文件 2) 将所有权更改当前用户\"\
  \necho \"请等待。这可能需要一些时间...\" \nREPORT_DATE=$(date +%m%d) \nREPORT_FILE=\"$USER_ACCOUNT_Files_$REPORT_DATE.rpt\"\
  \ \nfind -user $USER_ACCOUNT > $REPORT_FILE 2>/dev/null \necho\necho \"报告已完成。\"\
  \ \necho \"报告名称: $REPORT_FILE\" \necho \"报告位置: \" \n####################\n# 删除用户账户\n\
  echo\necho \"步骤 #4 - 删除用户账户\"\necho\nLINE1=\"您想从系统内核删除该账户吗？[y/n]\" \nget_answer\n\
  #\n# 调用 process_answer 函数: \n#     如果用户回答“yes”以外的任何内容，退出脚本\nEXIT_LINE1=\"由于您不想删除该账户，”\
  \ \nEXIT_2=\"正在退出脚本...\" \nprocess_answer\n#\necho \"用户账户 $USER_ACCOUNT 已删除\"\n\n\
  $\n\n运行得非常棒！现在你拥有了一个在需要删除用户账户时可以提供帮助的脚本实用程序。更棒的是，你可以修改它来满足你组织的需求。\n\n总结\n\n\n\n\n\
  本章将书中介绍的一些 shell 脚本信息巧妙用于创建 Linux 实用工具。当你负责一个 Linux 系统时，无论是一个大型多用户系统还是你自己的系统，都有很多事情需要关注。与其手动运行命令，不如创建\
  \ shell 脚本实用工具来为你完成工作。\n\n本章演示了如何使用 `du` 命令确定磁盘空间占用情况。随后使用 `sed` 和 `gawk` 命令从数据中提取特定信息。将命令的输出传递给\
  \ `sed` 和 `gawk` 来解析数据是 shell 脚本中的一项常用功能，因此了解如何这样做是一个好主意。\n\n接下来的部分将引导你如何使用 shell\
  \ 脚本对 Linux 系统上的数据文件进行归档和备份。`tar` 命令是一个用于归档数据的常用命令。本章展示了如何在 shell 脚本中使用它创建归档文件，以及如何在归档目录中管理这些归档文件。\n\
  \n我们在章节末尾介绍了使用 shell 脚本完成删除用户账户所需的四个步骤。为脚本中重复的 shell 代码创建函数可以使代码更容易易读和修改。该脚本结合了许多不同的结构化命令，例如\
  \ `case` 和 `while` 命令。本章演示了针对 `cron` 表的脚本与交互式脚本在结构上的差异。\n\n现在，我们将转向更高级的 shell 脚本，它们将帮助解决更复杂的\
  \ Linux 系统问题。\n\n# 第 27 章\n\n## 高级 shell 脚本\n\n### 本章内容\n\n* 监控系统统计\n* 问题跟踪数据库\n\
  \n在本章中，我们将学习在 shell 脚本中使用更高级的方法。这些技术允许你以各种不同的方式处理系统上的脚本。\n\n## 监控系统统计数据\n\n`bash`\
  \ shell 中有很多实用工具可以帮助你监控 Linux 系统性能和资源使用。遗憾的是，很难找到时间使用它们，特别是当你有多个系统需要管理时。创建几个 shell\
  \ 脚本来利用这些实用工具的输出创建报告，是利用时间的极佳方式。\n\n本节将引导你创建一些高级 shell 脚本，协助你监控各种系统性能统计数据。\n\n###\
  \ 系统快照报告\n\n通过快照报告随时了解系统性能和资源使用是一种很好的方法。快照报告是系统在特定时间点的统计数据快照。这类报告是系统状况的“执行摘要”。\n\
  \n创建此快照报告的脚本可以根据你需要的运行次数，以获取图片。更好的是，脚本将通过电子邮件向你发送报告。\n\n#### 所需函数\n\n你需要使用四个不同的\
  \ bash shell 命令来创建快照报告：`uptime`、`df`、`free` 和 `ps`。这些不同的命令将为你提供所需的统计数据。\n\n####\
  \ 运行时\n\n第一个命令 `uptime` 是最基础的系统统计命令：\n\n```\n$ uptime\n14:15:23 up 1 day, 5:10,\
  \ 3 users, load average: 0.66, 0.54, 0.33\n```\n\n`uptime` 命令提供了几个我们可以使用的不同基本信息：\n\
  \n* 当前时间\n* 系统运行的天数、小时和分钟\n* 当前登录系统的用户数\n* 一分钟、五分钟和十五分钟的平均负载\n\n系统的运行时间是我们获取快照报告的一个很棒统计数据。然而，在尝试获取此统计数据时存在一个问题。你的系统可能只运行了几分钟，也可能运行了几天。（传闻甚至有些\
  \ Linux 服务器已经运行多年！）以下是一个运行了几个小时的系统的 `uptime` 命令输出：\n\n```\n$ uptime\n18:00:20 up\
  \ 8:55, 3 users, load average: 0.62, 0.45, 0.37\n```\n\n这里是一个运行了数天的系统的 `uptime`\
  \ 输出：\n\n```\n$ uptime\n13:29:32 up 3 days, 4:24, 4 users, load average: 1.44, 0.83,\
  \ 0.46\n```\n\n如你所示，从这个列表中收集正确的统计数据将很困难。`gawk` 命令（见第 16 章）可以毫无问题地为运行了几天的系统完成这项工作：\n\
  \n```\n$ uptime | gawk '{print $2,$3,$4,$5}'\nup 3 days, 4:27,\n```\n\n但是，当同样的 `gawk`\
  \ 命令用在仅运行了几个小时的系统时，会发生这种情况：\n\n```\n$ uptime | gawk '{print $2,$3,$4}'\nup 8:59,\
  \ 3 users,\n```\n\n为了解决这个困境，你可以使用 `gawk` 的一个高级功能——`if` 语句（见第 19 章）。如果系统运行了几天，`gawk`\
  \ 变量 `$4` 将包含单词“days”。为了测试 `$4` 是否为字符串“days”，你的 `gawk` 命令应该像这样：\n\n```\n$ uptime\
  \ | > gawk '{if ($4 == \"days\") {print $2,$3,$4,$5} else {print $2,$3}}'\nup 9:23,\n\
  ```\n\n你可能会遇到系统只运行了一天的情况。因此，你还需要测试字符串“day”。布尔运算符 `or`（`||`）可以解决问题。因此，你的 `gawk` 命令现在看起来像这样：\n\
  \n```\ngawk '{if ($4 == \"days\" || $4 == \"day\") {print $2,$3,$4,$5} else {print\
  \ $2,$3}}'\n```\n\n现在输出中那些难看的逗号呢？使用 `sed` 命令，你可以简单地将它们替换为空格。\n\n```\n$ uptime |\
  \ sed -n '/,/s/, /gp' | > gawk '{if ($4 == \"days\" || $4 == \"day\") {print $2,$3,$4,$5}\
  \ else {print $2,$3}}'\n```\n\n这看起来好多了。为了万无一失，让我们在一个运行时间更长的系统上测试该命令：\n\n```\n$ uptime\
  \ | sed -n '/,/s/, /gp' | > gawk '{if ($4 == \"days\") {print $2,$3,$4,$5} else\
  \ {print $2,$3}}'\n```\n这看起来不错。现在，我们现在继续使用另一个实用工具来创建快照。\n\n#### 磁盘占用\n\n帮助你创建快照的下一个命令是\
  \ `df`。`df` 命令显示系统中所有实际和虚拟磁盘的统计数据。\n\n```\n$ df\nFilesystem     Blocks      Used\
  \ Avail Use% Mounted on\ndev/sda2      307465076 18593036 10591634  64% /\nnone\
  \           5031676         0 5031676   0% /dev/shm\ntmpfs          1624000    \
  \     0 1624000   0% /run\ntmpfs          40960000        0 40960000   0% /dev/shm\n\
  devfs          4096000         0 4096000   0% /dev\n```\n\n`df` 命令显示当前的磁盘空间统计。你可以将单个磁盘名称传递给\
  \ `df` 命令以检索特定磁盘的信息。为了让信息更易读，在命令中添加 `-h`（人类可读）选项：\n\n```\n$ df -h /dev/sda2\nFilesystem\
  \      Size  Used Avail Use% Mounted on\n/dev/sda2       294G  178G  102G  64% /\n\
  ```\n\n`sed` 和 `gawk` 命令再次帮助你解析并打印所需的信息。由于我们不需要包含 `df` 命令输出的标题行，使用 `sed` 搜索数据行的特有字符串。字符串\
  \ `% /` 只出现在数据行中。为了解决这个问题，在正斜杠之前加上转义字符 `\\`。这将允许 `sed` 将正斜杠识别为字符串的一部分并正确搜索。最后，使用\
  \ `gawk` 打印磁盘使用百分比，它位于 `gawk` 变量 `$5` 中。整个命令行看起来像这样：\n\n```\n$ df -h /dev/sda2 |\
  \ sed -n '% \\//p' | gawk '{print $5}'\n```\n\n64%\n\n这效果很好。现在让我们继续获取系统内存的快照。\n\n\
  #### 内存占用\n\n有几个不同的 bash shell 命令可以获取内存统计数据。在我们的目的中，我们将专注于 `free` 命令。\n\n\n\n\n\
  `free` 命令显示物理内存的总量，以及其中空闲和已分配量。它还会显示交换内存相同的数据，并包含内核缓冲区。这里是 `free` 命令的输出示例：\n\n```\n\
  $ free \n\n      total        used      free      shared  buffers  cached\nMem:\
  \   1017436      890148      127288      0           31536      484100\n-/+ buffers/cache:\
  \  374512    642924 \nSwap:   200776         0           200776 \n```\n\n由于我们提取了磁盘使用率的百分比统计，因此对内存使用率这样做也是个好主意。然而，你会发现\
  \ `free` 命令并没有提供任何使用百分比！没问题。使用 `gawk` 命令，你可以计算出百分比。\n\n`free` 命令的输出已经通过空格很好地分隔，因此\
  \ `gawk` 可以可以直接通过变量名引用计算所需的两个字段。`$2` 变量是可用内存总量，`$3` 变量是已用内存总量。通过将 `$3` 除以 `$2`，`gawk`\
  \ 将为你提供内存使用的百分比：\n\n```\n$ free | sed -n '2p' | gawk 'x = ($3 /$2) {print x}'\n\
  0.87165\n```\n\n注意命令中使用了 `sed` 来从 `free` 命令的输出中提取第二行数据，这允许你“丢弃”标题行。产生的数字仍然不符合报告所需的格式。你可以通过将数字乘以\
  \ 100 并使用 `gawk` 的整数函数 `int` 进行进行截断来清理百分比。最后，使用 `sed` 加上百分比符号：\n\n```bash\n$ free\
  \ | sed -n '2p' | gawk 'x = int(($3 /$2)*100) (print x}' | sed 's/$/%/'\n87%\n```\n\
  \n现在内存统计数据已经是你报告所需的格式了。让我们进入最后一个要包含的项目——僵尸进程！\n\n## 僵尸进程\n\nLinux 系统上的僵尸进程是处于中间状态的进程。该进程已经完成了它的工作，但由于各种原因卡在未完成的状态。因此，就像它的名字一样，僵尸进程既不是死的不是活的。\n\
  \n虽然 Linux 系统上一两个僵尸进程并不什么，但多个僵尸进程会导致问题。僵尸进程持有一个进程 ID（PID），在僵尸被杀死之前，它不会释放回进程 ID 表。因此，另一个需要关注的系统统计是当前僵尸进程的数量。\n\
  \n使用 `ps` 命令可以轻松实现（见第 4 章）。`ps` 命令结合 `-al` 选项将返回系统上的所有进程及其进程状态。状态 `Z` 表示该进程是僵尸进程：\n\
  \n```\n$ ps -al \nF S  UID  PID PPID C PRI NI ADDR SZ W TTY TIME CMD\n0 T  1000\
  \  2174  2031 C  0  0  ...    -   pts/0 00:00 mail\n0 T  1000  2175  2031 C  0 \
  \ 0  ...    -   pts/0 00:00 mail\n1 Z  1000  8779  8797 S  0  0  ...    -   pts/0\
  \ 00:00 zombie <defunct>\n0 R  1000  8781  8051 S  0  0  ...    -   pts/5 00:00\
  \ ps\n```\n\n再次，`gawk` 命令将帮助你。将 `ps` 的输出通过到 `gawk`，你只需要打印 `$2` 和 `$4` 就可以获取进程 ID\
  \ 及其状态。然而，你只想显示僵尸进程，所以使用 `grep` 搜索输出是可行的。所需的命令如下：\n\n```\n$ ps -al | gawk '{print\
  \ $2,$4}' | grep Z\n```\n\n这对于快照报告来说效果非常完美。现在你已经拥有了所有的部分，让我们把它们组合成一个运行的脚本。\n\n##\
  \ 创建快照脚本\n\n你首先需要设置的是用于脚本正文的各种变量。这些变量应该包含在脚本顶部，以便于修改。\n\n我们的快照报告需要一个时间戳，因此将包含一个日期变量\
  \ `DATE`。对于性能统计数据，你可能有多个磁盘需要收集。因此，数组变量 `DISKS_TO_MONITOR` 将包含你系统中所有磁盘的列表。由于不同的管理员设置了不同的邮件实用程序，让我们包含一个邮件变量\
  \ `MAIL` 来指定本地使用的实用程序（见第 25 章）。此外，由于特定系统的 `mail` 命令可能位于独特的位置，你应该使用 `which` 命令（见第\
  \ 23 章）来查找 `mail` 命令的位置。报告发送给给，包含在变量 `MAIL_TO` 中。最后，报告的名称设置在变量 `REPORT` 中。\n\n快照脚本的变量部分如下：\n\
  \n```bash\n# Set Script Variables\nDATE=$(date +%m%d%Y)\nDISKS_TO_MONITOR(\"/dev/sda1\
  \ /dev/sda2\")\nMAIL=$(which mutt)\nMAIL_TO=user\nREPORT=/home/Documents/$DATE.rpt\n\
  ```\n\n由于你是在同一个脚本中生成报告并发送出去，你需要保存并在稍后恢复文件描述符（见第 14 章）。保存文件描述符并将输出重定向到 `STDOUT` 的\
  \ shell 命令如下：\n\n```bash\n# Create Report File\nexec 3>&1 # Save file descriptor\n\
  exec 1>$REPORT # redirect output to rpt file.\n```\n\n在 `mail` 命令之前的后续代码将 `STDOUT`\
  \ 恢复到其保存的文件描述符：\n\n```bash\n# Restore File Descriptor & Mail Report\nexec 1>&3 #\
  \ Restore output to STDOUT\n```\n\n将所有部分组合在一起，脚本现在看起来如下：\n\n```bash\n#!/bin/bash\n\
  # Snapshot_Stats - produces a report for system stats\n################################\n\
  # Set Script Variables\nDATE=$(date +%m%d%Y)\nDISKS_TO_MONITOR(\"/dev/sda1 /dev/sda2\"\
  )\nMAIL=$(which mutt)\nMAIL_TO=user\nREPORT=/home/user/Documents/Snapshot_Stats_$DATE.rpt\n\
  \n################################\n# Create Report File\nexec 3>&1 # Save file\
  \ descriptor\nexec 1>$REPORT # redirect output to rpt file.\n\n################################\n\
  echo\necho -e \"\\t\\tDaily System Report\"\necho\n\n################################\n\
  # Date Stamp\necho -e \"Today is $(date +%m/%d/%Y)\"\n\n################################\n\
  # 1) Gather Uptime Statistics\necho -e \"System has been \"\nuptime | sed -n '//p'\
  \ | awk '{if($4==\"day\" || $4==\"days\"){print $2,$3}'\n\n################################\n\
  # 2) Gather Disk Usage\nfor DISK in $DISKS_TO_MONITOR; do\n    echo -e \"$DISK usage:\"\
  \n    df -h $DISK | sed -n '2p' | awk '{print $5}'\ndone\n\n################################\n\
  # 3) Gather Memory Statistics\necho\necho -e \"Memory Usage:\"\nfree | sed -n '2p'\
  \ | awk 'x = int(($3 /$2)*100) {print x}' | sed 's/$/%'\n\n################################\n\
  # 4) Gather Number of Zombie Processes\necho\nZOMBIE_CHECK=$(ps -al | awk '{print\
  \ $2,$4}' | grep Z)\nif [ \"$ZOMBIE_CHECK\" = \"\" ]; then\n    echo \"No Zombie\
  \ Process on System at this Time\"\nelse\n    echo \"Current System Zombie Processes\"\
  \n    echo \"$ZOMBIE_CHECK\"\nfi\n\n################################\n# Restore\
  \ File Descriptor & Mail Report\nexec 1>&3 # Restore output to STDOUT\n$MAIL -a\
  \ $REPORT -s \"System Statistics Report for $DATE\" -- $MAIL_TO < /dev/null\n\n\
  ################################\n# Clean up\nrm -f $REPORT\n```\n\n现在，测试新的快照报告脚本并看看它的表现如何。\n\
  \n```bash\n$ \n$ ./Snapshot_Stats\n```\n\n那里没什么特别的。但如果你进入你的电子邮件客户端（在本例中是 Mutt），你将看到快照报告的输出，如图\
  \ 27.1 所示。\n\n\n\n\n# 图 27.1 在 mutt 中显示快照报告\n\n![27.1](img/c27f001.jpg)\n\n快照报告（snapshot\
  \ report）对于让你了解系统的整体健康状况非常有帮助。然而，这种类型的报告无法让你看到随时间变化的性能和资源使用方面的各种趋势。因此，让我们来看一组将为你提供此类类型信息的脚本。\n\
  \n## 系统统计报告\n\n任何 Linux 系统的核心统计数据都是 CPU 和内存使用情况。如果这些值开始失控，问题很快就会出现。本节将演示如何编写脚本，以帮助你在一段时间内监控并跟踪\
  \ Linux 系统上的 CPU 和内存使用情况。\n\n### 所需的函数\n\n第一个脚本的目的是将性能统计数据收集到一个数据文件中以备后用。因此，你需要确切确定你想通过脚本收集哪些数据，以及使用哪些命令。\n\
  \n对于此脚本，我们将再次使用 `uptime` 命令。但这次，我们不再获取系统运行的时间，而是获取系统上的用户数量。用户数量直接影响 CPU 和内存的使用率。我们将使用\
  \ `sed` 在 `uptime` 命令的输出文本中搜索“users”一词。在当前行找到该词后，让 `sed` 删除该行的剩余文本，包括“users”一词。这将把你想要的统计数据——系统上的用户数量——留为该行的最后一项。要获取该最后一个数据项，你可以使用\
  \ `gawk` 变量 `NF`。整个命令行及其输出将如下所示：\n\n```\n$ uptime | sed 's/users.*$//' | gawk '{print\
  \ $NF}'\n```\n\n系统负载（System load）是另一个你可以从 `uptime` 命令输出中解析出的良好统计数据。系统负载显示了系统中 CPU\
  \ 平均忙碌程度。平均负载为 1 意味着单个 CPU 一直忙碌。然而，如果你的系统中有两个 CPU，这意味着每个 CPU 的忙碌程度仅为 50%。`uptime`\
  \ 命令的系统负载提供了过去一分钟、五分钟和过去十五分钟的平均值。我们将获取最后十五分钟的平均系统负载统计数据，它方便地位于输出文本行的末尾：\n\n```\n\
  $ uptime | gawk '{print $NF}'\n```\n\n0.19\n\n另一个提取系统信息的强大命令是 `vmstat`。这里是 `vmstat`\
  \ 命令的输出示例：\n\n```\n$ vmstat \n\nprocs -----------memory----------  ---swap--  -----io----\
  \  -system--  ----cpu---- \n\nr  b     swpd   free   buff  cache   si  so      bi\
  \  bo    in  cs    us  sy  id  wa \n0  0   11328  42608  165444  502500     0  \
  \ 0      1   2     68  10    1   0 99   0 \n```\n\n第一次运行 `vmstat` 命令时，它显示的是自上次重启以来的平均值。要获取当前统计数据，必须带有命令行参数运行\
  \ `vmstat` 命令：\n\n```\n$ vmstat 1 2 \n\nprocs -----------memory----------  ---swap--\
  \  -----io----  -system--  ----cpu---- \n\nr  b     swpd   free   buff  cache  \
  \ si  so      bi  bo    in  cs    us  sy  id  wa \n0  0   11328  43112  165452 \
  \ 502444     0   0      1   2     68  10    1   0 99   0 \n0  0   11328  40540 \
  \ 165452  505064     0   0      0   0     58  177    1   1 98   0 \n```\n\n第二行包含\
  \ Linux 系统的当前统计数据。如你所见，`vmstat` 命令的输出有些晦涩。表 27.1 vmstat 输出符号\n\n| 符号 |  |\n| :---\
  \ | :--- |\n| r | 等待 CPU 时间的进程数 |\n| b | 处于不可中断睡眠状态的进程数 |\n| swpd | 使用的虚拟内存量（MB）\
  \ |\n| free | 未使用的物理内存量（MB） |\n| buff | 用作缓冲区内存量（MB） |\n| cache | 用作缓存空间内存量（MB）\
  \ |\n| si | 从磁盘换入的内存量（MB） |\n| so | 换出磁盘的内存量（MB） |\n| bi | 从块设备接收的块数 |\n| bo | 发送到块设备的块数\
  \ |\n| in | 每秒 CPU 中断次数 |\n| cs | 每秒 CPU 上文切换次数 |\n| us | 运行非内核代码消耗的 CPU 时间百分比 |\n\
  | sy | 运行内核代码消耗的 CPU 时间百分比 |\n| id | 空闲 CPU 时间百分比 |\n| wa | 等待 I/O 消耗的 CPU 时间百分比\
  \ |\n\n信息很多。空闲内存和 CPU 空闲时间百分比统计数据就能满足我们的需求。\n\n你可能已经注意到 `vmstat` 命令的输出包含了表头信息，这显然是你数据中不需要的。要解决这个问题，使用\
  \ `sed` 命令仅显示包含数值的行：\n\n```\n$ vmstat 1 2 | sed -n '/[0-9]/p' \n```\n\n1 0 11328\
  \ 38524 165476 506548 0 0 1 2 68 10 1 0 99 0 \n0 0 11328 35820 165476 509528 0 0\
  \ 0 0 82 160 1 1 98 0 \n\n这好多了，但现在你只需要获取第二行数据。再次调用 `sed` 可以解决该问题：\n\n```\n$ vmstat\
  \ 1 2 | sed -n '/[0-9]/p' | sed -n '2p'\n```\n\n0 0 11328 36060 165484 509560 0\
  \ 0 0 0 58 175 1 1 98 0\n\n最后，你会希望为每条记录标记上日期和时间。只需使用 `date` 命令并指定格式：\n\n```\n$ date\
  \ +\"%m/%d/%Y %H:%M:%S\"\n```\n\n12/09/2010 13:55:31\n\n## 创建脚本\n\n一旦准备好了所有函数，用于收集数据的脚本非常简单。它如下：\n\
  \n```bash\n#!/bin/bash\n# Capture_Stats - 收集系统统计数据\n\n######################\n#\
  \ 设置脚本变量\n\nREPORT_FILE=/home/user/capstats.csv\nDATE=$(date +\"%m/%d/%Y\")\nTIME=$(date\
  \ +\"%H:%M:%S\")\n\n####################################\n# 收集性能统计数据\n\nUSERS=$(uptime\
  \ | sed 's/users.*$// | gawk '{print $NF}')\nLOAD=$(uptime | gawk '{print $NF}')\n\
  FREE=$(vmstat 1 2 | sed -n '/[0-9]/p' | sed -n '2p' | gawk '{print $4}')\nIDLE=$(vmstat\
  \ 1 2 | sed -n '/[0-9]/p' | sed -n '2p' | gawk '{print $15}')\n\n#####################################\n\
  # 将统计数据发送到报告文件\n\necho \"$DATE,$TIME,$USERS,$LOAD,$FREE,$IDLE\" >> $REPORT_FILE\n\
  ```\n\n此脚本从 `uptime` 和 `vmstat` 命令中解析统计数据并将其放入变量。然后将这些变量用逗号分隔连同日期时间戳写入日志文件 `REPORT_FILE`。注意使用重定向符号\
  \ `>>` 将数据附加文件中。这允许你根据需要持续向文件中添加数据。\n\n在创建脚本后，在从 cron 表中定期运行之前，你应该先从命令行对其进行测试：\n\
  \n```bash\n$ cat capstats.csv\n```\n\n12/09/2010,9:06:50,2,0.29,645988,99 \n12/09/2010,9:07:55,2,0.28,620252,100\
  \ \n12/09/2010,9:40:51,3,0.37,474740,100 \n\n\n\n\n\n12/10/2010,14:36:46,3,0.30,46640,98\
  \ \n\n12/12/2010, 7:16:26,4,0.25,27308,98 \n\n12/12/2010,13:28:53,4,0.42,58832,100\
  \ \n\n下一个脚本将根据 CSV 数据生成报告并将其发送给相关的个人。由于报告脚本是一个独立的脚本，你可以让 `cron` 按照与 `Capture_Stats`\
  \ 脚本不同的时间表运行它。这让你在报告之前的捕获数据量上具有灵活性。\n\n## 生成报告脚本\n\n现在你已经有了一个充满原始数据的文件，可以开始编写生成精美报告的脚本了。完成此任务的最佳工具是\
  \ `gawk` 命令。\n\n`gawk` 命令允许你从 CSV 文件中提取原始数据，并以任何想要的方式呈现。首先，在命令行中测试这一点，使用由 `Capture_Stats`\
  \ 脚本创建的新 `capstats.csv` 文件：\n\n```bash\n$ cat capstats.csv | gawk -F, '{printf \"\
  %s %s - %s\\n\", $1, $2, $4}'\n```\n\n12/09/2010 9:06:50 - 0.29 \n12/09/2010 9:07:55\
  \ - 0.28 \n12/09/2010 9:40:51 - 0.37 \n12/10/2010 14:36:46 - 0.30 \n12/12/2010 7:16:26\
  \ - 0.25 \n12/12/2010 13:28:53 - 0.42 \n\n你需要使用 `gawk` 命令的 `-F` 选项来将逗号定义为数据中的字段分隔符。之后，你可以使用\
  \ `printf` 功能获取每个单独的数据字段并按需要显示它们。\n\n对于报告，我们将使用 HTML 格式。多年来，HTML 一一直是格式化网页的标准方法。它使用简单的标签来界定网页内的数据类型。然而，HTML\
  \ 不仅用于网页。你经常会在电子邮件中发现 HTML。取决于你使用的邮件实用程序（参见第 25 节），你可能可以或可能无法查看嵌入的 HTML 邮件文档。更好的解决方案是创建\
  \ HTML 报告并将其作为附件附加到电子邮件中。\n\n使用 HTML 创建报告允许你通过最少的工作生成格式良好的报告。显示报告的程序将完成格式化和显示报告的所有繁重工作。你只需要插入适当\
  \ HTML 标签来格式化数据。\n\n在 HTML 中显示电子表格样式数据最简单的方法是使用 `<table>` 标签。`<table>` 标签允许你创建一个包含行和单元格的表格，单元格在\
  \ HTML 中被称为“划分（divisions）”。你使用 `<tr>` 标签定义行的开始，使用 `</tr>` 标签定义行的结束。同样，你使用 `<td>`\
  \ 和 `</td>` 标签对来定义单元格。\n\n一个完整表格的 HTML 如下所示：\n\n```html\n<html>\n<body>\n  <h2>Report\
  \ title</h2>\n  <table border=\"1\">\n    <tr>\n      <td>Date</td><td>Time</td><td>Users</td>\n\
  \      <td>Load</td><td>Free Memory</td><td>%CPU Idle</td>\n    </tr>\n    <tr>\n\
  \      <td>12/09/2010</td><td>11:00:00</td><td>4</td>\n      <td>0.26</td><td>57076</td><td>87</td>\n\
  \    </tr>\n  </table>\n</body>\n</html>\n```\n\n每条数据记录都是一对 `<tr>...</tr>` 标签的一部分。每个数据字段都位于其单独的\
  \ `<td>...</td>` 标签对内。\n\n当你在浏览器中显示 HTML 报告时，浏览器会自动为你创建表格，如图 27.2 所示。\n\n图 27.2\
  \ 在 HTML 表格中显示数据\n\n![27.2](img/c27f002.jpg)\n\n对于脚本，你只需要使用 `echo` 命令生成 HTML 标题代码，使用\
  \ `gawk` 命令生成数据 HTML 代码，然后再次使用 `echo` 命令关闭表格。\n\n这里是 `Report_Stats` 脚本，它将生成性能报告并将其发送：\n\
  \n```bash\n#!/bin/bash \n\n# \n# Report__Stats - 从捕获的性能统计中生成报告 \n\n########################################################\
  \ \n# 设置脚本变量 \n# \nREPORT_FILE=/home/user/Documents/capstats.csv \nTEMP_FILE=/home/user/Documents/capstats.html\
  \ \n# \nDATE='date +m/%d/%Y' \n# \nMAIL='which mutt' \nMAIL_TO=user \n# \n##########################################\
  \ \n# 创建报告页头 \n# \necho \"<html><body><h2>Report for $DATE</h2>\" > $TEMP_FILE \n\
  echo \"<table border=\\\"1\\\">\" >> $TEMP_FILE \necho \"&lt;tr&gt;<td>Date</td><td>Time</td><td>Users</td></td>\"\
  \ >> $TEMP_FILE \necho \"&lt;td&gt;Load</td><td>Free Memory</td><td>%CPU Idle</td>&lt;/tr&gt;;\"\
  \ >> $TEMP_FILE \n# \n########################################## \n# 将性能统计数据放入报告\
  \ \n# \ncat $REPORT_FILE | gawk -F, '{ \n  printf \"<tr><td>%s</td><td>%s</td><td>%s</td>\"\
  , $1, $2, $3; \n  printf \"<td>%s</td><td>%s</td><td>%s</td>\\n\\u0001n&lt;/tr&gt;\\\
  n\", $4, $5, $6; \n}' >> $TEMP_FILE \n# \necho \"</table></body>\" >> $TEMP_FILE\
  \ \n# \n########################################## \n# 发送报告 \n# \n$MAIL $MAIL_TO\
  \ < $TEMP_FILE \n# \nrm $TEMP_FILE\n```\n\n\n\n\n在创建一个空数据库后，现在可以添加表了。我们将创建一个名为 `problem_logger`\
  \ 的表，包含四个字段来存储问题信息。此外，你还需要一个名为 `id_number` 的字段作为数据库的主键。表 27.2 显示了所需的五个字段。\n\n###\
  \ 表 27.2 Problem_Logger 表的字段\n\n| 字段名 | 数据类型 |\n| :--- | :--- |\n| `id_number` |\
  \ integer |\n| `report_date` | date |\n| `fixed_date` | date |\n| `prob_symptoms`\
  \ | text |\n| `prob_solutions` | text |\n\n在 `mysql` 中创建此表其实非常简单：\n\n```mysql\n\
  mysql> USE Problem_Trek; \nDatabase changed \nmysql> \nmysql> CREATE TABLE problem_logger\
  \ ( \n-> id_number int not null, \n-> report_date Date, \n-> fixed_date Date, \n\
  -> prob_symptoms text, \n-> prob_solutions text, \n-> primary key (id_number));\
  \ \nQuery OK, 0 rows affected (0.04 sec) \n```\n\n注意，执行 `USE` 命令是为了确保我们在正确的数据库中创建新表。让我们再次使用\
  \ `DESCRIBE` 命令查看查看新的 `problem_logger` 表。这是一种非常清晰的方式来显示添加到表中的字段：\n\n```mysql\nmysql>\
  \ DESCRIBE problem_logger; \n+----------------+---------+------+-----++-------+\
  \ \n| Field           | Type    | Null | Key | Default | Extra | \n+----------------+---------+------+-----++-------+\
  \ \n| id_number       | int(11) | NO   | PRI | NULL    |       |\n| report_date\
  \     | date    | YES  |     | NULL    |       |\n| fixed_date      | date    |\
  \ YES  |     | NULL    |       |\n| prob_symptoms   | text    | YES  |     | NULL\
  \    |       |\n| prob_solutions  | text    | YES  |     | NULL    |       |\n+----------------+---------+------+-----++-------+\
  \ \n5 rows in set (0.01 sec) \n```\n\n到目前为止，我们必须使用 root 账户创建数据库和表。现在这些步骤已经完成，你的工作不再需要\
  \ root 账户了。正如你在第 23 章中所学的，使用 root 账户运行数据库脚本并不是良好做法。因此，你需要为数据库添加一个具有适当权限的新账户。该账户将供脚本用于访问\
  \ `Problem_Trek` 数据库：\n\n```mysql\nmysql> GRANT SELECT,INSERT,UPDATE ON Problem_Trek.*\
  \ TO\n-> cbres IDENTIFIED BY 'test_password';\nQuery OK, 0 rows affected (0.03 sec)\n\
  ```\n\n一旦你为数据库添加了新用户账户，请务必进行测试：\n\n```bash\nmysql Problem_Trek -u cbres -p\n```\n\
  \n### 读取表信息和列名\n你可以通过在 MySQL 监控器中使用 `-A` 关闭此功能以加快启动。命令以 `;` 或 `\\g` 结束。\n\n```mysql\n\
  mysql>\n```\n\n新账户运行完美！现在再最后一步，你就可以开始为我们的数据库编写所需的函数了。使用你喜爱的文本编辑器创建一个特殊的配置文件 `$HOME/.my.cnf`，其中包含为用户账户设置的密码。这将允许脚本访问\
  \ `mysql` 而无需在脚本中包含密码。\n\n```bash\ncat $HOME/.my.cnf\npassword=test_password\n```\n\
  \n别忘记限制它的访问权限：\n\n```bash\nchmod 400 $HOME/.my.cnf\n```\n\n现在 `Problem_Trek` 数据库已经创建，并为它设置了适当的访问权限。你准备好开始处理数据库了。记录问题\n\
  跟踪问题的第一步是记录它的症状。因为使用 `mysql` 命令记录问题可能非常耗时，我们将通过在其周围封装一个易于使用的脚本来简化过程。\n\n### 所需函数\n\
  要将问题信息放入你的 `problem_logger` 表中，你可以使用 `INSERT` 命令（见第 23 章）。要向 `problem_logger` 表中插入新记录，你需要执行以下命令：\n\
  \n```bash\nmysql Problem_Trek -u cbres -p\n```\n\n```mysql\nmysql> INSERT INTO problem_logger\
  \ VALUES (\n-> 101211322,\n-> 20101211,\n-> 0,\n-> \"When trying to run script Capture_Stats,\
  \ getting message: bash:./Capture_Stats: Permission denied\",\n);\nQuery OK, 1 row\
  \ affected (0.02 sec)\n```\n\n这非常简单。你可以使用 `SELECT` 命令查看你刚刚放入表中的记录。通过为 `WHERE` 指定新记录的\
  \ ID，将显示刚刚输入的那条记录：\n\n```mysql\nmysql> SELECT * FROM problem_logger WHERE id_number=101211322;\n\
  +-----------+-------------+------------+---------------++\n| id_number | report_date\
  \ | fixed_date | prob_symptoms | prob_solutions |\n+-----------+-------------+------------+---------------++\n\
  | 101211322 | 2010-12-11 | 0000-00-00 | When trying to run script Capture_Stats,\
  \ getting message: bash:./Capture_Stats: Permission denied| |\n+-----------+-------------+------------+---------------++\n\
  1 row in set (0.00 sec)\n```\n\n虽然你可以看到输入的记录，但在这种格式下很难阅读数据。为了让记录更易读，你可以在命令末尾添加 `\\\
  G` 而不是分号（`;`）：\n\n```mysql\nmysql> SELECT * FROM problem_logger WHERE id_number=101211322\\\
  G\n*************************** 1.row *****************\nid_number: 101211322\nreport_date:\
  \ 2010-12-11\nfixed_date: 0000-00-00\nprob_symptoms: When trying to run script Capture_Stats,\
  \ getting message: bash:./Capture_Stats: Permission denied\nprob_solutions: \n1\
  \ row in set (0.00 sec)\n```\n\n这看起来好多了，并且在脚本中运行良好。那两个 `mysql` 命令是脚本所需的主要函数。因此，我们可以开始构建\
  \ `Record_Problem` 脚本。\n\n### 创建脚本\n在第 23 章中，你学习了使用 `which` 命令在你的特定系统上查找 `mysql`\
  \ 命令，然后将其分配给环境变量是明智之举。你可以更进一步，为 `mysql` 添加数据库名称和用户账户：\n\n```bash\nMYSQL='which mysql'\
  \ \"Problem_Trek -u cbres\"\n```\n\n`Record_Problem` 是一个交互式脚本。为了保持简单，你可以通过提问来获取所需信息。随着脚本获取答案，它会将它们分配给各种变量。一旦收集了所有数据，你就可以使用变量名配合\
  \ `INSERT` 命令将信息输入数据库。这样一来，脚本用户就可以完全不理会必要的 `mysql` 命令了：\n\n```bash\nINSERT INTO\
  \ problem_logger VALUES (\n$ID_NUMBER,\n$REPORT_DATE,\n$FIXED_DATE,\n\"$PROB_SYMPTOMS\"\
  ,\n\"$PROB_SOLUTIONS\"\n);\n```\n\n`ID_NUMBER` 变量将用于表中的主键字段。因为它是主键字段，每个记录问题的 ID\
  \ 编号需要是唯一的。为了给脚本用户方便，应该使用自动生成的 ID。为了保持唯一性，你可以使用当前日期和时间的组合来产生必要的 10 位键：\n\n```bash\n\
  ID_NUMBER='date +%y%m%d%H%M'\n```\n\n由于此脚本仅用于记录问题，你并不一定有 `FIXED_DATE` 和 `PROB_SOLUTIONS`\
  \ 变量的数据。因此，在将记录插入表之前，将这两个变量都设置为适当的空值：\n\n```bash\n# 现在将固定日期和问题解决方案设置为空\nFIXED_DATE=0\n\
  PROB_SOLUTIONS=\"\"\n```\n\n为了显示问题记录添加成功，向脚本中添加一个 `SELECT` 语句。为了防止显示整个的内容，`WHERE`\
  \ 命令将使用 `ID_NUMBER` 变量只选择刚刚添加的记录：\n\n```bash\nSELECT * FROM problem_logger WHERE\
  \ id_number=$ID_NUMBER\\G\n```\n\n将所有这些部分组合将得到如下脚本：\n\n```bash\n#!/bin/bash\n#\n\
  \n# Record_Problem - 在数据库中记录系统问题\n######################################################\n\
  # 确定 mysql 位置并存入变量\n#\nMYSQL='which mysql' \"Problem_Trek -u cbres\"\n#\n```\n\n\
  \n\n\n# 创建记录 ID 与报告日期\n\n```bash\nID_NUMBER='date +y%m%d%H%M'\nREPORT_DATE='date\
  \ +Y%m%d'\n```\n\n## 获取要存入表格的信息\n\n```bash\necho\necho -e “简要描述问题及其症状: \\c”\nread\
  \ ANSWER\nPROB_SYMPTOMS=$ANSWER\n\n# 暂时将固定日期和问题解决方案置为空\nFIXED_DATE=0\nPROB_SOLUTIONS=\"\
  \"\n```\n\n## 将获取的信息插入表格\n\n```bash\necho\necho “问题记录如下：”\n$MYSQL <<EOF\nINSERT\
  \ INTO problem_logger VALUES (\n  $ID_NUMBER,\n  $REPORT_DATE,\n  $FIXED_DATE,\n\
  \  \"$PROB_SYMPTOMS\",\n  \"$PROB_SOLUTIONS\");\nSELECT * FROM problem_logger WHERE\
  \ id_number=$ID_NUMBER\\G\nEOF\n```\n\n现在，测试 `Record_Problem` 脚本看看它是否已经准备好可以使用：\n\
  \n```\n$ ./Record_Problem \nBriefly describe the problem & its symptoms: \nRunning\
  \ yum to install software and\ngetting ‘not found’ message. \nProblem recorded as\
  \ follows: \n*************************** 1. row **************************** \n\
  id_number: 1012111510 \nreport_date: 2010-12-11 \nfixed_date: 0000-00-00 \nprob_symptoms:\
  \ \nRunning yum to install software and getting ‘not found’ message. \nprob_solutions:\
  \ \n$\n```\n\n它运行得非常棒！你可以看到使用这样的脚本来记录问题比尝试使用单独的 `mysql` 命令进行插入要简单得多。现在你已经有了记录问题的方法，你需要一种更新记录的方法。让我们开始创建\
  \ `Update_Problem` 脚本吧。\n\n## 更新问题\n\n跟踪问题的下一步是记录问题的解决方案。在本节创建的脚本将允许这些信息添加到问题记录中。\n\
  \n#### 所需的函数\n\n使用 `mysql` 更新记录非常简单。一旦获取了所有必要的数据，只需使用 `mysql` 的 `UPDATE` 命令即可：\n\
  \n```sql\nUPDATE problem_logger SET \n      prob_solutions=\"$PROB_SOLUTIONS\",\
  \ \n      fixed_date=$FIXED_DATE \n      WHERE id_number=$ID_NUMBER;\n```\n\n这相当简单。然而，编写\
  \ `Update_Problem` 脚本所需的工作比仅仅使用 `UPDATE` 函数要多。\n\n#### 创建脚本\n\n与之前的脚本一样，我们希望让脚本用户尽可能方便。为了实现这一目标，需要添加一些功能。\n\
  \n`Problem_Trek` 数据库的主键 `id_number` 用于标识要更新的记录。如果已知 ID 号，可以将其作为参数传递给脚本（请参见第 13 章）。你只需要检查参数并将其赋值给变量\
  \ `ID_NUMBER`。如果没有作为参数传递 ID 号，脚本将要求你输入：\n\n```bash\nif [ $# -eq 0 ]  # 检查是否传递了 id\
  \ 号\nthen\n      # 如果没有传递，则询问。\n...\n      echo\n      echo “你要更新的问题的”\n      echo\
  \ -e “ID 号是多少？: \\c”\n      read ANSWER\n      ID_NUMBER=$ANSWER\nelse\n      ID_NUMBER=$1\n\
  fi\n```\n\n然而，直接询问问题 ID 号有点不公平。没有多少人脑子里能记住用来识别正在解决的特定问题的 10 位数字。因此，你应该提供数据库中各种未解决问题的列表，让脚本用户操作更方便。\n\
  \n首先，检查是否存在任何未解决的记录。为空的字段是 `fixed_date` 和 `prob_solutions`。如果其中任何一个字段为空，则需要更新记录；通过\
  \ `SELECT`，你可以在 `WHERE` 语句中使用 `OR` 命令同时搜索这两个字段。实现此操作的代码如下：\n\n```bash\nRECORDS_EXIST='$MYSQL\
  \ -Bse 'SELECT id_number FROM problem_logger WHERE fixed_date=\"0000-00-00\" OR\
  \ prob_solutions=\"\"'\n```\n\n注意，命令的输出被赋值给变量 `RECORDS_EXIST`。为了实现这一点，必须在 `mysql`\
  \ 命令中使用 `-Bse` 选项。它们允许命令以批量（一次性）执行并退出。如果 `RECORDS_EXIST` 变量包含数据，则说明存在需要更新的记录。使用以下命令将它们显示在屏幕上：\n\
  \n```bash\nif [ \"$RECORDS_EXIST\" != \"\" ]\nthen\n  echo\n  echo “以下记录需要更新...”\n\
  \  $MYSQL <<EOF\n    SELECT id_number, report_date, prob_symptoms \n           FROM\
  \ problem_logger \n          WHERE fixed_date=\"0000-00-00\" OR\n           prob_solutions=\"\
  \"\\G\nEOF\nfi\n```\n\n这将提供一个不错的未完成问题记录列表，以及它们的 ID 号。从列表中选择 ID 号比尝试记忆数字要容易得多！现在你可以组合出一个完整且易于使用的脚本。它看起来类似于下面：\n\
  \n```bash\n#!/bin/bash\n# Update_Problem - 更新数据库中的记录\n######################\n#\
  \ 确定 sql 位置并设置变量\nMYSQL='mysql\"Problem_Trek -u'\n#############################\n\
  # 获取 Id\nif [ $# -eq 0 ] # 检查是否传递了 id 号\nthen\n      # 如果没有传递，则询问。\n      # 检查是否存在记录\n\
  \      RECORDS_EXIST='$MYSQL -Bse 'SELECT id_number FROM problem_logger WHERE fixed_date=\"\
  0000-00-00\" OR prob_solutions=\"\"'\n      if [ \"$RECORDS_EXIST\" != \"\" ]\n\
  \      then\n        echo\n        echo “以下记录需要更新...”\n        $MYSQL <<EOF\n  \
  \        SELECT id_number, report_date, prob_symptoms \n                 FROM problem_logger\
  \ \n                WHERE fixed_date=\"0000-00-00\" OR\n                 prob_solutions=\"\
  \"\\G\nEOF\n      fi\n      echo\n      echo “你要更新的问题的”\n      echo -e “ID 号是多少？:\
  \ \\c”\n      read ANSWER\n      ID_NUMBER=$ANSWER\nelse\n      ID_NUMBER=$1\nfi\n\
  #############################\n# 获取解决方案（即固定日期）\necho\necho -e “问题今天解决了吗？(y/n)”\n\
  read ANSWER\ncase $ANSWER in\n  y|YES|Yes|yES)\n    FIXED_DATE='date +Y%m%d'\n \
  \   ;;\n  *) # 如果不是 yes，询问日期\n    echo\n    echo -e “解决日期是？[YYYYDD]”\n    read ANSWER\n\
  \    FIXED_DATE=$ANSWER\n    ;;\nesac\n#############################\n# 更新问题记录\n\
  echo\necho “问题记录如下：”\n$MYSQL <<EOF\nUPDATE problem_logger SET \n      prob_solutions=\"\
  $PROB_SOLUTIONS\", \n      fixed_date=$FIXED_DATE \n      WHERE id_number=$ID_NUMBER;\n\
  SELECT * FROM problem_logger WHERE id_number=$ID_NUMBER\\G\nEOF\n```\n\n测试这个脚本看看它的性能如何：\n\
  \n```\n$ ./Update_Problem \n以下记录需要更新...\n*************************** 1. row ****************************\
  \ \nid_number: 1012111624 \nreport_date: 2010-12-11 \nprob_symptoms: \nRunning yum\
  \ to install software and getting ‘not found’ message. \n你要更新的问题的\nID 号是多少？:1012111624\n\
  问题今天解决了吗？(y/n) y \n简要描述问题解决方案：Network service was down.\n问题记录如下：\n***************************\
  \ 1. row **************************** \nid_number: 1012111624 \nreport_date: 2010-12-11\
  \ \nfixed_date: 2010-12-11 \nprob_symptoms: \nRunning yum to install software and\
  \ getting ‘not found’ message. \nprob_solutions: Network service was down. \n$ \n\
  ```\n\n这个脚本运行得良好，且非常易用。\n\n## 补充\n\n\n\n\n\n为了让脚本用户的操作变得更加简单，让我们修改 `Record_Problem`\
  \ 脚本，在需要时调用 `Update_Problem`。有时候，当你忙碌时，“分批”记录问题会更方便。在原始 `Record_Problem` 脚本的最后尾，你可以添加以下代码：\n\
  \n```bash\n# 检查现在是否要输入解决方案\n\n#\n\necho\n\necho -e “Do you have a solution yet?\
  \ (y/n) \\c”\nread ANSWER\n\n#\n\ncase $ANSWER in\ny|Y|YES|yes|Yes|yEs|yeS|YEs|yES\
  \ )\n      ./$HOME/scripts/Update_Problem $ID_NUMBER\n#\n;;\n*)\n# 如果回答不是 yes，则直接退出脚本\n\
  ;;\nesac\n```\n\n现在让我们测试一下这个修改，看看它是否有效：\n\n`$ ./Record_Problem`\n\n简要描述问题及其症状：\n\
  \n将脚本从 Fedora 移动到 Ubuntu 后无法正常工作。\n\n记录的问题如下：\n\n*************************** 1.\
  \ row ****************************\n\nid_number: 1012111631\nreport_date: 2010-12-11\n\
  fixed_date: 0000-00-00\nprob_symptoms:\nMoved script from Fedora to Ubuntu and was\
  \ not working properly.\nprob_solutions:\nDo you have a solution yet? (y/n) y\n\
  Was problem solved today? (y/n) y\n简要描述问题的解决方案：\n在脚本顶部添加了 `#!/bin/bash`。\n这是因为 Ubuntu\
  \ 的默认 shell 是 dash。\n\n更新后的问题记录如下：\n\n*************************** 1. row ****************************\n\
  \nid_number: 1012111631\nreport_date: 2010-12-11\nfixed_date: 2010-12-11\nprob_symptoms:\n\
  Moved script from Fedora to Ubuntu and was not working properly.\nprob_solutions:\
  \ Added `#!/bin/bash` to the top of the script.\nThis is needed because Ubuntu's\
  \ default shell is dash.\n`$`\n\n这运行非常完美。现在你可以方便地在 `Problem_Trek` 数据库中记录和更新记录了。\n\
  \n## 查找问题\n\n拥有像 `Problem_Trek` 这样的数据库的真正之处在于能够审查记录。查看过去的问题及其解决方案将让你能够快速解决重复问题并发现趋势。\n\
  \n### 必须的函数\n\n要查找表中的记录以进行审查，你可以再次使用 `SELECT` 命令。我们在本章的之前已经使用过它，用于如查看 `problem_logger`\
  \ 表中新添加的记录等目的：\n\n`SELECT * FROM problem_logger WHERE id_number=$ID_NUMBER\\G`\n\
  \n对于 `Find_Problem` 脚本，我们需要对之前使用的 `SELECT` 命令进行细微调整。为了能够方便地找到旧问题，脚本会要求输入一个关键字。因此，如果你记得上个月在\
  \ `yum` 上遇到过问题，你就输入关键词“yum”。要在数据库中搜索包含该关键词的记录，请在脚本的 `SELECT` 语句中添加 `LIKE` 命令。代码看起来如下：\n\
  \n```sql\nmysql> SELECT * FROM problem_logger \n-> WHERE prob_symptoms LIKE ‘yum’\\\
  G \nEmpty set (0.00 sec)\n```\n\n等一下，这没起作用！这是因为需要通配符。为了找到埋在 `prob_symptoms` 字段中的“yum”单词，需要在关键词的两边都添加通配符。实际上，你是在告诉\
  \ `mysql` 查找一个 `prob_symptoms` 字段包含单词“yum”的记录。使用的通配符符号是百分号 (%)。因此，你的代码应该是这样的：\n\n\
  ```sql\nmysql> SELECT * FROM problem_logger \n-> WHERE prob_symptoms LIKE ‘%yum%’\\\
  G \n```\n\n*************************** 1. row ****************************\n\nid_number:\
  \ 1012111624\nreport_date: 2010-12-11\nfixed_date: 2010-12-11\nprob_symptoms: Running\
  \ yum to install software and getting ‘not found’ message.\nprob_solutions: Network\
  \ service was down.\n执行了命令：`service network restart`\n1 row in set (0.00 sec)\n\n\
  你可能希望 `SELECT` 命令也能搜索 `prob_solutions` 字段以及 `prob_symptoms` 字段，这将允许对所需的记录进行更彻底的搜索：\n\
