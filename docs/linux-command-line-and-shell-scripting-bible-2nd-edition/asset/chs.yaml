  \ shell。请与 Linux 社区保持联系，并关注新的进展和功能。\n\n# 附录\n\n## bash 命令快速指南\n\n### 本附录内容\n\n-\
  \ `bash` 内置命令\n- GNU 额外的 shell 命令\n- `bash` 环境变量\n\n正如你在整本书中所看到的，`bash` shell 包含许多功能，因此有许多可用命令。本附录提供了一个快速指南，允许你快速查找可以在\
  \ `bash` 命令行或 `bash` shell 脚本使用的功能或命令。\n\n## 内置命令\n\n`bash` shell 包含许多内置在 shell\
