  \ function\n%\n```\n\n\n\n当你运行 `zcompile` 命令时，它会创建一个函数的 `.zwc` 版本文件。当 `autoload`\
  \ 命令在 `fpath` 中查找该命令时，它会看到 `.zwc` 版本并加载它，而不是文本函数文件。\n\n## 总结\n\n本章讨论了你可能会遇到的两种流行的替代\
  \ Linux shell。`dash` shell 是作为 Debian Linux 发行版的一部分开发的，并主要出现在 Ubuntu Linux 发行版中。它是\
  \ Bourne shell 的较小版本，因此支持的功能没有像 `bash` shell 那么丰富，这可能会给脚本编写带来麻烦。\n\n`zsh` shell\
  \ 经常出现在编程环境中，因为它为 shell 脚本编写程序提供了许多酷的功能。它使用可加载模块来加载独立的代码库，这使得使用高级函数变得像运行命令行一样简单！针对许多不同函数都有可加载模块，从复杂的数学算法到\
  \ FTP 和 HTTP 等网络应用都有。\n\n本书的接下来的部分将深入探讨你可能在 Linux 环境中遇到的特定的脚本应用。下一章将向你如何将 Linux\
  \ 世界中最流行的两个数据库包 `MySQL` 和 `PostgreSQL` 整合到你的 shell 脚本中以处理数据。\n\n## 第四部分：高级 shell\
  \ 脚本主题\n\n### 本部分内容\n\n- 第 23 章：使用数据库\n- 第 24 章：使用网络\n- 第 25 章：使用电子邮件\n- 第 26 章：编写脚本工具\n\
  - 第 27 章：高级 shell 脚本\n\n## 第 23 章：使用数据库\n\n### 本章内容\n\n- 介绍 MySQL\n- 介绍 PostgreSQL\n\
  - 创建数据库对象\n- 编写数据库 shell 脚本\n\nshell 脚本的问题之一是持久化数据。你可以将想要的所有信息存储在 shell 变量中，但在脚本结束时，变量就会消失。有时你希望脚本能够存储稍后可以使用的数据。在过去，从\
  \ shell 脚本存储和检索数据需要创建一个文件、从文件中读取数据、解析数据，然后将数据保存回文件。在文件中搜索数据意味着读取文件的每条记录来查找你的数据。如今，随着数据库的流行，将你的\
  \ shell 脚本与专业的开源数据库接口已轻而易举。Linux 世界中最流行的两个开源数据库是 `MySQL` 和 `PostgreSQL`。本章将向你展示如何在你的\
  \ Linux 系统上运行这些数据库，然后花一些时间让你习惯从命令行与它们进行交互。随后将向你展示如何使用普通的 bash shell 脚本与它们进行交互。\n\
  \n## MySQL 数据库\n\n到目前为止，Linux 环境中最流行的数据库是 `MySQL` 数据库。它的流行随着 Linux-Apache-MySQL-PHP\
  \ (LAMP) 服务器环境的发展而增长，许多互联网 Web 服务器使用它托管在线商店、博客和应用程序。\n\n本节描述了如何在你的 Linux 环境中安装 `MySQL`\
  \ 数据库，以及如何创建必要的数据库对象供你的 shell 脚本使用。\n\n#### 安装 MySQL\n\n以前在 Linux 系统上安装 `MySQL`\
  \ 相当复杂，但现在 Linux 发行版使用自动化软件安装程序已不罕见（见第 8 章）。这些程序不仅允许你轻松从网络仓库下载并安装新软件，还会自动检查已安装软件包的更新并安装这些更新。\n\
  \n图 23.1 显示了 Ubuntu Linux 发行版中的“添加软件”功能。\n\n图 23.1 在 Ubuntu Linux 系统上安装 MySQL\n\n\
  ![23.1](img/c23f001.jpg)\n\n你只需要选择 `mysql-server` 选项，Synaptic 包管理器就会下载并安装完整的 `MySQL`\
  \ 服务器（及客户端）软件。没有比这更简单的了！\n\nopenSUSE Linux 发行版也使用先进的软件管理系统。图 23.2 显示了软件管理窗口，你可以在其中根据软件类别选择软件包或搜索特定软件包。\n\
  \n图 23.2 在 openSUSE Linux 系统上安装 MySQL\n\n![23.2](img/c23f002.jpg)\n\n再次，你可以选择 `MySQL`\
  \ 软件选项下载并安装所需的软件包。\n\n如果你使用的是不支持自动软件加载的 Linux 发行版，或者你只是想获得最新最强大的 `MySQL` 服务器版本，你可以从\
  \ MySQL 网站（[www.mysql.com](http://www.mysql.com)）直接下载安装文件并自行安装。\n\nMySQL 网站包含了针对特定\
  \ Linux 发行版的预构建二进制包（使用 Red Hat RPM 包格式或 Debian DEB 包格式）以及源码包。预构建的二进制包更容易安装，因此如果你的你的\
  \ Linux 系统有可用的二进制包，请尝试使用它。如果你需要帮助为你的 Linux 发行版安装二进制包或源码包，请回阅第 8 章。\n\n> **注意**\n\
  > 如果你选择手动下载并安装 `MySQL`（无论是预构建二进制包还是源码下载），你将必须做一些额外工作来配置 `MySQL` 服务器，而 Linux 发行版的安装包将安装一个预配置好的设置，你几乎不需要做任何工作！\n\
  \n### MySQL 客户端界面\n\n通往 `MySQL` 数据库的门户是 `mysql` 命令行界面程序。本节描述了 `mysql` 客户端程序，并展示了如何使用它与你的数据库交互。\n\
  \n#### 连接到服务器\n\n`mysql` 客户端程序允许你使用任何用户账户和密码连接到网络上任何位置的任何 `MySQL` 数据库服务器。默认情况下，如果你在命令行不带任何参数输入\
  \ `mysql` 程序，它将尝试使用 Linux 登录用户名连接到在同一 Linux 系统上运行的 `MySQL` 服务器。\n\n可能不是你想连接数据库的方式。有很多命令行参数允许你不仅控制连接到哪个\
  \ `MySQL` 服务器，还可以控制 `mysql` 界面的行为。表 23.1 显示了你可以配合 `mysql` 程序使用的命令行参数。\n\n表 23.1\
