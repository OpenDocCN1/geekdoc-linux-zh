  \ `umask`。`umask` 命令用于设置你创建的任何文件或目录的默认权限：\n\n```bash\n$ touch newfile\n$ ls -al\
  \ newfile\n-rw-r--r--  1 rich      rich               0 Sep 20 19:16 newfile\n$\n\
  ```\n\n`touch` 命令使用分配给我的用户账户的默认权限创建了文件。`umask` 命令显示并设置默认权限：\n\n```bash\n$ umask\n\
  0022\n$\n```\n\n遗憾的是，`umask` 命令设置并不十分直观，而试图完全理解它的工作原理会让事情变得更加复杂。第一个数字代表一种特殊的安全特性，称为粘滞位（sticky\
  \ bit）。我们将在本章稍后的“共享文件”部分详细讨论这一点。\n\n接下来的三个数字代表文件或目录的 `umask` 的八进制值。要理解 `umask` 如何工作，你首先需要理解八进制模式安全设置。\n\
  \n八进制模式安全设置取三个 `rwx` 权限值并将其转换为一个 3 位二进制值，由单个八进制值表示。在二进制表示中，每个位置都是一个二进制位。因此，如果只设置了读取权限，该值将变为\
  \ `r--`，对应二进制值 `100`，表示八进制值为 `4`。表 6.5 显示了你可能会遇到的各种组合。\n\n表 6.5 Linux 文件权限代码\n\n\
  ![c06tnt005](img/c06tnt005.jpg)\n\n八进制模式获取八进制权限，并按三个安全层级（用户、组和所有人）的顺序列出其中的三个。因此，八进制模式值\
  \ `664` 代表用户和组的读取和写入权限，而对其他人只有只读权限。\n\n现在你已经了解了八进制模式权限，`umask` 值变得更加困惑了。我的 Linux\
  \ 系统上默认 `umask` 显示的八进制模式是 `0022`，但我创建的文件的八进制模式权限是 `644`。这是如何发生的？\n\n`umask` 值仅仅是一个掩码。它掩盖了你不想授予某个安全层级的权限。现在我们必须深入研究八进制算术来揭开故事的其余部分。\n\
  \n`umask` 值从对象的完整权限集中被减去。文件的完全权限是模式 `666`（所有人的读/写权限），但对于目录，它是 `777`（所有人的读/写/执行权限）。\n\
  \n因此，在示例中，文件初始权限为 `666`，应用 `022` 的 `umask`，剩余的文件权限为 `644`。\n\n`umask` 值通常设置在 `/etc/profile`\
  \ 启动文件中（见第 5 章）。你可以使用 `umask` 命令指定不同的默认 `umask` 设置：\n\n```bash\n$ umask 026\n$ touch\
  \ newfile2\n$ ls -l newfile2\n-rw-r-----  1 rich      rich               0 Sep 20\
  \ 19:46 newfile2\n$\n```\n\n通过将 `umask` 值设置为 `026`，默认文件权限变为 `640`，因此新文件被限制为组只读，而其他人对该文件没有权限。`umask`\
  \ 值也适用于创建新目录：\n\n```bash\n$ mkdir newdir\n$ ls -l\ndrwxr-x--  2 rich      rich \
  \              4096 Sep 20 20:11 newdir\n$\n```\n\n因为目录的默认权限是 `777`，所以 `umask` 产生的权限与文件不同。`026`\
  \ `umask` 值从 `777` 中减去，得到 `751` 的目录设置。\n\n## 修改安全设置\n\n如果你已经创建了文件或目录并需要更改其安全设置，Linux\
  \ 中提供了一些工具。本节将展示如何更改文件的现有权限、默认所有者和默认组设置。\n\n### 修改权限\n\n`chmod` 命令允许你更改文件和目录的安全设置。`chmod`\
  \ 命令的格式为：`chmod options mode file`。\n\n`mode` 参数允许你使用八进制模式或符号模式设置安全设置。八进制模式设置非常直观；只需使用你想要文件拥有的三位八进制代码即可：\n\
  \n```bash\n$ chmod 760 newfile\n$ ls -l newfile\n-rwx----  1 rich      rich    \
  \           0 Sep 20 19:16 newfile\n$\n```\n\n八进制文件权限会自动应用到文件。符号模式权限并不容易实现。`chmod`\
  \ 命令没有使用由三组字符组成的普通字符串，而是采取了不同的方法。以下是使用符号模式下指定权限的格式：`[ugo][+-=][rwx]`。\n\n这听起来完全合逻辑，对吧？第一组定义了新权限适用于谁：\n\
  - `u` 代表用户\n- `g` 代表组\n- `o` 代表其他人（所有人）\n- `a` 代表上述所有\n\n接下来，使用一个符号来表示你想将权限添加到现有权限中（`+`）、从现有权限中减去权限（`-`）或设置权限（`=`）。\n\
  \n最后，第三个符号是用于设置的权限。你可能会注意到有比普通的 `rwx` 值。额外的设置有：\n- `X` 仅当对象是目录或已具有执行权限时才分配执行权限\n\
  - `s` 设置 UID 或 GID\n- `t` 保存文本\n- `u` 将权限设置为所有者的权限\n- `g` 将权限设置为组的权限\n- `o` 将权限设置为其他人的权限\n\
  \n使用这些权限看起来像：\n\n```bash\n$ chmod o+r newfile\n$ ls -l newfile\n-rwxrw-r--  1 rich\
  \      rich               0 Sep 20 19:16 newfile\n$\n```\n\n`o+r` 条目为所有人权限增加了读取权限。\n\
  \n```bash\n$ chmod u-x newfile\n$ ls -l newfile\n-rw-rw-r--  1 rich      rich  \
  \             0 Sep 20 19:16 newfile\n$\n```\n\n`u-x` 条目移除了用户拥有的执行权限。注意 `ls` 设置通过在文件名上添加星号来指示文件是否有执行权限。`options`\
  \ 参数提供了增强 `chmod` 命令行为的附加功能。`-R` 参数递归执行。你可以对文件名使用通配符，只需一个命令即可更改多个文件。\n\n### 修改所有权\n\
  \n有时你需要更改文件的所有者，例如有人离开组织或开发者创建了生产环境中需要由系统账户拥有的应用程序。Linux 提供了命令来实现。`chown` 命令方便地更改文件的所有者，`chgrp`\
  \ 命令允许你更改文件的默认组。\n\n`chown` 命令的格式为：`chown options owner[.group] file`。你可以为文件的所有者指定用户名或数字\
  \ UID：\n\n```bash\n# chown dan newfile\n# ls -l newfile\n-rw-rw-r--  1 dan     \
  \ rich               0 Sep 20 19:16 newfile\n#\n```\n\n简单。`chown` 命令还允许你同时更改文件的用户和组：\n\
  \n```bash\n# chown dan.shared newfile\n# ls -l newfile\n-rw-rw-r--  1 dan      shared\
  \             0 Sep 20 19:16 newfile\n#\n```\n\n如果你真的想玩点花，可以只更改文件的默认组：\n\n```bash\n\
  # chown .rich newfile\n# ls -l newfile\n-rw-rw-r--  1 dan      rich            \
  \   0 Sep 20 19:16 newfile\n#\n```\n\n\n\n\n最后，如果你的 Linux 系统使用与用户登录名相同的单独组名，你只需要一个条目就可以更改两者：\n\
  \n```\n# chown test. newfile\n# ls -l newfile\n-rw-rw-r--    1 test    test    \
  \           0 Sep 20 19:16 newfile\n```\n\n`chown` 命令使用了几个不同的选项参数。`-R` 参数允许你使用通配符递归地对子目录和文件进行更改。`-h`\
  \ 参数也会更改链接到该文件的符号链接的所有权。\n\n### Note\n\n只有 `root` 用户可以更改文件的所有者。任何用户都可以更改文件的默认组，但该用户必须是该文件所属源组和目标组的成员。\n\
  \n`chgrp` 命令提供了一种简单更改文件或目录默认组的方法：\n\n```bash\n$ chgrp shared newfile\n$ ls -l newfile\n\
  -rw-rw-r--    1 rich    shared           0 Sep 20 19:16 newfile\n```\n\n现在，`shared`\
  \ 组中的任何成员都可以写入该文件。这是在 Linux 系统上共享文件的一种方法。然而，在系统中的一组人员之间共享文件可能会变得复杂。下一节将讨论如何实现这一点。\n\
  \n## 共享文件\n\n正如你可能已经想到的，创建组是共享 Linux 系统文件访问权限的方法。然而，对于一个完整的文件共享环境，情况会更加复杂。\n\n正如你在“解码文件权限”部分中所看到的，当你创建一个新文件时，Linux\
  \ 会使用你默认的 `UID` 和 `GID` 为新文件分配文件权限。要允许他人访问该文件，你需要更改 `everyone` 安全组的安全权限，或者为文件分配一个包含其他用户的不同默认组。\n\
  \n如果你想在几个人之间创建并共享文档，这在大型环境中可能会非常棘手。幸运的是，有一个简单的方法来解决这个问题。\n\nLinux 为每个文件和目录额外存储了三位额外信息：\n\
  \n*   设置用户 ID (`SUID`)：当用户执行一个文件时，该程序在文件所有者的权限下运行。\n*   设置组 ID (`SGID`)：对于文件，程序在文件组的权限下运行。对于目录，在该目录中创建的新文件将使用目录组作为默认组。\n\
  *   粘滞位 (sticky bit)：进程结束后，文件仍保留（粘滞）在内存中。\n\n`SGID` 位对于共享文件至关重要。通过启用 `SGID` 位，你可以强制共享目录中创建的所有新文件都归目录组所有，而不是归单个用户的组所有。\n\
  \n`SGID` 是使用 `chmod` 命令设置的。它被添加到标准三位八进制值的开头（使其成为四位八进制值），或者你可以在符号模式下使用符号 `s`。\n\n\
  如果你使用八进制模式，将需要知道位的排列情况，如表 6.6 所示。\n\n### 表 6.6 `chmod` SUID、SGID 和粘滞位的八进制值\n\n|\
  \ 二进制 | 八进制 | 描述 |\n| :--- | :--- | :--- |\n| 000 | 0 | 所有位位均已清零。 |\n| 001 | 1 |\
  \ 粘滞位被设置。 |\n| 010 | 2 | SGID 位被设置。 |\n| 011 | 3 | SGID 和粘滞位被设置。 |\n| 100 | 4 |\
  \ SUID 位被设置。 |\n| 101 | 5 | SUID 和粘滞位被设置。 |\n| 110 | 6 | SUID 和 SGID 位被设置。 |\n|\
  \ 111 | 7 | 所有位都被设置。 |\n\n因此，要创建一个始终为所有新文件设置目录组的共享目录，你只需要为目录设置 `SGID` 位即可：\n\n```bash\n\
  $ mkdir testdir\n$ ls -l\ndrwxrwxr-x    2 rich    rich            4096 Sep 20 23:12\
  \ testdir/\n$ chgrp shared testdir\n$ chmod g+s testdir\n$ ls -l\ndrwxrwsr-x   \
  \ 2 rich    shared        4096 Sep 20 23:12 testdir/\n$ umask 002\n$ cd testdir\n\
  $ touch testfile\n$ ls -l\ntotal 0\n-rw-rw-r--    1 rich    shared           0 Sep\
  \ 20 23:13 testfile\n```\n\n第一步是使用 `mkdir` 命令创建一个你想共享的目录。接下来，使用 `chgrp` 命令将目录的默认组更改为包含需要共享文件的成员的组。最后，为目录设置\
  \ `SGID` 位，以确保目录中创建的任何文件都使用共享组名作为默认组。\n\n为了让此环境正常工作，所有组员都需要将它们的 `umask` 值设置为可让组员读写的文件。在前面的示例中，`umask`\
  \ 被更改为 `002`，以便组可以写入文件。\n\n在完成所有操作后，组中的任何成员都可以进入共享目录并创建一个新文件。如所预期，新文件使用的是目录的默认组，而不是用户账户的默认组。现在，共享组中的任何用户都可以访问此文件。\n\
  \n## 总结\n\n本章讨论了你管理系统 Linux 安全时所需的命令行命令。Linux 使用用户 ID 和组 ID 系统来保护对文件、目录和设备的访问。Linux\
  \ 在 `/etc/passwd` 文件中存储用户账户信息，并在 `/etc/group` 文件中存储组信息。每个用户都被分配了一个唯一的数字用户 ID，以及一个用于在系统中标识该用户的文本登录名。组也被分配了唯一的数字组\
  \ ID 和文本组名。一个组可以包含一个或多个用户，以允许对系统资源的共享访问。\n\n有多个命令可管理用户账户和组。`useradd` 命令允许你创建新的用户账户，`groupadd`\
  \ 命令允许你创建新的组账户。要修改现有用户请使用 `usermod` 命令。同样，`groupmod` 命令用于修改组账户。\n\n现在你已经熟悉了文件权限，是时候仔细观察如何在\
  \ Linux 中处理实际的文件系统了。下一章将向你展示如何从命令行在 Linux 中创建新分区，然后如何格式化新分区以便其在 Linux 虚拟目录中使用。\n\
  \n\n\n\n当你在使用 Linux 系统时，你需要做出的决策之一是为存储设备选择何种文件系统。大多数 Linux 发行版在安装时都会贴心地为你提供一个默认的文件系统，而大多数初学\
  \ Linux 用户都会直接按默认使用它，而不会再考虑这个话题。\n\n虽然使用默认的文件系统选择并不一定是一坏事，但有时了解你可使用的其他选项会有帮助。本章将讨论你在\
  \ Linux 世界中可以使用的不同文件系统选项，并向你展示如何从 Linux 命令行创建和管理它们。\n\n# 探索 Linux 文件系统\n\n第 3 章讨论了\
  \ Linux 如何使用文件系统在存储设备上存储文件和文件夹。文件系统为 Linux 提供了一种方法，在存储在硬盘中的二进制 0 和 1 与你在应用程序中使用的文件和文件夹之间建立桥梁。\n\
  \nLinux 支持多种类型的文件系统来管理文件和文件夹。每个文件系统都使用略有不同的特性在存储设备上实现虚拟目录结构。本节将带你了解 Linux 环境中更常用的文件系统的优缺点。\n\
  \n## 基础 Linux 文件系统\n\n原始的 Linux 系统使用一种模拟 Unix 文件系统功能的简单文件系统。本节将讨论该文件系统的演进。\n\n###\
  \ ext 文件系统\n\n随 操作系统引入的原始文件系统称为扩展文件系统（或简称为 `ext`）。它为 Linux 提供了一个基础的类 Unix 文件系统，使用虚拟目录处理物理设备，并在物理设备上固定长度的块上存储数据。\n\
  \n`ext` 文件系统使用一种名为 `inodes`（索引节点）的系统来跟踪虚拟目录中存储的文件信息。`inode` 系统在每个物理设备上创建一个单独的表称为\
  \ `inode table`（索引节点表），用于存储文件信息。虚拟目录中的每个存储文件在 `inode table` 中都有一个条目。名称中的“扩展”部分源于它对每个文件跟踪的额外数据，这些于：\n\
  \n* 文件名\n* 文件大小\n* 文件所有者\n* 文件所属的组\n* 文件的访问权限\n* 指向包含文件数据的每个磁盘块的指针\n\nLinux 使用唯一的编号（称为\
  \ `inode number`）引用 `inode table` 中的每个 `inode`，该编号由文件系统在创建数据文件时分配。文件系统使用 `inode\
  \ number` 来识别文件，而无需使用完整的文件名和路径。\n\n### ext2 文件系统\n\n原始的 `ext` 文件系统有很多局限性，例如将文件大小限制为\
  \ 2GB。在 Linux 首次引入后不久，`ext` 文件系统升级创建了第二个扩展文件系统，称为 `ext2`。\n\n正如你所猜的，`ext2` 文件系统是\
  \ `ext` 文件系统基础能力的扩展，但保持了相同的结构。`ext2` 文件系统扩展了 `inode table` 格式，以跟踪系统中每个文件的额外信息。\n\
  \n`ext2 inode table` 添加了文件的创建、修改和最后访问时间值，帮助系统管理员跟踪系统上的文件访问情况。`ext2` 文件系统还将允许的最大文件大小增加到\
  \ 2TB（在后来的 `ext2` 版本中，这被增加到了 32TB），以适应数据库服务器中常见的大文件。\n\n除了扩展 `inode table` 之外，`ext2`\
  \ 文件系统还改变了数据块中存储文件的方式。`ext` 文件系统的一个常见问题是，当文件写入物理设备时，用于存储数据的块往往分散在整个设备中（称为碎片化）。数据块的碎片化会降低文件系统的性能，因为搜索存储设备以访问特定文件的所有块需要更长时间。\n\
  \n`ext2` 文件系统通过在保存文件时分组分配磁盘块来帮助减少碎片化。通过对文件的数据块分组，文件系统无需在整个物理设备上搜索用于读取文件的数据块。\n\n\
  `ext2` 文件系统曾是 Linux 中使用的默认文件系统。`ext2 inode table` 添加了文件访问时间值以帮助系统管理员跟踪系统上的文件访问。`ext2`\
  \ 文件系统还允许的最大文件大小增加到 2TB（在在后 `222，中增加到了 32TB）。TB 扩展 `inode tableinode 之外，`ext2` 文件系统还更改了文件在数据块中的存储方式。\n\
  \n\n\n\n\n默认情况下，`ext3` 文件系统使用顺序模式（ordered mode）日志方法，它仅将 inode 信息写入日志文件，在数据块成功写入存储设备之前，不会将其从日志中移除。在创建文件系统时，可以通过简单的命令行选项将\
  \ `ext3` 文件系统使用的日志方法更改为 `data` 或 `writeback` 模式。虽然 `ext3` 文件系统为 Linux 引入了基础的日志功能，但它仍然缺乏一些功能。例如，`ext3`\
  \ 文件系统不提供任何从误删文件中恢复的功能，没有内置的数据压缩功能（尽管有一个可以单独安装的补丁可以提供此功能），并且 `ext3` 文件系统不支持对文件进行加密。由于这些原因，Linux\
  \ 项目的开发者选择继续改进 `ext3` 文件系统。\n\n# ext4 文件系统\n\n`ext3` 文件系统的扩展结果（正如你可能猜到的）就是 `ext4`\
  \ 文件系统。`ext4` 文件系统于 2008 年在 Linux 内核中获得官方支持，现在是 Fedora 和 Ubuntu 等主流 Linux 发行版中默认的文件系统。\n\
  \n除了支持压缩和加密外，`ext4` 文件系统还支持一种名为 `extents`（范围）的功能。`extents` 以块的形式在存储设备上分配空间，并在 inode\
  \ 表中存储起始块的位置。这通过无需列出所有用于存储文件数据的数据块，有助于节省 inode 表中的空间。\n\n`ext4` 文件系统还整合了块预分配（block\
  \ preallocation）。如果你想为一个已知大小会不断增长的文件在存储设备上预留空间，使用 `ext4` 文件系统可以为文件分配所有预期的块，而不仅仅是物理上存在的块。`ext4`\
  \ 文件系统用零填充这些预留的数据块，并知道不会将其分配给任何其他文件。\n\n# Reiser 文件系统\n\n2001 年，Hans Reiser 创建了\
  \ Linux 的第一个日志文件系统，称为 `ReiserFS`。`ReiserFS` 文件系统仅支持 `writeback` 日志模式，仅将 inode 表数据写入日志文件。由于它只向日志中写入\
  \ inode 表数据，`ReiserFS` 是 Linux 中最快的日志文件系统之一。\n\n集成到 `ReiserFS` 文件系统的两个有趣功能是：你可以在文件系统仍活动状态时调整其大小，以及它使用了一种名为\
  \ `tailpacking`（尾部填充）的技术，将一个文件的数据挤入另一个文件数据块的空闲空间中。活动文件系统调整大小的功能在你需要扩展已创建的文件系统以容纳更多数据时非常有用。\n\
  \n#### 警告\n\n由于 Hans Reiser 的法律问题，`ReiserFS` 文件系统的状态尚存疑虑。虽然 `ReiserFS` 项目是一个开源项目，但\
  \ Hans 是该项目的首席开发人员，目前已入狱。`ReiserFS` 文件系统最近没有新的进展，也不清楚是否还会其他人接手该项目的开发工作。鉴于现在已经有了其他日志文件系统的替代方案，大多数新的\
  \ Linux 安装程序不再使用 `ReiserFS` 文件系统。然而，你可能仍然遇到使用它的现有 Linux 系统。\n\n# 日志文件系统 (JFS)\n\n\
  作为可能最古老的日志文件系统之一，日志文件系统（`JFS`）由 IBM 于 1990 年为其 AIX 版本的 Unix 开发。然而，直到第二个版本发布，它才被移植到\
  \ Linux 环境。\n\n### 注意\n\n`JFS` 文件系统第二个版本的 IBM 官方名称是 `JFS2`，但大多数 Linux 系统仅将其称为 `JFS`。\n\
  \n`JFS` 文件系统使用顺序日志方法，仅在日志中存储 inode 表数据，在实际文件数据写入存储设备之前不会将其移除。这种方法是 `ReiserFS` 的速度和数据完整性模式日志方法之间的一种折中。\n\
  \n`JFS` 文件系统使用基于范围（extent）的文件分配，为写入存储设备的每个文件分配一组块。这种方法减少了存储设备的碎片。\n\n在 IBM 提供的 Linux\
  \ 产品之外，`JFS` 文件系统并不流行，但你可能在 Linux 旅途中遇到它。\n\n# XFS 文件系统\n\n`XFS` 日志文件系统是另一个最初为商业\
  \ Unix 系统创建并进入 Linux 世界的文件系统。硅谷图形公司（SGI）最初于 1994 年为其商业级 IRIX Unix 系统创建了 `XFS`。它于\
  \ 2002 年发布到 Linux 环境供通用使用。\n\n`XFS` 文件系统使用 `writeback` 日志模式，这提供了高性能，但也引入了一定风险，因为实际数据没有存储在日志文件中。`XFS`\
  \ 文件系统还允许对文件系统进行在线调整，类似于 `ReiserFS` 文件系统，不同的是 `XFS` 文件系统只能扩展而不能缩小。\n\n# 与文件系统交互\n\
  \nLinux 提供了几个不同的工具，方便从命令行操作文件系统。你可以从容地通过键盘添加新的文件系统或更改现有的文件系统。本节将带你了解从命令行环境中与文件系统交互的命令。\n\
  \n## 创建分区\n\n开始之前，你需要在存储设备上创建一个分区以包含文件系统。该分区可以是整个磁盘，也可以是磁盘的子集，包含虚拟目录的一部分。\n\n`fdisk`\
  \ 工具用于帮助你组织安装在系统上的任何存储设备的分区。`fdisk` 命令是一个交互式程序，允许你通过输入命令来逐步完成硬盘分区的步骤。\n\n要启动 `fdisk`\
  \ 命令，你需要指定你想要分区的存储设备设备名称：\n\n```bash\nsudo fdisk /dev/sdc\n```\n\n```\n[sudo] password\
  \ for rich: \n\nDevice contains neither a valid DOS partition table, nor Sun, SGI\
  \ or OSF disklabel\nBuilding a new DOS disklabel with disk identifier 0x4beedc66.\n\
  Changes will remain in memory only, until you decide to write them.\nAfter that,\
  \ of course, the previous content won't be recoverable.\nWarning: invalid flag 0x0000\
  \ of partition table 4 will be corrected by w(rite)\nWARNING: DOS-compatible mode\
  \ is deprecated. It's strongly recommended\n         To switch off the mode (‘c’)\
  \ and change display units to sectors (‘u’).\nCommand (m for help):\n```\n\n如果你是第一次对存储设备进行分区，`fdisk`\
  \ 会给你警告说设备上没有表。\n\n`fdisk` 交互式命令提示符使用单字母命令来指示 `fdisk` 执行操作。表 7.2 显示了 `fdisk` 命令提示符处可用命令。\n\
  \n| 命令 | 描述 |\n| :--- | :--- |\n| a | 切换分区是否可启动的标志 |\n| b | 编辑 BSD Unix 系统使用的磁盘标签\
  \ |\n| c | 切换 DOS 兼容性标志 |\n| d | 删除分区 |\n| l | 列出可用的分区类型 |\n| m | 显示命令选项 |\n| n\
  \ | 添加新分区 |\n| o | 创建 DOS 分区表 |\n| p | 显示当前分区表 |\n| q | 不保存更改退出 |\n| s | 为 Sun Unix\
  \ 系统创建新磁盘标签 |\n| t | 更改分区系统 ID |\n| u | 更改使用的存储单位 |\n| v | 验证分区表 |\n| w | 将分区表写入磁盘\
  \ |\n| x | 高级功能 |\n\n虽然这个列表看起来很吓人，但通常你会在日常工作中只会使用其中几个基本命令。\n\n首先，你可以使用 `p` 命令显示存储设备的详情：\n\
  \n```bash\nCommand (m for help): p\nDisk /dev/sdc: 5368 MB, 5368946688 bytes\n```\n\
