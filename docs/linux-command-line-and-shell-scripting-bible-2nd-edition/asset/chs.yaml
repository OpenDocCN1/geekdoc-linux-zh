  \ | 控制输入 shell 历史列表的命令。 |\n\n\n\n\n\n| `HISTFILE` | 保存 shell 历史列表的文件名（默认为 `.bash_history`）。\
  \ |\n| `HISTFILESIZE` | 历史文件中保存的最大行数。 |\n| `HISTIGNORE` | 一个用冒号分隔的模式列表，用于决定哪些命令在历史文件中应被忽略。\
  \ |\n| `HISTSIZE` | 历史文件中存储的最大命令数。 |\n| `HOSTFILE` | 包含 shell 需要补全主机名时应读取的文件名。 |\n\
  | `HOSTNAME` | 当前主机的名称。 |\n| `HOSTTYPE` | 描述运行 bash shell 的机器特征的字符串。 |\n| `IGNOREEOF`\
  \ | shell 退出前必须接收到的连续 EOF 字符数。如果此值不存在，默认值为 1。 |\n| `INPUTRC` | readline 初始化文件的名称（默认是\
  \ `.inputrc`）。 |\n| `LANG` | shell 的语言区域（locale）类别。 |\n| `LC_ALL` | 覆盖 `LANG` 变量，定义语言区域类别。\
  \ |\n| `LC_COLLATE` | 设置排序字符串值时使用的排序顺序。 |\n| `LC_CTYPE` | 确定文件名扩展和模式匹配中使用的字符解释。\
  \ |\n| `LC_MESSAGES` | 确定解释以美元符号为开头的双引号字符串时使用的语言区域设置。 |\n| `LC_NUMERIC` | 确定格式化数字时使用的语言区域设置。\
  \ |\n| `LINENO` | 当前正在执行的脚本中的行号。 |\n| `LINES` | 定义终端可用的行数。 |\n| `MACHTYPE` | 以 `cpu-company-system`\
  \ 格式定义系统类型的字符串。 |\n| `MAILCHECK` | shell 检查新邮件的频率（以秒为单位，默认值为 60）。 |\n| `OLDPWD`\
  \ | shell 中使用的上一个工作目录。 |\n| `OPTERR` | 如果设置为 1，bash shell 会显示 `getopts` 命令生成的错误。\
  \ |\n| `OSTYPE` | 定义 shell 运行的操作系统的字符串。 |\n| `PIPEATUS` | 变量数组，包含前台进程组进程退出状态值的列表。\
  \ |\n| `POSIXLY_CORRECT` | 如果设置，bash 将以 POSIX 模式启动。 |\n| `PPID` | bash shell 父进程的进程\
  \ ID (PID)。 |\n| `PROMPT_COMMAND` | 如果设置，则在显示主提示符之前执行的命令。 |\n| `PS1` | 主命令行提示符字符串。\
  \ |\n| `PS2` | 次级命令行提示符字符串。 |\n| `PS3` | 用于 `select` 命令的提示符。 |\n| `PS4` | 使用 `bash\
  \ -x` 参数时，在回显命令行前显示的提示符。 |\n| `PWDWD` | 当前工作目录。 |\n| `RANDOM` | 返回一个 0 到 32767 之间的随机数。给此变量赋值会为随机数生成器设置种子。\
  \ |\n| `REPLY` | `read` 命令的默认变量。 |\n| `SECONDS` | 自 shell 启动以来过的秒数。为该变量赋值会将计时器重置为该值。\
  \ |\n| `SHELLOPTS` | 用冒号分隔的已启用 bash 选项列表。 |\n| `SHLVL` | 表示 shell 级别，每启动一个新的 bash\
  \ shell，级别加 1。 |\n| `TIMEFORMAT` | 指定 shell 如何显示时间值的格式。 |\n| `TMOUT` | `select`\
  \ 和 `read` 命令等待输入的时间（以秒为单位）。默认值 0 表示无限等待。 |\n| `UID` | 当前用户的数字真实用户 ID。 |\n\n你可以使用\
  \ `set` 内置命令显示环境变量。在启动时设置的默认 shell 环境变量在不同的 Linux 发行版之间可以不同，且通常是不同的。\n\n# 附录 B\n\
  \n## sed 和 gawk 快速指南\n\n### 本附录内容\n- 使用 `sed` 的基础\n- 关于 `gawk` 你需要知道的\n\n如果你在 shell\
  \ 脚本中进行任何类型的数据处理，你很可能需要使用 `sed` 或 `gawk` 程序（有时两者都用）。本附录为 `sed` 和 `gawk` 命令提供了快速参考，这些命令在你的\
  \ shell 脚本中处理数据时非常有用。\n\n## sed 编辑器\n\n`sed` 编辑器可以根据你输入命令行或存储在命令文本文件中的命令来操纵数据流中的数据。它一次从输入中读取读取一行数据，并将该数据与提供的编辑器命令进行匹配，按照命令指定的更改流中的数据，然后将新数据输出到\
  \ `STDOUT`。\n\n### 启动 sed 编辑器\n\n使用 `sed` 命令的格式为：\n\n```\nsed options script file\n\
  ```\n\n选项参数允许你自定义 `sed` 命令的行为，包括表 B.1 所示的选项。\n\n#### 表 B.1 sed 命令选项\n\n| 选项 | 描述\
  \ |\n| :--- | :--- |\n| `-e script` | 将 `script` 中指定的命令添加到处理输入时运行的命令中。 |\n| `-f\
  \ file` | 将文件 `file` 中指定的命令添加到处理输入时运行的命令中。 |\n| `-n` | 不为每个命令产生输出，而是等待 `print` 命令。\
  \ |\n\n`script` 参数指定了应用于流数据的单条命令。如果需要多条命令，你 tu 必须使用 `-e` 选项在命令行中指定它们，或使用 `-f` 选项在单独的文件中指定它们。\n\
  \n### sed 命令\n\n`sed` 编辑器脚本包含 `sed` 对输入流中的每行数据进行处理的命令。本节描述了你你可能想要使用的一些常用 `sed` 命令。\n\
  \n#### 替换\n\n`s` 命令替换输入流中的文本。`s` 命令的格式为：\n\n```\ns/pattern/replacement/flags\n```\n\
  \n`pattern` 是要替换的文本，`replacement` 是 `sed` 将插入该位置的新文本。\n\n`flags` 参数控制替换的发生方式。共有四种替换标志可用：\n\
  - 一个数字，表示应该被替换的模式出现次数。\n- `g`: 表示应该替换文本的所有出现。\n- `p`: 表示应该打印原始行的内容。\n- `w file`:\
  \ 表示应该将替换结果写入文件。\n\n在第一种替换中，你可以指定要替换匹配模式的次数。例如，你使用 `2` 来替换第二次出现的情况。\n\n#### 定址\n\
  \n默认情况下，你在 sed 编辑器中命令适用于所有数据行。如果你想将命令应用于特定的行或一组行，则必须使用定址。\n\n定址有两种形式：\n- 数字行范围\n\
  - 文本模式\n\n这两种形式都使用相同的地址格式：\n\n```\n[address]command\n```\n\n使用数字定址时，你通过它们在文本流中的位置来引用行。`sed`\
  \ 编辑器将文本流中的第一行分配为行号，并随着每个新行连续递增。\n\n```\nsed '2,3s/dog/cat/' data1\n```\n\n另一种限制命令应用范围的方法稍微复杂。`sed`\
  \ 编辑器允许你指定一个文本模式，用它来过滤行。这种格式为：\n\n```\n/pattern/command\n```\n\n你必须将指定的模式封装在斜杠中。`sed`\
  \ 编辑器仅对包含你指定的文本模式的行应用命令。\n\n```\nsed '/rich/s/bash/csh/' /etc/passwd\n```\n\n此过滤器找到包含文本\
  \ `rich` 的行，并将文本 `bash` 替换为 `csh`。\n\n你针对特定地址将多个命令组合在一起：\n\n```\naddress {\n   \
  \ command1\n    command2\n    command3}\n```\n\n`sed` 编辑器对匹配指定地址的行应用指定的每个命令。`sed`\
  \ 编辑器将处理地址行列出的每条命令：\n\n```\nsed '2{\n  s/fox/elephant/\n  s/dog/cat/\n}' data1\n\
  ```\n\n`sed` 编辑器会对数据文件的第二行应用每一个替换。\n\n### 删除行\n\n\n\n\n\n`delete` 命令 `d` 的作用几乎名其实义。它会删除任何匹配所提供的地址方案的文本行。使用\
  \ `delete` 命令时要小心，如果忘记包含地址方案，流中的所有行都将被删除：\n\n```bash\nsed 'd' data1\n```\n\n`delete`\
  \ 命令在与指定地址结合使用时显然是最用的。这允许你从数据流中删除特定的文本行，删除方式既可以通过行号：\n\n```bash\nsed '3d' data6\n\
  ```\n\n或者通过一个特定的行范围：\n\n```bash\nsed '2,3d' data6\n```\n\n`sed` 编辑器的模式匹配功能也适用于 `delete`\
  \ 命令：\n\n```bash\nsed '/number 1/d' data6\n```\n\n只有匹配指定文本的行会被从流中删除。\n\n## 插入和追加文本\n\
  \n正如你预期的，像任何其他编辑器一样，`sed` 编辑器允许你向数据流插入和追加文本行。这两个操作之间的区别可能会引起困惑：\n\n- `insert` 命令\
  \ (`i`) 在指定行之前添加一个新行。\n- `append` 命令 (`a`) 在指定行之后添加一个新行。\n\n这两个命令的格式可能会让人困惑：你不能在单行命令上使用这些命令。你必须单独另一行来指定要插入或追加的行。此操作格式如下：\n\
  \n```bash\nsed '[address]command\\\nnew line'\n```\n\n`new line` 中的文本将出现在 `sed`\
  \ 编辑器输出中你指定的范围内。记住，当你使用 `insert` 命令时，文本出现在数据流文本之前：\n\n```bash\necho \"testing\"\
  \ | sed 'i\\\n> This is a test'\nThis is a test\ntesting \n$ \n``` \n\n当你使用 `append`\
  \ 命令时，文本出现在数据流文本之后：\n\n```bash\necho \"testing\" | sed 'a\\ \n> This is a test'\n\
  testing \nThis is a test \n$ \n``` \n\n这允许你在普通文本的末尾插入文本。\n\n## 修改行\n\n`change` 命令允许你更改数据流中整行文本的内容。它的工作原理与\
  \ `insert` 和 `append` 命令相同，即你必须在 `sed` 命令的其他部分单独指定新行：\n\n```bash\nsed '3c\\\n> This\
  \ is a changed line of text.' data6\n```\n\n反斜线字符用于指示脚本中的新数据行。\n\n## 转换命令\n\n`transform`\
  \ 命令 (`y`) 是 `sed` 编辑器中唯一对单个字符进行命令。`transform` 命令使用的格式为：\n\n`[address]y/inchars/outchars/`\n\
  \n`transform` 命令对 `inchars` 和 `outchars` 的值执行一对一映射。`inchars` 中的第一个字符转换为 `outchars`\
  \ 中的第一个字符。`inchars` 中的第二个字符转换为 `outchars` 中的第二个字符。这种映射一直持续到指定字符的整个长度。如果 `inchars`\
  \ 和 `outchars` 的长度不相同，`sed` 编辑器将产生错误消息。\n\n## 打印行\n\n与替换命令中的 `p` 标志类似，`p` 命令在 `sed`\
  \ 编辑器输出中打印一行。`print` 命令最常用的用途是打印包含来自文本模式匹配文本的行：\n\n```bash\nsed -n '/number 3/p'\
  \ data6\nThis is line number 3. \n$ \n```\n\n`print` 命令允许你仅从输入流中过滤特定的数据行。\n\n##\
  \ 写入文件\n\n`w` 命令用于将行写入文件。`w` 命令的格式为：\n\n`[address]w filename`\n\n`filename` 可以指定为相对路径或绝对路径，但无论哪种，运行\
  \ `sed` 编辑器的用户必须对该文件具有写权限。`address` 可以是 `sed` 中使用的任何类型地址方法，例如单行号、文本模式或行号或文本模式范围。\n\
  \n这里有一个示例，将数据流的前两行打印到文本文件中：\n\n```bash\nsed '1,2w test' data6\n```\n\n输出文件 `test`\
  \ 仅包含输入流的前两行。\n\n## 从文件读取\n\n你已经看到如何通过 `sed` 命令行向数据流插入和追加文本。`read` 命令 (`r`) 允许你插入包含在单独文件中的数据。\n\
  \n`read` 命令的格式为：\n\n`[address]r filename`\n\n`filename` 参数指定包含数据的文件的绝对路径或相对路径。你不能对\
  \ `read` 命令使用地址范围。你只能指定单行号或文本模式地址。`sed` 编辑器会在地址之后插入来自文件的文本。\n\n```bash\nsed '3r\
  \ data' data2\n```\n\n`sed` 编辑器将数据文件的完整文本插入到 `data2` 文件，从 `data2` 文件的第三行开始。\n\n\
  ## gawk 程序\n\n`gawk` 程序是 Unix 中原始 `awk` 程序的 GNU 版本。`awk` 程序通过提供编程语言而非仅仅编辑器命令，将流编辑更了一了一。本节介绍了\
  \ `gawk` 程序的基础知识，作为其能力的快速参考。\n\n### gawk 命令格式\n\n`gawk` 程序的的基本格式如下：\n\n`gawk options\
  \ program file`\n\n表 B.2 显示了 `gawk` 程序可用的选项。\n\n#### gawk 选项\n\n| 选项 |or |\n| :---\
  \ | :--- |\n| `-F fs` | 指定文件分隔符以分隔行中的数据字段。 |\n| `-f file` | 指定要从文件中读取的程序。 |\n| `-v\
  \ var=value` | 定义 `gawk` 程序中使用的变量和默认值。 |\n| `-mf N` | 指定数据文件中处理的最大字段数。 |\n| `-mr\
  \ N` | 指定数据文件中最大的记录大小。 |\n| `-W keyword` | 指定 `gawk` 的兼容模式或警告级别。使用帮助选项列出所有可用关键字。\
  \ |\n\n命令行选项提供了一种自定义 `gawk` 程序功能的简易方法。\n\n## 使用 gawk\n\n你可以直接从命令行使用 `gawk`，也可以在你的\
  \ shell 脚本中使用它。本节演示了如何使用 `gawk` 程序以及如何输入供 `gawk` 处理的脚本。\n\n### 从命令行读取程序脚本\n\n`gawk`\
  \ 程序脚本由一对左括号和右括号定义。你必须在两个括号之间放置脚本命令。由于 `gawk` 命令行假设脚本是单个文本字符串，你还必须将脚本封装在单引号中。这里有一个在命令行指定的简单\
  \ `gawk` 程序脚本的示例：\n\n```bash\ngawk '{print $1}'\n```\n\n该脚本将显示输入流中每一行的第一个数据字段。\n\
  \n### 在程序脚本中使用多个命令\n\n如果只能执行一个命令，那么编程语言将非常没有用处。`gawk` 编程语言允许你将命令组合成一个正常的程序。要在命令行指定的程序脚本中使用多个命令，只需在每个命令之间放置分号：\n\
  \n```bash\necho \"My name is Rich\" | gawk '{$4=\"Dave\"; print $0}'\nMy name is\
  \ Dave \n$ \n``` \n\n该脚本执行两个命令：首先它用不同的值替换第四数据字段；然后显示流中的整个数据行。\n\n### 从文件读取程序\n\n\
  与 `sed` 编辑器一样，`gawk` 编辑器允许将程序存储在文件中并在命令行引用它们：\n\n```bash\ncat script2\n{ print $5\
  \ \"'s userid is \" $1 }\ngawk -F: -f script2 /etc/passwd\n```\n\n`gawk` 程序对输入流数据处理文件中指定的所有命令。\n\
  \n### 在处理数据之前运行脚本\n\n`gawk` 程序还允许指定程序脚本运行的时机。默认情况下，`gawk` 从输入读取一行文本，然后在该行文本的数据上执行程序脚本。有时你可能需要在处理数据之前运行脚本，例如为报告创建一个标题部分。为了实现这一点，使用\
  \ `BEGIN` 关键字。这强制 `gawk` 在读取数据之前执行 `BEGIN` 关键字之后指定的程序脚本：\n\n```bash\ngawk 'BEGIN\
  \ {print \"This is a test report\"}'\nThis is a test report \n$ \n```\n\n\n\n\n\n\
  你可以在 `BEGIN` 节中放置任何类型的 `gawk` 命令，例如为变量分配默认值的命令。\n\n## 在处理数据后运行脚本\n\n与 `BEGIN` 关键字类似，`END`\
  \ 关键字允许你指定一个程序脚本，`gawk` 会在读取完数据后执行该脚本：\n\n```bash\n$ gawk 'BEGIN {print \"Hello\
  \ World!\"} {print $0} END {print \"byebye\"}'\nHello World!\nThis is a test\nThis\
  \ is a test\nThis is another test.\nThis is another test.\nbyebye\n$ \n```\n\n`gawk`\
  \ 程序会首先执行 `BEGIN` 节中的代码，然后处理输入流中的任何数据，最后执行 `END` 节中的代码。\n\n## gawk 变量\n\n`gawk`\
  \ 程序不仅仅是一个编辑器；它是一个完整的编程环境。因此，有许多与 `gawk` 相关的命令和功能。本节展示了使用 `gawk` 编程时需要了解的主要功能。\n\
  \n### 内置变量\n\n`gawk` 程序使用内置变量来引用程序数据中的特定功能。本节描述了可以在你的 `gawk` 程序中使用的 `gawk` 内置变量，并演示了如何使用它们。\n\
  \n`gawk` 程序将数据定义为记录（records）和数据字段（fields）。记录行数据（默认由换行符分隔），数据字段是行内一个独立的数据元素（默认由空白字符，如空格或制表符分隔）。\n\
  \n`gawk` 程序使用数据字段变量来引用每个记录中的数据元素。[表 B.3] 描述了这些变量。\n\n#### gawk 数据字段和记录变量\n\n| 变量\
  \ | 说明 |\n| :--- | :--- |\n| `$0` | 整个数据记录 |\n| `$1` | 记录中的第一个数据字段 |\n| `$2` | 记录中的第二个数据字段\
  \ |\n| `$n` | 记录中的第 n 个数据字段 |\n| `FIELDWIDTHS` | 用空格分隔的数字列表，定义每个数据字段的精确宽度（以空格为单位）\
  \ |\n| `FS` | 输入字段分隔符 |\n| `RS` | 输入记录分隔符 |\n| `OFS` | 输出字段分隔符 |\n| `ORS` | 输出记录分隔符\
  \ |\n\n除了字段和记录分隔符变量外，`gawk` 还提供了其他内置变量，帮助你了解数据情况并从 shell 环境提取信息。[表 B.4] 显示了 `gawk`\
  \ 中的其他内置变量。\n\n#### 更多 gawk 内置变量\n\n| 变量 | 说明 |\n| :--- | :--- |\n| `ARGC` | 命令行参数的数量。\
  \ |\n| `ARGIND` | 当前正在处理的文件在 `ARGV` 中的索引。 |\n| `ARGV` | 命令行参数数组。 |\n| `CONVFMT`\
  \ | 数字的转换格式（参见 `printf` 语句）。默认值为 `%.6 g`。 |\n| `ENVIRON` | 当前 shell 环境变量及其值的关联数组。\
  \ |\n| `ERRNO` | 读取或关闭输入文件时发生错误时的系统错误代码。 |\n| `FILENAME` | 用于 `gawk` 程序输入的数据文件名。\
  \ |\n| `FNR` | 数据文件中的当前记录号。 |\n| `IGNORECASE` | 如果设置为非零值，`gawk` 所有字符串函数（包括正则表达式）将忽略字符的大小写。\
  \ |\n| `NF` | 数据文件中的数据字段总数。 |\n| `NR` | 已处理的输入记录数。 |\n| `OFMT` | 显示数字的输出格式。默认值为\
  \ `%.6 g`。 |\n| `RLENGTH` | `match` 函数中匹配到的子字符串的长度。 |\n| `RSTART` | `match` 函数中匹配到的子字符串的起始索引。\
  \ |\n\n你可以在 `gawk` 程序脚本的任何地方内置变量，包括 `BEGIN` 和 `END` 节。\n\n### 在脚本中赋值变量\n\n在 `gawk`\
  \ 程序中为变量赋值与在 shell 脚本中为变量赋值类似——使用赋值语句：\n\n```bash\n$ gawk '\n> BEGIN{ \n> testing=\"\
  This is a test\" \n> print testing \n> }'\nThis is a test\n$ \n```\n\n一旦你为变量分配了值，就可以在\
  \ `gawk` 脚本的任何地方使用该变量。\n\n### 在命令行中赋值变量\n\n你还可以使用 `gawk` 命令行为 `gawk` 程序中的变量赋值。这允许你在普通代码之外设置值，动态更改值。这里有一个使用命令行变量显示文件中特定数据字段的示例：\n\
  \n```bash\n$ cat script1\nBEGIN{FS=\",\"}\n{print $n}\n$ gawk -f script1 n=2 data1\n\
  $ gawk -f script1 n=3 data1\n```\n\n这一功能是在 `gawk` 脚本中处理来自 shell 脚本数据的极佳方法。\n\n##\
  \ gawk 程序功能\n\n`gawk` 程序的某些功能使其便于处理数据，允许你创建可以解析几乎任何类型文本文件（包括日志文件）的 `gawk` 脚本。\n\n\
  ### 正则表达式\n\n你可以使用基础正则表达式（BRE）或扩展正则表达式（ERE）来限制 `gawk` 脚本处理的数据流。在使用正则表达式时，`gawk`\
  \ 所有字符串函数（包括正则表达式）将忽略字符的大小写：\n\n```bash\n$ gawk 'BEGIN{FS=\",\"} {print $1}'\n```\n\
  \n### 匹配运算符\n\n匹配运算符（浪号 `~`）配合正则表达式，可以匹配特定的数据字段。例如，如果你想显示以 root 开头的行，可以使用：\n\n```bash\n\
  $ gawk '/^root/'\n```\n\n### 数学表达式\n\n除了正则表达式，你还可以在数据字段中使用数学表达式。这在需要匹配特定数值值时非常有用。\n\
  \n## 结构化命令\n\n`gawk` 程序支持以下结构化命令：\n\n- `if-then-else` 语句：\n```bash\nif (condition)\
  \ {\n    statement1\n} else {\n    statement2\n}\n```\n- `while` 语句：\n```bash\n\
  while (condition) {\n    statements\n}\n```\n- `for` 语句：\n```bash\nfor (init;condition;step)\n\
  \    statements\n```\n\n\n\n这为 `gawk` 程序员提供了丰富的编程机会，你可以编写出足以竞争任何高级语言的 `gawk` 程序。\n\
