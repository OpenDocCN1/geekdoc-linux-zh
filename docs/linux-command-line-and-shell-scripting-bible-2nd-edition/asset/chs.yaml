  \ 命令还允许你通过 `-O` 参数指定组的成员列表：\n\n```bash\n# /usr/sbin/groupmod -O user1,user2 group_name\n\
  ```\n\n或者，你可以使用 `gpasswd` 命令来向组中添加成员：\n\n```bash\n# /usr/sbin/gpasswd -a user1 group_name\n\
  ```\n\n或者，你也可以从组中删除成员：\n\n```bash\n# /usr/sbin/gpasswd -d user1 group_name\n```\n\
  \n# 使用 Linux 组\n\n用户账户对于控制单个用户的安全性非常有效，但它们在允许一组用户共享资源方面并不如人。为了实现这一点，Linux 系统使用了另一个安全概念，称为“组（groups）”。\n\
  \n组权限允许多个用户对系统上的对象（例如文件、目录或设备）共享一组通用的权限（稍后将在“解码文件权限”部分对这部分进行更详细介绍）。\n\n不同的 Linux\
  \ 发行版在处理默认组成员关系方面有所不同。某些 Linux 发行版仅创建一个包含所有用户账户作为成员的组。如果你的 Linux 发行版是这样做，你需要小心，因为你的文件可能被系统上的所有其他用户读取。其他发行版则为每个用户创建一个单独的用户账户，以提供更高的安全性。\n\
  \n每个组都有一个唯一的 `GID`，它和 `UIDs` 一样，是系统上唯一的数值值。除了 `GID` 之外，每个组都有一个唯一的组名。你可以使用一些组工具在\
  \ Linux 系统上创建和管理你自己的组。本节将讨论组信息是如何存储的，以及如何使用组工具来创建新组和修改现有组。\n\n## /etc/group 文件\n\
  \n与用户账户一样，组信息也存储在系统的一个文件中。`/etc/group` 文件包含了系统上使用的每个组的信息。以下是 Linux 系统上典型的 `/etc/group`\
  \ 文件的示例：\n\n```\nroot:x:0:root\nbin:x:1:root,bin,daemon\ndaemon:x:2:root,bin,daemon\n\
  sys:x:3:root,bin,adm\nadm:x:4:root,adm,daemon\nrich:x:500:\nmama:x:501:\nkatie:x:502:\n\
  jessica:x:503:\nmysql:x:27:\ntest:x:504:\n```\n\n与 `UIDs` 类似，`GIDs` 使用特殊格式进行分配。用于系统账户的组被分配\
  \ 500 以下的 `GIDs`，而用户组分配的 `GIDs` 从 500 开始。`/etc/group` 文件使用四个字段：\n\n- 组名\n- 组密码\n\
  - `GID`\n- 属于该组的用户账户列表\n\n组密码允许非组成员通过使用密码临时成为该组的成员。虽然这个功能并不十分常用，但它确实存在。\n\n你永远不应该通过编辑\
