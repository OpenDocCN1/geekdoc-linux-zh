  \ | 在编辑器窗口底部提供一个交互式控制台，用于使用 Python 语言输入命令 |\n| 快速打开 (Quick Open) | 直接在 `gedit` 编辑窗口中打开文件\
  \ |\n| 代码片段 (Snippets) | 允许存储经常使用的文本片段，以便在文本任何地方检索 |\n| 排序 (Sort) | 快速对整个文件或所选文本排序\
  \ |\n| 语法检查 (Spell Checker) | 为文本文件提供字典语法检查 |\n| 标签列表 (Tag List) | 提供你可以轻松输入文本的常用字符串列表\
  \ |\n\n启用的插件在其名称旁的复选框中显示勾选。某些插件（例如 `External Tools` 插件）在选择后还会提供额外的配置功能。它允许你设置快捷键来启动终端（`gedit`\
  \ 显示输出的地方），以及用于启动 shell 会话的命令。\n\n遗憾的是，并不是所有插件都安装在 `gedit` 菜单栏的相同位置。某些插件出现在 `Tools”（工具）菜单项中（如\
  \ `Spell Checker` 和 `External Tools` 插件），而另一些出现在 `Edit”（编辑）菜单项中（如 `Change Case`\
  \ 和 `Insert Date/Time` 插件）。\n\n## 总结\n\n在编写 脚本时，你需要某种文本编辑器。Linux 环境提供了多种可用的文本编辑器。Unix\
  \ 世界中最流行的编辑器 `vi` 已经移植到 Linux 并变为 `vim` 编辑器。`vim` 编辑器提供了简单的文本编辑功能，并具有原始的全屏图形模式。`vim`\
  \ 提供了许多高级编辑器功能，如文本搜索和替换。\n\n另一个流行的 Unix 编辑器 `emacs` 也进入了 Linux 世界。Linux 版 `emacs`\
  \ 同时具有控制台和 X Windows 图形模式，成为新旧世界的桥梁。`emacs` 编辑器提供多个缓冲区，允许同时编辑多个文件。\n\n\n\n\n既然我们已经涵盖了\
  \ Linux 基础和命令行，现在是时候编写代码了。本章将讨论编写 shell 脚本的基础知识。在开始编写自己的 shell 脚本杰之前，你需要了解这些基本概念。\n\
  \n## 使用多个命令\n\n到目前为止，你已经看到如何使用 shell 的命令行界面（CLI）提示符输入命令并查看命令结果。shell 脚本的关键能够输入多个命令并处理每个命令的结果，甚至可能将一个命令的结果传递给另一个命令。shell\
  \ 允许将命令组合成单个步骤。\n\n如果你想一起运行两个命令，可以在同一行提示符上输入它们，并用分号分隔：\n\n```bash\n$ date ; who\n\
  \nMon Feb 21 15:36:09 EST 2011\nChristine tty2           2011-02-21 15:26\nSamantha\
  \ tty3           2011-02-21 15:26\nTimothy  tty1           2011-02-21 15:26\nuser\
  \    tty7           2011-02-19 14:03 (:0)\nuser    pts/0           2011-02-21 15:21\
  \ (:0.0)\n$\n```\n\n恭喜，你刚刚写了一个 shell 脚本！这个简单的脚本只使用了两个 bash shell 命令。`date` 命令首先运行，显示当前的日期和时间，然后是\
  \ `who` 命令的输出，显示当前谁登录了系统。使用这种技术，你可以根据需要连接起任意数量的命令，最多达到命令行字符数 255 个字符的限制。\n\n虽然使用这种技术对于小型脚本来说没问题，但它有一个很大的缺点：每次你想运行它时，都必须在命令行提示符上输入整个命令。与其手动在命令行中输入命令，你不如将命令组合到一个简单的文本文件中。当你需要运行这些命令时，只需运行该文本文件即可。\n\
  \n## 创建脚本文件\n\n要将 shell 命令置于文本文件中，首先你需要使用文本编辑器（见第 9 章）创建一个文件，然后将命令输入到文件中。\n\n在创建\
  \ shell 脚本文件时，你必须在文件的第一行指定你正在使用的 shell。其格式为：\n\n```bash\n#!/bin/bash\n```\n\n在普通的\
  \ shell 脚本行中，井号（`#`）用作注释行。shell 脚本中的注释行不会被 shell 处理。然而，shell 脚本文件的第一行比较特殊，井号后跟叹号告诉\
  \ shell 在什么 shell 下运行脚本（是的，你可以使用 bash shell 并使用另一个 shell 运行你的脚本）。\n\n在指定 shell 之后，命令被输入到文件的每一行，后面跟一个回车键。如前所述，可以使用井号添加注释。示例所示：\n\
  \n```bash\n#!/bin/bash\n\n# 此脚本显示日期和谁登录了系统\n\ndate\nwho\n```\n\n到此就结束了。如果你想的话，可以使用分号并将两个命令都放在同一行，但在\
  \ shell 脚本中，你可以将命令列在不同的行上。shell 将按照它们在文件中出现的顺序处理命令。\n\n另外注意，还包含了一行以井符号开头的行，它添加了注释。以井符号开头的行（第一行\
  \ `#!` 除外）不会被 shell 解释。这是为你自己记录脚本中发生的情况留注释的极佳方法，这样当你两年后回来查看时，就能轻松地想起你做过什么。\n\n将此脚本保存到名为\
  \ `test1` 的文件中，你就几乎准备就绪。在运行你新的 shell 脚本文件之前，还有几件事要做。\n\n如果你现在尝试运行该文件，你会失望地看到这个：\n\
  \n```bash\n$ test1\nbash: test1: command not found\n$\n```\n\n第一个要跨越的障碍是让 bash shell\
  \ 找到你的脚本文件。如果你还记得第 5 章的内容，shell 使用一个名为 `PATH` 的环境变量来查找命令。快速查看 `PATH` 环境变量就可以说明我们的问题：\n\
  \n```bash\n$ echo $PATH\n/usr/kerberos/sbin:/usr/kerberos/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin:/home/user/bin\
  \ $\n```\n\n`PATH` 环境变量被设置为仅在少数目录中查找命令。为了让 shell 找到 `test1` 脚本，我们需要做两件事之一：\n\n*\
  \   将 shell 脚本文件所在的目录添加到 `PATH` 环境变量。\n*   使用绝对路径或相对路径在提示符中引用我们的 shell 脚本文件。\n\n\
  ### 提示\n某些 Linux 发行版会将 `$HOME/bin` 目录添加到 `PATH` 环境变量。这在每个用户的 `HOME` 目录中创建了一个地方，用于放置\
  \ shell 可以找到并执行的文件。\n\n对于本示例，我们将使用第二种方法来告诉 shell 脚本文件的具体位置。记住在当前目录中引用文件时可以使用 shell\
  \ 中的单点操作符：\n\n```bash\n$ ./test1\nbash: ./test1: Permission denied\n$\n```\n\n现在\
  \ shell 顺利找到了 shell 脚本文件，但还有另一个问题。shell 表明你没有权限执行该文件。快速查看文件权限就能看出发生了什么：\n\n```bash\n\
  $ ls -l test1\n-rw-r--r--  1 user      user           73 Sep 24 19:56 test1\n$\n\
  ```\n\n当创建新的 `test1` 文件时，`umask` 值决定了新文件的默认权限设置。由于 `umask` 变量被设置为 022（见第 6 章），系统创建文件时仅为文件所有者提供了读/写权限。\n\
  \n下一步是使用 `chmod` 命令赋予文件所有者执行该文件的权限（见第 6 章）：\n\n```bash\n$ chmod u+x test1\n$ ./test1\n\
  \nMon Feb 21 15:38:19 EST 2011\nChristine tty2           2011-02-21 15:26\nSamantha\
  \ tty3           2011-02-21 15:26\nTimothy  tty1           2011-02-21 15:26\nuser\
  \    tty7           2011-02-19 14:03 (:0)\nuser    pts/0           2011-02-21 15:21\
  \ (:0.0) $\n```\n\n成功！现在所有部分都就绪可以执行脚本文件了。\n\n## 显示消息\n\n大多数 shell 命令都会产生自己的输出，显示在运行脚本的控制台上。然而，许多时候你可能想添加自己的文本消息来告诉用户脚本正在发生什么。你可以通过\
  \ `echo` 命令来实现。`echo` 命令可以在命令后显示一个简单的文本字符串：\n\n```bash\n$ echo This is a test\n\
  This is a test\n$\n```\n\n注意，默认情况下不需要使用引号来围定你显示的字符串。然而，如果你在字符串内部使用引号，这可能会变得棘手：\n\
  \n```bash\n$ echo Let's see if this\nLets see if this\n$\n```\n\n`echo` 命令使用双引号或单引号来围定字符串。如果你在字符串中使用它们，需要在文本内部使用一种类型，用另一种类型来围定字符串：\n\
  \n```bash\n$ echo \"This is a test to see if you're paying attention\"\nThis is\
  \ a test to see if you're paying attention\n$\n$ echo 'Rich says \"easy\".'\nRich\
  \ says \"easy\".\n$\n```\n\n现在引号显示正常。你可以在 shell 脚本需要显示额外信息的地方添加 `echo` 语句：\n\n```bash\n\
  $ cat test1\n#!/bin/bash\n# 此脚本显示日期和谁登录了系统\necho The time and date are:\ndate\n\
  echo \"Let's see who's logged into the system:\"\nwho\n$```\n\n当你运行此脚本时，它产生如下输出：\n\
  \n```bash\n$ ./test1\nThe time and date are:\nMon Feb 21 15:41:13 EST 2011\nLet's\
  \ see who's logged into the system:\nChristine tty2           2011-02-21 15:26\n\
  Samantha tty3           2011-02-21 15:26\nTimothy  tty1           2011-02-21 15:26\n\
  user    tty7           2011-02-19 14:03 (:0)\nuser    pts/0           2011-02-21\
  \ 15:21 (:0.0)\n$\n```\n\n这很不错，但如果你想在命令输出的同一行显示一个文本字符串怎么办？你可以使用 `echo` 语句的 `-n`\
  \ 参数来实现这一点。只需将第一个 `echo` 语句行改为：\n\n\n\n\n\n```bash\necho -n “The time and date are:\
  \ ”\n```\n\n你需要在字符串周围使用引号，以确保输出的字符串末尾有一个空格。命令的输出将从字符串输出停止的地方精确开始。现在的输出看起来像这样：\n\n\
  ```bash\n$ ./test1\nThe time and date are: Mon Feb 21 15:42:23 EST 2011\n```\n\n\
  让我们看看现在谁登录了系统：\n\n```\nChristine tty2          2011-02-21 15:26\nSamantha tty3 \
  \         2011-02-21 15:26\nTimothy  tty1          2011-02-21 15:26\nuser     tty7\
  \          2011-02-19 14:03 (:0)\nuser     pts/0         2011-02-21 15:21 (:0.0)\n\
  $\n```\n\n太棒了！`echo` 命令是脚本中与用户交互的关键部分。你会发现自己在很多情况下都会用到它，特别是当你想要显示脚本变量的值时。让我们来看下一部分。\n\
  \n## 使用变量\n\n仅仅从 shell 脚本运行单个命令是有用的，但它有其局限性。通常，你希望在 shell 命令中包含其他数据以处理信息。你可以通过使用变量来实现。变量允许你在\
  \ shell 脚本临时存储信息，供脚本中的其他命令使用。本节将介绍如何在 shell 脚本中使用变量。\n\n## 环境变量\n\n你已经看到了一种 Linux\
  \ 变量的操作示例。第 5 章描述了 Linux 系统中提供的环境变量。你也可以从 shell 脚本访问这些值。\n\nshell 维护着环境变量来跟踪特定的系统信息，例如系统名称、登录系统的用户名、用户的系统\
  \ ID（称为 `UID`）、用户的默认主目录以及 shell 用于查找程序的搜索路径。你可以使用 `set` 命令显示可用活动环境变量的完整列表：\n\n```bash\n\
  $ set\nBASH=/bin/bash\n...\nHOME=/home/Samantha\nHOSTNAME=localhost.localdomain\n\
  HOSTTYPE=i386\nIFS=$‘ \\t\\n’\nIMSETTINGS_INTEGRATE_DESKTOP=yes\nIMSETTINGS_MODULE=none\n\
  LANG=en_US.utf8\nLESSOPEN=‘|/usr/bin/lesspipe.sh %s’\nLINES=24\nLOGNAME=Samantha\n\
  ...\n```\n\n你可以通过在环境变量名称前面加上美元符号 `$` 来在脚本内部调用这些环境变量。下面的脚本演示了这一点：\n\n```bash\n$ cat\
  \ test2\n#!/bin/bash\n# 从系统显示用户信息\necho “User info for userid: $USER”\necho UID:\
  \ $UID\necho HOME: $HOME\n$\n```\n\n`$USER`、`$UID` 和 `$HOME` 环境变量用于显示有关登录用户的相关信息。输出应该像这样：\n\
  \n```bash\n$chmod u+x test2\n$ ./test2\nUser info for userid: Samantha\nUID: 1001\n\
  HOME: /home/Samantha\n$\n```\n\n注意，当运行脚本时，`echo` 命令中的环境变量会被替换为它们的当前值。同时注意注意，我们可以在第一个字符串的双引号内放置\
  \ `$USER` 变量，而 shell 脚本仍然能够理解我们的意图。然而，使用这种方法有一个缺点。看看这个例子中发生了什么：\n\n```bash\n$ echo\
  \ “The cost of the item is $15”\nThe cost of the item is 5\n```\n\n这显然不是预期的结果。每当脚本在引号内看到美元符号时，它认为你正在引用一个变量。在这个例子中，脚本尝试显示变量\
  \ `$1`（它未被定义），然后是数字 5。要显示实际美元符号，你必须在它前面加上反斜杠字符：\n\n```bash\n$ echo “The cost of\
  \ the item is \\$15”\nThe cost of the item is $15\n```\n\n这样好多了。反斜杠允许 shell 脚本将美元符号解释为实际的美元符号，而不是变量。下一节将展示如何在脚本中创建你自己的变量。\n\
  \n### 注意\n\n你可能还会看到使用 `${variable}` 格式引用的变量。变量名周围额外的大括号通常有助于从美元符号中识别变量名。\n\n###\
  \ 用户变量\n\n除了环境变量，shell 脚本还允许你在脚本内部设置和使用自己的变量。设置变量允许你临时存储数据并在整个脚本中使用它，使得 shell 脚本更像一个真正的计算机程序。\n\
  \n用户变量可以是任何长达 20 个字母、数字或下划线字符的字符串。用户变量对大小写敏感，因此变量 `Var1` 与变量 `var1` 不同。这条小规则经常让初学者程序员遇到麻烦。\n\
  \n使用等号 `=` 给用户变量赋值。变量、等号和值之间不能出现任何空格（这是初学者容易出错的地方之一）。以下是给用户变量赋值的几个示例：\n\n```bash\n\
  var1=10\nvar2=-57\nvar3=testing\nvar4=\"still more testing”\n```\n\nshell 脚本自动确定变量值使用的数据类型。在\
  \ shell 脚本内部定义的变量在整个脚本的生命周期内保持其值，但在脚本完成完成后会被删除。\n\n就像系统变量一样，用户变量可以使用美元符号引用：\n\n\
  ```bash\n$ cat test3\n#!/bin/bash\n# 测试变量\ndays=10\nguest=\"Katie”\necho “$guest\
  \ checked in $days days ago”\ndays=5\nguest=\"Jessica”\necho “$guest checked in\
  \ $days days ago”\n$\n```\n\n运行脚本会产生以下输出：\n\n```bash\n$ chmod u+x test3\n$ ./test3\n\
  Katie checked in 10 days ago\nJessica checked in 5 days ago\n$\n```\n\n每次引用变量时，它都会产生当前分配给它的值。记住，在引用变量值时使用美元符号，但在引用变量并为其赋值时，不使用美元符号。这里有一个我意思的示例：\n\
  \n```bash\n$ cat test4\n#!/bin/bash\n# 将变量值赋值给另一个变量\nvalue1=10\nvalue2=$value1\n\
  echo The resulting value is $value2\n$\n```\n\n当你在赋值语句中使用 `value1` 变量的值时，必须仍然使用美元符号。这段代码产生以下输出：\n\
  \n```bash\n$chmod u+x test4\n$ ./test4\nThe resulting value is 10\n$\n```\n\n如果你忘记了美元符号，并将\
  \ `value2` 赋值行写成如下：\n\n```bash\nvalue2=value1\n```\n\n```bash\n$ ./test4\nThe resulting\
  \ value is value1\n$\n```\n\n如果没有美元符号，shell 会将变量名解释为普通文本字符串，这通常不是你想要的的结果。\n\n###\
  \ 反引号 (Backtick)\n\nshell 脚本最有用的功能之一是那个低道的反引号字符，在 Linux 世界中通常被称为 backtick (``` `)。注意——这不是你习惯用于字符串的普通单引号字符。因为它在\
  \ shell 脚本之外并不常用，你可能甚至不知道在键盘的哪里找到它。你应该熟悉它，因为它是许多 shell 脚本的关键组件。提示：在美式键盘上，它通常与波浪号符号\
  \ (∼) 位于同一个键上。\n\n反引号允许你将 shell 命令的输出赋值给变量。虽然这看起来没什么，但它是脚本编程中的一个主要构建块。\n\n你必须用反引号包裹整个命令行：\n\
  \n```bash\ntesting=`date`\n```\n\nshell 运行反引号内的命令并将输出分配给变量。这里有一个使用普通 shell 命令输出创建变量的示例：\n\
  \n```bash\n$ cat test5\n#!/bin/bash\n# 使用反引号字符\ntesting=`date`\necho “The date and\
  \ time are: ” $testing\n$\n```\n\n变量 `testing` 接收来自 `date` 命令的输出，并在 `echo` 语句中显示它。运行\
  \ shell 脚本会产生以下输出：\n\n```bash\n$ chmod u+x test5\n$ ./test5\nThe date and time are:\
  \  Mon Jan 31 20:23:25 EDT 2011\n$\n```\n\n在这个例子中这没什么特别兴奋的（你完全可以直接把命令放在 echo 语句中），但一旦你将命令输出捕获到变量中，你就可以对其进行任何操作。\n\
  \n\n\n\n\n这是一个关于如何使用反引号（backtick）获取当前日期并将其用于脚本中创建唯一文件名的流行示例：\n\n```bash\n#!/bin/bash\n\
  \n# 将 /usr/bin 列表拷贝到日志文件中\n\ntoday=`date +y%m%d`\n\nls /usr/bin -al > log.$today\n\
  ```\n\n`today` 变量被赋值为格式化日期命令的输出。这是一种用于为日志文件名提取日期信息的常用技术。`+%y%m%d` 格式指示 `date` 命令以两位位年份、月份和日的格式显示日期：\n\
  \n```bash\n$ date +%y%m%d\n110131\n```\n\n脚本将该值赋值给变量，然后将其用作文件名的一部分。文件本身包含了目录列表的重定向输出（将在后文“输入和输出的重定向”部分讨论）。运行脚本后，你应该会在目录中看到新文件：\n\
  \n```\n-rw-r--r--  1 user      user           769 Jan 31 10:15 log.110131\n```\n\
  \n日志文件出现在目录中，文件名使用了 `$today` 变量的值。日志文件的内容是 `/usr/bin` 目录的列表。如果第二天运行该脚本，日志文件名将是 `log.110201`，从而为新的一创建一个新文件。\n\
  \n# 输入和输出的重定向\n\n有时，你希望保存命令的输出，而不是仅仅将其显示在显示器上。bash shell 提供了不同的运算符，允许你将命令的输出重定向到替代位置（例如文件）。重定向可以用于输入，也可以用于输出，将文件重定向到命令作为输入。本节描述了在\
  \ shell 脚本中使用重定向时需要的操作。\n\n## 输出重定向\n\n最基本的重定向类型是将命令的输出发送到文件。bash shell 使用大于号（`>`）来实现此操作：\n\
  \n```\ncommand > outputfile\n```\n\n原本应该显示在显示器上的任何命令内容将存储在指定的输出文件中：\n\n```bash\n\
  $ date > test6\n$ ls -l test6\n-rw-r--r--  1 user                      user    \
  \          29 Feb 10 17:56 test6\n$ cat test6\nThu Feb 10 17:56:58 EDT 2011\n```\n\
  \n重定向运算符创建了文件 `test6`（使用默认的 `umask` 设置），并将 `date` 命令的输出重定向到 `test6` 文件。如果输出文件已存在，重定向运算符将用新数据覆盖现有文件：\n\
  \n```bash\n$ who > test6\n$ cat test6\nuser      pts/0   Feb 10 17:55\n```\n\n现在，`test6`\
  \ 文件的内容包含了 `who` 命令的输出。\n\n有时，你可能不需要覆盖文件内容，而是需要将命令的输出追加到现有文件中，例如当你正在创建一个日志文件来记录系统上的操作时。在这种情况下，你可以使用双大于号（`>>`）来追加数据：\n\
  \n```bash\n$ date >> test6\n$ cat test6\nuser      pts/0   Feb 10 17:55\nThu Feb\
  \ 10 18:02:14 EDT 2011\n```\n\n`test6` 文件仍然包含之前处理的 `who` 命令的原始数据——现在它还包含了来自 `date`\
  \ 命令的新输出。\n\n## 输入重定向\n\n输入重定向是输出重定向的反面。输入重定向不是获取命令的输出并重定向到文件，而是获取文件内容并将其重定向到命令。\n\
  \n输入重定向符号是小于号（`<`）：\n\n```\ncommand < inputfile\n```\n\n记住此点的简单方法是：命令始终在命令行中列在第一个，而重定向符号“指向”数据流的方向。小于号表示数据从输入文件流向命令。\n\
  \n这是一个使用 `wc` 命令进行输入重定向的示例：\n\n```bash\n$ wc < test6\n      2       11      60\n\
  ```\n\n`wc` 命令提供数据中文本的计数。默认情况下，它产生三个值：\n\n- 文本中的行数\n- 文本中的单词数\n- 文本中的字节数\n\n通过将文本文件重定向到\
  \ `wc` 命令，你可以快速统计文件的行、、数和字节数。示例显示 `test6` 文件中有 2 行、11 个单词和 60 个字节。\n\n输入重定向还有另一种方法，称为内联输入重定向。这种方法允许你在命令行上指定输入重定向的数据，而不是在文件中。这起初看起来可能有些奇怪，但该过程有几个应用场景（如后文“执行数学运算”部分所示）。\n\
  \n内联输入重定向符号是双小于号（`<<`）。除了此符号外，你必须指定一个文本标记来界定输入数据的开始和结束。你可以使用任何字符串值作为文本标记，但它在数据的开头和结尾必须相同：\n\
  \n```\ncommand << marker\ndata\nmarker\n```\n\n在命令行上使用内联输入重定向时，shell 将使用次级提示符请求数据，该提示符定义在\
  \ `PS2` 环境变量（见第 5 章）。以下是使用它时的外观：\n\n```bash\n$ wc << EOF\n> data\n> EOF\n      2\
  \       11      60\n```\n\n内联输入重定向符号是双小于号（`<<`）。除了此符号外，你必须指定一个文本标记来界定输入数据的开始和结束。你可以使用任何字符串值作为文本标记，但它在数据的开头和结尾必须相同。\n\
  \n## 管道\n\n有时，你希望保存命令的输出，而不是仅仅将其显示在显示器上。bash shell 提供了不同的运算符，允许你将命令的输出重定向到替代位置（例如文件）。重定向可以用于输入，也可以用于输出，将文件重定向到命令作为输入。本节描述了在\
  \ shell 脚本中使用重定向时需要的操作。\n\n\n\n\n\n`abrt-libs-1.1.14-1.fc14.i686`\n\n`abrt-plugin-bugzilla-1.1.14-1.fc14.i686`\n\
  \n`abrt-plugin-logger-1.1.14-1.fc14.i686`\n\n`abrt-plugin-runapp-1.1.14-1.fc14.i686`\n\
  \n`acl-2.2.49-8.fc14.i686`\n\n...\n\n除非你是一个（非常）快速阅读者，否则你可能无法跟上该命令生成的输出内容。因为管道（piping）功能是实时运行的，只要\
  \ `rpm` 命令一产生数据，`sort` 命令就会忙于对这些数据进行排序。等 `rpm` 命令完成数据输出时，`sort` 命令已经完成了数据的排序，并开始在显示器上显示它们。\n\
  \n在命令中使用的管道数量没有限制。你可以继续将命令的输出管道传递给其他命令，以精炼你的操作。\n\n在这种情况下，由于 `sort` 命令的输出速度极快，你可以使用文本分页命令之一（如\
  \ `less` 或 `more`）来强制输出在每页数据结束处停止：\n\n```bash\nrpm -qa | sort | more\n```\n\n该命令序列运行\
  \ `rpm` 命令，将输出管道到 `sort` 命令，然后将该输出再次管道到 `more` 命令以显示数据，并在每页信息后停止。这现在允许你可以在继续之前暂停并阅读显示器上的内容，如图\
  \ 10.1 所示。\n\n使用管道将数据发送到 more 命令\n\n![10.1](img/c10f001.jpg)\n\n想要更进阶一些，可以使用重定向（redirection）结合管道将输出保存到文件中：\n\
  \n```bash\nrpm -qa | sort > rpm.list\nmore rpm.list\n```\n\n`abrt-1.1.14-1.fc14.i686`\n\
  \n`abrt-addon-ccpp-1.1.14-1.fc14.i686`\n\n`abrt-addon-kerneloops-1.1.14-1.fc14.i686`\n\
  \n`abrt-addon-python-1.1.14-1.fc14.i686`\n\n`abrt-desktop-1.1.14-1.fc14.i686`\n\n\
  `abrt-gui-1.1.14-1.fc14.i686`\n\n`abrt-libs-1.1.14-1.fc14.i686`\n\n`abrt-plugin-bugzilla-1.1.14-1.fc14.i686`\n\
  \n`abrt-plugin-logger-1.1.14-1.fc14.i686`\n\n`abrt-plugin-runapp-1.1.14-1.fc14.i686`\n\
  \n`acl-2.2.49-8.fc14.i686`\n\n...\n\n如所料，`rpm.list` 文件中的数据现在已经排序完毕！\n\n到目前为止，管道最常用的用法之一是将产生长输出的命令结果管道到\
  \ `more` 命令。这在 `ls` 命令中尤为常见，如图 10.2 所示。\n\n在 ls 命令中使用 more 命令\n\n![10.2](img/c10f002.jpg)\n\
  \n`ls -l` 命令会生成该目录中所有文件的详式列表。对于文件众多的目录，这可能是一个非常长的列表。通过将输出管道到 `more` 命令，你可以强制输出在每页数据的结束处停止。\n\
  \n## 执行数学运算\n\n任何编程语言中至关重要的另一个特性是处理数字的能力。遗憾的是，对于 shell 脚本来说，这个过程有点笨拙。在 shell 脚本中执行数学运算有两种不同的方法。\n\
  \n### expr 命令\n\n起初，Bourne shell 提供了一个用于处理数学方程的特殊命令。`expr` 命令允许从命令行处理方程，但它非常难用：\n\
  \n```bash\nexpr 1 + 5\n6\n```\n\n`expr` 命令识别一些不同的数学和字符串操作符，如表 10.1 所示。\n\nexpr 命令运算符\n\
  \n| 操作符 | 描述 |\n| :--- | :--- |\n| `ARG1 \\| ARG2` | 如果两个参数都不空或非零，返回 `ARG1`；否则返回\
  \ `ARG2`。 |\n| `ARG1 & ARG2` | 如果两个参数都不为空或非零，返回 `ARG1`；否则返回 0。 |\n| `ARG1 < ARG2`\
  \ | 如果 `ARG1` 小于 `ARG2`，返回 1；否则返回 0。 |\n| `ARG1 <= ARG2` | 如果 `ARG1` 小于或等于 `ARG2`，返回\
  \ 1；否则返回 0。 |\n| `ARG1 = ARG2` | 如果 `ARG1` 等于 `ARG2`，返回 1；否则返回 0。 |\n| `ARG1 !=\
  \ ARG2` | 如果 `ARG1` 不等于 `ARG2`，返回 1；否则返回 0。 |\n| `ARG1 >= ARG2` | 如果 `ARG1` 大于或等于\
  \ `ARG2`，返回 1；否则返回 0。 |\n| `ARG1 > ARG2` | 如果 `ARG1` 大于 `ARG2`，返回 1；否则返回 0。 |\n\
  | `ARG1 + ARG2` | 返回 `ARG1` 和 `ARG2` 的算术和。 |\n| `ARG1 - ARG2` | 返回 `ARG1` 和 `ARG2`\
  \ 的算术差。 |\n| `ARG1 * ARG2` | 返回 `ARG1` 和 `ARG2` 的算术积。 |\n| `ARG1 / ARG2` | 返回 `ARG1`\
  \ 除以 `ARG2` 的算术商。 |\n| `ARG1 % ARG2` | 返回 `ARG1` 除以 `ARG2` 的算术余数。 |\n| `STRING :\
  \ REGEXP` | 如果 `REGEXP` 匹配 `STRING` 中的模式，则返回该匹配项。 |\n| `match STRING REGEXP` | 如果\
  \ `REGEXP` 匹配 `STRING` 中的模式，则返回该匹配项。 |\n| `substr STRING POS LENGTH` | 返回从位置 `POS`（从\
  \ 1 开始）开始长度为 `LENGTH` 的子字符串。 |\n| `index STRING CHARS` | 返回 `CHARS` 在 `STRING` 中找到的位置；否则返回\
  \ 0。 |\n| `length STRING` | 返回字符串 `STRING` 的数值长度。 |\n| `+ TOKEN` | 将 `TOKEN` 解释为字符串，即使它是一个关键字。\
  \ |\n| `(EXPRESSION)` | 返回 `EXPRESSION` 的值。 |\n\n虽然标准操作符在 `expr` 命令中运行良好，但当从脚本或命令行使用它们时，问题就出现了。`expr`\
  \ 命令的许多操作符在 shell 中有其他含义（例如星号）。在 `expr` 命令中使用它们会产生奇怪的结果：\n\n```bash\nexpr 5 * 2\n\
  ```\n\n[/content]\n\n*(注：由于你提供的待翻译文本包含大量重复的包名和代码，且根据“不要重复输出原文”的原则，我在译文部分仅保留了逻辑结构和翻译内容。但由于你提供的待翻译文本本身包含了大量完全重复的列表，为了确保文档完整性，我按照文档工程师逻辑翻译了所有文本段落。如果需要去重后的包列表，请告知。)*\n\
