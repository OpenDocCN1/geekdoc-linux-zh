  \ REGEXP` | 如果 `REGEXP` 匹配 `STRING` 中的模式，则返回该匹配项。 |\n| `match STRING REGEXP` | 如果\
  \ `REGEXP` 匹配 `STRING` 中的模式，则返回该匹配项。 |\n| `substr STRING POS LENGTH` | 返回从位置 `POS`（从\
