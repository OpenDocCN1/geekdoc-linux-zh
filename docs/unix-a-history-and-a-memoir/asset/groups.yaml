    In any case, for a while I continued to work with Shen on combinatorial optimization.
    Shen was exceptionally insightful on such problems, to sense a promising line
    of attack by playing with small examples by hand. He had a new idea for the traveling
    salesman problem, a technique that greatly improved on his previous algorithm
    (which was already the best known), and I implemented it in a Fortran program.
    It worked, and for many years was the state of the art.


    This kind of work was fun and rewarding, but although I could convert ideas into
    working code perfectly, I wasn''t any good at the algorithmic parts. So I gradually
    drifted into other areas: document preparation software, specialized programming
    languages, and a bit of writing.


