    management, stable funding in a corporation that took a very long view, and an
    unfettered environment for exploration no matter how unconventional. Its adoption
    was facilitated by rapidly advancing technology where hardware kept smaller, cheaper
    and faster at an exponential rate.


    The early years of Unix were for me and many others at Bell Labs wondrously productive
    and fun. I hope that this book will help you sense some of the joy of creation,
    and indeed of making life better, Dennis Ritchie described in the epigraph above.


    # Acknowledgments


    One of the unexpected pleasures of writing this book has been to reconnect with
    many friends and colleagues, who have generously shared their memories and some
    great stories. It is hard to express how valuable that has been. I haven''t been
    able to include all of the stories, but I have greatly enjoyed hearing them, and
    I am in debt to many remarkable people that I have been fortunate enough to work
    with.


    Biographical material is scattered throughout the book, with major sections on
    the three main people whom Unix would not have happened—Ken Thompson, Dennis Ritchie
    and Doug McIlroy. Ken and Doug have provided invaluable feedback on the book,
    though they are in no way responsible for anything I''ve gone wrong or inadvertently
    misrepresented. I have also received valuable comments and suggestions from Dennis''s
    brothers John and Bill; his nephew Sam provided detailed comments on several drafts.


    As he has done many times before, John Bentley gave me invaluable insights, helpful
    suggestions for organization and emphasis, numerous anecdotes, and detailed comments
    on writing, or at least half a dozen drafts. I am enormously indebted to Jon once.


    Gerard Holzmann provided advice, archival material and many original photographs
    that have helped to make the book more visually interesting.


    Paul Kernighan read multiple drafts and spotted myriad typos. He also suggested
    some excellent titles, though in the end I regretted not to use A History of the
    Unix-speaking Peoples.


    Al Acho, Mike Bianchi, Stu Feldman, Steve Johnson, Michael Lesk, John Linderman,
    John Mashey, Peter Neumann, Rob Pike, Howard Trickey and Peter Weinberg provided
    critical reading and stories of early Unix days, many of which I have quoted or
    paraphrased.


    I also received many helpful comments and other contributions from Michael Bachand,
    David Brock, Grace Emlin, Maia Hamin, Bill Joy, Mark Kernighan, Meg Kernighan,
    William McGrath, Peter McIlroy, Arnold Robbins, Jonah Sinowitz, Bjarne Stroustrup,
    Warren Toomey and Janet Vertesi.


