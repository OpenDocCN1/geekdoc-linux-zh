    图 8.2：Xenix：微软版本的 Unix


    ## 8.2 Unix 战争


    20 世纪 80 年代后期，存在许多 Unix 系统供应商，它们都使用该商标名称，并提供的软件最初至少是基于贝尔实验室的第 7 版。它们之间存在不兼容性，特别是
    AT&T 的 System V 与伯克利（Berkeley）发行版之间。双方都认为拥有一个共同标准是非常理想的，但对于标准具体是什么，自然上存在分歧。


    X/Open 一个行业联盟于 1984 年成立，旨在创建一个标准的源代码环境，以便程序可以在任何 Unix 类系统上编译，而无需在更改代码的情况下重新编写。


    AT&T 和一些盟友成立了自己的小组。Unix International 为了颁布他们的标准，与一个名为“开放软件基金会”（Open Software Foundation）的组织的不同标准进行竞争。结果是？两个相互竞争且不同的“开放”标准。最终双方达成了和平，产生了一个名为
    POSIX（可移植操作系统接口）的标准，用于基础库函数；以及一个由 X/Open 管理的“单一 Unix 规范”（Single Unix Specification），在两者之间标准化了库、系统调用以及大量常用命令（包括
    shell、Awk、ed 和 vi）。


    1992 年，USL 和 AT&T 就 Unix 的知识产权问题发起了诉讼，声称伯克利未经许可使用了了 AT&T 的代码。伯克利对 AT&T 的代码进行了许多修改，并添加了自己的宝贵材料，包括让互联网变得可访问的
    TCP/IP 代码。


    伯克利继续删除并重写来自 AT&T 的代码，并在 1991 年发布了一个 Unix 版本，感觉上没有包含任何 AT&T 的私有材料。然而，AT&T 和 USL
    并不认可，这导致了诉讼。经过多次周旋，案件在纽泽州的一法法院得到审理，伯克利胜诉，部分原因是 AT&T 未能在其分发的代码上放置正确的版权声明。


    如果这一切听起来既复杂又无聊，你是对的，但在当时这是一件大事，双方都浪费了大量的时间和金。1991 年，AT&T 将 USL 的股份卖给了 11 家公司，1993
    年诺瓦公司（Novell）购买了 USL 和 Unix 的权利。诺瓦首席执行官雷·诺尔达（Ray Noorda）决定解决所有剩余的法律案件，也许他意识到相关方在律师身上花费的钱超过了他们通过销售能收回的资金。


    回想起来，我想可以说所有的法律纠纷都是 AT&T 早期且几乎是偶然决定向大学开放 Unix 的副作用。随着 Unix 从大学的免费使用扩展到愿意付费的机构，它在商业上变得具有可行性，或者至少具有这种可能。但对于有效的保护来说这已经太晚了。即使
    AT&T 的源代码受到限制，系统调用接口实际上处于公共领域，而且社区中拥有如此丰富的知识，以至于创建不受 AT&T 许可限制的版本几乎成了家常便饭。编译器、编辑器和所有工具等应用程序软件也是如此。用几个比喻来说，AT&T
    试图在皇冠宝石逃脱后才关上谷门。


    ## 8.3 Minix 和 Linux


    随着 AT&T 试图从软件中赚钱，其 Unix 许可变得变得越来越严格。这包括对 Unix 在大学中用方式的限制，这为没有此类限制的 BSD 赋予了优势。与此同时，AT&T
    与 BSD 之间持续的战争鼓励了其他人尝试构建他们自己的 Unix 类系统。独立创建的版本不受商业限制的限制，因为它们只使用了系统调用接口，而没有使用别人的代码。


    1987 年，在阿姆斯特丹自由大学，安迪·塔能鲍（Andy Tanenbaum）创建了 Minix，这是一种类 Unix 系统，在系统调用级别兼容，但完全从零开始编写，具有不同的内核组织结构。


    Minix 相对较小，为了帮助它的传播，安迪写了一本关于它的教科书，在比喻上类似于十年前的《狮子书》（Lions book）。Minix 源代码是免费提供的——其中一本书附带了大约十几张软盘，可以加载到
    IBM PC 上以提供运行的系统。我仍然留着安迪那本书的第一版，我可能还有我的 Minix 软盘。


    Minix 在今天仍然活跃良好，它是教育和实验操作系统的载体。


    AT&T 限制性许可的结果之一，结合 Minix 作为指南可用，导致一名 21 岁的芬兰大学学生独立开发了另一个在系统调用级别兼容的 Unix 类系统。1991
    年 8 月 25 日，林斯·托瓦尔斯（Linus Torvalds）在 Usenet 新闻组 comp.os.minix 上发布了一项内容，如图 8.3 所示。


    林斯并没有预料到他的爱好系统的辉煌未来，正如 Ken 和 Dennis 没有预料到 Unix 的成功那样。最初的几千行代码现在超过了 2000 万行，由托瓦尔斯（图
    8.4）担任主要开发者。托瓦尔斯还是 Git 的广泛使用的版本控制系统的创建者。


    然而，对于笔记本电脑和台式电脑来说；大多数运行 Windows，其次是 macOS。


    作为一个现代的旁白，是否可以对像 C 标准库或系统调用这样的编程接口进行版权保护，现在是 Oracle 和 Google 之间一场似乎无休止的诉讼的中心。Oracle
    在 2010 年收购了太阳系统公司并在那些时候起诉 Google，声称 Google 在 Android 手机未经许可使用了 Oracle 受版权保护的 Java
    接口。Google 赢得了此案，法官裁定专利无效且 Java API（应用程序接口）不受版权保护。


    Oracle 提出上诉，最终进行了新的审判。Google 再次获胜，但这次法院裁定 Oracle 胜诉。Google 向最高法院申请在那里提交案件的权利，希望解决关于
    API（而非实现！）是否可以受版权保护并防止其他方使用接口规范来创建相似系统的问题。

