    # 第四章：第六版


    Unix 并不做这种区分：任何程序都可以处理任何文件。如果将程序应用于某个文件没有意义——例如，尝试像编译 C 语言一样编译一个 Fortran 源文件——这与操作系统无关。


    Unix 文件被组织在目录中。（其他操作系统通常将这些称为文件夹。）一个 Unix 目录也是文件系统中的一个文件，但其内容由系统本身维护，而不是由用户程序。目录包含有关文件的信息，这些文件反过来可能是目录。


    一个目录条目包括目录内的文件名、访问权限、文件大小和创建日期，以及关于在哪里找到文件内容的信息。每个目录都有两个特殊的条目，命名为 "."（目录本身）和 ".."（父目录）；这两个条目的读音是“dot”和“dotdot”。根目录是这种层级结构的顶端；它的名称为
    `/`。可以通过从根目录开始路径到达任何文件，而任何文件都可以通过向上进入 `.. 父目录序列来找到根目录。因此，本书的文本可能位于 `/usr/bwk/book/book.txt`。系统还支持目录的概念，因此文件名可以相对于文件系统中的当前位置，而无需指定从根目录开始的全路径。


    由于任何目录都可以包含子目录，文件系统可以是任意深度的。这种嵌套目录和文件的组织方式被称为“层次级”文件系统。尽管从事后来看其优势是显而易见的，但在 Multics
    和 Unix 之前，层次级文件系统并不普及。例如，某些文件系统限制了嵌套深度；CTSS 将其限制为两层。


    ## 4.2 系统调用


    操作系统为运行在其上的程序提供一系列服务，如启动和停止程序、读取或写入文件中的信息、访问设备和网络连接、报告日期和时间等信息。这些服务在操作系统内部实现，运行中的程序可以通过一种称为“系统调用”（system
    calls）的机制进行访问。


    从非常真实的意义上说，系统调用就是操作系统，因为它们定义了系统提供的内容。一组系统调用可能存在多个独立的实现，正如不同版本的 Unix 和类 Unix 系统的情况所所示。一个完全不同的操作系统（例如
    Windows）可以提供软件将 Unix 调用转换为它自己的系统调用。即使是 Unix 类系统，也会有某些特定操作系统独有的系统调用。


    Unix 第一版略有 30 多个系统调用，其中大约一半与文件系统有关。因为文件只包含未解释的字节，所以基本文件系统接口极其简单，只有五个用于打开或创建文件、读取或写入其字节以及关闭文件的系统调用。C
    程序通过调用如下语句的函数来访问这些：


    ```

    fd = create(filename, perms)

    fd = open(filename, mode)

    read = read(fd, buf, n)

    write = write(fd, buf, n)

    status = close(fd)

    ```


    系统调用创建一个新文件并设置其访问权限，这通常包含或排除用户、用户组以及其他人的读取、写入和执行权限。这九个位通过相对少的机制提供了相当大的控制力。`open`
    系统调用打开一个存在的文件；`mode` 指定文件是要读取还是写入，`filename` 是层次级文件系统中的任意路径。


    调用 `open` 和 `create` 产生的 `fd` 值称为文件描述符（file descriptor），这是一个小的非负整数，用于后续对文件的读取和写入。`read`
    和 `write` 系统调用尝试从文件或向文件传输指定数量 `n` 的字节；每个函数返回实际传输的字节数。对于所有这些系统调用，如果返回负值（通常为 -1），则表示发生了某种错误。


    顺便提一下：


    还有用于设置文件内位置、确定其状态等的系统调用。这些在 50 年里都经过了修饰和偶尔的改进，但基本模型简单且易用。


    今天的读者可能很难体会这一切在当时是多么简化。在早期的操作系统，真实设备的无数复杂性反映在用户身上。人们必须知道所有的磁盘名称、它们的物理结构（例如它们有多少磁道和磁柱）以及数据如何在上面组织。Steve
    Johnson 提醒我当时 Honeywell 计算机上的分时子系统有多麻烦：


    > “Honeywell TSS 系统需要你进入子系统来创建一个磁盘文件。你会被问及 8 个问题：文件的初始大小、最大大小、名称、设备、谁可以读、谁可以写等。每一个问题都必须交互式地回答。当回答所有问题后，给操作系统信息，很可能误导致导致创建失败。这意味着你需要反复进入子系统，直到最终创建成功，系统显示‘SUCCESSFUL!（成功！’”


    Unix 效了 Multics 的做法，隐藏了所有这些无关的废话：文件只是字节。用户决定字节是什么，而操作系统负责存储和检索它们，而不向用户暴露设备属性。


    ## 4.3 Shell


    Shell 是一个运行其他程序的程序。它是允许用户运行命令的程序，也是用户与操作系统之间的主要接口。当我登录到 Unix 系统时，我的键盘连接到 shell。因为
    shell 是一个用户程序，它很容易被另一个程序替换，这就是为什么有许多 Unix Shell。一个非常重要的注意是：shell 是一个普通的用户程序，而不是操作系统的某些组成部分，这是另一个来自
    Multics 的想法。（这就是功能列表中提到的“按用户选择的命令语言”。）如果你不喜欢某个 shell 的工作方式，可以选择另一个，或者编写你自己的来代替。


    尽管如此，所有的 Unix Shell 都提供相同的基础功能，通常具有相同的语法。最重要的功能是运行程序。它们都提供文件名通配符（filenamecards），其中如
    `*` 等模式元字符会被展开为匹配模式的文件名列表。例如，为了运行 `wc`（单词计数）程序统计当前目录下所有以 `book` 开头的文件的行、单词和字符，只需给出命令


    ```

    $ book*

    ```


    Shell 将模式 `book*` 展开为当前目录下所有以 `book` 开头的文件名，并使用这些名称作为参数运行 `wc`。`wc` 命令本身并文件名列表是由模式指定的。这种展开由
    shell 而非单个程序完成，这一点很重要。


    Shell 的另一项主要服务是输入/输出重定向（input/output redirection）。如果一个程序从标准输入（默认是终端）读取，可以通过使其从输入文件读取：


    ```

    $ program <infile

    ```


    如果它向标准输出（再次默认是终端）写入，其输出可以重定向到输出文件：


    ```

    $ program >outfile

    ```


    如果输出文件不存在，则创建它。通过重定向，程序不知道它的输入或输出正在被重定向。这是一种统一的机制，由 shell 应用而不是由单个程序应用，并且比通过文件名参数指定文件输入输出的方法更易用，例如：


    ```

    $ program in=infile out=outfile

    ```


    脚本（script）是存储在文件中的命令序列。以此文件作为输入运行 shell 实例将运行脚本中的命令。


