    ![](img/07eb79c40271e71719affc2198867bf4_126_0.png)


    # **Figure 5.13:** Bjarne Stroustrup, ~1984 (Courtesy of Bjarne Stroustrup)


    Bell Labs wasn’t some mysterious secret operation; students knew it as the place
    where their software was created and their textbooks were written. Potential new
    hires could see that good work was being done and it was published; they didn’t
    have to worry about disappearing into an “industrial” research lab. That put Bell
    Labs recruiting on an equal footing with universities, with the added advantage
    that people could research full time at the Labs, without the distractions of
    teaching, administration and raising money. This combination of great software
    and influential books was a big part of what made the Labs so successful at the
    time.


    A third factor is more technical: the symbiosis among C and Unix as a programming
    environment, document preparation as a research area, and writing about technical
    topics as a major activity. This began with text formatting programs like Doug
    McIlroy’s Hoff, Joe Ossanna’s Nroff and Troff, and then the preprocessors like
    Eq, Tbl, and so on. Those tools made it easier to produce documents that included
    more typographically challenging content, like mathematics, tables, figures, diagrams,
    and graphs. That in turn led to better writing, because all of these document
    preparation programs shared a vital characteristic: they made it to make multiple
    revisions of documents and always have a clean copy to work from, opposed to the
    slow and painful alternative of giving material to a typist and waiting days for
    it to come back.'
