    # 第2章


    ## 原生 Unix (1969)


    “在某个时刻，我意识到我离一个操作系统只有三周时间。”

    肯·汤普森，东部计算机节，2019年5月4日


    Unix 操作系统诞生于1969 年，但它并非凭空出现。它源于贝尔实验室几位工作过其他操作系统和语言的人的经验。这一章将讲述那个故事。


    ## 2.1 一些技术背景


    本节是对构成书籍核心主题的基础材料的简短入门介绍：计算机、硬件、软件、操作系统、编程和编程语言。如果你已经熟悉这些概念，请跳过；如果不熟悉，我希望这能让你快速进入状态，以便你能理解这一切的意义。


    在大学教了 20 年后，我对于对他人的工作进行评判并不十分热衷。然而，这是必要的，有时人们必须做出影响生活的决定，比如解雇某人（我很幸运地从未这样做过）或让学生在某门课程中不及格（虽不常见但也并非未听说过）。贝尔实验室流程的优点之一是，它是基于了解工作的他人的共同判断的。正如道格·麦克罗伊（Doug
    McIlroy）所说：“同事精神是这个系统的天才之处。没有任何人的晋升取决于与某一个老板的关系。”实验室的过程并不完美，但它非常好，，确实听过和读过比这糟糕得多的考核流程。


