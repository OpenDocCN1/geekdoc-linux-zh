    Ken kept redesigning, eventually coming up with a language that fit the PDP-7
    and was much closer to BCPL than to Fortran. He called it B. Dennis Ritchie explained
    in “The Development of the C Language” in 1993,


    “B can be thought of as without types; more accurately, it is BCPL squeezed into
    8K of memory and filtered through Thompson’s brain. Its name most probably represents
    a contraction of BCPL, though an alternate theory holds that it derives from Bon,
    an unrelated language created by Thompson during the Multics days. Bon in turn
    was named either after his wife Bonnie, or (according to an encyclopedia quotation
    in his manual), after a religion whose rituals involve the murmuring of magic
    formulas.


    Up to this point, the computers in our story have been “word-oriented,” not “byte-oriented.”
    That is, they manipulate information in chunks that are significantly larger than
    a single byte. The IBM 7090 and similar computers like the GE series manipulated
    information naturally in chunks that were 36 bits (roughly four bytes); PDP-7
    chunks were 18 bits (two bytes). Word-oriented computers were clunky for processing
    bytes individually or in sequences: programmers had to use library functions or
    go through programming contortions to access individual bytes that were packed
    into the larger chunks.


    By contrast, the PDP-11 was byte-oriented: its fundamental unit of memory was
    the 8-bit word, not 18- or 36-bit words of earlier computers, though it could
    also manipulate information in larger chunks like 16 and 32-bit integers and 16-addresses.


    B was a good fit for word-oriented computers like the PDP-7 but not for when it
    arrived, Dennis started to enhance B for the new architecture and to write a compiler
    for it. The new language was called “NB,” for “New B,” and eventually became C.


    One of the main differences was that B was typeless, C supported data types that
    matched the data types that the PDP-11 provided: single bytes, two-byte integers,
    and eventually floating-point numbers with four or eight bytes. And languages
    like BCPL and B treated pointers (memory addresses) and integers as the same,
    C formally separated them, though for many years programmers unwisely treated
    them as if they were the same size.


    One of C’s novel contributions to programming languages was the way that it supported
    arithmetic operations on typed pointers. A pointer is a value corresponding to
    an address, that is, a location in primary memory, and it has'
