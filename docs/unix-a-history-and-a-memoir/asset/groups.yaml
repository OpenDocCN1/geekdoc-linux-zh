    = c[q(i),k]$ for any such subset. Summation of this equality over all $q(i)$ proves
    the claim.


    By construction, the cost for edges leaving the $i$-th copy of node $k$ in the
    derived tree is


    ```

    c[p(i),k]

    c[k(i),k''(i)] = c(k'',k'')

    \sum_{j=1}^{m} c[p(j),k]

    ```


    ```

    $\sum_{j=1}^{m} c[p(j),k] = \sum_{j=1}^{m} c[q(j),k] \le c(k'',k'')$

    ```


    Therefore $c[k(i),k''(i)] \ge c[p(i),k]$ and hence monotonicity of subroutine
    graph costs is preserved in the tree. Equality of values of edges leaving a copy
    of a particular node is obviously preserved since the same multiplying factor
    is used for all the edges leaving the given node.


