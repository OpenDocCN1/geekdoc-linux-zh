    \ 的 shell 显著丰富了 IO。第六版的 BUGS 部分说：“没有办法重定向诊断输出。”一个有用的新功能是分离标准错误（默认文件描述符2），这样脚本的输出就可以重定向到文件，而错误信息可以去其他地方，除非是终端：\n\
    \n```\nprog >file # 输出到文件，错误到终端\nprog >err # 输出到终端，错误到错误\nprog 1>file 2>err #\
    \ 输出到文件，错误到错误\nprog >file 2>&1 # 将错误合并到输出\n```\n\n到此，shell 已经变成了一种真正的编程语言，适用于编写任何可以合理制定为命令序列的任务。它通常可以完成足够的工作，无需编写\
    \ C 程序。\n\n多年来，更多的功能被加入了，特别是 Bash，这种“Bour Again Shell”现在是大多数 Linux 和 macOS 用户的默认\
