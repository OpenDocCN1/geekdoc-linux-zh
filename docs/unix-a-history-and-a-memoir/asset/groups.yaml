    parts of speech to find potential spelling mistakes, using only meager resources.


    Doug''s version of diff implements an efficient algorithm (invented independently
    by Harold Stone and Tom Szymanski for comparing two files, finding a minimal sequence
    of changes that will convert one into the other. This code is at the heart of
    source code control systems that manage multiple versions of files. Such systems
