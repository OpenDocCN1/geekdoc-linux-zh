    这是基于这样一个事实：对于任何 $i$，代价 $c[q(i),k]$ 被分配到那些作为 $q(i)$ 拷贝的 $p(j)$ 子集中。即对于任何这样的子集，$\sum[p(j),k]
    = c[q(i),k]$。对所有 $q(i)$ 将该等式求和便证明了该主张。


    根据构造，派生树中离开节点 $k$ 第 $i$ 个拷贝的边代价为：


    ```

    c[p(i),k]

    c[k(i),k''(i)] = c(k'',k'')

    \sum_{j=1}^{m} c[p(j),k]

    ```


    ```

    $\sum_{j=1}^{m} c[p(j),k] = \sum_{j=1}^{m} c[q(j),k] \le c(k'',k'')$

    ```


    因此 $c[k(i),k''(i)] \ge c[p(i),k]$，从而子程序图代价的单调性在树中得以保留。离开特定节点拷贝的边相等显然得到了保留，因为所有离开给定节点的边都使用了相同的倍因子。


    **图 5.6：** 我论文中的一页，使用 Roff 格式化。


    我不得不在打印页面中手动插入一些诸如求和（Σ）之类的特殊字符，但这种权宜机制的效果出奇地好，完全足够让我打印出我的论文了，我相信那是普林斯顿大学第一篇计算机打印的论文。（图
    5.6 显示了一个随机页面）。在随后的几年里，有一家学生机构会以低廉的费用为学生“roff”文档。Roff 是我编写的第一个被其他人以重要方式使用的程序。


    当我到达贝尔实验室（Bell Labs）时，我发现还有几个类似于 roff 的程序正在进行中，包括 Doug McIlroy 开发的一个基于 Saltzer
    原始设计的程序。Joe Ossanna 很快又写了一个强大多的函数，他称之为 Nroff，这使得专利部门能够格式化专利申请。正如我早些描述的那样，Nroff
    是为 Unix 购买第一批 PDP-11 计算机的关键工具。


    这个由文档准备爱好者组成的小群体，以及此类程序的活跃用户社区，完美契合了我的兴趣。接下来的十年里，我花了大量时间愉快地为文本格式化工具工作。


    # Troff 与排字机


    Roff 和 Nroff 只处理固定宽度（“等宽”）字符集，并不比 Model 37 型电传打字机的标准字母字符多到哪里，因此输出质量并不高。1973 年，Joe
    Ossanna 安排购买了一台照相排字机——Graphic Systems CAT，这种机器在报业行业非常流行。Joe 的意图是制作外观更好的技术文档，并帮助专利部门准备更好的专利申请书。


    CAT 可以打印正体、斜体和粗体的等比例间距字体，以及一组用于数学的希腊字母和特殊字符。它打印在长卷光刻纸上，这些纸必须在几种有毒且混乱的化学溶液中显影。这项技术早于激光打印机，激光打印机至少又过了
    10 年才变得广泛可用。此外，输出是黑白的；廉价打印直到几十年后才出现。


    每个字体都是一张带有字符图像的 35mm 胶片，安装在一个快速旋转的轮子上。轮上有四种字体，每个 102 个字符，因此单个任务的总字符库为 408 个字符。当纸张和目标字符处于正确位置时，排字机会通过一道强光穿过胶片图像并投射到光刻纸上。它可以实现
    16 种不同的尺寸。


    排字机很慢——改变尺寸需要它旋转机械转盘——而且光敏化学剂最令人不快，但输出质量足够高，让我们能生产专业的文档。事实上，曾出现过贝尔实验室的作者提交给期刊的论文受到质疑：它看起来太精美了，一定已经发表过了。


    为了驱动排字机，Joe 创建了 Nroff 的一个重要扩展，并称之为 Troff。“T”代表排字机（typesetter）；读作 tee-roff。Troff
    语言晦奥且棘手，只要有足够的技巧和耐心，它就能完成任何格式化任务，尽管很少有人能精通它。实际上，Troff 是一个针对真正奇特的计算机的汇编语言，因此大多数人通过宏包来处理标题、目录、段落、编号列表等格式化操作。这些宏在低级
