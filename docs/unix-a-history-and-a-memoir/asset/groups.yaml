    ![](img/07eb79c40271e71719affc2198867bf4_70_0.png)


    **Figure 3.12:** Magnetic core memory; 16K bits, 2K bytes (~5.25 in, 13 cm)


    Dennis had spent several summers at Bell Labs, and joined permanently in 1967
    as a member of technical staff in the Computing Science Research Center. For the
    first few years, he worked on Multics. As noted earlier, Multics proved too ambitious,
    and as it became clear that it would not live up to its goals, Bell Labs withdrew
    in 1969, leaving Ken, Dennis and colleagues with experience in innovative operating
    system design, an appreciation of implementation in high-level languages, and
    a chance to start over with much more modest goals. The result was the Unix operating
    system and the C programming language.


    The C programming language dates from early in the 1970s. It was based on Dennis''s
    experience with high-level languages for Multics implementation, but much reduced
    in size because most computers of the time had limited capacity; there simply
    wasn''t enough memory or processing power to support a complicated compiler for
    a complicated language. This enforced minimality Ken and Dennis''s preference
    for simple, uniform mechanisms. C was a good match as well for real computer hardware;
    it was clear how to translate it into good code that ran efficiently.


    ![](img/07eb79c40271e71719affc2198867bf4_71_0.png)


    **Figure 3.13:** Dennis Ritchie, ~1981 (Courtesy of Gerard Holzmann)


    C made it possible to write the entire operating system in a high level language.
    By 1973, Unix had been converted from its original assembly language form into
    C. This made it much easier to maintain and modify the system. It also enabled
    another giant step, moving the operating system from its original PDP-11 computer
    to other computers with different architectures. Because most of the system code
    was written in C, the system required not much more than porting the C compiler.


    Dennis was a superb technical writer, with a spare elegant style, deft turns of
    phrase, and often with flashes of dry wit that accurately reflected his personality.
    He and I wrote The C Programming Language together; it was published in 1978,
    with a second edition in 1988, and has since been translated into more than two
    dozen languages. Dennis''s reference manual formed the basis of the ANSI/ISO standard
    for C was first produced in 1988, and was a major part of the book. Without doubt,
    some of the success of C and Unix can be attributed to Dennis''s writing.


    With Ken Thompson, Dennis received many honors and awards for his work on C and
    Unix, including the ACM Turing Award (1983), the National Medal of Technology
    (1999), the Japan Prize for Information and Communications (2011), and the National
    Inventors Hall of Fame (posthumously in 2019).


    Dennis successfully avoided any management role for many years, but finally yielded
    and became head of the Software Systems department, where he was responsible for
    the group that was building the Plan 9 operating system. Dennis stepped down from
    management and retired officially in 2007, but continued to come to Bell Labs
    almost every day until his death in October 2011.


    Dennis was modest and generous, always giving credit to others while downplaying
    his own contributions. A typical example is found in the acknowledgment section
    of his 1996 retrospective on the evolution of Unix:


    “The reader will not, on the average, go far wrong if he reads each occurrence
    of ‘we’ with unclear antecedent as ‘Thompson, with some assistance from me.’ ”


    Dennis died in October 2011. This note from his sister and brothers can be found
    on his home page, which has been preserved at Bell Labs at www.bell-labs.com/usr/dmr/www.


    As Ritchie’s siblings, we are proud of his legacy. Dennis was a man who changed
    the world with code and kindness. His presence will be missed by all of the computing
    community.

