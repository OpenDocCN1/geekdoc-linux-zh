    ![](img/07eb79c40271e71719affc2198867bf4_29_0.png)


    图 1.6：Vic Vyssotsky，~1982（由贝尔实验室提供）


    ![](img/07eb79c40271e71719affc2198867bf4_29_1.png)


    图 1.7：图图划分示例


    这表面上是基于一个实际问题：如何将程序的部分分配到内存页中，使得在程序运行时，程序页在内存进之间交换（swapping）的次数降到最低。节点代表代码块，边代表从一个块到另一个块的可能转换，每条边都可以带有一个权重，用于衡量转换的频率，以及如果这两个块位于不同的页面将产生多大的代价。


    在某种意义上，这是一个人为的问题，但它是对现实世界的一种合理抽象，而且其他具体问题也共享这一抽象模型。例如，应该如何在电路板上布局组件，以减少连接两个电路板之间昂贵的布线？不太可能的是，我们如何将员工分配到建筑的不同楼层，以让人们与他们最经常交流的人留在同一楼层？


    这足以作为一个博士论文的选题依据了，但我的进展并不大。当我1968年夏天回到实验室进行第二次实习时，我将这个问题描述给了沈林（Shen Lin，图 1.8），他最近开发了已知解决经典旅行销员问题最有效的算法：给定一组城市，找到一条恰好访问每个城市一次并返回家乡的最短路径。


    沈提出了一种图划分的方法，看起来很有前景，尽管无法保证它能产生最好的答案，而且我想出了如何高效地实现它。我在大量的图上进行了实验，以评估该算法在实践中的效果。它看起来非常有效，但我们从未发现过一种能够保证最优解的方法。我还发现了几类有趣的特例图，在这些图中我可以设计出既快速又能保证产生最优解的算法。这些结果的结合足以完成论文了，到夏天结束时，我已经拥有了所需的一切东西。我在秋季完成了写作，并在
    1969 年 1 月底参加了最终口试。（普林斯顿乐观的估计是三年，结果变成了四半。）


    一周后，我开始在贝尔实验室的计算机科学中心工作。我参加了面试；实验室在秋天给我发了录取通知书，但带有一个前提：我的论文必须完成。中心主任也是我的上两级老板
    Sam Morgan 告诉我：“我们不招收没毕业的博士（PhDouts）。”完成论文绝对是一件好事；在 12 月报到之前，我又收到了另一封信，说我获得了大幅加薪！


    顺便提一下，当时我和沈并不知道，我们之所以无法找到一种总是找到最佳答案的高效图划分算法是有原因的。其他人一直在苦恼于图划分等组合优化问题的内在困难性，并发现了一些通用的关系。


    在 1971 年一项卓越的成果中，多伦多大学的数学家兼计算机科学家斯蒂芬·库（Stephen Cook）证明了这些挑战性问题中的许多（包括图划分在某种意义上是等价的：如果我们能为其中一个问题找到一种高效算法（即优于尝试所有可能的解），那么我们就能为所有这类问题找到高效算法。这类问题是否真的困难，在计算机科学中仍然是一个未解决的问题，但人们倾向于认为它们是困难的。库因其工作获得了
    1982 年图灵奖。


    当我 1969 年作为正式员工到达贝尔实验室时，没有人告诉我应该做什么工作。这是当时的标准做法：人们被介绍给其他人，被鼓励到处走走，然后让他们自己去寻找


