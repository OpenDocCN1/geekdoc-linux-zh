    \n# 第 5 章\n\n# 第七版（1976-1979）\n\n“实际上是有了 v7，系统才真正成熟并离开了研究的巢穴。v7 是第一个可移植版本，是通往无数硬件种类的放射性爆炸的最后一个共同祖先。因此，v7\
