    ## 9.4 历史会重演吗？


    还会有 Unix 吗？一个新的操作系统会凭空出现并在几十年内统治世界吗？当我谈到 Unix 时，经常有人问这个问题。我的答案是否定的，至少目前如此。不会有革命；更可能的是，操作系统将继续演进，同时携带大量的
    Unix DNA。


    但在计算的其他领域也可能发生类似的成功。世界上总有有创意的人，良好的管理也并非未未闻，硬件非常廉价，而优秀的软件通常是免费的。另一方面，现在缺乏了不受束的环境，工业研究大大缩减并受到限制，且比五十年前更追求短期利益，而学术研究则资金短缺。


    对于 Netflix，我持乐观态度，理由是伟大的想法源于个人。


    例如，早期为 Unix 贡献的人少寥其微；可以说，其核心只有一个人，肯·汤普森（Ken Thompson），他绝对是我见过的最好的程序员，一个无与伦比的原创思想者。丹尼斯·里奇（Dennis
    Ritchie）的名字可能与肯并列为 Unix 的创始人，他是一位至关重要的贡献者，他的 C 编程语言作为 Unix 早期演进的核心，至今仍是计算领域的通用语言。


    # 第 9 章：遗产


    研究程序员每天使用的语言是很有启发性的，看看它们最初有多少次是源于一个或两个人的杰作。几乎每种主要的编程语言都是如此，包括 Java（James Gosling）、C++（Bjarne
    Stroustrup）、Perl（Larry Wall）、Python（Guido von Rossum） 和 JavaScript（Brendan Eich）。可以很有地预测，未来会有新语言出现，让编程变得更简单、更安全。同样也可以很有地预测，不会只有一种语言——因为要兼顾所有用途，单一语言需要权衡的实在太多了。


    Google、Facebook、Amazon、Twitter 以及任何其他从初创公司成长为十亿美元企业的公司，都源于一或两个人的绝妙想法。这种情况将会更多，尽管也可能新想法出现、新公司成立，但它们也会很快被现有的大公司收购。绝妙的想法会被保留，发明者将获得丰厚的回报，但大鱼可能会吞掉小鱼。


    良好的管理是成功的另一个要素。道格·麦尔罗（Doug McIlroy）在此领域脱颖而出，他是一位卓越智力的领导者，拥有无伦比的技术判断力，其管理风格基于成为同事开发产品的首批用户之一。Unix
    本身，以及像 C 和 C++ 等语言和任何 Unix 工具，都得益于道格良好的品味和极其犀利的批判。各种类型的 Unix 文档也是如此，从用户手册到几十本具有影响力的书籍。我个人可以证明这一点点：道格是我
    1968 年博士论文的校外读者（外聘审稿人），对我所有的技术论文和书籍都给出了犀利的评论，并在 50 多年后依然在确保我没有偏离目标。


    贝尔实验室的管理在技术上是胜任的，而且他们不干预，因此他们不会强推特定的项目或方法。在实验室工作的 30 多年里，我从未觉得被要求必须做什么。在比尔·贝克（Bill
    Baker）之后，1981 年出任贝尔系统工程与科学副总裁的布鲁斯·汉纳（Bruce Hannay）曾说：


    “选择自由对研究科学家至关重要，因为研究是对未知的探索，没有地图告诉我们该走哪条路。每一个发现都会影响未来的研究方向，没有人能预测或安排发现。因此，贝尔实验室的研究经理为研究人员提供了最大限度的自由，这与机构的宗旨相一致。研究人员的选拔是基于他们的创造能力，并鼓励他们充分发挥这种能力。”


    我见过的这种近绝对自由的最好的例子，是肯·汤普森和乔·康登（Joe Condon）在他们的象棋计算机上做的工作。有一天，贝尔实验室主任比尔·贝克带一位显赫的访客来到
    Unix 房间，肯展示了 Belle。访客问为什么贝尔实验室支持象棋计算机的工作，因为这看起来和电话毫无关系。比尔·贝克回答说：Belle 是一个关于特殊用途计算机的实验，它促进了新电路设计和实现工具的发展，并让贝尔实验室在另一个领域获得了可见度。肯完全不需要做任何解释。


    做好优秀研究的大秘诀是雇佣优秀的人，确保他们有有趣的事情要做，放长眼光，并且不要干涉。这显然并不完美，但贝尔实验室的研究通常做得很好。


    当然，计算并非存在于技术的真空之中。晶体管和集成电路的发明意味着 50 年来，计算硬件以指数级变得越来越小、更快、更廉价。随着硬件变得更好、更容易，我们对如何创建它的理解也随之提高。Unix
    和许多其他系统一样，乘上了技术进步的浪潮。


    正如我在引言中所说，Unix 可能是一个奇点，是改变计算世界的独特状况组合。我怀疑我们会在操作系统中再次看到类似的东西，但肯定会有其他机会，少数拥有良好想法和支持环境的天才通过他们的发明改变世界。


    对我来说，贝尔实验室和 1127 号是一次奇妙的经历：里奇，“Unix 分时系统的演变”，1984 年 10 月


    # 来源


    “里奇和汤普森的名字可以安全地认为附加在几乎所有未注明来源的事物上。”


    “要进一步寻找，需要一本巨著、一份报告，可能还需要一个更客观的学者，而不是一个亲历者，”


    道格·麦尔罗，《研究 Unix 阅读者：程序员手册注释选段》，1971–1986, 1986


    许多历史都在网上（尽管并不总是以可搜索的形式存在），这归于一些业余和专业历史学者的好运和真正投入的工作，例如 Unix 遗产协会（Unix Heritage
    Society）和计算机历史博物馆。可以通过采访视频和口述历史获得更多材料；有些是同时期的，如各种 AT&T 的公关活动，另一些是回溯性的。这份来源清单既不完整也不详尽，但它将为想要进一步挖掘的读者提供一个良好的起点。这些文档许多可以在互联网上找到。


    《贝尔系统科学与工程史》共有七卷，有近 5000 页由贝尔的技术人员撰写，主要在 1970 年代和 1980 年代。其中一卷涉及计算的的出现。


    贝尔实验室维护了一系列关于 Unix 历史的页面，位于 s3-us-west-2.amazonaws.com/belllabs-micite-unix。


    > “我们想要保留的不仅仅是一个进行编程的良好环境”


    丹尼斯·里奇，“Unix 分时系统的演变，”1984 年 10 月


