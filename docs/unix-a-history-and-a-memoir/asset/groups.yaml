    \ 有一群才华横溢的同事对 Unix 相关相关系统做出了巨大的贡献。\n\n## 7.3 UNIX\n\n在 Unix 生命的早期，贝尔实验室的法律守护者认为该名称是一个必须保护的价值商标，以避免该名称变成通用术语而被任何人使用，就像阿司匹林、电梯、拉链等词发生的情况一样。特别是，它不能作为独立名词使用（“Unix\
