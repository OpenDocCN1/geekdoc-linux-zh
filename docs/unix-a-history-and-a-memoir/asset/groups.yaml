    Dennis (Figure 3.13) was born in September 1941. His father, Alistair Ritchie,
    worked for many years at Bell Labs in Murray Hill. Dennis went to Harvard where
    he did his undergraduate work in physics and his graduate work in applied mathematics.
    His PhD thesis topic (1968) was subrecursive hierarchies of functions, and is
