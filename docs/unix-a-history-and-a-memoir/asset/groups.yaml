    Eventually I managed to find all the places where the code relied on peculiarities
    of the CAT and replaced them with generic code driven by tables of typesetter
    characteristics like character sets, sizes, fonts, and resolutions. I invented
    a typesetter description language so that Troff could produce output that was
    tuned to the capabilities of a specific typesetter. Straightforward drivers converted
    that output into whatever input was needed for specific devices. This resulted
    in the so-called device-independent version called Ditto. It also enabled other
    document preparation preprocessors, especially Pic, which was able to take advantage
    of the higher resolution of new typesetting devices to draw lines and figures.


    One of those devices was a new typesetter from Mergenthaler called the Linotron
    202. On paper, this device seemed just what we needed to replace the CAT. It was
    fast, had high resolution, drew characters by painting them on a screen, its processor
    was a standard minicomputer (a Computer Automationed Mini), and it was controlled
    by a simple program to the ones I had written for other typeset. The main drawback
    was the cost, $50,000 in 1979, but we had done good work with the previous typesetter
    that management approved the purchase with hardly any discussion.


    Once the 202 arrived, we discovered that its hardware was impossibly flaky; the
    only thing worse was its software. This started several months of almost daily
