    要理解 Unix 是如何诞生的，我们必须了解贝尔实验室，特别是它是如何运作的以及它所提供的创作环境。

    AT&T，即美国电话电报公司是由合并全美各地的许多当地电话公司而成的。在它的历史上，AT&T 意识到它需要一个研究机构，来系统地解决公司在尝试提供全国电话系统时遇到的各种科学和工程问题。1925
    年，它创建了一个研发子公司——贝尔电话实验室（Bell Telephone Laboratories），来应对这些问题。其全称经常被缩写为 Bell Labs、BTL
    或简单的“实验室”（the Labs），电话始终是其核心关注。


    贝尔实验室最初位于纽约市西街 463 号（463 West Street），但在第二次世界大战初期，它的许多活动离开了纽约。AT&T 深度参与了战争努力，为各种重要的军事问题提供专业知识——当然包括通信系统，还有用于防空炮的火控计算机、雷达和密码学。部分工作是在新郊区和乡村完成的


