    ## CHAPTER 5: SEVENTH EDITION


    for managing bibliographic citations, which were important for technical papers.


    Many of the programs described in this chapter are preprocessors, that is, programs
    that convert some language into a suitable form for a subsequent process. Cfront,
    the original version of C++, would be more accurately described as an object-oriented
    preprocessor for C that evolved into C++. Sometimes, with C++, the preprocessor
    went away as functionality was absorbed into the downstream process. Most other
    times, however, the programs stayed separate, as the document preparation tools
    like Eqn and Thbl. Another example is bc, a preprocessor for dc, Bob Morris''s
    original unrivaled-precision calculator. Lorinda Cherry wrote bc to provide conventional
    infix arithmetic notation for dc, whose postfix notation was hard for novices
    to use casually.


    Preprocessors have many advantages. First, if one implements a language, it is
    not limited by syntax but can use a completely different style, with the various
    Troff preprocessors. Second, when memories were small, it was simply not possible
    to include more functionality in already large programs; this was especially the
    case with Troff. Finally, because the output of a preprocessor is available, it
    can be manipulated before passed on, to handle other kinds of processing. In the
    document preparation style, I''ve used Sed scripts and the like to fix characters
    and spacing. Chris Wyk and I wrote programs to do vertical justification of pages,
    by modifying the output of Troff before it went to a device driver. These would
    not have been possible if the functionality were embedded in a single program,
    or when the process is a pipeline, it is easy to add new stages at the front or
    back or middle.


    ## Device-independent Troff


    Joe Ossanna died in 1977 at the age of 48. Part of his legacy was the source code
    for Troff, which at the time was nearly 10,000 lines of inscrutable C that Joe
    had hand-transliterated from its original assembly language—no comments, dozens
    of global variables with 2-letter names, and (see the discussion of memory above)
    a variety of subtle tricks for cramping as much information as possible into not
    enough memory. In Joe''s defense, this was absolutely necessary to pack all of
    Troff''s functionality into 65K bytes, the maximum memory that was available to
    user programs on PDP-11/45 that we were using at the time.


    I did nothing with the code for at least a year, but finally got enough courage
    to start fiddling with it. Slowly and cautiously, I began an upgrade. The biggest
    problem, aside from the fact that there were no comments documentation beyond
    the user manual, was that it was strongly dependent on the original Graphic Systems
    CAT typesetter, which by this time was obsolete.


    Eventually I managed to find all the places where the code relied on peculiarities
    of the CAT and replaced them with generic code driven by tables of typesetter
    characteristics like character sets, sizes, fonts, and resolutions. I invented
    a typesetter description language so that Troff could produce output that was
    tuned to the capabilities of a specific typesetter. Straightforward drivers converted
    that output into whatever input was needed for specific devices. This resulted
    in the so-called device-independent version called Ditto. It also enabled other
    document preparation preprocessors, especially Pic, which was able to take advantage
    of the higher resolution of new typesetting devices to draw lines and figures.


    One of those devices was a new typesetter from Mergenthaler called the Linotron
    202. On paper, this device seemed just what we needed to replace the CAT. It was
    fast, had high resolution, drew characters by painting them on a screen, its processor
    was a standard minicomputer (a Computer Automated Mini), and it was controlled
    by a simple program to the ones I had written for other typeset. The main drawback
    was the cost, $50,000 in 1979, but we had done good work with the previous typesetter
    that management approved the purchase with hardly any discussion.


    Once the 202 arrived, we discovered that its hardware was impossibly flaky; the
    only thing worse was its software. This started several months of almost daily
    visits from Mergenthaler''s repair service, and a remarkable feat of reverse engineering
    of the hardware by Ken Thompson and Joe Condon (Figure 5.8).


    Joe was a physicist by training, but as his interests shifted, he became an exceptional
    designer of electronic circuits. He wrote many of the circuit design tools that
    the Center used for its hardware experiments, and with Ken was the designer of
    the Belle chess machine. His hardware expertise was crucial to figuring out the
    202.


    Ken began by writing a disassembler for the binary programs that ran on the machine.
    (For the record, he did this in a couple of hours one evening, while I went home
    for dinner and then came back for an evening of work.)


    Disassembling Mergenthaler''s programs gave Ken and Joe a foothold into how the
    typesetter itself worked, and after several weeks of intense reverse engineering
    they figured out Mergenthaler''s proprietary encoding of characters and source
    code we could create our own characters, like the then-current Bell System symbol
    at the top of Figure 5.9, a chess font for printing games and board diagrams,
    and a Peter face that had a variety of uses (for example, Figure 5.10).


