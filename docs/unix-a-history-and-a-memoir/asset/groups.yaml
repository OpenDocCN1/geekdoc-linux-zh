    we typically could hire one or two people a year, and almost always

    young ones, so hiring decisions were made very cautiously, perhaps too

    much so. It is of course a familiar problem in university departments as

    well. It is often unclear whether to go after a star in a particular field, or

    some who is broadly talented; Steve Johnson once put it, should

    be hiring athletes or first basemen? My preference has been for people

    who are really good at what they do, without worrying too much about

    specific what it is.


