    # 9.3 Recognition


    Unix and its primary creators, Ken Thompson and Dennis Ritchie, have been recognized
    for their contributions. When they won the ACM Turing Award in 1983, the award
    selection committee said


    “The success of the Unix system stems from its tasteful selection of a few key
    ideas and its elegant implementation. The model of the Unix system has led a generation
    of software designers to new ways of thinking about programming. The genius of
    the Unix system is its framework, which enables programmers to stand on the work
    of others.”


    They also received the US National Medal of Technology in 1999. Figure 9.1 is
    a picture with President Bill Clinton, one of the few occasions where either Ken
    or Dennis wore a suit and tie. Bell Labs was for at least a very informal environment
    by the standards of the time. As Dennis said in his “online biography, “Ken’s
    virtual coat-tails are long. I am one of the few, besides Bonnie T., who has seen
    him a real coat (and even black tie) on more than one occasion.” I personally
    have never seen Ken dressed up at all.


    Other awards include membership in the National Academy of Engineering, and the
    Japan Prize in Information and Communications in 2011, for which the citation
    reads


    “Compared to other operating systems prevailing around that time, their new and
    advanced OS was simpler, faster and featured a userfriendly hierarchical file
    system. Unix was developed in conjunction with the programming language, C, which
    is still widely used for writing OS, and dramatically improved the readability
    and portability of Unix source code. As a result, Unix has come to be used by
    various systems as embedded systems, personal computers, and super computers.”


    “Unix was also a major driving force behind the development of the Internet. University
    of California, Berkeley developed Berkeley Software Distribution (BSD), an extended
    version of Unix that was implemented with the Internet protocol suite TCP/IP.
    The development was based on the sixth edition of Unix that Bell Labs distributed
    along with its source code to universities and research institutions in 1975,
    which led to the beginning of an ‘open source’ culture. BSD Unix helped the realization
    of the Internet.”


