    turn was taken over by Nokia in 2016. Bell Labs was swept up in this wave of mergers
    and takeovers, along with the way, of those who had been involved with Unix and
    Center 1127 dispersed to other places. The number 1127 itself disappeared in a
    reorganization in 2005.


