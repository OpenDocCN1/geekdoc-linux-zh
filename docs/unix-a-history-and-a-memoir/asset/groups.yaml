    # CHAPTER 4: SIXTH EDITION


    Unix made no such distinctions: any program could process any file. If applying
    a program to a file doesn''t make sense—for example, trying to compile a Fortran
    source file as if it were C—that doesn''t have anything to do with the operating
    system.


    Unix files are organized in directories. (Other operating systems often call these
    folders.) A Unix directory is also a file in the file system, but one whose contents
    are maintained by the system itself, not by user programs. A directory contains
    information about files, which may be in turn directories.


    A directory entry includes the file name within the directory, access permissions,
    file size and date of creation, and information about where to find the contents
    of the file. Each directory has two special entries named "." (the directory itself)
    and ".." (the parent directory); these are pronounced "dot" and "dotdot". The
    root directory is the top of this hierarchy; its name is /. Any file can be reached
    by following the path from the root, and the root can be found by any file by
    going up the sequence of .. parent directories. Thus the text for this book might
    be found in /usr/bwk/book/book.txt. The system also supports the notion of a directory
    so filenames can be relative to the current location in the file system, rather
    than having to specify a full path from the root.


    Because any directory can contain subdirectories, the file system can be arbitrarily
    deep. This organization of nested directories and files is called a “hierarchical”
    file system. Again, though the advantages are obvious in hindsight, hierarchical
    file systems were not widely available before Multics and Unix. For example, some
    file systems limited the depth of nesting; CTSS limited it to two levels.


    ## 4.2 System calls


    An operating system provides a set of services to programs that run on it, services
    like starting and stopping programs, reading or writing information in files,
    accessing devices and network connections, reporting information like date and
    time, and many others. These services are implemented within the operating system,
    and are accessible from running programs through a mechanism called system calls.


    In a very real sense, the system calls are the operating system, since they define
    what the system provides. There may be multiple independent implementations of
    a set of system calls, as is the case with different versions of Unix and Unix-like
    systems. A completely different operating system, say Windows, could provide software
    to convert Unix calls into its own system calls. And there are to be system calls
    that are unique to a particular operating system even if it is Unix-like.


    The first edition of Unix had just over 30 system calls, about half of which were
    related to the file system. Because files contained only uninterpreted bytes,
    the basic file system interface was dead simple, only five system calls to open
    or create a file, read or write its bytes, and close. These were accessed from
    a C program by calling functions using statements like these:


    ```

    fd = create(filename, perms)

    fd = open(filename, mode)

    read = read(fd, buf, n)

    write = write(fd, buf, n)

    status = close(fd)

    ```


    The system call creates a new file and sets its access permissions, which would
    normally include or exclude the ability to read, write, and execute for the user,
    the user''s group, and for everyone else. These nine bits give considerable control
    with relatively little mechanism. The open system call opens an existing file;
    mode specifies whether the file is to read or written to, and filename is an arbitrary
    path in the hierarchical file system.


    The fd value that results from calling open and create is called a file descriptor,
    a small non-negative integer that is used in subsequent reads and writes of the
    file. The read and write system calls attempt to transfer a specified number n
    of bytes from either the file or to the file; each function returns the number
    of bytes that were actually transferred. For all of these system calls, if a negative
    value (usually -1) is returned, it indicates some kind of error.


    By the way:


    There are also system calls for setting a position within a file, determining
    its status, and the like. These have all been embellished and occasionally improved
    over 50 years, but the basic model is simple and easy to use.


    It may be hard for today’s readers to appreciate just how much of a simplification
    of all this was. In early operating systems, the myriad complexities of real devices
    were reflected through users. One had to know all disk names, their physical structure
    like how many tracks and cylinders they had, and how data was organized on them.
    Steve Johnson reminded me of how awkward it was with the time-sharing subsystem
    on the Honeywell computer at this time:


    > "The Honeywell TSS system required you to enter a subsystem to create a disk
    file. You were asked about 8 questions: initial size of file, maximum size, name,
    device, who could read it, who could write it, etc. Each of these had to be answered
    interactively. When all the questions had been answered, the operating system
    was given the information, and, likely as not, something was mistyped and the
    file creation failed. That meant you went to enter the subsystem again and again
    until when it finally got created, the system said ‘SUCCESSFUL!’


    Unix followed the example of Multics in hiding all of this irrelevant nonsense:
    files were just bytes. The user determined what the bytes were, while the operating
    system looked after storing and retrieving them, without exposing device properties
    to users.


    ## 4.3 Shell


    The shell is a program that runs other programs. It’s the program that lets users
    run commands, and is the primary interface between users and the operating system.
    When I log in to a Unix system, my keyboard is connected to the shell. Because
    the shell is a user program, it''s easily replaced by another, which is why there
    are many Unix shells. One very important note: the shell is an ordinary user program,
    not some integral part of the operating system, another idea taken from Multics.
    (That’s the “command language selectable on a per-user basis” mentioned in the
    feature list.) If you don''t like the way one shell works, you can pick another
    or write your own and use it instead.


    That said, all Unix shells provide the same basic features, usually with the same
    syntax. The most important feature is to run programs. They all provide filenamecards,
    where pattern metacharacters like “*” are expanded into a list of filenames that
    match the pattern. Instance, to run the program wc (word count) to count the lines,
    words and characters in all files in the current directory whose names begin with
    book, one gives the command


    ```

    $ book*

    ```


    The shell expands the pattern book* into all the filenames in the current directory
    that match any name beginning with book, and runs wc with those names as arguments.
    The wc command itself doesn''t know the list of filenames was specified by a pattern.
    It''s important that expansion is done by the shell, not by individual programs.


    Another major service of the shell is input/output redirection. If a program reads
    from the standard input (by default the terminal), it can be made to read from
    an input file by


    ```

    $ program <infile

    ```


    and if it writes to the standard output (again by default the terminal), its output
    can be directed into an output file


    ```

    $ program >outfile

    ```


    The output file is created if it doesn''t already exist. With redirection, the
    program doesn''t know that its input or output is being redirected. This is a
    uniform mechanism, applied by the shell, not by individual programs, and easier
    to use than approaches like specifying file input and output by parameters for
    filenames, as in


    ```

    $ program in=infile out=outfile

    ```


    A script is a sequence of commands that have been stored in a file. Running an
    instance of the shell with this file as input runs the commands of the script.

    '
