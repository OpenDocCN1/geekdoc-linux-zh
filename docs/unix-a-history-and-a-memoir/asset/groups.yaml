    **Figure 5.18:** Rob Pike, ~1981 (Courtesy of Gerard Holzmann)


    Phyllis Fox was a pioneer in this kind of numerical computation, and was a major
    contributor to the PORT library for Fortran programmers. PORT defined machine-specific
    constants for values like the ranges of numbers that would be different for different
    computers; its libraries assured portability of Fortran code across different
    computers.


    The PORT library was a large body of work, ultimately with 130,000 lines of Fortran
    in 1,500 programs and a lot of documentation. Barbara Ryder and Stu Feldman developed
    a Fortran compiler called PFORT, which checked that Fortran code was written in
    a portable subset of Fortran. Norm Schryer wrote a program to check the arithmetic
    operations of computers, which often differed greatly in how they did floating-point
    arithmetic. This was especially important since it predated the development of
    standards for floating-point behavior.


    Eric Grosse and Bill Coughran developed algorithms for semiconductor modeling
    and simulation, circuit analysis, and visualization, especially for semiconductor
    design and fabrication. Much of the numerical software developed at Bell Labs
    was distributed throughout the Netlib repository of mathematical software, which
    is still widely used by the scientific computing community. Other numerical analysts
    made significant contributions to Netlib and the larger community included Dave
    Gay, Linda Kaufman, and Margaret Wright.'
