    涉及支付电话费用。


    尽管 UUCP 主要用于软件分发，但在互联网广泛普及之前，它也是远程命令执行、邮件传输和新闻组的基础。Usenet 作为最早的信息分发系统之一，是基于 UUCP
    的。


    第一个 UUCP 分发版本包含在第 7 版中；它被移植到其他操作系统，并在随后的几年中实现了开源。随着互联网成为标准的通信网络且其协议接管了一切，UUCP
    的使用最终消失了。


    ## 安全


    Unix 社区的人从早期开始就关注安全问题，这种兴趣部分源于 Multics，部分源于对密码学的经验。


    一个安全考量是允许文件系统为每个文件使用 9 位位来控制对文件的访问。对文件可以进行什么种访问？文件的所有者有三位，独立地控制读取权限、写入权限和执行权限。对于普通文本文件，通常允许所有者读取和写入，但不会允许执行，除非该文件是可执行程序或
    Shell 脚本。所有者所属组还有三位，可能是某个部门、项目或教职/学生的区分。最后三位适用于所有其他用户。


    这种机制比 Multics 提供的要简单得多，但它已经良好运行了很久。例如，编辑器、编译器、Shell 等标准命令由特权账户（通常是 root 用户）所有，该用户可以随心所欲地读取、写入和执行它们，但普通用户只能执行（可能还可以读取）而不能修改它们。注意，在无法读取内容的情况下执行程序是可能的；通过这种，程序可以安全地包含信息。


    早期的一个改进是为每个文件增加了第 10 位权限位，称为 `setuid`（用户 ID）位。当此位被设置时，该文件将作为程序执行，检查权限的用户 ID 不是运行程序的人，而是文件的所有者。如果设置了该位，普通用户就可以以程序所有者的权限运行程序。这用于那些操作文件系统以创建目录、重命名文件等的程序：执行特权调用的程序由拥有不受限制访问权限的超级用户所有。自然，setuid
    程序必须经过仔细编写和管理；否则，它们可能会在系统安全上留下巨大的漏洞。setuid 由丹尼斯·里奇（Dennis Ritchie）发明，他于 1979 年获得了该专利。


    如前所述，密码的想法源于 CTSS，并在 Multics 中延续，一直进入 Unix。一个名为 `/etc/passwd` 的文本文件每个用户拥有一行，包含登录名、用户
    ID 数字、密码以及其他几个字段。从早期开始，密码就以哈希形式存储，而不是明文。哈希是一种扰乱形式，重新创建原始密码的唯一实际方法是尝试所有可能的密码。这意味着任何人都可以读取密码文件，但不能使用哈希后的密码登录他人身份。


    这是理论上的。然而，如果哈希算法不好，或者人们选择密码不当，解密可能是可能的。肯·鲍勃·莫里斯（Ken Bob Morris）从各种 Unix 系统构建了密码文件，并实验了字典攻击，尝试可能的密码以查看是否与密码文件中存储的内容一致。他们在
    20 世纪 70 年代中的研究表明，10% 到 30% 的密码可以通过这种方式获得。


    字典攻击仍然有效，尽管各方面的技术变得更加复杂。人们希望今天的用户能更地意识到弱密码的危险，但最近的常用密码列表表明他们并非如此。（顺带提一下，这也用于 1988
    年的莫里斯蠕虫，当时鲍勃的儿子罗伯特·T·莫里斯（Robert T. Morris）无意中发布了一个尝试登录互联网上的 Unix 系统并自我传播的程序。它的机制之一是使用可能密码的字典，如“password”和“12345”）


    鲍编写了原始的 Unix 命令。他于 1986 年从贝尔实验室退休，成为国家安全局（NSA）的首席科学家，这表明他对计算机安全和密码学非常了解。他于 2011
    年去世，享 78 岁。


    密码学是 1127 名成员持续的兴趣，包括鲍、肯、丹尼斯、彼特·维纳（Peter Weiner）和弗雷·格拉普（Fred Grampp）（图 5.19）。丹尼斯的网页讲述了一些有趣的幕后故事。现在的加密完全通过软件完成，但在第二次世界大战期间是通过机械完成的。德国军队使用恩尼格玛（Enigma）机器，有些
    Fred 得到了一个。一种说法他在公开市场上买的；另一种说法是他的父亲（一名美国士兵）在战后从德国带回的。弗雷把它留存在贝尔实验室，在他去世时将其留给了肯·汤森（Ken
    Thompson），它一直放在肯的文件柜底抽屉里，就在我办公室隔壁。


    ![](img/07eb79c40271e71719affc2198867bf4_140_0.png)


    有一天，我借它去我在普林斯顿教的一门课，课程中有一个关于密码学的讲座。我问是否有人见过恩尼格玛。没有，没有人见过，所以我从桌子下面把它拿出来。我以前以后从未见过学生们表现出这样的兴趣，其中一些人甚至直接站在桌子上看它。（注：此处原文中存在大量重复的句子，已按要求清理）


    ## 硬件


    软件是 1127 中的主要活动，但硬件兴趣得到了很好的体现。在早期，它需要硬件


    **Figure 5.19:** Fred Grampp, ~1981 (Courtesy of Gerard Holzmann)

