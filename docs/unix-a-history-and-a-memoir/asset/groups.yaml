    ## CHAPTER 8: DESCENDANTS


    ![](img/07eb79c40271e71719affc2198867bf4_174_0.png)


    **Figure 8.4:** Linus Torvalds in 2014 (Wikipedia)


    Disclosure: I''ve signed on to a couple of amicus briefs on the Google side here,
