    # Chapter 7


    # Commercialization


    "As Unix spread throughout the academic world, businesses eventually became aware
    of Unix from their newly hired programmers who had used it in college."


    Lucent web site, 2002


    "Unix and C are the ultimate computer viruses."

    Richard Gabriel, "Worse is Better," 1991


    It had been argued that AT&T was prohibited from selling Unix commercially because
    as a regulated public monopoly, if it did so, it would be competing with other
    operating system vendors, using revenues from telephone services to cross-subsidize
    Unix development. The closest that AT&T came to making a real business was to
    license Unix to corporate customers for $20,000 (in contrast with the nominal
    fee for educational institutions) but in limited quantities and without support.
    That was enough to head off regulatory scrutiny.


    # 7.1 Divestiture


    By 1980, AT&T''s position as a monopoly, regulated or not, was coming under attack.
    The US Department of Justice had begun an antitrust lawsuit against AT&T in 1974,
    on the grounds that AT&T controlled only telephone service for most of the country
    but also the equipment used by its telephone companies, and thus that AT&T controlled
    communications for the whole country. The DoJ proposal was that AT&T should be
