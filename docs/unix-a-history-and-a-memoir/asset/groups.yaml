    # Chapter 8


    # Descendants


    > “... from simple a beginning endless forms most beautiful and wonderful have
    been, and are being, evolved.”

    Charles Darwin, The Origin of Species, Chapter 14, 1859


    Unix began in the Computing Science Research Center in 1969. There were internal
    versions like PWB that supported the Programmer''s workbench tools, of course,
    starting in 1975, external versions appeared as well, originally based on the
    6th edition, and then later on the 7th edition, which appeared in 1979.


    The 7th edition was the last Research version of Unix to be released and widely
    used. Three more editions were developed and used internally (namely 8th, 9th,
    and 10th) but by the time the 10th was completed in late 1989, it was clear that
    the center(s) of gravity of Unix development had moved elsewhere.


    Two threads evolved from the 7th edition, one from Berkeley that built on the
    work of Bill Joy and colleagues, and another from AT&T as it tried to build a
    money-making business out of its Unix expertise and ownership. The timeline in
    Figure 8.1 is an approximation and omits numerous systems; reality was more complicated,
    especially in how the versions interacted.


    # 8.1 Berkeley Software Distribution


    In 1978, DEC introduced a new computer, the VAX-11/780. The VAX was a 32-bit machine
    with substantially more memory and computing power than the PDP-11, while remaining
    culturally compatible with it. A 16-bit computer uses 16 bits for a memory address,
    while a 32-bit computer'
  - '[PAGE 168]


    ![](img/07eb79c40271e71719affc2198867bf4_168_0.png)'
  - '[PAGE 169]


    # CHAPTER 8: DESCENDANTS


    uses 32 bits and thus can address a much larger amount of primary memory. When
    the VAX-11/780 first appeared, John Reiser and Tom London, who were in a research
    group at Bell Labs in Holmholm, New Jersey, ported the 7th edition to it, their
    version, 32/V, did not use the virtual memory capabilities of the new machine
    and thus did not take advantage of what the VAX could.


    Bill Joy and his colleagues at the Computer Systems Research Group at the University
    of California, Berkeley, started with Reiser and London’s 32/V and added code
    to use virtual memory. This version quickly supplanted 32/V and the VAX itself
    became the primary Unix machine for most users who outgrew the PDP-11. The Berkeley
    version was packaged and shipped to Unix licensees as BSD, the Berkeley Software
    Distribution. BSD descendants are still active, with variants like FreeBSD, OpenBSD
    and NetBSD all continuing development. NextSTEP, used for Apple’s Darwin, the
    code of macOS, was also a BSD derivative.


    One of the early Berkeley distributions formed the base of SunOS, which was used
    on computers from Sun Microsystems, co-founded by Bill Joy. Others spun off a
    few years later into the BSD variants mentioned above. All of these eventually
    were reimplementations that the same functionality but with entirely new code.
    Once rewritten, they were free of AT&T code and did not infringe AT&T''s intellectual
    property.


    Another spinoff was created for NeXT, which was founded by Steve Jobs in 1985.
    The NeXT workstation had a variety of innovative features, and was an example
    of the elegant and polished industrial design that Apple users are familiar with.
    I was in the audience at Bell Labs on December 11, 1990, when Jobs gave a demonstration
    of the NeXT. It was a very nice machine, and it was the only time I can recall
    thinking “I want one of those” I had obviously been seduced by the famous Jobs
    “reality distortion field.” When he did another presentation at the Labs three
    years later, there was no effect, and I don’t even remember what he was showing
    off.


    Although the NeXT computer itself was not a commercial success, the company was
    bought by Apple in 1997, and Jobs returned to his old company, becoming CEO within
    a year. One can still see some of the NextSTEP operating system legacy in names
    like NeObject and Objective-C programs.


    The timeline reveals another little known fact: in the 1980s Microsoft distributed
    a version of Unix called Xenix; Figure 8.2 is part of an advertisement from the
    time. One wonders how the world would be if'
- md: '

    Microsoft had pushed Xenix instead of its own MS-DOS, and if AT&T had been easier
    to deal with it apparently was. According to the Unix Heritage Society, the Santa
    Cruz Operation (SCO) later acquired Xenix, which in the mid to late 1980s was
    the most common Unix variant as measured by the number of machines on which it
    was installed.


    ![](img/07eb79c40271e71719affc2198867bf4_170_0.png)


    Figure 8.2: Xenix: Microsoft’s version of Unix


    ## 8.2 Unix wars


    In the late 1980s there were numerous vendors of Unix systems, all using the trademarked
    name, and purveying software at least originally based on Version 7 from Bell
    Labs research. There were incompatibilities, particularly between AT&T’s System
    V and the Berkeley distributions. All parties agreed that it would be highly desirable
    to have a common standard, but naturally disagreed on what it would be.


    X/Open, an industry consortium, was formed in 1984 to create a standard source-code
    environment so that programs could be compiled on any Unix-like system without
    having to rewrite the code without change.


    AT&T and some allies formed their own group. Unix International, to promulgate
    their standard, in competition with a different standard from a group called the
    Open Software Foundation. The result? Two competing and different “open” standards.
    Eventually peace broke out, with a standard called POSIX (Portable Operating System
    Interface) for basic library functions, and a “Single Unix Specification” administered
    by X/Open between them standardized libraries, system calls, and a large number
    of common commands (including the shell, Awk, ed and vi).


    In 1992, USL and AT&T sued over intellectual property rights in Unix, claiming
    that Berkeley was AT&T code without permission. Berkeley had made many changes
    in the AT&T code, and added valuable material of their own, including the TCP/IP
    code that made the Internet accessible.


    Berkeley continued to remove and rewrite code that had come from AT&T, and in
    1991 released a version of Unix that felt contained none of AT&T’s proprietary
    material. AT&T and USL were not convinced, however, and this led to the lawsuit.
    After much maneuvering the case was heard in a New Jersey court, where Berkeley
    prevailed, in part on the grounds that AT&T had failed to put proper copyright
    notices on the code that it had distributed.


    If this all sounds complicated and boring, you’re right, but it was a big deal
    at the time, with much waste of time and money on all sides. In 1991, AT&T sold
    shares in USL to 11 companies, and in 1993 Novell bought the rights to USL and
    Unix. Novell’s CEO, Ray Noorda, decided to settle any remaining legal cases, perhaps
    realizing that the parties involved were spending more money on lawyers than they
    could ever recover in sales.


    In retrospect, I suppose one could say that all the legal wrangling was a by-product
    of AT&T’s early and almost accidental decision to make Unix available to universities.
    As Unix spread from universities using it for free to companies that were willing
    to pay for it, became commercially viable, least potentially. But it was too late
    for effective protection. Even if AT&T’s source code was restricted, the system
    call interface was in effect in the public domain, and there was so much expertise
    in the community that creating versions unencumbered by AT&T licenses almost routine.
    The same was true of application software like compilers, editors, and all the
    tools. Using several metaphors, AT&T was trying to lock the barn door after the
    crown jewels had flown the coop.


    ## 8.3 Minix and Linux


    AT&T''s licensing of Unix became more and more restrictive as the company tried
    to make money from the software. This included restrictions on how Unix could
    be used in universities, which gave an advantage to BSD, which had no such constraints.
    At the same time, the ongoing wars between AT&T and BSD encouraged others to try
    rolling their own Unix-like systems. Independently created versions were free
    of commercial restrictions, since they used only the system call interface, but
    no else''s code.


    At the Free University in Amsterdam in 1987, Andy Tanenbaum created Minix, a Unix-alike
    that was compatible at the system call level but wrote entirely from scratch with
    a different kernel organization.


    Minix was comparatively small, and to help with its spread, Andy wrote a textbook
    on it that metaphorically a parallel to the Lions book of a decade earlier. Minix
    source code was available for free—one of the book came with a set of about a
    dozen floppy disks that could be loaded onto an IBM PC to provide a running system.
    I still have the first edition of Andy''s book, and I might even have my Minix
    floppies as well.


    Minix is alive and well today, a vehicle for education and experimenting with
    operating systems.


    One result of AT&T''s restrictive licensing, combined with the availability of
    Minix as a guide, the independent development of another Unix-like system, compatible
    at the system call level, by a 21-year-old Finnish college student. On August
    25, 1991, Linus Torvalds posted an item on comp.os.minix, a Usenet news group,
    shown in Figure 8.3.


    Linus did not predict the remarkable future of his hobby system, more than Ken
    and Dennis predicted the success of Unix. What started out as a few thousand lines
    of code now stands over 20 million lines, with Torvalds (Figure 8.4) as the principal
    developer. Torvalds is also the creator of Git, the widely used version-control
    system.


    Like laptop and desktop computers, however; the majority run Windows, followed
    by macOS.


    As a modern aside, the issue of whether it is possible to copyright a programming
    interface like the C standard library or the system calls is now the center of
    an apparently endless lawsuit between Oracle and Google. Oracle acquired Sun Microsystems
    in 2010 and later that year, sued Google, claiming that Google was using Oracle''s
    copyrighted Java interface in Android phones without permission. Google won this
    case, with the judge ruling that the patents were invalid and the Java API (application
    programming interface) could not be copyrighted.


    Oracle appealed, and eventually a new trial was held. Google won again, but Oracle
    filed another appeal and this time the courts ruled for Oracle. Google appealed
    to the Supreme Court for the right to present the case there, in the hope of resolving
    the issue of whether APIs (not implementations!) could be copyrighted and used
    to prevent other parties from using an interface specification to create lookalike
    systems.

