    The department at Bell Labs was the first “customer” outside of the research area,
    but other groups found Unix useful as well, and the system started early to spread
    within Bell Labs development groups and other parts of AT&T.


    With over a million employees, AT&T was a very big company, with many computer
    systems for managing the data and operations that operated telephone services.
    These systems provided technician interfaces and support for AT&T, keeping track
    of equipment and customers, monitoring systems in the field, logging events, trouble-shooting,
    and the like. Collectively, these systems were called “operations support systems."


    One of the major Unix installations outside of Research was a group based in Piscataway,
    New Jersey, about 15 miles from Murray Hill, that in 1973 began to develop tools
    for programmers who did software development for large-scale production environments.
    The collection became known as the Programmer’s Workbench or PWB.


    Most operations support systems at AT&T ran on large mainframe computers from
    IBM and Univac that had their own proprietary operating systems, such as IBM’s
    OS/360. PWB provided facilities for creating and managing the software that ran
    on such computers. In effect, PWB served as a uniform front end for a diverse
    set of large non-Unix computer systems; the mainframes were treated like peripheral
    devices.


    One major PWB service was remote entry, a set of commands for sending jobs to
    target systems and returning the results, including job queuing, status reports,
    notifications, logging and error recovery. Remote job entry well with the Unix
    approach of using small tools that could be connected in a variety of ways, and
    then encapsulated in shell scripts for convenience by non-experts.


    To support this kind of programming, John Mashey (Figure 6.1) enhanced the 6th
    edition shell to create the PWB shell, which provided much better programmability,
    including a general if-then-else for decision-making, a while for looping, and
    shell variables for storing text. He also invented a search path mechanism, so
    that by specifying a particular variable, any user could specify a sequence of
    directories to be searched for. The search path made it easy for groups of users
    to collect programs in project directories, rather than having to install in system
    directories for which they might not have permission.


    “We had a large (1,000+) population of users who were not C programmers, who worked
    in shared environments. They wanted to share their own sets of commands by lab,
    department, group. They often shared systems with others.” John also added a mechanism
    so that if a file was marked executable, it would either be executed as a regular
    command, or passed to a shell if it was script. All of these features were in
    place by early 1975, and refined over the next year as more and more people began
    using the PWB shell. John’s paper “Using a Command Language as a High-Level Programming
    Language” reported on experience with 1,700 shell procedures:


    By utilizing the shell as a programming language, PWB users have been able to
    eliminate a great deal of the programming drgery often accompanies a large project.
    Many manual procedures have been quickly, cheaply, and conveniently automated.”


    As noted in the previous chapter, John’s improvements soon found their way back
    into the shell that Steve Bourne wrote.


    ![](img/07eb79c40271e71719affc2198867bf4_147_0.png)


    **Figure 6.1:** John Mashey ~2011 (Courtesy of Twitter)


    Another important PWB product was the Source Code Control System (SCCS), which
    was written in 1972 by Marc Rochkind. SCCS was the first of a sequence of programs
    for managing large code bases that were being worked on by several programmers
    at the same time.


    The basic idea of SCCS was to let programmers check out of the code base: this
    locked part so other programmers couldn’t change it until the lock holder unlocked
    it. This prevented multiple programmers from making inconsistent changes to the
    same piece of code at the same time. Of course there were still problems; for
    example carelessness or crashes could leave code locked even though no one was
    working on it, and if the locked regions were too big, slowed down simultaneous
    changes. But the idea was crucial for software development that involved'
