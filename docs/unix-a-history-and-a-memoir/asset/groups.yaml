    ## Scientific computing


    As might be expected for a scientific research operation, Bell Labs was involved
    very early in the use of computers for modeling and simulation of physical systems
    and processing, a natural extension of mathematical research. It was also a validation
    of Dick Hamming''s prediction that computing could displace laboratories. The
    focus was on numerical linear algebra, differential and integral equations, function
    approximation, and mathematical libraries that could make the best known methods
    widely


