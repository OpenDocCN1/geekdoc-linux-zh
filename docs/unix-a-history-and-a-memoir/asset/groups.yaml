    # CHAPTER 1: BELL LABS


    services. In effect, Bell Labs was paid for by a modest tax on every call in the
    country. According to a paper by A. Michael Noll, AT&T spent about 2.8 percent
    of its revenues on research and development, with about 0.3 percent on basic research.
    I''m not sure how well this would work, but for decades, the arrangement led to
    a steady flow of improvements to the phone system and a significant number of
    fundamental scientific discoveries.


    Stable funding was a crucial factor for research. It meant AT&T could take a long-term
    view and Bell Labs researchers had the freedom to explore areas that might not
    have a near-term payoff and perhaps never would. That''s a contrast with today''s
    world, in which planning often seems to look ahead only a few months, but much
    effort is spent on speculating about financial results for the next quarter.


    ## 1.2 Communications and computer science


    Bell Labs was naturally a pioneer in designing, building and improving communications
    systems, a blanket term that covered everything from the design of consumer hardware
    like telephones through the infrastructure of switching systems, microwave transmission
    towers, and fiber optic cables.


    Sometimes this breadth of practical concerns could lead to advances in basic science.
    For example, in 1964 Arno Penzias and Robert Wilson were trying to figure out
    what was causing unwanted noise in the antenna that Bell Labs was using to detect
    radio signals bounced off Echo balloon satellites. They eventually deduced that
    the noise came from the background radiation that was the residue of the cosmic
    Big Bang at the beginning of the universe. This discovery led to the 1978 Nobel
    Prize for Penzias and Wilson. (Arno says that "Most people get Nobels for things
    they were looking for. We got one for something we were trying to get rid of.")


    Another part of the Bell Labs mission was to develop a deep mathematical understanding
    of how communications systems worked. The most important result was Claude Shannon''s
    creation of information theory, which was in part motivated by his study of cryptography
    during World War II. His 1948 paper "A Mathematical Theory of Communication,"
    published in the Bell System Technical Journal, explained the fundamental properties
    and limitations on how much information could be sent through a communications
    system. Shannon worked at Murray Hill from the early 1940s to 1956, and returned
    to MIT, where he had been a graduate student. He died in 2001 at the age of 84.


    As computers became more powerful and less expensive, computer use expanded to
    include more data analysis, along with extensive modeling and simulation of physical
    systems and processes. Bell Labs had been involved with computers and computing
    since the 1930s, and had computer centers with big central computers by the late
    1950s.


    In the early 1960s, a computer science research group was formed by splitting
    some people out of mathematics research, along with some of the staff who operated
    the large central computer at Murray Hill. The resulting amalgam was called the
    Computing Science Research Center, and although for a brief period it still ran
    computer services for all of Murray Hill, it was part of the research division,
    not a service function. In 1970 the group that managed the computer facilities
    was moved into a separate organization.


    ## 1.3 BWK at BTL


    This section contains a fair amount of personal history, which I hope will give
    you some idea of the lucky accidents that led me to computing as a career, and
    to Bell Labs as an unequal place to pursue it.


    I was born in Toronto, and went to the University of Toronto. I was in a program
    called Engineering Physics (later renamed to Engineering Science), a catch-all
    program for those who didn''t really know what they wanted to focus on. I graduated
    in 1964, which was in the early days of computing: I saw my first computer when
    I was in my third year at university. There was only one big computer for the
    whole university, an IBM 7094, which was pretty much off the line. It had 32K
    (32,768) 36-bit words of magnetic core memory (today we would say 128K bytes),
    and some secondary storage in the form of big mechanical disk drives. It cost
    three million dollars at the time and lived in a large air-conditioned room, tended
    by professional operators; ordinary people (and especially students) did not get
    anywhere near it.


    As a result, I did little computing as an undergraduate, though I tried to learn
    the Fortran programming language. For anyone who has struggled to write their
    first program, I can sympathize. I studied Daniel McCracken''s excellent book
    on Fortran II and had the rules down pat, but I couldn''t figure out how to write
    that first program, a conceptual barrier that many people seem to encounter.


    In the summer before my final year of college, I landed a job at Imperial Oil
    in Toronto, in a group that developed optimization software for refineries. (Imperial
    Oil was partly owned by Standard Oil of New Jersey, which became Exxon in 1972).


    In retrospect, I was well paid as an intern. I spent the entire summer trying
    to write a giant Cobol program for analyzing refinery data. I don’t recall its
    purpose, but I know for sure that it never worked. I didn’t really know how to
    program, Cobol provided little support for good program organization, and structured
    programming had not been invented, my code was an endless series of IF statements
    that branched off somewhere I had figured out what something should be.


    I also tried to get Fortran running on Imperial''s, since I sort knew Fortran,
    certainly better than I knew Cobol, and Fortran would have been better suited
    for data analysis. It was only after weeks of fighting JCL, IBM’s Job Control
    Language, that I deduced there was no Fortran compiler


    When I returned to school for my senior year after this frustrating summer, I
    was still interested in computing. There were no formal courses on computer science,
    but I wrote my senior thesis on artificial intelligence, a hot topic at the time.
    Theorem provers, programs to play chess and checkers, and machine translation
    of natural languages all seemed like they were within reach, just requiring a
    bit of programming.


    After graduating in 1964, I had no clue what to do, so like many students I applied
    to half a dozen schools in the United States (not common among Canadians at the
    time), and by good luck was accepted by several, including MIT and Princeton.
    Princeton said that the normal time to complete a PhD was three years, while MIT
    said it would probably take seven years. Princeton offered a fellowship; MIT said
    I would have to be a research assistant for 30 hours a week. The decision seemed
    clear-cut, and a good friend, Ai Aho, had been a year ahead of me at Toronto,
    was already at Princeton, so off I went. It turned out to be an incredibly fortunate
    circumstance.


    In 1966, I got lucky again, with a summer internship at MIT, in thanks to the
    fact that Princeton grad student, Lee Varian, had done a great job there. I spent
    the summer using CTSS, the Compatible Time-Sharing System, writing programs in
    MAD (Michigan Algorithm Decoder, a decal of Algol 58) to build tools for a new
    operating system called Multics, which we’ll come to in Chapter 2.


    My nominal boss at MIT was Fernando Barbosa “Corby” to everyone, a wonderful gentleman,
    the creator of CTSS, and the person in charge of Multics. Corby won the Turing
    Award in 1990 for his fundamental work on time-sharing systems. He died in July
    2019 at the age of 93.

