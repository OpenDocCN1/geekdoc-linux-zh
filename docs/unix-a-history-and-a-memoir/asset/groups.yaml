    \ 将其活动扩展到外部服务和市场营销。\n\nUnix 确实有一个市场；人们甚至可以说，AT&T 无意中通过将 Unix 送给学生创造了这个市场，当这些学生进入现实世界并为那些付得起真金白购买它的公司工作时，他们想要它了。从\
