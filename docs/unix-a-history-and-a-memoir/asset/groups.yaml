    ## CHAPTER 2: PROTO-UNIX


    1127 interested in flying as well, and at peak there were half a dozen private
    pilots in the “1127 air force.” This group used to set off to view fall foliage
    or fly to some interesting place for lunch. Doug Doug McIlroy recalls:


    Besides fall foliage in New England, the air force attended an eclipse in the
    Adirondacks, thanks to Ken’s piloting and Rob Pike’s telescopes. There was also
    a flight to observe a transit of Mercury. The astronomical theme in the Unix crew
    began with Joe Ossanna’s azel, which had controlled the Telstar ground station,
    and we used to tell us where to find artificial satellites. Next came Morris’s
    sky program, then Ken’s celestial event predictor, Lee McMahon’s star maps made
    with my map program, and finally Rob’s scat star catalog.


    In December 1992, Ken and Fred Grampp went to Moscow to fly a MiG-29, a step up
    from their normal Cessnas. Figures 2.5 and 2.6 show Ken ready to go and taxiing
    back after a flight.


    ![](img/07eb79c40271e71719affc2198867bf4_53_0.png)


    Figure 2.5: Ken Thompson preparing to take off (Courtesy of cat-v.org)


    Ken and I retired from Bell Labs at the end of 2000. I went to Princeton, and
    he joined Entosphere, a startup founded by Bell Labs colleagues. In 2006, he moved
    to Google, where with Rob Pike and Robert Griesemer, he created the Go programming
    language. I heard about his move from


    ![](img/07eb79c40271e71719affc2198867bf4_54_0.png)


    **Figure 2.6:** Ken taxiing after a flight (Courtesy of cat-v.org)


    Entrisphere to Google from someone else, so I asked for confirmation. His reply:


    ```

    Date: Wed, 1 Nov 2006 16:08:31 -0800

    Subject: Re: voices from the past


    its true. i didnt change the median age of google much,

    but i think i really shot the average.

    ken

