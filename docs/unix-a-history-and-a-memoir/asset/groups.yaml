    # CHAPTER 8: DESCENDANTS


    The perception that Unix was a mature commercial system, and no longer a suitable
    vehicle for research in operating systems. A small group—Ken Thompson, Rob Pike,
    Dave Presotto and Howard Tricky—gathered together to work on a new operating system,
    which they called Plan 9 from Bell Labs after the 1959 science-fiction movie Plan
    9 from Outer Space. (Plan 9 the movie had a reputation as the worst movie ever
    made—a tough competition, to be sure—though some movie felt it was so bad that
    it was actually good in a perverse way).


    Plan 9 the operating system was in an attempt to take the good ideas in Unix and
    push them further. For example, in Unix, devices were files in the file system.
    In Plan 9, more data sources and sinks were files as well, including processes,
    network connections, window-system screens and shell environments. Plan 9 also
    aimed for portability right from the beginning, with a single source that could
    be compiled for any supported architecture. Another outstanding feature of Plan
    9 was its support for distributed systems. Processes and files on unrelated systems
    with different architectures could work together exactly as if they were in the
    same system.


    made available to universities in 1992, and released publicly a few years later
    for commercial use, but aside from a small community of aficionados, it is not
    used much today. The major reason is probably that Unix and increasingly Linux
    had so much momentum and there wasn''t a compelling reason for most people to
    switch systems. A smaller part of the reason it didn''t catch on may be that it
    took a rather Procrustean Plan 9 mechanisms were in many cases better than the
    Unix equivalents, and there wasn''t much attempt to provide compatibility. For
    example, Plan 9 originally did not provide the Standard I/O library stdio, instead
    using a new library called bio. Bio was cleaner and more regular than stdio, but
    without the standard library, it took real work to convert programs to run on
    both Unix and Plan 9. Similarly, there was a new version of Make Mk, which was
    superior in many ways, but it was incompatible and so existing makefiles had to
    be rewritten.


    There were mechanisms for conversion, and Howard Tricky (Figure 8.5) ported a
    number of key libraries like stdio, but in spite of that, at least for potential
    users, including me, it was too much effort. Thus Plan 9 was unable to profit
    directly from a lot of Unix software, and it was harder to export its innovations
    to the mainstream Unix world.


    Plan 9 did contribute one thing of surpassing importance to the world, however:
    the UTF-8 encoding of Unicode.


    Unicode is an ongoing effort to provide a single standard encoding of all the
    myriad characters mankind has ever used for writing. Includes'
