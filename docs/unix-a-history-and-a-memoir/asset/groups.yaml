    Dick retired from Bell Labs in 1976 and went to the Naval Postgraduate School
    in Monterey, California, where he taught until death early in 1998 at the age
    of 82. The story goes that one of his courses there was known to students as “Hamming
    for Hamming,” which suggests an awkward parallel with this section of the book.


    Dick thought all the time about what he was doing and why. He often said that
    “The purpose of computing is insight, not numbers,” and he even had a tie with
    what was written on it (in Chinese). One of his early insights was that computing
    could account for half the work at the Bell Labs. None of his colleagues agreed,
    but in fact his estimate soon proved too conservative. He used to say that Friday
    afternoons were for thinking great thoughts, so he sat back and thought, though
    he was always welcoming to visitors like me any time.


    A few years after his retirement, Dick gave an insightful talk that distilled
    his advice on how to have a successful career, called “You and Your Research,”
    which you can find on the web. He gave the first version of that at Bellcore in
    March 1986; Ken Thompson drove me so we could hear it. I''ve been recommending
    the talk to students for decades—it is really worthwhile to read the transcript,
    or to watch one of the video versions.


    Right across the hall from me in the summer of 1967 was Vic Vysotsky (Figure 1.6),
    another incredibly smart and talented programmer. Vic was in charge of the Bell
    Labs part of Multics, but he still managed to find time almost daily to a lowly
    intern. Vic pressed me into teaching a Fortran class to physicists and chemists
    who needed to learn how to program. The experience of teaching non-programmers
    turned out to be good fun. It got me over any fear of public speaking and made
    it easy to get into a variety of teaching gigs later on.


    Shortly afterwards, Vic moved to another Bell Labs location where he worked on
    the Safegu anti-missile defense system. He eventually returned to Murray Hill
    and became the executive director responsible for computer science research, and
    thus was my boss a couple of levels up.


    By the spring of 1968, I had to work on a problem for my PhD thesis, one suggested
    by my advisor, Peter Weiner. The problem was graph partitioning: given a set of
    nodes connected by edges, find a way to separate the nodes into two groups of
    equal size such that the number of edges that connect a node in one group to the
    other is as small as possible. Figure 1.7 shows an example: any other partition
    of the nodes into two groups of five requires more than two edges between the
    two sets.'
