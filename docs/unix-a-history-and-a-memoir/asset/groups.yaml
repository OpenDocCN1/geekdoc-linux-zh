    # 第一章：贝尔实验室


    位于纽约西部 20 英里（33 公里）。最大的基地位于一个名为穆里希尔（Murray Hill）的地区，它是新普维登斯（New Providence）和伯克利高地（Berkeley
    Heights）这两个小镇的一部分。


    图 1.1 显示了大致的地形；西街 463 号位于哈德逊河，距离 9A 号公路标志北不远。穆里希尔的贝尔实验室跨越新普维登斯和伯克利高地的边界，位于州际 78
    号公路以北。这两个地点在地图上都用点标记。


    越来越多的贝尔实验室活动转向穆里希尔，实验室在 1966 年完全离开了西街。到 20 世纪 60 年代，穆里希尔居住着 3000 人，至少有 1000 人拥有物理、化学、数学和各种工程领域的技术博士学位。


