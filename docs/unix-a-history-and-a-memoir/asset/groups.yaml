    This is a common Unix story: a real problem from a real user, deep knowledge of
    relevant theory, effective engineering to make the theory work well in practice,
    and continuous improvement. It all came together because of broad expertise in
    the group, an open environment, and a culture of experimenting with new ideas.


    # 4.7 The C programming language


    New programming languages have been a big part of Unix since the very beginning.


    One of the most important contributions of Multics was its attempt to write the
    operating system in a high-level language, PL/I. PL/I was created in 1964 by IBM
    to try to combine all the good ideas from Fortran, Cobol and Algol into a single
    language. It turned out to be a great example of the system effect. The language
    was too big and complicated for most programmers, it was hard to compile, and
    a working compiler for Multics was not delivered on. As an interim measure, Doug
    McIlroy and Doug East created a simplified subset EPL (“Early PL/I”) for Multics,
    but it was a complicated language.


    BCPL (“Basic combined Programming Language”) was another language intended for
    system programming. It had been designed by Martin Richards, a professor at the
    University of Cambridge, and he wrote a compiler for it while visiting MIT in
    1967. BCPL was much simpler than a dialect of PL/I, and was well suited for writing
    system code. Members of the Bell Labs effort were very familiar with BCPL.


    When the Labs pulled out of Multics, Ken Thompson decided that “no computer is
    complete without Fortran, so he started to write a Fortran compiler for the PDP-7.
    This proved too tough, since PDP-7 Unix had only 4K 18-bit words (8 K) of primary
    memory for users programs like a compiler.'
