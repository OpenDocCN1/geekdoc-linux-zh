    ## 第三章


    ### 第一版（1971年）


    “本手册对 Unix 所有公开可用的功能提供了完整描述。它既没有提供总体概述（请参阅‘Unix 分时系统’），也没有提供系统实现的细节（这些细节尚待公布）。”


    《第一版 Unix 程序员手册》，1971 年 11 月 3 日


    “程序错误（BUGS）：rm 也许应该询问用户是否真的要删除一个只读文件。”


    `rm` 命令的手册页章节，1971 年 11 月 3 日。


    PDP-7 Unix 系统非常有趣，以至于人们开始使用它，尽管它运行在一台微型计算机上，而且没有什么软件。尽管如此，它显然非常有用，并成为一小群人的首选计算环境，他们发现这比大型中央计算机更有趣、产率更高。因此，Ken
    Thompson、Dennis Ritchie 等人开始争取一台更大的计算机，以支持更多用户并进行更有趣的研究。


    早期的建议之一是购买一台 DEC PDP-10，它在大学和其他研究实验室非常流行。PDP-10 与 IBM 7090 相似，拥有与 7090、GE 635
    和 645 相同的 36 位字，它的性能比那台弱小小的 PDP-7 强得多。但它的价格要贵得多；建议的价格是五十万美元。


    Multics 的经历是一段直到最近都很痛苦的回忆，因此 PDP-10 的建议从未付诸实施。正如 Ken 所说，管理层的立场是“我们不做操作系统”，或许更像是“我们不会给你们花这么多钱去买一台大机器’。”


    我想可以认为，管理的一个积极作用是在大多数时候保持谨慎，这样想要资源的人就会被迫完善他们的提案并专注于他们的推销重点。如果资源紧张，在没有限制的情况下，这更有可能导致良好且周全的工作。


    无论如何，Unix 组想出了另一个想法，购买一台 DEC 刚刚宣布的新微型计算机 PDP-11，在 1971 年的美元计算，它的费用大约是 6.5 万美元，而不是
    50 万美元。


    这一建议被拒绝了。Mike Mahoney 在 1989 年口述史采访中 Sam Morgan 的一段话解释了部分理由：


    > “这里的管理原则是，你雇佣聪明的人，并将他们引入到环境中”


    回想起来，被迫在限制范围内工作是一件好事。Ken 在 1983 年的图灵奖演讲中自己提到过：


    > “Unix 是随着整个行业从中央大型机向自主微型机的转变而流行起来的。我怀疑，如果 Daniel Bobrow 负担不起 PDP-10 且不得不对 PDP-11
    ‘将就’的话，那么在这里的人就会而不是我了。”


    （Daniel Bobrow 是 Tenex 操作系统的主要作者，该系统是 1969 年为 PDP-10 编写的


    ### 3.1 用于专利申请的 Unix


    直接申请机器失败了，但还有另一种替代方案。PDP-7 Unix 系统非常有趣，以至于人们开始使用它，尽管它运行在一台微型计算机上，而且没有什么软件。尽管如此，它显然非常有用，并成为一小群人的首选计算环境，他们发现这比大型中央计算机更有趣、产率更高。因此，Ken
    Thompson、Dennis Ritchie 等人开始争取一台更大的计算机，以支持更多用户并进行更有趣的研究。


    （注：原文后续部分存在大量重复段落，此处已按要求不重复输出）


