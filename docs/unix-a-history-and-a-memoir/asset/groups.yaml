    ## CHAPTER 3


    ### First Edition (1971)


    “This manual gives complete descriptions of all the publicly available features
    of Unix. It provides neither a general overview (see “The Unix Time-sharing System”
    for that) nor details of the implementation of the system (which remain to be
    disclosed).”


    First Edition Unix Programmer’s Manual, November 3, 1971


    “BUGS: rm probably should ask whether a read-only file is really to be removed.”


    Section of manual page for rm command, November 3, 1971


    The PDP-7 Unix system was interesting enough that people were starting to use
    it, even though it ran on a tiny computer and didn’t have a lot of software. Still,
    it was clearly useful and had become the preferred computing environment for a
    small group who found it more fun and productive than the big central computer.
    Thus Ken Thompson, Dennis Ritchie and others began to lobby for a larger computer
    that would support more users and enable more interesting research.


    One of the early proposals was for the purchase of a DEC PDP10, which was popular
    at universities and other research labs. The PDP-10 was loosely similar to the
    IBM 7090, with 36-bit words like the 7090 and the GE 635 and 645, and it had a
    great deal more horsepower than the wimpy little PDP-7. But it would cost much
    more; the proposal was for half a million dollars.


    The Multics experience was an all-to-recent bad memory, so the PDP-10 proposal
    never got off the ground. As Ken said, the management position was “We don’t do
    operating systems, though perhaps it was more like “We’re not going to give you
    a lot of money for a big machine.”


    I suppose that it could be argued that one positive role of management is to be
    cautious most of the time, so that people who want resources are forced to hone
    their proposals and focus their pitches. If resources are tight, that''s more
    likely to lead to good, well-thought out work if there are no constraints.


    In any case, the Unix group came up with another idea, to acquire a new minicomputer
    DEC had just announced, the PDP-11, which would cost more like $65,000 than $500,000
    in 1971 dollars.


    This was rejected. A remark from Sam Morgan in Mike Mahoney''s 1989 oral history
    interview explains some of the reasoning:


    > “The management principles here are that you hire bright people and you introduce
    them to the environment


    In hindsight, being forced to work within constraints was a good thing. Ken himsaid
    himself in 1983 Turing Award lecture,


    > “Unix swept into popularity with an industry-wide change from central mainframes
    to autonomous minis. I suspect that Daniel Bobrow would be here instead of me
    if he could not afford PDP-10 and had to ''settle'' for a PDP-11."


    (Daniel Bobrow was the primary author of the Tenex operating system, which was
    written for the PDP-10 in 1969.)


