    contributor to the PORT library for Fortran programmers. PORT defined machine-specific
    constants for values like the ranges of numbers that would be different for different
    computers; its libraries assured portability of Fortran code across different
    computers.


    The PORT library was a large body of work, ultimately with 130,000 lines of Fortran
    in 1,500 programs and a lot of documentation. Barbara Ryder and Stu Feldman developed
