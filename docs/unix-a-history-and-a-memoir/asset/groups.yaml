    # CHAPTER 4: SIXTH EDITION


    # 85


    ![](img/07eb79c40271e71719affc2198867bf4_99_0.png)


    **Figure 4.7:** Doug McIlroy and Dennis Ritchie, May 2011 (Wikipedia)


    Doug was usually the first person to read drafts of papers or manuals, where he
