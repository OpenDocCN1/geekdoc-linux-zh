    ## 第二章：原始 Unix


    1127 组中也有人对飞行感兴趣，在巅峰时期，“1127 空军”中有六名私人飞行员。这群人经常出发去观赏秋叶，或者飞往某个有趣的地方吃午饭。Doug Doug
    McIlroy 回忆道：


    除了新英格兰的秋叶，得益于 Ken 的驾驶和 Rob Pike 的望远镜，空军还去阿第伦山山脉观看了日食。此外还有一次为了观察水星凌日而飞行。Unix 团队的天文主题始于
