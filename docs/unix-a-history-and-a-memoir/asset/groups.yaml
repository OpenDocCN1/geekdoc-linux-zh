    # CHAPTER 5: SEVENTH EDITION


    Optimization problems like these are at the heart of many industries: airline
    crew scheduling, manufacturing, shipping and distribution, inventory control,
    advertising campaigns, and an enormous variety of other applications.


    I wrote the initial AMPL implementation in C++, along with a Yacc grammar and
    (I think) Lex for lexical analysis. It was my first serious C++ program, but I
    soon relinquished the code to Dave Gray.


    AMPL is perhaps the only widely used language originating in 1127 that is proprietary.
    (The language itself can''t be copyrighted, but there are at no point open-source
    implementations that I am aware of.) AT&T started licensing AMPL to companies
    a few years after it was created. Dave and I retired from Bell Labs the three
    of us formed a small company, AMPL Optimization, to continue AMPL development
    and marketing. Eventually we bought the rights from Bell Labs so we could go our
    own way. The company remains small but is a significant player in its niche market.


    In the early 1980s, Rob Pike (Figure 5.18) and Luca Cardelli experimented with
    languages for concurrency, especially for interactions with input devices like
    mice and keyboards; that led to the names Squeak and Newsqueak. The ideas from
    Newsqueak eventually found their way into the concurrent languages Limbo and Ale
    were in Plan 9, and a decade later into the Go programming language, which was
    created at Google in 2008 by Rob Pike, Ken Thompson and Robert Griesemer.


    # 5.6 Other contributions


    Most of the emphasis so far has been on system software, especially languages,
    since that''s what I know best, but I should mention some significant activities
    in scientific computing, communications, security and hardware, since they were
    often influential, and of course they all had substantial-ware components. These
    don''t all fall neatly into the 7th edition time frame.


