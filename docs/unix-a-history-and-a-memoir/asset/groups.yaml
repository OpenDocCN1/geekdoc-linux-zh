    This little pocket of document preparation enthusiasts, and a community of active
    users of such programs, fit my interests perfectly, and I spent a significant
    part of the next ten years happily working on tools for text formatting.


    # Troff and typesetters


    Roff and Nroff only handled fixed-width (“monospace”) character sets, not much
    more than the standard alphabetic characters found on the Model 37 Teletype, so
    the output quality wasn''t very high. In 1973, Joe Ossanna arranged to buy a photosetetter,
    a Graphic Systems CAT, which was popular in the newspaper industry. Joe''s intent
    was to produce better looking technical documents and also to help the patent
    department to prepare better patent applications.


    The CAT could print proportionally spaced fonts in roman, italic and bold, along
    with a set of Greek letters and special characters for mathematics. It printed
    on long rolls of photographic paper that had to be developed in a couple of baths
    of noxious and messy chemicals. This technology preceded laser printers, which
    did not become widely available for at least another 10 years. Furthermore, the
    output was black and white; inexpensive printing did not arrive until several
    decades later.


    Each font was a piece of 35mm film with character images, mounted on a rapidly
    spinning wheel. The wheel had four fonts of 102 characters each, so the total
    repertoire for a single job was 408 characters. The typesetter flashed an intense
    light through the film strip image onto photographic paper when the paper and
    the desired character were in the right positions. It was capable of 16 distinct
    sizes.


    The typesetter was slow—changing sizes required it to rotate a mechanical turret—and
    the photographic chemicals were most unpleasant, but the output quality was high
    enough that we could produce professional-looking documents. Indeed, there were
    occasions when a paper submitted to a journal by a Bell Labs author was questioned:
    it looked so polished that it must have already been published.


    To drive the typesetter, Joe created a significant extension of Nroff that he
    called Troff. "T" is for typesetter; it’s pronounced tee-roff. The Troff language
    was arcane and tricky, with sufficient skill and patience, it could be made to
    do any formatting task, though few people mastered it. In effect, Troff was an
    assembly language for a truly weird computer, so most people used it through packages
    of macros for formatting operations like titles, headings, paragraphs, numbered
    lists, and so on. The macros provided a higher-level language above the low-level
    Troff commands. Mike Les, who created the widely used ms package, was the master
    of creating packages; no one else in my orbit came close to his skill in using
    the programming capabilities of Troff.


    Once we had a typesetter that could produce output in a variety of fonts with
    proportional scaling and enough characters, it became possible to think about
    typesetting books as well as internal documents. The first book produced in that
    way was The Elements of Programming Style, which Bill Plauer and I wrote in 1974.
    It was typographically rough in many places we did not have a monospace font for
    displaying programs, but it was otherwise satisfactory.


    One of the main tasks that Bill and I did for our typesetting was to avoid the
    errors that the conventional publishing process frequently introduced into computer
    programs. Because we had total control over our content, from input to final pages
    to be printed, we could test the programs directly from the text, which would
    never be touched by copy-editor or compositor hands. The result was an essentially
    error-free programming book, which was most unusual at the time. I used that same
    ever since; the books listed at the front of this one have all been produced with
    Troff or its modern incarnation, Groff. Fortunately, one no longer needs typesetters
    and their expensive and unpleasant media. Today is sufficient to get everything
    right in a PDF file and send that to a publisher or printer.


    # Eqn and other preprocessors


    Bell Labs authors wanted to create documents that contained more than just text,
    most obviously mathematics, but also tables, figures, bibliographic citations,
