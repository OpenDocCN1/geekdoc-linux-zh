    (now AT&T Shannon Labs), and the rest remaining “Bell Labs” as part of Lucent.
    For the most part, people went where they were told, the members of 1127, with
    a long history of pushing back against management edicts, strongly resisted the
    forced split-up of the Center. We took a hard line, and management reluctantly
    agreed to let everyone make their own choice. In a stressful real-time process,
    each person decided whether to go with AT&T or with Lucent. In the end, this achieved
    the same roughly one-third/two-thirds split that had been planned, but individuals
    had control over their destinies, at least in the short term.


    All parties ultimately fell on hard times. AT&T was eventually bought by Southwestern
    Bell (now SBC Communications), one of the original Baby Bells. SBC rebranded itself
    with the AT&T name, logo and the ticker symbol “T” that had been used as early
    as 1901.


    Lucent went through a boom and then a bust, with some questionable business practices
    on route. As it struggled to survive, it spun off its communications services
    business into a company called Avaya in 2000, and its integrated-circuit business
    into another called Agere in 2002. Each split removed more people from Bell Labs,
    narrowing the breadth of research activities and shrinking the financial base
    that could support long-term work. Agere was eventually absorbed into LSI Logic;
    after some significant ups and downs, including bankruptcy, Avaya is still in
