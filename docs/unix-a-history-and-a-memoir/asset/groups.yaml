    to the development of a suite of computer-aided (CAD) tools, and involved a number
    of people, like Joe Conley, Lee McMahon, Bart Locanthi, Sandy Fraser, Andrew Hume,
    and others that I am surely forgetting.


    Bart used the CAD tools to design and build a bitmap terminal in the early 1980s.
    At the time most terminals could only display 24 rows of 80 fixed width and height
    ASCII characters. By contrast, a bitmap terminal displayed a large area of pixels,
    each of which could be independently set to a value, like the screens of all laptops
    and cell phones, though first bitmap displays were monochrome. Bart originally
    called his bitmap terminal the Jerq, an oblique reference to a somewhat analogous
    device called Perk by a Pittsburgh company named Three Rivers.


    The Jerq started with a Motorola 68000 processor, which was popular at the time
    (it was often used in workstations, for example), but both the name and the implementation
    fell victim to corporate politics. The Jerq was renamed the Blit (after the bitblit
    for rapidly updating screen contents) but was made only in small quantities. Western
    Electric, still the manufacturing arm of AT&T, redesigned it to use a Bellmac
    32000, a processor chip designed by Bell Labs and manufactured by Western Electric.
    “Bit” was replaced by the catchy “DMD-5620.” The redesign cost a full year and
    AT&T lost whatever it might have had to compete in the growing workstation marketplace.


    Rob Pike wrote most of the operating system for the Blit and the 5620. Its most
    novel aspect was that computation could proceed in overlapping windows. Overlapping
    windows had been seen before, but only one of them could be active at a time.
    Rob Pike got on the improvement.


    The 5620 was a good graphical terminal, though physically heavy and bulky. I used
    it to write graphical programs such as a Tprof. It was also the environment in
    which Rob Pike wrote a series of mouse-based text editors, one of which I use
    by preference even today: this book was written with Sam.


    There was also a sustained interest in integrated circuits and VLSI (Very Large
    Scale Integration). In 1980, Center 1127 offered a three-week course in integrated
    circuit design taught by Carver of Caltech. Lynn Conway and Carver had literally
    written the book (Introduction to VLSI Systems), and their course had already
    been given at a number of universities. Carver had a gift for telling a carefully
    calibrated sequence of lies about how circuits'
- md: 'worked. The simplest version was that when red line crossed over a green line,
    that made a transistor. Of course this gross over-simplification was unmasked,
    to be replaced by another more sophisticated lie, which in turn would be further
    refined.


    As a result of this excellent instruction, everyone in Carver''s class was able
    to design and build some kind of experimental chip after a couple of weeks of
    training. The chips were fabricated at the Bell Labs plant in Allentown, Pennsylvania
    for experimentation. At the time, Bell Labs was using the state of the art 3.5
    micron technology; today''s circuits are usually 7 to 10 nanometers, an improvement
    of at least 300 in line widths, and thus about 100,000 in the number of devices
    in a given area.


    My chip, a simple chess clock, never worked, thanks to a grievous error that was
    obvious in retrospect. Several people developed support tools as well as their
    own chips. My contribution was a program to help route out chip wiring, so it
    was a productive few weeks in spite of my failure as a chip designer.


    Over the years, at least a dozen people in my department did VLSI in one form
    or another—algorithms for checking layouts, simulators, reverse-engineering, and
    some theoretical research. I could keep up with what they were doing, barely,
    thanks to Carver''s course.


    The Center''s interest in VLSI persisted for a long time, ultimately leading to
    Dave Ditzel and Rae McLellan''s CRISP (C Reduced Instruction Set Processor) microprocessor,
    which was one of the earliest RISC processors. "RISC" is an acronym for Reduced
    Instruction Set Computer, a way to design processor architectures that are simpler
    and more regular than ones like the VAX-1/780.


    CRISP aimed at an instruction set that would be well suited for the output of
    a C compiler. To design it, Dave worked closely with Steve Johnson. After discussing
    potential architecture features, Steve would modify the Portable compiler and
    run benchmarks to see what these features would have on performance, a great example
    of hardware/software co-design.


    AT&T eventually sold a version of CRISP under the name Hobbit. It was the Apple
    Newton, one of the first personal digital assistants, but neither Newton or Hobbit
    was a commercial success. Dave left Bell Labs in 1995 to find Transmeta, which
    focused on low-power processors.


    Even CRISP itself did not succeed commercially, Unix and C had a large impact
    on computing hardware in the 1980s and 1990s. Most successful instruction set
    architectures were well-matched to C and Unix. Not only did Unix and portability
    enable universities and especially companies to create new architectures and rapidly
    port port software, but it had the effect of requiring that the instruction set
    was good for C code, while tending to eliminate features that were hard to compile
    from C programs. CPU design methodology like that used by Johnson and Ditzel used
    statistical analysis of programs, so C code statistics tended to favor things
    that made C fast. Unix and C had a critical mass that caused CPU design in the
    1980s and 1990s to orbit around them; nobody was successfully building CPUs tuned
    for other languages.


    # Chapter 6


    # Beyond Research


    “The Unix operating system presently is used at 1400 universities and colleges
    around the world. It is the basis for 70 computer lines covering the microcomputer
    to supercomputer spectrum; there are on the order of 100,000 Unix systems now
    in operation, and approximately 100 companies are developing applications based
    on it.”


    R. L. Martin, Unix System Readings and Applications, Vol. 2, 1984


    After a few years in the lab in Center 1127, Unix began to spread, both inside
    Bell Labs and outside, the latter primarily through universities, which were able
    to get the source code for the whole system for a nominal “media fee” under a
    trade secret agreement. This was definitely not “open source”: the system could
    be used only for educational purposes, and licensees could talk only to other
    licensed users about their experience and what they were doing with Unix. Nevertheless,
    the community grew rapidly, user groups sprang up all over the world, and major
    technical innovations took place, for example ports of the system to different
    kinds of hardware and new mechanisms for accessing the Internet.


    Bear in mind that many of the activities described in this chapter were going
    on in parallel with, or even years before, those of the previous chapter. This
    can make the chronology a bit confusing.


