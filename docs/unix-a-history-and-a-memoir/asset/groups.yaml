    Memory was often the most costly component of a computer. When every byte was
    precious, that scarcity imposed a certain discipline on programmers, who always
    had to be conscious of how much memory they were using, and sometimes had to resort
    to trickery and risky programming techniques to fit their programs into the available
    memory.


