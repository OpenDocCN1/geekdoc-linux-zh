    To further complicate matters, operating systems were written in assembly language,
    a human-readable representation of machine instructions, very detailed and specific
    to the instruction repertoire of a particular kind of hardware. Each kind of computer
    had its own assembly language, so the operating systems were big and complicated
    assembly language programs, each written in the specific language of its own hardware.


    This lack of commonality among systems and the use of incompatible low-level languages
    greatly hindered progress because it required multiple versions of programs: a
    program written for one operating system had to be rewritten from scratch to move
    to a different operating system or architecture. As we will see, Unix provided
    an operating system that was the same across all kinds of hardware, and eventually
    it was written in a high-level language, not assembly language, so it could be
    moved from one kind of computer to another with comparatively little effort.


    ## 2.2 CTSS and Multics


    The most innovative operating system of the time was CTSS, the Compatible Time-Sharing
    System, which was created at MIT in 1964. Most operating systems in that era were
    "batch processing." Programmers put their programs on punch cards (this was a
    long time ago!), handed them to an operator, and waited for the results to be
    returned, hours or even days later.


    Punched cards were made of stiff high-quality paper and could store up to 80 characters,
    typically a single line of a program, so the 6-line C program would require 6
    cards, and if a change was necessary, the card(s) would have to be replaced. Figure
    2.1 shows a standard 80-column card.


    By contrast, CTSS programmers used typewriter-like devices ("terminals") like
    the Model 33 Teletypes in Figure 3.1 in the next chapter) that were connected
    directly or by phone lines to a single computer, an IBM 7096.


