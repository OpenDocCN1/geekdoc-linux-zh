    # PREFACE


    # xi


    tools like Word, Excel or Powerpoint are written in C++, as are most of the browsers
    you might be using. A dozen or two of the core tools that programmers use daily
    and simply take for granted were written in the early days of Unix and are still
    part of every programmer’s toolkit, often much the same as they were 40 or 50
    years ago.


    Computer science theory plays a vital role as well, enabling immensely practical
    tools. Hardware research explored design tools, integrated circuits, computer
    architecture, and unusual special-purpose devices. The interplay among all of
    these activities led to unexpected inventions, and was one of the reasons why
    the whole enterprise was productive across so many different fields.


    There is also an interesting and relevant story about how technological innovation
    happens. Bell Labs, where Unix began, was a remarkable institution that produced
    many good ideas and capitalized on them. It was the origin of many world-changing
    inventions, and there are lessons to be learned from how it worked.


    The Unix story offers many insights into how to design and build software, and
    how to use computers effectively, which I have tried to highlight all the way.
    As a simple but characteristic example, the Unix philosophy of software tools
    made it possible to combine programs to accomplish a wide variety of tasks without
    having to write new software. It''s a programming instance of an old strategy:
    divide and conquer. By breaking bigger tasks into smaller ones, each becomes more
    manageable, and the pieces can be combined in unexpected ways.


    Finally, although Unix was the most visible software from Bell Labs, was by no
    means the only contribution to computing. The Computing Research Center, called
    the “Center 1127,” or just “1127”, was unusually productive for two or three decades.
    Its work was inspired by Unix and used Unix as a base, but the contributions went
    well beyond. Members of 1127 wrote important books that for have core texts in
    computer science and references for programmers. Center 1127 was an exceptionally
    influential industrial computer science research laboratory, one of the most productive
    of comparably sized groups at the time or subsequently.


    Why was Unix and the surrounding environment so successful? Did a two-person experiment
    grow into something that literally changed the world? Was this a singular event,
    so unlikely that nothing like it ever happen again? On the larger question of
    whether influential results can be planned, I''ll say more at the end of the book.
    For now, it seems to me that Unix owes its success to an accidental combination
    of factors: two exceptional people, an excellent supporting cast, talented and
    enlightened'
