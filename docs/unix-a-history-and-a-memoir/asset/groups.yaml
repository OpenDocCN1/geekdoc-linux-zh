    ## 第 9 章

    ## 遗产


    > “Unix 不仅是对其先驱的改进，对它的所有继者也是如此，”


    Doug McIlroy，2011 年丹尼斯·里奇日本奖颁奖典礼上的演讲，对 Tony Hoare 关于 Algol 的说的转述


    Unix 取得了巨大的成功。作为 Unix、Linux 或 macOS 或其他变体，它运行在数十亿计算机和服务器上，被数十亿的人持续使用，并为无数在其基础上构建的人创造了数十亿美元的财富（尽管没有考虑到它的任何创造者）。后来的操作系统深受其决策的深远影响。


    最初在贝尔实验室为 Unix 开发的语言和工具现在无处不在。在编程语言中，C 和 C++ 仍然是系统编程的骨干，还有像 Awk 和 AMPL 等更专门的语言。核心工具包括
    shell、diff、grep、Make 和 Yacc。


    GNU（“GNU''s not Unix”的递归缩写）是一个基于 Unix 模型的大型软件集合，以源代码的形式免费提供给任何人使用：它提供了 Unix 提供的几乎所有功能，以及更多内容。与
    Linux 操作系统结合，GNU 就等于一个免费版本的 Unix。GNU 的 Unix 命令实现是开源的，因此它们可以被使用和扩展，唯一的限制是如果分发这些实现，必须免费提供给所有人；它们不能是私有的。今天的大量软件开发都是基于开源的，在许多情况下基于
    GNU 的实现。


    是什么导致了 Unix 的成功？是否有可以学习并应用到其他环境中的思想或教训？我认为答案是肯定的，至少在两个方面：对某些人来说是技术上的，也是如此。


    ### 9.1 技术


    Unix 重要的技术思想在前几章中已经讨论过；本节是简要总结。当然，这里并不是一切都源于 Unix；肯·汤普（Ken Thompson）和丹尼斯·里奇（Dennis
    Ritchie）的天才之处在于他们对优秀想法的巧妙挑选，以及他们能够看到简化软件系统的通用概念或统一主题。人们有时用编写的代码行数来讨论软件生产力；在 Unix
    世界，生产力通常通过删除的特例数量或代码行数来衡量。


    分层文件系统是对现有做法的一次重大简化，回想起来它似乎完全显而易见——你还能怎么做呢？与其由操作系统管理属性的不同类型文件，以及对文件在目录嵌套深度的任意限制，Unix
    文件系统提供了一个直观的视图：从根目录开始，每个目录都包含文件信息，或者包含进一步文件和目录信息的目录。文件名简单就是从根目录开始路径路径组件由斜杠分隔。


    文件包含未解释的字节；系统本身并不关心字节是什么，也不知道关于它们含义的任何信息。


    通过六个系统调用即可创建、读取、写入和删除文件。几个位定义的访问控制对于大多数目的都是够的。像移动式磁盘等整个存储设备可以挂载到文件系统中，在逻辑上，内容在那时变成了文件系统的一部分。


    自然地，存在一些不规则之处。设备出现在文件系统中，这是一种简化，但对它们的操作（特别是终端）有特例，且其接口在今天仍然很混乱。


    我在这里描述的是文件系统的逻辑结构。实现这种模型有很多方法，事实上，现代系统支持许多不同的实现，它们呈现出相同的接口，但使用不同的代码和内部数据结构来运行。如果你查看你的电脑，你会看到多个使用这种模型的设备：硬盘、USB
    闪盘、SD 卡、相机、手机等。Unix 的卓越之处在于选择了一种足够通用且极其有用，但在性能上又不会昂贵的抽象。


    一种高级实现语言，当然是用于用户程序，也用于操作系统本身。这个想法并不新；它在 Multics 和一些更早的系统中尝试过，但当时和语言还没有准备好。C 比它的先驱合适得多，它导致了操作系统的可移植性。曾经是硬件制造商的专有操作系统（通常带有它们自己的专有语言），Unix
    变成了一个开放且广泛理解的标准，然后变成了一种商品；该系统只需经过微更改即可在所有计算机上运行。客户不再被锁定在特定的硬件上，制造商不再需要开发自己的操作系统或语言。


    用户级可编程的 shell 具有控制流语句和 I/O 重定向，使得使用程序作为构建块进行编程成为可能。随着 shell 编程能力的增长，它变成了程序员工具箱中的另一种高级语言。正因为它是一个用户级程序，而不是操作系统的一部分，因此它可以被任何有更好想法的人改进和替换。从原始
    Unix 经过 PWB、Bourne shell 和 Bill Joy 的 csh 的演变说明了今天的泛化，当然也存在一些缺点——不兼容的版本增殖得太容易了。


    管道（Pipes）是 Unix 最经典的发明，是使用程序临时连接的一种优雅且高效的方法。通过一系列处理步骤进行数据式传输是自然且直观的，其语法异常简单，而且管道机制与小工具集合完美契合。当然，管道并没有解决所有的连接问题，但
    Doug McIlroy 原始概念中完全通用的非线性连接在实践中并不常见；线性流水线几乎总是足够的。


    将程序视为工具并在组合中使用它们是 Unix 的特征。编写每个只良好做好一件事的小程序，而不是试图做很多事情的大型单体程序，有许多益处。无疑，在某些时刻单体是有意义的，但小程序有很大的优势。实际上，这种方法是在整个程序层面的模块化，与函数层面的模块化并列。


    普通文本是标准格式。文本的广泛使用证明是一个巨大的简化。程序读取字节，如果它们意图处理文本，那么这些字节将以标准表示存在，通常是不同长度的行，每行都以换行符结束。这并不适用于一切，但几乎任何内容都可以以很小的空间或时间代价使用这种表示。很有趣的是，如果
    Unix 是在一个在使用打孔卡而不是电打字机的世界开发的，事情可能会有多大的不同。打孔卡实际上强迫了一种世界观，即一切都以 80 字符块的形式出现，信息通常位于固定字段中。


    编写程序的程序是一个强大的想法。我们在计算领域取得的很大进展都是通过机械化——让计算机为我们做更多的工作。手写程序是困难的，所以如果你能让一个程序为你写程序，那是一个巨大的胜利。这样更容易，而且生成的程序更有可能是正确的。


    编译器当然是一个老例子，但在更高层次上，Yacc 和 Lex 是生成代码创建编程语言的极佳例子。自动化和机械化工具（如 shell 脚本和 makefile）实际上是创建程序的程序。这些工具今天仍在使用，有时以非常大的配置脚本和makefile
    生成器的形式存在，伴随着使用 Python 和 GCC 等编译器的语言源码分发。


    专门的语言，今天通常被称为小语言、领域特定语言（DSL）或应用特定语言（ASL）。我们使用语言来告诉计算机做什么。对于大多数程序员来说，这意味着像 C 这样的通用语言，但有一系列更专门的语言，关注更窄的领域。shell
    是一个很好的例子：它是为了运行程序设计的，并且在这方面做得出色，但你不会想用它来写浏览器或游戏。专门化是一个老观念，当然；最早的高级语言针对特定目标，如 Fortran
    针对科学和工程计算，Cobol 针对商业数据处理。过早尝试太广泛的适用范围的语言有时会失败；PL/I 就是一个例子。


    Unix 拥有悠久的特殊用途语言传统，远超 shell。我心心贴近的文档准备工具是很好的例子，计算器、电路设计语言、脚本也是如此。


