    # CHAPTER 5: SEVENTH EDITION


    Runoff had a dozen or two commands like this that made easy to format simple documents—manual
    pages, program descriptions, letters to friends—any formatting that one might
    do today with a tool like Markdown.


    # Early formatters


    Runoff was a revelation to me, a way to use computers that had nothing to do with
    mathematical computations or compiling. It became easy to refine one’s writing
    over and over again at little cost. It may be hard for readers today to appreciate
    just how labor-intensive it was to prepare documents before the creation of word
    processing programs, when there were only mechanical typewriters—better than cheap
    tablets or quill pens, to be sure, any change of more than a few words in a document
    would require a complete retype. Most documents went through one or two revisions,
    with handwritten changes on a manuscript that had to be laboriously retyped to
    make a clean copy.


    When I started to write my thesis in the fall of 1968, I wanted Runoff, since
    the alternative would have been to type the thesis myself on a manual typewriter
    (and retype it for each set of changes), or pay someone to do it for me. I’m a
    fast but inaccurate typist, so the former was not practical, and since I was both
    cheap and poor, the latter wasn’t either.


    Thus I wrote a simple version of Runoff that I called “Roff,” for “an abbreviated
    form of Runoff.” The problem was that there was no interactive computer system
    like CTSS at Princeton; there weren’t any computer terminals. All that was available
    was punch cards, which only supported upper case letters. I wrote in Fortran (for
    ideal, since Fortran was meant for scientific computation, not pushing characters
    around, but there were no other options) and I added a feature to convert everything
    to lower case while automatically capitalizing the first letter of every sentence.
    The resulting text, now upper and lower case, was printed on an IBM 1403 printer
    that could print both cases. Talk about bleeding edge! My thesis was three boxes
    of cards. Each box held 2,000 cards, was about 14 inches (35 cm) long and weighed
    10 pounds (4.5 kg). The first 1,000 cards were the program and the other 5,000
    were the itself in Roff.


    Readers who have never worked with cards might find this confusing. Each card
    contained at most 80 characters, either line of Fortran or one line of text. If
    some part of the text needed to be changed, the replacement text was punched onto
    a new few cards that replaced the old cards, which were discarded. Fixing a spelling
    mistake would generally require replacing only one card, though if the new text
    were much longer, more cards might be needed.'
