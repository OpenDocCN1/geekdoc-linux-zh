    # AT&T''s 800-number directory


    Ericrosse with software distribution was a big help in a fun unrelated project:
    in 1994, Eric, Lorinda Cherry and I put AT&T’s 800-number directory on the then
    new Internet. The intent was for AT&T to gain some experience with providing a
    real Internet service (and with the Internet itself), perhaps to generate extra
    calls to 800 numbers, and even ultimately to generate revenue through enhanced
    services like display advertisements. In addition, we hoped for some modest public
    relations benefit from providing something of real value, not merely a teaser
    like so many Internet offerings at the time.


    We obtained a database snapshot of 157,000 records, about 22 MB, in August 1994
    and in a few hours it was running on a local computer as a searchable and browsable
    web site. Convincing AT&T management to make it public a much slower process.
    After much internal deliberation, however, managerial reluctance and inertia eventually
    succumbed to a rumor that AT&T’s competitor MCI was to offer some Internet service,
    and the directory went public on October 19, 1994. It was AT&T’s first web.


    The political delay was mildly frustrating, but the data story was instructive.
    The database was replete with errors, a host of listings that clearly no one had
    ever looked at with a critical eye, such as 9 different spellings of Cincinnati.
    (They would make a good example of a regular expression).


    In spite of its imperfections, the directory service garnered some public relations
    benefit; it was listed for a while as the first of the “Cool Links” on the Yahoo
    WWW Guide.(Yahoo itself founded in 1994, and its indexing was eventual for a while
    AT&T scored a minor victory over MCI by being first with a useful service, though
    it was a near thing. The directory did make AT& appear to be involved in the Internet
    and it stimulated significant amount of internal discussion and plans to make
    plans for further services. If nothing else, the experience brought home the remarkable
    rate at which the Internet was growing and changing; as my unofficial report said
    at the time, “We have to learn to act quickly in this area if we are to be in
    it all.”


