    # Preface


    “One of the comforting things about old memories is their tendency to take a rosy
    glow on the fixes, what was good and what lasted, and the joy of helping to create
    life better.”

    Dennis Ritchie, “The Evolution of Time-sharing Systems,” October 1984


    Since its creation at Bell Labs in 1969, the Unix operating system has spread
    far beyond anything its creators could possibly imagined. It has led to the development
    of much innovative software, influenced myriad programmers, and changed the entire
    path of technology. Unix and its derivatives are widely known outside a particular
    community, but they are at the heart of any number of systems. Google, Facebook,
    Amazon, and plenty of other services are powered by Linux, a Unix-like system.
    If you have a cell phone or a Mac, or if you have gadgets like Alexa at home or
    navigation in your car, they are powered by Unix. Whenever you browse the web,
    Unix systems are behind it, and of course, what you are doing is likely based
    on Unix as well.


    Unix was created more than 50 years ago by two people along with a small group
    of collaborators and followers. Through a sequence of lucky accidents, I was present
    at the creation, certainly not responsible for any of it. I can take credit for
    a modest amount of useful software, and thanks to co-authors who helped people
    learn more about Unix and its languages, tools and philosophy.


    This book is part history and part memoir, a look at the origins of Unix and an
    attempt to explain what Unix is, how it came about, and why it matters. It is
    certainly not a scholarly work—no footnotes—and has become less history and more
    memoir. It is written for anyone with an interest in computing or the history
    of inventions. It includes a certain amount of technical material, even if you
    don’t have a background, you can appreciate the basic ideas and why they might
    be important. You can safely skip over anything that seems too complicated, however,
    but some stories that go with it might be new and interesting.


    Fortunately, my purpose in writing is to tell some of the wonderful stories of
    an especially productive and formative time in the history of computing. It is
    important to understand the evolution of the technology that we use and take for
    granted. The decisions that shaped how technology developed were made by real
    people working under the pressures and constraints of the time. If nothing, choices
    that might seem perverse today can often be seen as natural consequences of what
    was understood with the resources available. For now, it seems to me that Unix
    owes its success to an accidental combination of factors: two exceptional people,
    an excellent supporting cast, talented and enlightened


    The story is about more than just the Unix operating system, though that is the
    core. It also includes the C programming language, one of the most widely used
    of all languages, and the heart of the systems that run the Internet and the services
    we use. Other languages began with Unix too, notably C++, which is also widely
    used. Microsoft Office tools like Word, Excel or PowerPoint are written in C++,
    as are most of the browsers you might be using. A dozen or two of the core tools
    that programmers use daily and simply take for granted were written in the early
    days of Unix and are still part of every programmer’s toolkit, often much the
    same as they were 40 or 50 years ago.


    Computer science theory plays a vital role as well, enabling immensely practical
    tools. Hardware research explored design, integrated circuits, computer architecture,
    and unusual special-purpose devices. The interplay among all of these activities
    led to unexpected inventions, and was one of the reasons why the whole enterprise
    was productive across many different fields.

