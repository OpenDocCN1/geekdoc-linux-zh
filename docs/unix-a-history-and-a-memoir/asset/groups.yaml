    ## 3.3 The Unix Programmer''s Manual


    One of the early contributions of Unix was its online manual, in a now-familiar
    format and concise style. Every command, library function, file format, and so
    on had a page in the manual that described briefly what it was and how to use
    it. For example, Figure 3.11 shows the 1st Edition manual page for the cat command,
    which concatenates zero or more files into the standard output stream, by default
    the user''s terminal.


    Early man pages tended to be literally only a single page, a slimness that is
    uncommon today. Besides brevity, a couple of features of man pages were novel
