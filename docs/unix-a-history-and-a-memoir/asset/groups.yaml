    # Chapter 5


    # Seventh Edition (1976-1979)


    “It was really with v7 that the system fledged and left the research nest. V7
    was the first portable edition, the last common ancestor of a radiative explosion
    to countless varieties of hardware. Thus the history of v7 is part of the common
    heritage of all Unix systems.”


    Doug McIlroy, A Research Unix Reader, 1986.


    The 6th edition of Unix was a great base for software development, and the tools
    that came with it making fun and productive. Some pieces were in place well before
    the 6th edition, while others came along afterwards. In this chapter, we will
    see several threads of software development in 1127 that culminated in the 7th
    edition, which was released in January, 1979, nearly four years after the 6th
    edition.


    Logically and chronologically, some of this material should come after the next
    chapter, which describes the spread of Unix outside of Center 1127, but the stories
    seem more cohesive if I talk about the 7th edition. And as Doug McIlroy noted
    in the epigraph above, the 7th edition was the source of much of the heritage
    shared by all Unix systems.


    One of the main themes of Unix and of this chapter is the flowering of influential
    languages, some special-purpose or domain-specific, and some declarative languages.
    I''ll probably spend more time on this topic than many readers care about, but
    it''s been my area of interest for many years. I will try to describe the important
    bits early in each section so that you can safely skip to the end.


    It''s also worth noting that 6th edition Unix was strictly a PDP-11 operating
    at the beginning of this period; by 1979, the 7th edition was a portable operating
    system that ran on four different kinds of processors,'
  - '[PAGE 102]


    of which the DEC VAX-11/780 was the most popular. I''ll have more to say

    about portability in the next chapter, but for now it''s important to notice that

    Unix quietly evolved from being a PDP-11 system to one that was com-

    peratively independent of specific hardware.


    # 5.1 Bourne shell


    I/O redirection and pipes in the 6th edition made it easy to combine

    programs to do some task, by typing a sequence of commands and

    then collecting them in a file—a shell script—so they could be run as a single

    command.


    The 6th edition had an if statement for conditionally executing a

    command, a goto statement for branching to another line of a script file, and

    a way to label a line in the script (":" command, which did nothing) so

    could be branched. Taken together, these could be used to make loops

    In practice, the mechanisms were awkward and fragile.


    As I describe in the next chapter, John Mashey, a member of the Pro-

    grammer''s Workbench (PWB) group, added a number of features to his

    version of the 6th edition made it much better for programming: a

    general if-then-else statement for testing conditions, a while statement for

    looping, and variables for storing information within a shell file.


    In 1976, Steve Bourne, had recently joined 1127, wrote a new shell

    that incorporated the PWB shell features, with major enhancements of his

    hown. The goal was to retain the easy interactive nature of the existing

    shell, but also make it a fully programmable scripting language. Steve''s shell

    provided several control-flow constructs, including if-then-else, while, for

    and case. It also included variables, some of which were defined by the shell

    itself and others that could be defined by users. Quoting mechanisms were

    enhashed. It was also modified so it could be a filter in a pipeline just like

    ay other program. The result, was simply called sh, which replaced

    the 6th edition.


    The control-flow syntax of the new shell was unusual, since it was based

    on on Algol 68, a language favored by Steve though not others in 1127.

    For example, Algol 68 used reversed words as terminators, like fi termi-

    ate if and esac to terminate case. But since od was already taken (for

    the octal dump command), do was terminated by done.'
  - "[PAGE 103]\n\n# CHAPTER 5: SEVENTH EDITION\n\n```\nfor i in $* loop over all\
    \ arguments\ndo\n    if grep something $i\n    then\n        echo found something\
    \ in $i\n    else\n        echo something not found in $i\n    fi\ndone\n```\n\
    \nThe conditions tested by the if and while statements were the status returns\
    \ from programs, that is, numeric values that a program could use to report results\
    \ whether it worked properly. Programs at the time were cavalier about returning\
    \ sensitive status, since it rarely mattered before. Steve set his shell to print\
    \ an irritating message each time a program didn't produce a sensible status.\
    \ After a week of this automated nagging, most programs had been upgraded to return\
    \ meaningful status values.\n\nSteve's shell significantly enriched IO. The BUGS\
    \ section of the 6th edition said \"There is no way to redirect the diagnostic\
    \ output.\" One especially useful new feature was to separate the standard error\
    \ (by default file descriptor 2) so that the output of a script could be directed\
    \ to a file while error messages went somewhere else, unless the terminal:\n\n\
    ```\nprog >file # stdout to file, stderr to terminal\nprog >err # stdout to terminal,\
    \ stderr to err\nprog 1>file 2>err # stdout to file, stderr to err\nprog >file\
    \ 2>&1 # merge stderr with stdout\n```\n\nBy this point, the shell had become\
    \ a real programming language, suitable for writing anything that could reasonably\
    \ be formulated as a sequence of commands. It could often do enough that there\
    \ was no need to write a C program.\n\nOver the years, more features have been\
    \ added, particularly in Bash, the \"Bour Again Shell\" is now the de facto shell\
    \ for most Linux and macOS users. Although personal shell scripts tend to be small\
    \ and simple, the source for major tools like compilers is often distributed with\
    \ configuration scripts of 20,000 or more lines. These script run programs that\
    \ test properties of the environment, like the existence of libraries and sizes\
    \ of data types, so they can compile a version that has been tuned to the specific\
    \ system."
- md: "\n## 5.2 Yacc, Lex, Make\n\nWe use language to communicate, better languages\
    \ help us to communicate more effectively. This is especially true of the artificial\
    \ languages that we use to communicate with computers. A good language lowers\
    \ the barrier between what we want to say (“just to do it”) and what we have to\
    \ say to get some job done. A great deal of research in computing is concerned\
    \ with how to create expressive languages.\n\nSeventh edition Unix offered a diversity\
    \ of language-based tools, some rather unconventional. I think it’s fair to say\
    \ that the majority of these languages would not exist had it not for tools, especially\
    \ Yacc, that made it easy for non-experts to create new languages. This section\
    \ describes the language-building tools. The overall message is that Unix facilitated\
    \ the creation of new languages and thus led to better ways to communicate with\
    \ computers. You can safely skip the details, but the message is important.\n\n\
    Computer languages are characterized by two main aspects, syntax and semantics.\
    \ Syntax describes the grammar: what the language looks like, what’s grammatatically\
    \ legal and what’s not. Syntax defines the rules for how statements and functions\
    \ are written, what the arithmetic and logical operators are, how they are combined\
    \ into expressions, what names are legal, what words are reserved, how literal\
    \ strings and numbers are expressed, how programs are formatted, and so on.\n\n\
    Semantics is the meaning that is ascribed to legal syntax: what does a legal construction\
    \ mean or do. For the area computation program in Chapter 2, which is repeated\
    \ here:\n\n```\nvoid main() {\n    float length, width, area;\n    scanf(\"%f\
    \ %f\", &length, &width);\n    area = length * width;\n    printf(\"area = %f\\\
    n\", area);\n}\n```\n\nthe semantics says that when the function main is called,\
    \ it will call the function scanf to read two data values from the standard input,\
    \ compute the area, and call printf to print area =, and the newline character\
    \ (\\n).\n\nA compiler is a program that translates something written in one language\
    \ into semantically equivalent in another language. For example, compilers for\
    \ high-level languages like C and Fortran may translate into assembly language\
    \ for a particular kind of computer; some compilers translate from other languages,\
    \ such as Ratfor into Fortran.\n\n# CHAPTER 5: SEVENTH EDITION\n\n# 91\n\nThe\
    \ first part of the compilation process is to parse the program, that is, to determine\
    \ its syntactic structure by recognizing names, constants, function definitions,\
    \ control flow, expressions, and the like, so that subsequent processing can attach\
    \ suitable semantics.\n\nToday, writing a parser for a programming language is\
    \ well-understood technology, but in the early 1970s it was an active research\
    \ area, focused on creating programs that would convert the grammar rules of a\
    \ language into an efficient parser for programs written in that language. Such\
    \ parser-generator programs were also known as “compiler-compilers,” since they\
    \ made it possible to generate a parser and also provided a way to execute code\
    \ when particular grammar constructs were encountered during parsing.\n\n# Yacc\n\
    \nIn 1973, Steve Johnson (Figure 5.1), with language-theory help from Al Aho,\
    \ created a compiler-compiler that he called YACC (henceforth Yacc). A comment\
    \ from Jeff Ullman inspired the name, which stands for “yet another compiler-compiler,”\
    \ suggesting that it was not the first such program.\n\n![](img/07eb79c40271e71719affc2198867bf4_105_0.png)\n\
    \n**Figure 5.1:** Steve Johnson, ~1981 (Courtesy of Gerard Holzmann)\n\nA Yacc\
    \ program consists of grammar rules for the syntax of a language, and semantic\
    \ actions attached to the rules so when a particular grammatical construction\
    \ is detected during parsing, the corresponding semantic action can be performed.\
    \ For example, in pseudo-Yacc, part of the syntax of arithmetic expressions might\
    \ be:\n\n```\nexpression := expression + expression\nexpression := expression\
    \ * expression\n```\n\nand the corresponding semantic actions might be to generate\
    \ code that add or multiply the results of the two expressions together and make\
    \ that the result. Yacc converts this specification into a C program that parses\
    \ input and performs the semantic actions as the input is being parsed.\n\nNormally\
    \ a compiler would have to write more complicated rules to handle the fact that\
    \ multiplication has higher precedence than addition (that is, multiplications\
    \ are done before additions), but in Yacc, operator precedence and associativity\
    \ can be specified by separate declarations rather than additional grammar rules,\
    \ which is a huge simplification for non-expert users.\n\nSteve himself used Yacc\
    \ to create a new \"portable compiler\" (PCC) that had a common front end for\
    \ parsing the language and separate back ends for generating code for different\
    \ computer architectures. Steve and Dennis also used PCC in their implementation\
    \ of Unix for the Interdata 8/32, as described in Section 6.5.\n\nPCC had other\
    \ uses as well. As Steve recalls,\n\n\"An unexpected spin-off from PCC was a program\
    \ called Lint. It would read your program and comment on things that were not\
    \ portable, or just plain wrong, like calling a function with the wrong number\
    \ of arguments, inconsistent sizes between definition and use, and so on. Since\
    \ the C compiler only looked at one file at a time, Lint quickly became a useful\
    \ tool when writing multi-file programs. It was also useful in enforcing standards\
    \ when we made V7 portable, things like looking for system calls whose error return\
    \ was -1 (Version 6) instead of null (V7). Many of the checks, even were eventually\
    \ moved into the C language itself; Lint was a useful test-bench for new features.\"\
    \n\nThe name Lint comes from the image of picking lint off clothing. Although\
    \ its functionality is now subsumed into C compilers, the idea is common in analogous\
    \ tools for a number of other languages.\n\n# CHAPTER 5: SEVENTH EDITION\n\nYacc\
    \ was instrumental in several of the languages that were developed in the last\
    \ years over the years, some of which are described in the next few sections.\
    \ Lorinda Cherry and I used it for the mathematical typesetting language Eq. I\
    \ also used Yacc for the document preparation preprocessors Pic and Grap (the\
    \ latter with Jon Bentley, Figure 5.2), for the AMPL modeling language, for at\
    \ least one version of Ratfor, and for other one-off languages over the years.\
    \ Yacc was also used for the first Fortran 77 compiler f77, Bjarne Stroustrup’s\
    \ C++ preprocessor cfront, the Awk scripting language (to be described shortly),\
    \ and a variety of others.\n\n![](img/07eb79c40271e71719affc2198867bf4_107_0.png)\n\
    \n**Figure 5.2:** Jon Bentley, ~1981 (Courtesy of Gerard Holzmann)\n\nYacc’s combination\
    \ of advanced parsing technology, high efficiency and convenient user interface\
    \ helped it to become the sole survivor among the early parser generators. Today\
    \ it lives under its own name, in independent implementations like Bison that\
    \ are derived from it, and in reimplementations in a dozen languages.\n\n# Lex\n\
    \nIn 1975, Michael Lesk (Figure 5.3) created a lexical analyzer generator called\
    \ Lex, which is a direct parallel to Yacc. A Lex program consists of a sequence\
    \ of patterns (regular expressions) that define the “lexical tokens” that are\
    \ to be identified; for a programming language, these would be reserved words,\
    \ variable names, operators, punctuation, and so on. As with Yacc, a semantic\
    \ action written in C can be attached to each token. From these, Lex generates\
    \ a C program that will read a stream of characters, identify the tokens it finds,\
    \ and perform the associated semantic actions.\n\n![](img/07eb79c40271e71719affc2198867bf4_108_0.png)\n\
    \n**Figure 5.3:** Michael Lesk, ~1981 (Courtesy of Gerard Holzmann)\n\nYacc and\
    \ Lex work together. Each time Yacc needs the next token while parsing, it calls\
    \ on Lex, which reads enough input to identify a complete token and passes that\
    \ back to Yacc. The Yacc/Lex combination mechanizes the front-end components of\
    \ a compiler while taking care of complicated grammatical and lexical constructs.\
    \ For example, some programming languages have operators that are two or three\
    \ characters long, like the operator in C. When the lexical analyzer sees a +,\
    \ it has to look ahead to know whether the operator is ++ or an ordinary followed\
    \ by something else. It’s not too hard to write this kind of code by hand, but\
    \ it’s lot easier\n"
  mdcn: "\n\n## 5.2 Yacc, Lex, Make\n\n我们使用语言进行交流，更好的语言能帮助我们更有效地交流。对于我们用于与计算机通信的人造语言来说，更是如此。一种好的语言可以降低我们想表达的内容（“只是想完成它”）与完成某些任务而必须说的内容之间的障碍。计算领域的大量研究都关注如何创建具有表现能力的语言。\n\
    \n第七版 Unix 提供了多种基于语言的工具，其中一些相当不寻常。我觉得可以说，如果没有这些工具，特别是 Yacc，这些语言大部分将不会存在，因为这些工具让非专家也能轻松创建新语言。本节描述了这些构建语言的工具。核心信息是：Unix\
    \ 促进了新语言的创建，从而导致了与计算机通信的更好方法。你可以安全地跳过细节，但这一信息非常重要。\n\n计算机语言具有两个主要方面的特征：语法（syntax）和语义（semantics）。语法描述的是规则：语言的外观是什么，什么在语法上是合法的，哪些是不法的。语法定义了语句和函数的编写规则、算术和逻辑运算符是什么、它们如何组合成表达式、哪些名称是合法的、哪些词是保留字、字面量字符串和数字如何表示、程序如何格式化等。\n\
    \n语义则是赋予合法语法的含义：一个合法的结构意味着或执行了什么。对于第 2 章中的面积计算程序（此处重复一次）：\n\n```\nvoid main()\
    \ {\n    float length, width, area;\n    scanf(\"%f %f\", &length, &width);\n\
    \    area = length * width;\n    printf(\"area = %f\\n\", area);\n}\n```\n\n语义规定，当调用\
    \ `main` 函数时，它会调用 `scanf` 函数从标准输入读取两个数据值，计算面积，并调用 `printf` 打印出 area = 以及换行符 (\\\
    n)。\n\n编译器是将用一种语言编写的内容翻译成另一种语言语义等价内容的程序。例如，C 和 Fortran 等高级语言的编译器可能会翻译成特定类型计算机的汇编；某些编译器会将其他语言（如\
    \ Ratfor）翻译成 Fortran。\n\n# 第 5 章：第七版\n\n# 91\n\n编译过程的第一部分是解析程序，即通过识别名称、常量、函数定义、控制流、表达式等来确定其语法结构，以便后续处理可以附加相应的语义。\n\
    \n今天，为编程语言编写解析器是一项成熟的技术，但在 20 世纪 70 年代初，这是一个活跃的研究领域，重点是创建能够将语言的语法规则转换为该语言编写的程序的高效解析器的程序。这种解析器生成程序被称为“编译器编译器”（compiler-compilers），因为它们使得生成解析器成为可能，并在解析过程中遇到特定的语法结构时提供执行代码的方法。\n\
    \n# Yacc\n\n1973 年，Steve Johnson（图 5.1）在 Al Aho 的语言理论帮助下，创建了一个编译器编译器，他称之为 YACC（此后简称\
    \ Yacc）。Jeff Ullman 的一条注释启发了这个名字，它的意思是“又一个编译器编译器”（yet another compiler-compiler），暗示它并不是第一个此类程序。\n\
    \n![](img/07eb79c40271e71719affc2198867bf4_105_0.png)\n\n**图 5.1：** Steve Johnson，~1981（由\
    \ Gerard Holzmann 提供）\n\n一个 Yacc 程序由语言语法的语法规则以及附加在规则上的语义动作组成，这样当在解析过程中检测到特定的语法结构时，就可以执行相应的语义动作。例如，在伪\
    \ Yacc 中，算术表达式语法的一部分可能是：\n\n```\nexpression := expression + expression\nexpression\
    \ := expression * expression\n```\n\n而相应的语义动作可能是生成代码，将两个表达式的结果相加或相乘并作为结果。Yacc\
    \ 将此规范转换为一个 C 程序，在解析输入时进行解析并执行语义动作。\n\n通常情况下，编译器必须编写更复杂的规则来处理乘法优先级高于加法的事实（即乘法在加法之前执行），但在\
    \ Yacc 中，运算符的优先级和结合性可以通过单独的声明指定，而不是额外的语法规则，这对于非专家用户来说是一个巨大的简化。\n\nSteve 本人使用 Yacc\
    \ 创建了一个新的“可移植编译器”（PCC），它有一个通用的用于解析语言的前端，，以及多个用于为不同计算机架构生成代码的独立后端。Steve 和 Dennis\
    \ 在他们为 Interdata 8/32 实现 Unix 时也使用了 PCC，正如第 6.5 节所述。\n\nPCC 还有其他用途。正如 Steve 回忆的：\n\
    \n“PCC 一个意料之外的衍生品是一个名为 Lint 的程序。它会读取你的程序，并对那些不可移植的或纯粹错误的内容进行注释，例如调用函数的参数数量不对、定义和使用之间的大小不一致等。由于\
    \ C 编译器每次只查看一个文件，因此在编写多文件程序时，Lint 迅速变成了一个非常有用的工具。当我们使 V7 变得移植时，它在强制标准方面也有用，例如寻找错误返回\
    \ -1（版本 6）而不是 null（V7）的系统调用。许多检查最终甚至移动到了 C 语言本身中；Lint 是新功能的一个非常有用的测试平台。”\n\nLint\
    \ 的名字源于从衣服上摘掉毛絮的形象。虽然它的功能现在已被包含在 C 编译器中，但这种思想在其他许多语言的类似工具中也很常见。\n\n# 第 5 章：第七版\n\
    \nYacc 在过去几年中开发的几种语言中都起到了性作用，其中一些将在接下来的章节中描述。Lorinda Cherry 和我将它用于数学排版语言 Eq。我也将\
    \ Yacc 用于文档准备预处理器 Pic 和 Grap（后者见图 5.2），用于 AMPL 建模语言，用于至少一个版本的 Ratfor，以及多年来的其他各种语言。\n\
    \nYacc 还用于第一个 Fortran 77 编译器 f77、Bjarne Stroustrup 的 C++ 预处理器 cfront、Awk 脚本语言（即将描述）以及其他。\n\
    \n![](img/07eb79c40271e71719affc2198867bf4_107_0.png)\n\n**图 5.2：** Jon Bentley，~1981（由\
    \ Gerard Holzmann 提供）\n\nYacc 先进的解析技术、高效率和方便的用户界面帮助它成为早期解析器生成器的唯一生存者。今天它以自己的名字存在于\
    \ Bison 等独立实现中，并在数十种语言的重新实现中。\n\n# Lex\n\n1975 年，Michael Lesk（图 5.3）创建了一个名为 Lex\
    \ 的词法分析器生成器，它是 Yacc 的直接对应物。一个 Lex 程序由一系列定义要识别的“词法标记；对于编程语言，这些将是保留字、变量名、运算符、标点符号等。与\
    \ Yacc 一样，每个标记都可以附加一个用 C 编写的语义动作。通过这些内容，Lex 生成一个 C 程序，将读取字符流，识别发现的标记并执行相关的语义动作。\n\
    \n![](img/07eb79c40271e71719affc2198867bf4_108_0.png)\n\n**图 5.3：** Michael Lesk，~1981（由\
    \ Gerard Holzmann 提供）\n\nYacc 和 Lex 协同工作。每当 Yacc 在解析时需要下一个标记时，它都会调用 Lex，Lex 读取足够的输入以识别一个完整的标记并将其传回\
    \ Yacc。Yacc/Lex 组合实现了编译器的前端组件，同时处理复杂的语法和词法结构。例如，某些编程语言具有两个或三个字符的运算符，如 C 中的运算符。当词法分析器看到\
    \ + 时，它必须向前看以判断运算符是 ++ 还是普通的加号加上其他内容。手动编写这种代码并不难，但要容易得多\n\n"
