    One very important note: the shell is an ordinary user program, not some integral
    part of the operating system, another idea taken from Multics. (That’s the “system
    command language selectable on a per-user basis” mentioned in the feature list.)
    Because the shell is a user program, it''s easily replaced by a different one,
    which is why there are many Unix shells. If you don''t like the way one shell
    works, you can pick another or write your own and use it instead. Speaking of
    “the shell” is not specific.


    That said, all Unix shells provide the same basic features, usually with the same
    syntax. The most important feature is to run programs. They all provide filenamecards,
    where pattern metacharacters like “*” are expanded into a list of filenames that
    match the pattern. Instance, to run the program wc (word count) to count the lines,
    words and characters in all the files in the current directory whose names begin
    with book, one gives the command


    ```

    $ book*

    ```


    The shell expands the pattern book* into all the filenames in the current directory
    that match any name beginning with book, and runs wc with those names as arguments.
    The wc command itself doesn''t know the list of filenames was specified by a pattern.
    It''s important that expansion is done by the shell, not by individual programs.
    For many years, Microsoft’s MS-DOS operating system didn''t work that way, so
    some programs did their own expansions and others didn''t; users couldn''t count
    on consistent behavior.


    Another major service of the shell is input/output redirection. If a program reads
    from the standard input (by default the terminal), it can be made to read from
    an input file by


    ```

    $ program <infile

    ```


    and if it writes to the standard output (again by default the terminal), its output
    can be directed into an output file


    ```

    $ program >outfile

    ```


    The output file is created if it doesn''t already exist. With filename expansion,
    the program doesn''t know that its input or output is being redirected. This is
    a uniform mechanism, applied by the shell, not by individual programs, and easier
    to use that approaches like specifying file input and output by parameters for
    filenames, as in


    ```

    $ program in=infile out=outfile

    ```


