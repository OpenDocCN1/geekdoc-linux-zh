    ![](img/07eb79c40271e71719affc2198867bf4_152_0.png)


    **图 6.3：** John Lions（由 UNSW 提供）


    于 1996 年出版，是一个单本。


    尽管它可以在 Unix 许可者之间共享，但这本书在技术上是一项贸易秘密，因为它包含了 AT&T 的专有源代码。至少在理论上，副本是经过严格控制的；我仍然保留着我的编号副本（#135）。但在早期，它被广泛抄印；图
    6.4 封面上的“地下出版”（samizdat）图像暗示此类副本是秘密制作的。多年后，事实得到了承认，John 的书也了商业出版。


    John 在 1978 年在马里希尔度过了一个学术年假，就在我办公室对面的房间，那间办公室后来属于 Dennis Ritchie。John 于 1998 年去世，享年
    62 岁。他的贡献在 UNSW 的计算机科学教授席得到了纪念。该席由校友和朋友的捐赠资助，其中包括 Ted Dolotta 在 1998 年拍卖他的加州 Unix
    牌照，该车牌由 John Mashey 购买。


    Unix 源码中的一条注释由于《注释》（Commentary）而变得闻名。第 2238 行写道：


    > * 不指你能理解这一点。 */


    > “20 年后，这仍然是对‘真实’操作系统工作原理最好的解释。”

    Ken Thompson


    ![](img/07eb79c40271e71719affc2198867bf4_153_0.png)


    **图 6.4：** John Lions 的《第6 版 Unix 注释》


    正如前面提到的，Dennis 于 2011 年 10 月去世。次年在贝尔实验室举行的一场纪念活动上，我将这条注释作为对 Dennis 致敬的核心。


    Unix 内核代码是由 Dennis 和 Ken Thompson 共同编写的。据我所知，Ken 始终完全赞同良好的代码不需要很多注释的观点，因此推测，伟大的代码完全不需要注释；我认为内核中的大部分注释都来自
    Dennis。你在第 2238 行找到的特定注释以其冷幽默而闻名，多年来在 T 恤等物品上广传。Dennis 本人说：


    > “它经常被援用为对贝尔实验室 Unix 研究发布版注释数量或质量的贬低。我担心，通常来说这种观察并不不公平，但在这种情况下是不合理的根据的。”


    如果你回去看，你会发现这条注释紧跟在一个段长得多的注释之后，该注释描述了在两个进程之间切换控制的上下文切换机制，它实际上是在试图解释一些困难的内容。Dennis
    继续说道：


    “不指你能理解这一点”意在表达一种“这不会出现在考试中”的意味的评论，而不是一种无礼的挑战。


    我之前提到过 Nroff 和 Troff 是很难掌握的工具。《Lions 注释》感谢部分的最后一段暗示 John 会赞同：


    “还必须提到 nroff 程序的协助。没有它，这些笔记永远无法以这种形式产生。然而，它如此不情愿地交出一些更神秘的秘密，以至于作者的感激之情确实是复杂的。当然，nroff
    本身为为未来程序文档艺术的实践者提供一个肥沃的领域。”


    ## 6.5 可移植性


    第 6 版 Unix 主要用 C 语言编写，并辅以有限的汇编语言来访问无法提供的机器特性，例如设置寄存器、内存映射等。同时，Steve Johnson 创建了一个
    C 编译器版本，它在意义上是“可移植的”，这意味着它可以直接重新目标，以为 PDP-11 以外的架构生成汇编语言。这使得通过编译就能将 C 程序移动到其他类型的计算机上。最有趣的移植程序无疑是操作系统本身。这可行吗？


    Unix 的首次移植是在澳大利亚新南威尔士州的惠灵大学由 Richard Miller 完成的；目标计算机是一台 Interdata 7/32。Miller
    没有使用可移植的 C 编译器。相反，他通过修改 Dennis Ritchie 原始 C 编译器的代码生成器，引导自己到了 Interdata 上。到 1977
    年 4 月，他的 Unix 版本已经可以运行并自给自足。

