    There were relatively few levels in the hierarchy. Researchers like me were “member
    of technical staff” or MTS, and there were a couple of technical levels below
    that. MTS in Research normally got a private office, though everyone was expected
    to keep the door open most of the time. There was a supervisor level above this,
    though 1127 had only a few supervisors all over the years. The next level was
    department head, a person like Doug McIlroy who was responsible for half a dozen
    to a dozen researchers. The level above that was director of a center, who might
    have half a dozen members, then executive director, with handful of centers, and
    then vice president, who oversaw the executive directors.


    Vice presidents reported to the president. Bill Baker, an outstanding chemist,
    was vice president of research from 1955 until 1973, and president of Bell Labs
    until 1980. While he was vice president, it was believed that he knew every MTS
    in research and name was aware of what they were working on. I think it might
    have been true; certainly he always knew my colleagues and I were up to.


