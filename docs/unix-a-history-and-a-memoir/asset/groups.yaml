    # 44

    # 第3章：第一版


    电打字公司（Teletype Corporation）是 AT&T 的一部分，电打字机在贝尔系统及其他地方广泛用于发送消息，后来用于连接计算机。在电打字键盘上输入的任何内容都会发送到计算机，响应结果以（大写字母）打印在长卷纸上；图片中可以清晰看到卷纸的顶部。可以认为，Unix
    中许多命令名称之所以很短，一个原因是在 Model 33 机型上打字需要耗费巨大的体力，而且打印速度很慢。


    ![](img/07eb79c40271e71719affc2198867bf4_58_0.png)


    **图 3.1：** Ken（坐）和 Dennis 在 PDP-11 前，~1972 年（维基百科）


    有人甚至制造了一个实验性的“便携式”Model 33。键盘和打印机被挤进一个类似手提箱的容器里，理论上可以随身携带，尽管重 55 磅（25 公斤）时你也带不远。（而且它还没有轮子。）它通过拨号电话连接和内置的声学耦合器连接到远程计算机：将电话听筒插入两个橡胶插座，耦合器将数据转换为声音并反之，就像传真机一样。我曾设法几次把其中一台终端带回家里，但称其为“带”都太客气了。


    # 第3章：第一版

    # 45


    当 Model 37 型电打字机出现时，情况有了显著改善。它既有大写字母也有小写字母，速度快快（每秒 15 个字符而不是 10 个），尽管打字仍然很费力。它有一个扩展的文本框，可以打印数学符号，这对于专利申请以及我们的技术论文都很有用，而且它可以以半行的步长来移动纸张，使得数学下标和上标成为可能。


    向它喂纸张也是一个挑战；放入一新箱风页纸需要费一番扭曲的姿势。Bob Morris 曾给 Joe Ossanna 发了一封包含 100 个反向换行符的邮件；当
    Joe 尝试读取该消息时，Model 37 将纸张吸回并掉在了地板上。


    在早期的几年里，Bob 一直坐在我对面的办公室。Morris 在贝尔实验室是一个很常见的姓；事实上，几年后在同一个办公室还有另一位名叫 Robert Morris
    的访客。Bob 经常收到投错的邮件，他总是尽职地将其寄回，解释说自己不是那个 Morris。有一封邮件一直寄来，是来自公司其他部门的一份详尽的蓝图，上面写着“请签名并寄回”。所有的拦截尝试都失败了，于是某天
    Bob 签了名并寄了回去。那封邮件再也没有出现过。


    ## 3.2 Unix 房间


    尽管每个研究 MTS（矩阵技术服务）都有私人办公室，但很多 Unix 工作在一个被称为“Unix 房间”的共享空间进行。它的实际位置在多年里变化过几次，但它一直是一个聚会、了解动态、贡献想法或社交的地方。


    最初的 Unix 房间曾短暂位于 2 号楼的 4 层，那里 PDP-7 所在地；多年来的主要地点位于 2 号楼 6 层的 2C-644 室。2 号楼只有五层办公。六层基本上是一条服务廊：肮脏、光线昏暗，一排排锁在铁丝笼里的存放废弃设备的区域。在尽的一端有一个开放区域，那里有自动贩卖机，提供难喝的咖啡和几乎不能吃的点心，为深夜编程提供燃料；那里还有几个封闭空间，其中一个至少做了十年的
    Unix 房间。它放置着 PDP-11；图 3.1 中 Ken 和 Dennis 的照片就是在那里拍摄的。几张桌椅和一些其他终端使其成为了一个非常实用的工作区域。


    早期的爱好者之一是一位极具声望的理论物理学家（现已去世），我称他为“M—L”。M— 渴望使用 Unix；他在计算机使用方面非常有前瞻性，而且是一个和蔼大方的人。但他话多得可怕。一旦他开始，没人能让他停下来，你得听一小时的单向对话。所以有人在
    Unix 房间的门上钻了一个小洞，这样我们在进去之前可以窥视一下他在不在。这个洞被称为“L—洞”。


    ![](img/07eb79c40271e71719affc2198867bf4_60_0.png)


    图 3.2：Unix 房间、咖啡机和咖啡豆机


    某地，Unix 房间迁移到了 9 号楼 5 层的 501 室，就在我办公室转角处。它还配备了各种咖啡机，最初是带有加热功能的普通咖啡壶，可以保持咖啡恒温直到将其烧焦（这种情况经常发生），然后是一系列更昂贵的咖啡豆机和浓缩机（图
    3.2），最后一种花费了约 3000 美。如果我的消息没错，Unix 居民们通过集资购买了机器，而管理层支付咖啡费用。


    Unix 房间纯粹很好；总有些事情在发生。有些人几乎完全在那里工作，很少使用办公室。其他人每天会来几次喝喝咖啡、聊天。Unix 房间对于营造社区感的重要性无论如何强调都不过。回想起来，我在开放区域花费了足够的时间，至少对我来说，Unix
    房间是至关重要的。


    1985 年，Peter Weinberger 被提升为部门主管，并为公司报纸《贝尔实验室新闻》（因为它只刊正面消息）拍摄了专业照。在一次严重的战术错误中，Peter
    将原始头像照（图 3.3）留在了 Unix 房间里。


    多年来，Peter 的脸出现在很多地方——一张顶端都是 Peter 脸的组织图、楼梯墙上的一排圆形磁铁、印在新铺的混凝土地板上、在微处理器芯片上，最引人注目的是在
    1985 年 9 月 16 日晚上，贝尔实验室的一个水塔上（图 3.6）。


    关于是谁画的传言一直流传，但三十年后他们依然守口如瓶。曾提交过漆费报销申请，但被拒绝了。无论如何，几天后水塔上的图像就被一个显然不理解我们幽默感的官方涂掉了。


    Peter 许多脸的完整故事可以在 spin.root/pjw 找到，那是 Gerard 维护的网站，Rob Pike 对 Peter 的照片进行了许多原始改进。


    ![](img/07eb79c40271e71719affc2198867bf4_62_0.png)


    **图 3.3：** 原始 Peter 的脸（由 Gerard Holzmann 提供）


    ![](img/07eb79c40271e71719affc2198867bf4_62_1.png)


    **图 3.4：** AT&T “死之星”标志


