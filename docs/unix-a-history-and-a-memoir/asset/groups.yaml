    ## 第 9 章：传承


    经验虽然重要，但它是值得追求的，而且良好地完成应该是管理人员奖励机制的一部分。


    尽管贝尔实验室（Bell Labs）的管理层在各个层面上都是值得认可的，但 AT&T 的高层管理似乎脱离了新技术，对变化的适应缓慢。例如，在 20 世纪 90
    年代初，当时 1127 主经理 Sandy Fraser 告诉 AT&T 的高管，网络技术的改进意味着长途费用可以从目前的每分钟十分分下降到每分钟一分，但他遭到了冷笑。今天的价格已经接近每分钟零分；Sandy
    太太保守了。


    **协作的环境。** 贝尔实验室的规模和体意味着对于几乎任何技术领域，都有多位专家，他们通常是该领域的世界领袖。此外，这种文化具有强烈的合作性和乐于助人的精神。致电某人的办公室寻求帮助是完全的标准程序；大多数情况下，被请求的人会放下手头工作来提供协助。那里还有一个极佳的技术图书馆，24
    小时开放，订阅了大量期刊，并可以对其他图书馆进行远程访问；它等同于大学图书馆，但侧重于科学技术。


    对于 1127 的许多人来说，最相关的专家聚集地是数学研究中心，那里有极其非凡的数学家，包括 Ron Graham、Mike Garey、David Johnson、Neil
    Sloane、Peter Shor、Andrew Odlyzko 等——名单还在不断增加。John Tukey（可以说是当时世界上最顶尖的统计学家，顺便还是发明了“bit”（比特）一词的人）就在走廊对面，数学和通信的几乎任何方面都有令人敬畏的专家。例如，我现在的普林斯顿的同事
    Bob Tarjan（他于 1986 年获得图灵奖）就在数学中心。


    他们总是准备着提供帮助，而不仅仅是技术事务。例如，Ron Graham 不仅是一位卓越的数学家，还是一个出色的杂技专家，曾任国际杂技协会主席；他甚至在办公室里装了一个网，用来在杂技球落地前接住它们。Ron
    过去说他可以在 20 分钟内教任何人学会杂技。我担心在我身上这并不成立，但一小时的一对一指导（在他的办公室里！）确实让我过了关，我至今还留着他给我的练习用的曲棍球球。


    **乐趣。** 享受你的工作和同事是非常重要的。1127 几乎总是一个令人向往的地方，不仅是为了工作，更是为了那种成为一个卓越群体一员的精神。由于当地除了公司食堂外没有其他餐饮选择，午餐提供了社交和技术讨论的混合场所。虽然
    Unix 一群人通常在下午 1 点吃饭，但有一群更大规模的人常在上午 11 点吃饭。讨论的话题涵盖了从大到小的技术想法到毫无保留的政治讨论等所有内容；这些讨论通常会在绕着贝尔实验室场区散步时继续。


    中心成员之间会互相恶作剧，并可能在反制任何大公司中不可避免的官僚主义时获得了某种过分的快乐。我们本应提供的各种形式和程序进一步提供了更多机会。


    例如，安保人员会对违反某些规则的卡片贴条。某春天的一天，Mike Fisk 发现了一张空白条，他把它放在同事汽车的挡风玻璃上，违规项目列为“未在 4 月 1
    日前拆雪架”。那位同事（在此不具名）实际上因为这个玩笑被带留了好几个小时。


    到为止，最复杂的恶剧是针对 Arno Penzias 的，由 Rob Pike 和 Dennis Ritchie 领导的至少十二人团队实施，并在专业魔术师
    Penn 和 Teller 的帮助下完成。在书中写太长了，Dennis 在 www.bell-labs.com/usr/dmr/www/labscam.html
    讲述了 Labscam 的故事，视频位于 www.youtube.com/watch?v=Im，我在演职表里提到过我是打杂的，这是准确的——其中涉及了很多胶带。


    贝尔实验室没有免费食物（那是我那个时代会很感激的现代福利），但以某种方式我们搞到了免费咖啡；是管理层买单的。


    人们会在 Unix 房间留下供品以供大家使用。有人发现了一批 10 公斤（22 磅）装的高质量巧克力块，并留给人们来切着吃。不过，食物并不总是符合标准：


    > “有人带了一袋标有中文标签的物品。我们每个人都咬了一下。然而，食物并不总是符合标准：……”（此处原文存在大量重复错误，已按翻译规范精简冗余重复句）


    ### 9.3 认可


    Unix 及其主要创作者 Ken Thompson 和 Dennis Ritchie 得到了认可。当他们于 1983 年获得 ACM 图灵奖时，委员会表示：


    “与那个时代的其他操作系统相比，他们的新系统更简单、更快，并且具有用户友好的分级文件系统。Unix 是与 C 语言结合开发的，这种语言现在仍被广泛用于。”


    他们还于 1999 年获得了美国国家技术奖，其奖词如下：


    “Unix 的成功源于它的优雅性。Unix 也是互联网背后的主要驱动力。加州大学伯克利分校开发了 BSD发行版（BSD），这是一种实现了互联网协议 TCP/IP
    的 Unix 扩展。该开发基于贝尔实验室在 1975 年随源代码分发给大学和研究机构的第六版 Unix，这引发了‘开源’文化的开端。”


