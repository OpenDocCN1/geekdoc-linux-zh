    计算科学研究中心的成员在 20 世纪 70 年代和 80 年代编写了数量巨大的影响力书籍，远超人们对工业实验室的预期。因此，一段时间后，贝尔实验室（Bell
    Labs）成为了计算和计算机科学领域权威书籍的来源。


    Al Acho 写了多本广泛使用的教科书，包括与 Jeff Ullman 编写的著名的 1977 年“龙书”（《编译器设计原理》，图 5.12），以及与 Jeff
    和 John Hopcroft 编写的《计算机算法设计与分析》。Bjarne Stroustrup（图 5.13）在 80 年代初创造了 C++，并在几年后编写了关于
    C++ 的书籍。Jon Bentley 的《编程珍珠》源于他在《美国 ACM 通报》杂志上的专栏。团队的 Mike Garey 和 David Johnson
    使用 Eq 编写了他们的核心著作《计算机与不可计算性：NP 完全性理论指南》。我们还出版了 Unix、Plan 9 等系统的手册。这些出版物成为了一代程序员和计算机科学家的标准文本和参考资料。


    这群规模较小的工业界研究人员是如何产出如此多影响力巨大的书籍的？


    我能看到几个原因。首先，最重要的是，人们对待自己的写作非常认真，并且对他人的作品具有批判性眼光。Doug McIlroy 是我们小组中的佼佼者；无论主题是什么，没有人能像
    Doug 那样发现错误（从微小的细节到致命的错误），他对于晦涩的散文也绝不容忍。我不认为自己在贝尔实验室写过任何没有请教过 Doug 确认的东西，而他总是会这样做。当他粉碎我的文字时，我感到很谦卑，但这让我成为了一个更好的作家，这种情况也发生在其他人身上。


    ![](img/07eb79c40271e71719affc2198867bf4_125_0.png)


    # 编译器设计原理


    **图 5.12:** Aho 和 Ullman 的龙书，第一版，1977 年


    当然，Doug 并不是唯一的批判性读者。每个人都慷慨地投入时间；对同事撰写的内容提供详细意见仅仅是那里文化的一部分。这是极不寻常的，也是让实验室成为一个极佳工作场所的原因之一。


    其次，当地管理层支持书籍编写。出版对于维持贝尔实验室在科学和学术界的声誉非常重要，这包括书籍。在管理层的支持下，全职投入六个月写一本书，集中的精力就足以完成一项如果作为业余或晚间活动可能需要几年的工作。更棒的是：尽管贝尔实验室保留了书籍的版权，但作者可以保留版税。我怀疑我们中从未有人曾显式地为了赚钱而写书——实验室里没有人会蠢到认为写一本技术书是暴利的——但如果一本书取得了某种成功，作者就留下了那笔钱。


    这种开明的管理和公司政策鼓励了人们写作，从长远来看，这对公司和作者都是有利的。实验室作者的出版物对于招聘至关重要。


    ![](img/07eb79c40271e71719affc2198867bf4_126_0.png)


    # **图 5.13:** Bjarne Stroustrup, ~1984 (由 Bjarne Stroustrup 提供)


    贝尔实验室并不是什么神秘的秘密行动；学生们知道那是他们软件诞生和教科书编写的地方。潜在的新入职者可以看到优秀的工作正在被完成并出版；他们不需要担心消失在某个“工业”研究实验室里。这让贝尔实验室的招聘与大学处于平等的地位，而且还有一个优势，即人们可以在实验室全职研究，不受教学、行政和筹款的干扰。这种优秀软件与高影响力书籍的结合，是当时实验室如此成功的重要部分。


    第三个因素更具技术性：C 和 Unix 作为编程环境的共生关系、文档准备作为一个研究领域，以及关于技术主题的写作作为主要活动。这始于文本格式化程序，如 Doug
    McIlroy 的 Hoff、Joe Ossanna 的 Nroff 和 Troff，然后是像 Eq、Tbl 等预处理器。这些工具使得生成包含更多排版挑战性内容的文档变得更容易，例如数学、表格、插图、图表和图形。这反过来导致了更好的写作，因为所有这些文档准备程序都具有一个关键特征：它们使得对文档进行多次修订变得容易，并且始终有一个干净的副本可以工作，而不是将材料交给打字员并等待几天才返回那种缓慢而痛苦的替代方案。


    # 第五章：第七版


    # 113


    这听起来可能微不足道，但我确定这种如此容易进行修订以改进写作的能力很重要，因为这几乎消除了制作最新副本的开销，并完全消除了打字员、编辑和打印员等中间环节。准确性对于技术论文和《Unix
    程序员手册》非常重要，但对整个过程的控制对于书籍尤为重要。对于编程书籍，直接从源代码进行排版至关重要，这样我们就能确保打印的内容是正确的，没有被人为干预而意外改变。


    这些工具都是用 C 语言编写的，因为它具有表现力且高效。今天可能很难记住，当机器容量以 KB 而非 GB 为单位时，时间和空间上的效率是至关重要的。每一个字节都重要，因此在某种程度上每条指令也是如此，所以一种在这方面都节省资源的语言不仅是好事，更是一种务实的需求。


    这一切都形成了一个循环——这本书是由这些文档准备程序的后代制作的，尽管使用了 James Clark 编写的 Groff、Geqn 等优秀的、全新的实现和增强。


    # 5.4 Sed 和 Awk


    Unix 文件系统的主要简化之一是将其文件统一处理为未解释的字节序列。它没有记录，没有强制性或禁止的字符，也没有由文件系统强加的内部结构——只有字节。


    在大多数 Unix 程序处理文本数据的方式上也有类似的简化。文本文件只是字节序列，这些字节恰好是 ASCII（美国信息交换标准代码）字符。这种对纯文本的统一视图非常契合管道（pipelines），而
    Unix 工具箱中充满了读取文本输入、对其进行某些处理并写文本输出的程序。我已经提到过例子，如字数统计、比较、排序、转录、查找重复项，当然还有经典的例子，用于搜索的
    grep。


    # Sed


    grep 的成功启发了 Lee McMahon 编写了一个名为 sed 的类似程序，它对流过的文本进行简单的替换；“s”是 ed 中的替换命令。Lee 很快将其替换为更通用的形式，一个名为
    Sed 的流编辑器，它在从输入到输出的过程中对文本应用一系列编辑命令；grep 和 gres 都是 Sed 的特例。Sed 使用的命令与文本编辑器中的编辑命令相同。Sed
    经常被用于 shell 脚本中，以某种方式转换数据流：替换字符、添加或删除不需要的空格，或丢弃不需要的内容。


    Lee 有着不寻的背景——哈佛大学的心理学博士学位，在转向更常规的计算机科学家路径之前，曾在耶稣会神学院度过一段时间准备成为神职人员。他是小组中第一批考虑大规模处理文本的人之一，其目的是存储大量数据。我可能补充一点，“大量”是相对的。Lee
    在 20 世纪 70 年代初特别感兴趣的是《联邦党人文》，全文加起来只有 1MB。


    # Awk


    我对能够同样良好处理数字和文本的工具感兴趣。grep 或 Sed 都不能处理数值数据或进行算术运算，计算仍然需要 C 程序。因此我在寻找某种通用的方法。与此同时，Al
    Ho（图 5.14）一直在实验 grep 支持的更丰富的正则表达式类，并编写了 egrep（扩展 grep）。最后，Peter Weinberger（很久后转到
    1127 间并搬到了 Al 和我之间的办公室）对数据库感兴趣。


    1977 年秋季，我们三人讨论了如何结合这些想法，从 IBM 但晦涩的报告生成器 RPG 中汲取了灵感，并结合 Marc Rockkind 在下一章中描述的一个新想法。最终，我们设计了一种称为
    AWK 的语言（以后称为 Awk）。正如我们在原始描述中所说的，用作者的名字命名语言显示了想象力的匮乏。我不记得我们是否考虑过与“awk”（笨拙）相关的词，或者我们是否以讽刺的方式觉得这个名字合适，但无论如何它留了下来。


    Awk 程序是模式和动作的序列。每行输入都会针对每个模式进行测试，执行相应的动作。模式可以是正则表达式，也可以是数值或字符串关系。动作是用 C 变言编写的。省略模式匹配所有行；省略动作则打印匹配的行。


