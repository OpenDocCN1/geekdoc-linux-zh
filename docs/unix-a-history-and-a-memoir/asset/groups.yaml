    In 1981 Bill and I published a version of the Tools book based on Pascal, at which
    the time was popular as a teaching language in universities. Pascal had good properties,
    including sensible control flow and recursion, both of which were missing from
    Fortran.


    Unfortunately, it also had some so good properties, like awkward input and almost
    unusable character strings, which I described in a paper titled “Why Pascal is
    Not My Favorite Programming Language.” I submitted the paper to a journal, but
    it was rejected as too controversial, or perhaps not substantial enough. It was
    never published, but in spite of that, it’s cited surprisingly often.


    In any case, as C and Unix became more widely available, Pascal’s limitations
    made it less and less popular, so Software Tools in Pascal was not widely read.
    In hindsight, a C version would have had far more impact, both in the short term
    and in the long run.


    # 4.9 Biography: Doug McIlroy


    Rob Pike called Doug McIlroy “the unsung hero of Unix,” and I agree. Ken Thompson
    says Doug is smarter than everyone else, who also seems accurate, Doug himself
    says “I’ll leave to others to assess how smart I may be, and I know that many
    of BTL’s teaching mathematicians were much smarter.” Suffice to say that there
    were many outstanding people at the Labs, the imposter syndrome was not unknown,
    and one was continuously stretched trying to keep up.


    No matter where he is here, Unix might not have existed, and certainly would not
    have been as successful, without Doug’s good taste and sound judgment of both
    technical matters and people.


    Doug received his undergraduate degree in physics from Cornell in 1954 and his
    PhD in applied mathematics from MIT in 1959. He too worked for a summer at Bells
    Labs, joined permanently in 1958, and became head of the Computing Techniques
    Research department in 1965, two years before I first met him. As described earlier,
    I spent the summer of 1967 as an intern in Doug’s department, nominally working
    on a storage allocator problem that he suggested but in doing my own thing. One
    of his many good qualities as a manager was that he was never bothered by that
    at all.


    I''ve already mentioned Doug’s early language work on PL/I and EPL. Once Unix
    was underway, he wrote a variety of fundamental software. His storage allocator
    malloc was used for many years, and his research on allocators affected subsequent
    work. He also wrote a bunch of commands; list on his web page at Dartmouth includes
    spell, diff, sort, join,'
