    Bob Fourer, Dave Gay and I designed and implemented AMPL, a language for specifying
    optimization problems like linear programming. Bob was a professor of management
    science and operations research at Northwestern University, and had long been
    interested in helping people create mathematical optimization models. Our work
    on AMPL began when he spent a sabbatical at the Labs in 1984.

    The AMPL language makes it easy to define models that describe particular optimization
    problems, like finding the best way to ship goods from factories to stores, given
    data for shipping costs, sales at each store, the manufacturing capacity of each
    factory, and no on. Optimization problems are written in an algebraic notation
    for systems of constraints that have to be satisfied, and an objective function
    to be maximized or minimized.


