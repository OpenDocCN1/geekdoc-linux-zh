    In spite of how easy and powerful Lex is, over the long haul, it has not been
    as extensively used as Yacc. Perhaps this is because writing a parser for a complex
    language can be daunting for a comparatively inexperienced programmer, while writing
    a lexical analyzer is not. But writing a lexical analyzer by hand, however easy
    and straightforward it might seem, is not necessarily a good idea.


    My experience with the Awk scripting language (discussed later in this chapter)
    may be instructive. The first implementation of Awk used Yacc for the grammar
    and Lex to tokenize the input program. When we tried to port Awk to non-Unix environments,
    however, Lex was not available or it worked differently. After a few years, I
    reluctantly rewrote the lexical part of Awk in C, so it would be portable to all
    environments. But for years afterwards, that hand-crafted lexical code was a fruitful
    source of bugs and subtle problems that were not present in the Lex-generated
    version.


    This is a good example of a general rule: if a program writes your code for you,
    the code will be more correct and reliable than if you wrote it by hand. If the
    generator is improved, for example to produce better code, everyone benefits;
    by contrast, improvements to one hand-written program do not improve others. Tools
    like Yacc and Lex are excellent examples of this rule, and Unix provides many
    others as well. It''s all worth trying to write programs that write programs.
    As Doug McIlroy says, "Anything you have to do repeatedly may be ripe for automation."


    # Make


    Most large programs consist of multiple source files, which have to be compiled
    and linked together to create an executable program. This can often be done with
    a single command as cc *.c to compile all the source files for a C program, but
    in the 1970s computers were so slow that recompiling a multi-file program after
    making a change in a single file could take significant time, minutes instead
    of seconds. It was more efficient to recompile only the changed file and link
    the result with the other previously compiled files.


    Remembering which files had been compiled recently enough and needed to be recompiled
    was a nuisance, however, and it was easy to make mistakes. Steve Johnson complained
    about this to Stu Feldman (Figure 5.5) one day, after spending hours of fruitless
    debugging, only to realize that he had simply failed to recompile one of the files
    he had changed.


    Coincidentally, Stu had exactly the same thing and had struggled to debug a program
    that was really correct, just not recompiled. He came up with an elegant idea,
    a specification language that describes how the pieces of a program depend on
    each other. A program that he called Make analyzed the specification and used
    the times that files had been changed to do the minimum amount of recompilation
    necessary to bring everything up to date. The first implementation was in 1976:


    "I wrote Make over the weekend, and then rewrote it the next weekend with macros
    (the list of built-in code getting too long). I didn''t fix the tab-in-column-1
    because I quickly had a devoted user base of more than a dozen people and didn''t
    want to upset them."


    ![](img/07eb79c40271e71719affc2198867bf4_111_0.png)


    **Figure 5.5:** Stu Feldman, ~1981 (Courtesy of Gerard Holzmann)


    Make was an instant success, since it obviated a whole class of silly errors while
    making compilation as efficient as possible. It was also a boon for programs that
    involved more complicated processing than just C compilation, for example programs
    that used Yacc and Lex, each of which had to be run first to create C files that
    were then compiled, as in Figure 5.4 above. One makefile could capture all the
    processing steps necessary to compile a new version of the program, and could
    also describe how to do related tasks like running Lint, making a backup and printing
    documentation. A makefile had some of the same properties as a shell script, but
    the language declarative: a specification of dependencies and how to update components
    but without explicit tests of file creation. The "tab-in-column-" problem that
    Stu refers to is an unconventional and somewhat awkward restriction on the format
    of makefiles.


    It’s also a nice example of a general problem that any successful program faces:
    if the program is good, it attracts users, and then it becomes hard to change
    the program in any incompatible way. Unix and most other systems are replete with
    examples of initial blemishes that are not too entrenched to fix.


    Make is also a good example of a theme in this section: rather than writing code
    or doings sequences of operations by hand, create a notation specification that
    declares what has to be done, and write a program to interpret the specification.
    This approach replaces code with data, and that''s almost always a win.


    Yacc and Make are very much with us today, because they address important problems
    that programmers still face, and they solve those problems well enough that the
    designs and sometimes even the original implementations are still in use.


    As a digression, I first met Stu in 1967 when I was a grad student at Princeton
    and he was an undergrad; he was working part-time on Multics for Bell Labs during
    the school year. He joined 1127 after getting his PhD in astrophysics at MIT.
    He went to Bellcore in 1984, then to IBM, then to Google, where in a bit of good
    fortune for me, he was my manager several times.


