    ## 9.4 Could history repeat?


    Could there be another Unix? Could a new operating system come out of nowhere
    and take over the world in a few decades? I often get this question when I talk
    about Unix. My answer is no, at least at the moment. There will be no revolution;
    more likely, operating systems will continue to evolve, while carrying a great
    deal of Unix DNA.


    But some analogous success could happen in other areas of computing. There are
    always creative people, good management is not unheard of, hardware is very cheap,
    and good software is often free. On the other hand, there are unfettered environments,
    industrial research is much reduced and constrained and far more short-term than
    it was fifty years ago, and academic research is strapped for funds.


    Netflix, I am optimistic, on the grounds that the great ideas come from individuals.


    For example, the number of people contributing to Unix in the early days was tiny;
    arguably the core was a single person, Ken Thompson, who is certainly the best
    programmer I have ever met, and an original thinker without peer. Dennis Ritchie,
    whose name is likely with Ken as the co-creator of Unix, was a vital contributor,
    and his C programming language, central to the evolution of Unix in the early
    days, is still the lingua franca of computing.


    # CHAPTER 9: LEGACY


    It is instructive to examine the languages that programmers use every day and
    see how often they were originally the work of one or two people. Almost every
    major programming language is like that, including Java (James Gosling), C++ (Bjarne
    Stroustrup), Perl (Larry Wall), Python (Guido von Rossum), and JavaScript (Brendan
    Eich). It seems safe to predict that there will continue to be new languages to
    make programming easier and safer. It is also safe to predict that there won’t
    be just one language, however—there are too many tradeoffs for a single language
    to serve all purposes enough.


    Google, Facebook, Amazon, Twitter, and any other company that went from startups
    to multi-billion-dollar enterprises originated with a bright idea by one or two
    people. There will be more of these, though it’s also possible that new ideas
    occur and new companies appear, they will quickly be snapped up by the existing
    big companies. The bright ideas will be preserved, and the inventors will be well
    compensated, but the big fish are likely to eat the little ones quickly.


    Good management is another component of success. Doug McIlroy stands out here
    as one unique, a leader of outstanding intellectual prowess, with incomparable
    technical judgment, and a management style based on being one of the first users
    of whatever his colleagues developed. Unix itself, but also languages like C and
    C++, and any of Unix tools, all proficient from Doug’s good taste and razor-sharp
    critiques. So did Unix documentation of all sorts, from the user manuals through
    a few dozen influential books. I can attest to this personally: Doug was the outside
    reader on my PhD thesis in 1968, made incisive comments on all of my technical
    papers and books, and is still keeping me on target more than 50 years later.


    Bell management was technically competent, and it was hands-off, so it didn’t
    push particular projects or approaches. In over 30 years at the Labs I never felt
    told what to work on. Bruce Hannay, vice president of Research after Bill Baker,
    in 1981 in Engineering and Science in the Bell System,


    “Freedom of choice is of utmost importance to the research scientist, because
    research is an exploration of the unknown and there are no road maps to tell what
    course to take. Each discovery affects the future course of research and no one
    can predict or schedule discovery. Thus Bell Laboratories research managers have
    provided the maximum freedom to the research staff, consistent with the institutional
    purpose. Research people have been chosen for their creative abilities and are
    encouraged to exercise this to the fullest.”


    One of the best examples I ever saw of this nearly absolute freedom was the work
    that Ken Thompson and Joe Condon did on their chess computer. One day Bill Baker,
    president of Bell Labs, brought home some or other distinguished visitor to the
    Unix room, and Ken showed off Belle. The visitor asked why Bell Labs supported
    work on chess computer, since it didn''t seem to have anything to do with telephones.
    Bill Baker answered: Belle was an experiment in special-purpose computers, it
    had led to the development of new circuit design and implementation tools, and
    it gave Bell Labs visibility in another field. Ken didn''t have to do any justification
    whatsoever.


    The big secret to doing good research is to hire good people, make sure there
    are interesting things for them to work on, take a long view, and get out of the
    way. It certainly wasn''t perfect, but Bell Labs research generally did well.


    Of course computing didn''t exist in a technological vacuum. The invention of
    the transistor and then integrated circuits meant that for 50 years computing
    hardware kept getting smaller, faster and cheaper at an exponential rate. As hardware
    got better, became easier and our understanding of how to create it got better
    as well. Unix rode the technology improvement wave, as many other systems.


    As I said in the Preface, Unix was probably a singularity, a unique combination
    of circumstances that changed the computing world. I doubt that we will see anything
    like it again in operating systems, but there will surely be other occasions when
    a handful of talented people with good ideas and a supportive environment do change
    the world with their inventions.


    For me, Bell Labs and 1127 were a marvelous experience: a time and place with
    endless possibilities and a group of first-rate colleagues who made the most of
    them. Few are fortunate enough to have that kind of experience, the shared creation,
    of course, especially the friends and colleagues with whom it was shared.


    > “What we wanted to preserve was not just a good environment in which to do programming


    Dennis Ritchie, “The Evolution of the Unix Time-sharing System,” October 1984


    # Sources


    “The names of Ritchie and Thompson may safely be assumed to be attached to almost
    everything not otherwise attributed.”


    “To look further afield would require a tome, a report, and possibly a more dispassionate
    scholar, not an intimate participant,”


    Doug McIlroy, A Research Unix Reader: Annotated Excerpts from the Programmer’s
    Manual, 1971–1986, 1986


    Much history is online (though not always in a searchable form), thanks to some
    good luck and truly dedicated work by amateur and professional historians, such
    as the Unix Heritage Society and the Computer History Museum. Further material
    is available through interview videos and oral histories; some are contemporaneous
    like the various AT&T public relations efforts, and some are retrospective. This
    list of sources is in no way complete or comprehensive, but it will give readers
    who want to dig a further good start. Many of these documents can be found on
    the Internet.


    A History of Science and Engineering in the Bell System has seven volumes with
    nearly 5,000 pages written by members of technical staff at Bell, mostly in the
    1970s and 1980s. One volume deals with the relatively late advent of computing.


    Bell Labs maintains a sequence of short pages on the history of Unix at s3-us-west-2.amazonaws.com/belllabs-microsite-unixhistory.


    A. Michael Noll, a member of the Speech and Acoustics Research Center in the 1960s
    and early 1970s, has written a memoir of the time at the Labs, along with material
    from his role as the editor of the papers of Bill Baker; it can be found at null.uscannenberg.org
    along with a variety of other informative historical information. It is an excellent
    read for basic facts about the Labs and what it was like in the speech and acoustics
    research area. Mike’s memories about the collegiality and openness of Bell Labs
    generally accord with mine, though he feels things started to fall apart much
    sooner than I do, perhaps because we were in different (though organizationally
    adjacent) areas.


    Tom Van V maintains a thorough repository of historical information about Multics
    at multicians.org.


    The special issue of the Bell System Technical Journal on Unix in July 1978 had
    several fundamental papers, including an updated version of the CACM, Ken’s “Unix
    Implementation,” Dennis’s “Retrospective,” and a paper by Steve Bourne on the
    shell, along with a paper on PWB by Ted Dolotta, Dick Haight and John Mashey.


    The special issue of the AT&T Bell Labs Journal on Unix in 1984 includes Dennis’s
    “Evolution of Unix” paper, and “Data Abstraction in C” by Bjarne Stroustrup, among
    other interesting articles.


    Doug McIlroy’s A Research Reader is especially good for historical background;
    it can be found at genius.cat-v.org/doug-mcilroy.


    The Heritage Society, run by Warren Toomey with the help of volunteers, preserved
    versions of early Unix code and documentation; it is a great place to browse.
    For example, tuhs.com/Archive/Distributions/Research/Dennis_v1 has code for the
    First Edition as provided by Dennis Ritchie.

