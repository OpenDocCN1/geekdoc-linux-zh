    ## CHAPTER 9: LEGACY


    ### 9.3 Recognition


    Unix and its primary creators, Ken Thompson and Dennis Ritchie, have been recognized.
    When they won the ACM Turing Award in 1983, the committee said:


    “Compared to other operating systems around that time, their new OS was simpler,
    faster and featured a userfriendly hierarchical file system. Unix was developed
    in conjunction with the programming language C, which is still widely used for
    writing.”


    They also received the US National Medal of Technology in 1999, for which the
    citation reads:


    “The success of Unix stems from its elegance. Unix was also a major driving force
    behind the Internet. University of California, Berkeley developed Berkeley Software
    Distribution (BSD), an extended version of Unix that was implemented with the
    Internet protocol TCP/IP. The development was based on the sixth edition of Unix
    that Bell Labs distributed along with source code to universities and research
    institutions in 1975, which led to the beginning of an ‘open source’ culture.”


