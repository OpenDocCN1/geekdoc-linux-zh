    ## Chapter 9

    ## Legacy


    > “Unix was not only an improvement on its predecessors but also on all its successors,”


    Doug McIlroy, Remarks for Japan Prize award ceremony for Dennis Ritchie, May 2011,
    paraphrasing Tony Hoare on Algol


    Unix has been tremendously successful. As Unix or Linux or macOS or other variants,
    it runs on billions of computers, servers, by billions of people continuously,
    and has course made billions of dollars for any number of people who have built
    on top of it (though not for any of its creators). Later operating systems have
    been strongly shaped by its decisions.


    Languages and tools originally developed at Bell Labs for Unix are everywhere.
    Among the programming languages are C and C++, which are still the backbone of
    system programming and more specialized ones like Awk and AMPL. Core tools include
    the shell, diff, grep, Make and Yacc.


    GNU (a recursive acronym for “GNU’s not Unix”) is a large collection of software,
    based on Unix models, that is freely available in source code form for anyone
    to use: it makes almost everything from Unix available, along with much more.
    Coupled with the Linux operating system, GNU amounts to a free version of Unix.
    GNU implementations of Unix commands are open source, so they can be used and
    extended, subject only to the restriction that if implementations are distributed,
    they have to be made available to everyone for free; they can’t be private. A
    huge amount of today’s software development is based on open source and in many
    cases GNU implementations.


    What accounts for the success of Unix? Are there ideas or lessons that can be
    learned and applied in other settings? I think that the answer is yes, on at least
    two fronts: technical for some, and organizational as well.


    ### 9.1 Technical


    The important technical ideas from Unix have been discussed in the first few chapters
    of the book; this section is a brief summary. Not everything here originated with
    Unix, of course; part of the genius of Ken Thompson and Dennis Ritchie was their
    tasteful selection of good ideas, and their ability to see a general concept or
    a unifying theme that simplified software systems. People sometimes talk of software
    productivity in terms of the number of lines of code written; in the Unix world,
    productivity was often measured by the number of special cases or lines of code
    that were removed.


    The hierarchical file system was a major simplification of existing practice,
    in hindsight it seems utterly obvious—what else would you do? Rather than different
    types of files with properties managed by the operating system, and arbitrary
    limits on the depth to which files can be nested in directories, the Unix file
    system provides a straightforward view: starting from the root directory, each
    directory contains information about files, or directories that contain information
    about further files and directories. Filenames are simply the path from the root,
    with components separated by slashes.


    Files contain uninterpreted bytes; the system itself does not care what the bytes
    are, or know anything about their meaning.


    Files are created, read, written and removed with half a dozen system calls. A
    handful of bits define access controls that are adequate for most purposes. Entire
    storage devices like removable disks can be mounted on a file system that logically
    the contents become part of the file system at that point.


    Naturally, there are some irregularities. Devices appear in the file system, which
    is a simplification, but operations on them, especially terminals, have special
    cases and an interface that remains messy today.


    What I''ve described here is the logical structure of the file system. There are
    plenty of ways to implement this model, and in fact modern systems support a wide
    variety of implementations, all presenting the same interface but with different
    code and internal data structures to make it work. If you look at your computer,
    you will see multiple devices that use this model: the hard drive, USB thumb drives,
    SD cards, cameras, phones, and so on. The brilliance of Unix was in choosing an
    abstraction that was general enough to be remarkably useful, yet not too costly
    in performance.


    A high-level implementation language, for user programs of course, but also for
    the operating system itself. The idea was not new; it had been tried in Multics
    and a couple of earlier systems, but the time and the languages were not quite
    ready. C was much more suitable than its predecessors, and it led to portability
    of the operating system. Where once were proprietary operating systems from hardware
    manufacturers, often with their own proprietary languages, Unix became an open
    and widely understood standard and then a commodity; the system could be used
    on all computers with only minor changes. Customers were no longer locked in specific
    hardware, and manufacturers no longer had to develop their own operating systems
    or languages.


    The user-level programmable shell, with control-flow statements and I/O redirection,
    made it possible to program by using programs as building blocks. As the shell''s
    programming capabilities grew, it became another high-level language in the programmer''s
    toolbox. And because it was a user-level program, not part of the operating system,
    it could be improved and replaced by anyone with a better idea. The evolution
    from the original Unix through PWB, the Bourne shell and Bill Joy''s csh illustrates
    today''s proliferation, and of course some of the drawbacks—it''s all too easy
    for incompatible versions to multiply.


    Pipes are the quintessential Unix invention, an elegant and efficient way to use
    temporary connections of programs. The notion of streaming data through a sequence
    of processing steps is natural and intuitive, the syntax is exceptionally simple,
    and the pipe mechanism fits perfectly with the collection of small tools. Pipes
    do not solve all connection problems, of course, but the fully general non-linear
    connections of Doug McIlroy''s original concept do not show up often in practice;
    linear pipelines are almost always good enough.


    The notion of programs as tools and using them in composition is characteristic
    of Unix. Writing small programs that each do one thing well, rather large and
    monolithic programs that try to do many things, has many benefits. Certainly there
    are times when monoliths make sense, but there are strong advantages to small
    programs. In effect, this approach is modularization at the level of whole programs,
    parallel to modularization at the level of functions.


    Ordinary text is the standard format. The pervasive use of text turns out to be
    a great simplification. Programs read bytes, and if they are intended to process
    text, those bytes will be in a standard representation, generally lines of varying
    length, each terminated with a newline character. That doesn’t work for everything,
    but pretty anything can use that representation with little penalty in space or
    time. It''s interesting to speculate about how differently things might have turned
    out if Unix had been developed in a world with punch cards instead of Teletypes.
    Punch cards practically force a world-view that everything comes in 80-character
    chunks, with information often located in fixed fields.


    Programs that write programs is a powerful idea. Much of the progress that we
    have made in computing has been through mechanization—getting the computer to
    do more of the work for us. It’s hard to write programs by hand, so if you can
    get a program to write them for you, it’s a big win. It’s easier, and the generated
    programs are more likely to be correct.


    Compilers are of course an old example, but at a higher level, Yacc and Lex are
    excellent examples of generating code to create programming languages. Tools for
    automation and mechanization, like shell scripts and makefiles, are in effect
    programs that create programs. These tools are still used today, sometimes in
    the form of very large configuration scripts and makefile generators that accompany
    the source code distributions of languages using Python and compilers like GCC.


    Specialized languages, today often called little languages, domain-specific languages,
    or application-specific languages. We tell computers to do by using languages.
    For most programmers, that means general-purpose languages like C, but there are
    a host of more specialized languages that focus on narrower domains. The shell
    is a good example: it’s meant for running programs, and it’s very good at that,
    but you would not want to use it to write a browser or a video game. Specialization
    is an old idea, of course; the earliest high-level languages aimed at specific
    targets, like Fortran at scientific and engineering computation, and Cobol at
    business data processing. Languages that tried too early for too broad a range
    of applicability have sometimes failed; PL/I is an instance.


    Unix has a long tradition of special-purpose languages, well beyond the shell.
    The document preparation tools that are close to my heart are good examples, but
    so are calculators, circuit design languages, scripting.

    '
