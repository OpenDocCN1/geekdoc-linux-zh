    This lack of explicit management direction was standard practice. Projects in
    1967 were not assigned by management, but grew from the bottom-up, coalescing
    a group of people who were interested in a topic. The same was true for work with
    other parts of the Labs: if I was involved with some development group, I might
    try to entice research colleagues to join me, but they would be volunteers.


