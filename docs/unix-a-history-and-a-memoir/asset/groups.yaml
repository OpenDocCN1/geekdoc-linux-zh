    和 Lex 等工具是这一规则的极佳例子，Unix 也提供了许多其他例子。尝试编写编写程序的程序是值得的。正如 Doug McIlroy 所说：“任何你必须重复的事情都可能需要自动化。”


    # Make


    大多数大型程序由多个源文件组成，必须将它们编译并链接在一起以创建一个可执行程序。这通常可以通过单个命令如 `cc *.c` 来编译 C 程序的所有源文件，但在
    20 世纪 70 年代，计算机非常缓慢，在修改单个文件后重新编译多文件程序可能需要大量时间，是几分钟而不是几秒。重新编译已更改的文件并将结果与之前编译的其他文件链接起来效率更高。


    然而，记住哪些文件最近被编译过且需要重新编译是一件麻烦事，而且很容易出错。Steve Johnson 有一天在花费了几个小时徒劳的调试后，向 Stu Feldman
    抱怨了这件事（图 5.5），结果发现他只是忘记重新编译他所修改的其中一个文件了。


    巧的是，Stu 也遭遇了完全相同的问题，他一直在为了一个实际上正确但没有重新编译的程序进行调试而苦恼。他想出了一个优雅的想法：一种规范语言，用于描述程序部分之间如何相互依赖。他将其称为
    Make 的程序分析该规范，并根据文件更改的时间进行最少量的重新编译，使所有内容保持更新。第一个实现是在于 1976 年：


    “我在周末写了 Make，然后在下周末用宏重写了它（内置代码列表变得太长了）。我没有修复‘第一列制表符’的问题，因为我很快拥有了一批十多个人的忠实用户，我不想惹怒他们。”


    ![](img/07eb79c40271e71719affc2198867bf4_111_0.png)


    **图 5.5：** Stu Feldman，~1981（由 Gerard Holzmann 提供）


    Make 立即获得了成功，因为它在使编译尽可能高效的同时，消除了一整类低级错误。对于涉及比 C 编译更复杂处理的程序，它也是一个福音，例如使用 Yacc 和
    Lex 的程序，每个程序必须先运行以创建 C 文件，然后进行编译，如上面的图 5.4 所示。一个 Makefile 可以捕获编译新版本程序的所有的所有步骤，还可以描述如何执行相关任务，如运行
    Lint、制作备份和打印文档。Makefile 具有 shell 脚本的一些相同属性，但这种语言是声明性的：它是依赖关系和如何更新组件的规范，但没有对文件创建进行显式测试。Stu
