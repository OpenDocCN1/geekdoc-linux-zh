    with a set of Greek letters and special characters for mathematics. It printed
    on long rolls of photographic paper that had to be developed in a couple of baths
    of noxious and messy chemicals. This technology preceded laser printers, which
    did not become widely available for at least another 10 years. Furthermore, the
    output was black and white; inexpensive printing did not arrive until several
