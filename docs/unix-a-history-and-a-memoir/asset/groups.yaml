    ## CHAPTER 9: LEGACY


    languages, and the ubiquitous regular expressions. One of the reasons there were
    so many languages is the development of tools that enabled non-experts to create
    them. Yacc and Lex are the primary examples here, and they are specialized languages
    in their own right.


    Of course, not all languages needed to be high-tech to be useful. Steve Johnson
    built the first version of the *at* in an evening:


    > “Unix had a way of scheduling jobs to be run ‘out of hours’ so that long jobs
    wouldn’t interfere with people’ work (remember, there were a dozen or so people
    sharing the Unix machine). To cause a job later, you needed to edit a system file
    and fill in a table of information in a rather obscure format. I was attempting
    this one day and heard myself muttering ‘I want this job to run at 2AM.’ Suddenly,
    I realized that the information about what could be captured in a simple syntax:
    ‘at 2AM run_command.’ I hacked together a version in a couple of hours and advertised
    it in the ‘message of the day’ file the next morning.”


    The *at* command is still used 40-plus years later, with not many changes. Like
    a number of other languages, the syntax is a sort of stylized English based on
    how we say things aloud.


    The Unix philosophy, a style of programming, of how to approach a task, was summarized
    by Doug McIlroy in his foreword to the special issue of the Bell Labs Technical
    Journal on Unix, in July 1978:


    - (i) Make each program to do one thing well. To join a new job, build afresh
    rather than complicate old programs by adding new “features.”

    - (ii) Expect the output of every program to become the input to another, as yet
    unknown, program. Don’t clutter output with extraneous information. Avoid stringently
    columnar or binary input formats. Don’t insist on interactive input.

    - (iii) Design and build software, even operating systems, to be tried early,
    ideally within weeks. Don’t hesitate to throw away the clumsy parts and rebuild
    them.

    - (iv) Use tools in preference to unskilled help to lighten a programming task,
    even if you have to detour to build the tools and to throw some of them out after
    you’ve finished them.


    These are maxims to program by, though not always observed. One example: the *cat*
    command that I mentioned in Chapter 3. That command did one thing, copy input
    files or the standard input to the standard output.


    Today the GNU version of *cat* has (and I am not making this up) 12 options, for
    tasks like numbering lines, displaying non-printing characters, and removing duplicate
    blank lines. All of these are easily handled with existing programs; none has
    anything to do with the core task of copying bytes, and it seems counter-productive
    to complicate a fundamental tool.


    The Unix philosophy certainly does not solve all the problems of programming,
    but it provides a useful guide for approaching system design and implementation.


    ## 9.2 Organization


    I believe that another large component of the success of Unix was due to non-technical
    factors, like the managerial and organizational structure of Bell Labs, the social
    environment of 1927, and the flow of ideas across a group of talented people working
    on diverse problems in a collegial environment. These are harder to assess as
    technical notions, so this is necessarily a more subjective view. As with the
    previous section, most of these have been mentioned earlier.


    A stable environment is crucial: money, resources, mission, structure, management,
    culture—all should be consistent and predictable. As described in Chapter 1, Bell
    Labs research was a large operation inside a large development organization within
    a large corporation with a long history and a clear mission: universal service.
    The long-term Bell goal of continuously improving telephone service meant that
    researchers could explore ideas that they thought were important, for long periods,
    even years, without having to justify their efforts every few months. There was
    oversight, of course, and anyone who worked on a project for several years without
    producing something was encouraged to change something. Occasionally, someone
    was out of research or out of the company entirely, but in my 15 years in management,
    I remember only a handful of cases.


    Funding was assured, and working-level researchers did not have to think about
    money, nor did it concern me when I was a department head. Certainly at some level
    did we worry about such matters, but the people doing the research. There were
    no proposals, no quarterly progress reports, and no need to seek management approval
    before working on something. Somewhere in my time as department head, I did start
    to have to generate semi-annual reports on activities in my department, and for
    that I solicited a paragraph from each person. These were gathered for information
    only, however, not for evaluating performance, occasional periods when travel
    was scrutinized more carefully—we might be limited to one or two conferences a
    year, perhaps—but for the most part, if we needed to buy equipment or make a trip,
    money was available without much question.


    Problem-rich environment. As Dick Hamming said, if you don’t work on important
    problems, it’s unlikely that you’ll do important work. Almost any topic you had
    the potential to be important and relevant to AT&T’s mission. Computer science
    was a new field, with plenty of ideas to explore on both theoretical and practical
    fronts, and of the interplay between theory and practice was particularly fruitful.
    Language tools and regular expressions were good examples.


    Within AT&T, the use of computers was exploding, and Unix was a part of it. Our
    researchers were encouraged to publish in journals, to attend conferences, and
    to collaborate with the academic community. This was a fruitful source of talent,
    and it allowed us to keep up with the latest in the field. We also sent researchers
    to spend sabbaticals at numerous universities, which was a great way of recruiting
    and. and to to time time at universities. For example: Ken Thompson spent a year
    at Berkeley, Rob Pike spent a year at Stanford, Doug McIlroy spent a year at Oxford.
    We also used our researchers as recruiters, not professional career recruiters.
    Someone doing research of their own could have technical conversations with faculty
    and students, and would always learn something useful, and leave a positive impression
    of the company.


    Relationships with universities tended to be long term. I was the recruiter for
    Carnegie-Mellon at Pittsburgh for at least 15 years. Twice a year I spent days
    at CM, talking with computer science faculty about their research and with students
    who might be interested in working at Bell Labs. I made good friends in this way
    even if they didn''t join the Labs.


    Technical management. Management in Bell Labs research was technical all the way
    to the top, so they had a solid understanding of the work within their own and
    others. Department heads were expected to know what their people were doing in
    real detail, not for the purpose of arguing how great it was, but for being able
    to explain it to others and helping to make connections. At least in 1927 there
    were no turf wars; it was a cooperative and non-competitive environment where
    management supported the people, often collaborated, and never competed. I''m
    not sure that this was a universal

