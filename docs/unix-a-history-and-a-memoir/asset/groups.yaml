    In 1975, Michael Lesk (Figure 5.3) created a lexical analyzer generator called
    Lex, which is a direct parallel to Yacc. A Lex program consists of a sequence
    of patterns (regular expressions) that define the “lexical tokens” that are to
    be identified; for a programming language, these would be like reserved words,
    variable names, operators, punctuation, and so on. As with Yacc, a semantic action
    written in C can be attached to each'
