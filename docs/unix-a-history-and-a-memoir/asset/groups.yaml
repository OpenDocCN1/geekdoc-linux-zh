    Members of the Computing Science Research Center wrote an unusually large number
    of influential books during the 1970s and 1980s, well beyond what one might expect
    from an industrial research lab. As a result, after a while, Bell Labs became
    known as a source of authoritative books about computing and computer science.


    Al Acho wrote several widely used textbooks, including the famous 1977 “Dragon
    book” (Principles of Compiler Design, Figure 5.12) with Jeff Ullman, and Design
    and Analysis of Computer Algorithms with Jeff and John Hopcroft. Bjarne Stroustrup
    (Figure 5.13) created C++ in the early 1980s and wrote C++ books a few years later.
    Jon Bentley’s Programming Pearls grew out of his columns for Communications of
    the ACM. Mike Garey and David Johnson of the team used and Eq for their core book
    Computers and Intractability: A Guide to the Theory of NP-Completeness. We also
    published manuals for Unix, Plan 9, and so on. These publications became standard
    texts and references for a generation of programmers and computer scientists.


    How did this relatively small group of researchers from industry manage to produce
    so many influential books?


    I can see several reasons. First and foremost, people took writing seriously with
    their own writing, and they were critical readers of other people. Doug McIlroy
    was first among us group; no one matched Doug’s ability to spot errors (from tiny
    to crucial) no matter what the topic, nor had he for murky prose. I don’t think
    that I ever wrote anything at Bell Labs that I did not ask Doug to confirm on,
    and he always did. It was humbling when he shredded my words but it made me into
    a much better writer, and that happened to others as well.


    ![](img/07eb79c40271e71719affc2198867bf4_125_0.png)


    # Principles of Compiler Design


    **Figure 5.12:** Aho and Ullman Dragon book, first edition, 1977


    Of course Doug wasn’t the only critical reader. Everyone gave generously of their
    time; it was simply part of the culture that you provided detailed comments on
    what your colleagues wrote. This was unusual, and was one of the things that made
    the Labs a great place to be.


    Second, local management was supportive of book writing. Publication was important
    for maintaining Bell Labs’ reputation in the scientific and academic communities,
    and that included books. With managerial support, it was possible to devote full
    time to a book for six months, and concentrated effort was enough to basically
    finish a job that might take several years if it were a part-time or evening activity.
    And it gets better: although Bell Labs retained the copyrights on books, the authors
    got to keep the royalties. I doubt that any of us ever wrote a book explicitly
    to make money—no one at the Labs would be dumb enough to think that writing a
    technical book was lucrative—but if a book had some success, the authors kept
    the money.


    That enlightened management and company policy encouraged people to write, and
    in the long run it paid off for the company as well as for the authors. Publications
    by Labs authors were important for recruiting.


    ![](img/07eb79c40271e71719affc2198867bf4_126_0.png)


    # **Figure 5.13:** Bjarne Stroustrup, ~1984 (Courtesy of Bjarne Stroustrup)


    Bell Labs wasn’t some mysterious secret operation; students knew it as the place
    where their software was created and their textbooks were written. Potential new
    hires could see that good work was being done and it was published; they didn’t
    have to worry about disappearing into an “industrial” research lab. That put Bell
    Labs recruiting on an equal footing with universities, with the added advantage
    that people could research full time at the Labs, without the distractions of
    teaching, administration and raising money. This combination of great software
    and influential books was a big part of what made the Labs so successful at the
    time.


    A third factor is more technical: the symbiosis among C and Unix as a programming
    environment, document preparation as a research area, and writing about technical
    topics as a major activity. This began with text formatting programs like Doug
    McIlroy’s Hoff, Joe Ossanna’s Nroff and Troff, and then the preprocessors like
    Eq, Tbl, and so on. Those tools made it easier to produce documents that included
    more typographically challenging content, like mathematics, tables, figures, diagrams,
    and graphs. That in turn led to better writing, because all of these document
    preparation programs shared a vital characteristic: they made it to make multiple
    revisions of documents and always have a clean copy to work from, opposed to the
    slow and painful alternative of giving material to a typist and waiting days for
    it to come back.


    # CHAPTER 5: SEVENTH EDITION


    # 113


    It may sound trivial, I''m sure that the ability to make revisions so easily to
    better writing, because it pretty much eliminated the overhead of making an up
    to date copy, and it completely eliminated middlemen like types, editors and printers.
    Accuracy mattered for technical papers and for the Unix Programmer''s Manual,
    but control of the whole process especially mattered for books. For programming
    books, it was vital that the programs were typeset directly from the source code,
    so we could be sure that what was printed was correct, that hadn''t been inadvertently
    changed by human intervention.


    These tools were all written in C, of course, because it was expressive and efficient.
    It''s hard to remember today, perhaps, that efficiency in both time and space
    were crucial when machine capacities were expressed in kilobytes, not gigabytes.
    Every byte counted, and so at some level did every instruction, so a language
    economized on both was not just nice, but a practical necessity.


    All of this has come full circle—this book was produced by the descendants of
    these document preparation programs, though with the excellent fresh implementations
    and enhancements in Groff, Geqn, and so on, written by James Clark.


    # 5.4 Sed and Awk


    One of the major simplifications of the Unix file system was its uniform treatment
    of files as sequences of uninterpreted bytes. There were no records, no required
    or prohibited characters, and no internal structure imposed by the file system—just
    bytes.


    There was a similar simplification in the way that most Unix programs handled
    textual data. Text files were just sequences of bytes that happened to be characters
    in ASCII, the American Standard Code for Information Interchange. This uniform
    view of plain text was a natural fit for pipelines, and the Unix toolkit was full
    of programs that read text input, did something or to it, and wrote text output.
    I''ve already mentioned examples like word counting, comparison, sorting, transliteration,
    finding duplicates and of course the quintessential example, grep for searching.


    # Sed


    The success of grep inspired Lee McMahon to write an analog called sed that did
    simple substitutions on text it flowed through; "s" was the substitute command
    in ed. Lee soon replaced it by a generalization, a stream editor called Sed applied
    a sequence of editing commands to text on its way from input to output; grep and
    gres were both special cases of Sed. The commands that Sed uses are the same as
    the editing commands in the text editor. Sed is frequently used in shell scripts,
    transforming a stream of data in some way: replacing characters, or adding or
    removing unwanted spaces, or discarding something unwanted.


    Lee had an unusual background—a PhD in psychology from Harvard, and time in a
    Jesuit seminary preparing for the priesthood before switching to a more conventional
    path as a computer scientist. He was one of the first in group to think about
    processing text at scale, at too to store large amounts. I might add that "large"
    is relative. Lee''s particular interest in the early 1970s was the Federalist
    Papers, which altogether are only a megabyte.


    # Awk


    I was interested in tools that could process both numbers and text equally well.
    Neither grep or Sed could handle numeric data or do arithmetic, computations still
    required a C program. So I was looking for some kind of generalization. At the
    same time, Al Ho (Figure 5.14) had been experimenting with a richer class of regular
    expressions that grep supported, and written egrep ("extended grep"). Finally,
    Peter Weinberger, who long after transferred into 1127 and moved into the office
    between Al and me, was interested in data-bases.


    In the fall of 1977, the three of us talked about how to combine these ideas,
    taking some inspiration from RPG, IBM''s but inscrutable report generator, along
    with a new idea from Marc Rockkind that was described in the next chapter. Ultimately
    we designed a language that we called AWK (Awk from now on). As we said in the
    original description, naming a language after its authors shows a certain paucity
    of imagination. I don''t recall whether we thought about cognates related to "awkward,"
    or we found the name apt in a sardonic way, but in any case it stuck.


    An Awk program is a sequence of patterns and actions. Each line of input is tested
    against each pattern, the corresponding action is performed. Patterns can be regular
    expressions or numeric or string relations. Actions are written in a dialect of
    C. An omitted pattern matches all lines; an omitted action prints the matching
    line.

