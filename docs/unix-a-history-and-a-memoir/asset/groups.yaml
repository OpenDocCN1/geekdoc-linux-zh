    Chess games end with a win, loss or draw. The 50-move rule says that a player
    can claim a draw if there have been 50 moves without a capture or a pawn move;
    this prevents one player from just playing when there is no way to force a win.


    Ken explored the question of whether 50 moves is the right number. He used Belle
    and some sophisticated database organization to evaluate all four- and five-piece
    endgame and discovered that some were winable in more than 50 moves, given optimal
    play. By this time, Ken was well known in the chess world, and sometimes grandmasters
    would show up at the Labs to try their hand against Belle, particularly for endgames.
    I met world champions Anatoly Karpov and Vishy Anand just by being around the
    right weekends.


