    # CHAPTER 5: SEVENTH EDITION


    Yacc was instrumental in several of the languages that were developed in 1127
    over the years, some of which are described in the next few sections. Lorinda
    Cherry and I used it for the mathematical typesetting language Eq. I also used
    Yacc for the document preparation preprocessors Pic and Grap (the latter with
    Jon Bentley, Figure 5.2), for the AMPL modeling language, for at least one version
    of Ratford, and for other one-off languages over the years. Yacc was also used
    for the first Fortran 77 compiler f77, Bjarne Stroustrup’s C++ preprocessor cfront,
    the Awk scripting language (to be described shortly), and a variety of others.


    ![](img/07eb79c40271e71719affc2198867bf4_107_0.png)


    **Figure 5.2:** Jon Bentley, ~1981 (Courtesy of Gerard Holzmann)


    Yacc’s combination of advanced parsing technology, high efficiency and convenient
    user interface helped it to become the sole survivor among the early parser generators.
    Today it lives under its own name, in independent implementations like Bison that
    are derived from it, and in reimplementations in half a dozen other languages.


