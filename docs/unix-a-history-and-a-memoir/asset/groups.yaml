    From the Bell Labs perspective, 1968 was that although Multics was a good computing
    environment for the handful of people that it supported, it was not going to achieve
    its goal of being an information utility that would provide computing services
    for the Labs at any reasonable cost; it was just too expensive. Accordingly Bell
    Labs dropped out of the project in April 1969, leaving MIT and GE to soldier.


    Multics was eventually completed, or at least declared a success. It was supported
