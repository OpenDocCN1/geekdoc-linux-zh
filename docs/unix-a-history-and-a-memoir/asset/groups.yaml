    **图 1.3:** 2019 年的贝尔实验室；6 号楼位于左下角


    # 第 1 章：贝尔实验室


    服务。事实上，贝尔实验室的经费源于全美每通电话收取的微薄税费。根据 A·迈克尔·诺尔（A. Michael Noll）的一篇论文，AT&T 将其收入的 2.8%
    用于研发，其中约 0.3% 用于基础研究。我不确定这种运作的效果有多好，但几十年来，这种安排使电话系统不断改进，并取得了大量的基础科学发现。


    稳定的资金是研究的至关重要的因素。这意味着 AT&T 可以采取长远眼光，而贝尔实验室的研究人员有自由去探索那些可能没有短期回报、甚至永远不会回报的领域。这与当今的世界形成了对比，在今天，规划往往只只看到未来几个月，却花费了大量精力在投测下季度的财务结果上。


    ## 1.2 通信与计算机科学


    贝尔实验室自然是设计、建造和改进通信系统领域的先驱，这是一个通用术语，涵盖了从电话等消费级硬件的设计，到交换系统基础设施、微波传输塔和光纤电缆的所有内容。


    有时，这种广泛的实务关注会导致基础科学的进步。例如，1964 年，阿诺·彭齐亚斯（Arno Penzias）和罗伯特·威尔逊（Robert Wilson）试图弄清楚为什么贝尔实验室使用的天线在探测从回声（Echo）气卫星反射的无线信号时存在意外噪声。他们最终推断出这种噪声来自背景辐射，那是宇宙之初大爆炸的遗迹。这一发现让彭齐亚斯和威尔逊获得了
    1978 年的诺贝尔奖。（阿诺说：“大多数人是因为他们正在寻找的东西而获得诺贝尔奖。而我们是因为得到了我们试图摆脱掉的东西。”）


    贝尔实验室使命的另一部分是对通信系统工作原理建立深层的数学理解。最重要的成果是克劳德·香农（Claude Shannon）创立的信息论，这在部分源于他在二战期间对密码学的研究。他在
    1948 年发表于《贝尔系统技术期刊》的论文《通信的数学理论》，解释了通信系统可以传输多少信息的根本属性和局限性。香农从 20 世纪 40 年代初到 1956
    年都在马里希尔工作，随后回到了他曾读过的麻理工学院（MIT）。他在 2001 年去世，享 84 岁。


    随着计算机变得越来越强大且廉价，计算机的使用扩展到了更多的数据分析，以及对物理系统和过程的大量建模与仿真。贝尔实验室从 20 世纪 30 年代就开始涉及计算机和计算，并在
    50 年代末拥有了配备大型中央计算机的计算中心。


    20 世纪 60 年代初，通过从数学研究中分出一些人员，并结合在马里希尔操作大型中央计算机的一些员工形成了一个计算机科学研究小组。结果被称为计算研究中心，尽管在很短段时间内它仍为整个马里希尔提供计算机服务，但它属于研究部门，而非服务职能。1970
    年，管理计算机设施的小组被移到了一个独立的组织中。


    ## 1.3 BTL 的 BWK


    这一节包含了大量的个人历史，我希望这能让你们了解一些幸运的意外促使我选择了计算机作为职业，并让贝尔实验室成为我追求这一目标的无与伦比之地。


    我出生于多伦多，就读于多伦多大学。我当时在一个名为“工程物理”（后来更名为“工程科学”）的专业，这是一个针对那些并不知道自己想专注于什么方面的通才专业。我于
    1964 年毕业，那时正处于计算的早期：我在大学大三时才看到我的第一台计算机。全校只有一台大型计算机，是一台 IBM 7094，它当时几乎已经过时了。它拥有
    32K（32,768 字）36 位的磁芯存储器（今天我们会称之为 128K 字节），以及以大型机械磁盘驱动器形式存在的次级存储。它在当时花费了三万美元，呆在一个大型空调房间里，由专业操作员维护；普通人（尤其是学生）根本无法接触它。


    结果，我在本科期间几乎没有用过计算机，尽管我尝试过学习 Fortran 编程语言。对于任何挣扎着写第一个程序的人，我都能同情。我学习了丹尼尔·麦克肯（Daniel
    McCracken）关于 Fortran II 的优秀书籍并熟练掌握了所有规则，但我不知道如何写出那个第一个程序，这是许多人似乎都会遇到的概念障碍。


    在大学毕业年之前的夏天，我在多伦多的加拿大石油（Imperial Oil）获得了一份工作，加入了一个为炼油厂开发优化软件的小组。（加拿大石油由新泽西标准石油部分持有，后者在
    1972 年变成了埃克森石油）。


    回想起来，作为实习生的我薪水很高。我花了整个夏天试图编写一个巨大的 Cobol 程序来分析炼油厂数据。我不记得它的用途了，但我确定它从未运行成功。我当时并不真的懂如何编程，Cobol
    对良好的程序组织支持很小，而且结构化编程尚未发明，我的代码是一系列无止尽的 IF 语句，在某个我弄清楚了东西应该是什么样的地方进行分支。


    我还尝试过在加拿大石油的机器上运行 Fortran，因为我至少懂 Fortran，比我懂 Cobol 好，而且 Fortran 更适合数据分析。只有在与 IBM
    的作业控制语言（JCL）斗争了几个周后，我才推断出没有 Fortran 编译器


    在这个令人沮丧的夏天回到学校读大四时，我对计算机仍然感兴趣。当时没有正式的计算机科学课程，但我把毕业论文写成了人工智能，那是当时的热门话题。定理证明器、下国际象棋和跳棋的程序以及自然语言翻译似乎触手可及，只需要一点编程。


    1964 年毕业后，我不知道做什么，所以像很多学生一样申请了六所美国学校（这对当时的加拿大人来说并不常见），幸运地被几所学校录取，包括麻理工和普林顿。普林顿说完成博士学位的时间是三年，而麻理工说可能需要七年。普林顿提供奖学金；麻理工说我每周必须担任
    30 小时的研究助理。决定显而易见，我的好朋友艾霍（Ai Aho）在多伦多大学比我领先一年，已经在普林顿了，所以我去了那里。事实证明这是一个非常幸运的情况。


    1966 年，我再次走运，在麻理工获得了暑期实习，这归功于普林顿研究生李·范里（Lee Varian）在那里做得非常出色。我整个夏天都在 CTSS（兼容分时系统）中使用
    MAD（密歇根算法解码器，Algol 58 的变体）编写程序，为名为 Multics 的新操作系统构建工具，我们将在第二章讨论它。


    我在麻理工的名义老板是大家称呼 Corby 的费尔南多·巴博萨（Fernando Barbosa），一位极佳的绅士，CTSS 的创造者，也是 Multics
    的负责人。Corby 因他在分时系统方面的基础性工作获得了 1990 年的图灵奖。他于 2019 年 7 月去世，享 93 岁。


