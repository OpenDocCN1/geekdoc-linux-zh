    # CHAPTER 3: FIRST EDITION


    43


    Joe Ossanna came up with another plan. The patent department would use a PDP-11
    for preparing patent applications; the Unix group would use the necessary software
    for them, complete with a formatting program that would print applications in
    the proper format; and no, no one would be working on operating systems.


    This combination of ideas slalomed around any residual objections. Money for PDP-11
    came from Max Matthews, the director of the Speech and Acoustics Research Center.
    Max was supportive because one of his departments heads, Lee McMahon, was very
    interested in text processing and along with Ossanna as a promoter of the plan.


    The deal was approved, a PDP-11 was purchased, and Ken and Dennis quickly converted
    the PDP-7 version of Unix to run on. The PDP-11 was a limited machine, with only
    24K bytes of primary memory and a half-megabyte disk. The implementation used
    16K bytes for the operating system and the remaining 8K for user programs.


    Joe Ossanna wrote a program called Nroff (“new roff”), analogous to the existing
    Unix text formatter, that was able to print patent applications in the required
    format. By the last of 1971 typists were cranking patent applications on Unix
    full time. Chapter 5 had many to say about text formatting, since it was a major
    part of the Unix story in the 1970s.


    That was during the day. At night, Ken, Dennis, and others were developing software
    on the same PDP-11. Development had to be done at night so not to interfere with
    the typists, and they had to be careful. The PDP-11 had no hardware protection
    mechanisms to keep programs from interfering with each other or with the operating
    system, a careless mistake could easily crash the system, and an error in the
    file system could lose everyone’s work. But the experience was so successful that
    the patent department bought another PDP-11 for the Unix group, and made it possible
    to develop full time. This version became the first edition of Unix.


    Figure 3.1 is a 1972 public-relations picture of Ken Thompson and Dennis Ritchie
    using a PDP-11 running an early version of Unix. The computer itself is a specific
    model called PDP-11/20. The small objects at head level are DECTapes, which were
    magnetic tape devices that held 144K 18-bit words. Individual blocks could be
    read and written, so they could serve as temporary storage or reliable disks;
    the tapes themselves were removable, so they were used for backup as well.


    Ken is typing on a Model 32 Teletype, a sturdy but noisy device, basically a computer-controlled
    electromechanical typewriter that could only print in upper case, at 10 characters
    per second. The Model 33 dates from 1963 but earlier versions had been in widespread
    use until the early 1970s.'
