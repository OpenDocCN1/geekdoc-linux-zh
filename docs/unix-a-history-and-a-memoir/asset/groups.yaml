    (5) over 100 subsystems including a dozen languages.


    What were these features “seldom found in larger operating systems,” and what
    was their significance? The next few sections talk about some of them in more
    detail. If you''re not technically inclined, you can safely skim the chapter;
    I''ve tried to summarize the important parts of each section near the beginning
    so you can skip the details.


    #  4.1 File system


    The file system is the part of an operating system that manages information on
    secondary storage like disks, which for many years were sophisticated mechanical
    devices based on rotating magnetic media, and which today are most solid state
    disks and USB flash drives, integrated circuits that have no moving parts.


    We are familiar with the abstract view of this information storage programs like
    Explorer on Windows and Finder on macOS. Underneath those is a significant amount
    of software to manage the information on physical hardware, keep track of where
    each part is, control, make it efficiently accessible for reading and writing,
    and ensure that it’s always in a consistent state.


    Before Multics, most operating systems provided at best complicated and irregular
    file systems for storing information. The Multics file system was much more general,
    regular and powerful than other file systems of the time, but it was correspondingly
    complex. The Unix file system that Ken developed proficient from Multics, was
    significantly simpler. Its clean, elegant design has over the years became widely
    used and emulated.


    A file is a simple sequence of bytes. Any structure or organization of the contents
    of a file is determined only by the programs that process it; the file system
    itself doesn''t care what’s in a file. That means your program can read or write
    any file. This idea seems obvious in retrospect, but was not always appreciated
    in earlier systems, which sometimes imposed arbitrary restrictions on the format
    of information in files and how it could be processed by programs. Doug McIlroy
    describes one example:


    > “Typically source code was a distinguished type, different from data. Compilers
    could read source, compiled programs could read and write ‘data.’ Thus the creation
    and inspection of Fortran programs were often walled off from the creation and
    inspection of other files, with completely different ways to edit and print. This
    ruled out the use of programs to generate (or simply copy) Fortran programs.”'
