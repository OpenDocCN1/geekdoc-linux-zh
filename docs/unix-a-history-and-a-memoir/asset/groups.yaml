    这个第一个可识别的 Unix 系统版本运行在 1969 年中期到后期，因此说 Unix 诞生于那时是合理的。


    早期系统只有一小群用户：当然有 Ken 和 Dennis，还有 Doug McIlroy、Bob Morris、Joe Ossanna，由于一点运气，还有我。每个人都使用一个数字用户
    ID。其中一些 ID 对应于系统功能而非人类——根用户（root）或超级用户（super-user）的 ID 是 id，还有几个特殊情况。真实用户的 ID
    从 4 开始。我想 Dennis 是 5，Ken 是 6，而我是 9。在原始 Unix 系统上拥有单数字的用户 ID 似乎确实有某种荣誉感。


    ## 2.4 名字的意义何？


    有时在这些早期的日子里，新的 PDP-7 操作系统获得了一个名字，尽管细节仍然模糊。


    我记得当时站在办公室门口，与一群可能至少包括 Ken、Dennis 和 Peter Neumann 在内的人聊天。当时系统还没有名字，而且（如果记忆没出错的话）根据拉丁语词根建议，既然
    Multics 提供了“万物皆多”，而新系统每样最多只有一个，那么它应该被称为“UNICS”，这是用“uni”（单）代替“multi”（多）的文字游戏。


    另一种记忆是 Peter Neumann 想出了 UNICS 这个名字，代表“UNiplexed Information and Computing Service”（解复用信息与计算服务）。正如
    Peter 回忆道：


    我清楚地记得 Ken 有一天早上来吃午饭，一夜之间他为 Max Matthews 借给他的 PDP-7 写了一个上千行的单用户操作系统内核。我建议他应该把它变成多用户系统，果不其然，第二天他来吃午饭时已经又写了另一千行代码变成了多用户内核。正是这个单用户内核引发了“被阉割的
    Multics”这一 UNICS 的概念。”


    Peter 慷慨地表示他不记得更具体的细节了，因此，无论是否应得其实，我都获得了命名这个名字的功劳。


    无论如何，UNICS 以某种方式变异成了 Unix，这显然是一个更好的主意。（据传 AT&T 的律师不喜欢“Unix”，因为它和“eunuchs”（阉人）听起来相似。）Dennis
    Ritchie 随后将这个名字描述为“对 Multics 的一个带有某种险恶色彩的双关语”，这个描述确实恰得很传切。


    ## 2.5 传记：Ken Thompson


    2019 年，Ken 和我在新泽西州沃尔举办的老董计算机节（Vintage Computer Festival East）进行了一次非正式的“炉边谈话”。我的角色是问几个问题，然后坐下来听。这里的部分内容是根据该活动的转述，你可以在
    YouTube 上找到。


    Ken 出于 1943 年。他的父亲在美国海军服役，因此 Ken 的童年大部分时间都在世界各地度过，包括加州、路易斯安那州，以及在那勒斯的几年。


    他对电子产品感兴趣，并在伯克利大学学习电气工程。他说发现电子部分非常容易，因为在进入大学之前这已经是他十十年的爱好了。在伯克利，他发现了计算领域。


    > “痴迷计算机，我爱它们。那时，伯克利还没有计算机科学课程；它正在被发明中。


    毕业后的那个夏天，我一直在漂荡。[毕业]是一个惊喜，因为我不知道自己已经符合所有要求。


    我本只想留在大学里……我拥有那里。我的手指无处不在。大学里的那台大型计算机在午夜关闭，我会带钥匙进来打开它，在早上 8 点之前，它都是我的个人电脑。


    我很快乐。没有野心。我是一个工作狂，但没有目标。”


    在大学最后一年，Ken 旁听了 Elwyn Berlekamp 教授的课程，这位教授是伯克利的教授，后来去了贝尔实验室。毕业后的那个夏天，Ken 没有申请研究生，因为他觉得自己还不够好。


    “夏天结束时，[Berlekamp] 说：‘这是你的研究生课程。’他帮我申请了，我被录取了！”


    当 Ken 于 1966 年在伯克利获得硕士学位时，贝尔实验室有几家公司试图招募他，但他明确表示不想为公司工作。


    招聘人员一直在尝试。正如 Ken 所说：“我跳过了贝尔实验室的 6 或 8 次招聘尝试——再次，我没有野心。贝尔实验室的招聘人员来敲响我家里的门。我邀请他进屋；他的说法是我给他提供了生姜饼干和啤酒。”（这是某种加州饮食的一部分。）


    最后，Ken 同意在贝尔实验室的资助下前往新泽西，但只去一天，去拜访高中时期的朋友。当他到达贝尔实验室时，他看到的那些令他印象深刻：


    > “我做的第一件事就是走过计算机系的走廊，看门上的每一个名字。这太令人震惊了。我被两个人面试了……一个是 Shen Lin。


    那天结束后，我进了租来的车。他们向我展示了路线，在东海岸的第三站有一个提约。我接受了提约，开车从一个站开到另一个站，大概花了两个小时，期间一直在思考，当我到达下一个朋友家时，我给他们打电话说：好的。”


