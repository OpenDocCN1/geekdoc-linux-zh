    ## 8.4 Plan 9


    到20世纪80年代中后期，1127 的 Unix 研究正在放缓。广泛发行并作为大多数外部版本基础的第七版已于1979年发布。第八版于六年后的1985年出现，第九版于1986年出现，第十版（即最后一个研究版本）于1989年完成，尽管它并未向外分发。


    人们认为 Unix 是一个成熟的商业系统，不再是操作系统研究的合适载体。一小群——Ken Thompson、Rob Pike、Dave Presotto 和
    Howard Tricky——聚集在一起开发了一个全新的操作系统，他们根据1959年的科幻电影《外星比9号计划》（Plan 9 from Outer Space）将其命名为来自贝尔实验室的
    Plan 9。（电影《外星比9号计划》被誉为有史最糟糕的电影——诚然这是一场激烈的竞争——尽管有些电影觉得它坏到极点以一种扭曲的方式变得好看了）。


    Plan 9 操作系统试图吸收 Unix 中的优秀想法并将其进一步推向。例如，在 Unix 中，设备是文件系统中的文件。在 Plan 9 中，更多的数据源和汇点也是文件，包括进程、网络连接、窗口系统屏幕和
    shell 环境。Plan 9 从一开始就目标是可移植性，拥有单一源代码，可以为任何支持的架构进行编译。Plan 9 的另一个显著特性是它对分布式系统的支持。不同架构的不相关系统上的进程和文件可以协同工作，就像它们在同一个系统中一样。


    Plan 9 于1992年提供大学，并在几年后公开发供商业使用，但除了极少数爱好者社区外，它现在已不怎么使用。主要原因可能是 Unix 和日益增长的 Linux
    拥有如此动力，对于大多数人来说，没有足够的理由去切换系统。它没有流行的另一个较小原因可能是因为 Plan 9 的机制采取了某种“普罗克鲁斯式”（Procrustean）的方法，在很多情况下比
    Unix 的同等物更好，而且没有过多尝试提供兼容性。例如，Plan 9 起初并不提供标准 I/O 库 stdio，而是使用一个名为 bio 的新库。Bio
    比 stdio 更整洁、更规范，但由于没有标准库，将程序转换为同时在 Unix 和 Plan 9 上运行需要花费大量精力。同样，还有一个新版本的 Make
    Mk，它在许多方面更优，但它是不兼容的，因此现有的 Makefile 必须重写。


    虽然有转换机制，且 Howard Tricky（图 8.5）移植了 stdio 等许多关键库，但尽管如此，对于潜在用户（包括我在内）来说，这太费精力了。因此
    Plan 9 无法直接从 Unix 软件中获益，它的创新难以进入主流 Unix 世界。


    然而，Plan 9 为世界贡献了一个极其重要的东西：Unicode 的 UTF-8 编码。


    Unicode是一项持续的，为人类使用过的所有字符提供单一的标准编码。包括


    ![](img/07eb79c40271e71719affc2198867bf4_176_0.png)


    **图 8.5：** Howard Tricky，1981（由 Gerard Holzmann 提供）


    大多数西方语言的字母文字，也包括像中文这样的表意文字、像楔形字的古代文字、各种类型的特殊字符和符号，以及最近发明的表情符号。Unicode 最初是一个 16
    位字符集，足以容纳所有字母文字以及大约 30000 个中文字符。但在大多数计算机文本都是 ASCII（7位集）时，将世界转换为 16 位字符集是不行的。


    Ken Thompson 和 Rob Pike 为 Plan 9 苦恼于这个问题，因为他们已经决定 Plan 9 全面使用 Unicode 而非 ASCII。1992年9月，他们提出了
    UTF-8，一种 Unicode 的的变长编码。UTF-8 在空间和处理时间上都非常高效。它将每个 ASCII 字符表示为一个字节，并仅使用两个或三个字节。UTF-8
    紧凑且与 ASCII 兼容。


