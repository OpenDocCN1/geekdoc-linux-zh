    ## 3.4 A few words about memory


    Younger readers might wonder about the accuracy of some of the memory sizes that
    I have been quoting along the way. For instance, IBM 7090 or 7094 had 32K (32,768)
    36-bit words; the original PDP-7 that Ken Used had 8K (8,192) 18-bit words, that
    is, around one eighth of the 7090 memory; and the first PDP-11 had 24K bytes of
    primary memory and a half-megabyte disk. For comparison, my 2015 Macbook Air has
    8 GB of memory (over 330,000 times as much), a 500 GB disk (half a million times
    as much), and cost barely a thousand dollars.


    In short, memories were by today''s standards, where gigabytes of primary memory
    and terabytes of disk storage are cheap, compact and therefore common. Memory
    technology in the 1960s and early 1970s were different. The primary memory of
    a computer was built from arrays of tiny donut-shaped ferrite cores, connected
    with an intricate though ordered set of wires that were threaded by hand through
    the cores. Each core could be magnetized one way or the other (think clockwise
    or counterclockwise) and thus was capable of representing one bit of information;
    eight cores would be a byte.


    Core memory was very expensive, since manufacturing it took highly skilled manual
    labor, it was bulky, and it weighed a lot. Figure 3.12 shows a


