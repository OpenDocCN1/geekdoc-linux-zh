    personal experience) it was indescribably more pleasant than batch processing.
    Most of the time, it really felt like there were no other users.


    CTSS was such a productive programming environment that researchers at MIT decided
    to create an even better version, that could serve as an “information utility”
    to provide computing services to a large and dispersed user population. In 1965,
    they began to design a system called “Multics,” the Multiplexed Information and
    Computing Service.


    Multics was going to be a big job, since it involved ambitious new software, and
    new hardware with more capabilities than the IBM 7094, so MIT enrolled two other
    organizations to join. General Electric, which at the time made computers, was
    to design and build a new computer with new features to better support time-sharing
    and multiple users. Bell Labs, which had a great deal of experience from creating
    its own systems since the early 1950s, to collaborate on the operating system.


    Multics was intrinsically a challenging project, and it soon ran into problems.
    In retrospect, it was partly a victim of the *second system effect*: after a success
    (like CTSS), it''s tempting to try to create a new system that fixes all the remaining
    problems with the original while adding everybody''s favorite features too. The
    result is a system that''s too complicated, a consequence of taking on too many
    different features at the same time, and that was the case with Multics. The phrase
    “over-engineered” appears in several descriptions, and Sam Morgan described it
