    specified token. From these, Lex generates a C program that will read a stream
    of characters, identify the tokens it finds, and perform the associated semantic
    actions.


    Mike wrote the first version of Lex but it was quickly revised in the summer of
    1976 by an intern who had just graduated from Princeton. Mike recalls:


    > “Lex was rewritten almost immediately by Eric Schmidt as a summer student. I
    had written it with a non-deterministic analyzer that couldn’t handle rules with
    more than 16 states. Al Aho was frustrated and got me a summer student to fix
    it. He just happened to be unusual.”


    Eric went on a PhD at Berkeley, and was the CEO of Google from 2001 to 2011.


    Yacc and Lex work together. Each time Yacc needs the next token while parsing,
    it calls on Lex, which reads enough input to identify a complete token and passes
    that back to Yacc. The Yacc/Lex combination mechanizes the front-end components
    of a compiler while taking care of complicated grammatical and lexical constructs.
    For example, some programming languages have operators that are two or three characters
    long, like the operator in C. When the lexical analyzer sees a +, it has to look
