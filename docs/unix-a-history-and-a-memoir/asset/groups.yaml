    Many of the programs described in this chapter are preprocessors, that is, programs
    that convert some language into a suitable form for a subsequent process. Cfront,
    the original version of C++, would be more accurately described as an object-oriented
    preprocessor for C that evolved into C++. Sometimes, with C++, the preprocessor
    went away as functionality was absorbed into the downstream process. Most other
    times, however, the programs stayed separate, as the document preparation tools
    like Eqn and Thbl. Another example is bc, a preprocessor for dc, Bob Morris''s
    original unrivaled-precision calculator. Lorinda Cherry wrote bc to provide conventional
    infix arithmetic notation for dc, whose postfix notation was hard for novices
    to use casually.


    Preprocessors have many advantages. First, if one implements a language, it is
    not limited by syntax but can use a completely different style, with the various
    Troff preprocessors. Second, when memories were small, it was simply not possible
    to include more functionality in already large programs; this was especially the
    case with Troff. Finally, because the output of a preprocessor is available, it
    can be manipulated before passed on, to handle other kinds of processing. In the
    document preparation style, I''ve used Sed scripts and the like to fix characters
    and spacing. Chris Wyk and I wrote programs to do vertical justification of pages,
    by modifying the output of Troff before it went to a device driver. These would
    not have been possible if the functionality were embedded in a single program,
    or when the process is a pipeline, it is easy to add new stages at the front or
    back or middle.


    # Device-independent Troff


    Joe Ossanna died in 1977 at the age of 48. Part of his legacy was the source code
    for Troff, which at the time was nearly 10,000 lines of inscrutable C that Joe
    had hand-transliterated from its original assembly language—no comments, dozens
    of global variables with 2-letter names, and (see the discussion of memory above)
    a variety of subtle tricks for cramping as much information as possible into not
    enough memory. In Joe''s defense, this was absolutely necessary to pack all of
    Troff''s functionality into 65K bytes, the maximum memory that was available to
    user programs on PDP-11/45 that we were using at the time.


    I did nothing with the code for at least a year, but finally got enough courage
    to start fiddling with it. Slowly and cautiously, I began an upgrade. The biggest
    problem, aside from the fact that there were no comments'
