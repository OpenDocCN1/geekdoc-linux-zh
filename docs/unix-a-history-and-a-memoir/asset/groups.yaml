    efficient in both space and processing time. It represents each ASCII character
    as a single byte, and uses only two or three bytes for most characters, with a
    maximum of four bytes. The encoding is compact, and ASCII is legal UTF-8. UTF-8
    can be decoded as it is read, since no legal character is a prefix of any other
