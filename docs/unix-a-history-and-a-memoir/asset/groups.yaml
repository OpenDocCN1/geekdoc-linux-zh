    # 134 CHAPTER 6: BEYOND RESEARCH


    people working on the same code base, and it''s even more important today with
    larger code bases spread across much larger developer communities that are more
    geographically dispersed. There''s a clear evolutionary path from SCCS through
    RCS, CVS and Subversion, to Git, today''s default standard version-control system.


    Marc Rochkind also invented a tool that converted a set of regular expressions
    into a C program that would scan for occurrences of the patterns and print messages
    when one was found. This was such a neat idea that Al Aho, Peter Weinberger and
    I adapted and generalized it for the pattern-action model used in Awk.


    PWB also included a collection of tools called the Writer''s Workbench (WWB) that
    tried to help people write better. John Mashey and Dale Smith, with encouragement
    from Ted Dolotta, created a set of generic Troff commands, the Memorandum Macro
    or mm package, which was widely used both inside AT&T and outside for producing
    documentation.


    In addition, WWB offered a spell checker and programs for finding punctuation
    mistakes, split infinitives, and double words (often the result of errors while
    editing). There were tools for checking grammar and style, and for assessing readability.
    The core component was a program called parts, by Lorinda Cherry. It assigned
    parts of speech to the words of a text, and although imperfect, it yielded statistics
    on the frequency of adjectives, compound sentences, and the like. WWB was developed
    in the late 1970s, just about the time when computers were being more used by
    writers, and WWB got some good press, including an appearance on national TV on
    NBC''s Today show for two of its creators, Lorinda and Nina McDonald.


    As an example of how computing hardware has become cheaper and more powerful over
    the years, a 1978 PWB paper by Ted Dolotta and Massey described the development
    environment, which supported over a thousand users: "By measures, it is the largest
    Unix installation in the world." It ran on a network of 7 PDP-11s with a total
    of 3.3 megabytes of primary memory and 2 gigabytes of disk. That''s about one
    thousandth of a typical laptop of today. Would your laptop support a population
    of a million users?


    ## 6.2 University licenses


    In 1973, AT&T began licensing Unix to universities for a nominal fee, though most
    licenses were for the 6th edition, which became available in 1975. There were
    some commercial 6th edition licenses as well, but these cost $20,000, which would
    be more like $100,000 today. Licenses include all the source code, but came with
    no support whatsoever.


    One of the most active licensees was the University of California at Berkeley
    (UCB), where a number of graduate students made major contributions to the system
    that eventually became the Berkeley Software Distribution (BSD), one of two main
    branches that evolved from the original Unix Research.


    Ken Thompson spent a sabbatical year at Berkeley in 1975 and 1976, where he taught
    courses on operating systems. Bill Joy (Figure 6.2), a graduate student at the
    time, modified the local version of Unix, and added programs of him, including
    the vi text editor, which is still one of the most popular Unix editors, and the
    C shell csh. Bill later designed the TCP/IP networking interface for Unix that
    is still used. His socket interface made it possible to read and write network
    connections with the same read and write system calls as used for file and device
    I/O, so it was easy to add networking functionality.


    Bill occasionally visited Bell Labs during the mid to late 1970s. I remember one
    evening when he showed me the new text editor that he was working on. By this
    time, video display terminals had replaced paper terminals like Teletypes, and
    they enabled a more interactive style of editing.


    In ed and other editors of the time, they did not command that modified text being
    edited, but not continuously display the text; instead, if an editing command
    changed some text, it was necessary to explicitly print the new line. In ed, one
    might say


    ```

    s/this/that/p

    ```

    to substitute this in the current line and print the result. Other commands made
    it possible to change occurrences in multiple lines, for lines, ranges of lines,
    and so on. In the hands of experts, ed was very efficient, but not intuitive for
    newcomers.


    Bill''s editor used cursor addressing to update the screen as text was being edited.
    This was a major change from the line-at-a-time model: one moved the cursor to
    this (perhaps by using a regular expression), typed a command like cw ("change
    word"), and then typed that, which immediately replaced the original.


    I don''t recall what I said at the time about the editor itself (though today
    vi is one of the two editors I use most), but I remember telling Bill that he
    should stop fooling around editors and finish his PhD. Unfortunately for him and
    many others, he ignored my advice. A few years later, he dropped out of graduate
    school to co-found Sun Microsystems, one of the first workstation companies, with
    software based on Berkeley Unix, including his fundamental work on the system,
    networking and tools (and his vi editor). I often cite this story when students
    ask me for career advice—older is not always wiser.


    ![](img/07eb79c40271e71719affc2198867bf4_150_0.png)


    **Figure 6.2:** Bill Joy, ~1980 (Courtesy of Bill Joy)


    ## 6.3 User groups and Usenix


    Since AT&T offered no support at to Unix licensees, users were forced to band
    together to help each other, which eventually became regular meetings with technical
    presentations, software exchanges, and social activities. This idea was certainly
    not original with Unix; the first group meeting was held in New York in 1974,
    and user groups gradually sprang up all over the world.


    The SHARE group for IBM systems was established in 1955 and is still active, and
    there were user for other hardware manufacturers as well. In 1979, Ken and I attended
    the first meeting of the UKUG, which was held at the University of Kent in Canterbury.
    It was quite an experience for me, the first time I visited England. Ken and I
    flew to Gatwick Airport on Lake Airways, the first of the trans-Atlantic airlines.
    We drove to Salisbury and visited Stonehenge, then we went to Canterbury for the
    meeting (and to visit the cathedral). Afterwards I spent a few days in London
    as a wide-eyed tourist.


    I have sensed several countries, using group meetings as an excuse and a great
    way to meet some people. The most memorable was a trip to Australia in 1984, with
    Ken, where the meeting was held in the Sydney Opera House. I gave a talk on the
    morning of the first day, then spent the rest of the week watching the harbor
    from a window of the conference room; it was so fascinating I have no memory of
    any of the other talks.


    The user groups evolved into an umbrella organization called “User Groups,” which
