    ## 6.2 大学许可


    1973 年，AT&T 开始以廉价费用向大学授权 Unix 许可，尽管大多数许可是针对 1975 年发布的第 6 版。也有一些商业第 6 版许可，但这些许可花费
    20,000 美元，这相当于现在的 100,000 美元。许可包含所有源代码，但没有任何支持。


    最活跃的被授权者之一是加州大学伯克利分校（UCB），那里的许多研究生对该系统做出了重大贡献，该系统演变成了伯克利软件发行版（BSD），这是从原始 Unix
    研究演变出的两个主要分支之一。


    Ken Thompson 在 1975 年和 1976 年在伯克利度过了一个休学术年，在那里教授了操作系统课程。Bill Joy（见图 6.2）当时是一名研究生，他修改了本地版本的
    Unix，并添加了自己的程序，包括 vi 文本编辑器（它仍然仍然是最受欢迎的 Unix 编辑器之一）和 C shell csh。Bill 后来设计了仍在使用的
    Unix TCP/IP 网络接口。他的 socket 接口使得使用用于文件和设备 I/O 的相同 `read` 和 `write` 系统调用来读取和写入网络连接成为可能，因此添加网络功能变得非常容易。


    Bill 在 20 世纪 70 年代中后期偶尔访问贝尔实验室。我记得有一个晚上，他向我展示了他正在编写的新文本编辑器。此时，视频显示终端已经取代了像电打字机那样的纸终端，它们实现了更具交互性的编辑风格。


    在 ed 以及当时的其他编辑器中，它们并不会对正在编辑的修改后的文本进行不连续显示；相反，如果一个编辑命令更改了某些文本，就需要显式地打印新行。在 ed 中，人们可以说：


    ```

    s/this/that/p

    ```

    来替换当前行中的 this 并打印结果。其他命令使得更改多行、针对特定行、行范围等的出现情况成为可能。在专家手中，ed 是非常高效的，但对新手来说并不直观。


    Bill 的编辑器使用光标寻址在编辑文本时更新屏幕。这是对“逐行处理”模型的一项重大变化：人们将光标移动到这里（可能通过使用正则表达式），输入类似 `cw`（“更改单词”）的命令，然后输入该内容，这会立即替换原始内容。


    我不记得当时对编辑器本身说了什么（尽管今天 vi 是我最常用的两个编辑器之一），但我记得告诉 Bill 他应该停止玩弄编辑器并完成他的博士学位。对他和他许多人来说遗憾的是，他忽略了我的建议。几年后，他从研究生退学共同创立了
    Sun Microsystems，这是第一家工作站公司之一，拥有基于伯克利 Unix 的软件，包括他在系统、网络和工具方面的基础性工作（以及他的 vi 编辑器）。当学生向我寻求职业建议时，我经常引用这个故事——年长并不总是意味着智慧。


    ![](img/07eb79c40271e71719affc2198867bf4_150_0.png)


    **图 6.2:** Bill Joy，~1980（由 Bill Joy 提供）


    ## 6.3 用户组与 Usenix


    由于 AT&T 不向 Unix 许可者提供任何支持，用户被迫聚集在一起互相帮助，这最终变成了带有技术演示、软件交换和社交活动的定期会议。这种想法并非源于 Unix；第一次小组会议于
