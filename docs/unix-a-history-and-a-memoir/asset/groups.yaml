- md: '

    AT&T proposed instead to address the situation by splitting the company into one
    part (called AT&T) that would provide long distance telephony, and seven regional
    operating companies (“Baby Bells”) that would provide local phone service in their
    respective geographic areas. AT&T would retain Western Electric but the operating
    companies would no longer be required to buy equipment from it. AT&T would also
    keep Bell Labs.


    The consent decree with the Department of Justice, by which AT&T div itself of
    the operating companies, was finalized early in 1982, and took effect January
    1, 1984.


    Divestiture was an enormous upheaval, in the long run led to misfortune for AT&T,
    and 20 years of subsequent misjudgments and poor choices made Bell Labs into a
    shadow of what it had when its mission was clear and its funding was adequate
    and stable.


    In 1984, part of Bell Labs was spun off into a research organization called Bellcore
    (“Bell Communications Research”) that was to provide research services for the
    Baby Bells. The Bellcore split took a fair number of people from Bell Labs research,
    primarily in communications areas, but also some colleagues from 1127, including
    Mike Lek and Stu Feldman. At some point, the Baby Bells decided they didn’t need
    the kind of research that Bellcore provided, and Bellcore was purchased by another
    company, SAIC, renamed Teledia, and eventually wound up by the Swedish company
    Ericsson.


    1984 was also the year that “Bell Labs” became “AT&T Bell Laboratories,” since
    as part of the consent decree, AT&T was not permitted to use the name “Bell” except
    in this special case and only preceded by “AT&T.” We were strongly encouraged
    to use the full name at all times.


    ## 7.2 USL and SVR4


    After divestiture, AT&T’s inability or at least reluctance to sell Unix give way
    to a substantial commercial effort by a part of the company that was organizationally
    removed from Research. It was also somewhat removed physically, located in a building
    near Summit, New Jersey; surrounded by busy highways, which was informally known
    as “Freeway Island.” The organization was originally called the Unix Support Group
    (USG) and eventually became Unix System Laboratories, or USL. The first USG was
    created by Berk Tague in 1973, to focus on operations support systems. Over time,
    USG broadened its activities to include external services and marketing.


    There was definitely a market for Unix; one might even say that AT&T had inadvertently
    created the market by giving Unix away to students, who then wanted it they entered
    the real world and worked for companies that could afford to pay real money for
    it. Beginning in 1984 USL marketed Unix aggressively, and worked hard to make
    it a professional commercial product. The culmination was a version System V Release
    4, or SVR4. AT&T invested substantial resources to making this version standard,
    with reference implementations and careful definitions for both source and object
    compatibility. I think that this attention to standards and interoperability was
    important.


    The ins and outs of SVR4 evolved and AT&T’s interactions with cooperators and
    competitors became quite intricate and uninteresting. I’m not going to say anything
    about them, since in a way it’s all moot: the industry focus has shifted almost
    entirely to Linux. The Wikipedia article on System V summarizes the situation,
    accurately like this:


    > “Analysts generally characterize proprietary Unix as having entered a period
    of slow but permanent decline.”


    Of course the operative word is “proprietary"; open-source versions like the BSD
    family described in the next chapter are alive and well.


    AT&T’s product line included the operating system and a variety of supporting
    software, including compilers for C, C++, Fortran, and even Pascal, mostly based
    on Steve Johnson’s portable C compiler. There was also a major standardization
    effort to ensure compatibility for source code and binary formats in libraries.


    At this point I Bjarne Stroustrup’s department head, which meant frequent interactions
    with USL about the evolution of C++. For the most part, these were amicable, but
    there were occasions when the different priorities of research and product management
    were visible. One heated discussion with a USL manager in 1988 went something
    like this:


    Manager: “You have to fix all the bugs in the C++ compiler, but you can’t change
    the behavior in any way.”


    Me: “That’s not possible. By definition, if you fix a bug, the behavior is necessarily
    different.”


    Manager: “Brian, you don’t understand. You have to fix the bugs but the compiler’s
    behavior can’t change.”


    Pedantically I was right, but practically I can see what the manager was getting
    at—too much or rapid change is a serious problem for those who are doing software
    development with new languages and tools.


    USL set up a subsidiary in Japan called Unix Pacific, where the manager was Larry
    Crume, a Bell Labs colleague from years earlier and well known to many in the
    research group. This led to technical collaborations, I got to visit Japan twice
    on the company''s money. On one of these trips, some kind of feel-good exchange
    with NTT, Japan''s major telephone company, there was a strikingly clear view
    of the peaking order. The executive director got to play golf with his NTT counterpart.
    Lowly department heads like me were offered a shopping trip in Tokyo, which I
    declined with.


    Although AT&T''s efforts to commercialize Unix were not always successful, Unix
    standardization was invaluable for the whole community. There were occasional
    tensions between Research and the USL effort, but for the most part, USL had a
    large group of talented colleagues who made significant contributions to Unix
    and related software systems.


    ## 7.3 UNIX


    Sometimes early in the life of Unix, Bell Labs'' legal guardians decided that
    the name was a valuable trademark that had to be protected, to avoid the name
    become a generic term that could be used by anyone, as had happened to words like
    aspirin, escalator, zipper. In particular, it could not be used as a standalone
    noun (“Unix is an operating system”). It had to be identified as an upper-case
    adjective in the phrase “the UNIX operating system.” The klunky phrasing was a
    pain, especially for people who took their writing seriously, so there were workarounds
    and occasional attempts to evade the issue. For instance, in the standard Troff
    ms, Mike Leslie asked a formatting command that expanded into “UNIX” wherever
    it was used, and automatically generated a footnote on the first page where it
    appeared. Normally the footnote


    † UNIX is a trademark of Bell Laboratories.


    but if the command was used with an undocumented parameter, it would instead print


    † UNIX is a footnote of Bell Laboratories.


    I don''t think that anyone ever noticed this Easter egg, but the code is still
    there in the marco package. Other uses of the word Unix for goods and services
    had nothing to do with operating systems, like the pens in Figure 7.1, the briefcases
    in Figure 7.2, and the fire extinguisher in Figure 7.3. They all seemed to be
    outside the United States and thus beyond US trademark laws; the briefcases from
    1941, before Ken and Dennis were born. One other charming example is Unix baby
    diapers from a company called Drypers, which came up with “Unix” as a contraction
    of “unisex.”


    ![](img/07eb79c40271e71719affc219886bf4_161_0.png)


    Figure 7.1: Unix pens (Courtesy of Arnold Robbins)


    ## 7.4 Public relations


    There was always a steady flow of visitors to Bell Labs, and from the mid-1970s
    until well into the 1980s, a Unix presentation was a frequent stop for tourists.
    A small group of visitors would sit in a conference room while some member of
    the Center gave them a quick overview of what Unix was all about and why it was
    important to&T and the world. Mike Lesk and I probably did more of these demos
    than everyone put together, which may have reflected defects in our personalities,
    since we both complained but in fact enjoyed them.


    The visitors ranged from ordinary mortals to “distinguished,” a synonym for “influential”
