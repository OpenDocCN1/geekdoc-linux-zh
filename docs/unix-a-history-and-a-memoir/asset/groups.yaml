    This ostensibly based on a practical problem: how to assign parts of a program
    to memory pages such that when the program was run, the amount of swapping program
    pages into and out of memory would be minimized. The nodes represented blocks
    of code, the edges represented possible transitions from one block to another,
    and each edge could have a weight that measured the frequency of the transition
    and how costly it would be if the two blocks were in different pages.


    It was an artificial problem in a way, but it was a plausible abstraction of something
    real, and there were other concrete problems that shared this abstract model.
    For example, how components should be laid out on circuit boards to minimize the
    expensive wiring that connected one board to another? Less plausibly, how might
    we assign employees to floors of a building to keep people on the same floor as
    the people they talk to most often?


    This was enough justification for a PhD thesis topic, but I wasn''t making much
    progress. When I returned to the Labs for a second internship in the summer of
    1968, I described the problem to Shen Lin (Figure 1.8), who had recently developed
    the most effective known algorithm for the classic Salesman problem: given a set
    of cities, find the shortest route that visits each city exactly once, and returns
    to home.


    Shen came up with an approach for graph partitioning that looked promising, though
    there was no assurance that it would produce the best possible answers, and I
    figured out how to implement it efficiently. I experimented on a large number
    of graphs to assess how well the algorithm worked in practice. It seemed highly
    effective, but we never discovered a way to guarantee an optimum solution. I also
    found a couple of interesting special-case graphs where I could devise algorithms
    that were both fast and guaranteed to produce optimal solutions. The combination
    of results was enough for a thesis, and by the end of the summer I had everything
    needed. I wrote it over the fall, and had my final oral exam late in January 1969.
    (Princeton''s optimistic estimate of three years turned into four and a half.)


    A week later, I started work in the Computing Science Center at Bell Labs. I had
    an interview; the Labs sent me offer in the fall, though with a caveat: my thesis
    had to be finished. Sam Morgan, the director of the Center and my boss two levels
    up, told me, "We don''t hire PhDouts." Finishing the thesis was definitely a good
    thing; I got another letter in December saying I had received a substantial raise,
    before I reported for work!


    As an aside, Shen and I didn''t know it at the time, there was a reason why we
    were unable to find an efficient graph-partitioning algorithm that would always
    find the best possible answer. Others had puzzled over the inherent difficulty
    of combinatorial optimization problems like graph partitioning, and had discovered
    some general relationships.


    In a remarkable 1971 result, Stephen Cook, a mathematician and computer scientist
    at the University of Toronto, showed that many of these challenging problems,
    including graph partitioning, are equivalent, in the sense that if we could find
    an efficient algorithm (that is, better than trying all possible solutions) for
    one of them, would enable us to find efficient algorithms for all of them. It''s
    still an open problem in computer science whether such problems are truly hard,
    but the betting is that they are. Cook received the 1982 Turing Award for his
    work.


    When I got to Bell Labs as a permanent employee in 1969, no one told me what I
    should work on. This was standard practice: people were introduced to other people,
    encouraged to wander around, and left to find their own


