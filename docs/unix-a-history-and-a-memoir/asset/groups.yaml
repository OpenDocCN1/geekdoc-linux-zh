    \n值得注意的是，在这一时期，第六版 Unix 严格运行在 PDP-11 上；到 1979 年，第七版是一个可移植的操作系统，运行在四种不同的处理器上，其中\
    \ DEC VAX-11/780 最为流行。我将在下一章讨论更多关于移植性的内容，但现在重要的是，注意到 Unix 悄悄地从一个 PDP-11 系统演变为一个独立于特定硬件的系统。\n\
    \n## 5.1 Bourne shell\n\n第六版的 I/O 重定向和管道使得组合程序来完成某些任务变得简单，只需输入一系列命令，然后将它们收集到一个文件中——一个\
    \ shell 脚本——这样它们就可以作为一个单独命令运行。\n\n第六版有一个 `if` 语句用于条件条件执行命令，一个 `goto` 语句用于跳转到脚本文件的另一行，以及一种在脚本中标记行的方法（`:`\
    \ 命令，它无实际作用）以便进行跳转。总合在一起，这些可以被用来制作循环。在实践中，这些机制是笨拙且脆弱的。\n\n正如我在下一章中描述的，程序员工作站（PWB）小组的成员\
    \ John Mashey 在他的第六版版本中增加了许多功能，使其编程变得好得多：一个用于条件测试的 `if-then-else` 语句，一个用于循环的 `while`\
    \ 语句，以及用于在 shell 中存储信息的变量。\n\n1976 年，史伯恩（Steve Bourne）最近加入了实验室，他编写了一个新 shell，整合了\
    \ PWB 的功能，并进行了重大增强。其目标是保留现有 shell 的交互特性，同时也使其成为一种完全可编程的语言。他的 shell 提供了几种控制流结构，包括\
    \ `if-then-else`、`while`、`for` 和 `case`。它包含了变量，其中一些由 shell 自定义，另一些可以由用户定义。引用机制得到了增强。它还被修改为可以像其他程序一样作为过滤器。结果被称为\
    \ `sh`。\n\n新 shell 的控制流语法很奇特，因为它基于 Algol 68，Algol 68 使用反转词作为结束符，例如 `fi` 结束 `if`，`esac`\
    \ 结束 `case`。但由于 `od` 已经被占用（用于八进制导出），`do` 被 `done` 结束。\n\n# 第 5 章：第七版\n\n```\n\
    for i in $* 遍历所有参数\ndo\n    if grep something $i\n    then\n        echo found\
    \ something in $i\n    else\n        echo something not found in $i\n    fi\n\
    done\n```\n\n`if` 和 `while` 语句测试的条件是程序的返回状态，即程序可以用来报告其运行是否正常的数值值。那个时代的程序对返回敏感状态并不在乎，因为以前很少重要。Steve\
