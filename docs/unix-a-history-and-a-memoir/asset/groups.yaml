    # CHAPTER 6: BEYOND RESEARCH


    was getting weaker. Dennis hooked me into the portability effort with one sentence:
    ‘I think that it would be easier to move Unix to another piece of hardware than
    to rewrite an application to run under a different operating system.’ I was all
    in from that point on.


    Portability was a great step forward. Up to this point, operating systems had
    mostly been written in assembly language, and even if written in a high-level
    language they were more or less tied to a particular architecture. After projects
    those done by Miller, Johnson and Ritchie, porting Unix to other kinds of computers,
    though not trivial, was basically straightforward. This had major implications
    for the emerging workstation marketplace, where companies both old and new were
    building computers that were smaller and cheaper than minicomputers like the PDP-11
    and the Interdata, and used different processors.


    Workstations were meant to be personal machines for scientists and engineers,
    giving them a powerful and normally unshared computing environment. There were
    many examples of workstations, of the ones from Sun Microsystems were the most
    commercially successful. One manufacturers included Silicon Graphics, DEC, Hewlett-Packard,
    NeXt and even IBM. The first workstations, in the early 1980s, aimed for a megabyte
    of primary memory, a megapixel display, and speed of one megaflop (a million floating-point
    operations per second), so-called ‘3M’ machine. For comparison, my elderly Macbook
    has 8 gigabytes of memory and speed of at least a gigflop; its display is little
    than a megapixel, but the pixels are 24-bit color, not monochrome.


    The workstation marketplace arose because technological improvements made it possible
    to pack serious computing horsepower into a small physical package and sell it
    for a modest price. The complete system price could be reasonable in part because
    software, including the operating system, was already available. There was no
    need for new manufacturers to create a new operating system—it was enough to port
    Unix and its accompanying programs to whatever computer the used. The workstation
    market was thus helped significantly by the availability of Unix.


    The IBM Personal Computer (PC) first appeared in 1981. The PC and its many clones
    were typically 5 to 10 times cheaper than a workstation. Though they were originally
    not at all competitive in performance, they gradually improved, and by the end
    of the 1990s were as least good. Any distinction between workstation and PC eventually
    blurred. Today, depending on application areas, these machines most often run
    Microsoft Windows, macOS, or a Unix or Unix-like system.'
