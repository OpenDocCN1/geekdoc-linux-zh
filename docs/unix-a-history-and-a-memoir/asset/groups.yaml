    C 编程语言起源于 20 世纪 70 年代初。它基于 Dennis 为 Multics 实现使用高层语言的经验，但规模大大缩小了，因为当时大多数计算机的容量有限；根本没有足够的内存或处理能力来支持复杂语言的复杂编译器。这种强制性的最小化强化了
    Ken 和 Dennis 对简单、统一机制的偏好。C 语言也非常适合真实的计算机硬件；将其转换为高效运行良好代码非常清晰。


    ![](img/07eb79c40271e71719affc2198867bf4_71_0.png)


    **图 3.13：**Dennis Ritchie，~1981 年（由 Gerard Holzmann 提供）


    C 语言使得用高层语言编写整个操作系统成为可能。到 1973 年，Unix 已从原始的汇编语言转换为 C 语言。这使得维护和修改系统变得容易得多。它实现了另一个巨大的进步，将操作系统从原始的
    PDP-11 计算机迁移到其他架构的计算机。由于大部分系统代码都是用 C 语言编写的，系统只需要移植 C 编译器而不需要更多。


    Dennis 是一位卓越的技术作家，风格简洁优雅，措辞老练，并且经常流露出冷幽默，这种幽默准确地反映了他的性格。他和我共同编写了《C 程序语言》，该书于 1978
    年出版，1988 年出版了第二版，从那以后被翻译成20 多种语言。Dennis 的参考手册是 ANSI/ISO C 标准的基础，该标准于 1988 年首次产生，也是该书中的主要组成部分。无疑，C
    和 Unix 的某些成功可以归功于 Dennis 的写作。


    与 Ken Thompson 一起，Dennis 因在 C 和 Unix 上的工作获得了许多荣誉和奖项，包括 ACM 图灵奖（1983 年）、国家技术奖（1999
    年）、日本信息通信大奖（2011 年）以及国家发明家名人堂（2019 年死后授予）。


    Dennis 多年来成功地避开了任何管理角色，但最终还是妥协并成为了软件系统部门的负责人，负责构建 Plan 9 操作系统的小组。Dennis 于 2007
    年辞去管理职务并正式退休，但直到 2011 年 10 月去世前，他几乎每天都来贝尔实验室。


    Dennis 谦虚且慷慨，总是将功劳归于他人，而淡化自己的贡献。一个典型的例子出现在他 1996 年关于 Unix 演变的回顾致谢中：


    “读者如果将每个指代不明的‘我们’读作‘汤普森在我的某些帮助下完成’，那么通常不会错得大错。”


    Dennis 于 2011 年 10 月去世。他姐姐妹妹的这段文字可以在他的主页找到，该主页已保存在贝尔实验室的 www.bell-labs.com/usr/dmr/www。


    作为 Ritchie 的兄弟姐妹，我们为他的遗产感到自豪。Dennis 是一个用代码和善良改变世界的人。整个计算界的人都会怀念他。


