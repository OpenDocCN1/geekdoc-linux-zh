    # 171


    occasional periods when travel was scrutinized more carefully—we might be limited
    to one or two conferences a year, perhaps—but for the most part, if we needed
    to buy equipment or make a trip, money was available without much question.


    Problem-rich environment. As Dick Hamming said, if you don’t work on important
    problems, it’s unlikely that you’ll do important work. Almost any topic you had
    the potential to be important and relevant to AT&T’s mission. Computer science
    was a new field, with plenty of ideas to explore on both theoretical and practical
    fronts, and of the interplay between theory and practice was particularly fruitful.
    Language tools and regular expressions were good examples.


    Within AT&T, the use of computers was exploding, and Unix was a part of that,
    especially in systems for operations support, as seen with the Programmer’s Workbench.
    The mainline telephone business was changing too, as electro-mechanical telephone
    switches gave way to computer-controlled switching. Again, this was a source of
    interesting data and projects to work on, and often to contribute as. One downside:
    most of the switching work was done at very large development divisions in Indian
    Hill (Naperville, Illinois), so collaboration often required trips to Chicago.
    Distance is hard to overcome, and it is still an issue today. Even with excellent
    video conferencing, there is no substitute for having your collaborators near
    your door and of experts nearby.


    Bell scientists were also expected to be part of the academic research community,
    another source of research problems and insights, and to keep up with what was
    going on in other industrial research labs like Xerox PARC and IBM Watson. We
    attended the same conferences, published in the same journals, and often collaborated
    with academic colleagues, with sabbaticals in both directions. For example, I
    spent the fall of 1996 teaching at Harvard, with the full support of Bell Labs;
    even paid my salary, so Harvard got a freebie. The same was true in the academic
    year 1999–2000 at Princeton.


    In addition to internal courses, any number of colleagues taught at universities.
    It was easily arranged for nearby schools near Princeton, NYU, Columbia and West
    Point, and not much harder for extended visits to place further away: Ken Thompson
    spent a year at Berkeley, Rob Pike spent a year in Australia, Doug McIlroy spent
    a year at Oxford. External visibility was important for recruiting as well as
    for generally keeping up with the field. Secret companies had a harder time attracting
    talent, something that appears to be true today.'
