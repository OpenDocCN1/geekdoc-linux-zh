    # Sixth Edition (1975)


    “The number of Unix installations has grown to 10, with more expected.”

    The Unix Programmer’s Manual, 2nd Edition, June 1972


    “The number of Unix installations is now above 50, and many more are expected.”

    The Unix Programmer’s Manual, 5th Edition, June 1974


    The first edition of Unix was up and running by late 1971, if we go by the date
    on the manual. For the next few years, there was a new edition of the manual roughly
    every six months, each time with major new features, tools, and new languages.
    The 6th edition, whose manual was dated May 1975, was the first that found its
    way outside of Bell Labs to any significant degree, and it had a major effect
    on the world.


    Unix was first publicly described in a paper by Dennis Ritchie and Ken Thompson,
    “The Unix Time-Sharing System,” that appeared in the Fourth ACM Symposium on Operating
    Systems Principles in October 1973; it was republished with minor changes in the
    Communications of the Association for Computing Machinery (CACM) in July 1974.
    The abstract begins with a concise summary of a remarkable number of ideas:


    Unix is a general-purpose, multi-user, interactive operating system for the Digital
    Equipment Corporation PDP-11/40 and 45 computers. It offers a number of features
    found even in larger operating systems, including:


    +   (1) a hierarchical file system incorporating demountable volumes;

    (2) compatible file, device, and inter-process I/O;

    (3) the ability to initiate asynchronous processes;

    (4) system command language selectable on a per-user basis; and'
