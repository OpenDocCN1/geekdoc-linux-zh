    and removing duplicate blank lines. All of these are easily handled with

    existing programs; none has anything to do with the core task of copying

    bytes, and it seems counter-productive to complicate a fundamental tool.


    The Unix philosophy certainly does not solve all the problems of program-\ming,
    but it provides a useful guide for approaching system design and

    implementation.


    # 9.2 Organization


    I believe that another large component of the success of Unix was due to

    non-technical factors, like the managerial and organizational structure of Bell

    Labs, the social environment of 1127, and the flow of ideas across a group of

    talented people working on diverse problems in a collegial environment.

    These are harder to assess as technical notions, so this is necessarily a

    more subjective view. As with the previous section, most of these have been

    mentioned earlier.


    A stable environment is crucial: money, resources, mission, structure,

    management, culture—all should be consistent and predictable. As described

    in Chapter 1, Bell Labs research was a large operation inside a large develop-

    ment organization within a large corporation with a long history and a clear

    mission: universal service. The long-term Bell goal of continuously

    improving phone telephone service meant that researchers could explore ideas that

    they thought were important, for long periods, even years, without having to

    justify their efforts every few months. There was oversight, of course, and

    anyone who worked on a project for several years without producing-

    thing was encouraged to change something. Occasionally, someone

    was out of research or out of the company entirely, but in my 15 years

    in management, I remember only a handful of cases.


    Funding was assured, and working-level researchers did not have to think

    about money, nor did it concern me when I was a department head.

    Certainly at some level did we worry about such matters, but the

    people doing the research. There were no proposals, no quarterly

    progress reports, and no need to seek management approval before working

    on something. Somewhere in my time as department head, I did start to

    have to generate semi-annual reports on activities in my department, and for

    that I solicited a paragraph from each person. These were gathered for infor-\mation
    only, however, not for evaluating performance.'
