    “一周，又一周，我们有了 Unix。” 从任何衡量标准来看，这都是真正的软件生产力。


    在 Ken 和我从贝尔实验室（Bell Labs）退休后的一几年，我问起他关于他在三周内写出第一版本 Unix 的故事。以下是他的邮件回复原件，这与最近的某次采访完全一致：


    ```

    Date: Thu, 9 Jan 2003 13:51:56 -0800

    unix was a file system implementation to test thruput and the like. once implemented,
    it was hard to get data to it load up. i could put read/write calls in loops,
    but anything more sophisticated was near impossible. that was the state when bonnie
    went to visit my parents in san die.

    i decided that it was close to a time sharing system, just lacking an exec call,
    a shell, an editor, and an assembler. (no compilers) the exec call was trivial
    and the other 3 were done in 1-week exactly bonnie’s stay.

    the machine was 8k x 18 bits. 4k kernel and 4k swapped user.

