    and organized the contents of the manuals for the 8th through 10th editions of
    Unix. He did all of this with enthusiasm and care, at some cost to his own research.


    Doug stepped down from his management role in 1986 and retired from the Labs in
    1997, heading off to teach at Dartmouth. Figure 4.7 is a picture taken at Bell
    Labs in Murray Hill during a 2011 celebration of the Japan Prize awarded to Ken
