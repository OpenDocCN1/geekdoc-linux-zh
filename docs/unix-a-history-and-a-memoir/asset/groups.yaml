    Fortran 代码在不同计算机之间的可移植性。


    PORT 库是一项巨大的工程，最终在 1,500 个程序中包含 130,000 行 Fortran 代码和大量的文档。Barbara Ryder 和 Stu
    Feldman 开发了一个名为 PFORT 的 Fortran 编译器，用于检查 Fortran 代码是否是用 Fortran 的可移植子集编写。Norm
    Schryer 写了一个程序来检查计算机的算术运算，计算机在执行浮点运算的方式上往往差异很大。这尤为重要，因为这早于浮点行为标准的制定。


    Eric Grosse 和 Bill Coughran 开发了半导体建模与仿真、电路分析和可视化的算法，特别是针对半导体设计和制造。在贝尔实验室开发的许多数值软件分发在
    Netlib 数学软件存储库中，那里仍被科学计算社区广泛使用。其他数值分析师对 Netlib 和更大的社区做出了重大贡献，包括 Dave Gay、Linda
    Kaufman 和 Margaret Wright。


    ## AT&T 的 800 电话目录


    Eric 在软件分发方面的经验在一个有趣的无关项目中提供了大忙：1994 年，Eric、Lorinda Cherry 和我将 AT&T 的 800 电话目录放在了当时全新的互联网上。意图是让
    AT&T 获得提供真实互联网服务（以及互联网本身）的经验，也许是为了增加拨打 800 电话，甚至最终通过显示广告等增强服务产生收入。此外，我们希望通过提供具有真实价值的东西获得一些适度的公关收益，而像当时的许多互联网产品那样仅仅是预热。我们在
    1994 年 8 月获得了一份包含 157,000 条记录的数据库快照，大小约为 22 MB，并在几小时内就在本地计算机上运行，作为一个可搜索和浏览的网站。说服
    AT&T 管理层将其公开是一个缓慢得的过程。然而，在经过内部讨论后，管理顾虑和惯性最终屈服于 AT&T 的竞争对手 MCI 将提供某些服务的传言，该目录于
    1994 年 10 月 19 日公开。这是 AT&T 的第一个网页。


    政治上的延迟令人有些沮丧，但数据故事具有启发性。数据库中充斥着错误，许多没有人用批判性眼光看过的列表，例如辛辛那提的 9 种不同拼写。（它们可以作为正则表达式的一个很好的例子）。


