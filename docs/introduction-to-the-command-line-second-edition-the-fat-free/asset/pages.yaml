  md: "# cd\n\n**Purpose:** Change (navigate) directories.\n\n**Usage syntax:** `cd\
    \ [DIRECTORY]`\n\n```\n$ cd /etc\n$ pwd\n/etc\n```\n\nUsing the cd command to\
    \ navigate to the /etc directory\n\nThe `cd` command (short for Change Directories)\
    \ changes your location within the file system to the specified path. In the above\
    \ example, executing `cd /etc` makes `/etc` the new working directory.\n\nThe\
    \ `cd` command interprets directory paths relative to your current location unless\
    \ you manually specify a full path (such as `cd /etc` as used in the first example.)\
    \ The next example demonstrates using `cd` to change directories relative to the\
    \ current location.\n\n```\n$ pwd\n/home/nick\n$ cd documents\n$ pwd\n/home/nick/documents\n\
    ```\n\nUsing the cd command to navigate to a directory relative to the current\
    \ location\n\nIn this example, the starting directory is `/home/nick`. Typing\
    \ `cd documents` makes `/home/nick/documents` the new working directory. If you\
    \ were starting in a different location you would have to type the full path (i.e.\
    \ `cd /home/nick/documents`) to achieve the same results. Since the previous location\
    \ was `/home/nick`, typing the full path is not necessary.\n\n> Executing the\
    \ cd command with no options returns you to your home directory regardless of\
    \ your current location.\n\n+   Common usage examples:\n+   \n+   `cd [DIRECTORY]`\
    \ \n+   Navigate to the specified directory\n+   `cd` \n+   Navigate to the user's\
    \ home directory\n+   `cd -` \n+   Go back to the previous working directory\n\
    +   `cd ..` \n+   Navigate up one level in the directory tree"
