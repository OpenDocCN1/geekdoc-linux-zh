  md: '# diff


    **Purpose:** Compare files.


    **Usage syntax:** `diff [OPTIONS] [FILE]`


    ```

    $ diff ShoppingList.txt ShoppingList.old

    4c4

    < Tacos

    ---

    > Nachos

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_78_0.png)


    The `diff` command allows you to compare two text files line by line and display
    the differences between them. The `diff` command provides two types of output:


    +   1. Single column (default)

    +   2. Two column side-by-side comparison (activated with the `-y` option)


    In the above example the `diff` command displays the default single column output
    which only shows the differences between the two files. Indicators are used to
    mark the differing lines:


    +   * <  Indicates the text in the first file

    +   * >  Indicates the text in the second file


    The `-y` option can be used to display two column side-by-side output. The next
    example demonstrates the output generated with this option.


    ```

    $ diff -y ShoppingList.txt ShoppingList.old

    Milk            Milk

    Eggs            Eggs

    Cheese          Cheese

    Tacos           | Nachos

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_78_1.png)


    **Common usage examples:**

    | `diff [FILE1] [FILE2]` | Compare files and display differences |

    | `diff -y [FILE1] [FILE2]` | Compare files side by side |

    | `diff -i [FILE1] [FILE2]` | Ignore case when comparing files |'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# dos2unix / unix2dos


    Purpose: Convert file formats between Windows/MS-DOS and Unix/Linux systems.


    Usage syntax: dos2unix / unix2dos [OPTIONS] [FILE]


    ```

    $ cat ShoppingList.txt

    Milk^M

    Eggs^M

    Cheese^M

    Tacos

    $ dos2unix ShoppingList.txt

    $ cat ShoppingList.txt

    Milk

    Eggs

    Cheese

    Tacos

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_79_0.png)


    Text files created in Windows and MS-DOS are formatted with line feed characters
    that are not compatible with Unix/Linux systems. The dos2unix command reformats
    the specified file so that is will display properly on Unix/Linux systems. In
    the above example, the line feed characters in the ShoppingList.txt file are converted
    so they will display properly on Unix-based systems.


    Similar to the dos2unix command, unix2dos formats text files created on Unix/Linux
    systems so they can be displayed properly when transferred to Windows systems.


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_79_1.png)


    > Conversions are done directly to the specified file. Use the -b option to create
    a backup of the file before converting.


    Common usage examples:


    +   - dos2unix [FILE] : Convert a Windows text file to a Unix-formatted file

    +   - dos2unix -b [FILE] : Create a backup before converting

    +   - unix2dos [FILE] : Convert a Unix text file to a Windows-formatted file

    +   - unix2dos -b [FILE] : Create a backup before converting the file'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# ## Section 5:

    # Users, Groups, and Security


    **Overview**

    This chapter covers the most common commands related to users, groups, and security.
    It will also discuss topics like account creation/deletion, file and directory
    permissions, and other user/security related commands.


    **Commands covered in this section:**


    | Command | Purpose |

    | :--- | :--- |

    | `chmod` | Change file and directory permissions. |

    | `chown` | Change the owner of a file or directory. |

    | `chgrp` | Change the group of files and directories. |

    | `umask` | Display/set a user''s default file creation mask. |

    | `su` | Switch user accounts. |

    | `sudo` | Run a single command as a different user. |

    | `id` | Display information about a user''s identity. |

    | `groups` | Display which groups a user belongs to. |

    | `who` | Display who is logged into the system. |

    | `whoami` | Display the current user''s identity |

    | `w` | Display detailed information about users logged in to the system. |

    | `last`<br>`lastb` | Display the last successful/failed user logins. |

    | `lastlog` | Display the most recent user login information. |

    | `finger` | Display information a about user account. |

    | `passwd` | Change passwords. |

    | `useradd`<br>`userdel` | Create/delete user accounts. |

    | `adduser`<br>`deluser` | Create/delete user accounts on Linux systems. |

    | `groupadd`<br>`groupdel` | Add/remove a group. |


    (Continued...)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '| Command | Purpose |

    | :--- | :--- |

    | usermod | Modify user and group account settings. |

    | groupmod | |

    | wall | Broadcast a message to all users on the system. |

    | ulimit | Display/set system resource limits. |


    # Glossary of terms used in this section:


    **GID**

    (Group Identifier) A numerical value assigned to a group in the `/etc/group` file.


    **Group**

    A grouping of user accounts used to simplify security and access control.


    **Mode**

    Indicator of permissions for files and directories.


    **Octal Notation**

    A numerical value used to apply permissions to files and directories.


    **Permissions**

    Settings used to control access to a file or directory.


    **Profile**

    Collection of settings assigned to a user.


    **Symbolic Notation**

    A user friendly way to display or apply permissions to files and directories.


    **UID**

    (User Identifier) A numerical value assigned to a user account in the `/etc/passwd`
    file.


    **User Account**

    An account assigned to each person with login access to the local system.'
