- pgno: 82
  md: '# **Types of Accounts**


    There are several types of user accounts used on Unix, Linux, and BSD systems.
    The graphic below illustrates the user security model used on most systems.


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_82_0.png)


    By default, normal users and the programs they execute are given the least amount
    of privileges on the system. System accounts have slightly elevated privileges
    and are used to run system services (like a web server or FTP server). The root
    account has unrestricted administrative access to the entire system.


    # **Groups**


    Groups are used to simplify the management of system security. Users can be a
    member of one or more groups. All users are part of at least one group by default;
    this group is known as the user''s primary group.


    # **File and Directory Permissions**


    File and directory permissions are managed using a set of nine "flags". The following
    example describes permissions found on a typical file.


    | | r w x | r - x | r - x |

    |---|---|---|---|

    | | 1 | 2 | 3 | 4 | 5 | 6 | 7 | 8 | 9 |

    | File Type | User (Owner) | Group | Other (Everyone) |


    Within these nine flags, three sets of permissions are specified:


    +   - User (AKA owner) permissions

    +   - Group permissions

    +   - Other (i.e. everyone else)'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'There are four types of permissions that can be used to control access to a
    file or directory. The following table describes each permission.


    | Symbolic | Meaning |

    | :--- | :--- |

    | r | Read |

    | w | Write |

    | x | Execute |

    | - | No access |


    Example of directory permissions


    In most cases, the owner of a file will always have full read/write access to
    that file. Execute permission is a special flag used for programs, scripts, and
    directories to indicate they are executable.


    The example below displays basic file permissions.


    ```

    $ ls -l ShoppingList.txt

    -rw-r-- 1 nick users 254 2009-06-01 15:35 ShoppingList.txt

    ```


    Output of the ls -l command displaying file permissions


    | | User | Group | Other |

    | :--- | :--- | :--- | :--- |

    | Symbolic | rw- | r-- | r-- |

    | Meaning | Read & Write | Read only | Read only |


    Example of file permissions


    The next example demonstrates directory permissions. Directory permissions work
    the same as file permissions except they are used to control access to directories.


    ```

    $ ls -ld finance/

    drwxr-x-- 2 root finance 4096 2009-06-12 09:48 finance/

    ```


    Output of the ls -ld command displaying directory permissions


    | | User | Group | Other |

    | :--- | :--- | :--- | :--- |

    | Symbolic | rwx | r-x | --- |

    | Meaning | Read, Write, & Execute | Read only & Execute | No Access |


    Example of directory permissions


    Each file and directory has its own set of permissions. Permissions are not inherited
    from the parent directory. Additionally, directories require execute permission
    in order to be accessible, as shown in the previous example.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# # chmod


    **Purpose:** Change file and directory permissions.


    **Usage syntax:** `chmod [OPTIONS] [MODE] [DIRECTORY/FILE]`


    ```

    ```bash

    # chmod 664 ShoppingList.txt

    # ls -l ShoppingList.txt

    -rw-rw-r-- 1 root root 23 2009-05-27 22:31 ShoppingList.txt

    ```

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_84_0.png)


    The **chmod** command sets permissions on files and directories. By default, permissions
    are specified in numerical (octal) format such as 664 as shown in the above example.
    In octal form, three digits are used to represent owner, group, and everyone else’s
    permissions. The first number represents the owner’s permissions, the second number
    is the group’s permissions, and the third number is for everyone else.


    The table below provides a cross reference of symbolic and octal permissions.


    | **Permission** | **Symbolic** | **Octal** |

    | :---: | :---: | :---: |

    | **Read** | `r` | **4** |

    | **Write** | `w` | **2** |

    | **Execute** | `x` | **1** |

    | **None** | – | **0** |


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_84_1.png)


    The sum of the octal permissions becomes what is known as the *mode*. The valid
    modes are described in the following table.


    | **Mode** | **Octal** | **Symbolic** | **Effective Permission** |

    | :---: | :---: | :---: | :--- |

    | **7** | 4+2+1 | `rwx` | Read/Write/Execute |

    | **6** | 4+2 | `rw-` | Read/Write |

    | **5** | 4+1 | `r-x` | Read/Execute |

    | **4** | 4 | `r--` | Read |

    | **0** | 0 | `---` | None |


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_84_2.png)


    The combination of 3 modes determines the permissions for the file. A mode of
    664 would create `rw-rw-r--` permissions giving read/write access to the user
    and group, and read only to everyone else.


    (Continued...)'
  merge: -1
  img_proc: true
- pgno: 85
  md: "The concept of permissions on Unix, Linux, and BSD systems can be hard to grasp\
    \ as first. Several additional examples are provided below to help clarify this\
    \ topic.\n\n**Example 1**: A mode of 660 would provide read/write access to the\
    \ owner and group and no access to everyone else.\n\n```\n```\n# chmod 660 MyFile\n\
    # ls -l MyFile\n-rw-rw---- 1 root sales 23 2009-05-27 22:31 MyFile\nResult of\
    \ a 660 mode\n```\n```\n\n**Example 2**: A mode of 755 would provide full access\
    \ to the owner and read/execute access for the group and everyone else.\n\n```\n\
    ```\n# chmod 755 MyProgram.sh\n# ls -l MyProgram.sh\n-rwxr-xr-x 1 root sales 23\
    \ 2009-05-27 22:31 MyProgram.sh\nResult of a 755 mode\n```\n```\n\n**Example 3**:\
    \ A mode of 600 would provide read/write access to the owner and no access to\
    \ everyone else.\n\n```\n```\n# chmod 600 MyFile\n# ls -l MyFile\n-rw------- 1\
    \ root sales 23 2009-05-27 22:31 MyFile\nResult of a 600 mode\n```\n```\n\n**Example\
    \ 4**: A mode of 775 applied to a directory would provide read/write/execute access\
    \ to the owner and group and read only access to everyone else.\n\n```\n```\n\
    $ chmod 775 MyDirectory\n$ ls -ld test\ndrwxrwxr-x 2 root sales 4096 2009-05-27\
    \ 16:04 MyDirectory\nResult of a 775 mode applied to a directory\n```\n```\n\n\
    **Common usage examples:**\n\n+   - chmod [MODE] [FILE]\n+   \t- Change the permissions\
    \ on the specified file\n+   - chmod [MODE] -R [DIR]\n+   \t- Recursively change\
    \ the permissions on all files"
  merge: -1
  img_proc: true
- pgno: 86
  md: '# ## chown


    **Purpose:** Change the owner of a file or directory.


    ```

    ```

    Usage syntax: chown [OPTIONS] [USER:GROUP] [DIRECTORY/FILE]

    # ls -l ShoppingList.txt

    -rw-r--1 nick nick 23 2009-05-27 22:31 ShoppingList.txt

    # chown root ShoppingList.txt

    # ls -l ShoppingList.txt

    -rw-r--1 root nick 23 2009-05-27 22:31 ShoppingList.txt

    ```

    ```


    The **chown** command changes the owner of a file or directory. In the above example,
    the owner of the `ShoppingList.txt` file is changed from *nick* to **root**.


    The next example demonstrates changing both the owner and group of a file using
    the **chown** command.


    ```

    ```

    # ls -l ShoppingList.txt

    -rw-r--1 root nick 23 2009-05-27 22:31 ShoppingList.txt

    # chown nick:sales ShoppingList.txt

    # ls -l ShoppingList.txt

    -rw-r--1 nick sales 23 2009-05-27 22:31 ShoppingList.txt

    ```

    ```


    After executing the `chown nick:sales ShoppingList.txt` command, the `ShoppingList.txt`
    file is updated with the owner of *nick* and the group of *sales*.


    > **Tip** *You can use the* `**chgrp**` *command (discussed on* ***page 88***)
    *if you only need to change the group of a file*.


    **Common usage examples:**


    | Left column | Right column |

    | :--- | :--- |

    | `chown [USER] [FILE]` | Change the owner of a file |

    | `chown [USER]:[GROUP] [FILE]` | Change the owner and group of a file |

    | `chown -R [USER] [DIR]` | Recursively change the owner on all files in the specified
    directory |'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# chgrp


    Purpose: Change the group of files and directories.


    Usage syntax: chgrp [OPTIONS] [GROUP] [DIRECTORY/FILE]


    ```

    ```text

    # ls -l ShoppingList.txt

    -rw-r--r-- 1 root root  23 2009-05-27 22:31 ShoppingList.txt

    # chgrp sales ShoppingList.txt

    # ls -l ShoppingList.txt

    -rw-r--r-- 1 root sales 23 2009-05-27 22:31 ShoppingList.txt

    ```

    ```


    Using the chgrp command to change the group of a file


    The chgrp command changes the group of a file or directory. In the above example
    the chgrp command is used to change the group from root to sales on the ShoppingList.txt
    file.


    Common usage examples:

    | chgrp [GROUP] [FILE] | Change a file''s group to the specified group |

    | chgrp -R [DIR] | Recursively change the group on all files |'
  merge: -1
