  md: '# ## **fsck**


    **Purpose: Check and repair file systems.**


    **Usage syntax: `fsck [OPTIONS] [FILESYSTEM]`**


    ```

    ```

    # fsck -n /

    fsck 1.40.8 (13-Mar-2008)

    e2fsck 1.40.8 (13-Mar-2008)

    /dev/sdal contains a file system with errors, check forced.

    Pass 1: Checking inodes, blocks, and sizes

    Pass 2: Checking directory structure

    Pass 3: Checking directory connectivity

    Pass 4: Checking reference counts

    Pass 5: Checking group summary information

    ...

    ```


    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_183_0.png)


    `fsck` checks the specified file systems for errors and repairs them if necessary.
    In the above example, the `/` file system is checked for errors. The `-n` option
    is used to instruct `fsck` to check but not repair the specified file system.
    This is necessary since, in this case, the `/` file system is a live (mounted)
    file system and cannot be repaired unless first unmounted.


    > **Warning**

    > *The `fsck` command should never be used to repair a mounted file system as
    it will cause data corruption. In Linux, you can safely run `fsck` at the next
    reboot by typing `sudo touch /forcefsck` on the command line. Other systems may
    require booting recovery media in order to use `fsck`. See `man fsck` for more
    information about usage on your system.*


    **Common usage examples:**


    | `fsck [FILESYSTEM]` | Check and repair the specified file system |

    | `fsck -n [FILESYSTEM]` | Check the specified file system without repairing it
    |'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# badblocks


    Purpose: Check a disk drive for bad blocks.


    Usage syntax: badblocks [OPTIONS] [DEVICE]


    ```

    # badblocks -v /dev/sda

    Checking blocks 0 to 8388607

    Checking for bad blocks (read-only test): done

    Pass completed, 0 bad blocks found.

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_184_0.png)


    The badblocks command is a Linux utility used to search a disk drive for bad blocks.
    In the above example, the badblocks command is used to check /dev/sda for bad
    blocks. The -v option is included to display verbose status information during
    the scan.


    A disk drive that is healthy should have no bad blocks. If bad blocks are found,
    the drive should be replaced immediately to avoid data loss.


    > Warning The default badblocks test is read-only and generally safe to use on
    a live file system. Specifying the -w option will perform a read/write test and
    will destroy all data on the specified disk. It should only be used to test a
    disk that does not contain critical data, as it will be completely overwritten.


    +   **Common usage examples:**

    +   badblocks [DEVICE] - Check the specified device for bad blocks

    +   badblocks -v [DEVICE] - Display verbose messages when checking

    +   badblocks -w [DEVICE] - Perform a read/write test on the disk'
  merge: -1
  img_proc: true
