    \ above example shows the results of exiting the shell and returning to the login\
    \ prompt.\n\nShell scripts typically use the `exit` command to properly terminate\
    \ while users use the `logout` command to properly log out of a system. The exception\
    \ to this rule is when a terminal application is opened from within a graphical\
    \ environment on the local system. The `logout` command cannot be used in this\
    \ situation because terminal session is started as sub shell under the graphical\
    \ environment. Most systems will display an error in this case as shown in the\
    \ next example.\n\n```\n$ logout\n```\n\n```\nbash: logout: not login shell; use\
    \ \"exit\"\n```\n\nLogout error message\n\n> **Tip**\n> \n> CTRL + D is a keyboard\
