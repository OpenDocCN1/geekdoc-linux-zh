  md: "# mkswap\n\nPurpose: Create swap space storage.\n\nUsage syntax: mkswap [OPTIONS]\
    \ [DEVICE]\n\n```\n# mkswap /dev/sdb1\nSetting up swap space version 1, size =\
    \ 522076 KiB\nno label, UUID=cc35b16c-985f-4723-a5c4-e4dd2377aad\nCreating swap\
    \ storage using the mkswap command\n```\n\nThe **mkswap** command creates swap\
    \ space on Linux systems. Swap storage is used to store data in memory that is\
    \ rarely accessed. This frees up RAM for active programs. In the above example,\
    \ the **mkswap** command is used to create swap storage on the `/dev/sdb1` partition.\n\
    \n> **Tip**\n> \n> *Swap utilization has a significant impact on system performance.\
    \ If a system is utilizing swap space heavily, it should be upgraded with additional\
    \ memory to increase performance. Additionally, creating swap storage on its own\
    \ dedicated disk is a good practice that is used to prevent degraded performance.*\n\
    \n**mkswap** is a Linux command. Similar commands exist on other platforms and\
    \ are detailed in the following cross-reference table.\n\n| AIX | BSD | HP-UX\
    \ | Linux | Solaris |\n| :--- | :--- | :--- | :--- | :--- |\n| mkps | swaptcl\
    \ | lvcreate | mkswap | swap |\n\nSwap command cross reference\n\n+   Common usage\
    \ examples:\n+   * `mkswap [DEVICE]` Create swap space on the specified device\n\
    +   * `mkswap -c [DEVICE]` Check the device for bad blocks before formatting"
