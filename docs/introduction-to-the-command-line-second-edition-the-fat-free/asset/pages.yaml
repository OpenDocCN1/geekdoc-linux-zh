    \ and directories. In the above example, `MyFile` is copied to create the `MyFile.copy`\
    \ file.\n\nThe next example demonstrates using `cp -r` to recursively copy the\
    \ contents of a directory.\n\n```\n$ ls -l\ndrwxr-xr-x 2 root root 4096 Jul 1\
    \ 14:06 MyDocuments\n$ cp -r MyDocuments/ MyDocuments2/\n$ ls -l\ndrwxr-xr-x 2\
    \ root root 4096 Jul 1 14:06 MyDocuments\ndrwxr-xr-x 2 root root 4096 Jul 1 14:06\
    \ MyDocuments2\n```\n\nUsing the -r option with cp to recursively copy a directory\n\
    \nAfter executing the `cp -r` command an exact copy of the specified directory\
    \ is created.\n\n> **Warning**  \n> *The default behavior the cp command will\
    \ overwrite any existing file(s). The -i option overrides this behavior and prompts\
    \ the user before overwriting the destination file.*\n\nCommon usage examples:\n\
    \n+   - `cp [SOURCE] [DEST]`    Create a copy of the specified file\n+   - `cp\
    \ -r [SOURCE] [DEST]`  Recursively copy a directory\n+   - `cp -i [SOURCE] [DEST]`\
