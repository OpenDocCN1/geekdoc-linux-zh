- pgno: 50
  md: '# cksum


    **Purpose:** Display the checksum of a file.


    ```

    **Usage syntax:** cksum [OPTIONS] [FILE]

    $ cksum ubuntu.iso

    3212199805 730554368 ubuntu.iso

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_50_0.png)


    The `cksum` command displays the checksum of the specified file. It is typically
    used to verify the integrity of files transferred across a network connection.
    In the above example, the checksum for a downloaded Ubuntu Linux CD image is displayed.
    The resulting checksum can be compared to the checksum from the original file
    to ensure it arrived without errors.


    The table below describes the output fields of the `cksum` command.


