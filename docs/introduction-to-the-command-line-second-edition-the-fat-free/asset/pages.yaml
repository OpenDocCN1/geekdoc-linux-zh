  md: "# mount / umount\n\n**Purpose:** Mount local and remote file systems.\n\n**Usage\
    \ syntax:** `mount [OPTIONS] [SOURCE] [TARGET]`\n\n```\n# mount /dev/sbl /mnt/Seagate\n\
    Mounting a local file system\n```\n\nThe **mount** command mounts file systems.\
    \ In the above example, the device `/dev/sbl` is mounted under the `/mnt/Seagate`\
    \ directory. This is an example of mounting a local file system.\n\n> Local file\
    \ systems can be configured to mount automatically at boot using the /etc/fstab\
    \ file.\n\n**mount** can also be used to mount remote file systems via NFS, as\
    \ shown in the next example.\n\n```\n# mount 10.10.1.48:/home/nick /mnt/nick\n\
    Mounting an NFS file system\n```\n\nIn this example, `/home/nick` on the remote\
    \ machine (10.10.1.48) is shared via NFS and mounted locally in `/mnt/nick`.\n\
    \n> NFS must be properly configured on the remote system for this to work. NFS\
    \ settings are managed via the /etc/exports file.\n\nThe **umount** command unmounts\
    \ file systems as shown in the next example.\n\n**Usage syntax:** `umount [OPTIONS]\
    \ [DIRECTORY]`\n\n```\n# umount /mnt/Seagate\nUnmounting a file system\n```\n\n\
    +   **Common usage examples:**\n+   \n+   `mount`\n+   `mount [DEVICE] [DIR]`\n\
    +   `mount [IP]:[REMOTE] [LOCAL]`\n+   `umount [PATH]` |\n+   Display all mounted\
    \ file systems\n+   Mount the specified device\n+   Mount the specified NFS share\n\
    +   Unmount a file system"
  merge: -1
  img_proc: true
