    \ 2 10` displays interface statistics every two seconds for ten iterations.\n\n\
    **Note**  \nIf no arguments are specified, `iostat` will continuously display\
    \ network utilization until interrupted (by pressing **CTRL + C**).\n\n**Common\
    \ usage examples:**\n\n| `iostat` | Continuously display network utilization |\n\
    | --- | --- |\n| `iostat` `[DELAY]` | Update results at the specified interval\
    \ |\n| `iostat` `[DELAY]` `[COUNT]` | End after reaching the specified count |"
  merge: -1
