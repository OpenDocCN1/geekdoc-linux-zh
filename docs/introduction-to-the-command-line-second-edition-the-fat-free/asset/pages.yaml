  md: '# nano


    Purpose: Simple text editor.


    Usage syntax: `nano [OPTIONS] [FILE]`


    ```

    $ nano ShoppingList.txt

    GNU nano 2.0.9 File: /home/nick/ShoppingList.txt

    Milk

    Eggs

    Cheese

    Tacos

    ^G Get Help ^O WriteOut ^R Read File ^Y Prev Page ^K Cut Text ^C Cur Pos

    ^X Exit ^J Justify ^W Where Is ^V Next Page ^U UnCut Text ^T To Spell


    Editing a text file with nano

    ```


    **nano** is a simple editor found on most Linux and BSD systems. It is the recommended
    editor for new users. Nano’s functions such as searching, saving, and closing
    files are controlled using function keys. The basic functions are listed at the
    bottom of the **nano** screen. For example, pressing **CTRL + O** saves the changes
    to a file and **CTRL + X** exits the **nano** editor. Other functions are described
    in the following table.


    | Keys | Function | Keys | Function |

    | :--- | :--- | :--- | :--- |

    | **CTRL + O** | Save | **CTRL + X** | Exit |

    | **CTRL + G** | Help | **ESC + X** | Toggle menu display |

    | **Page Up** | Previous page | **Page Down** | Next Page |

    | **ESC + U** | Display word count | **CTRL + C** | Display current position |

    | **CTRL + K** | Cut current line | **ESC + 6** | Copy current line |

    | **CTRL + U** | Paste | **CTRL + \** | Find and replace |

    | **CTRL + W** | Search | **CTRL + -** | Go to line |

    | **CTRL + A** | Go to beginning of line | **CTRL + E** | Go to end of line |

    | **ESC + \** | Go to first line of the file | **ESC + /** | Go to last line of
    the file |


    Function keys for the nano editor


    > **Note** On some systems the `pico` editor may be used in place of `nano`.


    +   Common usage examples:

    +   `nano [FILE]` Open the specified file for editing

    +   `nano -v [FILE]` Open the specified file in read only mode'
