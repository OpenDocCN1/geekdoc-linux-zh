- pgno: 193
  md: '# **Purpose:** Create incremental backups.


    **Usage syntax:** `dump [OPTIONS] [OUTPUT] [INPUT]`


    ```

    # dump -0 -uf backup.dump /

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_193_0.png)


    dump is an archive utility that creates incremental backups. In the above example,
    the -0 option indicates a full backup of the / file system to a file called backup.dump.


    Subsequent incremental backups are specified as -1, -2, -3, etc. The subsequent
    backups will only archive files that have changed since the last full backup.
    This can save time and storage space when creating backups, but it will take longer
    to restore since the incremental backups must be restored in layers.


    > **Note** *Information about backed up files is stored in a file called dumpdates.
    On Unix systems, this file is usually found in /etc/dumpdates. Linux systems store
    this information in /var/lib/dumpdates.*


    +   Common usage examples:

    +   | dump -0 -uf [OUTPUT] [INPUT] | Create a full backup |

    +   | dump -[NUM] -uf [OUTPUT] [INPUT] | Create an incremental backup |'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# restore


    **Purpose:** Restore files from dump archives.


    **Usage syntax:** `restore [OPTIONS] [FILE]`


    ```

    # `restore -if backup.dump`

    `restore > pwd`

    `/`

    `restore > cd etc`

    `restore > add hosts`

    `restore > extract`

    `...`

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_194_0.png)


    The **restore** command restores files from archives created with the **dump**
    command. The above example demonstrates starting the interactive **restore** shell
    to extract files from a **dump** archive.


    The following table describes the basic **restore** shell commands.


    | **Command** | **Function** |

    | :--- | :--- |

    | `ls [PATH]` | List the contents of the current or specified directory |

    | `cd [PATH]` | Navigate the dump archive |

    | `pwd` | Display the current working directory |

    | `add [PATH]` | Add the current directory (or specified item) to the restore
    list |

    | `delete [PATH]` | Delete the current directory (or specified item) from the
    restore list |

    | `extract` | Extract all files on the restore list |

    | `help` | Display the help menu |

    | `quit` | Exit the restore shell |


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_194_1.png)


    +   **Common usage examples:**

    +   *   `restore -if [FILE]`    Open the specified archive in the restore shell

    +   *   `restore -rf [FILE]`    Restore an entire file system from a dump archive

    +   *   `restore -tf [FILE]`    List all items in the specified dump archive'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# dd


    Purpose: Create raw copies of data devices.


    Usage syntax: `dd if=[SOURCE] of=[TARGET] [OPTIONS]`


    ```

    ```

    # dd if=/dev/sdb of=/dev/sdc

    ```

    ```


    Creating a copy of a disk using the dd command


    The `dd` command performs raw (bit for bit) copies of data devices. The `if` parameter
    specifies the input file or device to be read. The `of` parameter specifies the
    output location. In the above example, the entire hard drive `/dev/sdb` is copied
    to `/dev/sdc`.


    `dd` can also be used to create image files of a disk. The next example demonstrates
    using `dd` to create an ISO image file from a CD-ROM.


    ```

    ```

    # dd if=/dev/cdrom of=/tmp/image.iso

    ```

    ```


    Converting a CD-ROM into an ISO file using the dd command


    > **Warning** The `dd` command is often referred to as the "data destroyer" because
    it can be very destructive if used incorrectly. Always use caution when experimenting
    with `dd`.


    +   Common usage examples:

    +   * `dd if=[SOURCE] of=[TARGET]` | Create a raw copy of the specified device'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# cpio


    **Purpose**: Create or extract cpio archives.


    **Usage syntax**: `[ INPUT ] | cpio [ OPTIONS ] > [ OUTPUT]`


    ```

    # cd /etc

    # ls | cpio -ov > /tmp/backup.cpio

    adduser.conf

    adjtime

    aliases

    alternatives

    ...

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_196_0.png)


    The `cpio` utility creates simple backups. In the above example, the `-ov` option
    creates a `cpio` backup of the `/etc` directory.


    The next example demonstrates restoring files from the `backup.cpio` archive using
    the `-idv` option.


    ```

    # cd /etc

    # cpio -idv < /tmp/backup.cpio

    adduser.conf

    adjtime

    aliases

    alternatives

    ...

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_196_1.png)


    > **Note** `cpio` is a legacy program that is rarely used for backup on modern
    systems. Use `tar` and `dump` in place of `cpio` as they offer a more complete
    and user-friendly backup solution.


    **Common usage examples:**


    +   - `ls | cpio -ov > backup.cpio` | Backup the specified item(s)

    +   - `cpio -idv < backup.cpio` | Restore the specified item(s)

    +   - `cpio --list < backup.cpio` | List all items in the specified archive'
  merge: -1
  img_proc: true
