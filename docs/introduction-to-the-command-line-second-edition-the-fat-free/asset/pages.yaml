  md: '# ## Section 3:

    ## Advanced Shell Features and Commands


    # ### Overview


    This chapter discusses advanced commands for Unix, Linux, and BSD systems. Advanced
    commands can be used to perform tasks such as copying, moving, renaming, and deleting
    files. It will also cover advanced shell features like auto completion, wildcards,
    pipes, and redirection.


    **Commands covered in this section:**


    | Command | Purpose |

    |---|---|

    | mv | Move or rename files and directories. |

    | cp | Copy files and directories. |

    | rm | Remove files. |

    | mkdir | Create/remove directories. |

    | rmdir | Create/remove directories. |

    | touch | Update time stamps on a file. |

    | lsof | List open files. |

    | fuser | Display information about open files. |

    | cksum | Display the checksum of a file. |

    | md5sum | Display the MD5 hash of a file. |

    | ln | Create links (shortcuts) to files or directories. |

    | alias | Create command line aliases. |

    | gzip | Compress/uncompress files. |

    | gunzip | Compress/uncompress files. |

    | split | Split large files into multiple pieces. |

    | shred | Securely erase files. |

    | watch | Periodically execute the specified command. |

    | env | Display environment variables. |'
