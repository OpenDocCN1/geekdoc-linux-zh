    The lpq command displays the status of queued print jobs. It is similar to the
    lpstat command except it provides more user-friendly output. Unlike the lpstat
    command, the lpq command only supports a limited number of command line options.


    In the above example, executing lpq -a displays all queued print jobs. The next
    example demonstrates using the -P option to display the status of a specific printer.


