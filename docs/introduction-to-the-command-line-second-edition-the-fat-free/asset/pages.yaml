- pgno: 48
  md: '# lsof


    Purpose: List open files.


    Usage syntax: lsof [OPTIONS] [NAME]


    ```

    # lsof /etc/hosts

    COMMAND  PID   USER  FD   TYPE  DEVICE  SIZE     NODE  NAME

    tail    12793  nick  3r   REG   8,1     256     1777676 /etc/hosts


    Using the lsof command to display information about an open file

    ```


    The **lsof** command displays information about open files. Executing the **lsof**
    command with no arguments will display all open files on the system. Specifying
    the name of an open file will display information about who is using the file.
    In the example above, **lsof** displays which user is using the `/etc/hosts` file
    along with other helpful information such as the command name and PID number.


    The `–u` option allows you to see all files open by the specified user as displayed
    in the next example.


    ```

    # lsof -u nick

    COMMAND  PID   USER  FD   TYPE  DEVICE  SIZE     NODE  NAME

    sshd     17899  nick  cwd  DIR   8,1     4096        2  /

    sshd     17899  nick  rtd  DIR   8,1     4096        2  /

    tail     12793  nick  3r   REG   8,1     256     1777676 /etc/hosts

    sshd     17899  nick  0u   CHR   1,3               5818 /dev/null

    sshd     17899  nick  1u   CHR   1,3               5818 /dev/null

    sshd     17899  nick  2u   CHR   1,3               5818 /dev/null

    ...


    Using the lsof command to display files opened by a specific user

    ```


    Common usage examples:


    +   * `lsof` | List all open files

    +   * `lsof [FILE]` | List information about a specific file

    +   * `lsof –u [USERNAME]` | List files open by the specified user

    +   * `lsof -P [PID]` | List open files by the specified PID number

    +   * `lsof -c [PROCESSNAME]` | List open files with the specified process name

    +   * `lsof -i` | List open network ports and sockets'
  merge: -1
  img_proc: true
