    Apr  4 07:52:44 kernel: [0.000000] Fast TSC calibration failed

    Apr  4 07:52:44 kernel: [1.587770] PM: Resume from disk failed.

    Apr  4 07:52:44 kernel: [6.252517] PM: Resume from disk failed.

    Apr 11 12:11:28 init: Unable to connect to the system bus: Failed to

    connect to socket /var/run/dbus/system_bus_socket: Connection refused

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_75_0.png)


    The `grep` command filters data from a file or command. In the above example,
    `grep` is used to filter the `/var/log/syslog` file and display matches that contain
    the word *failed*.


    > > **Tip**

    > Unix, Linux, and BSD systems are case sensitive. In the above example, the *-i*
    option is used to overcome this and perform a case insensititive search.


    The `grep` command can also be used to filter the output of a command. In the
    next example the output of the `dmesg` command (discussed on page 216) is piped
    to the `grep` command to only display results that contain the word *error*.


    ```

