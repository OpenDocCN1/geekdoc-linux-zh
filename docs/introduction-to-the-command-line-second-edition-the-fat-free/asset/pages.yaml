  md: "# # swapon / swapoff\n\nPurpose: Activate/deactivate swap space.\n\nUsage syntax:\
    \ swapon [OPTIONS] [DEVICE]\n\n```\n# swapon /dev/sdb1\n```\n\nActivating swap\
    \ storage\n\nThe swapon command activates swap storage. The above example demonstrates\
    \ activating a newly created swap space using swapon.\n\n> Note \n> Newly created\
    \ swap space does not become usable by the system until it is activated using\
    \ the swapon command. Most systems have at least one swap space that is activated\
    \ at boot by default. Additional swap devices created after installation must\
    \ be added to the /etc/fstab file to be automatically activated at boot.\n\nThe\
    \ swapoff command deactivates swap storage. The next example demonstrates using\
    \ swapoff to deactivate the /dev/sdb1 swap device.\n\nUsage syntax: swapoff [OPTIONS]\
    \ [DEVICE]\n\n```\n# swapoff /dev/sdb1\n```\n\nDeactivating swap storage\n\nSwap\
    \ storage must be deactivated with the swapoff command before it can be changed\
    \ or removed.\n\n> Note \n> Solaris systems use the swap command in place of swapon\
    \ and swapoff.\n\nCommon usage examples:\n\n+   * swapon -a\n+   * swapon [DEVICE]\n\
    +   * swapon -s\n+   * swapoff -a\n+   * swapoff [DEVICE]\n\n+   * Enable all\
    \ swap spaces\n+   * Enable the specified swap space\n+   * Display swap usage\
    \ by device\n+   * Disable all active swap spaces\n+   * Disable the specified\
    \ swap space"
