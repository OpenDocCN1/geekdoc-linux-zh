  md: '# whereis


    **Purpose:** Display the location of binary files, manual pages, and source code
    for the specified command.


    **Usage syntax:** whereis [OPTIONS] [COMMAND/FILE]


    ```

    $ whereis ls

    ls: /bin/ls /usr/share/man/man1/ls.1.gz

    Displaying the file locations of the ls program using whereis

    ```


    whereis displays the file locations for the specified command. In the above example,
    whereis displays the binary file and manual page location for the ls command.


    If the source code is available, whereis will also display the location of the
    source files for the specified command. Source code is not installed by default
    on most systems.


    The which command is similar to whereis except it only displays results for binary
    commands. This is useful when you only care to see the path to the binary file
    for the specified command. For example, typing which ls would display the location
    of binary file for the ls command. See man which for more information.


    Common usage examples:


    whereis [COMMAND] | Display the location of the specified command

    whereis -b [COMMAND] | Display binary programs only

    whereis -m [COMMAND] | Display manual pages only

    whereis -s [COMMAND] | Display source code only (if available)'
