    \ ^n: next pg ^p: prev pg\nSpace: toggle service on / off\n```\n\nExample output\
    \ of the `sysv-rc-conf` command\n\nThe `sysv-rc-conf` command manages `service/runlevel`\
    \ configuration on Linux systems. In the above example, executing `sysv-rc-conf`\
    \ starts a configuration utility which enables the user to select which services\
