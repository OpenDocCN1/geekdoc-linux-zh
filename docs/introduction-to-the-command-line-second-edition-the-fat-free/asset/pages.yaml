- pgno: 88
  md: '# umask


    **Purpose**: Display/set a user''s default file creation mask.


    **Usage syntax**: `umask [OPTIONS] [MODE]`


    ```

    ```bash

    $ umask

    022

    ```

    ```


    Displaying the current user''s umask


    **umask** controls a user''s default file creation mask. This determines the permissions
    that will be assigned to newly created files and directories. To determine the
    file/directory creation mode the umask value is subtracted from 777 for directories
    and 666 for files. For example, a umask of 022 would create effective permissions
    of 644 (rw-r-x--) for files and 755 (rwxr-xr-x) for directories.


    On some systems the **-S** option can be used to display a more user friendly
    symbolic output of the umask value, as shown in the next example.


    ```

    ```bash

    $ umask -S

    u=rwx, g=rx, o=rx

    ```

    ```


    Displaying the umask in symbolic notation


    The **umask** command can also be used to change the umask value as displayed
    in the next example.


    ```

    ```bash

    $ umask 077

    ```

    ```


    Setting the umask value


    In this example, a umask value of 077 would create effective permissions of 600
    (rw------) for files and 700 (rwx-----) for directories.


    > **Note**

    > A umask value specified on the command line is reset when you log out. To make
    the umask permanent you must add it to the `.profile` file in the user''s home
    directory or `/etc/profile` (for all users).


    Common usage examples:


    +   `umask`

    +   Display the umask in octal format

    +   `umask -S`

    +   Display the umask in symbolic format

    +   `umask [MODE]`

    +   Set the umask to the specified value'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# su


    **Purpose:** Switch user accounts.


    **Usage syntax:** `su [OPTIONS] [USER]`


    ```

    ```

    $ whoami

    nick

    $ su

    Password: ******

    # whoami

    root

    ```

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_89_0.png)


    The **su** command (short for **Switch User**) allows you to login as another
    user without having to first log out of the system. In the above example **su**
    is used by a normal user to switch to the root user account. Notice that when
    you become the root user your shell prompt changes from `\$` to `\#`. As the root
    user you can now run commands that require elevated privileges.


    > Tip

    > You should always limit the amount of time you spend logged in as the root user.
    This is a good practice that can help reduce accidents.


    By default, executing **su** with no arguments switches to the root user account.
    A user name can be specified with **su** to become a different user as shown in
    the next example.


    ```

    ```

    $ whoami

    nick

    $ su steve

    Password: ******

    $ whoami

    steve

    ```

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_89_1.png)


    **Common usage examples:**


    +   su

    +   |  |

    +   | :---- | :---- |

    +   | | Switch to the root user account |

    +   | su - | Switch to the root user account and load root''s profile |

    +   | su [USERNAME] | Switch to the specified username |'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# sudo


    Purpose: Run a single command as a different user.


    Usage syntax: sudo [OPTIONS] [COMMAND]


    ```

    ```

    $ whoami

    nick

    $ sudo whoami

    [sudo] password for nick: ******

    root

    $ whoami

    nick

    ```


    Using sudo to run a command as the root user

    ```


    The sudo command allows you to run a single command as another user. It is most
    commonly used to execute commands that require root privileges. In this example
    whoami is executed as root via the sudo command.


    Using the sudo command is the recommended way to run commands that require elevated
    privileges as it limits the amount of time spent with root privileges. This greatly
    helps prevent disasters such as accidental deletion of important system files.


    > **Note** *User (or group) accounts must be listed in the /etc/sudoers file in
    order to execute commands as root with sudo.*


    Common usage examples:


    +   * sudo [COMMAND] | Run the specified command as root

    +   * sudo -u [USER] [COMMAND] | Run a command as the specified user

    +   * sudo !! | Run the last command as root'
  merge: -1
  img_proc: true
