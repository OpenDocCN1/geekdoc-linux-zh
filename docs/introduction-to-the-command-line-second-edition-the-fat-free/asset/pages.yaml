- pgno: 227
  md: '# cancel


    **Purpose:** Cancel and delete queued print jobs.


    **Usage syntax:** cancel [OPTIONS] [JOBID]


    ```

    $ lpq -P HP-4350

    HP-4350 is not ready

    Rank Owner Job File(s) Total Size

    1st nick 6 hosts 1024 bytes

    2nd nick 7 hosts 1024 bytes

    3rd nick 8 hosts 1024 bytes

    4th nick 9 hosts 1024 bytes

    5th nick 10 hosts 1024 bytes

    $ cancel 10

    ```


    Using the cancel command to cancel an individual print job


    The cancel command deletes queued print jobs. In the above example, cancel 1 is
    used to remove an individual job by specifying the job''s ID number. The next
    example demonstrates using the -a parameter to remove all queued print jobs from
    the specified printer.


    ```

    $ lpq -P HP-4350

    HP-4350 is not ready

    Rank Owner Job File(s) Total Size

    1st nick 6 hosts 1024 bytes

    2nd nick 7 hosts 1024 bytes

    3rd nick 8 hosts 1024 bytes

    4th nick 9 hosts 1024 bytes

    $ cancel -a HP-4350

    $ lpq -P HP-4350

    HP-4350 is not ready

    no entries

    ```


    Using the cancel command to cancel all queued print jobs on a printer


    > **Note** Some UNIX systems may use the lp rm command in place of cancel.


    **Common usage examples:**


    +   cancel [JOB] Cancel the specified print job

    +   cancel -a Cancel all print jobs on all printers

    +   cancel -a [PRINTER] Cancel all jobs on the specified printer'
  merge: -1
