- pgno: 39
  md: '# Auto-Completion


    Most shells support command line completion. Command line completion is used to
    have the shell automatically complete commands or file paths. Command line completion
    is activated using the Tab key on most systems and shown in the following example.


    ```

    $ whe<TAB>

    $ whereis

    ```


    Using command line completion


    In the above example typing **whe** and pressing the **Tab** key automatically
    completes the command **whereis** without having to type the entire command.


    Auto-completion also works on file paths. Typing **ls -1 /etc/en** and pressing
    the **Tab** key would auto-complete to the file `/etc/environment` as shown in
    the next example.


    ```

    $ ls -1 /etc/en<TAB>

    $ ls -1 /etc/environment

    ```


    Command line completion of file names


    When more than one match is found, the shell will display all matching results.
    In the next example, typing **ls -1 /etc/host** and pressing **Tab** displays
    all matching files in the `/etc` directory.


    ```

    $ ls -1 /etc/host<TAB>

    host.conf   hostname    hosts      hosts.allow   hosts.deny

    ```


    Displaying multiple matches using file name completion


    **Tip** In addition to command line completion, some shells offer the ability
    to recall previously executed commands by using the **Up Arrow** key on the keyboard.'
  merge: -1
  img_proc: true
- pgno: 40
  md: "# Wildcards\n\nWildcards are used to pattern match one against one or more\
    \ text elements. They are helpful on the command line for performing bulk tasks\
    \ such as listing or removing groups of files. The table below lists the different\
    \ types of wildcards that can be used on the command line.\n\n| Wildcard | Function\
    \ |\n|---|---|\n| `*` | Matches 0 or more characters |\n| `?` | Matches 1 character\
    \ |\n| `[abc]` | Matches one of the characters listed |\n| `[a-c]` | Matches one\
    \ character in the range |\n| `[^abc]` | Matches any character not listed |\n\
    | `[^a-c]` | Matches any character not listed in the range |\n| `{tacos,nachos}`\
    \ | Matches one word in the list |\n\nThe asterisk ( `*` ) is the simplest and\
    \ most helpful wildcard. The example below demonstrates using the asterisk wildcard\
    \ to display all files that match a file name.\n\n```\n$ ls -1 /etc/host* \n-rw-r--r--\
    \ 1 root root 92 2008-12-23 12:53 /etc/host.conf\n-rw-r--r-- 1 root root 6 2009-04-23\
    \ 15:50 /etc/hostname\n-rw-r--r-- 1 root root 251 2009-05-22 14:55 /etc/hosts\n\
    -rw-r--r-- 1 root root 579 2009-04-20 09:14 /etc/hosts.allow\n-rw-r--r-- 1 root\
    \ root 878 2009-04-20 09:14 /etc/hosts.deny\n```\n\nTyping `ls -1 /etc/host*`\
    \ lists all the files in the `/etc` directory that start with the word `host`.\
    \ Other examples of wildcards are demonstrated below.\n\n```\n$ ls -1 /etc/hosts.{allow,deny}\n\
    -rw-r--r-- 1 root root 579 2009-04-20 09:14 /etc/hosts.allow\n-rw-r--r-- 1 root\
    \ root 878 2009-04-20 09:14 /etc/hosts.deny\n$ ls -1 /etc/hosts.[a]*\n-rw-r--r--\
    \ 1 root root 878 2009-04-20 09:14 /etc/hosts.deny\n$ ls -1 /etc/host?\n-rw-r--r--\
    \ 1 root root 251 2009-05-22 14:55 /etc/hosts\n```\n\nIn this example, the first\
    \ command uses `{allow,deny}` to display all matches that end with the word `allow`\
    \ or `deny`. The second command uses `[a]*` to display matches that do not begin\
    \ with the letter `a` (after the period). The third example uses the `?` wildcard\
    \ to match only a single character."
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Pipes


    Pipes (also referred to as pipelines) can be used to direct the output of one
    command to the input of another. Pipes are executed using the | key (usually located
    above the backslash key) on the keyboard.


    ```

    $ ls -l /etc | more

    total 968

    -rw-r--r- 1 root root    2975 2008-08-18 13:30 adduser.conf

    -rw-r--r- 1 root root      44 2010-04-06 16:59 adtime

    -rw-r-r--r 1 root root       53 2008-08-18 13:49 aliases

    -rw-r--r- 1 root root   12288 2009-08-28 13:39 aliases.db

    drwxr-x-x 2 root root     4096 2010-04-05 10:59 alternatives

    drwxr-x-x 7 root root     4096 2010-04-05 10:59 apache2

    drwxr-x-x 3 root root     4096 2010-08-18 13:48 apm

    drwxr-x-x 2 root root     4096 2009-08-28 13:39 apparmor

    drwxr-x-x 6 root root     4096 2008-08-18 13:47 apparmor.d

    drwxr-x-x 4 root root     4096 2010-01-25 13:44 apt

    -rw-r---- 1 root daemon     144 2009-02-20 07:41 at.deny

    -rw-r--r- 1 root root     1733 2008-05-12 13:33 bash.bashrc

    -rw-r--r- 1 root root   216529 2008-04-14 20:45 bash_completion

    drwxr-x-x 2 root root     4096 2010-04-05 10:59 bash_completion.d

    :

    ```


    Using pipes on the command line


    Using **ls -l** on the `/etc` directory would normally rapidly scroll the contents
    of the directory across the screen. Piping the output of **ls -l** to the **more**
    command (discussed on page 71) displays the contents of the `/etc` directory one
    page at a time.


    Another command commonly used with pipes is **grep** (discussed on page 76). The
    **grep** utility can be used to filter the output of a command or file and display
    matching results. The next example demonstrates piping the output of the **ls**
    command to **grep** to filter the results and display matches that contain the
    word **hosts**.


    ```

    $ ls -l /etc | grep host

    -rw-r-r- 1 root root      92 2007-10-20 06:51 host.conf

    -rw-r--r- 1 root root      9 2008-08-19 15:29 hostname

    -rw-r--r- 1 root root     300 2009-12-07 09:19 hosts

    -rw-r--r- 1 root root     579 2008-08-18 13:30 hosts.allow

    -rw-r--r- 1 root root     878 2008-08-18 13:30 hosts.deny

    ```


    Using a pipe with the grep command to filter a command''s output


    **Note**  *Pipes are extremely useful when working on the command line. From this
    point on they will be appearing frequently in examples.*'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Redirection


    The output of a command can be redirected to other locations such as a text file.
    Redirection is initiated by using the `>` character on the keyboard.


    ```

    ```

    $ date > date.txt

    $ ls -l date.txt

    -rw-r--r-- 1 nick nick 29 2009-06-10 11:37 date.txt

    ```

    ```


    Redirecting the output of the date command to a file


    In the above example, the `date` command''s output is redirected to a file called
    `date.txt` instead of being displayed on the screen. If the specified file does
    not exist it will automatically be created. If it does exist, it will be overwritten.
    To prevent overwriting a file you can use `>>` to append to the file as shown
    in the next example.


    ```

    ```

    $ date >> date.txt

    ```

    ```


    Appending the output of a command to a file


    There are two different types of output:


    +   1. Standard output (STDOUT)

    +   2. Error output (STDERR)


    STDOUT and STDERR can be selectively directed to specific files. This is useful
    when trying to capture error messages as demonstrated below.


    ```

    ```

    $ ls -l /NonExistantFile 1>ls.txt 2>lserror.txt

    $ ls -l ls*

    -rw-r--r-- 1 nick nick 61 2009-06-10 11:46 lserror.txt

    -rw-r--r-- 1 nick nick 0 2009-06-10 11:46 ls.txt

    ```

    ```


    Selectively redirecting STDOUT and STDERR


    In this example, `1>` represents `STDOUT` and `2>` is for `STDERR`. Since the
    requested file does not exist, an error message is logged in the `lserror.txt`
    file. All non-error output is saved in the `ls.txt` file.


    In addition to `STDOUT` and `STDERR` you can also redirect input from another
    location (such as a file) to a command. This is known as standard input or `STDIN`.
    The next example demonstrates using `STDIN` to feed the contents of a file to
    the `mail` command (discussed on page 163).


    ```

    ```

    $ mail grepnick@gmail.com < ShoppingList.txt

    ```

    ```


    Redirecting input from a file to a command'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# **mv**


    **Purpose:** Move or rename files and directories.


    **Usage syntax:** `mv [OPTIONS] [SOURCE] [DESTINATION]`


    ```

    ```

    $ ls -l

    -rw-r--r--  1 nick nick    55  2009-05-20 15:32 MyFile

    $ mv MyFile MyFile.old

    $ ls -l

    -rw-r--r--  1 nick nick    55  2009-05-20 15:32 MyFile.old


    Using the mv command to rename a file

    ```

    ```


    The `mv` command moves or renames files. In the above example, `MyFile` file is
    renamed to `MyFile.old` using the `mv` command. In the next example, `MyFile.old`
    is moved to the `/tmp` directory.


    ```

    ```

    $ mv MyFile.old /tmp/

    $ ls -l /tmp/

    -rw-r--r--  1 nick nick    55  2009-05-20 15:32 MyFile.old


    Moving a file to a different directory

    ```

    ```


    The `mv` command can also be used to move or rename directories. In the example
    below, the `NewFiles` directory is renamed to `OldFiles`.


    ```

    ```

    $ ls -ld NewFiles/

    drwxr-x  2 nick nick 4096  2009-06-28 13:23 NewFiles/

    $ mv NewFiles/ OldFiles/

    $ ls -ld OldFiles/

    drwxr-x  2 nick nick 4096  2009-06-28 13:23 OldFiles/


    Moving an entire directory

    ```

    ```


    > **Warning** The default behavior the `mv` command will overwrite any existing
    file(s). The `-i` option overrides this behavior and prompts the user before overwriting
    the destination file.


    +   **Common usage examples:**

    +   - `mv [SOURCE] [DEST]` Move a file or directory to the specified location

    +   - `mv -i [SOURCE] [DEST]` Prompt before overwriting the destination file

    +   - `mv -f [SOURCE] [DEST]` Force overwriting if the destination file exists'
  merge: -1
  img_proc: true
