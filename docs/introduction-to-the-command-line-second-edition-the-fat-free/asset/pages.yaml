  md: '# ln


    Purpose: Create links (shortcuts) to files or directories.


    Usage syntax: ln [OPTIONS] [TARGET] [LINK]


    ```

    $ ln -s TheSourceFile ThisIsTheLink

    $ ls -l

    -rw-r--r-- l nick nick 14 2009-05-23 10:16 TheSourceFile

    lrwxrwxwx l nick nick 13 2009-05-23 10:18 ThisIsTheLink -> TheSourceFile

    Creating a link to a file using the ln command

    ```


    The ln command creates links to files or directories. A link is the command line
    equivalent of a shortcut. In the above example, a link to a file called TheSourceFile
    is created. Notice the link in the above example has an l prefix in the permissions
    section. This indicates that the file is a link.


    The default operation of the ln command on most systems creates what is known
    as a hard link. Hard links have two major limitations:


    +   1. Hard links cannot refer to directories

    +   2. Hard links cannot span multiple file systems/disks


    Symbolic links are more commonly used today to overcome the shortfalls of hard
    links. They are created when using the -s option with the ln command. This is
    the recommended way to create a link as it will not suffer from the same limitations
    of a hard link.


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_52_0.png)


    Common usage examples:


    ln [SOURCE] [TARGET]    Create a hard link to the specified target

    ln -s [SOURCE] [TARGET]  Create a symbolic link to the specified target'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# alias


    Purpose: Create command line aliases.


    Usage syntax: `alias [OPTIONS] [COMMAND]`


    ```

    $ alias rm=''rm -i''

    $ rm TestFile

    rm: remove regular empty file ‘TestFile’? y

    Creating a command alias

    ```


    The alias command creates command line aliases. This allows you to abbreviate
    a long command string to something simple. In the above example, the `rm` command
    is aliased to be `rm -i` so that every time the `rm` command is executed the `-i`
    option is automatically included (without having to type it).


    Executing `alias` with no arguments will display all currently defined aliases,
    as demonstrated in the next example.


    ```

    $ alias

    alias cp=''cp -i''

    alias l=''ls -l''

    alias rm=''rm -i''

    Displaying all defined aliases

    ```


    > **Tip** Aliases are lost when you log out. The `unalias` command can be used
    to delete aliases without having to logoff. To make an alias permanent you must
    add it to `/etc/profile` or `.*profile` file in the user’s home directory.


    Common usage examples:


    +   * `alias` Display defined aliases

    +   * `alias [NAME]=[COMMAND]` Create an alias for the specified command'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# # gzip / gunzip


    **Purpose**: Compress/uncompress files.


    **Usage syntax**: `gzip [OPTIONS] [FILE]`


    ```

    # ls -lh BigFile

    -rw-r-- 1 root root 3.0M 2010-05-20 14:02 BigFile

    # gzip BigFile

    # ls -lh BigFile.gz

    -rw-r-- 1 root root 433K 2010-05-20 14:02 BigFile.gz

    Using gzip to compress a file

    ```


    `gzip` is a simple compression utility found on most Linux and BSD systems. In
    the above example `gzip` is used to reduce the size of the `BigFile` file by compressing
    it into a `.gz` archive.


    The `gunzip` (or `gzip -d`) command uncompresses `gzip` archives as demonstrated
    in the next example.


    **Usage syntax**: `gunzip [OPTIONS] [FILE]`


    ```

    $ gunzip BigFile.gz

    # ls -lh BigFile

    -rw-r-- 1 root root 3.0M 2010-05-20 14:02 BigFile

    Uncompressing a file with gunzip

    ```


    > On older Unix systems the `compress` and `uncompress` commands are used in place
    of `gzip` and `gunzip`. Compressed files on these systems will usually have a
    `.Z` file extension in place of `.gz`.


    +   Common usage examples:

    +   * `gzip [FILE]` | Compress the specified file

    +   * `gzip --fast [FILE]` | Compress the specified file using the fastest method

    +   * `gzip --best [FILE]` | Compress the file using the highest compression level

    +   * `gzip -tv [ARCHIVE]` | Test the specified archive for errors

    +   * `gzip -l [ARCHIVE]` | Display information about the specified archive file

    +   * `gunzip [ARCHIVE]` | Uncompress the specified archive

    +   * `gzip -d [ARCHIVE]` | Uncompress the specified archive'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# split


    **Purpose:** Split large files into multiple pieces.


    **Usage syntax:** `split [OPTIONS] [FILE] [OUTPUT]`


    ```

    $ ls -l ubuntu.iso

    -rw-r--r-- 1 nick nick 671686656 2009-10-27 12:07 ubuntu-9.10.iso

    $ split -d -b 100M ubuntu.iso ubuntu.iso.

    $ ls -lh ubuntu*

    -rw-r--r-- 1 nick nick 641M 2009-10-27 12:07 ubuntu-9.10.iso

    -rw-r--r-- 1 nick nick 100M 2010-04-11 11:44 ubuntu.iso.00

    -rw-r--r-- 1 nick nick 100M 2010-04-11 11:44 ubuntu.iso.01

    -rw-r--r-- 1 nick nick 100M 2010-04-11 11:44 ubuntu.iso.02

    -rw-r--r-- 1 nick nick 100M 2010-04-11 11:44 ubuntu.iso.03

    -rw-r--r-- 1 nick nick 100M 2010-04-11 11:44 ubuntu.iso.04

    -rw-r--r-- 1 nick nick 100M 2010-04-11 11:44 ubuntu.iso.05

    -rw-r--r-- 1 nick nick 41M 2010-04-11 11:44 ubuntu.iso.06


    Using the split command to split a large file into multiple pieces

    ```


    The `split` command splits large files into multiple pieces. The above example
    demonstrates splitting the large `ubuntu.iso` file into several 100MB pieces (as
    specified by the `-b 100M` parameter). In this example, the `split` command will
    create the required number of 100MB files with an incrementing extension.


    > The original file is left in place when creating split files.


    The `cat` command (discussed on page 68) can be used to rejoin the split files
    as demonstrated in the next example.


    ```

    $ cat ubuntu.iso.* > ubuntu-joined.iso

    $ ls -lh *.iso

    -rw-r--r-- 1 nick nick 641M 2009-10-27 12:07 ubuntu-9.10.iso

    -rw-r--r-- 1 nick nick 641M 2010-04-11 11:47 ubuntu-joined.iso


    Combining split files using the cat command

    ```


    > You can use the `cksum` or `md5sum` command to verify the joined file is the
    same as the original.


    **Common usage examples:**


    +   1.  `split -b [SIZE] [FILE] [OUTPUT]` — Split a file into multiple pieces

    +   2.  `split -d -b [SIZE] [FILE] [OUTPUT]` — Use numeric suffixes'
  merge: -1
