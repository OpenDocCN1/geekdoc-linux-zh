    The `startsrc` command starts services (known as SRCs or system resource controllers)
    on AIX systems. The above example demonstrates using the `startsrc` command to
    start the NFS service.


    The `stopsrc` command stops services on AIX systems. The next example demonstrates
    using `stopsrc` to stop the NFS service.


    **Usage syntax**: `startsrc [OPTIONS] [SERVICE/GROUP]`


    ```

    # stopsrc -s nfsd

    0513-044 The nfsd Subsystem was requested to stop.

    ```


