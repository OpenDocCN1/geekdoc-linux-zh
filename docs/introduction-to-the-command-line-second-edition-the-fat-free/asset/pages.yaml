  md: "# # sync\n\n**Purpose:** Flush file system buffers.\n\n**Usage syntax:** `sync`\n\
    \n```\n```bash\n# sync\n```\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_190_0.png)\n\
    \nThe `sync` command flushes the file system buffer. Unix, Linux, and BSD systems\
    \ pool disk activity to increase performance. When this happens, pending write\
    \ operations are buffered in memory and processed at an opportune time. The `sync`\
    \ command forces the buffer to flush, which completes all pending write operations.\n\
    \nWhile the `sync` command is rarely used, it can be helpful in situations where\
    \ the system must be rebooted in an abnormal manner, such as unplugging the system\
    \ or pressing the reset button. Executing `sync` before powering off a system\
    \ in this manner can help prevent file system corruption by ensuring all disk\
    \ buffers are completely flushed.\n\n> **Tip**  \n> *Executing the `sync` command\
    \ twice is a common practice to ensure all file system buffers have been flushed.\
    \ The can be done with one command by executing `sync;sync` on the command line.*\n\
    \n+   - **Common usage examples:**\n+     - `sync` : Flush the file system buffer\n\
    +     - `sync ; sync` : Really flush the file system buffer"
  merge: -1
  img_proc: true
- pgno: 191
  md: '# # Section 11:

    # Backup and Restore Commands


    **Overview**


    This section covers utilities used to backup and restore files. Creating a good
    backup is very important for recovering from system failure or natural disaster.
    Most systems have a number of built-in backup programs. These programs can create
    full, partial, and incremental backups and should be incoroporated into your disaster
    recovery plan.


    **Commands covered in this section:**


    | Command | Purpose |

    |---|---|

    | **tar** | Create/extract archive files. |

    | **dump** | Create incremental backups. |

    | **restore** | Restore files from dump archives. |

    | **dd** | Create raw copies of data devices. |

    | **cpio** | Create/extract cpio archives. |

    | **mt** | Control tape devices. |

    | **mksysb** | Create a backup image of an AIX system. |


    **Glossary of terms used in this section:**


    +   *   **Full Backup**

    +       A backup that includes all files on the local system.

    +   *   **Incremental Backup**

    +       A backup that includes only files that have changed since the last full
    backup.'
  merge: -1
  img_proc: true
- pgno: 192
  md: "# tar\n\n**Purpose:** Create/extract archive files.\n\n**Usage syntax:** tar\
    \ [OPTIONS] [OUTPUT] [INPUT]\n\n```\n```\n# tar -cvf backup.tar /etc/*\n/etc/acpi/\n\
    /etc/acpi/stoptbtn.sh\n/etc/acpi/videobtn.sh\n/etc/acpi/ibm-wireless.sh\n/etc/acpi/hibernate.sh\n\
    /etc/acpi/resume.d/\n /etc/acpi/resume.d/15-video-post.sh\n /etc/acpi/resume.d/62-ifup.sh\n\
    \ /etc/acpi/resume.d/10-thinkpad-standby-led.sh\n...\n\nCreating a backup archive\
    \ of the /etc directory using the tar command\n```\n```\n\nThe tar command creates\
    \ and extracts tar archives. It is the most commonly used utility for creating\
    \ backups on Unix, Linux, and BSD systems. In the above example, the -cvf option\
    \ is used to create a backup archive of the /etc directory called backup.tar.\n\
    \nIn the next example, the -xvf option is used to extract the /etc/hosts file\
    \ from the archive created in the first example.\n\n```\n```\n# tar -xvf backup.tar\
    \ etc/hosts\netc/hosts\n\nExtracting files from a tar archive\n```\n```\n\n> **Note**\n\
    > The default operation of the tar command strips the leading / from the file\
    \ path. This means that files restored from tar archives will be placed in a location\
    \ relative to the current directory. The -p option can be specified to override\
    \ this behavior.\n\n+   Common usage examples:\n+   * tar -cvf [FILE] [ITEM] Backup\
    \ the specified item(s)\n+   * tar -czvf [FILE] [ITEM] Compress the archive to\
    \ save space\n+   * tar -xvf [FILE] [ITEM] Restore the specified item(s)\n+  \
    \ * tar -tf [FILE] List all files in the specified archive"
