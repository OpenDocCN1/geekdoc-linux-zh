  md: "**Purpose:** Copy files and directories.\n\n**Usage syntax:** cp [OPTIONS]\
    \ [SOURCE] [DESTINATION]\n\n```\n$ cp MyFile MyFile.copy\n$ ls -l\n-rw-r-r-- 1\
    \ nick nick 55 2009-05-20 15:32 MyFile\n-rw-r-r-- 1 nick nick 55 2009-05-20 15:32\
