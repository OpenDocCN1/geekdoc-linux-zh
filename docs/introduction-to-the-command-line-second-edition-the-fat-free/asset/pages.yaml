- pgno: 35
  md: '# logout


    Purpose: Log out of the system.


    Usage syntax: logout


    ```

    $ logout

    Ubuntu 9.04

    login:        Results of the logout command

    ```


    The logout command logs your account out of the system. This will end your terminal
    session and return to the login screen.


    Some systems may have a file called .logout or .bash_logout in each user''s home
    directory. This file contains commands to be run during the logout process. It
    is used to perform cleanup operations and clear the screen before ending the user''s
    session.


    > The logout command is the recommended way to exit the shell. For security purposes,
    users with administrative access should always logout of any open terminal sessions
    when away from their desk.


    Common usage examples:


    ```

    logout  Log out of the system

    ```'
