- pgno: 45
  md: '# **rm**


    **Purpose**: Remove files.


    **Usage syntax**: `rm [OPTIONS] [FILE]`


    ```

    $ rm MyFile

    $ ls -l MyFile

    ls: cannot access MyFile: No such file or directory

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_45_0.png)


    The **rm** command removes files. In the above example, the **rm** command is
    used to remove `MyFile`. After executing the **rm** command, `MyFile` is deleted
    from the disk and no longer accessible.


    Notice that no warning is given when the file is removed. This is the default
    behavior of **rm** on most systems. To change this, use the `-i` option as demonstrated
    in the next example. This will instruct the system to prompt you to verify you
    want to remove the file.


    ```

    $ rm -i MyFile

    rm: remove regular file ''MyFile''? y

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_45_1.png)


    > You can use the **alias** command (see page 54) to make `rm -i` the default
    remove action. This is highly recommended as it helps prevent accidental disasters
    when deleting files.


    **Common usage examples:**


    | Usage | Description |

    | :--- | :--- |

    | `rm [FILE]` | Remove the specified file |

    | `rm -r [DIRECTORY]` | Recursively remove all items in the specified directory
    |

    | `rm -i [FILE]` | Prompt to confirm the removal of the specified file |'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# mkdir / rmdir


    **Purpose:** Create/remove directories.


    **Usage syntax:** `mkdir [OPTIONS] [DIRECTORY]`


    ```

    # mkdir test

    # ls -ld test/

    drwxr-xr-x 2 root root 4096 Jun 4 09:00 test

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_46_0.png)


    The `mkdir` command creates directories. The above example demonstrates creating
    a directory called `test`. Notice the permissions section of the `ls` output contains
    a `d` prefix. This indicates that the item is a directory.


    > > Tip: Use `mkdir "my directory"` or `mkdir my\\ directory` to create a directory
    with a space in its name.


    The `rmdir` command removes directories. In the next example, the `rmdir` command
    is used to remove the previously created `test` directory.


    **Usage syntax:** `rmdir [DIRECTORY]`


    ```

    $ rmdir test/

    $ ls -ld test/

    ls: cannot access test/: No such file or directory

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_46_1.png)


    > > Note: `rmdir` will only remove empty directories. To remove a non-empty directory,
    use `rm -r [DIRECTORY]` in place of the `rmdir` command.


    **Common usage examples:**


    +   - `mkdir [DIRECTORY]` Create the specified directory

    +   - `mkdir -p [PATH/DIRECTORY]` Create parent directories if needed

    +   - `rmdir [DIRECTORY]` Remove the specified directory'
