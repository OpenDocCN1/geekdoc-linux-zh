  md: '# ## ssh


    **Purpose:** Client for connecting to remote servers via the SSH protcol.


    **Usage syntax:** `ssh [OPTIONS] [HOST]`


    ```

    $ ssh myserver

    nick@myserver''s password: ******

    $

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_160_0.png)


    The `ssh` command is used to connect to remote systems via the SSH protocol. SSH
    creates an encrypted connection between two systems and provides a secure channel
    for communication. This helps prevent "man in the middle" hackers from being able
    to capture sensitive information (such as usernames and passwords) when connecting
    to remote systems.


    > Tip

    > *PuTTY, a free SSH and telnet client for Windows, can be downloaded at www.chiark.greenend.org.uk/~sgtatham/putty/.
    This allows you to connect to remote Unix, Linux, and BSD servers directly from
    Windows systems.*


    +   **Common usage examples:**

    +   `ssh [HOST]` | Start an SSH session to a remote system

    +   `ssh -l [USER] [HOST]` | Login as the specified user on the target system

    +   `ssh -C [HOST]` | Enable compression (for slow connections)'
  merge: -1
