  md: "# installp\n\nPurpose: Install software packages on AIX systems.\n\nUsage syntax:\
    \ installp [OPTIONS] [PACKAGE]\n\n```\n# installp -Yd /mnt/cdrom httpd.base\n\
    ...\nInstallation Summary\n-------------------\nName          Level        Part\
    \      Event     Result\n-------------------------------------------------------\n\
    httpd.base    2.2.6.0      USR       APPLY     SUCCESS\n\n            Installing\
    \ the Apache http server on AIX\n```\n\nThe installp command installs software\
    \ packages on AIX systems. The above example demonstrates installing the Apache\
    \ web server package located on the install media mounted in /mnt/cdrom.\n\n>\
    \ Note  The -Y option accepts any required license agreements during installation.\n\
    \nTo remove a package, use the -u option as demonstrated in the next example.\n\
    \n```\n# installp -u httpd.base\n...\nInstallation Summary\n-------------------\n\
    Name          Level        Part      Event       Result\n-------------------------------------------------------\n\
    httpd.base    2.2.6.0      USR       DEINSTALL   SUCCESS\n\n            Removing\
    \ a package on AIX\n```\n\nCommon usage examples:\n\n| installp -ld [MEDIA] |\
    \ List packages on the specified media |\n|---|---|\n| installp -Yd [PATH] [PACKAGE]\
    \ | Install the specified package |\n| installp -u [PACKAGE] | Uninstall the specified\
    \ package |"
