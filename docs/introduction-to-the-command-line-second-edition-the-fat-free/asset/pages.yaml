- pgno: 127
  md: "# telinit\n\nPurpose: Change the runlevel.\n\nUsage syntax: telinit [RUNLEVEL]\n\
    \n```\n# telinit 1\n*** Switching to run level 1 ***\n# runlevel\n3 1\n```\n\n\
    ![](img/fa2f95b64a707c963dfa0445bd9281a7_127_0.png)\n\n**telinit** tells the system's\
    \ *init* process to stop and start the necessary services configured for the specified\
    \ runlevel. In the above example the **telinit** command is used to change the\
    \ system to runlevel 1. The **runlevel** command (see page 129) is then executed\
    \ to display the current and previous runlevels.\n\nEach system's runlevel configuration\
    \ is specific to the distribution being used and can be customized to fit your\
    \ needs. Most Unix, Linux, and BSD systems will have a runlevel configuration\
    \ similar to the one described in the following table.\n\n| Runlevel | Purpose\
    \ | \n| :---: | :--- | \n| 0 | Shutdown or special administrative mode | \n| 1\
    \ | Single user mode | \n| 2 | Multiuser mode | \n| 3 | Multiuser mode | \n| 4\
    \ | Multiuser mode | \n| 5 | Distribution specific | \n| 6 | Reboot |\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_127_1.png)\n\
    \nCommon usage examples:\n\n+   - **telinit [RUNLEVEL]** Tell the init process\
    \ to load the specified runlevel"
  merge: -1
  img_proc: true
- pgno: 128
  md: '# runlevel


    Purpose: Display the previous and current runlevel.


    Usage syntax: `runlevel`


    ```

    $ `runlevel`

    3 1

    ```


    Output of the runlevel command


    The `runlevel` command displays the current and previous runlevel. The runlevel
    is an initialization sequence called by the `init` process and defines procdueres
    for system startup and shutdown. In the above example, `runlevel` is used to display
    the current runlevel information. The first number displayed is the previous runlevel
    and the second number is the current runlevel.


    > Note

    > If there is no previous runlevel, the system will display N in the first field.


    Common usage examples:


    `runlevel` | Display the previous and current runlevel'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# service


    **Purpose:** Manage services on a Linux system.


    **Usage syntax:** `service [OPTIONS] [SERVICE] [ACTION]`


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_129_0.png)


    The `service` command manages services on Linux systems. In the above example,
    the `--status-all` option displays the status of all services on the system. The
    `+` symbol indicates a running service and the `–` symbol indicates a stopped
    service.


    The `start`, `stop`, `restart`, and `status` options can be used to control individual
    services as demonstrated in the next example.


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_129_1.png)


    | Common usage examples: | |

    | :--- | :--- |

    | service [SERVICE] stop | Stop the specified service |

    | service [SERVICE] start | Start the specified service |

    | service [SERVICE] restart | Restart the specified service |

    | service [SERVICE] status | Display the status of the specified service |

    | service --status-all | Display the status of all services |'
  merge: -1
  img_proc: true
