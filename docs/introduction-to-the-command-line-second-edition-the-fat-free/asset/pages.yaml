  md: "# awk\n\n**Purpose**: Text processing and pattern matching program.\n\n**Usage\
    \ syntax**: `awk [EXPRESSION]`\n\n```\n```\n$ ls -l ShoppingList.*\n-rw-r-r--\
    \ 1 nick nick 24 2010-04-12 23:10 ShoppingList.old\n-rw-r-r-- 1 nick nick 23 2010-04-12\
    \ 19:33 ShoppingList.txt\n$ ls -l ShoppingList.* | awk -F\" '{ print $1 \" $8\
    \ }'\"\n-rw-r-r-- ShoppingList.old\n-rw-r-r-- ShoppingList.txt\n```\nModifying\
    \ the output of the ls Command using the awk command\n```\n\n**awk** is a pattern\
    \ matching and text processing utility. It treats each line of input as a series\
    \ of fields. The fields in each line are grouped into an array and assigned a\
    \ variable related to their position. In the above example, **awk** is used to\
    \ extract and print the first and eighth ($1 and $8) fields from the output of\
    \ the `ls` command.\n\nThe **awk** command can also be used to perform batch processing\
    \ functions such as renaming multiple files as demonstrated in the next example.\n\
    \n```\n```\n$ ls\nFile1 File3 File5 File7 File9\nFile2 File4 File6 File8\n$ ls\
    \ | awk '{print \"mv \"$1\" $1.txt\"} ' | sh\n$ ls\nFile1.txt File3.txt File5.txt\
    \ File7.txt File9.txt\nFile2.txt File4.txt File6.txt File8.txt\n```\nBatch renaming\
    \ files using the awk command\n```\n\nIn this example the **awk** command is used\
    \ to rename the listed files by appending a .txt extension to them.\n\n> **Note**\n\
    > \n> **awk** is a powerful and complex utility that can't be fully covered in\
    \ this book. Visit www.DontFearTheCommandLine.com to find resources for learning\
    \ more about **awk** usage syntax.\n\n**Common usage examples:**\n\n```\n```\n\
    [INPUT] | awk [EXPRESSION] | Process input using the awk command\n```\n```"
  merge: -1
  img_proc: true
