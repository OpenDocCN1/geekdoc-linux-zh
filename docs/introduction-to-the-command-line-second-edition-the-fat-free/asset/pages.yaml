  md: '# dmesg


    **Purpose:** Display kernel log messages.


    **Usage syntax:** `dmesg [OPTIONS]`


    ```

    # dmesg | less

    [ 0.000000] Initializing cgroup subsys cpuset

    [ 0.000000] Initializing cgroup subsys cpu

    [ 0.000000] Linux version 2.6.24-27-server (buildd@palmer) (gcc version 4.2.4
    (Ubuntu 4.2.4-1ubuntu3)) #1 SMP Fri Mar 12 01:45:06 UTC 2010 (Ubuntu 2.6.24-27.68-server)

    [ 0.000000] BIOS-provided physical RAM map:

    [ 0.000000] BIOS-e820: 0000000000000000 - 00000000009f8000 (usable)

    [ 0.000000] BIOS-e820: 0000000009f800 - 0000000000a00000 (reserved)

    [ 0.000000] BIOS-e820: 00000000c0ca00 - 00000000dc cc000 (reserved)

    [ 0.000000] BIOS-e820: 00000000dc c00 - 000000000100000 (reserved)

    ...

    ```


    Displaying kernel messages using dmesg


    The `dmesg` command displays the kernel message log. This is the first place you
    should check when troubleshooting a problem. Executing `dmesg` displays all messages
    in the kernel log buffer, as demonstrated in the above example.


    `dmesg` output can be very lengthy. Using `grep` with the `dmesg` command is helpful
    to search for a specific message. The next example demonstrates filtering `dmesg`
    using `grep` to search for the word *fail*.


    ```

    $ dmesg | grep fail

    [39176.231722] usb-storage: probe of 2-2:1.0 failed with error -5

    [41421.627352] PM: Device 2-2 failed to resume: error -19

    [41429.152942] usb-storage: probe of 2-3:1.0 failed with error -5

    [46938.994016] usb-storage: probe of 2-3:1.0 failed with error -5

    [49869.891317] usb-storage: probe of 2-3:1.0 failed with error -5

    [57103.036672] PM: Device 2-3 failed to resume: error -19

    ...

    ```


    Searching dmesg output for an error message


    **Tip** Kernel messages are typically stored in the `/var/log/dmesg` file.


    # Common usage examples:


    | `dmesg` | Display the kernel log |

    | --- | --- |

    | `dmesg -c` | Clear all kernel log messages |'
