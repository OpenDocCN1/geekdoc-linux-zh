    The pgrep command displays all processes matching the specified name. In the above
    example the PIDs for the apache web server are displayed. This is the equivalent
    of typing ps -el|grep apache and is provided as a shortcut to produce the same
    results.


    The -l option can be used with pgrep to display the full process name for each
    PID as demonstrated in the next example.


    ```

    $ pgrep -l apache

    3952 apache2

