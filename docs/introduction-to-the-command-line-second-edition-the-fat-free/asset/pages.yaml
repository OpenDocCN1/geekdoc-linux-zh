  md: '# ## stopsrc / startsrc


    **Purpose**: Start/stop services on AIX systems.


    **Usage syntax**: `startsrc [OPTIONS] [SERVICE/GROUP]`


    ```

    # startsrc -s nfsd

    0513-059 The nfsd Subsystem has been started. Subsystem PID is 221400.

    ```


