  md: "**Purpose:** Start a process in the background.\n\n**Usage syntax:** `[COMMAND]`\
    \ &\n\n```\n$ ./SomeProgram.sh &\n[1] 10717\n$ ps\n\n      PID TTY          TIME\
    \ CMD\n    10696 pts/0    00:00:00 bash\n    10717 pts/0    00:00:03 SomeProgram.sh\n\
    \    10721 pts/0    00:00:00 ps\n\nExecuting a program in the background with\
    \ the & command line operator\n```\n\n& is a command line operator that instructs\
    \ the shell to start the specified program in the background. This allows you\
    \ to have more than one program running at the same time without having to start\
    \ multiple terminal sessions. In the above example, a shell script called `SomeProgram.sh`\
    \ is started as a background process. Executing the `ps` command shows the requested\
    \ program is now running in the background.\n\n> Output from background programs\
    \ will still be displayed in the shell. You can redirect this output to a file\
    \ by using the following syntax: `SomeProgram.sh > output.log &` This will redirect\
    \ all the output of the background program to a file called `output.log` in the\
    \ current directory.\n\n+   Common usage examples:\n+   `[COMMAND]` & | Execute\
    \ the specified command in the background\n+   `[COMMAND]` > `[FILE]` & | Redirect\
    \ the output of the background command to a file"
  merge: -1
  img_proc: true
- pgno: 115
  md: '# ## bg / fg


    Purpose: Move a process to the background/foreground.


    **Usage syntax:** `bg [JOBID]`


    ```

    ```

    $ ./SomeProgram.sh

    <CTRL + Z>

    [1]+ Stopped      SomeProgram.sh

    $ bg 1

    $ jobs

    [1]- Running      SomeProgram.sh

    ```

    ```


    Suspending a running program and then resuming it in the background


    The `bg` command sends a process to the background. This allows you to multitask
    several programs within a single terminal session. In the above example the shell
    script `SomeProgram.sh` is suspended (by pressing **CTRL + Z** on the keyboard)
    and then resumed as a background process using `bg`.


    > > **Note** The `jobs` command (see page 117) can be used to verify the program
    is now running in the background.


    The `fg` command moves background processes to the foreground. In the next example
    the `fg` command is used to bring the specified job ID to the foreground.


    **Usage syntax:** `fg [JOBID]`


    ```

    ```

    $ jobs

    [1]- Running      SomeProgram.sh

    $ fg 1

    SomeProgram.sh

    ...

    ```

    ```


    Moving a background job to the foreground


    | **Common usage examples:** |

    |---|---|

    | `bg [JOBID]` | Send the specified job to the background |

    | `fg [JOBID]` | Move the specified job to the foreground |'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# jobs


    **Purpose**: Display background and suspended jobs.


    **Usage syntax**: `jobs [OPTIONS]`


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_116_0.png)


    The `jobs` command displays the status of background programs and suspended processes.
    In the above example, three background jobs are displayed. The previously mentioned
    `fg` and `bg` commands can be used to move the processes to the foreground and
    background respectively.


    The following table describes the output fields of the `jobs` command.


    | Job ID | Status | Program |

    | :--- | :--- | :--- |

    | `[1]-` | Running | `SomeProgram.sh` |

    | `[2]+` | Stopped | `AnotherProgram.sh` |

    | `[3]` | Stopped | `Test.sh` |


    Output fields of the jobs command


    > **Note**

    > *The plus sign is used to indicate what job is considered to be the default
    job (for use with the `bg` and `fg` commands). The minus sign indicates the job
    that will become the default if the current default job terminates. There can
    be only one `+` and `-` at any given time. All other jobs will not have any indicators.*


    **Common usage examples:**


    ```

    jobs | Display all jobs

    ```


    ```

    jobs -1 | Display all jobs and their PID

    ```'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# nohup


    **Purpose:** Run a process immune to hang-up signals.


    **Usage syntax:** `nohup [COMMAND] &`


    ```

    $ nohup SomeProgram.sh &

    nohup: ignoring input and appending output to ''nohup.out''

    $ exit

    ```


    Using the nohup command to launch a background program


    The **nohup** command makes processes immune to hang-up signals. A hang-up signal
    is used to inform child processes of a shell that the parent process is terminating.
    This would normally cause all child processes to terminate. Using **nohup** allows
    a program to continue running after you log out, as demonstrated in the above
    example.


    > **Tip** *Output from the program is stored in a file called `nohup.out` in the
    directory where the nohup command was executed.*


    **Common usage examples:**


    `nohup [COMMAND ] &` | Execute a program immune to hang-up signals'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# # at / atq / atrm


    Purpose: Schedule a program to run at the specified time.


    Usage syntax: at [OPTIONS] [TIME|DATE]


    ```

    $ at 1am

    at> MyProgram.sh

    at> <CTRL + D>

    job 1 at Sat May 30 01:00:00 2009

    ```


    Scheduling a process using the at command


    The at command schedules programs to run at the specified time. In the above example,
    the at command is used to launch a shell script called MyProgram.sh. The launch
    time in this example is specified as 1am on the command line. You can also use
    more traditional Unix time specifications such as 01:00 or any other HH:MM combination.


    > **Tip**

    > *The at command has a special command line argument called now.*

    > *This can be used as a shortcut to save time when scheduling jobs. For example
    typing at now + 15 minutes would schedule the job to launch 15 minutes from the
    current time.*


    The atq command displays information about queued at jobs as shown in the next
    example.


    Usage syntax: atq


    ```

    $ atq

    1 Sat May 30 01:00:00 2009 MyProgram.sh nick

    ```


    Using the atq command to display the job queue


    The atrm command deletes a scheduled job as shown in the next example.


    Usage syntax: atrm [JOBID]


    ```

    $ atrm 1

    ```


    Removing a scheduled job using the atrm command


    **Common usage examples:**


    | | |

    | :--- | :--- |

    | at [TIME] | Schedule a program to run at the specified time |

    | atq | Display the at job queue |

    | atrm [JOBID] | Remove a scheduled job from the at queue |'
  merge: -1
  img_proc: true
- pgno: 119
  md: "# batch\n\n**Purpose:** Schedule programs to run during low CPU load.\n\n**Usage\
