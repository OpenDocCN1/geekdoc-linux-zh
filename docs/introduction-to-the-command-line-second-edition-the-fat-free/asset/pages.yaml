  md: '# eject


    Purpose: Unload removable media.


    Usage syntax: `eject [OPTIONS] [DEVICE]`


    ```

    # eject

    Using the eject command to remove a CD or DVD

    ```


    The `eject` command unloads removable media devices. It is primarily used to unmount
    and eject a CD or DVD. On most systems, simply typing the `eject` command will
    unmount and eject the tray on the disc drive.


    > **Note**

    > Some systems may require you to specify which device to eject, such as `eject
    /dev/cdrom`.


    The `-v` option can be used with the `eject` command to display verbose messages
    when ejecting removable media as shown in the next example.


    ```

    # eject -v /dev/cdrom

    eject: device name is ''/dev/cdrom''

    eject: expanded name is ''/dev/cdrom''

    eject: ''/dev/cdrom'' is a link to ''/dev/sr0''

    eject: ''/dev/sr0'' is mounted at ''/media/FOTC_S2_DISC1''

    eject: unmounting device ''/dev/sr0'' from ''/media/FOTC_S2_DISC1''

    eject: ''/dev/sr0'' is not a multipartition device

    eject: trying to eject ''/dev/sr0'' using CD-ROM eject command

    eject: CD-ROM eject command succeeded


    Displaying verbose messages with the eject -v command

    ```


    Common usage examples:


    | | |

    | --- | --- |

    | `eject` | Eject the default removable device |

    | `eject [DEVICE]` | Eject the specified device |

    | `eject -c [SLOT] [DEVICE]` | Eject a specific slot on a CD changer device |

    | `eject -v` | Display verbose messages |'
