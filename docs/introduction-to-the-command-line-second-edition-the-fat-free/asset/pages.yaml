    **top** is a process and performance monitor for Unix, Linux, and BSD systems.
    The first few lines of **top** output displays information about processor, memory,
    and swap utilization. The remaining portion of the screen is used to display information
    about running processes. The process listing updates every few seconds to display
    the most resource-intensive processes.


    > **Tip**

    > *There are several interactive commands that can be used to control the output
    of the* `top` *command. Press the* `?` *key within* `top` *for a complete listing
    of these commands.*


    **Common usage examples:**


    | Command             | Description                                          |

    | :---                | :---                                                 |

    | `top`               | Monitor system performance and processes             |

    | `top -u [USER]`     | Only display processes owned by the specified user   |

    | `top -d [SECONDS]`  | Update at the specified interval (in seconds)        |

    | `top -i`            | Do not display idle processes                        |'
