- pgno: 223
  md: '# ## Section 13: Printing Commands


    # **Overview**


    Commands in this section cover the basics of printer management on Unix, Linux,
    and BSD systems. The Unix printing subsystem is known as **LPD** (**Line Printer
    Daemon**). Linux uses a newer printing system called **CUPS** (**Common Unix Printing
    System**). Although these two printing services are very different at their core,
    they share mostly interchangeable commands.


    **Commands covered in this section:**


    | Command | Purpose |

    | :--- | :--- |

    | **lp** | Print files. |

    | **lptest** | Display printer and print job status information. |

    | **lpq** | Display print queue status. |

    | **cancel** | Cancel and delete queued print jobs. |

    | **enable disable** | Enable/disable printers. |

    | **lpadmin** | Administer printers. |


    **Glossary of terms used in this section:**


    **CUPS**

    (**Common Unix Printing System**) A modern printing system for Unix, Linux, and
    BSD systems.


    **Print Job**

    A file that has been submitted for printing.


    **LPD**

    (**Line Printer Daemon**) Printing system used primarily on Unix and BSD systems.


    **Queue**

    A spooling system for print jobs waiting to be printed.'
  merge: -1
  img_proc: true
- pgno: 224
  md: "# # lp\n\n**Purpose:** Print files.\n\n**Usage syntax:** `lp [OPTIONS] [FILE]`\n\
    \n```\n```\n$ lp -d HP-4350 /etc/hosts\nrequest id is HP-4350-4 (1 file(s))\n\
    Printing a file using the lp command\n```\n```\n\nThe `lp` command submits files\
    \ for printing. In the above example, the `/etc/hosts` file is printed on the\
    \ specified destination printer. The system will display a job summary after executing\
    \ the command. Included in the job summary is the print job's ID number. On most\
    \ systems, the ID number consists of the printer name with the job ID for the\
    \ specified printer appended to it (4 in this case).\n\n> **Note**\n> \n> If no\
    \ destination is specified, the file will print on the default system printer.\n\
    \nCommon usage examples:\n\n| `lp [FILE]` | Print a file to the default printer\
    \ |\n|---|---|\n| `lp -d [PRINTER] [FILE]` | Print to the specified printer |\n\
    | `lp -n [NUM] -d [PRINTER] [FILE]` | Print the specified number of copies |"
  merge: -1
  img_proc: true
