- pgno: 36
  md: "# exit\n\n**Purpose:** Exit the current shell.\n\n**Usage syntax:** `exit [CODE]`\n\
    \n```\n$ exit\n```\n\n```\nlogin:\n```\n\nExample output of the exit command\n\
    \nThe `exit` command is similar to the `logout` command with the exception that\
