    The **tac** command is similar to the previously discussed **cat** command, except
    it displays a file''s contents in reverse order. In the above example, the output
    of the **cat** command is compared to the **tac** command to demonstrate the differences
    between the output generated by these two commands.


    > **Tip**

    > *tac* *is extremely useful when reviewing the contents of log files on Unix,
    Linux, BSD systems. The newest entries in log files are always appended to the
    end of the file. **tac** allows you to read these files in reverse order displaying
    the most recent entries first.*


    **Common usage examples:**


    `tac [FILE]` | Display the contents of the specified file in reverse order'
