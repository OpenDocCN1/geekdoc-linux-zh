    \ and received to and from the local system. It can be helpful in monitoring network\
    \ conditions or troubleshooting connectivity problems.\n\nIn the above example,\
    \ **tcpdump** captures network traffic on the **eth0** interface. Information\
    \ on each packet is then displayed on the screen. The capture will continue until\
    \ interrupted (by pressing **CTRL + C**).\n\n> **Tip**\n> Output from **tcpdump**\
    \ can be difficult to interpret. *A free utility called* ***Wireshark*** *is available\
    \ that can be used to import* ***tcpdump*** *packet captures for easy viewing.*\
    \ ***Wireshark*** *is available for Linux, Mac OS X, and Windows systems. Visit*\
    \ ***www.wireshark.com*** *for more information.*\n\n| Command | Description |\n\
    | :--- | :--- |\n| `tcpdump` | Display network traffic on the screen |\n| `tcpdump\
    \ > [FILE]` | Save the packet capture to a file |\n| `tcpdump -i [INTERFACE]`\
    \ | Capture traffic on the specified interface |\n| `tcpdump -vv` | Display verbose\
    \ packet information |\n| `tcpdump -c [COUNT]` | Stop after receiving the specified\
    \ number of packets |\n\n## dhclient\n\n**Purpose:** DHCP client for Linux and\
