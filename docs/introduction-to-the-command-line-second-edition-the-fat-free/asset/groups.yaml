    # # tail


    **Purpose**: Display the last part of a file.


    **Usage syntax**: `tail [OPTIONS] [FILE]`


    ```

    $ tail -n 2 ShoppingList.txt

    Cheese

    Tacos

    ```


    Displaying the last two lines in a file with tail


    The `tail` command displays the last few lines (known as the *tail*) of the specified
    file. In the above example, the `-n 2` option is used to display only the last
    two lines of the specified file. If the `tail` command is executed with no options
    it will display the last 10 lines in the file by default.


    Another useful feature of the `tail` command is the `-f` option which is used
    to “follow” a file as it grows. This instructs the `tail` command to open the
    specified file and display new lines as they are written to it. The next example
    demonstrates using the `tail -f` command to monitor new log entries in real-time
    in the /var/log/syslog file.


    ```

    # tail -f /var/log/syslog

    May 22 13:41:50 e6400 NetworkManager: <info>  (wlan0): supplicant

    connection state:  completed -> group handshake

