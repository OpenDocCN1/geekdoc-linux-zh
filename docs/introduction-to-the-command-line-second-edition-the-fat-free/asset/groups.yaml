    # nice


    **Purpose:** Execute programs at the specified CPU priority level.


    **Usage syntax:** `nice [OPTIONS] [COMMAND]`


    ```

    # nice -n 19 LowPriority.sh

    # nice -n -20 HighPriority.sh

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_112_0.png)


    The `nice` command allows programs to be started at a lower or higher than normal
    scheduling priority. This allows you to control which processes the kernel should
    favor when dividing processor time among running programs. Processes with the
    lowest `nice` number are executed with the highest priority and vice versa. The
    example above demonstrates using `nice` to start programs with modified scheduling
    priority.


    On most systems, priority levels for *normal users* range from 0 to 19, with 0
    being the highest priority and 19 being the lowest priority. The *root* user can
    create processes with a range of -20 (highest) to 19 (lowest).


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_112_1.png)


    Most programs start with a nice level of 0 by default. Critical system services
    usually have a negative nice level so that they are always given preference over
    user programs.


    > Note

    > Some Unix systems may use a range of 0 to 39 with 0 being the highest priority
    and 39 being the lowest. For more information see man nice on your local system.


    **Common usage examples:**


    ```

    `nice -n [NUM] [COMMAND]` | Start a program with the specified priority

    ```'
