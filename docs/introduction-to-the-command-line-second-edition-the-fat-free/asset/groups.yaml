    # # at / atq / atrm


    Purpose: Schedule a program to run at the specified time.


    Usage syntax: at [OPTIONS] [TIME|DATE]


    ```

    $ at 1am

    at> MyProgram.sh

    at> <CTRL + D>

    job 1 at Sat May 30 01:00:00 2009

    ```


    Scheduling a process using the at command


    The at command schedules programs to run at the specified time. In the above example,
    the at command is used to launch a shell script called MyProgram.sh. The launch
    time in this example is specified as 1am on the command line. You can also use
    more traditional Unix time specifications such as 01:00 or any other HH:MM combination.


    > **Tip**

    > *The at command has a special command line argument called now.*

    > *This can be used as a shortcut to save time when scheduling jobs. For example
    typing at now + 15 minutes would schedule the job to launch 15 minutes from the
    current time.*


    The atq command displays information about queued at jobs as shown in the next
    example.


    Usage syntax: atq


    ```

    $ atq

    1 Sat May 30 01:00:00 2009 MyProgram.sh nick

    ```


    Using the atq command to display the job queue


    The atrm command deletes a scheduled job as shown in the next example.


    Usage syntax: atrm [JOBID]


    ```

    $ atrm 1

    ```


    Removing a scheduled job using the atrm command


    **Common usage examples:**


    | | |

    | :--- | :--- |

    | at [TIME] | Schedule a program to run at the specified time |

    | atq | Display the at job queue |

    | atrm [JOBID] | Remove a scheduled job from the at queue |'
  md: "\n## killall\n\n**Purpose:** Terminate all processes with the specified name.\n\
    \n**Usage syntax:** `killall [OPTIONS] [NAME]`\n\n```bash\n# pgrep -l apache2\n\
    3952 apache2\n4075 apache2\n4076 apache2\n4077 apache2\n4078 apache2\n4079 apache2\n\
    # killall apache2\n```\n\nTerminating processes by name using the killall command\n\
    \nThe `killall` command terminates all processes that match the specified name.\
    \ This can be helpful if you have several processes with the same name that you\
    \ need to kill. In the above example, multiple processes related to the *apache2*\
    \ service are terminated using `killall`.\n\n> **Tip**\n> The *-i* parameter can\
    \ be used with `killall` to prompt for confirmation before terminating each process.\
    \ This is recommended as it helps prevent killing the wrong process due to typos.\n\
    \n**Common usage examples:**\n\n- `killall [NAME]` Terminate all processes with\
    \ the specified name\n- `killall -i [NAME]` Prompt for confirmation before killing\
    \ processes\n\n## nice\n\n**Purpose:** Execute programs at the specified CPU priority\
    \ level.\n\n**Usage syntax:** `nice [OPTIONS] [COMMAND]`\n\n```bash\n# nice -n\
    \ 19 LowPriority.sh\n# nice -n -20 HighPriority.sh\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_112_0.png)\n\
    \nThe `nice` command allows programs to be started at a lower or higher than normal\
    \ scheduling priority. This allows you to control which processes the kernel should\
    \ favor when dividing processor time among running programs. Processes with the\
    \ lowest `nice` number are executed with the highest priority and vice versa.\
    \ The example above demonstrates using `nice` to start programs with modified\
    \ scheduling priority.\n\nOn most systems, priority levels for *normal users*\
    \ range from 0 to 19, with 0 being the highest priority and 19 being the lowest\
    \ priority. The *root* user can create processes with a range of -20 (highest)\
    \ to 19 (lowest).\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_112_1.png)\n\nMost\
    \ programs start with a nice level of 0 by default. Critical system services usually\
    \ have a negative nice level so that they are always given preference over user\
    \ programs.\n\n> **Note**\n> Some Unix systems may use a range of 0 to 39 with\
    \ 0 being the highest priority and 39 being the lowest. For more information see\
    \ man nice on your local system.\n\n**Common usage examples:**\n\n- `nice -n [NUM]\
    \ [COMMAND]` Start a program with the specified priority\n\n## renice\n\n**Purpose:**\
    \ Alter the priority of a running process.\n\n**Usage syntax:** `renice [OPTIONS]\
    \ [PID]`\n\n```bash\n# renice +5 -p 7279\n7279: old priority 0, new priority 5\n\
    ```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_113_0.png)\n\nThe `renice` command\
    \ adjusts the priority of a running process. In the above example PID 7279 is\
    \ adjusted to have a +5 priority. This effectively lowers the priority of the\
    \ process since the previous priority was 0.\n\n**Common usage examples:**\n\n\
    - `renice +/-[NUM] -p [PID]` Change the specified PID's priority\n\n## &\n\n**Purpose:**\
    \ Start a process in the background.\n\n**Usage syntax:** `[COMMAND] &`\n\n```bash\n\
    $ ./SomeProgram.sh &\n[1] 10717\n$ ps\n\n      PID TTY          TIME CMD\n   \
    \ 10696 pts/0    00:00:00 bash\n    10717 pts/0    00:00:03 SomeProgram.sh\n \
    \   10721 pts/0    00:00:00 ps\n```\n\nExecuting a program in the background with\
    \ the & command line operator\n\n& is a command line operator that instructs the\
    \ shell to start the specified program in the background. This allows you to have\
    \ more than one program running at the same time without having to start multiple\
    \ terminal sessions. In the above example, a shell script called `SomeProgram.sh`\
    \ is started as a background process. Executing the `ps` command shows the requested\
    \ program is now running in the background.\n\n> **Note**\n> Output from background\
    \ programs will still be displayed in the shell. You can redirect this output\
    \ to a file by using the following syntax: `SomeProgram.sh > output.log &`. This\
    \ will redirect all the output of the background program to a file called `output.log`\
    \ in the current directory.\n\n**Common usage examples:**\n\n- `[COMMAND] &` Execute\
    \ the specified command in the background\n- `[COMMAND] > [FILE] &` Redirect the\
    \ output of the background command to a file\n\n## bg / fg\n\n**Purpose:** Move\
    \ a process to the background/foreground.\n\n**Usage syntax:** `bg [JOBID]`\n\n\
    ```bash\n$ ./SomeProgram.sh\n<CTRL + Z>\n[1]+ Stopped      SomeProgram.sh\n$ bg\
    \ 1\n$ jobs\n[1]- Running      SomeProgram.sh\n```\n\nSuspending a running program\
    \ and then resuming it in the background\n\nThe `bg` command sends a process to\
    \ the background. This allows you to multitask several programs within a single\
    \ terminal session. In the above example the shell script `SomeProgram.sh` is\
    \ suspended (by pressing **CTRL + Z** on the keyboard) and then resumed as a background\
    \ process using `bg`.\n\n> **Note**\n> The `jobs` command (see page 117) can be\
    \ used to verify the program is now running in the background.\n\nThe `fg` command\
    \ moves background processes to the foreground. In the next example the `fg` command\
    \ is used to bring the specified job ID to the foreground.\n\n**Usage syntax:**\
    \ `fg [JOBID]`\n\n```bash\n$ jobs\n[1]- Running      SomeProgram.sh\n$ fg 1\n\
    SomeProgram.sh\n...\n```\n\nMoving a background job to the foreground\n\n**Common\
    \ usage examples:**\n\n| Command | Description |\n| :--- | :--- |\n| `bg [JOBID]`\
    \ | Send the specified job to the background |\n| `fg [JOBID]` | Move the specified\
    \ job to the foreground |\n\n## jobs\n\n**Purpose:** Display background and suspended\
    \ jobs.\n\n**Usage syntax:** `jobs [OPTIONS]`\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_116_0.png)\n\
    \nThe `jobs` command displays the status of background programs and suspended\
    \ processes. In the above example, three background jobs are displayed. The previously\
    \ mentioned `fg` and `bg` commands can be used to move the processes to the foreground\
    \ and background respectively.\n\nThe following table describes the output fields\
    \ of the `jobs` command.\n\n| Job ID | Status | Program |\n| :--- | :--- | :---\
    \ |\n| `[1]-` | Running | `SomeProgram.sh` |\n| `[2]+` | Stopped | `AnotherProgram.sh`\
    \ |\n| `[3]` | Stopped | `Test.sh` |\n\nOutput fields of the jobs command\n\n\
    > **Note**\n> The plus sign is used to indicate what job is considered to be the\
    \ default job (for use with the `bg` and `fg` commands). The minus sign indicates\
    \ the job that will become the default if the current default job terminates.\
    \ There can be only one `+` and `-` at any given time. All other jobs will not\
    \ have any indicators.\n\n**Common usage examples:**\n\n- `jobs` Display all jobs\n\
    - `jobs -1` Display all jobs and their PID\n\n## nohup\n\n**Purpose:** Run a process\
    \ immune to hang-up signals.\n\n**Usage syntax:** `nohup [COMMAND] &`\n\n```bash\n\
    $ nohup SomeProgram.sh &\nnohup: ignoring input and appending output to 'nohup.out'\n\
    $ exit\n```\n\nUsing the nohup command to launch a background program\n\nThe **nohup**\
    \ command makes processes immune to hang-up signals. A hang-up signal is used\
    \ to inform child processes of a shell that the parent process is terminating.\
    \ This would normally cause all child processes to terminate. Using **nohup**\
    \ allows a program to continue running after you log out, as demonstrated in the\
    \ above example.\n\n> **Tip**\n> Output from the program is stored in a file called\
    \ `nohup.out` in the directory where the nohup command was executed.\n\n**Common\
    \ usage examples:**\n\n- `nohup [COMMAND] &` Execute a program immune to hang-up\
    \ signals\n\n## at / atq / atrm\n\n**Purpose:** Schedule a program to run at the\
    \ specified time.\n\n**Usage syntax:** `at [OPTIONS] [TIME|DATE]`\n\n```bash\n\
    $ at 1am\nat> MyProgram.sh\nat> <CTRL + D>\njob 1 at Sat May 30 01:00:00 2009\n\
    ```\n\nScheduling a process using the at command\n\nThe at command schedules programs\
    \ to run at the specified time. In the above example, the at command is used to\
    \ launch a shell script called MyProgram.sh. The launch time in this example is\
    \ specified as 1am on the command line. You can also use more traditional Unix\
    \ time specifications such as 01:00 or any other HH:MM combination.\n\n> **Tip**\n\
    > The at command has a special command line argument called *now*.\n> This can\
    \ be used as a shortcut to save time when scheduling jobs. For example typing\
    \ `at now + 15 minutes` would schedule the job to launch 15 minutes from the current\
    \ time.\n\nThe atq command displays information about queued at jobs as shown\
    \ in the next example.\n\n**Usage syntax:** `atq`\n\n```bash\n$ atq\n1 Sat May\
    \ 30 01:00:00 2009 MyProgram.sh nick\n```\n\nUsing the atq command to display\
    \ the job queue\n\nThe atrm command deletes a scheduled job as shown in the next\
    \ example.\n\n**Usage syntax:** `atrm [JOBID]`\n\n```bash\n$ atrm 1\n```\n\nRemoving\
    \ a scheduled job using the atrm command\n\n**Common usage examples:**\n\n| Command\
    \ | Description |\n| :--- | :--- |\n| `at [TIME]` | Schedule a program to run\
    \ at the specified time |\n| `atq` | Display the at job queue |\n| `atrm [JOBID]`\
    \ | Remove a scheduled job from the at queue |\n"
