    The vi editor (also known as vim) is a complex and full featured text editor for
    Unix, Linux, and BSD systems. Traditional Unix systems typically utilize vi as
    the default text editor. Modern Linux and BSD systems use vim which is an enhanced
    version of vi.


    The vi and vim editors have two basic modes of operation: command mode and editing
    mode. Pressing Esc on the keyboard activates command mode. When in command mode,
    command keys can be used to activate specific editing functions. The following
