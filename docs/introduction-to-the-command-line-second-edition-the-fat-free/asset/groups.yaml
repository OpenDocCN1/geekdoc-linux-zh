    # 引言


    命令行可能是一个令人望而生畏且毫无宽容之地的环境。与在图形环境中工作不同，在终端中必须执行哪些命令才能完成特定任务并不完全清晰。加上事实是，命令行不会阻止你执行可能导致系统不可修复损坏的操作，这就很清楚地解释了为什么很多人从未花时间学习如何使用它。


    尽管新用户（在科技行业中被戏称为“菜鸟”）面临隐藏的危险和不确定性，你也不应恐惧命令行。凭借本书提供的信息，你将获得在命令行环境中变得更加熟练所需的技能。你会发现，大多数
    Unix、Linux 和 BSD 系统共享相同的核心架构，只有细微的差别。在学习了 Unix、Linux 和 BSD 系统的基本架构和命令后，你将能够轻松地在不同平台之间进行转换。


    为了辅助学习过程，我建议你下载以下列出的一个或多个免费操作系统，以练习本指南中的命令。


    | 操作系统 | 类型 | 网站 |

    | :--- | :--- | :--- |

    | Ubuntu | Linux | www.ubuntu.com |

    | Fedora | Linux | www.fedoraproject.org |

    | CentOS | Linux | www.centos.org |

    | openSUSE | Linux | www.opensuse.org |

    | OpenSolaris | Unix | www.opensolaris.org |

    | FreeBSD | BSD | www.freebsd.org |


    尝试多种 Unix、Linux 和 BSD 发行版以获取更广泛的平台知识是值得的体验。这将有助于扩展你对各种 Unix 类操作系统的了解，并赋予你在任何命令行环境中工作所需的技能。


    Linux 是推荐给初学者的起点。它支持所有最新硬件，并提供用户友好的安装过程。OpenSolaris Unix 平台也是一个很好的起点，因为它是基于 Unix
    的系统中最适合新手之一。安装 BSD 具有挑战性一些，需要高级技术知识或之前使用 Unix 和 Linux 系统的经验。


    **提示**


    - 我强烈推荐 Ubuntu 服务器版。它提供易于安装的体验和优秀的命令行学习环境。访问 www.ubuntu.com 了解有关 Ubuntu 服务器 Linux
    发行版的更多信息。


    如果你是 Microsoft Windows 用户，你可能已经拥有一些命令行经验。如果你曾打开 DOS 提示符并执行诸如 `ping`、`nslookup`
    或 `ipconfig` 等命令，那么你知道这些命令极其有用。Unix、Linux 和 BSD 系统提供类似的命令。例如，`ping` 和 `nslookup`
    命令在 Unix/Linux 上的工作原理与在 DOS 中相同。然而，你应注意的是，DOS 中 `ipconfig` 命令在 Unix/Linux/BSD
    世界中的对应命令是 `ifconfig`。如果你不是 DOS 老手，不要担心 - 我们将在本指南中涵盖所有这些主题。


    你正在运行 Mac OS X 吗？如果是，那么你已经在使用一个基于 Unix 的操作系统了。在 Mac OS X 光鲜的图形用户界面背后是一个稳固的 Unix
    核心。要访问 Mac OS X 中的命令行，只需启动“终端”应用程序（位于 **应用程序 > 实用工具 > 终端**）。在那里，你将能够访问本指南中讨论的所有标准
    Unix 命令行实用工具。


    # Unix、Linux 和 BSD 的简要历史


    Unix 于 1969 年在贝尔实验室（Bell Laboratories）创建，该实验室当时是 AT&T 的研究和开发部门。自那时起，Unix 已分支出许多不同的商业和开源实现，其中大多数基于原始的
    AT&T 标准。现代基于 Unix 的系统通常被分为以下几组：


    | 类型 | 描述 |

    | :--- | :--- |

    | Unix | 源自原始 AT&T 代码库的商业实现 |

    | BSD | 源自原始 Unix 代码库的开源操作系统 |

    | Linux | 从头开始编写的开源 Unix 兼容克隆版 |


    在 20 世纪 70 年代，加利福尼亚大学伯克利分校的研究人员开始开发 BSD（Berkeley Software Distribution 的缩写）。BSD
    最初基于 AT&T Unix 代码库，但随着时间的推移已被重写，以从系统中移除 AT&T 的版权代码。这使得 BSD 可以最小限制地进行分发。自那时以来，BSD
    代码库已分裂并形成若干


