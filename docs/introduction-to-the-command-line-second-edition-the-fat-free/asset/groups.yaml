    \ 2 root sales 4096 2009-05-27 16:04 MyDirectory\n```\n*Result of a 775 mode applied\
    \ to a directory*\n\n**Common usage examples:**\n\n- `chmod [MODE] [FILE]`\n \
    \ - Change the permissions on the specified file\n- `chmod [MODE] -R [DIR]`\n\
    \  - Recursively change the permissions on all files\n\n## chown\n\n**Purpose:**\
    \ Change the owner of a file or directory.\n\n**Usage syntax:** `chown [OPTIONS]\
    \ [USER:GROUP] [DIRECTORY/FILE]`\n\n```bash\n# ls -l ShoppingList.txt\n-rw-r--1\
