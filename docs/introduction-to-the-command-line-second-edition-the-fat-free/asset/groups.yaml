  - '[PAGE 21]


    # ls


    **Purpose:** List the contents of a directory.


    **Usage syntax:** `ls [OPTIONS] [DIRECTORY/FILE]`


    ```

    ```

    $ ls

    Notes.txt  ShoppingList.txt  ToDoList.txt

    ```

    ```


    *Typical output of the ls command*


    Executing the **ls** command displays a simple list of files in the current directory,
    as shown in the above example. To see more information about the files in a directory
    you can use command line options to activate additional features, as demonstrated
    in the next example.


    ```

    ```

    $ ls -l

    -rw-r--r--  1 nick sales 35068 2009-05-19 08:41 Notes.txt

    -rw-r--r--  1 nick sales    23 2009-05-19 08:43 ShoppingList.txt

    -rw-r--r--  1 nick sales    37 2009-05-19 08:43 ToDoList.txt

    ```

    ```


    *Using the -l option with the ls command*


    In this example, the **-l** option is used to produce a detailed list of files
    including the permissions, owner, group, and modification date/time. The table
    below describes the output of the **ls -l** command.


    | Permissions | Number of Links | Owner & Group | Size | Modification Date | File
    or Directory |

    |---|---|---|---|---|---|

    | -rw-r--r-- | 1 | nick sales | 35068 | 2009-05-19 08:41 | Notes.txt |


    *Description of fields displayed with the ls -l command*


    Most command line programs have numerous options available. The **ls** command
    is no exception. By combining these options you can activate multiple features
    at the same time. For example, combining the **-a** option with **-l** produces
    a detailed file list that includes hidden files (files begin with a dot).


    ```

    ```

    $ ls -l -a

    drwxr-xr-x  2 nick sales  4096 2009-05-19 21:14 .

    drwxr-xr-x 92 nick sales  4096 2009-05-19 20:46 ..

    -rw-r--r--  1 nick sales   168 2009-05-19 21:14 .MyHiddenFile

    -rw-r--r--  1 nick sales 35068 2009-05-19 08:41 Notes.txt

    -rw-r--r--  1 nick sales    23 2009-05-19 08:43 ShoppingList.txt

    -rw-r--r--  1 nick sales    37 2009-05-19 08:43 ToDoList.txt

    ```

    ```


    *Using multiple options with the ls command*


    (Continued...)'
