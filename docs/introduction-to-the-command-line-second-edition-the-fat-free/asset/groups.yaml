    \ntag> <CTRL + D>\njob 1 at Fri May 29 20:01:00 200\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_119_0.png)\n\
    \nThe **batch** command schedules a program to run when the system CPU load is\
