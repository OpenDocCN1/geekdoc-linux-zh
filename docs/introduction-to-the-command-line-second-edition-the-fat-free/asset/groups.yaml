    \n**用法语法**：`who [OPTIONS]`\n\n```bash\n$ who\nroot  tty2  2010-05-17 11:32\nnick\
    \  tty1  2010-05-17 11:31\nnick  pts/0 2010-05-17 08:40 (10.10.1.251)\ndave  pts/1\
    \ 2010-05-17 12:32 (10.10.1.188)\nmike  pts/2 2010-05-17 14:28 (10.10.1.167)\n\
    lisa  pts/3 2010-05-17 14:50 (10.10.1.204)\nnick  pts/4 2010-05-17 15:33 (10.10.1.251)\n\
    ```\nwho 命令的输出\n\n`who` 命令显示当前登录到系统的用户信息。`who` 命令的默认输出显示用户名、终端 ID 以及用户登录的日期/时间，如上述示例所示。\n\
    \n> **注意**：通过 telnet 或 SSH 会话登录的用户也会显示远程客户端的 IP 地址，位于括号内。\n\n`whoami` 命令显示当前用户的用户名。这在切换不同账户时验证当前可用的用户环境和安全权限时很有用。\n\
    \n**用法语法**：`whoami`\n\n```bash\n$ whoami\nnick\n```\n使用 whoami 显示当前用户的名称\n\n常见用法示例：\n\
    - `who`：显示当前登录到系统的用户\n- `who -b`：显示最后一次系统启动时间\n- `who -r`：显示当前运行级别\n- `whoami`：显示当前用户的名称\n\
    \n## w\n\n用途：显示登录到系统的用户的详细信息。\n\n**用法语法**：`w [OPTIONS] [USER]`\n\n```bash\n$ w\
    \  \n15:39:12 up 4 days, 6:09, 5 users, load average: 0.06, 0.05, 0.01\n```\n\n\
    | USER | TTY | FROM | LOGIN | IDLE | JCPU | PCPU | WHAT |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| nick | pts/0 | 10.10.1.251 | 08:40 |\
    \ 1:10 | 0.18s | 0.15s | -bash |\n| dave | pts/1 | 10.10.1.188 | 12:32 | 0.00s\
    \ | 0.14s | 0.14s | vim |\n| mike | pts/2 | 10.10.1.167 | 14:28 | 0.00s | 0.12s\
    \ | 0.12s | tail |\n| lisa | pts/3 | 10.10.1.204 | 14:50 | 9.00s | 0.14s | 0.14s\
    \ | -bash |\n| nick | pts/4 | 10.10.1.251 | 15:33 | 0.00s | 0.15s | 0.01s | w\
    \ |\n\n`w` 命令的输出\n\n`w` 命令显示登录到系统的用户的详细信息。它与之前讨论的 `who` 命令类似，但提供了额外的信息，如用户最后登录时间、空闲时长以及当前正在运行的程序。\n\
    \n`w` 命令还显示一行系统摘要，显示主机正常运行时间、连接用户数以及过去 1、5 和 15 分钟的系统负载平均值样本。\n\n> 第一行显示的信息与 `uptime`\
    \ 命令生成的输出相同。有关系统正常运行时间和负载平均值的更多信息，请参见第 215 页。\n\n**常见用法示例**：\n\n- `w`：显示当前登录到系统的用户的详细信息\n\
    \n## last / lastb\n\n用途：显示上次成功/失败的用户登录记录。\n\n**用法语法**：`last [OPTIONS] [USER]`\n\
    \n```bash\n$ last\nnick    pts/1      192.168.1.50   Sat May 22 13:42   still\
    \ logged in\nnick    pts/0      192.168.1.50   Sat May 22 13:42   still logged\
    \ in\nnick    tty7        :0            Sat May 22 13:40   still logged in\nreboot\
    \  system boot  2.6.32-21-ge  Sat May 22 13:40 -  14:02  (00:21)\nnick    pts/0\
    \      :0.0          Thu May 20 21:33 -  21:56  (00:03)\nnick    pts/0      :0.0\
    \          Thu May 20 21:30 -  21:33  (00:02)\nroot    pts/0      :0.0       \
    \   Thu May 20 21:27 -  21:30  (00:03)\nnick    tty7        :0          Thu May\
    \ 20 21:25 - crash (1+16:14)\n...\n```\nlast 命令的输出\n\n`last` 命令显示系统中每个用户的登录和注销时间。它还显示有关系统关闭和重启的信息，如上述示例所示。\n\
    \n`lastb` 命令显示失败的登录尝试，如下一个示例所示。\n\n**用法语法**：`lastb [OPTIONS] [USER]`\n\n```bash\n\
    $ lastb\nnick    tty1       Sat May 22 13:59 -  13:59  (00:00)\nnick    tty1 \
    \      Thu May 20 21:27 -  21:27  (00:00)\nroot    tty1       Thu May 20 15:27\
    \ -  15:27  (00:00)\n\nbtmp begins Sat May 20 13:59:28 2010\n```\nlastb 命令的输出\n\
    \n> **注意**：用户登录/注销活动存储在 `/var/log/wtmp` 文件中。失败的登录尝试记录在 `/var/log/btmp` 中。\n\n\
    常见用法示例：\n- `last`：显示最后一次用户登录信息\n- `last -[NUMBER]`：显示指定数量的登录记录\n- `last [USER]`：显示指定用户的最后登录记录\n\
    - `lastb`：显示失败的登录尝试\n- `lastb -[NUMBER]`：显示指定数量的失败登录尝试\n- `lastb [USER]`：显示指定用户的失败登录尝试\n\
    \n## lastlog\n\n用途：显示最近的用户登录信息。\n\n用法语法：`lastlog [OPTIONS]`\n\n```bash\n$ lastlog\
    \ | more\nUsername Port From Latest\nroot tty2 Sat May 30 11:32:33 -0500 2009\n\
    dave tty3 Sat May 30 10:22:51 -0500 2009\nnick pts/0 10.10.1.251 Sat May 30 11:31:51\
    \ -0500 2009\nsteve **Never logged in**\nbin **Never logged in**\nsync **Never\
    \ logged in**\nlp **Never logged in**\n...\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_96_0.png)\n\
    \n`lastlog` 命令显示系统中每个用户的最近一次用户登录时间和日期。不带选项执行 `lastlog` 会显示所有用户的最后登录信息，如上述示例所示。此输出类似于\
    \ `last` 命令，但 `lastlog` 仅显示最新的登录活动，而 `last` 显示所有可用的登录事件。\n\n可以使用 `-u` 选项来显示特定用户的最后登录，如下一个示例所示。\n\
    \n```bash\n$ lastlog -u nick\nUsername Port From Latest\nnick pts/0 10.10.1.251\
    \ Sat May 30 11:31:51 -0500 2009\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_96_1.png)\n\
    \n常见用法示例：\n- `lastlog`：显示所有用户的最后登录信息\n- `lastlog -u [USER]`：显示指定用户的最后登录信息\n\n"
