    \ | 显示交换空间信息。 |\n| `sync` | 刷新文件系统缓冲区。 |\n\n### 本节使用的术语表：\n\n| 术语 | 定义 |\n| :---\
    \ | :--- |\n| 块（Blocks） | 磁盘驱动器上的物理存储单位。 |\n| 文件系统（File System） | 在磁盘驱动器上存储数据的方法和格式。\
    \ |\n| 格式化（Format） | 为特定文件系统准备磁盘驱动器的过程。 |\n| 挂载（Mount） | 将存储设备附加到本地系统的过程。 |\n\
    | 分区（Partition） | 磁盘驱动器的一个划分部分。 |\n| 交换空间（Swap） | 充当 RAM 二级存储的文件或分区。 |\n\n###\
