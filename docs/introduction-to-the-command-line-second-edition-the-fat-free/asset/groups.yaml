    | poweroff | Power off the system. |

    | reboot | Reboot the system. |

    | halt | Halt the system. |

    | telinit | Change the runlevel. |

    | runlevel | Display the previous and current runlevel. |

    | service | Manage services on a Linux system. |

    | sysv-rc-conf | Display and edit Linux runlevel configuration. |

    | chkconfig | Display and edit runlevel configuration on Red Hat Linux-based systems.
    |

    | rc-update | Display and edit runlevel configuration on Gentoo Linux systems.
    |

    | rc-status | Display the status of services on Gentoo Linux systems. |

    | stopsrc, startsrc | Stop/start services on AIX systems. |

    | lssrc | Display the status of services on AIX systems. |

    | svcs | Display the status of services on Solaris systems. |

    | svcadm | Start/stop services on Solaris systems. |'
