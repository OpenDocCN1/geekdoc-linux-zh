    \ report any incorrect results at\nhttp://nmap.org/submit/\nNmap done: 1 IP address\
    \ (1 host up) scanned in 2.94 seconds\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_158_0.png)\n\
    \n**nmap** is a network scanning utility. It can be used to evaluate security\
    \ and troubleshoot network connectivity issues. In the above example, the **nmap**\
    \ command is used to identify the operating system and open ports on the specified\
    \ target host.\n\n> **Tip**\n> *For the best results, use **nmap** as the root\
    \ user or via the **sudo** command. This allows **nmap** to have access to unrestricted\
    \ access to system resources when performing network scans.*\n\n| Command | Description\
    \ |\n| :--- | :--- |\n| `nmap [HOST]` | Display open ports on the specified host\
    \ |\n| `nmap -PN [HOST]` | Do not ping the target before scanning |\n| `nmap -O\
    \ [HOST]` | Display the operating system of the target system |\n| `nmap -A [HOST]`\
    \ | Perform an aggressive scan |\n\n## telnet\n\n**Purpose:** Client for connecting\
    \ to remote servers via the telnet protocol.\n\n**Usage syntax:** `telnet [OPTIONS]\
    \ [HOST]`\n\n```\n$ telnet myserver\nlogin: nick\npassword: ******\n$\n```\n\n\
    ![](img/fa2f95b64a707c963dfa0445bd9281a7_159_0.png)\n\nThe **telnet** command\
    \ is used to connect to remote systems via the telnet protocol. The above example\
    \ demonstrates connecting to a remote system using **telnet**. Once connected\
    \ to the remote system you can execute commands as if you were logged into the\
    \ system locally.\n\n> **Note**\n> *Telnet is an insecure legacy protocol and\
    \ has largely been replaced by SSH for security reasons. Usernames, passwords,\
    \ and other sensitive information transmitted via telnet are sent in plain text\
    \ making it very easy for hackers to capture. Avoid using telnet whenever possible,\
    \ especially when communicating over untrusted networks such as the internet.*\n\
    \n| Command | Description |\n| :--- | :--- |\n| `telnet [HOST]` | Start a telnet\
    \ session to a remote system |\n\n## ssh\n\n**Purpose:** Client for connecting\
    \ to remote servers via the SSH protocol.\n\n**Usage syntax:** `ssh [OPTIONS]\
    \ [HOST]`\n\n```\n$ ssh myserver\nnick@myserver's password: ******\n$\n```\n\n\
    ![](img/fa2f95b64a707c963dfa0445bd9281a7_160_0.png)\n\nThe `ssh` command is used\
    \ to connect to remote systems via the SSH protocol. SSH creates an encrypted\
