    \n## nice\n\n**用途：** 以指定的 CPU 优先级级别执行程序。\n\n**用法语法：** `nice [OPTIONS] [COMMAND]`\n\
    \n```bash\n# nice -n 19 LowPriority.sh\n# nice -n -20 HighPriority.sh\n```\n\n\
    ![](img/fa2f95b64a707c963dfa0445bd9281a7_112_0.png)\n\n`nice` 命令允许以低于或高于常规调度优先级执行程序。这使得您可以控制在内核在运行中的程序之间分配处理器时间时应该偏向哪些进程。`nice`\
    \ 值最低的进程以最高优先级执行，反之亦然。上述示例展示了如何使用 `nice` 以修改后的调度优先级启动程序。\n\n在大多数系统上，*普通用户* 的优先级范围从\
    \ 0 到 19，其中 0 是最高优先级，19 是最低优先级。*root* 用户可以创建优先级范围从 -20（最高）到 19（最低）的进程。\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_112_1.png)\n\
    \n大多数程序默认以 nice 级别 0 启动。关键系统服务通常具有负的 nice 级别，以便它们始终优先于用户程序。\n\n> **注意**\n> 某些\
    \ Unix 系统可能使用 0 到 39 的范围，其中 0 是最高优先级，39 是最低优先级。更多详细信息请参阅本地系统中的 man nice 手册页。\n\
    \n**常见用法示例：**\n\n- `nice -n [NUM] [COMMAND]` 以指定优先级启动程序\n\n## renice\n\n**用途：**\
    \ 更改运行中进程的优先级。\n\n**用法语法：** `renice [OPTIONS] [PID]`\n\n```bash\n# renice +5 -p\
    \ 7279\n7279: old priority 0, new priority 5\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_113_0.png)\n\
    \n`renice` 命令调整运行中进程的优先级。在上面的示例中，PID 7279 被调整为 +5 的优先级。由于之前的优先级是 0，这实际上降低了该进程的优先级。\n\
    \n**常见用法示例：**\n\n- `renice +/-[NUM] -p [PID]` 更改指定 PID 的优先级\n\n## &\n\n**用途：**\
    \ 在后台启动进程。\n\n**用法语法：** `[COMMAND] &`\n\n```bash\n$ ./SomeProgram.sh &\n[1] 10717\n\
    $ ps\n\n      PID TTY          TIME CMD\n    10696 pts/0    00:00:00 bash\n  \
    \  10717 pts/0    00:00:03 SomeProgram.sh\n    10721 pts/0    00:00:00 ps\n```\n\
    \n使用 & 命令行运算符在后台执行程序\n\n& 是一个命令行运算符，指示 shell 在后台启动指定的程序。这允许您同时运行多个程序，而无需启动多个终端会话。在上面的示例中，名为\
    \ `SomeProgram.sh` 的 shell 脚本作为后台进程启动。执行 `ps` 命令显示该程序现在正在后台运行。\n\n> **注意**\n>\
    \ 后台程序的输出仍会在 shell 中显示。您可以使用以下语法将输出重定向到文件：`SomeProgram.sh > output.log &`。这会将后台程序的所有输出重定向到当前目录中名为\
    \ `output.log` 的文件。\n\n**常见用法示例：**\n\n- `[COMMAND] &` 在后台执行指定命令\n- `[COMMAND]\
    \ > [FILE] &` 将后台命令的输出重定向到文件\n\n## bg / fg\n\n**用途：** 将进程移至后台/前台。\n\n**用法语法：**\
    \ `bg [JOBID]`\n\n```bash\n$ ./SomeProgram.sh\n<CTRL + Z>\n[1]+ Stopped      SomeProgram.sh\n\
    $ bg 1\n$ jobs\n[1]- Running      SomeProgram.sh\n```\n\n挂起正在运行的程序，然后在后台恢复它\n\n\
    `bg` 命令将进程发送到后台。这允许您在单个终端会话中多任务处理多个程序。在上面的示例中，shell 脚本 `SomeProgram.sh` 被挂起（通过在键盘上按下\
    \ **CTRL + Z**），然后使用 `bg` 作为后台进程恢复。\n\n> **注意**\n> 可以使用 `jobs` 命令（见第 117 页）来验证程序现在是否在后台运行。\n\
    \n`fg` 命令将后台进程移至前台。在下一个示例中，使用 `fg` 命令将指定的作业 ID 移至前台。\n\n**用法语法：** `fg [JOBID]`\n\
    \n```bash\n$ jobs\n[1]- Running      SomeProgram.sh\n$ fg 1\nSomeProgram.sh\n\
    ...\n```\n\n将后台作业移至前台\n\n**常见用法示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `bg [JOBID]`\
    \ | 将指定作业发送到后台 |\n| `fg [JOBID]` | 将指定作业移至前台 |\n\n## jobs\n\n**用途：** 显示后台和挂起的作业。\n\
    \n**用法语法：** `jobs [OPTIONS]`\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_116_0.png)\n\
    \n`jobs` 命令显示后台程序和挂起进程的状态。在上面的示例中，显示了三个后台作业。之前提到的 `fg` 和 `bg` 命令可以分别用于将进程移至前台和后台。\n\
    \n下表描述了 `jobs` 命令的输出字段。\n\n| 作业 ID | 状态 | 程序 |\n| :--- | :--- | :--- |\n| `[1]-`\
    \ | Running | `SomeProgram.sh` |\n| `[2]+` | Stopped | `AnotherProgram.sh` |\n\
    | `[3]` | Stopped | `Test.sh` |\n\njobs 命令的输出字段\n\n> **注意**\n> 加号用于指示被视为默认作业的项（用于与\
    \ `bg` 和 `fg` 命令配合使用）。减号指示如果当前默认作业终止，将变为默认的下一个作业。在任何给定时间，只能有一个 `+` 和一个 `-`。所有其他作业将没有任何指示符。\n\
    \n**常见用法示例：**\n\n- `jobs` 显示所有作业\n- `jobs -1` 显示所有作业及其 PID\n\n## nohup\n\n**用途：**\
    \ 运行对挂起信号免疫的进程。\n\n**用法语法：** `nohup [COMMAND] &`\n\n```bash\n$ nohup SomeProgram.sh\
    \ &\nnohup: ignoring input and appending output to 'nohup.out'\n$ exit\n```\n\n\
    使用 nohup 命令启动后台程序\n\n**nohup** 命令使进程对挂起信号免疫。挂起信号用于通知 shell 的子进程父进程正在终止。这通常会导致所有子进程终止。使用\
    \ **nohup** 可以允许程序在您注销后继续运行，如上述示例所示。\n\n> **提示**\n> 程序的输出将存储在名为 `nohup.out` 的文件中，该文件位于执行\
    \ nohup 命令的目录中。\n\n**常见用法示例：**\n\n- `nohup [COMMAND] &` 执行对挂起信号免疫的程序\n\n## at\
    \ / atq / atrm\n\n**用途：** 调度程序在指定时间运行。\n\n**用法语法：** `at [OPTIONS] [TIME|DATE]`\n\
    \n```bash\n$ at 1am\nat> MyProgram.sh\nat> <CTRL + D>\njob 1 at Sat May 30 01:00:00\
    \ 2009\n```\n\n使用 at 命令调度进程\n\nat 命令调度程序在指定时间运行。在上面的示例中，使用 at 命令启动名为 MyProgram.sh\
    \ 的 shell 脚本。在此示例中，命令行指定的启动时间为凌晨 1 点。您还可以使用更传统的 Unix 时间指定方式，例如 01:00 或任何其他 HH:MM\
    \ 组合。\n\n> **提示**\n> at 命令有一个名为 *now* 的特殊命令行参数。\n> 这可以用作快捷方式，在调度作业时节省时间。例如，输入\
    \ `at now + 15 minutes` 将调度作业在当前时间 15 分钟后启动。\n\natq 命令显示队列中 at 作业的信息，如下一个示例所示。\n\
    \n**用法语法：** `atq`\n\n```bash\n$ atq\n1 Sat May 30 01:00:00 2009 MyProgram.sh nick\n\
    ```\n\n使用 atq 命令显示作业队列\n\natrm 命令删除已调度的作业，如下一个示例所示。\n\n**用法语法：** `atrm [JOBID]`\n\
    \n```bash\n$ atrm 1\n```\n\n使用 atrm 命令移除已调度的作业\n\n**常见用法示例：**\n\n| 命令 | 描述 |\n\
