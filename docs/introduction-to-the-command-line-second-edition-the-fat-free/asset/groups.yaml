    1 port     Core I/O Adapter\n8/16       ba           Initiator\n8/16/0     ext_bus\
    \      Built-in Parallel Interface\n8/16/4     tty          Built-in RS-232C\n\
    8/16/5     ext_bus      Built-in SCSI\n8/16/5.0   target\n8/16/5.0.0 tape    \
