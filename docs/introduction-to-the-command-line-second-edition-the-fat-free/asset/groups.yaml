    - `parted -l [DEVICE]` 列出指定设备上的分区表\n- `parted [DEVICE]` 打开指定设备以进行编辑\n\n### mkfs\n\
    \n**用途：** 创建文件系统。\n\n**用法语法：** `mkfs [OPTIONS] [DEVICE]`\n\n```\n# mkfs -t ext4\
