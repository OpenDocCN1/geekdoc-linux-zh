    \n```bash\n$ chmod 775 MyDirectory\n$ ls -ld MyDirectory\ndrwxrwxr-x 2 root sales\
    \ 4096 2009-05-27 16:04 MyDirectory\n```\n*应用于目录的 775 模式的结果*\n\n**常见用法示例：**\n\n\
    - `chmod [MODE] [FILE]`\n  - 更改指定文件的权限\n- `chmod [MODE] -R [DIR]`\n  - 递归更改所有文件的权限\n\
    \n## chown\n\n**用途：** 更改文件或目录的所有者。\n\n**语法：** `chown [OPTIONS] [USER:GROUP] [DIRECTORY/FILE]`\n\
    \n```bash\n# ls -l ShoppingList.txt\n-rw-r--1 nick nick 23 2009-05-27 22:31 ShoppingList.txt\n\
    # chown root ShoppingList.txt\n# ls -l ShoppingList.txt\n-rw-r--1 root nick 23\
    \ 2009-05-27 22:31 ShoppingList.txt\n```\n\n**chown** 命令用于更改文件或目录的所有者。在上面的示例中，`ShoppingList.txt`\
    \ 文件的所有者从 *nick* 更改为 **root**。\n\n下一个示例演示了如何使用 **chown** 命令同时更改文件的所有者和组。\n\n```bash\n\
    # ls -l ShoppingList.txt\n-rw-r--1 root nick 23 2009-05-27 22:31 ShoppingList.txt\n\
    # chown nick:sales ShoppingList.txt\n# ls -l ShoppingList.txt\n-rw-r--1 nick sales\
    \ 23 2009-05-27 22:31 ShoppingList.txt\n```\n\n执行 `chown nick:sales ShoppingList.txt`\
    \ 命令后，`ShoppingList.txt` 文件的所有者更新为 *nick*，组更新为 *sales*。\n\n> **提示**\n> 如果你只需要更改文件的组，可以使用\
    \ `chgrp` 命令（详见第 88 页）。\n\n**常见用法示例：**\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `chown\
    \ [USER] [FILE]` | 更改文件的所有者 |\n| `chown [USER]:[GROUP] [FILE]` | 更改文件的所有者和组 |\n\
    | `chown -R [USER] [DIR]` | 递归更改指定目录中所有文件的所有者 |\n\n## chgrp\n\n**用途：** 更改文件和目录的组。\n\
    \n**语法：** `chgrp [OPTIONS] [GROUP] [DIRECTORY/FILE]`\n\n```bash\n# ls -l ShoppingList.txt\n\
    -rw-r--r-- 1 root root  23 2009-05-27 22:31 ShoppingList.txt\n# chgrp sales ShoppingList.txt\n\
    # ls -l ShoppingList.txt\n-rw-r--r-- 1 root sales 23 2009-05-27 22:31 ShoppingList.txt\n\
    ```\n\n*使用 chgrp 命令更改文件的组*\n\n**chgrp** 命令用于更改文件或目录的组。在上面的示例中，使用 **chgrp** 命令将\
    \ `ShoppingList.txt` 文件的组从 **root** 更改为 **sales**。\n\n**常见用法示例：**\n\n| 命令 | 描述\
    \ |\n| :--- | :--- |\n| `chgrp [GROUP] [FILE]` | 将文件的组更改为指定组 |\n| `chgrp -R [DIR]`\
    \ | 递归更改所有文件的组 |\n\n## umask\n\n**用途：** 显示/设置用户的默认文件创建掩码。\n\n**语法：** `umask [OPTIONS]\
    \ [MODE]`\n\n```bash\n$ umask\n022\n```\n\n*显示当前用户的 umask*\n\n**umask** 控制用户的默认文件创建掩码。这决定了将分配给新创建的文件和目录的权限。要确定文件/目录创建模式，umask\
    \ 值将从目录的 777 和文件的 666 中减去。例如，umask 为 022 将为文件创建有效权限 644 (`rw-r-x--`)，为目录创建有效权限\
    \ 755 (`rwxr-xr-x`)。\n\n在某些系统中，可以使用 **-S** 选项以更易读的符号形式显示 umask 值，如下一个示例所示。\n\n\
    ```bash\n$ umask -S\nu=rwx, g=rx, o=rx\n```\n\n*以符号表示法显示 umask*\n\n**umask** 命令还可以用于更改\
    \ umask 值，如下一个示例所示。\n\n```bash\n$ umask 077\n```\n\n*设置 umask 值*\n\n在此示例中，umask\
    \ 值为 077 将为文件创建有效权限 600 (`rw------`)，为目录创建有效权限 700 (`rwx-----`)。\n\n> **注意**\n\
    > 在命令行中指定的 umask 值会在你注销时重置。若要使 umask 永久生效，必须将其添加到用户主目录中的 `.profile` 文件或 `/etc/profile`（针对所有用户）。\n\
    \n**常见用法示例：**\n\n- `umask`\n  - 以八进制格式显示 umask\n- `umask -S`\n  - 以符号格式显示 umask\n\
    - `umask [MODE]`\n  - 将 umask 设置为指定值\n\n## su\n\n**用途：** 切换用户账户。\n\n**语法：** `su\
    \ [OPTIONS] [USER]`\n\n```bash\n$ whoami\nnick\n$ su\nPassword: ******\n# whoami\n\
    root\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_89_0.png)\n\n**su** 命令（**Switch\
    \ User** 的缩写）允许你先不注销系统就登录为另一个用户。在上面的示例中，普通用户使用 **su** 切换到 root 用户账户。请注意，当你成为 root\
    \ 用户时，你的 shell 提示符会从 `$` 变为 `#`。作为 root 用户，你现在可以运行需要提升特权的命令。\n\n> **提示**\n> 你应始终限制以\
