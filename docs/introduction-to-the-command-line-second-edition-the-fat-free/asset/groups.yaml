    Starting a service with the svcadm command


    The `svcadm` command controls services on Solaris systems. It can be used to start,
    stop, and restart services. In the above example, the **enable** parameter is
    used to start the sendmail service. The next example demonstrates using the **disable**
    parameter to stop the sendmail service.


