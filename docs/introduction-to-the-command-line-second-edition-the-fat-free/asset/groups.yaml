    \      Iface\n10.10.2.1     ether    00:06:B1:12:0D:16   C                   \
    \  eth1\n10.10.2.5     ether    00:14:22:0E:35:5C   C                     eth1\n\
    10.10.2.6     ether    00:0C:29:1B:10:70   C                     eth1\n10.10.2.7\
    \     ether    00:0C:29:C1:C2:0C   C                     eth1\n10.10.2.10    ether\
    \    00:0C:29:38:00:F6   C                     eth1\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_145_0.png)\n\
    \n**arp** 命令用于显示 ARP 缓存。本地网络使用 ARP 与邻近系统进行通信。ARP 协议将 IP 地址解析为目标系统的 MAC 地址。已解析的地址存储在一个缓存中，可以使用\
    \ **arp** 命令进行显示，如上例所示。\n\n**常见用法示例：**\n\n- `arp` 显示地址解析协议缓存\n\n## ping\n\n**用途：**\
    \ 向网络主机发送 ICMP 回显请求。\n\n**用法语法：** `ping [OPTIONS] [HOST]`\n\n```bash\n$ ping -c\
    \ 5 10.10.1.1\nPING 10.10.1.1 (10.10.1.1) 56(84) bytes of data.\n64 bytes from\
    \ 10.10.1.1: icmp_seq=1 ttl=64 time=0.286 ms\n64 bytes from 10.10.1.1: icmp_seq=2\
    \ ttl=64 time=0.235 ms\n64 bytes from 10.10.1.1: icmp_seq=3 ttl=64 time=0.232\
    \ ms\n64 bytes from 10.10.1.1: icmp_seq=4 ttl=64 time=0.212 ms\n64 bytes from\
    \ 10.10.1.1: icmp_seq=5 ttl=64 time=0.216 ms\n--- 10.10.1.1 ping statistics ---\n\
    5 packets transmitted, 5 received, 0% packet loss, time 4002ms\n```\n\n使用 ping\
    \ 命令向网络主机发送 ping\n\n`ping` 命令向网络主机发送 ICMP 回显请求。这在排查网络连接问题时非常有用。在上例中，执行 `ping -c\
    \ 5` 会向 IP 地址为 10.10.1.1 的主机发送五个 ping 数据包。\n\n> **注意** *如果省略 `-c` 参数，`ping` 命令将持续执行直到被中断（按\
    \ CTRL + C）。*\n\n> **提示** *`ping6` 命令用于向 IP 版本 6 的主机发送 ping。*\n\n**常见用法示例：**\n\
    \n- `ping [HOST]` — 向指定主机发送 ping\n- `ping -c [NUM] [HOST]` — 发送指定数量的 ICMP 数据包\n\
    - `ping -f [HOST]` — 执行快速（洪泛）ping\n\n## traceroute\n\n**用途：** 显示 TCP/IP 路由信息。\n\
    \n**用法语法：** `traceroute [OPTIONS] [HOST]`\n\n```bash\n$ traceroute -n www.google.com\n\
    traceroute to www.google.com (74.125.95.103), 30 hops max, 60 byte packets\n1\
    \  192.168.1.254  3.634 ms  3.758 ms  4.511 ms\n2  99.60.32.2  25.398 ms  27.472\
    \ ms  28.040 ms\n3  76.196.172.4  28.261 ms  29.739 ms  28.926 ms\n4  151.164.94.52\
    \  29.057 ms  29.583 ms  29.824 ms\n5  69.220.8.57  39.645 ms *  40.455 ms\n6\
    \  72.14.197.113  41.461 ms  39.534 ms  39.995 ms\n7  72.14.233.67  39.437 ms\
    \  72.14.233.65  31.567 ms  36.633 ms\n8  216.239.47.121  42.631 ms  43.298 ms\
    \  216.239.47.131 44.649 ms\n...\n```\n\n使用 traceroute 显示 TCP/IP 数据包的路由\n\n**traceroute**\
    \ 命令用于追踪数据包在 TCP/IP 网络中经过的路径。上述示例演示了如何使用 **traceroute** 命令显示到 www.google.com 的网络路由。沿网络路径的路由器（又称跳数）会被识别，并附带响应时间（以毫秒为单位）。\n\
    \n> **提示** ***traceroute6** 命令用于追踪 IP 版本 6 的主机。*\n\n**常见用法示例：**\n\n| 命令 | 描述 |\n\
    |:---|:---|\n| `traceroute [HOST]` | 追踪到指定主机的路由 |\n| `traceroute -n [HOST]` |\
    \ 追踪时不查找 DNS 名称 |\n\n"
