    # ## **wall**


    Purpose: Broadcast a message to all users on the system.


    Usage syntax: `wall [FILE]`


    ```

    ```text

    # wall

    Anyone want some tacos?


    <CTRL + D>

    ```

    ```


    Using the wall command to send a message to all users logged into the system


    The `wall` command sends a message to all users currently logged into the system.
    The text entered in the above example will display on all local terminals and
    remote sessions currently logged into the system.


    > **Note** *Pressing CTRL + D ends the message editor and sends the message.*


    The next example displays a sample of the `wall` message output as seen by other
    users on the system.


    ```

    ```text

    $


    Broadcast Message from root@e6400 (/dev/pts/0) at 11:56 ...


    Anyone want some tacos?

    ```

    ```


    Output of the wall message displayed on all terminals


    In place of manually entering a message, a text file with a prewritten message
    can be used with the wall command, as shown in the next example.


    ```

    ```bash

    # wall /home/nick/message.txt

    ```

    ```


    Using a text file to send a message with the wall command


    Common usage examples:


    +   - `wall` |

    +     - Send a message to all users

    +   - `wall [FILE]` |

    +     - Send the message in the specified file to all users'
