  - '[PAGE 131]


    # chkconfig


    Purpose: Display and edit runlevel configuration on Red Hat Linux-based systems.


    Usage syntax: `chkconfig [OPTIONS] [SERVICE] [ON|OFF] [LEVEL]`


    ```

    # chkconfig -1


    | | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |

    |---|---|---|---|---|---|---|

    | acpi-support | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |

    | acpid | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |

    | alsa-utils | 0:off | 1:off | 2:off | 3:off | 4:off | 5:off | 6:off |

    | anacron | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |

    | apache2 | 0:off | 1:off | 2:off | 3:off | 4:off | 5:off | 6:off |

    | apport | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |

    | ... | | | | | | |


    ```


    Listing service configuration with the chkconfig command


    The `chkconfig` command manages services on Red Hat Linux systems. The `-1` parameter
    lists the current runlevel configuration, as shown in the above example. If no
    service is specified, all services will be displayed. Specifying a service name
    will display the runlevel configuration for the service, as shown in the next
    example.


    ```

    # chkconfig -1 apache2


    | | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |

    |---|---|---|---|---|---|---|

    | apache2 | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |


    ```


    Listing a specific service with the chkconfig command


    The `-s` option is used to enable or disable services at the specified run levels
    as demonstrated in the next example.


    ```

    # chkconfig -s apache2 off 2345

    # chkconfig -1 apache2


    | | 0:off | 1:off | 2: off | 3: off | 4: off | 5:off | 6:off |

    |---|---|---|---|---|---|---|

    | apache2 | 0:off | 1:off | 2: off | 3: off | 4: off | 5:off | 6:off |


    # chkconfig -s apache2 on 2345

    # chkconfig -1 apache2


    | | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |

    |---|---|---|---|---|---|---|

    | apache2 | 0:off | 1:off | 2:on | 3:on | 4:on | 5:on | 6:off |


    ```


    Managing services with the chkconfig command


    Common usage examples:


    +   - `chkconfig -1` List runlevel configuration for all services

    +   - `chkconfig -1 [SERVICE]` List a service''s current configuration

    +   - `chkconfig -s [SERVICE] \ on [LEVEL]` Enable a service on the specified
    level(s)

    +   - `chkconfig -s [SERVICE] \ off [LEVEL]` Disable a service on the specified
    level(s)'
