    \ ******\n$ whoami\nsteve\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_89_1.png)\n\
    \n**常见用法示例：**\n\n- `su`\n  - 切换到 root 用户账户\n- `su -`\n  - 切换到 root 用户账户并加载 root\
    \ 的配置\n- `su [USERNAME]`\n  - 切换到指定的用户名\n\n"
