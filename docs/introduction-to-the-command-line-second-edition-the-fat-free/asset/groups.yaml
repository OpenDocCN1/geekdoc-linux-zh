    \    Full Name [:] : **Mike Smith**\n    Room Number [:] : **Computer Room**\n\
    \    Work Phone [:] : **555-1212**\n    Home Phone [:] :\nIs the information correct?\
    \ [y/N] y\nCreating a user with the adduser command\n```\n\nThe **adduser** command\
    \ is a user-friendly frontend for the previously discussed **useradd** command.\
    \ It simplifies the creation of user accounts on Linux systems by prompting for\
    \ necessary information when creating accounts (rather than having to specify\
    \ a number of command line options). The above example demonstrates the typical\
    \ usage of the **adduser** command.\n\nThe **deluser** command deletes user accounts\
    \ as shown in the next example.\n\n**Usage syntax:** `deluser [OPTIONS] [USER]`\n\
    \n```\n# deluser mike\nRemoving user 'mike' ...\nWarning: Removing group 'mike',\
    \ since no other user is part of it.\nDone.\nRemoving a user with the deluser\
    \ command\n```\n\n> **Note**  *Default settings for the adduser and deluser commands\
    \ are stored in /etc/adduser.conf and /etc/deluser.conf.*\n\n+   **Common usage\
    \ examples:**\n+   `adduser [USER]`    Create a user account\n+   `deluser [USER]`\
