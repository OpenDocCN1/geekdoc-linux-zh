    > CTRL + L is a keyboard shortcut to clear the screen in the Bash shell. See Appendix\
    \ A for more information about Bash shortcut keys.\n\n**Common usage examples:**\n\
    \n| Command | Description |\n| :--- | :--- |\n| `clear` | Clear the contents of\
