    **Common usage examples:**


    - `lsmod` List installed kernel modules


    ## insmod / rmmod


    **Purpose:** Install/remove kernel modules.


    **Usage syntax:** `insmod [MODULE]`


    ```bash

    # insmod /lib/modules/2.6.24-7-server/kernel/drivers/block/floppy.ko

    # lsmod | grep floppy

    floppy 59332 0

    ```


    Loading a module into the kernel


    The **insmod** command is used to install kernel modules on Linux systems. The
    above example demonstrates using **insmod** to install the `floppy.ko` module,
    which adds support to the system for floppy disk drives.


    The **rmmod** command unloads modules from the kernel. The next example demonstrates
    removing the previously loaded `floppy.ko` module using the **rmmod** command.


    **Usage syntax:** `rmmod [MODULE]`


    ```bash

    # rmmod floppy

    ```


    Removing a kernel module


    **insmod** and **rmmod** are Linux commands. Similar commands exist on other platforms
    and are detailed in the following cross-reference table.


    Kernel module command cross-reference


    **Common usage examples:**


    - `insmod [MODULE]` Load the specified module into the kernel

    - `rmmod [MODULE]` Unload the specified module


    ## modinfo


    **Purpose:** Display information about Linux kernel modules.


    **Usage syntax:** `modinfo [OPTIONS] [MODULE]`


    ```bash

    $ modinfo nfs

    filename: /lib/modules/2.6.28-l1-generic/kernel/fs/nfs/nfs.ko

    license: GPL

    author: Olaf Kirch <okir@monad.swb.de>

    srcversion: A400A4357849F5E18225B6F

    depends: sunrpc,lockd,nfs_acl

    vermagic: 2.6.28-l1-generic SMP mod_unload modversions

    parm: enable_ino64:bool

    ```


    Using the modinfo command to display information about the NFS module


    modinfo displays information about Linux kernel modules. It includes helpful information
    such as the file location, license, version, and dependencies for the module.
    The above example demonstrates using modinfo to display information about the
    NFS kernel module.


    > **Note**

    >

    > *Linux kernel modules typically are stored in the /var/lib/modules directory.*


    **Common usage examples:**


    - `modinfo [MODULE]`    Display information about the specified module


    ## sysctl


    **Purpose:** Display and edit kernel parameters on Linux and BSD systems.


    **Usage syntax:** `sysctl [OPTIONS]`


    ```bash

    $ sysctl -a

    kernel.sched_shares_ratelimit = 500000

    kernel.sched_shares_thresh = 4

    kernel.sched_child_runs_first = 1

    kernel.sched_features = 24191

    kernel.sched_migration_cost = 500000

    kernel.sched_nr_migrate = 32

    kernel.sched_rt_period_us = 1000000

    kernel.sched_rt_runtime_us = 950000

    kernel.sched_compat_yield = 0

    kernel.panic = 0

    kernel.core_uses_pid = 0

    kernel.core_pattern = core

    ...

    ```


    Displaying kernel parameters


    The sysctl command displays and edits tunable kernel parameters. This allows you
    to fine tune various aspects of the operating system.


    > **Warning** You should not change these values unless you fully understand the
    impact of the parameter you are setting.


    Kernel parameters are typically stored in the /etc/sysctl.conf file. Settings
    changed on the command line via sysctl will be lost at reboot unless they are
    added to the sysctl.conf file.


    > **Note** HP-UX and Solaris use the sysdef command in place of sysctl. AIX systems
    use the tunchange command.


    **Common usage examples:**


    - `sysctl -a`   Display all kernel parameters

    - `sysctl -w [SETTING]=[VALUE]` Set the specified kernel parameter

