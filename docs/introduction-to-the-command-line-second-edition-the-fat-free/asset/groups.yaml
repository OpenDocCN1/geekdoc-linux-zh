    # su


    **Purpose:** Switch user accounts.


    **Usage syntax:** `su [OPTIONS] [USER]`


    ```

    ```

    $ whoami

    nick

    $ su

    Password: ******

    # whoami

    root

    ```

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_89_0.png)


    The **su** command (short for **Switch User**) allows you to login as another
    user without having to first log out of the system. In the above example **su**
    is used by a normal user to switch to the root user account. Notice that when
    you become the root user your shell prompt changes from `\$` to `\#`. As the root
    user you can now run commands that require elevated privileges.


    > Tip

    > You should always limit the amount of time you spend logged in as the root user.
    This is a good practice that can help reduce accidents.


    By default, executing **su** with no arguments switches to the root user account.
    A user name can be specified with **su** to become a different user as shown in
    the next example.


    ```

    ```

    $ whoami

    nick

    $ su steve

    Password: ******

    $ whoami

    steve

    ```

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_89_1.png)


    **Common usage examples:**


    +   su

    +   |  |

    +   | :---- | :---- |

    +   | | Switch to the root user account |

    +   | su - | Switch to the root user account and load root''s profile |

    +   | su [USERNAME] | Switch to the specified username |'
  md: "\n## chmod\n\n**Purpose:** Change file and directory permissions.\n\n**Usage\
    \ syntax:** `chmod [OPTIONS] [MODE] [DIRECTORY/FILE]`\n\n```bash\n# chmod 664\
    \ ShoppingList.txt\n# ls -l ShoppingList.txt\n-rw-rw-r-- 1 root root 23 2009-05-27\
    \ 22:31 ShoppingList.txt\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_84_0.png)\n\
    \nThe **chmod** command sets permissions on files and directories. By default,\
    \ permissions are specified in numerical (octal) format such as 664 as shown in\
    \ the above example. In octal form, three digits are used to represent owner,\
    \ group, and everyone else’s permissions. The first number represents the owner’s\
    \ permissions, the second number is the group’s permissions, and the third number\
    \ is for everyone else.\n\nThe table below provides a cross reference of symbolic\
    \ and octal permissions.\n\n| **Permission** | **Symbolic** | **Octal** |\n| :---:\
    \ | :---: | :---: |\n| **Read** | `r` | **4** |\n| **Write** | `w` | **2** |\n\
    | **Execute** | `x` | **1** |\n| **None** | – | **0** |\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_84_1.png)\n\
    \nThe sum of the octal permissions becomes what is known as the *mode*. The valid\
    \ modes are described in the following table.\n\n| **Mode** | **Octal** | **Symbolic**\
    \ | **Effective Permission** |\n| :---: | :---: | :---: | :--- |\n| **7** | 4+2+1\
    \ | `rwx` | Read/Write/Execute |\n| **6** | 4+2 | `rw-` | Read/Write |\n| **5**\
    \ | 4+1 | `r-x` | Read/Execute |\n| **4** | 4 | `r--` | Read |\n| **0** | 0 |\
    \ `---` | None |\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_84_2.png)\n\nThe\
    \ combination of 3 modes determines the permissions for the file. A mode of 664\
    \ would create `rw-rw-r--` permissions giving read/write access to the user and\
    \ group, and read only to everyone else.\n\nThe concept of permissions on Unix,\
    \ Linux, and BSD systems can be hard to grasp at first. Several additional examples\
    \ are provided below to help clarify this topic.\n\n**Example 1**: A mode of 660\
    \ would provide read/write access to the owner and group and no access to everyone\
    \ else.\n\n```bash\n# chmod 660 MyFile\n# ls -l MyFile\n-rw-rw---- 1 root sales\
    \ 23 2009-05-27 22:31 MyFile\n```\n*Result of a 660 mode*\n\n**Example 2**: A\
    \ mode of 755 would provide full access to the owner and read/execute access for\
