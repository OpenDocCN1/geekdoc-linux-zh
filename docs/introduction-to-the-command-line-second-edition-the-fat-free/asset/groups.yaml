    \ : 真正刷新文件系统缓冲区\n\n## 第 11 章：备份和恢复命令\n\n### 概述\n\n本章涵盖了用于备份和恢复文件的实用工具。创建一个良好的备份对于从系统故障或自然灾害中恢复非常重要。大多数系统都内置了一些备份程序。这些程序可以创建完整、部分和增量备份，并且应将其纳入您的灾难恢复计划中。\n\
    \n**本章涵盖的命令：**\n\n| 命令 | 用途 |\n|---|---|\n| **tar** | 创建/提取归档文件。 |\n| **dump**\
    \ | 创建增量备份。 |\n| **restore** | 从 dump 归档恢复文件。 |\n| **dd** | 创建数据设备的原始副本。 |\n|\
    \ **cpio** | 创建/提取 cpio 归档。 |\n| **mt** | 控制磁带设备。 |\n| **mksysb** | 创建 AIX 系统的备份镜像。\
    \ |\n\n**本章使用的术语表：**\n\n- **完整备份**：包含本地系统上所有文件的备份。\n- **增量备份**：仅包含自上次完整备份以来已更改文件的备份。\n\
    \n## tar\n\n**用途：** 创建/提取归档文件。\n\n**用法语法：** `tar [OPTIONS] [OUTPUT] [INPUT]`\n\
    \n```bash\n# tar -cvf backup.tar /etc/*\n/etc/acpi/\n/etc/acpi/stoptbtn.sh\n/etc/acpi/videobtn.sh\n\
    /etc/acpi/ibm-wireless.sh\n/etc/acpi/hibernate.sh\n/etc/acpi/resume.d/\n /etc/acpi/resume.d/15-video-post.sh\n\
    \ /etc/acpi/resume.d/62-ifup.sh\n /etc/acpi/resume.d/10-thinkpad-standby-led.sh\n\
    ...\n```\n\n使用 tar 命令创建 /etc 目录的备份归档\n\ntar 命令用于创建和提取 tar 归档。它是 Unix、Linux 和 BSD\
    \ 系统上最常用的创建备份的实用工具。在上一个示例中，-cvf 选项用于创建一个名为 backup.tar 的 /etc 目录的备份归档。\n\n在下一个示例中，-xvf\
    \ 选项用于从第一个示例中创建的归档中提取 /etc/hosts 文件。\n\n```bash\n# tar -xvf backup.tar etc/hosts\n\
    etc/hosts\n```\n\n从 tar 归档中提取文件\n\n> **注意**  \n> tar 命令的默认操作会去除文件路径中的前导 /。这意味着从\
    \ tar 归档恢复的文件将被放置在与当前目录相关的位置。可以指定 -p 选项来覆盖此行为。\n\n**常见用法示例：**\n\n- `tar -cvf [FILE]\
    \ [ITEM]` 备份指定项\n- `tar -czvf [FILE] [ITEM]` 压缩归档以节省空间\n- `tar -xvf [FILE] [ITEM]`\
    \ 恢复指定项\n- `tar -tf [FILE]` 列出指定归档中的所有文件\n\n## dump\n\n**用途：** 创建增量备份。\n\n**用法语法：**\
    \ `dump [OPTIONS] [OUTPUT] [INPUT]`\n\n```bash\n# dump -0 -uf backup.dump /\n\
    ```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_193_0.png)\n\ndump 是一个创建增量备份的归档实用工具。在上述示例中，-0\
    \ 选项表示将 / 文件系统进行完整备份到名为 backup.dump 的文件中。\n\n后续的增量备份指定为 -1、-2、-3 等。后续备份将仅归档自上次完整备份以来已更改的文件。这可以在创建备份时节省时间和存储空间，但恢复时需要更长的时间，因为增量备份必须分层恢复。\n\
    \n> **注意** *有关已备份文件的信息存储在一个名为 dumpdates 的文件中。在 Unix 系统中，此文件通常位于 /etc/dumpdates。Linux\
    \ 系统将此信息存储在 /var/lib/dumpdates 中。*\n\n**常见用法示例：**\n\n- `dump -0 -uf [OUTPUT] [INPUT]`\
    \ 创建完整备份\n- `dump -[NUM] -uf [OUTPUT] [INPUT]` 创建增量备份\n\n## restore\n\n**用途：**\
    \ 从 dump 归档恢复文件。\n\n**用法语法：** `restore [OPTIONS] [FILE]`\n\n```bash\n# restore\
    \ -if backup.dump\nrestore > pwd\n/\nrestore > cd etc\nrestore > add hosts\nrestore\
    \ > extract\n...\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_194_0.png)\n\
    \n**restore** 命令用于从使用 **dump** 命令创建的归档中恢复文件。上述示例演示了如何启动交互式 **restore** shell 以从\
    \ **dump** 归档中提取文件。\n\n下表描述了基本的 **restore** shell 命令。\n\n| **命令** | **功能** |\n\
    | :--- | :--- |\n| `ls [PATH]` | 列出当前或指定目录的内容 |\n| `cd [PATH]` | 在 dump 归档中导航\
    \ |\n| `pwd` | 显示当前工作目录 |\n| `add [PATH]` | 将当前目录（或指定项）添加到恢复列表 |\n| `delete [PATH]`\
    \ | 从恢复列表中删除当前目录（或指定项） |\n| `extract` | 提取恢复列表中的所有文件 |\n| `help` | 显示帮助菜单 |\n\
    | `quit` | 退出 restore shell |\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_194_1.png)\n\
    \n**常见用法示例：**\n\n- `restore -if [FILE]` 在 restore shell 中打开指定的归档\n- `restore -rf\
    \ [FILE]` 从 dump 归档恢复整个文件系统\n- `restore -tf [FILE]` 列出指定 dump 归档中的所有项\n\n## dd\n\
    \n**用途：** 创建数据设备的原始副本。\n\n**用法语法：** `dd if=[SOURCE] of=[TARGET] [OPTIONS]`\n\n\
    ```bash\n# dd if=/dev/sdb of=/dev/sdc\n```\n\n使用 dd 命令创建磁盘的副本\n\n`dd` 命令执行数据设备的原始（逐位）复制。`if`\
    \ 参数指定要读取的输入文件或设备。`of` 参数指定输出位置。在上述示例中，整个硬盘 `/dev/sdb` 被复制到 `/dev/sdc`。\n\n`dd`\
    \ 也可用于创建磁盘镜像文件。下一个示例演示了如何使用 `dd` 从 CD-ROM 创建 ISO 镜像文件。\n\n```bash\n# dd if=/dev/cdrom\
    \ of=/tmp/image.iso\n```\n\n使用 dd 命令将 CD-ROM 转换为 ISO 文件\n\n> **警告** `dd` 命令常被称为“数据毁灭者”，因为如果误用，其破坏性可能非常强。在试验\
    \ `dd` 时务必谨慎。\n\n**常见用法示例：**\n\n- `dd if=[SOURCE] of=[TARGET]` 创建指定设备的原始副本\n\n"
