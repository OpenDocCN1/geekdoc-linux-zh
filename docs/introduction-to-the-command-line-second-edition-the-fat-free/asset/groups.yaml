    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_183_0.png)


    `fsck` checks the specified file systems for errors and repairs them if necessary.
    In the above example, the `/` file system is checked for errors. The `-n` option
    is used to instruct `fsck` to check but not repair the specified file system.
    This is necessary since, in this case, the `/` file system is a live (mounted)
    file system and cannot be repaired unless first unmounted.


    > **Warning**

    > *The `fsck` command should never be used to repair a mounted file system as
    it will cause data corruption. In Linux, you can safely run `fsck` at the next
    reboot by typing `sudo touch /forcefsck` on the command line. Other systems may
    require booting recovery media in order to use `fsck`. See `man fsck` for more
    information about usage on your system.*


    **Common usage examples:**


    | `fsck [FILESYSTEM]` | Check and repair the specified file system |

    | `fsck -n [FILESYSTEM]` | Check the specified file system without repairing it
    |'
