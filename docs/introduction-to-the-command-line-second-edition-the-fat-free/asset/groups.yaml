    \ (通用串行总线) 用于将外部设备连接到计算机的接口。\n\n## lshw\n\n**用途**：列出 Linux 系统上的硬件。\n\n**用法语法：**\
    \ `lshw [OPTIONS]`\n\n```\n# lshw -short\nH/W path  Device    Class      Description\n\
    ==========================================\n        /     system     OptiPlex\
    \ GX520\n        /0   bus        0WG233\n        /0/0   memory   64KiB BIOS\n\
    \        /0/00    processor Intel(R) Pentium(R) 4 CPU 3.00GHz\n        /0/000/700\
    \    memory    16KiB L1 cache\n        /0/000/701    memory    2MiB L2 cache\n\
    \        /0/000/0.1    processor  Logical CPU\n        /0/000/0.2    processor\
    \  Logical CPU\n        /0/1000   memory    2GiB System Memory\n        /0/1000/0\
    \   memory  1GiB DIMM DDR Synchronous 533 MHz\n        ...\n```\n使用 -short 选项的\
    \ lshw 命令输出\n\n```\n# lshw\nnc@-01\n        description: Mini Tower Computer\n\
    \        product: OptiPlex GX520\n        vendor: Dell Inc.\n        serial: ******\n\
    \        width: 32 bits\n        capabilities: smbios-2.3 dmi-2.3 smp-1.4 smp\n\
    \        configuration: administrator_password=enabled boot=normal\n        chassis=mini-tower\
    \ cpus=1\n*->core\n        description: Motherboard\n        product: 0WG233\n\
    \        vendor: Dell Inc.\n        ...\n```\nlshw 命令的默认输出\n\n**常见用法示例：**\n\n\
    - `lshw`\n  - 显示详细的硬件列表\n- `lshw -short`\n  - 显示简化的硬件列表\n\n## ioscan\n\n**用途：**\
    \ 列出 HP-UX 系统上的硬件。\n\n**用法语法：** `ioscan [OPTIONS]`\n\n```\n# ioscan\nH/W Path\
    \  Class         Description\n=======    ===         ==========\n      0\n   \
