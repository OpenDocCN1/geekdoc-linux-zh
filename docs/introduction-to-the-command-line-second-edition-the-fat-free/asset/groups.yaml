    # jobs


    **Purpose**: Display background and suspended jobs.


    **Usage syntax**: `jobs [OPTIONS]`


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_116_0.png)


    The `jobs` command displays the status of background programs and suspended processes.
    In the above example, three background jobs are displayed. The previously mentioned
    `fg` and `bg` commands can be used to move the processes to the foreground and
    background respectively.


    The following table describes the output fields of the `jobs` command.


    | Job ID | Status | Program |

    | :--- | :--- | :--- |

    | `[1]-` | Running | `SomeProgram.sh` |

    | `[2]+` | Stopped | `AnotherProgram.sh` |

    | `[3]` | Stopped | `Test.sh` |


    Output fields of the jobs command


    > **Note**

    > *The plus sign is used to indicate what job is considered to be the default
    job (for use with the `bg` and `fg` commands). The minus sign indicates the job
    that will become the default if the current default job terminates. There can
    be only one `+` and `-` at any given time. All other jobs will not have any indicators.*


