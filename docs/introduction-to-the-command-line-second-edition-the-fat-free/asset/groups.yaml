    \n最常见的网络接口类型是标准的以太网网卡。该接口通常被指定为 **eth0** 或 **en0**。具有多块网卡的系统将包含 **eth0**、**eth1**、**eth2**\
    \ 等。\n\n> **注意**\n> *回环接口 (lo) 存在于所有 Unix、Linux 和 BSD 系统中。它对系统的正常运行至关重要，不应禁用或修改。该接口的\
    \ IP 地址始终为 127.0.0.1。*\n\n**命令用法示例：**\n\n| 命令 | 描述 |\n|:---|:---|\n| `ifconfig`\
    \ | 显示已启用的网络接口 |\n| `ifconfig -a` | 显示所有网络接口 |\n| `ifconfig [INTERFACE]` | 显示指定的网络接口\
    \ |\n\n## ifup / ifdown\n\n**用途：** 启用/禁用网络接口。\n\n**用法语法：** `ifup [OPTIONS] [INTERFACE]`\n\
    \n```bash\n# ifup eth0\n```\n\n使用 ifup 命令启用网络接口\n\n`ifup` 用于启用网络接口。在上例中，接口 `eth0`\
    \ 被启用。执行 `ifup` 命令后，`eth0` 接口被激活并可供使用。\n\n`ifdown` 用于禁用网络接口。这将使指定接口离线并不可用。下一个示例演示了如何使用\
    \ `ifdown` 关闭 `eth0` 接口。\n\n**用法语法：** `ifdown [OPTIONS] [INTERFACE]`\n\n```bash\n\
    # ifdown eth0\n```\n\n使用 ifdown 命令禁用网络接口\n\n> **注意**\n> *某些系统可能会将以太网接口指定为 `en0`\
    \ 而不是 `eth0`。*\n\n**常见用法示例：**\n\n- `ifup [INTERFACE]` 启用指定的网络接口\n- `ifup -a` 启用所有网络接口\n\
    - `ifdown [INTERFACE]` 禁用指定的网络接口\n- `ifdown -a` 禁用所有网络接口\n\n## iwconfig\n\n**用途：**\
