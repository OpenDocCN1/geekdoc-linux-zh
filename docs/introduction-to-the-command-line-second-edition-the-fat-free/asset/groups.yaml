    \ | :--- | :--- | :--- |\n| **上箭头** | 向上导航一行 | **下箭头** | 向下导航一行 |\n| **Page Up**\
    \ | 向上导航一页 | **Page Down** | 向下导航一页 |\n| **Q** | 退出 `man` 程序 | **/[字符串]** | 搜索一段文本\
    \ |\n\n`man` 命令是你获取命令行帮助的最宝贵资源。如果你不确定某个命令的正确用法语法，请始终查阅手册页。\n\n**常见用法示例：**\n\n\
    | | |\n| :--- | :--- |\n| `man [COMMAND]` | 显示指定命令的手册 |\n| `man -k [KEYWORD]`\
    \ | 搜索包含指定关键字的手册页 |\n\n## whatis\n\n**用途**：显示指定命令的描述。\n\n**用法语法**：`whatis [OPTIONS]\
    \ [COMMAND]`\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_20_0.png)\n\n**whatis**\
    \ 显示指定命令的简要描述。上述示例使用 **whatis** 显示了 **ls** 命令的描述。这可以用作提醒命令用途的辅助工具，而无需查阅 **man**\
    \ 命令。\n\n可以在一个 **whatis** 查询中使用多个命令，以显示每个单独命令的描述。例如，输入 **whatis ls who rm** 将一次性显示所有三个命令的描述，如下一个示例所示。\n\
    \n![](img/fa2f95b64a707c963dfa0445bd9281a7_20_1.png)\n\n> 某些 Unix 系统可能使用 apropos\
    \ 命令代替 whatis。\n\n**常见用法示例：**\n\n| | |\n| :--- | :--- |\n| `whatis [COMMAND]`\
    \ | 显示指定命令的描述 |\n| `whatis -w [WILDCARD]` | 使用通配符搜索命令 |\n\n## ls\n\n**用途：** 列出目录的内容。\n\
    \n**用法语法：** `ls [OPTIONS] [DIRECTORY/FILE]`\n\n```\n$ ls\nNotes.txt  ShoppingList.txt\
    \  ToDoList.txt\n```\n\n*ls 命令的典型输出*\n\n执行 **ls** 命令会显示当前目录中文件的简单列表，如上面的示例所示。要查看目录中文件的更多信息，你可以使用命令行选项来激活附加功能，如下一个示例所示。\n\
    \n```\n$ ls -l\n-rw-r--r--  1 nick sales 35068 2009-05-19 08:41 Notes.txt\n-rw-r--r--\
    \  1 nick sales    23 2009-05-19 08:43 ShoppingList.txt\n-rw-r--r--  1 nick sales\
    \    37 2009-05-19 08:43 ToDoList.txt\n```\n\n*在 ls 命令中使用 -l 选项*\n\n在这个示例中，使用\
    \ **-l** 选项生成详细的文件列表，包括权限、所有者、组和修改日期/时间。下表描述了 **ls -l** 命令的输出。\n\n| 权限 | 链接数 |\
    \ 所有者 & 组 | 大小 | 修改日期 | 文件或目录 |\n|---|---|---|---|---|---|\n| -rw-r--r-- | 1 |\
    \ nick sales | 35068 | 2009-05-19 08:41 | Notes.txt |\n\n*使用 ls -l 命令显示的字段描述*\n\
    \n大多数命令行程序都有许多可用的选项。**ls** 命令也不例外。通过组合这些选项，你可以同时激活多个功能。例如，将 **-a** 选项与 **-l**\
    \ 结合使用，会产生包含隐藏文件（以点开头的文件）的详细文件列表。\n\n```\n$ ls -l -a\ndrwxr-xr-x  2 nick sales\
    \  4096 2009-05-19 21:14 .\ndrwxr-xr-x 92 nick sales  4096 2009-05-19 20:46 ..\n\
    -rw-r--r--  1 nick sales   168 2009-05-19 21:14 .MyHiddenFile\n-rw-r--r--  1 nick\
    \ sales 35068 2009-05-19 08:41 Notes.txt\n-rw-r--r--  1 nick sales    23 2009-05-19\
    \ 08:43 ShoppingList.txt\n-rw-r--r--  1 nick sales    37 2009-05-19 08:43 ToDoList.txt\n\
    ```\n\n*在 ls 命令中使用多个选项*\n\n**提示**：大多数命令行选项可以使用简写形式组合。例如，`ls -l -a` 可以缩短为 `ls -la`。\n\
    \n**注意**：命令行选项不是通用的。每个命令都有其特定于该程序的选项集。此外，在不同平台上同一命令的每个实现可能使用不同的选项。请参阅 man 页面以获取系统支持的完整命令行选项列表。\n\
    \n### 常见用法示例：\n\n| | |\n| :--- | :--- |\n| `ls` | 显示当前目录中文件的基本列表 |\n| `ls [DIRECTORY]`\
    \ | 显示指定目录中文件的基本列表 |\n| `ls -l` | 列出带有详细信息的文件 |\n| `ls -la` | 列出隐藏文件 |\n| `ls\
    \ -lh` | 以“人类可读格式”（KB、MB 等）列出文件大小 |\n| `ls -R` | 递归列出所有子目录 |\n| `ls -d [DIRECTORY]`\
    \ | 仅列出指定目录（不列出其内容） |\n\n## pwd\n\n**用途：** 显示当前/工作目录。\n\n**用法语法：** pwd\n\n```bash\n\
    $ pwd\n/home/nick\n```\n\n> 使用 pwd 命令显示当前目录\n\n**pwd** 命令（**Print Working Directory**\
    \ 的缩写）显示你在文件系统中的当前位置。在上面的示例中，执行 **pwd** 显示 `/home/nick` 为当前工作目录。\n\n| 注意 |\n|\
    \ :--- |\n| Unix、Linux 和 BSD 系统使用正斜杠（即 /home/nick）来分隔目录名称，而 MS-DOS 和 Windows 系统使用反斜杠（即\
    \ C:\\Windows\\system32）。 |\n\n**常见用法示例：**\n\n| | |\n| :--- | :--- |\n| pwd |\
    \ 显示当前工作目录。 |\n\n## cd\n\n**用途：** 更改（导航）目录。\n\n**用法语法：** `cd [DIRECTORY]`\n\n\
    ```\n$ cd /etc\n$ pwd\n/etc\n```\n\n使用 cd 命令导航到 /etc 目录\n\n`cd` 命令（Change Directories\
    \ 的缩写）将你在文件系统中的位置更改为指定路径。在上面的示例中，执行 `cd /etc` 使 `/etc` 成为新的工作目录。\n\n除非你手动指定完整路径（如第一个示例中使用的\
    \ `cd /etc`），否则 `cd` 命令会根据你当前的位置解释目录路径。下一个示例演示了如何使用 `cd` 相对于当前位置更改目录。\n\n```\n\
    $ pwd\n/home/nick\n$ cd documents\n$ pwd\n/home/nick/documents\n```\n\n使用 cd 命令导航到相对于当前位置的目录\n\
    \n在这个示例中，起始目录是 `/home/nick`。输入 `cd documents` 会使 `/home/nick/documents` 成为新的工作目录。如果你从其他位置开始，你必须输入完整路径（即\
    \ `cd /home/nick/documents`）才能达到相同的结果。由于之前的位置是 `/home/nick`，因此无需输入完整路径。\n\n> 执行不带选项的\
    \ cd 命令，无论当前位置如何，都会将你返回到你的 home 目录。\n\n### 常见用法示例：\n\n| | |\n| :--- | :--- |\n\
    | `cd [DIRECTORY]` | 导航到指定目录 |\n| `cd` | 导航到用户的主目录 |\n| `cd -` | 返回上一个工作目录 |\n\
    | `cd ..` | 在目录树中向上导航一级 |\n\n"
