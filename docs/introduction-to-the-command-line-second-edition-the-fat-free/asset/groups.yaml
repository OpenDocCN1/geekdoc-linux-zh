  md: "\n## Common Unix, Linux, and BSD File Systems\n\nUnix, Linux, and BSD share\
    \ support for several types of file systems. The table below provides a matrix\
    \ of the most common file systems and their supported platforms.\n\n| | AIX |\
    \ HP-UX | Solaris | BSD | Linux |\n|---|---|---|---|---|---|\n| EXT2-4 | Partial\
    \ | No | Partial | Partial | Yes |\n| JFS (IBM) | Yes | No | No | No | Yes |\n\
    | HFS+ | No | No | No | No | Partial |\n| UFS | No | Yes | Yes | Yes | Partial\
    \ |\n| VxFS | Yes | Yes | Yes | No | Yes |\n| ZFS | No | No | Yes | Yes | Yes\
    \ |\n\n**EXT** versions 2 through 4 are file systems used by the Linux operating\
    \ system. Currently, ext3 is the most widely used file system on Linux distributions.\
    \ The recently released ext4 file system has many new features and performance\
    \ benefits over ext3. It will become the default file system for most Linux systems\
    \ within the next few years. Versions before ext3 are considered obsolete and\
    \ are rarely used.\n\n**JFS** is IBM's journaling file system primarily used on\
    \ the AIX operating system.\n\n**HFS+** is Apple's file system used on their Unix-based\
    \ Mac OS X operating system. HFS+ isn't widely supported by other operating systems\
    \ but it can be mounted as read-only on Linux systems.\n\n**UFS** is a Unix file\
    \ system used primarily by BSD distributions.\n\n**VxFS** is a file system developed\
    \ by Veritas Software Corporation (now known as Symantec) and used on HP-UX systems.\
    \ It is also supported on several other Unix and Linux systems although it is\
    \ rarely used outside of HP-UX.\n\n**ZFS** is a new and highly robust file system\
    \ developed by Sun Microsystems. It is primarily used on the Solaris operating\
    \ system but also has limited support for some Linux and BSD systems.\n\n## Devices\n\
    \nEvery Unix, Linux, and BSD system has a directory that is known as `/dev`. This\
    \ directory contains device files (sometimes referred to as special files) that\
    \ represent hardware installed on the system such as `/dev/mouse` and `/dev/cdrom`.\n\
    \n```bash\n# ls -l /dev/\ncrw-rw---- 1 root audio  14,  12 2010-04-22 16:30 adsp\n\
    crw------- 1 root video  10,  175 2010-04-22 11:30 aspi\n...\ncrw-rw---- 1 root\
    \ audio  14,  4 2010-04-22 16:30 audio\ncrw-rw---- 1 root root   10,  59 2010-04-22\
    \ 11:30 binder\ndrwxr-xr-x 2 root root  700 2010-04-22 16:30 block\ndrwxr-xr-x\
    \ 3 root root  60 2010-04-22 11:30 bus\nlrwxrwxrwx 1 root root   3 2010-04-22\
    \ 16:30 cdrom -> sr0\nlrwxrwxrwx 1 root root   3 2010-04-22 16:30 cdrom -> sr0\n\
    drwxr-xr-x 2 root root 3220 2010-04-22 16:30 char\ncrw------- 1 root root   5,\
    \   1 2010-04-22 07:36 console\nlrwxrwxrwx 1 root root  11 2010-04-22 16:30 core\
    \ -> /proc/kcore\ncrw-rw--- 1 root root   10,  58 2010-04-22 11:30 cpu_dma_latency\n\
    drwxr-xr-x 6 root root  120 2010-04-22 11:30 disk\ndrwxr-xr-x 2 root root   80\
    \ 2010-04-22 11:30 dri\ncrw-rw---- 1 root audio  14,   3 2010-04-22 16:30 dsp\n\
    lrwxrwxrwx 1 root root   3 2010-04-22 16:30 dvd -> sr0\n...\n```\n\nExample listing\
    \ of devices in the /dev directory\n\nWithin the /dev directory there can be several\
    \ hundred files. Most of these files are of little use in everyday activities.\
    \ As the system administrator of a Unix or Linux system you will primarily be\
    \ working with the device files that represent your disk drive(s). Knowing the\
    \ path to your hard drive is important when working with commands related to file\
    \ systems. More on this topic is covered in Section 10 of this guide.\n\n> **Note**\n\
    >\n> *Device naming conventions used in* `/dev` *vary across each distribution.*\n\
    \nWithin `/dev`, there are also a few helpful pseudo-devices. Pseudo-devices do\
    \ not represent actual hardware and exist only to perform a specific task. The\
    \ table below describes the most commonly used pseudo-devices.\n\n| File | Purpose\
    \ |\n| :--- | :--- |\n| `/dev/zero` | File that produces a continuous stream of\
    \ 0-byte characters |\n| `/dev/random` | Random number generator |\n| `/dev/null`\
    \ | Special file that discards any data written to it |\n\n## The Shell\n\nThe\
    \ command line interpreter, also known as the shell, is a program that accepts\
    \ input from a user (typically a command of some sort) and performs the requested\
    \ task. Once that task has completed, the program will terminate and return the\
    \ user to the shell.\n\nThe shell's prompt identifies the type of shell being\
    \ used. There are two basic types of shell prompts:\n\n- Normal user shell (may\
    \ also be % or > on some systems)\n- Root user shell\n\nBelow is the output of\
    \ the **whoami** command (discussed on page 94) which highlights the difference\
    \ between normal user and root shell prompts on the command line.\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_15_0.png)\n\
    \nNormal users typically have a limited amount of access to the system while the\
    \ root user has unrestricted access. Section 5 covers this topic in more detail.\n\
    \n> **Warning**\n>\n> The root user can do *anything* on Unix, Linux, and BSD\
    \ systems. It is important to know when *you are working as* root to prevent accidental\
    \ damage to your system.\n\nMany systems add customized information to the shell\
    \ prompt. This information can be a handy indicator of things like the current\
    \ user's login name, system host name, and the current directory as shown in the\
    \ next example.\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_15_1.png)\n\nThe table\
    \ below describes the information displayed in the customized shell prompt displayed\
    \ in the previous example.\n\n| nick | @ | mylaptop | : | /var/log | $ |\n| :---:\
    \ | :---: | :---: | :---: | :---: | :---: |\n| User Name | Spacer | Computer Name\
    \ | Spacer | Current Directory | Shell Prompt |\n\n## Types of Shells\n\nThere\
    \ are several different types of shells for Unix, Linux, and BSD systems. Each\
    \ shell has its own set of features and usage syntax. The next table describes\
    \ the most popular shells that are currently available.\n\n| Shell | Prompt |\
    \ Name | Notes |\n|---|---|---|---|\n| sh | $ | Bourne Shell | Default on some\
    \ Unix systems |\n| bash | $ | Bourne | Enhanced replacement for the Bourne shell\
    \ |\n| zsh | $ | ZSH | Again Shell | Default on most Linux and Mac OS X systems\
    \ |\n| csh | % | C Shell | Default on many BSD systems |\n| tcsh | > | T C Shell\
    \ | Enhanced replacement for the C shell |\n| ksh | $ | Korn shell | Default on\
    \ AIX systems |\n\nThe **bash** shell is the most popular shell in use today.\
    \ It is the default shell on all Linux systems and is also available for most\
    \ Unix and BSD systems. Other shells like **csh**, **tcsh**, and **ksh** are typically\
    \ used by default on non-Linux systems.\n\n## Accessing the Shell\n\nWhen you\
    \ first boot your system you are presented with a login prompt similar to the\
    \ example pictured below.\n\n```text\nUbuntu Linux 9.04 \nLogin: nick \nPassword:\
    \ ****** \n$ \n```\n\nAfter you enter your username and password the system will\
    \ authenticate your login credentials via the `/etc/passwd` file. If the login\
    \ information is correct, the system will start your shell (which is also specified\
    \ in `/etc/passwd`). The `$` shell prompt indicates you are logged in and \"ready\
    \ to go.\"\n\n*Welcome to the world of the command line... Let's get started!*\n\
    \n## Section 2: Command Line Basics\n\n**Overview**\n\nThis section covers the\
    \ most essential commands every user should know. These basic commands cover topics\
    \ like getting help, navigating directories, and listing files. Before you begin,\
    \ there are three important rules you need to know about the command line:\n\n\
    - 1. Unix, Linux, and BSD systems are case (and space) sensitive. This means that\
    \ a file named MyFile is not the same as myFile as it would be on a DOS or Windows\
    \ system.\n- 2. There is no \"recycle bin\" or \"trash can\" when working in the\
    \ command line environment. When files are deleted on the command line, they instantly\
    \ disappear forever.\n- 3. You should always practice new commands on a testing\
    \ system that is not used in a production environment. This minimizes the chances\
    \ of an accident that can take down an important system.\n\nKnowing this, we can\
    \ now begin working with basic Unix, Linux and BSD commands.\n\n> Examples listed\
    \ in this book were created on various Unix, Linux, and BSD systems. Many of the\
    \ commands, options, and features are the same on other platforms; however, there\
    \ may be slight differences. You should always consult the manual for your specific\
    \ platform to ensure compatibility with the examples provided. See page 20 for\
    \ more information on how to access the online manual.\n"
  mdcn: "\n\n## 常见的 Unix、Linux 和 BSD 文件系统\n\nUnix、Linux 和 BSD 共享对多种类型文件系统的支持。下表提供了最常见文件系统及其支持平台的矩阵。\n\
    \n| | AIX | HP-UX | Solaris | BSD | Linux |\n|---|---|---|---|---|---|\n| EXT2-4\
    \ | 部分支持 | 否 | 部分支持 | 部分支持 | 是 |\n| JFS (IBM) | 是 | 否 | 否 | 否 | 是 |\n| HFS+ |\
    \ 否 | 否 | 否 | 否 | 部分支持 |\n| UFS | 否 | 是 | 是 | 是 | 部分支持 |\n| VxFS | 是 | 是 | 是 |\
    \ 否 | 是 |\n| ZFS | 否 | 否 | 是 | 是 | 是 |\n\n**EXT** 第 2 至 4 版是 Linux 操作系统使用的文件系统。目前，ext3\
    \ 是 Linux 发行版中应用最广泛的文件系统。最近发布的 ext4 文件系统比 ext3 拥有许多新特性和性能优势。在未来几年内，它将成为大多数 Linux\
    \ 系统的默认文件系统。ext3 之前的版本被认为已过时，很少被使用。\n\n**JFS** 是 IBM 的记录式文件系统，主要用于 AIX 操作系统。\n\
    \n**HFS+** 是 Apple 的文件系统，用于其基于 Unix 的 Mac OS X 操作系统。HFS+ 不被其他操作系统广泛支持，但可以在 Linux\
    \ 系统上以只读方式挂载。\n\n**UFS** 是一种 Unix 文件系统，主要由 BSD 发行版使用。\n\n**VxFS** 是由 Veritas 软件公司（现为\
    \ Symantec）开发并用于 HP-UX 系统的文件系统。尽管在 HP-UX 之外很少使用，但它也受若干其他 Unix 和 Linux 系统的支持。\n\
    \n**ZFS** 是由 Sun Microsystems 开发的一种新型且高度健壮的文件系统。它主要用于 Solaris 操作系统，但也有限地支持某些 Linux\
    \ 和 BSD 系统。\n\n## 设备\n\n每个 Unix、Linux 和 BSD 系统都有一个被称为 `/dev` 的目录。该目录包含代表系统上安装硬件的设备文件（有时也称为特殊文件），例如\
    \ `/dev/mouse` 和 `/dev/cdrom`。\n\n```bash\n# ls -l /dev/\ncrw-rw---- 1 root audio\
    \  14,  12 2010-04-22 16:30 adsp\ncrw------- 1 root video  10,  175 2010-04-22\
    \ 11:30 aspi\n...\ncrw-rw---- 1 root audio  14,  4 2010-04-22 16:30 audio\ncrw-rw----\
    \ 1 root root   10,  59 2010-04-22 11:30 binder\ndrwxr-xr-x 2 root root  700 2010-04-22\
    \ 16:30 block\ndrwxr-xr-x 3 root root  60 2010-04-22 11:30 bus\nlrwxrwxrwx 1 root\
    \ root   3 2010-04-22 16:30 cdrom -> sr0\nlrwxrwxrwx 1 root root   3 2010-04-22\
    \ 16:30 cdrom -> sr0\ndrwxr-xr-x 2 root root 3220 2010-04-22 16:30 char\ncrw-------\
    \ 1 root root   5,   1 2010-04-22 07:36 console\nlrwxrwxrwx 1 root root  11 2010-04-22\
    \ 16:30 core -> /proc/kcore\ncrw-rw--- 1 root root   10,  58 2010-04-22 11:30\
    \ cpu_dma_latency\ndrwxr-xr-x 6 root root  120 2010-04-22 11:30 disk\ndrwxr-xr-x\
    \ 2 root root   80 2010-04-22 11:30 dri\ncrw-rw---- 1 root audio  14,   3 2010-04-22\
    \ 16:30 dsp\nlrwxrwxrwx 1 root root   3 2010-04-22 16:30 dvd -> sr0\n...\n```\n\
    \n/dev 目录中设备列表的示例\n\n在 /dev 目录中可能有几百个文件。其中大多数文件在日常活动中没什么用处。作为 Unix 或 Linux 系统的系统管理员，你主要将与代表磁盘驱动器的设备文件打交道。在处理与文件系统相关的命令时，知道硬盘驱动器的路径很重要。本指南第\
    \ 10 节将更详细地介绍此主题。\n\n> **注意**\n>\n> `/dev` 中使用的*设备命名约定*因各发行版而异。\n\n在 `/dev` 中还有一些有用的伪设备。伪设备不代表实际的硬件，仅存在于执行特定任务。下表描述了最常用的伪设备。\n\
    \n| 文件 | 用途 |\n| :--- | :--- |\n| `/dev/zero` | 产生连续 0 字节字符流的文件 |\n| `/dev/random`\
    \ | 随机数生成器 |\n| `/dev/null` | 丢弃写入其任何数据的特殊文件 |\n\n## Shell（外壳）\n\n命令行解释器，也称为 shell（外壳），是一个接受用户输入（通常是某种命令）并执行所请求任务的程序。一旦任务完成，该程序将终止并将用户返回到\
    \ shell。\n\nShell 的提示符标识了正在使用的 shell 类型。有两种基本的 shell 提示符类型：\n\n- 普通用户 shell（在某些系统中也可能是\
    \ % 或 >）\n- 根用户 shell\n\n以下是 **whoami** 命令的输出（第 94 页有讨论），它强调了命令行上普通用户 shell 提示符和根用户\
    \ shell 提示符之间的区别。\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_15_0.png)\n\n普通用户通常对系统的访问权限有限，而根用户拥有不受限制的可访问权限。第\
    \ 5 节将更详细地介绍此主题。\n\n> **警告**\n>\n> 在 Unix、Linux 和 BSD 系统上，根用户可以*做任何事情*。知道*你正在以*\
    \ root 身份工作*很重要，以防止对系统造成意外损坏。\n\n许多系统向 shell 提示符添加自定义信息。这些信息可以是当前用户登录名、系统主机名和当前目录等事物的有用指示符，如下一个示例所示。\n\
    \n![](img/fa2f95b64a707c963dfa0445bd9281a7_15_1.png)\n\n下表描述了在之前示例中显示的自定义 shell\
    \ 提示符中显示的信息。\n\n| nick | @ | mylaptop | : | /var/log | $ |\n| :---: | :---: |\
    \ :---: | :---: | :---: | :---: |\n| 用户名 | 间隔符 | 计算机名 | 间隔符 | 当前目录 | Shell 提示符\
    \ |\n\n## Shell 的类型\n\nUnix、Linux 和 BSD 系统有几种不同类型的 shell。每个 shell 都有自己的一套特性和使用语法。下表描述了当前可用的最流行的\
    \ shell。\n\n| Shell | 提示符 | 名称 | 备注 |\n|---|---|---|---|\n| sh | $ | Bourne Shell\
    \ | 某些 Unix 系统的默认 shell |\n| bash | $ | Bourne | Bourne shell 的增强替代版本 |\n| zsh\
    \ | $ | ZSH | Z Shell | 大多数 Linux 和 Mac OS X 系统的默认 shell |\n| csh | % | C Shell\
    \ | 许多 BSD 系统的默认 shell |\n| tcsh | > | T C Shell | C shell 的增强替代版本 |\n| ksh |\
    \ $ | Korn shell | AIX 系统的默认 shell |\n\n**bash** shell 是当今最流行的 shell。它是所有 Linux\
    \ 系统的默认 shell，也可以在大多数 Unix 和 BSD 系统上使用。像 **csh**、**tcsh** 和 **ksh** 等其他 shell\
    \ 通常被默认用于非 Linux 系统。\n\n## 访问 Shell\n\n当你第一次启动系统时，你会看到一个类似于下面示例图片的登录提示符。\n\n```text\n\
    Ubuntu Linux 9.04 \nLogin: nick \nPassword: ****** \n$ \n```\n\n输入你的用户名和密码后，系统将通过\
    \ `/etc/passwd` 文件验证你的登录凭据。如果登录信息正确，系统将启动你的 shell（这也是在 `/etc/passwd` 中指定的）。`$`\
    \ shell 提示符表示你已登录并且“准备就绪”。\n\n*欢迎来到命令行世界……让我们开始吧！*\n\n## 第 2 节：命令行基础\n\n**概述**\n\
    \n本节涵盖每个用户都应知道的最基本命令。这些基本命令涵盖了诸如获取帮助、导航目录和列出文件等主题。在开始之前，你需要了解关于命令行的三条重要规则：\n\n\
    - 1. Unix、Linux 和 BSD 系统对大小写（和空格）敏感。这意味着名为 MyFile 的文件与 myFile 并不相同，这与 DOS 或 Windows\
    \ 系统上的情况不同。\n- 2. 在命令行环境中工作时没有“回收站”或“垃圾箱”。在命令行上删除的文件会立即永久消失。\n- 3. 你应该始终在测试系统上练习新命令，而不是在生产环境中使用的系统上。这可以最小化可能导致重要系统故障的事故几率。\n\
    \n了解这些之后，我们现在可以开始使用基本的 Unix、Linux 和 BSD 命令。\n\n> 本书中列出的示例是在各种 Unix、Linux 和 BSD\
    \ 系统上创建的。许多命令、选项和特性在其他平台上是相同的；然而，可能会存在一些细微差异。你应始终查阅你特定平台的手册以确保与提供的示例兼容。有关如何访问在线手册的更多信息，请参见第\
