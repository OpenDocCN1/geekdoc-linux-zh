    \ Linux 系统。要获取特定于您环境的用法示例，请在本地系统上键入 `man shutdown`。\n\n当执行 `shutdown` 命令时，会向登录到本地系统的所有用户广播警告。可以在时间参数后面指定一条可选消息，如下一个示例所示。\n\
    \n```\n# shutdown 2 Save your work and log off ASAP!\nBROADCAST MESSAGE FROM ROOT:\n\
    The system is going down for shutdown in 2 minutes!\nSave your work and log off\
    \ ASAP!\n```\n\nshutdown 命令广播消息的示例输出\n\n| 常见用法示例： |\n|------------------|\n| `shutdown\
    \ now` | 立即关闭系统 |\n| `shutdown [MIN]` | 等待指定的分钟数后再关机 |\n| `shutdown [HH:MM]` |\
    \ 在指定时间关机（24小时制） |\n| `shutdown -r now` | 重启系统 |\n| `shutdown -H now` | 停止系统 |\n\
    | `shutdown -P now` | 关闭系统电源 |\n\n## poweroff\n\n**用途：** 关闭系统电源。\n\n**使用语法：**\
    \ `poweroff`\n\n```\n# poweroff\n\nBROADCAST MESSAGE FROM ROOT:\nThe system is\
    \ going down for power off now!\n\n* Stopping services [ OK ]\n\n* Terminating\
    \ processes [ OK ]\n\n...\n\nThe system will now power off.\n```\n\n`poweroff`\
    \ 命令将立即关闭并切断系统电源。它基本上是 `shutdown -P now` 的快捷方式。`poweroff` 命令存在于所有 Linux 发行版以及某些\
    \ BSD 和 Unix 系统中。\n\n> **注意** 要检查您的系统是否支持 poweroff 命令，请键入 `whereis poweroff`。\n\
    \n> **警告** poweroff 命令不提供宽限期，执行时会立即停止系统。\n\n**常见用法示例：**\n\n- `poweroff` | 关闭并切断系统电源\n\
    \n## reboot\n\n**用途：** 重启系统。\n\n**使用语法：** `reboot`\n\n```\n# reboot\nBROADCAST\
    \ MESSAGE FROM ROOT: The system is going down for reboot now!\n* Stopping services\
    \                   [ OK ]\n* Terminating processes                [ OK ]\n...\n\
    The system will now reboot.\n```\n\nreboot 命令的示例输出\n\n**reboot** 命令用于优雅地重启系统。它基本上是\
    \ **shutdown -r now** 的快捷方式。在命令行上执行 **reboot** 将立即重启系统，如上例所示。\n\n> **警告**\n> reboot\
    \ 命令不提供宽限期，执行时会立即重启系统。\n\n**常见用法示例：**\n\n- `reboot` | 优雅地重启系统\n\n## halt\n\n**用途：**\
    \ 停止系统。\n\n**使用语法：** `halt`\n\n```\n# halt\nBROADCAST MESSAGE FROM ROOT: The system\
    \ is going down for halt now!\n* Stopping services                           \
    \       [ OK ]\n* Terminating processes                                [ OK ]\n\
    ...\nThe system will now halt.\n```\n\nhalt 命令的示例输出\n\n`halt` 命令将停止在线系统。停止（halt）是一种特殊的关机类型，它优雅地关闭操作系统，但不会切断系统电源。\n\
    \n> **注意**\n> 某些商业 Unix 系统在停止时会进入维护模式。这可用于访问预启动配置/诊断环境。\n\n**常见用法示例：**\n\n- `halt`\
    \ | 停止系统\n\n## telinit\n\n**用途：** 更改运行级别。\n\n**使用语法：** `telinit [RUNLEVEL]`\n\n\
    ```\n# telinit 1\n*** Switching to run level 1 ***\n# runlevel\n3 1\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_127_0.png)\n\
    \n**telinit** 告知系统的 *init* 进程停止并启动为指定运行级别配置的必要服务。在上述示例中，使用 **telinit** 命令将系统更改为运行级别\
    \ 1。然后执行 **runlevel** 命令（见第 129 页）以显示当前和之前的运行级别。\n\n每个系统的运行级别配置取决于所使用的发行版，并且可以根据您的需要进行自定义。大多数\
    \ Unix、Linux 和 BSD 系统将拥有与下表描述的类似的运行级别配置。\n\n| 运行级别 | 用途 | \n| :---: | :--- | \n\
    | 0 | 关机或特殊管理模式 | \n| 1 | 单用户模式 | \n| 2 | 多用户模式 | \n| 3 | 多用户模式 | \n| 4 | 多用户模式\
    \ | \n| 5 | 特定于发行版 | \n| 6 | 重启 |\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_127_1.png)\n\
    \n**常见用法示例：**\n\n- `telinit [RUNLEVEL]` | 告知 init 进程加载指定的运行级别\n\n"
