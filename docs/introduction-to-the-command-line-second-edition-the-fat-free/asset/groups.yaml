  md: "\n## Section 10: File Systems\n\n**Overview**\n\nThis section covers usage\
    \ of basic file system management commands. It also covers popular partition editors\
    \ for Unix, Linux, and BSD systems such as `fdisk` and `parted`. These commands\
    \ can be used to create, modify, and delete file systems.\n\n> **Warning**\n>\n\
    > *The following commands can cause irreparable damage to your system if used\
    \ incorrectly. Always experiment with new commands in a testing environment.*\n\
    \n**Commands covered in this section:**\n\n| **Command** | **Purpose** |\n| :---\
    \ | :--- |\n| `fdisk` | Display and edit hard disk partitions. |\n| `parted` |\
    \ Display and edit partitions on Linux systems. |\n| `mkfs` | Create file systems.\
    \ |\n| `fsck` | Check and repair file systems. |\n| `badblocks` | Check a disk\
    \ drive for bad blocks. |\n| `tune2fs` | Adjust Linux file system parameters.\
    \ |\n| `mount`, `umount` | Mount/unmount local and remote file systems. |\n| `mkswap`\
    \ | Create swap space storage. |\n| `swapon`, `swapoff` | Activate/deactivate\
    \ swap space. |\n| `swaponfo`, `swaptinfo` | Display swap space information. |\n\
    | `sync` | Flush file system buffers. |\n\n### Glossary of terms used in this\
    \ section:\n\n| Term | Definition |\n| :--- | :--- |\n| Blocks | Physical storage\
    \ units on a disk drive. |\n| File System | A method and format for storing data\
    \ on a disk drive. |\n| Format | The process of preparing a disk drive for a specific\
    \ file system. |\n| Mount | Process used to attach storage devices to a local\
    \ system. |\n| Partition | A division of a disk drive. |\n| Swap | A file or partition\
    \ that acts as secondary storage for RAM. |\n\n### fdisk\n\n**Purpose:** Display\
    \ and edit hard disk partitions.\n\n**Usage syntax:** `fdisk [OPTIONS] [DEVICE]`\n\
    \n```\n# fdisk -l /dev/sda\nDisk /dev/sda: 160.0 GB, 16004189*696 bytes\n255 heads,\
    \ 63 sectors/track, 19457 cylinders\nUnits = cylinders of 16065 * 512 = 8225280\
    \ bytes\nDisk identifier: 0x96000000\n\n| Device | Boot | Start | End | Blocks\
    \ | Id | System |\n| :------- | :---- | :------ | :----- | :---------- | :----\
    \ | :----------------------|\n| /dev/sda1 | * | 1 | 12 | 96358+ | de | Dell Utility\
    \ |\n| /dev/sda2 | | 13 | 19457 | 156191962+ | 5 | Extended |\n| /dev/sda5 | |\
    \ 13 | 504 | 3951958+ | 82 | Linux swap / Solaris |\n| /dev/sda6 | | 505 | 19457\
    \ | 152239941 | 83 | Linux |\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_178_0.png)\n\
    \n**fdisk** is a disk partition editor for Unix, Linux, and BSD systems. In the\
    \ above example, the `-l` option is used to display the partition information\
    \ for the specified hard disk.\n\nExecuting **fdisk** with no options will open\
    \ the specified disk for editing, as displayed in the next example.\n\n```\n#\
    \ fdisk /dev/sda\nCommand (m for help): p\n\nDisk /dev/sda: 160.0 GB, 160041885696\
    \ bytes\n255 heads, 63 sectors/track, 19457 cylinders\nUnits = cylinders of 16065\
    \ * 512 = 8225280 bytes\nDisk identifier: 0x96000000\n\n| Device | Boot | Start\
    \ | End | Blocks | Id | System |\n| :------- | :---- | :------ | :----- | :----------\
    \ | :---- | :----------------------|\n| /dev/sda1 | * | 1 | 12 | 96358+ | de |\
    \ Dell Utility |\n| /dev/sda2 | | 13 | 19457 | 156191962+ | 5 | Extended |\n|\
    \ /dev/sda5 | | 13 | 504 | 3951958+ | 82 | Linux swap / Solaris |\n| /dev/sda6\
    \ | | 505 | 19457 | 152239941 | 83 | Linux |\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_178_1.png)\n\
    \nIn this example, the **fdisk** utility starts an interactive shell that can\
    \ be used to display and modify a disk's partitions. Within the shell, command\
    \ keys are used to perform a specific task. The following table describes the\
    \ basic commands available within the **fdisk** utility.\n\n| Command | Function\
    \ |\n| :--- | :--- |\n| **m** | Display the help menu |\n| **p** | Display the\
    \ partition table |\n| **n** | Create a new partition |\n| **a** | Make a partition\
    \ bootable |\n| **d** | Delete a partition |\n| **l** | List partition types |\n\
    | **q** | Quit without saving changes |\n| **w** | Save changes and exit |\n\n\
    > **Warning**\n> *Incorrectly using the `fdisk` utility can cause data loss or\
    \ leave your system unbootable. Always use caution when editing disk partitions\
    \ and make sure to have a backup of your important data.*\n\nCommon usage examples:\n\
    \n- `fdisk -l` List the partition tables for all devices\n- `fdisk -l [DEVICE]`\
    \ List the partition tables on the specified device\n- `fdisk [DEVICE]` Open the\
    \ specified device for editing\n\n### parted\n\n**Purpose:** Display and edit\
    \ partitions on Linux systems.\n\n**Usage syntax:** `parted [OPTIONS] [DEVICE]`\n\
    \n```shell\n# parted -1 /dev/sda\nModel: ATA SAMSUNG HD080HJ/ (scsi)\nDisk /dev/sda:\
    \ 80.0GB\nSector size (logical/physical): 512B/512B\nPartition Table: msdos\n\n\
    Number Start End Size Type File system Flags\n1 1049kB 106MB 105MB primary ntfs\
    \ boot\n2 106MB 47.2GB 47.1GB primary ntfs\n3 47.2GB 80.0GB 32.8GB extended\n\
    5 47.2GB 78.6GB 31.4GB logical ext4\n6 78.6GB 80.0GB 1398MB logical linux-swap\
    \ (v1)\nDisplaying the partition layout of a disk using the parted utility\n```\n\
    \n**parted** is a disk partition manager for Linux systems. It is similar to the\
    \ `fdisk` utility (which is also available for Linux), except it offers a more\
    \ user friendly interface. In the above example, the `-1` option is used to display\
    \ the partition information for the specified hard disk.\n\nExecuting **parted**\
    \ with no options will open the specified disk for editing, as displayed in the\
    \ next example.\n\n```shell\n# parted /dev/sda\nGNU Parted 1.8.8.1.159-1e0e\n\
    Using /dev/sda\nWelcome to GNU Parted! Type 'help' to view a list of commands.\n\
    (parted) print\nModel: ATA SAMSUNG HD080HJ/ (scsi)\nDisk /dev/sda: 80.0GB\nSector\
    \ size (logical/physical): 512B/512B\nPartition Table: msdos\n\nNumber Start End\
    \ Size Type File system Flags\n1 1049kB 106MB 105MB primary ntfs boot\n2 106MB\
    \ 47.2GB 47.1GB primary ntfs\n3 47.2GB 80.0GB 32.8GB extended\n5 47.2GB 78.6GB\
    \ 31.4GB logical ext4\n6 78.6GB 80.0GB 1398MB logical linux-swap (v1)\nEditing\
    \ a disk's partition using the parted utility\n```\n\nThe following table provides\
    \ an overview of basic `parted` partition editing commands.\n\n| Command | Function\
    \ |\n| :--- | :--- |\n| `print` | Display the partition table |\n| `help` | Display\
    \ the help menu |\n| `mkpart` | Create a new partition |\n| `rm` | Delete a partition\
    \ |\n| `quit` | Exit the program |\n\nCommon usage examples:\n\n- `parted -l`\
    \ List the partition tables for all devices\n- `parted -l [DEVICE]` List the partition\
    \ tables on the specified device\n- `parted [DEVICE]` Open the specified device\
    \ for editing\n\n### mkfs\n\n**Purpose:** Create file systems.\n\n**Usage syntax:**\
    \ `mkfs [OPTIONS] [DEVICE]`\n\n```\n# mkfs -t ext4 /dev/sdb1\nmke2fs 1.41.9 (22-Aug-2009)\n\
    Filesystem label=\nOS type: Linux\nBlock size=4096 (log=2)\nFragment size=4096\
    \ (log=2)\n122400 inodes, 489131 blocks\n24456 blocks (5.00%) reserved for the\
    \ super user\nFirst data block=0\nMaximum file system blocks=503316480\n15 block\
    \ groups\n32768 blocks per group, 32768 fragments per group\n8160 inodes per group\n\
    Superblock backups stored on blocks:\n\t32768, 98304, 163840, 229376, 294912\n\
    \nWriting inode tables: done\nCreating journal (8192 blocks): done\nWriting superblocks\
    \ and file system accounting information: done\n\nThis file system will be automatically\
    \ checked every 21 mounts or\n180 days, whichever comes first.  Use tune2fs -c\
    \ or -i to override.\n\nCreating an ext4 formatted file system using the mkfs\
    \ command\n```\n\nThe **`mkfs`** command creates (AKA formats) a file system on\
    \ a disk drive. In the above example, the **`mkfs`** command is used on a Linux\
    \ system to format the first partition of the `/dev/sdb` disk drive.\n\n> **Warning**\
    \ *The **`mkfs`** command will destroy all data on the target device.*\n\n> **Note**\
    \ *Usage syntax and supported options for **`mkfs`** vary across the different\
    \ Unix, Linux, and BSD platforms. The above example was created on a Linux system.\
    \ See `man mkfs` to find the correct usage syntax for your system.*\n\nCommon\
    \ usage examples:\n\n- `mkfs -t [FSTYPE] [DEVICE]` : Create a file system on the\
    \ specified drive\n- `mkfs -ct [FSTYPE] [DEVICE]` : Check for bad blocks before\
    \ formatting\n"
  mdcn: "\n\n## 第 10 节：文件系统\n\n**概述**\n\n本节介绍基本文件系统管理命令的使用方法。同时，还介绍了适用于 Unix、Linux\
    \ 和 BSD 系统的流行分区编辑器，例如 `fdisk` 和 `parted`。这些命令可用于创建、修改和删除文件系统。\n\n> **警告**\n>\n\
    > *如果误用以下命令，可能会对系统造成不可修复的损坏。请务必在测试环境中试用新命令。*\n\n**本节涵盖的命令：**\n\n| **命令** | **用途**\
