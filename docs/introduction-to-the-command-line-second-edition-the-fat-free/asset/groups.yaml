    # md5sum


    Purpose: Display the MD5 hash of a file.


    Usage syntax: `md5sum [OPTIONS] [FILE]`


    ```bash

    $ md5sum ubuntu.iso

    caac6ea9dde8dc158174e345aabe3fae  ubuntu.iso

    ```


