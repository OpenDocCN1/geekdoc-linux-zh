  - "[PAGE 212]\n\n# du\n\n**Purpose:** Display disk usage.\n\n**Usage syntax:** `du\
    \ [OPTIONS] [DIRECTORY/FILE]`\n\n```\n```\n$ du -hs /usr\n523M\t/usr\n```\n```\n\
    \nUsing the `du` command to display the size of a directory\n\nThe **`du`** command\
    \ displays information about disk usage. It can display the size of a specific\
    \ directory or group of files. The above example demonstrates using the **`du`**\
    \ command to display the size of the **`/usr`** directory. The **`-hs`** option\
    \ instructs **`du`** to show summarized results in \"human readable\" form. Omitting\
    \ the **`-s`** option will recursively display the size of each file under **`/usr`**,\
    \ as demonstrated below.\n\n```\n```\n$ du -h /usr/\n4.0K\t/usr/local/etc\n1.4M\t\
    /usr/local/bin\n4.0K\t/usr/local/games\n4.0K\t/usr/local/src\n4.0K\t/usr/local/sbin\n\
    224K\t/usr/local/share/man/man1\n228K\t/usr/local/share/man\n```\n```\n\nDisplaying\
    \ the size of files using the `du` command\n\nSome systems may not support the\
    \ **`-h`** parameter. In this case, the **`du`** command will display file sizes\
    \ in blocks rather than a \"human readable\" unit of measure, as shown in the\
    \ next example.\n\n```\n```\n$ du -s /usr\n534884\t/usr\n```\n```\n\nOutput of\
    \ the `du` command on older Unix systems\n\n**Common usage examples:**\n\n+  \
    \ * `du -hs` → Display the size of the current directory\n+   * `du -hs [DIRECTORY]`\
    \ → Display the size of the specified directory\n+   * `du -h [DIRECTORY]` → Display\
    \ the size of each file in the specified directory"
