    | Command | Description |\n| :--- | :--- |\n| `mail` | Check for new email |\n\
    | `mail [ADDRESS]` | Start a new message to the specified address |\n| `mail [ADDRESS]\
    \ < [FILE]` | Use the specified file as the message body |\n| `mail -s \"[SUBJECT]\"\
    \ [ADDRESS]` | Specify a message subject on the command line |\n"
