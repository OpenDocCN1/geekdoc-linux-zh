    # ## Section 13: Printing Commands


    # **Overview**


    Commands in this section cover the basics of printer management on Unix, Linux,
    and BSD systems. The Unix printing subsystem is known as **LPD** (**Line Printer
    Daemon**). Linux uses a newer printing system called **CUPS** (**Common Unix Printing
    System**). Although these two printing services are very different at their core,
    they share mostly interchangeable commands.


    **Commands covered in this section:**


    | Command | Purpose |

    | :--- | :--- |

    | **lp** | Print files. |

    | **lptest** | Display printer and print job status information. |

    | **lpq** | Display print queue status. |

    | **cancel** | Cancel and delete queued print jobs. |

    | **enable disable** | Enable/disable printers. |

    | **lpadmin** | Administer printers. |


    **Glossary of terms used in this section:**


    **CUPS**

    (**Common Unix Printing System**) A modern printing system for Unix, Linux, and
    BSD systems.


    **Print Job**

    A file that has been submitted for printing.


    **LPD**

    (**Line Printer Daemon**) Printing system used primarily on Unix and BSD systems.


    **Queue**

    A spooling system for print jobs waiting to be printed.'
