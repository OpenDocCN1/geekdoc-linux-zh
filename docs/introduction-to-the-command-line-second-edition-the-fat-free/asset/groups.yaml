    # uname


    **Purpose:** Display information about the operating system.


    **Usage syntax:** `uname [OPTIONS]`


    ```

    # uname -a

    Linux mylaptop 2.6.28-11-generic x86_64 GNU/Linux

    *Output of the uname command on Linux systems*

    ```


    **uname** displays information and the hardware and software versions installed
    on the system. This includes information such as processor type, kernel version,
    and hardware platform for the local system.


    The above example displays **uname** output on a Linux system. The next example
    displays the output on an HP-UX system.


    ```

    # uname -a

    HP-UX server1 B.10.20 C 9000/861 32-user license

    *Output of the uname command on HP-UX systems*

    ```


    The output of the **uname** varies across platforms. The table below describes
    the typical information displayed when executing **uname -a**.


    | Platform | Hostname | Version | Hardware | Other |

    | :--- | :--- | :--- | :--- | :--- |

    | Linux | mylaptop | 2.6.28-11-generic | x86_64 | GNU/Linux |

    | HP-UX | server1 | B.10.20 C | 9000/861 | 32-user license |


    **Common usage examples:**


    +   *   `uname -a` Display all information

    +   *   `uname -r` Display the kernel version number'
  - "[PAGE 214]\n\n# uptime\n\nPurpose: Display how long the system has been online.\n\
    \nUsage syntax: `uptime`\n\n```\n```bash\n$ uptime\n19:15:55 up 2 days 40 min,\
    \ 2 users, load average: 0.13, 1.15, 1.24\n```\n```\n\nOutput of the uptime command\n\
    \nThe `uptime` command displays how long a system has been online since the last\
    \ shutdown or restart. It also displays the number of users currently logged into\
    \ the system and the CPU load average.\n\nThe load average information displays\
    \ three numeric fields. These represent three samples of system load taken over\
    \ the last 1, 5, and 15 minutes. The lower the number, the lower the system load\
    \ is. For example, on a single CPU system, a .13 load average correlates to a\
    \ 13% load. A 1.15 load average would be a 115% load meaning that the system is\
    \ 15% overloaded because processes have to wait 15% of the time for system resources\
    \ (such as CPU and disk I/O).\n\n> Note  \n> The load average is displayed for\
    \ informational purposes only. It is not meant to be used as an accurate performance\
    \ gauge, as it can be affected by various factors.\n\nCommon usage examples:\n\
    \n+   `uptime` | Display system uptime and load average information"
  - '[PAGE 215]


    # dmesg


    **Purpose:** Display kernel log messages.


    **Usage syntax:** `dmesg [OPTIONS]`


    ```

    # dmesg | less

    [ 0.000000] Initializing cgroup subsys cpuset

    [ 0.000000] Initializing cgroup subsys cpu

    [ 0.000000] Linux version 2.6.24-27-server (buildd@palmer) (gcc version 4.2.4
    (Ubuntu 4.2.4-1ubuntu3)) #1 SMP Fri Mar 12 01:45:06 UTC 2010 (Ubuntu 2.6.24-27.68-server)

    [ 0.000000] BIOS-provided physical RAM map:

    [ 0.000000] BIOS-e820: 0000000000000000 - 00000000009f8000 (usable)

    [ 0.000000] BIOS-e820: 0000000009f800 - 0000000000a00000 (reserved)

    [ 0.000000] BIOS-e820: 00000000c0ca00 - 00000000dc cc000 (reserved)

    [ 0.000000] BIOS-e820: 00000000dc c00 - 000000000100000 (reserved)

    ...

    ```


    Displaying kernel messages using dmesg


    The `dmesg` command displays the kernel message log. This is the first place you
    should check when troubleshooting a problem. Executing `dmesg` displays all messages
    in the kernel log buffer, as demonstrated in the above example.


    `dmesg` output can be very lengthy. Using `grep` with the `dmesg` command is helpful
    to search for a specific message. The next example demonstrates filtering `dmesg`
    using `grep` to search for the word *fail*.


    ```

    $ dmesg | grep fail

    [39176.231722] usb-storage: probe of 2-2:1.0 failed with error -5

    [41421.627352] PM: Device 2-2 failed to resume: error -19

    [41429.152942] usb-storage: probe of 2-3:1.0 failed with error -5

    [46938.994016] usb-storage: probe of 2-3:1.0 failed with error -5

    [49869.891317] usb-storage: probe of 2-3:1.0 failed with error -5

    [57103.036672] PM: Device 2-3 failed to resume: error -19

    ...

    ```


    Searching dmesg output for an error message


    **Tip** Kernel messages are typically stored in the `/var/log/dmesg` file.


    # Common usage examples:


    | `dmesg` | Display the kernel log |

    | --- | --- |

    | `dmesg -c` | Clear all kernel log messages |'
