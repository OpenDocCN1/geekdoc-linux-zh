    # split


    **Purpose:** Split large files into multiple pieces.


    **Usage syntax:** `split [OPTIONS] [FILE] [OUTPUT]`


    ```

    $ ls -l ubuntu.iso

    -rw-r--r-- 1 nick nick 671686656 2009-10-27 12:07 ubuntu-9.10.iso

