    **Purpose**: Display and edit runlevel configuration on Gentoo Linux systems.


    **Usage syntax**: `rc-update [OPTIONS] [SERVICE] [LEVEL]`


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_133_0.png)


