    # fuser


    Purpose: Display information about open files.


    Usage syntax: `fuser [OPTIONS] [DIRECTORY/FILE]`


    ```bash

    $ fuser -v /home/nick/ShoppingList.txt

    ShoppingList.txt:  nick     14044 ..c..   tail

    ```


    Displaying information about open files with `fuser`


    `fuser` is a helpful program for identifying the person or program that is using
    a file. In the example above the `fuser` command displays the user, process id,
    and command currently using the `ShoppingList.txt` file.


    The `-ki` option can be used with the `fuser` command to terminate the process
    currently using the specified file as shown in the next example.


    ```bash

