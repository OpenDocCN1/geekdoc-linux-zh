    \n```\n$ mail grepnick@gmail.com\nSubject: Hello\nWant to go get some tacos?\n\
    <CTRL + D>\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_162_0.png)\n\nThe\
    \ mail command sends email messages. In the above example, a new email message\
    \ is created and addressed to the specified recipient. After pressing enter, the\
    \ mail client will prompt you for a subject for the message. Pressing enter again\
    \ will start the body of the message. Pressing CTRL + D exits the mail client\
