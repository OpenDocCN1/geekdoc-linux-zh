    \ example, the `badblocks` command is used to check `/dev/sda` for bad blocks.\
    \ The `-v` option is included to display verbose status information during the\
    \ scan.\n\nA disk drive that is healthy should have no bad blocks. If bad blocks\
    \ are found, the drive should be replaced immediately to avoid data loss.\n\n\
    > **Warning**\n> The default `badblocks` test is read-only and generally safe\
    \ to use on a live file system. Specifying the `-w` option will perform a read/write\
    \ test and will destroy all data on the specified disk. It should only be used\
    \ to test a disk that does not contain critical data, as it will be completely\
    \ overwritten.\n\n**Common usage examples:**\n\n- `badblocks [DEVICE]`: Check\
