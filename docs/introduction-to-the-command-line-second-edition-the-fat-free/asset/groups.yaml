    ## Overview


    This chapter covers commands used to startup and shutdown Unix, Linux, and BSD
    systems. It also provides an overview of platform specific service control commands
    for popular platforms.


    ### Commands covered in this section:


    | Command | Purpose |

    | --- | --- |

