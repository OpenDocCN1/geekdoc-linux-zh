    \ 系统也提供该工具）类似，但提供了更友好的用户界面。在上面的示例中，使用 `-1` 选项来显示指定硬盘的分区信息。\n\n不带选项执行 **parted**\
    \ 将打开指定磁盘以进行编辑，如下一个示例所示。\n\n```shell\n# parted /dev/sda\nGNU Parted 1.8.8.1.159-1e0e\n\
