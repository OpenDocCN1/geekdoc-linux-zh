  - '[PAGE 102]


    # usermod / groupmod


    **Purpose:** Modify user and group account settings.


    **Usage syntax:** `usermod [OPTIONS] [USER]`


    ```

    # usermod -aG sales nick

    Changing a user''s group membership using the usermod command

    ```


    The `usermod` command modifies user account settings. In the above example, the
    `-aG` option is used to add the user *nick* to the *sales* group. You can also
    use the `usermod` command to change a user''s home directory location using the
    `-d` option or default shell using `-s`.


    The `groupmod` command modifies groups. Its primary purpose is to rename a group.
    In the next example the *accounting* group is renamed to *finance* using `groupmod
    -n`.


    **Usage syntax:** `groupmod [OPTIONS] [GROUP]`


    ```

    # groupmod accounting -n finance

    # grep finance /etc/group

    finance:x:1002:

    Renaming a group using the groupmod command

    ```


    Common usage examples:


    | Command | Description |

    | :--- | :--- |

    | `usermod -s [SHELL] [USER]` | Change a user''s default shell |

    | `usermod -d [DIR] [USER]` | Change a user''s home directory location |

    | `usermod -aG [GROUP] [USER]` | Add a user to the specified group |

    | `groupmod [OLD] -n [NEW]` | Rename the specified group |'
