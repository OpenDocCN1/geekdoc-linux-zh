    # dd


    Purpose: Create raw copies of data devices.


    Usage syntax: `dd if=[SOURCE] of=[TARGET] [OPTIONS]`


    ```

    ```

    # dd if=/dev/sdb of=/dev/sdc

    ```

    ```


    Creating a copy of a disk using the dd command


    The `dd` command performs raw (bit for bit) copies of data devices. The `if` parameter
    specifies the input file or device to be read. The `of` parameter specifies the
    output location. In the above example, the entire hard drive `/dev/sdb` is copied
    to `/dev/sdc`.


    `dd` can also be used to create image files of a disk. The next example demonstrates
    using `dd` to create an ISO image file from a CD-ROM.


    ```

    ```

    # dd if=/dev/cdrom of=/tmp/image.iso

    ```

    ```


    Converting a CD-ROM into an ISO file using the dd command


    > **Warning** The `dd` command is often referred to as the "data destroyer" because
    it can be very destructive if used incorrectly. Always use caution when experimenting
    with `dd`.


    +   Common usage examples:

    +   * `dd if=[SOURCE] of=[TARGET]` | Create a raw copy of the specified device'
