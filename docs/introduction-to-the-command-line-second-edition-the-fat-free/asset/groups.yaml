    ```\n\nUsing the file command to identify several different types of files\n\n\
    The `file` command displays information about the contents of the specified file.\
    \ Microsoft Windows systems often use a file extension (such as `.txt`, `.exe`,\
    \ `.zip`, etc.) to identify the type of data found in a file. Unix, Linux, and\
    \ BSD files rarely include an extension which can make identifying their file\
    \ type a challenge. The `file` command is provided to resolve this problem.\n\n\
    The above example displays results for several file types commonly found on Unix,\
    \ Linux, and BSD systems. The table below displays more information about these\
    \ file types.\n\n| Type | Description |\n| :--- | :--- |\n| Ascii Text Files |\
    \ Plain text files |\n| Binary Files | Executable programs such as those located\
    \ in the /bin and /usr/bin directories |\n| Compressed Files | Files compressed\
    \ through the compress or gzip programs |\n| Device Files | Special virtual files\
    \ that represent devices |\n| Links | Links (AKA shortcuts) that point to other\
    \ files or directories |\n\n> **Note:** Basic file types found on Unix, Linux,\
    \ and BSD systems\n\nCommon usage examples:\n\n| Command | Description |\n| :---\
    \ | :--- |\n| `file [FILE]` | Display the file type for the specified files |\n\
    \n## stat\n\n**Purpose:** Display extended information about a file system, file,\
    \ or directory.\n\n**Usage syntax:** `stat [OPTIONS] [FILE/DIRECTORY]`\n\n```bash\n\
