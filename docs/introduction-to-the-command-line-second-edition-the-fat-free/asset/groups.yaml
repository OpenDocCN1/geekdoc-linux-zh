    \ _Usage syntax and supported options for **`mkfs`** vary across the different\
    \ Unix, Linux, and BSD platforms. The above example was created on a Linux system.\
    \ See `man mkfs` to find the correct usage syntax for your system._\n\n+   Common\
    \ usage examples:\n+   - `mkfs -t [FSTYPE] [DEVICE]` : Create a file system on\
