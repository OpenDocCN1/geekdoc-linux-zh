    root            4     2  0 Jun24 ?        00:00:00 [ksoftirqd/0]\nroot       \
    \     5     2  0 Jun24 ?        00:00:00 [watchdog/0]\n...  \n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_107_2.png)\n\
    \n**Common usage examples:**\n\n- `ps` | Display the current user's processes\n\
    - `ps -e` | Display all processes running on the system\n- `ps -ef` | Display\
    \ detailed information about running processes\n- `ps -u [USER]` | Display processes\
    \ owned by the specified user\n\n### pgrep\n\n**Purpose**: Find processes by name.\n\
    \n**Usage syntax**: `pgrep [OPTIONS] [NAME]`\n\n```\n$ pgrep apache\n3952\n4075\n\
    4076\n4077\n4078\n4079\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_108_0.png)\n\
    \nThe pgrep command displays all processes matching the specified name. In the\
