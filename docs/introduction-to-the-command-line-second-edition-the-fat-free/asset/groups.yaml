  md: "\n## emerge\n\n**Purpose:** Install/remove Gentoo Linux packages.\n\n**Usage\
    \ syntax:** `emerge [OPTIONS] [PACKAGE]`\n\n```bash\n# emerge uptime\nCalculating\
    \ dependencies... done!\n>>> Verifying ebuild Manifests...\n>>> Emerging (1 of\
    \ 1) app-vim/uptime-1.3 to /\n>>> Downloading 'http://distfiles.gentoo.org/distfiles/uptime-1.3.tar.bz2'\n\
    ...\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_236_0.png)\n\nemerge is a\
    \ front-end for Gentoo's Portage software manager. It provides automatic software\
    \ compilation, installation, and dependency fulfillment similar to the previously\
    \ discussed aptitude and yum commands.\n\nPortage is a unique package manager\
    \ in the fact that it compiles software from source code. This is different than\
    \ most other Linux systems which utilize precompiled binaries when installing\
    \ software. Compiling software from source code creates a platform-optimized installation\
    \ that has been shown to provide better performance when compared to precompiled\
    \ packages. Portage's disadvantage, however, is that it takes much longer to install\
    \ software from source.\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_236_1.png)\n\
    \n> *To learn more about the Portage software manager, see the official Gentoo\
    \ documentation online at www.gentoo.org/doc/.*\n\n**Common usage examples:**\n\
    \n- **emerge [PACKAGE]** Install the specified package\n- **emerge -u world**\
    \ Install the newest versions of all packages\n- **emerge -C [PACKAGE]** Remove\
    \ the specified package\n- **emerge -s [PACKAGE]** Search for the specified package\n\
    - **emerge --sync** Update the portage database\n\n## pkg_add / pkg_delete\n\n\
    **Purpose:** Install/remove BSD packages.\n\n**Usage syntax:** `pkg_add [OPTIONS]\
    \ [PACKAGE]`\n\n```bash\n# pkg_add -r perl\nFetching ftp://ftp.freebsd.org/pub/FreeBSD/ports/i386/packages-7.2-release/Latest/All/perl.tbz...\n\
    Creating various symlinks in /usr/bin...\nSymlinking /usr/local/bin/perl5.8.9\
    \ to /usr/bin/perl\n...\n```\n\nInstalling a package using the pkg_add command\n\
    \nThe pkg_add command installs software packages on BSD systems. In the above\
    \ example, pkg_add is used to install a package called Perl. The `-r` option instructs\
    \ pkg_add to retrieve the specified package automatically from the BSD software\
    \ repository.\n\n> **Tip**: The pkg_add command uses the default FTP server located\
    \ at ftp.freebsd.org. For faster download you can specify an FTP mirror using\
    \ the PACKAGEROOT environment variable. For example, typing export PACKAGEROOT=ftp.ca.freebsd.org\
    \ would instruct the pkg_add command to use the specified mirror located in Canada.\
    \ A complete list of FTP mirror sites can be found online at http://mirrordlist.freebsd.org/FBSSites.php.\n\
    \nThe pkg_delete command uninstalls software packages on BSD systems. In the next\
    \ example, the previously installed Perl package is removed using the pkg_delete\
    \ command.\n\n**Usage syntax:** `pkg_delete [PACKAGE]`\n\n```bash\n# pkg_delete\
    \ perl-5.8.9_2\nRemoving stale symlinks from /usr/bin...\nRemoving /usr/bin/perl...\
    \ Done.\n...\n```\n\nRemoving a package using the pkg_delete command\n\n**Common\
    \ usage examples:**\n\n- `pkg_add -r [PACKAGE]`: Download and install the specified\
    \ package\n- `pkg_delete [PACKAGE]`: Uninstall the specified package\n\n## pkg_info\n\
    \n**Purpose:** Display information about BSD packages.\n\n**Usage syntax:** `pkg_info\
    \ [OPTIONS]`\n\n```bash\n# pkg_info\nbash-4.0.33        The GNU Project's Bourne\
    \ Again SHell\nen-freebsd-doc-20090913 Documentation from the FreeBSD Documentation\
    \ Project\ngettext-0.17.1     GNU gettext package\nlibiconv-1.13.1    A character\
    \ set conversion library\nlua-5.1.4          Small, compatible scripting language\
    \ providing easy access\nnano-2.0.9_1       Nano's ANOTHER editor, an enhanced\
    \ free Pico clone\nnmap-5.00          Port scanning utility for large networks\n\
    pcre-7.9           Perl Compatible Regular Expressions library\nperl-5.8.9_3 \
    \      Practical Extraction and Report Language\npkg-config-0.23.1  A utility\
    \ to retrieve information about installed libraries\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_238_0.png)\n\
    \nThe **pkg_info** command displays information about installed packages on BSD\
    \ systems. In the above example, executing **pkg_info** with no options generates\
    \ a simple list of installed programs.\n\nExecuting the **pkg_info** command with\
    \ the **-a** option displays detailed information about the installed packages\
    \ as displayed in the next example.\n\n```bash\n# pkg_info nmap-5.00 | less\n\
    Information for nmap-5.00:\n\nComment: Port scanning utility for large networks\n\
    \nDescription: Nmap is a utility for network exploration and security auditing.\n\
    ...\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_238_1.png)\n\n**Common usage\
    \ examples:**\n\n| Command | Description |\n|---|---|\n| **pkg_info** | Display\
    \ a simple list of installed packages |\n| **pkg_info -a** | Display a detailed\
    \ list of installed packages |\n| **pkg_info [PACKAGE]** | Display information\
    \ about the specified package |\n\n## installp\n\n**Purpose:** Install software\
    \ packages on AIX systems.\n\n**Usage syntax:** `installp [OPTIONS] [PACKAGE]`\n\
    \n```bash\n# installp -Yd /mnt/cdrom httpd.base\n...\nInstallation Summary\n-------------------\n\
    Name          Level        Part      Event     Result\n-------------------------------------------------------\n\
    httpd.base    2.2.6.0      USR       APPLY     SUCCESS\n```\n\nInstalling the\
    \ Apache http server on AIX\n\nThe installp command installs software packages\
    \ on AIX systems. The above example demonstrates installing the Apache web server\
    \ package located on the install media mounted in /mnt/cdrom.\n\n> **Note:** The\
    \ -Y option accepts any required license agreements during installation.\n\nTo\
    \ remove a package, use the -u option as demonstrated in the next example.\n\n\
    ```bash\n# installp -u httpd.base\n...\nInstallation Summary\n-------------------\n\
    Name          Level        Part      Event       Result\n-------------------------------------------------------\n\
    httpd.base    2.2.6.0      USR       DEINSTALL   SUCCESS\n```\n\nRemoving a package\
    \ on AIX\n\n**Common usage examples:**\n\n| Command | Description |\n|---|---|\n\
    | installp -ld [MEDIA] | List packages on the specified media |\n| installp -Yd\
    \ [PATH] [PACKAGE] | Install the specified package |\n| installp -u [PACKAGE]\
    \ | Uninstall the specified package |\n\n## lslpp\n\n**Purpose:** List installed\
    \ software on AIX systems.\n\n**Usage syntax:** `lslpp [OPTIONS] [PACKAGE]`\n\n\
    ```bash\n# lslpp -L httpd.base\n   Fileset      Level  State  Type  Description\
    \ (Uninstaller)\n-------------------------------------------------------------\n\
    \  httpd.base        2.2.6.0   C      F      Apache Http Server\n\nState codes:\n\
    \  A -- Applied.\n  B -- Broken.\n  C -- Committed.\n  E -- EFIX Locked.\n  O\
    \ -- Obsolete.  (partially migrated to newer version)\n  ? -- Inconsistent State...Run\
    \ lppchk -v.\n\nType codes:\n  F -- Installp Fileset\n  P -- Product\n  C -- Component\n\
    \  T -- Feature\n  R -- RPM Package\n  E -- Interim Fix\n```\n\nListing an installed\
    \ package on AIX\n\nThe `lslpp` command lists installed software on AIX systems.\
    \ The example above demonstrates using `lslpp` to list the installation status\
    \ of the `httpd.base` package.\n\n> **Note:** Omitting a package name will list\
    \ all installed software on the system.\n\n**Common usage examples:**\n\n| Command\
    \ | Description |\n|---|---|\n| `lslpp -L` | List all installed packages |\n|\
    \ `lslpp -L [PACKAGE]` | List the specified install package |\n\n## pkadd / pkgrem\n\
    \n**Purpose:** Install/remove Solaris packages.\n\n**Usage syntax:** `pkadd [OPTIONS]\
    \ [PATH]`\n\n```bash\n# pkadd -d /cdrom/sol_10_1009_x86/Solaris_10/Product/\n\
    The following packages are available:\n...\n91  SUNWapch2d      Apache Web Server\
    \ V2 Documentation\n(i386) 11.10.0,REV=2005.01.08.01.09\n92  SUNWapch2r      Apache\
    \ Web Server V2 (root)\n(i386) 11.10.0,REV=2005.01.08.01.09\n93  SUNWapch2u  \
    \    Apache Web Server V2 (usr)\n(i386) 11.10.0,REV=2005.01.08.01.09\n94  SUNWapchS\
    \       Source for the Apache httpd server\n(i386) 11.10.0,REV=2005.01.08.01.09\n\
    ...\nSelect package(s) you wish to process (or 'all' to process\nall packages).\
    \  (default: all) [?,??,q]: 92\n...\nInstallation of <SUNWapch2r> was successful.\n\
    ```\n\nInstalling a software package on Solaris\n\nThe `pkadd` command installs\
    \ software packages on Solaris systems. The example above demonstrates using `pkadd`\
    \ to install packages from the Solaris installation media.\n\nThe `pkgrem` command\
    \ removes packages on Solaris systems. The next example demonstrates removing\
    \ a package using `pkgrem`.\n\n**Usage syntax:** `pkgrem [OPTIONS] [PACKAGE]`\n\
    \n```bash\n# pkgrem SUNWapch2r\nThe following package is currently installed:\n\
    SUNWapch2r Apache Web Server V2 (root)\n(i386) 11.10.0,REV=2005.01.08.01.09\n\
    Do you want to remove this package? [y,n,?,q]\n...\nRemoval of <SUNWapch2r> was\
    \ successful.\n```\n\nRemoving a package on Solaris\n\n**Common usage examples:**\n\
    \n| Command | Description |\n|---|---|\n| `pkadd -d [PATH]` | Install packages\
    \ from the specified location |\n| `pkgrem [PACKAGE]` | Remove the specified package\
    \ |\n"
  mdcn: "\n\n## emerge\n\n**用途：** 安装/移除 Gentoo Linux 软件包。\n\n**用法语法：** `emerge [OPTIONS]\
    \ [PACKAGE]`\n\n```bash\n# emerge uptime\nCalculating dependencies... done!\n\
    >>> Verifying ebuild Manifests...\n>>> Emerging (1 of 1) app-vim/uptime-1.3 to\
    \ /\n>>> Downloading 'http://distfiles.gentoo.org/distfiles/uptime-1.3.tar.bz2'\n\
    ...\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_236_0.png)\n\nemerge 是 Gentoo\
    \ Portage 软件包管理器的前端。它提供自动软件编译、安装和依赖项满足功能，类似于前文讨论过的 aptitude 和 yum 命令。\n\nPortage\
    \ 的独特之处在于它从源代码编译软件。这与大多数其他使用预编译二进制文件进行软件安装的 Linux 系统不同。从源代码编译软件可以创建针对特定平台优化的安装环境，研究表明与预编译软件包相比，其性能更优。然而，Portage\
    \ 的缺点是从源代码安装软件所需的时间要长得多。\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_236_1.png)\n\
    \n> *欲了解有关 Portage 软件包管理器的更多信息，请参见 www.gentoo.org/doc/ 上的 Gentoo 官方文档。*\n\n**常见用法示例：**\n\
    \n- **emerge [PACKAGE]** 安装指定软件包\n- **emerge -u world** 安装所有软件包的最新版本\n- **emerge\
    \ -C [PACKAGE]** 移除指定软件包\n- **emerge -s [PACKAGE]** 搜索指定软件包\n- **emerge --sync**\
    \ 更新 portage 数据库\n\n## pkg_add / pkg_delete\n\n**用途：** 安装/移除 BSD 软件包。\n\n**用法语法：**\
    \ `pkg_add [OPTIONS] [PACKAGE]`\n\n```bash\n# pkg_add -r perl\nFetching ftp://ftp.freebsd.org/pub/FreeBSD/ports/i386/packages-7.2-release/Latest/All/perl.tbz...\n\
    Creating various symlinks in /usr/bin...\nSymlinking /usr/local/bin/perl5.8.9\
    \ to /usr/bin/perl\n...\n```\n\n使用 pkg_add 命令安装软件包\n\npkg_add 命令用于在 BSD 系统上安装软件包。在上面的示例中，pkg_add\
    \ 用于安装一个名为 Perl 的软件包。`-r` 选项指示 pkg_add 自动从 BSD 软件仓库获取指定软件包。\n\n> **提示**：pkg_add\
    \ 命令使用位于 ftp.freebsd.org 的默认 FTP 服务器。为了获得更快的下载速度，可以使用 PACKAGEROOT 环境变量指定 FTP 镜像。例如，输入\
    \ export PACKAGEROOT=ftp.ca.freebsd.org 将指示 pkg_add 命令使用位于加拿大的指定镜像。完整的 FTP 镜像站点列表可在\
    \ http://mirrordlist.freebsd.org/FBSSites.php 在线找到。\n\npkg_delete 命令用于在 BSD 系统上卸载软件包。在接下来的示例中，使用\
    \ pkg_delete 命令移除了之前安装的 Perl 软件包。\n\n**用法语法：** `pkg_delete [PACKAGE]`\n\n```bash\n\
    # pkg_delete perl-5.8.9_2\nRemoving stale symlinks from /usr/bin...\nRemoving\
    \ /usr/bin/perl... Done.\n...\n```\n\n使用 pkg_delete 命令移除软件包\n\n**常见用法示例：**\n\n\
    - `pkg_add -r [PACKAGE]`：下载并安装指定软件包\n- `pkg_delete [PACKAGE]`：卸载指定软件包\n\n## pkg_info\n\
    \n**用途：** 显示 BSD 软件包信息。\n\n**用法语法：** `pkg_info [OPTIONS]`\n\n```bash\n# pkg_info\n\
    bash-4.0.33        The GNU Project's Bourne Again SHell\nen-freebsd-doc-20090913\
    \ Documentation from the FreeBSD Documentation Project\ngettext-0.17.1     GNU\
    \ gettext package\nlibiconv-1.13.1    A character set conversion library\nlua-5.1.4\
    \          Small, compatible scripting language providing easy access\nnano-2.0.9_1\
    \       Nano's ANOTHER editor, an enhanced free Pico clone\nnmap-5.00        \
    \  Port scanning utility for large networks\npcre-7.9           Perl Compatible\
    \ Regular Expressions library\nperl-5.8.9_3       Practical Extraction and Report\
    \ Language\npkg-config-0.23.1  A utility to retrieve information about installed\
    \ libraries\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_238_0.png)\n\n**pkg_info**\
    \ 命令用于显示 BSD 系统上已安装软件包的信息。在上面的示例中，不带选项执行 **pkg_info** 会生成一个简单的已安装程序列表。\n\n使用 **-a**\
    \ 选项执行 **pkg_info** 命令会显示关于已安装软件包的详细信息，如下一个示例所示。\n\n```bash\n# pkg_info nmap-5.00\
    \ | less\nInformation for nmap-5.00:\n\nComment: Port scanning utility for large\
    \ networks\n\nDescription: Nmap is a utility for network exploration and security\
    \ auditing.\n...\n```\n\n![](img/fa2f95b64a707c963dfa0445bd9281a7_238_1.png)\n\
    \n**常见用法示例：**\n\n| 命令 | 描述 |\n|---|---|\n| **pkg_info** | 显示已安装软件包的简单列表 |\n| **pkg_info\
    \ -a** | 显示已安装软件包的详细列表 |\n| **pkg_info [PACKAGE]** | 显示指定软件包的信息 |\n\n## installp\n\
    \n**用途：** 在 AIX 系统上安装软件包。\n\n**用法语法：** `installp [OPTIONS] [PACKAGE]`\n\n```bash\n\
    # installp -Yd /mnt/cdrom httpd.base\n...\nInstallation Summary\n-------------------\n\
    Name          Level        Part      Event     Result\n-------------------------------------------------------\n\
    httpd.base    2.2.6.0      USR       APPLY     SUCCESS\n```\n\n在 AIX 上安装 Apache\
    \ http 服务器\n\ninstallp 命令用于在 AIX 系统上安装软件包。上述示例展示了如何安装位于挂载在 /mnt/cdrom 中的安装介质上的\
    \ Apache Web 服务器软件包。\n\n> **注意**：-Y 选项在安装期间接受任何所需的许可协议。\n\n要移除软件包，请使用下一个示例中所示的\
    \ -u 选项。\n\n```bash\n# installp -u httpd.base\n...\nInstallation Summary\n-------------------\n\
    Name          Level        Part      Event       Result\n-------------------------------------------------------\n\
    httpd.base    2.2.6.0      USR       DEINSTALL   SUCCESS\n```\n\n在 AIX 上移除软件包\n\
    \n**常见用法示例：**\n\n| 命令 | 描述 |\n|---|---|\n| installp -ld [MEDIA] | 列出指定介质上的软件包\
    \ |\n| installp -Yd [PATH] [PACKAGE] | 安装指定软件包 |\n| installp -u [PACKAGE] | 卸载指定软件包\
    \ |\n\n## lslpp\n\n**用途：** 列出 AIX 系统上已安装的软件。\n\n**用法语法：** `lslpp [OPTIONS] [PACKAGE]`\n\
    \n```bash\n# lslpp -L httpd.base\n   Fileset      Level  State  Type  Description\
    \ (Uninstaller)\n-------------------------------------------------------------\n\
    \  httpd.base        2.2.6.0   C      F      Apache Http Server\n\nState codes:\n\
    \  A -- Applied.\n  B -- Broken.\n  C -- Committed.\n  E -- EFIX Locked.\n  O\
    \ -- Obsolete.  (partially migrated to newer version)\n  ? -- Inconsistent State...Run\
    \ lppchk -v.\n\nType codes:\n  F -- Installp Fileset\n  P -- Product\n  C -- Component\n\
    \  T -- Feature\n  R -- RPM Package\n  E -- Interim Fix\n```\n\n在 AIX 上列出已安装软件包\n\
    \n`lslpp` 命令用于列出 AIX 系统上已安装的软件。上述示例展示了使用 `lslpp` 列出 `httpd.base` 软件包的安装状态。\n\n\
    > **注意**：省略软件包名将列出系统上所有已安装的软件。\n\n**常见用法示例：**\n\n| 命令 | 描述 |\n|---|---|\n| `lslpp\
    \ -L` | 列出所有已安装软件包 |\n| `lslpp -L [PACKAGE]` | 列出指定的安装软件包 |\n\n## pkadd / pkgrem\n\
    \n**用途：** 安装/移除 Solaris 软件包。\n\n**用法语法：** `pkadd [OPTIONS] [PATH]`\n\n```bash\n\
    # pkadd -d /cdrom/sol_10_1009_x86/Solaris_10/Product/\nThe following packages\
    \ are available:\n...\n91  SUNWapch2d      Apache Web Server V2 Documentation\n\
    (i386) 11.10.0,REV=2005.01.08.01.09\n92  SUNWapch2r      Apache Web Server V2\
    \ (root)\n(i386) 11.10.0,REV=2005.01.08.01.09\n93  SUNWapch2u      Apache Web\
    \ Server V2 (usr)\n(i386) 11.10.0,REV=2005.01.08.01.09\n94  SUNWapchS       Source\
    \ for the Apache httpd server\n(i386) 11.10.0,REV=2005.01.08.01.09\n...\nSelect\
    \ package(s) you wish to process (or 'all' to process\nall packages).  (default:\
    \ all) [?,??,q]: 92\n...\nInstallation of <SUNWapch2r> was successful.\n```\n\n\
    在 Solaris 上安装软件包\n\n`pkadd` 命令用于在 Solaris 系统上安装软件包。上述示例展示了使用 `pkadd` 从 Solaris\
    \ 安装介质安装软件包。\n\n`pkgrem` 命令用于在 Solaris 系统上移除软件包。下一个示例展示了使用 `pkgrem` 移除软件包。\n\n\
    **用法语法：** `pkgrem [OPTIONS] [PACKAGE]`\n\n```bash\n# pkgrem SUNWapch2r\nThe following\
    \ package is currently installed:\nSUNWapch2r Apache Web Server V2 (root)\n(i386)\
    \ 11.10.0,REV=2005.01.08.01.09\nDo you want to remove this package? [y,n,?,q]\n\
    ...\nRemoval of <SUNWapch2r> was successful.\n```\n\n在 Solaris 上移除软件包\n\n**常见用法示例：**\n\
    \n| 命令 | 描述 |\n|---|---|\n| `pkadd -d [PATH]` | 从指定位置安装软件包 |\n| `pkgrem [PACKAGE]`\
    \ | 移除指定软件包 |\n\n"
