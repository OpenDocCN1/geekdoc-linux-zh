    \       2.0G   508K  2.0G   1% /dev/shm\nlrm             2.0G   2.7M  1.9G   1%\
    \ /lib/modules/2.6.28-11\n```\n\n`df` 命令的典型输出\n\n`df` 命令在 Unix、Linux 和 BSD 系统上显示文件系统使用情况信息。输出结果显示了每个文件系统的大小、已用空间和可用空间。\n\
    \n在某些系统上，`df` 还会显示关于伪文件系统的信息。这些文件系统通常不包含实际文件，仅存在于内存中，用于提供对内核设施的访问。在上述示例中，前两行是实际文件系统，其余条目是伪文件系统。\n\
    \n> **提示**\n>\n> 某些系统可能支持使用 `-h` 参数，如上述示例所示。该选项以千字节、兆字节和吉字节显示“人类可读”的输出，而不是默认度量单位（通常是\
    \ 1k 或 512k 块）。请参考 `man df` 以验证本地系统默认使用的度量单位。\n\n**常见用法示例：**\n\n- `df`：显示文件系统使用情况信息\n\
    - `df -h`：以人类可读格式（即兆字节和吉字节）显示大小\n\n## du\n\n**用途：** 显示磁盘使用情况。\n\n**用法语法：** `du\
    \ [OPTIONS] [DIRECTORY/FILE]`\n\n```\n$ du -hs /usr\n523M\t/usr\n```\n\n使用 `du`\
    \ 命令显示目录的大小\n\n`du` 命令显示关于磁盘使用情况的信息。它可以显示特定目录或一组文件的大小。上述示例演示了使用 `du` 命令显示 `/usr`\
    \ 目录的大小。`-hs` 选项指示 `du` 以“人类可读”形式显示汇总结果。如果省略 `-s` 选项，则会递归显示 `/usr` 下每个文件的大小，如下所示。\n\
    \n```\n$ du -h /usr/\n4.0K\t/usr/local/etc\n1.4M\t/usr/local/bin\n4.0K\t/usr/local/games\n\
    4.0K\t/usr/local/src\n4.0K\t/usr/local/sbin\n224K\t/usr/local/share/man/man1\n\
    228K\t/usr/local/share/man\n```\n\n使用 `du` 命令显示文件的大小\n\n某些系统可能不支持 `-h` 参数。在这种情况下，`du`\
    \ 命令将以块为单位显示文件大小，而不是“人类可读”的度量单位，如下例所示。\n\n```\n$ du -s /usr\n534884\t/usr\n```\n\
    \n旧版 Unix 系统上 `du` 命令的输出\n\n**常见用法示例：**\n\n- `du -hs`：显示当前目录的大小\n- `du -hs [DIRECTORY]`：显示指定目录的大小\n\
    - `du -h [DIRECTORY]`：显示指定目录中每个文件的大小\n\n## uname\n\n**用途：** 显示有关操作系统的信息。\n\n**用法语法：**\
    \ `uname [OPTIONS]`\n\n```\n$ uname -a\nLinux mylaptop 2.6.28-11-generic x86_64\
    \ GNU/Linux\n```\n\nLinux 系统上 `uname` 命令的输出\n\n`uname` 显示有关系统上安装的硬件和软件版本的信息。这包括处理器类型、内核版本和本地系统的硬件平台等信息。\n\
    \n上述示例显示了 Linux 系统上的 `uname` 输出。下一个示例显示了 HP-UX 系统上的输出。\n\n```\n$ uname -a\nHP-UX\
    \ server1 B.10.20 C 9000/861 32-user license\n```\n\nHP-UX 系统上 `uname` 命令的输出\n\
    \n`uname` 的输出因平台而异。下表描述了执行 `uname -a` 时显示的典型信息。\n\n| 平台 | 主机名 | 版本 | 硬件 | 其他 |\n\
    | :--- | :--- | :--- | :--- | :--- |\n| Linux | mylaptop | 2.6.28-11-generic |\
    \ x86_64 | GNU/Linux |\n| HP-UX | server1 | B.10.20 C | 9000/861 | 32-user license\
    \ |\n\n**常见用法示例：**\n\n- `uname -a`：显示所有信息\n- `uname -r`：显示内核版本号\n\n## uptime\n\
    \n**用途：** 显示系统在线运行的时长。\n\n**用法语法：** `uptime`\n\n```\n$ uptime\n19:15:55 up 2 days\
    \ 40 min, 2 users, load average: 0.13, 1.15, 1.24\n```\n\n`uptime` 命令的输出\n\n`uptime`\
    \ 命令显示系统自上次关机或重启以来已在线运行的时长。它还显示当前登录到系统的用户数量以及 CPU 负载平均值。\n\n负载平均值信息显示三个数字字段。这些代表过去\
    \ 1、5 和 15 分钟内的三个系统负载样本。数字越低，系统负载越低。例如，在单 CPU 系统上，0.13 的负载平均值对应于 13% 的负载。1.15\
    \ 的负载平均值意味着 115% 的负载，表示系统过载了 15%，因为进程需要等待 15% 的时间来获取系统资源（如 CPU 和磁盘 I/O）。\n\n>\
    \ **注意**\n>\n> 负载平均值仅用于信息展示。它不打算作为准确的性能衡量指标，因为它可能会受到各种因素的影响。\n\n常见用法示例：\n\n- `uptime`：显示系统在线运行时长和负载平均值信息\n\
    \n## dmesg\n\n**用途：** 显示内核日志消息。\n\n**用法语法：** `dmesg [OPTIONS]`\n\n```\n# dmesg\
    \ | less\n[ 0.000000] Initializing cgroup subsys cpuset\n[ 0.000000] Initializing\
    \ cgroup subsys cpu\n[ 0.000000] Linux version 2.6.24-27-server (buildd@palmer)\
    \ (gcc version 4.2.4 (Ubuntu 4.2.4-1ubuntu3)) #1 SMP Fri Mar 12 01:45:06 UTC 2010\
    \ (Ubuntu 2.6.24-27.68-server)\n[ 0.000000] BIOS-provided physical RAM map:\n\
    [ 0.000000] BIOS-e820: 0000000000000000 - 00000000009f8000 (usable)\n[ 0.000000]\
    \ BIOS-e820: 00000000009f8000 - 0000000000a00000 (reserved)\n[ 0.000000] BIOS-e820:\
    \ 00000000c0ca0000 - 000000000dc00000 (reserved)\n[ 0.000000] BIOS-e820: 00000000dc0000\
    \ - 0000000001000000 (reserved)\n...\n```\n\n使用 `dmesg` 显示内核消息\n\n`dmesg` 命令显示内核消息日志。这是排查问题时应该首先检查的地方。执行\
    \ `dmesg` 会显示内核日志缓冲区中的所有消息，如上述示例所示。\n\n`dmesg` 的输出可能非常冗长。结合使用 `grep` 和 `dmesg`\
    \ 命令有助于搜索特定消息。下一个示例演示了如何使用 `grep` 过滤 `dmesg` 以搜索单词 *fail*。\n\n```\n$ dmesg | grep\
    \ fail\n[39176.231722] usb-storage: probe of 2-2:1.0 failed with error -5\n[41421.627352]\
    \ PM: Device 2-2 failed to resume: error -19\n[41429.152942] usb-storage: probe\
    \ of 2-3:1.0 failed with error -5\n[46938.994016] usb-storage: probe of 2-3:1.0\
    \ failed with error -5\n[49869.891317] usb-storage: probe of 2-3:1.0 failed with\
    \ error -5\n[57103.036672] PM: Device 2-3 failed to resume: error -19\n...\n```\n\
    \n在 `dmesg` 输出中搜索错误消息\n\n**提示** 内核消息通常存储在 `/var/log/dmesg` 文件中。\n\n**常见用法示例：**\n\
    \n| 命令 | 描述 |\n| :--- | :--- |\n| `dmesg` | 显示内核日志 |\n| `dmesg -c` | 清除所有内核日志消息\
    \ |\n\n"
