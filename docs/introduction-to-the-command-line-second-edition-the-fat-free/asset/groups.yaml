    # Common Unix, Linux, and BSD File Systems


    Unix, Linux, and BSD share support for several types of file systems. The table
    below provides a matrix of the most common file systems and their supported platforms.


    | | AIX | HP-UX | Solaris | BSD | Linux |

    |---|---|---|---|---|---|

    | EXT2-4 | Partial | No | Partial | Partial | Yes |

    | JFS (IBM) | Yes | No | No | No | Yes |

    | HFS+ | No | No | No | No | Partial |

    | UFS | No | Yes | Yes | Yes | Partial |

    | VxFS | Yes | Yes | Yes | No | Yes |

    | ZFS | No | No | Yes | Yes | Yes |


    **EXT** versions 2 through 4 are file systems used by the Linux operating system.
    Currently, ext3 is the most widely used file system on Linux distributions. The
    recently released ext4 file system has many new features and performance benefits
    over ext3. It will become the default file system for most Linux systems within
    the next few years. Versions before ext3 are considered obsolete and are rarely.


    **JFS** is IBM''s journaling file system primarily used on the AIX operating system.


    **HFS+** is Apple''s file system used on their Unix-based Mac OS X operating system.
    HFS+ isn''t widely supported by other operating systems but it can be mounted
    as read-only on Linux systems.


    **UFS** is a Unix file system used primarily by BSD distributions.


    **VxFS** is a file system developed by Veritas Software Corporation (now known
    as Symantec) and used on HP-UX systems. It is also supported on several other
    Unix and Linux systems although it is rarely used outside of HP-UX.


    **ZFS** is a new and highly robust file system developed by Sun Microsystems.
    It is primarily used on the Solaris operating system but also has limited support
    for some Linux and BSD systems.'
