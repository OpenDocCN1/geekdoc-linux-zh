    \ port 67\nDHCPACK of 10.10.1.100 from 10.10.1.45\nbound to 10.10.1.100 -- renewal\
    \ in 37193 seconds,\nUsing dhclient to request a DHCP address\n```\n\n**dhclient**\
    \ is a client for requesting an IP address from a DHCP server. The above example\
