    # crontab


    **Purpose**: Schedule programs to run at the specified time(s).


    **Usage syntax**: `crontab [OPTIONS]`


    ```

    ```bash

    # crontab -l

    30 12 * * 1-5 /root/SomeProgram.sh


    Displaying configured cron jobs

    ```

    ```


    The `crontab` command manages a user''s scheduled cron jobs. Cron is a subsystem
    found on most Unix, Linux, and BSD systems that schedules programs to run at a
    specific interval. It differs from the previously discussed `at` command because
    cron jobs run at reoccurring intervals (where `at` jobs run only once).


    > Note The name cron comes from the Greek word "chronos" which means "time".


    In the above example, the `-l` option is used to display the current user''s crontab.
    The table below describes the fields found in the crontab file.


    | Minute | Hour | Day of Month | Month | Day of Week | Program |

    |:---:|:---:|:---:|:---:|:---:|:---:|

    | 30 | 12 | * | * | 1-5 | /root/SomeProgram.sh |


    Crontab fields


    In this example `SomeProgram.sh` is run every Monday-Friday at 12:30 PM. The day
    of week is symbolized as 0=Sunday, 1=Monday, 2=Tuesday, etc. An asterisk (\*)
    is a wild card that represents all valid values.


    `crontab -e` is used to edit the current user''s crontab as demonstrated in the
    next example.


    ```

    ```bash

    # crontab -e

    30 12 * * 1-5 /root/SomeProgram.sh


    Editing the crontab

    ```

    ```


    +   **Common usage examples**:

    +   `crontab -l` | List the current user''s crontab

    +   `crontab -e` | Edit the current user''s crontab

    +   `crontab -r` | Delete the current user''s crontab'
