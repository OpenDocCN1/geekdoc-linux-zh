    \ file.\n\n**Usage syntax:** `file [OPTIONS] [FILE]`\n\n```bash\n$ file /bin/bash\n\
    /bin/bash: ELF 64-bit LSB executable, x86-64, version 1 (SYSV),\ndynamically linked\
    \ (uses shared libs), for GNU/Linux 2.6.15, stripped\n$ file /etc/hosts\n/etc/hosts:\
