    ## stopsrc / startsrc


    **Purpose**: Start/stop services on AIX systems.


    **Usage syntax**: `startsrc [OPTIONS] [SERVICE/GROUP]`


    ```bash

    # startsrc -s nfsd

    0513-059 The nfsd Subsystem has been started. Subsystem PID is 221400.

    ```


    Starting a service on AIX with startsrc


    The `startsrc` command starts services (known as SRCs or system resource controllers)
    on AIX systems. The above example demonstrates using the `startsrc` command to
    start the NFS service.


    The `stopsrc` command stops services on AIX systems. The next example demonstrates
    using `stopsrc` to stop the NFS service.


    **Usage syntax**: `stopsrc [OPTIONS] [SERVICE/GROUP]`


    ```bash

    # stopsrc -s nfsd

    0513-044 The nfsd Subsystem was requested to stop.

    ```


    Stopping a service on AIX with stopsrc


    **Common usage examples:**


    - `startsrc -s [SERVICE]` Start the specified service

    - `stopsrc -s [SERVICE]` Stop the specified service

    - `startsrc -g [GROUP]` Start the specified group of services

    - `stopsrc -g [GROUP]` Stop the specified group of services

    - `stopsrc -a` Stop all running services


    ## svcs


    **Purpose**: Display the status of services on Solaris systems.


    **Usage syntax**: `svcs [OPTIONS] [SERVICE]`


    ```bash

    # svcs

    STATE     STIME   FMRI

    legacy_run 19:41:19 lrc:/etc/rc3_d/550sk98xso1

    legacy_run 19:42:11 lrc:/etc/rc2_d/5501u

    legacy_run 19:42:11 lrc:/etc/rc2_d/5520syssetup

    legacy_run 19:42:11 lrc:/etc/rc2_d/554011c2

    legacy_run 19:42:12 lrc:/etc/rc2_d/542ncnakmod

