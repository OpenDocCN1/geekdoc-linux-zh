    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_165_0.png)


    The **showmount** command displays information about an NFS server running on
    the local system. The above example demonstrates using **showmount** to display
    a list of clients currently connected to the NFS server.


    The next example demonstrates using the **-e** option to display the NFS server''s
    export list.


    ```

    # showmount -e

    Export list for noc-01:

    /home 10.10.1.0/255.255.255.0

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_165_1.png)


    The **-d** option is used to display a list of exported directories that are currently
    in use, as shown in the next example.


    ```

    # showmount -d

    Directories on noc-01:

    /home

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_165_2.png)


    **Common usage examples:**


