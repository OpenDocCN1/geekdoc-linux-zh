    \ This is necessary since, in this case, the `/` file system is a live (mounted)\
    \ file system and cannot be repaired unless first unmounted.\n\n> **Warning**\n\
    > *The `fsck` command should never be used to repair a mounted file system as\
    \ it will cause data corruption. In Linux, you can safely run `fsck` at the next\
    \ reboot by typing `sudo touch /forcefsck` on the command line. Other systems\
    \ may require booting recovery media in order to use `fsck`. See `man fsck` for\
    \ more information about usage on your system.*\n\n**Common usage examples:**\n\
    \n| Command | Description |\n| :--- | :--- |\n| `fsck [FILESYSTEM]` | Check and\
    \ repair the specified file system |\n| `fsck -n [FILESYSTEM]` | Check the specified\
    \ file system without repairing it |\n\n## badblocks\n\n**Purpose:** Check a disk\
    \ drive for bad blocks.\n\n**Usage syntax:** `badblocks [OPTIONS] [DEVICE]`\n\n\
    ```text\n# badblocks -v /dev/sda\nChecking blocks 0 to 8388607\nChecking for bad\
    \ blocks (read-only test): done\nPass completed, 0 bad blocks found.\n```\n\n\
    ![](img/fa2f95b64a707c963dfa0445bd9281a7_184_0.png)\n\nThe `badblocks` command\
