    # # find


    **Purpose:** Search for files and directories.


    **Usage syntax:** find [PATH] [OPTIONS] [CRITERIA]


    ```

    # find / -name hosts

    /etc/avahi/hosts

    /etc/hosts

    /usr/share/hosts

    ```


    Using the find command to locate files with the word "hosts" in their name


    The find command performs a raw search on a file system to locate the specified
    items. You can search for files using a number of characteristics - the most common
    being file name, owner, size, or modification time. The above example displays
    the results of a search for files that contain the word "hosts" in their file
    name.


    The next example displays the results of a search for files owned by the specified
    user located within the /var directory.


    ```

    # find /var -user nick

    /var/mail/nick

    ```


    Locating files owned by a specific user within the /var directory


    > > Since the find command performs a raw search on the file system, results can
    sometimes be slow. It''s a good idea to narrow your search to a specific location
    instead of the entire file system. This will produce faster results and not bog
    down the system while searching.


    Common usage examples:


    | Command | Description |

    | --- | --- |

    | find [PATH] -name [NAME] | Find files with the specified name |

    | find [PATH] -user [USERNAME] | Find files owned by the specified user |

    | find [PATH] -size [FILESIZE] | Find files larger than the specified size |

    | find [PATH] -mtime 0 | Find files modified in the last 24 hours |'
  - '[PAGE 27]


    # locate


    **Purpose:** Search the locate database for files and directories.


    **Usage syntax:** `locate [OPTIONS] [DIRECTORY/FILE]`


    ```

    ```

    $ locate hosts

    /etc/avahi/hosts

    /etc/hosts

    /usr/share/hosts

    ```

    ```


    Searching the locate database for files that contain the word "hosts" in their
    name


    The `locate` command displays the location of files that match the specified name.
    While similar to the `find` command, `locate` is significantly faster because
    it searches a database of indexed filenames rather than performing a raw search
    of the entire file system. A disadvantage of the `locate` command is the fact
    that it lacks the ability to search for advanced characteristics such as file
    owner, size, and modification time.


    Most Linux and BSD systems have implemented `locate` in order to provide a quick
    method to locate files by name without affecting the performance of the system.


    > **Note**

    > *The `locate` database is updated daily via an automatically scheduled cron
    job (discussed on page 121) that indexes all local file systems. By default, this
    usually happens once a day. This means that results are not updated in real-time
    and newly created or deleted files may not reflect in the results until the next
    scheduled update.*


    **Common usage examples:**


    | | |

    | `locate [FILE]` | Locate the specified file |

    | `locate -i [FILE]` | Ignore case when searching |'
