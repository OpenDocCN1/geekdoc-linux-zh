    Combining split files using the `cat` command


    > You can use the `cksum` or `md5sum` command to verify the joined file is the
    same as the original.


    **Common usage examples:**


    1.  `split -b [SIZE] [FILE] [OUTPUT]` — Split a file into multiple pieces

    2.  `split -d -b [SIZE] [FILE] [OUTPUT]` — Use numeric suffixes

