    \ 1 root daemon     144 2009-02-20 07:41 at.deny\n-rw-r--r- 1 root root     1733\
    \ 2008-05-12 13:33 bash.bashrc\n-rw-r--r- 1 root root   216529 2008-04-14 20:45\
    \ bash_completion\ndrwxr-x-x 2 root root     4096 2010-04-05 10:59 bash_completion.d\n\
    :\n```\n\n在命令行上使用管道\n\n如果在 `/etc` 目录上使用 **ls -l**，通常目录内容会快速滚动在屏幕上。将 **ls -l**\
    \ 的输出通过管道传递给 **more** 命令（在第 71 页讨论）会逐页显示 `/etc` 目录的内容。\n\n与管道常用的另一个命令是 **grep**（在第\
    \ 76 页讨论）。**grep** 实用程序可用于过滤命令或文件的输出并显示匹配结果。下一个示例演示了将 **ls** 命令的输出通过管道传递给 **grep**\
    \ 以过滤结果并显示包含单词 **hosts** 的匹配项。\n\n```\n$ ls -l /etc | grep host\n-rw-r-r- 1 root\
    \ root      92 2007-10-20 06:51 host.conf\n-rw-f--r- 1 root root      9 2008-08-19\
    \ 15:29 hostname\n-rw-f--r- 1 root root     300 2009-12-07 09:19 hosts\n-rw-f--r-\
    \ 1 root root     579 2008-08-18 13:30 hosts.allow\n-rw-f--r- 1 root root    \
    \ 878 2008-08-18 13:30 hosts.deny\n```\n\n使用管道和 grep 命令过滤命令的输出\n\n**注意** *管道在命令行工作时极其有用。从这里开始，它们将频繁出现在示例中。*\n\
    \n## 重定向\n\n命令的输出可以重定向到其他位置，例如文本文件。使用键盘上的 `>` 字符来启动重定向。\n\n```\n$ date > date.txt\n\
    $ ls -l date.txt\n-rw-r--r-- 1 nick nick 29 2009-06-10 11:37 date.txt\n```\n\n\
    将 date 命令的输出重定向到文件\n\n在上述示例中，`date` 命令的输出被重定向到名为 `date.txt` 的文件，而不是显示在屏幕上。如果指定的文件不存在，它将被自动创建。如果它存在，它将被覆盖。为了防止覆盖文件，可以使用\
    \ `>>` 将内容追加到文件，如下例所示。\n\n```\n$ date >> date.txt\n```\n\n将命令的输出追加到文件\n\n有两种不同类型的输出：\n\
    \n- 标准输出 (STDOUT)\n- 错误输出 (STDERR)\n\n可以选择性地将 STDOUT 和 STDERR 定向到特定的文件。这在尝试捕获错误消息时非常有用，如下所示。\n\
    \n```\n$ ls -l /NonExistantFile 1>ls.txt 2>lserror.txt\n$ ls -l ls*\n-rw-f--r--\
    \ 1 nick nick 61 2009-06-10 11:46 lserror.txt\n-rw-f--r-- 1 nick nick 0 2009-06-10\
    \ 11:46 ls.txt\n```\n\n选择性重定向 STDOUT 和 STDERR\n\n在此示例中，`1>` 代表 `STDOUT`，而 `2>`\
    \ 用于 `STDERR`。由于请求的文件不存在，错误消息被记录在 `lserror.txt` 文件中。所有非错误输出都保存在 `ls.txt` 文件中。\n\
    \n除了 `STDOUT` 和 `STDERR`，你还可以将输入从另一个位置（例如文件）重定向到命令。这被称为标准输入或 `STDIN`。下一个示例演示了使用\
    \ `STDIN` 将文件内容输入到 `mail` 命令（在第 163 页讨论）。\n\n```\n$ mail grepnick@gmail.com <\
    \ ShoppingList.txt\n```\n\n将输入从文件重定向到命令\n\n"
