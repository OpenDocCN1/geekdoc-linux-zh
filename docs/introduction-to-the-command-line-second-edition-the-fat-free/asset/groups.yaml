    | **lpq** | Display print queue status. |

    | **cancel** | Cancel and delete queued print jobs. |

    | **enable** / **disable** | Enable/disable printers. |

    | **lpadmin** | Administer printers. |


    **Glossary of terms used in this section:**


    - **CUPS** (**Common Unix Printing System**): A modern printing system for Unix,
    Linux, and BSD systems.

    - **Print Job**: A file that has been submitted for printing.

    - **LPD** (**Line Printer Daemon**): Printing system used primarily on Unix and
    BSD systems.

    - **Queue**: A spooling system for print jobs waiting to be printed.


    ### lp


    **Purpose:** Print files.


    **Usage syntax:** `lp [OPTIONS] [FILE]`


    ```bash

    $ lp -d HP-4350 /etc/hosts

    request id is HP-4350-4 (1 file(s))

    ```

    *Printing a file using the lp command*


    The `lp` command submits files for printing. In the above example, the `/etc/hosts`
    file is printed on the specified destination printer. The system will display
    a job summary after executing the command. Included in the job summary is the
    print job''s ID number. On most systems, the ID number consists of the printer
    name with the job ID for the specified printer appended to it (4 in this case).


    > **Note**

    > If no destination is specified, the file will print on the default system printer.


    Common usage examples:


    | Command | Description |

    | :--- | :--- |

    | `lp [FILE]` | Print a file to the default printer |

    | `lp -d [PRINTER] [FILE]` | Print to the specified printer |

    | `lp -n [NUM] -d [PRINTER] [FILE]` | Print the specified number of copies |


    ### lpstat


    **Purpose**: Display printer and print job status information.


    **Usage syntax**: `lpstat [OPTIONS]`


    ```bash

    $ lpstat

    HP-4350-5     nick  1024  Tue 02 Jun 2009 12:56:50 PM CDT

    HP-4350-6     nick  1024  Tue 02 Jun 2009 12:56:51 PM CDT

    HP-4350-7     nick  1024  Tue 02 Jun 2009 12:56:52 PM CDT

    HP-4350-8     nick  1024  Tue 02 Jun 2009 12:56:52 PM CDT

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_225_0.png)


    The `lpstat` command displays information about printers and queued print jobs.
    In the above example, executing `lpstat` with no options displays the status of
    all queued print jobs.


    The output of the `lpstat` command is defined in the following table.


    | Field 1 | Field 2 | Field 3 | Field 4 |

    | :--- | :--- | :--- | :--- |

    | PrinterName-JobID | Job owner | Job size | Submission time and date |


    The `-a` option shows the status of all printers on the local system as demonstrated
    in the next example.


    ```bash

    $ lpstat -a

    HP-4350 accepting requests since Tue 02 Jun 2009 12:51:08 PM CDT

    HP-5100 accepting requests since Tue 02 Jun 2009 12:51:08 PM CDT

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_225_1.png)


    Common usage examples:


    | Command | Description |

    | :--- | :--- |

    | `lpstat` | Display the status of the print queue |

    | `lpstat -a` | Display the current state of all printers |

    | `lpstat -P` | Display the printing status of all printers |

    | `lpstat -s` | Display a status summary |

    | `lpstat -t` | Display all status information |


    ### lpq


    **Purpose**: Display print queue status.


    **Usage syntax**: `lpq [OPTIONS]`


    ```bash

    $ lpq -a


    Rank  Owner Job File(s) Total Size

    1st nick 2 hosts 1024 bytes

    2nd nick 3 hosts 1024 bytes

    3rd nick 4 hosts 1024 bytes

    4th nick 5 hosts 1024 bytes

    5th nick 6 hosts 1024 bytes

    6th nick 7 hosts 1024 bytes

    7th nick 8 hosts 1024 bytes

    8th nick 9 hosts 1024 bytes

    9th nick 10 hosts 1024 bytes

    ```

    *Displaying the status of queued print jobs using the lpq command*


    The `lpq` command displays the status of queued print jobs. It is similar to the
    `lpstat` command except it provides more user-friendly output. Unlike the `lpstat`
    command, the `lpq` command only supports a limited number of command line options.


    In the above example, executing `lpq -a` displays all queued print jobs. The next
    example demonstrates using the `-P` option to display the status of a specific
    printer.


    ```bash

    $ lpq -P HP-4350

    HP-4350 is not ready


    Rank  Owner Job File(s) Total Size

    1st nick 2 hosts 1024 bytes

    2nd nick 3 hosts 1024 bytes

    3rd nick 4 hosts 1024 bytes

    4th nick 5 hosts 1024 bytes

    ```

    *Displaying the status of a specific printer using the lpq command*


    **Common usage examples:**


    - `lpq -a` : Display the status of all queued print jobs

    - `lpq -P [PRINTER]` : Display the status of the specified printer


    ### cancel


    **Purpose:** Cancel and delete queued print jobs.


    **Usage syntax:** `cancel [OPTIONS] [JOBID]`


    ```bash

    $ lpq -P HP-4350

    HP-4350 is not ready

    Rank Owner Job File(s) Total Size

    1st nick 6 hosts 1024 bytes

    2nd nick 7 hosts 1024 bytes

    3rd nick 8 hosts 1024 bytes

    4th nick 9 hosts 1024 bytes

    5th nick 10 hosts 1024 bytes

    $ cancel 10

    ```

    *Using the cancel command to cancel an individual print job*


    The `cancel` command deletes queued print jobs. In the above example, `cancel
    10` is used to remove an individual job by specifying the job''s ID number. The
    next example demonstrates using the `-a` parameter to remove all queued print
    jobs from the specified printer.


    ```bash

    $ lpq -P HP-4350

    HP-4350 is not ready

    Rank Owner Job File(s) Total Size

    1st nick 6 hosts 1024 bytes

    2nd nick 7 hosts 1024 bytes

    3rd nick 8 hosts 1024 bytes

    4th nick 9 hosts 1024 bytes

    $ cancel -a HP-4350

    $ lpq -P HP-4350

    HP-4350 is not ready

    no entries

    ```

    *Using the cancel command to cancel all queued print jobs on a printer*


    > **Note** Some UNIX systems may use the `lp rm` command in place of `cancel`.


    **Common usage examples:**


    - `cancel [JOB]` Cancel the specified print job

    - `cancel -a` Cancel all print jobs on all printers

    - `cancel -a [PRINTER]` Cancel all jobs on the specified printer


    ### enable / disable


    **Purpose**: Enable/disable printers.


    **Usage syntax**: `enable [OPTIONS] [PRINTER]`


    ```bash

    # enable HP-4350

    # lpq

    HP-4350 is ready

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_228_0.png)


    The `enable` command enables printers which makes them available for printing.
    In the above example, the specified printer is enabled and made available for
    printing after executing the `enable` command.


    The `disable` command takes printers offline and disables them from printing,
    as demonstrated in the next example.


    **Usage syntax**: `disable [OPTIONS] [PRINTER]`


    ```bash

    # disable HP-4350

    # lpq

    HP-4350 is not ready

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_228_1.png)


    Most systems will continue to accept print requests when a printer is disabled.
    The jobs will remain in the queue until the printer is enabled.


    > **Note** Systems with CUPS (Common Unix Printing System) will use the `cupseable`
    and `cupsdisable` commands in place of `enable` and `disable`.


    **Common usage examples:**


    - `enable [PRINTER]` Enable the specified printer

    - `disable [PRINTER]` Disable the specified printer

    - `disable -c [PRINTER]` Disable a printer and cancel all queued jobs


    ### lpadmin


    **Purpose:** Administer printers.


    **Usage syntax:** `lpadmin [OPTIONS] [PRINTER]`


    ```bash

    $ lpadmin -p HP-5200 -E -v socket://10.10.1.32

    $ lpstat -a

    HP-5200 accepting requests since Fri 16 Apr 2010 12:41:01 PM CDT

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_229_0.png)


    The `lpadmin` command manages printers on Unix, Linux, and BSD systems. In the
    above example, a network printer with the IP address of `10.10.1.32` is added
    to the system using the `lpadmin` command.


    The next example demonstrates removing the printer created in the previous example
    using `lpadmin -x`.


    ```bash

    $ lpadmin -x HP-5200

    $ lpstat -a

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_229_1.png)


    > **Note** Command line options for the `lpadmin` utility vary across the different
    platforms. See `man lpadmin` for information specific to your system.


    **Common usage examples:**


    | Command | Description |

    | :--- | :--- |

    | `lpadmin -p [NAME] -v [DEVICE]` | Add a printer to the system |

    | `lpadmin -x [PRINTER]` | Remove a printer from the system |

    '
