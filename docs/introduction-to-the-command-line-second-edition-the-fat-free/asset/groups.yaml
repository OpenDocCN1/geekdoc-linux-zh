    \ -0500\n Modify: 2009-05-25 20:46:57.516293325 -0500\n Change: 2009-05-25 20:46:57.516293325\
    \ -0500\n```\n\nDisplaying information for the `/etc/hosts` file using the `stat`\
    \ command\n\nThe `stat` command displays extended information about files. It\
    \ includes helpful information not available when using the `ls` command such\
    \ as the file's last access time and technical information about the file's location\
    \ within the file system. The example above displays the `stat` output for the\
