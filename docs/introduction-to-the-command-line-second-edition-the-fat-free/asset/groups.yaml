    使用 `md5sum` 命令显示大文件的 md5 哈希值


    `md5sum` 命令计算指定文件的 MD5 和（有时也被称为 *哈希*）。它与之前讨论的 `cksum` 命令类似，但计算更为密集。MD5 哈希值相当于数字指纹，不像
    `cksum` 哈希值在某些罕见情况下那样容易被重复或填充。


