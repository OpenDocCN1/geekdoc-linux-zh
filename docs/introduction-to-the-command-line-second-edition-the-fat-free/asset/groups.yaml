    # **Purpose:** Create incremental backups.


    **Usage syntax:** `dump [OPTIONS] [OUTPUT] [INPUT]`


    ```

    # dump -0 -uf backup.dump /

    ```


    ![](img/fa2f95b64a707c963dfa0445bd9281a7_193_0.png)


    dump is an archive utility that creates incremental backups. In the above example,
    the -0 option indicates a full backup of the / file system to a file called backup.dump.


    Subsequent incremental backups are specified as -1, -2, -3, etc. The subsequent
    backups will only archive files that have changed since the last full backup.
    This can save time and storage space when creating backups, but it will take longer
    to restore since the incremental backups must be restored in layers.


    > **Note** *Information about backed up files is stored in a file called dumpdates.
    On Unix systems, this file is usually found in /etc/dumpdates. Linux systems store
    this information in /var/lib/dumpdates.*


    +   Common usage examples:

    +   | dump -0 -uf [OUTPUT] [INPUT] | Create a full backup |

    +   | dump -[NUM] -uf [OUTPUT] [INPUT] | Create an incremental backup |'
