  md: "If we go ahead and set the RHOST variable using the set command. If the target\
    \ system's IP address is 192.168.0.20 then we would use the set command below:\n\
    \n```\nmsf exploit(unreal_ircd_3281_backdoor) > set RHOST 192.168.0.20\nRHOST\
    \ => 192.168.0.20\nmsf exploit(unreal_ircd_3281_backdoor) > _\n```\n\nIf we run\
    \ the “show options” command again, we can see that the variable has indeed been\
    \ set:\n\n| Name | Current Setting | Required | Description |\n| --- | --- | ---\
    \ | --- |\n| RHOST | 192.168.0.20 | yes | The target address |\n| REPORT | 6667\
    \ | yes | The target port |\n\nThis is all you really need is set in this exploit.\
    \ You could now run the “exploit” command to execute it.\n\nIf you are feeling\
    \ a bit lost, don’t panic, we will cover this in more more detail in the Metasploitable\
    \ chapter.\n\n# Multiple Target Types\n\nThe Unreal backdoor was a fairly easy\
    \ to use. Some exploits have multiple variables that you need to set and they\
    \ might even have some optional variables that can also be configured.\n\nAs you\
    \ use Metasploit, you will find that there have multiple target types that can\
    \ be attacked, and that the exact target needs to be set for the exploit to work\
    \ properly. To see the target, “show targets”.\n\nOn the exploit we used above,\
    \ the target is automatic, so we don’t need to set it.\n\n```\nmsf exploit(unreal_ircd_3281_backdoor)\
    \ > show targets\nExploit targets:\nId Name\n---\n0 Automatic Target\n```\n\n\
    But on others, there are numerous targets and we need to pick the right one.\n\
    \n# Getting a remote shell on a Windows XP Machine\n\nWe took a brief look at\
