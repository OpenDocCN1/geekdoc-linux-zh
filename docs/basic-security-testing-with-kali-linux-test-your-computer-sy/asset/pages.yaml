  md: '# Always notify


    +   Never notify me when:

    - Programs try to install software or make changes to my computer

    - I make changes to Windows settings


    > Not recommended. Choose this only if you need to use programs that are not certified
    for Windows 7 because they do not support User Account Control.


    Never notify


    The utility that many complained about in Windows Vista (and turned off!) actually
    does improve the security of your system.


    On Windows 7 systems, make sure that UAC is enabled and set to something other
    than “Never Notify”.


    Additionally, turning off LM and NTLM altogether and enabling NTLM2 thwarted this
    attack. This was accomplished by setting the authentication level to “Send NTLM2
    response only\refuse LM & NTLM” in the system security policy.


    Next, one would wonder about just using Kerberos authentication. From what I saw,
    there seems to be no sure fire way to force Kerberos across the board. Also, many
    devices on a network still create and use LM/ NTLM hashes for backwards compatibility,
    so removing them completely from your network is still a task.'
