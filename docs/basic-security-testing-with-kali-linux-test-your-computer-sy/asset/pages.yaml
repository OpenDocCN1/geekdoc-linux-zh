  md: 'si go through your corporate garbage receptacles, scour for clues of your internal
    systems by reading online tech forums that you use.


    Or they could hit social media sites by pretending to be from a company that you
    do business with or pretending to be a head hunter employment agency looking for
    new talent.


    These are just a few examples of how a social engineer might try to gain access
    or procure information about a target network. There really is no limit to the
    ways that a talented social engineer might try to twist, deceive or threaten their
    way onto your network.


    # Social Engineering Defense


    With that being said, it is imperative to train your employees to be on the lookout
    for these types of attacks. Have policies in place to deal with service calls,
    software updates, and gifts from outside companies.


    You can teach, instruct and even leave reminder messages and posters, but employees
    may still not follow corporate policy. That is why when it comes to social engineering
    attacks, it is a good idea to manually test to see if your company is truly prepared.


    In this section we will look at a couple programs in Kali that corporate security
    teams can use to test their company’s preparedness against these types of attacks.'
