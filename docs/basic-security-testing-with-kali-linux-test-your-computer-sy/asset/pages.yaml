    # Introduction


    We covered a lot of basic intro, recon and mapping; now let ` look at attacking
    hosts.


    Metasploitable 2 is a purposefully vulnerable Linux distribution. What this means
    is that it has known bugs and vulnerabilities built in it. It is a training platform
    made to be used with Metasploit to practice and hone your computer security skills
    in a legal environment.


    Many think that Linux or Mac OS are more secure than Windows. But like Windows,
    if you do not install system patches and updates, they are equally vulnerable.


    The resources above cover a lot of information on installing and using Metasploitable
    2 so I will not spend a lot of time on this topic.


    But we will go through a couple of the exploits using Kali just to see how things
    work.


    # Installing and Using Metasploitable


    Metasploitable 2 is available as a Virtual VMware VM. Just download the file,
    unzip and open it with VMware Player. It’s that simple.


    If you are using Virtual Box, Rapid 7 hosts a video showing the full install of
    Metasploitable on Virtual Box. A link to the video can be found in the Resources
    section above.


    **Warning** – Never run Metasploitable on a public facing system, it is, by design,
    vulnerable!


    Once Metasploitable boots up you will come to the main login screen:


    ```

    root@metasploitable:~

    Warning: Never expose this VM to an untrusted network!

    Contact: msfdev[at]metasploitable.com

    Login with msfadmin:msfadmin to get started

    metasploitable login: ~

    ```'
