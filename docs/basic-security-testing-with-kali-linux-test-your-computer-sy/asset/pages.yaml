    # # Conclusion


    In this chapter we learned a lot about Metploit''s Meterpreter shell. Though we
    covered some of the

    bastics of getting around and using the shell, we only touched on a fraction of
    its capabilities.

    Hopefully you can see why a Meterpreter shell gives you a lot more functionality
    than

    just getting a remote access speed.


    Grabbing video and sound seem to be a bit theatrical, but social engineers could
    use information

    they glean. From video they could grab images of people''s badges, and a glimpse

    to the target''s physical environment.


    Sound is interesting too. A social engineer could learn a lot about the target
    facility by being able

    to have a microphone inside the building. And not too long “Sinn3r” from the Metploit

    development team showed how they could grab recorded audio and search it using
    AT&T''s Watson

