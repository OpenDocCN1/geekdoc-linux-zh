  md: '# Chapter 2 - Installing Kali with VMWare Player


    Resources - http://www.vmware.com/


    +   * VMware

    * Kali Install Directions - http://docs.kali.org/category/installation

    * Kali Downloads - http://www.kali.org/downloads/

    * Kali Repositories - http://docs.kali.org/general-use/kali-linux-sources-list-repositories

    * Metasploitable 2 - http://sourceforge.net/projects/metasploitable/files/Metasploitable2/

    * Microsoft Evaluation Software - http://technet.microsoft.com/en-us/evalcenter


    # Introduction


    In this section we setup Kali Linux, Windows 7 and Metasploitable 2 as Virtual
    Machines (VMs) using VMWare Player on a host computer.


    Setting up our testing lab using virtual machines makes it very easy to learn
    offensive computer security testing using Kali.


    Virtual machines make it possible to run several operating systems on a single
    computer. That way we do not need a room full of computers to set up a testing
    and learning environment. We only need one machine powerful enough to run several
    Virtual Machine sessions at once.


    For the book I used a Windows 7 Core I-5 system with 8 GB of RAM. It had plenty
    of power to run all three of our lab operating systems at the same time with no
    problem at all.


    If you have experience with Virtual Systems, you can use any Virtual Machine software
    that you want. But for this tutorial I will be using VMWare Player as the host
    software, and then install Kali, Metasploitable 2 and Windows 7 in separate VMs
    running under the host.


    When done, you should have a small test network that looks something like this:'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Because we will be dealing with vulnerable operating systems, make sure that
    you have a Firewall Router (Preferably hardware) between the Host system and the
    live internet.


    # # Install VMware Player & Kali


    Installing Kali on VMware is extremely simple as Offensive Security provides a
    Kali VMware image that you can download, so we will not spend a lot of time on
    this.


    Download and install VMware Player for your version of OS.


    +   1. Download and install VMware Player (https://my.vmware.com/web/vmware/downloads)


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_17_0.png)


    +   2. Agree to the license agreement and choose where you want it to install
    it, the default is normally fine.


    +   3. Click, “Finish” when done.'
