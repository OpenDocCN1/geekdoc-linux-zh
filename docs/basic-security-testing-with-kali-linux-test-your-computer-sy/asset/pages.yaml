    But what if we made a fake site that offered up a booby trapped script. And if
    the user allows the script to run, creates a remote shell with the user?


    The Java PYInjector attack leverages the anti-virus bypassing capabilities of
    PowerShell based attacks with a Java application. We will use SET to create a
    fictitious website that will offer up a booby-trapped Java app. And if the user
    allows it to run, we get a full remote session to the system.


    We will be using a Windows 7 system as the “target” in this example.


