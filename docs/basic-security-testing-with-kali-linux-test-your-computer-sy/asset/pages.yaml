    drive town with a Wi-Fi monitoring program and grab area Wi-Fi information. Kismet
    is a program that is used quite frequently for war driving. |

    | Simply run Kismet on your laptop as you drive around. Add a GPS source (like
    a smart phone) and Kismet will add GPS location to each network that it discovers.
