  md: '# # Bypassing UAC


    ## Introduction

    The user Administrator in Windows has a lot of authority, but there are some things
    that even an Administrator cannot do. The user “Root” in Linux is the super “god”
    level user, and in Windows the user “System” is the super user account.


    User Access Control (UAC) seemed to be a nuisance in the previous Windows version,
    and many companies just turned it off. Well UAC works very well in Windows 7,
    and using even it on the lowest security settings prevents many attacks that worked
    in Windows XP.


    If even we get a remote “administrator” level session in Metasploit, UAC will
    prevent us from doing some things, like obtaining password hashes. But there is
    a UAC bypass module in Meterpreter that will allow us to bypass this restriction
    and get system level, if the user account compromise is an administrator.


    In this section we will learn how to escalate our privileges from an administrator
    level user to system level by bypassing UAC and creating a new session.


    # ## UAC Bypass


    In this tutorial we will start with an active Meterpreter session with a Windows
    7 system and a user that has administrator level rights.


    +   1. First we wait to background the session. Then if we run the “sessions”
    command we see that the only open Meterpreter session is session 1:


