  md: '# Chapter 28 – Kismet


    # Introduction


    If you need to scan your company to see what Wi-Fi networks are actually out there
    and need to create a report on it, Kismet is a great tool.


    Kismet does an amazing job of finding and recording access points & clients, and
    logs them in several different formats.


    # Scanning with Kismet

    Kali Linux>Wireless Attacks>Wireless Tools>Kismet


    +   1. Start Kismet from the menu to see its options, or just type, “kismet” at
    a terminal prompt.


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_205_0.png)


    +   2. Click “OK” at the “Kismet running as root” message.


    +   3. Click “Yes” to start the Server.


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_205_1.png)


    +   4. At the Server Options screen you can just take the default values and select
    start.'
  merge: -1
  pgno: 205
- img_proc: true
  md: '5. The console window will open and in a second or two a screen will open that
    will ask you to select a capture interface. At the “Add a Source Now” prompt click
    “Yes”.


    6. In the “Add Source” pop-up window type in your wireless card interface name
    on the Interface line. You can use “wlan0” or even “mon0” if your Wi-Fi card is
    already in monitoring mode. Optionally you can add a descriptive name for your
    interface. Then click “Add”:


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_206_0.png)


    7. That is it! Kismet begins recording all traffic that it sees. Simply click
    the “Close Console Window” button to close the console screen to see the graphical
    interface.


    8. The Console Windows closes and we will now see the main program interface:


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_206_1.png)


    This might look a little confusing at first, but basically detected networks and
    devices show up in the upper left corner. The bottom graph shows detected traffic,
    yellow represents packets, with the red represents data.'
