  md: '# # Chapter 16 – Cracking Simple LM Hashes


    # ### Introduction


    Microsoft’s support for Windows XP SP3 and Office 2003 will officially end in
    April 8, 2014. With only one year of support left for Microsoft Windows XP, almost
    40% of computer users still use it according to some reports.


    That is a huge number of Windows XP systems that are still being used in business
    critical positions. Computers do not just store passwords in plain text, but store
    them in an encrypted form. There are several different ways that computers encrypt
    their passwords. One of the most secure ways includes Salting the password. Basically
    this means to use a number (or Salt) and incorporate that into the hashing process
    to ensure that no two passwords are ever the same.


    If a salt not used (like on Microsoft LM systems), you can crack one hash all
    the users that used the same password will have the same hash. So all you need
    to do is take the hash and compare it to known hashes and if you get a match,
    you have the password!


    Many Windows XP systems use LM hashes to protect their passwords. This is a very
    old and outdated way to store password hashes. This hashing process was created
    for systems before Windows NT.


    Basically on a system using LM hashes, any password that is 14 characters or less
    is converted into all uppercase, and then broken into two 7 character passwords.
    Each half is then encrypted and combined to form the final hash.


    Again there is no salt used, so basically if you can get the LM hashes from a
    system, all you need to do is a look up table comparison to known hashes and can
    get the actual password.


    A typical Windows hash looks like this:


    ```

    ac93c8016d14e75a2e9b76bb9e2c2bb6:8516cd0838d1a4fd1ac3e8eb9811

    ```


    The LM hash is on the left of the colon and the NHash is on the right.


    # ### Cracking LM passwords Online


    There are several websites that will allow you to input a Windows LM hash and
    it will return the password used (if it is in its lookup table).


    A Swiss company named Objectif Sécurité (creator of Ophrack) has developed a cracking
    technology that uses rainbow tables on SSD drives. They offer an online demo of
    their technology that cracks many LM passwords in seconds.


    > (http://www.objectif-securite.ch/en/ophrack.php)


    We will try a couple hashes and see what it can do. Let’s start out with an easy
    one. Here is the'
