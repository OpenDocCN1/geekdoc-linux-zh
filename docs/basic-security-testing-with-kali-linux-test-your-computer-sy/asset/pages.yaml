  md: '# # Chapter 26 – Fern WIFI Cracker


    # ## Introduction


    Fern WIFI Cracker is a great program that provides an easy to use graphical interface
    to underlying Acrack-ng and Reaver Wireless penetration testing tools.


    Using this tool we can scan for access points, and perform menu driven WPS attacks
    and/ WPA/ and WPA2 passphrase cracking.


    You can also attack Wireless Protected Setup (WPS) with Fern.


    # ## Using Fern


    +   1. Kali Linux>Wireless Attacks>Wireless Tools>fern-wifi-cracker from the menu
    or run-wifi-cracker from the command line.


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_198_0.png)


    +   2. Simply select your interface from the drop down list.


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_198_1.png)


    Monitor mode will be automatically enabled and Fern will search for Access Points
    in the area.'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'Once some detected they will show up in either the WIFI WEP or WPA icon as
    seen below:


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_199_0.png)


    3. Clicking on the WIFI Icon list will list every access point that your card
    can see in the area:


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_199_1.png)


    4. Now simply select an access point from the Target Access Panel. Then select
    WPS or Regular attack.


    5. We will choose our AP Terminator (which by the way is a hidden AP, but Fern
    saw it with no problems), and the Wireless Protected Setup attack (or WPS for
    short) and click the “Attack” button:'
  merge: -1
