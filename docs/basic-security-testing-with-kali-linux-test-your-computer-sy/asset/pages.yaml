    | Turk Telekom | 23,802 |


    Shodan returns links to about two million Cisco routers worldwide. You can click
    on any IP address to surf directly to the device found.


    On the left side of the screen, Shodan also shows you how many of the total devices
    are from a certain country or location. You can click on any of them to zero in
    your search, or you could use keyword filters directly in the search to fine tune
    the results.


    # # Filter Guide


    Using Filter commands you can quickly narrow down your searches to very specific
    things.


    For example, say you were a Microsoft employee and needed to find all the IIS
    servers running IIS 8.0 in the US that are part of the Microsoft domain?


    You could enter something like the line below:


    ```

    Shodan Exploit Scanhub Anniversary Promotion

    SHODAN is/8.0 hostname.microsoft.com country:US Search

    ```


    This quickly and easily sorts the millions of servers out there and returns the
    ones that match the query.


    Here is a sample search return:'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Microsoft Corporation


    Microsoft Corp


    2. Country


    Details


    3. Hostname


    www-co1test.microsoft.com


    4. Body text


    ```

    HTTP/1.0 200 OK

    Cache-Control: no-cache

    Content-Type: text/html

    Last-Modified: Mon, 16 Mar 2009 20:55:26 GMT

    Accept-Ranges: *

    ETag: "67991f6af6c691.0"

    Server: Microsoft-IIS/8.0

    VTag: -21474836480000000

    P: ID2 DOR COR CUM CUS IVo/DA PRD TAL

    X-Forwarded-By: ASP.NET

    Date: Thu, 18 Aug 2013 22:43:58 GMT

    Content-Length: 1020

    ```


    +   1. Server title information. You can search for other servers that contain
    the identical title text by putting the information into the title command.


    +   2. Designates the server country location, again search-able by using the
    country command.


    +   3. The hostname search command can be used to search for servers by domain
    names.


    +   4. Body text area. Any text entered into Shodan without a filter will be assumed
    to be a body text search and will look for servers that have the requested information
    in the body text area.


    # Filter Commands


    Let''s take a closer look at the filer commands.

    (To use these commands or to get more than one page of results, you need to sign
    up for a free Shodan Account.


    > CITY and COUNTRY Command


    The City and Country commands allow you to narrow down the geographic location
    of your searches.

    country:(2 Letter country code)or city:(city name)


    country:US

    city:Memphis


    Better yet, combine the two if the city you are looking for is located in more
    than one country.

    country:US city:Memphis


    > HOSTNAME Command


    Scan an entire domain with the hostname command:

    hostname:google


    You can use any part of the Fully Qualified Domain Name, like google or the entire
    site like www.microsoft.com or support.microsoft.com.


    > NET Command


    Scan a single IP or a whole net block range using the net command:'
