    # # Conclusion


    If you want, it would be a good idea to take a few minutes and surf the menu system
    until you are familiar with its layout.


    Many, if not most of the programs can be run directly from the command prompt,
    and there are additional programs included in Kali that are not in the menu system.
    We will cover several of the utilities that come with Kali. We will also cover
    a few that have not been added in yet, but that are very good tools for any security
    tester.


