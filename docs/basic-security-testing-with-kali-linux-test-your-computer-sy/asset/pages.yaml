    # # Viewing Wi-Fi Packets and Hidden APs in Wireshark


    One other common Wi-Fi security misconception is changing your Wireless Access
    Point to use a “Hidden” SSID will increase the security of your network. Well,
    it doesn’t, and we will see why in this section.


    Okay, we have seen how to view which APs are available, now let’s see how we can
    capture wireless packets and analyze them in the ever popular protocol analyzer
    Wireshark.


    Simply place your Wi-Fi card in monitor mode like we did in the previous example,
    and run Wireshark. Placing the card in monitor mode will allow us to see wireless
    management traffic like like AP Beacons and Probes:


    ```

    root@Kali:~# airmon-ng start wlan0

    root@Kali:~# wireshark &

    ```


    (When you start airmon-ng, you may receive a message that running processes could
    cause trouble, these may be ignored. The "&" used after the Wireshark command
    tells Kali to run Wireshark, but will give you the command prompt back.)


    Wireshark will open, now all you need to do is:


