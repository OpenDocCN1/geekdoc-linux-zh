- img_proc: true
  md: '![](img/12315f8a5d9e9bad6bf982c86c5537ea_200_0.png)


    Fern correctly detected that WPS was not enabled on our AP. Knowing the security
    risks of leaving WPS on, I always turn off WPS on all of my routers.


    On some routers, the WPS feature is susceptible to a brute force attack where
    an attacker can run a program like “Reaver” (used by Fern) and obtain access to
    the Router (http://www.kb.cert.org/vuls/id/723755).


    As this didn’t work, our next step is to try and run a dictionary attack against
    the passkey used by the router.


    +   6. Simply select “Regular Attack” and then select a word list to use. In this
