  md: '# Chapter 6 - Shodan


    # Resources


    +   - Shodan Website - http://www.shodanhq.com/

    - Google Dorks Database - http://www.exploit-db.com/google-dorks/


    # Introduction


    Shodan is one of the coolest websites on the web. Called the “Hacker’s Google”,
    “Dark Google” and many times “terrifying”, it is a search engine for computers.


    Shodan allows you to find computers on the web by searching for them by keyword.
    For example, you can search for all the Microsoft IIS 7.0 servers in Canada, and
    all the systems Linux in Africa.


    If you are familiar with “Google Dorks”, Shodan is similar, but is a much easier
    way to search the breadth of the internet for systems.


    The trick to using Shodan effectively is to know the right keywords. Usually they
    are the manufacturer’s name, or a device model number, but sometimes they are
    the name of a very obscure embedded web server that you would never think to look
    for.


    But once you know these magic keys, in seconds you can search the world for these
    devices. Or by using filter commands you can refine your search to certain devices
    and areas.


    A security tester can use Shodan to very quickly assess what systems on their
    network are being displayed publicly, when maybe they shouldn’t. It can also allow
    them to find possible rogue or unauthorized devices that have been added to the
    company network.


    In this section we will briefly discuss why scanning your network space with Shodan
    is a good idea. We will then look at how we can do these searches from the web
    interface, Shodanhq.com, and finally Kali Linux using the Metasploit Framework.


    # Why scan your network with Shodan?


    There are a large number of seemingly important systems that should never be publicly
    viewable on the Internet. All can be found easily with a just keyword searches.


    Everything from open, outdated & insecure systems, routers, network storage, and
    phone systems - security cams, building controls, and even security systems.


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_68_0.png)


    Move the pointer over the ports for more information.


    But that is not all.


    Open network printers and embedded devices can also be a fount of information
    for hackers giving'
  merge: -1
  pgno: 68
- img_proc: true
  md: 'SNMP and network infrastructure information, and possibly even user accounts
    and passwords!


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_69_0.png)


    Sadly, in this new high tech world, computer systems are not the only things that
    can be found online.


    Sure you can find large industrial HVAC environmental and building temperature
    controls completely open and unsecured. You can also find other non-common devices
    like aquariums with an online control interface and unbelievably, even remote
    controlled doors:


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_69_1.png)


    Often the online device has security, but it comes with it turned off from the
    manufacturer, and all the user needs to do is turn it on or assign a password.


    But many don''t:


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_69_2.png)'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'Many times when a password is used, it is left to the factory default password
    (easily found) or a simple password (easily cracked).


    The company owner may not even been the (directly) to put one of these devices
    online. There have been couple reports of internet enabled building controls from
    major companies found online over the years. The building contractor, obviously
    not understanding internet security, left them completely open or with default
    credentials.


    Searching for open systems using Shodan has become very popular. If you have heard
    of “Urban Explorers” – those that explore old abandoned buildings in cities for
    thrills, think of frequent Shodan searches as “Cyber Explorers” – those that explore
    the world’s computers for open or loosely secured systems.


    And once interesting systems are found on Shodan, the keyword searches are usually
    shared amongst friends or publicly posted on the internet.


    Granted many are just surfing Shodan to grab screenshots of ridiculous things
    that people put on the web, but it is also a tool that those with nefarious purposes
    could also use.


    That is why it is important to check if you have systems publicly viewable or
    accessible from the web that you don’t know about.


    # Shodan Website


    To use Shodan, simply point your web browser to Shodanhq.com:


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_70_0.png)


    Then all you need to do is enter your keyword to use and click, search just as
    you would on any search engine.


    So if we wanted to search Cisco routers we could just type in “Cisco” and click,
    “search”:'
