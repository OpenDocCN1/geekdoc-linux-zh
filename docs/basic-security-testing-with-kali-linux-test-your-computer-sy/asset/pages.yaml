  md: '# Chapter 14 – The Social Engineering Toolkit


    # INTRODUCTION


    Social engineering attacks are one of the top techniques used against networks
    today. Why spend days, weeks or even months trying to penetrate layers of network
    security when you can just trick a user into running a file that allows you full
    access to their machine and bypasses anti-virus, firewalls and many intrusion
    detection systems?


    This is most commonly used in phishing attacks today, craft an e-mail, or create
    a fake website that tricks users into running a malicious file that creates a
    backdoor into their system. But as a security expert, how could you test this
    against your network? Would such an attack work, and how could you defend against
    it?


    Kali includes one of the most popular social engineering attack toolkits available,
    David Kennedy''s Social Engineering Toolkit (SET). David''s team is very active
    on SET, there are always new features and attacks being added. Recently several
    non-social engineering tools have also been added to SET making it a very robust
    attack tool.


    In this chapter we will take a look at some of the tools included with SET and
    two of the attack options, both PowerShell based attacks.


    # Staring SET


    To start SET from the Kali main menu:


    Kali Linux > Exploitation Tools > Social Engineering Toolkit


    Or type “se-toolkit” or “setoolkit” (depending on your Kali version) in a terminal
    prompt.


    # Mass Emailer


    One way a Social Engineer will attack a network is to send out a flood of e-mails
    to company addresses and see who will respond or run the malicious attachment
    you sent with it.


    SET comes with a Mass Mailer select, “Social-Engineering Attacks”.


    +   1. From the main menu option 5, “Social-Engineering Attacks”.


    +   2. Next select option 5, “Mass Mailer Attack”:'
