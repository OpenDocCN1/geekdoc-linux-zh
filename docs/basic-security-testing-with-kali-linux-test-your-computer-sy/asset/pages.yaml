  md: '# Chapter 5 – Recon Tools


    # Resources


    +   - Recon-NG Wiki Page - https://bitbucket.org/LaNMaSteR53/recon-ng/wiki/Home


    # Introduction


    There are several tools in Kali Linux to aid in information gathering and reconnaissance.
    When a hacker attacks a target one of the normal stages they perform is information
    gathering. They want to learn as much about your network, their target, as they
    can, to make their lives easier.


    Maltego is a very popular tool one that is covered quite a bit in security books
    and training seminars. Its already has a lot of coverage, I figured we would look
    at some of the other tools included in Kali.


    In this chapter we will look at one of the newer tools, Recon-NG and a couple
    other tools that come with Kali.


    # Recon-NG


    The Recon-NG Framework is a powerful tool that allows you to perform automated
    information gathering and network reconnaissance. Think of it as Metasploit for
    information collection.


    Recon-NG automates a lot of the steps that are taken in the initial process of
    a penetration test. It has numerous features that allow you to collect user information
    for social engineering attacks, and network information for network mapping and
    much more.


    You can automatically hit numerous websites to gather passive information on your
    target and even actively probe the target itself for data.


    Anyone who is familiar with Metasploit will feel right at home as the interface
    was made to have the same look and feel. The command use and functions are very
    similar. Basically you can use Recon-NG to gather info on your target, and then
    attack it with Metasploit.


    # Using Recon-NG


    To start recon-ng, just open a terminal prompt and type, “recon-ng":'
  merge: -1
  pgno: 61
- img_proc: true
  md: '```

    root@kali:~# recon-ng


    [recon-ng v1.41 Copyright (C) 2013, Tim Tomes (@LaNMaSteR53)]


