    All the files will be stored in the “/usr/share/recon-ng/workspaces/default” directory.


    # Recon-NG wrap up


    Sub-domain enumeration is only one module you can run, there are many others to
    choose from. There are also some that require a program API key like Twitter,
    Shodan, LinkedIn or Google. Using these you can get specific information from
    the corresponding sites about your targets.'
