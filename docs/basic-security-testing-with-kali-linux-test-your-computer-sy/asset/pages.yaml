  md: 'ATION section. Thus you can see one of the inherent security flaws of Wi-Fi.
    Filtering clients by MAC address is not a very effective strategy as it is trivial
    to view which clients connected to which APs by their physical address.


    All an attacker would have to do is view which addresses has connected and then
    spoof (the “macchanger” command later in this chapter) the address to bypass MAC
