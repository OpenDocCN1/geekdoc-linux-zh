    There are several alternative attack options available here.


    The Metasploit Browser exploit attacks the client system with Metasploit browser
    exploits. The Credential Browser Hacker attack is pretty slick as it clones an
    existing website (like Facebook) and then stores any credentials that are entered
    into it. Tabjacking works if the client has a lot of browser windows open, it
    waits a certain time then switches one of the tabs to a page that SET creates.
    The Web-Jacking attack uses iframe replacements to make a malicious link look
    legit. and finally, the Multi-Attack combines several of the above attacks.


    +   4. Next choose 1, “ Web Templates” to SET create a generic webpage to use.
    Or use Option 2, “Site القمر” to allow SET to use an existing webpage as a template
