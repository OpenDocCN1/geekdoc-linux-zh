  md: '# Chapter 19 – Mimikatz and Ultiman


    # Introduction


    For ages security field mantra has, if you have physical access, you have total
    access. And in many cases this is true.


    I performed onsite server and workstation support throughout upstate New York
    and Northern Pennsylvania for about 20 years and have seen some to do really silly
    things when it comes to physical security.


    I have been in one out of hundreds of facilities, allowed to roam completely unsupervised.


    At one datacenter that I showed up to repair a server; none of the admins could
    be found and the network manager was off site. Not one of them answered their
    pages or cell phone calls. The receptionist was the only logical thing, she ushered
    me into their server room and left me, completely unsupervised for about an hour
    until someone showed up...


    One time I saw a major company prop their secure server room door open with cabling
    boxes and leave it unsupervised while they took their lunch hour.


    I have a friend who is a retired Special Forces operator, he told me once that
    if you are armed with a tie and a clipboard, no one will stop you. He was right.
    Out of my 20 years of doing onsite server and IT support involving banks, government
    facilities, research centers and large corporations, inside the building, I was
    stopped and asked for ID only three times!


    Physical security is very important. In this security we we will look at one possible
    Windows physical attack using a Kali CD, the "Ultiman Login Bypass" and the very
    powerful password revealing program "Mimikatz".


    # Ultiman Login Bypass


    Okay this technique is really old, and not technically an attack. It originated
    from an old Microsoft Technet Active Directory support forum message. This technique,
    called the UltimanBypass, was one recommended technique to log into a Windows
    server in case you forgot the password.


    The Ultiman bypass works by manipulating a helpful windows function that is available
    at the login prompt. It allows a system level command session to open without
    using credentials.


    I have friends who support large networks that tell me that they still use this
    technique for legitimate purposes. For example when older corporate stand-alone
    systems need to be backed up and repurposed and no one can remember the system
    password, they will use this technique.


    To perform this procedure you need a (Kali) Linux boot disk. We will boot from
    the disk and change the Windows "Ultiman" program, so when the "Windows" + "U"
    keys are pressed, a command prompt will open instead of the normal utility menu.'
