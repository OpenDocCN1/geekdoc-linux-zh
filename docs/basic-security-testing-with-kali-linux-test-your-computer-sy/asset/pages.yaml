  md: '# 14. Click, "Network Adapter":


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_19_0.png)


    It is set to NAT by default. This will be good enough for what we are doing. NAT
    means that each Virtual machine will be created in a small NAT network shared
    amongst themselves and with the host; they can also reach out to the internet
    if needed.


    Each machine will be given a DHCP IP address, which means that the IP addresses
    might change on the VMs when you reboot them.


    (If you need to know Kali''s or Metasploitable''s IP address, just type "ifconfig"
    in a Terminal window. On a Windows based VM, just type "ipconfig" at a command
    prompt.)


    +   15. Click "cancel" to return to the VMware Player main screen.


    +   16. Now just click, "Play Virtual Machine", to start Kali. You may get a message
