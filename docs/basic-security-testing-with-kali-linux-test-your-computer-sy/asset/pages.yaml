    # ## Recovering password from a Locked Workstation


    Moving forward with this concept, how could it be for a penetration tester (if
    you had physical access to a system) to be able to grab the passwords off of a
    Windows system that was sitting at a locked login prompt? And what if you could
    get these passwords in plain text?


    Well, you can!


