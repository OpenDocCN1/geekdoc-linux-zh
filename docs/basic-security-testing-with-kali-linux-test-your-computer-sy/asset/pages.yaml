    recon/contacts/enum/http/web/namechk

    recon/contacts/enum/http/web/pwdlist

    recon/contacts/enum/http/should_change_password

    recon/contacts/gather/api/jsigsaw/point_usage

    ```


    Some of the modules are passive; they never touch the target network. While some
    directly probe and can even attack the system you are interested in.


    One tactic used to passively probe network structure is to use the Google search
    engine to enumerate site sub-domains. You know that there will be a main domain
    like “some_target.com” but what other sub-domains are out there?


    You can do a Google search for subdomains using the “site:” and “inurl:” switches.
    When then sub-domains (-inurl) that you find , so other subdomains will appear.
    This can take a while to do and can require a lot of typing if the target has
    a large number of sub-domains.


    Recon-NG will do this for you automatically and record what it finds in a database.


    Just use the “*recon/hosts/gather/http/web/google_site* module. Then “show options”
    to see what the module requires.


    ```

    recon-ng > use recon/hosts/gather/http/web/google_site

    recon-ng [google_site] > show options

    --------------------------------------

    Name                Current Value Req Description

    DOMAIN              yes      target domain

    recon-ng [google_site] >

    ```


    This only requires the target domain.


    As Metasploit, just type, “set domain [targetname]”. Then just type, “run” and
    the module will execute, as seen below:


    ```

    recon-ng [google_site] > set DOM SomeDomainName.com

    DOMAIN => SomeDomainName.com

    recon-ng [google_site] > run

    ```


    You will then see a screen like the simulated one below:'
