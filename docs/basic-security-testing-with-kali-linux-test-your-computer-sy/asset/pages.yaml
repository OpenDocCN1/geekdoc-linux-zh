    \ wireless traffic, and control what a surfer can see in his browser and where\
    \ he can.\n\nThe best defense against Wi-Fi attacks is to secure your router!\
    \ Do not use open or WEP security. One of the main defenses your network has is\
    \ your firewall; if you allow people inside your firewall you open yourself up\
    \ to ARP MitM attacks, packet sniffing and other attacks. Unfortunately, many\
    \ corporate users do not understand this and will take their business laptops\
    \ from a very secure environment at work to a very unsecured Wi-Fi network at\
    \ home.\n\nBe cautious of Wi-Fi. Don’t do online banking or shopping while using\
    \ public Wi-Fi. Make sure your operating system is using a firewall and preferably\
    \ internet security software. If your security monitors the ARP table, that is\
    \ even better!\n\nUse common sense, if you are working on sensitive information,\
    \ do it at home not at the local coffee shop that offers free Wi-Fi, even if their\
    \ cinnamon rolls are the best in the world. It is just not without the risk!\n\
    \nFor more information, check out Vivek Ramachandran’s excellent book, “Backtrack\
    \ 5 Wireless Penetration Testing Beginner’s Guide.\\ Also, David Kennedy’s (creator\
    \ of SET) book, “Metasploit: The Penetration Tester’s Guide” is an excellent reference\
    \ on Backtrack 5, SET and the Metasploit Framework."
