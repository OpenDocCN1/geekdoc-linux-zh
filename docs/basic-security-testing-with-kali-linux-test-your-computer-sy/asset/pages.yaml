    to crack the router through WPS than attempting to crack a long WPA2 passphrase.


    # Conclusion


    There are several ways to attack routers, we covered one of the easiest to use
    – Routerpwn. We also covered attacking the WPS capability of routers.


    As mentioned we spend a lot more time discussing routers, specifically Wi-Fi networks
    in the next few sections.


    It is imperative that companies and homes keep up on Router firmware updates,
    secure their routers with complex passwords, and turn off WPS if not needed.'
