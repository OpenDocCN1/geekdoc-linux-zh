    # # Conclusion


    In this section we learned about the computer search engine Shodan. We learned
    that there are thousands if not millions of unsecured or secured systems that
    can be found quickly and easily on Shodan.


    We then learned how to search Shodan using keywords and filters, and finally learned
    how to search Shodan from within Kali Metasploit.


    It is critical that companies know what systems they have publicly available on
    the web. The larger the company is, the more common it is that they have systems
    hanging out there that are'
