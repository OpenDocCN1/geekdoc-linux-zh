  md: 'obtain configuration information, directory transversal, run remote commands,
    and more.


    Routerp includes a MAC lookup utility and a link to external resources including
    a router default password list site and Shodan.


    Shodan (Shodan.com) is probably one of the easiest ways for an attacker to find
    routers and other devices on the web. For the most part, entering the manufacturer''s
    name as a keyword will return thousands of them.


    The crazy thing is that because Routerspawn is a website, it can be run off of
    almost any platform - Windows, Linux, smart phones, etc. In one security seminar
    the author of the tool even mentioned that you can run it from a Wii!


    Routerspawn is a great one stop shop for finding basic router exploits.


    # Wi-Fi Protected Setup (WPS)


    WPS is used to try to making up new Wi-Fi devices easier, by allowing users to
    use a PIN or button presses instead of having to enter a long passphrase. Many
    routers support it, but the way in which it works opens it up to possible hacker
    brute force attacks.


    Cracking a long complex Router passphrase could take days, or even months. But
    in many cases, WPS can be cracked to gain access to a router WPA/WPA2 passphrase
    in usually 10 hours.


    WPS on the router side will look something like this screenshot of a router configuration
    page below:


    ![](img/12315f8a5d9e9bad6bf982c86c5537ea_187_0.png)


    I don''t want to spend a lot of time on this, but we will take a quick look at
    a couple utilities that can be used to perform WPS attacks.'
