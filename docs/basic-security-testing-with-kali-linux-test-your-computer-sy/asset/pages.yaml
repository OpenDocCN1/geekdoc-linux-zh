  md: '# Chapter 9 – Windows AV Bypass with Veil


    # Resources


    +   - https://www.veil-evasion.com/powershell-payloads/


    # Introduction


    We took a quick look at attacking a Linux host; now let '' s look at one of attacking
    a Windows host.


    Many people think that if they are running an Anti-Virus and a firewall, they
    are generally safe from hacker attacks. The truth is far from that. Meet “Veil”
    a remote shell payload generator that can bypass current Anti-Virus programs.


    One part of penetration testing is getting past pesky anti-virus. Veil is one
    way that we can accomplish this.


    Many Anti-Virus programs work by pattern or signature matching. If a program looks
    like malware, or a remote shell that it has been programmed to look for , it catches
    it. If the malicious file has a signature that AV has not seen before, many will
    dutifully say that the file is clean and not a threat.


    If you can change or mask the signature of malware, or a remote shell in this
    case, then most likely AV will allow it to run and the attacker gets a remote
    connection to the system.


    Veil, a new payload created by security expert and Blackhat USA class instructor
    Chris Truncer, does just that. It takes a standard Metasploit payload and through
    a Metasploit like program allows you to create multiple payloads that most likely
    will bypass anti-virus.


    # Installing Veil


    Veil was recently added to Kali, if typing “veil” at a terminal prompt does not
    start, it may not be installed yet.


    +   1. To install just type, “apt-get update & apt-get install veil”:


    ```

    root@kali:/usr/share# apt-get update apt-get install veil

    ```


    +   2. Then to run the program just type, “veil”:


    ```

    root@kali:/usr/share# veil

    ```


    And this will bring you to the main menu:'
