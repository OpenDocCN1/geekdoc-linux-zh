  md: "As you see in the picture above, we can set a couple options for this exploit,\
    \ which leads us into our next section.\n\nBut before we set our exploit, we need\
    \ to “use” it. Once we have the exploit we want, we simply run the “use” command\
    \ with the exploit name. Again copying and pasting the exploit path and names\
    \ works very well here too:\n\n```\nmsf use exploit/unix/irc/unreal_ircd_3281\
    \ backdoor\nmsf exploit(unreal_ircd_3281 backdoor) > \n```\n\nOkay, we are now\
    \ using our exploit, so how do we set the options?\n\n# Setting Exploit Options\n\
    \nSetting options in Metasploit is as simple as using the “set” command followed\
    \ by the variable name to set and then the value:\n\n+   set <Variable Name> <Value>\n\
    \n![](img/12315f8a5d9e9bad6bf982c86c5537ea_35_0.png)\n\nTo set what variables\
    \ can be set, use the “show options” command:\n\n```\nmsf exploit(unreal_ircd_3281\
    \ backdoor) > show options\nModule options (exploit/unix/irc/unreal_ircd_3281_backdoor):\n\
    Name            Current Setting  Required        Description\nRHOST          \
    \  yes              The target address\nRPORT           6667            yes  \
    \           The target port\n          KALI LINUX\nExploit target:\nId       \
    \       Name\nThe quieter you become, the more you are able to hear\n0       \
    \        Automatic Target\nmsf exploit(unreal_ircd_3281 backdoor) > \n```\n\n\
    This exploit only uses two variables, RHOST and RPORT. Rhost is the remote host\
    \ that we are attacking and Rport is the remote port."
