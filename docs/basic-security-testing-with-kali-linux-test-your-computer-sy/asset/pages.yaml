    # # Playing with Modules - Recovering Deleted Files from Remote Shell


    Now let''s take a second and talk about something little more advanced. Let''s
    see how to use one of the included Meterpreter modules to recover files that have
    been deleted from a remote drive.


    The "recovery_files" script allows you to recover files that the target user has
    deleted from his system. This could be very dangerous, and deleted files could
    contain information of interest for both the forensics and pentesting realm.


