    then click on X11 as seen below:


    ![](bbox=[0.02, 0.07, 0.557, 0.512])


    +   5. ***Enable X11 forwarding*** and type in *"localhost:0"* as the X display
    location.


    +   6. Go ahead and start the putty session (make sure Xming is running in the
