  md: 'passwords.


    Granted, these are Windows LM Hashes and not the more secure Windows 7/ Server
    2008 NTLM based hashes.


    But, I believe that with cracking speeds increasing, relying on passwords alone
    may no longer be a good security measure. Many companies and government facilities
    are moving away from using just passwords alone to using dual authentication methods.


    Biometrics and smartcards are really becoming popular in secure facilities.


    # Not sure what Kind of Hash you have?


    There are several different types of hashes. Sometimes you might be able to retrieve
    a password hash, but might not be able to determine what type it is. Hash ID will
    identify the type of hash that you provide it.


    Simply run Hash ID and input the Hash.


    The program will check it and return the most likely type of hash that you have
    along with least likely types.


    From the Kali Menu:


    > *Kali Linux/Password Attacks/Offline Attacks/Hash-Identifier*


    Just paste in the hash and Hash ID will try to determine what type it is:


    ![](bbox=[0.0, 0.59, 0.71, 0.91])


    # Looking up Hashes in Kali


    Looking up hashes manually online is interesting, but it would be better just
    to do it from within Kali. Well, you can with "***Find my hash***".'
