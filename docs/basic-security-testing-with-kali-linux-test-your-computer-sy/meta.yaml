  md: '# # CHAPTER EIGHT - Defending your Network'
  merge: -1
  pgno: 230
- img_proc: false
  md: '# Chapter 32 – Network Defense and Conclusion


    # Resources


    +   - Choosing and Protecting Passwords - http://www.us-cert.gov/ncas/tips/ST04-002

    - Avoiding Social Engineering and Phishing - http://www.us-cert.gov/ncas/tips/ST04-014

    - Staying Safe on Social Network Sites - http://www.us-cert.gov/ncas/tips/ST06-003

    - Using Caution with Email Attachments - http://www.us-cert.gov/ncas/tips/ST04-010

    - Vulnerability Scanners - http://sectools.org/tag/vuln-scanners/


    # Introduction


    We spent a lot of time covering offensive security techniques in this book. We
    will wrap things up with a quick discussion on securing your network systems from
    these types of attacks.


    We will briefly cover:


    +   - Patches & Updates

    - Firewalls and Intrusion Prevention Systems (IPS)

    - Anti-Virus/ Network Security Programs

    - Limiting Services & User Authority

    - Use Script Blocking Programs

    - Using Long Complex Passwords

    - Network Security Monitoring

    - Logging

    - User Education

    - Scanning your network

    - And Finally, using Offensive Security


    Though no system can be guaranteed to be 100% secure, we can make our systems
    much tougher to compromise by using these techniques.


    # Patches & Updates


    Use the latest versions of Operating Systems if it is at all possible. Using outdated
    Operating Systems in a network environment with internet connectivity is really
    not a good idea.'
  merge: -1
  pgno: 231
- img_proc: false
  md: 'it will no longer receive security updates or support.


    Make sure your operating systems and all software is up to date. In addition,
    also make sure Adobe products, Java, and internet browsers are regularly patched,
    along with Office software.


    Make sure the hardware firmware on all of your devices, especially internet facing
    devices (Routers, Switches, NAS, Cameras, Embedded Server Devices, etc), are current
    and checked regularly.


    If you are in a large corporate environment, never place complete trust in automated
    patching and updating management systems. Manually check important systems regularly.
    I have seen multiple corporate servers error out on automated critical service
    packs installs, yet the patch management server displayed that all servers updated
    without error.


    # Firewalls and IPS


    Always use a firewall, do not attach any systems to a live internet connection
    without using one. Firewall your incoming internet connection and also make sure
    that each individual system is using a software firewall.


    Create an Ingress and Egress Rules policy to monitor or control information entering
    and leaving your network. At the simplest level, block communication with nations
    that you will not be doing business with. More advanced systems will allow you
    to control what type of data and protocols are allowed to enter and leave your
    network.


    Use a Web Application Firewall to protect web application servers. Though these
    do not guarantee that you will stop all malicious attacks against your web app.
    Application security experts highly recommend that your web apps are securely
    written and tested for exploit even when a WAF is in place.


    Intrusion Prevention Systems are great, they are even better when used in a Network
    Security Monitoring type system (see topic below).


    # Anti-Virus/ Network Security Programs


    Honestly, I am torn on Anti-Virus programs. Though they do stop many threats,
    but in 20 years of computer support I have also seen them constantly bypassed.


    Any determined modern hacker is going to research your company to try to find
    out what Anti-Virus program you use. Then they will tailor their exploit code
    to bypass that brand of AV. If they can''t find out what you are running, they
    will go with one that bypasses most of the big named AVs.


    Not all Anti-Viruses are created equal. Some AV/ Internet security programs have
    gotten very good at blocking scripting based threats which seem really popular.


    Do some homework and find out how the top anti-virus programs fare against current
    threats, and then pick one that best meets your company needs.


    # Limit Services & Authority Levels'
  merge: -1
  pgno: 232
- img_proc: false
  md: 'product to come with basically nothing running by default, you add services
    as needed.


    Also, take old servers offline as soon as possible. Many times companies will
    leave an old server online, in case they need something from it, and over time
    it is either forgotten or not updated.


    Never let everyday users use elevated security credentials for non-administrative
    tasks. Heavily restrict "Root" and "Administrator" level use. On a Windows system
    it is almost trivial to escalate a compromised administrator account to the god-like
    "System" level account. This is much more difficult if the compromised account
    is just at "user" level.


    System administrators should only use admin level accounts when performing administrative
    functions, then switch back to a non-admin account for normal computing functions.


    # Use Script Blocking Programs


    Many modern online threats use some level of web scripting language. Use a script
    blocking program like the Mozilla Add On *NoScript*, by Giorgio Maone, is an easy
    fix to block a lot of threats.


    NoScript blocks scripts from automatically running on any new website that you
    visit. It also makes it very easy to allow some scripts to run, or completely
    whitelist a website.


    NoScript also remembers your settings so scripts will be blocked or allowed automatically
    when you visit frequent sites.


    I also like the Mozilla Add On *Ghostery*, by José Maria Signanini, and Felix
    Shnir. Ghostery allows you to block tracking scripts, analytics and unwanted advertising
    on websites.


    Finally, when practical enable privacy features in web browsers. Do not let them
    store passwords or history, and use a program like Bleachbit occasionally to clean
    out browser caches.


    # Use Long Complex Passwords


    This should go without saying, but use long complex passwords not only for your
    computer systems (and online devices!), but also all of your online accounts.
    The longer, and more complex your password is, the longer it will take for an
    attacker to crack it.


    Use a combination of Upper and Lowercase Letters, numbers and symbols.


    In a recent security test, I found that a client used a person''s name as a web
    application administrator password! The program I used to test the strength of
    web app passwords was able to crack it in just a few seconds.


    None of my passwords are shorter than 15 characters, with very important ones
    being much longer.


    Use a different password for each online account that you have, that way if one
    is compromised, the attacker will not be able to use it to gain access to other
    accounts you own.


    # Network Security Monitoring


    I am a huge fan of Network Security Monitoring (NSM). If you run your own network
    and don''t know what that is, run out (don''t walk) and buy *The Tao of Network
    Security Monitoring, Beyond Intrusion Detection*, by Richard Bejtlich.'
  merge: -1
  pgno: 233
- img_proc: false
  md: 'Basically NSM is a system of capturing all of your network traffic, sometimes
    at multiple points in your network, and analyzing it for intrusions or anomalies.


    If you think that you can''t afford a NSM system, think again. One of the most
    commonly used one is free!


    "*Security Onion*"2, created by Doug Burks, is an extremely capable and feature
    rich NSM that is completely free. All you need is a fairly decent computer to
    run it on, a network tap and at least two network cards.


    Security Onion allows you to capture network traffic and then analyzes it for
    issues and notifies you with alerts in a fairly easy to use interface.


    Below are a couple screenshots of Security Onion in action. The first one shows
    a slew of alerts that are triggered when I tried to run Backtrack''s (the previous
    version of Kali) Autopwn against a system on the network:


    ![](bbox=[0.0, 0.34, 0.99, 0.56])


    As you can see there are multiple warnings and alerts. The last line records 172
    (CNT column) incidents of one alert!


    Security Onion is also capable of capturing TOR use on your network. TOR is an
    anonymizing protocol that uses encrypted communication that is bounced around
    the world to help anonymize users. TOR can be used for good, but hackers also
    use TOR to hide their attacks.


    Here is what happened why I used TOR on my test network monitored by Security
    Onion:'
  merge: -1
  pgno: 234
- img_proc: false
  md: '![](bbox=[0.018, 0.018, 0.605, 0.382])


    Notice that multiple yellow *"Known TOR Exit Node Traffic"* alerts are raised.


    Security Onion has a slew of features & tools, makes analyzing & tracking network
    traffic much easier, and also alerts you when it sees suspicious traffic.


    # Logging


    This is basically a continuation of the previous topic. Make sure security logging
    is enabled on critical switches, routers, firewalls and systems.


    Preferably have critical devices and systems send security logs to a syslog server
    so you can have a secondary copy of them (in case hackers wipe system logs) and
    to make incident response easier.


    This helps in tracking down malicious users and traffic across devices if the
    worst does happen.


    Many of the basic level firewall routers even include syslog capability now.


    # Educate your users


    All of your *"security in depth"* is useless if your users allow malicious programs
    to run on your network. One of the most common ways hackers get into your internal
    network is when users run a malicious attachment from an e-mail or run a malicious
    script from a website.


    Teach users to avoid opening unsolicited or suspicious attachments, or from visiting
    suspicious websites.


    Some companies have had success with putting up signs encouraging safe computer
    surfing techniques and reminders on using complex unique passwords on online accounts.


    For more information, the US Computer Emergency Response Team (US CERT) has put
    together a great reference and alert site at [http://www.us-cert.gov/ncas/tips/](http://www.us-cert.gov/ncas/tips/).'
  merge: -1
  pgno: 235
- img_proc: false
  md: 'Don''t forget to check for cameras, open devices and also printers that are
    giving out too much information like internal network information, SNMP strings
    and user accounts.


    Also, use an open source (like OpenVas) or commercial security scanning system
    (like NESSUS) to scan your entire network for security issues. OpenVas comes pre-installed
    on Kali, there is somewhat of a process to get it working, but there are numerous
    tutorials online.


    # Learn Offensive Computer Security


    Finally, learn about offensive computer security techniques like those presented
    in this book,


    We have covered the most basic techniques used in offensive system security. There
    are a ton of books and security training seminars out there. Learn pentesting
    techniques (using products like Kali) and then try out your skills out on tools
    like Metasploitable and Mutillidae.


    Connect with your local OWASP chapter or other security groups in your area. Attend
    security conferences and make contacts in the security field. Many do not mind
    helping out when asked good questions. SANS has some great classes too.


    And once proficient, ***and with management''s permission***, test the security
    of your network systems.


    # Conclusion


    I just wanted to take a minute and thank you for reading my book. If you have
    any comments or suggestions, or just want to say " Hi! " please let me know, I
    would love to hear from you!


    I can be reached at [Cyberarms@live.com](mailto:Cyberarms@live.com).


    Also, please check out my Blog, ***cyberarms.wordpress.com*** for up to date computer
    security news and tutorials.


    This project took quite a bit of time (I actually started it a couple years ago
    using Backtrack, then updated it when Kali came out), but if the response is positive,
    I am planning on creating an intermediary level and possibly even a third more
    advanced book.


    Thanks again!


    Best Regards,


    *Daniel Dieterle*


