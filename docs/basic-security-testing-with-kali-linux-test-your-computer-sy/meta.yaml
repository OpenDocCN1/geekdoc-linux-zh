- img_proc: false
  md: 'attack, you have the ESSID or network name, CH is the channel the network is
    communicating on, ENCR is the type of encryption the network is using (Open, WEP,
    WPA, or WPA2), the POWER level in decibels, if Wi-fi Protected Setup (WPS) is
    enabled and if any CLIENTs are connected. It will say ''client'' if only one is
    connected or ''clients'' if multiple clients are present.


    +   5. For this example, Number 1 - "Vulnerable", seems like a good one to try.
    As you can see it is only using WEP encryption is pretty easy to crack.


    WiFite immediately begins to automatically attack and crack the WEP key.


    ![](bbox=[0.013, 0.183, 0.698, 0.453])


    A fairly large number of Initialization Vectors (IVs) are needed to crack the
    WEP key. Wireless AP''s normally generate IVs, but because we need a large number
    of them you can see the aircrack-ng tools working in the background injecting
    packets to force the AP to produce a large amount of these key packets.


    Once enough of the packets have been collected the WEP key can be decoded as shown
    below:


    ![](bbox=[0.013, 0.598, 0.698, 0.86])


    As you can see, WiFite successfully cracks the WEP key, *"1234567890"* in this
    case.


    # More advanced attacks with WiFite


