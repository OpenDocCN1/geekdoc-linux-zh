  md: '# # Chapter 31 – WiFi Pentesting on a Raspberry Pi


    # ## Resources


    +   - Verified Raspberry Pi (Not Kali) Peripherals - http://elinux.org/RPi_VerifiedPeriphererals


    # ## Basic Wi-Fi Pentesting using a Raspberry Pi


    Most of the commands that run in Backtrack 5/ Kali will have no problems running
    on the Raspberry Pi. Playing with Wireless Penetration testing with the Kali on
    PI works very well, and is a lot of fun.


    Simply plug your USB Wi-Fi adapter into the Pi. I used a TP-Link TL-WN722N Wi-Fi
    adapter with an antenna.


    One thing I noticed, you may need to power cycle the Pi if it doesn''t boot up
    right after plugging in your Wi-Fi adapter.


    At the command prompt type "***ifconfig***" and check to see if your Wi-Fi adapter
    is listed. It should show up as *wlan0*. If you don''t see it, type "***ifconfig
    wlan0 up***". Then run "***ifconfig***" again and it should show up:


    ![](bbox=[0.02, 0.55, 0.52, 0.87])


    Next let''s see what networks our wireless card can see.


    +   - Type, "***iwlist wlan0 scanning***":'
  merge: -1
  pgno: 224
- img_proc: false
  md: '![](bbox=[0.038, 0.011, 0.685, 0.554])


    Excellent, it looks like everything is working. Now let''s run some of the basic
    Aircrack-NG tools.


    First we need to put our wireless adapter into monitoring mode. This is a special
    mode that allows us to capture and view wireless signals.


    +   - Type "*airmon-ng wlan0 start*":'
  merge: -1
  pgno: 225
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 0.74, 0.29])


    This creates a new wireless adapter called "*mon0*". Now we can use this interface
    to capture wireless management and control frames.


    To do so, we will need a packet capture program. You could use tcpdump by simply
    typing *tcpdump -i mon0*. Or you could use *tshark*, the text version of Wireshark.


    But what''s the fun in that? I like graphical interfaces!


    With Xming running you can just start Wireshark as you normally would and it will
    show up on your Windows system.


    +   1. Type, "***wireshark &***" at the command line.

    2. Then just select your monitoring interface (***mon0***) and click "***Start***".


    ![](bbox=[0.0, 0.65, 0.72, 0.93])


    You will now be able to capture any Wi-Fi control packets within range:'
  merge: -1
  pgno: 226
- img_proc: false
  md: '![](bbox=[0.02, 0.01, 0.97, 0.19])


    A quick search for Probe Responses and you can see the SSID of any "Hidden" Wi-Fi
    Access Points. In the Wireshark snippet below we see the hidden access point named
    "*Hidden*":


    > **Probe Response SN=3521, FN=0, Flags=….C, BI=100, SSID=Hidden**


    As you can see hiding your Wireless name is not an effective means of securing
    a network.


    MAC Filtering is not very effective either, as you can monitor an individual access
    point with airodump-ng and get the MAC address of any system that connects to
    it:


    > **Airodump-ng -c (AP Wireless Channel) -a -bssid (MAC Address of AP) mon0**


    Then you simply spoof your MAC address using a program like *macchanger* and you
    can connect without any problems.


    # ## WEP and WPA/WPA2 Cracking


    You can use the *Airmon-ng* tools to manually attempt to crack WEP and WPA keys,
    but it is much simpler for new users if you use "*Fern WiFi Cracker*". Fern puts
    a graphical program interface to Airmon-ng, and includes the Reaver WPS protected
    setup attack, and several other useful tools.


    To start Fern in Kali:


    +   1. Type, "***fern-wifi-cracker***" at the command prompt.

    2. Simply select your interface and click "***Scan for Access Points***". After
    a short while any detected Wi-Fi networks will show up next to the WiFi, WEP,
    or WPA buttons:'
  merge: -1
  pgno: 227
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 0.31, 0.35])


    +   3. Now select the Wi-Fi button you want to attack and a list of detected APs
    will show up. We have a lab WPA 2 router up and running named "Vulnerable Router"
    that we will use in this example.


    ![](bbox=[0.01, 0.47, 0.7, 0.66])


    +   4. Next select the **"Regular Attack"** button, and pick a dictionary file
    (common.txt is included with Fern).


    5. And finally click "**WiFi Attack"**.


    Fern will then then Deauthenticate a client from the AP so it can capture an authentication
    key when the computer tries to reconnect. It then tries to crack the key using
    the dictionary file provided.


    If the dictionary file contains the password you should see this:


    ![](bbox=[0.01, 0.87, 0.72, 0.99])


    <span style="color:red">**WPA Key:** *password*</span> – Wow, a password of "*password*",
    not a smart way to secure anything. You would definitely not want an AP like that
    attached to your corporate network.'
  merge: -1
  pgno: 228
- img_proc: false
  md: 'As mentioned earlier, MAC filtering is not an effective means of securing a
    wireless network. If you look in the image above, across from ''Handshake Captured''
    , you can see that Fern was kind enough to give us the MAC addresses of any client
    connected to the AP in a drop down box.


    # ## Conclusion


    In this section we learned how to install and run Kali Linux on a Raspberry Pi
    Computer. We also learned how to connect to it remotely from a Windows system
    and use it to run some basic wireless pentesting using Fern.


    Hopefully we demonstrated that trying to hide your wireless network or use MAC
    filtering for security are not effective means of protecting your network. Also
    Fern WiFi cracker would make short work of any wireless AP protected by a weak
    password key.


    If an attacker can gain access to your network via Wi-Fi, they could use the foothold
    to attack deeper into your infrastructure. It is imperative to use strong complex
    WPA2 passkeys for small to medium businesses and home offices, or RADIUS servers
    in a corporate environment.


    You should also scan your network frequently to be sure there are no rogue or
    "employee installed" access points on your network. Testing your network for rogue,
    or weakly secured access points should be a part of every company''s security
    routine.


    While Wi-Fi pentesting on a Raspberry Pi may not make the most sense for large
    companies, but it is a very cost effective solution. To be able to run Kali on
    a credit card size $35 computer and be able to test wireless security with it
    is just incredible.


    It could also be a very interesting solution for professional pentesters. The
    Pi comes with not one, but two USB adapters. And if paired with battery power,
    could be used in many creative ways.'
