    # ## Introduction


    We have covered a lot of basic intro, recon and mapping; now let''s look at attacking
    hosts.


    Metasploitable 2 is a purposefully vulnerable Linux distribution. What this means
    is that it has known bugs and vulnerabilities built in on purpose. It is a training
    platform made to be used with Metasploit to practice and hone your computer security
    skills in a legal environment.


    Many think that Linux or Mac OS are much more secure than Windows. But like Windows,
    if you don''t install system patches and updates, they are equally vulnerable.


    The resources above cover a lot of information on installing and using Metasploitable
    2 so I will not spend a lot of time on this topic.


    But we will go through a couple of the exploits using Kali just to see how things
    work.


    # ## Installing and Using Metasploitable


    Metasploitable 2 is available as a Virtual Ware VM. Just download the file, unzip
    it and open it with VMWare Player. It''s that simple.


    If you are using Virtual Box, Rapid 7 hosts a video showing the full install of
    Metasploitable on Virtual Box. A link to the video can found in the Resources
    section above.


    ***Warning*** *– Never run Metasploitable on a public facing system, it is, by
    design, vulnerable!*


    Once Metasploitable boots up you will come to the main login screen:


    ![](bbox=[0.04, 0.985, 0.66, 1.0])'
