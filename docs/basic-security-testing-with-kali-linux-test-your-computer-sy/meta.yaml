    Let''s use "***ITDepartment@SomeRandomDomain.com***", so it looks like it is from
    the corporate IT department.


    +   7. Next SET asks for the password of your Gmail account.


    +   8. Enter "**yes**" at the prompt, "*Flag this message/s as high priority?*"


    +   9. Next, enter an e-mail subject line. How about, "***Important Update***":


    ```

    set:phishing> Email subject:Important Update

    ```


    +   10. Enter "**P**" when prompted to "*Send the message as html or plain?*"


    Now type-in a fake message, preferably one that will entice our victim to click
    on a malicious link included or entice them surf to a malicious webpage. In actual
    defense practice this could just be a test webpage that records the IP address
    of those who were tricked to surf to the page. That way as a security team we
    know who in our organization needs to be better educated on the risks of malicious
    e-mails.


    When finished, type "***END***".'
