    # Capturing Webcam Video, Screenshots and Sound


    When I was listening to the news a while back I remember them going on and on
    about a brand new "advanced persistent threat" that could actually allow attackers
    to turn on your webcam and even record sound. I thought this was completely ridiculous
    as you have been able to do this with Metasploit for years.


    # WEBCAM VIDEO


    From the Metasploit shell, typing *"run webcam -h"* displays the help menu.


    ![](bbox=[0.01, 0.46, 0.66, 0.66])


    Then just type *"run webcam"* and add any options that you want. This will remotely
    display the webcam from the target system.


    ![](bbox=[0.01, 0.72, 0.38, 0.81])


    If you use the *"-l"* option it will continuously grab webcam snaps until you
    hit ***"CNTRL-C"***.


    The only hint you get on the target machine that something is wrong is that your
    webcam recording light (if yours has one) comes on. Other than that, you cannot
    tell that someone is remotely viewing your webcam.'
