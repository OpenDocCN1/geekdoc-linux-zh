    # Defending against Pass the Hash Attacks


    So what can be done to prevent these types of attacks?


    During testing I found that using the built in Windows firewall with the Windows
    7 machine was a hindrance.


    I also found that many pass the hash type attacks would not work at all on Windows
    7 if the User Account Control (UAC) setting was turned on to any level except
    "***Never Notify***":'
