  md: '![](bbox=[0.0, 0.0, 0.79, 0.2])


    This took a little bit longer, about 11 minutes. But it looks like it was able
    to recover an additional hash.


    Let''s see what it was:


    ![](bbox=[0.0, 0.32, 0.55, 0.45])


    Okay, it got the one with an empty password, the "P@$$word" one and one new one
    – "MyNameIsBob".


    The two remaining passwords would be fairly difficult to crack. One is 15 characters
    long and uses special characters, upper and lower case letters and a number ($eCuR@d@CCount1)
    and the last one is very long, almost 30 characters.


    # ## More advanced cracking


    Just throwing a dictionary file at a hash list will recover some of the easier
    passwords, but to get the harder ones you need to you more advanced techniques.
    I will not cover them in detail, but Hashcat allows you to use multiple attack
    types:


    +   - Multiple Wordlists

    - Rule Sets

    - And Password Masks.


    **Attack Types:** The "*-a*" option allows you to designate the type of attack
    you want to use from the following options:


    ```

    0 = Straight

    1 = Combination

    2 = Toggle-Case

    3 = Brute-force

    4 = Permutation

    5 = Table-Lookup

    ```'
  merge: -1
  pgno: 172
- img_proc: false
  md: '**Rule based attacks** are very useful. Hashcat has a list of built in rules
    that you can use to crack passwords. For example there is a "leet" rule set that
    automatically takes each dictionary word and tries different lleet-speak versions
    of the word. You can even use a programming type language to create your own rulesets.


    Rule based attacks are enabled by using the "*-r*" switch and including a name
    of the ruleset you want. Best64.rule, passwordspro.rule, d3ad0ne.rule, and leetspeak.rule
    are some of the more popular ones.


    Something like:


    ![](bbox=[0.0, 0.231, 1.0, 0.26])


    **Mask attacks** allow you to define the layout of the words that will be used
    in your attack. For instance if you know that the password policy requires two
    numbers six uppercase letters and two special characters you can create a mask
    for Hashcat to use.


    In this example it would look something like *?d?d?u?u?u?u?u?s?s*:


    ![](bbox=[0.0, 0.383, 1.0, 0.413])


    Play around with the different options until you get a feel for how they work.


    Some of the attacks, especially the Brute Force ones can take forever. Use the
    video card based Hashcat versions to speed things up if you have a compatible
    card.


    # Conclusion


    The purpose of this exercise was not in just showing how to crack passwords, but
    to demonstrate how insecure passwords can be.


    Sometimes as an Ethical Hacker or pentester you need to crack hashes. This was
    just a basic level look at Hashcat. When you mix together the different attack
    styles, rules and masks you can create a pretty powerful tool.


    Hopefully this demonstrated why strong passwords are important. Implementing a
    policy requiring your users to use long complex passwords is a good move in securing
    your network. Or better yet, implement multi-factor authentication for your systems.


    Don''t forget to remind your users to use a different password for every account
    they have, especially important online accounts that include personal information.
    That way if a password is compromised the hacker will not have access to every
    one of their accounts.'
  merge: -1
