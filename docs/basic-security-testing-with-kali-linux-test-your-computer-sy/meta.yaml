    Lastly, the files can also be recovered by the ID number (not shown).


    # ## Recovery File Module Wrap-Up


    The module seems to work really well on data drives, but not so well on drives
    where there are a lot of files to recover, like on the main drive of a single
    drive system.


    I ran this on a Windows 7 boot drive on a VM that I have used a lot and it literally
    took hours to run. Granted it probably found about a thousand files, but I just
    can''t see how feasible this would be in real life as it would create an enormous
    amount of suspicious network traffic.


    Here is a network packet capture of the module running against a drive with a
    lot of deleted files:


    ![](bbox=[0.03, 0.385, 0.725, 0.625])


    But then again, how many people actually record and analyze their data traffic?


    The module does function extremely well though on smaller drives that don''t have
    an enormous amount of deleted files. It was lightning fast and worked very well.


    # ## Conclusion


    In this chapter we learned a lot about Metasploit''s Meterpreter shell. Though
    we covered some of the basics of getting around and using the shell, we only touched
    on a fraction of its capabilities. Hopefully you can see why getting a Meterpreter
    shell gives you a whole lot more functionality than just getting a straight remote
    access shell.


    Grabbing video and sound may seem to be a bit theatrical, but social engineers
    could use information they glean. For instance from video they could grab images
    of people''s badges, and have a glimpse into the target''s physical environment.


    Sound is interesting too. A social engineer could learn a lot about the target
    facility by being able to have a live microphone inside the building. And not
    too long ago "Sinn3r" from the Metasploit development team showed how you could
    grab recorded audio and search it using AT&T''s Watson speech program and Metasploit
    to look for keywords like "password" or "social security number".


    > *(See "Resources" above for link to article)*'
