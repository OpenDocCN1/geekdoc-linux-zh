- img_proc: false
  md: '# Chapter 4 – Meterpreter Shell


    # Resources


    +   - http://en.wikibooks.org/wiki/Metasploit/MeterpreterClient

    - http://cyberarms.wordpress.com/2013/02/03/remotely-recording-speech-and-turning-it-into-searchable-text-with-metasploit-watson/


    # Introduction


    After a successful exploit a Meterpreter shell allows you to perform many different
    functions along with a full remote shell.


    Meterpreter is great for manipulating a system once you get a remote connection,
    so depending on what your goals are; a Meterpreter shell is usually preferred
    to a straight remote terminal shell.


    Meterpreter gives us a set of commands and utilities that can be run to greatly
    aid in security testing. For example, there are commands to pull the password
    hashes and gather data & settings from the system.


    There are also some fun tools included in Meterpreter, for example, you can turn
    on the user''s webcam and grab still shots, you can turn on the remote microphone
    and even grab desktop screenshots of what the user is working on.


    In this section we will quickly cover the Meterpreter shell and some of its features.


    # Basic Meterpreter Commands


    Let''s start with a machine that we tricked into running a backdoored program
    (*To see how to create an Anti-Virus evading backdoor see the chapter on "Veil".*)
    Once executed the backdoor program connected out to our Kali system and a session
    was created. We were then automatically dropped into the active session as seen
    below:


    ![](bbox=[0.0, 0.87, 0.7, 1.0])'
  merge: -1
  pgno: 43
- img_proc: false
  md: 'available.


    ```

    meterpreter > help

    ```


    When we do so, we see that the commands are broken out into sections.


    The commands are:


    +   - Core Commands

    - File System Commands

    - Networking Commands

    - System Commands

    - User Interface Commands

    - Webcam Commands

    - And three Priv Commands


    We will not cover all of the commands, but will look at a couple in a little more
    depth. It is a good idea to read through them all to get a basic understanding
    of what they can do.


    # Core Commands


    ![](bbox=[0.013, 0.642, 0.679, 0.955])


    As a beginner level user, you will probably only use background, help, load, migrate,
    run and exit from this list.


    +   - **Background** - Background allows you to background a session so that you
    can get back to the msf prompt or access other sessions.'
  merge: -1
  pgno: 44
- img_proc: false
  md: 'You can return to your session by just using the "*session -i <session #>*"
    command.


    +   - <u>Load and Run</u> – These commands allow you to use additional modules
    and commands inside Meterpreter.

    - <u>Exit</u> – Exits out of Meterpreter.


    # File System Commands


    When you have a Meterpreter shell, you basically are dealing with two file systems,
    the local and remote. File system commands allow you to interact with both.


    ![](bbox=[0.013, 0.392, 0.58, 0.78])


    Basically you can use standard Linux commands to get around and use the file system.
    But how do you differentiate between the local system and the remote system that
    you are attached to?


    All the commands are assumed to be used on the **remote** system. So for example
    to get a directory listing of the remote system, just use the "*ls*" command:


    ![](bbox=[0.013, 0.948, 0.58, 0.999])'
  merge: -1
  pgno: 45
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 0.558, 0.196])


    When you need to move around your local (Kali) file system there are a couple
    commands you can use.


    +   - Getlwd & lpwd – Get (display) Local Working Directory

    - Lcd – Change Local Directory


    So if we needed to check our local working directory and then change into our
    Desktop directory on our Kali system we can do the following:


    ![](bbox=[0.0, 0.415, 0.295, 0.524])


    Download allows you to download files from the target system, and conversely,
    upload allows you to send files to the remote system.


    So if we wanted to upload a file, just connect to the local and remote directories
    that you desire and execute the upload command with the file name you want to
    send, as shown below:


    ![](bbox=[0.0, 0.655, 0.609, 0.97])


    We connected to the Desktop on the Kali machine where we had our tools file. We
    then connected to'
  merge: -1
