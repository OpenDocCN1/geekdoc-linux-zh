- img_proc: false
  md: "To login, enter the name and password shown on the menu:\n\n> *msfadmin / msfadmin*\n\
    \nYou wouldn't believe how many budding security professionals have asked for\
    \ the default login credentials for Metasploitable. And they put it right on the\
    \ login screen!\n\nLogging in is pretty anti-climactic. You basically just end\
    \ up at a text based terminal prompt:\n\n![](bbox=[0.025, 0.198, 0.414, 0.23])\n\
    \nBut we are not here to use the system from the keyboard; the goal is to try\
    \ to get into the system remotely from our Kali system.\n\n# Scanning for Targets\n\
    \nOne of the first steps that many security testers use is to do an \"nmap\" scan\
    \ to try to determine what ports are open and hopefully even what services are\
    \ installed on those ports. If we can determine open ports and service program\
    \ versions, then we may be able to exploit a vulnerability in the service and\
    \ compromise the machine.\n\nLet's take a look at Metasploitable from our Kali\
    \ box.\n\nThe first thing to do is to run an nmap scan and see what services are\
    \ installed.\n\n+   - Open a Terminal window on your Kali system and type:\n\n\
    \  *nmap -sS -Pn <metasploitable's IP address>*\n\nPut in the IP address for your\
    \ Metasploitable machine, which in our case is 192.168.198.145. If you didn't\
    \ know what IP address your Metasploitable is at, you could always scan a range\
    \ of addresses by typing something like, \"***nmap -sS -Pn 192.168.198.1-150***\"\
    \n\nThe \"-sS\" switch tells nmap to perform a stealth scan. The \"-Pn\" tells\
    \ nmap not to run a ping scan to see what systems are up.\n\nThis will show us\
    \ the open ports and try to enumerate what services are running:"
  merge: -1
