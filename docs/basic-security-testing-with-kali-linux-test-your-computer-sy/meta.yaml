- img_proc: false
  md: 'the "test" directory on our target, and simply used the *upload* command to
    transfer the file.


    Download works the same way, just use download and the file name to pull the file
    off the remote system and store it on your local Kali machine:


    ```

    meterpreter > download AccountInfo.txt

    [*] downloading: AccountInfo.txt -> AccountInfo.txt

    [*] downloaded : AccountInfo.txt -> AccountInfo.txt

    ```


    Now let''s take a look at the network commands.


    # Network Commands


    These commands allow you to display and manipulate some basic networking features.


    ![](bbox=[0.0, 0.357, 0.633, 0.587])


    +   - Arp – Displays a list of remote MAC addresses to actual IP addresses.

    - Ifconfig & ipconfig both display any network interfaces on the remote system.

    - Netstat – Displays a list of active network connections.

    - *Portfwd and route* allow you to do some advanced routing attacks. Though we
    will not be covering it in this book, using these two commands allow you to use
    the machine you have exploited to pivot or use it to attack other machines in
    the target network or networks.


    # System Commands


    Below is a list of system commands. We won''t cover them all, but again, it is
    good to read through the list to get familiarized with them:'
  merge: -1
