  md: '# Chapter 23 – Cracking Linux Passwords


    # Introduction


    Just as passwords hashes can be hacked in Windows, the same can be done with Linux
    machines. All you need is root level access and a hash cracking program like John
    the Ripper.


    In this tutorial we will use John the Ripper that comes with Kali and try our
    hand at cracking Linux passwords.


    # Cracking Linux Passwords


    If you remember from the Metasploitable Tutorial earlier in the book, we were
    able to get "root" level access by using the Unreal IRC exploit.


    Let''s take up our conversation using our Metasploitable root shell (see the *Metasploitable
    Chapter*) as a starting point:


    ![](bbox=[0.012, 0.358, 0.633, 0.598])


    Okay, we have a remote command shell, and I am the root user as can be seen above
    from the "*whoami*" command. So all we need now is to recover the password hashes
    and then crack them.


    Simply type, "**cat /etc/passwd**":'
  merge: -1
  pgno: 179
- img_proc: false
  md: '```

    cat /etc/passwd

    root:x:0:0:root:/root:/bin/bash

    daemon:x:1:1:daemon:/usr/sbin:/bin/sh

    bin:x:2:2:bin:/bin:/bin/sh

    sys:x:3:3:sys:/dev:/bin/sh

    sync:x:4:65534:sync:/bin:/bin/sync

    games:x:5:60:games:/usr/games:/bin/sh

    man:x:6:12:man:/var/cache/man:/bin/sh

    lp:x:7:7:lp:/var/spool/lpd:/bin/sh

    mail:x:8:8:mail:/var/mail:/bin/sh

    news:x:9:9:news:/var/spool/news:/bin/sh

    uucp:x:10:10:uucp:/var/spool/uucp:/bin/sh

