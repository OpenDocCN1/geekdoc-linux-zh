- img_proc: false
  md: '![](bbox=[0.09, 0.0, 0.4, 0.36])


    And once someone connects to it, it shows up on our Kali system:


    ```

    12:34:14 Client 78:E4:00:FF:2C:AB:01 associated (unencrypted) to ESSID: "EvilAp"

    ```


    We have now turned our little unassuming wireless card into an "EvilAP". To complete
    the Dr. Jekyll to Mr. Hyde conversion, we also need to configure the Kali system
    to give out IP addresses to connecting clients (DHCP) and control what websites
    they can see (DNS spoofing).


    You can do this manually, but there are several programs that do this automatically.
    The Kali recent addition "Ghost-Phisher" is one, and the Social Engineering Toolkit
    (SET) Wireless AP attack is another. They allow you to take complete communication
    control between the internet and our wireless client user.


    As of the latest Kali release, Ghost-Phisher is included with Kali, but the Wi-Fi
    attacks don''t seem to completely work. And the SET AP attack that worked great
    in Backtrack wants to use dhcpd3 server which doesn''t seem to be directly supported
    in Kali.


    But with either tool creating a fake AP and then grabbing credentials or performing
    Man-in-The-Middle attacks are very easily done with a few mouse clicks.


    Keep an eye on these tools, as I am sure both will be fixed in later Kali updates.


    Later in this chapter we will see how to use "Easy-Creds" which can do all of
    these things and more.


    # Using MacChanger to Change the Address (MAC) of your Wi-Fi Card


    You may want to change the Mac address of your wireless network card before running
    wireless testing. If so, Kali supports a tool for this called MacChanger.


    Notice that the ifconfig command displays the physical MAC (HWaddr) address of
    your card. This is a unique identifier hardwired into the card. But you can change
    this address by using the "macchanger" command.'
  merge: -1
  pgno: 196
- img_proc: false
  md: '+   1. Take your wireless card down with the "ifconfig wlan0 down" command.

    2. Type "macchanger –r wlan0"


    The -r command sets your MAC to a random address. You can also it to a specific
    address if you want. Use the help switch (macchanger -h) to see more options.


    ![](bbox=[0.022, 0.176, 0.696, 0.404])


    # Conclusion


    As we have shown there are many unsecured wireless routers out there and it is
    very easy to circumvent some of the common security measures that are implemented.
    It is also very simple to create a rogue "*Free Wi-Fi Hotspot*", intercept the
    wireless traffic, and control what a surfer can see in his browser and where he
    can surf.


    The best defense against Wi-Fi attacks is to secure your router! Do not use open
    or WEP security. One of the main defenses your network has is your firewall; if
    you allow people inside your firewall you can open yourself up to ARP MitM attacks,
    packet sniffing and other attacks. Unfortunately, many corporate users do not
    understand this and will take their business laptops from a very secured environment
    at work to a very unsecured Wi-Fi network at home.


    Be cautious of free Wi-Fi. Don''t do online banking or shopping while using public
    Wi-Fi. Make sure your operating system is using a firewall and preferably internet
    security software. If your security software monitors your ARP table, that is
    even better!


    Use common sense, if you are working on sensitive information, do it at home not
    at the local coffee shop that offers free Wi-Fi, even if their cinnamon rolls
    are the best in the world. It is just not worth the risk!


    For more information, check out Vivek Ramachandran''s excellent book, "*Backtrack
    5 Wireless Penetration Testing Beginner''s Guide.*" Also, David Kennedy''s (creator
    of SET) book, "*Metasploit: The Penetration Tester''s Guide*" is an excellent
    reference on Backtrack 5, SET and the Metasploit Framework.'
  merge: -1
