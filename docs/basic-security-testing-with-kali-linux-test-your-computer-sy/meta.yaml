    ![](bbox=[0.014, 0.439, 0.678, 0.586])


    Here you can see the user name & password along with the site that they tried
    to access.


    Remember that our "victim" visited an ssl encrypted HTTPS site and the login credentials
    should have been encrypted. But by using Easy Creds we were able to intercept
    the traffic, strip off the encryption with sslstrip and view the login credentials
    in plain text.


    # Conclusion


    In this tutorial we saw how to create a rogue wireless access point that could
    recover user account information from secure websites using Easy-Creds.


    This technique would work very well for a penetration tester who is able to gain
    physical access to a company and setup a Rogue Wi-Fi system to intercept user
    credentials.


    This section should also be a warning to corporate security teams that it is fairly
    trivial to set up a rogue Wi-Fi Access Point. Scaming for rogue devices should
    be a fairly common practice if a company relies heavily on Wireless networking.'
  merge: -1
