    ```


    Only two out of five, that is not very helpful. Let''s try a larger dictionary
    file.


    # Using a Larger Dictionary File


    If first you don''t succeed, try a larger dictionary!


    Crackstation ([https://crackstation.net/buy-crackstation-wordlist-password-cracking-dictionary.htm](https://crackstation.net/buy-crackstation-wordlist-password-cracking-dictionary.htm))
    has a massive 15GB dictionary file that works very well.


    I downloaded the 4GB compressed file, uncompressed it and put it in a directory
    with our hash file. I then ran the hashcat file using the Crackstation wordlist:


    ```

    root@kali:~/Crack# hashcat -m 1000 hash.txt crackstation.txt -o cracked.txt --remove

    ```'
