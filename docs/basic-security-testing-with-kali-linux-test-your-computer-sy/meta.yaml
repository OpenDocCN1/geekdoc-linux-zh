  md: '# # Chapter 30 – Installing Kali on a Raspberry Pi


    # ## Resources


    +   - Kali Raspberry Pi ARM Image - http://www.kali.org/downloads/

    - Win32 Disk Imager - http://sourceforge.net/projects/win32diskimager/

    - Putty Download - http://www.chiark.greenend.org.uk/~sgtatham/putty/download.html

    - Xming - http://sourceforge.net/projects/xming/


    # ## Introduction


    In this chapter we will learn how to install Kali Linux on a Pi, connect to it
    remotely via Windows 7 and use it to perform some basic wireless security tests.


    Kali Linux is the newest version of the ever popular Backtrack penetration testing
    and security platform. Numerous updates and enhancements have been added to make
    Kali more capable and easier to update than ever before.


    > *(Note: Occasionally I have noticed that certain programs will not run from
    the command prompt on the ARM version of Kali. You may need to execute them from
    their program directory under /usr/bin.)*


    Raspberry Pi is a very inexpensive fully functional "credit card" sized computer
    that comes in two models. The newer "B" model, used in this article, has 512 MB
    RAM, video output, a NIC, sound jack and dual USB ports and amazingly only costs
    about $35 (USD).


    The Pi has an ARM based processor, and comes preloaded with an operating system.
    But other operating systems compiled for ARM can also run on the Pi.


    The good folks at Offensive Security have created a Kali Linux image for the Raspberry
    Pi, so installation could not be easier. All you need is a Raspberry Pi, the Kali
    Image, and an SD Card. We will also use a Windows system to write the image to
    the SD card, and then use it to connect to the Pi via SSH.


    > *REMINDER: As always, never connect to or access a network that you do not have
    express written permission to access. Doing so could get you into legal trouble
    and you might end up in jail.*


    # ## Pi Power Supplies and Memory Cards


    Before we get started, let me quickly cover power issues with the Raspberry Pi.
    A Power adapter does not normally come with the Pi. If the adapter you use does
    not provide enough amperage the Pi will act erratic, especially when you try to
    plug in the Wi-Fi card.


    The manufacturer recommends that you use a 2 amp power supply. Many micro USB
    power adapters only provide one amp or less. I have had very good luck with a
    2.1 Amp adapter from Rocketfish.'
  merge: -1
  pgno: 218
- img_proc: false
  md: 'The Pi also comes without a required SDHC memory card. An easy rule to follow
    when selecting a card is, the faster the better. I used a Sony 16GB Sony memory
    card with a stated transfer rate of 15MB/s.


    Any data on the card will be wiped during install.


    # Installing Kali on a Raspberry Pi


    Let''s get started by downloading and installing Kali Linux on the Pi. See software
    download URL''s see Resources section above.


    +   1. Download the [Kali Linux Raspberry Pi ARM Image](#) to your Windows system.

    2. The image file is compressed so you will need to expand it.

    3. Next, install the image to your SD card using [Win32 Disk Imager](#).


    Just plug your SD card into your Windows computer and run Disk Imager. Point it
    to your Kali image that you downloaded and select the drive letter of your SD
    card.


    Then just hit, "***Write***".


    ![](bbox=[0.022, 0.421, 0.535, 0.601])


    Disk Imager will write the Kali Linux image to your SD card.


    +   4. Now eject the SD card from Windows and insert it into the SD card slot
    on your Raspberry Pi. Connect your video, Ethernet cable, keyboard and mouse.

    5. Connect power to the Raspberry Pi and in a few seconds it will boot up into
    Kali.


    That is it! You know have a Raspberry Pi Pentesting platform!


    Restart the Pi and let it boot up into Kali. Running the Pi with a keyboard and
    monitor attached is a good way to get started. You may want to play around a bit
    with it before we move on.


    # Connecting to a "Headless" Pi remotely from a Windows system


    You can also run the Pi "headless" or without a keyboard and monitor. You can
    control the Pi remotely over the LAN from our Windows box through SSH. You don''t
    really need to do this, and if you don''t want to you can go ahead and skip ahead
    to the next chapter if you would like.'
  merge: -1
  pgno: 219
- img_proc: false
  md: 'But running a Pi headless does add some interesting capabilities.


    To do so:


    +   1. Download Putty for Windows.

    2. Run Putty and enter the IP address for your Kali System. You can get this by
    typing *"ifconfig"* if you have a keyboard attached or by checking the address
    given to it by your router if you are running Kali headless.


    My IP address is 192.168.1.135.


    +   3. Make sure port 22 is entered and select "***SSH***" as the connection type
    as shown in Figure 2:


    ![](bbox=[0.025, 0.272, 0.71, 0.451])


    **Figure 2: Configuring Putty to connect to the Pi**


    Then just hit "***Open***".


    You will be asked to log into the Raspberry Pi. If this is the first time, just
    use the Kali default credentials:


    > ***Username: root***

    ***Password: toor***


    ![](bbox=[0.025, 0.654, 0.78, 0.812])


    That''s it!


    Now you can run any of the text commands you want on your Raspberry Pi remotely
    from your Windows System.


    # Viewing Graphical X Windows Programs Remotely through Putty


    Okay, you can run any text based program through Putty, but if you try to run
    a graphical program it'
  merge: -1
  pgno: 220
- img_proc: false
  md: 'will not work. We can run the X based programs over a remote Putty connection
    if we use Xming, the X Server for Windows.


    +   1. Simply download and install [Xming]()


    ![](bbox=[0.02, 0.15, 0.97, 0.55])


    +   2. When asked which components to install click, ***"Don''t install an SSH
    client"*** and finish installation .


    +   3. Now open Putty again and put in the IP address and port for your Raspberry
