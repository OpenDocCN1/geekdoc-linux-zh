  md: 'As you can see, an attacker having control over the browser can be very bad.


    # ## Conclusion


    BeEF can be a very interesting to play with and fairly easy to use once you get
    the hang of it.


    The attacks are color coded as to the chance that they might work. You may want
    to try them anyways, as I have noticed that some coded as not working well seemed
    to work okay on occasions.


    I also noticed that newer browsers seemed to stop some of the attacks, but XP
    was still pretty open as to what would work against it.


    I tried these exact same attacks against a Windows 7 system using the latest Firefox
    browser and nothing was displayed:


    ![](bbox=[0.0, 0.32, 0.5, 0.57])


    A hook was created, but only lasted for about a second or two before it was dropped.


    The best mitigation against this type of attack seems to be to use the latest
    Windows OS and browser versions. If you can, update or replace your Windows XP
    systems, especially if they are used online.


    The base security in Windows 7 and 8 is much better than Windows XP.


    Finally always run a script blocker like the Firefox Add-In, *"NoScript"*, and
    don''t click on or open links and attachments in unsolicited email and social
    media messages.'
