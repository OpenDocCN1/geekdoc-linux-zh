  md: '# # Chapter 21 - HashCat


    # ## Resources


    +   - Hashcat Wiki - http://hashcat.net/wiki/

    - Installing video drivers for your card - http://docs.kali.org/general-use/install-nvidia-drivers-on-kali-linux

    - Wordlists - *See Wordlist Chapter*


    # ## Introduction


    So far we have covered several techniques for attacking passwords. We saw that
    sometimes you can just do a rainbow table lookup, and in some cases you can pass
    the hash. But if all else fails, you have to crack the hash.


    Kali includes several excellent programs to do this. In this section we will look
    at one of my favorites, Hashcat.


    We rely on passwords to secure our home systems, business servers and to protect
    our online account information. But as cracking programs improve and video cards
    get faster (Video GPU''s are used for very fast cracking) passwords are becoming
    much easier to crack.


    How big of a problem is this?


    Not too long ago I tried out OCL-Hashcat with my Windows 7 system that had a Core
    I-5 750 processor running at 2.67 Ghz and a single AMD Radeon 7870 video card.
    I used a fairly recently released password hash file that contained over 7,000
    user hashes. I chose this one due to the size. Yes much larger ones are out there,
    but I thought the size corresponded more realistically to an average company that
    a pentester or incident response team would be dealing with. Besides, how many
    American businesses have a million or more employees?


    With OCL-Hashcat and two different dictionary files, I was able to crack 86% of
    it… In 30 minutes…


    If that doesn''t sound impressive, OCL-Hashcat took just 12 seconds to recover
    46% of them, and about 13 minutes to recover 66%.


    Think about that for a moment, 46% of the seven thousand passwords were cracked
    in 12 seconds.


    # ## Hashcat


    Hashcat is an all-purpose password cracker that can run off of your graphics card
    processor (GPU) or your CPU. The GPU version, OCLHashcat-plus (or CUDAhashcat-plus
    depending on your video'
  merge: -1
  pgno: 168
- img_proc: false
  md: 'card) is touted as the world''s fastest md5crypt, php​ass, mscash2 and WPA
    / WPA2 cracker.


    Hashcat is a multi-threaded cracker, so if your CPU can run several threads, it
    will use them. But the real speed comes into play when using the horsepower of
    a GPU, the processor on your video card. If your GPU can run hundreds of threads,
    all of this power is used to break passwords.


    You can even harness the power of multiple video card GPUs to create a monster
    cracking station.


    # Cracking NTLM passwords


    There is nothing like hands on practice, so let''s crack some hashes.


    Here are some easy ones:


    ```

    a4f49c406510bdcab6824ee7c30fd852

    2e4dbf83aa056289935daea328977b20

    d144986c6122b1b1654ba39932465528

    4a8441c8b2b55ee3ef6465c83f01aa7b

    259745cb123a52aa2e693aaacca2db52

    d5e2155516f1d7228302b90afd3cd539

    5835048ce94ad0564e29a924a03510ef

    b963c57010f218edc2cc3c229b5e4d0f

    f773c5db7ddebefa4b0dae7ee8c50aea

    5d05e3883afc84f1842f8b1c6d895fa4

    6afd63afaebf74211010f02ba62a1b3e

    43fccfa6bae3d14b26427c26d00410ef

    27c0555ea55ecfcdba01c022681dda3f

    9439b142f202437a55f7c52f6fcf82d3

    ```


    Simply put these hashes in a text file. In my example I saved them as "Easyhash.txt"
    and placed them in the Desktop directory. I also copied the ***"RockYou.txt"***
    password dictionary file from the ***"/usr/share/wordlists"*** directory to the
    desktop.


    *(Remember the RockYou.txt file is compressed, so if you haven''t done so already,
    you will need to uncompress it using the "gunzip" command. See the Wordlists chapter
    for more information.)*


    We are going to run Hashcat, but we need to tell it a few things. We need to tell
    it what type of hashes we are using, the name of the hash file, the name of the
    dictionary file and finally the output filename to store the cracked hashes.


    You can see the different options by opening a terminal window and typing ***"hashcat
    --help"***.


    Let''s go ahead and try to crack the simple hashes listed above.


    +   1. Open a terminal prompt, navigate to the Desktop directory and type, ***"hashcat
    -m 1000 Easyhash.txt rockyou.txt -o cracked.txt"***


    ```

    root@kali:~# hashcat -m 1000 Easyhash.txt rockyou.txt -o cracked.txt

    ```'
  merge: -1
  pgno: 169
- img_proc: false
  md: 'The "–m 1000" switch tells hashcat that our hashes are NTLM based hashes. Easyhash.txt
    is the name of our hash file. Rockyou.txt is the name of our dictionary file and
    –o cracked.txt tells hashcat where to store the cracked hashes.


    2. And in just over a second you should see this:


    ```

    root@kali:~/Desktop# hashcat -m 1000 Easyhash.txt rockyou.txt -o cracked.txt

    Initializing hashcat v0.44 by atom with 8 threads and 32mb segment-size...


    Added hashes from file Easyhash.txt: 13 (1 salts)


    NOTE: press enter for status-screen


    All hashes have been recovered

    root@kali:~/Desktop#

    ```


    3. Open the cracked.txt files to see the cracked hashes with the *cat* command:


    ```

    root@kali:~/Desktop# cat cracked.txt

    b963c57010f218edc2cc3c229b5e4d0f:iloveyou

    259745cb123a52aa2e693aaacca2db52:12345678

    5835048ce94ad0564e29a924a03510ef:password1

    5d05e3883afc84f1842f8b1c6d895fa4:jesus

    f773c5db7ddebefa4b0dae7ee8c50aea:trustnol

    6afd63afaebf74211010f02ba62a1b3e:elizabeth1

    a4f49c406510bdcab6824ee7c30fd852:Password

    d5e2155516f1d7228302b90afd3cd539:Monkey

    43fccfa6bae3d14b26427c26d00410ef:francis123

    d144986c6122b1b1654ba39932465528:Administrator

    9439b142f202437a55f7c52f6fcf82d3:luphu4ever

    27c0555ea55ecfcdba01c022681dda3f:duodinamico

    2e4dbf83aa056289935daea328977b20:P@$$w0rd

    root@kali:~/Desktop#

    ```


    And there you go, 13 passwords cracked in about a second and a half. Take a good
    look at the passwords as coincidently many of these were the top passwords cracked
    in 2012. Using any of these would not stand up to a password cracker for more
    than a fraction of a second.


    # Cracking harder passwords


    Let''s look at some harder passwords with Hashcat.


    We will use the passwords that we recovered earlier in the Password chapter using
    the hashdump command.


    ```

    31d6cfe0d16ae931b73c59d7e0c089c0

    2e4dbf83aa056289935daea328977b20

    d6e0a7e89da72150d1152563f5b89dbe

    317a96a1018609c20b4ccb69718ad6e7

    2e520e18228ad8ea4060017234af43b2

    ```


    Again, let''s save these to a text file, this time called hash.txt, and put it
    in the Desktop directory.


    And using the same dictionary file, let''s try to crack them.'
  merge: -1
  pgno: 170
- img_proc: false
