  md: '# Chapter 19 – Mimikatz and Utilman


    # Introduction


    For ages the security field mantra has been, if you have physical access, you
    have total access. And in many cases this is true.


    I performed onsite server and workstation support throughout upstate New York
    and Northern Pennsylvania for about 20 years and have seen companies do some really
    silly things when it comes to physical security.


    I have been in and out of hundreds of facilities, allowed to roam around completely
    unsupervised.


    At one datacenter that I showed up to repair a server; none of the admins could
    be found and the network manager was off site. Not one of them answered their
    pages or cell phone calls. So the receptionist did the only logical thing, she
    ushered me into their server room and left me there, completely unsupervised for
    about an hour until someone showed up…


    One time I saw a major company prop their secure server room door open with cabling
    boxes and leave it unsupervised while they took their hour lunch.


    I have a friend who is a retired Special Forces operator, and he told me once
    that if you are armed with a tie and a clipboard, no one will stop you. And he
    was right. Out of my 20 years of doing onsite server and IT support involving
    banks, government facilities, research centers and large corporations, once inside
    the building, I was stopped and asked for ID only three times!


    Physical security is very important. In this section we will look at one possible
    Windows physical attack using a Kali Live CD, the "Utilman Login Bypass" and the
    very powerful password revealing program "Mimikatz".


    # Utilman Login Bypass


    Okay this technique is really old, and not technically an attack. It originated
    from an old Microsoft Technet Active Directory support forum message. This technique,
    called the " *UtilmanBypass* ", was one recommended technique to log into a Windows
    server in case you forgot the password.


    The Utilman bypass works by manipulating a helpful windows function that is available
    at the login prompt. It allows a system level command session to open without
    using credentials.


    I have friends who support large networks that tell me that they still use this
    technique for legitimate purposes. For example when older corporate stand-alone
    systems need to be backed up and re-purposed and no one can remember the system
    password, they will use this technique.


    To perform this procedure you need a (Kali) Linux boot disk. We will boot from
    the disk and change the Windows "Utilman" program, so when the " *Windows* " +
    " *U* " keys are pressed, a command prompt will open instead of the normal utility
    menu.'
