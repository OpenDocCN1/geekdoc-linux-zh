  md: '# # Chapter 24 – Router Attacks


    # ## Resources


    +   - Routerpwn.com

    - Shodanhq.com


    # ## Introduction


    Recently, there have been several rather critical vulnerabilities discovered in
    very common network routers. They are, in most cases, the first line of defense
    for a network, so I think it important to spend some time about them.


    We will take a look at a couple ways that Routers and Wireless Networks are attacked.


    In this chapter we will look at "***Routerpwn***" , a website that contains executable
    exploits for routers. We will then look at attacking Wi-Fi Protected Setup (WPS)
    - a push button or PIN based method of setting up WPA/WPA2 networks.


    Then over the next several chapters we will cover attacking Wi-Fi networks in
    more depth.


    But first let''s talk a little bit about Router passwords.


    # ## Router Passwords


    Of all devices, routers are one of the most important devices to secure with a
    long complex password.


    Multiple websites exist that contain default passwords for network devices. The
    first thing a drive-by hacker (someone looking for an easy hit) will do is try
    default credentials for internet facing devices.


    And sadly, many times they will work!


    Some industry experts recommend a password of 12-15 mixed symbols, numbers and
    upper/ lower case characters for a good password. I would easily recommend at
    least twice that many for a mission critical internet facing router.


    I also recommend turning off remote web management, when not needed. This immediately
    blocks changes to the router being made from over the internet.


    # ## Routerpwn


    Though not included in Kali, Routerpwn.com is probably one of the easiest to use
    tool for finding Router exploits. The webpage contains router exploits by manufacturer
    and multiple tools & utilities including password key generators.'
  merge: -1
  pgno: 185
- img_proc: false
  md: '![](bbox=[0.01, 0.01, 0.65, 0.46])


    To use the website you simply click on the manufacturer of the target router.
    So if we choose "Dlink" we will see the Dlink section of exploits:


    ![](bbox=[0.01, 0.55, 0.7, 0.87])


    If you click on the router model, Routerpwn will pull up a Google Image search
    for the router number you clicked on so you can identify the router by sight.


    Below that is a list of Router exploits showing the date, brief description and
    an option to set the target IP. Clicking on any of the exploits will prompt you
    for any variables that are needed and then immediately launch it against a default
    local IP address.'
  merge: -1
  pgno: 186
- img_proc: false
  md: 'password, obtain configuration information, directory traversal, run remote
    commands, and more.


    Routerpwn also includes a MAC lookup utility and a link to external resources
    including a router default password list site and Shodan.


    Shodan (*Shodanhq.com*) is probably one of the easiest ways for an attacker to
    find routers and other devices on the web. For the most part, just entering the
    manufacturer''s name as a keyword will return thousands of them.


    The crazy thing is that because Routerpwn is a website, it can be run off of almost
    any platform - Windows, Linux, smart phones, etc. In one security seminar the
    author of the tool even mentioned that you can run it from a Wii!


    Routerpwn is a great one stop shop for finding basic router exploits.


    # ## Wi-Fi Protected Setup (WPS)


    WPS is used to try to make setting up new Wi-Fi devices easier, by allowing users
    to use a PIN or button presses instead of having to enter a long passphrase. Many
    routers support it, but the way in which it works opens it up to possible hacker
    brute force attacks.


    Cracking a long complex Router passphrase could take days, or even months. But
    in many cases, WPS can be cracked to gain access to a router WPA/WPA2 passphrase
    in usually under 10 hours.


    WPS on the router side will look something like this screenshot of a router configuration
    page below:


    ![](bbox=[0.0, 0.578, 1.0, 0.962])


    I don''t want to spend a lot of time on this, but we will take a quick look at
    a couple utilities that can be used to perform WPS attacks.'
  merge: -1
  pgno: 187
- img_proc: false
  md: 'Many WPS attack programs will use Reaver to crack the WPS 8 digit key. So,
    we will first look at using Reaver, and then we will take a look at a couple GUI
    based programs.


    # Attacking WPS with Reaver


    Reaver is a very popular tool for attacking WPS. It is included in Kali and can
    be run from the command prompt.


    +   1. First we need to put the Wi-Fi card in Monitoring mode by typing, **"aimon-ng
    wlan0 start"**.


    If all went well, you should see something like this:


    ![](bbox=[0.0, 0.235, 1.0, 0.34])


    +   2. Now type, **"reaver"** and add the **"-i"** interface switch, **"-b"**
    and the mac address of the target router, then **"-v"** for verbose feedback.
    It should look something like this:


    ```

    root@kali:~# reaver -i mon0 -b b8:a3:85:aa:00:01 -vv

    ```


    +   3. Reaver will then begin cracking the WPS key.


    Now let''s look at some other programs that include reaver.


    # Attacking WPS with Fern WiFi Cracker


    Fern WiFi Cracker is a great tool for testing wireless networks security. We will
    talk more about using Fern against Wi-Fi networks in a later chapter, but let''s
    look at how to attack WPS using it.


    +   1. Type, **"fern-wifi-cracker"** at a Terminal Prompt.


    +   2. In the Select Interface drop down, select your Wireless Card (Wlan0). It
    should then say *"Monitor Mode Enabled on Mon(x)"*:


    ![](bbox=[0.035, 0.72, 0.97, 0.81])


    +   3. Click the **"Scan for Access Points"** button.


    +   4. Click the WEP or WPS Button when it finds access points:


    ![](bbox=[0.035, 0.905, 0.97, 0.98])'
