- img_proc: false
  md: "**GETPID & PS COMMANDS** – As you use Meterpreter, two of the commands that\
    \ you will use somewhat frequently are *getpid* and *ps*.\n\n+   - Getpid – tells\
    \ you what process ID your shell is running on\n- Ps – lists all processes running\
    \ on the remote system\n\nSo if I type, \"***getpid***\" I see this:\n\n```\n\
    meterpreter > getpid\nCurrent pid: 3824\n```\n\nThis is the process ID number\
    \ that our shell is using. If I type \"***ps***\" I can see all the processes:\n\
    \n```\nmeterpreter > ps\n\nProcess List\n============\n\n PID   PPID  Name\n ---\
    \    ---   ----\n 0      0     [System Process]\n 4      0     System\n 236  \
    \  4     smss.exe\nRoot\\System32\\smss.exe\n 332    324   csrss.exe\nows\\system32\\\
    csrss.exe\n 384    376   csrss.exe\nows\\system32\\csrss.exe\n 392    324   wininit.exe\n\
    ows\\system32\\wininit.exe\n 428    376   winlogon.exe\nows\\system32\\winlogon.exe\n\
    \ 488    392   services.exe\n```\n\nIf we go further down the list, looking for\
    \ our pid number of 3824 we see this:\n\n```\n3824   3796   powershell.exe   x86\
    \   1   WIN-LOANLOTDQLU\\Fred\nC:\\Windows\\System32\\WindowsPowerShell\\v1.0\\\
    powershell.exe\n```\n\nThis shows our process ID of 3824. It also shows that we\
    \ are running under a *powershell.exe* process as the user \"Fred\".\n\nThis information\
    \ comes in handy when we want to \"*migrate*\" out of this low level process and\
    \ into a process with a higher level access. We can move our shell off of this\
    \ PID to a process that has higher level access.\n\nMigrating also allows us to\
    \ merge and hide our shell into another more common process, in essence hiding\
    \ our connection. Explorer.exe is one of the more common processes to migrate\
    \ to.\n\nSimply find the PID# of the process you want to use (1736 on our system)\
    \ and type, \"***migrate <PID#>***\""
  merge: -1
