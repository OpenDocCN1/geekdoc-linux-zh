    \    discovery/info_disclosure/dns/cache_snoop\n    discovery/info_disclosure/http/backup_finder\n\
    \    discovery/info_disclosure/http/google_ids\n    discovery/info_disclosure/http/interesting_files\n\
    \n  Experimental\n  ------------\n    experimental/rce\n\n  Recon\n  -----\n \
    \   recon/contacts/enum/http/web/dev_diver\n    recon/contacts/enum/http/web/namechk\n\
    \    recon/contacts/enum/http/web/pownedlist\n    recon/contacts/enum/http/web/should_change_password\n\
    \    recon/contacts/gather/http/api/jigsaw/point_usage\n```\n\nSome of the modules\
    \ are passive; they never touch the target network. While some directly probe\
    \ and can even attack the system you are interested in.\n\nOne tactic used to\
    \ passively probe network structure is to use the Google search engine to enumerate\
    \ site sub-domains. You know that there will be a main domain like \"*some_target_name.com*\"\
    \ but what other subdomains are out there?\n\nYou can do a Google search for subdomains\
    \ using the \"*site:*\" and \"*inurl:*\" switches. Then remove sub-domains (-*inurl*)\
    \ that you find, so other subdomains will appear. This can take a while to do\
    \ by hand and can require a lot of typing if the target has a large number of\
    \ sub-domains.\n\nRecon-NG will do this for you automatically and record what\
    \ it finds in a database.\n\nJust use the \"**recon/hosts/gather/http/web/google_site**\"\
    \ module. Then \"**show options**\" to see what the module requires.\n\n```\n\
    recon-ng > use recon/hosts/gather/http/web/google_site\nrecon-ng [google_site]\
    \ > show options\n\n  Name        Current Value  Req  Description\n  ----    \
    \    -------------  ---  -----------\n  DOMAIN                     yes  target\
    \ domain\n\nrecon-ng [google_site] >\n```\n\nThis one only requires the target\
    \ domain.\n\nAs in Metasploit, just type, \"**set domain [targetname.com]**\"\
    . Then just type, \"**run**\" and the module will execute, as seen below:\n\n\
    ```\nrecon-ng [google_site] > set DOMAIN SomeDomainName.com\nDOMAIN => SomeDomainName.com\n\
    recon-ng [google_site] > run\n```\n\nYou will then see a screen like the simulated\
    \ one below:"
