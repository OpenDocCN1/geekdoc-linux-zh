  md: '# Chapter 18 – Mimikatz Plain Text Passwords


    # Introduction


    In this section we will look at recovering remote passwords in plain text.


    You read that right, ***plain text!***


    I''ve communicated with Benjamin Delpy (aka Gentil Kiwi), the mastermind behind
    "Mimikatz", on a couple occasions and he seems to be one of the nicest guys in
    the security community.


    I am not going to pretend that I understand exactly how he does what he does,
    but this master programmer has found that Windows stores passwords in plain text
    (!) in several locations in Windows processes.


    And he has found out how, with his programming wizardry, to pull them out.


    Mimikatz has been available as a stand-alone program for a while now, and has
    been added into the Metasploit Framework as a loadable Meterpreter module, making
    recovering passwords once you have a remote session incredibly easy.


    And did I mention the passwords are in plain text?


    # Loading the Module


    We will start with an active Windows 7 System level remote shell in Meterpreter.


    *(See the Chapter on Bypassing UAC to see how to go from an administrator level
    to system level account).*


    ```

    meterpreter > getuid

    Server username: NT AUTHORITY\SYSTEM

    meterpreter >

    ```


    We need to load in the mimikatz module, there is a 32 and 64 bit module, choose
    accordingly. For this section we will be using the 32 bit.'
  merge: -1
  pgno: 151
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 0.56, 0.21])


    The help is pretty self-explanatory; basically type the corresponding command
    for the creds that you want to recover.


    So for Kerberos just type "*kerberos*" at the Meterpreter prompt. Or type "*msv*"
    to recover the hashes.


    Using these commands you can recover user passwords from multiple system sources
    - Windows Login passwords, MS Live passwords, terminal server passwords, etc.


    You can also use the "*mimikatz-command*" to perform even more functions like
    retrieving stored credentials. But for now we are just interested in passwords.


    # Recovering Hashes and Plain Text Passwords


    +   1. Type "***msv***":


