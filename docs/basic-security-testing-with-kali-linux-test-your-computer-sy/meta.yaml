  md: '![](bbox=[0.0, 0.0, 1.0, 0.39])


    Modifying the "Sethc.exe" command in the same way also allows you to bypass the
    Windows login screen. The "sethc" file is for the Windows Sticky Keys function.
    Under normal operation, if you hit the Shift key 5 times in a row, the sticky
    key dialog box will pop up.


    Used this way, just hit the shift key five times at the login screen and the system
    level command prompt opens.


    ***Note to admins** – Physical access for the most part equals total access. Encrypt
    your drives and secure your systems!


    # Recovering password from a Locked Workstation


    Moving forward with this concept, how cool would it be for a penetration tester
    (if you had physical access to a system) to be able to grab the passwords off
    of a Windows system that was sitting at a locked login prompt? And what if you
    could get these passwords in plain text?


    Well, you can!


    A while back I was wondering, what if you were a penetration tester that had physical
    access to a system, would it be possible to get passwords off of a locked Desktop?
    You know, a user is using the system and dutifully locks his workstation before
    leaving for lunch.


    If you have physical access to the system, this can be done.


    First you need to be able to enable the system level command prompt from the login
    screen. Discussed above, the "*Utilman Login Bypass*" trick enables a pop-up system
    level prompt by just pressing the "Windows" and "u" key on the keyboard.


    Now all we need is a USB drive with Mimikatz installed. This can be downloaded
    from Gentle'
