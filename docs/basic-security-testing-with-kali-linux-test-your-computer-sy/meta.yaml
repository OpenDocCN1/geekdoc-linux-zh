  md: '# Chapter 25 – Wireless Network Attacks


    # Resources


    +   - [Wireless Adapters for Kali Discussion:](http://forums.kali.org/showthread.php?4327-Best-possible-wireless-adapter-for-Kali-linux-%28PCIE-amp-USB%29)


    # Introduction


    Wireless networks and Wi-Fi devices have saturated both the home front and business
    arena. The threats against Wi-Fi networks have been known for years, and though
    some effort has been made to lock down wireless networks, some are still wide
    open or not secured very well.


    In this chapter we will talk about wireless security and a few common Wi-Fi security
    misconceptions. We will look at a couple popular tools used to test security.
    We will also cover several techniques that an Ethical Hacker could use to check
    the security of their wireless network.


    Unfortunately, sometimes wireless networks can be modified to deceive users, so
    we will also cover how a penetration tester (or unfortunately, hackers) could
    set up a fake Access Point (AP) using a simple wireless card and redirect network
    users, capture authentication credentials and possibly gain full remote access
    to a client.


    In the final part of this section we will look at two menu driven programs that
    can be used that make Wi-Fi testing very easy.


    # Wireless Security Protocols


    Though the news is getting out and Wireless manufacturers are configuring better
    security as the default for their equipment, there are still a large amount of
    wireless networks that are woefully under secured.


    One of the biggest things in securing your Wireless network is the Wireless Security
    Protocol. You have *"None"*, which basically means that you are leaving the door
    wide open for anyone to access your network. *"WEP"* which has been cracked a
    long time ago and basically means that you locked the door, but left the key under
    the front mat with a big sign saying, "The key is under the Mat". *"WPA"* which
    is much better, and *"WPA2"* is the latest and recommended security setting for
    your network.


    The following chart (Figure 1) was created from data from my local city.'
  merge: -1
  pgno: 191
- img_proc: false
  md: '![](bbox=[0.18, 0.0, 0.96, 0.34])


    As you can see, 13% of detected Wireless networks had no security set at all,
    and 29% more were not much better using WEP. Interestingly enough a whopping 46%
    were using WPA2, which was actually kind of surprising. But in many cases, it
    seemed from the beacons captured that the AP was capable of WPA2, but clients
    were using the lower WPA.


    WPA/WPA2 can still be cracked, so set a long complex passkey for them.


    Next, let''s take a hands-on look at some common wireless security misconceptions.


    # Getting Started


    You will need a Wireless card capable of entering monitoring mode. Many Wi-Fi
    adapters are capable of doing this, but some are not. If you are planning on purchasing
    one, do a little research first to determine if your Wi-Fi adapter will work in
    monitoring mode and with Kali.


    I use a TP-Link TL-WN722n USB Wi-Fi adapter that works great with Kali.


    # Viewing Wireless Networks with Airmon-NG


    The Aircrack-NG tools are some of the most commonly used command line programs
    in Wi-Fi security testing. And many of the graphical Wi-Fi security testing programs
    actually use the Aircrack-NG tools in the background.


    Let''s start out by using Airmon-NG to view available wireless networks'
  merge: -1
  pgno: 192
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 0.615, 0.339])


    You can see in the image above that a monitoring interface is created called "mon0".
    The other Aircrack-ng utilities will use this new interface.


    You may also see a notice here about processes that could cause trouble. This
    can be ignored.


    Now we will run the Airodump-ng program that will list all the Wi-Fi networks
    in range of your wireless card.


    +   3. Simply type, "**airodump-ng mon0**"


    The Airodump-ng program will start and you will see a list of all available wireless
    access points (APs) and also a list of clients that are attached.


    ![](bbox=[0.013, 0.662, 0.789, 0.823])


    (You can hit *CNTRL-C* at any time to exit back to the terminal prompt.)


    Airodump-ng lists several pieces of information that are of interest. The first
    is the MAC address of the AP device. Next is the Power level, the channel number
    that the AP is operating on, the number of packets sent and the encryption and
    authentication types.


    Lastly, the AP name is listed.


    From the figure above, you can see that both AP''s are using "WPA2", which is
    the recommended encryption type. If the type was "WEP" or "OPN" (open) then there
    would be some big security concerns. WEP was cracked a long time ago, and Open
    means that there is no security set at all on the AP and anyone can connect to
    it.


    As shown, there are no clients connected to any of the Access Points. If a client
    did connect, we would see the MAC address of both the client and the AP they connected
    to listed under the BSSID'
  merge: -1
  pgno: 193
- img_proc: false
  md: 'STATION section. Thus you can see one of the inherent security flaws of Wi-Fi.
    Filtering clients by MAC address is not a very effective security strategy as
    it is trivial to view which clients are connected to which AP''s by their physical
    address.


    All an attacker would have to do is view which addresses have connected and then
    spoof (see the "*macchanger*" command later in this chapter) the address to bypass
    MAC filtering!


    # Viewing Wi-Fi Packets and Hidden APs in Wireshark


    One other common Wi-Fi security misconception is that changing your Wireless Access
    Point to use a "Hidden" SSID will increase the security of your network. Well,
    it doesn''t, and we will see why in this section.


    Okay, we have seen how to view which APs are available, now let''s see how we
    can capture wireless packets and analyze them in the ever popular protocol analyzer
    Wireshark.


    Simply place your Wi-Fi card in monitor mode like we did in the previous example,
    and then run Wireshark. Placing the card in monitor mode will allow us to see
    wireless management traffic like AP Beacons and Probes:


    ```

    root@Kali:~# airmon-ng start wlan0

    root@Kali:~# wireshark &

    ```


    *(When you start airmon-ng, you may receive a message that running processes could
    cause trouble, these may be ignored. The "&" used after the Wireshark command
    tells Kali to run Wireshark, but give you the command prompt back.)*


    Wireshark will open, now all you need to do is:


    +   1. Select "***mono***" from the interface list

    2. Click, "***Start***".


    ![](bbox=[0.018, 0.638, 0.422, 0.918])


    Wireshark will now begin to use the wireless card and begin to capture network
    control packets from'
  merge: -1
  pgno: 194
- img_proc: false
  md: "the air and you should instantly see a list of all the Wi-Fi Beacon traffic.\n\
    \nFor example:\n\n```\n    1   0.000000    Beacon frame, SN=3269, FN=0,   SSID=Broadcast\n\
    \    2   0.028565    Beacon frame, SN=3318, FN=0,   SSID=Terminator\n```\n\nHere\
    \ you can see a capture from two separate APs. The second one is called *\"Terminator\"\
    *, but the first one is different. The SSID is \"Broadcast\", which tells us that\
    \ the name for this AP is hidden. This is an ineffective technique used to secure\
    \ wireless networks, and I will show you why.\n\nIf a client attempts to connect\
    \ to this hidden AP, we automatically capture the SSID name in a \"Probe Request\"\
    . Checking the packet capture for \"Probe Requests\" we will actually see the\
    \ unhidden SSID as seen below:\n\n```\n   93   6.623480    Probe Request, SN=0,\
    \ FN=0,   SSID=HiddenWiFi\n   99   7.122094    Probe Response, SN=843, FN=0  \
    \  SSID= *HiddenWiFi*\n```\n\nThe AP name that did not show up in the Beacon frames\
    \ becomes revealed to us as soon as a client attempts to connect!\n\nThe client\
    \ lists the hidden AP name in the probe request, in this case *\"HiddenWiFi\"\
    *. And the AP echoes its hidden name back to the client in the Probe Response.\n\
    \nTo stop the Wireshark capture, just use the *\"Stop Capture\"* button on the\
    \ menu. You can then search, filter or save the results.\n\n# Turning a Wireless\
    \ Card into an Access Point\n\nOne of the interesting features of wireless cards\
    \ is that they can also act as an Access Point. This feature is of great interest\
    \ to penetration testers, but unfortunately also to malicious users. You can create\
    \ an AP using any SSID that you want. If you name your created AP the same as\
    \ an existing one, the client cannot tell the difference and will connect to the\
    \ nearest one, or the one with the strongest signal.\n\nOnce your card is in monitoring\
    \ mode *(airmon-ng start wlan0)*, you can turn it into an AP using the Airbase-ng\
    \ command:\n\n```\n            root@Kali:~# **airbase-ng -e \"EvilAP\" -c 6 mon0**\n\
    ```\n\nThis command creates an AP with the name \"EvilAP\", on channel 6 using\
    \ the mon0 interface.\n\n![](bbox=[0.0, 0.94, 0.65, 1.0])\n\nThis AP should now\
    \ show up on any nearby Wi-Fi clients:"
