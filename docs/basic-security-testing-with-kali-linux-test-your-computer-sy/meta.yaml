- img_proc: false
  md: '![](bbox=[0.0, 0.0, 0.997, 0.291])


    **CLEAREV** – This useful little command will attempt to clear the logs on the
    remote computer.


    We may want to erase our tracks and clear the system logs on the target machine.
    If we look at the logs on the Windows 7 system side, we can see that it is full
    of events:


    ![](bbox=[0.015, 0.402, 0.873, 0.61])


    Some of those events may include things that we did. So we can clear the logs
    remotely from the Kali system by typing, "*clearev*":


    ```

    meterpreter > clearev

    [*] Wiping 1587 records from Application...

    [*] Wiping 5140 records from System...

    [*] Wiping 4151 records from Security...

    ```


    The Application, System and Security logs are wiped. If we look at the security
    log again it just shows one record, "Log Clear":


    ![](bbox=[0.007, 0.84, 0.859, 0.932])


    Now obviously this will stick out like a sore thumb to anyone analyzing the logs.
    But if there are events you want removed, you can clear the log.'
  merge: -1
