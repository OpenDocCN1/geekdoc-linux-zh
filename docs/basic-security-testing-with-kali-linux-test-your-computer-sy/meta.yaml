- img_proc: false
  md: '![](bbox=[0.014, 0.012, 0.846, 0.218])


    If you look at our user Ralf, you will see his password in plain text!


    On this system we get pretty much the same results by using the "**wdigest**"
    command:


    ![](bbox=[0.011, 0.324, 0.844, 0.531])


    Though I didn''t use Windows 8 in this example, you also have the "**livessp**"
    command. As Benjamin explained to me one day, many Win8 systems tag a MS Live
    e-mail account to their login credentials. With Mimikatz you can get both their
    login password and their e-mail password with one command.


    Though beyond the scope of this book, you can also use "*mimikatz-command*" to
    do more advanced functions, including recovering certificates.


    # Conclusion


    In this section we showed how to recover plain text passwords from a remote system.
    We did so using the Metasploit Framework''s Meterpreter and the Mimikatz command.


    As you can see trusting in using complex passwords alone as a security measure
    is not always fool proof. If an attacker is able to get access to your system,
    they could possibly obtain your password in plain text.'
