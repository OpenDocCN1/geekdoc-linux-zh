  md: '# # Chapter 22 - Wordlists


    # ## Introduction


    Wordlists are very important when trying to crack passwords, as cracking programs
    can take a text file filled with passwords, also known as a wordlist or dictionary
    file, and use it to crack passwords.


    Most cracking programs can use the password file directly as they exist, while
    more advanced ones can use the password file (or multiple files) and manipulate
    them to create many new combinations of passwords to try.


    For example, some can take all the passwords in the wordlist and attach letters
    or numbers to the beginning or end of the word.


    Some programs will take two or more password files and combine the words from
    both to make a new list of words to try.


    And finally some crackers have rule sets that modify how they work. Some rulesets
    will change all upper case characters to lowercase, or vice versa. Others can
    completely modify the word and use the new word. As mentioned before, a Leet (133t)
    Speak rule set would take a word from the password file and convert it to "leet
    speak", replacing common letters with numbers.


    Using a wordlist can make password cracking must easier and faster.


    Many pentesters will make their own password list using company data, employee
    names, phone numbers, e-mail addresses, etc.


    But where can we find wordlists?


    # ## Wordlists Included with Kali


    Kali comes with several that you can use, the problem is just finding them. Most
    are in the directory of the main program that uses them.


    *(On the latest release of Kali, shortcut links to the other wordlists are stored
    in the "/usr/share/wordlists" directory)*


    # ## ROCKYOU Wordlist


    The most popular one would probably be the RockYou wordlist. This is a huge collection
    of millions of passwords that were actually used and pulled from a database dump.


    The file is located in the ***/usr/share/wordlists/*** directory as seen below:


    ![](bbox=[0.018, 0.038, 0.397, 0.114])


    If you notice, the password list is zipped, so we need to unzip it before using
    it:'
  merge: -1
  pgno: 174
- img_proc: false
  md: '```

    root@Kali:/usr/share/wordlists# gunzip rockyou.txt.gz

    root@Kali:/usr/share/wordlists# ls

    rockyou.txt

    root@Kali:/usr/share/wordlists#

    ```


    # JOHN THE RIPPER Wordlist


    The ever-popular password cracker John the Ripper comes with a somewhat smallish
    password list, but it does include many of the most popular passwords used on
    the web.


    The file is located in the */usr/share/John/* directory as seen below:


    ```

    root@kali:/usr/share/john# ls password.lst

    password.lst

    root@kali:/usr/share/john#

    ```


    # WFUZZ Multiple Wordlists


    Wfuzz is a website brute force attack tool. Though all the wordlists may not be
    helpful, some are interesting, especially the ones in the "*general*" directory.


    The files are located in the */usr/share/wfuzz/wordlist* directory as seen below:


    ```

    root@kali:/usr/share/wfuzz/wordlist# ls

    fuzzdb  general  Injections  others  stress  vulns  webservices

    root@kali:/usr/share/wfuzz/wordlist#

    ```


    # OTHER Wordlists


    As I mentioned earlier, there are several other programs with wordlists in the
    */usr/share/* directory. Though the RockYou one again is probably one of the best,
    if you want additional ones, just poke around the /usr/share/ directory and see
    what you can find.


    # Wordlist Generator


    Several tools in Kali let you make your own personalized wordlists. CeWL is pretty
    neat as it lets you create passwords by grabbing information from a target website.
    Crunch is nice too as it allows you to create your own custom wordlists from scratch.


    In this section we will take a look at using Crunch.


    # Crunch'
  merge: -1
  pgno: 175
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 0.62, 0.35])


    But basically all we need to tell crunch is the minimum and maximum length and
    what type of characters to use.


    Crunch also makes heavy use of the charset.lst file that is located in its install
    directory */etc/share/crunch*. So you will need to either run crunch from that
    directory or point to the directory with the –f switch when using the more advanced
    character sets (shown below).


    Alright, let''s start with an easy one.


    For example:


    ```

    root@Kali:~# crunch 1 3 –o ThreeLetters.txt

