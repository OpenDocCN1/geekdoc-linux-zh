    in the body text area.


    # Filter Commands


    Let''s take a closer look at the filer commands.


    > (To use these commands or to get more than one page of results, you need to
    sign up for a free Shodan Account).


    # CITY and COUNTRY Command


    The City and Country commands allow you to narrow down the geographic location
    of your searches.


    ```

