  md: "# Lesson 4: Loops\n\nA loop is a way of repeating something in your program.\
    \ It can be really useful when you want to do something many times — for example,\
    \ run the same code for every value in a list.\n\n# The for loop\n\nThe most common\
    \ type of loop in Python is called a for loop. With a for loop, you can run through\
    \ every item in a list, one at a time. Here's an example:\n\n```\nfor item in\
    \ list_of_items:\n    print(item)\n```\n\nThis code tells Python: \"for each item\
    \ in the list, print it\". The variable item can be named anything you like, but\
    \ it must follow the rules for naming a variable. The indented line is run once\
    \ for each item in the list.\n\nIn the example below, we have a list of names.\
    \ We want to print Hello to each name in the list. Here's the code that does this:\n\
    \n```\nnames = [\"Sarah\", \"Tim\", \"Sam\"]\nfor name in names:\n    print(\"\
    Hello \" + name)\n```\n\nOutput:\n\n```\nHello Sarah\nHello Tim\nHello Sam\n```\n\
    \nNotice how name in the code becomes each of the three names from the list, in\
    \ order, and runs the print line for each one."
  merge: -1
