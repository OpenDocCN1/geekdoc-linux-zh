  md: "+   1. Open a Terminal Window:\n\n![](bbox=[0.044, 0.071, 0.338, 0.156])\n\n\
    +   2. Type, \"*apt-get update*\" and hit \"*enter*\":\n\n```\nroot@kali:~# apt-get\
    \ update\nGet:1 http://http.kali.org kali InRelease [22.0 kB]\nGet:2 http://security.kali.org\
    \ kali/updates InRelease [11.8 kB]\nGet:3 http://http.kali.org kali/main Sources\
    \ [7,535 kB]\nIgn http://http.kali.org kali/contrib Translation-en_US\nIgn http://http.kali.org\
    \ kali/contrib Translation-en\nIgn http://http.kali.org kali/main Translation-en_US\n\
    Ign http://http.kali.org kali/main Translation-en\nIgn http://http.kali.org kali/non-free\
    \ Translation-en_US\nIgn http://http.kali.org kali/non-free Translation-en\n```\n\
    \n+   3. And then, \"*apt-get dist-upgrade*\":\n\n```\nroot@kali:~# apt-get dist-upgrade\n\
    Reading package lists... Done\nBuilding dependency tree\nReading state information...\
    \ Done\nCalculating upgrade... Done\nThe following packages will be REMOVED:\n\
    \  console-tools icedtea-7-jre-cacao libopenvas5\n```\n\n(Type, \"y\" and enter\
    \ when prompted that additional disk space will be needed.)\n\nThis can take quite\
    \ a while, so this might be a good time for a break, you deserve it!\n\n+   4.\
    \ When done, reboot.\n\n> **Tech Note:**\n\nThere are additional source repositories\
    \ that you can manually add to Kali if you want.\n\nFor example if you want the\
    \ absolute latest and greatest, you can add the \"*Bleeding Edge*\" repositories\
    \ to Kali. But these do come with the warning that they are not manually maintained\
