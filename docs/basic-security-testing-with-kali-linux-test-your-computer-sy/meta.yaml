    ![](bbox=[0.0, 0.142, 0.86, 0.575])


    # ## Conclusion


    In this section we learned that computers do not store passwords in plain text
    in the system''s security database. The password is encrypted in some way and
    the resulting encrypted hash is recorded.


    We also learned that the Windows LM hash is not very secure and can be cracked
    very easily by using a simple lookup table or "Rainbow table" as it is sometimes
    called.


    If the LM hash cannot be found in one of the online databases, then a cracking
    program is needed.


    You can turn off LM hashing, but security researchers have found that many networked
    systems and programs still use them (even when turned off!) for backward compatibility.'
