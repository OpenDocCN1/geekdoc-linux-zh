  md: '# # Chapter 13 – Social Engineering


    # ## Resources


    +   - http://www.social-engineer.org/


    # ## Introduction


    Social Engineering is the art of manipulating people to falsely gain their trust
    in order to get information, access or data from them. Social Engineering is,
    in effect, hacking humans.


    Hackers who are experts in Social Engineering will trick you into helping them
    or giving them access to your secured systems or areas by pretending to be someone
    else, someone in need, or even someone in a position of authority.


    Let''s look at some examples:


    +   - You are coming into work at your secure data center. As you approach the
    door, a deliveryman with his arms full of boxes is also arriving at the door.
    What do you do? Without thinking twice, most would open the door for the poor
    overburdened man and let him in. What if he wasn''t a real deliveryman and just
    wanted access to your secure data center? You just let him in.


    +   - You are in your cubicle and are approached by a person wearing a shirt and
    tie, carrying a clip board and toolbox. He says that he is performing system upgrades
    and needs access to your system. It''s close to lunch time so it sounds like you
    are going to get an extended lunch. You ask if you should shut it down, and he
    responds that he just needs to check a few things first. You get up and head for
    the cafeteria. And just gave him access to your system.


    +   - You are the CEO of a major company. One day you get a package in the mail
    from a company that you just signed a major deal with. It was the largest deal
    of your career and was in all the local city newspapers and on all the TV stations.
    You open it up to find one of the latest tablets along with a thank you note from
    the company thanking you for the business agreement. It has all the bells and
    whistles and you can''t wait to connect it to your executive Wi-Fi network to
    try it out, which you do. The company never sent you a tablet and you just gave
    an enterprising social engineer a system connected to your Executive network.


    They may take advantage of local customs, etiquettes, play off of human sympathy
    or just try to intimidate an employee to get what they want. They may do none
    of these direct contact things and'
  merge: -1
  pgno: 121
- img_proc: false
  md: 'simply go through your corporate garbage receptacles, scour for clues of your
    internal systems by reading job postings or even online tech forums that you use.


    Or they could hit social media sites pretending to be from a company that you
    do business with or pretending to be a head hunter employment agency looking for
    new talent.


    These are just a few examples of how a social engineer might try to gain access
    to or procure information about a target network. There really is no limit to
    the ways that a talented social engineer might try to twist, deceive or threaten
    their way onto your network.


    # ## Social Engineering Defense


    With that being said, it is imperative to train your employees to be on the lookout
    for these types of attacks. Have policies in place to deal with service calls,
    software updates, and gifts from outside companies.


    You can teach, instruct and even leave reminder messages and posters, but employees
    may still not follow corporate policy. That is why when it comes to social engineering
    attacks, it is a good idea to manually test to see if your company is truly prepared.


    In this section we will look at a couple programs in Kali that corporate security
    teams can use to test their company''s preparedness against these types of attacks.'
  merge: -1
  pgno: 122
- img_proc: false
  md: '# Chapter 14 – The Social Engineering Toolkit


    # INTRODUCTION


    Social engineering attacks are one of the top techniques used against networks
    today. Why spend days, weeks or even months trying to penetrate layers of network
    security when you can just trick a user into running a file that allows you full
    access to their machine and bypasses anti-virus, firewalls and many intrusion
    detection systems?


    This is most commonly used in phishing attacks today, craft an e-mail, or create
    a fake website that tricks users into running a malicious file that creates a
    backdoor into their system. But as a security expert, how could you test this
    against your network? Would such an attack work, and how could you defend against
    it?


    Kali includes one of the most popular social engineering attack toolkits available,
    David Kennedy''s Social Engineering Toolkit (SET). David''s team is very active
    on SET, there are always new features and attacks being added. More recently several
    non-social engineering tools have been also added to SET making it a very robust
    attack tool.


    In this chapter we will take a look at some of the tools included with SET and
    two of the attack options, both PowerShell based attacks.


    # Staring SET


    To start SET from the Kali main menu:


    ***Kali Linux*** *> Exploitation Tools >* ***Social Engineering Toolkit***


    Or type "***se-toolkit***" or "***setoolkit***" (depending on your Kali version)
    in a terminal prompt.


    # Mass Emailer


    One way a Social Engineer will attack a network is to send out a flood of e-mails
    to company addresses and see who will respond or run the malicious attachment
    you sent with it.


    SET comes with a Mass Emailer tool.


    +   1. From the main menu select, "***Social-Engineering Attacks***".

    2. Next select option 5, "***Mass Mailer Attack***":'
  merge: -1
  pgno: 123
- img_proc: false
  md: '![](bbox=[0.0, 0.0, 1.0, 0.21])


    You then have a choice to send a single e-mail or multiple. For this example,
    let''s just send one.


    +   3. Pick option 1, "***E-Mail Attack Single Email Address***".


    +   4. Enter a target e-mail address:


    ```

    set:phishing> Send email to:MrCEO@SomeRandomDomain.com

