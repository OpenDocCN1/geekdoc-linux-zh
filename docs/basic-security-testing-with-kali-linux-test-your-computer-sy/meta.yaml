  md: 'That''s it! We keep the *Utilman.old* file in case we want to switch it back
    and restore normal Utilman functionality.


    +   7. Now just shutdown Kali and let the Windows system boot up normally.

    8. At the login screen press the "***Windows***" and "***u***" key together. And
    up pops a system level command prompt!


    ![](bbox=[0.009, 0.289, 0.712, 0.602])


    If you type "***whoami***" you will see that you are in fact the user "*nt authority\\system*",
    the highest level access that is available. Notice the login icons are still in
    the background.


    From here you can do anything you want, you have complete access.


    This works in all versions of Microsoft Windows OS''s from Windows 9x on up. It
    also works in their Server products. Here is a login screen for Server 2012 R2
    Datacenter. Notice the "*Press Control-Alt-Delete to sign in*" message, and notice
