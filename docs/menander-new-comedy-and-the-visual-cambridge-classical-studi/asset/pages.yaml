  md: '# A few good men


    to allay embarrassment. In the end, it is the polis that expands to humour Amphilus,
    not Amphilus who fits himself into the polis.

    amphilus tells the story of a perfection that is so genuinely complete that almost
    inevitably it is at variance with the imperfections of social structure. Terry
    McGarry (1978) have given one of the most sensitive accounts of Amphilus’ character.
    McGarry’s most salient point is that the father-son conflict in the Andria derives
    from the fact that the participants have common rather than conflicting interests.
    Simo raised Amphilus on the ideal of libertas as responsibility, which entails
    ‘the taking of an honourable wife and becoming a father’. In no way does Amphilus
    behave contrary to this ideal in the play, only the upshots of the youth’s steadfastness
    are stunning. The irony with Amphilus, I submit, is that he becomes subversive
    of the norm precisely by being reluctant to compromise, even in the face of communication,
    for whom he is the quintessence of liberius vivere, therefore the core of his
    being: fides and pudor. Amphilus threatens to commit a virtual moral coup d’état
    because his sense of duty is greater than his ‘realism’. By declining to accept
    the polis in its practical, cynical exclusivity in a narrow, hence imperfect,
    Amphilus jeopardises what he refuses to adulterate. Amphilus is the perfect product
    of a perfect upbrining; only he has to fit in a narrow, imperfect, societal cast.
    What happens when the polis is not as ‘perfect’ as the ‘perfect’ characters the
    polis has produced? This is one more of those ‘erased’ questions in New Comedy:
    the irony with Amphilus is that in the context of patriarchal ideology his undulated
    ‘perfection’ becomes almost synonymous with transgression.


