  md: '# Conclusion


    ironically signified moral accomplishment in its own right, is beyond definitive,
    ‘archaeological’ proof. Still, as was this book’s main tenet, *opsis*, with its
    tightening grip on theatrical and other audiences from the end of the fifth century
    onwards, and its new-found ability to converse allusively and on a minute level
    with artistic, literary and other cultural paradigms, which was the result of
    an overall cultural awakening to the intricacies of spectacle, of parallel developments
    in the plastic arts, and of a significant degree of hybridisation that transfused
    much of the tragic code into New Comedy, is integral to characterisation, theme
    and ideology in Menandrian plays. Therefore, to try even provision-ally to re-establish
    the mask and ‘intervisual’ semiotics at the core of New Comedy performance analysis
    is of exceptional value for understanding the theatrical essence of Menander.
    Appreciation of the subtle allivity of *opsis* and especially the novel kind of
    theatrical mask at Menander’s disposal can go a long way to ascertaining the ideological
    depth as well as the shrewd artistry that lies behind the unassuming exterior
    of Menander’s bourgeois world.'
