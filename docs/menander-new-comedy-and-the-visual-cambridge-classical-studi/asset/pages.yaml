    all three of them pose a severe threat to the civic system that fosters them by
    virtue of, precisely, ‘perfect’ products of that; they expose cracks in the very
    foundation of patriarchy by keeping closely and intractably to the principles
    that underpin it. Charisios throws the comic universe into maelstrom, because
    his perfection, which he measures against the shortcomings of his truly blameless
    vice, proves to have been partial to his own terrible faults. It has also been
    indicative, as David Konstan (1995) and Susan Lane (2004) have shown best of all,
    at an awkward moral double standard at the core of polis ideology. The two Pamphili,
    also even the Pamphilus, whom modern scholars love to hate, become problematic,
    because each in his own way clings obstinately to the very values and qualities
    that would otherwise ensure their rightful place in the society of men. If indeed
