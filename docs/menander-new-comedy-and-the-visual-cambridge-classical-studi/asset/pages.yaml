    be’, *Dysk.* 745). This is in fact the Cynic version of autarky, emblemised by
    the Cynic Diogenes,¹ and before by Socrates and Anti-henes.² It originated in
    the ideal of an ascetic life of meditation. *Autarkia* for Diogenes meant contentment
    with the bare necessities of life (food, shelter and clothing of the meanest sort).
    The misanthropic traits of Knemon overlap with Diogenes the Dog’s traditional
    image, as to the casual observer: he lives on the bare essentials (he seems to
    have only one bucket and only one mattock), being poor by choice; he leads a dog’s
    life by reducing himself to tasks unthinkable for an Athenian citizen, such as
    cleaning his house-of dung (*Dysk.* 584–6) or recovering a house untilil from
    a well (*Dysk.* 626–8); he is the wild and ferocious, snapping rudely at people
    and hurling diatribes against their ills and depravities, especially over their
    lust for possessions and gain (*Dysk.* 719–20). Like Diogenes, he specifically
    opposes traditional religious prac-ices, if not religion at large (*Dysk.* 442–55).


