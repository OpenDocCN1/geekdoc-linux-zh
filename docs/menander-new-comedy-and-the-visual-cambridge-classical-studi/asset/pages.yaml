    something of a paradox in the New Comedy system of youth as a rule are childish
    and imperfect individuals along the path of civic accomplishment, which they conquer
    only at the end of the play, an achievement sealed by the ritual of *eggyē*. This
    marks the transition of the youth from his former carefree status of shielded
