  md: '# Menander’s New Comedy between reality and textuality


    (in this case, the fortuitous re-appearance of a lost sibling), is a process ultimately
    designed to feel comically (or not so comically) unreal.


    Scholars want to find logical or other ‘flaws’ in such dramatic devices as Daos’
    plan in the *Aspis*, and implicitly to hold that supposed imperfection against
    Menander. Stanley Ireland (2010: 98), for example, writes (ad Asp. 348–55):


    Commentators have pointed out the flaw in [Daos’ plan] – the fact that Chair-estratos
    cannot remain dead for ever, and he resurrects there may be nothing to prevent
    Smikrines from reverting to his former plan (*Ireland 1992*: 349–50).


    This is a clear, but ultimately misguided, analysis. Comic time, for one, is condensed
    and cannot be stretched beyond the boundaries it sets for itself: there is no
    ‘for ever’ in comedy, only ‘for long as it takes’. Moreignantly, the improbability
    of Daos’ plan in ‘realistic’ terms is an inalienable part of this *coup de théâtre*.
    In other words, the theatrical effect of this type of Menandrian resolution depends
    on a noticeable and perpetual state of deferral, of non-concurrence and non-identification,
    dividing the ‘actual’ and the ‘comic’ worlds. Here we begin to feel that vestige
    of discomfort we claimed to be the quintessence of Menander’s play with reality.


    ***


    Let us delve into another example. The *Epritontes* is a very different play to
    the Aspis, but one yet pivotal on a ‘magical’ rescue no less. The problem is here
    yet another Smikrines, one bent on exercising his paternal right of *aphairesis*,
    that is, to dissolve his daughter’s marriage, which he considers detrimental to
    his best interests.³⁰ He is obviously wrong in moral terms (and in terms of what
    the audience already knows but he and his daughter do not), but again totally
    within his rights legally and politically speaking. The rescue here is achieved,
    on top of all the incidental anagnorismnoi (‘recognitions’), by an event different
    in kind, still but no less extraordinary: the daughter’s brash claim to self-determination,
    her demand to be allowed to decide her own


