    Physiognomics is, therefore, a powerful conceptual apparatus, both a natural instinct
    and a deliberate, ideologically laced practice. Applying the methods of physiognomics,
    the Greeks weighed their fellow humans: the likes of Thersites, the ugliest and
    (sc. hence!) the most insolent ever to set foot on Troy (Homer, II. 2.216); a
    woman intended to become one’s wife (Simonides, *Against Women*); or a hateful
