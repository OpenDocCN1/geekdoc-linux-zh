    ***


    In the fourth century, and increasingly from on, the theatre was not good to think
    about; it was good to think with. However, as a result of the theatrical’s newfound
    ‘celebrity’, theoretical reflection on theatre also exposed a number of rifts
    and tensions, which rendered it a philosophical battlefield. theatricality52 gradually
    found itself to be the point of contention in a philosophical tug-of-war: (a)
    reality and conscious illusion or suspension of disbelief (Gorgias, the sophist);
    (b) reality and representation (Plato); or (c) representation verbal and enacted
    (Aristotle). Theorisation, that was, a tense process, which added density to the
    theatrical experience, but also marked the beginning of a long anti-theatrical
    bias, which centred on the growing importance of spectacle and the spectacular.53


    Aristotle is particularly emblematic of this pendulum, which swung between a grudging
    acknowledgement of the new reality and a call for control. Theatre was assumed
    to be sliding towards a forming of pernicious psychagōgia (the word means literally:
    ‘carrying away the soul’) by way of opsis, the visual dimension of performance.
