  md: '# INTRODUCTION


    At first sight, New Comedy performances are liable to appear conventional and
    uni-dimensional. They can look like plain and rather shallow romantic fables,
    along the lines of a ‘boy-meets-girl’ scenario, deprived of the political engagement
    and laugh-out-loud quality of Old Comedy. Performatively speaking also, New Comedy
    could be regarded as a tame show, with common urban stage settings, uncaptivating
    realistic costumes and little stage hullabaloo; that is, a theatrical performance
    without the linguistic, visual and musical flamboyant of earlier comic tradition,
    or the spectacle of contemporary, fourth-century tragedy, which made imaginative
    use of lavish dress, impressive masks, stage machinery, rhetorical pyrotechnics
    and other means to set up an engrossing event. In effect to the eyes of many scholars
    today, New Comedy seems like a dened genre, whose sole interest lay in the sensitive
    depiction of social reality and human nature.


    In fact, it is the impression, not the genre, that is skin-deep. The common motive
    of the five chapters that constitute this book is that New Comedy has a far richer
    and more sophisticated performance texture than transpires the script. A fuller
    appreciation of New Comedy can be achieved if one moves towards a pragmatic approach
    to performance analysis, which repositions theatre semantics ‘in the communicative
    process’, that is, in the productive and receptive context of the real-time event
    that is the theatre,


    > For a sophisticated theoretical approach to theatre semotics from a pragmatic
    point of view, see de Marinis (1993). De Marinis singles out three areas of focus:
    (a) the relationship of the text to its sources, which engages the dynamics of
    enunciation and communicative intentionality; (b) the question of the text’s relationship
    to other texts, where the issues of context and intertextual practices are brought
    into play; and (c) the relationship of the text to its receiver, which includes
    the act of reading and interpretation’ (emphasis in original) (p. 3).


    I'
