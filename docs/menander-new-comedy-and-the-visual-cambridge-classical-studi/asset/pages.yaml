  md: '# Menander, New Comedy and the Visual


    the comic and the tragic – in fact, that they constitute a singular product of
    generic hybridisation – Menander’s realistic-looking stories incorporate, apart
    from the romantic and the ideological, an inalienable thread, mythical stratum.
    To a larger or lesser extent, Menander’s plots ‘urbanise’ (put into an urban context)
    narrative patterns drawn from tragic myth; in other words, they are not so mirrors
    of life, as mirrors of stories. As a set of narrative and performative precedents,
    tragedy for Menander is not an extraneous theatrical mode to be deconstructed,
    debunked or antagonised (although traditional comic reactions to tragedy are not
    entirely lacking), but is an inherent mode, a constituent of New Comic theatrical
    medium, deeply ingrained in the genome of Menander’s hybrid world. Menander’s
    spectators – often his characters, too – are constantly aware of the fact that
    the scenario runs on the tracks of tragic example, which can either be followed
    or derailed, but still are always absolutely critical for completing the semantic
    space of the scene. The romantic kernel Menander’s plot reflects the anxieties,
    and the failings, of civic ideology, also, in a triple over-determination, which
    enhances the humour and the consistency of the narrative, ‘urbanises’ and ‘secularises’
    material known from legend – in a manner that continues and apparently improves
    upon a practice already established by large in the period of Middle Comedy.


    ***


    New Comedy, in a nutshell, from far being a cardboard reflection of contemporary
    vita privata, constitutes an elaborate theatrical construct, which problematises
    the values of polis culture, all the while looking towards the Hellenistic poetics
    of allusion. Just as importantly, as Chapter 2 exposes, performative density in
    New Comedy is achieved, in a manner unparalleled in fifth-century comic or tragic
    theatre, to the increased sensitivity of theatrical and extratheatrical audiences,
    from the fourth century BC and increasingly onwards, to the minutiae of visual
    representation and to what could be called the politics of the gaze. The fourth
    century saw a virtual revolution in matters of theatre performance, as theatre
    was internationalised (exported to the four corners of the Greek world and performed
    in an ever-increasing number of local festivals); generalised (theatre practitioners'
