  md: '# Menander, New Comedy and the Visual


    render the visual aspect of New Comedy performance, especially of its two most
    foregrounded signs, space and the mask, a potential marker of allusion to literary
    or cultural systems of reference. Chapter 2 deals briefly with the referential
    capacity of space, as promoted by the extensive confluence of New Comedy with
    the spatial practices of tragedy, now even more discernible in the permanent stage
    *skēnē* (stage-building) of the Theatre of Lyurgus, which creates fresh alluring
    possibilities.


    However, it is a prime contention of this book that if the visual element in New
    Comedy is indeed laden with the potential to evoke intertexts, the mask is protagonistic
    in this respect. Chapters 3, 4 and 5 delve specifically into the mask and its
    critical intervalual input in New Comedy performance. The mask, it is argued,
    whose semantic gravity is greatly augmented in comparison with the fifth century,
    should always be acknowledged in the analysis of New Comedy performance, albeit
    not without cosmological causation.


    ***


    Chapter 3 examines the role of the mask in constructing characters on stage, defending
    the significance of Physiognomics against doubts expressed, most stridently by
    Joe Park Poe, and attempting to re-situate the perception of the mask and its
    theatrical function within a Greek frame of analysis, namely, Aristotelian ethics
    and the critical notions of *ēthos* (proclivity towards virtue or vice), *praxis*
    (action) and *prohhairesis* (the process of moral choice). Chapters 3–5 focus
    mostly on masks of young men. This is not a random choice. The so-called ‘New
    Style’ series of New Comedy masks, which surfaced around the time of Menander
    as shown by the archaeological record, break with Middle Comedy tradition not
    only thanks to their more delicate physical features and their stylistic kinship
    with contemporary plastic arts, but also because they emphasise the genre of young
    boys and girls at the expense of fathers, slaves and courtesans. This was no accident.
    New Comedy reinvented the social mechanics of marriage and the civic processes
    that generate citizens — in the double sense of perpetuating the body politic
    through legitimate procreation and of seeing an adolescent through a rite of passage


