    # Conclusion: what is then ‘new’ in New Comedy performance?


    This chapter has pointed to a number of significant shifts in the performance
    of New Comedy. First of all, New Comedy tones down the extrovert, grotesque spectacularity
    of Old Comedy; it does not make use of the apparently sensational visual effects
    of contemporary tragedy, either. However, it creates a spectacle where the visual
    is densely semiotised, brimful of all potential. Furthermore, I argued, the interlocking
    processes of standardisation, hybridisation and semiotisation created a new, loaded
    sense of theatrical space and a novel kind of mask paired with earlier comedy.
    The visual thus plays a central role, too, in the referentiality of the genre
    – with respect mainly to tragedy, but not tragedy alone. In an era of growing
    alertness to the minutiae of appearances and their symbolic cache, New Comedy
    exploits the potential of spectacle to ‘call in’, just as effectively as verbal
    signs, systems of theatrical and extratheatrical reference. If Menander’s performance
    is intertextual, it is ‘intervisual’ as well.'
