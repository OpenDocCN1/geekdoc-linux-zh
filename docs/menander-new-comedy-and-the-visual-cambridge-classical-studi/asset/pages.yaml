  md: '# Conclusion


    # Conclusion


    In this chapter I have tried to describe a type of comic theatre, which to the
    ancients at least still looked like a photographic document of its day and times,
    but still produces an image of society that constitutes an elaborate ideological
    construct; a genre that, while not losing touch with its social and historical
    environment, still very much springs from the (inter)textuality. Menander creates
    a theatrical universe, where the plot is stratified in three interlocking layers:
    (a a ''realistic'' ''urban'' boy-meets-girl scenario, simple, stereotypical, circumscribed
    and rather narrow);¹³⁸ (b a much wider ideological level, in which this mundane
    scenario resonates with the stakes of the civic value system, and where social
    reality expands into a magical new existence of inclusion and harmony, marking
    this process all along with distinct self-consciousness, even a pinch of subversive
    irony; and, finally, (c) a third, even broader archetypal level, which projects
    the urban story to the level of tragic myth. Menander’s C. S. Peirce, ‘ionic’
    representations of ‘real’ characters, as well as to mythical and, indeed, theatrical
    archetypes lurking in the background and informing their actions, humorously or
    in more serious tones. Even behind the most mundane comic situations in Menander
    one can find ideological depth. One can also recognise tragic intertexts (often
    complete memories of past performances, not just mythical narratives), which create
    perspective, but also a sense of self-reflexive derivativeness and referentiality
    that ironically undercuts and unhinges the ‘realism’ of it all. Aristophanes of
    Byzantium perhaps would be closer to the mark if he had written: ᾧ Μένάνδρε καί
    βεί | | πότερος ἄρ’ ὑμῶν πότερον οὐκ ἔμευσατο.


    ¹³⁸ C. Lowe (2000): ‘New Comedy is, quite simple, the most rule-bound and programmed
    of all classical narrative genres. Its stories inhabit one of the newest universes
    created in fiction, pursuing the economy to a ruthless that is hard parallel in
    any later literature of comparable stature and ambition ... What New Comedy does
    is propose a universe that is overwhelmingly systemic: a world in which individual
    relationships are apprehended as part of a collective process governed by precise
    and inviolate rules of play.’


