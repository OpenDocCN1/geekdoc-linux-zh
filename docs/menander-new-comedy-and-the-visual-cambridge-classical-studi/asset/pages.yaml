    making a choice, not eliminated or shown to be illusory''.69 Moral coherence,
    the seal of phronēsis, is the end-product of prohairesis, which produces a harmonising
    restructuring of the agent''s moral activity both vertically (harmonising his
    present with his future choices) and horizontally (harmonising one goal with another).70


    ***


    The moral process in the man who has achieved eudaimonia is straightforward, linear
    sequence from ethos (disposition towards virtuous deeds) to moral choice and finally
    to action (the exercise of proper choice). This linearity, however, is problematic
    in moral agents lacking deliberative maturity, in young men, or in a state of
    moral decline, in old men.


    In a defining peculiarity, the New Comedy mask system opens up a significant age
    gap between fathers and sons. While sons are usually very young adults, fathers
    are not in their prime (which they could have been, even if they were supposed
    to have married relatively late in life), ‘old men’ (gerontes or pappoi), is the
    threshold of psychological maturity, according to Aristotle).71 This is a marked
    departure from tragedy and from earlier Comedy, both Old and Middle, which had
    the ‘mature man’ type, the akmazon. Possible mundane motivations for this (for
    the fact, that in the New Comedy fathers, indeed, become ‘grandfathers’ very often)
    can be discarded. The need to portray fathers and sons as symmetrical mirror images
    of each other must have been the main rationale behind the convention.


    David Wills attempted to break down this convention with reference to the tetradic
    structure of hot/cold and wet/dry, as well as Aristotle’s classificatory grid
    of age


