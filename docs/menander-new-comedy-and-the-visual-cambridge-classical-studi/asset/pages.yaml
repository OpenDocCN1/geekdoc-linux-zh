  md: '# ACKNOWLEDGEMENTS


    The seed of this book derives from my 2005 PhD dissertation titled ‘Faces of Allusion:
    Intertextuality and the Mask of New Comedy’ (Trinity College, Cambridge), supervised
    by Professor Richard Hunter (Trinity College, Cambridge), and examined by Professor
    Pat Easterling (Newham College, Cambridge) and Dr Angus Bowie (Queens College,
    Oxford). Some material from that dissertation survives in Chapters 3–5 of this
    book in a heavily revised form; essentially, though, this is a new piece of work,
    which redirects and expands the initial idea. Material from the book chapter titled
    ‘New Performance’, published originally in Petrides and Papaioannou (2010, 79–124),
    is reused in Chapters 1 and 2 with the kind consent of Cambridge Scholars Publishing.
    For the benefit of non-classicist readers, I have translated all Greek and Latin
    quotations.


    Being in the making, this book has incurred many debts. First and foremost, it
    has benefited enormously from the wisdom and constant encouragement of five dedicated
    teachers. Professors Colin Austin, Marco Fantuzzi, Richard Hunter, David Konst
