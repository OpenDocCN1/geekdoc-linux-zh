  md: '# MENANDER, NEW COMEDY AND THE VISUAL


    This book argues that New Comedy has a far richer performance texture than has
    previously been recognised. Offering close readings of all the major plays of
    Menander, it shows how intertextuality – the sustained dialogue of New Comedy
    performance with the diverse ideological, philosophical, literary and theatrical
    discourses of contemporary polis culture – is crucial in creating semantic depth
    and, thus, offsetting the impression that the plots are simplistic stories with
    no political or ideological resonances. It also explores how the visual aspect
    of the plays (opsis) is just as important, and just as full of allusive potential,
    as any verbal means of signification – a phenomenon termed ‘intertextuality’ –
    examining in particular depth the ways in which the mask can infuse various systems
    of reference into the play. Masks like the *panchrêstos neaniskos* (the ‘all-perfect
    youth’), for example, are now full of meaning; thus, with their ideologically
    marked physiognomies, they can be strong instigators of literary and cultural
    allusion.


    ANTONIS K. PETRIDES is Assistant Professor of Classics at the Open University
    of Cyprus.'
