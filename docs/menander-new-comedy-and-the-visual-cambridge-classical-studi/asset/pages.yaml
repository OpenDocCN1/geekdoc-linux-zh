  md: '# Menander’s New Comedy between reality and textuality


    civic law. Be that as it may, though, it cannot be stressed strongly enough that
    the regular blocking features in many a play are precisely such laws as Pericles’
    or other similar structures, for instance, the notorious epiklerate (the law that
    forced a woman whose kyrios had died to marry her next of kin). Indeed, to put
    it generally, the happy resolution in Menander is blocked by social prejudices,
    double standards and various mechanisms of exclusion that are intrinsic, not extraneous,
    to democracy. Even Men’s soldiers, a category in which Lape invests meaning, are
    for the most part estranged citizens, not mercenaries of unambiguously extraction;
    that is, they constitute another case of civic ideology threatening to make things
    go awry, not a case of foreign powers impinging upon the democratic process of
    reproduction. Athenian civic law may be upheld in the end, but in a paradox characteristic
    of Menander’s comedy, it is in many a play initially at odds with the forces of
    nature. Menander’s expanded reality as theatrical discourse is more intricate,
    as a straightforward pro-democratic (or indeed pro-Macedonian) declaration. It
    may not look so much outwards to antagonistic or more desirable forms of socio-political
    government, as inwards, making a statement about the slippage between real and
    fictional worlds. This of, course, does not render it less ‘political’; quite
    the contrary: it invests it with cutting introspective resonance.


    ***


    The Aspis is an interesting play to discuss in this respect, even so because in
    this play the solution is not given by aligning love with the epiklerate in any
