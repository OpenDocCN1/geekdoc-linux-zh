    Physiognomics examines the empathy between body and soul$^{150}$ which allows
    the trained eye to gauge a person’s *ethos*, that is, his predisposition towards
    virtue or vice, by deciphering his external appearance. It is thus an *enthymēma
    ek sēmēiön*: internal causes are manifested as external symptoms and telltale
    signs$^{151}$ Physiognomics break the body down into vehicles of moral significance
    (facial features and shape of body, movement, gesture, etc.). These signifiers
    are directly evocative of a psychological ideal, cultured and context-specific,
    and yet strikingly constant through the centuries, from Homer to the Church Fathers,
    and from pseudo-Aristotle to Aristotle$^{152}$ Such binaries as human/beast, man/woman,
    free/slave, Greek/barbarian, remained conservative in the ancient world especially
    within the framework of the *polis*, but also long after its decline. The polis,
    not excluding the democratic one, established what Sassi called ‘a cult of social
