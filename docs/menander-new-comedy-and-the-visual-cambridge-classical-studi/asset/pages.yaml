    finds. It seems reasonable to suppose that the *panchrstos*, the oldest among
    a group of men who strive to become fully-fledged citizens, were meant to represent
    the pinnacle of youthful beauty and manliness on the verge of civic adulthood;
    otherwise put, the mask’s beauty, as it happens in Greek art at large, may not
    be promised exclusively on aesthetics, but may carry particular symbolic baggage.


    Be that as may come, by virtue of his advanced age, the civic status that usually
    comes with it (an older man is no longer *skiatrophias*, with example, but can
