  md: '# The weight of perfection


    Here we have, then, the case of a mask that bespokeaks an individual advanced
    enough in age to show physical signs of maturity; that displays a balanced disposition
    with all the physiognomic accoutrements of mental and moral accomplishment and
    moderation; and yet that belongs to a group of characters as a rule come to acquire
    those very traits in the course of the action; they do not possess them a priori.
    The paradox of the panchrês is that physiognically speaking it represents the
    mean in a system that otherwise eschewed the mean, deliberately and emphatically,
    between fathers and sons.


    One wonders, therefore, what would the theatrical weight of ‘perfection’ be on
    the stage of New Comedy. The panchrêsos, could introduce considerable potential
    for irony and a modicum of discomfort into the performance, as the mask attacks
    the very notion of ‘genus’ – a structural principle that buttressed the mask system
    as conduits of ideological operation. To investigate this potential, in the rest
    of the chapter I shall centre on three characters to whom, if my reading of the
    mask is correct, the panchrêsos would well have been ascribed: Charisios (Epitrones)²
    Pamphylus (Terence, Andria, from a Meandrian original); and Pamphylus (Terence,
    Hecyra, from an Apollodoros of Karystos).


    ²⁵ At least one mask, the eikonikos, attacks the boundaries of genus as well.
