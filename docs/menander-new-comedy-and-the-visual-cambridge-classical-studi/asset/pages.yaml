  md: '# 5

    A FEW GOOD MEN: THE PANCHRÊSTOS MASK

    AND THE POLITICS OF PERFECTION


    This concluding chapter is a case study that brings together some of the most
    fundamental claims of this book. First and foremost, that in response to parallel
    developments in the wider cultural milieu of the fourth century bc, *opsis* in
    New Comedy is densely semiotised and potentially allusive, capable of calling
    in various systems of reference, theatrical, cultural and ideological even on
    the micro-level of a physiognomized ‘face’ – a phenomenon that I have termed ‘intervisuality’.
    The semiotised components of *opsis*, primarily the mask, make the texture of
    Menander’s plays more dense by providing necessary depth, perspective, and even
    ideological tension, to a cleverly varied, but inescapably formulaic, kind of
    plot and to a lively drawn but circumscribed stripe of character. New Comedy plays
    needs to be read in mind this potent collaboration between *logos* and *opsis*,
    which implies the traditions of the theatrical stage (both the comic and the tragic)
    as well as the discourses of the democratic polis. In other words, is sine qua
    non to acknowledge the mask’s (and generally, the visual element’s) allusive semiosis
    in New Comedy performance, for all the uncertainties involved in the process,
    if one is to gauge the multilayer, subtle richness of New Comedy as a genre and
    begin to understand the full theatrical experience of Menander’s spectators. This
    chapter will try to exemplify what we stand to gain through the combined study
    of one mask, the paradoxical *panchrêstos neaniskos*, and three characters: Charisos
    (Epitrepontes), Pamphilus (Terence’s *Hecyra*) and Pamphilus (Terence’s *Andria*).


