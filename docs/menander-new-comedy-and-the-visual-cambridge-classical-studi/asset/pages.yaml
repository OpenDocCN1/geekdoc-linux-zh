    # Masks and difference


    Modern analysis of mask systems, including the system of New Comedy, has been
    fundamentally influenced by French structural-ism, and especially by Lévy-Strauss’
    seminal enquiries on north-west Indian masks.¹10 Lévy-Strauss’ major insight has
    been that masks belonging to ritual or, indeed, theatrical systems can only be
    studied as interdependent signs of a langue, which produce meaning by way of difference.¹11
    Various individual traits of masks, Lévy-Strauss found, which are incomprehensible,
    or even meaning-less, in isolation, make sense if contrasted to antithetical traits
    of other, similar masks. A mask does not function in vacuo, … ‘supposes real or
    potential masks always by its side … A mask is not primarily what it represents
    but what it transforms.¹12 As David Wiles put it:


    Spectators can only perceive meaning through perceiving contrasts or opposites.
    They can contrast striking features against a negative, intermediate or idealised
    face [sc or a physiognomic standard, as the ‘feminine’ or the ‘masculine''], and
    they can register more subtle features when these features are inverted in or
    otherwise similar mask.¹13


    ¹10 Lévy-Strauss (1982). ¹11 Cf. Saussure (1916: 166ff.).

    ¹12 Levi-Strauss (1982: 144), quoted by Wiles (1991: 72). ¹13 Wiles (1991: 89).


