    As I suggested earlier, there is another major way in which Menander’s ''realism''
    is compromised, or at least significantly qualified: the fact that his plots are
    systematically the mirrors of stories: mythical archetypes, as well as, predominantly,
    of tragic narrative structures, and in some cases even of specific tragic performances
    and plots. In Chapter 2, delving deeper into the historical process that made
    New Comedy what we can call a hybrid genre, we will see that much of this dynamic
    polysemy is played out visually just much as verbally. Our purpose in this section
    is primarily to show how Menander’s performances oscillate between reality and
    textuality, just as easily as they can blend reality with ideological fantasy.


