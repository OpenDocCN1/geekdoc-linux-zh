  md: '# Introduction


    demonstrate how Menander departs from realism in both senses of this ambiguous
    word. Menander, it is argued, anchors his stories in a recognisable milieu (most
    commonly, Athens of the day), only to leave it far behind, and vocally so, in
    the ending of the play, where the real problems plaguing the characters find fortuitous,
    ‘magical’ solutions. With a sleight of hand, Menander’s denouements resolve intractable
    conflicts and effect unmanageable marital unions, enlarging the narrow confines
    of social reality into a more inclusive, but ultimately fictional, comic universe.
    On the face of it, Tyche, acting as the veritable agent of civic ideology, intervenes
    and transforms historical reality into a place of betterment, cohesion and democratic
    unity. The crux of the matter, is, that this transformation is not disguised as
    being anything other than ‘comic’, and its artificiality is hardly kept unseen.
    The overall realism the fact that the play begins from a realistic point of departure,
    and the way it resolves its plot by abandoning verisimilitude so palpably in the
    end, invites an inescapable comparison between historical reality and its fictional
    analogue in Menander’s denouements, which invests the latter with a disquieteting,
    bittersweet aftertaste. The profound, strongly accentuated distance between reality
    and fiction creates a pregnant sense of comic reality in the denouements of Menander,
    which, contrary to appearances, is not far removed from Aristophanes. Anything
    but an unsophisticated mirror of life, Menander oscillates craftily with realistic
    representation and fictional making. The space opened up as the pendulum swings
    between the two extremes is loaded with subtle humour and ideological gravity.


    Therefore, counter-intuitively perceives, the poetics of fictionality and world-making
    is most essential for fathoming Menander’s ‘realistic’ drama. The whiff of an
    intricate theatrical art lurking behind an unfussy exterior is heightened even
    further, as Menander’s plots provide to radiate from theatrical memory as they
    emulate ‘real life’. Menander’s fictional universe, the second part of Chapter
    1 submits, exploits its realistic facade also in order to call attention to the
    textuality and the theatricality that underpins it. Subtle literary and theatrical
    artifice, with ample awareness that they operate at the crossroads of two traditions,'
