  md: '# Introduction


    were now celebrated specialised technit, who soon enough would become unionised
    to boot); and theorised (reflected upon both in theoretical writings and during
    the act of making theatre on stage). Not only was theatre good to think about
    in the fourth century; it was also, time went by, to think and act with: theatrical
    percolated into an increasing spectrum of public functions, not least in Ecclesia
    and the courts. The immersion of Greek society from the fourth century onwards
    into a wide array of attentively orchestrated public spectacles – in other words,
    the constitution of a culture of viewing and of spectators – awakened the average
    individual to the potent capacity of the visual to create meaning even on the
    micro-level of the human face.


    New Comedy performance carries this cultural baggage. By the time of Menander
    the ‘science’ of Physiognomics, that is, the art of scrutinising the external
    signs of the body, especially the features of the face, in order to gain insight
    into the interior of the soul – specifically, to determine a person’s proclivity
    for virtue or vice (which the ancients called ethos) – is already pervasive. Clearly,
    Physiognomics was far from ideologically innocent: it was encoded and enforced
    the patriarchal system of the polis upon the body of the citizen. Of course, any
    ideological endeavour, Physiognomics, too, was fraught with the anxiety and the
    inherent instability dogging any syllogism ἐ σηίων (rhetorical deductions based
    on external signs). This instability, I maintain, renders it even more useful
    as a theatrical code, specifically as an intertextual – actually, intervisual
    – stratum on a novel kind of theatrical mask.


    Three processes, which again unfolded in the course of the fourth century, determined
    the internal development of the comic genre: the aforementioned hybridisation
    (the creation of a hybrid with tragedy through the absorption of elements from
    tragedy not only on the level of diction and plot, but also on the level of opsis,
    especially in the arrangement of space and the system of masks);isation (the constitution
    of a limited and concerted system of signs); and semiotisation (to use the terminology
    of C. S. Pierce, the transformation of formerly ‘iconic’ theatrical signs, for
    instance, the features of the mask, into ‘indexes’ of disposition by way of Physiognomics).
    Hybridisation, stabilisation and semiotisation'
