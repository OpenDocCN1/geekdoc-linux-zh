  md: '# Menander, New Comedy and the Visual


    taking into account the dynamics of contextuality, intertextuality and audience
    reception.


    Intertextuality – the sustained dialogue of New Comedy performance with a diverse
    range of ideological, philosophical, literary and theatrical discourses of the
    democratic polis – plays a most crucial role, I argue, in creating semantic depth
    and perspective on stage, and in checking the reductive impression of Menander
    as a mere ‘mirror of life’. It is explored initially in Chapter 1, which lays
    the theoretical foundations, chiefly as regards New Comedy’s dialogue with the
    ‘general text’ of polis culture, as with tragic myth and performance. In its ‘intervisual’
    facet it dominates the chapters that follow.


    For it is a fundamental tenet of this book that the role of the visual in bringing
    forth the referentiality, the density, of Menander’s performance is paramount,
    just important as any verbal means of signification, and without an exact, identifiable
    fifth-century precedent. New Comedy performances, it is argued, are stratified
    and thickened in two major ways: first, by way of a triple layering of the plot
    on the verbal/narrative level through a synergy of realistic, ideological and
    archetypal strata; and, then, by the new-fangled capacity of opsis, the visual
    aspect of performance, dynamically to infuse various systems of reference into
    the performance – a phenomenon for which I reserve the term intertextuality. New
    Comedy displays a dense stratigraphy of semantic layers (textual and intertextual,
    visual and ‘intervisual’, realistic and ideological), which coalesce and cooperate
    in a composite and erudite mixture, more hellenistic.


    Chapter 1 attempts to locate the stamp of Menander’s theatrical craft between
    realistic mimesis and ideology, between fictionality and (inter)textuality. It
    examines how the limited scope of the romantic love story is expanded, as it resonates
    with the values of patriarchal civic ideology. It also examines how the realistic
    façade of Menander’s theatrical narratives is problematised, as it measures itself
    continuously, and in various lengths, against mythical archetypes, which as a
    rule had already been the subject matter of tragedy.


    The first part of the chapter discusses Menander’s notorious ‘realism’, combining
    ideology with ‘possible-worlds’ theory to'
