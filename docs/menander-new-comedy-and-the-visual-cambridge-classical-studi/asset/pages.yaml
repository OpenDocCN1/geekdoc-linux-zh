    The accomplishment evoked by these words of Simo is political as much as moral.
    The supposed blamelessness of these young men derives from the belief that they
    have internalised the code of conduct pertinent to their status, a homosocial
    set of values, which demands civilised and egalitarian conduct between peers,
    as well as keeping the appropriate distances from any outsiders to the group (And.
    62–6). In a nutshell, by others or by themselves these three characters are thought
    to have adopted fully the system of norms and expectations associated with the
    notion of the adult male citizen.


