  md: '# Introduction


    that makes of him a mature adult. It is only natural that the ‘couple in trouble’
    and their idealised masks, which, it must be noted, bear close iconographic associations
    with the respective masks of tragic youths, are foregrounded.


    To underscore further the importance of the youth as a citizen in statu formandi,
    New Comedy does away with a tripartite Middle Comedy division distinguishing the
    masks of free men into masks of ‘young’, ‘younger’ and ‘old’ men, opting to open
    a large gap of age and status between juvenile ‘sons’ (neaniski) and declining
    ‘grandfathers’ (pappoi). This innovation is momentous, not least because, according
    to the Aristotelian ethics that obviously inform the comedy of Menander, these
    are the two categories of moral agent in whom the prerogatives of adulthood are
    lacking or in a state of degeneration. The New Comedy mask of the youth, the chapter
    argues, is ideally suited – one could say ever purposefully designed – suggest
    an individual that is not inherently vicious, but is certainly prone to counter-proairetic
    choices due to akrasia, one''s inability to rein in one''s carnal impulses through
    the exercise of logical control. Thus, the purpose of Chapter 3 is to clarify
    why and how exactly the physiognomic make-up of the mask is a principal semantic
    layer of New Comedy opteis. Physiognomics cannot, and should not, be dismissed
    with nonchalance in performance analysis; however, it should be used in accordance
    with the proper nature and principles of contemporary (fourth-century BC) praxis.


    ***

    Chapter 4 continues to explore the mechanisms of producing theatrical meaning
    by the visual means of the mask (prosōpon), investigating the dialectic or ‘interfacial’
    dimension of the mask. Through the example of the professional soldier interacting
    with his valet, the chapter qualifies a fundamental datum of structuralist research
    into masks, namely, that they are not isolated but dialect signs. Masks define
    and transform each other''s signification as they face off syntagmatically on
    stage, all while forming a continuum with other signs (proxemic, kinesic, visual,
