    comedy, however, there is not one single, dominant, ‘comic’ style imposing itself
    upon others by way of ridicule, argues Platter. Instead, there is:


    a sheer diversity of material . . . No style, without the authority voice of the
    parabasis, is able to establish itself as an authority beyond impeachment. Linguistic
    elements are progressively undermined by incongruous and incompatible systems
    expressed elsewhere. Now are not reducible to a simple hierarchy within which
    real and fantastic, oligarchic and democratic, old-fashioned and newfangled elements
    be sorted out to reveal the essential attitudes of Aristophanic comedy and to
    separate from those that are epiphenomenal, is, presented for the sake of laughter
    but with serious purpose. Such divisions are spurious, as is the implicit claim
    that there are elements of comedy not for the sake of laughter and with only a
    serious purpose. Instead, the juxtaposition of incompatible elements forces audiences
    to choose from a broad range of interpretive possibilities. (Platter 2007: 30–1)


    It is just important, therefore, to realise that Menandrian practice did not appear
    out of the blue as it is to establish that Menander’s engagement with tragedy,
    sharply dissimilar to the Aristophanic norm, goes much beyond parody, generic
    antagonism, stylistics or emotional special effects. As shown by the case of Epitentrees
    and Euripides’ Alope, tragic textuality in Menander can extend beyond the scope
    of a transitory reference or the comic adjustment of a single tragic scene, to
    cases where a whole plot or a major character walks on the tracks of tragic paradigms
    (and is mercifully derailed off them in the nick of time). This is a crucial point.
    If in my burlesques of Middle Comedy mythological characters could be behave like
    ordinary Athenians¹¹³ in Menander, versa, ordinary Athenians could be made to
    behave like mythological characters. More often than they are made to be expressly
    conscious of their precedents, as in the case of the two fathers in Act IV of
    Samia. In other cases, the audience is privy to this duality at the expense of
    the characters themselves.


