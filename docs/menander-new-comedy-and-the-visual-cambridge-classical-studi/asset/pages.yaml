  md: '# The Soldier between ‘high’ and ‘low’


    The ‘mythological exemplum’ is one illustration of system referencer. In the case
    of the soldier, the point of the mythological exemplum is exactly the bathos caused
    by the distance, or the ‘delay’, between the version of choice in the text and
    the variants in the paradigm.


    This is the sort of mythological demotion at play, for instance, in Terence’s
    *Eunuchus*. Thraso, compelled to conjure a shameful defeat, still attempts to
    uphold himself as Hercules; his reference, though, to Hercules’ *servitum amoris*
    on Omphale (Eun. 1025–8), far from restoring his dignity, only serves to remind
    spectators of the heroic aspects of Hercule myth that Thraso has inevitably relinquished
    (in fact, to which he was never entitled). Another comical form of system reference
    is when a particular variant proposes and annuls itself at the same time: such
    annulment ensues, to reuse a previous example, in Plautus’ *Miles*, where Artotrogus
    equates Pyrpolinicos not to Achilles, but to the non-existent ‘brother of Achilles’
    (Plaut. *Mil. Gl.* 58–65).


    However, in my view, the most interesting variation of system reference in relation
    to the soldier is when the mythological exemplum invokes not only the narrative
    content of a particular variant, but also, more importantly, the literary ethos
    and cultural status of the narrative that constitutes it.⁸² Mythological variants
    travel through a curated hierarchy of literary (and other) genres, invoking each
    time the character as well the prestige of the text that verbalises them. Debunking
    the mythological exempla often involves displacing them from a ‘high’ to a ‘low’
    genre. The most sustained play with intertextual shifts is found in the *Miles
    Gloriosus*. Specifically, Pyrpolinicos claims a niche in the ‘high’ of heroic
    epic, only to be forced down to the ‘low’ of ‘romantic’ tragedy, the mime and
    epic parody.


    When Pyrpolinicos is reported to boast that his irresistible masculinity surpasses
    that of Paris himself (see *Alexandri praestare quaequam*, *Mil. Gl.* 787), a
    web of stories


