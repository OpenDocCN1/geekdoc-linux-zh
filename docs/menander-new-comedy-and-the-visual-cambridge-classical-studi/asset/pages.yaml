  md: '# Of mice and (young) men


    Here, as everywhere, one cannot overstate the importance of intertextuality, the
    web of other texts (and performances) that the spectators carry with them into
    the theatre – especially since a character who ‘makes claims’, such as the soldier,
    is nothing not densely textualised. The soldier trades in words to such a degree
    that his existence is practically deferred to the sphere of storytelling. A Miles
    is all about a corpus of narratives in deconstruction and debunking. Often, we
    saw, these explicitly extravagant, clearly fictitious stories are told either
    by the soldier himself or by characters in his entourage, primarily the cacula:
    this is a play rendering the textuality of the character transparent and self-conscious.
    A mechanism of anticlimax, then, is set in motion the level of dramatic discourse,
    too, to produce, intertextually, the same effect of deflation that physiognomics
    produces semotically. The combination of the two speaks to the density and the
    multiple layers of the New Comedy performance text, a fundamental tenor of this
    book.


    The soldier transfers onto himself a trajectory of ‘high’ narratives in a conscious
    act of appropriation; cf. Ter. Eun. 399–401 (Gnatho to Thraso);


    > labore alieno magnum gloriam

    versbis saepe in transmot qui habet salem;

    quoi test.


    A man who has his wits knows how to use words to appropriate the glory that other
    people have won with great labour. This is an ability to possess.


    On the level of discourse, the soldier’s claim is debunked by the constant relegation
    of the narrative level from ‘high’ to ‘low’,⁷⁹ which, once more, produces an inious
    displacement. Often, the form of intertextual play with the soldier is what intertextual
    theory terms ‘system reference’⁸⁰ that is, a ‘set of native variants’, where reference
    to a particular version cannot suppress others; on the contrary, it evokes them.⁸¹


    ⁷⁹ For the high/low axis in the ‘ideology of Hellenistic performance’, see Hunter
    (2002).

    ⁸⁰ Compare the discussion on Demeas and Menander’s Samia in Chapter 1.

    ⁸¹ Edmunds (2001: 147).


