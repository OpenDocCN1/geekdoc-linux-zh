    There are different options that could be used with the `wc` command:


    * `wc -m <file-name>` gives the number of characters in the file.

    * `wc -c <file-name>` displays the number of bytes in the file.

    * `wc -l <file-name>` gives the number of lines in the file.

    * `wc -L <file-name>` gives the length of the longest line in the file.

    * `wc -w <file-name>` displays the number of words in the file.


    ![](image_rsrc2P2.jpg)You can see the various options for the `wc` command using
    `wc --help` or `man help`.


    ## Manipulating Files: Printing the Contents of Files

    Let’s use `cat <file-name>` to inspect the contents of `myfile.txt` again.![](image_rsrc2P3.jpg)We
    can print the contents of multiple files by running different `cat` commands on
    the same line, separated by semicolon. For example, `cat <file1> ; cat <file2>`
    will print both the contents of `file1` and `file2`. We could use `cat file1 file2`
    to print the contents of `file1` and `file2`.![](image_rsrc2P4.jpg)`cat -n <file-name>`
    is used to display the line numbers alongside the lines.![](image_rsrc2P5.jpg)You
    could also run `cat --help` to see other options to be used with the `cat` command.
    `tac <file-name>` displays the contents of the file in a reversed manner, from
    bottom to top.![](image_rsrc2P6.jpg)`rev <file-name>` displays each line in a
    reversed manner from left to right.![](image_rsrc2P7.jpg)`more <file-name>` or
    `less <file-name>` can be used to display more or less text respectively. `head
    <file-name>` or `tail <file-name>` displays the head or tail of the text in the
    file respectively. You can also specify the number of lines to be displayed using
    the `-n` option. For example; `head -3 <file-name>` displays the first three lines
    of the specified file. By default, `head <file-name>` displays the first 10 lines
    of the file.![](image_rsrc2P8.jpg)


    ## Manipulating Files: Splitting Text in Files

    `split <file-name>` will split the text in a file into different files. By default,
    the file will be split into chunks of 1000 lines. We can use the `-n` option to
    specify how many lines each chunk should contain. The new files are automatically
    named; `xaa`, `xab`, etc.![](image_rsrc2P9.jpg)If you want the new file to be
    named `x00`, `x01` instead of `xaa`, `xab`, you could include the `-d -l` options
    to the `split` command.![](image_rsrc2PA.jpg)


    ## Obtaining Help on Commands

    `man <command>` is used to display a command’s manual page, while `<command> --help`
    is used to get help on any command.![](image_rsrc2PB.jpg)`apropos <keyword>` can
    be used to search all commands that contain the specified keyword.![](image_rsrc2PC.jpg)


    ## 5 Standard I/O Redirection and Piping

    In this chapter, we will learn about standard input redirection, standard output
    redirection, standard error redirection and how to chain multiple commands into
    a single command using piping.


    ### What is Standard I/O?

    Standard I/O refers to standard input and output. When you are working with the
    Linux terminal, the input is entered through the keyboard and the output is displayed
    on the terminal. That is, the standard input device is the keyboard while the
    standard output device is the terminal or simply the computer screen. The symbol
    for standard input and standard output is `stdin` and `stdout` respectively. There
    is also standard error represented as `stderr`. Remember that everything in the
    Linux system is a file, including regular files, directories or even devices (special
    files). So, the standard input, standard output and standard error devices are
    all files associated with file descriptor numbers 0, 1 and 2 respectively.


    Redirection is used to manipulate the input and output of commands. For example,
    instead of displaying the output on the terminal, the output can be redirected
    to a file. Through redirection, we can change the standard output and input devices.


    ### Standard Input Redirection

    Normally, commands in the Linux terminal take some input. If the input is a regular
    file, we can supply the contents of the file through input redirection using the
    `<` symbol. Let’s supply a Python file to the `cat` command using input redirection.![](image_rsrc2PD.jpg)In
    this example above, it may not be obvious why we should use `cat < myfile.py`
    instead of `cat myfile`. However, this example illustrates how input redirection
    works. We will examine more concrete examples below.


    Let''s now consider another example where a file is supplied to the `wc -l` command
    with and without redirection. You would notice that, without redirection, the
    number of lines and the name of the text file is displayed. Redirection passes
    the file contents to the `wc -l` command, so the name of the file is not displayed.![](image_rsrc2PE.jpg)


    We can use redirection to send an attached file to an email using the `mail` command.
    For example; `mail -s “Data Analysis File” [xyz@company.com] < analysis.py` will
    attach a file the `analysis.py` file to the `xyz@company.com]` email and the subject
    of the email will be “Data Analysis File”.


    ### Output Redirection

    We can redirect the output using the greater than sign (`>`). For example, instead
    of displaying the contents of a directory on the terminal, we can redirect the
    contents into a file using `ls -l > <file-name>`.![](image_rsrc2PF.jpg)Note that
    if the file to which the output is directed already exists, it will be overwritten.
    For example, let''s print or echo a string into `listing.txt`.![](image_rsrc2PG.jpg)If
    you don''t want to overwrite the existing file, that is, if you want to add or
    append contents to the existing file, you can use the `>>` sign instead of `>`.![](image_rsrc2PH.jpg)Note
    that we could use `1>` to explicitly specify that the type of redirection is output
    redirection compared to standard error redirection where `2>` is used.


    ### Standard Error Redirection

    When we run programs or commands, it is possible that an error message could be
    displayed as output. Instead of letting error messages clutter the output on the
    terminal, we can redirect the error messages to a file. This is a common practice
    among developers. Standard errors can be directed using `2>` (compared to `1>`
    used for directing standard output).![](image_rsrc2PK.jpg)We can also redirect
    error messages that are not useful to `/dev/null`. Anything that goes into `/dev/null`
    cannot be retrieved.![](image_rsrc2PM.jpg)Any output that goes into `/dev/pts/0`
    is displayed on the terminal because `/dev/pts/0` is basically the terminal.![](image_rsrc2PN.jpg)


    ### Piping

    Piping involves chaining a set of commands such that the output of the first command
    is passed as input into the second command. The pipe character or vertical bar
    (`|`) is used for piping. For example, we can list the contents of a directory,
    then count how many items are in that directory using the command `ls | wc -l`.![](image_rsrc2PP.jpg)Consider
    a file, `animals.txt` containing names of animals. Let’s use the `sort` and `uniq`
    command to display unique animal names in a sorted order. We will use piping to
    chain the `sort` and `uniq` commands. Note that the `uniq` command only works
    for sorted items so we need to first sort the items, then pass the sorted items
    into the `uniq` command.![](image_rsrc2PR.jpg)Other common examples of how piping
    is used include:


    * `cat <file-name> | grep <“keyword”>` : retrieves lines in a file having the
    specified keyword.

    * `cat <file-name> | tail -5`: displays the last five lines of text in a file.

