- fmt: "\n![](image_rsrc2MK.jpg)\n\n# Linux Fundamentals\nA Practical Guide for Data\
    \ Scientists, Machine Learning Engineers, and IT Professionals\nNeba Nfonsang\n\
    Copyright © 2021 Neba Nfonsang. All rights reserved.\n\n## DEDICATION\nI dedicate\
    \ this book to the Almighty God who gave me the inspiration, wisdom, strength,\
    \ and grace to complete this book. I also dedicate this book to my awesome wife\
    \ Ruka and my wonderful kids, Carol, Mark-Bright and Debbie.\n\n## CONTENTS\n\
    1. [ACKNOWLEDGMENTS]\n2. [Introduction to Linux]\n3. [Linux Directory Structure\
    \ and Basic Linux Commands]\n4. [Navigation]\n5. [Working with Files and Directories]\n\
    6. [Standard I/O Redirection and Piping]\n7. [Users and Group Management]\n8.\
    \ [Permissions Management]\n9. [Regular Expression]\n10. [Text Processing]\n11.\
    \ [Process Management]\n12. [Scheduling Jobs]\n13. [Other Useful Utilities]\n\
    14. [Customizing the Shell Environment]\n15. [Shell Scripting]\n16. [Deploying\
    \ a Machine Learning Model]\n17. [Connecting to a Remote Linux Instance]\n18.\
    \ [Resources]\n\n## ACKNOWLEDGMENTS\nI want to thank Dr. Nick Cutforth and Dr.\
    \ Bruce Harmon for being very supportive towards my academics and teaching career\
    \ at the University of Denver. I am grateful to work with faculty who give their\
    \ best to help students at the University of Denver. I also want to thank the\
    \ students at the University of Denver for the opportunity to expand my ideas\
    \ and teaching. I am convinced that the University of Denver is one of the best\
    \ Universities you can go for education or teaching.\n\n## 1 Introduction to Linux\n\
    This chapter provides the motivation for learning the fundamental concepts of\
    \ Linux. This chapter also briefly describes the structure of the Linux operating\
    \ system, Linux distributions, and the Linux system architecture. Other concepts\
    \ covered include types of shells, features of the Linux operating system, installation\
    \ of a `VirtualBox`, how to create a virtual machine and the installation of `Ubuntu`\
    \ on a virtual machine.\n\n### Why Linux?\nWith the rise of Artificial Intelligence,\
    \ Machine Learning Engineering, DevOps, and Cloud Computing, the demand for Linux\
    \ has increased. This is because most back-end jobs involving the deployment and\
    \ release of applications can be efficiently done in Linux. If you want to break\
    \ into the IT world or if you want to learn how to deploy software applications\
    \ or machine learning models, you definitely need to know how to use `Linux commands`.\n\
    \nYou will surely reap some benefits from learning how to use `Linux commands`.\
    \ Moreover, Linux is one of the most reliable and secure operating systems. The\
    \ Linux operating system powers local servers, remote servers, electronic devices,\
    \ embedded systems, mobile phones, smart watches, smart TVs and so on.\n\n###\
    \ Linux Operating System and Linux Distributions\nJust like Microsoft Windows\
    \ and macOS, Linux is an operating system. Compared to other operating systems,\
    \ Linux is open source. Generally, an operating system is a software that directly\
    \ manages a computer system’s hardware and resources such as the central processing\
    \ unit (`CPU`) and memory storage. An operating system connects software applications\
    \ and physical resources in your desktop or laptop computer. Therefore, an operating\
    \ system helps software applications to function, by managing the communication\
    \ between computer software and hardware.\n\nLinux has several versions (also\
    \ called distributions) to suit various users. Some popular Linux distributions\
    \ include `Ubuntu`, `Red Hat`, `Debian`, `CentOS`, `Fedora`, `Linux Mint`, etc.\n\
    \n### Linux System Architecture\nThe Linux system architecture basically consists\
    \ of the Linux kernel, system libraries, user applications and hardware, as shown\
    \ in the figure below.\n![](image_rsrc2MM.jpg)\n\nThe kernel and system libraries\
    \ are the key components of the Linux operating system. The kernel consists of\
    \ various modules and interacts directly with the underlying hardware such as\
    \ `CPU`, `RAM`, and `I/O`. That means, the kernel is used for the management of\
    \ system resources:\n\n*   `Device management`: all input and output devices are\
    \ managed by the kernel.\n*   `Memory management`: the kernel keeps track of used\
    \ and unused memory, implements virtual memory, allocates memory for user programs\
    \ and so on.\n*   `Process management`: the kernel assigns enough time for processes\
    \ and prioritizes processes.\n*   `Handling system calls`: a user application\
    \ can ask the kernel to perform certain tasks. Programs use `system calls` to\
    \ execute certain operations. `System libraries` are functions or programs used\
    \ to access the kernel’s features. `Standard libraries` are procedures for communicating\
    \ with the kernel. When applications place `system calls` for the kernel to perform\
    \ certain tasks, the `system calls` are usually not invoked directly but through\
    \ libraries.\n\nVarious applications are used to execute specific tasks inside\
    \ a Linux computer. The `shell` is a special application, a user interface used\
    \ to communicate with the kernel which in turn controls hardware components and\
    \ processes. Though a single computer generally has a single kernel, several shells\
    \ can run simultaneously on the operating system of the same machine.\n\n### Types\
    \ of Shells\nThere are different types of shells in Linux, including the:\n\n\
    *   `Bourne Again shell` (`bash`)\n*   `Bourne shell` (`sh`)\n*   `C shell` (`csh`)\n\
    *   `Korn shell` (`ksh`)\n*   `TC shell` (`tcsh`)\n\nNote that, it is possible\
    \ to have more than one type of shells installed on the Linux operating system.\n\
    \n### Features of the Linux Operating System\nSome key features of the Linux operating\
    \ system are as follows:\n\n*   `Multi-user`: Multiple users can use different\
    \ shells to access the same system resources such as memory, hard disk, application\
    \ programs at the same time.\n*   `Multi-tasking`: Multiple applications can run\
    \ on the Linus operating system at the same time.\n*   `Portable`: The Linux operating\
    \ system works in the same way across different platforms.\n*   `File system`:\
    \ Files and directories are arranged in a hierarchical manner and everything including\
    \ regular files, folders, memory, I/O, and devices are treated as files.\n*  \
    \ `Shell`: This is a command line interface in Linux that allows a user to enter\
    \ commands with a keyboard, to execute a program or accomplish a specific task.\n\
    *   `Security`: Linux provides security in three major ways, including:\n    *\
    \   `Authentication`: password protection is provided by assigning passwords and\
    \ login IDs to users.\n    *   `Authorization`: users are provided with the permissions\
    \ to read files, write on files or execute programs; hence users are restricted\
    \ on what they may or may not do on the computer.\n    *   `Encryption`: files\
    \ are converted into a format that is not readable.\n\n### Installation of Linux\
    \ OS\nLinux operating system can be installed on different machines including:\n\
    \n*   local computers,\n*   local virtual machines (`VirtualBox` or `VMware workstation`),\
    \ and\n*   remote machines in the cloud environment (`AWS` or `Azure`)\n"
