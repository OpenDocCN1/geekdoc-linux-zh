- fmt: "\n# if-statements\n\nAn `if-statement` has a single test condition. The statement\
    \ nested under the `if` condition is executed only when the test condition is\
    \ true. \n\n`if-statements` in shell scripts can generally be written as follow:\n\
    ![](image_rsrc2UY.jpg)\n\nBelow is an example of an `if-statement` in a shell\
    \ script. The script prompts a user to enter a number. The number is then referenced\
    \ with a variable called `NUM`. An `if-statement` is used to test whether the\
    \ value of the variable `NUM` is greater than 5. If the value of the variable\
    \ is greater than 5, a sentence is printed, “This number is greater than 5”.![](image_rsrc2UZ.jpg)\n\
    \nWe can execute the shell script as follows:\n![](image_rsrc2V0.jpg)\n\n## if-else\
    \ statements\n\nAn `if-else` statement has one test condition but there are two\
    \ options to be executed. If the test condition is true, the statement under the\
    \ `if` clause is executed. If the test condition is false, the statement under\
    \ the `else` clause will be executed.\n\nGenerally, an `if-else` statement in\
    \ Linux can be written as follows:\n![](image_rsrc2V1.jpg)\n\nBelow is an example\
    \ of an `if-else` statement. This script prompts a user to provide a name. When\
    \ the user enters the name, the name is assigned to a variable `NAME`. The `if-else`\
    \ statement is then used to check whether the name provided is “John”. If the\
    \ name is “John”, a statement is printed “Hi John”, otherwise, the user is notified\
    \ that the name is wrong.![](image_rsrc2V2.jpg)\n\nThis script can be executed\
    \ as follows:\n![](image_rsrc2V3.jpg)\n\n## if-elif-else statement\n\nWhen one\
    \ option needs to be executed among three or more options, an `if-elif-else` statement\
    \ can be used. We can include as many `elif` clauses in the statement as needed.\
    \ `if-elif-else` statements are generally written as follows:\n![](image_rsrc2V4.jpg)\n\
    \nBelow is an example of a script containing an `if-elif-else` statement. The\
    \ script collects a number from a user and checks whether the number is zero,\
    \ positive or negative.![](image_rsrc2V5.jpg)\n\nThis script can be executed as\
    \ follows:\n![](image_rsrc2V6.jpg)\n\n# Loops\n\nA loop is a statement used to\
    \ execute a repetitive task. There are two types of loops; a `for` loop and a\
    \ `while` loop. A `for` loop is used when we know the number of iterations or\
    \ how many times we need to execute a command or set of commands. Though a `while`\
    \ loop could be used with a counter in a situation where the number of iterations\
    \ is known, a `while` loop is more suitable when the number of iterations is not\
    \ known.\n\n## for loops\n\nThe header line of a `for` loop has the `for` keyword,\
    \ the loop variable, and the `in` keyword, then a list of items to be looped over.\
    \ The list of items could be numeric ranges, files, etc. After the header line\
    \ of the `for` loop, there is a `do` keyword, then, the command or commands that\
    \ need to be executed. The `for` loop ends with the keyword, `done`.\n\nThe following\
    \ examples illustrate how `for` loops in shell scripts are generally written.\n\
    \nfor loop with Numeric Ranges:\n![](image_rsrc2V7.jpg)\n\nfor loop with Files:\n\
    ![](image_rsrc2V8.jpg)\n\nExample of a Shell Script with a `for` loop\n![](image_rsrc2V9.jpg)\n\
    \nThe script can be executed as follows:\n![](image_rsrc2VA.jpg)\n\n## while loops\n\
    \nThe header line of a `while` loop consists of a `while` keyword followed by\
    \ a Boolean expression or test condition. After the header line, there is a `do`\
    \ keyword, followed by the commands that need to be executed iteratively.\n\n\
    Here is an example of a shell script with a `while` loop.![](image_rsrc2VB.jpg)\n\
    \nThis script can be executed as follows:\n![](image_rsrc2VC.jpg)\n\n# Functions\n\
    \nA function is a piece of code that facilitates code reuse. A function has a\
    \ header line, which consists of the function name, parentheses, and curly brackets.\
    \ Inside a function are statements or commands. Some functions may have a `return`\
    \ statement.\n\nHere is an example of a shell script with a function that greets.\n\
    ![](image_rsrc2VD.jpg)\n\nNote that a function is invoked or called inside the\
    \ script by writing the name of the function.\n\nThe function can be executed\
    \ as follows:\n![](image_rsrc2VE.jpg)\n\nHere is an example of a shell function\
    \ that computes area using arguments, length and width.\n![](image_rsrc2VF.jpg)\n\
    \nThe script can be executed as follows:\n![](image_rsrc2VG.jpg)\n\n# 15 Deploying\
    \ a Machine Learning Model\n\nIn this chapter, we will develop, evaluate, and\
    \ deploy a machine learning application as a web service using a Linux machine.\
    \ You will learn how to install all necessary packages, create a virtual environment,\
    \ build the machine learning model, and deploy it in a browser and make predictions\
    \ with the model through the browser. You will also see how to install and use\
    \ VS code in Linux.\n\n## Install Python\n\nThe machine learning model will be\
    \ constructed as a Flask application in Python. So, we first need to check whether\
    \ Python is installed on the computer. We can use the `python --version` command\
    \ to check whether Python is installed on the Linux system.![](image_rsrc2VH.jpg)\n\
    \nIf python is not installed, then we can run the `sudo apt-get install python3`\
    \ command to install Python 3.\n\n## Installing pip\n\nTo install packages needed\
    \ to build the application, we need to first install Python’s package manager,\
    \ `pip` which will help us to easily install other Python packages. To install\
    \ `pip`, you can use the two commands below:\n\n```\nsudo apt update\nsudo apt\
    \ install python3-pip\n```\n![](image_rsrc2VJ.jpg)\n\n## Create a Virtual Environment\n\
    \nFirst install the python module named `virtualenv`, which will then be used\
    \ to create the virtual environment. The following command can be used to install\
    \ `virtualenv`.\n```bash\nsudo pip3 install virtualenv\n```\n![](image_rsrc2VK.jpg)\n\
    \nCreate the virtual environment using `virtualenv` as follows. Let’s create a\
    \ virtual environment (directory) named `proj_env` inside the project directory.\
    \ We will first navigate to the project directory, then run the command:\n```bash\n\
    virtualenv proj_env\n```\n![](image_rsrc2VM.jpg)\n\n## Activate the Virtual Environment\n\
    \nTo activate the virtual environment, we can run the command, `source <path/to/virtual-environment-directory/bin/activate>`.\
    \ For example, if the virtual environment directory `proj_env` is inside the project\
    \ directory, we can run:\n```bash\nsource proj_env/bin/activate\n```\nThis command\
    \ runs the `activate` file inside the `bin` directory, which is inside the virtual\
    \ environment `proj_env`. Hence, the command activates the virtual environment.![](image_rsrc2VN.jpg)\
    \ A virtual environment helps us to separate or isolate Python packages or dependencies\
    \ for a specific project.\n\n## Installing Necessary Packages\n\nNow that the\
    \ virtual environment is activated, we can install the Python packages needed\
    \ for the project. To install several packages using a single command, we can\
    \ create a text file called `requirements.txt` and write the names of the packages\
    \ and their versions to the file. Each package name and version is written to\
    \ the file on a single line as follows:\n![](image_rsrc2VP.jpg)\n\nAfter creating\
    \ the `requirements.txt` file containing the packages to be installed, the packages\
    \ can then be installed using the command:\n```bash\npip install -r requirements.txt\n\
    ```\n\nIf the virtual environment is activated and you run the command, `pip3\
    \ freeze`, all the packages installed in the virtual environment will be displayed.\
    \ For example, here are a few packages in the `proj_env` virtual environment.![](image_rsrc2VR.jpg)\
    \ Instead of displaying these packages on the terminal, we could redirect these\
    \ packages to a text file in case we want to later use the file to create this\
    \ same environment on another machine. Note that, we could use the `sudo apt-get\
    \ install` command to install packages. For example, to install `numpy`, `scipy`,\
    \ `matplotlib`, and `pandas`, we can run the following command:\n```bash\nsudo\
    \ apt-get install python-numpy python-scipy python-matplotlib python-pandas\n\
    ```\n\n## Install Visual Studio Code\n\nVisual Studio (VS) Code editor will allow\
    \ us to easily edit larger files compared to using the `nano` editor. See the\
    \ VS Code documentation on how to install VS Code in Ubuntu: [https://code.visualstudio.com/docs/setup/linux](https://code.visualstudio.com/docs/setup/linux).\
    \ To install and use VS Code:\n"
