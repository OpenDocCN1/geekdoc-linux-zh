    # Machine Learning Application


    The goal of this project is to build a machine learning model that predicts house
    prices, then deploy the model as a web application so that users can access the
    model through a browser to make predictions. The input data of the dataset used
    to build the model consists of attributes such as house age (`house_age`) in years,
    distance to the nearest MRT station (`distance_to_nearest_MRT_station`) in meters,
    number of convenience stores in the living circle on foot (`convenience_stores`).
    The output variable was the house price of unit area (`house_price_of_unit_area`)
    where 1 unit area = 3.3 meter squared. Other attributes related to the location
    of the house were excluded to keep this application simple. We want to focus more
    on the steps involved in deploying the machine learning model as a web application.
    The dataset consists of 114 instances, which will be split into a training set
    and test set using the 80:20 split ratio. Here are a few instances in the dataset.![](image_rsrc2VV.jpg)The
    entire dataset can be accessed through the link: [https://raw.githubusercontent.com/nfonsang/ML_App/main/house_price_data.csv](https://raw.githubusercontent.com/nfonsang/ML_App/main/house_price_data.csv).
    The original dataset could be found through this machine learning repository:
    [https://archive.ics.uci.edu/ml/datasets/Real+estate+valuation+data+set](https://archive.ics.uci.edu/ml/datasets/Real+estate+valuation+data+set).


    ## Application Tree Structure


    ![](image_rsrc2VW.jpg)


    The application directory structure is as shown above. That means, the application
    directory (`ML_APP`) will contain files including `app.py`, `house_price_data.csv`,
    `lin_reg.pkl`, `model.py`, `README.md`, `requirements.txt`, as well as the templates
    directory which further contains the `input.html` and the `output.html` files.
    In the subsequent sections, we will create the application directory and its contents.


    ### ML_APP Directory


    We will create the application directory (`ML_APP`) inside the project directory.
    We will also move the `requirements.txt` already existing in the project directory
    into the `ML_APP` directory.![](image_rsrc2VX.jpg)


    ### model.py


    We will create a file `model.py` inside the ML_APP directory. The `model.py` file
    will be used to construct and evaluate the predictive model. The ultimate goal
    is to learn the process involved in deploying a machine learning application.
    So, we will focus more on model deployment instead of experimentation and comparison
    of models. We will construct a simple linear regression model and evaluate it
    using r-squared. Here is the code for the `model.py` module.![](image_rsrc2VY.jpg)![](image_rsrc2VZ.jpg)You
    can find the `model.py` file here: [https://github.com/nfonsang/ML_App/blob/master/model.py](https://github.com/nfonsang/ML_App/blob/master/model.py)
    Let’s run the model on the terminal using the command, `python3 model.py`.![](image_rsrc2W0.jpg)Let’s
    inspect the ML_APP directory to make sure the model is saved in that directory.![](image_rsrc2W1.jpg)We
    can see that the model is saved as `lin_reg.pkl` in the ML_APP directory.


    ### Input Request HTML Form


    We will create an input request html form called `input.html`, which will be used
    to collect input data from a user through the browser. The input data will then
    be submitted and processed to make a prediction. That is, the data collected through
    the `input.html` form will be posted to the application server to request for
    a prediction. Here is the code for the `input.html` form.![](image_rsrc2W2.jpg)![](image_rsrc2W3.jpg)![](image_rsrc2W4.jpg)![](image_rsrc2W5.jpg)You
    can open an html file in a browser such as Firefox using the command, `firefox
    <path/file-name.html>`. If Google Chrome is your default browser, you can open
    the html file on Chrome using the command, `see <path/file-name.html>`.![](image_rsrc2W6.jpg)Here
    is how the form looks on a web browser:![](image_rsrc2W7.jpg)


    ### Output HTML File


    We need another template that will display the prediction for the submitted input
    data. This template is named `output.html`. The `output.html` file is as shown
    below.![](image_rsrc2W8.jpg)![](image_rsrc2W9.jpg)


    ### app.py


    We will then build a Flask application called `app.py`, which will be used to
    deploy the machine learning application. Here is the code for the `app.py` file.![](image_rsrc2WA.jpg)![](image_rsrc2WB.jpg)![](image_rsrc2WC.jpg)The
    following steps were used to build the flask application:


    1. We started by importing necessary packages and modules such as `request`, `render_template`,
    `joblib`.

    2. `app = Flask(__name__)` is used to set the name of the application to be the
    name of the `app.py` module.

    3. `@app.route("/")` is used to bind the function (that is, `home()`) to the home
    URL. So, when the home page is run in a browser, the function is called to render
    a template. The `home()` function is designed to render the `input.html`. If you
    are running the application on a Linux machine, the default home URL will be `localhost:5000`.
    The IP address of the server on which the application is running is `127.0.0.1`
    and the application is listening on port `5000`.

    4. The second function, `output()` is designed to grab the input data that was
    submitted to the `/output` endpoint or URL. The input data was submitted through
    the `input.html` form. Remember that the `action` and `method` attributes of the
    `input.html` form were defined as `action="output"` and `method="POST"`. That
    means, upon clicking the Submit button of the `input.html` form, the input values
    entered in the form will be sent to `/output` and the `/output` URL will be loaded
    in the browser. Since the `output()` function is bound to the `/output` URL, the
    `output()` function will be invoked when the `/output` URL is loaded. When the
    output function is invoked, it checks whether the URL that invoked the function
    was loaded through POST request. If it was loaded through a POST request, the
    function then grabs the input data that was sent to the `/output` URL. The `request.forms.values()`
    method extracts the values that were submitted through POST request to the `/output`
    URL. The model is then loaded and the extracted input data is passed into the
    `model.predict()` method to make a prediction. The predicted value is then passed
    into the `output.html` page and the `output.html` page is rendered.

    5. The `app.run()` method runs the app on a specific host IP address. The default
    value of the host is `127.0.0.1`. Setting `host` to `0.0.0.0` makes the application
    accessible from any IP address on the local machine.

