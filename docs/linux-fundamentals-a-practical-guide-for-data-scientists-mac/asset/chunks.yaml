    - 交互式进程（或前台进程）：该进程在前台运行或通过 Linux 终端运行。用户与此类进程进行交互。

    - 非交互式进程（或后台进程）：这是在后台运行的进程，用户不需要与该进程进行交互。要在后台运行命令，我们可以在命令后加上 `&`（安培符）。该命令会在后台运行，并将提示符释放回给用户。

    - 守护进程（Daemons）是后台运行的长时间运行进程，用于等待某些指令。


    ## 进程相关命令


    | 命令 | 用途 |

    | :--- | :--- |

    | `ps` | 用于查看进程列表。 |

    | `kill` | 用于杀死进程。 |

    | `nohup` | 用于使进程在注销后继续运行。 |

    | `nice` | 用于设置进程的 nice 值，以确定该进程是否具有优先级。 |

    | `time` | 用于获取命令或进程的时间统计信息。 |


    注意，`ps -a` 将列出所有进程，包括在后台运行的进程。我们可以使用管道将 `ps -a` 命令生成的输出传递给 `head -<n>` 命令来查看前
    `n` 个进程。![](img/image_rsrc2T3.jpg) `ps -af` 将提供更多细节。![](img/image_rsrc2T4.jpg)
    我们也可以使用 `ps -aux` 来显示所有用户的进程。![](img/image_rsrc2T5.jpg) `ps -u <user-name>` 将显示由指定用户运行的进程。`ps
    -g <group-name>` 将显示由指定组拥有的进程。(image_rsrc2T6.jpg) `ps -f <process-id1, processid2,...>`
    将显示正在运行的指定进程。(image_rsrc2T7.jpg)


    注意命令 `pstree` 显示进程树。我们可以使用 `ps L | more` 来显示 `ps` 命令输出附带的不同字段，例如 `PID` 等。`ps L
    | more` 的输出可以传递给 `grep "field-keyword"` 命令以提取带有特定关键字的字段。(image_rsrc2T8.jpg) 这样，我们在使用
    `ps` 命令时就可以指定想要显示的字段。`ps -ao <field>` 可用于指定应该显示的字段。例如：

    - `ps -ao pid` 可用于检索当前进程的 ID。

    - `ps -ao user` 可用于显示与系统中当前运行的进程相关的用户。(image_rsrc2T9.jpg)


    ### nohup 命令

    `nohup`（No Hang Up，不挂断）命令用于在后台运行程序或进程，使得程序在用户关闭 Shell 或终端后仍继续运行。通常情况下，当你退出或关闭终端时，通过终端启动的所有当前进程也会终止。然而，`nohup`
    命令帮助进程在终端关闭时仍然运行。此外，本应在终端标准输出中显示的内容被重定向到 `nohup.out` 文件中。`nohup` 命令位于通常运行该文件的命令之前。


    例如，要运行一个 Python 文件，我们可以使用 `python3 <file-name.py>`。要在无挂断的情况下运行同一个 Python 文件，我们可以使用
    `nohup python3 <file-name.py>`。让我们使用 `nohup` 命令在 `myfile.py` 中运行一个无限 `while` 循环来说来说
    `nohup` 命令的工作原理。无限 `while` 循环持续运行，直到循环被手动终止或中断。可以使用命令 `nohup python3 myfile.py
    &` 无挂断地运行 Python 文件 `myfile.py`。(image_rsrc2TA.jpg)


    当你运行 `nohup` 命令时，当前目录下会创建一个 `nohup.out` 文件。即使我们退出终端，该进程仍然会在 `nohup.out` 文件中运行。(image_rsrc2TB.jpg)
    我们可以使用 `tail -f nohup.out` 命令查看当前在 `nohup.out` 文件中运行的进程。无限 `while` 循环的输出会被追加到
    `nohup.out` 文件。(image_rsrc2TC.jpg)


    ### time 命令

    `time` 命令用于运行程序显示系统资源使用的摘要。因此，`time python3 myfile2.py` 将运行 Python 文件并显示系统资源使用情况。(image_rsrc2TD.jpg)


    - `real` 指从开始到结束运行脚本或命令所的总时间。

    - `user` 指你的程序在用户模式（内核外）消耗的 CPU 时间。它是执行进程时实际使用的 CPU 时间。

    - `sys` 指在内核内通过系统调用执行程序时花费的 CPU 时间。


    ## 信号

    信号是发送给进程的消息。父进程和子进程可以互相发送信号。信号有名称和数字。以下是信号的示例：


    | 信号数字 |

    | :--- |

    | 1 |

    | 2 |

    | 3 |

    | 9 |

    | 15 |

    | 24 |


    如果你想让一个进程终止，可以发送信号 3 或信号 9 通知进程终止。注意，操作系统支持的所有信号都可以使用 `kill -l` 命令列出，如下所示（注意每个信号都有名称和数字）。(image_rsrc2TE.jpg)


    ### kill 命令

    `kill` 命令用于终止进程。我们可以使用进程 ID 来终止进程。可以给 `kill` 命令提供多个 ID。注意我们可以使用 `ps` 命令获取进程 ID。让我们使用
    `&` 在后台运行 `sleep` 命令 300 秒。(image_rsrc2TF.jpg) 然后，让我们使用其进程 ID 杀死 `sleep` 进程`.kill
    -9`。注意我们可以使用 `ps -ef grep <process-name>` 搜索其他进程。(image_rsrc2TG.jpg) 我们可以同时终止多个进程。`kill`
    命令中需要包含代表杀死信号的 `-9` 参数。例如，`kill -9 2346 2348` 将终止这些进程。(image_rsrc2TH.jpg) 进程名也可以传递给
    `pkill` 命令来终止进程。例如，`pkill sleep`。(image_rsrc2TJ.jpg)


    ### 作业控制命令 (jobs, bg)

    以下是一些作业控制命令及其用法。


    | 命令 | 用途 |

    | :--- | :--- |

    | `jobs` | 显示作业列表 |

    | `fg` | 将后台作业调至前台 |

    | `bg` | `bg` 命令在后台运行进程。此外，在命令末尾使用符号 `&` 可在后台运行命令。CTRL+Z 用于挂起前台进程 |


    下面的命令在后台运行。(image_rsrc2TM.jpg) `jobs` 命令将显示后台运行的作业。注意每个作业都有一个数字。(image_rsrc2TN.jpg)
    要终止作业，我们可以使用 `kill` 命令和作业号。(image_rsrc2TP.jpg) 如果你有一个在前台运行的作业（例如无限 `while` 循环），我们可以
    CTRL+Z 挂起作业，并可以使用 `bg` 命令恢复作业。这里有一个打印“hello”和“great”的挂起循环示例。(image_rsrc2TR.jpg)
    作业可以使用 `bg %<作业号>` 命令恢复。(image_rsrc2TS.jpg)


    ## 11 任务调度

    本章介绍如何在特定时间或定期调度任务。将探索 `at`、`batch`、`cron`、`crontab` 等命令。


    ### 任务调度命令

    以下命令用于 Linux 系统调度在特定时间执行。


    | 命令 | 用途 |

    | :--- | :--- |

    | `at` | 在以后某个时间一次性执行。 |

    | `batch` | 在以后系统负载较低时一次性执行。 |

    | `cron` | 在未来某个时间执行一次任务。Cron 是处理 cron 任务的守护进程。 |

    | `crontab` | 用于更新或修改你的 crontab 目的的命令。它是包含定期执行任务指令的文件。 |


    crontab 布局如下：(image_rsrc2TT.jpg) 用于调度任务的命令包含了布局中列或字段的值。用于调度任务的命令示例如下表所示。


    | | 用途 | 示例 | 含义 |

    | :--- | :--- | :--- | :--- |


    '
- fmt: '

    | * | Any value | *****<command> | Run every minute, every hour, every day, every
    month. |

    | , | Value list separator | 0 0 * *1, 3, 5 <command> | Run at midnight on Mondays,
    Wednesdays, and Fridays. |

    | - | Define a range | 0 0 * 1-6 * <command> | Run at midnight every day for 6
    months. |

    | / | Step value | */5*/2*** | Run every 5 minutes, every two hours, every day.
    |

    | @yearly | Non-Standard | @yearly <command> | Run at midnight on the first day
    of every year. |

    | @monthly | Non-Standard | @monthly <command> | Run at midnight on the first
    day of every month. |

    | @weekly | Non-Standard | @weekly <command> | Run at midnight on the first day
    of every week. |


    ## The at Command

    We can also schedule a job using the `at` command. Let’s echo a message “Hello
    world” at `14:37 pm`, to the terminal (`/dev/pts/0`). Note that you can view the
    directory where the terminal is using the command `tty`. After scheduling the
    job using the `at` command, you will be prompted to schedule the next job. You
    can hit `CTRL + D` to terminate the scheduling process. The command `at 14:37`
    could be used to schedule a task to be executed at `11:37 pm`.![](image_rsrc2TU.jpg)We
    can schedule a task one day ahead using the command `at now + 1 day`. We can also
    list the tasks that have been scheduled using `at -l`.![](image_rsrc2TV.jpg)


    ## The batch Command

    Note that the `batch` command works like the `at` command, however, the `batch`
    command is executed when the system resources are available. So, `batch` technically
    tells the system to run the command only when the system resources are available.![](image_rsrc2TW.jpg)


    ## The crontab Command

    The `crontab -e` command is used to open a crontab file. The file can then be
    modified by writing the `crontab` commands to run a specific job. Each time the
    crontab file is modified and saved, a new `crontab` is installed.![](image_rsrc2TX.jpg)


    A cron job can be scheduled inside the crontab file. For example, we can schedule
    to run a Python file every minute, every hour, every day, and every month using
    the following the crontab command:

    ```bash

    python3 /home/nfonsang/Desktop/project/myfile2.py >> /home/nfonsang/Desktop/project/logfile.txt

    ```

    ![](image_rsrc2TY.jpg)Note that the Python file is scheduled to run and append
    the results to a log file, `/home/nfonsang/Desktop/project/logfile.txt`Let’s inspect
    the Python file and the log file where the results of running the Python file
    are appended.![](image_rsrc2TZ.jpg)The log file above shows the results of running
    the Python file for the first time.


    By default, only the user who created the crontab file can access the file. To
    open and modify a crontab file as the root user, use the `sudo crontab -e` command.
    To open and modify a crontab file as a specific user, use the `crontab -u <user-name>
    -e` command. You can also check the list of cron jobs that have been scheduled
    to run using the `crontab -l` command.![](image_rsrc2U0.jpg)We can remove scheduled
    cron jobs using `crontab -r`![](image_rsrc2U1.jpg)


    ## 12 Other Useful Utilities

    This chapter covers other useful tools for working in Linux, especially tools
    for finding system information. The chapter shows how to use commands such as
    `ifconfig`, `free`, `df`, `du`, `uname`, `top`, `shutdown`, and `reboot`.


    ### Finding System Information

    The following commands are used to display system information:


    - `hostname` shows your computer system’s host name.

    - `ifconfig` will display the network or IP address information of your network
    interfaces. You can also use `ifconfig <interface-name>` to display information
    about a specific interface.

    - `free -h` will display the memory information. This command will show how much
    memory has been used and how much is free.

    - `df -h` will display the drives you have on your system.

    - `du -sh <directory-name>` can be used to display the total size of a folder.

    - `uname` will display the operating system being used. The `-a` option can be
    used with the `uname` command to output more details related to the operating
    system.

    - `top` will display the resources consumed by the processes in real time.

    - `cat /etc/cpuinfo` displays the cpu information.


    ### Shutting down and Rebooting the Computer System

    The `shutdown` and `reboot` command are used to shut down or reboot the computer
    system. You can use `sudo shutdown <time>` to specify the time when the computer
    system should be shut down. For example:


    - `sudo shutdown +15 “<shutdown-related-message>”` will shut down the system after
    15 minutes.

    - `sudo shutdown -r +15 “<shutdown-related-message>”` will shut down the system
    after 15 minutes, then reboot.

    - `sudo shutdown -r 0` will shut down immediately and reboot.

    - `sudo shutdown -h` or `sudo shutdown now` will shut the system down immediately.

    - `sudo shutdown -c` will cancel any system shutdown that has been scheduled.

    - `sudo shutdown -r` will reboot the system in about a minute. You can cancel
    the reboot with `sudo shutdown -c`.

    - `reboot` can also be used to reboot the system immediately.

