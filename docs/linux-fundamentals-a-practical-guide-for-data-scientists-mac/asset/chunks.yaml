    merge the specified files. Let’s merge the names.txt and ethnicity.txt files using
    the command, paste names.txt ethnicity.txt.![](image_rsrc2S1.jpg)We can decide
    to specify a delimiter to separate text from different files by including the
    -d “delimiter” option.![](image_rsrc2S2.jpg)We can also use the -s option to paste
    one file at a time in a serial manner.![](image_rsrc2S3.jpg)The paste command
    could be piped with the cat command to paste items such as one, two or three items
    per line by including the dash(es) after the paste command. The number of dashes
    indicate the maximum number of items that can be pasted on each line.![](image_rsrc2S4.jpg)The
    paste command could be used with input redirection as well.![](image_rsrc2S5.jpg)The
    tr Commandtr stands for translate and is used to delete characters or translate
    characters into other characters. For example, echo “abcd” | tr “d” “1” will replace
    the d in the abcd with 1 .Also, echo “abcd” | tr “cd” “12” will replace c with
    1 and replace d with 2.![](image_rsrc2S6.jpg)Let’s replace uppercase “A” and “B”
    in the ids.txt file with lowercase “a” and “b” respectively![](image_rsrc2S7.jpg)We
    can convert all lowercase text to uppercase using tr [a-z] [A-Z] or tr [:lower:]
    [:upper:] .![](image_rsrc2S8.jpg)Let’s convert all spaces to vertical bars using
    the command, tr “ ”  “ ” <file-name> .![](image_rsrc2S9.jpg)The tr command can
    be practically used to remove multiple spaces in a text. In this situation we
    can use the command cat <file-name> | tr -s “ ” “ ” to squeeze different types
    of multiple spaces into a single space.We can also use the tr -d <character(s)>
    command to delete a character or characters from a given text. For example, cat
    names.txt | tr -d “Mary” deletes the characters; “M”, “a”, “r” or “y” wherever
    those characters are found in each line of text.![](image_rsrc2SA.jpg)Let’s delete
    all numbers in the ids.txt file using cat ids.txt | tr -d [0-9] or cat ids.txt
    | tr d [:digit:] .![](image_rsrc2SB.jpg)The tee CommandThis command takes the
    standard input and writes it to the standard output and files. To see how this
    command works, let’s first list the files in the project directory.![](image_rsrc2SC.jpg)We
    can then write the output that is normally displayed on the terminal into an output.txt
    file using the command, ls -l | tee output.txt .![](image_rsrc2SD.jpg)If we check
    the project directory again, we will find the output.txt file there.![](image_rsrc2SE.jpg)Practically,
    this tee command can be used with the grep command if we want to output to a file,
    then search the file for a specific keyword. For example, ls -l | tee output.txt
    | grep myfile will help us search for files that have the name myfile inside the
    output.txt file.The sort and uniq CommandsWe can use the sort command to sort
    a list of items while the unique command is used to extract unique items from
    a list of items in a file.Let’s use sort <file-name> to sort the names in the
    names.txt file.![](image_rsrc2SF.jpg)To get unique items, we need to first sort
    the items, then pass the sorted items to the uniq command. That is, we can use,
    sort <file-name> | uniq to find unique items in the specified file.![](image_rsrc2SG.jpg)We
    can display items that are duplicates by including the -d option for the uniq
    command. That is, we can use, sort <file-name> | uniq -d .![](image_rsrc2SH.jpg)We
    can also sort numbers by including the -n option to the sort command. That is,
    we could use the command, sort -n <file-name>.![](image_rsrc2SJ.jpg)The -r option
    of the sort command will sort items in a reversed order. For example, we can use,
    sort -n -r <file-name> to sort numbers in a reversed order.![](image_rsrc2SK.jpg)The
    -u option allows us to eliminate duplicates when sorting items. For example, sort
    -u <file-name> will sort the file and display only unique items.![](image_rsrc2SM.jpg)The
    grep CommandThe grep “keyword” <file-name> or cat <file-name> | grep <keyword>
    command searches for the specified pattern or keyword in each line of the file
    and outputs the matching lines. For example, grep “Mary” names.txt will search
    for lines that have the keyword, “Mary” inside the names.txt file, then display
    those lines.![](image_rsrc2SN.jpg)To select every other line except the one that
    has “Mary”, we can include the -v option to the grep command. For example, cat
    names.txt | grep -v Mary.![](image_rsrc2SP.jpg)You can ignore lines that have
    both “John” and “Mary” using the command, cat names.txt | grep -v Mary | grep
    -v John.![](image_rsrc2SR.jpg)We can also use -B1 or A1 options to include one
    line before or after the line that meets the search criteria respectively.That
    means, cat names.txt | grep -A1 John will not only display lines that have “John”
    but will also display the line before the line having “John”.![](image_rsrc2SS.jpg)We
    can also combine -B1 and -A1 options: cat names.txt | grep -B -A1 John will display
    lines before and after the line having “John”.![](image_rsrc2ST.jpg)The find CommandWe
    can use the find command to search for files recursively starting from a given
    directory. The command find <directory-path-to-search> -name <file-name> is used.
    We can find the file myfile.py recursively from the current directory as follows
    using find . -name myfile.py.![](image_rsrc2SU.jpg)The find command displays the
    path(s) of the file we are searching. Note that, we can also find the file myfile.py
    recursively from the home directory using the find ~ -name myfile.py command.![](image_rsrc2SV.jpg)To
    ignore the cases (uppercase and lowercase letters), you can include the -i option.
    For example, find . -iname myfile.py will find myfile.py while ignoring lowercase
    and uppercase letters in the file name. Therefore, this command can display the
    path of files with file names such as Myfile.py, MyFile.py, etc.The file type
    could be specified through the -type option. For example, find /home -type d -name
    project will recursively search (starting from the home directory) for directories
    called project .![](image_rsrc2SW.jpg)The -type f option could be included to
    the find command, to search for regular files. We could use wildcard, such as
    “*.txt ” to search all files that end with the “.txt ” extension.![](image_rsrc2SX.jpg)Files
    with certain permissions can be searched by using the option -perm <permission
    number> such as -perm 777 . So, find <directory-to-search> -type <file-type> -perm
    <permission-number-of-files-to-be-searched> could be used to find files by type
    and by permissions.![](image_rsrc2SY.jpg)After finding these files, we can execute
    the files by modifying them in one way or the other. For example, we can set new
    permissions to the searched files by including the -exec chmod <permissions> {}
    \; to the find command.find . -type f -perm 644 -exec chmod 641 {} \; will find
    files having the permission 644, then change the permission of these files to
    641.![](image_rsrc2SZ.jpg)Now, let’s check the files by type and permissions again.
    You would notice that files with permissions 644 are not displayed anymore as
    the permissions have been changed to 641.![](image_rsrc2T0.jpg)We can also find
    and delete a file by including the -exec rm -f {} \; option, but you need to be
    careful with deleting files especially if you are using a wildcard.![](image_rsrc2T1.jpg)find
    . -type f -empty will search for all files that are empty.find . -type d -empty
    will search for empty directories.find . -user <user-name> will search for files
    owned by the specified user.find . -group <group-name> will search for files owned
    by the specified group.find . -name <file-name> -mtime <+30> will search for files
    that were modified more than 30 days ago.![](image_rsrc2T2.jpg)The -mtime <-30>
    option searches for files that were modified in the last 30 days while the -atime
    <-30> option searches for files that were accessed in the last 30 days.10 Process
    ManagementT his chapter explores different types of processes as well as commands
    used for managing processes including ps , kill , nohup , and time . The chapter
    also covers how to use signals to communicate to processes. Job control commands
    such as jobs , fg , and bg are also discussed.What is a Process?A process is a
    program in execution or a program that is running. Remember that Linux is a multitasking
    system where multiple processes can occur simultaneously; and a multi-user system
    where multiple users can log into the system at the same time. Each process started
    is allocated a unique number called process identifier (PID). There are parent
    and child processes.  If process A creates process B, then process A is the parent
    of process B or process B is the child of process A. A process could have process
    identifier 0 (PID 0) or process identifier 1 (PID 1). PID 0 is a swapper or scheduler
    (sched) primarily responsible for paging. PID 0 is a process that is a part of
    the kernel rather than a user-mode process and starts the init process which is
    assigned the process ID 1\. PID 1 is usually an init process primarily responsible
    for starting and shutting down the system. PID 1 is the parent of all processes. 
    So, the Linux system boot process has PID 0 and PID 1\. Init is the first process
    started by the swapper (or scheduler).Types of Processes'
