    # 算术运算


    我们可以使用 bash 计算器 `bc` 配合整数和浮点数来执行算术运算。我们可以使用 `(( ))` 进行仅限整数的计算。默认情况下，变量引用的数字是字符串，因此我们需要使用
    `(( ))` 使值被识别为数字。例如：


    ![](img/image_rsrc2UX.jpg)


    # 关系运算符


    关系运算符用于检查值之间的关系。关系运算符也称为比较运算符，因为它们基本上是用来比较值的。如果我们想检查变量 `x` 的值是否大于变量 `y` 的值，可以使用关系运算符。


    比较值的语句被称为布尔表达式（Boolean expression），并返回一个布尔值——“true”（真）或“false”（假）。例如，“x 大于或等于
    y”可以可以写成一个布尔表达式：`[ x -ge y ]`。条件语句和 while 循环中的测试条件通常都是布尔表达式。


    ## 布尔表达式示例


    | 描述 | 命令 |

    | :--- | :--- |

    | 大于 | `[$x -gt $y ]` |

    | 小于 | `[$x -lt $y ]` |

    | 大于或等于 | `[$x -ge $y ]` |

    | 小于或等于 | `[$x -le $y ]` |

    | 等于 | `[$x == $y ]` |

    | 不等于 | `[$x -ne $y ]` 或 `[$x != $y ]` |


    # 条件语句


    条件语句是用于决定应该执行什么命令的语句。条件语句主要分为三大类：


    - `if` 语句

    - `if-else` 语句

    - `if-elif-else` 语句


