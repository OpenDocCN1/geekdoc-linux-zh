  trans: "\n\n# 将用户添加到组\n\n`usermod` 命令可修改用户账户。`usermod --help` 提供了在使用 `usermod` 时使用的不同选项。以下是\
    \ `usermod` 的一些选项![](img/image_rsrc2R5.jpg)\n\n`-G` 选项可将用户分配到要组。此选项将覆盖之前分配给该用户的任何要组。为了避免覆盖用户当前的要组，你可以改用\
    \ `-aG` 将新的要组追加到用户中。\n\n`usermod -G <group-name> <user-name>` 将用户添加到组中![](img/image_rsrc2R6.jpg)\n\
    \n`id <user-name>` 显示用户 ID 和该用户所属的组。`id -G <user-name>` 将显示与用户相关的组的组 ID。`id -nG\
    \ <user-name>` 将显示与用户相关的组的名称![](img/image_rsrc2R7.jpg)\n\n你会发现用户 `nfonsang` 已被分配到\
    \ `engineers` 组。让我们创建一个名为 `developers` 的组，然后将用户 `nfonsang` 分配到该组![](img/image_rsrc2R8.jpg)\n\
    \n由于我们使用了 `-G` 选项将用户分配到 `developers` 组，之前分配给用户的 `engineers` 组已被覆盖。为了避免覆盖现有的要组，请使用\
    \ `-aG` 选项将新用户追加到要组![](img/image_rsrc2R9.jpg)\n\n`usermod -aG <group1, group2>\
    \ <user-name>` 用于一行代码添加多个新组。如果用户已添加到 `group1`，则使用 `usermod -G <group1, group2>\
    \ <user-name>` 将用户添加到 `group2`。`usermod -G <group1> <user-name>` 将覆盖用户所属的所有其他组并将用户添加到\
    \ `group1`。\n\n`groupdel <group-name>` 用于删除组。删除组时，任何分配到该组的用户都将从组中移除。`userdel <user-name>`\
    \ 用于删除用户。\n\n对于现有用户，可以使用 `nano` `/etc/passwd` 手动编辑用户信息。例如，用户名可以从 `john` 更改为 `james`，如下所示![](img/image_rsrc2RA.jpg)\n\
    \n为了保持一致，你可能还需要使用 `nano` `/etc/group` 将主组名从 `john` 修改为 `james`。此外，你可能需要使用 `mv`\
    \ 命令将主目录名称从 `/home/john` 修改为 `/home/james`。\n\n通常，手动编辑 `/etc/passwd` 文件不是一个好主意，因为可能会破坏重要信息。注意，`vipw`\
    \ 和 `vigr` 命令也可以分别编辑 `/etc/passwd` 和 `/etc/group` 文件。此外，可以使用 `nano` `/etc/default/useradd`\
    \ 手动更改默认 `adduser` 配置。\n\n# 管理密码属性\n\n`passwd <user-name>` 命令可重置用户的密码属性。使用 `passwd\
    \ --help` 检查选项![](img/image_rsrc2RB.jpg)以下使用不同选项使用 `passwd` 命令的一些示例。\n\n| 命令 |\
    \ 描述 |\n| :--- | :--- |\n| `passwd -S <user-name>` | 显示账户密码设置的状态。 |\n| `passwd\
    \ -l <user-name>` | 用于锁定特定账户的密码，使得只有 root 用户可以访问该账户。用户无法直接登录系统。 |\n| `passwd -u\
    \ <user-name>` | 用于解锁用户的密码。 |\n| `passwd -d <user-name>` | 删除账户的密码。 |\n| `passwd\
    \ -e <user-name>` | 使用户账户立即过期。强制用户在下次登录尝试时更改密码。 |\n| `passwd -i <no-of-days> <user-name>`\
    \ | 账户在密码过期指定天数后变为失效。在此天数之后，用户将无法再登录。 |\n| `Echo “newpassword” | passwd --stdin\
    \ <user-name>` | 将用户的密码设置为 `newpassword`。 |\n\n# 管理当前会话\n\n*   `who` 和 `w` 命令显示当前登录的用户。\n\
    *   `loginctl` 命令用于管理当前会话：\n    *   `loginctl list-sessions` 用于列出当前会话。\n    *\
    \   `loginctl show-session <session-id...>` 显示一个或多个会话的属性。\n    *   `loginctl show-user\
    \ <user…>` 显示一个或多个用户的属性。\n    *   `loginctl terminate-user <user…>` 终止特定用户的所有会话。这将杀死该用户所有会话的所有进程![](img/image_rsrc2RC.jpg)\n\
    \n# 七 权限管理\n\n本章将帮助你理解和管理文件权限，例如写、读和执行权限。你还将理解与文件相关的属性、如何显示文件权限、设置文件权限以指定用户所有者、组所有者和其他可以对文件进行的操作。\n\
    \n## 理解 Linux 基础权限\n\nLinux 中的所有文件和目录都有一套标准的访问权限，用于控制谁可以访问、读取、写入或执行文件或目录。首先，需要注意的是\
    \ Linux 文件具有名称、创建时间、修改时间、访问时间、大小、所有者、组等属性。\n\n文件和目录的读、写、执行权限如下：\n\n| 权限 | 文件 |\
    \ 目录 |\n| :--- | :--- | :--- |\n| 读 (r) | 打开 | 列出 |\n| 写 (w) | 修改 | 创建或删除 |\n\
    | 执行 (x) | 运行 | 导航 |\n\n`ls -l` 命令用于查看分配给文件和目录的权限![](img/image_rsrc2RD.jpg)`ls\
    \ -l` 命令按顺序输出关于文件或目录的信息：\n\n*   文件类型\n*   权限\n*   所有者\n*   组\n*   大小\n*   创建/修改日期\n\
    \n以下符号用于描述不同类型的文件：\n\n| 符号 | 描述 |\n| :--- | :--- |\n| - | 普通文件 |\n| d | 目录 |\n\
    | b | 块设备 |\n| c | 字符设备 |\n| p | 管道 |\n| l | 符号链接 |\n| s | 套接字 |\n\n`ls -l` 命令显示文件和目录的信息。包含写、读和执行权限。`ls\
    \ -l` 生成的输出解释如下![](img/image_rsrc2RE.jpg)\n\n*   `d`: 目录\n*   `rwx`: 用户所有者可以读取、写入并执行文件。\n\
    *   `r-x`: 组所有者可以读取文件，无法写入但可以执行文件。\n*   `r-x`: 其他人可以读取文件，无法写入但可以执行文件。\n*   `4`:\
    \ 文件的链接数。\n*   `nfonsang`: 用户所有者名称。\n*   `nfonsang`: 组所有者名称。\n*   `4096`: 以字节为单位的大小。\n\
    *   `Aug 4 14:59`: 创建或最后修改的日期/时间。\n\n"
- fmt: "\n| 4 |\n| 4 |\n| 4 |\n| 4 |\n| 0 |\n| 0 |\n| 0 |\n| 0 |\n\nNote that `0`\
    \ is used to indicate no permission. The sum is used to assign permissions to\
    \ users, groups, or others. Therefore, file permissions are represented by a three-digit\
    \ number where the first digit, second digit, and third digit represent the permissions\
    \ assigned to the user, group and others respectively. Here is an example of how\
    \ to interpret permission numbers:\n\n| Permission number | Description |\n| :---\
    \ | :--- |\n| 762 | `7` or `(4+2+1)` → User owner has read, write, and execute\
    \ permissions. `6` or `(4+2)` → Group owner has read and write permissions only.\
    \ `2` → others have write permission only. |\n| 431 | `4` → User owner has read\
    \ permission only. `3` or `(2+1)` → Group owner has write and execute permissions\
    \ only. `1` → Others have execute permission only. |\n\n## Managing Basic Linux\
    \ Permissions\n\n`chgrp <new-group-name> <file-name>` is used to change the group\
    \ ownership of a file. `chown <new-owner name> <file-name>` is used to change\
    \ the user own of the file. For example, the `myfile.py` in the illustration below\
    \ is owned by the user, `nfonsang`. The group owner is also `nfonsang`. We can\
    \ change the group owner to `engineers` and the user owner to `james`. Note that\
    \ the group owner and user owner that you are assigning to the file should already\
    \ exist in the system. Here is how to change the group owner:\n\n![](image_rsrc2RF.jpg)\n\
    \nNow, let’s change user owner of the file to `james`:![](image_rsrc2RG.jpg)\n\
    \n## Assign Permissions Using Numbers\n\nLet’s consider the following file permissions:\n\
    ![](image_rsrc2RH.jpg)\n`myfile.py` is a regular file with the following permissions:\n\
    \n- user owner permission number is `4+2+0` (`rw-`) = `6`;\n- group owner permission\
    \ number is `4+0+0` (`r--`) = `4`, and\n- others permission number is `4+0+0`\
    \ (`r--`) = `4`.\n\nSo, the permissions (user, group, other) for the file is `644`.\
    \ We can change the permissions to `771`, which means user owner and group owner\
    \ will have read, write, and execute permissions, while others will have only\
