    注意 `0` 用于表示没有权限。总和用于将权限分配给用户、组或其他人。因此，文件权限由三位数字表示，其中第一位、第二位和第三位分别代表分配给用户、组和其他人的权限。以下是解释权限数字的示例：


    | 权限数字 | 描述 |

    | :--- | :--- |

    | 762 | `7` 或 `(4+2+1)` → 用户所有拥有读、写、执行权限。`6` 或 `(4+2)` → 组所有者只有读、写权限。`2` → 其他只有写权限。
    |

    | 431 | `4` → 用户所有者只有读权限。`3` 或 `(2+1)` → 组所有者只有写、执行权限。`1` → 其他只有执行权限。 |


    ## 管理基础 Linux 权限


    `chgrp <new-group-name> <file-name>` 用于更改文件的组所有权。`chown <new-owner name> <file-name>`
    用于更改文件的用户所有者。例如，下方插图中的 `myfile.py` 用户 `nfonsang`。组所有者也是 `nfonsang`。我们可以将组所有者更改为
    `engineers`，用户所有者更改为 `james`。注意，你分配给文件的组所有者和用户所有者已经在系统中存在。以下是更改组所有者的方法：


    ![](img/image_rsrc2RF.jpg)


    现在，让我们文件的用户所有者改为 `james`![](img/image_rsrc2RG.jpg)


    ## 使用数字分配权限


    考虑以下文件权限：

    ![](img/image_rsrc2RH.jpg)

    `myfile.py` 是具有以下权限的普通文件：


    - 用户所有者权限数字为 `4+2+0` (`rw-`) = `6`；

    - 组所有者权限数字为 `4+0+0` (`r--`) = `4`，且

    - 其他人权限数字为 `4+0+0` (`r--`) = `4`。


    因此，该文件的权限（用户、组、其他）为 `644`。我们可以将权限更改为 `771`，这意味着用户所有者和组所有者将拥有读、写、执行权限，而其他人只有执行权限。我们可以使用
    `chmod <new-permission-number> <file-name>` 命令分配读、写和执行权限。例如，我们可以如下所示将权限模式从 `664`
    更改为 `771`：![](img/image_rsrc2RJ.jpg)


    注意，通过在 `chmod` 命令中包含 `-R` 选项，可以递归更改目录的读、写和执行权限，从而影响子目录的权限。因此，使用了 `chmod -R <permission-number>
    <directory-name>` 命令。


    ## Unmask


    我们还可以使用 `umask` 命令更改文件和目录的默认权限。`umask` 是一个从设置，定义一个掩码。例如，目录的默认权限为 `777`。`umask
    027` 将目录的默认权限设置为 `750`（即 `777 - 027 = 750`）。该命令还会影响运行命令的目录内所有新文件（带有默认权限）。


    ## 8 正则表达式


    本章重点介绍如何使用正则表达式。正则表达式是用于通过匹配模式来搜索数据的特殊字符。因此，正则表达式是一种用于搜索符合指定模式的数据匹配机制。


    ### 正则表达式简介


    让我们先检查正则表达式是如何工作的。我们可以使用 `ls -l *.py` 列出所有以 `.py` 结尾的文件。星号 `*` 匹配零或多个字符。![](img/image_rsrc2RK.jpg)


    正则表达式可以配合 `grep` 命令用于显示文件中匹配模式的行。例如，`cat names.txt | grep “e”` 将输出包含字母“e”的行，而
    `cat names.txt | grep “e$”` 将搜索以“e”结尾的行![](img/image_rsrc2RM.jpg)


    ### 基础正则表达式示例


    - “ `^a ” 将搜索以字母“a”开头的行。

    - “ `a.b` ” 将匹配“a”和“b”之间的任何单个字符。

    - “ `a*b` ” 匹配“a”和“b”之间从 0 个或多个字符。

    - `[abc]` 将匹配包含“a”、“b”或“c”的任意行。注意 `[abc]` 等同于 `[a-c]`。

    - `[abc]ef` 将匹配具有三个字符的行，如 aef、bef 或 cef。

    - `[a-z]` 匹配单个小写字母。`[a-z]` 等同于 `[:lower:]`。

    - `[A-Z]` 将匹配单个大写字母。`[A-Z]` 等同于 `[:upper:]`。

    - `[a-zA-Z]` 将匹配单个字母（大写或小写）。`[a-zA-Z]` 等同于 `[:alpha:]`。

    - `[0-9]` 将匹配单个数字。`[0-9]` 等同于 `[:digit:]`。

    - `[a-zA-Z0-9]` 将匹配单个字母或数字。

    - `[:space:]` 将匹配空白字符。

    - `[:punc:]` 将匹配标点符号。

    - `[^abc]` 或 `[^a-z]` 匹配不在括号内的字符。

    - “ `^$` ” 将匹配空行。


