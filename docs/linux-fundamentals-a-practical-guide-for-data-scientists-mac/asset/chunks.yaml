    `cat names.txt | grep “^[A-K]”` 将匹配以 A 到 K 之间的字母开头的名字，而 `cat names.txt | grep
    “^[^A-K]”` 将匹配不以 A 到 K 之间的字母开头的名字。`[^A-K]` 表示除 A 到 K 之间的字母以外的其他字母。(image_rsrc2RN.jpg)我们可以使用
    `-n` 选项在输出中包含行号。然后，我们还可以使用 `-v` 选项来反转或否定匹配模式。(image_rsrc2RP.jpg)


    # 9 文本处理

    在本章中，我们将学习如何使用不同的命令（包括 `cut`、`paste`、`tr`、`tee`、`sort`、`grep` 和 `find`）过滤和搜索文本。


    ## cut 命令

    `cut` 命令用于从文件的每行提取部分。让我们考虑以下文件，`myfile.txt` 和 `students.txt`：![](img/image_rsrc2RR.jpg)


    让我们使用命令 `cut c<character-position> <file-name>` 提取每行的第一个字符。命令 `cut -c1 myfile.txt`
    提取文件中每行的第一个字符。命令 `cut -c6 myfile.txt` 提取文件中每行的第六个字符，如下所示。(image_rsrc2RS.jpg)


    让我们从每行提取一组字符。例如，我们可以像下面所示，提取从第一个到第三个或从第六个到第八个字符。(image_rsrc2RT.jpg)


    在处理分隔符文件时，`cut` 命令变得非常有用。在处理带分隔符的文件时，使用 `-d` 选项指定分隔符。要提取的特定字段可以使用 `-f` 选项指定。


    例如，`student.txt` 文件是一个逗号分隔的文件。逗号分隔的文件可以使用命令 `cut -d “,” -f<field-position> <file-name>`
    进行处理。(image_rsrc2RU.jpg)参数 `-f1` 表示应提取每行的第一个字段。


    如果你想避免任何没有分隔符的行（例如 `students.txt` 文件中的最后一行），可以指定 `-s` 选项。(image_rsrc2RV.jpg)


    我们可以使用参数 `-f1-2` 提取第一个和第二个字段。(image_rsrc2RW.jpg)


    让我们提取 `students.txt` 文件中的姓名和种族。由于姓名和种族分别出现在第 1 和第 4 字段，我们将使用参数 `-f1,4`。(image_rsrc2RX.jpg)我们可以通过包含
    `--output-delimiter=“<delimiter>”` 选项将输出中的分隔符替换为另一个分隔符。(image_rsrc2RY.jpg)让我们来看
    cut 命令的一个实际应用。假设你想提取 `/etc/passwd` 文件中最后三个账户的名称和主目录。这可以使用命令 `tail -3 /etc/passwd
    | cut -d“:” -f1,6` 完成。(image_rsrc2RZ.jpg)


    ## paste 命令

    `paste` 命令用于水平合并文件的行。因此，`paste` 适合水平堆叠来自不同文件的字段。让我们考虑 `ethnicity.txt` 和 `names.txt`
    文件。(image_rsrc2S0.jpg)我们可以使用 `paste <file1 file2 …>` 合并指定的文件。让我们使用命令 `paste names.txt
    ethnicity.txt` 合并 `names.txt` 和 `ethnicity.txt` 文件。(image_rsrc2S1.jpg)我们可以通过包含
    `-d “delimiter”` 选项来指定分隔符以分离来自不同文件的文本。(image_rsrc2S2.jpg)我们还可以使用 `-s` 选项以串行方式一次粘贴一个文件。(image_rsrc2S3.jpg)`paste`
    命令可以与 `cat` 命令配合，通过在 `paste` 命令后包含横杠来实现每行粘贴一个、两个或三个项目。横杠的数量表示每行可以粘贴的最大项目数。(image_rsrc2S4.jpg)`paste`
    命令也可以配合输入重定向使用。(image_rsrc2S5.jpg)


    ## tr 命令

    `tr` 代表 translate（转换），用于删除字符或将字符转换为其他字符。例如，`echo “abcd” | tr “d” “1”` 将把 `abcd`
    中的 `d` 替换为 `1`。同样，`echo “abcd” | tr “cd” “12”` 将 `c` 替换为 `1` 并 `d` 替换为 `2`。(image_rsrc2S6.jpg)让我们将
    `ids.txt` 文件中的大写 “A” 和 “B” 分别替换为小写 “a” 和 “b” (image_rsrc2S7.jpg)我们可以使用 `tr [a-z]
    [A-Z]` 或 `tr [:lower:] [:upper:]` 将所有小写文本转换为大写。(image_rsrc2S8.jpg)让我们使用命令 `tr
    “ “ “ |” <file-name>` 将所有空格转换为垂直线。(image_rsrc2S9.jpg)`tr` 命令在实际中可以移除文本中的多个空格。我们可以使用
    `tr -s “ ” <file-name>` 将多个空格压缩为单个。我们可以使用 `tr -d “ ”` 删除文本中的空格。我们可以使用 `tr “ “
    “t” <file-name>` 将所有空格转换为制表符。我们可以通过 `find` 命令配合 `tr -d “”` 来删除这些字符。(image_rsrc2SA)我们可以使用
    `tr -d “[:digit:]]` 来删除 `ids.txt` 文件中的所有空白符。(image_rsrc2SB)


    ## tee 命令

    `tee` 命令接收标准输入并将其写入标准输出和文件。我们可以使用 `tee` 命令将输出重定向到文件，同时显示在屏幕上。(image_rsrc2SC)我们可以使用
    `tee -a` 选项向文件追加输出内容，而不是覆盖它。(image_rsrc2SD)我们可以使用 `tee file1 file2` 将输出同时写入多个文件。(image_rsrc2SE)


    ## sort 和 uniq 命令

    `sort` 命令对文件内容进行排序。我们可以使用 `sort file 命令`。(image_rsrc2SF)`sort` 还可以按特定的键进行排序，例如，使用
    `sort -k2,2 file.txt` 按第 2 列进行排序。(image_rsrc2SG)我们可以使用 `sort -r` 选项进行反序排序。(image_rsrc2SH)我们还可以使用
    `sort -n` 按数值大小进行排序。(image_rsrc2SI)`uniq` 命令用于过滤相邻的重复行。通常在运行 `uniq` 之前需要先运行 `sort`，例如
    `sort file.txt | uniq`。(image_rsrc2SJ)我们可以使用 `uniq -c` 选项显示重复行的次数。(image_rsrc2SK)我们可以使用
    `uniq -d` 选项仅显示重复的行。(image_rsrc2SL)我们可以使用 `uniq -u` 选项仅显示不重复的行。(image_rsrc2SM)


