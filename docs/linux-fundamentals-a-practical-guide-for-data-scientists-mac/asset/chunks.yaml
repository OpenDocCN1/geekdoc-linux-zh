- fmt: "\n# Adding Users to Groups\n\nThe `usermod` command can be used to modify\
    \ a user account. `usermod --help` gives the different options to be used with\
    \ `usermod`. Below are a few options for the `usermod`.![](image_rsrc2R5.jpg)\n\
    \nThe `-G` option can be used to assign a user to a secondary group. This option\
    \ will overwrite any secondary group previously assigned to the user. To avoid\
    \ overwriting the user’s current secondary group, you could instead use `-aG`\
    \ to append the new secondary group to the user.\n\n`usermod -G <group-name> <user-name>`\
    \ will add a user to a group.![](image_rsrc2R6.jpg)\n\n`id <user-name>` displays\
    \ the user ID and the group(s) the user belongs to. `id -G <user-name>` will display\
    \ the group IDs for the groups associated with the user. `id -nG <user-name>`\
    \ will display the names of the groups associated with the user.![](image_rsrc2R7.jpg)\n\
    \nYou would notice that the user `nfonsang` has been assigned to the engineers\
    \ group. Let’s create another group called `developers`, then assign the user,\
    \ `nfonsang`, to this group.![](image_rsrc2R8.jpg)\n\nSince we used the `-G` option\
    \ to assign the user to the `developers` group, the engineers group that was previously\
    \ assigned to the user has been overwritten. To avoid overwriting existing secondary\
    \ groups, use `-aG` option to append the new user to the secondary group.![](image_rsrc2R9.jpg)\n\
    \n`usermod -aG <group1, group2> <user-name>` is used to add multiple new groups\
    \ using a single line of code. `usermod -G <group1, group2> <user-name>` is used\
    \ to add the user to `group2` if the user is already added to `group1`. `usermod\
    \ -G <group1> <user-name>` will overwrite all other groups the user belongs to\
    \ and add the user to `group1`.\n\n`groupdel <group-name>` is used to delete a\
    \ group. When a group is deleted, any user assigned to that group is removed from\
    \ the group. `userdel <user-name>` is used to delete a user.\n\nFor an existing\
    \ user, the user information can be manually edited using `nano` `/etc/passwd`.\
    \ For example, the username can be changed from `john` to `james` as shown below.![](image_rsrc2RA.jpg)\n\
    \nTo be consistent, you may also need to edit the primary group name that was\
    \ `john` to `james` using `nano` `/etc/group`. Additionally, you may need to edit\
    \ the home directory name from `/home/john` to `/home/james` using the `mv` command.\n\
    \nGenerally, editing the `/etc/passwd` file manually is not a good idea as one\
    \ can temper with important information. Note that the `vipw` and `vigr` commands\
    \ could also be used to edit the files `/etc/passwd` and `/etc/group`, respectively.\
    \ Moreover, default `adduser` configurations can be changed manually using `nano`\
    \ `/etc/default/useradd`.\n\n# Managing Password Properties\n\nThe `passwd <user-name>`\
    \ command can be used to reset password properties for a user. Use `passwd --help`\
    \ to check options.![](image_rsrc2RB.jpg)Here are some examples of how to use\
    \ the `passwd` command with different options.\n\n| Command | Description |\n\
    | :--- | :--- |\n| `passwd -S <user-name>` | Displays the status of a user’s account\
    \ password settings. |\n| `passwd -l <user-name>` | Used to lock the password\
    \ of a specific account such that only the root user can access the account. Users\
    \ are not able to log into the system directly. |\n| `passwd -u <user-name>` |\
    \ Used to unlock the password of a user. |\n| `passwd -d <user-name>` | Deletes\
    \ the password for an account. |\n| `passwd -e <user-name>` | Causes the user\
    \ account to expire immediately. The user is forced to change his/her password\
    \ during the next login attempt. |\n| `passwd -i <no-of-days> <user-name>` | Makes\
    \ the account inactive after the password expires for the specified number of\
    \ days. The user will no longer be able to sign in after this number of days.\
    \ |\n| `Echo “newpassword” | passwd --stdin <user-name>` | Sets the user’s password\
    \ to the `newpassword`. |\n\n# Managing current sessions\n\n*   The `who` and\
    \ `w` commands show who is currently logged in.\n*   The `loginctl` command is\
    \ used to manage current sessions:\n    *   `loginctl list-sessions` is used to\
    \ list current sessions\n    *   `loginctl show-session <session-id...>` shows\
    \ the properties of one or more sessions.\n    *   `loginctl show-user <user…>`\
    \ shows the properties of one or more users.\n    *   `loginctl terminate-user\
    \ <user…>` terminates all the sessions of a specific user(s). This kills all processes\
    \ of all sessions of the user(s).![](image_rsrc2RC.jpg)\n\n# 7 Permissions Management\n\
    \nThis chapter will help you to understand and manage file permissions such as\
    \ write, read and execution permission. You will also understand different attributes\
    \ associated with files, how to display file permissions, set file permissions\
    \ to specify what user owners, group owners and others can do with files.\n\n\
    ## Understanding Basic Linux Permissions\n\nAll files and directories in Linux\
    \ have a standard set of access permission to control who can access the file,\
    \ read, write, or execute on the file or directory. First, it is important to\
    \ note that a Linux file has attributes such as name, creation data and time,\
    \ modification data and time, access date and time, size, owner, group, link.\n\
    \nThe read, write and execute permissions for files and directories are as follows:\n\
    \n| Permissions | File | Directory |\n| :--- | :--- | :--- |\n| Read (r) | open\
    \ | list |\n| Write (w) | modify | create or delete |\n| Execute (x) | run | navigate\
    \ |\n\nThe `ls -l` command can be used to view permissions assigned to files and\
    \ directories![](image_rsrc2RD.jpg)The `ls -l` command outputs information about\
    \ file or directory in the following order:\n\n*   File Type\n*   Permission\n\
    *   Owner\n*   Group\n*   File Size\n*   Creation/Modification Date\n*   FilenameThe\
    \ following notations are used to describe different types of files:\n\n| Notation\
    \ | Description |\n| :--- | :--- |\n| - | Regular file |\n| d | Directory |\n\
    | b | Block device |\n| c | Character device |\n| p | Names pipes |\n| l | Symbolic\
    \ Link |\n| s | Socket |\n\nThe `ls -l` command displays information about files\
    \ and directories. The information includes write, read and execute permissions.\
    \ The following output generated from `ls -l` can be interpreted as below![](image_rsrc2RE.jpg)\n\
    \n*   `d`: file is a directory.\n*   `rwx`: user owner can read, write on, and\
    \ execute the file.\n*   `r-x`: group owner can read the file, cannot write on\
    \ the file, and can execute the file.\n*   `r-x`: others can read the file, cannot\
    \ write on the file, and can execute the file.\n*   `4`: number of links to the\
    \ file.\n*   `nfonsang`: name of user owner.\n*   `nfonsang`: name of (primary)\
    \ group owner.\n*   `4096`: size of the file in bytes.\n*   `Aug 4 14:59`: date/time\
    \ of creation or latest modification.\n"
