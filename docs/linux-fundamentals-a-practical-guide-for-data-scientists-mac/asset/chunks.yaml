  trans: "\n\n![](img/image_rsrc2MK.jpg)\n\n# Linux 基础\n面向数据科学家、机器学习工程师和 IT 专业人士的实用指南\n\
    Neba Nfonsang\n版权所有 © 2021 Neba Nfonsang。保留所有权利。\n\n## 献辞\n我将此书献给全能的神，他赐予我灵感、智慧、力量和恩典来完成这本书。我也将这本书献给我我出色的妻子\
    \ Ruka 和我可爱的孩子们 Carol、Mark-Bright 和 Debbie。\n\n## 目录\n1. [致谢]\n2. [Linux 简介]\n\
    3. [Linux 目录结构与基础 Linux 命令]\n4. [导航]\n5. [文件与目录操作]\n6. [标准 I/O 重定向与管道]\n7. [用户与用户组管理]\n\
    8. [权限管理]\n9. [正则表达式]\n10. [文本处理]\n11. [进程管理]\n12. [作业调度]\n13. [其他实用工具]\n14. [自定义\
    \ Shell 环境]\n15. [Shell 脚本编写]\n16. [部署机器学习模型]\n17. [连接到远程 Linux 实例]\n18. [资源]\n\
    \n## 致谢\n感谢 Nick Cutforth 博士和 Bruce Harmon 博士对我在丹佛大学的学术和教学工作的大力支持。我非常荣幸能与竭力帮助丹佛大学学生的教职员工们共事。我还要感谢丹佛大学的学生们，让我有机会扩展我的思想和教学。我深信丹佛大学是你可以接受教育或进行教学的最佳大学之一。\n\
    \n## 1 Linux 简介\n本章提供了学习 Linux 基础概念的动力。本章还简述了 Linux 操作系统的结构、Linux 发行版以及 Linux\
    \ 系统架构。涵盖的其他概念包括 Shell 的类型、Linux 操作系统的特性、`VirtualBox` 的安装、如何创建虚拟机以及在虚拟机上安装 `Ubuntu`。\n\
    \n### 为什么选择 Linux？\n随着人工智能、机器学习工程化、DevOps 和云计算的兴起，对 Linux 的需求日益增长。这是因为大多数涉及应用程序部署和发布的后端工作都可以在\
    \ Linux 中高效完成。如果你想进入 IT 领域，或者想学习如何部署软件应用程序或机器学习模型，你绝对需要知道如何使用 `Linux commands`。\n\
    \n你一定能从学习使用 `Linux commands` 中获益。此外，Linux 是最可靠、最安全的操作系统之一。Linux 操作系统驱动着本地服务器、远程服务器、电子设备、嵌入式系统、手机、智能手表、智能电视等。\n\
    \n### Linux 操作系统与 Linux 发行版\n就像 Microsoft Windows 和 macOS 一样，Linux 是一个操作系统。与其他操作系统相比，Linux\
    \ 是开源的。通常，操作系统是一种直接管理计算机系统硬件和资源（如中央处理器 `CPU` 和内存存储）的软件。操作系统连接了台式机或笔记本电脑中的软件应用程序和物理资源。因此，操作系统通过管理计算机软件与硬件之间的通信来帮助软件应用程序运行。\n\
    \nLinux 有多个版本（也称为发行版）以适应不同的用户。流行的 Linux 发行版包括 `Ubuntu`、`Red Hat`、`Debian`、`CentOS`、`Fedora`、`Linux\
    \ Mint` 等。\n\n### Linux 系统架构\nLinux 系统基本上由 Linux 内核、系统库、用户应用程序和硬件组成，如图所示。\n![](img/image_rsrc2MM.jpg)\n\
    \n内核和系统库是 Linux 操作系统的关键组件。内核由各种模块组成，并直接与底层硬件（如 `CPU`、`RAM` 和 `I/O`）交互。这意味着内核用于管理系统资源：\n\
    \n*   `设备管理`：所有的输入输出设备都由内核管理。\n*   `内存管理`：内核跟踪已使用和未使用的内存，实现虚拟内存，为用户程序分配内存等。\n\
    *   `进程管理`：内核为进程分配足够的时间并对进程进行优先级排序。\n*   `处理系统调用`：用户应用程序可以请求内核执行特定任务。程序使用 `system\
    \ calls` 执行某些操作。`System libraries` 是访问内核功能的函数或程序。`Standard libraries` 是与内核通信的程序。当应用程序放置\
    \ `system calls` 让内核执行某些任务时，`system calls` 通常不会直接调用，而是通过库调用。\n\n各种应用程序被用于在 Linux\
    \ 计算机内部执行特定任务。`shell` 是一种特殊的应用程序，是一种用于与内核通信的用户界面，内核反过来控制硬件组件和进程。虽然一台计算机通常只有一个内核，但同一台机器的操作系统上可以同时运行多个\
    \ Shell。\n\n### Shell 的类型\nLinux 中有不同类型的 Shell，包括：\n\n*   `Bourne Again shell`\
    \ (`bash`)\n*   `Bourne shell` (`sh`)\n*   `C shell` (`csh`)\n*   `Korn shell`\
    \ (`ksh`)\n*   `TC shell` (`tcsh`)\n\n注意，Linux 操作系统上可能安装了多种一种类型的 Shell。\n\n###\
    \ Linux 操作系统的特性\nLinux 操作系统的的一些关键特性如下：\n\n*   `多用户`：多个用户可以使用不同的 Shell 同时访问相同的系统资源，如内存、硬盘、应用程序。\n\
    *   `多任务处理`：多个应用程序可以同时在 Linux 操作系统上运行。\n*   `可移植性`：Linux 操作系统在不同平台上以相同的方式运行。\n\
    *   `文件系统`：文件和目录按分级方式排列，包括普通文件、文件夹、内存、I/O 和设备在内的一切都被视为文件。\n*   `Shell`：这是 Linux\
    \ 中的命令行界面，允许用户通过键盘输入命令，执行程序或完成特定任务。\n*   `安全性`：Linux 通过三种主要方式提供安全性，包括：\n    *\
    \   `身份验证`：通过为用户分配密码和登录 ID 提供密码保护。\n    *   `授权`：为用户提供读取文件、写入文件或执行程序的权限；因此限制了用户在计算机上可以做和不能做的事情。\n\
    \    *   `加密`：将文件转换为不可读的格式。\n\n### Linux OS 安装\nLinux 操作系统可以安装在不同的机器上，包括：\n\n\
    *   本地计算机，\n*   本地虚拟机（`VirtualBox` 或 `VMware workstation`），以及\n*   云环境中的远程机器（`AWS`\
    \ 或 `Azure`）。\n\n"
