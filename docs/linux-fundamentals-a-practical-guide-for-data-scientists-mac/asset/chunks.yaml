    # 6 Users and Group Management


    This chapter focuses on how to create users and groups, how to assign users to
    groups as well as how to delete users and groups. We will also examine how to
    manage password properties.


    ## Users and Groups


    Users and groups are two main types of accounts in Linux. Accounts allow access
    into specific resources or files. Every user account is given an ID number (`userid`).
    Groups allow the system administrator to manage a collection of user accounts.
    If a group is granted permissions to access a file, then every user belonging
    to the group has (or inherits) the same permissions to access the file.


    Every Linux user belongs to at least one group (the primary group). If a user
    creates a file, that file belongs to both the user and to the primary group of
    the user. You can use the `ls -l <file-name>` to display files in a directory,
    as wells users and groups having access to a file.


    ![](image_rsrc2PS.jpg)


    As illustrated above, you would notice that `nfonsang` is the name of the user
    and `nfonsang` is also the name of the group (primary group) to which the `myfile.txt`
    belongs. You can also find the current user’s information including user ID, username
    as well as group ID and group name by running the `id` command.


    ![](image_rsrc2PT.jpg)


    `uid` is user ID while `gid` refers to group ID.


    ## How to Create Users in Linux


    To create users in Linux, you need to have root permissions. That means, you need
    to login as root or superuser. To switch to the superuser account, you can use
    the command `sudo su`. To exit the superuser account into the user account, you
    could use the command `exit`.


    ![](image_rsrc2PU.jpg)


    You can create a user using the `adduser <user-name>` or `useradd <user-name>`
    command.


    ![](image_rsrc2PV.jpg)


    In this example above, a user called `john` has been created in ubuntu. When you
    run the command to create a user, you would be prompted to enter other user information
    such as full name , room number , etc. If that information is not available or
    not necessary, just hit the Enter key on your keyboard to proceed. Then verify
    if the information is correct by entering `y`.


    The `/etc/passwd` file stores essential user information required during login.
    We can display all the account information for different users in the system using
    `cat /etc/passwd`. The user information includes, username, an encrypted password
    represented by `x`, primary group ID, primary group name, the absolute path to
    the home directory as well as the absolute path to the shell.


    ![](image_rsrc2PW.jpg)


    Alternatively, we can view the account information for users who were recently
    added to the system using `tail /etc/passwd`.


    ![](image_rsrc2PX.jpg)


    We can find specific user information in the `/etc/passwd` file using the `grep`
    command. For example, let’s find any account that contains the word “nfon ” in
    the `/etc/passwd`. We will use the command, `grep nfon /etc/passwd`.


    ![](image_rsrc2PY.jpg)


    In addition to the username, we can specify a desired user id, group id, home
    directory path, etc., when creating a new user with the `useradd` command. We
    can see the various options available by running the `useradd --help` command.


    ![](image_rsrc2PZ.jpg) ![](image_rsrc2R0.jpg)


    Below are examples of how these options can be used when creating a user account.


    | Command | Description |

    | :--- | :--- |

    | `useradd <user-name>` | Adds a new user. |

    | `useradd -d <path-to-new directory> <user-name>` | Creates a user with a different
    home directory. The default home directory is `/home/user-name`. |

    | `useradd -M <user-name>` | Adds a user without a home directory. When the user
    logs in, the home directory will be the root directory. |

    | `useradd -u <user-id-number> <user-name>` | Creates a user with the specified
    user id. |

    | `useradd -u <user-id-number> -g <group-id number> <user-name>` | Creates a user
    with the specified user id and group id. |

    | `useradd -G <group-name1 group-name2> <user-name>` | Adds users to multiple
    groups. These groups should already exist in the system. |

    | `useradd -e <year-month-day> <user-name>` | Creates a user account with an expiry
    date. |

    | `useradd -e <year-month-day> -f 60 <user-name>` | Creates a user account with
    an expiry date, where the password is set to expire after 60 days. |


    We can get the information of a specific user using `getent passwd <user-name>`.


    ![](image_rsrc2R1.jpg)


    ## How to Create Groups


    When you create accounts for users, these users naturally belong to groups such
    as departments. So, you may have to create group accounts for different departments.
    It is usually advisable to create groups first before creating the users so that
    users can be assigned to specific groups that exist when creating the users. If
    users are created before the groups are created, then you will need to edit the
    user account information inside the `/etc/passwd` file to include group information,
    which is additional work.


    `groupadd <group-name>` is used to create a secondary group. Now, let’s create
    a group called `engineers`.


    ![](image_rsrc2R2.jpg)


    When a group is created, the group account information is stored in the `/etc/group`
    file. We can use `cat /etc/group` to display the groups and their corresponding
    group IDs.


    ![](image_rsrc2R3.jpg)


    We can use the `groupadd --help` command to check the various options available
    for adding groups.


    ![](image_rsrc2R4.jpg)


    Commonly used commands for creating groups are as follows:


    | Command | Description |

    | :--- | :--- |

    | `groupadd <group-name>` | Adds a new group. |

    | `groupadd -g <group id number> <group-name>` | Adds a new group with the specified
    group ID. |

    '
