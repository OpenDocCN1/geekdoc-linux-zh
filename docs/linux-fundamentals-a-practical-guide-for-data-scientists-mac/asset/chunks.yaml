    1. 首先，从 VS Code 下载页面下载 .deb 文件：[`code.visualstudio.com/download`](https://code.visualstudio.com/download)


    ![](img/image_rsrc2VS.jpg)


    2. 运行命令 `sudo apt install </path-to-file.deb>` 来安装 VS Code。


    3. 你可以通过运行命令 `code </path-to-file-name>` 来使用 VS Code 创建新文件或打开现有文件。


    ![](img/image_rsrc2VT.jpg)这里是文件在 VS Code 中的外观。![](img/image_rsrc2VU.jpg)


    # 机器学习应用


    本项目的目标是构建一个预测房价的机器学习模型，然后将该模型部署为 Web 应用程序，使用户可以通过浏览器访问该模型进行预测。用于构建模型的数据集输入数据包含若干属性，例如以年为单位房龄（`house_age`）、距离最近地铁站的距离（以米为单位，`distance_to_nearest_MRT_station`）、步行生活圈内便利商店的数量（`convenience_stores`）。输出变量是单位面积房价（`house_price_of_unit_area`），其中
    1 单位面积 = 3.3 平方米。为了保持此应用程序简单，排除了与房屋位置相关的其他属性。我们希望更多关注将机器学习模型部署为 Web 应用程序涉及的步骤。数据集包含
    114 个实例，将按照 80:20 的比例划分为训练集和测试集。以下是数据集中的几个实例。![](img/image_rsrc2VV.jpg)可以通过链接访问整个数据集：[`raw.githubusercontent.com/nfonsang/ML_App/main/house_price_data.csv`](https://raw.githubusercontent.com/nfonsang/ML_App/main/house_price_data.csv)。可以通过此机器学习仓库找到原始数据集：[`archive.ics.uci.edu/ml/datasets/Real+estate+valuation+data+set`](https://archive.ics.uci.edu/ml/datasets/Real+estate+valuation+data+set)。


    ## 应用树结构


    ![](img/image_rsrc2VW.jpg)


    应用程序目录结构如所示。这意味着应用程序目录（`ML_APP`）将包含的文件，包括 `app.py`、`house_price_data.csv`、`lin_reg.pkl`、`model.py`、`README.md`、`requirements.txt`，以及包含
    `input.html` 和 `output.html` 文件的 templates 目录。在后续章节中，我们将创建应用程序目录及其内容。


    ### ML_APP 目录


    我们将在项目目录下创建应用程序目录（`ML_APP`）。我们还将项目目录中已有的 `requirements.txt` 移动到 `ML_APP` 目录。![](img/image_rsrc2VX.jpg)


    ### model.py


    我们将在 ML_APP 目录中创建一个 `model.py` 文件。`model.py` 文件将用于构建和评估预测模型。最终目标是学习部署机器学习应用程序所涉及的过程。因此，我们将更多地关注模型部署，而不是模型的实验和比较。我们将构建一个简单的线性回归模型，并使用
    r 方系数（r-squared）对其进行评估。这里是 `model.py` 模块的代码![](img/image_rsrc2VY.jpg)![](img/image_rsrc2VZ.jpg)你可以在这里找到
    `model.py` 文件：[`github.com/nfonsang/ML_App/blob/master/model.py`](https://github.com/nfonsang/ML_App/blob/master/model.py)让我们在终端中使用命令
    `python3 model.py` 运行模型![](img/image_rsrc2W0.jpg)让我们检查 ML_APP 目录，确保模型已保存在该目录中![](img/image_rsrc2W1.jpg)我们可以看到模型已以
    `lin_reg.pkl` 的命名保存在 ML_APP 目录中。


    ### 输入请求 HTML 表单


    我们将创建一个名为 `input.html` 的输入请求 html 表单，它将通过浏览器从用户处收集输入数据。然后输入数据将被提交并处理以进行预测。也就是说，通过
    `input.html` 表单收集的数据将提交到应用程序服务器以请求预测。这里是 `input.html` 表单的代码![](img/image_rsrc2W2.jpg)![](img/image_rsrc2W3.jpg)![](img/image_rsrc2W4.jpg)![](img/image_rsrc2W5.jpg)你可以使用命令
    `firefox <path/file-name.html>` 在 Firefox 等浏览器中打开 html 文件。如果 Google Chrome 是你的默认浏览器，你可以使用命令
    `see <path/file-name.html>` 在 Chrome 中打开 html 文件![](img/image_rsrc2W6.jpg)这里是表单在网络浏览器中的外观![](img/image_rsrc2W7.jpg)


    ### 输出 HTML 文件


    我们需要另一个模板来显示提交的输入数据的预测结果。该模板命名为 `output.html`。`output.html` 文件所示![](img/image_rsrc2W8.jpg)![](img/image_rsrc2W9.jpg)


    ### app.py


    随后我们将构建一个名为 `app.py` 的 Flask 应用程序，用于部署机器学习应用。这里是 `app.py` 的代码![](img/image_rsrc2WA.jpg)![](img/image_rsrc2WB.jpg)![](img/image_rsrc2WC.jpg)使用以下步骤构建
    flask 应用：


    1. 首先导入必要的包和模块，如 `request`、`render_template`、`joblib`。

    2. 使用 `app = Flask(__name__)` 将应用程序设置为 `app.py` 模块的。

    3. 使用 `@app.route("/")` 将函数（即 `home()`）绑定到首页 URL。因此，当在浏览器中运行首页时，将调用函数来渲染模板。`home()`
    函数设计用于渲染 `input.html`。如果你在 Linux 上运行应用程序，默认首页将是 `localhost:5000`。运行应用程序的服务器 IP
    地址为 `127.0.0.1`，应用程序监听端口 `5000`。

    4. 第二个函数 `output()` 用于获取提交到 `/output` 端点或 URL 的输入数据。数据通过 `input.html` 表单提交。记得
    `input.html` 表单的 `action` 和 `method` 属性定义为 `action="output"` 和 `method="POST"`。这意味着点击
    `input.html` 表单的提交按钮后，表单中的输入值将发送到 `/output`，浏览器将加载 `/output` URL。由于 `output()`
    函数绑定到 `/output` URL，当加载该 URL 时将调用 `output()` 函数。当调用 output 函数时，它会检查调用 URL 是否是通过
    POST 请求加载的。如果是通过 POST 请求加载，函数将获取发送到 `/output` URL 的输入数据。`request.forms.values()`
    方法提取通过 POST 请求提交到 `/output` URL 的值。然后加载模型并将提取的输入数据传递给 `model.predict()` 方法进行预测。预测值随后被传递给
    `output.html` 页面并渲染 `output.html` 页面。

    5. `app.run()` 方法在特定的主机 IP 地址上运行应用。host 的默认值为 `127.0.0.1`。将 `host` 设置为 `0.0.0.0`
    可以使应用程序从本地机器上的任何 IP 地址访问。


