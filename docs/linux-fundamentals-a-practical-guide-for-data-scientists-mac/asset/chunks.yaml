    # Run the Machine Learning Application


    To run the machine learning flask application (`app.py`) on the terminal, the
    command `flask run` could be used. Make sure to first navigate to the directory
    containing the `app.py` file before executing the `flask run` command.


    ![](image_rsrc2WD.jpg)


    ## Enter the Input Data


    When the application starts running, you can copy the URL (`[http://127.0.0.1:5000](http://127.0.0.1:5000)`)
    where the application is running and execute it on a browser. The `input.html`
    page will be displayed so you can enter the input data to be used for prediction
    as shown below. After entering the input data, hit the submit button.


    ![](image_rsrc2WE.jpg)


    When the submit button is clicked, the prediction will be made and displayed on
    the “/output” page as shown below.


    ![](image_rsrc2WF.jpg)


    You have learned how to deploy a machine learning Flask application as a web service
    in Linux.


    # 16 Connecting to a Remote Linux Instance


    This chapter covers how to connect to a remote Linux instance such as an Amazon
    EC2 Linux instance. The chapter discusses how to connect to an EC2 instance through
    a local Windows machine using `PuTTY` as well as how to connect to an EC2 instance
    from a local Linux machine using the `SSH` client.


    ## Requirements for Connecting a Local Machine to a Remote Linux Instance


    To connect to a remote Linux machine in the cloud, a secure protocol such as `SSH`
    (Secure Shell or Secure Socket Shell) is popularly used. To establish an `SSH`
    connection to a remote Linux machine or server, an `SSH` client needs to be installed
    on the local machine. An `SSH` client is an application on your local computer
    that allows you to connect to a server. An `SSH` client could be command line
    based (for example; `Putty`) or GUI based (for example; `TeamViewer`).


    To securely connect a local Linux machine to a remote Linux server, an `SSH` client
    called `OpenSSH` is popularly used. To securely connect a local Windows machine
    to a remote Linux server, the `Putty` client is used. In the next section, we
    will see how to launch an Amazon EC2 Linux Instance and connect to it using `PuTTY`
    or `SSH` clients.


    ## How to Launch an Amazon EC2 Linux Instance


    First create an AWS Account. You can create the AWS Free Tier Account using this
    link: `[https://aws.amazon.com/free/](https://aws.amazon.com/free/)`.


    ![](image_rsrc2WG.jpg)


    The AWS Free Tier account has limits on how much compute capacity, storage, databases,
    etc., could be used for free for 12 months following your initial sign up to AWS.


    ![](image_rsrc2WH.jpg)


    After creating your AWS account, sign into the management console and click on
    `Services`, then click on `EC2` (under the Compute category).


    ![](image_rsrc2WJ.jpg)


    When you click on the `EC2 Instance`, you will be taken to the `EC2 Dashboard`
    where you can launch the instance by clicking on the `Launch instance` button.


    ![](image_rsrc2WK.jpg)


    When you click the launch instance button, you will then follow some steps to
    launch the instance.


    - **Step 1: Choose an Amazon Machine Image.** You could choose an `Ubuntu Server`
    and click `Select`.


    ![](image_rsrc2WM.jpg)

    - **Step 2: Choose an Instance Type.** You may leave the default instance type
    and click on `Next: Configure Instance Details`.


    ![](image_rsrc2WN.jpg)

    - **Step 3: Configure Instance Details.** You may leave the default details and
    click on `Next: Add Storage`.


    ![](image_rsrc2WP.jpg)

    - **Step 4: Add Storage.** You may leave the default storage and click on `Next:
    Add Tag`.


    ![](image_rsrc2WR.jpg)

    - **Step 5: Add Tag.** You may leave the default `Tag` and click on `Next: Configure
    Security Group`.


    ![](image_rsrc2WS.jpg)

    - **Step 6: Configure Security Group.** You may leave the default configuration
    and click on `Launch and Review`.


    ![](image_rsrc2WT.jpg)

    - **Step 7: Review Instance Launch.** Click on `Launch`.


    ![](image_rsrc2WU.jpg)


    While launching the instance, you will be asked to select an existing key pair
    or create a new key pair. You may create a new key pair and download the key as
    a `.pem` file


    ![](image_rsrc2WV.jpg)


    The `.pem` file will automatically download into the `Downloads` directory of
    your local computer. After downloading the `.pem` file, click on the `Launch Instance`
    button to launch the instance. You will be taken to the `Launch Status` page.


    ![](image_rsrc2WW.jpg)


    Click on the `instance id` on the `Launch Status` page to view the running instance
    on the `EC2 dashboard`.


    ![](image_rsrc2WX.jpg)


    You would notice that the name of the running instance is not included on the
    dashboard. You can label the instance by editing the instance name. Then, click
    on the `instance ID` to view the instance summary, including the IP addresses.


    ![](image_rsrc2WY.jpg)


    Note that you can right click on the instance to stop it, start it, or terminate
    it.


    ## The Name of an Amazon EC2 Instance


    The name of the EC2 instance that is running on AWS depends on the Amazon Machine
    Image being used.

    - The instance name `ec2-user` is used for Amazon Linux 2, the `Amazon Linux AMI`,
    `Fedora AMI`, `RHEL AMI`, and `SUSE AMI`.

    - The instance name `ubuntu` is used for the `Ubuntu AMI`, and the instance name
    `root` is used for `RHEL AMI` and `SUSE AMI` as well.

    - The instance name `centos` is used for `CentOS AMI`.


    The remote instance name is needed when connecting to the instance. Generally,
    if `ec2-user` or `root` does not work, check with the AMI provider for the instance
    name.


    ## How to Connect to an EC2 Instance from a Linux Terminal


    - Make sure the EC2 instance is launched. During the launching process, create
    a key pair and download the private key (`.pem`) into a folder on your local computer.

    - Check that the instance has passed its status checks. You can view this information
    in the `Status` column on the instance page.

    - In the terminal, use the `SSH` command to connect to the instance. Note that
    the `.pem` file was automatically downloaded into the `Downloads` directory. So,
    you may navigate to the `Downloads` directory to set the permissions on the `.pem`
    file.


    ```bash

    chmod 400 /path/to/key-pair.pem

    ssh -i /path/to/key-pair.pem username@instance-ip-or-dns

    ```


    Based on the EC2 instance created for this lesson, the following command will
    be executed to ssh into the instance:


    ![](image_rsrc2WZ.jpg)

    ![](image_rsrc2X0.jpg)


    Executing the `ssh` command as shown in this illustration above will take you
    into EC2 instance.


    ![](image_rsrc2X1.jpg)


    ```

    ubuntu@ip-172-31-42-198:~$

    ```

    You can start working inside your EC2 instance now.


    ![](image_rsrc2X2.jpg)


    ## How to Connect to an EC2 Instance from a Windows Machine


    Make sure your remote instance is launched. Verify that the instance is ready
    (has passed its status check) using the `Status` column on the instance page.
    To connect a Windows machine to a remote instance, the Windows machine needs to
    have `PuTTY`, a free `SSH` client.


    - Download `PuTTY` (`putty.exe`) from the PuTTY download page: `https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html/`.


    ![](image_rsrc2X3.jpg)


    - Download the `PuTTYgen` from the same PuTTY download page: `https://www.chiark.greenend.org.uk/~sgtatham/putty/latest.html/`.


    ![](image_rsrc2X4.jpg)


    - Using the `PuTTYgen`, convert the `.pem` file that was downloaded to a `.ppk`
    file.

