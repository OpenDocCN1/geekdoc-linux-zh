    # 9 Text Processing

    In this chapter, we will learn how to filter and search for text in files using
    different commands including `cut`, `paste`, `tr`, `tee`, `sort`, `grep`, and
    `find`.


    ## The cut Command

    The `cut` command is used to extract sections from each line of a file. Let’s
    consider the following files, `myfile.txt` and `students.txt`:![](image_rsrc2RR.jpg)


    Let’s extract the first character of every line using the command, `cut c<position-of-character>
    <file-name>`. The command `cut -c1 myfile.txt` extract the first character of
    each line in the file. The command `cut -c6 myfile.txt` extract the sixth character
    of each line in the file as shown below.![](image_rsrc2RS.jpg)


    Let’s extract a group of characters from each line. For example, we can extract
    from the first to the third or sixth to the eighth characters as shown below.![](image_rsrc2RT.jpg)


    The `cut` command really becomes useful when dealing with delimited files. When
    working with delimited files, the delimiter is specified using the `-d` option.
    The specific field to be extracted could be specified using the `-f` option.


    For example, the `student.txt` file is a comma delimited file. A comma delimited
    file can be processed using the command, `cut -d “,” -f<field-position> <file-name>`.![](image_rsrc2RU.jpg)The
    `-f1` argument indicates that the first field of every line should be extracted.


    If you want to avoid any line that does not have a delimiter such as the last
    line in the `students.txt` file, you can specify the `-s` option.![](image_rsrc2RV.jpg)


    We can extract the first and second field using the argument `-f1-2`.![](image_rsrc2RW.jpg)


    Let’s extract the names and the ethnicities of the students in the `students.txt`
    file. Since the names and ethnicity appear on fields 1 and 4 respectively, we
    will use the argument `-f1,4`.![](image_rsrc2RX.jpg) We can replace the delimiter
    in the output with another delimiter by including the `--output-delimiter=“<delimiter>”`
    option.![](image_rsrc2RY.jpg)Let’s look at a practical application for the `cut`
    command. Let’s suppose you want to extract the names and home directories of the
    last three accounts in the `/etc/passwd` file. This could be done using the command,
    `tail -3 /etc/passwd | cut -d“:” -f1,6`.![](image_rsrc2RZ.jpg)


    ## The paste Command

    The `paste` command is used to merge lines of files horizontally. Hence, `paste`
    is good for stacking fields from different files horizontally. Let’s consider
    the `ethnicity.txt` and `names.txt` files.![](image_rsrc2S0.jpg)We can use `paste
    <file1 file2 …>` to merge the specified files. Let’s merge the `names.txt` and
    `ethnicity.txt` files using the command, `paste names.txt ethnicity.txt`.![](image_rsrc2S1.jpg)We
    can decide to specify a delimiter to separate text from different files by including
    the `-d “delimiter”` option.![](image_rsrc2S2.jpg)We can also use the `-s` option
    to paste one file at a time in a serial manner.![](image_rsrc2S3.jpg)The `paste`
    command could be piped with the `cat` command to paste items such as one, two
    or three items per line by including the dash(es) after the `paste` command. The
    number of dashes indicate the maximum number of items that can be pasted on each
    line.![](image_rsrc2S4.jpg)The `paste` command could be used with input redirection
    as well.![](image_rsrc2S5.jpg)


    ## The tr Command

    `tr` stands for translate and is used to delete characters or translate characters
    into other characters. For example, `echo “abcd” | tr “d” “1”` will replace the
    `d` in the `abcd` with `1`. Also, `echo “abcd” | tr “cd” “12”` will replace `c`
    with `1` and replace `d` with `2`.![](image_rsrc2S6.jpg)Let’s replace uppercase
    “A” and “B” in the `ids.txt` file with lowercase “a” and “b” respectively![](image_rsrc2S7.jpg)We
    can convert all lowercase text to uppercase using `tr [a-z] [A-Z]` or `tr [:lower:]
    [:upper:]`.![](image_rsrc2S8.jpg)Let’s convert all spaces to vertical bars using
    the command, `tr “ “ “ ” <file-name>`.![](image_rsrc2S9.jpg)The `tr` command can
    be practically used to remove multiple spaces in a text. In this situation we
    can use the command `cat <file-name> | tr -s “ “ “ ”` to squeeze different types
    of multiple spaces into a single space.We can also use the `tr -d <character(s)>`
    command to delete a character or characters from a given text. For example, `cat
    names.txt | tr -d “Mary”` deletes the characters; “M”, “a”, “r” or “y” wherever
    those characters are found in each line of text.![](image_rsrc2SA)Let’s delete
    all numbers in the `ids.txt` file using `cat ids.txt | tr -d [0-9]` or `cat ids.txt
    | tr [:digit:]`.![](image_rsrc2SB)


    ## The tee Command

    This command takes the standard input and writes it to the standard output and
    files. To see how this command works, let’s first list the files in the project
    directory.![](image_rsrc2SC)We can then write the output that normally displayed
    on the terminal into `output.txt` file using the command, `ls -l | tee output.txt`.![](image_rsrc2SD)If
    we check the project directory again, we will find the `output.txt` file.![](image_rsrc2SE)Practically,
    this `tee` command can be used with the `grep` command if we want to output to
    a file, then search the file for a specific keyword. For example, `ls -l | tee
    output.txt | grep myfile` will help us search for files that have the name `myfile`
    inside `output.txt` file.


    ## The sort and uniq Commands

    We can use the `sort` command to sort a list of items while the `unique` command
    is used to extract unique items from a list in a file. Let’s use `sort <file-name>`
    to sort the `names.txt` file![](image_rsrc2SF)To get unique items, we need to
    first sort the items, then pass the sorted items to the `uniq` command. That is,
    we can use `sort <file-name> | uniq` to find unique items in the specified file.We
    can display duplicates by including the `-d` option for the `uniq` command. That
    is, we can use `sort <file-name> | uniq -d`.![](image_rsrc2SH)We also sort numbers
    by including the `-n` option to the `sort` command. That is, we could use `sort
    -n <file-name>`.![](image_rsrc2SJ)The `-r` option of the `sort` command will sort
    items in reversed order. For example, we can use `sort -n -r <file-name>` to sort
    numbers in reversed order.![](image_rsrc2SK)The `-u` option allows us to eliminate
    duplicates when sorting items. For example, `sort -u <file-name>` will sort the
    file and display only unique items![](image_rsrc2SM)


    ## The find Command

    We can use the `find` command to search for files recursively starting from a
    given directory. The command `find <directory-path-to-search> -name <file-name>`
    is used. We can find the file `myfile.py` recursively from the current directory
    as follows using `find . -name myfile.py`.![](image_rsrc2SU)The `find` command
    displays the path(s) of the file we are searching. Note that, we can also find
    the file `myfile.py` recursively from the home directory using the `find ~ -name
    myfile.py` command![](image_rsrc2SV)To ignore the cases (uppercase and lowercase
    letters), you can include the `-i` option. For example, `find . -iname myfile.py`
    will find `myfile.py` while ignoring lowercase and uppercase letters in the file
    name. Therefore, this command can display the path of files with file names such
    as `Myfile.py`, `MyFile.py`, etc.The file type could be specified through the
    `-type` option. For example, `find /home -type d -name project` will recursively
    search (starting from the home directory) for directories called `project`.image_rsrc2SW)The
    `-type f` option could be included to the `find` command, to search for regular
    files. We could use wildcard, such as `*.txt` to search all files that end with
    the `.txt` extension![](image_rsrc2SX)Files with certain permissions can be searched
    by using the option `-perm <permission number>` such as `-perm 777`. So, `find
    <directory-to-search> -type <file-type> -perm <permission-number-of-files-to-be-searched>`
    could be used to find files by type and by permissions.image_rsrc2SY)After finding
    these files, we can execute the files by modifying them in one way or the other.
    For example, we can set new permissions to the searched files by including the
    `-exec chmod <permissions>` option. `find . -type f -perm 777 -exec chmod 755
    {} \;` will find files and change their permissions.image_rsrc2SZ

