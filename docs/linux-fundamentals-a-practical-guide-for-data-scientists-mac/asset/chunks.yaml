    # 13 自定义 Shell 环境


    本章将演示如何自定义 shell 环境。你将学习如何使用如 `PS1` 和 `PS2` 等环境变量来自定义 shell 提示符。


    命令行是计算机的文本界面，可以在其中输入命令。它允许我们运行命令来与计算机程序交互。它也被称为 shell、终端、控制台、提示符等。


    shell 提示符是屏幕上显示应输入命令的标记。默认情况下，shell 提示符由用户名、计算机名和美元符号组成。提示符通常显示为：`username@localhost:
    ~$`。例如![](img/image_rsrc2U2.jpg)


    在 Linux 中，普通用户的 shell 提示符以美元符号（`$`）结束，而 root 用户的 shell 提示符以井号（`#`）结束。


    ## 自定义 Shell 提示符


    你可以通过将主提示符变量（`PS1`）的值设置为另一个值来自定义你的 shell 提示符。例如，`PS1="ubuntu : "` 将提示符更改为 `ubuntu
    :`![](img/image_rsrc2U3.jpg)


    `PS1="\u $"` 将将提示符更改为你的用户名。

    `PS1="\h $"` 将将提示符更改为你的主机名（计算机名![](img/image_rsrc2U4.jpg)


    要将提示符值设置为 `username@hostname $`，你可以使用命令 `PS1="\u@\h $ "`![](img/image_rsrc2U5.jpg)


    你还可以通过包含 `(\t)` 或 `(\T)` 来显示时间。然后，`(\d)` 显示日期，`(\s)` 显示 bash shell 名称，而 `(\v)`
    显示 bash 版本![](img/image_rsrc2U6.jpg)


    `\w` 也可以用于将 shell 提示符的值设置为工作目录的路径![](img/image_rsrc2U7.jpg)


    可以使用 `$PS1` 显示提示符变量的值![](img/image_rsrc2U8.jpg)


    `PS2` 是一个续行交互式提示符，允许我们使用反斜杠（`\`）将一个非常长的命令拆分为多行。多行的默认交互式提示符为 `"> "`。当上一行以反斜杠（`\`）结束时，交互式提示符
    `"> "` 就会出现在新行。反斜杠用于指示下一行的命令是上一行的延续。例如![](img/image_rsrc2U9.jpg)


    我们可以将 `PS2` 变量设置为不同的值。例如，我们可以将 `PS2` 的值设置为 `"cont…>"`image_rsrc2UA.jpg)


    ## Bash Shell 特殊文件


    我们可以使用 `ls -a | grep "bash*"` 命令在用户的家目录 `/home/user-name/` 下找到 bash 特殊文件（`.bash_profile`![](img/image_rsrc2UB.jpg)


    `.bash_profile` 文件用于存储终端的环境设置。如果尚未创建 `.bash_profile` 文件，可以使用 `nano ~/.bash_profile`
    创建。当终端会话启动时，`bash_profile` 文件会被加载，文件中的命令会被执行。这是一个 `.bash_profile` 示例，它会打印语句“This
    is a message from .bash_profile”(image_rsrc2UC.jpg)


    现在，让我们使用 `ssh <ip-address>` ssh 登录到本地计算机。我们可以使用 `hostname -I` 查找本地计算机的 IP 地址![](img/image_rsrc2UD.jpg)


    我们现在可以使用 `ssh 10.0.2.15` ssh 进入我们的本地计算机。但是，如果没有安装 `openssh-server`，请确保先运行 `apt-get
    install openssh-server` 命令来安装 `openssh-server`。为了确保 `openssh-server` 正在运行，你可以运行命令
    `service ssh restart`，然后运行 `systemctl status ssh` 查看 `openssh-server` 的状态。此外，还要确保
    `Port 22` 已启用。为此，打开 `/etc/ssh/ssh_config` 文件并取消注释 `Port 22`image_rsrc2UE.jpg)![](img/image_rsrc2UF.jpg)


    现在让我们 ssh 登录本地主机，你会发现当你 ssh 登录 localhost 时，`.bash_profile` 文件会运行![](img/image_rsrc2UG.jpg)![](img/image_rsrc2UH.jpg)


    ## 别名命令 (Alias)


    你可以使用 `alias` 命令创建自己的命令。让我们向 `.bash_profile` 文件中添加 `alias` 命令以定制终端环境设置。`alias`
    命令在每次我们启动终端会话时都会运行。让我们包含以下别名命令，例如：


    - `alias ll=''ls -lh''` 以长格式和易于人类的格式列出文件。

    - `alias homelist=''ls ~''` 显示家目录的内容。

    - `alias profilels=''ls ~/.bash*''` 显示家目录中的所有 bash 文件。


    image_rsrc2UJ.jpg)


    添加到 `.bash_profile` 中的 `alias` 命令将允许我们在启动终端会话后使用 `alias` 命令。别名非常有用，特别是当你需要链式执行一组命令时，你可以对命令进行管道操作，然后使用
    alias 为它们命名![](img/image_rsrc2UK.jpg)


    ## 变量、环境变量和 source 命令


    变量是指向值的占位符或名称。使用命令 `<variable-name> = <value>` 创建变量。如下所示，可以使用 `echo $<variable-name>`
    输出变量的值![](img/image_rsrc2UM.jpg)


    我们可以使用 `env` 命令列出所有环境变量。让我们使用 `env | tail -5` 查看最后五个环境变量 image_rsrc2UN.jpg)


    你会发现 `HOME` 是一个环境变量，值为 `/user-name/`。创建一个环境变量，我们需要使用 `export` 命令。例如，`export DATABASE="mysql"`，这意味着我们不仅可以通过主
    shell 访问它的值，还可以子 shell 访问(image_rsrc2UP.jpg)


    注意，我们可以将 `export` 命令包含在 `.bash_profile` 文件中，以便每次登录系统时运行它。这意味着可以在 bash 中设置环境变量。


    我们可以使用 `source` 命令手动将 `.bash_profile` 文件加载到内存中。在这种情况下，我们不需要 ssh 进入系统即可执行它。例如![](img/image_rsrc2UR.jpg)


    `source` 命令用于执行文件的内容。


