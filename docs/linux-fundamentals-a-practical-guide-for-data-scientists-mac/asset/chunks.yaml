    # 15 部署机器学习模型


    在本章中，我们将使用 Linux 机器开发、评估并部署一个机器学习应用作为 Web 服务。你将学习如何安装所有必要的包、创建虚拟环境、构建机器学习模型，并将其部署到浏览器中，通过浏览器使用模型进行预测。你还将看到如何在
    Linux 中安装和使用 VS code。


    ## 安装 Python


    机器学习模型将作为 Python 中的 Flask 应用构建。因此，我们首先需要检查计算机上是否安装了 Python。我们可以使用 `python --version`
    命令检查 Linux 系统是否安装了 Python。![](img/image_rsrc2VH.jpg)


    如果 Python 未安装，我们可以运行以下命令安装 Python 3


    ## 安装 pip


    为了构建应用，我们需要先安装 Python 的包管理器 `pip`。要安装 `pip`，可以使用以下两个命令：


    ```

    sudo apt update

    sudo apt install python3

    ```

    ![](img/image_rsrc2VJ.jpg)


    ## 创建虚拟环境


    首先安装名为 `virtualenv` 的 python 模块，这将用于创建虚拟环境。可以使用如下命令：

    ```

    sudo pip3 install virtualenv

    ```

    ![](img/image_rsrc2VK.jpg)


    使用 `virtualenv` 创建虚拟环境。在项目目录下创建一个名为 `proj_env` 的虚拟环境。我们将首先进入项目目录，然后运行：

    ```

    virtualenv proj_env

    ```

    ![](img/image_rsrc2VM.jpg)


    ## 激活虚拟环境


    要激活虚拟环境，我们可以运行命令 `source <虚拟环境目录/bin/activate>`。例如，如果虚拟环境目录 `proj_env` 在项目目录下，我们可以运行：

    ```

    source proj_env/bin/activate

    ```

    这将激活虚拟环境![](img/image_rsrc2VN.jpg)虚拟环境有助于我们为特定项目隔离 Python 包或依赖。


    ## 安装必要的包


    现在虚拟环境已激活，我们可以安装项目所需的 Python 包。为了使用单个命令安装多个包，我们可以创建一个名为 `requirements.txt` 的文件，并将包名及其版本写入文件。每个包名和版本按如下单行写入文件：

    ![](img/image_rsrc2VP.jpg)


    在创建包含要安装包的 `requirements.txt` 文件后，可以使用以下命令安装包：

    ```bash

    pip install -r requirements.txt

    ```


    如果虚拟环境已激活且你运行命令 `pip3 freeze`，则环境中安装的所有包都将显示出来。例如，这里是 `proj_env` 虚拟环境中的包。![](img/image_rsrc2VR.jpg)与其在终端显示这些包，不如将这些包重定向到文本文件中，以便以后在其他机器上使用该文件创建相同的环境。注意，我们可以使用
    `sudo apt-get install` 命令安装包。例如，要安装 `numpy`、`scipy`、`matplotlib` 和 `pandas`，我们可以运行以下命令：

    ```bash

    sudo apt-get install python-numpy python-scipy python-matplotlib python-pandas

    ```


    ## 安装 Visual Studio Code


    Visual Studio (VS) Code 编辑器比 `nano` 编辑器更容易编辑大文件。请参 VS Code 关于在 Ubuntu 中安装 VS Code
    的文档：[`code.visualstudio.com/docs/setup/linux`](https://code.visualstudio.com/docs/setup/linux)。安装和使用
    VS Code：


