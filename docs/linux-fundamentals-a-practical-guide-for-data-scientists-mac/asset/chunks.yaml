    - The interactive process (or foreground process): This process runs at the foreground
    or via the Linux terminal. Users interact with such processes.

    - Non-interactive process (or background process): This is the process that runs
    in the background and users do not have to interact with the process. To run a
    command in the background, we can include `&` (ampersand) after the command. The
    command runs in the background and the prompt is released back to the user.

    - Daemons are long running processes in the background waiting for some instruction.


    ## Process Related Commands


    | Command | Purpose |

    | :--- | :--- |

    | `ps` | Used to view the list of processes. |

    | `kill` | Used to kill a process. |

    | `nohup` | Used to make a process run after logging out. |

    | `nice` | Used to set the nice value of a process to determine whether the process
    is a priority. |

    | `time` | Used to get time statistics of a command or process. |


    Note that `ps -a` will list all processes including those that are running in
    the background. We could use piping to pass the output generated by the `ps -a`
    command into the `head -<n>` command to view the first `n` processes.![](image_rsrc2T3.jpg)
    `ps -af` will provide more details.![](image_rsrc2T4.jpg) We could alternatively
    use `ps -aux` to display processes for all users.![](image_rsrc2T5.jpg) `ps -u
    <user-name>` will display processes run by the specified user. `ps -g <group-name>`
    will display processes owned by the specified group.![](image_rsrc2T6.jpg) `ps
    -f <process-id1, processid2,...>` will display the specified processes that are
    running.![](image_rsrc2T7.jpg)


    Note that the command `pstree` displays a tree of processes. We can use `ps L
    | more` to display the different fields that come with the output of the `ps`
    command such as `PID`, etc. The output of the `ps L | more` can be passed into
    the `grep "field-keyword"` command to extract fields with a specific keyword.![](image_rsrc2T8.jpg)
    As such we can specify which fields we want to display when we use the `ps` command.
    The `ps -ao <field>` can be used to specify the fields that should be displayed.
    For example:

    - `ps -ao pid` can be used to retrieve only IDs of current processes.

    - `ps -ao user` can be used to display users associated with the processes that
    are currently running in the system.![](image_rsrc2T9.jpg)


    ### The nohup Command

    The `nohup` (No Hang Up) command is used to run a program or process in the background
    such that the program keeps on running even after the user closes the shell or
    terminal. Normally, when you exit or close the terminal, every current process
    that was started through the terminal also terminates. However, the `nohup` command
    helps a process to run even when the terminal is closed. Also, the output that
    was supposed to be displayed in the standard output at the terminal is redirected
    to a `nohup.out` file. The `nohup` command precedes the command that normally
    runs the file.


    For example, to run a Python file, we can use `python3 <file-name.py>`. To run
    the same Python file with no hang up, we can use `nohup python3 <file-name.py>`.
    Let’s run an infinite while loop inside the `myfile.py` using the `nohup` command
    to illustrate how the `nohup` command works. An infinite while loop runs continuously
    until the loop is manually terminated or interrupted. The Python file `myfile.py`
    can be run with no hang up using the command, `nohup python3 myfile.py &`.![](image_rsrc2TA.jpg)


    When you run a `nohup` command, a `nohup.out` file is created in the current directory.
    Even when we exit the terminal, the process will still be running in the `nohup.out`
    file.![](image_rsrc2TB.jpg) We can use the `tail -f nohup.out` command to view
    the process that is currently running in the `nohup.out` file. The output of the
    infinite while loop is appended to `nohup.out` file.![](image_rsrc2TC.jpg)


    ### The time Command

    The `time` command is used to run a program to show the summary of system resource
    usage. So, `time python3 myfile2.py` will run the python file and display a system
    resource usage.![](image_rsrc2TD.jpg)


    - `real` refers to the total time taken to run the script or command from start
    to finish.

    - `user` refers to the CPU time consumed by your program in user-mode (outside
    the kernel). It is the actual CPU time used in executing the process.

    - `sys` is the CPU time spent in system calls within the kernel to execute the
    program.


    ## Signals

    A signal is a message sent to a process. A parent process and a child process
    could send signals to each other. Signals have names and numbers. The following
    are examples of signals:


    | Signal number |

    | :--- |

    | 1 |

    | 2 |

    | 3 |

    | 9 |

    | 15 |

    | 24 |


    If you want to tell a process to terminate, you can send signal 3 or signal 9
    to tell the process to terminate. Note that all the signals supported by the operating
    system can be listed using the `kill -l` command as shown below (Note that every
    signal has a name and a number).![](image_rsrc2TE.jpg)


    ### The kill Command

    The `kill` command is used to terminate a process. We can terminate a process
    using the process ID. It is possible to give multiple IDs to the `kill` command.
    Note that we can retrieve process IDs using the `ps` command. Let’s run the `sleep`
    command in the background using `&` for 300 seconds.![](image_rsrc2TF.jpg) Then,
    let’s kill the sleep process using its process ID.kill -9`. Note that we can search
    for other processes using `ps -ef grep <process-name>`.![](image_rsrc2TG.jpg)
    We can terminate multiple processes at the same time. The `-9` argument which
    represents the kill signal needs to be included in the `kill` command. For example,
    `kill -9 2346 2348` will terminate the processes.![](image_rsrc2TH.jpg) The process
    name can also be passed to the `pkill` command to terminate the process. For example,
    `pkill sleep`.![](image_rsrc2TJ.jpg)


    ### The Job Control Commands (jobs, fg, bg)

    Below are some job control commands and how they are used.


    | Command | Purpose |

    | :--- | :--- |

    | `jobs` | Displays a list of current jobs |

    | `fg` | Brings background jobs to the foreground |

    | `bg` | The `bg` command runs a process in the background. Alternatively, the
    ampersand sign `&` is used at the end of a command to run the command in the background.
    CTRL+Z is used to suspend a foreground process. |


    The sleep commands below are run in the background.![](image_rsrc2TM.jpg) The
    `jobs` command will display the jobs running in the background. Note that every
    job has a number.![](image_rsrc2TN.jpg) To terminate a job, we can use the `kill`
    command and the job number.![](image_rsrc2TP.jpg) If you have a job that is running
    at the foreground, such as an infinite while loop, we can CTRL+Z to suspend the
    job and we can use the `bg` command to resume the process. Here is an example
    a suspended while loop that prints “hello” and “great”.![](image_rsrc2TR.jpg)
    The job can be resumed using the `bg %<job-number>` command.![](image_rsrc2TS.jpg)


    ## 11 Scheduling Jobs

    This chapter illustrates how to schedule a task to run at a particular time or
    repeatedly. Commands such as `at`, `batch`, `cron`, `crontab` will be explored.


    ### Commands for Scheduling Jobs

    The following commands can be used in the Linux system to schedule jobs to be
    executed at certain times.


    | Commands | Purpose |

    | :--- | :--- |

    | `at` | Used for one-time execution at a later time. |

    | `batch` | Used for one-time execution at a later time when the system is under
    less load. |

    | `cron` | Used to execute a job, one time in the future. Cron is the daemon that
    handles cron jobs. |

    | `crontab` | It is the command used to update or modify your crontab entries.
    It is a file that contains instructions to execute a task periodically. |


    The crontab layout is as follows:![](image_rsrc2TT.jpg) The command used for scheduling
    a job includes values representing the columns or fields in the layout. Examples
    of commands used for scheduling a job are as shown on the table below.


    | | Purpose | Example | Meaning |

    | :--- | :--- | :--- | :--- |

