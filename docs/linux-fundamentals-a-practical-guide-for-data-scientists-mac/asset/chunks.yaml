    `cat names.txt | grep “^[A-K]”` will match names that start with letters between
    A and K, but `cat names.txt | grep “^[^A-K]”` will match names that do not start
    with letters between A to K. `[^A-K]` means other letters except letters between
    A to K.![](image_rsrc2RN.jpg)We can use the `-n` option to include the line numbers
