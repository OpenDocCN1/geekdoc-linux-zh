  trans: "\n\n# 安装 VirtualBox\n\n`VirtualBox` 是一款开源虚拟化应用程序，它允许你创建多个虚拟机，在其中可以安装 Linux、Windows、macOS\
    \ 等不同的操作系统。你可以从 [`www.virtualbox.org/`](https://www.virtualbox.org/) 下载与你的操作系统匹配的\
    \ VirtualBox 包并将其安装在计算机上。![](img/image_rsrc2MN.jpg)\n\n打开 VirtualBox，请在电脑上搜索 Oracle\
    \ VM VirtualBox 图标并双击该图标。VirtualBox 界面如下所示![](img/desktop)![](img/` 下的文件 image_rsrc2N6.jpg\n\
    \n## Linux 中的文件类型\n\n在 Linux 中，一切都被视为文件。有不同类型的文件，包括普通文件 (`-`)、目录文件 (`d`) 和特殊文件\
    \ image_rsrc2N7.jpg 普通文件是最常见的文件类型，可以通过多种方式创建。例如；可以使用 `touch` 命令、`vi` 或 `nano`\
    \ 编辑器创建普通文件。普通文件的示例包括文本文件 `.txt`、Python 文件 `.py`、Java 文件 `.java` 等。目录文件可以使用 `mkdir`\
    \ 命令创建。\n\nLinux 中还有用于不同用途的特殊文件。例如：\n\n 块设备文件是控制驱动器和内存等硬件的文件。块设备主要位于 `/dev` 目录。\
    \ 字符文件允许用户和程序与硬件外设备通信。字符文件的经典示例是代表键盘、鼠标、串口打印机的文件。字符文件是以字符方式读写数据的硬件文件。管道文件允许未显式设计为相互协作的应用程序或进程在单台\
    \ Linux 机器上通信。 符号链接文件作为其他文件的链接。这些文件可以视为快捷方式或指针。套接字文件用于在应用程序之间传递信息。\n\n要在 Linux\
    \ 终端显示文件类型，可以使用 `ls -ld <file_name>` 命令。例如，下方的 `ls -ld Downloads` 命令生成的输出包含 `drwxr-xr-x`。`drwxr-xr-x`\
    \ 开头的 `d` 表示 `Downloads` 文件是一个目录 image_rsrc2N8.jpg\n\n或者，可以使用 `file <file-name>`\
    \ 命令显示特定文件的类型。\n\n## 文件命名\n\n*   Linux 中的文件名是大小写敏感的，这意味着名为 `myfile` 的文件与 `Myfile`\
    \ 不同。\n*   文件名中使用的字符可以包括大小写字母、数字、点 (`.`)、下划线 (`_`)、连字符 (`-`) 等。\n\n"
- fmt: "\n- Special characters such as `/`, `*`, `?`, `:`, `&`, `<`, `>`, `{ }`, `(\
    \ )`, should not be used in file names. \n- It should be noted that file extensions\
    \ have no significance but could be included to help us to easily identify file\
    \ types. So, `myfile` is the same as `myfile.txt`.\n\n# Linux Command Structure\n\
    \n- Linux commands are written to perform specific tasks.\n- All commands are\
    \ written using lower case letters.\n- Commands can have no argument, one argument\
    \ or more arguments.\n- The general syntax for Linux commands is `command -argument1\
    \ -argument2`. For example:\n    - `ls`\n    - `ls -ls`\n    - `ls -i -a` (or\
    \ `ls -ls `)\n\nThe `ls` command can take options such as `l` (to produce long\
    \ output), `t` (to produce output that is sorted by modification time), and `--reverse`\
    \ (to produce output in the reversed order) as shown below: `ls -l` is used to\
    \ list files in a long format.![](image_rsrc2NA.jpg) `ls -lt` is used to list\
    \ files in a long format, sorted by modification time.![](image_rsrc2NB.jpg) `ls\
    \ -lt --reverse` is used to list files in a long format sorted in a reversed order\
    \ by modification:![](image_rsrc2NC.jpg) `ls -R` is used to list directories and\
    \ files in the current working directory as well as files in the subdirectories.\n\
    \n## Basic Linux Commands\n\n| Command | Purpose |\n| :--- | :--- |\n| `ls` |\
    \ Used to list directory contents. |\n| `cd` | Used to change directory. |\n|\
    \ `cat` | Used to display file contents. |\n| `who` | Displays users who are currently\
    \ logged into the system. |\n| `uname` | Displays computer information. |\n| `date`\
    \ | Displays the system date and time. |\n| `cal` | Prints the calendar of the\
    \ current month. |\n| `passwd` | Used to change a password. |\n| `hostname` |\
    \ Displays the computer name. |\n| `echo` | Used to display or print a line of\
    \ text. |\n| `bc` | Used to invoke a calculator. |\n| `sudo` | Stands for “super\
    \ user do”. Allows a command to be executed with administrative or root privileges/permissions.\
    \ |\n| `apt-get` | Used to install packages. For example `sudo apt-get install\
    \ python3` could be used to install Python 3. You can use `sudo apt-get update`\
    \ to update your repository each time you want to install a new package. |\n|\
    \ `ping` | Used to check whether you can connect to a server. For example, `ping\
    \ google.com`. |\n| `clear` | Used to clear the terminal. |\n| `man` | Provides\
    \ helpful information about a command. |\n| `history` | Displays a list of past\
    \ commands that have been used in the current terminal. |\n\n# 3 Navigation\n\
    This chapter explores how to navigate the Linux file system. The Linux file system\
    \ has a hierarchical directory structure, which means directories or files can\
    \ be nested inside other directories. The `cd` command, which stands for change\
    \ directory, is used for navigation.\n\n### Explore the Current Working Directory\n\
    The directory where you run commands in Linux is called the current working directory.\
    \ The `pwd` command is used to display the path of the current working directory\
    \ while the `ls` command displays the contents of the current working directory\
    \ as shown below.![](image_rsrc2ND.jpg)![](image_rsrc2NE.jpg) `ls -a`: This command\
    \ is used to list all contents of the current directory including hidden files\
    \ and hidden directories. Hidden files or hidden directories usually start with\
    \ a dot(`.`).![](image_rsrc2NF.jpg)\n\n### Navigation\nThe `cd` command, which\
    \ stands for change directory, is used for navigation. `cd <directory-name>`:\
    \ This command is used to navigate from the current directory to the specified\
    \ directory, which is a subdirectory inside the current directory. The `cd Desktop`\
    \ command will navigate from the current directory to the Desktop directory provided\
    \ Desktop is a subdirectory inside the current directory. That is, `cd Desktop`\
    \ is the same as `cd ./Desktop`.![](image_rsrc2NG.jpg)\n\nAlternatively, to navigate\
    \ from the home directory to the project directory found inside the Desktop directory,\
    \ we can use the `cd` command and specify the path of the project directory in\
    \ a single command as follows:![](image_rsrc2NH.jpg) `cd ..`: `cd` with two dots\
    \ is used to navigate to the parent directory while `cd .` (with a single dot)\
    \ means, remain in the current directory. Note that a single dot represents the\
    \ current directory while two dots represent the parent directory.![](image_rsrc2NJ.jpg)\
    \ `cd` or `cd ~` is used to change to the home directory while `cd /` is used\
    \ to change to the root directory (`/`).![](image_rsrc2NK.jpg)\n\nRelative paths\
    \ start from the current directory (`.`) while absolute paths start from the root\
    \ directory (`/`). Relative and absolute paths can be used for navigation as shown\
    \ below respectively.![](image_rsrc2NM.jpg)\n\n# 4 Working with Files and Directories\n\
    In this chapter, we will take a look at commands used for manipulating files and\
    \ directories. For example, we will examine commands used to create, copy, move,\
    \ rename, remove, and delete files and directories.\n\n### Creating a Directory\n\
    The `mkdir <directory-name>` is used to create a directory or folder.![](image_rsrc2NN.jpg)\
    \ To create multiple directories using a single command, list the names of the\
    \ directories to be created after the `mkdir` command. The names of nearby directories\
    \ in the `mkdir` command should be separated by spaces. For example: `mkdir <directory-name1\
    \ directory-name2 directory-name3>` will create three directories.\n\n### Creating\
    \ a Regular File\nThere are different ways of creating a regular file in Linux.\
    \ One way to create a regular file is by using an editor such as `vi` or `nano`.\
    \ `vi <file-name>` or `nano <file-name>` can be used to create a new file or open\
    \ an existing file. `nano` is more advanced compared to `vi` however `vi` is available\
    \ on all OS. When you use `nano <file-name>` to open the file, you can then write\
    \ to the file and use `CTRL + X` to exit. Below is a Python file created using\
    \ nano myfile.py.![](image_rsrc2NP.jpg) `cat <file-name>` is used to display the\
    \ contents of the file while the command `python3 <file-name>` can be used to\
    \ run the file.![](image_rsrc2NR.jpg) `touch <file-name>` will create an empty\
    \ file.![](image_rsrc2NS.jpg)\n\n### Copying a Directory\nNote that you could\
    \ create a copy of a directory using `cp <directory-name> <directory-copy-name>`.\
    \ Use the `-r` option to copy the directory recursively. That means, if the directory\
    \ being copied has subdirectories or files, you need to use `cp -r <directory-name>\
    \ <directory-copy-name>`.![](image_rsrc2NT.jpg)\n\n### Copying a File\n`cp file1\
    \ file2` is used to copy `file1`, then name it `file2`.![](image_rsrc2NU.jpg)\n\
    \n### Renaming Files\n`mv <file1> <file2>` command renames `file1` to `file2`.\
    \ The illustration below shows how `myfile.txt` is renamed to `myfile1.txt`.![](image_rsrc2NV.jpg)\n\
    \n### Moving a File to Another Directory\nThe `mv` command can also be used to\
    \ move a file to a different directory. For example `mv <file-name> <path-to-new-directory>`\
    \ moves a file to the specified directory.![](image_rsrc2NW.jpg) Note that `sudo`\
    \ is also used at the beginning of the command because admin permission is needed\
    \ to move the file. Also note that the sign `~` stands for the user’s home directory.\n\
    \n### Delete a File\nThe `rm <file-name>` command can be used to delete a file.![](image_rsrc2NX.jpg)\n\
    \n### Delete a Directory\nThe `rmdir <directory-name>` is used to delete an empty\
    \ directory. You would notice that the `rm` command is used to delete files, while\
    \ the `rmdir` command is used to delete directories.![](image_rsrc2NY.jpg) `rm\
    \ -r <directory-name>` is used to delete a directory containing at least a subdirectory\
    \ or a file. That is, the `rm -r` command deletes a directory recursively.![](image_rsrc2NZ.jpg)\n\
    \n### Manipulating Files: Counting the Number of Words in a File\nLet’s first\
    \ create a file using `nano` and write some text to the file as shown below.![](image_rsrc2P0.jpg)\
    \ `wc <file-name>` could be used to count the number of words in the text.![](image_rsrc2P1.jpg)\
    \ `wc <file-name>` produces three numbers and the name of the specified file.\n\
    \n- the first number represents the number of lines in the file,\n- the second\
    \ number represents the number of words in the file,\n- the third number represents\
    \ the number of characters in the file.\n"
