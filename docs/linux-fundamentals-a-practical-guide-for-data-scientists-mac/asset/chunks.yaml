- fmt: '

    - Go to the folder containing the `PuTTYgen.exe` and open the `PuTTYgen.exe`.
    Then, click on the Load button.![](image_rsrc2X8.jpg)

    - select the `.pem` file, then click on `Open`.![](image_rsrc2X9.jpg)

    - After clicking on `Open`, you will see a message indicating that the key has
    been successfully imported as shown below. That means, the `.pem` file has been
    converted to a `.ppk` file which will be used in PuTTY. Click on `Ok`.![](image_rsrc2XA.jpg)

    - Then click on `Save private key`.![](image_rsrc2XB.jpg)

    - Provide a name for the `.ppk` file and click on `Save` to save the file.![](image_rsrc2XC.jpg)


    ### Use PuTTY to connect to the remote Linux instance


    - Open PuTTY (`putty.exe`). Enter the hostname of the remote instance. The hostname
    could be written as `instance-name@IPv4-DSN-address`, for example: `ubuntu@ec2-3-143-243-25.us-east-2.compute.amazonaws.com`](image_rsrc2XD.jpg)

    - Click on `SSH` and `Auth`. Then load the `.ppk` file and click on `Open`.![](image_rsrc2XE.jpg)

    - After clicking on `Open`, a PuTTY security alert will be displayed as shown
    below. Click on the `Accept` button to connect to the instance.

    ![](image_rsrc2XF.jpg)

    - You are now connected to your ec2 instance. You can now work on the Linux instance
    in the same way you would work on your local machine.![](image_rsrc2XG.jpg)


    ### Resources


    1. Open the Amazon EC2 console or sign into your AWS account. [https://console.aws.amazon.com/ec2/](https://console.aws.amazon.com/ec2/)

    2. User guide for connecting to a remote Linux instance using SSH. [https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AccessingInstancesLinux.html](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AccessingInstancesLinux.html)

    3. User guide for connecting to a remote Linux instance from Windows using PuTTY.
    [https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/putty.html](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/putty.html)

    4. Transferring files from your local computer to a remote instance using WinSCP.
    [https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/putty.html#Transfer_WinSCP](https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/putty.html#Transfer_WinSCP)

    '
