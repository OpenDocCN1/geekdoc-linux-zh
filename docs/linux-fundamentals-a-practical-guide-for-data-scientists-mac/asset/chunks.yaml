    `wc` 命令有多种不同的选项可以使用：


    * `wc -m <file-name>` 给出文件的字符数。

    * `wc -c <file-name>` 显示文件的字节数。

    * `wc -l <file-name>` 给出文件的行数。

    * `wc -L <file-name>` 给出文件中最长一行的长度。

    * `wc -w <file-name>` 显示文件的单词数。


    ![](img/image_rsrc2P2.jpg)你可以通过 `wc --help` 或 `man help` 查看 `wc` 命令的各种选项。


    ## 文件操作：打印文件内容

    让我们再次使用 `cat <file-name>` 来检查 `myfile.txt` 的内容。![](img/image_rsrc2P3.jpg)我们可以在同一行上运行不同的
    `cat` 命令并用分号隔开，从而打印多个文件的内容。例如，`cat <file1> ; cat <file2>` 将同时打印 `file1` 和 `file2`
    的内容。我们使用 `cat file1 file2` 来打印 `file1` 和 `file2` 的内容。![](img/image_rsrc2P4.jpg)`cat
    -n <file-name>` 用于在行旁边显示行号。![](img/image_rsrc2P5.jpg)你也可以运行 `cat --help` 来查看 `cat`
    命令的其他选项。`tac <file-name>` 以反序方式（从下到上）显示文件内容。![](img/image_rsrc2P6.jpg)`rev <file-name>`
    从左到右以反序方式显示每一行。![](img/image_rsrc2P7.jpg)`more <file-name>` 或 `less <file-name>`
    分别用于显示更多或少的文本。`head <file-name>` 或 `tail <file-name>` 分别显示文件的头部或尾部。你还可以使用 `-n`
    选项指定显示的行数。例如；`head -3 <file-name>` 显示指定文件的前三行。默认情况下，`head <file-name>` 显示文件的前
    10 行![](img/image_rsrc2P8.jpg)


    ## 文件操作：分割文件中的文本

    `split <file-name>` 将将文件中的文本分割成不同的文件。默认情况下，文件将被分成每块 1000 行。我们可以使用 `-n` 选项指定每块应包含多少行。新文件会自动命名；如
    `xaa`、`xab` 等。![](img/image_rsrc2P9.jpg)如果你希望新文件命名为 `x00`、`x01` 而不是 `xaa`、`xab`，你可以为
    `split` 命令包含 `-d -l` 选项。(image_rsrc2PA.jpg)


    ## 获取命令帮助

    `man <command>` 用于显示命令的手页，而 `<command> --help` 用于获取任何命令的帮助。(image_rsrc2PB.jpg)`apropos
    <keyword>` 可用于搜索包含指定关键字的所有命令。(image_rsrc2PC.jpg)


    ## 5 标准 I/O 重定向和管道

    在本章中，我们将学习标准输入重定向、标准输出重定向、标准错误重定向以及如何使用管道将多个命令链成单个命令。


    ### 什么是标准 I/O？

    标准 I/O 指标准输入和输出。当你使用 Linux 终端时，输入通过键盘输入，输出在终端上显示。也就是说，标准输入设备是键盘，而标准输出设备是终端或简单的计算机屏幕。标准输入和标准输出的符号分别为
    `stdin` 和 `stdout`。还有表示为 `stderr` 的标准错误。记住，Linux 系统中的一切都是文件，包括普通文件、目录甚至设备（特殊文件）。因此，标准输入、标准输出和标准错误设备都是与文件描述符数字
    0、1 和 2 关联的文件。


    重定向用于操作命令的输入和输出。例如，与其将输出显示在终端上，不如将输出重定向到文件中。通过重定向，我们可以更改标准输出和输入设备。


    ### 标准输入重定向

    通常，Linux 终端中的命令会接收一些输入。如果输入是一个普通文件，我们可以通过 `<` 符号使用输入重定向提供文件的内容。让我们使用输入重定向向 `cat`
    命令提供一个 Python 文件。(image_rsrc2PD.jpg)在上面的示例中，可能并不明显为什么我们应该使用 `cat < myfile.py`
    而不是 `cat myfile`。然而，这个例子说明了输入重定向是如何工作的。我们将在下面查看更具体的例子。


    现在让我们考虑另一个例子，即在有重定向和没有重定向的情况下向 `wc -l` 命令提供文件。你会注意到，没有重定向时，会显示行数和文本文件的文件名。重定向将文件内容传递给
    `wc -l` 命令，因此不会显示文件名。(image_rsrc2PE.jpg)


    我们可以使用 `mail` 命令通过重定向将附件发送到电子邮件。例如；`mail -s “Data Analysis File” [xyz@company.com]
    < analysis.py` 将将 `analysis.py` 文件作为附件发送到 `xyz@company.com]`，且邮件主题将为“Data Analysis
    File”。


    ### 输出重定向

    我们可以使用大于号（`>`）重定向输出。例如，与其在终端上显示目录内容，不如使用 `ls -l > <file-name>` 将内容重定向到文件中。(image_rsrc2PF.jpg)注意，如果输出重定向的文件已存在，它将被覆盖。例如，让我们向
    `listing.txt` 打印或回显一个字符串。(image_rsrc2PG.jpg)如果你不想覆盖现有文件，即如果你想向现有文件添加或追加内容，可以使用
    `>>` 符号代替 `>`。(image_rsrc2PH.jpg)注意，我们可以使用 `1>` 显式指定重定向类型为输出重定向，与用于标准错误重定向的 `2>`
    相比。


    ### 标准错误重定向

    运行程序或命令时，错误信息可能会作为输出显示。与其让错误信息弄乱终端输出，不如将错误信息重定向到文件中。这是开发人员的常用做法。标准错误可以使用 `2>`定向（与用于定向标准输出的
    `1>` 相比）。image_rsrc2PK.jpg)我们还可以将无用的错误信息重定向到 `/dev/null`。进入 `/dev/null` 的任何内容都无法检索。(image_rsrc2PM.jpg)任何进入
    `/dev/pts/0` 的输出都会在终端上显示，因为 `/dev/pts/0` 基本上就是终端。(image_rsrc2PN.jpg)


    ### 管道

    管道涉及命令链，使得第一个命令的输出作为第二个命令的输入。管道字符或竖线（`|`）用于管道。例如，我们可以列出目录内容，然后使用 `ls | wc -l`
    命令统计目录中有多少项目。(image_rsrc2PP.jpg)考虑一个包含动物名称的文件 `animals.txt`。让我们使用 `sort` 和 `uniq`
    命令按排序顺序显示唯一的动物名称。我们将使用管道链接 `sort` 和 `uniq` 命令。注意 `uniq` 命令仅对排序后的项目有效，因此我们需要先对项目排序，然后将排序后的项目传递给
    `uniq` 命令。(image_rsrc2PR.jpg)管道使用的其他常见示例包括：


    * `cat <file-name> | grep <“keyword”>` 获取文件中包含指定关键字的行。

    * `cat <file-name> | tail -5` 显示文件的最后五行文本。


