    # 13 Customizing the Shell Environment


    This chapter demonstrates how to customize a shell environment. You will learn
    how to customize the shell prompt using environment variables such as `PS1` and
    `PS2`.


    Command line is the text interface to your computer where commands are typed.
    It allows us to run commands to interact with computer programs. It is also called
    the shell, terminal, console, prompt, etc.


    The shell prompt is the marker on the screen that shows where commands should
    be typed. By default, the shell prompt consists of the username, computer name,
    and the dollar sign. The prompt generally appears as: `username@localhost: ~$`.
    For example:![](image_rsrc2U2.jpg)


    In Linux, the shell prompt for a regular user ends with a dollar sign (`$`) while
    the shell prompt for the root user ends with a hash sign (`#`).


    ## Customizing your Shell Prompt


    You can customize your shell prompt by setting the value of the primary prompt
    variable (`PS1`) to another value. For example, `PS1="ubuntu : "` changes the
    prompt to `ubuntu :` .![](image_rsrc2U3.jpg)


    `PS1="\u $"` will change the prompt to your username.

    `PS1="\h $"` will change the prompt to your hostname (computer name).![](image_rsrc2U4.jpg)


    To set the prompt value to `username@hostname $`, you can use the command, `PS1="\u@\h
    $ "` .![](image_rsrc2U5.jpg)


    You can also display time by including `(\t)` or `(\T)` . Then, `(\d)` displays
    the date, `(\s)` displays the bash shell name, and `(\v)` displays the bash version.![](image_rsrc2U6.jpg)


    `\w` can also be used to set the value of the shell prompt to the path of the
    working directory.![](image_rsrc2U7.jpg)


    The value of the prompt variable can be displayed using `$PS1` .![](image_rsrc2U8.jpg)


    `PS2` is a continuation interactive prompt that allows us to break down a very
    long command into multiple lines by using a backslash (`\`). The default interactive
    prompt for multiple lines is `"> "` . The interactive prompt `"> "` appears on
    a line when the previous line ends with a backslash (`\`). A backslash is used
    to indicate that the command that follows in the next line is a continuation of
    previous line. For example:![](image_rsrc2U9.jpg)


    We can set the `PS2` variable to a different value. For example, we can set the
    value of `PS2` to `"cont…>"` .image_rsrc2UA.jpg)


    ## Bash Shell Special Files


    We can find the bash special files (`.bash_profile`) in the user’s home directory
    `/home/user-name/` using the `ls -a | grep "bash*"` command.![](image_rsrc2UB.jpg)


    The `.bash_profile` file is used to store environment settings for your terminal.
    If the `.bash_profile` file is not yet created, you can create one using `nano
    ~/.bash_profile`. When a terminal session starts, the `bash_profile` file is loaded
    and the commands in the file are executed. Here is an example of a `.bash_profile`
    that prints a statement, “This is a message from .bash_profile”.![](image_rsrc2UC.jpg)


    Now, let’s `ssh` into the localhost computer using `ssh <ip-address>`. We can
    find the IP address of the local computer using `hostname -I`.![](image_rsrc2UD.jpg)


    We can now `ssh` into our local computer using `ssh 10.0.2.15`. However, if the
    `openssh-server` is not installed, make sure to first install the `openssh-server`
    by running the `apt-get install openssh-server` command. To make sure that the
    `openssh-server` is running, you can run the command `service ssh restart`, then
    run `systemctl status ssh` to view the status of the `openssh-server`. Also make
    sure that `Port 22` is enabled. To do this, open the `/etc/ssh/ssh_config` file
    and uncomment `Port 22`.![](image_rsrc2UE.jpg)![](image_rsrc2UF.jpg)


    Now let’s `ssh` into the local host machine, you would notice the `.bash_profile`
    file runs when you `ssh` into the localhost.![](image_rsrc2UG.jpg)![](image_rsrc2UH.jpg)


    ## Alias commands


    You can use the `alias` command to create your own command. Let’s add an `alias`
    command to the `.bash_profile` file to customize the settings of the terminal
    environment. The `alias` commands run each time we start a terminal session. Let’s
    include the following alias commands, for example:


    - `alias ll=''ls -lh''` to list files in long and human friendly format.

    - `alias homelist=''ls ~''` to display the content of the home directory.

    - `alias profilels=''ls ~/.bash*''` to display all bash files in the home directory.


    ![](image_rsrc2UJ.jpg)


    The `alias` commands added to the `.bash_profile` will allow us to use the `alias`
    commands after we start a terminal session. Aliases are useful especially if you
    need to execute a bunch of commands in a chain fashion, you could pipe the commands,
    then, name them using alias.![](image_rsrc2UK.jpg)


    ## Variables, Environment Variables and source Command


    Variables are placeholders or names that point to values. Variables are created
    using the command `<variable-name> = <value>` . We can print the value of a variable
    using `echo $<variable-name>` as shown below.![](image_rsrc2UM.jpg)


    We can list all environment variables using the command `env`. Let’s use `env
    | tail -5` to view the last five environment variables.![](image_rsrc2UN.jpg)


    You would notice that `HOME` is an environment variable, with value `/user-name/`.
    To create an environment variable, we need to use the `export` command. For example,
    `export DATABASE="mysql"` that means we can access its value not only through
    the primary shell but also through sub shells.(image_rsrc2UP.jpg)


    Note that we can include the `export` command in the `.bash_profile` file to run
    it each time we log into the system. That means we can set environment variables
    in bash.


    We can manually load the `.bash_profile` file into memory using the `source` command.
    In that case, we don’t have to `ssh` into the system to execute it. For example:![](image_rsrc2UR.jpg)


    The `source` command is used to execute the content of a file.

