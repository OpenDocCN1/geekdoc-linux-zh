    # if 语句


    `if-statement` 包含一个单一测试条件。嵌套在 `if` 条件下的语句仅在测试条件为真（true）时才会执行。


    Shell 脚本中的 `if-statements` 通常可以写如下所示：

    ![](img/image_rsrc2UY.jpg)


    下面是一个 Shell 脚本中 `if-statement` 的示例。该脚本提示用户输入一个数字。然后用名为 `NUM` 的变量引用该数字。使用 `if-statement`
    来测试变量 `NUM` 的值是否大于 5。如果变量值大于 5，则打印句子“This number is greater than 5”。![](img/image_rsrc2UZ.jpg)


    我们可以按照以下方式执行该 Shell 脚本：

    ![](img/image_rsrc2V0.jpg)


    ## if-else 语句


    `if-else` 语句有一个测试条件，但有两个选项可以执行。如果测试条件为真，则执行 `if` 子句下的语句。如果测试条件为假，则将执行 `else` 子句下的语句。


    通常情况下，Linux 中的 `if-else` 语句可以写如下所示：

    ![](img/image_rsrc2V1.jpg)


    下面是一个 `if-else` 语句的示例。该脚本提示用户提供一个名称。当用户输入名称时，该名称被赋值给变量 `NAME`。然后使用 `if-else` 语句检查提供的名称是否为“John”。如果名称是“John”，则打印语句“Hi
    John”，否则，通知用户名称错误。![](img/image_rsrc2V2.jpg)


    该脚本可以按照以下方式执行：

    ![](img/image_rsrc2V3.jpg)


    ## if-elif-else 语句


    当需要在三个或多个选项中执行其中一个选项时，可以使用 `if-elif-else` 语句。我们可以根据需要在此语句中包含任意数量的 `elif` 子句。`if-elif-else`
    语句通常如下：

    ![](img/image_rsrc2V4.jpg)


    下面是一个包含 `if-elif-else` 语句的脚本示例。该脚本从用户处收集一个数字，并检查该数字是零、正数还是负数。![](img/image_rsrc2V5.jpg)


    该脚本可以按照以下方式执行：

    ![](img/image_rsrc2V6.jpg)


    # 循环


    循环是一种用于执行重复性任务的语句。循环有两种类型：`for` 循环和 `while` 循环。当我们知道迭代次数或需要执行命令（一组命令）的次数时，就会使用
    `for` 循环。虽然在迭代次数已知的情况下可以使用计数器配合 `while` 循环，但在迭代次数未知的情况下，`while` 循环更为合适。


    ## for 循环


    `for` 循环的头部行包含 `for` 关键字、循环变量以及 `in` 关键字，然后是一个需要循环的项列表。项列表可以是数值范围、文件等。在 `for`
    循环的头部行之后，有一个 `do` 关键字，紧接着是需要执行的命令或多个命令。`for` 循环以关键字 `done` 结束。


    接下来的示例说明了 Shell 脚本中的 `for` 循环通常是如何编写的。


    带有数值范围的 for 循环：

    ![](img/image_rsrc2V7.jpg)


    带有文件的 for 循环：

    ![](img/image_rsrc2V8.jpg)


    带有 `for` 循环的 Shell 脚本示例

    ![](img/image_rsrc2V9.jpg)


    该脚本可以按照以下方式执行：

