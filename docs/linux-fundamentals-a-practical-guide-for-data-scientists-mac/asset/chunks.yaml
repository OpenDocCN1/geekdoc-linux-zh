  trans: "\n\n- 文件名中不应使用特殊字符，如 `/`、`*`、`?`、`:`、`&`、`<>` `{}`()`\n- 需要注意的是，文件扩展名没有意义，但包含它们可以帮助我们轻松识别文件类型。因此，`myfile`\
    \ 与 `myfile.txt` 是相同的。\n\n# Linux 命令结构\n\n- Linux 命令用于执行特定的任务。\n- 所有命令均使用小写字母编写。\n\
    - 命令可以不带参数、带一个参数或多个参数。\n- Linux 命令的通用语法为 `command -argument1 -argument2`。例如：\n\
    \    - `ls`\n    - `ls -ls`\n    - `ls -i -a`（或 `ls -ls `）\n\n`ls` 命令可以接受选项，如\
    \ `l`（产生详细列表输出）、`t`（产生按修改时间排序的输出）和 `--reverse`（按反序产生输出），如下所示：`ls -l` 用于以详细格式列出文件。![](img/image_rsrc2NA.jpg)\
    \ `ls -lt` 用于按修改时间排序以详细格式列出文件。![](img/image_rsrc2NB.jpg) `ls -lt --reverse` 用于按修改时间的反序以详细格式列出文件：![](img/image_rsrc2NC.jpg)\
    \ `ls -R` 用于列出当前工作目录下的目录文件以及子目录中的文件。\n\n## 基础 Linux 命令\n\n| 命令 | 用途 |\n| :---\
    \ | :--- |\n| `ls` | 用于列出目录内容。 |\n| `cd` | 用于切换目录。 |\n| `cat` | 用于显示文件内容。 |\n\
    | `who` | 显示当前登录系统的用户。 |\n| `uname` | 显示计算机信息。 |\n| `date` | 显示系统日期和时间。 |\n| `cal`\
    \ | 打印当前月的日历。 |\n| `passwd` | 用于更改密码。 |\n| `hostname` | 显示计算机名称。 |\n| `echo` |\
    \ 用于显示或打印一行文本。 |\n| `bc` | 用于调用计算器。 |\n| `sudo` | 代表“super user do”（超级用户执行）。允许以管理员或\
    \ root 权限执行命令。 |\n| `apt-get` | 用于安装软件包。例如，可以使用 `sudo apt-get install python3`\
    \ 安装 Python 3。每次想安装新软件包时，可以使用 `sudo apt-get update` 更新您的仓库。 |\n| `ping` | 用于检查是否可以连接到服务器。例如，`ping\
    \ google.com`。 |\n| `clear` | 用于清除终端。 |\n| `man` | 提供有关命令的帮助信息。 |\n| `history`\
    \ | 显示当前终端中使用过的过去命令列表。 |\n\n# 3 导航\n本章将探索如何导航 Linux 文件系统。Linux 文件系统具有分级目录结构，这意味着目录或文件可以嵌套在其他目录之中。`cd`\
    \ 命令代表 change directory（切换目录），用于导航。\n\n### 探索当前工作目录\n在 Linux 中运行命令的目录被称为当前工作目录。`pwd`\
    \ 命令用于显示当前工作目录的路径，而 `ls` 命令显示当前工作目录的内容，如下所示![](img/image_rsrc2ND.jpg)![](img/image_rsrc2NE.jpg)\
    \ `ls -a`：此命令用于列出当前目录的所有内容，包括隐藏文件和隐藏目录。隐藏文件或隐藏目录通常以点（`.`）开头。![](img/image_rsrc2NF.jpg)\n\
    \n### 导航\n`cd` 命令代表 change directory（切换目录），用于导航。`cd <directory-name>`：此命令用于从当前目录导航到指定的目录（即当前目录下的子目录）。`cd\
    \ Desktop` 命令将当前目录导航到 Desktop 目录，前提是 Desktop 是当前目录的子目录。也就是说，`cd Desktop` 等同于 `cd\
    \ ./Desktop`![](img/image_rsrc2NG.jpg)\n\n或者，要从主目录导航到位于 Desktop 目录内部的项目目录，我们可以使用\
    \ `cd` 命令并在单个命令中指定项目目录的路径，如下所示![](img/image_rsrc2NH.jpg) `cd ..`：带两个点的 `cd` 用于导航到父目录，而\
    \ `cd .`（带单点）意味着留在当前目录。注意，单点代表当前目录，而双点代表父目录。![](img/image_rsrc2NJ.jpg) `cd` 或\
    \ `cd ~` 用于切换到主目录，而 `cd /` 用于切换到根目录（`/`）。![](img/image_rsrc2NK.jpg)\n\n相对路径从当前目录（`.`）开始，而绝对路径从根目录（`/`/）开始。相对和绝对路径可以分别用于导航，如下![](img/image_rsrc2NM.jpg)\n\
    \n# 4 处理文件和目录\n在本章中，我们将查看用于操作文件和目录的命令。例如，我们将检查用于创建、复制、移动、重命名、移除和删除文件及目录的命令。\n\n\
    ### 创建目录\n`mkdir <directory-name>` 用于创建目录或文件夹![](img/image_rsrc2NN.jpg) 使用单个命令创建多个目录，请在\
    \ `mkdir` 命令后列出要创建的目录名称。\n\n### 创建普通文件\n有多种方法在 Linux 中创建普通文件。使用如 `vi` 或 `nano`\
    \ 的编辑器创建普通文件。`cat <file-name>` 可以显示文件内容，`nano` 比 `vi` 更高级，使用 `nano <file-name>`\
    \ 打开文件后 `CTRL + X` 退出。以下是使用 nano 创建的 python ![](img/image_rsrc2NP.jpg) `cat <file-name>`\
    \ 用于显示文件![](img/image_rsrc2NR.jpg) `touch <file-name>` 将创建一个空文件![](img/image_rsrc2NS.jpg)\n\
    \n### 复制目录\n注意，使用 `cp <directory-name> <directory-name>` 可以创建目录的副本。使用 `-r` 选项复制目录。这意味着如果被复制的目录包含子目录或文件，你需要使用\
    \ `cp -r <directory-name> <directory-name>`![](img/image_rsrc2NT)\n\n### 复制文件\n\
    `cp file1 file2` 用于复制 `file1` 并将其命名为 `file2![](img/image_rsrc2NU)\n\n### 重命名文件\n\
    `mv <file1> <file2>` 命令将 `file1` 重命名为 `file2`。下图显示了如何将 `myfile.txt` 重命名为 `myfile1.txt![](img/image_rsrc2NV)\n\
    \n### 移动文件到另一个目录\n`mv` 命令也可用于将文件移动到不同的目录。例如 `mv <file-name> <path-to-new-directory>`\
    \ 将文件移动到指定的目录![](img/image_rsrc2NW) 注意命令开头使用了 `sudo`，因为移动文件需要管理员权限。另外注意符号 `~`\
    \ 代表用户的主目录。\n\n### 删除文件\n`rm <file-name>` 命令用于删除文件![](img/image_rsrc2NX)\n\n###\
    \ 删除目录\n`rmdir <directory-name>` 用于删除空目录。你会注意到 `rm` 命令用于删除文件，而 `rmdir` 命令用于删除目录![](img/image_rsrc2NY)\
    \ `rm -r <directory-name>` 用于删除至少包含一个子目录或文件的目录![](img/image_rsrc2NZ)\n\n### 处理文件：计算文件中的单词数\n\
    让我们先用 `nano` 创建文件并向文件中写入一些文本，如下所示![](img/image_rsrc2P0) `wc <file-name>` 可用于计算文本中的单词![](img/image_rsrc2P1)\
    \ `wc <file-name>` 会产生三个数字和指定文件的名称。\n\n- 第一个数字代表文件的行数，\n- 第二个数字代表文件的单词数，\n- 第三个数字代表文件的字符数。\n\
    \n"
