    # Installing VirtualBox


    `VirtualBoxVirtualBox` is an open-source virtualization application that allows
    you to create multiple virtual machines where different operating systems such
    as Linux, Windows, macOS can be installed. You can download the VirtualBox package
    that matches with your operating system from [https://www.virtualbox.org/](https://www.virtualbox.org/)
    and install it on your computer.![](image_rsrc2MN.jpg)


    To open VirtualBox, search for the Oracle VM VirtualBox icon on your computer
    and double click on the icon. The VirtualBox interface is as shown below.![](image_rsrc2MP.jpg)


    ## Creating a Virtual Machine


    A new virtual machine can be created by clicking on the `New` icon.![](image_rsrc2MR.jpg)


    After clicking on the `New` icon, enter the `Name` of the machine, the `Memory
    size` , and select the `Create a virtual hard disk now` option. Click on the `Create`
    button.![](image_rsrc2MS.jpg)


    Enter the `File size` , then select the `VDI` (VirtualBox Disk Image) and `Dynamically
    allocated` options. Then, click on the `Create` button to create the virtual machine.![](image_rsrc2MT.jpg)


    Now, your virtual machine is added to the VirtualBox as shown below.![](image_rsrc2MU.jpg)


    ## Install Ubuntu on the Virtual Machine


    The next step is to download an iso file for a Linux operating system such as
    an Ubuntu iso file: [https://ubuntu.com/download/desktop](https://ubuntu.com/download/desktop)![](image_rsrc2MV.jpg)


    The downloaded iso file is a zipped file with contents as shown below:![](image_rsrc2MW.jpg)


    Go to the `Storage` section of the VirtualBox. Click on the `Choose a disk file`
    as shown below. Then, select and upload the Ubuntu iso file to the `Storage` section
    of the VirtualBox.![](image_rsrc2MX.jpg)


    After uploading the Ubuntu iso file, the iso file will be seen in the `Storage`
    section as shown below. Make sure to click the `ok` button before you proceed
    to start the virtual machine.![](image_rsrc2MY.jpg)


    Click on the `Start` icon to start the virtual machine.![](image_rsrc2MZ.jpg)


    Select the Ubuntu iso image and click on `Start` .![](image_rsrc2N0.jpg)


    Then, install the Ubuntu operating system.![](image_rsrc2N1.jpg)


    When you are done with the installation, you will be prompted to restart the virtual
    machine. Make sure to remove the `Disk` (Ubuntu iso image) from the virtual drive
    before restarting the machine, else the installation will start all over again.![](image_rsrc2N2.jpg)


    When you restart your virtual machine and log into the machine, you will see a
    screen that looks like this:![](image_rsrc2N3.jpg)


    You can then use `CTRL + ALT + T` to open the shell or terminal where you will
    run Linux commands to interact with your virtual computer and execute programs


    # 2 Linux Directory Structure and Basic Linux Commands


    This chapter provides an overview of the Linux directory structure, the Linux
    file system, default directories in Linux and their purposes, types of files in
    Linux, how to name files, the Linux command structure, and some basic Linux commands.


    ## A General Linux Directory Structure


    The Linux file system starts with a root directory `/` which contains directories
    and files (regular files). The directories further contain sub-directories and
    so on. That means, any directory or file can be traced back to the root directory.
    Furthermore, any absolute file path starts with the root directory. The root directory
    is represented by a forward slash `/`. It is important to note that there are
    no drive letters such as `C:\` in the Linux system compared to the Windows system.![](image_rsrc2N4.jpg)


    ## The Linux File System


    The Linux operating system comes with some default directories as shown below:![](image_rsrc2N5.jpg)Each
    default directory in Linux has a special use as shown on this table below:


    | Directory | Purpose |

    | :--- | :--- |

    | `/` | This is the root directory. Everything on the Linux system is under the
    `/` directory. Users such as `/home/user_name` must obtain permission to become
    root users to modify files on the system. |

    | `/root` | The `/root` directory is the home directory of the root user. It is
    located in `/root` instead of `/home/root`. It is different from the system root
    directory, `/`. |

    | `/bin` | The `/bin` directory contains essential user binaries. Applications
    and system programs such as the `bash` shell, `ls`, `grep`, `echo`, etc. are located
    in `/bin`. |

    | `/sbin` | `/sbin` is similar to the `/bin` but contains essential administrative
    tools, system binaries or executable programs to be run only by the root (administrative)
    user for system administration. |

    | `/var` | This directory contains variable data files to which the system writes
    data during its operation. For example, log files are in this directory. |

    | `/opt` | Contains locally installed software or packages. |

    | `/home` | Contains the home folder for each user. For example, if your username
    is `Jack`, then you have a home folder, `/home/Jack`. The home folder contains
    the user’s data files and user-specific configuration files. Each user has write
    access only to their own home folder. |

    | `/etc` | Contains system-wide configuration files which can be edited by hand
    in a text editor. Also contains system administration related files. |

    | `/dev` | Contains special files that represent devices or hardware like hard
    drives, etc. |

    | `/proc` | Contains special files that represent system and process information.
    |

    | `/lib` | Contains libraries needed by the essential binaries in the `/bin` and
    `/sbin` directories. |

    | `/tmp` | Location for temporary files. The files inside the `/tmp` directory
    are generally deleted whenever the system is restarted. |

    | `/usr` | Contains applications and files used by users as opposed to files used
    by the system. |

    | `/boot` | Contains static files needed to boot the system. |


    The `ls` command can be used on the terminal to list the files inside the root
    directory `/`:image_rsrc2N6.jpg


    ## Types of Files in Linux


    In Linux, everything is viewed as a file. There are different types of files,
    including regular files (`-`), directory files (`d`), and special files.![](image_rsrc2N7.jpg)


    Regular files are the most common types of files in the system and can be created
    in different ways. For example; the `touch` command, `vi` or `nano` editors can
    be used to create regular files. Examples of regular files are text files `.txt`,
    Python files `.py`, Java files `.java`, etc. Directory files are folders and can
    be created using the `mkdir` command.


    There are also various special files used for different purposes in Linux. For
    example:


    *   Block device files are hardware files that control hardware such as drives
    and memory. Block devices are mostly found in the `/dev` directory.

    *   Character files allow users and programs to communicate with hardware peripheral
    devices. Some classical examples of character files are files representing the
    keyboard, mouse, serial printer, etc. Character files are hardware files which
    read and write data in a character-by-character fashion.

    *   Pipe files allow applications or processes that are not designed to explicitly
    work together to communicate within a single Linux machine.

    *   Symbolic link files serve as links to other files. These files can be viewed
    as shortcuts or pointers to the original files.

    *   Socket files are used to pass information between applications.


    To display a file type in the Linux terminal, the `ls -ld <file-name>` command
    can be used. For example, the `ls -ld Downloads` command below generates output
    that includes `drwxr-xr-x`. The `d` at the beginning of `drwxr-xr-x`, indicates
    that the `Downloads` file is a directory.![](image_rsrc2N8.jpg


    Alternatively, the `file <file-name>` command can be used to display the file
    type for a specific file.![](image_rsrc2N9.jpg


    ## File Naming


    *   File names in Linux are case sensitive, which means a file called `myfile`
    is not the same as `Myfile`.

    *   The characters used in file names may include uppercase and lowercase letters,
    numbers, dots(`.`), underscores (`_`), hyphens (`-`), and so on.

