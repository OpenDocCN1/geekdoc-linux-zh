- fmt: '

    # Arithmetic Operations


    We can use the bash calculator, `bc` with integers and floats to carry out arithmetic
    operations. We can use `(( ))` to do calculations with integers only. By default,
    numbers referenced by variables are strings, so we need `(( ))` to make the values
    to be recognized as numbers. For example:


    ![](image_rsrc2UX.jpg)


    # Relational Operators


    Relational operators are used for checking the relation between values. Relational
    operators are also called comparison operators because they are basically used
    to compare values. If we want to check whether the value of variable `x` is greater
    than the value of variable `y`, we can use relational operators.


    A statement that compares values is called a Boolean expression and returns a
    Boolean value, “true” or “false”. For example, “x is greater than or equal to
    y” can be written as a Boolean expression: `[ x -ge y ]`. Test condition in conditional
    statements and while loops are usually Boolean expressions.


    ## Examples of Boolean Expressions


    | Description | Command |

    | :--- | :--- |

    | Greater than | `[$x -gt $y ]` |

    | Less than | `[$x -lt $y ]` |

    | Greater than or equal to | `[$x -ge $y ]` |

    | Less than or equal to | `[$x -le $y ]` |

    | Equal to | `[$x == $y ]` |

    | Not Equal to | `[$x -ne $y ]` or `[$x != $y ]` |


    # Conditional Statements


    Conditional statements are statements that are used to make decisions on what
    command should be executed. There are three main categories of conditional statements:


    - `if` statement

    - `if-else` statement

    - `if-elif-else` statement

