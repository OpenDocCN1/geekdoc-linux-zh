- pgno: 4
  md: '# ABOUT THE AUTHOR: MICHAEL BAZZELL


    Michael Bazzell investigated computer crimes on behalf of the government for over
    20 years. During the majority of that time, he was assigned to the FBI''s Cyber
    Crimes Task Force where he focused on various online investigations and Open Source
    Intelligence (OSINT) collection. As an investigator and sworn federal officer
    through the U.S. Marshals Service, he was involved in numerous major criminal
    investigations including online child solicitation, child abduction, kidnapping,
    cold-case homicide, terrorist threats, and advanced computer intrusions. He has
    trained thousands of individuals in the use of his investigative techniques and
    privacy control strategies.


    After leaving government work, he served as the technical advisor for the first
    season of the television hacker drama *Mr. Robot*. His books *OSINT Techniques*
    and *Extreme Privacy* are used by several government and private organizations
    as training manuals for intelligence gathering and privacy hardening. He now hosts
    the *Privacy, Security, and OSINT Show*, and assists individual clients in achieving
    ultimate privacy, both proactively and as a response to an undesired situation.
    More details about his services can be found at *IntelTechniques.com*.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# LINUX DEVICES PREFACE


    I wrote my first privacy-related book in 2012 titled *Hiding From The Internet*.
    This eventually evolved into the title of *Extreme Privacy*, which is now a large
    517-page textbook in its fourth edition, released in early 2022. In early 2023,
    I began conversations with my staff about the potential for a future fifth edition.
    There was some resistance. We had just released the 550-page *OSINT Techniques*
    textbook and we were all exhausted from the process. The idea of attacking a new
    version of *Extreme Privacy* seemed overwhelming at the time. We threw around
    the idea of a smaller book.


    Many readers of *Extreme Privacy* expressed frustration at the overall amount
    of information presented within one volume. At 320,000 words, it could be overwhelming
    to digest all at once. Other criticism was that readers did not necessarily need
    all of the information within the book. Some wanted to focus on trusts, LLCs,
    and nomad domicile, and did not need all of the technology-themed chapters. Others
    only wanted to learn about secure computers, mobile devices, and other technical
    topics, and did not care about my ideas on an anonymous home or car. This was
    helpful feedback, and impacted the decision to release this digital book. The
    most criticism from *Extreme Privacy* was about the format. My large OSINT and
    Privacy books are only available in print. This has upset many readers who want
    to avoid Amazon or prefer to read on a screen. With this release, and the previous
    *Mobile Devices* eBooks, we are only providing PDFs. There are no official print
    versions and we have eliminated Amazon from the entire publication process. This
    allows us to offer a lower price, and 90% of each purchase directly supports our
    free podcast. If you bought this, thank you for your support!


    We realize that a native PDF will lead to immediate piracy of this work online.
    We accept that. We believe that we can offer further benefits to legitimate purchasers
    by offering free updates when appropriate. If we ever need to modify existing
    content or add entire new sections, we can send an email blast to all purchasers
    which will allow them to download a new copy with all updates for free. Since
    each copy of this work is watermarked with both a visible and hidden unique code,
    we can block updates from those who publish the book without consent. Overall,
    we want to reward those who support us with a searchable, copyable, updatable,
    and printable document, even at the risk of losing half of our sales to the pirates.


    With *Extreme Privacy: Linux Devices*, I continue this new approach to our tutorials.
    It is not a replacement for *Extreme Privacy* (the printed book). Please consider
    it a much more thorough supplement about Linux devices. My hope is that this will
    further continue this series of shorter volumes which each focus on one specific
    topic. This allows people to only purchase the content which they need at a more
    affordable price. It also allows us to publish content more rapidly, as we can
    focus our efforts on one area at a time as needs arise, instead of reserving content
    for a potential future release. Free updates are also a win for everyone. I now
    present our digital guide solely about building the optimal Linux device.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# INTRODUCTION


    I began using Linux as my full-time primary operating system a couple of years
    ago. I had dabbled with Linux for decades and relied heavily on it for virtual
    machines within my OSINT books, but I did not commit to it as my daily driver
    until I finally had enough of the privacy invasions forced onto me by Microsoft
    and Apple. Windows and macOS operating systems constantly monitor your usage and
    collect sensitive data about your devices, locations, documents, and overall activities.
    They claim to store this data for your benefit in order to provide a tailored
    computing experience. This is probably true, but what happens when this data is
    leaked, breached, or court-ordered to be given away? What can we do to leave this
    ecosystem of privacy and security risks?


    I believe the answer is Linux. If you are only familiar with macOS or Windows
    environments, I suspect you will be pleasantly surprised by the ease and simplicity
    of using Linux as your computer’s operating system. There will be a learning curve,
    but I promise that anyone reading this guide can make the switch. I believe you
    will prefer Linux after a month of daily usage. You might even find macOS and
    Windows machines difficult to use after completely committing to Linux.


    This book will help you create a machine which does not send any sensitive data
    to Apple, Microsoft, or other providers who abuse this information. We will stop
    them from archiving our activities within the hardware which we have purchased.
    No online accounts will be required in order to use our operating system or download
    applications. We will have full control of our devices and operating systems.
    A name, telephone number, or physical address will never be requested in order
    to use our systems. We will all take our privacy back, while possessing the perfect
    machine for our unique needs.


    This entire book is designed for the reader interested in extreme privacy. I will
    not sugar coat my opinions or offer less-secure options for the sake of convenience.
    I will explain every step and will never make assumptions on the reader’s level
    of technology awareness. This is our entire playbook for every new client’s Linux
    device. It is comprised of our internal client tutorials and staff handbooks,
    with extended details provided by myself. It should allow you to create a perfect
    private and secure Linux device for your needs. I leave nothing out, and include
    many new strategies previously omitted from *Extreme Privacy, 4th Edition*.


    I offer one last vital piece of information before we start. I encourage you to
    generate your own opinions as you read along. You may disagree with me at times,
    which is ideal. That means you are really thinking about how all of this applies
    to you. **If everyone unconditionally agrees with every word I say, then I am
    probably not saying anything interesting. If this book only presents content which
    no one could dispute, then there is no need for this text.** Please read with
    an open mind and willingness to try new things. Let’s begin.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# CHAPTER ONE: WHY LINUX?


    I mentioned in the introduction that Windows and macOS machines collect and store
    data about your usage of their products. Let''s dive deeper into that. In 2019,
    I requested all of the data stored about me from Apple. I was preparing to record
    a podcast about the data which Apple collects about all of us, and I wanted to
    see the damage first-hand. I possessed several Apple ID accounts in alias names,
    so I requested the data from each of them. Since I never gave Apple my true name,
    I assumed the exposure was no big deal. I was wrong. The data provided by Apple
    confirmed they knew the following about my "anonymous" Apple accounts.


    +   - My full alias name and email address provided during account creation

    +   - My alias physical address provided during account creation

    +   - The serial numbers for all devices

    +   - The dates I first used the email addresses with Apple

    +   - Multiple IP addresses possessed during use of the devices

    +   - The internal computer names assigned to all devices

    +   - The dates/times of any reformatting of the systems

    +   - The dates/times and IP address of last access to iTunes, FaceTime, and iCloud

    +   - My time zones during usage of the devices

    +   - The VoIP telephone number provided during Apple account logins

    +   - An alternative email address I once entered into Apple Mail

    +   - Songs I had listened to through the official Apple Music application

    +   - The moments within the songs when I paused the playback

    +   - My IP addresses during media streaming from Apple''s servers

    +   - My preferred musical artists identified during their onboarding process

    +   - The serial number of an iPhone which I had accessed in 2017

    +   - All podcasts subscribed to through iOS devices

    +   - Titles of podcast episodes which had been completed or paused (hundreds)

    +   - Dates of podcast subscriptions and listening times

    +   - Podcasts which possessed reviews from me, including full review text

    +   - All app purchases, including free apps, downloaded to the device

    +   - All IP addresses assigned during downloads

    +   - All books downloaded through Apple Books

    +   - Hundreds of IP addresses used during my connections

    +   - An export of all entries from Apple Calendar

    +   - Documents and contacts remaining in iCloud

    +   - Auto-stored contacts from Apple Mail

    +   - Recipient email addresses accessed within Apple Mail

    +   - Dates and times of outgoing email

    +   - **My real name extracted from outgoing email headers**


    I remind you that this data was all monitored, collected, and stored while I assumed
    I was being anonymous. There simply is no anonymity with Apple devices, as the
    digital trail will eventually identify any user. If you have followed my digital
    guide *Extreme Privacy: macOS Devices*, you know we can block almost all of this
    telemetry, but it can be a chore to maintain. I believe we should not need to
    take such extreme measures to prevent companies from this invasion.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'Microsoft is no better. By default, Windows 10 and 11 require a Microsoft online
    account in order to install the operating system. Some versions allow you to bypass
    account creation altogether by being offline, but Microsoft is pushing to eliminate
    this option in Windows 11. An active Microsoft account is not required in order
    to receive important software updates, but Microsoft''s Telemetry service continuously
    collects the following data, plus numerous additional details, sending it to their
    corporate servers in Seattle.


    +   - Typing diagnostic data from your keyboard

    +   - Microphone transmissions

    +   - Index of all media files on your computer

    +   - Webcam data

    +   - Browsing history

    +   - Search history

    +   - Location activity

    +   - Health activity collected by HealthVault, Microsoft Band, and other trackers

    +   - Privacy settings across the Microsoft application ecosystem


    This data would make it very easy to identify you, your location, and all online
    activity. Microsoft claims this collection of data is only to enhance your experience,
    but I find this activity to be invasive and unnecessary. This is where Linux comes
    in. Consider the following summary of the benefits of Linux over Windows and macOS
    systems.


    +   - Linux operating systems do not require an account for installation or usage.
    You will not be asked for a name, email address, physical address, telephone number,
    username, or credit card just to use the system which you purchased.

    +   - Most flavors of Linux possess either no telemetry or minimal data collection,
    which can be easily disabled. Unlike macOS, there are no account requirements
    in order to download official software. This alone is a huge privacy benefit.

    +   - I believe the security of Linux systems is much better than Microsoft Windows.
    Most malicious software targets Windows systems due to the abundance of Windows
    users in both personal and professional spaces, but also because of the overall
    ability for programs to access system resources. There are viruses and other malicious
    programs which target Linux and macOS, but these are fairly rare. Any time you
    hear about a machine becoming infected with ransomware or other computer viruses,
    it is almost certain to have involved a Windows system. While I believe macOS
    systems are more secure than Linux or Windows, the privacy invasions negate many
    of the benefits.

    +   - Linux is completely free and open source. This means that all Linux operating
    systems are transparent and can be audited by anyone. There are many active Linux
    communities which pour over all of the code to make sure nothing nefarious is
    going on behind the scenes. Microsoft and Apple hide their code from the public
    view and we never truly know just how bad things might be. Open-source code also
    allows people to create many different versions of Linux which can accommodate
    specific needs and niches. We will soon discuss the many flavors of Linux and
    which of them might be most appropriate for your needs.

    +   - Almost every aspect of Linux can be modified and customized. If you are
    a macOS user, you know that you cannot uninstall stock Apple software such as
    Mail, Photos, Facetime, Music, and other undesired applications. You are stuck'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'with them. Most Linux systems begin with minimal programs and allow you to
    choose what should be added. You can remove anything desired and are never stuck
    with a default list of stock apps.


    +   • Linux is a very lightweight operating system. It runs smoothly on modern
    and legacy hardware, which allows for easy testing without the purchase of new
    and expensive machines.


    +   • Since Linux can be installed on practically any computer hardware, we can
    be very selective about each part. Most Linux machines allow you to modify all
    parts including batteries, RAM, drives, etc. If you purchase a MacBook Pro and
    later decide to upgrade any of these specifications, you are likely out of luck.
    You would have to buy a whole new machine.


    I could provide many more additional reasons I prefer Linux over more traditional
    systems, but I believe the previous points suffice for most people. Instead of
    trying to convince you to give Linux a shot, I prefer to explain the ways in which
    I customize my own Linux usage, and the process for clients. I believe by the
    end of this guide you will be ready to build or purchase your own Linux device.
    Next, let’s tackle hardware choices, which can be overwhelming.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# **CHAPTER TWO: HARDWARE CONFIGURATION**


    If you are a macOS user, you are limited to specific hardware approved and sold
    by Apple. If you want a laptop, you have a handful of options which can be minimally
    optimized. Linux is a different beast. Since it runs on practically any computer
    hardware, the options are endless. You likely possess an old computer which is
    capable of running Linux without much effort or commitment. If not, you probably
    have a macOS or Windows device which could host a Linux virtual machine. If you
    decide to purchase a new computer specifically designed for Linux, you have a
    new set of overwhelming choices. Let''s make sense of all of these options.


    Used Equipment: One of the best ways to test Linux is to install it onto a retired
    machine. If your computer is capable of running Windows, it will likely also handle
    Linux. If you possess an Apple computer, things are not as straight forward. Older
    Apple computers made before 2016 should handle just about any Linux variation.
    If you have a newer Intel-based laptop with a touch bar, you will need a special
    variant of Linux available from t2linux.org. If your device was made after 2020
    and has the latest Apple processor, I do not recommend attempting a Linux installation.
    Everything else should be possible. I keep old laptops specifically for testing
    new Linux builds.


    Virtual Machines: If you only have one computer, then a Linux virtual machine
    is ideal for experimentation. Chapter Eight goes into great detail about creating
    virtual machines within any Linux, macOS, or Windows platform. It also explains
    how to build Linux and Windows virtual machines within your Linux host. Once created,
    your virtual machine will behave just like a traditional installation on a host.


    New Computers: This is always my preference. If you decide to commit to a Linux
    lifestyle, purchasing a dedicated Linux machine with your own specifications is
    ideal. It also opens the flood gates with multiple manufacturers, models, and
    customizations. However, I will walk you through my preferred options. A new machine
    with Linux pre-installed is not only the easiest way to get going, it should offer
    the best possible integration into your daily activities. During the rest of this
    chapter, I will assume that you want to purchase a new computer specifically for
    your Linux experience. However, the next chapter explains how to install Linux
    within any capable device. For now, let''s focus on hardware options.


    There are thousands of new and used machines which could run Linux well. You might
    have a preference for Lenovo ThinkPad laptops, and you might want to stick with
    that which is familiar. Maybe you prefer Dell machines. Both Lenovo and Dell work
    great with Linux, but I believe we can do better. Let''s start with the processor.
    The processor is the main chip which allows your computer to complete all of the
    functions and tasks which you tell it to do. It is the heart of a computer. It
    can also be the first vulnerability from an outside attack. Virtually every Intel
    processor made since 2008 possesses software known as the Intel Management Engine
    (Intel ME). It is a subsystem of proprietary firmware embedded directly onto the
    chip. It is a small operating system. Any traditional operating system installed
    to the computer, such as Linux, would have no control over Intel ME. The Intel
    ME software runs during boot, while the computer is running, and while it is asleep.
    As long as the chipset is supplied power, it even continues to run when the system
    is turned off.'
  merge: -1
  img_proc: true
- pgno: 11
  md: "The legitimate purpose of Intel ME, and AMD's option called AMD Secure Technology\
    \ (AMD ST), is to allow your device to be managed within a low-powered state.\
    \ Administrators of large computer networks can take advantage of this technology\
    \ to remotely control many aspects of a computer within the network. The concerns\
    \ arise due to the control in which Intel ME has to all aspects of the device,\
    \ the overall secrecy around the closed-source code behind these functions, and\
    \ several known vulnerabilities which have been reported since 2017.  \nLet's\
    \ have a reality check. Intel ME and AMD ST are not monitoring everything typed\
    \ on a machine or allowing strangers to remotely access your screen. Substantial\
    \ configuration on your device and the network to which it connects is required.\
    \ You might never have a problem using an Intel ME enabled chip. My concern is\
    \ any new undisclosed vulnerabilities which could be abused by criminals. This\
    \ presents my first requirement for my Linux device. I want a machine which has\
    \ Intel ME disabled.  \nYou will likely never find a computer with all traces\
    \ of Intel ME completely removed from its processor. However, there is an active\
    \ community of people and companies constantly working to minimize the Intel ME\
    \ processes allowed to run within a system. The most active vendor of Linux-based\
    \ machines with default disabled Intel ME is System76 (system76.com).  \nA company\
    \ called Purism had previously offered laptops without Intel ME, but I strongly\
    \ advise against any purchase from Purism. They are still trying to fulfill orders\
    \ of their Linux-based phones several years after purchase. In some cases, people\
    \ have been waiting five years for their device to ship, while being ignored by\
    \ customer support. They refuse to issue refunds for non-shipped items. Please\
    \ avoid them.  \nSystem76 sells only devices which are targeted toward Linux users\
    \ and possess Linux when shipped. I have placed several orders for customized\
    \ machines which ship the next day from Colorado. Most of their laptops have Intel\
    \ ME disabled by default.  \nThe second reason I prefer System76 over other vendors\
    \ is their use of open-source firmware called Coreboot. This software replaces\
    \ the proprietary code included with most motherboards. It is typically much faster\
    \ and more secure. More importantly, it removes the hidden closed-source code\
    \ which could be doing bad things on a hardware level.  \nHopefully you have decided\
    \ that you also want a machine which has Intel ME disabled and Coreboot instead\
    \ of stock firmware. This means you will need an Intel-based machine from System76.\
    \ Sounds easy, right? You still have many options.  \nSystem76 currently offers\
    \ nine different laptop models and four desktop variants.  \nLet's begin with\
    \ the laptop versus desktop discussion. I possess a System76 Thelio desktop computer\
    \ for all of my data breach work. I prefer a desktop for this because I can easily\
    \ expand my storage and allow the desktop to complete lengthy tasks while I am\
    \ away. I also like the sense of walking away from the computer instead of always\
    \ having a laptop within arm's reach. However, I don't typically recommend desktops\
    \ to most people. Laptops are portable and include a screen, keyboard, and trackpad.\
    \ They are also more common and appropriate for most of my clients. If you need\
    \ a desktop, you know your reasons why and do not need my input.  \nIf you are\
    \ looking at nine System76 laptops and feel confused, you are not alone. I spent\
    \ several hours digesting all of the options before I committed to my own machine.\
    \ Since we can only have Coreboot and disabled Intel ME on Intel-based devices,\
    \ this eliminates the Pangolin with AMD chip from the lineup. That leaves us with\
    \ eight options."
  merge: -1
  img_proc: true
- pgno: 12
  md: 'The Gazelle, Adder, Oryx, Serval, and Bonobo laptops are extremely powerful
    machines targeted toward people who need 4K screens up to 17\", dedicated graphics
    cards, and top-of-the-line processors. If you are processing HD video all day
    or need a high-end gaming machine, these are for you. However, they are not for
    me or my clients. That leaves us with three choices left.


    The Galago Pro, Lemur Pro, and Darter Pro would each work for our needs. The end
    user would need to look at them and decide which is the best fit. The Galago Pro
    has only five hours of battery and the Lemur Pro does not have an Ethernet port.
    This is why the Darter Pro is my current laptop and the device often issued to
    my clients. It has the bigger 15" screen, both USB-A and USB-C ports, a microSD
    card slot, and a nine-hour battery. I also prefer the Darter Pro keyboard which
    includes a number pad to the right, but some people may not like the standard
    keyboard which is slightly shifted to the left.


    If you want a more portable (and much lighter) device with 14" screen, I prefer
    the Lemur Pro, but note that it does not have an ethernet port if that is important
    to you. Next are the specs. I chose the following options at the time of this
    writing.


    **Processor:** I chose the default Intel i5 1340p processor, which I find more
    than sufficient for everyday tasks. The jump to an i7 is over $200, and most users
    would never take advantage of the additional horsepower. If you know that you
    will be performing process-intensive tasks which will benefit from this upgrade,
    it may be worth it to you. If you spend most of your time in a browser, you would
    see no improvement. This contradicts my advice in the macOS guide where I encourage
    users to go with higher specifications. This is because macOS machines cannot
    be upgraded and we want to future-proof them the best we can.


    **Memory:** The default 8 GB of RAM is less than I desire. Since I often have
    virtual machines open, I believe 16 GB of RAM is more appropriate.


    **OS Drive:** The default 250 GB of disk space may work for most people, but I
    find it limiting. I also find the 3,300 MB/s read speed of the default drive less
    than optimal. I prefer to increase the size to 1 TB and the speed to 7,000 MB/s
    with the PCIe Gen4 drive. If you ever need to process large amounts of data, you
    will appreciate the upgrade. This increase of 4x the size and 2x the speed is
    only $115 more.


    My customization presented a total price of $1,259.00. An equivalent Apple laptop
    would be twice that amount. I want to stress that my choice of laptop may not
    be the same as yours. There is no such thing as the perfect machine. Do your own
    research and find the appropriate model for you. Watch online review videos to
    see a realistic representation of any device. The Galago Pro, Lemur Pro, and Darter
    Pro each include Coreboot and disabled Intel ME, and are very portable. All System76
    computers have the option of shipping with either Ubuntu or Pop!_OS, as explained
    next.


    I am sure some readers are questioning my enthusiasm for System76 products. In
    the name of full transparency, I received no compensation from System76 for the
    promotion of their products in this book. I purchased my own machine(s) and I
    am not a System76 affiliate. I receive no kickbacks from any past or future orders.
    In fact, I had a hard time getting their press team to respond to my multiple
    requests asking for permission to use their trademarked name within this guide.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# # CHAPTER THREE: OS CONFIGURATION


    I will assume that you have now identified the way in which you will begin your
    Linux journey. Whether you have decided to test things with an old computer, play
    around within a virtual machine, or commit to the Linux world with a brand-new
    laptop, this entire chapter (and rest of the book) applies to you. Our next discussion
    is over the version of Linux best for your needs. This is where I always see great
    debate. Offering a Linux variant preference is similar to stating which religion
    is best. There are many die-hard Linux fanatics who will scold me regardless of
    the route I take. Let’s rip this bandage off and get right to it. My preference
    for Linux installation is **Pop!_OS**. There, I said it. I know many of you are
    screaming at me right now. Before you sharpen your pitchforks, please allow me
    to explain some other popular options, and the reasons I choose **Pop!_OS** for
    my daily laptop.


    **Qubes OS**: Any time I mention Linux on my show, numerous people write in to
    tell me I should be recommending Qubes OS. Qubes OS is a security-focused Linux
    operating system that aims to provide security through isolation via virtualization.
    It allows you to launch every application within its own isolated virtual machine.
    This is quite impressive and extremely secure. However, it can also be annoying.
    The learning curve from macOS or Windows to Qubes OS is steeper and daily usage
    can be trying. I once attempted to use Qubes OS for 30 days, but failed after
    much frustration trying to perform daily tasks. If you use Qubes OS full-time,
    you have my respect. For most people, I believe it is overkill and more likely
    to make them return to easier traditional systems.


    **Kali**: Many people advocate using a Linux build called Kali which is pre-loaded
    with numerous security-related tools. However, Kali is designed to be executed
    as a virtual machine and I believe it should never be executed for personal usage.


    **TAILS**: The entire TAILS operating system relies on the Tor network for increased
    anonymity online. However, it is not meant to be a host. It is designed to be
    launched from an external drive in a way in which it leaves no trace on the computer
    after the session is closed. Much like Kali, it is not intended to be used as
    a daily driver host.


    **Debian**: Debian is designed to be used as a host, and it provides a very minimal
    software experience. I believe Debian can be a great choice for those who have
    a lot of Linux experience. I used it for a while, but ran into driver issues and
    the occasional software conflict. Of the previous options, it is the closest we
    have to a full-functioning Linux host operating system.


    **Ubuntu**: This is probably the most familiar choice as it is one of the most
    popular Linux distributions. It is a fantastic beginner’s operating system because
    it typically just works upon launch. It has its own application store and many
    software developers offer online steps to make their applications work on Ubuntu.
    I recommend Ubuntu for use as an OSINT virtual machine, as explained in my OSINT
