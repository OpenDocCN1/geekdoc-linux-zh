    The next Firefox add-on which I use daily is the **Multi-Account Containers**
    option from Mozilla. It can be found at addons.mozilla.org/firefox/addon/multi-account-containers.
    Prior to 2021, I used this service to create individual containers which isolated
    website cookies from each site. However, Firefox introduced "Total Cookie Protection"
    within version 86 released in February of 2021. Because of this, temporary internet
    files from each domain are confined to the websites where they originated (when
    "Strict" is selected under "Enhanced Tracking Protection"). Firefox creates a
    virtual container for each site loaded. Facebook cannot see the cookies downloaded
    from Amazon and vice-versa. Many believe this eliminates the need for Multi-Account
