  md: 'vulnerabilities which could expose more data than intended, but we can discuss
    a few misconceptions about your internet traffic. First, we should tackle SSL/TLS.
    SSL (Secure Sockets Layer) and its successor, TLS (Transport Layer Security),
    are protocols for establishing authenticated and encrypted links between networked
    computers. This is related to the lock icon you see in your browser address bar
    when on any website which begins with "https". This indicates a secure connection,
    but what does that really mean? I will simplify this technology with a couple
    of examples. Assume you are on your home computer connected directly to your internet
    service provider (ISP). You are not using a VPN. You connect to Google and conduct
    a search for "inteltechniques". The response URL presented to you, including the
    search results from the query, is https://www.google.com/search?q=inteltechniques.
    Does your Internet Service Provider (ISP) know you conducted a search on Google?
    Yes. Do they know you searched for "inteltechniques"? No. This is because Google
    encrypts the actual search URL. The provider of your internet connectivity can
    only see the domain name being accessed. It cannot see any details about specific
    pages or any credentials entered.


    This is why https versions of websites are so important. Your browser can see
    this entire URL, but it does not directly share any details with your provider.
    Now, let''s introduce a VPN. After connecting to your VPN, such as Proton VPN,
    you conduct the same search. Does your ISP know you conducted a search on Google?
    No. Does your VPN provider know you conducted a search on Google? Yes. Does your
    VPN provider know you searched for "inteltechniques"? No. Why does this matter?
    Everyone has a unique threat model, but I will present a few scenarios where you
    may be concerned. First, consider that I am suing you through civil court, and
    I have convinced a judge to grant me a court order to collect your internet activity.
    Since I know where you live, I can assume the provider of your internet service.
    A court order is issued to your ISP for your internet activity. If your ISP logs
    your traffic, which most do, the response would tell me every domain which you
    visited and the dates and times of occurrence. I could use this to prove you were
    visiting specific websites or transmitting large amounts of data to designated
    services. If you had a VPN enabled, I could only prove your device(s) were connected
    through a VPN. I would not know any domains from your activity. A second court
    order to the VPN provider would not reveal this data. Reputable VPNs do not log
    this traffic, and IP addresses are shared between thousands of users.


    Next, assume I want to know where you live. I know your email provider is Gmai,
    and a subpoena to them would reveal your IP address at a specific date and time.
    If this IP address belongs to your internet service provider, a second subpoena
    will disclose the address of service (your home). If the IP address belongs to
    your VPN provider, it will not disclose any details about you or the VPN account.
    A subpoena to the VPN provider for information about the IP address will reveal
    no logs and an education about IP address sharing between thousands of strangers.


    Now, let''s combine the strategies mentioned previously to thwart this behavior.
    Since you are always connected to a VPN, your ISP knows nothing about your internet
    traffic. A subpoena to them would not reveal the sites you visit. Since Proton
    Mail does not log your IP addresses in clear text, they cannot determine your
    true IP address. Since Proton VPN and Proton Mail are Swiss-based companies, they
    would not respond to a subpoena from the United States. If you purchased a VPN
    service without providing your true name, there is nothing to glean from the VPN
    provider'
