- pgno: 81
  md: '# CHAPTER NINE: CUSTOM SCRIPTS


    I have explained a lot of ways in which you can harden and sanitize your new Linux
    machine. Everything up to this chapter relies on manual configuration. Next, let''s
    automate a lot of the daily or weekly tasks by creating our own Linux maintenance
    script. I respect that some readers may just want to download a pre-configured
    script and use it right away. The following commands within Terminal will download
    the script, make it executable within your Linux machine, download the shortcut
    file, and move both to create a "Maintenance" shortcut in your "Applications"
    menu. The rest of the chapter explains how to create your own.


    ```

    wget https://inteltechniques.com/data/maintenance.sh

    chmod +x maintenance.sh

    wget https://inteltechniques.com/data/maintenance.desktop

    sudo mv maintenance* /usr/share/applications/

    ```


    The text on the following page displays the entire script. It identifies the file
    as a bash script; clears the screen; and presents a menu with seven selectable
    menu options. The image below displays the script once it is finished and executed.
    You would enter the number associated with the feature you want to execute and
    strike the Enter key. Striking the Enter key at any prompt without a number presents
    the original menu again. Each option correlates to the commands previously presented
    throughout this guide. If you wanted to modify this script, you would choose option
    "6" to launch a file viewer with admin rights and navigate to /usr/share/applications
    and edit the maintenance.sh file.


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_81_0.png)


    Now, let''s understand how we could have built this manually. Copy the entire
    code presented within the next page in Courier New 11-point font and paste the
    text into a new file saved as maintenance.sh within your Documents folder using
    the Text Editor application on your own Linux machine.


    ```

    #!/bin/bash

    clear

    COLUMNS=12

    PS3=''Selection: ''

    options=(

    "Show Hidden Files"

    "Hide Hidden Files"

    "Start NextDNS"

    "Stop NextDNS"

    "Restart NextDNS"

    "Launch Files with Admin"

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: '```

    "Apply Updates" )

    select opt in "${options[@]}"

    do

    case $opt in

    "Show Hidden Files")

    gsettings set org.gnome.nautilus.preferences show-hidden-files true

    gsettings set org.gtk.Settings.FileChooser show-hidden true

    ;;

    "Hide Hidden Files")

    gsettings set org.gnome.nautilus.preferences show-hidden-files false

    gsettings set org.gtk.Settings.FileChooser show-hidden false

    ;;

    "Start NextDNS" )

    nextdns start

    ;;

    "Stop NextDNS" )

    nextdns stop

    ;;

    "Restart NextDNS" )

    nextdns restart

    ;;

    "Launch Files with Admin" )

    sudo nautilus

    ;;

    "Apply Updates")

    sudo apt update

    sudo apt upgrade -y

    sudo apt full-upgrade -y

    pop-upgrade release upgrade

    sudo apt autoremove -y

    sudo apt autoclean -y

    flatpak update -y

    ;;

    esac

    done

    ```


    This is a fairly basic Bash script, but let''s walk through each piece to understand
    the functionality for future replication.

    #!/bin/bash: This first line is known as a ''she-bang''. It identifies the text
    file as a script of commands to be executed.

    clear: This command simply clears the screen in order to present a clean menu.
    While not necessary in this script, I prefer to clear the screen before presenting
    any content. This eliminates any other text which may be confusing to the viewer.

    COLUMNS=12: This command displays the contents within a column. It prevents the
    menu choices from being displayed as a single horizontal line. You can modify
    this number if your menu items do not fit as desired.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'PS3=''Selection: '': PS is short for Prompt Statement. PS3 presents a menu
    of choices in which you can select a corresponding number to execute the option.
    This basically creates an option for selection of future items in the script.


    options=("Restart NextDNS"): This is where we place the options for the menu.
    These should be worded exactly as we want them to appear within Terminal. There
    is no limit and each should be in their own quotation marks.


    select opt in "$ {options[@]}": This continues the menu functionality.


    do: This begins the process of executing our menu.


    case $opt in: This is used as an alternative to if/then style statements. It is
    an easier way to present choices for multiple executions within one script which
    can loop indefinitely.


    "Restart NextDNS" ): This identifies the menu option for which we will specify
    a command or series of commands. It should match the option as listed in the previous
    section verbatim.


    nextdns restart: This is the Terminal command which we want executed when the
    menu item is selected.


    ;;: This identifies the end of the command(s) within the chosen menu item.


    esac: This command (case backwards) ends our case statement.


    done: This is the end of our script.


    Next, you would create a "maintenance.desktop" file in your Documents folder which
    tells the operating system to launch the script from your Applications menu. Below
    is the code I used.


    ```

    ```sh

    [Desktop Entry]

    Type=Application

    Name=Maintenance

    Categories=Application;Maintenance

    Exec=/usr/share/applications/maintenance.sh

    Terminal=true

    ```

    ```


    Now, you want to make the script executable and move both of these files to a
    location which is out of the way and can be seen by the operating system. I used
    the following commands.


    ```

    ```sh

    cd Documents

    chmod +x maintenance.sh

    sudo mv maintenance* /usr/Share/applications/

    ```

    ```


    You should now see a new shortcut option within your Applications menu titled
    "Maintenance". The image below displays mine. Clicking this launches the script.
    I launch this script weekly to apply all updates, as discussed in the next chapter.'
