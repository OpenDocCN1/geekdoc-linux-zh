- pgno: 49
  md: '![](img/451a8c416cafc58e46802d06b4bc7b1a_49_0.png)


    Finally, I want to buy a domain and generate email forwarding service from it.
    There are numerous domain registrars and web hosts which will suffice, but I prefer
    Cloudflare. For $9 annually, I can own this domain and forward unlimited incoming
    email catch-all addresses to any external encrypted email provider, such as Proton
    Mail. I do not need to purchase a hosting plan from a third-party provider. For
    this example, I created a free Cloudflare account, which I associated with a new
    Proton Mail email address.


    Once I signed in to Cloudflare and presented with my account portal, I navigated
    to "Domain Registration" > "Register Domains". I then searched rental-bus.com
    and received the following result.


    # Find a domain


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_49_1.png)


    I purchased a domain for $9.15 and used a masked Privacy.com card for the transaction,
    but a traditional credit card could also be used. During the process, I was asked
    for my name, physical address, email address, and telephone number. These are'
