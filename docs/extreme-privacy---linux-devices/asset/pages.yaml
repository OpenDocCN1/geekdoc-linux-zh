    and click the "Settings" icon. Next, conduct the following.


    +   * In the "General" icon, click on the "Advanced" tab.

    +   * Change "Shared clipboard" and "Drag ''n'' Drop" to "Bidirectional".

    +   * In the "Display" icon, change the "Video Memory" to the maximum.

    +   * In the "Shared Folders" icon, click the green "+".

    +   * Click the drop-down menu under "Folder Path" and select "Other".

    +   * Choose a desired folder on your host to share data back and forth.

    +   * Select the "Auto-mount" option and then "OK".

    +   * Click "OK" to close the settings window.

    +   * Restart your VM.


    You should now have a more robust display, copy and paste capabilities, and a
    new shared folder connecting your VM to your host on the Desktop. You can copy
    files from your VM directly to your host and vice versa.


    # Snapshots


    A great feature of virtual machines is the use of Snapshots. These "frozen" moments
    in time allow you to revert to an original configuration or preserve an optimal
    setup. Most users install the virtual machine as previously detailed, and then
    immediately create a snapshot of the unused environment. When you accidentally
    remove or break a feature, you can revert to the previously created snapshot and
    eliminate the need to ever reinstall. Completely shut down the Virtual Machine
    and conduct the following.


    +   * In the VirtualBox Menu, click on the "Snapshots" button in the upper right.'
