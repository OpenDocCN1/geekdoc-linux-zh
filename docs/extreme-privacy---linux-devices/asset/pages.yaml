    +   - Telnx does not allow you to delete your user logs or text messages from
    their system in the way Twilio does.

    +   - Telnx suspends paid accounts if their automated fraud system detects unusual
    activity. I have experienced this myself when an unused account appeared suspicious
    to them. When I questioned about this practice, I was ignored.


