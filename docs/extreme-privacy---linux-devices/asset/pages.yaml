    # **Tor Browser**


    If you follow various privacy-related communities, you will hear many people promote
    the Tor Browser. This Firefox-based browser only connects to the internet via
    the Tor network, which hides your true IP address without a VPN. Since every Tor
    Browser user has the exact same browser configuration, we may not appear as a
    unique user when a website tries to fingerprint us. However, this is not perfect.
    If you are the only Tor Browser visitor to my fictitious clothing website, you
    stick out. Furthermore, many websites block connections from the Tor network altogether.
    If you try to log in to your bank from within Tor, expect to get blocked. Even
    worse, your account may be suspended.


    I only use the Tor Browser for investigations which rely on it in order to access
    a specific website within the Tor network (which usually ends in ".onion"). For
    everything else, I rely on my hardened Firefox, as previously explained. Installing
    Tor Browser within Linux is never straight-forward. Searching Tor within Pop!_Shop
    presents multiple options. At the time of this writing, I found the following
    to work best for Pop!_OS.


    +   • Open Pop!_Shop and search for "Tor".

    +   • Select the option titled "Tor Browser Launcher" and install the default
    option.

    +   • Launch "Tor Browser" from the "Show Applications" menu.

    +   • Allow the installation to complete and launch the browser.

    +   • Enable the "Always connect automatically" option and click "Connect".


    You should now be able to launch Tor Browser any time and begin using the program
    right away. Your web browser is your window to the internet. Please make sure
    you have hardened it to a level appropriate for your needs, but not to the point
    which you have restricted your necessary online activity. Having a hardened version
    of Firefox will provide great privacy from daily inroads into your online behavior
    while Tor Browser will be there for more sensitive tasks.'
