- pgno: 67
  md: '# # CHAPTER EIGHT: VIRTUAL MACHINES


    Virtual machines (VMs) virtualize or emulate a particular computer system. They
    are computer operating systems on top of computer operating systems. Most commonly,
    a software program is executed within an operating system, and individual operating
    systems can launch within that program. Each virtual machine is independent from
    the other and the host operating system. The environment of one virtual machine
    has no impact on any others.


    Quite simply, it is a way to have numerous computers within your single computer.
    VMs offer a "clean" environment with no contamination from other internet usage.
    You will be able to clone an original VM in minutes and trash them immediately.
    We will use virtual machines in order to isolate specific computer usage from
    the daily driver which gets bombarded with online tracking.


    When I have discussed Windows and macOS systems in other guides, I have encouraged
    readers to consider a Linux VM for sensitive tasks such as banking. If you are
    now using a Linux host, I believe secondary Linux VMs are overkill for many readers.
    You already possess great privacy and security within your host. Therefore, my
    guidance within this guide will focus on the following areas.


    +   - Create Linux VMs on Windows hosts in order to experiment with Linux or possess
    a secure Linux environment for specific tasks.

    +   - Create Linux VMs on macOS hosts in order to experiment with Linux or possess
    a secure Linux environment for specific tasks.

    +   - Create Linux VMs on Linux hosts in order to experiment with other Linux
    builds or possess a secondary Linux environment for specific tasks.

    +   - Create Windows VMs on Linux hosts in order to have traditional Windows operating
    system options within Linux.

    +   - Create Android VMs on Linux hosts in order to have traditional Android operating
    system options to launch mobile apps within Linux.


    Before creating a virtual machine, you must possess virtual machine software.
    There are several free and paid programs which allow you to create and execute
    virtual machines. Premium options such as VMware offer a free version, but it
    is extremely limited in function. Parallels works great on macOS, but is expensive.
    VirtualBox has always been the free gold standard for virtual machine creation,
    but it does not play well with newer macOS machines. UTM works well on M series
    Apple processors, but not any other systems. The list goes on. Therefore, I will
    break out each option in the following pages.


    # ## Creating a Linux VM on a Windows Host


    For Linux VMs on a Windows host, I recommend VirtualBox (virtualbox.org). Full
    installation steps can be found at virtualbox.org but are not usually straightforward.
    At the time of this writing, the following steps installed VirtualBox within Windows.


    +   - Navigate to virtualbox.org/wiki/Downloads.

    +   - Click the first appropriate link for your OS, such as "Windows Hosts".

    +   - Select the highest version NOT including "Beta", such as "7.0.0".

    +   - Download the appropriate "exe" file for Windows.

    +   - Download the Extension Pack for your version, such as "7.0.0.vbox-extpack".

    +   - Install the exe file with all default settings.

    +   - Double-click the Extension Pack and install it to VirtualBox.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'While VirtualBox is free for personal use, make sure you or your organization
    meets the requirements for usage of the software, especially the free Extension
    Pack license. The only requirement for VirtualBox to function is a computer that
    supports virtualization. Any modern Windows host should work without any modification.


    Most mid-range and high-end computers made within the past five years should have
    no problem, but may require you to enable virtualization support in the BIOS (Basic
    Input / Output System) during startup. Netbooks, older machines, and cheap low-end
    computers will likely give you problems. If you are in doubt about meeting this
    requirement, search for your model of computer followed by "virtualization" and
    you should find the answers. The rest of this section will assume that your Windows
    host computer meets this requirement and now possesses VirtualBox.


    First, we need to download the Pop! OS ISO file as previously explained. This
    file behaves similarly to a physical CD which would install Windows or any other
    operating system. Save the file to your Desktop or anywhere else to which you
    have easy access. Expect an approximate file size of 3 GB. Next, open VirtualBox
    and click on the button labeled "New". The following creates a VM appropriate
    for our needs. These exact steps change often, but this should provide the general
    settings required.


    +   - Provide a name of "Pop! OS" and choose your location to save the machine.

    +   - Select "Linux" as type, "Ubuntu 22.04 (64-bit)" as version, and click "Next".

    +   - Under Base Memory, move the slider to select 50% of your system memory.

    +   - Under Processors, move the slider to select 50% of your resources.

    +   - Click "Next" and then "Create".

    +   - Leave the hard disk file type as "VDI" and click "Next".

    +   - Select the default option of "Dynamically allocated" and click "Next".

    +   - Choose the desired size of your virtual hard drive. If you have a large
    internal drive, 50 GB should be sufficient. If you are limited, you may need to
    decrease that number.

    +   - Click "Create".


    Your VM has been created, but it will do nothing upon launch. We need to tell
    it to boot from the ISO file which we previously downloaded. Select your new machine
    in the menu to the left and complete the following.


    +   - Click the Settings icon then the Storage icon.

    +   - Click the CD icon which displays "Empty" in the left menu.

    +   - Click the small blue circle to the far right in the "Optical Drive" option.

    +   - Select "Choose a disk file".

    +   - Select the Pop! OS ISO previously downloaded then click "Open".

    +   - Click "OK" and then "Start" in the main menu.

    +   - If prompted, confirm your choice by clicking "Start".


    Your Pop! OS installation process should now start within a new window. You should
    be booting to the ISO file previously downloaded, which is behaving as if you
    had placed a Pop! OS install CD into the virtual computer. This is your first
    virtual machine running on top of your host operating system. If the window is
    too small, click "View", "Virtual Screen", then "Scale to 200%" within the VirtualBox
    menu. Avoid this, if possible, as it may cause viewing issues later. Consider
    reversing this setting once you are finished if things appear large. We can now
    finish the installation of Pop! OS with the previous tutorials.'
