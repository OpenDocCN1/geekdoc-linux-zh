    which were created in the past 30 to 60 days. Therefore, I prefer existing domains
    which have recently expired and been dropped from their registrar.

    First, I navigate to expireddomains.net and then click the "Deleted Domains" tab.
    I then sort by the following categories until I see desired domain structures.

    BL: Number of known backlinks

    ABY: The first year the domain was seen at Archive.org

    ACR: Number of Archive.org crawl results

    Reg: Number of Top Level Domains (TLDs) which match the domain

