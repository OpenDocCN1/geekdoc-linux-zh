- pgno: 25
  md: 'Let''s test our theory and execute the previous command to install KeePassXC
    manually. After installation, re-open Pop! Shop and click the "Installed" tab.
    If you scroll, you should find KeePassXC listed within the installed applications
    and services. Click the item and notice the screen change. The Ubuntu (deb) option
    now confirms it is installed and provides the option to uninstall via the click
    of a button. The following image displays my result.


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_25_0.png)


    This does not mean that I always prefer Apt installation over Flatpak. In this
    scenario, it was the best choice because I needed another application (Firefox)
    to be able to connect to the program. Manually installing via Terminal removed
    any trust that the Pop! Shop version could be tainted. Since this is a sensitive
    application, I want to scrutinize any installation and update options. This application
    will be updated when we execute our weekly commands presented at the end of this
    chapter.


    Let''s repeat with Bitwarden. Searching Bitwarden within Pop! Shop presents only
    one installation option, but it does not tell me much about it. The Bitwarden
    website mentions nothing about Flatpak, and an online search tells me that the
    version of Bitwarden within Flatpak is not an official release. There are probably
    no malicious intentions with this offering, but I only want my password managers
    directly from an official source.


    Contrary to KeePassXC, I prefer the AppImage installation for Bitwarden. This
    is because you can download the official application from their site and it will
    fetch its own updates without the need for any software repository. However, there
    is a new problem. The default way in which Pop! OS handles AppImages causes many
    to fail to open. After downloading, modifying the permissions, and executing,
    there is a good chance nothing will happen. This is why I prefer a different AppImage
    manger called AppImageLauncher. I executed the following within Terminal.


    ```

    sudo add-apt-repository ppa:appimagelauncher-team/stable -y

    sudo apt update

    sudo apt install appimagelauncher -y

    ```


    Now that AppImageLauncher is installed, we can simply double-click any AppImage
    file, including the Bitwarden program downloaded directly from their site. You
    should see a new window when doing this, and the default options are acceptable.
    The first time you launch an AppImage from this new application, you should be
    prompted to integrate AppImageLauncher into your system. I chose "Integrate and
    run". You should now see any AppImage programs embedded into your Applications
    menu and you can right-click entries there to uninstall them or pin them to your
    Dock. We can now search Bitwarden within Pop! Shop to check our work. The image
    below shows my result. Pop! Shop only gives me the option to install Bitwarden,
    even though I have the program installed and running. This is how we know we did
    not install the Flatpak version.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/451a8c416cafc58e46802d06b4bc7b1a_26_0.png)


    Are you confused yet? I know this can seem overwhelming when first encountering
    Linux. My software installation policy is simple. I search any sensitive programs
    within a web browser, visit the official site for the application, and identify
    the official ways of installing the software per their recommendations. If a "deb"
    or "apt" solution is available, I will typically prefer that in order to incorporate
    the program into my system. If only a Flatpak option is available on the official
    site, and in Pop!_Shop, I will install that if I am sure the application will
    work in a completely isolated environment. If the only way to automatically update
    a program is to use an official AppImage file, I will replicate the tutorial we
    just completed. We will have much more practice throughout the rest of this guide.


    # **Calendar & Contacts**


    Pop!_OS possesses default calendar and contacts applications, which can be accessed
    from the "Show Applications" icon within the Dock. By default, any data entered
    within these programs is stored locally within the encrypted drive. If you only
    need your calendar and contacts within your Linux device, these options should
    work well. However, locally-stored data is not likely sufficient for your needs.
    Most people want to synchronize their calendar events and contact data across
    multiple devices, especially to their mobile phones. You have two secure options
    for this.


    If you use Proton Mail, Tutanota, or Skiff Mail for your email, all stored contacts
    and calendar entries are end-to-end encrypted for your protection (Proton Mail
    does not encrypt the name and email address in order for their system to function
    properly, but the telephone numbers and notes are protected). This would allow
    you to see your data within web browsers and mobile device email apps. However,
    none of these services can synchronize your data to the stock Linux calendar and
    contacts applications (or the mobile equivalents). On mobile devices, this means
    that telephone apps and event notifications cannot access this data. For full
    secure synchronization, we need EteSync.


    EteSync (etesync.com) is a service which offers end-to-end encrypted calendar,
    contacts, and notes data. For $2 monthly, they will store your data on their servers
    in a secure way in which they cannot access any of your data. You can then download
    the'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'EteSync Bridge software onto your Linux machine and mobile devices. This software
    connects your encrypted EteSync data to any calendar or contacts applications.
    Any changes made within these apps are immediately reflected within the EteSync
    data. You could then synchronize this data with any other device, such as a smart
    phone. The one-time setup can be a hassle, but should never need repeated. If
    you want to use traditional calendar and contacts applications within Linux which
    synchronize securely to another device, EteSync is your best option. Let''s install
    it.


    First, create a free trial account at https://pim.etesync.com/signup. This allows
    one week of unrestricted access. After you have established credentials for the
    service, log into your account and create a new calendar and address book. Title
    these any way desired, then navigate to https://github.com/etesync/etesync-dav/releases/latest
    and download the file titled "linux-amd64-etesync-dav". After you have the file,
    execute the following within Terminal.


    ```

    ```

    cd Downloads

    chmod +x linux-amd64-etesync-dav

    ./linux-amd64-etesync-dav

    ```

    ```


    This should launch your browser to a page which will accept your EteSync credentials
    from your free trial. You will need to "Add" your account and then login with
    the same information. You are now synchronized to the EteSync server.


    Next, you need an application which can connect to your new secure EteSync account
    and synchronize the data in a viewable form. For this, I prefer Thunderbird. Thunderbird
    is an all-in-one email, calendar, and contacts solution which we will use for
    several tasks. Install and configure it with the following steps.


    +   - Open the Pop!_Shop and search "Thunderbird".

    +   - Click the entry to see the application details.

    +   - Change the Flatpak installation option to "Pop!_OS (deb)".

    +   - Click "Install".

    +   - Launch Thunderbird and cancel any wizard or welcome windows.

    +   - If prompted, choose the option to use thunderbird without email (for now).

    +   - Click the Calendar icon in the left menu, then the "+" next to "Calendar".

    +   - Select "On the Network" and click "Next".

    +   - Enter your EteSync username.

    +   - Return to your browser on the page at http://localhost:37358/web.

    +   - Click the "Collection Lists" link.

    +   - Right-click on the link for your calendar and select "Copy link".

    +   - Return to Thunderbird and paste this link into the location field.

    +   - Click "Find Calendars" and provide your EteSync password when prompted.

    +   - Click "OK" and allow the connection to complete.

    +   - Click "Subscribe" once the calendar has been identified.


    Let''s test everything. Open your browser and navigate to https://pim.etesync.com.
    Log into your account and click the Calendar tab. Create a new entry labeled "Test"
    in today''s date. Now open Thunderbird and make sure you are in the Calendar section.
    You should see your EteSync calendar along with the "Home" default calendar. The
    following image displays my own result. As you can see, my Thunderbird calendar
    shows this new entry. If yours does not, right-click your EteSync calendar and
    select "Synchronize Calendars".'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/451a8c416cafc58e46802d06b4bc7b1a_28_0.png)


    If you open the stock Calendar application within Pop! OS, you should also see
    any entries from your EteSync account. This is because EteSync is serving the
    data to Thunderbird, and Thunderbird is making that data available to any other
    traditional calendar application. If you like the stock option better than Thunderbird,
    you could use it. Personally, I use Thunderbird for all calendars, contacts, and
    email, which will be explained soon. First, is this all worth it?

    This may seem like a lot of effort just to synchronize a calendar. You could just
    use a Google account to replicate all of this without the fuss. However, we care
    more about privacy than convenience. Let’s digest what we have accomplished and
    how it may be more beneficial than the traditional way of accessing this data.

    EteSync stores all of your calendar and contact information securely with end-to-end
    encryption. They cannot access any of your data, as it is encrypted with your
    credentials. No one but you can see this information. Your Linux machine is set
    to synchronize the data at EteSync to your Thunderbird software. Any changes you
    make in Thunderbird (or the stock Calendar application) synchronizes to your EteSync
    account. Any other device with EteSync can also synchronize this data. Whenever
    I make a change to my calendar in Thunderbird, that change is synchronized to
    my EteSync account, and then also synchronized to my mobile device and second
    laptop. This way, I have a completely encrypted calendar across all devices in
    my life. I can also share calendars with my staff for group usage.

    The setup is a hassle, but worth it to me. However, we are not done. This is all
    working because the EteSync server is running in the background after we launched
    it during the previous instructions. We need this to always be running if we want
    constant synchronization capabilities. We can do this with the following steps.


    +   *   Launch "Show Applications" from the Dock and search "Startup".

    +   *   Launch the Startup Applications program.

    +   *   Click "Add" and label the name as "EteSync".

    +   *   Click "Browse" and select the "linux-amd64-etesync-dav" in Downloads.

    +   *   Click "Add" then "Close".


    Your EteSync program should now launch when you boot the device. However, let’s
    test it. Close all open applications and reboot the system. Launch Thunderbird
    and right-click one of your EteSync calendars, selecting "Synchronize Calendars".
    If you do not receive a connection error, you are all set. If you want to go further,
    you could log back into the web browser version, add a new event, refresh Thunderbird
    again, and make sure you see the change.

    I do not want the local calendars visible at all. I right-clicked the "Home" calendar
    and selected "Delete Calendar". This prevents me from mistakenly modifying a non-synchronized
    calendar.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'EteSync is the only service I have found which synchronizes this type of data
    in a secure way which can be accessed locally on the machine. It is worth the
    $2 monthly fee to me. You should test the service with a trial before committing.
    If you only need to synchronize this data within a browser-based service without
    access within stock applications, then Proton Mail, Tutanota, or Skiff may be
    all you need without any fees at all. Know your options and evaluate your own
    needs. We can now replicate these steps to synchronize our contacts within EteSync
    to our Linux device.


    +   * Re-launch Thunderbird and cancel any wizard or welcome windows.

    +   * Click the Contacts icon in the left menu.

    +   * Click the drop-down next to "New Address Book".

    +   * Select "Add CardDAV Address Book".

    +   * Enter your EteSync username.

    +   * Return to your browser on the page at http://localhost:37358/web.

    +   * Click the "Collection Lists" link.

    +   * Right-click on the link for your address book and select "Copy link".

    +   * Return to Thunderbird and paste this link into the location field.

    +   * Click "Continue" and provide your EteSync password when prompted.

    +   * Click "OK" and allow the connection to complete.

    +   * Click "Continue" once the address book has been identified.


    Your instance of Thunderbird should now be synchronizing all of your contacts
    and calendars to the EteSync server. If you do not have a calendar or address
    book in the collections list, you need to log back into EteSync and create them.
    While EteSync has an option for secure notes, I do not use it. I prefer Standard
    Notes, which will be explained later. You could now use my *Extreme Privacy: Mobile
    Devices* guide to synchronize your Android or iOS device to EteSync for a full
    contacts and calendars solution. My GrapheneOS device always has the latest changes.


    # Email


    I always prefer to handle daily email tasks within the web browser while logged
    into my provider''s site, but I also insist on a traditional email client within
    my Linux machine. I believe we should all have a full backup of our email messages,
    and we should never blindly rely on any email provider to be there when we need
    our content. What if they go out of business, suffer an online attack, or trigger
    our account as fraudulent? If we use our own domain for all email, we can forward
    it to a different provider. If we lose access to our email account, we have all
    of our messages saved locally.


    Much like the previous tutorials for calendars and contacts, I prefer Thunderbird
    as my Linux email client. After launching Thunderbird, you can either use their
    onboarding welcome menus or manually configure your email account by clicking
    the "Email" option under "Choose What to Set Up". You would then enter your email
    credentials supplied by your provider. This should be fairly straight-forward
    for most traditional email services. Encrypted options have hurdles.


    If you use Tutanota or Skiff as your encrypted email provider, you have no option
    to automatically synchronize your email messages to a email client. I rely on
    Proton Mail as my primary provider, and they supply a "Bridge" which makes the
    process fairly easy. The Pop! Shop has the unofficial Flatpak version ready to
    go, but I have reservations trusting unknown online individuals with the installation
    of this program. Therefore, I download the ".deb" file directly from https://proton.me/mail/bridge.
    This is an official build which will prompt within the application to install
    any official'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'updates. I can then right-click the downloaded file, choose "Open with Eddy",
    and click "Install". Once finished, I can launch the Proton Mail Bridge application
    and follow the prompts to configure the service.


    Once Proton Mail Bridge is functioning, it will synchronize your account locally
    in an encrypted manner, but that will not give you access to my messages. For
    this, we must configure Thunderbird to keep our messages synchronized, indexed,
    and searchable offline. In the email account setup Menu, provide your desired
    name and the credentials provided to you within the Proton Mail Bridge application.
    These will be different than the details provided to log into their website. The
    rest of the details should be automatically imported. If they are not, follow
    the detailed instructions at https://proton.me/support/protonmail-bridge-clients-windows-thunderbird.


    I do not want to present Thunderbird as an Apple Mail or Outlook clone. It may
    appear outdated to you, but the function is all we care about. I never send emails
    from Thunderbird. I only use it as a way to retrieve and archive the data from
    my email provider(s). I rely on my web browser to connect directly to my provider
    for daily email usage. The content on my machine is only for offline use and archiving.
    I launch Thunderbird and Proton Mail Bridge at least once a week to synchronize
    all new data. The backup may never be needed at all, but I will be relieved if
    disaster happens.


    # **Notes**


    I am a huge fan of **Standard Notes** (standardnotes.com). The free version provides
    fully end-to-end encrypted (E2EE) data. Only you can see your content, and you
    can synchronize all data to any other desktop or mobile device. I rely on my notes
    throughout every day. The paid version introduces more text formatting options
    and spreadsheet entries, but I prefer the plain-text feel of the free edition.
    However, the paid edition includes the ability to store two-factor authentication
    (2FA) codes, which is a huge benefit. This allows me to possess a truly cross-platform,
    open-source, encrypted application for my 2FA.


    Standard Notes possess an entry in Pop!_Shop (Flatpak), but it is also a community-supplied
    repository. I prefer to download any sensitive applications directly from the
    provider, much like I did with Proton Mail Bridge. If this were a simple text
    editor, I would have no problem using Pop!_Shop. However, this is my encrypted
    notes program which is extremely sensitive to me. Therefore, I navigate to the
    official website at https://standardnotes.com/download/linux and download the
    AppImage file with the "Begin Download" link. I then right-click on the downloaded
    file and select "Open With AppImageLauncher". I always choose the "Integrate and
    Run" option and allow the process to complete. Standard Notes will prompt you
    within the application if there are any pending updates.


    # **Books**


    I prefer Calibre (calibre-ebook.com) as my eBook library software. It allows me
    to collect the books I have purchased or downloaded and synchronize them to practically
    any eBook reader. It can safely be installed within the Pop!_Shop application.


    # **Messaging**


    I strongly encourage you and your contacts to adopt encrypted (E2EE) messaging
    for all communications. Signal (signal.org), Element (element.io), and Wire (wire.com)
    provide open-source E2EE platforms for voice, video, and text. There are many
    other great options, but these are the best for those who are new to the idea.
    Any or all of these can be installed by following the Linux installation steps
    on their websites.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# ## VLC


    Pop!_OS does not include any powerful media player. If you will ever encounter
    various audio and video files, I highly recommend installing VLC from Pop!_Shop.


    # ## Office


    Pop!_OS includes the LibreOffice suite of applications for word processing, spreadsheets,
    and presentations. However, I prefer ONLYOFFICE for this purpose. It can safely
    be installed from Pop!_Shop.


    # ## BleachBit Cleaner


    After some time, your Linux device will likely become saturated with old cache
    files, leftover data, and other unnecessary files. I recommend executing BleachBit
    once weekly to keep things under control. I prefer the BleachBit (as root) option
    within the Pop!_Shop (Flatpak). I accept the default configuration upon first
    launch. I then select every option except "Free Disk Space" and click "Clean".
    At this point in the book, while working from a new machine, I was able to free
    1.02 GB of data.


    # ## Utilities


    I prefer to add a few system utilities to any Linux distribution including GNOME
    Feeds for RSS, GNOME Podcasts for podcasts, and Metadata Cleaner to sanitize personal
    information from within files. All of these can be installed from within the Pop!_Shop
    with the default options. For Metadata Cleaner to function, you also need a utility
    called mat2, which can be installed via Terminal with the following.


    ```

    sudo apt install mat2 -y

    ```


    After a reboot, you can right-click on any image, video, or other file which may
    contain hidden metadata and clean the content. This will produce a second file
    next to the original with "clean" added to the file name.


    # ## Virtual Currencies


    If you need virtual currency access, I always recommend an offline software-based
    wallet without the need for a third-party exchange. I rely on Electrum for Bitcoin
    and Monero GUI Wallet for Monero. While you may find these programs within Pop!_Shop
    or another software repository, I would only install them directly from their
    original source. I obtain the AppImage file from the official Electrum site located
    at https://electrum.org/#download and then right-click the file to install it
    with AppImageLauncher. I then download the compressed Linux 64-bit file from the
    official site at https://web.getmonero.org/downloads, decompress it, and then
    right-click the Monero AppImage file to finish the installation process.


    # ## Application Updates


    You should keep your newly-installed software updated. The "Installed" tab within
    Pop!_Shop will allow you to patch your operating system and any Flatpak/Deb programs,
    but it does not update all individual applications. I keep the following commands
    digitally ready within my local notes application for easy copying and pasting,
    but a future chapter will present a custom script which will automatically execute
    all of these commands.


    ```

    sudo apt update

    sudo apt upgrade -y

    sudo apt full-upgrade -y

    pop-upgrade release upgrade

    sudo apt autoremove -y

    sudo apt autoclean -y

    flatpak update -y

    ```'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'You should now possess a Linux computer which is stable, secure, private, updated,
    cleaned, and includes the basic applications for daily use. There is still much
    more to be done, but you have the stapes completed. When we create our custom
    maintenance script later in the book, we will add even more commands to make sure
    we are keeping our system tidy.


    While most people rely on the providers of these applications to store encrypted
    data, extreme privacy enthusiasts might consider self-hosting as an option. This
    topic exceeds the scope of this guide, but there is plentiful information available
    online which could assist in self-hosting Bitwarden, EteSync, Standard Notes,
    and others. Next, we must tackle the most important program on our system: the
    web browser.


    # DNS Entries


    This would be a good time to revisit your NextDNS portal and check your logs.
    I like to launch every program once and then shut it down, then see what types
    of connections were made within NextDNS. The damage on my machine was fairly minimal,
    as seen in the following image (top). Thunderbird was the worst offender because
    it synchronizes with their own server. This is not malicious, but you could block
    these requests if desired. Standard Notes connects to its own server for data
    synchronization, so no harm there. If you were uncomfortable with ONLYOFFICE sending
    any data back to its servers, you could block the entire domain within NextDNS.
    That would allow complete offline usage of the program. I made this change (second
    image) and the connection was blocked on the next launch (third image).


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/451a8c416cafc58e46802d06b4bc7b1a_33_0.png)


    Next, we must consider proper web browser configuration and usage.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# **CHAPTER SIX: WEB BROWSERS**


    Before we consider connecting to various websites in order to take full advantage
    of our new Linux build, we should properly configure our web browsers. I recommend
    the Firefox web browser for most daily browsing, with limited use of other browsers
    for specific tasks. Firefox is already included with most Linux distributions,
    and the default Pop!_OS installation of Firefox is preferrred for our needs. Launch
    Firefox and consider the following modifications.


    +   * Click on the Firefox menu in the upper right and select "Settings".

    +   * In the "General" options, uncheck "Recommend extensions as you browse" and
    "Recommend features as you browse". This prevents some internet usage information
    from being sent to Firefox.

    +   * In the "Home" options, change "Homepage and new windows" and "New tabs"
    to "Blank page". This prevents Firefox from loading their default page.

    +   * Disable all "Firefox Home Content" options.

    +   * In the Search options, change the default search engine to DuckDuckGo and
    uncheck all options under "Provide search suggestions". This prevents queries
    from going directly to Google, and blocks the Google API from offering search
    suggestions.

    +   * Click the "Privacy & Security" menu option and select "Strict" protection.

    +   * Check the box titled "Delete cookies and site data when Firefox is closed".

    +   * Uncheck the box titled "Show alerts about passwords for breached websites".

    +   * Uncheck the box titled "Suggest and generate strong passwords".

    +   * Uncheck the box titled "Autofill logins and passwords".

    +   * Uncheck the box titled "Ask to save logins and passwords for websites".

    +   * Uncheck the box titled "Autofill addresses".

    +   * Uncheck the box titled "Autofill credit cards".

    +   * Change the History setting to "Firefox will use custom settings for history".

    +   * Uncheck "Remember browsing and download history" and "Remember search and
    form history".

    +   * Check the box titled "Clear history when Firefox closes". Do not check the
    box titled "Always use private browsing mode", as this will break Firefox Containers.

    +   * Uncheck "Browsing history" from the "Address Bar" menu.

    +   * In the Permissions menu, click "Settings" next to Location, Camera, Notifications,
    and Virtual Reality. Check the box titled "Block new requests..." on each of these
    options. If you will never need audio communications within this browser, you
    could do the same for Microphone.

    +   * Uncheck all options under "Firefox Data Collection and Use".

    +   * Uncheck all options under "Deceptive Content and Dangerous Software Protection".
    This will prevent Firefox from sharing potential malicious site visits with third-party
    services.

    +   * Select "Enable HTTPS-Only Mode in all windows".


    These settings are what I refer to as the basics, and may be enough for most readers.
    This is where I want to deviate from previous writings. Prior to this publication,
    I always presented several settings which could be modified within the Firefox'
  merge: -1
  img_proc: true
- pgno: 35
  md: '"about:config" menu. I no longer recommend this, which may upset some privacy
    fanatics. Please consider my reasons before abandoning this chapter. The purpose
    of my previous recommendations was mostly to prevent browser fingerprinting or
    canvasing. This activity is often abused by online sites which try to track you
    as you navigate the internet. If I own a clothing website and I can collect numerous
    identifiers from your browser, you are unique from everyone else who has ever
    visited my site. When you come back a week later, I know you are the same user,
    and I can continue to track your activity within my site.


    Previously, I had recommended readers change various settings, such as the ability
    for a website to know your current battery level, in order to make you appear
    less unique to the malicious systems snooping on your connection. Today, thanks
    to advancements in fingerprinting technology, I believe those settings could do
    more harm than good. If you are the only visitor on that site which disabled this
    setting, you now appear even more unique than if you had done nothing.


    At the risk of offending some readers, I firmly believe the following statement.
    We can no longer defeat modern browser fingerprinting by making modifications
    to our browsers. Anything we change, or any extension we add, almost always makes
    us a unique visitor in the eyes of sophisticated fingerprinting systems. The more
    actions you take to blend into the crowd likely makes you stick out more. There
    are exceptions to this, but for general usage, sites will continue to track us.
    They will also collect our IP addresses, installed fonts, video characteristics,
    location metrics, and browser specifications at all times. That will never change.


    Furthermore, many of the current recommended about:config Firefox privacy tweaks
    break other desired functions. If you try to block all possible IP address leakage
    via WebRTC, you will likely also break the ability to use voice and video conferencing
    within your browser. There must be a balance of protections versus functionality.


    Using a VPN, as explained later, and the previous Firefox settings stop most invasions.
    Since Firefox does not share cookies from one domain with another, we have strong
    privacy by default. If you want pure anonymity, stay off the internet. If you
    need the most protection possible, consider the Tor Browser, as explained later.


    Next, I will discuss the abundance of helpful browser extensions called add-ons.


    The first vital add-on I install on every computer is uBlock Origin. It blocks
    many ads and tracking scripts by default, but it also can block any other type
    of script that is attempting to run on a page. This helps prevent tracking, malicious
    code execution, location sharing, and a number of other processes that could undermine
    your privacy and security.


    This add-on is completely free and open source. It is highly customizable, while
    remaining relatively easy to work with. uBlock Origin works from blacklists which
    block trackers specified in the list(s). The add-on comes with several lists enabled,
    but there are several more that can be added through simple checkboxes in the
    preferences. Keep in mind that the more blacklists you enable, it may be more
    difficult to work within the browser. This section may seem a bit overwhelming
    at first, but experimenting with the advanced settings should help you understand
    the functionality.


    I have previously recommended NoScript, Adblock Plus, Privacy Badger, and Disconnect
    as privacy add-ons that would help stop unwanted ads, tracking, and analytics.
    These are no longer present on any of my systems. I now only use uBlock Origin,
    as it replaces all of these options. Let''s start with the basics.'
