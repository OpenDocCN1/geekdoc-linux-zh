- pgno: 87
  md: '# CHAPTER TEN: UPDATES & MAINTENANCE


    I hope you now have your ideal Linux device configured specifically for your needs.
    Next, you need to make sure you keep it that way. I encourage you to adopt a Linux
    maintenance schedule which makes most sense for you. My routine is to conduct
    all computer maintenance on Friday afternoons when my digital workweek is over.
    I just so happens that I am writing this chapter on Friday, July 21, 2023. This
    makes it easy to document my entire process. I try to take the following actions
    once weekly when I am able to shut my computer down without interrupting any pending
    work.


    First, I open the Maintenance script and quickly launch option 7. This applies
    all Apt, Pop!\ OS, and Flatpak updates, and also removes unnecessary items from
    these updates. I then launch Pop!\ Shop just to make sure there are no pending
    updates which my script may have missed. Next, I check for any additional updates
    from "Settings" > "OS Upgrade & Recovery". I run BleachBit as root and clean everything
    except "Free Disk Space". Finally, I reboot the machine.


    Once my computer is completely updated, cleaned, and rebooted, I like to make
    a full backup. A paid program is not needed. Instead, I rely on a free and open-source
    program called FreeFileSync, available within Pop!\ Shop. This program can be
    used to synchronize any two folders, but we will only focus on our Home directory.
    First, we need to format our external drive. I highly recommend an external USB
    SSD, such as the SanDisk Extreme line of drives. If you have a 1 TB or smaller
    internal drive, the $82 SanDisk 1 TB Extreme Portable SSD ([https://amzn.to/42S7x7M](https://amzn.to/42S7x7M))
    would work well. Larger internal drives will require larger external devices.
    The more expensive "Pro" versions of these drives will not provide much benefit
    for our purpose. I format my external SSD specifically for backups with the following
    steps.


    +   * In Pop!\ OS, launch "Files" and right-click your external drive.

    +   * Select "Format" and provide a name, such as "Backup".

    +   * If you will only be using this with Linux, choose "Internal disk for use
    with Linux systems only (Ext4)".

    +   * If you want the drive encrypted, select the "Password protect volume" option.

    +   * Click "Next" and supply a secure password if prompted.

    +   * Click "next" until you reach the "Format" option and click it.


    If you encrypted the drive, which I recommend, the process will take some time
    to complete. You will need to unlock it with the password every time it is inserted
    into your machine. Now, let''s conduct our first backup within FreeFileSync.


    +   * Close any pop-up windows and click "Browse" in the left "Drag & drop" area.

    +   * Click your home folder in the left menu, likely identified with the house
    icon.

    +   * Click the "Open" button and click "Browse" in the right "Drag & drop" area.

    +   * Select your external hard drive and click "Create Folder".

    +   * Create a folder called "backup" on your USB disk, tap enter, and click "Open".

    +   * Click the right arrow icon next to the green cog wheel near "Synchronize".

    +   * Change the option to "Mirror".


    The mirror option makes sure that the data on the external drive is always an
    exact replica of the content on your computer. If your system name was "pop" and
    external drive was labeled "backup", yours might look similar to mine below. You
    could save this configuration with the "Save as" icon, naming it "Home Backup".'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/451a8c416cafc58e46802d06b4bc7b1a_88_0.png)


    Next, click "Compare" and allow the analysis. You may receive warnings that FreeFileSync
    is trying to access your Desktop, Download, and other folders, but this is acceptable
    for this purpose. You may also receive a warning about an area which is inaccessible
    to the program. I click "Ignore All" when this happens. Once complete, you should
    see a summary of all files which will be synchronized. Clicking the "Synchronize"
    button begins the backup process, which can take some time on the first run.


    The next time you need to back up your data, you would connect your drive; unlock
    the encryption by entering the password; open FreeFileSync; and select the "Compare"
    button again. This time, you should only be presented the files which have been
    modified since the last backup. Then, the synchronization process should be much
    faster.


    After I have conducted a backup, I open my email client and fetch all email from
    my provider onto my machine. I specifically do not do this before the backup.
    In the event that I deleted an important email from within my provider’s server,
    which would then also delete the offline copy from my machine, I know that my
    previous backup has all emails which existed the previous week. This is minor,
    but something which has saved me in the past.


    If I am able, I now shut down the machine and see how long I can go through the
    weekend without booting it back up. Some weekends are better than others. On Monday
    morning, I know I have a tidy, clean, and updated Linux machine ready for the
    week.'
