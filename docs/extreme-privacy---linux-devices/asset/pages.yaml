    \ Linux device is using NextDNS for all DNS queries, and you can see the logs\
    \ of these requests in your NextDNS portal. This may be alarming to some readers.\
    \ The \"Logs\" tab in your portal identifies every connection being made from\
    \ your device. This can be a privacy concern, but it has many benefits. We can\
    \ now apply filters which will block many undesired connections.\n\nClick the\
    \ \"Privacy\" tab and notice the automatically-applied blocklist. If this was\
    \ not applied, add the \"NextDNS Ads & Trackers Blocklist\". This database blocks\
    \ over 100,000 connections which are associated with ads, trackers, and malware.\
    \ This will block a lot of unwanted connections such as pop-up ads, tracking code,\
    \ telemetry, and user analytics. You now have greater protection. The following\
