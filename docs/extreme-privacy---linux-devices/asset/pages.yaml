- pgno: 22
  md: '![](img/451a8c416cafc58e46802d06b4bc7b1a_22_0.png)


    The red bar on the left confirms which incoming connections were blocked. We can
    see our blocklist in action. On yahoo.com, dozens of ads and trackers were blocked
    without any effort from us. We do not need any browser extensions or firewall
    applications. This is the true power of NextDNS. This blocking strategy is much
    cleaner with minimal resource usage. It also prevents conflicts with VPN applications.
    This is all a lot to digest. Let’s summarize some of the key takeaways. By default,
    your internet service provider supplies DNS services, and often uses that data
    maliciously. When you configure NextDNS on your Linux device, you are using their
    lookup service instead. Furthermore, the blocklists can prevent applications from
    sending out telemetry and analytics about your usage. This will become much more
    apparent in the next chapter. Remember the limits of the free tier. Most people
    will not exceed 300,000 queries a month. If you have multiple devices, you can
    either create an account for each or pay a small fee for NextDNS’s premium service.


    Some readers may be upset that I have chosen NextDNS over AdGuard as a filtering
    DNS provider. My reasons are the following.


    +   * I have more trust in NextDNS. The founders are publicly visible and I know
    who runs the company. They are reputable people who have been heavily involved
    in this space and are transparent about their reasons for the service.

    +   * A premium-tier business model explains the funding for resources.

    +   * AdGuard is a Russian company which was moved to Cyprus, but their infrastructure
    remains in Russia. A Russian CEO has minimal presence on the internet, but there
    is no information about any other owners.

    +   * The support from NextDNS has been superior. When I contacted both companies
    with questions about the product, only NextDNS responded. One of the owners provided
    full details.

    +   * AdGuard recently announced a new program similar to NextDNS which will allow
    custom filtering. However, my emails requesting information were unanswered. The
    custom options from NextDNS have been thoroughly tested and vetted.


    The final privacy consideration in regard to DNS is account-based versus publicly-
    available servers. While a custom NextDNS account can be wonderful for blocking
    (or allowing) connections, it does carry some risk. Since you have an account,
    all queries could be tracked back to a specific user. Disabling logs should prevent
    this, but a court order could override your configuration. Using an alias name
    should provide comfort. Public NextDNS servers do not require an account, but
    provide no custom filtering. If you want to filter ads without an account, I do
    believe AdGuard is currently your best option (dns.adguard.com). However, you
    cannot modify the protection. If they block a domain, there is no way to unblock
    it. Again, this is where custom filtering from NextDNS is superior.


    Are you sick of DNS yet? There are many opinions of the proper way to use DNS
    services. None of them are perfect for everyone. I hope you take the information'
  merge: -1
  img_proc: true
