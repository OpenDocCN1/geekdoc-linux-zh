- pgno: 41
  md: 'If you configured NextDNS as your DNS query and filtering provider, you do
    not need to modify the DNS settings within Firefox. By default, Firefox will use
    the system DNS which we previously configured with NextDNS. Any changes you make
    to the Firefox DNS settings will override your system DNS when querying websites
    through Firefox. This removes your filtering options. However, you may have a
    need to switch Firefox queries to another provider. If you are exceeding the 300,000
    monthly lookups because of heavy browser usage or want an unfiltered browser while
    maintaining protection to the rest of your Linux device, you might want to make
    a change. Overall, the order of DNS usage is as follows.


    +   - If your web browser has a custom DNS assigned, then all queries from within
    that browser will use the specified DNS, regardless of any other settings within
    Linux.


    +   - If you have no DNS assigned within the browser, then your DNS queries will
    be conducted based on the provider which is assigned within Linux.


    +   - If you did not assign any DNS provider within the browser or Linux, then
    your DNS will rely on your network (likely the ISP).


    I really like NextDNS as the DNS service for my entire Linux system, as it filters
    unwanted connections from some installed applications, such as the ONLYOFFICE
    example from the previous chapter. However, I really do not need that level of
    filtering within Firefox since uBlock origin does the same thing with immediate
    access within the browser extension. I conduct the following within Firefox.


    +   - Navigate back to the “Settings” menu and select “Privacy & Security”.


    +   - Scroll down to the “DNS over HTTPS” section.


    +   - Click the “Max Protection” option and select “NextDNS”.


    Your browser will now conduct all DNS queries within an encrypted connection to
    NextDNS, regardless of any other settings within Linux. This is a public instance
    of NextDNS, and is not associated with your account. Note that this only applies
    to websites visited from within this installation of Firefox, and not to any other
    applications.


    From now on, all domain name queries from my operating system or other applications
    will be conducted by NextDNS and associated with my account. Filtering is active.
    All DNS queries within Firefox will be conducted through a public NextDNS server
    and will not be associated with my account. There will be no filtering and the
    uBlock Origin extension will be the sole content filtering provider. The Firefox
    queries will not count against my monthly free allotment from NextDNS.


    # ## VPN Configuration


    Virtual Private Networks (VPNs) provide a good mix of both security and privacy
    by routing your internet traffic through a secure tunnel. The tunnel goes to the
    VPN''s server and encrypts all the data between your device and that server. This
    ensures that anyone monitoring your traffic before it reaches the distant server
    will not find usable, unencrypted data. Privacy is also afforded through the use
    of a distant server. Because your traffic appears to be originating from the VPN''s
    server, websites will have a more difficult time tracking you, aggregating data
    on you, and pin-pointing your location.


    Virtual Private Networks are not a perfect anonymity solution. It is important
    to note that VPNs offer you privacy, not anonymity. The best VPNs for privacy
    purposes are paid subscriptions with reputable providers. There are several excellent
    paid VPN providers out there and I strongly recommend them over free providers.
    Free'
