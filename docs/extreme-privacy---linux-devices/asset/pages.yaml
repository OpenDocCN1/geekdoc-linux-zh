    # Twilio Account Sanitization


    If you use any manual SMS/MMS messaging option, message metadata and content remain
    on Twilio’s servers, and could be accessed by employees. Every voicemail you receive
    also stays present on their servers as an MP3 file, which can be accessed via
    direct URL without any credentials. Let’s identify manual ways to remove this
    data, beginning with stored text messages. An automated option is presented soon.


    +   - Navigate to https://console.twilio.com.

    +   - Make note of the "Account SID" and "Account Token".

    +   - Click on "Messaging" then "Overview" in the left menu.

    +   - Open any "Recent Message" by clicking the date and note the "Message SID".


    You can now open Terminal and issue a command to delete each message. If your
    "Account SID" was 11, "Account Token" was 22, and "Message SID" was 33, the command
    would be as follows.


    ```

    `curl -X DELETE https://api.twilio.com/2010-04-01/Accounts/11/Messages/33.json
    \ -d "Body=" -u 11:22`

    ```


    This can be quite annoying if you need to purge hundreds of messages. Voicemail
    and call log deletion is more straightforward within the website. The following
    steps allow you to remove this data from your console.


    +   - Navigate to https://www.twilio.com/console/voice/dashboard.

    +   - Open any log entry which has an arrow icon under "Recording".

    +   - Click "Delete this call log" and confirm.

    +   - If desired, delete individual call logs from this location.


    Twilio stores 13 months of call log history by default. If you possess numerous
    recordings which need removed, you can use the bulk deletion tool with the following
    directions.


    +   - Go to https://www.twilio.com/console/voice/recordings/recording-logs.

    +   - Click "Select", "Select All", "Actions", "Delete Recordings", then confirm.


    If you have enabled the call transcription service, you may wish to remove all
    voicemail text transcriptions stored within your account.


    +   - Click "Monitor", "Logs", then "Call Transcriptions" in the left menu.

    +   - Open each transcription and click "Delete this transcription".


    While writing this section, I realized that my data had not been sanitized for
    a long time. My Twilio dashboard possessed voicemails and text transcriptions
    about my health, family, friends, and work. I spent an hour cleaning all of it,
    then disabled transcriptions using the previous tutorials. It saves me $0.05 per
    call and eliminates one more place where sensitive information could be stored.
    We can also disable some logging by Twilio with the following modification.'
  merge: -1
  img_proc: true
