- pgno: 50
  md: '+   - Providing false information could result in losing the domain. I have
    only seen this happen when domains were abused to send spam, but it could happen
    to us. We should obey the rules.

    +   - Providing an alias name and non-existing email address is a sure-fire way
    to lose control of the domain. If you are ever required to verify ownership of
    the domain via email or ID, you will not be able to confirm yourself.


    Therefore, let''s be honest...kind of. Any time I register a domain, I provide
    a shortened version of my true first and middle names as my full name. If my full
    name was "Michael John Bazzell", I might provide "Mich John" as my name. I have
    friends who call me Mike, but I have never seen them spell it. Therefore, maybe
    it is "Mich" in their heads. If my middle name is John and my grandmother called
    me Michael John often, that is my real name.


    Next, they demand a physical address. I always purchase new domains while I am
    staying at hotels during travel. Technically, it is my home for the night. I always
    include the room number during my registration. I typically provide the hotel
    phone number as well, since domain registration is always verified over email.
    I provide the same Proton Mail email address which I supplied to Cloudflare as
    the domain registration contact. I maintain a digital copy of my hotel receipt,
    including my first and middle name, along with the dates of my stay and room number,
    in case I am ever asked to provide proof of the provided residence (I have never
    been asked). Is this overkill? Maybe. Cloudflare does not publicly share any of
    your registration details, and requires a court order to release that information.
    However, a breach or bad employee could easily eliminate all of my hard work to
    be as anonymous as possible. Therefore, I mask the information to a level which
    I feel comfortable presenting as my own.


    Once I own the domain, I navigate to "Websites" and select my new domain. I then
    click the "Email" tab and complete the "Email Routing" requirements. At the time
    of this writing, the following applied. Please note that the exact wording changes
    rapidly at Cloudflare, so you may see some minor differences.


    +   - Click the "Get started" button.

    +   - Create a custom email address, such as "comms@rental-bus.com".

    +   - Provide a destination address where your incoming email should be forwarded.

    +   - Click "Create and continue".

    +   - Confirm the request within your receiving email account.

    +   - Click "Add records and enable" to apply the appropriate DNS settings.


    In this scenario, any email sent to "comms@rental-bus.com" would be forwarded
    to the Proton Mail email address which I previously supplied. You should now click
    "Email" > "Email Routing" within the Cloudflare portal. Then, click the "Routes"
    tab and enable "Catch-all addresses". This allows any email to your new domain
    to be forwarded to your receiving address. If you sign up for a service using
    email addresses of "VoIPcall@rental-bus.com", "sales@rental-bus.com", "manager@rental-bus.com",
    they will all automatically forward to your reception address. This allows you
    to create new addresses on the fly without any email configuration. Note that
    these will only receive messages, you cannot send from them. Obviously, you do
    not have to use Cloudflare for this. You could register a domain at any web host
    and pay them for email services. I prefer this route due to cost, as I own'
