    现在你可以像往常一样使用你的虚拟机了。如果你希望恢复到创建快照时机的机器状态，请遵循以下说明：

    - 完全关闭虚拟机。

    - 在 VirtualBox 菜单中，点击“快照”并选择要应用的快照。

    - 点击带有箭头的蓝色相机图标以“恢复快照”。

    - 拒绝保存当前数据的选项，并点击“恢复”。


    可选地，如果你希望删除某个快照，只需点击带有红色“X”的图标即可。这将删除数据文件以消除浪费的空间，但一旦删除，你就无法恢复到该映像。它不会影响当前的机器状态。许多用户在创建较新的干净机器后会删除旧的、冗余的快照。


    我真希望能说每一位读者都能轻松地在任何计算机上构建虚拟机。但事实并非如此。虽然大多数计算机都支持虚拟机使用，但许多计算机需要进行轻微修改才能允许虚拟化。让我们来看看
    VirtualBox 呈现的最常见错误。


    **VT-x 已禁用：** 此类错误的任何变体都是你的虚拟机无法启动的最常见原因。这表明你电脑的处理器要么不支持虚拟化，要么该功能未启用。修复方法因机器和处理器品牌而异。在电脑刚开机、操作系统启动之前立即进入机器的
    BIOS。通常通过立即按下 delete、F2、F10 或其他指定键直到出现 BIOS 菜单来实现。进入 BIOS 后，你可以通过键盘在菜单中导航。在许多
    Intel 处理器中，你可以打开“高级”选项卡并将“虚拟化 (VT-x)”设置为“启用”。对于 AMD 处理器，请打开“M.I.T.”选项卡、“高级频率”设置、“高级核心”设置，然后将“SVM
    模式”设置为“启用”。如果这些选项均未出现，请在在线搜索中加上你的电脑型号和“虚拟化”一词以查找说明。


    **VT-x 不可用：** 这通常只出现在 Windows 10 和 11 机器上。导航到 Windows 控制面板并打开“程序和功能”。点击“启用或禁用
    Windows 功能”并取消勾选所有“Hyper-V”功能。点击“确定”并重启。如果 Hyper-V 选项未启用，请启用 Hyper-V，重启计算机，禁用
    Hyper-V，并再次重启。使用这些新设置尝试启动你的虚拟机。这似乎有些反直觉，但这是有道理的。旧版本的 VirtualBox 在你使用 Windows 中的“Hyper-V”时无法运行。基本上，两个系统都试图获取处理器虚拟化功能的独占访问权。Windows
    中的 Hyper-V 首先获得访问权并阻碍了 VirtualBox 对功能的使用。最新版本的 VirtualBox 试图修正这一点。如果之前的设置没有帮助，请尝试在
    Windows 中重新启用所有 Hyper-V 选项，重启，并再次尝试启动你的虚拟机。如果你仍然遇到问题，请阅读 VirtualBox 手册中的故障排除章节，位于
    virtualbox.org/manual/ch12.html。展开收到的任何错误，并搜索提供的错误代码以识别更多解决方案。


    **VirtualBox 显示：** 以前版本的某些读者报告在 VirtualBox 中无法调整虚拟机窗口大小，且“自动调整客户机显示”菜单选项呈灰色。以下在
    Linux 虚拟机终端中的命令应该可以修复此问题。如果你不确定，运行这些命令是没有害处的。


    ```bash

    sudo apt update

    sudo apt install -y build-essential dkms gcc make perl

    sudo rcvboxadd setup

    reboot

    ```


    ## 在 macOS 主机上创建 Linux 虚拟机


    我认为 UTM (mac.getutm.app) 是 Apple 电脑最好的虚拟化软件。这款卓越且免费开源的软件在 macOS 上的表现优于任何其他免费或付费产品。请确保已安装
    Homebrew (brew.sh)，然后通过终端使用以下命令安装它。


    ```bash

    brew install --cask utm

    ```


    UTM 允许 macOS 用户在任何拥有 Intel 或 ARM (Apple) 处理器的主机上启动几乎任何虚拟系统。这意味着它将适用于任何 Apple 电脑，无论硬件如何。UTM
    使用 Apple 的 Hypervisor 虚拟化框架，在 Apple Silicon 上以接近原生的速度运行 ARM 操作系统。在基于 Intel 的机器上，可以虚拟化传统的
    x86/x64 操作系统。此外，还提供了较低性能的模拟功能，可以在 Apple Silicon 上运行 x86/x64，也可以在 Intel 上运行 ARM64。这为我们提供了几乎任何想要的选项，并且是该程序独有的。即使是付费替代品也没有提供所有这些功能。该软件依赖于
    QEMU，而 QEMU 过去总是难以配置。现在我完全依赖 UTM 来管理我 macOS 机器上的所有虚拟机，并发现它优于 Windows 或 Linux 主机。


    打开 UTM 后，你可以选择“创建新的虚拟机”。如果此选项不可见，你可以通过点击程序菜单中的“文件” > “新建”来复制此操作。选择此项会提供对读者可能来说是新的事物。你可以选择对新虚拟机进行“虚拟化”或“模拟”。我们应该理解这两者的区别。


    **虚拟化：** 这个过程是在硬件（通常是 hypervisor）的帮助下完成的。它通过从主机系统分配专用资源给新创建的虚拟系统，将单台物理计算机的硬件资源虚拟地共享到多个虚拟设备中。这通常比模拟快得多，也是我们将为新虚拟机选择的选项。如果你拥有
    M1、M2 或更新的 Apple 处理器，你不能虚拟化 x86/x64 操作系统，只能虚拟化基于 ARM 的系统。同样，你也不能从 x86/x64 机器上虚拟化基于
    ARM 的系统。在使用虚拟化时，操作系统必须是为设备中存在的处理器创建的。


    **模拟：** 这个过程更为宽容，但可能较慢。它使用软件来模拟特定的硬件。这意味着虚拟机需要一个软件解释器将其代码翻译为主机系统的语言。这会消耗大量资源并可能导致性能拖沓。由于虚拟机不在主机的物理硬件上运行，与虚拟化相比，模拟速度更慢。相比之下，在虚拟化中，客户系统可以直接访问主机分配的资源，从而获得更好的速度。拥有此选项是很好的，但本章中我们不会使用它。让我们一起在
    UTM 中构建第一个 Linux 虚拟机。选择“虚拟化”选项，然后选择“Linux”。这导致我们需要根据硬件选择正确的路径。你必须为处理器选择适当版本的 Linux。如果你拥有
    Intel 设备，可以使用之前用于安装到主机的标准 Pop!_OS ISO 文件。你也可以使用其网站上可用的 Ubuntu ISO。如果你拥有 M1、M2
    或更新的处理器，你需要 Ubuntu 的 ARM 版本，因为 Pop!_OS 无法在你的机器上工作。以下是当前的每个版本的下载链接。


    - Intel 设备的 Pop!_OS: https://pop.system76.com

    - Intel 设备的 Ubuntu: https://ubuntu.com/download

    - ARM 设备的 Ubuntu: https://cdimage.ubuntu.com/jammy/daily-live/current/


    如果选择 ARM 版本，请务必不要误选 AMD 版本。在我们继续之前，让我们更多地谈谈这些版本。Pop!_OS 和 Ubuntu 22.04 桌面 LTS
    是适用于所有 Windows 和 Linux 主机以及较旧 macOS 机器的版本。它们是长期支持版本，支持到 2027 年。对于基于 Intel 的机器来说，这是简单的选择。Apple
    M1、M2 及更新的机器较为棘手。它们需要 Ubuntu 的 ARM 版本，但 Ubuntu 目前不提供官方的 ARM LTS 版本。然而，他们确实支持自官方
    22.04 LTS 发布以来开始的一个每日 ARM 构建版本。我们可以下载 LTS 服务器版并根据我们的需求进行修改，但我发现这是不必要的。基于当前 LTS
    版本的 ARM 桌面每日构建版本对我工作良好。然而，我绝不会使用 22.10、23.04、23.10 等版本的每日版本。这些版本往往有更多的 bug 和问题。如果你在阅读此内容时是在
    2024 年 4 月之前，你应该下载 22.04 的每日 ARM 构建版本。2024 年，希望我们将拥有官方的 LTS ARM 版本。如果没有，请使用 24.04
    的 ARM 每日版本。


    一旦你下载了适合你系统的 Linux 版本，点击 UTM 中的“浏览”按钮并选择下载的 ISO 文件。保持“使用 Apple 虚拟化”选项未勾选是安全且稳定的方法。然而，M1、M2
    或更新设备在将来选择此选项可能会运行得更好。暂时保持未勾选，因为你以后可以随时构建另一台机器来比较性能。在撰写本文时，它在 Linux 上不起作用。点击“继续”。


    选择你系统内存的一半和 CPU 核心。如果你有 16 GB 的 RAM 和一个八核处理器，你会将 RAM 更改为“8192”，并将 CPU 核心更改为“4”。永远不要将核心保留为“默认”，因为这可能会让操作系统困惑。完成后点击“继续”。驱动器的大小应设置为你将永远需要的最大值。这不是虚拟机随着其增长的大小，它只是最大值。我将其设置为“100”
    GB。


    我更喜欢启用文件共享，因为它使你更容易从调查中提取证据到主机上。浏览到你想要的共享文件夹（我选择了下载）并点击“继续”。完成整个流程并点击箭头图标以启动你的新
    Linux 虚拟机。现在你准备安装 Linux 了。如果安装 Pop!_OS，请遵循以前的指南进行配置。如果安装 Ubuntu，请在 UTM 中的新虚拟机初次启动后考虑以下事项。


    ### 仅限 Ubuntu 22.04 LTS 桌面版：


    - 选择“试用或安装 Ubuntu”。

    - 选择“安装 Ubuntu”。

    - 选择你期望的语言和位置，然后点击“继续”。


    ### 仅限 Ubuntu 22.04 ARM 每日桌面版：


    - 选择“试用或安装 Ubuntu”。

    - 如果提示，输入用户名“ubuntu”和密码“password”。

    - 双击桌面上的“安装 Ubuntu 22.04.1 LTS”。

    - 选择你的语言和键盘布局，然后点击“继续”。


