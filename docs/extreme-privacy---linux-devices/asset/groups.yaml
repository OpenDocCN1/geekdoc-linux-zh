    All of this logging may seem invasive. It is, but it is not unique to Twilio.
    Twilio is doing nothing more than every other telephony provider including cellular
    and landline telephone companies. We have some control of how the data is stored,
    but I do not want to present false expectations here. While Twilio may appear
    to have deleted your call logs, voicemails, messages, and transcriptions, they
    are all likely still stored somewhere within their system. Our only goal is to
    remove the data from within our dashboard. Never expect any level of privacy when
    it comes to traditional phone calls and messages. VoIP services should never be
    used for sensitive communication. Assume there is a log of everything which will
    be stored forever.


    # Telnx VoIP Service


    In past writings, I highly recommended a Twilio alternative called Telnx. At the
    time, they were less scrupulous of new accounts and encouraged people to try their
    services. Today, I urge caution before proceeding. This is due to several issues.


    +   - Telnx only provides accounts to confirmed businesses. However, your new
    custom domain email address may suffice.

    +   - Telnx no longer provides actual customer support. Support tickets only receive
    canned responses, and the request is eventually closed without a solution. Calls
    to their support line inform you to send an email, which is never answered. You
    will need to do your own troubleshooting if required.

    +   - Telnx does not provide voicemail services.

    +   - Telnx does not allow you to delete your user logs or text messages from
    their system in the way Twilio does.

    +   - Telnx suspends paid accounts if their automated fraud system detects unusual
    activity. I have experienced this myself when an unused account appeared suspicious
    to them. When I questioned about this practice, I was ignored.


    However, I know of some people who prefer Telnx over Twilio. Their monthly number
    fee is slightly less and redundancy is always a good thing. If the Twilio tutorial
    did not generate the usage you desire, possibly due to a suspended account, you
    might consider Telnx (https://refer.telnx.com/refer/zrfmo). This VoIP provider
    replicates the service provided by Twilio, but their setup process is easier.
    Now that you have an understanding of Twilio, I will abbreviate the steps here
    for Telnx.


    +   - Create a free account at https://refer.telnx.com/refer/zrfmo . This specific
    URL provides $20 in free credits which can be used right away.

    +   - Provide a custom domain email address, which was previously explained.

    +   - If prompted for purpose, choose "SIP Trunking".


    You should now be logged in to the Telnx portal. You can now create your first
    connection and purchase a telephone number.


    +   - Click "Voice" then "SIP Trunking" from the side menu.

    +   - Click the "+ Add SIP Connection" button.

    +   - Enter the name you wish to have for your connection (I chose "VoIP").

    +   - Click "Create Sip Connection".

    +   - Enable "Credentials" as the "Connection Type".

    +   - Copy the username and password automatically generated.

    +   - Click "Save and finish editing".

    +   - Click "Numbers", "My Numbers", and "Search & Buy Numbers".'
