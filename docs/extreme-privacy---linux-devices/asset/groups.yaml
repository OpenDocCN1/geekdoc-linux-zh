    with hopes of minimizing the need for an ID due to Know Your Customer (KYC) regulatory
    requirements. Today, I possess a working VoIP.ms account, and I encourage you
    to test their service. If you are able to secure a functioning account, I think
    you will find it much easier than the previous two providers. First, you need
    an account by registering at **https://voip.ms/en/invite/Mzc2NjM3**. Using this
    link at signup should provide you $10 in free credits after you add $15 to your
    balance, and a bit less scrutiny on your new account. However, please note all
    of my comments at the beginning of this chapter. If you supply "John Doe" with
    a burner email and CMRA address, expect to get suspended. Since we will be using
    these VoIP numbers with people in our circles as an alternative to our cellular
    number, I see no reason to use an alias name for this service. In late July, this
    affiliate link''s stats showed that 35% of the people who used the link were able
    to open an account while 65% were denied pending identity verification (we do
    not see any names or other account details). I have no solutions to this. If you
    are able to obtain service, consider adding a number and connecting it to Linphone
