    ## 作者简介：迈克尔·巴泽尔


    迈克尔·巴泽尔代表政府调查计算机犯罪超过 20 年。在大部分时间里，他被指派到联邦调查局的网络犯罪特勤组，专注于各种在线调查和开源情报（OSINT）收集。作为一名调查员和通过美国法警局宣誓的联邦官员，他参与了许多重大刑事调查，包括在线诱骗儿童、儿童绑架、绑架、未破谋杀案、恐怖主义威胁以及高级计算机入侵。他已培训了数千人使用他的调查技术和隐私控制策略。


    离开政府工作后，他担任电视剧黑客剧集 *《黑客军团》*（Mr. Robot）第一季的技术顾问。他的书籍 *《OSINT 技术》*（OSINT Techniques）和
    *《极致隐私》*（Extreme Privacy）被多个政府和私营组织用作情报收集和隐私强化的培训手册。他现在主持 *《隐私、安全和 OSINT 节目》*（Privacy,
    Security, and OSINT Show），并协助个人客户实现终极隐私，无论是主动预防还是应对不希望的情况。有关其服务的更多详细信息可在 *IntelTechniques.com*
    上找到。


    ## 前言：Linux 设备


    我于 2012 年写了我的第一本隐私相关书籍，题为 *《从互联网上隐藏》*（Hiding From The Internet）。最终演变为 *《极致隐私》*（Extreme
    Privacy） 的标题，这是一本 517 页的大型教科书，现为第四版，于 2022 年初发布。2023 年初，我与员工开始讨论未来第五版的可能性。当时有些阻力。我们刚刚发布了
    550 页的 *《OSINT 技术》*（OSINT Techniques） 教科书，我们都对整个过程感到精疲力竭。攻击 *《极致隐私》* 新版本的想法当时似乎让人不知所措。我们提出了较小书籍的想法。


    *《极致隐私》* 的许多读者对单卷中包含的信息总量表达了沮丧。由于有 320,000 字，一次性消化所有内容可能令人难以承受。其他批评是，读者不一定需要书中的所有信息。有些人希望专注于信托、有限责任公司和游牧常驻地，不需要所有以技术为主题的章节。另一些人只想了解安全计算机、移动设备和其他技术主题，并不关心我关于匿名住所或汽车的看法。这是有用的反馈，并影响了发布这本数字书籍的决定。*《极致隐私》*
    受到的最大批评是关于格式。我较大的 OSINT 和隐私书籍仅提供印刷版。这令许多希望避免亚马逊或更喜欢在屏幕上阅读的读者感到不满。随着本次发布以及之前的 *《移动设备》*
    电子书，我们仅提供 PDF 文件。没有正式的印刷版，我们已排除了亚马逊在整个出版过程中的参与。这使我们能够提供更低的价格，并且每笔购买的 90% 直接支持我们的免费播客。如果你购买了这本书，感谢你的支持！


    我们意识到，原生 PDF 将导致该作品在线被盗版。我们接受这一点。我们相信，通过提供免费的适当更新，我们可以为合法购买者提供进一步的好处。如果我们必须修改现有内容或添加全新的章节，我们可以向所有购买者发送电子邮件广播，允许他们免费下载带有所有更新的新副本。由于该作品的每个副本都带有可见和隐藏的唯一代码水印，我们可以阻止那些未经同意发布该书籍的人获取更新。总体而言，我们希望奖励支持我们的人，提供可搜索、可复制、可更新和可打印的文档，即使有失去一半销售额给盗版者的风险。


    在 *《极致隐私：Linux 设备》* 中，我继续我们教程的新方法。它不是 *《极致隐私》*（印刷书）的替代品。请将其视为关于 Linux 设备更彻底的补充。我希望这能进一步延续这一系列较短的卷，每一卷都专注于一个特定主题。这允许人们仅以更实惠的价格购买他们需要内容。它还允许我们更快速地发布内容，因为我们可以根据需要在一次专注于一个领域，而不是将内容保留给潜在的未来发布。免费更新对每个人都是有益的。我现在仅呈现我们关于构建最佳
    Linux 设备的数字指南。


    ## 引言


    几年前，我开始使用 Linux 作为我全职的主要操作系统。几十年来我一直涉足 Linux，并在我的 OSINT 书籍中大量依赖它用于虚拟机，但我并没有将其作为我的日常驱动，直到我最终对微软和苹果强加给我的隐私侵犯感到受够了。Windows
    和 macOS 操作系统不断监控您的使用情况并收集有关您的设备、位置、文档和整体活动的敏感数据。他们声称存储这些数据是为了您的利益，以提供定制的计算体验。这可能是真的，但当这些数据泄露、被入侵或被法院命令交出时会发生什么？我们能做些什么来离开这个隐私和安全风险的生态系统？


    我认为答案是 Linux。如果你只熟悉 macOS 或 Windows 环境，我想你会对使用 Linux 作为计算机操作系统的易用性和简单性感到惊喜。会有一些学习曲线，但我保证阅读此指南的任何人可以进行转换。我相信在每日使用一个月后，你会更喜欢
    Linux。你甚至可能在完全投入 Linux 后发现 macOS 和 Windows 机器难以使用。


    这本书将帮助你创建一台不向苹果、微软或其他滥用此信息的提供商发送任何敏感数据的机器。我们将阻止他们在我们购买的硬件中归档我们的活动。使用我们的操作系统或下载应用程序不需要在线账户。我们将完全控制我们的设备和操作系统。使用我们的系统永远不需要请求姓名、电话号码或物理地址。我们将夺回隐私，同时拥有满足我们独特需求的完美机器。


    整本书都是为对极致隐私感兴趣的读者设计的。我不会粉饰我的观点，也不会为了便利而提供不太安全的选项。我会解释每一个步骤，并且永远不对读者的技术水平做出假设。这是我们为每个新客户的
    Linux 设备制定的完整剧本。它由我们的内部客户教程和员工手册组成，并由我提供扩展细节。它应该允许你根据你的需求创建完美的私密且安全的 Linux 设备。我不遗漏任何东西，并包含许多
    *《极致隐私，第 4 版》* 中此前省略的新策略。


