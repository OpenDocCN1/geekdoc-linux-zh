    ## 虚拟私人网络（VPN）的使用及其隐私影响


    这些漏洞可能会暴露比预期更多的数据，但我们可以讨论一些关于互联网流量的误解。首先，我们应当解决 SSL/TLS 的问题。SSL（安全套接字层）及其后继者 TLS（传输层安全协议）是用于在联网计算机之间建立经过身份验证且加密的链接的协议。这与你在浏览器地址栏中看到任何以
    "https" 开头的网站时显示的锁形图标有关。这表示连接是安全的，但这究竟意味着什么？我将通过几个例子来简化说明这项技术。假设你正使用直接连接到互联网服务提供商（ISP）的家用电脑，并且没有使用
    VPN。你连接到 Google 并搜索 "inteltechniques"。呈现给你的响应 URL（包括查询的搜索结果）是 `https://www.google.com/search?q=inteltechniques`。你的互联网服务提供商（ISP）知道你通过
    Google 进行了搜索吗？是的。他们知道你搜索了 "inteltechniques" 吗？不。这是因为 Google 加密了实际的搜索 URL。你的互联网连接提供商只能看到被访问的域名。它无法看到有关特定页面的任何详细信息或输入的任何凭据。


    这就是为什么网站的 https 版本如此重要。你的浏览器可以看到这个完整的 URL，但它不会直接将其中的任何详细信息与你的提供商共享。现在，让我们引入一个
    VPN。连接到你的 VPN（例如 Proton VPN）后，你进行同样的搜索。你的 ISP 知道你通过 Google 进行了搜索吗？不。你的 VPN 提供商知道你通过
    Google 进行了搜索吗？是的。你的 VPN 提供商知道你搜索了 "inteltechniques" 吗？不。为什么这很重要？每个人都有独特的威胁模型，但我将介绍几种你可能担心的场景。


    首先，考虑我通过民事诉讼起诉你，并且我说服法官授予我收集你互联网活动的法院命令。由于我知道你的居住地，我可以推测你的互联网服务提供商。法院命令向你 ISP
    索取你的互联网活动。如果你的 ISP 记录你的流量（大多数都会这样），响应将告诉我你访问过的每个域名以及发生的具体日期和时间。我可以使用这些信息来证明你访问过特定网站，或向指定服务传输了大量数据。如果你启用了
    VPN，我只能证明你的设备是通过 VPN 连接的。我无法知道你活动涉及的任何域名。向 VPN 提供商发出的第二份法院命令也不会揭示这些数据。信誉良好的 VPN
    不记录此类流量，且 IP 地址在成千上万的用户之间共享。


    接下来，假设我想知道你住在哪里。我知道你的电子邮件提供商是 Gmail，向他们发出的传票将揭示你在特定日期和时间的 IP 地址。如果该 IP 地址属于你的互联网服务提供商，第二份传票将披露服务地址（你的家）。如果该
    IP 地址属于你的 VPN 提供商，它将不会揭示关于你或 VPN 账户的任何详细信息。向 VPN 提供商发出的关于该 IP 地址信息的传票将不会揭示任何日志，只会解释成千上万的陌生人之间
    IP 地址共享的情况。


    现在，让我们结合之前提到的策略来挫败这种行为。由于你始终连接到 VPN，你的 ISP 不了解你的互联网流量。向他们发出的传票不会揭示你访问的网站。由于 Proton
    Mail 不以明文形式记录你的 IP 地址，他们无法确定你的真实 IP 地址。由于 Proton VPN 和 Proton Mail 是瑞士公司，它们不会回应来自美国的传票。如果你在购买
    VPN 服务时未提供真实姓名，VPN 提供商无法从你的账户中获取任何信息（例如个人信用卡号或家庭地址）。我希望你现在能明白，所有这些策略都在相互加强。


    没有哪家 VPN 公司是完美的，所有公司都可能会留下潜在的数字痕迹。我选择最有可能保护我的选项，因为它失去的代价最大。如果 Proton VPN 被查获存储或出售用户数据，其整个公司都将失去所有信誉和许多客户。如果一家拥有多个
    VPN 品牌的大公司被查获这样做，他们只需关闭其中一个品牌，并为另一个品牌启动新的营销活动即可。我相信，与大型 VPN 公司相比，Proton VPN 有更大的动力来保护其产品和声誉。


    **重要提示：** 在各种 Linux 环境中对 Proton VPN 进行大量测试时，我遇到了在启用或禁用 VPN 后互联网连接中断的情况。这是由于 NextDNS
    和 Proton DNS 之间的冲突造成的。如果你遇到这种情况，在终端中运行以下命令将重启 NextDNS 服务，应能解决此问题。我会在下一页详细介绍更多相关内容。


    ```bash

    nextdns restart

    ```


    ### VPN 的 DNS


    需要注意的是，如果你在电脑上使用 VPN 应用程序，它很可能会忽略你在设备上进行的任何 DNS 修改，并使用自己的服务器。这对于许多情况是可以接受的，但并非对每个人都理想。通过允许你的
    VPN 保护所有流量并提供所有 DNS 查询，你将所有的鸡蛋放在同一个篮子里，不再享受 NextDNS 的过滤功能。你正在信任你的 VPN 提供商，使其有能力记录你的所有互联网历史和流量。如果你使用的是可靠的
    VPN，这可能不是巨大的威胁，但我们可以做得更好。我将假设你已如前所述配置了 NextDNS，并修改你的浏览器以使用公共 NextDNS 服务器。如果你未对
    VPN 应用程序的 DNS 设置采取任何行动，则以下情况适用：


    - 当你的 Linux VPN 应用程序禁用时，你的整个 Linux 系统使用 NextDNS 账户进行所有带有过滤的 DNS 查询，而 Firefox 使用公共
    NextDNS 服务器进行无过滤的查询。

    - 当你的 Linux VPN 应用程序启用时，它使用自己的 DNS，你的操作系统内没有 NextDNS 的过滤，但 Firefox 仍然使用其自己的公共
    NextDNS 服务器进行无过滤的查询。


    如果你想改变这种情况，你只需在连接到 VPN 后重启 NextDNS 服务即可。以下是我在 Linux 设备上需要启动随后终止 Proton VPN 应用程序时的策略。


    - 启动 VPN。

    - 重启 NextDNS 服务并进行我的在线活动。

    - 完成后终止 VPN。

    - 重启 NextDNS 服务。


    如果我的 NextDNS 服务正在运行，我启动 VPN，VPN 开始使用其自己的 DNS 服务器。在某些情况下，由于两种服务相互竞争，你的整个互联网连接可能会断开。当我重启
    NextDNS 时，它会覆盖 VPN 的 DNS 服务器。当我终止 VPN 时，它也可能终止任何冲突的 DNS，这就是为什么我在关闭 VPN 后立即重启 NextDNS
    的原因。在第九章中，我们将为此创建一个简单的脚本。让我们回顾一下。


    - 我已在 Pop!_OS 安装中配置了我的 NextDNS 账户，如第四章中先前所述。它是我所有应用和系统本身的通用 DNS。我启用了过滤。

    - 在我的 Firefox 浏览器中，我将安全 DNS 选项设置为 "Max"，并选择 NextDNS 作为选项。Firefox 内的所有 DNS 查询都通过公共服务器进行，不进行过滤。我的
    Ublock Origin 扩展将处理所有不需要的流量的过滤。

    - 我安装了 Proton VPN，但我很少打开它。我使用网络范围的家庭防火墙，如《极端隐私》第四版中所述。这为我提供了机器上的 VPN 保护，无需 Linux
    VPN 应用程序，并允许我在 Linux 软件中指定任何 DNS 服务器。

    - 当我不在家时，我启动 Proton VPN 应用程序，然后重启我的 NextDNS 服务。然后，我的 Linux 系统和所有非 Firefox 应用都将使用此
    DNS 并受益于过滤服务。我还在关闭 VPN 后重启 NextDNS 服务。


    对于大多数人来说，总体目标是阻止你的 ISP 窥探你的流量。即使你不更改 VPN 的 DNS，所有这些情况都能防止这一点。至于你要走到哪一步，取决于你。


    ### Tor 浏览器


    如果你关注各种隐私相关社区，你会听到许多人推崇 Tor 浏览器。这个基于 Firefox 的浏览器仅通过 Tor 网络连接互联网，无需 VPN 即可隐藏你的真实
    IP 地址。由于每个 Tor 浏览器用户都有完全相同的浏览器配置，当网站试图对我们进行指纹识别时，我们可能不会被视为独特用户。然而，这并不完美。如果你是访问我虚构服装网站的唯一
    Tor 浏览器用户，你就会显得非常显眼。此外，许多网站完全阻止来自 Tor 网络的连接。如果你试图在 Tor 内登录银行，预计会被阻止。更糟糕的是，你的账户可能会被暂停。


    我只在需要依赖 Tor 浏览器才能访问 Tor 网络内特定网站（通常以 ".onion" 结尾）的调查中使用 Tor 浏览器。对于其他情况，我依赖我经过加固的
    Firefox，如前所述。在 Linux 中安装 Tor 浏览器从来都不是简单的。在 Pop!_Shop 中搜索 Tor 会提供多个选项。在撰写本文时，我发现以下方法在
    Pop!_OS 上效果最好。


    - 打开 Pop!_Shop 并搜索 "Tor"。

    - 选择标题为 "Tor Browser Launcher" 的选项并安装默认选项。

    - 从 "显示应用程序" 菜单中启动 "Tor Browser"。

    - 允许安装完成并启动浏览器。

    - 启用 "始终自动连接" 选项并点击 "连接"。


    现在你应该能够随时启动 Tor 浏览器并立即开始使用程序。你的网络浏览器是你通往互联网的窗口。请确保你已根据你的需求对其进行加固，但切勿将其限制到阻碍你必要的在线活动的程度。拥有加固版的
    Firefox 将为日常在线行为提供很好的隐私保护，而 Tor 浏览器将用于更敏感的任务。


