    ## CHAPTER FOUR: DNS CONFIGURATION


    The moment you enable an internet connection to any device, the system begins
    sending information to a variety of servers. This could include unharmful data
    such as a check for updates, time synchronization, or retrieval of any pending
    messages.


    While most Linux operating systems do not send invasive telemetry in the way that
    Microsoft and Apple do, third-party applications might. Many of the apps we trust
    are actually sending usage information about us behind our backs. My goal is to
    present options which reduce or eliminate the exposure. The way we can do this
    is with a third-party DNS service.


    If you have read my macOS guide, you know that this chapter focused on the use
    of a software firewall instead of DNS. While a firewall application called Open
    Snitch exists for Linux, I currently do not recommend it. It has been quite buggy
    for some time, and currently does not work within Ubuntu or Pop!_OS without tweaking
    the execution any time you want to launch the application. While I insist on a
    software firewall for macOS devices, I do not believe it is necessary for Linux.
    My main usage of Little Snitch on macOS is to block connections to Apple. Linux
    does not present these concerns. However, I do believe we need some type of content
    filtering.


    First, we should understand the nature of the Domain Name System (DNS). DNS can
    be a very overwhelming topic. In a very basic and simple explanation, DNS translates
    domain names, such as inteltechniques.com, into IP addresses in order to locate
    the appropriate content. In a typical setup, your home or mobile internet service
    provider (ISP) conducts your DNS queries quietly without your input. In other
    words, your ISP knows every website domain you visit, regardless of SSL encryption,
    and knows your billing details. If you did not purchase internet or cellular service
    anonymously, then they also know your identity. ISPs collect a lot of valuable
    information about you this way, and often sell these details for marketing purposes.
    I want to stop that.


    By default, your Linux device relies on the DNS service of the network to which
    you are connected. This could be your home Wi-Fi or cellular provider’s service.
    You have the option to specify a different DNS server for all queries generated
    from your device. I implement NextDNS (nextdns.io) service for all of the desktop
    devices and phones of all clients.


    NextDNS conducts the DNS queries required in order to navigate your internet traffic,
    but it also includes filtering options. I will explain with an actual configuration
    demonstration conducted from my test device in a moment. First, create a new free
    account at https://my.nextdns.io/signup. Any masked or private email address should
    be accepted and no payment source is required. I used an alias name. The free
    tier allows 300,000 monthly queries at no cost.


    After registration, you should be taken to your NextDNS user portal which should
    display a “Linux” menu option under “Setup Guide”. The first option should display
    the preferred "systemd" installation, but it will likely conflict with a VPN application.
    Instead, we will install NextDNS with the following Terminal command.


    ```

    sh -c "$(curl -sL https://nextdns.io/install)"

    ```


    Provide the following responses:


    - Enter "i" to install, and provide your password when prompted.

    - Enter your NextDNS profile ID, such as d4c2af.

    - Enter "Y" to report device name and "n" to setup as router.

    - Enter "y" to enable caching and "y" to enable instant refresh.

    - Enter "Y" to setup local DNS hosts.


    This will launch NextDNS as your system DNS provider after installation. You can
    use the following commands to start, restart, or stop the service at any time.


    ```

    nextdns start

    nextdns restart

    nextdns stop

    ```


    Every time you boot the computer, the DNS service should stay in the same state
    as the previous shutdown. If you shut down the machine while NextDNS was active,
    it should be active at the next boot. In Chapter Nine, we will create a script
    which allows easy enabling and disabling of NextDNS, which might be important
    when we discuss VPNs. **If your machine cannot connect to the internet, execute
    nextdns restart.** This will correct the situation most of the time.


    As long as this connection is active, your Linux device is using NextDNS for all
    DNS queries, and you can see the logs of these requests in your NextDNS portal.
    This may be alarming to some readers. The "Logs" tab in your portal identifies
    every connection being made from your device. This can be a privacy concern, but
    it has many benefits. We can now apply filters which will block many undesired
    connections.


    Click the "Privacy" tab and notice the automatically-applied blocklist. If this
    was not applied, add the "NextDNS Ads & Trackers Blocklist". This database blocks
    over 100,000 connections which are associated with ads, trackers, and malware.
    This will block a lot of unwanted connections such as pop-up ads, tracking code,
    telemetry, and user analytics. You now have greater protection. The following
    image displays my configuration and the menu.


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_19_0.png)


    Click on the "Logs" tab again and take a look at the traffic. You may need to
    refresh the page to see new results. Mine appeared as follows.


    | Domain/Server | Action/Status |

    | --- | --- |

    | 🌐 virginia.time.system76.com | 🔒 A few seconds ago |

    | 🌐 paris.time.system76.com | 🔒 A few seconds ago |

    | 🌐 oregon.time.system76.com | 🔒 A few seconds ago |

    | 🌐 ohio.time.system76.com | 🔒 A few seconds ago |

    | 🌐 brazil.time.system76.com | 🔒 A few seconds ago |

    | 🌐 2.ubuntu.pool.ntp.org | 🔒 A few seconds ago |

    | 🌐 api.pop-os.org | 🔒 A few seconds ago |

    | 🌐 1.ubuntu.pool.ntp.org | 🔒 A few seconds ago |

    | 🌐 0.ubuntu.pool.ntp.org | 🔒 A few seconds ago |

    | 🌐 ntp.ubuntu.com | 🔒 A few seconds ago |


    This may seem alarming, as these multiple connections are transmitting data without
    us doing anything but rebooting the system. However, this is harmless. All of
    the connections except "apt.pop-os.org" are time servers attempting to make sure
    our clock is synchronized correctly. The "apt" connection is looking for any software
    updates which may need applied. These results prove that the filtering is working.
    NextDNS is conducting all of our DNS queries and filtering any content which it
    deems malicious or invasive.


    These multiple queries to time servers may seem like overkill. The five System76
    time servers are the default option and the "ntp" servers are a fallback. Since
    System76 uses the encrypted Network Time Security (NTS) protocol, I prefer to
    rely solely on them. If you want to remove any of the options, you can do so by
    modifying a couple of system files. However, we have a problem.


    The files we need to modify are protected system files. If we navigate to them
    and open with a double-click, we will be in read-only mode without the ability
    to modify the contents. We can cheat with the following Terminal command, which
    opens the "Files" application (Nautilus) with administrative privileges. After
    execution, you will be prompted to enter your Linux password.


    `sudo nautilus`


    You should now be presented with a file explorer which possesses administrative
    rights. Consider the following.


    - Navigate to "Computer" > "etc" > "chrony" > sources.d.

    - Double-click the file titled "system76-nts.sources".

    - Remove any undesired servers and click "Save".

    - Close all open windows.


    If you want to disable the non-encrypted Ubuntu fallback options, conduct the
    following.


    - Execute `sudo nautilus` within Terminal.

    - Navigate to "Computer" > "etc" > "chrony".

    - Double-click the file titled "chrony.conf".

    - Remove each line containing "ubuntu.pool.ntp.org".

    - Change "pool ntp.ubuntu.com" to "pool pool.ntp.org" and click "Save".

