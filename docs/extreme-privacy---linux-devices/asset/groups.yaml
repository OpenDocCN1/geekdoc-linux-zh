    - Disable "Launch in a tool window" and click "OK".


    Now choose your desired device and click the arrow button to launch. You should
    see a device similar to that in **Figure 8.02**. You are now running a virtual
    version of Android within your desktop environment. If desired, you could follow
    my *Extreme Privacy: Mobile Devices* guide or *OSINT Techniques* book to configure
    a complete Android device.


