    gsettings set org.gnome.nautilus.preferences show-hidden-files false

    gsettings set org.gtk.Settings.FileChooser show-hidden false

    ;;

    "Start NextDNS" )

    nextdns start

    ;;

    "Stop NextDNS" )

    nextdns stop

    ;;

    "Restart NextDNS" )

    nextdns restart

    ;;

    "Launch Files with Admin" )

    sudo nautilus

    ;;

    "Apply Updates")

    sudo apt update

    sudo apt upgrade -y

    sudo apt full-upgrade -y

    pop-upgrade release upgrade

    sudo apt autoremove -y

    sudo apt autoclean -y

    flatpak update -y

    ;;

    esac

    done

    ```


    This is a fairly basic Bash script, but let''s walk through each piece to understand
    the functionality for future replication.


    - `#!/bin/bash`: This first line is known as a ''she-bang''. It identifies the
    text file as a script of commands to be executed.

    - `clear`: This command simply clears the screen in order to present a clean menu.
    While not necessary in this script, I prefer to clear the screen before presenting
    any content. This eliminates any other text which may be confusing to the viewer.

    - `COLUMNS=12`: This command displays the contents within a column. It prevents
    the menu choices from being displayed as a single horizontal line. You can modify
    this number if your menu items do not fit as desired.

    - `PS3=''Selection: ''`: PS is short for Prompt Statement. PS3 presents a menu
    of choices in which you can select a corresponding number to execute the option.
    This basically creates an option for selection of future items in the script.

    - `options=("Restart NextDNS")`: This is where we place the options for the menu.
    These should be worded exactly as we want them to appear within Terminal. There
    is no limit and each should be in their own quotation marks.

    - `select opt in "${options[@]}"`: This continues the menu functionality.

    - `do`: This begins the process of executing our menu.

    - `case $opt in`: This is used as an alternative to if/then style statements.
    It is an easier way to present choices for multiple executions within one script
    which can loop indefinitely.

    - `"Restart NextDNS" )`: This identifies the menu option for which we will specify
    a command or series of commands. It should match the option as listed in the previous
    section verbatim.

    - `nextdns restart`: This is the Terminal command which we want executed when
    the menu item is selected.

    - `;;`: This identifies the end of the command(s) within the chosen menu item.

    - `esac`: This command (case backwards) ends our case statement.

    - `done`: This is the end of our script.


    Next, you would create a "maintenance.desktop" file in your Documents folder which
    tells the operating system to launch the script from your Applications menu. Below
    is the code I used.


    ```ini

    [Desktop Entry]

    Type=Application

    Name=Maintenance

    Categories=Application;Maintenance

    Exec=/usr/share/applications/maintenance.sh

    Terminal=true

    ```


    Now, you want to make the script executable and move both of these files to a
    location which is out of the way and can be seen by the operating system. I used
    the following commands.


    ```bash

    cd Documents

    chmod +x maintenance.sh

    sudo mv maintenance* /usr/share/applications/

    ```


    You should now see a new shortcut option within your Applications menu titled
    "Maintenance". The image below displays mine. Clicking this launches the script.
    I launch this script weekly to apply all updates, as discussed in the next chapter.


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_84_0.png)


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_84_1.png)


    ### Twilio Sanitization Script


    I previously explained the reasons Twilio is my preferred VoIP provider. If you
    use your Twilio numbers often, manually sanitizing the data stored on Twilio''s
    servers is quite time consuming. I possess an automated script which conducts
    all actions on my behalf, and presents information about my account when needed,
    all without logging into my Twilio account. Let''s start by installing Twilio''s
    CLI tool with the following steps. This should only be applied if you have a Twilio
    account.


    - Navigate to `https://github.com/twilio/twilio-cli/releases`.

    - Expand the latest "Assets" area until you find one with an "amd64.deb" file.

    - Download the file, similar to "`twilio-5.10.0-amd64.deb`".

    - Right-click the downloaded file, select "Open with Eddy", and click "Install".


    Once installed, execute the following within Terminal.


    ```bash

    twilio login

    ```


    This will ask for your Twilio SID and Token, which can be found in your portal.
    When prompted, provide a name of "CLI". Next, execute the following.


    ```bash

    twilio profiles:use CLI

    ```


    This generates the appropriate configuration file which tells your computer to
    use this profile with the provided credentials for all future commands. You can
    now manually interact with the Twilio CLI using the following Terminal commands.


    ```bash

    twilio phone-numbers:list

    twilio api:core:calls:list

    twilio api:core:messages:list --properties=''sid,from,body''

    twilio api:core:recordings:list

    twilio api:core:transcriptions:list

    ```


    We can now automate the sanitation steps within a script which can be downloaded
    and installed with the following Terminal commands.


    ```bash

    cd ~/Documents

    wget https://inteltechniques.com/data/twilio.sh

    chmod +x twilio.sh

    wget https://inteltechniques.com/data/twilio.desktop

    sudo mv twilio* /usr/share/applications/

