    # KeePassXC-Browser


    If you installed the KeePassXC password manager and want to access auto-fill functionality
    within Firefox, install the official extension from the Firefox repository on
    their site at https://addons.mozilla.org/en-US/firefox/addon/keepassxc-browser.
    After installation, conduct the following.


    +   - Open your KeePassXC database and click the settings icon.

    +   - Choose the "Browser Integration" menu option.

    +   - Select "Enable browser integration" and enable "Firefox".

    +   - Click "OK" and return to Firefox.

    +   - Click the KeePassXC icon and then click "Connect".

    +   - Provide a unique name, such as "Firefox", and click "Save and allow access".


    Your Firefox browser can now access passwords stored within the KeePassXC database
    without any data being sent over your internet connection.


