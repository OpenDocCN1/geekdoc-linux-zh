    章节中那样应用快照。


    ## 在 Linux 主机上创建 Android 虚拟机


    我喜欢能够在我的 Linux 主机中启动移动应用程序。这需要一台 Android 虚拟机，我认为 **Android Studio** (developer.android.com/studio)
    是我们最佳的选择。它可以安装在 Pop!_Shop 中。该软件由 Android 的制造商标 Google 维护。它专为需要在桌面环境中创建和测试移动应用程序，然后再将其应用到实际移动设备的
    Android 开发人员而设计。Android Studio 也可用于 Windows 和 macOS，但我在这里只讨论 Linux 版本。安装完成后，执行以下操作。


    - 启动 Android Studio。

    - 不要导入任何设置，但允许任何默认下载。

    - 对于分析，选择“不发送”，然后在欢迎向导中点击“下一步”。

    - 选择“标准”选项并点击“下一步”。

    - 选择你希望的外观，然后连续两次点击“下一步”。

    - 接受两个协议并点击“下一步”。

    - 点击“完成”并允许下载。


    Android Studio 将下载许多项目，这可能花费一些时间。如果收到任何下载错误，请选择“重试”选项。一旦所有项目都成功下载，点击“完成”，它应该启动新的应用程序窗口，并且应该执行以下操作。


    - 点击“新建项目”，然后点击“下一步”以确认“空活动”。

    - 为你的应用程序提供一个名称并点击“完成”。

    - 允许所有额外的默认下载并点击“完成”。


    应用程序将导航到主开发者面板，你应该看到右下角有几个下载仍在继续。在继续之前，请允许所有操作完成。然后你应该看到右侧有一个名为“设备管理器”的垂直栏。点击它应该会显示一个虚拟设备，标题可能与
    `Pixel_3a"` 类似。这很可能包含最新版本的 Android，但我们也应该探索其他选项。点击“创建设备”按钮，如图 8.01 所示。这允许你从许多虚拟
    Android 选项中进行选择。我选择在我的可用设备中添加一个 Pixel 6 Pro，并选择了最新的 API 级别，这也如图 8.01 所示。


    在我们启动第一个设备之前，我们应该考虑一项重要的调整。由于 Android Studio 面向开发人员，虚拟 Android 设备在开发者门户中启动。我更喜欢我的设备在独立的窗口中启动，因此我在
    Android Studio 的“文件” > “设置”菜单中进行了以下配置更改。


    - 点击“工具”，然后选择“仿真器”。

    - 禁用“在工具窗口中启动”并点击“确定”。


    现在选择你希望的设备并点击箭头按钮启动。你应该看到与 **图 8.02** 类似的设备。你现在正在桌面环境中运行一个虚拟版本的 Android。如有需要，你可以跟随我的*极端隐私：移动设备*指南或*OSINT
    技术*书籍来配置完整的 Android 设备。


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_78_0.png)


    图 8.01：Android Studio 设备管理器。


    # Android Emulator - Pixel_6_Pro_API_33:5554


    11 月 6 日，星期日


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_80_0.png)


    图 8.02：Android Studio 中的虚拟设备屏幕。


    在这些屏幕上的导航与物理设备完全相同。然而，使用鼠标和键盘控制它们可能需要一些练习。你可以随时点击浮动栏上的圆圈返回主屏幕。方形按钮允许你浏览打开的应用程序，向上滑动以关闭它们。左箭头让你在应用内后退一步。在移动应用之前，始终按住应用，左右拖动屏幕可在主页空间之间导航。


    由于我们是在电脑屏幕上操作虚拟设备，因此有一些细微差别需要讨论。默认情况下，通过宿主计算机获取互联网访问权限。如果你发现应用程序似乎停止了通信，请检查并确保“Wi-Fi”已启用。我曾经历过无法解释的互联网中断，通过重新启用“设置”下的
    Wi-Fi 解决了问题。关闭设备的最简单方法是点击浮动栏顶部的电源按钮。先关闭设备，以便我们可以探索克隆选项。一旦屏幕变黑，点击浮动栏中的“X”并返回 Android
    Studio 应用程序。


    一旦你将 Android 设备配置为完全符合你的需求，你就可以通过 Android Studio 应用程序创建克隆。在断电状态下，从设备管理器中选择你的设备；点击三个点以展开菜单；并选择“重复”。你也可以在此屏幕上删除任何不需要的设备。


