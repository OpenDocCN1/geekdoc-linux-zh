    \ following steps used during the writing of this guide should help get you through\
    \ the process. My experience with Pop!_OS is outlined in the following.\n\n- Click\
    \ \"Try or Install Pop!_OS\".\n- Choose your desired language, location, and keyboard.\n\
    - Choose clean install and select your internal drive.\n- Click \"Erase and Install\"\
    .\n- Provide your desired computer name and password.\n- Select the default option\
    \ to encrypt the drive.\n- If desired, allow the same Linux password to be used\
    \ for the drive encryption. This is more convenient but could pose a security\
    \ risk. If you want an extra layer of protection, you could specify a unique password\
    \ for each option of drive encryption and Linux, but this may be overkill for\
    \ most users. I use the same password for both options.\n- Allow the process to\
    \ complete and click \"Restart Device\".\n\nWhen the computer reboots, you should\
    \ be presented with a screen to unlock the encrypted disk with a password. This\
    \ is the first layer of protection which comes default in Pop!_OS. This same protection\
    \ can be configured during installation of Ubuntu or other systems. Unlocking\
    \ the drive simply allows access to it. You should then be presented with the\
    \ Pop!_OS user selection and password entry screen. This unlocks your version\
    \ of Pop!_OS and boots the machine. Continue through the one-time setup with the\
    \ following steps.\n\n- Choose your layout options for the dock and click \"Next\"\
    .\n- Choose your Top Bar options and click \"Next\".\n- Click \"Next\" twice to\
    \ continue through the menu.\n- Choose your desired appearance and click \"Next\"\
    .\n- Choose your Wi-Fi (if available), supply the password, and click \"Next\"\
    .\n- Keep location services disabled and click \"Next\".\n- Choose your desired\
    \ time zone and click \"Next\".\n- Click \"Skip\" to bypass any online accounts\
    \ then click \"Start Using Pop!_OS\".\n\nSome people are annoyed at the need to\
    \ enter the same password twice upon each boot. I do not mind this, but I respect\
    \ the question of redundancy. If you know the password to decrypt the drive, I\
    \ do not see a huge security issue if you disable the secondary password to log\
    \ into Pop!_OS. This can be done with the following steps, and reversed at any\
    \ time, but please note my warning presented in a moment.\n\n- Launch the Settings\
    \ application in the lower-right of the dock.\n- Choose \"Users\" in the left\
    \ menu.\n- Click \"Unlock\" and enter your password.\n- Enable the \"Automatic\
    \ Login\" toggle.\n- Close Settings and reboot the computer by click the upper-right\
    \ menu bar and selecting \"Power Off / Log Out\" > \"Restart\" > \"Restart\".\n\
    \nYou should now only be prompted for the decryption password. Once past that\
    \ screen, Pop!_OS should boot normally. **I want to stress that this is optional.**\
    \ If you choose a unique password for each the decryption and login, you should\
    \ not enable automatic login. This will also cause some programs to demand your\
    \ password more often than if one was manually entered at login due to the way\
    \ the Linux keyring is unlocked. Always identify the appropriate balance of convenience\
    \ and security for your own needs. Enabling automatic login does not erase the\
    \ password for the account, or decrease the security when a password is required\
    \ otherwise, but it may add more inconvenience than if you just entered it at\
    \ every boot, which is what I do.\n\nPop!_OS is more private than Ubuntu by default,\
    \ but I still like to make a few modifications. I conduct the following after\
    \ a new installation.\n\n- Launch the Settings application in the lower-right\
    \ of the dock.\n- Click \"Bluetooth\" in the left menu and disable the toggle.\n\
    - Click \"Privacy\" in the left menu and disable \"Connectivity Checking\".\n\
    - Click \"File History & Trash\" and disable everything.\n\nWhile the following\
    \ are not related to privacy or security, I find the modifications to enhance\
    \ my own usage of Linux. Your preferences may not match.\n\n- Click \"Screen\"\
    \ and change \"Blank Screen Delay\" to a longer period.\n- Go back to the main\
    \ screen, click \"Power\" in the left menu and disable \"Automatic Screen Brightness\"\
    \ and \"Dim Screen\".\n- Click \"Automatic Suspend\" and disable all options.\n\
    - Enable \"Show Battery Percentage\".\n\nMuch like Ubuntu, Pop!_OS offers numerous\
    \ images for use as our background wallpaper. Right-clicking on the desktop presents\
    \ a menu with an option to \"Change Background\". However, I prefer a solid background\
    \ without any image. Similar to Ubuntu, Pop!_OS does not offer a menu option to\
    \ change the background to a solid color. Let’s fix that. The following Terminal\
    \ command removes the background image completely, leaving a solid blue background\
    \ on the desktop. You can launch Terminal from the black icon in the lower Dock.\n\
    \n```\ngsettings set org.gnome.desktop.background picture-uri ''\n```\n\nThis\
    \ is better, but I prefer a slightly muted version of blue, which I change with\
    \ the following Terminal command. This command, and the others in this chapter,\
    \ should be executed as a single command within one line. Your PDF viewer may\
    \ split the lines and you will need to move everything within one command.\n\n\
    ```\ngsettings set org.gnome.desktop.background primary-color 'rgb(66, 81, 100)'\n\
    ```\n\nYou can change the numbers as desired to create the perfect color for your\
    \ desktop. The site at https://www.w3schools.com/colors/colors_rgb.asp should\
    \ assist.\n\nThe next modification I like to execute is to move the Dock from\
    \ the bottom to the left with the following Terminal command.\n\n```\ngsettings\
    \ set org.gnome.shell.extensions.dash-to-dock dock-position LEFT\n```\n\nNext,\
    \ I prefer to decrease the default size of the icons since I will be adding numerous\
    \ programs soon. You can change the number to any size appropriate for your screen\
    \ size with the following Terminal command.\n\n```\ngsettings set org.gnome.shell.extensions.dash-to-dock\
    \ dash-max-icon-size 30\n```\n\nWhen you right-click a file or folder to delete\
    \ it, you currently have the option to \"Move to Trash\". The following Terminal\
    \ command adds a new option directly underneath the Trash entry titled \"Delete\
    \ Permanently\". This allows me to bypass the Trash altogether and simply eliminate\
    \ any desired content.\n\n```\ngsettings set org.gnome.nautilus.preferences show-delete-permanently\
    \ true\n```\n\nBy default, most Linux operating systems hide \"hidden\" files\
    \ from view. These are typically system files but can also include cache and configuration\
    \ files which we may need to access. Therefore, I execute the following two Terminal\
    \ commands in order to make these valuable files visible at all times.\n\n```\n\
    gsettings set org.gnome.nautilus.preferences show-hidden-files true\ngsettings\
    \ set org.gtk.Settings.FileChooser show-hidden true\n```\n\nYou likely have pending\
    \ operating system updates which should now be applied.\n\n- Click the \"Pop!_Shop\"\
    \ icon in the dock bar next to Settings.\n- Click the \"Installed\" tab and then\
    \ \"Update All\".\n\nOnce we begin installing applications, you will see additional\
    \ update options within this menu. I typically launch Pop!_Shop at least once\
    \ weekly to apply all updates.\n\nWhile you may be tempted to begin installing\
    \ all of your desired applications, please"
  mdcn: "\n+ Pop!_OS：最后，这是我为自己和客户端首选的操作系统。Pop!_OS基于Ubuntu，但针对隐私和安全进行了重新设计。它与标准Ubuntu存在许多差异，包括以下几点。\n\
    \    - Pop!_OS安装程序默认应用全盘加密。\n    - 所有遥测功能均已禁用，第三方连接需手动选择加入。\n    - 应用商店可以安装和更新Flatpak/Deb程序。\n\
    \    - 未安装Snap。\n    - Pop!_OS拥有更好的窗口平铺选项。\n    - 它包含一个恢复分区，以便在需要时轻松还原系统。\n  \
    \  - 它感觉更流畅，更精致。\n\n虽然本指南中除上述内容外的绝大部分内容都适用于Ubuntu、Mint或其他任何基于Debian的发行版，但我在演示中将专注于Pop!_OS。请不要因此阻碍你去尝试其他选项。我必须为示例选择一个操作系统，我选择了Pop!_OS，因为这是我每天使用的系统。在Ubuntu中复制所有这些技术应该非常容易，只需极少甚至无需更改。如果你使用的是Arch、Fedora、Manjaro或其他Linux版本，你知道自己选择它的原因，应继续按照自己的偏好进行。\n\
    \n如果你购买的电脑已包含Pop!_OS，可以跳过下一节。对于那些在专用主机计算机上自行安装Pop!_OS（或其他任何版本的Linux）的人，你需要创建一个可启动的USB安装驱动器。我执行了以下步骤来创建自己的驱动器。\n\
    \n- 访问 https://pop.system76.com/ 并点击“Download”。\n- 选择“Download 22.04 LTS”选项并允许下载。\n\
    - 从 https://etcher.balena.io/ 安装Balena Etcher。\n- 启动Balena Etcher并点击“Flash from\
    \ file”。\n- 选择下载的iso文件。\n- 点击“Select target”并选择你的USB驱动器。\n- 点击“Flash”并等待过程完成。\n\
    \n请注意，这将完全擦除所选的USB驱动器，请小心。过程结束后，你应该有一个可用于Linux安装的可启动USB驱动器。将此驱动器插入你的电脑并开机。立即按下显示启动选项的按键。这通常是ESC、F1、F7、F8、F10或DEL。一旦加载了启动选项屏幕，选择带有Linux安装的USB驱动器。安装任何Linux发行版（包括Pop!_OS）的具体流程会随时间变化。然而，在本指南撰写期间使用的以下步骤应能帮助你完成流程。我使用Pop!_OS的经验如下所示。\n\
    \n- 点击“Try or Install Pop!_OS”。\n- 选择你期望的语言、位置和键盘。\n- 选择干净安装并选择你的内部驱动器。\n- 点击“Erase\
    \ and Install”。\n- 提供你期望的计算机名称和密码。\n- 选择默认选项以加密驱动器。\n- 如果需要，允许使用相同的Linux密码进行驱动器加密。这更方便，但可能存在安全风险。如果你想要额外的保护层，可以为驱动器加密和Linux分别指定唯一密码，但这对大多数用户来说可能过于繁琐。我对两个选项使用相同的密码。\n\
    - 允许过程完成并点击“Restart Device”。\n\n当计算机重新启动时，应该会显示一个屏幕，要求你用密码解锁加密磁盘。这是Pop!_OS默认的底层保护。同样的保护也可以在安装Ubuntu或其他系统时配置。解锁驱动器只是允许访问它。然后你应该看到Pop!_OS的用户选择和密码输入屏幕。这会解锁你的Pop!_OS版本并启动机器。按照以下步骤继续完成一次性设置。\n\
    \n- 选择你的布局选项并点击“Next”。\n- 选择你的顶栏选项并点击“Next”。\n- 点击两次“Next”以继续通过菜单。\n- 选择你期望的外观并点击“Next”。\n\
    - 选择你的Wi-Fi（如果可用），提供密码并点击“Next”。\n- 保持位置服务禁用并点击“Next”。\n- 选择你期望的时区并点击“Next”。\n\
    - 点击“Skip”以跳过任何在线账户，然后点击“Start Using Pop!_OS”。\n\n有些人对每次启动都需要输入两次相同密码感到烦恼。我不介意，但我尊重关于冗余性的疑问。如果你知道解密驱动器的密码，我认为如果禁用登录Pop!_OS的次要密码，并不会带来巨大的安全问题。这可以通过以下步骤完成，且随时可以撤销，但请注意我稍后将给出的警告。\n\
    \n- 启动位于Dock右下角的设置应用程序。\n- 在左侧菜单中选择“Users”。\n- 点击“Unlock”并输入你的密码。\n- 启用“Automatic\
    \ Login”开关。\n- 关闭设置，点击左上角菜单栏并选择“Power Off / Log Out” > “Restart” > “Restart”来重启计算机。\n\
    \n现在你应该只需输入解密密码即可。一旦通过该屏幕，Pop!_OS应该正常启动。**我想强调这是可选的。** 如果你为解密和登录选择了不同的唯一密码，你不应该启用自动登录。由于Linux密钥环的解锁方式，这也可能导致某些程序比手动输入密码时更频繁地要求你输入密码。始终根据你的需求确定便利性和安全性之间的适当平衡。启用自动登录不会抹去账户密码，或在需要密码时降低安全性，但它可能比每次启动都输入密码带来不便，而后者是我所做的。\n\
    \nPop!_OS默认比Ubuntu更注重隐私，但我仍然喜欢做一些修改。我在每次新安装后进行以下操作。\n\n- 启动位于Dock右下角的设置应用程序。\n\
    - 点击左侧菜单中的“Bluetooth”并禁用开关。\n- 点击左侧菜单中的“Privacy”并禁用“Connectivity Checking”。\n\
    - 点击“File History & Trash”并禁用所有选项。\n\n虽然以下内容与隐私或安全无关，但我认为这些修改增强了我对Linux的使用体验。你的偏好可能不同。\n\
    \n- 点击“Screen”并将“Blank Screen Delay”更改为较长的时间段。\n- 返回主屏幕，点击左侧菜单中的“Power”并禁用“Automatic\
    \ Screen Brightness”和“Dim Screen”。\n- 点击“Automatic Suspend”并禁用所有选项。\n- 启用“Show\
    \ Battery Percentage”。\n\n与Ubuntu类似，Pop!_OS提供许多图像用作我们的背景壁纸。在桌面上右键点击会显示一个菜单，其中有“Change\
    \ Background”选项。然而，我更喜欢没有图像的纯色背景。与Ubuntu类似，Pop!_OS没有提供将背景更改为纯色的菜单选项。让我们修复这个问题。以下Terminal命令完全移除背景图像，在桌面上留下纯蓝色背景。你可以从Dock底部的黑色图标启动Terminal。\n\
    \n```\ngsettings set org.gnome.desktop.background picture-uri ''\n```\n\n这更好了，但我更喜欢稍微柔和的蓝色，我用以下Terminal命令更改它。这个命令和本章中的其他命令应该作为单个命令在一行内执行。你的PDF查看器可能会拆分行，你需要将每个命令中的所有移动同一行。\n\
    \n```\ngsettings set org.gnome.desktop.background primary-color 'rgb(66, 81, 100)'\n\
    ```\n\n你可以更改数字以创建适合你桌面的完美颜色。https://www.w3schools.com/colors/colors_rgb.asp 网站应能提供帮助。\n\
    \n我喜欢的下一个修改是将Dock从底部移动到左侧，使用以下Terminal命令。\n\n```\ngsettings set org.gnome.shell.extensions.dash-to-dock\
    \ dock-position LEFT\n```\n\n接下来，我更喜欢缩小图标的默认大小，因为我很快将添加许多程序。你可以使用以下Terminal命令将数字更改为适合你屏幕大小的任何大小。\n\
    \n```\ngsettings set org.gnome.shell.extensions.dash-to-dock dash-max-icon-size\
    \ 30\n```\n\n当你右键点击文件或文件夹以删除它时，你目前有一个“Move to Trash”选项。以下Terminal命令在Trash条目下方添加一个新的标题为“Delete\
    \ Permanently”选项。这允许我完全绕过Trash，直接消除任何期望的内容。\n\n```\ngsettings set org.gnome.nautilus.preferences\
    \ show-delete-permanently true\n```\n\n默认情况下，大多数Linux操作系统隐藏“hidden”文件。这些通常是系统文件，但也可能包括我们需要访问的缓存和配置文件。因此，我执行以下两个Terminal命令，以便随时使这些有价值的文件可见。\n\
    \n```\ngsettings set org.gnome.nautilus.preferences show-hidden-files true\ngsettings\
    \ set org.gtk.Settings.FileChooser show-hidden true\n```\n\n你可能有待处理的操作系统更新，现在应该应用它们。\n\
    \n- 点击Dock栏中设置旁边的“Pop!_Shop”图标。\n- 点击“Installed”标签页，然后点击“Update All”。\n\n一旦我们开始安装应用程序，你将在这个菜单中看到额外的更新选项。我通常每周至少启动一次Pop!_Shop以应用所有更新。\n\
    \n虽然你可能会受到诱惑开始安装你期望的所有应用程序，但请\n"
