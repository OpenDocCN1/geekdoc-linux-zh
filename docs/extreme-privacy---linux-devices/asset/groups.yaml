    can place calls to Twilio''s servers, but we are far from unlimited usage to real
    numbers. As long as you receive a confirmed test call message from Twilio, your
    configuration is complete. If you would like to remove all restrictions to make
    and receive calls to and from any number, you must "Upgrade" the account. The
    following should be conducted within the Twilio portal.


    +   * Return to the Dashboard in the upper left menu.

    +   * Click the "upgrade" link and provide all requested billing details.

    +   * Provide any credit, debit, or registered prepaid card.

    +   * Apply $20 to the account.


    You should now have an unrestricted Twilio account which should be fully functional
    for voice calls. Please do not upgrade the account until you know your test calls
    are going through. You should also have a fully functional VoIP application which
    can facilitate calls. Linphone can be used to place a call at any time from your
    Linux device. You can also add as many numbers as you wish by repeating this process.
    Incoming calls will "ring" your Linux device as long as the Linphone application
    is open and your status is "green". Before you create dozens of new numbers, let''s
    discuss the costs. Each Twilio number withdraws $1.15 every month from your balance.
    If you followed these steps, you are funded for almost three years of usage of
    the initial phone number. Incoming and outgoing calls cost $0.004 per minute.
    During all of my testing for this tutorial so far, I spent $1.21. There are several
    huge benefits with this strategy, as outlined below.


