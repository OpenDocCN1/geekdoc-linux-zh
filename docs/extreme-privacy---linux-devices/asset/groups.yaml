    - 跨微软应用生态系统的隐私设置


    这些数据使得识别你、你的位置以及所有在线活动变得非常容易。微软声称收集这些数据只是为了增强你的体验，但我认为这种活动具有侵入性且没有必要。这正是 Linux
    发挥作用的地方。请考虑以下关于 Linux 相对于 Windows 和 macOS 系统优势的大纲：


    - Linux 操作系统在安装或使用期间不需要账户。你不需要提供姓名、电子邮件地址、实体地址、电话号码、用户名或信用卡即可使用你购买的系统。

    - 大多数 Linux 发行版要么没有遥测功能，要么数据收集极少，且可以轻松禁用。与 macOS 不同，下载官方软件没有账户要求。仅此一点就是巨大的隐私优势。

    - 我认为 Linux 系统的安全性比微软 Windows 好得多。大多数恶意软件瞄准 Windows 系统，不仅因为个人和专业领域中有大量 Windows
    用户，还因为程序访问系统资源的总体能力。确实有针对 Linux 和 macOS 的病毒和其他恶意程序，但相当罕见。每当你听到某台机器感染勒索软件或其他计算机病毒的消息时，几乎可以确定涉及的是
    Windows 系统。虽然我认为 macOS 系统比 Linux 或 Windows 更安全，但隐私入侵抵消了许多优势。

    - Linux 完全免费且开源。这意味着所有 Linux 操作系统都是透明的，任何人都可以审计。有许多活跃的 Linux 社区深入研究所有代码，以确保后台没有恶意行为。微软和苹果将他们的代码隐藏在公众视野之外，我们永远无法真正知道情况可能有多糟糕。开源代码还允许人们创建许多不同版本的
    Linux，以满足特定需求和利基市场。我们很快就会讨论 Linux 的许多发行版，以及哪个最适合你的需求。

    - Linux 的几乎每个方面都可以修改和自定义。如果你是 macOS 用户，你会知道无法卸载 Mail、Photos、Facetime、Music 等标准苹果软件以及其他不想要的应用。你只能继续使用它们。大多数
    Linux 系统以最少程序开始，允许你选择添加什么。你可以移除任何想要的内容，永远不会被困在默认的标准应用列表中。

    - Linux 是一个轻量级的操作系统。它在现代和传统硬件上运行流畅，这使得无需购买昂贵的新机器即可轻松进行测试。

    - 由于 Linux 可以安装在几乎任何计算机硬件上，我们可以对每个部件进行非常细致的选择。大多数 Linux 机器允许你修改所有部件，包括电池、RAM、驱动器等。如果你购买了一台
    MacBook Pro，然后决定升级这些规格中的任何一个，你可能就无能为力了。你将不得不购买一台全新的机器。


    我可以提供更多我更喜欢 Linux 而非传统系统的理由，但我认为上述要点对大多数人来说已经足够。我不尝试说服你去尝试 Linux，我更愿意解释我如何自定义自己的
    Linux 使用方式，以及针对客户的过程。我相信在本指南结束时，你将准备好构建或购买你自己的 Linux 设备。接下来，让我们着手处理硬件选择，这可能会令人不知所措。


    # 第二章：硬件配置


    如果你是 macOS 用户，你仅限于苹果批准和销售的具体硬件。如果你想要一台笔记本电脑，你只有少数几个选项，且优化程度有限。Linux 是另一种野兽。由于它几乎可以在任何计算机硬件上运行，选择是无穷无尽的。你很可能拥有一台旧的计算机，它可以毫不费力或投入很少地运行
    Linux。如果没有，你可能拥有一台 macOS 或 Windows 设备，其中可以承载一个 Linux 虚拟机。如果你决定购买一台专门为 Linux 设计的新计算机，你将面临一组令人不知所措的新选择。让我们理清所有这些选项。


    ### 二手设备

    测试 Linux 的最佳方法之一是将其安装到退役的机器上。如果你的计算机能够运行 Windows，它很可能也能处理 Linux。如果你拥有一台苹果计算机，情况就不那么简单了。2016
    年之前制造的较旧苹果计算机应该能够处理几乎任何 Linux 变体。如果你有一台较新的基于 Intel 的带有触控栏的笔记本电脑，你需要一个来自 t2linux.org
    的 Linux 特殊变体。如果你的设备是 2020 年之后制造且配有最新苹果处理器，我不建议尝试安装 Linux。其他一切应该都是可能的。我专门保留旧笔记本电脑用于测试新的
    Linux 构建版本。


    ### 虚拟机

    如果你只有一台计算机，那么 Linux 虚拟机是理想的实验工具。第八章详细介绍了如何在任何 Linux、macOS 或 Windows 平台上创建虚拟机。它还解释了如何在你的
    Linux 主机中构建 Linux 和 Windows 虚拟机。一旦创建完成，你的虚拟机将表现得就像主机上的传统安装一样。


    ### 新计算机

    这始终是我的首选。如果你决定投身于 Linux 生活方式，购买一台带有你自己规格的专业 Linux 机器是理想的。这也开启了多个制造商、型号和自定义选项的闸门。然而，我将带你浏览我推荐的选项。一台预装
    Linux 的新机器不仅是最容易入手的方式，它应该能为你的日常活动提供最佳的集成效果。在本章的剩余部分，我将假设你想购买一台专门用于 Linux 体验的新计算机。但是，下一章解释了如何在任何兼容设备中安装
    Linux。现在，让我们关注硬件选项。


    有成千上万的新旧机器可以很好地运行 Linux。你可能对联想 ThinkPad 笔记本电脑有偏好，你可能想坚持使用熟悉的东西。也许你更喜欢戴尔机器。联想和戴尔在
    Linux 上都能表现出色，但我认为我们可以做得更好。让我们从处理器开始。处理器是让计算机完成你指示它执行的所有功能和任务的主要芯片。它是计算机的心脏。它也可能是外部攻击的第一个漏洞。自
    2008 年以来，几乎所有制造的英特尔处理器都拥有一种名为英特尔管理引擎（Intel ME）的软件。它是直接嵌入芯片的专有固件子系统。它是一个小型操作系统。安装在计算机上的任何传统操作系统，如
    Linux，都无法控制 Intel ME。Intel ME 软件在启动时、计算机运行期间以及休眠期间都会运行。只要芯片组供电，即使系统关闭，它也会继续运行。


