    ![](img/451a8c416cafc58e46802d06b4bc7b1a_49_0.png)


    最后，我想购买一个域名并从中生成电子邮件转发服务。有许多域名注册商和Web托管商可以满足需求，但我更喜欢Cloudflare。每年只需9美元，我就可以拥有这个域名，并将无限量的传入邮件通配符地址转发到任何外部加密邮件提供商，例如Proton
    Mail。我不需要从第三方提供商购买托管计划。在本示例中，我创建了一个免费的Cloudflare账户，并将其与一个新的Proton Mail电子邮件地址相关联。


    一旦我登录Cloudflare并显示我的账户门户，我就导航到“域名注册”>“注册域名”。然后我搜索了rental-bus.com，并得到以下结果。


    ## 查找域名


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_49_1.png)


    我以9.15美元的价格购买了一个域名，并使用了一张经过掩码处理的Privacy.com卡进行交易，但也可以使用传统的信用卡。在此过程中，我被要求提供我的姓名、实体地址、电子邮件地址和电话号码。这些信息如下：


    - 提供虚假信息可能导致失去域名。我仅在域名被滥用于发送垃圾邮件时见过这种情况，但它也可能发生在我们身上。我们应该遵守规则。

    - 提供别名和不存在电子邮件地址是失去域名控制的必然方式。如果将来需要您通过电子邮件或身份证验证域名的所有权，您将无法确认您的身份。


    因此，让我们诚实地……有点吧。每次我注册域名时，我都会提供我真实名字和中间名的简化版本作为我的全名。如果我的全名是“Michael John Bazzell”，我可能会提供“Mich
    John”作为我的名字。我有朋友叫我Mike，但我从未见过他们拼写它。因此，也许在他们的脑海中它是“Mich”。如果我的中间名是John，且我的祖母经常叫我Michael
    John，那就是我的真名。


    接下来，他们要求一个实体地址。我在旅行期间总是住在酒店时购买新域名。从技术上讲，那是我当晚的家。我在注册时总是包括房间号。我通常也提供酒店电话号码，因为域名注册总是通过电子邮件验证。我提供与Cloudflare相同的Proton
    Mail电子邮件地址作为域名注册联系人。我保存了酒店收据的数字副本，包括我的名字和中间名，以及入住日期和房间号，以防我被要求提供所提供住址的证明（我从未被要求过）。这是否过度？也许。Cloudflare不会公开共享您的任何注册详细信息，并且需要法院命令才能释放这些信息。然而，数据泄露或不良员工可以很容易地消除我为了尽可能匿名所做的一切努力。因此，我将信息掩码到我认为可以舒适地呈现为我自己的程度。


    一旦我拥有该域名，我导航到“Websites”并选择我的新域名。然后我点击“Email”标签，并完成“Email Routing”要求。在撰写本文时，以下情况适用。请注意，Cloudflare的措辞变化迅速，因此您可能会看到一些细微差异。


    - 点击“Get started”按钮。

    - 创建自定义电子邮件地址，例如“comms@rental-bus.com”。

    - 提供一个目标地址，您的传入邮件将转发到该地址。

    - 点击“Create and continue”。

    - 在您的接收邮件账户中确认请求。

    - 点击“Add records and enable”以应用适当的DNS设置。


    在此场景中，发送到“comms@rental-bus.com”的任何邮件将转发到我之前提供的Proton Mail电子邮件地址。您现在应该点击Cloudflare门户中的“Email”>“Email
    Routing”。然后，点击“Routes”标签，并启用“Catch-all addresses”。这将允许发送到您新域名的任何邮件转发到您的接收地址。如果您使用“VoIPcall@rental-bus.com”、“sales@rental-bus.com”、“manager@rental-bus.com”等电子邮件地址注册服务，它们都将自动转发到您的接收地址。这允许您在没有任何电子邮件配置的情况下即时创建新地址。请注意，这些地址只能接收消息，您无法从中发送。显然，您不一定需要使用Cloudflare来做这件事。您可以在任何Web托管商注册域名，并支付电子邮件服务费用。由于成本原因，我更喜欢这种方法，因为我拥有许多用于特定目的的域名。相比之下，通过Namecheap的域名和电子邮件托管起价每年30美元。**遵循本书其余部分，您完全不需要自定义域名。**
    如果您没有获取VoIP服务的计划，您可能可以完全跳过这一步。我发现绕过大多数电话服务提供商的欺诈过滤器很有益处，因此我希望在我需要之前配置好所有内容。让我们继续。


    ## Twilio VoIP 服务


    当一个应用或服务宣传“Burner Phone”（备用电话）、“Second Phone”（第二部电话）、“Second Line”（第二线路）或其他诱人的措辞时，它们实际上并不提供电话号码或电话服务。几乎全部依赖于称为Twilio的VoIP服务。即使是MySudo也通过Twilio提供访问。这些公司通过Twilio购买号码和服务，并向您推销该服务。如果我们消除中间商呢？您可以创建自己的Twilio账户，购买一个号码，并在没有任何第三方参与的情况下拥有服务。这种DIY选项说起来容易做起来难，但是一个非常可行的任务。


    第一步是从桌面计算机在Twilio (twilio.com) 创建一个新账户。这将是最难的部分。作为注册的一部分，您必须向Twilio提供姓名、电子邮件地址和电话号码。Twilio拥有强大的欺诈机制，以暂停那些看起来可疑的账户。在测试此策略的初期，我的账户立即被暂停。我提供了一个模糊的姓名、备用电子邮件地址和Google
    Voice号码，同时连接到VPN。这触发了账户暂停，我被要求回复支持邮件，解释我将如何使用Twilio。


    这开始了与两名Twilio支持人员的沟通。在与客户服务交谈时，我建议VPN IP地址可能是暂停的原因。在提供公司名称、“更好”的电子邮件地址以及说明我将把产品用于企业VoIP解决方案之后，我的账户恢复了。**如果您陷入这种网状的打击中，我劝诫您不要让他们知道您正在遵循本书中的协议来建立VoIP服务。**
    Twilio不喜欢我或我的整体受众。与我们相比，大企业才是主要客户。


    创建免费账户后，您的账户将受到严重限制。Twilio的个人员工将分析您的注册详情，并决定是否可以将您“升级”为完全功能账户。如果您应用以下准则，我认为您会在小时内发现您的账户限制被解除。


    - 提供您真实的名字和中间名，特别是如果他们很普通。根据我的经验，不需要真实的姓氏。

    - 如果按照上一章所述创建了自定义域名，请提供与该域名关联的电子邮件地址。来自Proton Mail、Tutanota或掩码提供商的隐私主题地址将被标记，账户将被暂停。Gmail和其他免费地址将受到严格审查（或完全阻止）。

    - 如果可能，在没有VPN保护的情况下注册。我稍后解释VPN的使用，但这可能成为所有新账户的触发因素。公共Wi-Fi，如当地图书馆，通常工作良好。

    - 提供的电话号码可以是现有的VoIP号码或任何您有权访问的固定电话。如果您有旧的Google Voice号码，这应该能很好地工作。


