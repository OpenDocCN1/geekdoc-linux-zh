    Microsoft is no better. By default, Windows 10 and 11 require a Microsoft online
    account in order to install the operating system. Some versions allow you to bypass
    account creation altogether by being offline, but Microsoft is pushing to eliminate
    this option in Windows 11. An active Microsoft account is not required in order
    to receive important software updates, but Microsoft''s Telemetry service continuously
    collects the following data, plus numerous additional details, sending it to their
    corporate servers in Seattle.


    +   - Typing diagnostic data from your keyboard

    +   - Microphone transmissions

    +   - Index of all media files on your computer

    +   - Webcam data

    +   - Browsing history

    +   - Search history

    +   - Location activity

    +   - Health activity collected by HealthVault, Microsoft Band, and other trackers

    +   - Privacy settings across the Microsoft application ecosystem


    This data would make it very easy to identify you, your location, and all online
    activity. Microsoft claims this collection of data is only to enhance your experience,
    but I find this activity to be invasive and unnecessary. This is where Linux comes
    in. Consider the following summary of the benefits of Linux over Windows and macOS
    systems.


    +   - Linux operating systems do not require an account for installation or usage.
    You will not be asked for a name, email address, physical address, telephone number,
    username, or credit card just to use the system which you purchased.

    +   - Most flavors of Linux possess either no telemetry or minimal data collection,
    which can be easily disabled. Unlike macOS, there are no account requirements
    in order to download official software. This alone is a huge privacy benefit.

    +   - I believe the security of Linux systems is much better than Microsoft Windows.
    Most malicious software targets Windows systems due to the abundance of Windows
    users in both personal and professional spaces, but also because of the overall
    ability for programs to access system resources. There are viruses and other malicious
    programs which target Linux and macOS, but these are fairly rare. Any time you
    hear about a machine becoming infected with ransomware or other computer viruses,
    it is almost certain to have involved a Windows system. While I believe macOS
    systems are more secure than Linux or Windows, the privacy invasions negate many
    of the benefits.

    +   - Linux is completely free and open source. This means that all Linux operating
    systems are transparent and can be audited by anyone. There are many active Linux
    communities which pour over all of the code to make sure nothing nefarious is
    going on behind the scenes. Microsoft and Apple hide their code from the public
    view and we never truly know just how bad things might be. Open-source code also
    allows people to create many different versions of Linux which can accommodate
    specific needs and niches. We will soon discuss the many flavors of Linux and
    which of them might be most appropriate for your needs.

    +   - Almost every aspect of Linux can be modified and customized. If you are
    a macOS user, you know that you cannot uninstall stock Apple software such as
    Mail, Photos, Facetime, Music, and other undesired applications. You are stuck'
  - '[PAGE 9]


    with them. Most Linux systems begin with minimal programs and allow you to choose
    what should be added. You can remove anything desired and are never stuck with
    a default list of stock apps.


    +   • Linux is a very lightweight operating system. It runs smoothly on modern
    and legacy hardware, which allows for easy testing without the purchase of new
    and expensive machines.


    +   • Since Linux can be installed on practically any computer hardware, we can
    be very selective about each part. Most Linux machines allow you to modify all
    parts including batteries, RAM, drives, etc. If you purchase a MacBook Pro and
    later decide to upgrade any of these specifications, you are likely out of luck.
    You would have to buy a whole new machine.


    I could provide many more additional reasons I prefer Linux over more traditional
    systems, but I believe the previous points suffice for most people. Instead of
    trying to convince you to give Linux a shot, I prefer to explain the ways in which
