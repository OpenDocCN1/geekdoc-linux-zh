  mdcn: "\n\nTwilio 的员工很可能会给你发邮件，询问你打算如何使用他们的服务。千万不要忽略这封邮件。你必须让他们相信，你有资格为他们的产品付费。我通常会提供类似以下内容的回复。\n\
    \n- “我是一名软件开发人员，我的老板让我研究一下 Twilio API，希望能用 VoIP 服务替代我们的固定电话。我计划购买几个 SIP 号码并将其分配给员工。”\n\
    - “我为几家公司提供 L.T. 服务，他们正在询问 VoIP 服务。我希望测试一下 Twilio API，看看它如何融入他们现有的系统。”\n- “我的一个客户目前使用\
    \ Mlnxy 进行 VoIP 服务，但他们对产品不满意。他们让我研究 Twilio API，看看是否有迁移到你们环境的可能性。”\n\n**切勿逐字照搬上述任何段落！**\
    \ 如果我们都发送同样的邮件，我们的账号都会被封禁。请借鉴这些通用思路，制定你自己使用的理由。虽然我们在某种程度上具有误导性，甚至可能不诚实，但并不存在欺诈行为。我们会为我们所需的服务付费。我目睹了许多读者的账号因声称只需一两个号码用于个人用途而遭到封禁。如果你需要回复\
    \ Twilio 的邮件，且你使用了通过 Cloudflare 托管的自定义域名，那就多了一个麻烦。你无法从注册时提供的地址发送邮件。不过，这并不是强制要求的。在你的\
    \ Twilio 控制面板中，在左侧菜单导航至“文档与支持” > “支持中心”，并选择“工单历史”。你应该能看到 Twilio 员工发送的任何消息副本。你可以选择需要处理的消息，并直接在控制面板内回复。这将通过你的注册邮箱地址发送给\
    \ Twilio 员工。\n\n一旦你的账号获得批准且你支付了服务费，你就会隐入背景中，Twilio 员工大概率不会再联系你。只要你不制造任何显得可疑的情况，或者违反他们的服务条款，他们应该就会把你晾在一边。如果\
    \ Twilio 要求提供政府签发的身份证件副本，请予以抵制。在最初的封禁解除后，我能够在不提供身份证件的情况下激活了两个账号。总的来说，他们只是想拥有付费且不乱用其网络的用户。\n\
    \n现在我将假设你已创建一个具有强密码的 Twilio 账号，并且该账号已由 Twilio 员工升级为正式版。你账户中的免费额度允许你测试该服务的许多功能，但在你的账号完全可用于对外通信之前，需要存入\
    \ 20 美元。我使用了一张经过遮蔽的借记卡支付。然而，我认为使用真实的信用卡并没有太大的问题。很多人会认为这是鲁莽的行为，因为它会留下指向你真实身份的数字痕迹。这是真的，但请考虑以下几点。\n\
    \n如果你将使用与真实身份关联的 VoIP 号码，无论如何都会留下痕迹。如果我把一个新的 VoIP 号码给我的朋友、家人和同事，通过使用情况、日志和联系人共享，这个号码将会与我联系在一起。使用\
    \ VoIP 的全部意义在于，以侵入性更低的方式在真实身份下接听和拨打电话。行为模式会将你识别为账户持有者，这没什么问题。我不认为我们需要对 VoIP 服务商保持完全的匿名。然而，我认为我们应该对蜂窝网络运营商保持匿名。如果有人调查该\
    \ VoIP 账号，他们可能依然能根据所拨打的号码建立起关联。因此，我认为使用真实的信用卡支付这些服务没有问题。如果要求使用真实姓名，我也不认为这有问题。如果你按照我在《*Extreme\
    \ Privacy 第四版*》中的建议，在你的名字和中间名下办理了一张副卡，那就更好了。让我们回到 Twilio 账号。点击左上角的“向下箭头”应该允许你创建一个新的账号，这曾经被称为“项目”。如果缺少此选项，请访问\
    \ [https://www.twilio.com/console/projects/summary](https://www.twilio.com/console/projects/summary)\
    \ 并选择“创建新账号”。提供一个通用的账号名称。我将其命名为“VoIP”。这可能要求你确认一个电话号码以“证明你是人类”。幸运的是，他们在这里接受 VoIP\
    \ 号码，我提供了一个 Google Voice 号码。在确认号码后，回答关于你期望用法的提示问题。这里的回答不会影响你的账号。\n\n一旦你的新项目创建完成，你应该能看到至少\
    \ 10 美元的测试余额。现在是时候配置我们的 VoIP 电话号码了。首先，根据以下配置，确定离你最近的 Twilio 服务器所在地。我将使用“东海岸”美国选项，因此我的示例服务器将是\
    \ [phone number].sip.us1.twilio.com。在美国，最稳定的选项是“us1”。\n\n- 北美 弗吉尼亚：[phone number].sip.us1.twilio.com\n\
    - 北美 俄勒冈：[phone number].sip.us2.twilio.com\n- 欧洲 都柏林：[phone number].sip.ie1.twilio.com\n\
    - 欧洲 法兰克福：[phone number].sip.de1.twilio.com\n- 南美 圣保罗：[phone number].sip.br-1.twilio.com\n\
    - 亚太 新加坡：[phone number].sip.sg1.twilio.com\n- 亚太 东京：[phone number].sip.jp1.twilio.com\n\
    - 亚太 悉尼：[phone number].sip.au1.twilio.com\n\n如果以下菜单项已更改，请在他们的在线 Twilio 文档中搜索更新。Twilio\
    \ 经常在没有警告或文档的情况下更改菜单选项。如果我看到重大变化，我会更新这份 PDF 并通知你下载免费的更新文档。让我们开始吧。\n\n在 Twilio\
    \ 仪表盘中，点击“获取试用号码”。使用搜索功能查找你期望区号内的号码。这将从你的余额中扣除 1 美元。如果不存在此选项，请点击左上角菜单中的“Develop”链接，然后点击“Phone\
    \ Numbers”，接着点击“Manage”，再点击“Active Numbers”，最后点击“Buy a Number”。点击所需号码旁边的“Buy”。我的演示号码是“2025551212”。请继续执行以下操作。\n\
    \n- 点击左侧菜单中的“Voice”链接。\n- 选择“Manage”菜单选项。\n- 点击“SIP Domains”选项并点击“+”创建新域名。\n-\
    \ 将分配的电话号码输入为“Friendly Name”，例如“2025551212”。将分配的电话号码输入为“SIP URI”，例如“2025551212”。\n\
    - 在“Voice Authentication”下，点击“Credential List”旁边的“+”。\n- 输入你的号码的“Friendly”名称，例如“2025551212”。\n\
    - 输入你的号码的“Username”，例如“2025551212”。\n- 输入一个安全密码并点击“Create”。\n- 在“SIP Registration”下，点击“Disabled”按钮以启用它。\n\
    - 在“Credentials List”下拉菜单中，选择你的电话号码。\n- 点击“Save”。\n- 导航至 [https://www.twilio.com/console/runtime/twiml-bins](https://www.twilio.com/console/runtime/twiml-bins)。\n\
    - 在左侧菜单中，点击“TwiML Bins”旁边的三个点。\n- 点击“Pin to Sidebar”。\n- 点击“+”创建一个新的 TwiML Bin。\n\
    - 提供一个“Friendly”名称为“incomingvoice”。\n- 将以下文本放入 TwiML 框中。将“2025551212”替换为你的号码。\n\
    \n```\n\"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Response>\n  <Dial answerOnBridge=\"\
    true\">\n    <Sip>2025551212@2025551212.sip.us1.twilio.com</Sip>\n  </Dial>\n\
    </Response>\"\n```\n\n- 点击“Create”和“Save”。\n- 在左侧菜单中点击“Phone Numbers” > “Manage”\
    \ > “Active Numbers”。\n- 点击你的电话号码。\n- 在“Voice & Fax”下的“A Call Comes In”中，选择“TwiML\
    \ Bin”。\n- 在下拉菜单中选择“incomingvoice”并点击“Save”。\n- 在左侧菜单中点击“TwiML Bins” > “My TwiML\
    \ Bins”。\n- 点击加号创建一个新的 bin。\n- 提供一个“Friendly”名称为“outgoingvoice”。\n- 将以下文本放入 TwiML\
    \ 框中。\n\n```\n\"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Response>\n  <Dial\
    \ answerOnBridge=\"true\" callerId=\"{{#e164}}{{From}} {{/e164}}\">\n    {{#e164}}{{To}}{{/e164}}\n\
    \  </Dial>\n</Response>\"\n```\n\n- 点击“Create”和“Save”。\n- 在菜单中点击“Voice” > “Manage”\
    \ > “SIP Domains”。\n- 选择你的域名。\n- 在“Call Control Configuration” > “A Call Comes\
    \ In”下，将“Webhook”更改为“TwiML Bin”，并在下拉菜单中选择“outgoingvoice”。\n- 点击“Save”。\n\n你可能注意到关于\
    \ 75 美元紧急呼叫费的警告。这是为了诱导你将实体家庭地址与你的账号关联，并为此特权支付月费。这是不必要的。然而，出于某些原因，从该 VoIP 号码拨打的\
    \ 911 呼叫可能会产生 75 美元的 Twilio 费用。我绝不会从这些号码拨打 911。如果有真正的紧急情况，我会直接使用设备上的拨号应用通过蜂窝网络连接。这将把我的真实蜂窝号码透露给接线员，但在紧急情况下，隐私不应是优先事项。你现在已经准备好使用新号码接听和拨打电话了。你不能通过\
    \ Twilio 的网站做到这一点，因为你需要为此目的设计软件，如下文所述。\n\n## **Twilio Linphone 配置**\n\n你现在已经创建了一个\
    \ SIP 域名和凭据，允许你将 Twilio 账号与名为 **Linphone**（linphone.org）的 VoIP 软件关联，该软件可以从 Pop!\
    \ Shop 安装。以下配置步骤应适用于所有 Linphone 应用程序，但你可能会在不同平台上看到细微的变化。你需要在每个希望用于 VoIP 通话的 Linux\
    \ 设备上重复执行每个步骤。启动 Linphone 并执行以下操作。\n\n"
