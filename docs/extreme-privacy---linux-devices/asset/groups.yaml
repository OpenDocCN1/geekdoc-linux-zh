    ## 适用于所有 Ubuntu 安装：


    - 选择“正常安装”、“下载更新”和“安装第三方…”。

    - 点击“继续”。

    - 选择“擦除磁盘并安装 Ubuntu”，然后点击“立即安装”。

    - 通过“继续”进行确认。

    - 选择你所需时区，点击“继续”。

    - 为每个字段输入所需名称、用户名、计算机名称和密码。

    - 选择“自动登录”，点击“继续”。

    - 让 Ubuntu 完成安装，选择“立即重启”。

    - 点击 UTM 虚拟机窗口右上角的“CD”图标；高亮 CD/DVD 选项，然后点击“弹出”。然后按“Enter”键重启虚拟机，或点击 UTM 内的“左箭头”图标。

    - 如有必要，选择 UTM 窗口中的“电源”或“重启”图标。


    此时你的设备应已启动至登录屏幕。如果再次启动到安装 ISO，请关闭机器。在主 UTM 窗口中，选择你的新机器并点击右上角的设置图标。在“驱动器”下，识别 CD/DVD
    驱动器并将“映像类型”更改为“无”。重启虚拟机并启动到 Ubuntu 桌面。以下步骤将完成默认配置。


    - 点击“跳过”然后“下一步”。

    - 当询问是否帮助改进 Ubuntu 时，选择“否”然后“下一步”。

    - 点击“下一步”然后“完成”以移除欢迎屏幕。

    - 如果提示安装更新，点击“稍后提醒我”。

    - 继续到标题为“Ubuntu 自定义”的章节。


    ## Ubuntu 自定义


    你现在应该已拥有一个在你的 Intel 或 ARM macOS 设备上运行的 Ubuntu 虚拟机。与 VirtualBox 的步骤不同，UTM 不需要在虚拟机内安装任何特殊的扩展包或软件即可调整显示尺寸。你应该能够随意调整屏幕，或使其全屏以获得最佳视图。然而，暂时不要进入全屏模式。我们仍有工作要做，我希望你能轻松访问菜单栏。记得始终使用
    Ubuntu 内可用的最高分辨率，然后在 Ubuntu 显示偏好中选择合适的 100%、200% 或其他额外选项。你可以右键点击 Ubuntu 桌面并选择“显示设置”来查看此菜单。此外，没有令人担忧的许可证限制。这对我们所有人来说都是更好的情境。


    一些期望功能，如剪贴板和文件共享，需要安装 UTM 的 Spice 守护进程。从 Ubuntu 内的应用程序菜单启动终端，并执行以下命令，这也将修改我们的背景以匹配之前的教程。你可能已经拥有所需软件，但让我们确保一下。


    ```

    sudo apt install spice-vdagent spice-webdavd

    gsettings set org.gnome.desktop.background picture-uri ''''

    gsettings set org.gnome.desktop.background primary-color ''rgb(66, 81, 100)''

    ```


    复制和粘贴功能现在应该已经生效，否则你可能在 Ubuntu 的“文件”中看不到你的共享文件夹。以下内容应可修复此问题。


    - 关闭虚拟机并关闭窗口。

    - 在主 UTM 窗口中，点击右上角的“设置”图标。

    - 在左侧选择“共享”。

    - 将“目录共享模式”更改为“Spice WebDAV”，点击“保存”。

    - 重启虚拟机。

    - 点击 UTM Ubuntu 虚拟机右上角的“共享文件夹”图标。

    - 确认你期望的共享文件夹位置。

    - 打开 Ubuntu 内的“文件”应用程序。

    - 点击左侧菜单中的“其他位置”选项。

    - 点击标题为“Spice 客户端”的文件夹，等待虚拟机识别它。

    - 确认你可以在“文件”的左侧菜单中访问共享文件夹。


    共享变得对 Ubuntu 可用可能需要几分钟。一旦可用，它应会一直显示直至虚拟机重启。每当你需要访问共享文件夹时，只需在该会话中点击“其他位置”下的 Spice
    文件夹即可。现在你可以直接从虚拟机复制文件到宿主机，反之亦然。通常只在虚拟机启动一段时间后且需要共享文件夹时，我才执行此操作。接下来，我们应该考虑 Ubuntu
    内的隐私和安全设置。前两条终端命令禁用了 Ubuntu 的崩溃报告和使用统计，而操作系统内的剩余步骤则增强了我们整体的隐私和安全。


    ```

    sudo apt purge -y apport apport-symptoms ubuntu-report

    sudo apt autoremove -y

    ```


    - 从应用程序菜单启动“设置”。

    - 点击“通知”，禁用两个选项。

    - 点击“隐私”选项，然后点击“屏幕”并禁用所有选项。

    - 点击“文件历史记录和废纸篓”，然后禁用任何选项。

    - 点击“诊断”，然后更改为“从不”。

    - 点击返回箭头并点击“电源”，将“屏幕空白”更改为“从不”。

    - 点击“自动挂起”并禁用该功能。

    - 关闭所有设置窗口。


    保持此虚拟机上的软件更新至关重要。有不同的方法来实现这一点，但我将聚焦于操作系统应用中最简单的方法。在这样做时，可能是时候为 Dock 添加一些常用应用程序了。执行以下步骤。


    - 启动应用程序菜单（左下角的九个点）。

    - 在搜索框中键入 Terminal。

    - 右键点击该应用程序并选择“添加到收藏夹”。

    - 在搜索框中键入 Software 并右键点击“Software Updater”。

    - 选择“添加到收藏夹”。

    - 按 Esc 键直到所有窗口消失。

    - 从 Dock 启动 Software Updater 图标；点击“立即安装”；并更新所有选项。


    UTM 提供简单的 USB 设备访问。当任何 USB 驱动器连接到宿主机时，选择 UTM 虚拟机窗口右上角的“USB 设备”图标。这将该驱动器显示在 Ubuntu
    的 Dock 中以便文件传输。如果在虚拟机运行时插入 USB 设备，它应该会提示你选择它。当虚拟机关闭且虚拟机窗口关闭时，你会在主 UTM 应用右上角看到针对所选虚拟机的选项。我们将重点关注“克隆所选虚拟机”和“共享”菜单选项。点击克隆选项简单地提供一个制作完整克隆的选项。这允许我们保留原始虚拟机并在需要时制作副本。共享选项允许我们将整个虚拟机导出到“.utm”文件中以便轻松归档或共享。对话框将提示你选择导出位置。如果你希望查看
    UTM 中所有虚拟机的位置，请在 macOS 宿主机中导航至以下目录。


    `/Users/[你的 macOS 用户名]/Library/Containers/UTM/Data/Documents/`


    如果此位置不方便，我相信确实如此，你可以使用主窗口中的“移动所选虚拟机”选项将虚拟机移动到任何期望的文件夹。我把我所有的虚拟机都放在 macOS 宿主机的专用文件夹中。注意你只能通过按钮选项移动它们一次。


    ### 在 Linux 宿主机上创建 Linux 虚拟机


    在本章的第一部分，我解释了如何使用 VirtualBox 在 Windows 系统中创建 Linux 虚拟机。那些说明也适用于使用 VirtualBox 在
    Linux 宿主机上创建 Linux 虚拟机。然而，我认为有更好的方法。QuickEMU（https://github.com/quickemu-project/quickemu）提供预先构建的虚拟机，需要很少的操作。安装软件并使用以下命令与其交互。


    ```bash

    sudo add-apt-repository ppa:flexiondotorg/quickemu -y

    sudo add-apt-repository ppa:yannick-nauray/quickgui -y

    sudo apt update

    sudo apt install quickemu -y

    sudo apt install quickgui

    ```


    安装后，打开 QuickGUI 应用程序并执行以下操作。


    - 点击“创建新机器”，然后点击“选择”按钮。

    - 搜索“pop”并选择“Pop!_OS”。

    - 点击“版本”并选择最新选项，例如“22.04”。

    - 选择“Intel”选项并点击“下载”按钮。

    - 允许下载完成并点击“关闭”按钮。

    - 使用左上角的“X”关闭“下载器”菜单。


    现在你可以随时点击“管理现有机器”按钮来访问你的虚拟机。点击任何机器旁边的播放按钮（右箭头）以启动它。使用全屏按钮最大化你的虚拟机。重复之前的教程以便复制本书中的
    Pop!_OS 机器。你也可以轻松地在此软件中试验超过 300 种不同的 Linux 构建。


    QuickEMU 提供 macOS 安装选项，但我发现它不可靠。Android 选项有效，但版本是 9.0 且相当过时。我们很快就会使用更好的东西。


    ### 在 Linux 宿主机上创建 Windows 虚拟机


    对于需要拥有 Microsoft Windows 的 Linux 宿主机，我推荐使用 VirtualBox（virtualbox.org）。这允许你在需要时启动
    Windows 应用程序。Linux 的 VirtualBox 安装说明如下，在终端中执行。


    ```bash

    sudo apt update

    sudo apt install virtualbox virtualbox-ext-pack -y

    ```


    接下来，你需要一份 Windows 11 安装介质。我更喜欢在 https://www.microsoft.com/software-download/windows11
    的“磁盘映像”部分下的“Windows 11（适用于 x64 设备的多版本 ISO）”。下载后，启动 VirtualBox 并执行以下操作。


    - 点击“新建”按钮。

    - 提供名称“Windows 11”并确认你期望的位置。

    - 选择下载的 ISO 文件并选择你期望的版本。

    - 确认类型为“Microsoft Windows”，版本为“Windows 11（64 位）”。


