  - '[PAGE 12]


    The Gazelle, Adder, Oryx, Serval, and Bonobo laptops are extremely powerful machines
    targeted toward people who need 4K screens up to 17\", dedicated graphics cards,
    and top-of-the-line processors. If you are processing HD video all day or need
    a high-end gaming machine, these are for you. However, they are not for me or
    my clients. That leaves us with three choices left.


    The Galago Pro, Lemur Pro, and Darter Pro would each work for our needs. The end
    user would need to look at them and decide which is the best fit. The Galago Pro
    has only five hours of battery and the Lemur Pro does not have an Ethernet port.
    This is why the Darter Pro is my current laptop and the device often issued to
    my clients. It has the bigger 15" screen, both USB-A and USB-C ports, a microSD
    card slot, and a nine-hour battery. I also prefer the Darter Pro keyboard which
    includes a number pad to the right, but some people may not like the standard
    keyboard which is slightly shifted to the left.


    If you want a more portable (and much lighter) device with 14" screen, I prefer
    the Lemur Pro, but note that it does not have an ethernet port if that is important
    to you. Next are the specs. I chose the following options at the time of this
    writing.


    **Processor:** I chose the default Intel i5 1340p processor, which I find more
    than sufficient for everyday tasks. The jump to an i7 is over $200, and most users
    would never take advantage of the additional horsepower. If you know that you
    will be performing process-intensive tasks which will benefit from this upgrade,
    it may be worth it to you. If you spend most of your time in a browser, you would
    see no improvement. This contradicts my advice in the macOS guide where I encourage
    users to go with higher specifications. This is because macOS machines cannot
    be upgraded and we want to future-proof them the best we can.


    **Memory:** The default 8 GB of RAM is less than I desire. Since I often have
    virtual machines open, I believe 16 GB of RAM is more appropriate.


    **OS Drive:** The default 250 GB of disk space may work for most people, but I
    find it limiting. I also find the 3,300 MB/s read speed of the default drive less
    than optimal. I prefer to increase the size to 1 TB and the speed to 7,000 MB/s
    with the PCIe Gen4 drive. If you ever need to process large amounts of data, you
    will appreciate the upgrade. This increase of 4x the size and 2x the speed is
    only $115 more.


    My customization presented a total price of $1,259.00. An equivalent Apple laptop
    would be twice that amount. I want to stress that my choice of laptop may not
    be the same as yours. There is no such thing as the perfect machine. Do your own
    research and find the appropriate model for you. Watch online review videos to
    see a realistic representation of any device. The Galago Pro, Lemur Pro, and Darter
    Pro each include Coreboot and disabled Intel ME, and are very portable. All System76
    computers have the option of shipping with either Ubuntu or Pop!_OS, as explained
    next.


    I am sure some readers are questioning my enthusiasm for System76 products. In
    the name of full transparency, I received no compensation from System76 for the
    promotion of their products in this book. I purchased my own machine(s) and I
    am not a System76 affiliate. I receive no kickbacks from any past or future orders.
    In fact, I had a hard time getting their press team to respond to my multiple
    requests asking for permission to use their trademarked name within this guide.'
  - '[PAGE 13]


    # # CHAPTER THREE: OS CONFIGURATION


    I will assume that you have now identified the way in which you will begin your
    Linux journey. Whether you have decided to test things with an old computer, play
    around within a virtual machine, or commit to the Linux world with a brand-new
    laptop, this entire chapter (and rest of the book) applies to you. Our next discussion
    is over the version of Linux best for your needs. This is where I always see great
    debate. Offering a Linux variant preference is similar to stating which religion
    is best. There are many die-hard Linux fanatics who will scold me regardless of
    the route I take. Let’s rip this bandage off and get right to it. My preference
    for Linux installation is **Pop!_OS**. There, I said it. I know many of you are
    screaming at me right now. Before you sharpen your pitchforks, please allow me
    to explain some other popular options, and the reasons I choose **Pop!_OS** for
    my daily laptop.


    **Qubes OS**: Any time I mention Linux on my show, numerous people write in to
    tell me I should be recommending Qubes OS. Qubes OS is a security-focused Linux
    operating system that aims to provide security through isolation via virtualization.
    It allows you to launch every application within its own isolated virtual machine.
    This is quite impressive and extremely secure. However, it can also be annoying.
    The learning curve from macOS or Windows to Qubes OS is steeper and daily usage
    can be trying. I once attempted to use Qubes OS for 30 days, but failed after
    much frustration trying to perform daily tasks. If you use Qubes OS full-time,
    you have my respect. For most people, I believe it is overkill and more likely
    to make them return to easier traditional systems.


    **Kali**: Many people advocate using a Linux build called Kali which is pre-loaded
    with numerous security-related tools. However, Kali is designed to be executed
    as a virtual machine and I believe it should never be executed for personal usage.


    **TAILS**: The entire TAILS operating system relies on the Tor network for increased
    anonymity online. However, it is not meant to be a host. It is designed to be
    launched from an external drive in a way in which it leaves no trace on the computer
    after the session is closed. Much like Kali, it is not intended to be used as
    a daily driver host.


    **Debian**: Debian is designed to be used as a host, and it provides a very minimal
    software experience. I believe Debian can be a great choice for those who have
    a lot of Linux experience. I used it for a while, but ran into driver issues and
    the occasional software conflict. Of the previous options, it is the closest we
    have to a full-functioning Linux host operating system.


    **Ubuntu**: This is probably the most familiar choice as it is one of the most
    popular Linux distributions. It is a fantastic beginner’s operating system because
    it typically just works upon launch. It has its own application store and many
    software developers offer online steps to make their applications work on Ubuntu.
    I recommend Ubuntu for use as an OSINT virtual machine, as explained in my OSINT
    Techniques book, and it has worked very well for me over the years. However, there
    are minor things which annoy me. First, Ubuntu pushes you to use their own Snap
    software installation and go out of their way to prohibit you from using more
    traditional installation processes. It is rumored that Ubuntu is ditching the
    Snap option altogether in mid 2024, but we are stuck with it for now. They also
    include some minor telemetry which needs disabled. I think Ubuntu, and a variant
    called Mint could both be used as daily Linux drivers by anyone, but I believe
    we have a better option.'
