    # ## Creating a Linux VM on a macOS Host


    I believe UTM (mac.getutm.app) is the best virtualization software for Apple computers.
    This phenomenal free and open-source software works better with macOS than any
    other free or paid product. Install it from Terminal with the following command
    (assuming you have Homebrew (brew.sh) installed).


    brew install --cask utm


    UTM allows macOS users to launch practically any virtual system within host machines
    which have either Intel or ARM (Apple) processors. This means it will work with
    any Apple computer, regardless of the hardware. UTM employs Apple''s Hypervisor
    virtualization framework to run ARM operating systems on Apple Silicon at near
    native speeds. On Intel-based machines, traditional x86/x64 operating systems
    can be virtualized. In addition, lower performance emulation is available to run
    x86/x64 on Apple Silicon as well as ARM64 on Intel. This allows us practically
    any option desired, and is unique to this program. Even the paid alternatives
    do not offer all of these features. The software relies on QEMU, which has always
    been otherwise difficult to configure. I now rely solely on UTM for all VMs on
    my macOS machine, and I find it to be superior to a Windows or Linux host.


    Upon opening UTM, you have the option to "Create a New Virtual Machine". If this
    is ever not visible, you can replicate the action by clicking "File" > "New" within
    the program''s menu. Choosing this selection presents options which may be new
    to readers. You can select to either "Virtualize" or "Emulate" your new VM. We
    should understand the difference.


    **Virtualize:** This process is accomplished with the help of hardware, typically
    the hypervisor. It virtually shares the hardware resources of a single physical
    computer into multiple virtual devices by allocating dedicated resources from
    the host system to the newly created virtual system. This is typically much faster
    than emulation and the option we will choose for our new VM. If you have an M1,
    M2, or newer Apple processor, you cannot virtualize x86/x64 operating systems,
    you can only virtualize ARM-based systems. Similarly, you cannot virtualize ARM-based
    systems from a x86/x64 machine. When using virtualization, the operating system
    must be created for the processor present within the device.


    **Emulate:** This process is much more forgiving, but can be slow. It uses software
    to emulate specific hardware. This means that the VM needs a software interpreter
    translating its code into the host system''s language. This eats up a lot of resources
    and can make things drag. Since the VM does not run on the host''s physical hardware,
    emulation is slower when compared to virtualization. By contrast, in virtualization,
    the guest system gets direct access to the host''s allocated resources, resulting
    in better speed. It is great to have this option, but we will not use it within
    this chapter. Let''s build our first Linux VM within UTM together. Choose the
    "Virtualize" option and then select "Linux". This brings us to our need to choose
    the proper path based on our hardware. You must choose the appropriate version
    of Linux for your processor. If you have an Intel device, you can use the standard
    Pop!_OS ISO file which was previously used to install it to a host. You could
    also use the Ubuntu ISO available on their website. If you have an M1, M2, or
    later processor, you need the ARM version'
