    VPN, as explained in *Extreme Privacy, 4th Edition*. At home, I never need to
    launch a VPN within my computer itself due to the VPN firewall. I encounter constant
    issues with any Linux VPN application, so I prefer to rely on my home network
    firewall whenever I can, while leaving any Linux VPN apps disabled. I trust Proton
    VPN more than most commercial options and I believe their business model is the
    most transparent. Being hosted in Switzerland provides some aspect of privacy
    from vague government intrusion, but international servers could always be compromised.
    Any updates in regard to my VPN recommendations and configurations will be posted
