    # 第一章：为什么要选择 Linux？


    我在引言中提到过，Windows 和 macOS 设备会收集并存储关于你如何使用其产品的数据。让我们深入探讨一下这一点。2019 年，我请求苹果公司提供所有存储有关我个人的数据。我当时正准备录制一期播客，主题是有关苹果收集的所有关于我们的数据，我希望亲眼目睹这种“破坏”的第一手资料。我拥有几个使用别名注册的
    Apple ID 账户，因此我从每个账户请求了数据。由于我从未向苹果提供我的真名，我原以为泄露无关紧要。我错了。苹果提供的数据证实，他们知道以下关于我“匿名”苹果账户的信息：


    - 我在创建账户时提供的完整别名姓名和电子邮件地址

    - 我在创建账户时提供的别名实体地址

    - 所有设备的序列号

    - 我首次使用这些电子邮件地址与苹果进行交互的日期

    - 使用设备期间获取的多个 IP 地址

    - 分配给所有设备的内部计算机名称

    - 系统重新格式化的日期/时间

    - 最后一次访问 iTunes、FaceTime 和 iCloud 的日期/时间及 IP 地址

    - 使用设备期间我的时区

    - 在登录苹果账户时提供的 VoIP 电话号码

    - 我曾经输入到苹果邮件（Apple Mail）中的一个备用电子邮件地址

    - 我通过官方苹果音乐（Apple Music）应用收听过的歌曲

    - 我暂停播放时的歌曲中的具体时刻

    - 我从苹果服务器流媒体传输媒体时的 IP 地址

    - 在引导过程中识别出的我偏好的音乐艺术家

