    - 下载过程中分配的所有 IP 地址

    - 通过苹果图书（Apple Books）下载的所有书籍

    - 我在连接期间使用的数百个 IP 地址

    - 苹果日历中所有条目的导出

    - 保留在 iCloud 中的文档和联系人

    - 从苹果邮件自动存储的联系人

    - 在苹果邮件中访问的收件人电子邮件地址

    - 发送邮件的日期和时间

    - **从发出的邮件头中提取我的真实姓名**


    我要提醒的是，在我自以为匿名的同时，所有这些数据都被监控、收集和存储。在苹果设备上根本不存在匿名性，因为数字足迹最终会识别任何用户。如果你阅读了我的数字指南*《极端隐私：macOS
    设备》*，你会知道我们可以阻断大部分这种遥测数据，但这维护起来可能很繁琐。我认为我们不应该需要采取如此极端的措施来阻止公司进行这种入侵。


    微软也不遑多让。默认情况下，Windows 10 和 11 需要微软在线账户才能安装操作系统。某些版本允许你通过离线方式完全绕过账户创建，但微软正在推动在
