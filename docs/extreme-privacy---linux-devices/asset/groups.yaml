    我是 **Standard Notes** (standardnotes.com) 的忠实粉丝。免费版本提供完全端到端加密（E2EE）的数据。只有您能看到您的内容，并且您可以将所有数据同步到任何其他桌面或移动设备。我全天依赖我的笔记。付费版本引入了更多文本格式化选项和电子表格条目，但我更喜欢免费版纯文本的感觉。然而，付费版包括存储双因素身份验证（2FA）代码的能力，这是一个巨大的优势。这使我拥有一个真正跨平台、开源、加密的应用程序用于我的
