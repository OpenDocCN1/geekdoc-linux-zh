    # **CHAPTER TWO: HARDWARE CONFIGURATION**


    If you are a macOS user, you are limited to specific hardware approved and sold
    by Apple. If you want a laptop, you have a handful of options which can be minimally
    optimized. Linux is a different beast. Since it runs on practically any computer
    hardware, the options are endless. You likely possess an old computer which is
    capable of running Linux without much effort or commitment. If not, you probably
    have a macOS or Windows device which could host a Linux virtual machine. If you
    decide to purchase a new computer specifically designed for Linux, you have a
    new set of overwhelming choices. Let''s make sense of all of these options.


    Used Equipment: One of the best ways to test Linux is to install it onto a retired
    machine. If your computer is capable of running Windows, it will likely also handle
    Linux. If you possess an Apple computer, things are not as straight forward. Older
    Apple computers made before 2016 should handle just about any Linux variation.
    If you have a newer Intel-based laptop with a touch bar, you will need a special
    variant of Linux available from t2linux.org. If your device was made after 2020
    and has the latest Apple processor, I do not recommend attempting a Linux installation.
    Everything else should be possible. I keep old laptops specifically for testing
    new Linux builds.


    Virtual Machines: If you only have one computer, then a Linux virtual machine
    is ideal for experimentation. Chapter Eight goes into great detail about creating
    virtual machines within any Linux, macOS, or Windows platform. It also explains
    how to build Linux and Windows virtual machines within your Linux host. Once created,
    your virtual machine will behave just like a traditional installation on a host.


    New Computers: This is always my preference. If you decide to commit to a Linux
    lifestyle, purchasing a dedicated Linux machine with your own specifications is
    ideal. It also opens the flood gates with multiple manufacturers, models, and
    customizations. However, I will walk you through my preferred options. A new machine
    with Linux pre-installed is not only the easiest way to get going, it should offer
    the best possible integration into your daily activities. During the rest of this
    chapter, I will assume that you want to purchase a new computer specifically for
    your Linux experience. However, the next chapter explains how to install Linux
    within any capable device. For now, let''s focus on hardware options.


    There are thousands of new and used machines which could run Linux well. You might
    have a preference for Lenovo ThinkPad laptops, and you might want to stick with
    that which is familiar. Maybe you prefer Dell machines. Both Lenovo and Dell work
    great with Linux, but I believe we can do better. Let''s start with the processor.
    The processor is the main chip which allows your computer to complete all of the
    functions and tasks which you tell it to do. It is the heart of a computer. It
    can also be the first vulnerability from an outside attack. Virtually every Intel
    processor made since 2008 possesses software known as the Intel Management Engine
    (Intel ME). It is a subsystem of proprietary firmware embedded directly onto the
    chip. It is a small operating system. Any traditional operating system installed
    to the computer, such as Linux, would have no control over Intel ME. The Intel
    ME software runs during boot, while the computer is running, and while it is asleep.
    As long as the chipset is supplied power, it even continues to run when the system
    is turned off.'
