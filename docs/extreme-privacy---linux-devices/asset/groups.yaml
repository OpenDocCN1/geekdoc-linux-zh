    ## 第八章：虚拟机


    虚拟机（VMs）虚拟化或模拟了特定的计算机系统。它们是在计算机操作系统之上的计算机操作系统。最常见的情况是，软件程序在操作系统内运行，而单个操作系统可以启动于该程序之中。每个虚拟机都独立于其他虚拟机和宿主操作系统。一个虚拟机的环境不会对其余任何环境产生影响。


    简而言之，这是一种在单台计算机内拥有多台计算机的方式。虚拟机提供了一个“干净”的环境，不受其他互联网使用行为的污染。你可以在几分钟内克隆原始虚拟机，并立即丢弃它们。我们将使用虚拟机，以便将特定的计算机使用行为与日常使用（该日常使用经常受到在线跟踪的轰炸）隔离开来。


    当我在其他指南中讨论 Windows 和 macOS 系统时，我曾鼓励读者考虑使用 Linux 虚拟机来处理敏感任务，例如银行操作。如果你现在使用的是 Linux
    宿主系统，我认为对于许多读者来说，次要的 Linux 虚拟机是多余的。你在宿主系统中已经拥有了极佳的隐私和安全。因此，本指南中的指导将聚焦于以下领域。


    - 在 Windows 宿主上创建 Linux 虚拟机，以便实验 Linux 或为特定任务拥有安全的 Linux 环境。

    - 在 macOS 宿主上创建 Linux 虚拟机，以便实验 Linux 或为特定任务拥有安全的 Linux 环境。

    - 在 Linux 宿主上创建 Linux 虚拟机，以便实验其他 Linux 构建版本或为特定任务拥有次要的 Linux 环境。

    - 在 Linux 宿主上创建 Windows 虚拟机，以便在 Linux 内拥有传统的 Windows 操作系统选项。

    - 在 Linux 宿主上创建 Android 虚拟机，以便在 Linux 内拥有传统的 Android 操作系统选项以启动移动应用。


    在创建虚拟机之前，你必须拥有虚拟机软件。有几个免费和付费程序允许你创建和执行虚拟机。高级选项如 VMware 提供免费版本，但其功能极其有限。Parallels
    在 macOS 上运行良好，但价格昂贵。VirtualBox 一直是创建虚拟机的免费黄金标准，但它与较新的 macOS 机器兼容性不佳。UTM 在 M 系列
    Apple 处理器上运行良好，但不适用于其他系统。这样的列表还有很多。因此，我将在以下几页中详细介绍每个选项。


    ### 在 Windows 宿主上创建 Linux 虚拟机


    对于 Windows 宿主上的 Linux 虚拟机，我推荐 VirtualBox (virtualbox.org)。完整的安装步骤可以在 virtualbox.org
    找到，但通常并不直观。在本文撰写时，以下步骤在 Windows 中安装了 VirtualBox。


    - 访问 virtualbox.org/wiki/Downloads。

    - 点击适合你操作系统的第一个相应链接，例如“Windows Hosts”。

    - 选择最高版本但不包括“Beta”，例如“7.0.0”。

    - 下载适合 Windows 的相应“exe”文件。

    - 下载适合你版本的扩展包（Extension Pack），例如“7.0.0.vbox-extpack”。

    - 使用所有默认设置安装 exe 文件。

    - 双击扩展包并将其安装到 VirtualBox 中。


    虽然 VirtualBox 对个人使用是免费的，但请确保你或你的组织满足软件使用要求，特别是免费的扩展包许可。VirtualBox 运行唯一的硬件要求是一台支持虚拟化的计算机。任何现代
    Windows 宿主系统在不进行任何修改的情况下都应能正常工作。


    过去五年内制造的大多数中端和高端计算机应该都没有问题，但可能要求你在启动时进入 BIOS（基本输入/输出系统）启用虚拟化支持。上网本、旧机器和廉价低端计算机很可能会给你带来问题。如果你不确定是否满足此要求，请搜索你的电脑型号后加上“virtualization”（虚拟化），你应该能找到答案。本节其余部分将假设你的
    Windows 宿主计算机满足此要求，并且现在已拥有 VirtualBox。


    首先，我们需要像之前解释的那样下载 Pop! OS ISO 文件。此文件的行为类似于安装 Windows 或其他操作系统的物理 CD。将文件保存到你的桌面或你容易访问的任何位置。预期文件大小约为
    3 GB。接下来，打开 VirtualBox 并点击标有“New”（新建）的按钮。以下内容创建了适合我们需求的虚拟机。这些确切步骤经常变化，但这应提供所需的一般设置。


    - 提供名为“Pop! OS”的名称，并选择保存机器的位置。

    - 类型选择“Linux”，版本选择“Ubuntu 22.04 (64-bit)”，然后点击“Next”（下一步）。

    - 在 Base Memory（基本内存）下，移动滑块选择系统内存的 50%。

    - 在 Processors（处理器）下，移动滑块选择资源的 50%。

    - 点击“Next”（下一步）然后点击“Create”（创建）。

    - 保持硬盘文件类型为“VDI”然后点击“Next”（下一步）。

    - 选择默认的“Dynamically allocated”（动态分配）选项，然后点击“Next”（下一步）。

    - 选择你期望的虚拟硬盘大小。如果你有一个大型内部驱动器，50 GB 应该足够了。如果你受限，你可能需要减小该数字。

    - 点击“Create”（创建）。


    你的虚拟机已创建，但启动时它不会做任何事。我们需要告诉它从我们之前下载的 ISO 文件启动。在左侧菜单中选择你的新机器并完成以下步骤。


    - 点击 Settings（设置）图标，然后点击 Storage（存储）图标。

    - 点击在左侧菜单中显示“Empty”（空）的 CD 图标。

    - 在“Optical Drive”（光驱）选项中，点击最右侧的小蓝圈。

    - 选择“Choose a disk file”（选择磁盘文件）。

    - 选择之前下载的 Pop! OS ISO，然后点击“Open”（打开）。

    - 点击“OK”（确定），然后在主菜单中点击“Start”（启动）。

    - 如果收到提示，请点击“Start”（启动）确认你的选择。


    你的 Pop! OS 安装过程现在应在新窗口中开始。你应该正在启动之前下载的 ISO 文件，其行为就好像你将一张 Pop! OS 安装 CD 放入虚拟计算机中一样。这是你在宿主操作系统之上运行的第一个虚拟机。如果窗口太小，请在
    VirtualBox 菜单中点击“View”（显示）、“Virtual Screen”（虚拟屏幕），然后点击“Scale to 200%”（缩放到 200%）。如果可能，请避免这样做，因为这可能会导致后续查看问题。完成操作后，考虑如果显示内容显得过大，可反转此设置。我们现在可以根据之前的教程完成
    Pop! OS 的安装。


    你现在应该拥有一个功能正常的虚拟机，其中包含我们需要使用互联网的基本程序。默认情况下，它使用宿主计算机的互联网连接，如果你连接了 VPN，则会利用你宿主的
    VPN。从技术上讲，我们可以立即开始使用这台机器，但体验会变得令人沮丧。我们需要采取一些额外步骤来配置设备以优化使用。第一步应该是安装 VirtualBox
    的 Guest Additions（客户机增强）软件。这将使我们能够利用更好的屏幕分辨率和其他便利性。执行以下步骤。


    - 在 VirtualBox 菜单中，选择“Devices”（设备） > “Insert Guest Additions....”（插入 Guest Additions....）。

    - 当对话框弹出时，点击“Run”（运行）。

    - 如果没有对话框存在，请在 Dock 中的 CD 上右键点击“autorun.sh”。

    - 选择“Run as Program”（作为程序运行），并在提示时输入密码。

    - 允许过程完成，按回车键，并重启虚拟机。


    你现在应该已经安装了 VirtualBox Guest Additions。你可以通过调整窗口大小来测试这一点。如果你将 Pop!_OS 虚拟机全屏显示，你应该看到整体屏幕分辨率随之改变。如果你之前在
    VirtualBox 中更改了窗口的缩放比例，请将其改回 100%。如果屏幕仍然太小，请右键点击 Pop!_OS 桌面并选择“Display Settings”（显示设置）。如果该选项存在，请选择
    200% 的“scale”（缩放），看看是否更适合你。总体而言，我更愿意在 Pop!_OS 虚拟机内部修改分辨率，而不是在 VirtualBox 设置中修改。我希望
    Pop!_OS 虚拟机在全屏模式下拥有尽可能高的分辨率，如果需要，可以选择较高的缩放比例。


    如果一切看起来运行正常，你可以右键点击左侧 Dock 中的 CD 图标并选择“Eject”（弹出）。如果运行不正常，请双击 CD 图标并在右上角选择“Run
    Software”（运行软件）以重复该过程。接下来，我们应该在 VirtualBox 程序中进行一些修改，以获得更好的功能体验。点击右上菜单关闭虚拟机。在
    VirtualBox 中，选择你的虚拟机并点击“Settings”（设置）图标。接下来，执行以下操作。


    - 在“General”（常规）图标中，点击“Advanced”（高级）选项卡。

    - 将“Shared clipboard”（共享剪贴板）和“Drag ''n'' Drop”（拖放）更改为“Bidirectional”（双向）。

    - 在“Display”（显示）图标中，将“Video Memory”（视频内存）更改为最大值。

    - 在“Shared Folders”（共享文件夹）图标中，点击绿色的“+”。

    - 点击“Folder Path”（文件夹路径）下方的下拉菜单并选择“Other”（其他）。

    - 选择你要在宿主上共享数据的所需文件夹。

    - 选择“Auto-mount”（自动挂载）选项，然后点击“OK”（确定）。

    - 点击“OK”（确定）关闭设置窗口。

    - 重启你的虚拟机。


    你现在应该拥有更强大的显示、复制粘贴功能，以及一个新共享文件夹，该文件夹将你的虚拟机与你桌面上的宿主连接起来。你可以直接从虚拟机复制文件到宿主，反之亦然。


    ### 快照


    虚拟机的一大功能是使用快照。这些“冻结”的时刻允许你恢复到原始配置或保存最佳设置。大多数用户按照前面详述的方式安装虚拟机，然后立即创建一个未使用环境的快照。当你意外删除或破坏某个功能时，你可以恢复到之前创建的快照，从而消除重新安装的需要。完全关闭虚拟机，并执行以下操作。


    - 在 VirtualBox 菜单中，点击右上角的“Snapshots”（快照）按钮。


    '
