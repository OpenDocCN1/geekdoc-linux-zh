    ```

    #!/bin/bash

    clear

    COLUMNS=12

    PS3=''Selection: ''

    options=(

    "Show Hidden Files"

    "Hide Hidden Files"

    "Start NextDNS"

    "Stop NextDNS"

    "Restart NextDNS"

    "Launch Files with Admin"

