    # # CHAPTER EIGHT: VIRTUAL MACHINES


    Virtual machines (VMs) virtualize or emulate a particular computer system. They
    are computer operating systems on top of computer operating systems. Most commonly,
    a software program is executed within an operating system, and individual operating
    systems can launch within that program. Each virtual machine is independent from
    the other and the host operating system. The environment of one virtual machine
    has no impact on any others.


    Quite simply, it is a way to have numerous computers within your single computer.
    VMs offer a "clean" environment with no contamination from other internet usage.
    You will be able to clone an original VM in minutes and trash them immediately.
    We will use virtual machines in order to isolate specific computer usage from
    the daily driver which gets bombarded with online tracking.


    When I have discussed Windows and macOS systems in other guides, I have encouraged
    readers to consider a Linux VM for sensitive tasks such as banking. If you are
    now using a Linux host, I believe secondary Linux VMs are overkill for many readers.
    You already possess great privacy and security within your host. Therefore, my
    guidance within this guide will focus on the following areas.


    +   - Create Linux VMs on Windows hosts in order to experiment with Linux or possess
    a secure Linux environment for specific tasks.

    +   - Create Linux VMs on macOS hosts in order to experiment with Linux or possess
    a secure Linux environment for specific tasks.

    +   - Create Linux VMs on Linux hosts in order to experiment with other Linux
    builds or possess a secondary Linux environment for specific tasks.

    +   - Create Windows VMs on Linux hosts in order to have traditional Windows operating
    system options within Linux.

    +   - Create Android VMs on Linux hosts in order to have traditional Android operating
