  - '[PAGE 36]


    Install uBlock Origin from the Firefox Add-ons page or directly by navigating
    to the application’s website at https://addons.mozilla.org/en-US/firefox/addon/uBlock-
    origin/. You are now protected on a basic level. By default, most known invasive
    advertisements, tracking code, and malicious content is blocked. This step alone
    would provide much needed protection from the internet. However, we can take it
    a step further.


    Click on the uBlock Origin icon in the menu and select the "Dashboard" icon to
    the right, which appears as a settings option. This will open a new tab with the
    program’s configuration page. On the "Settings" tab, click the option of "I am
    an advanced user". This will present an expanded menu from the uBlock Origin icon
    from now forward. Click on the "Filters" tab and consider enabling additional
    data sets that may protect your computer. I find the default lists sufficient,
    however I enable "Block access to LAN" under "Privacy". You now have extended
    protection that will be applied to all visited websites without any interaction
    from you. When you encounter a web page with a lot of advertisements, such as
    a news media website, it should load much faster. It will block many of the pop-ups
    and auto-play media that can be quite annoying when conducting research.


    After you have enabled the Advanced settings as explained above, clicking on the
    uBlock Origin icon should now present an expanded menu which will change as you
    visit different sites. In order to explain the function of this menu, I will conduct
    a demonstration using the website cnn.com. Figure 6.01 displays the default view
    of uBlock Origin with the site loaded. Scrolling down this list of scripts that
    have either been loaded or blocked, you can see several questionable scripts such
    as Twitter, Amazon, and Turner. These scripts allow tracking across multiple websites
    and are the technology responsible for monitoring your interests, web history,
    and shopping habits.


    This menu is split into three columns. The first simply identifies the type of
    code or domain name of the script. The second column is global settings. Anything
    changed here will apply to all website visits. The third column contains settings
    for the current website. A single plus sign (+) indicates that less than ten scripts
    were allowed from that specific option. Two plus signs indicate that between ten
    and one hundred scripts were allowed. The single minus sign (-) indicates that
    between one and nine scripts were blocked from that domain, while the dual minus
    signs tell us that ten to one hundred scripts were blocked.


    In Figure 6.01, we know that over ten scripts were allowed to run from cnn.com,
    and at least one script was blocked from sending data to Twitter. This is all
    default behavior and provides a balance of functionality and security. uBlock
    Origin decides which content should be allowed and which should be blocked.'
  - '[PAGE 37]


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_37_0.png)


    Figure 6.01: An advanced view of uBlock Origin.


    Using this same page, let''s modify the options. In Figure 6.02 (left), I have
    clicked on the far-right portion of the first cell in the third column. This turned
    the entire third column red in color. This action activated an option to refresh
    the page (arrows) and an option to save the change (padlock). Clicking the padlock
    and then refreshing the page presented me with the example in Figure 6.02 (right).
    Since I blocked every script, the page would not fully execute. It could not load
    images, design scripts, or any JavaScript. This is not useful at all, so I disabled
    my actions by clicking on the left (grey) section of the top cell in the third
    column, which turned the entire column back to grey in color. Saving these changes
    and refreshing the page brought me back to the example in Figure 6.01.


    We can also take this to the opposite extreme. In Figure 6.03 (left), I clicked
    on the "power button" in the upper-right. This turned the entire left edge green
    in color, and allowed all scripts to load on cnn.com. This includes the dozens
    of intrusive scripts that could load advertisements on the page. You can also
    see that small plus signs confirm that scripts were allowed to run while the minus
    signs in Figure 6.03 (right) state the opposite. For most users, this allowance
    would seem irresponsible.


    Next, we will modify the second (middle) column, which will apply settings globally.
    By default, all options are grey in color, which is desired by most users. This
    indicates that the default block list is applicable, and only invasive scripts
    will be blocked everywhere. For demonstration, I clicked on the right (red) portion
    of the top cell in the second column. This turned the entire column red, and indicates
    that all scripts across all websites will be blocked. After I saved my changes,
    every website will only load the most basic text content. This will prohibit much
    of our usage.


    Loading a page such as a Twitter profile resulted in no usable content. By clicking
    on the uBlock Origin icon and clicking the left (grey) sections of specific cells
    within the third column, I enabled those scripts without allowing everything on
    the page. In Figure 6.03 (right), you can see the difference in colors. In this
    example, the entire second column is red. This indicates that all scripts are
    blocked globally. The third column is mostly red, but the options for twitter.com
    and twimg.com are grey. Those scripts will be allowed, if approved by uBlock Origin''s
    rules, only for that domain. If I load a blog that has scripts from Twitter, they
    would still be ignored.'
  - '[PAGE 38]


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_38_0.png)


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_38_1.png)


    These are extreme examples. Let''s bring this back to some sanity. The following
    is how I recommend using uBlock Origin. Install, enable advanced options, and
    proceed with your work. When you arrive at a website that is blocking something
    you want to see, open the menu and click on the left (grey) section of the top
    cell in the third column. That will allow everything to load on that page, and
    that page only. When you are about to navigate to a questionable site that may
    try to install malicious code on your machine, click on the right (red) section
    of the top cell in the second column. That will block all scripts on all pages.
    Conduct your usage and reverse the change when you are finished. Remember to click
    the save button (padlock) after each change and refresh the page.


    Hopefully, you are practicing these settings and learning how this program functions.
    It is an amazing option that has protected me many times. If you are doing things
    right, you have likely completely messed-up your settings and are now blocking
    things you want while allowing things you do not. Don''t worry, we can reverse
    all of our mistakes by first changing the global (second column) settings back
    to grey (left section of top cell). Next, return to the dashboard settings of
    the add-on, and click on the "My Rules" tab. In the second column (Temporary Rules),
    select all of the text and press the delete key on your keyboard. Click the "Save"
    button in this same column and then the "Commit" button to apply these settings
    everywhere. This resets our extension and brings us back to default usage regardless
    of your modifications.


    This is important in the event you go too far with settings in the future. Removing
    and reinstalling the extension does not always wipe this data out of your system.
    The primary benefit of uBlock Origin over other options is the simple ability
    to block malicious scripts without customization, while having an option to allow
    or block any or all scripts at our disposal. This is a rarity in these types of
    add-ons. Another benefit is the ability to bypass website restrictions, such as
    a news site blocking articles'
  - '[PAGE 39]


    unless the visitor has a subscription service. Consider the following example
    with the Los Angeles Times. Visiting the page allows you to view three articles
    for free, but you must have a paid subscription in order to continue reading it.
    If I click on the uBlock Origin menu while on this page, select the right (red)
    option on the right (third) column under the setting for "3rd party scripts",
    then the padlock icon, and reload the page, I see a different result. I am now
    allowed to see the article. This is because this website relies on a third-party
    script to identify whether a visitor is logged in to the service. This modification
    presents unlimited views of articles without registration on this and thousands
    of other websites.


    The next Firefox add-on which I use daily is the **Multi-Account Containers**
    option from Mozilla. It can be found at addons.mozilla.org/firefox/addon/multi-account-containers.
    Prior to 2021, I used this service to create individual containers which isolated
    website cookies from each site. However, Firefox introduced "Total Cookie Protection"
    within version 86 released in February of 2021. Because of this, temporary internet
    files from each domain are confined to the websites where they originated (when
    "Strict" is selected under "Enhanced Tracking Protection"). Firefox creates a
    virtual container for each site loaded. Facebook cannot see the cookies downloaded
    from Amazon and vice-versa. Many believe this eliminates the need for Multi-Account
    Containers, but I disagree.


    Multi-Account Containers allows you to separate your various types of browsing
    without needing to clear your history, log in and out, or use multiple browsers.
    These container tabs are like normal tabs except that the sites you visit will
    have access to a separate slice of the browser''s storage. This means your site
    preferences, logged-in sessions, and advertising tracking data will not carry
    over to the new container. Likewise, any browsing you do within the new container
    will not affect your logged in sessions, or tracking data of your other containers.


    Consider an example. I have a container tab open which I use to log in to a Twitter
    account. I want to log in to another Twitter account within the same browser.
    If I open a new tab and go to twitter.com, I am automatically logged in to the
    same account as the previous tab. However, if I open a new container tab, I am
    presented the option to log in to a new Twitter account. I simply open a unique
    container tab for each of these events. Each sees the session as unique, and no
    data is shared from one service to another. Once installed, you will see a new
    icon in the upper right which appears as three squares. Click on it and select
    the container you want to open. Default options include choices such as Personal
    and Shopping, but you can modify these any way you desire. I have ten containers
    titled Private01 through Private10. You can create, delete, and edit containers
    from the Containers menu. When you click the Edit Containers or the + buttons,
    you can change the color or icon associated with a container or change the container
    name.


    I also use this extension in order to have quick access to all of my Google Voice
    numbers. I created a new container for each Google Voice number I own. I then
    logged in to the appropriate account for each container and disabled the option
    to clear my cookies upon exit. Today, I can launch Firefox, select the container
    titled with the number I want to use, and immediately place or accept a call via
    my desktop. I can close the browser completely when I am done. I also changed
    the icon and name to reflect this purpose. This has been most beneficial when
    I have been on a call with a financial institution and they want to call me back
    at a specific number which they have on file. Opening the browser and being immediately
    ready is better than'
