    稍等。下一章将讨论防火墙，它能帮助我们屏蔽来自设备的非必要传出流量。这是保护隐私和安全的关键步骤。


    ## 第四章：DNS 配置


    只要你为任何设备启用互联网连接，系统就会开始向各种服务器发送信息。这可能包括无害的数据，例如检查更新、时间同步或检索待处理的消息。


    虽然大多数 Linux 操作系统不会像微软和苹果那样发送侵入性的遥测数据，但第三方应用程序可能会这样做。我们信任的许多应用实际上正在我们背后发送关于我们的使用信息。我的目标是提供能够减少或消除这种暴露的选项。我们可以通过使用第三方
    DNS 服务来实现这一点。


    如果你读过我的 macOS 指南，你会知道该章节侧重于使用软件防火墙而非 DNS。虽然 Linux 上存在一个名为 Open Snitch 的防火墙应用程序，但我目前不推荐它。它长期以来都存在相当多的错误，并且在
    Ubuntu 或 Pop!_OS 中运行时，每次启动该应用程序都需要调整执行方式才能正常工作。虽然我坚持认为 macOS 设备需要软件防火墙，但我并不认为
    Linux 有必要这样做。我在 macOS 上使用 Little Snitch 的主要目的是阻断与 Apple 的连接。Linux 并不存在这些问题。然而，我认为我们确实需要某种形式的内容过滤。


    首先，我们应该理解域名系统（DNS）的性质。DNS 可能是一个令人望而生畏的主题。用最基本和简单的解释来说，DNS 将域名（如 inteltechniques.com）转换为
    IP 地址，以定位适当的内容。在典型配置中，你的家庭或移动互联网服务提供商（ISP）会在没有你参与的情况下静默处理你的 DNS 查询。换句话说，无论你是否使用
    SSL 加密，你的 ISP 都知道你访问过的每一个网站域名，并且知道你的计费详情。如果你不是匿名购买互联网或蜂窝服务的，那么他们也知道你的身份。ISP 通过这种方式收集大量有关你的有价值信息，并经常将这些详细信息出售用于营销目的。我要阻止这种行为。


    默认情况下，你的 Linux 设备依赖于你所连接的网络提供的 DNS 服务。这可能是你的家庭 Wi-Fi 或蜂窝提供商的服务。你可以选择为设备生成的所有查询指定不同的
    DNS 服务器。我为所有客户的桌面设备和手机都实施了 NextDNS（nextdns.io）服务。


    NextDNS 执行导航网络流量所需的 DNS 查询，但它还包含过滤选项。我稍后将通过从我的测试设备进行的实际配置演示来解释这一点。首先，在 https://my.nextdns.io/signup
    创建一个免费账户。任何掩码或私有电子邮件地址都应被接受，且不需要支付来源。我使用了别名。免费层每月允许 30 万次查询，无需费用。


    注册后，你应该被带到 NextDNS 用户门户，在“设置指南”下应显示“Linux”菜单选项。第一个选项应显示首选的 "systemd" 安装方式，但它可能与
    VPN 应用程序冲突。相反，我们将使用以下终端命令安装 NextDNS。


    ```

    sh -c "$(curl -sL https://nextdns.io/install)"

    ```


    提供以下响应：


    -   输入 "i" 进行安装，并在提示时提供你的密码。

    -   输入你的 NextDNS 配置文件 ID，例如 d4c2af。

    -   输入 "Y" 以报告设备名称，输入 "n" 以设置为路由器。

    -   输入 "y" 以启用缓存，输入 "y" 以启用即时刷新。

    -   输入 "Y" 以设置本地 DNS 主机。


    安装完成后，这将启动 NextDNS 作为你的系统 DNS 提供商。你可以随时使用以下命令来启动、重启或停止该服务。


    ```

    nextdns start

    nextdns restart

    nextdns stop

    ```


    每次启动计算机时，DNS 服务应保持与上次关机时相同的状态。如果你在 NextDNS 处于激活状态时关闭机器，它应在下次启动时处于激活状态。在第九章中，我们将创建一个脚本，以便于启用和禁用
    NextDNS，这在讨论 VPN 时可能很重要。**如果你的机器无法连接到互联网，请执行 nextdns restart。** 这通常能解决这种情况。


    只要此连接处于活动状态，你的 Linux 设备就会使用 NextDNS 进行所有 DNS 查询，你可以在 NextDNS 门户中查看这些请求的日志。这可能让一些读者感到不安。你门户中的“日志”标签页会识别出从你的设备做出的每一个连接。这可能是一个隐私问题，但它有许多好处。我们现在可以应用过滤器来阻止许多不需要的连接。


    点击“隐私”标签页，并注意自动应用的阻止列表。如果未应用，请添加“NextDNS Ads & Trackers Blocklist”。此数据库阻止超过 100,000
    个与广告、跟踪器和恶意软件相关的连接。这将阻止许多不需要的连接，如弹出式广告、跟踪代码、遥测和用户分析。你现在拥有更强大的保护。下面的图片显示了我的配置和菜单。


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_19_0.png)


    再次点击“日志”标签页并查看流量。你可能需要刷新页面才能看到新结果。我的结果如下所示。


    | 域名/服务器 | 操作/状态 |

    | --- | --- |

    | 🌐 virginia.time.system76.com | 🔒 几秒前 |

    | 🌐 paris.time.system76.com | 🔒 几秒前 |

    | 🌐 oregon.time.system76.com | 🔒 几秒前 |

    | 🌐 ohio.time.system76.com | 🔒 几秒前 |

    | 🌐 brazil.time.system76.com | 🔒 几秒前 |

    | 🌐 2.ubuntu.pool.ntp.org | 🔒 几秒前 |

    | 🌐 api.pop-os.org | 🔒 几秒前 |

    | 🌐 1.ubuntu.pool.ntp.org | 🔒 几秒前 |

    | 🌐 0.ubuntu.pool.ntp.org | 🔒 几秒前 |

    | 🌐 ntp.ubuntu.com | 🔒 几秒前 |


    这看起来可能令人不安，因为除了重启系统外我们什么都没做，而这些多个连接却在传输数据。然而，这是无害的。除了 "apt.pop-os.org" 之外的所有连接都是时间服务器，旨在确保我们的时钟正确同步。"apt"
    连接正在查找可能需要应用的软件更新。这些结果证明过滤正在起作用。NextDNS 正在执行我们的所有 DNS 查询，并过滤它认为恶意或侵入性的任何内容。


    对时间服务器的这些多个查询可能看起来有点过度。五个 System76 时间服务器是默认选项，而 "ntp" 服务器是后备方案。由于 System76 使用加密的网络时间安全（NTS）协议，我更倾向于仅依赖它们。如果你想移除任何选项，你可以通过修改几个系统文件来实现。然而，我们有一个问题。


    我们需要修改的文件是受保护的系统文件。如果我们导航到这些文件并双击打开，我们将处于只读模式，无法修改内容。我们可以使用以下终端命令来“作弊”，该命令以管理权限打开“文件”应用程序（Nautilus）。执行后，系统将提示输入你的
    Linux 密码。


    `sudo nautilus`


    此时你应该看到一个具有管理权限的文件资源管理器。考虑以下步骤。


    -   导航到 "Computer" > "etc" > "chrony" > "sources.d"。

    -   双击名为 "system76-nts.sources" 的文件。

    -   移除任何不需要的服务器，然后点击“保存”。

    -   关闭所有打开的窗口。


    如果你想禁用非加密的 Ubuntu 后备选项，请执行以下操作。


    -   在终端中执行 `sudo nautilus`。

    -   导航到 "Computer" > "etc" > "chrony"。

    -   双击名为 "chrony.conf" 的文件。

    -   删除包含 "ubuntu.pool.ntp.org" 的每行。

    -   将 "pool ntp.ubuntu.com" 更改为 "pool pool.ntp.org" 并点击“保存”。


