    ## VoIP.ms 服务


    几年前，我曾尝试从 VoIP.ms 获取 VoIP 服务。每次我注册账户时，它都会被立即暂停，并且客服人员要求我向他们发送未定向的照片身份证明。我一直拒绝这样做。这让我感到失望，因为
    VoIP.ms 提供了一种独特的方式，可以在语音服务之外获取双向短信通信。2023年7月，我联系了 CEO 并询问了这个问题。他表示，他们目前正在尝试修改其欺诈控制措施，希望能尽量减少因了解你的客户
    (KYC) 监管要求而需要提供身份证明的需求。如今，我拥有一个可用的 VoIP.ms 账户，并鼓励你测试他们的服务。如果你能够获得一个正常运行的账户，我认为你会发现它比之前两个提供商更易于使用。首先，你需要通过注册
    **https://voip.ms/en/invite/Mzc2NjM3** 来拥有一个账户。使用此链接注册后，当你向余额添加 15 美元时，你会获得 10
    美元的免费额度，并且你的新账户受到的审查会少一些。但是，请注意我在此章节开头的所有评论。如果你提供一个使用一次性电子邮件和 CMRA 地址的“约翰·史密斯”（John
    Doe），那么你可以预期账户会被暂停。由于我们将使用这些 VoIP 号码与我们圈子里的人进行通信，作为我们蜂窝号码的替代方案，我没有理由在这个服务中使用别名。7月下旬，该联盟链接的统计数据显示，使用该链接的人中有
    35% 能够开户，而 65% 因身份验证待定而被拒绝（我们看不到任何姓名或其他账户详细信息）。对此我没有解决方案。如果你能够获得服务，请考虑添加一个号码并将其通过以下步骤连接到
    Linphone。


    - 在 web 浏览器中登录你的 VoIP.ms 门户。

    - 导航至 “DID Numbers” > “Order DID(s)”。

    - 选择你期望的国家、州和位置，然后查看号码。

    - 选择你期望的号码和计划（我更喜欢“Per Minute”）。

    - 选择离你较近的服务器，点击“Order DID”，并确认订单。

    - 点击 “Sub Accounts” > “Create Sub Account”。

    - 将用户名修改为你的10位数字（例如：12345_2025551212）。

    - 输入一个强密码。

    - 选择你的 DID 号码作为来电显示，并点击“Create Account”。

    - 导航至 “DID Numbers” > “Manage DID(s)”。

    - 选择你的号码并点击“Edit Selection-All Settings at Once”。

    - 将 “SIP/IAX” 更改为新的 Sub Account。

    - 打开 Linphone 应用。

    - 如果被提示，选择“Use a SIP Account”。如果不存在此选项，点击“Home”按钮并选择“Account Assistant”。

    - 如果被提示，点击关于限制的“I understand”。

    - 输入之前创建的 Sub Account 用户名的“Username”。

    - 输入你的电话号码作为“Display Name”，例如“2025551212”。

    - 输入之前选择的“SIP Domain”，例如“atlanta.voip.ms”。

    - 输入你之前为凭证账户创建的“Password”。

    - 将“Transport”更改为“UDP”。如果这曾经失败，请尝试“TCP”。

    - 点击“Use”。


    现在，你应该能够像之前的教程一样，通过 Linphone 从这个账户进行测试通话，你的语音拨打账户应该像 Twilio 和 Telnyx 一样正常工作。如果你计划只使用
    VoIP.ms 的语音功能，那么你就已经设置好了。然而，短信与其他提供商不同。VoIP.ms 的独特之处在于他们通过自己免费开源的移动应用程序提供真正的双向短信通信。


    如果你使用 VoIP.ms 进行语音通话，并且你是 Android 用户，我推荐 F-Droid 中可用的官方 VoIP.ms 短信应用程序。Apple iOS
    用户应考虑 Groundwire。我在 *Extreme Privacy: Mobile Devices* 数字指南中为每个选项提供了完整的教程。


    如果你更喜欢将所有传入的短信转发到电子邮件地址，请在 VoIP.ms 门户中执行以下操作。


    - 导航至 “DID Numbers” > “Manage DIDs”。

    - 点击你期望号码旁边的“Edit DID”图标。

    - 在“Message Service”部分，选择电子邮件转发选项。

    - 输入你期望的电子邮件地址并应用更改。


    由于我使用移动应用程序通过 VoIP.ms 发送和接收短信，我**不**执行这些任务。你只能选择其中一个选项。如果你更喜欢通过移动设备进行短信通信，VoIP.ms
    及其移动应用程序是最佳选择，正如 *Extreme Privacy: Mobile Devices* 中所述。


    我目前通过所有三种服务维护号码，并将每个都配置到 Linphone 中。如果被迫只依赖一种服务，我会选择 Twilio，因为它的语音信箱选项、整体稳定性以及轻松清理我账户的能力。如果你需要容易的双向移动短信通信，VoIP.ms
    是明确的赢家。如果你有一个 Telnyx 账户并且它对你有效，那就很好。对于每个人来说，没有完美的选项。尽管 Twilio 在创建账户时有自己的障碍，但他们实际上是我获得服务的第一家
    VoIP 公司。预料到所有三个提供商都会出现与欺诈相关的障碍，但要知道你通常可以克服这些暂时的麻烦。许多人询问像 JMP.chat 这样的服务。JMP 也使用
    Twilio 号码，但每月收取 3 美元（是成本的三倍）。我认为没有理由向中间商支付这笔费用，因为你可以用更少的钱购买自己的号码。


    ## VoIP 号码决策


    我在 Twilio、Telnyx 和 VoIP.ms 的账户为我提供了十几个可支配的电话号码。我从未发现自己没有可用的方式来拨打和接打电话及短信。我再提醒你一次，冗余对于这种生活方式至关重要。然而，你到底需要多少个号码？这因人而异。正如下面所述，我的大多数客户只需要两个
    VoIP 号码。


    **个人号码：** 这是你会提供给那些知道你真名的人的号码，以替代提供你的真实蜂窝号码。这可能包括拒绝迁移到安全通信的朋友和家人。它可以是从你之前的蜂窝账户移植过来的号码，也可以是一个拥有全新开始的全新号码。我有一个
    VoIP 号码，它是来自我过去、永远不会拥抱 Signal 或其他安全通信方式的人的默认通信方式。如果我在来电显示服务中搜索那个号码，它会显示我的全名。它很好地发挥了其作用，并保持了我的真实蜂窝号码的隐私。


    **别名号码：** 这是在你不希望与你真名相关的任何情况下使用的号码。这可能是在等待餐厅叫位时提供给餐厅的号码，或者是修理“约翰·史密斯”车辆的机械师使用的号码。它是一个垃圾号码，当公司使用来电显示查询服务在其系统中时，你不想让他们看到你的名字作为所有者时可以使用它。


    我认为除了你真实的蜂窝号码外，两个号码是我们 VoIP 需求的基本要求。然而，如果愿意，你可以做得更多。我的许多客户专门隔离一个 VoIP 号码用于与他们的雇主使用。这防止了同事知道你的个人号码，并允许你在需要时“关闭”而不暂停来自朋友和家人的所有通信。一些客户沉迷于此，拥有超过二十个用于各种目的的号码。我总是建议从小开始，逐步增加。虽然我享受拥有许多号码可支配，但我也为这种奢侈支付了更高的费用。我的许多号码在整个月里从未被使用，但我仍然支付月度费用以获取访问权限。只有在你意识到对它们的具体需求时才添加新号码。


    ## VoIP 接受问题


    VoIP 号码在传入和传出电话方面表现出色。如果你愿意配置选项，它们在转发传入短信方面也可以很好地工作。


    传出短信可能很麻烦。真正的问题发生在一个组织拒绝允许你为服务提供 VoIP 号码时。许多银行要求使用真实的蜂窝电话号码才能使用其在线银行。当你提供 VoIP
    号码时，你很可能被拒绝连接。如果你尝试在创建许多社交网络账户时提供 VoIP 号码，你会被拒绝账户。这是一场持续的斗争。


    如果你有兴趣将你的真实蜂窝号码移植到 VoIP 账户，或转发 VoIP 呼叫到其他号码，请下载我的指南 *Extreme Privacy: Mobile Devices*。


    这里有很多内容需要消化。花时间并确定最适合你的每日通信策略的路径。


