    # LINUX DEVICES PREFACE


    I wrote my first privacy-related book in 2012 titled *Hiding From The Internet*.
    This eventually evolved into the title of *Extreme Privacy*, which is now a large
    517-page textbook in its fourth edition, released in early 2022. In early 2023,
    I began conversations with my staff about the potential for a future fifth edition.
    There was some resistance. We had just released the 550-page *OSINT Techniques*
    textbook and we were all exhausted from the process. The idea of attacking a new
    version of *Extreme Privacy* seemed overwhelming at the time. We threw around
    the idea of a smaller book.


    Many readers of *Extreme Privacy* expressed frustration at the overall amount
    of information presented within one volume. At 320,000 words, it could be overwhelming
    to digest all at once. Other criticism was that readers did not necessarily need
    all of the information within the book. Some wanted to focus on trusts, LLCs,
    and nomad domicile, and did not need all of the technology-themed chapters. Others
    only wanted to learn about secure computers, mobile devices, and other technical
    topics, and did not care about my ideas on an anonymous home or car. This was
    helpful feedback, and impacted the decision to release this digital book. The
    most criticism from *Extreme Privacy* was about the format. My large OSINT and
    Privacy books are only available in print. This has upset many readers who want
    to avoid Amazon or prefer to read on a screen. With this release, and the previous
    *Mobile Devices* eBooks, we are only providing PDFs. There are no official print
    versions and we have eliminated Amazon from the entire publication process. This
    allows us to offer a lower price, and 90% of each purchase directly supports our
    free podcast. If you bought this, thank you for your support!


    We realize that a native PDF will lead to immediate piracy of this work online.
    We accept that. We believe that we can offer further benefits to legitimate purchasers
    by offering free updates when appropriate. If we ever need to modify existing
    content or add entire new sections, we can send an email blast to all purchasers
    which will allow them to download a new copy with all updates for free. Since
    each copy of this work is watermarked with both a visible and hidden unique code,
    we can block updates from those who publish the book without consent. Overall,
    we want to reward those who support us with a searchable, copyable, updatable,
    and printable document, even at the risk of losing half of our sales to the pirates.


    With *Extreme Privacy: Linux Devices*, I continue this new approach to our tutorials.
    It is not a replacement for *Extreme Privacy* (the printed book). Please consider
    it a much more thorough supplement about Linux devices. My hope is that this will
    further continue this series of shorter volumes which each focus on one specific
    topic. This allows people to only purchase the content which they need at a more
    affordable price. It also allows us to publish content more rapidly, as we can
    focus our efforts on one area at a time as needs arise, instead of reserving content
    for a potential future release. Free updates are also a win for everyone. I now
    present our digital guide solely about building the optimal Linux device.'
  - '[PAGE 6]


    # INTRODUCTION


    I began using Linux as my full-time primary operating system a couple of years
    ago. I had dabbled with Linux for decades and relied heavily on it for virtual
    machines within my OSINT books, but I did not commit to it as my daily driver
    until I finally had enough of the privacy invasions forced onto me by Microsoft
    and Apple. Windows and macOS operating systems constantly monitor your usage and
    collect sensitive data about your devices, locations, documents, and overall activities.
    They claim to store this data for your benefit in order to provide a tailored
    computing experience. This is probably true, but what happens when this data is
    leaked, breached, or court-ordered to be given away? What can we do to leave this
    ecosystem of privacy and security risks?


    I believe the answer is Linux. If you are only familiar with macOS or Windows
    environments, I suspect you will be pleasantly surprised by the ease and simplicity
    of using Linux as your computer’s operating system. There will be a learning curve,
    but I promise that anyone reading this guide can make the switch. I believe you
    will prefer Linux after a month of daily usage. You might even find macOS and
    Windows machines difficult to use after completely committing to Linux.


    This book will help you create a machine which does not send any sensitive data
    to Apple, Microsoft, or other providers who abuse this information. We will stop
    them from archiving our activities within the hardware which we have purchased.
    No online accounts will be required in order to use our operating system or download
    applications. We will have full control of our devices and operating systems.
    A name, telephone number, or physical address will never be requested in order
    to use our systems. We will all take our privacy back, while possessing the perfect
    machine for our unique needs.


    This entire book is designed for the reader interested in extreme privacy. I will
    not sugar coat my opinions or offer less-secure options for the sake of convenience.
    I will explain every step and will never make assumptions on the reader’s level
    of technology awareness. This is our entire playbook for every new client’s Linux
    device. It is comprised of our internal client tutorials and staff handbooks,
    with extended details provided by myself. It should allow you to create a perfect
    private and secure Linux device for your needs. I leave nothing out, and include
    many new strategies previously omitted from *Extreme Privacy, 4th Edition*.


    I offer one last vital piece of information before we start. I encourage you to
    generate your own opinions as you read along. You may disagree with me at times,
    which is ideal. That means you are really thinking about how all of this applies
    to you. **If everyone unconditionally agrees with every word I say, then I am
    probably not saying anything interesting. If this book only presents content which
    no one could dispute, then there is no need for this text.** Please read with
    an open mind and willingness to try new things. Let’s begin.'
