    # Creating an Android VM on a Linux Host


    I like to have the ability to launch mobile applications within my Linux host.
    This requires an Android virtual machine, and I believe our best option for this
    is **Android Studio** (developer.android.com/studio). It can be installed within
    Pop!\_Shop. This software is maintained by Google, the maker of Android. It is
    designed for Android developers who need to create and test mobile applications
    within a desktop environment before applying them to actual mobile devices. Android
    Studio is also available on Windows and macOS, but I will only discuss the Linux
    variant here. Once you have it installed, conduct the following.


    +   - Launch Android Studio.

    +   - Do not import any settings but allow any default downloads.

    +   - Choose "Don''t Send" for analytics, then click "Next" in the Welcome Wizard.

    +   - Choose the "Standard" option and click "Next".

    +   - Select your desired appearance and click "Next" twice.

    +   - Click both agreements and accept, then click "Next".

    +   - Click "Finish" and allow the download.


    Android Studio will download numerous items, which may take some time. If you
    receive any download errors, choose the "Retry" option. Once everything has been
    successfully downloaded, click "Finish" and it should launch the new application
    window, and the following should be performed.


    +   - Click "New Project", then "Next" to confirm "Empty Activity".

    +   - Provide a name for your application and click "Finish".

    +   - Allow all additional default downloads and click "Finish".


    The application will navigate to the main developer panel, and you should see
    several downloads continue in the lower right. Allow everything to complete before
    proceeding. You should then see a vertical bar on the right titled "Device Manager".
    Clicking this should present a virtual device, which may be titled similar to
    `Pixel_3a"`. This will likely contain the latest version of Android, but we should
    also explore other options. Click the "Create device" button, as seen in Figure
    8.01. This allows you to select from many virtual Android options. I chose to
    add a Pixel 6 Pro to my available devices, and selected the most recent API level,
    which can also be seen in Figure 8.01.


    Before we launch our first device, we should consider an important adjustment.
    Since Android Studio is targeted toward developers, virtual Android devices launch
    within the developer portal. I prefer my devices to launch within their own window,
    so I make the following configuration change in the "File" > "Settings" menu within
    Android Studio.


    +   - Click on "Tools" then "Emulator".

    +   - Disable "Launch in a tool window" and click "OK".


    Now choose your desired device and click the arrow button to launch. You should
    see a device similar to that in **Figure 8.02**. You are now running a virtual
    version of Android within your desktop environment. If desired, you could follow
    my *Extreme Privacy: Mobile Devices* guide or *OSINT Techniques* book to configure
    a complete Android device.'
