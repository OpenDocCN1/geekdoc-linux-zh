    ## 第五章：应用程序


    Pop!_OS 拥有自己的应用程序安装商店，称为 Pop!_Shop，就像 Ubuntu 拥有 Snap Store 一样。我通常更喜欢直接从软件提供商安装敏感的
    Linux 应用程序，以便我知道我接收到的是官方且更新的内容。然而，我确实使用 Pop!_Shop 来安装和更新大多数通用应用程序。让我们通过一个例子来演练一下。


    ### 密码管理器


    我只推荐能够轻松导出备份以便在其他机器上使用的开源加密密码管理器。我认为本书的每一位读者都应该拥有密码管理器，我推荐两种选项以提供两种独特的体验。我们也将安装两者。


    **离线 - KeePassXC** (keepassxc.org)：如果你想要极致的隐私，并且无法忍受将你的密码存储在云中的想法，无论其加密和安全程度如何，那么离线密码管理器适合你。我使用
    KeePassXC，并确保我有一个良好的备份。


    **在线 - Bitwarden** (bitwarden.com)：如果手动同步你的密码数据库到任何其他设备或备份驱动器这一想法让你想要放弃密码管理器的安全优势，那么
    Bitwarden 是最佳选择。它比 KeePassXC 更容易，并且跨设备保持你的所有密码更新，但它也在技术上将你的密码的加密版本存储在互联网上。这些数据受强加密保护，甚至
    Bitwarden 的员工也无法访问你的数据，但你承担了一点风险。它还可以处理所有软件令牌 2FA，同时自身受到硬件 YubiKey 的保护。我的大多数客户选择
    Bitwarden，而少数极端者选择 KeePassXC。


    KeePassXC 官方网站提供了在多种 Linux 环境中安装其应用程序的十种不同方法。第一种是 AppImage。你可以简单地下载此文件，右键点击，选择属性，勾选“允许将文件执行作为程序”，然后双击进行安装。然而，这不是我首选的方法。我需要经常手动检查更新，因为这个
    AppImage 无法自我更新（而不是允许我的系统应用更新）。


    第二种选择是通过 Flatpak 安装。Flatpak 是用于 Linux 软件部署和包管理的实用工具。它提供了一个沙盒环境，用户可以在其中运行应用软件，使其与系统的其余部分隔离。这对密码管理器来说似乎是一个很棒的选择，但我预见到一个问题。如果我想在
    Firefox 中使用 KeePassXC 浏览器扩展，由于这种安全的隔离，它可能无法连接到 KeePassXC 数据库。让我们继续。


    第三种选择是 Snap 包，但我这台机器上没有 Snap（我也不想要它）。最后，第四种和第五种选项提供了针对 Ubuntu 和 Debian 的解决方案。由于
    Pop!_OS 基于 Ubuntu，而 Ubuntu 基于 Debian，这些应该对我们有效。在继续之前，让我们看看官方 Pop! Shop 中的选项。如果我在
    Pop! Shop 中搜索 *KeePassXC*，我会收到该软件的一个结果（不要与 KeePassX 混淆）。点击该条目会显示一个带有安装选项的菜单。我可以选择默认的
    Flatpak 选项，或者将下拉菜单更改为 Ubuntu（deb）选项。第二个选项应该与通过终端使用以下命令安装相同。


    ```bash

    sudo apt install keepassxc -y

    ```


