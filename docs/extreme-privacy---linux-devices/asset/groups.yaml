    # # CHAPTER FIVE: APPLICATIONS


    Pop!_OS possesses its own application installation store called Pop!_Shop, much
    like Ubuntu has Snap Store. I typically prefer to install sensitive Linux applications
    directly from the software providers so that I know I am receiving official and
    updated content. However, I do use Pop!_Shop for installing and updating most
    general applications. Let’s work through this with an example.


    # **Password Managers**


    I only recommend open-source encrypted password managers which can easily export
    a backup for use on another machine. I believe every reader of this book should
    possess a password manager, and I recommend two options for two unique experiences.
    We will also install both.


    **Offline - KeePassXC** (keepassxc.org): If you want extreme privacy and cannot
    tolerate the idea of storing your passwords in the cloud, regardless of the encryption
    and security, then an offline password manager is appropriate for you. I use KeePassXC
    and make sure I have a good backup.


    **Online - Bitwarden** (bitwarden.com): If the idea of manually synchronizing
    your password database to any other device or backup drive makes you want to give
    up on the security benefits of a password manager, then Bitwarden is the best
    option. It is much easier than KeePassXC and keeps all of your passwords updated
    across devices, but it also technically stores an encrypted version of your passwords
    on the internet. This data is protected with strong encryption and not even Bitwarden
    employees can access your data, but you are presenting a slight risk. It can also
    handle all software token 2FA while itself being protected with a hardware YubiKey.
    Most of my clients choose Bitwarden while a few extremists go with KeePassXC.


    The official KeePassXC website provides ten different ways to install their application
    within various Linux environments. The first is an AppImage. You can simply download
    this file, right-click, select properties, check "Allow executing file as a program",
    then double-click it for installation. However, this is not my preferred method.
    I would need to manually check for updates often since this AppImage cannot auto-update
    itself (instead of allowing my system to apply updates).


    The second option is to install via Flatpak. Flatpak is a utility for software
