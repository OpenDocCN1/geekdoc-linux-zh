    ## VPN Usage and Privacy Implications


    vulnerabilities which could expose more data than intended, but we can discuss
    a few misconceptions about your internet traffic. First, we should tackle SSL/TLS.
    SSL (Secure Sockets Layer) and its successor, TLS (Transport Layer Security),
    are protocols for establishing authenticated and encrypted links between networked
    computers. This is related to the lock icon you see in your browser address bar
    when on any website which begins with "https". This indicates a secure connection,
    but what does that really mean? I will simplify this technology with a couple
    of examples. Assume you are on your home computer connected directly to your internet
    service provider (ISP). You are not using a VPN. You connect to Google and conduct
    a search for "inteltechniques". The response URL presented to you, including the
    search results from the query, is `https://www.google.com/search?q=inteltechniques`.
    Does your Internet Service Provider (ISP) know you conducted a search on Google?
    Yes. Do they know you searched for "inteltechniques"? No. This is because Google
    encrypts the actual search URL. The provider of your internet connectivity can
    only see the domain name being accessed. It cannot see any details about specific
    pages or any credentials entered.


    This is why https versions of websites are so important. Your browser can see
    this entire URL, but it does not directly share any details with your provider.
    Now, let''s introduce a VPN. After connecting to your VPN, such as Proton VPN,
    you conduct the same search. Does your ISP know you conducted a search on Google?
    No. Does your VPN provider know you conducted a search on Google? Yes. Does your
    VPN provider know you searched for "inteltechniques"? No. Why does this matter?
    Everyone has a unique threat model, but I will present a few scenarios where you
    may be concerned.


    First, consider that I am suing you through civil court, and I have convinced
    a judge to grant me a court order to collect your internet activity. Since I know
    where you live, I can assume the provider of your internet service. A court order
    is issued to your ISP for your internet activity. If your ISP logs your traffic,
    which most do, the response would tell me every domain which you visited and the
    dates and times of occurrence. I could use this to prove you were visiting specific
    websites or transmitting large amounts of data to designated services. If you
    had a VPN enabled, I could only prove your device(s) were connected through a
    VPN. I would not know any domains from your activity. A second court order to
    the VPN provider would not reveal this data. Reputable VPNs do not log this traffic,
    and IP addresses are shared between thousands of users.


    Next, assume I want to know where you live. I know your email provider is Gmail,
    and a subpoena to them would reveal your IP address at a specific date and time.
    If this IP address belongs to your internet service provider, a second subpoena
    will disclose the address of service (your home). If the IP address belongs to
    your VPN provider, it will not disclose any details about you or the VPN account.
    A subpoena to the VPN provider for information about the IP address will reveal
    no logs and an explanation about IP address sharing between thousands of strangers.


    Now, let''s combine the strategies mentioned previously to thwart this behavior.
    Since you are always connected to a VPN, your ISP knows nothing about your internet
    traffic. A subpoena to them would not reveal the sites you visit. Since Proton
    Mail does not log your IP addresses in clear text, they cannot determine your
    true IP address. Since Proton VPN and Proton Mail are Swiss-based companies, they
    would not respond to a subpoena from the United States. If you purchased a VPN
    service without providing your true name, there is nothing to glean from the VPN
    provider about your account (such as a personal credit card number or home address).
    I hope you now see that all of these strategies strengthen each other.


    No VPN company is perfect and all expose a potential digital trail. I choose the
    option which is most likely to protect me because it has the most to lose. If
    Proton VPN were caught storing or selling user data, their entire company would
    lose all credibility and many customers. If a company which owns several VPN brands
    gets caught doing this, they can simply shut one down and spin up a new marketing
    campaign for another. I believe Proton VPN has more motive to protect their product
    and reputation than the larger VPN companies.


    **Important Note:** During substantial testing of Proton VPN within various Linux
    environments, I encountered situations where my internet connectivity stopped
    after enabling or disabling the VPN. This was due to a conflict between NextDNS
    and Proton DNS. If this happens to you, the following command within Terminal
    restarts the NextDNS service and should fix the issue. I discuss much more about
    this on the next page.


    ```bash

    nextdns restart

    ```


    ### VPN DNS


    It is important to note that if you are using a VPN application on your computer,
    it will likely ignore any DNS modifications made on your device and use its own
    server. This is acceptable for many situations, but not ideal for everyone. By
    allowing your VPN to secure all traffic and provide all DNS queries, you are placing
    all of your eggs within one basket and no longer benefiting from NextDNS''s filtering.
    You are trusting your VPN provider with the ability to log all of your internet
    history and traffic. This is probably not a huge threat if you are using a trustworthy
    VPN, but we can do better. I will assume you have configured NextDNS as previously
    explained, and modified your browser to use a public NextDNS server. If you take
    no action within the DNS settings of your VPN application, then the following
    applies:


    - When your Linux VPN application is disabled, your entire Linux system is using
    your NextDNS account for all DNS queries with filtering, and Firefox is using
    a public NextDNS server for queries without filtering.

    - When your Linux VPN application is enabled, it is using its own DNS and you
    have no filtering from NextDNS within your operating system, but Firefox is still
    using its own public NextDNS server for queries without filtering.


    If you want to change this you would simply need to restart the NextDNS service
    after connecting to the VPN. The following is my strategy when I need to launch
    and later terminate the Proton VPN application on my Linux device.


    - Launch the VPN.

    - Restart the NextDNS service and conduct my online activity.

    - Terminate the VPN when finished.

    - Restart the NextDNS service.


    If I have my NextDNS service running and I launch my VPN, the VPN starts using
    its own DNS server. In some cases, your entire internet connection might be disabled
    as the two services fight it out. When I restart NextDNS, it overrides the VPN
    DNS server. When I terminate the VPN, it may also terminate any conflicting DNS,
    which is why I restart NextDNS as soon as I close my VPN. In Chapter Nine we will
    create a simple script for this. Let''s recap.


    - I have my NextDNS account configured within my Pop!_OS installation as previously
    explained in Chapter Four. It is the catch-all DNS for all of my apps and the
    system itself. I have filtering enabled.

    - In my Firefox browser, I have the secure DNS option set to "Max" with NextDNS
    as the option. All DNS queries within Firefox will be done through a public server
    without filtering. My Ublock Origin extension will handle the filtering of all
    undesired traffic.

    - I have Proton VPN installed, but I rarely open it. I use a network-wide home
    firewall as explained in Extreme Privacy 4th Edition. This provides me VPN protection
    on my machine without a Linux VPN application, and the ability to assign any DNS
    server within my Linux software.

    - When I am not at home, I launch the Proton VPN application and then restart
    my NextDNS service. My Linux system and all non-Firefox apps will then use this
    DNS and benefit from the filtering service. I also restart the NextDNS service
    after closing the VPN.


    For most, the overall goal is to prevent your ISP from snooping on your traffic.
    All of these situations prevent that, even if you do not change your VPN DNS.
    It is up to you how far to take it.


    ### Tor Browser


    If you follow various privacy-related communities, you will hear many people promote
    the Tor Browser. This Firefox-based browser only connects to the internet via
    the Tor network, which hides your true IP address without a VPN. Since every Tor
    Browser user has the exact same browser configuration, we may not appear as a
    unique user when a website tries to fingerprint us. However, this is not perfect.
    If you are the only Tor Browser visitor to my fictitious clothing website, you
    stick out. Furthermore, many websites block connections from the Tor network altogether.
    If you try to log in to your bank from within Tor, expect to get blocked. Even
    worse, your account may be suspended.


    I only use the Tor Browser for investigations which rely on it in order to access
    a specific website within the Tor network (which usually ends in ".onion"). For
    everything else, I rely on my hardened Firefox, as previously explained. Installing
    Tor Browser within Linux is never straight-forward. Searching Tor within Pop!_Shop
    presents multiple options. At the time of this writing, I found the following
    to work best for Pop!_OS.


    - Open Pop!_Shop and search for "Tor".

    - Select the option titled "Tor Browser Launcher" and install the default option.

    - Launch "Tor Browser" from the "Show Applications" menu.

    - Allow the installation to complete and launch the browser.

    - Enable the "Always connect automatically" option and click "Connect".


    You should now be able to launch Tor Browser any time and begin using the program
    right away. Your web browser is your window to the internet. Please make sure
    you have hardened it to a level appropriate for your needs, but not to the point
    which you have restricted your necessary online activity. Having a hardened version
    of Firefox will provide great privacy from daily inroads into your online behavior
    while Tor Browser will be there for more sensitive tasks.

