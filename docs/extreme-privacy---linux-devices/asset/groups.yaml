    ## 第七章：VoIP 服务


    在将计算机配置得尽可能私密和安全之后，你可能希望利用互联网连接进行传统的电话通话。正如我在之前关于移动设备的数字指南中所解释的，我从不希望依赖与我的移动设备关联的号码来进行日常通讯。因此，我们需要一种方法来拨打和接听标准电话并收发短信，而不使用我们的蜂窝计划。在
    GrapheneOS（移动端）中，我依赖一个名为 Signetice 的应用程序和各类互联网协议语音（VoIP）提供商来进行所有电话通话。桌面 Linux
    系统将依赖一个名为 Linphone 的应用程序，以与这些相同的提供商配合使用。在配置我们的设备之前，让我们先理解为什么我们应该谨慎对待真实蜂窝号码的使用。


    -   当你通过标准蜂窝号码拨打电话和发送短信时，服务提供商会永久存储此活动的日志。这些日志记录了你所有的通讯，并可被员工、政府机构和犯罪分子访问。我亲眼目睹通话和短信日志在刑事和民事审判中作为主要证据被使用。


    -   你的蜂窝电话号码通常被用作你账户的主要标识符。如果我知道你的号码，我就可以利用这一细节获取更多信息，例如移动设备的位置历史。你的蜂窝提供商会根据你连接的蜂窝塔始终存储你的位置。我可以滥用法院命令来获取这些细节，或者雇用一个犯罪分子入侵你的账户。在过去几年里，我们知道赏金猎人仅凭知道蜂窝号码就能实时定位移动设备。无需法院命令。记者多年来一直能够追踪人们的活动。


    -   蜂窝电话号码容易遭受 SIM 卡互换攻击。如果我知道你的主要号码，我可以通过各种手段接管你的账户，并成为该号码的新所有者。我可以冒充你并接收本应发给你的通讯。如果你使用该号码进行双因素认证，我现在就拥有了第二个验证因子。


    -   当你将电话号码提供给朋友和家人时，他们很可能会将其存储在联系人中，并将你的名字与该条目关联。随后，某人可能会下载一个恶意应用，该应用请求访问联系人列表，并将联系人发送到可查询的在线数据库。过去我们已经看到了这种情况，包括像
    TrueCaller 和 Mr. Number 这样的来电识别服务，它们将私人联系人详情共享给了全世界。你是否曾收到来自 LinkedIn 的邮件，邀请你与某人联系？当那个人同意与服务共享他们的联系人（包括电子邮件地址和电话号码）时，这种情况就会发生。Twitter
    也希望从愿意共享这些详情的任何成员那里获取这些信息。只需发生一次，你的蜂窝号码就会公开地与你的真名关联。


    使用 VoIP 号码可以消除这些担忧中的大部分。请考虑以下几点。


    -   VoIP 通话和消息也会在 VoIP 提供商的门户网站中记录。

    -   然而，我们可以更好地控制这些信息，并拥有选项在需要时永久清除内容。

    -   VoIP 通讯不具备蜂窝连接相同的详细位置信息。虽然 VoIP 提供商可能拥有连接的 IP 地址，但没有提供精确 GPS 坐标的蜂窝塔。如果你入侵我的
    VoIP 账户，你将永远无法得知我的真实位置。

    -   如今非法接管蜂窝账户非常简单。可以在一小时内完成。将一个 VoIP 号码转移给另一个提供商可能需要一周多时间，并且对此操作的通知将允许你阻止它。每当我被迫使用电话号码进行双因素认证时，我总是更倾向于使用
    VoIP 号码而非蜂窝账户。

    -   你无法阻止朋友和家人将你的电话号码与滥用应用程序或服务共享。如果他们只知道你的 VoIP 号码，风险就会更低。一旦 VoIP 号码在公开泄露并与你的真名关联，你如愿意可以轻松更换它。如果你拥有多个
    VoIP 号码，你可以将它们隔离用于不同用途。当全世界都知道某个 VoIP 号码属于你时，它无法像蜂窝号码那样被滥用。再次强调，VoIP 号码不能共享你的位置。


    解决所有这些问题的方法就是永远不要使用真实的蜂窝号码。相反，我们将只使用 VoIP 号码进行所有通话和标准短信。在接下来的页面中，我将解释如何配置各种 VoIP
    服务用于电话通话和短信。我的目标是让你创建自己的 VoIP 产品，使你能够以最低成本在新的安全 Linux 设备上拨打和接听电话。此外，这些号码将由你掌控。你将不需要维持对
    Google Voice 账户的访问权限即可享受 VoIP 通话的好处。


    本节内容技术性较强，但任何人都可以复制这些步骤。与所有在线服务一样，这些步骤中的任何一步都可能在不通知的情况下发生变化。在配置过程中，你很可能会遇到与我教程略有不同的变体。请侧重于总体方法，而不是确切步骤。以下内容解释了我为创建自己的
    Twilio VoIP 解决方案所采取的每一个步骤。之后，我提供了其他可能对某些读者更合适的选项。请在做任何决定之前读完整个章节。本章的大部分内容与之前发布的移动和
    macOS 指南中的 VoIP 内容相同。


    在我们深入研究各种选项之前，我们必须稍作停顿，讨论一下域名注册。我鼓励你在继续之前消化下一部分内容。你现在采取的步骤可能会让之后的一切变得更加容易。


