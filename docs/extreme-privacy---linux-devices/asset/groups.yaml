    ## VLC


    Pop!_OS 不包含任何强大的媒体播放器。如果你经常会遇到各种音频和视频文件，我强烈建议从 Pop!_Shop 安装 VLC。


    ## 办公


    Pop!_OS 包含 LibreOffice 应用程序套件，用于文字处理、电子表格和演示文稿。不过，我更喜欢用 ONLYOFFICE 来完成这些任务。它可以安全地从
    Pop!_Shop 安装。


    ## BleachBit 清理工具


    使用一段时间后，你的 Linux 设备很可能会充斥着旧的缓存文件、残留数据和其他不必要的文件。我建议每周运行一次 BleachBit 以保持系统整洁。我倾向于使用
    Pop!_Shop（Flatpak）中的“BleachBit（以 root 身份运行）”选项。首次启动时，我接受默认配置。然后我选择所有选项，除了“释放磁盘空间”（"Free
    Disk Space"），并点击“清理”（"Clean"）。在本书的这个阶段，由于我使用的是新机器，我成功释放了 1.02 GB 的数据。


    ## 实用工具


    我喜欢在任何 Linux 发行版中添加一些系统实用工具，包括用于 RSS 的 GNOME Feeds、用于播客的 GNOME Podcasts，以及用于清理文件中个人信息的
    Metadata Cleaner。这些工具都可以通过 Pop!_Shop 使用默认选项安装。为了让 Metadata Cleaner 正常工作，你还需要一个名为
    mat2 的工具，可以通过终端使用以下命令安装：


    ```

    sudo apt install mat2 -y

    ```


    重启后，你可以右键点击任何可能包含隐藏元数据的图片、视频或其他文件，并清理其内容。这会在原文件旁边生成一个新文件，文件名中会添加“clean”。


    ## 虚拟货币


    如果你需要访问虚拟货币，我总是推荐使用基于软件的离线钱包，而不需要第三方交易所。我使用 Electrum 处理比特币，使用 Monero GUI 钱包处理门罗币。虽然你可以在
    Pop!_Shop 或其他软件仓库中找到这些程序，但我建议仅从它们的原始来源直接安装。我从位于 https://electrum.org/#download
    的官方 Electrum 网站获取 AppImage 文件，然后右键点击该文件使用 AppImageLauncher 进行安装。接着，我从位于 https://web.getmonero.org/downloads
    的官方网站下载压缩的 Linux 64 位文件，解压后右键点击 Monero AppImage 文件以完成安装过程。


    ## 应用程序更新


    你应该保持新安装软件的更新。Pop!_Shop 中的“已安装”（"Installed"）标签页允许你修补操作系统以及任何 Flatpak/Deb 程序，但它不会更新所有单独的应用程序。我在本地笔记应用中数字备好了以下命令，以便轻松复制和粘贴，但后续章节将介绍一个自定义脚本，自动执行所有这些命令。


    ```

    sudo apt update

    sudo apt upgrade -y

    sudo apt full-upgrade -y

    pop-upgrade release upgrade

    sudo apt autoremove -y

    sudo apt autoclean -y

    flatpak update -y

    ```


    现在，你应该拥有一台稳定、安全、私密、已更新、已清理并包含日常使用基本应用程序的 Linux 电脑。虽然还有更多事情要做，但你已经完成了**步骤**。当我们稍后在书中创建自定义维护脚本时，我们将添加更多命令，以确保系统保持整洁。


    尽管大多数人依赖这些应用程序提供商来存储加密数据，但极度注重隐私的人可能会考虑自托管作为一种选择。这个话题超出了本指南的范围，但网上有充足的信息可以帮助自托管
    Bitwarden、EteSync、Standard Notes 等。接下来，我们必须处理系统中最重要的程序：网络浏览器。


    ## DNS 条目


    这是一个回顾你的 NextDNS 门户并检查日志的好时机。我喜欢启动每个程序一次然后关闭，再查看 NextDNS 中建立了哪些类型的连接。在我的机器上，损害相当轻微，如下面图片（顶部）所示。Thunderbird
    是最大的问题，因为它与其自己的服务器同步。这并不是恶意的，但如果愿意，你可以阻止这些请求。Standard Notes 连接到其自己的服务器进行数据同步，所以没有危害。如果你担心
    ONLYOFFICE 向服务器发送数据，你可以在 NextDNS 中阻止整个域名。这将允许程序完全离线使用。我进行了此更改（第二张图片），在下次启动时连接被阻止（第三张图片）。


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_32_0.png)


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_33_0.png)


    接下来，我们必须考虑适当的网络浏览器配置和使用方法。


    # 第六章：网络浏览器


    在考虑连接各种网站以充分利用我们的新 Linux 构建之前，我们应该正确配置网络浏览器。对于日常浏览，我推荐使用 Firefox 网络浏览器，并有限地使用其他浏览器完成特定任务。Firefox
    已包含在大多数 Linux 发行版中，且默认安装的 Pop!_OS 版 Firefox 是**首选**的，满足我们的需求。启动 Firefox 并考虑以下修改：


    - 点击右上角的 Firefox 菜单，选择“设置”（"Settings"）。

    - 在“常规”（"General"）选项中，取消勾选“浏览时推荐扩展”（"Recommend extensions as you browse"）和“浏览时推荐功能”（"Recommend
    features as you browse"）。这防止部分互联网使用信息发送给 Firefox。

    - 在“主页”（"Home"）选项中，将“主页和新窗口”（"Homepage and new windows"）和“新标签页”（"New tabs"）更改为“空白页”（"Blank
    page"）。这防止 Firefox 加载其默认页面。

    - 禁用所有“Firefox 主页内容”（"Firefox Home Content"）选项。

    - 在搜索选项中，将默认搜索引擎更改为 DuckDuckGo，并取消勾选“提供搜索建议”（"Provide search suggestions"）下的所有选项。这防止查询直接发送到
    Google，并阻止 Google API 提供搜索建议。

    - 点击“隐私与安全性”（"Privacy & Security"）菜单选项，选择“严格”（"Strict"）保护。

    - 勾选标题为“Firefox 关闭时删除 cookie 和站点数据”（"Delete cookies and site data when Firefox
    is closed"）的复选框。

    - 取消勾选标题为“显示有关密码泄露网站的警报”（"Show alerts about passwords for breached websites"）的复选框。

    - 取消勾选标题为“建议并生成强密码”（"Suggest and generate strong passwords"）的复选框。

    - 取消勾选标题为“自动填充登录和密码”（"Autofill logins and passwords"）的复选框。

    - 取消勾选标题为“询问是否保存网站的登录和密码”（"Ask to save logins and passwords for websites"）的复选框。

    - 取消勾选标题为“自动填充地址”（"Autofill addresses"）的复选框。

    - 取消勾选标题为“自动填充信用卡”（"Autofill credit cards"）的复选框。

    - 将历史记录设置更改为“Firefox 将使用自定义历史记录设置”（"Firefox will use custom settings for history"）。

    - 取消勾选“记住浏览和下载历史”（"Remember browsing and download history"）和“记住搜索和表单历史”（"Remember
    search and form history"）。

    - 勾选标题为“Firefox 关闭时清除历史”（"Clear history when Firefox closes"）的复选框。不要勾选标题为“始终使用隐私浏览模式”（"Always
    use private browsing mode"）的复选框，因为这会破坏 Firefox 容器。

    - 从“地址栏”（"Address Bar"）菜单中取消勾选“浏览历史”（"Browsing history"）。

    - 在权限菜单中，点击位置、相机、通知和虚拟现实旁边的“设置”。勾选每个选项中标题为“阻止新请求...”（"Block new requests..."）的复选框。如果你在此浏览器中永远不需要音频通信，你可以对麦克风执行相同操作。

    - 取消勾选“Firefox 数据收集和用途”（"Firefox Data Collection and Use"）下的所有选项。

    - 取消勾选“欺骗性内容和危险软件保护”（"Deceptive Content and Dangerous Software Protection"）下的所有选项。这将防止
    Firefox 向第三方服务共享潜在的恶意网站访问。

    - 选择“在所有窗口中启用仅限 HTTPS 模式”（"Enable HTTPS-Only Mode in all windows"）。


    这些设置是我所说的基础设置，对大多数读者可能已经足够。在这里，我想偏离之前的写法。在本次出版之前，我通常介绍几个可以在 Firefox "about:config"
    菜单中修改的设置。我不再推荐这样做，这可能会让一些隐私狂热者不满。在放弃这一章节之前，请考虑我的理由。我此前建议的目的主要是为了防止浏览器指纹识别或画布识别。这种行为常被在线网站滥用，以跟踪你在互联网上的导航。如果我拥有一个服装网站，并且能从你的浏览器收集众多标识符，你就与其他所有访问过我网站的人不同。当你一周后回来时，我知道你是同一个用户，并可以继续跟踪你在我的网站内的活动。


    以前，我建议读者更改各种设置，例如网站知道您当前电池电量的能力，以便在窥探你连接的恶意系统眼中让你显得不那么独特。如今，得益于指纹识别技术的进步，我认为这些设置可能弊大于利。如果你是该站点唯一禁用此设置的访客，你在系统中会显得比什么都没做时更加独特。


    冒着冒犯一些读者的风险，我坚信以下陈述。我们再也无法通过对浏览器进行修改来战胜现代浏览器指纹识别了。我们做出的任何更改，或添加的任何扩展，几乎总是在复杂的指纹识别系统眼中使我们成为独特的访客。你采取越多行动融入人群，你就可能越显眼。虽然存在例外，但对于一般使用而言，网站将继续跟踪我们。它们还会随时收集我们的
    IP 地址、已安装的字体、视频特征、位置指标和浏览器规格。这一点永远不会改变。


    此外，当前推荐的许多 about:config Firefox 隐私调整会破坏其他所需功能。如果你试图通过 WebRTC 阻止所有可能的 IP 地址泄露，你很可能会破坏在浏览器中使用语音和视频会议的能力。保护与功能之间必须保持平衡。


    使用 VPN（稍后解释）以及之前的 Firefox 设置可以阻止大多数入侵。由于 Firefox 不在一个域名之间共享 cookie，我们默认拥有强大的隐私。如果你想要纯粹的匿名，那就离开互联网。如果你需要尽可能多的保护，请考虑稍后介绍的
    Tor 浏览器。


    接下来，我将讨论大量有用的浏览器扩展，称为附加组件。


    我在每台电脑上安装的首要必要附加组件是 uBlock Origin。它默认阻止许多广告和跟踪脚本，但还可以阻止页面上尝试运行的任何其他类型的脚本。这有助于防止跟踪、恶意代码执行、位置共享以及可能损害你隐私和安全的许多其他过程。


    此附加组件完全免费且开源。它高度可定制，同时保持相对易用。uBlock Origin 根据阻止列表中指定的跟踪器的黑名单工作。该附加组件预启用了一些列表，但可以通过偏好设置中的简单复选框添加更多列表。请记住，你启用的黑名单越多，在浏览器内工作可能会越困难。这一部分一开始可能看起来有点令人不知所措，但尝试高级设置应有助于你理解其功能。


    我此前推荐过 NoScript、Adblock Plus、Privacy Badger 和 Disconnect 作为隐私附加组件，以帮助阻止不必要的广告、跟踪和分析。这些组件不再存在于我的任何系统中。现在我只使用
    uBlock Origin，因为它取代了所有这些选项。让我们从基础知识开始。

    '
