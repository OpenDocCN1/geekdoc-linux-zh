    ## 第十章：更新与维护


    我希望你现在已为你的需求专门配置了理想的 Linux 设备。接下来，你需要确保保持这种状态。我鼓励你制定一套最适合你的 Linux 维护时间表。我的习惯是在星期五下午，即我的数字工作周结束时，执行所有计算机维护任务。恰好我在
    2023 年 7 月 21 日星期五撰写这一章。这使得记录我的整个流程变得轻而易举。当我能够关闭计算机而不中断任何待办工作时，我通常会每周采取以下操作一次。


    首先，我打开维护脚本并快速启动选项 7。这将应用所有 Apt、Pop!_OS 和 Flatpak 更新，并删除这些更新中不必要的项。然后，我启动 Pop!_Shop，仅为了确保没有脚本可能遗漏的待处理更新。接下来，我检查“设置”>“系统升级与恢复”中的任何额外更新。我以
    root 身份运行 BleachBit 并清理除“释放磁盘空间”以外的所有内容。最后，我重启机器。


    一旦我的计算机完全更新、清理并重启后，我喜欢进行一次完整备份。不需要付费程序。相反，我依赖一个名为 FreeFileSync 的免费且开源的程序，该程序在
    Pop!_Shop 中可用。该程序可用于同步任意两个文件夹，但我们只关注主目录。首先，我们需要格式化外部驱动器。我强烈推荐使用外部 USB SSD，例如 SanDisk
    Extreme 系列驱动器。如果你有一个 1 TB 或更小的内部驱动器，82 美元的 SanDisk 1 TB Extreme 便携 SSD（[https://amzn.to/42S7x7M](https://amzn.to/42S7x7M)）将非常适用。更大的内部驱动器需要更大的外部设备。这些驱动器的更昂贵的“专业版”版本对我们的目的不会提供太大益处。我按照以下步骤专门格式化我的外部
    SSD 用于备份。


    - 在 Pop!_OS 中，启动“文件”并右键点击你的外部驱动器。

    - 选择“格式化”并提供名称，例如“Backup”。

    - 如果你只会在 Linux 上使用它，请选择“仅限 Linux 系统使用的内部磁盘 (Ext4)”。

    - 如果你想加密驱动器，请选择“密码保护卷”选项。

    - 点击“下一步”，如果提示请输入安全的密码。

    - 点击“下一步”直到你到达“格式化”选项并点击它。


    如果你加密了驱动器（我推荐这样做），该过程需要一些时间才能完成。每次将驱动器插入你的机器时，你都需要用密码解锁它。现在，让我们在 FreeFileSync
    中进行第一次备份。


    - 关闭任何弹出窗口，并点击左侧“拖放”区域中的“浏览”。

    - 在左侧菜单中点击你的主文件夹，通常用房子图标标识。

    - 点击“打开”按钮，然后点击右侧“拖放”区域中的“浏览”。

    - 选择你的外部硬盘并点击“创建文件夹”。

    - 在你的 USB 磁盘上创建一个名为“backup”的文件夹，按回车键，然后点击“打开”。

    - 点击“同步”附近绿色齿轮旁边的右箭头图标。

    - 将选项更改为“镜像”。


    镜像选项确保外部驱动器上的数据始终是计算机上内容的精确副本。如果你的系统名称是“pop”，外部驱动器标签为“backup”，你的界面可能看起来与我下面展示的类似。你可以使用“另存为”图标保存此配置，并将其命名为“Home
    Backup”。


    ![](img/451a8c416cafc58e46802d06b4bc7b1a_88_0.png)


    接下来，点击“比较”并允许分析。你可能会收到警告，说 FreeFileSync 正试图访问你的桌面、下载和其他文件夹，但对于此目的是可以接受的。你也可能会收到关于某些区域对程序不可访问的警告。发生这种情况时，我会点击“全部忽略”。完成后，你应该会看到所有将同步的文件摘要。点击“同步”按钮开始备份过程，第一次运行可能需要一些时间。


    下次你需要备份数据时，你可以连接你的驱动器；输入密码解锁加密；打开 FreeFileSync；并再次选择“比较”按钮。这次，你应该只会看到自上次备份以来已修改的文件。然后，同步过程应该会快得多。


    备份完成后，我打开我的邮件客户端，并将所有邮件从我的提供商处获取到我的机器上。我特意不在备份之前这样做。万一我从提供商服务器中删除了一封重要邮件，这也会删除我机器上的离线副本，我知道我之前的备份包含上周存在的所有邮件。这虽然是个小问题，但过去曾帮我避免过麻烦。


    如果条件允许，我现在会关闭机器，看看我能度过周末而不重启它多久。有些周末比其他周末更好。周一早上，我知道我有一台整洁、干净且已更新的 Linux 机器，准备迎接新一周的工作。


