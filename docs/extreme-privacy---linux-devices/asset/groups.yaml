    # ABOUT THE AUTHOR: MICHAEL BAZZELL


    Michael Bazzell investigated computer crimes on behalf of the government for over
    20 years. During the majority of that time, he was assigned to the FBI''s Cyber
    Crimes Task Force where he focused on various online investigations and Open Source
    Intelligence (OSINT) collection. As an investigator and sworn federal officer
    through the U.S. Marshals Service, he was involved in numerous major criminal
    investigations including online child solicitation, child abduction, kidnapping,
    cold-case homicide, terrorist threats, and advanced computer intrusions. He has
    trained thousands of individuals in the use of his investigative techniques and
    privacy control strategies.


    After leaving government work, he served as the technical advisor for the first
    season of the television hacker drama *Mr. Robot*. His books *OSINT Techniques*
    and *Extreme Privacy* are used by several government and private organizations
    as training manuals for intelligence gathering and privacy hardening. He now hosts
    the *Privacy, Security, and OSINT Show*, and assists individual clients in achieving
    ultimate privacy, both proactively and as a response to an undesired situation.
    More details about his services can be found at *IntelTechniques.com*.'
