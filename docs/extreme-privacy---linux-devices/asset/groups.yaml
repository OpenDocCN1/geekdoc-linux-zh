  - "[PAGE 54]\n\n+   * Click \"Pin to Sidebar\".\n\n+   * Click the \"+\" to create\
    \ a new TwiML Bin.\n\n+   * Provide a \"Friendly\" name of \"incomingvoice\".\n\
    \n+   * Place the following text in the TwiML box. Replace \"2025551212\" with\
    \ your number.\n\n```\n\"<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<Response>\n\
    \  <Dial answerOnBridge=\"true\">\n    <Sip>2025551212@2025551212.sip.us1.twilio.com</Sip>\n\
    \  </Dial>\n</Response>\"\n```\n\n+   * Click \"Create\" and \"Save\".\n\n+  \
    \ * Click \"Phone Numbers\" > \"Manage\" > \"Active Numbers\" in the left menu.\n\
    \n+   * Click your telephone number.\n\n+   * Under \"Voice & Fax\", then \"A\
    \ Call Comes In\", choose \"TwiML Bin\".\n\n+   * Select \"incomingvoice\" in\
    \ the drop-down menu and click \"Save\".\n\n+   * Click \"TwiML Bins\" > \"My\
    \ TwiML Bins\" in the left menu.\n\n+   * Click the plus sign to create a new\
    \ bin.\n\n+   * Provide a \"Friendly\" name of \"outgoingvoice\".\n\n+   * Place\
    \ the following text in the TwiML box.\n\n```\n\"<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<Response>\n  <Dial answerOnBridge=\"true\" callerId=\"{{#e164}}{{From}}\
    \ {{/e164}}\">\n    {{#e164}}{{To}}{{/e164}}\n  </Dial>\n</Response>\"\n```\n\n\
    +   * Click \"Create\" and \"Save\".\n\n+   * Click \"Voice\" > \"Manage\" > \"\
    SIP Domains\" in the menu.\n\n+   * Select your domain.\n\n+   * Under \"Call\
    \ Control Configuration\" > \"A Call Comes In\", change \"Webhook\" to \"TwiML\
    \ Bin\" and select \"outgoingvoice\" in the drop-down menu.\n\n+   * Click \"\
    Save\".\n\nYou may have noticed a warning about an emergency call fee of $75.\
    \ This is to entice you to associate your physical home address with your account,\
    \ and pay a monthly fee for the privilege. This is not required. However, any\
    \ calls to 911 from this VoIP number may generate a $75 fee from Twilio for some\
    \ reason. I would never call 911 from these numbers. If there is a true emergency,\
    \ I would just use the cellular connection through the dialer app on my device.\
    \ This will disclose my true cellular number to the operator, but privacy should\
    \ never be a priority during an emergency. You are now ready to receive and generate\
    \ calls with your new number. You cannot do this through Twilio's website, as\
    \ you will need software designed for this purpose, as explained next.\n\n# **Twilio\
    \ Linphone Configuration**\n\nYou now have a SIP domain and credentials created\
    \ which allow you to associate your Twilio account with VoIP software called **Linphone**\
    \ (linphone.org), which can be installed from within Pop! Shop. The following\
    \ configuration steps should apply to all Linphone applications, but you may see\
    \ minor variations across platforms. You will need to repeat each step on every\
    \ Linux device which you want to use for VoIP calling. Launch Linphone and conduct\
    \ the following."
