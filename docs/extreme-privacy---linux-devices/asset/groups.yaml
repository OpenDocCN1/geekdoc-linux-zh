    "about:config" menu. I no longer recommend this, which may upset some privacy
    fanatics. Please consider my reasons before abandoning this chapter. The purpose
    of my previous recommendations was mostly to prevent browser fingerprinting or
    canvasing. This activity is often abused by online sites which try to track you
    as you navigate the internet. If I own a clothing website and I can collect numerous
    identifiers from your browser, you are unique from everyone else who has ever
    visited my site. When you come back a week later, I know you are the same user,
    and I can continue to track your activity within my site.


    Previously, I had recommended readers change various settings, such as the ability
    for a website to know your current battery level, in order to make you appear
    less unique to the malicious systems snooping on your connection. Today, thanks
    to advancements in fingerprinting technology, I believe those settings could do
    more harm than good. If you are the only visitor on that site which disabled this
    setting, you now appear even more unique than if you had done nothing.


    At the risk of offending some readers, I firmly believe the following statement.
    We can no longer defeat modern browser fingerprinting by making modifications
    to our browsers. Anything we change, or any extension we add, almost always makes
    us a unique visitor in the eyes of sophisticated fingerprinting systems. The more
    actions you take to blend into the crowd likely makes you stick out more. There
    are exceptions to this, but for general usage, sites will continue to track us.
    They will also collect our IP addresses, installed fonts, video characteristics,
    location metrics, and browser specifications at all times. That will never change.


    Furthermore, many of the current recommended about:config Firefox privacy tweaks
    break other desired functions. If you try to block all possible IP address leakage
    via WebRTC, you will likely also break the ability to use voice and video conferencing
    within your browser. There must be a balance of protections versus functionality.


    Using a VPN, as explained later, and the previous Firefox settings stop most invasions.
    Since Firefox does not share cookies from one domain with another, we have strong
    privacy by default. If you want pure anonymity, stay off the internet. If you
    need the most protection possible, consider the Tor Browser, as explained later.


    Next, I will discuss the abundance of helpful browser extensions called add-ons.


    The first vital add-on I install on every computer is uBlock Origin. It blocks
    many ads and tracking scripts by default, but it also can block any other type
    of script that is attempting to run on a page. This helps prevent tracking, malicious
    code execution, location sharing, and a number of other processes that could undermine
    your privacy and security.


    This add-on is completely free and open source. It is highly customizable, while
    remaining relatively easy to work with. uBlock Origin works from blacklists which
    block trackers specified in the list(s). The add-on comes with several lists enabled,
    but there are several more that can be added through simple checkboxes in the
    preferences. Keep in mind that the more blacklists you enable, it may be more
    difficult to work within the browser. This section may seem a bit overwhelming
    at first, but experimenting with the advanced settings should help you understand
    the functionality.


    I have previously recommended NoScript, Adblock Plus, Privacy Badger, and Disconnect
    as privacy add-ons that would help stop unwanted ads, tracking, and analytics.
    These are no longer present on any of my systems. I now only use uBlock Origin,
    as it replaces all of these options. Let''s start with the basics.'
