  mdcn: '

    英特尔 ME 和 AMD 的对应选项 AMD 安全技术（AMD ST）的合法用途是允许设备在低功耗状态下进行管理。大型计算机网络的管理员可以利用这项技术来远程控制网络中计算机的许多方面。担忧的产生是因为英特尔
    ME 对设备所有方面具有控制权，这些功能背后的闭源代码的整体保密性，以及自 2017 年以来已报告的几个已知漏洞。


    让我们进行一次现实检查。英特尔 ME 和 AMD ST 并不是监控机器上输入的所有内容，也不是允许陌生人在远程访问你的屏幕。这需要在你设备及其连接的网络上进行大量的配置。你可能永远不会在使用启用了英特尔
    ME 的芯片时遇到任何问题。我的担忧是任何新的未披露的漏洞可能被犯罪分子滥用。这提出了我对我的 Linux 设备的第一个要求。我希望机器禁用英特尔 ME。


    你很可能永远找不到一台完全从处理器中移除所有英特尔 ME 痕迹的计算机。然而，有一个活跃的个人和公司社区一直在努力最小化系统中允许运行的英特尔 ME 进程。默认禁用英特尔
    ME 的基于 Linux 机器最活跃的供应商是 System76 (system76.com)。


    一家名为 Purism 的公司之前曾提供没有英特尔 ME 的笔记本电脑，但我强烈建议避免购买 Purism 的产品。他们仍然在试图履行多年前购买的基于 Linux
    手机订单。在某些情况下，人们已经等待五年他们的设备才能发货，同时被客服忽视。他们拒绝为未发货的商品退款。请避开他们。


    System76 只销售面向 Linux 用户并随附 Linux 系统的设备。我下了几台定制机器的订单，它们第二天就从科罗拉多州发货。他们的大多数笔记本电脑默认禁用英特尔
    ME。


    我更喜欢 System76 而不是其他供应商的第二个原因是他们使用称为 Coreboot 的开源固件。该软件替换了大多数主板中包含的专有代码。它通常更快、更安全。更重要的是，它移除了可能在硬件层面做坏事的隐藏闭源代码。


    希望你已经决定你也希望拥有禁用英特尔 ME 并用 Coreboot 替代标准固件的机器。这意味着你需要一台来自 System76 的基于 Intel 的机器。听起来很简单，对吧？你仍然有很多选择。


    System76 目前提供九种不同的笔记本电脑型号和四种台式机变种。


    让我们从笔记本电脑与台式机的讨论开始。我有一台 System76 Thelio 台式电脑，用于所有数据泄露工作。我更喜欢台式机，因为我可以轻松扩展存储，并允许台式机在我离开时完成耗时任务。我也喜欢那种离开电脑的感觉，而不是始终让笔记本电脑在伸手可及的范围内。然而，我通常不向大多数人推荐台式机。笔记本电脑是便携的，并包含屏幕、键盘和触控板。它们也更常见，适合我的大多数客户。如果你需要台式机，你知道你的原因，不需要我的意见。


    如果你看着 System76 的九款笔记本电脑感到困惑，你并不孤单。在我决定购买自己的机器之前，我花了几个小时消化所有选项。由于我们只能在基于 Intel
    的设备上拥有 Coreboot 和禁用的英特尔 ME，这排除了搭载 AMD 芯片的 Pangolin。这给我们留下了八个选项。


    Gazelle、Adder、Oryx、Serval 和 Bonobo 笔记本电脑是极其强大的机器，面向需要 4K 屏幕（最大 17 英寸）、独立显卡和顶级处理器的人。如果你整天处理
    HD 视频或需要高端游戏机器，这些适合你。然而，它们不适合我或我的客户。这给我们留下了三个选择。


    Galago Pro、Lemur Pro 和 Darter Pro 都能满足我们的需求。最终用户需要查看它们并决定哪个是最合适的。Galago Pro 只有五小时的电池续航，Lemur
    Pro 没有以太网端口。这就是为什么 Darter Pro 是我当前的笔记本电脑，也是我经常发给我的客户的设备。它拥有更大的 15 英寸屏幕，USB-A 和
    USB-C 端口，microSD 卡槽，以及九小时的电池。我也更喜欢 Darter Pro 的键盘，它右侧包含数字小键盘，但有些人可能不喜欢略微向左移位的标准键盘。


    如果你想要更便携（且轻得多）的 14 英寸屏幕设备，我更喜欢 Lemur Pro，但请注意，如果你对以太网端口很重要，它没有该端口。接下来是规格。在撰写本文时，我选择了以下选项。


    - **处理器：** 我选择了默认的 Intel i5 1340p 处理器，我认为这对于日常任务绰绰有余。升级到 i7 需要多支付 200 多美元，大多数用户永远不会充分利用额外的马力。如果你知道你将执行受益于此升级的密集型处理任务，它可能值得。如果你大部分时间都在浏览器中度过，你不会看到任何改进。这与我在
    macOS 指南中的建议相矛盾，在那里我鼓励用户使用更高的规格。这是因为 macOS 机器无法升级，我们希望尽可能好地保护未来兼容性。


    - **内存：** 默认的 8 GB 内存低于我的需求。由于我经常打开虚拟机，我认为 16 GB 内存更合适。


    - **操作系统驱动器：** 默认的 250 GB 磁盘空间可能对大多数人来说够用了，但我发现它有限制。我还发现默认驱动器的 3,300 MB/s 读取速度并不理想。我更喜欢将尺寸增加到
    1 TB，并使用 PCIe Gen4 驱动器将速度提高到 7,000 MB/s。如果你曾经需要处理大量数据，你会感激这个升级。尺寸增加 4 倍，速度增加 2
    倍，仅多花 115 美元。


    我的定制配置总价为 1,259.00 美元。同等配置的苹果笔记本电脑将是这个价格的两倍。我想强调，我选择的笔记本电脑可能与你不同。没有完美的机器。做你自己的研究，找到适合你的型号。观看在线评测视频，以了解任何设备的现实表现。Galago
    Pro、Lemur Pro 和 Darter Pro 都包含 Coreboot 和禁用的英特尔 ME，并且非常便携。所有 System76 计算机都有选择随附
    Ubuntu 或 Pop!_OS 的选项，如下所述。


    我相信一些读者在质疑我对 System76 产品的热情。为了完全的透明度，我没有从 System76 获得任何报酬来推广本书中的产品。我购买了自己的机器，我并不是
    System76 的附属人员。我从任何过去或未来的订单中都没有收到回扣。事实上，我很难让他们的新闻团队回应我多次请求，询问是否允许在这个指南中使用他们的商标名称。


    # 第三章：操作系统配置


    我将假设你现在已经确定了开始 Linux 之旅的方式。无论你决定用旧电脑测试，在虚拟机中玩耍，还是用全新的笔记本电脑投身 Linux 世界，整章（以及本书的其余部分）都适用于你。我们接下来的讨论是关于哪种
    Linux 版本最适合你的需求。这里我总是看到激烈的辩论。提供 Linux 变体的偏好类似于声明哪种宗教最好。有许多坚定的 Linux 狂热者，无论我走哪条路都会斥责我。让我们撕掉这个创可贴，直接进入主题。我对
    Linux 安装的首选是 **Pop!_OS**。好了，我说了。我知道你们中的许多人现在正在对我大喊大叫。在你磨利你的草叉之前，请允许我解释其他一些流行的选项，以及我选择
    **Pop!_OS** 作为日常笔记本电脑的原因。


    - **Qubes OS**：每当我在我的节目中提到 Linux 时，许多人写信告诉我应该推荐 Qubes OS。Qubes OS 是一个以安全为重点的 Linux
    操作系统，旨在通过虚拟化隔离提供安全。它允许你在自己隔离的虚拟机中启动每个应用程序。这相当令人印象深刻，极其安全。然而，它也可能很烦人。从 macOS 或
    Windows 到 Qubes OS 的学习曲线更陡峭，日常使用可能很棘手。我有一次尝试使用 Qubes OS 30 天，但在试图执行日常任务时因大量挫折而失败。如果你全职使用
    Qubes OS，我尊重你。对大多数人来说，我认为这有点过头，更可能让他们回到更容易的传统系统。


    - **Kali**：许多人提倡使用名为 Kali 的 Linux 构建，它预载了众多与安全相关的工具。然而，Kali 旨在作为虚拟机运行，我认为它永远不应该用于个人使用。


    - **TAILS**：整个 TAILS 操作系统依赖于 Tor 网络以增强在线匿名性。然而，它不是作为宿主设计的。它设计为从外部驱动器启动，在会话关闭后不会在计算机上留下痕迹。与
    Kali 类似，它不旨在作为日常驱动程序宿主使用。


    - **Debian**：Debian 设计用作宿主，并提供非常极简的软件体验。我认为 Debian 对于拥有大量 Linux 经验的人来说是一个很好的选择。我使用过一段时间，但遇到了驱动程序问题和偶尔的软件冲突。在之前的选项中，它是我们最接近完全功能
    Linux 宿主操作系统的选项。


    - **Ubuntu**：这可能是最熟悉的选择，因为它是最受欢迎的 Linux 发行版之一。它是一个极好的入门操作系统，因为它通常在启动时就能正常工作。它有自己应用程序商店，许多软件开发者提供在线步骤以使他们的应用程序在
    Ubuntu 上工作。我推荐将 Ubuntu 用于 OSINT 虚拟机，如我在《OSINT 技术》书中所述，多年来它一直运行得很好。然而，有一些小事困扰我。首先，Ubuntu
    推动你使用他们自己的 Snap 软件安装，并想方设法禁止你使用更传统的安装流程。传闻 Ubuntu 在 2024 年中完全放弃 Snap 选项，但我们目前只能忍受。他们还包含一些次要的遥测数据，需要禁用。我认为
    Ubuntu 和一个名为 Mint 的变体都可以作为任何人的日常 Linux 驱动程序，但我相信我们有更好的选择。

    '
