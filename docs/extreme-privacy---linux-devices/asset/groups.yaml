    If choosing the ARM version, make sure you do not accidentally select the AMD
    version. Let’s talk about these versions a bit more before we proceed. The Pop!_OS
    and Ubuntu 22.04 Desktop LTS are the versions appropriate for all Windows and
    Linux hosts, and older macOS machines. They are the long-term versions with support
    until 2027. They are the easy choice for Intel-based machines. Apple M1, M2, and
    newer machines are tricky. They require an ARM version of Ubuntu, but Ubuntu does
    not currently offer an official ARM LTS release. However, they do support a daily
    ARM build which began with the official 22.04 LTS release. We could download the
    LTS Server edition and modify it for our needs, but I find that unnecessary. The
    ARM Desktop daily build, based on the current LTS version works well for me. However,
    I would never use the daily versions of releases such as 22.10, 23.04, 23.10,
    etc. Those tend to have more bugs and issues. If you are reading this before April
    of 2024, you should download the daily ARM build of 22.04. In 2024, hopefully
    we will have an official LTS ARM version. If not, use the ARM Daily version of
    24.04.


    Once you have downloaded the appropriate version of Linux for your system, click
    the "Browse" button within UTM and select the downloaded ISO file. Leaving the
    "Use Apple Virtualization" option unchecked is the safe and stable way to go.
    However, M1, M2, or newer devices may function better in the future with this
    option selected. Leave it unchecked for now, as you can always build another machine
    with this option later to compare the performance. It was not functioning with
    Linux during this writing. Click "Continue".


    Choose half of your system’s memory and CPU cores. If you had 16 GB of RAM and
    an eight-core processor, you would change the RAM to "8192" and the CPU Cores
    to "4". Never leave the cores as "Default", as it can confuse the operating system.
    Click "Continue" when complete. The size of the drive should be set to the maximum
    you will ever need. This is not the size of the VM as it grows, it is only the
    max. I set mine to "100" GB.


    I prefer to enable file sharing, as it makes it easier to extract evidence from
    your investigation onto your host. Browse to your desired shared folder (I chose
    Downloads) and click "Continue". Finish through the process and click the arrow
    icon to start your new Linux VM. You are now ready to install Linux. If installing
    Pop!_OS, follow the previous guides for configuration. If installing Ubuntu, consider
    the following after initial boot of your new VM within UTM.


    # Ubuntu 22.04 LTS Desktop Only:


    +   - Select "Try or Install Ubuntu".

    +   - Select "Install Ubuntu".

    +   - Select your desired language and location, then click "Continue".


    # Ubuntu 22.04 ARM Daily Desktop Only:


    +   - Select "Try or Install Ubuntu".

    +   - Enter the username of "ubuntu" and password of "password" if prompted.

    +   - Double-click "Install Ubuntu 22.04.1 LTS" on the Desktop.

    +   - Choose your language and keyboard layout and click "Continue".'
