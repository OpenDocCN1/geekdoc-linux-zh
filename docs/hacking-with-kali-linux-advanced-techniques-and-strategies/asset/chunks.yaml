- fmt: '

    It''s essential to ensure that the hacking activities we engage in are categorized
    as ethical hacking. While black hat hacking and ethical hacking share many similarities,
    certain guidelines must be followed to distinguish between the two and ensure
    the work is ethical.


    The primary differentiator between these two forms of hacking lies in the motivations
    driving the actions taken. Black hat hackers are motivated by power, financial
    gain, and personal advancement, often seeking to fulfill their self-serving interests.
    In contrast, white hat hackers, also known as ethical hackers, are driven by a
    desire to protect their own or their organization''s information and data.


    So, what criteria must hacking meet to be considered ethical? Ethical hacking
    follows specific rules:


    1. **Explicit Permission**: To conduct ethical hacking, there must be clear and
    express permission granted to access the network. Often, this permission is documented
    in writing, ensuring that all parties are aligned regarding the scope and limitations
    of the hacking activity. When working on one''s own network, written permission
    is not required.

    2. **Respect for Privacy**: Ethical hackers must respect the privacy of the network''s
    owner. They should maintain the confidentiality of vulnerabilities discovered
    and share this information solely with the relevant company or individual, refraining
    from publicly disclosing network weaknesses.

    3. **Complete Work**: Once the hacking task is completed, all actions and vulnerabilities
    discovered during the process should be diligently closed out. This ensures that
    no open doors or potential vulnerabilities are left for exploitation in the future.

    4. **Communication with Developers**: If vulnerabilities are identified within
    the network, ethical hackers should promptly notify software developers or hardware
    manufacturers responsible for the products in use. This is especially crucial
    when the company is unaware of these vulnerabilities.


    Upon completing the penetration test and related tasks, ethical hackers should
    share the findings with the network owner. They should provide detailed information
    about vulnerabilities and discuss potential measures to reduce or eliminate them,
    enhancing the network''s security.


    The term "ethical hacker" has faced criticism over time, with some arguing that
    hacking is hacking, regardless of the actor''s motivation. However, the work conducted
    by ethical hackers plays a pivotal role in enhancing system security for numerous
    companies. Their effectiveness and success in identifying vulnerabilities and
    strengthening security measures are evident. Individuals aspiring to become ethical
    hackers typically adhere to strict rules and regulations, often achieving certification
    as a Certified Ethical Hacker (`CEH`) before embarking on their careers.


    # Understanding Various Types of Hacking


    Now that we''ve delved into the realm of ethical hacking, it''s essential to explore
    the diverse hacking avenues and understand the objectives behind each approach.
    Hacking comes in various forms, each serving a specific purpose. Here are some
    common types of hacking:


    - **Website Hacking**: When a hacker gains unauthorized access to a website, they
    essentially take control of the web server and any associated software, including
    databases and interfaces. Their aim is to manipulate or exploit the web server
    for their own purposes.

    - **Network Hacking**: In network hacking, the hacker collects information about
    a network using tools like `Netstat` and `Tracert`. This type of hacking intends
    to disrupt network operations and impair its functionality.

    - **Email Hacking**: Email hacking involves gaining unauthorized access to an
    email account and utilizing it to send malicious content such as threats or harmful
    links without the owner''s consent. Caution is necessary when opening emails to
    avoid falling victim to hackers.

    - **Malware and Viruses**: Hackers often create new malware and viruses to compromise
    the security of systems. Users can inadvertently introduce malware to their systems
    by clicking on suspicious links or visiting compromised websites. Employing reliable
    antivirus software is essential to protect your data.

    - **Password Hacking**: Password hacking revolves around retrieving secret passwords
    stored within a system or transmitted by it. Hackers employ various methods to
    obtain passwords, emphasizing the importance of creating strong and secure passwords
    as they form a crucial defense against unauthorized access.

    - **Key Loggers**: Keyloggers are tools hackers use to record keystrokes on a
    victim''s computer without their knowledge. This data is then sent back to the
    hacker, who can uncover patterns in usernames and passwords, posing a significant
    security threat.

    - **Screenshots**: Screen capture, another method explored in this guidebook,
    complements keyloggers. It allows hackers to monitor websites visited by the user,
    providing insights that can be exploited to their advantage.

    - **Man-in-the-Middle Attack**: This type of attack occurs when a hacker convinces
    network users that they are legitimate. When data is sent from one computer to
    another, it is intercepted by the hacker, who can either observe the information
    or manipulate it before forwarding it to its intended recipient.

    - **Computer Hacking**: In computer hacking, the hacker steals the computer''s
    ID and password through various hacking techniques to gain unauthorized access
    to the system.


    While there may be concerns that all hackers are the same, it''s crucial to differentiate
    between ethical and unethical hacking. Ethical hackers play a valuable role in
    enhancing network security and data protection. They help identify vulnerabilities
    and fortify systems against malicious hackers, ensuring the safety of valuable
    data.


    # CHAPTER 13: DOWNLOADING AND UTILIZING KALI LINUX


    Now, it''s time to proceed with the Kali Linux download process, ensuring that
    we can fully utilize this system for our purposes. There are several methods available
    to get Kali Linux onto our systems, enabling us to work with it effectively. If
    your intention is to use this system for your hacking activities, installing Kali
    Linux is a crucial step. There are primarily two options to consider: dual-booting
    with Windows or installing it within a virtualized environment.


    Furthermore, we must determine which version of Kali suits our specific needs.
    "Rumour Kali" stands out as an excellent choice for penetration testing, but keep
    in mind that various Linux distributions are well-suited for this purpose. Feel
    free to choose the one that you are most comfortable with at the moment.


    ## SETTING UP DUAL BOOT WITH WINDOW 10


    Our first option for getting the Linux system up and running is to create a dual
    boot configuration alongside Windows 10.


    1. Begin by visiting the Kali Linux website to download the latest version of
    the `ISO` file. You can choose between the 32 or 64-bit version based on your
    system''s specifications.

    2. After completing the download, the next step is to create a bootable USB drive.
    For this, you''ll need a utility like `Rufus`, which helps in the creation of
    bootable USB flash drives. You can find and install `Rufus` from its official
    website.

    3. Once `Rufus` is installed and ready, connect your USB drive to your computer.
    Ensure that the USB drive has a minimum capacity of 4 GB to accommodate the operating
    system.

    4. Launch `Rufus` and follow the provided instructions to create the bootable
    USB drive.

    5. In the `Rufus` interface, confirm that your selected USB drive is recognized.

    6. Locate and click on the small CD drive icon below the drive selection to choose
    the Kali Linux `ISO` file that you downloaded from the official Kali website.

    7. When these steps are completed, click the Start button and wait for the process
    to finish.

    8. Once the process is complete, click the Close button in `Rufus` to exit the
    program.

