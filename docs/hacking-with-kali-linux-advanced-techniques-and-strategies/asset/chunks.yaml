    You now have a bootable USB drive with the Kali Linux operating system. In addition
    to dual booting alongside Windows, you can also use it to run Kali as a live system
    without the need for installation. Keep in mind that using Kali as a live system
    comes with certain limitations on functionality and features.


    ## CREATING A SEPARATE PARTITION FOR KALI LINUX INSTALLATION


    After completing the initial preparations, it''s time to set up a dedicated partition
    for the Kali Linux installation. Here are the steps:


    1. Open the Disk Management settings or access the command line in Windows and
    run the `diskmgmt.msc` command.

    2. In the Disk Management window, create a new partition with a minimum size of
    15 to 20 GB by shrinking an existing volume. For example, you can create a partition
    of around 17 GB.

    3. With this partition created, the preliminary setup steps are now complete.
    You have downloaded the Kali Linux ISO, created a bootable USB drive, and established
    a dedicated partition for Kali Linux.


    Before proceeding further, it''s essential to disable Secure Boot and Fast Boot
    options in your computer''s BIOS settings. These settings are typically accessed
    by restarting your device and entering the boot manager. Please note that the
    naming and location of these settings may vary depending on your computer''s brand.


    Once these settings are configured, you''ll have the option to boot from the USB
    drive. In this menu, select the option for booting from USB, which may be named
    differently depending on your computer''s brand.


    At this point, you''ll see the Kali Linux installation window. You''ll be presented
    with several installation options.


    During the installation, you''ll go through several configuration steps to ensure
    everything is set up as you prefer. These include selecting your language, country,
    keyboard layout, IP configuration (manual or automatic), and choosing a hostname
    (similar to a username).


    Next, set a password for the root user and click "Continue."


    For partitioning, select the option to manually choose the partitioning method
    and carefully select the partition you created earlier for the Kali Linux installation.


    You can then choose to delete the partition. Afterward, you''ll see the Kali installation
    partition listed as free space.


    You can also select the option to have all files in one partition, which is recommended
    for new users.


    Lastly, choose "Finish partitioning and write changes to the disk." At this point,
    you''ll be prompted for permission to write the changes to the disk. Select "Yes."


    The installation process for Kali Linux will commence, taking approximately ten
    to fifteen minutes to complete. When you reach about halfway through the installation,
    you''ll be prompted about a network mirror; it''s usually best to choose "No"
    for this.


    Subsequently, install the GRUB boot loader by selecting "Yes." When asked where
    to install the Kali GRUB boot loader, choose the second option, which is the hard
    disk. This ensures proper boot menu functionality for selecting operating systems
    during startup.


    After completing the installation process, choose "Continue" when prompted. Eject
    the USB drive used for the installation and restart your system.


    During the startup process, you''ll encounter the GRUB Loader for Kali Linux.
    From there, you can select "Kali GNU/Linux" to boot into the new operating system.
    To boot into Windows 10, choose "Windows Recovery Environment" as desired.


    ## INSTALLING KALI LINUX USING VIRTUALBOX


    In some scenarios, setting up a dual boot for Kali Linux might not be the most
    suitable option. This could be due to limited space or computing power on your
    system, or if you encounter issues that make dual booting impractical. In such
    cases, you can opt to install Kali Linux within a VirtualBox, offering several
    advantages:


    1. Ability to run multiple operating systems simultaneously.

    2. Convenient management of your operating system, including installations, backups,
    rollbacks, and restores.

    3. Enhanced resource allocation control without complications.

    4. Portability – you can transfer your VirtualBox to different machines.

    5. Quick and easy system snapshots and rollbacks.

    6. Learning opportunities through troubleshooting.

    7. Ideal for experimentation and testing.


    However, running Kali on a VirtualBox does have some drawbacks. Performance may
    be lower compared to other options, GPU acceleration might not work, and issues
    can arise with USB wireless cards. Some users may prefer regular rollbacks over
    troubleshooting, and it might not provide the same level of comfort with real
    machine installations.


    The installation process of Kali Linux within a VirtualBox can be tailored to
    your preferences, offering both simplicity and complexity. Here are the basic
    steps for setting up this operating system on a virtual machine:


    1. Create a new virtual disk for the Virtual Machine.

    2. Once these initial setup steps are completed, you''ll need to modify VirtualBox
    settings accordingly.

    3. Load the Kali ISO into the VirtualBox to start the installation process.

    4. During this process, you''ll provide initial information such as location and
    time zone.

    5. Follow the same partitioning steps you would for a dual boot with Windows.

    6. After finalizing the installation, you can run Kali Linux within the VirtualBox.

    7. Optionally, you can add VirtualBox Guest Additions packages to customize your
    setup further.


    These methods are commonly used when dealing with Kali Linux for hacking and other
    complex tasks. By learning how to install Kali Linux within a VirtualBox, you''ll
    be well-prepared to tackle hacking and more advanced activities in the future.


    # CHAPTER 14: WORKBOOK: NETWORKING FUNDAMENTALS


    Welcome to Chapter 14! In this chapter, we will explore essential networking concepts
    and terminology that are fundamental to understanding how data is transmitted
    across networks. Whether you are new to networking or looking to reinforce your
    knowledge, this chapter will provide you with a solid foundation.


    ## Section 1: Networking Basics


    ### Lesson 1: What is Networking?


    Networking is the practice of connecting and communicating between various computing
    devices to share resources, information, and services. It enables us to access
    the internet, share files, and run applications.


    #### Quiz 1:

    1. What is networking?

    2. Why is networking important in the modern world?


    **Answers:**

    1. Networking is the practice of connecting and communicating between various
    computing devices to share resources, information, and services.

    2. Networking is important as it enables access to the internet, file sharing,
    and running applications, making it a vital part of our interconnected world.


    ### Lesson 2: Types of Networks


    There are various types of networks, including Local Area Networks (LANs), Wide
    Area Networks (WANs), and the internet. LANs connect devices within a limited
    area, while WANs connect devices over a large geographical area.


    #### Quiz 2:

    1. What is the primary difference between LANs and WANs?


    **Answers:**

    1. LANs connect devices within a limited area, whereas WANs connect devices over
    a large geographical area.


    ## Section 2: Network Devices


    ### Lesson 3: Network Devices


    Networks consist of various devices like routers, switches, and modems. Each device
    serves a specific purpose in facilitating communication between computers.


    #### Quiz 3:

    1. Name three common network devices.

    2. What is the role of a router in a network?


    **Answers:**

    1. Common network devices include routers, switches, and modems.

    2. A router directs data packets between networks, ensuring data reaches its intended
    destination.


    ## Section 3: Network Protocols


    ### Lesson 4: Network Protocols


    Network protocols are a set of rules and conventions that govern how data is transmitted
    across networks. Examples include TCP/IP, HTTP, and FTP.


    #### Quiz 4:

    1. What are network protocols?

    2. Give an example of a network protocol.


    **Answers:**

