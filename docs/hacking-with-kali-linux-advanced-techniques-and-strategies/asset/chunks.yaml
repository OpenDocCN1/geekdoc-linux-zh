    1. **维持访问**：确保对被攻破系统的持续访问。这可能涉及创建后门、建立持久机制或通过各种手段维持立足。


    2. **权限提升**：寻求在被攻破系统内部提升权限的方法。利用漏洞或配置错误可以获得更高级别的访问和控制。


