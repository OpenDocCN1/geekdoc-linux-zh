  trans: '

    你现在有了一个带有 Kali Linux 操作系统的可启动 USB 驱动器。除了与 Windows 并行双启动外，你还可以将其作为现场系统（live system）运行
    Kali 而无需安装。请记住，将 Kali 作为现场系统使用在功能和特性上会有某些局限性。


    ## 为 Kali Linux 安装创建一个独立分区


    在完成初始准备后，是时候为 Kali Linux 安装设置一个专用分区了。以下是步骤：


    1. 打开“磁盘管理”设置，或在 Windows 中访问命令行并运行 `diskmgmt.msc` 命令。

    2. 在“磁盘管理”窗口中，通过缩小现有卷来创建一个最小尺寸为 15 到 20 GB 的新分区。例如，你可以创建一个 17 GB 左右的分区。

    3. 分区创建完成后，初步设置步骤现已完成。你已经下载了 Kali Linux ISO 文件，创建了可启动 USB 驱动器，并为 Kali Linux 建立了专用分区。


    在继续之前，务必在计算机的 BIOS 设置中禁用安全启动（Secure Boot）和快速启动（Fast Boot）。这些设置通常通过重启设备并进入启动管理器来访问。请注意，这些设置的名称和位置可能根据电脑品牌有所不同。


    一旦配置了这些设置，你就可以从 USB 驱动器启动的选项。在此菜单中，选择从 USB 启动的选项，其名称可能根据电脑品牌而有所不同。


    此时，你将看到 Kali Linux 安装窗口。你将看到几个安装选项。


    在安装过程中，你将经过几个配置步骤，以确保所有设置都符合你的喜好。这些包括选择语言、国家、键盘布局、IP 配置（手动或自动）以及选择主机名（类似于用户名）。


    接下来，为 root 用户设置密码并点击“继续”。


    对于分区，选择手动选择分区方法的选项，并仔细选择你之前为 Kali Linux 安装创建的分区。


    然后，你可以选择删除并进行分区。之后，你将看到 Kali 安装分区列为空闲空间。


    你也可以选择“将所有文件放在一个分区”的选项，这推荐给新用户。


    最后，选择“完成分区并将更改写入磁盘”。此时，系统将提示你是否有权限将更改写入磁盘。选择“是”。


    Kali Linux 的安装过程将开始，大约需要十到十五分钟完成。当安装到大约一半时，系统会提示你关于网络镜像的问题；通常选择“否”是最好的。


    随后，通过选择“是”安装 GRUB 引导加载程序。当询问在何安装 Kali GRUB 引导加载程序时，选择第二个选项，即硬盘。这确保了启动时选择操作系统的正确启动菜单功能。


    完成安装过程后，在提示时选择“继续”。拔出用于安装的 USB 驱动器并重启系统。


    在启动过程中，你将遇到 Kali Linux 的 GRUB 加载器。从那里，你可以选择“Kali GNU/Linux”进入新的操作系统。如需进入 Windows
    10，根据需要选择“Windows Recovery Environment”。


    ## 使用 VIRTUALBOX 安装 KALI LINUX


    在某些情况下，为 Kali Linux 设置双启动可能不是最合适的选择。这可能是由于系统空间或计算能力有限，或者你遇到了使双启动变得不实际的问题。在这种情况下，你可以选择在
    VirtualBox 中安装 Kali Linux，它具有以下几个优势：


    1. 能够同时运行多个操作系统。

    2. 便捷地管理你的操作系统，包括安装、备份、回滚和恢复。

    3. 增强的资源分配控制，且不复杂。

    4. 便携性——你可以将 VirtualBox 传输到不同的机器。

    5. 快速方便的系统快照和回滚。

    6. 通过排除故障获得学习机会。

    7. 实验和测试的理想选择。


    然而，在 VirtualBox 上运行 Kali 确实有一些缺点。性能可能低于其他选项，GPU 加速可能无法工作，USB 无线卡可能会出现问题。某些用户可能更倾向于常规回滚而不是排除故障，而且它可能无法提供真机安装相同的舒适度。


    在 VirtualBox 中安装 Kali Linux 的过程可以根据你的喜好进行定制，兼具简单性和复杂。在虚拟机上设置此操作系统的基本步骤如下：


    1. 为虚拟机创建一个虚拟磁盘。

    2. 完成这些初始设置步骤后，你需要相应修改 VirtualBox 设置。

    3. 将 Kali ISO 加载到 VirtualBox 中开始安装过程。

    4. 在此过程中，你将提供初始信息，如位置和时区。

    5. 遵循与 Windows 双启动相同的分区步骤。

    6. 完成安装后，你可以在 VirtualBox 中运行 Kali Linux。

    7. 可选，你可以添加 VirtualBox Guest Additions 软件包以进一步自定义你的设置。


    在处理 Kali Linux 进行黑客攻击和其他复杂任务时，这些方法被常用。通过学习如何在 VirtualBox 中安装 Kali Linux，你将为未来应对黑客攻击和更高级活动做好准备。


    # 第 14 章：练习册：网络基础


    欢迎来到第 14 章！在本章中，我们将探索基本的网络概念和术语，这些概念对于理解数据如何在网络中传输至关重要。无论你是网络初学者还是希望加强知识，本章都将为你提供坚实的基础。


    ## 第 1 节：网络基础


    ### 第 1 课：什么是网络？


    网络是在各种计算设备之间建立连接和通信以共享资源、信息和服务的。它使我们能够访问互联网、共享文件并运行应用程序。


    #### 测试 1：

    1. 什么是网络？

    2. 为什么网络在现代世界很重要？


    **答案：**

    1. 网络是在各种计算设备之间建立连接和通信以共享资源、信息和服务的实践。

    2. 网络很重要，因为它能够访问互联网、共享文件和运行应用程序，是我们互联世界的重要部分。


    ### 第 2 ：网络类型


    网络有多种类型，包括局域网（LAN）、广域网（WAN）和互联网。LAN 连接有限区域内的设备，而 WAN 连接跨越地理区域的设备。


    #### 测试 2：

    1. LAN 和 WAN 之间的主要区别是什么？


    **答案：**

    1. LAN 连接有限区域内的设备，而 WAN 连接跨越地理区域的设备。


    ## 第 2 节：网络设备


    ### 第 3 课：网络设备


    网络由路由器、交换机和调制解器等各种设备组成。每个设备在促进计算机之间的通信方面都有特定的作用。


    #### 测试 3：

    1. 写三种常见的网络设备。

    2. 路由器在网络中的作用是什么？


    **答案：**

    1. 常见的网络设备包括路由器、交换机和调制解器。

    2. 路由器在网络之间引导数据包，确保数据到达目标地。


    ## 第 3 节：网络协议


    ### 第 4 课：网络协议


    网络协议是一套规范数据如何在网络中传输的规则和约定。示例包括 TCP/IP、HTTP 和 FTP。


    #### 测试 4：

    1. 什么是网络协议？

    2. 举一个网络协议的例子。


    **答案：**

    1. 网络协议是一套规范数据如何在网络中传输的规则和约定。

