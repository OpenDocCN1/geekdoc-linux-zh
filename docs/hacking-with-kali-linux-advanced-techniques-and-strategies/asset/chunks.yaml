    4. **数据收集**：从被攻破系统中收集价值信息。这可能包括敏感文件、用户凭据、配置以及与评估目标相关的任何数据。


    5. **隐藏踪**：确保你在被攻破系统中的活动保持谨慎。删除日志、清除事件记录并掩盖踪迹以避免检测。


    6. **实现目标**：如果你的道德黑客任务有特定目标，努力完成它们。这可能涉及访问特定系统、盗取敏感数据或演示特定的漏洞。


    7. **退出策略**：仔细计划你的退出策略。确保你离开时系统处于安全状态，且没有造成任何持久性损害。记录你采取的行动。


    8. **最终报告**：与所有道德黑客阶段一样，全面的报告至关重要。记录后渗透活动、收集的数据以及在被攻破系统内采取的任何操作。


