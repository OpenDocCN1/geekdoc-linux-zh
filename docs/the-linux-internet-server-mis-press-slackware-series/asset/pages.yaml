  md: '# CHAPTER 4: Setting Up a Web Server


    # AllowOverride


    ```

    Syntax:   AllowOverride override override ...nDefault:  AllowOverride All

    Context:  directory

    Status:   core

    ```


    When the server finds an .htaccess file (as specified by AccessFileName) it needs
    to know which directives declared in that file can override earlier access information.


    Override can be set to None, in which case the server will not read the file but
    will allow all the directives, or one or more of the following:


    +   * AuthConfig allows use of the authorization directives (AuthDBGroupFile,
    AuthDBUserFile, AuthGroupFile, AuthName, AuthType, UserFile, and require).

    * FileInfo allows use of the AddEncoding, AddLanguage, AddType, DefaultTypePriority,
    and Language directives, which control document types.

    * Indexes allows use of the AddDescription, AddIcon, AddIconByEncoding, AddIconByType,
    DefaultIcon, DirectoryIndex, FancyIndexing, HeaderName, IndexIgnore, IndexOptions,
    and Readme directives, which control directory indexing.

    * Limit allows use of the directives controlling host access—allow, deny, and
    order.

    * Options allows use of the directives controlling specific directory features—Options
    and XBitHack


    # AuthName


    ```

    Syntax:   AuthName auth-domain

    Context:  directory, .htaccess

    Override: AuthConfig

    Status:   core

    ```


    This directive sets the name of the authorization realm for a directory. This
    realm is given to the client so that the user knows which username'
  merge: -1
