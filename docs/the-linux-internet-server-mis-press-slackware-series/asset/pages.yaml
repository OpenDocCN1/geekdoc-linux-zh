- img_proc: true
  md: '# 368 CHAPTER 5: Setting Up Gopher


    ```

    httpText=

    <title>The GN Server</title>

    <img src="http://I/image/fract2.gif">

    ```


    This is the home of the <i>gn/</i> Gopher/HTTP server. It contains documentation
    on <i>gn/</i>, the source, and several examples of how <i>gn/</i> can be used.
    To get the source distribution select the compressed tar file listed below.


