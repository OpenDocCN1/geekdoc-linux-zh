    \ the `DefaultType`. For example,\n\n```\nDefaultType image/gif\n```\n\nwould\
    \ be appropriate for a directory that contained many GIF images with filenames\
    \ missing the .gif extension.\n\n# <Directory>\n\n```\nSyntax:      <Directory\
    \ directory> ... </Directory>\nContext:     server config, virtual host\nStatus:\
    \      \n```\n\n<Directory> and </Directory> are used to enclose a group of directives\
    \ that apply only to the named directory and subdirectories of that directory.\
    \ Any directive allowed in a directory context may be used. The directory is either\
    \ the full path to a directory or a wildcard string. In a wildcard string, ? matches\
    \ any single character, and * matches any sequences of characters. For example,\n\
    \n```\n<Directory /usr/local/httpdocs\nOptions Indexes FollowSymLinks\n</Directory>\n\
    ```\n\nIf multiple directory sections match the directory (or its parents) containing\
    \ a document, then the directives are applied in the order of shortest match first,\
    \ interspersed with the directives from the .htaccess files. For example,\n\n\
    ```\n<Directory />\nAllowOverride None\n</Directory>\n```\n\n```\n<Directory /home/*>\n\
    AllowOverride FileInfo\n</Directory>\n```"
