- img_proc: true
  md: 'CHAPTER 5: Setting Up Gopher 369


    HTML documents normally have a title given at the beginning of the document and
    set off by the tags <TITLE> and </TITLE>. This is displayed by most browsers.
    When gn menus are converted to HTML documents, the Name= entry from the parent
    menu is used as the title except for the root menu (which has no parent). The
    default root menu title is set in the config.h #define ROOT_MENU_NAME, but this
    can be changed executing gn or sgn with the -t option followed by a quoted title.
    For example, the command:


    ```

    sgn -t "My Server"

    ```


    will set the title to My Server.


    # The Attribute Field in Men


    The HttpText and Hname mechanisms described previously give a way to display more
    information to HTTP clients than Gopher clients. Sometimes it is desirable to
    do the reverse—show a link to Gopher clients but hide it from Web clients. This
    can be done by using the Attribute= field for the menu item. Thus the entry:


    ```

    Name=A file for gopher clients only

    Path=0/dir/file

    Attribute=gopheronly

    ```


    will be displayed only to Gopher clients.

    Similarly, there is a way to have a menu item displayed only for HTTP clients.
    The menu item would be:


    ```

    Name=A file on this server for HTTP clients only

    Path=0/dir/file

    Attribute=httponly

    ```


    This method will serve only local files. The next section discusses other ways
    to serve objects, including remote files, to HTTP clients.


    Finally, you may wish for certain items never to be displayed on a menu but to
    be accessible to requests, for example an inline graphic file for an HTML document.
    To be accessible such a file must be referenced'
  merge: -1
  pgno: 392
- img_proc: true
  md: 'in a file (and the .cache file produced from it) so that the server has permission
    to serve it. Simply add the line Attribute=invisible to the menu item, and it
    will not be displayed. For example, the entry:


    ```

    Name=My gif file for an inline image

    Path=/i/dir/file.gif

    Attribute=invisible

    ```


    will allow file.gif to be served but will never show in any client''s menu. Hence
    what you put in the Name field is only a note to yourself, since the server should
    never allow it to be viewed.


    Remote links are slightly problematic for gn. If a link to a remote server is
    made in the usual way by specifying Name, Path, Type, Host, and Port, then the
    gn server assumes by default that this is a link to a server capable of dealing
    only with the Gopher protocol and will present it as such. The determination of
    whether or not a link is remote is done at the time that mkcache is run, and a
    link is considered remote unless the Host and Port fields in the menu are omitted
    or agreed exactly with the default values specified in the mkcache command line
    or compile time in the config.h file. For this reason it is important that whenever
    you run mkcache you specify the host on the command line, unless you have placed
    that name in the config.h file as HOSTNAME.


    Of course, you may know that a remote link is running the gn server and therefore
    capable of handling HTTP requests. In this case, to allow, allow HTTP clients
    to get the best link, simply use gnlink attribute in your menu file entry. For
    example, a link to the Northwestern University Math server would look like:


    ```

    Name=Northwestern University Mathematics Department

    Path=/gnlink

    Attribute=gnlink

    Type=l

    Host=gopher.math.nwu.edu

    Port=70

    ```


    A final attribute value is nosearch. If a menu item contains the line Attribute=nosearch,
    then that item will be displayed for clients but its title will not be used when
    searches of menu items (as described in the next section) are done.'
