    # The CERN Web Server


    The CERN Web Server (also known as W3C httpd) is a generic public-domain full-featured
    hypertext server, which can be used as a regular HTTP server. The server is typically
    running on port 80 to serve hypertext and other documents, but it can also serve
    as a proxy—a server on a firewall machine—that provides access for people inside
    a firewall to the outside world. When running as proxy, httpd may be configured
    to do caching of documents resulting in faster response times.


    This was the original Web server, but it''s also a defunct Web server. The final
    version is 3.0A, and it was released on July 15, 1996. Because the CERN server
    can be used quite adequately as a proxy server (a topic you''ll learn about later
    in this book), it is included here.


    The archive is w3c-httpd-3.0A.tar.gz, and it''s found on the CD-ROM in the internet/web_servers
    directory. You''ll want to first uncompress and untar the distribution files:


    ```

    uncompress w3c-httpd-3.0A.tar.Z

    tar xvf w3c-httpd-3.0A.tar

    ```'
