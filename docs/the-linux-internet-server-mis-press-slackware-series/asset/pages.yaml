    # Looking at Some Documentation Files


    If you''re not sure about what configuration to use when you run the xf86config
    script, which you can peruse some of the online documentation for XFree86, which
    can be found in the /usr/X11/lib/X11/doc directory. For convenience'' sake, here
    are some of the files.'
