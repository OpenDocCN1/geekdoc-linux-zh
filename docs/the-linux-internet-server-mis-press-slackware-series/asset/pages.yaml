    which is the configuration file used by XFree86. If you try to start X without
    running xf86config or manually editing XF86Config, you''ll get an error. In their
    attempt to protect you yourself, the XFree86 folks did not include a working XF6Config
    file, forcing you to do some configuration work.


    # Running Xf86config


    Most users will just fine if they run the xf86config script. You can run this
    script at any time:


    ```

    $xf86config

    ```


    Before you do so, you may want to read through the documentation files found at
    /usr/X11/lib/X11/doc. (These files are covered later in the section called “Looking
    at Some Documentation Files.\”) After you read these files, you can run the script.
    You''ll be asked for a good amount of information through this process, so we''ll
    run through it carefully.'
  merge: -1
  pgno: 118
