- img_proc: true
  md: '+   Boolean operations, including an AND operation denoted by the symbol ;;
    , an OR operation denoted by the symbol ,, or any combination. For example, glimpse
    ~pizza;cheeseburger` will output all lines containing both patterns. The command
    glimpse - F `gnu`;c$'' `DEFAULT` will output all lines containing both define
    and DEFAULT (anywhere in the line, not necessarily in order) in files whose name
    contains gnu and ends with .c. The command glimpse `{political,computer};science`
    will match political science or science of computers.


    +   Wildcards, including the symbol #, used to denote a sequence of any number
    (including 0) of arbitrary characters. The symbol # is equivalent to *. In fact,
    * will work too, because unless this is part of an actual regular expression,
    # will work faster.


    +   Combination of exact and approximate matching. Any pattern inside angle brackets
    <> must match the text exactly if the match is with errors. For example, <mathemat
    matches with one error (replacing the s with an a), matheics does not match mathematical
    no matter many errors are allowed. (This option is buggy at the moment.)


    +   Regular expressions. Since the index is word based, a regular expression must
    match words that appear in the index for glimpse to find it. glimpse first strips
    the regular expression from all nonalphabetic characters and searches the index
    for all remaining words. It then applies the regular expression matching algorithm
    to the files found in the index. For example, glimpse `abc*.xyz` searches the
    index for all files that contain both abc and xyz, and then searches directly
    for abc in those files. (If you use glimpse -w abc*.xyz, abcxyz will not be found,
    glimpse will think that abc and xyz need to matches to whole words.) The syntax
    of regular expressions in glimpse is general the same as that for grep. The union
    operation |, Kleene closure *, and parentheses () are all supported. Currently
    + is not supported. Regular expressions are currently limited to approximately
    30 characters (generally excluding characters). Some options (-d, -w, -t, -x,
    -D, I, and -S) do not work currently with regular expressions. The maximal number
    of errors for regular expressions that use * or | is four.'
  merge: -1
