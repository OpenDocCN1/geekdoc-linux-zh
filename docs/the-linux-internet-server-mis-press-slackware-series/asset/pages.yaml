- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    This directive enables Keep-Alive support. Set max-requests to the maximum number
    of requests you want Apache to entertain per request. A limit is imposed to prevent
    a client from hogging your server resources. Set this to 0 to disable support.


    The Keep-Alive extension to HTTP, as defined by the HTTP/1.1 draft, allows persistent
    connections. These long-lived HTTP sessions allow multiple requests to be sent
    over the same TCP connection, and in some cases have been shown to result in an
    almost 50 percent speedup in latency times for HTML documents with lots of images.


    Apache 1.1 comes with Keep-Alive support by default. The KeepAlive and KeepAliveTimeout
    directives (KeepAliveTimeout is covered in the following section) are used to
    modify Apache''s behavior.


    In order for Keep-Alive support to be used, the first browser must support it.
    Many current browsers, including Netscape Navigator, Microsoft Internet Explorer,
    and Spyglass Mosaic-based browsers, some Windows 95-based browsers misbehave with
    Keep-Alive supporting servers; they may occasionally hang on a connect. This has
    been observed with several Windows browsers when connecting to any Keep-Alive
    server, not just Apache. Netscape 3.0b5 and later versions are known to work around
    this problem.


    However, Keep-Alive support is active only with files where the length is known
    beforehand. This means that most CGI scripts, server-side included files, and
    directory listings will not use the Keep-Alive protocol. While this should be
    completely transparent to the end user, it is something the Webmaster may want
    to keep in mind.


    # KeepAliveTimeout


    +   - Syntax: KeepAliveTimeout seconds

    - Default: KeepAliveTimeout 15

    - Context: server config

    - Status: core


    This specifies the number of seconds Apache will wait for a subsequent request
    before closing the connection. Once a request has been received, the timeout value
    specified by the Timeout directive applies.'
  merge: -1
  pgno: 273
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 251


    # Listen


    Syntax: Listen [IP address]:port number


    Context: server config


    Status: core


    The Listen directive instructs Apache to listen to more than one address or port;
    by default it responds to requests on all IP interfaces, but only on the port
    given by the Port directive.


    # <Limit>


    Syntax: <Limit method ... > ... </Limit>


    Context: any


    Status: core


    <Limit> and </Limit> are used to enclose a group of access-control directives
    that apply only to the specified access methods, where method is any valid HTTP
    method. Any directive except another <Limit> or <Directory> may be used; the majority
    will be unaffected by the <Limit>. An example:


    ```

    <Limit GET POST>

    require valid-user

    </Limit>

    ```


    If an access-control directive appears outside a <Limit> directive, then it applies
    to all access methods.


    # <Location>


    Syntax: <Location URL prefix>


    Context: server config, virtual host


    Status: core


    The <Location> directive provides for access control by URL. It is comparable
    to the <Directory> directive and should be matched with a </Location> directive.
    Directives that apply to the URL given should be'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# 252 CHAPTER 4: Setting Up a Web Server


    Listen within. <Location> sections are processed in the order they appear in the
    configuration file, after the <Directory> sections and .htaccess files are read.


    Due to the way HTTP functions, the URL prefix should (save for proxy requests)
    be of the form /path/, and should not include the http://servername. It doesn''t
    necessarily have to a directory (it can be an individual file or a number of files)
    and can include wildcards. In a wildcard string, * matches any single character,
    and * matches any sequences of characters.


    This functionality is especially useful when combined with the SetHandler directive.
    For example, to enable status requests, but allow them only from browsers at foo.com,
    you might use:


    ```

    <Location />

    SetHandler server-status


    order deny,allow

    deny from all

    allow from .foo.com


    </Location>

    ```


    # MaxClients


    +   Syntax: MaxClients number

    Default: MaxClients 150

    Context: server config

    Status: core


    The MaxClients directive sets the limit on the number of simultaneous requests
    that can be supported; not more than this number of server processes will be created.


    # MaxRequestsPerChild


    +   Syntax: MaxRequestsPerChild number

    Default: MaxRequestsPerChild 0

    Context: server config

    Status: core'
  merge: -1
  pgno: 275
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 253


    The MaxRequestsPerChild directive sets the limit on the number of requests that
    an individual child server process will handle. After MaxRequestsPerChild requests,
    the child process will die. If MaxRequestsPerChild is 0, then the process will
    never expire.


    Setting MaxRequestsPerChild to a nonzero limit has two beneficial effects: It
    limits the amount of memory the process can consume (accidental) memory leakage,
    and by giving processes a finite lifetime, it helps reduce the number of processes
    when the server load reduces.


    # MaxSpareServers


    +   - Syntax: MaxSpareServers number

    - Default: MaxSpareServers 10

    - Context: server config

    - Status: core


    The MaxSpareServers directive sets the desired maximum number of idle child server
    processes. An idle process is one not handling a request. If there are more than
    MaxSpareServers idle, then the parent process will kill off the excess processes.


    Tuning of this parameter should be necessary only on very busy sites. Setting
    this parameter to a large number is almost always a bad idea.


    # MinSpareServers


    +   - Syntax: MinSpareServers number

    - Default: MinSpareServers 5

    - Context: server config

    - Status: core


    The MinSpareServers directive sets the desired minimum number of idle child server
    processes. An idle process is one not handling a request. If there are fewer than
    MinSpareServers idle, then the parent process creates new children at a maximum
    rate of one per second.


    Tuning of this parameter should be necessary only on very busy sites. Setting
    this parameter to a large number is almost always a bad idea.'
  merge: -1
  pgno: 276
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    # Options


    Syntax: Options option option ...


    Context: server config, virtual host, directory, .htaccess


    Override: Options


    Status: core


    The Options directive controls which server features are available in a a particular
    directory. Option can be set to None, in which case none of the extra features
    are enabled, or one or more of the following:


    +   - All (All options are included except for MultiViews.)

    - ExecCGI (Execution of CGI scripts is permitted.)

    - FollowSymLinks (The server will follow symbolic links in this directory.)

    - Includes (Server-side includes are permitted.)

    - IncludesNQEXEC (Server-side includes are permitted, but the #exec command and
    #include of CGI scripts are disabled.)

    - Indexes (If a URL that maps to a directory is requested and there is no index.html
    in that directory, then the server will return a formatted listing of the directory.)

    - MultiViews (Content-negotiated MultiViews allowed.)

    - SymLinksIfOwnerMatch (The server will follow only symbolic links for which the
    target file or directory is owned by the same user ID as the link.)


    If multiple options could apply to a directory, then the most specific one is
    taken complete; the options are not merged. In this example


    ```

    <Directory /web/docs>

    Options Indexes FollowSymLinks

    </Directory>

    <Directory /web/docs/spec>

    Options Includes

    </Directory>

    ```'
  merge: -1
