- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    Apache Web server is the most popular Web server in the world, according to research
    organizations like Server Watch (http://techweb.cmp.com) and Netcraft (http://www.netcraft.co.uk/Survey/Reports/).
    As a matter of fact, in the most recent poll as this book was written (November
    1996), over 38 percent of all Web sites and domains were running off of Apache
    Web servers. This was more than double the next popular Web server (NCSA, upon
    which Apache was based, polled almost 15 percent of all Web sites and domains),
    while the most popular commercial Web server, the Microsoft Internet Information
    Server, rolled around 10 percent.


    There''s a lot to lie about the Apache Web server. Following is a listing of the
    major features of the Apache Web server:


    +   - DBM databases for authentication allow you to easily set password-protected
    pages with enormous numbers of authorized users, without bogging down the server.

    - Customized responses to errors and problems.

    - Files or CGI scripts can be returned by the server in response to errors and
    problems, as a script to intercept 500 Server Errors and perform on-the-fly diagnostics
    for both users and yourself.

    - Multiple DirectoryIndex directives allow you to say DirectoryIndex index.cgi,
    which instructs the server to either send index.html or run index.cgi when a directory
    URL is requested, whichever it finds in the directory.

    - Unlimited numbers of Alias and Redirect directives.

    - Content negotiation: the ability to automatically serve clients of varying sophistication
    and HTML level compliance, with documents that offer the best representation of
    information that the client is capable of accepting.

    - Multihomed servers (sometimes known as the “APB” patches), which allows the
    server to distinguish between requests made to different IP addresses mapped to
    the same machine.


    The Apache Web server is a product of the Apache HTTP Server Project, which is
    a dedicated bunch of volunteers who took the original NCSA Web server as the basis
    for their efforts to keep a high-performance Web server in the public domain,
    forever free of charge.'
