- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 299


    There are two directives supplied with this module: AuthDBGroupFile and AuthDBUserFile.


    # AuthDBGroupFile


    +   * Syntax: AuthDBGroupFile filename

    * Context: directory, .htaccess

    * Override: AuthConfig

    * Status: extension


    The AuthDBGroupFile sets the name of a DB file containing the list of users for
    user authentication. *Filename* is the absolute path to the group file.


    The group file is keyed on the username. The value for a user is a comma-separated
    list of the groups to which the users belongs. There must be no whitespace within
    the value, and it must never contain colons.


    Make sure that the AuthDBGroupFile is stored outside the document tree of the
    Web server. Do not put it in the directory that it protects; otherwise, clients
    will be able to download the AuthDBGroupFile.


    # AuthDBUserFile


    +   * Syntax: AuthDBUserFile filename

    * Context: directory, .htaccess

    * Override: AuthConfig

    * Status: extension


    The AuthDBUserFile directive sets the name of a DB file containing the list of
    users and passwords for user authentication. *Filename* is the absolute path to
    the user file.


    The user file is keyed on the username. The value for a user is the *crypt()*
    encrypted password, optionally followed by a colon and arbitrary data. The colon
    and the data following it will be ignored by the server.


    Make sure that the AuthDBUserFile is stored outside the document tree of the Web
    server. Do not put it in the directory that it protects; otherwise, clients will
    be able to download the AuthDBUserFile.'
