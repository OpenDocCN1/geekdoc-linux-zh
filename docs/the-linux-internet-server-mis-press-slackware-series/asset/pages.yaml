  md: '# 172 CHAPTER 4: Setting Up a Web Server


    The name Apache doesn''t refer to anything remotely Native American—it''s a reference
    to patch files from the NCSA Web server. After the files were applied to version
    1.3, it was A PAtChy ch.


    However, the Apache Web server isn''t the only Web server available to Linux users.
    Because of Apache''s popularity and widespread usage on the Internet, it''s the
    Web server that will be explained in the most detail in this chapter. Other Web
    servers (most of them on the accompanying CD-ROM) will be covered later in this
    chapter.


    # Working with the Apache Web Server


    When you installed Slack Linux from the CD-ROM, you were prompted whether you
    wanted to install the Apache Web server (it''s in the N series of disk sets).
    In Chapter 3, you were advised to do so. If you did, you''ll find a file called
    httpd in the /usr/sbin directory. This is the actual Apache Web server.


    You''ll note that it ends in d, which is Internet shorthand for daemon. You should
    be far enough into your Linux education to know that a daemon is a process that''s
    running on the surface, waiting to be called before springing into action. When
    an incoming request comes in from a Web browser, the httpd daemon springs into
    action.


    The Apache files are in a few different places on the Slack Linux file system.
    The locations are listed in Table 4.1.


    | File/Directory | Purpose |

    |---|---|

    | /usr/sbin/httpd | The server daemon |

    | /var/lib/httpd/cgi-bin | CGI programs |

    | /var/lib/httpd/conf | Configuration files |

    | /var/lib/httpd/icons | Bitmap icons used by the Web server to denote different
    things |

    | /var/lib/httpd/html | HTML pages |

    | /var/lib/httpd/log | Log files |


    Table 4.1 Apache Web Server File Locations'
