  md: '# FTP


    One of the oldest protocols on the Internet—indeed, even predating the Internet—is
    the File Transfer Protocol (FTP). This protocol is a basic method for exchanging
    files between computers via the Internet. It doesn''t matter what kinds of computers
    are talking to one another: a Macintosh can use FTP to transfer files from a Cray
    supercomputer, a Linux Internet server, a PC, or another Macintosh.(What the Mac
    does with the file after it''s transferred is another story, however.) Because
    the file-transfer mechanism is independent of the operating system, it''s very
    easy to use, which is why it''s so popular in the Internet world.


    In addition to the fact that FTP is simple to access, any Web browser can be used
    to download files via FTP. In fact, FTP is one of the protocols explicitly supported
    by all Web browsers. If you set up a link in the URL to a file stored on your
    Linux Internet server and specify ftp instead of http, the Web browser will initiate
    a file transfer, usually prompting the user as to how to handle it. From your
    end, these file transfers are ridiculously easy to set up, and for users they''re
    ridiculously easy to use.


    The Slack Linux operating system ships with the Washington University FTP Server
    2.4 (wu-ftpd), a more powerful version of the FTP server that usually ships with
    UNIX systems. This FTP server is very stable and respected, and unless your needs
    are really advanced, you won''t need to look elsewhere for a replacement FTP server.


    When you installed Slack Linux as your Internet server in Chapter 3, the WU-FTP
    server should have been installed automatically. It uses the following files on
    your Linux system:


    +   * /bin/ftpd

    * /etc/ftppasswd

    * /etc/ftpconversions

    * /etc/ftpgroups

    * /etc/ftpusers

    * /usr/bin/ftpcount

    * /usr/bin/ftpwho'
  merge: -1
  pgno: 423
- img_proc: true
  md: '# CHAPTER 7:Working with WU-FTP 401


    +   - /usr/bin/ftpshut

    - /usr/bin/xferlog

    - /usr/bin/xferstats


    > > These file locations are specific to Slackware Linux. The default installation
    locations for WU-FTP are slightly different.


    We''ll cover each of these files at the end of this chapter. In the meantime,
    we''ll discuss the core FTP daemon and how it works.


    # Running FTP


    You can launch the FTP daemon at any time from a command line:


    ```

    ftpd

    ```


    It''s probably a better idea to launch it via inetd, since this will automatically
    launch the FTP daemon every time the system is booted. This means editing the
    inetd.conf file, a task you already learned about in Chapter 4. And, Slackware
    Linux is already set up to run the ftpd daemon, as you can see if you peruse the
    /etc/inetd.conf file, which contains information about Internet services.


    The default directory for access is /home/ftp. Within that directory are six subdirectories
    and a text file called welcome.msg. The six directories are:


    +   - bin, where you store the binary files that the incoming FTP clients can
    use. A copy of the ls command is within this directory by default.

    - etc, where you can store files. This directory is empty by default.

    - incoming, which is designed for incoming users to upload files. The permissions
    on this directory are set so that anyone with access to the FTP system can upload
    and download files.'
  merge: -1
