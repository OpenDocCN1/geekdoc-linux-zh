- img_proc: true
  md: '# 278 CHAPTER 4: Setting Up a Web Server


    This module adds the following directives: AddDescription, AddIcon, AddIconByEncoding,
    AddIconByType, DefaultIcon, DirectoryIndex, FancyIndexing, HeaderName, IndexIgnore,
    IndexOptions, and ReadmeName.


    # AddDescription


    +   - Syntax: AddDescription string file file...

    - Context: server config, virtual host, .htaccess

    - Override: indexes

    - Status: base


    This sets the description to display for a file, for FancyIndexing. file is a
    file extension, partial filename, wildcard expression, or full filename for files
    to describe. String is enclosed in quotation marks ("). For example,


    AddDescription "The planet Mars" /web/pics/mars.gif


    # AddIcon


    +   - Syntax: AddIcon icon name...

    - Context: server config, virtual host, .htaccess

    - Override: indexes

    - Status: base


    This sets the icon to display next to a file ending in name for FancyIndexing.
    icon is either a (%-escaped) relative URL to the icon or of the format (alttext,url)
    where the text tag is given for an icon for nongraphical browsers.


    Name is ^^DIRECTORY^^ for directories, ^^BLANKICON^^ for blank lines (to format
    the list correctly), a file extension, a wildcard expression, a partial filename,
    or a complete filename. Examples include


    ```

    AddIcon (IMG,/icons/image.xbm).gif .jpg .xbm

    AddIcon /icons/dir.xbm ^^DIRECTORY^^

    AddIcon /icons/backup.xbm *

    ```'
