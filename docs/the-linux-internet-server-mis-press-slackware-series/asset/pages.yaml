  md: '# CHAPTER 3: Installing Linux and Internet Components


    Creating a partition merely leaves a portion of your hard disk devoted to the
    particular operating system. After you''ve used FDISK.EXE to create a new DOS
    partition, you''ll use the FORMAT.COM program to format that partition for use
    under MS-DOS. If you don''t format the MS-DOS partition, the operating system
    won''t be able to recognize it.


    # Using the DOS FDISK Utility


    Now that you''ve created the system backup and a boot diskette, it''s time to
    destroy the data on your hard drive with the FDISK utility. The act of creating
    new partitions is by definition a destructive act. You must destroy the existing
    partitions and the records of the data contained therein in create the new partitions.


    > NOTE You can use FDISK if your system has more than one hard drive. In this
    case, you''ll want to make sure that you''re working on the correct hard drive.
    FDISK does not use the normal DOS drive representations (C, D; E; etc.); rather,
    FDISK uses numerals, such as / or 2.


    Begin booting your PC from the floppy diskette drive you created in the previous
    section. This vanilla boot will ask you for today''s date and time (ignore both;
    they don''t matter) and then give you the following command line:


    ```

    A>

    ```


    You''re now ready to run the DOS FDISK utility:


    ```

    A> fdisk

    ```


    There are no command-line parameters to FDISK.


    The program loads and displays something like the screen shown in Figure 3.1.'
