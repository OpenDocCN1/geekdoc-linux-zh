    # Other Search Engines


    There are other searching and indexing tools on the market. Some of these should
    be familiar, while others are obscure. The first two are actually available for
    Linux at the present time and have been superseded to an extent by the Glimpse
    and GlimpseHTTP tools; as a matter of fact, the Harvest system actually uses Glimpse
    internally, the third is a popular Web technology that might be available for
    Linux by the time you read this.


    # FreeWAIS


    For a long time the Wide Area Information Server was the only decent indexing
    tool on the market. A freely available version, freeWAIS, is on the accompanying
    CD-ROM, as grabbed directly from ftp://ftp.wsc.wsc.com/pub/freeWAIS-sf/Linux/
    (the filename is fws2062-elfbin.tgz, and it''s stored in the /internet directory).
    It''s an older version of WAIS, but it''s still serviceable. You''ll want to check
    out freeWAIS if you want to link indexes to a Gopher server.


    The documentation for freeWAIS can be found at http://ls6-www.informatik.uni-dortmund.de/ir/projects/freeWAIS-sf/index.html.


    # Harvest


    The Harvest technology serves as the basis for the Glimpse tools detailed earlier
    in this chapter. In addition, Harvest is available in source-code form and binary
    format at http://harvest.transarc.com/. (This is also where the Harvest documentation
    is stored, so you''ll want to'
