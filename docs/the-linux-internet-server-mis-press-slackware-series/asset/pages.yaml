    HW cursor being chopped off when positioned close to the right edge of the screen.


    +   5. Reference clock value for IBM RAMDACs


    Cards with IBM RGB RAMDACs use several different input frequencies for the clock
    synthesizer which can''t be probed without some knowledge of the text mode clocks
    (which may be a wrong assumption if you''re using non-standard text modes). Here
    is the procedure how you should find out the input frequency:


    First run


