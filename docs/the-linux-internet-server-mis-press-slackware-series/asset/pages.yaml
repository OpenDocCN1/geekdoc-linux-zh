- img_proc: true
  md: '# Apache Modules: Adding Functionality to the Web Server


    Apache uses modules, made up of C-language files, that add functionality to the
    Web server. Many of these modules were compiled in the httpd file that ships as
    part of Slack Linux. Other modules were not, which means that if you want the
    functionality found in the module, you''ll need to recompile the Web server using
    the instructions found earlier in this chapter.


    Why should you pay attention to these modules? Because the module has been compiled
    in the Web server, you''ll have access to the commands (or, in Apache parlance,
    directives) listed in the summaries of the modules. These commands can be included
    in configuration scripts.


    The following sections will cover the modules already compiled into Apache. Later,
    on optional modules will be covered. These optional modules can be found on the
    Internet at http://www.apache.org. The descriptions of,the modules are based directly
    on the Apache documentation, also viewable at http://www.apache.org. After a description
    of these modules, there will be instructions on how to add modules to the Apache
    Web server.


    # mod_access Module


    This module is contained in the mod_access.c file and is compiled by default.
    It provides access control based on client hostname or IP address. There are three
    possible directives: allow, deny, and order.


    +   allow

    Syntax: allow from host ...

    Context: directory, .htaccess

    Override: limit

    Status: base'
  merge: -1
  pgno: 285
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 263


    The `allow` directive affects which hosts can access a given directory; it is
    typically used within a `<Limit>` section. Host is one of the following:


    +   * All (all hosts are allowed access).

    * A (partial) domain-name (A whose name is, or ends in, this string is allowed
    access).

    * A full IP address (An IP address of a host is allowed access).

    * A partial IP address (The first 1 to 3 bytes of an IP address, for subnet restriction,
    is allowed access.)


    For example,


    ```

    allow from .ncsa.uiuc.edu

    ```


    allows all hosts in the specified domain.

    This directive compares whole components; `bar.edu` would not match foobar.edu.


    deny

    Syntax: deny from host ...

    Context: directory, .htaccess


    The `deny` directive affects which hosts can access a given directory; it is typically
    used within a `<Limit>` section. Host is one of the following:


    +   * All (All hosts are allowed access).

    * A (partial) domain-name (A whose name is, or ends in, this string is allowed
    access).

    * A full IP address (An IP address of a host is allowed access).

    * A partial IP address (The first 1 to 3 bytes of an IP address, for subnet restriction,
    is allowed access.)'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'For example,


    ```

    deny from 16

    ```


    denies access to all hosts in the specified network.


    This compares whole components; bar.edu would not match foobar.edu.


    # order


    ```

    Syntax:    order ordering

    Default:   order deny,allow

    Context:   directory, .htaccess

    ```


    The order directive controls the order in which allow and deny directives are
    evaluated. Ordering is one of:


    +   * deny,allow (The deny directives are evaluated before the allow directives.)

    * allow,deny (The allow directives are evaluated before the deny directives.)

    * mutual-failure (Only those hosts that appear on the allow list and do not appear
    on the deny list are granted access.)


    For example,


    ```

    order deny,allow deny from all allow from .ncsa.uiuc.edu

    ```


    Hosts in the ncsa.uiuc.edu domain are allowed access; all other hosts are denied
    access.


    # Mod_actions Module


    This module is contained in the mod_actions.c file and is compiled by default.
    It provides for executing CGI scripts based on media type or request method.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 265


    This module ideal lets you run CGI scripts whenever a file of a certain type is
    requested. This makes it much easier to execute scripts that process files. There
    are two directives: Action and Script.


    # Action


    +   - Syntax: Action mime-type cgi-script

    - Context: server config, virual host, directory, .htaccess

    - Override: fileInfo

    - Status: base


    This directive adds an action, which will activate the specified cgi-script when
    a file of content type mime-type is requested. It sends the URL and file path
    of the requested document using the standard CGI PATH_INFO and PATH_TRANSLATED
    environment variables.


    # Script


    +   - Syntax: Script method cgi-script

    - Context: server config, virual host, directory

    - Status: base


    This directive adds an action, which will activate the specified cgi-script when
    a file is requested using the method of HTTP method, which can be one of GET,
    POST, PUT, or DELETE. It sends the URL and file path of the requested document
    using the standard CGI PATH_INFO and PATH_TRANSLATED environment variables.


    The Script command defines default actions only. If a CGI script is called, or
    some other resource that is capable of handling the requested method internally,
    it will do so. Also note that script with a method of GET will only be called
    if there are query arguments present (like foo.html?hi). Otherwise, the request
    will proceed normally. For example,


    ```

    Script GET /cgi-bin/search      #e.g. for <INDEX>-style searching

    Script PUT /~bob/put.cgi

    ```'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    # Mod_alias Module


    This module is contained in the mod_alias.c file and is compiled by default. It
    provides for mapping different parts of the host filesystem in the document tree
    and also for URL redirection.


    The following directives are supported: Alias, Redirect, and ScriptAlias.


    # Alias


    +   - Syntax: Alias url-path directory-filename

    - Context: server config, virtual host

    - Status: base


    The Alias directive allows documents to be stored in the local filesystem other
    than under the DocumentRoot. URLs with a (%-decoded) path beginning with url-path
    will be mapped to local files beginning with directory-filename. For example,


    ```

    Alias /image /ftp/pub/image

    ```


    A request for http://myserver/image/foo.gif would cause the server to return the
    file /ftp/pub/image/foo.gif.


