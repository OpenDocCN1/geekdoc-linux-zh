    # WN Security


    A great deal of effort has gone into attempting to make WN as secure as possible.
    Security has received the highest priority in all design decisions. This is not
    grounds for WN maintainers to feel that they can'
  merge: -1
  pgno: 367
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 345


    lessen their vigilance, however. The first thing you should be aware of is that
    there is a trade-off between security and functionality. You can have high security
    and restricted functionality or lower security with greater functionality or something
    in between. WN is designed to let the maintainer choose the point on this continuum
    he or she is comfortable with. This section tries to discuss the various options
    you as a maintainer will have and what are the implications of your choices are.


    First, it is important to understand potential threats to the integrity of a system
    running the WN server. There are two types of threat that this document addresses
    separately: (1) external, from a client or purported client on a remote host,
    and (2) local, from a user with an account on the server host.


    After reading this section you may wish to look at the section on file ownership
    and permissions.


    # External Threats


    The maintainer''s objective is to prevent any unauthorized access to (or alteration
    of) files on the host system. Scripts or programs run on the server with CGI protocols
    cause special problems and are discussed separately. If you do not need to use
    any executable scripts, you should run the server with the -e option. The -e option
    disallows any attempt to execute a command on your server and does not allow any
    data sent by a client to be written to a temporary disk file. In this situation
    the key to WN security is twofold: No document is served without explicit permission
    from the maintainer, and nothing is written to disk on the server except the log
    file.


    The basic philosophy of WN security is that by default no client requests are
    granted. Permission to serve a document must be explicitly granted by the maintainer.
    The WN server keeps a small database in each directory of its data hierarchy,
    which contains information about files to be served from that directory. In particular
    no document can be served unless explicit permission to serve it is given in such
    a database.


    Despite this strong security foundation, several additional steps are prudent.
    The most important is that the maintainer must ensure that no untrusted person
    has write access to any part of the WN hierarchy. For example, an incoming anonymous
    FTP directory should never be part of a WN hierarchy (better yet don''t have one
    at all), because an attacker'
  merge: -1
  pgno: 368
- img_proc: true
  md: '# 346 CHAPTER 4: Setting Up a Web Server


    might be able to put a database there granting illicit access to some documents
    on the server system for which the user ID running the server has read permission.
    There are several defenses against such a counterfeit database, and we discuss
    them next.


    # Protecting your Index.cache Files


    All security control for the WN server resides in the per-directory database files
    (these files have the default name index.cache). Consequently, it is extremely
    important to guarantee their integrity. There are several command-line options
    for the server that help protect against counterfeit index.cache files.


    The -t and -T options allow you to specify a trusted owner or group owner (not
    both) for index.cache files. To do this use the -t uid# or -T gid# options to
    wn or swn. When invoked with only the -t argument (or the -T argument), wn or
    swn will not serve a document unless the index.cache file listing the prescribed
    owner or gid. This uid# or gid# should be that of the maintainer, not the user
    ID under which wn or swn runs. Indeed, for security reasons if the server has
    been started as root and changed to another uid, it will refuse to use an index.cache
    file whose owner is the user ID under which it is running. If on your server all
    index.cache files are created by a single user or a single group, I strongly recommend
    using the -t or -T option.


    This added security is weakened if you use the -u option, which allows index.cache
    files owned by untrusted users, but only permits them to grant access to files
    owned by the same user as index.cache file. This option might be appropriate if
    you permit users to have their own home page on your server. It would allow users
    to serve documents that they own but no others. But if the -u and the -t argument
    are used, take effect, except the trusted user specified with the -t option is
    exempt from its restrictions.


    When the server is run, it must assume the permissions of some user on the host.
    Which is determined when you run the configure Perl script or by defining USER_ID
    in config.h. It is important that this USER_ID have as few permissions as possible.
    On many systems there is a user called nobody with minimal permissions. The numeric
    user id of nobody is a good choice and the default choice of the WN configure'
