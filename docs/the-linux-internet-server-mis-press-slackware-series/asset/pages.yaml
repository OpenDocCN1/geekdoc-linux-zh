    # mod_cern_meta Module


    This module is contained in the mod_cern_meta.c file and is not compiled by default.
    It provides for CERN HTTPD myfile semantics.


    This module emulate the CERN HTTPD myfile semantics. Meta files are HTTP headers
    that can be output in addition to the normal range of headers for each file accessed.
    They appear rather like the Apache.asis files and are able to provide a crude
    way of influencing the Expires: header, as well as providing other curiosities.
    There are many ways to manage meta information; this one was chosen because there
    is already a large number of CERN users who exploit this module.


    More information on the CERN myfile semantics is available at http://www.w3.org/pub/WWW/Daemon/User/Config/General.html.


    There are two directives supplied with this module: MetaDir MetaSuffix.


    # MetaDir


    +   - Syntax: MetaDir directory name

    - Default: MetaDir.web

    - Context: server config

    - Status: base


    This specifies the name of the directory in which Apache can find meta information
    files. The directory is usually a hidden subdirectory of the directory that contains
    the file being accessed. It is set to look in the same directory as the file.


    # MetaSuffix


    +   - Syntax: MetaSuffix suffix

    - Default: MetaSuffix.meta

    - Context: server config

    - Status: base'
