    # # HARDWARE SUPPORTED BY SLACKWARE LINUX


    This is a listing of the hardware supported by Slack 96, which can be found on
    the accompanying CD-ROM. It’s based on the Linux Hardware Compatibility HOW-TO,
    which can be found at http://sunsite.unc.edu/mdwlinux.html. This appendix doesn’t
    cover all the possible hardware options for Slack Linux; instead, only those hardware
    issues pertaining to using Linux as an Internet server are covered. (For instance,
    a discussion of using a Mattel Powerglove with Linux isn’t really of interest
    when discussing Internet servers.)


    # ## Bus


    ISA, VLB, EISA, and PCI buses are supported. PS/2 MicroChannel buses are not supported
    in the Slack 96 distribution.


    # ## CPU


    All the major CPUs from the major manufacturers (Intel, AMD, and Cyrix) are supported.
    There’s no reason for a separate math coprocessor with Linux, as it supports FPU
    emulation.'
  merge: -1
  pgno: 536
- img_proc: true
  md: '# 514 APPENDIX B: Hardware Supported by Slack Linux


    # Hard-Drive Controllers


    Slack Linux works with standard IDE, MFM, and RLL controllers. In addition, Enhanced
    IDE (EIDE) interfaces (with up to two IDE interfaces and up to four hard drives
    and/ CD-ROM drives) are supported. Explicitly supported are the following EIDE
    interfaces: CMD-640, DTC 2278D, FGI/Holtek HT-6560B, RZ1000, and Triton (82371FB)
    IDE (with busmaster DMA). Also supported are ESDI controllers that emulate the
    ST-506 (MFM/RLL/IDE) interface; generic 8-bit XT controllers also should work.


    # SCSI Controllers


    The following SCSI controllers are supported: AMI Fast Disk VLB/EISA (BusLogic
    compatible); Adaptec AHA-1505/1515, AHA-1510/152x, AHA-154x, AHA-174x, AHA-274x,
    AHA-2940/3960; Always IN 2000; all BusLogic models; DPT PM2001, PM2012A, Smartcache;
    DTC 329x; Future Domain TMC-16x0, TMC-3260, TMC-8xx, TMC-950; Media Vision Pro
    Audio Spectrum 16 SCSI; NCR 5380 generic cards, 53400 (Trantor T130B), 53c06a
    (Acculog ISaport/Media Vision Premium 3D SCSI), 53c7x0, 53c80; Qlogic/Control
    Concepts SCSI IDE (FAS508); Seagate ST-01/ST-02; SoundBlast 16 SCSI-2; Trantor
    T128/T28F/T228; UltraStar 14F/24F/34F; and Western Digital WD7000 SCSI.


    If you deviate from this list, be careful. There are some cheap sound boards on
    the market that purport to be SCSI interfaces, but these are used mainly with
    CD-ROM drives and not other SCSI devices (such as a hard-disk storage system).


    There are special patches available for the following SCSI controllers: AM53c974,
    AM79C974 (PCI; used for Compaq, H-P, and Zeos onboard SCSI) (ftp://sunsite.edu/pub/linux/kernel/patches/scAM53c974-0.3.tgz);
    Adaptec ACB-40xx SCSI-MFM/RLL bridgeboard (ftp://sunsite.edu/pub/linux/kernel/patches/scsi/adaptec-40XX.tar.gz);
    Always Technologies AL-500 (ftp://sunsite.edu/pub/linux/kernel/patches/scsi/al500-0.2.tar.gz);
    BusLogic (ftp://ftp.dandelon.com/BusLogic-1.0-beta.tar.gz); Iomega PC/2B (ftp://sunsite.edu/pub/'
  merge: -1
  pgno: 537
- img_proc: true
  md: '# APPENDIX B: Hardware Supported by Slackware Linux 515


    Linux/kernel/patches/scsi/iomega_pc2-1.1.x.tar.gz); Qlogic (ISP1020)

    (ftp://sunsite.unc.edu/pub/Linux/kernel/patches/scsi/isp1020-0.5.gz); and Ricoh

    GSI-8 (ftp://tsx-11.mit.edu/pub/linux/ALPHA/scsi/gsi8.tar.gz).


    Parallel-port SCSI adapters are not supported.


    # Hard Drives


    If the controller is supported, the hard drive should work with no

    problems. However, all-direct access SCSI devices with a block size of

    256, 512, or 1024 bytes should work, although other block sizes will not

    work (this can often be fixed by changing the block and/or sector sizes

    using the MODE SELECT SCSI command.


    # I/O Controllers


    Virtually all standard serial, parallel, and joystick I/O controllers are

    supported, including those featuring 8250, 16450, 16550, and 16550A

    UARTs. In addition, cards that support nonstandard IRQs (like IRQ > 9)

    can be used.


    # Multport Controllers


    Multport controllers come in the form of intelligent cards and

    nonintelligent cards. Supported nonintelligent cards are AST FourPort

    and clones (4 port); Accent Async-4 (4 port); Arnet Multiport-8 (8 port);

    Bell Technologies HUB6 (6 port); Boca BB-1004, 1008 (4, 8 port), BB-2016

    (16 port), IO/AT66 (6 port), IO 2by4 (4 serial/2 parallel, uses 5 IRQs);

    Computune ValuePort (4, 6, 8 port) AST FourPort compatible);

    DigiBoard PC/X (4, 8, 16 port); Comtrol Hostess 550 (4, 8 port); PC-

    COMM 4-port (4 port); SIIG I/O Expander 45 (4 port, uses 4 IRQs); STB

    4-COM (4 port); Twincom ACI/550; and Usenet Serial Board II (4 port).


    Support intelligent cards are Cyclades Cycle-8Y/16Y (8, 16 port) and

    Stallion EasyIO/EasyConnection 8/32, 8/64ONboard/Brbym/Stallion.'
