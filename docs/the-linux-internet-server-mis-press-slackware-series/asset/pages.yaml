  md: '# CHAPTER 4: Setting Up a Web Server 277


    # Mod_cgi Module


    This module is contained in the mod_cgi.c file and is compiled by default. It
    provides for execution of CGI scripts. Any file with MIME type application/x-httpd-cgi
    will be processed by this module.


    Any file that has the MIME type application/x-httpd-cgi will be treated as a CGI
    script and run by the server, with its output being returned to the client. Files
    acquire this type either by having a name ending in an extension defined by the
    AddType directive or by being in a ScriptAlias directory.


    When the server invokes a CGI script, it will add a variable called DOCUMENT_ROOT
    to the environment. This variable contains the value of the DocumentRoot configuration
    variable.


    The server will set the CGI environment variables as described in the CGI specification,
    with the following provisos:


    +   - REMOTE_HOST will only be set if the server has not been compiled with MINIMAL_DNS.

    - REMOTE_IDENT will only be set if IdentityCheck is set to on.

    - REMOTE_USER will only be set if the CGI script is subject to authentication.


    # Mod_dir Module


    This module is contained in the mod_dir.c file and is compiled by default. It
    provides for directory indexing.


    This module controls the directory indexing. The index of a directory can come
    from one of two sources:


    +   - A file written by the user, typically called index.html. The DirectoryIndex
    directive sets the name of this file.

    - A listing generated by the server. The other directives control the format of
    this listing. The AddIcon, AddIconByEncoding, and AddIconByType are used to set
    a list of icons to display for various file types; for each file listed, the first
    icon listed that matches the file is displayed.'
