  md: '# CHAPTER 3: Installing Linux and Internet Components 93


    # Setting Up a Printer


    When you installed Slack Linux, you were asked about the location of your printer.
    This information was translated into the UNIX equivalent; a printer on the first
    parallel port is assigned a device name of /dev/lp0. Similarly, if you''re using
    a serial printer (they are getting rarer and rarer), it will probably be assigned
    a device name of /dev/ttyS1.


    This simple configuration means that you can immediately print ASCII characters,
    with the Linux system treating your printer like a simple line printer. Printing
    is actually a more involved process that you might think. Printing in Linux involves
    the following steps:


    +   When your computer boots, the lpd daemon runs, looking at the /etc/printcap
    to see what printer you''re using; the process continues to run throughout your
    Linux computing session.


    +   When you print a document with lpr, the lpd command actually handles the print
    job.


    +   To change anything in the printing process (like when you want to kill or
    suspend print jobs), the Ipc and Iprm commands are used to talk with the lpd daemon.


    Obviously, you''ll want to make sure /etc/printcap contains the correct information
    about your printer. When you look at it in a text editor like elvis or emacs,
    you''ll see that all the lines are commented out with # characters. Most popular
    printers are listed in this file (such as HP LaserJets) and if you uncomment the
    lines specific to your printer, you should be able to use it.


    It''s important to get this information correct, since Linux printers aren''t
    configured properly have a tendency to suffer from the "staircase effect," where
    lines are staggered at the beginning:


    > We hate the staircase effect.


    It makes our documents look really stupid.

    And it makes it hard for us to do our work properly.

    In fact, we find that we don''t print things when our printer is misconfigured.'
  merge: -1
  pgno: 116
- img_proc: true
  md: '# 94 CHAPTER 3: Installing Linux and Internet Components


    # Working with a UPS


    Slack Linux supports uninterruptible power supplies (UPSes). This support is rather
    easy to implement—first you get a UPS, hook it up to your PC, and run a Linux
    daemon called power that monitors the power situation and shuts down the system
    if necessary. (It will also halt the shutdown if the power appears in time.)


    For more information, check out the man page for the powerd command.


    # Installing and Configuring X


    Because the Linux Internet server isn''t a machine that you''re likely to use
    often as a terminal (you''ll want to perform most administrative tasks on other
    machines), setting up the X Window System (in the form of XFree86) isn''t involved
    as a task as you would normally be. For you, setting up the basic X Window System
    will be enough.


    Before you get started, you''ll need to know some things about your server''s
    graphics capabilities, such as the type of graphics card, how much memory the
    graphics card has, and what sort of mouse is attached to the Linux server. Don''t
    worry if you don''t have these facts at hand—you can bluff your way through the
    installation process. Basically, the information you need to know falls under
    the following categories:


    +   * Video card: what kind of chipset your card uses (such as the ubiquitous
    S3 chipset), the vendor and name of your card (such as a Diamond Stealth), and
    the amount of RAM your card has (such as 1MB). The most most setting setting here
    is the kind of chipset. You may need to inspect your video card physically to
    see what sort of chipset is used. If you''re using a machine that has Windows
    95 already installed, you can look at the Windows 95 configuration information
    to see what graphics card is installed.'
  merge: -1
