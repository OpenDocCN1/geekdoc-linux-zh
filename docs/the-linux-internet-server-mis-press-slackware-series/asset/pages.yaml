  md: '# CHAPTER I:The Internet, Intranets and Slackware Linux


    # Hardware Tips


    Linux purists love to brag about how little hardware power is needed to adequately
    run Linux. However, evaluating hardware needs for a Linux Internet server requires
    a little different orientation than the average Linux installation.


    This is true for two reasons: the nature of an Internet server and using Linux
    purely as an Internet server.


    Unless you''re using a lot of fancy programs based on CGI, your Linux box won''t
    spend a lot of time responding to individual Internet requests. Basically, an
    Internet request comes to your Linux box, which then begins a new process to deal
    with it. After the request, the transaction is completed (for the most part).
    For instance, a Web browser may ask your Web server for a Web page. After the
    Web page is sent to the browser, the transaction is complete. The Web browser
    may place information on this Web page and send it back to the server, but this
    is considered another separate transaction, with its own process.


    These multiple processes don''t really eat up a ton of CPU power, unless you have
    some pretty involved CGI scripts running. And in and of themselves, they don''t
    eat up a ton of RAM, either. However, a good Web server—like the Apache Web Server—will
    frequently requested Web pages so that they can be sent directly from RAM instead
    of hard disk. This speeds up the transaction time—RAM is always faster than hard
    disk—and decreases the wear and tear on your hard drive. Still, you''ll find that
    a Web server that''s used moderately will require a good amount of time to go
    to hard disk.


    However, if you''re running a Linux Web server, one factor will actually decrease
    the amount of RAM and firepower you''ll need: there will be no purpose to running
    the Window System. Let''s face it—XFree86 is a memory hog. While some tools will
    require X (like tkHTML for creating Web pages), there''s actually no need to be
    running the X Window System on your server. Since X on its own requires at least
    4 Megabytes of RAM (up to 8MB if you''re running multiple tasks), you can subtract
    this amount from your Web server.


    With all these factors in mind, here are some hardware tips if you''re buying
    a new Linux box or adapting an older PC for Linux:'
  merge: -1
  pgno: 41
- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slack Linux 19


    +   - Buy enough RAM. You''ll want to cache as much information as you can in
    RAM. Since the price of RAM is so low these days, you''ll want to consider having
    at least 16MB of RAM, and perhaps even more 32MB. Since you''re not running X
    (at least not running it consistently), you''ll have a lot of RAM freed up both
    for Linux and Internet requests.


    +   - Go for the fastest hard drive you can. Since there''s an inevitable amount
    of churn to your your hard drive, you''ll want to make sure it''s as fast as possible.
    Like RAM prices, hard-drive prices have been decreasing lately. In the PC world,
    the fastest hard drives are SCSI hard drives, which are a tad more expensive than
    standard IDE drives. However, the extra expense will be worth it.


    +   - Don''t sweat the processor speed. Most Internet transactions are remarkably
    simple and don''t require a ton of processing power. If you''ve got an older 90-MHz
    Pentium that you want to adapt for your Internet server, go ahead. Your users
    won''t notice the difference between a 90-MHz Pentium box and a Pentium Pro box.


    +   - Don''t invest in an expensive graphics card. Most of the time you won''t
    be using the Linux Internet box for your daily computing chores. Why invest in
    a Matrox Millennium graphics card on a box where the monitor will be turned off
    most of the time?


    # Linux on the Network


    When you''re running a Linux box purely as a network server, you probably aren''t
    going to be using it much as a terminal. If this is the case, you don''t need
    to factor in the X Window System (in the form of XFree86) as a factor when evaluating
    your hardware nodes.


    As a matter of fact, you can get by with old 486 boxes if you''re planning on
    multiple boxes running multiple servers. If you are planning on using Linux on
    the enterprise, you''ll want to divide the computing tasks among several PCs.
    Managing a news feed, for instance, requires a lot of computing resources, both
    in RAM and in hard-disk space.


    If you''re providing a full news feed, electronic mail, and World Wide Web access
    on your server, you''ll probably want to look at two and'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'maybe three PCs for all the traffic. The news should probably reside on its
    own machine if you''re providing a full feed, and you should place the other services
    (mail, Web daemon) on another. In this case, you''ll definitely want to go with
    a router and a direct network feed. (These are things you''ll cover in Chapter
    2.)


    # Some Constants


    In other respects, however, there are some universal rules when you look at a
    hardware installation.


    When it comes to increasing the performance of your Linux Internet server, two
    things directly aid performance: RAM and speedy hard-disk space. Web servers love
    to cache frequently accessed pages, and the more RAM available, the more caching
    can occur. Even though Internet servers and content don''t actually eat up that
    much hard-disk space, there''s a lot of churning hard drive as Web documents are
    summoned for sending down the network. In these cases, the fastest access to the
    hard disk is the best, and you can get the best performance from high-performance
    (read: expensive) SCSI boards and hard drives. Throw a high-performance PCI bus
    into the mix, and you''ve got the workings of a really fast server.


    This book doesn''t pretend to be a hardware guide to servers. Basically, buy as
    much computer as you can get away with. If you''ve been given a rather liberal
    budget because the marketing weasels in your firm deem it absolutely necessary
    to get a fast presence on the Internet, go ahead and spring for that dual-Pentium
    Pro system with 32 megs of EDO RAM, a PCI bus, and a 2 gig SCSI disk. If your
    resources are more modest, consider overhauling an older Pentium PC with a PCI
    bus and expanding its RAM and hard-disk space to as much as you can afford.


    # Some Planning Criteria


    You shouldn''t assume that you can just throw a server on the Internet and achieve
    instant success. Indeed, you''ll need to make some important decisions as you
    plan your Internet server. Many of these criteria will be'
  merge: -1
  pgno: 43
- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slackware Linux 21


    explained more fully throughout this book. As you begin your Internet server journey,
    however, keep in mind the following questions:


    +   - What services should I offer? A Web server is mandatory, since most Internet
    Web usage is now funnelled through a Web browser. In addition, electronic mail
    is also mandatory, since electronic mail represents an easy way for your users
    to communicate with each other and your customers. Past that, you''ll need to
    make some important decisions. Your data needs calls for a Gopher server, which
    can be handy for larger text documents? Should you incorporate a search engine
    for indexing the contents of your Web site? Should you have a Usenet feed, and
    what newsgroups should feed incorporate?


    +   - Do I need to be connected to the Internet at all? Internet technology can
    be used to create in-house intranets, which are used to connect users within your
    corporation. However, there''s no connection to the outside world, or perhaps
    a partial connection (such as electronic mail). The advantage is that your workers
    won''t be wasting their time perusing the Playboy, Penthouse, and Screw Web sites.
    The disadvantage is that the vast resources of the Internet won''t be available
    to your workers.


    +   - What development tools should I look at? So far, Web development tools have
    relied on scripting languages like Perl and Tcl, which you''ll learn about Chapter
    12. For many simple tasks, like the gathering of user information and simple forms,
    these two scripting languages are more than adequate, and they both ship as part
    of Slack Linux. When it comes to more complicated tasks such as multimedia and
    more elaborate data-acquisition needs, you may want to consider next-generation
    tools like Java (as promoted by Sun Microsystems and Netscape Communications).
    The Java Developers'' Kit is included on the accompanying CD-ROM, and it too will
    be covered in Chapter 12.


    +   - Am I aware of all the legal issues involved? The Internet poses a stiff
    challenge to the premises of legal theory developed in the United States. Some
    of the challenges have been successfully decided (for instance, the courts have
    generally agreed that trademark law can be applied to the Internet), while'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'others are still in a state of evolution, such as obscenity. So, the best advice
    is to protect yourself and your company. Put a disclaimer on every page open for
    outside content, telling Internet surfers that the views are not necessarily those
    of the company running the site. Tell your users to respect the Internet as a
    business tool—inappropriate use of the Internet is considered grounds for dismissal
    in many companies, and you should decide if this is a policy you want to adopt.


    # An Overview of Services


    In this book, we''ll discuss almost all the possible services in their own chapters.
    Here, we''ll introduce each. In each of these cases, both clients and servers
    are included on the accompanying CD-ROM.


    # The Web


    So far this book, as well as the rest of the world, has focused on the World Wide
    Web as the engine fueling the growth of the Internet. And indeed, the Web is one
    of the most exciting developments in recent years, and potentially a harbinger
    of tomorrow''s media.


    As you already know from the beginning of this chapter, the Word Wide Web is nothing
    more than a series of file transfers between a Web server and a Web browser. To
    implement the World Wide Web on your site, you must be running a Web server. One
    such Web server, the Apache Web Server, is included as part of Slack Linux. In
    Chapter 4, the majority of the discussion will focus on the Apache Web Server,
    which is the most popular Web server on the Internet (according to the research
    site of ServerWatch, run by CMP). However, alternatives to the Apache Web Server
    are discussed in Chapter 4, both commercial and noncommercial.


    In addition, there are noncommercial Web browsers included on the accompanying
    CD-ROM, which you can distribute to your Linux users. The Arena Web browser is
    shown on Figure 1.1.'
  merge: -1
