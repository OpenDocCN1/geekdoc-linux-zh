    # More on T1 Lines


    Some of you will find that a T1 line is a necessity—especially if you''re setting
    up a situation where many of your users will also be connecting to the Internet
    via your network. These leased lines are sold by local telephone companies, and
    they''re charged on the basis of distance from the switching service. Your bandwidth
    with a T1 line is 1.544 megabits per second.


    Physically, the T1 line connects to a router at your office. An Ethernet connection
    is used between your server and the router. The router allows you to connect other
    Web servers to the T1 line, as well as any other specialized servers you might
    have (for example, you may want to install a separate mail server if you experience
    high electronicmail traffic). Most ISPs will sell you a router and a CSU/DSU,
    as well as any other cabling and equipment you may need.


    Currently, the manufacturer of most Internet routers are Cisco Systems (http://www.cisco.com).
    However, for one reason or another, Livingston (http://www.livingston.com) routers
    are popular among Linux networking folks (if information in the newsgroups and
    HOW-TOs is correct).


    There are fractional T1 lines, where you don''t have full access to an entire
    T1 line—indeed, you have access to 24 channels of 64Kbps. A fractional line represents
    a good cost savings from a T1 line (although it must be pointed out that the costs
    of setting up a T1 and a fractional T1 line are the same) and provide your company
    with a lot of flexibility.


    Networking hardware tends to be a world unto itself, and this book isn''t written
    for the network engineer whose heart pumps a little faster when hardware is discussed.
    If you''re into hardware,you''ll want to check out a hardware-oriented networking
