    C:> copy \DOS\FORMAT.COM A:

    1 file(s) copied

    ```


    You may also want to copy onto floppy diskettes the files that restore your system
    backup, if you used operating-system utilities to create the backup. Check your
    documentation for the specific files, since they differ among operating systems.


    ![](img/7488e49c99dd1fc906878692fde2ec31_73_0.png)


    # What Are FDISK and FORMAT?


    FDISK.EXE is the program that creates MS-DOS partitions. Every operating system
    has a program that does something similarly (you''ll use the Linux fdisk command
    later in this process). You''ll need to use the partitioning software specific
    to the operating system—for example, you can''t use FDISK to create Linux or OS/2
    partitions. FDISK.EXE works very simply: You delete an existing partition or partitions
    and create new partitions in their place.'
