    # ISDN Cards


    In general, ISDN cards that emulate special modems or common Ethernet adapters
    don''t need any special drivers. You''ll need patches to the Linux kernel to use
    the following ISDN cards: 3Com Sonix Arpeggio (ftp://sunsite.unc.edu/pub/Linux/kernel/patches/network/sonix.tgz);
    Combinet EVERYWHERE 1000 ISDN (ftp://sunsite.unc.edu/pub/Linux/patches/network/combinet1000isdn-1.02.tar.gz);
    Diehl SCOM card (ftp://sunsite.unc.edu/pub/Linux/kernel/patches/network/isdndrv-0.1.1.tar.gz);
    and ICN ISDN/Teles ISDN/Creatix AVM ISDN cards (ftp://ftp.franken/pub/isdn4linux).


    # ATM Interfaces


    Slack Linux does not support any ATM adapters out of the box. There is only one
    patch, and that is for the Efficient Networks ENI155P-MF 155 Mbps ATM adapter;
    you can find it at http://lrc.epfl.ch/linux-atm/.


    # Frame Relay Cards


    Slack Linux does not support any frame relay cards out of the box. There is a
    driver for the Sangoma S502 56K frame relay card at ftp://ftp.sovereign.org/pub/wan/fr/.'
