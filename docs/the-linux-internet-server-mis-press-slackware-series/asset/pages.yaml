  md: '# 146 CHAPTER 3: Installing Linux and Internet Components


    (-) S3: with IBM RGB52x programmable clock (MCLK 66.000 MHz)

    (-) S3: with refclock 16.000 MHz (probed 15.952 & 16.041)


    There will be a ''good guessed'' value which is used and probed two values in
    brackets based on the 25MHz and 28MHz text clocks. This probing can only work
    if you run a normal 80x25 or 80x28 text mode!


    The refclock values known so far are:


    +   STB Velocity 64 24 MHz

    Genoa VideoBlitz II AV 50 MHz

    Hercules S3 964 50 MHz

    Hercules S3 968 16 MHz

    #9 Motion 771 16 MHz


    depending on the quartz on your card and may be other features like an additional
    clock chip on the Genoa card (which is a 14.3MHz quartz).


    If you claim that your card has a 16MHz card but it really uses 50MHz, all pixel
    clocks will be tripled and a 640x480 mode with 25MHz will use a 75MHz pixel clock,
    so be very careful.


    If you found the right refclock, you should set it in the config file (device
    section) e. with:


    ```

    s3RefClk 16

    ```


    ```

    s3RefClk 50

    ```


    so that this value will be used even if you use another text mode and probing
    fails!


    +   6. How to avoid ''snowing'' display while graphics operations


    For cards with S3 Vision864 chip there is an automatic correction that depends
    on the pixel clock and the memory clock MCLK when the S3 chip operates. For most
    chips this value can''t be read (only the S3 SDAC allows reading the MCLK value
    so far), so this value has to be estimated and specified by the user (the default
    is 60 [MHz]).'
  merge: -1
