- img_proc: true
  md: '# CHAPTER 6: Indexing with Glimpse and GlimpseHTTP 387


    | Option | Purpose |


    | -file_name |


    This option has a different meaning for agrep than for glimpse. In glimpse, only
    the files whose names are listed in file_name are matched. (The filenames appear
    as in .glimpse_filenames). In agrep, the file_name contains the list of the patterns
    that are searched.


    | -F file_pattern |


    Limits the search to those files whose name (including the whole path) matches
    file_patern. This option can be used in a variety of applications to provide limited
    search for even one large index. If file_patern matches a directory, then all
    files with this directory on their path will be considered. To limit $ at the
    end of the pattern, file_patern can be a regular expression and even a Boolean
    pattern. This option is implemented by running agrep -F pattern on the list of
    file names obtained from the index. Searching the index itself takes the same
    amount of time, but limiting the second phase of the search to only a few files
    can speed up the search. For example, glimpse -F ''^src\*'' will search for needle
    in all .c files with src somewhere along the path. The -F file_pattern must appear
    before the search pattern (e.g. glimpse -F ''^\$'' will not work). It is possible
    to use some of agrep''s options when matching filenames. In this case all options
    as well as the file_pattern should be in quotes. (-B and -v do not work well as
    part of file_pattern). For example, glimpse -F ''1 gopher'' will allow one spelling
    error when matching gopher to the filenames (so gopher and gopher will be considered
    well). glimpse -F -v .\c counter will search for counter in all files except for
    .c files.


    | -g |


    Prints the file number (its position in .glimpse_filenames) rather than its name.


    | -G |


    Outputs the (whole) files that contain a match.


    | -h |


    Does not display filenames.


    | -H directory_name |


    Searches for the index and other .glimpse files in directory_name. The default
    is the home directory. This option is useful, for example, if several indexes
    are maintained for different archives (e.g. for mail messages, for one source
    code, for one articles).


    | -i |


    Launches a case-insensitive search (e.g. A and a are considered equivalent). Glimpse''s
    index stores all patterns in lowercase. When -i is used with the -w option, the
    search may become much faster. It is recommended to use -i and -w as defaults,
    for example, through an alias. Use the following alias in our .shrc .br alias
    glwi glimpse -i''.


    | -k |


    Sets the order of insertion to k (k is a positive integer). This option does not
    work with regular expressions.


    | -j |


    If the index was constructed with the -t option, then -j will output the last
    modification dates in addition to everything. There are no major performance penalties
    for this option.


    | -J host_name |


    Used in conjunction with glimpseserver (-C) to connect to one particular server.'
