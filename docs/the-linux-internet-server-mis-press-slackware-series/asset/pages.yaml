  md: 'CHAPTER 5: Setting Up Gopher


    # Gopher


    The World Wide Web is only the beginning of the services that you can offer via
    the Internet, although most of users will be desiring the Web. In this chapter,
    we cover a predecessor to the World Wide Web, called Gopher.


    Even though Gopher has been shoved aside lately because of the overwhelming popularity
    of the World Wide Web, it''s still a viable Internet service. Developed at the
    University of Minnesota (where the school mascot is a Golden Gopher), Gopher is
    a menu-based interface to files and directories, much like the World Wide Web
    is nothing more than a graphical-based interface to files and directories. When
    a Gopher client connects to a Gopher server, the server returns a numbered set
    of lines. The user can choose one of the lines. If it''s a Gopher text file, the
    file will be displayed on the screen. If it''s a link to another set of listings,
    then the listings will be displayed. If the line represents a downloadable file,
    the file will be downloaded to your machine.


    If this sounds lot like the World Wide Web in a stripped-down format, you''re
    right. Basically, Gopher was designed for an assortment of machines, including
    dumb terminals, where the only input might be alphanumeric. The original Gopher
    system at the University of Minnesota was designed to be used in libraries with
    dumb terminals, and so users would need to scroll through the list or type in
    a number. Now, of course, when all you need to do is point and click on an item
    either using a Web browser or a newer Gopher client, these menus and text-based
    screen elements seem a tad antiquated, but you must remember that when Gopher
    was originally developed, it was on the cutting edge of technology—and one that
    contributed more than a few ideas and concepts to the World Wide Web.


    But don''t use Gopher because of its history; use Gopher because it can actually
    serve some of your computing needs. You may be working in a system that puts a
    lot of time and effort into existing Gopher menus and structures, and if you''re
    moving them over to a Linux Internet server, you may want a way to continue offering
    them to the world. There''s also a compelling reason to look at Gopher—it interacts
    easily with search engines like the Wide Area Indexing Service (WAIS), which will
    be covered later in this chapter. Quite honestly, it''s simple to put together
    a Gopher-based front end to an indexed database. There are literally hundreds
    of those databases out there, all running very well'
  merge: -1
  pgno: 381
- img_proc: true
  md: '# CHAPTER 5: Setting Up Gopher 359


    using Gopher as a text- and menu-based interface. So Gopher can still be an important
    player in your Linux Internet computing arsenal.


    ![](img/7488e49c99dd1fc906878692fde2ec31_382_0.png)


    This book doesn''t cover the original Gopher server software. Why? Because the
    University of Minnesota made noises about wanting payment in order to use Gopher;
    While it''s in my best interests on one level to go along with a payment schedule
    for Gopher (I am a Minnesota taxpayer, after all), it''s not in my best interest
    to point you in the direction of quasi-commercial software when there''s high-quality
    freeware that will also serve your purpose. If you want to check out Gopher source
    code for use on your Linux system, feel free to check out the Gopher home page
    at http://boombox.micro.umn.edu.


    NOTE


    # GN: A Free Gopher


    No Gopher ships natively as part of Slack Linux. However, we have included GN
    2.23 on the accompanying CD-ROM, in the /cdrom/internet directory. Developed by
    John Franks (john@math.nwu.edu) of the Department of Math at Northwestern University
    (and also the developer of WN, which you read about in the previous chapter),
    GN is a multiprotocol server for both Gopher and HTTP. It has the following features:


    +   - GN serves two protocols—gopher0 and HTTP/1.0, the protocol used by WWW clients.
    GN recognizes the protocol from the request and responds appropriately. This allows
    the use of Web browsers like Netscape Navigator in their native mode.

    - Offers tools designed to ease migration from Gopher to the World Wide Web.

    - Allows per-directory access control. You can have different access (by IP address
    or subnet) to every directory if you desire. You don''t need to run different
    servers on different ports to have different levels of access.

    - Supports WAIS index searches.

    - Supports structured files.

    - Supports compressed files.

    - Allows built-in menu hierarchy searches.'
