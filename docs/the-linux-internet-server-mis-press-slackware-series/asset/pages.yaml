  md: '# CHAPTER 10: Miscellaneous Services


    # Commercial Software


    So far in this book we''ve covered the free offerings that are part of the accompanying
    CD-ROM. For the most part, these offerings will take you very far as you make
    your way through the Internet with your own Linux server.


    However, the size of the Linux community is growing to the point where it''s attracting
    the attention of some commercial software developers. While the commercial software
    for Linux isn''t nearly on the scale as it is for the UNIX and Windows NT worlds,
    there are still some interesting offerings that you may want to consider. In the
    rest of this chapter, we look at some of these offerings.


    # StreamWorks


    Audio is a trendy Internet application, in the form of streaming audio, where
    digitally encoded audio is sent from a server to an audio-capable computer on
    the Internet. There, decoding software translates the digital stream into audio.
    The appeal here is that streaming decoding takes place on the fly; there''s no
    need to download huge files, and real-time audio broadcasts (like sporting events)
    can be broadcast via the Internet in a relatively efficient fashion.


    A more challenging task is streaming video, which applies the previous concepts
    to video. Of course, video is a much more bandwidth-intensive application than
    to audio.


    It takes entire suite of products to create streaming audio and video, but you
    can purchase server software to send encoded video and audio from your Linux Internet
    server. The StreamWorks Server from Xing using MPEG compression to send digital
    audio and video from your server.


    There are other competing products on the market, such as Real Audio, but none
    that offer a Linux version. While Real Audio is the most popular encoder on the
    market, in a sense it doesn''t really matter which encoder you use, since all
    of the vendors give away the client software at no charge. Therefore, you could
    supply your users with client software at no cost to you or them.'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# CHAPTER 10: Miscellaneous Services 455


    Since the StreamWorks Server is a commercial product, we''re not going to spend
    a lot of time on it, but you should know that it''s the only commercial streaming-audio
    product that''s been developed for use on a Linux Internet server. For more information
    (including pricing information), check the Web site at http://www.xingtech.com/products/sw_server.html.


    # Sybernet


    If you need to link UNIX or Windows databases—specifically, Sybase databases—you
    may want to look at Sybernet, which links an Apache Web server on Linux with Sybase
    databases. More information can be found at http://linux.sri.com/.


    # Summary


    This short chapter details miscellaneous tools that you''ll want to consider implementing
    on your Linux Internet server.


    In the next chapter, you''ll be exposed to HTML and Web pages.'
