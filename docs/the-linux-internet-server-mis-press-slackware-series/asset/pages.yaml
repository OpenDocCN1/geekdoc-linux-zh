  md: '# 380 CHAPTER 6: Indexing with Glimpse and GlimpseHTTP


    # Search Tools for the Masses


    After you''re thrown up your Web and Gopher pages, you''ll want a way for your
    users to be able to search through them. This isn''t a trivial task—part of the
    Webmaster''s challenge is to give users access to what they want and need, even
    if they have no clue about what they want or how to get it.


    That''s why a good search mechanism is a must for the well-maintained Linux Internet
    Web site. The accompanying CD-ROM comes with the Glimpse search engine, along
    with tools that allow you to integrate Glimpse with your Web pages, as well as
    implementing it on your Linux Internet server. You''ll also learn about GlimpseHTTP,
    an add-on to Glimpse designed specifically for Web pages. Depending on your needs,
    you''ll want to use Glimpse for a large-scale indexing job and GlimpseHTTP for
    a smaller-scale, local indexing job. The source code for both, as well precompiled
    binaries for Glimpse, are on the accompanying CD-ROM, in the /internet/glimpse
    directory. Because GlimpseHTTP requires Glimpse to run, you''ll want to start
    with Glimpse and then work your way to GlimpseHTTP. (Chances are that you''ll
    want to use GlimpseHTTP for most tasks, since it seems to work with Linux, but
    all options are presented here.)


    > When this book was written, an advanced tool named WebGlimpse was in development
    by the Glimpse development team. At that time, using WebGlimpse under Linux was
    a largely untested proposition. Check out the WebGlimpse pages at http://glimpse.cs.arizona.edu/webglimpse/
    to see if it work on a Linux implementation has been completed.


    ![](img/7488e49c99dd1fc906878692fde2ec31_403_0.png)


    # Glimpse: A High-Powered Indexing Tool


    Glimpse (short for GLOBal IMPlicit SEArch) is a Perl-based tool for searching
    a filesystem or specific Web pages. Several programs make up the Glimpse distribution:
    glimpse, glimpseindex, agrep, glimpseserver, and more.


    Using Glimpse is quite simple—all you need to do is combine the glimpseindex command
    with the directory you want to index:'
  merge: -1
  pgno: 403
- img_proc: true
  md: '# CHAPTER 6: Indexing with Glimpse and GlimpseHTTP 381


    glimpseindex directory


    where directory is a specific directory. The glimpseindex command will index the
    entire directory tree. To index everything at or below your home directory, use


    glimpseindex -o ~


    There are actually three index types, relating to the size of the index files
    when compared to the source files:


    +   - a very small (tiny) index (about 2 to 3 percent the size of the source files)


    +   - a small index (about 7 to 9 percent the size of the source files)


    +   - a medium-sized index (about 20 to 30 percent the size of the source files)


    The larger the index, the faster the search, but in most situations, the small
    index will work well. This is created with the following command line:


    ```

    glindex -o directory

    ```


    where directory is the directory to be indexed.


    The options to glimpseindex are listed in Table 6.1.


    # Table 6.1 Glimpseindex Options


    | Option | Purpose |

    |---|---|

    | -a | Adds the file(s) and/or directories to an existing index. Any directory
    will be traversed recursively and all files will be indexed (unless they appear
    in **glimpse_exclude**; using this option is generally much faster than indexing
    from scratch, although in rare cases the index may not be as good. If some reason
    the index is full (which can happen unless -o or -b are used) **glimpseindex -a**
    will produce an error message and exit without changing the original index. |

    | -b | Builds a medium-sized index (20-30 percent of the size of all files), allowing
    faster searches. This option forces **glimpseindex** to store an exact (byte level)
    pointer to each occurrence of each word (except for some common words belonging
    to the stop list). |'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# 382 CHAPTER 6: Indexing with Glimpse and GlimpseHTTP


    Table 6.1 Glimpseindex Options (continued)


    | Option | Purpose |

    | | -B | Uses a hash table that is four times bigger (256K entries instead of
    64K) to speed up indexing. The memory usage will increase typically by about 2MB.
    This option is only for indexing speed; it does not affect the final index. |

    | -d filename(s) | Deletes the given filename(s) from the index. |

    | -D filename(s) | Deletes the given file from the list of filename(s) but not
    from the index. This is much faster than -d, and the file(s) will not be found
    by glimpse. However, the index itself will not become smaller. |

    | -E | Does not run a check on file types. Glimpse normally attempts to exclude
    nontext files, but this attempt is not always perfect. With -E glimpse indexes
    all files, except those that are specifically included in .glimpse_exclude and
    whose file names end with one of the excluded suffixes. |

    | -f | Launches incremental indexing. glimpse scans all files and adds to the
    index only those that were created or modified after the current index was built.
    If there is no current index or if this procedure fails, glimpse automatically
    reverts to the default mode (which is to index everything from scratch). This
    option may create an inefficient index for several reasons, one of which is that
    deleted files are not really deleted from the index. Unless they are small, mostly
    additions, and -o is used, we suggest that you use the default mode as much possible.
    |

    | -F | Tells glimpse to receive the list of files to index from standard input.
    |

    | -H directory | Puts or updates the index and all other .glimpse files (listed
    later) in directory. The default is the home directory. When glimpse is run, the
    -H option must be used to direct glimpse to this directory, because glimpse assumes
    that the index is in the home directory (see the -H option in, Table 6.2). |

    | -i | Makes .index (see Table 6.4) take precedence over .glimpse_exclude, so
    for example, you can exclude everything (by putting \) and then explicitly include
    files. |

    | -l | Instead of indexing, only show (print to stdout) the list of files that
    were indexed. It is useful for filtering purposes. (glimpse -l | glimpse -F is
    the same as glimpse dir.) |

    | -Mx | Tells glimpse to use x MB of memory for temporary tables. The more memory
    you allow, the faster glimpse will run. The default is 2. The value of x must
    be a positive integer; glimpseindex will need more memory than x for other things,
    and glimpse may perform some forks, so you''ll have to experiment if you want
    to use this option. If x is too large you may run out of swap space.'
