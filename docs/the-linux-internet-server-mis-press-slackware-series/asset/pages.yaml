    # Apache’s Handler Use


    A handler is an internal Apache representation of the action to be performed when
    a file is called. Generally, files have implicit handlers, based on the file type.
    Normally, all files are simply served by the server, but certain file typed are
    handled separately. For example, you may use a type of application/x-htttp-cgi
    to invoke CGI scripts.


    Apache 1.1 adds the additional ability to use handlers explicitly. Either based
    on filename extensions or on location, these handlers are unrelated to file type.
    This is advantageous because it is both a more elegant solution, and it also allows
    for both a type and a handler to be associated with a file.


    Handlers can either be built into the server or a module, or they can be added
    with the Action directive. The built-in handlers in the standard distribution
    are as follows:'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 313


    +   - send-as-is: Send file with HTTP headers as is (mod_asis)

    - cgi-script: Treat the file as a CGI script (mod_cgi)

    - imap-file: Imagemap rule file (mod_imap)

    - server-info: Get the server''s configuration information (mod_info)

    - server-parsed: Parse for server-side includes (mod_include)

    - server-status: Get the server''s status report (mod_status)

    - type-map: Parse as a type map file for content negotiation (mod_negotiation).


    There are two directives associated with handlers: AddHandler and SetHandler.


    # AddHandler


    +   Syntax: <AddHandler handler-name extension>

    Context: server config, virtual host, directory, .htaccess

    Status: base


    AddHandler maps the filename extension extension to the handler handler-name.
    For example, to activate CGI scripts with the file extension .cgi, you might use


    ```

    AddHandler cgi-script cgi

    ```


    Once that has been put into your srm.conf or httpd.conf, any file ending with
    .cgi will be treated as a CGI program.


    # SetHandler


    +   Syntax: <SetHandler handler-name>

    Context: directory, .htaccess

    Status: base


    When placed in an .htaccess file or a <Directory> or <Location> section, this
    directive forces all matching files to be parsed through the handler given handler-name.
    For example, if you had a directory you wanted to be parsed entirely as imagemap
    rule files, regardless of extension, you might put the following into an .htaccess
    file in that directory:'
  merge: -1
