    # DirectoryIndex


    Syntax: DirectoryIndex local-url local-url ...


    Default: DirectoryIndex index.html


    Context: server config, virtual host, directory, .htaccess


    Override: indexes


    Status: base


    The DirectoryIndex directive sets the list of resources to look for when the client
    requests an index of the directory by specifying a NULL file at the end of a directory
    name. Local-url is the (%-encoded) URL of a document on the server relative to
    the requested directory; it is usually the name of a file in the directory. Several
    URLs may be given; the server will return the first one that it finds. If none
    of the resources exist, the server will generate its own listing of the directory.
    An example is:


    ```

    DirectoryIndex index.html

    ```


    A request for http://myserver/docs/ would return http://myserver/docs/index.html
    if it exists or would list the directory if it does not.


    The documents do not need to be relative to the directory, as in the following:


    ```

    DirectoryIndex index.html index.txt /cgi-bin/index.pl

    ```'
