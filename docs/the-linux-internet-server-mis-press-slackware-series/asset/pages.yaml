    # INTRODUCTION


    # Linux and Your Internet Server


    Welcome to the worlds of the Slackware Linux operating system and the Internet!
    This book covers Slackware Linux as an Internet server, beginning with the installation
    of Slackware Linux and its configuration as a network server, following through
    with the configuration of several powerful Internet servers, including an emphasis
    on the most popular Web server on the Internet, the Apache Web server.


    Why Linux? The primarily goal of any Internet server is reliability, pure and
    simple. You don''t want to have an Internet server that can be overwhelmed by
    a high number of users, each asking for a slew of data. You''ll want an Internet
    server that''s pretty bullet-proof, and that''s where Linux comes in. Developed
    by people around the world, Linux has evolved into this ultrareliable UNIX workalike
    that provides high performance with an amazingly low failure rate. Slackware Linux
    is like the proverbial Energizer bunny—it keeps going and going and going.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# INTRODUCTION


    Add to that the relatively affordability of Slackware Linux. By purchasing this
    book, you''ve already purchased the entire operating system. No reason to pony
    up hundreds or thousands of more dollars from the likes of Microsoft or SCO. Plus,
    Slack Linux can be run on most PC configurations. Small firms may find that a
    relatively inexpensive Pentium or even an older 486 can handle their Internet
    server needs, while medium-sized company can invest in one of the new multiple-Pentium
    servers hitting the market.


    This book specifically covers using Slack Linux as an Internet server, not just
    a Web server. The Internet is made up of many services, and the World Wide Web
    is only one of the many services. There''s more to the Internet than the Web,
    as there are World Wide Web, Gopher, mail, news, and FTP servers included with
    Slack Linux.


    # Who Should Read This Book?


    This book isn''t a hardcore looking at networking with Slack Linux, but there''s
    enough information here to get your system up and running. However, advanced network
    design is a subject better left to the network engineers and really hardcore system
    administrators, so if you''re looking for an in-depth guide to Slack Linux networking,
    you won''t find it here.


    Luckily, most of us don''t need to know about hardcore system administration and
    network engineering, and this book is for us. You''ll find this book useful if:


    +   - You are a Webmaster who is evaluating Internet publishing platforms.

    - You are a UNIX system administrator who is looking to build or extend a Slack
    Linux network onto the Internet.

    - You are evaluating Slack Linux as an Internet publishing platform.

    - You are evaluating Slack Linux as an intranet publishing platform.'
