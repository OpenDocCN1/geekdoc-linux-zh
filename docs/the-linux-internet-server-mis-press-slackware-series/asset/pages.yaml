  md: '# CHAPTER 5: Setting Up Gopher 361


    cc (and in the case of Slack Linux, you''ll need to specify gcc). You can also
    specify two directories in which things are placed when you do a make install.
    The first of these, SERVBINDIR, is the path of the directory in which you want
    the executable file for the GN server installed. The second, BINDIR, is the location
    for the mkcache program.


    In the gn-2.* directory, do a make to produce the gn server and the mkcache utility.
    The mkcache utility produces cache files for each server (it is described later).
    The binary gn is the server and can be installed anywhere you choose. The binary
    mkcache is a utility program for maintainers and should be installed somewhere
    in your path, like /usr/local/bin.


    You can now run the server as a standalone daemon, the sgn executable, or run
    inet, the gn executable. We first describe the standalone version, and in most
    cases this is the version that you''ll want to run. Launch it with the command:


    ```

    sgn -p port [other options]/path/to/gmroot &

    ```


    where port is the number of the port on which you wish the server to run. If this
    is a nonprivileged port (a port higher than 1024; if you''re not clear about ports,
    you''ll want to go back to Chapters 3 and 4 to review the discussions of ports),
    then sgn can be run as an ordinary user. However, for privileged ports like 70
    or 80, you must run the preceding command as root. When sgn starts up, it will
    change its user ID to the one set in the config.h line where USERID is defined.


    It is important to run gn as nobody or some other user with no access privileges.
    It should never be necessary to run gn as root; to do so would be a serious mistake
    for maintaining security. Every attempt has been made to make gn as secure as
    possible, even if it is run as root; however, no program accessible to remote
    users on the Internet can be assumed perfectly secure.


