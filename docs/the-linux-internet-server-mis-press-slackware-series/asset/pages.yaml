    Status: core


    The StartServers directive sets the number of child server processes created on
    startup. The number of processes is dynamically controlled depending on the load,
    there is usually little reason to adjust this parameter.


    # TimeOut


    +   Syntax: TimeOut num

    Default: TimeOut 1200

    Context: server config

    Status: core


    The TimeOut directive sets the maximum time that the server will wait for the
    receipt of a request and the completion of a request, in seconds. So if it takes
    more than TimeOut seconds for a client to send a request or receive a response,
    the server will break off the connection. Thus TimeOut limits the maximum transfer
    a can take; for large files and slow networks, transfer times can be large.


    # User


    +   Syntax: User unix-userid

    Default: User #-1

    Context: server config

    Status: core


    The User directive sets userid, specifying which server will answer requests.
    In order to use this directive, the standalone server must be run initially as
    root. Unix-userid is a username (referring to the given user by name) or a user
    number (referring to a user by their number; this number must begin with #).'
