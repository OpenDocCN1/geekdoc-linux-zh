  md: '# CHAPTER 4: Setting Up a Web Server 243


    # AccessConfig


    **Syntax:** AccessConfig filename


    **Default:** AccessConfig conf/access.conf


    **Context:** server config, virtual host


    **Status:** core


    The server will read this file for more directives after reading the ResourceRootConfig
    file. The filename is relative to the ServerRoot. This feature can be disabled
    using:


    AccessConfig /dev/null


    Historically, this file only contained <Directory> sections; it can now contain
    any server directive allowed in the server-configuration context.


    # AccessFileName


    **Syntax:** AccessFileName filename


    **Default:** AccessFileName .htaccess


    **Context:** server config, virtual host


    **Status:** core


    When returning a document to the client, the server looks for an access-control
    file with this name in every directory of the path to the document, if access
    control files are enabled for that directory. For example,


    AccessFileName .acl


    before returning the document /usr/local/web/index.html, the server will read
    /.acl, /usr/.acl, /usr/local/.acl, and /usr/local/web/.acl for directives, unless
    they have been disabled with the following:


    ```

    <Directory />

    AllowOverride None

    </Directory>

    ```'
  merge: -1
  pgno: 266
