  md: '# CHAPTER 3: Installing Linux and Internet Components


    Not all these services are relevant to a discussion of using Linux as an Internet
    server. However, it''s important to know how TCP/IP networking and services are
    set up, if only to reassure you that Linux is quite capable of being a full-featured
    Internet server.


    > NOTE Some of the services in the /etc/services file will be discussed throughout
    the course of this book. For example, a discussion of ports and World Wide Web
    servers will take place in Chapter 4. For now, you don''t need to commit the contents
    of /etc/services to memory, but you should note its presence here for future reference.


    # Recompiling a Kernel to Include TCP/IP


    There''s always the chance that you didn''t install a kernel that supported TCP/IP.
    If you didn''t, then you will need to recompile your kernel. (If you don''t, you
    can skip ahead to the next section.)


    This isn''t a hard task (we covered earlier in this chapter), but it''s one where
    some guidance is helpful. As you''ll recall from earlier in this chapter, you
    begin the recompilation process with the following command lines:


    ```

    cd /usr/src/linux

    make config

    ```


    There will be a series of questions, dealing with all aspects of the Linux operating
    system. Some aren''t relevant to the networking task at hand; two sections, however,
    deal with networking. (They begin with *** Networking options and *** It is safe
    to leave these untouched.) Here''s an explanation of the questions that require
    some special attention, specifically in dealing with TCP/IP networking (the default
    values are in brackets; if you just press Enter without entering a y or n, the
    default value will be entered:)


    TCP/IP networking (CONFIG_INET) [y]


    Answer y. This is the big Kahuna—whether or not you want TCP/IP networking to
    be installed.'
  merge: -1
  pgno: 179
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components 157


    IP forwarding/gatewaying (CONFIG_IP_FORWARDWARD) [n]


    Answer y, contrary to the default. This allows you to forward TCP/IP packets to
    another network, and this tends to be the definition of the Internet, after all.


    IP multicasting (CONFIG_IP_MULTICAST) [n]


    This poses a tricky issue. On the one hand, you probably won''t have much occasion
    to use multicasting if you''re running a vanilla Web server or an intranet. On
    the other hand, many newer Web services that require bells and whistles (like
    chat and audio) require multicasting. It''s best to prepare for the future and
    answer y.


    IP firewalling (CONFIG_IP_FIREWALL) [n]


    Answer y, because firewalls allow a greater level of security on Web server and
    other Web services.


    IP accounting (CONFIG_IP_ACCT) [n]


    This feature tracks IP traffic on a per-address and per-port basis, both incoming
    and outgoing. It might be good to track if your system is overloaded, but generally
    this information falls to the arcane side of thing.


    PC/TCP compatibility mode (CONFIG_INET_PCTCP) [n]


    This setting allows Linux to coexist with other networked PCs that run PC/TCP
    networking software. Unless your intranet has users with this software, you can
    leave the default setting.


    Reverse ARP [CONFIG_INET_RARP] [n]


    This is an obscure setting. If you don''t know what RARP is, you don''t need it.
    Leave the default setting.


    Assumes subnets are local (CONFIG_INET_SNARL) [y]'
  merge: -1
  pgno: 180
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components


    You might be running subnets though your Linux box, but this isn''t a condition
    of being on the Internet. You can leave the default and then override the settings
    elsewhere if needed.


    Disable Nagle algorithm (normally enabled) (CONFIG_TCP_NAGLE_OFF) [n]


    The Nagle algorithm is a small tool that actually has a big impact: It prevents
    small packets from being sent separately and instead halts until a larger packet
    is sent. For a typical Web server installation, your packets will be large enough
    that that packet size isn''t an issue. For other installations, such as telnet,
    you can end up with a lot of small packets, which is where the Nagle algorithm
    is handy. Since there''s no reason to disable the Nagle algorithm, you can leave
    the default setting.


    The IPX protocol [n]


    The IPX protocol isn''t part of Internet connectivity—it''s a tool used in Novell
    networks. Leave the default setting.


    # Editing Network Files


    Earlier in this chapter, the section entitled "Setting Up the Network Connection,"
    you ran through the netconfig script, which sets up your system for TCP/IP networking.


    There might be occasions to change your networking setup. As you might expect,
    Slackware Linux stores this information in text configuration files. These files
    are stored in the /etc directory and can be edited with any text editor (vi or
    emacs will work fine). We''ll run down the important files here.


