    # Linux and a Swap Disk


    If you are using a PC with 4MB of RAM, you may want to set up a swap partition.
    The system treats this partition as extended RAM; if you run low on memory (and
    with 4MB of RAM, you''re guaranteed to), Linux can treat this hard-disk section
    as RAM, or virtual memory. You''ll take a performance hit, as a hard disk will
    always be slower than real RAM, and you''ll have the joy of watching your hard
    disk churn furiously when you try to use a few applications. However, a swap partition
    can be used only for swap space by Linux; it can''t be used for any other storage.
    Therefore, you need to weigh your RAM needs versus your hard-disk storage needs,
    keeping in mind that Linux should have as much hard-disk territory for storage
    as possible, especially if you''re running an Internet server.


    As as Internet servers go, it''s our experience that a swap partition doesn''t
    really affect system speed significantly, although there''s a certain slowing
    effect when a site gets busy. In these days of cheap RAM, a serious Internet site
    would do to buy some RAM and not mess with swap disks. Because of the rapid nature
    of Internet usage—all sorts of processes are created and discarded at a furious
    pace—things stay in RAM.'
