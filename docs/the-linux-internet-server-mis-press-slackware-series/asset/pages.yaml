  md: '# What is HTML?


    If you don''t know the answer to this question, you had best gone back to school
    for a lesson on exactly what you''ve gone to the trouble to set up a Linux Internet
    server. However, chances are pretty good that you already have a good idea about
    HTML and why you need to have some working knowledge of it, if only to put up
    some basic Web pages.


    We''re not going to spend a lot of time delving into the nuances of Web-page design.
    To be honest, there are a ton of competent books on the subject in the marketplace.
    Check Appendix A for a listing of HTML-design books that can help you you want
    to learn more about Web-page design. Here, we''ll spend time explaining some Web-page
    design tools and techniques unique to Linux and the Apache server.


    HTML, which stands for HyperText Markup Language, is the lingua franca of the
    World Wide Web. A page that is formatted using HTML tags will be read by a Web
    browser, which will then supply the appropriate formatting. For instance, you
    would place a bold (<B>) before text that you want to be in bold type, while you
    would place a bold-off marker (</B>) after the text you want to be in bold type.
    The Web browser doesn''t display these tags, but rather applies them to the text
    at hand. This is how headlines, bullets, subheads, and formatted text occurs.
    (If this looks suspiciously like the tags formerly used in the typesetting world,
    you''re exactly correct.) As a matter of fact, desktop-publishing programs with
    some lineage from the old typesetting days, like QuarkXPress, will choke on these
    tags.) The resulting file is a combination of HTML tags and text, making it totally
    a text file. There''s no special encoding, no special formatting—an HTML file
    is merely a text file with some hidden tags.


    Reduced to this limit, an HTML file becomes just another Linux text file, if you
    choose to look at it like that. Since you''re already used to editing text files
    during the course of setting up a Slackware Linux server, creating a basic Web
    page won''t be any big deal for you.


    ![](img/7488e49c99dd1fc906878692fde2ec31_483_0.png)'
  merge: -1
  pgno: 483
- img_proc: true
  md: '# CHAPTER II: HTML and Web Pages 461


    # Using Linux to Create HTML Pages


    The issue here—and one that you might want to consider—is whether you want to
    use a Linux system to create Web pages. You probably won''t want to actually use
    the server for page creation on a large scale; if the server has any sort of traffic
    at all; there''s no reason to launch X Window and an HTML editor to work on Web
    pages and detract from the Web-server performance. And while there are good page-editing
    tools available on Linux (which we''ll cover a little later), there are more advanced
    site-management tools available for the Windows 95 and Macintosh platforms.


    On the other hand, you may have no other choice but to use your Linux server to
    create Web pages, or you may just want to stick to an all-Linux system. In this
    situation, you can use some of the standard Linux tools to create and edit HTML
    files. You could use one of the text editors that ship with Slackware. We''re
    not going to spend a lot of time on these editors here; if you want more information
    on them, check out Appendix A for a listing of additional Linux/UNIX texts.


    All of these editors can be used to edit text files. These include elvis, which
    can be launched with the following command lines:


    ```

    elvis

    ```


    or


    ```

    vi

    ```


    The elvis text editor is a vi clone. If you''re a UNIX or Linux user, you know
    that vi is a basic text editor; not terribly fancy, but functional. It''s not
    an X Window application, but it can be launched under X. An X Window application—at
    least with Slackware Linux—is emacs, which can be launched in an xterm window
    with the following command line:


    ```

    emacs

    ```'
  merge: -1
  pgno: 484
