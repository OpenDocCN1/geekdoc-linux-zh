    # Looking for Help


    Most UNIX systems have an online-manual-page system, and Linux has no exception.
    You can use the man command to summon information about specific commands:


    ```

    darkstar:-# man man

    ```


    Online-manual pages aren''t organized by topic; they’re organized by specific
    command.


    # Shutting Linux Down


    Like any good UNIX, Linux responds to the shutdown command. You''ll need to provide
    it with a command-like parameter, as well as an amount of time to wait before
    actually shutting the system down. This may seem odd if you''re used to working
    alone on a PC, but the shutdown command is usually saved for serious shutdowns,
    as most UNIX installations support many users and rarely shutdown. Use the following
    command line:


    ```

    shutdown -r now

    ```'
