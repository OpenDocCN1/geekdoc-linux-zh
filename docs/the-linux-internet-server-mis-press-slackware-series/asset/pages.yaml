  md: '# CHAPTER 4: Setting Up a Web Server 191


    The point here is that that you must have an existing directory to store documents
    before the Web server can be put online. The easiest thing to do is to change
    the line in the srm.conf file to


    ```

    DocumentRoot /var/lib/httpd/htdocs

