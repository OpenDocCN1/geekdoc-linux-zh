  md: '# Are Any of Us Truly Secure?


    For a while, it seemed though coverage of the Internet was limited to stories
    about security breaches on the Internet, with hordes of unprincipled hackers gleefully
    rifling through the files on a supposedly “secure” Internet site, grabbing hundreds
    of thousands of credit card numbers for God only knows.


    Of course, the real Internet isn''t exactly like that; to be totally honest, the
    best place to find usable credit card numbers is behind the dumpster of a bank,
    not on someone''s Web server. Still, there are Internet users out there who consider
    it great sport to go where they''re not supposed to go. But the greater danger
    is from disgruntled employees who would love nothing more than to wreak a little
    havoc on the company that laid them off.


    In this chapter, we''ll cover the many facets of security on the Internet, ranging
    from limitations on access to your Internet server to secure transactions transactions.
    Your attitude should be simple: That your Internet site is insecure and at,risk,
    and that if you want to protect your transactions, your employers, and your users,
    you should take whatever steps you need to make your Internet Web server more
    secure.


    This task can be broken down into three areas:


    +   - Server security

    - Document security

    - User security


    We''ll run down each one briefly.


    > > **NOTE**

    > Security and networks is an involved and technical topic. You''ll want to peruse
    your local bookstore for a more complete guide to Internet security. wreak'
  merge: -1
  pgno: 517
- img_proc: true
  md: '# CHAPTER 13: Security 495


    # Server Security


    Basically, a secure server means that no unauthorized user has access to your
    system. If you don''t want another Internet user reading the content of your Internet
    site, you should have the ability to prevent their access.


    # Document Security


    Some documents on your Web server should be accessible to the bare minimum of
    people (that is, only to someone logged on as the administrator), while other
    documents should be limited to a small group of people (such as personnel report
    accessible only to upper management). This can mean outside Internet users, as
    well as internal users on an intranet.


    # User Security


    When a user sends something to your Linux Internet site, they should have a reasonable
    expectation that the transaction should be secure; that is, no one should be able
    to read the contents of the transaction. This can range from registration information
    on a sensitive Internet site, to financial information from a bank.


    Each of these security issues requires a different solution, although there is
    certainly overlap between the issues. These solutions are covered in the remainder
    of this chapter.


    > You can stay informed about security risks. There''s the very real chance that
    some hacker will find a hole in your Internet server, so you should make an effort
    to stay informed by subscribing to the RISKS Forum (which details the issues raised
    by people in society, including security concerns) and CERT advisories, which
    will be sent directly to you. To do so, you''ll need to send a one-line message
    to the appropriate e-mail address (risks-request@cls.si.com or cert-advisory-request@cert.org),
    with the word SUBSCRIBE as the text of the message. In addition, you should peruse
    Lincoln Stein''s excellent WWW Security FAQ at http://www.genome.wi.mit.edu/WWW/faqs/www-security-faq.html,
    as well as the Linux Security Page (http://207.237.120.45/linux/) and alerts from
    the Linux Emergency Response Team (http://www.redhat.com/linux-info/security/people).


    ![](img/7488e49c99dd1fc906878692fde2ec31_518_0.png)'
  merge: -1
  pgno: 518
- img_proc: true
  md: '# CHAPTER 13: Security


    # Maintaining Server Security


    The most secure Internet server is going to be the one where there are no other
    users. Of course, running a Linux Internet server for your own pleasure tends
    to be a tad limited in the amount of enjoyment it provides—what’s the point of
    creating those really cool maps if no one is going to see them?


    Opening up your server to the rest of the company in the form of the intranet
    means that you’re automatically increasing the chances of a security breach; some
    Internet security experts argue that the biggest threat of server security lies
    with disgruntled workers, not with malicious hackers. The threat increases when
    you connect to the outside Internet—besides those disgruntled workers, there are
    also also the malicious hackers to worry about. And if you incorporate CGI scripts
    or Java applets into your Web pages, you’re increasing the chances of a security
    breach.


    What can you do? Be careful. Basically, if you don’t need a service, then don’t
    start one. This is easy to do with Linux, since you have total control over Internet
    services. Subscribe to the notion that less is more.


    # Watching the Scripts


    When you’re in a rush and under some severe deadlines, you might do things that
    are inconvenient, rather than smart.


    Working with CGI scripts can make your life easier. However, if you’re not careful
    with your scripts, you can inadvertently introduce a number of security holes
    on your server. And if you don’t follow some simple rules, you could end up with
    a downed machine and a boss screaming at you on the other end of the phone. These
    guidelines include:


    +   Keep CGI scripts in one place. You shouldn’t keep scripts in multiple locations
    on your server; they’ll be hard to remember, and inevitably you’ll lose track
    of one in a directory where the permissions are not as strict as they should be.
    If you keep all the scripts in one place, you can set restrictive permissions
    for that directory, meaning that users will be able to only run the scripts, not
    change them or add their own.'
  merge: -1
  pgno: 519
- img_proc: true
  md: '# CHAPTER 13: Security 497


    +   - Don''t allow users to store CGI scripts in their own space. This is really
    a variation of the first rule.


    +   - Watch your code carefully. If you''re not a coding veteran, you may not
    realize when you introduce an error that could open a security hole. That goes
    for CGI scripts you may grab from other sources. Any outside script that reads
    or writes files on your system should be examined more closely. And if a script
    is too complex for you to understand, you may be better off passing on it.


    +   - Make frequent backups. If a hacker does your system to its knees, you should
    be able to restore the system quickly.


    # Perl and Security


    Perl, like the rest of the Internet, was designed to be open and usable by all.
    However, Perl isn''t as secure as it should be—and you may be making the problem
    worse than it can be. For starters, never place the Perl executable in your cgi-bin
    directory. (The default in Slack Linux is not to have the Perl executable in that
    directory.) This allows any Perl script to be run on your machine, and since Perl
    allows access to the innards of your system, this means that any smart Perl hacker
    could grab important information about your system.


    # Secure Transactions


    If you''re planning on charging on your Web site for anything, you''ll want to
    institute some sort of secure-transaction mechanism. This can take the form of
    secure transactions between the Web browser and the Web server. On a more speculative
    level, it can take the form of digital cash in the future.


    There are several vendors pushing their version of digital cash; their names are
    listed at the end of this chapter. In addition, there are mechanisms in most Web
    server for secure transactions. The exact route you take will depend on the Web
    server you use and the authentication schemes they are pushing.'
  merge: -1
  pgno: 520
- img_proc: true
  md: '# Shadowing Passwords


    One of the more common ways for someone to hack onto a Linux Internet server—or
    a Linux system in general—is to try and get into the /etc/passwd file. To prevent
    easy access, you can set up Shadow passwords, which takes the /etc/passwd file
    and encrypts it. There is a downside: you will need to recompile the WU-FTP server
    if you plan on using Shadow passwords, and you''ll need to use a different command
    to add users.


    Login as root, CD, and then copy the file shadow-current_tar.gz from the accompanying
    CD-ROM. Then you unarchive the file with the following command line:


    ```

    tar zxfv shadow-current_tar.gz

    ```


    This creates a directory called shadow-mk. Make this the current directory and
    then run the following command lines in sequence:


    ```

    make save

    ```


    This command line saves the old binaries, should you want to uninstall Shadow
    passwords later. The old binaries are saved in shadow-mk/.


    ```

    make all

    ```


    This command line compiles the software. It could take a while, so relax.


    ```

    make install

    ```


    This command line installs the software.


    ```

    /usr/sbin/pwconv

    ```


    This command line program converts old passwords to Shadow passwords.


    ```

    mv ./npassword /etc/passwd

    ```'
  merge: -1
  pgno: 521
- img_proc: true
  md: '# CHAPTER 13: Security 499


    This command line replaces the original password file with a new password file
    that contains no passwords, but a reference to Shadow passwords stored elsewhere
    on the system.


    ```

    mv ./shadow /etc/shadow

    ```


    This command line moves the new password file to etc.


    ```

    chmod 644 /etc/passwd

    ```


    This command line changes the new password file to a file that''s readable by
    the world, but writable only by you.


    ```

    chmod 640 /etc/shadow

    ```


    This command line changes the Shadow file to a file that''s not readable by the
    world, only readable by the group, and writable only by the owner.


    ```

    chown root.shadow /etc/shadow

    ```


    This command line changes the ownership of the file to root.shadow.


    ```

    touch /var/adm/lastlog

    touch /var/adm/ftmp

    touch /var/adm/faillog

    touch /var/adm/sulog

    ```


    This command line creates logfiles.

    If you''re running X, you''ll need to add the following line to your /usr/X11R6/lib/X11/config/linux.cf
    file:


    ```

    #define HasShadowPasswd YES

    ```


    To add users, you''ll need to use the useradd command, not the standard adduser
    command.'
  merge: -1
