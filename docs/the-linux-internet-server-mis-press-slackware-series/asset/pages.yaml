    # Excite


    Excite for Web Servers is a high-performance, Perl-based tool. At the time this
    book was written, there was not a Linux version available, but according to Excite
    representatives, a Linux version was in the works. Check the Excite Web site (http://www.excite.com/navigate/download.cgi
    or http://www.excite.com) to see if a Linux version is now available.


    # Summary


    This chapter covered the installation and usage of Glimpse and GlimpseHTTP, two
    searching and indexing tools that can help you gain control of your Web site by
    providing your users the tools to search through indexes of portions or all your
    Web site. Glimpse can take specific files or an entire file structure and index
    the contents in many different ways. Meanwhile, Glimpse and GlimpseHTTP give you
    the tools to send this information to users in many different methods.


    Also mentioned in this chapter were additional indexing tools you might want to
    check out, including freeWAIS, Harvest, and Excite.


    In the next chapter, you''ll learn about FTP and offering FTP access to your users.'
