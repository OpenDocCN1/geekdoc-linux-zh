    # Mod_log_config Module


    This module is contained in the mod_log_config.c file and is not compiled by default.
    It provides for logging of the requests made to the server, using a user-specified
    format.


    This is an experimental module, which implements the TransferLog directive (same
    as the common log module) and an additional directive, LogFormat. The argument
    to the LogFormat is a string, which can include literal characters copied into
    the log files, and % directives as follows:


    +   * %h Remote host

    * %l Remote logname (from identd, if supplied)

    * %u Remote user (from auth; may be bogus if return status (%s) is 401)

    * %t Time, in common log format time format

    * %r First line of request

    * %s Status—Requests that got internally redirected, this is the status of the
    original request—%...>s for the last

    * %b Bytes sent

    * %...{Foobar}i The contents of Foobar: header line(s) in the request to the client

    * %...{Foobar}o The contents of Foobar: header line(s) in the reply


    The trailing periods (...) can be nothing at all (%h %u %s %b), or can indicate
    conditions for inclusion of the item (which will cause it to be replaced with,
    if the condition is not met). Note that there is no escaping performed on the
    strings from %r, %... , and %0.


    The forms of condition are a list of HTTP status codes, which may or not be preceded
    by !. Thus, %400,501[User-agent] logs User-agent on 400 errors and 501 errors
    (Bad Request, Not Implemented) only; %!200,304,302[Referer] logs Referer on all
    requests that did not return some of normal status.


    The default LogFormat reproduces CLF, which is discussed later.'
