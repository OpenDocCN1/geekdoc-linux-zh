  md: '# CHAPTER 5: Setting Up Gopher 365


    Of course, if you don''t want them to show on your clients'' menus, you should
    use an Attribute=invisible line with them in the menu.


    # Limiting Access to Your GN Hierarchy


    If you opt to limit access to your gopher, there are two ways to do this. For
    the first you use the -a option to gn (in the inetd.conf file). This will limit
    access to the server to those clients with an IP address or subnet address listed
    (and not excluded) in the file .access in the root directory. The format of the
    .access file is one address per line, each line consisting of an IP address like
    129.111.222.123 or a subnet address like 129.111.222 or 129.111.111. In case a
    subnet address is listed, any client with an IP address beginning with that subnet
    address will be allowed access.


    You may also list the domain names with wildcards, provided the machines have
    proper PTR domain name records. To allow access to all machines under nwu.edu,
    use the line *.nwu.edu. Note that this will not allow access to a machine called
    nwu.edu if it exists. You would need to add in the record nwu.edu to allow access.


    You can also exclude IP addresses or domain names by prefixing them with an exclamation
    (!), so if .access contained only the lines:


    ```

    !speedy.acms.nwu.edu

    * access would be permitted to every machine except speedy. Likewise:

    !129.111*

    ```


    would allow access to everyone except those on subnet 129.111. It is important
    to note that in determining access, gn reads the .access file only until it finds
    a match (with or without !) and then quits. So if .access consisted of the two
    lines:


    ```

    *!129.111

    then access would be granted to everyone since the * comes first and it matches
    everyone.

    ```'
  merge: -1
  pgno: 388
- img_proc: true
  md: '# CHAPTER 5: Setting Up Gopher


    - A option is similar to the -a option except access is allowed on a per-directory
    basis. Each client request is processed by first looking for an access file in
    the directory containing the requested item and comparing the IP address of the
    client with the addresses in this file. If no .access file exists in this directory,
    one is sought in the parent directory, or up to the root data directory. If no
    .access file is found by this process access is allowed to all clients provided
    the item requested exists in a .cache file.


    It is possible with gnn to attain even finer access discrimination than on a per-directory
    basis, even though it is somewhat cumbersome to do so. Nevertheless, if you need
    to make certain menu items visible (and accessible) to select a group of hosts,
    this is possible. Details on how to do it are in the last section of the document
    /docs/technical.notes.


    # Searching a Collection of Files


    GN has two mechanisms to allow the user to create a small menu consisting of those
    items on a large menu whose files contain a particular search term. The first
    of these is described in this section. This method has the advantage of being
    much easier for the maintainer but will become slow if there are too many files
    being searched or the files are too large. It is appropriate if the number of
    files you wish to search is, say, less than 100 and the files themselves are at
    most a few hundred kilobytes (of course, this depends on your particular hardware,
    and your mileage may vary). If you have a large number of files or very large
    files, then WAIS indexing may be a better choice. WAIS indexing is covered in
    a separate document that can be found online.


    # Using GN as a Web Server


    GN can be used as a Web server (although it should be noted that if you''re primarily
    looking for is a Web server, you should be using the Apache Web server or WN,
    both of which were discussed in the previous chapter). GN will accept either Gopher
    requests or HTTP requests and respond appropriately. This takes place automatically
    with no action necessary on the part of the maintainer.'
  merge: -1
  pgno: 389
- img_proc: true
  md: '# CHAPTER 5: Setting Up Gopher 367


    Once you have created a Web document, you can serve it with gn giving it a filename
    ending in .html and making it available in the usual way as a text document. For
    example,


    ```

    Name=A Sample of Hypertext Markup

    Path=0/dir/dir2/sample.html

    ```


    If this document is viewed with an HTTP browser, it will be displayed with the
    capabilities of that browser (i.e., nicely formatted in the ways prescribed by
    your HTML document). If it is viewed by a Gopher client, the HTML source (i.e.,
    the unformatted document with markup tags) will be displayed. If you want to create
    two versions of a document—one in plain text and the other in HTML—this is easily
    handled by gn. Simply give the plain text file name, say sample, and use the name
    sample.html for the HTML version. Then use the plain text name, but with a Path
    starting with 0h (the''s zero). For example, a menu entry like:


    ```

    Name=A Sample of Plain/Hyper text

    Path=0h/dir/dir2/sample

    ```


    will provide the file sample to Gopher clients and HTTP clients. You can also
    name the plain text file sample.txt, and gn will automatically change the name
    to sample.html when putting it on a menu for an HTTP browser. This is only true
    for the suffix .txt, though. If you name the version foo.text, then the HTML version
    must be named foo.text.html. There is also a 1h that works similarly. If a directory
    has path field 1dir/foo, then Gopher clients will see it in the usual way, but
    for HTTP clients an HTML file /dir/foo.html will be served instead. However, the
    method described in the following paragraph is a better way to deal with putting
    HTML text into menus for most situations.


    Adding HTML text to menus works slightly differently. You simply include the source
    in the menu file beginning with the keyword httpText= on a line by itself and
    ending with the keyword endText= on a line by itself. Here is an example from
    the main menu of the gn server at hopf.math.nwu.edu. It illustrates how to put
    graphic images into a menu:'
  merge: -1
