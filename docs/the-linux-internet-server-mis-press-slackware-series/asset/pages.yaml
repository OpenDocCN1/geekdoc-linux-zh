  md: '# Look for these other MIS: Slack Series titles:

    • LINUX: Configuration and Installation, Second Edition

    • LINUX Programming

    • The LINUX Database


    linux is the LEADING variant on the market, and those looking for an Internet
    server need no further, as Linux brings the advanced networking power of UNIX
    to the PC. Linux is a rock-solid, network-ready operating system, which makes
    it the perfect choice for an Internet or intranet server. This book and CD-ROM
    gives you all the tools and information you need to create a powerful Internet
    server, including a full version of Slackware.


    +   Choose the best type of Internet connection for you—T1, T3, ISDN

    Install and configure Linux for usage on the Internet

    Install and configure the Apache server, including its many modules

    Set up your own Gopher server with GN

    Improve server performance with the Squid caching tools

    Bring indexing to your users with Glimpse and Harvest

    Deliver mail to your users with sendmail

    Create and edit Web pages and imagemaps


    Beginning with a discussion of the connectivity and networking tools you''ll need—T1,
    T3, ISDN—Reilly guides you through a complete Linux installation and provides
    invaluable networking tips and techniques. Since the World Web has become the
    most popular offering on the Internet, you''ll learn everything there is to know
    about the Apache server. You''ll learn how to improve server performance with
    tools like Squid and Glimpse, and how to offer a complete set services services
    to your users, including electronic mail, Gopher, and FTP. In addition you''ll
    learn about programming tools like Java, Perl, and Tcl that can extend your Linux
    experience.


    KEVIN RICHARD is a veteran Linux author. He co-wrote the top-selling Linux: Configuration
    and Installation (now in his 2nd edition) and Linux Programming (both titles in
    the MIS-Press Slack series). In addition, he''s authored best-selling UNIX guides,
    teaching yourself—UNIX (now in his 3rd edition) and UNIX in Plain English. He''s
    also a regular contributor to UNIX Review and Linux Journal magazines.


    # What you will find on the CD-ROM:


    +   • Complete 96 Linux operating system

    • Full networking capabilities, including TCP/IP

    • Several Web servers, including the Apache server, WAN, and GN

    • Indexing and caching tools, including Glimpse, GlimpseHTTP, Harvest, and Squid

    • Sendmail and several tools for Usenet newsgroup management, including IN and
    TN

    • Web browsers, including Arena and Lynx

    • Complete ANSI and C++ programming suites, as well as Perl, T, and Java

    • HTML editors, graphics tools, maps and logs for creating GIF and JPEG files

    • Powerful FTP servers, including WU-FTP

    • Support for iBCS, which allows binaries created for other UNIX variants to run
    on Linux


