- img_proc: true
  md: 'CHAPTER 4: Setting Up a Web Server


    The following instructions are part of the Apache documentation.


    # Setting Up Multiple Daemons


    By creating a separate http installation for each virtual host. For each installation,
    use the BindAddress directive in the configuration file to select which IP address
    (or virtual host) that daemon services, such as:


    ```

    BindAddress www.smallco.com

    ```


    This hostname can also be given as an IP address.


    # Setting Up a Single Daemon


    For this case, a single httpd will service requests for all the virtual hosts.
    The VirtualHost directive in the configuration file is used to set the values
    of ServerAdmin, ServerName, DocumentRoot, ErrorLog, and TransferLog configuration
    directives define different values for each virtual host. These would set up virtual
    hosts www.smallco.com and www.baygroup.org:


    ```

    <VirtualHost www.smallco.com>

    ServerAdmin webmaster@mail.smallco.com

    DocumentRoot /groups/smallco.com/www

    ServerName www.smallco.com

    ErrorLog /groups/smallco.com/logs/error_log

    TransferLog /groups/smallco.com/logs/access_log

    </VirtualHost>


    <VirtualHost www.baygroup.org>

    ServerAdmin webmaster@mail.baygroup.org

    DocumentRoot /groups/baygroup/www

    ServerName www.baygroup.org

    ErrorLog /groups/baygroup/logs/error_log

    TransferLog /groups/baygroup/logs/access_log

    </VirtualHost>

    ```


    This VirtualHost hostnames can also be given as IP addresses.


    Almost any directive directive be put in the VirtualHost directive, with the exception
    of ServerType, User, Group, StartServers, MaxSpareServers, MinSpareServers, MaxRequestsPerChild,
    BindAddress, PidFile, TypesConfig, and ServerRoot.'
  merge: -1
  pgno: 237
- img_proc: true
  md: "# CHAPTER 4: Setting Up a Web Server 215\n\n# File Handle/Resource Limits\n\
    \nWhen using a large number of virtual hosts, Apache may run out of available\
    \ file descriptors if each virtual host specifies different log files. The total\
    \ number of file descriptors used by Apache is one for each distinct error log\
    \ file, one for every other log directive, plus 10-20 for internal use. UNIX operating\
    \ systems limit the number of file descriptors that may be used by a process;\
    \ the limit is typically 64 and may usually be increased up to a large hard-limit.\n\
    \nAlthough Apache attempts to increase the limit as required, this may not work\
    \ if the number of file descriptors exceeds the hard limit. In the event of problems\
    \ you can reduce the number of log files by not specifying log files in the VirtualHost\
    \ sections and logging everything to the main log files. In this case, increase\
    \ the file descriptor limit before starting Apache, using a script like:\n\n```\n\
    #!/bin/sh\nimit -S -n 100\nexec httpd\n```\n\nThere have been reports that Apache\
    \ may start running out of resources allocated for the root process. This will\
    \ exhibit itself as errors in the error log like unable to fork. There are two\
    \ ways you can bump this up:\n\n+   Have a csh script wrapper around httpd the\
    \ rlimit to some large number, like 512.\nEdit http_main.c to add calls to setrlimit()\
    \ from main(), along the lines of:\n\n```\nstruct rlimit rlp;\n\nrlp_rlim_cur\
    \ = rlp_rlim_max = 512;\nif (setrlimit(RLIMIT_NPROC, &rlp)) {\n\tfprintf(stderr,\
    \ \"setrlimit(RLIMIT_NPROC) failed.\\n\");\n\texit(1);\n}\n```"
  merge: -1
  pgno: 238
- img_proc: true
  md: '# 216 CHAPTER 4: Setting Up a Web Server


    # Configuring Sendmail to Run Apache Virtual Hosts


    With virtual hosts come virtual mailboxes. You''ll need to set up sendmail (provided
    you''re actually using sendmail, of course; there''s more on this in Chapter 8)
    to accept virtual hosts. The following solution was posted to the Usenet newsgroup
    comp.mail.sendmail by johan@josnet.se.


    ![](img/7488e49c99dd1fc906878692fde2ec31_239_0.png)


    Let''s create the file that is going to tell sendmail which e-mails to accept
    and send to them:


    ```

    /etc/maildb/domainaliases: ( a text file )

    fake@virtual.com real@realdomain.com

