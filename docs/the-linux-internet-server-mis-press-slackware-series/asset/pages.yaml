    ```


    Name=Announcement of GN version 1.0

    Path=0/announce-1.0


    After the keyword httpText=, the first line creates a title for the document.
    All HTML tags that do the markup are contained in angle brackets <>. The line
    starting <img src=....says to insert the graphic image on hopf at port 70 with
    Path=1/image/fract2.gif at this point in the image. The tag <p> indicates a paragraph
    break. Any HTML text can be inserted in this way in a menu. There can be multiple
    insertions, and they can be anywhere in the text.


    If you use the keyword Text= in place of httpText=, then gn will serve the text
