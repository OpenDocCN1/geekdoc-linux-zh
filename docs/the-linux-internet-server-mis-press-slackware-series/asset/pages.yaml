    Now we have everything we need to start a Linux system. To do that, you need to
    know the following things:


    +   * The device name of the Linux partition you intend to boot (such as /dev/hda2).

    * The path- and filename of the Linux kernel you plan to use (such as C:\LOADLIN\ZIMEAGE).

    * Whether the partition should be mounted read-only (as in the case of a native
    Linux partition, so it can save file-system checking at boot time) or read-write
    (needed by UMSDOS, which does not check file systems at)


    This information is fed to the LOADLIN.EXE program, which in turn loads Linux
    into memory and boots it. Here''s an example:


    ```

    C:\LOADLIN> LOADLIN C:\LOADLIN\ZIMEAGE ROOT=/dev/hda2 RO

    ```


    This loads the Linux kernel and boots the /dev/hda2 partition in read-only (RO)
    mode. If you''re using UMSDOS, you''d replace the RO with RW to use read-write
    mode when needed.


    > NOTE: Some DOS drivers interfere with Loadlin, in particular the emm386 driver
    for expanded memory. If this happens, you''ll have to remove the driver from your
    CONFIG.SYS and try again. Also, Loadlin will not run directly under Windows 95,
    although you can set up an icon for it that first switches your computer into
    DOS mode. (In other words, the process is to start a DOS session under Windows
    95 and then launch Loadlin.)


    If all goes well, your machine should switch to Linux. If you''d like to automate
    the process further, edit the LINUX.BAT file in your C:\LOADLIN directory. Then
