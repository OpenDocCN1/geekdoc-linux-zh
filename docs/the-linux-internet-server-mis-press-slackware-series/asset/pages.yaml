  md: '# 36 CHAPTER 2: Linux Internet Connection Methods


    Basically, you dial into an ISP''s computer and then leave the connection open
    24 hours a day. A dialup connection costs little to set up (basically, all you
    need is a $120 modem), but you''ll need a special arrangement with an ISP that
    gives you a fixed IP address (as opposed to the dynamically allocated addresses
    that most Internet dialup users have), previously a leased line (you could try
    to use a standard line, but reliability becomes an issue), and you''ll need to
    pay for the privilege of such a 24-hour connection (in other words, don''t expect
    to pay $19.95 a month for such an arrangement; expect to pay between $100 and
    $300 per month).


    A connection like this can be expected to support three to four users simultaneously
    in most situations. For a small Linux network that doesn''t need Usenet access
    and isn''t spending a lot of time transferring large files to and from Internet
    sites, this connection method is pretty acceptable.


    > As this book was written, the telephone industry was on the verge of introducing
    a new networking technology,ADSL, which allows higher-speed dialup connections
    to the Internet. Because the technology and services are still very new, they
    are covered here.


    # ISDN


    The Integrated Services Digital Network (ISDN) technology was supposed to be the
    next great thing when it came to supplying digital information from computer to
    computer.


    Unfortunately, ISDN never took off on a large scale; by the time the telecommunications
    giants stopped fighting about ISDN standards, newer and more affordable technologies
    had made ISDN obsolete on a large corporate scale.


    Standards die hard in the computer world, however, and with the rise of the Internet
    ISDN was dusted off and repositioned as a higher-speed digital access tool. It''s
    really a transitional technology—as our telephone and cable systems move toward
    a merger of sorts, ISDN technology will be obsolete when we all have high-speed
    access in our homes.'
  merge: -1
  pgno: 59
- img_proc: true
  md: '# CHAPTER 2: Linux Internet Connection Methods


    Basically, ISDN works like a regular analog modem. You connect an ISDN modem or
    an ISDN router to your phone line, which transmits digital signals. It''s actually
    the equivalent of two telephone lines: there are two 64Kbps B channels that can
    be combined to provide 128Kbps. Or these channels can be maintained separately—one
    for data and one for voice. (If you''re a telephone geek and wonder how this can
    happen, it''s because there''s a separate D channel used for signaling. Then again,
    if you''re a telephone geek, you probably know more about this than you can get
    from a book.)


    ISDN offers a higher connection speed but costs even more than a standard dialup
    connection. ISDN modems are more expensive and, to be honest, most ISPs don''t
    support ISDN. In addition, you''ll need to contract with your local telephone
    company for an ISDN line (with setup costs between $50 and $100, depending on
    your area). Almost every telephone company also charges by the minute at pretty
    outrageous bills—probably at least $500 per month. The telephone industry has
    been slow to serve ISDN as a viable tool, connection, and marketing and availability
    is spotty.


    Because ISDN offers better throughput, you can expect to support up 40 or 50 users
    simultaneously. Given the larger number of users you can service, this may be
    a more attractive alternative. However, both ISDN and dialup analog lines suffer
    from the same problem: reliability. Connections are frequently dropped, and the
    current phone system wasn''t built to support 24-hour analog connections.


    In the next six months, many of you can expect to see cable modems be a factor
    in these decisions. Basically, a cable modem uses the same wiring used in cable
    television to connect to the Internet. In these cases, your cable company is your
    ISP, which should scare the daylights out of you.


    There are different hardware requirements for ISDN. You''ll need a network terminator
    (which costs between $100 and $300) and a router, or you''ll need an ISDN modem.


    You may need to know about specific configuration options for using an ISDN modem
    under Linux. More information can be found at http://www.ix.de/ix/linux/linux-isdn.html.'
  merge: -1
  pgno: 60
- img_proc: true
  md: '# 38 CHAPTER 2: Linux Internet Connection Methods


    Financially, ISDN tariffs range all over the map. Some states have a low monthly
    charge, with a per-minute charge past a small period. Other states have a higher
    monthly charge, with more free hours thrown in. The frustrating thing here is
    that there''s no shopping for ISDN service; it''s under the auspices of the local
    telephone company, so they can get pretty much whatever rates they want. If you
    want a full-time connection to the Internet, you''ll need to maintain a 24-hour
    connection, which can run into serious money.


    There''s a constant in the computer world: The user base larches in one direction,
    and the computer industry frantically rushes to catch up. This is the case with
    ISDN, which uses 1980s technology to provide digital telephone lines. This means
    there are many new offerings from vendors hitting the market. In addition, many
    telephone companies are reevaluating ISDN tariffs. The prices listed in this section
    may not be valid by the time you read this book, you''ll want to do some shopping
    before you decide on or reject ISDN.


    ![](img/7488e49c99dd1fc906878692fde2ec31_61_0.png)


    # Hosting by an ISP


    Many ISPs are essentially "rent" space on their server, with rates depending on
    the amount of hard-disk space you use. The appeal is that there''s no system administration
    involved; all you need to do is upload HTML and program files via FTP. Of course,
    there''s a corresponding lack of control here—if your ISP goes down, access to
    your information will also go down. Similarly, you can''t fine-tune performance
    at all.


    An alternative that''s gained some popularity is for you to actually set up your
    own physical Web server at an ISP. Your server would be directly connected via
    network to the ISP''s system (typically, an ISP will have more than one system
    involved for Internet access). You don''t sacrifice anything in performance (in
    other words, a connection to your server wouldn''t be slowed down like a connection
    via modem is), and you can administer your site from anywhere—all you need to
    do is connect to your server via the Internet and log in as an administrator.


    # Direct High-Speed Connections


    You could go digital and get your own high-speed connection to the Internet in
    the form of a 56K frame relay or T1 line; these connections cost as much as $1,000
    per month or so (depending on your location)'
