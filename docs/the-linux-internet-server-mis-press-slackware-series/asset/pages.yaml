    In the following sections, we''ll cover how to set up the Web server straight
    out of the box—i.e., as installed in the basic Slackware Linux installation. Later
    in this chapter we''ll cover how to make changes to the Apache Web server.


    # Before You Run the Server: Configuration Files


    If you try to launch the httpd daemon, you''ll get an error message, stating that
    a file location is inaccurate. Before you can actually use the Web server, you''ll
    need to configure it. There''s not a lot to configuring the Apache Web server,
    and it''s really a matter of going through three files—all stored in the /var/lib/httpd/conf
    directory—and adapting the configuration files to your particular setup. The three
    files are httpd.conf, srm.conf, and access.conf.


    Basically, these three files are used by the Apache Web server for all configuration
    work. It''s a slightly weird situation; any directive can be placed in any of
    these files. The server reads in these three files for directives. How does the-server
    know where to look for those files?'
