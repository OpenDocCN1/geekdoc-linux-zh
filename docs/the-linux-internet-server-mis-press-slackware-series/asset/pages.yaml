  md: '# CHAPTER 8: Setting Up a Mail Server


    # Electronic Mail: Fueling the Internet Revolution


    The World Wide Web may garner the headlines when it comes to the explosive growth
    of the Internet, but electronic mail is really the one application that unites
    all Internet users. In the course of Internet polls determining the most popular
    Internet applications, electronic mail almost always ranks as the top usage, with
    the World Wide Web closing the gap in recent years.


    The allures of electronic mail are obvious, and unlike other Internet applications,
    electronic mail doesn''t require you to be somewhat of a sophisticated or technologically
    savvy user. With most popular electronic-mail packages, all you need to do is
    know a few basic functions in order to send and receive mail. Many corporations
    that have connected their e-mail systems aren''t fully integrated with the Internet,
    which means that the actual number of people who can send and receive your users''
    e-mail actually exceeds the number of Internet users.


    The role of your Linux Internet server is merely to distribute the mail. Because
    of this, we won''t spend a lot of time on actually using electronic mail from
    the user point of view. The chances are that most of your users won''t actually
    be using a Linux box for their daily tasks, which would make discussions of mail
    packages like elm and pine moot.


    # A Short Electronic-Mail Primer


    Electronic mail is really nothing more than a chunk of text that''s sent from
    one user to another user. There are two parts of the text: the body, which contains
    the message and any attachments (such as uuencoded or MIME attachments), and the
    header, which contains information about the route the mail took between users,
    the size of the body, the originator''s mail message, a subject line, and so on.
    A typical header looks like this:'
