    # File Ownership and Permissions


    The files that you wish to serve should be owned by you or by their creator or
    whoever is in charge of maintaining them. They should not be owned by nobody or
    whatever ID the server runs under (as set in config.h). This because the nobody
    ID should have the minimum permissions possible. It needs to have read access
    to the files to be served, but it has no need to be able to write to those files
    or alter them in any way.


    Normally the files served might be owned by the maintainer and have their permissions
    set to be readable writable only by the maintainer (or by no one).


    Unlike the index.cache file which controls access to everything in a directory
    should be owned by the maintainer of that directory and the only permission nobody
    should have for this file read permission. In fact, for security reasons if the
    server was started as root (and switched to a safer user like nobody), or swn
    will refuse to use any index.cache file that is owned by the user ID (e.g., nobody)
    under which the server is running. This restriction does not apply if swn is run
    on an unprivileged port by an ordinary user, because such a user might not be
    able to make index.cache files owned by someone else.


    There is one exception to the rule of having nothing owned by nobody (and that''s
    not a double negative). The exception is the log files. These files must be writable
    by the server, and it generally seems sensible to have them owned by the user
    nobody whose identity the server runs. The log file and the error log file can
    be specified on the command line when the server is run or can be defined in config.h.


