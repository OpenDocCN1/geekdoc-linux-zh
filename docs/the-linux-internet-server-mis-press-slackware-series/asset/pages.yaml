- img_proc: true
  md: '# 306 CHAPTER 4: Setting Up a Web Server


    FastCGI has a faster alternative to CGI. FastCGI gets its speed by having the
    Web server keep the application processes running between requests. So, unlike
    CGI, you do not have the overhead of starting up a new process and doing application
    initialization each time somebody requests a document. The processes start up
    with the Web server and keep on running.


    FastCGI applications communicate with a Web server using a simple communications
    protocol. A single full-duplex connection communicates the environment variables
    and stdin data to the application, and stdout and stderr data to the Web server.


    For more information on FastCGI including freely available FastCGI server modules
    and application libraries, go to the FastCGI home page (http://www.fastcgi.com).


    Any file that has a MIME type of application/x-httpd-cgi and has an Application
    Class associated with it will not be treated as a FastCGI script. A file gets
    its MIME type by not residing in a ScriptAlias directory and having a name ending
    in an extension defined by an AddType application/x-httpd-cgi directive. An Application
    Class is established by the AppClass directive.


    There is one directive made possible with this module: AppClass


    # AppClass


    +   Syntax: AppClass exec-path [-processes N] [-listen-queue-depth N] [-restart-delay
    N] [-priority N] [-initial-env name=value]


    +   Context: srm.conf


    The AppClass directive starts one or more FastCGI application processes, using
    the executable exec-path. This file must have MIME type application/x-httpd-cgi.
    The server is responsible for restarting these processes they should die. All
    the FastCGI application processes started by a given AppClass directive share
    a common UNIX domain listening socket.


    When a client request comes in the file exec-path, the request is handled by the
    mod_fastcgi module. The FastCGI module connects the requests to a processes belonging
    to the corresponding application class.


    The optional parameters to the AppClass directive are as follows:'
  merge: -1
  pgno: 329
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 307


    +   - Processes: number of FastCGI processes that the server will spawn, default
    value is 1.

    - Listen-queue-depth: depth of listening queue shared by the processes, default
    value is 5.

    - Restart-delay: number of seconds before the Web server restarts a dead FastCGI
    process. The server will restart no more than one every restart-delay seconds.

    - Priority: priority of FastCGI processes, default value is same as the HTTP server.

    - Initial-env: a name-value pair in the initial environment passed to the application
    processes. Several name-value pairs can be specified by using this option several
    times. The default initial environment is empty (no name-value pairs).


    If there are any errors in processing the FastCGI directive AppClass, the server
    will exit with appropriate error messages. Errors include syntax errors, exec-path
    has incorrect MIME-type, and exec-path does not exist.

    An example from the srm.conf file:


    ```

    AddType application/x-httpd-fcgi .fcgi

    Alias /fcgi-bin/ /usr/local/etc/http/fcgi-devel-kit/examples/

    AppClass /usr/local/etc/http/fcgi-devel-kit/examples/tiny-fcgi.fcgi

    -processes 2

    ```


    In this example a request comes for /fcgi-bin/tiny-fcgi.fcgi, it''ll be bound
    to one of the application class defined here, and the request will be sent to
    one of the two tiny-fcgi.fcgi processes.


    ![](img/7488e49c99dd1fc906878692fde2ec31_330_0.png)


