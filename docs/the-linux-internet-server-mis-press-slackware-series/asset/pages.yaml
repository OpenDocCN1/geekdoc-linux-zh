    # Non-IP Virtual Hosting


    Apache has always supported multiple IPs on the same server, and by large this
    approach works fairly well. However, reports of a shortage of IP addresses on
    the Internet have become a little too prevalent to be dismissed out of hand, and
    some solutions have been implemented in the Internet world. For instance, the
    HTTP 1.1 protocol allows a server to identify what hostname is being addressed
    (this wasn''t true in the old days). The version of the Apache Web server that
    ships as Slack Linux addresses the issue by supporting the HTTP 1.1 protocol,
    as well as the older (and still perfectly satisfactory) IP-address-per-hostname
    method.'
