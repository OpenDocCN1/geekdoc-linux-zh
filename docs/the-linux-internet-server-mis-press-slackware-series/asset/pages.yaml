  md: '# CHAPTER 6: Indexing with Glimpse and GlimpseHTTP 395


    gunzip glimpseHTTP_2_0_src_tar.Z

    tar xvf glimpseHTTP_2_0_src_tar


    This will create a directory named cgi-bin and several other files, including
    a configuration script ghinstall. Run this script after checking through the ghinstall
    documentation online (http://glimpse.cs.arizona.edu/http/).


    Next will come adding the cgi-bin directory as a script directory on the Apache
    Web server (assuming, of course, you''re using the Apache Web server). Do this
    by adding a line like the following to the srm.conf file:


    ```

    ScriptAlias /cgi-bin/ /usr/local/glimpsehttp/cgi-bin/

    ```


    Your directory may be different, of course.

    With the installation complete, you can create an archive. Basically, GlimpseHTTP
    uses Glimpse and Glimpseindex files, as well as the following files:


    +   - ghreindex, a file that calls ghimpseindex to recreate the Glimpse index
    (and associated files), and will also call ghgenhtml.

    - ghindex.html, a file that is generated by the ghgenhtml utility. This is an
    HTML file that contains the search form for GlimpseHTTP. Depending on how the
    archive is configured (during the makegeharch command), a separate ghindex.html
    file could be generated for each subdirectory or just for the root directory of
    the archive.

    - archive.cfg, a file that is generated by the ghgenhtml utility. This file contains
    the configuration for the archive. The format of the file is <archive title> <archive
    base URL> <subdirectory indices>, where each field is specified by a \t (tab character).
    The last field is a 1 (true) or a 0 (false), and denotes whether or not each subdirectory
    has a ghindex.html. If not, just the root directory has a search page.

    - ghheye.gif, a GIF file used by the ghindex.html files generated by ghgenhtml.'
