    Path=0/myfile/path

    Type=0

    Host=MyHost.MyUniv.edu

    Port=70

    ```


    The line starting with Maintainer= is optional (and provides information only
    to HTTP clients). It should contain a reference to the maintainer of this directory
    like the preceding one (technically any URL is permissible). The Maintainer line
    must be the first nonblank and noncomment line in the menu file.


    There are several things to note about item entries in this file. The Name field
    must be first, the Path field starts with a gn type (e.g., 0 for a file or 1 for
    a directory; you''ll learn more about later in this chapter). It is followed by
    the pathname of the file or directory relative to the top-level data directory.


    The Type, Host, and Port fields are optional for local items but required for
    remote links. If they are not present, the Type will be taken from the first character
    of the Path field, and the Host and Path fields will be those specified in config.h
    (or the command line of mkcache). In general it is a good idea not to include
    the Host and Port fields for local items. It makes it easier if at some future
    time you wish to move your server to a new host or new port. For more details
    on the format of menu files, see the man page called mkcache.1 and the sample
    menu files in each directory of the source hierarchy.'
