  md: '# CHAPTER 5: Setting Up Gopher


    +   - 7m—Search a structured file. This item refers to an item of type 1m. When
    this item is selected, the server prompts the user for a regular expression search
    term and returns a menu of all those documents in the referenced file containing
    a match for that regular expression.


    +   - 7w, 7wc, 7wh, 7wr—WAIS index searches. These items refer to a WAIS index
    in the gn hierarchy containing an index of a collection of files in the hierarchy.
    When this item is selected, the server prompts the user for a search term and
    returns a menu of all those files containing a match. Type 7wc indicates that
    the menu item titles should be taken from the files documents rather than use
    what WAIS thinks the title should be (typically the filename). Type 7wh indicates
    that the indexed items should be type 0h (i.e., there is both a plaintext and
    an HTML version of each file). Type 7wr indicates a range type, where a single
    file is considered to contain a number of documents, like a mail file.


    +   - 8—Telnet URL (link). The gn server does nothing with these links except
    the URL (or Gopher equivalent) to the client to handle.


    +   - 9, I, s—Binary files, image files, sound files. These files are treated
    as binary data and downloaded appropriately. To determine its MIME content type,
    the file gn_mime.types is consulted and compared with the filename extension.
    This can be overridden by a ContentType=entry in the menu file.


    +   - 0Z, 9Z, IZ, sZ—Compressed files. These types refer to files of type 0, 9,
    I, and s, respectively, but the files in question are kept on the server in a
    compressed format. When a client requests one of these files, it is automatically
    uncompressed before transmission


    +   - exec0, exec1, exec7, exec9, exec1, execs—Execute a command. These types
    cause the server to execute a program provided by the maintainer. The last character
    indicates the type of item the program or script will return, like 0 for text,
    1 for directory, and so on.'
  merge: -1
