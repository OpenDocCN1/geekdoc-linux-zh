  md: '# CHAPTER 4: Setting Up a Web Server


    # Resource Allocation and Resource Pools


    One of the problems of writing and designing a server-pool server is that of preventing
    leakage, that is, allocating resources (memory, open files, etc.) without subsequently
    releasing them. The resource pool machinery is designed to make it easy to prevent
    this from happening, by allowing resource to be allocated in such a way that they
    are automatically released when the server is done with them.


    This works in the following way: the memory which is allocated, file opened, and
    the like, deal with a particular request is tied to a resource pool which is allocated
    for the request. The pool is a data structure which itself tracks the resources
    in question.


    When the request has been processed, the pool is cleared. At that point, all the
    memory associated with it is released for reuse, all files associated with it
    are closed, and any other clean-up functions associated with the pool are run.
    When this is over, we can be confident that all the resource tied to the pool
    have been released and none of them have leaked.


    Server restarts, and allocation of memory and resources for per-server configuration,
    are handled in a similar way. A configuration pool keeps track of resources allocated
    while reading the server configuration files and handling the commands therein
    (for instance, the memory that was allocated for per-server module configuration,
    log files, and other files that were opened). When the server restarts and has
    to reread the configuration files, the configuration pool is cleared, and so the
    memory and file descriptors that were taken up by reading them the last time are
    available for reuse.


    It should be noted that the pool machinery isn''t generally obligatory, except
    for situations like logging handlers, where you really need to register cleanups
    to make sure that the log files get closed when the server restarts (this is most
    easily done by using the function pfopen, which also aligns the underlying file
    descriptor to be closed before any child processes, such as for CGI scripts, are
    exceeded), or in case you are using the timeout machinery (which isn''t documented
    here). However, there are two benefits to using it: Resources allocated to a pool
    never leak (even if you allocate a scratch string, and forget about it), and for
    memory allocation, palloc is generally faster than malloc.


    We begin here by describing how memory is allocated to pools and then discuss
    how other resources are tracked by the resource pool machinery.'
  merge: -1
  pgno: 255
- img_proc: true
  md: "# CHAPTER 4: Setting Up a Web Server 233\n\n# Allocation of Memory in Pools\n\
    \nMemory is allocated to pools by calling the function palloc, which takes two\
    \ arguments, one being a pointer to a resource pool structure and the other being\
    \ the amount of memory to allocate (in chars). Within handlers for handling requests,\
    \ the most common way of getting a resource pool structure is by looking at the\
    \ pool slot of the relevant request_rec; hence, the repeated appearance of the\
    \ following idiom in code:\n\n```\nint my_handler(request_rec *r)\n{\n    struct\
    \ my_structure *foo;\n\n    foo = (foo *)palloc(r->pool, sizeof(my_structure));\n\
    }\n```\n\nNote that there is pfree—palloc memory is freed only when the associated\
    \ resource pool is cleared. Note that palloc does not have to do as much accounting\
    \ as malloc(); it all does in the typical case is to round up the size, bump a\
    \ pointer, and do a range check.\n\nIt also raises the possibility that heavy\
    \ use of palloc could cause a server process to grow excessively large. The two\
    \ ways to deal with this are dealt with later; briefly, you use malloc and to\
    \ be sure that the memory gets explicitly freed, or you can allocate a subpool\
    \ of the main pool, allocate your memory in the subpool, and clear it out periodically.\
    \ The latter technique is discussed in the following section on subpools and is\
    \ used in the directory-indexing code, in order to avoid excessive storage allocation\
    \ when listing directories with thousands of files.\n\n# Allocating Initialized\
    \ Memory\n\nThere are functions that allocate initialized memory and are frequently\
    \ useful. The function palloc has the same interface as palloc but clears out\
    \ the memory it allocates before returns it. The function pstrdup takes a resource\
    \ pool and a char * as arguments and allocates memory for a copy of the string\
    \ pointer to points, returning a pointer to the copy. Finally, pstrcat is a varargs-style\
    \ function, which takes a pointer to a resource pool, and at least two char *\
    \ arguments, the last of which must"
  merge: -1
