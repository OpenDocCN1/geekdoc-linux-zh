  md: '# 284 CHAPTER 4: Setting Up a Web Server


    Note that the following is: still supported:


    ```

    AddType application/x-httpd-imap map

    ```


    The imagemap module adds some new features that were not possible with previously
    distributed imagemap programs:


    +   * URL references relative to the Referer: information.

    * Default <BASE> assignment through a new map directive base.

    * No need for imagemap.conf file.

    * Point references.

    * Configurable generation of imagemap menus.


    There are three directives made possible with this module: ImapMenu, ImapDefault,
    and ImapBase.


    # ImapMenu


    Syntax: ImapMenu {none, formatted, semiformatted, unformatted}

    Context: server config, virtual host, directory, .htaccess

    Override: indexes


    The ImapMenu directive determines the action taken if an imagemap file is called
    without valid coordinates. It has the following options:


    +   * none (If ImapMenu is none, no menu is generated, and the default action
    is performed.)

    * formatted (A formatted menu is the simplest menu, as comments in the imagemap
    file are ignored; a level-one header, a rule, and then the links on a separate
    line are printed—the menu has a consistent, plain look close to that of a directory
    listing).

    * semiformatted (Comments are printed where they occur in the imagemap file. Blank
    lines are turned into HTML breaks; no header or hrule is printed; otherwise, the
    menu is the same as a formatted menu.)'
