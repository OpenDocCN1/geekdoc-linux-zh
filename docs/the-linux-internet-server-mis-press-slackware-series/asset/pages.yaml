  md: '# CHAPTER 3: Installing Linux and Internet Components 61


    # Choosing the Proper Rootdisk Image


    After selecting the proper bootdisk, you''ll need to select the proper rootdisk.
    The selections are more limited, so you won''t have to put too much work into
    the selection. The rootdisks are stored in the ROOTDSKS directory and will work
    with either 3.5-inch or 5.25-inch high-density diskettes.


    Your rootdisk image selections are listed in Table 3.4.


    # Table 3.4 Rootdisk Selections


    | Filename | Purpose |

    | --- | --- |

    | COLOR.GZ | This image contains a full-screen color install program and should
    be considered the "default" rootdisk image. This version of the install system
    has some known bugs, however—it is, in particular, not forgiving of extra keystrokes
    entered between screens. By and large, this is probably the file you''ll want
    to use. |

    | UMSDOS.GZ | This is similar to the COLOR disk, but installs using UMSDOS—a filesystem
    that allows you to install Linux into a directory on an existing MS-DOS partition.
    This filesystem is not as fast as a native Linux filesystem. For reason alone,
    anyone running a Linux Internet server should avoid UMSDOS. |

    | TEXT.GZ | This is a text-based version of the install program derived from scripts
    used in previous Slackware releases. |

    | TAPE.GZ | This image is designed to support installation from tape. See the
    section entitled "Installing from Tape" later in this chapter. |


    > Notice that these filenames are in the .GZ extension, indicating that the files
    have been compressed with GNU zip. Some other distributions of Linux required
    that the files be decompressed prior to use, but this is not needed. The kernel
    on the bootdisk will detect that the rootdisk is compressed, and will automatically
    decompress the disk as it is loaded into RAM. This allows the use of a 1.44MB
    uncompressed image size for both 1.44MB and 1.2MB floppy drives.


    Most users will use the COLOR.GZ rootdisk image.'
  merge: -1
  pgno: 84
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components


    # Creating the Diskettes


    For this step, you''ll need two high-density diskettes. It doesn''t matter what''s
    on the diskettes, but they must be formatted—just be warned that this process
    will completely wipe out anything stored on the diskettes. You might also wish
    to format at this time a third-density floppy diskette for the installation program
    to use later when preparing your system bootdisk.


    In these examples, we''ll be using the BARE.I and COLOR.GZ images. If you''re
    using a different set of images, just substitute those filenames.


    ![](img/7488e49c99dd1fc906878692fde2ec31_85_0.png)


    The procedures in this section do not need to be done on the computer you''re
    planning to use You can create the files on a different PC, or else you could
    even use a UNIX workstation to create the floppy diskettes. On a UNIX workstation
    the dd command is used to write an image to the floppy disk drive. When using
    dd on Suns and possibly some other UNIX workstations, you must provide an approximate
    block size. Here''s an example:


    ```

    dd if=bare.i of=/dev/(rfd0, rdfc, fd0, or whatever) obs=18k

    ```


    Now it''s time to make your bootdisk. First, move into the bootdisk.144 (or bootdisks.12
    if you use a 1.2-MB floppy disk drive) on your Slackware CD-ROM.


    Assuming that your CD-ROM drive has the drive letter D: assigned to it, you''d
    move into the directory like this:


    ```

    C:\> D:

    D:\> CD BOOTDSKS.144

    D:\>BOOTDSKS.144>

    ```


    Now you''ll actually create the bootdisk. Put the eventual bootdisk diskette in
    drive A: and then type the following command:


    ```

    D:\> RAWWRITE BARE.I A:

    ```


    This will use the RAWWRITE command (there''s a copy of this in each the BOOTDSKS
    and ROOTDSKS directories) to copy the BARE.I image to the A: floppy disk drive.
    As it writes, RAWWRITE will give you a status report. After it''s completed writing
    the bootdisk, remove it from the drive and put it aside.'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components 63


    Some newer floppy diskette drives have trouble executing this command because
    of DMA limits. If you have DMA errors, boot DOS instead of Windows 95, and then
    make your diskettes.


    > NOTE


    Then insert another formatted high-density floppy diskette and use the same procedure
    to write out the rootdisk. In this case, you''ll need to move into the ROOTDSKS
    directory and write out the COLOR.GZ using RAWWRITE:


    ```

    D:\ROOTDSKS.144> cd \ROOTDSKS

    D:\ROOTDSKS> RAWWRITE COLOR.GZ A:

    ```


    There''s really a lot to the RAWWRITE command; the only things that can go wrong
    would be if you''re not using a high-density diskette or if the diskette is flawed.


    # Booting Linux with the Bootdisk


    Obviously, you boot Linux with the bootdisk you previously prepared. Put it in
    your boot drive and restart your PC with either a cold or warm boot (it doesn''t
    matter).


    Initially your PC will do the things that it normally does when it boots, as checking
    the memory and running through the BIOS. However, soon after the word LILO will
    appear on your screen, followed by a full screen that begins with the line:


    Welcome to the Slack Linux kernel disk!


    You''ll also see some varphi about passing parameters along to the kernel. Most
    users won''t need to pass any additional parameters. Instead, they will be able
    to press the Enter key and proceed to load the Linux RAM disk.


    > In some cases, LILO appears on the screen and the system hangs, or else rows
    of Os and Is cascade down the screen. In these cases, you are probably using the
    wrong bootdisk for your PC. The first thing to do is create a few alternate bootdisks
    and try them; if the problem persists, you''ll want to check the Usenet newsgroups
    and the FTP archives (see Appendix A for details) to make sure that your PC and
    its peripherals are indeed supported by Linux.'
  merge: -1
  pgno: 86
- img_proc: true
  md: '# 64 CHAPTER 3: Installing Linux and Internet Components


    The bootdisk runs through your system hardware, noting which hard drives and peripherals
    are present as well as scouting other salient details about your PC. It’s at this
    point that Linux discovers any problems with your PC, and if you have problems
    installing or using Linux, it’s a place you’ll want to check. (The same information
    is displayed and gathered every time you boot.)


    If there are no problems, you can put in your rootdisk and press Enter. A core
    of the Linux operating system is then copied to the RAM disk, which then gives
    you access to some Linux commands, including the important fdisk command. The
    installation process instructs you to login the Linux system as root:


    ```

    slack login : root

    ```


    No password will be required.


    > Before you proceed, carefully look through the instructions on the screen. There
    are a few notes that may apply to your specific computing situation.


    ![](img/7488e49c99dd1fc906878692fde2ec31_87_0.png)


    # Linux and Hard-Disk Names


    After logging in, you’ll want to directly run the fdisk command (ignoring what
    the screen instructions say about the setup command). The fdisk command assumes
    that the first IDE drive is the default drive. If you plan on installing Linux
    on another drive, you’ll need to specify that on the command line. Table 3.5 lists
    the hard-disk device names.


    Table 3.5 Linux Hard-Disk Device Names


    | Name | Meaning |

    |---|---|

    | /dev/hda | First IDE hard drive |

    | /dev/hdb | Second IDE hard drive |

    | /dev/sda | First SCSI hard drive |

