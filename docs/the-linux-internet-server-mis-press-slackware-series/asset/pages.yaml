  md: '# CHAPTER 6: Indexing with Glimpse and GlimpseHTTP 393


    There are a number of files that are created by glimpse when an index is generated.
    They are listed in Table 6.3.


    # Table 6.3 Files Created by Glimpse


    | File | This file |

    |---|---|

    | glimpse_include | contains a list of files that glimpseindex is explicitly told
    to include in the index even though they may look like nontext files. Symbolic
    links are followed by glimpseindex only if they are specifically included here.
    If a file is in both .glimpse_exclude and .glimpse_include, it will be excluded.
    |

    | glimpse_filenames | contains the list of all indexed filenames, one per line.
    This is an ASCII file that can be used with agrep to search for a filename leading
    to a fast find command. For example, glimpse ''count ~/.glimpse_filenames outputs
    the names of all (indexed).c files that have count in their name (including anywhere
    on the path from the index). Setting the alias as .login file may be: alias findfile
    `glimpse -h ~/.glimpse_filenames`. |

    | glimpse_index | contains the index consists of lines, each starting with a word
    followed by a list of block numbers (unless the -o or -b options are used, in
    which each word is followed by an offset into the file .glimpse_partitions, where
    all pointers are kept). The block/file numbers are stored in binary form, so this
    is not an ASCII file. |

    | glimpse_messages | contains the output of the -w option (see Table 6.2). |

    | glimpse_partitions | contains the partition of the indexed space into blocks
    and nodes, when the index is built with the -o or -b options, some part of the
    index. This file is used internally by glimpse, and it is not a non-ASCII file.
    |

    | glimpse_statistics | contains some statistics about the makeup of the index.
    Useful for some applications and customization of glimpse. |

    | glimpse_turbo | is an added data structure (used under glimpse-o or -b only)
    that helps to speed up queries significantly for large indexes. This size is roughly
    a quarter of a megabyte. glimpse will work without it if needed.


    Two files can be created by users. They are listed in Table 6.4. These files serve
    as compliments to other commands listed in the previous tables.'
  merge: -1
