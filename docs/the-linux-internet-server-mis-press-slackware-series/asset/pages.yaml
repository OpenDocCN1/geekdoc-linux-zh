  md: '# CHAPTER 3: Installing Linux and Internet Components 79


    # Configuring the Modem


    If you''re planning on using a modem for connecting to the Internet via SLIP or
    PPP, you need to configure the modem. Essentially, this involves telling Linux
    exactly what serial port the modem is connected to. The first serial port on a
    PC is called `com1`, and under Linux parlance the second serial port on a PC is
    called `com2`, and under Linux parlance the becomes `cua1`, and so on. (Note the
    numbering difference; UNIX likes to start at 0, and PCs prefer to start things
    at 1.)


    After you set up the mouse, you''ll be asked to set the speed for the modem. The
    choices (38400, 19200, and so on) are pretty clear.


    ![](img/7488e49c99dd1fc906878692fde2ec31_102_0.png)


    # Configuring the Mouse


    You''ll want to use a mouse if you''re using the X Window System, and this menu
    allows you to set up the proper mouse. For newer PCs, setting up a mouse isn''t
    a hassle, since they usually contain a serial port for that purpose. All you need
    to do is tell Linux what kind of mouse you''re using and its location (if you''re
    using a serial mouse, you''ll need to specify where the mouse is connected) and
    move on from there.


    # Configuring LILO


    LILO is the Linux LOader, and it''s used to boot Linux from the hard disk or a
    floppy disk. Additionally, it can be used to boot additional operating systems
