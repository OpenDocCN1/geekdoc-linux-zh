    ![](img/7488e49c99dd1fc906878692fde2ec31_172_0.png)


    Figure 3.5 The X Window System.


    Figure 3.5 may seem a little strange to you if you''re used to working

    of older versions of Linux and XFree86. The default window

    manager in Slack Linux is fwwm-95, a version of the old fvw

    window manager. This new window emulates Windows 95; hence, there

    is the Start button on the left bottom of the screen and the clock on

    right bottom. In addition, fwwm-95 is configured with a toolbar that

    allows access to many popular X tools. You can still call up a menu from

    anwhere on the screen by pressing the left mouse button. (Actually,

