    # The Ftpusers File


    The ftpusers file is used to determine who cannot have access to your system via
    the FTP server. This might be a case where some specific users are causing problems
    and you wish to deny them. In addition, this file can also be used to make sure
    that no one uses the FTP server as a back door into your Linux system.


    ```

    # ftpusers          This file describes the names of the users that may

    # *NOT* log into the system via the FTP server.

    # This usually includes "root", "uucp", "news" and the

    # like, because these users have too much power to be

    # allowed to do "just" FTP...

    #

    # Version:           @(#)/etc/ftpusers      2.00      04/30/93

    # Author:            Fred N. van Kempen, <walteje@uwalt.nl.mignet.org>

    #

    # The entire line gets matched, so no comments or extra characters on

    # lines containing a username.

    #

    root

    uucp

    news


    # End of ftpusers.

    ```'
