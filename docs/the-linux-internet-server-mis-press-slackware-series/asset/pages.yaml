    # A Secure Server: Apache-SSL


    Security is a hot topic in the Internet world. Users are worried—sometimes with
    reason, sometimes without—that their online transactions are subject to snooping
    by unscrupulous hackers.


    We''re not going to get into the merits of online security here; that topic alone
    could a good-sized book. Our purpose here is to pinpoint the availability of a
    secure Apache server, Apache-SSL. Basically, this is a version of the Apache Web
    server that has an implementation of the Secure Sockets Layer (SSL) compiled in.
    This is in the form of SSLeay, a freely available implementation of Netscape''s
    Secure Socket Layer. The current version of SSLeay implements version 2 of SSL.


    Because of weirdness surrounding United States export laws (remember, the government
    classifies encryption tools as munitions and subjects to heavy scrutiny), we decided
    against including the tools to implement SSL on the accompanying CD-ROM. As a
    private citizen, you can download the file yourself from the Oxford University
    FTP server, ftp://ftp.ox.ac.uk/pub/crypto/SSL. The filename is apache_1.1.1+1.3.ssl.tar.gz,
    and it''s a small file—20KB or so.


    Inside this compressed file is a set of patches for Apache (for version 1.1.1),
    extra source files, some documentation, and some example configuration files.
    All you need to do is merge the patches with the'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 323


    Apache source code and then compile and link the resulting code with SSLLeay (version
    0.5.1b+ or 0.6.1+). The modified source can still be used to compile a standard
    Apache. You can grab SSLLeay from ftp://ftp.psy.uq.oz.au/pub/Crypto/SSL/


    There are many weird issues surround Apache-SSL, and you had best be warned that
    you''re walking through a minefield (yes, the inevitable munitions reference)
    in implementing it. The terms for using and implementing Apache-SSL have been
    shifting in recent months, so you''re best off checking the Apache Web site (http://www.apache.org)
    and seeing what new information is available there. You might also need to contact
    RSA Data Security (http://www.rsa.com) for information about using RSA security
    technology, especially in a commercial setting.


    Digital certificates are available for Apache-SSL from Thawte Consulting. You
    can find full instructions and a fill-in application form at http://www.thawote.com/certs/server/request.html.
    You cannot arrange digital certificates from Verisign, unfortunately.


    # The WN Web Server


    If you find that Apache for some reason or another doesn''t meet your needs, there
    are some alternative Web servers on the accompanying CD-ROM in the internet directory.
    One worthy alternative is the WN Web server, from John Franks of Northwestern
    University (john@math.nwu.edu).


    The following WN sections on installation and usage are taken from the online
    documentation by permission of the author. You can read through the entire online
    guide at http://hopf.math.nwu.edu/docs/manual.html.


    # How WN Works


    Files served by an HTTP server may have many attributes relevant to their serving.
    These attributes include content-type, optional title, optional expiration date,
    whether the file should be parsed for server-side includes, access restrictions,
    etc. Some servers try to encode this information in ad hoc ways, in a filename
    suffix, or in a global "configuration file.\ The approach of WN is to'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# 324 CHAPTER 4: Setting Up a Web Server


    keep this information in small databases, one for each directory in the document
    hierarchy.


    The WN maintainer never needs to understand the format of these database files
    (named index.cache by default), but this format is very simple and a brief description
    will indicate how WN works. When the server receives a request, say /dir/foo.html,
    it looks in the file /dir/index.cache, which contains lines like:


    ```

    file=foo.html&content=text/html&title=whatever...

    ```


    If the server finds a line starting with file=foo.html then the file will be served.
    If a line does not exist, the file will not be served (unless special permission
    to serve all files in the directory has been granted). This is the basis of WN
    security. Unlike other servers, the default action for WN is to deny any access
    to a file. A file can be served only if explicit permission to do so has been
    granted by entering it into the index.cache database if explicit permission to
    serve all files in /dir has been given in index.cache. This database provides
    other security functions. For example, restricting the execution of CGI scripts
    can be done on the basis of the ownership (or group ownership) of their index.cache
    files. There is no need to limit execution to scripts located in particular designated
    directories. The location of a file in the data hierarchy should be orthogonal
    to security restrictions on it, and this is the case with the WN server.


    The index.cache database file has a number of other functions beyond its security
    role. Attributes of foo.html that be computed before it is served and often change
    are stored in the fields of the line starting file=foo.html. For example, the
    MIME content type text/html must be deduced from the filename suffix .html. This
    is done once at the time index.cache is created and not denote every time the
    file is served.


    The title of a file is another example. With the WN server every file served has
    a title (even binaries) and optionally has a list of keywords, an expiration date,
    and other fields associated with it. For an HTML document the title and the keywords
    are automatically extracted from the header of the document and stored in fields
    of that file''s line in index.cache file. These are used for the built-in keyword
    and title'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 325


    searches the server supports. The maintainer also has the option of adding his
    own fields to this database file. They could contain such things as document author,
    document ID number, etc. These user-defined fields can be searched with the built-in
    WN searches, or their contents can be inserted into the document, on the fly,
    as it is served.


    So how are the index.cache databases created? Their format is quite simple and
    a maintainer is free to create them any way she chooses, but normally they are
    created by the utility WNdex (pronounced windex). This program, which is part
    of the WN distribution, is designed to produce the index.cache file from a file
    with a friendlier format with the default name. A very simple index file might
    look like


    ```

    File=foo.html

    File=clap.au

    Title=Sound of one hand clapping


    File=hand

    Title=Picture of one hand clapping

    Content-type=text/gif

    ```


    Of course if the file were named hand.gif the content-type line would not be necessary
    as wnd could deduce the type from the .gif suffix. Likewise it is not necessary
    to give a title for foo.html because wndex will read the HTML header from that
    file and extract the title and perhaps others other things like keywords and expiration
    date.


    # WN Features


    The WN server has several features the WN available with other servers or only
    available through the use of CGI scripts.


    # Searching


    One of the design goals of WN is to provide the maintainer with tools to create
    extensive navigational aids for the server. A variety of search mechanisms are
    available.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '326 CHAPTER 4: Setting Up a Web Server


    # Title Searches


    In response to the URL http://host/dir/search=title the server will provide an
    HTML form (automatically generated or prepared by the maintainer) for a regular
    expression search term. When supplied the server will search the index.cache files
    in /dir and designated subdirectories for items whose titles contain a match for
    the search term. An HTML document with a menu of these items is returned.


    # Keyword Searches


    This is like title searches except that matches are sought in keywords instead
    of titles. Keywords for HTML documents are automatically obtained from headers.
    For other documents (or HTML documents) they can be manually supplied in the index
    file.


    # Title/Keyword Search


    This is like keyword searches except that the match can be either in the keyword
    or the title.


    # User-Supplied Field Searches


    This is like keyword searches except that matches are sought in user-supplied
    fields. The user-supplied fields can contain any text and are attached to a document
    by entering them in that document''s record in the index file. Their purpose is
    to include items like a document Id number, or document author in the index.cache
    database. A field search could then produce all documents by a given author for
    example. Or using regular expressions in the search term produces a list of all
    documents whose ID satisfies certain criteria.


    # Context Searches


    Unlike the title and keyword searches, this is a full text search of all text/*
    documents in one directory (not subdirectories). The returned HTML document contains
    a list of all the titles of documents containing a match together with a sublist
    of the lines from those documents containing the match. This provides one line
    of context for the match. For HTML documents the matched expression in each of
    these lines will be a highlighted anchor.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 327


    Selecting one takes you to the document with your viewer focused on the matching
    location. The primary intent of this feature is to provide full-text searching
    for an HTML document that might consist of a substantial number of files.


    # File-Context and Grep Searches


    A file-context search is just like a context search except that it is limited
    to a single file. The file grep search returns a text/html document containing
    the lines in the file matching the regular expression.


    # List Searches


    The server will search an HTML document looking for an unordered list of anchors
    linking to WWW objects. The contents of each anchor will be searched for a match
    to the supplied regular expression. The search returns an HTML document containing
    an unordered list of those anchors with a match. This is quite useful with the
    digest utility, which creates HTML documents to be searched in this way from files
    with internal structure like mail or news digests, mailing lists, etc.


    # Index Searches


    This is a mechanism by which arbitrary search engines can be linked to WN through
    a search module. The server expects the search term through the search module
    and an HTML list of links to matching items to be returned.


    All the searching methods listed previously except the index searches are built
    into the server and require no additional effort for the maintainer. They are
    simply referenced with URLs like http://host/dir/search=count, where there is
    any directory containing files to be served and an index.cache listing them. Of
    course search permission can be denied for any directory or any file contained
    in that directory.


    # Parsed Text, Server-Side Includes, and Wrappers


    The WN server has extensive capabilities for automatically including files in
    one that is being served or wrapping a served file with another (i.e., pre-pending
    and post-pending information to a file being served).'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    This latter is useful if you wish to place a standard message at the beginning
    or end (or both) of a large collection of files. For security all files included
    in a file or used as a wrapper for it are listed in that file''s index.cache file.
    This combined with various available security options, requiring that a served
    file owner and all its includes and wrappers have the same owner (or group owner)
    as the index.cache file listing them, provide a safe and productive Web environment.


    One important application of wrappers is to customize the HTML documents returned
    listing the successful search matches. If a search item is given a wrapper, the
    server assumes that it contains text describing the search, and it merely inserts
    an unordered list of links to the matching items.


    In addition to including files the output of programs may be inserted and the
    value of any user-defined field in the index.cache database entry for a file may
    be inserted.


    Also parsed text may conditionally insert items with a simple if-elseif construct
    based on Accept headers, User-Agent headers, Referer headers, and the like.


    # Filters


    An arbitrary filter can be assigned to any file to be served. A filter is a program
    that reads the file and has the program output served rather than the content
    of the file. The name of the filter is another field in the file''s lines in its
    index.cache file. One common use of this feature is for on-the-fly decompression.
    For example, a file can be stored in compressed format and assigned a filter like
    zcat, which uncompresses it. Then the client is served the uncompressed file,
    but only the compressed version is stored on disk. As another example, you might
    use nroff -man as a filter to process UNIX man files before serving. There are
    many other interesting uses of filters. Be creative!


    # Ranges


    If the server is accessed via a URL like http://host/dir/foo;lines=20-30 and file
    is any text/* document it will return a text/plain document consisting of lines
    20 through 30 of file foo. This is very useful for structured text'
  merge: -1
  pgno: 351
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 329


    files like address lists or digests of mail and news. A WN utility called digest
    will produce an HTML document with a list of links to separate sections (line
    ranges) of the structured file. The digest utility is executed with two regular
    expressions as arguments: one to match the section separator and the other to
    match the section title. for a mail digest, for example, these could be ^From
    and ^Subject:, respectively. Then the sections of the virtual documents would
    be delimited by a line starting with From and would have the message subject as
    their title. A similar mechanism provides byte ranges from files.


    # Installing the Software


    Transfer the file wn.tar.gz from the CD-ROM and uncompress it and untar it to
    make the WN source directory hierarchy. This file is also available via anonymous
    ftp from ftp.acns.nwu.edu in the directory /pub/wn.. The file must be uncompressed
    with the GNU compression utility gzip (or gunzip). The resulting file wn.tar should
    be unpacked with this UNIX command:


    ```

    tar -xvf wn.tar

    ```


    The top level of the directory created by untaring this file contains several
    directories, including: wn, wndex, autwn, and docs.


    You can also use the Perl script configure, which is in the main source directory.
    Do this with the command:


    ```

    perl configure

    ```


    This script will ask you various questions, like what version of UNIX you are
    using and the path to the directory you want to be the root of your data hierarchy.


    Default answers are printed in square brackets [ ], you can simply press Enter
    to enter that value. You can quit at any time by pressing Ctrl-C, and nothing
    should be changed. If you want to try it once to see what the questions are, that
    is, fine.


    This script creates two files, config.h and Makefile, which are customized based
    on the answers you gave. You may rerun this script'
  merge: -1
  pgno: 352
- img_proc: true
  md: '# 330 CHAPTER 4: Setting Up a Web Server


    as many times as you like. The first time you run the script the default values
    are those in the file config.h.dist. Subsequent times the default values are taken
    from the most recent config.h you have produced (if it still exists).


    An alternative to running this script is to copy the files Makefile.dist and config.h.dist
    to Makefile and config.h, respectively, and to edit them manually. If you want
    to use some of the features that are not turned on by default like multiple IP
    interfaces, you will have to edit at least config.h. I recommend starting with
    the Perl script and getting your server up and running. You can go back and browse
    through config.h to see if there are things you want to change. If there are,
    you will have to recompile, but that takes only a few minutes.


    Here are some of the questions you will be asked when you run configure. You will
    be given a list of supported operating systems and asked to pick the one you are
    using (you''ll obviously choose Linux). You will be asked to enter the complete
    pathname of your data directory. You will also have to enter the name of the access
    log and the error log you wish to use (they can be the same file). If you don''t
    want logging or you want to use the system syslog facility (i.e., the -s option),
    then these should both be defined to be the empty string (i.e., a pair of quotation
    marks with nothing between them, like "" ). If you specify the names of these
    log files, you must make sure that either these two files exist and are writable
    by the server or that they are files in a directory where the server has permission
    to create them.


    Additional customizations in config.h are possible but should not be needed. These
    customizations require that you manually edit the config.h file. For example,
    there is a #define DEFAULT_URI line in the config.h file. It is set to /index.html.
    This is the document returned in response to a request with only the hostname
    (something like http://hostname.edu/ with no filename at the end). You would need
    to change it if, for example, you wanted to have the default server response to
    be run a CGI script.


    There is also a #define NO_DNS_HOSTNAMES line in config.h, which is commented
    out by default. Uncommenting this will mean that there will be no hostnames in
    your log file, just IP addresses. This will reduce the load on your server (but
    probably not speed up responses since the lookups take place after the transaction
    is'
  merge: -1
  pgno: 353
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 331


    complete). Keep in mind that uncommenting this will mean that none of your CGI
    scripts will produce the hostname and also that your access files cannot have
    hostnames in them, just IP addresses.


    You may also customize the Makefile in the top-level directory. In particular,
    you should do this if you wish to specify a C compiler other than cc (e.g., gcc
    should be used for compiling). Also some systems require that special libraries
    for sockets, or whatever, are mentioned in the compile command.


    In the top-level directory do a make to produce the server wn, the standalone
    version swn, the utility wndex is used to produce index.cache files for use by
    the server (if is described later). If the make proceeds without problem, you
    should do a make install. This will strip the binaries and place them in the top
    level directory or whatever directory you specified when you ran the configure.


    If you specified a log file name or error-log file name when you run the configuration
    script or edit config.h, you will need to make sure these files exist and that
    they are writable by the user ID under which the server will run. The best way
    to do this is to create the files as root (touch wn.log), change their ownership
    to the appropriate user (chown nobody wn.log), and finally set the permissions
    appropriately (chmod 644 wn.log). An alternative is to create a directory in which
    these files will reside and make sure that the user nobody has permission to create
    files in this directory. Then the server will create the files with proper ownership
    and permissions.


    # Running the Server as a Standalone Daemon


    You can now run the server as a standalone daemon, the swn executable, or run
    it under inetd, the wn executable. We first describe the standalone version. Run
    this with this command:


    ```

    swn -p port [other options] /path/to/wnroot

    ```


    where port is the number of the port on which you wish the server to run. If this
    is a nonprivileged port (i.e., > 1024), then swn can be run as an ordinary user.
    However, for privileged ports like 80, you must run'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    this command as root. If swn is run without the -p option it will use port 80
    by default. If swn is run by root, then it starts up its user ID to the one set
    when running the configuration script or by editing the config.h file where USERID
    is #defined. Otherwise, it will have all the permissions of the user who runs
    it.


    The safest practice is to use the numeric UID of nobody for the USERID set in
    config.h (this is the default) and then start the server as root. The server needs
    to have root permissions to connect to a socket on a privileged port and listen
    for requests. But immediately after doing so it will change its user ID to that
    of nobody and have minimal access permissions. In this situation the user nobody
    needs to have only read permission to your server data and should not own or write
    permission. In particular nobody should not have ownership or write access of
    the index.cache database file.


    # Running the server under Inetd


    The other way to run the server is to use it under inetd. This is an efficient
    way to run the server if the load on it is relatively light (a few thousand hits
    per day) and the host on which it runs is used for other purposes. There are variations
    on how inetd works from system to system you may need to look at the man page
    for inetd.conf(5).


    Edit the /etc/services file and create the line:


    ```

    wn 80/tcp

