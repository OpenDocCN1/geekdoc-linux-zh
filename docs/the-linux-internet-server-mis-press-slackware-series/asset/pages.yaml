  md: '# 46 CHAPTER 3: Installing Linux and Internet Components


    # # Installing Linux


    After you finish your planning, it''s time to install Linux for use on the Internet.
    For the most part, installing Slack Linux from the accompanying CD-ROM is the
    same as a general-purpose Linux installation. The concern here is that you install
    the networking components during the main Linux installation. In this chapter,
    you''ll be guided through installation.


    Basically, installing Slack Linux is a multipart process. First, you must prepare
    the PC for installation (which means wiping out the remnants of previous operating
    systems and starting from scratch), boot a scaled-down version of Linux, and then
    proceed with the full installation. After this, you must configure your Linux
    system in several different ways. The actual installation process is as follows:


    +   * Create your boot and root floppies from the accompanying CD-ROM

    * Prepare your hard drive for installation with PC DOS-based tools

    * Boot a small implementation of Linux from boot and root floppies

    * Install the full version of Linux from the CD-ROM


    # # Starting with a Clean System


    It''s best if you install Slack Linux from a clean PC; that is, nothing on the
    hard drive save the MS-DOS operating system. You can install and use Slack Linux
    on a PC that already has another operating system installed (such as Windows 95),
    and many personal users opt for this configuration.


    However, there''s very little reason to have more than one operating system on
    a Linux box used as an Internet server. You can''t use more than one operating
    system at a time, and if you plan on having a full-time Internet site, certainly
    won''t be booting up Windows 95 too often. Therefore, for the purposes of an Internet
    server, you''ll want to have a clean PC with only MS-DOS (or PC-DOS; it really
    doesn''t matter) installed.'
  merge: -1
  pgno: 69
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components 47


    You''ll also want to make sure that the networking hardware seems installed and
    working on your Linux box. When Linux boots for the first time, it senses the
    hardware in the system (or, more accurately, looks for hardware in the usual spots)
    and adjusts accordingly.


    # Preparing Your Hard Drive for Linux


    Preparing your hard disk for Linux isn''t difficult—you merely wipe out what''s
    there and reinstall DOS. It''s best if you actually have two or more partitions
    on your PC: a small partition for DOS and at least one partition for Linux. (You
    may want to have two partitions for Linux: one for the operating system and one
    for swap space. We''ll cover each later.)


    If you''re from UNIX, the notion of a partition may seem a little odd. Intel-based
    PCs can have multiple partitions on a hard drive. If you''ve worked with PCs,
    you know that you can have several drive letters (such as C:, D; and E), even
    though the PC has only one physical hard drive. This capability exists because
    early versions of MS-DOS could not recognize hard disks with more than 33MB in
    a contiguous area, and when 40MB hard drives appeared, Microsoft pulled a quick
    trick in order to be able to use the entire hard disk. (MSDOS 4.0 was the first
    version to do away with this restriction.)


    However, you must use DOS tools to create your partitions. You could use OS/2,
    but there''s no reason to go out and buy OS/2 just for creating partitions. When
    you use these DOS tools, you tell the PC which operating system exists on a given
    partition.


    In our best-case scenario (in a perfect world, of course), you install Linux on
    a brand-new system, and there''s little of importance currently installed on your
    hard disk. This is the route we try to follow, since there''s little chance that
    you''ll damage anything important.


    However, if you''ve been using your PC for a while, you''ve probably accumulated
    software, data files, and configurations that you''re loathe to give up. In this
    case, you''ll want to retain as much of the DOS configuration as possible, while
    making room for Linux. You can take two routes:'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components


    +   - Use the FIPS utility to partition the hard drive without (theoretically)
    destroying the existing data.

    - Back up the DOS data, creating the new Linux and DOS partitions, and then reinstall
    the backup. (This is our preferred method.) You''ll need to make sure that the
    new partition is large enough to contain all the data from the old DOS partition,
    of course.


    In either case, you should first make a backup of your hard drive, either on floppy
    disks or some tape-based medium (Bernoulli drive, SyQuest tape, DAT tape). Depending
    on your system configuration, you''ll want to either back up everything or back
    up those directories that can''t easily be reinstalled from floppy or CD-ROM.
    (We find that a good system cleaning is desirable once in a while, so we tend
    to back up data and irreplaceable configuration files, while reinstalling applications
    from scratch.) Yes, we know that backing up your hard drive is a pain (and we
    probably don''t do it as often as we should), but you should make a backup every
    time you do something to your hard drive that has the potential to destroy data.


    # Using FIPS to Divide Your Hard Drive


    After you make your backup, you will need to decide which route to take. The FIPS
    utility described previously is stored in the root directory of the accompanying
    CD-ROM as FIPS.EXE; the guide to use FIPS is stored in the same location as FIPS.DOC.
    (If you plan to use the FIPS utility, we strongly advise that you read through
    this file several times, as it contains more information and detail here.)


    Basically, FIPS creates a new partition on the physical end of the hard drive.
    Before the FIPS utility does so, you must first defragment your hard drive. When
    a PC writes to a hard disk, it writes to clusters on disk. Generally speaking,
    writing is done sequentially; the first clusters appear at the physical beginning
    of the disk. As you use the system, you inevitably write more and to the hard
    drive, and you probably delete a good amount of data. As you delete the data,
    the clusters they occupied are freed; at the same time, new data are written to
    the end of the disk. Any hard disk that''s been in use for a while will have data
    scattered throughout the physical drive. (This is why hard'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components


    drives slow down when they fill with data; the drive head must physically hop
    around the drive to retrieve scattered data.


    When you defragment your hard drive, you are replacing the freed clusters at the
    beginning of the drive with data from the end of the drive. While not purely sequential,
    your data are all crammed at the beginning of the hard drive. This improves disk
    performance—since your data are physically closer together, the drive head spends
    less time retrieving data that were scattered in the past.


    Newer versions of MS-DOS and PC DOS (that is, versions 6.0 and better) contain
    a defragmenting utility. (Check your operating-system documentation for specifics,
    as the utilities differ.


    ![](img/7488e49c99dd1fc906878692fde2ec31_72_0.png)


    The FIPS utility takes advantage of the fact that the data are crammed at the
    beginning of the hard drive. It allows you to create a point past the end of DOS
    data to begin the new Linux partition (if you use this method, remember to leave
    room for more data in the DOS partition!).


    FIPS is more suited for those who are adding Linux to an existing configuration.
    Generally speaking, this won''t be the case with most readers of this book—quite
    honestly, there''s not a lot of use to having multiple operating system on a Linux
    Internet server, where the vast majority of the time will be spent connected to
    the Internet as a server, not as as a terminal. If you really want to preserve
    your existing operating system, check out the documentation for FIPS on the accompanying
    CD-ROM.


    # Using DOS Utilities to Divide Your Hard Drive


    The second—and preferable—method to prepare your hard drive for Linux involves
    various DOS utilities, which you''ll use to create new partitions and configure
    a floppy diskette that you can use to boost your PC with DOS.


    The first steps involves creating a DOS boot diskette. This is a rather simple
    procedure, involving the following command line:


    ```

    C:> format /s A:

    ```'
