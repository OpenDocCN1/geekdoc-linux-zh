  md: '# Mod_log_common Module


    This module is contained in the mod_log_common.c file and is compiled in by default.
    It provides for logging of the requests made to the server using the Common Logfile
    Format.


    The log file contains a separate line for each request. A line is composed of
    several tokens separated by spaces:


    ```

    host ident autuser date request status bytes

    ```


    If a token does not have a value, then it is represented by a hyphen (-). The
    meanings and values of these tokens follow:


    +   - host: The fully qualified domain name of the client, or its IP number if
    the name is not available.

    - ident: If IdentityCheck is enabled and the client machine runs ident, then this
    is the identity information reported by the client.

    - autuser: If the request was for a password-protected document, then this is
    the user used in the request.

    - date: The date and time of the request, in the following format:


    ```

    date = [day/month/year:hour:minute:second zone]

    day = 2*digit

    month = 3*letter

    year = 4*digit

    hour = 2*digit

    minute = 2*digit

    second = 2*digit

    zone = (''+'' | ''~'') 4*digit

    ```


    There is one directive supplied by this module: TransferLog.'
  merge: -1
  pgno: 311
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 289


    # TransferLog


    Syntax: TransferLog file-pipe

    Default: TransferLog logs/transfer_log

    Context: server config, virtual host

    Status: base


    The TransferLog directive sets the name of the file where the server will log
    the incoming requests. File-pipe is either a filename (relative to the ServerRoot)
    or | followed by a command (a program to receive the log information on its standard
    input; new program will not be started for a VirtualHost if it inherits the TransferLog
    from the main server).


    If a program is used, then it will be run under the user who started http. This
    will be root if the server was started by root; be sure that the program is secure.


    # Mod_mime Module


    This module is contained in the mod_mime.c file and is compiled by default. It
    provides for determining the types of files from the filename.


    This module is used to determine the MIME types of documents. Some MIME types
    indicate special processing to be performed by the server; otherwise, the type
    is returned to the client so that the browser can deal with the document appropriately.


    The filename of a document is treated as being composed of a baseline followed
    by some extensions, in the following order:


    ```

    base.type.language.enc

    ```


    The type extension sets the type of the document; types are defined in the TypesConfig
    file and by the AddType directive. The language extension sets the language of
    the document, as defined by the AddLanguage directive. Finally, the enc directive
    sets the encoding of the document, as defined by the AddEncoding directive.


    Supported directives are AddEncoding, AddHandler, AddLanguage, AddType, ForceType,
    SetHandler, and TypesConfig.'
  merge: -1
  pgno: 312
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    # AddEncoding


    **Syntax:** AddEncoding mime-enc extension extension...


    **Context:** server config, virtual host, directory, .htaccess


    **Override:** FileInfo


    **Status:** base


    The *AddEncoding* directive adds to the list of filename extensions. MIME-enc
    is the MIME encoding to use for documents ending in extension. For example,


    ```

    AddEncoding x-gzip gz

    AddEncoding x-compress Z

    ```


    This will cause files ending in .gz to be marked as encoded using the x-gzip encoding,
    and .Z files to be marked as encoded with x-compress.


    # AddHandler


    **Syntax:** <AddHandler handler-name extension>


    **Context:** server config, virtual host, directory, .htaccess


    **Status:** base


    *AddHandler* maps the filename extension extension to the handler handler-name.
    For example, to activate CGI scripts with the file extension .cgi, you might use


    ```

    AddHandler cgi-script cgi

    ```


    Once that has been put into your srm.conf or httpd.conf file, any file ending
    with .cgi will be treated as a CGI program.


    # AddLanguage


    **Syntax:** AddLanguage mime-lang extension extension...


    **Context:** server config, virtual host, directory, .htaccess


    **Override:** FileInfo


    **Status:** base'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 291


    The AddLanguage directive adds to the list of filename extensions that may end
    in for for the specified content language. Mime-lang is the MIME language of files
    with names ending with extension, after any content encoding extensions have been
    removed. For example,


    ```

    AddEncoding x-compress Z

    AddLanguage en .en

    AddLanguage fr .fr

    ```


    The document xxxx.en.Z will be treated as being a compressed English document.
    Although the content language is reported to the client, the browser is unlikely
    to use this information. The AddLanguage directive is more useful for content
    negotiation, where the server returns one from several documents based on the
    client''s language preference.


    +   **AddType**

    Syntax: AddType mime-type extension...

    Context: server config, virtual host, directory, .htaccess

    Override: FileInfo

    Status: base


    The AddType directive adds to the list of filename extensions that may end in
    for the specified content type. Mime-type is the MIME type to use for documents
    ending in extension after content-encoding and language extensions have been removed.
    For example,


    ```

    AddType image/gif GIF

    ```


    It is recommended that new MIME types be added using the AddType directive rather
    than changing the TypesConfig file.

    Unlike the NCSA httpd, this directive cannot be used to set the type of particular
    files.


    +   **ForceType**

    Syntax: <ForceType media type>

    Context: directory, .htaccess

    Status: base'
