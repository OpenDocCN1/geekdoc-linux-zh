  md: '# CHAPTER 4: Setting Up a Web Server 229


    # WhereRequest_rec Structures Come From


    Most request_rec structures are built by reading an HTTP request from a client
    and filling in the fields. However, there are a few exceptions:


    +   - If the request is to an imemap, a type map (i.e., *.var file), or a CGI
    script that returned a local Location; then the resource that the user requested
    is going to be ultimately located by some URI other than what the client originally
    supplied. In this case, the server does an internal redirect, constructing a new
    request_rec for the new URI, and processing it almost exactly as if the client
    had requested the URI directly.

    - If some handler signaled an error and an ErrorDocument is in scope, the same
    internal redirect machinery comes into play.


    Finally, a handler occasionally needs to investigate what would happen if some
    other request were run. For instance, the directory indexing module needs to know
    what MIME type would be assigned to a request for each directory entry, in order
    to figure out what icon to use.


    Such handlers can construct a subrequest, using the functions sub_req_lookup_file
    and sub_req_lookup_uri; this constructs a new request_rec structure and processes
    it as you would expect, but to not including the point of actually sending a response.
    (These functions skip over the access checks if the subrequest is for a file in
    the same directory as the original request).


    (Server-side includes by building subrequests and then actually invoking the response
    handler for them, via the function run_sub_request).


    # Handling Requests, Declining, and Returning Error Codes


    As already discussed, each handler, when invoked to handle a particular request_rec,
    has to return an int to indicate what happened. That can be OK (the request was
    handled successfully); this may or may not terminate the phase), DECLINED (no
    erroneous condition exists, but the server tries to find another), or the module
    declines to handle the phase; or an HTTP error code, which aborts handling of
    the request.'
  merge: -1
  pgno: 252
- img_proc: true
  md: "# 230 CHAPTER 4: Setting Up a Web Server\n\nNote that if the error code returned\
    \ is REDIRECT, then the module should put a Location in the request's headers_out\
    \ to indicate where the client should be redirected to.\n\n# Special Considerations\
    \ for Response Handlers\n\nHandlers for most phases do their work by simply setting\
    \ a few fields in the request_rec structure (or, in the case of access checkers,\
    \ simply by returning the correct error code). However, response handlers have\
    \ to actually send a response back to the client.\n\nThey should begin by sending\
    \ an HTTP response header, using the function send_http_header. (You don't have\
    \ to do anything special to skip sending the header for HTTP/0.9 requests; the\
    \ function figures out its own it shouldn't do anything.) header_only, that's\
    \ all they should do; they should return after that, without attempting any further\
    \ output.\n\nOtherwise, they should produce a request body that responds to the\
    \ client as appropriate. The primitives for this are rputc and rprintf for internally\
    \ generated output, and send_fd to copy the contents of some FILE * straight to\
    \ the client.\n\nAt this point, you should more or less understand the following\
    \ piece of code, which is the handler that handles GET requests that have no more\
    \ specific handler; it also shows how conditional GETs can be handled, it is desirable\
    \ to do so in a particular response handler—set_last_modified checks against the\
    \ If-modified-since value supplied by the client, if any, and returns an appropriate\
    \ code (which will be nonzero). No similar considerations apply for content_length,\
    \ but it returns an error code for symmetry:\n\n```\nint default_handler (request_rec\
    \ *r)\n{\n    int errstatus;\n    FILE *f;\n\n    if (r->method_name != M_GET)\
    \ return DECLINED;\n    if (r->finfo.st_mode == 0) return NOT_FOUND;\n```"
  merge: -1
