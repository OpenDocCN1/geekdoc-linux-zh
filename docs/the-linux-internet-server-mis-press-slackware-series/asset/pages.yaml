- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 297


    # ### CacheNegotiatedDocs

    Syntax: CacheNegotiatedDocs

    Context: server config

    Status: base


    If set, this directive allows content-negotiated documents to be cached by proxy
    servers. This could mean that clients behind those proxies retrieve versions of
    the documents that are not the best match for their abilities, but it will make
    caching more efficient.


    # ### LanguagePriority

    Syntax: LanguagePriority mime-lang mime-lang...

    Context: server config, virtual host, directory, .htaccess

    Override: FileInfo

    Status: base


    The LanguagePriority sets the precedence of language variants for the case where
    the client does not express a preference, when handling a Multiviews request.
    The list of mime-lang are in order of decreasing preference. For example,


    ```

    LanguagePriority en fr de

    ```


    For a request for foo.html, where foo.html.fr and foo.html.de both exist but the
    browser did not express a language preference, then foo.html.fr would be returned.


