  md: '# CHAPTER 3: Installing Linux and Internet Components 99


    For illustrative purposes, we''ll use the Hitachi SuperScan Pro 17. The manual
    that came with the monitor (yes, the manual was actually saved and not tossed!)
    says that the horizontal synchronization frequency range for this monitor is 30–64
    kHz. So the proper choice here would be 9. (Why not use choice 10 and enter 30–64?
    Because it''s really not worth the effort.


    The next menu is for vertical synchronization frequency:


    +   1. 50-70

    2. 50-90

    3. 50-100

    4. 40-150

    5. Enter your own vertical sync range


    Again, consulting the manual, we see that the Hitachi''s range is officially listed
    as 50–100, and we select 3.


    The next batch of information involves text strings that define your monitor settings,
    the monitor manufacturer, and the model name. These are voluntary.


    Next comes the selection of a graphics card. If you like, you can scroll through
    a listing of 124 graphics cards and try to match your card. This is handy when
    you know which specific card you have. You''ll be asked the following question:


    Do you want to look at the card database?


    Press y to look at the database; press n to skip it. If you select the database,
    you''ll be presented with a series of lines as follows:


    | 0 928Movie | S3-928 |

    | 1 AGX (generic) | AGX |

    | 2 ALG-5434(E) | CL-GD5434 |

    | 3 ATI 8514 Ultra (no VGA) | ATI-Mach8 |

    | .... |'
