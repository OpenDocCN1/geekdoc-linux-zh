  md: '# Odds and Sods: Miscellaneous Topics


    Not all the offerings in the Linux Internet world fall so smoothly into the chapter
    headings found elsewhere in this book. This chapter covers miscellaneous topics
    that are important enough to warrant some level of coverage, but not necessarily
    their own chapters. This includes useful software as the Squid Internet object
    cache, as well as commercial software meant for Linux servers.


    # Squid


    If performance is an issue for you, then you''ll want to consider using Squid,
    a high-performance cache. As the documentation states:


    > Squid offers high performance proxy caching for Web clients. FTP, Gopher, and
    HTTP requests. The cache software, available only in source, is more than an order
    of magnitude faster than the CERN httpd and other popular Internet caches, because
    it never needs to fork (except for FTP), is implemented with nonblocking I/O,
    keeps meta data and hot objects in VM, caches DNS lookups. Squid caches can be
    arranged hierarchically for an improvement in response times and a reduction in
    bandwidth usage.


    The use of this software is highly recommended. You can get more information about
    Squid at http://squid.nlanr.net/Squid/. The accompanying CD-ROM contains the source
    code (squid-1_5_tar.gz) as grabbed from ftp://squid.nlanr.net.


    # ATM


    ATM technology is new, and support within Linux is even newer. There are efforts
    to allow Linux servers to access ATM technology, but as this book was written
    the technology was in a very early stage. For more information, check http://lrwww.epfl.ch/linux-atm/.'
  merge: -1
  pgno: 475
- img_proc: true
  md: 'CHAPTER 10: Miscellaneous Services 453


    # # Cyber Radio Radio


    Cyber Radio 1 was originally written for live Internet audio broadcasts at the
    Georgia Tech student radio station, WREK Atlanta 91.1 FM. It has been made available
    to the greater Internet in several UNIX versions, including a Linux version.


    It''s a simple tool: Digital information is read from an audio device (like /dev/audio)
    and then sent to any number of connected clients. These users must be using a
    Cyber Radio 1 client program, which comes in Microsoft Windows and Linux versions.


    The file is CyberRadio1.tar.gz, and it can be found on the accompanying CD-ROM
    and at ftp://sunsite.unc.edu/pub/Linux/apps/sound/.


    # # The Mbone and Linux


    The Mbone is a high-bandwidth Internet tool that''s to transmit live audio and
    video. You can implement the Mbone on your Linux server, but you''ll need to make
    sure that it support multicasting, and you''ll need to make some adjustments to
    your network setup.


    You can find more information at http://www.teksouth.com/linux/multicast.


    # # Whiteboard Software


    Whiteboard software allows two or more machines to be linked via the Internet
    to a whiteboard, which allows shared drawings to be created and disseminated in
    real time. The accompanying CD-ROM is wb from the Network Research Group of Lawrence
    Berkeley National Laboratory.


    The filename is linux-wb-1.59.tar.Z. It was grabbed from ftp://ftp.ee.lbl.gov/conencing/wb/'
