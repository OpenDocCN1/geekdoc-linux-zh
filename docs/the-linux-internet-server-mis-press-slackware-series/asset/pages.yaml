    # What Can Go Wrong


    A number of things can go wrong when you launch the Web server. Here are some
    of the more common error messages and how you can fix your problems.


    ```

    httpd: could not bind to port port

    bind: Operation not permitted

    ```


    This error message occurs when you change the Port setting in the httpd.conf to
    a port that''s not available to the server, usually due to incorrect permissions.
    Remember that most ports under 1024 are already claimed by the Linux system and
    are thus available only to the root user. Try logging in as the root user and
    launching the httpd service to see if this is indeed the case.


    ```

    httpd: could not bind to port port

    bind: Address already in use

    ```


    This error message occurs when the port is already in use. Port 80 is usually
    reserved for Web servers, so there''s the chance that another Web server is running.
    No Linux system has a Web server installed and'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 197


    running automatically, especially not Slackware Linux. Unfortunately, no program
    or routine will allow you to see a list of ports in use and what they''re running.
    The /etc/services file does list the ports and how they''re assigned, but they
    don''t list what''s actually in use. You could peruse through the listings returned
    by ps or netstat to see what processes and net services are actually running and
    try to extrapolate from that.


    ```

    httpd: could not open document config file

    fopen: No such file or directory

    ```


    This error message usually occurs when you''ve improperly configured the location
    of the httpd.conf file. Try using the httpd command with the -f option again.


    403 Access Forbidden


    This error message will be returned after a Web browser has actually connected
    to your Web server. This usually means that you''ve improperly configured your
    access.conf file to keep everyone away.


    500 Server Error


    This error message usually means that some software is failing, usually a CGI
    script.


    # Other Directives in Srm.conf


    The srm.conf file, which was covered earlier in this chapter, contains a number
    of settings that can help you fine-tune your Linux Internet server. We''ll cover
    the major directives here.


    # Setting Directory Indexing


    If a user tries to connect to a directory without specifying a file, there needs
    to a way to tell the Web server what page to send to the user. The default setting
    is to use a file called index.html placed in each directory. The default setting
    in the srm.conf file that controls this is as follows:'
  merge: -1
  pgno: 220
- img_proc: true
  md: '198 CHAPTER 4: Setting Up a Web Server


    ```

    DirectoryIndex index.html

    ```


    Therefore, when someone connects to http://www.kreichard.com, by default they
    are sent the index.html file that resides in the DocumentRoot directory, with
    the resulting URL:


    ```

    http://www.kreichard.com/index.html

    ```


    Like everything else in the Apache web server (and Linux, for that matter), you
    can go overboard customizing this setting. You could place a CGI program in the
    srm.conf DirectoryIndex setting:


    ```

    DirectoryIndex file.cgi index.html

    ```


    In this case, the Apache web server will look for a file named file.cgi. If it
    fails to find this file, it will then look for index.html. These files are assumed
    to be in the DocumentRoot directory, but you could specify a file or path either
    relative to the DocumentRoot location or an absolute pathname.


    If Apache doesn''t find either file.cgi or index.html, it will return a list of
    files in the directory.


    If you''re running a large Web site, you may have reason to have multiple files
    for indices, which can be changed easily on the fly. However, if you''re running
    a relatively straightforward Web site, there is no reason to make your DirectoryIndex
    too elaborate.


    # Fancy Indexing


    Another feature that ends up smacking of overkill is the FancyIndexing feature.
    When Apache sends a list of files in the directory, there is the option—FancyIndexing—of
    sending all along information about the file (such as the last time it was modified)
    and an icon, representing the file type (based on the filename extension).


    However, this really isn''t overkill. There will be times when you want to allow
    users the ability to download files from a Web server, in lieu of an FTP connection.
    In these instances, you''ll want to give information about the files available
    past just a filename. In fact, you'
  merge: -1
  pgno: 221
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 199


    can set up an FTP alternative by creating a directory that has nothing but files
    available for downloading. When a user selects that file, it''s sent to the Web
    browser, which is prompted to what action should be taken on the file. (A smart
    user will select saving the file to disk.) In these situations, FancyIndexing
    can be quite useful.


    # Adding Icons


    In situations where FancyIndexing is used, you''ll need some sort of mechanism
    for selecting the icons to place next to files. The directives AddIcon, AddIconByEncoding,
    and AddIconByType do this. Here are the defaults for this setting from the svm.conf
    file:


    ```

    AddIconByEncoding (CMP,/icons/compressed.gif) x-compress x-gzip

    AddIconByType (TXT,/icons/text.gif) /*

    AddIconByType (IMG,/icons/image2.gif) image/*

    AddIconByType (SND,/icons/sound2.gif) audio/*

    AddIconByType (VID,/icons/movie.gif) video/*

    AddIcon /icons/text.gif .ps .shtml

    AddIcon /icons/movie.gif .mpg .qt

    AddIcon /icons/binary.gif .bin

    AddIcon /icons/burst.gif .wrl

    AddIcon /icons/binhex.gif .hqx .sit

    AddIcon /icons/uu.gif .uu

    AddIcon /icons/tar.gif .tar .tar

    AddIcon /icons/back.gif .*

    AddIcon /icons/dir.gif ^DIRECTORY^^

    AddIcon /icons/blank.gif ^BLANKICON^

    ```


    These directives are self-explanatory. When the Apache server returns an encoded
    file directory listing ending in .Z or .gz it will place an icon (compressed.gif)
    next to the filename. When the Apache Web server sends out its MIME type of text,
    image, audio, and video it will send along the appropriate icons (text.gif, image2.gif,
    sound2.gif, and movie.gif, respectively). When the Apache Web server sends out
    a directory listing containing specific types of files (such as an MPEG movie
    file), it will send along a specific icon in the directory listing (in this case,
    movie.gif). The GIF files listed here ship with the Apache Web server, by the
    way, and are stored in the /icons directory.'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# 200 CHAPTER 4: Setting Up a Web Server


    You’re free to add more specific MIME types and icons. You’ll notice that the
    files listed here are all GIF files, which can be created by pretty any graphics
    editor.


    The final two entries are used to specify what to use for a sub उभ (the `dir.gif
    icon`) and a blank line (the `blank.gif` icon).


    Unless you really have a need to play a lot of games with these icons, it’s easiest
    to add icons by type, rather than by specific file type. Then again, the vast
    majority of filenames will be covered by the default settings in the `srm.conf`
    file, so your easiest course of action would be to just leave enough alone.


    You can add a description to a directory listing using the `AddDescription` directive.
    You can either use a description for a specific filename:


    ```

    AddDescription "He is not a crook." nixon.gif

    ```


    or a description for a range of filenames, specified using wildcards:


    ```

    AddDescription *.c source-code file." *.c

    ```


    The `AddDescription` directive is commented out in the default `srm.conf` file.
    In those cases the Apache Web server can’t come up with an appropriate icon for
    a file, it uses the `DefaultIcon` icon. The default in `srm.conf` is `/icons/unknown.gif`.


    # HeaderName and ReadmeName


    You can add text to a directory listing by specifying text files using the `HeaderName`
    and `ReadmeName` directives. The `HeaderName` directive inserts a specified text
    file (the default `HEADER`) to the beginning of a directory listing. The `ReadmeName`
    directive adds a text file (the default `README`) to the end of a directory listing.
    This can come handy if you want some text to describe the type of files in the
    directory, or other information that you feel the user should know.


    # The IndexIgnore Directive


    You don’t always want to make every file in a directory visible to users—that’s
    why the Linux operating system comes with hidden files.'
  merge: -1
  pgno: 223
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 201


    In this case, you''ll want to use the IndexIgnore directive to make sure that
    system files and other files are hidden.


    The default for this directive in the srm.conf file is


    ```

    IndexIgnore /*.??* ~ #* */HEADER* /*README* */RCS

    ```


    This line blocks six types of files:


    +   * /*.?? blocks out system hidden files (that is, files that begin with a period),
    while letting through the parent directory (which is specified with two periods).


    +   * ~ blocks backup files created by emacs. Many Web developers use emacs to
    edit HTML pages.


    +   * #blocks out backup files created by emacs. Many Web developers use emacs
    to edit HTML pages.


    +   * /*HEADER* blocks out the HEADER file used by the HeaderName directive.


    +   * /*README* blocks out the README file used by the ReadName directive.


    +   * /*RCS blocks out the RCS directory, which is created by the Revision Control
    System, a software-development tool that ships as part of the Linux operating
    system.


    You can add more options for this directive.


    # Adding Encoding


    Similar to the AddType directive is the AddEncoding directive, which is used by
    the server to tell the browser how a file is encoded. There are several types
    of encoding in the Internet world. Basically, the encoded refers to how a file
    is archived or compressed.


    No file within Apache specifies encoding types, so this task falls to the srm.conf
    file. If you go back and skim through this file, you''ll see the following lines
    within:


    ```

    AddEncoding x-compress Z

    AddEncoding x-gzip gz

    ```'
  merge: -1
  pgno: 224
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    They tell the server to send along a Content-Encoding header along with the actual
    file. These two cases are from the UNIX world, specifying files ending in .Z are
    compressed using the compress command and files ending in .gz are compressed using
    the GNU gzip command. For instance, when a server sends out a file named file.Z,
    it also sends along a header like the following:


    ```

    Content-Encoding: x-gzip

    ```


    When a browser runs across this header, it launches a command line and uncompresses
    or unzips the file before viewing it in the browser or launching an external application
    to view the file.


    ![](img/7488e49c99dd1fc906878692fde2ec31_225_0.png)


    Perhaps the most common compression format is the PKWare ZIP format, supported
    by both PKZip and WinZip. You might be tempted to support for content encoding
    for this popular format, but don''t—many different software packages support this
    format. In addition, support for ZIP files isn''t built in the operating system
    as it is in the UNIX operating system.


    NOTE


    # The Alias and Redirect Directives


    You reviewed the ScriptAlias directive earlier in this chapter. This directive
    has two cousins that are also set in the srm.conf file: Alias and Redirect. These
    commands, along with ScriptAlias, allow you to remap portions of the Web server
    across your entire Linux file system.


    Alias is exactly what it sounds like: It allows you to set up an alias for a sub
    True. Remember that it''s usually to keep URLs short and sweet; a URL of http://www.kreichard.com/personal/hobbies/cigars/don_tomas/index.html
    probably won''t be typed in accurately by most folks, a URL of http://www.kreichard.com/don_tomas
    certainly would. In this case, you could set up an alias for a directory. In this
    case, you might want to set up an alias like the following:


    ```

    Alias /don_tomas/ /usr/local/personal/hobbies/cigars/don_tomas/

    ```


    This tells the Web server to go to /usr/local/personal/hobbies/cigars/don_tomas/
    when the URL is http://www.kreichard.com/don_tomas/. The same would apply to requests
    for specific files: A URL of http://www.kreichard.com/don_tomas/summary.html would
    return the file'
  merge: -1
  pgno: 225
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    203

    /usr/_tomas/summary.html

    /usr/local/personal/hobbies/cigars/don_tomas/summary.html. The user won''t

    see the longer pathname.


    There''s really only one thing to watch out for: Make sure that you''re

    not using an alias that sits somewhere in the DocumentRoot.


    Redirect works similarly. It just redirects the request from the Web

    browser to another location, either another file on the local filesystem or

    t Internet. (Alias), on the other hand, is meant for use on the local file

    system.) For instance, you might want to redirect all requests for

    microsoft to linux. For instance, someone requesting a URL of

    http://www.kreichard.com/microsoft would be redirected to

    http://www.linux.org with the following line in the srm.conf file:


    ```

    Redirect /microsoft http://www.linux.org

    ```


    This is handy when working with Internet resources that have shifted to\other
    locations; when your hot Internet software company

    is swallowed by Microsoft or IBM, you can use the Redirect directive to

    route to the new owners.


    # The IndexOptions Directive


    Many of these directives can be set under one meta-directive,

    IndexOptions. Its options follow:


    +   - FancyIndexing turns on fancy indexing of directories.

    - IconsAreLinks makes the icons part of the anchor for the filename,

    for fancy indexing.

    - ScanHTMLTitles enables the extraction of the title from HTML

    duments for fancy indexing. If the file does not have a

    description given by AddDescription, then httpd reads the

    document for the value of the TITLE tag. Be warned that this

    CPU and disk-intensive.

    - SuppressLastModified suppresses the display of the last

    modification date, in fancy-indexing listings.

    - SuppressSize suppresses the file size in fancy-indexing listings.

    - SuppressDescription suppresses the file description in fancy-

    indexing listings.'
