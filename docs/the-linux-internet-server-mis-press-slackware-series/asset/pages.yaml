    # DocumentRoot


    This is the directory where your documents are stored; the default is /usr/lib/htdocs
    in Apache, although the default Linux installation places them in /var/lib/htdocs.
    Slack already did you the favor of moving the documents away from the server files,
    which is the recommended course of action. The location of this file is not a
