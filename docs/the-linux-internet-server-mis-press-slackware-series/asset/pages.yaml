  md: '# CHAPTER 4: Setting Up a Web Server 259


    The ServerRoot directive sets the directory where the server file live. Typically
    it will contain the subdirectories conf/ and logs/. Relative paths for other configuration
    files are taken as relative to this directory.


    > NOTE This setting must be changed with the default installation of Slack Linux.


    # ServerType


    +   Syntax: ServerType type

    Default: ServerType standalone

    Context: server config

    Status: core


    The ServerType directive sets how the server is executed by the system. Type is
    one of


    +   - inetd (The server will be run from the system process inetd; the command
    to start the server is added to /etc/inetd.conf)

    - standalone (The server will run as a daemon process; the command to start the
    server is added to the system startup scripts, such as /etc/rc.local or /etc/rc3.d/...)


    Inetd is the lesser of the two options. For each HTTP connection received, a new
    copy of the server is started from scratch; after the connection is complete,
    this program exits. There is a high price to pay per connection, but for security
    reasons, some administrators prefer this option.


    Standalone is the most common setting for ServerType since it is far more efficient.
    The server is started once and services all subsequent connections. If you intend
    running Apache to a busy site, Standalone will probably be your only option.


    If you are paranoid about security, run in inetd mode. Security cannot be guaranteed
    in either, even though most people are happy to use standalone, inetd is probably
    least prone to attack.'
