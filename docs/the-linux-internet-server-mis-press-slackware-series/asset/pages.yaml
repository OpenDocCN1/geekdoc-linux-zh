  md: '# CHAPTER 3: Installing Linux and Internet Components 85


    # Recompiling a Kernel


    Most Linux users will find that the precompiled kernels that come on the accompanying
    CD-ROM will work for them, as PC hardware is becoming reasonable homogenized.
    However, in the remote chance that you''ll need to recompile your kernel (whether
    directed to a Linux HOW-TO or through the advice from an expert on the Usenet;
    these will happen if you''re using a nonsupported SCSI CD-ROM, bus mouse, or sound
    card), here''s how to do so.


    +   1. If you haven''t installed the C compiler and kernel source, do that.

    2. Use the bootkernel disk you installed with to start your machine. At the LILO
    prompt, enter:


    ```

    LILO: mount root=/dev/hda1

    ```


    assuming that /dev/hda1 is your Linux partition. (This is the assumption made
    through the rest of this section.) If not, enter your Linux partition instead.
    After this, ignore any error messages as the system starts up.


    +   3. Log in as root, and recompile the kernel with these steps:


    ```

    cd /usr/src/linux

    make config

    ```


    At this point you''ll choose your drivers. Repeat this step until you are satisfied
    with LILO,


    this will build and install the new kernel:


    ```

    make dep ; make clean ; make zlilo

    rdev -R /vmlinuz 1

    ```


    If you are a bootdisk, these commands will build the kernel and create a new bootdisk
    for your machine:'
