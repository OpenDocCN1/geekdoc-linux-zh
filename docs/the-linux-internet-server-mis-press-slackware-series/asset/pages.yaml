  md: "The remaining local.host file looks like the following: ( no changes needed\
    \ for multiple domains): \n/var/named/db.127.0.0:\n\n```\n@ IN SOA luers.gosina.com.\
    \ hostmaster.gosina.com. (\n    9511801      ; Serial\n    10800         ; Refresh\n\
    \    3600          ; Retry\n    604800        ; Expire\n    86400 )       ; Minimum\n\
    \nIN NS luers.gosina.com.\nIN NS auth00.NS.UU.NET.\nIN NS auth01.NS.UU.NET.\n\
    IN PTR localhost.\n```\n\nHere is another sidenote. The preceding domains are\
    \ getting to Internet via UUNET/Altern, the secondary NS records for UU.NET, as\
    \ well as MX records for mail.UU.NET. If you're not dealing with UUNET then these\
    \ must also change.\n\nIf you had multiple domains as well as multiple C-class\
    \ addresses, then you would break up the reverse lookups for each domain depending\
    \ on their C-class address. You'll also need another line in the named boot file\
    \ with the reverse lookup of the particular address (in arpa format c.b.a.in-addr.arpa).\n\
    \n# Setting Up Apache\n\nNow that Slack Linux is set up to support multiple hosts,\
    \ it's time to configure Apache to support multiple hosts: by running a separate\
    \ http program for each hostname or by running a single http that serves all hostnames.\n\
    \nThe Apache group suggests that multiple http daemons can run when the different\
    \ virtual hosts need very different http configurations, such as different values\
    \ for ServerType, User, Group, TypesConfig, or ServerRoot, and the machine does\
    \ not process a very high request rate. Conversely, the Apache group suggests\
    \ using a single daemon sharing the http configuration between virtual hosts is\
    \ acceptable (which will probably be the case when you're at an ISP and servicing\
    \ many different clients or when the machine services a large number of requests),\
    \ and so the performance loss in running separate daemons may be significant."
