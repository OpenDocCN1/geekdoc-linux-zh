    handler which emulates the NCSA server''s behavior of determining file types from
    suffixes. What''''''ll be looking at, here, is the code that implements the AddType
    and AddEncoding commands. These commands can appear in .htaccess files, so they
    must be handled in the module''s private per-directory data, which in fact consists
    of two separate tables for MIME types and encoding information, and is declared
    as follows:'
