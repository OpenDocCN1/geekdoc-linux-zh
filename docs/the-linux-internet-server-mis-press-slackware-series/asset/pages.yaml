  md: '# 518 APPENDIX B: Hardware Supported by Slackware Linux


    # Tape Drives


    A number of tape drives are supported by Slackware Linux. Tape devices will come
    in handy for an Internet server—those backups might come in handy some point.


    In general, SCSI tape drives are supported with no problems.


    Also supported with no problems QIC-02 drives, as well as drives with dedicated
    controllers, including the Colorado FC-10/FC-20, Mountain Mach-2, and lumega Tape
    Controller II.


    You''ll need a kernel patch (ftp://sunsite.unc.edu/pub/Linux/kernel/tapes) to
    use tape drives that run from the floppy diskette controller, including QIC-117,
    QIC-40/80, QIC-3010/3020 (QIC-WIDE) drives.


    Unsupported tape drives include Emerald, Tecmar QIC-02, Colorado Trakker, Colorado
    TC-15, Irwin AX250L/Autrack 250, IBM Internal Tape Backup Unit, and CORETape Light.


    # UPS Devices


    Most UPS devices work in conjunction with PC hardware; as such, they''ll work
    with Linux with few problems. You''ll want to check the UPS HOW-TO for more information.


    To use the APC SmartUPS, you''ll need to install this package: ftp://sunsite.unc.edu/pub/Linux/UPS/apcd-0.1.tar.gz.
    To use UPS devices with RS-232 monitoring port (the “unipower” package), you''ll
    need to install this package:ftp://sunsite.unc.edu/pub/Linux/system/UPS/unipower-1.0.0.tgz.


    # Video Cards


    For the purposes of a Web server, any graphics card will work just fine—you won''t
    need much more than text mode or perhaps standard VGA resolution when working
    with the X Window System on a limited basis.


    If you want to use the X Window System on a more regular basis, however, you''ll
    want to make sure you''re using one of the following'
  merge: -1
