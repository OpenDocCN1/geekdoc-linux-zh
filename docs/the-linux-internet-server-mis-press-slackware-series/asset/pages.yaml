    # Electronic Mail


    The true engine behind the Internet is electronic mail, which is close to universal
    among Internet users. Electronic mail allows a user to send a text message to
    another user. The addressing is done by combining a username with the domain name
    of the machine. A user named richard at mr.net would have an Internet address
    of


    reichard@mr.net'
  merge: -1
  pgno: 46
- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slackware Linux


    Electronic mail is simple: You set up a mail server on your machine. This machine
    receives mail from your service provider. Your users connect to the mail server,
    which then sends their mail messages (if any) to them. In turn, their outgoing
    messages are also sent to the mail server, which routes them to your service provider.


    However, electronic mail can be a little trickier than this. Slackware Linux includes
    a slew of electronic-mail options, ranging from the venerable sendmail to newer
    alternatives designed for the greater Internet world. Chapter 8 covers your options.


    # Gopher


    In many ways, Gopher can be seen as a rough predecessor to the World Web Ab as
    it attempts to supply user-friendly tools to Internet users. Basically, Gopher
    allows users to connect to a Gopher server, which then sends them a menu of possible
    choices. These choices can be Gopher menus or documents stored on the local Gopher
    server, or documents stored on a remote Gopher server. When the user selects a
    menu item, a new request is sent to the Gopher server, and the process continues
    until the user receives enough data.


    However, in other ways Gopher is turning into a legacy system, as indexing tools
    like Glimpse combined with the flexibility of the World Web are making it irrelevant.
    If you''re starting to design data structures from scratch, you''re probably not
    going to want to go with Gopher. However, if you already have a lot of data already
    organized using Gopher, you''ll want to maintain that format.


    There are no native Gopher servers for Linux. However, it''s possible to take
    the original source code from the University of Minnesota (where Gopher was originally
    developed) and compile it for usage on Linux. In addition, the accompanying CD-ROM
    contains an excellent Gopher Server, GN. Chapter 5 covers Gopher.


    # The Usenet


    The Usenet is a collection of discussion groups, organized around various topics,
    such as programming, folk dancing, or politics. Some of the topics can be mainstream
    (such as rec.folkdancing) or they can be dreadfully'
  merge: -1
  pgno: 47
- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slackware Linux 25


    obscure (such as alt.barney.dinosaur.die.die.die). Anyone with access to the Usenet
    can post to a newsgroup and join in the discussion (unless the group is moderated,
    a situation you''ll learn about in Chapter 9).


    Your connection to the Usenet would come if you set up a NNTP server, which handles
    a feed from another Usenet news server, continuously updating the postings. You
    can choose to handle only a limited number of newsgroups, or else you can provide
    a total feed.


    Be careful, though, as the Usenet can be a voracious pit when coming to computing
    resources. A full Usenet feed is about 400MB per day, which can tie up a lot of
    your bandwidth even when using a 56K frame relay, never mind a dialup connection
    or ISDN. You''re best off limiting your Usenet feed to purely essential groups
    (such as alt.os.linux.slackware), instead of providing every newsgroup under the
    sun (which includes many that provide nothing but pornography, useless information,
    and racist rants and raves).


    There are a slew of Usenet tools that ship with Slackware Linux, and they are
    covered in Chapter 9.


    # Indexing Tools


    If Web Site has a lot of information, you may want to install software that indexes
    the contents of your Web site. You would then set up a Web page where users submit
    a search term to the indexing software. The indexing software then takes the result
    of your request and sends it along to a client, either in the form of a Gopher
    page or an HTML page. They are covered in Chapter 6.


    # FTP


    FTP stands for File Transfer Protocol, and it''s the mechanism for sending files
    back and forth from your Internet site to an Internet user. This user doesn''t
    need to be running a Web browser—they could be running an FTP client.


    An FTP server is built into the Slackware Linux operating system, which means
    there''s relatively little for you to do in terms of configuration. (In fact,
    the directory /home/ftp/pub is designed for FTP access.) You''ll learn more about
    FTP in Chapter 7.'
  merge: -1
