  md: '# CHAPTER 1:The Internet, Intranets and Slackware Linux


    Lee''s original plans were much more modest in scope, involving an academic system
    where researchers could easily browse through the words of other academic researchers
    around the world.


    Berners-Lee outlined his plans in a paper, where he acknowledged the pioneering
    ideas of Ted Nelson, who first visualized a hypertext system way back in 1967,
    which he dubbed Xanadu. (Xanadu, amazingly, is still under development; you can
    check out the details at http://xanadu.net/the.project.) Nelson''s theories are
    rather grandiose, involving both hypertext transactions and ways to protect copyrights
    in hypertext transactions (it''s amazing how well Nelson anticipated the problems
    posed by hypertext in the real world, however), and it''s to Berners-Lee''s credit
    that he cut through all the conceptual baggage to come up with was basically the
    world''s first workable hypertext system.


    By October 1990, CERN had embarked on the creation of such a system, and in December
    1990 the first Web browsers were available. Berners-Lee had fleshed out his hypertext
    medium with some basic building blocks. The Web documents were to be formatted
    in the HyperText Markup Language (HTML), which is basically a subset of the Standard
    Generalized Markup Language (SGML), which had already been developed by the U.S.
    government as a way to standardize documentation. HTML is basically a text medium,
    where portions of the documents are defined by tags. These tags are then interpreted
    by the Web browser, which then applies local resources to the document. Instead
    of providing a specific typeface for text, an HTML page merely provides a text
    tag, and the browser uses a locally specified text tag to render the page.


    > You''ll learn more about HTML in Chapter 11.


    ![](img/7488e49c99dd1fc906878692fde2ec31_34_0.png)


    The other important block provided by Berners-Lee is the HTTP, which governs how
    servers send documents to browsers. Basically, a Web browser sends information
    to the server, including a Uniform Resource Locator (URL). If you''ve spent any
    time around the Internet, you know the basic markup of a URL:


    ```

    http://www.kreichard.com

    ```'
