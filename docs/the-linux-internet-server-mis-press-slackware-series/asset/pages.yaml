  md: '# CHAPTER 6: Indexing with Glimpse and GlimpseHTTP


    Table 6.2 Glimpse Search Options (continued)


    | Option | Purpose |

    | --- | --- |

    | -k | No symbol in the pattern is treated as a meta character. For example, glimpse
    -k ''a(b)c*'' will find the occurrences of a(b)c*, where glimpse ''a(b)c*'' will
    find substrings that match the regular expression a(b)c*. (The only exception
    is ^ at the beginning of the pattern and $ at the end of the pattern, which are
    still interpreted in the usual way. Use \| or $ if you need them verbatim.) |

    | -K port_number | Used in conjunction with glimpseserver (-C) to connect to one
    server at the specified TCP port number. |

    | -l | Outputs only the files that contain a match. This option differs from the
    -N option that the files themselves are searched, but the matching lines are not
    shown. |

    | -Lx xy xyz | If one number is given, it is a limit on the total number of matches.
    Glimpse outputs only the first x matches. If -l is used (i.e., if filenames are
    shown), the limit is on the number of files; otherwise, the limit is on the number
    of records. If two numbers are given (xy), then y is an added limit on the total
    number of files. If three numbers are given (xyz), then z is an added limit on
    the number of matches per file. If any of x, y, or z is set to 0, it means to
    ignore it (in other words, 0 = infinity in this case); -L 10 will output all matches
    to the first 10 files that contain a match. This option is particularly useful
    for servers that need to limit the output to clients. |

    | -m | Used for glimpse internals. |

    | -M | Used for glimpse internals. |

    | -n | Each matching record (line) is prefixed by its record (line) number in
    the file. To compute the record/line number, agre needs to search for all delimiters
    (or line breaks), which can slow down the search. |

    | -N | Searches only the index (so the search is faster). If -o or -b are used,
    then the result is the number of files that have a potential match plus a prompt
    to ask if you want to see the filenames. If -y is used, then there is no prompt
    and the names of the files will be shown). a way to get the matching filenames
    without even having access to the files themselves. However, because only the
    index is searched, some potential matches may not be real matches. With -N you
    will not miss any file, but you may get extra matches. For example, since the
    index stores everything in lowercase, a case-sensitive query may match a file
    that has only a case-insensitive match. Boolean query may match a file that has
    all the keywords in the same line (indexing with -b allows glimpse to figure out
    whether the keywords are close, on the same line or in the same record without
    looking at the file). If the index was not built with -o or -b, then this option
    outputs the number of blocks matching the pattern. This is useful as an indication
    of how long the search will take. All files are partitioned into usually 200 to
    250 blocks. The file .glimpse_statistics contains the total number of blocks (or
    glimpse -N a will give a pretty good estimate; only blocks with no occurrences
    of a will be missed.)'
