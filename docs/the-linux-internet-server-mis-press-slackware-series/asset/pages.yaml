  md: '# Your E-Mail Tools: Sendmail and Smail


    Basically, you have two major tools that can be used to transport electronic mail.
    Both have things to recommend them.


    Sendmail is a venerable mail-transport tool in the UNIX world, and the most recent
    version is on the accompanying CD-ROM. (If you hearken back to Chapter 3, you
    were asked if you wanted to install and configure sendmail when installing Slack
    Linux. At that point, you should have responded in the affirmative and supplied
    your IP address and other configuration for sendmail. If not, you can go back
    to the setup program and send sendmail.)


    However, sendmail can be a pain to set up and configure. It''s really meant for
    a larger Internet site that has complicated routing requirements, such as routings
    between different subnets. If you''re running a smaller Linux Internet site, you
    may want to consider using smail instead. Smail is included with Slack on the
    accompanying CD-ROM, but isn''t automatically configured upon installation.


    > NOTE There are additional Linux mail tools at http://sunsite.unc.edu/pub/Linux/system/Mail/news/INDEX.html.
    You''re encouraged to browse through this directory to see if there may be some
    other Linux tools to fix your needs. In addition, newer Linux tools are posted
    to this site periodically.


    If you want to run smail as an SMTP daemon, then add the following line to /etc/inetd.conf:


    ```

    smtp stream tcp nowait root /usr/bin/smtpd

    ```


    Mail is sent along automatically when your server is connected to the Internet.
    If not, the mail is spooled in /usr/spool/smail/input until the Internet connection
    is made, which time quick runs and sends the mail.


    Be warned that smail has some limitations. It was written for UUCP usage initially,
    but it has been adapted for SMTP. It''s really meant for smaller Internet sites
    that don''t do a lot of traffic in electronic mail.


    Also, it''s really convenient that sendmail is regarded as the de facto electronic-mail
    tool in the Linux Internet world, as well as in the greater Internet world. The
    advice here is to spend some time with your ISP,'
