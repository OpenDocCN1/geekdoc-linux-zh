  md: '# 72 CHAPTER 3: Installing Linux and Internet Components


    # Setting Up the Swap Space


    As you''ve probably guessed by now, much of the additional steps Linux installation
    involves an actual installation and then again, telling Linux about the installation.
    This is certainly true if you installed a swap partition. (If you have not, you
    can skip this step.) You''ve already installed the partition, made it active,
    and changed the partition type to a Linux swap partition. Now you need to tell
    Linux about this partition again. However, you don''t need to format this partition,
    as you''ve already done so with the mkswap command.


    # Selecting the Target for Linux


    This selection should be rather simple: You''ll want to install the Linux partition
    earlier in this chapter. When you select Target from the Setup menu, you''ll automatically
    be presented with this partition. This section covers the choices you''ll make;
    for the most part, you''ll want to go with the default choices.


    Formatting the Linux partition is the next step. You''ll want to format the Linux
    partition for a new installation; however, if you''re using the setup program
    to upgrade from a previous installation, you won''t want to format the Linux partition.


    Choosing inode density is next. Again, you''ll want to go with the default, unless
    you have Linux experience and know that the default won''t help you.


    After the hard disk chugs and formats the Linux partition, you''ll be asked if
    you want to make a DOS partition visible (or, more technically speaking, mounted)
    from Linux—assuming that you''ve created such a partition. Making this partition
    visible won''t affect Linux performance, nor will it eat away at the size of the
    Linux partition. Since you may find it handy to move files via the DOS partition,
    you''ll probably want to make this partition visible. The name you choose doesn''t
    really matter, so we use dos or dosc. When you run the ls command later in your
    Linux usage, you''ll see dos or dosc listed as just another directory, and the
    files within will appear as Linux files.'
