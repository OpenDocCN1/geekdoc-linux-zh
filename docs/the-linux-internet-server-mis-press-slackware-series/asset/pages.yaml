  md: '# # What you will find on the CD-ROM


    The accompanying CD-ROM contains a full implementation of the Slackware Linux
    operating system; details for installing and configuring Slackware Linux can be
    found in Chapter 3 of this book. Slackware Linux ships with many tools that you
    will find useful for developing your own Linux Internet server, including the
    Apache Web server, Perl, and Tcl.


    In addition, there are a number of directories specific to this book and using
    Linux as an Internet server. These programs are detailed through the course of
    this book. The contents of these directories are as follows:


    /internet:


    +   - The CyberRadio audio server (CyberRadio1.tar.gz)

    - FreeWAIS (fwfsfer2062-elfbin.tgz)

    - The GN Gopher server (gn.tar.gz)

    - SATAN (satan-1.1.1.Linux.tar.gz)

    - Shadow passwords (shadow-current_tar.gz)

    - The Squid object cache (squid-1_1_5-src-tar.gz)

    - WhiteBoard (linux-wb-1.59.tar.gz)


    /internet/editors:


    +   - Amaya (amaya-linux-elf_0_9a_tar.gz)

