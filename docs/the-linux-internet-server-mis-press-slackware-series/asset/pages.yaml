  md: '# Firewalls


    A firewall is a separate Web server that allows and prevents access to and from
    your Web site. Sometimes this is a separate PC sitting between your network and
    the Internet, while at other times it can be a separate process running on your
    Web server.


    # Where to Place the Firewall


    There are three places to put your server in conjunction with the firewall:


    +   - The server can be connected directly to the outside world, with the firewall
    set up to protect your internal network.

    - The server can be connected only to the firewall, which handles both incoming
    and outgoing Internet requests

    - The server can be installed directly on the firewall.


    There are some advantages to each.


    If you''re running an Intranet and want to allow your users access to the outside
    world without allowing the outside world access to your Intranet, you''ll want
    to place the firewall directly on the Internet and your server on your internal
    network. Users who want access to the Internet at large go through the firewall.
    (Of course, your users who may want access to your server from far away won''t
    be able to get into your server.)


    Placing your server directly on the Internet with the firewall protected an inner
    network means that the server is vulnerable (in the Internet world, this is called
    the "sacrificial-lamb" approach), but that the inner network—where sensitive data
    is kept—is always protected.


    The idea of placing the firewall on the server generally isn''t a good one, but
    there are financial situations where this is your only choice.'
  merge: -1
  pgno: 523
- img_proc: true
  md: '# Three Types of Firewalls


    Basically, there are three types of firewalls, as defined by the Internet world:


    +   - application proxy gateway

    - circuit level relay

    - packet filter


    Your security tools can include all three of these tools, or any combination.

    A proxy is the most commonly used firewall. Basically, a proxy server sit between
    an internal network and the outside world. When a user on the internal network
    wants to communicate with the outside world, it first contacts the proxy server,
    which then reaches out to the outside world (the greater Internet). The advantage
    here is that you can log transactions and apply some limits to specific Internet
    protocols; for instance, you can allow FTP clients to grab software from your
    site, but you can prevent them from uploads.


    A circuit-level relay is a cruder tool that performs some low-level gateway functions,
    but doesn''t allow you to track transactions or apply specific rules to specific
    Internet protocol. The SOCKS technique is a good example.


    Packet filtering has traditionally been a popular firewall technique, as it offers
    a high level of control through rules. These rules can be applied to IP addresses
    (incoming and outgoing), port numbers, specific protocols being transported, and
    more. The actual IP address of the internal-network user isn''t revealed to the
    Internet, but the IP address of the proxy server is.


    # Firewall Tools


    There are a number of tools that you can use to create your own firewall.


    The first is the Cern server that was described in Chapter 4 and contained on
    the accompanying CD-ROM. It''s set up to be used as proxy server. Documentation
    for using the Cern server is at http://www.w3.org/pub/WWW/Daemon/User/Installation/Installation.html.'
  merge: -1
  pgno: 524
- img_proc: true
  md: '# 502 CHAPTER 13: Security


    The second is the TIS Firewall Toolkit, which is freely available software in
    source-code form. Because of legal reasons, however, this product is not contained
    on the accompanying CD-ROM. You can read more about it at http://www.tis.com/docs/products/fwtk/.
    Using this toolkit is not a simple matter, and if you’re not a byte wizard that
    knows everything about TCP/IP, you should avoid it. In addition, there’s no Linux-specific
    help with this product.


    # SATAN


    Sometimes the best way to find holes in your system is to look for them yourself.
    That’s the theory behind SATAN, the Security Administrator Tool for Analyzing
    Networks. Its home page is http://www.cerf.net/cerfnet/security/satan/index.html.
    We’re not going to go into installation and such the home page covers more than
    adequately—but we will point out that it’s an essential tool for system security,
    and one that you should consider using.


    Be warned that Linux support for SATAN isn’t absolute. We’re including SATAN on
    the accompanying CD-ROM (the filename is satan-1.1.1.Linux.tgz) but the official
    SATAN site doesn’t promote this port to Linux.


    # Linux Security Vulnerabilities


    No system is ever truly secure. The folks at the Linux Emergency Response Team—and
    specifically Alexander O. Yuriev—have put together a list of alerts that are applicable
    to Linux systems. This information comes from http://www.redhat.com/linux-info/security/Linux-Security-FAQ/,
    and it’s there that you should search for more information and a link to the original
    alert message. Vulnerabilities include:


    +   - vixie cron

    - lpr

    - sendmail'
  merge: -1
