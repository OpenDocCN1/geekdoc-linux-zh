- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    # ServerName


    ServerName new.host.name is used to return an Internet host other than the one
    that the server would normally return. The trick here is that it has to be a legitimate
    DNS name for your host (this is more useful when you''re running multiple hosts
    on the same machine, of course). This is handy when there''s a discrepancy between
    the machine name and what you want the world to see as the server. For instance,
    many larger sites have machine names that have an individual string listed before
    the domain name. In a situation like this, you don''t want the world to see that
    the server name is (for example) kevin.kreichard.com—you want the world to see
    a server name of www.kreichard.com.


    # CacheNegotiatedDocs


    #CacheNegotiatedDocs allows proxy servers to cache documents called from your
    Web server. This is handy if you''re running an intranet and know that your documents
    won''t change often. However, since this isn''t usually the case, this line is
    commented out.


    # TimeOut


    TimeOut 400 refers to the time (in seconds) between a request and a time-out if
    the request can''t be handled.


    # SpareServers


    MinSpareServers 5 and MaxSpareServers refer to the amount of spare servers that
    Apache maintains. Remember that a new process is started for each new user that
    connects to a Web server; all new users are said to have their own servers running.
    Most Web servers require that you fill in a specific number of servers that are
    always maintained. Apache, however, adjusts to the workload; if there''s a need
    for a lot of servers, Apache will create extra servers at a rate of one per second
    (or spare servers, in the parlance of this configuration file). These settings
    should be adequate for all the busiest Web sites; having too high a number of
    MinSpareServers and/or MaxSpareServers is a waste of system resources.'
