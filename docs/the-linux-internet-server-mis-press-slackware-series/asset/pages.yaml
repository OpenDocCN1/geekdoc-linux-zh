    # Adding Modules


    As you can tell from the previous listing of modules, there''s a lot of functionality
    that you can add to your Web server via additional modules. There are listings
    of modules at the Apache Web site (http://www.apache.org/dist/contrib/modules/),
    and a registry of Apache modules is maintained at http://www.zyzyva.com/server/module_registry/


    The instructions for adding any modules comes from Aran Mirzadeh (awm@gosina.com).
    To add a module to the Apache server, you need to edit the Configuration file
    in the source directory. There are two things to consider:


    +   - Does the extension need any extra libraries to be linked? If yes, then add
    the name of these libraries to the EXTRA_LIBS variable in the file. For example,
    to link the mSQL authentication package, you need to add -lms to the list. If
    your library is in a nonstandard location, you will also need to specify the path
    using the -L/path/to/lib/dir before the -l option.


    +   - Does the extension need any extra paths to find header files? If the include
    files needed by the module are in a nonstandard place, then chances are you will
    need to add the path to those to the compile command. For example, if the header
    files for the mSQL authorization package are in /usr/local/Minerva/include, then
    you will probably need to add -I/usr/local/Minerva/include to the FLAGS variable
    in the Configuration file. Next, copy the source file for the module to the Apache
    src directory. Now you must also add the module to the list of modules. This is
    as simple as adding a line like this to the Configuration file:


    ```

    module_name module_code.o

    ```'
