    should be a primary key. Normally this table is compulsory, but it is possible
    to use a fall-through to other methods and use the mSQL module for group control
    only. See the Auth_MSQL_Authorative directive, which follows.


    Auth_MSQLgrp_table < mSQL table name in the above database >


    This contains at least the fields with the username and the group. Therefore,
    a user that is in multiple groups has multiple entries. There might be some performance
    problems associated with this, and one might consider having separate tables for
    each group (rather than all groups in one table) if your directory structure allows
    for it. One only needs to specify this table when doing group control.


    Auth_MSQLuid_field < mSQL field name >


    This is the name of the field containing the username in the Auth_MSQL_pwd_table
    and optionally in the Auth_MSQLgrp_table tables.


    Auth_MSQLpwd_field < mSQL field name >


    This is the fieldname for the passwords in the Auth_MSQLpwd_table.


    Auth_MSQLgrp_field < mSQL field name >


    This is the fieldname for the group. Only the fields used need to be specified.
    When this module is compiled with the BACKWARD_VITEK option, the uid and pwd field
