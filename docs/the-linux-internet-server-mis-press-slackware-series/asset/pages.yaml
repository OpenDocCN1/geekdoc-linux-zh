  md: '# CHAPTER II: HTML and Web Pages 465


    From this basic line you can learn some things about the HTML language:


    +   - HTML tags usually appear in pairs. The first part of the HTML tag "turns
    on" the formatting, while the second part of the tag turns off the formatting.
    In our example, the <TITLE> tag tells the Web browser that the beginning of the
    title is forthwith, and the </TITLE> tag signifies the end of the title. (The
    beginning tag lacks a slash.) Almost all HTML tags appear in pairs.

    - Case doesn''t matter. HTML tags don''t have case requirements, unlike a whole.
    <TITLE>, <TitLe>, and <title> are the same thing as far as a Web browser is considered.


    We can add our title to our Web page:


    ```

    ```

    This is our home page.

    We want it to look really spiffy.

    We want a headline here.

    We want some bold text here.

    Finally, we want a link to Kevin''s home page.

    ```

    ```


    Still, this doesn''t do a lot for our document layout. A Web page needs a declaration
    that tells the Web browser what follows is, well, a Web page. This is done by
    placing <HTML> at the beginning of the Web page and </HTML> at the end of the
    Web page. Most newer Web browsers don''t require these tags to accurately lay
    out a Web page, but it doesn''t hurt to include them for the sake of users of
    older Web browsers.


    You can include information about the Web page using the <HEAD></HEAD> tag. This
    information isn''t displayed as part of the Web page, but is seen when a user
    views the document source, or when the page is edited in a text or Web-page editor.
    This might include the name of the person creating the page, or the department
    where the document originated (in cases where a larger corporation is implementing
    a Linux server). A <HEAD> tag might look like this:


    ```

    `<HEAD>This is Kevin''s test page.</HEAD>`

    ```'
