  md: '# CHAPTER 4: Setting Up a Web Server


    # StartServers


    StartServers 5 is the number of servers Apache starts when launched. Since Apache
    will dynamically create servers in times of high demand, this figure isn''t that
    important.


    # MaxClients


    MaxClients 150 refers to the number of users that can be connected simultaneously.
    If you''ve got more RAM than average you can probably jack this number a little
    if you find that your Web server is turning away a lot of users.


    # MaxRequestsPerChild


    MaxRequestsPerChild 30 is the number of additional requests each client can make
    before the process is eliminated. A setting of 0 makes all processes permanent.
    This is done for memory-management reasons (it reduces the damage caused by memory
    leakage, as well as reducing the number of processes when the server load reduces),
    not because of any real need to limit users.


