  md: '# CHAPTER 3: Installing Linux and Internet Components


    When using the FDISK utility, you''ll see references to primary and extended partitions,
    as well as logical drives. Here''s an explanation:


    +   - The **primary** partition is the partition containing the files (**IO.SYS,
    MSDOS.SYS, COMMAND.COM**) needed to boot MS-DOS. In essence, this is your C: drive.
    The partition cannot be divided into other logical drives.

    - The **extended** partition or partitions do not contain these boot files. An
    extended partition can exist as its own logical drive (such as D: or E:) or be
    divided into additional logical drives.

    - The **logical drive** is the portion of a partition assigned a drive letter.
    For instance, an extended partition can be divided up into up to 23 logical drives
    (**A:** and **B:** are reserved for floppy disk drives, and C: is reserved for
    the primary partition, leaving 23 letters).


    Additionally, the **non-DOS** partition is for another operating system, such
    as Linux. Chances are that you won''t need to deal with more than a primary drive
    or an extended drive.


    After selecting 3, you''ll see the screen shown in Figure 3.2.


    Delete DOS Partition or Logical DOS Drive

    Current fixed disk drive: **1**


    Choose one of the following:

    1. Delete Primary DOS Partition

    2. Delete Extended DOS Partition

    3. Delete Logical DOS Drive(s) in the Extended DOS Partition

    4. Delete Non-DOS Partition


    Enter choice: [ ]


    Press **Esc** to return to FDISK Options


    **Figure 3.2** The delete screen for FDISK.'
