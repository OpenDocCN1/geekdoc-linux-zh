  md: '# 444 CHAPTER 9: Setting Up a News Server


    # All the News That Fits


    The Usenet is the world’s largest bulletin board. With hundreds of thousands of
    people participating all over the world, the Usenet can be seen as the collective
    wisdom of the Internet.


    The Usenet is organized by newsgroups, which are specialized discussion groups.
    Some of the groups are very specialized, such as scientific groups devoted to
    one small area of biology or computer-science groups devoted to one small aspects
    of an operating system. (There are many newsgroups connected with Linux; see Appendix
    A for details.)


    Before deciding on which Usenet software to use, you’ll first need to decide if
    you even want to offer it. Handling a Usenet newsfeed is not an insignificant
    chore, as one day’s postings can run into 400 or 500 megabytes, and typically
    you’re looking at keeping these postings for seven days. That’s a lot of traffic,
    and in most situations a separate machine is needed to handle the Usenet feed.
    Typically, a Usenet feed is checked once an hour, with new messages going out
    and coming in. This can eat up a lot of your bandwidth, particularly if you’re
    trying to use a lower-speed link (like ISDN or a dialup link) for your Internet
    server.


    Most ISPs will offer access to their news server to their clients. In this situation,
    a user will connect directly to the ISP news server to check the newsgroups. It
    doesn’t make much difference for the user, unless you’re running your Internet
    server on a slow link (such as a dialup link).


    Deciding which course to take is probably more difficult than it looks. Let’s
    face it—most of your users won’t bother with newsgroups, since newsgroups perfectly
    illustrate Sturgeon’s Law (90 percent of everything is crap). There will always
    be a small and vocal minority who will want a full Usenet feed, mainly so they
    can waste time in their cubicles exchanging conspiracy theories or what really
    was the meaning behind that cryptic statement on last week’s episode of The X
    Files.


    If you’ve figured out that the feeling here is that a full Usenet feed is a waste
    of time and computing resources, you win the jackpot.


    # A First Decision'
  merge: -1
  pgno: 467
- img_proc: true
  md: '# CHAPTER 9: Setting Up a News Server 445


    # Evaluating Your Needs


    If you do decide to go with a Usenet feed, you''ll need to make sure that you
    have the correct resources:


    +   - Do I have enough hard-disk space? As mentioned earlier, a full Usenet feed
    can carry into 400 or 500 megabytes per day, and as the Usenet descends into a
    fractured world where a single message can appear in 10 newsgroups (an event called
    crosposting), that number is probably on the conservative side.

    - Do I have enough network capacity? Most Usenet servers are set up to suck a
    feed once an hour or so. If we''re talking about tens of thousands of megabytes
    at that time, you''re looking at a serious crimp in your network capacity. (You
    can avoid this by only performing a feed at off hours, like in the middle of the
    night. However, this detracts from the immediacy of the Usenet.)

    - Do I really need offer a full newsgroup feed? If you''re using your Linux Internet
    server and offering paid access to the rest of the world, you''ll need to offer
    a Usenet feed—your clients will expect it. But if you''re running a Linux Internet
    server in a corporate situation, there are very few reasons to offer full Usenet
    access to your users. (Exceptions occur in the high-technology field, where employees
    might monitor newsgroups related to your business.)

    - Do I have a machine for offering Usenet access? You''ll want to dedicate a machine
    for a Usenet server. Usenet software isn''t always the most stable software in
    the Internet world, and it''s not unheard of for a large feed to overwhelm a server.
    You don''t want a Usenet server to drag down the rest of your Linux Internet server,
    even if you only have a partial feed.


    If you do decide to offer Usenet access on a local Usenet server, you can use
    one of the many Linux Usenet servers that ship with Slack Linux.'
  merge: -1
  pgno: 468
- img_proc: true
  md: '# CHAPTER 9: Setting Up a News Server


    Maintaining a Usenet feed is a little complicated than just installing a server
    and creating some content. You''ll need to know how to use scheduling commands
    like cron, and you''ll need to know something about the networking aspects of
    Linux. You''ll want to check out a UNIX command reference like UNIX in Plain English
    (MIS-Press) or find a good Linux tutorial.


    There are two main news servers: INN and Cnews. When you installed Slack Linux,
    you were asked to make a decision between the two. In some ways, it doesn''t make
    a difference which you chose; both work, but they''re configured in different
    ways. Cnews is a more basic server that''s easier to configure, but INN is know
    for having more advanced capabilities.


    You can''t run both of these news servers. Disaster will ensue.


    # Cnews


    Installation was automatic for Cnews when you installeding Linux. (If not, run
    the setup program again and install in that fashion.) There are a number of files
    to peruse after installation, and they''re listed in Table 9.1.


    Table 9.1 Cnews Files


    | File | Purpose |

    |---|---|

    | /usr/local/lib/news/active | Lists the active newsgroups; this file is not to
    be edited manually. |

    | /usr/local/lib/news/batchparms | Lists the batch parameters. |

    | /usr/local/lib/news/exploit | Defines when articles expire. |

    | /usr/local/lib/news/mailbox | Specifies the name in mailed replies. |

    | /usr/local/lib/news/mailpaths | Sets the mail address for posting to moderated
    groups. |

    | /usr/local/lib/news/organization | Defines your organization. |

    | /usr/local/lib/news/sys | Lists other linked systems. |

    | /usr/local/lib/news/whoami | Defines your hostname. |'
  merge: -1
  pgno: 469
- img_proc: true
  md: '# CHAPTER 9: Setting Up a News Server 47


    If you want to add newsfeeds, use the addfeed program; if you want to add newsgroups,
    use the addgroup program. The documentation details how to add scheduling via
    a crontab file.


    # InterNetNews (INN)


    In a more perfect world, you would go with INN right away. However, INN is a more
    “difficult” news server, in that it takes a little more skill to set up and configure,
    and that it needs to be running at all times with its own daemon (inn); as opposed
    to Cnews, which can be set up to grab the news at specific times). On the flip
    side, INN is regarded as a speedier news server, in that it takes less time to
    grab a feed.


    # Working with your Crontab File


    You''ll want to add INN information to your crontab file. The INN distribution
    comes with a file called crontab-news, which contains information to add to your
    crontab setup:


    ```

    SHELL=/bin/sh

    #

    MAILTO=ROOT

    #

    #===================================================================

    # INN-1.4 (Inter Net News)

    #

    # Sample crontab file by andreas@knobel.knirsch.de (Andreas Klemm)

    #

    # copy it to /usr/spool/cron/crontabs/news

    #

    # Reboot your system or

    # kill and restart the crond job, to activate this file

    #===================================================================

    #

    #---------------------------------------------------------------------------------

    # send news batches to your news feed

    #---------------------------------------------------------------------------------

    ```'
  merge: -1
  pgno: 470
- img_proc: true
  md: '```

    #

    # 0,15,30,45 * * * /usr/lib/news/bin/sendbatch - manlobi > /dev/null

    #-

    # Daily housekeeping ... expires news and other things

    #-

    # 0 22 * * * /usr/lib/news/bin/news.daily < /dev/null

    #-

    # offer spooled news - that was spooled into the incoming directory

    # the INNd server wasn''t available - again to the INNd server

    #-

    #-

    # 15 * * * /usr/lib/news/rnews -U

    ```


    This file is simple to analyze:


    +   * SHELL=/bin/sh, as you should know by now, is the notation for launching
    a shell.

    * MAILTO=root forwards mail from users to the root user.

    * 0,15,30,45 * * * /usr/lib/news/bin/sendbatch - manlobi > /dev/null tells cron
    to get every 15 minutes. The manlobi is the generic term used in the configuration
    file; you''ll need to change this to an alias for your service provider''s newsfeed.

    * 0 22 * * * /usr/lib/news/bin/news.daily < /dev/null runs the tasks in the news.daily
    file at 10 p.m. (22:00 in military time). These tasks would include expiring news
    items.

    * 15 * * * /usr/lib/news/rnews -U sends spooled news to INN server in situations
    when the server wasn''t available. The default is every hour, at 15 minutes past
    the beginning of the hour.


    # Other Configuration Files


    There are a number of configuration files used by INN. For the most part, you''ll
    need to edit some of these files. They are all found in /usr/lib/news.'
  merge: -1
  pgno: 471
- img_proc: true
  md: '# CHAPTER 9: Setting Up a News Server 449


    The INN documentation will refer to these files being in the /usr/local/lib/news
    directory, and this directory is specified in some of these configuration files.
    Instead of changing all of these references, it''s easier to set up a link for
    /usr/local/lib/news to /usr/local/lib/news.


    The expire.ctl file is used to specify when newsgroup expire (that is, how long
    items are to be stored before they are purged from the system). The default is
    to purge all groups within five days. However, it''s possible to never let any
    news item be purged, and it''s also possible to set up specific newsgroups to
    be purged at different intervals.


    The inn.conf file specifies the domain, moderator mailer, host, server, and organization
    for an INN news server.


    The hosts.ntp specifies where the news is grabbed from.


    The newsfeeds file is used if you send along a newsfeed to another site. (Related
    to this file is the nnrp.access and nntpsend.tl files.)


    The moderators file is used to send messages along to moderated newsgroups, instead
    of being posted directly to the newsgroup.


