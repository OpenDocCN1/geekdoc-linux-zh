  md: '# CHAPTER 6: Indexing with Glimpse and GlimpseHTTP


    Table 6.1 Glimpseindex Options (continued)


    | Option | Purpose |

    | - | - |

    | -T | Builds the turbo file. Starting at version 3.0, this is the default, so
    using this option has no effect.

    | -X | Extracts titles from HTML pages and add the titles to the index (in .glimpse_filenames).
    This works only on files whose names end with .html, .htm, .shtml, and .htm. The
    route to extract titles is called extract_info, in index/filetype.c. This feature
    can be modified in various ways to extract info from many file types. The titles
    are appended to the corresponding file names with a space separator. Glimpseindex
    assumes that file-names don''t have spaces in them.

    | -wk | Glimpseindex does a reasonable, but not a perfect, job of determining
    which files should not be indexed. Sometimes a large text file should; for example,
    a dictionary may match queries. The -w option stores in a file called .glimpse_messages
    (in the same directory as the index) list of all files that contribute at least
    k words to the index. The user can look at this list of files and decide which
    or should not be indexed. The file_exclude exclude files that will not be indexed
    (see a more detailed discussion later). The recommended setting for k is around
    1000. This is not an exact measure. For example, if the same file appears twice,
    the second copy will not contribute any new words to the dictionary (but if you
    exclude the first copy and index again, the second copy will contribute).

    | -z | Allows customizable filtering, using the .glimpse_filters file to perform
    the programs listed for each match. The best example is compress/decompress. .glimpse_filters
    include the line * .z uncompress (separated by tabs), then before indexing any
    file that matches the pattern Z (same syntax as the one for .glimpse_exclude)
    the command listed is executed first (assuming input is stdin, which is why uncompress
    <) and its output (assuming it goes to stdout) indexed. The file is not changed
    (i.e., it stays compressed). If -z is used, the program is used on the fly. Any
    program can be used (with run exec). For example, we filter out parts of files
    that should not be indexed. Gimpseindex tries to apply all filters in .glimpse_filters
    in the order they are. For example, if you want to uncompress a file and extract
    some part of it, put the compression command (as shown in the preceding example)
    first and then another line that specifies the extraction. Note that this can
    slow down the search because the filters need to be run before files are searched.


    Glimpse uses the agrep command to search through these indexes. It''s actually
    a fairly flexible system allowing for misspellings, Boolean queries, and excluded
    terms. There are a number of options:


    ```

    glimpse -1 Linux

    ```'
