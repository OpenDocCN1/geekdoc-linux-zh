  md: "# CHAPTER 3: Installing Linux and Internet Components\n\nWith the new 's3MCLK'\
    \ entry for the XF86Config file now you can now specify, e.g.\n\n```\ns3MCLK 55\n\
    ```\n\nfor a 55-MHz MCLK, which will reduce snowing. Smaller MCLK values will\
    \ reduce performance a bit so you shouldn't use a too low value (55 or 50 should\
    \ be a good guess in most cases).\n\nBelow is a small shell script, which might\
    \ be useful to determine the approximate value for MCLK (about +/- 1-2 MHz error).\
    \ Before running this script you must add the line:\n\n```\ns3Mnadjust -31 255\n\
    ```\n\nto the device section in your XF86Config file and restart X Window. With\
    \ this option (which is for testing and debugging only) you'll get lots of disastrous\
    \ display flickering and snowing, so it should be removed immediately after running\
    \ the test script below.\n\nRunning this script will use xbench and/or xlperf\
    \ to run a test to determine the MCLK value, which is printed in MHz. Up to 4\
    \ tests are run, so you'll get up to 4 estimates (where the first might be the\
    \ most accurate one).\n\n```\n#!/bin/sh\n\nexec 2 > /dev/null\n\nscale=2\n\ncalc()\
    \ {\n  m=awk 'BEGIN(printf \"%.0f\\n\", ($1 + $2) / $3; exit)'\n  [-z \"$m\" ]\
    \ && m=`echo scale=$scale; ($1 + $2) / $3 | bc`\n  [-z \"$m\" ] && m=`echo scale=$1\
    \ $2 + $3 / pq | dc`\n  echo $m\n}\nrun_xbench() {\n  r=`echo 1; echo 2; echo\
    \ 3; echo 4 | xbench -only $1 | grep rate`\n  [-z \"$r\" ] && return\n  cp=\"\
    $2 $3\"\n  set $r\n  calc $3 $cp\n}\n```"
  merge: -1
  pgno: 170
- img_proc: true
  md: "# CHAPTER 3: Installing Linux and Internet Components\n\n```\nrun_x11perf()\
    \ {\n  r=`x11perf $1 | grep \\$ | tr '()//g'\n  [ -z \"$r\" ] && return\n  cp=$2\
    \ $3\n  set $r\n  calc `calc 1000 0 $4 $cp`\n}\n```\n\n```\nrun_x11perf -rect500\
    \ -rop Gxxor    3.86 5.53 # 0 1 # 4.11 5.52 #\nrun_xbench invrects500        \
    \ 4.63 5.48 # 0 1 # 4.69 5.48 #\nrun_x11perf -rect500 -rop Gxcopy -16.42 13.90\
    \ # 0 1 # -14.99 13.88 #\nrun_xbench fillrects500         -7.81 13.57 # 0 1 #\
    \ -8.53 13.58 #\n```\n\nexit\n\nWhat does this file tell us? Well, for starters,\
    \ it tells us that mucking around with graphics-card settings is not a whole lot\
    \ of fun, and that unless you're willing to live with the default settings, fine-tuning\
    \ your X Window setup is not going to be a lot of fun. Perhaps the biggest lesson\
    \ we can derive from this information is that messing around with graphics-cards\
    \ setting just isn't worth your while, especially on an Internet server.\n\n#\
    \ Starting X\n\nTo start the X Window System, use the following command line:\n\
    \nstartx\n\nThis command line actually is a script that launches the commands\
    \ found in another file, .xinitrc, in your home directory This file is to be used\
    \ to customize X for your own workspace; there's a default copy of the file in\
    \ /usr/X11R6/lib/X11/, but the theory is that you'll copy this file to your home\
    \ directory and customize it. Since there won't be other people working with X\
    \ on this terminal, you can go ahead and use the default file."
