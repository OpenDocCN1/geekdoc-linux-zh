- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 275


    If the mSQL table containing the uid/passwd combination does not have the uid
    field as a primary key, it is possible for the uid to occur more than once in
    the table with possibly different passwords. When this module is compiled with
    the ONLY ONCE directive set, access is denied if the uid occurs more than once
    in the uid/passwd table. If you choose not to set it, the software takes the first
    pair returned and ignores any further pairs. The SQL statement used for this is:


    ```

    select password form pwd_table where user=''uid''

    ```


    even though this might lead to unpredictable results. For this reason as well
    as for performance reasons, you are strongly advised to make the uid field a primary
    key.


    ```

    #define KEEP_MSQL_CONNECTION_OPEN

    ```


    Normally the TCP/IP connection with the database is opened and closed for each
    SQL query. When the Apache Web server and the database are on the same machine
    and /dev/msql is used, this does not cause a serious overhead problem. However,
    when your platform does not support this (the mSQL documentation) or when the
    Web server and the database are on different machines, the overhead can be considerable.
    When the preceding directive is set, the server leaves the connection open (i.e.,
    no call to msqlClose()). If an error occurs, an attempt is made to reopen the
    connection for the next HTTP request. This has a number of very serious drawbacks:


    +   - It costs two already-rare file descriptors for each child.

    - It costs mSQL connections, typically one per child. The (compiled in) number
    of connections mSQL can handle is low 6 or 12, which might prohibit access to
    the mSQL database for later processes.

    - When a child dies, it might not free that connection properly or quickly enough.

    - When errors start to occur, connection/file-msql resources might become exhausted
    very quickly.'
