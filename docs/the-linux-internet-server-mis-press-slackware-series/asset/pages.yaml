  md: '# Table 6.2 Glimpse Search Options (continued)


    | Option | Purpose |

    | --- | --- |

    | -U | Interprets an index created with the -X or the -U option in glimpseindex.
    Useful mostly for WebGlimpse or similar Web applications. When glimpse outputs
    matches, it will display the filename, URL, and the title automatically. |

    | -v | This agre will be ignored in glimpse, unless glimpse is used with a filename
    at the end, which makes it run agre. It outputs all records/lines that do not
    contain a match (Glimpse does not support the NOT operator). |

    | -V | Prints the current version of glimpse. |

    | -W | Searches for the pattern as a word—surrounded by nonalphanumeric characters.
    For example, glimpse -w car will match car, but not characters or car10.The nonalphanumerics
    must surround the match; they cannot be counted as errors.This option does not
    work with regular expressions.When - is used together with the -i option, the
    search may become much faster. The -w option will not work with ^,$ and _.It is
    recommended to use -i and -w as defaults, for example, through an alias. Use the
    following alias in our .bashrc file: alias glimpse ''glimpse -wi''. |

    | - | The default for Boolean AND queries is that they cover one record at a time
    (the default for a record is one line). For example, glimpse ''good;bad'' will
    output all lines containing good and bad. The -W option changes the scope of Booleans
    to be the whole file. -W ''good;bad'' will output all matches to any of the patterns.
    So, glimpse -good/bad'' will output lines containing good or bad, but only in
    files that contain both patterns. For structured queries, the scope is always
    the whole attribute or file. |

    | -x | The pattern must match the whole line. (This option is translated to -w
    when the index is searched and it is used only when the actual text is searched.
    It is of limited use in glimpse.) |

    | -X | Outputs the names of files that contain a match even if these files have
    been deleted since the index was built.Without this option glimpse will simply
    ignore these files. (New in version 4.0B1). |

    | -Y | Do not prompt. Proceed with the match if the answer to any prompt is y.
    Servers (or any other scripts) using glimpse will probably want to use this option.
    |

    | Yx | If the index was constructed with the -t option, -Y x will output only
    matches to files that were created or modified within the last x days. There are
    no major performance penalties for this option. |'
