    # Your Server and the Internet


    Where will your Linux Internet server fit in the larger scheme of things? It will
    fit like any other server on any other network. Basically, the Internet is the
    world''s largest network, all connected with TCP/IP. There''s a main backbone,
    administered by MCI, Sprint, Ameritech, and other firms. Basically, this is an
    MCI network made up of high-speed switches and fiber-optic cabling. There''s not
    really a part of this backbone that''s specifically designated as “Internet-only”;
    this backbone''s also used for voice and video transmissions.


    The things to note about this backbone are its (600 million bits per second, or
    Mbps, or more than 20,000 times faster than the average 28.8-Kbps modem) and its
    capacity, and bandwidth. The backbone represents the largest capacity of the Internet
    at any point; as the Internet gets closer to your particular server, the bandwidth
    wins as more users clamor for access. Your connection will probably be through
    a local Internet service provider (ISP) or telecommunications firm.


    > You''ll learn about these connections in Chapter 2.


    ![](img/7488e49c99dd1fc906878692fde2ec31_38_0.png)


    Internet transmissions are meant to be broken up and sent as part of other sets
    of transmissions. This is opposed to the typical telephone call,'
  merge: -1
  pgno: 38
- img_proc: true
  md: '# 16 CHAPTER I:The Internet, Intranets and Slackware Linux


    which commandeers control of an entire circuit for the entire call, meaning that
    others cannot use the circuit for other purposes. Internet communications are
    divided into packets—smaller chunks of data with a source address and a destination
    address—and then sent from router to router before they end up at a final destination.
    When a web browser sends a request to a server, that request is sent from router
    to router until it arrives at the server. That’s one transaction. Your server
    responds to the request with a new transaction. There’s no open connection between
    the server and the browser.


    The complexity of this model can’t be overstated. There are millions of bits flying
    from here to there on the Internet, and the fact that transactions are completed
    satisfactorily says something about the reliability of the Internet. There’s actually
    data redundancy built into these transactions: When a packet is dropped from a
    transmission, the recipient of the transmission will ask for a retransmission.


    > Currently there''s a huge debate among Internet journalists as to how reliable
    the Internet really is. Bob Metcalfe of InfoWorld Magazine is a naysayer, a prophet
    whose in the wilderness warns that Internet collapse is nigh and that reliability
    is decreasing based on some server measurements of dropped packets. On the other
    hand, many journalists argue that the Internet is growing just fine (albeit with
    some growing pains), and all it takes is some fine-tuning to ameliorate these
    growing pains.


    ![](img/7488e49c99dd1fc906878692fde2ec31_39_0.png)


    The protocol governing these transmissions is TCP/IP. When you break it down,
    TCP/IP oversees the following:


    +   * The address of the packet.

    * The data size of the packet.

    * Error-detection information.

    * Routing information.


    As a networking protocol, TCP/IP isn’t regarded as robust or as complex as other
    networking protocols, like those used in Novell NetWare networks. However, for
    the purposes of the Internet, TCP/IP is the perfect solution, for the following
    reasons:'
