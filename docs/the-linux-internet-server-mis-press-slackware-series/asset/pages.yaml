  md: '# Spinning Your Web Worldwide


    Many people equate the Web with the Internet. The two aren’t interchangeable;
    the Web refers to the World Wide Web, which is a specific service of the greater
    Internet.


    The Web is an incredibly important part of the Internet, though, and much of your
    impetus in setting up an Internet site is undoubtedly in setting up a Web server.
    A Web server is a remarkably simple piece of software (conceptually, anyway).
    A Web server answers requests from Web browsers (like Netscape Navigator or Arena),
    sending files along via the HyperText Transfer Protocol. Along the way, the server
    can run a program or script on behalf of the user and then send the results of
    the program or script to the user.


    This chapter covers the installation and configuration of Web servers. During
    the course of this book, you will learn how to manipulate and use the Web server
    to your advantage; for instance, later in this book you will learn how to edit
    HTML pages and install programs for your users to run. This chapter won’t cover
    everything to do with Web servers, but it will allow you to get a server up and
    running.


    In this chapter, several Web servers will be covered. The majority of the time
    will be spent on the Apache Web server, which ships as part of Slack Linux and
    should have been automatically installed when you installed Slack Linux as part
    of the setup process in Chapter 3. However, in the interest of full disclosure
    and complete information, several other Web servers will be discussed. You may
    find that these Web servers are better suited for your needs (for instance, the
    WN Web server has many features that aren’t found in the Apache Web server). But,
    to be totally honest, you’ll spend the majority of your time studying the Apache
    Web server.


    # The Apache Web Server


    The Apache Web server ships with Slack Linux. If you’re unfamiliar with the world
    of Web servers, you should be quite elated to find such a powerful and popular
    Web server available at no charge in conjunctions with an operating system like
    Slack Linux. As a matter of fact, the'
