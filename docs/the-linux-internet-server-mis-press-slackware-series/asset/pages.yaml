  md: '# 310 CHAPTER 4: Setting Up a Web Server


    The way this is supposed to work with virtual hosts is as follows: A virtual host
    can have its own LogFormat or its own TransferLog. If it doesn''t have its own
    LogFormat, it inherits from the main server. If it doesn''t have its own TransferLog,
    it writes to the same descriptor (meaning the same process for 1 ...).


    That means you can do things like:


    ```

    <VirtualHost hosta.com>

    LogFormat "hosta ..."

    ...

    </VirtualHost>


    <VirtualHost hosta.com>

    LogFormat "hostb ..."

    ...

    </VirtualHost>

    ```


    to have different virtual servers write into the same log file, but have some
    indication which host they came from, even though a %v directive may well be a
    better way to handle this.


    There are two directives with this module: LogFormat and TransferLog.


