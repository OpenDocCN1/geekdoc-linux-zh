- img_proc: true
  md: '# 248 CHAPTER 4: Setting Up a Web Server


    +   * Behave like NCSA httpd 1.3.

    * Output a customized message.

    * Redirect to a local URL to handle the problem/error.

    * Redirect to an external URL to handle the problem/error.


    The last three options are configured using ErrorDocument, which is followed by
    the HTTP response code and a message or URL. Messages in this context begin with
    an opening quotation mark ("), which does not form part of the message itself.
    Apache will sometimes offer additional information regarding the problem/error.
    This can be embedded into the message using %s.


    URLs will begin with a slash (/) for local URLs or will be a full URL the client
    can resolve. Here are some examples:


    ```

    ErrorDocument 500 /cgi-bin/tester

    ErrorDocument 404 /cgi-bin/bad_urls.pl

    ErrorDocument 401 http://www2.foo.bar/subscription_info.html

    ErrorDocument 403 "Sorry can''t allow you access today

    ```


    # ErrorLog


    +   Syntax: ErrorLog filename

    Default: ErrorLog logs/error_log

    Context: server config, virtual host

    Status: core


    The error-log directive sets the name of the file where the server will log any
    errors it encounters. If the filename does not begin with a slash (/), then it
    is assumed to be relative to the ServerRoot. For example,


    ```

    ErrorLog /dev/null

    ```


    effectively turns off error logging.'
