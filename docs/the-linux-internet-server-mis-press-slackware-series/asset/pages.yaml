- img_proc: true
  md: '# CHAPTER II: HTML and Web Pages 473


    # Using Apache Imagemaps


    The following information on imagemaps is from Apache Week.


    Imagemaps can provide a graphical interface to a web site. If the mouse is clicked
    over an imagemap image the coordinates of that click are sent to the server. The
    server can decide what to return based on the location of the click.


    Traditionally, imagemaps have been implemented at the server end with a CGI program
    (usually called imagemap). This is configured with a map file listing what regions
    on the image correspond to what documents to return. Apache can use CGI imagemaps,
    but it is more efficient to use the internal imagemap module. This module, compiled
    in default, means that the server does not need to run a separate process to handle
    the image clicks. It is fully upwardly compatible and adds some new features.
    Both of these approaches implement what are called server-side imagemaps, because
    all of the processing happens on the server.


    The main problem with server-side imagemaps is that the user does not get any
    indication of which areas of the image contain links. extension to HTML allows
    client-side imagemaps to tell the browser what areas on the image correspond to
    what documents. The browser can then highlight or show the active areas as desired.
    It is possible to use both client-side and server-side imagemaps at once, so that
    the maximum number of browsers are supported.


    # The Imagem CGI Program


    Older versions of Apache came with an imagemap program in the cgi-src directory.
    This could be compiled and placed into a CGI directory (typically cgi-bin). The
    internal imagemap module is faster than using the CGI program and has replaced
    all of the functionality.


    If you are using the imagemap program, you can easily move over to using the imagemap
    module. First, ensure that an appropriate AddHandler line is enabled in your srm.conf
    file (see the following'
  merge: -1
  pgno: 496
- img_proc: true
  md: '# 474 CHAPTER II: HTML and Web Pages


    section). Then all you need to do is update the HTML documents that refer to the
    imagemap program. You will probably be using something similar to this:


    ```

    <A HREF="cgi-bin/imagemap/maps/mapfile">

    <IMG SRC="image.gif" ISMAP></a>

    ```


    First of all, you need to rename your mapfile to have a suitable extension (as
    given on the AddHandler image-file line, for example, .map) if it does not already
    have this extension. Then change the HTML line to read:


    ```

    <A HREF="maps/mapfile.map">

    <IMG SRC="image.gif" ISMAP></a>

    ```


    ![](img/7488e49c99dd1fc906878692fde2ec31_497_0.png)


    > The HREF is now simpler because the /cgi-bin/imagemap part is not given.


    # The Imagemap Module


    The imagemap module is a core part of Apache and is compiled in by default. To
    use it, you first need to configure the Apache server. You should pick a file
    extension to use for imagemap configuration files, typically .map. The AddHandler
    command below should be added to the srm.conf file:


    ```

    AddHandler image-file map

    ```


    You will need to restart the server after making this change, by sending it -HUP
    signal. Now, any request for a file ending in .map will be treated as an imagemap
    request.


    To actually create an imagemap you need to do two things:


    +   1. Create a map file that maps areas of the image onto documents.

    2. Add the code to an HTML page to tell the browser which image to use and what
    mapfile.'
  merge: -1
  pgno: 497
- img_proc: true
  md: '# CHAPTER II: HTML and Web Pages 475


    # # Creating the Map File


    The map file is a text file containing the information needed for the server to
    map points on the image onto documents to return (or URLs to redirect to). It
    can also contain statements to control the behavior of the imagemap. The imagemap
    module uses map files in standard NCSA format, with optional extensions.


    Areas and positions on the image can be mapped onto documents or URLs with the
    following commands. All coordinates start at the top-left of the image, position
    (0,0). These statements can be modified to make use of Apache imagemap extensions
    (such as to give a menu text). This will be covered later.


    ```

    rect url x1,y1 x2,y2

    rectangle (x1,y1) to (x2,y2)

    poly url x1,y1 x2,y2 ....

    polygon formed by the points given.

    circle url x1,y1 x2,y2

    circle with its center at (x1,y1) and point (x2,y2) on the circumference.

    point url x1,y1

    t closest point to the clicked position, if the click is not inside any circle,
    poly, or rect.

    ```


    The URL part of each of these statements is the document to return if the point
    clicked was inside the respective area (or in the case of point, the closest).
    It can be either an absolute URL (starting http://), a relative URL to the document
    root (starting /), or a relative URL (not starting with /), and possibly including
    ../ components to go to parent directories.


    If the URL is relative, it is taken relative to the directory containing the imagemap
    configuration file, not the original HTML document (if different). However, this
    can be changed by the base statement (see below).


    There are various ways to create the coordinates for the map file. One is to do
    it by hand, using positions obtained by an image-editing'
  merge: -1
  pgno: 498
- img_proc: true
  md: '# 476 CHAPTER II: HTML and Web Pages


    program. Alternatively there are various programs available that will let you
    mark the shapes on an image and then write out the correct statements, such as
    those listed in Yahoo''s Imaginaps category.


    The statements that can be used to control the behavior of the imagemap are:


    +   base [ url | map | referer ]

    Use url as the base for any relative URLs within the map file. Alternatively,
    the word map can be used, which makes URLs relative to the directory containing
    the map file (this is the default). Alternatively, relative URLs can be made relative
    to the HTML document that included the imagemap image, with referer. This only
    works with browsers supporting the Referer request header (most modern browsers
    support this).

    default [ url | error | nocontent | referer | menu ]

    This tells the server what do if the point clicked was not inside any rect, poly,
    or circle, and there were no point statements. It can be done by /, or one of
    these values: error: return 500 Server Error status; nocontent: return a 204 No
    Content status, which will cause most browsers to keep the current document; referer:
    return the document given by the Referer request header, which will be the HTML
    document that contained the imagemap; menu: return a text (HTML) version of the
    URLs in the map file.

    The default is nocontent.


    # HTML For an Imagemap


    The final part of creating an imagemap is to add suitable HTML code to an HTML
    document. Images are placed using the code <IMG SRC="...\>. surround this tag
    with a <A HREF...> tag referring to the map file, and include the attribute ISMAP
    in the <IMG SRC...>. For example:


    ```

    <A HREF="/docs/home.map"><IMG SRC="graphics/image.gif" ISMAP></A>

    ```'
  merge: -1
  pgno: 499
- img_proc: true
  md: '# CHAPTER II: HTML and Web Pages 47


    where docs/home.map is the URL of the map file, relative to the server''s document
    root. The ISMAP attribute in the <IMG SRC...> tag tells the browser that this
    is an imagemap. When the image is clicked, it sends a request for the given HREF
    URL, followed by the position of the image click, such as:



    ```

    GET /docs/home.map?20,35

    ```


    if the image was clicked at position (20,35).


    # Map Menu Document


    One of the big problems with imagaps in the past has been that they do not work
    with text-only browsers. The imagemap module is written to provide support for
    text-only browsers, which usually ignore the ISMAP attribute. The imagemap module
    recognizes this and will return a text (HTML) document containing any of the possible
    selections from the map file. In addition, a menu document can be returned if
    the user of a graphical browser selects a point outside any of the defined areas,
    if the statement “default menu” is given in the map file.


    The type of menu returned can be configured with the ImapMenu directive. This
    can be placed in a <Directory> or <Location> section, or in a .htaccess file.
    It takes a single argument that gives the type of menu to return:


    +   - none (do not show a menu)

    - formatted (output a formatted document, with a suitable heading and with the
    map lines as <pre> text)

    - semiformatted (format the map lines as <pre> text, and also show comment text
    on other lines [comments start with a hash character, #], but do not output a
    header)

    - unformatted (do not format map lines as <pre> text and output text from comment
    lines, but do not output a header)'
  merge: -1
  pgno: 500
- img_proc: true
  md: '# CHAPTER II: HTML and Web Pages


    The semiformatted and unformatted options let you add additional text and mark-up
    to the map document. The difference between these two is that with semiformatted,
    the map links are output as `<pre>` sections, which forces them onto separate
    lines. The unformatted option does not impose any restrictions, so it is possible
    to build up a map document with multiple links on a line, for instance.


    The links in the menu document correspond to the URLs for each of the areas defined
    in the map file. The text of the link will be the URL itself. However, this can
    be replaced with more meaningful text by giving this text as an argument before
    or after the coordinates. For example:


    ```

    /welcome.html 1,1 20,20 "Welcome to this site"

    ```


    # Directives


    The imagemap module supports three directives: the first configures the type of
    menu to return (if any). This is the `ImapMenu` directive already covered. The
    other two provide alternate ways of setting the base and default actions (see
    the base and default map configuration statements, above). The corresponding directives
    are `ImapBase` and `ImapDefault`, and they take the same arguments.


    The directives can be given in `<Directory>` and `<Location>` sections, and in
    .htaccess files.


    # Examples


    You have an image that contains two areas you want to make active: a circle, which
    should lead onto a contents page (`contents.html`) and a square that gives information
    about your company (`about.html`). The basic map file to do this would be:


    ```

    circle contents.html 25,25 0,25

    rect about.html 50,0 100,50

    ```


    This would be included in an HTML document like this:'
  merge: -1
  pgno: 501
- img_proc: true
  md: '# CHAPTER II: HTML and Web Pages 479


    ```

    <A HREF="maps/home.map"><IMG SRC="img/logo.gif" ISMAP></A>

    ```


    If the user clicks inside the circle or square area, they will get the associated
    document, relative to the mapfile location. The requested files would be: /maps/contents.html
    and /maps/about.html. This is probably not what is wanted. The URLs in the map
    file could be given as relative to the document root, for example:


    ```

    circle /contents.html 25,25 0,25

    rect /about.html 50,0 100,50

    ```


    Alternatively, the base statement could be used to set the base URL, as in:


    ```

    circle contents.html 25,25 0,25

    rect about.html 50,0 100,50

    ```


    Rather than putting the URL in the map file like this, it might be better to make
    all of the URLs relative to the location of the HTML document containing the imagemap,
    with:


    base referer


    If the user clicks an area outside the circle and the square the user will, by
    default, get a HTML menu of the URLs in the map file. Users of nongraphical browsers
    will also get this menu. To make it readable, add some descriptions:


    base referer


    ```

    circle contents.html 25,25 0,25 "Contents"

    rect about.html 50,0 100,50 "About our company"

    ```


    which will produce the following map document links as text:'
  merge: -1
  pgno: 502
- img_proc: true
  md: '# CHAPTER II: HTML and Web Pages


    Contents


    About our company


    The map document produced will just contain these two links. To make it more elaborate,
    you can either include your own mark-up text (on comment lines), or set the ImapMenu
    directive to the value formatted. To include your own mark-up, put it on lines
    that start with a # character:


    base referer


    ```

    # <h1>Menu Bar</h1>


    circle contents.html 25,25 0,25 "Contents"

    rect about.html 50,0 100,50 "About our company"

    ```


    # Select one of the options above


    This produces:


    Menu Bar


    Contents


    About our company


    Select one of the options above


    This works because the default value for the ImapMenu option is semiformatted,
    which outputs comment text (after the # symbol) as part of the map document. For
    more elaborate formats, you could include ImapMenu unformatted in your access.conf
    or .htaccess file, and use:'
  merge: -1
  pgno: 503
- img_proc: true
  md: 'base referer


    ```

    # <h1>Menu Bar</h1>

    ```


    # Select an option:

    circle contents.html 25,25 0,25 "Contents"

    # or

    rect about.html 50,0 100,50 "About our company"


    which produces:


    Menu Bar


    Select an option: Contents or About our company


    # Client-Side Imagemaps


    Client-side imagemaps move the processing of the coordinate information to the
    browser. The HTML code includes the information about the areas on the image and
    the documents they lead to. This means the browsers can give positive feedback
    when the mouse is over an active area. This can only works in browsers that support
    the option, but it is possible to use a single image as both server-side and client-side
    imagemap. Here is an example image setup for both server-side and client-side
    imagemap:


    ```

    <A HREF="docs/home.map"><IMG SRC="graphics/image.gif" ISMAP USE="#thismap"></a>

    ```


    ```

    <MAP NAME="thismap">

    <AREA SHAPE=CIRCLE COORDS="25,25,0,25" HREF="contents.html">

    <AREA SHAPE=RECT COORDS="50,0,100,50" HREF="about.html">

    </MAP>

    ```'
  merge: -1
  pgno: 504
