- img_proc: true
  md: "# 112 CHAPTER 3: Installing Linux and Internet Components\n\nYou don't need\
    \ to think that you're reinventing the wheel when you install the X Window System.\
    \ Many brave pioneers have, through trial and error, configured the X Window System\
    \ to work with their graphics cards. This information has been compiled into a\
    \ file modeDB.txt, which can be found in the /usr/X11/lib/X11/doc directory. This\
    \ information was compiled by David Wexelbat (dwex@xfree86.org), with contributions\
    \ from Thomas Roell (roell@inside.com). The information that follows was supplied\
    \ by volunteers (in other words, it's not been verified by any outside sources).\
    \ It doesn't cover the more popular accelerated cards (which we will cover later\
    \ in this section).\nIf're using an older PC to run Linux, chances are pretty\
    \ good that you'll find your graphics card somewhere in this file. (Note that\
    \ some of the cards have more than one entry; you'll need to scrutinize the video\
    \ closely to make sure that the card matches the correct entry.)\n\nWe're not\
    \ going to list the entire file here. However, here's a typical entry (in this\
    \ case, for the OAK Technology OTI-077 card):\n\n```\n# Card: OAK Technology OTI-077\n\
    # Contributor: Pedro R. Benito da Rocha [pedro@luna.gui.uva.es]\n# Last Edit Date:\
    \ 4/27/94\n#n# chip ram virtual clocks default-mode flags\nOTI077 1024 1024 768\
    \ 25.40 28.32 65.40 45.20 *800x600\"\n       14.20 18.10 40.30 36.20\n```\n\n\
    The point of this information is to cut and paste a section into your XF86Config\
    \ file.\nof more use with newer PCs will be the AccelCards file, which contains\
    \ information about newer accelerated graphics cards. Again, this information\
    \ isn't the most up-to-date information about graphics cards (none of the entries\
    \ are more current than 1994), but it should give you some good insight into configuring\
    \ your graphics cards. As with the other files in this section, the purpose of\
    \ the AccelCards file is to cut and paste the information about the cards in the\
    \ file into your XF86Config file."
