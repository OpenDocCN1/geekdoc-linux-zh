- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slackware Linux


    Linux network, you''re familiar with the notion of client/server. And if you''ve
    administered databases using SQL Server, you already are familiar with the notion
    of client/server.


    These transactions all occur under the context of TCP/IP (Transmission Control
    Protocol/Internet Protocol). TCP/IP is the unifying network standard that unites
    the Internet as the protocol upon which Linux is based. If you have a Linux box
    already connected to the Internet, you have a large part of the puzzle already
    in place.


    Past that, however, there are protocols specific to different services. The HyperText
    Transfer Protocol (HTTP) governs the transfer of Web pages to Web browsers. The
    File Transfer Protocol (FTP) governs file transfers between FTP servers and FTP
    clients. The most popular service on the Internet in terms of traffic is HTTP
    (electronic mail actually has more users, but it generates less traffic and less
    overhead than a Web server), which is why a closer look is warranted.


    # An HTTP Overview


    Much has been made about the fact that the World Wide Web is a hypertext medium,
    where documents are linked, and that to move to a new document, just need to click
    on a link. The theorists argue that this represents an end to Western-style linear
    thinking, that represents an entirely new way of organizing information. Other
    theorists decry the Web argue that it''s the electronic equivalent of Short Span
    Theater, an activity perfectly suited to the MTV Generation, who merely substitute
    their remote controls for a mouse.


    Whatever.


    You''re going to discover that your documents are going to be amazingly linear
    when viewed under the cold light of the Web server. Indeed, if there weren''t
    some logic to their organization, there would be no way that you could keep track
    of them. The user may be able to hop from document to document and to various
    points within documents, but it''s up to you and your organizational methods to
    make sure that hopping is an option.


    Still, it''s amazing that the World Wide Web has stayed basically true to its
    roots, as first outlined by Tim Berners-Lee.in March 1989 when he was at the European
    Particle Physics Laboratory, or CERN. Berners-'
