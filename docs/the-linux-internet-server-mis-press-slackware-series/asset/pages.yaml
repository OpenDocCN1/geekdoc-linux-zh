  md: '# CHAPTER 4: Setting Up a Web Server 303


    The AuthFile directive sets the name of a textual file containing the list of
    users and encoded passwords for digest authentication. Filename is the absolute
    path to the user file.


    The digest file uses a special format. Files in this format can be created using
    the hdigest utility found in the support/ subdirectory of the Apache distribution.


    Using MD5 Digest Authentication is very simple. Simply set up authentication normally.
    However, use AuthType Digest and AuthDigestFile instead of the normal AuthType
    Basic and AuthUserFile. Everything else should remain the same.


    MD5 Digest Authentication provides a more secure password system but works only
    with supporting browsers. Most browsers do not support digest authentication,
    however; for personal and intranet use, where browser users can be controlled,
    it is ideal.


