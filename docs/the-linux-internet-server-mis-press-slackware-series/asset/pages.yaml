  md: '# Printers/Plotters


    Slack Linux should work with pretty much any printer or plotter connected to a
    parallel port (or, in a pinch, a serial port).


    Printing out PostScript files requires the use of Ghostscript. Since this topic
    isn''t really germane to a book about using Linux on an Internet server, it won''t
    be covered here; you''re encouraged to check Appendix A for a complete book on
    Linux installation and configuration.'
