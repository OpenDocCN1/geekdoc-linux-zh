  md: '# CHAPTER 2: Linux Internet Connection Methods 43


    The InterNIC has tightened its registration procedures, adding encryption to make
    the procedure secure with the Guardian service. In addition, the InterNIC has
    expanded its registration procedure to make sure that contact information is correct.
    (A full explanation can be found at ftp://rs.internic.net/templates/contact-templates.txt.)


    # How Domain Names Are Organized


    We''ve been tossing around the term domain throughout this book without explaining
    it.


    Basically, a domain name is a substitute for an IP address. Domain names don''t
    actually exist for technical reasons—they exist because some smart people realized
    that most people would remember www.suck.com rather than its numerical IP address.
    A Domain Name Server, or DNS, handles these translations. When a user enters www.suck.com
    in Netscape Navigator, a DNS is contacted, and that DNS translates www.suck.com
    to its IP address, facilitating the proper destination for the request.


    Basically, these domains are organized in a hierarchical fashion. At the top of
    the pyramid is the international backbone of the Internet, followed by a national
    backbone, regional backbones, local routers, and machines where the Internet basically
    ends (which is where your server will exist).


    A domain also refers to a type of server. Commercial domains end with com; network
    providers, ISPs, and Internet-related domains end with net; educational domains
    end with edu; government domains end with gov; organizations (nonprofits and noncommutative
    entities) end with org; military domains end with mil. domains from outside the
    United States usually end with a country domain—domains in Canada, for example,
    with ca, while domains in the United Kingdom end with uk.


    There are DNS servers scattered all around the Internet. If you do go with a service
    provider, you''ll probably go through your ISP''s DNS. If you decide to install
    a DNS at your site, you''ll need to make sure that you set up a mirror of another
    DNS on the Internet, preferably one that is physically near you.'
