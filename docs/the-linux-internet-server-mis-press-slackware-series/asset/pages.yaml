  md: '# Log Files


    The Apache Web server uses a number of files to track usage of all sorts.

    They are


    +   - httpd.pid, which saves the process ID (pid) of the parent http process to
    the file logs/httpd.pid. This file location is saved with the PidFile directive,
    which by default is set in the httpd.conf file. Most of the time this information
    isn''t of much use, unless you actually want to shut down the server (which we''ll
    cover later in this chapter).

    - error_log, which is used to log error messages. You can change the filename
    by changing the ErrorLog directive. This can come handy when you''re setting different
    error logs for different virtual hosts.

    - access_log, which is used to log each HTTP request. You can change the filename
    by changing the TransferLog directive. This can come in handy when you''re setting
    different logs for different virtual hosts.


    # Resetting Log Files


    There''s one rule about log files: They grow and grow and grow. (Well, the access_log
    and error_log files grow, anyway. As a matter of fact, the access_log file grows
    by 1MB for every 10,000 requests.) At some point, they''ll become too large to
    be manageable, and you''ll want to begin new files.


    The temptation is to move or delete the logfile, but don''t do it. Basically,
    the Web server continues writing to the logfile at the same offset as before the
    logfile moved. This results in a new logfile being created which is just as big
    as the old one, but now it contains thousands (or millions) of null characters.


    Here''s what to do: Move the logfile and then tell Apache to tell it to reopen
    the logs using the SIGHUP (-1) signal:


    ```

    mv access_log access_log.old ; kill -1 `cat access.conf`

    ```'
  merge: -1
  pgno: 229
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 207


    You could set up a cron task to backup and replace your logfiles on a regular
    basis.


    # Shutting Down the Web Server


    To shut down the Web server, send a HUP signal, which causes the program to reread
    its configuration files, and a TERM signal, which causes it to die gracefully
    (or is killed) abnormally, then it will be necessary to kill the children httpd
    processes.


    # Virtual Host Support


    So far in this chapter we''ve discussed a model where you have one domain on one
    machine. However, you have the potential to have multiple domains on a single
    machine. This can come handy if you''re planning on being some sort of Internet
    server provider, where you provide Web pages and access to multiple people and
    corporations.


    For instance, your machine may have a domain name of www.kreichard.com, and you
    want to add your family members'' own domain names for their usage: www.jreichard.com
    and www.sreichard.com. It might be easier to give them their own locations on
    the file system (like www.kreichard.com/julie and www.kreichard.com/steve), but
    familial pride dictates that they will want to have their own domain name for
    more mundane and capitalistic reasons: identification and mind share.) Since many
    small companies and family members won''t want to go through the fuss of setting
    up their own servers and Internet connections, you jump in to solve the problem.


    The answer is to set up virtual hosts. You go ahead and register www.jreichard.com
    and www.sreichard.com with InterNIC, but those names are actually housed on your
    Linux server. Because of some technical issues in the basic HTTP protocol, a Web
    server cannot answer to different domain-name requests with the same IP address,
    so each virtual host must have a different IP address.'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 208 CHAPTER 4: Setting Up a Web Server


    Before you do this, you''ll need to recompile your Linux kernel to allow Apache
    virtual hosts. The source code and any modules for doing so are on the accompanying
    CD-ROM (under /usr/source). It''s actually fairly easy thing to do, as you saw
    in Chapter 3. Aram Mirzadeh (aram@qosina.com) has compiled the following instructions
    for setting up virtual hosts on a Linux system:


    +   1. Recompile the kernel, with the IP Aliasing and IP Routing options.

    2. Use the following lines to add new IPs to your system:


    ```

    insmod /usr/src/linux/modules/ip_alias.o

    ifconfig eth0:0 www.foo.com

    route add -host www.foo.com dev eth0:0

    ```


    substituting your hostname for www.foo.com, or of course:


    +   3. Add <virtualhost 200.200.200.50> ... </virtualhost> to your http.conf file.
    Here is an example:


    ```

    <VirtualHost www.virtual.com>

    ServerAdmin webmaster@real.com

    DocumentRoot /usr/local/etc/httpd/virtual

    ServerName www.mirzadeh

    ScriptAlias /cgi-bin/ /usr/local/etc/httpd/cgi-virtual

    ErrorLog logs/virtual-error_log

    TransferLog logs/virtual-access_log

    </VirtualHost>

    ```


