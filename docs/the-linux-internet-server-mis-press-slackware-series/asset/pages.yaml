- img_proc: true
  md: '# CHAPTER 6: Indexing with Glimpse and GlimpseHTTP 383


    Option Purpose


    +   -n Indexes numbers as well as text. The default is not to index numbers. This
    is useful when searching for dates or other identifying numbers, but it may make
    the index very large if there are many numbers. In general, glimpseindex strips
    away nonalphabetic character. For example, the string abc123 will be indexed as
    abc if the -n option is not used and as abc123 if it is. Glimpse provides warnings
    (in the .glimpse_messages file) for all files in which than half the words that
    were added to the index from that file had digits in them (this is an attempt
    to identify data files that probably not be indexed). One can use .glimpse_exclude
    file to exclude data files or other files.


    +   -o Builds a smaller rather than tiny index (meaning 7-9% of the size of all
    files—may vary) allowing faster searches. The option forces glimpseindex to allocate
    one block per file (a block usually contains many files).


    +   -R Recomputes .glimpse_filenames_index from .glimpse_filenames. The file .glimpse_filenames_index
    speeds up processing. Glimpseindex usually computes it automatically. However,
    if for reason you want to change the pathnames of the files listed in .glimpse_filenames,
    then running glimpseindex -R recomputes on one machine but another (with the same
    hierarchy). The names of the files listed in .glimpse_filenames are used in runtime,
    so changing them can be done at any time in any way (as long as the names content
    is changed). This is not an option in the regular sense; however, it is a program
    by itself, and it is meant as a post-processing project.


    +   -s Supports structured queries. This option was added to support the Harvest
    Project, and is applicable mostly in that context.


    +   -Sk The number k determines the size of the stop-list. The stop-list consists
    of words that are too common and not important (e.g., the or and). Instead of
    having a fixed stop-list, glimpseindex figures out the words that are too common
    for every index separately. The rules are different for the indexing options.
    The tiny index contains all words (words from a stop-list are too small to bother).
    With the small index (-o), the number k is a percentage threshold. A word will
    be in the stop list if it appears at least k percent of all files. The default
    value is 80 percent. (If there are fewer than 256 files, the stop-list is not
    maintained). The medium index (-b) counts all occurrences of words, and a word
    is added to the stop-list if it appears at least k times per megabyte. The default
    value is 500. A query that lists a stop-list is of course less efficient.


    +   -t Sets the order in which files are indexed by scanning the directories,
    which is mostly arbitrary. With the -t option, combined with either -o and -b,
    the indexed files are stored in reversed order of modification age (younger files
    first). Results of queries are then automatically returned in this order. Furthermore,
    glimpse can filter results by age; for example, asking to look at files that are
    at most five days old.'
  merge: -1
