  md: '# Connection Methods


    Connecting to the Internet isn''t an exceptionally difficult process. There are
    basically three methods:


    +   - Dialup connection

    - Hosting by Internet service provider

    - Direct high-speed connection


    You can''t accomplish any of these connections on your own. You''ll need to work
    with a firm that specializes in Internet connectivity, an Internet service provider
    (ISP). The company will walk you through the process of setting up an Internet
    connection. Even though all ISPs offer the same thing—Internet connectivity—they
    differ on their processes and methods. Put another way: There''s no one way to
    connect to the Internet, and each ISP differs, so your exact plan for Internet
    connectivity will depend to a very large extent on your ISP. Hence, this chapter
    deals with generalities of connecting to the Internet, rather than specifics (buy
    a router from Corporation A, configure it in this manner, and so on).


    So, your first step in Internet connectivity is to find an ISP. The ISP will be
    the outfit that provides the direct connection to the Internet, with a domain
    name and IP addresses.


    > The advice in this chapter is really meant for smaller to midsized companies
    and organizations. Larger outlets probably already have a presence on the Internet
    in some way, and enterprise connectivity to the Internet is beyond the scope of
    this book.


    You''ll want to get information from a wide range of ISPs. There are several nationwide
    lists of local ISPs that you can check. The best are


    +   - http://thelist.com

    - http://www.primus.com/providers

    - http://www.stars.com/Vlib/Misc/Providers.html

    - http://union.ncasa.uiuc.edu/HyperNews/get/www/leasing.html'
