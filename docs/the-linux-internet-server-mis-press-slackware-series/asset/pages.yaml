    # Mod_fastcgi Module


    This module is contained in the mod_fastcgi.c file. It provides for startup of
    and communication with FastCGI applications. This module is not compiled into
    the server by default. To use this module you must compile src/mod_fastcgi.c from
    this kit into your Apache server''s source directory. Then you have to add the
    following line to the server build Configuration file:


    ```

    Module fastcgi_module mod_fastcgi.o

    ```


    Any file with the MIME type application/x-httpd-fcgi will be processed by this
    module. Note that the ScriptAlias directive takes priority over the AddType directive;
    a file located in a directory that is the target of ScriptAlias directive will
    have type application/x-httpd-fcgi and be handled by mod_cgi, regardless of its
    name. So don''t put FastCGI applications in your /cgi-bin/ directory—they won''t
    work properly.'
