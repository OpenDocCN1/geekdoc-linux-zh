    There are a few settings to look at here, however.


    ```

    message /welcome.msg login

    ```


    This line specifies the default login message—that is, the message that''s sent
    to all users after they log on your FTP server. The default welcome.msg file is
    as follows:


    Welcome, archive user! This is an experimental FTP server. If we have any unusual
    problems, please report them via e-mail to root@L. If you do have problems, please
    try using a dash (-) as the first character of your password – this will turn
    off the continuation messages that may be confusing you ftp client.


    You''ll probably want to change this message. For starters, it''s a good idea
    to include the name of your own FTP server somewhere here, and you can probably
    take out the reference to WU-FTP as an “experimental FTP server,” since it''s
    not experimental anymore.


    ```

    limit remote 100 SaSu|Any1800-0600 /etc/msgs/msg.toomany

