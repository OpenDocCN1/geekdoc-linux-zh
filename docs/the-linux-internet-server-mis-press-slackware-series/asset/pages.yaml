    ServerAdmin webmaster@host.foo.com\nDocumentRoot /www/docs/host.foo.com\nServerName\
    \ host.foo.com\nErrorLog logs/host.foo.com-error_log\nTransferLog logs/host.foo.com-access_log\n\
    </VirtualHost>\n```\n\nCurrently, each VirtualHost must correspond to a different\
    \ IP address for the server, so the server machine must be configured to accept\
