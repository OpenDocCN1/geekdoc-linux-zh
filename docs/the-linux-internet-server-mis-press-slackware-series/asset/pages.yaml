    # Basic Concepts


    We begin with an overview of the basic concepts behind the API and how they are
    manifested in the code.


    # Handlers, Modules, and Requests


    Apache breaks down request handling into a series of steps, more or less the way
    the Netscape server API does (although this API has a few more stages than NetSite
    server, as hooks for stuff that might be useful in the future). These are:


    +   * URI -> filename translation

    * Auth id checking (Is the user who says he is?)

    * Auth access checking (Is the user authorized here?)

    * Access checking other than auth

    * Determining MIME type of the object requested

    * Fixups—there aren''t any of these yet, but the phase is intended as a hook for
    possible extensions like SetEnv, which don''t fit well elsewhere.


    +   * Actually sending a response back to the client

    * Logging the request


    These phases are handled by looking at each of a succession of modules, looking
    to see if each of them has a handler for the phase, and attempting to invoke it
    if so. The handler can typically do one of three things:


    +   * Handle the request and indicate that it has done so by returning the magic
    constant OK.

    * Decline to handle the request, by returning the magic integer constant DECLINED.
    In this case, the server behaves in all respects as if the handler simply hadn''t
    been there.'
  merge: -1
  pgno: 246
- img_proc: true
  md: '# 224 CHAPTER 4: Setting Up a Web Server


    +   - Signal an error by returning one of the HTTP error codes. This terminates
    normal handling of the request, although an ErrorDocument may be invoked to try
    to mop up, and it will be logged in any case.


    Most phases are terminated by the first module that handles them; however, for
    logging, fixups, and nonaccess authentication checking, all handlers always run
    (barring an error). Also, the response phase is unique in that modules may declare
    multiple handlers for it, via a dispatch table keyed on the MIME type of the requested
    object. Modules may declare a response-phase handler that can handle any request,
    by giving it the key /*; however, wildcard handlers are only invoked if the server
    has already tried and failed to find a more specific response handler for the
    MIME type of the requested object (either none existed, or all declined).


    The handlers themselves are functions of one argument (like a request_rec structure),
    which returns an integer, as mentioned previously.


    # A Brief Tour of a Module


    At this point, we need to explain the structure of a module. Our candidate will
    be one of the messier ones, the CGI module—this handles both CGI scripts and the
    ScriptAlias config file command. It''s actually a great deal more complicated
    than most modules, but if we''re going to have only one example, it as well be
    the one with its fingers everywhere.


    Let''s begin with handlers. In order to handle the CGI scripts, the module declares
    a response handler for them. Because of ScriptAlias, it also has handlers for
    the name translation phase (to recognize ScriptAliased URIs) and the type-checking
    phase (any ScriptAliased request is typed as a CGI script).


    The module needs to maintain some per (virtual) server information, namely, the
    ScriptAliases in effect; the module structure therefore contains pointers to a
    function that builds these structures and to another that combines two of them
    (in case the main server and a virtual server both have ScriptAliases declared).'
