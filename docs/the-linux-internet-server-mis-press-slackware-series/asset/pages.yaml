    is the file with compressed neighborhoods, X is an offset from that file (usually
    0, must be a multiple of size(int)), Y is the length glimpse access from that
    file (if 0, then the file must be a multiple of size(int)), and Z must be 2 (it
    indicates that filename is the sparse-set representation of compressed neighborhoods;
    the other values are for internal use). Note any colon: in the filename must be
    escaped using a backslash \


    +   -P Used for glimpse intervals.


    +   -q Prints the offsets of the beginning and end of each matched record.The
    difference between -q and -b is that -b prints the offsets of the actual matched
    string, while -q prints the offsets of the whole record where the match occurred.
    The output format is @(x,y), where x is the beginning offset and y is the end
    offset.


    +   -Q When used with -N, glimpse only displays the filename when the match occurs
    also the exact occurs (offsets) as seen in the index. This option is relevant
    only if the index was built with -b; otherwise, the offsets are not available
    in the index. This option is ignored when used with -N.


    +   -r This agre is ignored in glimpse, unless glimpse is used with a filename
    at the end, which makes it run as agre. If the filename is a directory name, the
    -r option will search (recursive) the whole directory and everything below it.
    (The glimpse index will not be used.)


    +   -Rk Defines the maximum size (in bytes) of a record.The maximum value (which
    is the default) is 48 KB. Defining the maximum to be lower than the default may
    speed up some searches.


    +   -s Works silently, that, displays nothing except error messages.This is useful
    for checking the error status.


    +   -Sk Set the cost of a subset to k (k is a positive integer). This option does
    not work currently with regular expressions.


    +   -t Similar to the -option, that the delimiter is assumed to appear at the
    end of the record. Glimpse will output the record starting from the end of .i
    delim (and including) the next .i delim.


    +   -T directory Uses directory as a place where temporary files are built. (Glimpse
    produces small temporary files, usually in /tmp). This option is useful mainly
    in the context of structured queries for the Harvest project, where the temporary
    files may be nontrivial, and the /tmp directory may not have enough space for
    them.'
