    R$+             $ $>93 $1

    ```


    For the most part, this file will be gibbering to you. We reproduce the file here
    so that you can refer to it if you''re making changes to it. Most of what you''ll
    need to worry will be worked out with your ISP.


    # Aliases


    One aspect of sendmail, aliases might require some immediate attention is aliases.
    aliases allow you to redirect mail from one name to another. For example, it''s
    handy to use sendmail to redirect message from a general name to a specific name.
    Most larger Web sites will ask that mail be sent to the Webmaster, using an address
    like Webmaster@kreichard.com. Similarly, most Internet sites don''t designate
    a specific person as the postmaster (the person overseeing the electronic mail);
    instead, they use a name postmaster@kreichard.com.


    For these situations, you''ll want to set up an aliases file. One already exists
    in your Slack Linux installation, under /etc/aliases. However, the default is
    to have nothing in the file except the following:'
  merge: -1
