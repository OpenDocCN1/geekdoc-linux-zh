  md: '# CHAPTER 3: Installing Linux and Internet Components 67


    If you want to create a swap partition, read on. If you don''t, you can skip to
    the end of this section and on to the next section, "Creating the Main Linux Partition."


    Your first move is to create a swap partition with the fdisk command. You''ll
    need to decide how large to make this partition. That will depend on how much
    free space you think you can give up on your hard drive. For the purposes of this
    chapter, we''ll devote 10 MB to swap space.


    Run the fdisk command and then choose the n option, for creating a new partition.
    You''ll see the following:


    ```

    Command action

    e extended

    np primary partition (1-4)

    ```


    Type p and enter the partition number. If you''ve already installed a DOS or OS/2
    partition, you''ll need to select the number 2, as partition number 1 is already
    in use:


    Partition number (1-4): 2


    You''ll then be asked about where to place the partition and how large to make
    it. Generally speaking, you''ll want to place the partition immediately after
    the previous partition:


    First cylinder (64-1010): 64


    Your numbers will undoubtedly be different. The point here is that fdisk automatically
    lists the first unassigned cylinder (in this case, it was cylinder 64), and you
    should go with that number.


    You''ll then be asked how large you want to make the partition:


    Last cylinder +size or +sizeM +sizeK (64-1010): +10M


    Since we''re not into figuring out how many cylinders or how many kilobytes it
    would take to make up 10 MB, we take the easy way out and specify 10 MB directly
    as +10M.'
