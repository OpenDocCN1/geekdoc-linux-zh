  md: '# 56 CHAPTER 3: Installing Linux and Internet Components


    possible to install Linux without using any floppy disks using LOADLIN.EXE, a
    DOS program that loads Linux from an MS-DOS prompt. We''ll cover this option a
    little on, but unless your floppy disk doesn''t work under Linux, it is recommended
    to install using a bootdisk and a rootdisk.


    Your next step is to determine which bootdisk and rootdisk images you''ll be using
    and to write the images onto formatted floppy disks. Because selecting the disk
    images to use (especially the bootdisk) can be a relatively large selection, it
    warrants its own section.


    # Choosing Bootdisk and Rootdisk Images


    Linux needs to know a lot about your PC''s hardware, and that knowledge begins
    the second you boot the system. That''s why you need to put some thought into
    selecting your bootdisk and rootdisk images.


    Before we go any further, you need to understand what bootdisk and rootdisk images
    are. Linux needs to boot from floppy disks initially and needs to know what sort
    of hardware it''s working with. When you boot Linux for the first time, the information
    is contained on the bootdisk and the rootdisk. To create a bootdisk and a rootdisk,
    you must select the proper image. You''ll use the RAWWRITE.EXE utility to copy
    the image byte-for-byte to the diskette.


    How do you select the proper image? The first step is to determine the disk size
    of your A;, which is the drive from which you boot the system. If you''re using
    a 3.5-inch disk drive as A;, you''ll need to grab an image from the bootdisks.144
    directory. (This is labeled because the capacity of a 3.5-inch high-density floppy
    disk is 1.44MB.) If you''re using a 5.25-inch disk drive to boot from, you''ll
    need to grab an image from the bootdisks.12 directory. (This is labeled because
    the capacity of a 5.25-inch high-density floppy is 1.2MB.)


    If you look inside either directory, you''ll find a list of filenames ending in
    .I (for IDE) or .S (for SCSI). The filenames are the same in both directories;
    at this point it doesn''t matter which directory you grab the image.. Each image
    supports a different set of hardware; a listing of the files and the supported
    hardware appears in Tables 3.1 (for IDE bootdisks) and 3.2 (for SCSI bootdisks).'
