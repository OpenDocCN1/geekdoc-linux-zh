  md: '# CHAPTER 4: Setting Up a Web Server 245


    and password to send. It must be accompanied by AuthType

    requires directives, such as AuthUserFile and AuthGroupFile, to work.


    # AuthType


    +   - Syntax: AuthType type

    - Context: directory,.htaccess

    - Override: AuthConfig

    - Status: core


    This directive selects the type of user authentication for a directory.

    Only basic authentication is currently implemented. It must be

    accompanied by AuthName and require directives, such as AuthUserFile

    and AuthGroupFile, to work.


    # BindAddress


    +   - Syntax: BindAddress saddr

    - Default: BindAddress *

    - Context: server config

    - Status: core


    A UNIX HTTP server can either listen on for connections to every IP

    address of the server machine or just one IP address of the server

    machine. Saddr be the wildcard (*), an IP address, or a fully

    qualified Internet domain name. If the value is *, then the server will

    listen for connections on every IP address; otherwise, it will listen only

    on the IP address specified.


    This option can be used as an alternative method for supporting

    virtual hosts instead of using <VirtualHost> sections.


    # DefaultType


    +   - Syntax: DefaultType mime-type

    - Default: DefaultType text/html

    - Context: server config, virtual host, directory,.htaccess

    - Override: FileInfo

    - Status: core'
