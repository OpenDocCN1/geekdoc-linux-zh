  md: '# 272 CHAPTER 4: Setting Up a Web Server


    field in the mSQL table does not allow people in by default with a random password.


    ```

    Auth_MSQL_Authoritative < on | off >

    ```


    The default is on. When set on, there is no fall-through to other authorization
    methods. So if a user is not in the mSQL database table (and perhaps not in the
    right group) or has the password word, then he or she is denied access. When this
    directive is set to off, control is passed on to any other authorization modules,
    such as the basic Auth module with the htpasswd file or the Unix-(g:dbm) module
    to avoid nasty fall-through surprises. Be sure you know what you are doing when
    you decide to switch it off.


    ```

    Auth_MSQL_Encryptedpasswords < on | off >

    ```


    The default is on. When set on, the values in the pwd_field are assumed to be
    crypted using your machine''s crypt() function and the incoming password is crypted
    before comparison. When this function is off, the comparison is done directly
    with the plaintext-extended password. (Yes, http-basic-auth does send the password
    as plaintext over the wire.) The default is a sensible on, but a multivendor or
    international environment (which sometimes leads to different crypts functions)
    might force you to change this.


    An example mSQL table could be created with the following commands:


    ```

    % msqadmin create www

    % msql www

    -> create table user_records (

    -> User_id char(32) primary key,

    -> Cpasswd char(32),

    -> Xgroup char(32)

    -> ) \g

    query OK

    -> \q

    %

    ```'
