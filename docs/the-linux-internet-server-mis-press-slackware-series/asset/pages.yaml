  md: '# 100 CHAPTER 3: Installing Linux and Internet Components


    This list fills several screens. Listed are specific cards (such as the AGX) as
    well as the chipset it uses (AGX). At the bottom of each screen, you''re asked
    to select a card''s number, press Enter to move to the next page, of the configuration
    process, bypassing the remaining card definitions. If you choose a specific card,
    you''ll be presented with information about the card, including the name of the
    X server that supports it.


    In those cases where you don''t know what specific card you own but you do know
    what sort of chipset you have (such as an S3-based chipset), you shouldn''t choose
    a specific card from this list. Instead, go ahead and press q to move to the next
    menu, where you select a server.


    Selecting a server is actually more important than selecting a chipset. All S3-based
    graphics cards use the S3 X server. This process makes it seem more complicated
    than it really is to select an X server. The following menu, you''ll receive no
    matter whether you select a card or not, it clears:


    You must determine which server to run. Refer to the manpages and other documentation.
    The following servers are available (they may not be installed on your system):


    +   1. The XF86_Mono server. This is a monochrome server that should work on any
    VGA-compatible card, in 640x480 (more on some SVGA chipsets).

    2. The XF86_VGA16 server. This is a 16-color VGA server that should work on any
    VGA-compatible card.

    3. The XF86_SVGA server. This is a 256 color SVGA server that supports a number
    of VGA chips. It is accelerated on some Cirrus and WD chipsets; it supports 16/32-bit
    color on certain Cirrus

    4. The accelerated servers. These include XF86_S3, XF86_Mach32, XF86_Mach8, XF86_8514,
    XF86_P9000, XF86_AGX, XF86_W32 and XF86_Mach64.


    These four server types correspond to the four different "Screen" sections in
    XF86Config (vga2, vga16, svga, accel).


    Which one of these screen types do you intend to run by default (1-4)?


    If you had chosen a specific card, you would have an additional line in this:


    +   5. Choose the server from the card definition, XF86_S3.'
