  md: '# CHAPTER 2: Linux Internet Connection Methods 41


    # # Addressing Important Issues


    After you''ve settled on an ISP and a connection scheme, the next step is to obtain
    a domain name and IP addresses. Every computer on the Internet needs an IP address,
    including both servers and clients, such as your users who are surfing the Net.


    IP addresses are allocated in two different ways: permanently and dynamically.
    A permanently assigned IP address is exactly what it sounds like. Your server
    will need a permanently assigned IP address.


    On the flip side, your users can share a range of IP addresses. These can be allocated
    to them an as-needed basis; that''s why they are dynamic.


    When you sign up with an ISP, you will be assigned an IP address for your server.
    This single address can be tied directly to your server, or it can be tied to
    a router connected to the server.


    > The mysteries of networks and subnetworks are beyond the scope of this book.
    See Appendix A for a list of additional resources. NOTE


    # # Obtaining a Domain Name


    Your ISP can arrange for your domain name, or you can apply directly to InterNIC.
    (Before you do this, you''ll need to have an arrangement with an ISP, as you need
    to tell InterNIC your IP addresses.) You can do this directly from the Internet
    by connecting to the following address:


    ```

    http://www.rs.internic.net

