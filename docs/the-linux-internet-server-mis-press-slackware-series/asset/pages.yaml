    and Specialix SIO/XIO (modular, 4 to 32 ports) (ftp://sunsite.unc.edu/pub/linux/kernel/patches/serial/sidrv0_5.tax).


    # Network Adapters


    In general, newer network adapters work without a lot of fuss with Linux. Older
    network adapters may require a little configuration work on your part.


    Supported Ethernet adapters are 3C503, 3C505, 3C507, 3C509/3C509B/3C579; AMD LANCE
    (7C960)/PCnet-ISA/ PCI (AT1500, HP J2405A, NE1500/NE2100); AT&T GIS WaveLAN; Allied
    Telesis AT1700; Anselm Communications AC3200 EISA; Apricot Xen-II; Cabletron E1Zx;
    DEC DE25/DE44/DE34; DEFPCA, and EtherWORKS; Hewlett-Packard PCLAN (27245 and 27xxx
    series), PCLAN PLUS (27247B and 27252A), and 10/100VG PCLAN; Intel EtherExpress
    and EtherExpress Pro; NE2000/NE1000; New Media Ethernet; Racal-Interlan NI5210
    (i82586 Ethernet chip), and NI6510 (am7990 lance chip); PureDataC8028, PDI8023;
    SEEQ 805; Micros Ultra; Schneider & Koch Ki6; Western Digital WD80x3; and Zenith
    Z-Note/IBM ThinkPad 300 built-in adapter.


    There are two things to note regarding network cards in the Hardware HOW-TO: avoid
    3Com C3501 cards like the plague, and beware of NE2000/NE1000 clones.


    Supported pocket and portable adapters are AT-Lan-Tec/RealTek parallel-port adapter
    and D-Link DE600/DE620 parallel-port adapter.


    Slotless connections include SLIP/SLIP (serial port), EQL (serial IP load balancing),
    and PLIP (parallel port) using a LapLink or bi-directional cable.


    All ARCnet work with Linux.


    The IBM Tropic chipset Token Ring cards work with Linux.'
