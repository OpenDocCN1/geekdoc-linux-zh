  md: '# 174 CHAPTER 4: Setting Up a Web Server


    Because the files are assumed to be in the server-root directory, which is set
    with the `ServerRoot` directive. So before the Apache Web server can be launched,
    it needs to know where to find the configuration files.

    The three files are:


    +   - `httpd.conf`, which contains directives that directly control the server.
    You can actually override this with the `-f` command-line flag.

    - `srm.conf`, which contains directives that control the specification of documents
    provided by the server to clients. You can override this over filename with the
    `ResourceConfig` directive in the `httpd.conf` file.

    - `access.conf`, which contains directives that control access to documents. The
    filename may be overridden with the `AccessConfig` directive in the `httpd.conf`
    file.


    Another lesser configuration file, `mime.types`, is also read by the server. It
    contains MIME document types.


    A lot of weirdness and confusion surrounds these configuration files. Basically,
    any directive can appear in any configuration file. Even though some general usage
    guidelines are associated with each configuration file, you''re not required to
    place all document-management information in the `srm.conf` file; it could just
    as well appear in the `httpd.conf` file. However, if you do this, you''ll find
    out that your configuration tasks are made much too difficult because you search
    through three configuration files each time you want to make a change. Therefore,
    it''s best to stick to the general principles associated with each file.


    # Editing the Httpd.Conf File


    To get the Web server up and running, your first chore will be to make a small
    change to the `httpd.conf` file, using emacs or elvis. Here is the entire file:


    ```

    # This is the main server configuration file. See URL http://www.apache.org/

    # for instructions.


    # Do NOT simply read the instructions in here without understanding

    # what they do, if you are unsure consult the online docs. You have been

    # warned.

    ```'
