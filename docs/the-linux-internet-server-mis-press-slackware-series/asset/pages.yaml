    # Mouse


    Basically, Slack Linux supports any mouse that''s connected to a parallel port,
    a serial port, or a PS/2 (mouse) port; during installation, it will be up to you
    to tell Linux where the mouse is. Supported mice include Microsoft serial mouse,
    Mouse Systems mouse, Logitech serial mouse (including the Mouseman), ATI XL busmouse,
    C&T 82C710 (QuickPort); used on (Toshiba and TI Travelmate laptops), Microsoft
    busmouse, Logitech busmouse, and PS/2 (auxiliary device) mouse.


    The following models require kernel patches: Sejin J-mouse (ftp://sunsite.unc.edu/pub/Linux/kernel/patches/console/jmouse.1.1.70-jmouse.tar.gz)
    and MultiMouse ftp://sunsite.unc.edu/pub/Linux/system/Misc/MultiMouse-1.0.tgz).'
