    told to ignore. In general, the syntax of .glimpse_exclude/include (explained
    in Table 6.3) is the same as that of agre (or any other grep). The lines in the
    .glimpse_exclude file are matched to the filenames, and if they match, the files
    are excluded. Notice that agre matches parts of strings (e.g., agre /ftp/pub will
