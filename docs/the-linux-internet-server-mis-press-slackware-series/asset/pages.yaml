- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components


    Basically, the X server types match chipsets. Anyone using the S3 chipset would
    select the XF86_S3 X server. If you wanted to use an accelerated server and didn''t
    specify a chipset, you should select 4 and then select your chipset from the list
    of X servers.


    You''ll be asked whether you want to create a symbolic link between the X program
    file and the X server. You should do so; follow the defaults and you won''t have
    any problems.


    The next question has to do with memory on your video card:


    +   How much video memory do you have on your video card?

    1 256K

    2 512K

    3 1024K

    4 2048K

    5 4096K

    6 Other


    Type in the correct number. If you don''t know, select 512K or 1024K. Most newer
    graphics cards have at least 1024 KB of RAM; this is the minimum RAM needed to
    display a resolution of 1024-by-768 in 256 colors.


    The next section deals with identifiers for your card, much like the earlier identifiers
    for monitors. This information is optional.


    If you chose an accelerated server, you will be asked about some technical settings
    for your graphics card: Clockchip and clock frequencies. This is an area where
    you can just follow along with the xf6config script. If you don''t know the clockchip
    setting, just press Enter. If you don''t know the clock frequencies for your card,
    using the X server in probe-only mode. You can let xf86config probe the clock
    values for you. This information then inserted automatically into the XF86Config
    file. If you''re using a card or a chipset that doesn''t require this information,
    then xf86config will note this and not for clock speeds. This all means that you
    can sit back and let the xf86config script do all the work.


    Finally, your last big decision has to do with the resolution you want to run
    under:


    For each depth, a list of modes (resolutions) is defined. The default resolution
    that the server will start-up with will be the first listed mode that can be supported
    by the monitor and card.'
  merge: -1
