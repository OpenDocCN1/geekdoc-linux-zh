- img_proc: true
  md: '# 402 CHAPTER 7:Working with WU-FTP


    +   - lib, where you can store files.

    - pub, a public directory usually used to store files that can be downloaded by
    users.


    These directory locations were set when WU-FTP was compiled for use on Slackware
    Linux. If you want to make some large-scale changes in these file locations, you''ll
    need to recompile WU-FTP.


    # Configuration Files


    For the most part, WU-FTP will run by itself; however, you might need to adjust
    a number of configuration files for security reasons. The beginning point for
    these configuration options is /etc/ftpaccess, which controls who has access to
    what files and directories. You can set up groups of users, and if you''re running
    on an intranet, you can apply some Linux group permissions to your FTP server.
    In addition, the file can control how much particular users can upload and download,
    and it also sets the log files.


    The ftpaccess file is as follows:


    ```

    loginfails 2


    class local real,guest,anonymous *.domain.0.0.0.0

    class remote real,guest,anonymous *


    limit local 20 Any /etc/msgs/msg.toomany

    limit remote 100 SaSu!Any1800-0600 /etc/msgs/msg.toomany

    limit remote 60 Any /etc/msgs/msg.toomany


    readme README* login

    readme README* cwd=


    message /welcome.msg login

    message .message cwd=*


    compress yes local remote

    tar yes local remote

    ```'
