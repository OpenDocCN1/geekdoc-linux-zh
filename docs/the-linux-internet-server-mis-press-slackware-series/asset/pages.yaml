  md: '# CHAPTER 6: Indexing with Glimpse and GlimpseHTTP 391


    | Option | Purpose |

    | --- | --- |

    | -z | Allows customizable filtering, using the file .glimpse_filters to perform
    the programs listed there for each match. The best example is compress/decompress.
    .glimpse_filters includes the line *.Z uncompress < (separated by tabs), before
    indexing any file that matches the pattern *Z (same syntax as the one for .glimpse_exclude)
    the command is executed first (assuming input is from stdin), which is uncompress
    < and its output (assuming goes to stdout) is indexed. The file itself is not
    changed (i.e., it stays compressed). If glimpse -z is used, the same program is
    used on these files for any program can be used (we run exec). For example, we
    can filter out parts of files that are not indexed. If glimpse_index tries to
    apply all filters in .glimpse_filters the order they are given. For example, if
    you want to uncompress a file and extract some part of it, put the compression
    command (as shown in the preceding example ) first and then another line that
    specifies the extraction. Note that this can slow down the search because the
    filters need to be run before files are searched. |

    | -z | No op.


    # Patterns


    Glimpse supports a large variety of patterns, including:


    +   * Strings, which any sequence of characters, including the special symbols
    ^ for beginning of line and $'' for end of line. as well as the following special
    characters ($, ^, *, [, ], ), !, \) as well as the following meta characters special
    to glimpse (and grep) ;;, #, <>, -, and . should be preceded by \ if they to be
    matched as regular characters. For example, \^abc\ corresponds to the string ^abc\,
    whereas ^abc corresponds to the string ^ at the beginning of a line.

    * Classes of characters, a list of characters inside [ ] (in order) corresponds
    to any character from the list. For example, [a-ho-z] is any character between
    a and h or between o and z. The symbol ^ inside [] complements the list. For example,
    [i-n] denotes any character in the character set except character i to. The symbol
    ^ has two meanings, but this is consistent with egrep. The period symbol . (don''t
    care) stands for any symbol (except for the newline symbol).'
  merge: -1
