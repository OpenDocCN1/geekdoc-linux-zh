  md: '# 506 APPENDIX A: For More Information


    # ### Linux Journal

    [http://www.ssc.com/lj](http://www.ssc.com/lj)

    This [Web](http://www.ssc.com) is associated with the excellent magazine, *Linux
    Journal*. (If you''re not a subscriber, definitely get out the checkbook and subscribe.)
    Excerpts from the magazine are featured here, as well as archives of past issues.


    # ### Linux Gazette

    [http://www.ssc.com/lg/](http://www.ssc.com/lg/)

    This online guide to Linux comes courtesy of the folks who bring the Linux Journal.


    # ### Linux Documentation Project

    [http://sunsite.unc.edu/mdw/linux.html](http://sunsite.unc.edu/mdw/linux.html)

    The motherhood of Linux Web sites. If a Linux site or Web resource isn''t listed
