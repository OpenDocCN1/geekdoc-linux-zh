- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    SetHandler imap-file


    Here is another example: If you wanted to have the server display a status report
    whenever a URL of http://servername/status was called, you might put the following
    into access.conf.


    ```

    <Location /status>

    SetHandler server-status

    </Location>

    ```


    To implement the handler features, an addition has been made to the Apache API
    that you may wish to use. Specifically, a new record has been added to the request_rec
    structure:


    char *handler


    If you wish to have your module engage a handler, you need only to set r->handler
    to the name of the handler at any time prior to the invoke_handler stage of the
    request. Handlers are implemented as they were before, albeit using the handler
    name instead of a content type. While it is not necessary, the naming convention
    for handlers is to use a dash-separated word, with no slashes, so as to not invade
    the media type name space.


    # DBM Files for User Authentication


    Using DBM files for user authentication dramatically reduces the lookup time for
    a password for areas under user authentication, where the user database is larger
    than a couple hundred entries. This is what HotWired uses for its 150,000+ user
    database.


    You can use new directives to replace a password file with a DBM. You can also
    replace a group file with DBM or combine the two. You can use other fields in
    the DBM to store other user details.


    DBM files, native to most UNIX platforms, are an implementation of a self-maintaining
    hash table, where a given key maps to a stored value. DBM files are not ASCII
    and not portable between operating systems, but there is a Perl tool called dbmmanage
    in the /support directory included with the Apache distribution to modify and
    view (and'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    add a user, automatically encrypting their password) DBM files. Apache''s version
    uses the ndbm library—there are other libraries, but this was chosen as the one
    implemented on most systems and the one Perl uses by default when binding a DBM
    file to an associative array. Be sure you are using ndbm and not GNU''s gdbm if
    you run into trouble.


    On some systems, when you open a DBM file named filename, it will create two files,
    filename.dir and filename.pag. Other systems will create a filename.db. For the
    purposes of this documentation, when we refer to a DBM file it''s to the root
    name, i.e., filename. The keys of the DBM file are the user names, and the values
    mapped to those keys are the encrypted passwords.


    To activate DBM authentication, you might have to compile the Apache server with
    -ndbm set in the EXTRA_LIBS variable in the Configuration file. You also need
    to uncomment the line in the Configuration file:


    ```

    Module db_auth_module_dbm.o

    ```


    This module creates a new directive, AuthDBMUserFile, which can be dropped in
    place of AuthUserFile in your configuration file or .htaccess files. The argument
    to that directive is the DBM filename, such as:


    ```

    AuthDBMUserFile /www/passwords

    ```


    These passwords are encrypted using standard UNIX crypt(), which the utility dbmmanager
    can handle with the adduser option.


    Each entry in a DBM file has a key and a value. For the password file the key
    is the username. The value is the standard UNIX crypt() password. The value field
    can also contain other data that are ignored during password checks (.). these
    data must be separated from the password with a colon character (.). The dbmmanager
    utility supplied with Apache can be used to add and remove users and encrypt passwords.


    A new keyword, AuthDBMGroupFile, can be dropped in place of AuthGroup in your
    configuration or .htaccess files. The argument to that keyword is the DBM filename,
    such as:


    ```

    AuthDBMGroupFile /www/groups

    ```'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'Each entry in a DBM file has a key and a value. For the group file the key
    is the username. The value is a list of groupnames of which the user is a member;
    they are separated from each other with commas (;). Note that there must be no
    whitespace within the value and that the value must never contain any colon characters
    (:).


    In some cases it is easier to manage a single database that contains both the
    password and group details for each user. This simplifies all support programs
    that need to be written: they now only have to deal with writing to locking a
    single DBM file. This can be accomplished by first setting the group and password
    files to point to the same DBM:


    ```

    AuthDBMGroup /www/userbase

    AuthDBMFile /www/userbase

    ```


    The key for the single DBM is the username. The value consists of:


    Unix Crypted Password : List of Groups [ : (ignored) ]


    The password section contains the UNIX crypt() password as before. This is followed
    by a colon and the comma-separated list of groups. Other data may optionally be
    left in the DBM file after another colon; it is ignored by the authentication
    module. This is what telescope.org uses for its combined password and group database.


    The implementation of dbmopen in the Apache modules reads the string length of
    the hashed values from the DBM data structures rather than relying upon the string
    being NULL-appended. Some applications, such as the Netscape Web server, rely
    upon the string being NULL-appended, so if you are having trouble using DBM files
    interchangeably between applications, this may be part of the problem.


    # The Status Module


    The Status module allows a server administrator to find out how their server is
    performing. An HTML page is presented that gives the current server statistics
    in an easily readable form. If required, this page can be made to automatically
    refresh (given a compatible browser). Another page gives a simple machine-readable
    list of the current server state.'
