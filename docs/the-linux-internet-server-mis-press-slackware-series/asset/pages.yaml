  md: '# 270 CHAPTER 4: Setting Up a Web Server


    anonymous-ftp sites, like having a user ID of anonymous, and the e-mail address
    as a password. These e-mail addresses can be logged.


    Combined with other (database) access control methods, this allows for effective
    user tracking and customization according to a user profile while still keeping
    the site open for unregistered users. One advantage of using Auth-based user tracking
    is that, unlike magic cookies and funny URL pre/postfix, it is completely browser-independent
