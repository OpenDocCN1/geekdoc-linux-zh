  md: '# CHAPTER 3: Installing Linux and Internet Components


    To end the installation program, you can either press the Esc key a few times
    or type Ctrl-C.


    # Installing a Kernel


    The first Linux configuration task is to install a Linux kernel on your hard drive.
    It''s possible that you''ve already installed a kernel from the A series (there
    are two kernels on the A series, IDE and a SCSI generic kernel), but in most cases
    it will be preferable to replace this kernel with the one you''ve used to install.
    That way, there won''t be any surprises when you reboot—you''ve installed a kernel
    that you know works on your machine.


    To do this, select the bootdisk option on the kernel installation menu. You''ll
    be asked to reinsert your installation bootdisk, and the kernel will be copied
    onto your hard drive. Other options on this menu include installing a kernel from
    a DOS floppy diskette or from the Slack CD-ROM drive. If you know exactly which
    kernel you need, you can try one of these options. You should be aware that installing
    the wrong kernel here can leave Linux unbootable, requiring you to use your bootdisk
    or Loadlin to start the system.


    > When you install a kernel from this menu, all it does put the kernel file onto
    your root Linux partition as /vmlinuz. Until you make a system bootdisk from it
    your system is still not ready to boot. So, you''ll want to make a system bootdisk
    from the next menu.


    # Creating a Boot Floppy


    Linux will boot from either a floppy drive or hard drive. However, it''s recommended
    that you set up the means to boot either way—if you have hardware problems, you
    can always boot the system from a floppy diskette drive—hence, the request from
    the setup program to create a boot floppy. This floppy can be used to boot Linux
    at any point. This will be handy should you experience some hard-disk problems
    or screw up your hard disk so severely that the system won''t load.'
  merge: -1
