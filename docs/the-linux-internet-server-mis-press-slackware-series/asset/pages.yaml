  md: '# CHAPTER 4: Setting Up a Web Server 293


    The TypesConfig directive sets the location of the MIME types configuration file.
    Filename is relative to the ServerRoot. This file sets the default list of mappings
    from filename extensions to content types; changing this file is not recommended.
    Use the AddType directive instead. The file contains lines in the format of the
    arguments to an AddType command:


    ```

    mime-type extension extension ...

    ```


    The extensions are lowerc. Blank lines and lines beginning with a hash character
    (#) are ignored.


    # Mod_negotiation Module


    This module is contained in the mod_negotiation.c file and is compiled in by default.
    It provides for content negotiation. Any document with MIME type application/x-type-map
    will be processed by this module.


    The HTTP standard allows clients (browsers like Mosaic or Netscape) to specify
    what data formats they are prepared to accept. The intention is that when information
    is available in multiple variants (e.g., in different data formats), servers can
    use this information to decide which variant to send. This feature has been supported
    by the CERN server for a while, and though it is not yet supported in the NCSA
    server, it is likely to assume a new importance in light of the emergence of HTML-capable
    browsers.


    The Apache module mod_negotiation handles content negotiation in two different
    ways: special treatment for the pseudo-MIME-type application/x-type-map and the
    MultiViews per-directory option (which can be set in srm.conf or in .htaccess
    files, as usual). These features alternate user interfaces to what amounts to
    the same piece of code in the new file http_mime_db.c) implements the content
    negotiation portion of the HTTP protocol.


    Each of these features allows one of several features to satisfy a request based
    on the client says it''s willing to accept; the differences are in the way the
    files are identified. A type map (like a *.var file) names the files containing
    the variants explicitly, while in a MultiViews search, the server does an implicit
    filename pattern match and chooses from among the results.'
  merge: -1
  pgno: 316
- img_proc: true
  md: '# 294 CHAPTER 4: Setting Up a Web Server


    Apache also supports a new pseudo-MIME type, text/x-server-parsed-html3, which
    is treated as text/html;level=3 for purposes of content negotiation and as server-side-included
    HTML elsewhere.


    A type map is a document that is typed by the server (using its normal suffix-based
    mechanisms as application/x-type-map). To use this feature, you must have an AddType
    somewhere that defines a file suffix as application/x-type-map; the easiest thing
    may be to stick:


    ```

    AddType application/x-type-map var

    ```


    in srm.conf.


    Type-map files have an entry for each available variant; these entries consist
    of contiguous RFC822-format header lines. Entries for different variants are separated
    by blank lines. Blank lines are illegal within an entry. It is conventional to
    begin a map file with an entry for the combined entity as a whole, like


    ```

    URI: foo; vary"type", language

    ```


    ```

    URI: foo.en.html

    Content-type: text/html; level=2

    Content-language: en

    ```


    ```

    URI: foo.fr.html

    Content-type: text/html; level=2

    Content-language: fr

    ```


    If the variants have different qualities, that may be indicated by the qs parameter,
    as in this picture (available as JPEG, GIF, or ASCII-art):


    ```

    URI: foo; vary="type", language

    ```


    ```

    URI: foo.jpeg

    Content-type: image/jpeg; qs=0.8

    ```


    ```

    URI: foo.gif

    Content-type: image/gif; qs=0.5

    ```


    ```

    URI: foo.txt

    Content-type: text/plain; qs=0.01

    ```'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    There are a number of recognized headers. URI is the uri of the file containing
    the variant (of the given media type, encoded with the given content encoding).
    These are interpreted as URLs relative to the map file; they must be on the same
    server, and they must refer to files which the client would be granted access
    if they were to requested directly. Content-type is the media type; the level
    may be specified, along with qs. These are often referred to as MIME types; typical
    media types are image/gif, text/plain, or text/html;level=3. The content-language
    is the language of the variant, specified as an Internet standard language code
    (en for English, kr for Korean, and so on). Content-encoding defines the encoding.
    If the file is compressed or otherwise encoded, rather than containing the actual
    raw data, this says how that was done. For compressed files (the only case where
    this generally comes up), content encoding should be x-compress or gzip, as appropriate.
    The content-length is the size of the file. If the variant isn''t too big; specifying
    a content length in the map allows the server to compare against these thresholds
    without checking the actual file.


    Multiview is a per-directory option, meaning that it can be set with Options directive
    within a <Directory> section in access.conf or (if AllowOverride is properly set)
    in .htaccess files. Options All does not set Multiviews; you have to ask for it
    by name (Fixing this is a one-line change to httpd.conf).


    The effect of Multiviews follows: If the server receives a request for /some/dir/foo,
    if /some/dir/foo does not exist, then the server reads the directory looking for
    files named foo.* and if /some/dir/ fakes up a type map that names all files,
    assigning them the same media type and content-encodings it would if the client
    had asked for one of them. It then chooses the best match to the client''s requirements
    and forwards them.


    This applies to searches for the file named by the DirectoryIndex directive, if
    the server is trying to index a directory; if the configuration files specifies:


    DirectoryIndex index


    then the server will arbitrate between index.html and index.html3 if both are
    present. If neither is present and index.cgi is there, the server will run it.'
  merge: -1
  pgno: 318
- img_proc: true
  md: '# 296 CHAPTER 4: Setting Up a Web Server


    If one of the files found by the globbing: is a CGI script, it''s not obvious
    what should happen. That case gets special treatment—if the request is a POST
    or a GET with QUERY_ARGS or PATH_INFO, the script is given an extremely high quality
    rating and is generally invoked; otherwise, it is given an extremely low quality
    rating, which generally causes jiggering of one the other views (if any) to be
    retrieved. This is the only jiggering of quality ratings by the MultiViews code;
    aside from that, all Qualities in the synthesized type maps are 1.0.


    Documents in multiple languages can also be resolved through the use of the AddLanguage
    and LanguagePriority directives:


    ```

    AddLanguage .en

    AddLanguage fr .fr

    AddLanguage de .de

    AddLanguage da .da

    AddLanguage el .el

    AddLanguage .it

    ```


    # LanguagePriority allows you to give precedence to some languages

    # in case of a tie during content negotiation.

    # Just list the languages in decreasing order of preference.


    LanguagePriority en fr-de


    A, request for foo.html matched against foo.html.en and foo.html.fr would return
    a French document to a browser that indicated a preference for French and an English
    document otherwise. In fact, a request for foo matched against foo.html.en, foo.html.fr,
    foo.ps.en, foo.pdf.de, and foo.txt.it would do just what you expect—treat those
    suffices as a database and compare to it, returning the best match. The languages
    and data types share the same suffix space.


    This machinery comes into play only if the file you attempted to retrieve does
    not exist by that name; if it does, it is simply retrieved as usual. (So, someone
    who actually asks for foo.jpeg, as opposed to foo, never gets foo.gif).


    The two directives made possible with this module are CacheNegotiatedDocs and
    LanguagePriority.'
  merge: -1
