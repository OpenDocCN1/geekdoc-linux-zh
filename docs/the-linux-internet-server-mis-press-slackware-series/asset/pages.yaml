  md: '# Internet vs. Intranet


    So far in this chapter we''ve discussed the Internet, assuming that you''ll want
    to connect your Linux network to the rest of the world.


    It''s not mandatory that you connect your network to the rest of the world in
    order to use Internet technology. One of the hotter trends in the computer world,
    as a matter of fact, is using Internet technology on internal networks, the result
    being an intranet.


    If you''ve used Linux for any amount of time, you''ve been using an intranet for
    a while and didn''t even know it. An intranet is basically using network-based
    tools like electronic mail, remote logins, TCP/IP to interconnect computers. This
    sounds just like the typical Linux network!


    So, dear Linux reader, your evaluation process of intranet is a lot less complicated
    than for Windows geeks debating whether or not to connect to the Internet. As
    they (contemplating using TCP/IP instead of Novell—what concept!), you''ve already
    made the decision in favor of the intranet if you''ve already settled on Linux.
    Your only decision is whether or not to connect to the wider Internet and in what
    format.


    This probably isn''t a difficult decision. Let''s face it it—if your company works
    in a sensitive area, chances are good that you really don''t want the outside
    world to be poking around your Linux Web site. If your company is in a nonglamorous
    manufacturing field with a defined audience, you may decide that the cost of connecting
    to the Internet isn''t worth the cost of said connection, since the number of
    potential customers stumbling across your site will be rather small. Or you could
    partially connect to the Internet, perhaps only with electronic mail.


    What kind of information can be published on your intranet?


    +   - Personal Web pages, so that workers can learn a little about other company
    workers through self-published pages.

    - Group schedules. A new breed of group-scheduling programs uses the Internet
    to coordinate schedules among workgroups.

    - Clear delineation of company policies. Instead of printing corporate policy
    handouts, the information can be posted on an intranet.

    - Electronic mail, both for internal employees and for the benefit of the world
    at large.'
  merge: -1
  pgno: 49
- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slackware Linux


    +   - Forms for routine matters, such as payment and vacation requests.

    - Access to company documentation. If your company creates widgets for the nursing
    market, the documentation can be placed online and updated as needed. Instead
    of creating a limited set of printed manuals, each user can have access to the
    documentation online.

    - Threaded discussions of company developments.

    - Corporate phone information.


    Creating documents for an intranet isn''t that complex; to be honest, a document
    prepared for dissemination within a company doesn’t need to be as elaborate or
    as show as Web documents prepared for the world at large. In these cases, using
    a text editor like emacs or an HTML editor like tkHTML is perfectly adequately.


    # The Intranet Layout


    An intranet will look like any company network when mapped out. Your clients will
    use TCP/IP to connect to the Linux server. There’s one big decision you’ll need
    to make: whether or not to maintain a live connection to the Internet. You could
    easily implement Internet technology within your corporation without ever connecting
    to the Internet—after all, an intranet is nothing more than client/server computing
    using Internet technology.


    On the flip side, a connection to the Internet can be a valuable thing, as your
    users can undoubtedly find useful information on the Net. In addition, you can
    maintain partial links, such as maintaining electronic mail with the Internet
    without providing Web usage. These situations require you to make some access
    decisions, but these are policy issues that require you to take into account intangibles.
    As far as technology goes, it’s easy to set up a firewall that allows only outgoing
    requests while preventing outside requests to your Web server. It’s also easy
    to set up a mail server to process incoming and outgoing mail without including
    Web access. Again, these are policy decisions.'
  merge: -1
  pgno: 50
- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slackware Linux


    # Intranets and Security


    You should have some knowledge of one of the prime considerations of anyone considering
    an intranet: security.


    Chapter 13 will contain more information about security and firewalls.


    ![](img/7488e49c99dd1fc906878692fde2ec31_51_0.png)


    A recent development in the Internet world is the virtual private network (VPN).
    In a VPN, you would set up an Internet connection and use the Internet as your
    corporate network. In this situation, you wouldn''t use private leased lines to
    connect your corporate sites; you would use the Internet, instead. You would need
    to establish usernames and passwords for anyone requiring access to your VPN,
    in the same way that you would with a regular network. This basically turns the
    Internet into your own Wide Area Network (WAN), cutting down your network costs
    (you don''t need those expensive leased lines, except for the ones between your
    servers and your ISP). The advantages are that Internet technology is open and
    ubiquitous, and anyone connected anywhere in the world could log in to your VPN.
    In addition, you could adopt TCP/IP as your networking protocol of choice. Your
    users could use any operating system that supports TCP/IP—including Windows, Windows
    95, UNIX, Linux, and Macintosh.


    In this situation, however, privacy must be the first consideration, and you may
    find that the risk involved isn''t worth the money savings. You''ll need to adopt
    some stringent encryption policies, and you''ll need to make sure that your browser
    and your server are well-integrated when it comes to security (in other words,
    using Microsoft products together or using Netscape products together).


    There''s also the moral issue of using the Internet as your own network and essentially
    asking other Internet users to (basically) subsidize your network. I once tested
    telephone software, which allows users to avoid paying long-distance telephone
    bills by using Internet connections. The trouble with arrangements like this is
    that telephone software packages bandwidth hogs, and it''s profoundly unfair for
    users to wait longer for their Web documents just so that two factory workers
    can have an Internet telephone connection open 10 hours a day.


    ![](img/7488e49c99dd1fc906878692fde2ec31_51_1.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slack Linux 29


    # The Case for Web Browsers


    When you decide to go with an intranet, you''re really deciding to make a Web
    browser a prime part of your company information infrastructure. This decision
    shouldn''t be made lightly. There are other corporate computing tools that are
    better integrated with the everyday tools—like word word processors, spreadsheets,
    database managers, and customized applications—that your users are likely to use.


    Still, there are some rather compelling reasons to go with Web browsers in your
    company. To wit:


    +   * Browsers are platform-independent. Both Microsoft and Netscape Communications
    offer Windows 95/NT, Windows 3.1, and Macintosh versions of their browsers. In
    addition, Netscape offers UNIX and Linux versions of its browser. You can support
    a mixed environment of users with few problems—a Linux Web server can serve a
    mixed environment of PCs, Macintoshes, and UNIX workstations.


    +   * Browsers are free. Arena, which ships on the accompanying CD-ROM, is free.
    Netscape Communications does require payment from corporations who use Navigator.


    +   * Browsers do not drag on system resources. You won''t need to upgrade hardware
    just because a browser is running all the time.


    +   * Browsers are easy to use. Let''s face it, there''s not a lot of computing
    complexity associated with a browser for users. You basically enter a URL and
    away you go. With the rise of the Internet among home users, you''re also assured
    that a good chunk of your workforce will be somewhat familiar with browser technology.
    This would cut down training times and costs.


    +   * Browsers can cut down on development costs. When you develop an application,
    you usually must develop it for a specific operating system. Sure, we know that
    cross-platform development occurs, but we also know what a pain it is. This is
    avoided when you use Web browsers to funnel this technology to users: A Java applet
    will run the same on any browser supporting Java, no matter if the browsers run
    on Linux, Windows 95, Windows 3.1, or Macintosh.


    Your specific situation will dictate whether or not to go with an intranet.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '30 CHAPTER I:The Internet, Intranets and Slackware Linux


    # Administrative Issues


    Many of the most important issues you''ll face in setting up an intranet will
    have little to do with technology and more with turf issues. Everyone will want
    to have a say in how the intranet is run and administered. Let''s face it, experience
    with Internet and intranet technology is a good thing for anyone to have on their
    resume at this time, so don''t be surprised if there are some sharp elbows coming
    your way as you plan the network.


    Still, you''ll need to work out logistical issues of all sorts. Who should decide
    decisions for various domains? Who should be performing the grunt work of the
    network, doing such as system backups? How much power should be divided among
    domains? Once it''s set up, Linux is easier to maintain—basically, it runs itself—but
    someone will have to be charge of the network when it comes to the grunge work.


    This book isn''t going to spend a lot of time on setting up a TCP/IP network.
    This is an involved topic that''s already been the topic of other texts (which
    you''ll learn about in Appendix A). Here, we''ll assume that such a network has
    been set up.


    # Summary


    This chapter introduced the Internet and intranet as they apply to the Slack Linux
    operating system. The tools for placing your own server on the Internet are part
    of Slack Linux. This chapter detailed the various servers that comprise the Internet:
    Web servers, electronic-mail servers, Gopher servers, FTP servers, search engines,
    chat/discussion servers, and more. All these tools are part of Slack Linux or
    contained on the accompanying CD-ROM, so it''s possible for you to place a well-rounded
    site on the Web without having to go out and buy a lot of additional commercial
    software. Just add your content, and you''re set.


    Additional time was spent discussing what sort of hardware configuration you''ll
    need on your Linux box. It''s not a complicated process to decide on such a configuration,
    but spending a little money in the right places will increase performance.'
  merge: -1
  pgno: 53
