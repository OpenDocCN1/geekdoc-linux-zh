  md: '# 14 CHAPTER I:The Internet, Intranets and Slackware Linux


    The explosion of the Web is rather breath-taking. Back in January 1993, there
    were only 50 World Wide Web servers online (although, admittedly, there were a
    great many mail, news, and FTP servers available). What fueled the Internet explosion
    wasn''t necessarily the development of Web servers—indeed, a basic Web server
    doesn''t represent a stupendous programming task—but the development of Web browsers.
    February 1993 saw the release of Mosaic for X Window from the National Center
    for Supercomputing Applications (NCSA) at the University of Illinois atat Urbana-Champaign.
    Macintosh and Windows versions soon ensued. The software development team at NCSA
    did a lot to shape how we view the Web today, with its support of multimedia additions
    to Web documents (through the MIME protocol), the incorporation of graphics into
    documents, and the addition of protocols like mail and news. In the early days,
    the Internet was a UNIX beast.


    The Internet exploded in popularity thanks to NCSA Mosaic. Of course, NCSA Mosaic
    didn''t remain the only Web browser in town for long, as other Web browsers like
    Cello soon claimed their fair share of users. Today, NCSA Mosaic is still available
    via the Internet, but commercial versions of Mosaic are overseen by Spyglass (Microsoft
    Internet Explorer is actually based on the venerable Mosaic, although Microsoft
    has made enough enhancements to the browser to allow it to be considered a new
    and separate product.)


    In March 1994, several people who worked on the development of NCSA Mosaic left
    the Midwest for the sunnier climates of California to work at a small startup
    called Mosaic Communications. (The name was changed to Netscape Communications
    after a few calls from University of Illinois lawyers.) Their first product, Netscape
    Navigator, set the tone for the next generation of Web browsers—fast, slick, and
    colorful. Depending on who you ask, Netscape Navigator accounts for between 50
    and 80 percent of all Web usage—which is why you''ll need to consider at some
    point point whether to tailor your site for Netscape Navigator or to remain neutral
    in the browser wars.


    HTTP is still a technology in development. One new development currently in limited
    use is Secure HTTP (S-HTTP). It uses public-key technology from RSA Data Security
    in order to facilitate secure Internet transactions.'
