- img_proc: true
  md: '# CHAPTER 5: Setting Up Gopher


    The only currently allowable values for the Attribute= field in a menu are invisible,
    gopheronly, httponly, nosearch, and gnlink. When entered in a menu attribute line,
    their case is not significant. It is not possible for a single menu item to have
    two attributes.


    # Serving Items to HTTP Clients


    There are several ways to serve items to HTTP clients. The various methods are
    appropriate for different circumstances. In all cases, however, the selections
    will not be shown to Gopher clients and will be made available only to HTTP clients.


    Perhaps the simplest and most natural is to use the httpText= and endregion= keywords.
    These provide arbitrary HTML, including hypertext links, to the HTTP client.


    When the object is a local file, an Attribute=httponly line may be used. This
    was discussed in the previous section.


    Another method is to use a menu entry such as:


    ```

    URLlink=A file for HTTP clients only on a remote server

    Url=http://host.name.edu/0/dir/file

    ```


    This provides arbitrary objects, including items from remote servers, to HTTP
    clients. The title for the item can use HTML by saying, instead,


    ```

    URLlink=file for HTTP clients <strong>only</strong></a> (on remote server)

    Url=http://host.name.edu/0/dir/file

    ```


    Note that when URLlink= is used, you must furnish the <A> hyperlink terminator,
    similar to HName= lines.


    # Setting Up a “Search All Menus” Item


    A built-in feature of gn is the ability to have a menu item that, when selected,
    prompts the user for a search term and returns a virtual menu of all menu items
    containing that term. In fact, such an item can occur at any level and return
    all matches from all menus on that server or all matches at or below some chosen
    level.'
  merge: -1
  pgno: 394
- img_proc: true
  md: 'Here''s how to set it up. Create an entry like this in the menu file

    where you want the search item to occur:


    ```

    Name=Search all menus on this server

    Type=7

    Path=7c/.cache

    ```


    (If you want the search to cover only those items in directory /foo/bar,

    then the Path line should be Path=7c/foo/bar/.cache). Now run mkcache

    t translate the new menu file to a .cache file, and you are done. The Type,

    Host, and Port lines are optional—if they are omitted, mkcache will use

    the default value or the value supplied on command line. When

    change any of the menus in your server and remake the .cache files, gn

    will automatically reflect this in menu searches. There is a maximum

    depth that gn will search into the gn hierarchy. Its value can be changed

    by editing the config.h file and recompiling.


    If the directory tree you wish to search is not the same one whose

    menu you want to contain the search item, then you will need to place a

    search item in both menu files: one in the menu where the search item

    should appear and another in the menu of the directory to be searched

    (perhaps hidden with Attribute=invisible). The first puts the search item

    on the client''s menu, and the second grants the server permission to do

    the search.


    # Compressed Files


    If you wish, you can keep files on your server in a compressed format

    an uncompress them on the fly as a client requests them. You need a

    program to compress the files and a companion program to decompress

    them. Recommended are gzip and zcat from the GNU project. They are

    considerably more efficient than the UNIX standard compress.


    When configuring gn for compilation, be sure to set the #define

    DECOMPRESS in the config.h file to the pathname of the program that

    will decompress the files you have compressed. The default value for

    this is /usr/local/bin/zcat. Another possibility would be

    /usr/ucb/uncompress -c.'
  merge: -1
  pgno: 395
- img_proc: true
  md: '# CHAPTER 5: Setting Up Gopher 373


    If the file you want to make available is rootdir/dir1/bigfile, first you must
    compress it with the compress command, which will replace it with the bigfile.gz
    or bigfile.Z. You then make a menu entry like the following (assuming bigfile
    was a text file and you have produced bigfile.gz):


    ```

    Name=All the text in Bigfile

    Path=0/dir/bigfile.gz

    Type=0

    ```


    The key is the Z, which is the second character of the Path field. It indicates
    that the file is compressed. The Path would start with 0Z (that''s zero Z) for
    any compressed text file. It doesn''t matter how the file was compressed or what
    its name is bigfile.Z or bigfile.gz or something else. You have already told gn
    to decompress the file by specifying the DECOMPRESS program in config.h.


    Of course, if bigfile is a binary, the Path field would be 9Z|dir/bigfile.gz and
    the Type would be 9. For a sound file, Path=sZ/dir/bigfile.gz, Type=s, etc. Files
    of types 0, 4, 5, 9, and I can be compressed; structured files (Type 1m) cannot
    be compressed.


    You might want to let users download the file in compressed format. You could
    give them the option by having the menu item as above with Path=0Z/dir|bigfile.gz
    and also having a menu item:


    ```

    Name=Bigfile in compressed format

    Path=9/dir/bigfile.gz

    Type=9

    ```


    Note the Type=9, since compressed files are binaries (even though bigfile is text),
    and there is no Z as the second character of the Path, because now we do not want
    to decompress. Also note that two versions of bigfile show up on your menu (text
    and compressed binary), but there is only one file bigfile.gz on your disk.


    # Serving the Output of a Program or Script


    Sometimes it is convenient to have the server return the output of a program or
    script. This capability is built into gn. Assuming that you'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# 374 CHAPTER 5: Setting Up Gopher


    have a program in a file prog that returns some text, you can make its output
    be an item on your server’s menu with a menu entry like:


    ```

    Name=Program output

    Type=0

    Path=exec0::/dir/prog

    ```


    The phrase exec says to run the program prog, which must be executable by the
    gn user (probably nobody). The 0 after the exec says this is a text file; exec
    can return most types, including 0 (text), 1 (menus), 9 (binaries), s (sound),
    and I (image). Scripts or programs returning type 1 documents must produce a document
    in the format of acache file. This format is described in the file /docs/technical.notes.
    To specify a type, the single character is appended to the path so that the Type=0
    line is not really necessary. Thus if you wanted to return the output of a program
    in the format of an image file you might have an entry like:


    ```

    Name=Image program output

    Path=execI://dir/prog

    ContentTypeText=image/gif

    ```


    The pair of columns in the path can contain types arguments to the program.


    There is also support in gn for scripts complying with the CGI (Common Gateway
    Interface) standard. This allows the use of a growing collection of scripts that
    are written for HTTP servers supporting the standard. The use of these scripts
    is similar to the exec0 types described previously but with a somewhat different
    syntax. Your menu file entry might look like:


    ```

    Name=A CGI script

    Path=CGI/dir/script.cgi

    ```


    The initial CGI in the Path field indicates that this is a CGI item. In some respects
    the syntax is rather awkward, but it is made necessary to comply with a standard
    really intended for servers with a quite different design.'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'In particular, the name of the script must end with the suffix .cgi (or a replacement
    set at compile time in the config.h file), and no directory above the script in
    the data hierarchy may end in this suffix. The reason for this is the unusual
    way in which arguments CGI scripts must be transmitted to the script. Instead
    of enclosing them in colons as the preceding exec examples, the arguments are
    appended to the end of the path as if they were a filename. To execute the preceding
    script with argument foo, you would use the URL:


    ```

    http://host/CGI/dir/script.cgi/foo

    ```


    This URL is frequently generated by the script itself with the extra called path
    information (the foo in this example) used as a way of saving state. It is also
    possible to put this in the menu file so the script will be executed with that
    argument:


    ```

    Name=A CGI script

    Path=CGI/dir/script.cgi/foo

    ```


    # GN Internal Types


    Each Field in a gn menu file contains an entry known as a selector. The format
    of this selector is a gn internal type field followed by the path relative to
    the gn root directory of the file referenced. The gn internal type indicates to
    the server what kind of document or file is referenced. It can be a single character
    like 0 to indicate a text file or a more compliated string. Here is a list of
    the types and what they mean:


    +   - 0—Plain text. This is a normal ASCII text file; the MIME content used is
    text/plain.

    - 0h, 1h—Plain text and HTML (two files). Items of type 0h are represented by
    two files, filename or filename.txt and filename.html, which are plain text and
    HTML versions of the same document. The server will return the HTML version to
    HTTP clients and the plaintext version to Gopher clients. Content types are text/plain
    and text/html, respectively. Type 1h similarly returning a menu corresponding
    to dirname to Gopher clients and an HTML document dirname.html to HTTP clients.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '376 CHAPTER 5: Setting Up Gopher


    +   - 1—Menu. Items of this type correspond to directories in the gn hierarchy.
    From the menu file in this directory, the server produces an HTML document for
    HTTP clients and a Gopher protocol directory for Gopher clients.


    +   - 1m—Structured file. Items of this type are files consisting of many smaller
    documents like a mail file. The server presents a menu of these smaller documents
    and when one is selected returns the appropriate part of the file.


    +   - 1s—Searchable menu. Like type 1 but allows items in this menu to be searched
    with grep searches.


    +   - 2—CS or "ph" URL (link). The gn server does nothing with these links except
    give the URL (or Gopher equivalent) to the client to handle.


    +   - 3—Error. This type is reserved for error messages. It should not be used
    in a menu file.


    +   - 4, 5, 6—Binhex, DOS .exe and uuencoded files. These types refer to Mac binhex,
    DOS binaries, and UNIX uuencoded files, respectively. The server treats types
    4 and 6 (binhex and uuencoded) exactly like text files and type 5 (DOS binaries)
    like type 9 binary files.


    +   - 7—Maintainer-defined search or response to client-supplied string. An item
    of this type refers to a program or script provided by the server maintainer.
    This program should take an input string and respond with output in the format
    of a .cache file.


    +   - 7e—Menu keyword search. This item refers to a directory in the gn hierarchy,
    typically the root directory. When it is selected, the user is prompted for a
    search term (any grep-like regular expression). The server returns a menu of all
    menu items in the hierarchy at or below the given directory containing matches
    for the regular expression.


    +   - 7g—Grep searches. This item refers to a directory in the gn hierarchy, containing
    a number of files. When this item is selected, the server prompts the user for
