  md: '# CHAPTER 4: Setting Up a Web Server


    The -u and -E options greatly enhance security, but it is important to keep the
    following principle in mind. You should assume that any permissions you grant
    to the userid under which WN runs are also granted to every user who can create
    an index.cache file in your data hierarchy.


    # Some Recommended Security Configurations


    This list of possible ways you might configure your server by setting values in
    config.h and using command-line arguments. It assumes that you are running ewn
    or wn on the privileged port 80 and that the default value of USERID and GROUPID
    defined in config.h have not been changed. This will mean that swn will be started
    as root but almost immediately switches its privileges to those of the unprivileged
    nobody. Likewise if wn is running under inetd, we assume that it is set to run
    with the privileges of nobody. The following list of configurations is in decreasing
    order of security.


    # Forbidden CGI and Only Maintainer Trusted


    This strongest level of security is achieved by running either swn (or wn under
    inetd) with the -t or -e option, and no other options. (For the really paranoid,
    uncommenting the #define FORBID_CGI line in the file config.h and recompiling
    removes the CGI code from the binary.)


    With these options no CGI programs or filters or script output includes are permitted.
    Also the POST method is not accepted (an error is returned for a POST request).
    Furthermore only index.cache files owned by the user specified in the -t option
    are used. The server should be run as nobody (the default), and the numeric user
    ID specified with -t should be the maintainer''s.


    # Only Maintainer or Maintainer Group Trusted


    This is the strongest level of security if you need the functionality of CGI scripts
    or filters or script output as server includes. This security configuration does
    not allow any user home pages (unless the maintainer produces the index.cache
    file for them). To use this level, run swn (or wn under inetd) with the -t or
    -T option and no other options. This places all control in the hands of a single
    maintainer or'
  merge: -1
  pgno: 372
- img_proc: true
  md: '350 CHAPTER 4: Setting Up a Web Server


    maintainer group. No document or script output may be served unless the maintainer
    has authorized it by explicit mention in one of the index.cache database files.
    The server will not recognize any index.cache file unless it is owned by the maintainer
    specified with the -t option or the group specified with the -T option. Only one
    of -t or -T can be used.


    # Restricted User Serving Privileges


    This permits users on the server host to have and control their own home pages
    and documents, with a number of limitations. They will not be permitted to run
    CGI scripts, filters, or include scripts. Also the server will require that every
    file served (including wrappers and includes) have the same owner as the index.cache
    file that grants it permission to be served. This means users can only serve files
    that they own.


    This configuration is obtained by running with the -E option and the -u option.
    The -E option is similar to the -e option, except that index.cache files owned
    by a trusted user Id or group Id (with the -t or -T option) are exempt from the
    restrictions. The -u option requires that, in order to be served, a file must
    be owned by the owner of the index.cache file that lists it. Trusted users as
    specified with -t or -T are exempt from this restriction also.


    # Other WN Search Features


    There are a number of other WN features that are more fully explained in the documentation:


    +   - Title searches allow the server to provide an HTML form (automatically generated
    or prepared by the maintainer) asking for a regular expression search term. When
    supplied the server will search the index.cache files in /dir and designated subdirectories
    for items whose titles contain a match for the search term. An HTML document with
    a menu of these items is returned.

    - Keyword searches are like title searches except that matches are sought in keywords
    instead of titles. Keywords for HTML documents are automatically obtained from
    headers. For other documents (or HTML documents), they can be manually supplied
    in the index file.'
  merge: -1
  pgno: 373
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 351


    +   - Title/keyword searches combine the two previous methods.

    - Fielded searches for user-supplied fields allows up to 20 additional field values
    associated with a document. These are used for searching purposes in the same
    way that keywords are. This is intended to give some additional keyword like fields,
    for example, document author or document ID number.

    - Context searches allow for full text searches of all text documents in one directory.
    The returned HTML document contains a list of titles of documents containing a
    match, each with a sublist of lines from those documents containing the match.

    - Gep searches are like context searches, except that only a list of anchors pointing
    to files containing a match is returned. There are no lines of context showing
    the match.

    - Line searches are like context searches, except that only one list of all matching
    lines is returned, instead of the matching lines being sublists of list of files
    containing a match. That is, all the items in sublists of a context search are
    concatenated in one large list of lines containing matches.

    - File context and grep searches are just like a context search, except that they
    are limited to a single file. The file grep search returns a text/html document
    containing the lines in the file matching the regular expression.

    - A list searches an HTML document looking for an unordered list of anchors linking
    to WWW objects. The contents of each anchor will be searched for a match to the
    supplied regular expression. The search returns an HTML document containing an
    unordered list of those anchors with a match.

    - Indexed searches are supported in WN by auxiliary modules. Two such modules
    are provided as examples.


