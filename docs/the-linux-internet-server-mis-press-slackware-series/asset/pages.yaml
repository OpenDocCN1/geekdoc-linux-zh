    script. Of course the server must read permission on all the files served, but
    it should not have write permission for any directory or file other than its log
    files. The syslog option for logging is enabled, there is no need for write permission
    on a log file. A good practice is to have all the files in your hierarchy that
    you intend to serve be owned by the maintainer or their creator. They should be
    readable (assuming they are for general consumption) but with restricted write
    permission. The files in your hierarchy should not be owned by the user ID under
    which WN will run.


    WN does not by default the chroot system call to further restrict the files which
    the server can access. Doing so would enhance security at the expense of extra
    work. effect of this is to prevent the server from even internally accessing any
    file that is not in your data directory. If you are especially concerned about
    security, you may wish to run one of the public domain TCP wrappers in conjunction
    with WN which will allow you to use the chroot system call. This can simultaneously
    enhance security for other TCP services like anonymous FTP.


    # Internal Threats


    Whenever untrusted users have accounts on a system, there is risk involved. The
    objective of WN is to ensure that running the server does not increase this risk.
    If the server is wisely managed, I believe this goal can be achieved. Here are
    some guidelines.


    If it is possible, make sure that no untrusted user has write access to any part
    of your WN hierarchy. As already mentioned, an attacker with write access to your
    hierarchy can create an index.cache file that will give access to anything on
    your server that is readable by the user ID under which WN runs. Even worse, she
    can create a shell script and an index.cache file permitting it to be executed,
    or it can be executed with all the permissions of that user ID. A good rule of
    thumb is


    Always assume that everyone with write access to any part of your data hierarchy
    has all the permissions of the user ID under which your server runs!


    This should not be true if you are using some of the command-line options described
    previously, but it is good practice to behave as if it were true.'
  merge: -1
  pgno: 370
- img_proc: true
  md: '# 348 CHAPTER 4: Setting Up a Web Server


    Sometimes it is not possible or desirable to deny write access to your WN hierarchy.
    For example, you may need to allow all users to have a home page in their home
    directory or in some designated place. There are two important things to do in
    this case.


    The first of these is to run the server with the -u option. This has the effect
    of requiring every file served (including wrappers and includes) has the same
    owner as the index.cache file that grants it permission to be served. This means
    that untrusted users can only serve /etc/passwd files that they own. This will
    prevent a user from making his own copy of /etc/passwd and serving that. If the
    -t or -T option is also used, then index.cache files owned by the trusted user
    or trusted group are exempt from this requirement, and they may grant permission
    to serve any file the server can read. For security reasons the server will refuse
    to use an index.cache index.cache file, which is a symbolic link to another file.


    The -e or -E command-line options mentioned previously are also a good idea in
    this case, to prevent any execution of scripts or at least restrict their execution
    to trusted index.cache files.


    You should note that when run in its default configuration there is no way to
    use password authentication to prevent users on your system, who can create index.cache
    files, from gaining access to files you are are serving. They can simply make
    a symbolic link in their part of the hierarchy to the file you want to restrict
    and a index.cache file permitting it to be served. Since the server has access
    to the restricted file, it will serve it if it is listed in an index.cache file.
    This simple threat can be avoided by using the -u option described previously,
    but the number of potential threats is quite large. For example, if the -e or
    -E option is not used, a hostile user could write a CGI script that reads the
    sensitive files and mails them to himself. In general I would strongly advise
    against trying to serve sensitive documents (protected by password or .access
    files) and potentially hostile users on the same server. I would also strongly
    advise against allowing potentially hostile CGI scripts, executed includes, or
    external modules. They can be disallowed through the use of the -E or -e command-line
    options. If they are not disallowed, a CGI script can alter or destroy log files.
    A hostile authorization module could collect user passwords.'
  merge: -1
