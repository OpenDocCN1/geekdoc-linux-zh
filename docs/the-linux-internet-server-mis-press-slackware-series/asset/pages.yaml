- img_proc: true
  md: '# CHAPTER 5: Setting Up Gopher 363


    After the menu files have been created, you must run the mkcache program to produce
    a .cache file. This can be done once for each directory or once in the top data
    directory with the -r option to make all the .cache files for the hierarchy. You
    might want to look at a .cache file to see what it is like.


    # Testing Your Setup


    After compiling and setting up the software, you can test it on a sample directory
    provided with the distribution. To do this, first make a symbolic link in your
    root data directory to the docs directory in the source distribution. The command
    line:


    ```

    ln -s /your/src/dir/docs docs

    ```


    executed in the root directory should do.\Next, place a copy of the file /docs/sample.root.menu
    in your root data directory and name it menu (be sure to save the previous menu
    file if you have created one). Now in your root data directory run the mkcache
    with the command mkcache -r. This will produce some messages, including a warning
    about the file docs/Install, which you can ignore. (To understand the meaning
    of this warning, read the section on structured files later in this chapter.)
    Running mkcache with the -r option should produce two .cache files, one in your
    root directory and one in the docs subdirectory. Now change to the directory docs/images
    and run mkcache again to produce a .cache file here. Using the -r directory didn''t
    take care of this directory because we don''t show it on our menus and it isn''t
    in any menu file. The image in this directory will appear inline in the menu for
    the root directory (if it is viewed with an HTTP client like Netscape Navigator);
    Gopher clients lack the capability to display it and will ignore it.


    Now you are ready to test your server installation on this directory. Try it with
    your favorite Gopher or HTTP client.


    # Troubleshooting


    If things are not working as they should, here are some tips to help you isolate
    the problems.'
