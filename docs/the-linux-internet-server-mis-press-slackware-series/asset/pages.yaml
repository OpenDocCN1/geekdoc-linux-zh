  md: '# 484 CHAPTER 12: Programming, CGI, and Your Web Server


    # A Range of Programming Tools


    So far in this book we''ve spent our time on discussing how your Internet server
    responds to various requests by shipping out files. If a Web browser requests
    a file, then the Apache server sends out the file. If a Gopher client requests
    a Gopher menu, then the Gopher server sends it out. If an FTP client requests
    a file, then the FTP server sends out the file. And if a mail client requests
    mail, then the mail server sends out the mail.


    However, the Apache Web server—as well as the other Web servers that ship as part
    of this book—is capable of much more. Instead of merely sending out a Web document,
    the Apache Web server can take input from a Web browser and then tailor the output,
    running an application or even two along the way. In addition, Web-browser users
    have the option of running an application through a link on a Web page.


    This is implemented on the Apache Web server through the use of the Common Gateway
    Interface, or CGI. Basically, a Web page has a link to a CGI script; the script
    is run, and then the output is sent to the user. The process looks something like
    this:


    +   - A request is made to the Web server from a Web browser.

    - The request is sent to a CGI script.

    - The CGI script processes the request, usually using input from the Web browser.
    This could range from asking for some simple return (like a calculation) or something.

    - The information generated by the CGI script is formatted (usually in the form
    of a Web page, but sometimes in the form of an electronic-mail message) and then
    sent to the requesting Web browser.


    Where would you use CGI scripts? Anywhere where you want some data input from
    a user to be inserted into a database, for example. This could be forms that allow
    people to register for a product or a service. Input could be provided with any
    number of elements: data-entry fields, radio buttons, and the like. If you peruse
    the Internet long enough, you''ll see the wide range of uses for CGI scripts.'
  merge: -1
  pgno: 507
- img_proc: true
  md: '# CHAPTER 12: Programming, CGI, and Your Web Server 485


    In this book, we''re not going to spend a lot of time on each of these programming
    tools. There are reams of books on each of the topics discussed here, and if any
    of the programming tools pique your interest, you''re encouraged to check out
    Appendix A for a list of books that cover these topics. A script created for one
    Web server can be run directly on the Apache Web server or any of the other Web
    servers that are on the accompanying CD-ROM. In addition, there are some example
    scripts in the Apache Web-server directory.


    ![](img/7488e49c99dd1fc906878692fde2ec31_508_0.png)


    # Running Down Your Choices


    Slackware Linux and the Apache Web server contain several tools for creating CGI
    scripts and applications. We''ll introduce them here.


    # Perl


    Perl is a free scripting tool developed by Larry Wall for the UNIX operating system.
    There''s a full Perl implementation with Slackware Linux and the Apache Web server.


    A script created for one environment can be used on any other Web-server environment,
    for the most part. Perl is a rather forgiving programming environment, so that
    small errors in syntax will be ignored or handled by the operating system.


    Perl is probably the most popular programming tool on the Internet. It''s amazingly
    powerful, while at the same time not that difficult to implement. Appendix A contains
    a list of Perl books that should help you implement your own Perl scripts on your
    Web server. In addition, there is an extensive set of online-manual pages that
    accompany Perl in Slackware Linux.


    # Tcl


    The Tool Command Language, or Tcl, is similar to Perl in that it can be used to
    script almost anything. Tcl is a little more idiosyncratic than Perl when it comes
    to syntax, but in all it''s pretty much as easy to learn as Perl. Like Perl, Tcl
    was written for the UNIX operating system and transferred to the Internet environment
    due to the popularity of Web servers that run on the UNIX and Linux operating
    systems.'
  merge: -1
  pgno: 508
- img_proc: true
  md: '# 486 CHAPTER 12: Programming, CGI, and Your Web Server


    Appendix A contains a list of Tcl books that should help you implement your Tcl
    scripts on your Web server. In addition, there is an extensive set of online-manual
    pages that accompany Tcl in Slack Linux.


    # Java


    Java is a glorified scripting language that''s become one of the hotter languages
    on the Internet. It''s definitely worth your attention for use of development
    on a Linux Internet system.


    Karl Asha and crew have done a fine job of porting the Java Development Kit (JDK)
    to Linux. You can find the most recent version in /internet/java on the accompanying
    CD-ROM.


    # Python


    Python is an intriguing programming language that''s been steadily gaining in
    popularity. It''s really a hybrid between a true programming language and a scripting
    language, with object-oriented overtones. There are some tricks to using Python
    on a Web server; the February 1997 Linux Journal (http://www.ssc.com/lj) has an
    excellent introduction to both Python and using Python on an Apache Web server.


    You can find the most recent version in /internet/python on the accompanying CD-ROM.


    # Using Server-Side Includes


    The following information is from Apache Week, which can be found at http://www.apacheweek.com.


    While standard HTML files are fine for storing pages, it is very useful to be
    able to create content dynamically. For example, to add a footer or header to
    all files, or to insert document information such as last modified times automatically.
    This can be done with CGI, but can be complex and requires programming or scripting
    skills. For simple dynamic elements there is an alternative: server-side-includes
    (SSI).


    SSI lets you embed a number of special commands into the HTML page itself. When
    the server reads an SSI document, it looks for these'
  merge: -1
  pgno: 509
- img_proc: true
  md: '# CHAPTER 12: Programming, CGI, and Your Web Server 487


    commands and performs the necessary action. For example, there is an SSI command
    that inserts the document''s last modification time. When the server reads a file
    with this command in, it replaces the command with the appropriate time.


    Apache includes a set of SSI commands based on those found in the NCISA server.
    This is implemented by the includes module (mod_includes). An extension of the
    standard SSI commands is available in the XSSI module, which will be a standard
    part of the Apache distribution from the next release.


    # Telling Apache to Use SSI


    By default, the server does not bother looking in HTML files for the SSI commands.
    This would slow down every access to a HTML file. To use SSI you need to tell
    Apache which documents contain the SSI commands.


    One way to do this is to use a special file extension; .shtml is often used, and
    this can be configured with this directive:


    ```

    AddHandler server-parsed .shtml

    AddType text/html shtml

    ```


    The AddHandler directive tells Apache to treat every .shtml file as one that can
    include SSI commands. The AddType directive makes such that the resulting content
    is marked as HTML so that the browser displays it properly.


    An alternative method of telling the server which files include SSI is to use
    the so-called XBitHack. This involves setting the execute bit on HTML files with
    a content type of text/html (i.e. an extension .html) and with the execute bit
    set will be checked for SSI commands. This directive needs to be turned on with
    the XBitHack directive. (This directive was covered in Chapter 4.)


    For either method, the server also needs to be configured to allow SSIs. This
    is done with the Includes directive, which can be placed in the global access.conf
    or a local .htaccess (although the latter must first be enabled with AllowOverride
    Options). Since some SSI commands let the use execute programs which could be
    a security risk,'
  merge: -1
  pgno: 510
- img_proc: true
  md: '# 488 CHAPTER 12: Programming, CGI, and Your Web Server


    an alternative option, IncludesNoExec, lets SSI commands work except for any which
    would execute a program.


    # SSI Commands


    All SSI commands are stored within the HTML in HTML comments. A typical SSI command
    looks like this:


    ```

    <!--#lastmod file="this.html" -->

    ```


    In this case the command is lastmod, which means output the last modified time
    of the file given. The arguments specify the file this.html (which might be the
    name of the file containing this command). The whole of the command text, including
    the comment marker <— and—>, will be replaced with the result of this command.


    In general, all commands take the format:


    ```

    <!--#command arg1="value1" arg2="value2" ... -->

    ```


    where arg1, arg2, and so on are the names of the arguments, and value1, value2,
    and so on are the values of these arguments. In the lastmod example, the argument
    is file and it''s value is this.html. Often commands can take different argument
    names. For example, lastmod can be given a URL with the argument virtual, to get
    the last modified time from the server. For example:


    ```

    <!--#lastmod virtual="/" -->

    ```


    to get the last modification of the home page on the server (this is useful if
    the page being accessed might have a different filename, for instance).


    Besides lastmod, there are SSI commands that get the size of a file or URL (passed
    in the server), the contents of another file or URL, or the result of running
    a local file. These are documented in the NCSA tutorial on server-side includes,
    as well as the XSSI documentation.'
  merge: -1
  pgno: 511
- img_proc: true
  md: '# CHAPTER 12: Programming, CGI, and Your Web Server 489


    When SSI commands are executed, a number of environment variables are set. This
    include the CGI variables (REMOTE_HOST, etc.), and some more, such as DOCUMENT_NAME
    and LAST_MODIFIED. These can be put out with the echo command (so a better way
    of getting the last modification time of the current file would be <!-#echo var="LAST_MODIFIED"->).


    # Extended SSI (XSSI)


    The optional XSSI Apache module extends the server-side includes with:


    +   * Variables in commands: XSSI allows variables to be used in any SSI commands.
    For example, the last modification time of the current document could be obtained
    with <!-#lastmod file="$DOCUMENT_NAME">.

    * Setting variables: the set command must be used within the SSI to set variables.

    * Conditionals: SSI commands if, else, elif, and endif can be used to include
    parts of the file based on conditional tests. For example, the $HTTP_USER_AGENT
    variable could be tested to see the type of browser and different HTML codes output
    depending on the browser capabilities.


    To use XSSI, copy the file from the accompanying CD-ROM (in /internet directory),
    extract the files from the archive and follow the instructions in the INSTALL
    file.


    # Examples


    Here are some examples of using SSI (the final one assumes you are using the XSSI
    module).


    # Displaying Document Information


    The following code puts the document modification time on the page:


    ```

    Last modified: <-#echo var="LAST_MODIFIED" ->

    ```'
  merge: -1
  pgno: 512
- img_proc: true
  md: '# CHAPTER 12: Programming, CGI, and Your Web Server


    # Adding a Footer to Many Documents


    This adds the following text to the bottom of each of the documents:


    ```

    <#include file="footer.html" ->

    ```


    # Hide Links from External Users

    Using the command and if the REMOTE_ADDR CGI variable to see if the user is in
    the local domain is done with the following:


    ```

    <#if exp="$REMOTE_ADDR != /\^1.2\.3.*/" ->

    <a href="internal-documents.html">Internal Documents</a>

    <#endif ->

    ```


    where 1.2.3 is the IP address prefix of the local domain.


    # Summary


    The Apache Web server that ships with Slackware Linux contains a number of programming
    tools that allow you to create your own applications or scripts. These tools include
    Perl and Tcl.

    In the next chapter, you''ll learn about security.'
  merge: -1
