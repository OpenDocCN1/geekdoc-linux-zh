  pgno: 308
- img_proc: true
  md: '# 286 CHAPTER 4: Setting Up a Web Server


    The document is parsed as an HTML document, with special commands embedded as
    SGML comments. A command has the syntax:


    ```

    <!#element attribute=value attribute=value ... ->

    ```


    The value will often be enclosed in quotation marks; many commands only allow
    a single attribute-value pair. The allowed elements follow:


    +   - config (This command controls various aspects of the parsing; the valid
    attributes are errmsg for error messages, sizefmt for setting the format when
    displaying the size of a file, and timefmt, which is a string used by the strftime(3)
    library routine when printing dates.)

    - echo (This command prints one of the include variables; var is the name of the
    variable to print.)

    - exec (This command executes a given shell command or CGI script. IncludesNOEXEC
    option disables this command completely, and the valid attributes are cgi for
    CGI scripts and cmd for server commands.)

    - fsize (This command prints the size of the specified file, subject to the sizefmt
    format specification. It has these potential attributes: file for a relative file
    path and virtual for URL paths.)

    - fastmod (This command prints the last modification date of the specified file,
    subject to the timefmt format specification, with the same attributes as the fsize
    command.)

    - include (This command inserts the text of another document or file into the
    parsed file. Any included file is subject to the usual access control, and if
    the directory containing the parsed file has the Option IncludesNOEXEC set and
    including the document would cause a program to be executed, then it will not
    be included, preventing the execution of cgi scripts.)


    An attribute defines the location of the document; the inclusion is done for each
    attribute given to the include command. The valid attributes are file (the value
    is a path relative to the directory containing the current document being parsed)
    and virtual (a URL relative to the current document being parsed).'
  merge: -1
  pgno: 309
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 287


    There are a number of include variables for the echo command and any program invoked
    by the document:


    +   * DATE_GMT (the current date in Greenwich Mean Time)

    * DATE_LOCAL (the current date in the local time zone)

    * DOCUMENT_NAME (the filename, excluding directories, of the document requested
    by the user)

    * DOCUMENT_URL (the %-decoded URL path of the document requested by the user;
    in the case of nested include files, this is not then URL for the current document)

    * LAST_MODIFIED (the last modification date of the document requested by the user)


    There is one directive made possible by this module: XBitHack


    # XBitHack


    | Syntax: | XBitHack status |

    | Default: | XBitHack off |

    | Context: | server config, virtual host, directory, .htaccess |

    | Override: | options |

    | Status: | base |


    The XBitHack directive controls the parsing of ordinary HTML documents. Status
    can have the following values:


    +   * off (There is no special treatment of executable files.)

    * on (Any file that has the user-execute bit set will be treated as a server-parsed
    HTML document.)

    * full (It is like on, except that the group-execute bit is tested. If it''s set,
    then set the last-modified date of the returned file to be the last modified time
    of the file, and if it''s not set, then no last-modified date is sent. Setting
    this allows clients and proxies to cache the result of the request.)'
