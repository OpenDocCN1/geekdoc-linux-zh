  md: '# CHAPTER 3: Installing Linux and Internet Components


    # Choosing the Disk Sets to Install


    Now comes the fun part—choosing the software you want to install.


    True to its roots as a diskette-based operating system, Linux divides software
    into disk sets. Each disk set uniquely names and corresponds to a specific part
    of the operating system. For instance, the A series contains the core of Linux,
    and its installation is mandatory.

    The setup program divides disk sets and the software into mandatory and optional
    installations. Some of the elements of Linux, such as the aforementioned A series,
    are mandatory. Other installations, such as terminal packages, are optional. During
    the installation process, Linux will automatically install the mandatory packages,
    while prompting you before installing the optional packages.


    There is a way to override this, as will be explained later in this section.


    ![](img/7488e49c99dd1fc906878692fde2ec31_97_0.png)


    During the initial menu entitled Series Selection, you''ll be presented with a
    list of the disk sets as well as a short explanation of what is contained on the
    disk sets (Table 3.6). Generally speaking, you won''t want to install all the
    disk sets, as there are some disk sets that overlap, and their coexistence on
    the hard drive is not wise (particularly when it comes to development tools).
    In addition, you don''t want to waste the hard-disk space needed needed for a
    full installation—will you really need three or four text editors as well as multiple
    text-formatting packages and a slew of fonts? Accordingly, choose the software
    you think you''re likely to use. You can always run the setup program again and
    install additional disk sets again in the future.


    Technically speaking, all that''s needed for a minimal installation of Linux is
    the A disk set.


    ![](img/7488e49c99dd1fc906878692fde2ec31_97_1.png)'
