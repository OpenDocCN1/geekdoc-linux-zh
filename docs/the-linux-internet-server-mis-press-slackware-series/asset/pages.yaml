    The domain name is then part of the InterNIC database, which is the official repository
    of domain names.


    > What to do if your preferred domain name is already taken? It depends. In early
    days of the Internet, there was a mad rush to claim common company names for domain
    names. Back then, you didn''t need to provide a link between your domain name
    and what you wanted to do, so many entrepreneurs registered common names and then
    held ransom.


    As the Internet grew, it became apparent that this system wouldn''t work, as it
    basically denied the existence of trademark law—why should the Internet be immune
    to trademark protections? The current InterNIC policy is to award the domain name
    to reserve the right to withdraw permission if the holder of a trademark name
    comes forward with proof of the trademark. If you registered the domain name of
    burger.com and the real Burger King corporation came to register the same domain
    name, you''d be asked to give it up. As the InterNIC registration page says:


    NSI has the resources nor the legal obligation to screen requested domain names
    to determine whether the use of a domain ani by an applicant may infringe upon
    the right(s) of a third party. As a result, the InterNIC requires that as part
    of the application process, the applicant must represent and warrant several conditions
    related to the name.


