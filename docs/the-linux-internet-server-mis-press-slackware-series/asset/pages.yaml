  md: '# CHAPTER 3: Installing Linux and Internet Components


    If the X Window System fails to launch, pay close attention to the messages displayed.
    X error messages are usually pretty good at describing what went wrong. In most
    cases, you''re probably dealing with a misaligned mouse connection (when the X
    server can''t connect to the mouse, the entire server is shut down) or the window
    server for your graphics card.


    In the case of the latter, you might run into a situation where you get a fuzzy
    or frozen X display and there''s no response to any keyboard input. To get out
    of X and back to a command-line interface, you''ll want to use the Ctrl-Alt-Backspace
    combination to quit X.


    There are many things to learn about the X Window System. However, the focus in
    this book isn''t to work with X (since there''s very little to do with X, unless
    you''re editing HTML files), so we''ll leave a discussion of X for later in this
    book. You can also look through Appendix A for a listing of other Linux titles
    that cover X in more detail.


    # Stopping X


    When you want to shut down the X Window System, just quit the window manager.
    You''ll be presented with a command line.


    # Setting Up an Internet Connection and Networking


    In Chapters 1 and 2, you learned about the specific ways you can connect to the
    Internet. At this point we''ll assume that you have worked out the details (like
    having a connection method established and an IP address assigned) of the connection.


    Now comes the dredge work of the operation: Actually setting up your Internet
    connection. Before we guide you through this maze, we should explain a little
    about networking and the Internet. If you''re already conversant with networking,
    you can skip ahead to the next section.'
  merge: -1
  pgno: 173
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components


    # Deep Background on Networking


    The Internet, for all the hype and glory, is little more than a giant network
    that reaches the corners of the earth. Conceptually, the Internet really isn''t
    that much different from a small network that you might be using in your office.
    Your small network uses network cards and cables to speak to the other computers
    on the network. When a Linux PC wants to communicate with another computer, it
    goes through the network card, which then sends the request via the network cabling.
    Each PC is configured to know exactly where to make the requests.


    The same things are true of the Internet; the differences are in scale, not on
    theory. When you''re connected to the Internet, you''re using network cards and/or
    mods to connect to the larger network. When you want to communicate with another
    computer (perhaps a remote Web server or a news server), you send a request via
    your network card to the Internet, where the request is then routed to the correct
    remote computer. Your request is answered, and the results are sent back to you.


    This all seems very simple—and conceptually, it is. However, there''s a lot going
    on under the surface in this process. The whole thing is made possible because
    the Internet world has agreed to a set of standards. These standards are embodied
    in Transmission Control Protocol/Internet Protocol. Within TCP/IP there are a
    defined set of services. For your computer to talk to other computers on the Internet,
    it must adhere to TCP/IP and its services.


    The Internet was built around TCP/IP as well as the UNIX operating system. TCP/IP
    was the networking, protocol that UNIX used, and when the Internet took off, so
    did TCP/IP. Being a UNIXwelike (though, technically, not a clone), Linux also
    has TCP/IP networking built directly into the operating system. And, since TCP/IP
    defines its services, so does Linux. You can read through the services in the
    file /etc/services (as follows):'
