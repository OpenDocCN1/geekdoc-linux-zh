- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    When placed into an .htaccess file or a <Directory> or <Location> section, this
    directive forces all matching files to be served as the content type given by
    media type. For example, if you had a directory of GIF files but did not want
    to label them all with .gif, you might want to use:


    ```

    ForceType image/gif

    ```


    This will override any filename extensions.


    # SetHandler


    +   * Syntax: <SetHandler handler-name>

    * Context: directory, .htaccess

    * Status: base


    When placed into an .htaccess file or a <Directory> or <Location> section, this
    directive forces all matching files to be parsed through the handler given by
    handler-name. For example, if you had a directory you wanted to be parsed entirely
    as imagemap rule files, regardless of extension, you might put the following into
    an .htaccess file in that directory:


    ```

    SetHandler imap-file

    ```


    Here is another example. If you wanted to have the server display a status report
    whenever a URL of http://servername/status was called, you might put the following
    into access.conf.


    ```

    <Location /status>

    SetHandler server-status

    </Location>

    ```


    # TypesConfig


    +   * Syntax: TypesConfig filename

    * Default: TypesConfig conf/mime.types

    * Context: server config

    * Status: base'
