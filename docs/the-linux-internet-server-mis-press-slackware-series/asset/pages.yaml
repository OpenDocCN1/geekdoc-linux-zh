    For the most part, this information is generated by an electronic-mail package,
    not the mail server.


    Electronic mail is independent of operating systems. Any electronicmail client
    (any that conforms to Internet specifications, that is) connect to any Internet
    mail server, provided that the client has an account on the server. Because of
    this, we won''t spend time on the clients; we''ll just look at the servers.


    Mail is sent to the server via the Simple Mail Transfer Protocol, or SMTP. (For
    those of you inspect, check out RFC-788 and RFC-821.) Mail is usually sent to
    the client to the server via the Post Office Protocol, or POP. Newer mail servers
    make use of the Internet Mail Access Protocol, or IMAP.'
