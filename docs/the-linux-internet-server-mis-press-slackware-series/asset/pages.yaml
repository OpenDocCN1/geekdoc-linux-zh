  md: '178 CHAPTER 4: Setting Up a Web Server


    # ServerType


    ServerType standalone refers to whether the server runs in standalone mode (where
    the server responds directly to incoming Web requests) or in inetd mode, where
    the Web server responds to the inetd daemon, which is essentially a clearinghouse
    for incoming Internet server requests. If you run in inetd mode, then the command
    to launch the server will be automatically inserted into the /etc/inetd.conf file
    after the httpd daemon is launched for the first time. When running httpd in standalone
    mode (the default), the command to launch this daemon every time Linux boots is
    inserted in the startup file (usually /etc/rc.local or /etc/rc3.d). You''ll have
    better performance if you leave the server in standalone mode, since inetd mode
    means that a new server will just need to start from scratch every time there''s
    a request, while standalone mode just handles all the incoming requests on its
    own. In fact, if you expect a lot of traffic, you''ll be forced to run in standalone
    mode unless you want a lot of angry users complaining about Web requests that
    get timed out. However, an httpd daemon executed in inetd mode will be less vulnerable
    to attacks from the outside world.


    # Port


    Port 80 refers to the port the server listens to. The number 80 is the default,
    but this number can be any number between 0 and 65535. Linux (as well as UNIX
    in general) defines a number of ports (actually, all ports numbered below 1024)
    as being reserved for specific purposes (there''s a list of these in /etc/services,
    a list that you first encountered in Chapter 3). In most circumstances, you''ll
    want to leave the port as 80, since this seems to be the default in the Web-server
    world.


    This port setting has one side effect that you''ll want to note if security is
    an issue: Because of the low number, you must start the server logged in root.
    After binding to the port and before accepting requests, Apache will change to
    a low privileged user as set by the User directive. If you run the server as root
    while handling connections, your site may be open to a major security attack.


    However, you can use any unused port for the Web server. If you allow users other
    than root to launch the httpd daemon, then they must use a port higher than 1023
    (8080 is a popular alternative).'
  merge: -1
  pgno: 201
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server 179


    # Users and Groups


    When you launch the Web server, it must have permissions to access files on the
    filesystem and have something to change to root, since generally speaking it''s
    not a good idea to have the Web server run as root for security reasons (if someone
    brings down the Web server, they could have access to your entire filesystem).
    Therefore, you need to assign it a username and groupname for permissions. The
    default is User nobody and Group #1.


    # ServerAdmin


    Admin you@your.address is the mail address of the server administrator, and this
    is also the address returned by the error messages to users. Many Webmasters set
    up a dedicated e-mail account (such as webmaster@largecorp.com) to handle these
    situations, because many users send vague messages and don''t mention that they''re
    complaining specifically about the Web server, as opposed to the Gopher server
    or mail server. The you@your.address portion needs to be changed before the Web
    server can launch.


    # ServerRoot


    Root /usr/lib/httpd refers to the directory containing the httpd support files.
    In the configuration files, this is an incorrect location for the Slack Linux
    installation; it''s the file location for the default Apache Web-server installation,
    not the one that''s part of the general Slack installation. You''ll want to change
    this to /var/lib/httpd (assuming you made no changes to Apache file locations).
    This needs to be changed before the Apache Web server will launch under Linux.


    Also, the Slack Linux distribution also changes the location of the conf and logs
    directories. In a typical Apache installation, these directories would reside
    in /usr/lib/httpd; instead, these directories reside in /var/lib/httpd.


    # BindAddress


    BindAddress * is used to specify IP addresses to listen to for HTTP requests.
    When this setting is a wildcard (*), then the server will listen'
  merge: -1
  pgno: 202
- img_proc: true
  md: 'for connections to every IP address or a Internet domain name. You can change
    this to a specific IP address. This option can be used as an alternative method
    for supporting virtual hosts instead of using VirtualHost sections (covered later
    in this chapter).


    # ErrorLog


    ErrorLog logs/error_log lists the location of the error logs, which can be very
    handy in finding out problems that users might encounter. The location listed
    here is actually prepended to the ServerRoot value (if there were a leading slash
    [/], then it would be an absolute pathname); the actual file location is /var/lib/httpd/logs/error_log.
    You could comment out this line, but the documentation (curiously enough) recommends
    using the following entry to turn off error logging:


    ```

    ErrorLog /dev/null

    ```


    # TransferLog


    TransferLog logs/access_log lists the location of the transfer log, which tells
    you what''s being grabbed from your Web server. The location listed here is actually
    prepended to the ServerRoot value; the actual file location is /var/lib/httpd/logs/access_log.


    # PidFile


    PidFile logs/httpd.pid lists the location of the PID file, which is where the
    server records the process ID of the http daemon. The location listed here is
    actually prepended to the ServerRoot value (if there were a leading slash [/],
    then it would be an absolute pathname); the actual file location is /var/lib/httpd/logs/httpd.pid.
    If you''re running the Web server in inet mode, then there will be no PidFile.


    Why would this possibly be useful? You may want to make changes to configuration
    or log files and want to take the server down. The easiest way to do so is to
    send a SIGHUP signal (or kill -1) to the process ID listed in the PidFile.'
  merge: -1
