    # Booting Linux from DOS Using Loadlin


    Loadlin is a handy utility for Linux users that also run MS-DOS or Windows 95.
    Using Loadlin, you can start Linux from a DOS prompt or set up an icon in Windows
    95 that allows you to switch to Linux. Loadlin is also probably the safest way
    to launch Linux from your hard drive, since you don''t need to mess with the partition
    table at all—you just DOS normally and then use the LOADLIN.EXE command to start
    Linux when you need it.


    To use Loadlin, you''ll need to install it on your DOS drive. To do this, you''ll
    need to use an unzip program, such as UNZIP.EXE or PKUNZIP.EXE. Assuming your
    Slackware CD is on drive E: and you want to put Loadlin on drive C:, unzip the
    file like this:


    ```

    C:\UNZIP -d E:\KERNELS\LOADLIN6.ZIP

    ```


    The -d flag tells command to preserve the directory structure found in the zip
    archive—this will create a C:\LOADLIN directory on your machine containing a number
    of files.


    The next step is to pick an appropriate kernel from a subdirectory under \KERNELS
    on the CD-ROM. The \BOOTDSKS.144\WHICH.ONE document might be helpful in making
    your selection. The actual kernel file will be named ZIMAGE or BZIMAGE—this is
    what you need to copy into your C:\LOADLIN directory.


    For this example, we''ll use the kernel in the E:\KERNELS\BARE.I directory:'
