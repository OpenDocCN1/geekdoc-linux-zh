    .glimpse_exclude file. If you use /ftp/core, and /ftp/pub/cdrom in glimpse_exclude,
    every file that matches that string will be excluded, meaning all files below
    it. You can use * to indicate the beginning of a file and $ to indicate the end
    of one, and you can use * in the usual way. For example, /*/html will include
    /ftp/foo.html, but will also exclude /home/ftp/pub/whatever; if you want to exclude
    files that start with /ftp and end with html use ^*. Notice that putting a * at
    the beginning or at the end is redundant (in fact, in this case glimpseindex will
    remove it when it does the indexing). No other meta characters are allowed in
    .glimpse_exclude (in other words, don''t use .., #, or j). Lines with ? must have
    no more than 30 characters. Notice that, although the index itself will not be
    indexed, the list of filenames (.glimpse_filenames) will be indexed unless it
    is explicitly listed in .glimpse_exclude. |

    | .glimpse_filters | is described in Table 6.2 for the -z option |


