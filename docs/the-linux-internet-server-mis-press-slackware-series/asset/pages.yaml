- img_proc: true
  md: '# CHAPTER 5: Setting Up Gopher


    First, if the compilation of gn failed and produced an error message like:


    ld: Undefined symbol

    _putenv


    it means that the C programming libraries on your system do not contain the function
    _putenv()... For four functions, which seem to be less common than that they should
    be, versions have been supplied. They are putenv(), strncmp(), str(), and time().
    To use them, you will need to edit config.h and uncomment the line #define NEED_PUTENV,
    for example. If the compilation was successful, you can check the server itself
    by executing it from the command line. If you use the command gn /full/path/of/root/dir,
    it should run and pause for input. Type a return in response, and gn should print
    the gopher protocol lines of your top-level.cache file and exit. If instead you
    type the selector for a file (i.e., the contents of the Path= line in the menu,
    /dir/filename), then gn will display the contents of that file and exit.


    If this doesn''t happen, there should be an error message that might be helpful.
    Error messages will be placed in the log file so you may want to run gn again
    with the additional arguments -L logfile and then examine the contents of the
    log file. If you run gn -L /dev/tty, the log entries will be printed to your screen
    instead of being put in a file. If it can''t open a file, for example, the name
    of that file will be recorded in the log file. Check its permissions. Remember
    that all files that gn serves must be read-readable.


    A second useful test is to telnet to your server at port 70. You should get a
    connection message and a pause for input. If you get a Connection refused message,
    it is likely that there is a problem with your inetd setup or for some reason
    your system can''t find or execute the gn binary.


    If your image.gif won''t display, you probably forgot that image.gif must be in
    a menu file and the .cache file produced from it. Just putting a line like:


    ```

    <img src="images/picture.gif">

    ```


    in a file is not sufficient. For security reasons the server won''t serve anything
    in a .cache file. You must have,your images in menu files.'
