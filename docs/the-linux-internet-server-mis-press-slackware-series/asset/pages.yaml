    # Mod_auth_msql Module


    This module is contained in the mod_auth_msql.c file and is compiled by default.
    It allows access control using the public domain mSQL database (ftp://ftp.bond.edu.au/pub/Minerva/msql),
    a fast but limited mSQL engine that can be contacted over an internal UNIX domain
    protocol as well as over normal TCP/IP socket communication.


    There are a number of tokens available via this module.


    ```

    Auth_MSQLHost < FQDN | IP Address | localhost >

    ```


    This is the hostname of the machine running the mSQL demon. The effective uid
    of the server should be allowed access. If not given or it is the magic name localhost,
    it is passed to the mSQL library as a NULL pointer. This effectively forces it
    to use /dev/msql rather than the (slower) socket communication.


    ```

    Auth_MSQLdatabase < mSQL database name >

    ```


    This is the name of the database where the following table(s) are contained. Use
    the mSQL command relshow [<hostname> dbase] to verify the spelling of the database
    name.


    ```

    Auth_MSQLwd_table < mSQL table name >

    ```'
