  md: '# CHAPTER 4: Setting Up a Web Server


    The entries in these tables are:


    +   - The name of the command

    - The function that handles it

    - A (void *) pointer, which is passed in the cmd_parms structure to the command
    handler—this is useful in cases where many similar commands are handled by the
    same function.

    - A bit mask indicating where the command may appear—there are mask bits corresponding
    to each AllowOverride option and an additional mask bit, RSRC_CONF, indicating
    that the command may appear in the server''s own conf files, but not in any .htaccess
    file.

    - A flag indicating how many arguments the command handler wants prepared and
    how they should be passed in


    TAKE2 indicates two preparsed arguments. Other options are TAKE1, which indicates
    one preparsed argument; FLAG, which indicates that the argument should be On or
    Off and is passed in as a boolean flag; RAW_ARGS, which causes the server to give
    the raw, unparsed arguments (everything but the command name itself). There is
    also ITERATE, which means that the handler looks the same as TAKE1, but if multiple
    arguments are present, it should be called multiple times, and finally ITERATE2,
    which indicates that the command handler looks like a TAKE2, but if more arguments
    are present, then it should be called multiple times, holding the first argument
    constant.


    Finally, we have a string that describes the arguments that should be present.
    If the arguments in the actual config file are not as required, this string will
    be used to help give a more specific error message. (You can safely leave it NULL).


