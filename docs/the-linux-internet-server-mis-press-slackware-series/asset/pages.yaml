  md: '# CHAPTER 4: Setting Up a Web Server 255


    only Includes will be set for the /web/docs/spec directory.


    # PidFile


    | Syntax: | PidFile filename |

    | Default: | PidFile logs/httpd.pid |

    | Context: | server config |

    | Status: | core |


    The PidFile directive sets the file where the process ID of the daemon is stored.
    If the filename does not begin with a slash (/), then it is assumed to be relative
    to the ServerRoot. The PidFile is used only in standalone mode.


    It is often useful to be able to send the server a signal, so that it closes and
    then reopens its ErrorLog and TransferLog reread its configuration files. This
    is done by sending a SIGHUP (kill -1) signal to the process ID listed in the PidFile.


    # Port


    | Syntax: | Port num |

    | Default: | Port 80 |

    | Context: | server config |

    | Status: | core |


    The server needs to listen to a network port, which is set with the Port directive.
    Num is a number from 0 to 65535; some port numbers (especially below 1024) are
    reserved for particular protocols. See /etc/services for a list of defined ports;
    the standard port for the HTTP protocol is 80.


    Port 80 is one of UNIX''s special ports. All ports numbered below 1024 are reserved
    for system use, which means that non-root users cannot make use of them; instead,
    they can use higher port numbers.


    To use port 80, you must start the server from the root account. After binding
    to the port and before accepting requests, Apache will change to a low privileged
    user as set by the User directive.'
