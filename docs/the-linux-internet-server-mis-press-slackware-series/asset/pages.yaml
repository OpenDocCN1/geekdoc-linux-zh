  md: 'CHAPTER 6: Indexing with Glimpse and GlimpseHTTP


    Table 6.2 Glimpse Search Options (continued)


    | Option | Purpose |

    | --- | --- |

    | -b | Prints the byte offset (from the beginning of the file) of the end of each
    match. The first character in a file has offset 0. |

    | -B | Best match mode. (Warning: -B sometimes misses matches. It is safer to
    specify the number of errors explicitly) When -B is specified and no exact matches
    are found, glimpse will continue to search until the closest matches (i.e., the
    ones with minimum number of errors are found), at which point the following message
    will be shown: The best match contains x errors, there are y matches, output (y/n).
    This message refers to the number of matches found in the index. There may be
    more matches in the actual text (or there may be none -F is used to filter files).
    When -H, -c, or -l options are specified, the -b option is ignored. In general,
    -B may slower than -H, but not by very much. The index stores only lowercase characters,
    errors of substituting with uppercase may missed. |

    | -c | Displays only the count of matching records. Only files with count > 0
    are displayed. |

    | -C | Tells glimpse to send its queries to webpageserver. |

    | -d ''delim'' | Defines delim to the separator between two records. The default
    value is ''$'', namely record by default. Delim is a string of at most 8 (with
    option of ^ and $), but not a regular expression. Text between two delim, before
    the first and after the last delim, is considered as one record. For example,
    -d''$'' defines paragraphs as records, and -d''\From\'' defines mail messages.
    Glimpse matches each record separately. This does not work with regular expressions.
    The -d option is especially useful for Boolean AND queries, because the patterns
    need to appear in the same line but in the same record. For example, glimpse -F
    mail -d''\From\'' ''\glimpse:arizona:ann\'' will output all messages (in their
    entirety) that have the three patterns anywhere in the message (or the header),
    assuming that ''mail'' is in their content name matches. If you want to output
    a file that matches a Boolean pattern, you can use -0g/xg (or another garbage
    pattern). If the delim doesn''t appear anywhere, the whole file is returned. Warning:
    Use this option with care. If the delim is set to match mail messages, and glimpse
    finds the pattern in a regular file, it will not find the delim and will therefore
    output the wrong file. (The -t option can be used to put the delim at the end
    of the record). agrep (and glimpse) returns to more complex search with the -d
    option is used. The search is slower and the limit of 32 characters is enforced.
    |

    | -Dk | Sets the code of a deletion to k (k is a positive integer). This option
    does not currently work with regular expressions. |

    | -e | Useful when the pattern begins with a dash -. |

    | -E | Prints the lines in the index (as they appear in the index) that match
    the pattern. Used mostly for debugging and maintenance of the index. This is not
    an option that a user needs to know about. |'
