    Table 6.2 lists all of the Glimpse search options.


    # Table 6.2 Glimpse Search Options


    | Option | Purpose |

    |---|---|

    | -# | # is an integer between 1 and 8 specifying the maximum number of errors
    permitted in finding the approximate matches (default is zero). Generally, each
    insertion, deletion, or substitution counts as one error. It is possible to adjust
    the relative cost of insertions, deletions, and substitutions (see -D, and -S
    options). Since the index stores only lowercase characters, errors of substituting
    uppercase with lowercase may be missed. Allowing errors in the match requires
    more time and can slow down the match by a factor of 2-4. Be very careful when
    specifying more than one error, as the number of matches tends to get very quickly.
    |

