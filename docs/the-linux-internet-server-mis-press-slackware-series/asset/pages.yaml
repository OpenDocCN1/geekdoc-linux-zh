    returns a pointer to 8 bytes worth of memory, initialized to foo/bar.


    # Tracking Open Files


    As indicated previously, resource pools are also used to track other sorts

    of resources besides memory. The most common are open files.

    The routine which is typically used for this is pfopen, which takes a resource

    pool and two strings as arguments; the strings are the same as the

    typical arguments to fopen, like the following:


    ```

    ...

    FILE *f = pfopen(r->pool, r->filename, "r");


    if (f == NULL) { ... } else { ... }

    ```


    There is also a pfopen for memory, which parallels the lower-level open

    system call. Both of these routines arrange for the file to be closed when

    t resource pool in question is cleared.


    Unlike the case for memory, there are functions to close files allocated

    with pfopen and pclose, namely pfclose and pclose.(This is because on

    systems the number of files that a single process can have open is

    quite limited.) It is important to use these functions to close files

    allocated with pfopen and popen, since to do otherwise could cause fatal

    errors on systems such as Linux, which react badly if the same FILE*

    more closed than once.


    (Using the close functions is not mandatory, since the file will

    eventually be closed regardless, but you should consider it in cases

    where your module is opening, or could open, a lot of files).


    # Other Sorts of Resources—Cleanup Functions


    On rare occasions, too-free use of palloc() and the associated primitives

    may result in undesirably profligate resource allocation. You can deal

    with such a case by creating a subpool, allocating within the subpool'
  merge: -1
  pgno: 257
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    rather than the main pool and clearing or destroying the subpool, which releases
    the resources associated with it. (This is really a rare situation; the only case
    in which it comes up in the module set is in the case of listing directories,
    and then only with very large directories. Unnecessary use of the primitives discussed
    here can carry up your code a bit, with very little gain).


    The primitive for creating a subpool is make_sub_pool, which takes another pool
    (the parent pool) as an argument. When the main pool is cleared, the subpool will
    be destroyed. The subpool may also be cleared or destroyed at any time, by calling
    the functions clear_pool and destroy_pool, respectively. (The difference is that
    clear_pool frees resources associated with the pool, while destroy_pool also deallocates
    the pool. In the former case, you can allocate new resources within the pool,
    and clear it again, and so forth; in the latter case, it is simply gone).


    As a final note, subrequests have their own resource pools, which are subpools
    of the resource pool for the main request. The polite way to reclaim the resources
    associated with a subrequest that you have allocated (using the sub_req_lookup...
    functions) is destroy_sub_request, which frees the resource pool. Before calling
    this function, be sure to copy anything that you care about which might be allocated
    in the subrequest''s resource pool into someplace a less volatile for (for instance,
    the filename in its request_rec structure).


    Again, under most circumstances, you shouldn''t feel obliged to call this function;
    only 2 KB of memory or so are allocated for a typical subrequest, and it will
    be freed anyway when the main request pool is cleared. It is only when you are
    allocating many, subrequests for a single main request that you should seriously
    consider the destroy... functions.


    # Configuration, Commands, and the Like


    One of the design goals for this server was to maintain external compatibility
    with the NCSA 1.3 server—that is, to read the same configuration files, to process
    all the directives therein correctly, and in general to be a drop-in replacement
    for NCSA. On the other hand, another design goal was to move as much of the server''s
    functionality into modules that have as little as possible to do with the monolithic
    server core. The only way to reconcile these goals is to move the handling of
    most commands from the central server into the modules.'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# 236 CHAPTER 4: Setting Up a Web Server


    However, just giving the modules command tables is not enough to divorce completely
    from the server core. The server has to remember the commands in order to act
    on them. That involves maintaining data private to the modules, either per-server
    or per-directory. Most things are per-directory, including in particular access
    control and authorization information, but also information on how to determine
    file types from suffixes, which can be modified by AddType and DefaultType directives,
    and so forth. In general, the governing philosophy is that anything that can be
    made configurable by directory should; per-server information is generally used
    in the standard set of modules for information like Aliases and Redirects, which
    come into play before the request is tied to a particular place in the underlying
    file system.


    Another requirement for emulating the NCSA server is being able to handle the
    per-directory configuration files


    Finally, after having served a request involving .htaccess files, That is solved
    the same way it is solved wherever else similar problems come up, by tying these
    structures to the per-transaction resource pool.


