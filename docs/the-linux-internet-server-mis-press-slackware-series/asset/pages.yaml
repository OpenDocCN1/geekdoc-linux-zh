  md: '# SECTION II


    # Setting Up Internet Services


    With your Slackware Linux Internet server set up and ready to roll, it''s time
    to set up the services.


    Chapter 4 covers the most important service of all: a Web server for the World
    Wide Web. Slackware Linux ships with several Web servers, but the most important
    of them all is the Apache Web server, the most popular Web server on the Internet.
    Subsequently, most of the coverage in Chapter 4 concerns the Apache Web server,
    ranging from installation and configuration, to modifying the Apache Web server
    for specific circumstances. Also covered are other Web servers, including Apache-SSL
    and WN.


    Chapter 5 covers Gopher and setting up a Gopher server on your Linux Internet
    server. Although Gopher is considered to be an antiquated service by some, it
    can still be a handy tool for any Internet server. No Gopher server ships by default
    with Slackware Linux, but the accompanying CD-ROM contains GN, a useful and stable
    Gopher server, which is covered in some depth in the chapter.


    Chapter 6 covers Glimpse and Harvest, two tools for indexing the information on
    your Internet server.


    Chapter 7 covers the WU-FTP server, which allows outside users to login a Slackware
    Linux Internet server using the File Transfer Protocol.'
