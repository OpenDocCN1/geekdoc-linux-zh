  md: '# 360 CHAPTER 5: Setting Up Gopher


    It''s distributed under the GNU license, which means that it can be used in both
    nonprofit and commercial situations.


    The following information on GN comes from the GN documentation. GN supports the
    standard text and binary types, including sound and image. Index types include
    programs (or shell scripts) that return virtual directories and also grep-type
    searches. GN runs under inetd as a standalone daemon.


    The gopher/http protocol server supports WAIS index searches. This means you can
    index a collection of files with the index software designed for use with WAIS,
    and the GN server will respond to user queries by providing a menu of those documents
    from your that contain a match for the user-supplied search term. Simple Boolean
    combinations like “horses and cows” or “fox not goose” are supported.


    # Installing the Software


    You''ll need to copy the gn.tar.gz file from the accompanying CD-ROM (it''s stored
    in the /internet directory) and run the following commands on it:


    ```

    uncompress gn.tar.gz

    tar xvf gn.tar.gz

    ```


    This creates the GN source directory hierarchy. The top level of the directory
    created by untaring this file contains four directories: gn, mkcache, waisgn,
    and docs.


    The next step is editing the config.h file in the top-level directory. You should
    enter the host name of the computer on which you plan to run GN and the complete
    pathname of your Gopher data directory. If you want to run it at a port other
    than 70, also edit the DEFAULTPORT entry. You should also specify the complete
    path of the mkcache/gn_mime.types file on your system. You can put this file anywhere
    convenient (and give it any name). This file is used by the mkcache program; see
    the section later on Content-type for an explanation of the function of this file.
    Other customizations are possible but should not be needed.


    Next, edit the Makefile file in the top-level directory. This allows you to specify
    the C compiler used if you wish to use something other than'
  merge: -1
