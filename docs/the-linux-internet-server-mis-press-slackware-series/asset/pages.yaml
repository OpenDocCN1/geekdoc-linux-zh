  md: '# 96 CHAPTER 3: Installing Linux and Internet Components


    You’ll first be asked about the PATH environment variables on your Linux system.
    Unless you’ve made some changes to the system—and on a virgin Linux installation,
    there is absolutely no reason to make changes in the PATH environment variables—you’ll
    leave this setting alone. The x86config script will list a PATH containing /usr/X11R6/bin,
    and that’s what you want.


    The next step is setting up your mouse. You’ll be presented with the following
    list:


    +   1. Microsoft compatible (2-button protocol)

    2. Mouse Systems (3-button protocol)

    3. Bus Mouse

    4. PS/2 Mouse

    5. Logitech Mouse (serial, old type, Logitech protocol)

    6. Logitech MouseMan (Microsoft compatible)

    7. MM Series

    8. MM HitTablet


    Here are some tips on choosing the mouse:


    +   - This menu refers to how the mouse is connected, not the brand name. Newer
    Logitech mouse models are Microsoft compatible, as are most of the new mouse models
    on the market. If you’re using a Microsoft mouse that hooks up to a PS/2 mouse
    port (called an auxiliary port in Linux, although Microsoft uses the term mouse
    port without the modifying PS/2), you should choose PS/2 Mouse. Microsoft compatible
    should be chosen when the mouse is connected to a serial port.

    - Almost all newer mice are Microsoft compatible. Even newer Logitech mouse models
    are Microsoft compatible. If your Logitech mouse doesn’t require any special drivers
    from Logitech to load under Windows or Windows 95 and connects to a serial port,
    then it’s probably Microsoft compatible.

    - Many newer PCs have PS/2 ports for the mouse, but they aren’t labeled as such.
    For instance, Dell PCs have a dedicated mouse port that’s really a PS/2 mouse
    port. Generally speaking, if your newer PC has a “mouse port,” the port is really
    a PS/2 port.


    Select a number and then press Enter.'
  merge: -1
  pgno: 119
- img_proc: true
  md: '# CHAPTER 3: Installing Linux and Internet Components 97


    Many users install a mouse under Linux and then discover that X won''t load due
    to conflicts with the mouse setup in Linux. In this case, the gpm mouse driver
    was installed in the setup routine. This driver is handy when using Linux in terminal
    mode, because many programs (such as Midnight Commander and Seyon) use a mouse.
    This interferes with the X Window System, and you''ll need to disable gpm before
    running X. To see whether you''re running gpm, use the following command line
    in terminal mode:


    ```

    ps | grep gpm

    ```


    If gpm is indeed running, a line will be returned listing it as the PID (process
    ID). Actually, if gpm is indeed running, you will have two lines returned—line
    for gpm and a line for grep gpm. You can ignore the grep line). Use the kill command
    to stop gpm and then launch X to see if this was indeed the problem.


    The X Window System was designed for use with three buttons, but most PC mice
    don''t have three (save most Logitech models; Microsoft models do not). Most users
    will be using a Microsoftcompatible mouse, the next step in the x86config process
    is to ask whether three-button emulation is required (the third mouse button is
    emulated when both mouse buttons are pressed simultaneously):


    Please answer the following question with either ''y'' or ''n''. Do you want to
    enable Emulate3Buttons?


    Your answer isn''t exactly crucial to the performance of an Internet server. Next,
    you''ll need to tell X where the mouse is connected. If you''ve spent any time
    around UNIX, know that all devices are represented by files in the /dev directory.
    You are presented with the following choices:


    +   - /dev/mouse (the standard mouse link, which was created when you installed
    Linux in the setup program)

    - /dev/ttyS0 (serial port 1)

    - /dev/ttyS1 (serial port 2)

    - /dev/ttyS2 (serial port 3)

    - /dev/ttyS3 (serial port 4)

    - /dev/atibm (ATI bus mouse)

    - /dev/logibm (Logitech bus mouse)

    - /dev/inportbm (Microsoft bus mouse)

    - /dev/psaux (PS/2 auxiliary port)'
  merge: -1
