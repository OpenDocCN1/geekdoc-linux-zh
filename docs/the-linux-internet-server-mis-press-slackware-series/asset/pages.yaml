    * Billing information. (The initial registration cost is $100, which covers the
    first two years, and $50 per year after that.)

    * Server name and IP addresses.

    * A short description of your site.


    InterNIC is actually an umbrella organization; the actual registration is handled
    by Network Solutions, Inc. This firm administers domain names in the com, org,
