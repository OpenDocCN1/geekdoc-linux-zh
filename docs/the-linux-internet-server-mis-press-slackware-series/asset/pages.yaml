  md: '# CHAPTER 1:The Internet, Intranets and Slackware Linux


    # One Big, Happy Network


    If you bought this book, you''ve probably already used either the Internet to
    some extent or worked with Linux on a networking level.

    You''ll be able to put this experience to good as well as you chart your way onto
    the Internet or a corporate intranet Linux as your server—or, using Linux to run
    your servers. (Put simply, there is one box and many servers.) This viewpoint
    requires some new orientation on your part. When you map your Internet server
    in your mind, you''re probably using a single box to denote your Internet server.
    However, in reality, there are many different servers that comprise Internet connectivity,
    even though they may reside on the same Linux box.


    Here''s a quick philosophy lesson. Conceptually, Linux shares a lot with UNIX,
    as you might expect. Put simply, UNIX is a series of smaller tools that are combined
    to provide power to users. As such, Linux/UNIX is designed to break larger tasks
    into smaller tasks, each of which can be individually manipulated.


    Coincidentally, the Internet shares the same philosophy with UNIX and Linux. (There''s
    no surprise here—in its early days, the Internet was essentially run on a largish
    UNIX network.) What comprises the Internet—electronic mail, the World Wide Web,
    Usenet newsgroups, Gopher, FTP—can actually be broken down quite easily into smaller
    services, which have their own servers.


    Therefore, if you''re planning to manage your Internet connectivity, you''ll need
    to decide which servers you want to run. There are World Wide Web (HTTP) servers,
    Gopher servers, mail servers, and electronic-mail servers. As Webmaster, you will
    not be administering a single Internet tool, but rather (potentially) a whole
    set of servers. Each server handles some aspect of the Internet. A Web server
    serves Web pages to Web browsers. A Gopher server serves Gopher menus and data
    files to Web browsers and Gopher clients. An electronic-mail server serves electronic
    mail to e-mail clients and Web browsers that can handle mail (such as Netscape
    Navigator). An FTP server serves files via the File Transfer Protocol (FTP). A
    chat server allows multiple users to chat via IRC clients. A news server serves
    Usenet postings to news clients (like Netscape Navigator).'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# CHAPTER I:The Internet, Intranets and Slackware Linux 9


    Sound daunting? It should. On one level, setting up these services can be a pain—less
    so if you are not necessarily responsible for content (like coding your own Web
    pages)—but still a good amount of work, especially when you don''t know anything
    about the service and don''t know what''s available for Linux. And, depending
    on your needs, you may find that your users are best served by mixing and matching
    individual services, using a Web server to route requests to a Gopher server that
    better equipped to handle large databases.


    The good news here is that these individual services are actually pretty simple
    and in of themselves. They''re not going to overwhelm you with your complexity.
    And getting a basic Internet system with a Linux server up and running can be
    a quick process.


    # Detail Work


    If you bought this book expecting to open your Internet site for business immediately
    after skimming through this text, you''ll be disappointed. Like any largish computing
    task, using Linux for an Internet server requires some basic planning. In this
    case, a review of what actually comprises the Internet is in order.


    You might be able to get your arms around the immensity of the Internet by breaking
    it down to its basic components: clients and servers. *Clients*, which include
    Web browsers like Netscape Navigator, ask for data from servers. This data is
    (usually) rendered on the client''s local computer; when a Web page is sent to
    Netscape Navigator, Netscape Navigator takes that and applies local fonts and
    colors to the page. *Servers* are responsible for sending the data to the clients,
    basically sitting there and waiting for a request to come its way. A server is
    also responsible for making sure that the request is valid; if a secure document
    is requested, then the server must make sure that the originator of the request
    has correct authorization to receive the document. Similarly, the server must
    protect sensitive areas of the server (such as program files and protected data
    files) from users who may want to access these area for nefarious purposes.


    If you come from the world of big iron, the notion of client/server should be
    familiar to you. If you''ve spent any time at all working with a'
  merge: -1
