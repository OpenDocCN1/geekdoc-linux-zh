  md: '# 92 CHAPTER 3: Installing Linux and Internet Components


    This shuts down the system immediately.


    > WARNING Don''t just turn off the power to turn off a Linux system. This can
    cause damage to important files.


    An alternative method of shutting down Linux is the old tried-and-true PC Ctrl-Alt-Del
    sequence, which is used to reboot a system. When running Linux, this sequence
    performs the same functions as shutdown -r now. When the PC cycles to reboot,
    simply turn it off. Despite what others may claim, this is a perfectly acceptable
    way to shut down a Linux system.


    # What to Do If Things Go Wrong


    For the most part, installation of Linux from the accompanying CD-ROM is a relatively
    straightforward proposition, and you shouldn''t have many problems in the installation.
    However, there may be some cases when you run into problems when you reboot the
    Linux system after installation. These problems may include:


    +   - You''re told that the system is out of memory. You''ll probably run into
    this problem if you''re operating with 4MB of RAM or less.

    - Your system hangs when you first run Linux. In this situation, you''ll want
    to watch the screen closely for any error messages. Sometimes Linux will be seeking
    a device at a specific address (say, a CD-ROM drive) and instead find a network
    card. In these situations, Linux will hang. You''ll need to tell Linux to look
    for the device at the address on your system, which requires that you send an
    option line to Linux upon bootup. This is a situation that''s covered in the many
    documents we included in the CD-ROM.


