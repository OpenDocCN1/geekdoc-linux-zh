- img_proc: true
  md: '# CHAPTER 8: Setting Up a Mail Server 441


    # put any sendmail aliases in here


    (Remember that any line beginning with # is a comment and isn''t actually acted
    upon.)


    So, if you want to name the user *kevin* as the Webmaster, you would add the following
    line to the `/etc/aliases` file:


    Webmaster: kevin


    You could also name the *root* user as the postmaster:


    postmaster: root


    You can put in as many aliases as you want. After you''re done adding aliases,
    save the file.


    Your next step is to run the **newaliases** command:


    newaliases


    The **newaliases** command runs and tells you how many new aliases were created.


    # Summary


    Slack Linux ships with several electronic-mail tools, including **sendmail** and
    **smail**. In this chapter, we briefly run through **sendmail** and some options
    that you might need to look at, such as aliases.


    In the next chapter, we cover setting up a news server.'
