    # ScriptAlias


    This setting controls where CGI programs are stored; the default is /usr/lib/httpd/cgi-bin/.
    In normal Internet parlance, a call to a CGI program runs along the lines of


    ```

    http://www.kreichard.com/cgi-bin/program

    ```


    Normally you don''t throw CGI programs in the document root for security and access
    reasons. Instead, you install them somewhere else in the filesystem that''s more
    secure. (We''ll learn more about CGI files and such in Chapter 11.)


    If you look at the default Linux Apache installation, you''ll see that there''s
    a directory called cgi-bin in the /var/lib/httpd directory. Inside of it are several
    CGI programs. These can be quite handy, and in Chapter 11 we''ll cover these programs
    as well as additional programs that can make your life easier.


    ScriptAlias and DocumentRoot are the two settings that must be changed or reviewed
    before the Web server is launched. However, you might want to review a number
    of other settings in this file. In the following sections, we will review these
    settings. If you''re impatient to get a server up and running, you can skip ahead
    to the section entitled "Starting Apache."


    # Working with MIME


    The Multipurpose Internet Mail Extensions (MIME) are used by browsers and Web
    servers to dictate the type of file that''s being sent from server to browser.
    The Internet world has standardized on a set of'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# CHAPTER 4: Setting Up a Web Server


    MIME types, and most of them are already built into the Apache Web server, in
    the mime.types files.


    How MIME works is pretty simple. A Web browser will ask a Web server for a file.
    This could be a Web page (with a file extension of .html or .htm), a text file
    (with a file extension of .txt), GIF graphics files (with a file extension of
    .gif), and so on. The Web server needs the request and then adds a Content-Type
    header to the file. When the Web browser receives the file and the header, it
    has enough information to know what to do with the file. For instance, if a Web
    browser received a document with a header that says the file is a Web page (HTML),
    then the browser will display the page. However, if a Web browser received a file
    with a header like:


    Content-type: audio/x-wav


    it will know that the file is a sound file in the WAV format, and depending on
    how the browser is set up, will either play the sound itself or launch an external
    application to play the sound file. In addition, browsers can be set up to save
    compressed files directly to disk; it’s pretty common to set up a browser to save
    all compressed files ending in .zip to disk. In those cases where the browser
    hasn''t been configured to deal with a MIME type, the browser will prompt the
    user for a course of action: view the file with the browser, launch an external
    application, save the file to disk, or cancel the transaction.


    For MIME types to work, a few important things need to be happening online:


    +   - Everyone must use the correct file extension within filenames.

    The MIME format is a fairly "dumb" format, in that it keys off of filenames and
    extensions, rather than the actual content of the files. If someone decided to
    add a .wave extension to all their sound-oriented filenames, the Web server wouldn’t
    know what to do with the resulting files.


    +   - A Web server must be configured to recognize the MIME type. As you can tell
    from the mime.types file listing from earlier in this chapter, almost all popular
    MIME types are listed. As new MIME types are added to the Internet world, it’s
    up to you to add support for them to your Apache Web server.'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'CHAPTER 4: Setting Up a Web Server 193


    # Adding MIME Types


    Contrary to what you might think, the recommended course of action when adding
    MIME types to a server isn''t to add a line to the `mime.types` file. Instead,
    it''s recommended that you use the `AddType` directive to add a line to your `srm.conf`
    file. For instance, to add support for the virtual-reality MIME type, which is
    rapidly becoming more and more popular, you would add the following line to your
    `srm.conf` file:


    ```

    AddType x-world/x-vrml .wrl

    ```


    When a user requests a file ending in `.wrl`, the following header will be sent
    along with the file:


    ```

    Content-type x-world/x-vrml

    ```


    The browser will then take that information and either launch an external viewer
    when the file arrives or, as in case with virtual-reality browsers, display with
    file within the browser itself.


    You can also use the `AddType` directive to play games with CGI programs. In the
    old days, it was typical to store all your CGI programs in a single directory
    (`cgi-bin`) and give that directory the proper permissions to execute programs.
    You can get around this by uncommenting the following MIME type in the `srm.conf`
    file:


    ```

    AddType application/x-httpd-cgi .cgi

    ```


    When a browser requests a CGI script from a directory outside of `cgi-bin`, the
    server will then run the application and return its output to the browser, instead
    of sending a Web page. This allows CGI scripts to be executed wherever they''re
    stored.


    If the Apache Web server can''t find an application type, it uses the type specified
    using the `DefaultType` directive. The default setting for this directive is `text/plain`.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# 194 CHAPTER 4: Setting Up a Web Server


    There’s not much else to note regarding the AddType directive. You can add multiple
    file extensions to a MIME type; for instance, the extensions .jpeg, .jpg, and
    .jpe are all specified as relating to the JPEG MIME type. However, you cannot
    have file extensions that are linked to multiple MIME types.


    After you have edited this file with emacs or elvis, go ahead and save the changes
    to disk. The Apache Web server should be ready to run.


    # Starting Apache


    It’s rather easy to launch the daemon. Use the following command line:


    ```

    httpd

    ```


    You don’t need to launch the httpd every time you want to use the Web server;
    it will be launched automatically every time your Linux system is booted.


    When someone connects to your Web server, they’ll be served a file called index.html
    initially if they didn’t specify a URL. When someone connects to http://www.kreichard.com,
    they’ll actually be returned the following URL (which will be what shows up on
    their Web browser’s URL line): http://www.kreichard.com/index.html. The Apache
    installation that ships with Slack contains a dummy index.html page that you’ll
    want to change. (In Chapter 11 we’ll cover creating and editing Web pages, as
    well as where you’ll want to store the Web pages.)


    To see whether the server is running, use the Arena Web browser (which ships as
    part of Slack Linux) to see if you can read the default index.html page used in
    the Web server:


    ```

    arena http://localhost/

    ```


    You could also launch arena with no HTTP address and then use the following URL:


    ```

    http://www.myhost.com

    ```'
