- pgno: 117
  md: '# USING FOR LOOPS


    You can use a For loop to run a block of code a specified number of times. For
    example, you may want to output a set of available font sizes to a ListBox control.
    Instead of doing this manually, you use a For loop to increment through the specified
    range.


    To create a For loop, specify For and follow it with a counter variable. This
    variable stores the current value of the loop as it runs. Place an equal sign
    and follow it by a range of numbers using the To keyword. For example, to loop
    from 1 to 10, you type the line For x = 1 To 10. You can only use the integer
    variable types Short, Integer, and Long for the counter variable, and you must
    declare the variable in the method before using it as the counter.


    By default, a For loop increments by positive ones. You can place the Step keyword
    after the range indication, determining by what number the For loop should count.
    For example, For x = 1 to 9 Step 2 starts at one and increments two at a time
    until it reaches nine.


    You place the necessary code inside of the loop and close it with a Next statement.
    At the point of the Next statement, VB.NET determines whether it needs to loop
    again because the counter has not reached the end state, or exit the loop and
    run the line of code after the Next statement.


    You can use the Exit For statement to break out of a For loop before it completes.
    You may find this useful if an error occurs during the looping process. Keep in
    mind that using this command makes your program harder to understand and harder
    to debug.


    ![](img/d6f772854306e15fb6df39b861a7b541_117_0.png)


    +   1. Create a new project or open an existing one.

    +   2. Create or open the method where you want the loop to execute.

    +   3. Type code to define the counter variable.

    +   4. Type For count = 1 to 10, replacing count with the name of the counter
    variable, 1 with the start point for the counter, and 10 with the end point for
    the counter.

    +   5. Press Enter.'
  merge: -1
  img_proc: true
