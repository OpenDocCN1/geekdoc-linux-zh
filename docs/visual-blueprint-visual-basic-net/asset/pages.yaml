- pgno: 15
  md: '# HOW TO USE THIS BOOK


    Visual Basic .NET: Your visual blueprint for building versatile programs on the
    .NET Framework uses simple, straightforward examples to teach you how to create
    powerful and dynamic programs.


    To get the most out of this book, you should read each chapter in order, from
    beginning to end. Each chapter introduces new ideas and builds on the knowledge
    learned in previous chapters. When you become familiar with Visual Basic .NET:
    Your visual blueprint for building versatile programs on the .NET Framework, you
    can use this book as an informative desktop reference.


    # Who This Book Is For


    If you are interested in writing applications for Windows computers and the Internet
    using the Visual Basic .NET programming environment, Visual Basic .NET: Your visual
    blueprint for building versatile programs on the .NET Framework is the book for
    you.


    This book takes you through the process of installing and using the Development
    Studio, writing advanced Windows Applications, and developing Web applications.
    The book also provides detailed coverage to develop reusable components and package
    your application or component.


    Although this book requires no prior experience with Visual Basic programming,
    a familiarity with the Microsoft Windows operating system installed on your computer,
    and programming languages in general is recommended.


    # What You Need to Use This Book


    To perform the tasks in this book, you need a computer with Microsoft Windows
    NT 4.0, 2000, or XP installed, as well as Microsoft Visual Studio .NET. You do
    not require any special development tools, because all the tools are part of the
    Visual Studio .NET Development Environment.


    # The Conventions in This Book


    A number of typographic and layout styles have been used throughout Visual Basic
    .NET: Your visual blueprint for building versatile programs on the .NET Framework
    to distinguish different types of information.


    Courier Font

    Indicates the use of Visual Basic for Applications (VBA) code such as tags or
    attributes, scripting language code such as statements, operators, or functions,
    and Excel Object Model code such as objects, methods, or properties.


    Bold

    Indicates information that you must type.


    Italics

    Indicates a new term.


    # Apply It


    An Apply It section usually contains a segment of code that takes the lesson you
    just learned one step further. Apply It sections offer inside information and
    pointers that you can use to enhance the functionality of your code.


    # Extra


    An Extra section provides additional information about the task you just accomplished.
    Extra sections often contain interesting tips and useful tricks to make working
    with Excel macros easier and more efficient.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# The Organization of this Book


    Visual Basic .NET: Your visual blueprint for building versatile programs on the
    .NET Framework contains 13 chapters and one appendix.


    The first chapter, "Getting Started with Visual Basic .NET," familiarizes you
    to the features and functions you use throughout the book. You learn how to install
    Visual Studio .NET, how to create a new project, how to save and open project
    files, and how to upgrade Visual Basic 6.0 projects.


    Chapter 2, "Getting Started with Windows Forms," shows you how to build and manage
    the development of a Windows application. This chapter focuses on how to work
    in the Visual Development environment and how to build menus and various windows.


    Chapter 3, "Work with Controls," shows you how to build various types of controls,
    such as buttons, radio buttons, check boxes, list boxes, and toolbars onto your
    Windows forms applications.


    The fourth chapter, "Programming in Visual Basic .NET," shows you how to work
    with the Visual Basic language to declare and use variables, strings, arrays,
    collections, use operators, arguments, conditional blocks, and loops.


    Chapter 5, "Provide Input and Output," shows you how to read and write from files,
    detect changes in the file system, and retrieve file and directory listings. This
    chapter also covers how to add printing and print preview support, and how to
    download information from a network or the Internet. You also learn how to building
    your own server.


    Chapter 6, "Create Graphics and Multimedia," shows you how to add graphics commands
    to your application. This chapter shows you how to draw lines, shapes, and text,
    in various fills and patterns. This chapter shows you how to build a custom shape
    and apply it to the form to make a custom-shaped form of any dimension or shape.


    Chapters 7, "Work with Classes," and 8, "Using Advanced OOP Techniques" illustrate
    how to build and use classes effectively. This includes how to develop a set of
    properties, methods, and events in your classes. It also continues to explore
    more advanced techniques for class development, including inheritance, overloading,
    and using threads.


    The ninth chapter, "Access ADO .NET," introduces you to the ADO .NET database-programming
    tools, and shows you how to build data-bound controls, how to use data grids,
    and how to develop data validation


    Chapter 10, "Using Web Forms," illustrates the development of Web forms server
    applications. The chapter shows you how to use the Web interface designer, and
    how to work with controls and the event model to build applications that run in
    any standard Web browser.


    Chapter 11, "Using Web Services," shows you how to build service applications,
    export functionality from Web services over the Internet, and how to monitor services.


    Chapter 12, "Developing Components," shows you how to build your own components,
    controls, Web controls, and user controls.


    Chapter 13, "Package Your Application," illustrates how to package your application
    to distribute, how to catch and handle errors, and how to provide features for
    disabled users.


    # What''s on the CD-ROM


    The CD-ROM included in this book contains the sample project code from each of
    the two-page lessons throughout the book. This saves you from having to type the
    code and helps you quickly get started creating VB .NET code. The CD-ROM also
    contains several evaluation versions of programs that you can use to work with
    Visual Basic .NET: Your visual blueprint for building versatile programs on the
    .NET Framework. An e-version of the book and all the URLs mentioned in the book
    are also available on the disc.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# AN INTRODUCTION TO VISUAL BASIC .NET


    Visual Basic .NET is part of Microsoft Visual Studio .NET, the latest development
    environment from Microsoft. With Visual Basic .NET, or VB .NET for short, you
    can create powerful Windows and Internet applications using a unified toolkit.
    See the section “Understanding the Framework” for more information on the .NET
    Framework.


    With the release of VB .NET, Visual Basic received advanced language features
    on par with languages like C++, C#, and Java. Powerful new features give VB .NET
    the simplicity of its predecessors, but with the power of creating full-fledged
    applications that take advantage of the computing field’s latest innovations.


    # FEATURES


    # Easy to Use


    The Visual Basic language implements an updated version of the original BASIC
    language, developed in 1964. The focus of the BASIC language was to provide a
    high-level programming language that hid much of a computer’s complexity from
    the developer.


    # Visual Development


    The advent of the Graphical User Interface (GUI) promised easier-to-use computers.
    But developing applications for the GUI environment was more difficult than expected.
    Visual Basic was the first Windows programming language that successfully used
    drag and drop and a powerful integrated development environment (IDE) to enable
    users to develop applications in record time.


    # Automatic Memory Management


    Visual Basic .NET uses a system called garbage collection to manage your application’s
    memory. Garbage collection is an important feature that VB .NET shares with languages
    like C# and Java. Garbage collection does not explicitly require you to delete
    objects from memory. VB .NET finds objects that are no longer referenced and removes
    them from memory automatically when your application is idle.


    Today, the Visual Studio .NET suite shares one IDE that performs an enormous array
    of functions. The IDE design allows it to expand to support various languages
    and toolkits. The integration of languages also means you do not have to learn
    multiple development environments if you work with more than one language.


    # Fully Object-Oriented


    Visual Basic .NET, unlike Visual Basic 6.0 and earlier versions, supports full
    object-oriented programming, with support for polymorphism, true inheritance,
    and interfaces. Full object-oriented programming enables VB .NET to communicate
    and extend other high-level languages such as Visual C# and C#. In fact, because
    of the power of the .NET Framework, Visual Basic .NET can utilize source files
    from another language, inheriting a class created in C# or providing true objects
    for use in C++. For more information on using objects, see Chapter 7.


    # True Web Development


    Visual Basic .NET uses the new ASP.NET objects to create fully compiled server-side
    applications that use the full power of the Visual Basic language and the .NET
    Framework while still interfacing with standard browsers. ASP.NET, combined with
    Visual Basic .NET, provides a unique development system called Web Forms that
    brings the drag-and-drop ease of Visual Basic to Web development.


    # Powerful Database Support


    VB .NET extends the strong support for which the Visual Basic language is known
    when developing high-level, multi-tier database applications. Supporting a new
    version of ADO and ADO.NET, VB .NET can create powerful Web-enabled database applications
    with better performance and more functions than ever before.


    Web Services, possibly one of the most important features of the .NET Framework,
    provides a method of accessing remote objects over the Internet using the SOAP
    standard, which relies on XML. You can store an object on a Web server and enable
    any application to access this object directly over the Internet transparently.
    For example, you can create a Windows application that uses an object stored on
    a centralized Web server the same as you use a component on the local machine.
    Visual Basic .NET takes full advantage of this functionality and creates Web-enabled
    objects.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# DEVELOPMENT SUPPORT


    # Native Windows Applications


    You can use the Windows Forms technology present in VB .NET to develop applications
    that take full advantage of the Windows operating systems. A powerful form designer
    lets you click, drag, and drop your way to a complete Windows interface. See Chapter
    2 to develop Windows applications.


    # Create Windows Services


    Visual Basic .NET can create true Windows services, the software that maintains
    background tasks on a Windows NT, Windows 2000, or Windows XP system. Windows
    includes a number of services that let the system index files on disks for faster
    searching, run Internet servers, and pass messages from application to application.
    Services enable you to easily create servers and utilities that integrate with
    Windows to provide transparent background functions. VB .NET is the first version
    of Visual Basic to support the creation of service applications. See Chapter 11
    to develop your own Windows services.


    # Games and Multimedia Applications


    Visual Basic .NET accesses the same class library as other languages in Visual
    Studio.NET, providing VB .NET access to powerful GDI+ and DirectX functions. The
    .NET Framework Library wraps a complete class library around all Windows drawing
    functions, enabling you to use graphic commands just like other components in
    the Visual Basic .NET system without calling complex system calls. See Chapter
    5 for information on graphics commands.


    # Create Web Applications


    New Web Forms technology in VB .NET lets you create interactive applications that
    run over the Web. These applications run completely on the server using Microsoft
    Internet Information Server (IIS). You can create applications that function with
    any browser and allow Web Forms to maintain variables and state information across
    pages automatically, creating a seamless application development process for you.
    See Chapter 10 to develop Web applications.


    # Database Applications


    Data access has been a strong point of the Visual Basic language since its inception,
    and Visual Basic .NET carries the tradition by providing the most sophisticated
    data access tools to date. You can drag and drop tables onto your forms and point-and-click
    to create automatically connected controls. With Microsoft’s Active Data Objects
    library (ADO.NET), you can access a variety of database systems through one powerful
    environment. You can use standard classes in ADO.NET to easily transport your
    application from Microsoft Access to Microsoft SQL Server to Oracle servers with
    little-to-no change in code. See Chapter 9 to develop database applications.


    # Create Web Services


    Web Services use the power of .NET technologies to export functions across the
    Internet in a secure manner. Any .NET enabled application, whether a Web Forms
    application or a Windows Forms application, can access the Web Service as if it
    is present on the same machine. See Chapter 11 to develop your own Web service.


    # Console Applications


    New to Visual Basic .NET, you can create console applications that run in standard
    text consoles. These console applications let you create utilities that a user
    can access from the command line and create quick programs to test programming
    functions. See Chapter 4 for more information on creating console applications.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# INSTALL VISUAL STUDIO .NET


    The first step in using VB .NET involves installing the Development Studio and
    compilers. The Visual Studio .NET application suite includes Visual C++, Visual
    C#, Visual Basic .NET, an enormous help library courtesy of the Microsoft Developers
    Network (MSDN), and various tools.


    A full installation of Visual Studio .NET recommends 500MB of space on a system
    drive and 2.5GB of space on an application drive. Visual Studio .NET does not
    support Windows 95, Windows 98, or Windows ME operating systems. If you plan to
    use the Web development tools, you can install Visual Studio .NET on Windows 2000
    Server, although Visual Studio .NET can work with remote Windows 2000 servers.
    Visual Studio .NET requires a minimum of 96MB of RAM to install on Windows 2000
    Professional and recommends 128MB. For Windows 2000 Server, Visual Studio .NET
    requires 192MB of RAM and recommends 256MB.


    When you install Visual Studio .NET, you may need to update a number of Windows
    components. The Visual Studio .NET installation prompts you to insert the Windows
    Component Update CD-ROM included in the package, and it updates your system with
    Windows Service Packs and other components. The installation automatically reboots
    during this installation. The installation then asks you to optionally enter log
    in information so it can log in automatically and continue the installation.


    The Visual Studio installation itself spans multiple CD-ROMs or a single DVD,
    but automates most of the installation process. It enables you to select different
    drives for different components of the installation, which helps to lessen the
    extreme disk space requirements. By default, the installation installs all three
    programming languages and runs the help from the CD-ROM. The MSDN help libraries
    are a very important resource, so if you have enough disk space, you can set the
    MSDN help selection to install to disk to make it more readily accessible.


    # INSTALL VISUAL STUDIO


    ![](img/d6f772854306e15fb6df39b861a7b541_19_0.png)


    +   1. Insert Visual Studio Disk 1 into your CD-ROM drive.

    +   2. Click Step 2 to begin installing Visual Studio .NET.


    You can update system components, by clicking Step 1 and follow the directions.

    You can click Step 3 to check for the latest Service Releases.


    +   3. Click I accept the license agreement ○ change to ●.

    +   4. Type a product key.

    +   5. Click Continue.'
  merge: -1
  img_proc: true
