- pgno: 157
  md: '# CREATE A BRUSH


    You use a Brush class to tell VB.NET how to fill an area. Each of the filled primitives,
    such as filled rectangles, requires you use a Brush to specify how to fill the
    area. To produce a Brush for use in VB.NET, create an instance of type Brush using
    the New operator. VB provides a number of Brush classes depending on the style
    you need. Each brush has a particular size. If the shape to fill is larger than
    the brush, the brush tiles to fill the entire space.


    The System.Drawing namespace holds both the SolidBrush and TextureBrush classes.
    The SolidBrush paints an area in a single color. Pass the color for the brush
    as the only parameter. Because these brushes are a solid color, the brush is only
    1 x 1 in size.


    The System.Drawing.Drawing2D namespace contains a number of more complex brushes.
    The HatchBrush


    creates a brush based on a pattern. Windows provides a collection of 2-bit hatch
    patterns. VB.NET provides constants for each of these patterns in the HatchStyle
    enumeration, ranging from BackwardDiagonal to ZigZag. To create the brush, declare
    an instance of the HatchBrush class and pass the constructor the pattern to use,
    followed by the foreground color as the second parameter, and the background color
    as the third parameter.


    LinearGradientBrush fills in a steady range from one color to another, at any
    angle. For the constructor, pass an instance of a Rectangle class filled with
    the size of the gradient brush to create. The next parameter specifies the start
    color and the third parameter specifies the end color. See the section "Understanding
    the Graphics Object" to specify a color. The last parameter is the angle in degrees
    of the gradient. An angle of zero creates a horizontal gradient, and an angle
    of 90 creates a vertical gradient.


    # CREATE A SOLID BRUSH


    +   1. Create a new project or open an existing one.

    +   2. Click the class list and select (Base Class Event) or the control on which
    to draw.


    +   3. Click the method name list and select the Paint event.

    +   4. Type Dim redBrush As New Drawing.SolidBrush(Color.Red), replacing redBrush
    with the name for the brush and Color.Red with the color.


    # CREATE A HATCH BRUSH


    +   5. Type Dim confettiBrush As New Drawing2D.HatchBrush(), replacing confettiBrush
    with the name for the brush.


    +   6. Inside the parentheses, type the hatch pattern to use followed by the foreground
    and background colors, all separated by commas.


    ![](img/d6f772854306e15fb6df39b861a7b541_157_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_157_1.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: "# Extra\n\nIf you need a simple solid-color brush, you may find it time-consuming\
    \ to constantly create custom brush objects. However, you can use a pre-created\
    \ brush to save you the trouble of creating a new instance of a SolidBrush class.\
    \ The System.Drawing.Brushes class provides a set of brushes for each color in\
    \ the standard color list. See the section \"Using the Graphics Object\" for a\
    \ list of common color choices.\n\nIn Windows, the user sets a variety of colors\
    \ in their Desktop preferences, and all Windows applications respond in the same\
    \ way. You may want to draw onto the form, but you need to follow the Windows\
    \ colors the user selects. You can use the SystemBrushes class to fill an area\
    \ in a particular system color. The SystemBrushes class is part of the System.Drawing\
    \ namespace. For example, SystemBrushes.Desktop returns a brush in the color of\
    \ the current user's desktop. You can also retrieve the individual color values\
    \ that each brush relies on using the SystemColors class. You can type SystemBrushes\
    \ members in Help to search for a full list of the available system colors.\n\n\
    ```\nExample:\nDim myPlum As Drawing.SolidBrush =\n    Drawing.Brushes.Plum\n\
    ```\n\n```\nExample:\nDim myControlColor As\n    Drawing.SolidBrush =\n    Drawing.SystemBrushes.Control\n\
    ```\n\n![](img/d6f772854306e15fb6df39b861a7b541_158_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_158_1.png)\n\
