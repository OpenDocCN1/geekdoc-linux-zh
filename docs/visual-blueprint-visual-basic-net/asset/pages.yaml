- pgno: 151
  md: '# ADD A PICTURE TO A FORM


    Many Windows applications use pictures to make a window more attractive and easier
    to understand. You can add a picture to a Windows Form with the PictureBox control.


    The PictureBox control appears in the Windows Forms section of the Toolbox. After
    adding it to the form, you can assign a single picture file to its Image property.
    Use the SizeMode property to determine how the control draws the image. Normal
    makes the PictureBox draw the image in its actual size at the top, left corner
    of the control. For SizeMode equal to StretchImage, the control stretches the
    image to fill the entire control space. AutoSize makes the control size to the
    actual image size. When you set SizeMode to AutoSize, you can no longer resize
    the control. CenterImage draws the image at actual size in the center of the control.


    The PictureBox control also allows you to place a border around the edge. Set
    BorderStyle to FixedSingle to draw a one-pixel black border. Use Fixed3D to draw
    a more traditional 3D sunken border around the control. None removes the borders
    completely. You can also load another image into the control using the standard
    control property BackgroundImage. Because VB.NET does not allow you to align the
    foreground image like many other controls, you may not find this property useful.
    You can use BackgroundImage to draw a frame around an image with SizeMode set
    to CenterImage.


    You can use standard control events with the PictureBox, like Click, MouseDown,
    MouseMove, and others to respond to actions of the user. Use the Paint event to
    draw onto the control. If you need to create an interactive picture control, a
    Button control allows you to use an image and provide interactive cues. For more
    information on the Button control, see Chapter 3.


    # ADD A PICTURE TO A FORM


    ![](img/d6f772854306e15fb6df39b861a7b541_151_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_151_1.png)


    +   1. Create a new Windows Application project or open an existing project and
    create or open the form to load onto the control.


    +   2. In the Toolbox, click the PictureBox control.


    +   3. Drag the control to the form.


    +   4. Edit any necessary properties.


    +   5. In the Properties Window, click the Image property.


    +   6. Click the link button.


    Note: See Chapter 3 to edit properties.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Extra


    When you load an image into a PictureBox control, it saves the image into the
    executable, which can balloon in size unnecessarily in an application where a
    variety of forms may include the same image. To prevent this, you can use a resource
    file to store only a single copy of the file in the executable. You can then load
    the appropriate resource image into the PictureBox control in the Form_Load procedure.
    The ResourceManager class contains the necessary functions to access a resource
    file. For more information on creating a resource file and loading resources into
    it, search Visual Basic .NET help for Resource Editors. Once you connect to a
    resource file, use a line similar to the one below to read the image out and load
    it into a PictureBox.


    # Example:


    ```

    PictureBox1.Image = CType(ResourceManager.GetObject("flag"), System.Drawing.Image)

    ```


    The PictureBox control accepts drawing commands like the Form and many other controls.
    This means the tasks later in the chapter explaining the Graphics object work
    using a PictureBox as well. Just place the code from a Form_Paint routine into
    a PictureBox_Paint routine. The PictureBox contains all the same drawing methods
    and properties.


    ![](img/d6f772854306e15fb6df39b861a7b541_152_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_152_1.png)


    +   The Open dialog box appears.


    +   7 Click an image file from disk.


    +   8 Click Open to load the image into the control.


    +   The example sets SizeMode to CenterImage.


    +   9 Press F5 to run the project.


    +   The PictureBox control displays the picture file appropriately.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# USING THE COLOR DIALOG BOX


    When editing colors in an application or simply changing the colors on your desktop,
    the color common dialog box supplies the standard method of selecting a color.
    You can use the ColorDialog control in your application to provide color selection
    abilities to your user.


    The Toolbox locates the ColorDialog control in the Windows Forms section. When
    you place the control onto a form, it loads into the Component Tray of the form
    because it is a hidden control.


    The most important property for a color dialog box is the Color property because
    it controls the color you display in the box. When the user clicks OK, this property
    stores the selection. If the user presses Cancel, the control does not alter the
    property value.


    The AllowFullOpen property enables or disables the custom color section of the
    dialog where the full color box is available. By setting FullOpen to True, the
    custom color area appears automatically when the dialog box opens.


    The SolidColorOnly property determines whether the dialog selects only solid colors.
    This only affects 256 color or less displays, which must blend multiple colors.
    This blending creates a dotted appearance and makes text reading difficult. If
    you plan to have small to normal size text over the area where the selected color
    is in use, set SolidColorOnly to False. The CustomColors property stores an array
    of the stored custom colors.


    Like other dialogs, use the ShowDialog method of the control to make the dialog
    box appear. The method returns a DialogResult variable indicating either OK or
    Cancel, depending on the button the user clicks. See Chapter 3 for more information
    on dialog boxes and DialogResult constants.


    # USING THE COLOR DIALOG BOX


    ![](img/d6f772854306e15fb6df39b861a7b541_153_0.png)


    +   1 Create a new Windows Application project or open an existing one.

    +   2 In the Toolbox, double-click the ColorDialog item to add it to the form.
    The control opens in the Component Tray.

    +   3 In the Properties Window, change any necessary properties.

    +   4 Double-click the control you want to display the dialog box for.


    Note: See Chapter 3 to edit properties.


    The example sets FullOpen to True.'
  merge: -1
  img_proc: true
