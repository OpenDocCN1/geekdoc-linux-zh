- pgno: 42
  md: '# IMPORTANT FORM MEMBERS (CONT.)


    | PROPERTIES | DESCRIPTION |

    |---|---|

    | MinimumSize | A Point object specifying the minimum width and height the form
    reaches. |

    | Opacity | The percentage of opacity the form has. For example, a 25% opacity
    level means the form blends a quarter of its contents with three-quarters of the
    underlying contents, making the form nearly invisible. |

    | OwnedForms | A collection listing all of the forms this form owns. |

    | Modal | Specifies if this form is modal. The property is read-only. You can
    use this to determine whether this form was invoked as a dialog box. |

    | SizeGripStyle | Determines whether a sizing grip displays in the lower-right
    corner of the window. The default value is Auto. Available options are Show and
    Hide. |

    | StartPosition | You use this to assist in placement of the form upon display.
    Default value is WindowsDefaultLocation. Options include CenterScreen, CenterParent,
    Manual, and WindowsDefaultBounds. |

    | TopMost | Determines whether this form shows above all other forms in the application.
    Default is False. |

    | METHODS | DESCRIPTION |

    | Activate | Moves the form to the front of the application and makes it active.
    |

    | Close | Hides the form. |

    | DoDragDrop | Begins a drag and drop operation. |

    | Show | Makes the form visible. |

    | ShowDialog | Makes the form appear modally. |

    | Update | Forces client area to redraw. |

    | EVENTS | DESCRIPTION |

    | Closed | Fires when the user closes the form or the Close method is called.
    |

    | Closing | Fires as the user presses Close and allows the window to cancel the
    operation before the actual Closed event is called. |

    | MouseEnter | Fires when the mouse enters the client area from outside. |

    | MouseHover | Fires when the mouse is stationary for two seconds. |

    | MouseLeave | Fires when the mouse leaves the client area. |

    | MouseMove | Fires as the mouse moves around inside the client area. |'
