  md: 'maranGraphics is a family-run business located near Toronto, Canada.


    ![](img/d6f772854306e15fb6df39b861a7b541_5_0.png)


    At maranGraphics, we believe in producing great computer books — one book at a
    time.


    maranGraphics has been producing high-technology products for over 25 years, which
    enables us to offer the computer book community a unique communication process.


    Our computer books use an integrated communication process, which is very different
    from the approach used in other computer books. Each spread is, in essence, a
    flow chart — the text and screen shots are totally incorporated into the layout
    of the spread. Introductory text and helpful tips complete the learning experience.


    maranGraphics'' approach encourages the left and right sides of the brain to work
    together — resulting in faster orientation and greater memory retention.


    Above all, we are very proud of the handcrafted nature of our books. Our carefully-chosen
    writers are experts in their fields, and spend countless hours researching and
    organizing the content for each topic. Our artists


    rebuild every screen shot to provide the best clarity possible, making our screen
    shots the most precise and easiest to read in the industry. We strive for perfection,
    and believe that the time spent handcrafting each element results in the best
    computer books money can buy.


    Thank you for purchasing this book. We hope you enjoy it!


    Sincerely,

    Robert Maran

