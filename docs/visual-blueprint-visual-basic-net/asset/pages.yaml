- pgno: 301
  md: '# ADD AN EVENT


    You can add events to your user control that the containing form can catch to
    provide event handlers. You can create custom events that you can raise when necessary.
    For example, a Button control provides the Click event that raises when the user
    clicks a button.


    To define an event, add a standard event definition in the existing UserControl
    class''s declarations. Define the event as Public to allow your control''s container
    to handle the event. You raise the event in the container by calling RaiseEvent.
    For more information on creating events in a class, see Chapter 7.


    Because the UserControl inherits from the Control class, it provides a number
    of events that fire when actions occur on the user control''s surface. For example,
    if the user clicks the UserControl where no control exists, the user control''s
    Click event fires. The UserControl class and the containing form receive this
    event automatically. You can override these events to prevent the container from
    automatically receiving them. See the section "Handle Default Properties" for
    more information. You can also use these events in a control where you draw on
    the surface. See the section "Create a Control from Scratch" for more information.


    The controls you place on the user control fire events that you can handle inside
    the control. If you want to pass back a control''s event, define an event and
    raise it in the event handler of the control''s UserControl. For example, if your
    UserControl uses a ListBox control, you can alert the form when the user selects
    an item in the list. First, create a public event for your user control. Then,
    in the the ListBox''s SelectedIndexChanged event, fire your public event for the
    user control''s container to handle.


    ![](img/d6f772854306e15fb6df39b861a7b541_301_0.png)


    +   1. Open an existing user control.

    +   Note: To create a UserControl, see the section "Create a Windows Forms Control."


    +   2. Double-click the surface of the user control to go to the Code Editor.

    +   3. Define an event as Public for the control.

    +   Note: To define an event, see Chapter 7.


    +   4. Type RaiseEvent in the method or internal event handler where you want
    to raise the event.

    +   The example raises the event in a method called MyMethod.


    +   5. Type the name of the event you defined followed by necessary parameters
    in parentheses.

    +   6. Click Build Build to build the control.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Extra


    You can override the default events the UserControl provides to function as events
    for specific controls you contain in the UserControl. For example, the control
    automatically raises the Click event on the UserControl’s container when the user
    clicks the control’s blank areas. You can add a Button to the user control that
    fires the Click event instead. To do this, you must shadow the existing event
    in the base Control class and then raise your event as necessary. You can disable
    the default Click event on the UserControl as well. For more information, see
    the section “Handle Default Properties.”


    ```

    Example:

    Public Shadows Event Click(ByVal sender As Object, ByVal e As System.EventArgs)


    Private Sub Button1_Click(ByVal sender As System.Object, ByVal e As _

    System.EventArgs) Handles Button1.Click


    '' Raise standard Click event

    RaiseEvent Click(Me, e)


    End Sub

    Protected Overrides Sub OnClick(ByVal e As System.EventArgs)

    '' hide event from parent

    End Sub

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_302_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_302_1.png)


    7 Add the control to a form.

    Note: See Chapter 3 to add a control. See the section "Reference a Library" to
    reference a control in a library.


    8 In the Code Editor for the form, type code to cause the event to fire.


    9 Select your control from the component list.


    10 Select your custom event.


    11 Add code to handle the appropriate event you created.


    12 Press F5 to run your application.


    The user control raises the event when necessary and the form the control resides
    on handles the event.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "# # USING STANDARD CONTROLS\n\nYou can build a custom user control with the\
    \ standard controls available in VB .NET and other custom controls. These composite\
    \ controls function like a single control when you add them to a form, which enables\
    \ you to build a layout with certain reusable controls. You can set properties\
    \ of the controls and they remain constant across various instances of the control\
    \ you create on forms.\n\nYou can use the Windows Control Designer to drag a control\
    \ onto the surface of the UserControl. Note that you cannot access the properties,\
    \ events, and other members of controls you add from outside the UserControl.\
    \ You must decide what members to add to the UserControl to create so that you\
    \ can replicate, modify, or extend the functionality already available in the\
    \ controls.\n\nFor example, your user control may consist of a button that you\
    \ modify with a particular color and font to make a standard appearance for your\
    \ program. But when the user clicks the Button inside the user control, the form\
    \ does not receive the button's Click event. When the user control receives the\
    \ event, and you have the choice of adding an event to your user control to alert\
    \ the form to the event. To alert the form, you need to create an event definition,\
    \ and in the Button_Click event of the user control, raise the defined public\
    \ event of the user control.\n\nKeep in mind that you must give a UserControl\
    \ the ability to resize. You can use the Dock and Anchor properties to make the\
    \ controls you use in the form resize to the size of the user control. For more\
    \ information on using Dock and Anchor, see Chapter 2.\n\n![](img/d6f772854306e15fb6df39b861a7b541_303_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_303_1.png)\n\n+   1. Open an existing\
    \ user control.\n+   \n+   Note: To create a UserControl, see \"Create a Windows\
    \ Forms Control.\"\n+   \n+   2. Click controls in the Toolbox and then click\
    \ and drag the control on the surface of the user control to pick the appropriate\
    \ size and location.\n+   \n+   3. Double-click the surface of the user control.\n\
    +   \n+   4. Add a property to a control on the surface of the user control.\n\
    +   \n+   Note: To add a property to a UserControl, see \"Add a Member.\"\n\n\
    ```\n```vbnet\nPrivate Sub UserControl1_Load(ByVal sender As System.Object, ByVal\
    \ e As System.EventArgs) Handles MyBase.Load\n\nPublic Property ButtonText() As\
    \ String\n\nGet\n\nSet(ByVal Value As String)\n\nEnd Get\n\nSet\n\nEnd Set\n\n\
    End Property\n\nEnd Sub\n```\n```\n\nNote: To add a property to a UserControl,\
    \ see \"Add a Member.\""
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Apply It


    You can use standard controls in your project by directly inheriting from them.
    This provides very specific support for building a control, because you must base
    your control on a single existing control. You can control functions of an inherited
    control by overriding their event methods such as OnPaint. If you want the base
    control to perform its function, call MyBase.OnEvent, where Event is the name
    of the event in the base to invoke. Follow this with the appropriate parameters.
    To use your custom control, place it in a control library and then reference the
    control in a project.


    # TYPE THIS:


    ```

    Public Class CustomControl1

    Inherits System.Windows.Forms.Button

    Public Sub New()

    MyBase.New()

    End Sub

    Protected Overrides Sub OnPaint(ByVal pe As System.Windows.Forms.PaintEventArgs)

    MyBase.OnPaint(pe)

    '' Draw a red border around the edge of a button.

    pe.Graphics.DrawRectangle(Drawing.Pens.Red, pe.ClipRectangle)

    End Sub

    End Class

    ```


    # RESULT:


    The inherited button draws a red border over the standard border of a button.
    All functions perform the same.


    ![](img/d6f772854306e15fb6df39b861a7b541_304_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_304_1.png)


    +   5 Return the property of the control on the UserControl in the Get routine.

    +   6 Set the property of the control on the UserControl in the Set routine.

    +   7 Build the control.


    Note: To work with properties, see Chapter 7.


    Note: To build a project, see Chapter 1.


    +   The control is ready for use.

    +   You can add it to a form, and alter the property of the control embedded in
    the UserControl.


    Note: To add a reference to a control contained in a control library, see the
    section "Reference a Library."'
  merge: -1
  img_proc: true
- pgno: 305
  md: "# # CREATE A CONTROL FROM SCRATCH\n\nTypically you can simply make a customized\
    \ version of an existing control to ease development. But in cases where the standard\
    \ controls do not offer the functionality you want for a control, you can create\
    \ a control completely from scratch. For example, you can create a highly stylized\
    \ button control that a standard control cannot provide.\n\nTo create a control\
    \ from scratch, you must rely heavily on the graphics command layer to draw the\
    \ image of your control on the surface of the UserControl. For more information\
    \ on drawing on a surface using graphics primitives, see Chapter 6.\n\nProviding\
    \ interactivity is essential to the usefulness of your control. The UserControl\
    \ provides a number of properties to monitor mouse and keyboard actions and movement.\
    \ For example, to create a customized button, you may want to draw one style for\
    \ the inactive button, one code to paint the button, and third for the active\
    \ button. Add code to paint the surface of the control in the Paint event handler.\
    \ Make sure the Paint event uses the dimensions specified by the UserControl.\n\
    \nAll of the drawing code in the control should exist in the Paint event. Placing\
    \ painting code for interactivity, such as mouse clicks in the mouse events, can\
    \ cause the control to draw improperly when the control repaints. To avoid this,\
    \ call the Invalidate method the control to fire the Paint event and let the control\
    \ redraw. Make sure to handle the Resize event to enable your control to redraw\
    \ with the new dimensions.\n\nThe UserControl provides the Click event when the\
    \ user clicks its surface, and the MouseDown and MouseUp events for the user pressing\
    \ and releasing the mouse on your control, respectively. You can use KeyPress,\
    \ KeyDown, and KeyUp events to monitor for key presses.\n\n```\n```vb\nPublic\
    \ Class UserControl1\nInherits System.Windows.Forms.UserControl\n\nPrivate disptext\
    \ As String = \"Standard text\"\n\nEnd Class\n```\n```\n\n```\n```vb\nPrivate\
    \ Sub UserControl_MouseUp(ByVal sender As Object, ByVal e As System.EventArgs)\
    \ Handles MyBase.MouseUp\n    pressed = True\nEnd Sub\n\nPrivate Sub UserControl_MouseDown(ByVal\
    \ sender As Object, ByVal e As System.EventArgs) Handles MyBase.MouseDown\n  \
    \  pressed = False\nEnd Sub\n```\n```\n\n+   1. In the Code Editor of an existing\
    \ user control class, add necessary member variables to the control.\n+   \n+\
    \   Note: To create a UserControl, see Chapter 7 to add member variables.\n+ \
    \  \n+   2. Type code to respond to any necessary events raised by the UserControl.\n\
    +   \n+   The example adds code to respond to mouse clicks.\n+   \n+   3. In any\
    \ method that changes the appearance of the control, type Me.Invalidate()."
  merge: -1
  img_proc: true
- pgno: 306
  md: "# DEVELOPING COMPONENTS\n\n# Apply It\n\nYou can provide drawing functions\
    \ that appear like the popup style of the `Button` control. To monitor for the\
    \ user pressing the mouse in the `UserControl`, set a state variable in the `MouseDown`\
    \ event handler and the `MouseUp` event handler when the user lets go of the mouse\
    \ button. You can use the `MouseEnter` and `MouseLeave` event to monitor the user\
    \ entering or exiting the control, which you can use to provide a popup-style\
    \ appearance.\n\n```\nPrivate Enum ButtonState\n    Normal\n    Pressed\n    Hover\n\
    End Enum\nPrivate myState As ButtonState = ButtonState.Normal\n\nPrivate Sub UserControl1_MouseDown(...)\
    \ Handles MyBase.MouseDown\n    myState = ButtonState.Pressed: Me.Invalidate()\n\
    End Sub\nPrivate Sub UserControl1_MouseEnter(...) Handles MyBase.MouseEnter\n\
    \    myState = ButtonState.Hover: Me.Invalidate()\nEnd Sub\nPrivate Sub UserControl1_MouseLeave(...)\
    \ Handles MyBase.MouseLeave\n    myState = ButtonState.Normal: Me.Invalidate()\n\
    End Sub\nPrivate Sub UserControl1_MouseUp(...) Handles MyBase.MouseUp\n    myState\
    \ = ButtonState.Normal: Me.Invalidate()\nEnd Sub\n```\n\n# TYPE THIS:\n\n# RESULT:\n\
    \nThe control responds graphically to the user’s mouse.\n\n![](img/d6f772854306e15fb6df39b861a7b541_306_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_306_1.png)\n\n+   4. Add necessary\
    \ events, properties, and methods to the control.\n\n+   5. Select (Base Class\
    \ Events) in the component list and select the Paint event.\n\n+   6. Type code\
    \ to paint the control.\n\n+   7. Build the control.\n\nThe control draws itself\
    \ and functions like a standard control when you add it to a form.\n\n> Note:\
    \ To add properties and methods, see “Add a Member.” To add events, see “Add an\
    \ Event.” To build a project, see Chapter 1.\n\n> Note: To reference a control\
    \ in a control library, see “Reference a Library.”"
  merge: -1
  img_proc: true
- pgno: 307
  md: '# REFERENCE A LIBRARY


    The Windows Control Library project builds a DLL that contains a set of UserControl
    controls, which you can reuse in your applications. The Class Library project
    also builds a DLL that normally contains components and classes that you can reuse
    across projects. These projects build the same library type. The template only
    varies in the type of component it initially provides when you create the project.


    To use a library in another project, you indicate the compiled DLL library to
    reference in your project. Referencing a component library means that you now
    can access the classes, components, and controls that the library exports. The
    library is not part of your application, however, and you cannot access private
    parts of the library.


    To reference a component or class library in an application, you use the Add Reference
    dialog box. A reference makes all of the classes in the component library available,
    but you cannot use the controls automatically. You must customize the Toolbox
    and select from the library which controls and components you want available in
    the Toolbox.


    Each assembly resides within its own namespace. Therefore, to add a library to
    another application, you must remember your library project''s namespace to access
    the components and controls inside of the library. Unless you change the root
    namespace of the library project, the namespace is the same as the name of the
    project.


    Because the reference you make saves into the assembly of your application, you
    can create a setup project that automatically installs the appropriate component
    library DLL with your application.


    # ADD A REFERENCE


    +   1. Create a new Windows Application project or open an existing one.

    +   2. Right-click the project in the Solution Explorer.

    +   3. Click Add Reference.

    +   4. Click Browse and select the DLL file.

    +   5. Click OK.


    The Add Reference dialog box appears.


    The library project places the built DLL in the bin\ subdirectory of the project
    directory.


    ![](img/d6f772854306e15fb6df39b861a7b541_307_0.png)'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Extra


    The .NET component model does not require components to register with the system
    before you use them in other assemblies. The COM interface, however, does require
    components to register before use. You can register your .NET components with
    COM to provide backwards compatibility for other development environments that
    rely on COM, such as Microsoft Office and ASP applications. To register your library
    DLL, use the regasm.exe utility where the system .NET Framework files install,
    typically C:\WINNT\Microsoft.NET\Framework\v1\ where v is the version of the software
    you are using. Run this utility and pass the path and file name of the .NET DLL
    assembly to register. If you do want to register the file on the current machine,
    pass /regfile: followed by the filename of a registry file to generate. You can
    then import this file on any computer that contains the DLL.


    Example:


    Register a Component

    Regasm.exe MyLibrary.DLL


    Generate a Registry Import File

    Regasm.exe MyLibrary.DLL /regfile:MyLibrary.REG


    ![](img/d6f772854306e15fb6df39b861a7b541_308_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_308_1.png)


    # ADD ICONS TO TOOLBOX


    +   6 Right-click the Toolbox and click Customize Toolbox.

    +   The Customize Toolbox dialog box appears.

    +   7 Click the .NET Framework Components tab.


    +   8 Click Browse and select the DLL from step 4.

    +   9 Check the appropriate controls and components.

    +   10 Click OK.


    +   11 Add controls or components in the Toolbox to the form of the application.


    +   The components load from the library DLL and let you manipulate them like
    other controls and components.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# CREATE A WEB USER CONTROL


    Web user controls enable you to generate a control for use on Web Form applications.
    Like user controls for Windows Forms, you can build a Web control from scratch
    or insert existing server controls to build a new control. You can also convert
    an entire ASP.NET page directly into a Web server control, which you can reuse
    on other pages. Web user controls reside in ASCX files on the server.


    You can add Web user controls to existing Web Form applications or create a project
    that contains a number of server controls for reuse in various controls. For more
    information on Web Control Library projects, see the section "Using Web Control
    Libraries."


    Because Web Forms generate standard HTML code, a server control must generate
    HTML code to export to the Web browser on the client. If you build the control
    out of existing controls, the controls inside your Web server control generate
    the HTML automatically. Web controls function in Flow layout mode only, so you
    add controls adjacent to one another and cannot position the controls precisely.
    You can type text directly onto the surface of the Web user control.


    When you create the control, you can still create methods and properties to modify
    the functions of the control. For more information on adding methods and properties
    to the Web control, see the section "Add a Member."


    All code runs on the server, not the client, so changed properties do not update
    until a post-back event occurs. If you add a post-back control, such as a Button
    to your UserControl, a post-back occurs on the page, and events fire in your control.
    Non-post-back events raise when the next post-back event occurs.


    # CREATE A WEB USER CONTROL


    ![](img/d6f772854306e15fb6df39b861a7b541_309_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_309_1.png)


    1 Create a new Web Application or Web Control Library project or open an existing
    one.


    2 Click Project → Add Web User Control.


    3 Type a name for the new control.


    4 Click Open.


    Note: To create a Web Control Library, see "Using Web Control Libraries."'
  merge: -1
  img_proc: true
- pgno: 310
  md: "# Extra\n\nThe Render method lets you generate a completely custom control\
    \ without the standard Web forms controls. You can generate a client-side script\
    \ and the appropriate link to make a post-back event occur in your control.\n\n\
    # Example:\n\n```\nPublic Class WebControl1\n    Inherits System.Web.UI.UserControl\n\
    \    Implements IPostBackEventHandler\n    ' ... Web Form Designer Generated Code\
    \ ...\n    Public Sub RaisePostBackEvent(ByVal eventArgument As String) _\n  \
    \      Implements IPostBackEventHandler.RaisePostBackEvent\n        If eventArgument\
    \ = \"Action1\" Then\n            ' do something here\n        End If\n    End\
    \ Sub\n    Protected Overrides Sub Render(ByVal writer As _\n        System.Web.UI.HtmlTextWriter)\n\
    \        writer.Write(\"<input type=\\\"button\\\" value=Action1 OnClick=\\\"\
    javascript:\" & _\n        Page.GetPostBackEventReference(Me, \"Action1\") & \"\
    \\\"><p>\")\n    End Sub\nEnd Class\n```\n\nThe designer for the new control appears.\n\
    \n5 Double-click controls in the Toolbox to add them to the Web user control.\n\
    \nYou can add necessary properties, methods to the control through the Code Editor\
    \ by double-clicking the surface of the Web user control.\n\nNote: See \"Add a\
    \ Member\" to add properties and methods.\n\n6 Click Build ➔ Build Solution.\n\
    \nThe control is complete. You can now use it in a Web Form in the project.\n\n\
    Note: See \"Add a Web Control to a Page\" to add the control to a Web Form.\n\n\
    ![](img/d6f772854306e15fb6df39b861a7b541_310_0.png)"
  merge: -1
  img_proc: true
- pgno: 311
  md: '# ADD A WEB CONTROL TO A PAGE


    Web user controls let you create components that you can use throughout a Web
    Application. Web user controls function much differently than Windows user controls.
    The server represents each Web user control as a separate ASP.NET file, and by
    virtue of how Web servers function, the server must embed the control onto your
    form to use it. This means the actual definition of the control simply adds into
    the design of the Web Form page.


    To add a Web user control to a Web page, you drag the ASCX file that represents
    the control onto a Web form. Web user controls do not appear in the Toolbox. When
    you add the user control onto your Web form, you cannot view the control in design
    mode. The control shows as a gray area showing only the name of the control. You
    cannot control the size or modify any properties from the designer.


    When you drag the user control onto the form to embed it, the designer does not
    automatically create an object reference in code to access the control''s properties
    and methods. You must add a declaration to the Web Form class''s base definition.
    For the Web Form compilation to attach this variable to the Web user control,
    you must specify the same name that you assign to the control in the designer.
    For the variable type, use the Web user control''s class name.


    A good use for a Web user control is to contain functionality to login a user
    by providing an interface, which you can include on various entry pages to allow
    logins. The user control can handle all of the login events and functions without
    the main page needing any logic, except to check a property in the user control.


    # ADD A WEB CONTROL TO A PAGE


    ![](img/d6f772854306e15fb6df39b861a7b541_311_0.png)


    +   ADD A WEB CONTROL

    +   1 Create a new Web Application project or open an existing one.

    +   2 Add a Web user control to the project.

    +   Note: See "Create a Web User Control" to add a Web user control.

    +   3 Open the page to embed the control.

    +   4 Click the control in the Solution Explorer and drag it to the page.

    +   The page shows the embedded control.

    +   If the page is in layout mode, you can place the control using tables and
    lines.

    +   5 Double-click the surface of the Web form.

    +   The Code Editor opens.'
  merge: -1
  img_proc: true
- pgno: 312
  md: "# Extra\n\nYou can move events from a user control to the Web Forms page. ASP.NET\
    \ calls the function bubbling events. You can bubble events from a user control\
    \ to a form using the RaiseBubbleEvent method. In the user control event you want\
    \ to raise up to the page, call the RaiseBubbleEvent method with the first parameter\
    \ being the source object, and an event argument object. You pass Nothing as the\
    \ second parameter if you do want to pass a second parameter. In the Web Form,\
    \ you override the OnBubbleEvent method. If you have multiple controls raising\
    \ bubble events, you can use the Sender object to check the type. The example\
    \ assumes your control contains a Label and a Button control, and the form contains\
    \ another Label and the UserControl.\n\n# Example\n\n```\nButton1_Click in User\
    \ Control\n\nPrivate Sub Button1_Click(ByVal sender As System.Object, ByVal e\
    \ As System.EventArgs) Handles Button1.Click\n    Label1.Text = \"Button1_Click\
    \ Fired\"\n    RaiseBubbleEvent(Me, Nothing)\nEnd Sub\n```\n\n```\nCode in Web\
    \ Form\n\nProtected Overrides Function OnBubbleEvent(ByVal source As Object, ByVal\
    \ e As System.EventArgs) As Boolean\n    If TypeOf source Is WebUserControl Then\n\
    \        Label1.Text = \"Clicked Button in the Web Control\"\n    End If\nEnd\
    \ Function\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_312_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_312_1.png)\n\
    \n# ACCESS CONTROL CODE\n\n+   6. In the base of the page code module, type Protected\
    \ WithEvents MyWebControl1 As MyWebControl, replacing the control's variable name,\
    \ and MyWebControl1 with your user control's class name.\n+   \n+   7. In the\
    \ method to set up the control, set properties and call necessary methods to set\
    \ up the control.\n+   \n+   8. Press F5 to run your project.\n\nNote: The control\
    \ contents appears when the project runs, allowing manipulation.\n\nNote: This\
    \ example uses the control created in the section \"Create a Web User Control.\""
  merge: -1
  img_proc: true
- pgno: 313
  md: '# USING WEB CONTROL LIBRARIES


    You can use a Web control project to generate a DLL of Web custom controls for
    use on Web Forms pages. Unlike a Web user control, you add Web custom controls
    to a Web control library. These controls appear as actual entries in the Web Forms
    toolbox and do not reside on an ASP.NET page of a Web project. A Web custom control
    functions exactly like the existing controls that VB .NET provides.


    When you create a custom control, you create your very own custom control, therefore
    preventing you from combining existing controls like you would in a Web user control.
    To create a Web custom control, you must specify exactly how the control generates
    on the Web Form page.


    You use standard HTML output to generate the appearance for your control. To output
    this code, you override the Render method provided by the WebControl base class.
    The method has a single parameter of type HtmlTextWriter, which enables you to
    write to the page with the object''s Write method.


    You define properties, methods, and events like any other class or control. See
    the section "Add a Member" for information on adding properties and methods to
    a control. Use private member variables to hold data for the control. The Web
    Forms system maintains the state of the object automatically.


    When you create a Web Control Library project, the template contains one custom
    control. The control in the template predefines a Text property and outputs the
    text in its Render method. You can delete this property and alter the Render method,
    but the template provides a good starting point for building your control. To
    reference the Web Control library in a Web Application project, add a reference
    and customize the Toolbox as you might when using a Windows forms control library.
    For more information on referencing a library, see the section "Reference a Library."


    # USING WEB CONTROL PROJECTS


    ![](img/d6f772854306e15fb6df39b861a7b541_313_0.png)


    # CREATE A WEB CONTROL LIBRARY PROJECT


    +   1. Open the New Project dialog box.

    +   2. Click Visual Basic Projects.

    +   3. Click the Web Control Library template.

    +   4. Type a name for the project.

    +   5. Click OK.


    Note: To create a new project, see Chapter 1.


    The Code Editor appears with a default Web custom control class open.


    6 Define properties, methods, and events for the control.


    If desired, you can remove the code for the default Text property and the default
    code from the Render method.


    Note: To define methods and properties, see "Add a Member." To define events,
    see "Add an Event."'
  merge: -1
  img_proc: true
- pgno: 314
  md: "# Extra\n\nYou can add information to your properties for the visual forms\
    \ designer if you desire. To add template information, use angle brackets (<<>)\
