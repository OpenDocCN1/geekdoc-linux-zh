  md: "# Apply It\n\nOften, you need to sort a column of data while keeping another\
    \ column of data properly in line with it. For example, if you have two arrays,\
    \ one with last names and one with first names, you need to sort based on last\
    \ name while keeping the first names together with the last names. The Sort method\
    \ provides an alternative set of parameters to do this. Pass the array to sort\
    \ followed by the second array, and Sort sorts the first array. Sort reorders\
    \ the secondary array as it sorts.\n\n```\nDim firstName() As String = {\"John\"\
    , \"Sally\", \"Chris\"}\nDim lastName() As String = {\"Normal\", \"Peck\", \"\
    Cross\"}\nDim x As Integer\n\nFor x = 0 To 2                  ' display the initial\
    \ arrays\n    Console.WriteLine(lastName(x) & \", \" & firstName(x))\nNext\n\n\
    Array.Sort(lastName, firstName)  ' sort the two arrays based on last names\n\n\
    For x = 0 To 2                  ' display the results\n    Console.WriteLine(lastName(x)\
    \ & \", \" & firstName(x))\nNext\n\nConsole.ReadLine()\n```\n\n**RESULT:**\n\n\
    Normal, John  \nPeck, Sally  \nCross, Chris  \n\nCross, Chris  \nNormal, John\
    \  \nPeck, Sally\n\n![](img/d6f772854306e15fb6df39b861a7b541_124_0.png)\n\n# FIND\
