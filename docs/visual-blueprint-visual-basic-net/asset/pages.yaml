- pgno: 203
  md: '# USING DELEGATE AND ADDRESSOF


    VB.NET provides delegates to allow code in a class to call methods defined outside
    of the class. This enables you to implement different code based on the reason
    you call the class’s method. You can place the method in any part of the application
    that you want the class to use. In the class, you define the necessary parameters
    and return types that the function needs to accept. Then, you pass the class the
    outside method. The class can use this method to perform an operation. For example,
    if you needed to load data from various datasets in a class but you want to leave
    the actual implementation of reading the data out of the class, you can use a
    delegate so that the owner of the class provides the appropriate function to read
    the data.


    To set up the delegate, you must first define the expectations the class has for
    the method. In the class


    module, you use a Sub or Function line with the keyword Delegate in front. You
    define no code for the method and you do not add an End Sub or End Function command.
    This enables VB.NET to accept an outside function and to make sure it works with
    the class. In a method of the class, you create a parameter to accept the function.
    You make the type name for the parameter the same as the name of the delegate
    method header you declare.


    Now you can call the method with an instance of the class you create. First, you
    must define a method that accepts the same parameters and returns the same type
    the delegate declaration expects. Then, you can pass your method using the AddressOf
    keyword. Place this keyword followed by the name of the method you declare as
    the parameter you pass to the class’s method.


    # USING DELEGATE AND ADDRESSOF


    ![](img/d6f772854306e15fb6df39b861a7b541_203_0.png)


    +   1. Create a class or open an existing one.


    +   2. Type Delegate followed by Function or Sub on a blank line outside of all
    methods and classes.


    +   3. Type the name to represent the delegate.


    +   4. Type necessary parameters in parentheses.

    +   If you use Function in step 2, type As and follow it with the type.


    +   5. Create a new method and add a parameter to the method in the class that
    specifies the name of the delegate as the type.


    +   6. Type As and follow it with the name of the assigned delegate.


    +   7. Inside the method, type the name of the delegate variable followed by .Invoke.


    +   8. In parentheses, type the appropriate parameters.'
  merge: -1
  img_proc: true
- pgno: 204
  md: "# Extra\n\nThe Delegate class supports an unlimited number of separate methods.\
    \ You can use delegates to call more than one method with the Invoke method. Use\
    \ the Combine method of the delegate you define to pass two functions, or pass\
    \ an entire array.\n\n# TYPE THIS:\n\n```\nPublic Delegate Sub StatusDel(status\
    \ As String)\nPublic Class BigCalculationClass\n    Public Sub MyMethod(ByVal\
    \ sendInfo As StatusDel)\n        sendInfo.Invoke(\"Status info here\")\n    End\
    \ Sub\nEnd Class\nPublic Class Form1\n    Public Sub Simple1(status As String)\n\
    \        MsgBox(\"Method1: \" & status)\n    End Sub\n    Public Sub Simple2(status\
    \ As String)\n        MsgBox(\"Method2: \" & status)\n    End Sub\n    Public\
    \ Sub Form1_Load() Handles MyBase.Load\n        Dim d As StatusDel =\n       \
    \     StatusDel.Combine(New StatusDel(AddressOf Simple1), New StatusDel(AddressOf\
    \ Simple2))\n        Dim work As New BigCalculationClass()\n        work.MyMethod(d)\n\
    \    End Sub\nEnd Class\n```\n\n# RESULT:\n\nMethod1:\nStatus info here\n\nMethod2:\n\
    Status info here\n\n![](img/d6f772854306e15fb6df39b861a7b541_204_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_204_1.png)\n\
    \n9 In the module you want to use the class, declare a new method exactly like\
    \ the delegate you created in step 2.\n\n10 Declare an instance of the class in\
    \ a separate method.\n\n11 Call the method that uses the delegate.\nFor the parameter\
    \ you created in step 5 that expects the delegate, type AddressOf and the name\
    \ of the new method you define in step 9.\n\n12 Press F5 to run your project.\n\
    \nThe delegate calls the method in the other class."
