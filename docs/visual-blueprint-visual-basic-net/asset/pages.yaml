- pgno: 163
  md: '# DRAW SIMPLE PRIMITIVES


    In many cases, you need to draw borders and boxes around items in a Windows Application.
    You can use a variety of primitives in your Windows Forms application to add aesthetics
    to parts of the form.


    A number of commands draw outlined objects such as lines, rectangles, and ellipses.
    For these commands to work, you need to create a Pen. To create a Pen object,
    see the section "Create a Pen."


    The DrawLine method draws a line onto the graphics region. The first parameter
    the method expects is a Pen. After the first parameter, you give the method two
    Point structures, the first specifying the starting (x, y) coordinates, and the
    second specifying the end (x, y) coordinates. Instead of the two Point objects,
    you can also pass four integers or four singles in the form x1, y1, x2, y2. The
    DrawRectangle expects a Pen for the first argument, and a Rectangle object for
    the second argument. Instead of the Rectangle, you can provide four integers or
    singles after the Pen parameter. DrawEllipse draws an ellipse to fill a rectangular
    space and expects the same arguments as DrawRectangle. For more information on
    using Point and Rectangle objects, see the section "Using the Graphics Object."


    DrawLines creates a connected set of line segments. When you pass a Pen as the
    first parameter with an array of Point objects as the second argument, the method
    starts at the point and connects each point together in sequence.


    DrawRectangles draws a series of rectangles with a single Pen. Pass the Pen as
    the first argument and an array of Rectangle objects as the second parameter.


    DrawPolygon draws a polygon based on a set of points. It automatically connects
    the first point and last point. Pass a Pen and an array of Point objects for the
    parameters.


    # DRAW SIMPLE PRIMITIVES


    ![](img/d6f772854306e15fb6df39b861a7b541_163_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_163_1.png)


    +   1. Create or open a Windows Application project and double-click a form you
    want to paint.

    +   2. Click the class list and select (Base Class Events) or the control on which
    to draw.

    +   3. Click the method name list and select the Paint event.

    +   4. Declare a new instance of a Pen class.

    +   5. Type e.Graphics.DrawEllipse replacing DrawEllipse with the method name
    to draw.


    Note: To declare a Pen, see the section "Create a Pen."'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# Extra


    You can create filled regions using the Graphics object, which contains a set
    of methods to draw filled primitives. You can use these commands to create a primitive
    just like the drawing commands like DrawLine and DrawEllipse, except instead of
    drawing an outline, these commands fill the region. Each of these methods accepts
    the same parameters as their outlined counterparts, except you switch the Pen
    parameter to a Brush. To create a Brush, see the section "Create a Brush." FillRectangle
    fills a rectangular space with the supplied brush. FillEllipse fills an elliptical
    area. FillRectangles fills a series of rectangles. FillPolygon fills a polygon
    area based on a set of points. If you want to draw a filled region with a border,
    use a combination of the two commands. Draw the filled primitive first and then
    pass the same set of sizes and parameters to the outlined primitive. Calling the
    methods in the other order can cause the fill to overwrite the pen.


    ```

    Example:

    Dim rect As New Drawing.Rectangle(50, 50, 200, 100)

    Dim redBrush As Drawing.SolidBrush = _

    System.Drawing.Brushes.Red

    e.Graphics.FillEllipse(redBrush, rect)

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_164_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_164_1.png)


    6 Type appropriate parameters inside parentheses.


    7 Press F5 to run your project.


    The form draws the primitive.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# DRAW A CURVE


    VB.NET provides a set of functions to draw curves, complex line forms that use
    advanced algorithms to draw given only a few reference points. You can use simple
    graphics primitive commands to create a variety of curved lines and shapes.


    The DrawArc method is the simplest curve command because it draws a portion of
    an ellipse. You pass the method a Pen as the first parameter. For the next parameters,
    you pass either a Rectangle containing the size of the ellipse for the entire
    ellipse, or four integers singles holding the dimensions of the ellipse. Following
    these parameters, you specify the start angle, and then the sweep angle, both
    in degrees. The angles measure clockwise from the x-axis. The DrawPie and FillPie
    methods draw a pie wedge just like an arc, except two lines draw to the center
    of the ellipse. Because FillPie creates a filled region, pass it a Brush instead
    of a Pen as the first argument.


    The DrawCurve method draws a curve through a specified array of points. The first
    parameter for the DrawCurve constructor is the Pen you use to draw the curve.
    The second parameter is an array of the Point class, which specifies the points
    through which you draw the curve. Another constructor takes the same two arguments
    plus the tension to draw the curve as the third parameter. A tension of zero creates
    a straight line.


    DrawClosedCurve draws a curve with a line connecting the first and last point
    in the curve. The basic constructor requests only a Pen and Point(), for example
    DrawCurve. Another constructor takes those two arguments plus the tension as the
    third argument and a constant from the FillMode enumeration for the fourth. The
    FillMode determines which part of the curve encloses the section. FillClosedCurve
    fills the enclosed space of the curve. You pass a Brush as the first argument
    rather than a Pen.


    # DRAW A CURVE


    ![](img/d6f772854306e15fb6df39b861a7b541_165_0.png)


    +   1 Create a new Windows Application project or open an existing project.


    +   2 Open the Paint event where the curve needs to draw.


    +   3 Declare a Pen to draw the curve.


    +   4 To draw an arc or pie type e.Graphics.DrawPie(myPen, replacing DrawPie with
    either DrawPie or DrawArc and myPen with the name of the Pen object.


    +   5 Type a Rectangle object representing the size.


    +   6 Type a comma and follow it with the start and sweep angles.


    To use the fill routines, you can also declare a Brush. Note: To create a Pen,
    see the section "Create a Pen." To create a Brush, see the section "Create a Brush."'
  merge: -1
  img_proc: true
- pgno: 166
  md: "# Extra\n\nYou can create different fill patterns for objects with complex\
    \ shapes, such as curves, using the FillMode enumeration. You have two options\
    \ for FillMode: Winding, and the default, Alternate. Alternate moves across the\
    \ curve and alternates between filling and not filling as it hits lines of the\
    \ curve. Winding uses the direction of the curve to determine whether to fill\
    \ it. Generally, the default Alternate does an effective job, but you may try\
    \ Winding when Alternate does not give the appropriate results.\n\nYou can use\
    \ Bezier curves, a more advanced cubic curve, to specify more exact coordinates\
    \ of curvature. Most professional drawing applications work with Bezier curves\
    \ instead of the simpler cardinal spline curves used by DrawCurve. To draw a Bezier\
    \ curve, you use the DrawBezier method, which only draws one curve defined by\
    \ the four points. The method requires a Pen object, which you follow with four\
    \ Point objects for its parameters. The first and last Point objects make up the\
    \ curve's endpoints. The two middle Point objects make up the two control points\
    \ that create the desired curvature. When the curve draws, it pulls the curve\
    \ out to the control points.\n\n```\nExample:\ne.Graphics.DrawBezier(Drawing.Pens.Red,\
    \ _\n    New Point(100, 100), New Point(150, 150), _\n    New Point(150, 200),\
    \ New Point(100, 250))\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_166_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_166_1.png)\n\n7 To draw a curve, declare\
    \ an array of Point objects that the curve passes through.\n\n8 Type e.Graphics.DrawCurve(myPen,\
    \ pts), replacing DrawCurve with either DrawCurve or DrawClosedCurve and myPen\
    \ with the name of the Pen object and pts with the name of the Point array.\n\n\
    9 Press F5 to run your project.\n\nThe curve draws onto the graphics container."
  merge: -1
  img_proc: true
- pgno: 167
  md: '# DRAW TEXT


    Most applications use text to title, label, and explain functions on a form. In
    some cases, a Label control can provide the appearance necessary. For advanced
    text rendering, you can use the text drawing routines that VB .NET includes in
    the Graphics object. For more information on the Label control, see Chapter 3.
    Using the Graphics system, you can apply a Brush to your text to create text filled
    with a gradient, a bitmap texture, or a hatch pattern.


    The standard method of rendering text with the Graphics object is the DrawString
    method. In each available overloaded method call, the first parameter contains
    the String to print. DrawString expects a Font object as the second parameter
    and a Brush object as the third parameter. For the fourth parameter, you pass
    a Point object specifying the top, left point to draw the text. The simplest constructor
    requires these four parameters. Optionally for the fifth parameter, you can pass
    a StringFormat object to designate how the text styles.


    Chapter 4 contains more detailed information on the String variable type.


    To provide the font to pass to DrawString, create a new instance of the System.Drawing.Font
    class. Depending on the data you want to provide to the Font constructor, you
    can pass either a FontFamily object, or a String to select a font family, such
    as Arial or Times New Roman. The second parameter is the size of the font in points.
    Optionally for the third parameter, specify the font style using the FontStyle
    enumeration.


    The Graphics object exposes a method called MeasureString. Use this method to
    determine the width and height of a string you want to draw. Pass the String and
    Font as the two parameters to the method. MeasureString returns a SizeF structure,
    contained in the System.Drawing namespace. The Width and Height properties of
    the SizeF contain the appropriate values.


    # DRAW TEXT


    ![](img/d6f772854306e15fb6df39b861a7b541_167_0.png)


    +   1 Create a new Windows Application project or open an existing project and
    the form with which to work.

    +   2 Open the Paint event where the primitive needs to draw.

    +   3 Declare a Brush object to draw the text.

    +   4 Type Dim myFont As New Drawing.Font(), replacing myFont with the name for
    the Font variable.

    +   5 Inside the parentheses, type "Arial Black", 72, replacing Arial Black with
    the font face to use and 72 with the size of the font.


    Note: To create a Brush, see the section "Create a Brush."'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Extra


    You can use the FontStyle enumeration to provide options for the style of font
    to draw. For example, you can print in bold italics font. To do this, you can
    combine the constants with the Or operator.


    | MEMBER | DESCRIPTION |

    |---|---|

    | Bold | Bold text |

    | Italic | Italic text |

    | Regular | Normal text |

    | Strikeout | Text with a line through the middle |

    | Underline | Underlined text |


    # Example:


    ```

    Dim arial As New Font("Arial", 16, _

    FontStyle.Bold Or FontStyle.Italic)

    Dim red As Brush = Brushes.Red

    e.Graphics.DrawString(

    "Bold Italic Arial Font", arial, _

    red, 10, 10)

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_168_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_168_1.png)


    6 On a new line, type e.Graphics.DrawString("Big text", myFont, myBrush, 20, 50),
    replacing Big text with the string to print or a string variable, myFont with
    the name of the Font variable, myBrush with the name of the Brush variable, and
    20, 50 with the coordinates to draw the text.


    7 Press F5 to run your project.


    The text renders onto the appropriate graphics container:'
