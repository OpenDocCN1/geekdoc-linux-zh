  md: '# Extra


    VB .NET uses variable scope to determine where you can use a variable name depending
    on where you define it. If a programming language did not use scoping, all of
    the variables you declare take up a significant quantity of memory. The scope
    of a variable defines where a variable is active and when VB .NET removes the
    variable from memory because you can no longer access it.


    When you declare a variable inside a method, you cannot access the variable outside
    of that method. For example, you cannot declare a variable inside a method, then
    access the variable when you call another. If you declare a variable inside a
    block statement, like an If block or a Do loop, you can only access the variable
    inside the block. Unlike Visual Basic 6 and earlier versions, code following the
    block inside the same method cannot access the variable. To make a variable accessible
    to all of the methods of a class, you can define member variables. See Chapter
    7 for more information. You can also create global variables in VB .NET using
    shared member variables. See Chapter 8 for more information.


