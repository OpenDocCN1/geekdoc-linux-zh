- pgno: 111
  md: '# PASS INFORMATION THROUGH A METHOD


    Many methods need external data to function and must have the abilities to send
    data back to the caller. You can use arguments to create a conduit to pass any
    type of variable through to a method. Return values let you pass back a variable
    to the code that called the method.


    To define a list of arguments a method accepts, you enclose the list of variable
    names inside the parentheses after the method''s name. When you place the argument,
    you place the ByVal or ByRef keyword in front of the variable name for the argument,
    and specify a variable type for the argument using the As keyword after the argument.
    Specify ByVal to pass the value of the variable, and specify ByRef to pass the
    memory location of the original variable. VB.NET automatically adds ByVal if you
    do not specify the argument passing method.


    List multiple arguments by separating them with commas. You use the variable names
    you assign in the argument list


    as local variables of the method, so you must use different names than you use
    for local variables in the method.


    To return values to code calling a method, use the Function keyword to define
    the method instead of Sub. When using the Function keyword, you must specify the
    type of variable or object that the function returns. For more information on
    creating and calling methods, see the section "Add a Method."


    To set the information to return, you use the Return keyword. After the keyword,
    place the return variable or object. Make sure the variable matches the type you
    specify in the method header.


    For a method that returns a value, use the method as a variable name inside other
    code, or assign it to a variable, for example test = TestNumber(number).


    # PASS INFORMATION THROUGH A METHOD


    ![](img/d6f772854306e15fb6df39b861a7b541_111_0.png)


    # PASS ARGUMENTS


    +   1. Open the class or module for the method

    +   2. Create a new method or use an existing one.


    +   3. Click between the parentheses.


    Note: To create a method, see the section "Add a Method."


    +   4. Type ByVal number1 As Integer replacing number1 with the variable name
    for the parameter and Integer with the type for the variable. You can repeat step
    4 as needed, separating each argument with a comma.


    +   5. Edit the method code to use the parameter.

    +   6. To call the method, type Add(5, 10), replacing Add with the name of your
    method, and 5, 10 with values to match your parameter list.'
