- pgno: 75
  md: '# FRAME CONTROLS


    You can create a frame around other controls and visually separate them from the
    rest of the form using a GroupBox. For example, a user may better understand the
    function of a list of check boxes, radio buttons, buttons, or any other control
    if you locate them inside a GroupBox control. The group box draws a border around
    itself with a label header at the top of the frame. You can change the header
    displayed using the Text property.


    A GroupBox control is a container control, meaning it can hold other controls
    inside it. Think of it as a box inside the main form. If you add controls to the
    box, and then move the box, the controls you place inside move with it. If you
    use the Dock and Anchor properties to resize controls inside the group box, they
    resize independently inside the GroupBox without regard to the form shape. To
    use the Dock and Anchor properties, see Chapter 2.


    Group boxes typically contain a logical group of RadioButton controls. For example,
    if you have two lists of options where the user needs to select one response in
    each, you must place each set of controls inside its own GroupBox control. VB.NET
    does not allow you any other way to separate RadioButton controls into groups
    except by placing them in container controls. For more information on the RadioButton
    control, see the section "Provide Option Controls."


    The BackgroundImage property allows you to place a picture in the background of
    the GroupBox. Note that placing a background image in the group box can make the
    controls the box contains hard to see and can distract the user.


    # FRAME CONTROLS


    ![](img/d6f772854306e15fb6df39b861a7b541_75_0.png)


    +   1. In a Windows Application project, click and drag the GroupBox control from
    the Toolbox to the form.

    +   2. In the Properties window, set the Text property to alter the heading of
    the frame.

    +   3. Click and drag controls from the Toolbox to the inside of the GroupBox.

    +      This example shows radio buttons inside each GroupBox.

    +   4. Repeat steps 1 through 3 to add multiple groups to the form.

    +   5. Press F5 to run your application.


    The controls inside the group boxes respond separately. For example, radio button
    controls act as separate groups.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '# WORK WITH PANELS


    You can use the Panel control to provide an area to hold other controls. The Panel
    control, like the GroupBox control, acts as a container, which allows you to group
    controls, such as radio buttons. Because the Panel control''s default state is
    borderless and indistinguishable from the form, you can use it when you do not
    want a visual framing around your controls. See the section, "Frame Controls"
    for more on the GroupBox.


    You can add a frame to a Panel control by setting the BorderStyle property to
    FixedSingle or Fixed3D. FixedSingle creates a single pixel black border around
    the control, while Fixed3D creates a two pixel sunken edge.


    You can set AutoScroll to True to allow the Panel to create scrollbars if a user
    resizes the panel smaller than the right or bottom-most controls. The AutoScrollMargin
    regulates the distance that you place controls from the right or bottom edge before
    a scrollbar appears. This allows you to create scrolling frames inside your application
    window that scroll independently of the main form. Keep in mind that scrolling
    is a bad design technique that you should minimize unless necessary. A more effective
    option is to make the controls inside the panel resize as necessary based on the
    available space.


    The Panel aids in creating a very flexible layout environment and, thus, allows
    you to create complex interfaces with the Dock and Anchor properties. See Chapter
    2 for information on these properties. You can dock the Panel control to a side
    of the form, or anchor it in a certain way. Doing so allows the controls inside
    the box to resize independently by docking and anchoring to the client space of
    the Panel. You can also use the scrolling functionality of the Panel to make the
    controls stay at the same spot and allow the Panel to scroll the area.


    # WORK WITH PANELS


    ![](img/d6f772854306e15fb6df39b861a7b541_76_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_76_1.png)


    +   1. In a Windows Application project, click and drag the Panel control from
    the Toolbox to the form.

    +   If desired, you can change the BorderStyle property.


    +   2. Click and drag controls from the toolbox to inside the Panel.


    +   3. Repeat steps 1 through 3 as desired.


    > Note: To set a property, see Chapter 2.


    +   4. Press F5 to see your application run.

    +   Each Panel control holds its constituent controls and enables them to function
    as separate groups.


    +   In this example, the BorderStyle is set to Fixed3D and the panels contain
    radio buttons.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# LIST ITEMS


    List controls allow you to display long lists of information in a smaller space
    on screen. You can add list controls to the your form to allow the user to make
    a selection from this list or just to provide information to the user. You should
    use list controls whenever you have a long or varying set of data from which the
    user needs to choose. For example, you can use list controls to display a listing
    of files in a directory, or display a list of products from your company.


    VB .NET provides three list controls: the ListBox, CheckedListBox, and ComboBox.
    A ListBox allows the users to select single or multiple items from the list. A
    CheckedListBox places a check box beside each item in the list, allowing users
    to check multiple items. A ComboBox allows the list to drop down and provides
    the user the ability to enter a new item or select an existing item via the keyboard.


    VB .NET stores list items in the Items collection. Design-time editing of this
    collection allows you to predefine list items, or you can use the code ListControl.Items.


    Add("item text") to add an item during runtime. Set the Sorted property to True
    if you want the controls to sort your items alphabetically.


    For ListBox and CheckedListBox controls, you can add horizontal scrollbars by
    setting HorizontalScrollbar to True. For the ComboBox control, specify the width
    of the drop-down list by setting DropDownWidth. You can use these properties to
    show data that is wider than the width of your control. SelectionMode has three
    settings. One allows the user to select a single item. MultiSimple allows the
    user to toggle item selections by clicking an item. MultiExtended, on a click,
    selects the item and unselects any other items, and you must hold down Ctrl to
    pick another item, or Shift to select a range of items.


    The ComboBox also has three specific modes, specified in the DropDownStyle property.
    Simple creates a list box with a textbox at the top, allowing users to make new
    entries. DropDown allows a user to type a value or select an item in the box.
    DropDownList displays a list and only lets the user select items.


    ![](img/d6f772854306e15fb6df39b861a7b541_77_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_77_1.png)


    +   1 Create a new Windows Application project or open an existing one.

    +   2 Click and drag the ListBox, CheckedListBox, or ComboBox control to the form.

    +   3 In the Properties window, click ... beside the Items property.

    +   4 Type separate items for the list control on separate lines.

    +   5 Click OK to load the items into the list.

    +   Alternately, you can add items at design-time rather than at runtime.'
  merge: -1
  img_proc: true
- pgno: 78
  md: "# Apply It\n\nYou can use the Items property of any of the list controls in\
    \ this section to add and remove items at runtime, as well as determine the items\
    \ in the list the user selects. For a single selection list box or a combo box,\
    \ you can retrieve the selected item by using the SelectedItem property. For multiple-selection\
    \ list boxes, you need to loop through the SelectedItems collection. For the CheckedListBox,\
    \ you can loop through the CheckedItems collection. You can place the sample code\
    \ that follows in a Button's event procedure. The code runs through a CheckedListBox\
    \ and adds all of the items that a user checked in a ListBox.\n\n# Example:\n\n\
    ```\nPrivate Sub Button1_Click(ByVal sender As System.Object, ByVal e As System.EventArgs)\
    \ Handles Button1.Click\n\n' Clear the result check box\nListBox1.Items.Clear()\n\
    \n' Run through checked items in CheckBoxList1\nDim item As String\nFor Each item\
    \ In CheckedListBox1.CheckedItems()\n    ' Add the item to the receiving list\
    \ box\n    ListBox1.Items.Add(item)\nNext\nEnd Sub\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_78_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_78_1.png)\n\n6 For the ComboBox control,\
    \ click the DropDownStyle property; for the ListBox control, click the SelectionMode\
    \ property.\n\n7 If desired, click and select a new value. Run your project by\
    \ pressing F5.\n\n8 VB.NET creates the list box or combo box and allows interactions\
    \ with it."
  merge: -1
  img_proc: true
- pgno: 79
  md: '# SELECT NUMERIC DATA


    You can use the TrackBar control to allow users to select numbers or other ordered
    data. The TrackBar control provides a slider that you can display from left to
    right, or top to bottom.


    The TrackBar provides two settings for the Orientation property. Horizontal makes
    the control slide left and right. Vertical orientation makes the control slide
    up and down. Once you place it on a form, the control does not change height in
    horizontal mode or width in vertical mode.


    The Minimum property determines the smallest value of the slider that the user
    can select by moving the slider to the left or top position. The Maximum property
    determines the largest value of the slider that the user can select at the right
    or bottom position of the bar. You can set the Value property at design-time or
    in code to position the slider. When the user changes the slider, the Value property
    updates as well.


    On the control display, the slide bar draws into a point that points towards a
    set of tick marks. A tick is a little dash on the control that indicates the values
    of the slider. The TickFrequency property determines how many ticks the control
    displays. For example, if the TrackBar ranges from 0 to 10, and TickFrequency
    = 1, the track bar contains eleven ticks, one for each value. For a TickFrequency
    of two, the ticks skip every other value. The TickStyle property allows you to
    place the ticks on the BottomRight — bottom for a horizontal bar, right for a
    vertical bar — TopLeft, Both, or None.


    The Scroll event fires when the user moves the slider with the mouse or keyboard.
    The Value property updates to the new position of the slider before the event
    fires so you can display the number or make appropriate changes based on the slider
    position in the event.


    ![](img/d6f772854306e15fb6df39b861a7b541_79_0.png)


    +   1 In a Windows Application project, add a control to respond to the value
    of the slider.

    +   The example adds a Label control.


    +   2 Click and drag the TrackBar control from the Toolbox to the form.

    +   3 In the Properties window, double-click the Orientation property to switch
    between the two values.


    +   4 Type an integer value for the Minimum property.

    +   5 Type an integer value for the Maximum property.


    +   6 Edit any other properties.

    +   Note: See Chapter 2 to edit a property.

    +   7 Double-click the control to add code for the Scroll event.'
  merge: -1
  img_proc: true
- pgno: 80
  md: "# Extra\n\nYou can use the events available to the TrackBar control to make\
    \ mouse scrolling an effective method of scrolling through values of the control.\
    \ If the user moves the slider using a mouse wheel, the control does not raise\
    \ the Scroll event. Instead, the control raises the MouseWheel event. You can\
    \ call the Scroll event from the MouseWheel event to perform the same functionality.\n\
    \nYou can manipulate properties to allow the user to move easily through the range\
    \ of values. The SmallChange property specifies the smallest increment the slider\
    \ moves. You use this to decide what values the slider moves to when the user\
    \ drags it. For example, a value of two only allows the user to select every other\
    \ number when moving the tracker. The LargeChange property determines how much\
    \ the slider moves when the user clicks on the bar or uses the page up and page\
    \ down keys to the sides of the slider.\n\n# Example:\n\n```\nPrivate Sub TrackBar1_Scroll(ByVal\
    \ sender As _\n    System.Object, ByVal e As _\n    System.EventArgs) Handles\
    \ TrackBar1.Scroll\n    Label1.Text = TrackBar1.Value.ToString()\nEnd Sub\nPrivate\
    \ Sub TrackBar1_MouseWheel(ByVal sender As _\n    Object, ByVal e As _\n    System.Windows.Forms.MouseEventArgs)\
    \ _\n    Handles TrackBar1.MouseWheel\n    TrackBar1_Scroll(sender, e)\nEnd Sub\n\
    ```\n\n![](img/d6f772854306e15fb6df39b861a7b541_80_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_80_1.png)\n\
    \nThe Code Editor appears.\n\n8 To retrieve the TrackBar value on the form, type\
    \ the name of the control followed by .Value.\n\n9 Press F5 to run your program.\n\
    \nThe user can move the bar around as necessary."
  merge: -1
  img_proc: true
- pgno: 81
  md: '# CREATE TIMED EVENTS


    You can use the Timer control to run code at defined intervals. The Timer control
    works in the background, raising events in your form at specified intervals. You
    can use the Timer control''s event to perform background processing in increments
    of time without interrupting the user.


    The Interval property specifies the time before an event fires. Interval is an
    integer number that specifies times in milliseconds. The default is 100, which
    means 100/1000 of a second, or 10 times a second. For example, you can specify
    one second as 1000, and a minute as 60000. Intervals smaller than 50 are not reliable
    on most machines and may fire irregularly.


    The Enabled property determines if the control actively fires events. The default
    is False. You can set this property to True at design-time if you want the control
    to start firing events based on the Interval immediately after the form loads.


    To start the control as your program runs, use the Start method. To stop the timer,
    use the Stop method. If the event has already fired, it runs until complete, even
    if you execute a Stop.


    The event where you place your timer code is called Tick. You place any code in
    here that needs to run every timer count.


    If your code does not finish before the next time interval, another Tick event
    loads, creating a large stack of the event waiting, which in most cases leads
    to undesirable results, and if it happens for an extended period, may cause the
    program to crash or your computer to run out of memory. Make sure your Interval
    is long enough to allow the code inside of the event to complete.


    ![](img/d6f772854306e15fb6df39b861a7b541_81_0.png)


    +   1. Create a new Windows Application project or open an existing one.

    +   2. In the Toolbox, double-click the Timer control to add it to the form.

    +   3. Add other controls to display the activity of the Timer.

    +      The example adds a Label control to the form.

    +   4. Click the Timer control in the Component Tray to edit its properties.

    +   5. In the Property Window, type a value representing the speed at which you
    want events to fire in the Interval property.

    +   6. Double-click the Enabled property to toggle it to True.

    +   7. Double-click the Timer control in the Component Tray.

    +   You specify the Interval property in milliseconds.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Extra


    You must develop your application carefully for the Timer control to function
    properly. The Timer control does not operate in a separate thread, meaning it
    can only function if your application is idle. If your application is running
    a calculation or intensive loop of operations and you want the Timer control to
    function at the same time, you must call the DoEvents method of the Application
    object. This method allows other queued events and operations to occur like the
    Timer control''s Tick event and UI redraws. Keep in mind that when you call DoEvents,
    events such as mouse clicks fire, so you must make sure that the user does not
    attempt to start an action that is already in process again.


    # Example:


    ```

    Do

    '' do lots of processing

    '' ...

    '' let the application do any necessary queued actions

    Application.DoEvents()

    Loop Until done

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_82_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_82_1.png)


    The Code Editor loads the Tick event.


    8 Type code to run when the control raises the Tick event.


    In the example, the code increments a label on the form.


    9 Press F5 to run the project.


    The Timer raises the event as specified in the Interval property.'
  merge: -1
  img_proc: true
