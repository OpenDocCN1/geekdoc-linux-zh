- pgno: 298
  md: '# Extra


    As with properties, you can override methods and events of the User Control class.
    For example, the control provides a Click event that fires whenever the user clicks
    part of the UserControl that does not contain a constituent control. You may not
    want the containing application to provide code for clicking in the blank areas
    of the code. You can override the OnClick method to prevent this event from reaching
    the parent control.


    # Example:


    ```

    Protected Overrides Sub OnClick(ByVal e As System.EventArgs)

    '' do nothing... hide the event from the parent.

    End Sub

    ```


    You can also use the OnEvent, where Event is the name of a particular event, to
    modify certain information, and pass the event along as usual. Because the events
    exist in the Control class, you cannot raise them normally. Instead, you must
    define the event again in your UserControl class using the Shadows keyword.


    # Example:


    ```

    Public Shadows Event Click(ByVal sender As Object, ByVal e As System.EventArgs)

    Protected Overrides Sub OnClick(ByVal e As System.EventArgs)

    '' perform necessary preprocessing

    ...

    '' raise the normal event

    RaiseEvent Click(Me, e)

    End Sub

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_298_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_298_1.png)


    +   7 To override property or event functionality, select (Overrides) from the
    components list.

    +   8 Select a property or method to override.


    +   9 Add code to provide the new functionality for the property or method.

    +   The example overrides the background color and paints a gradient using the
    selected color.

    +   10 Click Build -> Build to build the project.


    When you add the control to a form and attempt to modify a property, the appropriate
    code either monitors or overrides the function.


    If you use a control library, you must reference the control library.

    Note: To reference a control library, see the section "Reference a Library."'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# ADD A MEMBER


    You can provide properties and methods in your user control that interact with
    its container to customize the appearance and functionality of your control. Similar
    to the Text property of the Button control, which sets the caption that displays
    on the button, you can create properties that modify the appearance and functionality
    of your control. You can also add custom methods, which allow the container to
    send commands and specify the control''s actions.


    To add a property to your user control, you access the Code Editor and add the
    property definition to the existing class that defines the user control. You define
    properties for your control''s container as Public to give the container access
    to them. For more information on adding a property to a class, see Chapter 7.


    To add a method to your user control, define the method inside the existing user
    control class. Define the method Public to let the control''s container invoke
    the method. If you want to create an inherited version of the control, make sure
    that necessary properties contain the Overridable keyword. For more information
    on adding a method to a class, see Chapter 7.


    When you build a control and add it to a Form, you can access the properties you
    define inside the Properties window. You can also manipulate both the properties
    and methods in code. The Properties window determines the type of properties and
    uses the most appropriate selection system. For example, if you create a property
    of type Color, the Properties window automatically provides a color selector drop-down
    list for your property. If you have a property of type Size or Point, the designer
    shows the properties of the object as a subsection of your property.


    ![](img/d6f772854306e15fb6df39b861a7b541_299_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_299_1.png)


    # ADD A PROPERTY


    +   1. Open an existing user control, double-click the surface of the user control
    to go to the Code Editor.

    +   2. Define a private member variable.

    +   3. On an empty line of the class, type Public Property followed by the name
    of the property.

    +   4. Press Enter.

    +   5. Type code inside the property to set and retrieve the value that the property
    specifies.

    +   6. Click Build to build the control.


    Note: To use private member variables, see Chapter 7.


    Note: To add properties to a class, see Chapter 7.


    You can now add the UserControl to a form and access the properties of the control.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Extra


    You can add read-only methods to your component, control, or class to provide
    information to the control''s container. If your control maintains a collection
    of objects, you can use a ReadOnly property to allow access to the items without
    allowing direct changes to the objects.


    ```

    ```vb

    Private items As New Collection()

    Public ReadOnly Property Item(ByVal index As Integer)

    Get

    Return items(index)

    End Get

    End Property

    Public Sub Add(ByVal item As Object)

    items.Add(item)

    End Sub

    ```

    ```


    You can make your property take on a range of values specified by an enumeration
    of constants using the Enum block. Use the type name of the enumeration block
    for the property, and the designer loads the list and provides a drop-down list
    of constants.


    ```

    ```vb

    Public Enum SelectionStyles

    ByColor

    ByName

    End Enum

    Public Property SelectionStyle() As SelectionStyles

    ...

    ```

    ```


    # ADD A METHOD


    +   1. Open an existing user control

    +   2. Double-click the surface of the user control to go to the Code Editor.

    +   3. On an empty line of the class, type Public followed by Sub or Function
    and the name of the method.

    +   4. For a Function, add the return type after the As keyword at the end of
    the line, and then press Enter.

    +   5. Type code inside the method to modify the function of the UserControl.

    +   6. Click Build to build the control.


    Note: To add methods to a class, see Chapter 4.'
