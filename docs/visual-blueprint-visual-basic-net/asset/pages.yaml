  img_proc: true
- pgno: 85
  md: '# EXPLORE LIST VIEWS


    You may have some instances where you must display more data than you can easily
    fit in a simple ListBox control. You use the ListView control to provide a list
    of data with multiple columns and with different view modes. The Windows Explorer
    uses the ListView control to provide file listings.


    A ListView provides four views that you can set with the View property: LargeIcon,
    Details, SmallIcon, and List. The LargeIcon view shows a full-size icon with the
    associated text shown below the icon. The SmallIcon view shows a small icon with
    the text to the right of the icon. The Details view shows a small icon and a single
    item per line with a definable set of columns describing the item.


    You can attach a large and a small icon to each item. You must create a single
    ImageList control to hold the icons for both of these types. When you add an item
    to the list, you can assign the index for the icon the item displays. VB .NET
    provides a LargeImageList and SmallImageList property to link the corresponding
    ImageList controls. For more information about the ImageList control, see the
    section "Work with ImageLists."


    VB .NET stores items in the list in the Items collection. Each item consists of
    a caption you assign using the Text property and an assigned icon, chosen with
    the ImageIndex property. At design-time, you can modify the item list using a
    visual editor.


    You define columns, which you see in detailed view, using the Columns collection.
    Details view requires you to define at least one column. The SubItems collection
    of each ListViewItem in the list stores the settings for the information to display
    about an item in the various columns.


    When you select an item, the ListView_SelectedIndexChanged event fires. You can
    retrieve a collection of the selected items using the SelectedItems collection.


    ![](img/d6f772854306e15fb6df39b861a7b541_85_0.png)


    +   1. In a Windows Application project, add an ImageList control to the form
    and add images to it as appropriate.

    +   Note: See the section "Work with ImageLists" to add an ImageList control.

    +   2. In the Toolbox, click and drag the ListView control to add it to the form.

    +   3. In the Properties window, select the appropriate view. The example uses
    the LargeIcon view.

    +   4. Click [...] in LargeImageList or SmallImageList and select ImageList.

    +   If you use the large icon view, set the LargeImageList property; otherwise
    set the SmallImageList property.

    +   5. In the Properties window, click [...] beside the Items property. The ListViewItem
    Collection Editor appears.'
  merge: -1
  img_proc: true
- pgno: 86
  md: "# Extra\n\nThe ListViewItem class stores the information of a single item in\
    \ a ListView. Because you can access this class, you can create a new ListViewItem\
    \ and then add it to the ListView control. Using this method allows the flexibility\
    \ of setting the properties of the ListViewItem before adding it to the control.\n\
    \n# Example:\n\n```\nDim newItem As New System.Windows.Forms.ListViewItem\nnewItem.Text\
    \ = \"sample item\"\nnewItem.BackColor = System.Drawing.Color.Red\nnewItem.ForeColor\
    \ = System.Drawing.Color.White\nListView1.Items.Add(newItem)\n```\n\nYou can remove\
