- pgno: 105
  md: '# WORK WITH OPERATORS


    You can use operators to assign, compare, and manipulate the data that variables
    contain. For example, you use the assignment operator (=), the most common operator,
    to assign values to variables, as in the code, x = 8, which assigns the numeric
    value eight to the variable x.


    You can also use the equal sign as an operator in an equality test. For example,
    suppose the variable x = 8. You use a Boolean variable y to store a test like
    y = (x = 8). Because x is equal to eight, the test is true, and you set y to True.
    Other comparisons include inequality (<>), less than (<), greater than (>), less
    than or equal (<=), and greater than or equal (>=).


    Arithmetic operators include addition (+), subtraction (-), multiplication (*),
    and division (/). Integer division (\ ) and modulus arithmetic (mod) are also
    available.


    Logical operators enable you to perform logic testing on Boolean variables with
    the four standard operations being: And, Or, Not, and Xor. For example, suppose
    you have three Boolean variables, x, y, and z. In the code x = y Or z, if either
    y or z is True, you set x to True.


    Using the combination of available operators, you can create very complex expressions.
    For example, x = (20 * (y + z)) ^ (8 / 21) * 5 + z is a valid expression that
    uses variables y and z to compute an answer that VB .NET stores in x.


    # WORK WITH OPERATORS


    ![](img/d6f772854306e15fb6df39b861a7b541_105_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_105_1.png)


    # USING ARITHMETIC OPERATORS


    +   1 Declare the necessary variables.


    Note: See the section "Declare a Variable" to declare a variable.


    +   2 Type answer = (x * y) + z, replacing answer with the variable name to which
    you want to assign the expression and (x + y) * z with the expression.


    +   3 Type code to use the variable.


    # USING LOGIC OPERATORS


    +   4 Declare Boolean variables.


    +   5 Type answer2 = a Or b, replacing answer2 with the variable to store Boolean
    response, and a Or b with the expression.


    +   6 Type code to use the variable.'
