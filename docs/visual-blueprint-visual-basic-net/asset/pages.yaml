- pgno: 205
  md: '# USING NAMESPACES


    Namespaces provide a naming scheme for classes, components, and applications that
    helps to organize the enormous number of classes that make up an application.
    You use namespaces without being aware of them because all code in .NET exists
    within namespaces. The largest namespace in the .NET Framework is System. This
    namespace contains a number of other namespaces, like Drawing, which provides
    classes for drawing, and IO, which provides classes for file and socket input
    and output.


    The normal method of accessing a class, direct addressing, involves you typing
    the full namespace when you use the class name. For example, to create a Pen for
    drawing, you declare a variable using the full name System.Drawing.Pen. Although
    distinctive and easy to read, this name requires you to type a lot of characters
    when working with code.


    To save yourself time, you can use the Imports keyword to access components inside
    a particular namespace without specifying the namespace each time you use a class
    the namespace contains. You place the Imports statement at the top of a code module,
    above all modules and classes. The namespace to import follows the keyword. You
    can separate multiple namespaces on a single line using commas, and you can add
    as many Imports statements as necessary. Then, for any of your classes or modules
    inside the code module, you can access classes the namespace contains without
    specifying the namespace. For example, if you import the System.Drawing namespace,
    you can create a Pen using Dim var As Pen.


    Importing a number of namespaces into a code module can create conflicts of class
    names. If two classes have the same name in different imported namespaces, you
    need to specify enough of the namespace to distinguish the two classes.


    ![](img/d6f772854306e15fb6df39b861a7b541_205_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_205_1.png)


    1 Type Imports at the top of a code module on an empty line, outside of all modules
    and classes.


    2 Type the name of a namespace to import.


    3 Repeat steps 1 and 2 to import the necessary namespaces.'
  merge: -1
  img_proc: true
- pgno: 206
  md: "# Extra\n\nAlthough the namespaces provided by the .NET Framework appear as\
    \ a single entity, many of the large namespaces exist within distinct separate\
    \ DLLs. For example, the System.Data namespace resides in the System.Data.dll\
    \ and the System.Windows.Forms namespace resides within System.Windows.Forms.dll.\
    \ If you cannot access a particular namespace within a project, you need to reference\
    \ the appropriate DLL. See Chapter 12 for more information on adding a reference\
    \ to a DLL to a project.\n\nYou can use the Imports keyword to shorten the name\
    \ of a particular namespace. This saves you from typing a full namespace without\
    \ creating ambiguity for classes of the same names. You can specify an alias name\
    \ using the Imports keyword followed by an equal sign and the name of the namespace.\n\
    \n# Example:\n\n```\nImports winfrm = System.Windows.Forms\nPublic Class Class1\n\
    \    Sub Method1()\n        Dim btn As winfrm.Button\n    End Sub\nEnd Class\n\
    ```\n\n![](img/d6f772854306e15fb6df39b861a7b541_206_0.png)\n\n4 Inside a module\
    \ or class in the code module, type code that accesses a class within the namespace\
    \ without specifying the namespace.\n\n5 Press F5 to run your project.\n\n![](img/d6f772854306e15fb6df39b861a7b541_206_1.png)\n\
    \nVB .NET accesses the correct class without specifying the namespace without\
    \ direct addressing."
  merge: -1
  img_proc: true
- pgno: 207
  md: '# CREATE A NAMESPACE


    In Visual Basic .NET, all classes and components reside inside a namespace. This
    convention helps you to locate appropriate classes and eliminate naming conflicts.
    If you use a large number of classes in your application, you can create namespaces
    to separate the application into logical sections much like the .NET Framework
    splits its large number of classes.


    A .NET application contains at least one namespace. In VB.NET, a single namespace
    wraps the entire project and any namespaces inside it. VB.NET creates this namespace
    automatically when you create the project. The project properties page enables
    you to modify the name of the root namespace. By default the root namespace is
    the name of the project.


    To create a namespace inside the root namespace, use the Namespace block. Place
    the name for the namespace following the Namespace keyword. The End Namespace
    statement marks the end of the namespace in a particular file. In situations where
    you want to place classes from multiple files in the same namespace, create a
    namespace block in each file and use the same name for the namespaces. This enables
    you to spread classes across multiple files, but still include them in a single
    namespace.


    A class not located in a Namespace block has the full name ProjectRoot.Class.
    A class you place inside a Namespace block has the full name ProjectRoot.Namespace.Class.
    To access the class in classes outside of the namespace, you must specify the
    namespace and the class name. You can place namespaces inside other namespaces
    to create a hierarchy of components.


    The default accessibility for classes inside a namespace is Friend, which lets
    any other part of your application access the class. When you declare a class
    inside a namespace as Private, only other classes inside the namespace can access
    the class.


    # CREATE A NAMESPACE


    ![](img/d6f772854306e15fb6df39b861a7b541_207_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_207_1.png)


    1 In an existing project, create or open a module.

    Note: See Chapter 7 to add class modules.


    2 Type Namespace followed by a name and press Enter.


    VB.NET creates the End Namespace statement.

    3 Inside, the namespace block, create a set of new classes to wrap into a single
    namespace.


    Note: See Chapter 7 to create a class.

    Alternately, you can copy existing classes into the block.'
  merge: -1
