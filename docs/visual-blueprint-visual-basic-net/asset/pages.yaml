- pgno: 217
  md: '# AN INTRODUCTION TO DATABASES


    One of the most-used functions in the Visual Basic language''s history, powerful
    database support, provides many functions to automate the development of database
    applications. You can use databases to quickly and efficiently store large or
    small quantities of information of any type, as well as search, filter, and manipulate
    that data to suit your needs. In certain cases where you need to store only a
    small list of data, you can use text files to more easily store the information.
    For more information on reading and writing to text files, see Chapter 5.


    Visual Basic .NET and other Microsoft languages use a database system called ADO.NET,
    ADO, or Active Data Objects, allows you to wrap a set of standard functionality
    around any supported database format. For more information on the concepts of
    ADO.NET, see the section "An Introduction to ADO.NET."


    # DATABASE SOFTWARE


    A variety of programs allow you to create database files, and ADO supports most
    database formats. Common database packages to use with Visual Basic .NET include
    Microsoft Access, Microsoft SQL, and Oracle. Make sure the vendor of your database
    provides a native .NET data provider, or an OLEDB compatible provider. ADO.NET
    can work with databases that support one of these two providers.


    Microsoft Access is best suited for creating small databases that do not need
    to function under a heavy load. Microsoft SQL Server provides a more powerful
    database solution for large and high-load applications, such as Web development.


    # DATABASE STRUCTURE


    A database consists of one or more tables, and a table contains one or more records.
    Each record can have one or more fields that make up its data. Each field in the
    record contains a single piece of information about that record, such as a string,
    a number, or a date. For example, you can define a table in a database to store
    customer information. The table has a field for the customer''s first name, last
    name, address, and phone number. Then you can define individual customers by adding
    new records to the table.


    Database design is a very important part of creating an efficient, powerful, and
    maintainable application. You should carefully evaluate your data storage needs
    and create a database that fits those needs while providing flexibility for expansion.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'For ADO.NET to access a variety of data sources, it must have a common language
    that works with a variety of databases. You use Structured Query Language (SQL)
    to communicate with databases of any format. SQL provides a simple English-like
    instruction set that can accomplish any action a database supports.


    # SQL FEATURES


    IBM originally developed SQL in a prototype relational database management system,
    System R, in the mid 1970s. In 1979, Oracle Corporation introduced the first commercially
    available implementation of SQL. Since then, the entire database industry has
    adopted SQL to access their databases. With the help of ADO.NET''s ability to
    support different databases seamlessly, SQL enables you to move between different
    databases with few changes. For example, you can use Microsoft Access to develop
    your application, but move it to Microsoft SQL Server later.


    This introduction to SQL covers a minute part of its abilities. Many books dedicate
    their entire subject to SQL. SQL provides the ability to combine tables, filter
    data, and create powerful procedures. This book covers the major SQL commands
    necessary to retrieve, update, and modify records in a database.


    # SQL Statements


    You can use these four statements throughout this chapter to perform the necessary
    tasks.


    The SELECT statement retrieves information from tables. You specify the fields
    for the command to retrieve followed by a FROM clause. You follow the FROM clause
    with the name of the table that you want to use. You can use the optional WHERE
    statement to retrieve only the necessary data using standard comparison operators.


    ```

    Example:

    SELECT TotalBalance

    FROM Customers

    WHERE LastName = ''Smith''

    ```


    The INSERT statement adds a record into a table. After INSERT, specify INTO followed
    by the name of the table. After the table name, place the field names to set in
    parentheses. Then use the VALUES clause with the values for the fields in the
    same order enclosed in parentheses.


    ```

    Example:

    INSERT INTO Customers

    (LastName, FirstName, TotalBalance)

    VALUES (''Smith'', ''John'', 150.25)

    ```


    # SQL Clauses


    You use the WHERE clause to specify records on which the SELECT, UPDATE, and DELETE
    commands should function. You can use equal, less than, greater than, less than
    or equal, greater than or equal, or LIKE operators in the clause. When you use
    LIKE, you specify test string values containing wildcard characters. You can also
    use AND, OR, and NOT to combine multiple conditions.


    ```

    Example:

    WHERE Price < 10.50

    WHERE LastName LIKE ''S%''

    WHERE FirstName LIKE ''J__n'' AND LastName = ''Smith''

    ```


    You use the ORDER BY clause to specify how the SELECT command performs a sort
    on the data records it returns. After the ORDER BY clause, specify the field on
    which to sort the records. Place the DESC keyword after the field name to sort
    in descending order. If you want to sort on one field, then another, separate
    the sort fields by commas.


    ```

    Example:

    SELECT TotalBalance FROM Customers

    ORDER BY Price, Quantity DESC

    ```


    ```

    Example:

    SELECT TotalBalance FROM Customers

    ORDER BY LastName, FirstName

    ```


    The UPDATE statement changes fields in records that meet a given criteria. Type
    the table name after the UPDATE statement followed by the SET clause. You then
    specify field names and new values and use the WHERE clause to identify the records
    to alter.


    ```

    Example:

    UPDATE Customers

    SET TotalBalance = 560.50

    WHERE LastName = ''Smith''

    AND FirstName = ''John''

    ```


    The DELETE statement deletes records from the table that meet given criteria.
    After the DELETE statement, type FROM followed by the name of the table. Use the
    WHERE clause to identify the records to delete.


    ```

    Example:

    DELETE Customers

    WHERE LastName = ''Smith''

    AND FirstName = ''John''

    ```'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# AN INTRODUCTION TO ADO.NET


    The latest evolution in Microsoft''s database technologies, ADO.NET provides support
    for new functionality and programming methods. ADO.NET


    functions inside of the .NET Framework, allowing any .NET application to access
    its features in a similar way.


    # FEATURES


    Recently, through the evolution of the Internet, many developers now develop new
    client applications based on the Web application model. Many applications use
    XML to encode data to pass over network connections. Web applications use HTTP
    to communicate, and therefore must maintain state between requests. This new model
    differs from the connected, tightly coupled style of programming where a connection
    was held open for the duration of the program''s lifetime and no


    special handling of state, defined as the persistence of data across parts of
    an application, was required. ADO.NET was designed to meet the needs of this new
    programming model: disconnected data architecture, tight integration with XML,
    and common data representation with the ability to combine data from multiple
    and varied data sources, and optimizations for accessing data in different ways.


    # Consistency


    One of its major features, Microsoft database technology can work with multiple
    data sources consistently, thus providing consistent access to data sources such
    as Microsoft SQL Server and any data sources exposed via OLE DB. ADO.NET also
    includes inherent support for XML datasets. You can use ADO.NET to connect to
    data sources and retrieve, manipulate, and update data.


    # Similarities to ADO


    The design for ADO.NET maintains as many similarities to ADO as possible, while
    still addressing requirements necessary to support new disconnected functions.
    ADO.NET coexists with ADO. Although you commonly write new applications with ADO.NET,
    ADO remains available to the .NET programmer.


    # Powerful Object Model


    ADO.NET provides an Object Model with database features. This allows you to use
    the objects together with a database provider, or individually to work with custom
    application data.


    In addition, you still have the option to work with the database provider using
    SQL to execute commands and retrieve results directly.


    # Supports N-Tier Programming


    ADO.NET provides support for the disconnected, n-tier programming environment
    for which many Visual Basic .NET programmers need to develop. N-tier programming
    involves developing separate levels of the application — the presentation tier,
    the business logic tier, the data access and storage tier — that work together
    to provide the complete user experience.


    # XML Support


    To access data in a standard way, XML serves to encode and format data into a
    standards compliant format. A fundamental part of their applications, developers
    need XML to function as a data source. For this reason, XML builds its support
    into ADO.NET at a very fundamental level. The core of the entire .NET Framework,
    the XML class framework allows you to cross between the two libraries easily.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# USING ADO.NET


    # Disconnected Recordsets


    Although previous versions of ADO added disconnection as an afterthought, ADO.NET,
    through major changes in design, focuses its functionality around disconnected
    data. When you connect to a database, you actually load all of the data in tables
    of the database into the client application''s memory. ADO.NET performs all of
    the data manipulation to these in-memory copies of the table information. When
    the user finishes with the form or application, and makes changes to the database,
    you can reconnect to the database. ADO.NET looks through the in-memory data and
    makes changes to synchronize the two.


    Because of disconnection, you must carefully design your database. Large tables
    may perform poorly when you load them into memory. To improve speed, you must
    filter only necessary data down to a particular client. Also, multiple users can
    connect to a database, retrieve a table, make changes, and update the same records.


    # Object Model


    In ADO.NET, the Object Model recreates all of the functionality present in a database
    system. The Object Model must replicate the database contents because the database
    does not stay connected to the client. The DataTable object represents a single
    table of a database, and consists of DataColumn objects, which define the fields,
    and DataRow objects, which store the records of the table. A DataTable resides
    in a DataSet object, which is the main wrapper control, and can hold any number
    of tables. The DataSet object also allows you to create relationships between
    tables using DataRelation objects. These objects, the core set of data for storage
    and manipulation, allow you to bind the data to controls, whether the components
    connect to an actual database or not.


    # ADO.NET OBJECTS


    The connection and adapter components provide the basic ability for connecting
    to a database, while the DataSet provides storage in memory for everything that
    makes up tables and relationships. See the section "Add a Connection to a Form"
    for more information. The table, row, and column objects provide the underlying
    data and manipulation abilities for the DataSet object.


    # DbConnection


    To attach a database to your application, you first create a data connection object.
    Microsoft includes two components that implement the DbConnection interface, OleDbConnection
    and SqlConnection. The OleDbConnection components allow you to connect to any
    database that the OLEDB interface supports, and SqlConnection allows you to connect
    to a Microsoft SQL Server database. This chapter develops database applications
    using the SQL connection classes, but you can substitute the use of OLEDB classes
    because they use the same interfaces, methods, and properties.


    # DataSet


    The DataSet component is the major component for retrieving and manipulating information.
    The DataSet object stores a set of tables from the database, including their field
    definitions and all of the associated data. Controls can bind to the DataSet or
    contained tables to view or modify the data.


    # DataAdapter


    A data adapter provides the conduit for connecting a DbConnection to the objects
    in ADO.NET that actually store and manipulate the database information. For a
    particular connection component, you must have a specific adapter that understands
    how to communicate with the connection. Microsoft provides the SqlDataAdapter
    and the OleDbDataAdapter, depending on which DbConnection you use.


    # DataTable


    The DataTable object represents a single database table. Because the database
    source disconnects, this object must provide all the abilities of an actual database
    table. The DataTable object relies on DataColumn objects to define the fields
    of the table and DataRow objects to store the actual data of the table. See the
    section "Work with Data Tables" for more information on the DataTable object.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# CREATE A DATABASE CONNECTION


    To access a database in an application, you must create a connection to it via
    the Server Explorer. You can attach a number of database formats to your application
    using ADO.NET, which provides the same interface to multiple formats.


    When you open the Server Explorer window in the Development Environment, it presents
    a list of the current database connections. The Server Explorer also displays
    a list of servers, which allow you to access remote data objects. From the Server
    Explorer window, you can access the Data Link Property dialog box. Here, you can
    create a new connection, tell VB .NET what type of data provider to use, and name
    the database. For databases that support password protection, you see options
    to enter the appropriate password, which allows you to connect to the database.


    You can access a list of advanced settings when creating the connection. These
    settings, which depend on the data


    provider you use, enable you to edit access permissions for the application’s
    connection and specify connection timeouts.


    After you create the connection, VB .NET shows you the database in the Server
    Explorer and lists all of the tables, views, and stored procedures available in
    the database. You can edit the database contents directly in Visual Basic .NET
    via the tables in the Server Explorer. This allows you to make quick changes to
    test data before you complete the entire application interface.


    Adding a connection to the Server Explorer does not change your project. The Server
    Explorer stores database connections independently. Only when you add the connection
    to a form does the database actually become a part of your project. For more information
    on adding a connection you create in the Server Explorer to a form, see the section
    “Add a Connection to the Form.”


    # CREATE A DATABASE CONNECTION


    ![](img/d6f772854306e15fb6df39b861a7b541_221_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_221_1.png)


    1 Access the Server Explorer window.

    2 Click the Connect to Database button ( ).

    Note: Click View > Server Explorer if you do not have the Server Explorer open.


    The Data Link dialog box appears.

    3 Click the Provider tab.

    4 Select the appropriate database provider for your data.


    The example uses the Microsoft OLE DB Provider for SQL Server.

    5 Click Next.'
