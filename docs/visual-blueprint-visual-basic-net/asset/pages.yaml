- pgno: 43
  md: '# ADD A CONTROL TO A FORM


    You can use controls to provide the basic user interface to your program. A control
    is a special component designed to provide a visual interface on Windows Forms.


    Standard controls you may see in applications include buttons, menus, toolbars,
    check boxes, radio buttons, and text boxes. You may not realize that the text
    on the form is actually a Label control, or the frame around a group of radio
    buttons is actually a GroupBox control. Many controls only provide layout and
    visual cues. See Chapter 3 for more information on these controls.


    If the control is a hidden component and does not need form real estate, like
    the Timer, MainMenu, or ErrorProvider control, it loads into an area provided
    inside the form designer called the Component Tray. All of your hidden components
    appear here. You can still click them to edit their properties.


    When you add a control to the form, it becomes selected automatically, and if
    you open the Property Window, the properties are shown for the selected control.
    For more information about modifying properties, see the section "Set a Property."


    The controls that VB .NET provides are not the only controls you may use. The
    CD-ROM included with this book contains a variety of trial versions of components
    that you can add into your applications seamlessly. For more information on loading
    new components into your project and building your own controls, see Chapter 12.


    You do not need to use controls to provide an interface. For example, in a game,
    you might choose to paint on the entire surface of the form, and therefore provide
    your own custom controls in the interface. See Chapter 5 for more information
    regarding graphics commands.


    # ADD A CONTROL TO A FORM


    ![](img/d6f772854306e15fb6df39b861a7b541_43_0.png)


    +   1. Create a new Windows Application project or open an existing one.

    +   2. Double-click the form in the Solution Explorer to open it if necessary.

    +   3. Click any control from the Toolbox.


    Note: For more information on creating a project, see the section "Create a Windows
    Application."


    Note: If you do not have the Toolbox opened, click View ▸ Toolbox.'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# Apply It\n\nCertain controls have the ability to contain other controls and\
    \ are called container controls. Controls like Panel, GroupBox, and TabControl\
    \ can all hold other controls inside their client space. Hidden components such\
    \ as Timer, MainMenu, ContextMenu, and the common dialog box components do not\
    \ load onto the form as an icon, as they did in previous versions of Visual Basic.\
    \ Instead, they load into an area at the bottom of the Form Designer called the\
    \ Component Tray. Clicking these entries enables you to edit their properties\
    \ just like any other control.\n\nYou can create controls in code dynamically\
    \ at runtime. This process is simple, and is actually the same process the IDE\
    \ uses to create the controls you define in the Form Designer. Add this code to\
    \ create a new list box control when a user clicks a button.\n\n```\n```vb\nPrivate\
    \ Sub Button1_Click(ByVal sender As System.Object, _\n    ByVal e As System.EventArgs)\
    \ Handles Button1.Click\n    Dim NewListBox As New ListBox()\n    ' Define Left,\
    \ Top\n    NewListBox.Location = New Point(50, 50)\n    ' Define Width, Height\n\
    \    NewListBox.Size = New Size(200, 300)\n    ' Edit the control before it becomes\
    \ visible\n    NewListBox.Items.Add(\"Sample item\")\n\n    Me.Controls.Add(NewListBox)\n\
    End Sub\n```\n```\n\n**TYPE THIS:**\n\n**RESULT:**\n\nWhen the button is pressed,\
    \ a new list box is added to the form.\n\n![](img/d6f772854306e15fb6df39b861a7b541_44_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_44_1.png)\n\n+   4. Add the control\
    \ onto the form by clicking and holding the mouse button where you want the top-left\
    \ corner to begin.\n+   \n+   5. Release the mouse button at the bottom-right\
    \ corner when you have achieved the proper size.\n+   \n+   6. Press F5 to run\
    \ your project.\n+   \n+   ▪ The new control appears on the form."
  merge: -1
  img_proc: true
- pgno: 45
  md: '# SET A PROPERTY


    Properties provide the basis of a component’s functionality, be it a form, dialog
    box, or control. You use properties to make a component look and function in a
    certain way. A property is actually an object-oriented programming (OOP) term:
    properties are used to describe a particular object.


    For example, the most common property for visual components is the Text property.
    Earlier versions of Visual Basic had two separate properties, Caption and Text;
    Caption has been removed for standardization. By altering the Text property, you
    can change the description of the component. In the Text property of most controls,
    you can add an ampersand (&) before a particular letter to make the following
    letter function as the accessibility key for the control. For example, if the
    text of a control consists of Na&me, it appears as Name with an underscore under
    the letter m, and allows the user to press Alt+M to access the control.


    You can alter a form or control’s properties with two different methods. You can
    alter properties in code, or in the Forms Designer using the Property Editor.
    When you alter properties in the Property Editor, the IDE automatically adds the
    code for the change you make into the InitializeComponents subroutine, which the
    form’s New method calls. To learn more about New methods, see Chapter 7.


    The Property Window splits properties into various categories. You can collapse
    these categories if you do not often use them. The first category, Accessibility,
    contains properties to make your program accessible to the handicapped, and you
    can learn more about it in Chapter 13.


    Appearance contains properties such as BackColor, which changes the background
    color of the component. Font changes the default font the component uses to draw.
    You can use unique properties like BackgroundImage to load a picture into a form’s
    background. For an introduction to the multitude of properties for a form, see
    the section "Introducing Windows Forms."


    ![](img/d6f772854306e15fb6df39b861a7b541_45_0.png)


    +   1. Create a new Windows Application Project or open an existing one.


    +   2. Right-click the form or a control on the form and click Properties.


    +   You can also press F4 to access the Property window.'
  merge: -1
  img_proc: true
- pgno: 46
  md: "# Extra\n\nAlthough not truly a property, one item listed out of convenience\
    \ in the Visual Basic Property Editor is Name, which allows you to set the name\
    \ of the component for the purpose of accessing the component in code without\
    \ being forced to use assigned names like Button1 or Form1. You cannot access\
    \ Name from code.\n\nA common notation to use when naming controls and variables\
    \ is called Hungarian notation. This involves placing a three-character identifier\
    \ in front of the descriptive name. For example, you might call a button that\
    \ reads Cancel btnCancel. This enables you to easily read your code and see the\
    \ type of component to which any given name refers.\n\nBy expanding the Windows\
    \ Forms Designer Generated Code section, you can see how the IDE generates the\
    \ components, properties, and so on. Be careful not to change this code, or the\
    \ Form Designer may no longer function as expected.\n\nYou can select whether\
    \ to display the properties in categories or alphabetically. The default is categorically\
    \ in VB. NET. To do this, click the tool button on the properties window that\
    \ has an A-Z with a downward arrow on it. Pressing the button adjacent to it changes\
    \ the display order back to categorical.\n\n```\nExample:\nPublic Class Form1\n\
    \    Inherits System.Windows.Forms.Form\n    + Windows Forms Designer Generated\
    \ Code\n    ...\nEnd Class\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_46_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_46_1.png)\n\nThe Property window appears\
    \ below the Solution Explorer.\n\nEdit a property by clicking the property name\
    \ in the Properties window.\n\nType or select the appropriate value and press\
    \ Enter or click somewhere out of the edit area to save the change.\n\nPress F5\
    \ to run your project.\n\nVB .NET shows the form with any property changes you\
    \ have made.\n\nYou can click the form's Close button (X) to return to the IDE."
  merge: -1
  img_proc: true
- pgno: 47
  md: '# WRITE EVENT CODE


    You use event code to provide interaction between the software and the user. Properties
    provide the base of a form''s ability. Events finalize this base by allowing components
    to interact. For example, if the user presses a key, Visual Basic .NET fires one
    or more events that a form, control, or class can capture and respond. Without
    events, your user sees a complete application with forms, controls, properties,
    and methods, but nothing can interact with the user.


    The Code Editor provides a list of the available components on the form in the
    Class Name drop-down list located on the left side of the code window toolbar.
    To create an event handler for the form itself, select (Base Class Events). The
    form also lists an Overrides section that you can use to override members of the
    form. For more information on overriding, see Chapter 8.


    To provide an event handler for a control, you select the actual control name
    from the Class Name list. Upon selecting a control or the form''s base class events,
    you can select from the full listing of possible events available to the form
    or control in the Event List drop-down list, located on the right side of the
    Code Editor toolbar.


    Selecting an event from the list in the Code Editor causes the Visual Basic .NET
    IDE to create a procedure to hold your event code. Of the two arguments passed
    to an event procedure, the first is sender, which in most cases is the object
    where the event is defined. The second argument, far more useful, named e, contains
    all of the actual event information. For example, in a Paint event, which occurs
    when the form needs to redraw itself, e contains references to the Graphics object
    of the form, which is necessary to call graphics commands.


    ![](img/d6f772854306e15fb6df39b861a7b541_47_0.png)


    +   1 Open an existing form.


    +   2 Right-click the form and click View Code.


    +   You can also open the Code Editor by simply double clicking the form.


    +   3 Click the class list.


    +   4 Click (Base Class Events) to list form events.


    +   Alternately, you can click a control''s name to list that control''s events.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Extra


    The type of events you use can create more or less interaction, depending on what
    is necessary for your application. Small but useful interactions can include changing
    labels or colors in the control as the user moves their mouse around. Most visual
    controls provide MouseEnter, MouseLeave, and MouseHover events. These events fire
    when the mouse enters the control, leaves the control, and stays on top of the
    control for a few moments, respectively.


    Not all events are in response to user interaction. All visual controls and the
    form itself have a Paint event. In this event, you provide code to draw directly
    onto the surface of the control. For example, you can draw a pattern in the background
    of a button. This event triggers anytime all or part of the control or form invalidates.
    Invalidation is when some part of the control or form needs to redraw. You can
    force a control or form to invalidate by using the Invalidate method of the component.


    ![](img/d6f772854306e15fb6df39b861a7b541_48_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_48_1.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# RESIZE CONTROLS


    You can give the main application window and dialog boxes the ability to change
    sizes based on a user’s preference. In previous versions of Visual Basic, this
    involved writing a long and sometimes complex resize event handler. Now, however,
    each component in VB.NET provides properties to resize without requiring any code.


    Each control contains two properties for resizing: Anchor and Dock. Anchor lets
    you select sides of the control you want to anchor to container borders. The Left
    and Top anchors hold the control at exactly the same relative location from the
    left or top of the form. The Right and Bottom anchors hold that side of the control
    to the same position relative to the right or bottom of the container.


    For example, if you set the Anchor for a control to Left, Right, the control holds
    to the left side and stretch proportionately out in the right directions when
    you resize the form. The top and bottom of the control, not anchored, move up
    and down as you resize the form to maintain a proportionate amount of space to
    both the top and bottom sides of the container.


    The Dock control lets you dock a control to the left, right, top, or bottom edge
    of the form. For example, if you dock a control to the top of screen, the control
    maintains the assigned height, but automatically moves to the top of the screen
    and spreads the width of its container. You can also set Dock to Fill, and the
    control fills the entire client area.


    The container form or control has a property DockPadding that lets you set the
    amount of space left around a docked control in each direction. By default, a
    control is added to the form with Anchor set to Left, Top.


    # RESIZE CONTROLS


    ![](img/d6f772854306e15fb6df39b861a7b541_49_0.png)


    # DOCK THE CONTROL


    +   1. Create a new Windows Application project or open an existing one.

    +   2. Open the form that you want a user to resize.


    +   3. Add a control anywhere on the form. The example uses button controls.

    +   4. Change the control’s Dock property.


    Note: See the section "Add a Control to a Form" to add a control and "Set a Property"
    to edit a property.


    +   In the example, Dock is set to Top. The control positions itself at the selected
    border.


    # ANCHOR THE CONTROL


    +   5. Change the control’s Anchor property.

    +   In the example, another button was added with the Anchor property set to Bottom,
    Left, Right.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Extra


    While automatic resizing using Anchor and Dock is very powerful, you may find
    that this does not meet your needs for a complex or custom-designed form. In this
    case, VB.NET provides a more sophisticated system. You can resize all of your
    controls by hand by using the Resize event. This event is called whenever you
    resize, maximize, minimize, or restore the form. Simply use the form''s dimensions,
    which you can retrieve using the Size.Width and Size.Height members of the form.
    Then move and resize the controls accordingly. You can move a control by editing
    its Location.Left or Location.Top properties, or reassigning the entire Point
    structure by using Location = New Point(Left, Top). Utilize Size.Width and Size.Height
    to resize the control, or use a Size structure like Size = New Size(Width, Height).
    You can also use the manual resize event for some controls, and Anchor and Dock
    for others. Be careful when a user minimizes the form, or happens to make the
    form very small, because your calculated values may create negative values for
    width and heights and cause your program to have a run-time error.


    # SPREAD TO FORM DIMENSIONS


    +   6 Add a control to the form.

    +   7 Size the control to take up the remaining space on the form.


    +   8 Set the Anchor property to Top, Bottom, Left, Right.

    +   9 Run the project by pressing F5.


    When you resize the form, everything sizes properly.


    ![](img/d6f772854306e15fb6df39b861a7b541_50_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_50_1.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# ADD A MENU


    You can use menus to provide a convenient way to access the main functionality
    of the form. Menu bars are a standard part of most Windows applications.


    Simple utilities may not need them, but on the whole, menus provide an easy way
    for a user to learn and access the various functions in a hierarchical matter.
    Also, menus allow users to progress in a freely chosen order, rather than an order
    provided by other interfaces such as buttons or lists.


    Visual Basic .NET adds simplicity to creating menus. Visual Basic 6.0 and earlier
    relied on an external dialog box called the Menu Editor. VB .NET integrates menu
    editing with the Windows Form Designer.


    To create a menu, you access the Toolbox and select the MainMenu control, which
    adds a hidden MainMenu control in the Component Tray, and adds a menu bar with
    a single empty menu title. You can add a caption to replace the placeholder menu
    title to create a menu title and an empty submenu. You can quickly create an entire
    menu system using this method.


    You can assign access keys to menu items by placing an ampersand before the letter
    to use as the shortcut. For example, to make a file menu that a user can access
    by pressing Alt-F, set the Text to &File.


    You can assign shortcuts to controls using the Shortcut property. You set the
    ShowShortcut property to True if you want to have the shortcut appear to the right
    of the menu item.


    ![](img/d6f772854306e15fb6df39b861a7b541_51_0.png)


    +   1 Create a new Windows Application project or open an existing one.


    +   2 Open the Toolbox.

    +   Note: If you do not have the Toolbox opened, click View > Toolbox.


    +   3 Double-click the MainMenu control.

    +   The MainMenu control appears in the Component Tray.


    +   4 Click the first menu title item.


    +   5 Type a title.


    +   6 Press Enter to save it.


    +   7 Add to the menu by typing items downwards.

    +   You can type a dash to create a divider, or right-click the edit area and
    then click Insert Separator.'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# Extra\n\nEach menu item has a number of properties you can individually modify.\
    \ MenuItem1.Visible = False hides a menu item. MenuItem1.Enabled = False grays\
    \ out menu items. You use these properties to dynamically change the menu based\
    \ on the current state of the application. For example, for a File menu with the\
    \ items New, Open, and Save, you can disable the Save item when your application\
    \ has no changes by adding code to the File menu item's click event.\n\nYou can\
    \ create menu items dynamically in code as the program runs, by creating a new\
    \ menu item using Dim, setting its properties, and then adding it to the parent\
    \ menu of your choice.\n\n# Examples:\n\n# Example of dynamic menu changes:\n\n\
    ```\nPrivate changes As Boolean = False\nPrivate Sub MenuItem1_Click(ByVal sender\
    \ As _\nSystem.Object, ByVal e As _\nSystem.EventArgs) Handles MenuItem1.Click\n\
    \n    If changes Then\n        FileSaveMenuItem.Enabled = True\n    Else\n   \
    \     FileSaveMenuItem.Enabled = False\n    End If\nEnd Sub\n```\n\n# Example\
    \ of creating menu items dynamically:\n\n```\nDim NewMenuItem As New MenuItem()\n\
    NewMenuItem.Text = \"Text for new menu item\"\nNewMenuItem.Shortcut = _\nSystem.Windows.Forms.Shortcut.ShiftF1\n\
    MenuItem1.MenuItems.Add(NewMenuItem)\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_52_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_52_1.png)\n\n# CREATE A SUB MENU\n\n\
    +   8 Click any MenuItem.\n+   9 Click the placeholder to the right of the MenuItem.\n\
    +   10 Type a caption and press Enter.\n\n# SET A SHORTCUT\n\n+   11 Click a MenuItem.\n\
    +   12 In the Property Window, select a new shortcut key press for the Shortcut\
    \ property.\n\n+   13 Press F5 to run the project.\n+   Your project loads and\
    \ a menu bar is provided across the top of the form.\n\n> Note: If you cannot\
    \ see the access keys for menus when viewing the form, press and hold the Alt\
    \ key to make them appear."
  merge: -1
  img_proc: true
- pgno: 53
  md: '# CREATE A CONTEXT-SENSITIVE MENU


    You can use context sensitive menus to provide a list of options relevant to the
    specific area the user clicks. Context menus are sometimes referred to as "right-click
    menus" because you normally use the right mouse button to access them. Context-sensitive
    menus have existed since the introduction of Windows 95, and now context menus
    are a required feature to pass Microsoft''s compatibility tests.


    To add a context menu to a form, you add a new ContextMenu control and define
    the menu exactly like a standard menu. For more on creating menus, see the section
    "Add a Menu." There is no ability to name the menu title, because context menus
    appear from controls and not from the menu bar. Then use the ContextMenu property
    provided by all visual controls and the form itself, and pick the appropriate
    ContextMenu control to associate with it.


    Only one MainMenu control should exist on a single form. That is not true with
    ContextMenu controls. An individual ContextMenu control should exist for most
    major visual components on the form.


    To add and remove items from the context menu during program execution, you can
    manipulate the item collection provided by the MenuItems property of the context
    menu component. Declare an instance of a MenuItem object and then pass this object
    to the MenuItems.Add method as the only parameter. Also, if you want to duplicate
    the contents of a main menu inside a context menu, you can copy and paste during
    design-time, or you can add code at run-time to make a copy of a menu. Simply
    access the MenuItem from the main menu and call its CloneMenu method. Pass the
    new MenuItem object this method creates to the Add method of the MenuItems collection
    in the ContextMenu control.


    # CREATE A CONTEXT-SENSITIVE MENU


    ![](img/d6f772854306e15fb6df39b861a7b541_53_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_53_1.png)


    +   1 Open the default form in a new Windows Application project.

    +   2 Double-click the ContextMenu control in the Toolbox.


    +   3 Click the placeholder for the first menu item.

    +   4 Type a caption for the menu item.


    +   5 In the Toolbox, click the control to add that you want to assign the context
    menu.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "# Apply It\n\nContext menus are an easy way to make your program more functional.\
    \ Many users expect to see the functionality of an item when they right-click\
    \ it. In most cases, you must place the same functionality located in the context\
    \ menu as buttons on the form or in the main menu. To do this poorly, you replicate\
    \ the code in both a context menu item’s click event and the button or main menu’s\
    \ click event.\n\nIt pays to make your main code sections in separate procedures\
    \ instead of simply locating the code directly in events. This way, if you have\
    \ a button on the form and a context menu with the same function, you can reuse\
    \ the code. For this code to work, use the example presented below in the steps,\
    \ and add a button to the form. For more information on handling events, see Chapter\
    \ 2.\n\n# TYPE THIS:\n\n```\nPrivate Sub RemoveSelectedListItems()\n    If ListBox1.SelectedItem\
    \ Is Nothing Then\n        MsgBox(\"Select an item to remove.\")\n    Else\n \
    \       ListBox1.Items.Remove(ListBox1.SelectedItem)\n    End If\nEnd Sub\n\n\
    Private Sub MenuItem1_Click(...)\n    RemoveSelectedListItems()\nEnd Sub\n\nPrivate\
    \ Sub Button1_Click(...)\n    RemoveSelectedListItems()\nEnd Sub\n```\n\n# RESULT:\n\
    \nBoth the button and the context menu function properly.\n\n![](img/d6f772854306e15fb6df39b861a7b541_54_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_54_1.png)\n\n+   6 Add the control\
    \ to the form.\n+   The example adds a control to the form.\n+   Note: To add\
    \ controls to the form see the section \"Add a Control to the Form.\"\n\n+   7\
    \ Set the ContextMenu property of the ListBox to context menu you just created.\n\
    +   8 Press F5 to run your project.\n\n+   9 Right-click your control to see your\
    \ context menu appear.\n\nThe ContextMenu control provides the menu you create\
    \ when you right-click the appropriate control."
  merge: -1
