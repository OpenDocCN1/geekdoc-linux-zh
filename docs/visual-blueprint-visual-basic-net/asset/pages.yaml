- pgno: 283
  md: '# CREATE A WEB SERVICE


    A Web service is an ASP.NET file that provides an object with a set of methods
    that your application can access over an Internet connection. You can create a
    Web service project and a corresponding set of objects that you can access from
    any other XML-enabled application over the Web.


    To create a Web service project, you select the ASP.NET Web Service template from
    the New Project dialog box. Upon selection, VB .NET creates one service class
    and names it the same as the project name given. You use this name to access Web
    methods of the service.


    Each ASMX service class file represents a separate Web service. You can create
    other classes in the project, but unless you want to make them available over
    the Internet, do not inherit from the System.Web.Services.WebService base class.
    Only one Web service class can exist in a single code module file. ASP.NET ignores
    other classes you add to the code module


    even if they inherit from the WebService base class. Each project can contain
    multiple ASMX files, with each holding a separate Web service.


    A Web service project can contain Web Forms pages as well. You can add Web Forms
    from the Project menu. For more information on adding a Web Form to a project,
    see Chapter 10.


    To specify the namespace and other properties of the service, you add the attributes
    to the class identifier, which is the line that specifies the Class keyword. Place
    WebService() inside of arrow brackets (< >) as the first entry on the Class statement
    line. Specify properties of the WebServiceAttribute class by using the name of
    the property followed by a colon, an equal sign, and the value.


    The Description property specifies a textual description that specifies information
    about the abilities of the service. The Namespace property lets you assign a namespace
    to the Web application.


    ![](img/d6f772854306e15fb6df39b861a7b541_283_0.png)


    1 Click File > New > Project in the Development Environment.


    2 Click Visual Basic Projects if it is not selected.


    3 Click ASP .NET Web Service in the project template list.


    4 Type a name for the service project.


    5 Click OK.'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# Extra


    You can use namespaces to provide distinct names for your Web service. Distinct
    names enable clients to easily access the class they want. Namespaces also play
    an important part in making Web services function. Because of the vastness of
    the Web, more opportunity exists for classes to fall under the same name. Because
    of this, Web services require a namespace defined by a Universal Resource Identifier
    (URI). You define a URI much like any Web address except this URI functions only
    as a naming resource, and does not provide a link to an actual resource available
    on a server. The URI serves as the default XML namespace for the service. You
    should make the URI specify a unique domain you own. In fact, you can use the
    location of the Web service for its namespace identification.


    # Example:


    ```

    <WebService(Namespace:="http://www.mycomp.com/Webservices/", Description:="This
    class does something important.")>

    Public Class VB.NETWebService

    ...

    End Class

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_284_0.png)


    The Development Environment creates the project and opens the component view of
    the service class.


    6 Click here to switch to code view link.


    The Code Editor loads.


    You can delete the sample code the template displays.


    7 On the line of the class declaration, type <WebService (Description:="Sample")>,
    replacing Sample with a description of your service.


    You can now add methods to your service.


    > Note: See the section "Add a Web Service Method" for more information.'
