- pgno: 137
  md: '# USING THE PRINTDOCUMENT CONTROL


    Users expect solid printing abilities in any application. The computer monitor
    does not provide the resolution to make reading completely comfortable. You can
    use the PrintDocument control to provide the foundation of a printing system in
    your Windows Forms application.


    VB.NET integrates all printing facilities into a combined system that works together.
    A PrintDocument provides you with a surface to draw contents onto the pages of
    your document. The PrintDocument control appears in the Toolbox under Windows
    Forms.


    To begin printing the document, you call the object''s Print method. Because of
    the integration, a variety of dialog boxes work with the PrintDocument control.
    See the section "Using the Printer Dialog" to provide a PrintDialog control to
    present printer options to the user. A Page Setup dialog box lets the user set
    up margins and page sizes; for details, see the section "Using the Page Setup
    Dialog."


    When it receives a print command, the PrintDocument fires the BeginPrint event.
    This lets you perform initialization. For more information on events, see Chapter
    2. After BeginPrint completes, the PrintPage event fires. You then draw the page
    onto the Graphics object provided by the event argument e. For more information
    on graphics, see Chapter 6. The event''s argument also provides a MarginBounds
    rectangle, which gives you the prescribed boundaries to print within. The e.PageSettings
    provides a list of all the settings the PrintDocument uses to process the print
    job.


    When you finish drawing a page, you must determine if your application needs to
    print another page. Set e.HasMorePages equal to True if you need to print another
    page and False otherwise. If you set HasMorePages to True, the event fires again.
    The current number of the event expects you to print is not available. You need
    to use module level variables to store information about previously printed pages.


    # USING THE PRINTDOCUMENT CONTROL


    ![](img/d6f772854306e15fb6df39b861a7b541_137_0.png)


    +   1 In a form of a Windows Application project, double-click the PrintDocument
    control in the Toolbox.


    +   2 In the Properties window, type a name for the document in the DocumentName
    property.


    +   3 Double-click the control you want the user to press to begin printing.


    +   4 Type PrintDocument1.Print(), replacing PrintDocument with the name of the
    control.


    +   5 In the module level, declare necessary storage variables.


    +   6 Click the PrintDocument control from the component list.


    +   7 Click the PrintPage event from the event list.


    +   The default event of the control appears in the Code Editor.'
  merge: -1
  img_proc: true
- pgno: 138
  md: "# Apply It\n\nYou can create a simple text file printer using a combination\
    \ of the PrintDocument and Stream commands. For this code to work, you need a\
    \ Button named Button1 and a PrintDocument named PrintDoc.\n\n# TYPE THIS:\n\n\
    ```\nPrivate printFont As New Font(\"Arial\", 10), streamToPrint As IO.StreamReader\n\
    \nPrivate Sub Button1_Click(ByVal sender As Object, ByVal e As EventArgs)\n  \
    \  streamToPrint = New IO.StreamReader(\"C:\\My Documents\\MyFile.txt\")\n   \
    \ PrintDoc.Print()\nEnd Sub\n\nPrivate Sub PrintDoc_PrintPage(ByVal sender As\
    \ Object, ByVal e As _\nSystem.Drawing.Printing.PrintPageEventArgs)\n    Dim linesPerPage\
    \ As Single = e.MarginBounds.Height / printFont.GetHeight(e.Graphics)\n    Dim\
    \ line As String = Nothing, count As Integer, yPos As Single = 0\n    For count\
    \ = 0 To linesPerPage - 1\n        line = streamToPrint.ReadLine()      ' print\
    \ each line of file.\n        If line Is Nothing Then Exit For    ' no more lines\
    \ in file\n        yPos = e.MarginBounds.Top + count * printFont.GetHeight(e.Graphics)\n\
    \        e.Graphics.DrawString(line, printFont, Brushes.Black, _\n           \
    \ e.MarginBounds.Left, yPos, New StringFormat())   ' output line of text\n   \
    \ Next\n    If Not (line Is Nothing) Then e.HasMorePages = True    ' print another\
    \ page?\nEnd Sub\n```\n\n# RESULT:\n\nThe text file prints to the default printer.\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_138_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_138_1.png)\n\
    \nVB .NET creates the event handler.\n\n8 Declare a variable to access the Graphics\
    \ object.\n\n9 Type code to draw onto the page.\nNote: See Chapter 5 for information\
    \ on graphics commands.\n\n10 Type code to set HasMorePages.\n\n11 Press F5 to\
    \ run the project.\n\nWhen the appropriate method or event runs, the pages generate\
    \ and print to the printer."
  merge: -1
  img_proc: true
- pgno: 139
  md: '# USING THE PRINTER DIALOG BOX


    Before an application prints, it often presents a Printer selection dialog box
    to let the user select which printer to use and any printer driver options, such
    as draft mode. You can add the Print dialog box to your application using the
    PrintDialog control.


    The PrintDialog control is available in the Windows Form section of the Toolbox.
    A required property for the function of the PrintDialog control is Document. You
    must set this property to a valid Document provided by a PrintDocument control.


    Other than the Document property, you can edit properties to determine what functions
    to make available to the user. AllowPrintToFile enables or disables the "Print
    To File" checkbox. If AllowPrintToFile is True and the user checks the box, the
    PrintToFile property is set to True. AllowSelection enables or disables the range
    selector boxes, which enable the user to print only a particular range of pages.
    AllowSomePages enables or disables the box where the user can enter a selection
    of pages either individually or by range. If you enable these properties, the
    PrintDocument control manages the correct pages to print.


    To make the dialog box appear, invoke the ShowDialog method with no arguments.
    The method returns a DialogResult specifying either OK or Cancel. For more information
    on DialogResult, see Chapter 3. If the user clicks OK, the PrinterDialog sets
    the dialog box settings to the PrinterSettings of the PrintDocument component.
    If you call the ShowDialog method and the user does not have any defined printers,
    a message appears notifying the user how to add a printer and the DialogResult
    returns Cancel. You can use the Reset method to clear any previous settings the
    user has made and reset the dialog box to defaults.


    The example uses a Button control to activate the Print dialog box. You can use
    a variety of controls such as a toolbar or menu as well.


    ![](img/d6f772854306e15fb6df39b861a7b541_139_0.png)


    +   1. Open a form in a Windows Application project.

    +   2. Add and configure a PrintDocument component on the form.


    > Note: See the section "Using the PrintDocument Control" to add a PrintDocument
    to the form.


    +   3. In the Toolbox, double-click the PrintDialog control to add it to the form.

    +   The control appears in the Component Tray.


    +   4. In the Properties window, click the Document and select PrintDocument control.

    +   You can optionally set other properties and toggle preference properties like
    AllowSelection by double-clicking the property name.


    +   5. Open the method or event where the Printer dialog box needs to appear.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# PROVIDE INPUT AND OUTPUT


    # Extra


    The PrinterSettings object of the PrintDocument component provides a number of
    properties that set up how the document prints, and what features the selected
    printer supports. You can use the PrinterSettings.PrintRange property to determine
    the print range the user selected. The property contains one of the values available
    in the PrintRange enumeration: AllPages, if the user selects to print all of the
    pages in your application''s document, Selection, to print only the information
    the user previously selected in the application, or SomePages. If the value is
    SomePages, the user entered a range they want your application to print. You can
    access this range using the FromPage and ToPage properties of the PrinterSettings
    object. A number of properties return information about the printer the user selects.
    The SupportsColor property returns True if the printer supports color printing,
    and False if it does not. The PaperSizes property maintains a collection of the
    paper sizes the printer supports, and PaperSources maintains a collection of the
    print trays available for the printer. For a full list of the properties available
    in the PrinterSettings object, you can search Visual Basic .NET Help by typing
    PrinterSettings members.


    ![](img/d6f772854306e15fb6df39b861a7b541_140_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_140_1.png)


    6 Type code to show the dialog box and respond to it.


    You can type PrintDialog1.ShowDialog() to show the dialog box, replacing PrintDialog1
    with the name of the component.


    The Print dialog box appears and allows printer selection and editing of various
    properties.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# USING THE PAGE SETUP DIALOG BOX


    The Page Setup dialog box lets the user select paper sizes and page orientation
    using a standard interface. You can use the PageSetupDialog control to add this
    dialog box to your application. The control automatically modifies the settings
    of a PrintDocument control. For more information on using the PrintDocument control,
    see “Using the PrintDocument Control.”


    You find the PageSetupDialog control in the Windows Form section of the Toolbox.
    A required property for the function of the PageSetupDialog control is Document.
    You must set this property to a valid PrintDocument control.


    The PageSetupDialog control provides properties to control its appearance and
    enable or disable functionality for the user. AllowMargins enables the margin-editing
    section of the dialog box. If enabled, MinMargins is a Margin object and allows
    you to enter the Left, Right, Top, and Bottom minimum margins the user can enter.
    AllowOrientation allows the user to switch between portrait and landscape orientations.
    AllowPaper enables


    or disables paper selection. AllowPrinter shows or hides the Printer button, which
    allows editing of the printer’s settings. ShowNetwork shows or hides the Network
    button on the secondary printer dialog. ShowHelp determines if the Help button
    is present.


    To make the dialog box appear, invoke the ShowDialog method with no arguments.
    The method returns a DialogResult specifying either OK or Cancel. For more information
    on DialogResult, see Chapter 2. If the user clicks OK, the dialog box loads the
    PageSettings and PrinterSettings given by user to the PrintDocument assigned to
    the control. This creates a totally automated printing system. Note that if you
    call the ShowDialog method and the user does not define a printer, a run-time
    error occurs. See Chapter 12 for more information on how to trap errors.


    The example uses a Button control to activate the Page Setup dialog box. You can
    use a variety of controls such as a toolbar or menu as well.


    # USING THE PAGE SETUP DIALOG BOX


    ![](img/d6f772854306e15fb6df39b861a7b541_141_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_141_1.png)


    +   1 Open a form in a Windows Application project.


    +   2 Add and configure a PrintDocument control on the form.


    +   3 In the Toolbox, double-click the PageSetupDialog control to add the control
    to the form. The control appears in the component tray.


    +   4 In the Properties window, click the Document and select PrintDocument control.
    You can optionally set other properties. Toggle preference properties like AllowPaper
    by double-clicking the property name.


    +   5 Open the method or event where the Page Setup dialog box needs to appear.


    > Note: See “Using the PrintDocument Control” to add a PrintDocument to the form.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Extra


    You can edit printer settings to certain requirements. Even if you provide the
    user with selections, you may want to check those settings. Note, you cannot make
    the changes while in the PrintPage event because the PrintDocument component has
    already built a page for you. Instead, use the BeginPage event. The DefaultPageSettings
    and PrinterSettings properties provide the settings that affect printing and page
    layout.


    # PAGESETTINGS PROPERTIES


    | PROPERTY | DESCRIPTION |

    |---|---|

    | Bounds | A Rectangle object that retrieves the bounds of the page, given the
    page orientation. |

    | Color | A Boolean value that retrieves or sets whether the page prints in color.
    |

    | Landscape | A Boolean value that determines whether the page prints in landscape
    or portrait orientation. |

    | Margins | A Margins object that retrieves or sets the margins for the page.
    Use the MarginBounds of the PrintPage event argument to specify the dimensions
    of the printable area. |

    | PaperSize | Retrieves or sets a PaperSize object indicating the paper size for
    the page. |

    | PaperSource | Retrieves or sets a PaperSource object indicating the page''s
    paper source (for example, the printer''s upper tray). |

    | PrinterResolution | Retrieves or sets the printer resolution for the page. |

    | PrinterSettings | Retrieves or sets the printer settings associated with the
    page. |


    ![](img/d6f772854306e15fb6df39b861a7b541_142_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_142_1.png)


    6 Add code to show the dialog box and respond to it.


    You can type PageSetupDialog1.ShowDialog() to show the dialog box, replacing PageSetupDialog1
    with the name of the component.


    The Page Setup dialog box appears and allows editing of various properties.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# CREATE A PRINT PREVIEW


    Many modern applications enable the user to preview his or her print job before
    choosing to print it. You can add this powerful feature to your application using
    the PrintPreviewDialog. This control takes all the pages printed by a PrintDocument
    control and maps them onto a virtual onscreen page. The PrintPreviewDialog control
    also provides an easy to use and familiar dialog box with a toolbar of display
    options and a panel to show the page or pages in the print job.


    To use the control, you need to set the Document property to a valid PrintDocument
    control. When the print preview control displays, the dialog box calls the PrintDocument
    control to output the pages, which in turn calls your page output event handler.
    Instead of the pages outputting to the printer, the pages store in memory for
    the Print Preview dialog box to display. See the section "Using the PrintDocument
    Control" for more information on the PrintDocument control.


    The PrintPreviewDialog control only makes one property available: UseAntiAlias.
    Set the property to True to have the control draw the page on screen using anti-alias
    to smooth the appearance of lines, shapes, and text. Keep in mind that anti-aliasing
    is an intensive process that may slow some older systems. If your application
    needs to run well on older machines, you may want to leave this property disabled.


    To make the Print Preview dialog box appear, call the Show or ShowDialog method.
    See Chapter 2 to learn about the differences between Show and ShowDialog methods.


    When the dialog appears, it shows a toolbar with a Print button, a Zoom button,
    and Column/Row selections. The control provides all the interaction with the user
    for the display interface. When the user clicks the Print button, the dialog calls
    the Print method of the PrintDocument control assigned to the PrintPreviewDialog.


    # CREATE A PRINT PREVIEW


    ![](img/d6f772854306e15fb6df39b861a7b541_143_0.png)


    +   1. Open a form in a Windows Application project.

    +   2. Add and configure a PrintDocument control on the form.

    +   3. In the Toolbox, double-click the PrintPreviewDialog control to add it to
    the form.

    +      Note: See the section "Using the PrintDocument Control" to add a PrintDocument
    to the form.

    +      The control appears in the Component Tray.

    +   4. Click the Document in the Properties window and select PrintDocument control.

    +      To cause the PrintPreview Dialog control to anti-alias the pages, double-click
    the UseAntiAlias property to toggle it to True.

    +   5. Add a control to the form to make the dialog box appear and double-click
    the control to edit its default event handler.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# PROVIDE INPUT AND OUTPUT


    # Extra


    While the PrintPreviewDialog control enables you to create a quick and easy Print
    preview window with a single line of code, you may want to customize your program
    more extensively. You can use the PrintPreviewControl to add the print preview
    pane directly to a form of your own. The PrintPreviewDialog control uses the PrintPreviewControl
    to provide the view in the dialog box, so they appear exactly the same. If you
    use the PrintPreviewControl, you must provide your own interaction with the user
    by setting the control properties. The Zoom property controls the zoom of the
    display. The property accepts a Double value, with 1.0 being full-size, or 100%.
    To make the page appear half-size, use the value 0.5. The Columns property determines
    the number of pages to display horizontally. The Rows property determines the
    number of pages to display vertically. For example, Print previews in many applications
    let you switch the view to display two pages side by side, or a 3 x 2 configuration
    of six pages. To make the control automatically size the pages to fit in the available
    space of the control when you alter properties such as Columns or Rows, set the
    AutoZoom property of the PrintPreviewControl to True.


    ![](img/d6f772854306e15fb6df39b861a7b541_144_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_144_1.png)


    The Code Editor appears.


    +   6 Type PrintPreviewDialog1.ShowDialog(), replacing PrintPreviewDialog with
    the name of the control.

    +   7 Press F5 to run the project.


    The PrintPreviewDialog or PrintPreviewControl appears and allows you to view the
    document.


    The example above uses the same PrintPage event handler for the PrintDocument
    as in the section "Using the PrintDocument Control."'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# DOWNLOAD FROM A WEB SERVER


    Networking, clients, servers, and the Internet are fast becoming an important
    feature for every application to support effectively. You can use the WebClient
    class to connect to an HTTP:// or HTTPS:// server to download and upload data.
    This class provides a high-level interface for accessing network sockets by working
    off other classes.


    WebRequest and WebResponse, made to send and receive data from a server, form
    the basis of WebClient, and you can use them directly instead of WebClient to
    perform more powerful tasks. The System.Net namespace provides all of these classes.
    See the Visual Basic .NET help system for more information.


    To begin using a WebClient, declare a new variable and place As New Net.WebClient()
    for the type declaration. The New keyword tells VB .NET to create a new instance
    of the class in memory and assign it the variable name you give. For more information
    on instantiating classes and using constructors, see Chapter 7.


    After creating the WebClient, multiple methods enable you to chose the appropriate
    method for accessing the server. The OpenRead method expects one parameter, the
    URL to download, and returns a Stream. This method enables you to load the data
    from the server directly into your program as a string, or manipulate the data
    in any way a Stream allows. For more information on reading from a Stream, see
    the section "Read from a Stream."


    The DownloadData method accepts a URL as its parameter and returns a Byte array
    with the contents of the server request. The DownloadFile method accepts two parameters,
    the URL to download, and the file into which you save the download. This method
    saves the entire contents of the URL request directly to the file. The method
    returns nothing.


    # DOWNLOAD FROM A WEB SERVER


    ![](img/d6f772854306e15fb6df39b861a7b541_145_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_145_1.png)


    +   1. Create a new project or open an existing one.


    +   2. In the method or event to download a file, type Dim myWebClient As New
    Net.WebClient(), replacing myWebClient with the variable name.


    +   3. Type the variable name assigned to the WebClient.


    +   4. Type .OpenRead(url), replacing OpenRead with the download method to use
    and url with the appropriate parameters to the method.


    +   You can use the DownloadData or DownloadFile methods instead of OpenRead.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Extra


    Some Web sites require users to fill out a form before they can access a particular
    web page. To make your application upload form information to the server for a
    particular page, use the `UploadValues` method. This method accepts a URL as the
    first parameter, and a `NameValueCollection` class as the second. The class holds
    a list of form values. Create a new instance of the class and use the `Add` method
    to specify the name and value pairs to pass to the URL.


    ```

    **Example:**


    ```vb

    Dim loginForm As New Net.WebClient()

    Dim loginFormElements As New _

    System.Collections.Specialized.NameValueCollection()

    loginFormElements.Add("userID", "tbwoman")

    loginForm.UploadValues("http://www.sample.com/\nloginForm.asp",

    loginFormElements)

    ```

    ```


    Servers can lock resources on a Web site and force the browser to request a username
    and password. If your program needs access to a restricted directory, use the
    `Credentials` property of the `WebClient`. To do so, you must first create a new
    instance of the `CredentialCache` class in which to store the credentials. `CredentialCache`
    can hold any number of Web Sites’ credentials, and the `WebClient` selects the
    right one when necessary.


    ```

    **Example:**


    ```vb

    Dim restrictedPage As New Net.WebClient()

    Dim myCache As New Net.CredentialCache()

    Dim credential As New _

    NetworkCredential("myUser", "myPass")

    myCache.Add(New _

    Uri("http://www.sample.com/restricted/", _

    "Basic", credential)

    restrictedPage.Credentials = myCache

    ```

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_146_0.png)


    +   - Type code to retrieve the data into a usable variable.

    +   - The `OpenRead` method returns a stream you can read.

    +   - The WebClient retrieves the file from the Internet-based server.

    +   - Type code to display or use the results.

    +   - Press F5 to run the project.


    > Note: See the section “Read from a Stream” to retrieve data from a stream.'
