- pgno: 189
  md: '# IMPLEMENT AN INTERFACE


    After you define an interface, you can use it to build classes. Each class must
    implement all of the methods, properties, and events specified in the interface.
    Any number of classes can build off of a single interface. To define an interface,
    see the section "Define an Interface."


    To create the class based on the interface, create a standard class block using
    Class... End Class. For more information on creating classes, see the section
    "Create a Class." The class name need not relate to the name of the interface
    and cannot have the same name as the interface. On the first line inside the class
    block, specify the interface you want to implement using the Implements statement.
    Follow the keyword with the name of the interface.


    You must implement each method, property, and event that resides in the interface.
    You do not have to make the names you use for each class member the same as the
    interface names. To define the interface that you implement with a particular
    Property, Method, or Event statement, use the Implements keyword at the end of
    the line, past any declarations or type specifications. After the keyword, you
    specify the interface member you implement with the class member.


    In most cases, you want to make the implemented name of the member the same as
    the interface name so you can create multiple classes that work interchangeably.
    You can define a variable with the Interface name as the type and then assign
    an instance of a class that implements that interface to the variable. This lets
    you work with classes that have different underlying functions, but because they
    export the same interface, VB.NET lets you work with them in one variable type.


    # IMPLEMENT AN INTERFACE


    ![](img/d6f772854306e15fb6df39b861a7b541_189_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_189_1.png)


    +   1 In the desired code module, define an interface for the class to implement.

    +   Note: See the section "Define an Interface" to define an interface.


    +   2 Create a new class or open an existing one.

    +   Note: See the section "Create a Class" to create a class.


    +   3 Inside the class block, type Implements followed by the interface name.


    +   4 To implement a method of the interface, define the method using Sub or Function.


    +   5 At the end of the line, type Implements MyInterface.IMethod1, replacing
    MyInterface with the interface name and IMethod1 with the name of the interface
    method you implement.


    +   6 Type the appropriate method code.

    +   Note: See the section "Define a Method" to properly set up a method.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Extra


    You can use a class to implement multiple interfaces. To do so, place multiple
    Implements keywords at the beginning of the class block making sure to implement
    all of the members from all of the interfaces. You can use one member in the class
    to implement multiple members of the interfaces. After typing the method or property
    declaration, place multiple members from the interfaces after the Implements keyword
    separated by commas. You can implement multiple members when you have two similar
    interfaces or where two interfaces provide the same methods. You can simply write
    the code once in the class and implement both of the interface methods.


    # Example:


    ```

    Interface Animal

    Sub Eat()

    Property Age() As Integer

    End Interface

    Interface Plant

    Sub GetNutrients()

    Property Age() As Integer

    End Interface

    Class VenusFlyTrap

    Implements Animal, Plant

    Sub EatInsects() Implements_

    Animal.Eat, Plant.GetNutrients

    ...

    End Sub

    Property Age() As Integer Implements_

    Animal.Age, Plant.Age

    ...

    End Property

    End Class

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_190_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_190_1.png)


    7 To implement a method, type Property MyProperty() As Integer, replacing MyProperty1
    with the name for the property and Integer with the same for the property as the
    interface.


    8 At the end of the line, type Implements MyInterface.IProperty1, replacing MyInterface
    with the interface name and IProperty1 with the interface property.


    9 Type appropriate code for the Property.


    10 To implement an event, type Event MyEvent, replacing MyEvent with the name
    for the event, and inside the parentheses, type the list of parameters the interface
    defines.


    11 At the end of the line, type Implements MyInterface.IEvent, replacing MyInterface
    with the interface name and IEvent with the event name.


    Note: See the section "Using an Existing Class" to use your implemented class.'
  merge: -1
