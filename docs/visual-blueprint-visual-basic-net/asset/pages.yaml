- pgno: 196
  md: '# Extra


    You can change the accessibility of overloaded methods, making one method Public
    and another Private, or use other supported accessibility keywords. This functionality
    enables you to create a more complex private version of the method that the public
    versions can use to perform the work.


    ```

    Public Class Class1

    Public Overloads Function Add(n1 As Integer, n2 As Integer) As Integer

    Dim array As Integer() = {n1, n2}

    Return Add(array)

    End Sub

    Public Overloads Function Add(n1 As Integer, n2 As Integer, n3 As Integer) As
    Integer

    Dim array As Integer() = {n1, n2, n3}

    Return Add(array)

    End Sub

    Protected Overloads Function Add(numArray As Integer()) As Integer

    Dim number As Integer, sum As Integer = 0

    For Each number In numArray

    sum += number

    Next

    Return sum

    End Sub

    End Class

    ...

    Private Sub Button1_Click(... ) Handles Button1.Click

    Dim myClass As New Class1

    MessageBox.Show(myClass.Add(10, 20) & " " & myClass.Add(20, 30, 40!))

    End Sub

    ```


    RESULT:

    30 90


    ![](img/d6f772854306e15fb6df39b861a7b541_196_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_196_1.png)


    +   8 Type code for the method.

    +   9 Repeat steps 2 through 8 to add more methods using the same name.

    +   10 Add code to call one of the methods.

    +   11 Press F5 to run your project.


    VB .NET calls the correct overloaded method for the specified parameters.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# INHERIT FROM AN EXISTING CLASS


    Just like a person often inherits traits of their parents, a class can inherit
    the traits of another class. To understand when to use class inheritance, think
    of the phrase "is a type of." For example, begin with the word mammal. A variety
    of animals inherit traits from mammals, such as cats and dogs. A cat is a type
    of mammal. A dog is a type of mammal as well.


    After you create a base class, you define an inherited class with the Inherits
    statement. Place the keyword Inherits on a blank line at the top of a class followed
    by the name of the base class. Visual Basic .NET does not support multiple-inheritance,
    which means you can only inherit from one base class. You can, however, implement
    multiple interfaces. See Chapter 5 for more information on interfaces.


    Public members of a base class become public members of the inherited class, meaning
    a user of the class can access


    the base class members as if the inherited class contains them. Although it cannot
    access the base class''s private members, the inherited class can access protected
    members of the base class when users of the class cannot.


    You can override a method from the base class if the base class specifies the
    Overridable keyword in the declaration of a method. You override a base class''s
    method by declaring a method of the same name in the inherited class with the
    Overrides keyword placed at the beginning of the line.


    VB .NET only calls the lastest descendant method in a set of classes. For example,
    assume the base class defines a method Calculate and an inherited class overrides
    the method. If you declare a variable in the type of the base class and assign
    an instance of the inherited class to the variable, VB .NET calls the inherited
    class''s method.


    # INHERIT FROM AN EXISTING CLASS


    ![](img/d6f772854306e15fb6df39b861a7b541_197_0.png)


    # CREATE THE BASE CLASS


    +   1. Create an empty class block.


    +   2. Type desired properties and events into the code block.


    Note: See Chapter 7 for more information about creating a class, adding a property,
    and adding an event.


    +   3. Type Overridable followed by Sub or Function on a new line inside the class.


    +   4. Type a method name.


    +   5. Type parameters in parentheses and a return type if the method is a Function.


    +   6. Press Enter.


    +   7. Add code to the method.


    You can repeat steps 3 through 5 to create more base methods.'
  merge: -1
  img_proc: true
- pgno: 198
  md: "# Extra\n\nWhen you override a method in the base class, you may want to access\
    \ the underlying base method. This is especially useful if the code the base class\
    \ contains needs to run in addition to the code you add in the overridden method.\
    \ You can still access the base class's method by using the MyBase keyword. This\
    \ keyword contains a reference to the original base class, enabling you to run\
    \ any method available in the base class even if you override it.\n\nBe careful\
    \ when you make a method call using a class that you may later inherit. Because\
    \ of Visual Basic .NET's bottom-most method of accessing overloaded methods, you\
    \ may have a method in the base call a method in the inherited class. But if a\
    \ class inherits from this class, the inherited class may overload the method,\
    \ changing its functionality. You can make a method not support overriding by\
    \ using the NotOverridable keyword. You can make sure a base class always calls\
    \ its own method by using the MyClass object. This object maintains a reference\
    \ to the class without using the bottom-most technique to determine the method\
    \ to call.\n\n# Example\n\n```\nPublic Class BaseClass\n    Public Overridable\
    \ Sub Method1()\n    End Sub\nEnd Class\nPublic Class InheritedClass : Inherits\
    \ BaseClass\n    Public Overrides Sub Method1()\n        MyBase.Method1()\n  \
    \  End Sub\nEnd Class\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_198_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_198_1.png)\n\n# CREATE THE INHERITED\
    \ CLASS\n\n+   8 Create a new empty class block.\n\n+   9 Type Inherits followed\
    \ by the base class name on the first line inside the class.\n\n+   10 On a new\
    \ line, type Overrides followed by Sub or Function, depending on the declaration\
    \ of a method in the base class.\n\n+   11 Type the name of the method you need\
    \ to override. For a Function, use the same return type as the base method.\n\n\
    +   12 Press Enter.\n\n+   13 Type code for the overridden method.\n\nYour inherited\
    \ class is ready for use.\n\nNote: See Chapter 5 for information on using a class."
  merge: -1
  img_proc: true
- pgno: 199
  md: '# CREATE A SHARED METHOD


    Because some methods need to function more like global procedures throughout a
    project, you may want to call methods inside classes without first creating an
    instance of the class. For example, if you create a class of mathematic routines,
    you do not want to declare a new instance of your class every time you need to
    perform a simple routine. Or, if you declare a class File and want to expose a
    method called Open, you can let the user call Open, which opens the file and then
    actually returns an instance of the File class without first having to create
    an instance of the File class. You can use shared methods to let a module invoke
    a method in a class without first creating an instance of the class.


    To create a shared method, you use the Shared keyword in front of the Sub or Function
    keyword in the declaration of the method. When you place the keyword in front
    of the method, you can still use it as a normal method if you create a class instance.
    But you can also access the method by placing the name of the class, not a variable
    name of an instance of the class, in any other method that can access the class
    followed by a period and the name of the method.


    When VB.NET runs the code, it runs the shared method just like a method in a code
    module. The method has no attachment to the class when run as a shared method,
    and therefore cannot access member variables or other class members inside the
    class. A shared method can only access a shared variable or shared event. For
    more information on shared member variables, see "Create a Shared Variable." See
    "Using Delegate and AddressOf" for information on the AddressOf statement.


    ![](img/d6f772854306e15fb6df39b861a7b541_199_0.png)


    +   1. Create a new class or open an existing one.

    +   2. Type an accessibility keyword on an empty line in the class.

    +   3. Type Shared followed by Sub or Function.

    +   4. Type a name for the method.

    +   5. Type a parameter list inside parentheses.

    +   6. For a Function, type As followed by a type.

    +   7. Press Enter.'
  merge: -1
  img_proc: true
- pgno: 200
  md: "# Extra\n\nWhen you create a shared method, which can only access other shared\
    \ members, it does not run in the memory space of a class instance. You can fire\
    \ an event from a shared method using shared events. To create a shared event,\
    \ use the Shared keyword before the Event keyword when defining the event. In\
    \ the class or module to handle the event, you use the AddHandler command to set\
    \ up the method to handle the event. You can use this command for standard events\
    \ as well as to dynamically handle events of a component. For the first parameter,\
    \ specify the event. In the case of a shared event, type the class name, following\
    \ it with a period and the name of the event. For a standard event, specify the\
    \ instance variable name followed by a period and the event name. For the second\
    \ parameter, type AddressOf followed by a method in the class or module to handle\
    \ the event.\n\n```\nExample:\nPublic Class Class1\n    Public Shared Event Event1()\n\
    \    Public Shared Sub Method1()\n        RaiseEvent Event1()\n    End Sub\nEnd\
    \ Class\nPublic Class Class2\n    Sub RunMethod()\n        AddHandler Class1.Event1,\
    \ _\n            AddressOf HandleEvent\n        Class1.Method1()\n    End Sub\n\
    \    Sub HandleEvent()\n        ...\n    End Sub\nEnd Class\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_200_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_200_1.png)\n\nVB .NET creates the End\
    \ Sub or End Function statement.\n\nType code for the shared method.\n\nIn the\
    \ location that you need to use the method, type Math.Add(5, 10), replacing Math\
    \ with the class name of the shared method, and 5, 10 with any necessary parameters.\n\
    \nPress F5 to run your project.\n\nThe shared method runs its code without the\
    \ class being initialized."
  merge: -1
  img_proc: true
- pgno: 201
  md: '# CREATE A SHARED VARIABLE


    A global variable is a variable that any part of your application can access,
    meaning all parts of your application access a single instance of created data
    when the program initializes. In many programming languages, such as Visual Basic
    6 and C++, you declare global variables outside of all class modules to alert
    the language to declare the variable globally. VB .NET provides an improved version
    of global variables called shared variables, which you place inside a class, but
    which still allow you to access a single instance of data throughout your application.
    Declaring shared variables inside of classes allows you to create more readable
    code that maintains the modularity of classes with the flexibility of globally
    available data.


    You declare a shared variable inside a class much like a standard member variable.
    Unlike a standard member variable, the application can access the shared variable
    without creating an instance of the class. Also, even if no instances of the class
    exist, the variable remains in memory and never loses its value. For example,
    say your program has a counter class. Normally, you create an instance of the
    counter class and make sure not to lose the reference to it throughout your program''s
    operation. Using a shared variable, you can instantiate the class when necessary
    to update the counter, but the shared member variable keeps the value of the counter
    at all times.


    You create a shared member variable by placing the Shared keyword before the variable
    name, but after the Dim or accessibility keyword. When you declare a shared variable
    Public, you can read or modify the variable from any module that has access to
    the class. To access the shared variable outside of the class, you use the name
    of the class, following it with a period and the name of the variable. You can
    also access the variable normally using an instance of the class. To access members
    of a class, see Chapter 5.


    As with standard private member variables, you cannot access shared member variables
    you declare Private outside of the class. The variable stores value in memory
    across instances of the class. The value does not reset when you create a new
    instance of the class. This means if one instance of the class changes the variable,
    all other instances of the class work with the same new value. See Chapter 5 to
    learn more about member accessibility.


    # CREATE A SHARED VARIABLE


    ![](img/d6f772854306e15fb6df39b861a7b541_201_0.png)


    +   1. Create a new class or open an existing one.

    +   2. Type an accessibility keyword such as Public or Private on an empty line
    inside the class outside of methods and events.

    +   3. Type Public Shared Property1 As String, replacing Public with the proper
    accessibility, Property1 with the variable name, and String with the variable
    type.

    +   You can repeat steps 2 and 3 as necessary.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "# Extra\n\nShared variables that you declare in your classes sometime initialize\
    \ during program execution. VB .NET does not specify a single point to execute\
    \ them, only that they initialize before you create an instance of the class or\
    \ access a shared variable. VB .NET guarantees they only initialize once. You\
    \ can create shared constructors to initialize the values of the shared variables.\
    \ A shared constructor does not support any parameters, because VB .NET calls\
    \ it directly. Declare a new constructor and place Shared before the Sub New statement.\
    \ You can only initialize shared variables in this constructor.\n\n# TYPE THIS:\n\
    \n```\nPublic Class Class1\n    Public Shared Variable1 As Integer\n    Shared\
    \ Sub New()\n        Variable1 = 5\n    End Sub\nEnd Class\nPublic Class Form1\n\
    \    Inherits System.Windows.Forms.Form\n    Sub Form1_Load(...) Handles MyBase.Load\n\
    \        MsgBox(Class1.Variable1)\n    End Sub\nEnd Class\n```\n\n# RESULT:\n\n\
    5\n\n![](img/d6f772854306e15fb6df39b861a7b541_202_0.png)\n\n4 Where you need to\
    \ use the variable, type the name of the class holding it.\n\n5 Type a period\
    \ followed by the name of the shared variable to access.\n\n6 Type a value for\
    \ the variable.\n\n7 Press F5 to run your project.\n\n![](img/d6f772854306e15fb6df39b861a7b541_202_1.png)\n\
    \nThe shared variable holds the value without an instance of the class existing."
  merge: -1
