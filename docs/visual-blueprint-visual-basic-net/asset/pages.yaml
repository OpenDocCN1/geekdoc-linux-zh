- pgno: 87
  md: '# # EXPLORE TREE VIEWS


    You can use TreeView controls to provide a tree-like display of hierarchical information.
    Any data that has a root source with various subcategories is well suited to the
    capabilities of the TreeView control. The Windows Explorer uses a tree view to
    display the hierarchy of the directory system.


    With the TreeView control, you can use an ImageList control to assign pictures
    to items of the tree. You assign the ImageList control you create to the ImageList
    property. The ImageIndex property sets the image for all of the items in the TreeView.
    The image you select using the SelectedImageIndex property is used in its place
    for a selected item. You cannot individually assign pictures to the items in a
    TreeView as you can with a ListView control.


    The TreeView control provides a number of properties to control its interface.
    If you enable ShowLines, the control draws lines from parent items to all of its
    children. ShowPlusMinus displays plus and minus signs beside items with children,
    which the user can click to expand and collapse a node. Sorted to True and VB.NET
    sorts each individual tree and subtree alphabetically. The HotTracking property
    makes the control draw the text caption, like a hyperlink, when a user places
    the mouse pointer over it.


    The Nodes collection contains the list of top-level nodes in the Tree. Then, each
    top-level TreeNode contains a Nodes collection of all of its children, and so
    on. You can use the Add method to insert a node to a tree. The AddRange method
    creates an entire tree, deleting current items. You can use Clear to delete an
    entire tree, while Remove can delete a single node.


    ![](img/d6f772854306e15fb6df39b861a7b541_87_0.png)


    +   1. Create a new Windows Application project or open an existing one.

    +   2. Set up an ImageList control that contains an image for unselected nodes
    and an image for selected node items.

    +   3. In the Toolbox, click the TreeView control and add the control to the form.


    > Note: See the section “Work with ImageList” to add an image list control.


    +   4. Click the ImageList property and select the ImageList control.

    +   5. Click the ImageIndex property and select the default image for the items
    in the control.

    +   6. In the Properties window, click [...] beside the Nodes property. The TreeNode
    Editor appears.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# Extra


    You have the ability to create an entire node with children using the TreeNode
    class. Using this method allows you to set all of the properties of a Node before
    adding it to the control. Building a TreeNode also allows you to build an entire
    set of nodes and children before adding to the TreeView. This method is extremely
    useful when the program is already running, because adding the entire tree at
    the same time is much faster than adding items individually to the tree.


    # Example:


    ```

    Dim newNode As New System.Windows.Forms.TreeNode()

    Dim newChildNode As New System.Windows.Forms.TreeNode()

    newNode.Text = "Sample item"

    newChildNode.Text = "Sample child node"

    newNode.Nodes.Add(newChildNode)

    TreeView1.Nodes.Add(newNode)

    ```


    7 Click Add Root to add a top-level item, or click an existing item and click
    Add Child to add an item as a child.


    8 Type a label for the node.


    Optionally, click and select a custom image for the item.


    9 Repeat steps 7 through 8 to add the necessary items.


    10 Click OK when done.


    11 Press F5 to run the project.


    The TreeView shows the items and allows a user to close and open subtrees.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# CREATE A TOOLBAR


    You can use toolbars to provide buttons on a form, typically at the top, to access
    the most common features. The Toolbar control provides the functionality to create
    a basic toolbar with two styles, set by the Appearance property: Normal, or Flat.
    While Normal is the default setting, most toolbars in modern applications use
    the Flat style.


    The Toolbar control, part of the ListView and TreeView family, requires an ImageList
    to retrieve images for the toolbar buttons. You can attach an ImageList control
    using the ImageList property.


    Each button is contained in the Buttons collection. A single button has a Text
    property, an ImageIndex property to select the appropriate image from the ImageList,
    ToolTipText to display a tool tip for a button, and a Style property. The PushButton
    style is a standard toolbar button that the user can click. ToggleButton is a
    button that stays down when pressed until pressed again. Seperator is a divider,
    and the user cannot click it.


    The DropDownButton style creates a button that has an associated drop-down menu.
    The DropDownMenu property allows you to assign a ContextMenu control to the property.
    For more information on Context Menu controls, see Chapter 2.


    The TextAlign property allows you to place the text Underneath the icon, or to
    the Right of the icon.


    To make the buttons on the toolbar functional, use the Toolbar_ButtonClick event.
    The event variable, e, returns a reference to the button that a user clicks. For
    a toggle button, you can check to see if the button was toggled into a pressed
    state by accessing the Pressed property like e.Button.Pushed. A drop-down button
    should provide a default action on a click. When the user clicks the drop-down
    button, this event is not fired.


    # CREATE A TOOLBAR


    ![](img/d6f772854306e15fb6df39b861a7b541_89_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_89_1.png)


    +   1. In a Windows Application project, add and set up an ImageList control to
    hold toolbar images.

    +   Note: See the section "Work with ImageLists" for more information.


    +   2. Double-click the Toolbar control to add it.

    +   3. Click the ImageList property and select the ImageList control.

    +   4. Click the Buttons property.


    +   4. The Toolbar Collection Editor appears.

    +   5. Click Add.

    +   6. Type a label for the button into the Text property box and a description
    into the ToolTipText property box.


    +   7. Click the ImageIndex property and select the appropriate image for the
    tool button.

    +   You do not need to fill the Text property if you assign an image to the button.'
  merge: -1
  img_proc: true
- pgno: 90
  md: "# WORK WITH CONTROLS 3\n\n# Apply It\n\nYou can customize the VB.NET ToolBar\
    \ control using a context menu. The code below loads the toolbar buttons into\
    \ the menu and allows the user to toggle each one's visibility. You can use the\
    \ code with any toolbar, as long as each button has a caption set with the Text\
    \ property. Add a ContextMenu control to the form and set the Toolbar's ContextMenu\
    \ property to this control.\n\n# TYPE THIS:\n\n```\nPrivate Sub Form1_Load(ByVal\
    \ sender As System.Object, ByVal e As System.EventArgs) Handles MyBase.Load\n\n\
    Dim button As ToolBarButton, menuItem As MenuItem\n' Loop through all toolbar\
    \ buttons\nFor Each button In ToolBar1.Buttons\n  ' add a menu item for each toolbar\
    \ button\n  menuItem = ContextMenu1.MenuItems.Add(button.Text, AddressOf MyMenuClick)\n\
    \  ' if button is visible, check menu.\n  menuItem.Checked = button.Visible\n\
    Next\nEnd Sub\n\nPrivate Sub MyMenuClick(ByVal sender As Object, ByVal e As System.EventArgs)\n\
    ' get menu item from sender object\nDim menuItem As CType(sender, MenuItem)\n\
    ' find toolbar button based on menu item\nDim button As ToolBarButton = ToolBar1.Buttons(menuItem.Index())\n\
    \nbutton.Visible = Not button.Visible\nmenuItem.Checked = Not menuItem.Checked\n\
    End Sub\n```\n\n# RESULT:\n\nA context menu for the toolbar that allows the user\
    \ to selectively show and hide toolbar buttons.\n\n![](img/d6f772854306e15fb6df39b861a7b541_90_0.png)\n\
    \n8 Click the Style property's and then click the appropriate style.\n\nThe default,\
    \ PushButton, is a standard toolbar button. You can use the Separator type to\
    \ create a blank space between buttons.\n\nYou can repeat steps 5 through 8 as\
    \ necessary.\n\n9 Click OK when done.\n\n10 Press F5 to run your project.\n\n\
    The Toolbar appears and allows you to press buttons.\n\nTo make the buttons functional,\
    \ you can handle the ButtonClick event.\n\nNote: See Chapter 2 to handle events."
