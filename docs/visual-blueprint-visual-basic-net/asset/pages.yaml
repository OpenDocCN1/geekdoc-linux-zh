- pgno: 29
  md: '# LANGUAGE CHANGES FROM VISUAL BASIC 6


    Better than Visual Basic 6, the previous version of Visual Basic, the Visual Basic
    .NET upgrade has many significant changes, which makes it a more powerful and
    cross-language oriented program. This section helps


    you understand these changes before attempting to upgrade a Visual Basic 6 project
    to Visual Basic .NET. To upgrade a project using the Upgrade Wizard, see the section
    “Using the Upgrade Wizard.”


    # Variant


    A special universal data type, the Variant data-type in Visual Basic 6 has the
    capability of holding data of any type. The variable morphs to store various data
    like numeric variables, strings, and even objects. Variant is also the default
    variable type in VB 6 if you do not specify a type for the variable. The Object
    variable type in VB 6 can store object references, but does not have the ability
    to store standard data types.


    In VB .NET, the Variant type is no longer available. The common language runtime
    adopts the Object variable as the universal data type. Because VB .NET references
    simple variable types as objects, just like it does for other object data types,
    the Object variable type can now store any sort of data.


    # Date


    In Visual Basic 6, the Date type stores as a Double floating-point variable that
    can manipulate dates. VB 6 lets you manipulate a variable of type Date as a Double.


    Visual Basic .NET stores the Date type as a 64-bit integer, which improves speed
    of operations. But the new method of storing dates breaks the compatibility of
    working with Date variables as Double data types. The .NET Framework provides
    ToOADate and FromOADate methods to convert a date to and from a Double variable
    type.


    # Integer and Long


    In Visual Basic 6, the numeric data type Integer stores a 16-bit value, while
    the Long type stores 32-bit values. To provide support for larger numbers, VB.NET
    represents an Integer as a 32-bit value and the Long represents a 64-bit value.
    A new variable type, Short, represents 16-bit values.


    # Fixed-Length Strings


    In Visual Basic 6, you can declare variables as a fixed length string by specifying
    the String type followed by a multiplication sign (*) and a length.


    The Common Language Runtime (CLR) for Visual Basic .NET does not support fixed-length
    strings. A compatibility class enables you to create fixed length strings. You
    call the compatibility class FixedLengthString and you find it in the Visual Basic.Compatibility
    namespace.


    # Currency


    In Visual Basic 6, the Currency data type stores a 64-bit number in integer format,
    but inserts a decimal point in the value at the fourth position. Also in VB 6,
    although you cannot declare a variable of type Decimal, the Variant type supports
    a Decimal type, which stores a 96-bit integer value with a moving decimal point.


    Visual Basic .NET abandons the Currency type in favor of using only the Decimal
    data type. Decimal offers more accuracy and the CLR supports Decimal directly.


    # Type


    The Type statement in VB 6 declares a user-defined type.


    Visual Basic .NET does not support the Type statement; instead, you use the Structure
    statement. You can learn about structures in Chapter 7.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Empty


    Variants in Visual Basic 6 initialize to Empty, which automatically converts to
    zero when you use them in a numeric expression, or to an empty string when you
    use them in a string expression.


    Visual Basic .NET initializes Object variables to Nothing, which also automatically
    converts to zero or an empty string, if necessary.


    # Null and Null Propagation


    In Visual Basic 6, Null values are a subtype of the Variant variable, indicating
    that a variable contains no valid data. Also, in VB 6, if any part of an expression
    evaluates to Null, the Null value "propagates" through the expression and the
    entire expression becomes Null.


    Visual Basic .NET does not support Null propagation and only supports Null variables
    as a variable type for ADO.NET. The CLR converts Variants containing Null values
    into a variable type DBNull. You can use the IsDBNull function to test for the
    type. No longer, in an expression involving string data, does an Object return
    Null, instead it returns an empty string value.


    # Local Variable Scope


    In Visual Basic 6, you can use a variable from the line containing the declaration
    through to the end of the procedure.


    Visual Basic .NET uses block scope for variables. This means you can access a
    local variable from the line containing the declaration to the end of the block
    in which it appears. So if you declare a variable inside a Do Loop block, you
    cannot access the variable when the loop ends.


    # Arrays


    VB 6 allows you to define arrays with any lower and upper bounds. You can define
    the default lower bound in VB 6 using the Option Base statement.


    In VB .NET, all arrays are zero-based; this means the first index of the array
    is always zero. You cannot set the lower bound of the array. For more information
    on declaring and using arrays, see Chapter 4.


    # ReDim


    Visual Basic 6.0 distinguishes between fixed size and dynamic arrays. You declare
    fixed size arrays using the Dim statement; you define dynamic arrays using Dim
    with no bounds, and then size the array with ReDim.


    In Visual Basic .NET, all arrays are dynamic, meaning you always use Dim to declare
    the initial array size and can change the size of the array later. This can cause
    upgraded VB 6 code to redundantly initialize the array twice.


    # Assignment


    In Visual Basic 6, the Set statement assigns an object reference to a variable
    name. In VB .NET, because all variables are objects, the language only supports
    one form of assignment, the equal sign.


    # Calling Procedures


    VB 6 provides two forms of procedure calls: using the Call statement, which requires
    you to enclose the arguments in parenthesis, and simply typing the name of the
    procedure without parentheses.


    Visual Basic .NET requires parentheses for either method to improve conformity.
    Also, the default parameter passing method changes from ByRef in VB 6 to ByVal
    in Visual Basic .NET. This can create subtle bugs, so make sure you add ByRef
    keywords back where necessary when upgrading.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# USING THE UPGRADE WIZARD


    You can use the Project Upgrade Wizard to automatically convert Visual Basic 6.0
    projects into fully native Visual Basic .NET applications. Because of the number
    of changes that VB .NET makes in the core language, Microsoft provides an upgrade
    wizard to assist in the porting of applications.


    To invoke the Upgrade Wizard, open a Visual Basic 6 project using the standard
    Open Project dialog. The Upgrade Wizard takes a project, creates a new .NET project
    directory, and converts all of the files present in the project to new files that
    support Visual Basic .NET. The wizard does not change or overwrite the existing
    files in any way.


    The Upgrade Wizard contains five steps. The first step provides a summary of the
    actions the wizard completes. Step 2 checks the project type of the Visual Basic
    6 project and attempts to provide a match in the .NET Framework. The two options
    are EXE and DLL/custom control library.


    The wizard should determine the appropriate type automatically. The wizard also
    provides a check box if you want to generate default interfaces for public classes.
    If your project provides a number of public COM objects, you should select this
    box. You can then select the directory to create the new VB .NET project and perform
    the conversion.


    When the conversion completes, the VB .NET project opens. The Upgrade Wizard creates
    a file called UpgradeReport.htm that contains upgrade issues for the various modules
    in the project. This report alerts you to sections of code that it can not convert
    or that need special attention. See the previous section, “Language Changes from
    Visual Basic 6” for a list of important changes that occur when you convert from
    Visual Basic 6 to Visual Basic .NET. In most cases, your project runs after the
    conversion, and you can test functionality to see if any problems appeared during
    the conversion.


    # USING THE UPGRADE WIZARD


    ![](img/d6f772854306e15fb6df39b861a7b541_31_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_31_1.png)


    +   1. Open a VB 6 project file. The Visual Basic Upgrade Wizard appears.


    +   2. Click Next to skip the first screen of the wizard.


    +   3. Verify that the wizard chose the appropriate application type in step 2.


    +   4. Click Next.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Extra


    To provide the compatibility functions, the .NET Framework includes the Microsoft.VisualBasic.Compatibility
    namespace when using the Upgrade Wizard. This namespace includes functions that
    exist in the Visual Basic 6 language. The .NET Framework duplicates much of the
    functions built into Visual Basic 6, making many functions in the language unnecessary.
    To make the upgrade process as simple as possible, these functions provide the
    same interfaces as VB 6 functions while remaining compliant with .NET managed
    code. For example, VB .NET does not include the ability to create control arrays.
    So for VB 6 projects to upgrade successfully, the compatibility library includes
    control arrays for each of the basic controls in the language. VB .NET also removes
    controls like the FileListBox and DriveListBox completely. The compatibility library
    provides these controls for use with upgraded projects. A number of removed functions
    like SendKeys also exist within this namespace.


    You can use Visual Basic 6 to continue maintaining existing applications instead
    of upgrading. Both Visual Basic 6 and Visual Basic .NET can coexist on a single
    system. If you maintain a very large product that functions well in VB 6, you
    may want to leave your application in VB 6. You may find the upgrade process difficult
    due to the number of fundamental changes in the language.


    ![](img/d6f772854306e15fb6df39b861a7b541_32_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_32_1.png)


    You can click Browse to change the directory for the upgraded project.


    5 Click Next.


    Step 4 appears and notifies you that the wizard finished gathering all necessary
    information.


    6 Click Next on step 4 of the wizard.


    The wizard processes the project.


    The wizard opens the new project.


    Double-click the UpgradeReport.htm file in the Solution Explorer to see errors.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# CREATE A PROJECT


    A project contains one individual application or component. You must use a project
    to specify the files that make up your application, such as forms and classes.
    You place a project in VB .NET inside a solution. Even if the solution only holds
    a single project, you must have it present. When you create a new project, VB
    .NET creates the solution automatically.


    When you create a new project in the Development Environment, it provides you
    with a dialog box where you select the type of application you want. On the left
    side of the dialog box, entries for the various programming languages and other
    project types appear. On the right side, the dialog lists the individual project
    templates. In this book, you focus mostly on the Windows Application, console
    application, and ASP.NET Web Application project types. A Windows Application
    uses Windows Forms to develop a graphical Windows application. The console


    application generates a text-based Windows application, where you can attempt
    programming concepts without setting up and modifying Windows Forms controls.
    The ASP.NET Web application generates a Web Forms application.


    The New Project dialog also asks where you want to store the project. VB .NET
    stores each project in its own folder to avoid naming problems. The name you give
    to the project functions as the name of the files VB .NET creates for the project.
    When you create the project, the components of the project load into the Solution
    Explorer. This is the main console to access the parts of your application. If
    you create a Windows Application project, you see a project with a single class
    called Form1, which is the main form of the application. A Console Application
    project creates a module file where you place code.


    # CREATE A PROJECT


    ![](img/d6f772854306e15fb6df39b861a7b541_33_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_33_1.png)


    1 Open the Development Environment.

    Note: See "Using the Development Studio" for more information.

    2 Click File > New > Project.


    If you have the Start Page open, you can click the New Project button. See the
    section "Using the Development Studio" for more on the Start Page.


    3 Click Visual Basic Projects from the Project Types.

    2 The New Project dialog appears.


    4 Click the appropriate project template.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Extra


    Each project in Visual Basic .NET has a file AssemblyInfo.vb and makes up a single
    assembly, the term .NET Framework assigns to a single component in the system.
    You can use this file to define properties and information, which the compiler
    includes in your project. The file starts with an empty template and sets the
    various properties, which you can define for your assembly, to blank values. You
    can enter standard textual information for these properties, which include AssemblyTitle,
    AssemblyDescription, AssemblyCompany, AssemblyProduct, and others. The file also
    includes a GUID to make the project COM compatible and the version number of the
    project. The file is a .VB file you can open in the source editor by double-clicking
    its name in the Solution Explorer.


    # Example:


    ```

    Imports System.Reflection

    Imports System.Runtime.InteropServices


    <Assembly: AssemblyTitle("Product.NET Main Application")>

    <Assembly: AssemblyDescription("Main interface of the product.")>

    <Assembly: AssemblyCompany("NETCompany")>

    <Assembly: AssemblyProduct("Product.NET")>

    <Assembly: AssemblyCopyright("(c) NET Company 2001")>

    <Assembly: AssemblyTrademark("*")>

    <Assembly: CLSCompliant(True)>

    <Assembly: Guid("F7DE8FF1-4F26-4D20-B60E-36D6C604C36C")>

    <Assembly: AssemblyVersion("1.0.*")>

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_34_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_34_1.png)


    5 Type a filename for the project.

    Note: VB.NET uses the filename without the extension to create a project name.


    6 Optionally, you can type a new folder or click Browse to change where VB.NET
    creates the project folder.

    Click OK.


    VB.NET creates the project and opens its default resource.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# WORK WITH PROJECT FILES


    VB .NET provides a property page, which enables you to edit the properties of
    the project in the Solution Explorer.


    A project file contains references to the other files inside your project. VB
    stores a variety of settings inside the project file. You can use the Development
    Environment to create a project, save it, and load it later through the use of
    your project file.


    You must save your project files when you stop working, or when you make changes
    that cause you to update the files on your disk. The project saves the state of
    the Development Environment, and all of the files that make up the project. You
    can open a previously created project file at any time. If you open a project
    file while you have a solution with a different project loading into the Development
    Environment, the Open Project dialog presents you with two choices to open the
    project. The first option, Add to Solution, adds the project you open into the
    current solution, creating a multi-project solution. The second choice, Close
    Solution, closes the previous solution, and opens the project in its own solution.


    VB .NET provides a property page in the Solution Explorer, which enables you to
    edit the properties of the project. In the Common Properties section of the Property
    Page dialog box, the general subsection specifies the name of the assembly. It
    also provides the output type for the project, which provides options to alter
    the type of application the project generates. You can choose your startup object
    on this dialog and alter the root namespace. For more information on startup objects
    using Windows Forms, see Chapter 2. The Imports subsection enables you to define
    the various namespaces that globally import into your project. For more information
    on namespaces and the root namespace, see Chapter 8.


    # WORK WITH PROJECTS


    ![](img/d6f772854306e15fb6df39b861a7b541_35_0.png)


    # SAVE A PROJECT


    +   1. Create a new project in the Development Studio.

    +   Note: See "Create a Project" for more information.

    +   2. Click File → Save All to save the currently open project.

    +   Alternately, you can press Ctrl+Shift+S to save your project.


    # OPEN A NEW PROJECT


    +   3. Click File → Open → Project.


    You can also press Ctrl+O to open a project.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Extra


    You can right-click the Solution item in the Solution Explorer and click Properties.
    This opens the Project Property page, where you can set the various projects in
    your solution launch. You can use the ordering selection in the property page
    to ensure a component builds before the main application.


    When you open a project, you can add it to the current solution via the radio
    buttons located beside the Open button of the Open Project dialog box. When you
    have multiple projects inside the same solution, each project still functions
    as its own project, creating a necessary EXE or DLL file. But if you have two
    applications that work together, and you want to develop both of them concurrently,
    you can easily manage them by adding them to the same solution. You can open multiple
    copies of the Development Studio to work with the different projects. The solution
    file maintains settings to start both applications, start just one of them, or
    start them in a particular order. You can right-click the Solution item in the
    Solution Explorer and click Properties. This opens the Project Property page,
    where you can set the various projects in your solution launch. You can use the
    ordering selection in the property page to ensure a component builds before the
    main application. You can load a Component project and a Windows Application project
    at the same time, and tell the environment to load the component first, followed
    by the application.


    ![](img/d6f772854306e15fb6df39b861a7b541_36_0.png)


    4 Click the solution file to open.


    5 Click Open.


    ![](img/d6f772854306e15fb6df39b861a7b541_36_1.png)


    The Development Environment opens the project, closing other projects if necessary.
    The Solution Explorer reflects the change.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# BUILD AND RUN A PROJECT


    Because VB .NET creates EXE and DLL files, to test your work, VB must first build
    the created code and forms into a single file that your computer can run. In the
    case of Visual Basic, your computer can only understand the executable code you
    create with the assistance of the Common Language Runtime (CLR). The CLR provides
    the ability to work with the classes and other parts of your application and to
    interface with the .NET class frameworks. For more on the CLR, see the section
    "Understanding the Framework."


    When VB builds code, the compiler creates code in the form of Microsoft Intermediate
    Language (MSIL). MSIL is a compiled format similar to traditional assembly code.
    It contains low-level instructions that move data in and out of registers, but
    it contains no dependencies on any particular operating system or hardware platform.
    The dependence on the CLR allows an EXE or DLL containing MSIL to deploy on any
    target computer that supports the CLR. The CLR for the platform performs a final
    round of just-in-time (JIT) compilation to transform it into machine-specific
    assembly instructions.


    When you build a project, VB .NET opens the Output tool window in the Development
    Environment. This window holds the text the compiler returns from the operation.
    If build errors occur, another tool window, called the Task List, appears with
    a list of errors the compiler finds. You can access an error and have the code
    editor load the appropriate line. You can then correct the error and build the
    project again. For more information on debugging projects, see Chapter 13.


    At this point, you can start the project. If you invoke the start command with
    a project that you have not built since you made changes, the start command builds
    the project for you.


    # BUILD AND RUN A PROJECT


    ![](img/d6f772854306e15fb6df39b861a7b541_37_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_37_1.png)


    +   BUILD THE PROJECT

    +   1 Click Build.


    +   2 Click Build.

    +   Alternatively, you can access the build menu item by pressing Ctrl+Shift+B.


    +   VB builds the project where the Output window shows the progress.

    +   The Task window appears when the build completes and if errors exist.


    +   You can double-click an error in the list to have the error appear in the
    code window.

    +   Note: See Chapter 13 to correct errors.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Extra


    You can receive a number of common errors when you work with the Visual Basic
    language. You can use the following list to decipher the meaning of some of these
    errors. For more help with error messages, press F1 with an error selected in
    the Task window.


    | ERROR MESSAGE | HOW TO CORRECT |

    |---|---|

    | The name ''x'' is not declared. | The compiler cannot locate the variable or
    method name. Ensure that you declare the variable in question at the appropriate
    scope for the line of code to access it. Commonly, this error message displays
    because of a spelling error. |

    | Expected an expression. | A line did not end appropriately. In some cases, this
    can cause a multitude of errors as VB.NET tries to find the end of line. Make
    sure open and close parentheses match and that you do not have an underscore on
    the last line of a multi-line command. |

    | A value of type ''x'' cannot be converted to ''x'' | You assign a value to a
    variable that cannot accept it. This occurs often if you try to assign information
    to a control, for example, when you assign a string to a Label or TextBox control
    without specifying the Text property. |


    ![](img/d6f772854306e15fb6df39b861a7b541_38_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_38_1.png)


    # RUN A PROJECT


    3 Click Debug → Start.


    Alternately, you can press F5 to access the Start function.


    The project starts under the control of the .NET debugger.


    Any run-time errors cause the debugger to stop execution of the program and to
    display an error message.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# CREATE A WINDOWS APPLICATION


    Windows Forms technology allows you to provide a powerful and unique visual interface.
    You can create world class Windows applications, which look and perform like other
    Windows applications, inside a powerful and easy-to-use graphical development
    environment.


    Visual Basic .NET uses a project to store each individual application or component.
    To create a standard Windows application, you utilize the Windows Application
    project type. Your project holds all of the forms, classes, modules, and controls
    you create and makes them part of the application. For more information on the
    purpose of a project, see Chapter 1.


    When you create a Windows Application project, VB .NET provides the main form
    for your application and gives it the name Form1. This form automatically loads
    when your application starts. To create new forms, and have the option to make
    them the default form for your application, see the section "Add a New Form."


    The Development Environment provides a built-in visual form designer. This form
    designer enables you to change the properties of the form in the Property Window
    and use drag and drop to place components. For more information on where to find
    the Property Window or how to use the Development Environment, see page Chapter
    1.


    A Form is the main display element for a stand-alone application. You can create
    any window that you use on your computer in VB .NET using Form dialog boxes, toolbar
    windows, and main application windows. The section "An Introduction to Window
    Forms" includes a more detailed introduction to the abilities of a form.


    # CREATE A WINDOWS APPLICATION


    ![](img/d6f772854306e15fb6df39b861a7b541_39_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_39_1.png)


    +   1 Click Start > Program > Microsoft Visual Studio .NET > Microsoft Visual
    Studio .NET to start the Visual Basic Development Environment.


    +   To learn how to use the Development Environment, see Chapter 1.


    +   The Start Page appears.


    +   2 Click New Project.


    +   If the Start Page does not appear when you load the Development Environment,
    you can create a new project by going to Help > Show Start Page.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Extra


    Many of the tasks in this chapter expect you to use the Property Window to make
    changes to the forms and controls. In some cases, you may find this window difficult
    to find with the large number of tool windows present at any time on the screen.
    You can access the Properties window by clicking the View menu and selecting Properties
    window from the menu or by pressing the F4 key.


    You can use the Class View window to receive a representation of forms and other
    classes in your project instead of using the Solution Explorer window. The Class
    View window enables you to see the members, such as properties, methods, and events
    that make up all of the classes in the project, and jump directly to specific
    areas of code inside a module. By right-clicking a class inside the window, you
    can change view and sort options. For example, the Group by Type option enables
    you to show the members that make up the class in separate trees, splitting off
    private variables and public members. To show this window, go to the View menu
    and click Class View.


    ![](img/d6f772854306e15fb6df39b861a7b541_40_0.png)


    1 The New Project dialog box appears.


    3 Click Visual Basic Projects if it is not currently selected.


    4 Click Windows Application Project.


    5 Type a name for the project.


    6 Click OK.


    The Development Environment creates a project directory and a default Form1 that
    loads into the client area.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# AN INTRODUCTION TO WINDOWS FORMS


    You can use Windows Forms, a large technology encompassing a huge set of tools,
    to build powerful Windows applications quickly and easily. In this chapter, topics
    cover creating forms, manipulating forms, and adding controls to those forms.


    To understand the capabilities of a form, see the summary of important Form members
    given below. A member refers to any part of a component in VB.NET available for
    your manipulation or viewing. Forms, controls, and classes all have a set of members
    such as properties, methods, and events that give them their ability to perform
    certain tasks. For more information on object-oriented terms, see Chapter 7.


    A Form provides the backdrop where all of your application’s abilities are accessible.
    Controls provide the functionality on the form, enabling the user to view, edit,
    manipulate, and explore your application. A control is anything that you place
    onto a form, like a button, or a list box, or a check box. To learn how to add
    controls to your form, see the “Add a Control” section.


    The tables below do not include all of the abilities of a form, but touch on some
    of the abilities that you may find interesting or useful. Many members that are
    shown here are covered more fully throughout the chapter. For more information
    on setting a form’s properties, see the section “Set a Property.” For more information
    on responding to a form’s events, see the section “Add an Event.”


    # IMPORTANT FORM MEMBERS


    | PROPERTIES | DESCRIPTION |

    |---|---|

    | AcceptButton | Set this property to a Button control that automatically activates
    when the user presses Enter. The AcceptButton only activates if the current control
    uses the Enter key, like a multi-line text box, the current control uses the key
    press and the button does not receive the click event. |

    | AutoScale | Makes the form and its controls automatically resize to fit user
    font-size preferences. You may want to change this to False for proprietary interfaces
    not using standard controls. |

    | AutoScroll | When True, AutoScroll adds scrollbars to the form when all of its
    constituent controls do not fit. |

    | BackgroundImage | Loads an image into the form’s background. The image tiles
    across the entire form. Supports a large number of formats, including BMP, GIF,
    JPEG, PNG, WMF, and others. |

    | CancelButton | See the description of AcceptButton above, except CancelButton
    functions on the Esc key. |

    | FormBorderStyle | Sets the border of the window. The default setting is Sized,
    which allows resizing. You use the FixedDialog setting to create a fixed window
    that looks like a dialog box. Fixed3D creates a fixed window with a sunken client
    area. |

    | Location | This property determines the position of the window on the Desktop.
    Windows automatically corrects it depending on the position of the Taskbar. You
    need to set StartPosition to Manual for Location to work. |

    | MaximizeBox | Determines whether the form displays a maximize button in the
    title bar. |

    | MaximumSize | A Point object specifying the maximum width and height the form
    reaches. Beware: This is also in effect when you maximize the form. |

    | Menu | Determines which MainMenu control actually provides the menu interface
    for the window. |

    | MinimizeBox | Determines whether the form displays a minimize button in the
    title bar. |'
  merge: -1
