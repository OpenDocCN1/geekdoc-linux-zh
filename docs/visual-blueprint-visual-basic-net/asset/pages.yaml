  img_proc: true
- pgno: 134
  md: "# Apply It\n\nUsing a recursive method, you can build entire directory trees\
    \ using the DirectoryInfo component. In fact, you can use this recursive algorithm\
    \ to fill a TreeView control and build an Explorer-like program. This example\
    \ assumes you add a TreeView control named TreeView1 to the form. To learn more\
    \ about adding a TreeView control to a form. See Chapter 3 to add controls to\
    \ the form.\n\n# TYPE THIS:\n\n```\nPrivate Sub Form1_Load(...)\n    BuildNode(\"\
    My C Drive\", \"C:\\\", TreeView1.Nodes)\nEnd Sub\n\nSub BuildNode(ByVal Name\
    \ As String, ByVal FullPath As String, ByVal nodes As TreeNodeCollection)\n  \
    \  Dim directory As New IO.DirectoryInfo(FullPath)\n    Dim newNode As TreeNode,\
    \ subDir As IO.DirectoryInfo\n    newNode = nodes.Add(Name)\n    Try\n       \
    \ For Each subDir In directory.GetDirectories()\n            BuildNode(subDir.Name,\
    \ subDir.FullName, newNode.Nodes)\n        Next\n    Catch\n        ' an error\
    \ occurred. Add a response here.\n    End Try\nEnd Sub\n```\n\n# RESULT:\n\n-\
    \ My C Drive\n  + Document and Settings\n  + Inetpub\n  + Program Files\n    +\
    \ Accessories\n    + Common Files\n  Temp\n  + WinNT\n\n![](img/d6f772854306e15fb6df39b861a7b541_134_0.png)\n\
    \n4 To list the contents of the directory, declare a storage variable and create\
    \ a loop to access the contents of the directory.\n\n5 Type code to access the\
    \ records.\n\n6 Press F5 to run the project.\n\nThe DirectoryInfo class responds\
    \ with file and directory listings, and by manipulating the underlying directory\
    \ structure.\n\nThe example declares a subDirectory variable and creates a For\
    \ Each loop."
