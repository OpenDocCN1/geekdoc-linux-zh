- pgno: 291
  md: '# AN INTRODUCTION TO COMPONENT CREATION


    Visual Basic .NET enables you to create components that you can use and reuse
    throughout your Windows, console, Web, and service applications.


    > Components are classes that work more effectively as design tools in application
    development.


    # Ease of Use


    You can easily create your own components in code or assemble them from the existing
    components in the .NET Framework classes, using either Visual Basic .NET or C#.
    You can use non-visual components and associated features to easily incorporate
    resources such as message queues, event logs, and performance counters into your
    applications.


    The .NET Framework classes greatly expand the component programming capabilities
    of Visual Studio .NET. Instead of a limited set of base classes, you have a large
    library of sophisticated components that you can use to assemble applications,
    or to derive high-quality components of your own.


    # Component Visual Development


    The new rapid application development, or RAD, support makes authoring controls
    and non-visual components as easy as creating forms. You start with


    inheriting from an existing component, and add other components to build in the
    functionality you need.


    # COMPONENT TYPES


    You can build components that service a variety of purposes based on the needs
    of a particular project, or for reuse throughout multiple projects. All the components
    support working within the visual designer of the Development Studio, enabling
    you to use drag and drop to add components to your projects and to modify properties
    visually with the Properties window.


    You can also create a specialized type of components known as controls. You can
    create controls that offer functionality to a form just like the controls provided
    by the .NET Framework. You can create both Windows and Web controls that offer
    their own visual interface and allow you to drag and drop them onto their respective
    forms.


    # CREATE A COMPONENT CLASS


    Components are a new idea in VB .NET. A basic component lets you create an object
    very similar to a class, which adds support for the designer. Standard components
    work in all types of applications, including console applications where no visual
    interface is available.


    more easily than a typical class. You can modify the properties of the component
    visually instead of setting up a class in code. For example, you can easily add
    the Timer control to a form or any other application type and modify its properties
    in the Properties window, but the Timer itself provides no graphical interface.


    You can use components to create objects that offer important functionality to
    forms, which you manipulate


    # Project Type


    You can add a component to a class library or a Windows Control Library project.
    You can then build this library and reference it in applications that need to
    use the component. For information on adding references, see the section "Reference
    a Library."


    # Component Base


    You create components by inheriting from the System.ComponentModel.Component class
    or implementing the IComponent interface. For more information, see the section
    "Create a Component."'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# CREATE WINDOWS CONTROLS


    You can build a Windows control, a specialized type of component, to create custom
    and reusable graphical interfaces. As with VB.NET and third-party controls, you
    can create controls that you can drag and drop onto Windows Forms and work with
    in the Properties window to define their appearance and functionality.


    control''s properties appear in the Properties tool window, and you can visually
    manipulate your component in the designer. For example, you can create a custom
    button control that provides special visual effects. You can build a Windows custom
    control to create a specialized ListView control that displays the contents of
    a directory.


    Your control can expose properties and methods, and use a GDI+ drawn graphical
    interface or use a combination of one or more standard controls. Your


    To add a control to your Windows Application projects, see the section “Create
    a Windows Forms Control.”


    # Project Type


    You can build Windows controls either by creating them directly inside existing
    Windows Application projects or using a Windows Control Library project.


    If you add the control directly to a project, you can use it only within the project.
    The Windows Control Library builds a DLL that you can reuse across multiple Windows
    Application projects easily by referencing the library as necessary.


    # Component Base


    VB.NET creates a UserControl class that inherits from System.Windows.Forms.UserControl.
    The UserControl object provides a design surface to build a complex control easily,
    and inherits from the ContainerControl class to add all of the standard properties
    and functions you expect in a Windows Forms control.


    # CREATE WEB CONTROLS


    A powerful new feature of VB.NET, Web Forms, lets you create server-side applications
    that maintain their state and provide advanced functionality. You can create Web
    User Controls that encapsulate functions of a Web Form for reuse and ease of development.


    add a control to your project, see the section “Create a Web User Control.”


    You can build two types of Web controls. Web user controls enable you to define
    a visual layout combining multiple existing user controls. For example, you can
    create a Web user control that defines the top border of your Web site and then
    import the control in the various parts of your site. Web user controls embed
    into the page at runtime, so you cannot see the control at design time or manipulate
    its properties using the designer. To


    The other type of Web controls, Web custom controls, work only in Web Control
    Library projects. You generate the actual HTML these controls send to the browser
    and the controls cannot use existing Web controls on which to build. You can reference
    these controls in a Web Forms project and work with them just like the actual
    controls provided by the .NET Framework. Custom controls let you drag and drop
    the control directly onto the form from the Toolbox and use a full set of properties
    and events. To create custom controls, see the section “Create a Web Control Library.”


    # Project Type


    You add Web user controls directly into existing Web Application projects.


    You use Web custom controls by building a Web Control Library project and referencing
    the library in Web Application projects.


    # Component Base


    VB.NET provides a Web Control Library project template, which automatically creates
    a WebControl class that inherits from the System.Web.UI.WebControls.WebControl
    class.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# CREATE A COMPONENT


    Components provide reusable code in the form of objects. Components are a special
    type of class that you can add to the Toolbox and manipulate using the designer.
    Components provide no visual interface on a form and appear in the Component Tray.
    The ability to work with the component using the designer means the developer
    can quickly and easily modify component properties in a point-and-click manner.


    To create a component, you use the Component Class template provided by the Development
    Studio. The template provides a constructor and initialization routine for you.


    To define a component, you add public methods, properties, and events to the component
    just like you would with a class. Unlike a normal class, you can define extra
    information about properties and events of the component that a designer can use
    when the user manipulates the component at design time. To specify a description
    for a property, place the attribute Description() inside angle brackets (<>) before
    the


    Property statement or accessibility keyword with the description as the parameter.
    You can hide a property by specifying the Browsable() attribute with False as
    the parameter.


    To add your component to an application after you reference the library that contains
    the component, you simply double-click the component in the Toolbox. You can then
    use the Properties window to manipulate public properties of the component. Because
    the component is a specialized kind of class, you can also create an instance
    of the component in code using the New operator. For more information on specifying
    which properties are public, how accessibility works, and how to create class
    instances, see Chapter 7.


    When you create a set of components in a library, you can use namespaces to help
    locate components more easily for reuse. You can see Chapter 8 for information
    on using and creating namespaces.


    # CREATE A COMPONENT


    ![](img/d6f772854306e15fb6df39b861a7b541_293_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_293_1.png)


    1 Create a new Class Library project or open an existing project.


    Note: See Chapter 1 to create a new project.

    2 Click Project ⇨ Add Component.


    3 Type a name for the component.


    4 Click Open.'
  merge: -1
  img_proc: true
