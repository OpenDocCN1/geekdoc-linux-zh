- pgno: 127
  md: '# READ FROM A STREAM


    A stream provides a conduit to access many different types of data with the same
    set of methods and properties. For example, the FileStream class enables you to
    access data in files and the NetworkStream class lets you access data from a network
    socket. You can use a stream reader to retrieve information from any sort of stream.


    The simplest reader, StreamReader, works with textual information and you can
    use it to read information from a text file.


    To declare a new instance of the class, place New in front of the class name and
    pass the constructor of the StreamReader class an instance of a file stream. For
    more information on instantiating classes, see Chapter 7.


    After creating the reader, call the Read method to retrieve one character out
    of the stream. Read returns the next available character from the stream as an
    Integer and moves the current position to the next character. It returns negative
    one if no more characters remain in the buffer. Use the ReadLine method to read
    a line out of the text file, return it as a String, and advance the current position
    to the next line. The ReadToEnd method retrieves all of the data from the current
    position to the end of the stream and returns it as a String.


    The Peek method extracts the character at the current position but does not consume
    it or advance to the next character position. Like Read, the Peek method returns
    a negative one if the stream contains no more data. You can use Peek to determine
    if you have reached the end of the file without reading any data out of it. Always
    use the Close method after you finish reading from the file to release any resources.


    # READ FROM A STREAM


    ![](img/d6f772854306e15fb6df39b861a7b541_127_0.png)


    +   1 Open a method that initializes a stream.

    +   Note: See the section "Using a File Stream" to create a file stream.

    +   2 Type Dim myReader: replacing myReader with the variable name for the reader.

    +   3 Type As New IO.StreamReader(myStream), replacing myStream with the name
    of the Stream.

    +   4 Type code to read from the file.

    +   5 Press F5 to run the project.


    The stream reader processes the text in the file.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# WRITE TO A STREAM


    A stream works in two directions, streaming information in and out of your program.
    You can use a stream writer to output information to a data source. You can use
    a stream writer to write to a file stream that you open with write access, or
    write data over a socket connection on a network.


    A simple stream writer, the StreamWriter class, provides support for writing textual
    data. To declare a StreamWriter, use the Dim statement. To declare a new instance
    of the class, place New in front of the class name and for the most basic constructor,
    pass the StreamWriter class an instance of a file stream. Chapter 7 provides detailed
    information on instantiating classes and using constructors.


    After you initialize a StreamWriter, the Write method writes a Char, Char array,
    or a String to the stream but does not move to the next line. The variable passes
    in as the only parameter. For more information on strings, see Chapter 4. The
    WriteLine method performs the same action but automatically adds a new line to
    the file stream.


    When you call the Write or WriteLine method, the stream updates in memory only.
    The Flush method writes any new data you store in the stream to the file. You
    can write a large amount of information to the stream and flush it to disk in
    one step. Doing a single large write to disk is more efficient because memory
    transfers data much faster than disks. If the data needs to move to the disk immediately
    after calling Write or WriteLine, set StreamWriter.AutoFlush = True.


    The Close method closes the writer''s connection to the file and removes any resources
    from memory related to the writing. Unwritten data automatically flushes to the
    file before the StreamWriter closes.


    # WRITE TO A STREAM


    ![](img/d6f772854306e15fb6df39b861a7b541_128_0.png)


    +   1 Open the method that initializes the stream.

    +   Note: See the section "Using a File Stream" to create a file stream.


    +   2 Type Dim myWriter, with myWriter with the variable name for the reader.


    +   3 Type As New IO.StreamWriter(myStream), replacing myStream with the name
    of the FileStream.


    +   4 Type code to write to the file.


    +   5 Press F5 to run the project.


    +   The stream writer outputs text to the file.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# VISUAL BASIC .NET


    # WATCH FOR FILE SYSTEM CHANGES


    The Windows Explorer immediately updates whenever a file saves onto disk. The
    Windows subsystem allows programs to request notification when certain directories
    update. You can receive events using the FileSystemWatcher class when file system
    changes occur on a particular drive or directory.


    You can create an instance of the FileSystemWatcher class or you can add the FileSystemWatcher
    to a Windows Form from the Component category of the Toolbox. This topic assumes
    you use the Windows Form component because of the simplicity it adds through the
    visual interface.


    The Path property specifies what drive or directory the component monitors for
    changes. Set IncludeSubdirectories to include any directories under the specified
    Path. The EnableRaisingEvents property enables or disables the component''s notification
    events.


    The component provides four events that fire when file system changes occur: Changed,
    Created, Deleted, and Renamed. For more information on events in Windows Forms,
    see Chapter 2.


    The Changed event fires when an attribute of a file changes such as the file size,
    last modified date, and last viewed date. You alter the NotifyFilter property
    to set conditions for when the Changed event fires. For example, set NotifyFilter
    to LastWrite to have a component fire only when an application writes to a file.


    The Created event fires when a new file or directory appears in the file system.
    The Deleted event fires when the user removes a file or directory from the file
    system, and the Renamed event fires when a file or directory name changes.


    Each of the events passes a FileSystemEventArgs object as variable e to your event
    handler. The object includes a property Name that specifies the name of the file
    or directory of the change relative to the specified Path. The property FullName
    returns the entire path. For the Renamed event, the property OldFullName specifies
    the previous name of the file.


    # WATCH FOR FILE SYSTEM CHANGES


    ![](img/d6f772854306e15fb6df39b861a7b541_129_0.png)


    +   1. Create a new Windows Application project or open an existing one.

    +      This example loads a ListBox control onto the form to display the output.


    +   2. In the Toolbox, click the Components category.

    +   3. Double-click the FileSystemWatcher component.

    +      The component loads into the form''s component tray.


    +   4. In the Properties window, type the path to watch in the Path property.

    +   5. Set any other necessary properties.


    +   6. Double-click the FileSystemWatcher in the component tray.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Extra


    You can use a few rules to make sure your FileSystemWatcher performs properly.
    The FileSystemWatcher watches disks as long as you do not switch or remove them.
    If network problems occur for a remote drive, the component may no longer respond
    to changes. The FileSystemWatcher does not function with CDs or DVDs, because
    the drive content is static. FileSystemWatcher only works on Windows 2000 and
    Windows NT 4.0. Remote machines must have one of these platforms installed for
    the component to function properly. However, you cannot watch a remote Windows
    NT 4.0 computer from a Windows NT 4.0 computer.


    You can alter the buffer size of the FileSystemWatcher depending on the size of
    the file system. The system notifies the component of changes through a buffer.
    If many changes occur in a short time, the buffer can overflow, causing the component
    to lose track of changes in the directory. The InternalBufferSize property lets
    you alter the amount of memory used by the control. Increasing the size of the
    buffer can cause significant reduction in computer speed, so increase the buffer
    as little as possible. To avoid buffer overflows, use the NotifyFilter, and IncludeSubdirectories
    properties to filter out unwanted notifications.


    ![](img/d6f772854306e15fb6df39b861a7b541_130_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_130_1.png)


    The Changed event loads into the Code Editor.


    7 Type the code to respond to the Changed event.


    You can handle the Created, Deleted, or Renamed properties instead of Changed
    or respond to multiple events.


    Note: For more information on working with events, see Chapter 3.


    8 Press F5 to run your project.


    The FileSystemWatcher records changes made in the Path.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# ACCESS FILE INFORMATION


    You can use the FileInfo class of the IO namespace to move through files and directories,
    delete and move files, and modify attributes.


    To link the FileInfo class to a file, create an instance of the class using the
    New keyword. The constructor accepts one parameter, the path and filename you
    want to access. After creating the instance of class, you can begin to access
    properties.


    The DirectoryName property returns the full path of the file. If you want to access
    properties of that directory, the Directory property provides access to the DirectoryInfo
    object. For more information on DirectoryInfo, see the section "Access Directory
    Information."


    The Extension property returns the extension of the file, the three- or four-character
    extension following the final period in the filename. The Name property specifies
    the


    name of the file with no path. FullName returns the entire path including the
    filename. The Length property returns a Long and specifies the number of bytes
    in the file. The Attribute property enables you to retrieve or change the attributes
    of the file.


    The CreationTime property enables you to retrieve or change the creation date
    and time of the file using a DateTime variable. The LastAccessTime property enables
    you to retrieve or change the most recent access of the file. The LastWriteTime
    property enables you to retrieve or change recent write to the file.


    The Delete method removes the file from the file system permanently, and requires
    no parameters. CopyTo copies the file to a new location. Pass a string as the
    argument with the path of the new location. You can provide the path to copy to,
    or a new filename for the copy. MoveTo performs the same action except the method
    copies the file to the new location and removes the original.


    ![](img/d6f772854306e15fb6df39b861a7b541_131_0.png)


    +   1. Create a new project or open an existing one.


    +   2. Open the method or event where the file functions need to occur.


