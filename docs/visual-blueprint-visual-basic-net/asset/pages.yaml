- pgno: 227
  md: '# WORK WITH DATA COLUMNS


    You define a database table with a set of columns, or fields, which describe sections
    of data in each record of the table. The DataColumn object stores the information
    of a column in a DataTable. You can use the DataColumn object, which stores column
    information in a DataTable, to retrieve or modify the details of a table. For
    more information on the DataTable control, see the section “Work with Data Tables.”


    The Caption property stores the textual caption for the column. The ColumnName
    property specifies the actual name of the column. A column within a data adapter
    is equivalent to the column name in the actual database table. To specify the
    type of the column, you set the DataType property using the System.Type.GetType
    method to return a variable type based on its name. You pass the name as a string
    for the parameter. For a list of valid data types, search the VB .NET help for
    the DataColumn.DataType Property topic.


    The DefaultValue property specifies the column’s default value when you create
    a new row. The MaxLength property determines the maximum amount of text the column
    can hold per row for a string column. The ReadOnly property ensures that you cannot
    change the column after you add the record. When you enable the AllowDBNull property,
    the column accepts blank values, which VB .NET represents with the DBNull constant.
    You can access the table that owns the column using the Table property.


    You can create the DataColumn object and add it to a DataTable object to define
    a table in your application. For the constructor of the DataColumn, pass the name
    of the column followed by a data type for the column as the two parameters. You
    can add the column to a DataTable by calling the Add method of the DataTable.Columns
    property.


    The example below iterates through the list of columns in a data table and displays
    information about the columns using a ListBox control for display. You can modify
    the example to work with a specific column instead. You can also substitute any
    display or manipulation method.


    The DefaultValue property specifies the column’s default value when you create
    a new row. The MaxLength


