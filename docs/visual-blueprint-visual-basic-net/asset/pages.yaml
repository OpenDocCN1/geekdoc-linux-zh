- pgno: 132
  md: '# Extra


    The Attributes property consists of a bit-wise combination of constants from the
    FileAttributes enumeration. You can use the Attributes property to test a file
    for particular attributes. To test a file, use the And operator combined with
    a constant. To set the attributes for a file, combine multiple attributes with
    the Or operator and assign the value to the Attributes property. A table of the
    most important constants in FileAttributes appears here. See Visual Basic .NET
    help for the full list.


    # FILEATTRIBUTE CONSTANTS:


    | NAME | DESCRIPTION |

    |---|---|

    | Archive | Applications use this attribute to mark files for backup or removal.
    |

    | Directory | A folder or directory. |

    | Hidden | Ordinary directory listings do not list this file. |

    | Normal | The file is normal and has no other attributes set. |

    | ReadOnly | You cannot write to this file. |

    | System | The file is part of the operating system. |


    # Example:


    ```

    Dim file As New IO.FileInfo("c:\test.txt")

    '' assign attributes

    file.Attributes = IO.FileAttributes.Hidden Or IO.FileAttributes.Archive

    Dim test As Boolean

    '' check attributes

    test = file.Attributes And IO.FileAttributes.Hidden

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_132_0.png)


    7 To perform an action on the file, type myFile.CopyTo ("C:\NewTest.txt"), replacing
    myFile with the variable name assigned to the FileInfo class, and "C:\NewTest.txt"
    with the destination for the CopyTo.


    Alternatively, you can replace CopyTo in step 7 with Delete or MoveTo.


    8 Press F5 to run your project.


    The FileInfo class modifies file properties, accesses file properties, and uses
    methods to perform disk operations.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# ACCESS DIRECTORY INFORMATION


    Directories listings help the user to store documents in a hierarchal, logical
    manner. You can view and modify disk directory structures using the DirectoryInfo
    class.


    The IO namespace contains the DirectoryInfo class. You declare a variable to hold
    the class using the Dim statement. To create an instance of a class, use the New
    statement. The constructor needs only one argument, the name of the directory,
    to load into the DirectoryInfo class. For more information on instantiating classes
    and using constructors, see Chapter 7.


    The Name property retrieves and sets the name of the directory and FullName returns
    the entire path including the drive letter. You can return the parent directory
    with the Parent property, which returns a DirectoryInfo class. The Root property
    returns the bottom-most directory in the specified path. For example, if you have
    the directory


    on the local computer, Root returns the root drive directory as a DirectoryInfo.


    You can use the GetDirectories method to return an array of DirectoryInfo classes
    representing this directory''s subdirectories. The GetFiles method returns an
    array of FileInfo classes that represent the files in the directory. Both methods
    have optional parameters to specify a search pattern to filter directories or
    files. For example GetFiles("*.txt") returns only files with a txt extension.
    For more information on arrays, see Chapter 4.


    The CreateSubdirectory method creates a subdirectory relative to the directory
    loaded into the DirectoryInfo. Pass the subdirectory path in as the only parameter.
    Use the MoveTo method to move the entire directory and all of its contents to
    another location. Pass the new location in as the single parameter. The Delete
    method deletes the entire directory and all of its content.


    ![](img/d6f772854306e15fb6df39b861a7b541_133_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_133_1.png)


    +   1. Create a new application or open an existing one.


    +   2. In the method or event, type Dim myDir As New IO.DirectoryInfo("C:\"),
    replacing myDir with the variable name, and C:\ with the path to load into the
    class.


    +   3. Type code to access any necessary properties or methods.


    The example creates a new subdirectory.'
