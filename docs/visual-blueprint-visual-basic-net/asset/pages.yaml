- pgno: 135
  md: '# PROVIDE A FILE DIALOG BOX


    You use the File Open and Save dialog boxes every day to work with applications.
    In most cases, these dialog boxes enable a user to move between applications and
    understand how to load and save documents in the same method. The OpenFileDialog
    and SaveFileDialog controls enable you to use common dialog boxes for users to
    select files in your application.


    Both of these dialog boxes are available as Windows Form controls in the Toolbox.
    The control appears in the Component Tray when loaded and allows you to edit properties
    concerning its appearance.


    The Filter property specifies the file types that the dialog box displays. You
    can specify the list of supported file formats here so users know which files
    they can select. The Filter property contains a description followed by the format
    to filter separated by pipe characters (|). You can add multiple filters by placing
    a pipe character between them. If your application supports opening the text file
    format, you need to add an entry to the Filter property to allow the user to see
    only text files for selection. For example, the Filter may look like "Text files
    (*.txt)|*.txt|All files (*.*)|*.*". You can specify the default file using the
    FilterIndex property with the first filter index 1.


    The InitialDirectory specifies the directory the dialog box loads when it appears.
    ValidateNames insures the user does not enter invalid characters.


    The DefaultExt property specifies an extension to add to files automatically when
    the user does not enter one. You must set AddExtension to True for this to occur.


    To show either file dialog box, call the ShowDialog method. The method does not
    accept a parameter, but it returns a DialogResult specifying the user''s selection
    of OK or Cancel. For more information on dialog boxes and DialogResult, see Chapter
    3.


    The FileName property contains the full path of the file the user selects.


    # PROVIDE A FILE DIALOG BOX


    ![](img/d6f772854306e15fb6df39b861a7b541_135_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_135_1.png)


    +   1 Create a new Windows Application project or open an existing one.

    +   2 In the Toolbox, double-click either the OpenFileDialog or SaveFileDialog
    control.


    The control appears in the Component Tray of the current form.


    +   3 In the Property Window, type a file filter string in the Filter property.

    +   4 Edit any necessary properties.


    The example above sets DefaultExt = "txt".

    Note: See Chapter 2 for information about editing a property value.'
  merge: -1
  img_proc: true
