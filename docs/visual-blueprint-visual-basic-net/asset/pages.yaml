- pgno: 191
  md: '# USING STRUCTURES


    A structure is a simplified class. Structures distinguish themselves from classes
    by primarily functioning as a data storage mechanism rather than a representation
    of an object. Structures support properties, methods, and events just like classes.
    If you need to pass a large amount of data between methods, you can create a structure
    to contain the data and pass the single structure variable instead.


    You define a structure in VB .NET using the Structure...End Structure block. Inside
    the block, place only variable declarations or procedures types Function, Property,
    or Sub. You can declare a variable using Public to make it function like a property,
    or declare it Private and use it for storage of a public property. Property declarations
    follow the syntax of a class. For more information on member variables, see the
    section "Define a Member Variable," and for properties, see Chapter 4.


    Function and Sub statements form methods exactly like they do for classes. For
    more information on creating a method, see the section "Define a Method." You
    can define events in the structure that you raise in methods of the structure.
    See the section "Create an Event" to create an event.


    A structure works like a data type, meaning you create an instance of the structure
    without using the New keyword. In VB .NET, this makes it a value-variable instead
    of a reference-variable, because the variable you create holds the corresponding
    Structure, while a class variable holds a reference to a class you declare using
    the New keyword. Simply declare a structure like any other variable. See Chapter
    4 to declare a variable. Use the name of the Structure as the variable type name.
    When you define a variable based on a Structure, you can access its members just
    like a class.


    ![](img/d6f772854306e15fb6df39b861a7b541_191_0.png)


    +   1 Open the file where you need to define the structure.

    +   2 Type Structure and follow it with a name for the structure.

    +   3 Press Enter. VB .NET creates the End Structure statement.


    +   4 Define appropriate member variables.

    +   Note: See the section "Define a Member Variable" to define a member variable.

    +   5 Define appropriate properties.


    +   6 Define appropriate methods.

    +   Note: See Chapter 4 to define a method.


    Note: See the section "Define a Property" to define a property.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# Extra


    Structures have a few very specific rules that set them apart from classes. You
    can use these rules to decide whether a class or a structure is most appropriate
    for your data. The default accessibility of data members in structures if you
    declare them with the Dim statement is public. The default accessibility in classes
    and modules is private. Unlike the declarations of data members of classes, the
    declarations of data members of a structure cannot set the values of a variable
    during declaration. Data type definitions also cannot include the New keyword,
    or initial sizes for arrays. Normally, methods use structures to return a large
    quantity of data, so the class sets the values before passing it.


    *Inheritance* is a way for classes to build off of one another. If you want to
    inherit the data type that you create with a structure, use a class instead. Structures
    cannot inherit from any other type, and other structures or classes cannot inherit
    from them. All structures are implicitly *NotInheritable*. For more information
    on inheritance, see Chapter 8. Structures can implement an interface. See the
    section "Implement an Interface" earlier in this chapter for more information
    on interfaces.


    ![](img/d6f772854306e15fb6df39b861a7b541_192_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_192_1.png)


    7 In the class or module where you want to use the structure, declare a variable
    using the name of the structure as the variable type.


    Note: See Chapter 4 to define a variable.


    8 Access the structure elements in a method or event by typing the variable name
    of the structure and following it with a period and the name of the member.


    9 Press F5 to run your project.


    The structure holds and returns data appropriately.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# USING COLLECTIONS


    Collections are built-in classes provided by Visual Basic .NET that store a list
    of items. This description sounds much like an array, but the Collection class
    provides a much more powerful storage mechanism. You can use a collection to store
    any type of data, including simple variable types, arrays, classes, and objects.
    The Collection class''s ability to resize dynamically at runtime creates a powerful
    yet memory efficient storage mechanism. For a Collection, the list is one-based,
    meaning the first item is index one.


    To create a collection, declare a new instance of the Collection class. Add items
    to the Collection using the Add method. Pass the variable or object to add to
    the collection as the first parameter. Optionally, pass a key as the second parameter.
    A key value is a string you use to identify the object you added. Although you
    do not have to specify a key, doing so makes finding objects you add to the collection
    much easier. You must make the key values unique for each object.


    The third and fourth parameters of the Add method enable you to specify the key
    or index of an existing item in the collection to place the new object. The new
    object adds before the item you specify for the third argument, or adds after
    the item you specify for the fourth argument. You cannot specify both. If you
    specify neither, the new object adds to the end of the list.


    The Item property returns an item based on the index or the key. Pass either of
    these values to the Item method to return the appropriate item. You can use a
    For Each...Next loop to quickly iterate through the entire collection. For more
    information on For loops, see Chapter 4.


    # USING COLLECTIONS


    ![](img/d6f772854306e15fb6df39b861a7b541_193_0.png)


    # CREATE A COLLECTION


    +   1 In the module, method, or event to define the collection, type Dim and follow
    it with a variable name.

    +   2 Type As New Collection() to define the new instance.


    +   If you declared the collection as a member of the class or module, move to
    a method or event handler to enter code to use the collection.


    +   3 Type myList.Add("Item #1"), replacing myList with the instance name of the
    Collection, and "Item #1" with the object to add to the Collection.


    +   Optionally, you can type a comma and a string defining the key for the object.


    +   4 Repeat step 3 to add the necessary items.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Extra


    Keep in mind that the flexibility of the Collection means it uses significantly
    more memory than an array. If you need to store a primarily unchanging and fixed-size
    set of data, the array provides much better performance. See Chapter 4 for more
    information on creating arrays.


    The Item property is the default member of the class. You can retrieve an item
    just by placing parentheses after the variable name of the collection with the
    key value or index inside. To remove a single item, you use the Remove method.
    This method accepts the index or key of the item to remove. The Count method returns
    the number of items in the collection.


    # Example of the default property:


    ```

    value = myCollection("myKey")

    ```


    # Example of removing an item:


    ```

    myCollection.Remove("myKey")

    myCollection.Remove(1)

    ```


    # Example of the using Count:


    ```

    MessageBox.Show("The number of items in the collection is " & myCollection.Count())

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_194_0.png)


    # LIST ITEMS


    +   5 Declare a variable of the same type as the objects in the Collection.


    +   6 Type For Each item In myList, replacing item with the variable in step 5,
    and myList with the Collection object''s instance name.


    +   7 Press Enter to insert Next.


    +   8 Type code to use the items in the Collection.


    +   9 Press F5 to run your project.


    The Collection stores and retrieves items of any type.'
  merge: -1
