- pgno: 223
  md: '# ADD A CONNECTION TO A FORM


    After you set up a database connection, you must add the connection to your application
    so you can access the database. See the section "Create a Database Connection"
    for more on connecting to a database. The OleDbConnection and SqlConnection components
    hold a connection to a database for a particular form or class. Although the OleDbConnection
    component supports a variety of database connections through the OLEDB database
    specification, it does not perform as well as the SqlConnection due to its layers
    of compatibility. For that reason, this chapter uses the SqlAdapter combined with
    Microsoft SQL Server 2000. Although this chapter shows the use of SqlAdapter,
    the functionality of the OleDbAdapter is the same except for the name of the component.


    The connection component provides no ability to access the database directly.
    Instead, a data adapter component bridges the gap. The SqlDataAdapter provides
    support for SqlConnection components. The data adapter component stores the appropriate
    SQL command text to retrieve, modify, add, and remove items from the database.
    With this, the adapter can provide two-way access to the database.


    The DataSet component provides the final piece required to access the database.
    A DataSet uses the SqlDataAdapter to retrieve a set of tables from the database
    and store them into memory. Then your program can modify the data and write changes
    back when complete. The SqlDataAdapter provides a method, Fill, that loads a table
    of information into a DataSet. You provide the SqlDataAdapter''s Fill method with
    the instance of the DataSet as the first parameter and the table to load as the
    second parameter.


    Visual Basic .NET completes the sequencing of components automatically. When you
    add the database connection to the form, Visual Basic .NET creates both the connection
    and adapter components. A wizard enables you to provide the appropriate SQL command
    for the SqlDataAdapter. Another dialog box lets you select the appropriate tables
    to load into the DataSet.


    # ADD A CONNECTION TO A FORM


    ![](img/d6f772854306e15fb6df39b861a7b541_223_0.png)


