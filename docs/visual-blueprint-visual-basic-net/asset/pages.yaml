  md: '# USING THE SELECT CASE STATEMENT


    You can use the Select Case statement to check a single variable for a variety
    of possible conditions. For example, if you want to display a message that depends
    on a number entered by the user, you can create a large number of If statements
    for the different possibilities. For more information on If statements, see the
    section "Using the If Statement." The Select Case statement compares any simple
    data type including strings.


    example, using the example myNumber from above, the line Case 2 tests myNumber
    = 2. If the condition is True, the code directly after the Case statement run
    until the compiler reaches either another Case statement or an End Select statement.


    To build a Select block, use Select Case followed by the variable to evaluate.
    For example, if you have an integer myNumber, you can test its value with Select
    Case myNumber. The End Select statement closes the block of code. Inside of the
    block, use the Case statement to run a conditional test on the variable. To test
    for equality, place the value you want to compare to the variable in the Select
    Case directly after the Case statement. For


    To test for conditions other than equality, such as less than, greater than, less
    than or equal to, or greater than or equal to, you use the Is keyword after the
    Case statement. For example, Case Is < 5 runs if the integer value is less than
    five.


    You use the To keyword to create range conditions. For example, if you want the
    Case to run if the integer is between 5 and 10, use Case 5 To 10. You must place
    the lower bound of range on the left side of the To and the higher bound on the
    right.


    # USING THE SELECT CASE STATEMENT


    ![](img/d6f772854306e15fb6df39b861a7b541_115_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_115_1.png)


    +   1. Create a new project or open an existing one.

    +   2. Create or open the method where the test needs to execute.

    +   3. Type any initialization code necessary before the test begins.

    +   4. Type Select Case x, replacing x with the variable to test.

    +   5. Press Enter.

    +   6. Type Case 5, replacing 5 with the appropriate test.

    +   VB .NET automatically adds the End Select statement.'
