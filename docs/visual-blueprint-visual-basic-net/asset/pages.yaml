- pgno: 254
  md: "# Apply It\n\nTo create a list of buttons that perform together, you can set\
    \ each of the buttons in the list's CommandName property to a single name and\
    \ set the CommandArgument property to a specific value. For example, in a shopping\
    \ page, you may have ten Add to Cart buttons. You can set the CommandName equal\
    \ to \"AddToCart\" and set each CommandArgument to the ID of the product.\n\n\
    # TYPE THIS:\n\n```\nSub HandleCommandAction(ByVal sender As Object, _\n    ByVal\
    \ e As System.Web.UI.WebControls.CommandEventArgs) _\nHandles Button1.Command,\
    \ Button2.Command\n\nIf e.CommandName = \"AddToCart\" Then\n    Dim productNumber\
    \ As Integer = CInt(e.CommandArgument)\n    Label1.Text = \"You chose to buy product\
    \ #\" & productNumber\nEnd If\nEnd Sub\n```\n\n# RESULT:\n\nYou chose to buy product\
    \ #145\n\n![](img/d6f772854306e15fb6df39b861a7b541_254_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_254_1.png)\n\
    \n+   - The Click event loads in the Code Editor.\n+   - Type code to specify\
    \ an action for the button.\n+   - The example changes the text displayed in a\
    \ label control.\n\n+   - Press F5 to run your application.\n+   - Note: To work\
    \ with label controls, see the section \"Add a Label Control.\" For general coding\
    \ tasks, see Chapter 4.\n\n+   - Your Web Application responds to a button-click\
    \ using your server-side code."
  merge: -1
  img_proc: true
- pgno: 255
  md: '# ADD OPTION CONTROLS


    You can create CheckBox and RadioButton controls for users to select on your Web
    Form. These controls function nearly identically to the controls with the same
    name in the Windows Forms Framework. The CheckBox control enables the user to
    select multiple check boxes on the form, while a RadioButton control allows the
    user to select only a particular control from the group.


    You use the Text property to set text for both of the option controls. You can
    place HTML codes inside the Text property to create bold, italics, or various
    size fonts. The TextAlign property specifies if the text displays to the right
    or left of the check box or radio button, with the default being Right. You can
    use an option control with no text combined with an Image to provide selections
    for graphical items. If you choose an image, the text displays as a tooltip when
    the mouse rests over the image.


    For the RadioButton control, the GroupName property specifies the name of the
    group for the control. Specify the same group name for a set of RadioButton controls
    to make them function together. If the user selects one of the items in the group,
    all of the other items in the group deselect.


    For check boxes, you can use the Checked property to retrieve or set the check
    status of the control. If the form submits and the user selected an option control,
    the Checked of that option control property equals True.


    To create a long set of either check boxes or radio buttons, you can use the CheckBoxList
    or RadioButtonList controls, which enable you to create one Web Forms control
    with an entire set of controls automatically. You can also bind the list control
    to a database to have a list of items created automatically. For more information,
    see the section "Work with Option List Controls."


    # ADD OPTION CONTROLS


    ![](img/d6f772854306e15fb6df39b861a7b541_255_0.png)


    +   1 Create a new Web Application project or open an existing one.

    +   Note: See the section "Create a Web Application" to create a Web Application
    project.


    +   2 Click either the CheckBox or RadioButton control in the Toolbox and add
    an appropriate number of the control to the form.

    +   Note: See the section "Using a Web Form" to add a control.


    +   3 Click a control to select it.


    +   4 Type a caption into the Text property.


    +   5 Set the radio button or check box properties.


    For a group of radio buttons, type the same group name for each of the controls
    you create into the GroupName property.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Extra


    In some cases, you may want to place code for controlling the RadioButton or CheckBox
    control inside a separate event, rather than handling it in a button that accepts
    changes in the form. You can use the CheckedChanged event of both controls to
    monitor changes to the Checked property. The event is a non-post-back event, so
    the event stores and fires as soon as the user invokes an event that requires
    a server connection, like clicking a button.


    You may want to know immediately when the user clicks one of the controls. Normally,
    VB .NET saves the event and fires it along with a post-back event to cause fewer
    round-trip connections to the server, which can consume a significant amount of
    time and interrupt the user. You can use the AutoPostBack property to enable post-back
    behavior for this control. When you set AutoPostBack to True, the CheckedChanged
    property causes the browser to submit the page to the server, allowing your event
    to fire and a new page to generate.


    ![](img/d6f772854306e15fb6df39b861a7b541_256_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_256_1.png)


    +   6 Double-click the Checked property to toggle it to True for appropriate controls.


    +   7 Edit any optional properties.


    +   8 Run your project by pressing F5.


    For radio buttons, only one radio in a group can have Checked = True.


    The option buttons respond to user input and let you make selections.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# WORK WITH OPTION LIST CONTROLS


    Option list controls, only available in Web Forms, let you provide a list of multiple
    check boxes or radio buttons that function as a single control. You can also add
    and work with individual CheckBox and RadioButton controls to a page. Working
    with the controls individually lets you control the layout and appearance of each
    item, applying separate fonts and colors. The two option lists create a sequence
    of options easily, and can bind to a database to automatically provide the selection
    list. The section "Adding Option Controls" provides more information on CheckBox
    and RadioButton controls, and "Bind A Field to a List Control" shows how to bind
    controls to a database.


    listed. You can use these lists to generate a selection menu on a form while simplifying
    the page. To provide the list, edit the Items collection. The List Items Collection
    Editor lets you specify the caption for each item with the Name property, and
    assign a Value to each item to distinguish the items from one another. If you
    do not set the Value property, the control assigns the text in Name to the Value
    property.


    The SelectedIndexChanged event let you handle a selection. A non-post-back event,
    it stores and fires when the user invokes an event that requires a server connection,
    such as clicking a button. See the section "An Introduction to Web Forms" for
    more information on events. For the RadioButtonList, access the single selected
    item using the SelectedItem or SelectedIndex property. For the CheckBoxList, use
    a For Each loop to loop through the Items collection. Check each item''s Selected
    property to see if the user selected the item.


    The CheckBoxList and RadioButtonList controls create a sequence of CheckBox or
    RadioButton controls, respectively. For each RadioButtonList, the user may select
    only one of the controls listed; for each CheckBoxList, the user can select any
    number of items


    # WORK WITH OPTION LIST CONTROLS


    ![](img/d6f772854306e15fb6df39b861a7b541_257_0.png)


    +   1 Create a Web Application project or open an existing one.

    +   2 Click either the CheckBoxList or RadioButtonList control.

    +   3 Add the control to the form.

    +   Note: See "Create a Web Application" to create a Web Application project and
    "Using a Web Form" to add a control to a Web form.

    +   4 In the Properties window for the control, click the Items property.

    +   5 Click ...'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Extra


    You can use a set of properties provided by both of the option controls to change
    their default appearance, beyond standard font and color changes. Both the CheckBoxList
    and RadioButtonList controls list the options contained in the Items collection
    from top to bottom by default. You can change the RepeatDirection property from
    Vertical to Horizontal to make the list of items flow from left to right instead
    of top to bottom. You can set the RepeatColumns to have the list control split
    the items into a number of columns. A value of zero or one causes the control
    to show one column, a value of two shows two columns, and so on.


    Normally, the option list controls do not fire an event immediately after an item
    changes. They wait until a control posts back to the server for the event to fire.
    You can change this default behavior, and cause the option list controls to post
    back to the server and fire the SelectedIndexChanged event immediately. Set the
    AutoPostBack property equal to True for this behavior to occur. This requires
    the user''s Web browser to reload the page, which causes performance issues on
    all but a direct network connection to the Web server.


    ![](img/d6f772854306e15fb6df39b861a7b541_258_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_258_1.png)


    The ListItem Collection Editor appears.


    +   6 Click Add.


    +   7 Type Text and Value properties for the item.


    If desired, you can set Selected = True.


    +   8 Repeat steps 6 through 7 as necessary.


    +   9 Click OK.


    +   10 Press F5 to run your project.


    The CheckBoxList or RadioButtonList allows selection of the items it contains.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# USING VALIDATION CONTROLS


    Validation controls enable you to check the values of user-entered data to ensure
    the values make sense. The validation controls automatically generate client-side
    scripts to provide this validation.


    Web Forms provide a number of validation controls. The RequiredFieldValidator
    ensures that the user completes in an input control, such as a text box. The RangeValidator
    checks that a user''s entry falls in a valid range of values. The CompareValidator
    checks the user''s entry in one control against that in another control, or against
    a string value. For information on the regular expression validation, see the
    section "Work with Regular Expression Validation." To create a listing of validation
    errors, see the section "Provide a Validation Summary."


    A validation control binds to a single input control on the form that you specify
    using the ControlToValidate property. The ErrorMessage property appears in the
    validation control when the validation fails. The Display property controls how
    the control shows errors. If you set Display to Static, the control uses space
    on the form but remains blank until an error occurs. With the Dynamic setting,
    the control uses no space until an error occurs, and then becomes visible. If
    you set the page layout for Flow, this moves elements on the page to make space
    for the validation control. The EnableClientScript property enables the use of
    JavaScript to perform the validation on the client. Otherwise, the control performs
    the validation using a round trip to the server.


    For the CompareValidator control, you set the ControlToCompare property or the
    ValueToCompare property against the the text you want to compare. The Operator
    property specifies the comparison. The Type property specifies the variable type
    to use for the comparison.


    For the RangeValidator control, set the MinimumValue and MaximumValue properties
    to the lower bound and upper bound of the acceptable entries. Use Type to specify
    the variable type for the comparison.


    ![](img/d6f772854306e15fb6df39b861a7b541_259_0.png)


    +   1 Create a new Web Application project or open an existing one.

    +   2 Add necessary input controls to the form and validation controls to the
    form.

    +   3 In the Properties window, click the ControlToValidate and click the appropriate
    input control.

    +   4 Type an error message into the ErrorMessage property.

    +   5 For the CompareValidator, click ControlToCompare''s and select a control
    or type a value for the ValueToCompare property.

    +   If necessary, click the Operator and Type to select a value.


    Note: See the sections "Create a Web Application" to create a new project and
    "Using a Web Form" to add controls.'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Extra


    Each of the validation controls, except for the RequiredFieldValidator control,
    accepts a blank entry without causing a validator error. In the input controls
    you validate, you may want to perform a test using a RangeValidator or RegularExpressionValidator
    control but do not want the user to leave the input control blank. For example,
    a RangeValidator control accepts a blank value even if the range for the validation
    is from 10 to 100. You can require the user to provide an entry for the input
    control and then validate the entry by adding a RequiredFieldValidator along with
    the RangeValidator, RegularExpressionValidator, or other validation control. You
    then specify the same input control in the ControlToValidate property for each
    validation control. You can customize the error message appropriately for each
    validation control using the individual ErrorMessage properties of the two validation
    controls. To conserve space for the use of two different validation controls relating
    to a single control, you can add a validation summary control. For more information
    on the ValidationSummary control, see the section "Provide a Validation Summary."


    ![](img/d6f772854306e15fb6df39b861a7b541_260_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_260_1.png)


    +   6 For the RangeValidator control, set the MinimumValue and MaximumValue properties.


    +   If necessary, click the Type and select a value.


    +   You can repeat steps 2 through 6 as necessary.


    +   7 Press F5 to run your project.


    The validation controls validate the data in the input controls appropriately.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# WORK WITH REGULAR EXPRESSION VALIDATION


    A method of testing a string with a complex condition set, a regular expression
    specifies a format that a string must follow. You can use the RegularExpressionValidator
    control on your Web Forms to use a regular expression to validate complex data
    entries, such as phone numbers, social security numbers, or other strings that
    follow standard formats. To set up the validation control, you set the ControlToValidate
    property to a valid input control, using the ErrorMessage property to specify
    the message. For more information on the standard properties of validation controls,
    see the section "Using Validation Controls."


    To setup the validator, you assign the regular expression you create to the ValidationExpression
    property. To build a regular expression, determine the test that needs to occur
    on the input data. To match individual characters other than reserved characters
    (. $ ^ { [ ( | ) ] * + ? \), type the character into the expression. To use these
    special characters, place a slash (\ ) in front of them. The period (.) matches
    any character other than a new line character (\n).


    You place a list of characters that a single character in the tested string must
    match in block brackets ([]). You can also place ranges in the block, for example,
    A-Z to match any uppercase letter, or 0-9 to match any number. Avoid using separators
    in the block to separate entries, for example [A-Za-z] matches any upper- and
    lowercase character. You can repeat a character by placing the number of times
    it should appear in braces {}. For example, [0-9]{5} checks for five digits in
    a row.


    Place a caret (^) as the first character in the block to mean not. A caret indicates
    that the character in the test string must not match any characters in the list.
    For example, [^aeiou] matches any non-vowel character.


    # WORK WITH REGULAR EXPRESSION VALIDATION


    ![](img/d6f772854306e15fb6df39b861a7b541_261_0.png)


    +   1 Create a new Web Application project or open an existing one.


    +   2 Add the necessary input control to the form.


    +   3 Add a RegularExpression Validator control to the form.

    +   Note: See the sections "Create a Web Application" to create a new Web Application
    project and "Using a Web Form" to add controls.


    +   4 In the Properties window, click the ControlToValidate and select the appropriate
    input control.


    +   5 Type an appropriate error message into ErrorMessage.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Extra


    Regular expressions support many expressions, and can represent very advanced
    strings. You can use the table for more regular expression strings. For more expressions,
    search Visual Basic .NET help by typing Regular Expression Language Elements.


    | EXPRESSION | DESCRIPTION |

    |---|---|

    | . | Matches any character except the line break. |

    | \w | Matches any word character. Same as [a-zA-Z_0-9]. |

    | \W | Matches any non-word character. Same as [^a-zA-Z_0-9]. |

    | \s | Matches any white-space character. |

    | \S | Matches any non-white-space character. |

    | \d | Decimal digit. Same as [0-9]. |

    | \D | Nondigit. Same as [^0-9]. |

    | * | Specifies zero or more matches; for example, \w* or (abc)*. Same as {0,}.
    |

    | + | Specifies one or more matches; for example, \w+ or (abc)+. Same as {1,}.
    |

    | ? | Specifies zero or one matches; for example, \w? or (abc)?. Same as {0,1}.
    |

    | {n} | Specifies exactly n matches; for example, (pizza) {2}. |

    | {n,} | Specifies at least n matches; for example, (abc) {2,}. |

    | {n,m} | Specifies at least n, but no more than m, matches. |


    ![](img/d6f772854306e15fb6df39b861a7b541_262_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_262_1.png)


    6 Type a regular expression in the ValidationExpression property.


    +   - The example uses the regular expression \d{3}-\d{2}-\d{4} to validate a
    social security number.

    +   - You can click [...] to view a list of commonly used expressions.


    The regular expression validator checks the input against the regular expression
    and outputs the error message if they do not match.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# PROVIDE A VALIDATION SUMMARY


    You can provide one validation summary area on your form instead of having validation
    for each control display individually. You use the ValidationSummary control to
    integrate validation information on the form into a single area.


    The ValidationSummary control holds the validation text of all the validation
    controls on the form. Although it displays the errors only after the user presses
    a control like a button, the client-side browser performs the validation without
    a roundtrip to the server. You can disable the EnableClientScript property to
    force validation summary generation to occur on the server. You can set the CausesValidation
    property of a LinkButton, Button, or ImageButton control to False to enable the
    user to click the button without causing a validation. If you disable the client
    scripting display for the validation summary without disabling the CausesValidation
    property button, the button''s click event still does not fire until the user
    corrects validation errors.


    You can use the DisplayMode to change the listing style to BulletList, List, or
    SingleParagraph. The default, BulletList, shows one validation error per line,
    prefaced with bullets. The List setting uses the same layout without the bullets.
    The SingleParagraph setting places one error after the other without line breaks,
    and wraps text when necessary.


    Because the summary control displays the list of errors of all the validation
    controls on the form, you may want to remove the visual display of the various
    validation controls on the form. To remove the visual interface of each validation
    control, set its Display property to None. This hides the individual validation
    controls but still displays the correct information in the ValidationSummary control.


    On some longer forms, you may want to use both displays, one directly beside the
    control, and the other as a reference at the top of the page.


    ![](img/d6f772854306e15fb6df39b861a7b541_263_0.png)


    # CREATE A VALIDATION FORM


    +   1 Create a new Web Application project or open an existing one.

    +   2 Set up the necessary input and validation controls, adding a post-back control
    such as a Button to generate the summary.

    +   Note: To create a validation control, see the section "Using Validation Controls."

    +   3 Add a ValidationSummary control to the Web form.

    +   Note: To add a control, see the section "Using a Web Form."

    +   4 Change any necessary properties.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Extra


    The validation summary by default does not display a message at the top of the
    summary explaining the list of errors. You can place a header on the summary with
    the HeaderText control. The header does not display unless the summary also contains
    at least one error. For other visual changes, you can change the default red color
    of the errors with the ForeColor property.


    Your page may not have enough room for the validation summary control. You can
    cause the validation summary control to display its list of errors as a message
    box instead of displaying on the page. Assuming the browser supports scripting
    and EnableClientScripting is set to True, you can enable the ShowMessageBox property,
    which shows a message box when the user clicks a button containing the list of
    errors. If you choose to use ShowMessageBox, you can disable the standard summary
    appearance. You can enable or disable the main display of the control with the
    ShowSummary property.


    # Example:


    ```

    ValidationSummary1.HeaderText = _

    "You must enter an appropriate value "

    "in the following fields:"

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_264_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_264_1.png)


    # HIDE VALIDATION CONTROLS


    5 Click a validation control.


    6 In the properties window, click the Display property and then click None.


    7 Repeat steps 5 and 6 for all of the validation controls.


    8 Press F5 to run your project.


    The validation summary displays the necessary validation errors.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# ADD AN ADDITIONAL WEB FORM


    You can add multiple Web Forms to a single Web project just like you add multiple
    Windows Forms to a Windows project. Each form represents a single Web page of
    the Web site. For example, you may use the initial Web page to display the options
    in the application, and then a number of pages for each major section of the page.
    Unlike a Windows Application that compiles into a single executable file with
    a single entry point, a Web Application is simply a series of individual ASPX
    files that store the individual forms.


    To add a new form, use the Project menu. When you access the Add Item dialog box,
    you can specify the new form''s filename. The Development Environment builds a
    blank Web Form and adds the necessary files to the Web folder.


    You can choose individual settings for the layout details and browser requirements
    for each Web Form in the project. For instance, you can make the main page of
    the application support the most browser types possible. Then, for particularly
    complex pages, you can require a high-level browser. To learn how to edit individual
    page properties and to set browser requirements, see the section "Using a Web
    Form."


    You can add HyperLink controls to link from one page in the project to another.
    The HyperLink control simply adds a standard HTML-based hyperlink to a page. You
    can use the Target property of the HyperLink control to make the page load into
    a separate window if you want to keep the previous page open. For more information
    on using the hyperlink control, see the section "Add a Hyperlink Control."


    ![](img/d6f772854306e15fb6df39b861a7b541_265_0.png)


    1 Create a new Web Application project or open an existing one.


    2 Click Project → Add Web Form.


    The Add New Item dialog box appears.


    3 Type a filename for the new form.


    4 Click Open.


    > Note: To create a Web Application project, see the section "Create a Web Application."'
  merge: -1
  img_proc: true
- pgno: 266
  md: "# Extra\n\nAlthough a hyperlink provides a simple way for the user to move\
    \ from a page within your project to a location anywhere on the Internet, you\
    \ can use code to redirect the user without their interactively clicking a hyperlink.\
    \ You may want to redirect the user when they click a button and need to move\
    \ on to a new page. For example, the user completes a form of personal information\
    \ in order to log in to the site. When the user presses Submit, you can add the\
    \ information to a database and direct the user to the members page. To cause\
    \ a redirection, call the Redirect method of the Response object. In parentheses,\
    \ place the URL to load. You do not need to make the URL a Web Form or something\
    \ inside of your project. You can use any URL accessible to the client you want.\n\
    \nExample:\n\n```\nPrivate Sub Button1_Click(ByVal sender As System.Object, ByVal\
    \ e As System.EventArgs) Handles Button1.Click\n\n    Response.Redirect(\"webform2.aspx\"\
    )\n\nEnd Sub\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_266_0.png)\n\nVB\
    \ .NET adds the new Web Form to the project.\n\n+   5 Open a form accessible to\
    \ the client browser that needs to open the new page.\n\n+   6 Add a hyperlink\
    \ control and set the NavigateUrl property to the name of the new form.\n+   Note:\
    \ To create a hyperlink, see the section \"Add a Hyperlink Control.\"\n\n+   7\
    \ Press F5 to run your project.\n\nThe project builds the new page and displays\
    \ the default page in the project.\n\nYou can access the new Web Form by pressing\
    \ the hyperlink on the main page."
  merge: -1
  img_proc: true
- pgno: 267
  md: '# BIND A FIELD TO A LIST CONTROL


    You can bind a database field for users to display dynamic database information
    through the Web Form. Web Forms data binding is read-only, which means a control
    can load information but does not save changes into the data set.


    In Web Forms, you most often use list controls for binding. The ListBox, DropDownList,
    CheckBoxList, and RadioButtonList controls all support data binding explicitly.
    You can use a list control to display items that read from a data source. Each
    item in the control corresponds to a row in the data source. The control displays
    one field from the source and can optionally use a second field as the item value.
    You optionally set the item value to the unique key field in the database so you
    can easily locate the record for processing.


    To set up a list control, specify the DataSource property to reference a data
    source, such as a DataSet or DataView component, for the page. For more information
    on creating database connections, see Chapter 9.


    You specify which data-source fields the control displays with the DataTextField
    property. Specify the field to function as the item value with DataValueField.
    If the data source has only one field, you do not set the properties, and the
    control displays the single field automatically.


    To update each of your bound controls, you must call their DataBind method. Alternately,
    you can call the form’s DataBind method, which binds every control on the form
    that contains a binding. You should only call this method when the page loads
    and when data changes. To make sure the page does not rebind the data source each
    time it loads, check the IsPostBack property. If the property is False, the page
    is loading for the first time, and you need to bind the controls.


    # BIND A FIELD TO A LIST CONTROL


    +   1 Create a new Web Application project or open an existing one.

    +   2 Add a data source to the page.

    +   3 Click the ListBox, DropDownList, CheckBoxList, or RadioButtonList controls
    in the Toolbox and add it to the form.

    +   Note: To create a database connection, see Chapter 9. See the section ''Work
    with Option List Controls'' for more on the CheckBoxList and RadioButtonList controls.

    +   4 Click the DataSource in the Properties Window and select a DataSet or DataView.
    If the DataSet contains multiple tables, click the DataMember and select the appropriate
    table.

    +   5 Click the DataTextField and select the field to display. Optionally, click
    the DataValueField and select a field that specifies values for the items.

    +   6 Double-click the page.


    ![](img/d6f772854306e15fb6df39b861a7b541_267_0.png)'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Extra


    When the user selects an item in the list controls, the SelectedIndexChanged event
    fires. You can handle this event to load information based on an item the user
    selects. The ListBox.SelectedItem.Value property contains the value ID assigned
    by the database. The SelectedIndexChanged event is not a post-back event for any
    of the four controls. You can cause the list controls to post back to the server
    and fire the SelectedIndexChanged event immediately by setting the AutoPostBack
    property to True.


    # Example:


    ```

    Private Sub ListBox1_SelectedIndexChanged(ByVal sender As Object, _

    ByVal e As System.EventArgs) Handles ListBox1.SelectedIndexChanged

    Dim custID As String              '' get the selected item''s value

    custID = ListBox1.SelectedItem.Value   '' to find the entry in the database

    '' search the database for the selected ID

    Dim rs As DataRow = DataSet1.Customers.FindByCustomerID(custID)

    Label1.Text = r("Address")       '' display the information from

    Label12.Text = r("City")         '' the database

    Label13.Text = r("State")

    Label11.Text = r("Zip")

    End Sub

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_268_0.png)


    6 The source editor loads the Page_Load event.


    7 Type code to fill the DataSet.

    Note: To work with the DataSet object, see Chapter 9.


    8 Type If Not IsPostBack Then and press Enter.


    9 Type the name of the list control followed by .DataBind() inside the If block.


    10 Press F5 to run your project.


    The list Web server control displays the appropriate field of the table.'
