- pgno: 209
  md: "# INHERIT A FORM\n\nBecause a Form in VB .NET is nothing more than a class,\
    \ you can inherit a form into a new form using standard inheritance techniques.\
    \ You can use visual inheritance of forms to create base forms that encourage\
    \ uniform appearances and easier management. For example, a base form can represent\
    \ the appropriate size and button placements for the dialogs in the application.\
    \ Each dialog in the application inherits this base form and builds the interface\
    \ necessary for the particular dialog, but maintains the same size and button\
    \ functionality of the base form.\n\nThe Windows Forms Designer supports inheritance\
    \ for forms. On the designer, inherited controls appear with a small icon over\
    \ them to indicate that they inherit from the base class. You can change properties\
    \ of the inherited items, but cannot delete them because the base class predefines\
    \ them. See the section \"Inherit from Existing Classes\" for more information\
    \ on inheriting classes.\n\nAll of the event handlers you specify in the base\
    \ form automatically work the same in the inherited form. If a button on the base\
    \ form specifies an event handler, the inherited form's button calls the event\
    \ handler in the base class. If you add an event handler in the inherited class\
    \ for a component on the base class, both event handlers fire. The base class's\
    \ event handler fires first, followed by the inherited class's event handler.\n\
    \nYou can override an event handler in the base form, however. To accomplish this,\
    \ place the Overridable keyword in the definition of the base class's event handler,\
    \ and then create a new method in the inherited class with the same parameter\
    \ list. Do not place the Handles keyword on the inherited form's override method.\
    \ If you want to call the base form's event handler inside the overridden method,\
    \ use the MyBase object to access the base form.\n\n# INHERIT A FORM\n\n![](img/d6f772854306e15fb6df39b861a7b541_209_0.png)\n\
    \n+   1. Create a new form or open an existing one to act as the base class adding\
    \ controls as necessary.\n+   \n+      Note: See Chapter 1 to build a project.\n\
    \n+   2. Build the project.\n+   \n+      Note: See Chapter 2 to build a project.\n\
    \n+   3. Click Project -> Add Inherited Form.\n\n+   4. Type a name for the inherited\
    \ form.\n\n+   5. Click Open."
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Extra


    Remember that the inheritance of a form is not a one-time operation. Although
    you inherited from a base form in a particular state, you can always change the
    base form to add functionality. For example, you can update the base form to replace
    old controls with new ones that have the same function but a more attractive appearance.
    Likewise, you can debug the code in the base form and have it automatically update
    all of the inherited forms. To alter the base form, make sure you close all inherited
    forms. You then open the base form, make changes, and rebuild the project. When
    you reopen inherited forms, you see your changes.


    When using inheritance on forms, you do not need to inherit controls. You can
    create a base form that declares useful variables and methods so you do not need
    to replicate them in each form you create. You can build a very powerful base
    form that makes programming additional forms quite simple. Make sure to add the
    Overridable keyword, when appropriate, to allow inherited forms to extend the
    functionality.


    ![](img/d6f772854306e15fb6df39b861a7b541_210_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_210_1.png)


    6 Select the form you created in step 1 to act as the base form.


    The Inheritance Picker dialog appears.


    7 Click OK.


    VB .NET creates the inherited form.


    You can now modify and extend the form using standard visual design techniques.


    Note: See Chapter 8 to learn how to override methods. See Chapter 3 to modify,
    add controls, and manipulate the form.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# CREATE A THREAD


    Threads enable multiple parts of your application to execute concurrently. You
    can use threads to start a calculation or network connection without affecting
    the usability of the program. For example, when your application performs a search
    of the file system for the user, you do not want to force the user to stop working
    in another part of your application while waiting for the search to complete.
    Instead, you can create a thread to complete the search that runs concurrently
    with the rest of your application.


    Threading in VB.NET operates using a free-threaded system. With free-threading,
    all threads run in the same memory space in the application. This means you can
    access all variables, objects, and components available in the program through
    the thread. Before you create a thread, understand that many complexities arise
    when multiple parts of code access variables and objects concurrently. See the
    section "Write Thread-Safe Code" for more information on Visual Basic .NET''s
    synchronization commands.


    In VB.NET, a thread runs the code of a single method in a separate thread. The
    method can call other methods in its thread. To create a new thread, you create
    a new instance of the Thread class. The System.Threading namespace contains the
    Thread class. You pass the address of a method to run using the AddressOf keyword.
    For more information on using AddressOf, see the section "Using Delegate and AddressOf".


    To start the thread, call its Start method with no parameters. The thread runs
    until it meets one of three conditions. The thread stops when the code in the
    method completes, when the process containing the thread ends (normally meaning
    your program exits), or when you stop the execution explicitly. See the section
    "Modify Thread Execution" for more information.


    The Thread.CurrentThread method returns the currently running thread. You can
    use this method anywhere, which makes it easy to receive an instance of the thread
    you create.


    # CREATE A THREAD


    ![](img/d6f772854306e15fb6df39b861a7b541_211_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_211_1.png)


    +   1. Create a new project or open an existing one.

    +   The example uses a console project.


    +   2. Add a method to a code module for the thread to run.

    +   Note: See Chapter 4 for more information on console applications.


    +   3. Type Dim followed by a variable name.


    +   4. Type As New System.Threading.Thread ().


    +   5. Inside parentheses, type AddressOf followed by the name of the method.

    +   The example loads the thread in Sub Main.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Extra


    Keeping track of a large number of threads consumes significant processor time.
    If you need to use a large number of threads, for example ten or twenty, you may
    find that they perform very poorly because the system spends more time switching
    between threads than running them. Also, if you are using most of the processor
    time in your process, threads in other processes run less frequently. You can
    ease the requirements of threading by using the minimum number of threads to accomplish
    a particular task. For example, you may need to search four different database
    tables or download ten different Web pages in your application. You know threads
    enable your application to respond to the user during this operation, but creating
    all the threads at once for the operation can cause more harm than good, especially
    on slower computers. Experiment with different numbers of concurrent threads to
    see which yields the best performance. See the section “Write Thread-Safe Code”
    to learn how you can start a new thread when one completes using the Join method
    or a ThreadPool object. Threadpool allows you to queue an unlimited number of
    threads and let the system determine how many to run.


    ![](img/d6f772854306e15fb6df39b861a7b541_212_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_212_1.png)


    6 On a new line, type the variable name for the thread followed by .Start()


    7 Repeat steps 3 through 7 to start as many threads as necessary.


    B Press F5 to run your project.


    The threads run the code in the method concurrently.


    > Note: To write thread-safe code for multiple threads or for input and output
    operations, see the section "Write Thread-Safe Code."'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# WRITE THREAD-SAFE CODE


    Although threading is one of the most difficult and frustrating tasks in modern
    programming, Visual Basic .NET makes threading simple and easy when you carefully
    program. The problem with free-threading is that every thread of your application
    runs in the same memory space, meaning the threads all access the same objects.
    You must make sure that the threads of your application do not interfere with
    each other by interacting with the same object. You can use commands in VB .NET
    to create thread-safe code.


    In general, the .NET Framework is not thread-safe, meaning if two threads attempt
    to access the same object at the same time, the object does not contain code to
    respond properly. Particularly, the Windows Forms classes cause many problems
    when not carefully managed.


    To make sure you do not have more than one thread access an object, you use the
    SyncLock block. When you use the SyncLock statement, you provide VB .NET with
    an object,


    inside parentheses, on which to lock. The End SyncLock statement marks the end
    of the block you want to lock. For example, you may have a list of results that
    you want to load into a ListBox control. However, you do not want more than one
    thread to access the ListBox at once, because the ListBox control is not thread-safe.
    You can provide the ListBox control as the SyncLock object and place the command
    to add information to the ListBox inside the lock. Then, if another thread runs
    the same lines of code, VB .NET forces the thread to wait until the previous lock
    releases.


    In some cases, you can start a thread after another completes to avoid synchronizing
    objects in use by the two threads. Call the Join() method and pass another thread
    object as the parameter to cause the thread to wait until the thread you specify
    completes. Place this command inside the code of another thread to make it wait
    for another thread to complete.


    ![](img/d6f772854306e15fb6df39b861a7b541_213_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_213_1.png)


    +   1. Open a module that contains the method the thread runs.

    +   2. Type `SyncLock()`.

    +   3. Inside the parentheses, type the object on which you want VB .NET to lock.

    +   4. Press Enter to complete the block statement.

    +      - VB .NET creates the End SyncLock statement.


    _Note: For more information about creating a thread, see the section “Create a
    Thread.”_'
  merge: -1
  img_proc: true
- pgno: 214
  md: "# Extra\n\nBecause creating a large number of threads can use a significant\
    \ quantity of resources, VB .NET includes the `ThreadPool` class. This class stores\
    \ a queue of waiting methods you select to run on a thread independent of the\
    \ application. The `ThreadPool` automatically manages the number of threads to\
    \ create depending on the system speed and OS resources in use. For example, if\
    \ you queue ten methods to run in separate threads, the `ThreadPool` class determines\
    \ that three threads can run optimally on the system, and starts the first three\
    \ methods in the queue in unique threads. As methods finish, new methods from\
    \ the queue begin.\n\n```\n**Example:**\n```vb\nSub ThreadMe(ByVal state As Object)\n\
    \    SyncLock (ListBox1)\n        ListBox1.Items.Add(\"Thread running\")\n   \
    \ End SyncLock\nEnd Sub\n\nPrivate Sub Form1_Load(...) Handles MyBase.Load\n \
    \   Dim x As Integer\n    For x = 1 To 10\n        Dim y As New Threading.WaitCallback(AddressOf\
    \ ThreadMe)\n        System.Threading.ThreadPool.QueueUserWorkItem(y)\n    Next\n\
    End Sub\n```\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_214_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_214_1.png)\n\
    \n+   5. Add a call to non-thread-safe object's method or property.\n\n+   6.\
    \ Run your project by pressing F5.\n\n+   The non-thread-safe object performs\
    \ properly and multiple threads access the object."
  merge: -1
  img_proc: true
- pgno: 215
  md: '# MODIFY THREAD EXECUTION


    The Thread class provides a variety of functions for greater control over threads.
    You can call these methods to affect the execution of the threads you create.
    For example, if you execute a complex task in the background, you can provide
    the ability to pause, resume, and cancel the operation. The thread object has
    a method for each of these operations.


    The Suspend method stops the execution of the thread at a safe time. Use Suspend
    to pause a thread without danger of crashing the program. The Resume method starts
    a thread that you suspend where the thread last stopped.


    The Sleep method lets a thread wait for data while consuming only minimal CPU
    cycles. You can use this to make the thread wait for a specified number of milliseconds
    before resuming execution. You specify the number of milliseconds to wait as the
    first parameter.


    If you set a thread into a wait state, by using the Sleep method, or the Join
    method explained in “Write Thread-Safe Code,” you can interrupt the waiting and
    cause the thread to resume execution again with the Interrupt method.


    To ask a thread to stop execution, call the Abort method. When you call the method,
    VB.NET issues an exception to the thread. Code in the thread automatically skips
    out of any Try block and exits the thread. The thread may execute a few commands
    before exiting, so use the Join command to wait for the thread to stop completely.


    The IsAlive property of the Thread object returns True if the thread starts and
    is not dead. You can also check the ThreadState property for the status of the
    thread. The property returns a value from the ThreadState enumeration.


    # MODIFY THREAD EXECUTION


    ![](img/d6f772854306e15fb6df39b861a7b541_215_0.png)


    # MAKE A THREAD SLEEP


    +   1. Set up a thread method and the code to start the thread.

    +   2. Type the name of the thread.

    +   3. To make a thread sleep, type `.Sleep` followed by the number of milliseconds
    in parentheses.


    # SUSPEND OR RESUME EXECUTION


    +   4. To pause a thread, type `newThread.Suspend()`, replacing `newThread` with
    the object variable for a thread.

    +   5. To resume execution, type `newThread.Resume()`, replacing `newThread` with
    the object variable.'
  merge: -1
