- pgno: 237
  md: '# EDIT DATA USING BOUND CONTROLS


    To make your database application truly useful, you can allow the user to not
    only browse the records, but also update their contents. Using bound controls
    allows a user to easily add, edit, and update records to the database.


    The DataSet keeps all changes users make to records in memory. Therefore, to update
    the actual database, you need to write the changes back to it. The OleDbDataAdapter
    or SqlDataAdapter controls access the database and maintain the necessary SQL
    commands to perform the update. Call the DataAdapter.Update method to save changes
    in the DataSet. For the two parameters to the Update method, pass the DataSet
    object followed by the name of the table to update as a string. See the section
    "Validate Data" to learn how to check for errors in the DataSet.


    When you add a table to a DataSet using the designer, the DataSet generates custom
    classes to represent the tables, creating methods and properties that match the
    names of the actual tables and fields. In the methods and objects for this section,
    you replace the Table text with the actual name of the table you want to use.
    To add new records to a table in a DataSet, you insert the AddTableRow method
    of the table. For the parameters, you can specify a TableRow object, or you can
    specify a separate parameter for each field to the method. The NewTableRow method
    returns a row setup with the proper default values from the database, so you can
    use it to pass into the AddTableRow method.


    For example, if your table is called Customers, the designer creates a class called
    Customers inside of the DataSet to match the table name. Then, the methods for
    the Customers class include NewCustomersRow, AddCustomersRow, and so on.


    # EDIT DATA USING BOUND CONTROLS


    ![](img/d6f772854306e15fb6df39b861a7b541_237_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_237_1.png)


    +   1. Set up a form with appropriate input and movement controls.


    +   2. Place a button on the form for the user to add and update database rows.


    +   3. Double-click a button to go to the code editor and specify the event handler.

    +   The Code Editor window appears.


    +   4. To update the database, type SqlDataAdapter1.Update(DsNorthwind1), replacing
    SqlDataAdapter1 with the name of the data adapter on the form and DsNorthwind1
    with the DataSet that binds the controls.


    +   5. On a new line, type DsNorthwind1.AcceptChanges(), replacing DsNorthwind1
    with the name of the DataSet.


    > Note: To bind a control, see the section "Bind Controls to a Form." To create
    movement controls, see the section "Move through a DataSet."'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Extra


    To delete a record from a table in the DataSet, access the table object and use
    the method RemoveTableRow, replacing Table with the name of the table. You must
    pass the row to delete. You can access a row by index number using the Rows property
    of the table object. Pass the index of the row you wish to delete in parentheses
    to the Rows property, starting from zero, and it returns a DataRow object. For
    more information on DataTable objects, see "Work with Data Tables." You need to
    update the position that the form displays since the row no longer exists. For
    more information on using BindingContext, see "Move through a Dataset."


    # Example:


    ```

    Dim pos As Integer = Me.BindingContext(DeNorthwind1, "Customers").Position

    Dim row As DataRow = DeNorthwind1.Customers.Rows(pos)

    DeNorthwind1.Customers.RemoveCustomersRow(row)

    Me.BindingContext(DeNorthwind1, "Customers").Position -= 1

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_238_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_238_1.png)


    6 To add a new row, declare a variable of type DataRow.


    7 Type = DsNorthwind1.Customers.NewCustomersRow(), replacing DsNorthwind1 with
    name of the DataSet, and Customers with the table''s name.


    8 Assign values to any fields that do not accept null values.


    9 Type the table name followed by .AddTableRow(row), replacing Table with the
    table name and row with the variable declared in step 5.


    When you run the project, you can add, edit, and update information in the database.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# VALIDATE DATA


    Databases contain specific rules for the data they contain. When users enter data,
    they may not understand the requirements of the data source. You can prevent errors
    in Windows applications by validating the data before allowing the user to update
    it to the database table.


    The ErrorProvider control manages DataSet errors. For information on adding the
    ErrorProvider control to a Windows Form, see Chapter 3. To validate data with
    the ErrorProvider control, set its DataSource property to the DataSet or DataTable
    you want to monitor. If you use a DataSet, you must also set the DataMember to
    the table to watch.


    In the form code, you must set the ContainerControl property of the ErrorProvider
    control to the form for data validation to occur. To check for validation issues
    on a control the user edits, use the input control’s Validating event, which fires
    when the user leaves the input control.


    When you detect an error, you set the event parameter e.Cancel to True and the
    control allows the user to reenter the data. You then alert the DataRow representing
    the row that the user made an error. Use the BindingContext’s Position property
    to determine the current row. For more information on the BindingContext object,
    see the section “Move through a Dataset.”


    After you find the appropriate row, call the SetColumnError method of the DataRow
    object. Provide the column and the error message as the two parameters. For more
    information on the DataRow object, see the section “Work with Data Rows.”


    You also need to respond to the control’s Validated event, where you enter code
    to run when validation is successful. This event runs only if you do not set Cancel
    = True in the Validating event. You remove the error message by using SetColumnError
    again with a blank string for the error message.


    ![](img/d6f772854306e15fb6df39b861a7b541_239_0.png)


    1 Set up a form with input and movement controls, and add an ErrorProvider control
    on the form.


    Note: To bind a control, see “Bind Controls to a Form.” To create movement controls,
    see “Move through a Dataset.” See Chapter 3 to add an ErrorProvider control.


    2 For the ErrorProvider control, click the DataSource property and select the
    appropriate data set component. For DataSet, click the DataMember and select the
    appropriate table.


    3 In the Form_Load event, type ErrorProvider1.ContainerControl = Me, replacing
    ErrorProvider1 with the name of the ErrorProvider control.


    4 In the Validating event of an input control, create an If statement that performs
    the validation test.


    5 Declare a variable to hold the current record index, assigning the Position
    property of the BindingContext to the variable. Note: See page the section “Move
    through a Dataset” to use BindingContext.'
  merge: -1
  img_proc: true
- pgno: 240
  md: "# Extra\n\nInstead of validating with the ErrorProvider, you can use the DataTable\
    \ object to perform validation on every record in the table with the ColumnChanging\
    \ event. Because the DataSet component does not expose the table's events, you\
    \ must create the event handler manually. The event expects two parameters: sender,\
    \ an Object variable, and e, a DataColumnChangeEventArgs object. You can access\
    \ the column that fires the event with e.Column. To cause a validation error,\
    \ create a new Exception object and pass the constructor an error message. Then\
    \ use the Throw command and pass the exception object.\n\n# Example:\n\n```\n\
    Private Sub ColumnChanging(ByVal sender As System.Object, ByVal e As System.Data.DataColumnChangeEventArgs)\n\
    Handles DeNorthwind1.Customers.ColumnChanging\nDim msg As String = \"\", control\
    \ As Object\nSelect Case e.Column.ColumnName\nCase \"CustomerID\"\n    control\
    \ = TextBox1\n    If Len(e.ProposedValue) > 5 Then\n        msg = \"Value cannot\
    \ be longer than 5 characters\"\n    End If\nCase \"CustomerName\"\n    ...\n\
    End Select\ne.Row.SetColumnError(e.Column, msg)\nIf msg <> \"\" Then Throw (New\
    \ Exception(msg))\nEnd Sub\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_240_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_240_1.png)\n\n6 Define a variable that\
    \ represents the current row determined in step 6.\n\nNote: See the section \"\
    Work with Data Rows\" for more about DataRow objects.\n\n7 Type row.SetColumnError\
    \ \"CustomerID\", errMsg replacing \"CustomerID\" with the column name, and errMsg\
    \ with an error string.\n\n8 On a new line, type e.Cancel = True.\n\n9 In the\
    \ Validated event of the input control, type the text in step 6 through 8, replacing\
    \ errMsg with \"\".\n\nWhen you run the project and enter an invalid value, the\
    \ error icon appears with a proper description."
  merge: -1
  img_proc: true
- pgno: 241
  md: '# CREATE A DATA RELATIONSHIP


    In most cases, a single table of a database does not store all of the information
    that makes up the necessary data for an application. Various tables store different
    parts of the information, and you combine the data from the various tables to
    create an application that allows the user to modify all of the related data in
    an effective way. You can define data relationships in your Visual Basic .NET
    application to create complex data displays easily.


    For example, if you have a database containing an Orders and a Customers table,
    the Orders table stores all of the orders that various users make. You can use
    a data relationship to attach the orders that relate to a particular customer
    in the Customers table. VB .NET allows you to set up the DataRelation class visually
    with the XSD editor. When you create a DataSet in your application, an XSD file
    automatically generates to store the various tables you add to the DataSet. For
    more information on creating DataSet objects, see the section "Add a Connection
    to the Form."


    When you access the Add Relationship dialog box, it enables you to select two
    tables and the fields between the tables that match to create the relationship.
    In the previous example, you link the CustomerID field in the Customers table
    to the CustomerID field in the Orders table. You can also set which table functions
    as the parent table, the table where one record specifies multiple records in
    the child table. In the example, the Customers table is the parent because multiple
    orders connect to the same single customer.


    Once you create a relationship, you can display the parent table in a DataGrid
    control and each record automatically links to child records. For more information
    on creating a DataGrid control, see the section "Add a DataGrid Control."


    # CREATE A DATA RELATIONSHIP


    ![](img/d6f772854306e15fb6df39b861a7b541_241_0.png)


    +   1 Set up two data adapters presenting different tables that relate.


    +   2 When you generate the dataset, add both tables from the adapters to the
    same DataSet.


    +   3 Double-click the dataset XSD schema file in the Solution Explorer.


    +   4 Right-click one of the tables and click Add New Relation.


    Note: To create the data connection, see "Create a Database Connection." To add
    data adapters to the form and set up a DataSet object, see "Add a Connect to the
    Form."'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# Extra


    To create a DataRelation object manually, you create an instance of the class
    and pass a name for the relation as the first parameter. Pass the column in the
    parent table to link as the second, and the column in the child table to link
    as the third parameter. After you create the DataRelation object, assign it to
    the DataSet.Relations object using the Add method.


    To manually retrieve the associated entries from the child table, call the GetChildRows
    method of a DataRow with the relationship name as the parameter. The method returns
    an array of DataRow objects that contains the child data associated with the parent
    record. You can go in the other direction and retrieve the parent rows that relate
    to a particular child row using the GetParentRows method of a DataRow.


    # Example:


    ```

    Dim parentCol As DataColumn = DeNorthwind1.Customers.CustomerID

    Dim childCol As DataColumn = DeNorthwind1.Orders.CustomerID

    Dim relCustOrder As DataRelation

    relCustOrder = New DataRelation("CustomersOrders", parentCol, childCol)

    DeNorthwind1.Relations.Add(relCustOrder)

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_242_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_242_1.png)


    +   5 Click [...] and select the table to function as the parent.

    +   6 Click [...] and select the table to function as the child.

    +   7 Click the field you want to act as the key in the parent.

    +   If the dialog box does not properly select the field to act as the child,
    click the proper field.

    +   8 Click OK.


    +   The schema editor creates the relationship.

    +   You can save and close the schema as well as add controls to display the relationship.


    > Note: See the section "Add a DataGrid Control" to add a DataGrid control, which
    is capable of natively displaying data with relationships.'
  merge: -1
  img_proc: true
- pgno: 243
  md: "# ADD A DATA GRID CONTROL\n\nThe DataGrid control allows you to provide an\
    \ editable table-like interface to a table or database query. You can use the\
    \ DataGrid to easily provide editing or viewing functionality on a form without\
    \ creating individual edit controls for each data field. In some cases, however,\
    \ using a form full of simple controls makes more sense for a table with many\
    \ fields or lots of records. For information on the DataGrid Web Forms control,\
    \ see Chapter 10.\n\nYou find the DataGrid control in the Windows Forms section\
    \ of the Toolbox. You can link the control using the DataSource property to a\
    \ DataSet, DataView, or a table contained inside a DataSet. The grid automatically\
    \ creates the necessary columns for the bound grid. If you link the grid directly\
    \ to a DataSet component containing multiple tables, each table displays with\
    \ a hyperlink, which the user can click to access individual tables. Tables containing\
    \ relationships also provide hyperlinks for each row to access the child records\
    \ pertaining to the displayed record. A back button appears as necessary at the\
    \ top of the grid control to move to the parent table. The control also displays\
    \ information about a parent record when you move to a child relationship in a\
    \ single scrolling line in the header.\n\nYou can sort the grid automatically\
    \ by clicking the column headers. You do not need to bind to a DataView control\
    \ to support sorting. You can disable sorting with the AllowSorting property.\
    \ You can set a style for the appearance of the grid using the Auto Format dialog.\n\
    \nWhen the user makes changes to items in the grid, the grid automatically updates\
    \ the associated DataTable inside the DataSet or DataView. You must save changes\
    \ to the database manually. For more information on saving changed information\
    \ to the database, see the section “Move through a Dataset.”\n\n# ADD A DATA GRID\
    \ CONTROL\n\n![](img/d6f772854306e15fb6df39b861a7b541_243_0.png)\n\n+   1. Set\
    \ up a database connection and dataset on the form.\n+   \n+   Note: See the sections\
    \ \"Create a Database Connection\" and \"Add a Connection to a Form\" to set up\
    \ a database.\n\n+   2. Click and drag the DataGrid control from the Windows Forms\
    \ section of the Toolbox to the form.\n\n+   3. Click the DataSource property\
    \ and select the DataSet control or table you want to display.\n\n+   4. Set any\
    \ necessary properties.\n\n+   Note: To set properties, see Chapter 2.\n\n+  \
    \ 5. To format the appearance of the grid, right-click the DataGrid control on\
    \ the form.\n\n+   6. Click Auto Format."
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Extra


    You can use the TableStyles property to modify the appearance of tables you display
    in the grid. When you bind the control to a DataSet, go to the TableStyles property
    in the Properties window and click the link button. Add a DataGridTableStyle object
    and set the MappingName to one of the tables in the DataGrid. Then click the GridColumnStyle
    property in the object editor and click. Here, you can add the columns to display
    for specified table. Also, by clicking the beside Add, you can add text columns
    or check-box columns. Use the MappingName property of each DataGridColumn to specify
    the data column to display, and customize any appropriate properties. You can
    specify formatting strings using the Format property, the width of the column
    using the Width property, and the header text using the HeaderText property. You
    can create multiple DataGridTableStyle objects for each table the grid displays,
    like child relationships. When you run your project and a table appears for which
    you define a style, and the grid automatically uses the style.


    ![](img/d6f772854306e15fb6df39b861a7b541_244_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_244_1.png)


    7 Click a style to apply. A preview displays.


    8 Click OK to select the style.


    9 Press F5 to run your project.


    The DataGrid displays the data in the table and gives hyperlinks to related tables.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# AN INTRODUCTION TO WEB FORMS


    Web Forms, a new technology in the .NET Framework, provides a visual design tool
    for ASP.NET applications inside of Visual Basic .NET. You build a Visual Studio
    Web application around ASP.NET, a platform that includes design-time objects and
    controls, as well as a runtime for developing and running applications on a Web
    server.


    A part of the .NET Framework, ASP.NET is integrated with the rest of the Framework
    and can access all of its features. For example, you can create ASP.NET Web applications
    using any .NET programming language, and then debug with the .NET facilities.
    You access data using ADO.NET, just like in a standard Windows Forms application.
    Similarly, you can access operating system and other services using .NET Framework
    classes.


    # HOSTING REQUIREMENTS


    ASP.NET Web applications run on a Web server configured with Microsoft Internet
    Information Services (IIS). You do not, however, need to work directly within
    IIS. Visual Studio handles file management tasks such as creating IIS applications
    when needed, and provides ways for you to deploy your Web applications to IIS.


    Before attempting to host your application on a remote server, make sure the server
    supports ASP.NET development. To find more information about Microsoft-endorsed
    ASP.NET hosting solutions, visit www.microsoft.com/asp/ and click the Hosted Applications
    Partner Directory.


    # HTML AND CLIENT-SIDE HTML CONTROLS


    Because ASP.NET is a universal server-side architecture, it works only with standard
    HyperText Markup Language (HTML), the standard for transferring web pages over
    the HyperText Transfer Protocol (HTTP) protocol, for its output. HTML files contain
    tags consisting of a text command inside angle brackets (<>). You embed these
    tags in the text to create rich interfaces with fonts, colors, tables, and other
    layouts. For example, to make a block of text appear bold, you place <b> in front
    of, and a </b> at the end of the block of text you want to make bold. You can
    add standard HTML markup to text you include in pages and labels.


    To provide interactivity, ASP.NET relies on standard HTML <form> blocks. Client-side
    HTML controls enable you to accept simple data and send it to the server. You
    use these controls constantly to login to a Web site and sign up for services.
    The table lists the available HTML input controls and the similar control in Windows
    Forms for comparison. Because HTML has few input controls available, you may find
    it difficult to create complex environments using HTML.


    | HTML TAG | SIMILAR WINDOWS FORMS CONTROL |

    |---|---|

    | <input type="button"> | Button control. |

    | <input type="checkbox"> | CheckBox control. |

    | <input type="radio"> | RadioButton control. |

    | <input type="text"> | TextBox control (single-line only). |

    | <textarea> | TextBox control (multi-line). |

    | <input type="password"> | A TextBox control with the PasswordChar property set.
    |

    | <input type="hidden"> | No equivalent; functions like a private variable that
    the user does not see but sends back to the server. |

    | <input type="image"> | PictureBox control. |

    | <input type="file"> | No equivalent; allows the user to upload a file to the
    server. |'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# ASP.NET FRAMEWORK


    You build Web Forms pages on the ASP.NET Page Framework. Each Web Forms page,
    object that derives from the ASP.NET Page class, acts as a container for controls.
    When users request a Web Forms page, the Page Framework runs the Web Forms page
    object and all the individual controls on it. The output of the Page class and
    of all the controls it contains is standard HTML that a Web browser can process.
    The page consists of a standard <FORM> combined with client-side scripting, if
    supported, so it can capture user actions and send them back to the server. The
    Page Framework processes these in a way that lets you treat them as standard events.
    You can choose from a large selection of controls available in Visual Studio.
    In addition, you can create your own custom controls.


    Despite its many attributes, you may find it very difficult for Web Forms to generate
    something that works and feels like an application. Web Forms uses the HTTP protocol,
    which is stateless, meaning a connection to a server only lasts long enough to
    download a page, after which the browser “forgets” about the server until the
    user presses a link or button. To help, the Page Framework includes facilities
    for managing state. These include page-based “viewstate” — a method for preserving
    values in controls — and access to non-page-based state facilities such as Session
    state (user-specific) and Application state (global to the application).


    The Page class is the base class for all of the Web Forms in your application.
    For more information on using a Web Form, see the section “Using a Web Form.”


    # WEB FORMS EVENT MODEL


    The ASP.NET event system contains some very important differences from the version
    with which you build standard Windows Forms applications. ASP.NET uses the POST
    method to send information back from the client Web browser to the server using
    the results of the <Form> block, so all of the controls on the Web Form must exist
    within the <Form> block. ASP.NET then interprets the form results on the server,
    and fires the appropriate event in your Page object. Web Forms uses JavaScript
    for client-side scripting to add more interactivity to hyperlinks and HTML controls.


    # Limited events


    To create a Web application, you must design your application with the smallest
    possible amount of interaction between the user and the code. Because the client
    must send information back, or post-back information, to the server when an event
    occurs, Windows Application events such as MouseMove and KeyPress become impractical
    and impossible; events that report mouse movement and individual changes in a
    text box cannot be continually reported back to the server. Most Web Forms events,
    therefore, consist of simple click events that alert you when a user clicks a
    particular button or selects a particular item in a box. Most controls add events
    that cause less performance problems, such as the TextChanged event on the TextBox
    control, which only fires when the user leaves the TextBox.


    # Post-back/non-post-back events


    The term post-back means that the browser requests a new version of the page from
    the server; the control the user interacts with causes the page to submit back
    to the server. Except for button controls, the Web server controls do not immediately
    post-back to the server for all events. These events, called non-post-back events
    by ASP.NET, do not fire on the server until a post-back event occurs. Keep in
    mind which events need to immediately update the display and which events you
    can wait to handle until the user presses a button. For example, the SelectIndexChanged
    event of the ListBox and DropDownList controls do not fire as soon as the user
    selects an item. Instead, it fires along with a method that uses post-back, like
    a Button’s Click event. This reduces the number of times the page must refresh
    and prevents interruptions to the user’s workflow. You can use properties to enable
    post-back in the ListBox, ComboBox, and option controls that do not post-back
    to the server by default.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# CREATE A WEB APPLICATION


    The Web Application project lets you begin building Web Forms-based applications
    that use standard HTML to generate a client interface that any user can access
    with a standard browser. Your Web application automatically maintains information
    about state, used to create a seamless application that shares information across
    multiple pages, and connects a full object model to the HTML controls used on
    the client to let you interact with the controls on the server.


    To create a Web Application project, you simply select the ASP.NET Web Application
    template in the New Project dialog box. The name you specify for the project generates
    a folder in your standard Visual Studio project directory that contains the solution
    and project files. Visual Studio also creates a folder given by the project name
    on the server, sets appropriate security settings for that folder, and creates
    an IIS application for the folder; this application specifies


    that IIS can execute the ASP.NET scripts and runs the files in a separate memory
    space. The project template also adds a single Web Form to the project, which
    functions as the main, or default, page. The Web Form is given the name WebForm1.aspx
    by default. Visual Studio stores the code for this Web Form in a separate file
    named. If IIS runs on your development machine, the Web project directory typically
    stores in C:\Inetpub\wwwroot\.


    When you run a Web Application project, the Visual Studio builds the VB .NET code
    files into a dynamic link library (DLL) that the ASPX files use to perform their
    operations. The ASPX files contain the HTML necessary to generate the page appearance
    and the appropriate hooks to access appropriate methods and event handlers in
    your project DLL file. For more information on working with your Web Form, see
    the section “Using a Web Form,” later in this chapter.


    # CREATE A WEB APPLICATION


    ![](img/d6f772854306e15fb6df39b861a7b541_247_0.png)


    1 Click File ⇨ New ⇨ Project.


    If the Start page is visible, click the New Project button.


    The New Project dialog box appears.


    2 Click Visual Basic Projects.


    3 Click ASP.NET Web Application.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "# Extra\n\nWhen Visual Basic .NET creates your project, it creates a standard\
    \ project file, solution file, and one Web Forms page. The project also contains\
    \ a number of other files that affect how the project functions and how pages\
    \ in the project appear. You can use these files to customize the way your project\
    \ works.\n\n| PROJECT FILE | WHAT IT CONTAINS |\n|---|---|\n| `WebForm1.aspx`\
    \ | The actual ASP.NET Web page that shows in the Solution Explorer to represent\
    \ your form. Stores all of the controls added to the form and layout information.\
    \ |\n| `WebForm1.aspx.vb` | Unlike a Windows Forms application, the Development\
    \ Studio hides the actual `.vb` class file from you. When you access the source\
    \ editor for a Web Forms page, this file appears. |\n| `Global.asax` | Maintains\
    \ the entire application space for IIS. The file provides a number of methods\
    \ you can use to customize your project. The server calls `Application_BeginRequest`\
    \ at the beginning of each request for any page in the project, `Application_AuthenticationRequest`\
    \ when the user authenticates on a locked directory, and `Application_Error` when\
    \ an error occurs in any page. The global `asax` file contains one or all of the\
    \ available methods. |\n| `Styles.css` | The default cascading style sheet (CSS)\
    \ for the project. The Development Studio provides a built-in visual editor for\
    \ style sheets. Most controls provide a `CssClass` property that enables you to\
    \ assign a defined class from this file. |\n\n![](img/d6f772854306e15fb6df39b861a7b541_248_0.png)\n\
    \n+   4. Type a name for the Web project.\n+   \n+   - Optionally, you can edit\
    \ the server that will host the Web Application.\n\n+   5. Click OK.\n+   \n+\
    \   - Alternatively, you can click Browse to locate your Web folders.\n\nVB .NET\
    \ creates the folder on the Web server, loads the new project, and shows the default\
    \ page.\n\n> Note: See the section “Using a Web Form” to work with this page."
  merge: -1
  img_proc: true
- pgno: 249
  md: "# USING A WEB FORM\n\nYou use a Web Form to develop a page in your ASP.NET\
    \ application using the Visual Studio Development environment. Web Forms provide\
    \ visual layout ability, and rich property and event model that function much\
    \ like their Windows Forms counterparts. Adding controls on a Web Form simplifies\
    \ building interactive functionality in your Web-based application. Web Forms\
    \ have some significant differences from Windows Forms-based applications. Unlike\
    \ Windows Forms, the user can resize and scroll the browser as necessary to view\
    \ the contents of your Web Form.\n\nYou have two options for page layout: *Flow\
    \ layout* and *Grid layout*. The flow layout functions like a standard Web page\
    \ in that you add controls, which you place one after the other on the page. Alternately,\
    \ you can place controls in tables to create the appropriate appearance. The grid\
    \ layout functions more like an actual Windows Form. You drag and drop Web controls\
    \ anywhere on the page and the designer generates CSS positioning code. If you\
    \ force old browser compatibility, the code generates tables to properly place\
    \ all of the controls. You can choose the layout for a particular Web Form by\
    \ altering its pageLayout property. You can also change the minimum supported\
    \ browser for the page using the targetSchema property.\n\nYou have various properties\
    \ to change the appearance of your Web Form. You set the title for the page with\
    \ the <title> property, specify a page description — stored as a <META> tag —\
    \ with the Description property, and specify a <META> list of keywords with the\
    \ keywords property. You can also add margins around the form to create space\
    \ from the browser window edges using the leftMargin, rightMargin, topMargin,\
    \ and bottomMargin properties.\n\n# USING A WEB FORM\n\n![](img/d6f772854306e15fb6df39b861a7b541_249_0.png)\n\
    \n# USING A FLOW LAYOUT\n\n+   1. Create a new Web Application project or open\
    \ an existing one.\n+   \n+   *Note:* See the section “Create a Web Application”\
    \ to create a Web Application project.\n\n+   2. In the Properties window, click\
    \ the PageLayout property's button and select FlowLayout.\n+   \n+   3. In the\
    \ toolbox, double-click various Web forms controls to add them to the form.\n\n\
    +   When you run your project by pressing F5, the page displays the controls in\
    \ a flowing layout that resizes as necessary when the browser resizes."
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Extra


    You can use properties and events of the Page object that your Web Form uses to
    specify details and provide event handling for the page loading. Below is a partial
    list of the available members.


    | PROPERTIES | |

    | Application | Provides a reference to the Application object associated with
    the project. The object manages the state for the entire application. |

    | ClientTarget | Indicates the capabilities of the browser making the request.
    ASP.NET uses this information during execution to deliver code depending on the
    browser. |

    | ErrorPage | Set this property to specify the page that the client is sent to
    if an unhandled exception in your form''s code. |

    | IsPostBack | Indicates whether the page is being processed in response to a
    client post-back or whether it is being accessed for the first time. |

    | IsValid | Indicates whether page validation succeeded. |

    | Validators | A collection of the validation controls on the page. |

    | EVENTS | |

    | Init | Fires when the Page object loads the first time. |

    | Load | Fires each time the user requests the page. |

    | Unload | Fires when the Page object unloads from memory. |


    ![](img/d6f772854306e15fb6df39b861a7b541_250_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_250_1.png)


    # USING A GRID LAYOUT


    +   1 Create a new Web Application project or open an existing one.


    +   2 In the Properties window, click the pageLayout property''s [...] and select
    GridLayout.


    +   3 In the toolbox, click a control and then drag the control onto the Web Form
    in the desired position and size.


    +   4 Run your project by pressing F5.


    The grid layout maintains the exact position at runtime that you specify in design
    mode.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# ADD A LABEL CONTROL


    You can use a Label control to display text on your Web Form page. Although you
    can type text directly onto the page without the Label control in Flow layout,
    using the Label control in Grid layout lets you precisely place text; the Grid
    layout, however, does not support typing text onto the page. To learn more about
    the Flow and Grid layouts, see the section, "Using a Web Form." Unlike its Windows
    equivalent, the Label control does not support events. In fact, a Label control
    is little more than text you place on the form with standard HTML. To register
    a click, you must use a Button or HyperLink control. For more information on the
    Button control, see the section "Add a Button Control."


    You access the Label and other Web Form controls via the Toolbox. The Text property
    controls the text that appears in the label. Text you place in the Label control
    wraps at the right side, and cannot run outside of the control''s bounds. Visual
    Studio automatically resizes the control to make the text fit. Because the contents
    of the Label directly outputs to the Web page that ASP.NET generates, you can
    include HTML formatting tags directly inside the Text property.


    You can modify the control''s appearance with properties similar to the Windows
    Forms version of the Label control. The BackColor property specifies the background
    color to place in the Label. You can alter the text''s color with ForeColor and
    edit the text''s font with the Font object.


    You can create various borders around the text with the BorderStyle property.
    Available border settings include NotSet, which uses the default setting of the
    page, None, Solid, Double, Inset, Outset. You can use the BorderWidth property
    to control how large the border draws, and the BorderColor alter the border''s
    color.


    # ADD A LABEL CONTROL


    ![](img/d6f772854306e15fb6df39b861a7b541_251_0.png)


    +   1 Open a Web Application project.


    +   2 In the Toolbox, click and drag the Label control to add it to the form.


    +   3 Type text into the Text property in the Properties window.


    +   You can modify the appearance by clicking the BorderStyle property''s and
    selecting a style or typing a size for the BorderColor property.


    +   4 Press F5 to run your project.


    +   The text displays on the form appropriately.


    Note: See the section "Using a Web Form" to add a control to the form.'
  merge: -1
  img_proc: true
- pgno: 252
  md: "# ADD A HYPERLINK CONTROL\n\nYou can create a hyperlink on an HTML page to\
    \ link one page to another with the HyperLink. You can link to other forms in\
    \ your application, to standard Web pages on your server, or to remote server\
    \ locations.\n\nYou can use either text or an image as the object of your link.\
    \ You set a hyperlink’s displayed text with the `Text` property. If you display\
    \ an image, you set the `ImageUrl` property to a valid URL string to an image\
    \ to load. The control does not display the `Text` property when you set the `ImageUrl`\
    \ property on the page; instead the text displays as a placeholder while the image\
    \ loads and the user can see the `Text` as a tooltip when holding the mouse over\
    \ the image.\n\nYou set the URL to which the HyperLink control links using the\
    \ `NavigateUrl` property. Because this control contains no events, the link immediately\
    \ connects to the new page. If you leave the `NavigateURL` property blank, the\
    \ browser renders the text as a standard label without a link.\n\nYou can change\
    \ how the link loads into the browser using the `Target` property. The `Target`\
    \ property provides the standard link targets: `_blank`, `_parent`, `_self`, and\
    \ `_top`. The `_blank` target opens a new browser window and loads the linked\
    \ page. The `_parent` target loads the link into the immediate parent frame of\
    \ the current page. The default action, the `_self` target replaces the current\
    \ page with the linked page. The `_top` target replaces the content into the current\
    \ window, and removes any currently displayed framesets. The property also provides\
    \ one more target, `_search`, which loads the link into the search sidebar of\
    \ Microsoft Internet Explorer. If the user’s browser does not support the `_search`\
    \ target, the page loads into the current frame.\n\n# ADD A HYPERLINK CONTROL\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_252_0.png)\n\n+   1. Click and drag\
    \ the HyperLink control in the Toolbox of an open Web Application project.\n+\
    \   2. Type text into the `Text` property in the Properties window.\n+   \n+ \
    \  - Set the hyperlink to appear as an image by typing the image’s URL into the\
    \ `ImageUrl` property.\n+   3. Type a URL to link to in the `NavigateUrl` property.\n\
    +   - Modify the `Target` property by clicking and selecting a new target for\
    \ the link.\n+   \n+   4. Press F5 to run your project.\n+   \n+   - The hyperlink\
    \ takes you to the specified URL."
  merge: -1
  img_proc: true
