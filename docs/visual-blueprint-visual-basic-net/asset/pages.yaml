- pgno: 119
  md: '# USING DO LOOPS


    You can use a Do loop to run a block of code repeatedly and test a conditional
    statement you specify for a change to stop the loop. The Do statement lets you
    create powerful loops that can check a variety of criteria before exiting.


    You end the Do loop with the Loop statement. The Do statement does not function
    without the aid of one of two keywords: Until and While. These keywords specify
    the type of conditional checking the loop uses. For more information on creating
    conditional expressions, see the section "Work with Operators."


    A Do Until loop runs until the condition you specify after the Until becomes true.
    VB .NET runs the Do While loop until the given condition becomes False. If the
    condition for an Until loop is True or the condition for a While loop is False
    before the loop begins, VB .NET completely skips the block of code inside the
    loop. You must declare any variables used in the condition before the loop begins.


    Whatever code you place inside, the Do...Loop runs until the condition causes
    the loop to stop, so you must base the condition on one or more variables that
    change inside the loop. Otherwise the loop runs indefinitely and your program
    appears to stop functioning to the user. Known as an infinite loop, this situation
    is hard to debug. As you write your code make sure that the loop can exit in every
    case.


    ![](img/d6f772854306e15fb6df39b861a7b541_119_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_119_1.png)


    +   1. Create a new project or open an existing one.


    +   2. Create or open the method where you want the loop to execute.


    +   3. Type code that defines the variables necessary for the conditional expression.


    +   4. Type Do Until x = 10 replacing Until with either Until or While, depending
    on loop requirements, and x = 10 with the condition you want to evaluate.


    +   5. Press Enter. VB .NET adds the Loop statement automatically.'
