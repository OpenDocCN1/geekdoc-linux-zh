    \ a reference to a ListViewItem, you can call its Remove method to delete it from\
    \ the ListView. To remove the items the user has selected, loop through the SelectedItems\
    \ collection and remove each of them.\n\n# Example:\n\n```\nDim item As System.Windows.Forms.ListViewItem\n\
    For Each item In ListView1.SelectedItems\n    item.Remove\nNext\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_86_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_86_1.png)\n\n6 Click Add to add a list\
    \ item.\n\n7 Click the Text property and type the appropriate text for the item.\n\
    \n8 Click the ImageIndex property and select an image for the item.\n\n9 Repeat\
    \ steps 6 through 8 as necessary.\n\n10 Click OK.\n\n11 Press F5 to run the project.\n\
    \nThe ListView shows the items created during design-time editing."
