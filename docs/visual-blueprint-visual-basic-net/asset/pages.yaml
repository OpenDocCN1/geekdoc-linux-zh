- pgno: 329
  md: '# WHAT''S ON THE CD-ROM


    The CD-ROM included in this book contains many useful files and programs. Before
    installing any of the programs on the disc, make sure that a newer version of
    the program is not already installed on your computer. For information on


    installing different versions of the same program, contact the program''s manufacturer.
    For the latest and greatest information, please refer to the ReadMe file located
    at the root of the CD-ROM.


    # SYSTEM REQUIREMENTS


    To use the contents of the CD-ROM, your computer must be equipped with the following
    hardware and software:


    +   - A PC with a Pentium III or faster processor

    +   - Microsoft Windows NT 4.0, Windows 2000, or Windows XP

    +   - Microsoft Visual Studio .NET

    +   - At least 128MB of total RAM installed on your computer

    +   - An eight-speed (8x) or faster CD-ROM drive

    +   - A monitor capable of displaying at least 256 colors or grayscale


    # AUTHOR''S SOURCE CODE


    These files contain all the sample code from the book. You can browse these files
    directly from the CD-ROM, or you can copy them to your hard drive and use them
    as the basis for your own projects. To find the files on the CD-ROM, open the
    D:\Resources\Code folder. To copy the files to your hard drive, just run the installation
    program


    D:\Code.exe. The files will be placed on your hard drive at C:\ProgramFiles\VBNetVB.
    You will need Microsoft Excel installed on the machine to run the sample macros.


    # ACROBAT VERSION


    The CD-ROM contains an e-version of this book that you can view and search using
    Adobe Acrobat Reader. You cannot print the pages or copy text from the Acrobat
    files. An evaluation version of Adobe Acrobat Reader is also included on the disc.


    # INSTALLING AND USING THE SOFTWARE


    For your convenience, the software titles appearing on the CD-ROM are listed alphabetically.


    # Acrobat Reader


    Freeware. Acrobat Reader lets you view the online version of this book. For more
    information on using Adobe Acrobat Reader, see the section "Using the E-Version
    of This Book." From Adobe Systems, www.adobe.com.'
