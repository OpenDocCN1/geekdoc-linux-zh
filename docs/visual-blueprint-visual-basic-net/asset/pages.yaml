  md: '# Apply It


    A fully functioning standalone component, the DataTable object does not need a
    database adapter connection to an actual database provider. You can declare an
    instance of a DataTable, define its columns using DataColumn objects and add DataRow
    objects to the table. Then you can use the DataTable to bind to controls as you
    do with the visual DataSet and provider components. See the section “Bind a Control
    on a Form” for more information.


    # TYPE THIS:


    ```

    Private Sub Form1_Load(ByVal sender As System.Object, ByVal e As System.EventArgs)
    Handles MyBase.Load

    Dim dt As New DataTable("MyTable")

    dt.Columns.Add("Name", System.Type.GetType("System.String"))

    dt.Columns.Add("Address", System.Type.GetType("System.String"))

    Dim values() As String = {"John Doe", "123 Anytown Rd."}

