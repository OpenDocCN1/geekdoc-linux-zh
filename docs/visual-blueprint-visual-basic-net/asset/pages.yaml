  md: '# USING THE IF STATEMENT


    You can use conditional statements when you run different code based on specific
    conditions. The most frequently used conditional block relies on the If statement.


    For example, if you want to display a message based on a calculation that determines
    the temperature, you can qualify anything over 80 degrees as hot, and any other
    temperature as too cold. This calls for a test of the temperature value to determine
    into which range it falls.


    The If statement tests a conditional statement you provide, and runs a block of
    code if it is True. If the statement is False, VB .NET skips over the block of
    If code. For more information on forming conditional statements, see "Work with
    Operators."


    The format for an If statement is If expression Then. You can place code to execute
    if the conditional statement is true on the same line. If you have more that you
    need to execute, you can start the code on the next line and enclose the statements
    with an End If statement.


    is true on the same line. If you have more that you need to execute, you can start
    the code on the next line and enclose the statements with an End If statement.


    In the case you want to provide code when the condition is False, you can insert
    an Else statement between the If...Then and End If statements. If the condition
    is False, the code jumps to the code located between the Else and the End If instead
    of the code directly after the If.


    To make your code easier to understand, you can line up the If, Else, and End
    If statements with the rest of the code in your method. You can then indent the
    blocks of code inside the statements. This capability enables you to identify
    blocks of code easily. The Development Studio provides the smart tab feature,
    which automatically indents your code, and the environment enables this option
    by default.


    # USING THE IF STATEMENT


    ![](img/d6f772854306e15fb6df39b861a7b541_113_0.png)


    +   1. Create a new project or open an existing one.


    +   2. Create or open the method where the test needs to execute.


    +   3. Type any initialization code necessary before the test begins.


    +   4. Type If x < 5 Then, replacing x < 5 with the conditional statement you
    want to use.


    +   5. Press Enter to move to the next line. VB .NET adds End If automatically.'
