- pgno: 235
  md: '# MOVE THROUGH A DATASET


    To effectively use your bound controls, you must give users the ability to move
    through the available records in the DataSet. Typically, a form contains the information
    for a single record, and back and forward controls normally enable the user to
    move through the records. For example, a customer database may store all of the
    information about a customer. The screen provides text boxes to display and allow
    changes to the data.


    To add movement controls to a form, you need to use the BindingContext object
    provided on a form. To access the BindingContext for a form, use the Me.BindingContext
    property. The object holds a list of all bound data sets on the form. You pass
    the name of the DataSet and the name of the table as the two parameters to the
    method. It returns a BindingManagerBase that matches the parameters. A BindingManagerBase
    object synchronizes all Binding objects that refer to the same data source. The
    Position property controls the position the bound controls show. The property
    is zero-based, meaning you access the first available record using Position =
    0. The Count property returns the number of records available in the binding,
    so to move to the end of the list, set Position equal to Count - 1.


    # MOVE THROUGH A DATASET


    ![](img/d6f772854306e15fb6df39b861a7b541_235_0.png)


    +   1. Set up a database connection on the form.


    +   2. Place necessary bound input controls on the form.


    +   3. Include a button to go to the first record, go back a record, go forward
    a record, and go to the last record.


    +   4. Double-click the appropriate button to add an event handler.


    > Note: See the section "Bind a Control on a Form" to bind a control.


    +   5. For the first record button, type Me.BindingContext(DsNorthwind1, "Customers").Position
    = 0, replacing DsNorthwind1, "Customers" with the DataSet and table.


    +   6. For the previous record button, type Me.BindingContext(DsNorthwind1, "Customers").Position
    -= 1, replacing DsNorthwind1, "Customers" with the DataSet and table.'
  merge: -1
  img_proc: true
