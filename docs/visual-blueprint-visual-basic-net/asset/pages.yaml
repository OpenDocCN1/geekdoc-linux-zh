- pgno: 125
  md: '# USING A FILE STREAM


    Most applications provide the ability to save and load users’ files. Other applications
    use files to store configuration data. You can read or modify existing files and
    create new files using the FileStream class. The FileStream class does not provide
    the necessary functions to support reading and writing the contents of the file.
    You must use separate reader and writer classes to access the FileStream. To read
    from a file stream, see the section "Read from a File Stream," and to write to
    a file stream, refer to the section "Write to a File Stream."


    To set up the file stream, you must create a new instance of the FileStream class
    by placing the New keyword in the declaration line. When you use New, VB.NET calls
    a constructor in the class to set it up. For more information on instantiating
    classes and using constructors, see Chapter 7.


    One of the constructors available to you requires the name of the file you want
    to open or create, the file mode, the file


    access level, and the file sharing mode:

    FileStream(path, mode, access, share). The FileMode constant determines how the
    stream opens or creates the file. The FileAccess constant determines read or write
    access to the file. The FileShare constant determines if other processes can read
    or write to the file when this process opens it. When you call the constructor,
    the file opens, or VB.NET creates the necessary file in the file system. Use the
    Close method to close the stream when you finish with the file.


    To specify the FileShare constant, use a constant from the FileShare enumeration:
    None, Read, ReadWrite, and Write. If you specify None, no other program can access
    the file you open at the same time. Read enables them to read from the file while
    you use it, Write enables other programs to write to the file, and ReadWrite lets
    other files have full access.


    # USING A FILE STREAM


    ![](img/d6f772854306e15fb6df39b861a7b541_125_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_125_1.png)


    1 Create a new project or open an existing one.


    2 In the method or event where the file needs to open, type Dim myFileStream,
    replacing myFileStream with the variable name to assign to the stream.


    3 Type As New IO.FileStream("C:\Test.txt", replacing C:\Test.txt with the filename
    you wish to open.


    4 Type IO.FileMode.


    An IntelliSense box appears with a list of available constants.


    5 Type or click a constant and follow it with a comma.'
  merge: -1
