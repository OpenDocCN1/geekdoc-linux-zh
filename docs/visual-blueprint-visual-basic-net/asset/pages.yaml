- pgno: 121
  md: '# CREATE AN ARRAY


    You can use an array to store a number of items, all of which are the same variable
    type. Think of an array as a shopping list. It holds a list of information. For
    example, you can use an array of 24 integers to hold the temperature at the beginning
    of every hour.


    To create an array, define a variable and place the maximum index of the array
    enclosed in parentheses after the variable name. Arrays are zero-based, meaning
    the first index of the array is zero, so for the example above, you want to declare
    an array with maximum index 23.


    You can use an array item just like any other regular variable of that type. To
    read or write an array item, use the variable name followed by the index in parentheses.


    An array with one index is called a single-dimension array. You can also create
    multidimensional arrays that consist of multiple indexes. For example, a two-dimensional
    array can represent a table or grid of values. To add dimensions, simply place
    a comma after the previous maximum index declaration. For example, Dim hourlyTempForWeek(23,
    6) As Integer to store an item for each hour of a week.


    You can assign contents to the entire array when declaring by equating it to a
    list of values separated by commas enclosed in braces {}. When assigning values
    to the array during declaration, do not specify the size of the array. VB.NET
    automatically assigns the size based on the list.


    If you want to assign values to the array later, a For loop can easily loop through
    the entire array and assign the necessary values. For more information on using
    For loops, see the section "Using For Loops."


    # CREATE AN ARRAY


    ![](img/d6f772854306e15fb6df39b861a7b541_121_0.png)


    +   1. Create a new project or open an existing one.


    +   2. Create or open the method where you want the loop to execute.


    +   3. Type Dim myArray, replacing myArray with the name of the array.


    +   4. Type () As Integer, replacing Integer with the type of variable for the
    array items.


    If you do not want to define the contents of the array, you can type the number
    of necessary indices starting from zero.'
