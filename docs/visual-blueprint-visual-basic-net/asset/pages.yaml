- pgno: 112
  md: '# Apply It


    You can use the ByVal and ByRef keywords to manipulate how VB .NET passes information
    to your method. The keyword ByVal stands for by value, and means that VB .NET
    creates a copy of the data passed into the method for the method to use. The ByRef
    keyword stands for by reference, and means that VB .NET sends the actual location
    in memory of the variable passed into the method. Because you work with the original
    variable when you use the ByRef keyword, VB .NET maintains changes you make to
    the value when the method exits.


    # TYPE THIS:


    ```

    Sub AddNumber(ByRef number1 As Integer, ByVal number2 As Integer)

    '' make number1 ByRef so you can change the value

    number1 += number2

    End Sub


    Sub Main()

    Dim x As Integer = 10, y as Integer = 15

    Console.WriteLine("The value of x is : " & CStr(x))

    AddNumber(x, y)

    Console.WriteLine("The value of x is : " & CStr(x))

    Console.ReadLine()

    End Sub

    ```


    # RESULT:


    The value of x is: 10

    The value of x is: 25


