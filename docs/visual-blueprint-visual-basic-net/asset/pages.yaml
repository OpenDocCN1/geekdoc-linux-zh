    \ replacing index with an integer variable name, myArray with the name of your\
    \ array, and “Megan” with the key string.\n\n+   7. Type code to work or display\
    \ the results.\n\n+   The example above prints the index of the located item.\n\
    \n+   8. Press F5 to run your project.\n\n+   The Array object modifies and searches\
    \ your array."
