- pgno: 289
  md: "# USING WEB SERVICES\n\nWhen you generate a Web Services class and export methods\
    \ over the Internet, you need to access those methods. You can invoke Web Service\
    \ methods in any .NET program ranging from Windows applications to User Controls\
    \ to Web Form Applications. A Web-enabled object functions like a standard object\
    \ in other projects.\n\nTo use a Web Service in an application, you must first\
    \ make the service accessible. You can add a reference to a Web Service application\
    \ in any VB .NET project type. To reference a Web service, you simply need the\
    \ URL of the service.asmx or service.disco that contains information about the\
    \ service. If you reference an asmx file directly, you can only access the specific\
    \ object contained in that ASP.NET file. If you specify the .disco (discovery)\
    \ file when referencing the Web service, you can access all Web service classes\
    \ available in the project.\n\nTo create an instance of the object, you simply\
    \ declare a variable of the class name you define in the Web service. To access\
    \ the class, you must specify the namespace consisting of the server name. For\
    \ example, to access a class on the local server named Service1, you declare a\
    \ variable as Localhost.Service1.\n\nAfter you declare a new instance of the Web\
    \ service class, you can access methods exposed by the service. Note that you\
    \ can access only methods that contain the WebMethod() tag as part of their identifier.\
    \ You cannot access properties, events, and non-Web enabled methods that exist\
    \ in the Web service class. Also, connection state does not exist between accesses\
    \ to the Web method. If you call a method that sets a variable in the Web service\
    \ class and you call another method that accesses the same variable, the previous\
    \ value does not store across methods.\n\n![](img/d6f772854306e15fb6df39b861a7b541_289_0.png)\n\
    \n# USING WEB SERVICES\n\n+   1. Open or create a new project.\n+   \n+   The\
    \ example uses a Console Application project.\n+   2. Click Project > Add Web\
    \ Reference.\n+   3. Type http://localhost/Ch11-UsingServiceHelp/Ch11-UsingServiceHelp.vsdico,\
    \ replacing localhost with the server, and Ch11-UsingServiceHelp with the project\
    \ name.\n+   4. Click the View Contract link on the appropriate Web service.\n\
    +   5. Click Add Reference."
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Apply It


    A Web service automatically creates asynchronous versions of each Web method you
    create. You can call an asynchronous version of the Web method and not wait for
    the method to complete. You then register a function that VB .NET calls when the
    method completes. For each Web method, the class exports a BeginMethod and EndMethod
    method, where Method is the name of your Web method.


    # TYPE THIS


    ```

    Private Sub Button1_Click(ByVal sender As System.Object, ByVal e As System.EventArgs)
    Handles Button1.Click

    Dim math As New localhost.Service1()

    Dim cb As New AsyncCallback(AddressOf ServiceCallback)

    math.BeginWebAdd(5, 4, cb, cService)

    ListBox1.Items.Add("This code runs first.") '' Run other code while the web method
    runs

    End Sub

    Public Sub ServiceCallback(ByVal ar As IAsyncResult)

    Dim math As localhost.Service1

    Set math = ar.AsyncState '' Retrieve the class instance

    ListBox1.Items.Add(math.EndLongProcess(ar)) '' Retrieve the results

    End Sub

    ```


    # RESULT:


    This code runs first.


    ![](img/d6f772854306e15fb6df39b861a7b541_290_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_290_1.png)


    +   6 Declare a new instance of the Web object by typing in the name of the server,
    a period, and the name of the service.

    +   7 Type your variable name and follow it with a period and the method.

    +   8 Press F5 to run your project.

    +   The Web Method responds with the appropriate value.


    To find the namespace assigned to the server, you can open the Web References
    section in the Solution Explorer'
  merge: -1
