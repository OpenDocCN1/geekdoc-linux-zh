- pgno: 68
  md: "# Extra\n\n# WORK WITH CONTROLS\n\nYou can specify a transparency color for\
    \ the images in the control. The default setting for the TransparentColor property\
    \ is Transparent, meaning it reads the transparency color from the image file,\
    \ if the file type supports transparency. Icon files (ICO) and Graphics Interchange\
    \ format (GIF) support transparency. If you load a collection of Windows bitmap\
    \ (BMP) files into the ImageList control, set the TransparentColor to the appropriate\
    \ background color of the images.\n\nYou can add images to the ImageList control\
    \ at run-time using the Add method of the Images collection. Supply an Image object\
    \ as the only parameter to the method.\n\n```\n**Example:**\n\n```vb\n' Visual\
    \ Basic\n' Replace string with valid image file path:\nDim myImage As System.Drawing.Image\
    \ = _\n    Image.FromFile(\"C:\\sample.gif\")\nImageList1.Images.Add(myImage)\n\
    ```\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_68_0.png)\n\n+   8. Add a\
    \ control to display an image.\n+   \n+   - Controls such as the Button and Label\
    \ control offer support for loading images from the ImageList control. The example\
    \ adds a Button control.\n\n+   9. In the Properties window, click the ImageList\
    \ property and select the ImageList control.\n+   \n+   - You can clear the Text\
    \ property to make the button appear with only an image.\n\n+   10. Click the\
    \ ImageIndex and select an image to display.\n\nThe ImageList provides the image\
    \ to the control."
  merge: -1
  img_proc: true
- pgno: 69
  md: '# ALLOW TEXT ENTRY


    Text input is a vital part of most programs. You use a text box to allow users
    to enter freeform information that you cannot represent by a list of options.
    Notepad is an example of the functionality the standard text box provides. Without
    using text boxes for users to enter information, you must provide a selected set
    of options using check boxes, radio buttons, and lists.


    Text boxes support two basic modes: single-line, and multi-line, which you can
    toggle. A single line input box is normally limited to a certain number of characters
    by the MaxLength property, with the maximum available size being 32767, and the
    height fixed at font and system settings. The Text property controls the text
    displayed by the TextBox control, and updates as the user enters new information
    in the control. You can create a password field in a single-line text box by specifying
    a character in the PasswordChar property. The character you specify appears instead
    of the actual information typed into the box. A normal value for the property
    is an asterisk (*).


    You can make a multi-line text box can any size, and have unlimited text up to
    the available memory. Use the ScrollBars property to assign horizontal, vertical,
    or both scrollbars to the multi-line text box. The WordWrap property, which defaults
    to True, controls whether the box wraps text at the edge of the control. If WordWrap
    is False, the line can extend past the edge of the text box and the user must
    press Enter to move to a new line.


    Using text boxes effectively requires significant testing. Because of the free-entry
    functionality present in a text box, users may type incorrect data, which requires
    the programmer to provide validation to check what the user enters. VB.NET has
    new validation abilities. You can learn about the ErrorProvider control in the
    section "Provide Error Messages."


    ![](img/d6f772854306e15fb6df39b861a7b541_69_0.png)


    +   1. Create a new Windows Application project or open an existing project.

    +   2. Click and drag the Label control from the Toolbox to add it to the form.

    +   3. In the Properties window, type a description of the text that users enter
    using the Text property.

    +      The text appears in the Label control on your form.

    +   4. Click and drag the TextBox control in the Toolbox to add it to the form.

    +   5. In the Properties window, remove the provided text by selecting the text
    and pressing the Delete key.

    +   If desired, type your own default value in the Text property.'
  merge: -1
  img_proc: true
- pgno: 70
  md: "# Apply It\n\nIn a multi-line TextBox control, the Lines property maintains\
    \ an array of strings representing each line in the TextBox control. You can use\
    \ this property to retrieve particular lines of information from the text box\
    \ or to manipulate text in the control. The example below loads the contents of\
    \ the property into a new array and displays each line in a ListBox control you\
    \ must add to the form.\n\n# TYPE THIS:\n\n```\nPublic Sub GetTextBoxContents()\n\
    ' Create a string array and store the contents of the Lines property.\nDim textLines()\
    \ As String, line As String\ntextLines = TextBox1.Lines\n\nFor Each line In textLines\n\
    \    ListBox1.Items.Add(line)\nNext\nEnd Sub\n```\n\n# RESULT:\n\nThis is line\
    \ #1 in the text box.\n\nThis is line #2 in the text box.\n\n![](img/d6f772854306e15fb6df39b861a7b541_70_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_70_1.png)\n\n# CREATE A MULTI-LINE\
    \ TEXT BOX\n\n+   6 With the Text Box control selected, double-click the Multi-line\
    \ property to toggle it to True in the Property window.\n\n+   7 Click the ScrollBars\
    \ property's and select a constant for the scrollbar style you desire.\n\n+  \
    \ 8 Press F5 to run your project.\n\nThe TextBox displays text and enables the\
    \ user to edit the text in a standard way."
  merge: -1
  img_proc: true
- pgno: 71
  md: '# USING THE RICH TEXT CONTROL


    You can use the RichTextBox to enter rich data, such as formatted text, pictures,
    and OLE objects. An example of the rich text box in use is WordPad, a program
    included with Windows. You can create much of the functionality available in WordPad
    in your application.


    The RichTextBox control stores the data inside the box in RTF format. Most applications
    can understand this format, so you can cut and paste rich text to and from applications
    such as Microsoft Word into this control during runtime. Similarly to the TextBox
    control, you can use the Text property to read or set the plain text of the box.
    The Rtf property returns the text with all of the formatting codes. When you set
    the AcceptsTab property to True, the user can enter a tab as text into a control.
    If the property is False, the focus shifts to the next control.


    Scroll bars only show if the user types more than can fit in the boxes boundaries.
    The ScrollBars property allows you to set the control to None, Vertical, Horizontal,
    or


    Both scrollbars. The other settings for the property are FixedHorizontal, FixedVertical,
    and FixedBoth; they force the specified scrollbars to show.


    Runtime properties play an important role in using the RichTextBox control''s
    abilities. Formatting properties work for the selected text. Use the SelectionStart
    and SelectionLength properties to choose the starting point, and the length of
    the selection, respectively. If the user makes a selection, these properties update
    automatically. The first character in the box is index one for the RichTextBox
    control.


    You can use the SelectedText and SelectedRtf properties to receive or set the
    text enclosed in the selection. You can also use the selection to change the format
    of the selected text. For example, the SelectionBullet property adds bullets to
    the selected lines of the control when set to True.


    ![](img/d6f772854306e15fb6df39b861a7b541_71_0.png)


    +   1. Create a new Windows Application project or open an existing one.

    +   2. From the Toolbox, click and drag the RichTextBox control onto the form
    to the size you desire.

    +   3. Add a control for the user to alter the formatting of the rich text.

    +   4. Double-click the control to alter the formatting.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# Apply It\n\nAfter the user specifies a selection, or you set a selection\
    \ code, you can format the text by reassigning the text SelectionFont to a new\
    \ Font class. SelectionColor allows you to reassign a color to the selected text.\
    \ Set SelectedBullet = True to make the selected lines into bulleted items.\n\n\
    The SelectionIndent, SelectionRightIndent, and SelectionHangingIndent affect the\
    \ paragraphs that have selected text inside them. These properties allow you to\
    \ specify a pixel amount for the various indentation styles.\n\n# TYPE THIS:\n\
    \n```\nPrivate Sub Button1_Click(ByVal sender As System.Object, _\nByValue As\
    \ System.EventArgs) Handles Button1.Click\n    ' Store the font for the selected\
    \ text.\n    Dim tempFont As System.Drawing.Font = RichTextBox1.SelectionFont\n\
    \    ' Create FontStyle to contain the style for the current selection.\n    Dim\
    \ tempStyle As System.Drawing.FontStyle = RichTextBox1.SelectionFont.Style\n \
    \   ' Determine whether the current text selection is bold.\n    If tempFont.Bold\
    \ = True Then\n        ' Create a new font based on the existing font for selection,\n\
    \        ' but use an exclusive or bitwise operator to remove the bold style.\n\
    \        RichTextBox1.SelectionFont = New Font(tempFont.FontFamily, _\n      \
    \  tempFont.Size, tempStyle And Not FontStyle.Bold)\n    Else\n        ' Create\
    \ a new font based on the existing font for selection,\n        ' but use an exclusive\
    \ or bitwise operator to remove the bold style.\n        RichTextBox1.SelectionFont\
    \ = New Font(tempFont.FontFamily, _\n        tempFont.Size, tempStyle Or FontStyle.Bold)\n\
    \    End If\nEnd Sub\n```\n\n# RESULT:\n\nFont switches between bold and normal\
    \ styles.\n\n![](img/d6f772854306e15fb6df39b861a7b541_72_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_72_1.png)\n\
    \nThe default event for the control loads in the code editor.\n\nIn this example,\
    \ the selected text toggles between bulleted and standard text.\n\nThe rich text\
    \ box allows editing.\n\nYou can see formatting changes by completing the necessary\
    \ action to run the event or method code.\n\n5 Type the appropriate code to alter\
    \ the selection.\n\n6 Run the project by pressing F5"
