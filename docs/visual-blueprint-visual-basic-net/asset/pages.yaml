- pgno: 159
  md: '# CREATE A PEN


    You use a Pen to tell VB .NET the style, color, and thickness of a line to draw
    for the various primitives. For example, a variety of outlined primitives use
    a Pen, like rectangles, ellipses, and curves. A Pen specifies details for VB .NET
    to know how to draw these shapes. Use a Brush to fill a primitive object or the
    inside of a Pen. For more information on the Brush object, see the section "Create
    a Brush."


    To produce a single color pen, create a new instance of the Pen class using the
    Dim command and the New operator. VB .NET stores the Pen class in the System.Drawing
    namespace. For more information on instantiating classes, see Chapter 7. For the
    most basic constructor of the Pen, pass a color as the single parameter. The second
    constructor expects a color for the first parameter and the line width as the
    second parameter. See the section "Using the Graphics Object" for more information
    on specifying a color.


    To create a Pen object based on a Brush, create a new instance of the Pen class
    and provide the Brush as the first argument. To specify the width of the pen,
    use the alternate constructor that expects a Brush and a line width passed in
    as a Single.


    After you create a Pen instance, a number of properties allow editing the appearance.
    The StartCap and EndCap properties expect a constant from the LineCap enumeration.
    The properties specify the type of end caps to put on a pen. A primitive without
    ends, for example, a rectangle or ellipse, ignores the values. Instead, the LineJoin
    property specifies how to connect corners of lines and expects a value from the
    LineJoin enumeration. To create different styles of dashed lines, set the DashStyle.
    The DashCap property specifies a DashCap enumerated value that represents the
    style to use for dashes.


    # CREATE A PEN


    ![](img/d6f772854306e15fb6df39b861a7b541_159_0.png)


    +   1. Create a new project or open an existing one.

    +   2. Click the class list and select (Base Class Event) or the control on which
    to draw.

    +   3. Click the method name list and select the Paint Event.


    +   4. Type Dim redPen As New Drawing.Pen(Color.Red), replacing redPen with the
    variable name and Color.Red with the type of the color to use.

    +   5. The example uses the Color class to provide a supplied color Red.'
  merge: -1
  img_proc: true
