- pgno: 231
  md: '# ADD A DATAVIEW COMPONENT


    The DataSet component provides the ability to load multiple tables in a database
    into memory for use by your application. You can use the DataView component to
    filter and sort a database table before binding to a control. To learn more about
    binding a control, see the section “Bind a Control on a Form.” A DataView represents
    one table of a DataSet component. The Table property specifies the source table
    the DataView uses.


    You can sort the items in the DataView by setting the Sort property to the field
    it uses to sort the table. You can specify multiple sort fields by separating
    them with commas. You can sort the items in descending order by following the
    field name with the DESC SQL keyword. For an introduction to Structured Query
    Language (SQL), see the section “An Introduction to Databases.”


    You can use the DataView to return a partial set of rows from the full database
    table and treat it just like a standard table. Use the RowFilter property to filter
    the data table. To form the RowFilter, specify the filter field followed by a
    conditional operator and the value to test each field in the available records.
    To test a string value, place the value inside single quotes (‘). You can also
    use the RowStateFilter property to filter based on the state of a record. You
    can use this property to filter the DataView to expose only new records, or deleted
    records. The Count property returns the number of records in the filtered view.


    The Item property returns a row from the attached data table. Specify the record
    index as the parameter. To find an item by the primary key value, use the Find
    method. Pass the key value as the only parameter, and the method returns the row
    index where the row exists in the table.


    # ADD A DATAVIEW COMPONENT


    ![](img/d6f772854306e15fb6df39b861a7b541_231_0.png)


    +   1. Set up a database connection on the form.

    +   Note: See the section "Create a Database Connection."


    +   2. Double-click the DataView component in the Data section of the Toolbox.


    +   3. In the Properties window, click the Table property and select the appropriate
    table.


    +   4. To sort the table, type the name of the field by which you want to sort
    in the Sort property.

    +   You can type a space followed by DESC to sort in descending order.


    +   5. To filter the data, type a field name followed by a conditional operator
    and the value to test in the RowFilter property.

    +   The example uses the filter ContactName LIKE ''A%'' to retrieve contacts that
    start with A.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Extra


    You can modify the table associated with the DataView using provided methods and
    properties. The AllowEdit, AllowNew, and AllowDelete properties specify whether
    the DataView allows you to edit field values, add new records, and delete records,
    respectively. You can add a record to the underlying table of the DataView using
    the AddNew method. The method returns a new DataRowView object. Use this object
    to edit the individual records of the new row. The Delete method deletes a row
    you specify as the only parameter to the method. When you delete the row, its
    state changes to DataViewRowState.Deleted.


    You can use the constants in the DataViewRowState enumeration with the RowStateFilter
    property to filter records in the DataView.


    | CONSTANT | DESCRIPTION |

    |---|---|

    | Added | The rows you added since the last time you saved or accepted changes.
    |

    | CurrentRows | The current rows including unchanged, new, and modified rows.
    |

    | Deleted | The rows you deleted since the last time you saved or accepted changes.
    |

    | ModifiedCurrent | The current version of rows that you have modified. |

    | ModifiedOriginal | The original version of rows that you have modified. |

    | OriginalRows | All original rows including unchanged and deleted rows. |

    | Unchanged | An unchanged row. |


    ![](img/d6f772854306e15fb6df39b861a7b541_232_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_232_1.png)


    6 Add the appropriate means of viewing the data contained in the DataView.


    Note: To add a bound control to the form, see the section "Bind a Control on the
    Form."


    The example adds a ListBox control data bound to the DataView component.


    The DataView performs the appropriate sort or filter before making the data available.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# # BIND A CONTROL ON A FORM


    When you access data, you often need to allow the user to edit that data. VB .NET
    provides functionality in each control to automatically connect its properties
    to data fields. You can use binding to very quickly connect a form to a database
    without having to write a significant amount of code.


    There are two major types of binding: Simple and complex. Most controls support
    one or the other type. Simple binding connects a single field of a single record
    to a control property. For example, you can link the LastName field in a database
    to a text box for viewing and editing. Complex binding involves binding an entire
    set of data, be it a single field from a list of records, or an entire table of
    data.


    Simple binding functions through a property called DataBinding in any control
    that supports it. The property stores a collection of Binding objects that link
    a property in the control to a DataSet field. Visual Basic .NET enables


    you to create the appropriate Binding object through the control’s property page.
    You simply select the field to bind to the control.


    To work with list of records with complex binding, you can use the ListBox, ComboBox,
    or CheckedListBox. Each displays a list of records that DataSet provides. Set
    the DataSource property to a valid DataSet and the DataMember property to the
    field to display. Commonly, you use the ListBox and ComboBox controls to display
    a list of records to edit. See the section “Move through a Dataset” for information
    on choosing the active record.


    The ErrorProvider control also uses complex binding to monitor a DataSet for errors.
    This control monitors the data in the field and automatically supplies the error
    icon beside a control that contains a binding to the field. For more information
    on ErrorProvider, see the section “Validate Data.”


    ![](img/d6f772854306e15fb6df39b861a7b541_233_0.png)


    # CREATE A FORM


    +   1. Setup a database connection and database on the form…

    +   2. Add appropriate controls to the form.


    > Note: See the sections “Create a Database Connection” and “Add a Connection
    to a Form” to set up a database. For more information about adding controls to
    a form, see Chapter 3.


    # BIND A SIMPLE CONTROL


    +   3. In the Properties window, click the **+** to the left of (DataBindings).

    +   4. In the DataBindings section, click the property to which you want to bind
    data.

    +   5. Click **...** and then click the appropriate field to bind.'
  merge: -1
  img_proc: true
