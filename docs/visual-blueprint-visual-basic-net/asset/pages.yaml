- pgno: 149
  md: '# VISUAL BASIC .NET


    # ACCEPT INCOMING CONNECTIONS


    Many packages and even hardware devices provide network connections and a Web
    server you can connect to configure the package. Then a user can modify a setting
    in an application wherever their location. You can create a server by accepting
    incoming TCP/IP connections with the TcpListener class. Part of the System.Net.Socket
    namespace, this class relies heavily on the Socket class. See the section "Make
    a Connection to a Server" to learn how you use Socket to make outgoing connections.


    Create a TcpListener class by declaring a New instance of the class. Pass the
    port you want to listen on as the single parameter to the constructor of the class.
    For more information on creating class instances and using constructors, see Chapter
    7.


    To attach the listener to the port, call the Start method. At this point the class
    activates the port and awaits connections. To respond to a connection, call the
    AcceptSocket method.


    method. Calling this method blocks your program until a connection occurs, so
    you can place code to respond to the connection directly after it. The AcceptSocket
    method returns a Socket which you need to maintain a reference for reading and
    writing to the stream.


    Once you have the Socket, you can freely write information to it as long as the
    client stays connected. To write to a socket, use the Send method. The first parameter
    of the Send method is the Byte array to send. You can optionally follow this with
    the length of the data and a SocketFlags constant. In most cases, you can safely
    pass a zero for SocketFlags. To learn more search Visual Basic .NET Help for SocketFlags.


    After writing data to the socket, make sure to close it using the Socket.Close()
    method. Then you can wait for another connection by invoking the AcceptSocket
    method again. Disable the TcpListener by calling the Stop method.


    # ACCEPT INCOMING CONNECTIONS


    ![](img/d6f772854306e15fb6df39b861a7b541_149_0.png)


    +   1 Create a new project or open an existing one.


    +   2 In the appropriate method, type Dim server As New Net.Sockets.TcpListener(90),
    replacing TcpListener(90) with the variable name server with the variable name
    and 90 with the port.


    +   3 On a new line, type server.Start(), replacing server with the name of the
    TcpListener variable.


    +   4 Type Dim mySocket As Net.Sockets.Socket = server.AcceptSocket(), replacing
    mySocket with the variable name to create a socket and server with the name of
    the TcpListener variable.


    +   5 Type code to load a Byte array with information to send the client.


    +   6 Type mySocket.Send(), replacing mySocket with the variable name of the socket.'
  merge: -1
  img_proc: true
- pgno: 150
  md: "# Extra\n\nYou can use the TcpListener class to build full-featured applications.\
    \ For example, the basic function of a Web server is to wait for connections on\
    \ port 80, to process the request string the browser sends to the server, and\
    \ to write content back over the socket. You can retrieve information sent by\
    \ the client using the Receive method of the Socket object. For the parameter\
    \ to the Receive method, pass a Byte array to use as the buffer. The method returns\
    \ the actual number of bytes it loads into the buffer. Call the method multiple\
    \ times in sequence until all of the data loads. To convert a byte array into\
    \ a string, use the Text.Encoding.ASCII.GetString method. The example loads information\
    \ until it receives a new line control character in the text.\n\n# Example\n\n\
    ```\nDim server As New Net.Sockets.TcpListener(90)\nserver.Start()\n\nmySocket\
    \ As Net.Sockets.Socket = _\n    server.AcceptSocket()\n\nDim buffer(100) As Byte,\
    \ data As _\nString = \"\", size As Integer = 0\nDo Until InStr(headers, ControlChars.CrLf)\
    \ > 0\n    size = sock.Receive(buffer)\n    data += Text.Encoding.ASCII.GetString(buffer)\n\
    Loop\nmySocket.Close()\nServer.Stop()\nConsole.WriteLine(\"Received a character\
    \ return.\")\nConsole.ReadLine()\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_150_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_150_1.png)\n\n7 Inside the parentheses\
    \ type the name of the Bytes() variable.\n\n8 On a new line, type mySocket.Close(),\
    \ replacing mySocket with the name of the variable.\n\n9 On a new line, type server.Stop(),\
    \ replacing server with the name of the TcpListener.\n\n10 Press F5 to run your\
    \ project.\n\nThe server loads and waits for a connection.\n\nNote: See the section\
    \ \"Make a Connection to a Server\" to create a client program."
  merge: -1
