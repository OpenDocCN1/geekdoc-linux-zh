- pgno: 325
  md: '# CREATE A WINDOWS INSTALLER


    When you complete a project, you then need to package the application for distribution.
    Visual Studio provides tools to develop a setup application for components, applications,
    and Web projects you create. You can use the tool to build a professional and
    customized installation program.


    The Setup Wizard project enables you to create a project that supports the installation
    of Windows Application projects, Web Application projects, and component projects.
    When you add the project to a solution that contains Windows Application and component
    library projects, a wizard lets you select details for the installation, and then
    builds a project.


    You can also specify for the installation to build a CAB file, which you can provide
    for download on the Internet. For a Windows machine, the setup project builds
    a single file with a .msi extension that installs using the Windows Installer
    tool included with recent versions of Windows and Internet Explorer.


    With projects that install using the Setup Wizard, the wizard detects dependencies
    necessary for the project to run. For example, if the project requires database
    support, the setup project automatically includes a database distributable component.


    Also included in every project is the .NET redistributable component. After selecting
    a project, the Setup Wizard asks you which parts of the application you want to
    distribute. The Primary output selection includes the EXE or DLL file your project
    outputs. The Localized resource selection includes any resource files you include
    in your project. You can also include source code and content files associated
    with the project through the wizard.


    After you create the project, you can modify installation details by loading the
    client file system window and by specifying where files load on the client system.
    For more information on customizing the installation, see the section "Customize
    Your Installation."


    # CREATE A WINDOWS INSTALLER


    ![](img/d6f772854306e15fb6df39b861a7b541_325_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_325_1.png)


    +   1. Open an existing Windows Application project and call up the New Project
    dialog box.


    +   2. Click Setup and Deployment Projects and then select the Setup Wizard template.


    +   3. Type a name for the setup project.


    +   4. Click to add the project to the current solution.


    +   5. Click OK.


    +   6. Click Next to move to the second Setup Wizard page.


    +   7. Click the appropriate setup program style.


    +   8. Click Next.


    +   The first Setup Wizard page appears, explaining the process.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Extra


    You can create a Windows installation program to deploy a Web application onto
    new servers much like installing a Windows application. When the Setup Wizard
    begins, you click the Create a setup for a Web application option. Before creating
    the setup, you must have a Web Forms project open. Then add the setup project
    to the solution, just like you did an installer for Windows applications in the
    Introduction. When you run the setup, instead of prompting you for an installation
    directory, like a Windows application setup, the Web application setup asks for
    a virtual directory on a local copy of IIS into which it installs the Web application.
    The setup includes all of the necessary .NET Framework files in case the Web server
    does not have ASP.NET installed. The File System window contains the same options,
    although the default folders include only the Global Assembly Class and the Web
    Application Folder. The Web Application Folder item represents the Web server
    directory into which the Web application installs. Deploy the server by running
    the MSI setup file on the server that needs to run the application.


    ![](img/d6f772854306e15fb6df39b861a7b541_326_0.png)


    +   9. Click items from the project to include in the setup.

    +   10. Click Next.


    +   11. On the fourth screen, select any files necessary to include with the setup.

    +   12. Click Next.

    +   13. Click Finish to complete the wizard.


    The setup project adds to the current solution.


    > *Note: See “Customize Your Installation” to customize and build the setup program.*'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# CUSTOMIZE YOUR INSTALLATION


    You can customize the Setup Project to provide various installation capabilities.
    You can add menu items to the client computer’s Start Menu, as well as icons to
    the Desktop.


    To modify the setup appearance, you modify the setup project’s properties of the
    setup project. The Title property specifies the title for the installation. The
    Author property specifies the author to show in the installation. Description
    specifies a description to show when setup loads. The Manufacturer specifies the
    company that makes the product. You can optionally specify a URL to make the manufacturer
    information appear as a hyperlink using the ManufacturerUrl property. The ProductName
    property specifies the name of the product the setup program installs. You can
    specify support information using the SupportPhone and SupportUrl properties.
    The Version property stores the software version that setup installs. The DetectNewerInstalledVersion
    property determines how setup handles a previously installed version. If setup
    determines that a newer version already exists and this property is True, installation
    cancels.


    To customize the file locations the setup program uses to install the application,
    you use the File System window in the setup project. In the File System window,
    four main folders, into which you can place items, appear by default: the Application
    Folder, the Global Assembly Cache Folder, the User’s Desktop, and the User’s Program
    Menu. Although only those four items appear, a multitude of other install paths
    are available. You can add files to the Windows folder, the System folder, or
    the user’s favorites or application data folders, among others.


    You can also specify subfolders in your installation directories to install particular
    files into particular locations. To move files, you simply drag and drop them.


    To add a Start menu item, you go to the User’s Programs Menu and add a shortcut.
    You need to select the primary output file, which automatically links to your
    project’s executable.


    # CUSTOMIZE YOUR INSTALLATION


    +   1 Add a setup project to an existing application solution.

    +   Note: To add a setup project, see "Create a Windows Installer."

    +   2 Click the setup project in the Solution Explorer.


    +   3 In the Properties window, type the application’s name in the ProductName
    property.

    +   4 Type new values for other necessary properties.

    +   5 Double-click any installation targets.


    +   6 Click the User’s Programs Menu item.

    +   The File System window loads.


    +   7 Right-click the right pane of the File System window.

    +   A pop-up menu appears.

    +   8 Click Create New Shortcut.


    ![](img/d6f772854306e15fb6df39b861a7b541_327_0.png)'
  merge: -1
  img_proc: true
