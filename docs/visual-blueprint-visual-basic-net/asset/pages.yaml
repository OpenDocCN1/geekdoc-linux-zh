- pgno: 169
  md: '# CREATE A PATH


    Because simple primitives may not provide the desired appearance for your application,
    you can combine multiple primitives into a single object with a single fill. You
    use the GraphicsPath object to create a complex object from a number of primitives.
    The GraphicsPath can also represent multiple figures, completely separate in space.
    A figure consists of an open or closed shape.


    To create a GraphicsPath, declare a new instance of a GraphicsPath class with
    no entries passed to the constructor as parameters. The class is part of the System.Drawing.Drawing2D
    namespace. However, you may find creating the path through the constructor difficult.
    For more information on declaring new instances of classes and using constructors,
    see Chapter 7.


    To begin building an individual figure, call the StartFigure method with no parameters.
    The AddLine method adds a line to the figure. AddCurve adds a curve to the figure.
    You can replicate all of the Draw methods throughout this chapter, such as DrawEllipse
    and DrawPie, with the prefix Add instead of Draw. The methods accept all the same
    parameters with the exception of the Pen parameter, which you leave out completely.
    To create a functioning path, the last point of a previous primitive and the first
    point of the following primitive must match. For more information on primitive
    drawing methods, see the section "Draw a Primitive."


    If you want to close the figure before starting a new one, call the CloseFigure
    method. Call StartFigure again to start a new figure without closing the current
    one. Use the CloseAllFigures method with no parameters to close any open figures
    previously created.


    To draw the path onscreen, call DrawPath with a Pen as the first argument and
    the GraphicsPath as the second argument. You can fill the interior areas of a
    path using FillPath. Pass a Brush as the first parameter and the GraphicsPath
    as the second.


    ![](img/d6f772854306e15fb6df39b861a7b541_169_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_169_1.png)


    +   1. Create a new Windows Application project or open an existing project.


    +   2. Open the Paint event where the primitive needs to draw.


    +   3. Type Dim myPath As New Drawing.Drawing2D.GraphicsPath(), replacing myPath
    with the variable name for the path.


    +   4. Type myPath.StartFigure(), replacing myPath with the path''s variable name.


    +   5. Type myPath.AddLine(10, 10, 300, 15), replacing myPath with the variable
    name and AddLine(10, 10, 300, 15) with a primitive adding method.


    +   6. Repeat step 5 until the figure is complete.


    +   7. Repeat steps 4 to 6 to create the necessary figures.


    +   You can type myPath.CloseFigure() replacing myPath with the path variable
    to create a closed figure.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Extra


    You can use the Warp method of the GraphicsPath object to warp objects. Pass a
    rectangle specifying the bounds of the path and an array of points making up a
    parallelogram into which you warp the rectangle. If you specify three points,
    the parallelogram adds the points and makes the lower-right point automatically.
    The command then warps all of the points in the path to fit the shape.


    # Example:


    ```

    Dim myPath As New Drawing2D.GraphicsPath()

    Dim srcRect As New RectangleF(0, 0, 100, 200)

    myPath.AddRectangle(srcRect)


    e.Graphics.DrawPath(Pens.Black, myPath)


    Dim point1 = New PointF(200, 200)

    Dim point2 = New PointF(400, 250)

    Dim point3 = New PointF(220, 400)

    Dim destPoints() As PointF = {point1, point2, point3}


    myPath.Warp(destPoints, srcRect)


    e.Graphics.DrawPath(Drawing.Pens.Red, myPath)

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_170_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_170_1.png)


    8 Declare a Pen to draw the path.


    9 Type e.Graphics.DrawPath(redPen, myPath), replacing e.Graphics with the name
    of the Graphics object, redPen with the name of the Pen, and myPath with the name
    of the GraphicsPath.


    The GraphicsPath draws onto the drawing region.


    10 Press F5 to run the project.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# USING REGIONS


    Windows GDI+ enables you to create complex areas of space defined as a region.
    A region consists of any number of rectangles and paths that build a contained
    area of space. The Region class that VB .NET provides represents a region. Windows
    uses a region to determine the shape of a window. For more information on creating
    a shaped window, see the section “Create a Shaped Window.”


    To create a region, declare a new instance of the Region class using Dim combined
    with the New operator. The class is part of the System.Drawing namespace. To create
    a simple rectangular region, pass the constructor a Rectangle object. To create
    a more complex region, you create a GraphicsPath object and pass it to the Region
    constructor. For more information on creating a GraphicsPath, see the section
    “Create a Path.”


    The real power of regions comes from their ability to combine. Each of the two
    methods below expects a


    GraphicsPath, Rectangle, or another Region. Union takes the object from the argument
    and adds the object’s space to the current region. Intersect takes the object
    from the argument and leaves only the part of the current region where both objects
    exist. Complement updates the current region to the portion of the specified object
    that does not intersect with the object. Exclude updates the current region to
    the portion of its interior that does not intersect with the specified object.
    Xor updates the current region with the union minus the intersection of itself
    with the object.


    To draw a region, the Graphics object provides a FillRegion method. This method
    accepts a Brush as the first parameter and a Region as the second parameter. To
    use a Region you create as a Clip region in a Graphics object, and set the Graphics.Clip
    property equal to the Region.


    # USING REGIONS


    ![](img/d6f772854306e15fb6df39b861a7b541_171_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_171_1.png)


    +   1 Open the Paint event where the primitive needs to draw.


    +   2 Create a GraphicsPath object specifying a closed path.


    Note: To create a GraphicsPath, see the section “Create a Path.”


    +   3 Type Dim myRegion As New Region(path), replacing myRegion with the name
    for the Region and path with the name of the GraphicsPath.


    +   4 To combine regions, declare and initialize a new GraphicsPath or Rectangle
    object.


    +   5 Type myRegion.Xor(myRect), replacing myRegion with the name of the Region,
    Xor with one of the combination methods, and myRect with the name of the new object.'
  merge: -1
  img_proc: true
- pgno: 172
  md: "# Extra\n\nAlthough the coordinates of a Region are fixed, you can move the\
    \ Region around when drawing it using its Translate method. Pass a set of integers\
    \ or singles to the method that specifies the movement in the horizontal and vertical\
    \ direction, respectively. The GetBounds property returns a RectangleF object\
    \ that represents the smallest rectangle the Region fits within.\n\n```\nExample:\n\
    myRegion.Translate(100, 100)\ne.Graphics.FillRegion(myBrush, myRegion)\nDim rect\
    \ As RectangleF = myRegion.GetBounds(e.Graphics)\ne.Graphics.DrawRectangle(myPen,\
    \ rect.X, rect.Y,\n    rect.Width, rect.Height)\n```\n\nA RegionData object stores\
    \ the information necessary to recreate a particular Region object. The RegionData\
    \ object uses an array of characters as a representation to store the data. A\
    \ Region object's GetRegionData method returns a RegionData object that represents\
    \ it. One of the constructors available for the Region class accepts a RegionData\
    \ class. The example shows one Region object replicated into a new Region using\
    \ the RegionData object.\n\n```\nExample:\nDim myRegionData As Drawing2D.RegionData\
    \ = myRegion.GetRegionData()\nDim myNewRegion As New Region(myRegionData)\n```\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_172_0.png)\n\n+   1. To draw the region,\
    \ create a Brush object.\n+      Note: To create a Brush, see the section \"Create\
    \ a Brush.\"\n+   2. Type e.Graphics.FillRegion(myBrush, myRegion), replacing\
    \ myBrush with the name of your brush.\n+   3. Press F5 to run your project.\n\
    +   4. The region accepts a range of space, combines new space, and draws to the\
    \ screen."
  merge: -1
  img_proc: true
- pgno: 173
  md: "# CREATE A SHAPED WINDOW\n\nMany utilities like media players create a custom\
    \ shaped window to resemble a real-life object. You can use a Region to define\
    \ a shape for a window.\n\nTo define a Region object, see the section \"Using\
    \ Regions.\" Defining a Region for a window is somewhat different than creating\
    \ a drawing region or even a clip region. A Region object does not require you\
    \ to make the shape a single enclosed object. Remember that the user still needs\
    \ to use the window, so make the Region fairly simple.\n\nTo shape your form,\
    \ set the Form.Region property equal to the Region. While resizable forms support\
    \ a Region, you must use a nonresizing Form and place the Region loading code\
    \ in Form_Load. If you choose to create a resizable shaped window, place code\
    \ based on the form's Size in both Form_Load and Form_Resize.\n\nWhen the Region\
    \ lies over the form, Windows uses the intersection of the actual form and the\
    \ Region object to draw the same parts of the form that exist there. That means,\
    \ if the region includes the top of the window, a title bar still draws. The code\
    \ that draws the title bar does not support regions, so the caption of the window,\
    \ the icon, and the buttons remain in the same corners as if you had set no region,\
    \ and cut just like the rest of the Form. If your shape cuts off part of the title\
    \ bar, you can hide the title bar by setting FormBorderStyle to None.\n\nTo close\
    \ the window without using the form's close button, simply use a button or other\
    \ control and the form's Close method. To minimize the window, set the WindowState\
    \ property to FormWindowState.Minimized.\n\n![](img/d6f772854306e15fb6df39b861a7b541_173_0.png)\n\
    \n+   1 Create a new Windows Application project or open an existing project and\
    \ the form to work with.\n\n+   2 In the Property Window, click the FormBorderStyle\
    \ and then click a new value.\n\n+   3 Add controls to allow the user to minimize\
    \ and close the form.\n+   Note: To add controls, see Chapter 2.\n\n+   4 Double-click\
    \ the form.\n\n+   5 Create a Region object for the window.\n\n+   6 Type Me.Region\
    \ = winReg, replacing winReg with the name of the Region object.\n+   Note: To\
    \ create a Region object, see the section \"Using Regions.\"\n\n```\nPrivate Sub\
    \ Form1_Load(ByVal sender As System.Object, ByVal e As System.EventArgs) Handles\
    \ MyBase.Load\n    Dim path As New Drawing.Drawing2D.GraphicsPath()\n    path.AddLine(0,\
    \ 0, 0)\n    path.AddLine(0, 0, 0, 40)\n    path.AddCurve(New Point(0, 40), New\
    \ Point(260, 300))\n    New Point(0, 170), New Point(260, 300))\n    path.AddLine(260,\
    \ 300, 300, 300)\n    path.AddLine(300, 300, 300, 300)\n    path.AddCurve(New\
    \ Point(300, 300), New Point(100, 260))\n    New Point(100, 130), New Point(40,\
    \ 0))\n    Dim winReg As New Region(path)\n    Me.Region = winReg\nEnd Sub\n```"
  merge: -1
  img_proc: true
- pgno: 174
  md: "# Apply It\n\nWhen you create a shaped window, you often cut off the title\
    \ bar or remove it explicitly. With the example code, which uses the Windows Application\
    \ Programming Interface (API) to access the underlying Windows system’s functions,\
    \ a user can move the window by clicking anywhere on the shaped form. You can\
    \ change the constant for SendMessage to a specified constant to resize the window\
    \ without using the edges of the window. You can also move the code from the Form1_MouseDown\
    \ to the mouse down event of controls on the form.\n\n# TYPE THIS:\n\n```\nPrivate\
    \ Declare Function ReleaseCapture Lib \"user32\" () As Long\nPrivate Declare Function\
    \ SendMessage Lib \"user32\" Alias \"SendMessageA\" (ByVal hwnd As IntPtr, ByVal\
    \ wMsg As Integer, ByVal wParam As Integer, ByVal lParam As Integer) As Integer\n\
    Const WM_NCLBUTTONDOWN = &HA1, HTCAPTION = 2, HTLEFT = 10\nConst HTOPRIGHT = 14,\
    \ HT RIGHT = 11, HT TOP = 12, HT TOPLEFT = 13\nConst HTBOTTOM = 15, HTBOTTOMLEFT\
    \ = 16, HTBOTTOMRIGHT = 17\nPrivate Sub Form1_MouseDown(ByVal sender As Object,\
    \ ByVal e As System.Windows.Forms.MouseEventArgs) Handles MyBase.MouseDown\n \
    \   ReleaseCapture()\n    SendMessage(Me.Handle, WM_NCLBUTTONDOWN, HTCAPTION,\
    \ 0)\nEnd Sub\n```\n\n# RESULT:\n\nThe user can drag the window around by clicking\
    \ anywhere on its surface.\n\n![](img/d6f772854306e15fb6df39b861a7b541_174_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_174_1.png)\n\n+   7 In the Click event\
    \ for the Close button, type Me.Close().\n\n+   8 In the Click event for the Minimize\
    \ button, type Me.WindowState = FormWindowState.Minimized.\n\n+   9 Press F5 to\
    \ run your project.\n\nThe window shapes to the Region and allows you to close\
    \ and minimize the window without using the standard buttons."
  merge: -1
  img_proc: true
- pgno: 175
  md: '# CREATE A CLASS


    When using Visual Basic .NET, you work with dozens of classes to perform even
    the simplest operation. VB .NET uses classes to split its massive number of functions
    into smaller blocks for you to use. You can create your own classes to enclose
    a set of functionality for reuse and ease of programming. When you create a class,
    it allows you to forget the implementation details of the class and focus on using
    the abilities of the class you create. Designing code for a class is more difficult
    than placing all of your code in large modules and forms, but makes your code
    much easier to read, debug, extend, and reuse.


    VB .NET declares classes using the Class...End Class structure. Before the Class
    keyword, you specify the instancing of the class using Public, Private, or the
    other available options. The name for the class goes after the Class keyword.
    The name of a class follows standard variable-naming techniques. The body code
    of the class resides between the Class and End Class statements. Code inside the
    block specifies methods, properties, and events of the class.


    Two options enable you to specify details for inheritance. Place MustInherit in
    front of the Class keyword to not allow VB .NET to make instances of the class
    and only allow other classes use of this class as their base. The NotInheritable
    keyword is the opposite and does not allow you to specify this class as a base
    class. For more information on inheritance, see Chapter 8.


    By default, VB .NET places each class in a separate file. You can place multiple
    classes inside each file if you want, which is especially useful for a set of
    classes that work together.


    # CREATE A CLASS


    ![](img/d6f772854306e15fb6df39b861a7b541_175_0.png)


    +   1. Create a new application or open an existing one.

    +   2. Click Project > Add Class.

    +   3. Type a filename for the new class.

    +   4. Click Open.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Extra


    You can use accessibility operators to specify how classes and members of classes
    work in relation to other parts of the project. When you declare a class, you
    specify an accessibility operator to define how the rest of your project and even
    outside applications can access the class.


    Each member inside a class has a particular accessibility as well. The two main
    operators are Public and Private. Other operators exist to work with inheritance
    and other advanced topics. See Chapter 8 for more information.


    # ACCESSIBILITY OPERATORS


    | Public | Public accessibility allows you to access the element from anywhere
    within the same project and from other projects that reference the project. Public
    members of classes are available to any user who creates an instance of the class.
    |

    | Private | Private accessibility allows access only from within the same module,
    class, or structure where you declare the element. You cannot access members of
    a class you declare as Private outside of the class, but can use it inside the
    class. |


    ![](img/d6f772854306e15fb6df39b861a7b541_176_0.png)


    VB .NET creates a new class in a new file and adds the file to the project.


    5 You can create a class in an existing module by clicking an empty line and typing
    Class MyNewClass, replacing MyNewClass with the name for the class.


    6 Press Enter.


    ![](img/d6f772854306e15fb6df39b861a7b541_176_1.png)


    VB .NET creates the class and adds the End Class statement automatically.


    Note: See the section "Define a Member Variable" to add a member variable to the
    class.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# DEFINE A MEMBER VARIABLE


    You can use a member variable as a field or a data storage mechanism. Everything
    you add to a class is a member including a property, method, or event. A member
    variable provides the simplest member to any class: the ability for the class
    to store data.


    To create a field users of the class can access, just declare a variable using
    the Public statement instead of Dim. This declares a variable in the class, but
    because you declare the variable public, anyone who creates an object of this
    class can access the variable as well, loading and setting the value. This makes
    the member variable not only store data, but also enable outside users of the
    class to manipulate the value. The problem with making the variable public is
    that you cannot monitor the values that the outside user gives to the member variable.


    To make a variable only available inside the class, you can create a member variable
    for its most common use — a private data field. You create a private data field
    by placing the Private statement on a line and follow it with a variable name
    and the As type specification. You can use private variables to store property
    values. You provide public access to properties with the Property blocks. See
    the section "Define a Property" for more information on creating a property.


    The reason to create a private member variable with a public Property block is
    so the class can check values it receives, raise errors when necessary, or edit
    the data appropriately. For example, if you have a property called Counter with
    valid values from one to ten, creating a public member variable enables the user
    to set a value much larger than the correct range. Instead, the private member
    variable only stores values that make sense to the rest of the class.


    # DEFINE A MEMBER VARIABLE


    ![](img/d6f772854306e15fb6df39b861a7b541_177_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_177_1.png)


    +   1. Create a new class or open an existing one.

    +   Note: See the section "Create a Class" to create a class.


    +   2. Click in an empty line in the class, but outside of all methods and properties.


    +   3. Type an accessibility keyword, such as Public or Private.


    Note: See the section "Create a Class" for information on accessibility operators.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# Extra


    To avoid defining all of the possible variables the class needs as member variables,
    a common mistake of new programmers, you should always remember the scope for
    which you need a certain piece of data. If you have a method that does a calculation
    and returns the result, do not store the result in member level variables. Instead,
    create variables in the method to use as temporary variables. When the method
    exits, VB.NET can release the memory these variables use. Every member-level variable
    you create must remain in memory for the entire time the class stays in memory.
    If you create an unnecessary amount of member variables, you can create a very
    inefficient application.


    Although creating a public member variable generates a quick and easy property
    for a class, the design ideas of a class inherently foster reuse and reliability
    of the internal workings of the class. A public member variable can create a number
    of problems that are hard to debug. You can ensure the class performs reliably
    if you define the criteria of a property value by using a Property block.


    ![](img/d6f772854306e15fb6df39b861a7b541_178_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_178_1.png)


    +   4 Type the name for the member variable.


    +   5 Type As followed by the variable type.


    +   6 Optionally, you can type = and follow it with a value to set the default
    value.


    +   7 The member variable is now ready for use.

    +   Note: See the section "Define a Property" to add a property to the class.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# DEFINE A PROPERTY


    In classes you use, such as forms and controls, properties enable you to specify
    the details that make up the characteristics of that component. Most classes and
    components require information to operate and adapt to different functions. You
    can define properties to let the user of your class specify how your class should
    perform and which data it uses to perform operations.


    To define a property in VB .NET, use the Property... End Property statement block.
    After the Property keyword, specify the name of the property. Property names follow
    standard variable-naming techniques. Following the name of the property, you specify
    an argument list in parentheses. You only define an argument list if the property
    allows the user to edit a particular index of a list of data. For simple properties,
    you do not need to specify any arguments. Following the argument list, you specify
    the variable type of the property using the As keyword.


    Inside of the block, the Get... End Get and Set... End Set blocks provide separate
    blocks of code for when the user of the class retrieves the property and when
    the user sets the value of the property. A Set block always receives a parameter
    Value that is of the same type as the property. This variable contains the value
    the user assigned to the property.


    Normal code for a property revolves around a private member variable. For more
    information on member variables, see the section "Define a Member Variable." In
    most cases, a property functions as a public access point to a variable the class
    needs to operate. The class stores the value of this variable in a private variable,
    and provides the opportunity to change this value through the property, where
    it can perform error checking and validation. The Set code assigns Value to a
    private member variable, and Get uses the Return function to return the member
    variable.


    # DEFINE A PROPERTY


    ![](img/d6f772854306e15fb6df39b861a7b541_179_0.png)


    +   1. Create a new class or open an existing one.

    +   Note: See the section "Create a Class" to create a class.


    +   2. Declare a private member variable to hold the property value.

    +   Note: See the section "Define a Member Variable" to create a member variable.


    +   3. On an empty line inside the Class block, type Property Property1() As String,
    replacing Property1() with the name of the property and String with the property
    type.


    +   4. Press Enter.

    +   If you need parameters for the property, type them after the name inside parentheses.'
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Extra\n\nYou use the argument list of a property to access data values of\
    \ a list or array the class stores. You can also make a property with an argument\
    \ the default property of the class. If the property is the default, you can access\
    \ it by typing the name of the class, followed directly by the index in parentheses\
    \ without specifying the property name.\n\nYou can create properties that only\
    \ support reading their value or only support writing to the property using the\
    \ ReadOnly and WriteOnly keywords before the Property keyword.\n\n# Example:\n\
    \n```\nPrivate myData(10) As String\nDefault Public Property Data(ByVal Index\
    \ As Integer) As String\n    Get\n        If Index >= 0 And Index <= 10 Then Return\
    \ myData(Index)\n    End Get\n    Set(ByVal Value As String)\n        If Index\
    \ >= 0 And Index <= 10 Then myData(Index) = Value\n    End Set\nEnd Property\n\
    ```\n\n# Example:\n\n```\nPublic ReadOnly Property ReadMe()\n    Get\n       \
    \ Return myData\n    End Get\nEnd Property\nPublic WriteOnly Property WriteToMe()\n\
    \    Set(ByVal Value)\n        myData = Value\n    End Set\nEnd Property\n```\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_180_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_180_1.png)\n\
    \nVB .NET creates the full property block including Get and Set blocks.\n\n+ \
    \  5 In the Get section of the Property, type Return.\n\n+   6 Type the private\
    \ member variable name.\n\n+   7 In the Set section of the Property, type an If\
    \ statement to validate the Value variable.\n\n+   8 Type the name of the private\
    \ member variable.\n\n+   9 Type = Value.\n\nThe property is complete.\n\nNote:\
    \ See \"Using an Existing Class\" for more on properties in your custom class."
  merge: -1
  img_proc: true
- pgno: 181
  md: '# CREATE A CONSTRUCTOR OR DESTRUCTOR


    You can use a constructor to load initial values into private variables, set initial
    property values, and load necessary data. Constructors enable the user of the
    class to initialize the class with proper values without having to individually
    set a long list of properties. Also, in many cases, a class needs to know a particular
    setting and cannot alter this setting later in execution, so it requires this
    information at the time of construction. You can use a destructor to destroy class
    and component references the class holds during execution.


    A constructor is actually a method with the name New. VB .NET automatically calls
    this method when the class initializes using the New keyword. You must create
    the constructor using the Sub ... End Sub block because a constructor cannot return
    a value. For the parameter list, specify the values the user must set for the
    class to function.


    One set of parameters is rarely convenient for every possible use of your class.
    You may need to specify different data for different situations where you use
    the class. You can create


    multiple versions of the constructor to accept different sets of input parameters.
    You can create multiple versions of New without explicitly overloading the constructor
    like VB .NET requires you to do for other methods. You use overloading to define
    multiple instances of the same method. To overload the constructor, simply create
    multiple New methods with different parameter lists. For more information on overloading
    any method, see chapter 8.


    You create a destructor in VB .NET with the Finalize method of the class. In classes
    that do not create objects, you do not need a destructor. You need a destructor
    when the class holds references to objects. For example, if you create an instance
    of a class and save it as a member variable for use during the execution of the
    class, you can set the variable equal to Nothing in the Finalize event so VB .NET
    can delete the object from memory. You can also use destructors to perform other
    cleanup for your class, such as closing network and file connections. To create
    a destructor, you must specify the keywords Protected and Overrides before the
    Sub statement. You can learn more about these keywords in Chapter 8.


    # CREATE A CONSTRUCTOR OR DESTRUCTOR


    ![](img/d6f772854306e15fb6df39b861a7b541_181_0.png)


    +   1. Create a new class or open an existing one.

    +   2. In an empty line outside of all methods in the class, type Sub New().

    +   3. Inside the parentheses, type any required construction parameters.

    +   4. At the end of the line, press Enter.


    Note: To create a class, see the section "Create a Class."'
  merge: -1
  img_proc: true
- pgno: 182
  md: "# Extra\n\nVB.NET uses garbage collection to remove objects from memory at\
    \ an arbitrary time later when the program is idle. You can implement a Dispose\
    \ method to allow the user of your class to clear the memory it uses immediately\
    \ instead of waiting for the destructor to run. You use a Dispose method for classes\
    \ dealing with finite resources like files or streams. The example uses the disposed\
    \ variable to determine if Dispose is called more than once. Your Dispose method\
    \ should allow for this as well.\n\n# Example:\n\n```\nPublic Class Class1: Implements\
    \ IDisposable\n    Private myFile As New IO.FileStream(\"C:\\test.txt\", IO.FileMode.OpenOrCreate)\n\
    \    Private disposed As Boolean = False\n    Public Sub Dispose() Implements\
    \ IDisposable.Dispose    ' allow disposal\n        If Not disposed Then myFile.Close();\
    \ disposed = true\n        GC.SuppressFinalize(Me)    ' don't run destructor since\
    \ we already cleaned up\n    End Sub\nEnd Class\nPublic Class Class2\n    Dim\
    \ UseClass1 As New UseClass1()\n    Sub Method1()\n        ...               \
    \          ' use the instance of the class you create\n        UseClass1.Dispose()\
    \         ' dispose the class to clean it up immediately\n    End Sub\nEnd Class\n\
    ```\n\n![](img/d6f772854306e15fb6df39b861a7b541_182_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_182_1.png)\n\
    \nThe End Sub statement appears automatically.\n\n5 Type the necessary construction\
    \ code.\n\n# CREATE A DESTRUCTOR\n\n6 Outside of any methods, type Protected Overrides\
    \ Sub Finalize().\n\n7 Press Enter.\n\n8 Inside the block, type code to remove\
    \ any references.\n\nAn instance of your class can now be customized using the\
    \ constructor.\nNote: See the section \"Using an Existing Class\" to use your\
    \ class."
  merge: -1
  img_proc: true
- pgno: 183
  md: '# CREATE AN EVENT


    Events perform the final component necessary to create a fully functioning class
    module. Think of an event as a response from an object. For example, imagine yourself
    bouncing or throwing a ball; you consider those things actions and represent them
    with methods in a class. Eventually the ball you throw hits the ground, making
    a change in direction to which the owner of the ball must respond. You can use
    events to pass back information on the status of an operation, the completion
    of an event, a notification of a change, or for a variety of other reasons.


    To add an event to a class, use the Event statement. You place this statement
    in the declaration section of the class; you must locate the statement outside
    of any method and property blocks. In most cases, you should declare the event
    using the Public accessibility keyword before the Event statement so outside users
    of the class can respond to the event.


    After the Event statement, you specify the name of the event and follow it with
    the argument list that returns to the owner of the class instance. You do not
    place a list of data here, only a list of variable names followed by the As keyword
    and the type of data. Separate multiple entries with commas, just like when you
    write a method declaration. The Event statement does not form a block of code;
    it is just a statement to tell VB .NET that your class fires a particular event.


    When the event needs to fire, call the RaiseEvent statement from inside the class.
    After the RaiseEvent statement, specify the name of the event you declared and
    all of the values to send through the parameter list of the event in parentheses.


    # CREATE AN EVENT


    ![](img/d6f772854306e15fb6df39b861a7b541_183_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_183_1.png)


    +   1 Create a new class or open an existing one.


    Note: To create a class, see the section "Create a Class."


    +   2 On an empty line outside of all methods in the class, type an accessibility
    parameter followed by Event.


    You can insert the Public keyword to specify that any code using the class can
    respond to its events.


    +   3 Type the name of the event and follow it with parentheses.


    +   4 Type the parameters for the event inside the parentheses.'
  merge: -1
  img_proc: true
- pgno: 184
  md: "# Apply It\n\nYou can fire an event that reports the percentage of the task\
    \ that is complete. You can also allow the event handler to send information back\
    \ to your class. The form can have a Cancel button whose handler code tells the\
    \ method to stop when the event fires. A parameter with the ByRef keyword, which\
    \ allows VB .NET to pass changes to the variable back when a routine finishes,\
    \ make this possible.\n\n# TYPE THIS:\n\n```\nClass LongTimeClass\nEvent PercentDone(ByVal\
    \ Percent As Integer, ByRef Cancel As Boolean)\nSub DoWork()\nDim done As Boolean,\
    \ cancel As Integer\nDo Until done Or cancel ' do work in loop until done or user\
    \ cancels\nRaiseEvent PercentDone(percent, cancel) ' send new percentage\nLoop\n\
    End Sub\nEnd Class\nClass Form1\nInherit System.Windows.Form\nPrivate WithEvents\
    \ workerClass As New LongTimeClass\nPrivate CancelWork As Boolean = False\nPrivate\
    \ Sub CancelButton_Click(...) \nCancelWork = True ' user wants to cancel. tell\
    \ class when event fires.\nEnd Sub\nPrivate Sub PercentDoneChanged(ByVal Percent\
    \ As Integer, _\nByRef Cancel As Boolean) Handles workerClass.PercentDone\nApplication.DoEvents()\
    \ ' you must update percentage bar here\nIf CancelWork Then Cancel = True ' cancel\
    \ the work activity\nEnd Sub\nEnd Class\n```\n\n# RESULT:\n\nThe class method\
    \ cancels work when a user presses the Cancel button.\n\n![](img/d6f772854306e15fb6df39b861a7b541_184_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_184_1.png)\n\n5 Create or move to the\
    \ method where the event fires.\n\n6 Type RaiseEvent.\n\nNote: To define a method,\
    \ see Chapter 4.\n\n7 Type the name of the event you previously declared and follow\
    \ it with parentheses.\n\n8 Type the values required by the parameter definitions\
    \ and enclose them in parentheses.\n\nThe method raises the event when a user\
    \ of your class calls it.\n\nNote: See the section 'Using an Existing Class' for\
    \ information on handling the event."
  merge: -1
  img_proc: true
- pgno: 185
  md: '# USING AN EXISTING CLASS


    After you define a class, you can use it throughout your project just like you
    use classes that VB .NET provides. To create a class, see the section "Create
    a Class." A class by itself only defines the properties, methods, and events.
    To use the class, you must create a new instance of the class. An instance of
    a class is an object that lets you call and manipulate the members that the class
    defines. You can create any number of separate objects from the same class. Each
    object is a separate entity with its own data, and each object uses the code you
    specify in the class to work with its data.


    To declare a variable to hold an instance of a class, you specify the name of
    the class. To actually create an instance of the class, you must use the New keyword.
    You assign a new instance of the class to a the variable when you declare it by
    placing the New keyword after the As keyword. When you specify the New keyword,
    VB .NET assigns an object with its own data to the variable you can then manipulate.


    To access a property of the object you create, specify the variable name of the
    object and the name of the property. You can only access the properties that the
    class makes available to you. To call a method in your class, use the variable
    name again with the name of the method. You place the arguments for the method
    inside parentheses.


    To handle events raised by your class, you must declare the object variable for
    the class in the declaration section of the class or module. To respond to events,
    place WithEvents before the variable name in the declaration.


    The example in this section assumes you create a class and add members to the
    class. See the previous topics in the chapter to learn how to create a class.


    # USING AN EXISTING CLASS


