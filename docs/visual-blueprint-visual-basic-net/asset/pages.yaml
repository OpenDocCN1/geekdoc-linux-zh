- pgno: 91
  md: '# PROVIDE STATUS INFORMATION


    You can provide status and help information on the form, typically at the bottom
    with the StatusBar control. The status bar also places an easy resize grip in
    the right-hand corner for easier resizing. StatusBar controls easily broadcast
    information to a user working in the main application space without interfering
    with them.


    The StatusBar control has two modes: simple mode and paneled mode. The simple
    mode allows you to simply set the Text property and provide a single line of information
    on the status bar.


    To enable paneled mode, you set ShowPanels to True. In this mode, you define custom
    ranges of space called panels. Each panel is a sized area into which you can load
    textual information. VB.NET defines panels in the Panels collection.


    Each Panel in the Panels collection has a number of properties. Text allows you
    to set or retrieve text into the panel. Alignment lets you control left, center,
    or right-align the contents of the panel. BorderStyle controls the panel''s edges.
    The default is Sunken, but other options include Raised and None. You can load
    an icon into the panel by using the Icon property. The Toolbar does not scale
    the icon, so the icon needs a 16x16 version.


    AutoSize, when set to Content, allows the panel to resize itself to its contents.
    If this is not True, the Width property defines the width of the panel. When the
    panel has AutoSize set, you can define the minimum width it reaches using the
    MinWidth property.


    So in ShowPanels = False mode, you can update the status bar at any time by setting
    StatusBar.Text equal to a text string. In ShowPanels mode, you need to update
    the different panels individually by setting StatusBarPanel.Text equal to a text
    string.


    The StatusBar notifies you to clicks using the Click event for default status
    bars, or the PanelClick click for paneled bars.


    ![](img/d6f772854306e15fb6df39b861a7b541_91_0.png)


    # SET THE TEXT DISPLAY OF THE SIMPLE STATUS BAR


    +   1. Create a new Windows Application project or open an existing one.


    +   2. In the Toolbox, double-click the StatusBar control to add it to the form.


    +   3. In the Properties window, set the Text property.


    # CREATING A PANELLED STATUS BAR


    +   4. Set the ShowPanels property in the Properties window to True.


    Note: See Chapter 2 to learn about setting properties.


    +   5. Click the Panels property.


    +   6. Click ...'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Apply It


    You can create a progress meter that updates inside a single panel of your status
    bar. To create custom panels, set the panel’s Style to OwnerDraw. When this is
    set, the StatusBar control fires the DrawItem event every time you need to redraw
    the panel. If you want to manually redraw the panel, you can use the Invalidate
    method. In the example below, place the percentDone declaration at the top of
    the form code. Add a button to the form and set one panel’s Style = OwnerDraw.
    When you press the button, the progress meter fills by 5 percent.


    # TYPE THIS:


    ```

    Private percentDone As Integer


    Private Sub StatusBar1_DrawItem(ByVal sender As Object, ByVal e As System.Windows.Forms.StatusBarDrawItemEventArgs)
    Handles StatusBar1.DrawItem

    Dim g As Graphics = ebdvent.Graphics

    Dim b As Brush = New SolidBrush(SystemColors.Highlight)

    Dim rect As Rectangle = ebdvent.Bounds

    rect.Width = CInt((CInt(percentDone) / 100 * rect.Width))

    g.FillRectangle(b, rect)

    End Sub


    Private Sub Button1_Click(ByVal sender As System.Object, ByVal e As System.EventArgs)
    Handles Button1.Click

    percentDone = percentDone + 5

    StatusBar1.Invalidate()

    End Sub

    ```


    # RESULT:


    The progress bar panel fills when a user repeatedly clicks the button.


    ![](img/d6f772854306e15fb6df39b861a7b541_92_0.png)


    7 Click Add to create a new panel.


    8 Type text to display into the Text property.


    9 Modify the width of the panel by typing a value into the Width property.


    10 Edit other properties as desired.


    11 Repeat steps 7 through 10 as necessary, clicking OK to accept changes.


    The StatusBar appears with the appropriate interface.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# CREATE A TAB INTERFACE


    You can create a tabbed interface to allow the user access to several screens
    of controls. A tabbed interface allows a single form to contain multiple screens
    of information, designated by named tabs, between which the user can switch. The
    TabControl control provides a fully functioning container control, much like a
    Panel control, but allows you to create multiple screens in the same client space.
    For more on the Panel control, see the section "Work With Panels".


    The TabPages collection contains the list of tabs present. Each tab has an independent
    Text property, a BackgroundImage property to assign a picture, and a ToolTipText
    property. By setting the AutoScroll property to True, tabs provide scrollbars,
    as necessary, to let users scroll through the controls the tab contains.


    By setting the ImageList property of the TabControl to a valid ImageList, you
    can assign images using the ImageIndex property of each tab to place on the left
    of the text.


    The Padding structure allows you to add space around the text in the tab. Padding.X
    defines the amount of space to the left and right, while Padding.Y defines space
    to the top of the bottom of the tab. The HotTrack property makes the text label
    change colors when the user moves the mouse pointer over it.


    The Appearance property allows three different modes. Normal displays standard
    tabs. Buttons displays a toggle button at the top of the control. FlatButtons
    exhibits a toolbar as well as a toggle. Alignment lets you move the tabs to various
    sides, with Top being the default, and Bottom, Right, and Left aligning tabs bottom,
    right and left.


    When the user clicks a tab header, the control automatically switches to that
    tab. The control notifies you of the click using the TabControl_Click event. Each
    TabPage provides the standard abilities of a container, meaning controls contained
    in the page can use Dock and Anchor to resize within the tab page. For more information
    on resizing controls, see Chapter 2.


    # CREATE A TAB INTERFACE


    ![](img/d6f772854306e15fb6df39b861a7b541_93_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_93_1.png)


    +   1. Create a new Windows Application project or open an existing one.


    +   2. In the Toolbox, click and drag the TabControl to add it to the form.


    +   3. In the Property window, click [...] for the TabPages property.


    +   4. Click Add.


    +   5. Type the name of the tab beside the Text property.


    +   6. Change any other necessary properties.


    +   7. Repeat steps 4 through 6 to add tabs as necessary, clicking OK to accept
    changes when done.


    > Note: To edit a property, see Chapter 2.'
  merge: -1
  img_proc: true
- pgno: 94
  md: "# Extra\n\nBe careful when using the `TabControl` on resizing windows. By default\
    \ the `MultiLine` property is set, which means that if the tabs do not fit on\
    \ the row when a user sizes down the form, they move to two rows, making the client\
    \ space smaller to accommodate the tabs. You can use the properties of the `TabControl`\
    \ to make sure when the tab pages resize, the contents of the control remain visible.\
    \ If you do not plan for resizing, this may cause controls on the client area\
    \ to appear clipped at the bottom. To avoid this problem, set `MultiLine` to `False`.\
    \ In this case, VB .NET adds a scroll arrow to allow the user to see tabs that\
    \ do not fit. You can provide resize settings to the controls on the tab pages.\
    \ See Chapter 2 for more information on using Dock and Anchor to provide automatic\
    \ resizing. You can also add scrollbars to the client area of the tab page. Set\
    \ `AutoScroll = True` to allow scrollbars to appear if the tab area becomes too\
    \ small to fit the controls on the tab page. Keep in mind that scrollbars often\
    \ make using the program more difficult because users cannot see all of the information\
    \ on screen at once.\n\n![](img/d6f772854306e15fb6df39b861a7b541_94_0.png)\n\n\
    ![](img/d6f772854306e15fb6df39b861a7b541_94_1.png)\n\n+   ▪ The tabs appear and\
    \ you can move between them at design time.\n+   \n+   8. Add any necessary controls\
    \ to each tab page.\n+   \n+   9. Press F5 to run your project.\n+   \n+   ▪ The\
    \ `TabControl` allows movement between its tabs."
  merge: -1
  img_proc: true
- pgno: 95
  md: '# PROVIDE ERROR MESSAGES


    You can use the ErrorProvider control to alert a user to a data entry error by
    displaying an unobtrusive small error icon. The ErrorProvider control allows you
    to show an error message related to a control without bringing up a message box
    that stops the user’s flow of information entry. The ErrorProvider provides three
    properties to all of the controls on a form that allow you to monitor the controls
    for errors. The properties the provider adds to controls are Error, IconAlignment,
    and IconPadding. Typically, you use the ErrorProvider with text box controls because
    they provide a free-flow information entry area that can easily contain errors.


    The Error on ErrorProvider property allows you to set an error message to appear
    for the control. Placing a string into this property makes an error icon appear
    beside the control. When the user moves the mouse over the icon, a tool tip pops
    up with the error text specified in the property. In most cases, you do not want
    to set the error at design-time and instead want the error icon to appear dynamically
    when an error occurs.


    The SetError method allows you to set the error message for a control at runtime.
    Its first argument is the control where the error exists, and the second is the
    error text, for example, SetError(TextBox1, "Error Message"). You use this method
    when doing validation on a control.


    Controls on the form provide a Validating event that each control raises after
    the user moves to another control. This event allows you to check the value of
    the control for errors. If you find an error with a selection, set the error text
    using the SetError method. If the user fixes the error, clear the message by calling
    the method with a blank string for the error message.


    # PROVIDE ERROR MESSAGES


    ![](img/d6f772854306e15fb6df39b861a7b541_95_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_95_1.png)


    +   1 Create a new Windows Application project or open an existing one


    +   2 In the Toolbox, double-click the ErrorProvider control.


    +   The control appears in the component tray.


    +   3 Add an input control to the form and another control to move the focus so
    validation occurs.


    +   The example adds a TextBox control and a Button control on the form.


    +   4 Right-click the form and click View Code.


    +   The Code Editor appears.


    +   5 In the class list, select the input control you added.


    +   6 In the event list, select the Validating event.


    +   VB .NET creates the event handler.


    +   7 Type code to check for an input error.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Extra


    You can specify the IconAlignment property the ErrorProvider control adds to each
    control to customize the location of the error icon on the form. The IconPadding
    on ErrorProvider property allows you to set the number of pixels between the control
    and the icon. Remember to be careful of the spacing you set. You should not add
    so much spacing it is hard to distinguish which icon relates to which input control.
    A useful feature of this property is to make all of your error icons line up in
    a column running down the screen beside the controls, even if the controls are
    not all of the same length.


    Some properties are available in the ErrorProvider control itself that allow you
    to control the appearance of the icon that appears beside the input controls.
    The Icon property allows you to change the error icon you display. You can assign
    any icon file to this property. You can also set the BlinkStyle property to manipulate
    the blinking properties of the icon. You can set the property to AlwaysBlink,
    which makes the icon blink until the user corrects the error message, NeverBlink
    to ensure the error icon never blinks, or the default, BlinkIfDifferentError,
    which blinks only if the error message changes.


    ![](img/d6f772854306e15fb6df39b861a7b541_96_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_96_1.png)


    8 To set the error message, type the name of the ErrorProvider control followed
    by .SetError().


    9 Inside the parentheses, specify the input control followed by a comma and the
    error message in quotes.


    10 To clear the error message, follow steps 8 and 9 but enter a blank error message.


    11 Press F5 to run the project.


    An alert icon appears beside the control when validation fails and your text appears
    when a user holds the mouse over it.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# CREATE A CONSOLE APPLICATION


    Console applications provide the most basic Visual Basic .NET program: they display
    textual information in a console. An example of a console window is the Command
    Prompt application. You can create console applications to provide a simple way
    to test and develop code without the additional effort necessary for visual form
    development. The Console object gives all the necessary methods to output information
    to the user and read information from the user, taking the place of forms and
    controls. See Chapter 2 for more information on Windows Forms applications.


    The System.Console object provides the functionality to access the console. Unlike
    a Windows Forms-based application, a console application does not require a class
    and simply loads from a default module with a Sub Main procedure.


    You use the Console Application project template to create a new application.
    Code execution always begins in the Sub Main module, but you can create supplementary
    classes and modules to support the application. Chapter 7 contains more information
    about classes.


    To write a line of text to the console, use the WriteLine method of the Console
    object. For example, WriteLine("Test") writes Test to the console and moves to
    the next line. If you want to output text without moving to the next line, use
    the Write method. Pass a string of text enclosed in quotes or pass a variable
    to either of these methods to output the information. For more information on
    passing parameters to methods, see the section "Pass Information Through a Method."


    To read a single character from the input stream, use the Read method. The Read
    method returns the character value as an Integer. To read in a line of information,
    use the ReadLine method. The ReadLine method returns a String variable. For more
    information on creating a string variable to hold the result, see the section
    "Create a String."


    # CREATE A CONSOLE APPLICATION


    ![](img/d6f772854306e15fb6df39b861a7b541_97_0.png)


    +   1. Click File > New > Project.

    +   2. Click Console Application from the templates list.

    +   3. Type a name for the project.

    +   4. Click OK to create the project.

    +   The New Project dialog box appears.

    +   The project opens a default module and declares a Sub Main procedure.'
  merge: -1
  img_proc: true
