- pgno: 281
  md: '# MONITORING A WINDOWS SERVICE


    You can monitor and manipulate the state of a Windows service from another application.
    For example, you can provide a configuration interface that allows the user to
    configure properties of the service. When the user makes configuration changes,
    you can stop and restart the service to allow configuration changes to go into
    effect.


    The ServiceController component, part of the System.ServiceProcess namespace,
    manipulates running services. You can add this component via the Component section
    of the Toolbox, or you can create an object instance of the class in code. Two
    properties specify the service to use. The MachineName property sets the machine
    on which the service runs. You set it to a period (.) if the service runs on the
    local machine. You set the ServiceName property to the name of the service to
    manipulate.


    The CanPauseAndContinue property returns a value that determines whether the service
    can pause and resume. If this value is True, you can use the Pause method to pause
    the service and the Continue method to resume execution of the service. The CanStop
    property returns a value that determines whether the service can stop after it
    starts. If you set this to True, you can stop the service with the Stop method.
    You can start a service using the Start method.


    The Status property returns the current status of the service. The property returns
    a constant from the ServiceControllerStatus enumeration. If you want your application
    to wait for the service to reach a particular state, use the WaitForStatus method.
    Pass a constant from the ServiceControllerStatus enumeration as the first parameter.
    Optionally, you can pass a TimeSpan object as the second parameter if you want
    the wait to time out.


    # MONITORING A WINDOWS SERVICE


    ![](img/d6f772854306e15fb6df39b861a7b541_281_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_281_1.png)


    +   1. Create a new Windows Application project.


    +   2. Click the Components section of the Toolbox and double-click the ServiceController
    component.


    +   3. In the Properties window, type the computer name on which the service runs
    in the MachineName property.


    +   4. Type the name of the service into the ServiceName property.


    +   5. In the method of the form to manipulate the service, type the name of the
    component and follow it with .Stop() to stop the service.


    +   The example adds three buttons, using Button1 to stop the service, Button2
    to start it, and Button3 to check the status.'
  merge: -1
