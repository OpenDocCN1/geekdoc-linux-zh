- pgno: 321
  md: '# USING THE REGISTRY


    The Registry provides a universally accessible data storage area for a computer.
    You can write information to the Registry to remember user preferences and settings.
    Specific to Win32 machines, the Registry class and supplementary classes exist
    under the Microsoft.Win32 namespace. To learn how to import a namespace, see Chapter
    8.


    The Registry class provides instances of the RegistryKey object representing each
    of the eight base keys in the registry. The CurrentUser property returns a RegistryKey
    representing information stored for the current login. The LocalMachine property
    returns a RegistryKey object representing the settings for the local machine,
    regardless of user. You store software settings for your application in the SOFTWARE
    key inside the LocalMachine or CurrentUser key, depending on if the application
    stores separate information for various users.


    Use the OpenSubKey method to open a subkey. Pass the path of the subkey to open
    the first parameter. You can load


    a deeper sublevel by separating the subkeys with back slashes. Pass True as the
    second parameter to enable write support. The method returns a new RegistryKey
    object representing the subkey. To create a subkey, pass the name to the CreateSubKey
    method of a RegistryKey object and the method adds the key under the existing
    key.


    You retrieve the value associated with a particular name using the GetValue method.
    Pass a string representing the name of a value in the key and the method returns
    the data the value holds.


    You can add and change values using the SetValue keyword. Pass the name as a string
    for the first parameter, and a value as the second parameter. For the value, you
    can pass a string or an integer number.


    After you make changes to the registry key, invoke the Flush method of a RegistryKey
    with no parameters to save the changes.


    # USING THE REGISTRY


    ![](img/d6f772854306e15fb6df39b861a7b541_321_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_321_1.png)


    +   1 Create a new Windows Application or open an existing one.


    +   2 Import the Microsoft.Win32 namespace.


    +   3 Type Dim reg As RegistryKey = Registry.CurrentUser.OpenSubKey (), replacing
    RegistryKey with the variable, CurrentUser with the base key, and placing the
    name of the subkey followed by , True in parentheses.


    +   4 Declare a new RegistryKey variable.


    +   5 To assign a new key, type = followed by the variable you create in step
    3.


    +   6 Type .CreateSubKey and the name of the subkey to create in parentheses.


    +   7 Type the variable name for the key, then .SetValue, followed by the name
    for the value and the value in parentheses.'
  merge: -1
  img_proc: true
- pgno: 322
  md: "# Apply It\n\nYou can use properties of a RegistryKey object to list the available\
    \ subkeys and values associated with the key. The SubKeyCount property returns\
    \ the number of subkeys the particular key contains and the ValueCount property\
    \ returns the number of values associated with the key. Use the GetSubKeyNames\
    \ method to return an array of strings representing the names of the available\
    \ subkeys. To get the values associated with a key, use the GetValueNames method\
    \ to return an array of strings representing the available values.\n\n# TYPE THIS:\n\
    \n```\nDim regKey As RegistryKey = Registry.LocalMachine.OpenSubKey(\"SOFTWARE\"\
    )\nDim keyName As String, valueName As String\n\nConsole.WriteLine(\"Sub Keys:\"\
    )\nFor Each keyName In regKey.GetSubKeyNames()\n    Console.Write(keyName & \"\
    , \")\nNext\n\nConsole.WriteLine(ControlChars.CrLf & \"Values:\")\nFor Each valueName\
    \ In regKey.GetValueNames()\n    Console.Write(valueName & \", \")\nNext\nConsole.ReadLine()\n\
    ```\n\n# RESULT:\n\nSub Keys:\nClasses, Clients,\nMicrosoft, ODBC,\nProgram Groups,\
    \ Secure,\nWindows 3.1 Migration\nStatus,\n\nValues:\nDescription,\n\n![](img/d6f772854306e15fb6df39b861a7b541_322_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_322_1.png)\n\n8 To save changes, type\
    \ the registry key followed by .Flush().\n\n9 To read a key, type the variable\
    \ name of the key to access, then .GetValue, and then the name of the value to\
    \ retrieve in parentheses.\n\nThe application adds and retrieves values from the\
    \ registry.\n\n10 Press F5 to run your project."
  merge: -1
  img_proc: true
- pgno: 323
  md: '# PROVIDE ACCESS TO DISABLED USERS


    Accessibility aids make it easier for the disabled to use computers. For example,
    blind people can use screen readers to verbalize the information shown on screen,
    and people who cannot use a keyboard and mouse can rely on voice input utilities.
    You can use properties provided in Windows Forms controls to aid disabled users
    with your application.


    To enable users with disabilities to use your application effectively, you need
    to consider some guidelines that target problem areas an individual may encounter.
    Always provide a flexible user interface that accommodates the user''s needs and
    preferences. Use color to enhance and emphasize information shown by other means.
    Do not use color as the only means of using a part of your application. Keyboard
    access to all parts of your application enables all users, especially disabled
    users, to use your application more effectively. The size of text and graphics
    affects both accessibility and usability. You should enable users to size objects
    on the screen and follow system metrics for preset user preferences.


    All Windows Forms controls inherit an AccessibleObject that stores information
    to use with software- and hardware-based accessibility aids. The AccessibleDescription
    property of the object appears in the Properties window and specifies a description
    for the control. For example, an Exit button may contain the description "A button
    with the text Exit." The AccessibleName property reports a name for the control
    to accessibility aids. The AccessibleRole property reports the role of the control.
    In most cases, the designer sets this property correctly. For example, the AccessibilityRole
    of a Button control is AccessibilityRole.Button. In some cases, you may want to
    change this property. For example, if you use a PictureBox control to draw a chart,
    you can set the role to AccessibilityRole.Chart.


    # PROVIDE ACCESS TO DISABLED USERS


    ![](img/d6f772854306e15fb6df39b861a7b541_323_0.png)


    +   1. Open an existing project.

    +   2. Click a control on a Windows Form.

    +   3. Click the AccessibleDescription property in the Properties window and type
    a description for the particular control.

    +   4. Click AccessibleName and type in a name for the control.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Extra


    You can use the following list as a partial reference for the accessibility roles
    available for controls in your application. You can select each of these constants
    from the enumeration in the Properties window.


    | CONSTANT | DESCRIPTION |

    |---|---|

    | Alert | An alert or condition for a user. You only use this role for objects
    that have no association with another user interface element, like a message box,
    graphic, text, or sound. |

    | ButtonDropDown | A button that drops down a list of items. |

    | ButtonDropDownGrid | A button that drops down a grid. |

    | ButtonMenu | A button that drops down a menu. |

    | Character | A cartoon-like graphic object, such as Microsoft Office Assistant,
    which displays help to users of an application. |

    | Chart | A graphical image used to represent data. |

    | Clock | A control that displays the time. |

    | Diagram | A graphical image used to diagram data. |

    | Dial | A dial or knob, or a read-only visual object like a speedometer. |

    | Equation | A mathematical equation. |

    | Indicator | An indicator, such as a pointer graphic, that points to the current
    item. |

    | Link | A link, which acts as a connection between a source document and a destination
    document. You can use this for graphics or labels that act like a button. |


    ![](img/d6f772854306e15fb6df39b861a7b541_324_0.png)


    Optionally, click the AccessibleRole and select a new role.


    5 Repeat for all of the controls on the form.


    6 Press F5 to run your project.


    Your application runs and appears as normal, but accessibility helper applications
    can use the information to aid disabled users.'
  merge: -1
