- pgno: 55
  md: '# ADD A NEW FORM


    Additional forms are necessary to create pop-up windows, dialog boxes, and a variety
    of other functions in an application. You can create additional forms for your
    project by using the Add Form dialog box.


    A VB .NET project consists of multiple files, including classes, forms, and modules.
    A project can work with an unlimited amount of each of these. You can use multiple
    forms to effectively break your program into more manageable sections for the
    user to navigate and understand. Include a single concept on a single form. For
    example, if your program has four core functions, do not attempt to represent
    them all on one form; instead make four forms.


    In most cases, you use the standard Form1 that VB .NET creates with the project
    as the main application window. You may need to add auxiliary windows. For example,


    Microsoft Word has one main window and dozens of auxiliary windows to open and
    save files, modify options, and configure formatting. VB .NET represents each
    window in an application with a unique form.


    Windows that provide options or allow opening and closing of files are called
    dialog boxes. You can create these windows in a VB .NET application. To create
    a dialog box see the section "Create a Dialog Box."


    Another type of window that you can represent in VB .NET using a form is a toolbox.
    Many programs like Adobe Photoshop make use of floating windows to provide a set
    of tools, which a user can access in the main application window. You can create
    floating toolbox windows using owned forms. See the section "Add an Owned Form"
    for more information on creating your own owned form.


    # ADD A NEW FORM


    ![](img/d6f772854306e15fb6df39b861a7b541_55_0.png)


    +   1 In a Windows Application project, click Project > Add Windows Form to load
    the Add New Item dialog.


    +   2 Type a name for the new form.


    +   3 Press Open.


    +   4 Right-click the Project name in the Solution Explorer.


    +   5 Click Properties.


    Note: To show the Solution Explorer, click the View menu and click Solution Explorer'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Extra


    Although you can have any number of forms in a single project, only the default
    form appears automatically when you run the project. Different from previous versions
    of Visual Basic, you must create an instance variable of a form before showing
    it in VB.NET. Because the form that the Designer creates is nothing more than
    a class, you need to create an instance of the class. See Chapter 5 for more on
    creating classes.


    # Example:


    ```

    Dim frm As New Form1

    frm.Show()

    ```


    You can alter the size of a form simply by selecting the form in the Form Designer
    and dragging the handles that appear. However, you cannot visually specify where
    you display the form.


    By default, the StartPosition of the form is WindowsDefaultLocation. You can have
    the form start in the center of the screen by setting this property to CenterScreen.
    You can also place it precisely by setting StartPosition to Manual and filling
    the Location property''s Point. A Point is comprised of an x, y location.


    You limit the size the form can resize by using the MinimumSize and MaximumSize
    properties. Fill in the Point with a width and height and the user cannot resize
    the window out of these bounds, even though you limit maximizing to the MaximumSize
    property.


    ![](img/d6f772854306e15fb6df39b861a7b541_56_0.png)


    6 Click in the Startup object box and click Form2.


    7 Click OK.


    8 Press F5 to run your project.


    The new form displays and the original form does not.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# CREATE A DIALOG BOX


    You can use dialog boxes to prompt the user for input. Dialog boxes do not disappear
    until the user provides the appropriate information or cancels out of the box.


    A dialog box is a modal form because it restricts access to its parent form until
    the user closes the dialog box. Examples of dialog boxes include File Open, File
    Save, Print, and others.


    To create a dialog box, you create a new form and provide a method to accept or
    cancel changes made. For more information on creating a form, see the section
    “Add a New Form.” A dialog box should not use the entire screen, have menus, or
    include Minimize or Maximize buttons.


    You make the form nonresizable by changing the FormBorderStyle property to FixedDialog.
    If you want to make your dialog box resizable, like the File Open/Save dialog
    boxes, leave the FormBorderStyle property alone, and set the MinimumSize and MaximumSize
    properties. Set MaximizeBox and MinimizeBox to False to remove the Maximize and
    Minimize buttons, respectively. Remove the form from the Windows Taskbar by changing
    ShowInTaskBar to False.


    The AcceptButton and CancelButton properties allow you to select Button controls
    to act as default OK and Cancel buttons. Pressing Enter in the dialog box functions
    as the AcceptButton and Esc functions as the CancelButton.


    To enable the dialog box’s action buttons, set the DialogResult property on each
    Button to one of the available settings: Abort, Cancel, Ignore, No, None, OK,
    Retry, and Yes. The dialog box closes with the value of this property passed back
    to the parent. You can also set this property manually through code on the form
    at run-time, in which case, setting the property also makes the dialog box close
    immediately and pass back the DialogResult.


    A parent form opens a dialog box by calling the dialog box’s ShowDialog method.
    The form appears as a modal dialog box, and the ShowDialog method returns access
    to the parent form when a user closes the dialog box.


    ![](img/d6f772854306e15fb6df39b861a7b541_57_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_57_1.png)


    +   1. Add a new form to a new or existing project.

    +   2. Add controls to provide appropriate user input.


    +   3. Add two Button controls.

    +   4. Set the first button’s DialogResult to OK.

    +   5. Set the second button’s DialogResult to Cancel.

    +   6. Click the form to edit its properties.


    > Note: See Chapter 3 to work with the button control.


    +   7. Change MinimizeBox, MaximizeBox, and ShowInTaskBar to False.

    +   8. Change AcceptButton to the first button and CancelButton to the second
    button.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "# Extra\n\nTo access information entered on the form, you may want to add properties\
    \ to the dialog box to enable the parent form to access information, or you can\
    \ make the parent form access information in the dialog box's controls directly.\
    \ For more information on adding properties, see Chapter 7.\n\nYou can use property\
    \ pages to display information without requiring immediate action from the user.\
    \ By creating the property-page design, Microsoft chose to break many of the rules\
    \ associated with dialog boxes. Property pages are non-modal, meaning they do\
    \ make the user accept or cancel changes before continuing with the use of the\
    \ application. Property pages often give information to the user on an object\
    \ in the program. If you want to create a property-page dialog box, the standard\
    \ convention is to use OK, Cancel, and Apply buttons. Also, you should show the\
    \ property page using the Show method as opposed to the ShowDialog method to allow\
    \ the user to work with the application when the property page is still open.\n\
    \n# Example:\n\n```\nSub OpenDialog()\n    Dim myDialog As New DialogForm2()\n\
    \    Dim result As DialogResult\n\n    result = myDialog.ShowDialog(Me)\n    If\
    \ result = DialogResult.OK Then\n        Dim filename As String\n        filename\
    \ = myDialog.TextBox1.Text\n        ' use the file name the user entered in the\
    \ dialog.\n    End If\nEnd Sub\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_58_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_58_1.png)\n\n9 Open the event handler\
    \ or method where you want the dialog to appear.\nIn the example, code is being\
    \ added to Button1_Click.\nNote: To add an event handler, see the section \"Write\
    \ Event Code\".\n\n10 Type the code necessary to create an instance of the form.\n\
    11 Type the name of the dialog variable followed by .ShowDialog(Me).\n12 Press\
    \ F5 to run the project.\n\nThe main form appears.\n\nCreating the necessary event\
    \ causes your dialog box to appear, which you can close by pressing either of\
    \ the two buttons."
  merge: -1
  img_proc: true
- pgno: 59
  md: '# USING MESSAGE BOXES


    You can use a Message Box as a simple dialog box to present a message to a user.
    Message boxes provide simple interfaces to easily display information that does
    not require a custom designed form. Message Boxes require no visual setup and
    are invoked through the MessageBox class''s Show method.


    A simple Message Box presents a textual display of information with an OK button
    at the bottom. Configurations include adding Cancel buttons, using a Yes, No pair,
    an Abort, Retry, Ignore combination, and others. You cannot configure message
    boxes outside of the available button combinations. Do not use a Message Box for
    programming simplicity when the button combinations do not make sense for the
    prompt you display. For example, do not display "Would you like to save changes?"
    and then use OK and Cancel as button prompts: Yes and No make much more sense.


    You can create a Message Box by using the code structure MessageBox.Show(Text,
    Caption, MessageBoxButtons, MessageBoxIcon, MessageBoxOptions). The MessageBoxButtons
    constants include AbortRetryIgnore, OK, OKCancel, RetryCancel, YesNo, and YesNoCancel.
    To specify a constant from an enumerated type, use the type name and the constant,
    such as MessageBoxButtons.OK. The MessageBoxIcon constants include Asterisk, Error,
    Exclamation, Hand, Information, None, Question, Stop, and Warning. These icons
    are self-explanatory, and you use them in many common applications. Note that
    if the user has sound files set for Error, Question, and the other settings, these
    sounds play automatically.


    RetryCancel, YesNo, and YesNoCancel. To specify a constant from an enumerated
    type, use the type name and the constant, such as MessageBoxButtons.OK. The MessageBoxIcon
    constants include Asterisk, Error, Exclamation, Hand, Information, None, Question,
    Stop, and Warning. These icons are self-explanatory, and you use them in many
    common applications. Note that if the user has sound files set for Error, Question,
    and the other settings, these sounds play automatically.


    The MessageBoxOptions enumeration lets you specify the default button. If the
    user presses Enter, the dialog box closes with the specified default button as
    the result. The enumeration includes only three constants, Button1, Button2, and
    Button3. If you want to ask a question, where the most likely answer is no, use
    MessageBoxButtons.YesNo, and MessageBoxOptions.Button2. Buttons are numbered in
    the order they are named in the button constant.


    You can also display a message box by calling the simpler MsgBox command. Pass
    the message to display as the only parameter.


    # USING MESSAGE BOXES


    ![](img/d6f772854306e15fb6df39b861a7b541_59_0.png)


    +   1. Create a new project or open an existing project.

    +   2. Open the method or event in which you want to display the message box.

    +   3. Click an empty code line.

    +   4. Type System.Windows.Forms.MessageBox.Show(.

    +   5. Type the text you want to display in quotes or a variable of type string.

    +   6. Type a comma, and type the title of the message box.

    +   7. Type another comma.

    +   An IntelliSense box appears and shows the various button options.'
  merge: -1
  img_proc: true
- pgno: 60
  md: "# Apply It\n\nYou can use a message box to ask the user a question and then\
    \ respond to the user. The Show method returns a value corresponding to a DialogResult\
    \ value. Each of the Message Box buttons have a corresponding DialogResult type\
    \ you can use to determine which button the user presses: OK, Cancel, Yes, No,\
    \ Retry, Ignore, Abort. To test the return value of the message box, use DialogResult.OK\
    \ or one of the other constants. An If test can easily check for the user’s response.\
    \ For more information on using the If statement, see Chapter 4.\n\n# TYPE THIS:\n\
    \n```\nDim result As DialogResult\nresult = MessageBox.Show(\"Do you like strawberry\
    \ ice cream\", \"Ice cream\", MessageBoxButtons.YesNoCancel, MessageBoxIcon.Question)\n\
    If result = DialogResult.Yes Then\n    MessageBox.Show(\"Me too!!!\")\nElse\n\
    \    If result = DialogResult.Cancel Then\n        MessageBox.Show(\"You are no\
    \ fun.\")\n    Else\n        result = MessageBox.Show(\"Too bad. How about chocolate\
    \ ice cream?\", \"Ice cream\", MessageBoxButtons.YesNoCancel, MessageBoxIcon.Question)\n\
    \        If result = DialogResult.No Then\n            MessageBox.Show(\"What\
    \ do you like???\")\n        End If\n    End If\nEnd If\n```\n\n# RESULT:\n\n\
    Do you like strawberry ice cream?\nMe too!!\n\n![](img/d6f772854306e15fb6df39b861a7b541_60_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_60_1.png)\n\n8 Type or click one of\
    \ the button options.\n\n9 Type another comma, and repeat steps 7 and 8 for the\
    \ icon.\n\n10 Type another comma, select the default button, and type a close\
    \ parenthesis.\n\n11 Press F5 to run your project.\n\n12 Invoke the necessary\
    \ code to show your message box.\n\nThe message box appears and waits for the\
    \ user to press a button."
  merge: -1
  img_proc: true
- pgno: 61
  md: '# ADD AN OWNED FORM


    You can use owned forms to create floating windows that can accompany a parent
    window. A single parent form can own any number of forms. Use owned forms to save
    space on the main program window while still allowing access to functionality.
    Owned forms also allow the user to move the floating windows around to customize
    their own environment.


    You do not need to have owned forms inside a parent''s boundaries, but an owned
    form always floats above its parent. If a user minimizes the parent form, then
    the owned forms disappears, and reappears when the user restores the parent. A
    good example of owned forms is the Visual Basic Development Studio itself. However,
    the docking abilities provided in the Development Studio are not part of the standard
    abilities provided by owned forms.


    Owned forms are no different than any standard form. Creating a toolbox-style
    floating window requires a few settings to make it appear like other applications.
    Set the FormBorderStyle equal to FixedToolWindow or SizableToolWindow to reduce
    the space the title bar wastes. Set MaximizeBox and MinimizeBox to False, and
    ShowInTaskBar to False so it does not appear to be a stand-alone application window.


    To set up a form as an owned form, you can use two methods, depending on the easiest
    place for your application. You can set the child form to be owned; for example
    if FormToolbar needs to float above FormMain, set FormToolbar.Owner = FormMain.
    Or the parent form can take ownership of the child, for example FormMain.AddOwnedForm(FormToolbar).
    You use the second method most often because in most cases the main application
    form creates the owned form and not the other way around.


    Owned forms are no different than any standard form. Creating a toolbox-style
    floating window requires a few


    # ADD AN OWNED FORM


    ![](img/d6f772854306e15fb6df39b861a7b541_61_0.png)


    1 Create a Windows Application project or open an existing one.


    2 Add a new form the project.


    Note: See the section "Add a New Form" to create a new form.


    3 Size the new form appropriately.


    4 For the new form, click the FormBorderStyle property in the Properties window
    and select SizableToolWindow.


    5 Double-click the MaximizeBox property to change it to False.


    6 Change MinimizeBox to False.


    7 Change ShowInTaskbar to False.


    8 Load the original form and double-click it to enter the code editor.'
  merge: -1
  img_proc: true
- pgno: 62
  md: "# GETTING STARTED WITH WINDOWS FORMS\n\n# Apply It\n\nOften, you must make\
    \ components that you place on an owned form perform an action on their parent\
    \ window. For example, you need to make a button on the owned form that says Open\
    \ do the same thing as a File, Open menu on the parent window. You must declare\
    \ the code in the main window that provides the functionality — in the example,\
    \ the code that provides the File Open dialog box, and opens the file — in its\
    \ own subroutine. You make this routine Public so you can access it outside of\
    \ the form. See Chapter 4 to learn more about methods.\n\n# TYPE THIS:\n\n```\n\
    Public Class FormToolWindow\n\n    Private Sub ButtonFileOpen_Click(...)\n   \
    \     Dim frm As FormMain = Me.Owner\n        Frm.FileOpenRoutine()\n    End Sub\n\
    \nEnd Class\n\nPublic Class FormMain\n\n    Public Sub FileOpenRoutine()\n   \
    \ End Sub\n\n    Private Sub MenuFileOpen_Click(...)\n        FileOpenRoutine()\n\
    \    End Sub\nEnd Class\n```\n\n# RESULTS:\n\nThe Toolbox provides the same open\
    \ function as the File Open menu item.\n\n![](img/d6f772854306e15fb6df39b861a7b541_62_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_62_1.png)\n\n8 The Code Editor for\
    \ the main form opens.\n\n9 In the form load event, declare an instance of the\
    \ owned form.\n\n10 Type Me.AddOwnedForm( followed by the variable name of the\
    \ owned form and a close parenthesis.\n\n11 Type the variable name of the owned\
    \ form followed by .Show().\n\n12 Press F5 to run the project.\n\nThe owned form\
    \ floats above its parent, disappears when a user minimizes the parent, and appears\
    \ again when the user restores the parent."
  merge: -1
  img_proc: true
- pgno: 63
  md: '# ORDER TAB KEY MOVEMENT


    You use the Tab key as a standard method to move around an application without
    the mouse. By default, Windows Forms assigns the movement in the order you added
    the controls to the form. Not many developers lay out the form perfectly the first
    time, so the TabIndex property allows you to edit the order of controls.


    Users expect to begin typing at the top left side of the form. Normally, tabbing
    moves from either left to right or top to bottom. While you may find resetting
    all the tab indexes of all the controls tedious work, the Microsoft Windows Application
    guideline require it, and doing so makes an application more professional. Setting
    the tab order also makes your application more accessible for people performing
    data entry and for anyone accustomed to moving around their computer with the
    keyboard instead of forcing users to click each control before entering or changing
    data. Database and other applications that require


    a significant quantity of data processing become significantly easier to use with
    an intelligent tab-order layout.


    The simplest way to set the tab order is to completely design your form, moving
    around controls until you see a visual order become apparent. At this point, start
    at the top left corner of your application, and set the control''s TabIndex property
    to zero. Then depending on what makes sense for your application, move to the
    next control in the proper direction and assign it TabIndex = 1. Continue until
    every control has a sensible tab order.


    You can also remove a control from the tab order by setting the TabStop property
    of the control to False. The property is useful for labels and other controls
    that do not directly pertain to data input. By default, TabStop is True for every
    control on the form.


    # ORDER TAB KEY MOVEMENT


    ![](img/d6f772854306e15fb6df39b861a7b541_63_0.png)


    +   1 Create a new Windows Application project or open an existing one.


    +   2 Add a control to the form.


    +   3 Continue adding controls.


    +   4 Position the controls into columns or rows.


    +   5 Click the top, left component.


    +   6 In the Properties window, type 0 (zero) into the TabIndex property.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Extra


    You can use labels, frames, groups, and other visual cue components to enhance
    tab order just like input controls. For example, a label to the left of a control
    has Text equal to Name: and a text box is located directly to the right of it.
    You must add an access key to each label, so the label has the text &Name:. Then
    the user can press Alt+N. A label focuses on the control with the next tab index
    when you press the access key. It is important to set the TabOrder of the label,
    then the corresponding input control.


    Both GroupBox and Panel contain other controls. You must set a container control''s
    TabIndex to the number before the top-left control in the container. The title
    of a GroupBox acts like a label and passes focus to the first control inside the
    container. When numbering controls inside of a container, follow the same system
    as numbering the form. Start at the top-left of the container, and work your way
    through the entire container moving either right or down. You should not make
    the order pass out of the container and back into it later, as this may confuse
    the user.


    ![](img/d6f772854306e15fb6df39b861a7b541_64_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_64_1.png)


    +   7 Click the next control (either to the right or below).

    +   8 Set the TabIndex to the next highest index.


    +   9 Repeat steps 7 and 8 until you set the TabIndex for all of the controls.

    +   10 Press F5 to run the project.


    +   11 Experiment using the Tab key to navigate your form.


    The controls follow the order given with the TabOrder property.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# USING BUTTONS\n\nYou can use buttons to provide simple user input in your\
    \ application. A button represents a single action verb, such as accept, cancel,\
    \ or go. This simplicity makes it effective in that most users understand the\
    \ purpose of buttons.\n\nYou primarily use buttons on dialog boxes, and not normally\
    \ on the main application screen. Instead of individual buttons, you may want\
    \ to use a toolbar on the main window. See the section “Create a Toolbar” topic\
    \ later in the chapter for more information.\n\nThe Button control has a variety\
    \ of properties to change its appearance. The FlatStyle property allows you to\
    \ create flat-style buttons. Flat buttons change color when a user moves over\
    \ or clicks them, but have no three-dimensional effect. The Popup style makes\
    \ the button appear flat. It takes on a raised three-dimensional appearance when\
    \ the user moves the mouse over it, and depresses when a user clicks it. The Standard\
    \ style appears raised in all cases, and depressed when the user presses the mouse\
    \ button.\n\nYou can load a background image into the button by setting the BackgroundImage\
    \ property to a supported format. You place images in the foreground with the\
    \ Image property. You can also load images from ImageList controls with the use\
    \ of two properties, ImageList and ImageIndex. See the section “Work with ImageLists”\
    \ for more information.\n\nYou use the ImageAlign to set the image alignment to\
    \ the middle, edge, or corner of the button. You use the TextAlign property to\
    \ align the Text in the same way.\n\nTo respond to the user pressing the button,\
    \ you can create an event handler that responds to the Click event. For more information\
    \ on creating event handlers, see the section “Add an Event.”\n\n# USING BUTTONS\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_65_0.png)\n\n+   1. Create a new Windows\
    \ Application project or add an existing one.\n+   2. In the Toolbox, click and\
    \ drag the Button control to add it to the form.\n+   3. In the Properties window,\
    \ set the Text property to change the button caption.\n+   4. Change any necessary\
    \ properties.\n+   5. This example sets the FlatStyle to Popup.\n\n> Note: See\
    \ Chapter 2 to learn about creating Windows Application projects, and adding a\
    \ control to a form.\n> \n> Note: See Chapter 2 to set a property or create an\
    \ event handler to respond to the Buttons Click event."
  merge: -1
  img_proc: true
- pgno: 66
  md: '# USING LABEL CONTROLS


    Labels provide information on the form to guide the user. You add a label control
    to provide an explanation of information the user needs to supply on the form
    or to explain information available on the form. A form often presents the user
    with various controls that contain data or lists of information, or blank controls
    waiting for user input, which make the labels necessary to describe the nature
    of the controls.


    Try to make labels short, but descriptive. Most labels have a colon after the
    text to signify the label describes the control to the right or bottom of it.
    Refrain from placing labels to the right or below the control they describe.


    Use the Text property to modify the text that label displays, and TextAlign allows
    you to align the text to the middle, side, or corner of the label. The AutoSize
    property, when set to True, automatically stretches the label''s width to fit
    the text you place on it. This prevents the text from wrapping at the edge of
    the control.


    The LinkLabel control expands on the capability of the Label control by providing
    an appearance of a hyperlink. By setting the LinkVisited property to True, you
    can cause the link to appear in the visited color. Just like a Web page, you can
    set this property and cause the link to appear visited after the user clicks the
    link.


    For the LinkLabel control, the LinkArea property specifies a range of text you
    want to use as the hyperlink. By default, the entire text of the control is used.
    Set the Start property to the character position to start the hyperlink, and the
    Length, the number of characters that you want as part of the link. When you set
    the Start property, remember the first text position is zero. The control fires
    the LinkClicked event if the user clicks on the area of the control that is part
    of the link.


    # USING LABEL CONTROLS


    ![](img/d6f772854306e15fb6df39b861a7b541_66_0.png)


    +   1 Create a new Windows Application project or open an existing one.


    +   2 Click the Label or LinkLabel control in the Toolbox and add the control
    to the form.


    +   3 In the Properties window, set the Text property of the control.


    +   4 Press F5 to run your project.


    The Label control provides textual information on the form.


    +   For the LinkLabel control, you can handle the user clicking the link in the
    LinkClicked event.


    Note: See Chapter 2 to add an event handler.'
  merge: -1
  img_proc: true
