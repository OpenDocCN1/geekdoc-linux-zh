- pgno: 295
  md: '# CREATE A WINDOWS FORMS CONTROL


    You can create a Windows Forms user control into which you can add a set of controls
    for reuse throughout a project. Alternately, you can place the control in a library
    to use in multiple projects. The UserControl object provides the ability to design
    your own controls.


    When you add a user control to a project, the Windows Control Designer, similar
    to the Windows Forms Designer, gives you a designer space without a title bar.
    You can use the Toolbox to add any number of controls to the user control. For
    more information on designing a user control by combining standard Windows form
    controls, see the section "Using Standard Controls."


    You can also use the UserControl object''s events that the control inherits from
    to paint onto the service and create your own user control that does not rely
    on combining other controls. This capability lets you create any sort of control
    by providing a custom painting method and your own event model. For more information
    on creating a control without using standard controls, see the section "Create
    a Control from Scratch."


    To name a control that you create, change the Name property of the UserControl
    object. The Name property modifies the class name, so this name functions as the
    default name of the control that displays in the Toolbox when you add the user
    control to a form.


    If you want to use a control, or a set of controls, in multiple projects, you
    can create a Windows Control Library project to hold the controls. When you create
    this project, VB .NET builds a .NET-compliant DLL that you can reference in other
    projects. To create a Windows Control Library project, you select the template
    from the Add Project dialog box. The name you give the project functions as the
    name of the assembly for referencing. The template provides one UserControl automatically,
    but you can add any number of controls to the project.


    # CREATE A WINDOWS FORMS CONTROL


    ![](img/d6f772854306e15fb6df39b861a7b541_295_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_295_1.png)


    +   1 Open a Control Library or Windows Application project.

    +   To create a Control Library project, select the Windows Control Library template
    when you create a project.


    +   2 If you are using a Windows Application project, click Project → Add User
    Control.

    +   The Control Library project already contains a UserControl you can use.


    +   3 Type a name for the new user control.

    +   The Add New Item dialog box opens.


    +   4 Click Open.'
  merge: -1
  img_proc: true
- pgno: 296
  md: "# Extra\n\nThe UserControl also contains a number of default properties it\
    \ inherits from the ContainerControl class, which is the class that lets controls\
    \ contain other controls inside of it. The ContainerControl inherits from ScrollableControl,\
    \ which inherits from Control to provides the basic functions of all parts of\
    \ the Windows Forms hierarchy. Properties such as BackColor, ForeColor, Tag, Enabled,\
    \ and AutoScroll automatically apply to your user control through the various\
    \ class that the UserControl inherits from. For more information on how to handle\
    \ and override these built-in properties, see the section “Handle Default Properties.”\n\
    \nUnlike Visual Basic, you cannot create a UserControl that the user utilizes\
    \ as a container. When developing the UserControl, you can add any necessary properties.\
    \ The user cannot add controls to the UserControl, so you cannot replicate the\
    \ function of a GroupBox or Panel control. You may want to create your own versions\
    \ of these container controls directly instead of building a UserControl. To inherit\
    \ from existing controls, search Visual Basic help by typing Inherit from existing\
    \ Windows Forms Controls.\n\n![](img/d6f772854306e15fb6df39b861a7b541_296_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_296_1.png)\n\n+   5. The visual designer\
    \ for the new control appears.\n+   \n+   6. Add any necessary controls to the\
    \ visual designer.\n\nNote: See the section “Using Standard Controls” to add controls\
    \ to the UserControl.\n\n+   6. In the Code Editor, add necessary members to the\
    \ control.\n\nNote: See the section “Add a Member” to add class members to the\
    \ control.\n\n+   7. Click Build ↔ Build to make the control or library usable.\n\
    +   \n+   8. If the control exists in a control project, you can now reference\
    \ the library. If you created the control in a Windows Application, go to a form\
    \ and add it to the form.\n\nNote: To reference a Control Library project, see\
    \ the section “Reference a Library.”"
