  md: '# Apply It


    If you name a member variable the same thing as a local variable, you can still
    access the member-level variable by specifying the Me in front of the variable
    separated with a period. You can run the following example in a Console Application
    project.


    # TYPE THIS:


    ```

    Class Class1

    Public Variable As String = "Module Level variable"

    Public Sub Method1()

    Dim Variable As String = "Method1 variable"

    Console.WriteLine(Variable)

    Console.WriteLine(Me.Variable)

    End Sub

    End Class

    Module Module1

    Sub Main

    Dim varTest As New Class1()

    varTest.Method1()

    Console.ReadLine()

    End Sub

    End Module

    ```


    # RESULT:


    Method1 Variable

    Module Level variable


    ![](img/d6f772854306e15fb6df39b861a7b541_186_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_186_1.png)


    +   4 To assign a value to a property, type myObject.Property1 = "Value", replacing
    myObject with the object variable, Property1 with the property name, and "Value"
    with an appropriate value or variable to assign.


    +   5 To respond to an event, select your object variable.


    +   6 In the event list, click an event to handle.


