- pgno: 315
  md: '# DEBUG AN APPLICATION


    The process of debugging an application involves solving problems that cause the
    application not to compile, or operate properly when it runs. You can use the
    debugging abilities of the Development Studio to aid in the correction of these
    problems.


    The term design-time error describes an error that causes the application not
    to compile. Normally, design-time errors occur because you mismatch parentheses
    or spell a method improperly. You can correct a design-time error easily by satisfying
    the criteria that the error message explains. For example, a common error message
    may say that you have not defined a particular. For this message, you check to
    see if you specify the namespace for the object, or import the namespace as necessary.
    Another common error involves an unexpected end of statement. You correct this
    error by checking for a missing comma, making sure you enclose strings with quotes
    properly, and ensuring that underscores split lines correctly. For more information
    on building projects and handling design-time errors, see Chapter 1.


    Runtime errors can take much longer to correct. A runtime error includes any error
    that results from logic or design error during programming, and results in a program
    that builds and runs, but does not function as expected. A runtime error can occur
    in two different ways. An actual application error that occurs while your program
    runs is called an exception. In this case, the Development Environment breaks
    your program and enables you to view the line of code that causes the exception.
    The other type of error is when your program runs with no errors, but it does
    not function correctly. When your code seemingly looks correct, you need to look
    deeper into the execution of your program. For more information on stepping through
    your application one line at a time and using watch variables, see the section
    “Monitor Program Execution.”


    # DEBUG AN APPLICATION


    ![](img/d6f772854306e15fb6df39b861a7b541_315_0.png)


    # CORRECTING DESIGN-TIME ERRORS


    +   1. Build the project.

    +   2. See Chapter 1 to build a project.


    +   1. The Task List appears with a list of build errors.

    +   2. Double-click an error.


    +   1. The Development Environment appears at the specified line of code.

    +   2. Correct the error.


    +   4. Build the project again.

    +   5. Run your project by pressing F5.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Extra


    When an error occurs, the .NET Framework objects use exceptions to make the error
    message available for handling or debugging. For more information on exceptions
    and debugging runtime errors, see the section "Monitor Program Execution." You
    can customize how the debugger manages exceptions. To do so, click the Debug menu
    and click Exceptions. A dialog appears that lets you modify the default settings.
    You can have the debugger break the program immediately when the object throws
    the exception, or have it continue and allow the program to handle the error.
    You can also make the environment break if your application does not handle the
    error, or allow the program to continue executing. By default, exceptions continue
    when an object throws them but break into the debugger if your application does
    not handle them.


    You can use the debugger to attach to any running process on the system and examine
    its runtime state. To do so, click Debug and then Processes. Select the process
    to which you want to attach the debugger and click Attach. In the dialog that
    appears, select the parts of the program that you want to debug and click OK.
    The debugger loads and lets you monitor the process.


    ![](img/d6f772854306e15fb6df39b861a7b541_316_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_316_1.png)


    # DEBUG A RUNTIME ERROR


    When a runtime error occurs, the Development Environment displays an error.


    1 Click Break.


    +   - The Development Environment displays the running line in the code editor.

    +   - You can correct the error and run the project again.


    > Note: To monitor and setup debugging checkpoints in your code for runtime errors,
    see "Monitor Program Execution."'
  merge: -1
  img_proc: true
- pgno: 317
  md: "# # MONITOR PROGRAM EXECUTION\n\nYou may find yourself unable to correct code,\
    \ because it looks right but does not work as you expect. You can use the debugging\
    \ tools that Visual Studio provides to monitor the execution of your program.\
    \ You can easily debug a runtime error when an exception occurs during program\
    \ execution. When an exception occurs, Visual Basic .NET breaks and lets you look\
    \ at the line in question. For more information concerning runtime exception errors,\
    \ see the section “Debug an Application.”\n\nBut when no error occurs, yet your\
    \ program does not work like you expect, you can use the debugger. The debugger\
    \ provides a feature called breakpoints. When the execution of the program reaches\
    \ a breakpoint, it stops and lets you examine variables and objects of the line\
    \ accesses. The tool window also lets you find, add, or delete the breakpoints\
    \ in a project.\n\nWhen you run your program, and the execution reaches a line\
    \ that contains a breakpoint, the Development Environment activates and highlights\
    \ the line on which the execution stops. The Autos Watch tool window at the bottom\
    \ in the Development Environment provides a list of variables and objects that\
    \ the line uses. The current value of the various variables appears in the window.\
    \ The Locals Watch window provides a list of all local variables to the method\
    \ or property that contains the breakpoint line.\n\nYou can examine the flow of\
    \ an application by setting a breakpoint and stepping through the code as it runs,\
    \ one line at a time. Use the Step Into command on the Debug menu to execute the\
    \ current line. If the current line contains methods or properties in your project,\
    \ the execution steps into those functions. You can use Step Over to skip the\
    \ execution into a function, run the line, and step to the next line in the same\
    \ module.\n\n```\n```vb\nPublic Class Form1\nInherits System.Windows.Forms.Form\n\
    \nPrivate Sub Form1_Load(ByVal sender As System.Object, ByVal e As System.EventArgs)\
    \ Handles MyBase.Load\n    Dim x As Integer\n    For x = 1 To 100\n        ListBox1.Items.Add(x.ToString())\n\
    \    Next\nEnd Sub\n\nEnd Class\n```\n```\n\n```\n```vb\nPublic Class Form1\n\
    Inherits System.Windows.Forms.Form\n\nPrivate Sub Form1_Load(ByVal sender As System.Object,\
    \ ByVal e As System.EventArgs) Handles MyBase.Load\n    Dim x As Integer\n   \
    \ For x = 1 To 100\n        ListBox1.Items.Add(x.ToString())\n    Next\nEnd Sub\n\
    \nEnd Class\n```\n```\n\n+   1. Open an existing project and open a code module\
    \ in the code editor.\n+   2. Left-click the margin on the left side of the code\
    \ editor beside the line to place a breakpoint.\n\n> You cannot place a breakpoint\
    \ on declaration lines unless the declaration contains an assignment."
  merge: -1
  img_proc: true
- pgno: 318
  md: "# Extra\n\nYou can inspect any variable in the application in debug mode. Although\
    \ the Autos and Locals watch window display most of the variables in question\
    \ for a particular line, you may need to inspect a variable that the debugger\
    \ did not determine the current line uses. For information not shown in either\
    \ of these windows, the Watch window lets you enter variables or objects to inspect.\n\
    \nWhen an error occurs in an object at runtime, it raises an exception to notify\
    \ your program of the problem. While many objects raise custom exception objects,\
    \ all exceptions derive from the Exception object, and have the same basic set\
    \ of properties. To retrieve an exception when a runtime error occurs, see the\
    \ section “Recover from an Error.”\n\n| SEVERAL OBJECT MEMBERS | |\n|---|---|\n\
    | Message | The Message property specifies a String containing an error message\
    \ explaining the problem that causes the exception. |\n| Source | The Source property\
    \ holds a String representing the object where the error occurs. |\n| GetType\
    \ | The GetType method returns a Type object specifying the actual type of Exception\
    \ class this object represents. See Visual Basic Help for more information on\
    \ using the Type object. |\n\n![](img/d6f772854306e15fb6df39b861a7b541_318_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_318_1.png)\n\n+   3. Click Debug →\
    \ Start to start the project in debug mode.\n+   \n+   - You can also press F5\
    \ to start the project in debug mode.\n+   - The application breaks and allows\
    \ you to examine variables and objects in memory."
  merge: -1
  img_proc: true
- pgno: 319
  md: '# RECOVER FROM AN ERROR


    Error handling and recovery is an important part of making an easy-to-use and
    reliable program. You can use error-checking statements to catch errors and handle
    them appropriately.


    You can catch any error that raises an exception using a special statement block.
    When an exception occurs, the object raising the error creates an instance of
    an Exception class, or an inherited version of this class, that contains information
    about the error. For example, a database object raises an exception when it cannot
    connect to a database or when it attempts to save data into a database that does
    not fit the specified characteristics for the field.


    You use the Try block to catch errors that occur as the program runs. You terminate
    the block with the End Try statement. You place the code that may cause an error
    inside the Try block area. Then, you use the Catch statement to catch exceptions
    that occur. After the Catch


    statement, type a variable name followed by the As keyword and the exception type
    to catch. You can use multiple Catch statements to catch various kinds of specific
    exceptions.


    You can use the Exception type to catch any sort of exception that occurs. You
    can test for specific exceptions, like the DataException type, and then use another
    Catch for other types of errors using the generic Exception type. Using multiple
    exception tests enables you to handle the various errors that arise in specific
    ways.


    After the Catch statement, add code to handle the error. You should always add
    some sort of code to either correct the error or at least notify the user of the
    error.


    You can add the Finally block after any Catch statements to run code after the
    Try block runs and any necessary Catch blocks correct exceptions.


    # RECOVER FROM AN ERROR


    ![](img/d6f772854306e15fb6df39b861a7b541_319_0.png)


    +   1. Create a new project or open an existing one.


    +   2. In the method that requires error handling, type Try.


    +   3. Press Enter.


    +   4. Type code that may raise exceptions.


    +   5. On a new line inside the block, type Catch.


    +   VB.NET creates the End Try statement.


    +   6. Type a variable name, following it with As and the exception object type.


    +   To catch any exception, use the Exception type.'
  merge: -1
  img_proc: true
- pgno: 320
  md: "# Extra\n\nA Try block cannot handle exceptions that occur inside a Catch or\
    \ Finally block. If the code you use to correct the error has the potential to\
    \ cause an error as well, you can nest multiple Try blocks inside of each other.\n\
    \n# TYPE THIS:\n\n```\nDim file As IO.FileStream\nTry\n    file = New IO.FileStream(\"\
    c:\\test.txt\", IO.FileMode.Open, _\nIO.FileAccess.Read, IO.FileShare.None)\n\
    Catch ex As Exception\n    Try\n        file = New IO.FileStream(\"c:\\backup\\\
    test.txt\", IO.FileMode.Open, _\nIO.FileAccess.Read, IO.FileShare.None)\n    Catch\n\
    \        Dim msg As String = \"Could not find original or backup \" & _\n\"configuration\
    \ file. Reinstall the application\"\n        MessageBox.Show(msg)\n    End Try\n\
    End Try\nIf Not (file Is Nothing) Then\n    ' configure using the file\n    MessageBox.Show(\"\
    Configuration loaded\")\nEnd If\n```\n\n# RESULT:\n\nCould not find original or\
    \ backup configuration file. Reinstall the application.\n\n![](img/d6f772854306e15fb6df39b861a7b541_320_0.png)\n\
    \n7 Type code to handle the exception.\n\nOptionally, type Finally on a new line\
    \ inside the block and add code to run after the rest of the Try block completes.\n\
    \nThe Try block catches an exception and the Catch block handles the error gracefully.\n\
    \n8 Press F5 to run your project."
