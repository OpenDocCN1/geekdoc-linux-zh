    must authenticate with the server to ensure an accurate and untampered connection
    over the network. The Call setting makes the client authenticate the source of
    the data on each request. You can use the Connect setting, which requires that
    the client authenticate at the first connection, to improve the speed of the data
    connection while maintaining minimum security. When you select None, no authentication
    takes place. These settings only appear when you connect to a database over a
    network, and the database supports these authentication options.


