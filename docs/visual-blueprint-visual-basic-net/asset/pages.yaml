- pgno: 187
  md: '# DEFINE AN INTERFACE


    Each class in an object-oriented programming language contains two parts: the
    interface and the implementation. The interface defines the methods, events, and
    properties available to users of the class. The implementation makes up the rest
    of the class including the code behind the methods, properties, and private variables.
    In most cases, you create these two parts together. VB enables you to create a
    separate interface you can then define later with a class. This gives you the
    ability to create multiple classes that function off the same set of methods and
    properties with different underlying implementations.


    For example, you can define an interface TwoNumbers for working with two numbers.
    A class AddTwoNumbers can implement the interface to add the two numbers, and
    MultiplyTwoNumbers can implement the interface to multiply the two numbers. This
    enables the user of the class to work with a variable defined as TwoNumbers with
    both of the two classes working interchangeably.


    Use the Interface...End Interface block to define an interface. The block appears
    outside of any other class or module. VB defines an interface as Public unless
    otherwise specified. For an explanation of available accessibility keywords, see
    "Create a Class."


    Inside the block, define a property with the Property statement. After the Property
    keyword, VB expects the name for the property, parameters enclosed in parentheses,
    and the variable following the As keyword.


    Define public methods using Function or Sub keywords and the name of the method.
    You can specify the parameters that the class must use to implement the method
    and the return type for a Function method. To define events, use the Event statement
    and follow it with the event name and parameters.


    ![](img/d6f772854306e15fb6df39b861a7b541_187_0.png)


    +   1. In the module where you want to add a class, type Interface MyInterface,
    replacing MyInterface with the name for the interface.

    +   2. Press Enter. VB automatically creates the End Interface statement.

    +   3. To define an interface, type Property and follow it with ReadOnly or WriteOnly
    if desired.

    +   4. Type the name for the property followed by ( ).

    +   5. Type As followed by the property type. For an indexed property, add a parameter
    between the parentheses.'
  merge: -1
  img_proc: true
- pgno: 188
  md: "# WORK WITH CLASSES\n\n# Extra\n\nYou can define an interface and then use\
    \ the Inherits statement in another interface to import the defined members to\
    \ the new interface. For more on inheritance, see Chapter 8.\n\n```\nInterface\
    \ Automobile\n    ReadOnly Property NumberOfWheels() As Integer\nEnd Interface\n\
    \nInterface Truck\n    Inherits Automobile\n    ReadOnly Property TowingAbility()\
    \ As Integer\nEnd Interface\n\nClass MyBigRig\n    Implements Truck\n    ReadOnly\
    \ Property NumberOfWheels() As Integer Implements Truck.NumberOfWheels\n    Get\n\
    \        Return 18\n    End Get\nEnd Property\n\nReadOnly Property PossibleTrailerWht()\
    \ As Integer Implements Truck.TowingAbility\n    Get\n        Return 60000\n \
    \   End Get\nEnd Property\nEnd Class\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_188_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_188_1.png)\n\n+   6. To define a method,\
    \ type Sub or Function and follow it with the name for the method.\n+   7. Type\
    \ any necessary parameters in parentheses.\n+   8. For a Function, type As and\
    \ follow it with a type for the return value.\n+   9. To define an event, type\
    \ Event and follow it with the name of the event.\n+   10. Type necessary parameters\
    \ for the implemented event to return inside parentheses.\n\nThe interface is\
    \ complete.\nYou can now create a class to implement the interface.\nNote: See\
    \ the section 'Implement an Interface' to implement the interface."
