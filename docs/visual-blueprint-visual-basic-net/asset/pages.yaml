- pgno: 229
  md: '# WORK WITH DATA ROWS


    A table in a database consists of a number of records, or rows. The DataTable
    object uses DataRow objects to store records of the database object. You can use
    the DataRow object to manage users’ changes to rows and modify or retrieve information
    from the database. For more information on the DataTable object, see the section
    “Work with Data Tables.”


    The DataRow object maintains an object for each column, or field, of the DataTable.
    You use the Item property to access any column of the row. Pass the name of the
    column as a string, the actual DataColumn object, or an Integer index to specify
    the column to retrieve or edit. You can also using the ItemArray property to retrieve
    or modify the entire row at the same time. ItemArray returns an Object array with
    the various columns. You access the DataTable object that owns the row with the
    Table property.


    You can use the DataRow object to find and manage errors in data entry. Because
    the DataRow stores in memory, you can use these members to remove errors before
    trying to write to the database. You use the HasErrors property to determine if
    a row contains an error that prevents it from updating into a database. If HasErrors
    returns True, you can retrieve the columns that contain the errors using the GetColumnsInError
    method. The method returns an array of DataColumn objects, where each column in
    the array specifies a field in the row that contains an error. You can retrieve
    the error associated with a particular column with the GetColumnError method.
    Pass the column name as the only parameter. After you correct all the errors in
    the row, call the ClearErrors method with no parameters to remove the error states
    from the columns. For more information on managing errors, see the section “Validate
    Data.”


    The example in this section iterates through the list of rows in a data table
    and displays their information with a ListBox control. You can modify the code
    to work with a specific row. You can modify the code to work with a specific row,
    and you can substitute any display or manipulation method.


    # WORK WITH DATA ROWS


    ![](img/d6f772854306e15fb6df39b861a7b541_229_0.png)


    +   1. Set up a database connection and dataset on the form.

    +   2. Declare a DataTable variable and assign a table from the DataSet.

    +   3. To list the available rows, declare a variable of type DataRow.

    +   4. Type For Each row, replacing row with the variable you define in step 3.

    +   5. Type In dt.Rows, replacing dt with the name of the DataTable.

    +   6. Press Enter.


    Note: See the sections "Create a Database Connection" and "Add a Connection to
    a Form" to set up a database. See "Work with Data Tables" to access a DataTable.'
