- pgno: 161
  md: '# VISUAL BASIC .NET


    # DRAW BITMAPS AND IMAGES


    You can add images to a form in conjunction with drawing commands. The PictureBox
    control provides a simple way to load an image onto the form, but you cannot draw
    around the PictureBox, unless you contain all of the drawing inside. You can use
    commands from the System.Drawing namespace to draw images onto the form without
    using a control.


    Two classes provide the ability to work with bitmaped images. You more commonly
    use the Bitmap class to load a raster image from a file, create an instance of
    a Bitmap class and pass the filename as the parameter to the Bitmap constructor.
    The class stores the pixel data and properties of the image.


    Only a few of the many method calls available for DrawImage appear in the introduction.
    See Visual Basic .NET help for a complete list. The simplest constructor expects
    an Image and a Point, which specifies the


    position for the top, left corner of the image. By providing an array of three
    Point classes that form a parallelogram, DrawImage skews the image to fit the
    shape. By passing a Rectangle as the second parameter, DrawImage scales the image
    to fit the dimensions of the rectangle starting from the top, left corner of the
    rectangle.


    You can use TextureBrush to paint an image onto a shape. This allows you to create
    an image that has shaped edges, and lets you place the image inside an ellipse
    or more advanced shapes. The first parameter of the available constructors accepts
    an Image or Bitmap class. For the simplest constructor, you only need this parameter.
    Another constructor of the TextureBrush class expects a Rectangle as the second
    parameter that specifies the section of the image to use as the brush. The width
    and height of the rectangle determine the size of the brush.


    # DRAW BITMAPS AND IMAGES


    ![](img/d6f772854306e15fb6df39b861a7b541_161_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_161_1.png)


    +   1 Create a new Windows Application or open an existing one.


    +   2 Open the method or event where the image needs to draw.


    +   3 Type Dim myPic As New Drawing.Bitmap("C:\WINNT\Coffee Bean.bmp"), replacing
    myPic with the name for the image variable and "C:\WINNT\Coffee Bean.bmp" with
    the path to a supported raster image file.


    +   4 On a new line, type e.Graphics.DrawImage(myPic), replacing e.Graphics with
    the name of the Graphics object and myPic with the variable name of the Bitmap
    object.'
  merge: -1
  img_proc: true
