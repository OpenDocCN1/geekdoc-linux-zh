- pgno: 269
  md: '# ADD A DATAGRID CONTROL


    You may want to create a Web Application project that displays tables of information,
    like product listings or a list of articles in a magazine. You can use the DataGrid
    control to easily display a fully customized table of information from a dataset.


    The Web Forms DataGrid control renders a standard HTML table of a set of data.
    You link the DataSet or DataView component to the grid with the DataSource property.
    You must fill the data set before using it. See Chapter 9 to learn how to create
    a database connection.


    The Web DataGrid server control only fills when you call its DataBind method.
    Otherwise, it uses cached data. If you call the method on a post back, for example,
    if the user selects an item, the event is lost when you call DataBind. For this
    reason, make sure to only call DataBind in the Page_Load event when the IsPostBack
    of the Page is False, meaning the page loaded for the first time.


    You use the Property Builder dialog box of the DataGrid, which has five pages,
    to set up all of its major properties. The first page, General, sets up the data
    source. You need to set the DataSource property to the DataSet or DataView component
    that contains the table you want to bind. The DataMember specifies the table to
    display. Set the DataKeyField to the key field of the database, a field that is
    unique among the records. You can use the key field to easily find a record in
    the database that the user selects.


    The other property pages enable you to change the appearance and function of the
    grid. For more information on setting up the appearance and columns of the control,
    see the section "Change the Appearance of the DataGrid."


    ![](img/d6f772854306e15fb6df39b861a7b541_269_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_269_1.png)


    +   1. Create a new Web Application project or open an existing one.


    +   2. Add an appropriate DataSet or DataView.


    +   3. Click the DataGrid control in the Toolbox and add it to the form.


    +   4. Right-click the control and then click Property Builder.

    +   Note: See Chapter 9 to add a database connection. See the section "Using a
    Web Form" to add a control.


    +   5. For the DataSource, click and select the data control.


    +   6. If you use a DataGrid, select the correct table for the DataMember.


    +   7. Select the appropriate unique ID field for Data key field.


    +   8. Click OK.


    +   9. Double-click the Page outside of the grid.'
  merge: -1
  img_proc: true
- pgno: 270
  md: "# Extra\n\nIn most modern applications and Web sites, users expect to sort\
    \ the different columns in a table. The DataGrid can provide hyperlinks on each\
    \ field name in the header to enable sorting. You can sort by checking the Allow\
    \ sorting check box on the General property page in the Property Builder. Alternatively,\
    \ you can enable the AllowSorting property in the Property tool window. The field\
    \ to sort automatically returns in the SortCommand event, which fires when the\
    \ user clicks one of the column headers. The event object passes a SortExpression\
    \ property that contains the field to sort. You can alter the sort field a particular\
    \ column uses in the Property Builder. To provide the sorting capabilities, you\
    \ must bind the grid to a DataView component, which does not perform any sorting\
    \ or filtering functions. To create a DataView component, see Chapter 9.\n\n#\
    \ Example:\n\n```\nPrivate Sub DataGrid1_SortCommand(ByVal source As Object, _\n\
    \    ByVal e As System.Web.UI.WebControls.DataGridSortCommandEventArgs) _\n  \
    \  Handles DataGrid1.SortCommand\n\n    DataView1.Sort = e.SortExpression\n  \
    \  DataGrid1.DataBind()\n\nEnd Sub\n```\n\n![](img/d6f772854306e15fb6df39b861a7b541_270_0.png)\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_270_1.png)\n\nThe source editor loads\
    \ the Page_Load event.\n\n10 Fill the DataSet.\nNote: To bind controls, see Chapter\
    \ 9.\n\n11 Type If Not IsPostBack Then and press Enter.\n\n12 Type the name of\
    \ the DataGrid followed by .DataBind() inside the If block.\n\n13 Press F5 to\
    \ run your project.\n\nThe DataGrid displays the appropriate table.\n\nNote: See\
    \ the section \"Change the Appearance of a DataGrid\" to customize the grid appearance."
  merge: -1
  img_proc: true
- pgno: 271
  md: '# # CHANGE THE APPEARANCE OF A DATAGRID


    A number of properties enable the DataGrid to display data effectively and attractively.
    You can use DataGrid properties to set up a color and border scheme, and modify
    the column it displays. For more information on adding a DataGrid server control
    to your Web Form, see the section “Add a DataGrid Control.”


    The ItemStyle and AlternatingItemStyle determine how items look in the table.
    If you do not define AlternatingItemStyle, all items appear the same. If you set
    both properties, the items in the table switch between two styles. The HeaderStyle
    determines the appearance of the header and FooterStyle determines the appearance
    of the footer. You can easily edit these properties using the Property Page of
    the Property Builder for the control.


    You can set borders for the grid using the BorderWidth and BorderStyle properties.
    The CellPadding property specifies the amount of space between the edge of a cell
    and its contents, and the CellSpacing property specifies the space between cells
    of the table. Alternately, you can also set these properties via the Borders page
    of the Property Builder.


    To automatically add a style to the grid, you use the Auto Format dialog box,
    which provides a number of pre-made color-coordinated table styles. After you
    select a style, all properties of the control update to reflect the change.


    Use the Columns page of the Property Builder dialog box to specify the columns
    the table displays. By default, the grid displays all of the columns. The dialog
    box provides the option “Create columns automatically at runtime” to disable this
    operation. You can also set the AutoGenerateColumns property to False in the property
    tool window. You can then add the columns you want to display. The control contains
    the list of columns to use in the Columns property.


    # ## CHANGE THE APPEARANCE OF A DATAGRID


    ![](img/d6f772854306e15fb6df39b861a7b541_271_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_271_1.png)


    # ### SELECT DISPLAY COLUMNS


    +   1. Configure a DataGrid on the Web Form.

    +   2. Right-click the control.

    +   3. Click Property Builder.

    +      The DataGrid Property Builder dialog box appears.

    +   4. Click Columns.

    +   5. Click to remove the automatic column headers (changes to ☑).

    +   6. Click a field from the list.

    +   7. Click > to add columns.

    +   8. Click OK.

    +   9. Press F5.

    +      The grid generates with the appropriate column headings.


    > Note: See the section “Add a DataGrid Control” to add a DataGrid control.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Extra


    In a table with a large number of records, you may want to separate the records
    onto a number of pages. The DataGrid control provides paging, which enables you
    to specify the number of records that display at a time. The DataGrid automatically
    generates a set of links so that the user can jump to another page of items. You
    enable paging with the AllowPaging property. You specify the number of items that
    display on each page with the PageSize property. The default page size is 10.
    You can modify the appearance of the pager buttons using the PagerStyle property.
    You can change the PagerStyle.Mode property to display either a list of pages
    for the user to click, or a next and previous button. For the paging to work,
    the PageIndexChanged event must set the selected page and update the data grid.


    # Example:


    ```

    Private Sub DataGrid1_SortCommand(ByVal source_ As Object, ByVal e As System.Web.UI.WebControls.DataGridSortCommandEventArgs)
    Handles DataGrid1.SortCommand


    DataView1.Sort = e.SortExpression

    DataGrid1.DataBind()


    End Sub

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_272_0.png)


    SELECT AUTO FORMAT STYLE

    1 Perform steps 2 and 3 on the previous page, but click the AutoFormat in step
    3.

    2 Click a scheme to preview it.

    3 Click OK.

    4 Press F5 to run your project.


    ![](img/d6f772854306e15fb6df39b861a7b541_272_1.png)


    The grid generates with the selected style.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# EDIT DATA IN A DATAGRID


    You may want to provide a table of information to a user, and let them update
    information in the database directly over the Web. The DataGrid control can automatically
    provide edit controls for the user to add, edit, and update database records.
    Because database binding in Web Forms provides only support for reading information
    form a database, you must add the code to your application to perform the individual
    adding, editing, and updating actions.


    You can add buttons to the DataGrid control to enable the user to edit records.
    The Property Builder includes, in the list of available columns, a section called
    Button Column. This section provides a Select column, an Edit column, and a Delete
    column. Each of these columns consists of a hyperlink or button for each record
    in the grid.


    You add a Select column to the DataGrid to enable the user to select a row. The
    DataGrid automatically updates the SelectedItem property and raises the SelectedIndexChanged
    event. The selected item displays using the SelectedItemStyle style.


    The Edit row provides a method for the user to update a record. When the user
    clicks the button, the grid fires the EditCommand event. The edit does not start
    automatically. You must set the EditItemIndex property of the DataGrid to the
    appropriate item inside the EditCommand event. You can retrieve the item the user
    selects using the e.Item.ItemIndex property of the event parameters. You must
    then invoke the DataBind method to update the grid.


    When you invoke editing mode, the edit column for that record changes to display
    a Cancel and an Update button. The grid places TextBox controls for each column
    in the table. VB.NET raises the CancelCommand and UpdateCommand events when the
    user selects one of the buttons. To cancel the edit, set the EditItemIndex property
    to negative one. To save the updates, access each column of the grid using the
    Cells collection. VB.NET locates the TextBox for each cell in the Controls collection
    of the TableCell object in position zero.


    # EDIT DATA IN A DATAGRID


    ![](img/d6f772854306e15fb6df39b861a7b541_273_0.png)


    1 Configure a DataGrid control and open the Property Builder. Note: See the section
    "Add a DataGrid Control" to add the control.


    2 Click Columns.


    3 Click Button Column to open the available columns.


    4 Click the Edit, Update, Cancel item.


    5 Click ...


    6 Press OK.


    7 Handle the DataGrid.EditCommand event. Note: See Chapter 2 to create event handlers.


    8 Type the name of the DataGrid followed by EditItemIndex = e.Item.ItemIndex.


    9 Type the name of the DataGrid followed by DataBind().


    10 Handle the CancelCommand event.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# Extra


    You can use the Delete Button column to allow users to remove items from the database.
    When the user clicks Delete for a particular row, the grid posts to the server
    with the DeleteCommand event. To delete an item, pass the e.Item object from the
    parameter list to determine the item to remove. If you set the DataKeyField to
    the unique ID of the record, you can access the key data for the entry the user
    wants to delete with the DataGrid.DataKeys collection. To find a DataRow in a
    DataSet by a unique ID, the DataSet component creates a FindByFieldName method,
    where FieldName is the name of the unique field.


    # Example:


    ```

    Private Sub DataGrid1_DeleteCommand(ByVal source As Object, _

    ByVal e As System.Web.UI.WebControls.DataGridCommandEventArgs) _

    Handles DataGrid1.DeleteCommand


    Dim custID As String = DataGrid1.DataKeys(e.Item.ItemIndex)

    Dim rowInDb As DataRow = _

    DataSet11.Customers.FindByCustomerID(custID)


    DataSet11.Customers.RemoveCustomersRow(rowInDb)


    DataGrid1.DataBind()

    End Sub

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_274_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_274_1.png)


    11 Type the name of the DataGrid followed by .EditItemIndex = -1


    12 To rebind the grid, type the DataGrid name and .DataBind().


    13 Handle the UpdateCommand event.


    14 Type code to update the Dataset, cancel the edit, and rebind the grid.


    Note: See Chapter 9 to update data.


    15 Press F5 to run your project.


    The DataGrid provides an editor, and you can cancel edits or update items in the
    data set.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# # CREATE A WINDOWS SERVICE


    When you develop a complex application, you often require functionality to continuously
    run parts of the application on a server or a client computer. You also often
    require background code to run continuously when you develop server components
    — for example, a service that performs continuous maintenance on a server database,
    or calculates real-time statistics on usage. You can use Windows Services to run
    code in the background without an interface and without requiring a user to login
    to the computer and start the executable. For example, the Microsoft Internet
    Information Services (IIS) Web server runs as a Windows service so that it can
    serve incoming requests and does not directly provide an interface


    To create a Windows service, you use the Windows Service template when you create
    a new project. Your project consists of a single class that inherits from the
    System.ServiceProcess.ServiceBase class. A service initiates when a user activates
    it from the Service Manager, or when the system reboots. Your class overrides
    the OnStart method of the ServiceBase class. Use this method to add functions
    to initialize and start the service. Your class overrides the OnStop method to
    provide the ability to stop, either at a user''s request or at system shutdown.
    Provide code to stop functions of the service in this method.


    You cannot place the main functionality of the service in the main thread, which
    needs to remain available for stop requests. You can, however, use a Timer component
    or create a Thread that lets your process run. For more information on creating
    threads, see Chapter 8.


    A service does not provide a visual interface. Most services write information
    and errors to the system''s event log. For more information on adding entries
    to the event log, see the section “Using the Event Log.”


    +   1. Click File > New > Project.

    +   2. Click Visual Basic Projects.

    +   3. Click the Windows Service template.

    +   4. Type a project name for the service.

    +   5. Click OK.


    ![](img/d6f772854306e15fb6df39b861a7b541_275_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_275_1.png)'
  merge: -1
  img_proc: true
- pgno: 276
  md: "# Apply It\n\nIn many cases, users want to pause and resume your service to\
    \ conserve system resources. To support pausing and continuing, you set the CausePauseAndContinue\
    \ property of your class to True and override the base class's OnPause and OnContinue\
    \ methods. To install and run your service, see the section \"Install a Windows\
    \ Service.\"\n\n# TYPE THIS:\n\n```\nProtected Overrides Sub OnStart(ByVal args()\
    \ As String)\n    Timer1.Enabled = True\n    System.Diagnostics.EventLog.WriteEntry(\"\
    MyService\", \"Starting\")\nEnd Sub\nProtected Overrides Sub OnStop()\n    Timer1.Enabled\
    \ = False\n    System.Diagnostics.EventLog.WriteEntry(\"MyService\", \"Stopping\"\
    )\nEnd Sub\nProtected Overrides Sub OnPause()\n    Timer1.Enabled = False\n  \
    \  System.Diagnostics.EventLog.WriteEntry(\"MyService\", \"Pausing\")\nEnd Sub\n\
    Protected Overrides Sub OnContinue()\n    Timer1.Enabled = True\n    System.Diagnostics.EventLog.WriteEntry(\"\
    MyService\", \"Resuming\")\nEnd Sub\n```\n\n# RESULT:\n\n+   - MyService - Starting\n\
    +   - MyService - Pausing\n+   - MyService - Resuming\n+   - MyService - Stopping\n\
    \n![](img/d6f772854306e15fb6df39b861a7b541_276_0.png)\n\n![](img/d6f772854306e15fb6df39b861a7b541_276_1.png)\n\
    \n+   - The Development Studio creates the project and the service class loads.\n\
    +   - Add necessary components.\n+   - The example adds a Timer component.\n+\
    \   - Right-click in the Component Tray area and click View Code.\n\nNote: See\
    \ Chapters 3 and 4 for information on various components.\n\n+   - Type the necessary\
    \ code to start the process into OnStart.\n+   - Type in the necessary code to\
    \ stop the process into OnStop.\n\n+   - If you rely on the Timer control, type\
    \ code to enable and disable the timer. If you use threads, start and stop the\
    \ secondary threads.\n+   - The service is complete.\n\nNote: To install the service,\
    \ see the section \"Install a Windows Service.\""
  merge: -1
  img_proc: true
- pgno: 277
  md: '# USING THE EVENT LOG


    Services do not provide visual output through a form or console. Because they
    run in the background without requiring the user to login, services must run without
    user interaction. You can use the system event log to provide informational and
    error messages about your service to the users or system administrators. Although
    the event log’s primary use is for services, any Windows application can access
    the event logs.


    The System.Diagnostics namespace provides a variety of classes covering security
    and debugger abilities. The namespace also includes the EventLog class, which
    enables your application to write logging information to the system event log.
    Use the WriteEntry method to add an item to the event log. A number of overloaded
    versions of this method exist. One of the available methods expects a string representing
    the source of the event, a message to store for the event, and a constant from
    the EventLogEntryType enumeration. The source string typically contains the name
    of your application. Consider using the same source for each event you add to
    the log, so the user of the event log can easily determine which events belong
    to your application or service. For the message string, specify the necessary
    information or error message that contains the reason for the log entry.


    When the method executes, it adds an appropriate entry to the Application event
    log, which is the default for applications and services. You can search the MSDN
    library by typing EventLog Class to find more information on altering the log,
    adding custom logs, and working with event logs.


    # USING THE EVENT LOG


    ![](img/d6f772854306e15fb6df39b861a7b541_277_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_277_1.png)


    +   1. Create a new project or open an existing one.


    +   2. In the code module where you need to use the event log, import the System.Diagnostics
    namespace.

    +   Note: To import a namespace, see Chapter 8.


    +   3. In the method to use the event log, type Dim and follow it with a variable
    name and As New EventLog().


    +   4. Inside the parentheses, type the name of the event log to use.


    +   5. Type the variable name followed by .WriteEntry().


    +   For applications and services, use the Application log.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# Extra


    You can view event logs using the Event Viewer that the operating system provides.
    When you sign on as an administrator or a user with access to the event log, in
    Windows Server versions, click Start > Programs > Administrative Tools folder,
    and then click the Event Viewer icon. In Windows Professional versions, click
    Start > Settings > Control Panel, then double-click the Administrative Tools folder
    and click the Event Viewer icon.


    The following table of EventLogEntryType enumerations can help the user distinguish
    the particular reason for the event entry in an event log. For example, if an
    error occurs in your application or service, you can use the Error constant, which
    places a red error icon beside the entry in the Event Log viewer.


    | CONSTANT | DESCRIPTION |

    |---|---|

    | Error | An error event. This indicates a significant problem the user should
    know about such as a loss of functionality or data. |

    | FailureAudit | A failure audit event. This indicates a security event that occurs
    when an audited access attempt fails such as a failed attempt to open a file.
    |

    | Information | An information event. This indicates a significant, successful
    operation. |

    | SuccessAudit | A success audit event. This indicates a security event that occurs
    when an audited access attempt is successful; for example, logging on successfully.
    |

    | Warning | A warning event. This indicates a problem that is not immediately
    significant, but may signify conditions that can cause future problems. |


    ![](img/d6f772854306e15fb6df39b861a7b541_278_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_278_1.png)


    6 Inside the parentheses, type the name of your application or service as a string.


    7 Type a comma and follow it with a string representing the message.


    8 Type a comma and EventLogEntryType.


    9 Type a period and the appropriate constant.


    10 Press F5 to run your project.


    Your application or service now writes to the event log as appropriate.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# INSTALL A WINDOWS SERVICE


    Unlike a regular application, a Windows service cannot install and place icons
    on the Programs menu because the service must start when the computer starts,
    and respond to service requests. You can, however, create a specialized class
    that provides the initialization to install your service onto a system. Creating
    this class requires a good understanding of classes. For information on classes,
    member variables, and constructors, see Chapter 7.


    You must add a new class to your service project. In the class module, you import
    the System.Configuration.Install and System.ServiceProcess namespaces. The Install
    namespace resides in a separate DLL you must reference. See Chapter 12 to add
    the reference.


    In the class definition, you must define the attribute <RunInstaller(True)> so
    that the service installation can find the appropriate class to use. Your class
    must also inherit from the Installer class.


    The ServiceInstaller and ServiceProcessInstaller objects provide the necessary
    installation ability. Your class should contain only a constructor, which sets
    up the installer. The ServiceInstaller object sets up the service information.
    The ServiceName property of ServiceInstaller, which you make identical to the
    name of the service project, sets the name of the service to install. Set the
    StartType property to a constant from the ServiceStartType enumeration.


    The ServiceProcessInstaller object manages how the process runs. Set the Account
    property to a constant from the ServiceAccount enumeration. When utilizing the
    User constant, you must specify a user account to run the service with the Username
    and Password properties.


    After setting up these two objects, you add them both to the Installers collection.


    After you build your service into an executable, you can use Visual Basic .NET''s
    installutil.exe program to install the service by specifying the path and filename
    of the service as the command line argument. To uninstall the service from the
    computer, run the installation utility with /u after the executable name.


    # INSTALL A WINDOWS SERVICE


    ![](img/d6f772854306e15fb6df39b861a7b541_279_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_279_1.png)


    1 In a Windows Service project, add a reference to the System.Configuration.Install.dll
    file.


    2 Add a new class that inherits Installer.


    Note: See Chapters 7 and 8 for more information.


    3 Type Imports System.ServiceProcess, System.Configuration.Install at the top
    of the module.


    4 Type <RunInstaller(True)> before the Class keyword.


    5 Declare two private member variables as new objects of type ServiceInstaller
    and ServiceProcess Installer.


    6 Add a constructor with no parameters.


    7 Type the name of the process installer and follow it with Account = and an appropriate
    constant.


    8 Type the name of the service installer and follow it with ServiceName = and
    the name of the service.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Extra


    You can use the ServiceStartType to specify how the service installs onto the
    client computer. You can indicate whether you want to start the service automatically,
    start it manually, or disable it.


    | CONSTANT | DESCRIPTION |

    |---|---|

    | Automatic | Indicates that the operating system starts the service at system
    startup. If an automatically started service depends on a manually started service,
    the manually started service also starts automatically at system startup. |

    | Disabled | Indicates a disabled service that neither a user nor the system can
    start. |

    | Manual | Indicates that the service starts manually. It can only start when
    a user or application invokes it. |


    You can use the ServiceAccount enumeration to specify the user account a service
    uses.


    | CONSTANT | DESCRIPTION |

    |---|---|

