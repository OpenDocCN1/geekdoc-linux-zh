- pgno: 148
  md: '# Extra


    You can use a set of properties available in the TcpClient class to ensure that
    a connection remains open. The LingerState property represents an instance of
    the LingerOption class. Linger time is the time the connection stays open after
    you call the Close method. You can enable the LingerState option to make sure
    your application acts like a proper client and does not disconnect in the middle
    of a transfer. If LingerState.Enabled is True, data continues to send over the
    network with a timeout of LingerState.LingerTime, in seconds. After your data
    is sent or the timeout expires, the connection closes gracefully. If the TcpClient
    object finds no data in the send queue, the socket closes immediately.


    Example:

    myClient.LingerState.LingerTime = 2

    myClient.LingerState.Enabled = True


    The TcpClient class buffers information as it comes across a connection until
    you process it. You can control the buffering of the control using a set of properties.
    The ReceiveBufferSize and SendBufferSize properties control the size in bytes
    of the two respective buffers. ReceiveTimeout and SendTimeout control the amount
    of time the class waits for a server response in milliseconds. Set NoDelay to
    True to make the connection delay, if the buffers fill, so you do not lose data.


    ![](img/d6f772854306e15fb6df39b861a7b541_148_0.png)


    5 Read and write as appropriate to the stream.


    Note: See the section "Read a Stream" to read from the stream, or "Write to a
    Stream" to write to the stream.


    6 Press F5 to run the project.


    The TcpClient connects to the server and exchanges data.


    The example shows the output of connecting to the server shown in the section
    "Accept Incoming Connections".'
