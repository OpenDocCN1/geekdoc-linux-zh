- pgno: 21
  md: '# USING THE DEVELOPMENT STUDIO


    The Development Studio provides an integrated user interface for nearly every
    facet of development, including visual design tools, code editors, integrated
    MSDN help system, debugging, and add-in support. You use the Development Studio
    to create and manage all of the .NET applications you create.


    Across the top of the Development Studio, you find a standard layout for menus
    and toolbars. Around the window, you can see various tool windows attached to
    the main window. You can move and customize all of the menus, toolbars, and tool
    windows.


    When you start the Development Studio, it presents you with an opening Start Page.
    This page lets you open recent projects, search the product and support pages,
    check the What’s New area, and browse the online community.


    When you open the Development Studio for the first time, it displays the My Profile
    section of the start page, giving you access to a set of standard setups for the
    studio.


    Assuming you choose the Visual Basic Developer setup, you find the Toolbox attached
    to the left side of the window. The Toolbox provides the components you use to
    design Windows Forms, Web Forms, Database applications, and other types of applications.


    On the right side of the Development Studio, you find the Solution Explorer. The
    Solution Explorer holds the contents of a single solution. A solution, however,
    can hold multiple projects of different types that combine together into one application.


    The New Project button on the Start Page lets you begin a new application. This
    dialog provides the list of available project types. You can learn more about
    creating a project in the section "Create a Project." The Open Project button
    provides a list of folders in the Visual Studio project folder to open. To learn
    more about opening existing projects, see the section "Work with Projects."


    # USING THE DEVELOPMENT STUDIO


    # OPEN THE DEVELOPMENT STUDIO


    +   1. Click Start

    +   2. Click Programs.

    +   3. Click the Visual Studio .NET program folder.

    +   4. Click the Visual Studio .NET program icon.


    # FIRST USE OPENING SCREEN


    +   The Development Studio opens.

    +   5. Click My Profile.

    +   6. Click the Profile list and click an appropriate style for the Development
    Studio.

    +   7. Click Get Started to open the default home page for the environment.


    +   This book assumes you select Visual Basic Developer profile setup.

    +   You can click and click another startup options.


    ![](img/d6f772854306e15fb6df39b861a7b541_21_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_21_1.png)'
