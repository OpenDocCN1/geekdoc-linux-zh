- pgno: 286
  md: '# Extra


    You can use a number of method attribute properties to specify how the server
    deals with method calls. The BufferResponse property controls whether the method
    buffers the response information of the method until it completely finishes, or
    sends the data to the server as soon as possible to send to the client. Normally,
    BufferResponse should equal True, which is the default value, because it improves
    performance. If you plan to send a large quantity of data from the method, you
    may want to make BufferResponse = False.


    # Example:


    ```

    <WebMethod(BufferResponse := True)> _

    Public Sub MyWebMethod()

    ...

    End Sub

    ```


    The server can automatically cache results for a particular input to a method.
    For example, if the method accepts a single integer parameter, and you call the
    method with a five, it stores the result of the method given an input of five.
    If another call to the method is made with an input of five, it uses the cache
    result. To enable caching, set the CacheDuration attribute property to the number
    of seconds to cache the value.


    # Example:


    ```

    <WebMethod(CacheDuration := 60, MessageName := "ServiceUsage")>_

    Public Function MyWebMethod(x As Integer) As Integer

    ...

    End Function

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_286_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_286_1.png)


    4 On the line of the method declaration, type <WebMethod()>.


    5 Inside the parentheses, type optional parameters.

    The example defines a description for the method.


    6 Type code in the method to make it perform an appropriate action and return
    a value.

    The Web Service method is complete.


    You can add more methods as necessary.

    Note: See the section "Using the Service Help Interface" to test the service.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# USING THE SERVICE HELP INTERFACE


    Web services enable you to provide a set of objects you can access using the Internet.
    A Web service, like a Windows service, does not provide an interface for a user
    to access. Web services do provide an interface you can use to debug the project,
    however. When you access the URL of a Web service directly, the service invokes
    the service help page. You can use the page to manipulate and test the various
    functions of the service to aid in debugging.


    The service help page uses the Web service to detect a list of methods that it
    exposes through Web services. When you start the project from the Development
    Environment, the help interface appears. The main screen shows the list of methods
    available in the service as hyperlinks. The descriptions you assign to the class
    and each method appear on this screen. The page provides a link called Service
    Description link where you can view the actual XML that enables the help system
    to discover the functions of the service. If you want to access this XML in an
    application, place the query ?WSDL after the URL of the service.


    When you click a method, the interface loads a screen that lets you input the
    parameters the method requires. This page also lists HTML and XML code, which
    explains return types, and which lets you invoke the method. The page provides
    bold placeholders, which explains where the method locates particular information.
    When you click the Invoke button, the XML response of the method appears in a
    new window. The XML tag that surrounds the response represents the data type the
    function returns. For example, if the method you call returns a string, the XML
    response looks like <string>value</string>.


    ![](img/d6f772854306e15fb6df39b861a7b541_287_0.png)


    +   1 Open an existing Web Service project or create a new one.

    +   Note: See the section "Create a Web Service" to create a Web Service.


    +   2 Define necessary methods.

    +   Note: See the section "Add a Web Service Method" to add a method.


    +   3 Press F5 to build the project and start the service interface.


    +   4 Click a method to test.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Extra


    The Service Help interface works through the power of Web services to provide
    an interface to the exported methods. A Web Service is a programmable Web-based
    application that provides a set of methods, possibly representing application
    logic, which you can access through any number of systems using Internet standards
    like XML and HTTP. Web services depend heavily upon the broad acceptance of XML,
    and other Internet standards, to create an infrastructure that supports application
    interoperability at a level that solves many of the problems, which previously
    hindered such attempts. One of the core characteristics of a Web service is the
    high degree of abstraction that exists between the implementation and consumption
    of a service. By using XML-based messaging as the mechanism by which you create
    and access the service, both the Web service client and the Web service provider
    need no knowledge of each other beyond inputs, outputs, and location. Like the
    service help interface and the .NET Framework, you can connect different servers
    and computers, which can work together using the technology of Web services.


    ![](img/d6f772854306e15fb6df39b861a7b541_288_0.png)


