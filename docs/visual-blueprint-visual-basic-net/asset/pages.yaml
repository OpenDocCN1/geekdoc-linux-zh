- pgno: 155
  md: '# UNDERSTANDING THE GRAPHICS OBJECT


    Using controls and forms creates simple interfaces. But for some applications,
    you may want to draw custom art onto a form or control. To do so, you can use
    the Graphics object that forms and controls provide.


    Use the Paint event of a component to draw onto the component''s surface. When
    a control needs to redraw because a window overlaps it, the Paint event fires
    when the control redraws itself. The Paint event provides the Graphics object
    in the event arguments. In most cases, this means you access the object using
    e.Graphics.


    The DpiX and DpiY properties return the number of dots, or resolution, per inch
    available on the device represented by the Graphics object.


    The VisibleClipBounds property returns a RectangleF structure that specifies the
    visible region of the control available for drawing. This class contains Left,
    Top, Width, and Height properties. The Graphics object''s Clip property allows
    you to set a Region of the control where pixels can appear. When graphic methods
    attempt to draw out of the clip region, only the section inside the region draws.
    Retrieve the current Clip region as RectangleF using the ClipBounds property.


    A number of properties combine to specify the total quality of the image drawn.
    The CompositingMode property specifies how pixels draw into the Graphics object.
    It provides two constants: SourceCopy to overwrite background pixels, and SourceOver
    to combine with background pixels. Set CompositingMode to SourceOver to create
    a more realistic blend when overlapping translucent objects. SmoothingMode determines
    the quality of antialiasing you use when drawing curves and diagonals. TextRenderingHint
    sets the antialiasing mode for text. InterpolationMode determines how VB.NET calculates
    intermediate values between two endpoints.


    # PAINT EVENT


    By default, a Paint event invalidates the area that changes. For example, if the
    user makes the form larger, VB.NET allows only the part of the form that did not
    exist prior to repaint. This means if your code relies on the size of the form
    and resizes graphics as the form resizes, VB.NET does not redraw the entire surface.


    Also when a Panel or other scrolling container scrolls, only the invisible part
    of the control invalidates. For a form or control that resizes, you can place
    the name of the object followed by .Invalidate() to invalidate the entire contents
    and draw on the entire surface.


    # POINT OBJECT


    The Point object specifies a set of two pixel values that make up a particular
    coordinate on screen. To create a new instance of the Pen object, pass the x coordinate
    followed by the y coordinate. The properties X and Y store the values you specify.


    Example:

    '' define a point that represents

    '' the (100, 100) position.

    Dim pt As New Drawing.Point(100, 100)


    # SIZE OBJECT


    The Size object represents the size of a particular object. To create an instance
    of the Size object, pass the width and height to the constructor. The properties
    Width and Height store the values that you specify.


    Example:

    '' define a size of 200 pixels across

    '' and 100 pixels in height.

    Dim sz As New Size(200, 100)'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# RECTANGLE OBJECT


    The Rectangle object specifies a set of four coordinates to define the size of
    a rectangle. Many of the graphics primitives throughout the chapter use the Rectangle
    object. To create a new instance of a Rectangle object, pass the left (x) coordinate,
    the top (y) coordinate, and the width and height. The properties Left, Top, Width,
    and Height store each of the values that you specify.


    # Example:


    ```

    define a rectangle that starts at

    position (100, 100), is 200 pixels

    across, and 50 high.

    Dim rect As New Drawing.Rectangle(100, 100, 200, 50)

    ```


    # COLORS


    The Graphics object works with colors in the ARGB format. A value of 0-255 represents
    transparency (alpha-blending), and a range of 0-255 for each of the red, green,
    and blue values combine to create the full set of 32-bit colors. To create a custom
    color, call the Color.FromArgb method or either specify the combined ARGB integer
    or separate each of the four values by commas. The function uses the color given
    or generates the appropriate combined number and returns a Color object.


    VB makes a large variety of colors available to you by name in the Drawing.Color
    object. Colors range from AliceBlue to YellowGreen. Below is a partial list of
    the available colors in the Color object. For the complete list, search VB.NET
    help by typing Color members.


    # SAMPLE SYSTEM.DRAWING.COLOR MEMBERS


    | AliceBlue | AntiqueWhite | Aqua | Beige |

    | Black | Blue | BlueViolet | Brown |

    | CadetBlue | Chartreuse | Chocolate | Coral |

