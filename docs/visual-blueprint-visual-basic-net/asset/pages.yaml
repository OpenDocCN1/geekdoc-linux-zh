- pgno: 126
  md: '# Extra


    You can use the FileMode and FileAccess enumerations to specify how the stream
    opens the file.


    | FILEMODE ENUMERATION: |

    | NAME | DESCRIPTION |

    | Append | Opens the file if it exists and seeks to the end of the file, or creates
    a new file. Only works in conjunction with FileAccess.Write. |

    | Create | Specifies that the operating system Creates a new file. Overwrites
    the file if it exists. |

    | CreateNew | Specifies that the operating system creates a new file. If the file
    exists, an error occurs. Creates a new file. An error occurs if the file exists.
    |

    | Open | Specifies that the operating system opens an existing file. |

    | OpenOrCreate | Specifies that the operating system opens a file if it exists;
    otherwise creates a new file. |

    | Truncate | Specifies that the operating system opens an existing file and clear
    its contents. |


    | FILEACCESS ENUMERATION: |

    | NAME | DESCRIPTION |

    | Read | Opens the file for reading. Allows you to read data from the file. Combine
    with Write for read/write access. |

    | ReadWrite | Opens the file for reading and writing. Allows you to read and write
    data from the file. |

    | Write | Opens the file for writing. Allows you to write data to the file. |


    ![](img/d6f772854306e15fb6df39b861a7b541_126_0.png)


    6 Type IO.FileAccess.Read, replacing Read with a constant, which you type or click.


    7 Type IO.FileShare.ReadWrite), replacing Readwrite with a constant, which you
    type or select.


    8 Type code to access and close the stream.


    9 Press F5 to run your project.


    The FileStream opens or creates the specified file.'
