- pgno: 84
  md: '# Extra


    The ShowToday property allows you to enable or disable the label at the bottom
    of the calendar that shows today''s date. The ShowTodayCircle enables or disables
    the display of a red circle from today''s date both at the bottom and in the calendar.


    You can set the DateTimePicker control to allow display and allow the entry of
    a time by changing Format to Time. You must set the ShowUpDown property to True
    to use the DateTimePicker control as a time editor.


    Three properties allow you to store dates to show as bolded in the calendar. The
    BoldedDates property stores an array of DateTime variables that bold when shown
    on the calendar. Add a BoldedDate by calling the AddBoldedDate method and passing
    a DateTime class. The MonthlyBoldedDates array uses the day given in each stored
    DateTime, but display every month on the calendar. You can add a monthly date
    using the AddMonthlyBoldedDate method. AnnuallyBoldedDates use the month and day
    specified in each DateTime, and display on that day every year. You add an annual
    bolded date using the AddAnnuallyBoldedDate method.


    > Example:


    ```

    Dim Birthday As DateTime = New DateTime(2001, 8, 23)

    Dim Deadline As DateTime = New DateTime(2001, 10, 25)

    MonthCalendar1.AddAnnuallyBoldedDate(Birthday)

    MonthCalendar1.AddBoldedDate(Deadline)

    ```


    ![](img/d6f772854306e15fb6df39b861a7b541_84_0.png)


    ![](img/d6f772854306e15fb6df39b861a7b541_84_1.png)


    8 The Code Editor window appears.


    8 To access the selected date, type the name of the date control followed by a
    period.


    9 For a DateTimePicker, type Value; for a MonthCalendar, type SelectionStart or
    SelectionEnd.


    In the example, the Button1_Click event displays a message box containing the
    selected date range.


    10 Run the project by pressing F5


    The date control interacts with the user and the returns the appropriate selection.'
