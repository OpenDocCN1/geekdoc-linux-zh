- pgno: 23
  md: '# OBJECT-ORIENTED CONCEPTS


    Visual Basic .NET provides a fully object-oriented environment, which means it
    bases its functionality around sets of objects. Many languages, such as C++, C#,
    Java, and others are considered object-oriented as well, and offer many of the
    same features. You can use object-oriented programming (OOP) to create code you
    can easily reuse and extend.


    Visual Basic versions 6.0 and earlier offered partial implementations of OOP,
    but VB .NET is the first version of Visual Basic primarily designed around objects.


    # CLASS


    A class, which contains a set of data, is the primary building block of an object-oriented
    application. Instead of manipulating data directly as you might in a non-object-oriented
    language, the class controls how you can access that data from the outside. You
    can think of a class as having two distinct parts, the interface and the implementation,
    that provide the ease of use and reusability that are key to development in an
    OOP language. For more information on classes, see Chapter 7.


    In many ways, a class attempts to mimic the way you define things in the real
    world. For example, you may want to create a program where a ball bounces on the
    screen. You can place all of the code to define the shape, size, and actions of
    the ball together with the code to draw and manipulate the user interface. But
    in an object-oriented language, it makes more sense to create a class to represent
    the ball.


    # OBJECTS


    An object is the actual representation you create from your class. A class provides
    the code and definition that makes up an object. When you create an object, you
    create a usable version of the class that stores independently in memory. Then
    you can access the parts of the object, set properties, and work with the abilities
    its methods provide. You can create any number of objects based on the information
    from a class. No matter the number of objects you define from a single class,
    all of the properties and data associated with that object are unique to the individual
    object.


    For example, in your application, assume you want to create a bouncing ball on
    screen. You define a class that represents a ball. You then create a single instance
    of the ball in your application, set attributes of the ball, and tell it to bounce.
    The ball bounces appropriately on screen. You can easily go back to your code
    for the application, not touching the class defined for the ball, and create a
    new instance of the class. This ball bounces independently, knowing nothing about
    the existence of the other balls.


    # INTERFACE


    The interface of the class provides a way for other parts of the application to
    access an object. When you define the class, you determine what needs users have
    for the class and create an interface of properties, methods, and events to make
    the class usable. When you or someone else creates an object using the class,
    you do not need to understand its internal functionality. The class internalizes
    all of its functionality and allows interaction.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# IMPLEMENTATION


    The implementation of the class is the code behind the properties and methods
    that enable the class to work. When you use an object, you work with the implementation
    to access the abilities of the class.


    The actual implementation of the class is hidden from you so you can focus on
    using the class rather than on how it works.


    # PROPERTIES


    A part of a class, you can think of a property as the attributes that define the
    details of a class. You use properties to define the data that makes up the characteristics
    of the class. Each property stores a single data type and can contain a piece
    of text, a number, or a whole other object.


    Using the example of a class representing a ball, you use properties to define
    the shape, size, color, weight, and position of the ball. A property makes the
    object you create from a class unique.


    # METHODS


    Methods enable a class to define the actions that make the object functional.
    A method is made up of a block of code that performs one specific action. You
    can define any number of methods to make up a class. You can think of a method
    as a definition of something an object does or can have done to it.


    For example, you can perform one of many actions on a ball, such as throw, toss,
    or roll. Of course, a computer-simulated ball also needs methods to make it move,
    draw on screen, and bounce in an onscreen boundary.


    # EVENTS


    An object uses events to send information back to the user of the object. An event
    normally represents a response to a method the owner of the class calls. An event
    can send back data through arguments. The owner of the class optionally responds
    to the event by creating a method called an event handler, which the owner of
    the object must set up.


    For example, when you throw, toss, or roll a ball, many event can occur in response
    to your actions. The ball can hit the ground, hit a wall, or pop. In a computer
    environment, a ball hits a defined boundary, and lets the owner of the object
    respond to this occurrence. You often use an event to simply send status information
    back to the owner of the object, for example, the current position of the ball,
    or a change in course that the class handled itself.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# UNDERSTANDING THE FRAMEWORK


    The .NET Framework provides an enormous class library that contains much of the
    functionality available to VB. NET. You can use this guide as a starting point
    for understanding the underlying structure of a .NET application.


    # THE .NET FRAMEWORK


    # Features


    The .NET Framework is an enormous environment that represents much of the functionality
    contained in Visual Studio .NET. The base of the framework consists of the Common
    Language Runtime, or CLR, the engine that drives the entire system. The CLR provides
    a standard system of data types and objects, and makes cross-language and cross-platform
    development possible.


    The middle layer of the Framework includes next-generation system services such
    as ADO.NET, ASP.NET, and XML. Unlike previous versions of these tools, the Framework
    manages these tools, making their availability universally consistent across languages.


    The top-most layer includes user and program interfaces. Windows Forms provides
    the interface to create standard Win32 applications. Web Forms provides a powerful
    server side visual development tool wrapped around ASP.NET. Web Services provides
    a mechanism for programs to communicate directly over the Internet. Also, a console
    interface allows creation of simple text-based applications.


    # CLR


    The purpose of the CLR is to create an easier and faster development system with
    automatic handling of low-level details such as memory management and process
    communication. Other important features for the CLR include a simpler and safer
    deployment environment and scalability.


    The CLR transparently supports any number of languages, not limited to those Microsoft
    develops. This integration enables many languages to take advantage of the built-in
    debugging system and memory management. The integration with the CLR required
    the VB language to change significantly, but gives it the ability to work with
    other languages much more effectively.


    # Versioning


    The CLR offers significant improvements for application deployment and component
    versions. Unlike previous component models, like COM, the CLR can find and reference
    components without the use of ProgIDs, CLSIDs, and type libraries. The CLR supports
    side-by-side deployment, and therefore can load and use multiple versions of the
    same assembly. This lets a program work with a certain version of a DLL while
    another program uses a newer version of the DLL simultaneously, removing problems
    of non-backwards compatible DLLs.


    When you compile an application that references a DLL, or shared assembly, the
    compiler stores the assembly''s name and version number into your application.


    # Assemblies


    A set of one of more modules makes up a single unit called an assembly. This assembly
    contains the necessary information for you to deploy it on multiple computers.
    The assembly contains a catalog of component metadata known as a manifest. This
    manifest holds critical information about type visibility, component versioning,
    and security. Every type must exist with the scope of an assembly. In Visual Basic
    .NET, a single project represents a single assembly. A solution holds multiple
    projects, and therefore relates multiple assemblies together for deployment.


    When you create an assembly for others to use, you must decide which types should
    appear outside of the assembly. You use the Public and Private keywords to expose
    or hide a class or interface from outside users. You can also use the Friend keyword
    to hide a method from outside of the assembly, but make it usable throughout the
    assembly.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# THE .NET CLASS FRAMEWORK


    The .NET Class Framework libraries implement the functions you use in .NET enabled
    languages. The Class Framework consists of hundreds of classes and interfaces.
    It wraps class functionality around most of the Windows system libraries and provides
    extra functionality not available in standard Windows libraries.


    # Features


    The .NET class framework includes functions over a broad set of needs. These functions
    include:


    +   - Data access and manipulation: data access through ADO.NET, robust XML support,
    and file and directory tools

    +   - Standard language functions: math commands, arrays, collections, and strings

    +   - Creation and management of threads: free-threading libraries and process
    management

    +   - Interfaces to Windows functions: Windows Forms, Web Forms, Web Services,
    and console applications

    +   - Management and enforcement of application security

    +   - Application configuration

    +   - Working with Windows Directory Services, event logs, message queues, and
    timers

    +   - Support for a number of network protocols


    # System Namespace


    The System namespace holds much of the functionality in the .NET Framework. The
    table explains some of the major subsections of System. You can use this list
    as a starting point to find a particular function in the library.


    | NAMESPACE | DESCRIPTION | EXAMPLE CLASSES |

    |---|---|---|

    | System.Collections | Classes representing various sorts of collections. | ArrayList,
    HashTable, SortedList |

    | System.Data | Classes that constitute the ADO.NET architecture. | DataRow, DataTable,
    DataColumn, DataSet |

    | System.Diagnostics | Classes that enable you to debug your application and to
    trace execution of your code. | Debug, EventLog, FileVersionInfo, Trace |

    | System.Drawing | Provides access to the GDI+ basic graphics functionality. |
    Brush, Font, Image, Pen, Region, SystemColors |

    | System.Drawing.Printing | Provides printing functions and printer and page settings.
    | PageSettings, PrintDocument, PrinterSettings |

    | System.IO | Contains types for reading and writing data streams and files. |
    DirectoryInfo, FileInfo, FileStream, StreamReader, StreamWriter |

    | System.Net | Provides an interface to many common Web protocols. | Cookie, Dns,
    FileWebRequest, IPAddress, WebClient |

    | System.Resources | Manage the creation and storage of various culture-specific
    resources in an application. | ResourceManager, ResourceReader, ResourceWriter
    |

    | System.Security | Provides the underlying security structure of the CLR. | PermissionSet,
    SecurityManager |

    | System.Security.Cryptography | Provides data encoding and decoding routines,
    and functions like hashing, random number generation, and message authentication.
    | CryptoStream, DES, DSACryptoServiceProvider, MD5CryptoServiceProvider, RSACryptoServiceProvider
    |

    | System.Text | Contains classes representing ASCII, Unicode, other character
    encodings, and classes for conversion between formats. | ASCIIEncoding, StringBuilder,
    UnicodeEncoding, UTF7Encoding |

    | System.Threading | Enables multi-threaded programming. Includes classes to manage
    individual threads, pools of threads, and synchronization issues. | Monitor, Mutex,
    Thread, ThreadPool, Timer |

    | System.Web | Supplies classes that enable browser and server communication for
    ASP.NET applications. | HttpApplication, HttpPostedFile, HttpRequest, HttpResponse,
    HttpWriter |

    | System.Windows.Forms | Provides classes to create complete Windows applications.
    | Button, CheckBox, Clipboard, Form, ListView, MessageBox |

    | System.Xml | Provides standards-based support for processing XML. | NameTable,
    XmlAttribute, XmlNode, XmlReader, XmlText, XmlValidatingReader |'
  merge: -1
  img_proc: true
- pgno: 27
  md: "# LANGUAGE BASICS\n\nVisual Basic .NET is a simple language that uses many\
    \ plain English words. To use the language effectively, you need to learn certain\
    \ common conventions. For\n\nmore information on conventions, consult the Visual\
    \ Basic Programmer's Guide in the help system.\n\n# INDENTING\n\nIndenting code\
    \ is the practice of inserting spaces to make code more readable. While some languages\
    \ require certain indentations to build the code properly, indentation is completely\
    \ optional in Visual Basic .NET.\n\nHighly recommended, indentation makes code\
    \ much easier to read and understand. You use four spaces, the default amount\
    \ in VB .NET, to indent code inside a block.\n\n```\nNon-Indented code:\nSub MyMethod(argument\
    \ As String)\nDim counter As Integer\nIf argument = \"Test\" Then\nFor counter\
    \ = 1 To 10\nProcessData()\nNext\nEnd If\nEnd Sub\n```\n\n```\nProperly Indented\
    \ code:\nSub MyMethod(argument As String)\n    Dim counter As Integer\n    If\
    \ argument = \"Test\" Then\n        For counter = 1 To 10\n            ProcessData()\n\
    \        Next\n    End If\nEnd Sub\n```\n\n# COMMENTS\n\nLines in a code file\
    \ that VB .NET does not process, comments let you make plain-English descriptions\
    \ of code. This makes it easier to debug and understand code at a later date.\
    \ To comment code, place a single\n\napostrophe at the end of a code line or on\
    \ a new line. VB .NET ignores anything after the apostrophe, so you can \"comment\
    \ out\" code during testing and VB .NET does not run the code behind the apostrophe.\n\
    \n```\nNon-Commented Code:\nSub Main()\n    Setup()\n    ShowInitialScreen()\n\
    \    ProvideUserFeedback()\nEnd Sub\n```\n\n```\nCommented Code:\nSub Main()\n\
    \    ' program begins here.\n    ' initialize variables to default values and\
    \ load\n    ' the configuration file CCNFIG.INI\n    Setup()\n    ' create an\
    \ instance of the MainForm form and\n    ' show it to the user.\n    ShowInitialScreen()\n\
    \    ' when the user exits the form, allow them to\n    ' provide feedback about\
    \ their experience\n    ProvideUserFeedback()\nEnd Sub\n```"
  merge: -1
  img_proc: true
- pgno: 28
  md: "# LINE BREAKS\n\nYou can break a single statement in VB .NET into multiple\
    \ lines of code using the underscore (_) character. You can only break lines where\
    \ you normally have a space in the line, and therefore cannot break lines in the\
    \ middle of strings. You can break a line in a string, thus separating it, by\
    \ creating two strings and splitting the line between the parts. You also normally\
    \ indent the extra lines of the statement to increase readability. The book uses\
    \ the underscore character in the task screens often so that you can see the lines\
    \ of code.\n\n```\nExample:\nSub Method1()\n    call method 2\n    Method2(New\
    \ Point(5, 5), _\n        New Rectangle(10, 10, _\n        20, 20), New Point(15,\
    \ 15))\nEnd Sub\n```\n\n# CLASSES\n\nWhen you access namespaces and elements of\
    \ classes, you separate the various components with a period (.).\n\n```\nExample:\n\
    ' declare a new Point object from the Point\n' class located in the Drawing namespace\n\
    ' located in the System namespace\nDim a As New System.Drawing.Point()\n' set\
    \ the X and Y properties of the Point\na.X = 100\na.Y = 100\n```\n\n# CONSTANTS\n\
    \nYou can declare constants, named values, in your program using the Const keyword\
    \ in the base of any module. Constants create more readable code. Also, you can\
    \ change the value of the constant to affect all code that uses the constant.\n\
    \n```\nExample:\nConst MyFavoriteNumber As Integer = 9\nConst DefaultErrorMessage\
    \ As String = \"Error!\"\n```\n\n# REGIONS\n\nYou can use regions to separate\
    \ parts of the code in the module to make it more readable. When you declare a\
    \ region of code, the code editor provides a plus/minus button to expand or collapse\
    \ the section. For long code that rarely changes, a region can make using the\
    \ code editor much simpler.\n\n```\nExample:\n#Region \"Calculation functions\"\
    \nSub Add()\n...\nEnd Sub\n...\n#End Region\n```\n\n# KEYWORDS\n\nThe list of\
    \ keywords below is not complete; search help for \"keywords\" for the full list.\n\
    \nAlias And AndAlso Assembly Ansi\nAs Auto Boolean ByRef Byte\nByVal Case Catch\
    \ Char Class\nConst Date Decimal Declare Default\nDelegate Dim Do Double Each\n\
    Else ElseIf End Enum Erase\nError Event Exit False Finally\nFor Friend Function\
    \ Get Handles\nIf Imports In Inherits Integer\nInterface Is Let Lib Like\nLong\
    \ Loop Me Mod Module\nMyBase MyClass New Next Not\nNothing Object On Option Optional\n\
    Or OrElse Overrides Private Public\nReDim Region Resume Return Select\nShared\
    \ Static Step Stop String\nStructure Sub Then Throw To\nTrue Try TypeOf Unicode\
    \ Until\nWhen While With Xor"
