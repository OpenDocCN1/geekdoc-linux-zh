  md: '# Chapter 4 Preparing to Install Linux


    Before installing Linux, make sure that you are mindful of what it poses for you
    first.

    Basically, these are:


    # Linux isn’t just Linux.


    If you’ve been reading the earlier chapter properly, you would understand that
    Linux isn’t

    just “one” operating system, or one version that continually evolves over time,
    the way

    Windows does. Linux is something that contains different versions within it, and
    with

    works with GNU.


    If you’re confused as to what GNU is, you can think of it as a collection of applications,

    schedulers, text editors, compilers, and anything else you can work with in a

    command line. When you think of Linux now, you can think about it as a “kernel”—and
    a

    kernel may contain multitudes within it. This matters when it comes to hardware,
    because

    Linux offers an amazing collection of software, it doesn’t have much hardware.
    So,

    in the event that you find something wrong with hardware, you have to find the
    solution

    on your own, or find the answer from a list of Linux’s collected answers—and with
    over

    200 variations of Linux, you’ll surely be able to find what you need sooner or
    later.

    The lack of hardware would also make you more discerning of your choices. It will
    help you

    question whether you’ve got in front of you is really good, and if it’s something
    that

    you actually need—you won’t download everything and ruin your computer.


    # You would have a fun time customizing and accessorizing your desktop.


    Gone are the days when you’d just install an OS, and that’s that. You have to
    wait for

    the latest update, or try something new if you don’t like how it looks onscreen.

    However, with the help of Linux, you get to customize your desktop, and turn it
    the way

    You want it to be. This happens because Linux works with what’s called a “Desktop

    Environment”. This means that you can let your browser, and other programs be
    displayed

    y your desktop all at once so you don’t have to close your Word Processor while
    trying

    to compute something, watching your favorite show, and the like. It really puts
    “multi-

    tasking” to a test—and helps you access a modernized version of using the computer

    exactly for what you need it for.'
