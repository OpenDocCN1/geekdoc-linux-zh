  md: '# Chapter 2 Why Linux?—The Benefits of Linux


    Apart from what was mentioned earlier, why is it that you have to choose Linux?
    What exactly can you get from it?


    Well, there are loads of advantages that you can get if you choose to use Linux
    as your Operating System, some of which are as follows:


    # Amazing Security


    One of the best things that people love Linux is that compared to other operating
    systems, it is quite secure. You wouldn''t have to buy those costly anti-virus
    systems because on its own, Linux could do all the virus and security checks that
    you need, and in fact, you will learn a lot about this in the last chapter of
    this book.


    What you have to understand is since Linux is an open source system, even if some
    programmers can create bugs or anything that might be "harmful" to your computer,
    you can expect that a counter-attack is just within reach. In fact, if you can
    research or study about it, you might even create yourself.


    # Great Hardware, and Software


    If you''re one of those people who use those big, clunky, old computers, or if
    your computer doesn''t have much memory or processing power, you''d be glad that
    Linux could work for it, too. In fact—and in relation to what was mentioned above—even
    if your computer does not have firewall or any of "safety creations", you can
    still expect it to work without fail—mainly because Linux was created to "work",
    and not to give you so many ridiculous problems.


    Now, when it comes to software, Linux also has a lot to offer. While Windows offers
    one version for each app—example, Text Editor, Microsoft Word, Windows Movie Maker,
    Linux has hundreds and thousands of options that you can choose from—and that
    you get for free. So, if you''re going to search for a text editor, you can just
    search for it, and guess what? A lot of options will be presented to you, so you
    can choose the one you''re most comfortable with, and the one you think would
    yield the best results. This also means that Linux Software has greater usability
    and readability, therefore, it won''t be alienating to you the away software from
    other operating systems—especially if you have to pay a lot for them!


    # You Have the "Power of Choice"


    As aforementioned, you have the choice to decide on what kind of software you
    like to use. You also have the choice to design your desktop or device the way
    you want, simply by using Linux. It makes the act of using the computer or any
    device you have more personalized—more like something you''d feel comfortable
    with, and one that would be quite manageable for you.


    The problem with other Operating Systems is that somehow, they feel so hard to
    maneuver'
  merge: -1
