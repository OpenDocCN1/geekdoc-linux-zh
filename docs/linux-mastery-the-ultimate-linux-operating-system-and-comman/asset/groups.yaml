    # 第 6 章 使用 Linux 进行工作和娱乐


    如前所述，Linux 可用于各种应用程序——既可以用于工作，也可以用于娱乐。


    # 用于工作


    在严肃方面，Linux 可以运行于超级计算机。事实上，在过去的“地球模拟器（Earth Simulator）”超级计算机退役后，它是所有超级计算机所使用的操作系统。NASA
    的所有计算机和应用程序也使用了 Linux——所以它确实是一项能让地球更接近太空的技术，并帮助许多人了解宇宙！在某些办公室内，Linux 被用于创建一个高效的输入/输出系统——而且消除了其他操作系统带来的缓慢感。


    Linux 还适用于嵌入式系统，或任何使用“实时”机制的设备。例如，如果你想看“电视”但没有电视机，只能使用像 BusyBox 这样的设备，你可以预期实时屏幕上显示的内容也会被
    BusyBox 捕获——是*实时的*！这意味着你将不会错过任何内容——所以如果你是一名媒体从业者，这无疑可以辅助你的工作。


    Linux 也被用于移动设备，以确保虚拟化变得简单且普及，并帮助用户获得尽可能好的虚拟体验——对于那些在广告中使用增强现实技术的广告商来说非常完美。此外，Linux
    还被用于大多数服务器，特别是位于 LYCE 和 LYME 下运行的动态网站（即分别使用 LAMP 的网站）。它还适用于云计算，以及管理的服务、基础设施等。


    # 用于娱乐


    当然，Linux 在娱乐方面也表现极佳！它可以作为一个人机交互设备，以及在 Android 等其他移动设备上玩你喜欢的游戏的地方，因为 Linux 可以作为一个出色的游戏平台，像
    Valve 这样的游戏巨头已从 2012 年开始选择 Linux 作为其应用的平台。著名的 Steam 也使用 Linux，并帮助客户理解它其实并不疏远——而且它可以帮助人们更快速、更愉快地玩游戏。


    简而言之，Linux 涵盖了你需要的大部分——这就是为什么你应该尝试一下的原因。


    # 第 7 章 认识命令


    有很多命令可以让你使用 Linux 的方式变得更加简单、更好。你可以在下方学习更多信息。


    主要关键词/命令：


    - zip

    打包并压缩文件。


    - yes

    持续打印字符串直到被中断


    - xz

    压缩或解压 .xz 和 .lzma 文件


    - xdg-open

    在用户首选应用程序中打开 URL 或文件


    - xargs

    执行实用程序，传递构造的参数列表


    - write

    向另一个用户发送消息


    - whoami

    打印当前用户 ID 和名称 (`id -un`)


    - who

    打印所有当前登录的用户名


    - while

    执行命令


    - which

    在用户的 $path 中搜索程序文件


    - whereis

