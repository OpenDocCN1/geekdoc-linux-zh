    应用层还将传输目录视为一个带有黑盒的网络，允许通信发生，确保应用程序的每个部分的关键特性都能尽可能强大地运行。应用层发生的任何事情通常不涉及传输和互联网层。


    # 链路目录


    网络方法在链路层中定义。在链路层的帮助下，数据包可以轻松地在网络中移动和接收，这意味着该层对应于 OSI 模型。


