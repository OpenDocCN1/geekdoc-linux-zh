    # Chapter 2 Why Linux?—The Benefits of Linux


    Apart from what was mentioned earlier, why is it that you have to choose Linux?
    What exactly can you get from it?


    Well, there are loads of advantages you can get if you choose Linux as your Operating
    System, some of which are:


    ## Amazing Security


    One of the best things that people love Linux is that compared to other operating
    systems, it is quite secure. What you have to understand is since Linux is an
    open source system, even if some programmers can create bugs or anything that
    might be "harmful" to your computer, you can expect that counter-attack is just
    within reach. In fact, if you can research or study about it, you might even create
    yourself.


    ## Great Hardware, and Software


    If you''re one of those people who use big, clunky, old computers, or if your
    computer doesn''t have much memory or processing power, you''d be glad that Linux
    could work for it, too. In fact—and in relation to what was mentioned above—even
    if your computer does not have firewall or any "safety creations", you can still
    expect it to work without fail.


    Now, when it comes to software, Linux also has a lot to offer. While Windows offers
    one version for each app—example, Text Editor, Microsoft Word, Windows Movie Maker,
    Linux has hundreds and thousands of options that you can choose from—and that
    you get for free. So, if you''re going to search for a text editor, you can just
    search for it, and guess what? A lot of options will be presented to you, so you
    can choose the one you''re most comfortable with, and the one you think would
    yield the best results.


    # You Have the "Power of Choice"


    As aforementioned, you have the choice to decide on what kind of software you
    like to use. You also have the choice to design your desktop or device the way
    you want, simply by using Linux. It makes the act of using the computer or any
    device you have more personalized—more like something you''d feel comfortable
    with, and one that would be quite manageable for you.

