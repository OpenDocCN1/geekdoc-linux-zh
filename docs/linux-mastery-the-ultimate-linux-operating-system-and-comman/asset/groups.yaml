    # 第 8 章 管理文件和目录


    管理 Linux 文件和目录将帮助你控制一切。与任何类型的操作系统一样，确保你了解系统正在发生什么是非常重要的，这样它才不会崩溃。更重要的是，这是对系统中拥有的事物的一种关注方式。在本章中学习更多相关知识。


    # 地址目录


    正如名称所示，这是一种电信协议，使得通信应用和网站能够轻松工作。它用于映射网络地址，使得消息——甚至视频通话成为可能，并已用于重要技术，例如 Xerox PARC
    通用数据包、DEC Net、ChaosNet 和 IPv4 等。对于这些，你可以记住以下内容：


