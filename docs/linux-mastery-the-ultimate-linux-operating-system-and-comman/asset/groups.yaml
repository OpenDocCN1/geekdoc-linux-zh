    端口在传输层的帮助下建立，传输层是逻辑结构所在的地方。这基本上意味着：


    - 1. 数据应该是正确的——且只能有极小的错误；

    - 2. 数据应该按顺序到达；

    - 3. 数据应该包含流量拥塞控制；

    - 4. 丢弃或丢失的数据包必须重发，并且；

    - 5. 重复数据必须丢弃。


    当这种情况时，你可以预期最新版本的流控制协议（Stream Control Protocol）正常工作。然而，你并不需要依赖数据报文，因为正如名称所示，它们并不可靠。


