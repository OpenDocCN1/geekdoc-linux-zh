    # Application Directories


    The Application Directories encapsulates the protocols by services that provide
    exchanging protocols. This also includes configuration protocols, routing services
    and network support services. Examples include File Transfer Protocol (FTP), Hypertext
    Transfer Protocol (HTTP), and Dynamic Host Configuration Protocol (DHCP). This
    way, you would be to lower data transfer based on the protocols you are using.


    Application layer also treats the Transport Directories as a stable network with
    black boxes that allow communication to happen all the application, making sure
    that key qualities of each part of the application still works as strong as it
    can. Whatever happens to the Application Directories does not concern the Transport
    and Internet layers because traffic does not usually examine the.


    # Link Directories


    The networking methods are defined within the link layer. With the help of the
    link layer, packets could easily be moved and receive driver the network, and
    it means that the layer corresponds to the OSI model.


    # Internet Directories


    Basically, the Internet Directories works in such a way that it holds responsibility
    over sending the right packets, and making sure they could move across several
    networks. Its main functions are:


    - 1. Packet Routing. This is all about sending packets of data from the destination''s
    source, all the way to where it needs to. Unique Protocol Numbers identify these.

    - 2. Host Identification and Addressing. With the help of a hierarchical IP System,
    this one is achieved.

