    # 第1章 什么是 Linux？


    那么，Linux 到底是什么？


    首先，Linux 是一个基于 UNIX 和 POSIX 代码的免费开源操作系统。简而言之，它是免费下载、免费使用的，最初基于 Intel x86 范式。事实上，在所有操作系统中，Linux
    的安装基数比其他系统都要大。这就是为什么运行 Linux 上的计算机或设备运行速度很快，有时甚至与那些惊人的超级计算机相媲美！这是因为 Linux 可以根据其被使用的任何类型的系统进行定制——而其他操作系统只能在特定类型的设备上运行良好。这归功于所谓的开源软件协作，这种协作支持各种库和目录。


    ![](img/10d8527c9e139fb95cc6a2e58d9d3f19_6_0.png)


    http://cdn1.mos.techradar.futurecdn.net/art/software/Linux/Best%20distro/linux-distros-im-650-80.jpg


    ## 早期起源


    1969 年，UNIX操作系统（被称为 Linux 的祖先）在 AT & T 贝尔实验室创建，具有 C 语言基础，以及用于移植目的的高可用语言。在这样的背景下，该系统成为企业和学校管理员最依赖的操作系统。


    然而，当一起反垄断案件阻止 UNIX 持续用于商业时，发生了一些争议，但由于其开发者及其支持者认为 UNIX 比人们想象的要多得多，他们决定开发 GNU 内核——正是因为这样，LINUX
    终于应而生。


    ## 进入 Linux


    在其主要作者 Lin Torvalds 的帮助下，基于寻找一个所有人都可以使用的真正功能操作系统的原则，他决定致力于 GNU 内核。他想要一种人们（无论是专业人士还是只想用计算机或其他设备娱乐的人）都能真正使用的东西。然后他开始将内核创建的文件上传到
    FTP 服务器，并想将其命名为 "Freax"，但他当时的合作者和其他专业人士认为这不是一个好主意，于是利用他的名字，Linux 在 1991 年诞生了！


    - 1. 创建一种开源语言，它是免费的，每个人都能为开发做出贡献；

    - 2. 创建一种与其竞争对手一样好的东西，确保它是易于理解的，并且是直观的；

    - 3. 创建一种对日常任务有用的语言；

    - 4. 简单创建与纯英语类似的编程语言、功能以及等等（注：OCR 文本包含重复）。


