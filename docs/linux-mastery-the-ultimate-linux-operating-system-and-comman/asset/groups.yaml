    # Chapter 8 Managing Files and Directories


    Managing Linux files and directories would help you keep things in check. As with
    any kind of OS, it is important to make sure that you know what’s happening to
    your system so that it would not disintegrate. More so, it is a way of being mindful
    of the things you have in your system. Learn more about them in this chapter.


    # Directories of Addresses


    As the name suggests, this is a telecommunications protocol that makes it easy
    for communication apps and websites to work. It is used to map network addresses,
    making messaging—and even video calls—possible, and has also been used for important
    technologies, such as Xerox PARC Universal Packet, DEC Net, ChaosNet, and IPv4,
    among others. For this, you can keep in mind the following:


    - 1. 0 – Hardware Type (HTYPE)

    - 2. 2 – Protocol Type (PTYPE)

    - 3. 4 – Hardware Address (HLEN) | Protocol Address (PLEN)

    - 4. 6 – Operation (OPER)

    - 5. 8 – Sender Hardware Address (SHA)

    - 6. 10 – Next 2 succeeding bytes

    - 7. 12 – Last 2 succeeding bytes

    - 8. 14 – Sender Address Protocol (SAP)

    - 9. 16 – last 2 succeeding bytes

    - 10. 18 – Target Hardware Address (THA)

    - 11. 20 – next 2 succeeding bytes

    - 12. 22 – last 2 succeeding bytes

    - 13. 24 – Target Protocol Address (TPA)

    - 14. 26 – last 2 succeeding bytes


    # Transport Directories


    The Transport Directories contain the channels of data that are involved in Linux,
    which also establish process-to-process connectivity and end-to-end message transfers
    that provide the right information and logistics for any specific purpose in the
    network. This could be implemented, connectionless, or object-oriented.


    The port is then established with the help of the transport layer where logical
    constructs are around. It basically means that:


    - 1. Data should be correct—and could only have minimal error;

    - 2. Data should arrive in order;

    - 3. Data should include traffic congestion control;

    - 4. Packets that are discarded or lost have to be resent, and;

    - 5. Duplicate data has to be discarded.


    When that happens, you can expect the newest version of the Stream Control Protocol
    to work properly in your network. You don''t have to rely on connection datagrams,
    though, because as the name suggests, they don''t offer the right connections—and
    are quite unreliable.


