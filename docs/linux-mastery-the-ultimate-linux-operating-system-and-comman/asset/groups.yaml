    # Chapter 6 Using Linux for Work and Play


    As mentioned earlier, Linux can be used for a variety of applications—and can
    work for both work, and play.


    # For Work


    On the serious side, Linux can work for supercomputers. In fact, it is the OS
    used for all supercomputers after the demise of Earth Simulator, a supercomputer
    of the past. NASA also uses Linux for all their computers and applications—so
    it’s really something that helps bring earth closer to space, and helps a lot
    of people learn more about the universe! In some offices, Linux is used to help
    create an efficient system of inputs and outputs—minus the slowness that other
    Operating Systems bring.


    Linux also works for embedded systems, or any device that uses “real-time” mechanisms.
    For example, if you’re going to watch “TV” but have no television and can only
    use devices as BusyBox, you can expect that what’s being fed on real time screens
    would also be captured by the BusyBox—in real time! This means you wouldn''t have
    to miss out on anything—so if you’re a media practitioner, this can certainly
    aid you in your work.


    Linux is also used for mobile devices to help make sure virtualization becomes
    easy and prevalent, and helping the user get the best virtual experience possible—perfect
    for advertisers who make use of augmented reality in their ads. Apart from that,
    Linux is also used in most servers, especially dynamic sites that work under LYCE
    and LYME, those that use LAMP, respectively. It also works for cloud computing,
    as well as for managing services and infrastructures, and the like.


    # For Play


    And of course, Linux works great for fun purposes, too! It can work as a human
    interactive device, and place to play your favorite games on Android and other
    mobile devices, because Linux can work as an amazing gaming platform, with gaming
    greats such as Valve choosing Linux as a platform for its applications starting
    in 2012. The famous Steam also uses Linux, and helps customers understand that
    it’s actually not alienating—and it can help one play games faster, and in a more
    enjoyable manner.


    In short, Linux is around for most anything that you need—and that’s why you wouldn’t
    hurt for you to try it.'
