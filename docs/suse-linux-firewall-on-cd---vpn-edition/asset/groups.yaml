  - '[PAGE 122]


    # A DNS – Domain Name Service


    DNS (engl. Domain Name Service) wird benötigt, um die Domain- und Rechernamen
    in IP-Adressen aufzulösen.


    # A.1 Nameserver BIND starten


    Der Nameserver BIND8, der gilt auch für die neue Version BIND9, ist auf SuSE Linux
    bereits vorkonfiguriert, dass man ihn problemlos nach der Installation sofort
    starten kann.


    Hat man eine funktionsfähige Internetverbindung und trägt in /etc/resol.conf als
    Nameserver 127.0.0.1 für localhost ein, hat man in der Regel schon eine funktionierende
    Namensauflösung, ohne dass man den DNS Providers kennt. BIND führt die Namensauflösung
    über die Root-Nameserver, was aber wesentlich langsamer ist. Normalerweise sollte
    man den DNS Providers mit in der Konfigurationsdatei /etc/named.conf unter forwarders
    eintragen, um eine effektive und sichere Namensaufösung zu erhalten. Fungioniert
    das, läuft der Nameserver als C. Wer seine eigene Domain bereitstellt, wird ein
    richtiger DNS benötigt. Ein Beispiel dafür findet man im Dokumentverzeichnis:
    /usr/share/doc/packages/bind8/sample-config.


    Man sollte lediglich offizielle Domain aufsetzen, solange man diese nicht kommen
    muss. Wenn man eine eigene Domain hat, diese aber von Provider verwaltet wird,
    sollte diese nicht verwenden, da BIND sonst Anfragen für diese Domain weiterführen
    würde oder z. B. der Webserver für die eigene Domain nicht mehr erreichbar wäre.


    Um den Nameserver zu starten nutzt man den Kommando (als root) rnamed start


    ein. erscheint rechts in grün „done“, der ist named, heißt der Nameserver-Prozess,
    erfolgreich startet. Auf dem lokalen System kann man die Funktionalität des Nameservers
    sofort testen, indem man das Programm nslookup verwendet. Der DNS Server muss
    localhost mit der Adresse 127.0.0.1 angezeigt werden. Sollte dies der Fall sein,
    ist sehr wahrscheinlich in der /etc/resol.conf ein falscher Nameserver oder diese
    Datei existiert gar. Für einen ersten Test gibt man auf dem Prompt von nslookup
    „127.0.0.1“ ein, das sollte ihn funktionieren; erhält man stattdessen eine Fehlermeldung
    „No response from server“ oder ähnlich, sollte man mit folgend Kommando überprüfen,
    ob der named überhaupt läuft rnamed status'
- md: "\n# DNS – Domain Name Service\n\nFalls der Nameserver nicht startet oder ein\
    \ fehlerhaftes Verhalten findet, wird die Ursache in den meisten Fällen in `/var/log/messages`\
    \ protokliert.\n\nHat man eine Wahlverbindung, muss man beachten, dass BIND8 beim\
    \ Start den Root-Nameserver überprüfen. Gelingt dies nicht, weil keine Internetverbindung\
    \ zustande kommt, kann dazu führen, dass überhaupt keine DNS-Anfragen außer für\
    \ lokal definierte Zonen aufgelöst werden können. BIND9 hält sich dadurch anders,\
    \ benötigt ein Mehrfaches an Ressourcen im Vergleich zu BIND8.\n\nUm den Nameserver\
    \ des Providers, oder einen eigenen, den man im eigenen Netz hat, als `forwarder`\
    \ zu verwenden, muss man diesen oder auch mehrere, im Abschnitt `options` unter\
    \ `forwarders` eintragen; vgl. Beispiel A.1.1.\n\n```\noptions {\n  directory\
    \ \"/var/named\";\n  forwarders { 10.11.12.13; 10.11.12.14; };\n  listen-on {\
    \ 127.0.0.1; 192.168.0.9; };\n  allow-query { 127/8; 192.168.0.24; };\n  notify\
    \ no;\n};\n```\n\n## A.1.1: Forwarding-Optionen in named.conf\n\nDie im verwendeten\
    \ IP-Adressen sind willkürlich gewählt und müssen entsprechend den jeweiligen\
    \ Gegebenheiten eingetragen werden.\n\nNach den Optionen dürfen die Einträge für\
    \ die Zone, die für `localhost`, `0.127.in-addr.arpa`, sowie der Root vom `type\
    \ hint` sollten mindestens immer vorhanden sein. Die zugehörigen Dateien müssen\
    \ nicht veraltet sein, damit sie funktionieren können. Man muss darauf achten,\
    \ dass nach jedem Eintrag ein `;` steht und die geschlossenen Klammern korrekt\
    \ gesetzt sind. Hat man Änderungen an der Konfigurationsdatei `/etc/named.conf`\
    \ oder den Zonen-Dateien vorgenommen, muss BIND diese neu einzulesen. Das gelingt\
    \ mit dem Kommando `rnd reload`. Alternativ kann man den Nameserver neu starten,\
    \ dann durch den Befehl `rndnamed restart`. Fehlt nach dem Kommando, um den Nameserver\
    \ zu beenden, muss man in `/etc/rc.config` lediglich den Eintrag START_NAME=yes\
    \ auf START_NAME=no.\n\n## A.2 Die Konfigurationsdatei /etc/named.conf\n\nAlle\
    \ Einstellungen zum Nameserver BIND9 sind in der Datei `/etc/named.conf` vorzunehmen.\
    \ Die Zonendatien selbst, die Rechnernamen, IP-Adressen für die zu verwendeten\
    \ Domains, die in separaten Dateien im Verzeichnis `/var/named` abzulegen sind,\
    \ befinden unter.\n\nDie `/etc/named.conf` unterteilt sich in zwei Bereiche, bei\
    \ denen der Abschnitt `options` für allgemeine Einstellungen und zum anderen die\
    \ zone-Einträge für die einzelnen Domains. Außerdem kann man noch einen Bereich\
    \ logging, sowie Einträge vom Typ acl definieren. Kommentarteile beginnen mit\
    \ einem '#'-Zeichen, alternativ wird // erlaubt.\n\nEine minimalistische `/etc/named.conf`\
    \ stellt Beispiel A.2.1 dar.\n\n```\noptions {\n  directory \"/var/named\";\n\
    \  forwarders { 10.0.0.1; };\n  notify no;\n}\n\nzone \"localhost\" {\n  type\
    \ master;\n  file \"localhost.zone\";\n}\n\nzone \"0.0.127.in-addr.arpa\" {\n\
    \  type master;\n  file \"127.0.0.zone\";\n}\n\nzone \".\" {\n  type hint;\n \
    \ file \"root.hint\";\n}\n```\n\nDatei A.2.1: Minimalistische Datei /etc/named.conf\n\
    \nDieses Beispiel funktioniert für Bind8 und Bind9 gleichermaßen, keine speziellen\
    \ Optionen verwendet werden, die nur von einer Version verstanden werden. Bind-9.1.1\
    \ aktiviert alle Bind-Konfigurationen und vermerkt beim Start, wenn eine Option\
    \ nicht implementiert ist. Spezielle Bind9-Optionen werden vom Bind aber nicht\
    \ unterstützt.\n\n## A.2.1 Die wichtigsten Konfigurationsoptionen im Abschnitt\
    \ options\n\n- `directory \"/var/named\";`: gibt das Verzeichnis, in dem die BIND\
    \ die Dateien mit den Zonendaten findet.\n- `forwarders { 10.0.0.1; };`: wird\
    \ verwendet, um DNS-Anfragen an andere Server weiterzuleiten.\n- `notify no;`:\
    \ verhindert, dass der Server über Änderungen benachrichtigt wird.\n- `listen-on\
    \ { ... };`: definiert, auf welchen Interfaces der Server laus.\n- `allow-query\
    \ { ... };`: legt fest, welche IP-Bereiche Anfragen stellen dürfen.\n\n## DNS\
    \ – Name Service\n\nFalls der Nameserver nicht startet oder ein fehlerhaftes Verhalten\
    \ findet, wird die Ursache in den meisten Fällen in `/var/log/messages` protokliert.\n\
    \nHat man eine Wahlverbindung, muss man beachten, dass BIND8 beim Start den Root-Nameserver\
    \ überprüfen. Gelingt dies nicht, weil keine Internetverbindung zustande kommt,\
    \ kann dazu führen, dass überhaupt keine DNS-Anfragen außer für lokal definierte\
    \ Zonen aufgelöst werden können. BIND9 hält sich dadurch anders, benötigt ein\
    \ Mehrfaches an Ressourcen im Vergleich zu BIND8.\n\nUm den Nameserver des Providers,\
    \ oder einen eigenen, den man im eigenen Netz hat, als `forwarder` zu verwenden,\
    \ muss man diesen oder auch mehrere, im Abschnitt `options` unter `forwarders`\
    \ eintragen.\n\n## A.2 Die Konfigurationsdatei \n\nAlle Einstellungen zum Nameserver\
    \ BIND9 sind in der Datei `/etc/named.conf` vorzunehmen. Die Zonendatien selbst,\
    \ die Rechnernamen, IP-Adressen für die zu verwendeten Domains, die in separaten\
    \ Dateien im Verzeichnis `/var/named` abzulegen sind, befinden sich.\n\nDie `/etc/named.conf`\
    \ unterteilt sich in zwei Bereiche, bei denen der Abschnitt `options` für allgemeine\
    \ Einstellungen und zum anderen die zone-Einträge für die einzelnen Domains. Außerdem\
    \ kann man noch einen Bereich logging, sowie Einträge vom Typ acl definieren.\
    \ Kommentarteile beginnen mit einem '#'-Zeichen, alternativ wird // erlaubt.\n\
    \n## A.2.2 Der Konfigurationsabschnitt\n\n```\nlogging {\n  category default {\
    \ null; };\n};\n```\n\n## A.2.3 Aufbau der Zonen-Einträge\n\nNach den Optionen\
    \ dürfen die Einträge für die Zone, die für `localhost`, `0.127.in-addr.arpa`,\
    \ sowie der Root vom `type hint` sollten mindestens immer vorhanden sein.\n"
  mdcn: "\n\n# DNS – 域名服务\n\n如果域名服务器未启动或出现错误行为，大多数情况下原因会记录在 `/var/log/messages` 中。\n\
    \n如果是拨号连接，必须注意 BIND8 在启动时会检查根域名服务器。如果无法建立互联网连接而导致检查失败，可能会导致除本地定义的区域外，没有任何 DNS\
    \ 请求都无法解析。BIND9 在这方面的处理有所不同，与 BIND8 相比需要多倍的资源。\n\n若要使用提供商的域名服务器或自己网络中的服务器作为 `forwarder`（转发器），必须在\
    \ `options` 部分的 `forwarders` 下填入一个或多个地址；参见示例 A.1.1。\n\n```\noptions {\n  directory\
    \ \"/var/named\";\n  forwarders { 10.11.12.13; 10.11.12.14; };\n  listen-on {\
    \ 127.0.0.1; 192.168.0.9; };\n  allow-query { 127/8; 192.168.0.24; };\n  notify\
    \ no;\n};\n```\n\n## A.1.1: named.conf 中的转发 选项\n\n所使用的 IP 地址是随机选择的，必须根据实际情况进行填写。\n\
    \n在选项之后，对于 `localhost`、`0.127.in-addr.arpa` 以及根区域的 `type hint` 条目应当至少始终存在。相关文件不需要是最新的即可运行。必须确保每个条目后都有一个\
    \ `;`，并且闭合括号设置正确。如果对配置文件 `/etc/named.conf` 或区域文件进行了修改，必须让 BIND 重新加载。可以通过 `rnd\
    \ reload` 命令实现。或者，也可以通过 `rndnamed restart` 命令重启域名服务器。如果在停止域名服务器的命令后缺失，只需在 `/etc/rc.config`\
    \ 中将 `START_NAME=yes` 改为 `START_NAME=no`。\n\n## A.2 配置文件 /etc/named.conf\n\n所有关于\
    \ BIND9 域名服务器的设置应在 `/etc/named.conf` 文件中完成。区域数据本身、主机名、所用域名的 IP 地址应存储在 `/var/named`\
    \ 目录下的独立文件中。\n\n`/etc/named.conf` 分为两个区域：用于通用设置的 `options` 部分，另一个是针对各个域的区域条目。此外，还可以定义\
    \ `logging` 区域以及 `acl` 类型的条目。注释部分以 `#` 字符开头，也可以允许 `//`。\n\n一个极简的 `/etc/named.conf`\
    \ 所示示例 A.2.1。\n\n```\noptions {\n  directory \"/var/named\";\n  forwarders { 10.0.0.1;\
    \ };\n  notify no;\n}\n\nzone \"localhost\" {\n  type master;\n  file \"localhost.zone\"\
    ;\n}\n\nzone \"0.0.127.in-addr.arpa\" {\n  type master;\n  file \"127.0.0.zone\"\
    ;\n}\n\nzone \".\" {\n  type hint;\n  file \"root.hint\";\n}\n```\n\n文件 A.2.1:\
    \ 极简文件 /etc/named.conf\n\n此示例同样适用于 Bind8 和 Bind9，没有使用仅某个版本理解的特殊选项。Bind-9.1.1 会激活所有\
    \ Bind 配置，并在启动时记录某个选项未实现。Bind 不支持特殊的 Bind9 选项。\n\n## A.2.1 options 部分中最重要的配置选项\n\
    \n- `directory \"/var/named\";`: 指定了 BIND 查找区域数据文件所在的目录。\n- `forwarders { 10.0.0.1;\
    \ };`: 用于将 DNS 请求转发到其他服务器。\n- `notify no;`: 防止服务器接收关于更改的通知。\n- `listen-on { ...\
    \ };`: 定义服务器在哪些接口上监听。\n- `allow-query { ... };`: 规定哪些 IP 范围可以发送请求。\n\n## DNS –\
    \ 域名服务\n\n如果域名服务器未启动或出现错误行为，大多数情况下原因会记录在 `/var/log/messages` 中。\n\n如果是拨号连接，必须注意\
    \ BIND8 在启动时会检查根域名服务器。如果无法建立互联网连接而导致检查失败，可能会导致除本地定义的区域外，没有任何 DNS 请求都无法解析。BIND9\
    \ 在这方面的处理有所不同，与 BIND8 相比需要多倍的资源。\n\n若要使用提供商的域名服务器或自己网络中的服务器作为 `forwarder`，必须在\
    \ `options` 部分的 `forwarders` 下填入一个或多个地址。\n\n## A.2 配置文件 \n\n所有关于 BIND9 域名服务器的设置应在\
    \ `/etc/named.conf` 文件中完成。区域数据本身、主机名、所用域名的 IP 地址应存储在 `/var/named` 目录下的独立文件中。\n\
    \n`/etc/named.conf` 分为两个区域：用于通用设置的 `options` 部分，另一个是针对各个域的区域条目。此外，还可以定义 `logging`\
    \ 区域以及 `acl` 类型的条目。注释部分以 `#` 字符开头，也可以允许 `//`。\n\n## A.2.2 配置区域\n\n```\nlogging\
    \ {\n  category default { null; };\n};\n```\n\n## A.2.3 区域条目的结构\n\n在选项之后，对于 `localhost`、`0.127.in-addr.arpa`\
    \ 以及根区域的 `type hint` 条目应当至少始终存在。\n\n"
