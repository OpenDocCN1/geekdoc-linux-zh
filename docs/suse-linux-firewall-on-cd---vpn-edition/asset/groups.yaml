    # Sicherheit im Netzwerk


    bereits Zugriff auf ein lokales „login“ hat. Viele der bekannten Fehler können
    über eine Netzwerkverbindung ausgenutzt werden. Deswegen sind „Buffer Overflows“
    und „Format String Bugs“ nicht direkt auf den lokalen Rechner oder das Netzwerk
    klassifizierbar.


    # Viren


    Entgegen vielartiger Meinungen gibt es tatsächlich Viren für Linux. Die bekannten
    Viren sind von ihren Autoren als „Proof-of-Concept“ geschrieben worden, als Beweis,
    dass die Technik funktioniert. Allerdings ist noch keiner dieser Viren in „freier
    Wildbahn“ beobachtet worden.


    Viren benötigen zur Ausbreitung einen Wirt, der nicht lebensgefährlich ist. Dieser
    Virus ist ein Programm oder einen Speicherbereich für das System, etwa den Master-Boot-Record,
    und er muss für den Programmcode des Virus beschreibbar sein. Linux hat genau
    die Möglichkeit, Multi-User den Schreibzugriff auf Dateien einzuschränken, als
    insbesondere Systemdateien. Wenn sie als „root“ arbeiten, erhöhen sie die Wahrscheinlichkeit,
    dass Ihr System von einem Virus infiziert wird. Berücksichtigt man die Regeln
    der geringstmöglichen Privilegien, ergeben sich Schwierigkeiten mit einem Linux
    Virus. Daher soll man sich nicht leichtfertig ein Programm aus, das Sie dem Internet
    beziehen haben und dessen Herkunft man nicht kennt. SuSE-rpm Pakete sind mit dieser
    digitalen Unterschrift kryptographisch signiert und mit dieser Unterschrift erhält
    das Paket bei SuSE das Merkmal. Viren sind klassische Symptome dafür, dass auch
    ein höheres System nicht sicher wird, wenn der Administrator oder der Benutzer
    ein mangelndes Sicherheitsbewusstsein hat.


    Viren sind nicht mit Würmern zu verwechseln, die Phänomene auf der Netzwerksicherheit
    sind und keinen Wirt brauchen, um sich zu verbreiten.


    # Netzwerksicherheit


    Bei der lokalen Sicherheit war die Aufgabe, die Benutzer, die an denselben Rechner
    arbeiten, voneinander zu trennen, insbesondere den Benutzer „root“. Im Gegensatz
    dazu soll bei Netzwerksicherheit das gesamte System gegen Angriffe auf das Netzwerk
    geschützt werden. Benutzerauthentifizierung beim klassischen Einloggen durch Benutzerkennung
    und Passwort gehört zur lokalen Sicherheit. Bei jedem Einloggen über eine Netzwerkverbindung
    muss man differieren zwischen Sicherheitsaspekten: bis zur erfolgten Authentifizierung
    spricht man von Netzwerksicherheit, nach dem Login geht es um lokale Sicherheit.


    # X-Windows (X11-Authentifizierung)


    Bereits erwähnt ist Netzwerktransparenz eine grundlegende Eigenschaft des Unix-Systems.
    Bei X11, dem Windows-System von Unix, gilt dies nur auf Weiteres in besonderem
    Maße! Sie können sich auf entfernte Rechner einloggen und dort ein Programm starten,
    welches dann über das Netzwerk


    ![](img/594883f46b5a0951172f1e794f42a4a5_163_0.png)


    auf Ihrem Rechner angezeigt wird. Das Protokoll, welches zwischen der X-Applikation
    und dem X-Server (der lokale Prozess, der Fenster der Grafikkarte zur Anzeige
    bringt) zur Kommunikation verwendet wird, ist recht sparsam, was Netzwerkbandbreite
    bedeutet. Das ist den in 80er Jahren, als das System eingeführt wurde, zur Verfügung
    stehenden Bandbreiten gerecht.


    Wenn nun ein X-Client das Netzwerk über seinen X-Server nutzen will, soll der
    Server die Ressource, die er verwaltet (das Display), gegen unberechtigte Nutzer
    schützen. Konkrete heißt dies, dass das Client-Programm Rechte bekommt. Bei X-Windows
    geschieht dies über zwei Arten: Host-basierte und cookie-basierte Zugriffskontrolle.
    Erste basiert auf der IP-Adresse des Rechners, auf dem das Client-Programm läuft
    und mit dem Programm xhost kontrolliert wird. xhost versucht eine IP-Adresse in
    einer Mini-Datenbank im X-Server einzubauen. Eine Authentifizierung allein auf
    einer IP-Adresse aufzubauen ist jedoch nicht sicher. Es könnte noch ein zweiter
    Benutzer auf dem Rechner mit dem Client-Programm aktiv sein, und dann hätte jeder,
    der die IP-Adresse kennt, Zugriff auf den X-Server. Deswegen soll hier nicht nur
    auf diese Methoden eingegangen werden. Die Manpage von xhost-Kommandos gibt mehr
    Aufschluss über die Funktionsweise (und enthält ebenfalls Warnungen!).


    Bei „cookie“-basierter Zugriffskontrolle wird eine Zeichenkette, die nur der X-Server
    und der legitim eingelogogte Benutzer kennt, als Passwort eines Ausweises verwendet.
    Dieses „cookie“ (das englische Wort Keks und hier fortune cookies, die eine Nachricht
    enthalten) wird in der Datei .authority im Home-Verzeichnis des Benutzers beim
    Login gespeichert und dient jedem X-Windows-Client, der ein Fenster beim X-Server
    zur Anzeige bringt, zur Verfügung. Das Programm xauth dient dem Werkzeug, dies
    zu untersuchen. Wenn Sie .authority aus Ihrem Home-Verzeichnis löschen oder umbenennen,
    können Sie keine Fenster von neuen X-Clients öffnen. Näheres über Sicherheitsmaßnahmen
    von X-Windows erfahren Sie in der Manpage von Xsecurity (man security).


    ssh (secure shell) kann über eine vollständig verschlüsselte Netzwerkverbindung
    bei einem Benutzer transparent (also nicht direkt sichtbar) die Verbindung zu
    einem X-Server weitergeben. Man spricht von „X11-forwarding“. Dabei wird auf Server-Seite
    ein X-Server simuliert und bei der Shell auf der Remote-Seite die DISPLAY-Variable
    gesetzt. Der Client öffnet zum Anzeigen eine Verbindung zum ssh daemon (shell
    daemon, das serverseitige Programm), der dann die Verbindung zu den richtigen,
    realen X-Server durchschleust. Wenn Sie X-Clients über das Netzwerk anzeigen lassen
    müssen, sollten Sie ssh einmal genauer unter die Lupe nehmen.


