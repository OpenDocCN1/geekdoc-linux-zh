    # C Sicherheit im Netzwerk


    # C.1 SSH – secure shell, die sichere Alternative


    In unserer Zeit der immer stärkeren Vernetzung werden auch Zugriffe auf entfernte
    Systeme immer häufig. Ob elektronische Post abgeholt, ein Server gewartet oder
    eine Webseite ein Redaktionssystem einen Artikel hinzugefügt wird, muss immer
    eine Authentifizierung der Person erfolgen.


    In der Regel sollten Nutzer weiterhin haben, dass ihr Benutzername und ihr Kenn
    lediglich für sie allein gedacht sind. Eine entsprechende Vereinbarung zwischen
    Arbeitgeber, Rechenzentrum oder Serviceanbieter über die Personenbezogenen dieser
    Daten ist Standard.


    Ersreckend demgegenüber die weitregehende Praxis, dass Authentifizierung und Datenübertragung
    weiterhin in Form von Klartext erfolgen. Die ist beispielsweise der Fall, wenn
    mit Post Protocol (POP) E-Mail abgeholt oder mit telnet auf einem entfernten System
    angemeldet wird. Hierbei gehen die Nutzungen als sensibel eingestuften Nutzerinformationen
    und Daten, z. B. der Inhalt eines Briefes, oder ein talkgeführtes Gespräch, ohne
    Schutz über das Netzwerk. Dies beeinträchtigt einseits die Privatsphäre des Nutzers
    und öffnet andererseits die Möglichkeit zum Missbrauch eines Zugangs. Insbesondere
    können solche Zugänge werden, von dort aus andere Systeme anzugreifen, mit Administrator-bwort
    auf diesem System zu landen.


    Jede der Nutzung der Daten beispielsweise oder im gleichen Netz betriebene Gerät
    wie Firewall, Router, Switch, Mailserver, Arbeitsplatzchner, welche die Daten
