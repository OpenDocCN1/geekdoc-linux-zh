    ## MIME-Types


    Zu diesen MIME-Types gehören:

    - Bilder (GIF)

    - Audiodateien (WAV)

    - Videos (MPEG)


    ## Bedienung


    Das Fenster zeigt alle konfigurierten MIME-Types an. ''MIME-Typ'' gibt an, um
    welchen Typ es sich handelt. ''Offset'' bezeichnet die Stelle nach Dateianfang,
    an der die ''Zeichenkette'' befindet.


