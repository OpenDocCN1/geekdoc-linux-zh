  - '[PAGE 20]


    # 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall


    Zur Neuinstallation des „SuSE Linux Adminhost for Firewall“ legen Sie bitte die
    CD mit der entsprechenden Beschriftung ins CD-Laufwerk des Rechners ein und führen
    einen Reboot durch. Falls der Rechner nicht CD bootet, müssen Sie im BIOS die
    Bootsequenz entsprechend ändern.


    Der Begrüßungsbildschirm von linuxrexe – drücken Sie einfach leftarrow, danach
    startet die automatische Hardwareerkennung.


    YaST2 führt Sie durch die weitere Installation. Es werden alle für die Administration,
    Konfiguration und Wartung nötigen Programme installiert.


    # 3.3.1 Sprachauswahl


    Mit der Sprachauswahl beginnen Sie erneut mit Maus oder Tastatur im Installationsprozess
    eingreifen. Alle Eingabefelder, Auswahlllisten und Buttons („Schaltflächen“ oder
    „Knöpfe“) können durch Mausklick gewählt werden. Wenn Sie die Tastatur auswahl
    wollen, gelten folgende Regeln:


    +   * Tab lenkt den Fokus auf einen Bereich, ein Eingabe-/Auswahlfeld oder einen
    Button; mit ⇧Umschalt + Tab gelangen Sie zu einer anderen Auswahlgruppe. Mit ⌃
    und ⇧ kann der nach aktiven Bereich eine Auswahl getroffen oder der in einer Liste
    geblättert werden.


    +   * Enter wird das ausgewählte Kommando ausgeführt; in der Regel ist das die
    Aktion, die auf dem jeweiligen Button genannt ist.


    +   * Mit Leertaste werden Einträge angekreuzt werden.


    +   * Außerdem könnten bestimmte Aktionen durch die Tastenkombination Alt + unterstrichener
    Buchstaben ausgelöst werden.


    > Tipp

    Hier in den folgenden Dialogen können YaST2 Informationen sammeln.\ Später werden
    Ihnen YaST2 die Erkenntnisse gesammelt in einer Übersicht vorliegen; die in Abschnitt
    3.3.7 auf Seite 24 beschrieben haben Sie sich noch die Möglichkeit, mithilfe des
    ‚Zurück‘-Buttons zu den vorherigen Dialogen zurückzugehen, um Angaben zu korrigieren.


    Wählen Sie die Sprache, die Sie verwenden möchten und klicken Sie auf ‚Weiter‘
    Die Texte aller folgenden Dialoge erscheinen dann in der gewünschten Sprache.'
