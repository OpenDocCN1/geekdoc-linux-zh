  mdcn: '


    # B.5 配置文件

    /etc/squid.conf


    这是必需的，但外部客户端的访问最初会被锁定。对于 localhost 允许代理访问，默认使用端口 3128。在安装的 `/etc/squid.conf` 中，有许多示例详细说明了这些选项。行首几乎所有的条目都被注释了，并且始终位于相关描述的末尾。给出的值对应于你设置的值，因此在不更改选项的情况下仅通过注释符号的作用有限。最好的做法是像示例那样复制，并使用修改后的参数将选项重新插入到行的末尾。这样人们就可以轻松追溯预设值，且不会受到
    Squid 版本变化的很大影响。


    如果是从旧版本更新的，强烈建议使用新的 `/etc/squid.conf`，并仅采用原始文件的更改。如果尝试继续使用 `squid.conf`，可能会面临配置不再有效的风险，因为选项一直在被修改并不断增加新的。


    # 通用配置选项


    http_port 3128 是 Squid 监听客户端请求的端口。默认值为 3128，常用的还有 8080。这里可以通空格分隔接受多个端口号。


    cache_peer <hostname> <type> proxy-port <icp-port> 将代理作为“parent”（父级）输入，例如在使用服务商或其他时。<hostname>`
    带有要使用的代理的名称或 IP 地址，`<type>` 填写 parent。对于 `<proxy-port>`，填写在浏览器中使用该代理所需的端口号，通常为
    8080。如果不知道 ICP 端口且与该代理的使用不兼容，可以将 `<icp-port>`设置为 7 或 8。


    此外，应该在 `default` 和 `no-query` 之后指定端口号，以完全禁止使用 ICP 协议。Squid 对服务提供者的代理的行为就像普通的浏览器。


    cache_mem 8 MB。此条目指定 Squid 缓存最多使用多少内存。默认值为 8 MB。


    cache_dir /var/squid/cache 100 26 `cache_dir` 条目指定所有对象存储在磁盘上的目录。必须调整目录数量、所用磁盘空间（MB
    为单位）以及文件数量。默认在 `/var/squid/cache` 目录下占用 100 MB 的磁盘空间，并在其中创建 16 个子目录，每个子目录又包含 256
    个目录。所用磁盘空间的指定应留出足够的缓冲，在可用空间的 50 到最多 80% 之间取值是有意义的。最后两个关于目录数量的数字应该谨慎地增大，因为过多的目录可能会以牺牲性能为代价。如果你有多个要分发缓存的磁盘，可以相应地写入
    `cache_dir` 行。


    cache_access_log /var/squid/logs/access.log 日志文件路径。


    cache_log /var/squid/logs/cache.log 日志文件路径。


    cache_store_log /var/squid/logs/store.log 日志文件路径。

    这些条目指定 Squid 日志文件的路径。通常人们不会修改这些内容。如果 Squid 负载很高，将缓存和 Squid 放在不同的磁盘上可能是有意义。


    emulate_httpd_log 如果有多个日志文件，请更改此条目。不过，某些分析程序可以处理这种情况。


    client_netmask 255.255.255.255 通过此条目可以掩码日志文件中记录的 IP 地址，以隐藏客户端身份。如果填写 255.255.255.0，则
    IP 地址的最后位将被设置为零。


    ftp_user Squid@ 通过此可以设置 Squid 用于匿名 FTP 登录时使用的密码。在调用 FTP 服务器时，通常使用 ''anonymous''
    作为身份，并使用自己的电子邮件地址作为密码，这节省了每次 FTP 下载时输入用户名和密码的步骤。预设 Squid 不带域名，因为客户端来自任何域名。在自己的域名内输入有效的电子邮件地址可能是有意义的，以便
    FTP 服务器可以检查其有效性。


    cache_mgr webmaster 当发生意外崩溃时发送消息的电子邮件地址。默认为 webmaster。


    logfile_rotate 0 当使用 `squid -k rotate` 滚动时，Squid 能够调用备份的日志文件。文件将根据指定的数量进行编号，并在达到指定值后，最旧的文件将被覆盖。该值默认认为
    0，如果日志文件的归档和删除是由 SU Linux 自己的 cron 任务执行的，该任务配置可以在 `/etc/squid.conf` 文件中找到。


    forwarded_for 设置此条目为 off，Squid 将移除 IP 地址。


    append_domain <domain> 通过 `append_domain` 可以指定在未输入时附加的域名。


    negative_ttl 5 minutes negative_dns_ttl 5 通常不需要更改这些值。但如果你有选择，可能会导致互联网暂时无法访问。Squid
    此时会通过请求拒绝，并在拨入 5 分钟后变为成功。


    never_direct allow <acl_name> 防止 Squid 直接转发请求。例如，当你使用代理或通过防火墙允许访问互联网时，这可能是必要的。


    # 访问控制选项


    Squid 提供了一套完善的系统来控制对代理的访问。通过使用所谓的“ACL”（访问控制列表），可以简单且灵活地配置。这些是规则列表，按顺序进行处理。在运行之前，必须先定义
    ACL。一些标准 ACL（如 `all` 和 `localhost`）已经存在。但设置 ACL 还没有产生任何影响。只有当它被实际使用时（例如与 `http_access`
    结合使用），定义的规则才会被处理。


    acl <acl_name> <type> ACL 在定义前通常需要三个参数。`<acl_name>` 名称可以自由选择。对于 `<type>`，可以从多种可能性中进行选择，可以在
    `/etc/squid.conf` 的 `CONTROLS` 部分查看到。`<data>` 需要提供的内容取决于 ACL 的具体类型，也可以从文件中读取，例如读取主机名、IP
    地址或 URL。以下是一些示例：


    ```

    acl meuresdomain srcdomain meine-domain.com

    acl lehr src 192.168.1.0/255.255.255.0

    acl students src 192.168.9.0/255.255.255.0

    acl mittags time MTWF 12:00-15

    ```


    http_access allow <acl_name> 通过 `http_access` 决定使用哪个代理以及哪些内容访问互联网。这里会显示 ACL，`localhost`
    已经在上方定义，并通过 `deny` 或 `allow` 锁定或允许访问。你可以在这里创建一个包含许多 `http_access` 条目的列表，按从上到下的顺序处理；取决于先匹配到哪一个，访问访问的


    '
