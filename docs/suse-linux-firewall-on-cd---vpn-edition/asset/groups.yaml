    \ innerhalb von 10 Sekunden auf einem 500MHz Pentium mit 5900 Domains, URLs (gesamt\
    \ 13780) zu bearbeiten. Es wird daher jedoch nicht empfohlen, mehr als 5 Prozesse\
    \ festzusetzen, da die Zuweisung jeder Prozess zu viel Speicher braucht.\n\n```\n\
    redirect_children 5\n```\n\nAls Lettes senden wir ein HUP-Signal an Squid, damit\
    \ die neue Konfiguration eingelesen wird.\n\n```\nsquid reload\n```\n\nNun können\
    \ Sie Ihre Einstellungen in Cache-Berichten von Calamaris betrachten.\n\n## B.7.\
    \ Erzeugen von Cache-Berichten mit Calamaris\n\nCalamaris ist ein Perl-Script,\
