    eigentliche c-Script heißt /sbin/init.d/firewall. Es wird im Runlevel 2 mit S04firewall_init
    und S99%firewall_setup aufgerufen. S04 erzeugt nur rudimentäre Regeln und keinerlei
    Fehler. Dies macht der S99-Durchlauf des Skriptes, alle Dienste und Interfaces
    vollständig konfiguriert. K51firewall entfernt beim Herunterfahren ("Shutdown")
    alle Filterregeln und erlaubt jedes Paket, schaltet das Routing aus.'
  - '[PAGE 86]


    # 5.3 Die Dienste auf der Firewall


    Dynamisch aus Dialup-Skripten sollte die Firewall immer als

    /sbin/init.d/rc2/S99firewall_setup start

    aufgerufen werden, damit nur dann Filterregeln generiert werden, wenn das auch

    so konfiguriert wird.


    # TRACEROUTE


    Wer möchte, dass traceroute und ähnliche Programme funktionieren, muss

    ggendes konfigurieren:

