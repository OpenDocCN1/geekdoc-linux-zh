    ## 5 用于防火墙的 SuSE Linux Live-CD


    ### 5.1 介绍


    用于 SuSE Linux 防火墙的“Live-CD”是防火墙的“执行”部分。该 Live-CD 是一个基于安全标准的精简版 SuSE Linux。这涉及可用的程序，以及一个“应用层网关”（Application
    on Level Gateway），即作为安全网关进行 IP 包的路由。对服务的请求转发由应用程序（即代理）处理。


    通过代理和不转发 IP 包，还无法阻止（不必要的）IP 包从互联网进入内网，反之亦然。这种防火墙功能由内核的数据包过滤器承担，该过滤器通过 `ipchains(8)`
    进行配置。使用了 CD 的概念。这意味着操作系统和所有程序位于 CD 上的只读文件系统上。启动时会创建一个 RAM 磁盘，用于挂载 Live-CD。通过简单重启电脑即可恢复“初始状态”。如果要更新“基于
    CD 的 SuSE Linux 防火墙”，请将当前的 Live-CD 替换为最新的更新 CD 并重启您的防火墙计算机。


    系统和服务的配置通过磁盘完成，磁盘上存储了所有必要的配置文件。这在启动过程中会以“只读”方式挂载，但为了安全起见，也可以保持只读挂载。配置磁盘的数据会被复制到
    RAM 磁盘中，以便从文件系统中移除存储介质。


