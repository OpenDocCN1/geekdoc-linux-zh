    \ zu erhalten.\n\nÄhnlich ist das Vorgehen, wenn Sie eine Liste abbestellen wollen:\n\
    \n<LISTNAME>-unsubscribe@suse.com\n\nAchten Sie darauf, dass die unsubscribe-Mail\
    \ mit Ihrer korrekten Mail-Adresse geschickt wird.\n\n+   - SuSE FTP-Server\n\
    \  `ftp://ftp.suse.com`\n\naktuelle Information, Updates und Bugfixes\n\nMelden\
    \ Sie sich bei Ihrem System als Benutzer `ftp` an.\n\n# 7.7 Literaturhinweise\n\
