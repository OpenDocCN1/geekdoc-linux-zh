    # MIME Type Filter


    # Einführung


    Contentfilterierung auf der SuSE Linux Firewall auf CD erfolgt durch den httpf-Proxy.


    Ein Teil des Content-Filterings wird durch auf einer HTML-Seite enthaltenen Tags
    angestoßen.


    Content Filtering kann an Hand der sog. MIME-Types der via http abgerufenen Dokumente
    aus dem WWW werden. Zu diesen MIME-Types gehören z. B. Bilder (GIF, JPEG, ...),
    Audiodateien (MPEG, WAV, ...) oder Videos (MPEG, AVI, ...).


    Anhand der übertragenen Bit-Streams lässt sich feststellen, welcher Art MIME-Type
    das angeforderte Dokument generiert.


    Es ist möglich, entsprechende Dateien zu akzeptieren und entweder die Übertragung
    zu erlauben oder zu unterbinden.


    Wenn http einen MIME-Type erkennt, der nicht definiert ist, dann wird das entsprechende
    Objekt nicht geladen.


    Damit wird außerdem möglich, festzustellen, dass der übertragene MIME-Type mit
    dem übertragenen Inhalt nicht übereinstimmt und nicht zum Beispiel ein ausführbares
    Programm als ''harmloses'' GIF-Bild ist.


    Um das Contentfiltering zu konfigurieren, steht in FAS auf dem ''SuSE Adminhost
    for Firewall CD'' ein MIME-Type Editor zur Verfügung.


    Die erzeugte Konfiguration wird dann zusammen mit der übrigen Firewall-Konfiguration
    auf dem Konfigurationsdisk geschrieben.


    # Bedienung


    Das Fenster für MIME-Type zeigt in einer Liste alle schon konfigurierten MIME-Types
    (a vgl. Abbildung 4.32 auf nächsten Seite).


    Die drei Felder ''MIME-Typ'', ''offset'' und ''Zeichenkette'' dienen zur Neuanlage
    eines etwas Typs, dazu zu editieren.


    ''MIME-Typ'' gibt an, um welchen MIME-Type es sich handelt. Offset bezeichnet
    die Stelle nach Dateianfang, an der sich der ''Zeichenkette'' befindet.


    Die beiden Parameter ''Offset'' und ''Zeichenkette'' sind optional, falls die
    Dateiformate eindeutig zu erkennen sind.'
