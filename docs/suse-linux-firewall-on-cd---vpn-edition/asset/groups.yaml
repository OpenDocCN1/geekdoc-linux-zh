    \n图 3.5：YaST2：网络配置\n\n选择网卡并输入 IP 地址和子网掩码。请将所有在给定范围内已存在的名称服务器信息填入，参见下一页的图 3.7。\n\
    \n![](img/594883f46b5a0951172f1e794f42a4a5_26_1.png)\n\n图 3.6：YaST2：网络地址配置\n\n\
    ### 3.3.10 手动网络配置\n\n网络软件的手动配置应作为次选方案。我们建议使用 YaST，但 YaST 无法涵盖网络配置的所有区域，因此在情况下可能需要手动后期处理。\n\
    \n# SuSE Linux 防火墙主机\n\n![](img/594883f46b5a0951172f1e794f42a4a5_27_0.png)\n\n\
    # 配置文件\n\n本节概述了网络配置文件，并解释了它们的功能以及使用的格式。\n\n# /etc/rc.config\n\n大部分网络配置在中央配置文件中完成。更改时，通过\
    \ YaST 或在手动修改文件后调用 SuSEconfig，将从这些条目自动生成以下的大部分数据。启动脚本也通过此文件中的设置进行配置。\n\n> 提示\n\
    > 如果您手动修改此文件，必须在之后始终调用 SuSEconfig，以便将更改后的配置自动写入正确的文件中。\n\n# /etc/hosts\n\n在此文件中（参见下一页的文件\
    \ 3.3.1），将计算机名与 IP 地址进行关联。在未使用名称服务器的情况下，必须列出所有需要建立 IP 连接的计算机。如果某台计算机由 IP 地址、完全限定主机名计算机名（例如\
    \ erde）组成的一行，则将其输入文件。IP 地址必须位于行开头，条目之间通过空格或制表符分隔。注释以 '\\#' 字符开头。\n\n## 3.3 重新安装\
    \ SuSE Linux 防火墙\n\n```\n# hosts\n# This file describes a number of hostname-to-address\n\
