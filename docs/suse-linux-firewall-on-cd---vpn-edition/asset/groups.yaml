    # Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_71_0.png)


    Abbildung 4.41: Lokales Zertifikat wählen


    ## Allgemeine Einstellungen


    Sie werden aufgeordert, einen Namen für die Verbindung einzugeben. Dies erleichtert
    Ihnen die Zuordnung der Verbindung, falls sich mehrere Tunnel verbinden wollen
    (siehe z. B. mehrere Filialen an unterschiedlichen Standorten, die sich über VPN
    verbinden wollen). Der Name einer Verbindung darf nur Buchstaben, Zahlen, Unterstrichen
    und Bindestriche enthalten.


    Sie können bestimmen, ob die „SafeFire auf CD“ auf VPN-Verbindungen warten soll
    (Server Mode) oder ob die Firewall beim Booten eine Verbindung zu einem anderen
    VPN-Server öffnen soll (Client-Modus) (z. B. Außenstellen, die eine Verbindung
    zur Authentifizierung haben sollen, werden dem Client-Modus statt Server-Modus).


    Des Weiteren legen Sie den Authentifizierungs-Mechanismus für diese Verbindung
    fest. Sie können X509-Zertifikate verwenden (empfohlen) oder einen „Pre Shared
    Key“. Das X509-Zertifikat ist vergleichbar mit einem Personausweis, der für einen
    Rechner an einen anderen VPN-Gegenstelle authentifiziert sich. Dies ist der Grund
    dafür, dass Sie für einen Rechner ein Zertifikat auswählen können.


    Der „Pre Shared Key“ ist eine beliebige Zeichenfolge. Zu beachten ist, dass keine
    Anführungszeichen (double quote) im shared-key vorkommen dürfen. Jeder VPN-Tunnel
    kann natürlich einen eigenen „Pre Shared Key“ haben, oder der „Pre Shared Key“
    natürlich an beiden Enden eines Tunnels gleich sein. Die Übermittlung des „Pre
    Shared Keys“ muss auf sichere Weise bewirkt werden, dass jeder, der diesen Key
    kennt, VPN-Gateway authentifizieren und Zugang erhält. Deshalb ist die Verwendung
    von X509-Zertifikaten in jedem Fall vorzuziehen.


    Um die Konfiguration zu vervollständigen, wählen Sie nun den Namen „VPN-Verbindung“
    aus (Abb. 4.44 auf Seite 75).


    ## 4.3 Erstellen einer neuen Firewall-Konfiguration


    ![](img/594883f46b5a0951172f1e794f42a4a5_72_0.png)


    Abbildung 4.2: Eingingerete VPN-Verbindungen


    ### Lokale Konfiguration


    Geben Sie unter ''IP-Adresse'' die IP-Adresse Ihrer Firewall an, auf der die VPN-Verbindungen
    angenommen werden sollen. In dem Feld ''Subnetz'' tragen Sie das IP-Netwerk ein,
    das von einer ankommenden VPN-Verbindung erreicht werden soll. Zu beachten ist,
    dass ''Subnetz'', das Netz aus einem anderen IP-Adressbereich sein muss als der
    Remote-Seite (vgl. Abb. 4.44 auf Seite 75). Auf der anderen Seite des Tunnels
    (als der Remote-Seite) wird automatisch eine Route in dieses Subnetz gesetzt.


    Das Feld Gateway müssen Sie ausüllen, wenn das andere VPN-Gateway durch diesen
    Router erreichbar ist.


    ### Entfernte Konfiguration


    Hier gibt es zwei Möglichkeiten: Die „Road Warrior“-Konfiguration ermöglicht es
    Client, von einer beliebigen IP-Adresse aus einen VPN-Server aufzubauen (z. b.
    Aufbau im Internet über einen beliebigen Provider, Bereitstellen des Zugangs zum
    Internetnetz). Das Feld ''Subnetz'' ist bei Road Warrior-Konfiguration aktiviert.


    „Feste IP-Adresse“ setzt voraus, dass der Client den Zugang zum Internet über
    eine feste IP-Adresse bekommt.


    Das Feld ''Subnetz'' bezeichnet das Netzwerk, das dem Client liegt und von der
    anderen Seite des Tunnels erreicht werden soll. Beachten Sie, dass das Subnetz
    aus einem anderen IP-Adressbereich stammen muss als der Local-Seite. Bei Aufbau
    des Tunnels wird automatisch eine Route in dieses Subnetz gesetzt.


    ‘Gateway‘ gibt, falls notwendig, den Router an, über den das andere VPN-Gateway
    erreicht werden kann.


    ## 4 Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_73_0.png)


    Abbildung 4.43: VPN-Verbindungsdialog - Allgemeine Einstellungen


    Falls Sie für das Authentifizierungs-Verfahren Zertifikate verwenden, müssen Sie
    einen (vorher im Keyring-Modul erstelltes oder im Keyring importiertes) Zertifikat
    angeben (Abb. 4.3.12 auf Seite 61). Mit ‘Auswählen‘ können Sie aus der Liste der
    Zertifikate eines auswählen. Es erscheint ein Dialog mit der Liste verfügbaren
    Zertifikate (Abb. 4.45 auf Seite 76).


    ### Regelnsatz für VPN


    In diesem Dialog können Sie die Dienste freischalten, die durch den VPN-Tunnel
    erreichbar sein sollen (Abb. 4.46 auf Seite 77).


    - **Lokaler Rechner zu entfernt Rechner:** Hier werden die Dienste freischaltet,
    welche der Tunnel auf der entfernten Seite erreicht soll. Wählen Sie die freischaltenden
    TCP/UDP-Ports/Services aus der angezeigten Liste aus.

    - **Entfernter Rechner zu lokal Rechner:** Hier werden die Dienste freischaltet,
    welche der Tunnel auf der lokalen Seite erreicht soll. Wählen Sie Ports/Services,
    die freischaltet werden.


    Falls Sie eine geänderte Auswahl haben, welche nicht in der Liste steht, editieren
    Sie eine der beiden Dateien mit einem Editor Ihrer Wahl:


    ```

    /etc/fas/IpsecTCervices.conf

    /etc/fas/IpsecUDPServices.conf

    ```


    ## 4.3 Erstellen einer neuen Firewall-Konfiguration


    ![](img/594883f46b5a0951172f1e794f42a4a5_74_0.png)


    Abbildung 4.44: VPN-Verbindungsdialog - lokale und entfernte Konfiguration


    Fügen die gewünschten Ports/Services hinzu. Hier haben Sie auch die Möglichkeit,
    den Netzwerkverkehr durch den Tunnel freugeben. Aktivieren Sie dazu die Checkbox
    ''Alles erlauben''. Diese Regeln gelten nur für die VPN-Verbindungen. Alle von
    Ihnen getroffenen Einschränkungen bleiben unberührt.


    ### Verteilung der Zertifikate


    Um die Zertifikate für eine VPN-Verbindung an die Clients zu verteilen, wählen
    Sie im Fenster ''VPN-Verbindung'' die Verbindung aus, deren Zertifikate Sie exportieren
    wollen. Klicken Sie mit der rechten Maustaste auf die ausgewählte Verbindung und
    wählen Sie ''Zertifikate exportieren''. Sie müssen zuerst das Zertifikat-Passwort
    eingeben und dann den Export durchführen. Es erscheint ein Verzeichnis-Listing,
    in dem Sie den Speicher auswählen können. Die Daten werden an diesen Ort geschrieben.
    (Bei Windows-Clients sollten Sie die Daten auf eine DOS formatierte Disk schreiben).


    Die Zertifikate können wie folgt exportiert werden:


    - Die CA im PEM-Format als cacert.pem

    - Das Zertifikat dieser Konfiguration im PEM-Format als srvCert.pem

    - Das Zertifikat und der Key des zu konfigurierenden Rechners im PKCS12 Format
    als remCert.p12; hier müssen Zertifikat und Schlüssel im Keyring gespeichert sein.


    ## Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_75_0.png)


    ### Testen des Tunnels


    - Verbinden der Clients mit dem Server

    - Linux - Linux

    - Linux - andere VPN-Gateways

    - Einrichten von Windows Clients


    ## 4.3.16 Abspeichern der Konfiguration


    Eine Konfiguration können Sie speichern. Um eine Diskette zu speichern, legen
    Sie eine in das Laufwerk, wählen Sie die zu speichernde Konfiguration aus und
    klicken darauf. Jetzt wird die Diskette geschrieben. Zuvor muss die Konfiguration
    als „richtig konfiguriert“ erkannt werden, was mit einem grünen Haken im linken
    Bereich des Dialogs gekennzeichnet wird.


    ## Bearbeiten einer bestehenden Firewall-Konfiguration


    ![](img/594883f46b5a0951172f1e794f42a4a5_76_0.png)


    Abbildung 4.4: Regelsatz für VPN-Tunnel


    ## 4.4 Bearbeiten einer bestehenden Firewall-Konfiguration


    Um eine bestehende Firewall-Konfiguration zu bearbeiten, starten Sie das FAS.
    Melden Sie sich über das Menü „FAS → Anmelden“ als Benutzer an, der die Konfiguration
    erstellt hat, und geben Sie Ihr Passwort ein. Jetzt erhalten Sie eine Liste der
    diesem Benutzer erstellten Konfigurationen. Wählen Sie aus der Liste die Konfiguration
    aus, die Sie bearbeiten wollen. Ein Doppelklick auf den Konfigurationsnamen in
    der Liste im linken Fenster lässt Sie das entsprechenden Modul der Dienste bearbeiten.


    ## 4.5 Testen der Konfiguration


    Mit dem Administrations-Programm erstellte Konfiguration muss vor dem produktiven
    Einsatz getest werden. Dazu wird die Firewall ohne Verbindung zum Internet/Intranet
    gestartet. Um die Tests durchzuführen, verbinden Sie die Firewall direkt (Crossover-Kabel)
    mit dem Adminhost.


    Tests für den Paketfilter können einfach mit einem Portscanner durchgeführt werden.
    Hierfür ist auf dem Adminhost das Programm nmap installiert. Wenn Sie den Portscan
    vom Adminhost aus durchführen möchten, melden Sie sich als Benutzer „root“ an
    und geben folgendes Kommando an eine Konsole ein:


    ```

    root@adminhost: # SuSEfirewall stop

    ```


    So wird sichergestellt, dass alle zurückkommenden IP-Pakete vom Adminhost angenommen
    werden können. Vergessen Sie nicht, den Paketfilter nach Abschluss des Tests wieder
    zu aktivieren.

