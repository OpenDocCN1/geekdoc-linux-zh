    Linux Live-CD for Firewall“ laufen alle diese Prozesse in chroot-Umgebungen.


    Um die Sicherheit des Systems noch weiter zu erhöhen, werden folgende Programme
    bzw. Kernelmodule für den auf Live-CD eingesetzten Linux Kernel (2.2.19) verwendet:
    secumod, compartment, OpenWall-Patches.'
