    # Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_55_0.png)


    Abbildung 4.29: Konfiguration des HTTP-Proxies – Dialog 2


    **ACL bearbeiten** In diesem Fenster können Sie Werte eintragen, ändern, die von
    einer Ihnen gewählten ACL enthalten sind. Sie können in der Eingabefeldeiste neue
    Werte hinzufügen bzw. bestehende Werte editieren oder löschen.


    Haben Sie alle Änderungen vorgenommen, bestätigen Sie die Einstellung mit ''Weiter''.


    # ACLs anordnen


    ![](img/594883f46b5a0951172f1e794f42a4a5_55_1.png)


    Abbildung 4.30: Konfiguration des HTTP-Proxies – Dialog 3


    Zum Einrichten der Regeln (ACL) finden Sie auf dieser Modulseite verschiedene
    Möglichkeiten. Die ausgewählten Einstellungen werden bei ''ACL'' und ''ACL negiert''
    im oberen Teil der Wand ''UND''–verknüpft (vgl. Abbildung 4.30).


    ## 4.3 Erstellen einer neuen Firewall-Konfiguration


    - Mit dem ''Aktion''-Auswahlfeld wählen Sie zwischen ''allow'' zum Erlauben bzw.
    ''deny'' zum Verwehren der Internetzugriffe, die Sie im nachfolgenden Stern festlegen
    können.


    - Bestimmen Sie über ''ACL'' eine bereits angelegte Liste, für die die Einstellungen
    gelten werden.


    - Bestimmen Sie über ''Negate ACL'' eine ACL, die negiert eingesetzt werden soll.
    So können Sie das Abrufen von Internetseiten erlauben (Auswahl bei ''ACL''), die
    nicht über SSL-Ports laufen (Auswahl bei ''Negate ACL'').


    - Eine neue Regel binden Sie über ''Hinzufügen'' ein.


    - Zum Editieren von Regeln klicken Sie auf das entsprechende Listenfeld ein. Daraufhin
    werden die Einstellungen im oberen Teil übernommen. Sie können diese nun wieder
    verändern und mit ''Bearbeiten'' übernehmen.


    - Zum Löschen von Regeln wählen Sie das entsprechende aus und klicken auf ''Löschen''.


    - Im unteren Teil des Fensters finden Sie ein Listenfeld, in dem alle Aktionen
    und zuhörigen ACL-Einstellungen eingetragen sind.


    ![](img/594883f46b5a0951172f1e794f42a4a5_56_0.png)


    > Achtung

    > Die Reihenfolge der Regeln im Listenfeld ist sehr wichtig, denn die aufgestellte
    Liste wird von oben nach unten abgearbeitet. Je nachdem, wie sie zuerst zutrifft,
    wird der Zugriff auf die angeforderte URL freigegeben oder gesperrt.


    - Um eine Regel an eine Stelle zu verschieben, wählen Sie die entsprechende Regel
    und aktivieren Sie im rechten Rand des Fensters zum Verschieben nach unten die
    Schaltfläche mit dem blauen Pfeil nach unten; zum Verschieben nach oben die Schaltfläche
    mit dem blauen Pfeil nach oben.


    - Haben Sie alle Änderungen vorgenommen, bestätigen Sie die Einstellungen mit
    ''Weiter''.


    # Content Filter


    Um HTML-Seinhalte zu filtern bzw. bestimmte Seiteninhalte zu durchsuchen und in
    zu speichern, zu aktivieren, verwenden Sie die Checkbox bei ''Content Filter''
    (vgl. Abbildung 4.31 auf der nächsten Seite).


    ![](img/594883f46b5a0951172f1e794f42a4a5_56_1.png)


    > Hinweis

    > Sie sollten HTML programmieren können, um diesen Filter zu konfigurieren. Die
    „Tags“ und „Attribute“, von denen im Folgenden die Rede ist, sind Komponenten
    aus HTML, der Beschreibungssprache, in der Webseiten geschrieben.


    # Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_57_0.png)


    Abbildung 4.31: Konfiguration der HTTP-Proxies – Dialog 4


    Alle angelegten Filtereinstellungen finden sich im unteren Teil des Fensters.
    Dort sind Typen Namen zugewiesen, Aktionen definiert und Ersetzungen angegeben.
    Beachten Sie bitte, dass jedes HTML-Tag oder Attribut, das nicht definiert ist,
    abgelehnt wird.


    Gehen Sie sich einen Filterregel an, den entsprechenden Typ aus dem gleichen Auswahlfeld
    wählen. Zur Wahl stehen ''tag'' und ''attr'' für Attribut. Im Eingabefeld ''Name''
    geben Sie den Text des ''Tags'' oder ''Attribute'' an und wählen anschließend
    eine Aktion aus. Mehrfachnung von Aktionen ist möglich. Zur Wahl stehen ihnen:


    - allow: das ausgewählte Tag/Attribut.

    - log: setzt einen Eintrag ins so heißt ''log-file'' und kann später für das Erstellen
    von Filterstrategien genutzt werden.

    - replcount: das Tag/Attribut und das Auswerten der Attribut wird fortgesetzt.

    - replabort: das Tag/Attribut und das Auswerten der Attribut wird abgebrochen.


    - Um ganze Code-Zeilen aus den angeforderten Dokumenten zu entfernen, folgen diese
    zwei Aktionen:


    replskip: setzt den Beginn einer Auslassung, die nicht an den Benutzer weitergeleitet
    wird.


    replendskip: das Ende der Auslassung.


    Im Eingabefeld ''Ersetzen durch'' geben Sie die Zeichenkette ein, die an der Stelle
    eingesetzt wird.


    ## 4.3.1 Erstellen einer neuen Firewall-Konfiguration (Fortsetzung)


    - Zum Editieren von Regeln wählen Sie die entsprechende aus dem Listenfeld. Daraufhin
