    ## 5.3.7 chroot, secumod, compartment, Kernel-capabilities


    Um die Sicherheit auf der Firewall zu erhöhen, laufen auf SuSE Live-CD für die
    Dienste in einer chroot-Umgebung. Außerdem werden das „secumod“-Kernelmodul und
    „compartment“ verwendet. Durch das Setzen von Capability-Bits im Kernel wird die
    Sicherheit von Programmen im System erhöht.


    chroot Mit mit Programm eine Sicht auf das Dateystem widerruflich eine neue „root“
    für das Dateystem festgelegt. Sobald das Programm auf den Ausschnitt des Dateystems
    festgelegt ist, übernimmt nicht die Sicht des gesamten Dateystems dieses Programms
    nicht mehr. Selbst wenn das Programm crashed, bleibt der Angreifer in der chroot-Umgebung
    und kann das eigene System nicht beschädigen.


    secumod Spezielles Kernelmodul, das die Sicherheit des Systems erhöht. Dazu gehört
    z. B.:

    - Trusted Path

    - Verbot von Hardlinks auf Dateien anzuzeigen, die einem nicht gehören

    - Schutz des proc-Files,

    - Symlinks werden nicht verfolgt, wenn sie nicht dem gerade laufenden Prozess
    (Ausnahme: der Prozess läuft ‚root’-rechten) gehören.

    - Schutz von fifos,

    - syscall tracking,

    - logging,

    - Setzen von Capabilities


    compartment ermöglicht das Lauf von Programmen/Diensten in chroot-jails mit unprivierten
    Benutzern/Gruppen. Es unterstützt Skripte, die vor dem eigentlichen Programm aufgerufen
    werden (z. B. zum Aufbau einer Umgebung).


    # kernelcaps Capability-Bits des Kernels zur Erhöhung der Sicherheit durch Begrenzung
    des ausführbaren Programs. Die Capabilities sind unter

    ```

    /usr/include/capability

    ```

    dokumentiert. Eine relativ einfache Möglichkeit die Capabilities für ein Programm
    anzugeben, ist die Verwendung des Program compartment.


    ## 5.4 Die Konfigurationsdiskette


    Auf der Konfigurationsdiskette ist die komplette Systemkonfiguration und die Konfiguration
    der Applications-Level-Gateways enthalten. Die Konfigurationsdiskette muss mit
    einem ext2-Dateystem versehen werden und mit folgendem Label "SuSE-FW" erhalten:


    ```

    /bin/e2label/dev/fd0 SuSE-FW

    ```

    Ohne dieses Label wird Konfigurationsdiskette nicht erkannt. Das FAS (Firewall
    Administration) auf dem SuSE Linux Adminhost beim Booten erzeugt das Dateystem
    automatisch. Die Konfigurationsdiskette wird während des Bootens der Live-CD eingebunden.


    ### 5.4.1 Erstellen der Konfigurationsdiskette


    Die Konfigurationsdiskette lässt sich auf dem SuSE Linux Adminhost mit der Administrations-Oberfläche
    erzeugen. Das FAS auf dem SuSE Linux Adminhost erzeugt ein tar-archiv, das dann
    entpackt wird. Das ist die empfehlene Methode. Konfigurationsdateien mit einem
    Editor zu bearbeiten ist nur für Experten ratsam, die wirklich wissen was sie
    tun. Es gibt hierfür keinen Support.


    ### 5.4.2 Die Konfigurationsdateien


    Die folgende Übersicht bietet die Konfigurationsdateien, die sich auf der Diskette
    befinden, und dient Ihrer Information; die werden mit der Admin-Oberfläche erstellt:


    ```

    /etc/hosts (vgl. man hosts)

    /etc/hosts.allow (vgl. man hosts_access)

    /etc/hosts.deny (vgl. man hosts_access)

    /etc/inittab (man inittab)

    /etc/isdn/

    /etc/cpe/

    /etc/live-setup.conf

    /etc/passwd

    /etc/ppp/

    /etc/localtime

    /etc/modules.boot

    ```


    In der Datei /etc/modules.boot können Sie ladbare Kernelmodule angeben, die beim
    Systemstart geladen werden. Sie werden mit dem relativen Pfadnamen von Verzeichnis
    /lib/modules/<Kernelversion> angegeben. Falls nötig, können Sie auch Optionen
    an das Modul einbauen, wie z. B. IRQ oder IO-Adresse der verwendeten Hardware.
