    # 7.6.2 Kostenpflichtiger Support


    Selbst wenn ein Betriebssystem für Anlagen dazu mitbringt: Erst durch professionelle
    und kompetente Betreuung wird es zu ernsthaften Alternativen für den Einsatz im
    betrieblichen Alltag. SuSE garantiert diesen Service für Linux. Alle Informationen
    hierzu finden Sie ebenfalls beim zentralen Support-Portal für SuSE Linux:


    ```

    http://support.suse.de

    ```


    # Individuelle Projekte und Beratung


    Sie möchten SuSE Linux in Ihrem Unternehmen einsetzen. Wir bieten Ihnen kompetente
    Beratung und Lösungen, um Linux in Ihrem IT-Umfeld optimal zu nutzen.

    Wir haben von kompetenter Linux-Anbieter viel Erfahrung im Einsatz von Linux-Servern
    gewonnen. Nutzen Sie das Knowhow von Experten, um Ihre Projekte erfolgreich durchzuführen.
    Unsere Stärke ist Vielseitigkeit, ob um Datenbanken, Security-Konzepte, Internet-Anbindung
    oder firmenweite: Linux ist mit der richtigen Software eine starke Plattform für
    Ihre Anwendungen.

    Unser Angebot reicht von der Konzeption, Implementation und Konfiguration von
    Server-Systemen bis zum kompletten Infrastruktur-Beratung.

    Sie möchten z. B. Ihre Internet-Präsenz auf Basis von SuSE Linux realisieren und
    benötigen eine entsprechende Lösung für Web-Server, E-Mail und sichere Internet-Anbindung?
    Unsere Systemater konzipieren und implementieren mit Ihnen gemeinsam die richtige
    Lösung.'
  - '[PAGE 118]


    # 7.6 Professionelle Hilfe und Support


    Sie betreuen ein komplexes, heterogenes Netzwerk und möchten Linuxrieren? Wir
    beraten und unterstützen Sie bei Design und Rollout komplexer Server-Lösungen.


    Sie haben spezielle Anforderungen, die mit Standard-Software nicht abzudecken
    sind? Wir können Ihnen mit individuellen Schulungen weiterhelfen:


    SuSE Linux AG

    Schanzäckerstraße 10

    D-90443 Nürnberg

    Tel: +49-911-740-53-0

    Fax: +49-911-740-53-479

    E-Mail: suse@suse.de


    Vertreten durch unsere Regional Service Center im In und Ausland, ebenso wie durch
    Support- und Development-Center in Nürnberg. Dabei unterstützt Sie vor Ort die
    SuSE Linux AG:


    +   - Rollout- und Implementation-Services

    - Infrastruktur-Beratung

    - Intranet-Server-Lösungen

    - Internet-Server-Lösungen

