- md: "\n## C.1 SSH – secure shell, die sichere Alternative\n\nhannes:~ scp -r src/\
    \ sonne:backup/\nkopiert den gesamten Inhalt des Verzeichnisses src/ inklusive\
    \ aller Verzeichnisse auf den Rechner sonne und dort im Verzeichnis backup/\n\
    Dies wird automatisch angelegt, wenn es fehlt.\n\nMittels der Option -p scp wird\
    \ der Zeitstempel der Dateien erhalten. -C sorgt für eine komprimierte Übertragung.\
    \ Dadurch wird einerseits das zu übertragende Datenvolumen minimiert, andererseits\
    \ ein höherer Rechenaufwand erforderlich.\n\n## C.1.4 sftp - sicherere Dateiübertragung\n\
    \nAlternativ kann man zu sicheren Datenübertragung sftp verwenden. sftp bietet\
    \ innerhalb der Sitzung viele von ftp bekannten Kommandos. Gegenüber scp mag es\
    \ bei der Übertragung von Daten, wenn Dateinamen unbekannt sind, von Vorteil sein.\n\
    \n## C.1.5 Der SSH Daemon (sshd) – die Serverseite\n\nDer SSH-Daemon ist Bestandteil\
    \ des SSH-Pakets und wird in SuSE Linux automatisch auf Runlevel 3 und 5 gestartet.\
    \ In /etc/rc.config ist die Variable START_SSH auf zwei eingestellt.\nWährend\
    \ des ersten Starts generiert der Daemon die zwei Schlüsselpaare. Die Schlüsselpaare\
    \ bestehen aus einem privaten und einem öffentlichen (engl. public) Schlüssel.\
    \ Deshalb bezeichnet man dies als public-basiertes Verfahren. Um die Kommunikation\
    \ mittels SSH zu gewährleisten, darf ausschließlich der Systemadministrator die\
    \ Dateien der privaten Schlüssel lesen. Die Daterechte wurden bei Vorerterstellung\
    \ restriktiv gesetzt. Die privaten Schlüssel werden lediglich lokal vom SSH-Daemon\
    \ benötigt und dürfen an niemanden weitergegeben werden. Zudem können lediglich\
    \ die öffentlichen an Kommunikationspartner weitergegeben (an Namiendendung -pub\
    \ erkennbar) und für alle Benutzer lesbar werden.\n\nEine Verbindung wird vom\
    \ SSH-Client eingeleitet. Der wartende SSH-Daemon und der anfragende SSH-Client\
    \ schauen Identifikationsdaten aus, um die Protokoll- und Serverversion abzuggleichen\
    \ und die Verbindung zu einem falschen Port auszuschließen. Ein Prozess des ursprünglichen\
    \ SSH-Daemons antwortet, sodass gleichzeitig viele SSH-Verbindungen möglich sind.\n\
    \nDer Server sendet eigenen host key und einen stündlich vom SSH-Daemon neu generierten\
    \ server key (engl. encrypt), dem SSH-Client einen frei gewählten Sitzungsschlüssel\
    \ (engl. session key) und sendet ihn an den SSH-Server. Dieser dient dem Server\
    \ der gewählten Verschlüsselungsmethode (engl. cipher).\n\nDie zur Verschlüsselung\
    \ des Sitzungsschlüssels zwingend erforderlichen privaten host und server keys\
    \ können nicht auf den öffentlichen Schlüssel geleitet werden.\n\n## Sicherheit\
    \ im Netzwerk\n\nSomit kann der kontaktierte SSH-Daemon mit seinen privaten Schlüsseln\
    \ die Sitzungsschlüssel entschiffern (vgl. /usr/share/doc/packages/openssh/RFC.nroff).\
    \ Diese einleitende Phase der Verbindung kann man mittels der Fehlersuche – und\
    \ des SSH-Clientprogramms nachvollziehen. Erst mit der Bestätigung „Received confirmation.“\
    \ – des SSH-Daemons. Indem der Client alle öffentlichen Schlüssel nach der ersten\
    \ Kontakfnahme in ~/.ssh/known_hosts abfragt, können sogenannte „man-in-the-middle“-Angriffe\
    \ unterbunden werden. SSH-Server, welche Name und IP-Adresse voraussetzen, werden\
    \ durch einen deutlichen Hinweis entfernt. Sie fallen entweder durch einen gegenüber\
    \ von ~/.ssh/known_hosts abweichenden Host-Schlüssel auf, oder können ohne passendes\
    \ Gegenstück den vereinbaren Sitzungsschlüssel nicht entschlüsseln.\n\nEs empfiehlt\
    \ sich, im /etc/ssh/ abgelegten privaten und öffentlichen Schlüssel zu archivieren.\
    \ So können Änderungen der Schlüssel festgestellt und nach einer Neuinstallation\
    \ alles wieder eingespielt werden. Dies erspart den Benutzern die beunruhigende\
    \ Arbeit. Wenn es sich trotz der Warnung **nicht** um den korrekten SSH-Server\
    \ handelt, muss der vorhandene Eintrag zu diesem System aus ~/.ssh/known_hosts\
    \ entfernt werden.\n\n## 1.1.6 SSH-Authentifizierungsmechanismen\n\nJetzt erfolgt\
    \ die eigentliche Authentifizierung, die in ihrer einfachsten Weise aus der Eingabe\
