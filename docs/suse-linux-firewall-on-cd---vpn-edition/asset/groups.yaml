    oder Funktionsausfälle reagieren. Falls ungewöhnliche Ereignisse auftreten, reagieren
    Sie sofort. Erhöhen Sie das Log-Level (falls möglich) und verfeinern Sie Ihre
    Log-Auswertung.


    ## 7 Hilfestellungen


    In diesem Kapitel finden Sie Informationen, wie Sie ein Konzept für den Aufbau
    einer Firewall-Lösung mit der „SuSE Linux Firewall auf CD“ für Ihr Netzwerk erstellen
    können. Sie haben auch jederzeit die Möglichkeit, die Dienstleistungen der SuSE
    Linux AG in Anspruch zu nehmen, um sich für Ihre Bedürfnisse maßgeschneidertes
    Konzept erstellen zu lassen.


    ## 7.1 Troubleshooting


    Hier finden Sie Hilfestellungen, wenn sich der Adminhost nicht installieren lässt
    bzw. die SuSE Linux Live-CD für Firewall nicht bootet.


    ### 7.1.1 Probleme bei der Installation des Adminhosts


    Wenn Sie Schwierigkeiten haben, den SuSE Adminhost zu installieren, steht Ihnen
    der kostenlose SuSE Linux Installationssupport zur Verfügung. Zuvor lohnt sich
    ein Blick in die Support-Datenbank. Hier finden Sie zahlreiche Informationen zu
    diversen Installationsproblemen – eine Stichworthilfe hilft Ihnen dabei:


    ```

    http://sdb.suse.de

    ```


    ### 7.1.2 Probleme beim Booten der Live-CD


    Um die Fehlersuche zu vereinfachen, sollten Sie Folgendes beachten und notieren:


    - Was passiert beim Booten?

    - Werden Dienste nicht gestartet, die konfiguriert wurden (skipped/failed Meldungen)?

    - Gibt es Fehlermeldungen auf der Konsole?

    - Gibt es auf dem tty9/tty12 Fehlermeldungen des Kern? Um diese Meldungen zu sehen,
    wechseln Sie mit Alt + F9 bzw. Alt + F12 auf die entsprechende Konsole.


    ## Hilfestellungen


    Probleme bei der Einbindung in das Netzwerk:


    Beobachten und notieren Sie, welche Art die Probleme sind. Testen Sie stufenweise
    auf der Firewall (melden Sie sich als Benutzer ''root'' auf der Firewall), ob
    die Netzwerk-Interfaces konfiguriert sind:


    ```

    root@firewall # ifconfig

    ```


    Dieser Befehl zeigt Ihnen, welche Interfaces konfiguriert sind und welche IP-Adressen,
    Netzwerkmasken eingestellt sind. Falls notwendig korrigieren Sie die Konfiguration
    mit FAS und erstellen eine neue Konfigurationsdatei. Damit die neue Konfiguration
    verwendet wird, muss der Rechner neu gestartet werden.


    - Welche Dienste funktionieren von der Client-Seite (Intranet) aus? Sollen sie
    funktionieren? Anhand der Logfiles können Sie feststellen, ob es um unberechtigte
    Zugriffe handelt. Versuchen Sie Fehler zu reproduzieren.

    - Funktionieren Zugriffe auf freigegebene Ressourcen? Welche Dienste sind betroffen?
    Soll die Ressource wirklich freigeben? Testen Sie z. B. mit ps, ob der Prozess
    vorhanden ist, d. h. auch zur Verfügung steht. Welche Dienste stehen zur Verfügung,
    kontrollieren Sie Ihre Logfiles. Hier finden sich Meldungen, warum ein Dienst
    gestartet wurde, oder ob versucht wurde, ein Dienst unberechtigterweise in Anspruch
    zu nehmen. Testen Sie von verschiedenen Clients, ob die Firewall-Rechner erreichbar
    und die Proxies ansprechbar sind.


    ## 7.2 Security-Policy und Kommunikationsanalyse


    Für die sichere Anbindung eines internen Netzwerks an das Internet oder ein anderes
    „unsicheres“ Netzwerk sind im Vorfeld einige Dinge abzuklären. Dazu gehört die
    der Security-Policy für das eigene Netzwerk und die Kommunikationsanalyse.


    ### 7.2.1 Die Security Policy


    Die Security-Policy stellt die Grundlage für den Umgang mit allen Programmen,
    Rechnern und Daten dar. Weiterhin wird festgelegt, welche Überwachung der Sicherheitsrichtlinien
    gewährleistet wird und welche Verstöße (von intern/extern) behandelt werden. Um
    eine Security-Policy zu erstellen, fertigt man am besten eine Kommunikationsanalyse
    an. Hierbei sind folgende Themen von großer Wichtigkeit:


    - Zum einen es gilt, den Schutzbedarf zu analysieren. Was muss geschützt werden?

    - Gibt es Bereiche im Intranet, die schützenswerte Daten enthalten (z. B. firmenkritische
    Daten)? Wie liegen diese Daten?

    - Wer darf Zugriff haben? Gibt es Sicherheitsrückungen?

    - Sollen Dienste zur Verfügung stehen? Welche von intern (E-Mail, Datentransfer)
    und welche nach extern (E-Mail)?


    Die Security-Policy muss individuell erstellt und beantwortet werden.


    ### 7.2.2 Kommunikationsanalyse


    Die wichtigste Hilfe für eine Kommunikationsanalyse ist eine Kommunikationsmatrix.
    Hier wird in Tabellenform dargestellt, welche Dienste für welchen Client verwendet
    werden. Erstellen Sie eine Kommunikationsmatrix:


    Testen Sie von verschiedenen Clients, ob die Firewall-Rechner erreichbar und die
    Proxies ansprechbar sind. Ein Beispiel für eine Kommunikationsmatrix:


    | Client | icmp | ftp | smtp | https |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | intern | X | | | | |

    | extern | X | | | | |

    | host1 | X | | | | |

    | host2 | X | | | | |

    | host3 | X | | | | |


    Anhand einer Kommunikationsmatrix behalten Sie den Überblick, welche Dienste für
    welche Client zugänglich sind und angezeigt werden.


    ## 7.3 Dienstleistungen der SuSE Linux AG


    SuSE Linux AG steht Ihnen gerne zur Verfügung für:


    - Beratung: Kommunikationsanalyse

    - Planung: Netzwerkplanung

    - Installation: Integration

    - Wartung: Online-Support

    - Support: Fehlerbehebung


    ## 7.4 Updates


    Beim Betrieb einer Firewall ist die permanente Pflege der Software extrem wichtig.
    Sobald eine Sicherheitslücke entdeckt wird, muss ein Update der Firewall stattfinden.
    Sicherheitsupdates für SuSE Linux werden zur Verfügung. Diese Pakete laden Sie
    z. B. mit dem Kommando:


    ```

    root@adminhost:$ rpm -uh paket.rpm

    ```


    Folgen Sie auch den Security-Mailinglisten:


    - http://lists.suse.com/archive/suse-security

    - http://www.suse.de/de/support/security/index.html


