    ## 4.3 Erstellen einer neuen Firewall-Konfiguration


    ![](img/594883f46b5a0951172f1e794f42a4a5_66_0.png)


    Abbildung 4.38: Zeitserver angeben im NTP-Modul


    Das NTP-Protokoll ist UDP-basiert. Sie müssen die entsprechenden Ports in Ihrem
    Paketfilter freischalten. Sie können die Namen oder die IP-Adressen des Zeitserver
    angeben.


    ### 4.3.14 Rinetd


    Bei dem Programm rinetd handelt es sich um einen generischen Proxy; d. h. handelt
    es sich um Software, die auf einem Interface eine Verbindung nimmt und auf einem
    Interface die ankommenden Daten an einen anderen Computer weitergibt. Dies geschieht
    portunabhängig. Es handelt sich sozus als Routing von tcp-Verbindungen auf der
    Application Ebene.


    Rinetd kann nur 1:1 Verbindungen routen. So ist ein Einsatz als Ftp-Proxy nicht
    möglich, da eine ftp-Verbindung aus zwei „Kanälen“ besteht.


    Die Konfiguration des rinetd erfolgt durch das rinetd-Modul der Firewall Administration
    FAS. Der generische Proxy rinetd sollte dann zum Einsatz kommen, wenn kein spezialiertes
    Application-Level-Gateway gibt (wie z. B. ftp-proxy-suite, squid usw.). Mit rinetd
    lassen sich auf einfache und sichere Verbindungen für z. B. pop3 durch die Firewall
    leiten.


    rinetd unterstützt auch vollständiges Logging, d. h. alle eingehenden Verbindungen
    werden von syslogd mitgeschrieben. Lesen Sie dazu die Manual-Seiten zu rinetd
    (Manual-Page von rinetd (rinetd)).


    ### rinetd-Konfiguration


    Die Konfiguration des Programms rinetd erfolgt durch FAS. Sie können rinetd-Verbindungen
    einrichten, bearbeiten und löschen.


    ## 4 Firewall Administration System (FAS)


    Sie benötigen folgende Daten:


    - Die IP-Adresse, auf der die Firewall Verbindungen von rinetd entgegennehmen
    soll.

    - Die Portnummer oder der Service-Name (siehe auch /etc/services), auf dem die
    Anfrage kommen.

    - Die IP-Adresse des Hosts, der die rinetd-Verbindung erreicht wird und der Port,
    auf dem dieser dient.


    Sie müssen natürlich alle Service-Ports auf dem Netzwerksinterfaces, die mit rinetd
    weiterleiten werden, im PaketfilterFirewall-Modul freischalten. Dies können mit
    dem SuSEFirewall-Modul durchführen.


    Für die Konfiguration von TCP mit rinetd im Modul-Fenster sehen Sie alle mit das
    Sie bereits eingerichteten rinetd-Verbindungen ("rinetd-Modul") zur Verfügung
    (Abb. 4.39).


    ![](img/594883f46b5a0951172f1e794f42a4a5_67_0.png)


    Abbildung 4.39: rinetd-Modul mit eingerichteten rinetd-Verbindungen


    Durch Doppelklicken einer bereits eingerichteten Verbindung können Sie die zusätzlichen
    allow- und deny-Attribute sichtbar machen. Mit den folgenden Dialogen starten
    Sie Ihren Proxy rinetd konfigurieren. Nach dem Starten des rinetd-Moduls sehen
    Sie alle angelegten Forwarding rules (Abb. 4.39).


    Zum Anlegen einer neuen Verbindung klicken Sie auf den Button ''Hinzufügen''.
    Es erscheint das Konfigurationsfenster des Moduls (Abb. 4.40) auf der nächsten
    Seite.


    Eine Regel besteht aus folgenden Teilen: Bindadresse, Bindport, Verbindungsadresse,
    Anschlussport


    **Bindadresse** ist die IP-Adresse, für die eine rinetd eine Verbindung annehmen
    soll.


    ## 4.3 Erstellen einer neuen Firewall-Konfiguration


    ![](img/594883f46b5a0951172f1e794f42a4a5_68_0.png)


    Abbildung 4.40: Rinetd-Konfigurationsfenster


    **Bindport** ist die Portnummer des Dienstes, der weitergeleitet wird.


    **Verbindungsadresse** ist die IP-Adresse des Rechners, der einen Dienst zur Verfügung
    stellt.


    **Anschlussport** ist der zum Dienst zugehörige Portnummer.


    **Beispiel:**


    Sie wollen von einem Netz aus auf das interne Interface Ihrer Firewall (z. B.
    10.10.10.1). Der Bindport ist der pop-3Port (110).


    Die Verbindungsadresse ist die IP-Adresse des pop-Servers im Internet (z. B. 195.23.82.20)
    und der Anschlussport des Port, der dem pop-Service angefordert wird (normalerweise
    Port 110). Diese Eingaben müssen folgles lauten:


    | Bindadresse | Bindport | Verbindungsadresse | Anschlussport |

    | :--- | :--- | :--- | :--- |

    | 10.10.10.1 | 110 | 195.23.82.20 | 110 |


    **Zusätzliche Möglichkeiten:**


    Es ist möglich, einer Forwarding-Regel zusätzlich noch weiterer Allow- oder Deny-Regeln
    mitzugeben. Es können entweder Allow- oder Deny-Regeln Firewall Administration
    System (FAS) einer Forwarding-Regel mitgegeben werden.


    Zu Allow und Deny wird als Parameter eine IP-Adresse oder ein IP-Adressbereich
    angegeben. Es sind alle Zeichen:


    - **Allow:** Wenn eine Verbindung entspricht, wird sie gelassen.

    - **Deny:** Wenn eine Verbindung entspricht, wird sie abgelehnt.


    Die Zeichen:

    - `?` für eine einzelne IP-Adresse.

    - `.` für einen IP-Adressbereich.

    - `*` für alle Zeichen.


    Um die Einstellungen zu speichern, bestätigen Sie mit ''OK''. Um eine bestehende
    Regel zu editieren, wählen Sie die entsprechende Regel in der Liste und klicken
    auf ''Bearbeiten''. Um eine Regel zu entfernen, klicken Sie auf den ''Löschen''.


    ### 4.3.15 VPN Connections (IPsec)


    Das VPN-Modul ermöglicht, sichere Tunnel zwischen Computern herzustellen. IPsec
    ist ein Protokoll, das VPN-Netzwerke ermöglicht. Die Daten, die durch diesen Tunnel
    werden, werden verschlüsselt.


    Die IP-Pakete, die durch den Tunnel geleitet werden, werden in der chain „ipsec“
    gefiltert. Wenn Sie die Zugriffe auf VPN-Partner oder bestimmte Dienste beschränken,
    müssen Sie weitere Regeln in der Chain „ipsec“ hinzufügen. Diese Regeln können
    Sie mit FAS im Dialog „IP Regeln für VPN Tunnel“ (s. 4.15 auf Seite 74) erzeugen.
    Hierbei ist zu beachten, dass diese Regeln für alle VPN-Verbindungen dieser Firewall-Konfiguration
    gelten.


    Um IPsec zu verwenden, muss das Firewall-Script angepasst werden:


    ```bash

    ipchains -N ipsec

    ipchains -A input -j ipsec

    ```


    Diese Regel führt dazu, dass ankommende Pakete durch ipsec geschickt werden. Dies
    sollte relativ früh in ipchains passieren, damit Pakete korrekt verarbeitet werden.


    Speichern Sie wie gewohnt Ihre Filterregeln mit ipchains-save. Die zusätzlichen
    Filter werden benötigt, damit beim Start von Ipsec die notwendigen Ports freigaltet
    werden.


    ### Einrichten von Ipsec mit FAS


    Im ersten Dialog des Moduls („Wählen Sie das lokale Zertifikat“) wird das X.509-Zertifikat
    für die Authentifizierung auszuwählen (Abb. 4). Zur Erstellung von Zertifikate
    siehe Kap. 4.13 auf Seite 61.


    Im zweiten Dialog richten Sie die einzelnen VPN-Verbindungen ein. In einer Tabelle
    werden Ihnen alle eingerichteten VPNs angezeigt (Abb. 4.42 auf Tabelle 73).


    Wählen Sie „Hinzufügen“, um eine neue VPN-Verbindung einzurichten. In dem erscheinenden
    Dialog sehen Sie zwei Karte-Karten (s. Abb. 4.43 auf Seite 74: ‘Allgemeine Einstellungen’
    und ‘VPN Verbindung’).


    ![](img/594883f46b5a0951172f1e794f42a4a5_70_0.png)


    Abbildung 4.39: rinetd-Modul mit eingerichteten rinetd-Verbindungen

