- md: '

    # SuSE Linux Live-CD für Firewall


    Für ein „sicheres“ System sollten Sie außerdem folgendes beachten: Sichern Sie
    alle an nicht vertrauenswürdigen Netzen (z. B. Internet) angebotenen Dienste durch
    die Verwendung von Software, die im Hinblick auf Sicherheit entwickelt worden
    (z. B. posix und ssh). Setzen Sie keine Software ein, die aus nicht-vertrauenswürdigen
    Quellen sind. Darüber hinaus sollten Sie regelmäßig die Sicherheit Ihres Servers
    überprüfen.


    # Konfiguration des SuSE-Firewall-Skripts


    Das Firewall-Skript starten zu können, muss auf jeden Fall die Variable START_FW
    in der Datei /etc/rc.config auf „yes“ gesetzt sein. Verwendung des SuSE Firewall
    Admin-hosts geschieht automatisch.

    Wenn es bei Ihrem Rechner um eine Firewall handelt, die wie ein Proxy funktioniert
    (also Routing zwischen den Netzwerken), oder wenn Sie außen sind, der gleichzeitig
    mit dem Internet und intern verbunden sind, müssen Sie die Punkte 2), 3), 9) und
    evtl. 7), 10), 11), 12), 14) und 18 konfigurieren.


    Wenn der Rechner als Firewall dient und die Funktionalität von Routing bzw. Masquerading
    zur Verfügung stellen soll, müssen Sie die Punkte 2), 5, 6), 9) und evtl. 7),
    10), 11), 12), 15) bearbeiten.


    Wenn Sie genau wissen, was Sie tun, können Sie die Punkte 16), 17), 18) und die
    Experten-Optionen (20 bis 21) und 22 konfigurieren. SuSE empfiehlt, diesen Abstand
    zu nehmen.


    Wenn Sie „diald“ oder „ISDN dial-on-demand“ benutzen möchten, sollten Sie den
    Punkt 18 setzen.


    Um Programme wie traceroute mit Ihrer Firewall zusammen zu verwenden, müssen Sie
    die Optionen auf „yes“ setzen: 11 (nur UDP), 19 und 20.

    Wenn Sie Paket-Filter-Regeln selbst dann laden wollen, wenn sie noch nicht verfügbar
    sind, dann konfigurieren Sie eine statische IP und Netzwerkmaske. Beachten Sie
    die Beispiele unter (2), 3) und 4).


    Beachten Sie, wenn Sie Service-Names verwenden, diese in /etc/services stehen.
    Es gibt z. B. keine Service DNS, die richtige Bezeichnung ist „domain; E-Mail
    heißt „smtp"

    Alles Routing zwischen Interfaces mit Ausnahme von Masquerading verlangt, FW_ROUTABLE
    auf yes gesetzt sein. Außerdem werden die Variablen FW_FIREWALL_TCP und/oder FW_FIREWALL_UDP.


    Soll das Firewall-Skript beim Systemboot gestartet werden?


    - 1. Soll hier die Variable START_FW in /etc/rc.config auf „yes“ gesetzt werden.

    - 2. Welche Netzwerinterfaces sind mit dem Internet oder nicht vertrauenswürdigen
    Netzwerken verbunden? Geben Sie hier alle Netzwerke, die nicht vertrauenswürdig
    sind, können beliebig viele Interfaces durch Leerzeichen angeben, z. B. „eth0“
    oder „ippp0 ipp1".


    # FW_DEV_WORLD="


    Sie können eine statische IP-Adresse und eine Netzwerkmaske angeben, um damit
    das Laden einer Paketfilter-Regel für ein Interface zu erzwingen, das noch nicht
    zur Verfügung steht.


    ```

    FW_DEV_WORLD_[device]="IP_ADDRESS NETMASK"

    ```


    Sie müssen trotzdem FW_DEV_WORLD definieren! Der Eintrag sieht dann aus, z. B.
    so:


    ```

    FW_DEV_WORLD_ippp0="10.0.0.1 255.255.250"

    ```


    - 3. Welche Netzwerkinterfaces sind mit dem internen Netzwerk verbunden? Geben
    Sie alle Netzwerk-Devices an, die vertrauenswürdig sind. Wenn Sie nicht mit einem
    vertrauenswürdigigen Netzwerk verbunden sind, (z. B. durch eine Nur-Verbindung
    ohne Verbindung) lassen Sie die Liste leer. Sie können wieder viele Netzwerk-Devices
    durch Leerzeichen getrennt angeben, also z. B. "eth0" oder "eth0 ippp0".


    ```

    FW_DEV_INT="

    ```


    Sie können eine statische IP-Adresse und eine Netzwerkmaske angeben, um damit
    das Laden einer Paketfilter-Regel für ein Interface zu erzwingen, das noch nicht
    zur Verfügung steht:


    ```

    FW_DEV_INT_[device]="IP_ADDRESS NETMASK"

    ```


    Sie müssen außerdem FW_DEV_INT definieren! Siehe dazu das folgende Beispiel für
    das interne Interface "eth0":


    ```

    FW_DEV_eth0="192.168.1.1 255.255.250"

    ```


    - 4. Welche Interface zeigt auf die DMZ? Geben Sie alle Netzwerkdevices an, die
    auf die DMZ zeigen. Achtung: Konfigurieren Sie die Variablen FW_FORWARD_TCP und
    FW_FORWARD_UDP, um die Dienste anzu, die dem Internet zur Verfügung stellen wollen,
    und setzen Sie die FW_ROUTE auf "yes". Sie können z. B. wählen: "tr0", "eth01"
    oder "".


    ```

    FW_DEV_DMZ="

    ```


    Sie können eine statische IP-Adresse und eine Netzwerkmaske angeben, um damit
    das Laden einer Paketfilter-Regel für ein Interface zu erzwingen, das noch nicht
    zur Verfügung steht:


    ```

    FW_DEV_DMZ_[device]="IP_ADDRESS NETMASK"

    ```


    Sie müssen trotzdem FW_DEV_DMZ definieren! Siehe dazu das folgende Beispiel für
    das DMZ-Interface "eth1":


    ```

    FW_DEV_DMZ_eth1="192.168.1.1 255.255.250"

    ```


    - 5. Soll "Routing" zwischen dem Internet, der DMZ und dem internen Netzwerk aktiviert
    werden? Dazu brauchen Sie FW_DEV_INT oder FW_DEV_DMZ. Sie müssen die Variable
    auf "yes" setzen, wenn Sie entweder Maschinen maskieren oder Zugriff auf die DMZ
    erlauben wollen. Diese Option überschreibt die Variable IP_FORWARD in /etc/rc.config.


    # SuSE Linux Live-CD für Firewall


    Wenn Sie diese Option setzen, passiert nichts. Entweder aktivieren Sie Masquerading
    mit der Variable FW_MASQUERADE oder Sie konfigurieren FW_FORWARD_TCP und/oder
    FW_FORWARD_UDP, um zu definieren, was geroutet wird. Sie können "yes" oder "no"
    angeben.


    ```

    FW_ROUTE="no"

    ```


    6. Wollen Sie interne Netzwerke nach außen maskieren? Nutzen Sie dazu FW_DEV_INT
    und FW_ROUTE. „Masquerading“ bedeutet, dass alle Rechner, die Dienste des Internets
    nutzen, von der Firewall maskiert werden. Beachten Sie, dass es sicherer ist,
    über Proxies mit dem Internet zu kommunizieren.


    ```

    FW_MASQUERADE="no"

    ```


    Welche internen Rechner/Netzwerke Zugriff auf das Internet haben? Lassen Sie die
    Liste leer oder geben Sie beliebig viele Netzwerk/Host durch Leerzeichen an, an
    dem das Maskieren stattfinden.


    ```

    FW_MASQ_NETS="FW_DEV_WORLD"

    ```


    7. Wollen Sie die Firewall vor internen Netzwerken schützen? Das erreichen Sie
    mit FW_DEV_INT. Diese Variable ist auf "yes" gesetzt, können interne Computer
    nur die von Ihnen fregebenen Dienste nutzen.


    ```

    FW_PROTECT_INTERNAL="yes

    ```


    8. Wollen Sie global Dienste schützen? Wenn Sie "yes" angeben, werden alle Netzwerk-Zugriffe
    auf TCP und UDP von jedem Rechner erlaubt, der an eine bestimmte IP-Adresse gebunden
    oder explizit zugelassen sind. Auswahl "yes" oder "no", default ist "yes".


    ```

    FW_AUTOPROTECT_GLOBAL_SERVICES=""

    ```


    9. Welche Dienste an dem Firewall-Netzwerken vom Internet oder nicht vertrauenswürdig
    (DMZ oder dem Internen) zugänglich sein? (Siehe Nr.13 & 14, wenn Sie Netzwerkverkehr
    durch die Firewall wollen.). Geben Sie alle Port-Nummern oder Protokoll-Namen
    (vgl. /etc/protocols) an. Auswahlmöglichkeiten: Leere Liste oder Portnummern,
    Portnamen (vgl. /etc/services) oder Port-Bereiche (z. B. 1024:2000) durch Leerzeichen
    getrennt oder Dienst (TCP), die von extern nach sichtbar sein sollen, normalerweise
    „smtp domain". Dienste (z. B. SMTP, WWW) müssen in FW_SERVICES_*TCP und in FW_SERVICES_*UDP
    gesetzt werden. Dienste (solo). Für IP-Protokolle (wie GRE für PPTP oder OSPF
    für Routing) müssen Sie FW_SERVICES_*IP mit dem


    ```

    FW_SERVICES_EXTERNAL_TCP=""

    ```


    ```

    FW_SERVICES_EXTERNAL_UDP=""

    ```


    ```

    FW_SERVICES_EXTERNAL_IP=""

    ```


    ```

    FW_SERVICES_DMZ_TCP=""

    ```


    ```

    FW_SERVICES_DMZ_UDP=""

    ```


    ```

    FW_SERVICES_DMZ_IP=""

    ```


    ```

    FW_SERVICES_INTERNAL_TCP=""

    ```


    ```

    FW_SERVICES_INTERNAL_UDP=""

    ```


    ```

    FW_SERVICES_INTERNAL_IP=""

    ```


    - 10. Welche Dienste von vertrauenswürdigen Netzen aus dem Internet erreichbar
    sein? Geben Sie die vertrauenswürdigen Netzwerk innerhalb des Internets an und
    die TCP/UDP-Dienste, die Sie verwenden dürfen. Auswahlmöglichkeiten: leere Liste
    oder beliebige IP-Adresse und/oder Netzwerke durch Leerzeichen getrennt.


    ```

    FW_TRUSTED_NETS=""

    ```


    Geben Sie bei FW_SERVICES_TRUSTED="" eine Liste an, oder die PortNummern bzw.
    die bekannten Portnamen (vgl. /etc/services), oder die Portbereiche durch Leerzeichen
    getrennt, z. B. „25", "ssh", "1:65535", "1 3:5"

