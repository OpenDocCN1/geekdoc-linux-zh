    mit Problemen konfrontieren müssen, die aus der zunehmenden Vernetzung entstehen.
    Bisher war Ihr Netzwerk relativ überschaubar und der Benutzer hatte Kontrolle.
    Sicherheitsaspekte standen dem Netz zur Verfügung, aber die Funktionalität beruhte
    primär auf Vertrauensbeziehungen. Anders wäre ein solches Internet nicht mit angemessenem
    Aufwand zu administrieren. Durch den Internetanschluss ändern sich die Rahmenbedingungen
    für Ihre Administrationsätigkeit dramatisch. Plötzlich gibt es Benutzer, die unbekannt
    Ressourcen Ihres Netzes (z. B. den WWW-Server) nutzen können.


    Es ist klar, dass sich diese Benutzer anders verhalten müssen als die bisher internen
    Benutzer (auch wenn wahrscheinlich 80 % der Angriffe auf ein Unternehmen von außen
    erfolgen). Ein weiterer Grund, den Zugang zum Firmennetz zu begrenzen und zu schützen,
    ist die Tatsache, dass Cracker oder Hacker immer wieder nach Speicherplatz auf
    sind, auf dem sie illegale/gestohlene Software oder schlimmer, strafrechtlich
    relevante Inhalte speichern können. Um Umstände macht sich die Firma selbst strafbar,
    wenn sie keine geeigneten Gegenmaßnahmen ergreift. Es geht auch um Ihren guten
    Ruf.


    Um unerlaubten Zugriff auf das Firmennetz und dessen Ressourcen (Festplatz, CPU-Leistung
    etc.) zu verhindern, stehen heute verschiedene Schutzmaßnahmen zur Verfügung:
    angefangen mit IP-Paketfilter auf einem Router bis hin zu mehrstufigen Lösungen.


