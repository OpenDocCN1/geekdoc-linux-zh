    ## 蠕虫 (Würmer)


    蠕虫经常与病毒等同。但它们有一个显著的区别：蠕虫必须尽可能感染一个业务程序，并且它专门用于尽可能快速在网络中传播。著名的蠕虫如 Ramen、Lion 或 Adore
    利用了 bind 或 lprng 等服务器程序的已知安全漏洞。防御蠕虫相对容易，但在由于被利用的漏洞被获到与蠕虫出现之间，通常需要几天时间才能获得更新包。当然，这前提是管理员会将安全更新安装到其系统中。


    ## C.2.3 提示与技巧：通用说明


    **信息：** 为了高效地处理安全领域，有必要跟上发展并关注最新的安全问题。防止错误的一种极好的保护方法是尽可能快地安装由安全公告（Security-Announcement）公布的更新包。SuSE
    安全公告也通过邮件列表分发，通过 http://www.suse.de/security 的链接可以订阅该列表，use-announce@suse.de 是安全团队提供的带有新信息的更新包的第一信息来源。


    use-announce@suse.de 邮件列表是安全领域非常有用的讨论论坛。您可以通过指定的 URL（如 use-announce@suse.de）订阅该列表。


    世界上著名的安全邮件列表之一是 bugrat@securityfocus.com。阅读此列表平均每天有 25-20 条帖子，建议在具有一定知识的情况下阅读。更多信息可以在
    http://www.securityfocus.com 找到。


    以下列出了一些可能对您有用的基本规则：


    - 避免以 ‘root’ 身份工作，这符合为任务使用最小权限的原则。这减少了进程或攻击的机会，而且在另一方面也减少了错误的发生率。


    - 尽可能使用加密连接进行远程操作。“ssh”（安全外壳）是标准，请避免使用 telnet、ftp、rsh 和 rlogin。


    - 不要使用任何基于 IP 地址的内置身份验证方法。


    - 始终保持您网络领域最重要的包为最新版本，并订阅相关软件公告的邮件列表（例如 bind、sendmail、ssh）。这同样适用于仅具有本地安全相关的软件。


    ## C.2 安全是信任之赖


    - 通过根据您的需求调整 /etc/permissions 文件，优化系统中安全关键型文件的访问权限。一个可以执行 setuid 的程序不再需要执行其任务，但它通常是一个安全问题。通过类似的方法，您可以对不可写的文件和目录进行处理。


    - 禁用所有您并非必需的网络服务。如果您的服务器是公开的，这可以防止用户使用您显式开放的服务（遗留问题）。可以使用 netstat -ap 或 netstat
    -an 选项找到开放的端口（socket 状态为 LISTEN）。通过 -p 选项，可以直接看到哪个进程占用了该端口。


    - 比较您从外部对服务器进行完整扫描获得的结果。这个 nmap 程序对此非常出色。它会扫描每一个端口，并根据您服务器的响应识别哪个端口对应哪个服务。在没有管理员直接许可的情况下，永远不要扫描计算机。记住，不仅会扫描
    TCP 端口，还会扫描 UDP 端口（选项 -s 和 -u）。


    - 为了对系统文件进行额外的完整性检查，您应该使用 tripwire，并在当您想要防止此类访问时加密数据库。此外，务必将机器备份到连接到网络的计算机的外部数据介质上。


