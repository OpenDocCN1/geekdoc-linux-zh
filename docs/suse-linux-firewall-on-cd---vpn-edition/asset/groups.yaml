    damit ein Sicherheitsloch in Ihrem internen Netzwerk. Wenn z. B. Ihr Webserver
    kompromittiert wird, ist Ihr gesamtes Netzwerk ebenfalls unsicher.


    # SuSE Linux Live-CD for Firewall


    Wahlmöglichkeiten: Lassen Sie den Eintrag leer (beste Wahl) oder verwenden Sie
    die folgende Syntax für die Forwarding-Masquerade-Regeln. Die Regeln werden durch
    Leerzeichen getrennt.


    - a) Quell-IP/Netz,

    - b) Ziel-IP (dmz/intern),

    - c) Ziel-Port, getrennt durch Kommata, z. B.: "4.4.4.4/12.0.20.20,22"


    ```

    # Forward TCP connections to masqueraded host

    # Beware to use this!

    FW_MASQ_TCP=""

    # Forward UDP connections to masqueraded host

    # Beware to use this!

    FW_MASQ_UDP=""

    # it is not possible to masquerade other IP protocols

    # hence no _IP variable

    ```


    15. Welche Dienste sollen auf einen lokalen Port dem Firewall-Rechner gelen werden?
    Dies kann verwendet werden, um Ihre internen Benutzer über Ihren HTTP-Proxy zu
    leiten oder alle eingehenden Anfragen auf Port 80 einen sicheren Webserver weiterzuleiten.
    Wahl: Wählen Sie die Liste leer oder verwenden Sie die folgende Syntax für redirecting
    rules:


    a) Quell-IP/Netz,

    b) Ziel-IP/Netz,

    c) ursprünglicher Bestimmungsport,

    d) lokaler Port auf den Netzwerkverkehr umgeben soll, z. B.: "10.0.0/8,0/0,80,172.20.1.80,80"


    ```

    # Redirect connections

    FW_REDIRECT_TCP=""

    # Redirect connections

    FW_REDIRECT_UDP=""

    ```


    16. Welche Log-Level soll erzwungen werden? Sie können angeben, Pakete, die angenommen
    oder abgelehnt werden, loggt werden. Sie können außerdem den Log-Level anmelden,
    "critical" oder alles. Nur für Debugging-Zwecke aktiviert werden für die Variable:
    "yes" oder "no", FW_LOG_*CRIT Standard ist "yes"


    ```

    # Log critical denied packets

    FW_LOG_DENY_CRIT="yes"

    # Log all denied packets

    FW_LOG_DENY_ALL="no"

    # Log critical accepted packets

    FW_LOG_ACCEPT_CRIT="yes"

    # Log all accepted packets

    FW_LOG_ACCEPT_ALL="no"

    ```


    17. Wollen Sie zusätzliche Kernel TCP/IP Sicherheits-Features? Wenn Sie diese
    Variable auf "yes" setzen, werden die folgenden Kerneloptionen gesetzt:


    icmp_ignore_bogus_responses,

    icmp_destunreach_rate,

    icmp_paramprob_rate,

    icmp_timeexceeded_rate,

    ip_local_port_range,

    log_martians,

    mc_forwarding,

    rp_filter,

    routing flush. Auswahl: "yes" oder "no", default ist "yes":

    FW_KERNEL_SECURITY="yes"


    18. Soll das Routing eingeschaltet bleiben, die Paketfilterregeln zurückgesetzt
    werden? Dazu benötigen Sie FW_ROUTE. Wenn Sie "dial" oder "dial-on-demand" via
    ISDN verwenden und IP-Pakete in das Internet gesendet werden sollen, müssen Sie
    diese Funktion einschalten. Masquerading und Routing werden dann vom Skript nicht
    ausgeschaltet wenn es endet. Es kann sein, dass Sie diese Funktionalität brauchen,
    wenn Sie eine DMZ haben. Bedenken Sie allerdings, dass das unsicher ist! Wenn
    die IP-Filterregelnenden und immer noch eine Verbindung an Ihr Netzwerk für Attacken
    offen liegen. Auswahl: "yes" oder "no", Default-Einstellung: "no"

    FW_STOP_PING_ROUTING_STATE="no"


    19. Sollen ICMP pings auf den Firewall-Rechner oder die DMZ erlaubt benötigen
    Sie FW_ROUTE für FW_ALLOW_PING_DMZ Auswahl: "yes" oder "no", Voreinstellung ist
    "no"


    # Erube ping auf Firewall

    FW_ALLOW_PING_FW="yes"

    # Erlaube ping auf DMZ Rechner.

    FW_ALLOW_PING_DMZ="yes"

    ```


    Erstellung eines eigenen Paketfilters mit ipchains


    Wenn Sie nicht das SuSE Firewall-Skript verwenden wollen, haben Sie auch Möglichkeit,
    eigenen Paketfilter mit ipchains zu konfigurieren. Sie erstellen die Filterregeln
    nach Ihren Bedürfn auf einem Linux-Rechner, z. B. dem SuSE-Firewall-Adminhost,
    und speichern dieses Paket-Filter-Setup mit ipchains-save in einer Datei.


    root@adminhost # ipchains-save > mysetup 2>/dev/null


    Mit lassen Sie diese Datei mit Ihrer Paketfilter-Konfiguration in der Konfiguration
    der ,SuSE Linux Live-CD für. Diese Filterregeln werden in der Datei /etc/ipchains
    der Konfigurationsdiskette gespeichert und vom Skript /sbin/init.d/ipchains beim
    Boot-Vorgang des Firewall-Rechners geladen.


