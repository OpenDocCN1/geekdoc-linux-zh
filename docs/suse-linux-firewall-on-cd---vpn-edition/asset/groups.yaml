  - '[PAGE 163]


    # Sicherheit im Netzwerk


    bereits Zugriff auf ein lokales „login“ hat. Viele der bekannt gewenen Fehler
    können über eine Netzwerkverbindung ausgenutzt. Deswegen sind „Buffer Overflows“
    und „Format String Bugs“ nicht direkt auf den lokalen Rechner oder das Netzwerk
    klassifizierbar.


    # Viren


    Entgegenersartiger Veruthaltungen gibt es tatsächlich Viren für Linux. Die bekannt
    Viren sind von ihren Autoren als „Proof-of-Concept“ geschrieben worden, als Beweis,
    dass die Technik funktioniert. Allerdings ist noch keiner dieser Viren in „freier
    Wildbahn“ beobachtet worden.


    Viren benötigen zur Ausbreitung einen Wirt, der nicht nicht lebensgefährlich sei.
    Dieser Virus ist ein Programm oder ein einen Speicherbereich für das System, etwa
    den Master-Boot-Record, und er muss für den Programmcode des Virus beschreibbar
    sein. Linux hat genau die Möglichkeit, Multi-User den Schreibzugriff auf Dateien
    einzuschränken, als insbesondere Systemdateien. Wenn sie als „root“ arbeiten,
    erhöhen sie die Wahrscheinlichkeit, dass Ihr System von einem Virus infiziert
    wird. Berücksichtigt man die Regeln der geringstmöglichen Privilegien, ergeben
    sich Schwierigkeiten mit einem Linux Virus. Daher halten soll sich nicht leichtfertig
    ein Programm aus, das Sie dem Internet beziehen haben und neue Herkunft sie nicht
    kennt. SuSE-rpm Pakete mit dieser digitalen Unterschrift kryptographisch signiert
    und mit dieser Unterschrift das Merzeichen der beim Pakete bei SuSE. Viren sind
    klassische Symptome dafür, dass auch ein höheres System nicht sicher wird, wenn
    der Administrator oder der Benutzer ein mangelndes Sicherheitsbewusstsein hat.


    Viren sind nicht mit Würmern zu verwechseln, die Phänomene auf der Netzwerksicherheit
    sind und keinen Wirt brauchen, um sich zu verbreiten.


    # Netzwerksicherheit


    Bei der lokalen Sicherheit war die Aufgabe, die Benutzer, an denselben Rechner
    arbeiten, voneinander zu trennen, insbesondere den Benutzer „root“. Im Gegensatz
    dazu soll bei Netzwerksicherheit das gesamte System gegen Angriffe auf das Netzwerk
    geschützt werden. Benutzerauthentifizierung beim klassischen Einloggen durch Benutzerkennung
    und Passwort gehört zur lokalen Sicherheit. Bei jedem Einloggen über eine Netzwerkverbindung
    muss man differieren zwischen Sicherheitsaspekten: bis zur erfolgten Authentifizierung
    spricht man von Netzwerksicherheit, nach dem Login geht es um lokale Sicherheit.


    # X-Windows (X11-Authentifizierung)


    Bereits erwähnt ist Netzwerktransparenz eine grundlegende Eigenschaft des Unix-Systems.
    Bei X11, dem Windows-System von Unix, gilt dies nur auf Weiteres in besonderem
    Maße! Sie können sich auf entfer Rechner einloggen und dort ein Programm starten,
    welches dann über das Netzwerk


    ![](img/594883f46b5a0951172f1e794f42a4a5_163_0.png)'
  - '[PAGE 164]


    # C.2 Sicherheit ist Vertrauensache


    auf Ihrem Rechner angezeigt wird. Das Protokoll, welches zwischen der X-Applikation
    und dem X-Server (der lokale Prozess, der Fenster der Grafikkarte zur Anzeige
    bringt) zur Kommunikation verwendet wird, ist recht sparsam, was Netzwerkbandbreiten
    bedeutet. Das ist in den 80er Jahren, als das System eingeführt wurde, zur Verfügung
    stehenden Bandbreiten gerecht.


    Wenn nun ein X-Client das Netzwerk über seinen X-Server nutzen wird, soll der
    Server die Ressource, die er verwaltet (das Display), gegen unberechtigte Nutzer
    schützen. Konkre heißt dies, dass das Client-Programm Rechte bekommt. Bei X-Windows
    geschieht dies über zwei Arten: Host-basierte und cookie-basierte Zugriffskontrolle.
    Erste basiert auf der IP-Adresse des Rechners, auf dem Client-Programm läuft und
    mit dem Programm xhost kontrolliert wird. xhost versucht eine IP-Adresse in einer
    Mini-Datenbank im X-Server einzubauen. Eine Authentifizierung allein auf einer
    IP-Adresse aufzubauen ist jedoch nicht sicher. Es könnte noch ein zweiter Benutzer
    auf dem Rechner mit dem Client-Programm aktiv sein, und dann hätte jeder, der
    die IP-Adresse kennt, Zugriff auf den X-Server. Deswegen soll hier nicht nur auf
    diese Methoden eingegangen werden. Die Manpage von xhost-Kommandos gibt mehr Aufschluss
    über Funktionsweise (und enthält ebenfalls Warn!).


    Bei "cookie“-basierter Zugriffskontrolle wird eine Zeichenkette, die nur der X-Server
    und der legitim eingeloglogte Benutzer kennt, als Passwort eines Ausweises verwendet.
    Dieses „cookie" (das englische Wort Keks und hier chinesische fortune cookies,
    die einen Sprach enthalten) wird in der Datei .Authority im Home-Verzeichnis des
    Benutzers beim login gespeichert und dient jedem X-Windows-client, der ein Fenster
    beim X-Server zur Anzeige bringt, zur Verfügung. Das Programm xauth dient dem
    Werkzeug, die zu untersuchen. Wenn Sie .Authority aus Ihrem Home-Verzeichnis löschen
    oder umbenennen, können Sie keine Fenster von neuen X-Clients öffnen. Näheres
    über Sicherheitsmaßnahmen von X-Windows erfahren Sie in der Manpage von Xsecurity
    (man security).


    ssh (secure shell) kann über eine vollständig verschlüsselte Netzwerkverbindung
    bei einem Benutzer transparent (also nicht direkt sichtbar) die Verbindung zu
    einem X-Server weitergeben. Man spricht von "X11-forwarding". Dabei wird auf Server-Seite
    ein X-Server simuliert und bei der Shell auf der remote-Seite die DISPLAY-Variable
    gesetzt. Der Client öffnet zum Anzeigen eine Verbindung zum ssh daemon (shell
    daemon, das serverseitige Programm), der dann die Verbindung zu den richtigen,
    realen X-Server durchschleust. Wenn Sie X-Clients über das Netzwerk anzeigen lassen
    müssen, sollten sie ssh einmal genauer unter die Lupe nehmen. Die Manpage von
    ssh gibt weitere Auskünfte über diese Funktionalität.'
  - '[PAGE 165]


    # C Sicherheit im Netzwerk


    > Achtung

    Wenn Sie den Rechner, auf dem Sie sich einloggen, nicht als sicher betrachten,
    dann sollten Sie auch keine X-Windows-Verbindungen weiterleiten lassen. Mit eingeschaltetem
    „X11-forwarding“ könnten sich Angreifer über Ihre ssh-Verbindung mit Ihrem X-Server
    authentifiziert verbinden und beispielweise Ihre Tastatur belauschen.


    Weiter Informationen zu ssh finden Sie im Abschnitt C.1 auf Seite 153 dieses Buches.


    # Buffer Overflows und Format String Bugs


    Nicht direkt klassifizbarer in lokal und remote gilt das „Lokale Sicherheit“,
    „Buffer Overflows“ und „Format String Bugs“ Gesagte äquivalent für Netzwerksicherheit.
    Wie auch bei den lokalen Varianten mehrfach früher Buffer Overflows bei Netzwerkdiensten
    zu ‚root‘-Rechten. Soll dies nicht der Fall sein, könnte sich der Angreifer Zugang
    auf einen unprivileierten lokalen Account verschaffen, mit dem er weitere (lokale)
    Sicherheitsprobleme ausnutzen kann, falls diese vorhanden.


    Über das Netzwerk ausbaute Buffer Overflows und Format String Bugs sind wohl die
    häufigsten Varianten von remote-Angriffen überhäuft. Durch Sicherheitsmailinglisten
    werden sogenannte „exploits“ herumgereicht, damit die frischen die frisch gefundenen
    Lücken ausnutzen. Auch jemand, der die genauen Details der Lücke kennt, kann diese
    ausnutzen. Im Laufe der Jahre hat sich herausgestellt, dass durch die Verfügbarkeit
    von „exploitcodes“ generell die Sicherheit von Betriebssystemen erhöht hat, was
    sich jedoch erlaubte, dass Betriebssystementwickler dazu verpflichtet waren, Probleme
    in ihrer Software zu beseitigen. Da in freier Software der Sourcecode für jeden
    hilfreich (SuSE-Linux findet alle verfügbaren Quellen), kann jemand, der eine
    Lücke mit „exploit“ findet, auch gleichzeitig einen Reparaturvorschlag für das
    Problem anbieten.


    # DoS — Denial of Service


    Ziel dieser Art von Angriff ist das Einstellen des Dienstes (oder gleich des ganzen
    Systems). Dies kann auf verschiedene Arten passieren: Durch Überlastung, Beschäftigung
    mit unsinigen Paketen oder durch Ausnutzen von „Remote Buffer Overflows“, die
    direkt durch Ausführen von Programmen auf der remote-Seite ausbeitbar sind.


    Der Zweck eines DoS mag meistens darin begründet, dass der Dienst einfach nicht
    mehr verfügbar ist. Das kann aber weitere Konsequenzen haben. Sie „man in the
    middle: sniffing, connection hijacking, spoofing“ und „DNS poisoning“.'
  - "[PAGE 166]\n\n# man in the middle: sniffing, tcp connection hijacking, spoofing\n\
    \nGanz allgemein gilt: Ein Angriff auf Netzwerk, der der Angreifer eine Position\
    \ zwischen zwei Kommunikationspartnern einnimmt, nennt sich „man in the middle\
    \ attack“. Sie haben in der Regel niemals: Das Opfer nicht davon. Viele Varianten\
    \ sind denkbar: Der Angreifer nimmt die Verbindung entgegen, damit das Opfer mit\
    \ ihm selbst eine Verbindung zum Ziel macht. Das Opfer hat auch, wenn es zu, eine\
    \ Netzwerkverbindung zum falschen Rechner öffnet, welcher sich als das ausgeben.\
    \ Der einfachste „man in the middle attack“ ist ein „sniffer“. Ein Belauscher\
    \ macht sich die Verbindungen, die ihm vorher aufführt (sniffing = engl. schnuffeln).nKomplexer\
    \ wird es, wenn der Angreifer in der Mitte versucht, eine etabierte, bestehende\
    \ Verbindung zu übernehmen (entführen = engl. hijacking).\n der Angreifer die\
    \ Pakete, die an ihn vorgegeben werden, welche weilang analysiert, damit er die\
    \ richtigen TCP-Sequenznummern der TCP-Verbindung verfälschen kann. Wenn er die\
    \ Rolle der Verbindung übernimmt, merkt das das Opfer, der auf der Seite des Opfers\
    \ die Verbindung unstimuliert wird.\n\nDer Angreifer profitiert aus Schwachstellen\
    \ in Protokollen, die nicht kryptographisch gesichert sind und bei denen zu Beginn\
    \ der Verbindung eine Authentifizierung stattfindet. „Spoofing“ nennt sich das\
    \ Verschicken von Paketen mit modifizierten Absenderdaten, hauptsächlich auf der\
    \ IP Adresse.\nDie massiven Angriffsvarianten das Verschicken von gefälschten\
    \ Paketen, was unter Unix/Linux nur auf dem Superuser (‘root’) darf.\nViele der\
    \ Angriffsmöglichkeiten in Kombination mit einem DoS gibt es eine Möglichkeit,\
    \ einen Rechner schlagartig vom Netzwerk zu trennen (wenn nur für kurze Zeit),\
    \ dann wirkt sich das auflichen einen aktiven Angriff aus, wenn keine Grenzen\
    \ mehr gewartet werden.\n\n# DNS poisoning\n\nDer Angreifer versucht, mit gefälschten\
    \ („spoofed“) DNS-Antwortpaketen den cache eines DNS-Servers zu vergiften (, poisoning),\
    \ so dass dieser die falsche Information an einen Opfer weiteribt, der nach fragt.\
    \ Ein DNS-Server ohne falschen Informationen wenige Pakete des Servers zurückzugeben,\
    \ können, der normaler nur Anfragen und analysieren. Weil ein Server ein Vertrauensverhältnis\
    \ zu anderen Rechnern aufgebaut durch IP Adresse oder seines Hostnamen konfiguriert\
    \ hat, kann ein solcher Angriff trotz des eingehaltens recht schnell Früchte tragen.\
    \ Voraussetzung ist allerdings eine gute Kenntnis der Vertrauensstruktur zwischen\
    \ diesen Rechnern. Ein zeitlich genau abgestimmter Doos gegen einen DNS-Server,\
    \ den Daten gefälschen, ist aus Sicht des Angreifers meistens nicht vermeidbar.\n\
    \nAbhilfe schafft wieder eine kryptographisch verschlüsselte Verbindung, die die\
    \ Identität des Ziels der Verbindung zu verifizieren."
- md: '

    ## Würmer


    Würmer werden häufig mit Viren gleichgesetzt. Es gibt aber einen markanten Unterschied:
    Ein Wurm muss möglichst ein Wirtschaftsprogramm infizieren, und er ist darauf
    spezialisiert, sich möglichst schnell im Netzwerk zu verbreiten. Bekannte Würmer
    wie Ramen, Lion oder Adore nutzen bekannte Sicherheitslücken von Serverprogrammen
    wie bind oder lprng. Man kann sich relativ einfach gegen Würmer schützen, aber
    zwischen dem Zeitpunkt des Bekanntwerdens der ausgenzten Lücke und dem Auftreten
    des Wurms normalerweise einige Tage vergehen, bis das Update-Packet vorhanden
    ist. Natürlich setzt dies voraus, dass der Administrator die Security-updates
    in sein System einspielt.


    ## C.2.3 Tipps und Tricks: Allgemeine Hinweise


    **Information:** Für einen effizienten Umgang mit dem Bereich Sicherheit ist es
    nötig, mit den Entwicklungen Schritt zu halten und auf die neuesten Sicherheitsprobleme
    zu achten. Ein sehr guter Schutz gegen Fehler ist das schnellstmögliche Einspielen
    von Update-Paketen, die von einem Security-Announcement angekündigt werden. Die
    SuSE-security Announcements werden ebenfalls über eine Mailingliste verbreitet,
    in die sich den, den Links auf http://www.suse.de/security folgt, use-announce@suse.de
    ist die erste Informationsquelle für update-Pakete, die vom Security-Team mit
    neuen Informationen geliefert wird.


    Die Mailingliste use-announce@suse.de ist ein hilfreiches Diskussionsforum für
    den Bereich Sicherheit. Sie können sich auf den angegebenen URL wie use-announce@suse.de
    für die Liste anmelden.


    Eine der bekannten Sicherheitsmailinglisten der Welt ist die bugrat@securityfocus.com.
    Die Lektüre dieser Liste ist durchschnittlich 25-20 Posts am Tag kann mit gewissen
    Wissen empfohlen werden. Mehr Information finden Sie auf http://www.securityfocus.com.


    Einige Grundregeln, die zu kennen nützlich sein kann, nach folgende aufgeführt:


    - Vermeiden Sie, als ‚root‘ zu arbeiten, entsprechend dem Prinzip, der geringstmöglichen
    Privilegien für eine Aufgabe zu benutzen. Das verringert die Chancen für einen
    Prozess oder einen Angriff, und überdies für Fehler einseits.


    - Benutzen Sie nach Möglichkeit verschlüsselte Verbindungen, um Arbeiten remote
    auszuführen. „ssh“ (secure shell) ist Standard, vermeiden Sie telnet, ftp, rsh
    und rlogin.


    - Benutzen Sie keine Authentifizierungsmethoden, die alle auf der IP-Adresse eingebaut
    sind.


    - Halten Sie Ihre wichtigsten Pakete für den Netzwerkbereich immer auf dem neuesten
    Stand und abonnieren Sie die Mailinglisten für Announcements der jeweiligen Software
    (z. B. Beispiel bind, sendmail, ssh). Dassel gilt für Software, die nur lokale
    Sicherheitsrelevanz hat.


    ## C.2 Sicherheit ist Vertrauensache


    - Optimieren Sie die Zugiffsrechte sicherheitskritischer Dateien im System, indem
    Sie die /etc/permissions-Datei Wahl an Ihrem Bedarf anpassen. Ein setuid-Programm,
    welches setuid erledigen können, darf nicht mehr seine Aufgabe erfüllen, aber
    es ist in der Regel ein Sicherheitsproblem. Mit einer ähnlichen Vorgehensweise
    können Sie auf nicht-schreibbare Dateien und Verzeichnisse losgehen.


    - Deaktivieren Sie jegliche Netzwerkdienste, die Sie nicht zwingend brauchen.
    Wenn Ihr Server öffentlich ist, verhindert dies, dass Benutzer ihn Dienste benutzen,
    die Sie nichtichtlich freigegeben haben (legacy-Problem). Offene Ports (mit socket-Zustand
    LISTEN) finden Sie mit dem netstat -ap oder netstat -an Optionen. Mit der -p-Option
    können Sie gleich sehen, welcher Prozess mit dem Port belegt.


    - Vergleichen Sie die Ergebnisse, die Sie mit einem vollständigen Scan Ihres Servers
    von außen erhalten. Dieses Programm nmap ist dafür hervorragend. Es klopft jeden
    einzelnen Port an und erkennt anhand der Antwort Ihres Servers, welcher Port welchem
    Dienst dient. Scannen Sie niemals einen Rechner ohne das direkte Einverständnis
    des Administrators. Denken Sie daran, dass nicht nur TCP-Ports gescan werden,
    sondern auf jeden Fall UDP-Ports (Optionen -s und -u).


    - Zur zusätzlichen Integritätprüfung der Dateien im System sollten Sie tripwire
    benutzen und die Datenbank verschlüsseln, wenn Sie gegen sogenannte Zugriffe schützen
    möchten. Darüber hinaus Sie auf jeden Fall ein backup der Maschine außerhalb auf
    einen Datenträger, der über einen Rechner mit dem Netzwerk verbunden ist.


    - Seien Sie vorsichtig beim Installieren von Fremdsoftware. Es gab schon Fälle,
    in denen ein Angifer das tar-Archive einer Sicherheitssoftware mit einem trojanischen
    Paket versehen hat. Zum Glück wurde ein binäres Paket installiert, sollten Sie
    sich sicher sein, woher das Paket kommt.


    SuSE-Pakete werden gpg-signiert ausgeliefert. Der Schlüssel, den wir zum Signieren
    verwenden,

    ID: 9C800ACA 2000-10-19 SuSE Package Signing Key <build@suse.de>

    Key fingerprint = 79C1 7B92 E18C 2C01 899F 99A4 A8E6 DAE8 9C80 0ACA


    Das Kommando rpm -check zeigt die Prüfsum und die Signatur (nicht installiert!)
    Pakts an. Sie finden den Schlüssel auf der ersten CD einer SuSE-Distribution oder
    SuSE-7.1 und auf den meisten Keyservern der Welt.


    - Überprüfen Sie regelmäßig Ihr Backup und des Systems. Ohne eine verlässliche
    Aussage über die Funktion des Backups ist das Backup unter Umständen wertlos.


    - Überwachen Sie Ihre „Logfiles“. Überwachen Sie Ihre „Logfiles“.


