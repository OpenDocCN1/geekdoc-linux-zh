    Zuerst sollte sichergestellt sein, dass der Kernel des Proxy-Servers einen transparenten
    Proxy unterstützt. Erscheint die Statistiken über Squid:


    ```

    Checking service: OK

    Server uptime: 1 day 18 hours 29 minutes 36 seconds

    ```


    Als letzten Schritt muss man die Datei cachemgr.cgi in das Verzeichnis cgi-bin
    kopieren:


    ```

    cp /usr/share/doc/packages/squid/scripts/cachemgr.cgi /usr/local/httpd/cgi-bin

    ```


    ### Statistiken anzeigen


    Gehen Sie zur entsprechenden Web-Seite, z. B.:

    http://webview.example.com/cgi-bin/cachemgr.cgi


    Drücken Sie auf ''continue'' und lassen Sie sich die verschiedenen Statistiken
    anzeigen.

