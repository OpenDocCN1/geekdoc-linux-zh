    - Komplettlösungen

    - E-Commerce


    # 7.6.3 SuSE-Trainingsprogramm


    SuSE bietet Ihnen Trainings und Workshops um Linux an. Unser umfassendes Programm
    reicht von Einsteigerkursen bis Administrationsschulungen hin zu Trainings für
    Entwickler und Vorbereitungskursen zur LPI-Zertifizierung. Unser SuSE Trainer
    sind von SuSE zertifizierte Trainer (SCLT), die unseren hohen Ansprüchen gerecht
    halten unsere Schulungen und sorgen damit für höchchstes Niveau. Um einen hohen
    Wissenransfer zu garantieren, legen wir Wert auf aktuelle, didaktisch optimal
    aufbereitete und praxisbezogene Inhalte.


    Mit dem SuSE-Trainingsprogramm können Sie das Wissen aufbauen und vertiefen, das
    ein erfolgreiches Unternehmen im IT-Bereich benötigt. Buchen Sie einen Kurs in
    dem suse-eigenen Schulungszentrum oder bei einem zertifizierten Schulungspartner
    in Ihrer Nähe. Unsere Schulungszentren erhalten wir in München und Dortmund. Unsere
    Trainer kommen auch zu Ihnen, um Ihre Mitarbeiter individuell und auf Ihre Bedürfnisse
    zugeschnitten zu schulen. Eine stets aktuelle Übersicht aller Seminar sowie eine
    detaillierte Beschreibung der Kursin finden Sie unter:


    ```

    http://www.suse.de/de/support/training

    ```'
