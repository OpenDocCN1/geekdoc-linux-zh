    # Cache-Manager ACLs in /etc/squid.conf


    Folgende Standardeinstellungen sind für den Cache-Manager erforderlich:

    Folgende Regeln sollen enthalten sein:


    ```

    http_access allow manager localhost

    http_access deny manager

    ```


    Diese ACL ist am wichtigsten, da der Cache-Manager versucht, mit dem Squid über
    das cache_object-Protokoll zu kommunizieren. Die folgenden Regeln setzen voraus,
    dass der Web-Server und Squid auf demselben Rechner laufen. Die Kommunikation
    zwischen dem Cache-Manager und Squid entsteht beim Web-Server, nicht beim Browser.
    Befindet sich der Web-Server also auf einem anderen Rechner, müssen Sie eine ACL
    wie in der Beispieldatei B.7.1 hinzufügen.


    ```

    acl manager proto cache_object

    acl localhost src 127.0.0.1/255.255.255

    acl webserver src 192.168.1.7/255.255.255 # IP des Webservers

    ```


