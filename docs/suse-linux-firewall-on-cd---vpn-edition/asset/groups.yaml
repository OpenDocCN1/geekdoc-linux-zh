  mdcn: '


    # 网络安全


    已经拥有对本地“登录”的访问权限。许多已知错误可以通过网络连接被利用。因此，“缓冲区溢出”（Buffer Overflows）和“格式化字符串漏洞”（Format
    String Bugs）无法直接归类为本地计算机或网络。


    # 病毒


    与许多观点不同，Linux 确实存在病毒。众知的病毒是由作者编写的“概念证明”（Proof-of-Concept），用来证明该技术的有效性。然而，还没有一种此类病毒在“野外”中被观察到。


    病毒的传播需要一个非致命的宿主。这种病毒是系统的一个程序或内存区域（例如主引导记录 Master-Boot-Record），并且必须对病毒的程序代码可写。Linux
    恰好能够限制多用户对文件的写入权限，特别是对系统文件。当您以“root”身份运行时，会增加您的系统被病毒感染的概率。考虑到最小权限原则，Linux 病毒会产生很多困难。因此，不应轻率运行从互联网获取且来源不明的程序。SuSE-rpm
    包通过这种数字签名进行加密签名，通过该签名，软件包在 SuSE 中便获得该特征。病毒是一个典型的症状，表明如果管理员或用户缺乏安全意识，即使是高级系统也不会安全。


    病毒与蠕虫混淆，蠕虫是网络安全领域的现象，且不需要宿主即可传播。


    # 网络安全


    在本地安全方面，任务是将工作在同一台计算机上的用户隔离开，特别是“root”用户。相比之下，网络安全的任务是保护整个系统免受网络攻击的侵害。通过用户识别和密码进行经典登录时的用户身份验证属于本地安全。在每次通过网络连接登录时，必须区分不同的安全方面：在完成身份验证之前称为网络安全，登录成功后则涉及本地安全。


    # X-Windows (X11身份验证)


    之前提到过网络透明性是 Unix 系统的基本属性。对于 Unix 的窗口系统 X11 来说，在很大程度上并不完全如此！你可以登录到远程计算机并在那里启动一个程序，该程序将通过网络


    ![](img/594883f46b5a0951172f1e794f42a4a5_163_0.png)


    在您的计算机上显示。X 应用程序与 X 服务器（将显卡窗口显示出来的本地进程）之间通信使用的协议非常简洁，这意味着节省了网络带宽。这在 80 年代系统引入时提供的带宽条件下是足够的。


    如果现在一个 X 客户端想通过其 X 服务器使用网络，则服务器应该保护其所管理的资源（显示器）免受未经授权用户的侵害。具体来说，这意味着客户端程序将获得权限。在
    X-Windows 中，这通过两种类型实现：基于主机和基于 cookie 的访问控制。第一种基于运行客户端程序的计算机的 IP 地址，并通过 `xhost`
    程序进行控制。`xhost` 尝试将 IP 地址植到 X 服务器的一个微型数据库中。然而，仅基于 IP 地址建立身份验证是不安全的。因为计算机上可能有另一个活跃的用户正在运行客户端程序，此时任何知道
    IP 地址的人都可以访问 X 服务器。因此，此处不在此介绍这些方法。`xhost` 命令的帮助页面提供了更多关于工作原理的说明。


    基于“cookie”的访问控制使用一个仅 X 服务器和合法登录用户知道的字符串作为访问令牌的密码。这个“cookie”（英语单词为饼干，这里指包含信息的幸运饼干）在用户登录时存储在用户主目录下的
    `.authority` 文件中，并供任何在 X 服务器上显示窗口的 X-Windows 客户端使用。`xauth` 程序用于检查此项。如果您删除或重命名主目录下的
    `.authority`，您将无法打开新 X 客户端的窗口。关于 X-Windows 安全措施的更多信息可以查阅 `Xsecurity` 的帮助页面（man
    security）。


    ssh（secure shell）可以通过完全加密的网络连接透明地（即非直接可见）传递指向 X 服务器的连接。这被称为“X11转发”（X11-forwarding）。在此情况下，服务器端模拟一个
    X 服务器，并在远程 Shell 端设置 `DISPLAY` 变量。客户端打开一个到 ssh daemon（服务器端守护进程）的连接，然后该守护进程将连接转发到真实的
    X 服务器。如果您需要通过网络显示 X 客户端，应该仔细研究一下 ssh。


