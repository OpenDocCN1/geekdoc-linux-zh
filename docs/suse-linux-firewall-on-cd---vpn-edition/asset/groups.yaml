    In diesem Abschnitt wird gezeigt, wie andere Anwendungen mit Squid interagieren.
    Der Cache-Manager (cachemgr.cgi) ist für Ausgabe von Statistiken.


    ### B.7.1 cachemgr.cgi


    Der Cache-Manager (cachemgr.cgi) ermöglicht dem Systemadministrator, den benötigten
    Speicher zu überprüfen. Weitere Informationen über den Cache.


