    \ einfach zu verwenden. Melden Sie sich als `root` an und folgen Sie folgend:\n\
    \n```\ncat access.log.files | calamaris [options] > reportfile\n```\n\nBeim Vermehren\
    \ von Protokokokolldaten ist die Beobachtung der chronologischen Reihenfolge sehr\
    \ wichtig, d.h. ältere Daten zuerst.\n\nDie verschiedenen Optionen:\n\n- -a wird\
