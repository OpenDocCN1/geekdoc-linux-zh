  mdcn: "\n\n## B.3 系统要求\n\n> 提示\n> 为了避免对象在网络中不同的缓存中被重复存储，使用了其他的 ICP 协议，例如 CARP；缓存路由协议（英文中为\
    \ Hyper-Text Cache Protocol，即超文本缓存协议）。网络中的对象越多，寻找我们所需的内容就越越容易。\n\n![](img/594883f46b5a0951172f1e794f42a4a5_138_0.png)\n\
    \n## B.2.3 互联网对象的缓存\n\n并非所有可用对象都是静态的。存在许多动态生成的 CGI 页面。对于访问量大或加密的 SSL 文档，此类对象不会保留在缓存中：因为每次访问时对象可能已经发生了变化。\n\
    \n然而，对于所有存在于缓存中的对象，问题在于它们应该在缓存中保留多久。为了做出这一决定，缓存中的所有对象将采用不同的处理方式。\n\n- 1. FRESH（新鲜）：当请求此对象时，将直接发送，无需与\
    \ Web 上的原始对象进行比较。\n- 2. NORMAL（正常）：将检查原始对象的服务器，确认对象是否已更改。如果是这种情况，则更新缓存中的副本。\n\
    - 3.STALE（过期）：该对象被视为过期，并从服务器重新下载。\n\nWeb 服务器和代理服务器通过“Last modified”（最后修改时间）或“Expires”（过期时间）头部以及相应的日期来获取对象的状态。还使用头部来指示某些对象是否不需要缓存。\n\
    \n缓存中的对象通常会因为存储不足被替换，使用的是诸如 LRU（英文 Last Recently Used，即最久未使用）等旨在替换缓存对象的算法。其原理是替换最不需要的对象。\n\
    \n## B.3 系统要求\n\n首先应该确定最大系统负载。特别关注系统峰值很重要，这些可能是日平均值的四倍以上。在这种情况下，过度估计系统要求更好。\n\n\
    速度对于缓存来说非常重要。应该特别关注这一因素。硬盘通常以毫秒为“随机寻道时间”来描述。经验规则是：值越小越好。为了获得高速度，建议选择快速硬盘。\n\n\
    根据 Squid 用户指南（http://www.squid-cache.org），对于只有一个硬盘的系统，计算每秒请求数的硬盘定位公式非常简单：\n\n\
    每秒请求数 = 1000 / 寻道时间\n\nSquid 允许同时使用多个硬盘并获得更高的每秒请求数。例如，如果有三块寻道时间均为 12 毫秒的硬盘，使用上述公式得出：\n\
    \n每秒请求数 = 1000 / (寻道时间 / 硬盘数量)\n1000 / (12/3) = 每秒 250 次请求\n\n与 IDE 硬盘相比，优先选择\
    \ SCSI 硬盘。然而，新的 IDE 硬盘的寻道时间与 SCSI 相似，并且带有兼容 DMA 的 IDE 控制器，其数据传输速度在不增加系统负载的情况下显著。\n\
    \n#### # 硬盘大小\n\n在小缓存中，命中（所需对象位于其中）的概率很低。在这种情况下，所需的对象很少被替换。但是，如果有 1 GB 的缓存且用户每天需要\
    \ 10 MB，那么需要一百天缓存才会满。\n\n缓存的大小可以通过连接的最大传输速率来确定。如果连接速率为 1 MB/秒，则最大传输率为 125 KB/秒。一小时内的总流量为\
    \ 450 MB。现在假设总流量在一个小时内达到了 6 GB。由于连接达到了容量限制，我们可以认为缓存的数据量是足够的。\n\n## B.4 Squid \n\
    \n大约需要 2 GB 内存。Squid 需要保持缓存中所有请求的对象。总结来说，Squid 倾向于读取或写入硬盘上的较小数据块，这比吞吐量更重要。\n\n\
    ### B.3.2 内存\n\n所需的内存取决于缓存中对象的数量。Squid 会额外缓存对象引用和频繁请求的对象，以便更快地获取这些数据。内存比百万要小。\n\
    \n### B.3.3 CPU\n\n程序不需要大量 CPU。在检查缓存时，增加 CPU 使用会提高系统性能。\n\n## B.4 启动 Squid\n\n\
    SUSE 上的 Squid 配置为可以立即启动。要启动 Squid，在命令行（以 root 身份）输入。首次运行时将创建 /var/squid 目录结构。这通过脚本\
    \ /etc/init.d/squid 自动完成，可能需要几秒到几分钟。如果显示绿色，说明 Squid 已启动。在本地，可以通过浏览器中设置代理和端口 3128\
    \ 来测试 Squid 的功能。为了允许所有用户访问 Squid，只需在配置文件 /etc/squid.conf 中将 http_access deny all\
    \ 更改为 http_access all。如果对 /etc/squid.conf 进行了更改，必须让 Squid 加载这些更改。可以通过 Squid reload\
    \ 实现。或者，可以完全重启 Squid：Squid restart。另一个重要的命令是：Squid status, Squid stop。这可以判断代理是否正在运行以及\
    \ Squid 开始停止。后者可能需要一段时间，Squid 会等待半分钟（shutdown_lifetime），然后断开与客户端的连接并停止写入。使用 kill\
    \ 或 killall 结束 Squid 可能会导致缓存损坏，但此时仍可以重新启动 Squid。如果 Squid 在成功启动后短时间内退出，可能是由于 DNS\
    \ 服务器配置错误或缺少 /etc/resolv.conf。Squid 将启动失败的原因记录在文件 /var/squid/logs/cache.log 中。如果希望\
    \ Squid 在开机时自动启动，只需在 /etc/rcconfig 中将 START_SQUID=no 修改为 START_SQUID=yes。\n\n\
    ## B.5 配置文件 /etc/squid.conf\n\nSquid 代理服务器的所有设置都在 /etc/squid.conf 中进行。为了首次启动 Squid，其中不需要更改-\n"
