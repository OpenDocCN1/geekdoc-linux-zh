    ### 4.3.8 FTP-Zugang von extern nach intern:


    Wenn Sie einen eigenen FTP-Server betreiben, müssen Sie hier folgende Einstellungen
    vornehmen (vgl. Abbildung 4.26 auf der nächsten Seite):


    ## 4.3 Erstellen einer neuen Firewall-Konfiguration


    ![](img/594883f46b5a0951172f1e794f42a4a5_52_0.png)


    Abbildung 4.26: Konfiguration des FTP-Servers


    **IP-Adresse des FTP-Servers:** Die IP-Adresse Ihres FTP-Servers, der in Ihrem
    Intranet oder der DMZ steht.


    **FTP-Proxy-Port:** Der Port, auf dem Ihr FTP-Server hört, normalerweise ist das
    Port 21. Damit wird von außen betrachtet Ihre Firewall zum FTP-Server. Lassen
    Sie sich von Ihrem Provider für Ihre Firewall einen Alias-Eintrag im DNS geben,
    z. B.: `ftp.mycompany.com`


    **Maximale Anzahl:** Maximale Anzahl an FTP-Clients, die gleichzeitig mit dem
    FTP-Server verbinden dürfen.


    **Höre auf ausgewählte IP-Adresse:** IP-Adresse des Interfaces, auf dem der FTP-Server
    Verbindungen empfängt.


    ### 4.3.9 Konfiguration des FTP-Proxies von intern nach extern:


    **FTP-Proxy-Port:** 10021


    Port, auf dem der FTP-Proxy angesprochen wird.


    **Magic Char:** Wenn Sie dieses Zeichen aktivieren, wird im Benutzernamen der
    ausgewählten Ziel-FTP-Server angegeben: user[@host:port]. Das sieht zum Beispiel
    so aus:


    - ftp@remftp.remote.org:21


    **Magic Char:** Das MagicChar-Zeichen ist standardmäßig auf "%“ eingestellt. Wenn
    die Option „Magic User“ aktiviert ist, kann das Zeichen beliebig gewählt werden.


    **Maximal Clients:** Maximale Anzahl an offenen Verbindungen auf den FTP-Proxy.


    **Höre auf ausgewählte IP-Adresse:** IP-Adresse, über die der FTP-Proxy angesprochen
    wird.


    ## Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_53_0.png)


    Abbildung 4.27: Konfiguration des FTP-Proxies


    ### 4.3.10 Konfiguration des HTTP-Proxys für Verbindungen von intern nach extern


    In diesem Modul können Sie die Einstellungen zum HTTP-Proxy vornehmen. Dieser
    bearbeitet die HTTP-Anfragen von Benutzern des internen Netzes.


    ## HTTP-Proxy


    Zur Konfiguration des HTTP-Proxies sind einige Einträge notwendig:


    ![](img/594883f46b5a0951172f1e794f42a4a5_53_1.png)


    Abbildung 4.28: Konfiguration des HTTP-Proxys – Dialog


    **HTTP-Proxy-Port:** Der Port, auf dem der Proxy HTTP-Anfragen von intern entgegen
    nehmen soll. Standardinstellung ist 3128.


    **Transparent Proxy:** Grundsätzlich überwacht der Proxy den Port 80 und wenn
    eine HTTP-Anfrage gestellt wird, lässt diese diese Anfrage zu bearbeiten, muss
    die Option „Transparent Proxy“ aktiviert sein. Damit verbunden muss eine „Redirect“-Regel
    (Umleitung) existieren, die Anfrage innerhalb der Firewall auf den Port 3128 umleitet.
    Wenn Sie diese Option nicht aktivieren, müssen alle Clients oder interne Proxy
    eingetragen werden.


    **Caching:** Welche HTTP-Anfragen, so können Sie die Option „Caching“ aktivieren,
    um ein wiederholtes Bearbeiten von gültigen Seiten zu vermeiden. Die Größe des
    Cache lässt sich im zugeordneten Eingabefeld bestimmen und sollte nicht unter
    100 MB liegen.


    > Die Die Firewall sollte nicht als zwischenspeichernder HTTP-Proxy verwendet
    werden, darin nicht die eigentliche Aufgabe. Eine bessere Lösung ist der Einsatz
    eines zusätzlichen eigenständigen Rechners.


    Haben Sie alle Veränderungen vorgenommen, bestätigen Sie die Einstellungen mit
    ‚Weiter‘.


    ACLs definieren


    Hier legen Sie fest, wer den Proxy verwenden darf und auf diese Benutzer im Internet
    zugreifen können (siehe Abbildung 4.29 auf der nächsten Seite).


    **Name für ACL:** Verge Sie sich einen Namen für die anzulegende Liste.


    **Typ der ACL:** Als Nächstes wählen Sie einen „Typ“ für Ihre ACL. Sie haben die
    Wahl:


    - url_regex Angaben von URL-Adressen.

    - proto (protocol) Hier legen Sie die entsprechenden Protokolle fest.

    - src (source) Bestimmung der Quelladressen.

    - dst (destination) Angabe der Zieladressen.


    **Hinzufügen:** F Sie die neue ACL der Liste von bereits angelegten ACLs hinzu.


    **Löschen:** Sie können ACLs über diese Schaltfläche auch wieder löschen.

