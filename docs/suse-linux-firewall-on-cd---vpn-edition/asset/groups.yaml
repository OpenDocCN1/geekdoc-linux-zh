    # 4.3.15 VPN Connections (IPSEC-Modul)


    Einführung


    Das VPN Connection-Modul ermöglicht, VP Netzwerke einzurichten. Diese Virtual
    Private Networks kann man als Tunnel zwischen zwei Hosts verläuft, der das „normale“
    Internet verläuft. Dieser Tunnel weiß nicht über die in ihm übertragenen Informationen.


    Die VPN-Netzwerke werden auf der „SUSE Firewall on CD“ mit IPsec realisiert. IPsec
    ist eine Protokollfamilie, die es ermöglicht, sichere Verbindungen zwischen Computern
    herzustellen. Die Authentifizierung erfolgt durch Zertifikate. Als weitere Möglichkeit
    für die Authentifizierung gibt es keine „Pre Shared Key"


    Die Daten, die diesen Tunnel geleitet werden, werden automatisch verschlüsselt.
    Für die Authentifizierung notwendigen Zertifikate werden mit dem Keyring-Modul
    von FAS erzeugt bzw. importiert (vgl. 4.3.12 auf Seite 61).

    Zu beachten ist Folgendes:


    Um IPsec verwenden zu können, muss der Paketfilter auf der „SUSE Linux on CD“
    angepasst werden. Dies geschieht automatisch, wenn der SUSE Firewall Modul in
    FAS erstellt werden wird.


