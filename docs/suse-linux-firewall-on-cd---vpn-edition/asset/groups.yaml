    Datei 3.3.4: /etc/nsswitch.conf konfi


    Über diese Datei wird der nscd (engl. Name Service Cache Daemon) mehre

    guriert (vgl. Manual-Page von nscd (man 8 nscd) und Manual-Page von

    nscd.conf (man 5 nscd.conf). Betroffenen sind die Informationen von

    passwd, groups und hosts. Der Daemon muss neu gestartet werden, wenn

    z. die Namensauflösung (DNS) durch Änderung der /etc/resolv.conf umgestellt wird.
    Dazu dieser Befehl:


    ```

    erde: # nscd restart

    ```


    > Achtung

    Wenn beispielsweise das Caching für passwd aktiviert ist, dauert es in\der Regel
    15 Sekunden, bis ein neu angelegter Benutzer dem\System bekannt ist. Durch das
    Neustarten des nscd kann diese Wartezeit verkürzt werden.


    # /etc/resolv.conf


    Wie bereits die Datei /etc/host.conf, so spielt auch diese Datei in Bezug\auf
    Auflösung von Rechnernamen die resolver-Bibliothek eine Rolle.

    In dieser Datei wird angegeben, welcher Domain der Rechner anzeigt

    (Schlüsselwort nameserver) und wie die Adresse des Nameservers im (Schlusselwert
    nameserver), der angesprochen wird. Soll es mehrere angegeben sein. Beim Auflösen
    eines nicht qualifizierten Namen wird versucht, durch Anhängen eines E in

    search einen gültigen, voll qualifizierten Namen zu erzeugen. Mehrere

    Nameserver können durch mehrere Zeilen, mit nameserver angegeben,

    bekannt gemacht werden. Kommentare werden wieder mit ''\#'' eingeleitet.

    Ein Beispiel für /etc/resolv.conf zeigt Datei 3.3.5 auf der nächsten Sei-te.


    YaST trägt hier den angegebenen Nameserver ein!'
