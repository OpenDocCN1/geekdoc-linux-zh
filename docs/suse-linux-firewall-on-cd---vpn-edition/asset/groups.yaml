    # DNS – Domain Name Service


    allow-update { ! * }; diese Option regelt den Schreibzugriff von extern auf den
    Zonendatenbank. Damit wäre es Clients möglich, sich selbst im DNS einzutragen,
    was aus Sicherheitsgründen nicht wünschenswert ist. Ohne diesen Eintrag sind Zonen-Updates
    generell untersagt, dieses Beispiel würde auch nichts ändern, da ! * ebenfalls
    alles verbietet.


    ## A.2.4 Aufbau der Zonendateien


    Man benötigt zwei Arten von Zonendateien, die einen dazu dienen, um Rechnernamern
    die IP-Adresse zu zuzuordnen und die anderen den umgekehrten Weg zu liefern zu
    einer gegebenen IP-Adresse des Rechnernamens. Eine wichtige Bedeutung hat der
    ''.'' in den Zonendateien. Ohne abschließenden ''.'' angegeben, wird die Zone
    nicht ergänzt. Man muss komplette Rechnernamen, die bereits mit vollständiger
    Domain angegeben wurden, mit einem ''.'' abschließen, damit die Domain nicht noch
    einmal angehängt wird. Ein fehlender Punkt oder einer an der falschen Stelle ist
    die häufigste Fehlerursache bei der Konfiguration von Namervern.


    Den ersten Fall betrachten wir als die Zonendatei welt.zone, die für die Domain
    wert.all zuständig ist: siehe Datei A.2.5.


    | Zeile | Inhalt |

    | :--- | :--- |

    | 1. | $TTL 2D | IN SOA gateway root.welt.all. |

    | 2. | welt.all. | ; serial |

    | 3. | | 2001040901 ; refresh |

    | 4. | ID | |

    | 5. | | 2H ; retry |

    | 6. | | 1W ; expiry |

    | 7. | | ; minimum |

    | 8. | | 2D ) |

    | 9. | IN NS gateway |

    | 10. | IN MX 10 sonne |

    | 11. | | |

    | 12. | gateway | IN A 192.168.0.1 |

    | 13. | | IN A 192.168.1.1 |

    | 14. sonne | IN A 192.168.0.2 |

    | 15. mond | IN A 192.168.0.3 |

    | 16. erde | IN A 192.168.1.2 |

    | 17. mars | IN A 192.168.1.3 |


    Datei A.2.5: Datei /var/named/welt.zone


    **Zeile 1:** $TTL definiert die Standard-TTL, die alle Einträge in dieser Datei
    gilt, hier 2 Tage (2D = 2 days). TTL bedeutet hier ''time to live'', zu Deutsch
    Gültigkeitsdauer.


    **Zeile 2:** Hier beginnt der SOA control record:


    - An erster Stelle steht hier der Name der zu verwaltenden Domain welt.all, diese
    ist mit einem ''.'' abgeschlossen, ansonsten würde die Zone noch einmal angehängt
    werden. Alternativ kann man ihn mit ''@'' schreiben, dann wird die Zone dem zugehörigen
    Eintrag in /etc/named.conf entnommen.


    ## A.2 Die Konfigurationsdatei /etc/namedconf


    - Nach dem SOA steht der Name des Nameservers, der als Master für diese Zone zuständig
    ist. In diesem Fall wird der Name gateway.welt.all ergänzt, da er nicht mit einem
    ''.'' abgeschlossen ist.

    - Danach folgt eine E-Mail-Adresse, der für Nameserver zuständig ist. Da das ''@''-Zeichen
    hier eine besondere Bedeutung hat, ist hier stattdessen ein ''.'' einzufügen,
    schreibt man folgt root.welt.all.. Am Ende darf man ihn nicht vergessen, da die
    Zone noch einmal angehängt wird.

    - Am Ende folgt ein ''('', um die folgenden Zeilen, bis zu '')'' mit den SOA-Record
    einzuschließen.


    **Zeile 3: Die serial number** ist eine willkürliche Zahl, die bei jeder Änderung
    erhöht wird. Sie dient, sekundäre Nameserver (Slave-Server) über Änderungen zu
    informieren. Eingebürgt sich eine einstellige Zahl mit Datum und fortlaufender
    Nummer in der Form JJJMMTTNNN.


    **Zeile 4: Die refresh rate** ist das Zeitintervall, in dem Sekundär-Nameserver
    die serial number der Zone überprüft. In diesem Fall 1 Tag (1D = 1 day).


    **Zeile 5: Die retry rate** ist der Zeitabstand, in einem sekundären Nameserver,
    im Fehler versucht den primären Server erneut zu kontaktieren. Hier 2 Stunden
    (2H = 2 hours).


    **Zeile 6: Die expiration time** ist der Zeitraum, nach dem ein sekundärer Nameserver
    die gecachten Daten verwirft, wenn er Kontakt zum primären Server nicht mehr bekommen
    hat. Hier ist eine Woche (1W = 1 week).


    **Zeile 7: Das minimum time to live** ist, wie lange die Ergebnisse von DNS-Anfragen
    von Servern gecached werden dürfen, bevor sie ihre Gültigkeit verlieren und neu
    angefordert werden.


    **Zeile 9: Das IN NS** gibt den Nameserver, der für diese Domain zuständig ist.
    Hier gilt, gateway.welt.all wird ergänzt, weil er nicht mit einem ''.'' abgeschlossen
    ist. Es kann mehrere dieser Art, für einen primären und für jeden sekundären Nameserver.
    Für diese Zone notify in /etc/named.conf, wenn nicht gesetzt, werden alle aufgeführten
    Nameserver bei Änderungen des Zonendformats informiert.


    **Zeile 10: Der MX-Record** gibt den Mailserver, der für die Domain welt.all die
    Nachrichten annimmt und weiterleitet. In diesem Fall gateway.welt.all wird ergänzt,
    da er nicht mit einem ''.'' abgeschlossen ist. Danach folgt eine E-Mail-Adresse,
    der für Nameserver zuständig ist. Da das ''@''-Zeichen hier eine besondere Bedeutung
    hat, ist hier stattdessen ein ''.'' einzufügen, schreibt man folgt root.welt.all..
    Am Ende darf man ihn nicht vergessen, da die Zone noch einmal angehängt wird.


    **Zeilen 12-17:** gateway, sonne, mond, erde, mars sind die A-Einträge.


    # DNS – Domain Name Service


    DNS – Domain Service.


    ...


    . DNS – Domain Name Service


    Zeilen 12-17: gateway, sonne, mond, erde, mars sind die A-Einträge.

