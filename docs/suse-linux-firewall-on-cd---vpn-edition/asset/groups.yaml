    > Hinweis

    Kontrollieren Sie Ihre Log-Dateien ständig. Nur so können Sie rechtzeitig auf
    Angriffe oder Funktionsausfälle reagieren. Falls ungewöhnliche Ereignisse auftreten,
    reagieren Sie sofort. Erhöhen Sie Sie Log-Level (falls möglich) und verfeinern
    Sie Ihre Log-Auswertung.


    ## 7 Hilfeststellungen


    In diesem Kapitel finden Sie Informationen, wie Sie ein Konzept für den Aufbau
    einer Firewall-Lösung mit der „SuSE Linux Firewall auf CD“ für Ihr Netzwerk erstellen
    können. Sie haben auch jederzeit die Möglichkeit, die Dienstleistungen der SuSE
    Linux AG in Anspruch zu nehmen, um sich für Ihre Bedürfnisse maßgeisches Konzept
    erarbeiten zu lassen.


    ## 7.1 Troubleshooting


    Hier finden Sie Hilfeststellungen, wenn sich der Adminhost nicht installieren
    lässt bzw. die SuSE Linux Live-CD für Firewall nicht bootet.


    ### 7.1.1 Probleme bei der Installation des Adminhosts


    Wenn Sie Schwierigkeiten haben, den SuSE Adminhost zu installieren, steht Ihnen
    der kostenlose SuSE Linux Installationssupport zur Verfügung. Zuvor lohnt ein
    Blick in die Support-Datenbank. Hier finden Sie zahlreiche Informationen zu diversen
    Installationsproblemen – eine Stichworthilfe hilft Ihnen dabei:


    ```

    http://sdb.suse.de

    ```


    ### 7.1.2 Probleme beim Booten der Live-CD


    Um die Fehlersuche zu vereinfachen, sollten Sie Folgendes beachten und notieren:


    - Was passiert beim Booten?

    - Werden Dienste nicht gestartet, die konfiguriert wurden (skipped/failed Meldungen)?

    - Gibt es Fehlermeldungen auf der Konsole?

    - Gibt es auf dem tty9/tty12 Fehlermeldungen des Kernels? Um diese Meldungen zu
    sehen, wechseln Sie mit Alt + F9 bzw. Alt + F12 auf die entsprechende Konsole.


    ## Hilfestellungen


    Probleme bei der Einbindung in das Netzwerk:


    Beobachten und notieren Sie, welche Art die Probleme sind. Testen Sie sich spielweise
    auf die Firewall (melden Sie sich als Benutzer ''root'' auf der Firewall), ob
    das Netzwerk-Interfaces konfiguriert sind:


    ```

    root@firewall # ifconfig

    ```


    Dieser Befehl zeigt Ihnen, welche Interfaces konfiguriert sind und welche IP-Adressen,
    Netzwerkmasken eingestellt sind. Falls notwendig korrigieren Sie die Konfiguration
    mit FAS und erstellen eine neue Konfigurationsdatei. Damit die neue Konfiguration
    verwendet wird, muss der Rechner neu gestartet werden.


    - Welche Dienste funktionieren von der Client-Seite (Intranet) aus? Sollen sie
    funktionieren? Anhand der Logfiles können Sie feststellen, ob es um unberechtigte
    Zugriffe handelt.

    Versuchen Sie Fehler zu reproduzieren.

    - Funktionieren Zugriffe auf freigegebene Ressourcen? Welche Dienste sind betroffen?
    Soll die Ressource wirklich freigeben?

    Testen Sie z. B. mit ps, ob der Prozess vorhanden ist, d. h. auch zur Verfügung
    steht. Welche Dienst stehen zur Verfügung, kontrollieren Sie Ihre Logfiles. Hier
    finden sich Meldungen, warum ein Dienst gestartet wurde, oder ob versucht wurde,
    ein Dienst unberechtigterweise in Anspruch zu nehmen.

    Testen Sie von verschiedenen Clients, ob die Firewall-Rechner erreichbar ist und
    die Proxies ansprechbar sind.


    ## 7.2 Security-Policy und Kommunikationsanalyse


    Für die sichere Anbindung eines internen Netzwerks an das Internet oder ein anderes
    „unsicheres“ Netzwerk sind im Vorfeld einige Dinge abzuklären. Dazu gehört die
    der Security-Policy für das eigene Netzwerk und der Kommunikationsanalyse.


    ### 7.2.1 Die Security Policy


    Die Security-Policy stellt die Grundlage für den Umgang mit allen Programmen,
    Rechnern und Daten dar. Weiterhin wird festgelegt, welche Überwachung der Sicherheitsrichtlinien
    gewährleistet werden und welche Verstöße (von intern/extern) behandelt werden.
    Um eine Security-Policy zu erstellen, fertigt man am besten eine Kommunikationsanalyse
    an. Hierbei sind sich folgende Themen von großer Wichtigkeit:


    - Zum einen es gilt, den Schutzbedarf zu analysieren. Was muss geschützt werden?

    - Gibt es Bereiche im Intranet, die besonders schützenswerte Daten beinhalten
    (z. B. Personal-Abteilung, firmenkritische Daten etc.). Wie liegen diese Daten?

    - Wer darf Zugriff auf die Daten haben? Gibt es abgestufte Zugangsberechtigungen?

    - Sollen Dienste intern zur Verfügung stehen? Welche von intern nach extern (E-Mail,
    Surfen, Datentransfer) und welche von extern nach intern (E-Mail, Webdienste,
    Datentransfer)?


    Die Liste kl klrenden Fragen für eine Security-Policy muss individuell erstellt
    und beantwortet werden.


    ### 7.2.2 Kommunikationsanalyse


    Die wichtigste Hilfestellung für die Durchführung einer Kommunikationsanalyse
    ist eine Kommunikations-Matrix. Hier wird in Tabellenform dargestellt, welche
    Dienste für welchen Client-Rechner bzw. Nutzer zur Verfügung gestellt werden.
    Diese Matrix wird dann auf Proxies/IP-Filterregeln abgebildet.


    Erstellen eine Kommunikations-Matrix:


    Fertigen Sie sich eine Liste aller Clients/Server Ihres Netzwerks an. Legen Sie
    dann fest, welche Protokolle von welchem Client verwendet dürfen. Definieren Sie
    außerdem, in welche Richtung die jeweiligen Pakete gesendet bzw. empfangen werden.


    Ein Beispiel für das HTTP-Protokoll: Der Client host1 soll einen Webserver im
    intern erreichen, aber keine Verbindung zu einem externen Webserver herstellen.
    Der Eintrag in Kommunikations-Matrix sieht dann für das HTTP-Protokoll wie unten
    aufgeführt aus.


    Beispiel für eine Kommunikations-Matrix:


    | Client | icmp | ftp | smtp | http | https | ... |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | intern | extern | i. | e. | i. | e. | |

    | host1 | X | | | X | X | | |

    | host2 | X | | | X | X | | |

    | host3 | | | | | | |

    | hostn | | | | | | |


    Anhand einer Kommunikations-Matrix behalten Sie den Überblick über Kommunikationsbeziehungen
    innerhalb des Netzwerks. Dies erleichtert Ihnen die Konfiguration Ihres Netzwerks
    sondern Fehleranalyse.


    ## 7.3 Dienstleistungen der SuSE Linux AG


    Die SuSE Linux AG steht Ihnen gerne mit ihren Dienstleistungen zur Verfügung,
    bei:


    - Beratung: Klärung des Schutzbedarfes, Kommunikationsanalyse

    - Planung: Hardwarebedarf, Netzwerkplanung/Integration

    - Installation: Vorortinstallation der Firewalllösung, Abnahme der Tests vor Ort/remote,
    Dokumentation

    - Wartung: Business-Support (kostenpflichtig), Online-Wartung via Modem/Callback


    ## 7.4 Updates


    Beim Betrieb einer Firewall ist die permanente Pflege der eingesetzten Software
    enorm. Sobald eine Sicherheitslücke entdeckt und behoben ist, muss ein Update
    der entsprechenden Software stattfinden.


    Falls ein Sicherheitsupdate die SuSE Linux Live-CD für "Firewall" betrifft, wird
    eine neue Live-CD an Sie verschickt. Diese Live-CD legen Sie in das CD-Laufwerk
    des Firewall-Rechners und starten die Firewall neu.


    Sicherheitsupdates für den SuSE Linux Adminhost werden auf dem SuSE Webserver
    zur Verfügung. Diese Pakete laden Sie auf den Adminhost und installieren sie z.
    B. mit dem Kommando:


    ```

    root@adminhost:$ rpm -uh neuespaket.rpm

    ```


    Folgen Sie bitte auch die Hinweise, die auf den Security-Mailinglisten und dem
    SuSE Webserver veröffentlicht werden:


    ```

    http://lists.suse.com/archive/suse-security

    http://www.suse.de/de/support/security/index.html

    ```


    ## 7.5 Maßnahmen im Falle eines Einbruchs


    ### 7.5.1 System-Einbruch und Ereignisanzeige


    Ein „richtig“ konfiguriertes Linux/UNIX-System kann sich schon als ziemlich sicher
    gelten. Systemimmente Gefahren, die mit einem komplexen System wie Linux ebenfalls
    zusammenhäng, werden besser erkannt als bei anderen Betriebssystemen, welche UNIX
    mehr als 30 Jahren eingesetzt und weiterentwick wurden. UNIX ist die Grundlage
    des Internets. Nichtdestrotz werden Konfigurationsfehler und tauchen immer wieder
    Sicherheitslücken auf. Es wird immer Sicherheitsmängel geben. Sicherheitsexperten
    und Cracker/Hacker stehen im immerwährend „Konkurrenzkampf“, einander einen Schritt
    voraus. Was als sicher gilt, kann morgen wieder unsicher sein.


    Anzeichen für einen Einbruch in Ihr System (engl. Intrusion Detection)


    Als Zeichen für eine Kompromittierung Ihres Systems können Sie alles betrachten,
    was vom „normalen“ Verhalten Ihres Firewall-Systems abweicht, z. B.:


    - erhöhte Prozesslast

    - außerhalb großer Netzwerkverkehr

    - ungewöhnliche Prozesse oder

    - Prozesse von Benutzern gestartet, die nicht existieren.


    ## Einen Angriff erkennen


    Zunächst sollte man sich im Klaren darüber werden, welche Art von Aktionen als
    Angriff zu bewerten sind. Leider ist in der Zwischenzeit vollkommen normal, ein
    Rechner, der mit dem Internet verbunden ist, nach offenen, verbundenen Ports abgescannt
    wird. Ebenso ist es üblich, Ports anzugreifen, die irgendwann als verwundbar bekannt
    wurden (pop3/popper, rpc-mount, smtp/sendmail). Die meisten „Angriffe“ werden
    von „Script-Kiddies“ durchgeführt. Verwendet werden vorgefertigte „Exploits“,
    die auch auf vielfältigen Web-Seiten veröffentlicht werden (z.B. http://rootshell.com).
    Diese Seiten stellen auch eine wertvolle Informationsquelle für Netzwerk- und
    Systemadministratoren dar. Sie sind meist zu erkennen, dass der Angriff nur ein
    einziges Mal bei Erfolg nicht wiederholt wird.

    '
