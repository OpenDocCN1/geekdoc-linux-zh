    \ O'Reilly 2000.\n- Wolfgang Barth: SuSE Firewall Book, SuSE Press 2001.\n- Maximum\
    \ Linux Security, SAMS 1999.\n- Robert L. Ziegler: Linux Firewalls, New Riders\
    \ 1999."
