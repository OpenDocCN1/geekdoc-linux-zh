    minimiert, andererseits ein höherer Rechenaufwand erforderlich.


    # C.1.4 sftp - sicherere Dateiübertragung


    Alternativ kann man zu sicheren Datenübertragung sftp verwenden. sftp bietet innerhalb
    der Sitzung viele von ftp bekannten Kommandos. Gegenüber scp mag es bei beiden
    Übertragung von Daten, Dateiname unbekannt sind, von Vorteil sein.


    # C.1.5 Der SSH Daemon (sshd) – die Serverseite


    Der SSH-Daemon ist Bestandteil des SSH-Pakets und wird in SuSE Linux automatisch
    auf Runlevel 3 und 5 gestartet. In /etc/rc.config ist die Variable START_SSH auf
    zwei eingestellt.

    Während des ersten Starts generiert der Daemon der zwei Schlüsselpaare. Die Schlüsselpaare
    bestehen aus einem privaten und einem öffentlichen (engl. public) Schlüssel. Deshalb
    bezeichnet man dies als public-basiertes Verfahren. Um die Kommunikation mittels
    SSH zu gewährleisten, darf ausschließlich der Systemadministrator die Dateien
    der privaten Schlüsseln lesen. Die Daterechte wurden bei Vorerterstellung restriktiv
    gesetzt. Die privaten Schlüssel werden lediglich lokal vom SSH-Daemon benötigt
    und dürfen an niemanden weitergegeben werden. Zudem können lediglich die öffentlichen
    an Kommunikationspartner weitergegeben (an Namensendung -pub erkennbar) und für
    alle Benutzer lesbar werden.


    Eine Verbindung wird vom SSH-Client eingeleitet. Der wartende SSH-Daemon und der
    anfragende SSH-Client schauen Identifikationsdaten aus, um die Protokoll- und
    Serverversion abzuggleichen und die Verbindung zu einem falschen Port auszuschließen.
    Ein Prozess des ursprünglichen SSH-Daemons antwortet, sodass gleichzeitig viele
    SSH-Verbindungen möglich.


    Der Server sendet eigenen host key und einen stündlich vom SSH-Daemon neu generierten
    server key (engl. encrypt) den SSH-Client einen frei gewählten Sitzungsschlüssel
    (engl. session key) und sendet ihn an den SSH-Server. Dieser dient dem Server
    der gewählten Verschlüsselungsmethode (engl. cipher).


    Die zur Verschlüsselung des Sitzungsschlüssels zwingend erforderlichen privaten
    host und server keys, können nicht auf den öffentlichen ab geleitet'
