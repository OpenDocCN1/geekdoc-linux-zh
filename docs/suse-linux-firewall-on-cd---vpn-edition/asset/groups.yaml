  - '[PAGE 130]


    # A.3 DNS Beispielkonfiguration


    In der hiergeführten Beispiel-Konfiguration gehen wir von folgendem Fall: Ihre
    Domain heißt welt.all. Sie haben einen Gateway-Rechner, der die Verbindung zum
    Internet hält und zwei firmeninter Netze miteinander verbindet. Dieser Rechner
    wird unser Nameserver und erhält den Namen „gateway“. Ihr Netzwerk sieht wie folgt
    aus:


    Netz 1 enthält den Rechner:


    +   - gateway IP 192.168.1.1

    - erde IP 192.168.1.2

    - mars IP 192.168.1.3


    Netz 2 enthält den Rechner:


    +   - gateway IP 192.168.0.1

    - sonne IP 192.168.0.2

    - mond IP 192.168.0.3


    Die Rechnung erde und mars können nur über gateway mit sonne und mond verbunden,
    ebenso alle Rechner nur über gateway das Internet erreichen. Für die Konfiguration
    der Nameserver sind folgende Dateien nötig:


    **named.conf** die zentrale Konfigurationsdatei,


    **welt.zone** enthält die host-Tabelle,


    **192.168.1.zone** für das Subnetz mit den Rechnern erde und mars,


    **192.168.0.zone** für das Subnetz mit den Rechnern sonne und mond,


    **localhost.zone** enthält die IP-Adresse des localhost,


    **127.0.0.zone** loopback,


    **root.hint** enthält die Root-Server des Internets.


    Die Dateien /etc/named.conf, 127.0.0.zone und root.hint werden automatisch bei
    der Installation von BIND 8 angelegt.


    Die Datei /etc/named.conf wird nun angepasst in Datei A.3.1 auf der nächsten Seite.


    acl die Zugriffskontroll-Liste, die festlegt, von welchen IP-Adressen aus auf
    den DNS-Server zugriffen werden darf.


    Der directory-Entry gibt an, wo sich die anderen Konfigurationsdateien befinden.
    Standard ist /var/named/.


    list-on Port definiert den Port, von dem der Server Anfragen erhält.'
