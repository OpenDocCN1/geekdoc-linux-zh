    # Die SuSE Linux Firewall on CD


    Mit der SuSE Linux Firewall on CD haben Sie ein Werkzeug an der Hand, mit dem
    Sie eine Firewall für Ihr Netzwerk einrichten, überwachen und warten können. Für
    diese Aufgaben stehen Open-Source-Programme zur Verfügung, die speziell dafür
    weiterentwick wurden.


    Die SuSE Linux Firewall on CD schützt Ihr lokales Netzwerk gegen unberechtigte
    Zugriffe und reguliert Zugriffe auf Ihre Ressourcen. Sie bietet Ihnen die Möglichkeit,
    durch die Verwendung der Firewall Administration Systems (FAS) den Zugang Ihres
    Netzwerks ins Internet zu steuern und zu regeln.


    Die Wahrscheinlichkeit eines Konfigurationsfehlers im Firewall-Setup verringern
    sich Fehler durch den Anwender weitestgehend durch Plausibilitätsprüfungen. FAS
    sorgt für eine konsistente Konfiguration, ohne die Konfigurationsmöglichkeiten
    einzuschränken.


    Allerdings kann keine Firewall absolute Sicherheit bieten. Das gilt auch für die
    „SuSE Linux Firewall on CD“, die keine Security-Policy ersetzt. Durch sie wird
    auch die Wartung, Pflege und Überwachung der Firewall nicht überflüssig, aber
    sie stellt Werkzeuge zur Verfügung, die diese Aufgaben erleichtern.


    > Hinweis

    Die Verwendung des Produkts „SuSE Linux Firewall on CD“ erfolgt auf eigenes Risiko.
    Insbesondere für Datenverlust durch fehlerhaft konfigurierte Dienste auf der Firewall
    und für sonstige Schäden besteht kein Anspruch auf Schadensatz.'
