  - '[PAGE 16]


    # SuSE Linux Adminhost for Firewall


    Eine Firewall zu administrieren, zu warten und zu überwachen ist keine leichte
    Aufgabe, vor allem wenn Überwachung nicht auf die leichte Schulter genommen wird.
    Deshalb befindet sich in der Lieferung von CD’ der „SuSE Linux Adminhost for Firewall“,
    der es Ihnen erleichtern soll, die SuSE Linux Firewall zu konfigurieren, zu administrieren
    und zu pflegen.


    # 3.1 Einführung


    Nach der Installation des SuSE Linux Adminhost for Firewall stehen Ihnen mit dem
    Firewall Administration System (FAS) ein Werkzeug mit graphischen Administrationsoberfläche
    zur Verfügung, das es ermöglicht die Konfiguration der „SuSE Linux Live-CD für
    Firewall“ vorzunehmen.

    Für die Überwachung der Firewall stehen konfigurierbare Werkzeuge zur Verfügung,
    mit denen Sie Tests der Firewall, Auswertung der Log-Dateien und Überwachung die
    Möglichkeit haben, Systemadministration per E-Mail, Pager usw. zu benachrichtigen,
    damit möglichst frühzeitig geeignete Maßnahmen ergriffen werden können (z. B.
    Trennen der Netzwerkverbindung zum Internet/Intranet et.c.).


    Hier zeigt sich auch schon, dass eine Firewall laufende Überwachung keinen Schutz
    gegen echten Schutz bietet. Außerdem sollten alle Änderungen, die in der Konfiguration
    der Firewall vorgenommen wurden, durchgehend und vollständig dokumentiert werden.
    Anhand der Dokumentation können Fehler gefunden werden oder auch Änderungen, von
    unautorierter Seite kommen, wieder zurückzukommen.


    # 3.2 Update


    Wenn Sie auf dem Rechner, der als Adminhost für die Firewall dienen soll, bereits
    SuSE Linux 7.2 oder der SuSE Linux Enterprise Server 7 installiert haben,'
  - '[PAGE 17]


    # SUSE Linux Adminhost for Firewall


    müssen Sie keine Neuinstallation durchführen, sondern können auch nur die notwendigen
    Pakete nachinstallieren. Sie können dabei dem grafischen Installationssprogramm
    YaST2 oder dem textbasierten YaST wählen.


    # Hinweis


    Falls Sie bereits die SUSE Linux Firewall auf CD betreiben und nun auf die VPN
    Edition updaten möchten, müssen Sie nur die fas-Pakete von YaST oder YaST2 durch
    die folgenden Abschnitt aufgeführten fas2-Pakete ersetzen.


    Leider sind die Konfigurationen, die mit der Vorgängerversion erzeugt wurden,
    inkompatibel mit den Konfigurationen der FAS2. Sie können diese bestehenden Konfigurationen
    mit einem Skript konvertieren.


    Rufen Sie als ''root'' das Skript mit dem Befehl fas_convertconfig.pl auf und
    folgen Sie den Anweisungen des Programs. Das konvertierte tar-Arch der Konfiguration
    wird den gleichen Namen erhalten wie das Original und an derselben Stelle.


    # 3.2.1 Update with YaST2


    Um ein Update eines SUSE Linux 7.2 System oder eines SUSE Linux Enterprise Server
    7 auf die Firewall auf CD – VPN Edition durchzuführen, gehen Sie wie folgt:


    +   1. Melden Sie sich als Benutzer ''root'' an der grafischen Konsole an.

    2. Starten Sie das YaST2-Kontrollzentrum und wählen Sie unter YaST2 Module den
    Menüpunkt ''Software''.

    3. Legen Sie die CD mit der Aufschrift SUSE Linux Adminhost for Firewall ein.

    4. Unter dem Menüpunkt ''Change Source Media'' wählen Sie bei Quellemedium ''Von
    CD installieren''.

    5. Speichern Sie und beenden Sie den Dialog.

    6. Wählen Sie den Menü-Punkt ''Software'', aktivieren Sie die Checkbox ''Paketserie
    anzeigen''.

    7. Wählen Sie die Serie zfw aus und seleieren Sie die Pakete:


    +   * fas2-flc-dns

    * fas2-flc-base

    * fas2

    * fas2-flc-ftp

    * fas2-flc-ntp

    * fas2-flc-mail'
