    ## B.6 Transparente Proxy-Konfiguration


    Normalerweise schickt der Web-Browser an einen bestimmten Port des Proxy-Servers
    und der Proxy die angeforderten Objekte zur Verfügung stellt, ob sie nun im Cache
    sind oder nicht. Innerhalb eines echten Netzwerks können verschiedene Situationen
    auftreten:


    - Aus Sicherheitsgründen ist es besser, alle Clients zum Surfen im Internet einen
    Proxy verwenden.

    - Es ist notwendig, dass alle Clients einen Proxy verwenden, ob sie dessen bewusst
    sind oder nicht.

    - In großen Netzwerken, die bereits einen Proxy verwenden, ist es möglich, veränderte
    Konfigurationen der einzelnen Rechner zu speichern, falls sich Änderungen am System
    ergeben.


    In diesem Fällen kann ein transparenter Proxy eingesetzt werden. Das ist denkbar:
    Der Proxy nimmt die Anfragen des Web-Browsers entgegen und bearbeitet sie, sodass
    sie wieder kommen. Der gesamte Prozess wird transparent ausgeführt, da der Name
    für den Vorgang.


    ## B.6.1 Kernel-Konfiguration


    Zuerst sollte sichergestellt sein, dass der Kernel des Proxy-Servers einen transparenten
    Proxy unterstützt. Andersfalls muss man dem Kernel Optionen hinzufügen oder neu
    kompilieren. Weitere Informationen entnehmen Sie bitte dem SE Linux Referenzhandbuch.


    Wählen Sie im entsprechenden Eintrag zu den Netzwerkoptionen ''Network Firewalls'',
    und dann die Option ''IP: firewalling'' und ''IP: transparent proxying''. Jetzt
    muss nur noch die neue Konfiguration gespeichert, der neue Kernel kompiliert und
    installiert, ggf. LILO neu konfiguriert und das System neu gestartet werden.


    ## B.6.2 Konfigurationsoptionen in /etc/squid.conf


    Folgende Optionen in /etc/squid.conf müssen werden, um transparenten Proxy aufusetzen:


    ### Proxy-Server


    - httpd_port

    - httpd_access_method

    - httpd_proxy_connect

    - httpd_proxy_header

    - httpd_cache_first

    - httpd_cache_second

    - httpd_cache_third

    - httpd_cache_fourth

    - httpd_cache_fifth

    - httpd_cache_six

    - httpd_cache_seventh

    - httpd_cache_eighth

    - httpd_cache_nine

    - httpd_cache_ten

    - httpd_cache_eleven

    - httpd_cache_twelve

    - httpd_cache_thirteen

    - httpd_cache_fourteen

    - httpd_cache_fifteen

    - httpd_cache_sixteen

    - httpd_cache_seventeen

    - httpd_cache_eighteen

    - httpd_cache_nineteen

    - httpd_cache_twenty

    - httpd_cache_twenty_one

    - httpd_cache_twenty_two

    - httpd_cache_twenty_three

    - httpd_cache_twenty_four

    - httpd_cache_twenty-five (25)

    - httpd_cache_miss

    - httpd_cache_hit

    - httpd_cache_refresh

    - httpd_cache_expired

    - httpd_cache_negative

    - httpd_cache_revalidation

    - httpd_cache_store

    - httpd_cache_forward

    - httpd_cache_delete

    - httpd_cache_add

    - httpd_cache_remove

    - httpd_cache_update

    - httpd_cache_replace

    - httpd_vhost

    - httpd_url_rewrite_1000

    - httpd_access_allow

    - httpd_access_deny


