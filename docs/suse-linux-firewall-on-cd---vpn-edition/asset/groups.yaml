    # 5.3 Die Dienste auf der Firewall


    ```

    FW_SERVICE_DHCPD="no"

    ```


    Ein DHCP-Server dann setzen Sie FW_SERVICE_DHCPD auf "yes".


    ```

    FW_SERVICE_SAMBA="no"

    ```


    Wenn Sie Samba als Client oder Server auf diesem Rechner verwenden wollen, dann
    setzen Sie FW_SERVICE_SAMBA auf "yes". Für einen Samba-Server muss zusätzlich
    noch


    FW_SERVICES={WORLD,DMZ,INT}_TCP="139" gesetzt werden. Es ist grundsätzlich keine
    gute Idee, Samba auf einem Firewall-Rechner einzusetzen.


    3. Welche Dienste, die über Netzwerk erreichbar sein sollen, Zugriff auf die DMZ
    oder interne Netzwerk haben? Mit dieser Option können Sie den b. Zugriff für Mailserver
    erlauben. Diese Rechner müssen eine gültige IP-Adresse haben. Es wird eine offene
    Verbindung zu Ihrem Netzwerk aufgebaut, aber diese Option ist nur für Zugriffe
    auf Ihre DMZ. Folgende Wege sind möglich: Lassen Sie die Variable frei (die beste
    Wahl) oder verwenden Sie die Syntax für die Firewall-Regeln. Die Regeln trennen
    sich durch Leerzeichen. Eine Forwarding-Regel besteht aus:


    a) Quell-IP/Netz,

    b) Ziel-IP(oder IP/intern),

    c) Ziel-Port(oder IP protocol), getrennt durch Komma


    ```

    # Forward TCP connections

    # Beware to use this!

    # FW_FORWARD_TCP=""

    # Forward UDP connections

    # Beware to use this!

    # FW_FORWARD_UDP=""

    # Forward other IP protocol connections (for VPN setups)

    # Beware to use this!

    # FW_FORWARD_IP=""

    ```


    4. Welche Dienste dürfen auf maskierten Rechner (in ihrer DMZ oder dem externen
    Netz) verwendet werden? REQUIRES: FW_ROUTE, FW_MASQUERADE (Wait, the text says
    FW_MASQUERADE, but usually it''s FW_MASQUERADE. I will stick to text unless it''s
    a clear typo. Looking at "REQUIRES: FW_ROUTE, FW_MASQUERADE").


    Mit diesen Variablen können Sie den Zugang z. B. auf Ihren Mailserver gestalten.
