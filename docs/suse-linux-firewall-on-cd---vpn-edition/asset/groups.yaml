    # Einführung und Allgemeines


    strafbar, wenn sie keine geeigneten Gegenmaßnahmen ergreift. Es geht halt auch
    um Ihren guten Ruf.

    Um unerlaubten Zugriff auf das Firmennetz und dessen Ressourcen (Plattenplatz,
    CPU-Leistung etc.) zu verhindern, stehen heute verschiedene Schutzmaßnahmen zur
    Verfügung: Angefangen mit IP-Packetfilter auf einem Router bis hin zu mehrstuften
    Firewall-Lösung mit demilitarisierter Zone (DMZ).


    Im wörtlichen Sinn ist Firewall eine Schutzrichtung, die das Ausbreiten eines
    Feuers verhindert. Gebäude ohne Brandschutzmauern aus Ziegelsteinen, welche ganze
    Gebäudeabschnitte komplett abgeschossen sind, brennen ein Abschschluss den Motorwall
    des Fahrzeugagens. Der Zweck von Internet-Firewalls ist, Angriffe aus dem Internet
    von fern zu halten bzw. die Clients in Ihrem LAN Zugangsverbot zu regulieren und
    zu schützen.


    Die Computer-Firewall war ein nicht routender Verbindung zu verschiedenen Netzwerken.
    Das eine Netzwerkinterface mit dem Internet verbunden, das andere mit einem privaten
    LAN. Um vom privaten Netzwerk aus ins Internet zu gelangen, muss man sich auf
    einem Unix Firewall-Server anmelden, um den Zugang zum Internet zu erhalten. Sie
    können mit B. X-Fenster arbeiten, einem Browser auf dem Firewall-Rechner und das
    Display auf Ihre Workstation. Mit dem Browser auf der Firewall haben Sie Zugriff
    auf beide Netzwerke. Diese Art von „Dual Home Systems“ ist nur geeignet, wenn
    Sie allen Benutzern vertrauen können. Doch vielleicht ein Hinweis: 99 % aller
    Einbrüche in Computer-Systeme beginnen mit dem Versuch, sich einen Browser auf
    dem angeriffenen System anzumelden.


    Entscheidend für den Umfang der Maßnahmen ist der Schutzzedarf, der derweise sich
    geregelt ist, aber auch durch Kommunikationsanalysen ermittelt werden muss.


    Wichtig für den Betrieb einer Firewall ist auch die Dokumentation. Es muss festgehalten
    werden: „Wer hat was wie konfiguriert?“, um nachvollziehen zu können, ob Änderungen
    nur von autorisierter Stelle durchgeführt wurden. Dies ist z. B. für Zertifizierungen
    und Audits wichtig.


    „SuSE Linux Firewall on CD“ ist das Produkt, das den kompletten Bereich, in allen
    Stufen von Paketfilter bis zu mehrstufigen Firewall, abdecken kann. Alle verwendeten
    Programme Open Source sind, ist auch eine größere Schwierigkeit möglich.


    # 2.2 SuSE Linux Firewall on CD


    Die folgenden zwei Produkte bilden die „SuSE Linux Firewall on CD“:


    +   1. Die „SuSE Linux Live-CD für Firewall“

    2. die „SuSE Linux Admin-CD für Firewall“


    Im Folgenden wird der Einfachheit halber nur von der Live-CD bzw. Admin-CD gesprochen.
    Die Live-CD bildet die eigentliche Firewall, basierend'
  - '[PAGE 12]


    # SuSE Linux Firewall on CD


    auf dem Konzept des Application-Level-Gateways, mit IP-Paketfilterung kombiniert.
    Die Routing- und Gateway-Funktionalität ist standardmäßig ausgeschaltet, lässt
    sich aber, falls nötig, aktivieren. Alle Anfragen auf Anwendungsebene werden verarbeitet.
    Unterstützt werden die wichtigsten Internetprotokolle: SMTP, FTP, HTTP, HTTPS,
    DNS sowie VPN.


    Mit dem Admin-CD installieren Sie den SuSE Linux Admin, der für die Konfiguration,
    Überwachung und die Wartung der SuSE Linux Firewall vorgesehen ist. Um diesen
    Aufgaben gerecht zu werden, ist eine spezielle Auswahl an Softwarepaketen im Liefer-
    und Installationsumfang vorhanden.


    Wichtig für die Anbindung eines internen Netzes an das Internet ist eine vernünftige
    Planung und dazu gehört die Erstellung eines Sicherheitskonzepts. Dieses umfasst
    eine Kommunikations- und Bedarfsanalyse, außerdem sollte ein Konzept für den Notfall
    (Einbruch, Datenverlust usw.) erstellt werden. Sorgen Sie dafür, dass niemand
    unbefugter physikalischen Zugriff auf den Firewall-Rechner hat. Stellen Sie ihn
    am besten in einen abgeschlossenen Serverraum.


    # 2.2.1 Netzwerk Planung


    Vor dem Einrichten der Firewall sollten Sie sich überlegen, wie Sie das Netzwerk
    gestalten wollen. Die Diagramme im folgenden Abschnitt zeigen verschiedene Möglichkeiten.
    Als erstes sollten sich allerdings die geeignete Hardware denken.


    Der eigentliche Firewall-Rechner, der die SuSE Linux Firewall auf CD läuft, kann
    nicht zusätzlich für andere Zwecke genutzt werden. Er braucht auf Fälle ein Festplattenlaufwerk
    für die Konfigurationsdatei und ein fähiges CD-ROM-Laufwerk, eine Festplatte,
    falls Sie Squid oder Postfix verwenden wollen.


    Der Admin sollte ebenfalls ein Rechner sein, der ausschließlich dem Zweck, die
    Konfiguration zu erstellen und auf Diskette zu speichern. Das Firewall Administration
    System (FAS), mit dem die Konfiguration erstellt wird, läuft auf einer grafischen
    Benutzeroberfläche. Alle Programme, die Sie dazu benötigen, befinden sich sich
    auf dem Admin-CD. Der Admin kann darüber hinaus als Log-Rechner benutzt werden,
    wenn Sie dafür keinen zusätzlichen Rechner verwenden wollen.


    Der Log-Rechner zeichnet alle Vorgänge auf dem Firewall-Rechner auf, deshalb benötigt
    er eine Festplatte mit großer Kapazität. Die Verbindung zwischen LogRechner und
    Firewall-Rechner sollte niemals unterbrochen werden.


    # 2.2.2 Übliche Setups – Übersicht


    Im Folgenden stellen wir Ihnen ein paar übliche Setups für Firewall-Systeme vor.
    Alle hier dargestellten Lösungen sind mit der „SuSE Linux Firewall on CD“ realisierbar.'
