    ## C.1 SSH – 安全 shell，安全的替代方案


    hannes:~ scp -r src/ sonne:backup/

    将 src/ 目录的全部内容（包括所有子目录）复制到计算机 sonne 上的那里的 backup/ 目录中。

    如果该目录不存在，将会自动创建。


    通过选项 `-p` 使用 `scp`，可以保留文件的时间戳。`-C` 确保进行压缩传输。这一方面减少了需要传输的数据量，另一方面则需要更高的计算开销。


    ## C.1.4 sftp - 更安全的文件传输


    此外，可以使用 sftp 进行安全的数据传输。sftp 在会话中提供了许多在 ftp 中常见的命令。与 scp 相比，当文件名未知时，sftp 在数据传输方面可能更具优势。


    ## C.1.5 SSH 守护进程 (sshd) – 服务端


    SSH 守护进程是 SSH 软件包的一部分，在 SuSE Linux 中会自动在 Runlevel 3 和 5 下启动。在 `/etc/rc.config`
    中，变量 `START_SSH` 被设置为 `2`。

    在首次启动时，守护进程会生成两对密钥。密钥对由一个私钥和一个公钥（public key）组成。因此，这被称为基于公钥的方法。为了确保通过 SSH 进行通信，只有系统管理员可以读取私钥文件。数据权限在预创建时已设置了严格的限制。私钥仅供
    SSH 守护进程在本地使用，不能传递给任何人。此外，只有公钥可以传递给通信伙伴（以后缀 `.pub` 识别），并对所有用户可读。


    连接由 SSH 客户端发起。等待的 SSH 守护进程和请求的 SSH 客户端交换身份数据，以匹配协议版本和服务器版本，并排除指向错误端口的连接。原始 SSH
    守护进程的一个进程会响应，因此可以同时建立多个 SSH 连接。


    服务器发送自己的主机密钥（host key）和一个由 SSH 守护进程每小时重新生成的服务器密钥（encrypt），向 SSH 客户端发送一个其自选的会话密钥（session
    key），并将其发送 SSH 服务器。该密钥用于服务器所选的加密方法（cipher）。


    加密会话密钥强制所需的私有主机密钥和服务器密钥无法映射到公钥。


    ## 网络安全


    因此，被连接的 SSH 守护进程可以使用其私钥解密会话密钥（参见 `/usr/share/doc/packages/openssh/RFC.nroff`）。这种连接的初始阶段可以通过故障排除以及
    SSH 客户端程序进行追溯。只有当 SSH 守护进程确认“Received confirmation.”后，才会继续。通过客户端在首次接触后在 `~/.ssh/known_hosts`
    中查询所有公钥，可以防止所谓的“中间人”攻击。要求名称和 IP 地址的 SSH 服务器将通过明显的提示被移除。它们要么因为与 `~/.ssh/known_hosts`
    不符的主机密钥而被发现，要么由于没有相应的对应项而无法解密约定的会话密钥。


    建议备份存储在 `/etc/ssh/` 下的私钥和公钥。这样就可以检测到密钥的变化，并在重新安装后重新加载。这为用户节省了令人担忧的工作。如果尽管有警告，但**不是**正确的
    SSH 服务器，则必须从 `~/.ssh/known_hosts` 中删除该系统的现有条目。


