    einzelnen Programme. Es ist ziemlich sicher, dass der Angreifer erneut versucht,
    in Ihr System einzudringen. Das ist dann der Moment, in dem Sie die Möglichkeit
    haben, den Angreifer dingfest zu machen.


    Beispiele:


    Melden Sie sich auf der Konsole an.

    Untersuchen Sie die Logfiles.

    Zum Beispiel:


    ```

    # grep DENY /var/log/messages | less

    Mit diesem Befehl sehen Sie alle Zeilen, die DENY enthalten, die auch vom Paketfilter
    des Kernels aufgezeichnet worden sind. Sie können jetzt z. B. nach bestimmten
    auffällig aufgezeichneten IP-Adressen suchen (häuftes Auftreten von DENY-Meldungen
    von IP-Adressen). Find Sie heraus, was passiert ist. Mit den oben beschriebenen
    Werkzeugen lassen sich die Logfiles nach definierbaren Kriterien filtern. Problem:
    Manchmal weiß man nicht, was man sieht, was es ist... Es kann sein, dass ein Systemadministrator
    eines anderen Netzwerks von Ihnen via Postmaster- bzw. E-Mailadresse meldet und
    sich beschwert, dass ihm von Netz aus Angriffe auf fremde Regeln stattgefunden
    haben. Nehmen Sie sich Zeit, alle alle Protokolle über die Angriffspunkte zu Datum
    und Uhrzeit haben und mit Mitteln das fremde System angegriffen haben. Versuchen
    Sie, die Tat zu verifizieren. Es kann sein, dass ein Hacker, Hacker oder Angreifer
    Ihre Sicherheitsbeschränungen erweitert und Ihr Netzwerk für seine Zwecke missbraucht.
    Hier steht der Ruf Ihres Unternehmens auf dem Spiel.

    ```


    Wenn Sie alles gesehen und dokumentiert haben, überprüfen Sie Ihre Firewall-Konfiguration.
    Nach Beheben von eventuellen Fehlern oder Diensten, die Sie für gefährdet halten,
    starten Sie Ihre Firewall neu. Hier zeigt sich ein klarer Vorteil der „SuSE Linux
    Firewall auf CD“, den durch Booten des Firewall-Reachers der ursprüngliche Zustand
    wiederherstellt, eine aufwendige Neuinstallation des Betriebssystems und das Einspielen
    von Backups entfällt.


    # 7.5.3 Vorteil des Live-Filesystems der „SuSE Linux Firewall on CD“


    Einer großen Vorteile der SuSE Firewall ist, dass sie durch einfaches Booten in
    den Ausgangszustand zu setzen ist. Dies ist natürlich zu beachten, auch wenn eventuelle
    Konfigurationsfehler wieder vorhanden sind.'
  - '[PAGE 116]


    # Professionelle Hilfe und Support


    Sollte der ein Angriff eingreten sein, dass die Firewall überwunden worden ist,
    muss herausfinden, wie der Einbruch stattgefunden hat, um die fehlerhafte Konfiguration
    korrigieren zu können. Falls Programme Sicherheitslücken aufweisen, stellt die
    SuSE Linux Updates für die betroffenen Programme zur Verfügung – das heißt im
    Falle der „SuSE Linux Live-CD für Firewall“ eine neue CD.


    Hier können Sie weitere Informationen finden:


    ```

    http://www.cert.org und

    http://www.first.org

    ```


    # 7.6 Professionelle Hilfe und Support


    Wenn Sie einen Angriff vermuten, sich trotz der oben beschriebenen Maßnahmen zur
    Überprüfung nicht sicher sind, ob es zu einer Kompromittierung Ihres Tieres gekommen
    ist, leiten Sie unbedingt erste Sicherheitsmaßnahmen ein. Das bedeutet vor allem
    das Netzwerkverbindungen physisisch zu trennen.


    Wenden Sie sich mit Ihren Fragen an den Händler bei dem Sie SuSE Firewall auf
    CD erworben haben oder an SuSE. In diesen Fällen können Sie auch immer die Dienstleistungen
    von SuSE Linux in Anspruch nehmen.


    # 7.6.1 Supportbestimmungen


    Umfang des Installationssupports


    Der Installationssupport soll Ihnen helfen, Ihr SuSE Linux System einsatzfähig
    zu installieren. Dies gilt für die zentralen Komponenten des Systems, die einen
    prinzipiellen Betrieb ermöglichen können. Dazu zählen:


    +   - Die Installation des SuSE Linux-Grundsystems von der „Admin-CD für Firewall“
    auf einen Rechner nach erfolgreichen Start des „Firewall Administration Systems“
    (FAS).


    +   - Die Konfiguration der Basis-Hardware dieses Rechners mit dem grafischen
    Installationstool YaST2, d. h. der PC-Zentralkomponenten ohne Peripheriegeräte,
    jedoch inklusive der Einrichtung einer Netzwerkkarte.


    Alle hier nicht genannten Themen werden im Rahmen des Installationssupports nicht
    behandelt.


    # Zeitraum des Installationssupports


    Der Installationssupport für die Admin-CD für Firewall erstreckt sich über einen
    Zeitraum von 30 Tagen ab dem Registrierungsdatum.'
- md: "\n# Wie erreichen Sie das SuSE Support Team?\n\nSie können unser Support-Team\
