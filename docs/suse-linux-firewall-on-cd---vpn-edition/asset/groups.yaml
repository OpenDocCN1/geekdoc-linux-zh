    ## SuSE Linux Live-CD for Firewall


    ### 5.3 Die Dienste auf der Firewall


    Die Kernel-Version wird kontrolliert, um festzustellen, ob ipchains unterstützt
    wird. Das Skript wird dann abgebrochen, wenn ein 2.0-Kernel identifiziert wird
    oder ohne Warnung ausläuft, falls die Version des Kernels nicht identifiziert
    werden kann.


    ### SuSE Linux Live-CD for Firewall


    ## SuSE Linux Live-CD for Firewall


    ### TRACOUTE


    ICMP-Regeln werden in zwei Stufen erstellt. Zuerst werden spezielle ICMP-Pakete
    je nach Konfiguration erlaubt oder verboten, z. B. "ping" auf die Firewall, "Source
    Quench-Meldungen des nächsten verbundenen Routers wie Antwortpakete für allgemeine
    Programme wie traceroute. Die zweite Stufe bildet allgemeine Konfigurationen,
    die gefährliche ICMP-Pakete verbieten und wichtige erlauben. Das interne Netz
    darf die immer mit "ping" erreichen.


    ### TRACOUTE


    Den TCP-Regeln zuerst die konfigurierten Dienste freigeben, anschließend die für
    vertrauenswürdige Netze und letztlich für das interne Netz. Am Anschluss wird
    Port 113 konfiguriert, dass ein Timeout eingebaut wird, um unnötige Warzeiten
    (z. B. Senden von E-Mails) zu verhindern. Nun kommt ein entscheidender Automatismus
    zum Zug: Wer FW_AUTOPROTECT_GLOBAL_SERVICES auf "yes" gesetzt hat, werden Dienste
    durch Filter schützen, die nicht an ein spezielles Interface hören (also auf 0.0.0.0
    oder INADR_ANY). Dadurch kann man gegebenenfalls alle Ports für eingehende Verbindungen
    freigeben, wenn aber trotzdem Datenbanken schützen, die beispielsweise auf Port
    4545 laufen. Am Abschluss werden die Regeln generiert, oder auf privileilegierte
    Ports (zwischen 1024 und 65535) zugriffen werden; gar nicht; nur in /etc/resolv.conf
    definierte Nameserver; nur Verbindungen, die von einem bestimmten Ursprungport
    kommen (nicht empfohlen, wenn Schutz zu vermeiden ist); Interne Systeme dürfen
    auf die unprivilegierten Ports zugreifen – das AUTOPROTECT schützt ihre Dienste.


    ### TRACOUTE


    Das Gleiche für UDP ist nur hier ein Verbindungsreset vorgenommen, für Port 113
    nicht notwendig.


    Anschließend kommen die Routing-Regeln an die Reihe, die definieren, welche Systeme
    von außen auf ein internes Netz zugreifen werden dürfen. Das sollte aus vorliegenden
    Gründen nicht benutzt werden!


    Jetzt erst ist die Konfiguration der Regeln für Masquerading.


    Sehr wichtig ist die Konfiguration von zusätzlichen Logmechanismen für sensible
    Pakete, z. B. verbotene TCP-Pakete, die eine Verbindung aufbauen wollen. Wenn
    LOG_*ALL gesetzt wird, wird jedes Paket geloggt, was viele Einträge erstellt,
    und deshalb für Fehlerbeobachtung benutzt wird.


    Zu außerdem ein paar Optimierungsregeln für SSH, FTP, WWW, Syslog und SNMP, um
    diese schneller oder sicherer (hinichtlich der Übertragung im Netz) zu machen.


    Damit das Skript fertig ist, wird die Firewall aktiviert. Wenn ein Fehler auftritt,
    wird die Firewall gestoppt, damit keine falschen Regeln angewiert werden.


    > Hinweis

    Die Konfiguration dieser Einstellungen und die Benutzung des SuSE-Firewall-Skript
    allein macht Ihr System nicht von Haus aus sicher. Es gibt NICHT, was einfach
    installiert lässt und vor allen Sicherheitslücken schützt.


    * Vertrauen Sie keiner Software, die Sie nicht erstellt haben.

    * Prüfen Sie regelmäßig die Integrität des Servers.

    * Wenn Sie, was nicht empfehlenswert ist, den Firewall/Bastion-Server verwenden
    wollen, sollten Sie prüfen, ob Proxy-Server genutzt werden, z.B. Squid für das
    WWW, smtp für Mail etc. Denken Sie hierbei auch auf ''chroot'' und lassen Sie
    die Prozesse unter ''root'' laufen.

