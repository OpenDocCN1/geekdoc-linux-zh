    \n![](img/594883f46b5a0951172f1e794f42a4a5_44_1.png)\n\n图 4.12：使用 ipchains 的 IP\
    \ 数据包过滤配置\n\n### 4.3.5 SuSE 防火墙模块配置\n\n通过此模块，您可以逐步配置 SUSE 防火墙脚本。\n\n- 第一步，指定您在基础模块中配置的网络接口中，哪一个用于\
    \ DMZ（非军事化区）或您的内部网络。显示的是您在基础配置中标记为内部网络接口的接口。通过鼠标点击列表选择（参见图 4.13）。您在基础模块中标记为外部接口的接口将自动出现在“互联网设备”文本框中。\n\
    \n![](img/594883f46b5a0951172f1e794f42a4a5_45_0.png)\n\n图 4.13：选择设备\n\n- 2. 路由过滤：在此处您可以通过允许源地址、目标地址以及目标端口来允许数据包的直接路由（参见下面的图\
    \ 4.14）。这些需要需要这些操作。此外，您可以在此对话框中决定是否使用地址转换。如果您的互联网服务提供商获得了一个或少数几个官方 IP 地址，且您在使用私有\
    \ IP 地址范围，则可能是必要的。为此，请为相应的连接勾选地址转换。当 IPSec 连接到防火墙路由时，在“协议”组合框中选择“50”。（50 指 IPSec\
