    ## 3.3.2 Auswahl der Maus


    Dieser Dialog wird nicht eingeblendet, wenn YaST die Maus nicht automatisch erkennen
    konnte. Ein Dialogfenster mit einer langen Liste von Mausbezeichnungen erscheint,
    in der Sie den erforderlichen Maustyp auswählen können. Nachdem Sie den richtigen
    Typ gefunden haben, gehen Sie mit (Tab) auf den Button ''Testen'' und drücken
    Sie (). Bewegen Sie die Maus. Wenn sich der Zeiger kontrolliert lässt, ist alles
    in Ordnung und Sie können mit der Maus auf ''Weiter'' klicken. Im Falle eines
    Fehlversuchs gehen Sie wieder mit (Tab) in die Auswahlliste, um die Einstellung
    zu korrigieren.


    Wenn kein Maustyp funktioniert oder Sie gar keine Maus verwenden wollen, aktivieren
    Sie bitte den Eintrag ''Keine Maus''. Dann wird die weitere Installation über
    die Tastatur starten.


    ## 3.3.3 Tastatur und Zeitzone


    Wählen Sie nun das Tastatur-Layout und die Zeitzone aus.


    ![](img/594883f46b5a0951172f1e794f42a4a5_21_0.png)


    Abbildung 3.2: YaST2: Tastatur und Zeitzone


    - Testen Sie bitte Ihre Tastatur. Dazu können Sie mit einem Mausklick mit mehrmalem
    (Tab) das Eingabefeld aktivieren und Buchstaben eingeben. Testen Sie insbesondere
    ''y/z'' sowie die Umlaute.

    - Als zweiter Punkt steht eine Länderliste zur Verfügung. YaST2 wird dir die passende
    Zeitzone wählen bzw. das richtige Teilgebiet zu.


    Der Button ''Weiter'' bringt Sie zum nächsten Dialogfenster.


    ## 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall


    ## 3.3.4 Festplatte vorbereiten


    Bei den folgenden Schritten wählen Sie den Festplatten vorbereiten und bereiten
    diese auf die Installation von SuSE Linux vor. Je nach Hardware-Konfiguration
    Ihres Rechners die folgenden Dialoge kleinere oder größere Abweichungen von dem
    hier beschriebenen Beispiel aufweisen.


    ### Schritt 1


    ![](img/594883f46b5a0951172f1e794f42a4a5_22_0.png)


    Abbildung 3.3: YaST2: Festplatte vorbereiten (I)


    Befindet sich im Rechner noch eine Festplatte, muss zuerst entschieden, welche
    für die Installation genutzt wird. Die gefundenen Platten werden nacheinander
    aufgelistet, vgl. Abbildung 3.3.


    Im Normalfall werden Sie eine Festplatte auswählen und danach auf ''Weiter'' klicken.


    ### Schritt 2


    Eine der folgenden Situationen kann auftreten:


    - Wenn die Festplatte nicht leer ist, zeigt YaST2 hier alle auf der Platte befindlichen
    Partitionen sowie den Punkt ''Gesamte Festplatte'' an. Frei, nicht partitionierter
    Speicherplatz am Ende der Festplatte wird ebenfalls angezeigt und automatisch
    formatiert. Dieser Platz kann YaST2 zusammenhängend nutzen, d. Partitionen können
    nur ''von hinten'' her zur zusätzlichen Partition fregeben werden, bei bereits
    eingerichteten Partitionen sind beispielsweise Partition 1 und 2 erhalten und
    kreuzen die dritte für Freigabe an. Falls Sie sich dafür entscheiden, die gesamte
    Platte für SuSE Linux zur Verfügung zu stellen, wählen Sie ''Gesamte Festplatte''.

    - Eine leere Platte ist komplett für SuSE Linux verwendet.


    ## SUSE Linux Adminhost for Firewall


    Wenn Sie andere Anforderungen haben, gehen Sie ‚Zurück‘ zum letzten Dialog, um
    dort mit Hilfe der ‚Erweiterten Einstellungen‘ manuell zu partitionieren.


    > ### Hinweis

    Da die ausgewählten Partitionen, die für SuSE Linux zur Verfügung gestellt werden
    sollen, gehen alle dort eventuell vorhandenen Daten unwiederruflich verloren!


    Wenn später die eigentliche Installation beginnt und alle Bedingungen erfüllt,
    wird YaSt2 den Festplatz selbstständig einrichten. Die gesamte Platte von der
    freien Platz bzw. die freiggebenen Partitionen werden für SuSE Linux in drei Standard-Partitionen
    aufgeteilt (und zwar eine kleine Partition für /boot [etwa 16 MB] bis zum Beginn
    der Platte, eine Partition für Swap [128 MB] und der ganze Rest für /).


    ## 3.3.5 Bootmanager für den Systemstart


    Damit Linux später überhaupt starten kann, ist ein Bootmechanismus nötig. Wie
    festgelegt wird, welcher Sie im System der Bootmanager LILO (engl. Linux Loader)
    installiert wird bzw. ein anderes Bootkonzept verwendet wird.


    ## 3.3.6 `root`-Passwort festlegen


    Der Benutzer `root` ist unter Linux mit besonderen Privilegien ausgestattet, er
    kann z. B. Systemprozesse starten/beenden, Benutzer anmelden und entfernen, wichtige
    Systemdateien manipulieren etc. und übernimmt sofern die Aufgaben eines Systemadministrators.

    Sie werden hier dazu aufgefordert, für den Benutzer `root` ein Passwort zu vergeben.


    > ### Hinweis

    Das `root`-Passwort müssen Sie sich unbedingt merken; Sie können es später nicht
    mehr rekonstruieren. Sie werden das Passwort immer wieder brauchen, wenn Sie administrative
    Aufgaben am System durchführen wollen.


    ## 3.3.7 Einstellungen bestätigen – Installation starten


    Zur Übersicht und Kontrolle werden alle bisher gesammelten Daten angezeigt. Falls
    Sie Änderungen vornehmen möchten, gelangen Sie mit ‚Zurück‘ schrittweise wieder
    bis zu zur ersten Eingabemaske.


    ## 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall


    ![](img/594883f46b5a0951172f1e794f42a4a5_24_0.png)


    Abbildung 3.4: YaST2: Eingabe des ''root''-Passwortes


    Wenn Sie ''Weiter'' klicken, erfolgt eine Sicherheitsfrage, ob Sie die Installation
    jetzt starten möchten:


    - Nach Bestätigung mit ''Ja'' beginnt YaST2 mit der Einrichtung.

    - ''Nein'' haben Sie die Möglichkeit, die Einstellungen erneut zu ändern.

    - Wenn Sie die Installation abbrechen, wird das System in einen undefinierten
    Zustand versetzt.

    '
  mdcn: '


    ## 3.3.2 选择鼠标


    如果 YaST 无法自动识别鼠标，则不会显示此对话框。将弹出一个包含大量鼠标列表的对话框，您可以在其中选择所需的鼠标类型。找到正确的类型后，使用 (Tab)
    移动到“测试”按钮并按下 ()。移动鼠标。如果指针可以受控，则一切正常，您可以用鼠标点击“继续”。如果测试失败，请再次使用 (Tab) 回到选择列表以纠正设置。


    如果没有一种鼠标类型可以工作，或者您完全不想使用鼠标，请激活“无鼠标”选项。接下来的安装将通过键盘进行。


    ## 3.3.3 键盘和时区


    现在选择键盘布局和时区。


    ![](img/594883f46b5a0951172f1e794f42a4a5_21_0.png)


    图 3.2：YaST2: 键盘和时区


    - 请测试您的键盘。您可以通过鼠标点击并多次按 (Tab) 激活输入框并输入字母。请特别测试 ''y/z'' 以及变音符号（Umlaute）。

    - 第二点提供了一个国家列表。YaST2 将为您选择合适的时区或正确的区域。


    点击“继续”按钮将带您进入下一个对话框。


    ## 3.3 重新安装 SuSE Linux Adminhost for Firewall


    ## 3.3.4 准备硬盘


    在后续步骤中，您选择“准备硬盘”并为安装 SuSE Linux 作准备。根据您计算机的硬件配置，后续对话框与此处描述的示例可能会略有差异。


    ### 步骤 1


    ![](img/594883f46b5a0951172f1e794f42a4a5_22_0.png)


    图 3.3：YaST2: 准备硬盘 (I)


    如果计算机中仍有硬盘，必须首先决定哪块硬盘用于安装。找到的硬盘将依次列表，参见图 3.3。


    通常情况下，您将选择一个硬盘并点击“继续”。


    ### 步骤 2


    可能会以下情况之一：


    - 如果硬盘不是空的，YaST2 将在此处显示硬盘上的所有分区以及“整个硬盘”项。硬盘末尾未分区的可用空间也将显示并自动格式化。YaST2 可以连续使用此空间，即分区只能从“后部”释放以作为额外分区；例如，对于已设置的分区，分区
    1 和 2 将保留，并跨越第三分区以供释放。如果您决定将整个硬盘提供给 SuSE Linux，请选择“整个硬盘”。

    - 空闲硬盘将完全供 SuSE Linux 使用。


    ## SUSE Linux Adminhost for Firewall


    如果您有其他需求，请点击“返回”回到上一个对话框，在那里通过“高级设置”手动进行分区。


    > ### 注意事项

    由于所选的分区将提供给 SuSE Linux，那里可能存在的所有数据将不可恢复地丢失！


    如果稍后开始实际安装并满足所有条件，YaST2 将自动设置磁盘。整个硬盘的可用空间或释放的分区将为 SuSE Linux 分为三个标准分区（分别是从硬盘开始处的小型
    /boot 分区 [约 16 MB]、Swap 分区 [128 MB] 以及剩余所有部分全部用于 /）。


    ## 3.3.5 用于系统启动的引导管理器


    为了以后 Linux 启动，需要一个引导机制。通过设置将决定在系统中安装引导管理器 LILO（英文：Linux Loader）还是使用其他的引导概念。


    ## 3.3.6 设置 `root` 密码


    `root` 用户在 Linux 下拥有特殊权限，例如，可以启动/结束系统进程、登录和删除用户、操纵重要的系统文件等，并承担系统管理员的任务。

    在此您被要求为 `root` 用户分配密码。


    > ### 注意事项

    您务必记住 `root` 密码；以后您将无法恢复它。当您对系统执行管理任务时，将会反复需要该密码。


    ## 3.3.7 确认设置 – 开始安装


    为了便于概述和控制，将显示所有之前收集的数据。如果您想进行更改，请通过“返回”逐步回到第一个输入掩界面。


    ## 3.3 重新安装 SuSE Linux Adminhost for Firewall


    ![](img/594883f46b5a0951172f1e794f42a4a5_24_0.png)


    图 3.4：YaST2: 输入 ''root'' 密码


    当您点击“继续”时，会出现一个安全询问，询问您现在是否开始安装：


    - 确认点击“是”后，YaST2 开始设置。

    - 点击“否”，您将有机会再次更改设置。

    - 如果取消安装，系统将处于未定义状态。


    '
