    auch notwendig, wenn Sie die Log-Meldungen von syslog lokal speichern wollen.
    Um das Firewall-System in Betrieb zu nehmen, legen Sie die CD und die mit dem
    SuSE Firewall Adminhost erstellte Konfigurationsdatei ein und booten den Brenner.


    # 5.3 Die Dienste auf der Firewall


    Auf der „SuSE Linux Live-CD for Firewall“ befinden sich „Application Level Gateways”(Proxies)
    für die gängigsten und wichtigsten Internetprotokolle:


    +   **DNS (engl. Domain Name System):** Die Umsetzung von IP-Adressen in „Fully
    Qualified Domain Names“ und umgekehrt erfolgt mit bind


    +   **SMTP** Der Transport von E-Mail übernimmt postfix


    +   **HTTP/HTTPS – das Protokoll des WWW:** Squid, httpf, transproxy, tinypoxy


    +   **FTP** für die Datenübertragung von einem Host zu einem anderen wird ftp-proxy-seite
    genutzt.


    +   **SSH** Der „remote login“ mit verschlüsselter Übertragung erfolgt mit openssh,
    die Authentifizierung mit RSA-Schlüssel-Paaren.


    +   **inetd** Generischer tcp Proxy rinetd


    +   **ntp** Zeitserver xntpd


    +   **ipsec** FreeS/WAN


