    # 5.3.7 chroot, secumod, compartment, Kernel-capabilities


    Um die Sicherheit auf der Firewall zu erhöhen, laufen auf SuSE Live-CD für die
    Dienste in einer chroot-Umgebung. Außerdem werden das „secumod“-Kernelmodul und
    „compartment“ verwendet. Durch das Setzen von Capability-Bits im Kernel wird die
    Sicherheit von Programmen im System erhöht.


    chroot Mit mit Programm eine Sicht auf das Dateystem widerruflich eine neue „root“
    für das Dateystem festgelegt. Sobald das Programm auf den Ausschnitt des Dateystems
    festgelegt ist, übernimmt nicht die Sicht des gesamten Dateystems dieses Programms
    nicht mehr. Selbst wenn das Programm irgendwiele crashed, bleibt der Angreifer
    in der chroot-Umgebung und kann das eigene System nicht beschädigen.


    secumod Spezielles Kernelmodul, das die Sicherheit des Systems erhöht. Dazu gehört
    z. B.: das Festlegen von


    +   * Trusted Path,

    * Verbot von Hardlinks auf Dateien anzuzeigen, die einem nicht gehören,

    * Schutz des proc-Files,

    * Symlinks werden nicht verfolgt, wenn sie nicht dem gerade laufenden Prozess
    (Ausnahme: der Prozess läuft ‚root’-Rechten) gehören.

    * Schutz von fifos,

    * syscall table tracking,

    * logging,

    * Setzen von Capabilities.


    compartment ermöglicht das Lauf von Programmen/Diensten in chroot-jails mit unprivileierten
    Benutzern/Gruppen. Es unterstützt Skripte, die vor dem eigentlichen Programm aufgerufen
    werden (z. B. zum Aufbau einer Umgebung). Unterstützt die Verwendung von Kernelcapabilities.


