- md: '

    ## 4.3 Erstellen einer neuen Firewall-Konfiguration


    ![](img/594883f46b5a0951172f1e794f42a4a5_60_0.png)


    Auf ausgewählte IP-Adresse: IP-Adresse des Interfaces, auf dem der Proxy Verbindungen
    entgegen nimmt.


    IP-Adresse des Webservers: Die IP-Adresse Ihres Web-Servers, der in Ihrem Intranet
    steht.


    Webserver-Port: Normalerweise ist dies Port 80.


    ## 4.3.12 Das FAS Keyring Modul


    Das „Keyring Modul“ in FAS wird benötigt, um die Zertifikate für die Verschlüsselung
    bei der Verwendung von IPsec mit X.509 Zertifikate zu erzeugen, importieren und
    zu verwalten. Das FAS Modul tau nicht in der linken Modulliste auf, sondern ist
    in der oberen Menüleiste über ‘Module’ → ‘Zertifikatverwaltung’ zu erreichen.


    ## Über Zertifikate und Certificate Authority (CA):


    Die Schlüssel und Zertifikate werden auf dem Adminhost für Firewall mit dem Programm-Paket
    OpenSSL erstellt.


    ## SSL und PKI


    Mit SSL wird asymmetrisch verschlüsselt, d. h. ist nur für Verschlüsselung und
    Entschlüsselung immer ein Schlüsselpaar, bestehend aus Public- und Private-Key
    notwendig.


    ## PKI - asymmetrische Verschlüsselung


    Bei diesem Verfahren werden Public-Keys zwischen Client und Server ausgetauscht.
    Die Verschlüsselung erfolgt mit dem Public-Key der jeweiligen Seite.


    Zur Entschlüsselung wird der Private Key benötigt.


    ## Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_61_0.png)


    Abbildung 4.34: Konfiguration des externen HTTP-Proxies


    ## CA Certificate Authority


    Um ein Zertifikat zu signieren, benötigen Sie eine CA. Es gibt Stellen, die eine
    offizielle CA haben. Dieser Stelle müssen Sie jedes Ihrer Zertifikat zur Signierung
    übergeben.


    Sie können sich auch eine CA selbst erzeugen und Ihre Zertifik selbst signieren.

    Dies ist für diese Zwecke vollkommen ausreichend.


    ## X.509 Zertifikate


    Ein X.509 Zertifikat besteht aus den folgenden Teilen:


    - Version

    - Serial

    - Signieralgorith

    - issuer-Name

    - Gültigkeitsdauer

    - Subject Username

    - Subject Publicickey Information

    - issuer unique identifier

    - subject unique identifier

    - extensions

    - signature on above


    FAS stellt ein Frontend für die Erstellung von X.509 Zertifikaten zur Verfügung.


    ## 4.3 Erstellen einer neuen Firewall-Konfiguration


    ### Zertifikat-Verwaltung


    Starten Sie das FAS. Melden Sie sich im FAS als Adminbenutzer an.

    Wählen Sie im Menü ''Module'' den Punkt ''Zertifikat-Verwaltung''.

    Sie bekommen nun eine Liste angezeigt, in falls vorhanden, die vorhandenen Zertifikate
    angezeigt werden (Abbildung 4.35).


    ![](img/594883f46b5a0951172f1e794f42a4a5_62_0.png)


    Abbildung 4.35: Liste der Zertifikate


    Beim ersten Starten haben Sie normalerweise keine CA (Certificate Authority).
    Sie benötigen die CA, um Zertifikate für Ihre Clients zu erstellen.


    ## CA erstellen


    Dieser Dialog ist global für alle Konfigurationen, die auf den Adminhost erstellt
    werden. Mit dieser CA werden alle Zertifikate, die Sie erstellen, signiert.


    Starten Sie im Menü ''Zertifikat-Verwaltung'' den Punkt ''CA erstellen''. Es erscheint
    ein Dialog, den Sie vollständig ausfüllen sollten (Abb. 4.36 auf der rechten Seite).
    Viele dieser Einstellungen werden für die Erzeugung von Clientzertifikaten übernommen.


    - zuerst Nutzen Sie einen Namen für Ihre CA, z. B. Ihren Firmennamen.

    - Unter E-Mail-Adresse geben Sie den für die CA verantwortlichen Mitarbeiter an.
    (z. B. Sicherheitsbeauftragter für Ihr Firmennetz).

    - Abteilung: Geben Sie hier z. B. den Abteilungsnamen an.

    - Firma: Ihr Firmennamen

    - Ort: Ort, z. B. Ihr Firmensitz


    ## 4 Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_63_0.png)


    | Name | My Company CA |

    | :--- | :--- |

    | E-Mail-Adresse | info@mydomain.com |

    | Abteilung | |

    | Firma | My Company Inc. |

    | Ort | Somewhere |

    | Bundesstaat | |

    | Land | US |

    | CA-Passwort | ****** |

    | CA-Passwort bestätigen | ****** |

    | Schlüsselgröße | 1024 Bits 2048 Bits |


    Abbildung 4.36: Dialog zur Erstellung einer CA


    - Bundesstaat: Bundesland

    - Land: Das zweibuchstige Länder Ihrer Landes (DE, US, usw.)

    - CA-Passwort: Geben Sie ein Passwort für die CA an, um gegen Missbrauch zu schützen.
    Kontrollende Eingabe der Passphrase.

    - Schlüsselgröße: Sie können hier die Schlüsselgröße wählen. Ein längerer Schlüssel
    lässt sich schwerer „knacken“. Wählen Sie 1024 oder 2048.


    Nachdem Sie alle Eingaben gemacht haben, klicken Sie auf ''OK''.


    ## Erstellen eines Zertifikats


    Wählen Sie das Menü ''Zertifikat-Verwaltung'' und den Punkt ''Zertifikat erstellen''.
    Es erscheint ein Fenster, in dem Sie die notwendigen Angaben eingeben können.

