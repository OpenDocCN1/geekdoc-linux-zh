    ## 用于防火墙的 SuSE Linux Live-CD


    SuSE 防火墙脚本的设计要求：


    - **安全高于一切**

    安装和配置软件包的用户期望脚本能尽一切努力来确保系统安全。用户必须接受：某些项的配置可能会变得更加困难，或者在（极少数情况下）根本无法通过此软件包进行配置。此外，设置此类软件包需要花费一定的时间成本。


    - **发生错误时确保系统不被破坏**

    脚本中的错误或配置文件中的错误不应导致开放的过滤规则生效。这一目标在某些领域尚未实现，但 SuSE 已为此付出了努力。


    - **配置简单易用**

    提出的问题很少——但提出的每一个问题都是绝对必要的。这自然是最大的挑战——尽管尽管如此，你仍然需要具备 TCP/IP 知识、管理员技能、安全感以及耐心……


    - **自动化配置**

    为了简化配置过程并支持动态系统，SuSE 团队尝试尽可能在启动防火墙脚本时刻才获取这些数据。


    - **支持动态 IP 地址 + 网络**

    不仅支持动态 IP 地址，还支持连接互联网和内部网络的多个网卡（无限数量）。


    在接下来的段落中，多次提到了内部接口和网络的过滤规则，这些规则指向内部接口或网络，如果它们在防火墙脚本启动时已配置并存在，则会被处理。如果在脚本启动后才变为可用（例如因为接口最初是关闭状态，即
    "down"），则无法与该网络进行通信！


    位于 `/sbin` 的 SuSE 防火墙脚本流程如下：


    a) 首先读取配置文件 `/etc/rc.config/firewall.rc`。用户在进行操作之前必须先配置 `/etc/rc.firewall`。这些文件在使用
    FAS 时会被创建。


    b) 然后会寻找 `sed`、`awk`、`grep`、`ifconfig`、`netstat` 等辅助程序。如果找不到其中任何一个，将输出错误信息并退出。接下来将检查内核版本以确定是否支持
    `ipchains`。如果识别出 2.0 内核或在无法识别内核版本时无警告运行，脚本将终止。


    c) 接下来是解释配置文件并确定重要的实时数据。例如，将读取脚本中配置的所有网络的 IP 地址和子网掩码。如果接口不是“启动”状态（例如 ISDN 或 PPP
    接口），尽管脚本执行过程中会为此生成过滤规则，但仅是基础的保护措施。在建立如 ISDN 等连接后，应重新启动 SuSE 防火墙脚本。


    d) 接下来继续？首先重置防火墙，并将入站包和通过防火墙的包的默认设置为“丢弃 (drop)”。如果由于原因脚本中没有某个包的规则，它将被丢弃。需要离开防火墙的包在此处设置为默认值“允许
    (allow)”。


    e) `/proc` 脚本允许在系统运行时简单地配置内核。脚本借此开启某些安全选项。对于许多人来说，只有将配置文件中的 `FW_SECURITY` 选项设置为
    "yes" 才有帮助，因为影响可能是复杂的。


    f) 设置为“路由 (route)”的将激活路由功能。


    g) 然后——非常重要——允许通过 "localhost" 接口的所有流量。


    h) 现在处理“IP 欺骗 (IP Spoofing)”和“防止绕过 (Circumvention prevention)”规则。这些规则确保拦截并拒绝伪装属于其他网段的外部和内部攻击。同时，也不会阻止对内部网络的直接访问尝试。


    i) 重定向规则（Redirecting rules），可以将对内部网络或本地端口的访问切换到防火墙的特定端口。


    j) 连接到内部（受信任）网络的用户可以在配置文件中指定防火墙是否应防御来自内部的攻击。如果不是如此，此处将允许所有从内部网络到防火墙的流量。此处的选项 `FW_PROTECT_FROM_INTERNAL`
    有此作用。


    然后生成 ICMP、TCP 和 UDP 的规则。


    k) ICMP 规则分两个阶段创建。首先根据配置允许或禁止特定的 ICMP 包，例如对防火墙的 "ping"来自最近连接路由器的“源拥塞通知 (Source
    Quench) 消息”（例如作为 traceroute 等通用程序的响应包）。第二阶段形成通用配置，禁止危险的 ICMP 包并允许重要的包。内部网络始终允许通过
    "ping" 访问。


    l) TCP 规则首先允许已配置的服务，然后是针对受信任网络的，最后是针对内部网络。随后配置端口 13 以引入超时机制，防止不必要的等待（例如发送电子邮件）。现在是一个关键的自动机制：将
    `FW_AUTOPROTECT_GLOBAL_SERVICES` 设置 "yes" 的用户将过滤未监听特定接口（例如 0.0.0.0 或 INADR_ANY）的服务。因此，可以在情况下允许所有入站连接，但保护运行在端口
    4545 上的数据库。最后生成规则，允许访问特权端口（1024 到 65535）；完全不允许；仅允许 `/etc/resolv.conf` 定义的 DNS；仅允许来自特定源端口的连接（如果需要保护则不建议这样做）；内部系统可以访问非特权端口——AUTOPROTE
    会保护其服务。


    m) UDP 类似，仅对端口 13 执行重置。


    n) 随后是路由规则，定义哪些系统可以访问内部网络。由于上述原因不应使用！


    o) 现在是配置伪装（Masquerading）规则。


    p) 为敏感包配置额外的日志机制非常，例如尝试建立连接的禁用 TCP 包。如果设置了 `LOG_*ALL`，将记录每个包，这将产生大量条目，因此用于故障排除。


    q) 此外为 SSH、FTP、WWW、Syslog 和 SNMP 添加一些优化规则，以使其在网络传输中更快或更安全。


    脚本完成后，激活防火墙。如果发生错误，停止防火墙以防应用错误的规则。


    ## 5.3 防火墙上的服务


