    \ SuSE Linux 防火墙\n\n![](img/594883f46b5a0951172f1e794f42a4a5_14_0.png)\n\n图 2.3：直观且有效的设置\n\
    \n图 2.3 显示了一个仍然直观但明显更有效的解决方案。\n“筛选路由器”在数据包层面拦截未经授权的访问。其后是第一台防火墙计算机，它在应用层并通过包过滤器规则控制对\
    \ DMZ 以及第二台防火墙（从而内部网络）的访问。第二台计算机基于包过滤器和代理保护内部网络，并管理从内部网络到互联网和 DMZ 的访问。管理员计算机位于一个与防火墙系统连接的独立网络中。\n\
    \n## 用于防火墙的 SuSE Linux Adminhost\n\n管理、维护和监控防火墙并不是一项轻松的任务，特别是当监控不能被轻视时。因此，交付的\
    \ CD 中包含了一个“SuSE Linux Adminhost for Firewall”，它将帮助您配置、管理和维护 SuSE Linux 防火墙。\n\
    \n## 3.1 介绍\n\n在安装 SuSE Linux Adminhost for Firewall 后，您将拥有一个防火墙管理系统（FAS），这是一个带有图形化管理界面的工具，允许您对“SuSE\
    \ Linux Live-CD für Firewall”进行配置。\n对于防火墙监控，提供了可配置的工具，让能够进行防火墙测试、日志文件分析和监控，并可以通过电子邮件、传寻机等方式通知系统管理员，以便尽可能尽早采取适当措施（例如，断开与互联网/内网的网络连接等）。\n\
    \n这里已经表明，防火墙的持续监控并不能提供真正的绝对保护。此外，在防火墙配置中进行的所有更改都应进行持续且完全的记录。通过文档可以发现错误，也可以发现来自未经授权侧的更改并进行撤回。\n\
    \n## 3.2 更新\n\n如果您在将用作防火墙管理主机（Adminhost）的计算机上已经安装了 SuSE Linux 7.2 或 SuSE Linux\
    \ Enterprise Server 7，即 # SUSE Linux Adminhost for Firewall，则您不需要重新安装，只需安装必要的包即可。您可以选择图形化安装程序\
    \ YaST2 或基于文本的 YaST。\n\n### 注意\n\n如果您已经在运行 CD 上的 SUSE Linux 防火墙，现在想更新到 VPN 版本，您只需通过\
    \ YaST 或 YaST2 替换下节列出的 fas2 包。\n\n遗憾的是，用旧版本生成的配置与 FAS2 配置不兼容。您可以使用脚本转换这些现有配置。\n\
    \n以 'root' 用户身份运行 `fas_config` 命令并遵循程序的说明。转换后的配置将与原始位置相同。\n\n### 3.2.1 使用 YaST2\
    \ 更新\n\n要对 SUSE Linux 7 系统或 SUSE Linux Enterprise Server 7 的防火墙 CD 更新 VPN 版本，请按照以下步骤操作：\n\
    \n1. 以 'root' 用户登录图形控制台。\n2. 启动 YaST2 控制中心，并在 YaST 中选择“软件”菜单项。\n3. 插入带有 SUSE Linux\
    \ Adminhost for Firewall 字样的 CD。\n4. 在“更改源”菜单项下选择“从 CD 安装”。\n5. 保存并退出对话框。\n6.\
    \ 选择“软件”菜单项，勾选“显示包”复选框。\n7. 选择 zfw 系列并选择包：\n   - fas2-fc-dns\n   - fas2-fc-base\n\
    \   - fas2\n   - fas2-fc-ftp\n   - fas2-fc-ntp\n   - fas2-fc-mail\n   - fas2-fc-http\n\
    \   - fas2-fc-inetd\n   - fas2-fc-ipchains\n   - fas2-fc-ipsec\n   - fas2-doc\n\
    \   - fasd2\n   - yast2-config-fwadmin\n   - yast2-trans-fwadmin\n8. 如果您同时将此计算机作为日志主机，必须安装\
    \ syslog-ng 系列。\n\n### 3.2.2 使用 YaST1 更新\n\n1. 以 'root' 用户登录控制台。\n2. 插入 SUSE Linux\
    \ Adminhost CD。\n3. 启动 YaST。\n4. 在 YaST 中选择“软件包管理”。\n5. 选择“更改/创建配置”。\n6. 切换到 zfw\
    \ 系列。\n7. 选择此处除 fas2-devel 以外的所有包：\n   - fas2-fc-dns\n   - fas2-fc-base\n   -\
    \ fas2\n   - fas2-fc-ftp\n   - fas2-fc-ntp\n   - fas2-fc-mail\n   - fas2-fc-http\n\
    \   - fas2-fc-inetd\n   - fas2-fc-ipchains\n   - fas2-fc-ipsec\n   - fas2-doc\n\
    \   - fasd2\n   - yast2-config-fwadmin\n   - yast2-trans-fwadmin\n8. 将显示包的依赖关系，在“未满足的依赖”对话框中按\
    \ F10 解决它们。\n\n### 3.2.3 完成更新\n\n只有当您从 SUSE Linux 7 或 Enterprise Server 7 更新后（无论是用\
    \ YaST1 还是 YaST2 安装包），还需要以下命令调用 SUSE Linux Adminhost 的 YaST2 模块：\nroot@admin:\
    \ # /sbin/yast2 fwadmin\n\n或者，您可以在 KDE 下启动 YaST2 控制中心，并在“网络/基础”下调用“SUSE Firewall\
    \ Adminhost”模块（图 3.1）。\n\n![](img/594883f46b5a0951172f1e794f42a4a5_19_0.png)\n\
    \n图 3.1：YaST2 控制中心\n\n如果您已将 CD 上的 SuSE Linux 防火墙扩展了 VPN，则没有必要。但是，您必须重启 fasdaemon。以\
    \ 'root' 用户身份调用 `fasadmin restart` 命令。请记住按照第 17 页第 3.2 节所述对旧配置进行转换。\n\n## 3.3\
    \ 重新安装 SuSE Linux Adminhost for Firewall\n\n要重新安装“SuSE Linux Adminhost for Firewall”，请将相应标记的\
    \ CD 插入计算机的 CD 驱动器并重启。如果计算机没有从 CD 启动，必须在 BIOS 中相应更改启动顺序。\n\nlinuxre 欢迎屏幕——只需按右箭头，随后将启动自动硬件识别。\n\
    \nYaST2 将引导您完成后续安装。将安装所有管理、配置和维护所需的程序。\n\n### 3.3.1 语言选择\n\n从语言选择开始，您再次可以使用鼠标或键盘干预安装过程。所有输入字段、选择列表和按钮（“按钮”或“按钮”）都可以鼠标点击选择。如果您想使用键盘选择，适用以下规则：\n\
    \n- Tab 将焦点引向某个区域、输入/选择字段或按钮；使用 ⇧Shift + Tab 可以进入另一个选择组。使用 ⌃ 和 ⇧ 可以在活动区域进行选择或在列表中翻页。\n\
    - Enter 将执行选定的命令；通常是对应按钮上标记的操作。\n- 使用空格键可以勾选项目。\n- 此外，某些操作可以通过 Alt + 带下划线的字母组合触发。\n\
    \n> 提示\n> 在随后的对话框中，YaST2 可以收集信息。稍后 YaST2 将以汇总形式向您提供这些结果；按照第 3.3.7 节第 24 页描述的方法，您仍有机会通过“返回”按钮回到之前的对话框，以纠正输入。\n\
    \n选择您想使用的语言并点击“下一步”。后续所有对话框的文本都将以您所需的语言显示。\n\n"
