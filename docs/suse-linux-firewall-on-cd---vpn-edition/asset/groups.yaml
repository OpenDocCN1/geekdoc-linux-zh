    FW_SERVICES_TRUSTED_TCP=""

    ```


    Dienste (UDP), die vertrauenswürdigen Netzen/Rechnern zur Verfügung gestellt werden
    sollen, normalerweise „syslog":


    ```

    FW_SERVICES_TRUSTED_UDP=""

    ```


    Manchmal vertrauenswürdig Zugriff auf bestimmte Dienste und andere vertrauenswürdig
    Zugriff auf andere Dienste. Hier haben Sie die Möglichkeit, diese einzurichten,
    nach dem Muster: "trusted_net,protocol,port", z. B. "10.0.1.0/24,tcp,10.0.1.6,tcp":


    ```

    FW_SERVICES_TRUSTED_ACL=""

    ```


    1. Ist der Zugriff auf hohe, unprivilegierte (>1023) Ports erlaubt? Sie können
    jeden Zugriff auf die hohen erlauben („yes“), alle verbieten („no“), oder Sie
    geben, der von einem bestimmten Port (Angabe von Port-Nummer oder Service-Name,
