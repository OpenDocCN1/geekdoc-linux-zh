    # 5.2 Beschreibung der SuSE Linux Live-CD for Firewall


    „SuSE Linux Live-CD for Firewall“ ist eine Live-File-System-CD, von der alle Programme
    direkt laufen. Theoretisch ist es möglich, den Live-Rechner ohne Festplatte zu
    betreiben. Sie sollten allerdings beachten, dass Proxy wie z. B. Squid oder postfix
