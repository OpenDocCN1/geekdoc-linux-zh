    \ BIND 会继续转发该域名的请求，或者导致您自己的域名 Web 服务器无法访问。\n\n要启动名称服务器，请使用命令（root 权限）：\n`named\
    \ start`\n\n右侧出现绿色的“done”，表示 `named` 名称服务器进程已成功启动。在本地系统上，您可以使用 `nslookup` 程序立即测试名称服务器的功能。DNS\
    \ 服务器必须显示 localhost 的地址 `127.0.0.1`。如果显示是这样，很可能是 `/etc/resol.conf` 中的设置是错误的，或者该文件根本不存在。\n\
    \n"
