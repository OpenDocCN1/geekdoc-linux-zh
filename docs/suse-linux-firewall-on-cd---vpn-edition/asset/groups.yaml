    2. Haben Sie eine oder mehr der geleiteten Dienste? Diese benötigen besondere
    Sorge, damit sie funktionieren! Für diese anbieten, setzen Sie die Variablen auf
    „yes“, alle auf "no". Default-Wert sind "no":


    ```

    FW_SERVICE_DNS="no"

    ```


    Im Fall von "yes", FW_SERVICE_*_TCP muss port 53 (oder domain) haben. Die Variable
    FW_ALLOW_INCOMING_HIGPORTS_UDP muss auch auf "yes" gesetzt sein.


    ```

    FW_SERVICE_DHCLIENT="no"

    ```


    Wenn Sie dhclient erlauben, um eine IP-Adresse zu erhalten, muss FW_SERVICE_DHCPD
