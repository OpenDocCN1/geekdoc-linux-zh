    ## 4 Firewall Administration System (FAS)


    ### 4.3.1 Konfiguration des Basismoduls


    Die Grundkonfiguration der Firewall erfolgt in fünf Schritten:


    - 1. `root`-Passwort für die Firewall:


    ![](img/594883f46b5a0951172f1e794f42a4a5_39_0.png)


    Abbildung 4.3: Root-Passwort festlegen


    In diesem Dialog wird (vgl. Abbildung 4.3) das `root`-Passwort für die Firewall
    gesetzt. Wenn kein `root`-Passwort vergeben wird (Checkbox aktivieren), kann sich
    im späteren Betrieb niemand direkt auf den Firewall-Rechner als `root` anmelden.
    Es ist nur noch der Zugang via ssh und RSA-Schlüssel möglich, falls Sie ssh konfigurieren.


    ''Serielle Konsole aktivieren'' ermöglicht den Anschluss an eine serielle Konsole,
    von der man die Firewall-Festplatte steuern kann.


    - 2. Setup der (optionalen) Festplatte (vgl. Abbildung 4.4):


    ![](img/594883f46b5a0951172f1e794f42a4a5_39_1.png)


    Abbildung 4.4: Festplatten-Setup


    ### 4.3 Erstellen einer neuen Firewall-Konfiguration


    Wenn Sie ''Festplatte verwenden'' aktivieren, können Sie folgende Einstellungen
    vornehmen:


    **Festplatte-Device:** Angabe der Festplatte, die eingebunden werden soll: z.
    B.: /dev/hda (1. Festplatte am 1. IDE-Controller)


    **Festplatte-Swap-Größe:** Größe der Swap-Partition: z. B. 128 MB


    **Checkbox /var auf Festplatte nutzen?** Soll das Verzeichnis /var auf dem Festplatte-Device
    liegen?


    **IDE aktivieren:** aktiviert DMA für IDE


    Wenn Sie den E-Mail-Proxy verwenden und/oder das Caching als HTTP-Proxy aktivieren
    und/oder die Log-Meldungen auf der Festplatte speichern wollen, muss die Festplatte
    konfiguriert und aktiv sein.


    - 3. Netzwerk-Interfaces (vgl. Abbildung 4.5):


    ![](img/594883f46b5a0951172f1e794f42a4a5_40_0.png)


    Falls Sie schon Netzwerkstellen konfiguriert haben, finden Sie in diesem Dialog
    eine Liste mit bereits angelegten Interfaces. Es können maximal Interfaces angezeigt
    werden, wobei meist ein internes und ein externes Interface eingetragen werden.
    Mit ''Hinzufügen'' wird ein neues Netzwerkinterface-Dialog geöffnet (vgl. Abbildung
    4.6 auf der nächsten Seite). Folgende Angaben sind notwendig:


    **Netzwerktyp:** Ethernet ist „default“ (in dieser Version wird nur Ethernet unterstützt).


    **Gerätename:** Automatisch fortlaufend vergeben.


    **IP-Adresse:** IP-Adresse, die dem Interface zugewiesen werden soll.


    **Netzmaske:** Netzmaske zur IP-Adresse.


    **Richtung:** intern/extern; ist das Interface am Intranet, an der DMZ oder dem
    Internet angesch?


    ![](img/594883f46b5a0951172f1e794f42a4a5_41_0.png)


    Abbildung 4.6: Neues Netzwerkinterface anlegen


    Mit ''OK'' bestätigen Sie die Einstellungen, mit ''Abbrechen'' können Sie den
    Dialog abbrechen. Das neu konfigurierte Interface taucht in der Liste auf. Mit
    ''Bearbeiten'' lässt sich ein vorhandhendes Interface umfigurieren. Suchen Sie
    ein Interface aus der Liste aus und wählen Sie ''Bearbeiten''. ''Löschen'' entfernt
    das ausgewählte Interface.


    - 1. Routing (vgl. Abbildung 4.7)


    ![](img/594883f46b5a0951172f1e794f42a4a5_41_1.png)


    Abbildung 4.7: Routing-Konfiguration


    Hier können Sie Route setzen. ''Hinzufügen'' erstellt eine neue Route, mit ''Bearbeiten''
    verändern Sie eine bestehende Route.


    In der Dialogbox ''Routing konfigurieren'' (vgl. Abbildung 4.8 auf folgende) können
    folgende Einstellungen vorgenommen:


    **Ziel:** In welches Netz bzw. welchem Host soll geroutet werden? Geben Sie die
    Netzwerkmaske ein (z. B. 192.168.0.0).


    **Gateway:** Ist ein Gateway nötig, welche IP-Adresse hat es?


    **Netzmaske:** Die zugehörige Netzwerkmaske.


    **Interface:** Über welches Interface soll die Route laufen?


    ![](img/594883f46b5a0951172f1e794f42a4a5_42_0.png)


    Abbildung 4.8: Routing


    Wie zuvor speichern wir die Einstellungen mit ''OK'' und brechen die Konfiguration
    mit ''Abbrechen'' ab. Mit ''Löschen'' entfernen Sie eine bestehende.


    - 5. Host- und Domain-Konfiguration (vgl. Abbildung 4.9):


    ![](img/594883f46b5a0951172f1e794f42a4a5_42_1.png)


    Abbildung 4.9: Host- und Domain-Konfiguration


    **Firewall-Hostname:** Geben Sie den Namen Ihres Firewall-Rechners an. Vermeiden
    Sie Namen wie Gateway oder Firewall.


    **Domain:** Geben Sie den Namen der Domain an, zu der die Firewall gehört.


    **Nameserver:** Um den Resolver zu konfigurieren, geben Sie hier Ihren Nameserver
    und die Searchliste an, z. B. your-company.com.


    ### 4.3.2 Syslog-Konfiguration


    In diesem Dialog (vgl. Abbildung 4.10) können Sie das Verhalten des Syslog-Daemons
    konfigurieren. Sie haben die Möglichkeit, die Ausgabe von syslog auf die Festplatte
    und zusätzlich auf einen Log-Host zu legen. Sie können eine Liste von IP-Adressen
    der Rechner, an denen die Logs geschrieben werden. Diese Rechner müssen entsprechend
    konfiguriert werden, damit sie Logs entgegennehmen können. Der SUSE Linux Firewall
    Administrator ist für diese Aufgaben bereit.![](img/594883f46b5a0951172f1e794f42a4a5_43_0.png)


    Abbildung 4.10: Syslog-Konfiguration


    Die Konfiguration des syslog auf dem SUSE Firewall wird im Abschnitt 4.8 auf Seite
    79 erklärt.


    ### 4.3.3 DNS-Konfiguration


    In diesem Menü wird der Nameserver-bind konfiguriert. ausführliche Erklärungen
    zu DNS und bind finden sich im Anhang dieses Handbuchs.


    **DNS Forwarder IP-Adressen:** Hier geben Sie an, welche DNS-Anfragen an eine
    oder mehrere Nameserver weitergeben werden. Dazu sollten Sie die Checkbox „DNS
    Forwarder IP-Adressen“ aktivieren. Jetzt können Sie eine Liste von Nameservern
    hinzufügen, die Anfragen weitergeleitet werden sollen. Wenn Sie die Checkbox „Nur
    auf Forwarder weiterleiten“ aktivieren, werden die Anfragen ausschließlich an
    diese Nameserver weiterleitet. Wenn diese deaktiviert, werden auch die sogenannten
    „root“-Nameserver (allgemein bekannte Nameserver im Internet) verwendet (vgl.
    Abbildung 4.11 auf folgende).


    **Hören auf ausgewählte IP-Adresse(n):** Der bind-Nameserver muss standardmäßig
    auf allen Netzwerk-Interfaces laufen, die zur Verfügung stehen, also sowohl auf
    dem internen als auch dem externen Netzwerk-Interface und dem Loopback-Interface.
    Wählen Sie in der Listbox den Interfaces aus, auf denen DNS-Anfragen angenommen
    werden.


    ![](img/594883f46b5a0951172f1e794f42a4a5_44_0.png)


    Abbildung 4.11: DNS-Konfiguration


    ### 4.3.4 IP Filter Konfiguration mit ipchains


    Im FAS ipchains-Modul (vgl. Abbildung 4.12) geben Sie eine Datei an, in der Sie
    mit ipchains-save eine Paketfilter-Konfiguration gespeichert haben (siehe auch
    das ipchains-save). Diese Datei wird eingelesen und später auf der Konfigurationsdiskette
    abgelegt.


    Diese Konfiguration können Sie ganz einfach auf die Firewall übernehmen.![](img/594883f46b5a0951172f1e794f42a4a5_44_1.png)


    Abbildung 4.12: IP-Packetfilter-Konfiguration mit ipchains


    ### 4.3.5 Konfiguration des SuSE Firewall Moduls


    Mit diesem Modul konfigurieren Sie Schritt für Schritt das SUSE Firewall-Skript.


    - Im ersten Schritt geben Sie an, welches der von Ihnen im Basis-Modul konfigurierten
    Netzwerk-Interfaces für die DMZ (Demilitarisierte) bzw. Ihr internes Netz vorgesehen
    ist. Es erscheinen diejenigen, die von Ihnen in der Basis-Konfiguration als interne
    Netzwerk-Interfaces gekennzeichnet wurden. Wählen Sie per Mausklick aus der Liste
    aus (vgl. Abbildung 4.13). Diejenigen, die von Ihnen im Basis-Modul als externe
    Interfaces gekennzeichnet wurden, erscheinen automatisch im Textfeld „Internet-Device“.![](img/594883f46b5a0951172f1e794f42a4a5_45_0.png)


    Abbildung 4.13: Devices auswählen


    - 2. Routing Filter: Hier können Sie das direkte Routing von IP-Paketen erlauben,
    indem Sie die Quell- und Ziel-Adresse sowie ein Zielport erlauben (vgl. Abbildung
    4.14 auf folgende). Dies benötigen Sie für diese Prozesse. Weiterhin können Sie
    in diesem Dialog entscheiden, ob Sie Masquerading verwenden wollen. Dies kann
    notwendig sein, wenn Ihr Internet Service Provider nur eine oder eine geringe
    Anzahl offizieller IP-Adressen bekommen hat und Sie im privaten IP-Adressbereich
    nutzen. Dazu aktivieren Sie die Checkbox Masquerading für die entsprechende Verbindung.
    Im IPSec Verbindungen zur Firewall routen, wählen Sie aus der Combobox „Protokoll“
    den Eintrag „50“. (Die 50 bezieht sich auf die IPSec-Familie bekannte Portnummer).
    Hinweis: Sie müssen auf diesen Port icmp/udp für diese Verbindungen die Firewall
    „routen“.


    - 3. Umleitung: Um transparentes „Proxy“ zu ermöglichen, müssen Sie Pakete umleiten.
    Sie wollen beispielsweise den internen HTTP-Proxy konfigurieren. Die IP-Pakete
