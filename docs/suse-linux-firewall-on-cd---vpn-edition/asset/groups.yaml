- md: '

    ## SuSE Linux Live-CD for Firewall


    Die Ansprüche an das Design des SuSE Firewall Skripts:


    - Sicherheit über alles

    Wer Pakete installiert und konfiguriert, erwartet, dass das Skript alles tut,
    was möglich ist, um das System abzusichern. Ein Benutzer muss dies in Kauf nehmen,
    dass keine Dinge schwieriger zu konfigurieren sind oder eventuell (in wenigen
    Fällen) überhaupt nicht über dieses Paket konfiguriert werden. Zudem ist mit der
    Einrichtung eines solchen Pakets ein gewisser Zeitaufwand gebunden.


    - Bei Fehler keine Kompromittierung des Systems

    Ein Fehler im Skript oder ein Fehler in der Konfigurationsdatei sollte nicht zu
    offenen Filterregeln umgesetzt werden. Dieses Ziel ist in bestimmten Bereichen
    nicht erreicht. SuSE hat sich Mühe gegeben, dies zu erreichen.


    - Einfache Konfiguration

    Es werden wenige Fragen gestellt – sondern werden so viele gestellt, die unbedingt
    notwendig sind. Das ist natürlich die größte Herausforderung – und trotzdem muss
    man Wissen zu TCP/IP, Administrator-Kenntnisse, ein Gefühl für Sicherheit und
    Geduld mitbringen...


    - Automatisierte Konfiguration

    Um die Konfiguration zu vereinfachen und auch dynamische Systeme zu unterstützen,
    hat das SuSE-Team versucht, diese Daten möglichst erst zum Zeitpunkt des Startens
    des Firewall-Skriptes in Erfahrung zu bringen.


    - Unterstützung von dynamischen IP-Adressen + Netz

    Es werden nicht nur dynamische IP-Adressen, sondern mehrere Netzwerkkarten (unbegrenzt
    viele) zum Internet wie zu internen Netz unterstützt.


    Im folgenden Absatz wird mehrfach von Filterregeln für interne Interfaces und
    Netze gesprochen, die sich auf interne Interfaces oder Netze beziehen, werden
    abgearbeitet, wenn diese beim Start des Firewall-Skripts konfiguriert und vorhanden
    sind. Wenn nach dem Start des Skripts erst zugänglich, z. B. weil das Interface
    nach zuerst ausgeschaltet („down“) war, dann ist keine Kommunikation mit diesem
    Netz möglich!


    Der Ablauf des SuSE-Firewall-Skripts, das in /sbin befindet, stellt sich folgendmaßen
    dar:


    a) Zuerst wird die Konfigurationsdatei /etc/rc.config/firewall.rc eingelesen.
    Der Benutzer muss /etc/rc.firewall erst konfigurieren, bevor etwas passieren kann.
    Diese Dateien werden bei der Verwendung von FAS angelegt.


    b) Dann werden die Hilfsprogramme wie sed, awk, grep, ifconfig, netstat und natürlich
    jeweils gesucht. Wenn eines dieser nicht aufffindbar ist, wird mit einer Fehlermeldung
    abgebrochen. Als Nächstes wird noch die Kernel-Version kontrolliert, um festzustellen,
    ob ipchains unterstützt. Das Skript wird dann abgebrochen, wenn ein 2.0-Kernel
    identifiziert oder ohne Warnung ausläuft, falls die Version des Kernels nicht
    identifiziert werden kann.


    c) folgt die Interpretation der Konfigurationsdatei und die Ermittlung von momentanen
    Daten, die wichtig sind. So werden für alle im Skript konfigurierten Netzwerke
    die IP-Adresse und Netzmaske aus gelesen. Ein Interface ist nicht "up" (z. B.
    ISDN oder PPP-Interface), werden trotzdem Filterregeln im Skriptablauf hierfür
    generiert, werden nur lediglich rudimentäre Schutzmaßnahmen. Nach dem Aufbau einer
    Verbindung mit z. B. ISDN sollte das SuSE-Firewall-Skript noch gestartet werden.


    d) Denn geht es weiter? Zuerst wird die Firewall zurückgesetzt und der Default
    für eingehende Pakete und für solche, die die Firewall routen, auf "verwerfen".
    Sollte aus irgendeinem Grund für ein Paket im Skript keine Regel existieren, wird
    er verworfen. Pakete, die die Firewall verlassen müssen, werden hier auf den Vorgabe-Wert
    "erlaubt" gesetzt.


    e) Das /proc-Skript erlaubt, auf einfache Weise den Kernel zur Laufzeit des Systems
    zu konfigurieren. Das macht sich das Skript, um einige Sicherheitsoptionen einzuschalten.
    Für viele hilft erst die Option FW_SECURITY in der Konfigurationsdatei auf "yes"
    gesetzt, da die Auswirkungen komplex sein können.


    f) Das auf "routen" eingestellt ist, wird das Routing aktiviert.


    g) Dann wird – ganz wichtig – jeder Verkehr über das Interface "localhost" freigegeben.


    h) Jetzt kommen die Regeln für "IP Spoofing" und für "Umgehungsverhinderung" auf
    die Reihe. Diese Regeln sorgen dafür, dass externe und interne Attacken abgefangen
    und abgewiesen werden, die vorgaukeln, einem jeweils anderen Segment anzugehören.
    Gleichzeitig werden auch direkte Zugiffsversuche auf das interne Netz nicht verhindert.


    i) Die Redirecting-Regeln, die man benutzen können, Zugriffe auf das interne Netz
    oder lokale Ports auf einen speziellen Port der Firewall umalten.


    j) Wer an ein internes (vertrauenswürdiges) Netzwerk angeschlossen ist, kann in
    der Konfigurationsdatei festlegen, ob die Firewall Angriffe von innen schützen
    werden soll oder. Ist dies nicht der Fall, wird an dieser Stelle jeder Verkehr
    von internem Netz auf die Firewall freigegeben. Die Option hier hilft FW_PROTECT_FROM_INTERNAL.


    Dann werden Regeln für ICMP, TCP und UDP generiert.


    k) ICMP-Regeln werden in zwei Stufen erstellt. Zuerst werden spezielle ICMP-Pakete
    je nach Konfiguration erlaubt oder verboten, z. B. "ping" auf die Firewall, "Source
    Quench-Meldungen des nächsten verbundenen Routers wie Antwortpakete für allgemeine
    Programme wie traceroute. Die zweite Stufe bildet allgemeine Konfigurationen,
    die gefährliche ICMP-Pakete verbieten und wichtige erlauben. Das interne Netz
    darf die immer mit "ping" erreichen.


    l) Den TCP-Regeln zuerst die konfigurierten Dienste freigeben, anschließend die
    für vertrauenswürdige Netze und letztlich für das interne Netz. Am Anschluss wird
    Port 113 konfiguriert, dass ein Timeout eingebaut wird, um unnötige Warzeiten
    (z. B. Senden von E-Mails) zu verhindern. Nun kommt ein entscheidender Automatismus
    zum Zug: Wer FW_AUTOPROTECT_GLOBAL_SERVICES auf "yes" gesetzt hat, werden Dienste
    durch Filter schützen, die nicht an ein spezielles Interface hören (also auf 0.0.0.0
    oder INADR_ANY). Dadurch kann man gegebenenfalls alle Ports für eingehende Verbindungen
    freigeben, wenn aber trotzdem Datenbanken schützen, die beispielsweise auf Port
    4545 laufen. Am Abschluss werden die Regeln generiert, oder auf privileilegierte
    Ports (zwischen 1024 und 65535) zugriffen werden; gar nicht; nur in /etc/resolv.conf
    definierte Nameserver; nur Verbindungen, die von einem bestimmten Ursprungport
    kommen (nicht empfohlen, wenn Schutz zu vermeiden ist); Interne Systeme dürfen
    auf die unprivilegierten Ports zugreifen – das AUTOPROTECT schützt ihre Dienste.


    m) Das Gleiche für UDP ist nur hier ein Verbindungsreset vorgenommen, für Port
    113 nicht notwendig.


    n) Anschließend kommen die Routing-Regeln an die Reihe, die definieren, welche
    Systeme von außen auf ein internes Netz zugreifen werden dürfen. Das sollte aus
    vorliegenden Gründen nicht benutzt werden!


    o) Jetzt erst ist die Konfiguration der Regeln für Masquerading.


    p) Sehr wichtig ist die Konfiguration von zusätzlichen Logmechanismen für sensible
    Pakete, z. B. verbotene TCP-Pakete, die eine Verbindung aufbauen wollen. Wenn
    LOG_*ALL gesetzt wird, wird jedes Paket geloggt, was viele Einträge erstellt,
