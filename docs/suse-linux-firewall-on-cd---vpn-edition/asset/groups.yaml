  - '[PAGE 125]


    # DNS – Domain Name Service


    listen-on port 53 { 127.0.0.1; 192.168.0.1 }; sagt dem BIND, auf welchen Netzwerkinterfaces
    und welchem Port er auf Anfragen der Clients horcht. Die Angabe port 53 kann sich
    dabei sparen, da 53 ohnehin der Standardport ist. Lässt diesen Eintrag komplett
    weg, werden standardmäßig auf Interfaces verwendet


    query-source address * port 53; Dieser Eintrag ist nicht notwendig, wenn man eine
    Firewall die externen DNS-Abfragen blockiert. So wird Bind dazu gefragt, nach
    Anfragen von Port 53 aus und nicht von hohen Port 1024 zu.


    allow-query { 127.0.0.1; 192.168.1/24 }; bestimmt die Netze, den Clients DNS-Abfragen
    erlauben dürfen. Das /24 ist dabei eine Kurzreibweise für die Maske, die in Fall
    255.255.255.0.


    allow-transfer { !* }; regelt welche Rechner DNS-Transfers anfordern dürfen, dieses
    Binding unterbindet sie, aufgrund des ! komplett. Ohne diesen Eintrag können DNS-Transfers
    mit Einschränkungen von überall angefordert werden.


    statistics-interval 0; Ohne Eintrag produziert Bind8 mehrere Statusmeldungen in
    /var/log/messages. Die Angabe von 0 wirkt, dass dies komplett unterdrückt wird,
    ansonsten kann man hier die Zeit in Minuten angeben.


    cleaning-interval 720; Diese Option legt fest in welchem Zeitabstand Bind8 seinen
    Cache aufräumt. Die Aktivität führt jedes Mal einen Eintrag in /var/log/messages.
    Die Zeitangabe erfolgt in Minuten. Voreingestellt sind 60 Minuten.


    interface-interval 0; Bind8 durchsuch regelmäßig die Netzwerkschnittstellen nach
    neuen oder nicht mehr vorhandenen Interfaces. Ist dieser Wert auf 0, wird darauf
    verzichtet und Bind8 laus nur auf den beim Start gefundenen Interfaces. Alternativ
    kann man das Intervall in Minuten ange. Voreingestellt sind 60 Minuten.


    notify no; Das bewirkt, dass keine anderen Nameserver benachrichtigt werden, wenn
    auf den Zonendaten Änderungen vorgenommen oder der Nameserver neu gestartet wird.


    # A.2.2 Der Konfigurationsabschnitt „Logging“


    Was und wie wohin protokolliert wird, kann man Bind8 recht vielseitig konfigurieren.
    Normalerweise sollte man mit den Voreinstellungen zufrieden sein. Beispiel A.2.2
    auf der nächsten Seite zeigt die einfachste Form eines Eintrags und unterdrückt
    das „Logging“ komplett


    # A.2.3 Aufbau der Zonen-Einträge


    Nach zone wird der Name der zu verwendenden Domain angegeben, hier wird-lich meine-domain.de
    gefolgt von einem in und einem in geschweiften'
  - "[PAGE 126]\n\n# A.2 Die Konfigurationsdatei\n/etc/named.conf\n\n```\nlogging\
    \ {\n  category default { null; };\n};\n```\n\nDatei A.2.2: Logging wird unterdrückt\n\
    \n```\nzone \"meine-domain.de\" in {\n  type master;\n  file \"meine-domain.zone\"\
    ;\n  notify no;\n};\n```\n\nDatei A.2.3: Zone-Eintrag für meine-domain.de\n\n\
    Klammern setzen zugehörige Optionen; wie Beispiel A.2.3. Will eine „Slave-Zone“\
    \ definieren, ändert sich der type auf slave und muss ein Nameserver angegeben\
    \ werden, dieser Zone als master verwaltet (kann auch ein „slave“ sein); wie Beispiel\
    \ A.2.4.\n\n```\nzone \"andere-domain.de\" in {\n  type slave;\n  file \"slave/andere-domain.zone\"\
    ;\n  masters { 10.0.0.1 };\n};\n```\n\nDatei A.2.4: Zone-Eintrag für andere-domain.de\n\
    \nOptionen:\n\n**type master:** Das master legt fest, dass diese Zone auf diesem\
    \ Nameserver verwaltet wird. Das setzt eine erstellte Zonendatei voraus.\n\n**type\
    \ slave:** Diese Zone wird von einem anderen Nameserver transferiert. Muss einem\
    \ **master** verwendet werden.\n\n**type hint:** Die .zone hint wird für die Angabe\
    \ der Root-Nameserver verwendet. Diese Zonndefinition kann unverändert bleiben.\n\
    \n**file „meine-domain.zone“ oder „slave/andere-domain.zone“:** Dieser Eintrag\
    \ ist die Datei, die in der Zonendatei für die Domain eingetragen sind. Ein slave\
    \ braucht die Datei nicht zu existieren, da ihr Inhalt von einem anderen Nameserver\
    \ geholt wird. Um Master- und Slave-Dateien auseinander zu halten, gibt man für\
    \ die Slave-Dateien des Verzeichnisses an.\n\n**masters { 10.0.0.1 };:** Dieser\
    \ Eintrag braucht nur für Slave-Zonen und gibt an, von welchem Nameserver die\
    \ Zonendatei transferiert werden soll."
