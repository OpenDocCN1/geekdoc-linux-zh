    \n图 4.9：主机和域名配置\n\n**防火墙主机名 (Firewall hostname):** 指定您的防火墙计算机名称。避免使用 Gateway 或\
    \ Firewall 等名称。\n\n**域名 (Domain):** 指定防火墙所属的域名。\n\n**名称服务器 (Nameserver):** 为了配置解析器，在此处指定您的\
    \ DNS 服务器和搜索列表，例如 your-company.com。\n\n### 4.3.2 Syslog 配置\n\n在此对话框中（参见图 4.10）您可以配置\
    \ syslog 守护的行为。您可以将 syslog 输出到硬盘，还可以输出到日志主机。您可以提供写入日志的计算机 IP 地址列表。这些计算机必须经过相应的配置才能接收日志。SUSE\
    \ Linux 防火墙管理员负责这些任务。\n\n![](img/594883f46b5a0951172f1e794f42a4a5_43_0.png)\n\n\
    图 4.10：Syslog 配置\n\nSUSE 防火墙上的 syslog 配置将在第 79 页的第 4.8 节解释。\n\n### 4.3.3 DNS 配置\n\
    \n在此菜单中配置名称服务器 bind。关于 DNS 和 bind 的详细说明见本手册的附录。\n\n**DNS 转发器 IP 地址:** 在此处指定将哪些\
    \ DNS 请求转发给一个或多个服务器。为此，您应该勾选“DNS 器 IP 地址”。现在您可以添加需要转发的 DNS 服务器列表。如果您勾选“仅转发到转发器”，请求将仅转发到这些服务器。如果禁用，将使用所谓的“root”服务器（互联网上通用的服务器）（参见下面的图\
    \ 4.11）。\n\n**监听选定的 IP 地址 (Listen on selected IP addresses):** bind 服务器默认必须运行在所有可用网络接口上，即内部、外部网络接口以及环回接口。在列表中选择接收\
    \ DNS 请求的接口。\n\n![](img/594883f46b5a0951172f1e794f42a4a5_44_0.png)\n\n图 4.11：DNS\
    \ 配置\n\n### 4.3.4 使用 ipchains 进行 IP 过滤\n\n在 FAS ipchains 模块中（参见图 4.12），您指定一个使用\
