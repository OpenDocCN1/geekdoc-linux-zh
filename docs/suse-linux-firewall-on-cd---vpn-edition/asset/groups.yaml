    \  Bearbeitung: wochentags\n\n- **per Fax:**\n  Faxnummer: (09 11) 74 05 34 77\n\
    \  Bearbeitung: wochentags\n\n- **per Brief:**\n  Anschrift: SuSE GmbH – Support\
    \ – Schanzzäckerstr. 10, D-90443 Nürnberg\n  Bearbeitung: wochentags\n\n# 7.6.2\
    \ Kostenpflichtiger Support\n\nSelbst wenn ein Betriebssystem für Anlagen dazu\
    \ mitbringt: Erst durch professionelle und kompetente Betreuung wird es zu ernsthaften\
    \ Alternativen für den Einsatz im betrieblichen Alltag. SuSE garantiert diesen\
    \ Service für Linux. Alle Informationen hierzu finden Sie ebenfalls beim zentralen\
    \ Support-Portal für SuSE Linux:\n\n```\nhttp://support.suse.de\n```\n\n# Individuelle\
    \ Projekte und Beratung\n\nSie möchten SuSE Linux in Ihrem Unternehmen einsetzen.\
    \ Wir bieten Ihnen kompetente Beratung und Lösungen, um Linux in Ihrem IT-Umfeld\
    \ optimal zu nutzen.\nWir haben von kompetenter Linux-Anbieter viel Erfahrung\
    \ im Einsatz von Linux-Servern gewonnen. Nutzen Sie das Knowhow von Experten,\
    \ um Ihre Projekte erfolgreich durchzuführen. Unsere Stärke ist Vielseitigkeit,\
    \ ob um Datenbanken, Security-Konzepte, Internet-Anbindung oder firmenweite: Linux\
    \ ist mit der richtigen Software eine starke Plattform für Ihre Anwendungen.\n\
    Unser Angebot reicht von der Konzeption, Implementation und Konfiguration von\
