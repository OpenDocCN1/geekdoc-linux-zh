    ```bash

    root@#: ssh -L 25:sonne:25 sonne

    ```


    Hier wird jede Verbindung zu „erde Port 25“, SMTP auf den SMTP-Port von sonne
    über den verschlüsssten Kanal weitergeleitet. Dies ist insbesondere für Nutzer
    von SMTP-Server ohne SMTP-AUTH oder POP-before-Fähigkeit von Nutzen. Mal kann
    so von jedem beliebigen Ort mit Netzanschluss die Auslieferung durch den „heimischen“
    Mailserver übertragen. Analog leitet


    ``````

    root@#: ssh -L 110:sonne:110 sonne

    ```


    Alle Port 110, Anfragen an ‚root‘ auf den POP3-Port von sonne weiter. Beide Beispiele
    müssen sie als Nutzer „root“ ausführen, da auf privilegierte lokale Ports verbunden
    werden. Bei bestehender SSH-Verbindung wird der Port wie folgt als normaler Nutzer
    verwendet und abgeholt. Der SMTP- und POP3-Host muss dabei auf localhost konfiguriert
    werden. Zusätzliche Informationen können den Manualpages der einzelnen Programme
    und den Dateien unter /usr/share/doc/packages/opensshnommen werden.


    ## C.2 Sicherheit als Vertrauensache


    ### C.2.1 Grundlagen


    Einer der grundlegenden Leistungsmerkmale eines Linux/Unix-Systems ist, dass mehrere
    Benutzer (multiuser) mehrere Aufgaben gleichen Zeit auf dem Rechner (multi-tasking)
    ausführen können. Das Betriebssystem ist darüber hinaus netzwerkgetrennt, sodass
    Benutzer oft gar nicht wissen, ob sich die Daten oder Anwendungen, mit denen sie
    arbeiten, lokal auf dem Rechner oder über das Netzwerk bezogen werden.


    Damit mehrere Benutzer auf einem System arbeiten können, müssen ihre jeweiligen
    Daten auch untereinander getrennt verwaltet werden können. Hier geht es unter
    anderem auch um Sicherheit und den Schutz der Privatsphäre. Datensicherheit war
    auch schon relevant, als Computer noch nicht miteinander vernetzt waren. Bei Verlust
    oder Defekt der Datenträger (im Allgemeinen Festplatten) müssten wichtige Daten
    weiterhin verfügbar sein, welche solche Defekte wöchentlich dem vorübergehenden
    Ausfall einer größeren Infrastruktur für solche hat.


    Auch wenn dieses Kapitel des SuSE-Handbuchs in der Hauptseite von der Benutzerbestimmung
    die Vertraulichkeit der Daten und den Schutz der Privatsphäre beschäftigt, wird
    betont, dass ein umfassendes Sicherheitskonzept als integraler Bestandteil immer
    ein regelmäßiges, funktionierendes und überprüft Backup behält. Ohne Backup der
    Daten wird es im Fall aller Hardware-defekts sehr schwierig, weiterhin auf die
    Daten zuzugreifen, sondern besonders andere Fälle auch dann, wenn der Verdacht
    besteht, dass jemand sich unbefugterweise an den Daten zu schaffen gemacht hat.


    ### C.2.2 Lokale Sicherheit und Netzwerksicherheit


    Es gibt verschiedene Möglichkeiten, auf Daten zuzugreifen:


    - Persönliche Kommunikation mit jemand, der über die gewünschten Informationen
    verfügt; Zugang zur Basis oder einem Computer hat,

    - direkt an die Konsole eines Rechners (physikalischer Zugriff),

    - über eine spezielle Schnittstelle oder

    - über ein Netzwerk.


    Alle Fälle sollten eine Gemeinskeit haben: Sie sollten als Benutzer authentifizieren,
    bevor Sie Zugriff auf die Ressourcen oder Daten bekommen. Ein Webserver mag das
    anders sehen, aber Sie wollen sich Ihre persönlichen Daten auf Surfer schützen.
    Eine SuSE-Linux Installation lässt sich mit wenigen Handgriffen dabei bringen,
    das System direkt und ohne Passwort mit Ihrer Arbeitsoberfläche zu konfrontieren,
    dieses Vorgehen ist meistens unangenehm. Damit könnte jemand in Ihrem Namen Daten
    manipulieren und Programme ausführen.


    Der erste Fall ist der menschlichste von allen: Etwa bei einer Bank ist sich ein
    Angestellten, der Ihnen Zugriff auf Ihr Konto gestattet, dass Sie mit Ihrer Unterschrift
    eine PIN oder mit einem Passwort beweisen. In manchen Fällen kann es gelingen,
    das Erwähnen von Kenntnissen oder durch geschickte Rhetorik des Vertrau einen
    Wissenssträger zu verschleichen, so dass dieser weitere Informationen preisgeben,
    ohne dass das Opfer dies merkt.


    Menschen sind unvorsichtig mit ihren Äußerungen und unbewusst mit ihren Antworten,
    dass sie für nicht beantwortet halten, genug Information enthalten, wie früher
    im Mosaic immer mehr Details bekannt werden. („Nein, der Herr Mei ist im Urlaub
    und kommt erst in zwei Wochen. Und im übrigen ist er nicht mein Chef, zumal er
    im vierten Stock sitzt und ich im dritten!") Man nennt dies in Hackerkreisen „Social
    Engineering“. Gegen diese Art von Angriff hilft nur Aufklärung und ein bewusster
    Umgang mit Information und Sprache. Einbruch in Netzwerksystem erfolgt oft durch
    eine Art Social-Engineering-Angriff, der auf Mitarbeiter, Dienstleister in der
    Firma oder Familienleiter, der erst viel später beginnt.


    Jemand, der (unbefugt) Zugriff auf Daten erhält, könnte auch die traditionelle
    Methode benutzen, denn die Hardware selbst ein Angriffspunkt ist. Der Rechner
    müssen gegen Entnahme, Austausch und Sabotage von Teilen und Sicherheit (und dem
    Backup der Daten!) sicher verstaut - dazu kann auch eine eventuell vorhandene
    Netzwerkverkabelung oder ein Stromkabel gehören. Außerdem muss der Startvorgang
    abgesichert sein, denn allgemein bekannte


    # Sicherheit im Netzwerk


    Tastenkombinationen können den Rechner zu speziellen Reaktionen veranlassen. Dgegen
    hilft das Setzen von BIOS-Passwörtern. Serielle Schnittstellen sind heute zwar
    immer gebräuchlich, werden aber kaum noch verwendet. Ein Terminal stellt eine
    besondere Art des Zugiffs dar: Es ist keine Netzwerksstelle, die für Übertragungsmedium
    verwendet wird. Ein Kabel ist der einfachste Angriffspunkt: Man muss nur ein Kabel
    anschließen.


    Netzwerke vereinen den Zugriff auf Daten mit Kommunikationsprotokollen. Das mag
    paradox klingen, muss aber sein. Wenn wir vom Ort sind und einen Rechner fernsteuern,
    brauchen wir abstrakte, modulare Modelle: Modularität ist, wenn Ihr Textverarbeitungsprogramm
    nicht wissen muss, welche Festplatte sie haben oder Ihr E-Mail-Programm nicht,
    ob ein Modem oder eine Ethernet-Karte haben. Teile Ihres Betriebystems (in unser
    Fall) stellen die Funktionalität einer definierten Schnittstelle bereit und kümmern
    sich um die Details. So kann sich ein Textverarbeitungsprogramm oder ein User-Agent
    (MUA) auch auf Rechner mit durchaus unterschiedlicher Hardware funktionieren,
    und andererseits können sie von einem beliebigen Ort betrieben, der die technische
    Ausstattung voraussetzt.

