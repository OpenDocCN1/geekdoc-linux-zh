    # 5 SuSE Linux Live-CD for Firewall


    # 5.1 Einführung


    „Live-CD“ zur SuSE Linux Firewall on CD ist der „ausführende“ Teil der Firewall.
    Die Live-CD ist ein minimales, nach Sicherheitskriterien ausgerichtetes SuSE Linux.
    Dies betrifft die Programme, die zur Verfügung stehen, ebenso ein „Application
    on Level Gateway“, das heißt, welches als Sicherheitsgateis Routing von IP-Paketen
    vorgenommen wurde. Die Weiterleitung von Anfragen an Dienste wird durch Anwendungen
    (= Proxies) gehandhabt.


    Mit Proxies und Non-Forwarding von IP-Paketen kann man noch nicht verhindern,
    dass (unwünschte) IP-Pakete vom Internet ins Intranet und umgelehrt werden. Diese
    Firewall-Funktionalität wird durch den Paketfilter des Kernels übernommen, welcher
    ipchains(8) konfiguriert wird. Verwendung findet das Konzept der CD. Das bedeutet,
    dass das Betriebssystem und alle Programme auf einem Read-Only-FileSystem auf
    einer CD befinden. Beim Booten wird ein RAM-Disk erstellt, mit dem die Live-CD
    gemountet wird. Eine Wiederholung des „status quo ante“ ist durch einfaches Reboot
    des Rechners möglich. Wenn das Update der „SuSE Linux Firewall auf CD“ tauschen
    Sie die Live-CD gegen die aktuelle Update-CD aus und starten Ihren Firewall-Rechner
    neu.


    Die Konfiguration des Systems und der Dienste erfolgt durch eine Diskette, auf
    der alle notwendigen Konfigurationsdateien gespeichert sind. Dies wird beim Boot-Vorgang
    „read only“ gemountet, vorsichtshalber lässt sich jedoch auch schreibgeschützt.
    Die Daten der Konfigurationsdiskette werden in die RAM-Disk kopiert, damit der
    Datenträger wieder aus dem Dateystem entfernt.


    Hardwareanforderungen:


    +   * Die SuSE Linux Live-CD for Firewall ist auf jedem x86, ab x=5, laufig. Empfohlen
    wird mindestens ein Pentium II.

    * Es sind mindestens 128 MB RAM notwendig.

    * ein Diskettenlaufwerk 3,5 Zoll,

    * ein bootfähiges CD-ROM-Laufwerk und

    * mindestens zwei Netzwerkschnittstellen.


    Dieses Kapitel liefert keine Anleitung zur Konfiguration der Dienste, sondern
    eine technische Dokumentation für den Administrator,'
