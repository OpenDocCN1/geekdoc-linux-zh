    \ und kann u. a. für Folgendes verwendet werden:\n\n- Beschränkung des Internetzugiffs\
    \ für einige Benutzer auf bestimmte akzeptierte/bekannte Web-Server und/oder URLs.\n\
    - Zugiffsverweiger für einige Benutzer auf bestimmte Web-Server und/oder URLs.\n\
    - Zugiffsverweiger für einige Benutzer auf URLs, die bestimmte reguläre Ausdrücke\
    \ oder Wörter enthalten.\n- Umleiten gesperrter an eine „intelligente“ CGI-basierte\
    \ Infoseite.\n- Umleiten nicht registrierter Benutzer an ein Registrationsformular.\n\
    - Umleiten von Bannern an ein leeres GIF.\n- Unterschiedliche Zugiffsregeln abhängig\
    \ von der Zeit, dem Wochentag, dem Datum.\n- Unterschiedliche Regeln für einzelne\
    \ Benutzergruppen.\n\nWeder mit SquidGuard noch mit Squid ist folgendes möglich:\n\
    \n- Textinhalt von Dokumenten filtern, senieren oder editieren\n- In HTML eingebettete\
    \ Skriptsprachen wie JavaScript oder VScript filtern, senieren und editieren\n\
    \n## Verwendung von SquidGuard\n\nInstallieren Sie das Paket squidgrd aus der\
    \ Serie n. Editieren Sie die Konfigurationsdatei /etc/squidguard.conf. Es gibt\
    \ zahlreiche andere Konfigurationsbeispiele unter http://www.squidguard.org/config/.\
    \ Sie können später mit komplizteren Konfigurationsseinstellungen experimentieren.\n\
    \n## B.7 Squid und andere Programme\n\nDer nächste Schritt besteht darin, eine\
    \ Dummy-Seite „Zugriff verweigert“ oder eine oder weniger intelligente CGI-Seite\
    \ zu erzeugen, um Squid umzuleiten, in falls der Client eine verbotene Webseite\
    \ anfordert. Der Einsatz von Apache würde auch hier wieder ausfallen.\n\nNun müssen\
    \ Squid sagen, dass SquidGuard benutzt muss. Dafür verwenden wir die folgenden\
    \ Einträge in der Datei /etc/squid.conf:\n\n```\nredirect_program /usr/bin/squidguard\n\
