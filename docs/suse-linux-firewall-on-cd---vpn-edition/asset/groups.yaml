    ## 5.3.7 chroot, secumod, compartment, Kernel-capabilities


    为了提高防火墙的安全性，SuSE Live-CD 服务运行在 `chroot` 环境中。此外，还使用了 `secumod` 内核模块和 `compartment`。通过设置内核中的
    Capability 权限，可以提高系统的安全性。`chroot` 将程序的文件系统视图限制在一个新的“root”上。一旦设置了该视图，程序就不再拥有整个文件系统的视图。即使程序崩溃，也不会损坏系统。`secumod`
    是一个提高系统安全性的特殊内核模块。它包括：

    - 受信任路径（Trusted Path）

    - 禁止显示指向非所有文件的硬链接

    - proc 文件的保护

    - 如果符号链接不属于当前运行的进程（例外：属于 root 权限的进程），则不跟踪

    - fifo 的保护

    - syscall 跟踪

    - 日志（logging）

    - 设置 Capabilities


    `compartment` 允许在具有特权用户/组的 chroot 中运行程序/服务。它支持在实际程序之前调用脚本（例如环境设置）。通过限制执行程序来提高内核的安全性。Capabilities
    位于

    ```

    /usr/include/capability

    ```

    指定程序 Capabilities 的相对简单方法是使用 `compartment`。


    ## 5.4 配置磁盘


    配置盘包含完整的系统配置和应用程序网关配置。配置盘必须配备一个 ext2 文件系统并获得以下标签 "SuSE-FW"：


    ```

    /bin/e2/dev/fd0 SuSE-FW

    ```

    如果没有这个标签，配置盘将无法被识别。FAS（防火墙管理）在 SuSE Linux 管理主机启动时创建文件系统。配置盘会在 Live-CD 启动时挂载。


    ### 5.4.1 创建配置磁盘


    可以通过 SuSE Linux 管理主机生成配置磁盘。FAS 在 SuSE Linux 管理主机创建一个 tar 存档并进行解压。这是推荐的方法。只有真正了解操作的专家才建议编辑器编辑配置文件，此处不支持。


    ### 5.4.2 配置文件


    以下列表提供了磁盘上的配置文件概述供您参考；它们通过管理界面创建：


    ```

    /etc/hosts (参考 man hosts)

    /etc/hosts.allow (参考 man hosts_access)

    /etc/hosts.deny (参考 man hosts_access)

    /etc/inittab (man inittab)

    /etc/isdn/

    /etc/cpe/

    /etc/live-setup.conf

    /etc/passwd

    /etc/ppp/

    /etc/localtime

    /etc/modules.boot

    ```


    在 `/etc/modules.boot` 文件中，您可以指定系统启动时加载的内核模块。它们使用相对路径名 `/lib/modules/<Kernelversion>`
    指定。如有必要，您还可以为模块构建选项，例如硬件使用的 IRQ 或 IO 地址。以 "#" 开头的行将被忽略。在模块名称前加上 "-"，将尝试卸载该模块（当自动硬件识别尝试加载错误的网络模块时这可能是必要的）。示例：


    ```

    # 在此文件中，您可以提供系统启动时必须加载的模块列表和选项

    # 模块名可以使用相对形式，例如 net/ppp.o。

    #

    # 模块名 [选项]

    #

    # 例如：

    #misc/cipcb.o

    #net/slhc.o

    #net/ppp.o

    #net/ppp_deflate.o

    #net/ppp_mpe.o

    -net/de4x5.o # 此模块被移除

    - # 此模块将被加载

    net/tulip.o

    ```


    `/etc/ipsec/` 包含证书和配置文件:///etc/named/` 包含 DNS 服务器的 Zone 文件。`/etc/named/master/`
    包含主 Zone 文件。`/etc/named/slave/` 包含从 Zone 文件。`/etc/named.hint` 包含根 DNS 服务器地址。`/etc/named.conf`
    在此处进行 named 的配置。`/etc/ntp.conf` 时间服务器守护进程 xntpd 的配置`/etc/pam.d` 目录包含 PAM（可插拔身份模块）的配置文件`/etc/permissions.local`
    设置对程序、服务等的访问权限。`/etc/postfix` 是 postfix 的配置目录；主配置文件有：


    - /etc/postfix/master.cf,

    - /etc/postfix/main.cf,

    - /etc/postfix/virtual,

    - /etc/postfix/transport,

    - /etc/postfix/access.


    `/etc/proxy-suite/` FTP 代理的配置目录，

    `/etc/rc.config` SuSE Linux 主配置文件;


