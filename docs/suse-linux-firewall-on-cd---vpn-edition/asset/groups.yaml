    \ Ziegler：《Linux Firewalls》，New Riders 1999年。\n\n# A DNS – 域名服务\n\nDNS（英文 Domain\
    \ Name Service）用于将域名和主机名解析为 IP 地址。\n\n# A.1 启动 BIND 服务器\n\nBIND8 服务器（适用于新版本 BIND9）在\
    \ SuSE Linux 上已经过预配置，您可以在安装后顺利启动它。\n\n如果您有正常的互联网连接并在 `/etc/resol.conf` 中将 `127.0.0.1`（本地主机）设置为服务器，通常在不知道\
    \ DNS 服务商的情况下也能获得运行的域名解析。BIND 通过根服务器进行解析，但速度要慢得多。通常，您应该在配置文件 `/etc/named.conf`\
    \ 的 `forwarders` 选项填写 DNS 服务商，以获得高效且安全的解析。如果运行正常，服务器将作为权威服务器运行。如果您提供自己的域名，则需要正确的\
