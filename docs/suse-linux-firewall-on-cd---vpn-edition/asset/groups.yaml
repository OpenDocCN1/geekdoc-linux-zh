  - '[PAGE 24]


    # 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall


    ![](img/594883f46b5a0951172f1e794f42a4a5_24_0.png)


    Abbildung 3.4: YaST2: Eingabe des ''root''-Passwortes


    Wenn Sie ''Weiter'' klicken, erfolgt eine Sicherheitsabfrage (in grün), ob Sie
    die Installation jetzt mit den angezeigten Einstellungen starten möchten:


    +   - Nach Bestätigung mit ''Ja installieren'' beginnt YaST2 mit der Einrichtung
    des Systems.

    - ''Nein'' haben Sie die Möglichkeit, die Daten erneut zu kontrollieren und gegebenenfalls
    zu ändern, indem Sie ''Zurück'' zum entsprechenden Maske kehren.


    Sie haben jedoch noch die Möglichkeit, die Installation abzubrechen. Alle bisher
    gemachten Einstellungen und Angaben gehen verloren. Wenn Sie ''Installation abbrechen''
    wählen, wird Ihr Rechner nach erfolgreicher Rückkehr herunterfahren und Sie können
    ihn ausschalten oder neu benutzen. An Ihrem Rechner werden bis diesem Zeitpunkt
    keinerlei Veränderungen vorgenommen.


    Über die Funktion ''Einstellungen auf Diskette speichern'' können Sie alle Angaben
    auf Diskette speichern, um sie bei weiteren Installationen wieder abrufen zu können.
    Dieser Punkt kann nur dann gewählt werden, wenn Ihre dies erlaubt.


    In der Regel werden Sie sich für ''Ja - installieren'' entscheiden. Es werden
    die Partitionen angelegt und formatiert. Bei Systemausstattung und Größe der Festplatte
    wird dies angezeigt. Vermeiden Sie einen Abbruch, da dies die System in einen
    undefinierten Zustand versetzt wird.


    Anschließend werden die Pakete von der CD eingelesen, das SuSE Linux-Basissystem
    installiert und der Bootmanager eingerichtet. Nach der Bestätigung mit ''OK''
    wird dieses textorientierte Basissystem installiert. YaST2 setzt die Installation
    der Software fort; wenn Sie während dieser die Installation abbrechen, wird das
    System in einem unbenutzbaren Zustand sein!'
  - "[PAGE 25]\n\nEs fehlt noch die Vorbereitung der grafischen Oberfläche; anschließend\
    \ können\nSie SuSE Linux das erste Mal ausprobieren.\n\n# 3.3.8 Grafische Oberfläche\
    \ vorbereiten\n\nUm schon beim Einloggen eine grafische Benutzeroberfläche für\
    \ Verfü-\\gung zu stellen, wird YaST2 nun versuchen, alle benötigten Informationen\
    \ über den den angeschlossenen Monitor und die Grafikkarte selbstständig herauszufinden.\n\
    Wenn dies gelingt, wird eine geeignete Bildschirmauflösung, Farbeinstellung und\
    \ Wiederholholfrequenz für den Monitor gewählt und das Testbildschirm angezeigt.\n\
    \n> Hinweis\nBitte kontrollieren Sie die Einstellungen, bevor Sie 'OK' geben!\
    \ Sehen\nSie gegebenenfalls in den Unterlagen für Grafikkarte und Ihren Monitor\
    \ nach.\n\nDer Monitor nicht erkennt, dann wählen Sie Ihr Modell aus der an-zeigten\
    \ Liste aus; benutzen Sie ein unbekanntes Modell, müssen Sie die Ein-stellung\
    \ von Ihrem Monitor eingeben oder den Daten der 'Treiber-Diskette' einlesen, die\
    \ Ihnen mit Ihrem Monitor geliefert wurden; in jedem Fall sollen Sie die Dokumentation\
    \ zu Ihrem Monitor zuerst ziehen.\nStellen Sie die gewünschte Bildschirmauflösung\
    \ und eine 16 bpp ein. Überprüfen Sie die Einstellungen, indem Sie 'Test' wählen,\
    \ und nehmen-sen Sie bei Bedarf Feineinstellungen vor.\n\n> Tipp\nIn seltenen\
    \ Fällen kann es notwendig sein, dass Sie den X-Server ,von\n Hand' konfigurieren\
    \ müssen; dazu sollten Sie später das Programm SaX aufrufen.\n\nDer standardmäßig\
    \ verwendete Window-Manager auf dem SuSE Linux Admin-host für Firewall ist KDE2.\n\
    \n# 3.3.9 Netzwerk-Konfiguration mit YaST2\n\nFür die Einrichtung des Netzwerks\
    \ halten Sie bitte folgende Daten bereit: IP-Adresse, Netzwerkmaske, Default-Gateway.\n\
    Falls Sie einen DHCP-Server betreiben, können Sie den Adminhost auch als DHCP-ClientClient\
    \ konfigurieren. Es wird jedoch ausdrücklich empfohlen, eine fe-ste IP-Adresse\
    \ für den Adminhost zu vergeben. Sie bekommen eine Auswahl\n von der Hardwareerkennung\
    \ gefundenen Netzwerkkarten. Aktivieren Sie"
- md: "\n## 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall\n\n![](img/594883f46b5a0951172f1e794f42a4a5_26_0.png)\n\
    \nAbbildung 3.5: YaST2: Netzwerk-Konfiguration\n\nDie Netzwerkkarte und geben\
    \ Sie die IP-Adresse und Netzwerkmaske ein. Tragen alle mit allen Angaben in einen\
    \ gegebenen Bereich bereits bestehenden Namenserver mit Abb. 3.7 auf der nächsten\
    \ Seite ein.\n\n![](img/594883f46b5a0951172f1e794f42a4a5_26_1.png)\n\nAbbildung\
    \ 3.6: YaST2: Konfiguration der Netzwerkadresse\n\n### 3.3.10 Manuelle Netzwerkkonfiguration\n\
    \nDie manuelle Konfiguration der Netzwerksoftware sollte dies zweite Wahl sein.\
    \ Wir empfehlen, YaST zu benutzen, jedoch kann YaST nicht alle Bereiche der Netzwerkkonfiguration\
    \ abdecken, so dass in Fällen manuelle Nacharbeit nötig sein wird.\n\n# Su Linux\
    \ Adminhost for Firewall\n\n![](img/594883f46b5a0951172f1e794f42a4a5_27_0.png)\n\
    \n# Konfigurationsdateien\n\nDieser Abschnitt gibt eine Übersicht über die Netzwerkkfigurationsdateien\
    \ und erklärt ihre Funktion sowie das verwendete Format.\n\n# /etc/rc.config\n\
    \nIn zentralen Konfigurationsdateien wird der Großteil der Netzwerkkonfiguration\
    \ vorgenommen. Bei Veränderung werden mittels YaST oder dem Aufruf von SuSEconfig,\
    \ nachdem die Datei manuell verändert wurde, werden aus diesen Einträgen die meisten\
    \ der folgenden Daten automatisch generiert. Auch die Bootsripte werden über die\
    \ Einstellungen in dieser Datei konfiguriert.\n\n> Tipp\n> Wenn Sie diese Datei\
    \ von Hand verändern, müssen Sie nachfolgend immer SuSEconfig aufrufen, damit\
    \ die geänderte Konfiguration automatisch in die richtigen Dateien eingetragen\
    \ wird.\n\n# /etc/hosts\n\nIn dieser Datei (siehe Datei 3.3.1 auf der nächsten\
    \ Seite) werden Rechnernamen IP-Adressen zugeordnet. Kein Nameserver wird verwendet,\
    \ müssen alle Rechner aufgeführt werden, zu denen eine IP-Verbindung aufgebaut\
    \ werden soll. Wenn ein Rechner eine Zeile besteht IP-Adresse, qualifizierten\
    \ Hostnamen und dem Rechnernamen (z. B. erde) in die Datei eingetragen. Die IP-Adresse\
    \ muss am Anfang der Zeilen stehen, die Einträge durch Leerzeichen bzw. Tabulatoren\
    \ getrennt. Kommentare werden durch Zeichen '\\#' eingeleitet.\n\n## 3.3 Neuininstallation\
    \ des SuSE Linux Firewall\n\n```\n# hosts\n# This file describes a number of hostname-to-address\n\
    mappings for the TCP/IP subsystem. It is mostly\nused at boot time, when no name\
    \ servers are running.\nOn small systems, this file can be used instead of a\n\
    \"named\" server. Just add the names, addresses\nand any aliases to this file...\n\
    \n127.0.0.1 localhost\n192.168.0.1 sonne.kosmos alle sonne\n192.168.0.20 erde.kosmos\
    \ alle erde\n# End of hosts\n```\n\nDatei 3.3.1: /etc/hosts\n\n# /etc/networks\n\
    Hier werden Netzwerken in Netzwerkadressen umgesetzt. Das Format\nähnelt dem hosts-Datei,\
    \ jedoch stehen die Netzwerke vor den\nAdressen (siehe Datei 3.3.2).\n\n```\n\
    # networks\n This file describes a number of netname-to-address\nmappings for\
    \ the TCP/IP subsystem. It is mostly\nused at boot time, when no name servers\
    \ are running.\n\nloopback      127.0.0.0\nlocanet      192.168.0.0\n# End of\
    \ networks.\n```\n\nDatei 3.3.2: /etc/networks\n\n# /etc/host.conf\nDas Ausflösen\
    \ von Namen – d. h. das Übersetzen von Rechner- bzw. Netz-\nnetzwerken über den\
    \ resolver-Bibliothek verwendet, wird durch diese Datei gesteuert.\nDiese Datei\
    \ wird für Programme verwendet, die gegen libc4 oder die\nlib5 gelinkt sind; für\
    \ aktuelle glibc-Programme vgl. die Einstellungen in\n/etc/nsswitch.conf! Ein\
    \ Parameter muss in einer eigenen Zeile stehen,\nKommentare werden durch '*' eingeleitet.\
    \ Die möglichen Parameter sind\nTabelle 3.1 auf der nächsten Seite.\n\norder hosts,\
    \ bind\nLeg fest, in welcher Reihenfolge die Dienste\nam Auflösen eines Namens\
    \ angesprochen werden-\nsollen. Mögliche Argumente sind (durch)\nLeerzeichen oder\
    \ Kommata voneinander-\n- hosts: Durchsuchen der Datei /etc/hosts\n- bind: Ansprechen\
    \ eines Nameservers\n- nis: Über Nis\n- multi off: Bestimmt, ob ein in /etc/hosts\
    \ eingragener\nRechner mehrere IP-Adressen haben dürfte.\n\nTabelle 3.1: Fortsetzung\
    \ auf der nächsten Seite...\n\n# SUSE Linux Adminshost for Firewall\n\nnospoof\
    \ on\nalert onoff\n\nDiese Parameter beeinflussen das spoofing des Nameservers,\
    \ haben aber keinen Einfluss auf die Netzwerkkonfiguration.\nDer angegebene Domainname\
    \ wird vor dem Auflösen des Rechnernamens abgeschnitten (sofern der Rechnername\
    \ diesen Domainnamen enthält). Diese Option ist dann von Nutzen, wenn in der Datei\
    \ /etc/hosts nur Namen aus lokal Domain stehen, sich auch mit angehängtem Domainnamen\
    \ erkannt werden sollen.\n- nospoof/off\n- trim <domainname>\n\nTabelle 3.1: Parameter\
    \ für /host.conf\n\nEin Beispiel für /etc/host.conf zeigt Datei 3.3.3.\n\n```\n\
    #\n# /etc/host.conf\n# We have named\norder hosts bind\n# Allow multiple addrs\n\
    multi-on\n# End of host.conf\n```\n\nDatei 3.3.3: /etc/host.conf\n\n# /etc/nswitch.conf\n\
    Mit der GNU C Library 2.0 hat der „Name Service Switch“ (NSS) Eingabe halten (vgl.\
    \ Manual-Page von nswitch.conf (man 5 nswitch.conf), wie ausführlicher die GNU\
    \ C Library Reference, Kap. „System Databases and Name Switch“; vgl. Paket.\n\
    In der Datei /nswitch.conf wird festgelegt, in welcher Reihenfolge bestimmte Informationen\
    \ abgefragt werden. Kommentare werden durch # eingeleitet. Das bedeutet z. B.\
    \ der Eintrag bei „Datenbank“ hosts, dass nach /etc/hosts (files) eine Anfrage\
    \ bei DNS (vgl. Abschnitt A auf Seite 23) gelöscht wird. Die verfügbaren „Datenbanken“\
    \ sind in Tabelle 3.2 der nächsten Seite genannt. Zusätzlich sind in Zukunft automount,\
    \ netmasks und publickey zu erwarten.\n- aliases: Mail-Aliase, von sendmail(8)\
    \ verwendet; vgl. Manual-Page von aliases (man 5 aliases).\n\nTabelle 3.2: Fortsetzung\
    \ der nächsten Seite\n\n# 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall\n\
    \n- Ethernet-Adressen für Benutzergruppen, von getgroup(3) verwendet; vgl. Manual-Page\
    \ von group (man 5 group).\n- Für Hostnamen und IP-Adressen, von gethostbyname(3)\
    \ und ähnlichen Funktionen verwendet.\n- netgroup Netzwerk gültige Liste von Hosts\
    \ und Benutzern, um zugiffsrechte zu steuern; vgl. Manual-Page von netgroup (man\
    \ 5 group).\n- networks Netzkanamen und -adressen, von getent(3) verwendet.\n\
    - passwd Benutzerwörter, von getpwent(3) verwendet; Manual-Page von passwd (man\
    \ 5 passwd).\n- protocols Netzwerk-Protokolle, von getproto(3) verwendet; vgl.\
    \ Manual-Page von protocols (man 5 protocols).\n- rpc „Remote Call-Name“ und -Adressen,\
    \ von getrpcbyname(3) und ähnlichen Funktionen verwendet.\n- services Netzwerkdienste,\
    \ von getserv(3) verwendet.\n- „Shadow“-Passwörter der Benutzer, von getspnam(3)\
    \ verwendet; vgl. Manual-Page von shadow (man 5 shadow).\n\nTabelle 3.2: Über\
    \ /etc/nswitch.conf verfügb „Datenbanken\"\n\nDie Konfigurationsmöglichkeiten\
    \ der NSS-,Datenbanken stehen in Tabelle 3.3.\n- files direkt auf Dateien zugreifen,\
    \ z. B. auf /etc/aliases.\n- db über eine Datenbank zugreifen.\n- nis Nur bei\
    \ hosts und networks als Erweiterung verwendet. Nur passwd, shadow und group als\
    \ Erweiterung verwendbar.\n- compat zusätzlich ist es möglich, unterschiedliche\
    \ Reaktionen bei bestimmten Lookup-Ergebnissen auszulösen; Details der Manual-Page\
    \ von nswitch.conf (man 5 nswitch.conf) zu entnehmen.\n\nTabelle 3.3: Konfigurationsmöglichkeiten\
    \ der NSS-,Datenbanken“\n\n```\n/etc/nscd.conf\n```\n\n# SuSE Linux Adminhost\
    \ for Firewall\n\n```\n#\n# /etc/nsswitch.conf\n#\npasswd: compat\ngroup: compat\n\
    \nhosts: files dns\nnetworks: files dns\n\nservices: db files\nprotocols: db files\n\
    \nnetgroup: files\n```\n\nDatei 3.3.4: /etc/nsswitch.conf conf\n\nÜber diese Datei\
    \ wird der nscd (engl. Name Service Cache Daemon) configuriert (vgl. Manual-Page\
    \ von nscd (man 8 nscd) und Manual-Page von nscd.conf (man 5 nscd.conf). Betroffenen\
    \ sind die Informationen von passwd, groups und hosts. Der Daemon muss neu gestartet\
    \ werden, wenn die Namensauflösung (DNS) durch Änderung der /etc/resolv.conf umgestellt\
    \ wird. Dazu dieser Befehl:\n\n```\nerde: # nscd restart\n```\n\n> Achtung\n>\
    \ Wenn beispielsweise das Caching für passwd aktiviert ist, dauert es in der Regel\
    \ 15 Sekunden, bis ein neu angelegter Benutzer dem System bekannt ist. Durch das\
    \ Neustarten des nscd kann diese Wartezeit verkürzt werden.\n\n# /etc/resolv.conf\n\
    \nWie bereits die Datei /etc/host.conf, so spielt auch diese Datei in Bezug auf\
    \ Auflösung von Rechnernamen die resolver-Bibliothek eine Rolle.\nIn dieser Datei\
    \ wird angegeben, welcher Domain der Rechner anzeigt (Schlüsselwort nameserver)\
    \ und wie die Adresse des Nameservers im (schlusswert nameserver), der angesprochen\
    \ wird. Soll es mehrere angegeben sein. Beim Auflösen eines nicht qualifizierten\
    \ Namen wird versucht, durch Anhängen eines E in search einen gültigen, voll qualifizierten\
    \ Namen zu erzeugen. Mehrere Nameserver können durch mehrere Zeilen, mit nameserver\
    \ angegeben, bekannt gemacht werden. Kommentare werden wieder mit '\\#' eingeleitet.\n\
    Ein Beispiel für /etc/resolv.conf zeigt Datei 3.3.5 auf der nächsten Seite.\n\n\
    YaST trägt hier den angegebenen Nameserver ein!\n"
