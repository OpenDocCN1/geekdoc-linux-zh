    \ – Ankündigungen und Infos der SuSE GmbH (englisch)\n  - suse-linux@suse.com\
    \ – Diskussionen um die SuSE Distribution (deutsch)\n  - suse-linux-e@suse.com\
    \ – Diskussionen um SuSE (english)\n  - proxy-suite@suse.com – Diskussion über\
    \ die Proxy-Suite (english)\n  - suse-adabas@suse.com – Infos und Diskussion über\
    \ Adabas unter SuSE (deutsch)\n  - suse-appliz@suse.com – Erfahrungsaustausch\
    \ mit App-Paket der SuSE GmbH (deutsch)\n  - suse-axp@suse.com – SuSE Linux auf\
    \ Alpha-Prozessoren (englisch)\n  - suse-domino@suse.com – Informationen und Diskussion\
    \ um SuSE Domino (deutsch)\n  - suse-ham@suse.com – SuSE Linux und Amateurfunk\
    \ (deutsch)\n  - suse-ham-e@suse.com – SuSE Linux und Amateurfunk (englisch)\n\
    \  - suse-ibm-db2@suse.com – SuSE Linux und IBM DB2 (englisch)\n\n# 7.7 Literaturhinweise\n\
    \n- suse-isdn@suse.com – ISDN mit SuSE Linux (deutsch)\n- suse-informix@suse.com\
    \ – Infos zu und Diskussion über Informix unter SuSE (english)\n- suse-laptop@suse.com\
    \ – SuSE Linux auf Laptops (deutsch)\n- suse-motif@suse.com – SuSE Linux and Motif\
    \ (english)\n- suse-oracle@suse.com – Infos zu und Diskussion über Oracle unter\
    \ SuSE (english)\n- suse-ppc@suse.com – SuSE Linux auf Power-PC-Prozessoren (english)\n\
    - suse-security@suse.com – Diskussion zu Sicherheitsbelangen unter SuSE (english)\n\
    - suse-security-announce@suse.com – Ankündigung von sicherheitsreleven Fehlern\
    \ und Updates (deutsch)\n- suse-sparc@suse.com – SuSE Linux auf Sparc-Prozessoren\
    \ (english)\n\nUm sich eine Liste einzutragen, schicken Sie eine E-Mail-Nachricht\
    \ an:\n<LISTNAME>-subscribe@suse.com\n\nEs wird eine automatische Rückfrage kommen,\
    \ die Sie dann bestätigen. Anstelle von <LISTNAME> ist der Name der gewünschten\
    \ Mailing-Liste einzusetzen, z. B. `suse-announce-subscribe@suse.com`, welche\
    \ die regelmäßigen Anpassungen zu erhalten.\n\nÄhnlich ist das Vorgehen, wenn\
    \ Sie eine Liste abbestellen wollen:\n<LISTNAME>-unsubscribe@suse.com\n\nAchten\
    \ Sie darauf, dass die unsubscribe-Mail mit Ihrer korrekten Mail-Adresse geschickt\
    \ wird.\n\n- SuSE FTP-Server `ftp://ftp.suse.com` (aktuelle Information, Updates\
    \ und Bugfixes. Melden Sie sich bei Ihrem System als Benutzer `ftp` an.)\n\n-\
    \ Brent Chapman & Elizabeth D. Zwicky: Einrichten von Internet-Firewalls, O'Reilly\
    \ 2000.\n- Wolfgang Barth: SuSE Firewall Book, SuSE Press 2001.\n- Maximum Linux\
    \ Security, SAMS 1999.\n- Robert L. Ziegler: Linux Firewalls, New Riders 1999.\n\
    \n# A DNS – Domain Name Service\n\nDNS (engl. Domain Name Service) wird benötigt,\
    \ um die Domain- und Rechnamen in IP-Adressen aufzulösen.\n\n# A.1 Nameserver\
    \ BIND starten\n\nDer Nameserver BIND8, der gilt auch für die neue Version BIND9,\
    \ ist auf SuSE Linux bereits vorkfiguriert, dass man ihn problemlos nach der Installation\
    \ sofort starten kann.\n\nHat man eine funktionsfähige Internetverbindung und\
    \ trägt in /etc/resol.conf als Nameserver 127.0.0.1 für localhost ein, hat man\
    \ in der Regel schon eine funktionierende Namensauflösung, ohne dass man den DNS\
    \ Providers kennt. BIND führt die Namensauflösung über die Root-Nameserver, was\
    \ aber wesentlich langsamer ist. Normalerweise sollte man den DNS Providers mit\
    \ in der Konfigurationsdatei /etc/named.conf unter forwarders eintragen, um eine\
    \ effektive und sichere Namensaufösung erhalten. Fungioniert das, läuft der Nameserver\
    \ als C. Wer seine eigene Domain bereitstellt, wird ein richtiger DNS benötigt.\
    \ Ein Beispiel dafür findet man im Dokumentverzeichnis: /usr/share/doc/packages/bind8/sample-config.\n\
    \nMan sollte lediglich offizielle Domain aufsetzen, solange man diese nicht kommen\
    \ muss. Wenn man eine eigene Domain hat, diese aber von Provider verwaltet wird,\
    \ sollte diese nicht verwenden, da BIND sonst Anfragen für diese Domain weiterführen\
    \ würde oder z. B. der Webserver für die eigene Domain nicht mehr erreichbar wäre.\n\
    \nUm den Nameserver zu starten nutzt man den Kommando (als root) rnamed start\n\
    \nein. erscheint rechts in grün „done“, der ist named, heißt der Nameserver-Prozess,\
    \ erfolgreich startet. Auf dem lokalen System kann man die Funktionalität des\
    \ Nameservers sofort testen, indem man das Programm nslookup verwendet. Der DNS\
    \ Server muss localhost mit der Adresse 127.0.0.1 angezeigt werden. Sollte dies\
    \ der Fall sein, ist sehr wahrscheinlich in der /etc/resol.conf ein falscher Nameserver\
    \ oder diese Datei existiert gar. Für einen ersten Test gibt man auf dem Prompt\
    \ von nslookup „127.0.0.1“ ein, das sollte ihn funktionieren; erhält man stattdessen\
    \ eine Fehlermeldung „No response from server“ oder ähnlich, sollte man mit folgend\
    \ kommando überprüfen, ob der named überhaupt läuft rnamed status\n"
