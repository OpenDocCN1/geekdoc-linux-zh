    die neue /etc/squid.conf zu verwenden und nur die Änderungen der ursprünglichen
    Datei zu übernehmen. Versuch man die squid.conf weiter zu verwenden, läuft man
    Gefahr, dass die Konfiguration nicht mehr funktioniert, da Optionen immer wieder
    geändert werden und neue hinzuzukommen.


    # Allgemeine Konfigurations-Optionen


    http_port 3128 ist der Port, dem Squid auf Anfragen der Clients lauscht. Voreinstellung
    ist 3128, gebräuchlich auch 8080. Es ist möglich, hier mehrere Portnummern, durch
    Leerzeichen getrennt, anzunehmen.


    cache_peer <hostname> <type> proxy-port <icp-port> wird der Proxy als "parent"
    eingegeben, z. B. wenn man den Providers nutzt oder mehr. Als <hostname> trägt
    den Namen bzw. die IP-Adresse des zu verwendenden Proxies und <type> parent ein.
    Für <proxy-port> trägt man die Portnummer ein, die der Proxy bei Verwendung im
    Browser benötigt, meist 8080. Der <icp-port> kann man auf 7 oder 8 setzen, wenn
    man den ICP-Port nicht kennt und die Nutzung mit diesem Proxy nicht vereinbar
    ist.


    Zusätzlich soll man nach default und no-query nach der Portnummer angeben, um
    die Verwendung des ICP-Protokolls ganz zu unterbinden. Squid verhält sich gegenüber
    dem Proxy der Providers wie normaler Browser.


    cache_mem 8 MB. Dieser Eintrag gibt ein, wie viel Speicher von Squid für das Cache
    maximal verwendet wird. Voreinstellung ist 8 MB.


    cache_dir /var/squid/cache 100 26 Der Eintrag cache_dir gibt das Verzeichnis an,
    in dem alle Objekte auf Platte abgelegt werden. Die Anzahl der Verzeichnisse gegen
    den zu verwendeten Plattenplatz in MB und die Anzahl der Dateien muss angepasst
    werden. Voreinstellung ist 100 MB Plattenplatz im Verzeichnis/var/squid/cache
    zu belegen und darin 16 Unterverzeichnisse anzulegen, welche wiederum 256 Verzeichnisse
    enthalten. Die Angabe des zu verwendenden Plattenplatz sollte man genügend Reserven
