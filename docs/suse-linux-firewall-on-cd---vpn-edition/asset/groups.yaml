  - '[PAGE 158]


    # C.2 Sicherheit mit Vertrauensache


    dere Fälle auch dann, wenn der Verdacht besteht, dass jemand sich unbefugterwei-se
    an den Daten zu schaffen gemacht hat.


    # C.2.2 Lokale Sicherheit und Netzwerksicherheit


    Es gibt verschiedene Möglichkeiten, auf Daten zuzugreifen:


    +   - Persönliche Kommunikation mit jemand, der über die gewünschten Informa-tionen
    verfügt; Zugang zur Bsole oder einem Computer hat,

    - direkt an die Konsole eines Rechners (physikalischer Zugriff),

    - über eine spezielle Schnittstelle oder

    - über ein Netzwerk.


    Alle Fälle sollten eine Gemeinskeit haben: Sie sollten als Benut-authentifizieren,
    bevor Sie Zugriff auf die Ressourcen oder Daten bekommen. Ein Webserver mag das
    anders sehen, aber Sie wollen sich Ihre persönlichen Daten auf Surfer schützen.
    Eine SuSE-Linux Installation lässt sich mit wenigen Handgriffen dabei bringen,
    das System direkt und ohne Passwort mit Ihrer Arbeitsoberfläche zu konfrontieren,
    dieses Vorgehen ist meistens unangenehm. Damit könnte jemand in Ihrem Namen Daten
    manipulieren und Programme ausführen.


    Der erste Fall ist der menschlichste von allen: Etwa bei einer Bank ist sich ein
    Angestellten, der Ihnen Zugriff auf Ihr Konto gestattet, dass Sie mit Ihrer Unterschrift
    eine PIN oder mit einem Passwort beweisen. In manchen Fällen kann es gelingen,
    das Erwähnen von Kenntnissen oder durch geschickte Rhetor des Vertrau einen Wissenssträger
    zu verschleichen, so dass dieser weitere Informationen preisgeben, ohne dass das
    Opfer dies merkt.


    Menschen sind unvorsichtig mit ihren Äußerungen und unbewusst mit ihren Antworten,
    dass sie für nicht beantwortet hal-ten, genug Information enthalten, wie früher
    im Mosaic immer mehr Details bekannt werden. („Nein, der Herr Mei ist im Urlaub
    und kommt erst in zwei Wochen. Und im übrigen ist er nicht mein Chef, zumal er
    im vierten Stock sitzt und ich im dritten!") Man nennt dies in Hackerkreisen „Social
    Engineering“. Gegen diese Art von Angriff hilft nur Aufklärung und ein bewusster
    Umgang mit Information und Sprache. Einbruch in Netzwerksystem erfolgt oft eine
    Art Social-Engineering-Angriff, der auf Empfang, Dienstleister in der Firma oder
    Familien-leiter, der erst viel später beginnt.


    jemand, der (unbefug) Zugriff auf Daten erhält, könnte auch die traditio-elle
    Methode benutzen, denn die Hardware selbst ein Angriffspunkt ist. Der Rechner
    müssen gegen Entnahme, Austausch und Sabotage von Teilen und Samamheit (und dem
    Backup der Daten!) sicher verstaut - dazu kann auch eine eventuell vorhandene
    Netzwerkverkabelung oder ein Stromkabel gehören. Au-ßerdem muss der Startvorgang
    abgesichert sein, denn allgemein bekannte'
  - '[PAGE 159]


    # Sicherheit im Netzwerk


    Tastenkombinationen können den Rechner zu speziellen Reaktionen veranlassen. Dgegen
    hilft das Setzen von BIOS- und Bootloaderpasswörtern. Serielle Schnittstellen
    mit seriellen Terminals sind heute zwar immer noch gebräuchlich, werden aber kaum
    noch an Arbeitsätzen installiert. Ein Terminal stellt eine besondere Art des Zugriffs
    dar: Es ist keine Netzwerkschnittstelle, die für Kommunikation zwischen Systemeinheiten
    verwendet wird. Ein simples Kabel (oder eine Infrotsignal) wird als Übertragungsmedium
    für einfache Zeichen verwendet. Das Kabel selbst ist der einfachste Angriffspunkt:
    Man muss nur einen alten Drucker anschließen und die Kommunikation aufzeichnen.
    Mit einem Drucker genügt es, sich selbstverständlich mit beliebigem Aufwand daran.


    Netzwerke vereinen den Zugriff auf Daten mit dem komplex Kommunikationsprotokollen.
    Das mag paradox klingen, muss aber sein. Wenn wir vom Ort anbei sind und einen
    Rechner fernsteuern oder Daten von ihm beziehen, brauchen wir abstrakte, modulare
    Modelle, denen ebenfalls weitgehend unabhängig voneinander sind. Im täglichen
    Umgang mit Computer bleiben wir ständig Modelle: Modularität ist, wenn Ihr Textverarbeitungsprogramm
    nicht wissen muss, welche von Festplatte sie haben und Ihr E-Mail-Programm nicht,
    ob Sie ein Modem oder eine Ethernet-Karte haben. Teile Ihres Betriebssystems (in
    unsern Fall) stellen die Funktionalität einer definierten Schnittstelle bereit
    und kümmern sich um die Details. So kann sich ein Textverarbeitungsprogramm oder
    ein User-Agent (MUA) auch auf Rechner mit durchaus unterschiedlicher Hardware
    funktionieren, und andererseits können sie von einem beliebigen Ort betrieben,
    der die technische Ausstattung voraussetzt.


    In Hinblick auf die Daten bedeutet, dass es keinen Unterschied macht, ob eine
    Datei in der Kommandozeile geöffnet oder mit einem Netzwerk (etwa mit einem Webbrowser)
    betrachtet wird. Man kann sich über ein Netzwerk (etwa mit einem telnet-Programm,
    oder mit einem secure Shell Programm),), der Datenverkehr verschlüsselt vollständig
    einloggen und die Datei lesen. Denn müssen viele Hürden übersprungen werden. Zunächst
    müssen Netzwerk und Rechner verbunden werden, dann muss sich der Benutzer authentifizieren
    (die Identität nachweisen). Dies schränkt räumlich die Zugiffsrechte der Datei
    die Handlungsmöglichkeiten ein.


    Das Öffnen einer Datei auf einem Rechner anderer Zugiffsbeschränkungen unterliegt
    das Öffnen einer Netzwerkverbindung zu einem Dienst auf einem Rechner, ist es,
    zwischen lokaler Sicherheit und Netzwerksicherheit zu unterscheiden. Die Trenlinie
    ist da markiert, wo Daten in Pakete verschlüsselt werden, um verschickt zu werden
    und zur Anwendung zu gelangen.


    # Lokale Sicherheit


    Lokale Sicherheit mit den physikalischen Gegebenheiten, in denen der Rechner aufgestellt
    ist. Wir gehen davon aus, dass Ihr Rechner so aufgebaut ist, dass er an Sicherheit
    Ihrem Anspruch und Ihren Anforderungen genügt.'
- md: "\nIn Bezug auf „Lokale Sicherheit“ besteht die Aufgabe darin, die einzelnen\
    \ Benutzer voneinander zu trennen, dass keiner Benutzer die Rechte oder die Identität\
    \ eines anderen Benutzer annehmen kann. Dies gilt im Allgemeinen, im Speziellen\
    \ ist natürlich besonders ‚root‘ im System Allmacht hat; kann der Benutzer root\
    \ ohne Passwort zu jedem lokalen Benutzer werden und jede lokale Datei leisten.\
    \ \nDie Liste der Möglichkeiten, ein System anzugreifen, wenn man bereits Zugriff\
    \ auf lokale Ressourcen hat, ist die Kommandozeile, ist recht lang.\n\n# Passwörter\n\
    \nIhr Linux-System speichert Passwörter nicht etwa als Klartext und vergleicht\
    \ ein eingegebenes Passwort mit dem, was gespeichert ist. Bei einem Diebstahl\
    \ der Datei, in der Passwörter speichern, wären ja alle Accounts auf Ihrem System\
    \ kompromittiert. Wenn Ihr Passwort verschlüsselt haben, wird dies wieder verschlüsselt\
    \ und gespeichert, was als verschlüsseltes Passwort gespeichert ist. Dies macht\
    \ natürlich nur Sinn, wenn man aus dem verschlüsselten Passwort nicht das Klartextwort\
    \ errechnen kann. Dies erreicht man so viele „Faltalgorithmen“, die nur in eine\
    \ Richtung funktionieren. Ein Angreifer, der das verschlüsselte Passwort in seinen\
    \ Besitz gebracht hat, kann nicht einfach zurückdrehen und das Passwort schauen,\
    \ sondern er muss alle möglichen Buchstabenkombinationen für ein Passwort durchprobieren,\
    \ bis er dasjenige findet, welches verschlüsselt aussieht wie er ist. Bei acht\
    \ Buchstaben für Passwort gibt sich beträchtlich viele Kombinationen.\n\nMit einem\
    \ Argument für die Sicherheit dieser Methode in den 70er Jahren war, dass der\
    \ verwendete Algorithmus recht langsam ist und Zeit im Kundenbereich für das verschlüsseln\
    \ von einem Passwort gebrauchte. Heuteige PCs schaffen ohne weiteres mehrere hundertausend\
    \ bis Millionen Verschlüsselungen pro Sekunde. Durch diesen Grund werden verschlüsselte\
    \ Passwörter nicht für jeden Benutzer sichtbar sein, und das Passwort dürfen nicht\
    \ zu ratten sein, in den Fall, dass das verschlüsselte Passwort wegen eines Fehlers\
    \ nicht dochbar wird.\n\nEin Passwort wie „Phantasie“ untersreiben in „Phnt@s13\
    \ hilft nicht: Suchterregeln können bei Knackprogrammen, die Wörterbücher um Nutzen\
    \ raten, sehr leicht aufgelöst. Besser sind Kombinationen von Buchstaben, die\
    \ kein bekanntes Wort sind und nur für den Benutzer eine persönliche Bedeutung\
    \ haben, etwa die Anfangsbuchstaben der Wörter eines Satzes, oder nehmen Sie Beispiel\
    \ einen Buchtitel wie: „Der Name der Rose“ von Umberto Eco. Daraus ergibt sich\
    \ ein gutes Passwort: „DNdrvUE9“. Ein Passwort wie „Bierjunge“ oder „Jasmin76“\
    \ würde schon jemand erkennen können, die sich oberflächlich gut kennt.\n\n# Der\
    \ Bootvorgang\n\nVerhindern Sie, dass mit einer Diskette oder einer CD-ROM gebootet\
    \ werden kann, indem Sie die Laufwerke ausbauen oder indem ein BIOS-Passwort setzen\
    \ und im BIOS ausschließlich das Booten von Festplatte erlauben.\n\n# Sicherheit\
    \ im Netzwerk\n\nLinux Systeme starten gewöhnlicherweise mit einem Boot-loader,\
    \ der es erlaubtet, zusätzliche Optionen an den startenden Kernel zu übergeben.\
    \ Solche Optionen sind im hohen Maße sicherheitskritisch, da der Kernel nicht\
    \ nur mit 'root'-Rechten läuft, sondern die 'root'-Rechte von Anfang an vergibt.\
    \ Hindern Sie, dass jemand solche Optionen verwendet, während er Ihr Rechner dem\
    \ er er die Optionen 'restricted' und 'password:irgendein,password' in /etc/lilo.conf\
    \ verwenden. Vergessen Sie nicht, das Kommando lila auszuführen, wenn Sie die\
    \ Datei /etc/lilo.conf verändern haben, und achten Sie die Ausgaben des Programms!\
    \ Wenn Sie das Passwort vergessen, müssen Sie das BIOS-Passwort vergessen und\
    \ CD booten, um den Eintrag in /etc/lilo.conf aus einem Rettungssystem heraus\
    \ zu lesen.\n\n# Zugiffsrechte\n\nEs gilt das Prinzip, mit dem niedrigsten möglichen\
    \ Privilegien für eine jeweilige Aufgabe zu arbeiten. Dies ist definitiv nicht\
    \ nötig, E-Mails zu lesen und zu schreiben. Wenn das Mailprogramm (MUA = Mail\
    \ User Agent), mit arbeiten, einen Fehler hat, dann wirkt sich dieser Fehler mit\
    \ den Rechten aus, den Sie zum Zeitpunkt des Angriffs hatten. Hier geht es auch\
    \ als um Schadensminimierung.\n\nDie einzelnen Rechte bei über 200 Dateien einer\
    \ SU-Distribution sorgfältig vergeben. Der Administrator muss zusätzliche Software\
    \ oder Daten nur unter möglichst geringer Rechte installieren und besonders auf\
    \ die vorgegebenen Rechte der Dateien achten. Erfahrene und sicherheitsbewusste\
    \ Admins werden bei dem kommando ls l die Option -l für eine ausführliche Liste\
    \ der Dateien mit Zugriffsrechte, so sie eventuell fest gesetzte Dateire gleich\
    \ erkennen. Ein falsch gesetztes Attribut bedeutet nicht, dass Dateien überschrieben\
    \ oder gelöscht werden können, sondern dass alle die veränderten Dateien von 'root'\
    \ als benutzt werden können. Damit könnte Angreifer seine Rechte erheblich weweiten.\
    \ Man nennt solche Angriffe auch Kuckukei (Vögel), wenn das Programm als Ei von\
    \ einem fremden Benutzer (ausgeführt) wird,n wenn die Kukuk seine Eier von fremden\
    \ Vögeln ausblibt.\n\nSuSE-Systeme verwenden über die Dateien permissions.easy,\
    \ permissions.paranoid im Verzeichnis /etc. In diesen Dateien werden mehrere Rechte\
    \ wie welt-weite Verzeichnis- oder für Benutzer-id-bis festlegt, d.h. das Programm\
    \ läuft nicht mit der Berechtigung des Eigentüm des Prozesses, der er gestartet\
    \ hat, mit der Berechtigung des Eigentüm der Datei, und das ist in der 'root'.\
    \ Der Administrator stellt die Datei /etc/permissions.local zur Verfügung, damit\
    \ er seine eigenen Änderungen festhalten kann. Die Variable PERMISSION_SECURITY\
    \ aus der Datei /etc/rc.config legt fest, welche Dateien für Konfigurationsprogrammen\
    \ von SuSE gemäß der Rechte benutzt werden sollen. Diese Auswahl können auch komfortabel\
    \ unter im Menüpunkt 'Sicherheit' von YaST1 und YaST2 treffen. Mehr zu diesem\n\
    \n# C.2 Sicherheit vs Vertrauensache\n\nma erfahren Sie direkt aus der Datei /etc/permissions\
    \ und der Manpage des Kommandos chmod (man chmod).\n\n# file race\n\nEin Programm\
    \ will eine Datei in einem Verzeichnis anlegen, welches für jeden schreibbar ist\
    \ (wie /tmp). Es überprüft, ob die Datei bereits existiert und erzeugt die Datei,\
    \ wenn sie nicht vorhanden war. Zwischen dem Über der Existenz und dem Anlegen\
    \ der Datei gibt es eine Zeit, in der ein Angreifer einen symbolischen Link anlegen\
    \ kann, der Zeiger auf eine andere Datei. Das Programm folgt diesem symbolischen\
    \ Link und schreibt die Zieldatei mit Privilegien. Dies ist ein Rennen (race),\
    \ wenn der Angreifer eine kurze Zeit bleibt, in der den „link“ anlegen kann. Dies\
    \ ist nicht möglich, da der Vorgang von Über und Anlegen einer Datei nicht atomisch,\
    \ sondern unteilbar ist. Das Rennen stattfinden, kann es von einem Angreifer gewonnen\
    \ werden, das ist eine Frage der Wahrscheinlichkeit.\n\n# Buffer overflows, format\
    \ string bugs\n\nWenn ein Programm Daten verarbeitet, die in beliebiger Länge\
    \ eines Benutzers stehen oder, sind besondere Vorsicht geboten. Diese Vorsicht\
    \ gilt im Hauptsächlich für den Programmierer der Anwendung: Er muss sicherstellen,\
    \ dass die Daten zu jedem Zeitpunkt in Speicherbereiche geschrieben werden, die\
    \ eigentlich klein sind des Users und dass die Daten in konsistenter Art und Weise\
    \ durch seinen Programm und die dafür definierten Schnittstellen weiterhin reicht.\n\
    \nEin, „Buffer Overflow“ passiert, wenn beim Beschreiben eines Pufferspeichers\
    \ nicht ausreichend wird, wie der Puffer groß ist. Es könnte sein, dass die Daten\
    \ (vom Benutzer) mehr Platz verlangen, als im Puffer zur Verfügung steht. Durch\
    \ Überschreiben des Puffers über seine Grenze hinaus ist unterständen möglich,\
    \ dass ein Programm umfangen der Daten, die er nur verarbeiten soll, Programmsequenzen\
    \ ausführen, die dem Einfluss des Users und nicht des Programmierers stehen. Dies\
    \ ist ein schwerer Fehler, insbesondere wenn das Programm mit besonderen Rech\
    \ abläuft (siehe Abschnitt C.2.2 der vorherigen Seite). „Format String Bugs“ funktionieren\
    \ ebenfalls anders, werden aber wieder user-input, um das Programm von seinem\
    \ eigenen Fehler abzugrenzen.\n\nDiese Programmierfehler werden normalerweise\
    \ in Programmen ausgebautet (engl. exploit), die mit gehobenen Privilegien aufgeführt\
    \ werden, also setuid- und setgid-Programme. Sie können sich und Ihr System vor\
    \ solchen Fehler Ausführungsrechte von den Programmen entfernen. Auch hier hilft\
    \ wieder das Prinzip der geringstmöglichen Privilegien.\n\nDa, „Buffer Overflows“\
    \ und „Format String Bugs“ Fehler bei der Behandlung von Benutzerdaten sind, sind\
    \ sie nicht notwendigerweise ausbeutar, wenn\n"
  mdcn: '

    关于“本地安全”，任务是将各个用户相互隔离开，确保任何用户无法获取另一个用户的权限或身份。这在通常情况下适用，特别是系统中的 `root` 用户无疑拥有绝对权限；如果用户无需无需密码即可变成任何本地用户并操作任何本地文件，将会非常危险。

    在已经获得本地资源访问权限的情况下，攻击系统的方法列表（包括命令行界面在内）是相当冗长的。


    # 密码


    您的 Linux 系统不会以明文形式存储密码，而是将输入的密码与存储的密码进行比对。如果存储密码的文件被盗取，那么您系统上的所有账户都将受到破坏。如果您对密码进行了加密，它会被再次加密并存储，作为加密密码存储。这显然只有在无法从加密的密码中计算出明文密码时才有意义。为了实现这一点，使用了许多“哈希算法”，这些算法是单向的。获取了加密密码的攻击者无法简单地回溯并查看密码，而是必须尝试所有可能的密码字母组合，直到找到加密后看起来与它一致的那一个。如果密码有八个字母，组合数量将非常多。


    在 70 年代，这种方法安全性的一个论点是所使用的算法非常慢，在客户端加密密码需要花费时间。如今的 PC 可以轻而易举地每秒完成几十万到百万次的加密。基于此原因，加密后的密码不会对每个用户可见，而且即使加密密码因为某种错误变得可以解析，密码也不应该是易被猜到的。


    像“Phantasie”（幻想）这样的密码写成“Phnt@s13”并没有帮助：因为在利用字典猜测单词的破解程序中，这些规则很容易被破解。更好的做法是使用已知单词且仅对用户具有个人意义的字母组合，例如句子中单词的首字母，或者以书名为例，如：乌伯托·艾柯的《玫瑰的名字》。由此可以产生一个好的密码：“DNdrvUE9”。像“Bierjunge”或“Jasmin76”这样的密码，稍加了解的人就能识别出来。


    # 启动过程


    通过拆卸驱动器或设置 BIOS 密码并仅在 BIOS 中允许硬盘启动，可以防止通过软磁盘或 CD-ROM 启动。


    # 网络安全


    Linux 系统通常通过引导加载程序启动，该程序允许向启动的内核传递额外的选项。这些选项具有高度的安全性，因为内核不仅以 `root` 权限运行，而且从一开始就开始分配
    `root` 权限。要防止有人在使用您的电脑时使用此类选项，请在 `/etc/lilo.conf` 中使用 `restricted` 和 `password:any,password`
    选项。在修改 `/etc/lilo.conf` 文件后，不要忘记执行 `lilo` 命令，并注意程序的输出！如果您忘记了密码，则必须忘记 BIOS 密码并通过
    CD 启动，从救援系统读取 `/etc/lilo.conf` 中的条目。


    # 访问权限


    遵循执行每项任务时使用尽可能低权限的原则。读写邮件绝对不需要这样做。


    '
