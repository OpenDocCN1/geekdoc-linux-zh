    ## 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall


    ```

    # /etc/resolv.conf

    #

    # Our domain

    search cosmos.all

    #

    # We use sonne (192.168.0.1) as nameserver

    nameserver 192.168.0.1

    # End of resolv.conf

    ```


    Datei 3.3.5: /etc/resolv.conf


    ### /etc/HOSTNAME

    Hier steht der Name des Rechners, als nur der Hostname ohne den Domainname. Diese
    Datei wird von verschiedenen Skripten während des Starts des Rechners gelesen.
    Sie darf nur eine Zeile enthalten, in der der Rechner steht! Diese Datei wird
    automatisch aus den Einstellungen in /etc/rc.config generiert.


    ### Startup-Skripte


    Neben den beschriebenen Konfigurationsdateien gibt es noch verschiedene Skripte,
    welche das Hochfahren des Rechners das Netzwerkprogramme starten. Diese werden
    gestartet, sobald das System in Multiuser-Runlevel übergeht (vgl. Tabelle 3.4
    auf der nächsten Seite).


    ####etc/init.d/network

    Dieses Skript übernimmt die Kon des Netzwerk Hard- und Software während der Startphase
    des Systems. Dabei werden auch die durch YaST in /etc/rc.config eingetragenen
    Angaben zu IP- und Netzwerkmaske und Gateway ausgewertet.


    ####/etc/init.d/route

    Dies dient dem statischen Routen im Netzwerk.


    ####/etc/init.d/inetd

    Startet den inetd, sofern es dies in /etc/rc.config festgelegt ist. Dies ist beispielsweise
    nötig, wenn Sie vom Netzwerk aus auf diese Maschine einloggen möchten.


    ####/etc/init.d/portmap

    Startet den Portmapper, der benötigt wird, um RPC-Server verwenden zu können,
    wie z. B. einen NFS-Server.


    ####/etc/init.d/nfsserver

    Startet den NFS-Server.


    ####/etc/init.d/sendmail

    Kontrolliert den sendmail-Prozess in Abhängigkeit von den Einstellungen in /etc/rc.config.


    Tabelle 3.4: Einige-Skripten der Netzwerkprogramme


    | Skript | Funktion |

    | :--- | :--- |

    | /etc/init.d/ypserv | Startet den NIS-Server in Abhängigkeit von den Einstellungen
    in /etc/rc.config. |

    | /etc/init.d/ypbind | Startet den NIS-Client in Abhängigkeit von den Einstellungen
    in /etc/rc.config. |


    Bitte beachten Sie, dass der Hostname erst nach einem Neustart geschrieben wird.
    Einige Anwendungen funktionieren erst mit dem endgültigen Hostnamen.


    ### 3.3.11 Benutzer `fwadmin` für das Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_33_0.png)


    Abbildung 3.8: Benutzer für das Firewall Administration System (FAS)


    In der Konfigurationsmaske (siehe Abbildung 3.8) richten Sie einen Benutzer ein,
    mit dem die Konfiguration der SuSE Firewall vornehmen werden. Geben Sie einen
    Benutzern an, beispielsweise `fwadmin`. Hier ist die Vorlegung `/var/lib/fwadmin`
    für das Home-Verzeichnis für den Benutzer. In dieser Konfigurationsmaske geben
    Sie das Passwort für den Admin-Benutzer der Firewall ein. Dieses Passwort muss
    mindestens fünf Zeichen.


    Im nächsten Bildschirm müssen Sie eine zusätzliche `Passphrase` definieren und
    im nächsten Feld wiederholen (siehe Abbildung 3.9 auf der nächsten Seite). Damit
    wird die Installation der SuSE Linux Adminhost für Firewall abgeschlossen. Sie
    können auf dem Bildschirm den Fortschritt mitfolgen und erhalten am Ende die Erfolgmeldung
    in Abbildung 3.10 auf der nächsten Seite.


    ## 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall


    ![](img/594883f46b5a0951172f1e794f42a4a5_34_0.png)


    Abbildung 3.9: SSH-Passphrase für Admin-Benutzer definieren


    ![](img/594883f46b5a0951172f1e794f42a4a5_34_1.png)


    Abbildung 3.10: Abschluss der Installation


    ### Firewall Administration System (FAS)


    Nach der Installation bootet das System bis zum graphischen Login. Hier melden
    Sie sich als Benutzer `fwadmin` mit dem entsprechenden Passwort an. FAS funktioniert
    allerdings erst nach dem Neustart des Systems.


    #### 4.1 Eingen als `fwadmin`


    Sie gelangen auf den Desktop des Benutzers `fwadmin`, auf dem sich ein Icon befindet,
    mit dem Sie direkt die Administrationsoberfläche für die Konfiguration Live starten
    (vgl. Abbildung 4.1).


    ![](img/594883f46b5a0951172f1e794f42a4a5_36_0.png)


    Abbildung 4.1: FAS-Icon


    #### 4.2 Starten Firewall Administration System


    FAS ist die grafische Administrationsoberfläche, mit der Sie die Konfiguration
    für „Safe Firewall“ erstellen. FAS unterstützt mehrere Benutzer und ist in der
    Lage, mehrere Konfigurationen zu verwalten.


    Es handelt sich um ein Client-Server-System, das aus GUI und fasdaemon besteht.
    Der fas-daemon verwaltet die Konfigurationen, nimmt Änderungen entgegen, prüft
    die Eingaben vom Benutzer auf Richtigkeit und leitet sie an den Server weiter.
    Die Kommunikation zwischen Front- und Backend findet in dieser Version über Domain
    Sockets statt.


    Es gibt verschiedene Möglichkeiten, das Administration System zu starten:

    1. Icon auf Desktop (vgl. Abbildung 4.1).

    2. Auswahl aus dem Menü.

    3. Geben Sie an der Kommandozeile (z. B. xterm) den Befehl FAS ein.


    ![](img/594883f46b5a0951172f1e794f42a4a5_37_0.png)


    Abbildung 4.2: Desktop mit FAS


    #### 4.3 Erstellen einer neuen Firewall-Konfiguration


    Nach Sie das Konfigurationsprogramm FAS gestartet haben, müssen Sie einen neuen
    Benutzer-Account in FAS anlegen. Wählen Sie im Menü *FAS* den Menüpunkt *Login
    anlegen* aus. Es folgt ein Dialog, in dem Sie Benutzernamen und ein Passwort verwenden.
    Der Benutzername muss mindestens fünf Zeichen sein. Mit diesem Passwort schützen
    Sie die Konfiguration der SuSE Firewall, weshalb Sie dieses Passwort regelmäßig
    überprüfen.


    Allen gilt: Gute Passörter sind nicht zu erraten, verwenden Sie nicht das Geburtsdatum,
    den Straßennamen oder den Namen des Lieblings. Anstatt kurz und dennoch schnell
    zu tippen, damit sich niemand die Eingabe merken kann, verwenden Sie Groß- und
    Kleinbuchstaben und Zahlen. Natürlich ist es allem wichtig, dass man sich ein
    Passwort merken kann und es nicht aufschreiben muss. Die gewählte Methode der
    Passwortfindung lässt daher Kürzungen von Sätzen oder Ausdrücken, die man sich
    leicht einprä kann. Hier einige Beispiele:

    - online for tennis

    - UNIX-admins eat cheese

    - Am Zehnten ist mein Geburtstag

    - Ich wünschte, ich hätte ein gutes Passwort


    Die Konfiguration der SuSE Firewall wird in einem *.tar.gz-Archiv gespeichert.
    Um eine bereits erstellte Konfiguration bearbeiten zu können, müssen Sie dieses
    Passwort angeben.


    Nach der Anmeldung wählen Sie im Menü *Konfiguration* den Punkt *Neue Konfiguration*
    aus. Es erscheint ein neues Fenster, in dem Sie Namen für die Konfiguration festlegen.
    Weiterhin müssen Sie eine Beschreibung der Konfiguration eingeben. Diese Beschreibung
    kann dazu benutzt werden, der Zweck der Konfiguration zu erläuten und zu dokumentieren,
    wer, wann, an der Konfiguration etwas geändert wurde. Die Beschreibung der Konfiguration
    kann später erweitert oder verändert werden. Nutzen Sie diese Möglichkeit, gute
    Dokumentation ist wichtig.


    Bestätigen Sie mit ''OK''.


    Sie sehen jetzt Ihre neue Konfiguration im linken Fenster. Wenn Sie einmal auf
    den Namen klicken, wird rechts die Beschreibung der Konfiguration angezeigt. Sie
    können jetzt die Beschreibung editieren. Um Änderungen an der Configbeschreibung
    zu speichern, klicken Sie auf ''Änderungen speichern''. Klicken Sie zweimal kurz
    hintereinander (Doppelklick) auf den Namen Ihrer Konfiguration, um mit der Erstellung
    der Konfiguration zu beginnen.


    In der linken Hälfte finden Sie eine Liste mit den Konfigurations-Modulen, d.
    h. mit den Diensten, Sie für Ihre Firewall konfigurieren können, und den Status,
    in dem sich das jeweilige Modul befindet. Erst müssen Sie das Basis-Modul (''Basismodul'')
    und ''Syslogmodul'') konfigurieren. Solange sich diese Module im Zustand ''nicht
    konfiguriert'' (symbolisiert durch ein Kreuz) befinden, ist es nicht möglich die
    anderen Module auszuwählen.


    Die Dienste werden durch Anklicken von der rechten Maustaste und Auswählen von
    ''Dienst aktivieren'' in der Firewall-Konfiguration aktiviert. Dies wird durch
    einen grünen Punkt symbolisiert. Das Basis-Modul und Syslog-Modul sind immer aktiv.


    Liste der verfügbaren Module:

    - Basismodul (Netzwerkinterfaces, Hostname, Rootpasswort)

    - DNS Modul (Nameserver)

    - External ftp (Konfiguration des ftp-Proxies von Extern nach Intern/DMZ)

    - External http (Konfiguration des Http-Proxies von Extern nach Intern/DMZ)

    - IPCHAINS-Modul (Import eines selbstgenerierten ipchains Regelsatzes)

    - IPSEC Modul (Konfiguration von IPsec-Tunneln)

    - Internal ftp

    - Internal http

    - Mail Modul

    - NTP Modul (Konfiguration von nntpd zum Abgleich der Computerzeit mit einem Zeitserver)

