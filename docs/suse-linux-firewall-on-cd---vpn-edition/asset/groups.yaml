  - '[PAGE 22]


    # 3.3 Neuinstallation des SuSE Linux Adminhost for Firewall


    # 3.3.4 Festplatte vorbereiten


    Bei den folgenden Schritten wählen Sie den Festplatten vorbereiten und bereiten
    diese auf die Installation von SuSE Linux vor. Je nach Hardware-Konfiguration
    Ihres Rechners die folgenden Dialoge kleinere oder größere Abweichungen von dem
    hier beschriebenen Beispiel aufweisen.


    Schritt 1


    ![](img/594883f46b5a0951172f1e794f42a4a5_22_0.png)


    Abbildung 3.3: YaST2: Festplatte vorbereiten (I)


    Befindet sich im Rechner noch eine Festplatte, muss zuerst entschieden, welche
    für die Installation genutzt wird. Die gefundenen Platten werden nacheinander
    aufgelistet, vgl. Abbildung 3.3.


    Im Normalfall werden Sie eine Festplatte auswählen und danach auf ''Weiter'' klicken.


    Schritt 2


    Eine der folgenden Situationen kann auftreten:


    +   - Wenn die Festplatte nicht leer ist, zeigt YaST2 hier alle auf der Platte
    befindlichen Partitionen sowie den Punkt ''Gesamte Festplatte'' an. Frei, nicht
    partitionierter Speicherplatz am Ende der Festplatte wird ebenfalls angezeigt
    und automatisch formatiert. Dieser Platz kann YaST2 zusammenhängend nutzen, d.
    Partitionen können nur ''von hinten'' her zur zusätzlichen Partition fregeben
    werden, bei bereits eingerichteten Partitionen sind beispielsweise Partition 1
    und 2 erhalten und kreuzen die dritte für Freigabe an. Falls Sie sich dafür entscheiden,
    die gesamte Platte für SuSE Linux zur Verfügung zu stellen, wählen Sie ''Gesamte
    Festplatte''.


    +   - Eine leere Platte ist komplett für SuSE Linux verwendet.'
  - '[PAGE 23]


    # SUSE Linux Adminhost for Firewall


    Wenn Sie andere Anforderungen haben, gehen Sie ‚Zurück‘ zum letzten Dialog, um
    dort mit Hilfe der ‚Erweiterten Einstellungen‘ manuell zu partitionieren.


    > ### Hinweis

    Da die ausgewählten Partitionen, die für SuSE Linux zur Verfügung gestellt werden
    sollen, gehen alle dort eventuell vorhandenen Daten unwiederruflich verloren!


    Wenn später die eigentliche Installation beginnt und alle Bedingungen erfüllt,
    wird YaSt2 den Festplatz selbstständig einrichten. Die gesamte Platte von der
    freie Platz bzw. die freigegebenen Partitionen werden für SuSE Linux in drei Standard-Partitionen
    aufgeteilt (und zwar eine kleine Partition für /boot [etwa 16 MB] bis zum Beginn
    der Platte, eine Partition für Swap [128 MB] und der ganze Rest für /).


