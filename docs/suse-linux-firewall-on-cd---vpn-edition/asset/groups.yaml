  - '[PAGE 136]


    # B Proxy-Server: Squid


    Im folgenden Kapitel wird erläutert, wie das Caching von Webseiten mit Hilfe eines
    Proxy-Servers funktioniert und welchen Nutzen Squid für Ihr System bietet.


    Squid ist der am weitesten verbreitete Proxy-Cache für Linux/UNIX-Plattformen.
    Wir werden beschreiben, wie er zu konfigurieren ist, welche Systemanforderungen
    bestehen, wie das eigene Full-Web konfiguriert sein muss, um transparentes Proxing
    durchzuführen, wie man Statistiken über den Nutzen des Cache mit Hilfe von Camaris
    und cachemgr erhält oder wie Web-Inhalte durch squidgr filtert.


    # B.1 Was ist ein Proxy-Cache?


    Squid fungiert als Proxy-Cache. Er verhält sich wie ein Makler, der Anfragen von
    Clients (in diesem Web-Browser) an den zuständigen Server-Provider weiterleitet.
    Wenn die angeforderten Objekte vom Vermittler ankommen, erhält er eine Kopie im
    Festplatten-Cache.


    Der Vorteil zeigt, wenn mehrere Clients dasselbe Objekt anfordern: Sie können
    direkt aus dem Festplatten-Cache bedient werden, also wesentlich schneller als
    aus dem Internet. Dies spart gleichzeitig eine Menge Bandbreite.


    > Tipp Squid bietet ein großes Spektrum an Features, z. B. die Festlegung von
    Hierarchien für die Proxy-Server zum Verteilen der Systemlast, Aufstellen Zugriffsrechte
    an alle Clients, die auf den Proxy zugreifen wollen, Erteilen oder Verweigern
    von Zugriffen auf bestimmte Webseite mit Hilfe anderer Applikationen oder die
    Ausgabe von Statistiken der meistbesuchten Seiten, wie z. B. das Surferverhalten
    der Benutzer u. v. m.


    Squid ist keine Internet-Verbindungen. Normalerweise wird er nur zwischen HTTP-Verbindungen.
    Außerdem unterstützt er die Protokolle FTP, Gopher, SSL und WAIS, jedoch keine
    anderen Internet-Protokolle wie Real Audio, News oder Videokonferenzen. Squid
    greift auf das UDP-Protokoll nur zur Unterstützung der Kommunikation zwischen
    verschiedenen Caches zurück. Aus diesem Grund werden andere Multimedia-Protokolle
    nicht unterstützt.'
  - '[PAGE 137]


    # B.2 Informationen zu Proxy-Cache


    # B.2.1 Squid und Sicherheit


    Man kann Squid zusammen mit einer Firewall, um interne Netzwerke durch Einsatz
    von Proxy-Cache nach außen zu schützen. Die Firewall verweigert Ausnahme von Squid
    an allen externen Dienste, die WWW-Verbindungen müssen durch den Proxy aufgebaut.


    Im Falle einer Firewall-Konfiguration mit einem DMZ würden wir dort unseren Proxy
    setzen. In diesem Fall ist es wichtig, dass Rechner innerhalb des gesicherten
    Netzwerks senden.


    Eine Möglichkeit der Implementierung dieser Features mit Hilfe eines sogenannten
    „transparenten“ Proxy wird in Abschnitt B.6 auf Seite 147 behandelt.


    # B.2.2 Mehrere Caches


    Man kann mehrere Caches so konfigurieren, dass Objekte zwischen ihnen ausgetauscht
    werden können, um die Systemlast zu reduzieren und die Möglichkeit zu steigern,
    ein bereits im lokalen Netzwerk vorhandenes Cache zu finden. Möglich sind sich
    auch Cache-Hierarchien, so dass ein Cache in der Lage ist, Objektanfragen an Caches
    der gleichen Hierarchie weiterzuleiten oder einen übergeordneten Cache zu veranlassen,
    die Objekte von einem Cache im lokalen Netzwerk oder direkt der Quelle herunterzuladen.


    Die Wahl der richtigen Topologie für die Cache-Hierarchie ist sehr wichtig, da
    der Netzwerkverkehr insgesamt nicht erhöht werden soll. In einem sehr großen Netzwerk
    z. B. ist es möglich, für jedes Subnetz einen Proxy-Server zu verbinden, der wiederum
    an einen übergeordneten Proxy-Cache zu verbinden, der wiederum an einen ISP angeschlossen
    ist.


    Die gesamte Kommunikation wird über ICP (Internet Control Protocol) gesteuert,
    das dem UDP-Protokoll entspricht. Der Datenaustausch Cache mittels HTTP (Hyper
    Text Transmission Protocol) basiert auf TCP. Allerdings sollten für solche Verbindungen
    einfache und kleine Protokolle verwendet werden, die innerhalb von maximal einer
    oder zwei Sekunden auf eingehende Anfragen reagieren.


    Um den Server für die gewünschten Objekte zu finden, sucht ein Cache an alle Proxies
    der gleichen Hierarchie. Die Proxies werden mittels ICP-Antworten mit dem Cache,
    „HIT“ auf Anfragen reagieren, falls das Objekt gefunden wurde oder nicht, mit
    „MISS“. Im Fall mehrer HTTP-Antworten wird der Proxy-Server einen für das Herladen
    bestimmen. Diese Entscheidung wird unter anderem dadurch bestimmt, welcher Cache
    die schnellste Antwort sendet oder welcher näher ist. Bei einer dem nicht zufriedenstellenden
    Antwort gesendet wurde, wird die Anfrage an den übergeordneten Cache geschickt.'
- md: '

    ## B.3 Systemanforderungen


    > Tipp

    > Zur Vermeidung von mehrfacher Speicherung von Objekten in verschiedenen Caches
    unseres Netzwerks werden andere ICP-Protokolle verwendet, wie z.B. CARP; das Cache
    Routing Protocol (engl. Hyper-Text Cache Protocol). Mehr Objekte im Netzwerk befinden
    sich, desto leichter wird es, das wir Gesuchte zu finden.


    ![](img/594883f46b5a0951172f1e794f42a4a5_138_0.png)


    ## B.2.3 Zwischenspeichern von Internetobjekten


    Nicht alle verfügbaren Objekte sind statisch. Es existieren viele dynamisch generierte
    CGI-Seiten. Zugriffszahlen oder verschlüsselte SSL-Dokumente für einen hohen Grund
    werden solche Objekte nicht im Cache gehalten: Bei jedem Zugriff hat sich das
    Objekt bereits geändert.


    Für alle im Cache befindlichen Objekte stellt sich jedoch die Frage, wie lange
    sie dort bleiben sollen. Für diese Entscheidung werden alle Objekte im Cache verschiedene
    verarbeitet.


    - 1. FRESH: Wenn dieses Objekt angefordert wird, wird es gesendet, ohne dass ein
    Vergleich mit dem Originalobjekt im Web stattfindet.

    - 2. NORMAL: Der Server, der das Objekt ursprünglich stammt, wird darauf überprüft,
    ob sich das Objekt geändert hat. Falls dies der Fall ist, wird die Kopie im Cache
    aktualisiert.

    - 3. STALE: Das Objekt wird als veraltet angesehen und neu vom Server heruntergeladen.


    Durch Header „Last modified“ (zuletzt geändert) oder „Expires“ (läuft) und dem
    entsprechenden Datum informieren sich Web- und Proxy-Server über den Status eines
    Objekts. Es werden auch Header verwendet, um z. B. anzuzeigen, ob ein Objekt nicht
    zwischengesichert werden muss.


    Objekte im Cache werden normalweise durch fehlenden Speichers ersetzt und zwar
    durch Algorithmen wie LRU (engl. Last Recently Used), die das Ersetzen von Cache-Objekten
    entwickelt wurden. Das Prinzip besteht darin, Wesentlichen, am am wenigsten gewünschten
    Objekte zu ersetzen.


    ## B.3 Systemanforderungen


    Zuerst sollte die maximale Systemlast bestimmt werden. Es ist wichtig, den Systemspitzen
    besondere Aufmerksamkeit zu schenken, die mehr als viermal so hoch wie der Tagesdurchschnitt
    sein können. Im Zweifalls ist es besser, die Systemanforderungen zu übersätzen,
    vorausgesetzt, dass ein Limit arbeitender Squid zu einem ernstenhaften Qualitätsverlust
    des Dienstes führen kann.


    Geordnet nach Wichtigkeit werden in den folgenden Abschnitten die verschiedenen
    Systemfaktoren aufgezeigt.


    ### B.3.1 Festplatte


    Für das Zwischenspeichern spielt Geschwindigkeit eine hohe Rolle. Man sollte sich
    um diesen Faktor besonders kümmern. Festplatten sind diesermaßen als „zufällige
    Positionierungszeit“ in Millisekunden beschrieben. Was Faustregel gilt: je weniger
    Wert, desto besser. Für eine hohe Geschwindigkeit empfiehlt sich, schnelle Festplatten
    zu wählen.


    Nach dem Squid-Benutzer-Guide (http://www.squid-cache.org) ist bei Systemen mit
    nur einer Festplatte die Formel für die Berechnung der Anzahl von Anfragen pro
    Sekunde der Positionierung der Festplatte einfach:


    Anfragen pro Sekunde = 1000 / Positionierung


    Squid erlaubt die gleichzeitige Verwendung von mehreren Festplatten und eine höhere
    Anzahl von Anfragen pro Sekunde. Hat man z. B. drei Festplatten mit der gleichen
    Positionierungszeit von 12 Millisekunden, ergibt sich unter Verwendung der vorherigen
    Formel folgende:


    Anfragen pro Sekunde = 1000 / (Positionierung / Anzahl der Festplatten)

    1000 / (12/3) = 250 Anfragen pro Sekunde


    Im Vergleich zum Einsatz von IDE-Festplatten sind SCSI-Festplatten zu bevorzugen.
    Allerdings haben neue IDE-Festplatten ähnliche Positionierungszeiten wie SCSI
    und sind mit DMA-kompatiblen IDE-Controllern eine Geschwindigkeit für den Datentransfer
    ohne die Systemlast beträchtlich zu.


    #### # Größe des Festplatten-Cache


    In einem kleinen Cache ist die Wahrscheinlichkeit HIT (das gewünschte Objekt befindet
    sich dort) sehr gering, dass der Cache schnell genug wird. In diesem Fall werden
    selten die gewünschten Objekte nur ersetzt. Steht jedoch 1 GB für den Cache zur
    Verfügung und der Benutzer benötigt 10 MB pro Tag zum Surfen, dann dauert es als
    hundert Tage, bis der Cache voll ist.


    Am besten lässt sich die Größe des Cache durch die maximale Übertragungsrate der
    Verbindung bestimmen. Mit einer Verbindung von 1 MB/Sek wird die maximale Übertragungsrate
    bei 125 KB/Sek liegen. Der gesamte Datenverkehr kommt innerhalb einer Stunde 450
    MB zu. Wenn man nun annimmt, dass der gesamte Datenverkehr lediglich während Arbeitsstunden
    erreicht, erreicht er innerhalb eines Tages, 6 GB. Da die Verbindung nicht bis
    zu ihrer Kapazitätsgrenze ausgeschöpft wurde, konnten wir davon ausgehen, dass
    die gesamte Datenmenge der Cache reicht.


    ## B.4 Squid starten


