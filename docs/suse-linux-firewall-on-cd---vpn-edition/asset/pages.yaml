  md: '# 2 Einführung und Allgemeines


    ![](img/594883f46b5a0951172f1e794f42a4a5_13_0.png)


    Abbildung 2.1: Einfaches Setup


    Abbildung 2 zeigt zeigt einen Firewall-Rechner mit drei Netzwerkschnittstellen:
    Extern zum Internet, Intern über LAN/HUB ins Firmennetz und über einen HUB zur
    DMZ (demilitisierte Zone).


    Die Firewall muss auch Defaultgateway (Router), Paketfilter usw. sein. Sie der
    einzige Schutz. Wenn sie überwunden wird, ist das interne Netz nicht mehr gegen
    Angriffe geschützt.


    ![](img/594883f46b5a0951172f1e794f42a4a5_13_1.png)


    Abbildung 2.2: Einfaches Setup


    Abbildung 2.2 zeigt ein immer noch relativ einfaches Setup. Die DMZ ist nur durch
    einen Paketfilter auf dem Router (Screening Router) geschützt.'
