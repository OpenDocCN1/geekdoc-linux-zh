  md: '# C.2 Sicherheit vs Vertrauensache


    ma erfahren Sie direkt aus der Datei /etc/permissions und der Manpage des Kommandos
    chmod (man chmod).


    # file race


    Ein Programm will eine Datei in einem Verzeichnis anlegen, welches für jeden schreibbar
    ist (wie /tmp). Es überprüft, ob die Datei bereits existiert und erzeugt die Datei,
    wenn sie nicht vorhanden war. Zwischen dem Über der Existenz und dem Anlegen der
    Datei gibt es eine Zeit, in der ein Angreifer einen symbolischen Link anlegen
    kann, der Zeiger auf eine andere Datei. Das Programm folgt diesem symbolischen
    Link und schreibt die Zieldatei mit Privilegien. Dies ist ein Rennen (race), wenn
    der Angreifer eine kurze Zeit bleibt, in der den „link“ anlegen kann. Dies ist
    nicht möglich, da der Vorgang von Über und Anlegen einer Datei nicht atomisch,
    sondern unteilbar ist. Das Rennen stattfinden, kann es von einem Angreifer gewonnen
    werden, das ist eine Frage der Wahrscheinlichkeit.


    # Buffer overflows, format string bugs


    Wenn ein Programm Daten verarbeitet, die in beliebiger Länge eines Benutzers stehen
    oder, sind besondere Vorsicht geboten. Diese Vorsicht gilt im Hauptsächlich für
    den Programmierer der Anwendung: Er muss sicherstellen, dass die Daten zu jedem
    Zeitpunkt in Speicherbereiche geschrieben werden, die eigentlich klein sind des
    Users und dass die Daten in konsistenter Art und Weise durch seinen Programm und
    die dafür definierten Schnittstellen weiterhin reicht.


    Ein, „Buffer Overflow“ passiert, wenn beim Beschreiben eines Pufferspeichers nicht
    ausreichend wird, wie der Puffer groß ist. Es könnte sein, dass die Daten (vom
    Benutzer) mehr Platz verlangen, als im Puffer zur Verfügung steht. Durch Überschreiben
    des Puffers über seine Grenze hinaus ist unter Umständen möglich, dass ein Programm
    umfangen der Daten, die er eigentlich nur verarbeiten soll, Programmsequenzen
    ausführen, die dem Einfluss des Users und nicht des Programmierers stehen. Dies
    ist ein schwerer Fehler, insbesondere wenn das Programm mit besonderen Rech abläuft
    (siehe Abschnitt C.2.2 der vorherigen Seite). „Format String Bugs“ funktionieren
    ebenfalls anders, werden aber wieder user-input, um das Programm von seinem eigenen
    Fehler abzugrenzen.


    Diese Programmierfehler werden normalerweise in Programmen ausgebautet (engl.
    exploit), die mit gehobenen Privilegien aufgeführt werden, also setuid- und setgid-Programme.
    Sie können sich und Ihr System vor solchen Fehler Ausführungsrechte von den Programmen
    entfernen. Auch hier hilft wieder das Prinzip der geringstmöglichen Privilegien
    (siehe Abschnitt C.2.2 der vorherigen Seite).


    Da, „Buffer Overflows“ und „Format String Bugs“ Fehler bei der Behandlung von
    Benutzerdaten sind, sind sie nicht notwendigerweise ausbeutar, wenn'
