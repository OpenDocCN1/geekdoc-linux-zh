  md: '# 5.4 Die Konfigurationsdiskette


    Auf der Konfigurationsdiskette ist die komplette Systemkonfiguration und die Konfiguration
    der Applications-Level-Gateways enthalten.


    Die Konfigurationsdiskette muss mit einem ext2-Dateystem versehen werden und mit
    folgendem Label das "SuSE-FWFloppy" erhalten:


    Legen Sie eine mit ext2-Dateystem formatierte Diskette ein.


    ```

    /bin/e2label/dev/fd0SuSE-FWFloppy

    ```


    Ohne dieses Label wird die Konfigurationsdiskette nicht erkannt. Das FAS (Firewall
    Administration System) auf dem SuSE Linux Adminhost beim Bootens erzeugt das Dateystem
    und das Label automatisch.


    Die Konfigurationsdiskette wird während des Bootens der Live-CD eingebunden.


    # 5.4.1 Erstellen der Konfigurationsdiskette


    Die Konfigurationsdiskette lässt sich auf dem SuSE Linux Firewall Adminhost mit
    der Administrations-Oberfläche erzeugen. Das FAS auf dem SuSE Linux Adminhost
    erzeugt ein tar-archiv, das dann entpackt wird. Das ist die empfehlene Methode.
    Die Konfigurationsdateien mit einem Editor zu bearbeiten ist nur für Experten
    ratsam, die wirklich wissen was sie tun. Es gibt hierfür keinen Support.


    # 5.4.2 Die Konfigurationsdateien


    Die folgende Übersicht bietet die Konfigurationsdateien, die sich auf der Diskette
    befinden, und dient Ihrer Information; die werden mit der Admin-Oberfläche erstellt:


    ```

    /etc/hosts (vgl. man hosts)

    /etc/hosts.allow (vgl. man 5 hosts_access)

    /etc/hosts.deny (vgl. man 5 hosts_access)

    /etc/inittab (man inittab)

    /etc/isdn/

    /etc/cpe/

    /etc/live-setup.conf

    /etc/passwd

    /etc/ppp/

    /etc/localtime

    /etc/modules.boot

    ```


    In der Datei /etc/modules.boot können Sie ladbare Kernelmodule angeben, die beim
    Systemstart geladen werden. Sie werden mit dem relativen Pfadnamen von Verzeichnis
    /lib/modules/<Kernelversion> angegeben. Falls nötig, können Sie auch Optionen
    an das Modul einbauen, wie z. B. IRQ oder IO-Adresse der verwendeten Hardware.
    Zeilen mit "#" beginnen, werden ignoriert. Stellt das Modulnamen einen "-" voran,
    so wird'
