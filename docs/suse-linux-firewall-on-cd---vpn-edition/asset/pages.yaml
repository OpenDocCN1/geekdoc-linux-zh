  md: '# 6 Inbetriebnahme der Firewall


    Voraussetzungen für die erfolgreiche Inbetriebnahme:


    Sie haben eine Konfiguration für die SuSE Linux Live-CD für Firewall mit dem SuSE
    Linux Adminhost für Firewall bzw. eine Konfigurationsdiskette von Hand erstellt.
    Jetzt wird der Firewall-Rechner in mehreren Schritten in Betrieb genommen. Zunächst
    überprüfen Sie, ob Ihr Rechner mit der bereits erstellten Konfiguration geboot
    und die ausgewählten Dateien alle starten und verfügbar sind. Anschließend kontrollieren
    Sie, ob der IP-Filter des Kernels der Konfiguration gemäß arbeitet.


    # 6.1 Booten des Firewall-Rechn


    +   1. Starten Sie den Rechner und öffnen Sie das BIOS-Setup-Programm. Überprüfen
    Sie Uhrzeit und Datum.


    +   2. Stellen Sie die Bootsequenz ein, dass der Rechner zuerst von CD bootet
    – falls nur möglich von CD.


    +   3. Vergeben Sie unbedingt ein BIOS-Passwort. Das verhindert, dass die Boot-Sequenz
    geändert und der Firewall-Rechner von Diskette gebootet wird.


    +   4. Speichern Sie die BIOS-Konfiguration ab.


    +   5. Legen Sie die SuSE Linux Live-CD für Firewall ein.


    +   6. Legen Sie die Konfigurations-Diskette ein.


    +   7. Booten Sie den Rechner neu.


    +   8. Achten Sie beim Booten auf Fehlermeldungen und überarbeiten Sie eventuell
    die entsprechenden Konfigurationsdateien. (Meldung: "<xyz> failed/skipped>“, liegt
    ein Fehler in der zugehörigen Konfigurationsdatei für den <xyz>. In diesem Fall
    speichern Sie die Konfigurations-Diskette mit dem FAS-Tool auf dem Adminhost neu,
    bearbeiten die dort abgespeicherte Konfiguration und speichern diese auf der Konfigurationsdiskette
    erneut.


    Die Konfiguration der Festplatte haben bereits mit FAS festgelegt. Wenn allerdings
    die Partitionen 1 (swap) und 2 (var) des Firewall-Rechners nicht mit den Angaben
    in der Datei /etc/live-setup.conf übereinstimmen, erscheint eine Dialog-Maske
    wie in Abb. 6.1 auf nächsten Seite. Wenn Sie die Platte neu einrichten möchten,
    antworten Sie mit ''yes''.'
