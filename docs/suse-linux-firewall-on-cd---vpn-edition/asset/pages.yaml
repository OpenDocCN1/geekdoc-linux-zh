  md: '# A DNS – Domain Name Service


    DNS (engl. Domain Name Service) wird benötigt, um die Domain- und Rechernamen
    in IP-Adressen aufzulösen.


    # A.1 Nameserver BIND starten


    Der Nameserver BIND8, der gilt auch für die neue Version BIND9, ist auf SuSE Linux
    bereits vorkonfiguriert, dass man ihn problemlos nach der Installation sofort
    starten kann.


    Hat man eine funktionsfähige Internetverbindung und trägt in /etc/resol.conf als
    Nameserver 127.0.0.1 für localhost ein, hat man in der Regel schon eine funktionierende
    Namensauflösung, ohne dass man den DNS Providers kennt. BIND führt die Namensauflösung
    über die Root-Nameserver, was aber wesentlich langsamer ist. Normalerweise sollte
    man den DNS Providers mit in der Konfigurationsdatei /etc/named.conf unter forwarders
    eintragen, um eine effektive und sichere Namensaufösung zu erhalten. Fungioniert
    das, läuft der Nameserver als C. Wer seine eigene Domain bereitstellt, wird ein
    richtiger DNS benötigt. Ein Beispiel dafür findet man im Dokumentverzeichnis:
    /usr/share/doc/packages/bind8/sample-config.


    Man sollte lediglich offizielle Domain aufsetzen, solange man diese nicht kommen
    muss. Wenn man eine eigene Domain hat, diese aber von Provider verwaltet wird,
    sollte diese nicht verwenden, da BIND sonst Anfragen für diese Domain weiterführen
    würde oder z. B. der Webserver für die eigene Domain nicht mehr erreichbar wäre.


    Um den Nameserver zu starten nutzt man den Kommando (als root) rnamed start


    ein. erscheint rechts in grün „done“, der ist named, heißt der Nameserver-Prozess,
    erfolgreich startet. Auf dem lokalen System kann man die Funktionalität des Nameservers
    sofort testen, indem man das Programm nslookup verwendet. Der DNS Server muss
    localhost mit der Adresse 127.0.0.1 angezeigt werden. Sollte dies der Fall sein,
    ist sehr wahrscheinlich in der /etc/resol.conf ein falscher Nameserver oder diese
    Datei existiert gar. Für einen ersten Test gibt man auf dem Prompt von nslookup
    „127.0.0.1“ ein, das sollte ihn funktionieren; erhält man stattdessen eine Fehlermeldung
    „No response from server“ oder ähnlich, sollte man mit folgend Kommando überprüfen,
    ob der named überhaupt läuft rnamed status'
  merge: -1
  pgno: 122
- img_proc: true
  md: "# DNS – Domain Name Service\n\nFalls der Nameserver nicht startet oder ein\
    \ fehlerhaftes Verhalten findet, wird die Ursache in den meisten Fällen in `/var/log/messages`\
    \ protokliert.\nHat man eine Wahlverbindung, muss man beachten, dass BIND8 beim\
    \ Start den Root-Nameserver überprüfen. Gelingt dies nicht, weil keine Internetverbindung\
    \ zustande kommt, kann dazu führen, dass überhaupt keine DNS-Anfragen außer für\
    \ lokal definierte Zonen aufgelöst werden können. BIND9 hält sich dadurch anders,\
    \ benötigt ein Mehrfaches an Ressourcen im Vergleich zu BIND8.\nUm den Nameserver\
    \ des Providers, oder einen eigenen, den man im eigenen Netz hat, als `forwarder`\
    \ zu verwenden, muss man diesen oder auch mehrere, im Abschnitt `options` unter\
    \ `forwarders` ein; vgl. Beispiel A.1.1.\n\n```\noptions {\n  directory \"var/named\"\
    ;\n  forwarders { 10.11.12.13; 10.11.12.14; };\n  listen-on { 127.0.0.1; 192.168.0.9;\
    \ };\n  allow-query { 127/8; 192.168.0.24; };\n  notify no;\n};\n```\n\nA.1.1:\
    \ Forwarding-Optionen in named.conf\nDie im verwendeten IP-Adressen sind willkürlich\
    \ gewählt und müssen entsprechend den jeweiligen Gegebenheiten eingetragen werden.\n\
    Nach den Optionen dürfen die Einträge für die Zone, die für `localhost`, `...0.127.in-addr.arpa`,\
    \ sowie ... vom `type hint` sollten mindestens immer vorhanden sein. Die zugehörigen\
    \ Dateien müssen nicht veraltet sein, damit sie funktionieren können. Man muss\
    \ darauf achten, dass nach jedem Eintrag ein `;` steht und die geschlossenen Klammern\
    \ korrekt gesetzt sind. Hat man Änderungen an der Konfigurationsdatei `/etc/named.conf`\
    \ oder den Zonen-Dateien vorgenommen, muss BIND diese neu einzulesen. Das gelingt\
    \ mit dem Kommando `rnd reload`. Alternativ kann man den Nameserver neu starten,\
    \ dann durch den Befehl `rndnamed restart`. Fehlt nach dem Kommando, um den Nameserver\
    \ zu beenden, muss man in `/etc/rc.config` lediglich den Eintrag START_NAME=no\
    \ auf START_NAME=\n\n# A.2 Die Konfigurationsdatei /etc/named.conf\n\nAlle Einstellungen\
    \ zum Nameserver BIND9 sind in der Datei `/etc/named.conf` vorzunehmen. Die Zonendatien\
    \ selbst, die Rechnernamen, IP-Adressen für die zu verwenden Domains, die in separaten\
    \ Dateien im Verzeichnis `/var/named` abzulegen, befinden unter einem.\nDie `/etc/named.conf`\
    \ unterteilt sich in zwei Bereiche, bei denen der Abschnitt `options` für allgemeine\
    \ Einstellungen und zum anderen die zone-Einträge für die einzelnen Domains. Außerdem\
    \ kann man noch einen Bereich"
  merge: -1
  pgno: 123
- img_proc: true
  md: "# A.2 Die Konfigurationsdatei\n/etc/named.conf\n\nlogging, sowie Einträge vom\
    \ Typ acl definieren. Kommentarteile beginnen\nmit einem '#'-Zeichen, alternativ\
    \ wird // erlaubt.\nEine minimalistische /etc/named.conf stellt Beispiel A.2.1\
    \ dar.\n\n```\noptions {\n  directory \"/var/named\";n  forwarders { 10.0.0.1;\
    \ };\n  notify no;\n}\n\nzone \"localhost\" {\n  type master;\n  file \"localhost.zone\"\
    ;\n}\n\nzone \"0.0.127.in-addr.arpa\" {\n  type master;\n  file \"127.0.0.zone\"\
    ;\n}\n\nzone \".\" {\n  type hint;\n  file \"root.hint\";\n}\n```\n\nDatei A.2.1:\
    \ Minimalistische Datei /etc/named.conf\n\nDieses Beispiel funktioniert für Bind8\
    \ und Bind9 gleichermaßen, keine spezi-ellen Optionen verwendet werden, die nur\
    \ von einer Version verstanden werden.\nBind-9.1.1 aktiviert alle Bind-Konfigurationen\
    \ und vermerkt beim\nStart, wenn eine Option nicht implementiert ist. Spezielle\
    \ Bind9-Optionen wer- vom Bind aber nicht unterstützt.\n\n# A.2.1 Die wichtigsten\
    \ Konfigurationsoptionen im Abschnitt\noptions\n\ndirectory \"/var/named\"; gibt\
    \ das Verzeichnis, in dem der BIND die Dateien\nmit den Zonendaten findet,\nforwarders\
    \ { 10.0.0.1; }; wird verwendet, um den Nameserver (meist\n des Providers) anzuzeigen,\
    \ an den oder dies die DNS-Anfragen weitergereicht\nwerden, die nicht direkt beantwortet\
    \ werden können.\n\nforward first; bewirkt, dass die DNS-Anfragen zu erst geordert\
    \ werden,\nbevor sie über die Root-Nameserver aufgelöst werden. Anstelle\n von\
    \ forward first kann man auch forward only schreiben, dass werden\nden alle Anfragen\
    \ weitergeleitet werden und der Root-Nameserver werden nicht\nmehr angesprochen.\
    \ Das kann für Firewall-Konfigurationen sinnvoll sein."
  merge: -1
  pgno: 124
