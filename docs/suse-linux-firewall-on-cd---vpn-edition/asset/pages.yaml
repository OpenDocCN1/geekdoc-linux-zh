    # TRACEROUTE


    Wer möchte, dass traceroute und ähnliche Programme funktionieren, muss

    ggendes konfigurieren:

    FW_ALLOW_TRACEROUTE=yes (ganz am Ende der Experten-Konfig)

    FW_ALLOW_PING=yes

    FW_ALLOW_INCOMING_HIGPORTS_UDP=yes


    Wenn Sie nie diese Einstellungen vornehmen und SuSE-Firewall verwenden, ist

    Ihr System nach irgendwas für sicher!

    Um die Sicherheit Ihrer unsichere Netze (z.B. das Internet) minimieren, nur als

    sicher geltende Programme verwenden (z.B. postfix, ssh etc.) und diese

    sorgfältig konfigurieren. Zudem müssen Sie darauf achten, dass diese Pro\gramme
    wirklich keine Sicherheitslücken aufweisen. Alle Dienste sollten

    möglichst NICHT unter ''root'' aufgeführt werden und außerdem in einem

    ''chroot''-Umfeld laufen.


    +   * Vertrauen Sie keiner Software, die Sie nicht selbst erstellt haben.

    * Prüfen Sie regelmäßig die Integrität des Servers.

    * Wenn Sie, was nicht empfehlenswert ist, den Firewall/Bastion-Server als

    Masquerading- oder Routing-Server verwenden wollen, sollten Sie prüfen,

    ob nicht Proxy-Server genutzt werden, z.B. Squid für das

    WWW, smtp für Mail etc. Denken Sie hierbei auch auf ''chroot'' und

    lassen Sie die Prozesse unter ''root'' laufen. Stellen Sie das Routing

    auf dieser Maschine ab.


    Im Folgenden finden Sie Erklärungen zur Konfigurationsdatei des SuSE-Firewall-

    Scripts/:etc/rc.config.d/firewall.rc.config.

    Wie bereits beschrieben, müssen Sie diese Datei nicht von Hand erstellen. Be-

    utzen Sie das Firewall Administrations-System auf dem SuSE Firewall Admin-

    host. Falls Sie jedoch diese Datei für Ihre Zwecke editieren, lesen Sie unbedingt

    die Dokumentation des Firewall-Skripts und überprüfen Sie Ihr Skript genau-

    stors, bevor Sie es einsetzen. Für eine selbst erstellte Konfiguration kann keine\Gewährleistung
    und kein Support in Anspruch genommen werden.


    > Hinweis

    Die Konfiguration dieser Einstellungen und die Benutzung des SuSE-Firewall-Skript
    allein macht Ihr System nicht von Haus aus sicher. Es

    gibt NICHT, was einfach installieren lässt und vor allen Sicherheits-heitslücken
    schützt.


