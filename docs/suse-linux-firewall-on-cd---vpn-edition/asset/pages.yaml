    ```

    http://sdb.suse.de

    ```


    # 7.1.2 Probleme beim Booten der Live-CD


    Um die Fehlersuche zu vereinfachen, sollten Sie Folgendes beachtenachten und notieren:


    +   * Was passiert beim Booten?

    * Werden Dienste nicht gestartet, die konfiguriert wurden (skipped/failed Meldungen)?

    * Gibt es Fehlermeldungen auf der Konsole?

    * Gibt es auf dem tty9/tty12 Fehlermeldungen des Kernels? Um diese Meldungen zu
    sehen, wechseln Sie mit Alt + F9 bzw. Alt + F12 auf die entsprechende Konsole.'
