    das Ausführen von Programen mit uid=0 (d. h. als ''root'') ermöglicht.


    /etc/syslog.conf Konfiguration des Syslog-Daemons. Lesen Sie hierzu den Man-Pages:
    man 5 syslog.conf, man 8 syslog und man 3 syslog.

    In dieser Datei werden für alle Dienste, die in der Umgebung gestartet werden,
    muss dabei ein Socket anlegen, auf den der schreibt. Der Eintrag sieht wie folgt
    aus:

    *.* @hostname.domain.tl (oder die IP-Adresse)


