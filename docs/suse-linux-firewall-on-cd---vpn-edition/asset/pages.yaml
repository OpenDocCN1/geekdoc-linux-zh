    Erst wenn alleliche Tests erfolgreich verlaufen sind, können Sie die Firewall
    in Betrieb nehmen. Bitte dokumentieren Sie alle von Ihnen durchgeführten Tests.


    # 6.3 Inbetriebnahme


    Um Ihre SUSE Firewall in Betrieb zu nehmen, verbinden Sie zunächst das interne
    Netz mit der Firewall und stellen Sie z. B. einen Laptop als externes Netz testweise
    bereit. Anschließend trennen Sie die Verbindung zum internen Netz und die Verbindung
    zum Internet. Testen Sie wenn möglich Ihre Firewall von extern. Kontrollieren
    Sie Ihr Setup.


    # 6.3.1 Test von innen


    Tests, die Sie durchführen sollen:'
