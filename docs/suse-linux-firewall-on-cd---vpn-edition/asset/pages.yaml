  md: '# Hilfestellungen


    Probleme bei der Einbindung in das Netzwerk:


    Beobachten und notieren Sie, welche Art die Probleme sind. Testen Sie sich spielweise
    auf der Firewall (melden Sie sich als Benutzer ''root'' auf der Firewall), ob
    das Netzwerk-Interfaces konfiguriert sind:


    ```

    root@firewall # ifconfig

    ```


    Dieser Befehl zeigt Ihnen, welche Interfaces konfiguriert sind und welche IP-Adressen,
    Netzwerkmasken eingestellt sind. Falls notwendig korrigieren Sie die Konfiguration
    mit FAS und erstellen eine neue Konfigurationsdatei. Damit die neue Konfiguration
    verwendet wird, muss der Rechner neu gestartet werden.


    +   * Welche Dienste funktionieren von der Client-Seite (Intranet) aus? Sollen
    sie funktionieren? Anhand der Logfiles können Sie feststellen, ob es um unberechtigte
    Zugriffe handelt.

    Versuchen Sie Fehler zu reproduzieren.

    * Funktionieren Zugriffe auf freigegebene Ressourcen? Welche Dienste sind betroffen?
    Soll die Ressource wirklich freigeben?

    Testen Sie z. B. mit ps, ob der Prozess vorhanden ist, d. h. auch zur Verfügung
    steht. Welche Dienst stehen zur Verfügung, kontrollieren Sie Ihre Logfiles. Hier
    finden sich Meldungen, warum ein Dienst gestartet wurde, oder ob versucht wurde,
    ein Dienst unberechtigterweise in Anspruch zu nehmen.

    Testen Sie von verschiedenen Clients, ob der Firewall-Rechner erreichbar ist und
    die Proxies ansprechbar sind.


    # 7.2 Security-Policy und Kommunikationsanalyse


    Für die sichere Anbindung eines internen Netzwerks an das Internet oder ein anderes
    „unsicheres“ Netzwerk sind im Vorfeld einige Dinge abzuklären. Dazu gehört die
    Er der Security-Policy für das eigene Netzwerk und der Kommunikationsanalyse.


    # 7.2.1 Die Security Policy


    Die Security-Policy stellt die Grundlage für den Umgang mit allen Programmen,
    Rechnern und Daten dar. Weiterhin wird festgelegt, welche Überwachung der Sicherheitsrichtlinien
    gewährleistet werden und welche Verstöße (von intern/extern) behandelt werden.
    Um eine Security-Policy zu erstellen, fertigt man am besten eine Kommunikationsanalyse
    an. Hierbei sind sich folgende Themen von großer Wichtigkeit:


    +   * Zum einen es gilt, den Schutzbedarf zu analysieren. Was muss geschützt werden?'
  merge: -1
  pgno: 109
- img_proc: true
  md: '+   Gibt es Bereiche im Intranet, die besonders schützenswerte Daten beinhalten
    (z. B. Personal-Abteilung, firmenkritische Daten etc.). Wie liegen diese Daten?


    +   Wer darf Zugriff auf die Daten haben? Gibt es abgestufte Zugangsberechtigungen?


    +   Sollen Dienste intern zur Verfügung stehen? Welche von intern nach extern
    (E-Mail, Surfen, Datentransfer) und welche von extern nach intern (E-Mail, Webdienste,
    Datentransfer)?


    Die Liste der klärenden Fragen für eine Security-Policy muss individuell erstellt
    und beantwortet werden.


    # 7.2.2 Kommunikationsanalyse


    Die wichtigste Hilfestellung für die Durchführung einer Kommunikationsanalyse
    ist eine Kommunikations-Matrix.

    Hier wird in Tabellenform dargestellt, welche Dienste für welchen Client-Rechner
    bzw. Nutzer zur Verfügung gestellt werden. Diese Matrix wird dann auf die Proxies/IP-Filter-Regeln
    abgebildet.


    Erstellen eine Kommunikations-Matrix:


    Fertigen Sie sich eine Liste aller Clients/Server Ihres Netzwerks an. Legen Sie
    dann fest, welche Protokolle von welchem Client verwendet werden dürfen. Definieren
    Sie außerdem, in welche Richtung die jeweiligen Pakete gesendet bzw. empfangen
    werden dürfen.


    Ein Beispiel für das HTTP-Protokoll: Der Client host1 soll einen Webserver im
    internen Netz erreichen, aber keine Verbindung zu einem externen Webserver herstellen
    können. Der Eintrag in die Kommunikations-Matrix sieht dann für das HTTP-Protokoll
    wie im unten aufgeführten Beispiel aus.


    Beispiel für eine Kommunikations-Matrix:


    | Client | icmp | ftp | ssh | smtp | http | https | ... |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | intern | extern | i. | e. | i. | e. | i. | e. | | |

    | host1 | X | | | X | X | X | | |

    | host2 | X | | | X | X | | | |

    | host3 | | | | | | | | | |

    | hostn | | | | | | | | |


    Anhand einer Kommunikations-Matrix behalten Sie den Überblick über die Kommunikationsbeziehungen
    innerhalb des Netzwerks. Dies erleichtert Ihnen nicht die Konfiguration Ihres
    Netzwerks sondern gegebenenfalls die Fehleranalyse.'
