- img_proc: true
  md: '# B.5 Die Konfigurationsdatei

    /etc/squid.conf


    erforderlich, der Zugriff von externen Clients ist jedoch einmal gesperrt.

    Für localhost wird Proxy freigegeben und Port wird standardmäßig 3128 verwendet.
    Die Optionen sind ausreichend mit vielen Bildern in der installierten /etc/squid.conf
    dokumentiert. Annähernd alle Einträge im Zeilenfang sind kommentiert und immer
    am Ende der zuhörigen Beschreibung finden. Die angegebenen Werte entsprechen deinen
    eingestellten Werten, sodass das Erfassen des Kommentarzeichens, ohne die Option
    zu ändern, nur auf wenige Wirkung hat. Best ist, wie das Beispiel zu stehlen und
    die Option mit dem geänderten Parameter in der Zeile später neu einzufügen. So
    kann man die voreingestellten Werte und ohne großes Squid-Version durchgeführt
    problemlos nachvollziehen.


    Hat ein Update von einer älteren Version wurde, ist es unbedingt zu empfehlen,
    die neue /etc/squid.conf zu verwenden und nur die Änderungen der ursprünglichen
    Datei zu übernehmen. Versuch man die squid.conf weiter zu verwenden, läuft man
    Gefahr, dass die Konfiguration nicht mehr funktioniert, da Optionen immer wieder
    geändert werden und neue hinzuzukommen.


    # Allgemeine Konfigurations-Optionen


    http_port 3128 ist der Port, dem Squid auf Anfragen der Clients lauscht. Voreinstellung
    ist 3128, gebräuchlich auch 8080. Es ist möglich, hier mehrere Portnummern, durch
    Leerzeichen getrennt, anzunehmen.


    cache_peer <hostname> <type> proxy-port <icp-port> wird der Proxy als "parent"
    eingegeben, z. B. wenn man den Providers nutzt oder mehr. Als <hostname> trägt
    den Namen bzw. die IP-Adresse des zu verwendenden Proxies und <type> parent ein.
    Für <proxy-port> trägt man die Portnummer ein, die der Proxy bei Verwendung im
    Browser benötigt, meist 8080. Der <icp-port> kann man auf 7 oder 8 setzen, wenn
    man den ICP-Port nicht kennt und die Nutzung mit diesem Proxy nicht vereinbar
    ist.


    Zusätzlich soll man nach default und no-query nach der Portnummer angeben, um
    die Verwendung des ICP-Protokolls ganz zu unterbinden. Squid verhält sich gegenüber
    dem Proxy der Providers wie normaler Browser.


    cache_mem 8 MB. Dieser Eintrag gibt ein, wie viel Speicher von Squid für das Cache
    maximal verwendet wird. Voreinstellung ist 8 MB.


    cache_dir /var/squid/cache 100 26 Der Eintrag cache_dir gibt das Verzeichnis an,
    in dem alle Objekte auf Platte abgelegt werden. Die Anzahl der Verzeichnisse gegen
    den zu verwendenden Plattenplatz in MB und die Anzahl der Dateien muss angepasst
    werden. Voreinstellung ist 100 MB Plattenplatz im Verzeichnis/var/squid/cache
    zu belegen und darin 16 Unterverzeichnisse anzulegen, welche wiederum 256 Verzeichnisse
    enthalten. Die Angabe des zu verwendenden Plattenplatz sollte man genügend Reserven
    lassen, sinnvoll sind Werte zwischen 50 und maximal 80 Prozent des verfügbaren'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'Platzes. Die beiden letzten Zahlen für die Anzahl der Verzeichnisse sollte
    man nur mit Vorsicht vergrößern, da zu viele Verzeichnisse wieder auf Kosten der
    Performance gehen können. Hat man mehrere Platten, auf die die Cache verteilt
    werden soll, kann man entsprechend cache_dir-Zeilen eintragen.


    cache_access_log /var/squid/logs/access.log Pfadang für Log-Datei.


    cache_log /var/squid/logs/cache.log Pfadang für Log-Datei.


    cache_store_log /var/squid/logs/store.log Pfadang für Log-Datei.

    Diese Einträge geben den Pfad zur Protokollatei von Squid an. Normalerweise wird
    man daran nichts ändern. Wird Squid stark beansprucht, kann es sinnvoll sein,
    den Cache und Squid auf verschiedene Platten zu legen.


    emulate_httpd_logändert diesen Eintrag auf, wenn man mehrere Log-Dateien. Allerdings
    kommen manche Auswertungprogramme damit zurecht.


    client_netmask 255.255.255.255 Mit diesem Eintrag kann man protokollierten IP-Adressen
    in den Log-Dateien maskieren, um die Identität des Clients zu verbergen. Trägt
    man bei 255.255.255.0 ein, wird die letzte Stelle der IP-Adresse auf Null gesetzt.


    ftp_user Squid@ Hiermit kann man das Passwort setzen, Squid für den anonymen FTP-Log
    zu verwenden. Beim Aufruf auf den FTP-Server wird allgemein als ''anonymous''
    und als Passwort die eigene E-Mail-Adresse verwendet, die die Eingabe von Benutzamen
    und Passwort für jeden FTP-Download spart. Vorgestellt ist Squid ohne Domain,
    da die Clients aus beliebigen Domains kommen. Es kann sinnvoll sein, eine gültige
    E-Mail-Adresse in der eigenen Domain einzugeben, damit der FTP-Server auf Gültigkeit
    überprüft.


    cache_mgr webmaster Eine E-Mail-Adresse, die eine Nachricht schickt, wenn unerwartet
    abstürzt. Vorgestellt ist webmaster.


    logfile_rotate 0 Squid ist in der Lage, die gesicherten Log-Dateien aufzurufen,
    wenn man mit squid -k rotate roti. Die Dateien werden dabei, entsprechend der
    angegeben Anzahl, durchnummeriert und nach Erreichen des angegebenenen Wertes
    wird die älteste Datei dabei überschrieben. Dieser Wert ist standardmäßig auf
    0, falls das Archivieren und Löschen der Log-Dateien durch SU Linux von einem
    eigenen Cronjob durchgeführt wird, dessen Konfiguration man in der Datei /etc/logfile
    findet. Der, nachdem die Datei gelöscht wird, wird in /etc/rc.config mit dem Eintrag
    MAX_DAYS_FOR_LOG_FILES festgelegt.


    append_domain <domain> Mit append_domain kann man angeben, welche Domain zusätzlich
    angehängt wird, wenn keine eingegeben wurde. Wer nur seine eigene Domain eintibt,
    kann im Browser auf den eigenen Webserver zu gelangen.'
  merge: -1
  pgno: 143
- img_proc: true
  md: '# B.5 Die Konfigurationsdatei

    /squid.conf


    forwarded_for Setzen einen Eintrag auf off, entfernt Squid die IP-

    Adresse durch den Systemnamen des Clients aus den HTTP-Anfragen.


    negative_ttl 5 minutes; negative_dns_ttl 5 minutes Normalerweise braucht

    miese Werte nicht zu verändern. Hat man aber eine Wahlleitung, kann

    eskommen, dass das Internet zeitweise nicht erreichbar ist. Squid

    dann sich durch erfolglosen Anfragen und weigert, sich neu anzufragen,

    obwohl die Verbindung im Internet wieder steht. Für diesen Fall soll-

    te man minutes in seconds anders, führt auch ein Reload im

    Browser, wenige Sekunden nach der Einwahl, wird zum Erfolg.


    never_direct allow <acl_name> wird verhindern, dass Squid An

    aus dem Internet fordert, kann man die Verwendung eines-

    deren Proxies erzwingen. Dies muss man zuvor cache_peer ein-

    tragen haben. Git man als <acl_name> alles an, wird sämtmt-

    liche Anfragen direkt an den parent weitergegeben werden. Das kann zum

    Beispiel nötig, wenn man einen Proxy verwendet, der die Verwen-

    dung seines Proxies vorschreibt oder die Firewall keinen direkten

    Zugriff auf das Internet durchlässt.


    # Optionen zur Zugriffskontrolle


    Squid bietet ein ausgeprägtes System, um den Zugriff auf den Proxy zu steu-

    er. Durch die Verwendung von sogenannten "ACLs" ist es einfach und vielseitig

    figurierbar. Dabei handelt sich um Listen mit Regeln, die der Reihe nach

    abearbeitet werden. ACLs müssen zuerst definiert werden, bevor sie verwendet

    können. Einige Standard-ACLs wie all und localhost sind bereits\vorhanden. Das
    Festlegen einer ACL wirkt sich aber noch gar nicht. Erst

    wann sie tatsächlich eingesetzt wird, z. B. in Verbindung mit http_access,

    werden die definierten Regeln abgearbeitet.


    acl <acl_name> <type> Eine ACL benötigt vor Definition meistens

    drei Angaben. Der Name <acl_name> kann frei gewählt werden. Für <ty>

    paus man aus Vielzahl unterschiedlicher Möglichkeiten auswahl-

    , man im Abschnitt CONTROLS in der /etc/squid.conf nachlesen kann. Was für <data>
    anzuben ist, hängt vom jeweiligen Typ

    der ACL und auch aus einer Datei, z. B. mit Rechnernamen, IP-

    Adress oder URLs eingelesen werden. Folgende folgen einige Bei-

    spiele:


    ```

    acl meuresdomain srcdomain meine-domain.com

    acl lehr src 192.168.1.0/255.255.255.0

    acl students 192.168.9.0/255.255.255.0

    acl mittags time MTWF 12:00-15

    ```


    http_access allow <acl_name> Mit http_access wird festgelegt, der

    Proxy verwendet wird und was er im Internet zugreifen. Dabei sind

    ACLs anzuzeigen, localhost und sind weiter oben bereits definiert,

    mit dem deny oder allow den Zugriff sperren oder freigeben. Man kann hier eine

    Liste mit vielen http_access-Einträgen erstellen, die von oben nach unten

    abearbeitet werden; je nachdem, was sie zuerst, wird der Zugriff auf die'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'angeforderte URL freigegeben oder gesperrt. Als letzter Eintrag sollte immer
    http_access deny all stehen. Im folgenden Beispiel hat localhost, als der lokale
    Rechner, freien Zugriff auf alles, während er für alle anderen komplett gesperrt
    ist:


    ```

    http_access allow localhost

    http_access deny all

    ```


    Noch ein Beispiel, in dem die zuvor definierten ACLs verwendet werden: Die Gruppe
    ''lehrer'' hat jederzeit Zugriff auf das Internet, während die Gruppe ''studenten''
    nur Montags bis Freitag, da nur mittags, surfen darf:


    ```

    http_access deny localhost

    http_access allow lehrer

    http_access allow studenten mittags

    http_access deny all

    ```


    Die Liste mit den eigenen http_access-Einträgen sollte nach der Übersichtlichkeit
    nur an der dem vorausgeegangenen Stelle in /etc/squid konzentriert sein. Das bedeutet
    zwischen dem Text


    ```

    # INSERT OWN RULE(S) HERE TO ALLOW ACCESS FROM YOUR CLIENTS


    http_access deny all

    ```


    **redirect_program /usr/bin/squidGuard** Mit dieser Option kann man einen „re-director“,
    mit z. B. SquidGuard angeben, der in der Lage ist, URLs zu verwenden. In Verbindung
    mit Proxy-Authentifizierung und den passenden ACLs kann man den Zugriff auf das
    Internet für verschiedene Nutzergruppen sehr differenziert steuern. SquidGuard
    ist ein Paket, das separat zu installieren und konfigurieren ist.


    **authenticate_program /usr/bin/pam_auth** Soll die Benutzer als Proxy authentifizieren
    müssen, kann man ein entsprechendes Programm z. B. pam_auth angeben. Bei der Verwendung
    von pam_auth öffnet sich für den Anwender beim ersten Zugriff ein Loginfenster,
    in dem Benutzername und Passwort. Zusätzlich ist noch eine ACL erforderlich, damit
    nur Clients mit gültigem Login surfen können:


    ```

    acl password proxy_auth REQUIRED


    http_access allow password

    http_access deny all

    ```


    Das REQUIRED proxy_auth kann auch über eine Liste von erlaubten Benutzernamen
    auf einen Pfad zu dieser Liste verweisen.


    **ident_lookup access allow <name>** Hiermit reicht, dass auf durch die ACL definierten
    Clients eine Ident-Anfrage ausgeführt wird, die Identität des jeweiligen Benutz
    zu ermitteln. Setzt man für <name> einen ein, der generell für alle Clients gilt.
    Da Ident-Daemon laufen, bei Linux kann man dafür das Paket identd installieren,
    für Windows gibt es freie Software, die man sich aus dem Internet besorgen kann.
    Damit nur Clients mit erfolgreiche Ident-Lookup zugelassen werden, ist hier wieder
    eine entsprechende ACL zu definieren:'
  merge: -1
  pgno: 145
- img_proc: true
  md: '```

    acl identhosts ident REQUIRED


    http_access allow identhosts

    http_access deny all

    ```


    Auch hier kann man das REQUIRED wieder durch eine Liste erlaubter Benutzernamen
    ersetzen. Die Verwendung von Ident kann den Zugriff merklich verlangsamen, da
    die Ident-Lookups durchchaus für jede Anfrage wiederholt werden werden.


    # B.6 Transparente Proxy-Konfiguration


    Normalerweise schickt der Web-Browser an einen bestimmten Port des Proxy-Servers
    und der Proxy die angeforderten Objekte zur Verfügung stellt, ob sie nun im Cache
    sind oder nicht. Innerhalb eines echten Netzwerks können verschiedene Situationen
    auftreten:


    +   * Aus Sicherheitsgründen ist es besser, alle Clients zum Surfen im Internet
    einen Proxy verwenden.

    * Es ist notwendig, dass alle Clients einen Proxy verwenden, ob sie dessen bewusst
    sind oder nicht.

    * In großen Netzwerken, die bereits einen Proxy verwenden, ist es möglich, veränderte
    Konfigurationen der einzelnen Rechner zu speichern, falls sich Änderungen am System
    ergeben.


    In diesem Fällen kann ein transparenter Proxy eingesetzt werden. Das ist denkbar:
    Der Proxy nimmt die Anfragen des Web-Browsers entgegen und bearbeitet sie, sodass
    sie wieder kommen. Der gesamte Prozess wird transparent ausgeführt, da der Name
    für den Vorgang.


    # B.6.1 Kernel-Konfiguration


    Zuerst sollte sichergestellt sein, dass der Kernel des Proxy-Servers einen transparenten
    Proxy unterstützt. Andersfalls muss man dem Kernel Optionen hinzufügen oder neu
    kompilieren. Weitere Informationen entnehmen Sie bitte dem SE Linux Referenzhandbuch.


    Wählen Sie im entsprechenden Eintrag zu den Netzwerkoptionen ''Network Firewalls'',
    und dann die Option ''IP: firewalling'' und ''IP: transparent proxying''. Jetzt
    muss nur noch die neue Konfiguration gespeichert, der neue Kernel kompiliert und
    installiert, ggf. LILO neu konfiguriert und das System neu gestartet werden.


    # B.6.2 Konfigurationsoptionen in /etc/squid.conf


    Folgende Optionen in der Datei /etc/squid.conf müssen aktiviert werden, um einen
    transparenten Proxy aufzusetzen:'
  merge: -1
  pgno: 146
- img_proc: true
  md: '# B Proxy-Server Squid


    +   * httpd_accel_host virtual

    * httpd_accel_port Port 80, an dem der tatsächliche HTTP-Server horcht.

    * httpd_accel_with_proxy on

    * httpd_accel_uses_host_header on


    Die Standardkonfiguration der Datei /etc/squid.conf erlaubt Zugriff auf den Proxy
    von localhost aus, deshalb müssen Sie gegebenenfalls Zugriffsregeln definieren:
    vgl. Absatz B.5 auf Seite 145.


    # B.7 Squid und andere Programme


    In diesem Abschnitt wird gezeigt, wie andere Anwendungen mit Squid interagieren.

    cachemgr.cgi ermöglicht dem Systemadministrator, den benötigten Speicher für das
    Zwischenspeichern von Objekten zu überprüfen. Squidgr filtert Webseiten, und camaris
    ist ein Berichtsgenerator für Squid.


    # B.7.1 cachemgr.cgi


    Der Cache-Manager (cachemgr.cgi) ist ein CGI-Hilfsprogramm zur Ausgabe von Statistiken
    über den benötigten Speicher des laufenden Squid-Prozesses. Im Gegensatz zum Protokollieren
    erleichtert dies die Cache-Verwaltung und die Anzeige von Statist.


    # Einrichten


    Zuerst wird ein lauffäh Web-Server auf dem System benötigt. Als Benutzer root
    gibt man folgendes eingeben, um herauszufinden, ob Apache bereits läuft: rcache
    status.

    Ercheint eine Nachricht wie diese:


    ```

    Checking for service httpd: OK

    Server uptime: 1 day 18 hours 29 minutes 36 seconds

    ```


    dann läuft Apache auf Ihrem Rechner. Andernfalls müssen Sie folgendes eingeben:
    rcache start

    So wird Apache mit der SuSE Linux-Standardeinstellungen gestartet. Weitere Details
    zu Apache finden sich in diesem Handbuch.

    Als letzten Schritt muss man die Datei cachemgr.cgi in das Verzeichnis cgi-bin
    von Apache kopieren:


    ```

    cp /usr/share/doc/packages/squid/scripts/cachemgr.cgi

    /usr/local/httpd/cgi-bin

    ```'
  merge: -1
  pgno: 147
- img_proc: true
  md: '# B.7 Squid und andere Programme


    ```

    acl manager proto cache_object

    acl localhost src 127.0.0.1/255.255.255

    ```


    # Cache-Manager ACLs in /etc/squid.conf


    Folgende Standardeinstellungen sind für den Cache-Manager erforderlich:

    Folgende Regeln sollen enthalten sein:


    ```

    http_access allow manager localhost

    http_access deny manager

    ```


    Diese ACL ist am wichtigsten, da der Cache-Manager versucht, mit dem Squid über
    das cache_object-Protokoll zu kommunizieren. Die folgenden Regeln setzen voraus,
    dass der Web-Server und Squid auf demselben Rechner laufen. Die Kommunikation
    zwischen dem Cache-Manager und Squid entsteht beim Web-Server, nicht beim Browser.
    Befindet sich der Web-Server also auf einem anderen Rechner, müssen Sie eine ACL
    wie in der Beispieldatei B.7.1 hinzufügen.


    ```

    acl manager proto cache_object

    acl localhost src 127.0.0.1/255.255.255

    acl webserver src 192.168.1.7/255.255.255 # IP des Webservers

    ```


    # Datei B.7.1: Zugiffsregeln


    Dann werden folgende Regeln aus Datei B.7.2 auf der nächsten Seite benötigt.

    Es ist auch möglich, ein Passwort für den Manager zu konfigurieren, wenn mehrere
    Optionen dagegen genutzt werden soll, z. B. Schließen des Cache von Remote oder
    Anzeigen weiterer Informationen über den Cache. Dann müssen Sie den Eintrag cachemgr_passwd
    und die Optionenliste, die angezeigt werden soll, mit einem Passwort für den Manager
    konfigurieren. Diese Liste erscheint als Teil der Eintragkommentare in /etc/squid.conf.


    Immer wenn sich die Konfigurationsdatei ändert, muss Squid mit dem Kommando squid
    reload neu gestartet werden.


    # Statistiken anzeigen


