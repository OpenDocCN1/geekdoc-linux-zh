  md: '# C.1 SSH – secure shell, die sichere Alternative


    hannes:~ scp -r src/ sonne:backup/

    kopiert den gesamten Inhalt des Verzeichnisses src/ inklusive aller Verzeichnisse
    auf den Rechner sonne und dort im Verzeichnis backup/

    Dies wird automatisch angelegt, wenn es fehlt.


    Mittels der Option -p scp wird der Zeitempel der Dateien erhalten. -C sorgt für
    eine komprimierte Übertragung. Dadurch wird einerseits das zu übertragende Datenvolumen
    minimiert, andererseits ein höherer Rechenaufwand erforderlich.


    # C.1.4 sftp - sicherere Dateiübertragung


    Alternativ kann man zu sicheren Datenübertragung sftp verwenden. sftp bietet innerhalb
    der Sitzung viele von ftp bekannten Kommandos. Gegenüber scp mag es bei beiden
    Übertragung von Daten, Dateiname unbekannt sind, von Vorteil sein.


    # C.1.5 Der SSH Daemon (sshd) – die Serverseite


    Der SSH-Daemon ist Bestandteil des SSH-Pakets und wird in SuSE Linux automatisch
    auf Runlevel 3 und 5 gestartet. In /etc/rc.config ist die Variable START_SSH auf
    zwei eingestellt.

    Während des ersten Starts generiert der Daemon der zwei Schlüsselpaare. Die Schlüsselpaare
    bestehen aus einem privaten und einem öffentlichen (engl. public) Schlüssel. Deshalb
    bezeichnet man dies als public-basiertes Verfahren. Um die Kommunikation mittels
    SSH zu gewährleisten, darf ausschließlich der Systemadministrator die Dateien
    der privaten Schlüsseln lesen. Die Daterechte wurden bei Vorerterstellung restriktiv
    gesetzt. Die privaten Schlüssel werden lediglich lokal vom SSH-Daemon benötigt
    und dürfen an niemanden weitergegeben werden. Zudem können lediglich die öffentlichen
    an Kommunikationspartner weitergegeben (an Namensendung -pub erkennbar) und für
    alle Benutzer lesbar werden.


    Eine Verbindung wird vom SSH-Client eingeleitet. Der wartende SSH-Daemon und der
    anfragende SSH-Client schauen Identifikationsdaten aus, um die Protokoll- und
    Serverversion abzuggleichen und die Verbindung zu einem falschen Port auszuschließen.
    Ein Prozess des ursprünglichen SSH-Daemons antwortet, sodass gleichzeitig viele
    SSH-Verbindungen möglich.


    Der Server sendet eigenen host key und einen stündlich vom SSH-Daemon neu generierten
    server key (engl. encrypt) den SSH-Client einen frei gewählten Sitzungsschlüssel
    (engl. session key) und sendet ihn an den SSH-Server. Dieser dient dem Server
    der gewählten Verschlüsselungsmethode (engl. cipher).


    Die zur Verschlüsselung des Sitzungsschlüssels zwingend erforderlichen privaten
    host und server keys, können nicht auf den öffentlichen ab geleitet'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# Sicherheit im Netzwerk


    Somit kann der kontaktierte SSH-Daemon mit seinen privaten Schlüsseln die Sitzungsschlüssel
    entschiffern (vgl. /usr/share/doc/packages/openssh/RFC.nroff). Diese einleitende
    Phase der Verbindung kann man mittels der Fehlersuche – und des SSH-Clientprogramms
    nachvollziehen. Erst mit der Bestätigung „Received confirmation.“ – des SSH-Daemons.
    Indem der Client alle öffentlichen Schlüssel nach der ersten Kontakfnahme in ~/.ssh/known_hosts
    abfragt, können sogenannte „man-in-the-middle“-Angriffe unterbunden werden. SSH-Server,
    welche Name und IP-Adresse eines voraussetzen, werden durch einen deutlichen Hinweis
    entfernt. Sie fallen entweder durch einen gegenüber von ~/.ssh/known_hosts abweichenden
    Host-Schlüssel auf, oder können ohne passendem Gegenstück vereinbaren Sitzungsschlüssel
    nicht entschlüsseln.


    Es empfiehlt sich, im /etc/ssh/ abgelegten privaten und öffentlichen Schlüssel
    zu archivieren. So können Änderungen der Schlüssel festgestellt und nach einer
    Neuinstallation alles wieder eingespielt werden. Dies erspart den Benutzern die
    beunruhigende Arbeit. Es ist beispielsweise, dass es trotz der Warnung um den
    korrekten SSH-Server handelt, muss der vorhandene Eintrag zu diesem System aus
    ~/.ssh/known_hosts entfernt werden.


    # 1.1.6 SSH-Authentifizierungsmechanismen


    Jetzt erfolgt die eigentliche Authentifizierung, die in ihrer einfachsten Weise
    der Eingabe eines Passwortes besteht, wie es in den oben gezeigten Beispiel erfolgt.
    Ziel von SSH war die Einführung einer sicheren, aber zugleich einfach zu findenden
    Software. Bei den abzolenden Programmen undlich muss auch SSH eine im Alltag zu
    nutzende Authentifizierungsmethode bieten. SSH realisiert dies mittels eines weiteren
    vom Nutzer erzeugten Schlüssselpaares. Dieses liefert das SSH-Paket als Hilfsprogramm
    ssh-keygen. Mit der Eingabe von


    das Schlüsselpaar generiert und der Basisdatename zur Ablage des Schlüssels erfolgt:


    Enter file in which to save the key (/home/hannes/.ssh/identity):


    Bestätigen Sie die Voreinstellung und beantworten Sie die Frage nach einer Passphrase:


    Enter passphrase (empty for no passphrase):


    Auch wenn die Software keine Passwort benötigt, sollte sie bei der vorhergeslagenen
    Vorgehensweise ein Text von bis bis 30 Zeichen Länge gewählt werden. Verwenden
    Sie möglichst keine kurzen und einfachen Wörter oder Zeichen. Nach Erfolg Eingabe
    wird zur Bestätigung eine Wiederholung der Eingabe verlangt. Anschließend wird
    der Ablageort des privaten und öffentlichen Schlüssels, in unserem Beispiel der
    Dateien identity und identity.pub, ausgegeben.


    ```

    hannes@sonne:~$ ssh-keygen

    Generating RSA keys:

    ```'
