    schreibt man folgt root.welt.all.. Am Ende darf man ihn nicht vergessen, da die
    Zone noch einmal angeändert wird.

    - Am Ende folgt ein ''('', um den folgenden Zeilen, bis zu '')'' mit in den SOA-Record
    einzuschließen.


    **Zeile 3: Die serial number** ist eine willkürliche Zahl, die bei jeder Änderung
    erhöht wird. Sie dient, sekundäre Nameserver (Slave-Server) über Änderungen zu
    informieren. Eingebürgt sich eine einstellige Zahl mit Datum und fortlaufender
    Nummer in der Form JJJMMTTNNN.


    **Zeile 4: Die refresh rate** ist das Zeitintervall, in dem SekundärNameserver
    die serial number der Zone überprüft. In diesem Fall 1 Tag (ID = 1 day)


    **Zeile 5: Die retry rate** ist der Zeitabstand, in einem sekundären Nameserver,
    im Fehler versucht den primären Server erneut zu kontaktieren. Hier 2 Stunden
    (IW = 2 hours).


    **Zeile 6: Die expiration time** ist der Zeitraum, nach dem ein sekundärer Nameserver
    die gecachten Daten verwirft, wenn er Kontakt zum primären Server mehr bekommen
    hat. Hier ist eine Woche (IW = 1 week).


    **Zeile 7: Das minimum time to live** ist, wie lange die Ergebnisse von DNS-Anfragen
    von Servern gecached werden dürfen, bevor sie ihre Gültigkeit verlieren und neu
    angefordert werden.


    **Zeile 9: Das IN NS** gibt den Nameserver, der für diese Domain zuständig ist.
    Hier gilt, gateway we to gateway.welt.all ergänzt, weil er nicht mit einem ''.''
    abgeschlossen ist. Es kann mehrere dieser Art, für einen primären und für jeden
    sekundären Nameserver. Für diese Zone notify in /etc/named.conf wenn nicht gesetzt,
    werden alle aufgeführten Nameserver bei Änderungen des Zonendformats informiert.


    **Zeilen 10: Der MX-Record** gibt den Mailserver, der für die Domain welt.all
    die Nachrichten annimmt und weiterleitet. In diesem Beispiel ist der Rechner sonne.welt.all.
    Die Zahl vor dem Rechnernamen ist der Präferenz-Wert, gibt es mehrere MX-Einträge,
    zuerst wird der Mailserver mit dem kleinsten Wert genommen und falls die Auslieferung
    an diesen scheitert, der mit dem nächst höchsten Wert versucht.'
