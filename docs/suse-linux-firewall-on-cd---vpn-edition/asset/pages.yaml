  md: '# SuSE Linux Live-CD for Firewall


    Antwortpakete für allgemeine Programme wie traceroute. Die zweite Stufe bilden
    allgemeine Konfigurationen, die gefährliche ICMP-Pakete verbieten und wichtige
    erlauben. Das interne Netz darf die immer mit "ping" erreichen.


    +   l) Den TCP-Regeln zuerst die konfigurierten Dienste nach freigeben, anschließend
    die für vertrauenswürdige Netze und letztlich für das interne Netz. Am Anschluss
    wird Port 113 konfiguriert, dass ein eingebundsendregset wird, um unnötige Warzeiten
    (z. B. Senden von E-Mails) zu verhindern. Nun kommt ein entscheidender Automatismus
    zum Zug: Wer FW_AUTOPROTECT_GLOBAL_SERVICES auf "yes" gesetzt hat, werden Dienste
    durch Filterreg schützen, die nicht ein spezielles Interface hören (also auf 0.0.0.0
    oder INADR_ANY). Durch kann man gegebenenfalls alle Ports für eingehende Verbindungen
    freigeben, wenn aber trotzdem Datenbanken schützen, die beispielsweise auf Port
    4545 laufen. Am Abschluss werden die Regeln generiert, oder auf privileilegierte
    Ports (zwischen 1024 und 65535) zugriffen werden; gar nicht; nur in /etc/resolv.conf
    definierte Nameserver; nur Verbindungen, die von einem bestimmten Ursprungport
    kommen (nicht empfohlen, wenn Schutz ist zu vermeiden); Interne Systeme dürfen
    auf die unprivilegierten Ports zugreifen – das AUTOPROTECT schützt ihre Dienste.


    +   m) Das Gleich für UDP ist nur hier ein Verbindungsreset vorgenommen, für Port
    113 nicht notwendig.


    +   n) Anschließend kommen die Routing-Regeln an die Reihe, die definieren, welche
    Systeme von außen auf ein internes Netz zugriffen werden dürfen. Das sollte aus
    liegenden Gründen nicht nicht benutzt werden!


    +   o) Jetzt erst ist die Konfiguration der Regeln für Masquerading.


    +   p) Sehr wichtig ist die Konfiguration von zusätzlichen Logmechanismen für
    sensible Pakete, z. B. verbotene TCP-Pakete, die eine Verbindung aufbauen wollen.
    Wenn LOG_*ALL gesetzt wird, wird wirklich Paket geloggt, was viele Einträge erstellt,
    und deshalb für Fehlerbeobung benutzt werden.


    +   q) Zu außerdem ein paar Optimierungsregeln für SSH, FTP, WWW, Syslog und SNMP,
