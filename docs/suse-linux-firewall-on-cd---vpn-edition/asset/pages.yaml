  md: '# 4 Firewall Administration System (FAS)


    Nach der Installation bootet das System bis zum graphischen Login. Hier melden
    Sie sich als Benutzer `fwadmin` mit dem entsprechenden Passwort an. FAS funktioniert
    allerdings erst nach dem Neustart des Systems.


    #  4.1 Einloggen als `fwadmin`


    Sie gelangen auf den Desktop des Benutzers `fwadmin`, auf dem sich ein Icon befindet,
    mit dem Sie direkt die Administrations-Oberfläche für die Konfiguration der Live-CD
    starten (vgl. Abbildung 4.1).


    ![](img/594883f46b5a0951172f1e794f42a4a5_36_0.png)


    Abbildung 4.1: FAS-Icon


    # 4.2 Starten des Firewall Administration System


    FAS ist die grafische Administrationsoberfläche, mit der Sie die Konfigurationsdiskette
    für die „Safe Firewall CD“ erstellen. FAS unterstützt mehrere Benutzer und ist
    in der Lage, mehrere Konfigurationen zu verwalten.


    Es handelt sich um ein Client-Server-System, das das GUI und das fas serverdaemon
    besteht. Der fas-daemon verwaltet die Konfigurationen, nimmt Änderungen entgegen
    und prüft die Eingaben vom Benutzerdaten auf Richtigkeit und leitet sie an den
    Server weiter. Die Kommunikation zwischen Front- und Backend findet in dieser
    Version über Unix Domain Sockets statt.


    Es gibt verschiedene Möglichkeiten, das Firewall Administration System zu starten:


    +   1. Icon auf Desktop (vgl. Abbildung 4.1).

    2. Auswahl aus dem K-Menü,

    3. Geben Sie an der Kommandozeile (z. B. xterm) den den Befehl FAS ein.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# Firewall Administration System (FAS)


    ![](img/594883f46b5a0951172f1e794f42a4a5_37_0.png)


    Abbildung 4.2: Desktop mit FAS und Hilfesten


    # 4.3 Erstellen einer neuen Firewall-Konfiguration


    Nach Sie das Konfigurationsprogramm FAS gestartet haben, müssen Sie einen neuen
    Benutzer-Account in FAS anlegen. Wählen Sie im Menü *FAS* den Menüpunkt *Login
    anlegen* aus. Es folgt ein Dialog, in dem Sie einen Benutzernamen und ein Passwort
    verwenden. Der Benutzername muss mindestens fünf Zeichen lang sein. Mit diesem
    Passwort schützen Sie die Konfiguration der *SuSE Firewall auf CD*, weshalb Sie
    dieses Passwort mit dem Programm regelmäßig auf seine Tauglichkeit überprüfen.


    Allgemein gilt: Gute Passwörter sind nicht zu erraten, auch nicht das Geburtsdatum,
    den Straßennamen oder den Namen des Lieblingsstars verwenden. Siestatt zu kurz
    und dennoch schnell zu tippen, damit sich niemand der Eingabe bemerken kann. Verwenden
    Sie Groß- und Kleinbuchstaben und Zahlen gemeinsam. Natürlich ist es allem wichtig,
    dass man sich ein Passwort merken kann und es nicht aufschreiben muss. Die gewählte
    Methode der Passwortfindung lässt sich daher Abkürzungen von Sätzen oder Ausdrücken,
    die man sich leicht einprägen kann. Hier einige Beispiele:


    +   - NE14TenS (online for tennis?)

    - AuaEGC (UNIX-admins eat green cheese)

    - A10imGt (Am Zehnten ist mein Geburtstag)

    - Iw,ihegP (Ich wünschte, ich hätte ein gutes Passwort)


    Die Konfiguration der *SuSE Firewall auf CD* wird in einem *.tar.gz-Archiv gespeichert.
    Um eine bereits erstellte Konfiguration bearbeiten zu können, müssen Sie dieses
    Passwort wieder angeben.


    Nach der Anmeldung wählen Sie im Menü *Konfiguration* den Punkt *Neue Konfiguration*
    aus. Es erscheint ein neues Fenster, in dem Sie Namen'
