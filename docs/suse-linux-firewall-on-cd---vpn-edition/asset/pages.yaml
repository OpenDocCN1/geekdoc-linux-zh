  md: '# C Sicherheit im Netzwerk


    # C.1 SSH – secure shell, die sichere Alternative


    In unserer Zeit der immer stärkeren Vernetzung werden auch Zugriffe auf entfernte
    Systeme immer häufig. Ob elektronische Post abgeholt, ein Server gewartet oder
    eine Webseite ein Redaktionssystem einen Artikel hinzugefügt wird, muss immer
    eine Authentifizierung der Person erfolgen.


    In der Regel sollten Nutzer weiterhin haben, dass ihr Benutzername und ihr Kenn
    lediglich für sie allein gedacht sind. Eine entsprechende Vereinbarung zwischen
    Arbeitgeber, Rechenzentrum oder Serviceanbieter über die Personenbezogenen dieser
    Daten ist Standard.


    Ersreckend demgegenüber die weitregehende Praxis, dass Authentifizierung und Datenübertragung
    weiterhin in Form von Klartext erfolgen. Die ist beispielsweise der Fall, wenn
    mit Post Protocol (POP) E-Mail abgeholt oder mit telnet auf einem entfernten System
    angemeldet wird. Hierbei gehen die Nutzungen als sensibel eingestuften Nutzerinformationen
    und Daten, z. B. der Inhalt eines Briefes, oder ein talkgeführtes Gespräch, ohne
    Schutz über das Netzwerk. Dies beeinträchtigt einseits die Privatsphäre des Nutzers
    und öffnet andererseits die Möglichkeit zum Missbrauch eines Zugangs. Insbesondere
    können solche Zugänge werden, von dort aus andere Systeme anzugreifen, mit Administrator-bwort
    auf diesem System zu landen.


    Jede der Nutzung der Daten beispielsweise oder im gleichen Netz betriebene Gerät
    wie Firewall, Router, Switch, Mailserver, Arbeitsplatzchner, welche die Daten
    grundsätzlich entstehen. Untersuchungenlagen zwar die geltenden rechtlichen Regelungen
    ein solchen Vorgehen, es soll sogar unter Strafe stehen, der tätigte Angreifer
    oder unberechtigte Einsichtnahmen nur schwer festzustellen und nachzuweisen.


    Die SSH-Software liefert den gewünschten Schutz. Die komplette Authentifizierung,
    in der Regel Benutzname und Passwort, und die Kommunikation erfolgen hier verschlüsselt.
    Zwar ist auch hier weiterhin das Mitschneiden der übertragenen Daten möglich,
    doch nicht wieder der Inhalt mittels fehlendem Schlüssel durch einen Unwissenden
    nicht entschlüsselt werden. So wird sichere Kommunikation über unsich Netze wie
    das Internet möglich. SuSE Linux bietet in der Serie das Paket OpenSSH.


    # C.1.1 Das OpenSSH-Paket


    Sobald Sie das Paket OpenSSH installiert haben, stehen Ihnen die Programme ssh,
    scp und sftp als Alternative für telnet, login, rsh, rcp und ftp zur Verfügung.'
  merge: -1
  pgno: 152
- img_proc: true
  md: "# C.1.2 Das ssh-Programm\n\nMit dem ssh-Programm können Sie Verbindung zu einem\
    \ entfernten System aufnehmen und dort interaktiv arbeiten. Es ist somit gleichermaßen\
    \ Ersatz für telnet und login. Aufgrund der Verwandtschaft zu login reicht das\
    \ zusätzliche symbolische Name ebenso ebenfalls auf ssh. Zum Beispiel kann man\
    \ sich mittels\n\n```\nhannes@sonne:-> ssh son\n```\n\nauf dem Rechner anmelden.\
    \ Anschließend wird nach seinem Passwort auf dem System sonne gefragt:\nhannes@sonne:\
    \ password:\nNach erfolgreicher Authentifizierung kann dort auf der Kommandozeile\
    \ oder interaktiv, z. B. mit dem Su-Administrationsprogramm YaST, gearbeitet werden.\
    \ Sollten sich lokale Benutzer und auf dem entfernten System unterscheiden, kann\
    \ ein abweichender Name angegeben werden:\n\n```\nhannes@sonne:-> ssh -l august\
    \ sonne\n```\n\noder\nDarüber hinaus bietet der ssh von rkh bekannte Möglichkeit,\
    \ Kommand von einem anderen System auszuführen. Im folgenden Beispiel wird das\
    \ Kommando uptime auf dem Rechner ausgeführt und ein Verzeichnis mit dem Namen\
    \ angelegt. Die Programausgabe erfolgt auf dem lokalen Terminal des Rechers:\n\
    \n```\nhannes@sonne:-> ssh sonne 'uptime'; mkdir tmp\nhannes@sonne: password:\n\
    1:21am 2:17, 9 users, load average: 0.15, 0.04, 0.02\n```\n\nHochkomanda sind\
    \ hier zur Zusammenfassung der beiden Anweisungen in einem Kommando erforderlich.\
    \ Nur so wird der zweite Befehl auf dem Rechner ausgeführt.\n\n# C.1.3 sc sicheres\
    \ Kopieren\n\nMittels sc kopieren Sie Dateien auf einen entfernten Rechner. sc\
    \ ist der sichere, verschlüsselte Ersatz für rcp. sc MeinBrief.txt sonne:\ndie\
    \ Datei MeinBrief.txt vom Rechner erde auf den Rechner sonne. Inwie sich die seitlichen\
    \ Benutzernamen auf erde und sonne unterscheiden, muss bei auf den dem ssh-Befehl\
    \ beschriebene Benutzername@Rechnername zugegriffen werden. Eine Option -1 existiert\
    \ nicht.\nNachdem das Passwort eingegeben wurde, beginnt scp mit der Datenübertragung\
    \ und zeigt die Zeit anhand von links nach rechts abwärts sendenden Balken. Zudem\
    \ wird am rechten Rand die geschätzte Resttragungszeit (engl. estimated time of\
    \ arrival) angezeigt. Jedeliche Ausgabe kann durch die Option -q unterdrückt werden.\n\
    \ bietet bietet Kopieren einzelner Dateien ein rekursives Verfahren zum Übertragen\
    \ ganzer Verzeichnisse."
