  md: '# B.7 Squid und andere Programme


    Der nächste Schritt besteht darin, eine Dummy-Seite „Zugriff verweigert“ oder
    eine oder weniger intelligente CGI-Seite zu erzeugen, um Squid umzuleiten, in
    falls der Client eine verbotene Webseite anfordert. Der Einsatz von Apache würde
    auch hier wieder ausfallen.


    Nun müssen Squid sagen, dass SquidGuard benutzt muss. Dafür verwenden wir die
    folgenden Einträge in der Datei `/etc/squid.conf`:


    ```

    redirect_program /usr/bin/squidguard

    ```


    Eine andere Option namens `redirect_children` konfiguriert die Anzahl der verschiedenen
    auf dem Rechner laufenden `redirect`, also Umleitungsprozesse (in diesem Fall
    SquidGuard). Squid ist schnell, aber wirklich: 100.000 Anfragen innerhalb von
    10 Sekunden auf einem 500MHz Pentium mit 5900 Domains, URLs (gesamt 13780) zu
    bearbeiten. Es wird daher jedoch nicht empfohlen, mehr als 5 Prozesse festzusetzen,
    da die Zuweisung jeder Prozess zu viel Speicher braucht.


    ```

    redirect_children 5

    ```


    Als Lettes senden wir ein HUP-Signal an Squid, damit die neue Konfiguration eingelesen
    wird.


    ```

    squid reload

    ```


    Nun können Sie Ihre Einstellungen in Cache-Berichten von Calamaris betrachten.


    # B.7. Erzeugen von Cache-Berichten mit Calamaris


    Calamaris ist ein Perl-Script, das zur Erzeugung von Aktivitätsberichten des Cache
    im ASCII- oder HTML-Format verendet wird. Es arbeitet mit Squid-Zugriffsprotokokolldaten.
    Die Homepage von Calamaris befindet sich unter: `http://Calamaris.org/`


    Das Programm ist einfach zu verwenden. Melden Sie sich als `root` an und folgen
    Sie folgend:


    ```

    cat access.log.files | calamaris [options] > reportfile

    ```


    Beim Vermehren von Protokokokolldaten ist die Beobachtung der chronologischen
    Reihenfolge sehr wichtig, d.h. ältere Daten zuerst.


    Die verschiedenen Optionen:


    +   - -a wird normalerweise für alle verfügbaren Berichte verwendet, mit

    - -w erhalten man einen HTML-Bericht und mit

    - -l eine Nachricht oder ein Logo im Header des Berichts.


    Weitere Informationen über die verschiedenen Optionen finden Sie in der ManualPage
    zu calamaris: `man calamaris`


    Ein übliches Beispiel:


    ```

    cat access.log.2 access.log.1 access.log | calamaris -a -w >


    /usr/local/http/htdocs/Squid/squidreport.html

    ```'
