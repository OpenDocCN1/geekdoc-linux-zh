    # htpf, tinyproxy


    Das Programm httpf ist für das "content filtering" zuständig. Es ist kein Proxy
    im eigenen Sinne, denn die Proxy-Funktionalität wird über das Programm tinyproxy
    erbracht.


    Es handelt sich viel um einen filternden Proxy, der das Herunterladen und die
    Ausführung von Proxycode verhindern kann. Dies geschieht, indem nur bekannte,
    ungefährliche Sprachen an den Webbrowser weitergeleitet werden. Auch die Einträge
    in den HTTP-Köpfen können gefiltert werden, dass z. B. Informationen über das
    Betriebssystem des Client-Rechners an den Server übergeben.


    Die Konfigurationen erreichen Sie mit FAS auf dem Adminhost.


    # transproxy


    transproxy regelt den Zugriff von extern auf einen internen Webserver.


    Diese Programme insgesamt bieten die Möglichkeit, vielfältig zu filtern: ACLs
    für Clients, Server, Banlists, Contentfiltering, Webcaching.


    # 5.3.5 FTP-Proxy


