    Auf Dauer ist die Vorgehensweise anders, als die Eingabe eines Passwortagent.
    Entspricht das SSH-Paket einem Hilfsprogramm, der ssh-agent für die Dauer „X-session“
    Schlüssel hält. Dazu wird das Ganze als Kindprozess des ssh-agents startet. Sie
    erreichen dies am einfachsten, indem Sie am Anfang der Datei .xsession die Variable
    usess auf setzen und sich über einen Displaymanager, z.B. KDM oder KDE, anmelden.
    Alternativ können Sie ssh-agent starten.


    Sobald Ihre X-session gestartet ist, startet ssh-add Ihre privaten Schlüssel mit
    ssh-add frei. Insoweit ssh-add nicht in einem Terminal gefragt, z. B. über ein
    Menü aufgerufen wird, in einer Eingabeumgebung von </dev/null, erfolgt eine grafische
    Eingabaufforderung x1-ssh-askpass. Nun können Sie wie gewohnt ssh-add oder scp
    nutzen. Insoweit Sie privaten Schlüssel verteilt haben, sollten Sie jetzt nicht
    mehr nach dem Passwort gefragt werden. Achten Sie beim Verlassen Ihres Rechner
    darauf, dass die X-Session beenden oder mittels einer passwortgeschützten Bildschirmsperre,
    z. B. xlock, ver vermeiden.


    # C.1.7 X-Authentifizierungs- und sonstige Weiterleitung


    Über die bisher sicherheitsrelevanten Verbesserungen hinaus lässt sich die Verwendung
    von entfernten X-Anwendungen leichttern. Insoweit ssh mit der Option -X funktioniert,
    auf dem entfernten System die DISPLAY gesetzt und alle X-Ausgaben werden über
    den Ausgangsserver derhenden ssh-Verbindung weitergeleitet. Diese bequeme Funktion
    dient gleichzeitig der bestehenden Almöglichkeit bei entfernt aufgerufenen und
    lokal betrachteten X-Anwendungen.


    Durch diese Option -a wird der ssh-agent-Authentifizierungsmechanismus auf dem
    nächsten Rechner eingerichtet. Man kann so von einem Rechner aus gehen, ohne ein
    Passwort eingeben zu müssen. Allerdings nur, wenn man seinen öffentlichen Schlüssel
    an den beteiligten Zielchner verteilt und korrekt abgelegt hat.


    Beide Mechanism sind vorsichtighalber in der voreinstellung deaktiviert, können
    jedoch in der systemweiten Konfigurationsdatei /etc/ssh/sshd_config'
