  md: '# 4 Firewall Administration System (FAS)


    # 4.3.6 Konfiguration des Mail-Relays (Postfix)


    Dieses Modul verwenden zu können, müssen Sie in der Basis-Konfiguration eine Festplatte
    einzugeben.


    ![](img/594883f46b5a0951172f1e794f42a4a5_49_0.png)


    Abbildung 4.20: Konfiguration des Mail-Relays – Dialog


    **Interner Mailserver:** Geben Sie die IP-Adresse oder den Namen internen Mail-Servers
    an (vgl. Abbildung 4.20).


    **Checkbox ISP-Relay:** Aktivieren Sie diese Checkbox, wenn alle ausgehenden E-Mails
    an den SMTP-Server Internet-Service-Providers (ISP) weitergeleitet werden. Geben
    Sie den Namen (FQHN) oder die IP-Adresse des SMTP-Servers Providers an.


    **Folgende Domains weiterleiten:** Tragen Sie hier den Domain-Name ein, der vom
    Mail-Rel empfangen und an den Mailserver weitergeleitet werden sollen.


    **Lokale Netzwerke:** Liste Ihrer Netzwerke. Postfix entscheidet anhand, ob ein
    Netzwerk E-Mail über die Firewall versendet wird. Geben Sie Ihre Netzwerke (z.
    B. 192.168.0.0/24) (vgl. Abbildung 4.21) auf der nächsten Seite.


    **Höre auf ausgewählte IP-Adressen:** Geben Sie hier die IP-Adressen an, auf denen
    der Mail-Relay Anfragen entgegengegennimmt.


