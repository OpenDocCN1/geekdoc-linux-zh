    Eine Forwarding-Regel besteht aus:


    +   a) Quill-IP/Netz,

    b) Ziel-IP(oder IP/intern),

    c) Ziel-Port(oder IP protocol), getrennt durch Komma


    ```

    # Forward TCP connections

    # Beware to use this!

    # FW_FORWARD_TCP=""

    # Forward UDP connections

    # Beware to use this!

    # FW_FORWARD_UDP=""

    # Forward other IP protocol connections (for VPN setups)

    # Beware to use this!

    # FW_FORWARD_IP=""

    ```


    +   14. Welche Dienste dürfen auf maskierten Rechner (in ihrer DMZ oder dem-

    ternen Netz) verwendet werden?


    REQUIRES: FW_ROUTE, FW_MASQUERADE


    Mit diesen Variablen können Sie den Zugang z. B. auf Ihren Mailserver ge-

    statten. Die Rechner müssen in einem maskierten Netzwerksegment stehen und

    iese keine IP-Adressen von extern.


    Wenn FW_DEV_MASQ auf Ihrem Interface gesetzt ist, müssen Sie auch

    die Variablen FW_FORWARD_* von Ihrem internen Netzwerk, die die DMZ für

    diese Dienste ansteuern.


    # Achtung


    Aus Sicherheitsgründen sollten Sie diese Funktionalität nicht verwen-

    den. Sie öffnen damit ein Sicherheitsloch in Ihrem internen Netzwerk.

    Wenn z. B. Ihr Webserver kompromittiert wird, ist Ihr gesamtes Netz-

    werk ebenfalls unsicher.'
