  md: '# 4 Firewall Administration System (FAS)


    # Importieren von Zertifikaten


    Klicken Sie im Menü ''Zertifikat-Verwaltung'' auf ''Zertifikat importieren''.
    Aus dem erscheinenden Verzeichnis-Listing wählen Sie die Datei aus, die das Zertifikat
    enthält.


    Gültige Formate: Ein zu importierendes Zertifikat kann in den folgenden Formaten
    vorliegen: DER, PEM und PKCS12

    DER und PEM bei diesen Formaten sind keine weiteren Angaben notwendig.


    Liegt das Zertifikat im PKCS12-Format vor, erscheint ein Passwort-Dialog Sie müssen
    das Importpasswort angeben. Außerdem wird geffordert, ein neues Passwort für das
    Zertifikat zu vergeben. Geben Sie das Passwort zur Überprüfung ein zweites Mal
    ein.


    # Exportieren von Zertifikaten


    Klicken Sie im Menü ''Zertifikat-Verwaltung'' auf ''Zertifikat exportieren''.
    Es gibt drei Formate, in denen ein Zertifikat exportiert werden kann, PEM, DER
    und PKCS12.


    Wenn Sie das Zertifikat im PEM oder DER Format speichern wollen, wählen Sie zu
    exportierende Zertifikat aus der Liste und klicken auf Menü ''Zertifikat-Verwaltung''
    auf ''Zertifikat exportieren''.


    Im erscheinenden Dateidialog wählen Sie den Speicherort aus und geben einen Namen
    für die Datei, in der das Zertifikat gespeichert wird. Sie müssen aus dem Format-Selectbox
    das Format wählen: DER oder PEM. Das Zertifikat wird abgesichert. Bei PEM-Format
    können Sie außerdem angeben, ob das Zertifikat mit oder ohne Schlüssel gespeichert
    werden soll


    Beachten Sie, dass ein Zertifikat im PKCS12-Format exportiert werden kann, wenn
    ein Schlüssel zu diesem Zertifikat existiert. Verfahren Sie wie unter PEM und
    DER. Wählen Sie einen Namen für das Zertifikat und das Dateformat PKCS12. Sie
    werden nach dem Passwort für das Zertifikat gefragt. Sie müssen außerdem ein Export-Passwort
    eingeben. Geben Sie dieses Passwort zur Überprüfung ein zweites Mal ein. Dieses
    Passwort müssen Sie eingeben, wenn Sie das Zertifikat importieren möchten.


    # 4.3.13 Konfiguration eines Clientsservers mit xntpd (NTP-Modul)


    Mit FAS Modul können Sie den Clientsserver xntpd konfigurieren. xntpd sorgt dafür,
    dass die Rechnerzeit mit einer externen Zeitquelle (ein Rechnung mit der genauen
    Uhr) synchron gehalten wird. Das ist wichtig, die Zeitstempel in den Logdateien
    mit Zeitstempel anderer Logdateien (auf anderen Rechner) vergleichbar zu machen.


    Sie können bis zu zwei Server angeben, von denen versucht wird, sich die aktuelle
    Zeit zu holen (Abb. 4.38 auf der nächsten Seite).'
