  md: '# 4.3 Erstellen einer neuen Firewall-Konfiguration


    Wenn Sie ''Festplatte verwenden'' aktivieren, können Sie folgende Ein-stellungen
    vornehmen:


    **Festplatte-Device:** Angabe der Festplatte, die eingebunden werden soll:

    z. B.: /dev/hda (1. Festplatte am 1. IDE-Controller)


    **Festplatte-Swap-Größe:** Größe der Swap-Partition: z. B. 128 MB


    **Checkbox /var auf Festplatte nutzen?** Soll das Verzeichnis

    /var auf dem Festplatte-Device liegen?


    IDE aktivieren: aktiviert DMA für IDE


    Wenn Sie den E-Mail-Proxy verwenden und/oder das Caching als HTTP-

    Proxy aktivieren und/oder die Log-Meldungen auf der Festplatte speichern

    wollen, muss die Festplatte konfiguriert und aktiv sein.


    +   3. Netzwerk-Interfaces (vgl. Abbildung 4.5):


    ![](img/594883f46b5a0951172f1e794f42a4a5_40_0.png)


    Falls Sie schon Netzwerksstellen konfiguriert haben, finden Sie in die-

    sem Dialog eine Liste mit bereits angelegten Interfaces. Es können maximal

    Interfaces angezeigt werden, wobei meist ein internes und ein

    externes Interface eingetragen werden. Mit ''Hinzufügen'' wird ein neues

    Netzwerkinterface-Dialog'' (vgl. Abbildung 4.6 auf der nächsten Seite). Folgende
    Angaben

    sind notwendig:


    **Netzwerktyp:** Ethernet ist „default“ (in dieser Version wird nur Ethernet

    unterstützt).


    **Gerätename:** Automatisch fortlaufend vergeben.


    **IP-Adresse:** IP-Adresse, die dem Interface zugewiesen wird soll.


    **Netzmaske:** Netzmaske zur IP-Adresse.


    **Richtung:** intern/extern; ist das Interface am Intranet, an der DMZ oder dem

    Internet angesch?'
