  md: '# 2.2 SuSE Linux Firewall on CD


    ![](img/594883f46b5a0951172f1e794f42a4a5_14_0.png)


    Abbildung 2.3: Überschaubares und effektives Setup


    Abbildung 2.3 zeigt eine immer noch überschaubare, aber dennoch wesentlich effektivere
    Lösung.

    Ein „Screening Router“ blockt auf Paketebene unberechtigte Zugriffe ab. Nachgeschaltet
    ist ein erster Firewallrechner, der auf Appliksebene und durch Paketfilter-Regeln
    den Zugriff auf die DMZ sowie den zweiten Firewall-Rechner und damit auf das interne
    Netz regelt. Der zweite Rechner schützt das interne Netz auf Paketfilter- und
    Proxy-Basis und regelt darüber hinaus die Zugriffe aus dem internen Netz auf das
    Internet und die DMZ. Der Admin-Rechner ist in einem gesonderten Netz, das mit
    den Firewall-Systemen verbunden ist.'
