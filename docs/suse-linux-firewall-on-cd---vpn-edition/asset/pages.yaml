  md: '# 2.2.3 Update abschließen


    Nur wenn Sie das Update von einer SUSE Linux 7 oder einem Enterprise Server 7
    durchgeführt haben — unabhängig davon, ob YaST1 oder YaST2 die Pakete installiert
    wurden. — müssen Sie zusätzlich noch das YaST2-Modul für den SUSE Linux Admin
    for Firewall mit folgendem Befehl aufrufen:

    root@admin: # /sbin/yast2 fcadadmin


    Alternativ können Sie unter KDE das YaST2-Kontrollzentrum starten und unter ''Netzwerk/Basis''
    mit dem Modul ''SUSE Firewall Adminhost'' aufrufen (Abbildung 3.1).


    ![](img/594883f46b5a0951172f1e794f42a4a5_19_0.png)


    Abbildung 3.1: YaST2 Control Center


    Wenn Sie eine vorhandene SuSE Linux Firewall auf CD um die VPNer erweitert haben,
    ist dies nicht notwendig. Allerdings müssen Sie dazu den fasdaemon-Daemon erneu
    starten. Als Benutzer ''root'' rufen Sie dazu den Befehl rcfasd restart auf. Denken
    Sie auch daran, die Konvertierung der alten Konfigurationen durchzuführen wie
    im Abschnitt 3.2 auf Seite 17 beschrieben.'
