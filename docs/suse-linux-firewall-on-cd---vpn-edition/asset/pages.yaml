  md: '# SuSE Linux Adminhost for Firewall


    ![](img/594883f46b5a0951172f1e794f42a4a5_27_0.png)


    # Konfigurationsdateien


    Dieser Abschnitt gibt eine Übersicht über die Netzwerkkfigurationsdateien und
    erklärt ihre Funktion sowie das verwendete Format.


    # /etc/rc.config


    In zentralen Konfigurationsdateien wird der Großteil der Netzwerkkonfiguration
    vorgenommen. Bei Veränderung werden mittels YaST oder dem Aufruf von SuSEconfig,
    nachdem die Datei manuell verändert wurde, werden aus diesen Einträgen die meisten
    der folgenden Daten automatisch generiert. Auch die Bootskripten werden über die
    Einstellungen in dieser Datei konfiguriert.


    > Tipp

    Wenn Sie diese Datei von Hand ver, müssen Sie nachfolgend immer SuSEconfig aufrufen,
    damit die geänderte Konfiguration automatisch in die richtigen Dateien eingetragen
    wird.


    # /etc/hosts


    In dieser Datei (siehe Datei 3.3.1 auf der nächsten Seite) werden Rechnernamen
    IP-Adressen zugeordnet. Kein Nameserver wird verwendet, müssen alle Rechner aufgeführt
    werden, zu denen eine IP-Verbindung aufgebaut werden soll. Wenn ein Rechner eine
    Zeile besteht IP-Adresse, qualifizierten Hostnamen und dem Rechnernamen (z. B.
    erde) in die Datei eingetragen. Die IP-Adresse muss am Anfang der Zeilen stehen,
    die Einträge durch Leerzeichen bzw. Tabulatoren getrennt. Kommentare werden durch
    Zeichen ''\#'' eingeleitet.'
  merge: -1
  pgno: 27
