  md: '# SuSE Linux Live-CD for Firewall


    Von intern nach extern:


    magic-user


    Ermöglicht die Angabe des Benutznamens, des Hosts und des Ports des Ziel-FTP-Servers
    (z. B. user@ftp.firma.com:2345). Also automatisches Ausführen des USER-Kommands.


    Von extern nach intern:


    Falls Sie einen FTP-Server betreiben möchten, definieren Sie in diesem Teil des
    Moduls die Einstellungen, um auf den FTP-Server einen Zugriff aus dem Internet
    zu ermöglichen.


    Proxy Konfiguration für einen FTP-Server


    **IP-Adresse des FTP-Servers:** IP-Adresse Ihres FTP-Servers in Ihrer DMZ (oder
    Intranet), der vom Internet aus zugänglich sein soll.


    **FTP-Proxy-Port:** Normalerweise 21 (voreoreingestellt).


    **Maximale Anzahl von Clients:** Die maximale Anzahl an offenen Verbindungen ist
    auf 512 begrenzt (standardmäßig 64).


    **Höre auf ausgewählte IP-Adresse:** IP-Adresse des Interfaces, auf dem der FTP-Server
    Anfrage für Verbindungen vom Internet entgegennehmen soll. ''0.0.0.0'' steht für
    alle Interfaces, die die Firewall hat.


    ![](img/594883f46b5a0951172f1e794f42a4a5_97_0.png)


    **Port reset PASV:** Es gibt zwei Möglichkeiten, um zu einem FTP-Server eine Verbindung
    herzustellen:


    +   * aktiver FTP-Modus: bei einer Anfrage öffnet der Server einen Port für den
    Datentransfer

    * passiver FTP-Modus (PASV): dem Server wird der Port-Nr. mitgeschickt, auf dem
    die Daten empfangen werden sollen.


    **Identische Adresse:** Ist die Option aktiviert (''yes'', Standarddeinstellung),
    wird erzwungen, dass der Server, an den die Anfrage gestellt wurde (und kein anderer),
    diese auch beantwortet.'
