  md: '# 4.3 Erstellen einer neuen Firewall-Konfiguration


    dung 4.28 auf der vorherigen Seite)


    **Höre auf ausgewählte IP-Adressen** Hier liegen die IP-Adresse der Firewall,
    von der HTTP-Anfragen entgegen genommen werden. In der Auswahlliste finden Sie
    die Interfaces, die in der Basiskonfiguration als intern gekennzeichnet sind.
    0.0.0.0 steht für alle Proxy den Port 3128.


    **Transparent Proxy** Grundsätzlich überwacht der Proxy den Port 80 und wenn eine
    HTTP-Anfrage gestellt wird, lässt diese diese Anfrage zu bearbeiten, muss die
    Option ‚Transparent Proxy‘ aktiviert sein. Damit verbunden muss eine „Redirect“-Regel
    (Umleitung) existieren, die Anfrage innerhalb der Firewall auf den Port 3128 umleitet.
    Wenn Sie diese Option nicht aktivieren, müssen alle Clients oder interne Proxy
    eingetragen werden.


    **Caching** Welche HTTP-Anfragen, so können Sie die Option ‚Caching‘ aktivieren,
    um ein wiederholtes Bearbeiten von gültigen Seiten zu vermeiden. Die Größe des
    Cache lässt sich im zugeordneten Eingabefeld bestimmen und sollte nicht unter
    100 MB liegen.


    > Achtung

    Die Firewall sollte nicht als zwischenspeichernder HTTP-Proxy verwendet werden,
    darin nicht die eigentliche Aufgabe. Eine bessere Lösung ist der Einsatz eines
    zusätzlichen eigenständigen Rechners.


    Haben Sie alle Veränderungen vorgenommen, bestätigen Sie die Einstellungen mit
    ‚Weiter‘.


    ACLs definieren


    Hier legen Sie fest, wer den Proxy verwenden darf und auf diese Benutzer im Internet
    zugreifen können (siehe Abbildung 4.29 auf der nächsten Seite).


    **Name für ACL** Verge Sie sich einen Namen für die anzulegende Liste.


    **Typ der ACL** Als Nächstes wählen Sie einen ‚Typ‘ für Ihre ACL. Sie haben die
    Wahl:


    +   url_regex Angaben von URL-Adressen.

    proto (protocol) Hier legen Sie die entsprechenden Protokolle fest.

    src (source) Bestimmung der Quelladressen.

    dst (destination) Angabe der Zieladress.


    Hinzufügen F Sie die neue ACL der Liste von bereits angelegten ACLs hinzu.


    **Löschen** Sie können ACLs über diese Schaltfläche auch wieder löschen.'
  merge: -1
