  md: '# Firewall Administration System (FAS)


    einer Forwarding-Regel mitgegeben werden.

    nZu Allow und Deny wird als Parameter eine IP-Adresse oder ein IP-Adressbereich
    angegeben. Es sind alle Ziffern (0-9), der Punkt (.), das Fragezeichen (?) und
    der Stern (*). Das Fragezeichen steht für jedes beliebbig einzelne Zeichen, der
    Stern für beliebbig viele Zeichen, inklusive der Null. Als Parameter nur IP-Adress
    erlaubt.


    **Allow:** Wenn eine Verbindung ankommt, der keiner Allow-Regeln entspricht, wird
    sie sofort zurückgewiesen.


    **Deny:** Wenn eine Verbindung von einer IP-Adresse oder einem Adressbereich kommt,
    der eine Deny-Regel fällt, wird die Verbindung sofort zurückgewiesen.


    Um die Einstellungen abz speichern, bestätigen Sie Ihre Eingaben mit ''OK''. Die
    Logausgaben werden auf dem syslog der Firewall.

    Um eine bestehende Regel zu editieren, wählen Sie die entsprechende Regel in der
    Liste aus und klicken auf den ''Bearbeiten''-Button. Es erscheint ein Dialog,
    in dem die bisherigen Einstellungen sichtbar sind. Machen Sie Ihre Änderungen
    und bestätigen Sie die Änderungen mit ''OK''.

    Das Löschen einer Regel erfolgt durch Auswahl einer Regel und drücken des ''Löschen''-Buttons.


    # 4.3.15 VPN Connections (IPSEC-Modul)


    Einführung


    Das VPN Connection-Modul ermöglicht, VP Netzwerke einzurichten. Diese Virtual
    Private Networks kann man als Tunnel zwischen zwei Hosts verläuft, der das „normale“
    Internet verläuft. Dieser Tunnel weiß nicht über die in ihm übertragenen Informationen.


    Die VPN-Netzwerke werden auf der „SUSE Firewall on CD“ mit IPsec realisiert. IPsec
    ist eine Protokollfamilie, die es ermöglicht, sichere Verbindungen zwischen Computern
    herzustellen. Die Authentifizierung erfolgt durch Zertifikate. Als weitere Möglichkeit
    für die Authentifizierung gibt es keine „Pre Shared Key"


    Die Daten, die diesen Tunnel geleitet werden, werden automatisch verschlüsselt.
    Für die Authentifizierung notwendigen Zertifikate werden mit dem Keyring-Modul
    von FAS erzeugt bzw. importiert (vgl. 4.3.12 auf Seite 61).

    Zu beachten ist Folgendes:


    Um IPsec verwenden zu können, muss der Paketfilter auf der „SUSE Linux on CD“
    angepasst werden. Dies geschieht automatisch, wenn der SUSE Firewall Modul in
    FAS erstellt werden wird.


    Wenn Sie ein eigenes Firewall-Script mit FAS integrieren möchten, müssen Sie wie
    folgt vorgehen:

    In Ihrem Firewall-Script muss eine Chain angelegt werden, die „ipsec“ heißt. Das
    geschieht mit dem folgenden Kommando:'
  merge: -1
