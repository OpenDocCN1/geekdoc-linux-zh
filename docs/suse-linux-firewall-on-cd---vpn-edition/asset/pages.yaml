  md: '# 7.5 Maßnahmen im Falle eines Einbruchs


    # 7.5 Maßnahmen im Falle eines Einbruchs


    # 7.5.1 System-Einbruch und Ereignisanzeige


    Ein „richtig“ konfiguriertes Linux/UNIX-System kann sich schon als ziemlich sicher
    gelten. Systemimmanente Gefahren, die mit einem komplexen System wie Linux ebenfalls
    zusammenhäng, werden besser erkannt als bei anderen Betriebssystemen, welche UNIX
    mehr als 30 Jahren eingesetzt und weitertentwick wurden. UNIX ist die Grundlage
    des Internets. Nichtdestotrotz werden Konfigurationsfehler und tauchen immer wieder
    Sicherheitslücken auf. Es wird immer Sicherheitsmängel geben. Sicherheitsexperten
    und Cracker/Hacker stehen im immerwährend „Konkurrenzkampf“, einander einen Schritt
    voraus. Was nicht als sicher gilt, kann morgen wieder unsicher sein.


    Anzeichen für einen Einbruch in Ihr System (engl. Intrusion Detection)


    Als Zeichen für eine Kompromittierung Ihres Systems können Sie alles betrachten,
    was vom „normalen“ Verhalten Ihres Firewall-Systems abweicht, z. B.:


    +   - erhöhte Prozesslast,

    - außerhalb großer Netzwerkverkehr,

    - ungewöhnliche Prozesse oder

    - Prozesse von von Benutzern gestartet, die nicht existieren.


    # Einen Angriff erkennen


    Zunächst sollte man sich im Klaren darüber werden, welche Art von Aktionen als
    Angriff zu bewerten sind. Leider ist in der Zwischenzeit vollkommen normal, ein
    Rechner, der mit dem Internet verbunden ist, nach offenen, verbundenen Ports abgescannt
    wird. Ebenso ist es üblich, Ports anzugreifen, die irgendwann als verwundbar bekannt
    wurden (pop3/popper, rpc-mount, smtp/sendmail). Die meisten „Angriffe“ werden
    von „Script-Kiddies“ durchgeführt. Verwendet werden vorgefertigte „Exploits“,
    die auch auf vielfältigen Web-Seiten veröffentlicht werden (z.B. http://rootshell.com).
    Diese Seiten stellen auch eine wertvolle Informationsquelle für Netzwerk- und
    Systemadministratoren dar. Sie sind meist zu erkennen, dass der Angriff nur ein
    einziges Mal bei Erfolg nicht wiederholt wird. Als erste Maßnahme auf ein Vorkommnis
    sollten Sie überprüfen, ob wirklich ein Einbruch stattgefunden hat. Das Weitere
    sollten Sie die Log-Level erhöhen und die Auswertung verfeinern (z. B. nach einer
    angreifenden IP-Adresse in den Log-Files oder nach ungewöhnlichen PortNummern
    suchen). Es bleibt Ihnen überlassen, was Sie als gefährlichen Angriff auf Ihr
    System betrachten. Aber legen Sie unbedingt eine Vorgehensweise fest, wie Sie
    auf ein solches Ereignis reagieren.'
  merge: -1
  pgno: 112
- img_proc: true
  md: '# Hilfestellungen


    Was ist zu tun, wenn Sie einen Angriff vermuten? Hierzu ist folgende Literatur
    zu empfehlen:


    „Steps for Recovering from a Unix Root Compromise“ (http://www.cert.org/tech/tips/root_compromise.html)


    RFC 2196: Site Security Handbook


    Diese beiden Veröffentlichungen beschreiben Maßnahmen, die auf einen erfolgreichen
    Einbruch folgen sollten. Die Dokumente liefern einen formalen Ansatz, wie eine
    Firma, Behörde oder Bildungseinrichtung reagieren kann. Das kuratierte Vorgehen
    setzt eine Menge an Speicherplatz voraus, um „Snapshots“ des Systems analysieren
    zu können, damit Mitarbeiter für die Sicherheitsprobleme verantwortlich sind,
    in denen es angebracht erscheint, Strafverfolgungs-Maßnahmen zu ergreifen.


    Was ist zu tun, wenn Sie erfolgreichen Angriff vermuten:


    +   * Es ist wichtig, sich Ruhe zu bewahren. Unbeachtete Handlungen könnten Informationen
    zerstören (z. B. Prozesse, die von einem Eindringling gestartet wurden).


    +   * In der Security-Policy sollte festgelegt sein, was zu tun und wer zu informieren.
    Die Kommunikation sollte aber nicht per E-Mail, sondern via Telefon oder Fax erfolgen.


    +   * Trennen Sie die Netzwerkverbindungen zur Firewall physikal. Es ist keine
    gute Idee, den Rechner herunterzufahren. Wichtige Informationen könnten verloren
    gehen, z. B. Programme, die vom Eindringling gerade gestartet wurden.


    +   * Listen Sie alle laufenden Prozesse mit ps auf und suchen Sie nach Proz,
    die im Normalbetrieb der Firewall nicht auftreten.


    +   * Erstellen Sie eine Prozesstabelle für die Inbetriebnahme der Firewall, die
    Sie als Vergleichsgrundlage verwenden.


    +   * Untersuchen Sie die laufenden Prozesse nach Bindungen an ungewöhnliche TCP-
    oder UDP-Ports.


    +   * Wurden die Paketfilter-Regeln verändert?


    +   * Vergleichen Sie alle Konfigurationsdateien mit der originalen Konfiguration.
    Das ist bei „SuSE Linux auf CD“ sehr einfach. Die Konfiguration ist auf dem Adminhost
    gespeichert. Hierfür ist jedoch wichtig, Sie den Firewall-Rechner nicht neu starten,
    wenn sonst Änderungen an den Filterregeln verloren gehen!


    +   * Sicher Sie außerdem alle Logfiles. Die Logfiles können strafrechtlich relevante
    Beweismittel sein. Dokumentieren Sie alle Schritte, die Sie unternehmen. Wenn
    Sie die Logfiles lokal auf der Festplatte speichern, sollten Sie eine 1:1-Kopie
    der Festplatte für Dokumentationszwecke anfertigen.


    +   * Sicher Sie Ihre Daten auf CD oder einem anderen Medium (Bandlaufwerk, ZIP-Drive).'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# 7.5 Maßnahmen im Falle eines Einbruchs


    +   * Werten Sie die Logfiles aus: Wer versuchte wann und wo aus (IP-Adresse,
    Domainname, eventuell sogar Benutzername) auf welche Dienste/Ports zuzugreifen?
    Wurde versucht, Passwörter zu raten (mehrfach fehlgeschlage-ne Login-Versuche
    mit einem und denselben Benutzerkennungung)?


    +   * Sorgen Sie darauf, dass Sie für alle ihre Rechner/Server eine einheitliche,
    genaue Zeitquelle verwenden. Es ist wichtig, dass die Rechner- und die Firewall-Logs
    möglichstst übereinstimmen. Wenn möglich, verwenden Sie eine gemeinsame Zeitquelle
    für alle ihre Server. Nur so sind Ereignisse auf verschiedenen Rechnern genau
    zzu-ordnen.


    +   * Welche Teile der Security-Policy wurden verletzt? Dies ist vor allem bei
    internen Angriffen von Bedeutung.


    +   * Deaktivieren Sie den Benutzer-Account in Ihrem Netzwerk, der den Angriff
    durchgeführt hat. Das jeweilige Vorgehen bei internen Verstößen sollte sich geregelt
    sein (Security- bzw. Firmenpolitik).


    # 7.52 Angriffe von außen


    Informieren Sie den Adress-zuständigen Systemadministrator (via Postmaster-bzw.
    Abuse-Adresse des Domain).


    Es geht sich um die Logfiles, welche Informationen Sie weitergeben sollten. Der
    Be-richt über einen Zwischenfall oder Angriff soll neue Informationen enthalten,
    um einen der anderen Seite es zu ermöglichen, das Problem zu ermitteln. Denken
    Sie daran, dass Ihre Kontaktperson derjenige sein könnte, die Sie angegriffen
    hat. Hier ist eine Liste der möglichen Angaben, die Sie weitergeben können. Wählen
    Sie aus, wie Sie weitergeben wollen:


    +   * Ihre E-Mail-Adresse,


    +   * Telefonnummer,


    +   * Ihre IP-Adresse, Hostname, Domainname,


    +   * die IP-Adressen, Hostnamen, Dommannamen, die an dem Angriff beteiligt waren,


    +   * das Datum und die Uhrzeit des Angiffs, am besten mit Zeitzone relativ zur
    GMT,


    +   * eine Beschreibung des Angiffs,


    +   * wie der Angriff bemerkt wurde,


    +   * Auszüge dem Logfiles, die sich auf den Angriff beziehen,


    +   * eine Beschreibung des Logfile-Formats,


    +   * Angaben von Advisories und Security-Informationen, welche die Art und Schwere
    des Angiffs beschreiben,'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Hilfestellungen


    +   * was Sie von der angesprochenen Person fordern, z. B. das Schließen eines
    Accounts, Bestätigung des Angriffs, eine Erklärung, eine Information, Bitte um
    weitere Beobachtung.


    Wenn alle Maßnahmen zur Datensicherung und Dokumentation durchgeführt haben, nehmen
    Sie Ihre Firewall wieder in Betrieb. Möglich möglich, wenn Sie die Loglevel der
    einzelnen Programme. Es ist ziemlich sicher, dass der Angreifer erneut versucht,
    in Ihr System einzudringen. Das ist dann der Moment, in dem Sie die Möglichkeit
    haben, den Angreifer dingfest zu machen.


    Beispiele:


    Melden Sie sich auf der Konsole an.

    Untersuchen Sie die Logfiles.

    Zum Beispiel:


    ```

    # grep DENY /var/log/messages | less

    Mit diesem Befehl sehen Sie alle Zeilen, die DENY enthalten, die auch vom Paketfilter
    des Kernels aufgezeichnet worden sind. Sie können jetzt z. B. nach bestimmten
    auffällig aufgezeichneten IP-Adressen suchen (häuftes Auftreten von DENY-Meldungen
    von IP-Adressen). Find Sie heraus, was passiert ist. Mit den oben beschriebenen
    Werkzeugen lassen sich die Logfiles nach definierbaren Kriterien filtern. Problem:
    Manchmal weiß man nicht, was man sieht, was es ist... Es kann sein, dass ein Systemadministrator
    eines anderen Netzwerks von Ihnen via Postmaster- bzw. E-Mailadresse meldet und
    sich beschwert, dass ihm von Netz aus Angriffe auf fremde Regeln stattgefunden
    haben. Nehmen Sie sich Zeit, alle alle Protokolle über die Angriffspunkte zu Datum
    und Uhrzeit haben und mit Mitteln das fremde System angegriffen haben. Versuchen
    Sie, die Tat zu verifizieren. Es kann sein, dass ein Hacker, Hacker oder Angreifer
    Ihre Sicherheitsbeschränungen erweitert und Ihr Netzwerk für seine Zwecke missbraucht.
    Hier steht der Ruf Ihres Unternehmens auf dem Spiel.

    ```


    Wenn Sie alles gesehen und dokumentiert haben, überprüfen Sie Ihre Firewall-Konfiguration.
    Nach Beheben von eventuellen Fehlern oder Diensten, die Sie für gefährdet halten,
    starten Sie Ihre Firewall neu. Hier zeigt sich ein klarer Vorteil der „SuSE Linux
    Firewall auf CD“, den durch Booten des Firewall-Reachers der ursprüngliche Zustand
    wiederherstellt, eine aufwendige Neuinstallation des Betriebssystems und das Einspielen
    von Backups entfällt.


    # 7.5.3 Vorteil des Live-Filesystems der „SuSE Linux Firewall on CD“


    Einer großen Vorteile der SuSE Firewall ist, dass sie durch einfaches Booten in
    den Ausgangszustand zu setzen ist. Dies ist natürlich zu beachten, auch wenn eventuelle
    Konfigurationsfehler wieder vorhanden sind.'
  merge: -1
