  md: '# 4.3 Erstellen einer neuen Firewall-Konfiguration


    +   - Mit dem ''Aktion''-Auswahlfeld wählen Sie zwischen ''allow'' zum Erlau-n
    bzw. ''deny'' zum Verieten der Internetzugriffe, die Sie im nachfolgen-den stern
    festlegen können.


    +   - Bestimmen Sie über ''ACL'' eine bereits angelegte Liste, für die die Einst-nlungen
    gelten werden.


    +   - Bestimmen Sie über ''Negate ACL'' eine ACL, die negiert eingesetzt werden
    soll. So können Sie das Abrufen von Internetseiten erlauben (Aus-wahl bei ''ACL''),
    die nicht über SSL-Ports laufen (Auswahl bei ''Negate ACL'').


    +   - Eine neue Regel binden Sie über ''Hinzufügen'' ein.


    +   - Zum Editieren von Regeln klicken Sie auf das entsprechende Listenfeld ein.
    Daraufhin werden die Einstellungen im oberen Teil übernommen. Sie kön-nen diese
    nun wieder verändern und mit ''Bearbeiten'' übernehmen.


    +   - Zum Löschen von Regeln wählen Sie das entsprechende aus und klicken auf
    ''Löschen''.


    +   - Im unteren Teil des Fensters finden Sie ein Listenfeld, in dem alle Aktionen
    und zuhörigen ACL-Einstellungen eingetragen sind.


    ![](img/594883f46b5a0951172f1e794f42a4a5_56_0.png)


    > Achtung

    Die Reihenfolge der Regeln im Listenfeld ist sehr wichtig, denn die auf-gestellte
    Liste wird von oben nach unten abgearbeitet. Je nachdem, wie sie zuerst zutrifft,
    wird der Zugriff auf die angeforderte URL freigege-ben oder gesperrt.


    +   - Um eine Regel an eine Stelle zu verschieben, wählen Sie das entsprechende
    Regel und aktivieren Sie im rechten Rand des Fensters zum Verschieben nach unten
    die Schaltfläche mit dem blauen Pfeil nach unten; zum Verschie-ben nach oben die
    Schaltfläche mit dem blauen Pfeil nach oben.


    +   - Haben Sie alle Änderungen vorgenommen, bestätigen Sie die Einstellung-en
    mit ''Weiter''.


    # Content Filter


    Um HTML. Seiteninhalte zu filtern bzw. bestimmte Seiteninhalte zu durch-chen und
    in zu speichern, zu aktivieren, verwenden Sie die Checkbox bei ''Content Filter''
    (vgl. Abbildung 4.31 auf der nächsten Seite).


    ![](img/594883f46b5a0951172f1e794f42a4a5_56_1.png)


    > Hinweis

    Sie sollten HTML programmieren können, um diesen Filter zu konfigurie-ren. Die
    „Tags“ und „Attribute“, von denen im Folgenden die Rede ist, sind Komponenten
    aus HTML, der Beschreibungssprache, in der Webseiten ge-schrieben.'
