    "postfix" (grep postfix /var/log/mail)


    +   * Testen Sie die FTP-Proxies, z. B. mit telnet auf Ihre Firewall.


    +   * Testen Sie den HTTP-Proxy, indem Sie versuchen, von einem Client aus das
    Internet zu erreichen.


    +   * Testen Sie ssh, indem Sie sich von einem Client aus auf die Firewall anmelden.


    Überprüfen Sie immer Vorgänge anhand der Logfiles.


    # 4.6 Dokumentation der Konfiguration, der Tests und der Ergebnisse


    Es ist wichtig, dass Sie die Konfiguration, die durchgeführten Tests und deren
    Ergebnisse dokumentieren. Halten Sie also fest, was durch die Konfiguration erlaubt
    oder verboten ist und wie dies gewährleistet wird.


    Anhand solcher Dokumentation können Sie eventuelle Konfigurationsfehler finden
    und beheben. Die Dokumentation ist auch für eine Auditierung der Firewall nichtwend.


    # 4.7 Überwachung der Firewall


    Wie bereits betont, ist eine Firewall ohne ständige Überwachung nur eingeschränkt
    wir. Für die Überwachung der Firewall stehen auf dem Adminhost der Firewall einige
    Werkzeuge bereit. Die wichtigste Quelle für Informationen sind die Log-Dateien,
    die von der Firewall nach Konfiguration auf Festplatte oder Loghost geschrieben
    werden.


    Als Werkzeug zur Auswertung der Logfiles stehen folgende Programme zur Verfügung:


    +   * xlogmaster


    +   * logsurfer'
