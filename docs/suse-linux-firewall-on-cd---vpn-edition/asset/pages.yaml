  md: '# 4.3 Erstellen einer neuen Firewall-Konfiguration


    ![](img/594883f46b5a0951172f1e794f42a4a5_52_0.png)


    Abbildung 4.26: Konfiguration des FTP-Servers


    IP-Adresse des FTP-Servers: Die IP-Adresse Ihres FTP-Servers, der in Ihrem Intranet
    bzw. der DMZ steht.


    FTP-Proxy-Port: Der Port, auf dem Ihr FTP-Server horcht, normalerweise ist das
    Port 21. Damit wird von außen betrachtet, Ihre Firewall zum FTP-Server. Lassen
    Sie sich von Ihrem Provider für Ihre Firewall Alias-Eintrag im DNS geben, z. B.:
    `ftp.mycompany.com`


    Maximale Anzahl: Maximale Anzahl an FTP-Clients, die gleichzeitig mit dem FTP-Server
    verbinden dürfen.


    Höre auf ausgewählte IP-Adresse: IP-Adresse des Interfaces, auf dem der FTP-Server
    Verbindungen empfängt.


    # 4.3.9 Konfiguration des FTP-Proxies von intern nach extern:


    FTP-Proxy-Port: 10021


    Port, auf dem FTP-Proxy angesprochen wird.


    Magic Char: Wenn Sie dieses Zeichen aktivieren, wird im Benutzernamen der ausgewählten
    Ziel-FTP-Server angegeben: user[@host:port]. Das sieht zum Beispiel so aus:


    +   * ftp@remotftp.remote.org:21


    Magic Char: Das MagicChar-Zeichen ist standardmäßig auf „% eingestellt. Wenn die
    Option „Magic User“ aktiviert ist, kann das Zeichen beliebig gewählt werden.


    Maximal Clients: Maximale Anzahl an offenen Verbindungen auf den FTP-Proxy.


    Höre auf ausgewählte IP-Adresse: IP-Adresse, über die der FTP-Proxy angesprochen
    wird.'
