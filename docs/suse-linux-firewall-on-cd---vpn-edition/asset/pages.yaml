  md: '# 5 SuSE Linux Live-CD for Firewall


    # 5.1 Einführung


    „Live-CD“ zur SuSE Linux Firewall on CD ist der „ausführende“ Teil der Firewall.
    Die Live-CD ist ein minimales, nach Sicherheitskriterien ausgerichtetes SuSE Linux.
    Dies betrifft die Programme, die zur Verfügung stehen, ebenso ein „Application
    on Level Gateway“, das heißt, welches als Sicherheitsgateis Routing von IP-Paketen
    vorgenommen wurde. Die Weiterleitung von Anfragen an Dienste wird durch Anwendungen
    (= Proxies) gehandhabt.


    Mit Proxies und Non-Forwarding von IP-Paketen kann man noch nicht verhindern,
    dass (unwünschte) IP-Pakete vom Internet ins Intranet und umgelehrt werden. Diese
    Firewall-Funktionalität wird durch den Paketfilter des Kernels übernommen, welcher
    ipchains(8) konfiguriert wird. Verwendung findet das Konzept der CD. Das bedeutet,
    dass das Betriebssystem und alle Programme auf einem Read-Only-FileSystem auf
    einer CD befinden. Beim Booten wird ein RAM-Disk erstellt, mit dem die Live-CD
    gemountet wird. Eine Wiederholung des „status quo ante“ ist durch einfaches Reboot
    des Rechners möglich. Wenn das Update der „SuSE Linux Firewall auf CD“ tauschen
    Sie die Live-CD gegen die aktuelle Update-CD aus und starten Ihren Firewall-Rechner
    neu.


    Die Konfiguration des Systems und der Dienste erfolgt durch eine Diskette, auf
    der alle notwendigen Konfigurationsdateien gespeichert sind. Dies wird beim Boot-Vorgang
    „read only“ gemountet, vorsichtshalber lässt sich jedoch auch schreibgeschützt.
    Die Daten der Konfigurationsdiskette werden in die RAM-Disk kopiert, damit der
    Datenträger wieder aus dem Dateystem entfernt.


    Hardwareanforderungen:


    +   * Die SuSE Linux Live-CD for Firewall ist auf jedem x86, ab x=5, laufig. Empfohlen
    wird mindestens ein Pentium II.

    * Es sind mindestens 128 MB RAM notwendig.

    * ein Diskettenlaufwerk 3,5 Zoll,

    * ein bootfähiges CD-ROM-Laufwerk und

    * mindestens zwei Netzwerkschnittstellen.


    Dieses Kapitel liefert keine Anleitung zur Konfiguration der Dienste, sondern
    eine technische Dokumentation für den Administrator,'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# SuSE Linux Live-CD for Firewall


    der sich mit den Internas des Systems auseinandersetzen will. Hier werden auch
    Details der Konfigurationsdateien der Dienste auf Live-CD beschrieben. Zur Konfiguration
    sogenannte das Firewall Administration System (FAS) auf dem SuSE Firewall Administration
    Host verwendet.


    # 5.2 Beschreibung der SuSE Linux Live-CD for Firewall


    „SuSE Linux Live-CD for Firewall“ ist eine Live-File-System-CD, von der alle Programme
    direkt laufen. Theoretisch ist es möglich, den Live-Rechner ohne Festplatte zu
    betreiben. Sie sollten allerdings beachten, dass Proxy wie z. B. Squid oder postfix
    eine Festplatte für Cache- oder Spoolverzeichnis benötigen. Eine Festplatte ist
    auch notwendig, wenn Sie die Log-Meldungen von syslog lokal speichern wollen.
    Um das Firewall-System in Betrieb zu nehmen, legen Sie die CD und die mit dem
    SuSE Firewall Adminhost erstellte Konfigurationsdatei ein und booten den Brenner.


    # 5.3 Die Dienste auf der Firewall


    Auf der „SuSE Linux Live-CD for Firewall“ befinden sich „Application Level Gateways”(Proxies)
    für die gängigsten und wichtigsten Internetprotokolle:


    +   **DNS (engl. Domain Name System):** Die Umsetzung von IP-Adressen in „Fully
    Qualified Domain Names“ und umgekehrt erfolgt mit bind


    +   **SMTP** Der Transport von E-Mail übernimmt postfix


    +   **HTTP/HTTPS – das Protokoll des WWW:** Squid, httpf, transproxy, tinypoxy


    +   **FTP** für die Datenübertragung von einem Host zu einem anderen wird ftp-proxy-seite
    genutzt.


    +   **SSH** Der „remote login“ mit verschlüsselter Übertragung erfolgt mit openssh,
    die Authentifizierung mit RSA-Schlüssel-Paaren.


    +   **inetd** Generischer tcp Proxy rinetd


    +   **ntp** Zeitserver xntpd


    +   **ipsec** FreeS/WAN


    Bei allen diesen Programmen handelt es sich um Open-Source-Software. Auf der „SuSE
    Linux Live-CD for Firewall“ laufen alle diese Prozesse in chroot-Umgebungen.


    Um die Sicherheit des Systems noch weiter zu erhöhen, werden folgende Programme
    bzw. Kernelmodule für den auf Live-CD eingesetzten Linux Kernel (2.2.19) verwendet:
    secumod, compartment, OpenWall-Patches.'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# 5.3 Die Dienste auf der Firewall


    # 5.3.1 IPCHAINS


    Der Paketfilter des Linux-Kernels 2.2.xx wird mit dem Programm ipchains konfiguriert.
    Mit ipchains ist eine äußerst flexible Konfiguration des Kernel-Paketfilters möglich.
    Lesen Sie auch die Man-Page von ipchains(8).


    Standardmäßig kennt ipchains(8) zwei Paketfilter-,„Chains“ input-chain, forward-chain
    und output-chain.


    Diese entscheiden über das Schicksal eines IP-Pakets, das auf einem Interface
    kommt. Es ist empfehlenswert, für diese „chains“ eine Policy festzulegen, die
    alle Pakete abhnt. Dies ist das Default-Verhalten der Chains: Alles, was nicht
    ausdrücklich erlaubt ist, ist verboten.


    IP-Pakete durchlaufen die Chains und Ziel-Adresse -Port entsprechend, was heißt
    weitergeleitet, verworfen oder rückgewiesen. Auf dem „SuSE Linux Live-CD for Firewall“
    gibt es grundsätzlich zwei Möglichkeiten, IP-Filterreg zu konfigurieren. Die erste
    und wohl bequemere ist die Verwendung des SuSE Firewall Scripts. Die Konfiguration
    für das SuSE Firewall Skript erfolgt in Abhängigkeit von den konfigurierten und
    aktivierten Diensten. Der SuSE Firewall Administration System (FAS) bietet Zugriff
    auf dasSE Firewall Skript. Die zweite Möglichkeit besteht darin, dass Sie einen
    eigenen Paketfilter mit ipchains konfigurieren. Zuerst geben wir Ihnen eine Übersicht
    über das SuSE Firewall Skript und anschließend Hinweise zur Erstellung eines Paketfilters.


    # Das SuSE Firewall Script und seine Konfiguration


    Dies ist eine technische Beschreibung, wie die Filterregeln generiert werden,
    und welche Hintergründe das neue Design des SuSE-Firewall-Scripts haben. Die Dokumentation
    ist aber keine Beschreibung, /etc/rc.config.d/firewall.rc.config konfiguriert
    – die Konfigurationsdatei enthält keine Kommentare, die die Bearbeitung erleichtern.
    Deswegen finden sich in dem Verzeichnis /usr/share/doc/packages/SuSEfirewall einige
    Beispielkonfigurationen. Inzwischen gibt es auch FAQ-Liste im gleichen Verzeichnis.
    Beachten Sie, dass in der Dokumentation um „Firewall“ die Rede sein, obwohl dieses
    Skript dies nicht nimmt. Dieses Paket ist ein sogenannter „Paket-Filter“, der
    auf TCP/IP-Daten zulässig oder verbietet. Mit anderen Worten: Wenn Sie einen WWW-Server
    betreiben und Sie die Kommunikation mit ihm und z. B. dem Internet erlauben, kann
    dieses Script nicht schützen, wenn der Webserver als solcher Sicherheitsproblem
    aufweist. Es ermöglicht Ihnen doch, Ihre Konfiguration zu schützen, welche nicht
    zugänglich sein sollen, sowie Angreifer über Filterverstöße zu dunkeln und Angriff
    auf das Feststellen zu erkennen.


    83'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# SuSE Linux Live-CD for Firewall


    Die Ansprüche an das Design des SuSE Firewall Skripts:


    +   - Sicherheit über alles

    Wer Paket installiert und konfiguriert, erwartet, dass das Skript alles tut, was
    möglich ist, um das System abzusichern. Ein Benutzer muss dies in Kauf nehmen,
    dass keine Dinge schwiger oder eventuell (in wenigen Fällen) überhaupt nicht über
    dieses Paket konfiguriert werden. Zudem ist mit der Einrichtung eines solchen
    Pakets ein gewisser Zeitaufwand gebunden.

    - Bei Fehler keine Kompromittierung des Systems

    Ein Fehler im Skript oder ein Fehler in der Konfigurationsdatei sollte nicht zu
    offenen Filterregeln umgesetzt werden. Dieses Ziel ist in bestimmten Bereichen
    nicht. SuSE hat sich Mühe gegeben, dies zu erreichen.

    - Einfache Konfiguration

    Es werden wenige Frage gestellt – sondern werden so viele gestellt, die unbedingt
    notwendig sind. Das ist natürlich die größte Herausforderung – und trotzdem muss
    man Wissen zu TCP/IP, Administrator-Kenntnisse, ein Gefühl für Sicherheit und
    Geduld mitbringen...


    +   - Automatisierte Konfiguration

    Um die Konfiguration zu vereinfachen und auch dynamische Systeme zu unterstützen,
    hat das SuSE-Team versucht, diese Daten möglichst erst zum Zeitpunkt des Startens
    des Firewall-Skriptes in Erfahrung zu bringen.

    - Unterstützung von dynamischen IP-Adressen + Netz

    Es werden nicht nur dynamische IP-Adressen, sondern mehrere Netzwerkkarten (unbegrenzt
    viele) zum Internet wie zu internen Netz unterstützt.


    Im folgenden Absatz wird mehrfach von Filterregeln für interne Interfaces und
    Netze gesprochen, die sich auf interne Interfaces oder Netze beziehen, werden
    abgearbeitet, wenn diese beim Start des Firewall-Skripts konfiguriert und vorhanden
    sind. Wenn nach dem Start des Skripts erst zugänglich, z. B. weil das Interface
    nach zuerst ausgeschaltet („down“) war, dann ist keine Kommunikation mit diesem
    Netz möglich!

    Der Ablauf des SuSE-Firewall-Skripts, das in /sbin befindet, stellt sich folgendmaßen
    dar:


    +   a) Zuerst wird die Konfigurationsdatei /etc/rc.config/firewall.rc eingelesen.
    Der Benutzer muss /etc/rc.firewall erst konfigurieren, bevor etwas passieren kann.
    Diese Dateien werden bei der Verwendung von FAS angelegt.

    b) Dann werden die Hilfsprogramme wie sed, awk, grep, ifconfig, netstat und natürlich
