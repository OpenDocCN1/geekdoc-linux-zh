  md: '# SuSE Linux Live-CD for Firewall


    /etc/rc.config/d dieses Verzeichnis enthält weitere Konfigurationsdateien, die
    von SuSEconfig gelesen werden;


    /etc/rc.config/firewall.rc.config Konfigurationsdatei für das SuSE Firewall Skript.
    Diese Datei wird vom FAS als den SuSE Linux Adminhost für Firewall erzeugt.


    /etc/runlevel.firewall Hier findet eine Zuordnung von Skripten/Programmen zu den
