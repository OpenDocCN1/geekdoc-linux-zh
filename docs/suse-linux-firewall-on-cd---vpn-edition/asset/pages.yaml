    FW_SERVICES={WORLD,DMZ,INT}_TCP="139" gesetzt werden. Es ist grund-

    sätzlich keine gute Idee, Samba auf einem Firewall-Rechner einzusetzen.

    ```


    +   13. Welche Dienste, die über Netzwerk erreichbar sein sollen, Zugriff auf

    die DMZ oder interne Netzwerk haben?


    Mit dieser Option können Sie den. b. Zugriff für Mailserver er-

    lauben. Diese Rechner müssen eine gültige IP-Adresse haben. Es wird eine

    offffene Verbindung zu Ihrem Netzwerk aufgebaut, aber ist diese Option

    nur für Zugriffe auf Ihre DMZ. Folgende Wege sind möglich: Lassen

