  md: "# man in the middle: sniffing, tcp connection hijacking, spoofing\n\nGanz allgemein\
    \ gilt: Ein Angriff auf Netzwerk, der der Angreifer eine Position zwischen zwei\
    \ Kommunikationspartnern einnimmt, nennt sich „man in the middle attack“. Sie\
    \ haben in der Regel niemals: Das Opfer nicht davon. Viele Varianten sind denkbar:\
    \ Der Angreifer nimmt die Verbindung entgegen, damit das Opfer mit ihm selbst\
    \ eine Verbindung zum Ziel macht. Das Opfer hat auch, wenn es zu, eine Netzwerkverbindung\
    \ zum falschen Rechner öffnet, welcher sich als das ausgeben. Der einfachste „man\
    \ in the middle attack“ ist ein „sniffer“. Ein Belauscher macht sich die Verbindungen,\
    \ die ihm vorher aufführt (sniffing = engl. schnuffeln).nKomplexer wird es, wenn\
    \ der Angreifer in der Mitte versucht, eine etabierte, bestehende Verbindung zu\
    \ übernehmen (entführen = engl. hijacking).\n der Angreifer die Pakete, die an\
    \ ihn vorgegeben werden, welche weilang analysiert, damit er die richtigen TCP-Sequenznummern\
    \ der TCP-Verbindung verfälschen kann. Wenn er die Rolle der Verbindung übernimmt,\
    \ merkt das das Opfer, der auf der Seite des Opfers die Verbindung unstimuliert\
    \ wird.\n\nDer Angreifer profitiert aus Schwachstellen in Protokollen, die nicht\
    \ kryptographisch gesichert sind und bei denen zu Beginn der Verbindung eine Authentifizierung\
    \ stattfindet. „Spoofing“ nennt sich das Verschicken von Paketen mit modifizierten\
    \ Absenderdaten, hauptsächlich auf der IP Adresse.\nDie massiven Angriffsvarianten\
    \ das Verschicken von gefälschten Paketen, was unter Unix/Linux nur auf dem Superuser\
    \ (‘root’) darf.\nViele der Angriffsmöglichkeiten in Kombination mit einem DoS\
    \ gibt es eine Möglichkeit, einen Rechner schlagartig vom Netzwerk zu trennen\
    \ (wenn nur für kurze Zeit), dann wirkt sich das auflichen einen aktiven Angriff\
    \ aus, wenn keine Grenzen mehr gewartet werden.\n\n# DNS poisoning\n\nDer Angreifer\
    \ versucht, mit gefälschten („spoofed“) DNS-Antwortpaketen den cache eines DNS-Servers\
    \ zu vergiften (, poisoning), so dass dieser die falsche Information an einen\
    \ Opfer weiteribt, der nach fragt. Ein DNS-Server ohne falschen Informationen\
    \ wenige Pakete des Servers zurückzugeben, können, der normaler nur Anfragen und\
    \ analysieren. Weil ein Server ein Vertrauensverhältnis zu anderen Rechnern aufgebaut\
    \ durch IP Adresse oder seines Hostnamen konfiguriert hat, kann ein solcher Angriff\
    \ trotz des eingehaltens recht schnell Früchte tragen. Voraussetzung ist allerdings\
    \ eine gute Kenntnis der Vertrauensstruktur zwischen diesen Rechnern. Ein zeitlich\
    \ genau abgestimmter Doos gegen einen DNS-Server, den Daten gefälschen, ist aus\
    \ Sicht des Angreifers meistens nicht vermeidbar.\n\nAbhilfe schafft wieder eine\
    \ kryptographisch verschlüsselte Verbindung, die die Identität des Ziels der Verbindung\
    \ zu verifizieren."
  merge: -1
