    Datei B.7.2: Zugiffsregeln


    # B.7.2 SquidGuard


    Dieses Kapitel soll lediglich eine Einführung zur Konfiguration von SquidGuard
    sowie ein paar Ratschläge zu dessen Einsatz geben. Auf eine umfangreiche Erklärung
    an dieser Stelle wird verzichtet. Weitere Informationen finden Sie auf dem Webseite
    zu SquidGuard: http://www.squidguard.org SquidGuard ist ein freier-Controller
    (GPL), flexibler und ultraschneller Filter, Umleiter und „Zugriffe-Controller-Plugin“
    für Squid. Er ermöglicht das Festlegen einer Vielzahl von Zugiffsregeln mit unterschiedlichen
    Beschränkungen für verschiedene Benutzergruppen für einen Squid-Cache. SquidGuard
    verwendet die Datenschnittstelle von Squid und kann u. a. für Folgendes verwendet
    werden:


    +   * Beschränkung des Internetzugiffs für einige Benutzer auf bestimmte akzeptierte/bekannte
    Web-Server und/oder URLs.

    * Zugiffsverweiger für einige Benutzer auf bestimmte Web-Server und/oder URLs.

    * Zugiffsverweiger für einige Benutzer auf URLs, die bestimmte reguläre Ausdrücke
    oder Wörter enthalten.

    * Umleiten gesperrter an eine „intelligente“ CGI-basierte Infoseite

    * Umleiten nicht registrierter Benutzer an ein Registrationsformul.

    * Umleiten von Bannern an ein leeres GIF.

    * Unterschiedliche Zugiffsregeln abhängig von der Zeit, dem Wochentag, dem Datum.

    * Unterschiedliche Regeln für einzelne Benutzergruppen


    Weder mit SquidGuard noch mit Squid ist folgendes möglich:


    +   * Textinhalt von Dokumenten filtern, senieren oder editieren

    * In HTML eingebettete Skriptsprachen wie JavaScript oder VScript filtern, senieren
    und editieren


    # Verwendung von SquidGuard


    Installieren Sie das Paket squidgrd aus der Serie n. Editieren Sie die Konfigurationsdatei
    /etc/squidguard.conf. Es gibt zahlreiche andere Konfigurationsbeispiele unter
    http://www.squidguard.org/config/. Sie können später mit komplizteren Konfigurationsseinstellungen
    experimentieren.'
