- img_proc: true
  md: 'In Bezug auf „Lokale Sicherheit“ besteht die Aufgabe darin, die einzelnen Be-

    utzer voneinander zu trennen, dass keiner Benutzer die Rechte oder die

    Identität eines anderen Benutzen annehmen kann. Dies gilt im Allgemeinen,

    im Speziellen ist natürlich besonders ‚root‘ im System Allmacht hat; kann der
    Benut-

    zer root unter ohne Passwort zu

    jeden lokalen Benutzer werden und jede lokale Datei leisten.

    Die Liste der Möglichkeiten, ein System anzugreifen, wenn man bereits Zugriff

    auf lokale Ressourcen hat, ist die Kommandozeile, ist recht lang.


    # Passwörter


    Ihr Linux-System speichert Passwörter nicht etwa als Klartext und vergleicht\ein
    eingegebenes Passwort mit dem, was gespeichert ist. Bei einem Diebstahl der

    Datei, in der Passwörter speichern, wären ja alle Accounts auf Ihrem Sy-

    kompromittiert. Wenn Ihr Passwort verschlüsselt haben, wird dies wieder versch-

    lüsselt und gespeichert, was als verschlüsseltes Passwort

    speichert ist. Dies macht natürlich nur Sinn, wenn man aus dem verschlüsselt

    verschlüsselten Passwort nicht das Klartextwort errechnen kann. Dies erreicht

    man so viele „Faltalgorithmen“, die nur in eine Richtung funktio-

    nieren. Ein Angreifer, der das verschlüsselte Passwort in seinen Besitz gebracht,

    hat kann nicht einfach zurückdrehen und das Passwort schauen, sondern er muss

    alle möglichen Buchstabenkombinationen für ein Passwort durchprobieren, bis

    er dasjenige findet, welches verschlüsselt aussieht wie er ist. Bei Acht-

    staben für Passwort gibt sich beträchtlich viele Kombinationen.

    Mit einem Argument für die Sicherheit dieser Methode in den 70er Jahren war,

    dass der verwendete Algorithmus recht langsam ist und Zeit im Kundenbe-

    reich für das verschlüsseln von einem Passwort gebrauchte. Heuteige PCs sch-

    fen ohne weiteres mehrere hundertausend bis Millionen Verschlüsselungen pro

    Sekunde. Durch diesen Grund werden verschlüsselte Passwörter nicht für jeden

    Benutzer sichtbar sein, und das Passwort dürfen nicht zu ratten sein, in den Fall,
    dass das verschlüsselte Passwort wegen eines Fehlers nicht dochbar wird.

    Ein Passwort wie „Phantasie“ unterschreiben in „Phnt@s13 hilft nicht:

    Suchterregeln können bei Knackprogrammen, die Wörterbücher

    um Nutzen raten, sehr leicht aufgelöst. Besser sind Kombinationen\von Buchstaben,
    die kein bekanntes Wort sind und nur für den Benutzer-

    eine persönliche Bedeutung haben, etwa die Anfangsbuchstaben der Wörter eines

    Satzes, oder nehmen Sie Beispiel einen Buchtitel wie: „Der Name der Rose"\von
    Umberto Eco. Daraus ergibt sich ein gutes Passwort: „DNdrvUE9“. Ein

    Passwort wie „Bierjunge“ oder „Jasmin76“ würde schon jemand erkennen können,

    Die sich oberflächlich gut kennt.


    # Der Bootvorgang


    Verhindern Sie, dass mit einer Diskette oder einer CD-ROM gebootet werden

    kann, indem Sie die Laufwerke ausbauen oder indem ein BIOS-Passwort'
