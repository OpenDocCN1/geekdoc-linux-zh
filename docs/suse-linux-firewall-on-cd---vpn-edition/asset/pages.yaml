  md: '# 4.3 Erstellen einer neuen Firewall-Konfiguration


    für die Konfiguration festlegen. Weiterhin müssen Sie eine Beschreibung der Konfiguration
    eingeben. Diese Beschreibung kann dazu benutzt werden, der Zweck der Konfiguration
    zu erläutern und zu dokumentieren, wer, wann, an der Konfiguration etwas geändert
    wurde. Die Beschreibung der Konfiguration kann später erweitert oder verändert
    werden. Nutzen Sie diese Möglichkeit, gute Dokumentation ist wichtig.


    Bestätigen Sie mit ''OK''.


    Sie sehen jetzt Ihre neue Konfiguration im linken Fenster. Wenn Sie einmal auf
    den Namen klicken, wird rechts die Beschreibung der Konfiguration angezeigt. Sie
    können jetzt die Beschreibung editieren. Um Änderungen an der Konfigbeschreibung
    zu speichern, klicken Sie auf ''Änderungen speichern''. Klicken Sie zweimal kurz
    hintereinander (Doppelklick) auf den Namen Ihrer Konfiguration, um mit der Erstellung
    der Konfiguration zu beginnen.


    In der linken Hälfte finden Sie eine Liste mit den Konfigurations-Modulen, d.
    h. mit den Diensten, Sie für Ihre Firewall konfigurieren können, und der Status,
    in dem sich das jeweilige Modul befindet. Erst müssen Sie die Basis-Modul (''Basismodul'')
    und ''Syslogmodul'') konfigurieren. Solange sich diese Module im Zustand, ''nicht
    konfiguriert'' (symbolisiert durch ein Kreuz) befinden, ist es nicht möglich,
    der anderen Module auszuwählen.


    Die Dienste werden durch Anklicken von der rechten Maustaste und Auswählen von
    ''Dienst aktivieren'' in der Firewall-Konfiguration aktiviert. Dies wird durch
    einen grünen Punkt symbolisiert. Das Basis-Modul und Syslog-Modul sind immer aktiv.


    Liste der verfügbaren Module:


    +   - Basismodul (Netzwerkinterfaces, Hostname, Rootpasswort)

    - DNS Modul (Nameserver)

    - External ftp (Konfiguration des ftp-Proxies von Extern nach Intern/DMZ)

    - External http (Konfiguration des Http-Proxies von Extern nach Intern/DMZ)

    - IPCHAINS-Modul (Import eines selbstgenerierten ipchains Regelsatzes)

    - IPSEC Modul (Konfiguration von IPsec-Tunneln)

    - Internal ftp

    - Internal http

    - Mail Modul

    - NTP Modul (Konfiguration von nntpd zum Abgleich der Computerzeit mit einem Zeitserver)

    - SSH Modul

    - SuSE Firewall Modul (Erstellen eines Paketfilters mit dem SuSE Firewall Script)

    - Syslog Modul (Konfiguration des syslogd auf der Firewall)

    - rinetd Modul (Konfiguration des generischen tcp-Proxies rinetd)'
