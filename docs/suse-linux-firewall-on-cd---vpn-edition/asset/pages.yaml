    werden soll, dann trägt man es in die entsprechende Datei ein.


    /etc/security Die Liste, auf der der Benutzer ''root'' anmelden kann.


    /etc/shadow enthält die verschlüsselten Passwörter. Normalerweise ist dies für
    alle Benutzer ein ''*'', was heißt, dass ist kein Login möglich. Nur für den Benutzer
    ''root'' ist hier ein verschlüsselt Passwort hinterlegt. Es besteht die Möglichkeit,
    in FAS als ''root''-Passwort anzugeben. Damit ein Zugang zur Firewall über SSH-
    und RSA-Schlüssel möglich.


    /etc/squid.conf Konfigurationsdatei für den HTTP-Proxy.

    /etc/ssh/ Enthält die Konfigurationsdateien für openssh: ssh_config und sshd_config.


