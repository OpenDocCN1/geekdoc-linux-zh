  md: 'absucht. Diese Aufgabe ist alles als trivial, denn nur Sie wissen, was ungewöhnlich
    ist und was nicht.


    +   - Verw Sie tcp-wrapper, um den Zugriff auf die einzelnen Dienste Ihres Rechners
    auf die IP-Adressen einzchränken, der Zugriff auf einen bestimmten Dienst explizit
    gestattet ist. Nähere Information zu tcpwrapper finden Sie in der manual page
    von tcpd(8) und hosts_access (man tcpd manage hosts access).


    +   - Nutzen Sie Ihr Sicherheitsdenken redundant ein: Eine Meldung, die zweimal
    eintrifft, ist besser als eine, die Sie nie sehen. Dies gilt genauso für Gespräche
    mit Kollegen.


    # C.2.4 Zentrale Meldung von neuen Sicherheitproblemen


    Wenn Sie ein Sicherheitsproblem finden (bitte überprüfen Sie die zur Verfügung
    stehenden update-Pakete), dann wenden Sie sich vertrauenswoll an die E-Mail-Adresse
    security@suse.de. Bitte fügen Sie eine genaue Beschreibung des Problems bei, zusammen
    mit den Versionsnummer der verwendeten Pakete. Wir werden uns bemühen, Ihnen so
    schnell wie möglich zu antworten. Eine ppg Verschlüsselung Ihrer E-Mail ist erwüns.
    Unser ppg key ist:


    ID:3D25D3D9 1999-03-06 SuSE Security Team security@suse.de>

    Key fingerprint = 73 5F 2E 99 DF DB 94 C4 8F 5A A3 AE AF 22 F22 D5


    Der Schlüssel liegt auch unter http://www.suse.de/security zum Download bereit.'
