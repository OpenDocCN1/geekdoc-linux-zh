  md: '# 4.3 Erstellen einer neuen Firewall-Konfiguration


    ```

    erde: # ipchains -N ipsec\erde: # ipchains -A input -j ipsec

    ```


    Diese Regel führt dazu, dass alle ankommenden Pakete durch diesen Filter geschickt
    werden.


    Dies sollte relativ früh in Ihrem ipchains-Filter passieren, damit Pakete durch
    die ipsec-chain laufen. Das Paket wenn nicht für die VPN-Verbindung bestimmt ist,
    läuft er durch den anderen Filtern.


    Die Regeln in der ipsec-chain werden vom Skript / gesetzt, das ausgeführt wird,
    wenn eine ipsec-Verbindung aufgebaut oder abgebaut wird.


    Speichern Sie wie gewohnt Ihre Filterregeln mit ipchains-save ab. Die zusätzlichen
    Filter werden benötigt, damit beim Start von Ipsec die notwendigen Ports freigeschaltet
    und das Masquerading für die Pakete, die durch den Tunnel geleitet werden, ausgeschaltet
    wird.


    Die IP-Pakete, die durch den VPN Tunnel geleitet werden, werden in der ipchains
    chain „ipsec“ gefiltert. Wenn Sie die Zugriffe auf VPN-Partner oder bestimmte
    Dienste beschränken wollen, müssen Sie weitere Regeln in der Chain „ipsec“ hinzufügen.
    Diese Regeln können Sie mit FAS im Dialog „IP Filter Regeln für VPN Tunnel“ (s.
    4.15 auf Seite 74) erzeugen. Hierbei ist zu beachten, dass diese Regeln für alle
    VPN-Verbindungen dieser Firewall-Konfiguration gelten.


    # Einrichten von Ipsec-Tunnel mit FAS


    Im ersten Dialog des Moduls („Wählen Sie das lokale Zertifikat“) wird das X.509-Zertifikat
    für die Authentifizierung auszuwählen (Abb. 44 auf der nächsten Seite). Dieses
    Zertifikat wird auf dem Firewall-Rechner verwendet, dieses Konfiguration gerade
    bereit wird. Zur Erstellung von Zertifikate siehe Kap. 4.13 auf Seite 61.


    > Hinweis

    Unter „starker Authentifizierung“ versteht man eine Authentifizierung durch Schlüssel
    und Passwort, das nur über zwei Kriterien.


    ![](img/594883f46b5a0951172f1e794f42a4a5_70_0.png)


    Im zweiten Dialog richten Sie die einzelnen VPN-Verbindungen ein. In einer Tabelle
