  md: '# 6.3 Inbetriebnahme


    +   - Stehen alle Dienste zur Verfügung?


    +   - Testen Sie von den internen Client-Rechnern aus, ob die Dienste funktionieren,
    die Sie zugelassen haben. Können Sie z. B. auf http/s zugreifen, E-Mails verschicken,
    per FTP Daten übertragen


    +   - Funktionieren Ihre Verbototsregeln?


    +   - Testen Sie Ihren Paketfilter. Lassen Sie sich mit einem Portscanner wie
    nmap machen. Folgen Sie die Log-Nachrichten auf dem Loghost oder Ihrer Firewall.
    Lassen Sie einen Paketsniffer mitlaufen, um verbotene Pakete aufzuspüren oder
    zu sehen, ob Antworten nicht geliefert werden.


    +   - Werden die Dateien auf dem Loghost beschrieben?


    Fehlerbeseseigung:

    Stellen Sie fest, was nicht funktioniert. Untersuchen Sie die Logfiles nach dem
    Prozessnamen, z. B. Postfix oder named:


    ```

    # grep postfix /var/log/messages

    ```


    bzw.


    ```

    # grep named /var/log/messages

    ```


    Viele Programme kann man in dem „Verboseose-Modus“ schalten. Dadurch erhält man
    detaillierte Auskünfte (die zum Teil allerdings sehr umfangreich ausfallen können...).


    # 6.3.2 Test von extern


    Testen Sie von extern, die freigeschalteten Dienste funktionieren. Versicken Sie
    z. B. E-Mails nach intern. Sie sollten in /var/log/mail auf dem Firewall-Rechner
    die Meldungen von postfix sehen, ob die E-Mails angenommen wurden und an den internen
    Mailserver zugestellt werden konnten. Kontrollieren Sie, ob der Paketfilter funktioniert.
    Das Können Sie mit einem Portscanner verifizieren. Gleichzeitig sollten sich die
    Meldungen des Kernel-Packetfilters in /var/log/messages in den Logverzeichnis
    des Loghosts. Diese befinden sich in „DENY“- und „ACCEPT“-Meldungen. Versuchen
    Sie auch Verbindungen auf Ports aufzubauen, die explizit verboten haben, und versuchen,
    die korrespondierenden Log-Einträge zu finden und dem Ereignis zzuzordnen.


    Wenn Sie einen Loghost verwenden, kontrollieren Sie, ob die Log-Meldungen vollständig
    übertragen werden.


    # 6.3.3 „Echt“ ans Netz gehen


    Erst wenn diese Tests erfolgreich abgeschlossen sind, verbinden Sie den Firewall-Rechner
    mit dem Internet und Ihrem Intranet und starten den Produktktivbetrieb.'
