  md: '# 4.3.2 Syslog-Konfiguration


    In diesem Dialog (vgl. Abbildung 4.10) können Sie das Verhalten des Syslog-Daemons
    konfigurieren. Sie haben die Möglichkeit, die Ausgabe von syslog auf die Feststelle
    und zusätzlich auf einen Log-Host zu legen. Sie können eine Liste von IP-Adressen
    an Rechnern, an denen die Logs geschrieben werden sollen. Diese Rechner müssen
    entsprechend konfiguriert werden, damit sie Logs entgegennehmen können. Der SUSE
    Linux Firewall Administrator ist für diese Aufgaben bereit.


    ![](img/594883f46b5a0951172f1e794f42a4a5_43_0.png)


    Abbildung 4.10: Syslog-Konfiguration


    Die Konfiguration des syslog auf dem SuSE Firewall Adminhost wird im Abschnitt
    4.8 auf Seite 79 erklärt.


    # 4.3.3 DNS-Konfiguration


    In diesem Menü wird der Nameserver-bind konfiguriert. Ausführliche Erklärungen
    zu DNS und bind finden sich im Anhang dieses Handbuchs.


    **DNS Forwarder IP-Adressen:** Hier geben Sie an, welche DNS-Anfragen an eine
    oder mehrere Nameserver weitergeben werden. Dazu sollten Sie die Checkbox „DNS
    Forwarder IP-Adressen“ aktivieren. Jetzt können Sie eine Liste von Nameservern
    hinzufügen, die Anfragen weitergeleitet werden sollen. Wenn Sie die Checkbox „Nur
    auf Forwarder weiterleiten“ aktivieren, werden die Anfragen ausschließlich an
    diese Nameserver weitergeleitet. Wenn diese deaktiviert, werden auch die sogenannten
    „root“-Nameserver (allgemein bekannte Nameserver im Internet) verwendet (vgl.
    Abbildung 4.11) auf der nächsten Stelle.


    **Höre auf ausgewgewählte IP-Adresse(n):** Der bind8-Nameserver muss standardmäßig
    auf allen Netzwerk-Interfaces lahen, die zur Verfügung stehen, Anfragen'
