  md: '# 17.9 Hardware security


    Passwords are a simple method of securing a system. A better method is to use
    a hardware-restricted system which either bars users from a specific area or even
    restricts users from login into a system. Typical methods are:


    +   - Smart cards. With this method user can only gain access to the system after
    they have inserted their personal smart card into the computer and then entered
    their PIN code.

    - Biometrics. This is a better method than a smart card where a physical feature
    of the user is scanned. The scanned parameter requires to be unchanging, such
    as fingerprints or a retina image.


    # 17.10 Data encryption


    The best method of providing ''hacker-proof'' networks is to use encryption, either
    public keys or secret keys. Secret-key encryption techniques use a secret key
    which is only known by the two communicating parties. This key can be fixed or
    can be passed from the two parties over a secure communications link (for example
    over the postal network or a leased line). The two most popular private-key techniques
    are DES (Data Encryption Standard) and IDEA (International Data Encryption Algorithm)
    and a popular public-key technique is RSA (named after its inventors, Rivest,
    Shamir and Adleman).


    The main object of encryption is to provide a mechanism for two (or more) people
    to communicate without anyone being able to read the message. Along with this
    it can provide other services, as as:


    +   - Giving a reassuring integrity check – this makes sure the message has not
    been tampered with by non-legitimate sources.

    - Providing authentication – this verifies the sender identity.


    Initially plaintext is encrypted into ciphertext; it is decrypted back into plaintext,
    as illustrated in Figure 17.11. Cryptographic systems tend to use both an algorithm
    and a secret value, called the key. The requirement for the key is that it is
    difficult to devise new algorithms and also to tell the receiving party that the
    data is encrypted with the new algorithm. Thus, using keys, there are no problems
    with everyone having the encryption/decryption system, because without the key
    it is very difficult to decrypt the message.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_333_0.png)


    Figure 17.11 Encryption/decryption process'
