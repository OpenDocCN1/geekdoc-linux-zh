    Defines the action which should be taken upon detection of a connection. nowait
    defines that there should be no wait in starting up the service daemon, whereas
    wait informs it that it should wait for the service to start.


    Defines the owner of the service.


    Defines the name of the service.


    Defines addition arguments.


    For example:


    | ftp stream tcp nowait root /etc/ftpd ftpd |\n| telnet stream tcp nowait root
    /etc/telnetd telnetd |

    | finger stream tcp nowait guest /etc/fingered fingerd |

    | login stream tcp nowait root /etc/login logid |


    # /etc/initab


    The /etc/initab file is called when the system is initially started. Its general
    format is:


    label : run_level : action : process


    +   * where

    label Specified name.

    run_level Defines run level, such as: 0 (power down), 1 (administratively down),
    s (single user), 2 (multi-user), 3 (remote file sharing), 4 (unused), 5 (firmware)
    and 6 (system restart).

    action Control method that init uses over the execution of the process, such as
    boot (start up the specified process), bootwait (start up the process, but wait
    until the process has started before parsing the configuration file), initdefault
    (set the run level that init enters system up), off (if process in not running,
    ignore this line), once (start process once, and leaves it to run to its end),
    respawn (restart the process, if it has stopped) and wait (wait until the process
    completes before continuing)


    +   process Program that should be used.


    An example is given next:


    ```

    mess:2:bootwait:/bin/cat /etc/message_of_the_day > /dev/console

    r0: 1:wait:/etc/rc

    r1: 2: wait:/etc/rc2

    gol:2:off:/etc/getty tty1

    ```'
