    # 17.10.3 Cracking the code


    A cryptystem converts plaintext into ciphertext using a key. There are several
    methods that a hacker can use to crack a code, including:


    +   **Known plaintext attack.** Where the hacker knows part of the ciphertext
    and the corresponding plaintext, the known ciphertext and plaintext can be used
    to decrypt the rest of the ciphertext.

    - **Chosen-ciphertext.** Where the hacker sends a message to the target, this
    is then encrypted by the private-key and the hacker then analyses the encrypted
    message. For example, a hacker may send an email to the encryption file server
    and the hacker spies on the delivered message.

    - **Exhaustive search.** Where the hacker uses brute force to decrypt the ciphertext
    and tries every possible key.

    - **Active attack.** Where the hacker inserts or modifies messages.

    - **Man in the middle.** Where the hacker is hidden between two parties and impersonates
    each of the other.

    - **The replay system.** Where the hacker takes a legitimate message and sends
    it into the network at some future time.

    - **Cut and paste.** Where the hacker mixes parts of two different encrypted messages
    and sometimes, is able to make a new message, but may trick the receiver into
    doing something that helps the hacker.

    - **Time resetting.** Some encryption schemes use the time of the computer to
    create the key. Resetting this or determining the time that the message was created
    can give some useful information to the hacker.


    # 17.10.4 Random number generators


    One way to crack a code is to exploit a weakness in the generation of the encryption
    key. The hacker can then guess which keys are more likely to occur. This is known
    as a statistical attack.'
