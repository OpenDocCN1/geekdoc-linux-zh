  md: '# # TCP/IP


    # ## 4.1 Introduction


    Networking technologies such as Ethernet, Token Ring and FDDI provide a data link
    layer function that is, they allow a reliable connection between one node and
    on the same network. They do not provide internetworking where data can be transferred
    from one network to another or from one network segment to another. For data to
    be transmitted across a network requires an addressing structure which is read
    by a bridge, gateway and router. The interconnection of networks is known as internetworking
    (or one node). Each part of an internet is a subnet (or subnet). Transmission
    Control Protocol (TCP) and Internet Protocol (IP) are a pair of protocols that
    allows the orderly exchange of information. The IP part corresponds to the network-layer
    of the OSI model and the TCP part to the transport layer. Their operation is transparent
    to the physical and data link layers and can thus be used on Ethernet, FDDI or
    Token Ring networks. This is illustrated in Figure-4.1. The address of the data
    link layer corresponds to the physical address of the node, such as the MAC address
    in Ethernet and Token Ring) or the phone number (for a modem connection). The
    IP address is assigned to each node on the internet. It is used to identify the
    location of the network and any subnets.


    TCP/IP was originally developed by the US Defense Advanced Research Projects Agency
    (DARPA). Their objective was to connect a number of universities and other research
    establishments to DARPA. The resultant internet is now known as the Internet.
    It has outgrown this application and many commercial organisations now connect
    to the Internet. The Internet uses TCP/IP to transfer data. Each node on the Internet
    is assigned a unique network address, called an IP address. Note that any organisation
    can have its own internets, but if it is to connect to the Internet then the addresses
    must conform to the Internet addressing format.


    | Transport | TCP |

    | Network | IP |

    | Data link | Ethernet/ Token Ring/ FDDI/ ISDN |

    | Physical |


    Figure 4.1 TCP/IP and the OSI model'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'The ISO has adopted TCP/IP as the basis for the standards relating to the network
    and transport layers of the OSI model. This standard is known as ISO-IP. Most
    currently available systems conform to the IP addressing standard.


    Common applications that use TCP/IP communications are remote login and file transfer.
    Typical programs used in file transfer and login over TCP communication are `ftp`
    for file transfer program and `telnet` which allows remote log into another computer.
    The `ping` program determines if a node is responding to TCP/IP.


    # 4.2 TCP/IP gateways and hosts


    TCP/IP hosts are nodes which communicate over interconnected networks using TCP/IP
    communications. A TCP/IP gateway node connects one type of network to another.
    It contains hardware to provide the physical link between the different networks
    and the hardware and software to convert frames from one network to the other.
    Typically, it converts a Token Ring MAC layer to an equivalent Ethernet MAC layer,
    and vice versa.


    A router connects a network of a similar type to another of the same kind through
    a point-to-point link. The main operational difference between a gateway, a router,
    and a bridge is that for a Token Ring and Ethernet network, the bridge uses the
    48-bit MAC address to route frames, whereas the gateway and router use the IP
    network address. As an analogy to the public telephone system, the MAC address
    would be equivalent to a randomly assigned telephone number, whereas the IP address
    would contain the information on where the telephone is logically located, such
    as country, area code, and so on.


    Figure 4.2 shows how a gateway (or router) routes information. It reads the frame
    from the computer on network A, and reads the IP address contained in the frame
    and makes a decision whether it is routed out of network A to network B. If it
    does then it relays the frame to network B.


    # 4.3 Function of the IP protocol


    The main functions of the IP protocol are to:


    +   - Route IP frames – which are called internet datagrams around an internet.
    The IP protocol program running on each node knows the location of the gateway
    on the network. The gateway must then be able to locate the interconnected network.
    Data then passes from node to gateway through the internet.'
  merge: -1
  pgno: 78
- img_proc: true
  md: '| Transport | TCP | Internet gateway | Network B |

    |---|---|---|--|

    | Network | IP | IP | IP |

    | Data link | | Convertor to Ethernet, Token Ring, FDDI Modem | Ethernet, Token
    Ring, FDDI Modem |

    | Physical | | | |


    Figure 4.2 Internet gateway layers


    +   - Fragment the data into smaller units, if it is greater than a given amount
    (64 kB).

    - Report errors. When a datagram is being routed or is reassembled an error can
    occur. If this happens then the node that detects the error reports back to the
    source node. Datagrams are deleted from the network if they travel through the
    network for more than a set time. Again, an error message is returned to the source
    node to inform it that the internet routing could not find a route for the datagram
    or that the destination node, or network, does not exist.


    # 4.4 Internet datagram


    The IP protocol is an implementation of the network layer of the OSI model. It
    adds a data header onto the information passed from the transport layer, the resultant
    packet is known as an internet datagram. The header contains information such
    as the destination and source IP addresses, the version of the IP protocol and
    so on. Figure 4.3 shows its format.


    The datagram can contain up to 65 536 bytes (64kB) of data. If the data to be
    transmitted is less than, or equal to, 64kB, then it is sent as one datagram.
    If it is more than then the sender splits the datagram into fragments and sends
    multiple datagrams. When transmitted from the source each datagram is routed separately
    through the internet and the received fragments are finally reassembled at the
    destination. The fields in the IP datagram are:


    +   - Version. The TCP/IP version number helps gateways and nodes interpret the
    data unit correctly. Differing versions may have a different format. Most current
    implementations will have a version number of four (IPv4).'
