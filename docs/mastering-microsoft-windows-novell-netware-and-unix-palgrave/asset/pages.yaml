  md: '# 5.4 TCP specification


    TCP is made reliable with the following:


    +   **Sequence numbers.** Each TCP packet is sent with a sequence number. Theoretically,
    each data byte is assigned a sequence number. The sequence number of the first
    data byte in the segment is transmitted with that segment and is called the segment
    sequence number (SSN).

    * **Acknowledgements.** Packets contain an acknowledgement number, which is the
    sequence number of the next expected data byte in the reverse direction. On sending,
    a host stores the transmitted data in a storage buffer, and starts a timer. If
    the packet is acknowledged then before the timer runs out, else if no acknowledgement
    is received the packet is retransmitted.

    * **Window.** With this, a host sends a window value which specifies the number
    of bytes, starting with the acknowledgement number, that the host can receive.


    # 5.4.1 Connection establishment, clearing and data transmission


    The main interfaces in TCP are shown in Figure 5.4. The calls from the application
    program to TCP include:


    +   * OPEN and CLOSE. To open and close a connection.

    * SEND and RECEIVE. To send and receive.

    * STATUS. To receive status information.


