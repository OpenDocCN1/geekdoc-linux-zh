    with the same port number but each connection will have a different socket number.
    A port number can be any value but there is a standard convention that most systems
    adopt. Table 5.1 defines some of the most common values. Standard applications
    normally use port values from 0 to 255, while unspecified applications can use
    values above 255. Section 5.12 outlines the main ports.


