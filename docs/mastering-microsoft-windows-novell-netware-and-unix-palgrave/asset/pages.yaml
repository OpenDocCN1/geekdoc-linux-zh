  md: "# MASTERING MICROSOFT WINDOWS,\nNOVELL NETWARE AND UNIX\n\n| IDEAL FOR: |\n\
    \ GNVQ/BTEC Degree |\n HNC/HND Professional |\n A Level |\n\nMany computer networks\
    \ are now a hybrid of different types, typically a mixture of two or more different\
    \ operating systems. These systems must successfully integrate the complete system\
    \ to operate properly, in terms of its compatibility, its security or its ease\
    \ of use. This book provides a solid foundation into network operating systems,\
    \ their configuration and their protocols. The main areas covered are:\n\n+  \
    \ * network types * networking topologies\n* Microsoft Windows networks * Novell\
    \ NetWare-networks\n* UNIX networks * networking protocols\n* internetwork communication\n\
    \nThe book:\n\n+   * is easy to follow and highly illustrated with tutorial-based\
    \ worked examples and end-of-chapter exercises\n* is ideal for students on all\
    \ types of computing and business courses, people in business and domestic PC\
    \ owners\n* gives full back-up from the author with electronic mail and a related\
    \ WWW page which contains links to other useful sources of information\n\nWilliam\
    \ Buchanan is a Senior Lecturer at Napier University, Edinburgh. An experienced\
    \ computing author, he acts as a consultant to many companies, including British\
    \ Gas TransCo. He has also helped start up several successful companies.\n\n![](img/da031d9e3a72792b55f2a8fb16c012a5_467_0.png)\n\
    \n| ISBN 0-333-74805-0 |\n| 90101 |\n| 9 780333 748053 |\n\nhttp://www.macmillan-press.co.uk/study/masterseries\n\
    \nRECOMMENDED READING AT AN AFFORDABLE PRICE!"
