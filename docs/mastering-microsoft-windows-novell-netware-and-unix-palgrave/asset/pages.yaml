    # 13.1.1 Ethernet3z transceiver


    The IEEE 802.3z task force spent much of their time defining the Gigabit Ethernet
    standard for the transceiver (physical layer), which is responsible for the mechanical,
    electrical and procedural characteristics for establishing, maintaining and deactivating
    the physical link between network devices. The physical layers are:


    +   - 1000BASE-SX (Low cost, multi-mode fibre cables). These can be used for short
    intersections and backbone networks. The IEEE 802.3z task force tried to integrate
    the new standard with existing cabling, whether it was twisted-pair cable, coaxial
    fibre or fibre optic cable. These tests involved firing lasers in lengths of multi-mode
    fibre cables. These tests found that a jitter component results is caused by a
    phenomenon known as differential mode delay (DMD). The 1000BASE-SX standard has
    resolved this by defining the launch of the laser signal, and enhancing performance
    techniques. Typical maximum lengths are: 62.5 µm, multi-mode fibre (up to 220m)
    and 50 µm, multi-mode fibre (550m).


    +   - 1000BASE-LX (Multi-mode/single-mode fibre cables). These can be used for
    longer runs, such as backbones and campus networks. Single-mode fibres are covered
    by the long-wavelength standard, and for greater distances. External patch cords
    are used to reduce DMD. Typical lengths are: 62.5 µm, multi-mode fibre (up to
    550m), 50 µm, multi-mode fibre (up to 550m) and 50 µm, single-mode fibre (up to
    5km).


