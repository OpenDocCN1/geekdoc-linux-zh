    # 1.5 Java, the WWW and intranets


    Along with the growth of the Internet came the World Wide Web (WWW). It was initially
    conceived in 1989 by CERN, the European particle physics research laboratory in
    Geneva, Switzerland. Its main objective was to allow various types of information,
    such as text, graphics and video, to be integrated together in an easy-to-use
    manner. It also supports the interlinking of information. The standard language
    developed HTML (HyperText Markup Language), which is a text based language which
    has formatting tags. These tags are contained within a less than (<) and greater
    than (>) symbol. Most have an opening and closing version; for example, to highlight
    the bold opening tag is <B> and the closing tag is </B>. When a greater than or
    less symbol is required then a special character sequence be used. It is difficult
    to produce any high quality printed material from low quality and medium quality
    documents, but it is likely that new versions of HTML will support enhanced presentation.


    One of the main characteristics of the WWW is that stored information tends to
    be distributed over a geographically wide area. The result of the CERN project
    has been the world-wide acceptance of the protocols and specifications used. A
    major part of its success was due to the full support of the National Center for
    Supercomputing Applications (NCSA), which developed a family of user interface
    systems known collectively as Mosaic. Netscape and Microsoft have both developed
    excellent WWW browsers.


    The WWW, or Web, is basically an infrastructure of information. This information
    is stored on the WWW on Web servers and it uses the Internet to transmit data
    around the world. These servers run special programs that allow information to
    be transmitted to remote computers which are running a Web browser.


    HTTP is a stateless protocol where each transaction is independent of any previous'
