  md: 'D – Don''t fragment. 0 – may fragment, 1 – don''t fragment.

    M – Last fragment. 0 – last fragment, 1 – more fragments.


    +   - Fragment offset (13 bits). Indicates which diagram this belongs to. The
    fragment offset is measured in units of eight bytes (64 bits). The first fragment
    has an offset of zero.


    +   - Time-to-live (8 bits). A datagram could propagate through the internet indefinitely.
    To prevent this, the 8-bit time-to-live value is set to the maximum transit time
    in seconds and is initially set by the source IP. Each gateway decrements this
    value by a defined amount. When it becomes zero the datagram is discarded. It
    also defines the maximum amount of time that a destination IP node should wait
    for the next datagram fragment.


    +   - Protocol (8 bits). Different IP protocols can be used on the datagram. The
    8-bit protocol field defines the type to be used. A full list is given in Table
    4:5 (Section 4.5.11). Typical values are: 1–ICMP and 6–TCP.


    +   - Header checksum (16 bits). The header checksum contains a 16-bit pattern
    for error detection. Since values within the header change from gateway to gateway
    (such as the time-to-live field), it must be recomputed every time the IP header
    is processed. The algorithm is:


    > The 16-bit 1''s complement of the 1''s sum of all the 16-bit words in the header.
    When calculating the header checksum field is assumed to be set to zero.


    +   - Source and destination IP addresses (32 bits). The source and destination
    IP addresses are stored in the 32-bit source and destination IP address fields.


    +   - Options. The options field contains information such as debugging, error
    control and routing information. See Section 4.5.12 for further information.


    # 4.5 ICMP


    Messages, such as control data, information data and error recovery data, are
    carried between Internet hosts using the Internet Control Message Protocol (ICMP).
    These messages are sent with a standard IP header. Typical messages are:


    +   - Destination unreachable (message type 3) which is sent by a host on the
    network to say that a host is unreachable. The message can also include the reason
    the host cannot be reached.


    +   - Echo request/echo reply (message type 8 or 0) which is used to check the
    connectivity between two hosts. The ping command uses this message, where it sends
    an ICMP ‘echo request’ message to the target host and waits for the destination'
