  md: '# Windows Networking


    # 9.1 Introduction


    Windows NT has provided an excellent network operating system. It communicates
    directly with many different types of networks, protocols and computer architectures.
    Windows NT and Windows 95/98 have the great advantage over other operating systems
    that they have integrated network support. Operating systems now use networks
    to make peer-to-peer connections and to servers for file systems and print servers.
    The three most used operating systems are MS-DOS, Microsoft Windows 3.xx and UNIX.
    Microsoft Windows comes in many flavours; the main versions in current use:


    +   * Microsoft Windows 3.xx – 16-bit PC-based operating system with limited multitasking.
    It runs from MS-DOS and thus still uses MS-DOS functionality and system structure.

    * Microsoft Windows 95/98 – robust 32-bit multi-tasking operating system (although
    there are some 16-bit parts in it) which can run MS-DOS applications, Microsoft
    Windows 3.xx applications and 32-bit applications.

    * Microsoft Windows NT/2000 -- robust 32-bit multi-tasking operating systems with
    integrated networking. Networks are built with NT 2000 servers and clients. with
    Microsoft Windows 95/98 they can run MS-DOS, Microsoft Windows 3.x applications
    and 32-bit applications.


    # 9.2 Novell NetWare networking


    Novell NetWare is one of the most popular systems for PC LANs and provide file
    and print server facilities. The protocol used is SPX/IPX. This is also used by
    Windows NT to communicate with other Windows nodes and with NetWare networks.
    The Internet Packet Exchange (IPX) protocol is a network layer protocol for transportation
    of data computers between a Novell network. IPX is very fast and has a small connectionless
    datacagram protocol. Sequenced Packet Interchange (SPX) provides a communications
    protocol which supervises the transmission of the packet and ensures its successful
    delivery.

    Novell uses the Open Data-Link Interface (ODI) standard to simplify network driver
    development and to provide support for multiple protocols on a single network
    adapter. It allows Novell NetWare drivers to be written without concern for the'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'protocol that will be used on them (similar to NDIS in Windows NT). The link
    support layer (LSL or LSL.COM) provides a foundation for the MAC layer to communicate
    with multiple protocols (similar to NDIS in Windows NT). The IPX.COM (or IPXODI.COM)
    program normally communicates with the LSL and the applications. The MAC is a
    device driver or NIC driver. It provides low-level access to the network adapter
    by supporting data transmission and some basic adapter management functions. These
    drivers also pass data from the physical layer to the transport protocols at the
    network and transport layers. NetWare and IPX/SPX are covered in more detail in
    the next chapter.


    #  9.3 Windows NT networking


    Networks must use a protocol to transmit data. Typical protocols are:


    +   - IPX/SPX – used with Novell NetWare, it accesses file and printer services.

    - TCP/IP – used for Internet access and client/server applications.

    - SNA DLC – used mainly by IBM mainframes and minicomputers.

    - AppleTalk – used by Macintosh computers.

    - NetBEUI – used in some local LANs (stands for NetBIOS Extended User Interface).


    Novell NetWare is installed in many organisations to create local area networks
    of PCs. It uses IPX/SPX for transmitting data and allows access to file servers
    and working processing services. TCP/IP is the standard protocol used when accessing
    the Internet and for client/server applications (such as remote file transfer
    and remote login).


    A major advantage of Windows NT is that networking is built into the operating
    system. Figure 9.1 shows how it is organised in relation to the OSI model. Windows
    NT has the great advantage of being protocol-independent and will work with most
    standard protocols, such as TCP/IP, IPX/SPX, NetBEUI, DLC and AppleTalk. The default
    protocol is NetBEUI.


    Figure 9.2 shows a sample configuration for the Windows NT Client; the display
    shows the default network configurations.


    There are two main boundaries in Windows NT and NDIS and TDI. The Network Device
    Interface Standard (NDIS) boundary layer interfaces to several network interface
    adapters (such as Ethernet, Token Ring, RS-232, modems, and so on) with different
    protocols. For an unlimited number of network interfaces (NICs) and protocols
    to be connected to use with the operating system. In Windows NT, a single software
    module, `NDIS.SYS` (the NDIS wrapper), interfaces with the manufacturer-supplied
    NDIS device driver. The wrapper provides a uniform interface between the protocol
    drivers (such as TCP/IP or IPX/SPX) and the NDIS device driver. Figure 9.3 shows
    the set-up of the network adapter.


    # 9.3.1 IPX/SPX


    Novell NetWare networks use SPX/IPX and are supported through Windows NT/2000
    using the NWLink protocol stack.'
