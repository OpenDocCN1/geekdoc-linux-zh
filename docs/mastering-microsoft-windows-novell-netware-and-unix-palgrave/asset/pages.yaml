- img_proc: true
  md: '# 2.3.1 Star network


    In a star topology, a central server switches data around the network. Data traffic
    between nodes and the server will thus relatively low. Its main advantages are:


    +   - Since the data rate is relatively low between central server and the node,
    a low-specification twisted-pair cable can be used to connect the nodes to the
    server.

    - A fault on one of the nodes will not affect the rest of the network. Typically,
    mainframe computers use a central server with terminals connected to it.


    The main disadvantage of this type of topology is that the network is highly dependent
    upon the operation of the central server. If it were to slow down significantly
    then the network becomes slow. In addition, if it were to become un-operational
    then the complete network would shut down.


    # 2.3.2 Ring network


    In a ring network the computers link together to form a ring. To allow an orderly
    access to the ring, the single electronic token is passed from one computer to
    the next around the ring, as illustrated in Figure 2.5. A computer can only transmit
    data when it captures a token. In a manner similar to the star network each link
    between nodes is a point-to-point link and allows almost any transmission medium
    to be used. Typically twisted-pair cables allow a bit rate of up to 16 Mbps, while
    coaxial and fibre optic cables are normally used for extra reliability and higher
    data rates.


    A typical ring network is IBM Token Ring. The main advantage of token ring networks
    is that all nodes on the network have an equal chance of transmitting data. Unfortunately
    the network suffers from several problems, the most severe being that if one of
    the nodes goes down then the whole network may go down.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_37_0.png)


    Figure 2.5 Token passing ring network


    # 2.3.3 Bus network


    A bus network uses a multi-drop transmission medium, as shown in Figure 2.6. All'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'nodes on the network share a common bus and all share communications. This
    allows only one device to communicate at a time. A distributed medium access protocol
    determines which station is to transmit. As with the ring network, data packets
    contain source and destination addresses. Each station monitors the bus and copies
    frames addressed to itself.


    Twisted-pair cables give data rates up to 100 Mbps. Coaxial and fibre optic cables
    give higher bit rates and longer transmission distances. A bus network is a good
    compromise over the other two topologies as it allows relatively high data rates.
    Also, if a node goes down then it does not affect the rest of the network. The
    main disadvantage of this topology is that it requires a network protocol to detect
    when two nodes are transmitting at the same time. A typical bus network is Ethernet
    2.0.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_38_0.png)


    Figure 2.6 Bus topology


    # 2.4 Routers, bridges and repeaters


    Networks connect to other networks through repeaters, bridges or routers. A repeater
    corresponds to the physical layer of the OSI model and always routes data from
    one network segment to another. Bridges, on the other hand, route data using the
    data link layer (using the MAC address). Routers direct data using the network
    layer (that is, using the network address, such as the IP address). Normally at
    the data link layer transmitted data is known as a data frame, while at the network
    layer it is referred to as a data packet. Figure 2.7 illustrates the three interconnections.


    # 2.4.1 Repeaters


    All network connections suffer from a reduction in signal strength (attenuation)
    and digital pulse distortion. Thus, for a given cable specification and bit rate,
    each connection will have a maximum length of cable that can be used to transmit
    the data reliably. Repeaters can be used to increase the maximum interconnection
    length, and may do the following:


    +   - Clean pulses.'
  merge: -1
  pgno: 38
- img_proc: true
  md: '+   * Pass all signals between attached segments.

    * Boost signal power.

    * Possibly translate between two different media types (such as fibre to twisted-pair
    cable).


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_39_0.png)


    Figure 2.7 Repeaters, bridges and routers


    # 2.4.2 Bridges


    Bridges filter input and output traffic so that only data frames destined for
    a network are actually routed into that network and only data frames destined
    for the outside are allowed out of the network.

    The performance of a bridge is governed by two main factors:


    +   * **The filtering rate.** A bridge reads the MAC address of the Ethernet/Token
    ring/ FDDI node and then decides if it should forward the packet into the network.
    Filter rates for bridges range from around 5000 to 70000 pps (packets per second).

    * **The forward rate.** Once the bridge has decided to route the frame into the
    inter-network the bridge must forward the frame onto the Internet network media.
    Forwarding rates range from 500 to 140000 pps and a typical forwarding rate is
    90000 pps.


    A typical Ethernet bridge has the following specifications:


    +   Bit rate: 10 Mbps

    Filtering rate: 17 500 pps

    Forwarding rate: 11 000 pps

    Connectors: Two DB15 AUI (female), one DB9 male console port, two BNC (for 10BASE2)
    or two RJ-45 (for 10BASE-T).'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'Algorithm: Spanning tree protocol. It automatically learns the addresses of
    all devices on both interconnected networks and builds a separate table for each
    network.


    # Spanning tree architecture (STA) bridges


    The spanning tree algorithm has been defined by the standard IEEE 802.1. It is
    normally implemented as software on STA-compliant bridges. On power-up they automatically
    learn the addresses of all nodes on both interconnected networks and build up
    a separate table for each network.


    They can also have connections between two LANs so that the primary path becomes
    disabled, the spanning tree algorithm can re-enable the previously redundant link.


    # Source route bridging


    With source route bridging a source device, not the bridge, is used to send explorer
    packets that are used to determine the best path to the destination. Explorer
    packets are sent out from the source routing bridges until they reach their destination
    workstation. Each source routing bridge along the route enters its address in
    the routing information field (RIF) of the explorer packet. The destination node
    then sends back the completed RIF field to the source node. When the source device
    has determined the best path to the destination, it sends the data message along
    with the path instructions to the local bridge. It then forwards the data message
    according to the received path instructions.


    # 2.4.3 Routers


    Routers examine the network address field and determine the best route for the
    packet. They have the great advantage in that they normally support several different
    types of network layer protocols.


    Routers need to communicate with other routers so that they can exchange routing
    information. Most network operating systems have associated routing protocols
    which support the transfer of routing information. Typical routing protocols using
    Internet communications are:


    +   - BGP (border gateway protocol)

    - EGP (exterior gateway protocol)

    - OSPF (open shortest path first)

    - RIP (routing information protocol).


    Most routers support RIP and EGP. The main Internet-based protocols are discussed
    in the next section. In the past RIP was the most popular router protocol standard.
    The widespread use is due to no small part to the fact that it was distributed
    along with the Berkeley Software Distribution (BSD) of UNIX (from which most commercial
    versions of UNIX are derived). It suffers from several disadvantages and has been
    largely replaced by OSFP and EGB. These protocols have the advantage over RIP
    that they can handle large internetworks as well as reducing routing update traffic.


    RIP uses a distance vector algorithm which measures the number of network jumps'
  merge: -1
  pgno: 40
- img_proc: true
  md: '(known hops), up to a maximum of 16, to the destination router. This has the
    disadvantage that the smallest number of hops is the best route from source to
    destination. The OSPF and EGB protocol uses a link state algorithm that can decide
    multiple paths to the destination router. These are based not on hops but on other
    parameters such as delay capacity, reliability, and throughput.


    With vector routing each router maintains a table by communicating with neighbouring
    routers. The number of hops in its own table are then computed as it knows the
    number of hops to local routers. Unfortunately, the routing table can take some
    time to be updated when changes occur, because it takes time for all the routers
    to communicate with each other (known as slow convergence).


    # 2.5 Network cable types


    The cable type used on a network depends on several parameters, including:


    +   - The data bit rate.

    - The reliability of the cable.

    - The maximum length between nodes.

    - The possibility of electrical hazards and tolerance to harsh environments.

    - Power loss in the cables.

    - Expense and general availability of the cable.

    - Ease of connection, maintenance and ease of running cables.


    The main types of cables used in networks are twisted-pair, coaxial and fibre
    optic. These are illustrated in Figure 2.8. Twisted-pair and coaxial cables transmit
    electric signals, whereas fibre optic cables transmit light pulses. Twisted-pair
    cables are not shielded and thus interfere with nearby cables. Public telephone
    lines generally use twisted-pair cables. In LANs they are generally used up to
    bit rates of 10 Mbps with maximum lengths of 100 m.


    Co cable has a grounded metal sheath around the signal conductor. This limits
    the amount of interference between cables and allows higher data rates. Typically,
    they are used at bit rates of 100 Mbps for maximum lengths of 1 km.


    The highest specification of the three cables is fibre optic. This type of cable
    allows extremely high bit rates over long distances. Fibre optic cables do not
    interfere with nearby cables and give greater security, more protection from electrical
    damage by external equipment, are more resistant to harsh environments and safer
    in hazardous environments.


    A typical bit rate for a LAN using fibre optic cables is 100 Mbps, in other applications
    can reach several gigabits/sec. The maximum length of the fibre optic cable depends
    on the transmitter and receiver electronics but a single length of 20 km is possible.'
