  md: '# 3.11.2 Desktop switch


    A desktop switch can simply replace an existing 10BASET/100BASET hub. It has the
    advantage that any of the ports can connect directly to any other. In the network
    in Figure 3.14, any of the computers in the local workgroup can connect directly
    to any other, to the printer, or the local disk drive. This type of switch works
    well if there is a lot of local traffic, typically between a local server and
    local peripherals.


    Store-and-forwarding techniques have been used extensively in bridges and routers,
    and are now used with switches. It involves reading the entire Ethernet frame,
    before forwarding it, with the required protocol and at the correct speed, to
    the destination port. This has the advantages of:


    +   * Improved error check. Bad frames are blocked from entering a network segment.

    * Protocol filtering. Allows the switch to convert from one protocol to another.

    * Speed matching. Typically, for Ethernet, reading at 10 Mbps or 100 Mbps and
    transmitting at 100 Mbps or 10 Mbps. Also, can be used for matching between ATM
    (155 Mbps), FDDI (100Mbps), Token Ring (4/16 Mbps) and Ethernet (10/100 Mbps).


    The main disadvantage is:


    +   * System delay. As the frame must be totally read before it is transmitted
    there is a delay in the transmission. The improvement in error checking normally
    overcomes this disadvantage.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_62_0.png)'
