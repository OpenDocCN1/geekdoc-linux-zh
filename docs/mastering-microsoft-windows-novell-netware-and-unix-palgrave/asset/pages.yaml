    # 4.12 ARP


    ARP (Address Resolution Protocol) translates IP addresses to Ethernet addresses.
    This is used when IP packets are sent from a computer, and the Ethernet address
    is added to the Ethernet frame. A table look-up, called the ARP table, is used
    to translate the addresses. One column has the IP address and the other has the
    Ethernet address. The following is an example ARP table:


    | IP address | Ethernet address |

    | 146.176.150.2 | 00-80-C8-22-6BE2 |

    | 146.176.150.3 | 00-80-C8-22-CD4E |

    | 146.176.150.4 | 00-80-C8-23-114C |


    82 Mastering Microsoft Windows, Novell NetWare and UNIX'
