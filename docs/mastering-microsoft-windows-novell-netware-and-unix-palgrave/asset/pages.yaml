  md: '# 12.7 Startup files and scripts


    Much of the initialisation of a client is done with start up files and scripts.
    The main startup files are:


    +   - CONFIG.SYS and AUTOEXEC.BAT. These are standard start up files for the PC
    and normally set up the environment of the computer. The AUTOEXEC.BAT file should
    include the STARTNET.BAT file.

    - STARTNET.BAT. Provides a network connection.

    - NET.CFG. Customises the NetWare set up, such as setting ODI and VLM settings.


    The login scripts are:


    +   - Container Login Scripts. These set up the Organisation and Organisational
    Unit properties, and generally replace System login scripts.

    - Profile Login Scripts. These set up the environment of User groups.

    - User Login Scripts. These customise the User environment. If no User login script
    exists then a Default Login Script is executed.


    The NET.CFG file is similar to NetWare 3 but has extra lines to define the NetWare
    4 options. An example file is:


    ```

    Link Driver NE2000

    Int #1 11

    Port #1 320

    Frame Ethernet_II

    Frame Ethernet_802.3

    Protocol IPX 0 Ethernet_802.3

    ```


    NetWare DOS Requester


    ```

    NAMETEXT=OU=electrical.OU=engineering.O=napier

    PREFERRED SERVER = EEE-SRV1

    FIRST NETWORK DRIVE = G

    NETWORK PROTOCOL = NDS, Bindery

    ```


    This defines the name context for the user (with NAME CONTEXT) and that the preferred
    server is EEE-SRV1. The first network drive will be G; and the NetWare protocol
    is NDS and Bindery.


    Drive disks can be mounted by adding lines to the Login Script (such as STARTNET.BAT,
    which is started from the AUTOEXEC.BAT file). For example, to mount the F:, G
    and M drives then the following can be added:


    ```

    MAP ROOT F:=\.EEE-SRV1.ENGINEERING.NAPIER\SYS:APPS

    MAP ROOT G:=\.CRAIGLOCKH_1.MAJOR.NAPIER.AC.UK\SYS:APPS

    MAP ROOT M:=\.CRAIGLOCKH_3.MAJOR.NAPIER.AC.UK\SYS:MAIL

    ```'
