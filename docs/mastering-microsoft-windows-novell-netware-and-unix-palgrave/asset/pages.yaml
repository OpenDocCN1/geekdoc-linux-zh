  md: '# SNMP, WINS and DHCP


    # 6.1 Introduction


    SNMP (Simple Network Management Protocol) is a well-supported standard which can
    be used to monitor and control devices. It typically runs on hubs, switches and
    bridges. Many SNMP devices provide both general network management and device
    management through a serial cable, modem, or over the network from a remote computer.
    It involves a primary management station communicating with different management
    processes.


    Figure 6.1 shows an outline of an SNMP-based system. An SNMP runs SNMP management
    software. An SNMP server sends commands to the agent which responds with the results.
    In this figure the server asks the agent for its routing information and the agent
    responds with its routing table. These responses can either be polled (the server
    sends a request for information) or interrupt-driven (where the agent sends its
    information at given events). A polled system tends to increase network traffic
    as the agent may not have updated information (and the server must re-poll for
    the information).


    The SNMP protocol is initially based on the RFC1157 document. It defines a simple
    protocol which gives network element management information base (MIB). There
    are two types of MIB: MIB-1 and MIB-2. MIB-1 was defined in 1988 and has 114 table
    entries, divided into two groups. MIB-2 is a 1990 enhancement which has 171 entries,
    organised into ten groups. Most devices are MIB-1 compliant and newer ones with
    both MIB-1 and MIB-2.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_135_0.png)


    Figure 6.1 SNMP architecture'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'The database contains entries with four fields:


    +   * **Object type.** Defines the name of the entry.

    * **Syntax.** Gives the actual value (as a string or an integer).

    * **Access field.** Defines whether the value is read-only, read/write, write-only
    or not accessible.

    * **Status field.** Contains an indication on whether the entry in the MIB is
    mandatory (the managed device must implement the entry), optional (the managed
    device may implement it) or obsolete (the entry is not used).


    SNMP is a very simple protocol but suffers from the fact that it is based on connectionless,
    unreliable, UDP. The IAB recommended that the Common Management Information Services
    (CMIS) and Common Management Information Protocol (CMIP) be accepted as standard
    for future TCP/IP systems. The two main versions of SNMP are SNMP Ver1 and SNMP
    Ver2. SNMP has added security to stop intruders determining network load loading
    or the state of the network.


    # 6.2 SNMP


    The SNMP architecture is based on a collection of:


    +   * **Network management stations.** These execute management applications which
    monitor and control network elements.

    * **Network elements.** These are devices which as hosts, gateways, terminal servers,
    and so on and have management agents which perform network management functions
    replying to requests from network management stations.


    The SNMP management information is represented by a subset of the ASN.1 language.
    SNMP models all management agent functions as alterations or inspections of variables.
    Thus, a protocol entity on a remotely located host interacts with the management
    agent resident on the network element in order to retrieve (get) or alter (set)
    variables.


    SNMP determines the current state of the network by polling for appropriate information
    from monitoring centre(s).


    # 6.2.1 Protocol specification


    The network management protocol operates by inspecting or altering variables on
    an agent''s MIB. They communicate by exchanging messages within UDP datagrams.
    These messages are defined using ASN.1 and are specified in listing 6.1. They
    consist of:


    +   * A Version identifier (version). An integer value defining the version number.

    * SNMP community name (community). An eight character string defining the community
    name.

    * A protocol data unit (data). All SNMP implementations five PDUs: GetRequest-PDU,
    GetNextRequest-PDU, GetResponse-PDU, SetRequest-PDU, and Trap-PDU.'
  merge: -1
  pgno: 136
- img_proc: true
  md: "The protocol receives messages from:\n\n+   * UDP port 161. For all messages\
    \ apart from report traps (Trap-PDU)\n* UDP port 162. Report trap Messages.\n\n\
    ```\nListing 6.1\nRFC1157-SNMP DEFINITIONS ::= BEGIN\nIMPORT'S\nObjectName, ObjectSyntax,\
    \ NetworkAddress, IpAddress, TimeTicks\nFROM RFC1155-SMI;\n-- top-level message\n\
    Message :=\\nSEQUENCE {\n  version -- version-1 for this RFC\n  INTEGER (\n  \
    \  version-1(0)\n  ),\n  community -- community name\n  OCTET STRING,\n  data\
    \ -- e.g., PDUs if trivial\n  ANY -- authentication is being used\n}\n-- protocol\
    \ data units\nPDUs :=\nICE {\n  get-request GetRequest-PDU,\n  get-next-request\
    \ GetRequest-PDU,\n  get-response GetResponse-PDU,\n  set-request SetRequest-PDU,\n\
    \  trap Trap-PDU\n}\n-- the individual PDUs and commonly used\ndata types will\
    \ be defined later\nEND\n```\n\n# Common constructs\n\nListing 6.2 defines the\
    \ ANS.1 constructs used in the PDUs. RequestID distinguishes between outstanding\
    \ requests. ErrorStatus is an integer (0-5) which defines the error level, a zero\
    \ indicates no error, a 1 indicates tooBig, and so on. When an error occurs, the\
    \ ErrorIndex parameter is typically used to indicate which variable in a list\
    \ caused the error.\n\nThe VarBind (variable binding) refers to the link between\
    \ the name of a variable and the variable's value, and VarBindList is a list of\
    \ variable names and their corresponding values.\n\n```\nListing 6.2\n-- request/response\
    \ information\nRequestID :=\nINTEGER\nErrorStatus :=\\nINTEGER (\n  noError(0),\
    \ tooBig(1), noSuch(2),\n  badValue(3), readOnly(4), genErr(5)\n)\nErrorIndex\
    \ :=\nINTEGER\n-- variable bindings\n```\n\nMastering Microsoft Windows, Novell\
    \ NetWare and UNIX"
  merge: -1
  pgno: 137
- img_proc: true
  md: "```\nVarBind :=\\nSEQUENCE {\n  name ObjectName,\n  value ObjectSyntax\n}\n\
    VarBindList :=\\nSEQUENCE OF\n  VarBind\n```\n\n# Request-PDU\n\nRequest-PDU gets\
    \ objects from the MIB of the recipient. These objects are defined in the variable\
    \ binding field. On no errors, the recipient sends back GetResponse-PDU, with:\n\
    \n+   - Each object named in the variable-bindings field of the received message.\n\
    - The corresponding component of the GetResponse-PDU represented by the name.\n\
    - The value of each of the variables.\n\nIf all the objects are found, the value\
    \ of the error-status field and the error-index field of the GetResponse-PDU must\
    \ be noError and zero, respectively. The request-id field will be same as the\
    \ received message.\nIf any of the objects are not found in the DIB the recipient\
    \ sends to the originator a NextResponse-PDU with an error-status field value\
    \ of noSuchName. The value of error-index is set to the error-index field of the\
    \ object component in the received message.\nListing 6.3 defines the general form\
    \ of the GetRequest-PDU.\n\n![](img/da031d9e3a72792b55f2a8fb16c012a5_138_0.png)\n\
    \n```\nGetRequest-PDU ::= [D]\nIMPLICIT SEQUENCE {\n  request-id RequestID,\n\
    \  error-status ErrorStatus,\n  error-index ErrorIndex,\n  variable-bindings VarBindList\n\
    }\n```\n\n# NextRequest-PDU\n\nNextRequest-PDU is sent when the protocol makes\
    \ a request of its SNMP application entity. If no error occurs then the receiving\
    \ protocol sends the GetResponse-PDU containing noError in the error-status field\
    \ and a zero value in the error-index field. The value of the request-id field\
    \ of the GetResponse-PDU is that of the received message.\nListing 6.4 defines\
    \ the format in ASN.1 language. The only difference between this PDU and the GetRequest-PDU\
    \ is defined with type of 0 (rather than 1).\n\n![](img/da031d9e3a72792b55f2a8fb16c012a5_138_1.png)\n\
    \n```\nGetNextRequest-PDU :=\\nIMPLICIT SEQUENCE {\n  request-id RequestID,\n\
    \  error-status ErrorStatus,\n  error-index ErrorIndex,\n  variable-bindings VarBindList\n\
    }\n```"
  merge: -1
  pgno: 138
- img_proc: true
  md: "GetResponse-PDU occurs after a protocol entity receives a GetResponse-PDU,\
    \ GetNextRequest-PDU, or a Request-PDU. After it is receiving the protocol entity\
    \ sends its contents to its SNMP application entity. Listing 6.5 defines the format\
    \ in ASN.1 language.\n\n# Listing 6.5\n\n```\nGetResponse-PDU :==\n    IMPLICIT\
    \ SEQUENCE {\n        request-id RequestID,\n        error-status ErrorStatus,\n\
    \        error-index ErrorIndex,\n        variable-bindings VarBindList\n    }\n\
    ```\n\n# The SetRequest-PDU\n\nThe protocol entity sends a Request-PDU at the\
    \ request of its SNMP application entity. When received the receiving entity sends\
    \ the corresponding value is assigned to the variable for each object named in\
    \ the variable-bindings field of the received message. Listing 6.6 defines the\
    \ format in ASN.1 language.\n\n# Listing 6.6\n\n```\nSetRequest-PDU :==\n    IMPLICIT\
    \ SEQUENCE {\n        request-id RequestID,\n        error-status ErrorStatus,\n\
    \        error-index ErrorIndex,\n        variable-bindings VarBindList\n    }\n\
    ```\n\n# Trap-PDU\n\nTrap-PDU occurs when the protocol entity receives a request\
    \ from an SNMP application entity. When received, the receiving protocol entity\
    \ sends its contents to its SNMP application entity. The variable-bindings component\
    \ of the Trap-PDU is implementation-specific, these are:\n\n+   * coldStart(0).\
    \ The sending protocol entity is reinitialising itself, so the agent's configuration\
    \ may be altered.\n* warmStart(1). The sending protocol entity is reinitialising\
    \ itself, so that neither the agent configuration nor the protocol entity implementation\
    \ will be altered.\n* linkDown (2). The sending protocol entity recognises a failure\
    \ in one of the communication links represented in the agent's configuration.\n\
    * linkUp (3). The sending protocol entity recognises that one of the communication\
    \ links represented in the agent's configuration has come.\n* authenticationFailure\
    \ (4). The sending protocol entity is the addressee of a message that is not properly\
    \ authenticated.\n* egpNeighborLoss (5). The EGP neighbour for whom the sending\
    \ protocol entity is an EGP peer no longer exists.\n* enterpriseSpecific (6).\
    \ The sending protocol entity recognises an enterprise-specific event."
  merge: -1
  pgno: 139
- img_proc: true
  md: "The form of the Trap-PDU is:\n\n```\nTrap-PDU ::= [4]\n  IMPLICIT SEQUENCE\
    \ {\n    -- type of object generating type\n    OBJECT IDENTIFIER,\n    agent-addr\
    \ -- address of object generating\n    NetworkAddress, -- trap\n    generic-trap\
    \ -- generic trap type\n    INTEGER {\n      coldStart(0), warmStart(1),\n   \
    \   linkDown(2), linkUp(3),\n      authenticationFailure(4), egpNeighborLoss(5),\n\
    \      enterpriseSpecific(6)\n    },\n    specific-trap -- specific code, present\
    \ even if generic-trap is not\n    INTEGER, -- enterpriseSpecific\n    time-stamp\
    \ -- time elapsed between the last\n    TimeTicks, -- (re)initialization of the\
    \ network\n    trap -- entity and the generation of the\n    variable-bindings\
    \ -- \"interesting\" information\n    VarBindList\n}\n```\n\n# 6.3 RMON (Remote\
    \ Monitoring)\n\nIn addition to SNMP, many systems support two additional types\
    \ of network management: EASE (Embedded Advanced Sampling Environment) and RMON.\
    \ RMON is SNMP MIB that specifies the types of information listed in a number\
    \ of special MIB groups that are commonly used for traffic management. Typical\
    \ groups are Statistics, History, Alarms, Hosts, Hosts Top N, Matrix, Filters,\
    \ Events, and Packet Capture. The information can be gathered by dedicated hardware\
    \ devices or software built in to data communications equipment, such as routers,\
    \ bridges, or switches (often known as an embedded agent).\n\n# 6.4 EASE (Embedded\
    \ Advanced Sampling Environment)\n\nEASE is a Hewlett-Packard developed system\
    \ that samples LAN data to build traffic metrics and monitor users of the network.\
    \ It can be used on standard network types (such as 10BASE-2 and Token Ring) and\
    \ high-speed networks (such as 100VG-AnyLAN, 100BASE-T and FDDI)."
