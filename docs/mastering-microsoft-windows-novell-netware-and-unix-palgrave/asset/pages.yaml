    hsegment      = * [ uchar [ "; | ": | "@" | "&" | "=" ]

    search        = * [ uchar [ "; | ": | "@" | "&" | "=" ]

    ```


    # 16.6.5 Gopher Protocol


    Gopher is widely used over the Internet and is basically a distribution system
    for the retrieval and delivery of documents. Users retrieve documents through
    a series of hierarchical menus, or through keyword searches. Unlike HTML documents
    they are not based on the hypertext context.


    # 16.6.6 Wide area information services (WAIS)


    WAIS is a public domain, fully text-based, information retrieval system over the
    Internet which provides text-based searches. The communications protocol used
    is based on the ANSI standard Z39.50, which is designed for networking library
    catalogues.

    WAIS services include index generation and search engines. An indexer generates
    multiple indices for organisations or individuals that offer services over the
    Internet. A WAIS search engine searches for particular words or text index indexes
    located across multiple Internet-attached information servers of various types.


    # 16.6.7 News


    UsNet or NewsGroup servers are part of the increasing use of general discussion
    news groups which share text-based news items. The URL scheme defines a link to
    either a news group or individual articles with a group of UsNet news.


    A news URL takes one of two forms:


    ```

    news:<newsgroup-name>

    news:<message-id>

    ```


    where <newsgroup-name> is a period-delimited hierarchical name, such as ''news.inter.'',
    and <message-id> takes the full form of the message-ID, such as:


    ```

    <message-ID>@<full_domain_name>

    ```


    The general format is:


    # 16.6.8 NNTP


    The nntp URL scheme gives an alternative method of reviewing news articles. For
    its format is:


    ```

    nntp://<host>:<port>/<newsgroup-name>/<article-number>

    ```


    WWW 297'
