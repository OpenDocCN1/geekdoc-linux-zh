    | EXAMPL-10 DOC | 4,608 | 05/11/96 | 23:40 | Example assignment C.doc |


    # 8.4. HPFS (high-performance file system)


    HPFS is supported by OS/2 is typically used to migrate from OS/2 to Windows NT.
    It allows long file names of up to 254 characters with multiple extensions. With
    the Windows 95/98 and Windows NT FAT system the file names are not case sensitive
    but preserve the case. HPFS uses B-tree to store the file directory structure.
    The B-tree format stores directory entries in an alphabetical tree, and binary
    searches are used to search for the target file in the directory list. The reserved
    characters for file names are:


    > " / \ : : < > | * ?"'
