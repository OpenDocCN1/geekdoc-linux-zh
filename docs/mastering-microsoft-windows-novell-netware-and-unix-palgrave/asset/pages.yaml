  md: '# 1.8 Data encryption


    The best way of stopping external parties from reading transmitted or stored data
    is to encrypt it. Encryption techniques can use public keys or secret keys. Encryption
    techniques use a secret key which is only known by the two communicating parties.
    This key can be fixed or be passed from the two parties over a secure communications
    link (for example over the postal network or a leased line). The two most popular
    private-key techniques are DES (Data Encryption Standard) and IDEA (International
    Data Encryption Algorithm) and a popular public-key technique is RSA (named after
    its inventors, Rivest, Shamir and Adleman).


    In 1977, the National Bureau of Standards (now the National Institute of Standards
    and Technology) published the DES for commercial and unclassified US government
    applications. DES is a block cipher which operates on 64-bit block sizes. The
    private key has only 56 useful bits of its bits are used for parity. This gives
    2⁵⁶ or 10⁷ possible keys. DES uses a complex series of permutations and substitutions,
    and the result of these operations is XORed with the input. This is then repeated
    16 times using a different order of the key bits each. DES is a very strong code
    and has never been broken, although several high-powered computers are now available,
    using brute force, can crack the code. A possible solution is 3DES (triple DES)
    which uses DES three times in a row. To encrypt, next to decrypt and finally encrypt.
    This system allows a key-length of more than 128 bits.


    IDEA operates over 17 rounds with a complicated mangler function. During encryption
    this does not have to be reversed and can simply be applied in the same way as
    during encryption (this also occurs with DES). IDEA uses a different key expansion
    for encryption and decryption, but every other part of the process is identical.
    The same keys are used in DES decryption but in the reverse order.


    Public-key algorithms use a secret element and a public element to their code.
    One of the main algorithms is relatively slow but it has the advantage that users
    can choose their own code whenever they need one.


    RSA is the most commonly used public-key cryptystem. It is patented in the USA
    and is secure for a key-length of over 728 bits. The algorithm relies on the fact
    that it is difficult to factorise large prime numbers. Unfortunately, it is particularly
    vulnerable to chosen plaintext attacks and a new attack (spying on keystroke time)
    was announced on the 7 December 1995. This attack would be able to break many
    existing implementations of RSA.


    RSA is a public-key encryption/decryption algorithm and is much slower than IDEA
    and DES. The key-length is variable and the block size is also variable. A typical
    key-length is 512 bits. RSA uses a public key and a private key, and uses the
    fact that large prime numbers are extremely difficult to factorise.


    # 1.9 Electronic mail


