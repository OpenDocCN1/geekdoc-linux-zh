  md: '# 4.7 Domain name system


    An IP address can be defined in the form WWW.XXX.YYY.ZZZ, where XXX, YYY, ZZZ
    are are integer values in the range 0 to 255. On the Internet it is WWW.XXX.YYY
    that normally defines the subnet and WWW that defines the host. Such names may
    be difficult to remember. A better method is to use symbolic names rather than
    IP addresses.


    Users and application programs can use symbolic names rather than the IP addresses.
    The directory network service on the Internet determines the IP address of the
    named destination user or application program. This has the advantage that users
    and application programs can move around the Internet and are not fixed to any
    ad-address.


    An analogy relates to the public telephone service. A telephone directory contains
    a list of subscribers and their associated telephone numbers. If someone looks
    for a phone number, the first user is looked up and then the associated telephone
    directory maps a user name (symbolic name) to an actual telephone number (the
    actual address).


    Table 4.4 lists some Internet domain assignments for World Wide Web (WWW) servers.
    Note that domain assignments are not fixed and can change their corresponding
    IP addresses, if required. The binding between the symbolic name and its address
    can thus change at any time.


    | Web server | Internet domain name | Internet IP address |

    | --- | --- | --- |

    | NEC | www.nec.com | 143.101.112.6 |

    | Sony | www.sony.com | 198.83.178.11 |

