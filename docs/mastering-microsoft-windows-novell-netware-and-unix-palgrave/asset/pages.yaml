  md: '# 13.12 File locations


    UNIX has various default directories which store standard command programs and
    configuration files. Some of these are defined in the following sections.


    # 13.12.1 /bin


    The /bin directory contains most of the standard commands, such as compilers,
    UNIX commands, program development tools, and so on. Examples are:


    +   - FORTRAN and C compilers, f77 and cc.

    - commands such as ar, cat, man utilities.


    # 13.12.2 /dev


    The /dev directory contains special files for external devices, terminals, consoles,
    line printers, disk drives, and so on.


    +   - /dev/console Console terminal.

    - /dev/null System wastebasket.

    - /dev/tty* Terminals (such as /dev/tty1 /dev/tty2).


    # 13.12.3 /etc


    The /etc directory contains restricted system data and system utility programs
    which are normally used by the system manager. These include password file, login,
    and so on. Examples are:


    +   - /etc/groups System group tables.

    - /etc/hosts List of system hosts.

    - /etc/passwd List of passwords and users.

    - /etc/termcap Table of terminal devices.

    - /etc/ttys Terminal initialisation information.

    - /etc/ttytype Table of connected terminals.

    - /etc/utmp Table of users logged in.


    # 13.12.4 /lib


    The /lib directory contains system utilities and FORTRAN and C run-time support,
    system calls and input/output routines.


    # 13.12.5 /tmp


    Temporary (scratch) files are used by various utilities, such as editors, compilers,
    assemblers. These are normally stored in the /tmp directory.


    # 13.12.6 /usr/adm


    The /usr/adm stores various administrators files, such as:


    /usr/adm/lastlog Table of recent logins'
