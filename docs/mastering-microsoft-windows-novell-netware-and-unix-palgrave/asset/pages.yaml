  md: '# 14.3.2 NFS remote access


    To initially mount a remote directory (or file system) onto a local superuser
    must do the following:


    +   - On the server, export the directory to the client.

    - On the client, mount (or import) the directory.


    For example suppose the remote directory /user is to be mounted onto the host
    miranda as the directory /win. To achieve this operation the following are setup:


    +   1. The superuser logs on to the remote server and edits the file /etc/exports
    adding the /user directory.

    2. The superuser then runs the program exportfs to make the /user directory available
    to the client.


    ```

    exportfs -a

    ```


    +   3. The superuser then logs into the client and creates a mount point /win
    (empty directory).


    ```

    mkdir /mntnt

    ```


    +   4. The remote directory can then be mounted with:


    ```

    mount miranda:/user /win

    ```


    NFS maintains the file /etc/mntab which contains a record of the mounted file
    systems. The general format is:


    ```

    special_file_name dir type opts freq passno mount_time cnode_id

    ```


    where mount time contains the time file system was mounted using mount. Sample
    contents of /etc/mntab could be:


    ```

    /dev/disk/c201d6s0 / hfs defaults 0 1 850144122 1

    /dev/disk/c201d5s0 /winwin hfs defaults 1 2 850144127 1

    castor:/net/castor_win nfs rw, suid 0 0 850144231 0

    miranda:/net/miranda_win nfs rw, suid 0 0 850144291 0

    spica:/usr/opt opt nfs rw, suid 0 0 8503059336 0

    triton:/net/triton_win nfs rw, suid 0 0 8503059336 0

    ```


    In this case there are two local drivers (/dev/disk/c201d6s0 is mounted as the
    root directory and /dev/disk/c201d5s0 is mounted locally as /win). There are also
    four remote directories which are mounted from remote servers (castor, miranda,
    spica and triton). The directory mounted from castor is the /win directory and
    it is mounted locally as /net/castor_win. hfs defines a UNIX format disk and nfs
    defines that the disk is mounted over NFS.


    A disk can be unmounted from a system using the umount command, e.g.


    ```

    % miranda:/win

    ```'
