    # 6.5.4 Time allocations


    The client acquires the lease of a network time for specified time (either finite
    or infinite). The units of time are unsigned integer values in seconds, although
    the value FFFFFFFF is used to represent infinity. This gives a range of 0 and
    approximately 100 years.


    When a client cannot contact the local DHCP server and has knowledge of a previous
    network address then it may continue to use the previous assigned network address
    until the lease expires. If the lease expires before the client can contact a
    DHCP server then the client immediately stops using the previous network address
    and informs local users of the problem.


