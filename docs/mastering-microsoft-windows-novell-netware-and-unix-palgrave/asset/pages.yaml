  md: '# Introduction


    # 1.1 Introduction


    Virtually every computer in a company is networked and they are key to work efficiency.
    Without them, few people could work effectively. Networking provides us with:


    +   - Electronic mail.

    - Networked application software.

    - Remote connections.

    - Shared printers.

    - Networked video conferencing.

    - Remote control of remote equipment.

    - Remote data acquisition.

    - Shared disk resources.


    Generally networking is moving towards standardisation in terms of hardware and
    software. Figure 1.1 shows the main standard used for the hardware and software.
    The most common network operating systems are:


    +   - Novell NetWare. This is the network created using Novell NetWare, typically
    NetWare 3 or NetWare 4/5. NetWare 4/5 has many great advantages over NetWare-3.
    NetWare 4/5 uses NetWare Directory Services (NDS) to create a global network.
    This will be discussed in a later chapter.

    - Windows NT/95/98/2000. Windows 95 and Windows 98 can create peer-to-peer networks
    where computers can share resources, such as disk drivers and printers. Windows
    NT and Windows 2000 can create a network with a network server which allows the
    creation of network logins, file sharing, and so on.

    - UNIX. A well-proven operating system which is typically used with high-powered
    workstations. It has always supported networking and is robust and extremely reliable.


    The main technologies used in making a network are:


    +   - Ethernet. The most widely used networking technology where computers either
    connect to a network hub or a common bus.

    - FDDI. A ring based network, where computers either connect to a network hub
    or onto a fibre ring.

    - ISDN. Used to connect computers over a telephone connection.


    A network protocol is the set of rules which two network operating systems use
    to communicate with each other. Typical network protocols are:'
  merge: -1
  pgno: 14
- img_proc: true
  md: '+   TCP/IP. Standard protocol which computers use to connect to the Internet
    and also over a UNIX-based network. Each node on the network is granted an IP
    address for the time of its connection, or it can have a permanent address.


    +   SPX/IPX. Protocol is used by computers over a NetWare-based network.


    +   NetBEUI. Protocol is used in a Windows network.


    A particular problem in networking is the interface between the software and the
    network adapter. In the past this was achieved by the manufacturer supplying a
    driver file which contained the required information to interface the adapter.
    Typically now standard interfaces, such as NDIS2 and ODI, are used to provide
    this interface.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_15_0.png)


    Figure 1.1 Common protocols


    # 1.2 History of modern communication


    The root of modern communication can be traced back to the work of Henry, Maxwell,
    Hertz, Bell, Marconi and Watt. American Joseph Henry produced the first electromagnet
    when he wrapped a coil of insulated electrical wire around a metal insert. Henry,
    unfortunately, like many other scientists, did not patent his discovery and its
    first application was in telegraphy, which was the beginning of the communications
    industry. Henry sent electrical pulses over telegraph wires to an electromagnet
    at the other end. It was a great success, but it was left to the artist Samuel
    Morse (the American Leonardo, according to one of his biographers) to take much
    of of the credit. Morse of course developed Morse Code, which is a code of dots
    and dashes. Using


    Mastering Microsoft Windows, Novell NetWare and UNIX'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Henry''s system, he installed a telegraph system from Washington to Baltimore.
    The first transmitted message was ‘What hath wrought.’ It received excellent publicity
    and eight years later there were over 23 000 miles (37 000 km) of telegraph wires
    in the USA. Several of the first companies to develop telegraph systems went to
    become very large corporations, as the Mississippi Valley Printing Telegraph Company
    which later became the Western Union. One of the first non-commercial uses of
    telegraph was the Crimean War and the American Civil War. A communications from
    New York to San Francisco was an important mechanism for transmitting information
    to and from troops.


    One of all time greats was James Clerk Maxwell, who was born in Edinburgh in 1831.
    He reigned amongst the greatest of all the human beings who walked on this planet
    and is importance science he put with Isaac Newton, Albert Einstein, James Watt
    and Michael Faraday. Maxwell''s most famous formulation was set of four equations
    that define the basic laws of electricity and magnetism (Maxwell''s equations).
    Before Maxwell''s work, many scientists had observed the relationship between
    electricity and magnetism. However, Maxwell finally defined the mathematical link
    between these forces and magnetic fields. From this work, he also proved that
    all electromagnetic waves, in a vacuum, at 300 000 km per second (or 186 000 miles
    per second), Maxwell recognised as the speed of light and he deduced that light
    was also an electromagnetic wave. He then reasoned that the electromagnetic wave
    must contain many invisible waves, each with its own wavelength and characteristic.
    Other practical scientists, such as Hertz and Marconi, soon discovered these ‘unseen
    waves. So infrared, ultraviolet, gamma ray, X-rays and radio waves filled the
    electromagnetic spectrum.


    Another Scot, Alexander Graham Bell, had a great interest in the speech study
    and elocution. In the USA, he opened the Boston School for the Deaf. His other
    interest was in multiple telegraphy and he worked on a device which called a harmonic
    telegraph. This used to aid the teaching of speech to deaf people. In 1876, of
    this research he produced the first telephone with an electromagnet for the mouthpiece
    and the receiver. It ‘talks’ (it has not stopped since). Even the great Maxwell
    was amazed that anything so simple could reproduce the human voice and, in 1877,
    Queen Victoria acquired a telephone. Edison enhanced it by using carbon powder
    in the diaphragm which produced an increased amount of electrical current. Bell
    with others formed the Bell Telephone Company which developed the telephone so
    that, by 1915, long-distance telephone calls were possible. Bell''s patent number
    174465 is the most lucrative ever issued. At the time, a reporter wrote about
    the telephone, ‘It is an interesting toy but it can never be of practical value.’


    Around 1851, the brothers Jacob and John Watkins Brett laid a cable across the
    English Channel between Dover and Cape G Nez. For the first use of electrical
    communications between England and France (unfortunately a French fisherman took
    it for a sea monster and pulled it up). The British maintained a monopoly on submarine
    cables and laid cables across the Thames, Scotland to Ireland, England to Holland,
    as well as cables under the Black Sea, the Mississippi River and the Gulf of St
    Lawrence. Submarine cables have been placed under most of the major seas and around
    the world.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Around 1888, German Heinrich Hertz detected radio waves (as predicted by Maxwell)
    when he found that a spark produced an electrical current in a wire on the other
    side of the room. Then, Marconi, in 1896, succeeded in transmitting radio waves
    over a distance of two miles. From this humble start, he soon managed to transmit
    a radio wave across the Atlantic Ocean.


    After the telephone''s initial development, call switching was achieved by using
    operators. However, in 1889, Strowger, a Kansas City undertaker, patented an automatic
    switching system. In one of the catchiest advertising slogans, it was advertised
    as ''a girl-less, cuss-less, out-of-order, wait-less telephone system''. It used
    a pawl-and-ratchet system to move a wiper over a set of electrical contacts. This
    led to the development of the Strowger exchange, which was used extensively until
    the 1970s. Another important improvement came with the crossbar, which allowed
    many inputs to connect to the required connection. The first inventor claimed
    to be J.N Reynolds of Bell Systems, but it was mainly given to G.A. Betuland.


    One of the benefits of war (whether it was a real war or a cold war) is the rapid
    development of science and technology. Radio transmission benefited from this
    over World War I. A by-product of this work was frequency modulation (FM) and
    amplitude modulation (AM). These signals were carried (modulated) high frequency
    carrier waves which travelled through the air better than unmodulated waves. Another
    by-product of the war effort was digital multiplexing (FDM) which allowed many
    signals to be transmitted over the same channel, but with a different carrier
    frequency.


    After the Second World War, the first telephone cable across the Atlantic was
    laid from Oban in Scotland to Clarenceville in Newfoundland. Previously, in 1902,
    the Pacific Ocean cable was laid. A cable, laid in 1963, stretches from Australia
    to Canada.


    The ATT-owned Telstar satellite started a great revolution as it allowed communications
    over large distances using microwave signals. These electromagnetic waves can
    propagate through rain and clouds and bounce off the satellite. The amount of
    information that can be transmitted with the bandwidth of the system. This is
    normally limited by the transmission system. A satellite system can carry as much
    as 10 times the amount of information that a radio wave can carry. This allows
    several TV channels to be transmitted simultaneously and/or thousands of telephone
    calls. Light waves have an even greater capacity for transmitting information
    (almost limitless). Thus, a great leap forward has with the transmission of data
    using fibre-optic cables.


    Most information is transmitted in the form of digital pulses. A standard code
    for this transmission, called pulse code modulation (PCM), was invented by A.H.
    Reeves in the 1930s, but not used until the 1960s.


    A major problem in the past with computer systems was that they used different
    codes to transmit text. Baudot developed a 5-unit standard code for telegraph
    systems. Unfortunately, it had a limited alphabet of upper-case letters and had
    only a few symbols. In 1966, ANSI developed a standard code called ASCII. This
    has since become the standard coding system for text-based communications. In
    its standard form it uses seven bits and can thus represent up to 128 characters.
    It has since been modified to support an 8-bit code (called Extended ASCII).'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 1.3 Electronics, computers and the Internet


    Along with the growth in communications has been the miniaturisation of electronic
    devices and the growth of computer technology. At the core of digital electronics
    is the transistor. In the 1940s, several scientists at the Bell Laboratories were
    investigating materials called semiconductors such as silicon and germanium. These
    substances only conducted electricity moderately, but when they were doped with
    impurities their resistance changed. From this work, the scientists created a
    crystal diode, which worked just like a valve, but had many advantages, including
    the fact that it did not require a vacuum and was much smaller. It also worked
    well at room temperatures, required little current and had no warm-up time. This
    was the start of microelectronics.


    In 1948, William Shockley at the Bell Labs produced a transistor that could act
    as a triode. it was made from a germanium crystal with a p-type section sandwiched
