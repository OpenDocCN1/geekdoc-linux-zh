    # 3.8 Twisted-pair hubs


    Twisted-pair Ethernet (10BASE-T) nodes normally connect to the backbone using
    a hub, as illustrated in Figure 3.12. Connection to the twisted-pair cable is
    via an RJ-45 connector. Connection to the backbone can either be to thin- or thick-Ether.
    Hubs are also stackable, with one hub connected to another. This leads to concentrated
    area networks (CANs) and limits the amount of traffic on the backbone. Twisted-pair
    hubs normally improve network performance.


    10BASE-T uses two twisted-pair cables, one for transmit and one for receive. A
    collision occurs when the node (or hub) detects that it is receiving data when
    it is currently transmitting data.'
