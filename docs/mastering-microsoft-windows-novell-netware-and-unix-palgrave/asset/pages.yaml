    # 17.5.1 Administrator user name


    The administrator account has the highest privileges and will be the most highly
    prized hackable account. If it is hacked into then the whole system is vulnerable
    to attack until it can be proved there are no hidden traps. One method of reducing
    the risk of being hacked is to change the name of the administrator from time
    to time. The administrator password should be totally secure with a relatively
    large password size.


    # 17.5.2 Password security


    The US Government defines certain security levels: D1, C1, C2, B1, B2, B3 and
    A1, which are published in the Trusted Computer Security Evaluation books (each
    of which has a different coloured cover to define their function). These include:


    +   * Orange book. Describes security system.

    * Red book. Interpretation of the Orange book in a network context.

    * Blue book. Application of Orange book to systems not covered in the original
    book.


    Windows NT uses the C2 security level. It has the following features:


    +   * Object control. Users own certain objects and they have control over how
    they are accessed.

    * User names and passwords.

    * No object reuse. Once a user or group has been deleted, the user and group mercur
    IDs are not used again. New users or groups are granted a new ID number.

    * Security auditing system. This allows the system administrator to trace security
    aspects, such as user login, bad logins, program access, file access, and so on.

    * Defined keystroke for system access. In Windows NT/2000, the Ctrl-Alt-Del keystroke
    is used by a user to log into the system.


    # 17.5.3 Password hacking programs


    There are many password cracking hacking programs, especially for UNIX and Windows
    NT. These include:


    +   * Crack. This is a freely available program which can be used on Windows NT
    or UNIX systems. For example a password such as mouse can be cracked within 5
    minutes on a reasonable specification computer. This because Crack searches through
    a library of common words and tries these in different combinations. Operating
    systems such as Linux prompt the user when a password is entered that is typically
    found in a dictionary.

    * PwDump. This utility allows the user to view the encrypted password file for
    a local or a remote Windows NT system. These encoded passwords can be used to
    hack into the system.

    * ScanNT. Used with Windows NT.'
