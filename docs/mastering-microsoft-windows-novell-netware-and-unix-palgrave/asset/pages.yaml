    Uses a variable Huffman coding technique which responds to local changes in probabilities.


    # Address


    A unique label for the location of data or the identity of a communications device.
    This address can either be numeric or alphanumeric.


    # Address aging


    The time that a dynamic address stays in the address routing table of a bridge
    or switch.


    # Address Resolution Protocol (ARP)


    A TCP/IP process which dynamically binds an IP address to a hardware (such as
    an Ethernet MAC address). It can only operate across a single network segment.


    # Address tables


    These are routers, switches and hubs to store either physical (such as MAC addresses)
    or higher-level addresses (such as IP addresses). The address tables map node
    addresses to network addresses or physical domains. These address tables are dynamic
    and change due to nodes moving around the network.


    # Agent


    A program which allows users to configure or fault-find nodes on a net-work.


    # Aging


    The removal of an address from the address table of a router or switch that is
    no longer referred to forward a packet.


    # American National Standards Institute (ANSI)


    ANSI is a non-profit organisation which is made up of expert commit-tees that
    publish standards for national industries.


    # American Standard Code for Information Interchange (ASCII)


    An ANSI-defined character alphabet which has since been adopted as a standard
    international alphabet for the interchange of characters.


    # Amplitude modulation (AM)


    Information is contained in the amplitude of a carrier.


    # Amplitude-Shift Keying (ASK)


    Uses two, or more, amplitudes to represent binary digits. Typically used to transmit
    binary over speech-limited channels.


    # Application layer


    The highest layer of the OSI model.


    # Asynchronous


    Communication which does not depend on a clock.


    # Asynchronous transmission


    Transmission where individual characters are sent one-by-one. Normally'
