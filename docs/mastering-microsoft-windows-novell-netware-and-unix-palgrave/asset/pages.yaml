    # 5.9.2 ftp (file transfer protocol)


    The ftp program uses the TCP/IP protocol to transfer files to from remote nodes.
    If necessary, it uses hosts file to determine the IP address. The user has logged
    into the remote node, the commands that can be used are similar to DOS commands
    such as cd (change directory), dir (list directory), open (open node), close (close
    node), pwd (present working directory). The get command copies a file from the
    remote node and the put command copies it to the remote node.

    The type of file to be transferred must also be specified. This file can be ASCII
    text (the command ascii) or binary (the command binary).


    # 5.9.3 telnet


    The telnet program uses TCP/IP to remotely in to a remote node.


