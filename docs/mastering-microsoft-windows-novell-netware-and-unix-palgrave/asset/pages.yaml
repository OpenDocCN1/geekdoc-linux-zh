  md: '# 10.4 INF files


    Device information (INF) files are used to provide information used by Windows
    95 to install software for a given hardware device. These files are provided by
    hardware manufacturers and define the resources and files required for each class
    of device.


    The format of the INF files is:


    +   - Section names are enclosed in brackets [ ] and must be unique within an
    INF file.

    - Keys within a section do not have to be unique, but the order of keys within
    a section is significant.

    - Private sections in an INF file are not evaluated by Windows 95/98.


    The operating system detects the unique ID of each device installed. For the device
    identified, a specific section of the INF provides information on that class of
    device; the following describes the information contained in a typical INF file
    section. The following section defines some of the INF section names. Figure 10.10
    shows a listing of some INF files (Keyboard.inf, Locale.inf, Msbatch.inf, and
    so on).


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_220_0.png)


    > Figure 10.10 Listing of some INF files


    # 10.4.1 INF file format


    INF files organise information into sections which define the information that
    Setup and the hardware detection process use to determine the resource needs of
    the hardware device and to install software for that device. Typical INF sections
    are:


    +   [Version] A simple header that identifies the INF and the type of hardware
    device (such as a network card, CD-ROM drive, and so on).


    +   [Manufacturer] and [Manufacturer Name] Lists the manufacturers of the device.


    +   [Install] Describes the device driver and any physical attributes of the hardware
    device.


    +   [ClassInstall] Defines a new class for this device (such as a new type of
    device).


    +   [Strings] Defines all localizable strings used in the INF file.'
  merge: -1
  pgno: 220
- img_proc: true
  md: 'Each of these sections can contain one or more entries. Typically an entry
    consists of a key and a value separated by an equals sign. A comment within an
    INF file is given after a semi-colon. For example:


    Class=Keyboard ; the device is a keyboard (of course).


    # [Version]


    A typical format is:


    ```

    [Version]

    Signature="$Chicago$"

    Class=class-name

    Provider=INF_creator

    LayoutFile=filename.inf

    ```


    where class-name defines the class in the Registry for any device installed Fdc.
    INF. Typical class-names are: Adapter, Cdom, Display, EISADDevices, Hdc, Keyboard,
    Modem, Monitor, Mouse, NetService, Nodriver, PCMIA, Ports. Printer, SCSIAdapter
    and System. filename.inf is the INF file that contains the layout information
    (source disks and files). Typically, for Windows 95/98 components, this is LAYOUT.INF.


    # [Install]


    The [Install] section defines additional sections in the INF file that have device-descriptions
    and instructions for installing files. A Reboot or Restart entry may be added
    to force a system restart or reboot when it performs the commands in the [Install]
    section. Its format is:


    ```

    [install-name]=log-config-section-name,{log-config-section-name}...

    CopyFiles=file-list-section,{file-list-section}...

    Renfiles=file-list-section,{file-list-section}...

    DelFiles=file-list-section,{file-list-section}...

    UpdateIn=update-in-section,{update-in-section}...

    UpdateInFields=update-infields-section,{update-infields-section}...

    AddReg=add-registry-section,{add-registry-section}...

    DelReg=del-registry-section,{del-registry-section}...

    Ini2Reg=ini-to-registry-section,{ini-to-registry-section}...

    UpdateCfgSys=update-config-section

    UpdateAutoBat=update-autosec-section

    Reboot | Restart

    ```


    The CopyFiles entry allows any single file to be copied directly from the copy
    line. An individual file is copied by prefixing the file name with an @ symbol.
    The notation for the file copied using this notation will be the DefaultDestDir
    as defined in the [DestDirs] section.


    # [Manufacturer]


    The [Manufacturer] section identifies the device manufacturer and also specifies
    the name of the [Manufacturer] section that contains additional information about
    the device driver.


    The [Manufacturer] format is:'
  merge: -1
