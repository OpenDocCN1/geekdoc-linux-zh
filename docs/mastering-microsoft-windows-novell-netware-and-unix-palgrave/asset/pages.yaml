  md: '# 4.4.3 NTFS (NT file system)


    NTFS is the preferred file system for Windows NT as it makes more efficient usage
    of the disk and offers increased security. It allows for file systems up to 16
    EB (16 exabytes, or 1 billion gigabytes, or 2^64 bytes). As with HPFS it uses
    B-tree format for storing the file system''s directory structure. Its main objectives
    are:


    +   - To increase reliability, NTFS automatically logs all directory and file
    updates which can be used to redo or undo failed operations resulting from system
    failures such as power losses, hardware faults, and so on.

    - To provide sector sparing (or hot fixing). When NTFS finds errors in a bad sector,
    it causes the data in that sector to be moved to a different section and the bad
    sector to be marked as bad. No other data is written to that sector. Thus, the
    disk fixes itself as it is working and there is no need for disk repair programs
    (FAT only marks bad areas when formatting the disk).

    - Increases file size (up to 16 EB).

    - To enhance security permissions.

    - To support POSIX requirements, such as case-sensitive naming, addition of a
    time stamp to show the time the file was last accessed and hard links from one
    file (or directory) to another.


    # 8.5 Administrative tools


    Windows NT has a whole host of administrative tools. Figure 8.3 shows the available
    tools. These include:


    +   - User Manager for Domains. This tool supports the management of security
    for a domain.

    - System Policy Manager. This tool manages the rights granted to groups and user
    accounts.

    - Remote Access Admin. This is a tool which allows users to remotely login into
    a network server.

    - Event Viewer. This is a tool which monitors system, security and application
    events.

    - Disk Administrator. This is a tool which gives a graphical interface for managing
    disks.

    - Licence Manager. This tool helps to manage and track licences within an organisation.
    Licensing can be done per seat or per server.


    # 8.6 User and group accounts


    Each user within a domain has a user account and is assigned to one or more groups.
    Each group is granted granted permissions for the file system, accessing printers,
    and so on.'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'Group accounts are useful because they simplify an organisation into a single
    administrative unit. They also provide a convenient method of controlling access
    for several users who will be using Windows NT to perform tasks. By placing multiple
    users in a group, the administrator can assign rights and/or permissions to the
    group.


    Each user on a Windows NT system has the following:


    +   - A user name (such as fred_bloggs).

    - A password (assigned by the administrator then changed by the user).

    - The groups in which the user account is a member (for example, staff).

    - Any user rights for the assigned computer.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_177_0.png)


    Figure 8.3 Windows NT administrative tools


    Each time a user attempts to perform a particular action on a computer, Windows
    NT checks the user account to determine whether the user has the authority to
    perform that action (such as reading the file, write to the file, delete the file,
    and so on).


    Normally there are three main default user accounts: Administrator, Guest and
    Initial The system manager uses the Administrator account to perform tasks as
    installing software, adding/deleting user accounts, setting up network peripherals,
    installing hardware, and so on.


    Guest accounts allow occasional users to log on and be granted limited rights
    on the local computer. The system manager must be sure that the access rights
    are limited so that hackers or inexperienced users cannot damage the local system.


    The ‘Initial User’ account is created during installation of the Windows NT workstation.
    This account, assigned a name during installation, is a member of the Administrator’s
    group and therefore has all the Administrator’s rights and privileges.


    After the system has been installed, the administrator can allocate new user accounts,
    or by copying existing accounts.'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# 8.7 User Manager


    The User Manager (Figure 8.4) allows the creation and management of user accounts,
