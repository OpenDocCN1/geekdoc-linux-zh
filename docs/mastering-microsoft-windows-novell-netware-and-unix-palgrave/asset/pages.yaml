    $T = \frac{1}{bit rate} = \frac{1}{10 \times 10^6}s = 100ns$


    Thus the maximum and minimum times to transmit a frame will be:


    $T_{max} = (7+1+6+6+2+4+1500+4+12)\times100ns=1.2ms$

    $T_{min} = (7+1+6+6+2+2+46+4+12)\times100ns=0.06\mu s$


    It may be assumed that an electrical signal propagates at about half the speed
    of light ($c=3\times10^8m/s$), the time for a bit to propagate a distance of 500m
    is:


    $T_{500m} = \frac{dist}{speed} = \frac{500}{1.5\times10^8} = 3.33\mu s$


    by which time, the number of bits transmitted will be:


    Number of bits transmitted = \frac{T_{500m}}{T_{bit}} = \frac{3.33\mu s}{100ns}
    = 33.33$


    Thus, if two nodes are separated by 500m then it will take more than 33 bits to
    be transmitted before a node can determine if there has a collision of the line,
    as illustrated in Figure 3.4. If the propagation speed is less than this, it will
    take even longer. This shows the need for the preamble and the requirement for
    a maximum segment length.


