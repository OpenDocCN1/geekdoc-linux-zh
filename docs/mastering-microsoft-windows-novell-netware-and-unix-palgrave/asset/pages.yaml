    When administering a computer running Windows NT Workstation or Windows NT Server
    that is not a domain controller, the list contains only local groups. These computers
    do not maintain global groups.


    Users either have a global account icon or a local account icon. These are defined
    as:


    +   - Global account. Typically, users have a global account which is a normal
    user account in a user''s home domain. To define true relationships for another
    domain, the user must have a global account on one domain to be granted access
