    # Core system components


    The core of Windows 95/98 has a pair of DLLs: User, and GDI (graphical device
    interface), each of which has one for 32-bit accesses; the other for 16-bit accesses.
    The 16-bit DLLs allow for Win16 and MS-DOS compatibility.


    Figure 7.8 shows that the lowest-level services provided by the Windows 95/98
    Kernel are implemented as 32-bit code. In Windows 95/98 the names of the files
    are GDI32.DLL, KERNEL32.DLL, and USER32.DLL; these are contained in \WINDOWS\SYSTEM
    directory.


    # User


    The user component provides input and output to from the user interface. Input
    is from the keyboard, mouse, and any other input device and the output is to the
    user interface. It also manages interaction with the sound driver, timer, and
    communications ports.


    Win32 applications and Windows 95/98 use an asynchronous input model for system
    input. With these devices have an associated interrupt handler (for example, the
    keyboard interrupts with IRQ1) which converts the interrupt into a message. This
    message is sent to a raw input thread, which then passes the message to the appropriate
    message queue. Each Win32 application can have its own message queue, whereas
    Win16 applications share a common message queue.'
