    # 3.5 OSI and the IEEE 802.3 standard


    Ethernet fits into the data link and the physical layer of the OSI model. These
    two layers only deal with the hardware of the network. The data link layer splits
    into two parts: the LLC and the MAC layer.

    The IEEE 802.3 standard splits into three sublayers:


    +   - **MAC** (media access control).

    - **PLS** (physical layer signalling).

    - **PMA** (physical media attachment).


    The interface between PLS and PMA is called the attachment unit interface (AUI)
    and the interface between PMA and the transmission media is called the media dependent
    interface (MDI). This grouping into modules allows Ethernet to be very flexible
    and to support a number of bit rates, signalling methods and media types. Figure
    3.8 illustrates how the layers interconnect.'
