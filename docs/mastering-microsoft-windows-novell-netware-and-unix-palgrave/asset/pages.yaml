  md: 'Where:


    +   - Pointer (8-bit). Identifies the byte location of the parameter error in
    the original IP header. For example, a value of 9 would identify the Protocol
    field, and 12 identify the Source IP address field.

    - Identifier (16-bit). Helps the matching of requests and replies (possibly set
    to zero). It can be used to identify a unique connection.

    - Sequence Number (16-bit). Helps in matching request and replies (possibly set
    to zero).

    - Timestamps (32-bit) – This is the time in milliseconds since midnight UT (Universal
    Time). If this is not possible then it is anytime, as long as the high-order bit
    of the timestamp is set to a 1 to indicate that it is non-standard time.

    - Gateway address (32-bit). The address of the gateway to which network traffic
    specified in the original datagram should be sent to.

    - Internet Header + 64 bits of the data part. This is the original IP header and
    the first 64 byte of the data part. It is used by the host to match to the required
    high-level application (such as TCP port values).


    The descriptions of the messages and replies are:


    +   - Source Quench Message (44). Sent by a gateway or a destination host when
    it discards a datagram (possibly through buffer memory), and identifies that the
    sender should reduce the flow of traffic transmission. The host should then reduce
    the flow, and gradually increase it, as long as it does not receive any more Source
    Quench messages.

    - Time Exceeded Message (11). This is sent either by a gateway when a datagram
    has a Time-to-Live field which is zero and has been deleted, or when a host cannot
    reassemble a fragmented datagram due to missing fragments, within a certain time
    limit.

    - Parameter Problem Message (12). Sent by either a gateway or a host when they
    encounter a problem with one of the parameters in an IP header.

    - Destination Unreachable Message (3). Sent by a gateway to identify that a host
    cannot be reached or a TCP port does not exist.

    - Redirected Message (5). Sent by one to inform other gateways that there is a
    better route to a network destination address.

    - Information Reply Message (15). Sent in reply to an Information Request. See
    Information Request (16) for a typical usage.

    - Information Request (16). This request can be sent with a fully specified Source
    IP address, and a zero Destination IP address. The replying IP gateway then replies
    with an Information Reply Message with its fully specified IP address. In this
    way the host can determine the network address that it is connected to.

    - Echo Message (8). Requests an echo. See Echo Reply in the Echo Message (8)

    - Echo Reply Message (0). The data received in the Echo Message (8) must be returned
    in this message.'
