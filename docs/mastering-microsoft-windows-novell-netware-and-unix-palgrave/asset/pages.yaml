  md: '# Preface


    Many computer networks are now a hybrid of different types, typically a mixture
    of two or more different operating systems. These systems must successfully integrate
    for the complete system to operate properly, whether it is in terms of its compatibility,
    its security or its ease-of-use. The main aim of this book is to cover the configuration,
    architecture and networking of three of the most popular operating systems (NOS).
    The book splits into nine main sections:


    +   1. **Networking Fundamentals**. Network Topologies, Ethernet (including Fast
    and Gigabit Ethernet), Client/Server architecture, Routers, Bridges and Repeaters.

    2. **Networking Protocols**. TCP/IP, ICMP, DNS, ARP, Boot, multicasting, UDP,
    WinSock, SNMP, Wins, DHCP, RIP, OSPF and EGP/BGP.

    3. **Network Security/Intranets**. Proxy servers, Firewalls, Filtering routers,
    Passwords, Extranets, Hacking methods, Hacker problems, Hardware security and
    Data encryption.

    4. **Microsoft Windows**. Windows registry, Device drivers, Configuration Manager,
    Virtual Machine Manager, Multiple file systems, Core system components, Multitasking
    and threading, Plug-and-play process and Windows architecture.

    5. **Microsoft Windows networking**. networking, Robust networking, Security model,
    TCP/IP applications, Windows NT network drives and Windows NT set-up.

    6. **Microsoft Server**. Workgroups/domains, User and group accounts, Policy editor,
    Services, Diagnostics, Administration tools, Boot process and Event viewer.

    7. **Novell NetWare**. NetWare and TCP/IP integration, NetWare architecture, NetWare
    protocols, IPX, Novel NetWare set-up, NDS, NetWare 4/5 and Time synchronisation.

    8. **UNIX**. UNIX commands, Set-up, TCP/IP protocols, NFS, Network configuration
    files, XDR format, Process control and X-Windows.

    9. **Appendices**. Extensive Glossary and Abbreviations, Sample UNIX start-up
    file and a table on assigned Internet addresses.


    The Macmillan Mastering IT and Computing series is expanding rapidly and this
    book is another key foundation book in the whole series. Others include:


    +   * Mastering Networks.

    * Mastering Java.

    * Mastering Pascal and Delphi.

    * Mastering Visual Basic.

    * Mastering C++.

    * Mastering Microsoft Office.'
