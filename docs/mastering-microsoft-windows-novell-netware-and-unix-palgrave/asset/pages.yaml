    # 4.10 Bootp protocol


    The bootp protocol allocates IP addresses to computers based on a table of network
    card addresses. When a computer is first booted, the bootp server interrogates
    its MAC address and looks up the bootp table for its entry. It gets the corresponding
    IP address to the computer. The computer uses it for connections.


    # 4.10.1 Bootp program


    The bootp program is typically run on a Linux-based PC with the bootp program.
    The following shows that the bootp program is currently running on a computer:


    ```

    $ ps -ax

    ```'
