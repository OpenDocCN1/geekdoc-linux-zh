  md: 'The FTP protocol normally requests a user to log into the system. For example,
    many public domain FTP servers use the login of:


    anonymous


    and the password can be anything (but it is normally either the user''s full name
    or their Internet email address). Another typical operation is changing directory
    from a starting directory or the destination file directory. To accommodate this,
    a more general form for is:


    ```

    ftp://<user>:<password>@<hostname>:<port>|<cd1>|<cd2>/...<cd>|<filename>

    ```


    where the user is defined by <user> and the password by <password>. The host name,
    <hostname>, is defined after the @ symbol and change directory commands are defined
    by the cd commands. The node name may take the form //user[:password]@ Without
    a user name, the user anonymous is used.


    For example reference the standard related to HTML Version 2 can be downloaded
    using the URL:


    ```

    http://ds.internic.net/rfc/rfc1866.txt

    ```


    and Internet documents from:


    ```

    http://ftp.isi.edu/internet-drafts/

    ```


    The general format is:


    ```

    ftpurl = "ftp://" login [ "/" fpath [ ";type=" fptype ] ]

    fpath = segment [ *"/" segment ]

    segment = *[ uchar | "" | ":" | "a" | "&" | "-\ ]

    fptype = "A" | "I" | "D" | "a" | "i" | "d"

    ```


    # 16.4 Hypertext Transfer Protocol (HTTP)


    HTTP is the protocol which is used to retrieve information connected with hypermedia
    links. The client and server initially perform a negotiation procedure before
    the HTTP transfer takes place. This negotiation involves the client sending a
    list of formats it can support and the server replying with data in the required
    format.


    Users generally move from a link on one server to another server. Each time the
    user moves from one server to another, the client sends an HTTP request to the
    server. Thus the client does not permanently connect to the server, and the server
    views each transfer independent from all previous accesses. This is known as a
    stateless protocol.


    An HTTP URL takes the form:


    ```

    http://<host>:<port>/<path>??<search>

    ```


    Note that, if the <port> is omitted, port 80 is automatically used (HTTP service).'
