    # ## 12.4 Typical naming syntax


    The NDS tree can use many different naming formats, but a standardised naming
    structure has been developed. These are:


    | Syntax | Example |

    | --- | --- |

    | [ROOT] company_TREE | FRED_TREE |

    | Organisation | company name | O=FRED |

    | Organisation Units | location (or department) | OU=SALES |

    | Servers | location-department-SRV# | SALES-SRV1 |

    | Printer Servers | location-department-PS# | SALES-LZ5-PS3 |

    | Printers | printer-P# | HPLJ5-P2 |

    | Print Queues | type-P# | HPLJ5-P2 |

    | Volumes | server volume | SALES-SRV1 DATA |


    # ## 12.5 Object names


    The location at which an object is placed is called its context. Two objects which
    are placed in the same container have the same context. For example, if the user
    FRED. B works for the Fred & Co. (O=FRED_AND_CO), within the Test Department (OU=TEST),
    which is within the Engineering Unit (OU=ENGINEERING) then his context will be:


    NDS and NetWare 4/5 231'
