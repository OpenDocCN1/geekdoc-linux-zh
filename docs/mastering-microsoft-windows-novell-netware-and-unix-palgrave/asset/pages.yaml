    # 3.11 Switches and switching hubs


    A switch is a very fast, low-latency, multiport bridge that is used to segment
    LANs. They are typically used to increase communication rates between segments
    with multiple parallel conversations and also communication between technologies
    (such as between FDDI and 100BASE-TX).'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'A 4-port switching hub is a repeater that contains four distinct network segments
    (as if there were four hubs in one device). Through software, any of the ports
    on the hub can directly connect to any of the four segments at any time. This
    allows for a maximum capacity of 40 Mbps in a single hub.


    Ethernet switches overcome the contention problem on normal CSMA/CD networks.
    They segment traffic by giving each connection a guaranteed bandwidth allocation.
    Figure 3.14 and Figure 3.15 show the two types of switches; their main features
    are:


    +   - Desktop switch (or workgroup switch). These connect directly to nodes. They
    are economical with fixed configurations for end-node connections and are designed
    for standalone networks or distributed workgroups in a larger network.

    - Segment switch. These connect 10 Mbps workgroup switches and 100 Mbps interconnect
    (backbone) switches that are used to interconnect hubs and desktop switches. They
    are modular, high-performance switches for interconnecting workgroups in mid-
    to large-size networks.


    # 3.11.1 Segment switch


    A segment switch allows simultaneous communication between any client and any
    server. A segment switch can simply replace existing Ethernet hubs. Figure 3.15
    shows a switch with five ports each transmitting at 10 Mbps; this allows up to
    five simultaneous connections giving a maximum aggregated bandwidth of 50 Mbps.
    If the nodes support 100 Mbps communication then the maximum bandwidth will be
    500 Mbps. To optimise the network, nodes should be connected to the switch that
    connects to the server with which it most communicates. This allows for a direct
    connection with that server.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_61_0.png)


    Figure 3.14 Desktop switch'
  merge: -1
