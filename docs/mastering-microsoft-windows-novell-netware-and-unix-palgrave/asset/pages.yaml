    # 17.8 Hacker problems


    Once a hacker has entered into a system, there are many methods which can be used
    to further penetrate the system, such as:


    +   - Modifying search paths. All systems set up a search path in which the system
    looks to find the required executable. For example, in a UNIX system, a typical
    search path is /bin, /usr/bin, and a hacker can change search paths for a user
    and then replace standard programs with ones that have been modified. For example,
    the hacker could replace the example program for one that sends emails directly
    to the hacker or any directory listings could be sent to the hacker''s screen.
    Modifying shared libraries. As discussed previously.

    - Running a processor intensive task which slows the system down. This task will
    be in the background and will generally not be seen by the user. The hacker can
    further attack the system by adding the processor intensive task to the system
    startup file (such as rc file).

    - Running network intensive tasks which will slow the network down, and typically
    slow down all the connected computers. As with the processor intensive task, the
    networking intensive task can be added to the system start-up file.

    - Infecting the system with a virus or worm.


    Most PCs have now viruses that scan the memory and files for viruses and thus
    are easy to detect. A more sinister virus is spread over the Internet, such as
    the Internet worm which was released in November 1988. This is a program that
    runs on a computer and creates two threads. A thread in a program is a unit of
    code that can get a time slice from the operating system to run concurrently with
    other code units. Each process consists of one or more execution threads that
    identify the code path flow as it is on the operating system. This enhances the
    running of an application by improving throughput and responsiveness. With the
    worm, the first thread searches for a network connection and when it finds a connection
    copies itself to that computer. Next, the worm makes a copy of itself and runs
    it on the system. Thus a single copy will become two, then four, eight, and so
    on. This will then continue until the system, and the other connected systems,
    will be shut down. The only way to stop the worm is to shutdown all the affected
    computers at the same time and restart them.'
