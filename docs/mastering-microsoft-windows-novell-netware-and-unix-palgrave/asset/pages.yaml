  md: '# 17.10.7 IDEA


    A new variant, called Triple DES, has been proposed by Tuchman and has been standardised
    in financial applications. The technique uses two keys and three executions of
    the DES algorithm. A key, $K_1$, is used in the first execution, and $K_2$ is
    used and finally $K_1$ is used again. These two keys give an effective key length
    of 112 bits, that is $2 \times 64$ key bits minus 16 parity bits. The Triple DES
    process is illustrated in Figure 17.13.


    IDEA (International Data Encryption Algorithm) is a private-key encryption process
    with similar to DES. It was developed by Xuejia Lai and James Massey of ETH Zurich
    and is intended for implementation in software. IDEA operates on 64-bit blocks
    of plaintext; using a 128-bit key, it converts them into 64-bit blocks of ciphertext.
    Figure 17.14 shows the basic encryption process.


    IDEA operates over 17 rounds with a complicated mangler function. During decryption
    does not have to be reversed and can simply be applied in the same way as during
    encryption (this also occurs with DES). IDEA uses a different key for encryption
    and decryption, but every other part of the process is identical. The same keys
    are used in DES decryption but in the reverse order.

    There are no known methods that can be used to crack IDEA, apart from exhaustive
    search. Thus, as it has a 128-bit code it is extremely difficult to break, even
    with modern high-performance computers.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_339_0.png)


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_339_1.png)'
