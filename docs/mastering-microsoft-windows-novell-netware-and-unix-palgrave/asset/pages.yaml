  pgno: 395
- img_proc: true
  md: '# Dynamic host protocol (DHCP)


    It manages a pool of IP addresses for computers without a known IP address. This
    allows a finite number of IP addresses to be reused quickly and efficiently by
    many clients.


    # Entropy coding


    Coding scheme which does not take into account the characteristics of the data
    and treats all bits in the same way. It produces lossless coding by statistical
    encoding and suppressing repetitive sequences.


    # Ethernet


    A local area network which uses coaxial, twisted-pair or fiber optic cable as
    a communication medium. It transmits at a rate of 10 Mbps and was developed by
    DEC, Intel and Xerox Corporation. The IEEE 802.3 network standard is based upon
    Ethernet.


    # Ethernet address


    A 48-bit number that identifies a node on an Ethernet network. Ethernet addresses
    are assigned by the Xerox Corporation.


    # Even parity


    An error-detection scheme where defined bit-groupings have an even number of 1s.


    # Extended Binary Coded Decimal Interchange Code (EBCDIC)


    An 8-bit code alphabet developed by IBM allowing 256 different bit patterns for
    character definitions.


    # Fast Ethernet


    See IEEE 802.3u standard.


    # Fat pipe


    Term used to indicate a high level of bandwidth of the defined port.


    # Fibre Distributed Data Interface (FDDDI)


    A standard network technology that uses a dual counter-rotating fiber ring. It
    operates at 100 Mbps and provides for reliable backbone connections.


    # File server


    Computer that allows the sharing of files over a network.


    # File transfer protocol (FTP)


    A protocol for transmitting files from host computers using the TCP/IP protocol.


    # Firewall


    Device which filters incoming and outgoing traffic.


    # Flow control


    Procedure to regulate the flow of data between two nodes.


    # Forward adaptive bit allocation


    This technique is used in audio compression and makes bit allocation decisions
    adaptively, depending on signal content.


    # Fragment free cut-through switching


    A modified cut-through switching technique where a switch or switch module waits
    until it has received a large enough packet to determine if it is error free.


    # Frame


    Normally associated with a packet which has layer 2 information added to it. Packets
    are those contained within frames. Frames and packets have variable lengths as
    opposed to cells which have fixed lengths.


    # Frame check sequence (FCS)'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# Full duplex


    to transmit binary data over speech-limited channels.

    Simultaneous, two-way communications.


    # Gateway


    A device that connects networks using different communications protocols, such
    as between Ethernet and FDDI. It provides protocol translation, in contrast to
    a bridge which connects two networks that are of the same protocol.


    # GIF


    Standard image compression technique which is copyrighted by Compu Inc. It uses
    LZW compression and supports a palette of 256 24-bit colours (16.7M colours).
    GIF support local and global tables and animated images.


    # Half-duplex (HDX)


    Two-way communications, one at a time.


    # Handshaking


    A reliable method for two devices to pass data.


    # HDLC


    ISO standard for the data link layer.


    # Hello packet


    Message transmitted from a root bridge to all other bridges in the network to
    constantly verify the Spanning Tree setup.


    # Hop


    The number of hops used by the RIP routing protocol to measure the distance between
    a source and a destination.


    # Host


    A computer that communicates over a network. A host can initiate communications
    and respond to communications that are addressed to it.


    # Huffman coding


    Uses a variable length code for each of the elements within the data. It normally
    analyses the probability of the element in the data and codes the most probable
    with fewer bits than the least probable.


    # Hub


    A hub is a concentration point for data and repeats data from one node to all
    other connected nodes.


    # Hypertext markup language (HTML)


    Standard language that allows the integration of text and images over a distributed
    network.


    # Integrated systems digital network (ISDN)


    Communication technology that contains two data channels (2B) and a control channel
    (H). It supports two 64 kbps data channels and sets up a circuit-switched connection.


    # International Union Telecommunication Standards Sector (ITU-TSS)


    Organization which has replaced the CCITT.


    # Internet


    Connection of nodes on a global network which use a DARPA-defined Internet address.


    # internet


    Two or more connected networks that may, or may not, use the same communication
    protocol.


    # Internet address


    An address that conforms to the DARPA-defined Internet protocol. A unique, four
    byte number identifies a host or gateway on the Internet. This consists of a network
    number followed by a host number. The host number can be further divided into
    a subnet number.'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# Internet Engineering Task Force (IETF)


    A committee that reviews and supports Internet protocol proposals.


    # Intranet


    A company specific network which has additional security against external users.


    # IP (Internet Protocol)


    Part of the TCP/IP which provides for node addressing.


    # IP address


    An address which is used to identify a node on the Internet.


    # IP multicast


    Addressing technique that allows IP traffic to be propagated from one source to
    a group of destinations.


    # IPX (Internet Packet Exchange)


    Novell Net communications protocol which is similar to the IP protocol. The packets
    include network addresses and can be routed from one network to another.


    # IPX address


    Station address on a Novell Network. It consists of two fields: a network number
    field and a node number field. The node number is the station address of the device
    and the network number is assigned to the network when it is started up. It is
    written in the form: NNNNNNN:XXXXX-XXXXX, where N''s represent the network and
    X''s represent the station address. An example of an IPX address is: DC05333:542C0-FF1432.


    # ISO


    International Standards Organisation.


    # ITU-T


    The Consultative Committee for International Telephone and Telegraph (now known
    at ITU-T) is an advisory committee established by the United Nations. They attempt
    to establish standards for inter-country data transmission on a worldwide basis.


    # Jabber


    Occurs when the transmission of network signals exceeds the maximum allowable
    transmission time (20 ms to 150 ms). The medium becomes overrun with data packets.
    This is caused by a faulty node or wiring connection.


    # Jitter


    Movement of the edges of pulse over time, that may introduce error and loss of
    synchronisation.


    # JPEG


    Image compression technique defined by the Joint Photographic Expert Group (JPEG),
    a subcommittee of the ISO/IEC. It uses a DCT, quantization, run-length and Huffman
    coding.


    # Latency


    Defines the amount of time between a device receiving data and being forwarded
