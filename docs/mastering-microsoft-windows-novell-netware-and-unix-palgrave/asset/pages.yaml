  md: "# UNIX Network Start-up Files\n\n# D.1 netfssrc file\n\nThis appendix documents\
    \ a typical netnfsrc (NFS start-up file) file. In the script portion given below\
    \ the NFS_CLIENT is set to a 1 if the host is set to a client (else it will be\
    \ 0) and the NFS_SERVER parameter is set to a1 if the host is set to a server\
    \ (else it will be 0). Initially the NFS clients and servers are started. Note\
    \ that a host can be a client, server, both or neither.\n\nNext the mount daemon\
    \ is started, after which the NFS daemons (nfsd) are started (only on master).\
    \ After this bind daemon runs.\n\n```\nNFS_CLIENT=1\nNFS_SERVER=1\nSTART_MOUNT=0\n\
    ## Read in /etc/exports\n##\nif [ $LFS -eq 0 -a $NFS_SERVER -ne 0 -a -f /etc/exports\
    \ ]; then\n  /etc/stab\n  /usr/etc/exportfs -a && echo \"Reading in /etc/exports\"\
    \n  set_return\nfi\n\nif [ $NFS_SERVER -ne 0 -a $START_MOUNT -ne 0 -a -f /usr/etc/rpc.mountd\
    \ ]; then\n  /usr/etc/rpc.mountd echo \"starting up the mountd\" && echo \"\\\
    t/usr/etc/rpc.mountd\"\n  set_return\nfi\n\nif [ $LFS -eq 0 -a $NFS_SERVER -ne\
    \ 0 -a -f /etc/nfsd ]; then\n  /etc/nfsd 4 && echo \"starting up the NFS daemons\"\
    \ && echo \"\\t/etc/nfsd 4\"\n  set_return\nfi\n\nif [ $NFS_CLIENT -ne 0 ]; then\n\
    \  if [ -f /etc/biod ]; then\n    /etc/biod 4 && echo \"starting up the BIO daemons\"\
    \ && echo \"\\t/etc/biod 4\"\n    set_return\n  fi\n  /bin/cat /dev/null > /etc/nfs.up\n\
    fi\n```\n\nThe next part of the netfsrc file deals with the NIS services. There\
    \ are three states: NIS MASTER SERVER, NIS SLAVE SERVER and NIS CLIENT. A host\
    \ can be a master server or a slave server, but cannot be both. All NIS servers\
    \ must also be NIS"
