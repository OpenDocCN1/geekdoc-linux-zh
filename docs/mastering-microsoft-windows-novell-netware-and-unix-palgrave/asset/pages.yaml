  md: '# # TCP and TCP/IP Commands


    # ## 5.1 Introduction


    TCP, ICMP and IP are extremely important protocols as they allow hosts to communicate
    over the Internet in a reliable way. The TCP layer is defined by RFC793 and RFC1122,
    ICMP by RFC792 and the IP layer by RFC791. TCP provides a connection between hosts
    and supports error handling. This chapter discusses TCP in more detail and shows
    how a connection is established and then maintained. An important concept of TCP/IP
    communications is the usage of ports and sockets. A port identifies the process
    type (such as FTP, TELNET, and so on) and the socket identifies a unique connection
    number. In this way, TCP/IP can support multiple simultaneous connections of applications
    over a network.


    The IP header is added to higher-level data. This header contains 32-bit IP address
    of the destination node. Unfortunately, the standard 32-bit IP address is not
    large enough to support the growth in nodes connecting to the Internet. Thus a
    new standard, IP Version 6, has been developed to support a 128-bit address, as
    well as additional enhancements.


    # ## 5.2 Transmission control protocol


    In the OSI model, TCP fits into the transport layer and IP fits into the network
    layer. TCP thus sits above IP, which means that the IP header is added onto the
    higher-level information (such as transport, session, presentation and application).
    The main function of TCP is to provide a robust and reliable transport protocol.
    It is generalised as a reliable, connection-oriented, acknowledged and datagram-oriented
    server. IP, itself, does not support the connection of two nodes, whereas TCP
    does. With TCP, a connection is initially established and is then maintained for
    the length of the transmission.


    The main aspects of TCP are:


    +   * **Data Transfer.** Data is transmitted between two applications by packaging
    the data within TCP packets. This data is buffered and forwarded whenever necessary.
    A push function can be used when the data is required to be sent immediately.


    +   * **Reliability.** TCP uses sequence numbers and positive acknowledements
    (ACK) to keep track of transmitted packets. Thus, it can recover from data that
    is damaged, lost, duplicated, or delivered out of order, such as:'
  merge: -1
  pgno: 106
- img_proc: true
  md: '+   Time-outs. The transmitter waits for a given time (the timeout interval),
    and if it does not receive an ACK, the data is retransmitted.


    +   Sequence numbers. The sequence numbers are used at the receiver to correctly
    order the packets and to delete duplicates.


    +   Error detection and recovery. Each packet has a checksum, which is checked
    by the receiver. If it is incorrect the receiver discards it, and can use the
    acknowledgments to indicate the retransmission of the packets.


    +   Flow Control. TCP returns a window with every ACK. The range of acceptable
    sequence numbers beyond the last segment successfully received. This window also
    indicates the number of bytes that the sender can transmit before receiving further
    acknowledgments.


    +   Multiplexing. To support multiple connections to a single host, TCP provides
    a set of ports within each host, along with the IP addresses of the source and
    destination, makes a socket. Each connection is uniquely identified by a pair
    of sockets. Ports are normally associated with various services and allow service
    programs to listen for defined port numbers.


    +   Connections. A connection is defined by the sockets, sequence numbers and
    window sizes. Each host must maintain this information for the length of the connection.
    When the connection is closed, all associated resources are free. As TCP connections
    can be made with unreliable hosts and over unreliable channels, TCP uses a handshake
    mechanism with clock-based sequence numbers to avoid inaccurate connection initialisation.


    +   Precedence and Security. TCP allows for different security and precedence
    levels.


    TCP information contains simple acknowledgement messages and a set of sequential
    numbers. It supports multiple simultaneous connections using destination and source
    port numbers, and manages them for both transmission and reception. With IP, it
    supports data fragmentation and reassembly, and dataing/demultiplexing.


    The set-up and operation of TCP is as follows:


    +   1. When a host wishes to make a connection, TCP sends out a request message
    to the destination machine that contains unique numbers called a socket number,
    and a port number. The port number has a value which is associated with the application
    (for example a TELNET connection has the port number 23 and an FTP connection
    has the port number 21). The message is then passed to the IP layer, which assembles
    a datagram for transmission to the destination.


    +   2. When the destination host receives the connection request, it returns a
    message containing its own socket number and a port number. The socket number
    and port number then identifies the virtual connection between the two hosts.


    +   3. After the connection has been made the data flow between the two hosts
    (called a data stream).


