    # ### 3.4.1 LLC protocol


    The 802.3 frame provides some of the data link layer functions, such as node addressing
    (source and destination MAC addresses), the addition of framing bits (the preamble)
    and error control (the FCS). The rest of the functions of the data link layer
    are performed with the control field of the LLC field; these functions are:


    +   - **Flow and error control.** Each data frame has a frame number. A control
    frame is sent from the destination to a source node informing that it has or not
    received the frames correctly.

    - **Sequencing of data.** Large amounts of data are sliced and sent with frame
    numbers. The sliced data is then reassembled at the destination node.


    Figure 3.7 shows the basic format of the LLC frame. There are three principal
    types of frame: information, supervisory and unnumbered. An information frame
    contains data, a supervisory frame is used for acknowledgement and flow control,
    and an unnumbered frame is used for control purposes. The first two bits of the
    control field determine which type of frame it is. If they are 0X (where X is
    a don''t) then it is an information frame, 10 specifies a supervisory frame and
    11 specifies an unnumbered frame.


    An information frame contains a sequence number in the control field which'
