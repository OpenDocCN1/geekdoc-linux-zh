- img_proc: true
  md: 'A typical conversation is as follows:


    +   * Application sends an application message to TCP.

    * TCP sends the corresponding TCP message to the IP module. The destination IP
    address is known by the application, the TCP module, and the IP module.

    * At this point IP packet has been constructed and is ready to be given to the
    Ethernet driver, but first the Ethernet address must be determined.

    * The ARP table is used to look up the destination Ethernet address.


    The sequence of determining the Ethernet address is as follows:


    +   1. An ARP request packet with a broadcast Ethernet address (FF-FF-FF-FF-FF-FF)
    is sent out on the network to every computer. Other typical Ethernet broadcast
    addresses are given in Section 41.5.3.

    2. The outgoing IP packet is queued.

    3. All the computers on the network segment read the broadcast Ethernet frame,
    and examine the Type field to determine if it is an ARP packet. If it is it is
    passed to the ARP module.

    4. If the IP address of a receiving station matches the IP address in the IP packet
    it sends a response directly to the source Ethernet address.

    5. The originator receives the Ethernet frame and checks the Type field to determine
    if it an ARP packet. If it is an ARP packet then it adds the sender''s IP address
    and Ethernet address to its ARP table.

    6. The IP packet can now be sent with the correct Ethernet address.


    Each computer has a separate ARP table for each of its Ethernet interfaces.


    # 4.13 IP multicasting


    Many applications of modern communications require the transmission of IP datagrams
    to multiple hosts. Typical applications are video conferencing, remote teaching,
    and so on. This is supported by IP multicasting, where a host group is identified
    by a single IP address. The main parameters of IP multicasting are:


    +   * The group membership is dynamic.

    * Hosts may join and leave the group at any time.

    * There is no limit to the location or number of members in a host group.

    * A host may be a member of more than one group at a time.

    * A host group may be permanent or transient. Permanent groups are well known
    and are administratively assigned a permanent IP address. The host then dynamically
    associated with this IP address. IP multicast addresses that are not reserved
    to permanent groups are available for dynamic assignment to transient groups.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '+   • Multicast routers forward IP multicast datagrams into the Internet.


    # 4.13.1 Group addresses


    A special group of addresses are assigned to multicasting. These are known as
    Class D addresses, and they begin with 1110 as their starting 4 bits (Class E
    addresses with the upper bits of 1111 are reserved for future uses). The Class
    D addresses thus range from:


    224.0.0.0 (11100000 00000000 00000000 00000000)


    239.255.255.255 (11101111 11111111 11111111 11111111)


    The address 224.0.0.0 is reserved. 224.0.0.1 is also assigned to the permanent
    group of all IP hosts (including gateways), and is used to address all multicast
    hosts on the directly connected network. Reserved and allocated addresses are:


    224.0.0.0 Reserved

    224.0.0.1 All Systems on current subnet

    224.0.0.2 All Routers on current subnet

    224.0.0.3 Unassigned

    224.0.0.4 DVMRP Routers

