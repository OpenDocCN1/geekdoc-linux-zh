    # NIS master server and slave server


    With NIS, a node network acts as the NIS master server, and there may be a number
    of NIS slave servers. The slave servers receive their NIS information from the
    master server. When a client starts up it sends out broadcast to all NIS servers
    (master or slaves) on the network and waits for the first to respond. The client
    then binds to the first that responds and addresses all requests to that. If this
    server becomes in then NIS client will automatically rebind to the first NIS server
    which responds to another broadcast.


    Table 14.1 outlines the records which are used in the NIS database (or NIS map).
    This file consists of logical records with a search key and a related value for
    each rec


