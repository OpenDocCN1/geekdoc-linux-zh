  md: '# 17 Intranets and Security


    # 17.1 Introduction


    An organisation may experience two disadvantages in having a connection to the
    WWW and the Internet:


    +   * The possible usage of the Internet for non-useful applications (by employees).

    * The possible connection of non-friendly users from the global connection into
    the organisation local network.


    For these reasons many organisations have shielded away from connection to the
    global network and have set up intranets. These are in-house, tailor-made internets
    for use within the organisation and provide limited access (if any) to outside
    services and also limit the external traffic into the intranet (if any). An intranet
    might have access to the Internet but there will be no access from the Internet
    to the organisation’s Intranet.


    Organisations which have a requirement for sharing and distributing electronic
    information normally have three choices:


    +   * Use a propriety groupware package, such as Lotus Notes.

    * Set up an intranet.

    * Set up a connection to the Internet.


    Groupware packages normally replicate data locally on a computer whereas intranets
    centralise their information on central servers which are then accessed by a single
    browser package. The stored data is normally open and can be viewed by any compatible
    WWW browser. Intranet browsers have the great advantage over groupware packages
    that they are available for a variety of clients, such as PCs, UNIX workstations,
    Macs, and so on. A client browser also provides a single GUI interface which easy
    integration with other applications, such as electronic mail, images, audio, video,
    animation, and so on.


    The main elements of an intranet are:


    +   * Intranet server hardware.

    * Intranet server software.

    * TCP/IP stack software on the clients and the server.

    * WWW browsers.

    * A firewall.'
  merge: -1
  pgno: 320
- img_proc: true
  md: 'Typically the intranet server consists of a PC running Linux (PC-based UNIX-like)
    operating system. The TCP/IP stack is software installed on each computer and
    allows communications between a client and a server using TCP/IP.


    A firewall is the routing computer which isolates the intranet from the outside
    world. Another method is to use an intermediate system which isolates the intranet
    from the external Internet. These intermediate system include:


    +   - A proxy.

    - A gateway.

    - A tunnel.


    Each intermediate system is connected by a TCP and acts as a relay for the request
    to be sent out and returned to the client. Figure 17.1 shows the set-up of the
    proxies and gateways.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_321_0.png)


    # 17.2 Proxy server


    A proxy connects to a number of clients; it acts on behalf of other clients and
    sends requests from the clients to a server. It acts as a client when it communicates
    with a server, but as a server when communicating with a client. A proxy is typically
    used for security purposes where the client and server are separated by a firewall.
    The proxy connects to the client side of the firewall and the server to the other
    side of the firewall. Thus the server must authenticate itself to the firewall
    before a connection can be made with the proxy. Only after this has been authenticated
    will the proxy pass requests through the firewall. A proxy can also be used to
    convert between different versions of the protocols TCP/IP, such as HTTP.'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# 17.3 Firewalls


    firewall (or security gateway) protects a network against intrusion from outside
    sources. They tend to differ in their approach but can be characterised as follows:


    +   - Firewalls which block traffic.

    - Firewalls which permit traffic.


    They can be split into three main types:


    +   - Network-level firewalls (packet filters). This type of firewall examines
    the parameters of the TCP/IP packet to determine if it should dropped or not.
    This can be done by examining the destination address, the source address, the
    destination port, the source port, and so on. The firewall must contain a list
    of barred IP addresses or allowable IP address. Typically a system manager will
    determine IP addresses of sites which are barred and add them. typically TELNET
    and FTP ports are barred and SMTP is barred, as this allows mail to be routed
    into and out of the network, but no remote connections.

    - Application-level firewalls. This type of firewall uses an intermediate system
    (proxy server) to isolate the local computer from the external network. The local
    computer communicates with the proxy server, which in turn communicates with the
    external network; the external computer in turn communicates with the proxy in
    which turn communicates with the local computer. The external network never actually
    communicates directly with the local computer. The proxy server can then be set
    up to be limited to certain types of data transfer, such as allowing HTTP (for
    WWW access), SMTP (for electronic mail), outgoing FTP, but blocking incoming.

    - Circuit-level firewalls. A circuit-level firewall is similar to an application-level
    firewall but it does not bother about the transferred protocol.


    # 17.3.1 Network-level firewalls


    The network-level firewall (or packet filter) is the simplest form of firewall
    and is also known as a screen router. It basically keeps a record of allowable
    source and destination IP addresses, and deletes all packets which do not have
    them. This technique is known as address filtering. The packet filter keeps a
    record of source and destination table for both directions, that is, into and
    out of the intranet. This type of method is useful for companies which have geographically
    spread sites, but the packet filter allows incoming traffic from other friendly
    sites, but blocks other non-friendly traffic. This is illustrated by Figure 17.2.


    Unfortunately, this method suffers from the fact that IP addresses can be easily
    forged. For example, a hacker might determine the list of good source addresses
    and add one of them to any packets which are addressed to the intranet. This type
    of attack is known as address spoofing and is the most common method of attacking
    a network.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '![](img/da031d9e3a72792b55f2a8fb16c012a5_323_0.png)


    # ## 17.2 Application-level firewall


    The application-level firewall uses a proxy server to act between the external
    network and the local computer. Normally the proxy only supports a given number
    of protocols, such as HTTP (for WWW access) or FTP. It is thus possible to block
    certain types of protocols, typically outgoing FTP (Figure 17.3).


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_323_1.png)


    The proxy server thus isolates the local computer from the external network. The
    local computer communicates with the proxy server, which in turn communicates
    with the external network; the external computer communicates with the proxy,
    which in turn communicates with the local computer. The external network never
    actually communicates directly with the local computer. Figure 17.4 shows a WWW
    browser is set up with a proxy server to get its access. In the advanced options
    (Figure 17.5) different proxy servers can be specified. In this case for HTTP
    (WWW access), FTP, Gopher, Secure and Socks (Windows Sockets). It can also be
    seen that a proxy server can be bypassed by specifying a number of IP addresses
    (or DNS).'
