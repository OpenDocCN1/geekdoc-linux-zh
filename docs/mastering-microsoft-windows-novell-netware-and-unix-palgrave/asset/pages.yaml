    # 19.3.3 class java.net.URLConnection


    Represents an active connection to an object represented by a URL. The main methods
    are:


    ```

    public abstract void connect() URLConnection objects are initially created and
    then they are connected.

    public URL getURL() Returns the URL for this connection.

    public int getContentLength() Returns the content length, a -1 if not known.

    public String getContentType() Returns the content type, a null if not known.

    public String getContentEncoding() Returns the content encoding, a null if not
    known.

    public long getExpiration() Returns the expiration date of the object, a 0 if
    not known.

    public long getDate() Returns the sending date of the object, a 0 if not known.

    public long getLastModified() Returns the last modified date of the object, a
    0 if not known.

    public String getHeaderField(String name) Returns a header field by name (name),
    a null if not known.

    public Object getContent() Returns the object referred to this URL.

    public InputStream getInputStream() Used to read from objects.

    public OutputStream getOutputStream() Used to write to objects.

    public String toString() Returns the String URL representation.

    ```


    # 19.3.4 class java.net.URLStream


    Abstract class for URL stream openers. Subclasses of this class know how to create
    streams for particular protocol types.


    ```

    protected abstract URLConnection openConnection(URL u) Opens an input stream to
    the object referenced by the URL (u).

    protected void parseURL(URL u, String spec, int start, int limit) Parses the string
    (spec) into URL (u), where start and limit refer to the range of characters in
    spec that should be parsed.

    protected String toExternalForm(URL u) Reverses the parsing of the URL.

    protected void setURL(URL u, String protocol, String host, int port, String file,
    String ref) Calls the (protected) set method out of the URL given.

    ```


