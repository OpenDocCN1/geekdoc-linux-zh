- img_proc: true
  md: '# OU=TEST.OU=ENGINEERING.O=FRED_AND_CO


    An object is either identified by its distinguishing name (such as IP_LASER5)
    or by its complete name (CN). In the name, periods separate the object (these
    periods are similar to back slashes or forward slashes, which is common in many
    operating systems). For a complete name, which is referred to from the [ROOT]
    object, a leading period is used, whereas a relative name does not have a leading
    period. For an example, a complete name for an object FRED_B could be:


    .CN=FRED_B.OU=TEST.OU=ENGINEERING.O=FRED_AND_CO


    This defines a User, which has an Organisation Unit FRED_AND_CO, which is then
    a subdivision below this called TEST. It is also possible to define a relative
    distinguishing name (RDN) which defines the relative path with respect to the
    current context.


    Periods can be added to the start or the end of the context. They have the following
    definitions:


    +   - Leading period. NDS ignores the current context of the object and resolves
    the name at the [ROOT] object.

    - Trailing period. NDS selects a new context when resolving an object''s complete
    name at the [ROOT] object.


    For example, the partial name for the User object FRED_B relative to other objects
    in OU=TEST would be:


    .CN=FRED_B.


    The partial name of the User object FRED_B that has a complete name of:


    .CN=FRED_B.OU=TEST.OU=ENGINEERING.O=FRED_AND_CO


    relative to a server with a complete name of:


    .CN=OU=SALES-SRV1.OU=SALES.O=FRED_AND_CO


    is:


    .CN=FRED_B.OU=TEST.OU=ENGINEERING.


    > Relative name.


    The HPLJ5-P2 printer object which has the complete name of:


    .CN=HPLJ5-P2.OU=TEST.OU=ENGINEERING.O=FRED_AND_CO


    would be referred to, within the OU-TEST.OU=ENGINEERING.O=FRED_AND_CO con-ainer,


    CN=HPLJ5-P2'
