  md: '# Baud rate


    The number of signalling elements sent per second with RS-232, or modem. In RS-232
    the baud rate is equal to the bit-rate. With modems, two or more bits can be encoded
    as a single signalling element, as 2 bits being represented by four different
    phase shifts (or one signalling element). The signalling element could change
    its amplitude, frequency or phase-shift to increase the bit-rate. Thus the baud
    is a better measure of information transfer.


    # Bit stuffing


    The insertion of extra bits to prevent a defined sequence. In HDLC the bit sequence
    0111110 limits the start and end of a frame. Bit stuffing stops this sequence
    from occurring anywhere in the frame by the receiver inserting a 0 whenever there
    are five consecutive 1''s. At the receiver if five consecutive 1''s are followed
    by a 0 the 0 is deleted.


    # BNC BOOTP


    A commonly used connector for coaxial cable.


    A standard TCP/IP protocol which allows nodes to dynamically allocated an IP address.


    # Bridge


    A device which physically links two or more networks using the same communications
    protocols, such as Ethernet/ Ethernet or token ring/ token for the filtering of
    data between network segments.


    # Broadband


    Data transmission using multiplexed data over an analogue signal or high-frequency
    electromagnetic waves.


    # Broadcast


    Message sent to all users on the network.


    # Broadcast domain


    Network where broadcasts can be reported to all nodes on the network bounded by
    routers. Broadcast packets cannot traverse a router.


    # Broadcast storm


    Flood of broadcast packets generated by a broadcast transmission where high numbers
    of receivers are targeted for a long period of time.


    # Buffer Bus


    A temporary-storage space in memory. A network topology where all nodes share
    a common transmission medium.


    # Byte Capacity


    A group of eight bits, see octet. The maximum data rate in Mbps.


    # Carrier Sense Multiple Access / Carrier Detect (CSMA/CD)


    A network where all nodes share a common medium. Nodes must contend for the bus
    and if a collision occurs then all colliding back off for a random time period.


    # Cat-3 cable


    An EIA/TIA-568 standard for unshielded or shielded twisted pair cables.


    # Cat-5 cable


    An EIA/TIA-568 wiring standard for unshielded or shielded twisted pair cables
    for the transmission of over 100 Mbps.


    # CHAP (challenge-handshake authentication protocol)


    Identification method using PPP to determine the originator of a connection.


    # checksum


    An error-detection scheme in which bits are grouped to form integer values and
    then each of the values are summed. Normally, the negative of this value is then
    added as a checksum. At the receiver, all the'
