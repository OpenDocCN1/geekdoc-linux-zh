  md: '# 17.10.8 Survey of public-key cryptystems


    Public-key algorithms use a secret element and a public element to their code.
    One of the main algorithms is RSA. Compared with DES it is relatively slow but
    it has the advantage that users can choose their own code whenever they need the
    one. The most commonly used public-key cryptystems are:


    +   - RSA. RSA is the most commonly public-key cryptosystem. It is patented only
    in the USA and is secure for key-length of over 728 bits. The algorithm relies
    on the fact that it is difficult to factorise large numbers. Unfortunately, it
    is particularly vulnerable to chosen plaintext attacks and a new attack (spying
    on keystroke time) was announced on the 7 December 1995. This attack would be
    to break many existing implementations of RSA.

    - Elliptic curve. Elliptic curve is a new kind of public-key cryptystem. It suffers
    from speed problems, but this has been overcome with modern high-speed computers.

    - DSS. DSS (digital signature standard) is related to the DSA (digital signature
    algorithm). This has been selected by the NIST and the NSA, and is part of the
    Capstone project. It uses 512-bit or 1024-bit key size. The design presents present
    some lack in key-exchange capability and is slow for signature-verification.

    - Diffie-Hellman. Diffie-Hellman is commonly used for key-exchange. The security
    of this cipher relies on both the key-length and the discrete logarithm problem.
    This is similar to the factorising of large numbers. Unfortunately, the code can
    be cracked and the prime number generator must be carefully chosen.

    - LUC. Peter Smith developed LUC which is a public-key cipher that uses Lucas
    functions instead of encryption.


    # 17.10.9 RSA


    RSA is a public-encryption/decryption algorithm and is much slower than IDEA and
    DES. The key length is variable and the block size is also variable. A typical
    key length is 512 bits. RSA uses a public-key and a private key, and uses the
    fact that large prime numbers are extremely difficult to factorise. The following
    steps are taken to generate the public and private keys:'
  merge: -1
  pgno: 340
- img_proc: true
  md: "Select two large prime numbers, $a$ and $b$ (each will be roughly 256 bits\
    \ long). The factors $a$ and $b$ remain secret and $n$ is the result of multiplying\
    \ them together. Each of the prime numbers is of order of $10^{100}$\n\nNext,\
    \ the public-key is chosen. To do this a number $e$ is chosen so that $e$ and\
    \ $(a-1)\times(b-1)$ are relatively prime. Two numbers are relatively prime if\
    \ they have no common factor greater than 1. The public-key is $<e,n>$ and results\
    \ in a key which is 512 bits long.\n\nNext the private key for decryption, $d$,\
    \ is computed as that:\n\n```\n$d=e^{-1} \\pmod{(a-1)\\times(b-1)}$\n```\n\nThis\
    \ gives a private key of $<d,n>$. The values $a$ and $b$ can then be discarded\
    \ (but should never be disclosed to anyone).\n\nThe encryption process to ciphertext,\
    \ $c$, is then defined by:\n\n```\n$c=m^e \\pmod n$\n```\n\nThe message, $m$,\
    \ is then decrypted with:\n\n```\n$m=c^d \\pmod n$\n```\n\nIt should be noted\
    \ that the message block $m$ must be less than $n$. When $n$ is 512 bits then\
    \ a message which is longer than 512 bits must be broken up into blocks of 512\
    \ bits.\n\n# Encryption/decryption keys\n\nWhen two parties, $P_1$ and $P_2$,\
    \ are communicating they encrypt data using a pair of public/private key pairs.\
    \ Party $P_1$ encrypts their message using $P_2$'s public-key. Party $P_2$ uses\
    \ their private key to decrypt this data. When party $P_2$ encrypts a message\
    \ it sends to $P_1$, using $P_1$'s public-key and $P_1$ decrypts this using their\
    \ private key. Notice that $P_1$ cannot decrypt the message it has sent to $P_2$\
    \ as only $P_2$ has the required private key.\n\nA great advantage of RSA is that\
    \ the key has a variable number of bits. It is likely, in the coming years, powerful\
    \ computer systems will determine all the factors to 512-bit values. Luckily the\
    \ RSA key has a variable size and can easily be changed. Many users are choosing\
    \ keys with 1024 bits.\n\n# Simple RSA example\n\nInitially the PARTY1 picks two\
    \ prime numbers. For example:\n\n```\n$a=11$ and $b=3$\n```\n\nNext, the $n$ value\
    \ is calculated. Thus:\n\n```\n$n=a \\times b=11 \\times 3 = 33$\n```"
