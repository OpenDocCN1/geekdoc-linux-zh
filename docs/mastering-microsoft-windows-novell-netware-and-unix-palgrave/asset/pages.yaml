    |byte 0 |byte 1 |byte 2 |byte 3 |byte 4 |byte 5 |byte 6 |byte 7 |

    +------------------------------------------------------------------------------------------------+

    <------------------------------------64 bits------------------------------------>

    ```


    # Floating-point


    A float data type has 32 bits and uses the standard IEEE standard for normalised
    single-precision floating-point numbers. It has three fields:


    +   * S (sign). A 1-bit value which represents a positive number as a 0 and a
    negative number as a 1.

    * E (exponent). An 8-bit value which represents the exponent of the number in
    base 2, minus 127.

    * F (fractional part). A 23-bit value which represents the base-2 fractional part
    of the number''s mantissa.


    The floating-point value is thus represented by:


    ```

    Value=−1S2^(E−127)×1.F

    ```


    It is declared as follows:


    ```

    float identifier;

    ```


    and can be represented by:


    ```

    +------------------------------------------------------+

    |byte 0 |byte 1 |byte 2 |byte 3 |

    |S       | E     |----------------------|F |

    +-------+-------+----------------------+------+

    1|<-- 8 --|----------23 bits----->|

    <--------------------32 bits----------------->>

    ```


    # Double-precision Floating-point


    A double data type has 64 bits and uses the standard IEEE standard for normalised
    double-precision floating-point numbers. It has three fields:


    +   * S (sign). A 1-bit value which represents a positive number as a 0 and a
    negative number as a 1.

    * E (exponent). An 11-bit value which represents the exponent of the number in
    base 2, minus 1023.

    * F (fractional part). A 52-bit value which represents the base-2 fractional part
    of the number''s mantissa.


    The floating-point value is thus represented by:'
