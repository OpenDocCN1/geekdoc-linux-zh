    * Hlen. Hardware address length such as 6 for Ethernet. 1 byte.

    * Hops. Client sets to 0, optionally used by relay agents when booting through
    a relay agent. 1 byte.

    * Xid. Transaction ID is a random number chosen by the client and used by the
    client and the server to associate messages and responses. 4 bytes.

    * Secs. Set by client the number of seconds elapsed since client began address
    acquisition. 2 bytes.

    * Flags. Flags, the format is BRRR...R R bits are reserved for future use (and
    must always be zero) and B defines the broadcast bit which overcomes the problem
    where some clients cannot accept IP unicast datagrams before the TCP/IP software
    is configured. 2 bytes.

    * Ciaddr. Defines the client''s IP address. It is only addressed when the client
    is in the BOUND, RENEW or REBINDING state and can respond to ARP requests. 4 bytes.

    * Yiaddr. Clients IP address 4 bytes.

    * Siaddr. IP address of next server to use in bootstrap; returned in DHCPPOFFER,
