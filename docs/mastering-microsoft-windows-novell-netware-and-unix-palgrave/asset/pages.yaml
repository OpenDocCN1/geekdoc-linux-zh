    The completed circuit for the Ethernet receiver is given in Section 3.16 and is
    outlined in Figure 3.22. It uses the SEEQ Technologies 82C93A Ethernet transceiver
    as the receiver and the SEEQ 8020 Manchester code converter that decodes the Manchester
    code. A transformer and a dc-to-dc converter isolate the SEEQ 82C92A and the network
    cable from the rest of the circuit (and the computer). The isolated dc-to-dc converts
    a 5 V supply to the -9 V needed by the transceiver.'
