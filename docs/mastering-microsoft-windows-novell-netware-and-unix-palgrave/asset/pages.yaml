    The VMM is responsible for three areas:


    +   **Process scheduling.** This is responsible for scheduling processes. It allows
    for multiple applications to run concurrently and also for providing system resources
    to the applications and other processes that run. This allows multiple applications
    and other processes to run concurrently, using either co-operative multitasking
    or pre-emptive multitasking.


    +   **Memory paging.** Windows 95/98/NT uses a demand-paging virtual memory system,
    which is based on a flat, linear address space accessed using 32-bit addresses.
    The system allocates each process a virtual address space of 4GB. The upper 2
    GB is shared, while the lower 2 GB is private to the application. This virtual
    address space is divided into equal blocks (or pages).


    +   **MS-DOS Mode support.** Provides support for MS-DOS-based applications which
    have exclusive access to the hardware. When an MS-DOS-based application runs in
    this mode then no other applications or processes are allowed to compete for system
    resources. The application has sole access to the resources.


    Windows 95/98 has a single VMM (named System VMM) in which all system processes
    run. Win32-based and Win16-based applications run within this VMM. Each MS-DOS-based
    application runs in its own VMM.'
