  md: '[Manufacturer]

    manufacturer-name | %strings-key%=manufacturer-name-section


    where manufacturer-name is the name of the manufacturer. This name can be any
    combination of printable characters, but must uniquely identify the manufacturer
    and must be enclosed in double quotation marks. strings-key is the name of a string
    as defined in a [Strings] section. manufacturer-name-section is the name of the
    [Manufacturer Name] section. This name can be any combination of printable characters,
