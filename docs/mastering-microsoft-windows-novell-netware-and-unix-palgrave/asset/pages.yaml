    # # 3.13 Gigabit Ethernet


    The IEEE 802.3 working group initiated the 802.3z Gigabit Ethernet task force
    to create the Gigabit Ethernet standard (which was finally defined in 1998). The
    Gigabit Ethernet Alliance (GEA) was founded in May 1996 and promotes Gigabit Ethernet
    collaboration between organisations. Companies, which were initially involved
    in the GEA, include: 3Com, Bay Networks, Cisco Systems, Compaq, Intel, LSI Logic,
    Sun and VLSI.'
  merge: -1
