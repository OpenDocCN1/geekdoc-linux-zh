  md: '# 8.13 Master server


    A master server holds all the licensing data for an organisation. Licenses can
    be:


    +   - **Per Seat.** In this mode, each computer must have a Client Access Licence
    to access a Windows NT Server for basic network services, such as file and print
    services. This type of licencing is typically used when clients connect to more
    than one server.

    - **Per Server.** In this mode, the Client Access Licences are assigned to a particular
    server, which allows one connection to that server for basic network services
    (such as file and print services). There must be then enough licenses for the
    number of clients which connect to the server. This type of licensing is typical
    when computers only connect to a single server.


    # 8.14 Boot process


    Normally a computer runs a POST (Power On Self Test), then the MBR (Master Boot
    Record) is loaded. It then loads the PBR (Primary Boot Record) from the primary
    partition (normally the C: drive; A: drive, or even a bootable CD-ROM drive).
    The next, the boot process continues with the following files (and their location):


    ```

    Boot.ini.               Root directory.

    Bootsect.dos.         Root directory.

    Device drivers.        <NTroot>\System32\Drivers

    Hal.dll.               <NTroot>\System32

    tosbodd.sys.          Root directory.

    ttdect.com.          Root directory.

    tlldr.                <NTroot>\System32

    toskrnl.exe           <NTroot>\System32\Config

    System.

    ```


    The boot sequence is then as follows:


    +   1. Ntldr is loaded and switches the processor to operate as a 32-bit processor
    with a flat memory structure.

    2. Ntldr loads the appropriate file system mini-drivers (such as NTFS or FAT).

    3. Ntldr reads the Boot.ini file and displays the boot operating systems, such
    as Windows NT, Windows NT (VGA mode) and Windows 98. The user can then select
    the operating system to boot. Normally, there is a default operating system which
    is chosen within a given time.

    4. Ntldr loads the required operating system. For NT, it runs ntdect which automatically
    scans the hardware and reports the hardware list to ntlldr. For non-NT, Bootsect.dos
    is loaded.

    5. Ntldr loads ntoskrnl.exe and Hal.dll.

    6. Ntlldr load ntoskrnl.exe. This starts the system loader.'
  merge: -1
