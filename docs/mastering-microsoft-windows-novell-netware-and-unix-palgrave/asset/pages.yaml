    # 4.9 Domain name server


    Each institution on the Internet has a host that runs a process called the domain
    name server (DNS). The DNS maintains a database called the directory information
    base (DIB) which contains directory information for that institution. When a new
    host is added, the system manager adds its name and its IP address. It can then
    access the Internet.


    # 4.9.1 DNS program


    The DNS program is typically run on a Linux-based PC with a program called named
    (located in `/usr/sbin/named`) with an information file of `named.boot`. To run
    the program the following is used:


    ```

    /usr/bin/named -b /usr/local/adm/named/named.boot

