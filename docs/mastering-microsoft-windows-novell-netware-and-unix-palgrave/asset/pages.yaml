  md: '![](img/da031d9e3a72792b55f2a8fb16c012a5_324_0.png)


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_324_1.png)


    # 17.4 Filtering routers


    Filtering routers run software which allows many different parameters of the incoming
    and outgoing packets to be examined, such as:'
  merge: -1
  pgno: 324
- img_proc: true
  md: '+   Source IP address. The router will have a table of acceptable IP addresses
    which will limit the access to the external network as all authorised users will
    be granted IP addresses. This unfortunately is prone to IP spoofing, where a local
    user can steal an authorised IP address. Typically it is by determining the IP
    address of a computer and waiting until there is no-one using the computer, then
    using the unused IP address of accessing unauthorised material because other users
    have used their IP address. A login system which monitors IP addresses and the
    files that they are accessing cannot be used as evidence against the user, as
    it is easy to steal IP addresses.


    +   Destination IP address. The router will have a table of acceptable destination
    IP addresses, which are not in the table are blocked. Typically this will be used
    to limit the range of destination addresses to the connected organisational intranet,
    or to block certain addresses (typically pornography sites).


    +   Protocol. The router holds a table of acceptable protocols, such as TCP and/or
    UDP.


    +   Source port. The router will have a table of acceptable TCP ports. For example,
    electronic mail (SNMP) on port 25 could be acceptable, but remote login on port
    513 will be blocked.


    +   Destination port. The router will have a table of acceptable TCP ports. For
    example, FTP on port 20 could be acceptable, but TELNET connections on port 23
    will be blocked.


    +   Rules. Other rules can be added to the system which define a mixture of the
    above. For example, a range of IP addresses can be allowed to transfer on a certain
    port, but another range can be blocked for this transfer.


    Filter routers are either tightly bound when they are installed and then relaxed,
    or are relaxed and bound. The type depends on the type of organisation. For example
    a financial institution will have Microsoft router which will allow very little
    traffic, apart from the authorised traffic. The router can be opened up when the
    systems have been proved to be secure (they can also be closed quickly when problems
    occur).


    An open organisation, such as an education institution; will typically have an
    open system, where users are allowed to access any location on any port, and external
    users are allowed any access to the internal network. This can then be closed
    when internal or external users breach the security or access unauthorised information.
    For example, if a student is accessing a pornographic site consistently then the
    IP address for site will be blocked (this is basically closing the door after
    the horse has bolted).


    To most users the filtering router is an excellent method of limited traffic access,
    but to the determined hacker it can be easily breached, as the hacker can fake
    both IP addresses and port addresses. It is extremely easy for a hacker to write
    their own TCP/IP driver software to address whichever IP address, and port numbers
    that they want.'
  merge: -1
  pgno: 325
- img_proc: true
  md: '# 17.5 Passwords


    Passwords are normally an important part of any secure network. They can be easily
    hacked with the use of a program which continually tries different passwords within
    a given range (normally called directory-based attacks). These can be easily overcome
    by only allowing a user three bad logins before the system locks the user out
    for a defined time. NetWare and Windows NT both use this method, UNIX does not.
    The system manager, though, can determine if an attack has occurred with the BADLOG
    file. This file stores a list of all the bad logins for user and the location
    of the user.


    Passwords are a basic system for providing security on a network, and they are
    only as secure as the users they make. Good rules for passwords are:


    +   - Use unusual names, such as grapevine, danceror or helppcude. Do not use
