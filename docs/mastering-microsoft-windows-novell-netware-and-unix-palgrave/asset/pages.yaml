  md: '# HTTP/Socket Programming


    # 19.1 Introduction


    Java 1.0 was first released in 1995 and was quickly adopted as it fitted well
    with Internet-based programming. It was followed by Java 1.1 which gave faster
    interpretation of Java applets and included many new features. This book documents
    the basic features of Java 1.0 and the enhancements that have been made in Java
    1.1, Java 1.2 (which will be known as Java 2.0) includes further enhancements,
    especially related to security.


    It is a general-purpose, concurrent, class-based, object-oriented language and
    has been designed to make it relatively simple to build complex applications.
    Java is developed from C and C++, but some parts of C++ have been dropped and
    others added.


    Java has great advantage over conventional software code which is compiled hardware
    independent. This is because the compiled code (called bytecodes) is interpreted
    by the WWW browser. Unfortunately this leads to slower execution, but as much
    of the time in a graphical user interface program is spent updating graphics display,
    the overhead is, as far as the user is concerned, not a great one.


    The other advantages that Java has over conventional software languages include:


    +   - It is a more dynamic language than C/C++ and Pascal, and was designed to
    adapt to an evolving environment. It is extremely easy to add new methods and
    extra libraries without affecting existing applets and programs. It is also useful
    in Internet applications as it supports most of the standard compressed image,
    audio and video formats.


    +   - It has networking facilities built into it. This provides support for TCP
    IP sockets, URLs, IP addresses and domains.


    +   - Java is based on C and C++ it avoids some of the difficult areas of C/C/C
    code (such as pointers and parameter passing).


    +   - It supports client/server applications. In the most extreme case the client
    can simply be a graphical terminal which runs Java applets over a network. The
    small ‘black-box’ networked computer is one of the founding principles of Java,
    and it is hoped in the future that small Java-based could replace the complex
    PC/workstation for general-purpose applications, like accessing the Internet or
    playing network games. This ‘black-box’ concept is illustrated in Figure 1.1.


    Most existing Web browsers are enabled for Java applets (such as Explorer 3.0
    and Netscape 2.0 and later versions). Figure 19.2 shows how Java applets are-'
