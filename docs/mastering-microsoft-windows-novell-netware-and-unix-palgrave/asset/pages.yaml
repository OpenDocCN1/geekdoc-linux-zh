  md: '# Internet Routing Protocols


    # 18.1 Introduction


    Routers filter the network traffic so that the only traffic that flows into and
    out of a network is required to go into a network. In many cases there are several
    possible routes that can be taken between two nodes on different networks. Consider
    the network in Figure 18.1. In this case the upper network shows the connection
    between two nodes A and B through routers 1 to 6. From the lower diagram that
    there are four routes that the data can take. To stop traffic taking a long route
    or even one that does not exist, each router must maintain a routing table so
    that it knows where the data must be sent when it receives data destined for a
    remote node.

    For routers to find the best way they must communicate with their neighbours to
    find the best way through the network. This measure can be defined in a number
    of ways, such as the number of router hops to the remote node. Unfortunately the
    number of router hops is not a good measure on the delay of data transmission
    as a route with a fewer number of hops may be congested.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_347_0.png)


    Figure 18.1 Example routing'
  merge: -1
  pgno: 347
- img_proc: true
  md: 'Each router communicates with its neighbours to build-up routing table. For
    example in Figure 18.1 the routing table for router 1 could be:


    | Destination | Distance (hops) | Next router | Output port |

    |---|---|---|--|

    | Net5 | 1 | 2 | (Net1) |

    | Net7 | 2 | 3 | (Net2) |

    | Net8 | 3 | 2 | (Net1) |

    | Net3 | 1 | 3 | (Net2) |

    | And so on. | | | |


    It can be seen that the best route (measured by hops) from node A to Net8 is to
    go Net1. This is the only information that the router needs to store. When the
    data gets to router 2 it has the choice of whether to send it to Net4 or Net5,
    as both routes get to Net8 in two hops.


    A better method of determining the best route is to have some measure of the delay.
    For this routers pass information about their neighbours. For example, if the
    relative delay in Net5 was 1.5 and in Net6 it was 1.25, and the relative delay
    in Net4 was 1.1 and in Net7 1.6, then the relative delay between router 2 and
    router 6 can be calculated as:


    Route(2,6) = 1.5 + 1.26 = 2.76 \qquad$ Route(2,4) = 1.1 + 1.3 = 2.4


    Thus the best route is via router 4.

    Another technique to determine the best route is error probability. In this case
    the probability of an error is multiplied to give the total probability. The route
    with the lowest error probability will be the most reliable Route. For example:


    $P_e(2-5)=0.01 \qquad$ P_e(5-6)=0.15$

    $P_e(2-4)=0.05 \qquad$ P_e(4-6)=0.1


    Thus,


    $P_{error}(2,6)=(1-0.01) \times (1-0.15) = 0.8415$

    $P_{error}(2,6)=(1-0.05) \times (1-0.1) = 0.855$


    Thus, the best route via router 5 is the most reliable.


    # 18.2 RIP


    Figure 18.2 recalls the RIP packet format. The fields are:


    +   * Operation (2 bytes) – this field gives an indication that the RIP packet
    is either a request or a response. The first 8 bits of the field give the command/request
    name and the next 8 bits give the version number.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '+   Network number (4 bytes of IP addresses) – this field defines the assigned
    work address number to which the routing information applies (note, that although
    4 bytes are shown, there are in fact 14 bytes reserved for the address. In RIP
    version 1 (RIPv1), with traffic, 10 of the bytes were unused; RIPv2 uses the 14-byte
    address for other purposes, such as subnet masks.


    +   Number of router hops (2 bytes) – this field indicates the number of routes
    that a packet must go through in order to reach the required destination. Each
    router adds a single hop, the minimum number is 1 and the maximum is 16.


    +   Number of ticks (2 bytes) – this field indicates the amount of time (in 1/18
    second) it will take for a packet to reach a given destination. Note that a route
    with the fewest hops adds may not necessarily be the fastest route.


    RIP packets add to the general network traffic as each router broadcasts its entire
    routing table every 30–60 seconds.


    | Operation | Network number | Number of router hops | Number of ticks | Network
    number | Number of router hops | Number of ticks |

    |---|---|---|---|---|---||}{

    | Routing table entry 1 | | | | Routing table entry 2 | | | |


    Figure 18.2 RIP packet format


    # 18.3 OSPF


    OSPF is an open, non-proprietary standard which was created by the IEFF (Internet
    Engineering Task Force), a task force of the IAB. It is a link state routing protocol
    and is able to maintain a complete and more current view of the total internet
    than distance vector routing protocols. Link state routing protocols have these
    features:


    +   They use link state packets (LSPs) which are special datas that determine
    the names of and the cost or distance to any neighbouring routers and associated
    networks.


    +   Any information learned about the network is then passed to all known routers,
    and not just neighbouring routers, using LSPs. Thus all routers have a fuller
    knowledge of the entire internet than the view of only the immediate neighbours
    (as with distance vector routing).


    OSPF adds to these features with:


    +   Additional hierarchy. OSPF allows the global network to split into areas.
    Thus a router in a domain does not necessarily have to know how reach all the
    networks with a domain, it simply has to send to the right area.'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'Authentication of routing messages using an 8-byte password. This length is
    not enough to stop unauthorised users from causing damage. Its main purpose is
    to reduce the traffic from misconfigured routers. Typically a misconfigured router
    will inform the network that it can reach all nodes with overhead.


    +   - Load balancing. OSPF allows multiple routes to the same place to be assigned
    the same cost and will cause traffic to be distributed evenly over those routes.


    Figure 18.3 shows the OSPF header. The fields in the header are:


    +   - A version number (1 byte) which, in current implementations, has the version
    number of 2.

    - The type field (1 byte) which can range from 1 to 5. Type 1 is the HELLO message
    and the others are to request, send and acknowledge the receipt of link state
    messages. HELLO messages are used by nodes to convince their neighbours they are
    alive and reachable. If a router fails to receive these messages from one of its
    neighbours for some period of time, it assumes the node is no longer directly
    reachable and updates its link state information accordingly.

    - SourceAddr (4 bytes) identifies the sender of the message.

    - Areal (4 bytes) identifies an identifier to the area where the node is located.

    - An authentication field can be set to 0 (none) or 1. If it is set to 1 then
    the authentication contains an 8-byte password.


    | 1 | 1 | 2 |

    |---|---|---|

    | Version | | Message length |

    | Source address | | |

    | Areal | | |

    | Checksum | | Authentication type |

    | Authentication | | |


    **Figure 18.3** OSPF header format


    # 18.4 EGP/BGP


    The two main interdomain routing protocols in recent history are EGP and BGP.
    EGP suffers from several limitations. Its principle limitation is that it treats
    the Internet as a tree-like structure. A tree-like structure, as illustrated in
    Figure 18.4, is normally made of parents and children, with a single backbone.
    A more typical topology for the Internet is illustrated in Figure 18.5.


    BGP is an improvement on EGP (the fourth version of BGP is known as BGP-4).'
  merge: -1
  pgno: 350
- img_proc: true
  md: 'Unfortunately it is more complex than EGP, but not complex as OSPF.

    BGP assumes that the Internet is made up of an arbitrarily interconnected nodes;
    it then assumes the Internet connects to a number of AANs (autonomously attached
    networks), as illustrated in Figure 18.6. These may create boundaries around an
    organisation, an Internet service provider, and so on. It assumes that, once they
    are in the AAN, the packets will be properly routed.


    # Single backbone


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_351_0.png)


    Figure 18.4 Tree-like topology


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_351_1.png)


    Figure 18.5 Network with multiple backbones


    BGP differs in that it tries to find any paths through the network. Thus the main
    goal is reachability instead of the number of hops to the destination. So finding
    a path which is nearly optimal is a good achievement. The AAN administrator selects
    at least one node to be a BGP speaker and also one or more border gateways. These
    gateways simply route the packet into and out of the AAN. The border gateways
    are the routers


