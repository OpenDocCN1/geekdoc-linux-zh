    Figure 10.2 Registry Editor


    # 10.2.3 HKEY_LOCAL_MACHINE


    The HKEY_LOCAL_MACHINE key contains software settings, computer-specific information
    about the type of hardware installed, device drivers, applications, and other
    information. It is common for all users of the computer. Figure 10.3 shows an
    example.


    The subkeys are:


    +   - Config Configurations of the local computer.

    - Enum Device information.

    - Hardware Serial port and modem information.

    - Network Network information which contains user login information, such as the
    user name, primary network provider, and the system policies.

    - Security Information about the network security provider and remote administration
    capabilities.


    Mastering Microsoft Windows, Novell NetWare and UNIX'
