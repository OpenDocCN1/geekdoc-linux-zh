  md: '# # Novell NetWare


    # ## 11.1 Introduction


    Novell NetWare is one of the most popular network operating systems for PC LANs
    and provides file and print server facilities. Its default network protocol is
    normally SPX/IPX. This can also be used with Windows NT to communicate with other
    Windows nodes and NetWare networks. The Internet Packet Exchange (IPX) protocol
    is a network layer protocol for transportation of data between computers on a
    NetWare network. IPX is very fast and has a small connectionless datagram protocol.
    The Sequenced Packet Interchange (SPX) provides a communications protocol which
    supervises the transmission of the packet and ensures its successful delivery.


    # ## 11.2 NetWare and TCP/IP integration


    NetWare is typically used in organisations and works well on a local network.
    Network traffic which travels out on the Internet or that communicates with UNIX
    networks must be in TCP/IP form. IP tunnelling encapsulates the IPX packet within
    the IP packet. This can then be transmitted into the Internet network. When the
    IP packet is received by the destination NetWare gateway, the IP encapsulation
    is stripped off. IP tunnelling relies on a gateway into each IPX-based network
    that also runs IP. The NetWare gateway is often called an IP tunnel peeer.


    # ## 11.3 NetWare architecture


    NetWare provides many services, such as file sharing, printer sharing, security,
    user administration and network management. The interface between the network
    interface card (NIC) and the SPX/IPX stack is ODI (Open Data-link Interface).
    NetWare clients run software which connects them to the server; the supported
    client operating systems are DOS, Windows, Windows NT, UNIX, OS/2 and Macintosh.


    With NetWare Version 3, DOS and Windows 3.x clients use a NetWare shell called
    NETx.COM. This shell is executed when the user wants to log into the network'
  merge: -1
  pgno: 227
- img_proc: true
  md: 'and resident. It acts as a command redirector and processes requests which
    are either generated by application programs or from the keyboard. It then decides
    whether they should be handled by the NetWare operating system or passed to the
    client''s local DOS operating system. NetX builds its own tables to keep track
    of the location of network-attached resources rather than using DOS tables. Figure
    11.1 illustrates the relationship between the NetWare shell and DOS, in a DOS-based
    client. Note that Windows 3x uses the operating system, but Windows NT and 95
    do not have their operating systems and emulate DOS. Thus, Windows NT and 95 do
    not need to use the NetX program.


    The ODI NICs support multiple transport protocols, such as TCP/IP and IPX/SPX,
    simultaneously. Also, in an Ethernet interface card, the ODI allows simultaneous
    Ethernet frame types such as Ethernet 802.3, Ethernet 802.2, Ethernet II, and
    Ethernet SNAP. Figure 11.2 shows a configuration of the frame type for IPX/SPX
    protocol.


    To install NetWare, the server must have a native operating system, such as DOS
    or Windows NT, and it must be installed on its own disk partition. NetWare adds
    a partition in which the NetWare partition is added. This partition is the only
    area of the disk NetWare kernel can access.


    # 11.3.1 NetWare loadable modules (NLMs)


    NetWare allows enhancements from third-party suppliers using NLMs. The two main
    categories are:


    +   Operating systems enhancements – these allow extra operating system functions,
    such as a virus checker and also check hardware modules, such as a network-interface
    drivers.


    +   Application programs – these programs actually run on the NetWare server rather
    than the client machine.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_228_0.png)


    Figure 11.1 NetWare architecture'
  merge: -1
  pgno: 228
- img_proc: true
  md: '![](img/da031d9e3a72792b55f2a8fb16c012a5_229_0.png)


    Figure 11.2 IPX/SPX frame types


    # 11.3.2 Bindery services


    NetWare must keep track of users and their details. Typically, NetWare must keep
    track of:


    +   * User names and passwords.

    * Groups and group rights.

    * File and directory rights.

    * Print queues and printers.

    * User restrictions (such as allowable login times, the number of times a user
    can simultaneously login to the network).

    * User/group administration and charging (such as charging for user login).

    * Connection to networked peripherals.


    This information is kept in the bindery files. Whenever a user logs into the network
    their login details are verified against the information in the bindery files.


    The bindery is organised with objects, properties and values. Objects are entities
    that are controlled or managed, such as users, groups, printers (servers and queues),
    disk drives, and so on. Each object has a set of properties, such as file rights,
    login restrictions, restrictions to printers, and so on. Each property has a value
    associated with it. Here are some examples:


    | Object | Property | Value |

    |---|---|---|

    | User | Login restriction | Wednesday 9 am till 5pm |

    | User | Simultaneous login | 2 |

    | Group | Access to printer | No |


    216 Mastering Microsoft Windows, Novell NetWare and UNIX *'
  merge: -1
  pgno: 229
- img_proc: true
  md: 'Objects, properties and values are stored in three separate files which are
    linked by pointers on every NetWare server:


    +   1. NET$OBJ.SYS (contains object information).

    2. NET$PROP.SYS (contains property information).

    3. NET$VAL.SYS (contains value information).


    If multiple NetWare servers exist on a network then bindery information must be
    exchanged manually between the servers so that the information is the same on
    each server. In a multiserver NetWare 3.x environment, the servers send SAP (service
    advertising protocol) information between themselves to advertise available services.
    Then the bindery services on a particular server update their bindery files with
    the latest information regarding available services. This synchronization is difficult
    when just a few servers exist but is extremely difficult when there are many servers.
    Luckily, NetWare 4.1 has addressed this problem with NetWare directory services;
    this will be discussed later.


    # 11.4 NetWare protocols


    NetWare uses IPX (Internet Packet Exchange) for the network layer and either SPX
    (Sequenced Packet Exchange) or NCP (NetWare Core Protocols) for the transport
    layer. The routing information protocol (RIP) is also used to transmit information
    between NetWare gateways. These protocols are illustrated in Figure 11.3.


    | Application | SAP | File server/ Application program |

    | Transport | NCP | SPX |

    | Network | IPX |

    | Data link | Ethernet/ Token Ring |

    | Physical | |


    Figure 11.3 NetWare reference model


    # 11.5 IPX


    IPX performs a network function that is similar to IP. The higher information
    is passed to the IPX layer which then encapsulates it into IPX envelopes. It is
    characterised by:'
  merge: -1
  pgno: 230
- img_proc: true
  md: '+   - A connectionless connection – each packet is sent into the network and
    must find its own way through the network to the final destination (connections
    are established with SPX).


    +   - It is unreliable – as there is only basic error checking and no acknowledgement
    (acknowledgement are achieved with SPX).


    IPX uses a 12-byte station address (whereas IP uses a 4-byte address). The IPX
    fields are:


    +   - Checksum (2 bytes) – this field is rarely used in IPX, as error checking
    is achieved in the SPX layer. The lower-level data link layer also provides an
    error detection scheme (by Ethernet and Token Ring support a frame sequence).


    +   - Length (2 bytes) – this gives the total length of the packet in bytes (i.e.
    header+DATA). The maximum number of bytes in the DATA field is 546, so the maximum
    length will be 576 bytes (2+2+1+12+12+546).


    +   - Transport control (1 byte) – this field is incremented every time the frame
    is processed by a router. When it reaches a value of 16 it is deleted. This stops
    packets from traversing the network for an infinite time. It is also typically
    known as the time-to-live or hop counter.


    +   - Packet type (1 byte) – this field identifies the upper layer protocol so
    that the DATA field can be properly processed.


    +   - Addressing (12 bytes) – this field identifies the address of the source
    and destination: it is made up of three fields: a network address (4 bytes), a
    host address (6 bytes) and a socket address (2 bytes). The 48-bit host address
    is the 802 MAC LAN address. NetWare supports a hierarchical addressing structure
    where the network and host addresses identify the host station and the socket
    address identifies a process or application and thus supports multiple connections
    (up to 50 node).


    | Checksum | Length | Transport control | Packet type | Destination address |
    Source address | ≤ 546 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | | | 4 | | 6 | DATA |

    | | | | Network | Host | Socket |


    **Figure 11.4** IPX packet format


    11.5.1 SPX

    On a NetWare network level above IPX is either NCP or SPX. The SPX protocol sets
    up a virtual circuit between the source and the destination (just like TCP). Then
    all SPX packets follow the same path and will always arrive in the correct order.
    This type of connection is described as connection-oriented.


    SPX also allows for error checking and an acknowledgement to ensure that packets
    are received correctly. Each SPX packet has flow control and also sequence numbers.
    Figure 11.5 illustrates the SPX packet.


    The fields in the SPX header are:'
  merge: -1
  pgno: 231
- img_proc: true
  md: '**Connection control (1 byte)** – this is a set of flags which assist the flow
    of data. These flags include an acknowledgement flag and an end-of-message flag.


    **Datastream type (1 byte)** – this byte contains information which can be used
    to determine the protocol or information contained within the SPX data field.


    **Destination connection ID (2 bytes)** – the destination connection ID allows
    the routing of the packet through the virtual circuit.


    **Source connection ID (2 bytes)** – the source connection ID identifies the source
    station when it is transmitted through the virtual circuit.


    **Sequence number (2 bytes)** – this field contains the sequence number of the
    packet sent. When the receiver receives the packet, the destination end error
    checks the packet and sends back an acknowledgement of the previously received
    packet number in.


    **Acknowledgement number (2 bytes)** – this acknowledgement number is incremented
    by the destination when it receives a packet. It is in this field that the destination
    station puts the last correctly received packet sequence number.


    **Allocation number (2 bytes)** – this field informs the source station of the
    number of buffers the destination station can allocate to SPX connections.


    **Data** (up to 534 bytes).


    | 1 | 2 | 2 | 2 | 2 | 2 | 2 | up to 534 |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | Connection control | Datastream type | Destination connection ID | Source connection
    ID | Sequence number | Ack number | Allocation number | Data |


    | IPX header | SPX header | Data |

    | :--- | :--- | :--- |

    | 30 | 12 | up to 534 |


    Figure 11.5 SPX packet format


    # 11.5.2 RIP


    The NetWare Routing Information Protocol (RIP) is used to keep routers updated
    on the best routes through the network. RIP information is delivered to routers
    via IPX packets. Figure 11.6 illustrates the information fields in a RIP packet.
    The RIP packet is contained in the field which would normally be occupied by the
    SPX.


    Routers are used within networks to pass packets from one network to another in
    an optimal way (and error-free with a minimal time delay). A router reads IPX
    packets and examines the destination address of the node. If the node is on another
    then it routes the packet in the required direction. This routing not to be fixed
    as the best route will depend on network traffic at given times. Thus the router
    needs to keep the routing tables up to date; RIP allows routers to exchange their
    current routing tables with other routers.


    The RIP packet allows routers to request or report on multiple reachable networks
    within a single RIP packet. These routes are listed one after another (Figure
    11.6 shows two routing entries). Thus each RIP packet has only one operation field,
    but has'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'multiple entries of the network number, the number of router hops and the number
    of tick fields, up to the length limit of the IPX packet.

    The fields are:


    +   - **Operation (2 bytes)** – this field indicates that the RIP packet is either
    a request or a response.

    - **Network number (4 bytes)** – this field defines the assigned network address
    number to which the routing information applies.

    - **Number of router hops (2 bytes)** – this field indicates the number of routes
    that a packet must go through in order to reach the required destination. Each
    router adds a single hop.

    - **Ticks (2 bytes)** – this field indicates the amount of time (in 1/18 second)
    that it takes a packet to reach the given destination. Note that a route which
    has the fewest hops may not necessarily be the fastest.


    RIP packets add to the general network traffic as each router broadcasts its routing
    table every 60 seconds. This shortcoming has been addressed by NetWare 4.1.


    | 2 | 4 | 2 | 2 | 4 | 2 | 2 |

    |---|---|---|---|---|---|--|

    | Operation | Network number | Number of router hops | Number of ticks | Network
    number | Number of router hops | Number of ticks |


    Routing table entry 1

    Routing table entry 2


    **Figure 11.6** RIP packet format


    # 11.5.3 SAP


    Every 60 seconds each server transmits a SAP (Service Advertising Protocol) packet
    which gives its address and tells other servers services it offers. These packets
    are read by special agent processes running on the routers which then construct
    a data base that defines which servers are operational and where they are located.

    When the client node is first booted it transmits a request in the network asking
    for the location of the nearest server. The agent on the router then reads this
    request and matches up to the best server. This choice is then sent back to the
    client. The client then establishes an NCP (NetWare Core Protocol) connection
    with the server, from which the client and server negotiate the maximum packet
    size. After this, the client can access the networked file system and other NetWare
    services.


    Figure 11.7 illustrates the contents of a SAP packet. It can be seen that each
    SAP packet contains a single operation field and data up to seven servers. The
    fields are:


    +   - **Operation type (2 bytes)** – defines whether the SAP packet is server
    information request or a broadcast of server information.

    - **Server type (2 bytes)** – defines the type of service offered by a server.
    These services are identified by a binary pattern, as such:'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'File server 0000 1000 Job server 0000 1001

    Gateway 0000 0010 Print server 0000 0111

    Archive server 0000 0001 SNA gateway 0010 0001

    Remote bridge server 0010 0100 TCP/IP gateway 0010 0111

    NetWare access server 1001 1000


    +   - **Server name (48 bytes)** – which identifies the actual name of the server
    or host offering the service defined in the type field.

    - **Network address (4 bytes)** – which defines the address of the network to
    which the server is attached.

    - **Node address (6 bytes)** – which defines the actual MAC address of the server.

    - **Socket address (6 bytes)** – which defines the socket address on the server
    assigned to this particular type of service.

    - **Hops to server (2 bytes)** – which indicates the number of hops to reach the
    particular service.


    | Server 1 information |

    | 2 | 48 | 4 | 6 | 2 | 2 | up to 6 other servers |

    |---|---|---|---|---|---|---||

    | Operation | Server type | Server name | Network address | Node address | Socket
    address | Hops to server |


    | IPX header | SAP packet |


    **Figure 11.7** SAP packet format


    # 11.5.4 NCP


    The clients and servers communicate using the NetWare Core Protocols (NCPs). They
    have the following operation:


    +   - The NetX shell reads the application program request and decides whether
    it should direct it to the server.

    - If it does redirect, it sends a message within an NCP packet, which is then
    encapsulated within an IPX packet and transmitted to the server.


    **Figure 11.8** illustrates the packet layout and encapsulation of an NCP packet.
    The fields are:


    +   - **Request type (2 bytes)** – which gives the category of NCP communications.
    Among the possible types are:


    Busy message 1001 1001 1001 1001

    Create a service 0001 0001 0001 0001

    Service request from workstation 0010 0010 0010 0010'
  merge: -1
  pgno: 234
- img_proc: true
  md: 'Service response from server

    0011 0011 0011 0011

    Terminate a service connection

    0101 0101 0101 0101


    For example the create-a-service request is initiated at login time and a terminate-a-connection
    request is sent at logout.


    +   - Sequence number (1 byte) – which contains a request sequence number. The
    client reads the sequence number so that it knows the request to which the server
    is responding.

    - Connection number (1 byte) – a unique number which is assigned when the user
    logs into the server.

    - Task number (1 byte) – which identifies the application program on the client
    which issued the service request.

    - Function code (1 byte) – which defines the NCP message or commands. Example
    codes are:


    Close a file 0100 0010 0100 1101

    Delete a file 0100 0100 0001 1111

    Get file size 0100 0000 0100 1100

    Rename a file 0100 0101 0100 1110

