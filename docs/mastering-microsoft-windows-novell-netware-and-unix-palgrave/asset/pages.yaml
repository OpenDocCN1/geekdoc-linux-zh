- img_proc: true
  md: 'required resource. When it does release it then Thread C goes back to its normal
    priority and Thread A then gets access to the resource.


    # 7.9 Plug-and-play process


    Plug-and-play allows the operating system to configure hardware as required. On
    system start-up, the configuration manager scans the system hardware. When it
    finds a new plug-and-play device it does the following:


    +   - Sets the device into configuration mode. This is achieved by using three
    I/O ports. Some data (the initiation key) is written to one of the ports and enables
    the Plug-and-Play logic.

    - Isolate and identify each device. Each device is isolated, one at a time. The
    method used is to assign each device a unique number, which is a unique handle
    for the device. This number is made from a device ID and a serial number.

    - Determine device specifications. Each device sends its functionality to the
    operating system, as many how joysticks it supports, its audio functions, its
    networking modes, and so on.

    - Allocate resources. The operating system then allocates resources to the device
    depending on its functionality and the Plug-and-Play device is informed of the
    allocated resources (such as IRQs I/O addresses, DMA channels, and so on). It
    also checks for conflicts on these resources.

    - Activate device. When the above have been completed the device is enabled. Only
    the initiation key can re-initialise the device.


    # 7.10 Windows NT architecture


    Windows NT uses two modes:


    +   - User mode. This is a lower privileged mode than kernel mode. It has no direct
    access to the hardware or memory. It interfaces to the operating system through
    well-defined API (Application Program Interface) calls.

    - Kernel mode. This is a privileged mode of operation and allows all code direct
    access to the hardware and memory, including memory allocated to user mode processes.
    Kernel mode processes also have a higher priority over user mode processes.


    Figure 7.10 shows an outline of the architecture of NT. It can be seen that only
    the kernel mode has access to the hardware. This kernel includes executive services
    which manages (for I/O, interprocess communications, and so on) and device drivers
    (which control the hardware). Its parts include:


    +   - Microkernel. Controls basic operating system services, such as interrupt
    handling and scheduling.'
