    # 3.13.5 Gigabit Ethernet migration


    The greatest advantage of Gigabit Ethernet is that it is easy to upgrade existing
    Ethernet-based networks to higher bit rates. Typical migration might be:


    +   - Switch-to-switch links. Involves upgrading the connections between switches
    to 1Gbps. As 1000BASE supports both 100BASE and 1000BASE then not all the switches
    require to be upgraded at the same time; this allows for gradual migration.


    +   - Switch-to-Server links. Involves upgrading the connection between a switch
    and the server to 1Gbps. The server requires an upgraded Gigabit Ethernet interface
    card.


    +   - Switched Fast Ethernet Backbone. Involves upgrading a Fast Ethernet backbone
    switch to a 100/1000BASE switch. It supports both 100BASE and 1000BASE switching,
    using existing cabling.


    +   - Shared FDDI Backbone. Involves replacing FDDI attachments on the ring with
    Gigabit Ethernet switches or repeaters. Gigabit Ethernet uses the existing optic
    cable, and provides a greatly increased segment bandwidth.


    +   - Upgrade NICs on 1Gbps. It is unlikely that users will require 1Gbps connections,
    but this facility is possible.


    # 3.13.6 1000BASE-T


    One of the greatest challenges of Gigabit Ethernet is to using Cat-5 cables, as
    will allow fast upgrades. Two critical parameters, which are negligible on 100BASE
    speeds, are:


    +   - Return loss. Defines the amount of signal energy that is reflected back
    towards the transmitter due to mismatches in the link (typically from connector
    and cable bends).


    +   - Far-End Crosstalk. Noise that is leaked from another cable pair.


    The 1000BASE-T Task Force estimates that less than 10⁶ of the Cat-5 cables were
    improperly implemented (as defined in ANSI/TIA/EIA568-A in 1995) and might not
    support 1000BASE-T (or even, 100BASE-TX). 1000BASE-T uses two pairs, one for transmit
    and one for receive, at a signal rate of 125Mbaud with a 3-level code. 1000BASE-T
    uses:


    +   - All pairs with a symbol rate of 125 Mbaud (symbols/sec). One symbol contains
    two bits of information.


    +   - Each transmitted pulse uses a 5-level PAM (Pulse Amplitude Modulation) line
    code, which allows two bits to be transmitted at a time.'
