    # ## 7.6 Multiple file systems


    Windows 95/98/NT supports a layered file system architecture that directly supports
    multiple file systems (such as FAT and CDFS). Windows 95 98 NT have great performance
    improvements over Windows 3.x, for example:


    +   - Support for 32-bit protected-mode code when reading and writing information
    to and from a file system.

    - Support for 32-bit dynamically allocated cache size.

    - Support for an open file system architecture to enhance future system support.


