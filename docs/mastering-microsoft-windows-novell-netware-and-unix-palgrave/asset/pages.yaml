  md: '# 4.6 TCP/IP internets


    Figure 4.5 illustrates a sample TCP/IP implementation. A gateway MERCURY provides
    a link between a Token Ring network (NETWORK A) and the Ethernet network (ETHER
    C). Another gateway PLUTO connects NETWORK B to ETHER C. The TCP/IP protocol allows
    a host on NETWORK A to communicate with VAX01.


    # 4.6.1 Selecting internet addresses


    Each node using TCP/IP communications requires an IP address which is then matched
    to its Token Ring or Ethernet MAC address. The MAC address allows nodes on the
    same segment to communicate with each other. In order for nodes on a different
    network to communicate, each must be configured with an IP address.


    Nodes on a TCP/IP network are either hosts or gateways. Any nodes that run application
    software or are terminals are hosts. Any node that routes TCP IP packets between
    networks is called a TCP/IP gateway node. This node must have the necessary network
    controller boards to physically interface to other networks it connects with.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_85_0.png)'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# 4.6.2 Format of the IP address


    A typical IP address consists of two fields: the left field (or the network number)
    identifies the network, and the right number (or the host number) identifies the
    particular host within that network. Figure 4.6 illustrates this.


    The IP address is 32 bits long and can address over four million physical addresses
    ($2^{32}$ or 4294967296 hosts). There are three main address formats and these
    are shown in Figure 4.7.


    Each of these types is applicable to certain types of networks. Class A allows
    up to 128 ($2^7$) different networks and hosts up to 16384 ($2^{14}$) networks
    and up to 65536 ($2^{16}$) hosts on each network. Class B allows up to 2097152
    ($2^{21}$) networks each with up to 256 ($2^8$) hosts.


    The class A address is thus useful where there are a small number of networks
    with a large number of hosts connected to them. Class C is useful where there
    are many networks with a relatively small number of hosts connected to each network.
    Class addressing gives a good compromise of networks and connected hosts.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_86_0.png)


    Figure 4.6 IP addressing over networks


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_86_1.png)


    Figure 4.7 Type A, B and C IP address classes'
