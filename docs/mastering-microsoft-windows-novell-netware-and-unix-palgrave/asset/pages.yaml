    # 5.9 TCP/IP commands


    There are several standard programs available over TCP/IP connections. The example
    sessions in this section relate to the network outlined in Figure 4.12. These
    applications may include:


    +   * FTP (File Transfer Protocol) – transfers file between computers.

    * HTTP (Hypertext Transfer Protocol) – which is the protocol used in the World
    Wide Web (WWW) and can be used for client-server applications involving hypertext.

    * MIME (Multipurpose Internet Mail Extension) – gives enhanced electronic mail
    facilities over TCP/IP.

    * SMTP (Simple Mail Management Protocol) – gives simple electronic mail facilities.

    * TELNET – allows remote login using TCP/IP.

    * PING – determines whether a node is responding to TCP/IP communications.


