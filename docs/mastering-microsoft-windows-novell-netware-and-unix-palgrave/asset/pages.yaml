  md: '# Table 13.1 Example file attributes


    | Attributes | Description |

    |---|---|

    | -r-x--x-- | This file can be executed by the owner and his group (e.g. staff,
    administrators, research, system, and so on). It can be viewed by the owner but
    by no-one else. No other privileges exist. |

    | drxr-xr-x | This directory cannot be written to by the members of group and
    others. All other privileges exist. |

    | -rwxrwxrwx | This file can be read and written to by everyone and it can also
    be executed by everyone (beware of this). |


    # 13.6.1 Changing attributes of a file


    The `chmod` command can be used by the owner of the file to change any of the
    attributes. Its general format is:


    ```

    chmod settings filename

    ```


    where *settings* defines how the attributes are to be changed and the part of
    the attribute to change.

    The permission can be set using the octal system. If an attribute is 1 is set,
    it is not set to 0. For example, `r-w-r--` translates to 110 100, which is 644
    in octal. For example:


    +   to set to r-wx--x-- use 710 to set to r-x------ use 500

    to set to rwxr-xr-x use 777 to set to -------- use 100

    to set to rw-rw-r-- use 666


    The other method is using symbolic notation. The characters which define which
    part to modify are `u` (user), `g` (group), `o` (others), or `a` (all). The characters
    for the file attributes are a sign (`+`, `-`, or `=`) followed by the characters
    `r`, `w`, `x`. `+` specifies that the आयु is to be added, `-` specifies that the
    attribute is to be taken away, and the `=` defines the actual attributes. They
    are defined as:


    +   * u user permission g group permission

    * others (public) permission a all of user, group and other permissions

    * assign permission + add a permission

    * take away permission r read attribute

    * w write attribute x execute attribute


    In sample session 13.4 [18] the owner of the file changes the execute attribute
    for the user. Sample session 13.5 makes the file `file.txt` into `rw-rw-r--`,
    and the file `Run_prog` into `--x--x--`. Some examples of setting and resetting
    attributes are:


    ```

    chmod u+ prog1.c owner executable rights added

    chmod a=rw prog2.c sets read, write, execute for all

    chmod g-r cprogs resets read option for group

    ```'
