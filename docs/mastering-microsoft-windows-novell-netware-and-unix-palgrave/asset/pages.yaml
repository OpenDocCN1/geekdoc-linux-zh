    # ### 3.5.1 Media access control (MAC)


    CSMA/CD is implemented in the MAC layer. The functions of the MAC layers are:


    +   - When sending frames: receive frames from LLC; control whether the data fills
    the LLC data field, if not add redundant bits; make the number of bytes an integer,
    and calculate the FCS; add the preamble, SFD and address fields to the frame;
    send the frame to the PLS in a serial bit stream.

    - When receiving frames: receive one frame at a time from the PLS in a serial
    stream; check whether the destination address is the same as the local node; ensure
    the frame contains an integer number of bytes and the FCS is correct; remove the
    preamble, SFD, address fields, FCS and remove redundant bits from the LLC data
    field; send the data to the LLC.

    - Avoid collisions when transmitting frames and keep the right distance between
    frames by not sending when another node is sending; when the medium is free, wait
    a specified period before to transmit.

    - Handle any collision that appears by sending a jam signal; generate a random
    number and back off from sending during that time.


    # ### 3.5.2 Physical signalling (PLS) and physical medium attachment (PMA)


    PLS defines transmission rates, types of encoding/decoding and signalling methods.
    In PMA a further definition of the transmission media is accomplished, such as
    coaxial, fiber or twisted-pair. PMA and MDI together form the media attachment
    unit (MAU), often known as the transceiver.


    # ### 3.6 Ethernet transceivers


    Ethernet requires a minimal amount of hardware. The cables used to connect it
    are typically either unshielded twisted-pair cable (UTP) or coaxial cables. These
    cables'
  merge: -1
  pgno: 51
- img_proc: true
  md: 'must be terminated with their characteristic impedance, which is 50\Omega for
    coaxial cables and 100\Omega for UTP cables.


    Each node has transmission and reception hardware to access the cable and also
    to monitor network traffic. The transmission/reception hardware is a transceiver
    (short for transmitter/receiver) and a controller builds up and strips down the
    frame. For 10Mbps Ethernet, the transceiver builds the transmitted bits at a rate
    of 10 Mbps – thus the time for one bit is 1/10^6, which is 0.1 \mu s (100ns).


    The Ethernet transceiver transmits to one single either. When there are no nodes
    transmitting, the voltage on the line is +0.7 V. This provides a carrier sense
    signal for all nodes on the network, and it is also known as the heartbeat. If
    a node detects it knows that the network is active and there are no nodes transmitting.


    Thus, when a node wishes to transmit a message it listens for a quiet period.
    Then, if two or more transmitters transmit at the same time, a collision results.
    When they detect a collision, each node transmits a ''jam'' signal. The nodes
    involved in the collision then wait for a random period of time (ranging from
    10 to 90 ms) before attempting to transmit again. Each node on the network awaits
    for a retransmission. Thus, collisions are inefficient in networks as nodes from
    transmitting. Transceivers normally detect collisions by monitoring the DC (or
    average) voltage on the line.


    When transmitting, a transceiver transmits the preamble of consecutive 1s and
    0s. The coding used is a Manchester coding, which represents a 0 as a high to
    low voltage and a 1 as a low to high voltage transition. A low voltage is -0.7
    V and a high is +0.7 V. Thus, when the preamble is transmitted the voltage changes
    between +0.7 V and -0.7 V; as illustrated in Figure 3.9. If after the transmission
    of the preamble no collisions are detected the rest of the frame is sent.


