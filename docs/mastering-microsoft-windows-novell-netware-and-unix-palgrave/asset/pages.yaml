  md: '@ IN SOA ees99.eece.napier.ac.uk. mike.ees99.eece.napier.ac.uk.


    ```

    199806171 ; Serial

    10800 ; Refresh every 3 hrs

    1800 ; Retry every 1/2 hr

    604800 ; Expire (seconds)

    259200 ; Minimum time-to-live

    ```


    ```

    IN NS ees99.eece.napier.ac.uk.

    localhost IN NS eepc02.eece.napier.ac.uk.

    @ IN MX 11 146.176.151.129.

    hp350 IN A 146.176.144.10

    mwave IN A 146.176.144.11

    pblb69 IN CNAME mwave

    vax IN A 146.176.144.13

    miranda IN A 146.176.144.14

    triton IN A 146.176.144.20

    nimas IN A 146.176.146.21

    ees99 IN A 146.176.151.99

    wm IN CNAME ees99

    ```


    The SOA lists a serial number, which has to be increased each time the master
    file is changed. This is because secondary servers check the serial number at
    an interval specified by the refresh time (Refresh). If the serial number increases
    then a zone transfer is done to load the new data. If the master server cannot
    be contacted when a refresh is due then the retry (Retry) specifies the interval
    at which occurs. If the master server cannot be contacted within the expire interval
    (Expire) then all data from the zone is discarded by secondary servers.


    The following list shows the contents of the net/net151. The NS defines the two
    names (ees99 and eepc02) and the PTR entries map an IP address to a domain name.


    ```

    @ IN SOA ees99.eece.napier.ac.uk.

    199706091 ; Serial

    10800 ; Refresh

    1800 ; Retry

    604800 ; Expire

    259200 ; Minimum

    ```


    ```

    IN NS ees99.eece.napier.ac.uk.

    IN NS eepc02.eece.napier.ac.uk.

    50 IN PTR ee50.eece.napier.ac.uk.

    61 IN PTR eepc01.eece.napier.ac.uk.

    62 IN PTR eepc02.eece.napier.ac.uk.

    222 IN PTR pctest2.eece.napier.ac.uk.

    2 IN PTR pc345.eece.napier.ac.uk.

    3 IN PTR pc307.eece.napier.ac.uk.

    4 IN PTR pc320.eece.napier.ac.uk.

    5 IN PTR pc331.eece.napier.ac.uk.

    6 IN PTR pc401.eece.napier.ac.uk.

    7 IN PTR pc404.eece.napier.ac.uk.

    ```


    and for the net/net151 file:


    ```

    @ IN SOA ees99.eece.napier.ac.uk. mike.ees99.eece.napier.ac.uk.

    199806171 ; Serial

    10800 ; Refresh

    1800 ; Retry

    604800 ; Expire

    ```


