    # 12.11 Bindery services


    In NetWare 4.1 the bindery services have been replaced by NetWare Directory Services
    (NDS). Many networks take time to be fully upgraded from bindery to NDS thus NetWare
    4.1 supports bindery. This allows a NetWare 3 server to be upgraded to NetWare
    4.1, but still run a bindery. It also allows NetWare 4 to integrate with NetWare
    3 servers (typically, which run print services).


    NetWare 4 servers support the following bindery-based resources:


    +   Bindery objects class.


    +   Bindery programs.


    +   Bindery-based NetWare client software.


    +   Groups.


    +   Print servers.


    +   Profiles.


    +   Queues.


    +   Users.


    On a bindery service, NDS supports a flat structure for leaf objects in an Organisation
    or Unit object. All objects within the specified container can then be accessed
    by NDS objects and by bindery-based servers and client workstations. On a bindery
    enabled, a client gets its login script from that server. The login and script
    are not automatically transmitted to other servers (as they would be with NDS).'
