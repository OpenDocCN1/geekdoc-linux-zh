- img_proc: true
  md: 'through which packets reach the AAN. Most routing algorithms try to find the
    quickest way through the network.

    The speaker on the AAN broadcasts its reachability information to all the networks
    within its AAN. This information states only whether a destination AAN can be
    reached; it does not describe any other metrics.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_352_0.png)


    **Figure 18.6** Autonomously attached networks


    The BGP update packet also contains information on routes which cannot be reached
    (withdrawn routes). The content of the BGP-4 update packet is:


    +   - **Unfeasible routes length** (2 bytes).

    - **Withdrawn routes** (variable length).

    - **Total path attribute length** (2 bytes).

    - **Path attributes** (variable length).

    - **Network layer reachability information** (variable length).


    The network layer reachability information can contain extra information, such
    as ‘use AAN 1 in preference to AAN 2’.

    An important point is that BGP is not a distance vector or link state protocol
    because it transmits complete routing information instead of partial information.


    # 18.5 BGP specification


    Border Gateway Protocol (**BGP**) is an inter-Autonomous System routing protocol,
    which builds on EGP. The main function of a BGP-based system is to communicate
    network reachability information with other BGP systems. Initially two systems
    exchange messages to open and confirm the connection parameters, and then transmit
    the'
  merge: -1
  pgno: 352
- img_proc: true
  md: 'entire BGP routing table. After these incremental updates are sent as the routing
    tables change.

    Each message has a fixed-size header and may or may not be preceded by a data
    portion. The fields are:


    +   - Marker. Contains a value that the receiver of the message can predict. It
    can be used to detect a loss of synchronisation between a pair of BGP peers, and
    to authenticate incoming BGP messages. 16 bytes.


    +   - Length. Indicates the total length, in bytes, of the message, including
    the header. It must always be greater than 18 and not greater than 4096. 2 bytes.


    +   - Type. Indicates the type of message, such as 1 - OPEN, 2 - UPDATE, 3 - NOTIFICATION
    and 4 - KEEPALIVE.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_353_0.png)


    Figure 18.7 BGP message header


    # 18.5.1 OPEN message


    The OPEN message is the first message sent after a connection has been made. A
    KEEPALIVE message is sent back confirming the OPEN message. After this the UPDATE,
    KEEPALIVE, and NOTIFICATION messages can be exchanged.

    Figure 18.7 shows the extra information added to the fixed-size BGP header. It
    has the following fields:


    +   - Version. Indicates the protocol version number of the message. Typical values
    are 2, 3 or 4. byte.


    +   - My Autonomous System. Identifies the sender''s Autonomous System number.
    2 bytes.


    +   - Hold Time. Indicates the maximum number of seconds that can elapse between
    the receipt of successive KEEPALIVE and/or UPDATE and/or NOTIFICATION messages.
    2 bytes.


    +   - Authentication Code. Indicates the authentication mechanism being used.
    This should define the form and meaning of the Authentication Data and the algorithm
    for computing values of Marker fields.


    +   - Authentication Data. The form and meaning of this field is a variable-length
    field which depends on the Authentication Code.'
