  md: '# NDIR General Usage Help 4.26


    Purpose: View information about files, directories, and volumes.


    +   For help:

    - Display format NDIR / ?

    - Sorting features NDIR / ? SORT

    - Search filters [restrictions] NDIR / ? RES

    - Attribute filters NDIR / AT

    - Other options NDIR / ? OPT

    - Syntax NDIR / ? SYN

    - All screens NDIR / ? ALL


    +   For example, to:

    - See all files in current directory NDIR *

    - See only directories on drive C: NDIR C:* /DO


    # NDIR Format Specification Help 4.26


    Purpose: Set filenames and details appear.

    Syntax: NDIR [path] [/DA | /R | /MAC | /L | /D | /COMP]


    +   To display:

    - File date /DA

    - Files and rights, file attributes /R

    - Apple Macintosh file name /MAC

    - Detailed file information /L

    - Compressed file information /D /COMP


    +   For example, to:

    - Show information for all files NDIR *. /R

    - In the current directory


    # NDIR Attributes Specification Help 4.26


    Purpose: View files with specified attributes.

    Syntax: NDIR [path] [/NOT] [attributes|]


    | Read-only | X execute | Co File compressed |

    | Read-write | T Transactional | Ic Immediate compress |

    | System | P Purge | DC Don''t compress |

    | Hidden | Sh Shareable | Cc Can''t compress |

    | Attribute needed | Indexed |

    | Ci Copy-inhibit Dm Don''t migrate |

    | Don''t Suballocate | Delete-inhibit M File migrated |

    | Ri Rename-inhibit |


    +   For example, to:

    - Display all read-only files NDIR SYS:PUBLIC\*. /RO

    - In SYS:PUBLIC


    +   Display files in current directory NDIR *. /NOT RO

    that are not read-only


    436 Mastering Microsoft Windows, Novell NetWare and UNIX'
  merge: -1
  pgno: 449
- img_proc: true
  md: '# NDIR Sort Specifications Help 4.3


    Purpose: Select the order in which files are shown.

    NDIR [path] [/REV] SORT option


    +   SORT options:

    - AC Last accessed date

    - AR Last archived date

    - CR Created / copied date

    - OW Owner

    - SI Size

    - UP Last updated date

    - UN Unsorted (no specific sort order)


    For example, to:

    Display all files in current directory (smallest first)

    NDIR *.* /SORT SI


    Display all files on drive Z:

    sorted by most recently accessed

    NDIR Z:.* /REV SORT


    # NDIR Restriction Specification Help 4.3


    Purpose: Restrict which files are shown.

    NDIR [path] [/options] [NOT] operator value


    +   Options:

    - AC Last accessed date

    - AR Last archived date

    - CR Created/copied date

    - OW Owner

    - SI Size

    - UP Last updated date

    - NAM Name space

    Operators:

    - LE Less than

    - GR Greater than

    - EQ Equal to

    - BEF Before

    - AET After


    For example, to:

    Display all files updated before June 5, 1991

    NDIR *.* /UP BEF 6-05-91


    Display files not owned by the user ADMIN

    NDIR *.* /OW NOT EQ ADMIN


    # NDIR Filter Help 4.3


    Syntax:

    NDIR [path] [/FO | [/DO | [/S] | [/VOL | [/V | [/VER | [/SPA | [/FI] [/C]


    +   To:

    - View files only

    -View directories only

    - List information in all sub-directories

    - Continuously through the information

    - View volume information

    -View directory space information

    - View a file is found in searches

    - Display version information

    Use:

    - /FO

    - /DO

    - /S

    - /C

    - /VOL

    - /SPA

    - /FI

    - /VER or /V


    For example, to:

    Search for all *.bat files on drive C:

    NDIR C:\*.BAT /S


    Find where command.com is located in your search drives

    NDIR command.com /FI


    Additional 437'
