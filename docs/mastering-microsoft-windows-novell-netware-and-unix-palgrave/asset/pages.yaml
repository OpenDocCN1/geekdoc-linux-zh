  md: '# 18.5.6 BGP state transitions message and actions


    BGP states are:

    1 – Idle

    2 – Connect

    3 – Active

    4 – OpenSent

    5 – OpenConfirm

    6 – Established


    and the events are:


    +   1 – BGP Start

    2 – BGP Stop

    3 – BGP Transport connection open

    4 – BGP transport connection closed

    5 – BGP transport connection open failed

    6 – BGP transport fatal error


    +   7 – ConnectRetry timer expired

    8 – Holdtime timer expired

    9 – KeepAlive timer expired

    10 – Receive OPEN message

    11 – Receive KEEPPALIVE message

    12 – Receive UPDATE messages

    13 – Receive NOTIFICATION message


    The following define the state transitions of the BGP FSM and the actions that
    occur.


    | EVENT | ACTIONS | MESSAGE_SENT | NEXT_STATE |

    |---|---|---||

    | Idle (1) | Initialise resources | none | 2 |

    | | Start ConnectRetry timer | | |

    | | Initiate a transport connection | | |

    | Connect(2) | 1 | none | 2 |

    | 3 | Complete initialisation | OPEN | 4 |

    | | Clear ConnectRetry timer | | |

    | 5 | Restart ConnectRetry timer | none | 3 |

    | 7 | Restart ConnectRetry timer | none | 2 |

    | | Initiate a transport connection | | |

    | Active (3) | 1 | none | 3 |

    | 3 | Complete initialisation | OPEN | 4 |

    | | Clear ConnectRetry timer | | |

    | 5 | Close connection | | 3 |

    | | Restart ConnectRetry timer | | |

    | 7 | Restart ConnectRetry timer | none | 2 |

    | | Initiate a transport connection | | |

    | OpenSent(4) | 1 | none | 4 |

    | 4 | Close transport connection | none | 3 |

    | | Restart ConnectRetry timer | | |

    | 6 | Release resources | none | 1 |

    | 10 | Process OPEN is OK | KEEPPALIVE | 5 |

    | | Process OPEN failed | NOTIFICATION | 1 |'
