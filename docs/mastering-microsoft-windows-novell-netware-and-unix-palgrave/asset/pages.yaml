    # 14.5 XDR format


    As previous mentioned XDR is a standard technique which is used to describe and

    encode data. This standard format allows for transferring data between different-

    computer architectures. It fits into the presentation layer and uses a language,
    which is

    similar to C, to describe data formats. This language allows data formats to be-

    described in a concise manner. XDR assumes that bytes are defined as 8 bits of
    data.


    # 14.5.1 Basic block size


    The basic definition of the blocks is this:


    +   - Items are defined in multiples of four bytes (32 bits) of data.

    - These bytes are numbered from 0 to n-1.

    - Bytes are read (or written) to a byte stream so that byte always precedes byte

    m+1.

    - If the number of bytes (n) in the data is not divisible by 4 then the bytes
    are fol-

    low by enough (0 to 3) residual zero bytes (r) to make the count a miple of 4.


    # 14.5.2 Data types


    The basic data types are defined in this section.'
