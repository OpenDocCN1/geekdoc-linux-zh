    # 7.8.1 Scheduling


    Scheduling involves determining which thread should be run on the process at a
    given time. This element is named time slice, and its actual value depends on
    the system configuration.


    Each thread currently running has a base priority. The programmer who created
    the program sets this base priority level of the thread. This value defines how
    the thread is executed in relation to other threads. The thread with the highest
    priority gets use of the processor.


    NT and 95/98 have 32 priority levels. The lowest priority is 0 and the highest
    is 31. A scheduler can change threads base priority by increasing or decreasing
    it by two levels. This changes the threads priority.


    The scheduler is made up of two parts:


    +   * A thread which is waiting for user input has its priority increased.

    * A thread that has completed a voluntary wait also has its priority increased.

    * Threads with a computation-bound work get their priorities reduced. This prevents
    the blocking of I/O operations.


    Apart from these, all threads get a periodic increase. This prevents lower-priority
    threads hogging shared resources that are required by higher-priority threads.


    # 7.8.2 Priority inheritance boosting


    One problem that can occur when a low priority thread accesses resources which
    are required by a high priority thread. For example, the RS-232 program could
    be loading data into memory while another program requires access to the memory.
    One method which can be used to overcome this is Priority Inheritance Boosting.
    In this case, low priority threads gets a boost so that they can quickly release
    resources. For example, suppose a system has three threads: Thread A, Thread B
    and Thread C. If Thread A has the highest priority and it requires a resource
    from Thread C then Thread C gets a boost in its priority. Thread A remains blocked
    until Thread C releases'
