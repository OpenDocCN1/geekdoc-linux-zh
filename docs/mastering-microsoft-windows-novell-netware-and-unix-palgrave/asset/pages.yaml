  md: '# Windows 95 and Windows 98


    Windows 98 was really an upgrade to Windows 95 OSR2 (which includes Net-Meeting,
    ScanDisk and Disk Defragmenter) and inherits many of the programs that were released
    with Windows 95 OSR2. The new features include:


    +   * Advanced Plug and Play. USB devices can be added to the computer without
    rebooting.

    * Automatic hardware detection.

    * Enhanced power management.

    * Increased WWW integration. WWW page creation, integrated email, channels, and
    so on.

    * Windows updates. This facility allows for a single source to update system drivers,
    system files and operating system programs, such as service packs.

    * System file checker. The facility checks for system files and recovers old system
    files. It also checks the integrity of the operating system files and if necessary
    restores or extracts them from the installation disks.

    * Maintenance wizard. This facility allows tasks to be run at given intervals.

    * Multiple monitors. The facility allows the computer to display multiple monitors.
    Different parts of the screen can be sent to the connected monitors, and thus
    expand the physical size of the desktop area.

    * NetShow. The facility allows for the reception of streamed multimedia from a
    WWW server. It synchronises video, audio and graphics data.

    * WWW TV. This facility combines broadcast TV and Internet-based content into
    a single program. With an Internet connection, television program listings are
    included giving lists of scheduled television shows. Broadcast TV requires a TV
    tuner card.

    * Support for new devices. Windows 98 supports many new hardware devices, such
    as: Universal Serial Bus (USB), IEEE 1394, Accelerated Graphics Port (AGP) and
    DVD. IEEE defines a class of hardware that makes it easy to add serial devices
    to your computer. The AGP is an enhanced video card interface which gives enhanced
    support for 3-D animation. DVD drives play software and music CDs.

    * Subscription. This facility allows Internet Explorer to check a WWW site for
    new content, at given times. This new content can be automatically downloaded
    (or prompted for a download).

    * Channels. This facility allows content from WWW sites to be automatically downloaded.
    It is similar to subscription, but the content provider can suggest a schedule
    for the subscription and gives it a rich map of the WWW site (rather than a single
    WWW page).


    Mastering Microsoft Windows, Novell NetWare and UNIX'
