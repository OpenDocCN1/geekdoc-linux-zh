  md: 'this clock the receiver can then determine the transmitted bit pattern.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_65_0.png)


    **Figure 3.17** Manchester encoding


    For Manchester decoding, the Manchester-encoded signal is first synchronised to
    the receiver (called bit synchronisation). A transition in the middle of each
    bit cell is used by a clock recovery circuit to produce a clock pulse in the centre
    of the second half of the bit cell. In Ethernet the bit synchronisation is achieved
    by deriving the clock from the preamble field of the frame using a clock and data
    recovery circuit. Many Ethernet decoders use the SEEK 8020 Manchester code converter,
    which uses a phase-locked loop (PLL) to recover the clock. The PLL is designed
    to lock onto the preamble of the incoming signal within 12-bit cells. Figure 3.19
    shows a circuit schematic of bit synchronisation using Manchester decoding and
    a PLL.

    The PLL is a feedback circuit which is commonly used for the synchronisation of
    digital signals. It consists of a phase detector (such as an an EX-OR gate) and
    a voltage-controlled oscillator (VCO) which uses a crystal oscillator as a clock
    source.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_65_1.png)


    **Figure 3.18** Example of Manchester coding


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_65_2.png)


    **Figure 3.19** Manchester decoding with bit synchronization'
