    |---|---|--|

    | group.bygid group.byname | /etc/group | Maintains user groups. |

    | hosts.byaddr hosts.byname | /etc/hosts | Maintains a list of IP addresses and
    symbolic names |

    | netgroup.byaddr netgroup.byuser | /etc/netgroup | Contains a mapping of network
    group names to a set of node, user and NIS domain names. |

    | networks.byaddr networks.byname | /etc/network | Defines network-wide groups
