  md: '# 1.10 LANs, WANs and MANs


    Computer systems operate on digital data and can communicate with other digital
    equipment over a network or through an independent connection. Networks are normally
    defined as either:


    +   - Wide area networks (WANs), which normally connect networks over a large
    physical area, such as between different buildings, towns or even countries.

    - Local area networks (LANs), which connect computers within a single office or
    building. They typically connect to a common electronic connection – commonly
    known as a network backbone. LANs can connect to other networks directly or through
    a WAN.

    - Metropolitan area networks (MANs), which normally connect networks around a
    town or city. An example of a MAN is the EastMAN network that connects universities
    and colleges in Edinburgh and Stirling, UK.


    The four methods of connecting a network (or an independently connected computer)
    to another network are:


    +   - Through a modem connection. A modem converts digital data into an analogue
    form that can be transmitted over a standard telephone line.

    - Through an ISDN connection. An ISDN (integrated services digital network) uses
    the public telephone service. It differs from a modem connection in that the data
    is sent in a digital form.

    - Through a gateway. A gateway connects one type of network to another type.

    - Through a bridge or router. Bridges and routers normally connect one type of
    network to one of the same type.


    Modems are used to connect a network (or independently attached computer) over
    the public switched telecommunications network (PSTN). Normally telephone-type
    connections are unsuitable for digital data as they have a limited bandwidth of
    between 400 and 3400 Hz. A modem must then be used to convert the digital information
    into an analogue form that is transmittable over the telephone lines. Figure 1.2
    illustrates the connection of computers to a network. These computers can connect
    to a WAN through a service provider (such as AOL) or through another network which
    is connected by modem. The service provider has the required hardware to connect.


    ISDN allows the transmission of many types of digital data into a truly digital
    network. Transmittable data types include digitised video, digitised speech and
    computer data. Since the switching and transmission are digital, fast access times
    and relatively high bit-rates are possible. Typical base bit-rates include 64kbps.
    All connections to the ISDN require network termination equipment (NTE).


    Figure 1.2 also shows a network server connected to a LAN. This server can be
    used for the following:


    +   - Allowing users to login and set-up their computer.'
