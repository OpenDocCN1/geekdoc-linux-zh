    is a roll-over from frame 0). The destination node acknowledges that it has received
    the frames by sending a supervisor frame. The function of the supervisory frame
    is specified by the 2-bit S-bit field. This can either be set to Receiver Ready
    (RR), Receiver Not Ready (RNR) or Reject (REJ). If an RNR function is set then
    the destination node acknowledges that all frames up to the number N(R) stored
    in the receive sequence number N(R) field were received correctly. An RNR function
    also acknowledges the frames it informs the source node wishes to stop communicating.
    The REJ function specifies that frame N(R) has been rejected and all other frames
    are acknowledged.


