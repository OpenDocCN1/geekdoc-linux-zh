  md: '# 4.13.2 Conformance


    There are three levels of conformance:


    +   - Level 0. No IP multicasting support. In this, a Level 0 host ignores, or
    deletes, all Class D addressed datagrams.

    - Level 1. Sending support, but no receiving. In this, a Level 1 host can send
    multicastdatagrams, but cannot receive them.

    - Level 2: Full multicasting support. In this, a Level 2 host can send and receive
    IP multicasting. It also requires the implementation of the Internet Group Management-Protocol
    (IGMP).


