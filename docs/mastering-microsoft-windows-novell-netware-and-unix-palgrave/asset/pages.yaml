    # 16.6.1 Files


    A file URL scheme allows for files to be assessed. It takes the form:


    ```

    file://<host>/<path>

    ```


    where <host> is the fully qualified domain name of the system to be accessed,
    <path> is the full path name, and takes the form of a directory path, such as
    <direc-tory>/.../<name>.


    For a file:


    ```

    C:\DOCS\NOTES\NETWORKS\NET_CHAP16.DOC

    ```


    would be accessed as from dummy.com with:


    ```

    file://dummy.com/C:/DOCS/NOTES/NETWORKS/NET_CHAP16.DOC

    ```


    Note, that the host is defined as localhost or is an empty string then the host
    is assumed to be the local host. The general format is:


    ```

    fileurl = "file://" [ host | "localhost" ] "/" fpath

    ```


    # 16.6.2 Electronic mail address


    The mailto scheme defines a link to be sent to an Internet email address. An example
    is:


    ```

    mailto: fred.bloggs@toytown.ac.uk

    ```


    When this URL is selected then an email message will be sent to the email address
    fred.bloggs@toytown.ac.uk Normally, some form of text editor is called and the
    user can enter the required email message. Upon successful completion of the text
    message it is sent to the addressee.


    # 16.6.3 File Transfer Protocol (FTP)


    The ftp URL scheme defines the files and directories specified are accessed using
    the FTP protocol. In its simplest form it is defined as:


    ```

    ftp://<hostname>/<directory-name>/<filename>

    ```'
