    # 6.5.2 Protocol outline


    Figure 6.2 defines the format of a DHCP message. The numbers in parentheses indicate
    the size of each field in.


    +   * Op. Defines message code/op code (1 for BOOTREQUEST and 2 for BOOTREPLY).
    1 byte.

