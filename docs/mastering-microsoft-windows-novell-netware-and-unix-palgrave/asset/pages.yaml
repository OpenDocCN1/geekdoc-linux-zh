    # 7.2 Windows registry


    On DOS-based systems, the main configuration files were AUTOEXEC.BAT, CONFIG.SYS
    and INI files were a major problem in each application program and device driver
    configuration required one or more of these files to store default settings (such
    as IRQ, I/O addresses, default directories, and so on). Several important INI
