    # 3.4 IEEE 802.2 and Ethernet SNAP


    The LLC is embedded in the Ethernet frame and is defined by the IEEE 802.2 standard.
    IEEE 3.5 illustrates how the LLC field is inserted into the IEEE 802.3 frame.
    The DSAP and SSAP fields define the types of network protocol used. A SAP code
    of 1110 0000 identifies the network operating system layer as NetWare, whereas
    0000 0110 identifies the TCP/IP protocol. These SAP numbers are issued by the
    IEEE. The control field is, among other things, for the sequencing of frames.


    In some cases, it was difficult to modify the networks to be IEEE 802.2-compliant.
    Thus, an alternative method was to identify the network protocol, known as Ethernet
    SNAP (SubNetwork Access Protocol). This was defined to ease the transition to
    the IEEE 802.2 standard and is illustrated in Figure 3.6. It simply adds an extra
    fields to the LLC field to define an organisation ID and a network identifier.
    NetWare allows for either Ethernet SNAP or Ethernet 802.2 (as Novell used Ethernet
    SNAP to transform to Ethernet 802.2).


    Non-compliant protocols are identified with the DSAP and SSAP code of 1010 0010,
