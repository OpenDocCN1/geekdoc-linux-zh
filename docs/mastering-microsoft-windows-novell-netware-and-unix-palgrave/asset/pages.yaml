    # 10.2.4 HKEY_CURRENT_CONFIG


    The HKEY_CURRENT_CONFIG subkey points to a branch of the HKEY_LOCAL MACHINE subtree
    that contains information about the current configuration of hardware attached
    to the computer and any alternative hardware configurations for the computer.
    For example, it is typical for a portable computer to have multiple configurations
    with docking stations and PCMCIA cards. Each alternative configuration has a unique
    identifier, and this configuration ID has a subkey under the Config key. Each
    configuration appears in the list of hardware profiles in the System option in
    Control Panel. Figure 10.4 shows an example.


    When the computer is started for the first time, Windows 95 creates a new configuration
    for the new configuration ID, and a new Config subkey is added to the Registry.
    After this the computer is started and Windows 95/98 checks the hardware configurations
    and automatically selects the appropriate configuration, and the settings for
    the related Config subkey.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_216_1.png)


