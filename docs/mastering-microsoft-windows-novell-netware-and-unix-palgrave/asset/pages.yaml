    # 1.11 OSI model


    A major problem in the electronics industry is the interconnection of equipment
    and the compatibility of software. Other problems can occur in the connection
    of electronic equipment in one part of the world to another, in another part.
    For these reasons, the International Standards Organisation (ISO) developed a
    model known as the OSI (open systems interconnection) model. Its main objects
    were:


    +   - Allow manufacturers of different systems to interconnect their equipment
    through standard interfaces.

    - Allow software and hardware to integrate well and be portable on differing systems.

    - Create a model which all the countries of the world would use.'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'The OSI model is shown in Figure 1.3. Data passes from the top layer of the
    sender to the bottom and then up from the bottom layer to the top on the receiver.
    Each layer on the transmitter, though, communicates directly with the receiver’s
    corresponding layer. This creates a virtual data flow between layers.


    The top layer (the application layer) initially gets data from an application
    and appends it with data that the recipients application layer will read. This
    appended data passes to the next layer (the presentation layer). Again, it appends
    its own data, and so on, down to the physical layer. The physical layer is responsible
    for transmitting the data to the recipient. The data sent can be termed a data
    packet or data frame.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_30_0.png)


    Figure 1.3 Seven-layer OSI model


    The basic function of each of the layers. is as follows:


    +   1. **Physical.** Defines the electrical characteristics of the communications
    channel and the transmitted signals, such as voltage levels, connector types,
    cabling, such as on.

    2. **Data link.** Ensures that the transmitted bits are received in a reliable
    way, such as adding extra bits to define the start and end of a data frame, adding
    extra error detection/correction bits and ensuring that multiple nodes do not
    try to access a common communication channel at the same time.

    3. **Network.** Routes data frames through a network. If data packets require
    to go out of a network the transport layer routes through interconnected networks.
    Its task may involve, for example, splitting data for transmission and re-assembling
    it upon reception.

    4. **Transport.** Provides an open communications path with the other system.
    It involves setting up, maintaining and closing down a session.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'channel and the internetworking of the data should be transparent to the session
    layer.


    +   5. Session. Provides an open communications path with the other system. It
    involves the setting up, maintaining and closing down of a session. The communication
    channel and the internetworking of the data should be transparent to the session
    layer.


    +   6. Presentation. Uses a set of translations that allows the data to be interpreted
    properly. It may have to carry out translations if they use different presentation
    standards such as different character sets or differing character codes. The presentation
    layer can also add data encryption for security purposes.


    +   7. Application. Provides network services to application programs such as
    file transfer and electronic mail.


    Figure 1.4 shows how networking systems fit into the OSI model. The data link
    and physical layers are covered by networking technologies such as Ethernet, Token
    Ring and FDDI. The networking layer is covered by IP (internet protocol) and transport
    by TCP (transport control protocol). The IP part routes data packets through a
    network and TCP routes between interconnected networks.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_31_0.png)


    Figure 1.4 Typical technologies used in network communications


