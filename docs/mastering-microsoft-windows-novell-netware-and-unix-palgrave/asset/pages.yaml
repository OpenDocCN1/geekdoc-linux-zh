    # 17.10.5 Survey of private-key cryptystems


    Typical private-key systems are:


    +   DES (Data Encryption Standard) is a block cipher scheme which operates on
    64-bit block sizes. The private key has only 56 useful bits as eight of its bits
    are used for parity. This gives 2⁵⁶ or 10¹ possible keys. DES uses a complex series
    of permutations and substitutions; the result of these operations are XORed with
    the input. This is then repeated 16 times using a different order of the key bits
    each time. DES is a very strong code and has never been broken, although several
    high-powered computers are now available which, using brute force, can crack the
    code. A possible solution is 3DES (triple DES) which uses DES three times in a
    row. First to encrypt, next to decrypt and finally encrypt. This system allows
    a low-key of more than 128 bits.

    MOSS (MIME object security service) is an Internet RFC and is typically used for
    sound encryption. It uses symmetric encryption and the size of the key is not
    specified. The only public implementation is TI MISS 7.1, which is basically an
    implementation of 56-bit DES with a violation.\IDEA (International Data Encryption
    Algorithm) is similar to DES and operates on 64-bit blocks of plaintext and uses
    a 128-bit key. IDEA operates over 17 rounds with a complicated mangler function.
    During decryption this function does not have to be reversed and can simply be
    applied in the same way as during encryption (this also occurs with IDEA). IDEA
    uses a different key expansion for encryption and decryption, but every other
    part of the code is identical. The same keys are used in DES decryption but in
    the reverse order. The key is divided in 16-bit blocks; the first six are used
    in the first round of encryption, the last two are used in the second round. It
    is free for use in a non-commercial version and appears to be a stronger cipher.

    RC4/RC5. RC4 is a cipher designed by RSA Data Security, Inc and was secret until
    information on the Internet. The Netscape secure socket layer (SSL) uses RC4 which
    uses a pseudo random number generator where the output of the generator is XORed
    with the plaintext. It has a fast algorithm and can use any key length. Unfortunately
    the same key cannot be used. Recently a 40-bit key version was broken in 8 days
    without special computer power.

    RC5 is a fast block cipher designed by Rivest for RSA Data Security. It has a
    parametrised algorithm with a variable block size (32, 64 or 128 bits), a variable
    key size (0 to 2048 bits) and a variable number of rounds (0 to 255). It has a
    heavy use of data dependent rotations and the mixture of different operations.


