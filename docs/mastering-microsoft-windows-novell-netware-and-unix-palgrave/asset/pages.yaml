  md: 'controller. Data written to the first (primary) partition is mirrored automatically
    to the secondary partition. If the primary disk fails then the system uses the
    partition on the secondary disk. Mirroring also allows unallocated space on the
    drive to be allocated to the secondary drive. On a disk mirroring system the primary
    and secondary partitions have the same drive letter (such as C: or D:) and users
    are unaware that disks are mirrored.


    # 9.6.2 Disk duplexing


    Disk duplexing means that mirrored pairs are created by different controllers.
    This provides for fault tolerance on both disk and controller. Unfortunately,
    it does not support multiple controllers connected to a single disk drive.


    # 9.6.3 Stripping with parity


    Network servers normally support disk striping with parity. This technique is
    based on RAID 5 (Redundant Array of Inexpensive Disks), where a number of partitions
    on different disks are combined to make one large logical drive. Data is written
    in stripes across all of the disk drives and additional parity bits. For example,
    if a system has four disks then data is written to the first three and the parity
    is written to the fourth drive. Typically the stripe is 64 KB, then 64 KB will
    be written to Drive 1, the same to Drive 2 and Drive 3, then the parity of the
    other to the fourth. The following example illustrates the concept of RAID where
    a system writes the data 110, 000, 111, 100 to the first three drives, which gives
    parity bits of 1, 1, and 0 and so.


    If one of the disks fails then the addition of the parity bit allows the bits
    on the failed disk to be recovered. For example, if disk 3 fails then the bits
    from the other disk are simply XOR-ed together to generate the bits from the failed
    drive. If the other disk drives is 111 then the recovered data gives 001 gives
    0, and so on.


    | Disk 1 | Disk 2 | Disk 3 | Disk 4 (Odd parity) |

    |---|---|---|--|

    | 1 | 1 | 0 | 1 |

    | 0 | 0 | 0 | 1 |

    | 1 | 2 | 1 | 1 |

    | 1 | 1 | 0 | 0 |


    The 64 KB stripes of data are also interleaved the disks. The parity block is
    written to the first disk drive, then in the next block to the second, and so
    on. A system with four disk drives would store the following data:


    | Disk 1 | Disk 2 | Disk 3 | Disk 4 |

    |---|---|---|--|

    | Parity block 1 | Data block A | Data block B | Data block C |

    | Data block D | Parity block 2 | Data block E | Data block F |

    | Data block G | Data block H | Parity block 3 | Data block I |


    Each of the data blocks is 64 KB, which is equal to the parity block. The interlacing
    of the data ensures that the parity stripes are not all on the same disk. Thus
    there is no single point of failure for the set.


    Striping of data improves reading performance when each of the disk drives has
    a separate controller, because the data is simultaneously read by each of the
    controllers and simultaneously passed to the systems. This provides fast reading
    of data but only moderate writing performance (because the system must calculate
    the parity block).


    194 Mastering Microsoft Windows, Novell NetWare and UNIX'
  merge: -1
  pgno: 207
- img_proc: true
  md: 'The main advantages of RAID 5 can be summarised as:


    +   - It recovers data when a single disk drive or controller fails (RAID level
    0 does not use a parity block thus it cannot regenerate lost data).

    - It allows a number of small partitions to be built into a large partition.

    - Several disks can be mounted as a single drive.

    - Performance can be improved with multiple disk controllers.


    The main disadvantages of RAID 5 are:


    +   - It requires increased memory because of the parity block.

    - Performance is reduced when one of the disks fails, because of the need to regenerate
    the failed data.

    - It increases the amount of disk space as it has an overhead due to the parity
    block (although the overhead is normally less than disk mirroring, which has a
    50% overhead-).

    - It requires at least three disk drives.


    # 9.6.4 Tape backup


    Windows NT provides for automatic tape based on the Maynard tape system. Tape
    backup allows data to be recovered when faults occur. Normally the system manager
    backs up the network at the start of the week and then does an incremental backup
    each day.


    # 9.6.5 UPS services


    Windows NT provides services to uninterruptible power supplies (UPSs). UPS systems
    provide power, from batteries, to a computer system when there is a glitch in
    the supply, power sag or power failure. Windows NT detects signals from a UPS
    unit and performs an orderly shutdown of applications, services and file systems
    as the stored energy in the UPS is depleted.


    # 9.7 Security model


    Windows NT treats all its resources as objects that can only be accessed by authorised
    users and services. Examples of objects are directories, printers, processes,
    ports, devices and files. On an NTFS partition the access to an object is controlled
    by the security descriptor (SD) structure which contains an access control list
    (ACL) and security identifier (SI). The SD contains the user (and group) accounts
    that have access and permissions to the object. The system always checks the ACL
    of an object to determine whether the user is allowed to access it.


    The main parts of the SI are:


    +   OWNER Indicates the user account for the object.

    GROUP Indicates the group it belongs to.

    User ACL The user-controller ACL.

    System ACL System manager controlled ACL.'
