    # 3.13.2 Fibre Channel components


    The IEEE 802.3 committee based much of the physical layer technology on the ANSI-backed
    X.230 Fibre Channel project. This allowed many manufacturers to re-use physical-layer
    Fibre Channel components for Gigabit Ethernet, and has allowed a faster development
    time than is normal, and increased the volume production of the components. These
    include optical components and high-speed 8B/10B encoders.


    The 1000BASE-T standard uses enhanced DSP (Digital Signal Processing) and enhanced
    silicon to enable Gigabit Ethernet over UTP cabling. As Figure 3.23 shows, it
    does not use the 8B/10B encoding.


    # 3.13.3 Buffered distributors


    Along repeaters, bridges and switches, a new device called a buffered distributor
    (or full-duplex repeater) has been developed for Gigabit Ethernet. It is a full-duplex,
    multiport, hub-like device that connects two or more Gigabit Ethernet segments.
    Unlike a bridge, and like a repeater, it forwards all the Ethernet frames from
    one segment to the others, unlike a standard repeater, a buffered distributor
    buffers one, or more, incoming frames on each link before forwarding them. This
    reduces collisions on connected segments. The maximum bandwidth for a buffered
    distributor will still be only 1Gbps, as opposed to Gigabit switches which allow
    multi-Gigabit bandwidths.


    # 3.13.4 Quality of Service


    Many, real-time, networked applications require a given Quality of Service (QoS),
    which might relate bandwidth requirements, latency (network delays) and jitter.
    Unfortunately, there is nothing built into Ethernet that allows for a QoS, thus
    new techniques have been developed to overcome this. These include:


    +   RSVP. Allows nodes to request and guarantee a QoS, and works at a higher-level
    to Ethernet. For this, each network component in the chain must support RSVP and
    communicate appropriately. Unfortunately, this may require an intensive investment
    to totally support RSVP, thus many vendors have responded in implementing proprietary
    schemes, which may make parts of the network vendor-specific.'
