    # Connect event


    The Connect event connects to a server. If an error occurs then a flag (ErrorOccurred)
    is set to True, else it is False. Its syntax is:


    ```

    Private Sub object.Connect(ErrorOccurred As Boolean)

    ```


    # Close event


    The Close event occurs when the remote computer closes the connection. Applications
    should use the Close method to correctly close their connection. Its syntax is:


    ```

    object_Close()

    ```


    # DataArrival event


    The DataArrival event occurs when new data arrives, and returns the number of
    bytes read (bytesTotal). Its syntax is:


    ```

    object_DataArrival (bytesTotal As Long)

    ```


    # Bind method


    The Bind method specifies the Local port (LocalPort) and the Local IP address
    (LocalIP) to be used for TCP connections. Its syntax is:


    ```

    object.Bind LocalPort, LocalIP

    ```


    # Listen method


    The Listen method creates a socket and goes into listen mode (for server applications).
    Its stays in this mode until a ConnectionRequest event occurs, which indicates
    an incoming connection. After this, the Accept method should be used to accept
    the connection. Its syntax is:


    ```

    object.Listen

    ```


    # Accept method


    The Accept method accepts incoming connections after a ConnectionRequest event.
    Its syntax is:


    ```

    object.Accept requestID

    ```


    The requestID parameter is passed into the ConnectionRequest event and is used
    with the Accept method.'
