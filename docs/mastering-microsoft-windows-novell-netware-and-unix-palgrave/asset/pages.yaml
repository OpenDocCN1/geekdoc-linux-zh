    #  4.15.2 Options field in an IP header


    The Options in an IP header is an optional field which may or may not appear in
    the header, and is also variable in length. It is a field which must be implemented
    by all hosts and gateways. There are two classes of option:


    +   * An option-type byte.

    * An option-type byte, followed by an option-length byte, and the actual option-data
    bytes. The option-length byte counts all the bytes in the options field.


    The option-type byte is the first and has three fields, as illustrated in Figure
    4.13. The Copied flag indicates that this option is (or not) copied into all fragments
    on fragmentation.


