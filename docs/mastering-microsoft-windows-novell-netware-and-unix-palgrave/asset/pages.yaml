- img_proc: true
  md: 'The amount of available bandwidth for a single segment is massive. For example,
    almost 125 million characters (125MB) can be sent in a single second. A large
    reference book with over 1000 pages could be sent over a network segment, ten
    times in a single second. Compare it with a x24, CD-ROM drive which transmits
    at a maximum rate of 6.6MB/s (24x150KB/sec). Gigabit Ethernet operates almost
    35 times faster than this. With network switches, this bandwidth can be multiplied
    a given factor, as they allow multiple simultaneous connections.


    Gigabit Ethernet is an excellent channel for network backbones as it interconnects
    10/100BASE-T switches, and also provides a high-bandwidth to high-performance
    servers. Initial aims were:


    +   - Half-duplex operation at 100Mbps.

    - Standard 802.3 Ethernet frame. Gigabit Ethernet uses the same variable-length
    frame (64- to 1514-byte packets), and thus allows for easy upgrades.

    - Standard CSMA/CD access method.

    - Compatibility with 10BASE-T and 100BASE-T technologies.

    - Development of an optional Gigabit Media Independent Interface (GMII).


    The compatibility with 10/100BASE standards makes the upgrading to Gigabit Ethernet
    much easier, and considerably less risky than connecting to other networking types,
    such as FDDI and ATM. It will highly interconnect with, and autosense, existing
    slower rated Ethernet devices. Figure 3.23 illustrates the functional elements
    of Gigabit Ethernet. Its main characteristics are:


    +   - Full-duplex communication. As defined by the IEEE 802.3 specification, two
    nodes connected via a full-duplex switched path can simultaneously send and receive
    frames. Gigabit Ethernet supports new full-duplex operating modes for switch-to-switch
    and switch-to-end connections, and half-duplex operating modes for shared connections
    using repeaters and the CSMA/CD access method.

    - Standard flow control. Gigabit Ethernet uses standard Ethernet flow control
    to avoid congestion and overloading. When operating in half-duplex mode, Gigabit
    Ethernet adopts the same fundamental CSMA/CD access method to resolve contention
    for the shared medium.

    - Enhanced CSMA/CD method. This maintains a 200m collision diameter at Gigabit
    speeds. Without this, small packets could complete their transmission before the
    transmitting node senses a collision, violating the CSMA/CD method. To resolve
    this issue, the minimum CSMA/CD carrier time and the Ethernet slot time (time,
    measured in bits, for a node to detect a collision) have been extended from 64
    bytes (which is 51.2µs for 10BASE and 5.12µs for 100BASE) to 512 bytes (which
    is 4.1µs for 1000BASE). The minimum frame length is still 64 bytes. Thus, frames
    smaller than 512 bytes have a new carrier extension following the CRC field. Packs
    larger than 512 bytes are not extended.

    - Packet bursting. The slot time changes affect the small-packet performance,
    this has been offset by a new enhancement to the CSMA/CD algorithm, called packet
    bursting. This allows servers, switches and other devices to send bursts of small
    packets in order to fully utilise the bandwidth.'
