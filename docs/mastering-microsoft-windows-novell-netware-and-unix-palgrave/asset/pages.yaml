  md: '# Networking Fundamentals


    # 2.1 Introduction


    Most computers in organisations connect to a network using a LAN. These networks
    normally consist of a backbone, which is a common link to all the networks within
    the organisation. This backbone allows users on different network segments to
    communicate and allows data into and out of the local network. Figure 2.1 shows
    a local area network which contains various segments: LAN A, LAN B, LAN C, LAN
    D, LAN E and LAN F. These are connected to the local network via the BACKONE 1.
    Thus if LAN A talks to LAN E then the data must travel out of LAN A, onto BACKONE1.
    then into LAN C and into LAN E.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_33_0.png)


    Networks are partitioned from other networks with a bridge, a gateway or a router.
    A bridge links a network of one type to an identical type, such as Ethernet to
    Ethernet, or Token Ring to Token Ring. A gateway connects two dissimilar types
    of networks and routers operate in a similar way to gateways and can either connect
    to two similar'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'or dissimilar networks. The key operation of a gateway, bridge or router is
    that that it only allows data traffic through that is intended for another network,
    which is outside the connected network. This filters traffic and stops traffic,
    not indented for the network, from clogging-up the backbone. Most modern bridges,
    gateways and routers are intelligent and can automatically determine the topology
    of the network.


    Spanning-tree bridges have built-intelligence and can communicate with other bridges.
    They can then build up a picture of the interconnected networks. If more than
    one path exists between segments the bridge automatically finds the alternate
    routes. This is useful when a fault develops on a route or a route becomes too
    heavily loaded. Conventional bridges can cause frames to loop around forever.


    # 2.2 Peer-to-peer and client/server


    An important concept is differentiation between a peer-to-peer connection and
    a client/server connection. A peer-to-peer connection allows users on a local
    network access to a local computer. Typically, this might be access to:


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_34_0.png)


    **Local printers.** Printers local to a computer can be accessed by other users
    if the printer is shareable. This can be password protected, or not Shareable
    printers on a Microsoft network have a small hand under the icon.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_34_1.png)


    **Local disk drives and folders.** The drives, such as the hard disk or CDROM
    drives, can be accessed if they are shareable. Normally the drives must be shareable.
    On a Microsoft network a drive can be madeable by selecting the drive and selecting
    the right-hand mouse button, then selecting or can be accessed from a network
    server. User names and passwords can be set up locally or can be accessed from
    a network server. Typically only the local computer grants access to certain folders,
    while others not shared.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_34_2.png)


    These shared resources can also be mounted as disk-rives to the remote computer.
    Thus the user of the remote computer can simply access resources on the other
    computer as if they were locally mounted. This option is often the best when there
    is a small local network. It requires the minimum of set-up and does not need
    any complicated server set-ups.


    A client/server network has a central server which is typically used to:


    +   - Store username, group names and passwords.

    - Run print queues for centralised printers.

    - Allocate IP addresses for access to the Internet.

    - Provide centralised file services, such as hard-disks or CD-ROMs.

    - Provide system back-up facilities, such as CD-R and DAT.'
