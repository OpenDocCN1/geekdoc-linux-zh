  md: '# 13.10 Standard input and output


    The standard input device for a program is the keyboard and the standard output
    is the monitor. In UNIX, all input/output devices communicate through device files,
    which are normally stored in the /dev/ directory. For example, each connected
    keyboard to the system (including remote computers) has a different device name.
    Sample session 13.14 shows how the current terminal pathname can be displayed
    with the tty command.


    ```

    Sample session 13.14

    [47] :/user/bill_b ] % tty

    /dev/ttys0

    ```


    # 13.10.1 Redirection


    It is possible to direct the input (>) output from a program to another file or
    device. The redirection output symbol redirects the output of a program to a file
    (or output device). This will not appear on the monitor (unless it is redirected
    to it). Sample session 13.15 shows how the output from a directory listing can
    be sent to a file named dirlist (see [49]). The contents of this file are listed
    in [50].


    The redirection of output is particularly useful when a process is running and
    an output to the screen is not required. Another advantage of redirection is that
    it is possible to keep a permanent copy of a program''s execution.


    To create a file the cat command is used with the redirection, as shown next.
    The file is closed when the user uses the Ctrl-D keystroke (^), as shown in Sample
    run 13.16.


    If the user does not want the output of a program to appear on the screen it can
    be redirected to the file /dev/null (which is the waste basket of the system),
    and will be automatically deleted.


    ```

    Sample session 13.15

    [48] :/user/bill_b ] % ls

    compress design docs mentor research shells spwfiles

    [49] :/user/bill_b ] % ls dirlist

    [50] :/user/bill_b ] % cat dirlist

    compress design docs mentor research shells

    spwfiles

    [51] :/user/bill_b ] % ~

    ```


    ```

