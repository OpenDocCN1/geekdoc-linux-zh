    # 1.4 TCP/IP - the world''s most important protocol


    As the PC and other computers became more powerful, there was a demand for increased
    remote access of information and interconnection. This required a common'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'communication language (network protocol). Many protocols were developed, but
    the most important was developed by the US Defense Advanced Research Research
    Projects Agency (DARPA). This protocol was named TCP/IP and has since allowed
    computers around the world to intercommunicate, no matter their operating system,
    the computer type or their network connection. DARPA''s initial objective was
    simply to connect a number of universities and other research establishments to
    DARPA. The resultant interconnected network (internet) is now known as the Internet.
    It has since outgrown this application and many commercial organisations and home
    users connect to it. The Internet uses TCP/IP as a standard to transfer data.
    Each node on the Internet is assigned a unique network address, called an IP address.


    The IP part of the TCP/IP protocol provide for the routing of the data around
    the Internet and also a standardised addressing structure, where each node on
    the Internet is assigned a unique IP address. This is a 32-bit address and takes
    the form of WWW.XXX.YYY ZZZ (where WWW, XXX, YYY and ZZZ can range from 0 to 255).
    An IP address can be permanently assigned to the node or it can be dynamically
    assigned when the node accesses the Internet. Organisations who want to limit
    access to the Internet can only assign IP addresses to nodes which are allowed
    access to the Internet (with naming allocation).


    IP addresses are difficult to remember thus domain names (DNS) have been applied
    which use symbolic names rather than IP addresses. The directory network services
    on the Internet determine the IP address of the named destination user or application
    program. This has the advantage that users and programs can move around the Internet
    and are not fixed to an IP address. An analogy relates to the public telephone
    service. A telephone directory contains a list of subscribers and their associated
    telephone number. If someone looks for a telephone number, the first user name
    is looked up and their associated telephone number. The telephone directory listing
    thus maps a user name (symbolic name) to an actual telephone number (the actual
    address). When a user enters a domain name (such as www.fred.co.uk) into the browser
    then the local DNS server must try and resolve the domain name to an IP address,
    which can then be sent to the data to it. If it cannot find the IP address then
    the DNS server interrogates other servers to see if they know it.


    The Internet structure uses labels separated by periods (full stops); an example
    is eece.napier.ac.uk. It is a hierarchical structure where organisations are grouped
    into primary domain names. These are com (for commercial organisations), edu (for
    educational organisations), gov (for government organisations), mil (for military
    organisations), net (network support centres) or org (other organisations). The
    primary domain name may also define the country in which the host is located,
    such as uk (United Kingdom), fr (France), and so on. All hosts on the Internet
    must be registered to one of these primary domain names.


    The labels after the primary field define the subnetworks (subnets) within the
    network. For example in the address eece.napier.ac.uk, the ac label relates to
    an academic institution within the uk, the name of the institution and eece subnet
    within that organisation.


    TCP/IP has been unbelievably successful and has outgrown its original application.


