    # 12.12 Time synchronisation


    Time synchronisation between servers is important as it allows NDS events and
    modifications to be accurately time stamped. There are two main options:


    +   - **Single reference configuration.** This provides a single source of time
    reference and is typically used with networks with less than thirty servers.


    +   - **Time provider group configuration.** This provides a single reference
    primary server and, at least, two other primary time providers. It is typically
    used when there are more than thirty time servers connected to the network. The
    other primary time providers allow for a system failure of the reference primary
    server.


    The time synchronisation is provided with:


    +   - **SAP.** With the SAP type is 0000 0110 1011 (026Bh). The main disadvantage
    with this method is that SAP generally adds to network traffic, and SAP is self
    configuring, an incorrect set up can cause the incorrect time to be transmitted.


    +   - **Configured List Configuration.** This method allows each server to keep
    a list of servers which it can communicate with. This will generally lead to less
    network traffic as it does not use an SAP broadcast. It also stops incorrectly
    set up servers from transmitting incorrect time information (as the server will
    only communicate with preferred time servers).'
  merge: -1
  pgno: 250
- img_proc: true
  md: 'NetWare uses the TIMSYNC.NLM (NetWare Loadable Module) module to synchronize
    its local time. The server calculates Universal Coordinated Time (UTC) which provides
    a world standard time. UTC is a machine-independent time standard. It assumes
    that there are 86400 seconds each day (24×60) and once every year or two an extra
    second is added (a ‘leap’ second). This is normally added on 31st December or
    30th June.


    Most computer systems define time with GMT (Greenwich Mean Time), which is UT
    (Universal Time). UTC is based on an atomic clock, whereas GMT is based on astronomical
    observations. Unfortunately, because of the earth''s rotation GMT is not uniform,
    and is not accurate as UTC. UTC is calculated by:


    ```

    UTC = LOCAL TIME + timezone_offset + current_daylight_adjustment

    ```


    With TIMSYNC.NLM the system is not actually changed, the local clock is either
    speeded up (if it is behind) or slowed down (if it is ahead). This makes for gradual
    changes in the system. This is especially important for synchronization where
    directories and files are kept up to date between servers. An incorrectly set
    time on one server could cause an older file to replace a newer file. Every NDS
    object and its associated properties have a timestamp associated with them.


    # 12.1.2 NDS timestamp


    Particular problems caused with time on computer systems are the Year 2000 (where
    dates are referenced to the last two digits of the year) and where there is roll-over
    in the counter value which stores the system time. The Year 2000 can be easily
    eradicated by making sure that all references to time take into account the full
    format.


    The PC contains a 32-bit counter which is updated every second and is referred
    to the 1st January 1970 (the starting date for the PC). This provides for 4,294,967,296
    seconds (715,827,882 minutes, 11,930,465 hours, 497,103 days and 1361 years).
    The format of the NDS timestamp uses this format and adds other fields to define
    the place the event occurred and an indication of events that occur within a single
    second. It uses 64 bits and its format:


    +   - Seconds (32 bits). This stores the number of seconds since 1/1/1970. This
    allows for 4 billion seconds, which is approximately 1371 years, before a roll-over
    occurs.

    - Replica (16 bits). This is a unique number which defines where the event occurred
    and the timestamp issued.

    - Event ID (16 bits). Defines each event that occurs within a second different
    Event ID. This is required as many events can occur within a single second. This
    value is reset on every second, and thus allows up to 65,536 events each second.


    NDS always uses the most recently stamped object or properties for any updates.
    When an object is deleted its property is marked as ‘not present’. It will only
    be deleted once replica synchronisation process propagates the change to all other
    replicas.'
  merge: -1
  pgno: 251
- img_proc: true
  md: '# 12.12.2 Time server types


    NetWare 4.1 servers are set up as time servers when they are installed. They can
    either be:


    +   - **Primary time servers.** A primary time server provides information to
    others, but must contact the primary (or reference) server for their own time.

    - **Secondary time servers.** These are time consumers, which receive their time
    from other servers (such as a primary, reference or single reference server).

    - **Reference time servers.** These servers do not need to contact any other servers,
    and provide a time source for other time servers. This is a good option where
    there is a large network, as the primary time servers can provide local time information
    (this is called a time provider group).

    - **Single reference time servers.** These servers do not need to contact other
    time servers to get their own and are used as a single source of time. This is
    normally used in a small network, where there is a single reference time server
    with one or more secondary servers. The single reference time server and reference
    time server normally get their local time information from another source, such
    as Internet time, radio or satellite time. This is the default condition for instantiation.


    # 12.13 Virtual loadable modules (VLMs)


    The NETx redirector shell been replaced with DOS client software known as the
    requester. Its main advantage is that it allows NetWare clients to easily add
    or update their functionality by using VLMs. This is controlled through the DOS-based
    VLM management program (VLM.EXE). It differs from NETx in that the requester uses
    DOS tables of network-attached resources rather than creating and maintaining
    its own. The main difference between NETx and the requester is that it is the
    DOS system which controls whether the NetWare DOS request is called to handle
    network requests. Various VLM modules can be added onto the client, such as:


    +   - Bindery-based services.

    - File management.

    - IPX and NCP protocol stacks.

    - NDS services.

    - NetWare support for multiple protocol stacks (e.g. TCP/IP, SPX/IPX).

    - NETx shell emulation.

    - Printer redirector to network print queues.

    - TCP/IP and NCP protocol stacks.'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# 12.14 Fault tolerance


    Chapter 10 discussed how Windows NT servers use RAID (Redundant Array of Inexpensive
    Disks) with parity to allow the recovery of data when a disk drive fails. Net-Ware
    4.1 allows disk mirroring of partitions when a disk drive fails.

    Another major fault occurs when a server becomes inoperative. NetWare 4.1 uses
    a novel technique, known as SFT III, which allows server duplexing. In this technique,
    the contents of the disk, memory and CPU are synchronised between primary and
    duplex servers. When the primary server fails then the duplex server takes over
    transparent. These servers are synchron using the mirror server link (MSL), a
    dedicated link between the two servers, as illustrated in Figure 12.4. The MSL
    is a dedicated link because it prevents general network traffic from swamping
    the data.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_253_0.png)


    **Figure 12.4** Mirror server link


    It may seem expensive to have a backup server doing nothing apart from receiving
    data, but if it is costed with the loss of business or data when the primary server
    goes down then it is extremely cheap.


    # 12.15 Communications protocols


    NetWare 4.x has improved existing protocols and added the support for other standard
    network protocols, especially TCP/IP.


    # 12.15.1 TCP/IP


    TCP/IP is supported with NetWare/IP which is included with NetWare 4.1; Net-Ware/IP
    servers can support IP, IPX or IP or IPX traffic.'
  merge: -1
  pgno: 253
- img_proc: true
  md: '# 12.15.2 Large IPX packets (LIPs)


    Most networks have become less prone to error. Thus larger data packets can be
    transmitted with a low risk of errors occurring. LIP allows NetWare clients to
    increase the size of their data field by negotiating with routers to the size
    of the IPX frame (normally it has a maximum of 576 bytes). Unfortunately, an error
    in the packet causes the complete packet to be retransmitted (thus causing inefficiencies).
    In addition, the router must support the use of LIP. The software-based Novell
    router has a multiprotocol router which supports LIP. Unfortunately, other vendors
    may not support the LIP protocol.


    # 12.15.3 NetWare Link-State Routing Protocol (NLSP)


    RIP has several disadvantages, which include:


    +   - File servers transmit their routing every 60 seconds. This can have a great
    effect on the network loading, especially for interconnected networks.

    - RIP only supports 16 hops before an RIP packet is discarded, thus limiting the
    physical size of the internetwork linking NetWare LAN.


    NLSP, which is included in NetWare 4.1, overcomes these problems. With the routing
    table, NLSP only broadcasts when a change occurs, with a minimum update of every
    2 hours. This can significantly reduce the router-to-router traffic. As with RIP,
    Novell supports NLSP, but other vendors may not necessarily support it.

    NLSP supports an increased hop size. A great advantage of NLSP is that it can
    coexist with RIP and is backward compatible. This allows a gradual migration of
    network segments to NLSP.


    # 12.16 NetWare 4.1 SMP


    One of the great improvements in computer processing and power will be achievable
    through the use of parallel processing. This processing can either be realised
    using multiple local processors or network processors, called symmetrical multiprocessing
    (SMP). To maintain compatibility with a previous release, NetWare 4.1 SMP loads
    the SMP kernel which works co-operatively with the operating system kernel. The
    main processor runs the main operating system while the SMP kernel runs the second,
    third and fourth processors.


    # 12.17 Other enhancements


    Other enhancements have been added, such as:


    +   - File compression, which is controllable on a file-by-file basis.'
  merge: -1
