  md: '# Glossary of Common Terms


    100Base-FX IEEE-defined standard for 100 Mbps Ethernet using multimode fibre-optic
    optic cable.


    100Base-TX (802.3u) IEEE-defined standard for 100Mbps Ethernet using two pairs
    of Cat-5 twisted-pair cable.


    100VG-AnyLAN HP-derived network architecture based on the IEEE 802.12 standard
    that uses 100Mbps transmission rates. It uses a centrally controlled access method
    referred to as the Demand Priority Protocol (DPP), where the end node requests
    permission to transmit and the hub determines which node do so, depending on the
    priority of the traffic.


    10BASE-T IEEE-defined standard for 100Mbps Ethernet using twisted-pair cables.
    IEEE-defined standard for LAN security. It is sometimes used by network switches
    as a VLAN protocol and uses a technique where frames on any LAN carry a virtual
    LAN identification. For large networks this can be modified to provide security
    over the Internet.


    802.12 Demand Priority Protocol IEEE-defined standard of transmitting 100Mbps
    over voice grade (telephone) twisted-pair cable. See 100VG-AnyLAN.


    802.1d IEEE-defined bridging standard for Spanning Tree Protocol that is used
    to determine factors on both bridges (or switches) forward packets and avoiding
    networking loops. Networks which use redundant loops (for alternative routes)
    need to implement the IEEE 802.1d standard to stop packets from looping forward.


    802.2 A set of IEEE-defined specifications for Logical Link Control (LLC) layer.
    It provides some network functions and interfaces the IEEE 802.5, or IEEE 802.3,
    standards to the transport layer.


    802.3 IEEE-defined standard for CSMA/CD networks. IEEE 802.3 is the most popular
    implementation of Ethernet.


    802.3u IEEE-defined standard for 100Mbps Fast Ethernet. It also covers a technique
    called autosensing which allows 100 Mbps devices to connecting to 10 Mbps devices.


    802.4 IEEE-defined token bus specifications.


    802.5 IEEE-defined standard for token ring networks.


    Adapter Device which usually connects a node onto a network, normally called a
    network interface adapter (NIC).


    Adaptive cut-through switching A forwarding technique on a switch which when the
    error count on frames received has exceeded the pre-configured limits. When this
    count is exceeded, it modifies its own operating so that it no longer performs
    cut-through switching and goes into a store-and-forward'
