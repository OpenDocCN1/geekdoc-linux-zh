    # 5.9 traceroute


    The traceroute program traces the route of an IP packet through the Internet.
    It uses the IP protocol time-to-live field and attempts to get an ICMP EXCEEDED
    response from each gateway along to a defined host. The default data length is
    38 bytes (although the sample run uses 40 bytes by default).


    Sample run 5.8 shows an example of traceroute from a PC (pc419.eece.napier.ac.uk).
    It can be seen that it goes through a bridge (pcbridge.eece.napier.ac.uk) and
    then to the destination (miranda.eece.napier.ac.uk).


    Sample run 5.9 shows the route from a PC (pc419.eece.napier.ac.uk) to a destination
    node (www.bath.ac.uk). Initially, from the originator, the route goes through
    a gateway (146.176.151.254) and then goes through a routing switch (146.176.151.120)
    and onto EastSMMAN ring which the route goes to EastSMAN to a gateway at the University
    of Edinburgh (smds-gw.edja.net). It is then routed onto the SuperJanet network
    and reaches a gateway at the University of Bath (smds-gw.bath.ac.uk). It goes
    to another gateway (ips-gw.bath.ac.uk) and finally to its destination (jess.bath.ac.uk).
    5.15 shows the route packet taken.


    # Sample run 5.8: Example traceroute


    ```

    www:~ traceroute to miranda.eece.napier.ac.uk (146.176.144.14), 30 hops max, 40
