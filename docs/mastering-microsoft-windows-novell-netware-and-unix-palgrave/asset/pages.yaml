  md: '# 14 UNIX Networking and Processes


    # 14.1 Network set-up


    Modern UNIX-based systems tend to be based around four main components:


    +   - UNIX operating system.

    - TCP/IP communications.

    - Network file system (NFS).

    - X-Windows interface.


    X-Windows presents a machine-independent user interface for client server applications.
    This will be discussed in more detail in the next chapter. TCP IP allows for network
    communications and NFS allows disk drives to be linked together to make a global
    file system.


    # 14.2 TCP/IP protocols


    UNIX uses the normal range of TCP/IP protocols, grouped into transport, routing,
    network addresses, user services, gateway and other protocols.


    Routing


    Routing protocols manage the addressing of the packets and provide a route from
    the source to the destination. Packets may also be split up into smaller fragments
    and reassembled at the destination. The main routing protocols are:


    +   - ICMP (Internet Control Message Protocol) which supports status messages
    for the IP protocol. These may be errors or network changes that can affect routing.

    - IP (Internet Protocol) which defines the actual format of the IP packet.

    - RIP (Routing Information Protocol) which is a route determining protocol.


    Transport


    The protocols are used by the transport layer to transport a packet around a network.
    The protocols used are:


    +   - TCP (Transport Control Protocol) which is a connection-based protocol where
    the'
  merge: -1
  pgno: 277
- img_proc: true
  md: 'source and the destination make a connection and maintain the connection for
    the length of the communications.


    +   - UDP (User Datagram Protocol) which is a connectionless server where there
    is no communication between the source and the destination.


    # Network addresses


    The network address protocols resolve IP addresses with their symbolic names,
    and vice versa. These are:


    +   - ARP (Address Resolution Protocol) determines the IP address of nodes on
    a network.


    +   - DNS (Domain Name System) which determines IP addresses from symbolic names
    (such as anytown.ac.uk might be resolved to 112.123.33.22).


    # User services


    These are applications to which users have direct access.


    +   - BOOT (Boot Protocol) which is typically used to start a diskless networked
    node. Thus rather than reading boot information from its local disk it reads the
    data from a server. Typically it is used by X-Windows terminals.


    +   - FTP (File Transfer Protocol) which is used to transfer files from one node
    to another


    +   - TELNET which is used to remotely log into another node.


    # Gateway protocols


    The gateway protocols provide help for the routing process. These protocols include:


    +   - EGP (Exterior Gateway Protocol) which transfers routing information for
    an external network.


    +   - GGP (Gateway-to-Gateway Protocol) which transfers routing information between
    Internet gateways.


    +   - IGP (Interior Gateway Protocol) which transfers routing information for
    internal networks.


    # Other services


    Other important services provide support for networked file systems, electronic
    mail and time synchronisation as well as maintain a global network database. The
    main services are:


    +   - NFS (Network File System) which allows disk drives on remote nodes to be
    mounted on a local node and create a global file system. This will be discussed
    in more detail in Section 14.3.


    +   - NIS (Network Information Systems) which maintains a network-wide database
    for user accounts and thus allows users to log into any computer on the network.
    Any changes to a user''s accounts are made over the whole network.'
  merge: -1
  pgno: 278
- img_proc: true
  md: 'NTP (Network Time Protocol) which is used to synchronise clocks of nodes on
    the network.


    RPC (Remote Procedure Call) which enables programs running on different nodes
    on a network to communicate with each other using standard function calls.


    SMTP (Simple Mail Transfer Protocol) which is a standard protocol for transferring
    electronic mail messages.


    SNMP (Simple Network Management Protocol) which maintains a log of status messages
    about the network.


    # 14.3 NFS


    The Network File System (NFS) allows computers to share the same files over a
    network and was originally developed by Sun Microsystems. It has the great advantage
    that it is independent of the operating system and can provide data sharing among
    different types of systems (heterogeneous systems).


    NFS uses a client/server architecture where a client can act as an NFS client,
    an NFS server or both. Any NFS client makes requests to access data and files
    on servers; the server makes that specific resource available to the client.


    NFS servers are passive and stateless. They wait for requests from clients and
    maintain no information on the client. One advantage of servers being stateless
    is that it is possible to reboot servers without adverse consequences to the client.


    The components of NFS are as follows:


    +   - NFS remote file access may be accompanied by network information service
    (NIS).

    - External data representation (XDR) is a universal data representation used by
    all nodes. It provides a common data representation if applications are to run
    transparently on a heterogeneous network or if shared among heterogeneous systems.
    Each node translates machine-dependent data formats to XDR format when sending
    and translating data. It is XDR that enables heterogeneous nodes and operating
    systems to communicate with each other over the network.

    - Remote Procedure Call (RPC) provides the ability for clients to transparently
    execute procedures on remote systems of the network. NFS services run on top of
    the RPC, which corresponds to the session layer of the OSI model.

    - Network lock manager (rpc.lock) allows users to coordinate and control access
    to information on the network. It supports file locking and synchronises access
    to shared files.


    Figure 14.1 shows how the protocols fit into the OSI model.'
