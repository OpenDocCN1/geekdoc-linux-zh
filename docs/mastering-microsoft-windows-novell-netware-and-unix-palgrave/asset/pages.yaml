  md: '# 9.3.2 NetBEUI


    NetBEUI (NetBIOS Extended User Interface) has been used with network operating
    systems, such as Microsoft LAN manager and OS/2 LAN server. In Windows NT, the
    NetBEUI frame (NBF) protocol stack gives backward compatibility with existing
    NetBEUI implementations and also provides for enhanced implementations. NetBEUI
    is the standard technique that NT clients and servers use to intercommunicate.


    NBF is similar to TCP/IP or SPX/IPX. It is used to establish a session between
    a client and a server, and also to provide the reliable transport of the data
    across the connection-oriented session. Thus NetBEUI tries to provide reliable
    data transfer through error checking and acknowledgement of each successfully
    received data packet. In the standard form of NetBEUI each packet must be acknowledged
    after its delivery. This is wasteful in time. Windows NT uses NBF which improves
    NetBEUI as it allows several packets to be sent before requiring an acknowledgement
    (called an adaptive window protocol).


    Each NetBEUI is assigned a 1-byte session number and thus allows a maximum of
    254 simultaneously active sessions (as two of the connection numbers are reserved).
    NBF enhances this by allowing 254 connections to computers with 254 sessions for
    each connection (thus there is a maximum of $254 \times 254$ sessions).


    # 9.3.3 AppleTalk


    The AppleTalk protocol allows Windows NT to share a network with Macintosh clients.
    It can also act as an AppleShare server.


    # 9.3.4 DLC


    Data link control (DLC) is a communications protocol which is used with IBM mainframes.
    Windows NT interfaces to a DLC network.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_202_0.png)'
