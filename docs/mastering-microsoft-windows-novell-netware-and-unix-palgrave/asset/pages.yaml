    # 1.6 Compression, JPEG, MPEG and ZIP


    Compression involves taking a data source and trying to extract any redundant
    information. This redundancy can take many forms, such as the reduction of the
    number of colours in an image or by using special codes for repetitive patterns.
    The need for compression has been due to the increase in the transmission of digital
    audio and motion video.


    Compression is either lossy or lossless. In lossless compression, the information,
    once uncompressed, is identical to the original uncompressed data. This is the
    case with computer-type data, such as data files, computer programs, and so on.
    Any loss of data will cause the file to be corrupted. With lossy compression the
    information, once uncompressed, cannot be fully recovered. This type of normally
    involves analysing the data and determining which information has effect on the
    resulting compressed data. For example, there is little difference, to the human
    eye, between an image with 16.7 million colours (24-bit colour information) and
    an image stored with 1024 colours (10-bit colour information), but the storage
    will be reduced to 41.67% resolutions). Compression of an image may also be used
    to reduce the resolution of the image. Again, the human eye may compensate for
    the loss of resolution.


    The most prevalent lossless technique was developed by Abraham Lempel and Jacob
    Z, and is known as Lempel-Ziv (or LZ77 as it was developed in 1977). The LZ coding
    scheme takes into account repetition in phrases, words or parts of words. These
    repeated parts can be either text or binary. A flag is normally used to identify
    coded and unencoded parts. An example of text could be:'
