  md: '# ## UNIX


    # ### 13.1 Introduction


    UNIX is an extremely popular operating system and dominates in the high-powered,
    multitasking workstation market. It is relatively simple to use and to administer,
    and also has a high degree of security. UNIX computers use TCP/IP communications
    to mount disk resources from one machine onto another. UNIX''s main characteristics
    are:


    +   - Multi-user.

    - Pre-emptive multitasking.

    - Multithreaded applications.

    - Memory management with paging (organising programs so that the program is loading
    into pages of memory) and swapping (which involves swapping the contents of memory
    to disk storage).


    The two main families of UNIX are UNIX System V and BSD (Berkeley Software Distribution)
    Version 4.4. System V is the operating system most often used and has descended
    from a system developed by the Bell Laboratories; it was recently sold to SCO
    (Santa Cruz Operation). Popular UNIX systems are:


    +   - AIX (on IBM workstations and mainframes).

    - HP-UX (on HP workstations).

    - Linux (on PC-based systems).

    - OSF/1 (on DEC workstations).

    - Solaris (on Sun workstations).


    An initiative by several software vendors has resulted in a common standard for
    the user interface and the operation of UNIX. The user interface is defined by
    the common desktop environment (*CDE*). This allows software vendors to write
    calls to a standard CDE API (application program interface). The common UNIX standard
    has been defined as Spec 1170 APIs. Compliance with the CDE and Spec 1170 API
    are certified by X/Open, which is a UNIX standard organisation.


    Another important UNIX-like operating system is Linux, which was developed by
    Linus Torvalds at the University of Helsinki in Finland. It was first made public
    in 1991 and most of it is available free-of-charge. The most widely available
    version was developed by the Free Software Foundation''s GNU project. It runs
    on most Intel-based, SPARC and Alpha-based computers.'
  merge: -1
  pgno: 256
- img_proc: true
  md: '# 13.2 Directory structure


    Files permanent information, which are used by programs. This information could
    be schematics, text files, documents, and so on. Directories are then used to
    arrange the files into a more logical manner. In UNIX the top level of the directory
    system is the root level and is given the name /. Figure 13.1 shows an example
    directory structure. In this case there are five sub-directories below the root
    level (bin, usr, etc, dev and user). Below the usr directory there, there are
    three sub-directories (lib, adm and bin). In this case, the users of the system
    have been assigned to a sub-directory below the users directory, that is, bill_b,
    fred_a and fred_s.


    The full pathname of the bill_b directory is /users/bill_b and the full-name of
    the adm directory is /usr/admin. Files figure 13.2 shows an example structure.
    In this case, the full pathname of the FORTRAN file prog.ftn:


    ```

    /user/bill_b/src/fortran/prog.ftn

    ```


    and the full pathname of the c directory is:


    ```

    /user/bill_b/src/c

    ```


    Files and sub-directories can also be referred to in a relative manner, where
    the directory is not referred to the top-level (it thus does not have a proceeding
    /). For example, if the user was in the bill_b directory then the relative path
    for the C program filel.c is:


    ```

    src/c/filel.c

    ```


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_257_0.png)


    Figure 13.1 Basic directory structure'
