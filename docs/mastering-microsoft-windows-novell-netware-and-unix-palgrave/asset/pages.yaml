  md: '# 18.5.2 UPDATE message format


    The UPDATE message is used to transfer routing information between BGP peers.
    This information is used to construct a graph describing the relationships of
    the various Autonomous Systems. The extra information added to the fixed-size
    BGP header is as follows:


    +   - **Total Path Attribute Length.** Indicates the length of the Path Attribute
    fields in bytes. Its value must allow the number of Network fields to be determined
    as specified below. 2 bytes.

    - **Path Attributes.** A variable length sequence of path attributes. Each path
    contains the attributes for attribute type, attribute length and attribute value.
    These are:


    +   - Attribute Type. Consists of the Attribute flags ($b_0$-$b_5$) followed by
    the Attribute Type Code ($b_6$-$b_7$). 2 bytes. The format of the Attribute flags
    are:

    $b_0$: Optional. Defines whether the attribute is optional (if set to 1) or well-known
    (if set to 0).

    $b_1$: Transient. Defines whether an optional attribute is transitive (if set
    to 1) or non-transitive (if set to 0). See Section 18.5.6.

    $b_2$: Partial. Defines whether the information contained in the optional transitive
    attribute is partial (if set to 1) or complete (if set to 0). For well-known attributes
    and for optional non-transitive attributes the Partial bit must be set to 0.

    $b_3$: Extended Length. Defines whether the Attribute Length is one byte (if set
    to 0) or two bytes (if set to 1).

    $b_4$-$b_7$: Unused and set to zero.


    +   - Attribute Type Code. Contains the Attribute Type Code (See Section 18.5.6).


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_354_0.png)


    Figure 18.8 BGP OPEN message data'
  merge: -1
  pgno: 354
- img_proc: true
  md: '+   - Network Each Internet network number indicates one network whose Autonomous
    System routing is described by the Path Attributes. 4-byte.


    The total number of Network fields in the UPDATE message can be determined by
    the formula:


    Message_Length = 19 + Total_Path_Attribute_Length + 4 × No_of_networks


    # 18.5.3 KEEPALIVE message format


    The KEEPALIVE message consists of only the message header (and thus is only 19
    bytes) and is used to determine if peers are reachable. Unlike other routing protocols,
    such as RIP, BGP does not poll its peers to determine if they are reachable, instead
    peers exchange KEEPALIVE messages (which must be less than the hold time of the
    OPEN message). A typical maximum time between KEEPALIVE messages is one-third
    of the hold time period.


    # 18.5.4 NOTIFICATION message format


    The NOTIFICATION message is sent when an error condition occurs and the BGP connection
    is immediately closed after sending it. The extra information added to the fixed-size
    BGP header is as follows:


    +   - Error code. Indicates the type of NOTIFICATION. 1 byte. Defined error codes
    are:


    +   1 Message Header Error 2 OPEN Message Error

    3 UPDATE Message Error 4 Hold Timer Expired

    5 Finite State Machine Error 6 Cease


    +   - Error subcode. Provides more specific information about the error. 1 byte.
    Each Error Code can have one or more Error Subcodes associated with it. Error
    sub-codes are:


    +   - Message Header subcodes:

    1 - Connection Not Synchronised. 2 - Bad Message Length.

    3 - Bad Message Type.


    +   - OPEN Message subcodes:

    1 - Unsupported Version Number. 2 - Bad Peer AS.

    3 - Unsupported Authentication Code. 4 - Authentication Failure.


    +   - UPDATE Message Error subcodes:

    1 - Malformed Attribute List. 2 - Unrecognized Well-known Attribute.

    3 - Missing Well-known Attribute. 4 - Attribute Flags Error.

    5 - Attribute Length Error. 6 - Invalid ORIGIN Attribute

    7 - AS Routing Loop. 8 - Invalid NEXT HOP Attribute.

    9 - Optional Attribute Error. 10 - Invalid Network Field.'
  merge: -1
  pgno: 355
- img_proc: true
  md: '+   - Data. Diagnostic data which identifies the reason for the NOTIFICATION
    message. Its contents depends on the Error Code and Error Subcode. Variable-length.


    The message length can be determined by:


    ```

    Message_Length = 21 + Data_Length

    ```


    # 18.5.5 Path attributes


    Path attributes in the UPDATE message fall into four separate categories:


    +   - Well-known mandatory.

    - Well-known discretionary.

    - Optional transitive.

    - Optional non-transitive.


    Attributes which are well known must be recognised they must be included in every
    UPDATE message. Discretionary attributes may or may not be sent in an UPDATE message.
    Table 18.1 defines the well-known attributes.


    # Table 18.1 Well-known attributes


    | Attribute Name | Type code | Length | Attribute category | Description |

    |---|---|---|---|---|

    | ORIGIN | 1 | 1 | Well-known, mandatory | Defines the origin of the path information.
    Values are: 0 IGP - network(s) are interior to the originating AS. 1 EGP - network(s)
    learned via EGP. 2 INCOMPLETE - network(s) learned by some other methods. |

    | AS_PATH | 2 | variable | Well-known, mandatory | AS_PATH attribute enumerates
    the ASs that must be traversed to reach the networks listed in the UPDATE message.
    |

    | NEXT_HOP | 3 | 4 | Well-known, mandatory | Defines the IP address of the border
    router that should be the next hop to the networks listed in the UPDATE message.
    |

    | UNREACHABLE | 4 | 0 | Well-known, discretionary | Used to notify a BGP peer
    that some of the previously advertised routes have be unreachable. |

    | INTER-AS METRIC | 5 | 2 | Optional, non-transitive | May be used on external
    (inter-AS) links to discriminate between multiple exit or entry points to the
    same neighbouring AS. |'
