    # 3.9 100 Mbps Ethernet


    Standard 10 Mbps Ethernet does not perform well when many users are running multimedia
    applications. Two improvements to the standard are Fast Ethernet and 100VG-AnyLAN.
    The IEEE has defined standards for both of them, IEEE 802.3u for Fast Ethernet
    and 802.12 for 100VG-AnyLAN. They are supported by many manufacturers and use
    bit rates of 100 Mbps. This gives at least 10 times the performance of standard
    Ethernet.


    New standards relating to 100 Mbps Ethernet are now becoming popular:


    +   * 100BASE-TX (twisted-pair) – which uses 100 Mbps over two pairs of Cat-5
    UTP cable or two pairs of Type 1 STP cable.

    * 100BASE-T4 (twisted-pair) – which is the physical layer standard for 100 Mbps
    over Cat-3, Cat-4 or Cat-5 UTP.

    * 100VG-AnyLAN (twisted-pair) – which uses 100 Mbps over two pairs of Cat-5 UTP
    cable or two pairs of Type 1 STP cable.

    * 100BASE-FX (fibre-optic cable) – which is the physical layer standard for 100
    Mbps over fibre-optic cables.


    Fast Ethernet, or 100BASE-T, is simply 10BASE-T running at 10 times the bit rate.
    It is a natural progression from standard Ethernet and thus allows existing networks
    to be easily upgraded. Unfortunately, as with Ethernet, nodes contend for the
    network, reducing the network efficiency when there are high traffic rates. Also,
    as it uses collision detection, the maximum segment length is limited by the amount
    of time for the farthest nodes on a network to properly detect collisions. On
    a Fast Ethernet network with twisted-pair copper cables this distance is 100 m,
    and for a fibre-optic link, it is 400 m. Table 3.2 outlines the main network parameters
    for Fast Ethernet.'
