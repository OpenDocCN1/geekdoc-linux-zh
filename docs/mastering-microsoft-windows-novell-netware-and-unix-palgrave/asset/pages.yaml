  pgno: 23
- img_proc: true
  md: '‘The receiver requires a receipt which is automatically sent when it is received.’


    This has the repetitive sequence ‘reci’. The encoded sequence could be modified
    with the flag sequence #m#n m represents the number of characters to trace back
    to find the character sequence and n the number of replaced characters. Thus the
    encoded message could:


    The receiver requires a #20#5pt which is automatically sent #6#2 it #30#2 #47#5ved.


    Normally a long sequence of text has many repeated words and phrases, such as
    ‘and’, ‘there’, and so on. Note that in some cases this could lead to longer files
    if sequences were replaced with codes that were longer than the actual sequence
    itself.


    The Lempel-Ziv-Welsh (LZW) algorithm (also known LZ-78) builds a dictionary of
    frequently used groups of characters (or 8-bit binary values). Before the file
    is decoded, the compression dictionary must be (if transmitting) or stored (if
    data is stored). This method is good for compressing text files because text contain
    ASCII characters (which are stored as 8-bit binary values) but not so good for
    graphics files, which may have repeating patterns of binary digits that might
    not be multiples of 8 bits. This technique is used in compression techniques,
    such as in ZIP files.


    A typical standard for image compression was devised by the Joint Photo Expert
    Group (JPEG), a subcommittee of the ISO/IEC. It produces lossy compression (although
    in one mode it is lossless) and stores changes in brightness and colour. The image
    is very sensitive to brightness and colour, if these changes are similar to the
    original then the eye perceives the recovered image as very similar to the original.


    The first part of the JPEG compression separates each colour (red, green and blue)
    in terms of luminance (brightness) and chrominance (colour information). JPEG
    allows more losses on colour changes than to changes in luminance and the human
    eye is less sensitive to colour changes than to changes in brightness.


    The transform used in JPEG is the DCT (discrete cosine transform) which converts
    intensity data into frequency data. This data can be used to tell how fast the
    intensities vary. Fast changes in colour are difficult for the human eye to perceive
    and are coded with fewer bits than other codes.


    Motion video contains massive amounts of redundant information. This is because
    each image has redundant information and also there are very few changes from
    one image to the next. Motion video image compression relies on two facts:


    +   - Images have a great degree of redundancy (repeated images, repetitive, superfluous,
    duplicated, exceeding what is necessary, and so on).


    +   - The human eye and brain have limitations on what they can perceive.


    The Motion Picture Experts Group (MPEG) developed an international standard for
    the compression of high-quality audio and video information. At the time, CD-ROM
    single-speed technology allowed a maximum bit rate of 1.2 Mbps and it is this'
  merge: -1
  pgno: 24
- img_proc: true
  md: 'rate to the standard we built around. These days, x24 and x32 CD-ROM bit rates
    are common.


    MPEG''s main aim was to provide good quality video and audio using hardware processors
    (and in some cases, on workstations with sufficient computing power, to perform
    the tasks using software). One of the techniques used to reduce the data is motion
    estimation. With this encoding system searches for multiple blocks of pixels within
    a given search area and tries to track objects which move across the image. These
    multiple blocks can then be stored as references to a previous block.


    # 1.7 Audio compression


    MPEG and Dolby AC-3 use the psycho-acoustic model to reduce the data rate, which
    exploits the characteristics of the human ear. This is similar to the method used
    in MPEG video compression which uses the fact that the human ear has a lack of
    sensitivity to the higher-frequency components (that is, sharp changes of colour
    or contrast). The psycho-acoustic model allows certain frequency components to
    be reduced without affecting the perceived audio quality heard by the listener.


    MPEG-3 has been proven to be extremely at compressing audio data, and is used
    in mini-disks and flash memory audio players.


    A well-known effect is the masking effect. This is where only heard by a person
    when there are no other sounds to mask it. A typical example is high-frequency
    hiss from a compact cassette when there are quiet passages of music. In normal
    periods of music the louder music masks out the quieter and the noise is not heard.
    In reality, the brain is actually masking the part of the sound it wants to hear,
    although the noise component is still there. When there is no music to mask the
    sound then the noise is heard.


    Noise, itself, tends to occur across a wide range of frequencies, but the masking
    effect also occurs with certain sounds. A loud sound at a certain frequency masks
    out a quieter sound at a similar frequency. The therefore sound heard by the listener
    only to contain the loud sounds; the quieter sounds are masked out. The psycho-acoustic
    model tries to reduce the levels to those that would be perceived by the brain.


    The psycho-acoustic model also takes into account non-linearities in the sensitivity
    of the ear. Its peak sensitivity is between 2 and 4kHz (the range of the human
    voice) and it is least sensitive around the extremes of the frequency range (i.e.
    high and low frequencies). Any noise in the less sensitive frequency ranges is
    more easily masked, but it is important to minimise any noise in the peak range
    because it has a greater impact.


    Masking can also be applied in the time domain, where it is just before and after
    a strong sound (such as a change of 30 and 40 dB). Typically, premasking occurs
    for about 2 – 5 ms before the sound is perceived by the listener and the post-masking
    effect lasts for about 100 ms after the end of the source.'
