    # 12.9 Country object


    The country object is not commonly used as it fixes the geographical location
    of objects. It has the advantage, though, that fits into a common internet naming
    structure (such as, www.eece.napier.ac.uk) or X.500 names. Most networks though
    have the Organisational Unit following the [ROOT] level. For example an educational
    organisation in the UK will have a country object of UK and the organisation object
    of AC (as defined in the Internet name). The Organisation Unit would then be the
    name of the academic organisation (in this case, Napier). Next, the facilities
    and departments are defined, as follows:


    ```

    [Root]

    c=uk

    o=ac

    ou=napier

    ou=Arts

    ou=Business

    ou=Engineering

    ou=electrical

    nou=mechanical

    nou=mechanical

    nou=computing

    ```


    Thus, the context name for a printer (LJET5) in the Electrical department would
    be:


    ```

    CN=LJET5.OU=ELECTRICAL.OU=ENGINEERING.O=NAPIER.C=UK

    ```


    This is obviously similar to the Internet name for the device, which would be:


    ```

    ljet5.electrical.engineering.napier.ac.uk

    ```


