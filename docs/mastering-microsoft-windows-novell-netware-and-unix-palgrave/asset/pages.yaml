  md: '# Fred''s Home Page


    If you want to access information on this book click here


    A reference to the IEE


    Figure 16.4 Netscape Navigator Version 4.0


    # 16.5 Internet resources


    The Internet expands by the day as the amount of servers and clients which connect
    to the global network increases and the amount of information contained in the
    network also increases. The three major services which the Internet provides are:


    +   * The World Wide Web.

    * Global electronic mail.

    * Information sources.


    The main information sources, apart from the WWW, are from FTP, Gopher, WAIS and
    UseNet servers. These different types of servers which will be discussed in the
    next section.


    # 16.6 Universal resource locators (URLs)


    Universal resource locators (URLs) are used to locate a file on the WWW. They
    provide a pointer to any object on a server connected over the Internet. This
    link could give FTP access, hypertext references, and so on. URLs contain:


    +   * The protocol of the file (the scheme).

    * The server name (domain).

    * The pathname of the file.

    * The filename.'
