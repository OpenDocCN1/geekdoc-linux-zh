    # 11.6 Novell NetWare set-up


    NetWare 3.x and 4.1 use the Open Data-Link Interface (ODI) to interface NetWare
    to the NIC. Figure 11.9 shows how the NetWare 3.x fits into the OSI model. ODI
    is similar to DISIS in Windows NT and was developed jointly between Apple and
    Novell. It provides a standard vendor-independent method to interface the service'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'and the hardware (Figure 11.10 shows that Windows NT can choose between NDIS2
    and ODI.


    A typical login procedure for a NetWare 3.x network is:


    ```

    LSL.COM

    NE2000

    IPXODI

    Netx /PS=EECE_1

    F:

    LOGIN

    ```


    The program LSL (link support layer) provides a foundation for the MAC layer to
    communicate with multiple protocols. An interface adapter driver (in this case
    NE2000) provides a MAC layer driver and is used to communicate with the interface
    card. This driver is known as a multilink interface driver (MLID). After this
    driver is installed, the program IFXODI is then installed. This program normally
    communicates with LSL and applications.


    The Netx program communicates with the server and sets up a connection with the
    server EECE_1. This sets up a local disk partition of F:(onto the user''s network
    directory will be mounted). Next the user logs into the network with the command
    LOGIN.


