    * A ring network.

    * A bus network.


    There are other topologies which are either a combination of two or more topologies
    or are derivatives of the main types. A typical topology is a tree topology that
    is essentially a star and a bus network combined, as illustrated in Figure 2.4.
    A concentrator (or hub) is used to connect the nodes onto the network.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_36_0.png)


