    # Fixed-length and Variable-length Opaque Data


    Opaque data is uninterpreted data and consists of a number of bytes (either fixed
    or variable). It is declared as following


    ```

    opaque identifier[n];

    ```


    where the constant n is the (static) number of bytes necessary to contain the
    opaque data. If n is not divisible by 4 then a number of residual bytes are added.
    This can be represented as follows:


    ```

    +------------------------------------------------------------+

    | byte 0 | byte 1 |...| byte n-1 | 0 |...| 0 |

    +------------------------------------------------------------++

    |<----------n bytes--------->||<----------r bytes---------->>|

    |<----------n+r (where (n+r) mod 4 = 0)----------------------|>

    ```


    Variable-length opaque data is defined as a sequence of n (numbered 0 through
    n-1) arbitrary bytes. The first four bytes define the number (as an unsigned integer)
    of encoded bytes in the sequence. If this value is not divisible by 4 then a number
    of residual bytes are added. It is declared as following:


    ```

    opaque identifier<m>;

    ```


    where the constant m denotes an upper bound of the number of bytes that the sequence
    may contain. It may be represented by:


    ```

    +----------------------------------------------------------------------+

    | 0 1 2 3 4 5 ... |

    +----------------------------------------------------------------------+

    | length n |byte0|byte1|...| n-1 | 0 | ...| 0 |

    +----------------------------------------------------------------------+

    |<---------4 bytes--------->|<-----n bytes----->|<------r bytes----->|

    |<----------n+r (where (n+r) mod 4 = 0)----|>

    ```


