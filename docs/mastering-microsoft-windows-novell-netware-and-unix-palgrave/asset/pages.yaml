    \ than 6.\n- SKIPJACK. Skipjack is new block cipher which operates on 64-bit blocks.\
    \ It uses an 80-bit key and has 32 rounds. The NSA have detailed details of Skipjack\
    \ and its algorithm is only available in hardware implementation Clipper Chips.\
    \ The name Clipper derives from an earlier implementation of Clipper. Each transmission\
    \ contains the session key encrypted in the header. The licensing of Clipper Chips\
    \ allows the US government to decrypt all SKIPJACK messages.\n\n# 17.10 Data Encryption\
    \ Standard (DES)\n\nIn 1977, the National Bureau of Standards (now the National\
    \ Institute of Technology) published the DES for commercial and unclassified US\
    \ government applications. DES is based on an algorithm known as the Lucifer cipher\
    \ designed by IBM. It maps a 64-bit input block to a 64-bit output block and uses\
    \ a 56-bit key. The key is actually 64 bits long but as 1 bit in each of the 8\
    \ bytes is used for odd parity on each byte, the key only contains 56 meaningful\
    \ bits.\nThe main steps in the encryption process are as follows:\n\n+   - Initially\
    \ the 64-bit input is permuted to obtain a 64-bit result (this operation does\
    \ little to the security of the code).\n- Next, there are 16 iterations of the\
    \ 64-bit result and the 56-bit key. Only 48 bits of the key are used at a time.\
    \ The 64-bit output from each iteration is used as an input to the next iteration.\n\
    - After the 16th iteration, the 64-bit output goes through another permutation,\
    \ which is the inverse of the initial permutation.\n\nFigure 17.12 shows the basic\
    \ operation of DES encryption.\nThe design of the DES scheme was constructed behind\
    \ closed doors so that there are few pointers to the reasons for the encryption.\
    \ One of the major weaknesses of the system is the usage of a 56-bit key, which\
    \ means there are only $2^{56}$ or $7.2\times10^{16}$ keys. Thus, as cost of hardware\
    \ reduces and the power of computers increases, the time taken to exhaustively\
    \ search for a key becomes smaller each year."
