  md: '# 10 Windows Registry


    # 10.1 Introduction


    The Registry is logically stored as a single entity, but it physically consists
    of two different files. These are:


    +   - USER.DAT. Contains user-specific information for different user profiles.

    - SYSTEM.DAT. Contains hardware-specific and computer-specific settings.


    By default, USER.DAT and SYSTEM.DAT are stored in the Windows home directory or
    the SYSTEM subdirectory, but these files can be located in physically different
    locations. For example, a typical set-up might be to store USER.DAT on a user''s
    network login directory and the SYSTEM.DAT on the hard disk. This will allow the
    user to see the same user interface no matter which machine the user is logged
    intonThe following shows the different DAT files (note that they are hidden by
    default):


    ```

    C:\WINDOWS>dir *.dat /a

    ```


    SYSTEM DAT 2,145,516 23/11/97 21:16 SYSTEM.DAT

    USER DAT 279,352 23/11/97 21:00 USER.DAT

    VIEWS DAT 3,582 22/06/97 15:48 VIEWS.DAT

    EXTEND DAT 27/07/97 17:03 extend.dat

    PIPEDLG DAT 79 10/08/97 14:10 PIPEDLG.DAT


    # 10.1.1 Recovering Registry data


    Each time Windows 95/98 successfully starts then the operating system backs up
    the Registry by copying the current SYSTEM.DAT and USER.DAT files to SYSTEM.DAO
    and USER.DAO, respectively. If Windows 95/98 fails to start then the user can
    copy the backed-up Registry from the last successful start-up to the current Registry.


    ```

    C:\WINDOWS>DIR *.DAO /S /A

    Directory of C:\WINDOWS

    ```


    USER DAO 279,352 23/11/97 13:18 USER.DAO

    SYSTEM DAO 2,145,516 23/11/97 13:18 SYSTEM.DAO'
  merge: -1
