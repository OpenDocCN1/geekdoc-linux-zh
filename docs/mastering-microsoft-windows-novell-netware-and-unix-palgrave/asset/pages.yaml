    # 4.8 Internet naming structure


    The Internet naming structure uses labels separated by periods; an example is
    eece.napier.ac.uk. It uses a hierarchical structure where organisations are grouped
    into primary domain names. These are com (for commercial organisations), edu (for
    educational organisations), gov (for government organisations), mil (for military
    organisations), net (Internet network support centers) and org (other organisations).
    The primary domain name may also define the country in which the host is located,
    such as uk (United Kingdom), fr (France) and so on. All hosts on the Internet
    must be registered to one of these primary domain names.


    The labels after the primary field describe the subnets within the network. For
    example in the address eece.napier.ac.uk'
