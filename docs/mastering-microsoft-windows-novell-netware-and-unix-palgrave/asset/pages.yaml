  md: '# Assigned Numbers


    This appendix contains information extracted from RFC1700 on assigned number values.


    # IP Special addresses


    The main forms of IP addresses are:


    ```

    IP-address ::= { <Network-number>, <Host-number> }

    and

    ```


    ```

    IP-address ::= { <Network-number>, <Subnet-number>, <Host-number> }

    ```


    Special addresses are:


    +   - {0, 0}: Host on this network. This address can only be used as a source
    address.

    - {0, <Host-number>}: Host on this network. Limited broadcast. This address can
    only be used as a destination address, and should not be forwarded outside the
    current subnet.

    - {-1, -1}: {Network-number, -1}: Directed broadcast to specified network. This
    address can only be used as a destination address.

    - {Network-number, <Subnet-number>, -1}: Directed broadcast to specified subnet.
    This address can only be used as a destination address.

    - {Network-number, -1, -1}: Directed broadcast to all subnets of subnetted network.
    This address can only be used as a destination address.

    - {127, <any>}: Internal host loopback address. This address should never appear
    outside a host.


    where -1 represents an address of all 1''s.


    # IP Versions


    | Decimal | Keyword | Version |

    | --- | --- | --- |

    | 1-3 | | Reserved Unassigned |

    | 4 | IP | Internet Protocol |

    | 5 | ST | ST Datagram Mode |

    | 6 | SIP | Simple Internet Protocol |

    | 7 | TP/IX | TP/IX: The Next Internet |

    | 8 | PIP | The P Internet Protocol |

    | 9 | | TUBA |

    | 10-14 | TUBA | Unassigned |

    | 15 | | Reserved |'
