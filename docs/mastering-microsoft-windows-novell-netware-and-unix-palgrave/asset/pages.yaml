  md: '# Ethernet


    # 3.1 Introduction


    Most of the computers in business now connect through a LAN and the most commonly
    used LAN is Ethernet. DEC, Intel and the Xerox Corporation initially developed
    Ethernet and the IEEE 802 committee has since defined standards for it, the most
    common of which are Ethernet 2.0 and IEEE 802.3. This chapter discusses Ethernet
    technology and the different types of Ethernet.


    In itself Ethernet cannot make a network and needs some other protocol such as
    TCP/IP to add nodes to communicate. Unfortunately, Ethernet in its standard form
    does not cope well with heavy traffic, but this is offset by the following:


    +   * Ethernet networks are easy to plan and cheap to install.

    * Ethernet network components, such as network cards and connectors, are cheap
    and well supported.

    * It is a well-proven technology, which is fairly robust and reliable.

    * It is simple to add and delete computers on the network.

    * It is supported by most software and hardware systems.


    A major problem with Ethernet is that, because computers cannot to get access
    to the network, there is no guarantee that they will get access within a given
    time. This contention also causes problems when two computers to communicate at
    the same time, they must both back off and no data can be transmitted. In its
    standard form Ethernet allows a bit rate of 10Mbps, but new standards for fast
    Ethernet minimise the problems of contention and also increase the bit rate to
    100 Mbps (or 1Gbps). Ethernet uses coaxial, fibre optic or twisted-pair cable.


    Ethernet uses a shared-media, bus-type network topology where all nodes share
    a common bus. These nodes must then contend for the access as only one node can
    communicate at a time. Data is then transmitted in frames which contain the MAC
    (media access control) source and destination addresses of the sending and receiving
    node, respectively. The local shared media is known as a segment. Each node monitors
    the segment and copies any frames addressed to it.


    Ethernet uses carrier sense, allocate monitor the bus (or Ether) to determine
    if it is busy. A node wishing to send data for an idle condition then transmits
    its message. Unfortunately, collisions can occur when two nodes transmit at the
    same time, nodes must monitor the carrier when they transmit. When a collision
    occurs, both nodes stop transmitting frames and transmit a jamming signal. This
    informs all nodes on the network that a collision has occurred. Each of the nodes
    involved in the collision'
  merge: -1
  pgno: 44
- img_proc: true
  md: 'waits a random period of time before attempting a re-transmission. As each
    node has a random delay time then there can be a prioritisation of the nodes on
    the network.


    Each node on the network may be able to detect collisions and be capable of transmitting
    and receiving simultaneously. These nodes either connect onto a common Ethernet
    connection or can connect to an Ethernet hub, as illustrated in Figure 3.1.

    Nodes thus contend for the network and are not guaranteed access to it. Collisions
    generally slow down the network.


    All computers have access to a common bus at the same time


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_45_0.png)


    Figure 3.1 Connections to an Ethernet network


    # 3.2 IEEE standards


    The IEEE are the main standards organisation for LANs and they refer to the standard
    for Ethernet as CSMA/CD. Figure 3.2 shows how the IEEE standards for CSMA/CD fit
    into the OSI model. The two layers of the IEEE standards correspond to the physical
    and data link layers of the OSI model. On Ethernet networks, most hardware complies
    with IEEE 802.3 standard. The MAC layer allows many nodes to share a single communication
    channel. It also adds the start and end frame delimiters, error detection bits,
    access control information, and source and destination addresses. Each frame has
    an error detection scheme known as cyclic redundancy check (CRC).'
