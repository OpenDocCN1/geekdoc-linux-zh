    If the peer-to-peer network has a local server, such as Novell NetWare or Windows
    NT, then access can be provided for certain users and/or groups, if they provide
    the correct password.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_35_0.png)


    # 2.3 Network topologies


    There are three basic topologies for LANs, which are shown in Figure 2.3, these
    are:'
