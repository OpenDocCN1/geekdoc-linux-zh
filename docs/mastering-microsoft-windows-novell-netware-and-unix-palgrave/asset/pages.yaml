  md: 'group, queue, profile or print server, which was created using the bindery
    services.


    **Organational unit.** This object represents the OU part of the NDS tree. These
    divide the NDS tree into subdivisions, workgroups, which can represent different
    geographical sites, different divisions or workgroups. Different divisions might
    be PRODUCTION, ACCOUNT, RESEARCH, and so on. Each Organisational Unit has its
    own login script.


    **Organational role.** This object represents a defined role within an organisation.
    It is thus easier to identify users who have an administrative role within the
    organisation.


    **Group.** This object represents a grouping of users. All users within a group
    inherit the same access rights.


    **Directory map.** This object points to a file system directory on a mounted
    volume. It is typically used to create a global file system which has physically
    separate parts.


    **Alias.** This identifies an object with another name. For example, a print queue
    which is called NET_PRINT1 might have an alias name of HP_LASER_JET_6.


    **Printer.** This can either be connected to the printer port of a PC, or connected
    to a NetWare server.


    **Print queue.** This object represents the queue of print jobs.


    **Profile.** This object defines a special scripting file. This can be a global
    login script, a location login script or a special login script.


    **Print server.** This object allows print jobs to be queued, waiting to be serviced
    by the associated printer.


    # 12.3 NDS tree


    Figure 12.2 shows the top levels of the NDS tree. These are:


    +   * **[ROOT].** This is the top level of the tree. The top of the NDS tree is
    the [ROOT] object.'
