  md: 'URL standard format is:


    <scheme>:<scheme-specific-part>


    and can be broken up into four parts. These are:


    aaaa://bbb.bbb.bbb/ccc/ccc?ddd


    where

    aaaa: the access method and specifies the mechanism to be used by the browser
    to communicate with the resource. The most popular mechanisms are:


    +   - http::: HyperText Transfer Protocol. This is the most commonly used mechanism
    and is typically used to retrieve an HTML file, a graphic file, a sound file,
    an animation sequence file, or a word processing file.


    +   - https::: HyperText Transfer Protocol. It is a variation of the standard
    access method and can be used to provide some level of transmission security.


    +   - file::: Local File Access. This causes the browser to load the specified
    file from the local disk.


    +   - ftp::: File Transport Protocol. This method allows files to be downloaded
    using an FTP connection.


    +   - mailto::: E-Mail Form. This method allows access to a destination e-mail
    address. Normally the browser generates an input form for entering the e-mail
    message.


    +   - news::: USENET News. This method defines the access method for a news group.


    +   - nntp::: Local Network Transport Protocol.


    +   - wais::: Wide Area Information Servers.


    +   - gopher::: GOPHER protocol.


    +   - telnet::: TELNET. The arguments following the access code are the arguments
    to the telnet session as user[:password]@host.


    +   - cid::: Content identifiers for MIME body part.


    +   - mid::: Message identifiers for electronic mail.


    +   - afs::: AFS File Access.


    +   - prospero::: Prospero.


    +   - x-exec::: Executable Program.


    ```

    //bbb.bbb.bbb is the Internet node on the Internet where the file is located.
    If a node is not given then the browser defaults to the computer which is running
    the browser. A colon may follow the node address and the port number (most browsers
