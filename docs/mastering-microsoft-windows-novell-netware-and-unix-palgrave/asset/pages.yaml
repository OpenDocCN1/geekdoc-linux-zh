  md: '# X-Windows


    # 15.1 Introduction


    An operating system allows user application programs to access the hardware of
    a computer. A user interface allows a user to access application programs in an
    easy-to-use way. In a text-based system the user enters text commands which are
    then interpreted by the operating system. Typical commands are to run application
    programs. copy files and so on. With a graphical interface, graphical objects
    (icons) represent application programs and options are selected using menus. Rather
    than entering commands from the keyboard a mouse pointer is normally used to select
    objects. This usage of Windows, Icons, Menus and Pointers (WIMPs) is typically
    known as a Graphical User Interface (GUI).


    The main graphical user interfaces are Microsoft Windows and X-Windows. Newer
    versions of these implement layers 5, 6 and 7 of the OSI model and use standard
    networking technologies, as Ethernet and networking protocols like TCP IP. Both
    are de facto standards for computer systems.


    X-Windows runs on most computer systems but is typically used on Unix workstations.
    It is a portable user interface and can be run programs remotely over a network.
    Massachusetts Institute of Technology (MIT) developed it and it has become de
    facto standard because of its manufacturer independence, its portability, its
    versatility and its ability to operate transparently across most network technologies.

    The main features of X-Windows are that:


    +   - It is network transparent. The output from a program can either be sent
    to the local graphics screen or to a remote node on the network. Application programs
    can output simultaneously to displays on the network, as illustrated in Figure
    15.1. The communication mechanism used is machine-independent and operating system
    independent.


    +   - Many different styles of user interface can be supported. The management
    of the user interface, as the placing, sizing and stacking of windows is not embedded
    in the system, but is controlled by an application program which can easily be
    changed.


    +   - Since X isn''t embedded into an operating system it can be easily transported
    to a wide range of computer systems.


    +   - Calls are made from application programs to the X-windows libraries which
    control WIMPs. The application thus does not have to create any of these functions.'
  merge: -1
  pgno: 295
- img_proc: true
  md: '# 15.2 Fundamentals of X


    There are three main parts of X software:


    +   * A ‘server’ to control the physical display and input devices.

    * ‘Client’ programs which request the server to perform particular operations
    on specified windows.

    * A ‘communications channel’ through which the client’s programs and the server
    talk to each other.


    This relationship is shown in Figure 15.2.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_296_0.png)


    Figure 15.2 Fundamental components of X


    # 15.2.1 Server


    The server is the software which creates windows and draws images and text within
    them. This is done in response to the client programs.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_296_1.png)


    Figure 15.1 X programs can display to remote and local machines'
  merge: -1
  pgno: 296
- img_proc: true
  md: '# 15.2.2 Client


    An application program makes use of the system''s window facilities. Application
    programs in X are called ''clients'' as they are customers of the server and ask
    the server to perform tasks on their behalf. A client may request the server to
    ''display the text "Input a value" in window USER1 or ''draw a rectangle in window
    TEMP''. This obviously reduces the burden on processing graphics on the client
    but increases the processing on the server.


    # 15.2.3 Communications channel


    Clients send requests to the server via the communications channel and vice versa.
    XWindows is transparent to the network technology and it supports different types
    of communications channel in the basic X-Windows library. All dependence of the
    types of communication is isolated to this library, and all communication between
    client and server is via this library (known as Xlib in the standard X implementation)
    as illustrated in Figure 15.3.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_297_0.png)


    There are two main modes of communications between the client and server, which
    are when:


    +   1. Server and client are running on the same computer. Here they can communicate
    using any method of inter-process communications (IPC) available on the machine.
    When running in this mode, X is effectively operating like many conventional window
    systems.

    2. Client is running on one machine, but the display (and its server) is on another.
    The client and server communicate across the network using a mutually agreed protocol,
    such as TCP/IP.


    X allows programs to communicate user information which is network transparent.
    This feature is useful in building multi-purpose networks of co-operating machines.

    As the server and client are completely separate then a computer can run the application
    programs and all that the client is required to do is to provide the keyboard,
    pointing device and graphics screen. This has led to a new type of display called
    an X'
  merge: -1
  pgno: 297
- img_proc: true
  md: 'terminal. An terminal is simply a stripped-down computer which is dedicated
    to running the X server and nothing else. It has a keyboard, mouse and screen
    and some way of communicating across the network. It does not have its own file
    system and cannot support general-purpose programs. Consequently, these programs
    have to be run elsewhere on the network.


    # ## 15.3 Network aspects of X


    The main advantages of the client/server relationship are:


    +   - That a client can use a powerful remote server. This server could be a supercomputer,
    have a special processor, enhanced floating-point accelerator, and so on. An example
    of several X terminals and a computer using powerful workstations is illustrated
    in Figure 15.4.

    - That if the server is a file server providing most of the disk resources to
    the local network then the disk network traffic is reduced as applications run
    remotely on the server particular applications which are highly disk-intensive
    such as large application programs. In this way the results from a program need
    to be reported over the network and intermediate data is not required to be sent
    over the network.

    - The remote server may have special software facilities available on it alone.
    With the growth of workstations, it is increasingly common to have some software
    licensed to only a few machines on the network and several clients run the software
    from these licensed machines. This may reduce the licence fee as only the servers
    need to be paid for.

    - It allows an enhanced user interface for remote logging into networked machines.

    - When a new computer is added which can run X clients, it can be immediately
    used by any device running X.

    - If a new display is added it can immediately make use of all the existing X
    client applications on any machine.

    - There is a requirement to output to several displays.


    The main disadvantage of X-Windows is that application programs become dependent
    on servers. If a server becomes overburdened or develops a fault it can seriously
    affect the performance of application programs. This problem is similar to network
    in star network where the network performance is dependent upon the central server.


    The more programs that run on the server then the more main memory it needs to
    cope with the loading. If it does not have enough memory then it can use a local
    disk to compensate. This will slow the performance of application programs.


    An X-based network must thus be planned so as to burden the server nodes. Typically,
    only two X terminals connect to a server. A well-planned network can normally
    cope with server faults by having several computers which can act as servers to
    X terminals, or remote computers.'
  merge: -1
  pgno: 298
- img_proc: true
  md: '![](img/da031d9e3a72792b55f2a8fb16c012a5_299_0.png)


    **Figure 15.4** Client and server on separate machines


    # # 15.4 History of X


    In 1984, MIT started the development of X. Their main objective was to create
    a good windows system for Unix machines. Many versions evolved from this and by
    1985 it was decided that X would be available to anyone who wanted it for a nominal
    cost.

    In 1985, version 10 was distributed to organisations outside MIT and by 1986 DEC
    produced the first X product. During that year it was clear that version 10 could
    not evolve to satisfy all the requirements that were being asked for. For this
    purpose MIT and DEC undertook a complete redesign of the protocol. The result
    was X, version 11, which has since become known as X.11.


    # # 15.5 X system programs


    Any program can use the X-Windows libraries. Several standard programs exist which
    comprise the basic system:


    +   - X is the display server. This software controls the keyboard, mouse and
    screen. It is the heart of X and creates and destroys windows. It writes text
    and draws objects within windows at the request of other ''client'' programs.
    The command xstart or xinit starts X.

    - xterm is the Terminal emulator. Many programs were not written specifically
    for'
  merge: -1
