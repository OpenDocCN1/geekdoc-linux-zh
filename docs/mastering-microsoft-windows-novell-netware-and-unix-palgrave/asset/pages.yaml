- img_proc: true
  md: '+   - C=Country. This object can be used, or not, to represent countries, typically
    where an organisation is distributed over two more countries. If it is used then
    it must be placed below the [ROOT] object. NDS normally does not use the Country
    object and uses the Organisation Unit to define the geographically located sites,
    such as SALES [ROOT], SALES [ROOT], and so on.

    - L-Locality. This object defines localities within other objects, and identifies
    network portions. The Country and Locality objects are included in the X.500 specification,
    but are not normally used, because many NetWare 4 utilities do not recognise it.
    When used, it must be placed below the [Root] object, Country object, Organisation
    object, or Operational Unit object.

    - LP=Licensed Product. This automatically created when a certificate is installed.
    When used, it must be placed below the [Root] object. Country object, Organisation
    object, or Operational Unit object.

    - O=Organisation. This object represents the name of the organisation. a company
    division or a department. Each NDS Directory tree has at least one Organisation
    object, and it must be placed below the [Root] object (unless the tree uses the
    Country or Locality object).

    - OU=Organisation Unit. This object normally represents the name of the organisational
    unit within the organisation, such as Production, Accounts, and so on. At this
    level, User objects can be added and a system level login script is created. It
    is normally placed below the Organisational object.


    The structure of the NDS should reflect the organisation of the company, for its
    organisational structure, its locations and the organisation of its networks.
    Normally there is only one Organisation object as this makes it easier to merge
    the NDS tree with other organisations. With every Organisation object, there are
    normally several Organisation Units.


    Apart from the container objects (C, O, OU, and so on) there are leaf objects.
    These are assigned a CN (for Common Name). They include:


    CN=AFP Server CN=Bindery CN=Bindery Queue

    CN=Computer CN=Directory Map CN=Group

    CN=Organational Role CN=Print Queue CN=Print Server

    CN=Printer CN=Profile CN=Server

    CN=User CN=Volume


    If possible, the NDS tree depth should have between four and eight levels. This
    makes management easier and allows resources to be easily accessed.'
