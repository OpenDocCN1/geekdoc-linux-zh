  md: '# Windows NT


    # 8.1 Introduction


    Microsoft Windows NT is an excellent network operating system. It has many benefits,
    such as:


    +   - **Multiple platform support.** Windows NT Version 4.0 runs on many types
    of systems, such as Intel 486/Pentium Pro/Pentium II-based PCs, DEC Alpha-based
    systems and PowerPC systems.

    - **Multitasking and multithreading.** Multitasking involves running several processes
    at a time. Multitasking programs split into a number of parts (threads) and each
    of these is running more than one thread on the multitasking system (multithreading).
    A program which is running more than at a time is known as a multithreaded program.

    - **Support for 16-bit, 32-bit and MS-DOS programs.** Windows NT has robust support
    for 16-bit and 32-bit applications, and gives some support for MS-DOS programs.
    Each MS-DOS program runs within its own virtual space, where it is allocated the
    resources it needs.

    - **Multiple file system support.** Windows NT supports FAT (Version 4.0 only
    supports 16-bit FAT, whereas Windows 95 and 98 support 32-bit VAT, or VFAT), HPFS
    (which is a UNIX-style file system) and NTFS (which is an enhanced file system
    that has built-in security).

    - **Enhanced reliability.** Windows NT only allows access to the hardware through
    system drivers. These are reliable, well-tested files which stop application programs
    from incorrect hardware operation.

    - **Built-in networking.** Windows NT supports many different types of networking
    technology. Client services include: Windows networks and Novell NetWare networks,
    network adapters (typically using standard interfaces such as ODI and NDIX) and
    network protocols (including TCP/IP and SPX/IPX).


    Windows NT Version 4.0 is available in two main forms:


    +   - **Workstation.** Typically used to run on a multitasking desktop computer.
    It is limited in the number of incoming sessions, but has most of the features
    of NT Server.

    - **Server.** Typically used to receive connections from many clients. The number
    of incoming sessions is only limited by the number of client licences. It has
    many server programs for user management and enhanced network services.


    The main differences between Windows NT Version 4.0 workstation and server are:'
  merge: -1
  pgno: 171
- img_proc: true
  md: '+   Number of inbound sessions. NT server incoming session is limited by the
    number of client licences, whereas NT workstation is limited to 10 incoming sessions.


    +   Server applications. NT Server runs server tasks, such as SQL Server, Systems
    Management Server, SNA Server and an Electronic Mail Server.


    Windows NT Version 5/2000 is available in three flavours. These are Workstation,
    Server and SMP Server (multiprocessor). It runs on Alphas, Intel x86, Intel IA32,
    Intel IA64 and AMD K7 (which is similar to an Alpha).


    # 8.2 Servers, workstations and clients


    Microsoft Windows NT is a 32-bit, pre-emptive, multitasking operating system.
    One of the major advantages it has over UNIX is that it can run PC-based software.
    A Windows NT network normally consists of a server and a number of clients. The
    server provides file and print servers as well as powerful networking applications,
    such as electronic mail applications, access to local and remote peripherals,
    and so on.


    The Windows NT client can either:


    +   Operate as a standalone operating system.


    +   Connect with a peer-to-peer connection.


    +   Connect to a Windows NT server.


    A peer-to-peer connection is when one computer logs into another computer. Windows
    NT provides unlimited outbound peer-to-peer connections and typically up to 10
    simultaneous inbound connections.


    # 8.3 Workgroups and domains


    Windows NT assigns users to workgroups, which are collection of users who are
    grouped together with a common purpose. This purpose might be to share resources
    such as file systems or printers, and each workgroup has its own unique name.
    Workgroups each Windows workstation interacts with a common group of computers
    on a peer-to-peer level. Each workstation manages its own resources and user accounts.
    Workgroups are useful for small groups where a small number of users require to
    access resources on other computers.


    A domain in Windows NT is a logical collection of computers sharing a common user
    accounts database and security policy. Thus each domain must have at least one
    Windows NT server.


    Windows NT is designed to operate with either workgroups or domains. Figure 8.1
    illustrates the difference between domains and workgroups. Domains have the advantages
    that:'
  merge: -1
  pgno: 172
- img_proc: true
  md: '+   - Each domain forms a single administrative unit with shared security and
    user account information. This domain has one database containing user and group-information
    and security policy settings.


    +   - They segment the resources of the network so that users, by default, can
    view all networks for a particular domain.


    +   - User accounts are automatically validated by the domain controller. This
    stops invalid users from gaining access to network resources.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_173_0.png)


    Figure 8.1 Workgroups and domains


    # 8.4 File systems


    Windows NT supports three different types of file system:


    +   - FAT (file allocation table) - as used by MS-DOS, OS/2 and Windows NT. A
    single volume can be up to 2 GB (now increased to 4GB). The maximum file size
    is 4GB. It has no built-in security but can be accessed through Windows 95/98,
    MS-DOS and Windows NT.


    +   - HPFS (high performance file system) - a UNIX-style file system which is
    used by OS/2 and Windows NT. A single volume can be up to 8 GB. MS-DOS applications
    cannot access this file.


    +   - NTFS (NT file system) as used by Windows NT. A single volume can be up to
    64 TB (based on current hardware, but theoretically, 16 exabytes). It has built-in
    security and also supports file compression/decompression. MS-DOS applications,
    themselves, cannot access the file system but they can run with Windows NT, nor
    for Windows 95/98.'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'The FAT file system is widely used and supported by a variety of operating
    systems, such as MS-DOS, Windows NT and OS/2. If a system is to use MS-DOS it
    must be installed with a FAT file system.


    # 8.4.1 FAT


    The standard MS-DOS FAT file and directory-naming structure allows an 8-character
    file name and a 3-character file extension with a dot separator (.) between them
    (the 8.3 file name). It is not case sensitive and the file name and extension
    cannot contain spaces and other reserved characters, such as:


    ```

    " / \: ; | = , ^ * ?"

    ```


    With Windows NT and Windows 95/98 the FAT file system can also contain long file
    names which can be up to 255 characters. The name can also contain multiple spaces
    and dot separators. File names are not case sensitive, but the case of file names
    is preserved (a file named FredDocument.XYZ will be displayed as FredDocument.XYZ
    but can be accessed with any of the characters in upper or lower case.


    Each file in the FAT table has four attributes (or properties): read-only, archive,
    system and hidden (shown in Figure 8.2). The FAT uses a linked list where the
    file''s directory entry contains its FAT entry number. This FAT entry in turn
    contains the location of the next cluster if the file is larger than one cluster,
    or a marker that designates this is included in the last cluster. A file which
    occupies 12 clusters will have 11 FAT entries and 10 FAT links.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_174_0.png)


    Figure 8.2 File attributes


    Windows NT 161'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# Table 8.1 File name conversions


    | Long name | Short file name |

    |--- |--- |

    | Program Files | PROGRA-1 |

    | Triangular.bmp | TRIANG-1.BMP |

    | Fredte-1.1 | FRED,TEXT |


    The main disadvantage of FAT is that the disk is segmented into allocated units
    (or clusters). On large-capacity disks these sectors can be relatively large (typically
    512 bytes/sector). Disks with a capacity of 256 MB and 512 MB use 16 sectors per
    cluster (8 KB) and disks from 512 MB to 1 GB use 32 sectors per cluster (16 KB).
    Drives up to 2 GB use 64 sectors per cluster (32 KB). Thus if the disk has a capacity
    of 512 MB then each cluster will be 8 KB. A file which is only 1 KB will take
    up 8 KB of disk space (a wastage of 7 KB), and a 9 KB file will take up 16 KB
    (a wastage of 7 KB). Thus a system which has many small files will be inefficient
    on a cluster-based system. A floppy disk needs one cluster per sector (512 bytes).


    Windows 95 and Windows NT support up to 255 characters in file names; unfortunately,
    MS-DOS and Windows 3.x applications cannot read them. To accommodate, every file
    has an augmented short file name (in the format XXXXXXX.YYY). Table 8.1 shows
    three examples. The conversion takes the first six characters of the name adds
    a -number to the name to give it a unique name. File names with the same initial
    six characters are identified with different numbers. For example, Program Files
    and Program Directory would be stored as PROGRA-1 and PROGRA-2, respectively.
    Sample listing 8.1 shows a listing from Windows. The left-hand column shows the
    short name and the right-hand column shows the long name.


    # Sample listing 8.1


    | EXAMPL-1 DOC | 4,608 | 05/11/96 | 23:36 | Example Document 1.doc |

    | EXAMPL-2 DOC | 4,608 | 05/11/96 | 23:36 | Example Document 2.doc |

    | EXAMPL-3 DOC | 4,608 | 05/11/96 | 23:36 | Example Document 3.doc |

    | EXAMPL-4 DOC | 4,608 | 05/11/96 | 23:36 | Example Document 4.doc |

