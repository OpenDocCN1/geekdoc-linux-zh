    # 4.6.4 Specifying subnet masks


    If a subnet is used then a bit mask, or subnet mask, must be specified to show
    which part of the address is the network part and which is the host.

    The subnet mask is a 32-bit number that has 1s for bit positions specifying the
    network and subnet parts and 0s for the host part. A text file called hosts is
    normally used to set up the subnet mask. Table 4.3 shows example subnet masks.


    | Address Type | Default mask |

