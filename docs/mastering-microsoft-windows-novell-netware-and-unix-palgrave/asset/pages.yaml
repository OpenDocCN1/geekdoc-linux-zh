    # 3.12.2 Manchester decoder


    Manchester coding has the advantage of embedding time (clock) information within
    the transmitted bits. A positively edged pulse (low -> high) represents a 1 and
    a negatively edged pulse (high -> low) a 0, as shown in Figure 3.17. Another advantage
    of this coding method is that the average voltage is always zero when used with
    equal positive and negative voltage levels.


    Figure 3.18 is an example of transmitted bits using Manchester encoding. The receiver
    passes the received Manchester-encoded bits through a low-pass filter. It extracts
    the lowest frequency in the received bit stream, i.e. the clock frequency. With'
