  md: 'Dynamic Host Configuration Protocol (DHCP) allows for the transmission of configuration
    information over a TCP/IP network. Microsoft implemented DHCP on their Windows
    NT operating system and many other vendors are incorporating it into the systems.
    It is based on the Bootstrap Protocol (BOOTP) and adds additional services, such
    as:


    +   - Automatic allocation of reusable IP network addresses.

    - Additional TCP/IP configuration options.


    It has two components:


    +   - A protocol for delivering host-specific configuration parameters from a
    DHCP server to a host.

    - A mechanism for allocation of network addresses to hosts.


    DHCP has been fully defined in the following RFCs:


    RFC1533. DCHP options and BOOTP vendor extensions.

    RFC1534. Interoperation between DHCP and BOOTP.

    RFC1541. DHCP.

    RFC1542. Clarifications and Extensions for BOOTP.

    RFC2131. DHCP.

    RFC2240. DHCP for Novell.


    DHCP uses a client-server architecture, where the designated DHCP server hosts
    (servers) allocate network addresses and deliver configuration parameters to dynamically
    configured hosts (clients).

    The three techniques that DHCP uses to assign IP addresses are:


    +   - **Automatic** allocation, DHCP assigns a permanent IP address to a client.

    - **Dynamic** allocation, DHCP assigns an IP address to a client for a limited
    period of time or when the client releases the address. It allows for automatic
    reuse of IP addresses that are not used by clients. It is typically used when
    there is a limited pool of IP addresses (which is less than the number of hosts)
    so that a host can only connect when it can get one of the IP addresses from the
    pool.

    - **Manual** allocation, DHCP is used to convey an IP address which has been assigned
    by the network administrator. This allows DHCP to eliminate assigning an IP address
    to a host through its operating system.


    Networks can use several of these techniques.


    DHCP messages are based on BOOTP messages, which allows DHCP to listen to a BOOTP
    relay agent and to allow integration of DHCP clients and DHCP servers. A BOOTP
    relay agent or relay agent is an Internet host or router that passes DHCP messages
    between DHCP clients and DHCP servers. DHCP uses the same relay behaviour as the
    BOOTP protocol specification. BOOTP relay agents are useful because they eliminate
    the need for having a DHCP server on each physical network segment.'
