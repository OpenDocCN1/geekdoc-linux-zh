    1000BASE-T (UTP). This is a useful standard for connecting directly to workstations.
    The 802.3ab Task Force has been assigned the task of defining the 1000BASE-T physical
    layer standard for Gigabit Ethernet over four pairs of Cat-5 UTP cable, for cable
