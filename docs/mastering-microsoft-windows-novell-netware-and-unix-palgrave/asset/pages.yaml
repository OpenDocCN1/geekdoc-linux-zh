    # # 13.3 On-line manual


    Unix provides an on-line manual to give information on all the UNIX commands.
    To get information `man command-name` is used, as such:


    ```

    man command-name

    ```


    Examples are `man ls`, `man cd`, and so on. Sample session 13.1 shows an example
    of the help manual for the `ls` command.


    # # 13.4 Changing directory


    The `pwd` command determines the present working directory, and the `cd` command
    changes the current working directory. When changing directory either the full
    pathname or the relative path is given. If a `/` precedes the directory name then
    it is a fullname, else it is a relative path. Some special character sequences
    are used to represent other directories, such as the directory above the current
    directory is specified by a double dot (..).


    *UNIX 245'
