  md: '# www


    # 16.1 Introduction


    The World-Wide Web (WWW) and the Internet have more jargon words and associated
    acronyms than anything else in modern life. Words, such as


    gopher, ftp, telnet, TCP/IP stack, intranets, Web servers, clients, browsers,
    hypertext, URLs, Internet access providers, dial-up connections, UseNet servers,
    firewalls


    have all become common in the business vocabulary.


    The WWW was initially conceived in 1989 by CERN, the European particle research
    laboratory in Geneva, Switzerland. Its main objective was:


    to use the hypermedia concept to support the interlinking of various types of
    information through the design and development of a series of concepts, communications
    protocols, and systems


    One of its main characteristics is that stored information tends to be distributed
    over a geographically wide area. The result of the project has been the world-wide
    acceptance of the protocols and specifications used. A major part of its success
    was due to the full support of the National Center for Supercomputing Applications
    (NCSA), which developed a family of user interface programs known collectively
    as Mosaic.


    The WWW, or Web, is basically an infrastructure of information. This information
    is stored on the WWW on Web servers and it uses the Internet to transmit data
    around the world. These servers run special programs that allow information to
    be transmitted to remote computers which are running a Web browser, as illustrated
    in Figure 16.1. The Internet is a common connection in which computers can communicate
    using a common addressing mechanism (IP) with a TCP/IP connection.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_301_0.png)


    Figure 16.1 Web servers and browsers'
  merge: -1
  pgno: 301
- img_proc: true
  md: 'The information is stored on Web servers and is accessed by means of pages.
    These pages can contain text and other multimedia applications such as graphic
    images, digitised sound files and video animation. There are several standard
    media files (with typical file extensions):


    +   - GIF or JPEG files for compressed images (GIF or JPG).

    - QuickTime movies for video (QT or MOV).

    - Postscript files (PS or EPS).

    - MS video (AVI).

    - Audio (AU, SND or WAV).

    - MPEG files for compressed video (MPG).

    - Compressed files (ZIP, Z or GZ).

    - JavaScript (JAV, JS or MOCHA).

    - Text files (TEX or TXT).


    Each page contains text known as hypertext, which has specially reserved keywords
    to represent the format and the display functions. A standard language known as
    HTML (Hypertext Markup Language) has been developed for this purpose.


    Hypertext pages, when interpreted by a browser program, display an easy-to-use
    interface formatted text, icons, pictorial hot spots, underscored words, and so
    on. Each page can also contain links to other related pages.


    The topology and power of the Web now allows for distributed information, where
    information does not have to be stored locally. To find information on the Web
    the user can use powerful search engines to search for related links. Figure 16.2
    shows an example of Web connections. The user initially accesses a page on a German
    Web server, which then contains a link to a Japanese server. This server contains
    links to UK and USA servers. This type of arrangement leads to the topology that
    resembles a spider''s web, which is linked from one place to another.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_302_0.png)


    **Figure 16.2** Example Web connections'
  merge: -1
  pgno: 302
- img_proc: true
  md: '# 16.2 Advantages and disadvantages of the WWW


    The WWW and the Internet tend to produce a polarisation of views. Thus, before
    analysing the WWW for its technical specification, a few words must be said on
    some of the subjective advantages and disadvantages of the WWW and the Internet.
    It should be noted that some of these disadvantages can be seen as advantages
    to some people, and vice versa. For example, freedom of information will be seen
    as an advantage to a freedom-of-speech group but often a disadvantage to security
    organisations. Table 16.1 outlines some of the advantages and disadvantages.


    Table 16.1 Advantages and disadvantages of the Internet and the WWW


    | Advantages | Disadvantages |

    |---|---||

    | Global information flow | Less control of information by the media, governments
    and large organisations | Lack of control on criminal material, such as certain
    types of pornography and terrorist activity |

    | Global transmission | Communication between people and organisations in different
    countries which should create the Global Village. | Data can easily lost or state
    secrets can be easily transmitted over the world. |

    | Internet connections | Many different types of connections are possible, such
    as dial-up facilities (perhaps over a modem or with ISDN) or frame relays. The
    user only has to pay for the service and the local connection. | Data once on
    the Internet is relatively easy to tap into and possibly easy to change. |

    | Global information | Creation of an ever-increasing global information database.
    | Data is relatively easy to tap into and possibly easy to change. |

    || integration | Tailor-made applications with good presentation tools. | Lack
    of editorial control leads to inferior material, which is hacked | |

    | Increasing WWW usage | Helps to improve its chances of acceptance into the home.
    | Increased traffic swamps the global information network and slows down commercial
    traffic. |

    | WWW links | Easy to set up and leads users from one place to the next in a logical
    manner. | WWW links offer fossilise where the link information is out-of-date
    or doesn''t even exist. |

    | Education | Increased usage of remote teaching with full multimedia education.
    | Increase in surface learning and lack of deep research. It may lead to an increase
    in time-wasting (too much surfing and too little learning). |'
  merge: -1
  pgno: 303
- img_proc: true
  md: '# 16.3 Client/server architecture


    The WWW is structured with clients and servers, where a client accesses services
    from the server. These servers can either be local or available through a global
    network connection. A local connection normally requires the connection over a
    local area network but a global connection normally requires connection to an
    Internet provider. These providers are often known as Internet access providers
    (IAPs), sometimes as Internet connectivity providers (ICP) or Internet Service
    Providers (ISPs). They provide the mechanism to access the Internet and have the
    required hardware and software to connect the user to the Internet. This access
    is typically provided through one of the following:


    +   - Connection to a client computer through a dial-up modem connection (typically
    at 28.8 kbps or 56 kbps).

    - Connection to a client computer through a dial-up ISDN connection (typically
    at 64 kbps or 128 kbps).

    - Connection of a client computer to a server computer which connects to the Internet
    through a frame relay router (typically 56 kbps or 256 kbps).

    - Connection of a client computer to a local area network which connects to the
    Internet through a T-1, 1.544 Mbps router.


    These connections are illustrated in Figure 16.3. A router automatically routes
    all traffic to and from the Internet whereas the dial-up facility of modem or
    ISDN link requires a connection to be made over a circuit-switched network (that
    is, through the public telephone network). Home users and small businesses typically
    use modem connections (although ISDN connections are becoming more common). Large
    corporations which require global Internet services tend to use frame routers.
    Note that an IAP may be a commercial organisation (such as ComputeServe or On-line)
    or a support organisation (such as giving direct connection to government departments
    or educational institutions). Such a commercial IAP organisation is likely to
    provide added services, such as electronic mail, search engines, and so on.


    An Internet Presence Provider (IPP) allows organisations to maintain a presence
    on the Internet without actually having to invest in the Internet hardware. The
    IPs typically maintain WWW pages for a given charge (they may also provide sales
    and support information).


    # 16.4 Web browsers


    Web browsers interpret spectral hypertext pages which consist of the hypertext
    markup language (HTML) and JavaScript. They then display it in the given format.
    There are currently four main Web browsers:


    +   - **Netscape Navigator** – Navigator is one of the most widely used WWW browsers'
  merge: -1
  pgno: 304
- img_proc: true
  md: 'and is available in many different versions on many systems. It runs on PCs
    (running Microsoft Windows), UNIX workstations and Macintosh computers. Figure
