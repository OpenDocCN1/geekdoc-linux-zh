  md: '# 8.8 System Policy Editor


    The Systems Policy Editor provides policies for the following:


    +   - **Account policy.** This policy defines the operation of the user password,
    such as minimum password size, number of acceptable bad passwords, whether there
    is a lock-out on the login, and so on.

    - **User Rights policy.** This policy manages the rights of groups and user accounts.
    These rights allow users to access certain resources within the domain. These
    event might be successful and/or unsuccessful events. The Event Viewer program
    can be used to view these events.

    - **Audit policy.** This policy tracks auditing security events.

    - **Trust Relationships.** Trust relationships create a link between Windows NT
    Server domains and allow users to be granted rights over other servers.


    # 8.8.1 Account policy


    This policy defines the operation of all user passwords, such as minimum password
    size, number of acceptable bad passwords, whether there is a lock-out on the login,
    and so on. Figure 8.9 shows a sample window. It can be seen that, in this case,
    passwords expire in 42 days. There is no limit in the minimum time for a password
    change. Figure 8.9 also shows that blank passwords are accepted and that there
    is no account lockout on a bad password entry. It can be seen that the number
    of acceptable bad passwords can also be set. This lockout can be reset after a
    number of minutes, if required.


    # 8.8.2 User rights


    The user policy manages the rights of groups and user accounts. These rights allow
    users to access certain resources within the domain. Normally these rights are
    granted to groups rather than to individual user accounts, as it is easier to
    administer. Figure 8.10 shows an example.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_181_0.png)'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Account Policy


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_182_0.png)


    Figure 8.9 Account policy window


    The rights include (with typical user groups):


    +   - Access this computer from network (Administrator, Everyone, Power Users).

    - Backup files and directories (Administrator, Backup Operators)

    - Change system time (Administrator, Power Users).

    - Force shutdown from a remote computer (Administrator, Power Users).

    - Load and unload device drivers (Administrator).

    - Log on locally (Administrators, Backup Operators, Guests, Power Users, Users).

    - Managing audits and security log (Administrator).

    - Restore files and directories (Administrator, Backup Operators).

    - Shut down the system (Administrators, Backup Operators, Power Users, Users).

    - Take ownership of files or other objects (Administrator).


    Initially the administrator selects the right and chooses to Add... or Remove
    the group or user from the right.


    # 8.8.3 Audit


    This policy tracks auditing security events. These might be successful and/or
    unsuccessful events. The Event Viewer program can be used to view these events.
    Figure 8.11 shows an example of an audit policy window. In this case, all successful
    and unsuccessful logins and logoffs will be logged. In addition, successful file
    and object accesses will be logged.'
