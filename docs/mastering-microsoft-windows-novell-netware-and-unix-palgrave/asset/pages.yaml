  md: '# 5.7 Opening and closing a connection


    Figure 5.7 shows a basic three-way handshake. The steps are:


    +   1. The initial state on the initiator is CLOSED and, on the recipient, it
    is LISTEN (the recipient is waiting for a connection).

    2. The initiator goes into SYN-SENT state and sends a packet with the SYN bit
    and then indicates that the starting sequence number will be 999 (the current
    sequence number, thus the next number sent will be 1000). When this is received
    the recipient goes into the SYN-RECEIVED state.

    3. The recipient sends back a TCP packet with the SYN and ACK bits (which identifies
    that it is a SYN packet and also that it is acknowledging the previous SYN packet).
    In this case, the recipient tells the originator that it will starting at a sequence
    number of 100. The acknowledgement number is 1000, which is the sequence number
    that the recipient expects to receive next. When this is received, the originator
    goes into the ESTABLISHED state.

    4. The originator sends back a TCP packet with the SYN and ACK bits set and the
    acknowledgement number is 101, which is the sequence number it expects to see
    next.

    5. The originator transmits data with the sequence number of 1000.


    | Originator | Recipient |

    | :--- | :--- |

    | 1. CLOSED | LISTEN |

    | 2. SYN-SENT → SEQ=999<CTL=SYN | SYN-RECEIVED |

    | 3. ESTABLISHED → SEQ=100<ACK=100> ← | SYN-RECEIVED |

    | 4. ESTABLISHED → SEQ=1000<ACK=101> <CTL=ACK | ESTABLISHED |

    | 5. ESTABLISHED → SEQ=1000<ACK=101> <CTL=ACK>DATA | ESTABLISHED |


    Figure 5.7 TCP connection


    Note that the acknowledgement number acknowledges every sequence number up but
    not including the acknowledgement number.


    Figure 5.8 shows how the three-way handshake prevents duplicate connection initiations
    from causing confusion. In state 3, a duplicate SYN has been received. The recipient
    sends back an acknowledgement for this (4), but when this is received by the originator,
    the originator sends back a RST (reset) packet. This causes the recipient to go
    back into a LISTEN state. It then receive the SYN packet in 2, and after acknowledging
    it, a connection is made.


    TCP connections are half-open if one of the TCPs has closed or aborted, and the
    other is still connected. They can also occur if the two connections become desynchronized
    because of a system crash. This connection is automatically reset if data is sent
    in either direction. This is because the sequence numbers will be incorrect, otherwise
    the connection will time-out.


    A connection is normally closed with the CLOSE call. A host who has closed-not
    continue to send, but can continue to RECEIVE until it is close by the other side.
    Figure 5.9 shows a typical sequence for closing a connection. Normally the application
    program sends a CLOSE call for the given connection. Next, a TCP packet is sent
    with the FIN bit set, the originator enters into FIN-WAIT-1 state. When the


