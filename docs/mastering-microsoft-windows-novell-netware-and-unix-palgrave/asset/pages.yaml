    # 5.8.2 Windows Sockets


    The main WinSock API calls are:


    +   socket(). Creates a connection on a socket.

    accept(). Accepts a connection to a socket.

    connect(). Establishes a connection to a peer.

    bind(). Associates a local address with a socket.

    listen(). Establishes a socket to listen for incoming connection.

    send(). Sends data on a connected socket.

    sendto(). Sends data on an unconnected socket.

    recv(). Receives data from a connected socket.

    recvfrom(). Receives data from an unconnected socket.

    shutdown(). Disables or receive operations on a socket.

    closesocket(). Creates a socket.


    Figure 5.10 shows the operation of a connection of a client to a server. The server
    is defined as the computer which waits for a connection, the client is the computer
    which initially makes contact with the server.


    On the server the computer initially creates a socket with the socket() function,
    and this is bound to the bind() function. After this, the server listens for a
    connection with the listen() function. When the client calls the connect() function
    the server then accepts the connection with accept(). After this the server and
    client can send and receive data with the send() and recv() functions. When the
    data transfer completes closesocket() is used to close the socket.


    socket()


    The socket() function creates a socket. Its syntax is:


    ```

    SOCKET socket ( int af, int type, int protocol)

    ```


    where


    +   af A value of PF_INET specifies the ARPA Internet address specification (others
    include AF_IPX for SPX/IPX and AF_APPLETALK for AppleTalk).


    +   type Socket specification, which is typically either SOCK_STREAM or SOCK_DGRAM.
    The SOCK_STREAM uses TCP and provides a sequenced, reliable, two-way, connection-based
    stream. SOCK_DGRAM uses UDP and provides for connectionless datagrams. This type
    of connection is not recommended. A third type is SOCK_RAW, for types other than
    UDP or TCP, such as ICMP.


    +   protocol Defines the protocol to be used with the socket. If it is zero then
    the caller does not wish to specify a protocol.'
