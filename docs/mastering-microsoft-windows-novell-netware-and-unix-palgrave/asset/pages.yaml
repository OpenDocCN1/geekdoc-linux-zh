    # 7.3 Device drivers


    In Windows 3.x, device drivers were complex entities and were, in part, static
    and unchanging. Windows 95/98/NT now provide enhanced support for hardware devices
    and peripherals including disk devices. Windows NT will be discussed in Section
    7.10. Windows 95/98 uses a universal driver/mini-driver architecture that makes
    writing device-specific code much easier.


    The universal driver provides for most of the code for a specific class of device
    (such as for printers or mice) and the mini-driver is a relatively small and simple
    driver that provides for the additional information for the hardware.


    The actual system interface to the hardware (or some software parts) is through
    a virtual device driver (VxD), which is a 32-bit, protected-mode driver. These
    keep track of the state of the device for each application and ensure that the
    device is in the correct state whenever an application continues. This allows
    for multitasking programming and also for multi-access for a single device. VxD
    files also support hardware'
