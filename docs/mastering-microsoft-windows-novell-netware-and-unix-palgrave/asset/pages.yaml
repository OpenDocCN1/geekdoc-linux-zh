    This allows the receiver to keep track of the data segments received. Any segments
    that are missing can be easily identified. The sequence of the first data byte
    in this segment (except when SYN is present). If SYN is present the sequence number
    is the initial sequence number (ISN) and the first data octet is ISN+1.

