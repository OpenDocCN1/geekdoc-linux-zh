    SEG.SEQ+SEG.LEN-1 Last sequence number of a segment.


    On receiving data, the following TCP parameters are required:


    RCV.NXT Next sequence number expected on an incoming segment, and is the left
    or lower edge of the receive window.


    RCV.NXT+RCV.WND-1 Last sequence number expected on an incoming segment, and is
    the right or upper edge of the receive window.


    SEG.SEQ First sequence number occupied by the incoming segment.


    SEG.SEQ+SEG.LEN-1 Last sequence number occupied by the incoming segment.


    # 5.6.2 ISN selection


    The Initial Sequence Number (ISN) is selected so that previous sockets are not
    confused with new sockets. Typically, this can happen when a host application
    crashes and quickly re-establishes the connection before the other side can time
    out the connection. To avoid this a 32-bit ISN generator is created when the connection
    is made. Number is generated by a 32-bit clock, which is incremented approximately
    every 4µs (giving an ISN cycle of 4.55 hours). Thus, within 4.5 hours, each ISN
    will be unique.


    As each connection has a send and receive sequence number, these are an initial
    sequence number (ISS) and an initial receive number (IRS). When establishing a
    connection, the two TCPs synchronize their initial sequence numbers. This is done
    by exchanging connection establishment packets, with the SYN bit set and with
    the initial sequence numbers (these packets are typically called SYNs). Thus four
    packets must be initially established:


    +   * A sends to B. SYN with $A_{SEQ}$.

    * B sends to A. ACK of the sequence number ($A_{SEQ}$).

    * B sends to A. SYN with $B_{SEQ}$.

    * A sends to B. ACK of the sequence number ($B_{SEQ}$).


    Note that the two intermediate steps can be combined into a single message. This
    is sometimes knows as a three-way handshake. This handshake is necessary as the
    sequence numbers are not tied to a global clock, only to local clocks, and has
    many disadvantages, the fact that old packets will be discarded as they occurred
    in a previous time.


    To make sure that a sequence number is not duplicated, a host must wait for a
    maximum segment lifetime (MSL) before starting to retransmit packets (segments)
    after start-up or when recovering from a crash. An example MSL is 2 minutes. However,
    if it is recovering, and has a memory of the previous sequence numbers, it may
    not need to wait for the MSL, as it can use sequence numbers which are much greater
    than the previously used sequence numbers.


    TCP and TCP/IP commands 103'
