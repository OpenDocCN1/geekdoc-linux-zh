    * Giaddr. Relay agent IP address and is used in booting through a relay agent.
    4 bytes.

    * Chaddr. Clients MAC address. 16 bytes.

    * Sname. Optional null-terminated server host name string. 64 bytes.

    * File. Boot null-terminated file name string. 128 bytes.

    * Options. Optional parameters field. Variable number of bytes.'
