    # IANA Ethernet address block


    The Internet Assigning Numbers Authority (IANA) owns the starting Ethernet address
    of:


    0000 0000 0000 0111 1010 (which is 00-00-5E)


    This address can be used with the multicast to create an Internet Multicast. It
    has the form:


    | 1000 0000 0000 0111 1010 xxxx xxxx xxxx xxxx |

    | | | |

    | Multicast Bit | | 0 - Internet Multicast |

    | | | 1 - Assigned by IANA for other uses |


    This gives an address range from 00-01-5E-00-00-00 to 00-01-5E-FF-FF-FF.


    # D.1.2 Ethernet vendor address


    An Ethernet address is 48 bits. The first 24 bits identify the manufacturer and
    the next 24 bits identify the serial number. The manufacturer codes include:


    | 0000C Cisco | 00007 MIPS |

