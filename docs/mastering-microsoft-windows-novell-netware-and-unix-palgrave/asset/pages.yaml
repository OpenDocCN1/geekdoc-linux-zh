  md: '# 19.3.2 class java.net.URL


    The URL (Uniform Resource Locator) class is used to reference to an object on
    the World Wide Web. The main constructors are:


    +   - public URL(String protocol, String host, int port, String file) Creates
    an absolute URL from the specified protocol (protocol), host (host), port (port)
    and file (file)

    - public URL(String protocol, String host, String file) Creates an absolute URL
    from the specified protocol (protocol), host (host) and file (file)

    - public URL(String spec) Creates a URL from an unparsed absolute URL (spec)

    - public URL(URL context, String spec) Creates a URL from an unparsed absolute
    URL (spec) in the specified context.


    The methods are:


    +   - public int getPort() Returns a port number. -1 indicates that the port is
    not set

    - public String getProtocol() Returns the protocol name.

    - public String getHost() Returns the host name.

    - public String getFile() Returns the file name.

    - public boolean equals(Object obj) Compares two URLs, where obj is the URL to
    compare against.

    - public String toString() Converts to a string format.

    - public String toExternalForm() Reverses the URL parsing.

    - public URL openConnection() Creates a URLConnection object that connects to
    the remote object referred to by the URL.

    - public final InputStream openStream() Opens an input stream.


