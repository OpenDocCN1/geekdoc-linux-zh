  md: "each character delimited by a start and a stop bit. With asynchronous communications\
    \ the transmitter and receiver only have to be roughly synchronised. \n\n# ATM\
    \ (Asynchronous Transfer Mode)\n\nNetworking technology which involves sending\
    \ 53-byte fast packets (ATM cell), as specified by the ANSI T1SI subcommittee.\
    \ The first 5 bytes are the header and the remaining bytes are the information\
    \ field which can hold 48 bytes of data. Optionally the data can contain a 4-byte\
    \ ATM adaptation layer and 44 bytes of actual data. The ATM adaptation layer field\
    \ allows for fragmentation and reassembly of cells into packets at the source\
    \ and destination respectively. The control field also contains bits which specify\
    \ whether this is a flow control cell or an ordinary cell, a bit to indicate whether\
    \ this packet can be deleted in a congested network, and so on.\n\n# AUI\n\nConnection\
    \ between the network adapter and an external transceiver.\n\n# Automatic broadcast\
    \ control\n\nTechnique which minimises broadcast and multicast flooding through\
    \ a switch. A switch acts as a proxy server and screens previously resolved ARP.\
    \ This eliminates broadcasts associated with them.\n\n# Autonegotiation\n\nTechnique\
    \ used by a IEEE 802.3u node which determines whether a device is receiving or\
    \ transmitting data in one of a number of Ethernet nodes (100Base-TX, 100Base-TX\
    \ Full Duplex, 10Base-T-10Base-T Full Duplex or 100Base-T4). When the mode is\
    \ learned, the device then adjusts to this transmission mode.\n\n# Autosensing\n\
    \nUsed a 100Base-TX to determine if the incoming data is transmitted at 100Mbps\
    \ or 100Mbps.\n\n# Back pressure\n\nTechnique which slows the incoming data rate\
    \ into the buffer of a 802.3 port preventing it from receiving too much data.\
    \ Switches which implement back pressure will transmit a jam signal to stop data\
    \ input.\n\n# Backbone network\n\nThe portion of a communications facility that\
    \ connects primary communications path that serves multiple users at jumping-off\
    \ points.\n\n# Bandwidth\n\nIn an analogue system it is defined as the range of\
    \ frequencies contained in a signal. As an approximation it is the difference\
    \ between the highest and lowest frequency in the signal. In a digital transmission\
    \ system it is normally quoted as bits per second.\n\n# Bandwidth allocation control\
    \ protocol (BACP)\n\nProtocol which monitors network traffic and allows or disallows\
    \ access to users, depending on their needs. It is awaiting approval by the IETF.\n\
    \n# Baseband\n\nData transmission using unmodulated signals.\n\n# Basic rate interface\
    \ (BRI)\n\nConnection between ISDN and the user. It has three separate channels,\
    \ one D-channel (which carries control information) and two B channels (which\
    \ carry data)."
