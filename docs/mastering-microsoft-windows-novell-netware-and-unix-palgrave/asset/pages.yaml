  md: '# 6.6.3 Name registration


    The WINS server stores a WINS database, which maps IP addresses to NetBIOS names.
    The operation is as follows:


    +   1. **Startup.** The WINS client sends a Name Registration Request in a UDP
    packet to the WINS server to register its NetBIOS name and IP address. When the
    WINS server receives it then it checks its stored database to make sure that the
    requested name is not already in use on the network.


    +   2. **Unsuccessful registration.** When a client tries to register a name that
    is in use the server sends the Denial message. The user of the client will then
    be informed that the client''s name is already in use on that network.


    +   3. **Successful registration.** On successful name registration, the server
    sends a Name Registration Acknowledgement to the client. It fills the Time-to-Live
    (TTL) field to define the amount of time that the name registration will be active,
    after this time the server will cancel.


    +   4. **Initially re-registering name.** The WINS client must send a Refresh
    Request after a given interval so that its name will not appear. The first request
    is made after one-eighth of the TTL time, and if unsuccessful after periods of
    one-eighth of the TTL time. If it has not been able to contact the primary WINS
    server after half the time defined in the TTL field, then the client tries to
    contact the secondary WINS server (if there is one).


    +   5. **Re-registering a name.** After the first registration, the following
    registration will be made 50 percent of the TTL time (instead of one-eighth of
    the time).


    +   6. **Client shutdown.** When a WINS client shuts down, it sends a Name Release
    Request to the WINS server, releasing its name from the WINS database.


    # 6.6.4 Name resolution


    A client that requires the resolution of a NetBIOS name to an IP will go through
    the following:


    +   1. Checks the name is actually the local computer; then looks in its own name
    resolution cache for a match.


    +   2. Sends a request for a directed name lookup from the WINS server. If it
    finds one WINS server sends its IP address to the client.


    +   3. If the WINS server does not find a match then the client broadcasts to
    the network for help.


    +   4. If there is no response from a broadcast the client looks into its local
    LMHOSTS file, else it will look in its local HOSTS file.


    # 6.6.5 WINS proxy agents


    Many older Windows systems do not support WINS clients. To allow them to communicate
    with a WINS server a WINS proxy agent can be used. This agent listens to the network
    for broadcasting for NetBIOS names resolution. The WINS proxy agent then redirects
    them to the WINS server, which will then pass the IP address to the proxy agent,
    which will then pass it on to the client.'
