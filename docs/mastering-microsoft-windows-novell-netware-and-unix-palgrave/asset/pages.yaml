    Windows NT/2000 and 95/98 provide excellent network support as they can communicate
    directly with many different types of networks, protocols and computer architectures.
    They can create networks to make peer-to-peer connections and all connections
    for servers to access file systems and print servers.


    Windows NT/2000 Server have more security in running programs Windows 95/98 as
    programs and data are insulated from the operation of other programs. The operating
