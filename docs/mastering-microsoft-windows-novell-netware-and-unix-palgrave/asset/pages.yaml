  md: '# 14.3.3 NIS commands


    NIS commands allow the maintenance of network information. The main commands are
    as follows:


    +   - domainname which displays the current NIS domain name.

    - ypcat which lists the specified NIS map contents.

    - ypinit which, on a master server, builds a map using the networking files in
    /etc. On a slave server the map is built using the master server.

    - ypmake which is a script that builds standard NIS maps from files such as /etc/passwd,
    /etc/groups, and so on.

    - ypmatch which prints the specified NIS map data (values) associated with one
    or more keys.

    - ypppasswd which can be used to change (or install) a user''s password in the
    NIS password map.

    - ypwhich which is used to print the host name of the NIS server supplying NIS
    services to an NIS client.

    - ypxfr which transfers the NIS map from one slave server to another.


    For example the command:


    ```

    ypcat group.byname

    ```


    lists the group name, the group ID and the members of the group. Here is an example
    of changing a user''s password for the NIS domain. In this case, the user bill_b
    changes the network-wide password on the master server pollute.


    ```

    % ypasswd

    Changing NIS password for bill...

    Old NIS password: ***********

    New password: ***********

    Retype new password: ***********

    The NIS passwd has been changed on pollute, the master NIS passwd server.

    ```


    The next example uses the ypcat program.


    ```

    % ypcat group

    students::200:msc01,msc02,msc03,msc04

    nogroup:-*:2

    daemon:5:root, daemon

    users::20:root,msc08

    other:1:root,hpdb

    root::0

    ```


    The next example shows the ypmake command file which rebuilds the NIS database.


