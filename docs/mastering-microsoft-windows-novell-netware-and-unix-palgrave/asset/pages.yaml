    ![](img/da031d9e3a72792b55f2a8fb16c012a5_154_0.png)


    **Figure 7.4** Configuration Manager and example of devices


    The operation is as follows:


    +   1. The Configuration Manager communicates with each of the bus enumerators
    and asks them to identify all the devices on the buses and their respective resource
    requirements. A bus enumerator is a driver that is responsible for creating a
    hardware tree, which is a hierarchical representation of all the buses and devices
    on a computer. Figure 7.5 shows an example tree.


    +   2. The bus enumerator locates and gathers information from either the device
    drivers or the BIOS services for that particular device type. For example, the
    CD-ROM bus enumerator calls the CD-ROM drivers to gather information.


    +   3. Each of the drivers is loaded and they wait for the Configuration Manager
    to assign their specific resources (such as IRQs, I/O addresses, and so on).


    +   4. The Configuration Manager calls resource arbitators to allocate resources
    for each device.


    +   5. Resource arbitrators identify any devices which are conflicting and try
    to resolve them.


    +   6. The Configuration Manager informs all device drivers of their device configuration.
    This process is repeated when the BIOS or one of the other bus enumerators informs
    the Configuration Manager about a system configuration change.


