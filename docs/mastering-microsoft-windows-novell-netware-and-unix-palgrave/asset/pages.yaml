  md: '# NDS and NetWare 4/5


    # 12.1 Introduction


    The main disadvantages of NetWare 3.x are:


    +   - It uses SPX/IPX which is incompatible with TCP/IP traffic.

    - It is difficult to synchronise servers with user information.

    - The file structure is local to individual servers.

    - Server architecture is flat and not organised into a hierarchical structure.


    These were addressed with NetWare 4.1, in which the bindery was replaced by Novell
    Directory Services (NDS). NDS is a combination of features from OSI X.500 and
    Banyan TreeTalk. Its main characteristics are:


    +   - Hierarchical server structure.

    - Network-wide users and groups.

    - Global objects. NDS integrates users, groups, printers, servers, volumes and
    other physical resources into a hierarchical tree structure.

    - System-wide login with a single password. This allows users to access resources
    which are connected to remote servers.

    - NDS processes logins between NetWare 3.1 and NetWare 4.1 servers, if the login
    names and passwords are the same.

    - Supports distributed file system.

    - Synchronisation services. NDS allows for directory synchronisation, which allows
    directories to be mirrored on different partitions or different servers. This
    provides increased reliability in that if a server develops a fault then the files
    on that server can be replicated by another server.

    - Standardised organisational structure for applications, printers, and services.
    This provides a common structure across different organisations.

    - It integrates most of the administrative tasks in Windows-based NWADMIN.EXE
    program.

    - It is a truly distributed system where the directory information can be distributed
    around the tree.

    - Unlimited number of licences per server. NetWare 3.1 limits the number of licences
    to 250 per server.

    - Support for NFS server for UNIX resources.

    - Multiple login scripts, as opposed to system and user login scripts in NetWare
    3.1.

    - Windows NT support.'
  merge: -1
  pgno: 239
- img_proc: true
  md: 'NDS is basically a common, distributed Directory database of logical and physical
    resources into a single system. Many applications have used Directory databases,
    such as electronic mail and network management. NDS servers within a network access
    the Directory database for the resources connected and how they are accessed.
    Thus application programs do not need to know the physical location and on which
    server it is connected, only its logical name.


    The main reason to upgrade NDS is that it better reflects the organisational structure
    of networked equipment within the organisation. NetWare 3.1 is a server-based
    approach where resources are grouped around servers. This leads to increased maintenance
    around these servers, thus updates to one server may be updated on other servers.
    NDS allows for a central administration with a structure that reflects organisational
    structures.


    # 12.2 NetWare directory services (NDS)


    One of the major changes between NetWare 3.x and NetWare 4.1 is NDS. A major drawback
    of the NetWare 3.x bindery files is that they are independently maintained on
    each server. NDS addresses this by setting up a logical database, which contains
    information on all network-attached resources. It is logically a single database,
    but may be physically located on different servers over the network. As the database
    is global to the network, a user can log into all authorised network-attached
    resources, rather than requiring to log into each separate server. Thus, administration
    is focused on the single database.


    As with NetWare 3.x bindery services, NDS organises network resources by objects,
    properties, and values. NDS differs from the bindery services in that it defines
    two types of objects:


    +   - Leaf objects – which are network resources such as disk volumes, printer
    queues, and so on.

    - Container objects – which are cascable organisation units that contain leaf
    objects. A typical organisational unit might be a company, department or group.


    NDS organises networked resources in a hierarchical or tree structure (most organisations
    are structured in this way). The top of the tree is the root object, to which
    there is only a single root for an entire NDS database. Servers then use objects
    to connect to branches coming off the root object. This structure is similar to
    the organisation of a directory file structure and can be used to represent the
    hierarchical structure of organisation. Figure 12.2 illustrates a sample NDS database
    with root, container and leaf objects. In this case, the organisation splits into
    four main containers: Electoral, Mechanical, Production and Administration. Each
    of these containers has associated leaf objects, such as disk volumes, printer
    queues, and so on. This is a similar approach to Workgroups in Microsoft Windows.


    To improve fault tolerance, NDS allows branches (or partitions) to be stored on
    multiple file servers. These mirrors are then synchronised to keep them up to
    date. Another advantage of replicating partitions is that local copies of files
    can be stored so that network traffic is reduced.'
  merge: -1
