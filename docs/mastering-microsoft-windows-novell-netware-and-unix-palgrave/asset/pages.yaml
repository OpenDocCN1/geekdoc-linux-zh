  md: '# 10.2 Windows 95/98 and the Registry


    The program REGEDIT.EXE allows a user to view and edit the contents of the local
    Registry on a networked computer.

    When Windows 95/98 starts, the operating system stores and checks the configuration
    information in the Registry for most configuration settings. Windows 95/98 and
    applications use the Register when:


    +   * Running Windows 95/98 Set-up. This includes adding new hardware or setting
    up an application program.

    * Installing/re-installing Windows 95/98. Information from INI files is added
    to the Registry.

    * Adding/removing a Plug-and-Play-compliant device. Each time you add or remove
    a Plug-and-Play-compliant device on a computer running Windows 95/98, configuration
    data is added to the Registry.

    * Using device driver communications. Device drivers send and receive parameters
    and configuration data from the Registry.

    * Making changes to system policies, user profiles and administrative tools.


    10.2.1 Registry structure

    The Registry Editor displays the contents of the Registry database in six subtrees.
    These six subtrees are HKEY_CLASSES ROOT, HKEY_CURRENT_USER, HKEY_LOCAL_MACHINE,
    HKEY_USERS, HKEY_CURRENT_CONFIG and HKEY_DIN_DATA, as shown in Figure 10.1.

    In the Registry, each individual key can contain data items called value entries
    and can also contain additional subkeys. Keys are roughly equivalent to directories
    and value entries equivalent to files. Each of the root key names begins with
    ''HKEY_'' which is a unique identifier, called a handle, which can be used by
    a program to access resources.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_214_0.png)


    10.2.2 Value entries

    The Registry Editor has two window panes. On the right pane is associated and
    the left pane is used to select the key. Each value entry has three parts: a data
    type (which appears as an icon), a name and the value. The different data types
    are:


    Figure 10.1 Registry Editor example screen'
