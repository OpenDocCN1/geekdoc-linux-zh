    # 16.7 Universal resource identifier


    The universal resource (URI) is defined as a generically designated string of
    characters which refers to objects on the WWW. A URL is an example of a URI, with
    a designated access protocol and a specific Internet address.


    Specifications have still to be completed, but URIs basically be used to define
    the syntax for encoding arbitrary naming or addressing schemes. This should decouple
    the name of a resource from its location and also from its access method. For
    example, the file:


    ```

    MYPIC.HTM

    ```


    would be automatically associated with the HTTP protocol.


