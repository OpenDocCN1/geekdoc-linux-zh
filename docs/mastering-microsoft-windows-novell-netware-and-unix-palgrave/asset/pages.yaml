    # 13.6 File attributes


    UNIX provides system security by assigning file and directory with a set of attributes.
    These give the privileges on the file usage and the `ls -l` command displays their
    settings. In the case of `[14]` in Sample session 13.4, the user uses `ls -l`
    to get extended information, such as:


    +   * File attributes.

    * Owner of the files. Person (user ID) who owns the file.

    * Group information. The group name defines the name of the group to which the
    owner belongs.

    * Size of file. The size of the file in bytes.

    * Date and time created or modified. This gives the date and the time the file
    was last modified. If it was modified in a different year then the year and date
    are given, but no time information is given.

    * Filename.


    Figure 13.3 defines the format of the extended file listing. The file attributes
    contain the letters `r`, `w`, `x` which denote read, write and executable. If
    the attribute exists then'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'the associated letter placed at a fixed position, else a – appears. The definition
    of these attributes are as follows:


    +   - Read (r). File can be copied, viewed, and so on, but it cannot be modified.

    - Write (w). File can be copied, viewed and changed, if required.

    - Executable (x). File can be executed.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_262_0.png)


    Figure 13.3 Extended file listing


    The file attributes split into four main sections. The first position identifies
    if it is a directory or a file. A d character identifies a directory, else it
    is a file. Positions 2–4 are the owner attributes, positions 5–7 are the group’s
    attributes and positions 8–10 are the rest of the world’s attributes. The attributes
    are:


    | Owner | Group | Public |

    | r w x | r w x | r w x |


    The owner is the person who created the file and the group is a collection of
    several users, such as research, development, production, admin groups, and so
    on. The public is for everyone else on the system.

    r attribute stands for read privilege and if it is set then the file can be read
    (or copied) by that type of user. The w attribute stands for write privilege and
    if it is set then the file can be written to (that is, listed, copied or modified)
    by that type of user. The x attribute stands for execute privilege and if it is
    set then the file can be executed (that is, can be run) by that type of user.

    For example -rw-- is a file that the owner can read or write but the group and
    the public can only read this file. Another example is -r--x----; with these attributes
    the owner can only read the file. No one else can read the file. No one can change
    the contents of the file. Everyone can execute the file. The ls -al listing gives
    the file attributes.


    Table 13.1 lists some examples.'
