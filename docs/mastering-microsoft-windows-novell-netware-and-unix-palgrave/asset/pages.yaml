  md: '# 12.5.1 Typeless name


    Notice that a relative name has a trailing period to identify that it is a partial
    name. It is also possible not to include the object types (such as CN for common
    name, OU for Organisational Unit and O for Organization). This is called a typeless
    name, and NDS makes a guess as to the object types. For example:


    ```

    FRED_B.TEST.ENGINEERING.FRED_AND_CO

    ```


    is the same as one of the previous examples. When guessing NDS uses the following
    rules:


    +   - The object which is furthest to the left is assumed to be a common name
    (leaf object).

    - The object which is furthest to the right is assumed to be the organisation
    (container object).

    - All other objects are assumed to be Organisational Units (container objects).


    # 12.6 CX


    The CX (Change contextT) command is used to display or modify the context, or
    to view containers and leaf objects in the Directory tree. In a Command Prompt
    window, the following can be used:


    | Command | Description |

    | CX | display current context |

    | CX /? | display help manual |

    | CX /CONT | display all containers in the current context |

    | CX /T | display all containers at and below the current context |

    | CX . | move up one level |

    | CX .. | move up two levels |

    | CX /CONT | display containers in the [ROOT] |

    | CX content | display context for content |

    | CX /R | change current context to [ROOT] |

    | CX /A | display all containers and objects in the current context |

    | CX /R /T | display all containers and objects, from the [ROOT] down |


    For example to set the current context to the TEST.ENGINEERING.FRED_AND_CO container:


    ```

    CX TEST.ENGINEERING.FRED_AND_CO

    ```


    Then to change the context to ENGINEERING:


    ```

    CX ENGINEERING.FRED_AND_CO

    ```


    or


    ```

    CX .

    ```'
