    Frame Ethernet_802.3

    Protocol IPX 0 Ethernet_802.3

    Protocol Ethdev 0 Ethernet_II

    ```


    This configuration file defines the interface adapter as using interrupt line
    11, having a base address of 320h, operating IPX, Ethernet 802.3 frame type and
    following the Ethernet II protocol. Network interface card drivers (such as NE2000,
    from the previous set-up) are referred to as a multilink interface driver (MLID).


