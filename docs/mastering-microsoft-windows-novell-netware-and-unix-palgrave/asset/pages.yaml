  md: '# Named Server


    # 20.1 Example domain name server files


    In the following example set up, there are two servers (ees99 and eep02) within
    the eece.napier.ac.uk domain. The Internet domain naming process is run with the
    named program and reads from the named.boot file (to use a file other than /etc/named.boot
    -b option is used). Its contents are given next and it lists main subnets (146.176.144.x
    to 146.176.151.x). The files net/net144 contain the definition of the hosts that
    connect to these subnets.


    ```

    ; @named.boot.slave 1.13 (Berkeley) 87/07/21

    ; boot file for secondary name server

    ; Note that there should be one primary entry for each SOA record.

    directory /usr/local/adm/named

    type domain source host/file backup file

    primary eece.napier.ac.uk eece.napier.ac.uk

    primary 146.176.144.in-addr.arpa net/net144

    primary 146.176.145.in-addr.arpa net/net145

    primary 146.176.146.in-addr.arpa net/net146

    primary 147.176.147.in-addr.arpa net/net147

    primary 150.176.150.in-addr.arpa net/net150

    primary 151.176.151.in-addr.arpa net/net151

    primary 0.0.127.IN-ADDR.ARPA named.local

    primary 0.0.127.IN-ADDR.ARPA root.local

    cache

    ```


    The first line (after the comments, which comes with a semi-colon) defines the
    master file (eece.napier.ac.uk) contains authoritative data for the eece.napier.ac.uk
    domain. All domain names are relative to this domain. For example, a computer
    within this domain with has name pc444 will have the full domain name of:


    pc444.eece.napier.ac.uk


    The second line of file defines the file net/net144 contains the authoritative
    data on 144.176.144.in-addr.arpa data, and so on. The cache line specifies that
    data in the root.cache file is to be placed in the backup cache.


    The following shows the contents of the eece.napier.ac.uk file on the ees99 computer.
    Each master zone should begin with an SOA record for the zone. The A entry defines
    an address, CNAME defines an alias and a mail server. It can be seen that ees99
    has the mw aliases, ees99.eece.napier.ac.uk is the same as mw.eece.napier.ac.uk.'
