  md: '# Unsigned Integer and Signed Integer


    A signed integer has 32 bits and thus has a range from -2147483648 to +2147483647.
    It uses 2''s complement notation with the first byte the most significant and
    byte 3 the least significant. Integers are declared as follows:


    ```

    int identifier;

    ```


    and can be represented as:


    ```

    (MSB)                   (LSB)

    +------------------------------------+

    +------+------+------+----+

    |byte 0 |byte 1 |byte 2 |byte 3 |

    +------+------+------+----+\n<----------32 bits---------->

    ```


    An unsigned integer has 32 bits and thus has a range from 0 to -4 294 967 295.
    The most and least significant bytes are 0 and 3, respectively. Unsigned integers
    are declared as follows:


    ```

    unsigned int identifier;

    ```


    # Enumeration


    Enumerations have the same representation as signed integers and are useful in
    defining subsets of the integers. They are declared as follows:


    ```

    enum { name-identifier = constant, ... } identifier;

    ```


    For example, three menu options (FILE, EDIT and VIEW) could be described by an
    enumerated type:


    ```

    enum { FILE = 1, EDIT = 2, VIEW = 3 } menu_options

    ```


    # Boolean


    Booleans are declared as follows:


    ```

    bool val;

    ```


    which is equivalent to:


    ```

    enum { FALSE = 0, TRUE = 1 } val;

    ```


    # Hyper Integer and Unsigned Hyper Integer


    A hyper integer is a 64-bit value and allows greater ranges for integer values.
    The signed integer format uses 2''s completed. In a hyper integer the most significant
    byte is 0 and the least significant is 7. They are declared as:


    ```

    hyper identifier; unsigned hyper identifier;

    ```


