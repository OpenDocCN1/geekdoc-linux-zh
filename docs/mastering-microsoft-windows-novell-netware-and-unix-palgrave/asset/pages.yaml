    # WinSock


    # 5.8.1 Introduction


    The Windows Sockets describes a common interface for networked Windows programs.
    WinSock uses TCP/IP communications and provides for binary and source code compatibility
    for different network types.


    The Windows Sockets API (Winsock API, or WSA) is a library of functions that implement
    the socket interface by the Berkley Software Distribution of UNIX. WinSock augments
    the Berkley socket implementation by adding Windows-specific extensions to support
    the message-driven nature of Windows system.


    The basic implementation involves:


    +   - Opening a socket. This allows for multiple connections with multiple hosts.
    Each socket has a unique identifier. It normally involves defining the protocol
    suite, the socket type and the protocol name. The API call used for this is `socket()`.

    - Naming a socket. This involves assigning location and identity attributes to
    a socket. The API call used for this is `bind()`.

    - Associate with another socket. This involves either listening for a connection
    or actively seeking a connection. The API calls used in this are `listen()`, `connect()`
    and `accept()`.


