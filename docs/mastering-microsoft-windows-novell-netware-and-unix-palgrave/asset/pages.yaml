  md: '# 13.11 File manipulation commands


    UNIX has a number of file manipulation commands, some of these are defined in
    this section.


    # 13.11.1 du (disk usage)


    The du command lists the size of a directory and its subdirectories. If no directory
    is given the current directory is assumed. Two typical options are:


    ```

    -a    All file sizes are listed

    -s    Summary only

    ```


    # 13.11.2 compress, uncompress (compress and expand files)


    The compress command uses the adaptive Lempel-Ziv coding to reduce the size of
    a file. Compressed files have a .Z added to their filenames. Sample session 13.19
    shows an example.

    The contents of the compressed files are in a coded form so that they cannot be
    viewed by a text editor. The uncompress command can be used to uncompress a file.
    Only files with the extension .Z can be uncompressed.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_270_0.png)


    # 13.11.3 df (disk usage)


    The df command allows you to list the usage of the disk and all mounted disk drives.
    Sample session 13.20 gives some examples.


    ![](img/da031d9e3a72792b55f2a8fb16c012a5_270_1.png)


    # 13.11.4 diff (differences between files)


    The diff command shows the difference between two files or two directories. Its
    format is:


    ```

    diff file1 file2

    ```'
