  md: '+   • Provide centralised computer settings, such as networked FAXs, dial-in
    network connections, and so on.

    • WWW and TCP/IP services, such as remote login, file transfer, and so on.


    If in doubt, a peer-to-peer network is normally the best for a small office environment.
    Care must be taken when setting up the attributes of the shared resources. Figure
    2.2 shows setting for a disk drive. It can be seen that these are:


    +   • Read-only. This should be used when the remote user only requires to copy
