  md: '# 7.5.1 Process scheduling and multitasking


    This allows multiple applications and other processes to run concurrently, using
    either co-operative multitasking or pre-emptive multitasking. In Windows 3.x,
    applications ran using co-operative multitasking. This method requires that applications
    check the message queue periodically and give up control of the system to other
    applications. Unfortunately, applications that do not check the message queue
    at frequent intervals effectively ''hog'' the processor and prevent other applications
    from running. As this does not provide effective multi-processing. Windows 95/98/NT
    use pre-emptive multitasking for Win32-based applications (but also supports co-operative
    multitasking for computability reasons). Thus, the operating system takes direct
    control away from the application tasks.


    Win16 programs need to yield to other tasks in order to multitask properly, whereas
    Win32-based programs do not need to share resources. This is because Win32-based
    applications (called processes) use multithreading, which provides for multi-processing.
    A thread in a program is a unit of code that can get a time slice from the operating
    system to run concurrently with other code units. Each process consists of one
    or more executions that identify the code path flow as it is on the operating
    system. A Win32-based application can have multiple threads for a given process.
    This enhances the running of an application by improving throughput and responsiveness.
    It allows processes for smooth background processing.


    # 7.5.2 Memory paging


    Windows 95/98/NT use a demand-paged virtual memory system, which is based on a
    flat, linear address space using 32-bit addresses. The system allocates each process
    a unique address space of 4 GB (which should be enough for most applications).
    The upper 2 GB is shared, while the lower 2 GB is private to the application.
    This virtual address space divides into equal blocks (pages), as illustrated in
    Figure 7.6.


    Demand paging is a method by which code and data are moved in pages from physical
    memory to a temporary paging file on disk. When required, information is then
    paged back into physical memory.


    The functions of the Memory Pager are:


    +   * To map virtual addresses from the process''s address space to physical pages
    in memory. This hides the physical organisation of memory from the process''s
    threads and ensures that the thread can access the required memory when required.
    It also stops processes from writing to another memory location.

    * To support a 16-bit segment memory model for Windows 3.x and MS-DOS applications.
    In this addressing scheme the addresses are made from a 16-bit segment address
    and a 16-bit offset address.


    Windows 95/98/NT use the full addressing capabilities of the 80x86/Pentium processors
    by supporting a flat, linear memory model for 32-bit operating system functionality
    and Win32-based applications. This linear addressing model simplifies the development
    process for application vendors, and removes the performance penalties of a segmented
    memory architecture.'
