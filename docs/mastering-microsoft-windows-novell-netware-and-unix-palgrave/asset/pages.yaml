  md: '# 17.10.1 Public key versus private key


    The encryption process can use either a public key or a secret key. With a secret
    key the key is only known to the two communicating parties. This key can be fixed
    or can be passed from the two parties over a secure communications link (perhaps
    over the postal network or a leased line). The two most popular private key techniques
    are DES (Data Encryption Standard) and IDEA (International Data Encryption Algorithm).


    In public-key encryption, each user has both a public and a private key. The two
    users can communicate because they know other''s public keys. Normally in a public-key
    system, each user uses a public deciphering transformation which is widely known
    and a private transforming transformation. The private transformation is described
    by a private key, and the public transformation by a public key derived from the
    private key by a one-way transformation. The RSA technique is one of the most
    popular public-key techniques and is based on the difficulty of factoring large
    numbers.


    # 17.10.2 Computational difficulty


    Every code is crackable and the measure of the security of a code is the amount
    of time it takes persons to operate the code to crack. Normally to break the code
    a computer tries all the possible keys until it finds a match. A 1-bit code would
    only have 2 keys, a 2-bit code would have 4 keys, and so on. Table 17.1 shows
    the number of keys as a function of the number of bits in the key. It can be seen
    that a 64-bit code has


    ```

    18400000000000000000

    ```


    different keys. If one key is tested 10 μs then it would take $1.84 \times 10^{14}$
    seconds ($5.11 \times 10^{10}$ hours or $2.13 \times 10^8$ days or $5834602$ years).
    So, for example, if it takes 1 million years for a person to crack the code it
    can be considered safe. Unfortunately the performance of computers increases by
    the year. For example if a computer takes 1 million years to crack a code, assuming
    an increase in computing power of a factor of 2 per year, then it would take only
    500000 years the next year. Table 17.2 shows that after 20 years, on average,
    it would take only 1 year to decrypt the same message.


    The increasing power of computers is one factor reducing the processing time.
    another is the increasing usage of parallel processing. Data decryption is well
    suited to parallel processing as each processor or computer can be assigned a
    number of keys to check the encrypted message. Each of them can then work independently
    of the other (this differs from many applications in parallel processing which
    suffer from processor communication). Table 17.3 gives typical times, assuming
    a doubling of processing power each year. For processor arrays of 1, 2, 4...4096
    elements. It can be seen that with an array of 4096 elements it takes 7 years
    before the code is decrypted within 2 years. Then an organisation which is serious
    about deciphering messages will have the resources to invest in large arrays of
    processors or networked computers or tens of thousands of processors operating
    in parallel. A prime use of these systems will be in decrypting messages.


    Access to a global network normally requires the use of a public key. The most'
