    # 6.5.3 Allocating network address


    The protocol between client and server is defined by DHCP messages. These are:


    +   * DHCPDISCOVER. The client broadcasts this to locate available servers. When
    a client initially is started it begins with an address of 0.0.0.0.0. It then
    sends out the DHCPDISCOVER message in a UDP packet to port 67 (which is the DHCP/BOOTP
    server port).

    * DHCPPOFFER. After a DHCPDISCOVER message, a server may respond to a client with
    a DHCPPOFFER message that includes an available network address in the ''yiaddr''
    field. When allocating a new address, servers normally check that the offered
    network address is not already in use. Sending out an ICMP Echo Request to the
    new address can do this. If the client receives one or more DHCPPOFFER messages
    from one or more servers the client may choose to wait for multiple responses.
    It chooses the server based on configuration parameters offered in the DHCP OFFER
    messages. The server sends out the DHCPPOFFER message in a UDP packet to port
    68 (which is the DHCP/BOOTP client port). This is sent as a broadcast as the client
    does not currently have an IP address.

    * DHCPREQUEST. Sent by clients to servers when either requesting offered parameters
    from one server and implicitly declining offers from all others, confirming parameter
    allocation (such as after a system boot), or extending the time on a particular
    network address. The server selected in the DHCPREQUEST message responds with
    a DHCPACK message containing the configuration pa-'
