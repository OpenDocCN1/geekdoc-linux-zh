    simply with decimal numbers within a specific range. The standard DARPA IP addressing
    format is of the form:


    # W.X.Y.Z


    where W, X, Y and Z represent 1 byte of the IP address. As decimal numbers they
    range from 0 to 255. The 4 bytes together represent both the network and host
    address.

    The valid range of the different IP addresses is given in Figure 4.7 and Table
    4.2 defines the valid IP addresses. Thus for a class A type address there can
    be 127 networks and 16711680 (256×256×255) hosts. Class B can have 16320 (64×255)
    networks and class C can have 20888960 (32×256×255) networks and 255 hosts.

    Addresses above 223.255.254 are reserved, as are addresses with groups of zeros.


    Table 4.2 Ranges of addresses for type A, B and C internet address


    # 4.6.3 Creating IP addresses with subnet numbers


    Besides selecting IP addresses of interns and host numbers, it is also possible
    to designate an intermediate number called a subnet number. Subnets extend the
    network field of the IP address beyond the limit defined by the type A, B, C scheme.
    They allow a hierarchy of internets within a network. For example, it is possible
    to have one network number for a network attached to the internet, and various
    subnet numbers for each subnet within the network. This is illustrated in Figure
    4.8.


