  md: 'grouped values and the checksum are summed and, in the absence of errors, the
    result should be zero.


    Client

    Node or program that connects to a server node or program.


    Coaxial cable

    A transmission medium consisting of one or more central wire conductors surrounded
    by an insulating layer and encased in either a wire mesh or metal sheathing. It
    supports RF frequencies from 50 to about 500 MHz. It comes in either a 10-mm diameter
    (thick coax) or a 5-mm diameter (thin coax).


    Collision

    Occur when one or more devices try to transmit over an Ethernet network simultaneously.


    Copper distributed data interface (CDDI)

    FDDI over copper.


    Cost

    An arbitrary value used by routers to compare different routes. Typically it is
    measured by hops count, typical delays or bandwidth.


    CRC

    Cyclic Redundancy Check. An error-detection scheme. Used in most HDLC-related
    data link applications.


    Cross-talk

    Interference caused by conductors radiating electromagnetic radiation to other
    conductors.


    Cut-through switching

    Technique when a switching device directs a packet to the destination port(s)
    as soon as it receives the destination and source address scanned from the packet
    header.


    Data Communications Equipment (DCE)

    Devices which establish, maintain and terminate a data communications conversation.


    Data link layer

    Second layer of the OSI model which is responsible for link, error and flow control.
    It normally covers the framing of data packets, error control and physical addressing.
    Typical data link layers include Ethernet and FDDI.


    Data Terminal Equipment (DTE)

    Device at the end of the data communications connection.


    Delta modulation PCM

    Uses a single-bit code to represent the analogue signal. A 1 is transmitted when
    the current sample increases its level, else a 0 is transmitted. Delta modulation
    PCM requires a higher sampling rate than the Nyquist rate, but the actual bit
    rate is normally lower.


    Destination MAC address

    6-byte unique of the MAC address. It is normally quoted as a 12-digit hexadecimal
    number (such as A5:B2:10:64:01:44).


    Destination network address

    A unique Internet Protocol (IP) or Internet Packet Exchange (IPX) address of the
    destination node.


    Differential encoding

    Source coding method which is used to code the difference between two samples.
    Typically used in real-time signals where there is limited change between one
    sample and the next, such as in audio and speech.'
