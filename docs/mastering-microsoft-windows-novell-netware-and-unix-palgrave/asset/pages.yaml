    # NIS domain


    An NIS domain is a logical grouping of the set of maps contained on NIS servers.
    The rules for NIS domains are:


    +   - All nodes in an NIS domain have the same domain name.

    - Only one master server exists on an NIS domain.

    - Each NIS domain can have zero or more slave servers.


    An NIS domain is a subdirectory of /usr/etc/yp on each NIS server, where the name
    of the subdirectory is the name of the NIS domain. All directories that appear
    under /usr/etc/yp are assumed to be served by an NIS server. To remove a domain
    being served, the user deletes the domain''s subdirectory name from /etc/yp on
    all of its servers.


    The start-up file on most UNIX systems is the /etc/rc file. This automatically
    calls the /etc/netfsrc file which contains the default NIS name, which uses the
    program domainname. Appendix D gives an excerpt from the netffsrc file.


