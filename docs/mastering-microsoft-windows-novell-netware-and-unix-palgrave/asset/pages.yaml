    # [Manufacturer-name]


    The [Manufacturer-name] section provides a device description and identifies the
    [Install] section for the installed device. There must also be a manufacturer-name-section
    in the [Manufacturer] section. The format is:


    ```

    [manufacturer-name]

    manufacturer-description=install-section-name, device-id={compatible-device-id...}

    ```


    where device-description section is the device to install, install-section-name
    is the name of the [Install] section, device-id. The identifier for this device
