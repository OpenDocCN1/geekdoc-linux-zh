    # 3.12.3 Memory buffer


    The rate at which data is transmitted on the cable differs from the data rate
    used by the receiving computer, and the data appears in bursts. To compensate
    for the difference between the data rate, a first-in-first-out (FIFO) memory buffer
    is used to produce a constant data rate. An important condition is that the average
    data input rate should not exceed the frequency of the output clock; if this is
    not the case the buffer will be filled regardless of its size.


