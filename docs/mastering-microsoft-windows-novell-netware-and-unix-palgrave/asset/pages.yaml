    account in the /etc/password file and any users who are barred from ftp access
    should be listed in the /etc/ftusers file.


    Anonymous FTP logins are where users log in as anonymous (typically using their
    email address as the password). The user then the ~ftp directory for all transfers.
    Typically the structure is:


    +   - ~ftp/bin Contains a copy of the /bin/ls file.

    - ~ftp/etc Contains the passwd, group and logging files for the users whose own
    files within ~ftp.

    - ~ftp/etc/passwd Defines who owns files within ~ftp.

    - ~ftp/etc/group Defines who owns files within ~ftp.

    - ~ftp/pub General area where files can be uploaded or downloaded from.


    Note that anonymous FTP is inherently dangerous to system security. To protect
    against the -l option in the ftppd daemon can be used to log all accesses to the
    system log. The -t option in the ftppd daemon defines the timeout time for a session.


    In order to permit anonymous FTP, a line similar to the following must be added
    to the /etc/password file:


    ```

    ftp*:4010:10:anonymousFTP:/user/ftp:/bin/false

    ```


    where in this case, 400 is the unique user ID for the ftp login. 10 is the group
    ID for the guest group and /user/ftp specifies the home directory for the anonymous
    ftp account.


