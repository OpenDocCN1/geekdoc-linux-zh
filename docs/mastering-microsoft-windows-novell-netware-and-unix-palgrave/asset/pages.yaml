  md: 'Next PHI is calculated by:


    $PHI = (a-1)(b-1) = 20$


    The public exponent $e$ is then generated so that the greatest common divisor
    of $e$ and $PHI$ is $1$ ($e$ is relatively prime to PHI). Thus, the smallest value
    for $e$ is:


    $e = 3$


    The $n$ (33) and the $e$ (3) values are the public keys. The private key $(d)$
    is the inverse of $e$ modulo $PHI$.


    $d = e^{-1} \pmod{[(a-1)\times(b-1)]$


    This can be calculated by using extended Euclidean algorithm, to give the private
    key, $d$ of 7.


    Thus $n=33, e=3$ and $d=7$.


    The PARTY2 can be given the public keys of $e$ and $n$, so that PARTY2 can encrypt
    the message with them. PARTY1, using $d$ and $n$ can then decrypt the encrypted
    message.


    For example, if the message value to decrypt is 4, then:


    $c = m^e \pmod{n} = 4^3 \pmod{33} = 31$


    Therefore, the encrypted message $(c)$ is 31.


    The encrypted message $(c)$ is then decrypted by PARTY1 with:


    $m = c^d \pmod{n} = 31^7 \pmod{33} = 4$


    which is equal to the message value.


