    THE PROGRAM THAT CAUSED LINUS’S HEART to beat a little faster in the fall of 1991
    was Digital’s Ultrix, one of the many commercial variants of the Unix operating
    system. Others included Sun’s Solaris, IBM’s AIX and Hewlett-Packard’s HP-UX.
    Despite the confusion of versions, they all derived from the original Unix system
    created by Ken Thompson and Dennis Ritchie at AT&T’s Bell Labs in 1969—thethe
    year Linus was born.


    Peter Salus, author of A Quarter Century of Unix, generally regarded as the standard
    history of the operating system, explains how Unix came about: “At the beginning
    of 1969, there was a group of people working on a project that MIT, AT&T Bell
    Labs and General Electric. The project was called Multics. In February 1969, there
    were several millions behind the project, they were months and months behind schedule,
    and the powers that were at Bell Labs decided this is never going to go anywhere,
    and they pulled out of the arrangement.


    And that left the not-quite half-dozen Bell employees who had been involved in
    the project without anything to do,” Salus continues, “but with a large number
    of ideas they had picked up from the cross-fertilization with GE and with MIT.”
    Among them were Ken Thompson and Dennis Ritchie; they decided that a “cut-down
    version of this incredible project could be doable for a much smaller machine”
    than the original project used. “The machine that the project was working on was
    a GE 645, and it was what you would call a large piece of iron,” Salus says.'
