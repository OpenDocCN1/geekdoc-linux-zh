    # Learning from Berkeley


    THE YEAR 1969 WAS IMPORTANT because it saw the birth of Unix — and of Linus. It
    was also then that the first steps were taken in the creation of a network that
    would eventually become the Internet.


    Originally called ARPANet, it was funded by the Defense Advanced Research Agency
    (DARPA), part of the U.S. Department of Defense. In some ways, ARPANet was close
    to the Internet; for example, it employed what is called packet-switching whereby
    data is broken into small packets that are routed over the network separately,
    and then reassembled on their arrival. Packet-switching contrasts with circuit-switching,
    employed for ordinary telephone links, for example, where a single circuit exists
    between origin and destination for the duration of the connection.


    The key step from ARPANet to Internet was the move to open architecture networking.
    As a history of the Internet put together by its creators and held on the Internet
    Society’s Web site, explains, “In this approach, the choice of any individual
    network technology was not dictated by a particular network architecture but rather
    could be selected freely by a provider and made to inter work with the other networks.


    From the beginning, then, openness lay at the Internet’s heart, and its subsequent
    development has been intimately bonded up with core specifications implemented
    through free software. One of the key players in that story is Eric Allman, who
    helped make the Internet what it is today;


