    this kind of enterprise-level system as well as Windows NT. Open source advocates
    might point out that the test system and benchmarks were chosen to show their
    software at its worst; companies do use such systems, and such benchmarks, however
    flawed, do play a role in the framing of comparative IT policies. Linus himself
    long before recognized the realities of comparative testing when he wrote of "Lies,
    damned lies, and benchmarks" during an early exchange about the relative performance
    of GNU/Linux back in February 1993.


    If GNU/Linux was to be taken seriously in the enterprise market, it had to improve
