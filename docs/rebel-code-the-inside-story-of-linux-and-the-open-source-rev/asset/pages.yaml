    Free Software Guidelines; we will call that the Open Source Definition.” Little
    needed to be changed: “I did not make any substantive changes to the document,”
    Perens says. “I only changed it from Debian to make it general.”


    The Open Source Definition lays down nine criteria that the distribution of software
    must meet to be called ‘open source.’ The first—the ability to distribute the
    software freely, the availability of the source code, and the right to create
    derived works through modifications—ensure the basic characteristics that lie
    at the head of the new software methodology. The other criteria spell ancillary
    requirements; for example, they ensure that the license does not discriminate
    against persons or groups of endeavor (such as business), and they close loopholes
    that might otherwise be exploited.


