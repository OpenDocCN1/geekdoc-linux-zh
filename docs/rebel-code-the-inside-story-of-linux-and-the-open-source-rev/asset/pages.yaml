    and progress as it has for the last decade and a half. Another scaling challenge
    presents itself: How can'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# 316 REBEL CODE


    the open source methodology take on more and increasingly ambitious projects?


    GNU/Linux, Apache, Sendmail, Perl, and the rest are continuing proof that the
    development approach does allow growth and change—although a little bumpy at times—to
    embrace ever-larger bodies of code. But projects can be expanded, and more-of
    of themundert, only if enough hackers devote significant amounts of time, energy,
    and enthusiasm. The success of free software depends on a constant supply of fresh
    coding talent. The problem is even worse than it might seem at first sight because
    open source needs this constant supply of new hackers just to keep its current
    projects ticking over.


    Although high-profile coders—Richard Stallman, Larry Wall and Linux—appear to
    be fixtures in the hacker longterm, this is by no means true for the vast majority
    of those in the free-software world. For example, after a couple of years of working
    or more on their own, the GIMP''s creators Peter Matthias and Spencer Kimball
    decided it was time to move on, even though the software was not quite finished
    and some successors were lined up.


    Two people more aware than the most constant turnover of coders are Miguel de
    Icaza and Matthias Etrich. To cope, both of them constructed their ambitious graphical
    interface projects as a collection of smaller subprojects. "What you have is people
    contribute for a period of time," de Icaza explains, "then they have other obligations,
    like school, or marriage, or job changes, or family, and they have to stop working
    on the project." Etrich is even more specific: "A generation for free-software
    programming is very short; it''s between half a year and maybe two years for those
    more dedicated"


    A central concern for the free-software world is therefore whether there be enough
    new hackers, and where will they come from. The scale of this problem is unique
    to the open source software method; commercial software houses can always offer
    extra financial incentives to keep programmers who are thinking of learning. It
    may be well, that the open source world grows and enters the mainstream, enough
    additional professional programmers will start to contribute. Even if they don''t,
    free software possesses unique advantages that will allow it to find those programmers
    from new sources: regions where computing is still in its early stages.


    In the absence of a well-developed local support infrastructure, reliability becomes
    a key consideration, GNU/Linux plus software may be the only feasible option,
    especially if financial resources are limited. For example, the New York-based
    Sustainable Development Net-'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Beyond the Market


    working Programme (SDNP), part of the United Nations Development Programme, has
    routinely been using a GNU/Linux-based approach to provide around forty-five nations
    with some of their earliest connections to the Internet. Free software has been
    used for this purpose 1994, an indication of its early stability and continuing
    utility.


    The small size of the computer market in many of these countries means that proprietary
    Western software is simply not available in a localized version. For example,
    in Ethiopia, "the market was not considered important enough for Microsoft-type
    products," Donald Knuth explains. "But volunteers could take the open source [of
    the free typesetting program TeX and then adapt it themselves." As a result, his
    users in Ethiopia "could have good fonts in Amharic [the main national language,
    with its own alphabet] that were made by somebody [in his garage."


    For parts of the world, other factors may favor open proprietary software. In
    China—an area that TurboLinux''s Cliff knows better than most—"the mindset is
    that they don''t want to be locked into something" that comes from the United
    States, he says. As a result,"they look at a company that sells close, proprietary
    software coming from the U.S. [as] as pretty a big threat. Linux is much more
    in line with their political and economic needs than Microsoft Windows is." Indeed,
    there have been persistent rumors that the Chinese government might even forbid
    the use of Microsoft''s Windows 2000 and adopt GNU/Linux as an "official" Chinese
    operating system. You certainly hear in meetings a great deal of dissatisfaction
    with Microsoft in China," Miller comments, "but nobody goes on record saying that."
    However,"there is a lot of excitement around Linux," he says, and whether official
    of not, GNU/Linux is well on the way to becoming the facto standard for China.
    "I''m sure it will," Miller says.


    Potentially, the impact of millions of Chinese users on open source could be immense.
    In the short term, at least, India''s promises to be even more dramatic. India
    has the advantage not only of widespread use of English—the lingua franca for
    hacker collaboration over the Net—but also of a huge and highly educated middle
    class with ready access to computers. In short, India represents the perfect recruiting
    ground for free-software coders in the future.


    India is already a significant force in the programming world; this came to many
    Westerners'' attention through its work in fixing software issues arising out
    of the Year 2000 problem. And it is surely coincidence that IBM has chosen to
    set up a GNU/Linux center in India as part of its move to embrace open source.
    "One of the appeals of Linux is'
  merge: -1
  pgno: 332
- img_proc: true
  md: '# 318 REBEL CODE


    not only is there a hotbed in the U.S., says IBM’s Wladawsky-Berger,

    but that there are even bigger hotbeds in Europe, India, and China. You can imagine
    there are lots and lots of wonderful Indian engineers.”


    There are likely to be even more such engineers if an Indian source project called
    the Simputer—from SIMPLE computER—succeeds. As a press release of 26 May 2000,
    the Simputer is a “mobile computing device for the common man … based entirely
    on free software,” principally GNU/Linux, Perl, and Tk. It is designed as a “shared
    computing device for a local community of users” and to “make available the benefits
    of Information Technology to the rural masses” in India. Unit’s low price—around
    $200—is crucially important if it is to be widely deployed to these users, and
    that price would be impossible to achieve without open source software.


    Other countries, too, are likely to become major contributors to the free-software
    world—Mexico, for example, thanks to a major distance learning project that is
    already underway there Details about it first appeared in October 1998, when Arturo
    Espinosa Aldama joined a mailing list for Gnome—a project to which he had close
    personal links. Miguel of Icaza explains, “He was my roommate in Mexico,” and
    in August 2000, Espinosa joined Icaza’s company Helix Code.

    Espinosa wrote in 1998:


    I work as the project leader of the “Scholar Net,” a program that aims to bring
    computers and the net to every elementary and mid-level school in Mexico. We expect
    to install from 20 to 35 thousand labs per year to a total of 140,000 centers
    in the next five years.


    At the time, this message led to wild assertions in some quarters 140,000 Mexican
    schools would be using GNU/Linux.

    But Espinosa emphasizes, “Our Linux solution is just an option. It is not something
    that is being installed by decree. What happens is that every state in the country
    decides by itself what to be its logical solution. So far, he says, six of thirty-two
    Mexican states have shown an interest in adopting this GNU/Linux approach. “Realistically,
    I think that in a year we will have something near five states,” he says. “So
    that’s around maybe 1,500 schools installed.”


    Although fewer than the 140,000 touted by some, this number is significant and
    represent an important test-bed for the use of GNU/Linux in schools. Moreover,
    if even a small percentage of the children involved became free-software hackers,
    this could have a major im-'
  merge: -1
  pgno: 333
- img_proc: true
  md: '# Beyond the Market


    # 319


    pact on GNU/Linux. As Icaza says, this and similar projects mean that “there are
    going to be more people who do not depend on proprietary technologies, who know
    how to use the free software alternatives, and know how to develop the free-software
    alternatives.”


    In a sense, though, such schemes to introduce GNU/Linux-based systems into schools
    are inefficient as a of fostering new coders to drive free-software development;
    it places the onus on the individual—the child or young person—to get to know
    more about the underlying software, to learn programming, and to start hacking.
    Alongside such undertakings, a more formal approach to teaching programming that
    would naturally lead people to contribute to open source projects is needed. This
    is one of the aims of a project called Computer Programming For Everybody (CP4E),
    the brainchild of another key figure in the world of open source.


    Guido Rossum was born in 1956, in the Netherlands. While living in Amsterdam,
    he worked on a branch of the Amoeba project, the main research interest of Andrew
    Tanenbaum, the creator of Minix, who is a professor at the Free University in
    the city. “I remember Tanenbaum asking me, ‘Are you a researcher or a developer?’”
    van Rossum says. “And I still don’t know the answer. I’m a bit of both.”


    While he was working on the Amoeba operating system, van Rossum came up with the
    idea for a new language. “One of the things we were trying to do was to make [Amoeba]
    sufficiently usable system that we could run it on our workstations and use it
    for our day-to-day use,” he says. “We realized that one of things that made it
    difficult was that we didn’t have a good scripting language”—a method for creating
    programs quickly and easily. And so van Rossum wrote one, which he called Python
    after the BBC comedy series Monty Python’s Flying Circus. It was one of my favorite
    TV shows at the time,” he explains.


    As he wrote in the foreword to Programming Python: “In December 1989


    Python was released in February 1991, and it soon enjoyed a devoted following.
    Python is in many ways a rival to Perl—the leading scripting language—but van
    Rossum emphasizes that no animosity exists between him and Perl’s creator, Larry
    Wall. “I think Larry is a great guy, and Perl'
  merge: -1
  pgno: 334
- img_proc: true
  md: '# 320 REBEL CODE


    is a very useful language, but I have a different philosophy about design.


    Because of different philosophy—born in part from ideas borrowed from an earlier,
    educational programming language called ABC, which he says. “remembered fondly”—van
    Rossum says, “it gradually dawned on me that Python was actually a very good language
    to teach beginners.


    The projects of Rossum was working for his employer at the time, the Corporation
    for National Research Initiatives (CNRI), based in Boston, Virginia, were coming
    to an end, and he was casting around for something new. “I was convinced that
    I wanted to work on Python fulltime, The educational just popped up as one of
    the ideas that might work.


    This project democratizes open source. Currently, hackers start their own major
    projects or join someone else; with Rossum’s approach, far more people would be
    able to hack a simple script to meet their own needs. Once they get the taste
    for it, they might well go on bigger things.


    Van Rossum believes his approach could have a significant effect on open source.
    “Sometimes I think I’m crazy,” he says, “but sometimes I think it is not unreasonable
    to assume that lots of people will have basic programming skills so they can make
    their computers do what they want to do. There will be an open source community
    of people who share small and large things they created for their computers that
    is different from the existing open source community only in the fact that this
    are millions of people who are probably less sophisticated but nevertheless interested
    users.


    The entire CP4E project is intimately bound with open source. It will create not
    only a huge body of potential coders but also a demand for open source software.
    “If most software is proprietary, a lot of the ideals of CP4E won’t be fully realized,”
    van Rossum says. “Because one of the ideals is that people won’t want to create
    new software from scratch, because that’s a tedious process, but people will want
    to take existing software and make changes.


    Assuming new pools of coding talent evolve—in China and India, the schools of
    Mexico, and through broad educational projects as CP4E—one possible point of failure
    remains for the open source movements: at the top. Even with a constant supply
    of gifted hackers, without the right kind of leadership and a process that allows
    power to pass smoothly to successors, energy will dissipate and free-software
    projects worldwide will dwindle into irrelevant programming pastimes.'
  merge: -1
  pgno: 335
- img_proc: true
  md: '# Beyond the Market


    Most of the main open source projects have already tackled this issue. Apache''s
    core group allows new members to be added as others drop out. Larry Wall has stepped
    back from the day-to-day running of Perl so that others can shoulder the burden
    in turn. Projects such as Sendmail and Tcl have companies with teams of paid engineers
    that can move standards forward while preserving their openness. But questions
    of success remain unanswered for the two key free-software projects: Linux and
    GNU.


    Because Linux has a high profile and more more companies are betting their futures
    on its continued development, the question of what happens after Linux has been
    the more discussed of the two. Opinions within the open source world differ. Larry
    McCoy, for example, believes that “Linux is held together by Linux, and he is
    a unique human being. The way I always put it, is great programmer, great [software]
    architect, nice guy—pick any two: You can''t have three in one human being”—except
    in Linux.


    Stephen Tweedie is more sanguine. “There are many other people involved,” he says,
    “who have the ability to take on increasing parts of the workload, I really can''t
    see there being a long-term problem.” Another senior hacker, Ted Ts''o, agrees:
    “There are a number of people who can do the job. Someone would have to get designated
    as successor, or we might decide to use a different model—such as perhaps Apache,
    or Perl, development communities—it''s not clear what we would do.” And Ts''o
    emphasizes “A lot of it has to be done with enough people in the developer community
    being mature.


    Fortunately, the Linux community seems to have both strength-depth and the requisite
    maturity to cope with any situation that might arise. For example, Alex Cox and
    Dave Miller are leading candidates to take over this should be necessary. Alex
    Cox is already running the stable branch of the code, leaving Linux to concentrate
    on the development version. Although Alex Cox is an obvious choice, he believes
    that “there are several people who could take over.” He adds, “I told Linux has
    directions for the event filed anywhere. I''ve never seen the contents and hopefully
    will never need to.


    Dave Miller, too, has been handling an alternative kernel source tree that is
    held on the vger machine: “That a huge tranche of development which is now being
    carried out independently of Linux,” as Tweedie points out. Nonetheless, even
    someone as gifted and ambitious as Miller, who almost took the momentous step
    of forking the Linux code during the 1998 “Linux does not scale” incident, recognizes
    that the time is not yet right for taking over. “I don’t'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# 322 REBEL CODE


    think I''m personally 100 percent mature enough to do right at this moment," he
    says. "If I had to do it, I would. Maybe a year or two from now I could keep a
    grip on such a large project and make intelligent and well-out decisions. I hope
    I never have too." And he adds, with knowing understatement, "Linus is pretty
    good at the task."


    The two positions—that Linus is unique and that he is replaceable—are not, ultimately
    irreconcilable. Linus''s greatest achievement is not his software: One day, Linux
    will be superseded. As Alan Cox says, "There will eventually come a point where
    someone is trying to do something [that] you fundamentally break Linux. So you
    will end up with something [that] replaces Linux, built using Linux as kit of
    useful parts to get you going.


    Linus''s enduring contribution, rather, lies in his perfecting of the development
    model he inherited in slightly different forms from the hacker cultures of Berkeley,
    the GNU project, and Minix. Linux opened the process to be inclusive: Anyone can
    download the latest kernel, anyone can send in patches. Linus added the vital
    element of rapid review—sometimes updating kernels on an almost daily basis—that
    took the open source to the next level. Linux allowed his tenants progressively
    to take over parts of the kernel, ensuring its greater scalability and long-term
    viability.


    Linus is unique because he was able to serve as a focal point for all these advances
    to come together to create a complete methodology that is now central to the continuing
    success of the open source movement and offers the first plausible alternative
    to the current and cracking—model of software development. But Linus is also replaceable
    because this methodology, which allows programming and architectural decisions
    to be delegated to specialized circles of experts; and thanks to this methodology,
    even his leadership style—that of power wielded in subservience to the user base—can
    be distributed more widely.


    This development of power has been possible because Linus is a pragmatic and the
    Linux development process inherently consensus-driven. In the purist view, however,
    things are not so easy. Compromise is not an option when it involves fundamental
    issues of principle, as selecting a future leader of the GNU movement inevitably
    does. Given that there can be no fuzziness in the GNU project''s goals, so leadership
    by committee—an inherently fuzzy approach—is hardly practical. What is needed
    is someone able to command unqualified respect within the purist hacker community
    not for technical ability but also for an unswerving record of commitment to the
    ideals that stand at the heart of the GNU GPL and the GNU project.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# # Beyond the Market 323


    Stallman despairingly, “I’m going to keep working on the free-software movement
    because I don’t see who’s going to replace me.” Nevertheless, a worthy successor
    who has the rare mix of qualities necessary may already be emerging in the person
    of Miguel de Icaza. His managerial skills, manifest in the smooth marshalling
    of hundreds of programmers in the GNOME project, as well as his own programming
    prowess, revealed through his coding of Midnight Commander and Gnumeric, are beyond
    question, as is is his abiding and deep-seated commitment to the ideals of free
    software.


    His own take on those ideals is striking. “As the years pass and you’re working
    in this framework,” he says, “you start to reevaluate in many your relationship
    with your friends and your family. The same ideas about free software and sharing
    and caring about other people start to permeate other aspects of your life.” De
    Icaza makes explicit expectations that have always been implied in Stallman''s
    crusade for free software and the creation of a community that can share.


    Although De Icaza hopes that “somebody with [fewer] responsibilities than I would
    be able to take over” from Stallman if the need ever arose, he says that “If Richard
    asked, to exist as long I would do it.” As a result, he provides the entire free-software
    movement with the guarantee of a continuity and a future, no matter what happens.


    De Icaza''s readiness to accept such an onerous task—one that has already required
    Stallman to forgo much in his life—also the reason free software and open source
    will continue to thrive and progress. Somewhere, whether in Boston, Helsinki,
    Mexico City, Beijing, or Delhi, somebody—probably young, and, with increasing
    likelihood in the future, a woman—will be willing to take on a similar burden
    when the need arises, despite the personal cost.


    In the end, GNU/Linux and the open source projects are not about software code
    only. As this book has described, they are also about freedom, sharing, and community;
    they are about creation, beauty, and what hackers call “fun”—though “joy” would
    be nearer the mark. They are about the code within that is at the root of all
    that is in us, that rebels against the worst, and that will endure.'
