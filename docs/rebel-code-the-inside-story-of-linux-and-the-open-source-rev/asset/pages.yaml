  md: '# rebel code


    "A comprehensive account of... genesis and development of Linux and the open source
    revolution...Mr. Moody’s painstaking record of each step in the systems development
    provides an instructive account of an extraordinary movement." **Financial Times**


    "Riveting... a superlative book." **Washington Post**


    "That [GNU/Linux] may be doing more to threaten Microsoft''s hegemony that wealthy
    and aggressive rivals...is nothing short of revolutionary. This alone makes the
    story that Rebel Code tells important." **The Economist**


    "Moody’s painstaking research of newsgroups, mailing lists, and interviews with
    the personalities of the GNU/Linux revolution pays off." **Linux Today**


    The open source saga has many fascinating chapters. It is the story of Linus Torvalds,
    the master hacker who would become chief architect of a key component of the much-heralded
    GNU/Linux operating system. It is also the story of thousands of devoted programmers
    around the world who spontaneously worked in tandem to complete the race to shape
    GNU/Linux into the ultimate killer app. Glyn Moody traces the roots of this unplanned
    revolution, as it grew through an almost biological process of accretion. With
    unprecedented access to the principal players, he captures the vision and the
    drama behind one of the most significant business trends in recent history. A
    powerful tale of individual innovation versus big business, Rebel Code provides
    a-from-the-trenches perspective and looks ahead to how open source is challenging
    long-held conceptions of technology, commerce, and culture.


    **GLYN MOODY** is a London-based writer who has covered, used, and written about
    Linux since its inception. He has published major features on it in *Wired* and
    *The New Scientist*, and has written for *The Economist* and Financial Times.


    ![](img/ee9b61b539559fd30ba5fccbdb6aab0d_353_0.png)'
