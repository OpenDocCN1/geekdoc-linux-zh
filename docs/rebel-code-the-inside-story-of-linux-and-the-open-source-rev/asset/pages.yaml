  md: '# PROLOGUE


    Outside, a lowering Seattle sky broods over the clumps of squat white buildings
    scattered around an extensive campus in constant expansion.

    Neat lawns, assiduously tended flowerbeds, and the tidy ghost-ornamental ponds
    create a mood of cloistered reflection and tranquility.


    Inside, a similar calm reigns in the cubicles where young men and women toil diligently.
    The silence is broken only by bursts of clattering keys; hardly as if a stern
    vow were in force. And yet despite a conducive environment and comforting faith,
    there is uneasy among the cubicles'' inhabitants, a rising tide of something close
    to fear. They know that a terrible ghost is abroad in the cloisters of Microsoft.


    The ghost has a name: open source. Its characteristics have been meticulously
    detailed by two of the company''s expert ghost-watchers in a pair of lengthy memos.
    Though marked "Microsoft confidential," they surfaced outside the company and
    were published on the Web, suitably enough during Halloween 1998. Forced to concede
    that the memos did originate from within the company, Microsoft dismissed them
    as the private speculations of a couple of engineers.


    As he read the memos describing this phenomenon, Bill Gates must have shuddered
    in recognition; it was as if a spirit from the past had tapped him on the shoulder.
    Gates had sought to exorcise the ghost of free software over twenty years before.


    In 1976, Gates had published what he called—what would prove deep irony—an Open
    Letter to Hobbyists, addressed to users of the first personal computer, the MITS
    Altair. Gates and Paul Allen, the other founder of Microsoft, had written a version
    of the Basic (Beginner''s All-Purpose Symbolic Instruction Code) language that
    would run on this'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Prologue


    rudimentary machine—a considerable feat given its limited memory. Gates wrote
    his Open Letter to condemn what he saw as software piracy—making illegal copies
    of the program he and Allen had written—but which many users regarded as part
    of computer community''s long tradition of sharing useful tools.


    In his tirade against the practice of passing around software, Gates thundered,
    "As the majority of hobbyists must be aware, most of you steal your software.
    Hardware must be paid for, but software is something to share. Who cares if the
    people who worked on it get paid?" He went on to claim that the result of such
    piracy is the prevention of "good software from being written." After all, he
    asked rhetorically, "Who can afford to do professional work for nothing? What
    hobbyist put three man-years into programming, finding all bugs, documenting his
    product, and distribute for free?


    As he penned these lines, Gates probably thought these were answerable arguments.
    And yet the Halloween memos, written by his own engineers, document in great detail
    the incontrovertible fact: There was now just one hobbyist out there, but several
    thousands of them. Collectively, they were putting thousands of man-years into
    programming, finding bugs, documenting products, and then distributing them free,
    complete with the source code—that holy text that Microsoft and other software
    companies had withheld from profane eyes for the last twenty years.


    In the light of his Open Letter to Hobbyists, the open source movement emerges
    as Bill Gates'' worst nightmare magnified a thousand times. Not just a few hobbyists
    who "steal," but a thriving community that writes its own—excellent—code, and
    then gives it away. Because their actions do not "prevent good software from being
    written," they implicitly call into question the very basic of the Microsoft Empire:
    Microsoft or companies like it?


    The appearance of the Halloween Documents, and the fundamental issues they, could
    not have come at a worse time for the company. The antitrust lawsuit brought by
    the U.S. Department of Justice in 1998, had perhaps the first time, called Microsoft''s
    aura of invincibility into question. The lawsuit''s existence meant that people
    began considering, if only theoretically, the possibility of a computing world
    not dominated by the Redmond giant.


    That looked more plausible thanks to the continuing delays in the delivery of
    what Microsoft had no hesitation in branding its key enterprise product. This
    had formerly been known as Windows NT 5, but when the'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Prologue


    Halloween documents were leaked it had just been renamed Windows 2000. If Windows
    NT 5 had arrived in 1998, companies would doubtless have been too busy adopting
    it to contemplate alternatives; coupled with the antitrust lawsuit, the resulting
    vacuum allowed other options to be considered.


    Moreover, when the company found itself plagued by public relations disaster during
    the antitrust trial as well as grave technical problems in delivering Windows
    2000, there was an unprecedented loss of some half-dozen top executives—the people
    Microsoft most needed to resolve these problems. When Bill Gates seemed fatally
    distracted by the Department of Justice’s lawsuit. His woful videotaped testimony
    for the trial, in which he appeared unable to recall his own e-mail or even his
    business decisions, destroyed one and for all his image as the infallible high-priest
    of high-tech.


    At this moment, when Microsoft was at its most vulnerable, and its boss at least
    admired, appeared on the computing scene not only an alternative but rival.


    Alongside the Internet, the Halloween documents had identified the free operating
    system kernel Linux—pronounced “Lih-nooks”——as among the most successful examples
    of the open source philosophy: "Linux has been deployed in mission critical, commercial
    environments with an excellent pool of public testimonials," Vinod Vallopilli,
    one of the memos authors, had noted. It also formed the nucleus of a free-software
    project that directly attacked Microsoft’s core product line, notably the Windows
    2000.


    Linux had been started by a twenty-one-year-old Finnish student, Linus Torvalds,
    who distributed it freely, including the source code—the underlying programming
    instructions, which form a kind of blueprint for software. In Linus (“Lee-nose”),
    as he was universally known within his community, the open source movement had
    not only a gifted leader but also an invaluable icon. Although complex might leave
    the media outlets cold, modest and photogenic young man proved an immediate hit.
    Linux seemed to embody everything Bill Gates was, not just as open the traditional
    image of those who made up the open source movement.


    These self-described hackers—not to be confused with the malevolent crackers who
    break into computer systems—have traditionally been caricatured as maladjust youths
    who turn to hacking because they lack social skills and feel marginalized. And
    yet here was Linus Torvalds, one of the hacker princes, who not only washed regularly,
    kept his hair short,'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# Prologue


    and wore neat, clean clothes, but had a respectable job, was married, and was
    a father.


    There could be no better symbol for the new generation of hackers who are turning
    open source into a powerful force in today''s computing world. They are the heirs
    of an earlier hacking culture that thrived in the 1960s and 1970s when computers
    were still new, a community that believed software should be shared, and that
    all would benefit as a result. This was the ethics that Bill Gates had lambasted
    in his Open Letter to Hobbyists. Microsoft and several other key companies at
    the time, notably AT&T, are largely responsible for nearly extinguishing the old
    hacker spirit and replacing it with a view that redefined sharing software as
    piracy.


    Thanks to the advent of relatively low-cost but powerful PCs and the global wiring
    of the Net, the new hackers are immeasurably more numerous, more productive, and
    more united than their forebears. They are linked by a common goal—writing great
    software—and a common code: that such software should be freely available to all.
    Hackers rebel against the idea that the underlying source code should be withheld.
    For them, these special texts are a new kind of literature that forms part of
    the common heritage of humanity: to be published, read, studied and even added
    to, not chained to desks in inaccessible monastic libraries for a few authorized
    adepts to handle reverently.


    As a result, the open source movement poses a challenge not just to Microsoft
    but to the entire software industry. And perhaps beyond. For as the Internet moves
    ever closer to heart of the modern world, it inevitably carries with it the free
    programs that drive it, and seeds the values that led to their creation. Its basic
    code of openness, sharing, and cooperation is starting to spread outside the confines
    of one or two high-tech industries. Many now believe that this potent combination
    of the Net with open source has more than a ghost of chance of thriving in the
    current post-Microsoft era.'
