    an important one. Before, its members had almost reveled in their splendid isolation
    from the rest of the computer world. Like rebellious adolescents, they had taken
    a great delight in cooking a smoke at authority, in doing things their way—secure
    in the knowledge that their approach was "obviously" better.


    The Minecraft benchmarks changed all. They showed that for all its strengths,
    the Linux kernel had real weaknesses. It still did not scale. The failure to shine
    in these benchmarks shattered the complacent attitude of the hacker community
    that held they were simply the best in everything. As such, it represented a kind
    of rite of passage—painful, but necessary—to the grown-up world of real computing.
    In particular, it provided a messy introduction to the untimely unfair of business.


    The Minecraft tests, despite the unsatisfactory way in which the relationship
