    The result was TeX, “a new typesetting program for the creation of beautiful books”
    as Knuth describes it in the Preface to the TeXbook, his handbook to the program,
    and written to provide users with absolute control over the appearance of characters
    on the page. TeX allowed him to re-create the effects of hot-lead typesetting
    that had been used for the first editions of his book which had now all disappeared.


    The name TeX is derived from the Greek word τενη (tekhne), which means “art,”
    and is also the root of the words “technology” and “technique.” As well coming
    with its own idiosyncratic form, TeX also has a particular pronunciation: the
    “X” in TeX is like the “ch” in the name of German author Bertolt Brebrecht.


