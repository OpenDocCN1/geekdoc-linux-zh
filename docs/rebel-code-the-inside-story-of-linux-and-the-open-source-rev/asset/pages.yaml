    Unifying today''s Internet is the underlying TCP/IP (Transport Control/Internet
    Protocol), the fundamental rules that establish how communications take place.
    With Sendmail, the software that implemented these protocols, in what is generally
    called a stack, derives mainly from work done at Berkeley. The key figure here
    was Bill Joy. As Allman says, “no story of Berkeley is complete without discussing
    Bill. He was both an incredibly brilliant person, very prolific, but what was
    probably more important about Bill, he inspired people around him to do good work.
    He just sucked up information like a sponge, and a lot of that information came
    from the users” in true Berkeley fashion.


    Joy''s TCP/IP implementation was also included with the Berkeley Unix distribution.
    The liberal Berkeley license under which it and other components such as Sendmail
    were released, which essentially allowed any use to be made of the software provided
    the copyright of the regents of the University of California was recognized, meant
    that many commercial TCP/IP stacks were derived from this work. Linux possesses
    one of the few TCP/IP implementations not based on Berkeley, because at the time
    Linux stack was written, AT&T''s lawsuit against Berkeley''s Unix was underway
    and the community decided to avoid legal problems by using the TCP/IP code from
    scratch.


    Part of the TCP/IP suite of protocols describes how the individual packets of
    data are routed from origin to destination using Internet addresses, which take
    the form of 123.45.67.89; but it is doubtful whether the Internet would ever have
    taken off as mass medium if users had been required to enter 204.71.200.66 instead
    of yahoo.com.


    The use of these easy-to-remember names is possible thanks to the Domain Name
    System (DNS) that converts between the two forms. It was devised by Paul Mockapetris,
    who explains, “The DNS system specs were first published in 1983, and the first
    implementations were Jeeves, on TOPS-20 system [a Digital mainframe], a version
    on Unix from Stanford, and a version for Unix from Berkeley.


