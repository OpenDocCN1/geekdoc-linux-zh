    the final and symbolic coming together of two great currents in the field of computing:
    The Internet and open source.


    As described previously, the main Internet services are run almost entirely by
    free software on the server side: BIND for the Domain Name System, Sendmail for
    e-mail, and Apache and Perl for the Web. The rise of the World Wide Web occasioned
    a battle between open and closed software in the increasingly important area of
    the client—the browser software that ran on what soon amounted to millions of
    desktops as the Web was quickly taken up by business and end-users.


    The silent struggle begins in October 1991, around the time Linus posted 0.02
    of Linux. At the end of that month, Tim Berners-Lee had inaugurated a mailing
    list called WWW-Talk for all interested in the new World Wide Web, which he had
    only recently released to the public. The following day, Berners-Lee told the
    members of the list that somebody called Dan Connolly was working on an X11 browser;
    that is, software to access the Web that made use of the X Window system, also
    known as X11.'
