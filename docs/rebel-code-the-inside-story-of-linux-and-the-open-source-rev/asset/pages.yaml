    Both the C library and Bash were finished around 1990, along with many other elements
    of the Unix operating system. Still missing, though, in many ways the single most
    important program of all: the kernel. As its name suggests, it acts as housekeeper
    (handling tasks such as the screen and keyboard) and judge (ensuring that the
    competing calls for attention from user programs are handled correctly). Although
    many other programs are indispensable for a fully functional operating system—example
    a C library and a shell—it is the kernel that defines its essence.


    That Stallman left the kernel until last might seem strange its central nature.
    In part it was because he had been distracted by his feud with Tanenbaum and he
    that a C compiler would be one of the first programs that he wrote for his GNU
    system. In addition, it made sense to develop all the programming tools first
    so that they could then be used in the creation of the kernel.


    There was another reason, however."“I was trying to bypass the hardest part of
    the job," Stallman says. Debugging kernels is difficult because the standard programming
    tools depend on a functioning kernel. To get round this, Stallman had been on
    the lookout once more for suitable software that could be adapted—and he had something
    particular in mind: "I was looking for a microkernel,” he says.


    A microkernel is a kernel that takes the idea of a small, central adjudication
    of software to its logical conclusion; it makes all the other housekeeping tasks
    normally found in a kernel into programs that are controlled just like end-user
    applications as word processing and spreadsheets. The pros and cons of this approach
    with respect to the classic all-in-one kernel—known as a monolithic kernel—form
    the subject of what hackers call a "religious war" between their respective adherents
    that rages to this day.


    Stallman was interested in microkernels not for reasons of doctrine but because,
    he says, "that way we could avoid the job of debugging the part of the software
    that runs on the bare machine"—the underlying hardware. As usual, he was sensibly
    trying to save time and effort by taking existing code that had tackled one of
    the harder parts and building on it. He also thought the design provided "nice
    features."'
