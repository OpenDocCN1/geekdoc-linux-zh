    was no mention that Microsoft had paid for them, nor that they were conducted
    in a Microsoft lab. The tuning was not optimal for the GNU/Linux system, and even
    with the second round of tests, representatives of the open source world were
    refused access to the equipment.


    In another respect, however, Weiner may have been right about certain payback.
    After the initial shock and outrage had begun to die, the top hackers went down
    some serious analysis of what was going on. One of the reasons this took some
    time was the nature of the Ziff-Davis benchmarks.


    As Andrew Tridgeld explains, "The problem with NetBench is that it’s a very close
    benchmark, in the sense that anyone can download it, but you’d need a half-million-dollar
    lab in order to run it seriously. You can’t just go and run it at home to get
    a result that’s at all meaningful. There was really only one location available
    to the open source community to test such configuration," he continues, and that
    was SGI, where Jeremy [Allison] was working. And so he could do that, that was
    an enormous bottleneck, and it meant that people like Alan [Cox], Linux, and David
    Miller couldn’t really do the tests themselves." In this respect, NetBench and
    WebBench were taking the community into a new realm where the open source techniques
    based on the input of the many users running software on their personal computers
    were no longer enough.


    But hackers are nothing if resourceful. Using SGI’s facilities, Allison ran NetBench
    for one PC client, and all the details of the data’s flowing over the network
    were recorded. Tridgeld replayed that data to simulate hundreds of clients running
    simultaneously, employing just two GNU/Linux machines linked together. In this
    way, it was possible to run NetBench without having half-a-million-dollar laboratory—and
    hence start investigating what was happening in the Minecraft benchmarks.


    Tridgeld also carried out another important piece of work. "One of the things
    you’re doing with benchmarking is you’re trying to work out which subsystem on
    the server is the bottleneck," he says. "So what I did was created three benchmarks,"
    each one which tested a different part of the GNU/Linux-Samba combination. The
    problem was revealed when the NetBench simulation was run using these three benchmarks.


