    The Mindcraft saga has done more than give rise to a few handy patches. “It gave
    a real focus,” Trigdell believes. “In particular, for a technical point of view,
    it made us focus on the larger-scale benchmarks as to the microbenchmarks. To
    a reasonable extent, the kernel developers had been using microbenchmarks like
    Imbench, which was Larry McVoy’s software for tuning at a very low level. In this
    area, Trigdell contends, "Linux is so far ahead of all the other operating systems
    in that it''s just not funny."


    But Imbench didn''t stress the operating system under a load of fifty processors
    running simultaneously,” he says. “Getting scalable kernel-SMP is a much more
    difficult task, and nobody had really worked on it. So what this [episode] did
    it focus of effort on that.” In a sense, the Mindcraft benchmarks realized this,
    but not before Linux had a great success.


    Linux eventually regained its usual equanimity and coolness. Weiner says, “I got
    the firestorm from the top ranks in the open source world, and Allison recalls
    that "Linux [ Weiner] this just unbelievably nasty e-mail calling him a fair names."
    Similarly, Ewel says that he and Linux "changed some fairly heated e-mails." For
    a moment, Linux had forgotten that bug reports from users in new situations, pushing
    and stressing the software in new ways, had always helped make Linux better. And
    the Mindcraft benchmarks had done this by showing what needed to be done if GNU/Linux
    was to become an enterprise solution. One concrete result of this input was revealed
    by Red Hat’s announcement on 15 August 2000 that Dell servers running GNU/Linux
    were "the fastest Web solutions of those tested and more than twice as powerful
    as Windows 2000 on the same four-processor system.


    The fueling of future improvements in Linux was once the exercise backfired for
    Microsoft. The bigger blunder, however, was something profound. By arranging for
    GNU/Linux, Apache, and Samba to be benchmarked against Windows NT, Microsoft said
    in the most emphatic manner that these were rivals; after all, there is no point
    benchmarking things that are not in some sense comparable. A significant shift
    from Microsoft’s previous stance that GNU/Linux was not up to enterprise-level
    tasks, and nobody was using it.


    The Mindcraft benchmarks gave the lie to this position more effectively than anything
    the open source community could have done. At a stroke, Microsoft had anointed
    GNU/Linux as an official release. Moreover, through its inept initial handling
    of the resulting furor, it hammered home this message for over three months, just
