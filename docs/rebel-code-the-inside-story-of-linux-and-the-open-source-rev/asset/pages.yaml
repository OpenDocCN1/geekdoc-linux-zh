  md: '# The Coolest Year


    IF 1998 AND 1999 WERE THE WORST YEARS in Microsoft''s history, 1991, by contrast,
    must have been a period when Bill Gates was feeling good. Windows 3.0, launched
    in May 1990, was a growing success; in the first year alone, 4 million copies
    had been shipped, a huge number for the time. In May 1991, Microsoft launched
    Visual Basic, a radically new way of programming that employs visual design methods
    rather than traditional ones based on editing text files.


    Even better, Windows 3.1 was close. Despite the point upgrade, version 3.1 represented
    a major advance over 3.0 in almost every way. Microsoft claimed that it contained
    over 1,000 enhancements. Its cool new user interface seduced almost everyone that
    saw it.


    When Windows 3.1 shipped in June 1992, cemented Microsoft''s dominance on the
    desktop. It also created a discontinuity in the software world as companies switched
    from DOS-based programs to those running under Windows. Microsoft was able to
    exploit this crossover to wrest leadership in the spreadsheet and word-processor
    sectors by quickly launching programs such as Excel and Word.


    Windows 3.1 was not the only operating system nearing completion in 1991. Microsoft
    Windows New Technology, better known as Windows NT, had started back in 1988 in
    a drive to create an enterprise-level operating system that would be widely deployed
    in companies'' back offices as MS-DOS and then Windows were in the front offices.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 6 REBEL CODE


    The Windows NT happening project was headed by Dave Cutler, who had built the
    operating system VMS for the computer giant Digital, formerly known as DEC. VMS
    was a rival to Unix, another-robust operating system, but was an official corporate
    product, unlike Unix, which had always been regarded as software for hackers.
    Windows NT, too, was unashamedly meant as the leading Unix-killer, when against
    expectations, Unix—not VMS—emerged as the leading enterprise operating system.


    NT''s chances looked good. By the late 1980s, Unix was highly fragmented, each
    vendor offering a slightly different version; this meant that application software
    had to be rewritten many times, and that users were locked into the software of
    one supplier. Because Unix had also failed to embrace fully the new wave of graphical
    interfaces, solutions in this area were crude when compared with the Apple Macintosh
    or Microsoft Windows. Windows NT, by contrast, was designed to marry the power
    of a VMS-like operating system with the elegance and usability of Windows 3.1.


    But plenty was happening outside Microsoft''s immediate sphere of interest. In
    1991, Tim Berners-Lee, a British physicist at CERN, the European Centre for Nuclear
    Research, released for public use a hypertext system that he had been developing
    over the past two years. The system, which he called the World Wide Web, ran across
    the Internet, then small-scale and used mostly by academics.


    Also in 1991, a new programming language Java was being drawn up by a team at
    Sun Microsystems. Born originally as an attempt to develop an interactive set-top
    box for the TV industry, Java was later adapted for use on the Internet. An important
    feature of Java was portability: The same program could run without modification
    on a wide range of hardware, a novelty at the time.


    Although the threats these developments represented at the time were negligible
    compared to their later impact, it is possible that Microsoft was tracking them
    in 1991. The Internet was well known enough, the Web in the public domain, and
    Sun was a competitor whose moves were certainly watched with interest. But surely
    it is impossible that, in the same year, Microsoft could have had even the merest
    whisper of a suspicion that a key element of an equally potent challenge was to
    take shape in the bedroom of a second-year computer science student in Helsinki,
    the capital of Finland.


    As one of the most northern capitals in the world, Helsinki is a city of seasonal
    extremes: dark, cold winters with only a few hours of daylight, and bright summers
    where the days never seem to end. Geographically, Helinski is close to Russia''s
    Saint Petersburg, and parts of it are visually sim-'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# The Coolest Year


    ilar; culturally; it has closest ties with Sweden, of which for centuries Finland
    formed a province. When Russia invaded and annexed Finland as part of its empire
    in 1809, it separated from Sweden. Finland only won full independence in 1917.


    Two cathedrals form important landmarks on the eastern side of the city center.
    The Lutheran church possesses an elegant neo-classical exterior, but takes the
    form of within a huge stone almost devoid of ornament; the Russian Orthodox Uspensky
    Cathedral is a typical concoction of onion domed towers outside, and icons inside.
    Helsinki is compact; its low buildings and broad streets are mostly laid out on
    two grid systems that abut at a slight angle. Green spaces abound, and the sight
    and smell of the sea, which surrounds Helsinki on three sides, is never far away.


    Into this ordered but individual, Linus Benedict Torvalds was born on 28 December
    1969. Linus explains the significance of this day in his culture: “It is special
    in the same way most days are special—many days have traditional meaning. December
    28th is ‘menlösa barns dag,’ which means roughly ‘day of children without defects’
    although ‘menlos’ is fairly old Swedish and a lot more poetic than ‘without defect.”


    The name Linus was an unusual choice: “not unheard of,” Linus explains, “but not
    exactly common” in Finland either. The name itself has a history that stretches
    back to the roots of Western civilization. It is mentioned in Homer’s Iliad in
    the original Greek form Linus, where it is associated with a story of mourning.
    There is also a St. Linus, who is traditionally listed as the second pope after
    St. Peter. Another famous Linus—though better-known for his last name—is the American
    inventor Linus Yale.


    But rather than any of these, Linus was named after the U.S. scientist Linus Pauling,
    who received two Nobel Prizes: “I think I was named equally for Linus the peanut-cartoon
    character,” Linus adds, and notes that this makes him “a mix of 50 percent Nobel-winning
    chemist and blanket-carrying cartoon character.”


    Torvalds is a rare surname: “There are probably something twenty-five people in
    the world-fashioned Nordic name with that last name,” Linus says. “Torvald” is
    “a rather odd,” Linus explains. The genitive ‘s’ is unusual, an old way of turning
    a regular name into the name of a farmstead—and there into a surname.” Linus explains
    that it was his paternal grandfather “who took the name for personal reasons,
    namely, that he didn’t like his family.” As a re-'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# 8 REBEL CODE


    sult, he says, “to my knowledge, all Torvalds in the whole world are [his] descendants.
    In other words, one of the most famous names in computing is “completely made
    up, and not more than two generations ago.”


    The Torvalds clan is not just for its unusually small size: A surprising number
    of them are journalists. Linus runs down the list: “My dad, Nils Torvalds: reporter
    for Finnish radio. His brother, my uncle, Jan Torvalds: Finnish TV. My paternal
    grandfather—the founder of the Torvalds clan, deceased—used to be a newspaper
    reporter, writer, and poet. My mom: Mikke (Anna) Torvalds: working at the Finnish
    News Agency. Used to do translations, does news graphics these days. My sister,
    Sara Torvalds: used to do translations for the Finnish News Agency too, but is
    moving more towards books and films.


    The Torvalds family formed part of the Swedish-speaking community in Finland,
    over 300,000 strong in a total population of 5 million. That their mother tongue
    has nothing in common linguistically with the Finnish language that surrounds
    them doubtless helped them become a very close-knit group. Reflecting this, Swedish
    speakers call this society within a society “Ankdammen”—the Duck Pond. One of
    Linus’s friends from Helsinki, future fellow hacker Lars Wirzenius, says, “Almost
    all Swedish-speaking people know lots of other Swedish-speaking people, who know
    lots of other Swedish-speaking people, and the result is that everyone either
    knows, or knows someone who knows someone.


    Growing up as a member of the Duck Pond, Linus spoke Swedish at home and with
    family friends, and only started learning Finnish when he was five. Contact with
    English, which would become a crucially important factor in his work, came a few
    years later.


    It was around the same time that he first encountered a computer. Linus explains
    that his maternal grandfather was a statistician at Helsinki University; he bought
    a Commodore Vic-20 microcomputer, “one of the first to get on the market, at least
    in Finland.” He adds, “It wasn’t exactly what you’d call a number-cruncher today,
    but it was certainly faster than any calculator. The speed of the processor was
    just 1 Megahertz (MHz), a thousandth of that modern PCs.


    Linus recalls that his grandfather “bought the Vic-20 for his own needs to do
    math,” but soon asked his young grandson to help. “I think my grandfather wanted
    to learn, so he made me help him,” he explains. “So I started helping him with
    the computer, and then I did my own stuff on the side.”


    Linus recalls, “I had the Vic for five years because I couldn’t afford to upgrade.
    I programmed in Basic, maybe the first two years.” But Linus'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# The Coolest Year


    soon moved on from this popular beginner''s programming language to something
    more demanding; assembly language.


    Assembly language commands are easier for the computer to act on but harder for
    programmers to think. “I of kind of got used to doing stuff myself by reading
    books about assembly language


    His next machine, and the reasons for that, are also highly characteristic of
    the later Linus. “I was looking at different machines—I didn''t want a PC because
    I really disliked the Z80 [chip] architecture and in the PC, the chip was essentially
    the same,” he says. That is, he decided not to buy a PC because he disliked the
    design of the Intel chip family that lay at its heart—an unusual way of looking
    at things.


    Back then I was doing just assembly language, and I didn''t want to have anything
    with that [particular processor].” Because Linus was writing “low-level” code,
    which interacted directly with the chip, he was more conscious of the merits and
    demerits of the various chip families.


    Most programmers wrote in “high-level” languages like Basic, which effectively
    shielded him from the details of the hardware.


    As Linus himself says, he has always been a “low-level” person. There are probably
    reasons for his early interest in this aspect. One was his love of programming
    at the most fundamental level. The other is pragmatic: “I had been a performance
    junkie since forever. When you had to write games for a slow 1 MHz [processor],”
    Linus explains, “you have to be kind of crazy and tweak cycles.”—Tweaking cycles”—would
    later mean that Linux was faster and leaner than comparable programs.


    In the end, Linus chose an unusual micro for his next machine, the Sinclair QL
    (“Quantum Leap”). This was a typically quirky product from the British inventor
    Sir Clive


    Linus had been content to put up with Sinclair’s QL—although he had some fairly
    obvious shortcomings— a simple reason. The main thing he wanted, he explained,
    was “a machine at home that does multitasking.” Even though the Sinclair QL was
    in many ways a toy, it had one'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# 10 REBEL CODE


    very powerful feature, thanks to its choice of chip: it could run several programs
    simultaneously, just like commercial minicomputers.


    This area of computing—multitasking—led him to start coding the simple program
    that would eventually turn into Linux. But this was still some years off the time
    when Linus was hacking on his Sinclair QL. First, in the fall of 1988, he entered
    Helsinki University to study computer science, which by now already looked likely
    to turn from a passion into a profession.


    At university, Linus found the same tendency for the two language communities
    in Finland to keep to themselves. His fellow student in computer science, Lars
    Wirzenius, comments that “at that time there weren’t many Swedish-speaking computer
    science students, and those that were, were at least a couple of years older than
    we.” It was therefore only natural that a pair of Swedish speakers isolated among
    the Finnish majority of the new intake for computer studies should gravitate towards
    each other.


    Wirzenius recalls the first time he met Linus, “it was one of the introductory
    lectures for new students., Wirzenius did not notice much of his friend that day
    except “the end of his big nose to twitch up and down when he speaks, and it is
    fun to look at.” Aside the nose, which, in turn, is not that, little in Linus’s
    appearance is out of the ordinary: He is of medium height, with brown hair; his
    blue eyes gaze steadily behind his glasses. The eyebrows, are remarkably dark
    and bushy; jar slightly over the otherwise boyish face.


    In an effort to meet more student members of the Duck Pond, Wirzenius and Linus
    joined one of the many societies that form an important element of Helsinki University’s
    student scene. “The club that Linus and I joined was called the Spektrum, Wirzenius
    recalls, “which is the Swedish-speaking club for people who study math, computer
    science, physics, or chemistry.” As far as the teaching at the university was
    concerned, Wirzenius explains “there isn’t actually a curriculum which says that
    during the first year you have to take this course and that the so-called academic
    freedom in Finland is interpreted so that students can take any course they want,
    mostly in whichever order they


    The nominal study length is five years, but most people study for six or seven
    years,” he continues. Alongside the main courses there were various ancillary
    subjects. “To get a computer science degree, you have to study a certain amount
    of math, and also some other subjects. Each week we got some exercises to do,
    and then we had small groups of people and a teacher who asked each one of us
    to demonstrate some of the'
