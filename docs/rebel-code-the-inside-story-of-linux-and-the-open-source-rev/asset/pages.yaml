    code-named Merced, dubbed officially “Itanium,” and often referred to as IA-64.
    The “64” was significant because it indicated that this was the 64-bit version
    of the venerable Intel x86 family.


    GNU/Linux took an early lead here to the efforts of VA Linux’s Larry Augustin.
    He approached Intel with the idea of port GNU/Linux to the IA-64 platform because
    he had noted how traditionally the open source community always saw hardware and
