  md: '# ACHNOWLEDGMENTS


    Unless otherwise noted, the vast majority of quotations in this book are drawn
    from interviews conducted between September 1999 and September 2000 in person,
    by telephone, or by e-mail. These have been supplemented by extensive material
    taken from an interview with Linus Torvalds at a critical juncture in his life,
    in December 1996, as well as other interviews with key players from the last three
    years.


    I am particularly grateful to all these people, who somehow managed to take time
    from their important work and hectic schedules to talk to me, often at great length.
    My only regret is that because of space constraints I was not able to introduce
    more of their memories, thoughts, and comments.


    Despite this generous help, I am conscious that there will be mistakes and omissions
    in this book, for which I alone am responsible. I would be happy to receive corrections
    as well as general comments on the text at glynnmoody@rebelcode.net.


    The 1996 interview with Linus Torvalds was carried out for a feature commissioned
    by Sean Geer, of the UK edition of Wired magazine. The feature eventually appeared
    as "The Greatest OS That (N)ever Was" in the August 1997 issue of the U.S. edition
    of Wired, where it was shepherded through Jim Daly, a features editor at the time.
    Jim kindly suggested me to Jacqueline Murphy of Perseus Books when, in 1999, she
    was looking for someone to write a book about GNU/Linux and open source. My thanks
    go to him, and even more to Jacqueline, my editor, who not only followed up the
    suggestion but also persuaded me that I should undertake this project. I am also
    grateful to Jacqueline''s assis-'
