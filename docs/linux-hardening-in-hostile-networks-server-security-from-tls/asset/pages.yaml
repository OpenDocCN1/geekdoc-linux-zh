  md: '# Security Risks


    # 225


    or impersonate her bank and grab her credentials when she logs in. Over the years,
    attackers have come up with a number of different ways to attack TLS. In this
    section, I will discuss some of those specific attacks and how to protect against
    them.


    # Man-in-the-Middle Attacks


    One of the most common ways that an attacker can compromise your TLS connection
    is by a MitM attack. With a MitM attack, the attacker sits between you and the
    site you want to visit on the network. It convinces you that it is the remote
    server and convinces the remote server that it is you. The attacker terminates
    the TLS connection between you and him, who gets a decrypted copy, then he starts
    a new TLS connection with the server. He can then capture all the traffic between
    you or the server before he forwards it.


    The most important way for you to protect MitM attacks with TLS is to confirm
    that you are being presented with a valid certificate and are talking to the correct
    host. In a web browser, you can do this by looking for an icon in your URL bar.
    The lock icon will turn green in the case of an Extended Validation (EV) certificate—a
    certificate that requires the purchaser to undergo stricter checks to prove she
    is who she says she is. Many attackers who try to Mit connections will generate
    a self-signed certificate and present it to you hoping you ignore the browser
    warning that pops up and on the site. If you see a browser warning about an invalid
    certificate for a site—in particular, an important site like a bank, an e-commerce
    site, or your email—don''t click the warning! There''s a good chance someone is
    trying to Mit your connection.


    Another trick allows for the attacker to register a site that looks like the target
    site (so, say, bankofamerica.com) and purchase a valid certificate for misspelled
    name. They then send a convincing-looking email that appears to come from the
    bank but has a link to this misspelled site. Your browser sees that the certificate
    is valid for name so you never get a browser warning. The best way to protect
    against this kind of attack is to inspect the URL in the URL bar for any site
    you visit—in particular, sites you load from a link in an email.


    # Downgrade Attacks


    Sometimes taking risk that you might notice the invalid self-signed certificate
    or misspelled hostname, an attacker might attempt a TLS downgrade attack. This
    kind of attack is particularly common with HTTPS. In that case, the attacker intercepts
    your request to the TLS-protected HTTPS version of the site and sends you a redirect
    that sends you to the HTTP version instead. This happens in the blink of an eye,
    so if you aren''t paying attention and you''re expecting the HTTPS site, you may
    not notice you have been downgraded to HTTP and continue to use the site. Since
    everything is now going over plain text, the attacker can easily capture all of
    your traffic.'
