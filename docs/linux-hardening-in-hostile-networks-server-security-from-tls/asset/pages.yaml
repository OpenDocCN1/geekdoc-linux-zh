  md: '# Section 1: Essential Network Hardening


    DNS Servers DNS servers are a little different in that DNS listens on port 53
    on both TCP and UDP so DNS servers need rules for all both protocols:


    ```

    -A INPUT -m tcp -p tcp --dport 53 -j ACCEPT

    -A INPUT -m udp -p udp --dport 53 -j ACCEPT

    ```


    And the complete file would look like this:


    ```

    *filter

    :INPUT ACCEPT [0:0]

    :FORWARD ACCEPT [0:0]

    :OUTPUT ACCEPT [0:0]

    ```


    ```

    -A INPUT -i lo -j ACCEPT

    -A INPUT -p icmp -j ACCEPT

    -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    -A INPUT -m tcp -p tcp --dport 22 -j ACCEPT

    -A INPUT -m tcp -p tcp --dport 53 -j ACCEPT

    -A INPUT -m udp -p udp --dport 53 -j ACCEPT


    -A INPUT -j LOG --log-prefix iptables-reject "

    -A INPUT -j REJECT --reject-with icmp-host-prohibited

    ```


    COMMIT


    Other Servers For any other servers, just adapt the above examples for the web
    servers and DNS servers for whatever ports and protocols your service listens
    on. Like with the above examples, make sure your ACCEPT rules are above the REJECT
    rule.


    # Egress Rules


    Some administrators may consider local egress options, and it''s true that if
    an attacker can get root on a server he can undo any of it egress rules so can
    talk to the outside world. Since we are taking a deny-by-default stance, it doesn''t
    hurt to create some permissive rules for your internal network and block general
    Internet traffic. After all, the attacker may need basic Internet access to be
    able to download a root exploit to begin.


    The egress rules we set up this host to talk to your loopback interface, ping,
    and allow established traffic just like we did with our INPUT rules:


    ```

    -A OUTPUT -i lo -j ACCEPT

    -A OUTPUT -p icmp -j ACCEPT

    -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


    We add an additional rule that allows the host to talk to other hosts on its internal
    network (for this example, we assume the network is 10.0.0.x):


    ```

    -A OUTPUT -p tcp -d 10.0.0.0/255.255.255.0 -j ACCEPT

    -A OUTPUT -p udp -d 10.0.0.0/255.255.255.0 -j ACCEPT

    ```


    Finally, we add the LOG and REJECT rules like with our INPUT rule:


    ```

    -A OUTPUT -j LOG --log-prefix iptables-reject "

    -A OUTPUT -j REJECT --reject-with icmp-host-prohibited

    ```'
