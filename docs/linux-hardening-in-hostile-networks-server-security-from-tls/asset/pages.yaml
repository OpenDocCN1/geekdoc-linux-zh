  md: 'database communications with TLS so the client not only communicate with the
    database over an encrypted channel, the client can also make sure it is talking
    directly to the database and not vulnerable to a MitM attack. As you''ll see,
    MySQL and Postgres each have their own approaches to tackle this problem.


    # Database Network Access Control


    The goal behind network access control in a database is to provide defense in
    depth. Ideally, databases are put in the deep recesses of the network and rely
    on firewall rules to protect them from the outside world. Security-minded administrators
    take the extra step of isolating applications and databases in their own network
    subnet and use firewall rules to restrict which applications can talk to the database.
    People make mistakes, though, and if your only line of defense is a firewall rule,
    one mistake could expose your database to the Internet. You can reinforce the
    network access control set at the firewall level within the database itself so
    that if there is a problem with a firewall rule, your database will still block
    unauthorized traffic.


