  md: '# Two-Factor Authentication with SSH


    Disabling password authentication with SSH and relying strictly on keys is a great
    first step to hardening SSH, but it is still without its risks. First, while you
    may follow my advice and protect your SSH keys with a password, you can''t guarantee
    that every user on the system does the same. This means if an attacker were able
    to access a computer for a short time, he could copy and use the keys to log into
    your system. If you want to protect against this kind of attack, one approach
    is to use two-factor authentication for SSH.


    With two-factor authentication, a user must provide both an SSH key and a separate
    token to log into the server. Time-based tokens are the most common, and in the
    past they required you to carry around an expensive device on your keychain that
    update itself with a new token every 30 seconds. These days, there are many of
    two-factor authentication solutions that work in software and can use your cell
    phone instead of a hardware token.


    There are several phone-based two-factor authentication libraries out there. Some
    use the SSH client ForceCommand option, with a system-wide pluggable authentication
    (PAM) module. Some approaches are timebased, so they work even if your device
    is disconnected from a network, while others use SMS or phone calls to transfer
    the code. For this section, I have chosen the Google Authenticator library for
    a couple of


    +   - It''s been around for a number of years and is already packaged for a number
    of Linux distributions.

    - The Google Authenticator client is available for multiple phone platforms.

    - It uses PAM, so you can easily enable it system-wide without having to edit
    ssh config files for each user.

    - It provides you with backup codes she can write down in case your phone is stolen.


