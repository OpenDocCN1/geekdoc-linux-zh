  md: '# Section 1: Security Fundamentals


    These days, password-cracking techniques are very sophisticated and fast, so many
    of the approaches for picking a password a few decades ago no longer apply. In
    general, attacks against passwords have involved making many password guesses
    until you guess the right password. Password-cracking programs might use regular
    dictionaries full of thousands of words and run them one by one. Other programs
    would simply do a brute force attack; in the case of a 6-character numerical password,
    you might start with 000000 until you get to 999999, which would take a million
    guesses. This might seem like it would take a long time, but when you consider
    that a modern computer can make hundreds or thousands of guesses per second in
    some cases, short passwords or passwords that can be found in a dictionary are
    trivial for an attacker.

    Unfortunately, many companies still refer to some of these outdated approaches
    in their password policies and as a user, ends picking insecure passwords that
    attackers can gain. Next, I consider the major password restrictions enforced
    in password policies and talk about what works and what doesn''t in the modern
    age. Finally, I tell you my preferred general-purpose password policy.


    # Password Length


    The idea behind placing restrictions on password length is to increase the number
    of guesses a brute force attacker may have to make. As you add to the minimum
    password length, dramatically increase the potential combinations and make a brute
    force attack more difficult. For instance, let''s assume that you only have passwords
    that are made up of lowercase letters in the alphabet. Here are the total number
    of password combinations for a few different password lengths:


    +   - 4 characters: 456,976 combinations

    - 5 characters: 11.8 million combinations

    - 6 characters: 308.9 million combinations

    - 7 characters: 8 billion combinations

    - 8 characters: 200 billion combinations

    - 9 characters: 5.4 trillion combinations

    - 10 characters: 141 trillion combinations

    - 12 characters: 95 quadrillion combinations


    As you can see, even increasing the minimum password length by one character dramatically
    increases the number of combinations. Based on this list, you might think that
    even a 6-character password attacker who do a million guesses per second could
    crack a 6-character password in 5 minutes or an 8-character password in 2.5 days—but
    it would take 3,026 years to go through all of the combinations of a 12-character
    password. This, by the way, is why attackers are far more likely to use a dictionary
    attack instead of brute force, wherever possible.

    I''ll get more into sophisticated password-cracking approaches in Section 2 of
    this chapter, if your 8-character password is in an English dictionary, even if
    a brute force attack might take days, a dictionary attack would take seconds.'
