    The Qubes installation process is either pretty straightforward or very difficult,
    depending on your hardware. Due a combination of the virtualization and other
    hardware support Qubes needs, may not necessarily run on hardware that previously
    run Linux. The Qubes provides a compatibility list on site that you can get a
    sense of what hardware work, and we are starting to create a list of certified
    hardware from the Purism Librem 13 laptop is the first laptop officially certified
    to run Qubes.


    Like most, you get the opportunity to partition your disk and either accept their
    defaults or take a manual approach. Qubes defaults to encrypting your disk so
    you will need to have a separate /boot partition at your least. Once the installer
    completes, you will be presented with a configuration wizard where you can'
