- img_proc: true
  md: '# Create the Key Table


    The Key Table tells OpenK the location of the keys it should use for particular
    key names. In the Signing Table we named our keys, and in the Key Table we map
    them to the domain, selector, and key file. Based on the preceding Signing Table,
    I would create the following /etc/openkim/keytable file:


    ```

    example.com example.com:201609:/etc/openkim/keys/example.com.private

    example.net example.net:201608:/etc/openkim/keys/example.net.private

    ```


    The first field in this file is the key name that you used in the Signing Table.
    The next field is the domain:selector:key file, where the domain is the domain
    name the email is from, the selector is a unique name that will be looked up in
    DNS to pick this particular key, and the key file is the full path to the key
    you will generate. You can name the selector whatever you want but convenience
    is to rotate these selectors after the year and month they are created, as best
    practice is to rotate keys frequently (ideally every month, or worst every six
    months). Putting the year and month in the selector makes it easier to keep track
    of the keys and lets you rotate them.


    # Create the Keys


    Now you are ready to create a key for each of your domains using the openkim-genkey
    command.


    ```

    sudo openkim-genkey -b 2048 -s 201608 -d example.com

    sudo mv 201608.private /etc/openkim/keys/example.com.private

    sudo mv 201608.txt /etc/openkim/keys/example.com.txt

    sudo openkim-genkey -b 2048 -s 201608 example.net

    sudo mv 201608.private /etc/openkim/keys/example.net.private

    sudo mv 201608.txt /etc/openkim/keys/example.net.txt

    ```


    The openkim-genkey takes a couple of arguments. The -b argument defines the size
    of the key to use. Here we use 2048-bit key, which is acceptable at this time.
    The -s argument is the selector of the key you are using for this, so if you changed
    the selector defined in the key table. The -r option restricts the key to be used
    for signing only, and the -d option adds a nice comment to the end of the DNS
    record it will generate that lets you know what domain it''s for.


    The openkim-genkey command will create two files: a .private and .txt file that
    are named after the selector you pass in the -s argument. So, in the preceding
    example, it would create a 201608.private and 201608.txt file. Next, move and
    rename these files to match the name of their respective domains so they match
    the files you defined in /etc/openkim/keytable. In the preceding example, we would
    end up with four files in /etc/openkim/::


    ```

    sudo ls /etc/openkim/keys

    example.com.private

    example.com.txt

    example.net.private

    example.net.txt

    ```'
