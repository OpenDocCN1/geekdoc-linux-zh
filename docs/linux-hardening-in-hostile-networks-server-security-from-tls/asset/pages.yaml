    # Summary


    Network hardening is a layered process. The first layer is allowing only the traffic
    you want on your network via firewall rules and blocking illegitimate traffic.
    The next layer is protecting legitimate network traffic from snooping by encrypting
    it with TLS and by wrapping any traffic between two networks that has to go over
    the public Internet with a VPN. Finally, once all of that is protected, you can
    focus on preventing an attacker from ever knowing you are using a network resource
    by masking the metadata in traffic with Tor.'
