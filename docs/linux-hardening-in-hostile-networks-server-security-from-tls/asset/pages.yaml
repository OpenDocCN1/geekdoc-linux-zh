    # Workstation Security Fundamentals


    One of the simplest attacks against a sysadmin''s workstation is not a virus or
    a spear phishing attack, it''s walking up to the workstation when they''re not
    around. Between lunch, breaks, and meetings there are many opportunities for an
    attacker to walk up to the unattended computer and take advantage of the privileged
    access a sysadmin typically has to the network. After all, most people log out
    of all of their SSH sessions when they step away from the computer, so if an attacker
    can walk up to the computer, they may find you are already logged into a computer
    they are interested in with root privileges.'
