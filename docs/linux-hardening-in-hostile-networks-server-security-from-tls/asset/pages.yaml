    # Summary


    In this chapter, we focused on email hardening. As you can see, the majority of
    email-hardening steps center on stopping spam. In Section 1, we discussed how
    to stop your server from becoming an open relay. In Section 2, we expanded on
    that by adding authentication to email services as well as protecting email traffic
    with TLS. Finally, in Section 3, we discussed some of the more advanced methods
    of spam prevention with SPF, DKIM, and DMARC.


    More big email providers these days implement all of the above steps to harden
    their own email servers and assume that other legitimate email servers on the
    Internet do the same. Even if a remote server might accept your mail, it might
    flag it as more likely to be spam the fewer of these protocols you put in place.
    It’s important that your email gets delivered and not get flagged as spam itself,
    you will definitely want to consider implementing all of the advanced hardening
    steps.'
