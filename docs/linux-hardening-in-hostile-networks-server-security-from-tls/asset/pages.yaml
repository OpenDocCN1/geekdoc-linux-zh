  md: '# B


    # # SSL/TLS


    Throughout the book, I have explained how to protect various services with TLS.
    Instead of bogging you down with the details of how TLS works in almost every
    chapter, I''ve decided to put those details here as a quick reference in case
    you are curious how TLS works, how it protects you, its limitations, some of its
    security risks, and how to mitigate them.


    # ## What Is TLS?


    Transport Layer Security (TLS) is a protocol you can use to protect network communications
    from eavesdropping and other types of attacks. It is an update to the Secure Sockets
    Layer (SSL) protocol that preceded it, and often people (those who work in security)
    still refer to both collectively as “SSL” or use the terms “SSL” and “TLS” interchangeably.
    As the name denotes, TLS protects traffic at the transport layer so you can wrap
    a number of higher-level-plain protocols in TLS to secure them. Some popular examples
    of protocols that can be wrapped in TLS include HTTP (HTTPS, that lock icon in
    the URL of your browser), FTP (FTPS, not to be confused with SFTP which uses the
    SSH protocol), IMAP (IMAPS), POP3 (POP35), and SMTP (SMTPS), others. As you can
    see, it’s common to add an “S” at the end of a protocol that is wrapped in SSL
    or TLS.


    TLS provides you with two protections. The first protection, and the one most
    associated with TLS, is that TLS *encrypts* your traffic to protect it from eavesdropping.
    The second and equally important protection is that TLS *authenticates* the server
    to the client (and optionally the client as well) with the use of signed certificates.
    This means if you visit your bank''s website, TLS can help you be sure that you
    are talking directly with your bank and not some imposter, and can protect your
    password and banking information from prying eyes.


    # ## Why Use TLS?


    You should use TLS whenever possible on the modern Internet. For starters, anytime
    you are submitting sensitive data such as a password, a credit card number, or
    other secrets over a network, it should be encrypted and protected using TLS.
    If you are setting up services that communicate over a public network, including
    a cloud network, you should definitely use TLS not just to protect any secrets
    across the open'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'network, but so you can authenticate the remote server and protect yourself
    against MitM attacks. Even if you are setting up services on a private network
    under your control, you should use TLS.


    In the past, some administrators avoided TLS because of the extra computational
    overhead and latency its encryption and initial handshake required. These days,
    computers are sufficiently fast that this is no longer a real concern. Also, in
    the past valid TLS certificates had to be purchased through a CA, and in many
    cases this could be expensive. These days, services like Let''s Encrypt enable
    you to get valid, TLS certificates for free. The only real excuse not using TLS
    is the extra work researching how to set up services to use it, but this book
    has guides for most of the services you''d use.


    # How TLS Works


    Many guides walk through how TLS works end getting bogged down in talking you
    through the initial TLS handshake. When I''m conducting phone-screening interviews
    with a security position, I''ve been asked to describe what TLS is and how it
    works. I can always tell when they are reading from the Wikipedia page because
    they describe the handshake protocol in shocking detail, yet can''t explain how
    a certificate works. While it certainly doesn''t hurt to know all the details
    about what communication happens in a TLS handshake, and what order they happen,
    honestly those details are most useful if you are trying to find a security flaw
    in the protocol.


    That said, there are a few main things that are important to understand about
    the TLS handshake. During the handshake, the client and server communicate with
    each other which TLS protocols and ciphers they support and come to an agreement
    on which to use. The handshake is also when the server provides a certificate
    to the client and authenticates itself (and optionally the client authenticates
    itself to the server with a certificate). Finally, the client and server securely
    agree on a secret they will use to encrypt subsequent communications.


    What helped unlock my understanding of TLS a number of years ago was a realization
    of what a certificate, a CA certificate really, so that''s where I''m going to
    focus in my explanation. If you are implementing TLS or debug TLS problems, the
    main thing you''ll run into is problems with certificate validation, anyway. TLS
    certificates work at a high level similar to PGP public-key cryptography, so to
    some degree you can think of a TLS certificate like a PGP public key and a TLS
    key as a PGP private key.


    Each CA has its own public certificate and private key, and web browsers and operating
    systems so all of the official CA certificates within them and implicitly trust
    them. When you buy a certificate from a CA, you send it a certificate signing
    request (CSR) that contains the information about your site, including organizational
    information and the hostname or hostnames for which the certificate is valid.
    When you generate a CSR, you also get a corresponding private key that you do
    not'
