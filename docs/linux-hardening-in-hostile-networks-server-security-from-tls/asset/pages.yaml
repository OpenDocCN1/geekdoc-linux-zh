    # Security Patch Notifications


    Equally important applying security patches when your software needs to be patched.
    Each major Linux distribution should provide some sort of mailing list for security
    updates. Any third-party software you outside of your distribution should also
    have some means to alert you to security patches. Subscribe to all lists with
    an address that goes to each member of the team, and have a procedure in place
    for how you respond to emails from the list. A simple procedure you can adapt
    to your organization might go like this:


    +   1. A security advisory comes in one of the security mailing lists.

    2. An administrator queries the environment to see whether software is installed
    on any computers.

    3. If the software is in use and isn''t patched, create a ticket that contains
    the security advisory and explicitly states the patched version of the software
    to which you will upgrade. I recommend adding a tag such as “Security Patch” in
    the title of these tickets or otherwise tagging them it''s easier to find them
