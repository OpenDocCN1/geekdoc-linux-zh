    # Essential Security Principles


    Whether you are trying to secure a computer, a car, or a castle, there are certain
    fundamental principles you can apply. In this section, I highlight some of the
    important security principles that are commonly applied to computer security,
    and in particular, defense and hardening.


    # Principle of Least Privilege


    A phrase that often in security circles is the “principle of privilege.” This
    principle simply states that everyone should only have the minimum level of privilege
    they need to do a particular job and nothing. For instance, some cars come with
    a “valet key” in addition to a regular car key. The valet key can start the car
    and open the door, but it cannot open the trunk. The idea behind the valet key
    is to give you the ability to store valuables in your car that a valet can''t
    get. The valet only needs the privilege of driving your car, not opening the trunk.
    Likewise, your average employee at a company does not have access to everyone''s
    salaries, but a manager can view the salaries of her peers or bosses, whereas
    an employee in Human Resources probably can view everyone''s salary as it''s required
    for him to do his job.


    As applied to computer security, the principle of least privilege guides us when
    we are granting access to a user or a service. While systems administrators generally
    are required to have global super privileges on the machines they administer,
    average software engineer probably does not. At least, through thoughtful use
    of tools like sudo (covered more in Chapter 3, “Server Security”), if a software
    engineer does need some level of elevated privileges on a machine, you can grant
    those specific privileges without granting full root access. If a certain type
    of user doesn''t really need shell access to do his job, the principle of least
    privilege would tell us not to let him SSH in it.


    When it comes to services and servers, the principle of least privilege applies
    directly to your firewall rules. If a service doesn''t need to be able to talk
    to another service, it shouldn''t be allowed to. Taken to its logical conclusion,
    this means the administrator should create firewall rules that deny all incoming
    traffic by default and only allow services that need to talk to it in order to
    do its job. If a service doesn''t need root privileges, it shouldn''t run as root
    but as some less-privileged user. For instance, some services like Apache and
    Nginx do need root privileges on most systems that'
