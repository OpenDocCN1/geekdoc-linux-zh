  md: '# Section 1: Essential Email Hardening


    # Open Relays


    As an email administrator, one of your primary security responsibilities is preventing
    your email server from being used as an open relay. Email servers usually perform
    two primary functions: receive email for any addresses for which they are responsible,
    and let computers send email to other destinations through themalso known as relaying).
    Usually an email server will only accept email for the domains it has added to
    its configuration as a destination and should only allow authorized computers
    to use it as a relay. An open relay, on the other hand, is an email server that
    will relay email on behalf of any sender to any domain. When a spammer has identified
    your email server as an open relay, you can expect to see your email volume dramatically
    increase as they send out much spam as before your email server gets added to
    one of a number of spam blacklists on the Internet.


    Spam blacklists are databases of IP addresses that have been reported as spam.
    There are a number of different blacklists that are maintained by different organizations
    all with the same goal: identify misbehaving email servers on the Internet so
    that other servers can block them. One easy way to show up on a spam blacklist
    or a blacklist maintainer you will find, and in either case you will show up on
    the blacklist. Another way to end up on a blacklist is if your users send too
    much email that gets some kind flagged as spam. Once on the list, also email servers
    that use blacklist to filter out spam will block emails from your IP (with a notice
    in the reply stating what blacklist you are and how to be removed). To send email
    to those domains again, you will have to petition the blacklist to remove the
    IP.


    # Basic Email Hardening


    Now that you are familiar with some of the principles around email security, we
    can dive into how to translate these principles into specific configuration settings.
    While we are using the Postfix email server for our examples, you should be able
    to translate the same configuration concepts into your preferred email server.
    The primary goal is to assume you have some kind of basic /etc/postfix/main.cf
    configuration file in place either via the default configuration file that came
    with Postfix, the configuration wizard that a Postfix config you have inherited.
    Note that for each of these changes, you will need to reload Postfix with the
    following:


    ```

    sudo postfix reload

    ```


    # Allowed Networks


    The first restriction you want to put in place is to limit what IP addresses you
    can use to relay mail. It is particularly important if your server is connected
    to the public Internet to restrict this to local networks—otherwise you would
    create an open relay. Also, while you should use firewall rules to restrict what
    servers can access this service, you also want to reinforce these restrictions
    within the email server itself.'
