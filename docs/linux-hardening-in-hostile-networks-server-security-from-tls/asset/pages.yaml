  md: '# Section 3: Walk Through a Sample Investigation


    As you can see from the preceding example, it''s very important to limit what
    commands run on a live machine if you suspect it might have been hacked. If a
    sysadmin had run ps, ks, or w (all common troubleshooting commands that are almost
    reflexes to a sysadmin on the command line) they would have wiped out evidence
    that tied the attacker to a particular time period on the system.


    # Cloud Incident Response


    Cloud servers provide an additional challenge to incident response unlike with
    colocated servers or even virtual machines, cloud server hardware is generally
    outside of your control and in many cases what you are limited by dashboards and
    APIs. While you can perform a forensics investigation largely the same way, how
    you get that might be very different. In this section, I highlight a few techniques
    that you can apply to different cloud servers. One downside to the cloud is that
    every provider tends to do things a bit differently, apart from discussing a few
    special considerations for Amazon Web Servers (currently the most popular cloud
    server provider) I try to make my recommendations more generic so you can adapt
    to whatever provider you choose.


    # Stopping Cloud Servers


    The first challenge when dealing with cloud servers is how to shut down without
    harming evidence. This is challenging because many interfaces for cloud servers
    don''t give you the equivalent of pulling the power from the server. Instead,
    when you stop the server it sends the operating system a signal to halt as though
    you had briefly pressed (but not) the power button. The problem with this is if
    the system runs all sorts of commands when you halt it, an attacker could easily
    add scripts that are triggered when the system halts that erases their tracks.
    The first thing to figure out for your cloud provider is whether they provide
    any method to power down a server without halting (perhaps via some forced stop).


    # Snapshots


    One advantage to cloud servers is that they generally run on VMs and, as such,
    expose a number of features unique to VMs, snapshots in particular. With snapshots,
    you can freeze the state of your system at a particular point in time and go back
    to that later state. Some providers let you perform whole snapshots that not only
    capture disk state as well. This kind of snapshot is particularly valuable because
    it allows you to freeze the system state the moment you detect an intruder (or
    ideally before you check) and replay that state over and over again as you perform
    your investigation. If the snapshot contains RAM state, it also means you can
    query the system for running processes, /dev/shim and any other ramdisks, and
    in general safely poke around the system without fear of erasing evidence, since
    you can replay the snapshot at any point. Even if you can''t take a full snapshot,
    most cloud providers provide the capability to perform a disk snapshot.


    Since snapshots can be so valuable in an investigation, you should make it part
    of your incident response plan to perform a snapshot on a suspect server, ideally
    before you'
