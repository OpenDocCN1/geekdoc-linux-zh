    # # DNSSEC Terminology


    Many acronyms and a lot of new terminology come up when you read

    DNSSEC section. Here are a few common terms with which you''ll want to be

    ainted as you use DNSSEC:


    +   - **Resource record (RR):** This is the smallest unit of data in a zone, as
    a single

    A record, NS record, or MX record.

    - **RRSET:** A complete set of resource records. For instance, an RRSET might
    be

    all NS records or A records for a particular name.

    - **Key-signing (KSK):** DNSKEY records in a zone.

    - **Zone-signing (ZSK):** Signs all of the other records in a zone.

    - **Secure entry (SEP):** A flag set in KSK to denote it as a KSK.


    While best practice dictates a separate KSK and ZSK, it is not an actual requirement.

    When we cover DNSSEC implementation, I will discuss the main differences

    between the two key types and having separating keys is considered a best practice.


    # # DNSSEC Record Types


    DNSSEC also has introduced a number of new DNS record types into the mix. These

    records are published with the zone along with the rest of your DNS records and
    are

    pled down by any DNSSEC-enabled query:


    +   - **DNSKEY:** This is a public key for the zone and can either be a KSK or
    ZSK.

    - **Resource signature (RRSIG):** This record contains a signature for an\RRSET
    created with a particular ZSK.

    - **Next Secure record (NSEC):** This record is used in “negative answers” to
    prove

    whether a name exists.'
