  md: '# # Acknowledgments


    First, thanks to Aaron, who''s been encouraging me for years to shift more of
    my sysadmin focus over to security (I''m finally starting to listen) and who provided
    some great feedback on this book. Thanks also to Shawn, Anthony, and Marielle
    for all their valuable comments on the book.


    Thanks to my editor, Debra Williams Cauley, who believed in this book and patiently
    worked with me to make some ideas we threw around a reality. Thanks specifically
    to Chris Zahn and also the rest of the Addison-Wesley team for their help in structuring,
    editing, and laying out this book.


    Finally, thanks to all of the defenders out there trying to keep everyone safe
    and secure. Attackers get the bulk of the press, conference talks, awards, and
    overall attention in the security community. Like sysadmin work, defense work
    often goes unnoticed unless there''s a problem. Keep at it. Despite what they
    say, I think we are starting to win.'
