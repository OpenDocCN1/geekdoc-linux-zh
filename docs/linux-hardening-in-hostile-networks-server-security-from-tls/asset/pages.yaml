  md: '# Chapter 2 Workstation Security


    This brings up a window that allows you to move application shortcuts over to
    the menu. Note that Qubes only detects applications that provide a .desktop link
    (the same way they would automatically show up in other desktop environments).

    Q creates VMs in the desktop menu into groups based on their VM type. It''s important
    to understand the purpose of each category as it will help you make more secure
    decisions about what to do (and what not to do) in each type of VM. Here are the
    main categories:


    +   - **Disposable VM**: Disposable VMs are also referred to as dispVMs and are
    designed for one-time use. When you launch a dispVM, it creates a brand new VM
    based on a template and launches an application (usually a web browser if launched
    from the menu, it could be any application available within the VM). You can open
    multiple dispVMs at once, each within its own container. DispVMs are useful for
    opening risky email attachments, browsing risky web pages, or any other activity
    where the chance of being compromised is high. If an attacker dares to compromise
    your dispVM, he better fact since the entire environment will disappear once you
    close the window.

    - **Domain VM**: Domain VMs are often referred to as appVMs. These are the VMs
    where most applications run and where users spend most of time. When you want
    to secure your activities, you do so by creating different appVMs and assigning
    them different trust level based on a range of colors from red (untrusted) to
    orange, yellow, green, blue, grey, and black (ultimately trusted). For instance,
    you may have a red untrusted appVM for general-purpose browsing, another yellow
    appVM for most trusted web browsing that requires a login, and still another even
    more green appVM that you just use for banking. If you do both personal activities
    and work from the same laptop, appVMs provide a great way to keep work and personal
    files completely separate.

    - **Service VM**: Service VMs are split into subcategories of netVMs and proxyVMs
    and are VMs that typically run in the background and provide your appVMs with
    services (usually network access). For instance, the sys-net VM is assigned all
