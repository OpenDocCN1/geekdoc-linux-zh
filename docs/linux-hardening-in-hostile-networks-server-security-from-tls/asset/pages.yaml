  md: '# Chapter 2 Workstation Security


    Qubes also provides a command-line tool (qvm-move-to-vm and qvm-copy-to-vm) and
    right-click menu options in the GUI file manager so you can copy or move a file
    between appVMs. When you attempt, you get a prompt in a black-bordered window
    the appVM doesn''t control so you can accept this transfer. Even then, the file
    doesn''t appear wherever you are on the destination VM (otherwise an attacker
    could overwrite important files with backdoor versions). Instead, the files show
    up in a QubesIncoming directory inside your home directory.


    # TemplateVMs, Persistence, and Backdoor Protection


    Another area where Qubes provides an extra level of protection for a desktop user
    is in how it handles persistence. If an attacker compromises a normal desktop,
    they can install backdoor versions of utilities like ls or add extra programs
    that are triggered to start at boot. With Qubes, appVMs are based on templateVMs
    that have base installs of Fedora, Debian, or Whonix (the community has provided
    templates for other distributions). When you create a new appVM, you choose which
    template it is based from, and when you start it appVM gets a read-only view of
    that template''s root file system. While the user inside the app can still install
    software or change the root file system, when the appVM shuts down all of those
    changes are erased. Only the /rw, /usr, /local, and /home directories persist.
    This means that your browser history and settings will stick, but if an attacker
    did compromise your browser and try to install a backdoor into bash or Firefox,
    the next time you reboot that appVM the backdoor would be gone.


    Also, by default, appVMs do not automatically launch any init services like cron.
    Mean an attacker also couldn just add a user cron entry that launched the backdoor.
    While it''s true that the attacker could store their malicious program in your
    appVM''s home directory, the next time you reboot the appVM the program would
    no longer be running and would have no way to automatically launch it.


    How do you install software? Since each appVM uses a root file system based on
    its templateVM, when you want to install new software launch the new software
    manager from the templateVM and install the application with yum, apt-get, their
    GUI equivalents, or whatever method you would normally use to install the software.
    Qubes detects any new application menu items you''ve added and makes them available
    to the appVMs based on template. The only gotcha is that these newly installed
    applications are unavailable to appVMs until those appVMs restart. Because compromising
    the templateVM compromises every appVM based on it, Qubes generally encourages
    you to leave templateVMs off, not run general applications from them, and only
    turn them on when you trusted software. This does add an extra bit of work when
    you want to install software, it also provides a nice benefit in that when you
    need to apply a security update, you just need to update the templateVM, and when
    you restart each appVM it will get the update.


    # Network Security with netVMs


    Another way where Qubes provides security is by compartmentalizing the network.
    Upon installation Qubes will create a few special VMs called networkVMs (netVMs)'
