    # Modified Dictionary Attacks


    In response to dictionary attacks, password policies have evolved over the years
    to require more complexity in passwords. A password policy among these lines might
    require you to have at least one uppercase and lowercase case, and at least one
    number in your password. These kinds of passwords not only increase the total
    number of combinations a brute force attack would have to, but they frustrate
    traditional dictionary attacks by adding numbers or symbols to a password to create
    a word that would not show up in a traditional dictionary.


    On the surface, adding complexity makes sense from a policy standpoint, but in
    practice it does not result in passwords safe from a dictionary attack. This is
    because people tend to pick predictable passwords even when they are complex.
    For instance, if you require a user to have at least one uppercase character in
    their password, they will likely capitalize the first letter of a dictionary word.
    If they have at least one number or symbol in them they will likely put it at
    the end of a dictionary word. Some people might be more clever by taking a dictionary
    word and applying "leet speak" to it so that, for instance, "password" becomes
    "pa55word" or "P455word" in the hopes that it will obscure the password enough
    to not show up in a dictionary.


    The problem is that crackers are aware of these tricks and apply them to their
    dictionaries. Hashcat, for instance, allows you to take all of your dictionaries
    and apply certain transformations to each word. For instance, you can tell it
    to go through each dictionary word and add or two numbers to the end. There''s
    even a plugin that specifically applies various forms of leet speak to each word
    in the dictionary and tries it. Even though these modified dictionary attacks
    might require 10 or 20 times more guesses, it''s still a lot less than a full
    brute attack.


    # Optimized Brute Force Attacks


    If dictionary attacks don''t work, attackers often move to optimized brute force
    attacks. While it''s true that an 8-character password composed of uppercase and
    lowercase letters and numbers has 218 trillion combinations, in practice most
    8-character passwords aren''t really complex. Uppercase characters are most likely
    to be found at the beginning of the word, and numbers and symbols are most likely
    to be found at the end.


    Tools like Hashcat take these conventions into account and define patterns for
    your brute force attacks to dramatically decrease the overall number of combinations.
    For instance, you can tell it to try uppercase and lowercase letters on the first
    character of the password, lowercase letters for the middle, and lowercase letters
    or numbers for the last two characters of the password. By doing this you reduce
    the total number of combinations by orders of magnitude and that 8-character complex
    password becomes possible.


