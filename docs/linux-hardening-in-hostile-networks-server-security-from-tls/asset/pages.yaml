    # Section 2: Security Practices Against a Knowledgeable Attacker


    Given that much of our modern lives is spent with accounts across numerous websites,
    there are many incentives for attackers to find vulnerabilities in web services.
    Even if they are not sophisticated enough to find a security hole in a web service,
    they can always fall back to compromising a user''s account by guessing their
    password. The knowledgeable attacker has many tools at his disposal to probe servers
    for easily exploitable security holes as well as take over the accounts of users
    who made bad password choices. Having a better understanding of the capabilities
    of an attacker will help you when choosing how to secure your servers and how
    to get overall security policies.


    This section covers a few general practices you can apply to protect your network
    against an average knowledgeable attacker as well as dive deeper modern password-cracking
    techniques. Finally, I talk about some defenses against password cracking including
    slow hashes, salts, and two-factor authentication.


    # Security Best Practices


    Other chapters discuss more specific approaches to protect against attacks from
    your average attacker, and instead of diving into specifics I''d like to highlight
    a few specific practices that apply when you are securing a workstation, a server,
    a network, or some specific service.


    # Security Patches


    One of the most important things you can do to improve your security is also one
    of the simplest: stay on top of security patches. While it''s true that advanced
    attackers have access to zero-day vulnerabilities (i.e., security vulnerabilities
    that are not yet known by the vendor and therefore not patched), they are so valuable
    that most attackers aren''t willing to use them unless they absolutely have to.
    The thing is, they don''t need to'
