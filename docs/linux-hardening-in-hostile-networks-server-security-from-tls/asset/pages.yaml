  md: '# 7

    DNS


    Domain Name System (DNS) is one of fundamental network services that many people
    never give a second thought (as long as it''s working). Most things that happen
    on a network, and even more so on the Internet, rely on DNS. At its most basic
    level, DNS converts a server''s name (like www.example.com) into its IP address
    (93.184.216.34) so that an end user doesn''t have to memorize the IP addresses
    for the websites she wants to visit—she types a hostname as part of a URL and
    gets to the new IP. Most servers inside a data center rely on DNS instead of IP
    addresses. Well, all IP addresses change—especially in the cloud—and it''s a pain
    to have to change every host in your network when an IP address changes. Instead,
    you can make the change to the DNS server; when the next time a server needs to
    connect to this host, it will ask DNS and get the new IP.


    The interesting thing about DNS compared to many other network services is that
    it uses both TCP and UDP. Your average query uses UDP to save time and bandwidth;
    however, DNS sometimes uses TCP, to serve large queries or perform zone transfers
    between DNS servers (from some or all of the records for a domain, zone, to a
    subordinate DNS server, usually triggered when the master DNS server is changed).


    Because of its core all sorts of havoc in the network can compromise the DNS server
    can weaken or attack new IP addresses (perhaps the attacker controls) making hosts
    unable to talk to each other by removing their IP addresses from DNS altogether.
    Another reason DNS servers are prime target is the fact that they contain a full
    list of all the hosts and IP addresses in your network. With that kind of list,
    an attacker could figure out your network topology and identify a vulnerable servers
    to attack next. Furthermore, those misconfigured DNS servers on the Internet are
    frequently used as a member of a large distributed denial-of-service (DDoS) attack
    that floods its target with a stream of UDP packets.


    In this chapter, cover how to harden any DNS server before you put it on a network.
    "Section 1: DNS Security Fundamentals" describes the fundamentals behind DNS security
    and how to secure it as a basic hardened DNS server. "Section 2: DNS Amplification
    Attacks and Rate Limiting" goes into more advanced DNS features such as rate limiting
    to help prevent your server from being used in DDoS attacks, query logging to
    provide forensics data for your environment, and authenticated dynamic DNS."Section
    3: DNSSEC" is devoted to Domain Name System Security Extensions (DNSSEC) and provides
    an introduction to DNSSEC and the new DNSSEC records, how to configure DNSSEC
    for your domain, and how to set up and maintain DNSSEC keys.'
