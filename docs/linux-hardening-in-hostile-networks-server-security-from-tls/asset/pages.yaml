  md: '# Chapter 6 Email


    contents of the email unless the sender uses encryption software like PGP. Even
    in that case, the To: From: headers and other metadata are still unencrypted because
    the email server from the sender and the receiver needs those headers to know
    how to deliver the message. This means that in the case of a PGP-encrypted email,
    working equipment or servers between the sender and receiver could read the To:
    From: It turns out that metadata can be rather revealing, so many email server
    administrators take the additional step of protecting SMTP traffic with TLS, also
    known as SMTPS.


    With SMTPS, your email client can send your email to mail relay server over an
    encrypted connection, and that mail server can connect to the destination email
    server, or over an encrypted connection. The authentication aspect of TLS is just
    as important as the encryption aspect. With SMTPS, you can protect against MitM
    attacks between an email client and a mail relay or between two servers because
    each connection challenges the sender to produce a valid certificate and authenticates
    before. With SMTPS, anyone who is snooping on the email traffic between two email
    servers just sees encrypted traffic, and while they may deduce that an email was
    sent from one domain to another, they won''t know who sent or who received it.


    The first step in configuring SMTP for your mail server is to get a valid certificate.
    Many Postfix packages will require a self-signed certificate as part of the installation
    process, with the advent of free certificate programs like Let''s Encrypt, it''s
    better to make the extra effort to get a valid TLS certificate. Once you have
    a valid certificate somewhere on the file system, the next step is to tell Postfix
    about it in main.cf


    ```

    smtpd_tls_cert_file = /etc/letsencrypt/live/mail.example.com/fullchain.pem

    smtpd_tls_key_file = /etc/letsencrypt/live/mail.example.com/privkey.pem

    ```


    The smtpd_tls_cert_file option should be set to the full path to the public certificate
    for your domain in PEM format. The smtpd_tls_key_file option should be set to
    the full path to the private key for your domain in PEM format. I used default
    Let''s Encrypt paths in this example, but you would change these paths to point
    to your private key. Because your private key is a secret, you should make sure
    that it is owned and readable only by the root user.


    Now that Postfix is configured with valid certificates, the next step is to configure
    Postfix with the list of TLS protocols and ciphers to use:


    ```

    smtpd_mandatory_protocols = SSLv2, SSLv3

    smtpd_tls_mandatory_ciphers = medium

    smtpd_tls_received_header = yes

    ```


    In this case, I have outdated and insecure SSLv2 and SSLv3 protocols as requiring
    medium-strength ciphers so I get a decent blend of compatibility with remote email
    servers without allowing weaker ciphers. Finally, the smtpd_tls_received_header
    option lets me output what protocol and cipher I am using just to get debugging
    information for the connection if I wanted it—this option isn''t required.'
