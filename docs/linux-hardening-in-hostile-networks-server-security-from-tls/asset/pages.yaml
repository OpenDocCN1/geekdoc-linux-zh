    # # Hidden Services


    Tor is great when you access services on the Internet anonymously, but there is
    still the problem that traffic leaves an exit node can be inspected. While exit
    node traffic doesn''t reveal the Tor client''s identity, it does reveal the destination,
    as the website that is visited. Because of this, Tor allows you to set up hidden
    services that only exist within the Tor network. A hidden service could be a web
    server, an email server, or just about any network service. Hostnames for hidden
    services end in onion, and when you visit them, traffic never leaves the Tor network.
    So anyone who happens to be sniffing traffic coming from exit nodes will never
    see traffic defined for a hidden service.


    While hidden services often get associated with illegal activity and are often
    referred to as the "Dark Web," there are plenty of legitimate reasons why you
    might want to use an Internet service where yours is anonymous. In fact, even
    Facebook has offered a Tor hidden service to Facebook, Facebook itself knows who
    just connected to it, but no one viewing traffic coming from an exit node would
    see it.


