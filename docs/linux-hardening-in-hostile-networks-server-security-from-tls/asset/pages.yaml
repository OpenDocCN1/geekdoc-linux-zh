  md: '# Section 1: Essential Network Hardening 81


    To delete a rule, just replace the -A argument with -D and leave the rest the
    same.

    So you wanted to delete the above ICMP rule, you would


    ```

    sudo iptables -D INPUT -p icmp -j ACCEPT

    ```


    If you want to undo all rules for a particular chain, you can use the -F argument

    (for flush). So to remove all INPUT rules you would type


    ```

    sudo iptables -F INPUT

    ```


    If you don''t specify a particular chain, it will remove all rules for all chains.
    With this

    will flush your rules:


    ```

    sudo iptables -F

    ```


    # Picking Specific Network Ports


    The iptables command takes a few arguments. The -A argument is used to specify

    which to use, the -p option is used to specify a specific network protocol the
    rule

    ofinally, and the -j option specifies the target or action to apply to packets

    match this rule. iptables commands get a bit complicated when you want to block
    a

    particular port. For instance, this rule would allow incoming port 22 TCP traffic
    (SSH):


    ```

    sudo iptables -A INPUT -m tcp -p tcp --dport 22 -j ACCEPT

    ```


    The -m option lets you specify different matching rules for a particular packet.

    in the above case, we are specifying a specific destination port with the destination
    port with --dport

    option, we also need to specify a matching protocol with the -m option even though

    we also listed the protocol with -p. The -m option is sometimes also used to match

    network states (such as whether a connection is new or part of an established

    of traffic).


    # Picking Specific IP Addresses


    Sometimes you want to create rules to allow or block specific IP addresses. The
    -s

    (for source) argument lets you specify an IP address and network mask this rule
    applies

    to, for instance, if you only wanted to allow port 22 access to your internal
    10.0.0.x

    network, you could create a rule like this:


    ```

    sudo iptables -A INPUT -m tcp -p tcp -s 10.0.0.0/255.255.255.255 --dport

    22 -j ACCEPT

    ```


    You may want to specify the destination IP address instead of the source

    IP address. This -d option is particularly applicable when restricting OUTPUT
    rules.

    the -o option works like the -s option, so if you wanted to allow all outbound
    traffic

    from your host to other hosts on your local 10.0.0.x network, you could create
    rules

    like this:


    ```

    sudo iptables -A OUTPUT -m tcp -p tcp -d 10.0.0.0/255.255.255.255 -j ACCEPT

    sudo iptables -A OUTPUT -p udp -d 10.0.0.0/255.255.255.255 -j ACCEPT

    sudo iptables -A OUTPUT -p icmp -d 10.0.0.0/255.255.255.255 -j ACCEPT

    ```'
