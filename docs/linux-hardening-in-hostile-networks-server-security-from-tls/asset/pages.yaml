- img_proc: true
  md: 'Since root privileges are taken care of, the first hardening step you should
    take is to audit the permissions on any document roots or files your web server
    hosts. For instance, /var/www/html is a default document root on Debian-based
    systems. Ideally, the unprivileged user will be able to read, but not write to,
    the web server hosts. So if the document root is owned by the root and user group,
    for instance, you want to make sure that directories are world readable and executable
    (chmod 755) and files are only world readable (chmod 644). Alternatively, if you
    wanted to avoid having world-readable files in your document root, you could change
    the group ownership to match your web server''s unprivileged user (chgrp www-data
    filename) and change permissions to 750 files and 640 to remove any world readable
    status.


    # HTTP Basic Authentication


    One of the simplest ways to harden a website is to require a username and password
    to access it, and one of the easiest to ensure that is via HTTP basic authentication.
    With HTTP basic authentication, instead of having to add authentication support
    to a custom web application, your web server itself handles the authentication.
    You can password-protect your web server can serve, from a static set of files
    to the admin section of your blogging software. You can also choose to password
    protect your entire site or only subdirectories, depending on your needs. Since
    this type of authentication has been around for many years, you don''t need any
    special browser support or plugins—any browser, including command-line browsers,
    should be able to use it.


    One thing to note before we get into how to configure basic authentication is
    if you do not have HTTPS enabled (which we discuss in Section 2), when you enter
    your username and password in a browser to authenticate with your site, your password
    will be sent over the network encrypted. This means an attacker could potentially
    listen to network traffic between your browser and web server and see your password.
    If you want to protect against this kind of attack, enable HTTPS.


    # The htpasswd Utility


    There are different tools you can use to generate passwords for HTTP basic authentication,
    but the most common is htpasswd—a utility that comes with the Apache web server.
    If you use Nginx as your web server you may not have htpasswd installed, so I''ll
    also describe how to use the OpenSSL password command (which should be available
    on just any server) to do the same thing.


    The simplest use case for htpasswd is to create a new password file with a new
    user in. While many examples on the web show storing htpasswd files as .htpasswd
    within the document root of your web server, I prefer storing password files outside
    of the document root entirely to avoid the chance that a misconfiguration exposes
    this password to the public. So, for instance, I might store the htpasswd file
    for my site at example.com as htpasswd-example.com in either /etc/apache2,/etc/httpd,
    or /etc/nginx depending on where my web server''s configuration'
