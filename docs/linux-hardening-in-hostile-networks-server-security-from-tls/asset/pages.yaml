    # Overall Security Concepts


    Before we get into specific hardening techniques, it''s important to build a foundation
    with the security principles we will apply to all of the hardening techniques
    in the rest of the book. No security book can cover every possible type of threat
    or how to harden every type of system, but if you understand some of the basic
    concepts behind security, you can apply them to whatever you''d like to.


    This chapter covers two main topics. First, I introduce general security principles
    you can apply to any specific security problem. Then, I introduce one of the biggest
    security problems you might face—passwords—and explain the threats to passwords
    in detail as well as how to apply security principles to build strong passwords.
    "Section 1: Security Fundamentals" introduces essential security concepts that
    you will apply throughout the book and finishes up with a section on choosing
    secure passwords and general password management. "Section 2: Security Practices
    Against a knowledgeable Attacker" elaborates on the security principles in Section
    1 with a focus on more sophisticated attacks and provides a general introduction
    to two-factor authentication. "Section 3: Security Practices Against Advanced
    Attacker" examines how security principles apply in the face of an advanced attacker
    and discusses password-cracking techniques.


    # Section 1: Security Fundamentals


    Computer security is a relatively new subject, but security itself is very old.
    Long before computers encrypted data, humans were inventing ciphers to protect
    sensitive messages from being captured by their enemies. Long before firewalls
    segmented parts of a network, humans built castles with moats around to keep invaders
    at. There are certain fundamental principles behind security that one can apply
    to just anything we would like to secure against attack. Throughout the rest of
    this book you will see examples of how to harden specific services, but all of
    those techniques ultimately are derived from a few security best practices. In
    this section, I highlight a few fundamental security principles you should apply
    when securing just about anything.


    In addition to security principles, I specifically focus on one of the most important
    topics behind computer security: passwords. Passwords are used in computer security
    just about everywhere we want someone to prove that they are, or authenticate
    themselves. Because of its widespread use, password authentication has gotten
    a lot of attention from'
