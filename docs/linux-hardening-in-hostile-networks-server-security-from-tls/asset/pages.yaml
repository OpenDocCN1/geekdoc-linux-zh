  md: '# Summary


    Web servers are one of the most common servers you will find on the Internet,
    so it\u29 important to know how to harden your own against attack. In this chapter,
    we covered a number of different ways to harden a web server. We started with
    basic HTTP authentication so you can limit which users can access your web service.
    From there we moved on to HTTPS configuration, so you can protect your users when
    they visit your site by both encrypting their web traffic and providing a way
    for them to authenticate your server. Finally, we dove into more advanced HTTPS
    configuration to help protect you against particular attacks against HTTPS such
    as downgrade attacks, and we configured a web application firewall.'
