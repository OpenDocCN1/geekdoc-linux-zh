  md: '# Security Risks


    Tor can work to protect your anonymity against advanced attackers, but it isn''t
    completely foolproof. Over the years there have been a number of different security
    flaws found within Tor that could allow someone to unmask targeted users. There
    have also been instances where attackers have indeed compromised Tor nodes to
    the network running modified versions of the Tor service so they could inspect
    traffic. The Tor team works to patch vulnerabilities as they become known, which
    leads me to the first Tor security risk.


    # Outdated Tor Software


    When security flaws are found in Tor, they typically allow an attacker to unmask
    a user. The best way to protect yourself is to make sure that all Tor software
    you use is kept up to date. In particular, the Tor Browser Bundle should be kept
    up to date. Because it includes Tor but also a web browser, security flaws in
    either one could put you at risk.


    # Identity Leaks


    Tor anonymizes source and destination IPs, it doesn''t (and in the case of TLS
    connections, an''t) scrub the content of your Internet traffic for identifying
    data. In general, Tor can''t protect you from yourself. For instance, if you use
    Tor to sign on to a forum that uses your real name, and you post something, Tor
    won''t protect you from someone linking that forum post to you. Likewise, if you
    log into social media or other accounts that have direct links to you, you won''t
    get much benefit from the anonymizing network.


    To protect against identity leaks, if you need an anonymous email or social media
    account, sign up for over Tor and only access it using Tor. Even one mistake along
    these lines could link your anonymous accounts back to your identity, as high-profile
    cases such as the FBI unmasking the Sabu demonstrates.. While you are accessing
    these anonymous accounts, don''t log in any accounts that link to your real identity.
    Also, by default, web browsers store cookies and other persistent data on the
    client that can be shared with the server. If you browse the web with Tor, use
    the Tor Browser Bundle it includes plugins that help protect against your browser
    identifying data. If you do need to access two different accounts over Tor, at
    the very least have the Tor client change circuits in between.'
  merge: -1
