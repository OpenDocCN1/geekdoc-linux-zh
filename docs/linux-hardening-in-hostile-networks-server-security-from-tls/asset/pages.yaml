    # Configure Postfix


    Once OpenDKIM is set up and functional with valid keys, the next step is to configure

    Postfix to use it. First edit the /etc/default/opendkim file and configure the
    socket that

    opendkim will create and Postfix will use to communicate with it:


    ```

    SOCKET="local/var/spool/postfix/opendkim.sock"

    ```


    Note that I am not using the default /var/run location but instead pointing to
    a directory

    y/var/spool/postfix. This change is for maximum compatibility in case your

    Postfix server runs within a chroot jail. After making this setup, save the file
    and

    create the directory you referenced in the preceding, and make sure the opendkim

    user group owns it:


    ```

    sudo mkdir /var/spool/postfix/opendkim

    s chown opendkim:opendkim /var/spool/postfix/opendkim

    ```


    Since OpenDKIM will create a socket file in this directory that''s owned by the
    opendkim

    user and group, you need to make sure that the postfix user is a member of the
    opendkim

    group. There are a number of tools that let you modify group membership, but one
    simple

    is is to edit /etc/group as root and make sure the opendkim line is changed from


    ```

    opendkim:x:1229:

    ```


    to something like


    ```

    opendkim:x:1229:postfix

    ```


    Note that your group ID may not be 129. The key is to make sure that the postfix

    user exists after the last colon.


    Now restart the postfix service and make sure the /var/spool/postfix/opendkim/\opendkim.sock
    exists:


    ```

    sudo service opendkim restart

    ls -1 /var/spool/postfix/opendkim/opendkim.sock

    srwxr-x 1 opendkim opendkim 0 Aug 14 13:15

    /var/spool/postfix/opendkim/opendkim.sock

    ```'
