  md: '# iptables Fundamentals


    While there are numerous command-line wrappers and GUI tools that can make easier
    to build firewall rules, in the end on Linux they all use the Linux iptables command
    behind the scenes. The downside is that iptables is, it is a command-line interface
    to a module in the kernel, it exposes a lot of internals about how the kernel
    processes network traffic without much of an attempt to add any layers of abstraction.
    As a result, the syntax to do basic things to get more complicated than it should
    and isn''t entirely intuitive if you''re not familiar with networking in the kernel.
    That said, different distributions may have different iptables wrappers tools,
    and those may change from time to time, I''m going to stick with straight iptables
    commands in my examples. I will try my best to keep them relatively simple.


    The most basic iptables command adds a firewall rule is structured like this:


    ```

    sudo iptables -A <category> -p <protocol> -j <action>

    ```


    iptables organizes rules into different categories it refers to as "chains" (the
    prior firewall management on Linux was called iptchains). These different chains
    are organized when the rules are applied within the kernel. Although there are
    a number of different chains, the basic three you will deal with when building
    firewall rules as are:


    +   - INPUT: General incoming (ingress) network traffic

    - OUTPUT: General outgoing (egress) network traffic

    - FORWARD: Network traffic being forwarded from one network interface to another,
    if your server is configured as a router


    iptables also accepts a number of actions it refers to as *targets* that you can
    apply to packets that match a firewall rule. Like with chains, there are many
    different targets to choose from (you can even specify other chains as a target),
    but you will most often use one of predefined actions:


    +   - ACCEPT: Allow the packet

    - REJECT: Deny the packet

    - DROP: Ignore the packet (or "drop it on the floor")

    - LOG: Log information about the packet into the system log


    iptables rules end up becoming a combination of one of the above chains, a target,
    and then specific command-line arguments that narrow down what specific types
    of packets the rule applies to, based on the source or destination IP address,
    source or destination port, or some other attribute for that packet. For instance,
    a basic iptables command that would allow any Internet Control Message Protocol
    (ICMP) traffic (pings) and all protocols that use ICMP would look like this:


    ```

    sudo iptables -A INPUT -p icmp -j ACCEPT

    ```'
