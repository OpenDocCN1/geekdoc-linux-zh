  md: '# Section 2: Authentication and Encryption


    137


    # Incoming SMTP Restrictions


    Along with email-relaying restrictions, you will also want to place further restrictions
    on who can use this email server as a destination server for emails. This set
    of policies is particularly useful to prevent spam because you can tell Postfix
    which email blacklists to use. We will then compare the client''s information
    with the information in blacklists before allowing the client to send an email.


    In Postfix, you restrict incoming SMTP connections via the smtpd_recipient_restrictions
    command. In Postfix configurations, this setting may be empty unless you are already
    using smtpd_relay_restrictions to prevent this server from being an open relay.
    If you''d like to extend to perform blacklist lookups, however, you may want a
    setting like this:


    ```

    smtpd_recipient_restrictions = \

    permit_mynetworks,

    permit_sasl_authenticated,

    reject_unauth_destination,

    reject_rbl_client zen.spamhaus.org,

    reject_rbl_client bl.spamcop.net,

    reject_rbl_client dnsbl.sorbs.net

    ```


    I''ve already explained the first three in the "Relay Restrictions" section. The
    last three use the reject_rbl_client parameter, which allows you to set a specific
    Realtime Blackhole List (RBL) your email server query to test whether a client
    is suspected of being spam. These particular RBLs are just suggestions; you may
    find others that you would like to add, or you may want to remove one that is
    flagging too much legitimate mail.


    If you do opt to set up RBL lookups, I suggest keeping an eye on your email logs
    for 554 errors for the first couple of days to confirm that legitimate emails
    are still coming. The 554 is the error code Postfix uses when it rejects an SMTP
    connection. A sample log entry might look something like this:


    ```

    NOQUEUE: RCPT from unknown[12.23.34.123]: 554 7.1 Service Unavailable;

    Client host [12.23.34.123] blocked using zen.spamhaus.org; https://www.spamhaus.org/query/SBLSS=<greatofferers@spammer.badguy>=legitimate.user@example.com>
    proto=SMTP hello=greatofferers@spammer.badguy

    ```


    With proper networks, smtpd_relay_restrictions, and smtpd_recipient_restrictions
    settings in place, you will have a reasonably secure server that you can safely
    place on the Internet and block some incoming spam.


    # Section 2: Authentication and Encryption


    If you have email server needs, such as a server that acts as an outgoing mail
    relay for a set of internal servers, hardening is relatively straightforward:
    prevent the server from becoming an open relay. The more complexity you add to
    your email server, the more complex your hardening steps become. For, if your
    server is the destination for email for a domain, you must allow the Internet
    to connect to you. If you are not just relaying from other internal servers but
    also acting as'
