  md: "# Section 2: HTTPS\n\nto password-protect, an httppasswd file at /etc/nginx/httppasswd-example.com.\
    \ The resulting location section would look like this:\n\n```\nlocation /secrets\
    \ {\n    auth_basic \"Login to see the secrets\"\n    auth_basic_user_file /etc/nginx/httppasswd-example.com;\n\
    }\n```\n\nThe auth_basic line sets the fact we will use HTTP basic authentication\
    \ in this context and allows you to pass a string to pass the login prompt. The\
    \ auth_basic_user_file is set to the httppasswd file that contains users who are\
    \ allowed to authenticate.\n\n# Section 2: HTTPS\n\nIn this section, we discuss\
    \ how to enable HTTPS on your website (which secures HTTP communications using\
    \ TLS, formerly known as Secure Socket Layer [SSL]). Enabling HTTPS on your websites\
    \ is an important hardening step for a number of reasons. First and foremost (the\
    \ primary reason many people enable HTTPS on their site), it allows you to encrypt\
    \ traffic between the client and the server. This is important if you use HTTPS\
    \ basic authentication or any other means to authenticate users—otherwise an attacker\
    \ could listen on the communication and see your password. Arguably more important\
    \ than encryption, however, is the fact that HTTPS allows users of your site to\
    \ know that they are visiting your server and not someone's website made to look\
    \ like yours, and know that all communication between their web browser and your\
    \ server is protected from MitM attacks. This is where an attacker could pretend\
    \ to be your server, intercept your encrypted traffic and decrypt it re-encrypt\
    \ it and send it to the real server. Furthermore, you can use TLS as an authentication\
    \ mechanism itself (known as mutual TLS) where both requests certificates from\
    \ the server to ensure the server is who it says it is, and the server requests\
    \ certificates from the client to prove who it is well.\n\nIt goes without saying\
    \ that any TLS configuration to work, you will need to acquire a valid TLS certificate\
    \ from a CA. There are many different companies and CAs you can use to buy a certificate\
    \ from; your choices might range from the registrar you used to buy your domain\
    \ name, independent companies that focus on selling certificates, or free services\
    \ like Let's Encrypt. Walking through the certificate-purchasing process would\
    \ be difficult without inadvertently picking one out of the crowd, so I will assume\
    \ for the rest of this section that you have picked a CA and now have a valid\
    \ certificate and corresponding key for your domain.\n\nIf you are interested\
    \ in the details of how TLS provides all of its security guarantees, what a certificate\
    \ and key file actually do, and how it works overall, overall check Appendix B,\
    \ \"SSL/TLS,\" where we dive into more detail on how TLS works. In this section,\
    \ we focus more on how to configure your systems and less on the underlying protocol."
