  md: '# Chapter 9 Incident Response


    along with several functions you can perform on the file. You can display the
    ASCII or Hex versions of a file or have Autopsy scan the file and display only
    the ASCII inside. This is particularly handy to try on suspected trojan files.
    Often the ASCII strings inside a tro binary list IRC channels or other remote
    servers or passwords the attacker is using. You can also export a copy of the
    file to your local disk for further examination.


    Attackers often like to delete files to cover their tracks, but Autopsy can attempt
    to recover them from the free space of the system file. Go to the File Analysis
    page and click the All Deleted Files button on the bottom of the left-frame, and
    Autopsy will list all the deleted files found on the system. If Autopsy can recover
    that much, you can also see the MAC times and click on the file to recover its
    original contents!


    All features are handy, but one of the most useful is the Add Note feature. For
    instance, you notice a system binary in /bin directory that has a recent modified
    date and you notice some suspicious ASCII strings inside, you can click Add Note
    and list your findings. On the Add Note page you can also add a sequencer event
    based on MAC time. If you thought the modified time was suspicious, you might
    select M-Time on the Add Note page. When you add notes for multiple files or directories,
    you end up with a large series of notes on what you have found along with interests.
    From the Host Manager window (window that lists the host''s partitions), click
    View Notes to see the list. This is an invaluable feature when you are trying
    to piece together the sequence of events from an attacker, particularly when you
    want to share your findings with others.


    If you find piece of information such as an IP address or a server name as you
    scan files, you can also click Keyword Search at the top of the Analysis page
    to scan the file system for that keyword. You may find log entries or additional
    files the attacker uploaded that remained in unlikely places with this tool.


    One of the things you will discover is that the sequence of events is very important
    when figuring out an attacker''s steps. The File Analysis window lets you see
    by any of the headers the MAC times. An attacker will often replace a system binary
    under /bin or /sbin with a trojan, and since that will update the modified time
    for a file, if you sort the /bin and /sbin directories by modified time in the
    File Analysis window you can quickly see suspicious file changes as a series of
    core programs like ls, and echo all modified a few days ago at a time when you
    know you didn''t update any programs.


    # Where to Search


    If you are new to forensics, you might not be sure of exactly to start looking
    in your file system. There are a few directories that contain evidence of an attack
    that will at least give you a start on your case. I''ve already mentioned the
    /bin and /sbin directories, as attackers will often replace core system binaries
    in these directories with trojans. The /tmp and /var/tmp directories are also
    favorite locations anyone of the system can write to them, so attackers will often
    start their attacks in these directories'
