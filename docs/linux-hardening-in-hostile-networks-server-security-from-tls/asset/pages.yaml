    chapter, though, you can think of Tor like a type of special VPN service. When
    you use Tor, your client connects to a public Tor relay on the Internet via this
    special VPN. That node connects to a middle Tor relay via a separate VPN, and
    that middle node may connect to other nodes or to a exit node via yet another
    VPN. Your traffic then hops through each of these VPNs to the exit node before
