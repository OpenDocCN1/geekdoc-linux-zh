    # # Section 1: DNS Security Fundamentals


    The primary step to securing DNS is to identify what your DNS server is supposed
    to provide and to whom, and then prevent everyone from accessing it. First, figure
    whether your DNS server is an authoritative name server or a recursive server.
    Each type of DNS server has different hardening needs. In the following sections,
    I''ve organized the basic hardening steps according to each type.


    An authoritative name server hosts DNS records for a particular zone (often a
    zone is a domain as example.com, but a zone could be a subdomain as corp.example.com)
    and is considered the authoritative for information on hosts within that zone.
    For instance, if you registered mydomain.com and wanted to provide your own DNS
    service for mydomain.com, DNS would be an an DNS server that was specifically
    authoritative for mydomain.com.


    A recursive name server does not hold any DNS records for its own, but computers
    use it to look up records for hostname on the Internet for their behavior. For
    instance, your ISP probably provides you with a few recursive DNS servers for
    your computers to use to look up recursive name servers at 8.8.8.8 and 8.8.4.4.


    While DNS servers can act as both an authoritative DNS server for zones you control
    and a recursive DNS server for any other domain on the Internet, a recommended
    best practice is to separate these services into two separate servers whenever
    possible. Since a recursive name server caches results for some time, an attacker
    who can exploit a security bug in the DNS may be able to trick a recursive DNS
    server to cache records for zones for which it''s authoritative, which might let
    the attacker overwrite them with his.


    By separating authoritative and recursive DNS servers into separate servers, you
    also make it easier to harden each type of server needs different firewall rules.
    For instance, while an authoritative DNS server for a domain usually needs to
    accept incoming requests from the Internet at large, it should not need to initiate
    new queries on the Internet. A recursive DNS server is the opposite: it needs
    to initiate new DNS queries on the Internet, but usually it should accept DNS
    queries only from the local network.


    No matter what type of DNS server you are running, the first hardening step you
    may want to consider is hiding your DNS server version from the outside world.
    While this won''t protect you from a targeted attack if your DNS server has a
    vulnerability, it will help protect against a lazy attacker or automated tool
    that compares'
