  md: '# Chapter 4 Network


    The complete iptables save file that would go into /etc/sysconfig/iptables or
    /etc/iptables.rules.v4 would look like this:


    ```

    *filter

    :INPUT ACCEPT [0:0]

    :FORWARD ACCEPT [0:0]

    :OUTPUT ACCEPT [0:0]


    -A INPUT -i lo -j ACCEPT

    -A INPUT -p icmp -j ACCEPT

    -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    -A INPUT -mp tcp -p tcp --dport 22 -j ACCEPT


    -A INPUT -j LOG --log-prefix "iptables-reject"

    -A INPUT -j REJECT --reject-with icmp-host-prohibited

    ```


    COMMIT

    Note that the LOG and REJECT rules are at the very end of the file. iptables applies
    rules according to order, so if network traffic matches a rule it gets applied.
    Because of this, if you want to set up a deny-by-default policy for your firewall,
    you need to make sure your REJECT rule is the last in the file. The LOG rule is
    also right before that so we only log rejected traffic. You can certainly set
    up a LOG rule earlier to all incoming traffic, it will generate a lot of logs!

    Once you have saved one of the following commands, depending on your configuration
    file, you can then apply the above changes with your Linux distribution:


    sudo iptables-apply /etc/sysconfig/iptables # Red Hat

    sudo iptables-apply /etc/iptables/rules.v4 # Debian


    Web Servers Typically web servers listen on two TCP ports, 80 and 443. If you
    were building a set of firewall rules for a web server, you would just need to
    add additional rules:


    ```

    -A INPUT -mp tcp -p tcp --dport 80 -j ACCEPT

    -A INPUT -mp tcp -p tcp --dport 443 -j ACCEPT

    ```


    The resulting configuration file would look like this:


    ```

    *filter

    :INPUT ACCEPT [0:0]

    :FORWARD ACCEPT [0:0]

    :OUTPUT ACCEPT [0:0]


    -A INPUT -i lo -j ACCEPT

    -A INPUT -p icmp -j ACCEPT

    -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    -A INPUT -mp tcp -p tcp --dport 22 -j ACCEPT

    -A INPUT -mp tcp -p tcp --dport 80 -j ACCEPT

    -A INPUT -mp tcp -p tcp --dport 443 -j ACCEPT


    -A INPUT -j LOG --log-prefix "iptables-reject"

    -A INPUT -j REJECT --reject-with icmp-host-prohibited

    ```


    COMMIT'
