- img_proc: true
  md: '# Enable DMARC for Incoming Messages


    Whether or not you want DMARC enforcement in place for your own emails, you still
    may want to enable DMARC for incoming messages to help reduce incoming spam, and
    you can do this without setting DMAR for your own domain. The first step is to
    install the opendmarc package on your incoming mail server. This software performs
    DMARC checks for incoming email and can be hooked into Postfix like we did with
    SPF and DKIM in the earlier part of the chapter. For instance, on a Debian-based
    system you can do this with


    sudo apt-get install opendmarc

    Once the package is installed, deploying on your distribution, you may already
    have an /etc/opendmarc.conf. The software comes with particular defaults set,
    so it may not require much configuration on your part from the following changes:


    ```

    AutoRestart Yes

    AutoRestartRate 10/1h


    PidFile /var/run/opendmarc.pid

    Socket local:/var/spool/postfix/opendmarc/opendmarc.sock


    AuthID mail.example.com

    TrustedAuthIDs mail2.example.com, mail3.example.com


    Syslog true

    SyslogFacility mail

    ```


    OpenDMARC configuration is similar to OpenDKIM, and similarly we want to automatically
    restart if it has some kind of failure. Also, in my case, I have specified a particular
    location for its process ID with the Pidfile option to align with Debian-based
    systems such files. The AuthServiceID and TrustedAuthIDs settings are optional.
    The AuthServiceID option defines what ID OpenDMARC will use when it is its Authentication-Results
    header is set by the current host''s hostname. If you have other servers in your
    environment with OpenDMARC set up to relay incoming mail to your primary host,
    you will also want to set TrustedAuthIDs to that list of hostnames that this OpenDMARC
    instance should. I also enabled syslog and set to the mail facility so that OpenDMARC
    logs show alongside my other email logs. Finally, I set a UMask and UserID setting
    so the socket file is created by the opendmarc user and group but not writable
    by anyone else.


    # Configure Postfix to Use OpenDMARC


    Once OpenDMARC is set up, the next step is to configure Postfix to use it. First,
    edit the /etc/default/opendmarc file and configure the socket that opendmarc will
    create and Postfix will use to communicate with:


    ```

    SOCKET="local:/var/spool/postfix/opendmarc/opendmarc.sock"

    ```'
