    different file. For instance, if you use the same computer for personal and work
    use, you will want to create a separate keypair for each environment:


    ```

    $ ssh-keygen -t r -b 4096 -f ~/.ssh/workkey

    ```


    The preceding command creates a keypair and workkey pub inside the ~/.ssh/ directory.


    # Copy SSH Keys to Other Hosts


    Once you have your SSH keys in place, you will need to copy the contents of your
    public key to the ~/.ssh/authorized_keys on the remote server. While you could
    just ssh into the remote server and do this by hand, a tool called ssh-copy-id
    has been provided to make this easy. For instance, I wanted to copy my public
    key to a server called web.example.com and my username was kyle, I would type:


    ```

    $ ssh-copy-id kyle@web.example.com

    ```


    Replace the user and server with the username and server that you will use to
    log in to your remote server. At this point it will prompt you for the password
    you use to log in to the remote machine, but the command completes will be the
    last time! Just like regular SSH logins, if your local username is the same as
    the remote server, you can omit it from the command. By default ssh-copy-id will
    copy your id_rsa_pub file, but if your keypair has a different name, then use
    the -argument to specify a different public key. If we wanted to use the workkey
    file we created previously, we would have:


    ```

    $ ssh-copy-id -i ~/.ssh/workkey.pub kyle@web.example.com

    ```


    The nice thing about ssh-copy-id command is that it takes care of setting the
    proper permissions on the ~/.ssh directory if it doesn''t already exist (it should
    be owned by its owner, with 700 permissions), and it will also create the authorized_keys
    file if it needs to. This will help you avoid lot of headaches that comes with
    setting up SSH keys resulting from improper permissions on the local or remote
    ~/.ssh directory or local key files.


