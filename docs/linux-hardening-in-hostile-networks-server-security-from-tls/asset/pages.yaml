  md: '# Section 3: Database Encryption


    language and then sends the encrypted payload to the database. Later, the application
    can request the encrypted row just like any row in the database and get the encrypted
    payload, which then gets decrypted on the application side.


    When you encrypt via the application, one of the most important things you will
    need to consider is how to store the key you use for encryption and decryption
    so an attacker can''t get it. Let''s start with a few places you shouldn''t store
    the key:


    +   1. **Don''t store the key on the database itself.** If you store the key in
    some other part of the database, you are only providing a level of obfuscation—an
    attacker who has a copy of the database has a copy of the key and can decrypt
    it.


    +   2. **Don''t hard-code the key in your application.** In many cases, application
    code is publicly available (or accidentally becomes publicly available). If it
    isn''t publicly available, it''s accessible by everyone who works on that code
    (and sometimes the entire team or the company). Beyond that, often application
    code is stored on the server''s file system with world-readable permissions, so
    anyone who can get a shell on that server (such as someone who found a security
    hole in the application) could read the source code and get the key.


    +   3. **Don''t store the key in a world-readable file.** If you store the key
    in a file on the local file system, make sure that you remove world-readable permissions
    from it (chmod -r filename). Otherwise, anyone who has access to the system can
    read the key.


    How should you store the key? Here are a few approaches:


    +   1. Do use a file on the file system that the application can read, provided
    you lock down the permissions of the file so *only* the application can read.
    It still leaves you vulnerable to someone who is able to compromise the application
    and perform commands as that.


    +   2. Do use environment variables when starting the application. The benefit
    of using an environment variable is that it only exists for the application itself
    in RAM. The system-level environment variable (such as files in /etc/default/)
    can be owned by root and locked down so only root can read.


    +   3. Do use an external key service. There are multiple networked services such
    as vault or etcd that can provide configuration values to an application over
    the network. This approach would require support in your application, but one
    advantage is that the key is only in RAM on the application server and never touches
    the file system. One disadvantage of this approach is that if the external key
    service is down, the application won''t be able to run.


    # Native Encryption Functions


    Both MySQL and Postgres also provide built-in encryption functions you can use
    to encrypt data as part of a SQL query instead of encrypting on the application
    first. In'
