- img_proc: true
  md: 'most major Linux distributions (either separately or as part of The Coroner’s
    Toolkit). The mact utility can take the output from mac-robber and convert it
    into a timeline.


    Let’s say you have mounted a file system (read-only of course) at /mnt. The command
    you would use to create a timeline of the file system on /mnt:


    ```

    $ sudo mac-robber /mnt | mact -g /mnt/etc/group -p /mnt/etc/passwd

    1970-02-01 > timeline.txt

    ```


    The mac-robber command needs one argument: the path to the mounted file system
    to scan. Be sure to mount read-only as mac-robber will ultimately to update directory
    access times as it scans the file system. The -g and -p options tell mact to get
    group and user ID information from the group and passwd files in my mounted file
    system, and finally the date specifies the range from which to start. The date
    must be after 1970-01-01 (I’ll leave that as an exercise for the reader), I chose
    the next day.


    Once the command completes, the timeline then gets output into timeline.txt in
    the current directory. But if you add the -d argument to mact it will put it in
    a comma-delimited format instead, which might be easier to process by other software
    (or a spreadsheet). While this won’t provide the same user experience with Autopsy,
    since you can browse the file system at /mnt and view your timeline using the
    same investigation techniques to locate compromised files, suspicious logs, or
    scan through timeline.txt for the period during which you suspect an attacker
