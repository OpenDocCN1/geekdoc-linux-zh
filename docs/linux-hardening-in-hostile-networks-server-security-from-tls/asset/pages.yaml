    \ name servers cache answers for a period of time known as the time to live (TTL),\
    \ which is assigned to every record. That way, a DNS resolver has to look up only\
    \ the records that have expired.\n\n# DNS Security Issues\n\nDNS has been around\
    \ for a while, and it has had its share of security issues over time. DNS is designed\
    \ to be an open, friendly service. Although administrators might treat DNS records\
    \ as secrets, in general, a DNS record's purpose is to be looked up by anyone\
    \ who requests it, so DNS records are not encrypted, and DNS queries generally\
    \ occur over plain text. \n\n+   - Domain names sometimes looks alike (google.com\
    \ vs google.com), which an attacker can take advantage of to encourage you to\
    \ click on a legitimate-looking link.\n- Companies always register their name\
    \ on all top-level domains (TLDs; e.g., .com, .biz, .net), so an attacker might\
    \ register mybank.biz, a victim might think is legitimate.\n- Many DNS servers\
    \ (known as “open resolvers”) will perform recursive queries for anyone asks.\n\
    - DNS is subject to MitM attacks where DNS records can be rewritten before they\
    \ get back to the victim. This lets an attacker, for instance, change the IP of\
    \ yourbank.com in a DNS request instead to point to a website controlled by the\
    \ attacker.\n- DNS spoofing/cache poisoning attacks (this class of attacks was\
    \ covered by a series of Paranoid Penguin columns in 2011) essentially allow an\
    \ attacker to inject DNS records into a DNS resolver's cache to point victims,\
    \ at an attacker's site instead of the site they intend to visit.\n\nOf all different\
    \ DNS security issues, DNSSEC attempts to address the last two, MitM attacks and\
    \ DNS cache poisoning, by signing every DNS reply with a signature, much like\
