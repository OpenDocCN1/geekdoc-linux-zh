  md: '# Network


    Along with workstation and server hardening, network hardening is a fundamental
    part of infrastructure security. In the past, network hardening has been primarily
    focused on perimeter security with the use of firewalls at the edge of the network
    to block traffic that isn''t authorized. The later focused on blocking outgoing
    traffic to those firewalls as well, primarily to prevent employees from unauthorized
    web browsing but also to prevent proprietary data from leaking out of the network.
    These days''s generally recognized that the inside of the network is as much of
    a threat as the outside. A firewall at the edge of your network doesn''t do good
    if an internal workstation or server is hacked and used as a jumping off to attack
    the rest of the network. Each section of the network (and each host) should have
    its own set of firewall rules that restrict which other servers on the network
    can talk to it.


    Encrypting and authenticating your network traffic is also important. A lot of
    sensitive data goes over the network, and in the past when the assumption that
    the internal network was safe, a lot of traffic went over the network unencrypted.
    This means that passwords and other secrets were available for attackers inside
    the network to grab. Now that many companies are moving their servers to the cloud,
    servers are communicating over networks more easily occupied by attackers and
    over the open internet. Protocols allow you to only encrypt traffic between servers
    but also to ensure that no one can impersonate the server on the edge of the connection.
    And whether you are in the cloud or in a traditional data center, both internal
    and external communication should be protected by a service like TLS.


    +   "Section 1: Essential Network Hardening" provides an overview of network security
    and then introduces the concept of the man-in-the-middle (MitM) in the context
    of an attacker on an upstream network. 1 finishes up with an introduction to iptables
    firewalls. "Section 2: Encrypted Networks" covers how to set up a secure VPN using
    OpenVPN and how to leverage SSH to tunnel traffic securely when a VPN isn''t an
    option. It covers how to configure a software load balancer that can both terminate
    SSL/TLS connections and initiate new downstream.

    Section 3: Anonymous Networks" focuses on Tor servers, including how to set up
    a standalone Tor strictly for internal use, as an external node that routes traffic
    within Tor, and as an exit node that accepts traffic from the Internet. It also
    discusses the creation and use of hidden Tor services and how to set up use hidden
    Tor relays for when you need to mask even that you are using Tor itself.'
