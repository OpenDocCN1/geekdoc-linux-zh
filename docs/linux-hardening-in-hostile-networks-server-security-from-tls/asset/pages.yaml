    # Section 3: Qubes


    The biggest issue with desktop Linux security is what''s at risk if you get hacked:
    all your personal data. This could be protected by usernames and passwords to
    import accounts like your bank or credit card accounts, your social media accounts,
    your domain registrar, or websites where you posted in the past that have your
    credit data cached. An attack could expose all your personal photos or access
    to private emails. The attacker could leave behind a Remote Access Trojan that
    lets him get into the machine whenever he wants, while in the meantime he snoeps
    on with your webcam and microphone. He could compromise your SSH, virtual private
    network (VPN), and GPG keys, which open up to other computers.


    The core idea behind Qubes security is an approach called security compartmentalization.
    This approach focuses on limiting the damage an attacker can do by separating
    your activities and their related files to virtual machines (VMs). You assign
    each VM a level of trust based on the level of risk that VM mes presents. For
    instance, you may create an "untrusted" VM that you use for your generic, unauthenticated
    web browsing. You might then have a separate, trusted VM that you only use to
    access bank. You may decide to create a highly trusted VM that has no network
    access at all that you use to manage offline documents. If you also work from
    your personal computer, you can create separate VMs for personal work activities,
    with the work VM being more trusted. If you browse to a malicious website with
    your untrusted browser, the attacker won''t have access to your banking credentials
    or personal files since you store them on different VMs. Qubes provides disposable
    VMs: one-time-use VMs that are completely deleted from the disk after the application
    closes.'
