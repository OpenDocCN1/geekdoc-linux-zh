  md: '# Chapter 7 DNS


    +   - Next Secure version 3 (NSEC3): This record is like NSEC but protects “zone
    walking,” where an outside user could use NSEC records to walk down the zone and
    discover all the records in the zone (much like being TLD to perform a zone transfer).


    +   - Delegation signer (DS): This record contains a KSK signature and is submitted
    to the zone''s parent, where it is signed and used as part of a chain of trust.


    +   - DNSSEC Look-aside Validation (DLV): This record is much like a DS record
    when DS records are not supported by a zone, or as an alternate trust anchor if
    your registrar does not support DNSSEC.


    # DNSSEC Look-aside Validation


    DNSSEC started with a sort of chicken-and-egg problem. If your TLD does not support
    DNSSEC, then outside resolvers will not have a complete chain of trust from root,
    through the TLD, to your zone. There may also be a weakness if your TLD supports
    DNSSEC, but your registrar does not provide a mechanism to upload a DS record
    to the TLD (many registrars do not, sadly). In either case, DLV has been created
    to provide an alternate trust anchor.


    You can find more details on DLV at dlv.isc.org (one of the main providers), but
    instead of generating a DS record to submit to a TLD, you generate a special DLV
    record and submit it to a DLV server. as long as a DNS resolver is configured
    to trust, for instance, dlv.isc.org, it can use that to anchor the chain of trust
    and trust your signed records.


    At this point, most major TLDs support DNSSEC and there are a number of registrars
    you can choose from that also DNSSEC support, Internet Systems Consortium (ISC)
    has decided to phase out its DLV service in 2017. Therefore, this section will
    not cover DLV configuration and instead focus on regular DS records and DNSSEC
    trust anchors.


    # Add DNSSEC to a Zone


    Adding DNSSEC to a zone using BIND involves a few extra steps beyond what you
    normally do to configure BIND as a master for your zone. You will need to generate
    a KSK and ZSK, then update the zone''s config and sign it with the keys. Finally,
    you will reconfigure BIND to support DNSSEC. After that, your zone should be ready,
    so if your registrar supports DNSSEC, you can update it. Now, let''s look at the
    steps in more detail using my greenfly.org as an example.


    # Make the Keys


    The first step is to generate the KSK and ZSK for your zone. The KSK is used only
    to sign ZKSs in the zone and to provide a signature for the zone''s parent to
    sign, whereas ZKSs sign the records in each zone. One complaint about DNSSEC is
    the relative weakness of some of the default keys, having separate keys also allows
    you to create a stronger KSK and a weaker ZSK that you can rotate each month.'
