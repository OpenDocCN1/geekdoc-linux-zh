    # Two-Factor Authentication


    As crackers have become more sophisticated and successful at cracking increasingly
    complex passwords, defenders have started looking for countermeasures outside
    of just strengthening passwords. One of the most common approaches has been to
    supplement password authentication with two-factor authentication (also known
    as “2FA,” two-step authentication, or multistep authentication). This adds an
    additional layer of security on top of a password and requires an attacker to
    compromise a different type of authentication before he can access your account.
    Two-factor authentication is an example of defense in depth and is a great way
    to defend against password cracking both as an end user, and as an additional
    authentication feature to add to your own infrastructure.


    # Types of Authentication


    Before we talk about two-factor authentication as it''s used today, it''s worth
    discussing authentication in general. Authentication is a method where someone
    can prove who is she she says is (i.e., that she is authentic). There are many
    different methods of authentication that fall into these three categories:


    +   - Something you know

    - Something you have

    - Something you are


    “Something you know” is the most common form of authentication and typically refers
    to something you have in your brain. Passwords, lock combinations, and the PIN
    for your ATM card fall into this category. An attacker can defeat this by guessing
    the secret or getting you to reveal it. This is often the least convenient type
    of authentication because it is limited by your ability to remember new secrets
    and keep them safe. This is also the easiest type of authentication to change
    as you just pick a new secret to remember.'
