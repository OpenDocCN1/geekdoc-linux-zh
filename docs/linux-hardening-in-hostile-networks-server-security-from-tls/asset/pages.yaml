    because when scp connects to localhost port 2222, it will get over the tunnel
    we created and end up talking to app1 on port 22.


    # Reverse Tunnels


    Another useful type of SSH tunnel is the reverse tunnel. It lets you open a port
    on the remote side that then you connect to a reachable host on your local network.
    This can be useful when you want to connect two different networks that can''t
    talk to each other but are reachable from a central host.


    The first example of a reverse tunnel is a bit nefarious, but is the kind of thing
    an attacker or a sneaky employee could do. Let''s say you have a locked down corporate
    network that not allowing SSH connections but also allowing outgoing connections.
    There is an employee who wants to be able to connect to that corporate network
    from home to finish work until time. The firewall rules block all incoming traffic
    but allow all outgoing traffic. Since she can SSH out, she just pick a machine
    inside the corporate network that is always running, and create a reverse tunnel
    from there to a server on the outside controls:


    ```

    ssh -R 2222:admin.example.com:22 mysersonalhost

    ```


    The reverse tunnel is identical to local tunnels, but it uses the -R argument
    instead of -L. The other major difference is that in this case port 2222 is opened
    up on'
