  md: '# Section 3: Advanced Server-Hardening Techniques


    NTP uses the UDP protocol, it might be possible for an attacker to send a malicious,
    spoofed NTP reply before the legitimate server. This reply could send the server
    an incorrect time, which could cause instability, or given that ntpd runs as root,
    if it didn''t validate the NTP reply in a secure way, there is potential for a
    man-in-the-middle attacker to send a malicious reply that could execute code as
    root.


    One alternative to NTP is tsdate, an open-source project that takes advantage
    of the fact that the TLS handshake contains time information. With tsdate, you
    can start a TLS connection over TCP with a remote server that you trust and pull
    down its time. While the timestamps in TLS are not as precise as with NTP, they
    should be accurate enough for normal use. Since tsdate uses TCP and uses TLS to
    validate the remote, it is much more difficult for an attacker to send malicious
    replies back.


    The tsdate project is hosted at https://github.com/ioerror/tsdate, and the general-purpose
    installation instructions can be found at https://github.com/ioerror/tsdate/blob/master/INSTALL.
    If tsdate is already packaged for a number of Linux distributions, first use your
    standard package tool to search for the tsdate package. If it doesn''t exist,
    you can always download the source code from the aforementioned site and perform
    the standard compilation process:


    ```

    ./autogen.sh

    ./configure

    make

    make install

    ```


    The tsdate project includes a systemd or init script (depending on your distribution)
    that you can start with service tsdated started. Once running, the script will
    notice network changes and will periodically sync the clock in the background.
