  pgno: 107
- img_proc: true
  md: 'Chapter 4 Network


    # Picking Specific Network Interfaces


    Finally, sometimes you want to create firewall rules that target only one network
    interface (such as eth0 for your primary Ethernet device, or lo for your loopback
    interface). The -i option picks you a particular interface this rule applies to.
    So, for instance, if you wanted to allow all traffic from the loopback interface
    (possibly later in your firewall rules you were going to block all packets that
    didn''t match a previous rule), you would use the following iptables command:


    ```

    sudo iptables -A INPUT -i lo -j ACCEPT

    ```


    # Persistence


    When you create iptables rules, they only apply to the current running system.
    If you were to reboot your server, without automatic system to save those rules
    for the next reboot, your settings would be lost. iptables provides a built-in
    set of scripts, iptables-save and iptables-restore, that enable you to save your
    iptables settings to a file. The iptables-restore script can read from that file
    and change those laters.


    Both Red Hat and Debian-based systems provide a method to save iptables rules
    to a file so they are automatically restored at boot. On Red Hat systems the file
    is at /etc/sysconfig/iptables, and on Debian you must make sure the iptables-persist
    package is installed and then you can save your iptables rules at /etc/iptables/rules.v4.
    The iptables-save command outputs your iptables firewall rules to stdout, so you
    redirect output to the file for your distribution:


    ```

    sudo iptables-save > /etc/sysconfig/iptables

    sudo iptables-restore > /etc/iptables/rules.v4

    ```


    When your system reboots, the rules set in those will be restored. Alternatively,
    you can also use the iptables-restore command:


    ```

    sudo iptables-restore < /etc/sysconfig/iptables

    sudo iptables-restore < /etc/iptables/rules.v4

    ```


    # Protect Yourself from Being Locked Out


    There''s a risk when you are playing with firewall rules that might accidentally
    lock yourself out of your machine. This is particularly risky on cloud servers
    that only offer SSH traffic, if you are changing firewall rules over a network
    connection, you would be unable to get back in and fix it. For that reason, you
    should provide yourself with a way to undo a bad rule.


    In the past when I found myself in this situation, I would create a cron or job
    that would run in, 30 minutes to flush all of my iptables rules (iptables -F)
    so that I had a way to get back in. iptables provides a better approach in its
    built-in iptables-apply command. With iptables-apply, you can point it to a rules
    file like you create with iptables-save. It will apply those changes and then
    prompt you to accept the changes. If you don''t accept the changes before the
    timeout (defaults to 10 seconds), all of the changes will be rolled back to what
    they were before. That way, if you accidentally lock yourself out, you won''t
    be able to access the'
