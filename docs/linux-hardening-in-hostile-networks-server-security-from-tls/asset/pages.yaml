  md: 'A great deal of security. The main tool that makes SSH passwords more manageable
    is the ssh-add utility. This tool is part of the ssh-agent utility; it allows
    you to type the password once and caches the unlocked key in RAM using SSH agent.
    Most Linux desktop systems these days have SSH agent running in the background
    (or via a wrapper Gnome keyring). By default, it caches the key in RAM indefinitely
    (until the system powers down); however, I don''t recommend that practice. Instead,
    I like to use ssh-add like sudo password caching. Specify a particular time to
    cache the key, after which I will be prompted for a password.


    For instance, if I wanted to cache the key for the 15 minutes, much like sudo
    on some, I could:


    ```

    $ ssh-add -t 15m

    Enter passphrase for /home/kyle/.ssh/id_rsa:

    Identity added: /home/kyle/.ssh/id_rsa (/home/kyle/.ssh/id_rsa)

    Lifetime set to 900 seconds

    ```


    Note that I was able to specify the time in the -t argument by appending "m" to
    the end; otherwise, it assumes the number is in seconds. You will probably want
    to cache the key for a bit longer than that, for instance, to cache the key for
    an hour you could:


    ```

    $ ssh-add -t 1h

    Enter passphrase for /home/kyle/.ssh/id_rsa:

    Identity added: /home/kyle/.ssh/id_rsa (/home/kyle/.ssh/id_rsa)

    Lifetime set to 3600 seconds

    ```


    From now until key expires, you can ssh into servers and use tools like Git without
    being prompted for a password. Once your time is up, the next time you use SSH
    will be prompted for a password and can choose to run ssh-add again. If the key
    you want to add is not in the default location, just add the path to the key at
    the end of the ssh-add command:


    ```

    $ ssh-add -t 1h ~/.ssh/workkey

    ```


    What I like to do is use this tool like a personal timer. When I start in the
    morning, I calculate the number of hours or minutes from now until I want to go
    to lunch and set the ssh-add timer to that number. Then I work as usual and the
    next git push or ssh command me for a password, I realizes it''s time to grab
    lunch. When I get back from lunch I do the same thing notify me when it''s time
    to leave for the day.


    Of course, using a tool like this means that if an attacker were able to compromise
    your machine during one of these windows where the key is cached, they would be
    able to have all of the access you do without typing in a password. If you are
    working in an environment where that''s too much of a risk, keep your ssh-add
    times short, or run ssh-add -D to delete any cached keys any time you leave your
    computer. You could potentially have your lock command or screensaver call this
    command so it happens every time you lock your computer.'
