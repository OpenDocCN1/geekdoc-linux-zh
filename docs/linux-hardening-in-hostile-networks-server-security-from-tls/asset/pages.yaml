  md: '# Section 2: Intermediate Server-Hardening Techniques


    # 63


    # AppArmor¹


    The UNIX permissions model has long been used to lock down access to users and
    programs. Even though it works well, there are still areas where extra access
    control can come in handy. For instance, many services still run as the root user,
    and therefore if they are exploited, the attacker can potentially run commands
    throughout the rest of the system as the root user. There are a number of ways
    to combat this problem, including sandboxes, chroot jails and so on, Ubuntu has
    included a system called AppArmor, installed by default, that adds access control
    to privileged services.


    AppArmor is based on the security principle of least privilege; that is, to restrict
    programs to the minimal set of permissions they need to function. It works through
    a series of rules assigned to particular programs. These rules define, for instance,
    files or directories a program is allowed to read and write to or only from. When
    an application is being managed by AppArmor violates these access controls, AppArmor
    steps in and prevents it and logs the event. A number of services include AppArmor
    profiles that are enforced by default, and more are being added in each Ubuntu
    release. In addition to the default profiles, the universe repository has apparmor-profiles
    package you can install to add more profiles for other services. Once you learn
    the syntax for AppArmor rules, you can even add your own profiles.


    Probably the simplest way to see how AppArmor works is to use an example. The
    BIND DNS server is one that is automatically managed by AppArmor under Ubuntu,
    so I install the BIND package with sudo apt-get install bind. Once the package
    is installed, I can use the aa-status program to see that AppArmor is already
    managing


    ```

    $ sudo aa-status

    apparmor module is loaded.

    5 profiles are loaded.

    5 profiles are in enforce mode.

    /sbin/dhclient3

    /usr/lib/NetworkManager/nm-dhcp-client.agent

    /usr/lib/common/scripts/dhclient-script

    /usr/sbin/named

    /usr/sbin/tcpdump

    0 profiles are in complain mode.

    2 processes are in enforce mode :

    /usr/sbin/named (5020)

    0 processes are in complain mode.

    1 processes are unbound but have a profile defined.

    /sbin/dhclient3 (607)

    ```


    Here you can see that the /usr/sbin/named profile is loaded and in enforce mode,
    and by my currently running /usr/sbin/named process (PID 5020) is being managed
    by AppArmor.


