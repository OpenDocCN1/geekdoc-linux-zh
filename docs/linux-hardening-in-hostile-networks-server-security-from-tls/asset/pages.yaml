  md: '# Appendix B SSL/TLS


    The HSTS protocol addresses this problem by allowing a website administrator to
    send a special header to tell them that they should only use HTTPS to interact
    with the server. With HSTS, if an attacker attempts a downgrade attack, the browser
    will have cached that header from a previous visit and will send an error. Unfortunately,
    this doesn''t protect a new visitor to a site, but if the attacker wasn''t able
    to attack the first visit, every subsequent visit will be protected.


    # Forward Secrecy


    With TLS, the content of communication between the client and server is protected
    from snooping by encryption. However, encryption standards that were considered
    secure in the past show themselves to be vulnerable to attacks in the future.
    In particular, with some TLS cipher suites, if an attacker were able to decrypt
    just one session, he would be able to extract keys and would be able to more easily
    decrypt future sessions between client and server. That attacker could then capture
    all the communications between the client and server hoping for a breakthrough
    in cracking that particular encryption scheme, and once one session was decrypted,
    he would be able to decrypt subsequent sessions.


    The idea forward secrecy is to generate unique, non-deterministic secrets for
    each session. In doing so, even if an attacker were able to break the encryption
    used in one session, he wouldn''t be able to use that information to break future
    sessions more easily. You don''t know exactly how forward secrecy works to implement
    it on all your servers. All you need is be selective about what TLS ciphers you
    use.


    The potential downside of using cipher suites with forward secrecy is that not
    all clients (such as legacy browsers) support these modern cipher suites; so,
    you may potentially prevent some clients from accessing your server. I found Mozilla''s
    Server TLS guide to be very useful in this regard because it provides two groups
    of cipher suites: Intermediate and Modern. The Intermediate configuration has
    a wider support for older web browsers and is compatible to browsers: Firefox
    1, Chrome, IE 7, Opera 5, and Safari 1. The Modern configuration is more secure
    but requires newer browsers and is compatible to browsers: Firefox 27, Chrome
    30, IE 11 on Windows 7, Edge, Opera 17, Safari 9, Android 0.5, and Java 8.


    Services that TLS also allow you to configure which cipher suites they use, so
    to enable forward secrecy, use the Intermediate or Modern list in your cipher
    suite configuration for output.


