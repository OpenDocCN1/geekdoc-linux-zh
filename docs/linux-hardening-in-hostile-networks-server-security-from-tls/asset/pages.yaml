    # Remote Logging


    Logs are an important troubleshooting tool on a server but they are particularly
    useful after an attacker has compromised a server. System logs every local and
    SSH login attempt, attempt to use sudo, kernel modules that are loaded, extra
    file systems are mounted, and if you use a software firewall with logging enabled
    it might intercept networking traffic from the attacker. On web, database, or
    application servers, you also get log from attempting accesses of these systems.


    As a security-conscious administrator, you will find important that all logs on
    a system might be useful after an attack also be stored on a separate system.
    Centralized logging is useful for overall troubleshooting, but it also makes it
    much more difficult for an attacker to cover their traces since it however finding
    a way to compromise your remote logging server. Depending on your company, you
    may also have regulatory requirements to log certain critical logs (login attempts)
    to a server for longer-term storage.


    There are a number of systems available such as Splunk and Logstash, among others,
    that not only collect logs from servers but can also index the logs and provide
    an interface an administrator can use to search through the logs quickly. Many
    of these services provide their own agent that can be installed on the server
    for collection of logs; however, just all of them support log collection via standard
    syslog network protocol.


