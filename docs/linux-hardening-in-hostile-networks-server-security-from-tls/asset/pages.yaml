- img_proc: true
  md: 'To protect against unauthorized use, we set restrictions on who could issue
    recursive DNS queries against our DNS server and thereby protect against certain
    types of DNS amplification attacks. Because authoritative DNS servers generally
    need to accept incoming traffic from everyone, we took an extra step to implement
    rate limiting so an attacker can only issue so many authoritative DNS requests.
    With both of these measures in place, we can be reasonably assured our DNS server
    won''t participate in someone''s denial of service attack.


    To protect against MitM attacks, we implemented DNSSEC so that all of our DNS
    responses were signed with a key under our control. With DNSSEC in place, an attacker
    would have a difficult time pretending to be us, since they couldn''t modify any
    of our DNS responses and send them downstream with a valid signature.'
