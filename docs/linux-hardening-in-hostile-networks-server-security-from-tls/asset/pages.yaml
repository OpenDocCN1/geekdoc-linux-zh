    # SSL/TLS-Enabled Load Balancing


    Load balancers are a common feature in many networks. They help distribute traffic
    across multiple servers and make sure that services are fault-tolerant by intercepting
    traffic on the front end while continually probing the health of back-end services.
    Since load balancers are often found on the edge of the network, these days often
    offer an extra duty: TLS termination. This means that the load balancer is configured
    with TLS certificates for your hosts, and incoming TLS-protected traffic performs
    all of the necessary TLS handshakes and secure connections with the load balancer.
    The load balancer forwards the request to back-end services.


    In the past, it was desirable for load balancers to terminate TLS connections
    not just because they were on the network edge, but also by doing so they could
    take on the load associated with TLS connections so back-end servers could handle
    the lighter unencrypted traffic. These days, server peers have increased to the
    point that the concerns about TLS overhead are being offset by the difference
    for more security inside the perimeter. These days many security experts have
    shifted away from a security model that assumes the external network is hostile
    and realized that in many cases the'
