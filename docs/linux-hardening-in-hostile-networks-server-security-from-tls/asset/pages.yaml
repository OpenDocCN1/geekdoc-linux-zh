    # What This Book Covers


    Now that we know how the chapters are structured, let''s look at what each one
    covers.


    # Chapter 1: Overall Security Concepts


    Before we get into specific hardening techniques, it''s important to build a foundation

    with the security principles we will apply to all hardening techniques in the
    rest of the

    book. No security book can cover every possible type of threat or how to harden
    every

    t of application, but if you understand some of the basic concepts behind security

    you can apply them to whatever application you''d like to secure. Section 1 of
    Chapter 1

    troduces essential security concepts that you will apply throughout the book and

    fishes with a section on choosing secure passwords and general password manage-

    ment. Section 2 elaborates on the security principles in the first section with
    a focus on

    more sophisticated attacks and provides a general introduction to two-factor authent-

    cication. Section 3 examines how general security principles apply in the face
    of an

    advanced attacker and discusses advanced password-cracking techniques.


    # Chapter 2: Workstation Security


    A sysadmin is a high-value target for an attacker or thief administrators

    typically have privileged access to all servers in their environments. Chapter
    2 covers a series

    of admin-focused workstation-hardening steps. Section 1 covers basic workstation-hardening

    techniques including the use of lock screens, suspension, and hibernation, and
    intro-

    duces the security-focused Linux distribution Tails as a quick path to a hardened
    worksta-

    tion finishes by covering a few fundamental principles of how to browse the

    web securely using an introduction to HTTPS, concepts behind cookie security,
    and

    how to use a security-enhancing browser plugins. Section 2 starts with a discussion

    of disk encryption, BIOS passwords, and other techniques to protect a workstation
    against

    they, a noisy coworker, or a suspicious customs official. The section also features

    anced uses of Tails as a high-security replacement for a traditional OS including
    the

    of the persistent disk and the GPG clipboard applet. Section 3 covers advanced
    techniques

    s as using the Qubes VMs with varying levels of trust. With this in place if,
    for instance, your untrusted

    web browser VMs gets compromised by visiting a bad website, that compromise won''t
    put

    the rest of your VMs or your important files at risk.'
  merge: -1
