  md: '# # Section 2: Encrypted Networks


    In Section 1, we discussed how to protect a network by restricting access to servers.
    In this section, we protecting your network by encrypting its traffic. When network
    traffic is encrypted, you get many different levels of protection. First, attackers
    can''t view any sensitive information that might be going over that network. Second,
    attackers can''t modify or inject traffic inside encrypted tunnel. Finally, encrypted
    network protocols usually include a method to authenticate the connection so you
    can protect yourself from MitM attacks.


    In this section, OpenVPN, will set up an encrypted VPN between two hosts and is
    often used so you can connect your personal computer to a private network securely.
    The remote approach uses the SSH protocol, which most servers use for remote administration,
    to set up an encrypted tunnel between two hosts that mimics the functionality
    of a VPN and you forward a connection to a local port on a system to a remote
    port on another system. The next approach describes how to configure a load balancer
    to terminate TLS connections for you and forward them to downstream services securely
    using HAProxy. Finally, I discuss how to set up an encrypted tunnel between two
    services, even if they can''t communicate over SSH.


    # ## OpenVPN Configuration


    When all your workstations and servers are within the same physical network, it''s
    relatively easy to set up secure access between your workstations and your servers.
    In most environments, however, even if your servers all are on the same network
    as your እንደሚ lie on a separate network. If you use cloud services, this is definitely
    the case. Plus, most administrators will want to administer networks from their
    home or wherever they happen to be in the case of an emergency. In all these cases,
    you need the ability to connect your workstation to your remote network securely,
    and VPNs allow you to do just that.


    A VPN allows you to create a secure network over an insecure one (generally over
    the Internet) by providing an encrypted tunnel between two points. Usually these
    points are between two VPN server endpoints (to link networks to each other) or
    between a VPN server and a client (to connect your personal computer to a remote
    network). In either case, with a VPN your traffic is set over an encrypted tunnel
    and you can access machines on the other side of the tunnel as though you were
    part of that network. And even though the traffic is going over an insecure network
    it is still protected from sniffing.


    In this section, we discuss how to set up your own secure VPN using open-source
    OpenVPN software, which should be packaged for just about any major Linux distribution.
    Whether you are configuring an OpenVPN server or a client, you will need to install
    the openvpn package, which should just “openvpn” in your distribution. It will
    provide the software and basic documentation including example configuration files
    for both client and server configuration.'
  merge: -1
  pgno: 113
- img_proc: true
  md: '# OpenVPN Server Configuration


    Both the OpenVPN server and the client use the same software and rely on differences
    in the configuration file to determine whether acts as a server or a client. While
    you can certainly configure OpenVPN to act as a gateway for all traffic, in this
    example we will assume you want to use to connect clients to a secured network.
    All server-side settings will be put in /etc/openvpn/server.conf. The first part
    of the configuration sets some general defaults for the type of VPN you will build:


    ```

    port 1194

    proto udp

    dev tun

    comp-lzo

    management 127.0.0.1 1194

    ```


    These are all standard OpenVPN settings mostly unrelated to security, but if you
    are curious what the settings do, here are the details: First, we set the default
    port and protocol. The standard OpenVPN port is 1194. While you can use either
    UDP or TCP for OpenVPN, UDP requires less overhead. The dev tun setting requires
    a little of explanation as to why pick what kind of network encapsulation OpenVPN
    will use. OpenVPN can encapsulate layer 3 traffic with the tun device or layer
    2 traffic with the tap device. which means clients using OpenVPN will use a separate
    IP address from the internal secured network. The comp-lzo setting adds compression
    to our network to help reduce bandwidth where possible. Finally, the management
    setting is optional but useful as it lets us open a special administrative port
    to which we can connect with telnet or netcat and pull statistics from the running
    OpenVPN server as well as perform administrative operations like viewing and kicking
    connected users. Because there is no authentication on service, you may not want
    to enable it at all. If you decide to enable, do so only on the localhost IP (127.0.0.1).


    The next group of settings controls persistence and logging:


    ```

    keepalive 10 120

    persist-key

    persist-tun

    config-pool-persist ipp.txt

    status openvpn-status.log

    verb 3

    ```


    The keepalive setting controls when OpenVPN will disconnect idle clients. The
    persist-key and persist-tun options allow the daemon to persist its network device
    and the keys it has in memory across specific kinds of restarts, even though OpenVPN
    may drop privileges after the initial service starts. The ifconfig-pool-persist
    option lets you to keep track of IP assignments the server gives clients. This
    lets you out the same IP address to a client the next time you connect and can
    be useful if you want to allow clients on the VPN to be able to talk to each other.
    Finally, the status setting tells OpenVPN where to save its status, and the verb
    option controls how verbose OpenVPN logs are.'
