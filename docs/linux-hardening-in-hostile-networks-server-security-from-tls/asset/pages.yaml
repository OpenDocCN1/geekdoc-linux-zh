    key could sign the record, you can be assured the result was signed by someone
    who controls the domain. If someone tampered with the record along the way, the
    signature no longer would match.


    Like PGP-signed email, having cryptographic signatures attached to a document
    is not sufficient reason to trust the document. After all, attackers could generate
    a different keypair, change the record, and attach their public key and signature
    instead. With DNSSEC, you need an outside mechanism to know you you trust that
    the public key you are getting true from the domain. With PGP-signed email, you
    validate the public key with outside mechanisms, as key-signing parties, with
    the hope that if you receive an email from which you don''t immediately have a
    public key signature, someone you trust does and can use that chain of trust to
    validate the signature. I don''t know of any DNSSEC key-signing parties; instead,
    the chain of trust is built like how it is with the CA system.


    When you visit a site that''s protected by HTTPS, the site will present you with
    a copy of its public key (here called a certificate) so you can establish a secure,
    encrypted communication channel with it; but equally, you can also validate that
    you are in communicating with, for instance, mail.google.com and not attacker.
    Because you probably didn''t go to a Google key-signing party either, how can
    you trust that certificate? It turns out that each certificate is signed by a
    CA like Verisign, Thwaite, or one of many others. This signature is attached to
    the certificate you receive, and your browser has itself public keys for each
    of the CAs built in it. The browser implicitly trusts these certificates, so if
    you receive a certificate from a site that has been signed by any of these CAs,
    you will trust it as. This trust, by the way, is why it is such a problem when
    a CA hacked. Attack can use the private keys from CA to generate new certificates
    for each site they want to impersonate, and browsers will trust them automatically.


    DNSSEC follows a similar chain of trust to PGP keys and CAs. In this case, the
    root DNS serves as the trust anchor, and DNSSEC resolvers implicitly trust what
    the root DNS servers sign, when a TLD wants to implement DNSSEC, it publishes
    a special delegation (DS) record to the root DNS servers to sign. Those DS records
    contain a signature for the domain generated by its private key. The root DNS
    server hosts that DS record and signs it with its private key. In that way, because
    you trust root, you can trust that the signature for the org TLD has not been
    modified; therefore, you can trust org''s key in the same way you would trust
    a certificate signed by a CA. Then, for instance, you would submit a DS record
    for each key through your registrar that supports DNSSEC. Each DS record contains
    a key''s signature for your domain that the org names then would sign and host.


    In this model, the chain of trust basically follows the same order that a recursive
    DNS query like the one I outlined previously would follow. A DNSSEC query adds
    an extra validation step to each part of the process. For instance, a query for
    www.isc.org starts at the root, uses the DS record for .org to validate signatures,
    then uses the DS record'
