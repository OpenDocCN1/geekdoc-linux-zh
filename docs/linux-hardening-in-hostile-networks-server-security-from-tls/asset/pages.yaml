  md: '# Chapter 6


    # Email


    You listed networks in Postfix via the mynetworks option. This parameter is set
    to a comma-separated list of network subnets. You will want to make sure this
    value is at least set to localhost (127.0.0.0/8) so your you machine can send
    mail. On top of that, add any additional networks you want to allow. For instance,
    if your internal network used the classic 192.168.0.0/24 IP address scheme, your
    mynetworks line might look like this:


    ```

    mynetworks = 127.0.0.0/8, 192.168.0.0/24

    ```


    If you wanted to add a specific IP address to mynetworks, you don''t have to use
    the subnet naming convention; you can just list the IP itself:


    ```

    mynetworks = 127.0.0.0/8, 192.168.0.0/24, 12.34.56.78

    ```


    Just be cautious when adding Internet-routable IPs to this list because that host
    gets compromised they might use your email server relay spam!


    # Rel Restrictions


    The next step to prevent your server from becoming an open relay is to define
    relay restrictions. Postfix does this with the smtpd_relay_restrictions command.
    Depending on your version of Postfix, your default may be safe—but it doesn''t
    hurt to confirm with it:


    ```

    sudo postfix conf | grep smtpd_relay_restrictions

    ```


    This should be set to:


    ```

    smtpd_relay_restrictions = permit_mynetworks, permit_sasl_authenticated,

    reject_unauth_destination

    ```


    When Postfix decides whether to allow a server to relay email, it checks whether
    the client meets one of the restrictions set in smtpd_relay_restrictions. It''s
    worth going over the individual policy settings because they show up often when
    hardening Postfix:


    +   * permit_mynetworks: This policy tells Postfix to allow the client if its
    IP address is found in the list of trusted networks set in the mynetworks setting.

    * permit_sasl_authenticated: This policy tells Postfix to allow any clients who
    have authenticated Postfix (for instance, with a username and password). In the
    next section we discuss how to configure authentication in Postfix so you can
    allow users to relay email even if they aren''t on the local network.

    * reject_unauth_destination: This policy tells Postfix to reject any unless they
    are sending email to a domain for which Postfix is explicitly configured to relay
    email or a domain for which this Postfix server is the final destination. For
    instance, if this server was configured to accept email for example.com, it would
    allow a client to connect to it and send end email for example.com, even if they
    didn''t authenticate or were a part of a trusted network. It wouldn''t allow that
    same untrusted client to relay an email for gmail.com, however.'
