  md: "# Chapter 7 DNS\n\nIn BIND, master name servers are defined in the zone section\
    \ of the configuration file via the type master; directive:\n\n```\nzone \"example.com\"\
    \ {\n  type master;\n  file \"db.example.com\";\n  allow-transfer ( 12.23.34.45;\
    \ 12.23.34.56 );\n}\n```\n\nAlso, note the allow-transfer statement further down\
    \ in the example. That line defines the IP addresses of any servers you want allow\
    \ to perform zone transfers. While DNS records aren't exactly a secret, you don't\
    \ want to allow just to pull down your entire list of hosts and IP addresses,\
    \ so the allow-transfer option lets you restrict it. Usually you will set it to\
    \ the IP addresses of secondary name servers.\n\nSecondary name servers are also\
    \ defined in the zone section of the configuration file via the type slave; directive:\n\
    \n```\nzone \"example.com\" {\n  type slave;\n  file \"/var/cache/bind/db.example.com\"\
    ;\n  masters { 11.22.33.44 };\n  allow-transfer { \"none\"; };\n}\n```\n\nNote\
    \ that in the secondary name server I disallowed any zone transfers by allowing-transfer\
    \ to none, but in some cases you may want another secondary name server to treat\
    \ this as a master. In that case, you could add that other's IP address here.\
    \ Also, note the masters configuration option. That option defines the list of\
    \ IP addresses this name server tracks updates for this zone. It is important\
    \ to list of IPs accurate because any server in the list of masters can update\
    \ any records on your secondary name server.\n\nFinally, whether your authoritative\
    \ name server is a master or secondary, you should disable recursive DNS queries\
    \ system-wide. To do this, you could add an allow-recursion \"none\"; directive\
