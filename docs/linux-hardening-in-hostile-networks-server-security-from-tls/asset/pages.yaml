  md: '# Chapter 5 Web Servers


    <Directory>, <Location>, and <Files> blocks including the capability to automatically
    honor .htpasswd files one might upload to a particular directory. Instead of exploring
    possible combinations, I will describe two common cases: restricting a sensitive
    directory on your web server and restricting a particular URL. Which of these
    examples you pick mostly depends on how you have organized your Apache configuration.
    Some people like to organize settings based on the file system, in which case
    you might prefer using the directory context. Others to link in terms of the URLs
    that people visit on their site, in which case you would use the location context.
    In either case, let''s assume that your website''s document root is at /var/www/html
    and you want to create a new password-protected directory called "secrets" underneath
    usernames and passwords defined in /etc/apache2/htpasswd-example.com. In the directory
    context, this looks like the:


    ```

    <Directory "/var/www/html/secrets">

    AuthType Basic

    AuthName "Login to see the secrets"

    AuthUserFile "/etc/apache2/htpasswd-example.com"

    Require valid-user

    ```


    ```

    Order allow,deny

    Allow from all

    </Directory>

    ```


    In this example, you can see that AuthType tells Apache what kind of authentication
    to use (Basic) and AuthName lets you define a message the person sees on the login
    prompt. The AuthUserFile points to the location of your htpasswd file, and the
    Require line you set who among the users in the htpasswd file can log in. In this
    case, we set it to valid-user, which means any user can log in.


    The same entry in the location context assumes that /var/www/html is the document
    root, and therefore you want to protect any access to /secrets. The configuration
    looks like this:


    ```

    <Location "/secrets">

    AuthType Basic

    AuthName "Login to see the secrets"

    AuthUserFile "/etc/apache2/htpasswd-example.com"

    Require valid-user

    ```


    ```

    Order allow,deny

    Allow from all

    </Location>

    ```


