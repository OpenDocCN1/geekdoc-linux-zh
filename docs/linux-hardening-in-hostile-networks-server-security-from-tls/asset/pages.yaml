  md: "Nginx doesn't provide a direct mechanism to change the ssl_verify_client behavior\
    \ inside a location{} section. The best you can do at this point is either move\
    \ the restricted site to its own server{} section, or set ssl_verify_client to\
    \ optional and test whether the client was able to authenticate via the internal\
    \ ssl_verify_client variable and return a 403 unauthorized response if it's not\
    \ set to SUCCESS:\n\n```\nssl_verify_client optional;\nssl_client_certificate\
    \ /path/to/ca_certificate.crt;\n\nlocation = /secrets {\n    if ($ssl_client_verify\
    \ != SUCCESS ) {\n        return 403;\n        break;\n    }\n}\n```\n\n# Section\
    \ 3: Advanced HTTPS Configuration\n\nIt turns out that even if you have enabled\
    \ HTTPS on your web server, it may not be enough to protect your clients when\
    \ they access your site. Over the years, a number of weaknesses have been found\
    \ in different versions of SSL and TLS as in various cipher suites used by web\
    \ servers to encrypt traffic between them and a web browser. There have also been\
    \ attacks against HTTPS such as the protocol downgrade attack, a MitM attack in\
    \ which the attacker intercepts HTTPS traffic as though she tells the client only\
    \ HTTP is available. All of this means your work isn't just by providing HTTPS.\n\
    \nIn this section, we dive further into more advanced HTTPS server configuration\
    \ to address some of the above attacks, and we go further into other hardening\
    \ steps you can use to filter malicious traffic before it gets to a potentially\
    \ vulnerable application.\n\n# HSTS\n\nOne way to defeat HTTPS protection on a\
    \ site is via a downgrade attack, in which the attacker sits between the web server\
    \ and tells the client that HTTPS is not available. The client will then probably\
    \ shrug and go back to the HTTP version of the site, the attacker will be able\
    \ to intercept the client's traffic in the clear. Even if the server sets a 302\
    \ redirect from HTTP to HTTPS, the attacker could strip that out. The HTTP Strict\
    \ Transport Security (HSTS) protocol addresses this problem by allowing a website\
    \ administrator to send a special header to clients to tell them they should only\
    \ ever use HTTPS to interact with the server. With HSTS, if an attacker performs\
    \ a downgrade attack, the browser will have cached that header from a previous\
    \ visit and will send the client an error.\n\nWhile HSTS may sound complicated,\
    \ it is relatively simple to add to your HTTPS site, as it only requires one line\
    \ of configuration under the rest of your HTTPS configuration. For Apache, this\
    \ line looks like this:\n\nHeader always set Strict-Transport-Security \"max-age=15768000\""
