  md: '# Section 3: Advanced Hardening


    151


    Now add the following lines to your /etc/postfix/main.cf file to configure it
    to usenOpenDKIM:


    ```

    # OpenDKIM

    milter_default_action = accept

    milter_protocol = 2

    smtpd_milters = local:/opendkim/opendkim.sock

    non_smtpd_milters = local:/opendkim/opendkim.sock

    ```


    Now restart postfix and you are ready to test a signed message:


    ```

    sudo service postfix restart

    ```


    # Test Postfix with DKIM


    One way to test DKIM is to send an email through your mail server to check-verifier.port25.com.
    This is a free service that helps administrators test services like SPF and DKIM,
    and it will automatically reply to any emails to it with the response to SPF,
    DKIM, and a number of other email tests. Once you get your reply, scroll down
    to the DKIM section, where you will hopefully see something like this:


    --------------------------------------------------------------------------------


    DKIM check details:


    --------------------------------------------------------------------------------


    ```

    Result: pass (matches From: me@example.com)

    ID(s) verified: header.d=example.com

    ```


    --------------------------------------------------------------------------------


    If you see something like "neutral (message not sent)," Postfix and OpenDKIM aren''t
    communicating properly. To troubleshoot, check your Postfix logs for errors and
    confirm that the opendkim socket file exists and Postfix is a member of the opendkim
    group.


    # Rotate DKIM Keys


    It''s recommended that you rotate your DKIM keys every month, or at least six
    months to year. To do this, make sure that you generate new keys while the previous
    keys may be in emails that are still in flight will still be. Let''s say that
    month after my initial keys were set up I''m ready to rotate them. Before I generate
    and overwrite my existing keys, I want to make sure that postfix and opendkim
    services are stopped so they don''t use the new keys before I''m ready for them
    to:


    ```

    sudo service postfix stop

    ```


    ```

    sudo service opendkim stop

    ```


    Now I generate new keys. Since this is a month, I will pick a new selector (say
    20169) and generate new keys on this selector just like I did in the initial example:


    ```

    opendkim-genkey -b 2048 -s 20169 -r -d example.com

    sudo mv 20169.private /etc/opendkim/keys/example.com.private

    sudo mv 20169.txt /etc/opendkim/keys/example.com.txt

    sopendkim-genkey -b 2048 -s 20169 -r -d example.net

    ```'
