    # Client-Side Encryption


    In some applications, the client that interacts with data in the heavier client-side
    program to encrypt data on the client with a key that never leaves the client''s
    computer. The client sends your encrypted payload, which it then stores in the
    database. When the client needs that data again, the application sends the encrypted
    data back to the client, where it''s decrypted.


    The client-side encryption approach works well for data that the application needs
    to understand or process. The advantage to this approach is that if an attacker
    compromises the database or the server-side application, they can''t decrypt encrypted
    data in the database without also compromising the client.


    This approach isn''t without its disadvantages. Though if the application needs
    to analyze data to perform calculations or compare one user''s data with others,
    this approach won''t work. This also offloads the load involved in encryption
    and decryption to the client, which may be an advantage or disadvantage to you
    depending on the expected horsepower on the client. Another key disadvantage (pun
    intended) to this approach is that if the customer loses his key, the data is
    irretrievable.


    # Summary


    If any part of your infrastructure holds valuable data, it''s your database tier.
    Even organizations that are somewhat lax about security will still put some extra
    effort into securing their databases and bury them deep within their network.
    In this chapter, we discussed a number of steps you can take to harden your database
    starting with bases of where to place it in your network, how to administer it
    securely, and how to set permissions. Next, we covered how to harden database
    network access with a combination of network access controls and protection of
    database communication with TLS. Finally, we discussed some database encryption
    approaches and highlighted some of the strengths, weaknesses, and limitations
    of each approach.'
