  md: '# Chapter 2 Workstation Security


    Beyond taking advantage of using SSH sessions, an attacker who has access to a
    running computer may find a browser with plenty of privileged accounts either
    logged in or with saved passwords. Even none of these things are true, it only
    takes a few minutes at an unattended computer to install a keylogger or other
    programs that lead to remote access to your computer. For these and a number of
    other reasons, your workstation security starts with how you protect it when you
    aren''t using it.


    # Lock Screen


    Screensavers used to be required not for security, but to avoid an image being
    burned into your old cathode ray tube (CRT) monitor. These days burn-in isn''t
    a concern, but most desktop environments enable screensavers. So, if you step
    away from your computer for minutes or so, the screensaver kicks in. All desktop
    environments don''t necessarily enable a lock screen with their screensaver by
    default, so you will want to go to your screensaver settings and make sure a password
    is required. Where screensaver settings are located on your desktop menu will
    be different for each desktop environment, screensaver settings should be found
    in the settings menu along with the rest of your desktop.


    Enabling the lock screen with your screensaver is a good step but isn''t enough
    to protect your computer all by itself. Since most screensavers don''t turn on
    until ten or more minutes of inactivity, they won''t protect you from someone
    who walks up to your computer immediately after you are out of sight. What''s
    more, there are USB devices that can be plugged in that simulate a keyboard and
    mouse to make sure the screensaver doesn''t start. To further protect yourself,
    you should make a habit to always lock your screen whenever you leave your computer.


    # Locking Shortcuts


    Some desktops provide a lock screen button you can add to your panel or a lock
    option you can add to your logout button, but I''ve found it more convenient to
    use a key shortcut. After a while, you will find it becomes second nature to hit
    that combination when you step away. Unfortunately, no two desktop environments
    agree on what the best default lock keyboard shortcut should be (if they set one
    at all). Often it''s some combination of the L key and Ctrl, Alt, Ctrl and Alt,
    or the Meta (Windows) key. Don''t just hit the shortcut and walk away, though.
    Always make sure that the screen actually locks.


    # Bluetooth Proximity Locking


    If you do research on screen locking, you may come across some software that allows
    you to use your phone or other Bluetooth device to unlock your screen. I''ve even
    written about such software in the past. It sounds convenient—once you step away
    from your computer screen will automatically lock and unlock once you come back.
    The problem is tuning that proximity can be challenging, particularly with some
    of the high-quality Bluetooth hardware on modern phones. You may find it difficult
    to get the screen to lock without leaving your building. If you can tune it'
