  md: '# Chapter 3: Server Security


    If someone is going to compromise your server, the most likely attack will either
    be through a vulnerability in a web application or other service the server hosts,
    or through SSH. In other chapters, we cover hardening for common applications
    your server may host, as Chapter 3 focuses on more general techniques to secure
    just any server you have, whether it''s hosting a website, email, DNS, or something
    completely different. This chapter includes several techniques to harden SSH and
    access to the server with to limit the damage an attacker or a malicious employee
    can do if he gains access to the server with tools like apport and sudo. We also
    cover disk encryption to protect data at rest and how to set up a remote syslog
    server to make it more difficult for an attacker to cover their tracks.


    # Chapter 4: Network


    With workstation and server hardening, network hardening is a fundamental part
    of infrastructure. Section 1 of Chapter 4 provides an overview of network security
    and then introduces the concept of the man-in-the-middle attack in the context
    of an upstream network. Section 1 finishes with an introduction to iptables firewall
    settings. Section 2 covers how to set up a private VPN using OpenVPN and how to
    leverage SSH to tunnel traffic when a VPN isn''t an option. It covers how to configure
    a software load balancer that can terminate SSL/TLS connections and initiate new
    ones downstream. Section 3 focuses on Tor servers, including how to set up a standalone
    Tor secrecy strictly for internal use, as an external node that routes traffic
    within Tor, and an exit node that accepts traffic from the Internet. It also discusses
    the creation and use of hidden Tor services and when you need to mask even that
    you are using Tor.


    # Chapter 5: Web Servers


    Chapter 5 focuses on web security and covers both the Apache and Nginx web servers
    in all examples. Section 1 covers the fundamentals of web server security including
    web server permissions and HTTP authentication. Section 2 discusses how to configure
    HTTPS, how to set it as the default by redirecting all traffic to HTTPS, how to
    secure HTTPS reverse proxies, and how to enable client certificate authentication.
    Section 3 discusses more advanced web server hardening including HTTPS forward
    secrecy and web application firewalls with ModSecurity.


    # Chapter 6: Email


    Email was one of the first services on the Internet, and it''s still relied on
    by many people not for communication but also security fundamentals and server
    hardening, including how to avoid becoming an open relay. Section 1 of Chapter
    6 introduces overall email security fundamentals and Section 2 covers how to require
    authentication for SMTP relays and how to enable SMTPS. Section 3 covers more
    advanced email security features that both aid in spam prevention and overall
    security such as SPF records, DKIM, and DMARC.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Chapter 7: DNS


    Domain Name Service (DNS) is one of those fundamental network services to which
    many people never give a second thought (as long as it''s working). In Chapter
    7, we cover how to harden any DNS server before you put it on a network. Section
    1 describes the fundamentals behind DNS security and how to set up a hardened
    DNS server. Section 2 goes into more advanced DNS features such as rate limiting,
    query logging to provide forensics for your environment, and authenticated dynamic
    DNS. Section 3 provides an introduction to DNSSEC and the new DNSSEC records and
    discusses how to configure DNSSEC for your domain and how to set up and maintain
    DNS keys.


    # Chapter 8: Database


    If there is only one place in your infrastructure that holds important information,
    it''s likely to be a database. In Chapter 8, we discuss two different approaches
    to database security for the two most popular open-source database servers: MySQL
    (MariaDB) and Postgres. Starting with Section 1, we cover some security practices
    you should follow as you set up your database. Section 2 dives into intermediate
    hardening steps including setting network access control and encrypting traffic
    with TLS. Section 3 focuses on database encryption and highlights some of the
    options available for encrypted data storage in MySQL and Postgres.


    # Chapter 9: Incident Response


    Even with the best intentions, practices and efforts, sometimes an attacker will
    find a way in. When that happens, you will want to collect evidence and try to
    find out how he got in and how to stop it from happening again. Chapter 9 covers
    how to best respond to a server you suspect is compromised, and how to collect
    evidence. Section 1 lays down some fundamental guidelines for how to approach
    a compromised machine and safely shut down so other parties can start an investigation.
    Section 2 gives an overview of how to perform your own investigation and discusses
    how to create archival images of a compromised server and how to use forensics
    tools Sleuth Kit and Autopsy to build a file system timeline to identify what
    the attacker did. Section 3 includes walking through an example investigation
    and guides to forensics data collection on cloud servers.


    # Appendix A: Tor


    Chapter 4 discusses how to use Tor to protect your anonymity on a network, but
    it focuses more on how to use Tor and less about how Tor works. Here I dive a
    bit deeper into how Tor works and how it can protect your anonymity. I also discuss
    some of the security risks around Tor and how you can mitigate them.'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'Preface xxi


    # ## Appendix B: SSL/TLS


    Throughout the book, I explain how to protect various services with TLS. Instead
    of bogging down with the details of how TLS works in almost every chapter, I''ve
    put those details here as a quick reference in case you are curious about TLS
    works, how it protects you, its limitations, and some of its security risks and
    how to mitigate them.


    # ## Conventions


    This book uses a monospace font for code. Code lines that exceed the width of
    the printed page are indicated by a continuation character (➥) at the start of
    the portion of the line that has wrapped to indicate it is all one line.


