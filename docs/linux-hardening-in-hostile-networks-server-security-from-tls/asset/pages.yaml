- img_proc: true
  md: '# Section 1: Incident Response Fundamentals


    # Image the Server


    Another decision in your incident response policy should be step-by-step instructions
    on how to image your servers. Once the power has been pulled, whatever you can
    to ensure that the machine doesn''t boot up until you have been to image all disks
    on the system. A pristine image is so important that you can perform forensic
    analysis on the image without overwriting the original evidence. Plus, once you
    have an image to work from, you can consider redeploying the server. Later in
    this chapter, we will discuss some different methods to get an image of your server
    without overwriting any data.


    If the host is a VM and you were able to take a snapshot, you have even more data
    to work from. Create a copy of the entire VM, snapshot and all. Then you can potentially
    replay the time you discovered the attack repeatedly and run tools on the running
    snapshot-image without fear of corrupting data.


    If you have the space, consider two images. One is a gold image that you put away
    and don''t touch, and the other is an image that you use for any forensic analysis
    you might perform. When you have multiple images, if you make a mistake and accidentally
    write to one of your analysis, you will have the gold image to copy. This is particularly
    important if you under redeploy the compromised server.


    # Server Redeployment


    Another thing to consider before a crisis occurs is whether and when you should
    rebuild a server. The best practice is to rebuild a server from scratch whenever
    there has been a breach. It can be easy, at least if the attacker was sloppy,
    to prove did install a root kit if you see the software out in the open, but unless
    you are skilled at forensic analysis it can be difficult to prove an attacker
    didn''t install a root kit or some sort of Trojan horse on the system. A root
    kit can hide all sorts of things from the administrator, unless you are absolutely
    sure there is no root kit, rebuild the machine.


    How you go rebuilding the server might be decided on a case-by-case basis. Some
    servers (particularly those in a cluster) often be rebuilt from scratch without
    a thought. Other servers, such as database or email servers that are not in a
    cluster, can be more difficult because they hold data you need to transfer to
    the new host. These types of machines might have to go into quarantine until you
    can make sure that data can be trusted. To be safe, you might even have to track
    down when the attack occurred and roll back the files on the system from a previous
    backup. Also, you might need to keep the machine in quarantine until you can track
    down how the attacker got in and patch the hole before risking another intrusion.


    # Forensics


    Once you have a valid image of the system''s partitions, you might want to perform
    some sort of forensic analysis on it. Computer forensics is a vast topic, and
    it can take'
  merge: -1
  pgno: 225
- img_proc: true
  md: 'years of work for you to become proficient. That being said, even if you aren''t
    a skilled forensics expert, you might want to try identifying how the attacker
    got in.


    One basic method of forensics analysis is simply to take the image of your attacked
    server to another, mount it loopback and read-only, and then look around the mounted
    clusters. For instance, if I had an image of a partition on an external USB drive
    mounted at /media/disk1/ and the image itself at /media/disk1/webl-sda.img, I
    could use the following command to mount the disk at /mnt/temp:


    ```

    $ sudo mkdir /mnt/temp

    $ sudo mount -o loop,ro /media/disk1/webl-sda.img /mnt/temp

    ```


    Another forensics tool is chrootkit. This program can check a file system for
    root kits and then output a report. This tool is packaged for most distributions
    with the package name chrootkit. Note that you generally don''t want to run on
    a live system because it will potentially overwrite evidence. Instead, mount an
    image somewhere on your system (in this example I mount the root file system image
    /mnt/temp), and then check chrootkit to:


    ```

    $ sudo chrootkit -r /mnt/temp

    ```


    Ultimately, complete forensics on a host could take days, weeks, or even months
    to complete, depending on your experience, the nature of the attack, and how thorough
    you want to be. Even if you decide to reject the host and already know how the
    attacker got in, it''s worth experimenting with these forensics tools they provide
    you with greater insight into how your system works long. The rest of this chapter
    dives into more sophisticated forensics analysis and techniques.


    # # Section 2: Secure Disk Imaging Techniques


    One of the biggest mistakes you can make during incident response is damaging
    evidence. In Section 1, we discussed different methods to shut down a computer
    after serving it, especially if you might allow law enforcement. Once the system
    is shut down, the goal is to create at least one separate, secure image of all
    data on the compromised system and use that instead of the original system for
    your forensics investigation. You should also use a tool like sha256 to create
    and preserve a checksum against the original drive and against the image you create.


    Why go through all this? With the size of hard drives these days, it could take
    hours or even days to create a set of images. During this time, you will likely
    have other people who want answers as to who the attacker was, and what they were
    doing. If you skip the imaging step, however, it becomes much easier to make a
    mistake in the forensics analysis that writes to the original data. Remember,
    the goal is to preserve the evidence exactly as it was when the intrusion was
    discovered. If you intend to prosecute, and if you do not handle the evidence
    with care, it could cast doubt into what findings you discover down the road.'
  merge: -1
  pgno: 226
- img_proc: true
  md: '# Section 2: Secure Disk Imaging Techniques 201


    When you create an image to work from and create a checksum against both your
    image and the original system, you have a way to prove the down that your image
    matches the original. (If you take a fresh checksum of the image, it should match
    the checksum of the original drive.) Furthermore, if you accidentally use special
    hard drive with the write disconnected to avoid this issue, you still have the
    option to create a fresh working image from the original. Or, if you plan to use
    the original server back into—which means overwriting the original data—you should
    at least make two images: one to work from, and another gold that you don''t touch
    unless you need to create a fresh working copy. In that case, you most definitely
    want to create and preserve a checksum of the original drive so you can prove
    the down that your gold image still matches the original.


    # Choose the Imaging System


    There are different approaches you can take to get a hard drive image, but each
    method requires some thought. For instance, you could just remove the drives,
    put them in a USB enclosure, and connect them to your personal computer. The risk
    with this approach, however, is that your laptop may detect the partitions on
    the disk and configured to automatically mount them/write. This is helpful for
    thumb drives but could be disaster for forensics. If you do this kind of approach,
    be sure to disable any automounting software on your desktop.


    Of course, with many servers, it could be difficult to physically remove the drives—and
    even if you did, you may have a hard time finding a USB drive enclosure for the
    SCSI drives you find in servers. It may be even more difficult to do this if your
    server is in a different city or country. In the case of VMs, there probably not
    even a real disk to remove, just a virtual disk image on any anywhere. In cases,
    you likely want to boot the compromised system from some sort of rescue disk so
    you can access the local drives without booting the drives themselves (which would
    of course write to them). There''s a risk with the rescue disk approach similar
    to that of connecting disks to your personal computer: rescue disks often to if
    they don''t mount partitions, rescue disks automatically mount any swap partitions.
    Pick a rescue disk (like Tails) that explicitly states that it does not automatically
    mount partitions, swap, or otherwise write to any underlying disks.


    # Create the Image


    Now that you have picked the method you will use to access the disk and are booted
    into that environment, we can discuss how to create the image. The first step
    is to use sha256sum to create a unique hash for your drive. In this example, let''s
    assume that the drive we want to image as /dev/sda. We would want


    ```

    $ sha256sum /dev/sda

    8294117603703457b0f2548aeb88dc45cbe11f161789e8871c760261a36dd /dev/sda

    ```'
