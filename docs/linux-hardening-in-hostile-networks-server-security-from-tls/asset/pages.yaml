  md: '# Download and Verify the Qubes ISO


    You can download the latest version of Qubes from https://www.qubes-os.org/downloads/.
    On that page, you will find links to download the ISO image for the installer
    as well as more detailed instructions on how to create a bootable USB disk with
    Qubes ISO. (Starting with the 3.1 ISO, the image is larger than will on a standard
    DVD, so you will need to stick with a USB-based install for that version.)


    In addition to the ISO, you should also download the signature file and signing
    key files via their the same download page. The signature file is a GPG signature
    using the Qubes team''s GPG signing key. You can verify not only that the ISO
    was damaged, but also that someone between you and the Qubes site didn''t substitute
    a different ISO. Of course, an attacker could replace the ISO could also replace
    the signing key, so it''s important to download the signing key from different
    computers on different networks (ideally not directly associated with you) and
    use a tool sha256sum to compare the hashes of all the downloaded files. If all
    hashes match, you can reasonably sure you have the correct signing key, given
    how difficult it would be for an attacker to man-in-the-middle computers and networks.


    Once you have verified the signing key, you can import it into your GPG keyring
    of the following:


    ```

    $ --import qubes-master-signing-key.asc

    ```


    Then you can verify the ISO against the signature:


    ```

    $ gpg -V --verify Qubes-R3.1-x86_64.iso Qubes-R3.1-x86_64.iso

    g: armor version: GnuPG v1

    g: Signature Date Tue 08 Mar 2016 07:14:56 PST for RSA key ID 03FA5082

    g: using classic trust model

    g: Good signature from ''Qubes OS Release 3 Signing Key''

    g: WARNING: This key is not certified with a trusted signature!

    g: There is no indication that the signature belongs to the owner.

    Key fingerprint: C522 B2E8 0822 D94C AID1 CB11 D3FA5082

    g: binary signature, digest algorithm SHA256

    ```


    What you are looking for in the output is the line that says "Good signature"
    to prove the signature matches. The warning in the preceding output is to be expected
    unless, when you added the Qubes signing key to your keyring, you took the additional
    step to edit it and mark it as trusted.


