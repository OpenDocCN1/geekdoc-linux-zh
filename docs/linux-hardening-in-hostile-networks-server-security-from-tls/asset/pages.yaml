  md: '# Preface


    We are living in the golden age of computer hacking. So much of our daily lives—from
    how we communicate, to we socialize, how we read news, to how we shop—is conducted
    on the Internet. Each of those activities rely on servers sitting somewhere on
    the Internet, and those servers are being targeted. The threats and risks on the
    Internet today and the impact they can have on the average person are greater
    than ever before.


    While there are exceptions, most computer hackers few decades ago were motivated
    primarily by curiosity. If a hacker found a major vulnerability in a popular application,
    she might break the news at a security conference. If she compromised a network,
    she would look around a bit and minimal the damage was minimal. These days, many
    hackers are motivated by profit (i.e., a new, patched vulnerability not disclosed
    to the vendor) in a popular application can be sold for tens to hundreds of thousands
    of dollars. Databases from hacked networks are sold on the black market to identify
    theft. Important files are encrypted and held for ransom.


    Hacker motivations are not the only thing that changed; so have the hackers themselves.
    While you will still find hasty, many hackers wearing black hoodies and hacking
    away in a basement, a stereotype doesn''t match the reality. The spread of high-speed,
    always-on Internet throughout the world means that Internet users in general,
    and hackers reflect the diversity of the world itself. Instead of a black hoodie,
    a hacker today might wear a dress, a tee, a uniform, and may work for organized
    crime or surveillance. Hackers are international and diverse, and so are their
    targets.


    With everyone, hacking has becoming a very important part of surveillance, espionage,
    and even warfare. Nation-state hackers have become more over the years to the
    point that it''s not uncommon to hear of nation-state actors compromising power
    grids, nuclear facilities, or major government networks. Nation-state hackers
    are well-funded, well-trained, and as a result they have sophisticated tools and
    methods at their disposal. Unlike unconventional military tools, these tools find
    their way into the ordinary hacker''s toolkit sometimes after a year or two. This
    means that even if your threat model doesn''t include a nation-state attack, it
    must still account for last year''s nation-state hacking capabilities.


    Hackers aren''t the only thing that''s different; so are the targets. In the past,
    hackers might target well-known, large companies, banks, or governments, and they
    would target them primarily from the outside, spending a lot of time researching
    the target, discovering vulnerabilities in their software, and then exploiting
    them. The external'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'network was viewed as a hostile war zone, the internal network was viewed as
    a safe haven, and the two were connected by computers in a network actually called
    a "demilitarized zone" (DMZ). Systems administrators working at a random company
    would throw up a firewall on the perimeter of their network, install antivirus
    software on their workstations, and console themselves with the idea that their
    network isn''t interesting, and their data isn''t valuable enough to attract a
    hacker.


    Today every computer on the network is a target, and every network is hostile.
    While you still have hackers who spend a lot of time carefully probing a high-value
    target, the bulk of the hacking that goes on these days is fully automated. The
    goal of many hackers is to build the largest collection of machines possible so
    they can use them to launch further attacks. Those hackers don''t necessarily
    care which computers they compromise, they just scan the Internet attempting to
    guess SSH passwords or looking for computers with known vulnerabilities they can
    automatically exploit. Each time a new vulnerability is announced in a piece of
    software, it only takes a short time before hackers are scanning for it and exploiting
    it. Once a hacker has a foothold on your machine, whether it''s a web server or
    a workstation, they will automatically start probing and scanning the rest of
    the internal network for vulnerable machines.


    Cloud computing has further eroded the notion of an "internal" and an "external"
    network. In the past, it would be difficult for a hacker to buy a server and rack
    it next to you on your network, yet cloud computing makes this as easy as a few
    clicks. You have to throw out the assumption that your cloud servers are communicating
    with each other over a private network and every packet is going over a public,
    hostile network because in many cases it is.


    # The Good News


    Despite all of this, we defenders actually have the advantage! We get to define
    how our networks look, what defends us in place, and if this is a battle, we have
    control of the battlefield if we choose to take it. With all the talk about sophisticated
    hackers, the fact is many of the compromises you hear about in the news don''t
    require sophisticated skills—they could have been prevented by a simple, modern
    hardening steps. Time and again, companies spend a lot of money on security yet
    skip the simple steps that would actually make them secure. Why?


    One of the reasons administrators may not apply modern hardening procedures is
    that while hacker capabilities continue to progress, many of the official hardening
    guides out we read as those they were written for Red Hat in 2005 and were updated
    here and through the years. I came across one of these guides when I was referring
    to some official hardening benchmarks for a PCI audit (a Payments Cards Industry
    certification that is a requirement for organizations that handle credit cards)
    and realized if others were new to Linux server administration across the same
    guide, they likely would be overwhelmed with all the obscure steps. Worse, though,
    they would spend hours performing obscure sysctl tweaks and end up with a computer
    that was no more protected against a modern attack.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Preface xvii


    Instead, they could have spent a few minutes performing a simple hardening steps
    and ended up with a more secure computer at the end.


    For us defenders to realize our advantages, we have to make the most of our time
    and effort. This book aims to strip away all that outdated information and skip
    a lot of the mundane hardening steps that take a lot of time for little benefit.
    Where possible, I try to favor recommendations that provide the maximum impact
    for the minimum amount of effort and simplicity over complexity. If you want a
    secure environment, it’s important to not just blindly applying steps but to understand
    why those are there, what they protect against, what they do not protect against,
    and how they may apply (or not) to your own environment. Throughout the book,
    I explain what the threats are, with a particular hardening protects you, and
    what its limitations are.


    # How to Read This Book


    The goal of this book is to provide you with a list of practical, modern hardening
    steps that take current threats into account. The first few chapters of the book
    focus on general security topics including overall workload, server, and network
    hardening. The next few chapters focus on how to harden specific services such
    as web servers, email, DNS, and databases. Finally, I end the book with a chapter
    on incident response, just in case. I realize that not everyone has the same level
    of threat, not everyone has the same expertise. I’ve structured every chapter
    in this book on that and split each chapter into three main sections. As you progress
    through each section, the threats and the hardening steps get more advanced. The
    goal is for you to read through a particular chapter and follow the steps at least
    up to the point where it meets your expertise and your threat, and hopefully you’ll
    revisit that in the later chapter, when you are ready to take your hardening to
    the next level.


    # Section 1


    The first section of every chapter is aimed for every experience level. This section
    contains hardening steps that are designed for maximum benefit per time spent.
    The goal is for these steps to only take a few minutes. These are hardening steps
    that I consider to be the low bar that everyone should try to meet no matter their
    level of expertise. They should help protect you from your hacker out on the Internet.


    # Section 2


    The second section of each chapter is aimed at hardening steps for intermediate
    to advanced sysadmins to protect you from intermediate to advanced attackers.
    While many of the hardening steps get more sophisticated in this section and may
    take a bit more time to implement, I still tried to keep things as simple and
    fast as possible. Ideally, everyone would read at least part of the way into this
    section and apply some of the hardening steps, no matter their threat model.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# Section 3


    The third section of each chapter is where I have a bit of fun and go all out
    with advanced

    hardening steps aimed at advanced up to nation-state attackers. Some of these
    harden-

    ing steps are rather sophisticated and time-consuming, whereas are really just
