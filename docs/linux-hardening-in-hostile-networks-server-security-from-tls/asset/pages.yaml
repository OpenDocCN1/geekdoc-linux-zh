    MySQL users are a combination of username (bobby in our case), an @ sign, and
    then the hostname is coming from. In our case bobby is a local system user, so
    we specify the user as bobby@localhost. Finally, the section is where you define
    this user will use this password to access the database.


    The flush command tells MySQL to update this list of privileges even if you changed
