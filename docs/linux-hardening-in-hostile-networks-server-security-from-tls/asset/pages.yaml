    # Tell Your Parent


    Once you have confirmed that DNSSEC is registered for your zone, the final step
    is to go to your zone''s parent (typically through your registrar you used to
    buy the domain initially) and provide the registrar with the DS record (at that
    dset-zonefile file generated) they can sign. Unfortunately, not every registrar
    provides DNSSEC support, and some charge extra for the service. For the ones that
    do it, they provide some sort of mechanism to upload a DS record for your domain
    either via their web interface or possibly by contacting their customer support.
    Once they receive the DS record they can submit it to be signed and hosted by
    the TLD; once the TLD hosts the DS record for your domain, the chain of trust
    is complete and you can start DNSSEC-signed records that are the rest of the Internet
    trust.


    While this is easy to get DNSSEC up and running for a zone, there is still some
    care and feeling going with DNSSEC. In particular, from time you may want to rotate
    the ZKS for your zone. To do so, generate a new ZK with dnssec-keygen, add a $INCLUDE
    statement that points to the new ZK, and regenerate the zone to update the signatures
    as you would when making any change. You will want to wait long enough for the
    old ZK to expire for any hosts on the Internet that may have cached before you
    remove it from your zone.


    # Summary


    DNS is one of those fundamental services that is easy to take for granted from
    both an infrastructure standpoint and a security standpoint. You can divide the
    security issues we covered in this paper into two categories: protecting your
    DNS servers against unauthorized use, and protecting your DNS servers against
    MitM attacks.'
