    # Sharing Information Between appVMs


    When you have multiple windows open from different VMs, how do you copy and paste?
    An insecure approach might be to share the clipboard between all windows, but
    then you would risk that if you logged into a website in a trusted web browser
    by copying and pasting from your password manager, that password would be readable
    by any other appVMs that are running. Instead, Qubes provides a two-tier approach
    to clipboards with a secure global clipboard which clipboard data must be copied
    before it goes to a different appVM. Each appVM has its own clipboard, and you
    can copy and paste within that appVM. If you want to copy from one appVM and paste
    to another, you copy the data in one appVM clipboard, then hit Ctrl-Shift-C to
    put it in the global clipboard, then highlight the window you want to paste into
    and hit Ctrl-Shift-V to paste data into that VM’s clipboard and wipe it from the
    global clipboard. Then you can paste inside that application as normal. It definitely
    an extra cumbersome step, but you would be surprised by how quickly you adapt
    to Ctrl-C, Ctrl-Shift-C, change window, Ctrl-Shift-V, Ctrl-V. It definitely helps
    you prevent accidentally pasting information into the wrong window.'
