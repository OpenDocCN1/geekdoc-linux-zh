  md: '# Section 3: Qubes


    named sys-net, sys-firewall, and sys-whonix. The sys-net netVM gets any networking
    hardware on your host, so it''s unavailable to any VM. Because this netVM is the
    only one with an IP address on the external network, it is considered untrusted
    and colored red. Use Network Manager to configure this netVM with wireless networks,
    and your Network Manager app shows on your desktop as normal. The sys-firewall
    (technically classified as a proxyVM) is colored green and connects to sys-net
    for its network access. By default, any appVM you create use sys-firewall for
    their network access.


    Why all this complexity? First, sys-firewall acts as a true firewall for all of
    your appVMs. While by default all appVMs connect to the unrestricted internet,
    Qubes provides a GUI that makes it easy to lock down appVMs so that they can only
    access hosts on the network. For instance, you could restrict your banking appVM
    so that it only talks to port 443 on your banking website or restrict an email
    appVM to only talk to your remote mail server. You could restrict other VMs so
    that they only talk to hosts on your internal network. Anyone who wants to attack
    one of your appVMs has to go through sys-net and sysfirefox. This also means that
    if someone compromises an appVM, he doesn''t have direct access to network hardware
    so he can''t, for instance, automatically connect to a different wireless access
    point.


    The sys-whonix VM acts like sys-firewall except that it automatically sets up
    a secure Tor. Any appVMs that use sys-whonix instead of sys-firewall or sys-net
    for their network have all of their traffic routed over Tor automatically. Qubes
    also provides an anon-whonix appVM by default that uses the security and anonymity-distribution
    Whonix and includes the Tor router and routes all traffic through sys-whonix by
    default.


    Already you can see a number of areas where Qubes provides you with greater security
    than you would find in a regular Linux desktop. Hopefully you have a sense of
    what a different approach Qubes takes compared with what you might be used to.
    With Qubes you find yourself thinking about how you would isolate files and information
    and what an attacker could get if they successfully compromised one of your appVMs.
    Even the extra copy-paste- and file copy force you to confirm whether you are
    transferring information between an untrusted VM to a trusted one and think through
    the implications. I found the extra security measures actually let me relax a
    bit more than I would otherwise see, for instance, I know that an email attachment
    open in a disposable VM can''t do much harm or a malicious website in your untrusted
    browser can''t access any of value.


