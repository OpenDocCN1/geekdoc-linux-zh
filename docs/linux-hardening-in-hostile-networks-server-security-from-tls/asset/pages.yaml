  md: '# Section 2: Intermediate Server-Hardening Techniques


    you might have been surprised at how many ssh attempts your machine constantly
    gets. What''s happening here is called SSH brute force attack. A number of attackers
    have realized that often the easiest to compromise a Linux server is to guess
    a user'' password. If one user (or common role account, like oracle or for instance)
    happens to use a password that''s in an attacker''s dictionary, then it''s just
    a matter of time before a script guesses it.


    So do you protect against an SSH brute force attack? One way would be to audit
    users and enforce a strict password-complexity policy. Another might be to pick
    a different port for SSH, hoping that obscurity will save you. Yet another involves
    setting up systems that parse through SSH attempts and modify your firewall rules
    if many attempts come from a single IP. Despite the fact that you can risk yourself
    out with systems like this, attackers have already moved on and will often make
    only a few attempts in their vat bot. Each of these methods can help reduce the
    risk of a successful SSH brute force attack, but it can''t eliminate completely.


    If you want to eliminate SSH brute force attacks completely, the best way is one
    of the simplest: eliminate password logins. If you remove SSH logins from the
    equation, then attackers can guess all of the passwords they want, and even if
    they guess right, SSH won''t allow them to log in.


    So if you remove password logins, how do you log to SSH? The most common replacement
    for password-based login for SSH is to use SSH keypairs. With SSH keypairs, your
    client (a laptop or other server) has both a public and private key. The private
    key is treated like a secret and stays on your personal machine, and the public
    key is copied to the ~/.ssh/authorized_keys file on the remote servers you want
    to log into.


    # Create SSH Keys


    The first step is to create your SSH keypair. This is done via the ssh-keygen
    tool and while it accepts a large number of options and keys, we will use one
    that should work a large number of servers:


    ```

    $ ssh-keygen -t rsa -b 4096

    ```


    The -b option selects the bit for the key (4096 bit), and this 4096-bit RSA key
    should be acceptable currently. When you run the command, it will prompt you for
    an optional passphrase to unlock the key. If you don''t select a passphrase, then
    you can ssh into remote servers without having to type in a password. The downside
    is that if anyone gets access to your private key (by default in ~/.ssh/id_rsa),
    I recommend setting a passphrase, and in a later section I talk about how to use
    ssh-agent to cache your passphrase for a period of time (which like such passwords
    are cached for a few minutes you don''t have to type them with every command).


    Once the command completes, you will have two new files: the private key at ~/.ssh/id_rsa
    and the public key at ~/.ssh/id_rsa.pub. The public key is safe to share with
    other people and it is the file that will get copied to remote servers, but the
    private key should be protected like your passwords or any other secrets and not
    shared with anyone.'
