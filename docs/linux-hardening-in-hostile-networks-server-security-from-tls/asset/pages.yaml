  md: "# Enable HTTPS\n\nOne of the better guides for enabling TLS on a number of\
    \ different services including Apache and Nginx is Mozilla’s Server Side TLS page\
    \ at https://wiki.mozilla.org/Security/Server_Side_TLS. This page includes interactive\
    \ sections that will build a sampled web configuration for you based on a few\
    \ preconfigured profiles:\n\n+   * **Modern:** Uses only modern secure cipher\
    \ suites and settings, which means many older browsers may not be able to use\
    \ the site\n* **Old:** TLS configuration using older cipher suites for maximum\
    \ backward compatibility with browsers\n* **Intermediate:** A good blend of modern\
    \ cipher suites found in Modern with better browser compatibility with some other\
    \ still popular browsers\n\nWhile the basic TLS examples I use in this section\
    \ will work, in sections where I mention cipher suites I will choose them either\
    \ on the Intermediate or Modern profiles, depending on what seems appropriate.\
    \ Unfortunately, cipher suites are considered secure changes over time, so I highly\
    \ recommend you check out the wiki to get the most up-to-date information.\n\n\
    The simplest HTTPS configuration uses all of the cipher suites defaults from your\
    \ web server and therefore only needs to know the location of the certificate\
    \ and private key for your site. Keep in mind that while the certificate is to\
    \ be public, the private key should be kept secret and only readable and writable\
    \ by the root user (chmod 600). Also, these days you are likely to find that your\
    \ certificate was signed by an intermediate CA, so you may need to append all\
    \ the intermediate certificates to the end of the certificate file (your CA should\
    \ instruct you on whether this is the case when it gives you the certificate).\n\
    \nTo add HTTPS to an existing Virtual host, add the following:\n\n```\n<VirtualHost\
    \ *:443>\nSSLEngine on\nSSLCificateFile /path/to/certificate.crt\nSSLCificateKeyFile\
    \ /path/to/certificate.key\n\n# Any remaining virtual host configuration goes\
    \ here\n</VirtualHost>\n```\n\nAs you can see here, whereas with Apache virtual\
    \ host starts with a reference to port 80, in the case of HTTPS we use port 443\
    \ instead. Or, you could add the rest of your virtual host's configuration to\
    \ this section, in the valid paths to your certificate and key, and then restart\
    \ Apache to accept the new configuration.\nThe corresponding configuration for\
    \ Nginx would be\n\n```\nserver {\n    listen 443 ssl;\n\n    ssl_certificate\
    \ /path/to/certificate.crt;\n    ssl_certificate_key /path/to/certificate.key;\n\
    \n# Any remaining virtual host configuration goes here\n}\n```"
  merge: -1
