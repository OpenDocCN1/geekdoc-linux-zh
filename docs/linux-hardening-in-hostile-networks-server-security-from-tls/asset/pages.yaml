    # Delete Anonymous Accounts


    After you have your root squared away, the next step is to remove any anonymous
    accounts MySQL has set up by default. These accounts have an empty username and
    an empty password and could give an attacker easy way to get kind of foothold
    in your database. Use the following command to list all database users so you
    can identify any anonymous accounts:


    ```

    > SELECT Host, User FROM mysql.user;

    ```


    | Host | User |

    |------|------|

    | 127.0.0.1 | root |

    | :: | root |

    | localhost | root |


