    that are of or otherwise look like popular domains (such as example.com instead
    of example.com) so they can host a counterfeit site, and in some instances, they
    have even been able to get valid certificates with misspelled names.


    # Browser Plugins


    Web security can be challenging, but there are a number of browser plugins you
    can add that help it a bit easier. In this section, I go over a couple of popular
    browser plugins that can help harden your browser against some common attacks.


    # HTTPS Everywhere


    The HTTPS Everywhere plugin (https://eff.org/https-everywhere) makes sure that,
    as much as possible, your web browsing stays on HTTPS. Sometimes HTTPS protected
    websites have sections on a page that from HTTP sources, this plugin attempts
    to rewrite those requests so they all go over HTTPS.


    # Adblock Plus


    Many people think of ad blocker plugins like Adblock Plus (https://adblockplus.org)
    just as a way to avoid seeing advertisements on websites, but the fact is that
    these attackers will often target ad networks. And once they compromise the ad
    networks, they will use the fact that those networks display on a number of popular
    sites to spread their attack payload to visitors. Ad blockers like Adblock Plus
    provide you with an extra level of protection when they block ad networks while
    still allowing you to see all the content you wanted to see on a site.'
