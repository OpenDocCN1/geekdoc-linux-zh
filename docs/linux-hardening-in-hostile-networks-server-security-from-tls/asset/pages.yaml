    to connect to it. A personal relay will only use bandwidth you specifically allow,
    and other people won''t be able to use it to route traffic through the Tor network.

    - **Normal public relay**: A regular Tor relay will register on list of Tor servers
    and allow the general public connect to it. The more Tor relays there are, the
    more routes traffic can take through the Tor network to anonymize.

    - **Bridge relay**: A relay is like a normal public relay except it''s not listed
    in the main Tor directory. This can be useful if ISPs try to filter Tor traffic
    by blocking IPs from the public directory. Tor users who are being filtered from
    normal relays can then connect to a bridge relay instead.

    - **Public exit relay**: This node allows traffic to exit to the Internet at large.
    The more high-bandwidth Tor exit nodes, the better overall bandwidth the Tor network
    has when it goes out to the rest of the Internet, an exit node is one of the most
    useful types of Tor relays. Because exit nodes are websites and other services
    serve as the source of traffic from Tor, there are some extra concerns and risks
    involved operating them, which we will get into more detail in the "Public Exit
    Relay."


