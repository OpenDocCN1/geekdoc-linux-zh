    # HTTPS Client Authentication


    In the previous section, I discussed how to use HTTP basic authentication to require
    users to enter a username and password to enter a particular part of your site.
    If you are using HTTPS on your web server, you can also authenticate users with
    a client certificate. With client authentication using certificates, generally
    an administrator generates self-signed certificates for users using an internal
    CA. The web server can then be configured to restrict access to only those users
    who can present a valid certificate that been signed by the internal CA.


    For these examples, let''s assume you have already handed out self-signed certificates
    to users and you want to restrict access to a virtual host on your web server
    to only those users who have valid certificates. First, the web server would need
    a copy of the internal CA''s public certificate, which we are saying is stored
    in /path/to/ca_certificate.crt.


    For Apache, you would add the following inside your VirtualHost configuration:


    ```

    SSLVerifyClient require

    SSLVerifyDepth 1

    SSLCertificateFile "/path/to/ca_certificate.crt"

    ```


    For Nginx, you would add the following to your server{} configuration:


    ```

    ssl_verify_client on;

    ssl_verify_depth 1;

    ssl_client_certificate /path/to/ca_certificate.crt;

    ```


    If, instead of restricting access to the entire site, you only wanted to restrict
    access to a particular location on the web server (such the /secrets location
    in your HTTP basic authentication example earlier in the chapter), you would set
    the verify client option to none and then add restrictions for that location.


    For instance, for Apache, in the main VirtualHost configuration you would have
    the following:


    ```

    SSLVerifyClient none

    SSLCertificateFile "/path/to/ca_certificate.crt"

    ```


    ```

    <Location "/secrets">

    SSLVerifyClient require

    SSLVerifyDepth 1

    </Location>

    ```'
