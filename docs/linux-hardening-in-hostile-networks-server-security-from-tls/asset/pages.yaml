  md: '# Section 3: Advanced Hardening 155


    Note that I am pointing to a directory under /var/spool/postfix/. This change
    is for maximum compatibility in case your Postfix server runs within a chroot
    jail. After making this setting, save the file and then create the directory you
    referenced previously, making the opendmarc user and group owns:


    ```

    sudo mkdir /var/spool/postfix/opendmarc

    sudo ch opendmarc:opendmarc /var/spool/postfix/opendmarc

    ```


    Since OpenDMAR will create a socket file in this directory that is owned by the
    opendmarc user and group, next you will need to make sure the postfix user is
    a member of the opendmarc group. There are several tools that let you modify group
    membership, but one simple way is to edit /etc/group as root and make sure the
    opendmarc: line is changed to:130:


    ```

    opendmarc:x:130:

    ```


    to something like


    ```

    opendmarc:x:130:postfix

    ```


    Note that your group ID may not be 130. The key is to make sure the postfix user
    exists after the colon. Now restart the opendmarc service and make sure the /var/spool/postfix/opendmarc/opendmarc.sock
    exists:


    ```

    sudo service opendmarc restart

    sudo ls -l /var/spool/postfix/opendmarc/opendmarc.sock

    srwxxr-x 1 opendmarc opendmarc 0 Aug 14 13:15

    /var/spool/postfix/opendmarc/opendmarc.sock

    ```


    Now, add the following lines to your /etc/postfix/main.cf to configure it to use
    OpenDMARC by adding its socket file to the list of smtpd_milters. If you have
    Postfix to use openkim, you may already have listings here for openkim as well,
    in which case you separate the list of sockets with commas:


    ```

    # OpenDMARC

    milter_default_action = accept

    milter_protocol = 2

    smtpd_milters = local:/opendkim/opendkim.sock, local:/opendmarc/opendmarc.sock

    non_smtpd_milters = local:/opendkim/opendkim.sock, local:/opendmarc/opendmarc.sock

    ```


    Now restart postfix, and you are ready to validate DMARC:


    ```

    sudo service postfix restart

    ```


    To test OpenDMARC is working, send an email from a domain that has DMARC enabled
    (for instance, Gmail). You should see a line like the following for OpenDMARC
    is working:


    ```

    Sep 18 09:54:50 example opendmarc[8134]: 851C5FC09E: gmail.com pass

    ```'
