  md: '# Section 1: Essential Network Hardening


    Basic network hardening doesn''t require additional software or complicated settings
    but comes from controlling which computers are allowed to talk to other computers.
    You want authorized computers to be communicate freely while blocking malicious
    computers. While that sounds sound, in practice securing firewall rules and overall
    network policy can sometimes get complicated. Furthermore, the wrong approach
    you can make mistakes that leave you vulnerable even though you have firewalls
    in place. In this section, we cover some of the fundamental principles you should
    apply when creating firewall rules. Then we define MitM attacks and talk about
    some countermeasures to them. Finally, we discuss how to create basic firewall
    rules on any Linux server with iptables.


    # Network Security Fundamentals


    The most fundamental principle for network security is the principle of least
    privilege. In general, the principle of least privilege states that an individual
    or a computer should only have the access or privilege level needed to do the
    job and no more. Applied to network security, means restricting which servers
    can talk to other servers and on ports via firewall rules to routers to restrict
    traffic between networks and hosts themselves that you aren''t relying on an upstream
    router (which might accidentally get a bad configuration) for protection from
    the network. The goal is to protect your servers by preventing attackers or other
    unauthorized computers from accessing them in the first place.


    The best way to apply the principle of least privilege on the network is by taking
    a “deny by default” approach. That means when you set up firewall rules you block
    all traffic by default and go back in and add firewall rules to allow the access
    you need. This way you can be sure that only services that need to talk to each
    other do so, and you will highlight any servers that need to talk to each other
    about since they would be blocked until you explicitly allow them. You would be
    surprised how many legacy networks have services listening on a server that an
    administrator forgot about. When you deny by default, those forgotten services
    are protected from the rest of the network.


    Each server has one or more services that listen on certain ports, for instance,
    the SSH remote service listens on port 22. If the Internet is allowed to use your
    SSH server, then you don''t have to worry about firewalling it; however, administrators
    only allow a smaller set of networks to access SSH on certain servers. To follow
    the principle of least privilege, you might set up firewall rules to restrict
    access to the SSH port on all of your servers to IPs on your internal network.
    Even better would be to set up a bastion host. A bastion host is a host that has
    its SSH port exposed to the outside network while the rest of the network is firewalled.
    Administrators must log into the bastion host first before they can access the
    rest of the network, and with firewall rules you can further restrict the rest
    of the network to allow SSH access to the bastion host''s IP address.'
