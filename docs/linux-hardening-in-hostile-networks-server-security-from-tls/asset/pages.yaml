  md: '# Section 1: Essential Network Hardening


    Beyond SSH, let''s look at how the principle of least privilege might apply to
    a traditional three-tier web architecture where a request goes to a web server,
    which forwards it to an application server, which accesses a database. In that
    architecture, only the application server network would be allowed to talk to
    the databases, only the web servers could talk to the application servers, and
    the databases initiate connections to any other network. If your architecture
    included multiple types of database servers, then only the database servers for
    which access was needed by that set of application servers would be authorized.


    In some cases, you may have servers that host local services that are intended
    for other services on that same host. For instance, email servers often call out
    to services that perform various spam checks. If those services are located on
    the same server, you can set up a server to listen on localhost (127.0.0.1) so
    only the external network can''t talk to it at all. Even, if the services support
    it, you can configure those servers to listen on a Unix socket instead of a TCP
    socket. Using a Unix socket means that you can further restrict access based on
    local system users in addition to any other authentication you may have in place.


    # Egress Traffic


    Network-hardening guides often focus specifically on ingress (incoming) traffic
    when setting up firewall rules, but egress (outgoing) filtering is equally important.
    When it comes to egress traffic means, for instance, that those machines in your
    network that need to talk to the Internet at large should be able to do so, and
    the rest should be blocked from access entirely. Going one step further, those
    machines that need to talk to the Internet should ideally be restricted to those
    networks and ports they need to talk to.


    By blocking egress, you make it much harder for an attacker to download attack
    tools and connect to a command-and-control server which have compromised you.
    Egress filtering also helps control unauthorized use of your network from authorized
    users. Production networks often have great bandwidth, and it''s tempting for
    someone to access to network to use it to download large files (such as pasted
    videos) that might much longer at home. This of content presents a problem for
    the administrators of network from a legal liability standpoint, a security standpoint
    (many of those types of files contain malicious payloads), and a cost-standpoint
    (if your production network doesn''t need to access remote servers for its day-to-day
    operations, you can filter that egress traffic and protect yourself from multiple
    problems.


    Blocking egress traffic doesn''t mean restricting what you can talk to the external
    network. Like with ingress filtering, a "deny by default" approach to egress traffic,
    when possible, provides a great benefit to security by further reinforcing the
    ingress rules that you have in place. That said, it also adds doubling the amount
    of work required when adding a firewall rule since you on a router; so don''t
    have to consider both ingress and egress rules their network hardening to that
    level. Even if you don''t take a "deny by default" approach, you should still
    attempt to block egress traffic within your network where practical.'
