  md: '# Email Security Fundamentals


    In this section, we discuss some fundamentals behind email server security and
    elaborate on specific essential hardening steps you should perform on any email
    server you administer.


    Before we get into specific hardening steps, it''s important to understand some
    of the basic security issues that surround email Without a lot of security in
    place. Over the years, as people have found ways to exploit email''s openness,
    a number of difficult security measures have been added. In particular, the use
    of email as a mechanism for advertisers to send unsolicited bulk advertising to
    people (aka spam) from a minor nuisance to a major problem, accounting for a large
    proportion of overall email traffic on the Internet. Indeed, the bulk of the security
    practices around email and indeed many of the steps that we''ll perform throughout
    this chapter primarily have to be with limiting spam.


    While some people think of email as the digital version of sending a letter in
    an envelope, a postcard is a better analogy. The contents of your email message
    is unencrypted and in many cases goes the Internet from sender to receiver in
    completely unencrypted format (although, with encrypted web traffic over HTTPS,
    encrypted server-to-server communication is starting to become more widespread
    now). That means that every router and your email server goes through read the
    contents just like any mail carrier from your vacation spot and your friend''s
    home can read what you wrote on a postcard.


    For your email to be less like a postcard and more like a letter in an envelope,
    the email server for the sender and the email server for the recipient need to
    be configured to use SMTPS, which uses TLS to encrypt the communication and authenticate
    the email server receiving the message. This will protect you from someone snooping
    on networking equipment between the two email servers, each each server can still
    read the contents of the message. To protect the contents of the email so that
    the recipient can see it, you need to go a step further and use a system like
    PGP to encrypt the contents of the message.


    Another aspect of email security that many people may not realize is that the
    From: header on an email address is not verified in many email systems and is
    set by the sender of an email. The sender can make the From address appear to
    be from anyone they want. This means that unless the sender uses a system like
    PGP to sign their email, it can be difficult to prove that the From address is
    legitimate. In the past (and in many cases today), the best email administrator
    can do is to look through the headers in the email that show all of the email
    servers the email went through. For instance, if the email was from a google.com
    address, you should only see google.com servers and your destination email server
    in the email headers. These days, there are additional steps an administrator
    can do to help validate at least the domain in a From address. In Section 3, we
    will go over a number of additional protocols email servers can use to help validate
    sends such as SPF records, DKIM, and DMARC.'
  merge: -1
