  md: '# Introduction to Qubes


    While on the surface Qubes installs and looks much like any other Linux distribution,
    it takes a dramatically different approach to desktop security. Even people who
    have Linux desktops for many years find might need to adjust their approach when
    using Qubes. In this section, I introduce some of the concepts behind Qubes and
    elaborate on how it''s different from a regular Linux desktop.


    # How Qubes Works


    While you could certainly use any of the VM technologies to set up multiple VMs
    on your regular Linux desktop, that kind of arrangement can end up being pretty
    clunky, in particular you don''t want multiple desktop environments running inside
    their own window. There are all kinds of mistakes you could make with that kind
    of setup that eliminate any security benefits you might get. For instance, how
    should you share files or copy and paste between VMs securely, and how do you
    keep all of those VMs up to date with security patches? Where a traditional Linux
    distribution made it easy to get the software you want to use without having to
    download and compile it, Qubes provides a number of extra tools that make it easy
    to manage a desktop full of different VMs, all with different levels of trust.
    Qubes approaches all aspects of the desktop with security at the forefront and
    uses defaults throughout the OS. In so, Qubes makes it more difficult (but not
    impossible) for you to shoot yourself in the foot.


    Qubes Xen provides all of its virtualization. (If you want to know why they chose
    over other technologies, they go over in detail in their website FAQ) Instead
    of each having its own complete desktop environment, Qubes uses the privileged
    dom0 Xen (a kind of master VM that manages the other VMs on the system) as a home
    for the desktop environment (currently Qubes gives you the choice of KDE or XFCE,
    although the community has contributed others) and the other VMs display application
    windows within dom0''s desktop environment, so launching Firefox in Qubes behaves
    like you would expect however, is Qubes lets-code each of your VMs based on level
    of trust ranging from red (untrusted) to a number of rainbow colors between. When
    you launch an application from an application VM (appVM in Qubes parlance), the
    VM starts up if it wasn''t already started, and then the application appears.
    The application will have a custom border that is colored by the color assigned
    its appVM, so if you have two instances of Firefox on your desktop at the same
    time, you can tell your untrusted web browser from your banking web browser because
    the untrusted one might be colored red while your banking browser might be colored
    green.


    Since the dom0 has privileged access to data about the other VMs in Xen, Qubes
    goes to lengths to protect it by having only the desktop environment run from
    it and by removing all network access from dom0. You are encouraged to do as little
    as possible in dom0, and instead you should use appVMs for any applications you
    want to run. Qubes intentionally makes it more difficult to copy files to or from
    dom0'
