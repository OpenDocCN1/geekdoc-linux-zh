    # HTTPS Forward Secrecy


    With HTTPS, the content of any communication between the web server and browser
    is protected from snooping by encryption. However, encryption standards that were
    considered secure in the past often show themselves to be vulnerable to attacks
    in the future. With some TLS ciphers, if an attacker could decrypt one session,
    he would be able to extract keys he would be able to use to more easily decrypt
    future sessions between the client and the server. Then attacker could capture
    all of the encrypted communications between the client and store it for later,
    hoping for a breakthrough in cracking that particular encryption scheme. Once
    one session was decrypted, he would be able to decrypt secured sessions.


    The idea behind forward secrecy is to generate unique, non-deterministic secrets
    for each session. By doing so, if an attacker were able to break the encryption
    in one session, he would not be able to use that information to break future sessions
    more. As a web administrator, you don''t have to know exactly how forward secrecy
    works to implement it on your servers. All you have to do is selective about which
    TLS ciphers you use. This amounts adding a few lines to your web configuration
    to restrict which TLS ciphites you use.


    The potential downside to using modern ciphers with forward secrecy is that not
    all legacy browsers support these modern ciphers, so you may potentially prevent
    some users from accessing your site over HTTPS. With that mind, in the next few
    sections I present two configuration options based on the Mozilla Server TLS guide:
    Intermediate and Modern. The Intermediate configuration has a wider support for
    older browsers and is compatible with the following browsers: Firefox 1, Chrome
    1, IE 7, Opera 5, and Safari 1. The Modern configuration is more secure but requires
    newer browsers; it is compatible back to the following browsers: Firefox 27, Chrome
    30, IE 11 on Windows 7, Edge 17, Safari 9, Android 5.0, and Java 8.


    In all of the examples in the next four sections, the following configuration
    underneath the rest of your TLS configuration lines (where you configure the TLS
    certificate and key to use the virtual host).


    # Apache: Intermediate


    ```

    SSLProtocol all -SSLv3

    SSLHonorCipherOrder on

    SSLCipherSuite ECDHE-RSA-AES128-SHA256:ECDHE-CDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-CDSA-AES256-GCM-SHA384:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-CDSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-CDSA-AES256-SHA384

    ```'
