- img_proc: true
  md: '# Section 3: Advanced Hardening


    # Mx


    One of the simplest SPF rules that would work well for basic email setups uses
    the mx mechanism. This rule tells mail servers to perform a lookup of the MX records
    for this domain. If the client IP is in this list, it passes. The DNS TXT record
    for the domain would look like this:


    ```

    `v=spf1 -all`

    ```


    You can also add options to the mx rule such as a subnet prefix so it would match
    if the client IP shares the same subnet as a valid mail server:


    ```

    `v=spf1 mx/24 -all`

    ```


    This would match any client whose IP was in the /24 subnet along with a valid
    email server. You may also have the case where you own a number of different domains
    but use the same set of email servers for all of them. By default the mx rule
    uses MX servers from the current domain, but if you want to specify a different
    domain''s MX servers instead you can add that to the mx rule:


    ```

    `v=spf1 mx:example.com -all`

    ```


    While the mx rule works for simpler cases, a modern office email infrastructure
    is often a bit more complex. MX records define which mail servers you use to receive
    mail, but some environments use additional servers (such as mail relays in offices
    or data centers) to send out mail. In those cases, you may want to add some of
    the additional rules that follow:


    # A


    Like the mx rule, a rule tells you to look through all of the valid A records
    for the domain for a match. This could provide a convenient shortcut for administrators
    who have valid email servers are listed in DNS but not in MX records. The risk,
    of course, is that if an attacker can compromise any server that has a valid A
    record, he could use it to send spam or spoofed emails for your domain. The simplest
    form of the rule looks like this:


    ```

    `v=spf1 a -all`

    ```


    Like the MX rule, you can also specify a subnet mask to apply to the IPs:


    ```

    `v=spf1 a/24 -all`

    ```


    You can also specify a different domain for the lookups:


    ```

    `v=spf1 a:example.com -all`

    ```


    # IP4 and IP6


    More commonly, when you create SPF rules, you may just want to list a couple of
    different valid IP addresses or networks to use. The ip4 and ip6 rules allow you
    to specify IPs or subnets on your whitelist and are often useful in combination
    with some of'
