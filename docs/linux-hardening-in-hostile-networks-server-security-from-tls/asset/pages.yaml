  md: '# Man-in-the-Middle Attacks


    While firewall rules protect your network from unauthorized access, they can''t
    help in the case of a MitM attack. A MitM attack is much like it sounds: an attacker
    sits between two computers and intercepts the traffic as it passes. The attacker
    may capture the traffic and inspect it for sensitive data. Often, the attacker
    modifies the data before it to help hide the attack. While some MitM attacks target
    connections to specific servers, others may capture all traffic from a victim.
    MitM attacks are dangerous because, if done well, the victim won''t realize he
    has been attacked and expose sensitive data like passwords, private emails, or
    other records.


    So how does the attacker if the two computers are communicating across networks?
    It turns out there are several ways. One may compromise a router between them.
    More commonly, an attacker compromises the network of either the client or the
    server and uses an attack like Address Resolution Protocol (ARP) poisoning so
    that either traffic or traffic to certain networks gets to a host they control.
    In this case, the attacker pretends to be the client and pretends to be the server.
    As the attacker receives traffic destined for the server, it is rewritten so it
    appears to come from his host before gets forwarded to the server. Replies from
    the server then get rewritten and forwarded back to the original client.


    You don''t have to be on the local network or between the hosts to launch a MitM
    attack. Provided the attacker can talk to both the client and the server, if the
    attacker can compromise DNS, they can replace the DNS record for the remote server
    with their IP and then forward on all of the compromised traffic to the real server.
    In the case of a MitM attack on a public Internet service, the attacker''s machine
    could sit anywhere on the Internet.


    # Mitigating MitM Attacks


    One of the ways to mitigate a MitM attack is to use TLS for your network communications.
    Appendix B, "SSL/TLS," shows how TLS works in more detail, but for the purposes
    of MitM prevention TLS provides two particular features: encryption of the network
    traffic and authentication of the server (and optionally the client). Because
    the network traffic between the client and server is encrypted, when you use TLS
    an attacker can''t see any secrets or other data between the client and server.
    The authentication piece of TLS ensures that only someone who possesses the server''s
    private key can authenticate. The attacker has to connect through unmodified and
    cannot impersonate the server.


    The usual case for TLS is for a client to authenticate a server and start an encrypted
    session. The server presents the client with a certificate signed by someone the
    client trusts, and then the client can use TLS to prove that initial traffic signed
    by the server''s private key is legitimate. While it is less common, TLS also
    allows the server to authenticate the client. In that circumstance, the client
    will also have a trusted certificate it can supply to the server once he has a
    trusted channel of communication. You will often see this kind of client authentication
    in higher-security settings in addition to or in place of username/password authentication.'
  merge: -1
  pgno: 104
- img_proc: true
  md: 'Section 1: Essential Network Hardening


    # TLS Downgrade Attacks


    Unfortunately, just setting up a TLS option for secure network communication may
    not be enough to protect against MitM attacks. If TLS is not mandatory, an attacker
    can use what''s known as a downgrade attack to replace the TLS request with a
    downgraded request without TLS. For instance, in the case of HTTP and HTTPS, the
    client would attempt to connect to an HTTPS URL, but the attacker would redirect
    the client to the unprotected HTTP version of the site.


    # Server Firewall Settings


    One of the most fundamental ways to protect your servers from attacks on the network
    is via local firewall. Even though most server installs these days default to
    having no services listening on the network, it''s still a good idea to enforce
    firewall rules on each host. In keeping the principle of least privilege, we want
    to make sure that the only ports that are accessible to the outside world are
    ports you intend, and every other port is blocked. You should also have firewalls
    that enforce traffic on the edge of your network, local firewall rules should
    be used as a supplement to firewalls that further enforce the same rules so that
    you defend in depth. This helps protect you in case an attacker has compromised
    a different host on your network and tries to use that to spread his attack.


    Before you set up local firewall rules, it''s important to understand their limitations.
    Because these rules are changed via administrative commands on the host itself,
    if an attacker is able to compromise that host and himself, he can change or remove
    your local firewall rules. Also, while I will try to keep my firewall configuration
    examples as simple as possible, the syntax for creating these firewall rules can
    get complicated. Since the ordering of the rules matters, the more complicated
    your rule set, the greater the possibility that a mistake in ordering has caused
    you to not be protected as you have thought. To guard against these limitations,
    don''t rely strictly on local firewall rules for your protection, but be sure
    that you reinforce any local firewall rules on your gateway routers. Also, whenever
    you add a firewall rule, test it by attempting to connect to the port you have
    opened or blocked.'
