    # Introduction to Sleuth Kit and Autopsy


    The most simplistic way to start a forensics investigation would be to mount the
    images you have created as read-only on another machine and then simply look around
    the file system for an intrusion. As you get more sophisticated in your investigation,
    you''ll find certain types of information repeatedly, such as the modified, access,
    and change times on files (MAC times); you''ll need to keep checksums of any evidence
    you find so you can prove later that the files were tampered with; you''ll want
    to build an entire system timeline that shows what files were changed or accessed
    in order of access; and you''ll want to examine the file system for any files
    the attacker may have created to cover their tracks. This is where Sleuth Kit
    and Autopsy come in.


    Sleuth Kit is a series of command-line tools aimed at forensics that makes it
    easier to examine file system images. While Sleuth Kit provides a very powerful
    suite of tools, it also provides a steep learning curve to figure out all correct.
    Autopsy works as a web-based front end to all Sleuth Kit tools and makes it easy
    to examine a file system without learning each of the different command-line tools.
    Autopsy also makes it easy to organize multiple forensics into different cases
    so you can refer them later. This makes your Sleuth Kit commands more repeatable,
    protects you from some mistakes during an investigation, and keeps you organized.


    Both Sleuth Kit and Autopsy should be packaged for most common Linux distributions,
    or you can download the software directly from sleuthkit.org. Note, however, the
    Autopsy project has focused more on Windows with its latest revisions so we will
    discuss the last version of Autopsy that runs on Linux version: 2.


    Once Sleuth Kit and Autopsy are installed, type autopsy to a terminal to start
    the program. Autopsy needs root privileges so it can gain full access block devices
    on your system as well as read areas as /var/lib/autopsy for evidence. Instructions
    on Autopsy settings will appear in the terminal including the default location
    for evidence (/var/lib/autopsy) and the default port on it listens (9999). Open
    a web browser and type in http://localhost:9999/autopsy to view the default Autopsy
    page and start your investigation (9–1).


    From the main autopsy page, click Open Case to open a case you have already created,
    or otherwise if you are starting from scratch (as we will be in this chapter)
    click New Case. The goal with a case is to organize all the disk images, investigators,
    and evidence for a specific attack in a single place so you can go back to it.
    Each time you have a new compromised system or series of systems that are related
    to each other, you should start a new case.


    On the New Case page, you can name and describe your case and you can also provide
    a list of investigators who will work on the case. Once your case is'
