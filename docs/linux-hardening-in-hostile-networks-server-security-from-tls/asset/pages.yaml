  md: 'The final iptables configuration file contains both INPUT and OUTPUT rules
    together, so we combine our base INPUT example that allows port 22 with our default
    OUTPUT rules:


    ```

    *filter

    :INPUT ACCEPT [0:0]

    :FORWARD ACCEPT [0:0]

    :OUTPUT ACCEPT [0:0]

    ```


    ```

    -A INPUT -lo -j ACCEPT

    -A INPUT -p icmp -j ACCEPT

    -A INPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    -A INPUT -m tcp --dport 22 -j ACCEPT


    -A INPUT -j LOG --log-prefix "iptables-reject"

    -A INPUT -j REJECT --reject-with-icmp-host-prohibited


    -A OUTPUT -i lo -j ACCEPT

    -A OUTPUT -p icmp -j ACCEPT

    -A OUTPUT -m state --state ESTABLISHED,RELATED -j ACCEPT


    -A OUTPUT -p tcp -d 10.0.0.0/255.255.255.0 -j ACCEPT

    -A OUTPUT -p udp -d 10.0.0.0/255.255.255.0 -j ACCEPT


    -A OUTPUT -j LOG --log-prefix "iptables-reject"

    -A OUTPUT -j REJECT --reject-with-icmp-host-prohibited

    ```


    # COMMIT


    If your host needs to talk to services outside of your internal network, you can
    add add OUTPUT rules. The main challenge with egress rules is, that most hosts
    on the Internet use hostnames and may change any particular IP address at any
    time, for instance, if you have a host that needs to be able to talk to other
    hosts on the Internet over HTTPS (TCP port 443), you would add the following OUTPUT
    rule:


    ```

    -A OUTPUT -m tcp --dport 443 -j ACCEPT

    ```


    But if you can be assured that the external IP will stay the same, it''s better
    to specify it. For instance, the rules would allow your host to talk to Google''s
    well-known DNS servers:


    ```

    -A OUTPUT -m tcp -d 8.8.8.8/255.255.255.255 --dport 53 -j ACCEPT

    -A OUTPUT -m udp -d 8.8.8.8/255.255.255.255 --dport 53 -j ACCEPT

    -A OUTPUT -m tcp -d 8.8.4.4/255.255.255.255 --dport 53 -j ACCEPT

    -A OUTPUT -m udp -d 8.8.4.4/255.255.255.255 --dport 53 -j ACCEPT

    ```


    Again, many administrators manage egress filtering on the local host and handle
    this kind of restriction via a gateway router, but it doesn''t hurt to reinforce
    your gateway''s rules on local hosts if you. Egress filtering is another example
    of how you can apply defense in depth to network hardening.'
