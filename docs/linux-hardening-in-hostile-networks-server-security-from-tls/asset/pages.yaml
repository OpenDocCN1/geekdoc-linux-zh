  md: "Likewise, if we start with the generic Nginx configuration\n\n```\nserver {\n\
    \    listen 80;\n    server_name www.example.com;\n    root /var/www/html;\n}\n\
    ```\n\nwe would add a return line to the bottom, like so:\n\n```\nserver {\n \
    \   listen 80;\n    server_name www.example.com;\n    root /var/www/html;\n  \
    \  return 301 https://$request_uri;\n}\n```\n\nIn the case of Nginx, notice how\
    \ we didn't hard-code the hostname (although we could have). Instead, we can use\
    \ Nginx's built-in variables to use whatever URL the user used to get to the site\
    \ in the first place.\n\n# HTTPS Reverse Proxy\n\nWith a reverse proxy, your web\
    \ server acts as a kind of MitM that accepts the initial HTTP request from a client\
    \ and forwards it to some other service. The server sends its replies back to\
    \ the web server, which forwards it to the client. This is a common configuration\
    \ for certain types of application servers to enable the web server to handle\
    \ static content like images efficiently while forwarding dynamic content to the\
    \ application server, or otherwise enable the web server to act as a kind of balancer\
    \ for back-end servers.\n\nOften, HTTPS for reverse proxies is an afterthought,\
    \ like sometimes it is for web servers themselves. However, if you want to secure\
    \ the connection between your reverse proxy and your back-end service is configured\
    \ to expect HTTPS, you will need to tweak your regular reverse proxy configuration\
    \ to take this into account. As this is a security-hardening book and not a web\
    \ server configuration, I'm assuming you have already configured your reverse\
    \ proxy to proxy requests to a back-end service using HTTP and just want to change\
    \ it to HTTPS instead.\n\nFor Apache, the main settings you will change are the\
    \ ProxyPass and ProxyReverse settings to use HTTPS in the URL of http:\n\n```\n\
    ProxyPass / https://internalserver/\nProxyReverse / https://internalserver/\n\
    ```\n\nIn addition, you may find need to add a header to inform the proxy what\
    \ protocol is being forwarded:\n\n```\nHeader set X-Forwarded-Proto \"https\"\n\
    ```"
