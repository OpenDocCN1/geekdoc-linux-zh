- img_proc: true
  md: "# Section 3: DNSSEC 173\n\nFirst, let's create a KSK for greenfly.org using\
    \ dnnssec-keygen:\n\n```\n$ cd /etc/bind/\n$ dnnssec-keygen -a RSASHA512 -b 2048\
    \ -n ZONE -f KSK greenfly.org\n```\n\nBy default, the dnnssec-keygen command dumps\
    \ the generated keys in the current directory, so change to the directory in which\
    \ you store your BIND configuration. The -a and -b arguments specify the algorithm\
    \ (RSASHA512) and key size (2,048 bit), with the -n option tells dnnssec-keygen\
    \ what kind of key it is (a ZONE KEY). You can also use dnnssec-keygen to generate\
    \ keys for DDNS and other BIND features, so you need to be sure this is for a\
    \ zone. I also added a -f KSK option that tells dnnssec to set a bind file that\
    \ denotes this as a KSK instead of a ZSK. Finally, I specified the name of this\
    \ zone it is for: greenfly.org. This command should create two files: a .key file\
    \ which is the public key published in the zone, and a .private file which is\
    \ the private key and should be treated like a secret. These files start with\
    \ a K, the name of the zone, and a series of numbers (the latter of which is randomly),\
    \ in my case, I created two files: Greenfly.org.+010+10849.key and Greenfly.org.+010+10849.private.\n\
    \nNext I to create the ZSK. The command is very similar to the command to create\
    \ the KSK, except I the bit size to 1,024 bits, and I remove the -f KSK argument:\n\
    $ dnnssec-keygen -a RSASHA512 -b 1024 -n ZONE greenfly.org\n\nThis command creates\
    \ another key file: Greenfly.org.+010+58317.key and Greenfly.org.+010+58317.private.\
    \ Now I'm ready to update and sign my zone.\n\n# Update the Zone File\n\nNow that\
    \ each key is created, I need to update my zone file for greenfly.org (the file\
    \ that contains SOA, NS, A, and other records) to include the KSK and ZSK. In\
    \ BIND, you can achieve this by adding $INCLUDE lines to the end of your zone.\
    \ In my case, I added these two lines:\n\n```\n$INCLUDE Greenfly.org.+010+10849.key\
    \ ; KSK\n$INCLUDE Greenfly.org.+010+58317.key ; ZSK\n```\n\n# Sign the Zone\n\n\
    Once the keys are in the zone file, you are ready to sign the zone itself. You\
    \ use the dnnssec-signzone command to do this:\n$ dnnssec-signzone -o greenfly.org\
    \ -k Greenfly.org.+010+10849 \ndb.greenfly.org Greenfly.org.+010+58317.key\n\n\
    In this example, the -o option specifies the zone origin, essentially the actual\
    \ name of the zone to update (in my case, greenfly.org). The -k option is used\
    \ to point to the name of the KSK to sign the zone. The last two arguments are\
    \ the zone file itself (db.greenfly.org) and the name of the ZSK to use.\n\nThe\
    \ command will create a .signed zone file (in my case, db.greenfly.org.signed)\
    \ that contains all your zone information along with many new DNSSEC-related records"
