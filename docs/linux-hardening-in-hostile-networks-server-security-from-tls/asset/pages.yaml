  md: '# Email


    Email was one of the first services on the Internet, and it still relied on by
    many people not just for communication but also security. These days, a person''s
    email account is often tied directly to their login credentials. So, if an attacker
    can compromise some-one''s email account, she can use it as a central hub to trigger
    password resets and take over other person''s accounts, or can send believable
    emails to the person''s contact list with malicious attachments. Beyond email
    abuse, one of the primary security concerns for an email server administrator
    is preventing spam. Email servers are often the target of spammers who use insecure
    or misconfigured email servers on the Internet to obscure the source of their
    spam. For all of these reasons and more, if you run an email server on the Internet,
    it''s important to perform some basic hardening steps.


    "Section 1: Essential Email Hardening" introduces how to avoid becoming an open
    relay. "Section 2: Authentication and Encryption" covers how to require authentication
    for SMTP relays and how to enable Simple Mail Transfer Protocol Security (SMTPS).
    "Section 3: Advanced Hardening" covers more advanced security features that aid
    in both spam prevention and overall security such as SPF records, DKIM, and DMARC.


    Multiple options for email server software exist on Linux such as Postfix, Exim,
    and Sendmail. While the hardening principles in this chapter can apply to whichever
    email server you choose, I''ve selected Postfix as the email server for any specific
    configuration examples for a few reasons. First, Postfix was written by a security
    expert specifically with security in mind. Second, Postfix comes out of the box
    with secure prehardened defaults. Third, Postfix configuration is pretty simple
    and straightforward so we need to change things, it makes the examples in the
    chapter simple and easy to follow.


    # Section 1: Essential Email Hardening


    Because we have selected Postfix as our example email server, a large number of
    basic email-hardening practices are already done for you. That doesn''t mean that
    your work is done, however. Without understanding those basic hardening steps
    are, it can be easy for an administrator to make a configuration change that undermines
    that security. Also, if you have inherited an email server that was set up by
    a previous administrator, you will want to audit the existing configuration to
    make sure it follows secure practices.'
