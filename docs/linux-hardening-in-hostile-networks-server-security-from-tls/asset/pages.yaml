    # Server Security


    If someone is going to compromise your server, the most likely attack will either
    be through a vulnerability in a web application or other service the server hosts
    or through SSH. In other chapters, we cover hardening steps for common applications
    your server may host, so this chapter focuses more on general techniques to secure
    just any server you have, whether it''s hosting a website, email, DNS, or completely
    different.


    This chapter includes a number of different techniques to harden SSH and also
    covers how to limit the damage an attacker or even a malicious employee can do
    if she does get access to the server with tools like AppArmor and sudo. We also
    cover disk encryption to protect data at rest and how to set up a remote syslog
    server to make it more difficult for an attacker to cover her tracks.


    # Section 1: Server Security Fundamentals


    Before we get into specific hardening techniques, we''ll start with some fundamental
    server security practices. When attempting to secure your server, it''s important
    to approach it with the appropriate mindset. With that in mind, there are a few
    principles you should apply no matter what your server does.


    # Fundamental Server Security Practices


    Fundamental server security practices include the principle of least privilege,
    keeping it simple, and keeping your servers up to date.


    # The Principle of Least Privilege


    We apply the principle of least privilege throughout the book (such as in Chapter
    4, "Network," when we discuss firewall rules), but in general on a host you want
    applications to have only the privileges they need to do their job and nothing
    more. For instance, while all developers may have accounts on servers, you may
    restrict access to systems administrators. You might also go further and only
    allow your developer to have access to the development environment and restrict
    server access only to systems administrators or other support staff that must
    have it.


    When applied to applications, the principle of least privilege means that your
    application should only run as root if it is absolutely necessary; otherwise,
    it should run as some other account on the system. One common reason applications
    need root privileges'
  merge: -1
  pgno: 79
- img_proc: true
  md: '# Chapter 3 Server Security


    to open a low port (all ports below 1025 require root privileges to open). Web
    servers provide a good example of this principle that they must be root to open
    network ports 80 and 443; however, once those ports are open, the average worker
    process for the web server runs as a less-privileged user (such as the www-data
    user). It is common practice for web applications themselves to pick some other
    high port like 3000 or 8080 to listen on that they can run as a normal user.


    # Keep It Simple


    A simple server is easier to secure than a complicated one. Avoid installing and
    running extra services (especially network-facing services) that you don''t. That
    way, you have fewer applications that can have security holes and fewer applications
    to keep track of security patches. It will be easier for your team and for external
    auditors to validate your configuration if you try to keep files and executables
    in their standard places and try to stick to default configurations when possible.


    Simplicity is important when designing the overall architecture of your environment.
    The more complicated your architecture and the more moving parts, the more difficult
    to understand and the more difficult to secure. If your network diagram looks
    like a bad plate of spaghetti, you might want to consider simplifying how servers
    communicate in the environment. Once we get to the network security chapter (Chapter
    4) this will make that simpler as well.


    # Keep Your Servers Up to Date


    New vulnerabilities are found in applications or libraries all the time. One way
    to stay on top of security for your servers is to subscribe to the security mailing
    list and make sure, as security vulnerabilities are announced, that you prioritize
    patching. The more homogenous your environment, the easier it will be to keep
    up with different versions of software, so you will have an easier time if you
    can stick to a single Linux distribution and a particular version of that distribution.
    Distribution security mailing lists won''t cover any third-party software you
    run, however, you will need to sign up for any security advisory lists those products
    provide.


    # SSH Configuration


    One of the most common services on just every server is SSH. While in the past
    administrators used tools like telnet to send everything (including passwords!)
    over plain text, SSH encrypts the communications between you and your server.
    While that and itself is a security improvement, unfortunately it''s not enough.
    In this section, we go over some basic SSH-hardening techniques you should be
    employing on all of your servers.


    # Disable Root Login


    One of the simplest things you can do to make your SSH configuration more secure
    is to disable root logins. While later in this chapter we will talk about how
