    # Section 1: Web Server Security Fundamentals


    Even though the Internet comprises a number of different services including email,
    DNS, and chat protocols, when your average user thinks about the Internet, they
    probably think about web services. It is understandable when you consider that,
    in addition to websites, even email and chat services are most commonly accessed
    via a web browser today.


    # Permissions


    The first thing to consider when hardening a web server is permissions. Since
    only root users can open ports below 1024, web servers typically need some level
    of root privilege when they start so they can open port 80 and 443. In the past,
    this meant that web servers ran as the root entry and any compromise of web service
    meant the attacker have root privileges. As a result, many server-hardening guides
    devote a fair amount to sandboxing or otherwise working around the root privilege
    issue.


    Fortunately, these most Linux distributions do a good job of providing initial
    hardening for web servers they package. Most web servers start up to open low
    ports, but drop root privileges to an unprivileged system like nobody or www-data
    to serve files or run CGI scripts. This means that if an attacker compromises
    your web application, he won’t automatically have root privileges. Of course,
    the attacker will still have permissions the unprivileged user has, which is often
    good enough for his needs. For instance, with web server privileges, he might
    be able to change files the web server is hosting and he can access any downstream
    services the web user can. Local access can also be used to get root through a
    local privilege escalation on a vulnerable system.'
