  md: 'There are a number of different hardening programs you can provide to DNS service.
    For the examples in this chapter, we use BIND-style configuration files strictly
    because it is still the most popular DNS program in use. That said, there are
    certain other choices that have a better track record in terms of security or
    have additional features. If you happen to use one of those, all of the concepts
    in this chapter should still apply, but you just have to adapt the configuration
