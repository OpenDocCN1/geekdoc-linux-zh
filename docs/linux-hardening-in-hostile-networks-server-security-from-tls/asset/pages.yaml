  md: '# Section 3: Advanced Hardening


    Finally, I can tell Postfix to use TLS for both incoming email and outgoing SMTP

    connections:


    ```

    smtpd_use_tls = yes

    smtp_use_tls = yes

    ```


    Once I reload Postfix, my server will be ready to opportunistically use TLS when
    the remote mail server supports it (many of the many providers do).


    # Section 3: Advanced Hardening


    Up to this point, the hardening-steps have been mostly focused on preventing spam,
    this section is no exception. On top of spam prevention, the hardening steps in
    this section go a step further to help other email servers whether they trust
    email claiming to come from your domain. This not only helps protect against spam
    but helps protect your email server from being impersonated by others on the Internet,
    or in some cases, tampering with the contents of email. As I mentioned earlier
    in the chapter, an email client can make in the Header from an email say anything
    they want; however, if you implement the steps in this section, many other email
    servers on the Internet (including most of the major ones) will reject a client
    that tries to send an email appearing from your domain if it does not come from
    your servers.


    In this section, we cover three specific email server—hardening techniques, each
    with their acronyms: Sender Policy Framework (SPF), DomainKeys Identified (DKIM),
    and Domain-based Message Authentication, Reporting and Conformance relies on DNS
    to provide a list of legitimate mail servers, and DKIM uses certificates to both
    authenticate an email server and protect the contents of an email being changed
    as it moves over the Internet. DMARC uses both SPF and DKIM to further improve
    security by informing mail servers how they should behave in case SPF or DKIM
    checks fail.


    # SPF


    SPF is one of the simplest methods to prevent other mail servers from sending
    spoofed to appear to be from your domain. SPF works by adding a DNS TXT record
    to your domain (sometimes referred to as the @ record) that contains a list of
    legitimate email servers for your domain. For instance, if you were using BIND
    to manage DNS for example.com, the record might look like


    ```

    example.com IN TXT "vspf mx -all"

    ```


    When a client connects to an email server with an email claiming to be from your
    domain, the email server performs a DNS lookup for TXT record and compares the
    IP address of the client with IPs in the SPF whitelist pattern. If the IP matches,
    the email is allowed. If the IP doesn''t match, the SPF record instructs the email
    server how to handle failure (usually by warning but allowing the email, or by
    denying the email), and the email server can decide to follow that instruction
    or may be configured'
  merge: -1
  pgno: 167
- img_proc: true
  md: 'stricter or more relaxed rules. Email servers may use SPF failures (even soft
    failures) as one means to judge whether an email is likely to be spam. Even if
    it accepts an email from a client that failed an SPF check, it may flag it as
    spam internally.


    SPF rules are listed in order according to which checks to perform first and are
    preceded by a + if a match means the IP should pass, a - if a match means the
    IP should fail, a ~ if a match should soft fail (i.e., warn but not block the
    email) or a ? if the match should be treated as neutral and not a pass or a fail.
    If a rule doesn''t have one of those symbols it is assumed. If a check passes,
    the email is accepted. If the check fails, the email server performs the next
    check in the list until it hits the very last check, which is usually an "all"
    directive that sets the default policy in the case of no matches. In this, instead
    of going over every type of SPF syntax, I highlight some of the particularly challenging
    use for SPF, you can go through one of the many lists of every SPF type and find
    syntax that fits your needs.


    # All


    The first and most generic SPF rule I is all. This acts as a kind of wild card
    and matches any client IP. Generally, you will use this to define how you want
    to handle email clients that don''t match any of your other rules. For instance,
    if you wanted to accept all email clients and perform any kind of SPF restrictions
    at all, you could set your DNS TEXT record to:


    ```

    v=spf1 +all

    ```


    The v=spf1 tells the server what version of the SPF rule syntax to use, and the
    +all matches all client IPs and tells the server to set them to. If you wanted
    to do the opposite and block all emails from your domain (perhaps because that
    particular domain should never send email), you could set the SPF record instead:


    ```

    v=spf1 -all

    ```


    Administrators will probably fall between these two extremes and want to add some
    kind of matching rules in their SPF records. Many administrators use SPF as one
    of means to limit spam and dont to explicitly block email from unknown clients
    but may want mail servers to treat such emails as more likely to be spam. You
    may want to test out a bit before you start instructing other mail servers to
    block email, especially if your email infrastructure is complicated and there''s
    a chance there legitimate mail servers for your domain you may be unaware of (like
    at remote offices). In either case, you may want to have ~all at the end of the
    SPF rule to set the default action to a soft failure. That way you will get warnings,
    not errors, if a legitimate mail server tries to send email. If you decide you
    want to be more strict later, you can then change it to -all. For all of the following
    examples I decided to use ~all as the default policy so you don''t accidentally
    block legitimate email while you set up your rules.'
