    # Pull the Plug


    Another question you should answer before an attack occurs is what you do the
    moment you have confirmed that a host has been attacked. There are different schools
    of thought on this. One school of thought advocates leaving the server online
    and preinstalled tools (like the Coroner''s Toolkit) to capture the state of RAM
    and other ephemeral data. The other school of thought advocates removing power
    from the server.


    My stance is that the moment you detect an attack, you should not collect more
    data, nor should you shut down the system; instead, you should immediately pull
    the power from the server to freeze the current state of the disk. If the disk
    is a VM that supports snapshots, take a system snapshot to capture the RAM state,
    then forcefully pull off the VM. The reason I advocate this approach is that there
    can be valuable data in RAM on every command you run and every file you touch
    on the system forensic clues you could use later. Plus, if the attacker has a
    root kit, you can''t trust any output from the running machine—you could have
    Trojan versions of ps, bash, and lsmod, for instance, that mask the attacker''s
    existence.


    When you power off the machine, if you are physically with the server, literally
    unplug the power cords. Otherwise, if you control the power outlets remotely,
    turn off their power. If, on the other hand, you use lights-management to control
    server power, select the option that simulates pressing and holding the power
    button, but not pressing it. When you simply press the power button on a server,
    it sends a signal to the OS to perform a clean shutdown, which you want to avoid.
    While a clean shutdown may protect the file system from corruption, it also executes
    a number of commands and writes a lot of new data to disk as various services
    shut down and add to system logs. As you''ll see in later sections about forensics,
    the last time a program executed can provide a valuable timeline that illustrate
    when an attacker was on the system. And the more data is written to a drive, the
    greater the risk you may overwrite a block that contained the attacker deleted.
    In the case of a VM, you want to figure out how to forcefully remove the power
    from the VM because some VM software attempts a clean shutdown when you press
    the virtual power button.'
  merge: -1
