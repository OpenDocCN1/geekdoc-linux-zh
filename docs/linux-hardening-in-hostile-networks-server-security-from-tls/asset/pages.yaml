    # Sudo


    In the old days when an administrator needed to do something as root, he either
    logged in directly or used a tool like sudo to become root. This approach had
    some problems, however. For one, it encouraged users to stay logged in. Because
    root can do much anything you want to do on the system, mistakes made as root
    could have much worse consequences than those of a regular user. Also, from an
    administrative standpoint, if you have multiple administrators who all have root
    access to a server, you would have to create a shared password that everyone knows.
    When an administrator inevitably left the company, the remaining team had to scramble
    the passwords for all of the shared accounts.


    Sudo helps many of these security concerns and provides a much stronger security
    model that helps you stick to the principle of least privilege. With sudo, an
    administrator can define groups of users who can perform tasks as other users
    including root. Sudo has a few specific advantages over:


    +   - Each user types his own password, not the password of the privileged account.
    This means you no longer have to manage shared passwords for privileged accounts.
    If a user leaves the company, you only have to disable his account. This also
    means'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# Chapter 3 Server Security


    that administrators don''t need to maintain passwords at all for role accounts
    (including root) on the system, so users or attackers can''t get privileges they
    shouldn''t have by guessing a password.


    +   - Sudo allows fine-grained access control.

    With su, accessing a user''s privileges is an all-or-nothing affair. If I can
    go to root, I can do anything I want as the root user. While you can certainly
    create sudo rules that allow the same level of access, you can also restrict users
    so that they can only run specific commands as root or as another user.


    +   - Sudo makes it easier to stay out of privileged accounts.

    While you can certainly use sudo to get a complete root shell, the simplest invocations
    of sudo are just sudo followed by the command you want to run. This makes it easy
    to run privileged commands when you need to, and the rest of the time operate
    as your regular user.


    +   - Sudo provides an audit trail.

    When one on the system uses sudo, it looks at what user used sudo, what command
    was run, and when it was run. It also logs when a user tries to access sudo privileges
    they don''t. This provides a nice audit trail an administrator can use to track
    down unauthorized access attempts on the system.


    # Sudo Examples and Best Practices


    Sudo, like most access controls, provides an extensive set of configuration options
    and to manage groups, roles. That configuration is usually found in /etc/sudoers
    modern systems often include an /etc/sudoers.d/ directory where one can better
    organize sets of sudo rules into his own files. The sudoers man page ("man sudo")
    goes into exhaustive detail on how to build your complex sudo rules, and there
    are also plenty of guides available. Instead of repeating that documentation here,
    I describe some best practices when it comes to sudo rules and provide a few examples
    of useful rules along the way. To get started, though, let''s break down a generic
    sudo command:


    ```

    root ALL=(ALL) ALL

    ```


    This command allows the root user to run any command as any user on any system.
