    internal network can be hostile, this means TLS-protected communication not just
    from the external client to the edge, but also from internal services, including
    connections that go through the load balancer.


    While there are plenty of load balancer hardware appliances available for purchase,
    the open-source High-Availability Proxy (HAProxy) software load balancer has been
    around for many years and has proved itself to be a high-performing, reliable
    load balancer. In fact, many of the hardware load-balancing appliances you can
    buy are using HAProxy under the hood and just a web-based GUI for configuration.
    In this section, I describe how to use HAProxy in front of back-end services so
    that it can terminate your TLS connections. I also provide a guide on how to configure
    an unencrypted back-end (useful for services that do not support TLS at) as well
    as using HAProxy as a TLS bridge between an external client and an internal service.


    While most frequently thought of as an HTTP load balancer, it can be a load balancer
    for just any TCP service and has built-in checks for MySQL and Postgres databases.
    Its most popular use is as an HTTP load balancer, though, in the following examples
    I configure it in HTTP mode and assume you are placing it in front of some kind
    of HTTP service.


    HAProxy added TLS support in version 1.5, and most major Linux distributions these
    provide version 1.5 or greater in their proxy, so you should be able to stick
    to your distribution''s provided package to get started. HAProxy configuration
    lives in /etc/happroxy/happroxy.cfg, and many distributions provide a default
    configuration file that lists some of the more common options. HAProxy has a large
    number of configuration options you can use to tune its performance to suit your
    applications perfectly. Since every application is different, I am going to stick
    to HAProxy defaults for most settings and just highlight the TLS-specific settings.


    # Global HAProxy Settings


    The first section of the HAProxy configuration file that we need to change is
    the global section, which is denoted by the global section at the top. These are
    default settings that get applied throughout the rest of the configuration file.
    In our case, we will use it to define TLS ciphers and other settings to use.


    Most sysadmins are not cryptographers—and even if they are, it can be difficult
    to keep up with the state of the art for appropriate TLS ciphers and settings,
    especially when you need to keep track of things like browser compatibility. One
    of the better guides enabling TLS on a number of different services including
    Apache, Nginx, and HAProxy is Mozilla''s Server Side TLS wiki page at https://wiki.mozilla.org/Security/Server_Side_TLS.
    This page includes interactive sections that will build a sample configuration
    for you based on a preconfigured profiles: Modern (when only modern secure cipher
    suites and settings, which means many older browsers may not be able to use the
    site), Old (valid TLS configuration using older cipher suites for maximum backward
    compatibility with browsers), and Intermediate (a good of modern cipher suites
    found in Modern but with better browser compatibility with some older but'
