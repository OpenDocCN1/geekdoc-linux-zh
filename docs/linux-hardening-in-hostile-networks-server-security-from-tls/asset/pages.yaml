    so that isn''t the case, Bluetooth signal strength can fluctuate, and you may
    find that your screen locks when you are at your computer in the middle of working.
    What''s more, anyone who can borrow or steal your phone now has access to your
    computer. In general, I recommend sticking to the traditional keyboard combination
    to lock your screen. And if you are worried you will forget, back it up with a
    short idle time before your screensaver kicks on.


    # Suspend and Hibernation


    If you use a laptop, chances are you rarely actually power it down. By default,
    most distributions are set to suspend your laptop if you close the lid, so when
    it''s time to transport the laptop many just shut the lid and suspend to RAM.
    If you choose to suspend your laptop, confirm that your laptop has a screen lock
    in place when it wakes up. If your screen doesn''t lock when it wakes up, check
    your suspend options in your power management settings where you configure what
    your laptop suspends or hibernates when you shut the lid.


    Of course, suspending RAM isn''t without its risks. A number of years ago, research
    into cold RAM demonstrated that if an attacker had physical access to a suspended
    laptop, even if the screen lock was in place, he could reboot the system off a
    USB drive and still be able to pull the contents of RAM including any encryption
    keys that may reside there. If you use disk encryption (which we cover later in
    the chapter), it could be defeated if an attacker got access to a suspended computer.


    Because of the cold boot scenario, you may want to consider hibernation instead
    of suspend. With hibernation, the RAM state is copied to the disk (which you hopefully
    have encrypted) and the system powers down. With the power off, an attacker can
    no longer retrieve the contents of RAM with a cold boot attack. Even if you decide
    to suspend your laptop for convenience, you may want to consider hibernation or
    powering down your laptop when you travel with it or when it''s otherwise somewhere
    with a higher risk of theft or malicious access (like leaving it in a hotel room).


    # Web Security Fundamentals


    Along with your email client, your web browser is one of the most common ways
    your workstation will be attacked (and for many people their web browser is their
    email client). Whether it''s an attacker tricking you into entering your credentials
    into a realistic-looking copy of a website you use, some exploiting your computer
    via a malicious browser plugin, or someone capturing personal data from your browsing
    history, web browser hardening is a major component of anyone''s hardening process.
    The main two ways you can harden your web browser—beyond keeping it up to date—is
    via the proper use of HTTPS and the use of security-focused browser plugins.


    # HTTPS Concepts


    When you use an average website, you typically connect via one of two protocols:
    HTTP and HTTPS. This is the http:// or https:// part of a URL and determines whether
