    # Section 2: Additional Workstation Hardening


    In Section 1, we covered a number of basic workstation-hardening steps that everyone
    should consider. While locking your session is important, there are still a number
    of ways an attacker can get around it such as rebooting your machine into a rescue
    disk and accessing your hard drive. In this, we discuss a few additional countermeasures
    you can use to protect your workstation from a more determined attacker.


    # Workstation Disk Encryption


    One of the most important steps you can take when hardening a workstation is to
    encrypt your disk. Not only does encryption protect you from an attacker who reboots
    your machine with a rescue disk, it also protects your data once you get rid of
    the workstation. Often hard drives find you on the secondary market, and if your
    data is encrypted, you won''t have to worry about your data was properly erased—without
    your encryption key, the data can''t be recovered.


    Most Linux installers these have some sort of disk encryption. Some installers
    only offer the option to encrypt the home partition while others let you encrypt
    the root partition as. If possible, I recommend encrypting the full disk. It''s
    true that your sensitive files are likely just on your home partition, but if
    that is all you encrypt, a sophisticated attacker could replace some of your common
    tools like ls, and so on with backdoor doors if they can access your root partition.


    Typically, installers that offer home directory encryption require your login
    password to unlock it. If you opt to go that route, be sure to pick a strong passphrase
    for login. Similarly, if you pick full disk encryption, be sure to pick a strong
    passphrase that you don''t use elsewhere. Also, if your workstation is portable,
    be sure to power down the machine whenever it''s going to be somewhere where risk
    of threat is higher (such as when you are traveling). When you suspend a machine,
    the decryption keys remain in RAM, and an attacker can use a cold boot attack
    to retrieve them without having to guess your password.


