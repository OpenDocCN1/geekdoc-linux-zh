    # Brute Force Attacks


    The simplest type of cracking technique is the brute force attack. With a brute
    force attack you emulate every possible password combination until one works.
    For instance, if you had to open a suitcase that has a three-number combination
    lock, the simplest (longest) approach would be to start with the combination 000,
    then try 011 and continue incrementing the number until you get to 999. In this
    case that would mean up to 1000 (10 * 10 * 10) attempts before you guessed the
    right combination.


    Most passwords are a bit longer and more complicated than a luggage combination,
    and as you increase the length of the password and the type of characters you
    attempt, you increase how many guesses you must perform and how long it takes.
    For instance, even a relatively weak password that''s 8 characters would still
    take up to 200 billion tries to brute force. Given enough time, a brute force
    attack would eventually crack any password, which is why passwords generally have
    a minimum length. The idea is to make brute forcing a weak password still take
    the attacker more time than they would want. Because of long brute force attacks,
    crackers generally try some of the faster methods I''ve listed in the following
    sections first and only resort to brute force attacks for passwords they can''t
    crack through either means. Even then, they need to start with brute forcing the
    minimum password length before trying longer passwords.


    # Dictionary Attacks


    The idea behind dictionary attacks is to avoid the huge number of possibilities
    in a brute force attack by creating shorter dictionaries of common passwords and
    trying those first. Brute forcing "password" might take billions of guesses, but
    with a dictionary attack it may take tens or hundreds of guesses (or even the
    first guess if "password" was the first word in the dictionary). People tend to
    pick passwords that are easy to remember, so when passwords were first used to
    protect accounts the first passwords were often just a single word. Password crackers
    would build dictionaries filled with commonly used passwords first, and then supplement
    it with all of the words in the English language. By the time they got to the
    end of their dictionaries, they would have cracked many of the passwords without
    having to a time-consuming brute force attack.'
