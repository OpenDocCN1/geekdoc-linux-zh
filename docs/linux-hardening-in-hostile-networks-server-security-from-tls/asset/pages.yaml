    # Normally Build a File System Timeline


    Normally you want to build a file system timeline inside a tool like Autopsy.
    Autopsy makes it simple to build timelines on all the file systems it supports
    and makes it easy to integrate into the rest of your investigation. However


    A file timeline organizes all the files into a text database where they are ordered
    by their MAC times. With a file system timeline if you have a good idea when the
    attacker might have been on the system, you can start to track their virtual footprints
    as they execute programs, browse directories, and untar their scripts onto the
    system. If Autopsy and Sleuth Kit cannot generate the file for you, you can still
    build a timeline with tools from the Coroner’s Toolkit called mac-robber and madame.
    The mac-robber utility can collect MAC times from a partition image or from a
    mounted file system and should be packaged for'
