- img_proc: true
  md: '# Appendix A Tor


    +   - An IP addressed to an aide''s workstation inside the White House connects
    to port 115 (Secure FTP) on a New York Times server.


    +   - A workstation IP at an office connects to port 443 (HTTPS) on youpornium.com
    and downloads 200MB of encrypted data between noon and 1 PM.


    Whether you are trying to research your personal health, leaking information to
    a newspaper, breaking your office pornography policy, trying to publish information
    about abuses inside of a repressive regime, or just value your privacy, Tor goes
    beyond encrypting your traffic—it also obscures the source and destination so
    that anyone happens to look at your network traffic might know you are Tor, but
    not what you are using for.


    # How Tor Works


    When people want to be anonymous on the Internet, they use a VPN service. With
    a VPN service, you use all of your traffic through a private tunnel to the VPN,
    and then the VPN forwards it to the Internet. You could think of this like handling
    a letter to a friend and having them put their address on it. When someone inspects
    your traffic, it traces back to the VPN instead of you. There are problems with
    this approach, however A VPN provides a level of misdirection but not true anonymity
    because the VPN service knows which packets come from you and where they were
    headed. If someone inspected your traffic, they may just see that all goes to
    the VPN, but if they looked at both traffic to the VPN and VPN traffic to the
    Internet, they may be able to start correlating it. If someone compromised the
    VPN service itself (or a malicious employee worked there), they could unmask you.


    If you were trying to solve this problem, you might conclude that what you should
    do is set up two VPN services. You could connect to VPN A directly, and once connection
    is made, forward traffic through VPN B and on to the Internet. That way, if someone
    compromises VPN A, they all know that you are talking to and it forwarding traffic
    to VPN B, but not where it ends up on the Internet. If they compromise VPN B,
    they can see where the traffic is destined but not who sent it. There is no direct
    link between VPN A, which knows the source, and VPN B, which knows the destination.


    If you are thinking, "What if I just added a third VPN in the middle so there''s
    no direct link between congratulations!, the Tor actually works is a bit more
    involved than that, and there are so many more Tor servers out on the Internet,
    it offers much more protection than a hop through three VPNs—but it does capture
    the general idea.


    When you use Tor, your client calls a special Tor directory server for a list
    of Tor nodes to which it can connect, then chooses one at random and connects
    to it (Figure A-1). That connection is encrypted, and anyone who is observing
    your network traffic would only know that you are talking to that particular Tor
    node.'
