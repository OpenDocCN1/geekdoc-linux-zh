    In the preceding case, you can see that there are three root users and an empty
    user assigned to localhost. We want to get rid of the anonymous user, so we would
    issue the following command:


    ```

    > drop user "@localhost";

    > flush privileges;

    ```


    If we run the command again, we would see that user is no longer in the database:


    ```

    > SELECT Host, User FROM mysql.user;

    ```


    | Host | User |

    |------|------|

    | 127.0.0.1 | root |

    | :: | root |

    | localhost | root |


    3 rows in set (0.00 sec)


    Repeat that drop user command for any anonymous users you may find in your database.


