  md: "# Chapter 7 DNS\n\n162\n\nDNS query from the attacker sends a huge reply to\
    \ the forged IP address—the attacker's target. If this is repeated across a large\
    \ number of DNS servers on the Internet, an attacker can create a large amount\
    \ of attack bandwidth even if her server has more modest upstream bandwidth.\n\
    \nThe easiest way to mitigate this is to use the allow-recursion statement to\
    \ limit what coasts on your DNS server for recursive queries. However, while open-relay\
    \ recursive servers are the traditional target for these attacks, the attacker\
    \ also works with authoritative servers; it's just that the attacker has to customize\
    \ the DNS query for a record for which the DNS server is authoritative. Also,\
    \ if the server uses DNSSEC, DNS replies to small queries get larger.\n\nWhether\
    \ you want to protect your authoritative DNS server or have a recursive DNS server\
    \ you cannot close off from the Internet, you can prevent an attacker from using\
    \ your server in an amplification attack using BIND's Response Rate Limiting feature.\
    \ This feature was added in BIND 9.9, so you may need to upgrade your version\
    \ of BIND. (They have also provided a patch you can apply to BIND 9.9 if you are\
    \ willing to recompile.) Response Rate Limiting works by allowing you to set an\
    \ upper limit on how many responses you allow per second from a particular host\
    \ that is asking for a particular record:\n\n```\noptions {\n  rate-limit { responses-per-second\
    \ 10 };\n}\n```\n\nWith any settings change, you will need to reload your DNS\
    \ configuration for this to take effect. In this case we've limited the number\
    \ of responses to ten per second, but if you're not sure what would block legitimate\
    \ use of your DNS server, start by adding an option to only log but not block\
    \ all hosts that cross the threshold:\n\n```\noptions {\n  rate-limit {\n    responses-per-second\
    \ 10;\n    log-only-yes;\n  }\n}\n```\n\nThen you can let your DNS server run\
    \ for some time and inspect your logs to see when responses are dropped. (They\
    \ will contain the phrase \"rate limit drop\" and be tagged as a query error.)\n\
    \n# DNS Query Logging\n\nWhile logging every your DNS server gets can be useful\
    \ for a debugging perspective, it can also provide a handy audit trail after an\
    \ attack. If an attacker, downloads attack tools from the Internet from compromising\
    \ a host, you could track that particular DNS query in your logs and attach an\
    \ accurate timestamp to that event. Alternatively, you could direct your DNS query\
    \ logs to a centralized logging server and inspect them for queries against questionable\
    \ domains."
