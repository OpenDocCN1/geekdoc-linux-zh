  md: '# Password Complexity


    Another approach to make brute force attacks more difficult is imposing password
    complexity restrictions. This means that instead of just allowing any 8-character
    password, for instance, you require that the password contains both letters and
    at least one number, or a mixture of uppercase and lowercase letters or even basic
    punctuation. By requiring extra characters in a password, you increase the total
    number of combinations for a particular length of password. Let''s the common
    8-character password as an example. Here are the number of total password combinations
    for 8-character passwords with different complexity requirements:


    +   * Lowercase—26: 200 billion combinations

    * Lowercase and uppercase—52: 53 trillion combinations

    * Lowercase, uppercase, and numbers—62 characters: 218 trillion

    * Lowercase, uppercase, numbers, and symbols—96 characters: 7.2 quadrillion


    Increasing complexity does dramatically increase the number of overall password
    combinations, but you''ll notice it doesn''t increase nearly as much as increasing
    the minimum password length. A 12-character password still has an order of magnitude
    more combinations than an 8-character password with full complexity.

    The problem with complexity requirements is that while on paper does increase
    the overall number of combinations, in practice doesn''t necessarily ensure a
    password that''s hard to crack. Because most people need to remember their passwords,
    they don''t just pick a random string of characters from the class as their password.
    Instead, they generally still base their password on a dictionary word and then
    add some special characters as needed to suit their password policy. This is further
    complicated by mobile applications where it can feel even more difficult to type
    passwords on an on-screen keyboard.


    For instance, if you require a user to use a mix of uppercase and lowercase words,
    they will likely pick a dictionary word and make the first character uppercase.
    If you require them to add numbers to the password, they will probably pick a
    6-8-character dictionary word and put two numbers at the end, and those two numbers
    will likely correspond to some significant year for them (birth year, graduation
    year, wedding anniversary, or their child was born). If you require a symbol,
    they will probably pick an exclamation point and put it at the end of a dictionary
    word.


    Some tech-savvy users take a different approach when presented with complexity
    requirements and take a dictionary word and apply "leet speak" to it."Leet speak"
    is a phrase referring to a common practice among hackers of replacing letters
    with similar-numbers in a word so "password" might become "pa55word" or "pa55word"
    or even "p45w0rd" depending on how fancy they want to. Of course, password crackers
    know that people who do this, and as you''ll see in Section 2, it''s even easier
    for a computer to apply those transformations to a person.'
