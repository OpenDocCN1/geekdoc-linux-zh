    the cipher suite denotes the message authentication code algorithm to use to generate
    a hash that validates blocks within the message stream, in this case SHA256.


    # TLS Troubleshooting Commands


    When troubleshooting TLS, there are a few basic OpenSSL commands I''ve found to
    be particularly useful. OpenSSL is a cryptography Swiss Army knife and has an
    unfathomable number of options, but for basic troubleshooting you only need to
    remember a few.


    # View the Contents of a Certificate


    When troubleshooting TLS, one of the main things you''ll find yourself needing
    a way to view the contents of your certificate. This is useful when you want to
    confirm when the certificate expires (a common cause for out-of-the-block problems
    with TLS) or to know which sites a particular cert is valid for. This command
    will return all of the information inside the certificate:


    ```

    openssl x509 -in /path/to/cert.crt -noout -text

    ```


    # View the Contents of a CSR


    After you have generated a CSR or before you submit an CSR to a CA for renewal,
    you will probably want to view the contents of that CSR to make sure that it has
    the correct list of hosts. That requires a slightly different OpenSSL command:


    ```

    openssl req -in /path/to/certrequest.csr -noout -text

    ```


    # Troubleshoot a Protocol over TLS


    This is one of the more useful OpenSSL commands if you are trying to troubleshoot
    a service you have protected with TLS. Normal network troubleshooting commands
    like telnet or not work with TLS services because they won''t perform the proper
    handshake. In those cases, you can use OpenSSL to initiate a TLS connection to
    the remote service and provide you with a command prompt where you can enter raw
    HTTP, SMTP, FTP, or other commands. For instance, to connect to example.com''s
    HTTPS service listening on port 443 that I could type raw HTTP commands for troubleshooting.
    I would type


    ```

    openssl s_client -connect example.com:443

    ```


