  md: '# Chapter 9 Incident Response


    log in or at the very least before safely shut down the server. That way even
    if the cloud provider does not let you power off the server without going through
    the shutdown sequence, you can at least replay the system or disk snapshot as
    needed.


    # Imaging Disks in the Cloud


    Unlike with physical servers, in the cloud you often cannot boot a server from
    an rescue disk ISO (although if you can, that''s great). If you can, then you
    can simply create a disk image like you would with any other physical server.
    Otherwise, you will have to figure out how to attach the cloud server''s disks
    to a different cloud server to create the image.


    By default AWS, the root file system is backed on Elastic Block Storage (EBS)
    so once the machine is off you can detach volume and any other volumes from that
    and reattach them to a different server, ideally one aside for purpose, with a
    large volume attached to it that can contain all of the disk images. At that point
    the volumes will appear like any other attached disk, and you can use normal utilities
    like dd to create an image and checksum the volume. You can then copy over the
    network to your forensics machine. Be cautious to mount these volumes at least
    until you have created an image, and even then, read-only. You could create a
    cloud server for forensics analysis that has Autopsy and Sleuth Kit installed;
    in that case, you just need to be careful of fiery off access to the Autopsy web
    service.


    # Ephemeral Servers and Storage


    Another consideration in your cloud incident response is how to manage ephemeral
    storage and temporary servers. Because many servers are intended to be temporary,
    they often do not have persistent storage. For instance, in AWS you have the option
    to use ephemeral storage for the root file system and also as high-speed storage
    for the server. In this case the storage is erased whenever the system halts and
    so forensics analysis of such servers is limited. In the best case with those
    type of servers that you may be able to take a system snapshot, or otherwise use
    a tool like grr (https://github.com/google/grr) that lets you pull forensics data
    from a live system—although in that case you would need to set up that infrastructure
    ahead of time. If you think that forensics collection is important should particular
    server be compromised, you may want to opt for more persistent storage for those
    services when you build them.


    # Summary


    While I hope the preceding chapters helped you prevent an attacker from compromising
    your systems, despite your best efforts an attacker may still find a way in. In
    this chapter, we discussed how to respond when a machine has been compromised.
    With the wrong approach, you can easily damage evidence that would be useful later,
    so we started with some fundamental approaches to incident response that will
    help preserve data. We then covered how to use the Autopsy suite of tools and
    finally gave an example walkthrough of how to use Autopsy to respond to a hacked
    machine.'
