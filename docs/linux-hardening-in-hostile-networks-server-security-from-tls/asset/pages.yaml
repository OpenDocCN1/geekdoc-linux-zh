    on your server based on the IP address of the remote computer. While firewalls
    are a useful security measure, in the case of a web server on the Internet you
    generally want everyone to be able to access ports 80 and 443 on your web server
    if you block all other ports. One method you can use to protect a server from
    harmful traffic is by using a web application firewall (WAF). A WAF acts like
    a traditional firewall in the sense that it can intercept and block traffic based
    on rules, unlike a traditional firewall looks at source and destination IPs and
    ports, a WAF inspects the contents of web requests coming into your web server
    and can block potentially harmful requests before your web server acts on.


    # Note


    WAFs help with defense in depth because of their ability to block harmful web
    requests, but they shouldn''t be relied on your means of security. Even with the
    best signatures in place, sometimes bad traffic will make it through your WAF.
    So you need to ensure you keep your software up to date and audit your web application
    code for security vulnerabilities.


    While WAFs come in the form of appliances you can place in your data center in
    front of your web servers, like with a firewall appliance, some of the most popular
    WAF implementations come in the form of modules you can load directly into your
    web server. In this section, we discuss how to install and configure ModSecurity—the
    most popular WAF module available for Apache and Nginx.


    ModSecurity works with both Apache and Nginx, it was originally designed for Apache
    and has been used much longer with Apache. So, it is easier to get ModSecurity
    up and running with Nginx. Since Nginx doesn''t support loadable modules, it requires
    recompiling the Nginx binary to include ModSecurity. We will cover ModSecurity
    on both platforms, we''ll start with the simplest case: Apache.


