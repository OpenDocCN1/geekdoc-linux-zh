    # Personal Relays


    A Tor relay is useful if you would like to create a Tor service for use or within
    your network, but you don''t want to expose it to the outside world. It is the
    simplest type of relay to configure, and as other Tor nodes will not route traffic
    through it, will only use bandwidth according to your Tor use.


    Tor is configured through the /etc/tor/torrc file and by default it will be set
    up as a safe personal relay that only allows traffic from localhost, so if you
    want to use Tor only on your workstation, just install the package for your distribution
    and start the service with systemctl restart. It should then be available for
    you to use on localhost port 9050.


    If you want to use a personal relay for your whole internal network to use, keep
    in mind that anyone can view the local network traffic will be able to see where
    requests are going they aren''t protected by Tor until they get to your Tor server.
    To open up Tor for your local network, configure the SocksListenAddress in /etc/tor/torrc
    file to tell Tor to listen on a network address other than localhost. For instance,
    if you wanted Tor to listen on all interfaces, you would


    ```

    SocksListenAddress 0.0.0.0

    ```


    If your server has multiple IP addresses ( 192.168.0.6 and 10.0.0.4) and you only
    wanted Tor to be available on one of them, you would just specify the address
    explicitly:


    ```

    SocksListenAddress 10.0.0.4

    ```


    You can also specify different ports for Tor to listen on of the default 9050:


    ```

    SocksListenAddress 0.0.0.0:9100

    ```


    The name of this configuration setting aligns to the fact that Tor sets up a SOCKS
    proxy. Any network services that support going through a SOCKS proxy (such as
    web browsers and other network clients) just need to be pointed to the IP and
    port for your Tor server.


    Remember to restart Tor with systemctl restart for the configuration settings
    to take effect. You should be able to see Tor connect to the network via /var/log/tor.
    Periodically Tor will update the log file with statistics about the amount of
    bandwidth it has used while it is up.


