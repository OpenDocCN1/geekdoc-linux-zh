  md: '# Appendix A Tor


    configure your client to require more hops than that. By picking a minimum of
    three hops, compromising or viewing the traffic of any one of these nodes will
    not reveal both the source and destination of any traffic. If you compromise the
    entry node, you only know the source and the destination appears to another Tor
    node. If you compromise the middle node, you only see the source and destinations
    are other Tor nodes. If you compromise the exit node, you can see the destination
    IP, but the source is a Tor node that is not directly linked to the source IP.


    If Tor only created a single circuit for you and used the same one for all of
    your traffic, over time someone who was specifically targeting you might be able
    to unmask you. While you could create a new circuit for every single connection,
    there is overhead involved in creating new circuits, Tor reuses your existing
    circuit for approximately 10 minutes. After 10 minutes, Tor builds a new circuit
    through the network for your client (Figure A-3). This way, even if someone happens
    to be observing the traffic from a Tor exit node and suspects it might be coming
    from, pretty your traffic will be exiting through a completely different node
    on the network. This makes correlating traffic from an exit node to a particular
    user very difficult.


    ![](img/dfa7aeb32ad1e75c5175c6eeb5e62cc7_244_0.png)


    Figure A-3 Creating a new route through Tor (Image courtesy of The Tor Project,
    Inc.)nCopyright The Tor Project Inc. (tor.eff.org), published under CC BY 3.0
    US (https://creativecommons.org/licenses/by/3.0/us/).'
