    Let''s break this command up into a few parts to explain the syntax:


    ```

    grant all privileges on thisdb.

    ```


    This section defines which privileges we are giving to the user and databases
    and tables it applies to. In this case, we say thisdb.* which means all tables
    on the database, but we could also use \* to grant permissions on all tables on
    all databases, thisdb.sometable to restrict this access to the sometable table
    within thisdb. The next section of the command defines the user and his password:


