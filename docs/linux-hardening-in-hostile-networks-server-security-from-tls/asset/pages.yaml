    \n  allow-transfer { 12.23.34.45; 12.23.34.56 };\n}\n```\n\nFinally, we want to\
    \ modify this section so that it knows to only allow updates from hosts with the\
    \ shared secret. We want to restrict these updates not just to this particular\
    \ domain, but also to specific record types. For instance, we may be okay with\
    \ a host updating A records, but not without updating NS records. To do this,\
    \ we add a new update-policy section to the zone configuration that looks like\
    \ this:\n\n```\nupdate-policy {\n  grant example.com-host. subdomain example.com\
    \ A;\n}\n```\n\nIn this statement, we start with the name of the key which we\
    \ want to grant this access (in this case, example.com-host), which is the same\
    \ name assigned to the key in the preceding key statement. Next, we limit updates\
    \ to just the example.com subdomain with domain example.com, and finally we just\
    \ the type of record for which we want to allow updates, in which case is A records.\
    \ The final complete zone configuration looks like the following:\n\n```\nzone\
    \ \"example.com\" {\n  type master;\n  file \"/var/lib/bind/db.example.com\"\n\
    \  journal \"/var/lib/bind/db.example.com.jnl\"\n  update-policy {\n    grant\
    \ example.com-host. subdomain example.com A;\n  }\n  allow-transfer { 12.23.34.45;\
    \ 12.23.34.56 };\n}\n```\n\nNow we can reload BIND to use the new settings. Check\
    \ the system logs for errors to make sure you didn't typo the name of a key.\n\
    \n# Configure a Client for Dynamic DNS\n\nNow that the DNS master is ready to\
    \ accept dynamic updates, we can use the nsupdate tool to perform updates on a\
    \ host. All we need is to create a copy of the key configuration from the BIND\
    \ master on the host, such as in /etc/ddns/example.com-host.key:\n\n```\nkey example.com-host\
    \ {\n  algorithm hmac-sha256;\n  secret \"LZi0GHYVY4W5EsXg3otog1Q==\";\n}\n```"
