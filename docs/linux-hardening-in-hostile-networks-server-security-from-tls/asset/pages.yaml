    you rely on remov-able storage (either physically removable by hot-swapping, or
    network storage via network-attached storage or cloud storage), an attacker may
    sidestep everything and try to get the disk itself.


    With more advanced attacks, you need stronger protection than access control lists
    or firewall rules; you need math. By encrypting your sensitive data, you can add
    an additional layer of protection against more sophisticated attackers. In this
    section, we introduce a few of the different approaches you can take to encrypt
    database data, and we will discuss their pros and cons.


    # Full Disk Encryption


    Of the simplest approaches to encrypting database is encrypting the file system
    using native Linux encryption like LUKS. In fact, many security policies require
    that data be encrypted at rest. I cover server encryption in detail in Chapter
    3, “Server Security,” so here I focus on how disk encryption helps with database
    security. Disk encryption protects database the same way it protects any other
    data—when the system is powered off, or if the particular file system is unmounted,
    data is un unless you have the decryption. The idea here is to protect you from
    an attacker who has physical access to the hard drive by pulling it out of the
    server or by acquiring that drive has been decommissioned from the server (either
    from the garbage or by buying it from you).


    The problem with full disk encryption or “encryption at rest” is that database
    is almost never at rest. When the server is booted and the database is running,
    the file with database data must be mounted and readable. That means that any
    attacker who can access the server’s mounted file system can potentially read
    those files without any encryption. Applications also need access to the database,
    so disk encryption doesn’t protect you from SQL injections or any other attacks
    where the data is pulled from the application itself.


    Given all this, is encryption worth it? Well, if you are required to encrypt your
    disks to comply with a security policy, the answer is definitely yes. If you don''t
    need to comply with such a policy, I’d argue the answer is still yes. One of the
    most important things disk encryption will protect you from bad disk destruction
    policies where attackers have bought disks specifically to see if they could recover
    sensitive data from them. If you encrypt your data at rest, even if you forget
    to destroy the data on the disk before you get rid of it, you can be assured the
    database data is still safe.


