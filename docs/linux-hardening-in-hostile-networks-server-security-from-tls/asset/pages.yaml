  md: '# DKIM


    DKIM attempts to solve the problem of unauthorized servers sending mail on a domain’s
    behav in a completely different way than SPF. While, like DKIM does have a DNS
    component to it, with DKIM, you authenticate valid mail servers using public key
    cryptography. Each valid mail server has access to a private key and publishes
    the public key in a special DNS record. The email server uses the private key
    to create a signature for each outgoing mail and embed it in the email’s headers.
    Remote mail servers can compare the email signature with the public key, and if
    the signature matches, the remote mail server knows that only a mail server that
    has the valid private key could sent it.


    With DKIM, you not only prevent spammers from sending email that pretends to be
    from your domain, but since the headers and body of each email are signed, you
    can also protect against forging or manipulating the contents of email in transit.
    A remote mail server sees that an email DKIM signature doesn''t match, or does
    not exist when it should, has reason to be suspicious that the email might be
    or some kind of phishing attack.


    # Configure OpenDKIM


    To use sign emails, you need to install OpenDKIM and its related tools. Debian-systems,
    this is provided by the opendkim and opendkim-tools packages; you can install
    it with


    ```

    sudo apt-get install opendkim opendkim-tools

    ```


    By default, the package doesn’t create directories you will need to better organize
    your keys and configuration files, so the next step is to create these directories
    and make sure they are owned by the opendkim user and group:


    ```

    sudo mkdir -p /etc/opendkim/keys

    sudo chown -R opendkim:opendkim /etc/opendkim

    ```


    # Edit the opendkim.conf File


    Next, edit the /etc/opendkim.conf file and at the end add the following lines
    to set commonly used options well as point OpenDKIM to the location of the keys
    and other configuration files you will use:


    ```

    AutoRestart yes

    AutoRestartRate 10M

    Canonicalization relaxed/simple

    SubDomains sv

    SignatureAlgorithm rsa-sha256

    nKeyTable /etc/opendkim/keytable

    SigningTable /etc/opendkim/signingtable

    ```


    ```

    ExternalIgnoreList /etc/opendkim/trustedhosts

    InternalHosts /etc/opendkim/trustedhosts

    ```'
  merge: -1
  pgno: 172
- img_proc: true
  md: "The AutoRestart and AutoRate options set whether the openkim program\nshould\
    \ restart itself on failures, and how frequently to restart (in this case, 10\
    \ restarts in\nhour) before it terminates a filter. The Canonicalization option\
    \ defines how tolerant\nsoftware is to changes in the header and body. In the\
    \ preceding case, I set header processing with its relaxed algorithm, which allows\
    \ a minor change to the headers (such\naspace changes) while I set the body to\
    \ which, which allows no changes. The Mode option whether OpenDK will act as a\
    \ signer (s) of messages, a verifier (v)\nof messages, while the SignatureAlgorithm\
    \ specifies which algorithm to use\nwhen signing messages.\n\nThe remaining options\
    \ point OpenDK to the KeyTable(a file that maps the names\nof keys to the key\
    \ files), the SigningTable(a file containing email address patterns and\nt key\
    \ name those patterns map to), and the ExternalIgnoreList and InternalHosts,\n\
    which define hosts that can send mail through the server and that of these settings\
    \ can be pointed to the same file, which makes maintenance of trusted hosts a\
    \ bit simpler.\n\n# Create the Trusted Hosts File\n\nThe /etc/openkim/trustedhosts\
    \ combines the ExternalIgnoreList and InternalHosts\nsettings for OpenDK and you\
    \ define a list of IPs or domains that should be\ntrusted and have emails signed\
    \ without further authentication. For our example, here\nis a reasonable trusted\
    \ hosts file that allows localhost and all the hosts under our example\ndomains:\n\
    \n```\n127.0.0.1\n::localhost\n*.example.com\n*.example.net\n```\n\nIf you didn't\
    \ want to be so broad, you could explicitly define particular hostnames or\nIPs\
    \ that belong to mail servers in your environment. On the other hand, you could\n\
    \ broader and define every internal subnets you want to allow, as 192.168.0.0/24.\n\
    \n# Create the Signing Table\n\nThe Signing Table define patterns for email addresses\
    \ and assign names to them.\nYou will reference those names in the Key Table later\
    \ so OpenDK knows which\nto use for these emails—this is particularly useful if\
    \ your mail server handles multiple\ndomains. Create the /etc/openkim/signingtable\
    \ file and add a new line for each\ndomain your mail server handles:\n\n```\n\
    *example.com example.com\n*example.net example.net\n```\n\nThe first field in\
    \ this file is a pattern to match against the From address, and the second\nfield\
    \ is a key name it should use. In my examples, I named the keys after their domains,\n\
    but you could use any unique name that helped you identify one key from another.\n\
    you have created entries for all your domains, you can move on to the Key Table."
