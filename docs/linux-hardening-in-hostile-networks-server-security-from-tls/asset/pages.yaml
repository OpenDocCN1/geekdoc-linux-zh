  md: '# Foreword


    Computer and software security has always been an important topic. Today it is
    also an urgent one; security breaches continue to increase exponentially, and
    even GNU/Linux systems, which have traditionally been less prone to problems,
    are subject to devastating attacks. If you''re using a GNU/Linux system for anything
    at all critical—even if it''s just your email and home tax accounting—you need
    to know how to protect it!


    This book is the right "go-to" place to get started. Beginning with the basics,
    the author covers what you need to know for all important areas of GNU/Linux system
    management, in clear and readable prose. After reading it you''ll be able to improve
    the safety of your systems and be prepared to go further on your own. The book
    is written in a careful, vendor-neutral manner, so that everything applies as
    broadly as possible; with any luck this book will be useful to you again and again,
    instead of becoming obsolete upon the next release of Distro XYZ.


    I hope you''ll agree with me that this book is worth your time. Keep safe!


    —Arnold Robbins

    Series Editor'
  merge: -1
