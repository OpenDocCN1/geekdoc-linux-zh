- img_proc: true
  md: '# Section 3: Advanced Hardening 153


    The first tag in the record, v sets the version of the protocol and is a required
    option. Like with SPF records, it lets you denote the version of the protocol
    you are using, in this case DMARC1. The next value, p, sets the policy for the
    domain and is required. The policy tells the remote mail servers what to do with
    emails that fail the SPF or DKIM checks and can be set to the following values:


    +   - **none**: Allow the messages through as normal, but log the failure for
    the daily report.

    - **quarantine**: Mark the message as spam.

    - **reject**: Block the message at the SMTP server.


    When you start out DMARC, it''s recommended to take a slow approach in escalating
    the policy to the point that it blocks messages. By setting the policy to "none"
    and review the email reports you will ensure that you wouldn''t have blocked valid
    messages. Where do servers send those email reports? They send them to the value
    you set in the rua. While the rua tag is optional, it''s also recommended to add
    the pct tag to get reports on emails that fail the DMARC test so you can review
    them before you increase the strength of your policy. You check regularly so you
    can check which emails are getting flagged. You can also set rua to multiple addresses,
    just set them apart with commas:


    ```

    v=DMARC1;p=none;rua=mailto:postmaster@example.com,mailtoadmin@example.com

    ```


    # Measured Deployment of DMARC


    Once you have tested your DMARC policy at the "none" level for some time and feel
    good about the failed messages you see in your reports, the next step is to increase
    the policy to quarantine. When you do, it''s recommended to add the pct tag to
    your DMARC rule, which lets you define the percentage of messages that get this
    policy. This tag is optional, and if it isn''t set, the policy is applied to 100%
    of the messages. When you change your policy to make some kind of action on a
    message like quarantine or blocking it, you should start with a small percentage
    of messages:


    ```

    v=DMARC1;p=quarantine;pct=10 rua=mailto:postmaster@example.com

    ```


    In this example, 10% of your emails that fail the SPF or DKIM tests would be quarantined
    (flagged as spam). As you deploy DMARC, start with a low percentage like this,
    keep an eye on your daily reports, and as you feel more confident, start to increase
    the percentage until ultimately 100% of the messages are quarantined.


    At some point you may feel confident in DMARC that instead of flagging emails
    as spam, you want servers to block them all together. To do that, you would set
    the policy to "reject". Then, with the rollout of the quarantine policy, start
    with a small percentage of emails first:


    ```

    v=DMARC1;p=reject;pct=10 rua=mailto:postmaster@example.com

    ```


    As you feel confident in the reject policy, you can increase the percentage until
    ultimately apply it to all messages.'
