    # Compartmentalization


    The idea behind compartmentalization follows the adage “Don''t put all your eggs
    in one basket." Compartmentalization operates under the assumption that an attacker
    might be able to reach part of your system, so you should restrict the damage
    of their attack as much as possible. For instance, when preserving food, you don''t
    put all of your food into a single jar. Instead you portion it out into smaller
    jars so that if any individual jar gets a bad seal or gets infected, it doesn''t
    ruin the whole batch.


    In the context of computer security, compartmentalization means thinking about
    what would happen if an attacker compromised a particular system, then setting
    things so the damage is contained. In the past, many infrastructures were built
    on a couple of servers, each with many different services. If an attacker compromised,
    a way, they could compromise the DNS, application, and database servers that were
    on the same physical server. These days, compartmentalization is much easier with
    the advent of virtual machines and cloud computing. You can isolate each service
    to its own server so if one service gets compromised, the rest of your infrastructure
    is safe.


    When applied to data, compartmentalization means not storing all your data in
    a single database or important files on a single server. If you have a number
    of services that need to store data in a database, they should each have their
    own database for their data. When, if any one of them is compromised, the attacker
    can''t immediately pull all of your data out of the environment.


    When applied to network security, compartmentalization means not putting all your
    different services within the same network subnet. By isolating services to their
    own networks, you can add network restrictions to help limit what an attacker
    could do if she happened to breach one service.


    When applied to password security, compartmentalization means not using the same
    password for every account you have on the Internet. You have to assume that at
    point one of those services will be attacked and that particular password may
    get cracked. The attacker will naturally test password on other sites; so, if
    you don''t compartmentalize your passwords, a compromise on one site equals a
    compromise on all.


    # Basic Password Security


    The password is one of the most fundamental methods of authentication. Back during
    Prohibition, speakeasies sprang as places where patrons could still stir illegal
    liquor. To prevent the authorities from finding out, if someone came to the door
    of the speakeasy and knew the password, it was proof that they were a patron.


    In computer security, passwords are the main way that users protect that they
    are who they say they are. Passwords provide this protection by being secret—they
    are supposed to be something only you know and that someone else couldn''t guess.
    Early passwords were commonly just simple, memorable word. Countless movies and
    TV shows feature people breaking into someone''s account by trying to guess their
    password: a member of their family, a favorite pet, or a favorite sports team.'
