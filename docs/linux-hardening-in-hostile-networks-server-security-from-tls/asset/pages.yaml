    # Section 2: Database Hardening


    In the previous section, we discussed some of the basic ways to set up secure
    users for your database both from the local host for overall database administration
    and for internal database users who only access specific databases. These are
    tasks that anyone sets up a database needs to go through to get things up and
    running. However, these don''t mean everything you need to do. In many cases,
    databases are configured to allow anyone, including anyone on the Internet, to
    access your database. And they rely on firewall rules at the gateway or on the
    host itself to shield it from bad traffic. Most, because many administrators operate
    under the belief that only the external network is hostile and the internal network
    is safe, their applications communicate with the database over plain text that
    exposes their passwords to anyone who can sniff the connection.


    In this section, we won''t rely on security measures on other parts of the network
    to protect our database. Instead, we harden the database with network access controls
    that reinforce firewall rules you may already have in place so only the hosts
    you have explicitly allowed can access your database. Then I cover how to protect
    your'
