    submit to the CA but keep for yourself as the secret counterpart to your public
    certificate. The CA signs that certificate with its private key, which provides
    proof that the CA vouches this certificate is valid for that hostname. Because
    web browsers or operating systems that have CA''s public certificate implicitly
    trust it, when they see your certificate they verify the CA''s signature against
    their local copy of the CA certificate. If your certificate was tampered with
    by any, the signature wouldn''t match; if the signature matches, the client can
    trust your certificate. For an attacker to circumvent this process, he would need
    to compromise a CA and its private key. This has actually happened a number of
    times before and required that browsers and operating systems recognize the corresponding
    CA certificate.


    There are also what are known as self-signed certificates. In these cases, an
    administrator has set her own CA on a server and generates signed certificates.
    If you received one of these certificates in a web browser, the browser would
    warn you that it is signed by an untrusted CA administrator''s certificate is
    not listed among the list of CA certificates embedded in the browser. That said,
    often rely on self-signed certificates for internal communications since they
    are free and quick to generate. In those cases, the organization would often add
    their internal CA to the list of valid ones on any signed certificates show as
    valid.


    The server certificate isn''t only useful in authenticating the server to the
    client; once a client receives the certificate from the server and validates it,
    it uses that certificate to encrypt the next step of the communication. Since
    only the server should have the corresponding private key, it only should be able
    to decrypt this part of the message. This is reason why it''s important to protect
    your private key. This next encrypted phase of communication between client and
    server is where both sides agree on a secret to use for symmetric encryption of
    the traffic. Why not just use the certificate whole time? It turns out that this
    type of encryption is significantly slower than symmetric encryption, so it is
    only used to bootstrap secure communication. The rest of the time, the communication
    uses the agreed-upon symmetric cipher from the list of supported ciphers.


    # Deciphering Cipher Names


    When working with TLS, you will often encounter lists of ciphers (including in
    this book). While TLS supports a large number of different combinations of algorithms
    for different parts of the protocol, over time some of these have been found to
    be flawed and have been deprecated in favor of newer, more secure algorithms.
    It can be useful to understand how to break up a particular cipher name into its
    different parts. For instance, let''s take the following cipher suite:


    ```

    ECDHE-RSA-AES128-GCM-SHA256

    ```


    The first part of this cipher suite denotes the key exchange algorithm both sides
    would use during the handshake, in this case ECDHE-RSA or Elliptic Curve Diffie-Hellman'
