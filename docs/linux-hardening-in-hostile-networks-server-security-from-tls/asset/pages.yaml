  md: '# 8


    # Database


    There is only one place in your infrastructure that holds important information,
    it''s likely to be a database. It''s popular these days for web applications to
    be largely stateless, which means these servers don''t store any data themselves.
    With stateless applications, you can spin up and spin down servers more or less
    will—ideal for cloud environments. The thing is, though, stateless applications
    generally process and change data, it''s just that they store those changes in
    the database. In some cases, the database might be the only place in an environment
    where data changes and persist.


    Because of the valuable data that there''s there, access to the data in a database
    is one of hacker''s primary goal. In addition to password hashes that attackers
    crack to try and gain access to Internet accounts, databases tend to have other
    personal information as addresses, phone numbers, and financial information that
    can be used for identity theft. This means that protecting and hardening the database
    should be one of the most important areas of your focus.


    There are some challenges to database hardening, however. One of the primary challenges
    is that many attackers can get to the database without compromising it in any
    way. An attacker who can exploit a web application can then see whatever data
    that application can, which is often the full database. In this chapter, I discuss
    a number of different approaches to database security for the most popular open-source
    database servers: MySQL (MariaDB) and Postgres. Starting with "Section 1: Database
    Security Fundamentals," I cover some security practices that you should follow
    as you set up your database."Section 2: Database Hardening" then dives into some
    intermediate steps including setting up network access control and controlling
    traffic with TLS. "Section 3: Database Encryption" focuses on database encryption
    and highlights some of the options available for encrypted data storage in MySQL
    and Postgres.


    # Section 1: Database Security Fundamentals


    While MySQL and Postgres do things differently, there are still some security
    practices that apply no matter which one of you pick. Before we dive into more
    advanced, time-consuming ways to lock down your database, there are a few essential
    and quick steps you should make sure are in place.


    # Essential Database Security


    Before you set up a database server, there are a few essential things you should
    think about regarding how your database is organized and where it sits on your
    network.'
  merge: -1
  pgno: 203
- img_proc: true
  md: 'These are the kind of considerations you can think through relatively quickly
    and implement before a database is set up, but they can be rather challenging
    to change after the database is place.


    # Location in the Network


    Many organizations think of the database as their "crown jewels," so when they
    are designing their network architecture, the database traditionally gets buried
    deep within their network behind the most lines of defense. In a traditional three-tier
    web application architecture, that would mean one subnet for the web end, which
    has direct access to the Internet, another subnet for the application tier, and
    a third for the database. The web front end could talk to the application tier,
    but not to the database—only the application tier was allowed to talk to the database.
    In a even more service-oriented architecture (SOA) in which the single application
    tier splits into smaller services, the same methodology applies.


    When designing your network architecture, isolate the database such that the application
    servers need to talk to it, and only on the prescribed ports the database uses
    (there''s no need for an application server to ssh into a database). There is
    also no reason for a database to make its own network requests elsewhere on the
    network outside of database backups, so lock down traffic to everything by default.
    In particular, databases shouldn''t need to talk to the Internet, so at the very
    least restrict their traffic to the internal network if they can''t lock down
    further than that.


    If you have the ability to restrict which servers have routable IP addresses and
    which don''t (something over you should have control in your own data center and
    something you can configure in Amazon Private Virtual Clouds, among other cloud
    providers), make sure your database servers only have an internal IP. There should
    be no reason to directly expose a database port for incoming connections from
    the Internet. If you need to allow a client out of the internal network to talk
    to the database, use a VPN or other secure link between the client and the database
    that doesn''t expose it directly on the Internet.


    # Database Compartmentalization


    While you store all of your important information in a database, you don''t necessarily
    have to store it in the same database. In the traditional three-tier web application
    architecture, you have a web server that takes incoming requests and passed dynamic
    requests to the application server. That application server then accessed a database
    that contained the data for the web app. If you have a single, monolithic application,
    it likely just accesses one database that contains all the data it needs, so compartmentalization
    is rather difficult.


    These days, it''s more common for web applications to apply an SOA, which splits
    a traditional web application into small pieces that are each responsible for
    a particular function. Let''s take a hypothetical e-commerce site as an example.
    You might have one application that handles user authentication and security settings,
    another that handles generating dynamic content as users shop for items on the
    site, and another that manages the shopping cart and checkout. In example, it
    would be much better to split the database such that each application stores data
    in its own database. For instance,'
  merge: -1
  pgno: 204
- img_proc: true
  md: '# Section 1: Database Security Fundamentals


    you might store the user''s login information and personal settings in the authentication
    database, inventory data in another, and user shopping cart and payment data in
    third.


    By splitting the database so that each application stores data within its own
    separate database, you help limit the damage if an attacker manages to compromise
    one app in the group. You should give each application its own database username
    and password to access its database, and make sure it can''t use those credentials
    for other databases. For instance, in our e-commerce example, the user''s password
    and general account information might be stored in the authentication app''s database,
    whereas their payment data could be stored in the shopping cart''s database. Most
    of the site would be driven off by the third application, a compromise of that
    database would not lead to any immediate leak of any customer data unless the
    attacker expand his attack to other applications.


    Another side benefit of this kind of database architecture is that it forces you
    to design your applications in a more secure and scalable way. Instead of each
    querying its own data for what it needs to ask other applications for data under
    their control. For instance, if the shopping cart application wants to pull some
    of the user''s personal data (such as their address), it would have to ask the
    authentication database. This allows you to set up restrictions and authentication
    between apps so that only apps that need information are allowed access to it.
    It also means you can split up these databases to be on their own database servers
    (or clusters) as they need to scale.


    # Local Database Administration


    Both MySQL and Postgres tie in a local system user as a database user responsible
    for important system-level changes such as creating and removing new databases,
    creating databases, and changing database permissions. Each of them can take completely
    different approaches and use different tools for their administration, and in
    some cases the default settings for superusers with an out-of-the-box installation
    are insecure.


    # MySQL


    MySQL administrative users behave like other database users, only with many privileges
    to change database settings. MySQL users are named with a combination of a username
    and a host, for instance, the default superuser for MySQL is root@localhost. When
    you use-line tools like mysql or mysqladmin, it will use your username and hostname
    (if localhost is on the same machine) if you don''t specify something else. So,
    to access MySQL as a superuser from a default Red Hat or Debian system, you could
    type:


