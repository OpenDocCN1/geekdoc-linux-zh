    # Password Rotation


    Password rotation is the bane of many corporate employees. A password-rotation
    policy requires everyone to change their passwords within a certain period such
    as every quarter or every month. Generally, businesses with password-rotation
    policies also require that new passwords can''t be too similar to any previous
    passwords. The idea behind rotation is that if someone''s password were to be
    compromised, the attacker would have a limited time to take advantage of their
    access before the password changed. Also, the hope is that if it takes the attacker
    a few months to crack a password, by that time the password will have changed
    and they will need to start all again.


    Password rotation, while annoying, would be tolerable if it actually worked. Unfortunately,
    password-rotation policies are ineffective in a few ways.


    # Attackers Are Fast


    When an attacker compromises an accounts, she generally doesn''t wait for a month
    or even a week before she uses it. Often, an attacker will take advantage of a
    compromised account within a day. By the time the password gets rotated, the attacker
    has done her damage and left. Also, attackers usually take advantage of their
    access to create some kind of back door so that if you change the password later,
    they still have access.


    # Rotated Passwords Are Guessable


    When you force users to rotate their passwords frequently, they are very likely
    to pick a new password that is very similar to the old one. In fact, there was
    study¹ measured likelihood:


    Even our relatively modest students suggest that at least 41% of passwords can
    be broken offline from previous passwords for the same accounts in a matter of
    seconds, and five online password guesses in expectation suffices to break 17%
    of accounts.. Combined with the annoyance that expiration causes users, our evidence
    suggests it might be appropriate to do away with password expiration altogether,
    perhaps as a concession while requiring users to invest the effort to select a
    significantly stronger password than they would otherwise (e.g., a much longer
    passphrase).


    If an attacker was able to crack the previous password, she will very likely be
    able to figure out the user''s password scheme and guess the new password as well.


    # Rotation Policies Encourage Weak Passwords


    Another problem with password-rotation policies is that it requires much more
    effort for someone to create and remember a strong password. The first time a
    user has to create a password, if he is encouraged to make a strong password,
    there''s a chance he


