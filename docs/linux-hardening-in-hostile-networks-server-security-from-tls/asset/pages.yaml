  md: 'If you don''t see any errors, you can use the opendkim-testkey command to validate
    that

    OpenDKIM can find a valid key:


    ```

    opendkim-testkey -d example.com -s 201608

    ```


    The -d argument tells opendkim-testkey which domain to test, and the -s argument
    specifies selector to use. If you get no errors, the test was successful; however,
