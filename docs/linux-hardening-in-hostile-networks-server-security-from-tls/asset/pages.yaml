  md: '# A


    # Tor


    Chapter 4, "Network," discusses how to use Tor to protect your anonymity on a
    network, but it focuses more on how to use Tor and less about how Tor works. Here,
    I dive a bit deeper into how Tor works and how it can protect your anonymity.
    I also discuss the security risks around Tor and how you can mitigate them.


    # What Is Tor?


    When you use the Internet, you normally use it without any promise of anonymity.
    You and the computers you talk to on the Internet are assigned IP addresses and
    every packet that goes between you and a remote server has the source and destination
    IP in its headers, the address and return address on a postcard. Even if you use
    a protocol like TLS to encrypt your network traffic, those headers must still
    travel across the network know where to deliver the packet. This is like protecting
    your privacy by sealing it inside an envelope—the envelope reveals the anonymity
    and return address. That means even in the case of encrypted traffic, while someone
    snooping on the network may not know what you are saying, they know who you are
    talking to. Also, since you are assigned a public IP address, they can trace that
    IP address to find where you are and who you are, too.


    Tor (https://torproject.org) is a network service that protects your anonymity
    not only by encrypting your traffic, but by routing it through a series of intermediary
    servers to make sure no particular server can know the source and destination
    of any traffic. Its name was originally derived from anonymity for the Onion Router
    (TOR), but these days it is just referred to as Tor. Because it''s a network service,
    it works with most network protocols by acting as a proxy for you. Servers with
    which you communicate on the network only traffic is coming from a Tor server.


    # Why Use Tor?


    Outside of privacy concerns, there are many different reasons why you may want
    to be anonymous on the Internet. Even if you hide the contents of your Internet
    traffic, source and destination IP data can be quite revealing. Here are a couple
    of examples in which knowing the source and destination IPs and ports would be
    rather revealing, if the traffic were encrypted:


    +   - An IP from a customer of a regional ISP connects to port 443 (HTTPS) parenthood.com
    and 20 minutes later connects to the website of an abortion clinic that is geographically
    close to the source IP.'
  merge: -1
