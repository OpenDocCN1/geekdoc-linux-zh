    # PostgreSQL


    Postgres offers a number of functions to encrypt data. They recommend the PGP-based
    encryption over the other options as the most secure and functional. There are
    two main groups of encryption and decryption functions. The first set of functions
    is pgp_sym_encrypt and pgp_sym_decrypt, which uses symmetric encryption so you
    can use a passphrase as a key. The second approach uses a PGP public key cryptography
    with the pgp_pub_encrypt and pgp_pub_decrypt functions.


    ```

    pgp_sym_encrypt(''text'', ''My secret passphrase'')

    ```


    This function asumes the first argument is text. If you want to encrypt byte input,
    pgp_sym_encrypt_bytea instead. To decrypt the syntax is the same:


    ```

    pgp_sym_decrypt(someencrypteddata, ''My secret passphrase'')

    ```


    This function will return text output. If you want byte output instead, use pgp_sym_decrypt_bytea.


    In the case of PGP public key cryptography, the syntax is similar; the only difference
    is that, like with PGP public key cryptography, in general, use the public key
    for encrypting and the private key for decrypting. To perform the same encryption
    and decryption as previously, you would use


    ```

    pgp_pub_encrypt(''text'', myPUBLICpgpkey)

    ```


    and to decrypt, use


    ```

    pgp_pub_decrypt(someencrypteddata, mySECRETpgpkey)

    ```'
