    # Defense In Depth


    The idea behind the principle of defense in depth is to not rely on any one type
    of defense for protection, but instead build layers of defenses. When you rely
    on one line of defense, is compromised, that defense is left unprotected. Defense
    in depth and castle metaphors go hand in hand. Castles didn''t just rely on a
    single, strong wall for protection but often would add a moat around the outside,
    a second interior wall, and a keep within the castle to which could retreat if
    the outside walls were breached.


    As compared to computer security, defense in depth means you don''t buy an expensive
    firewall for your network and call security done. These days, the entire network
    should be treated as potentially hostile, each layer of your network traffic from
    other networks, and each server should have its own local software firewall rules.
    SSH keys should be used to log into machines and they should be password protected.
    Transport Layer Security (TLS), a method to protect network traffic by encrypting
    it and authenticating the server to the client using certificates) be used to
    protect network traffic not just from the outside world, but also within the internal
    network. In general, any individual protection you might put in could be defeated
    one day, and add additional layers of defense so that you aren''t completely unprotected
    if one layer breaks.


    # Keep It Simple


    Complexity is the enemy of security. The more complex the system, the more difficult
    it is for someone to understand how everything works and fits together and the
    more difficult it is to secure. A network diagram shows data flowing in straight
    lines down a mesh is much easier to understand and that one looks like a bowl
    of pasta. Access control lists (ACLs; i.e., a list of users, groups, or roles
    along specific permissions they have) can be a very powerful way to restrict access
    to services, but they also tend to get overly complicated. And when they do, mistakes
    in granting ACL privileges can lead to exposing a service to users who shouldn''t
    see it accidentally.


    Complex systems can eventually overwhelm someone who tries to secure them such
    that they throw their hands and grant more broad permissions on something than
    they would otherwise. Also, some more complex security measures venture a little
    too to secure by obscurity—by making the system hard to understand, the hope is
    that an attacker won''t be able to figure it out. With simple security measures
    and simple systems, you can think through all the different attack scenarios more
    easily, discover weaknesses in your designs, and detect breaches or mistakes more
    quickly.'
