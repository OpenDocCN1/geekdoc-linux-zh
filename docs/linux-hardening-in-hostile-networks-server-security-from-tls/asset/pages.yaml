    He0V0hmWkXWKW5sCA0nInVafD0wJ221md64aCA5CA35DRQ/N8RHCI1043KS/\nOrPWlR0068SBJ2AeEYX5QZ/QmY1MI2AE8+4K0zdzr9bWRtx5ptM5F8\n\
    rQVvcQ23PyQJ3YmDIXsYYYIFPGN/9EQNIzmszbhnogs/\nUv8PmFteDePecgal23YnOutYnRoS7W65ISPGN3vITHVNVI20ttH1Exgz548RVWIDAQAB?\n\
    ```\n\nNote that the preceding example shows the long key (the value p=) into\
    \ multiple parts, so when you combine them you get rid of any spaces in between.\n\
    \ you update DKIM, check your log file for any syntax errors before you move\n\
    \n# Test OpenDKIM\n\nNow that the configuration is in place and DNS records have\
    \ been added, restart the opendkim service and look through your system logs for\
    \ any errors:\n\n```\nsudo service opendkim restart\n```"
