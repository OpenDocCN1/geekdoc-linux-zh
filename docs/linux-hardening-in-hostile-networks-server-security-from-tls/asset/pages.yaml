    server you would need to change this to some other port. The Exitpolicy is important
    because it dictates whether we are acting as an exit relay or not. By setting
    this to reject ** we do not allow any traffic through this relay. The Nickname
    option lets you set some name to your node so that clients don''t have to refer
    to it by hash. Finally, the ContactInfo should be a valid email address...


