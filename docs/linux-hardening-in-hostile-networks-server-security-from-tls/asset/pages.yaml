  md: '# Section 2: HTTPS


    Once you add the valid paths to your certificate and append the rest of your virtual
    host configuration to this section, you are ready to restart Nginx.


    > > Warning

    When you restart either Apache or Nginx, watch out for any errors from the server
    that suggest file permissions are too permissive on the key, the server can''t
    find a file, or port 443 is already being used by another service. You may have
    made a mistake in the configuration, and if that''s the case, the web server may
    not start at all. You may want to consider the configuration options test both
    Apache and Nginx to provide the configuration before you restart.


    Once your web server is restarted, you should be able to see that it is listening
    on port 443 using the netstat utility:


    ```

    $ netstat -lnpt | grep 443

    tcp 0 0 0.0.0.0:443 0.0.0.0:* LISTEN 29561/nginx

    ```


    Now you should be able to browse to https://yourdomain, see the lock icon in the
    browser, and click on to retrieve information about your certificate. Alternatively,
    you can use OpenSSL''s s_client tool to test your site:


    ```

    $ openssl s_client -connect example.com:443

    ```


    You can also use this method to use HTTP commands into HTTPS sites for troubleshooting
    purposes you just like you could use telnet or nc in the past with HTTP sites.


    # Redirect HTTP to HTTPS


    Once you have HTTPS working on a site, you may want to automatically redirect
    visitors from HTTP to HTTPS to take advantage of the more secure connection. Since
    browsers default to HTTP, and most visitors likely aren''t typing https:// in
    front of any URLs they use, configuring an HTTP to HTTPS redirect makes it easy
    for users to use HTTPS without requiring them to do anything.


    In Apache and Nginx, you can add the redirect to the HTTP virtual host settings
    on port 80, not the port 443 virtual host settings. For instance, a generic Apache
    virtual host like the following:


    ```

    <VirtualHost *:80>

    ServerName www.example.com

    DocumentRoot /var/www/html

    </VirtualHost>

    ```


    To redirect, you would add the Redirect option to the bottom of the configuration,
    like so:


    ```

    <VirtualHost *:80>

    ServerName www.example.com

    DocumentRoot /var/www/html

    Redirect permanent / https://www.example.com/

    </VirtualHost>

    ```'
