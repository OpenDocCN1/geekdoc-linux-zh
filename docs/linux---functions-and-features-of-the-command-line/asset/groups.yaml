    \n## 创建你自己的键盘记录器\n\n我们将查看的第一是如何创建你自己的键盘记录器（keylogger）。在 Linux 编码语言中学习键盘记录器是一项非常有用的技能，它可以跟踪用户一整天进行的所有按键操作。这是获取用户在白天输入的密码和用户名的有效方法，这样你可以进入某些你不该进入的网站。\n\
