    当你使用此代码来查找与你的目标计算机对应的 PID 时，你应该能注意到它对应于 `schhost.exe` 进程。由于你应该将其用作活动桌面权限进程，因此你已经准备就绪了。如果你还没有该进程的权限，你可能需要多做一些工作，但这应该能让你获得所需的权限。现在你应该通过输入以下语法来激活
