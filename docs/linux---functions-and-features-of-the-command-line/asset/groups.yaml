    # 尝试 Linux 系统


    当你习惯了使用 Mac 或 Windows 操作系统时，可能会对如何开始使用 Linux感到有些困惑。这个系统用起来非常简单，但你会发现它的工作方式与其他编程语言略有不同。例如，你会被要求使用命令行提示符来执行你在
    Linux 中想要进行的所有操作，而不是点击电脑屏幕上的某个小图标。总的来说，这会让系统上的东西更容易查找，但确实需要一些时间来适应这种工作方式。


    熟悉 Linux 编程的一个好方法就是尝试去使用它。本章将花费一些时间学习如何使用 Linux 系统，并教你一些通过命令行提示符可以完成的基础操作，以便你理解并熟悉在
    Linux 上需要执行的工作。


    # 启动系统


    当你刚开始时，你需要启动 Linux 操作系统。你需要以 root 身份登录，这意味着你是管理员，是该系统上的主电脑（超级用户账户）。如果你不是 root
    用户，在运行这些命令时将会遇到困难。但由于你很可能是这种形式 Linux 的唯一使用者，所以你应该已经是 root 用户了。Linux 系统启动后，只需在命令行提示符中输入命令
    `bt > startx` 即可。


    从这里开始，你能够打开用于这种编程语言的终端之一。你需要理解终端的工作原理，因为你会在 Linux 程序中频繁使用它。你可以以许多不同的方式使用它，虽然它与你在
    Mac 和 Windows 操作系统上的发现相似，但它有自己独特的部分，这些部分真的能帮助 Linux 成为最好的系统之一。


    # 打开你的终端


    一旦到达这一步，就是时候打开你将在 Linux 中使用的终端了。你应该通过找到屏幕底部的终端图标来实现。当你看到面前出现一个闪烁的光标时，你就知道已经打开了终端；屏幕上应该还会显示几个选项。如果你用过
    Windows 里的命令行提示符，将其进行对比是一个很好的方法。


    使用 Linux 时需要记住的一点是它是**区分大小写**的。这意味着当你编写在该语言中要使用的命令时，需要留意你使用的大写字母和小写字母。如果你不正确使用它们，就会误导程序并导致一些麻烦。请确保正确使用大写和小写字母以获得结果。


    # 检查你的目录


    一旦终端打开并准备好使用，就可以进行一些探索，并学习更多关于可以使用该系统进行的基础知识了。有时你可能会对这个程序如何工作以及你将如何在 Linux 系统上操作感到有些迷茫，但你很快就能掌握它的。把它想象成其他操作系统中找到的物理驱动器，与其操作像
    `c:\` 这样的选项，不如说你将操作 `/`。


    正斜杠 `/` 非常重要，因为它代表根目录，它是你所有系统顶层的文件。你所有的目录和文件都会位于之下。这只是一个文件夹，但它将开启你在 Linux 系统内部创建并可能随着时间使用的其他文件夹。如果你不确定它是如何工作的，可以花几分钟创建一些目录，看看它们是如何出现在系统根目录下的。


    Linux 系统将以类似于图形化表示的形式设置，基本上像一棵树，根文件位于顶部，然后所有文件、目录等像树枝一样延伸在它下方。在处理这些图形化表示时，你应该理解的内容包括：


    - `/bin`: 这是系统存储所有二进制文件的目录。这些程序是 Linux 能够正常运行所必需的。

    - `/etc`: 这是放置所有配置文件的目录。当你处于 Linux 程序中时，你会发现大多数文本文件也会通过这些文件进行配置。

    - `/dev`: 这是存储设备文件的目录。这类似于在其他操作系统中找到设备驱动程序。

    - `/var`: 这是你在 Linux 系统内部找到日志文件以及其他一些选项的目录。


    # 学习如何使用 pwd


    我们需要花时间的另一个事情是 `pwd`。当你在 Linux 系统上打开终端时，你会发现自己处于默认目录或家目录。你可以在终端打开时通过输入 `bt > pwd`
    来确认你所在的目录。在这种情况下，PWD 代表代表“当前工作目录”（present working directory）。


    如果你现在正在使用主终端，你应该能得到 `/root` 的返回，因为这是你当时所在的目录。如果你在使用此代码时处于另一个目录，你会得到一个不同的结果来告诉你你是谁。这是跟踪你在
    Linux 上位置并确保你处于正确位置的好方法。


    # whoami 命令


    下一个需要学习的有用命令是 `whoami`。每你想知道是谁登录了系统时，这个命令都很有帮助。如果系统中有两个或多个用户，你还需要检查他们在系统中的身份。如果你是整个系统的管理员，这是一个非常值得学习的命令，因为它让你在想做的事情上拥有很大的自由。


    为了简单起见，我们将确定我们是以哪个用户身份登录的。代码只需要你输入 `bt > whoami`。代码将弹出你登录的用户名，如果你是网络上的唯一用户，你应该只会看到
    root，这是系统对你电脑的定义。如果你发现名称与 root（你的主电脑）不同，那么你就知道其他人正在使用系统，你应该检查他们是否有权限留在那里。


    如你所见，这些只是你可以在 Linux 系统上学习使用的不同命令中的几个。它们可能不是最强大的，无法在系统中做很多事情，但它们非常适合你去尝试并熟悉终端的工作原理，以及编写一些代码的感觉。


    '
