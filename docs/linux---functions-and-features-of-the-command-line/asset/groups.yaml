    to use with Linux. You should be able to do this by finding the terminal icon
    that is at the bottom of your screen. You know that you have opened up the terminal
    when a blinking cursor is open in front of you; there should also be a few options
    available on the screen as well. A good way to compare this is with the command
    prompt inside of Windows if you have used this.


    One thing that you are able to remember when using Linux is that it is case sensitive.
    This means that you are writing out the commands that you want to use within this
    language, you will need to keep track of the uppercase and the lowercase letters
    that you use. If you don''t use them in the proper way, you are going to confuse
    the program and could end up with some trouble. Make sure that you are using the
    upper case and the lower case letters properly to see the results.


    # Examine Your Directory


    Once the terminal is open and ready to use, it is time for you to do some exploring
    and learn a bit more about the basics that you are able to do with this system.
    There are times when you may feel a little lost with how this program is going
    to work and how you will work out with the Linux system, but you will get the
    hang of it in no time. Think of this like the physical drive that you find in
    the other operating systems, instead of working with the options like c:\ you
    are going to be working with /.


    The forward slash is important because it is going to represent the root, which
    is the file that is at the top of all your systems. All of your directories and
    files are going to fall beneath this. This is just one folder, but it is going
    to open up to all of the others that you create and possibly use over time, inside
    of the Linux system. If you are uncertain about how this works, take a few moments
    to create some of your directories and see how it is going to turn up your system
    under the root folder.


    The Linux system is going to be set up like a graphical representation, basically
    looking like a tree with the root file being on the top and then all the files,
    directories, and so on falling underneath it like a tree branching out. Some of
    the things that you should understand when working with these graphical representations
    include:


    - /bin: This is the directory where the system will store all of your binaries.
    These are the programs that need to be present so that Linux is able to run properly.

    - /etc: This is the directory where all of your configuration files will be placed.
    When you are on the Linux program, you will find that most of your text files
    are going to be configured as well under these files.

    - /dev: This is going to be the directory where your files for the devices are
    going to be stored. This is similar to the device drivers that are found on the
    other operating systems.

    - /var: This is the directory where you are able to find the log files, and a
    few other options, inside the Linux system.


    # Learning How to Use pwd


    Another thing that we need to take some time on is the pwd. When you open up your
    terminal on the Linux system, you are going to find that you are inside the default
    directory or the home directory. You will be able to confirm the directory that
    you are in when the terminal opens by bt > pwd. In this case, the PWD is going
    to stand for “present working directory”.


    If you are using the main terminal right now, you should be able to get a return
    of /root since this is the directory that you are in at that moment. If you are
    in another directory when you use this code, you will get a different result to
    tell you who you are. This is a great way to keep track of your location on Linux
    and to make sure that you are in.


    # Whoami Command


    The next useful command to learn is the whoami command. This command is helpful
