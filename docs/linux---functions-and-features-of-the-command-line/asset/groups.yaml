    但如果你在搜索文档时已经到达底部，却仍然找不到想要的内容，会发生什么？使用该语法对你没太大帮助。更好的解决方案是使用命令：


    ```

    /:filename

    ```


    使用这个命令，光标将从你的当前位置开始向文档上方移动，这样你就可以反复来回查找你想要找到的不同关键词，无论你当前的位置在何处。


    ## 退出并保存更改


    一旦你完成了浏览并进行了你所需要的编辑，现在是时候打开文件并保存你在 Vim 系统中使用的文件了。我们已经花了一些时间从命令行打开了文件，现在我们将讨论当你已经在
    Vim 内部时如何打开更多文件。


    所以，当你在 Vim 程序内部需要打开文件时，只需要输入以下命令切换到另一个文件：


    ```

    :filename

    ```


    当然，你需要确保在执行此操作时不要处于插入模式，否则 Vim 程序将仅仅把该新命令输入到文档中，而不会被视为打开文件的命令。只需确保退出插入模式，然后输入命令为你设置新文件即可。在
    Vim 程序内部处理多个文件时，这就是你需要做的全部事情。


    现在是时候学习如何退出文件了。如果你打开一个文件发现它不是你想操作的文件，或者你看到文档中的更改已经完成，你可能想关闭文件。在不进行任何更改的情况下关闭文档，只需输入：


    ```

    :q

    ```


    输入此内容并按回车键让系统执行。此外，在你想要关闭程序时，有时 Vim 程序会停止工作，或者它无法按预期通过退出命令工作，而你仍然想退出程序。在这种情况下，你可能想要强制关闭
    Vim 程序。为了强制关闭程序，你只需要输入以下语法：


    ```

    :q!

    ```


    当你想要退出程序且程序不允许你执行你想操作的操作时，这就是你应该使用的命令。请记住，如果你使用了这些选项，在编辑时你的任何工作都不会被保存，除非你之前已经保存了它们。你应该始终确保在继续之前保存你正在工作的信息，否则你将丢失所有工作。


    所以，有时你可能想对文件进行更改，然后希望它为你保存，以便更改能够存在且不会丢失。为了保存你想要的文档更改，只需输入以下命令：


    ```

    :wq

    ```


    此命令的第一部分保存你对文件所做的更改，第二部分关闭你正在使用的程序。这使得当你只想进行更改并在完成后退出程序时，这是一个完美选择。


    在某些情况下，你可能想对文件进行一些更改但不想保存它们。这就是你想要了解如何使用正斜杠的时候。当你想要学会保存文件时，只需输入以下命令：


    ```

    :w!

    ```


    ## 在 Linux 中使用某些导航


    到为止，我们已经花时间研究了为了让系统运行比以前任何时候都更容易而所需的的基础导航。但本章将花费一些时间介绍在穿过系统时需要的一些更高级的内容。


    ## 查找文件和更改目录


    在本书的之前的章节中，我们讨论了如何使用 Vim 程序编辑某些文件。这是使用 Linux 的一项基本功能，它在本章中也会对你有帮助。当你初查看文件系统时，最初可能完全不知道这些文件位于哪里。例如，如果你想编辑
    php.ini，你可能甚至该去哪里寻找这个文件都感到困惑。


