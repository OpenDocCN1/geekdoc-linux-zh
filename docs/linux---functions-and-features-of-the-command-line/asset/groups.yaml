    \n所以，我们要对这段代码做的第一件事是确保它是以单词和行的形式写入的。很好的方法是设置系统，使其在行内写入字符，直到出现某种暂停。大多数情况下，你会将其设置为用户向电脑输入时开始新行，然后在输入停止二到三秒时开始新行或停顿。这样你就能看到获取的信息是以句子和段落的形式输入的，而不是随机的字符。\n\
