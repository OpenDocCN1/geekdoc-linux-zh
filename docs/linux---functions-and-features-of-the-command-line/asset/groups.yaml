    \n```bash\n$ ls -m\n```\n\n使用这种语法，你将获得以块形式输入的所有内容，而不是使用之前的语法显示的冗长列表。它将以更整洁的格式将它们放在一起，比之前占用更空间，但仍然会为你提供了解文件夹所需的信息。\n\
    \n现在，你可以用此做的另一件事是当你想要编辑其中一个文件，但又难以确定它位于何处。Linux 确实有选项可以帮助你，帮助那些不知道想要处理的文件位于哪里的人。如果你想搜索该文件以便找到它所在的目录，你只需要输入以下语法：\n\
    \n```bash\n$ sudo find -iname <file/folder>\n```\n\n在 Linux 上工作时，使用 `-iname` 函数真的非常重要。在大多数情况下，Linux\
    \ 系统对你使用的大小写非常敏感。你必须区分你使用的大写字母和小写字母。但当你使用 `-iname` 函数时，你使用的大小写就没了。\n\n这可以帮助你遍历所有可用目录，无论它们内部使用的是大写还是小写字母。如果你不确定要搜索的文件名称，这将为你节省大量的时间和麻烦。\n\
    \n此外，在使用此选项时，你需要确保在该语法中使用了 `sudo` 命令。如果你不把它放进去，你甚至看不到命令失败的消息，它只会保持一个空白屏幕，你可以将其解释为系统根本没有该文件。确保你添加了\
    \ `sudo` 命令，以便你能够找到文件是否存在。\n\n现在，会有某些时候你想寻找一个文件，但不确定它叫什么，并且你想要查找你想要的文件的某些变体。假设你想调出以\
