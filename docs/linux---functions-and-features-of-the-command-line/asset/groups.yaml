    Linux 版本（因为它非常容易上手），因此我们将使用它来演示命令。许多其他 Linux 版本也相似，因此更改命令以适应你的版本应该非常简单。


    你对 Linux 需要理解的首要要点之一是：你无法通过点击图标来运行程序。相反，你需要调出命令提示符并输入你想使用的内容。记住，Linux 系统是由程序员设计的，因此你使用
    Linux 时的界面将类似于编写代码。虽然这与直接点击你想要的图形相比可能显得有些乏味，但它对于你学习如何对 Linux 进行一些严肃的管理工作将非常有帮助。


    你使用哪个版本的 Linux 系统并不重要。服务器版本还是桌面版本，都需要你使用命令行或终端（terminal）来完成许多任务。在桌面版本中，你只需要打开终端屏幕，然后输入你想让系统使用的命令即可。如果你通常使用
    Windows 或 Mac 作为操作系统，可能需要一点时间来适应，总体来说，你会发现它让你对整个系统拥有更多的权力和控制力。


    # Sudo


    现在是时候学习一些我们在 Linux 中需要的命令了。第一个要学习的命令是 `sudo`。它基本上代表“super user do”（超级用户执行），首先让我们来看看这背后是如何产生的背景知识。


    在 Linux 创建时，负责它的程序员们担心安全问题。在所有的 Linux 计算机内部，有一个用户被称为 Root。这是计算机的最高级别，类似于你在 Windows
    计算机上找到的管理员。就像那些程序一样，如果有人在 Linux 上以 root 身份登录，他们可以在计算机上做他们想做的任何事情。有时这是好事，但世界上有这么多黑客，这也意味着间谍软件、病毒和恶意软件可能被下载到另一台计算机上。


    为了避免黑客获取不属于他们的计算机 Root 权限而导致某些问题，Linux 的创建者决定没有人能够以 Root 身份登录，即使是他们自己的系统。但这确实产生了一个小问题：如果你无法以
    root 身份登录，你如何作为管理员工作呢？


    这就是 `sudo` 命令发挥作用的地方。它告诉操作系统你正试图以超级用户或 root 的身份运行命令或进程。这赋予了你一些管理员权限，以便你在 Linux
    中执行你想运行的命令。这基本上就是“以管理员身份运行”选项，让你能够运行你想要的程序。


    # Man Pages（手册页）


    在 Linux 中，学习如何使用 `sudo` 命令很重要，但我们还需要讨论一些你应该知道的其他选项。Man pages（或 manual pages）是你可以在
    Linux 内部学习使用的另一个重要工具。这就像是 Linux 系统的字典，如果你不知道想使用哪一个命令，或者想学习某个特定命令是如何工作的，你可以使用 man
    pages 来了解所有这些。


    例如，如果你对查找“ping”命令的信息感兴趣，你可以在 man pages 下查找你想要的内容。使用 man pages 查找所需信息的基本语法包括：


    $ man ping


    这个命令将帮助你获取关于“ping”命令的所需信息，以便你能够学习如何使用它。如果你是 Linux 的初新手，且不确定命令在程序内部将如何工作，或者在某些点应该做什么，那么这个命令就特别有用。


    在大多数情况下，如果你可以访问互联网，可以通过简单的 Google 搜索完成同样的事情。但如果网络断了或你不想翻遍所有的在线页面，这可以是一个很好用的的命令。


    当你从 man pages 中获取完所需信息后，你需要执行特定操作才能退出。使用退格键（Backspace）或回车键（Enter）无法得到想要的结果。相反，你需要输入字母“Q”，告诉计算机你想退出程序。你将回到系统主界面，并输入你想使用的另一个命令。


    # Tasksel


    列表中的下一个是讨论 `tasksel` 命令。这基本上是“task select”（任务选择）的命令。当你想要下载一个可能包含几个不同部分的程序时，这个命令将非常有帮助。假设你想在系统上下载一个新的电子邮件服务器；你你会发现你需要下载几个不同的部分以确保它的正常工作。


    为了让操作更简单，Linux 的创建者设计了许多供选择的安装包。当你选择其中一个包时，你将运行 `tasksel` 命令，你会被带到一个列出所有这些包的屏幕。例如，如果你想让你正在使用的服务器变成电子邮件服务器，你只需要选择“Email
    Server”按钮，然后它就会安装你想要软件的所有部分。这将使安装你想要的程序变得容易得多。它是用户友好的、简单的且功能强大的。如果你想下载 Apache
    Web 服务器，这个 tasksel 选项将在 30 分钟内为你完成一切。需要记住点是，你需要在它前面加上 `sudo` 命令来满足你的需求。调出 tasksel
    命令的常用语法包括：


    $ sudo tasksel


    然后你只需按回，系统就会带你进入列表，你可以从中挑选想要下载的内容。只需选择你想要的，点击，然后继续将其放置到你的服务器上。


    # Apt-get


    我们上面执行的命令是一次性下载很多程序。这些程序都是相互关联的，但它们体积很大，你需要一起下载它们以确保程序能以你想要的方式运行。但当你只想在系统中下载单个程序时，你该怎么办呢？你将使用
    `apt-get` 命令来完成。


    使用 Linux 的一个好处处是，你想要添加到服务器的大多数软件都是免费的。为了完成这项工作，你可能需要签署一些服务协议等，但它不需要其他操作系统那样的激活程序。相反，Linux
    不进行这些激活，而是将其存放在仓库（repositories）中。这些基本上是存放所有可用 Linux 程序的地方。你只需要联网并


