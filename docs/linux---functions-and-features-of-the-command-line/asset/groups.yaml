    \n```bash\n$ sudo mkdir <name of directory/folder>\n```\n\n关于这一点需要记住的一点是，如果不包含目录的完整路径，命令将在你当前所在的目录中创建该目录。如果你想去其他地方，你需要确保包含完整的目录路径以获取它。\n\
