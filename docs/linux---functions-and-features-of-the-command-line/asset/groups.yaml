    Linux 操作系统以你喜欢的方式运行而需要尝试的一些基础命令。


    ## 在 Linux 中导航


    现在你已经学会了我们在上一章中学习过的一些基础命令，现在是时候学习如何在 Linux 内部的文件夹之间进行导航了。这与你习惯的某些操作系统可能有些不同。记住，我们之前提到过，在
    Mac 和 Windows 等操作系统中，你可以直接点击想要使用的图标，而在 Linux 中，你需要调出命令提示符并输入你想执行的命令。


    这与你操作 Linux 系统时发生的情况类似。它看起来和你在 Windows 中看到的内容有点像，但有些差异在起初看起来会令人困惑，实际上这些差异有助于事情变得更容易整合，并保持更好的整洁性。


    当你查看 Linux 系统时，你会发现一切都是从根目录（root）函数开始的。记住，这基本上就是你程序中的管理员，你根据你存储东西的地方，在这里可以找到所有树形结构的起点。从这里，你可以将文档、文件等保存到计算机中，树结构就会开始形成。


    让我们这样来看：你进入根目录，然后查看那里的起始。你可以拥有“文档”（Documents）、“图片”（Pictures）、“视频”（Videos）之类的选项（你可以根据制作的内容对它们重命名，但我们现在这样做使用它们）。在“文档”内部，你可能还有需要的其他文件，以及进一步分支的文件夹等。在某些其他操作系统中，这一切可能看起来都有些复杂，但当你回到
    Linux 的根目录时，你就能看到所有的分支通向何处。


    这是存储想要使用的文件的更好方法，并确保你能找到所有东西的位置。虽然它看起来和你在 Windows 计算机上找到的东西有点，但它们的工作方式不同，Linux
    系统操作起来更容易，而且存储数据时效率更高。


    ## 使用 Vim 编辑 Linux 文件


    现在你已经理解了在 Linux 中导航将用文件的一些基础知识，是时候对文件内部进行一些编辑了。在 Linux 系统上，你需要处理配置文件。如果你希望你的软件以特定方式运行（例如进行自定义），你就需要打开一个文件并对其进行实际编辑。无论你是在处理
    `.php` 还是 `.ini` 文件都是如此。几乎所有的内置配置都以简单文本文件的形式存储，你可以通过编辑它来达到你想要的效果。


    现在，你可以选择几个与配置文件配合良好的不同编辑器。对于这一个，我们将讨论 Vim 程序，它通常被认为是 Linux 下你可以使用的最强大的编辑器之一。


    当你从 Windows 系统切换到 Linux 时，应该记住的一点是，你将找不到文件关联。在 Windows 系统内部，你会注意到文件后面有一些扩展名。例如，Word
    会根据你正在使用的版本将文件保存为 `.doc` 或 `.docx`，图片可以是 `.jpeg` 等。这些文件扩展名将帮助程序判断应该如何打开该文件。但当你操作
    Linux 系统时，你找不到这些文件关联，因为系统期望你了解文件内部的内容。


    ## 启动 Vim


    我们将使用 Vim 程序开始处理文件，以完成你想做的编辑。这对你来说很容易上手，但我们首先需要准备好正确的命令以便你打开程序。如果你已经在计算机上安装了该程序，只需从
    `sudo` 命令开始，后面跟着一个空格和单词 `vim` 即可。需要的语法包括：


    ```

    sudo vim <filename>

    ```


    记住，在语法中你需要保持 `vim` 单词全小写。这很重要，因为 Linux 系统会区分大写和小写字母的区别，所以你需要使用小写以确保系统知道你正在操作什么。在输入想要编辑的文件名时，也要注意大小写；你必须写得完全一致，否则系统将找不到它。


    这就是为了用 Vim 程序打开想要编辑的文件而需要执行的所有操作。但你也可以使用这种语法来完成其他事情。当你使用上述完全相同的语法时，你可以创建一些新文件。要查看它是如何运作的，你需要打开命令提示符，然后将上面的命令放在里面。你可以为你想要创建的文件命名，然后它就会打开供你使用。如果你对打开一个新文件供你尝试进行一些新更改感到困惑，请记住这一点。


    对于某些使用过 Linux 变体的人，你可能知道在执行 `vim` 命令时可以根据需要去掉 `sudo` 命令。这确实可行，但对于 Ubuntu 发行版，你会发现无论你是否带有
    `sudo` 命令，这都可能导致你想打开的文件出现一些问题。其他时候，如果缺少 `sudo` 命令，你会发现程序无法打开。至少对于 Ubuntu 发行版，你应该始终确保
    `sudo` 命令就绪。


    ## 修改文件所有权


    在该系统内部你可以执行的另一个任务是更改所有权。为了理解它是如何运作的，让我们考虑计算机上的程序。当你在 Linux 系统上安装新软件时，所有权对于大多数将
    Linux 作为个人操作系统使用的人来说并不是大问题，但可能会引发一些问题。


    当你在 Linux 内部工作时，除非你是文件的所有者，否则你无法对文件进行更改。当你处理你拥有的程序时，这会导致一些问题。例如，如果你向系统下载了 PHP
    或 MySQL，你会发现所有者不是你。如果你想对这些程序进行一些编辑，这是可能的，因为你不是所有者。


    所以，如果你想对配置文件进行一些编辑，你首先需要将所有权更改为你自己，以便更方便。实现这一点的语法包括：


    ```

    $ sudo chown <username> <filename>

    ```

