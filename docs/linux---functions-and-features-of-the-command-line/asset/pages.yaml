- pgno: 12
  md: '# Some Basic Commands with Linux


    Before we get too much into some of the more advanced things that Linux is able
    to do on your system, let''s take some time to look at a few of the basics that
    come with Linux so that you are able to at least get started with the basics of
    this operating system.


    For the commands that we will discuss here, we will be using the Ubuntu version
    of Linux. As mentioned above, there are a few different options that you can pick
    from choosing the Linux system that you would like to work with, but since this
    is the most common form of Linux that beginners will use because it is so easy
    to work with, it is the one that we will use with commands. Many of the other
    versions of Linux are similar so changing out the commands to work with your version
    should be pretty easy.


    One of the first things that you should understand with Linux is that you will
    not be able to click on icons in order to get things to come up. You will instead
    need to bring up the command prompt and type in what you would like to use. Remember
    that the Linux system is designed by programmers, so the interface that you will
    be using Linux will be similar to writing codes. While this may seem a bit tedious
    compared to just clicking on the graphics that you want, it is going to be helpful
    teaching you how to do some of the serious administration that you want to do
    with Linux as.


    It does not matter which version of the Linux system that you are using. The server
    version, as well as the desktop version, is going to require you to use the command
    line or the terminal to get a lot of tasks done. In the desktop version, you will
    just need to open your terminal screen and then type out the commands that you
    want system to use. It takes a little bit of time to get used when you usually
    use Windows or Mac for your operating system, overall, you will find that it gives
    you a lot more power and control over your whole system.


    # Sudo


    Now it is time to get into some of the commands that we need to do with Linux.
    The first command to learn is into the "sudo" command. This basically stands for
    "super user do" and first let''s look at a little bit of the background of how
    this all come about.


    When Linux was being created, the programmers in charge of it were worried about
    the security. Inside of all the Linux computers, there is a user that is known
    as Root. This is the highest level on the computer, kind of like the administrator
    that you would find on a Windows computer and just like with those programs, if
    someone logged in the root on Linux, they would be able to do anything that they
    would like to on that computer. Sometimes this is good, but with so many hackers
    in the world, it could also mean that spyware, viruses, and malware could all
    be downloaded on another computer as well.


    To help avoid some of the issues that could happen from a hacker getting the root
    access'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'to a computer that wasn’t theirs, the Linux creators decided that no one was
    able to log in as the Root, even if it is their own system. But this does create
    a bit of a problem. If you aren''t able to log in as your root, how are you going
    to be able to work as the administrator then?


    This is where the sudo command came into effect. This tells the operating system
    that you are looking to run a command or a process as the super user or the root.
    This gives you a little bit of administrative access so that you can execute the
    commands that you want in Linux. This is basically the “Run as Administrator”
    option so that you are able to run the programs that you want.


    # Man Pages


    Learning how to use the sudo command is important in Linux, but we also need to
    talk about some of the other options that you should know. Man pages, or manual
    pages, are another important thing that you can learn to use inside of Linux.
    This is like the dictionary of the Linux system if you don''t know which of the
    commands you would like to use or you want to learn a particular command works,
    you can use the man pages to learn all about this.


    For example, if you are interested in looking up information about the “ping”
    command, you will be able to look under the man pages to find out what you would
    like. The basic syntax that you will use in order to use the man pages and look
    up the information that you need includes:


    $ ping


    This one will help you get the information that you want about the “ping” command
    so you can learn how to use it. This command is particularly useful if you are
    brand new to using Linux and you are uncertain about how the commands are going
    to work inside the program or what you should doing at certain points.


    For the most part, if you have internet access, you will be able to do the same
    thing with a simple Google search. But if the internet is down or you don’t want
    to go through and look through all pages online, this can be a good command to
    learn to use.


    After you are done getting the information that you want out of the man pages,
    you will need to do something specific to get out of it. Using the Backspace or
    the Enter button is not going to get you the results that you want. Instead, you
    will need to type in the letter “Q” to tell the computer that you want to get
    out of the program. You will then be back at the main page of your system and
    can put in another command that you would like to use.


    # Tasksel'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Next on the list is to discuss the command tasksel. This is basically the command
    for “task select”. This one is going to be helpful when you want to download a
    program that may have a few different parts inside it. Let''s say that you want
    to download a new email server over your system; you will notice that you will
    need to download a few different parts to ensure that you are getting everything
    to work together. You really want to go through and connect each one them, causing
    a big mess and then adding work because you have to add all in together


    To make things easier, the creators of Linux designed up to 20 installation packages
    that you can choose from to make things easier to work with. When you pick one
    of these packages, you will run the tasksel command, and you will be sent to a
    screen where all of these packages are listed. For example, if you would like
    to make the server you are using into an email server, you will just need to select
    the Email Server button in that area and then it will install all of parts of
    the software that you want for that type of


    This is going to make it a whole lot easier to install the programs that you want
    inside of your programs. It is user-friendly, easy, and so much more. If you want
    to download the Apache web server, this tasksel option is going to have all done
    for you within 30 minutes. The important thing to remember is that you will need
    to put the “sudo” command in front of it to get this work out for your needs.
    A good syntax that you are able to use to bring up the tasksel command includes:


    $ sudo tasksel


    Then you can just press ENTER, and the system will take you to the list of options
    that you are able to pick out the things that you would like to download onto
    the server. Just pick the one that you want, click on it, and then continue on
    so that it can get placed onto your server.


    # Apt-get


    The command that we did above was to download a lot of programs all at once. These
    programs are all going to be connected, but they are big and you will need to
    download them all together to ensure that the program is going to work the way
    that you want. But what are you going to do when you want to get just a single
    program to download on your system? You are going to use the apt-get command to
    get this done.


    The nice thing about using Linux is that most of the software that you will want
    to add to your server will be free. You may have to do some service agreements
    and stuff to get this work, but it is not going to require the activation procedures
    you need with the other operating systems. Instead of doing all these activation,
    Linux is going to place on repositories. These are basically places that will
    house all the programs that are available for Linux. You can just get online and'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'download all of the Linux programs that you want to use.


    Within your computer, there is a configuration file that will tell the computer
    where these repositories are located. You will then be able to use the apt-get
    command in order to go out and find that repository and get the program that you
    want. The syntax that you will be able to use in order to send the computer out
    to find the program that you want to use includes:


    ```

    $ sudo apt-get install <name of program>

    ```


    Just hit enter and the computer will go out and find whichever program that you
    are looking at the time. The computer can then download this for you, and you
    can do this step as many times as you would like in order to get the programs
    onto your computer as you would like.


    Now you have used the program for some time and you decide that you no longer
    want to use it. Perhaps the program is not working the way that you would like,
    or you are done with using it and don''t want to take up too much space on your
    computer. You will then be able to take the program off your computer by using
    the simple syntax


    ```

    $ sudo apt-get remove <name of program>

    ```


    When you type this into your program, you will find that whatever you want to
    get rid of is going to be uninstalled. You will need to give it some time to get
    off the computer, but this simple command is going to tell the computer that you
    want to get rid of that particular app and it will slowly start to take it away
    for you.


    For the most part, this is going to work for most of the programs that you want
    to add into your system. This can make it easy to get the things into the system
    that you want and can ensure that you''re not going to pay for any of the ones
    that you want. You may want to look through the repositories to see how many of
    the programs are found in there; there are many thousands and as many are developed,
    they will be placed back in there as well.


    Learning how to work with some of the commands in this chapter will make dealing
    with Linux a bit easier than before. You are going to enjoy how easy it is to
    become the administrator within the program and how you are able to install, and
    uninstall, all the programs inside of your operating system whenever you would
    like, with most of them being free to use. These are some of the basic commands
    that you will need to try out in order to get the Linux operating system working
    the way that you like.'
  merge: -1
