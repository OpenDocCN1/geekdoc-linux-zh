  md: '# Using Some Advanced Navigation in Linux


    So far we have taken some time to look at the basic navigation that you will need
    to know in order to make the Linux system work. This is going to make it easier
    to get the files that you need and to make your way through the whole system.


    But this chapter is going to take some time to go through some of the more advanced
    things that you will need to know when it comes to making your way through the
    program. We will discuss removing directories, how to copy files, how to make
    directories, and even how to find your folders within the Linux system.


    # Finding Files and Changing Directories


    In the previous parts of this book, we talked about how you were able to edit
