  md: '# Other Things You Can Do With Your Files


    So far we have talked about a few of the things that you are able to do when working
    with your navigation inside of the Linux system. Now we are going to talk about
    some other things that you are able to include renaming files, copying, moving,
    deleting, and even making the files that you would like to use. The first one
    of these we will discuss is making the new folder. This one is pretty easy to
    do because all you will need to add to the mix is the following syntax:


    ```

    $ sudo mkdir <name of directory/folder>

    ```


    One thing to keep in mind with this is that if you don''t include the full path
    of your directory, the command is going to create that directory in the directory
    you are currently in. If you want to go somewhere else, you need to make sure
    that you include the full directory path to get it all.


    Next on the list is how to delete some of the files or folders that you are working
    with. In order to delete the files that are on your system, you will need to use
    the following syntax:


    ```

    $ sudo rm <file or folder name>

    ```


    The rm keyword is going to be for remove. You will be able to just delete whatever
    you would like off the system, making this a pretty easy one for you to work with.
    With just need to make sure that you are writing the name of the file correctly.
    First, if you write the wrong name, you could end up deleting a file that you
    really need, and now you are either in a lot of trouble because you don''t have
    it or you will need to go back and rewrite the file. Second, if you''re not watching
    out for the case sensitivity, you will find that it is difficult to get the right
    folder to go through deletion.


    During your time on Linux, there may be some times when you will want to move
    your files around. You may be doing some rearranging within the system and move
    a few of the files around a bit, or you may just have put it in the wrong place
    and want to move it right away. You will need to change it into a new file name
    to make this happen. So let''s say that you have a file1 and want to change the
    name over to file2. You would simply need to write out the syntax:


    ```

    $ sudo mv <name of old file> <name of new file>

    ```'
