- pgno: 29
  md: '# Working on Security Inside Your Linux System


    When it comes to using the Linux system, you are going to be the one who is in
    charge of making sure that the security inside of Linux is working properly. This
    can seem like a tough thing to work on, but if you are working with new codes
    or just want to keep your system or information safe and sound, it can really
    make a difference. This chapter will spend some time looking at the different
    things that you can learn to do as the administrator of the system to keep everything
    safe and protected.


    # Setting Up Passwords


    When you are creating a new account, you need to make it a point to create passwords
    that are good and more difficult to crack. The more difficult you are able to
    make the password, the harder it is going for someone else to get onto the system.
    This is especially important if you are going to be the administrator for several
    people using the network and you should explain the importance of having strong
    passwords, as well as not sharing this information with other people, in order
    to prevent issues down the road.


    One of the things that you should remember as the administrator when setting passwords
    is that the password should never be formed with the help of personal information,
    such as names and addresses. You should also stay away from words that are common
    in the dictionary. Switching back and forth between letters and numbers and even
    changing between upper case and lower case letters can make a big difference when
    you are designing a password.


    As the administrator, it is also a good idea to ask the user to change their password
    on occasion, such as every year, so that it is even harder for someone to get
    the information. You can even lock the account user out of the account if they
    fail to get the right password and username after a number of tries in order to
    prevent someone from using the brute force method to get into the account.


    # Protecting Your Files


    There are times when you will want to protect some of your files from unauthorized
    access. This means that you don''t want someone coming into the system and viewing
    and changing the files without your knowledge. In order to take care of this,
    you will need to take some time to revisit the file permissions settings.


    You will be able to pick the people on the system that you would like to use the
    files and read through them. You can choose to either them read the contents of
    the file, write to the file, or execute the file else they can do all three. When
    it comes to your personal computer and the information that is on there, you will
    only want to give these'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'permissions to yourself. But if you are working with a network, you may want
    to change it so that only the administrator is able to do all three in some cases,
    while others are only able to read the files that are there.


    Here are some of the symbols that you would use inside of Linux in order to write
    out the permissions that you would like to use on each of the files inside your
    system:


    +   - R: when this shows up, it means that the user is allowed to read the contents
    of the file.

    - W: when this shows up, it means that the user is allowed to write to the file.

    - X: when this shows up, the user is able to execute the file as long as the file
    as a bash script.


    If all three of these are found in front of the name of the user, it means that
    they are able to do all three of the tasks that are at hand. For the most part,
    that is going to be saved for the administrator of the system to work on, but
    there may be a few times when others are able to go through and make some of these
    changes as well.


    You will be able to determine who gets to do on what file based on what is in
    each file. If it is a document that everyone is allowed to work on together, you
    would probably want to open it up for all of the people on the network to read
    and to write on. If it is just something that a few people are working on, you
    could give the power to work on that to those people, and everyone else would
    maybe get to read it and nothing else. You will be able to determine how this
    works for your group.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Learning Some Basic Hacking with Linux


    One of the neat things that you will be able to do when you are working in Linux
    is some hacking. This is a strong operating system that will let you write out
    some of your own codes, and you may be interested in doing this to get more practice
    with the system or to enjoy how much you are able to do with the Linux system.
    This chapter is going to spend some time talking about the basics of hacking,
    and then we can get into some of the codes that you are able to use in order to
    create one of your first hacks.


    # Hacking: What Is It?


    Hacking is basically getting onto a system in order to expose some of the vulnerabilities
    that are on that system. This can be done in many ways, but often the hacker is
    able to get onto the computer without the other person knowing. They can send
    emails that over links that can be harmful, keep track of the screenshots and
    keystrokes that the other person is using to get their information and so much
    more. It is also important to keep your information safe whether you are working
    on your personal computer or on a big network that is responsible for keeping
    the information of other people safe.


    First, there are a few types of hackers out: white hackers and black hat hackers.
    When you hear about a hacker on the news, you most likely hear about a black hat
    hacker. These are the people who will get onto a computer or a network without
    being invited and will cause a lot of issues in the process. They may try to break
    the system down to a crawl and not let information through; they may try to steal
    personal information, and they can even do a man in the middle attack and convince
    the server that it belongs them.


    The main goal of the black hat hacker is that they want to take information that
    they shouldn''t have or the want to find the vulnerabilities and tell others where
    these are. The black hackers are often the ones who will try to steal personal
    information so that they can get money, but they may have some other motives in
    place as well.


    It is important to note that while we are discussing about hacking in this guidebook,
    black hacking is considered illegal and could land you in a lot of trouble. You
    are attempting to get into information that is personal and which you are not
    allowed to have, and the penalties for this can be quite steep.


    On the other hand, there are white hat hackers. These hackers are often going
    to use a lot of the same techniques that you would find with the black hackers.
    These are people who love to work with computers and will do so part of their
    job to help out companies and keep personal information safe. You may find them
    inside of many businesses, schools, hospitals, and so on trying to keep all that
    personal information'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'in addition, you may want to become a white hat hacker in order to preserve
    the information that is on your personal computer. Hackers are always working
    to find the vulnerabilities in the system, and as a white hat hacker, you are
    going to be working to find these vulnerabilities and close them before another
    malicious hacker is able to get into your system. This is going to take a bit
    of planning and some learning along the way, but it is one of the best ways to
    ensure that you are going to keep your computer safe and strong for a long time
    to come.


    Both of these types of hacker are going to use the same techniques, but they are
    going to have different goals. The black hackers are going to work to get into
    the system where they are not allowed so that they can take this personal information
    and use it in the way that they like. On the other hand, the white hat hackers
    are going to use these tools so that they can protect this information, whether
    it is their own or the information from the company they work for, and to keep
    the black hackers out of the way.


    The Linux system is a good one to work with because it allows you to really get
    into the programming that you need in order to make some of the backs that you
    want. It is simple enough to learn how to use and if you have some of the basics
    down for using the command prompt, you will find that it is easy to look for vulnerabilities,
    set up some of the hacks that you want, and do so much more within the same system.


    While there are a few different operating systems that you are able to use when
    it comes to the world of hacking, none of them are going to give you all the power
    and the options as you will find with the Linux system. This one is simple enough
    to learn, and you will be amazed at the different things that you are able to
    do inside it.


    The world of hacking may seem really advanced and hard to learn if you are just
    getting into the world of coding and programming languages, but you will find
    that even of the things that sound difficult in hacking are really easy to learn.
    You need to have the right motives in place to make this work, but over time,
    you will be able to do some of the hacking that you need to protect your computer
    and your network system without having to be a genius with coding and programming.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# Basic Hacking Commands


    Now that you know a few things about hacking and how you will be able to use it
    within your Linux programming, let''s take a look at some of the commands that
    you will be able to create with the help of Linux to do some hacks. These are
    going to sound a bit complex in the beginning, but it won''t take much for you
    to learn how to use the codes and get them to work for your needs.


    # Creating Your Own Keylogger


    The first thing that we are going to look at is how you will create your own keylogger.
    The keylogger can be a really useful thing to learn how to do within the Linux
    coding language allows it to keep track of all the keystrokes that the user of
    the computer is doing throughout the day. This can be a useful way to get the
    passwords and usernames that your user is putting in during the day so that you
    can get onto some of the sites that you shouldn''t be.


    There are a few things that you will need to keep track of to get this to work
    the best for you though. First, when you start out with the keylogger, you will
    want to make sure that it is printing lines of text, rather just each of the symbols
    on different lines. The most basic keylogger formula will print off each character
    that is typed on different lines, but this is going to take up a lot of space
    on your hard drive, especially if you print off a date stamp with each part. Plus
    how useful is it going to be to have each letter on a different line since you
    won''t be able to read through it.


    So the first thing that we are going to want to do with this code is to make sure
    that it is writing things out in word and lines. A good way to do this is to set
    the system so that it will continue to write out the characters on the line until
    there has been some kind of pause. For the most part, you would set it to start
    the line when the user is typing into the computer, and then have it start on
    a new line or take breaks when the typing stops for two or three seconds. Then
    you will be able to see that the information that you are getting is coming in
    line sentences and paragraphs rather than just random characters.


    Another thing you might want to add to the code is a date and time stamp. This
    can be useful because it allows you to see when the information is being put into
    the computer. If you start to see that the user is typing in the same kinds of
    words and key phrases at the same time of day, it may be to look and see if these
    are the passwords that you need to get onto certain sites.


    When this is all put together into a code in Linux, you will have something like
    the following typed out:'
  merge: -1
  img_proc: true
- pgno: 34
