- pgno: 8
  md: '# Giving the Linux System a Try


    When you are used to working with the Mac or Windows operating system, you may
    be a little confused on how to get started with the Linux program. This one is
    pretty simple to use, but you will find that it is going to work in a slightly
    different way to some of the other programming languages. For example, you are
    going to be required to use the command prompt to bring up all the things that
    you want to do in Linux, rather than being able to click on a little icon that
    is on the computer screen. Overall, this is going to make things easier to find
    on the system, but it does take some time to get used to how this is going to
    work.


    A good way to get used to the programming on Linux is to give it a try. This chapter
    is going to spend some time learning how to use the Linux system and teaching
    you some of the basic things that you are able to do with the command prompt so
    that you understand and get familiar with what you need to do on Linux.


    # Boot Up the System


    When are are first getting started, you will need to boot up the Linux operating
    system. You will need to be logged in as the root, which means that you are the
    administrator and the main computer on the system. If you are not the root computer,
    you are going to have trouble getting these commands to work. But since you are
    most likely the only one using this form of Linux, you should already be the one
    who is the root computer. The Linux system is booted up, you can just type in
    the command bt > startx into your command prompt.


    From here, you will be able to open one of the terminals that you use for this
    programming language. You need to understand how the terminal works because you
    will use this a lot within the Linux program. You will be able to use it in a
    lot of different ways, and while it is similar to what you will find on the Mac
    and the Windows operating systems, but it has its own unique parts that can really
    help to make Linux one of the best.


    # Open Your Terminal Up


    Once you are to this point, it is time to open up the terminal that you are going
    to use with Linux. You should be able to do this by finding the terminal icon
    that is at the bottom of your screen. You know that you have opened up the terminal
    when a blinking cursor is open in front of you; there should also be a few options
    available on the screen as well. A good way to compare this is with the command
    prompt inside of Windows if you have used this.'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'One thing that you are able to remember when using Linux is that it is case
    sensitive. This means that you are writing out the commands that you want to use
    within this language, you will need to keep track of the uppercase and the lowercase
    letters that you use. If you don''t use them in the proper way, you are going
    to confuse the program and could end up with some trouble. Make sure that you
    are using the upper case and the lower case letters properly to see the results.


    # Examine Your Directory


    Once the terminal is open and ready to use, it is time for you to do some exploring
    and learn a bit more about the basics that you are able to do with this system.
    There are times when you may feel a little lost with how this program is going
    to work and how you will work out with the Linux system, but you will get the
    hang of it in no time. Think of this like the physical drive that you find in
    the other operating systems, instead of working with the options like c:\ you
    are going to be working with a/


    The forward slash is important because it is going to represent the root, which
    is the file that is at the top of all your systems. All of your directories and
    files are going to fall beneath this. This is just one folder, but it is going
    to open up to all of the others that you create and possibly use over time, inside
    of the Linux system. If you are uncertain about how this works, take a few moments
    to create some of your directories and see how it is going to turn up your system
    under the root folder.


    The Linux system is going to be set up like a graphical representation, basically
    looking like a tree with the root file being on the top and then all the files,
    directories, and so on falling underneath it like a tree branching out. Some of
    the things that you should understand when working with these graphical representations
    include:


    /bin


    This is the directory where the system will store all of your binaries. These
    are the programs that need to be present so that Linux is able to run properly.


    /etc


    This is the directory where all of your configuration files will be placed. When
    you are on the Linux program, you will find that most of your text files are going
    to be configured as well under these files.


    /dev


    This is going to be the directory where your files for the devices are going to
    be stored. This is similar to the device drivers that are found on the other operating
    systems.


    /var


    This is the directory where you are able to find the log files, and a few other
    options, inside the Linux system.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Learning How to Use pwd


    Another thing that we need to take some time on is the pwd. When you open up your
    terminal on the Linux system, you are going to find that you are inside the default
    directory or the home directory. You will be able to confirm the directory that
    you are in when the terminal opens by bt > pwd. In this case, the PWD is going
    to stand for “present working directory”.


    If you are using the main terminal right now, you should be able to get a return
    of /root since this is the directory that you are in at that moment. If you are
    in another directory when you use this code, you will get a different result to
    tell you who you are. This is a great way to keep track of your location on Linux
    and to make sure that you are storing information in the right place.


    # Whoami Command


    The next useful command to learn is to work with the whoami command. This command
    is helpful any time that you want to figure out who is logged into the computer.
    If you use the system with someone else, you may want to use this code to make
    sure that you are logged in properly before you put in some new information. If
    you have two or more users on the system, you will also need to check who is on
    the system, to see if they are invited or not, and you can see who is all logged
    in the time.


    This is a great command to learn if you are the administrator of the whole system
    because it allows you a lot of freedom with what you want to do. If you are the
    administrator, this can be helpful because you can keep track of who is on the
    system, what they are doing, and even if they have the right permissions to be
    on the system at all.


    So, make it simple, we are going to figure out which user we are logged as in
    this system. The code is just going to require you to type in bt > whoami. The
    code is going to pop up the name of the user you are logged in, and if you are
    the only one on the network, but if you notice that the name is different from
    root, which is your main computer, then you know that someone else is using the
    system as well, and you should check into whether they have permission to be there
    or not.


    If do have someone else who uses the system or your computer, you will be able
    to see if you are logged in as them as well. Since you are most likely using this
    as a personal operating system, it is unlikely that you will need to worry about
    the other users that are on the system because you will be the only one. When
    you do the code that was described above, all you should see is root as the answer
    this is what the system considers your computer to be called.


    As you can see, these are just a few of the different commands that you can learn
    how to use on the Linux system. They may not be the most powerful and won''t be
    able to do a ton of stuff on the system, but they are perfect for you to mess
    around with and get'
  merge: -1
  img_proc: true
