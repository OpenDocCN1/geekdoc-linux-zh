- pgno: 16
  md: '# # Navigating Through Linux


    Now that you know how to do some of the basic commands that we learned about in
    the previous chapter, it is time to learn how to navigate through the folders
    inside of Linux. This is going to be a bit different from what you may be used
    to some of the other operating systems. Remember that before we talked how you
    are able to just click the icons that you want to use in the operating systems
    like Mac and Windows, with Linux, you are going to need to bring up the command
    prompt and write out the command that you want to happen.


    This is going to be similar to what is going to happen when you work with the
    Linux system. It is going to look a bit like what you see with Windows, but there
    are some differences that will look confusing in the beginning, but which can
    actually help things to come together a little easier and keeps things organized
    better before.


    When you look at the system for Linux, you are going to notice that it all starts
    out the root function. Keep in mind that this is basically the administrator inside
    of your program and this is where you will be able to find all of the beginnings
    of your tree based on where you have stored things. From here you will be able
    to save the documents, files, and so into the computer and the trees will start
    to form.


    Let''s look at it this way. You would go into the root folder and then could look
    at the beginnings that are there. You could have options like Documents, Pictures,
    Videos, and so on (you may name them something else based on what you are making,
    but we will use them like this for now). Inside of documents, you could have other
    files that you need there, along with folders that branch off more and so on.
    This may all start to look a bit convoluted in some of the other operating systems,
