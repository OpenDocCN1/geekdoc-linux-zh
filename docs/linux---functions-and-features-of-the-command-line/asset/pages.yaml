    you may be confused on where you need to look even to find this file.


    So, any time that you would like to find a file that needs to be edited, you first
    need to learn how to find this directory or the folder where your file is located.
    Basically, you are still going to use the cd command just like you would with
    the Windows system. The syntax that you would use in order to change the directory
    in your system includes:


    ```

    $ cd <name of folder>

    ```


    Now this one works if you would like to start at the beginning and find the particular
    file, but let''s say that you are already within one of the files in the system.
    It would not make sense to look for a file if you are already inside of a different
    file. All this is going to do is make the Linux system look for the file inside
    of the folder you are in. If you want a folder that is outside of your current
    folder, you will need to use the following command:


    ```

    $ cd /etc

    ```


    The forward slash in this syntax is going to tell the program that you want to
    search through the whole system to find the file that you want, rather than just
    going through the'
