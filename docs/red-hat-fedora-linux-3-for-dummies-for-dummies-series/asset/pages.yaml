  md: "```\n<security>\n  <chroot>0</chroot>\n  <!--\n    <changeowner>\n      <user>nobody</user>\n\
    \      <group>nogroup</group>\n    </changeowner>\n  -->\n</security>\n```\n\n\
    Running the server as nobody reduces the security risk — breaking into your Icecast2\
    \ server doesn't provide a hacker with superuser privileges.\n\n+   9. Remove\
    \ the comments from before the `<changeowner>` parameter and after the `</changeowner>`\
    \ parameter:\n\n```\n<security>\n  <chroot>0</chroot>\n\n  <changeowner>\n   \
    \ <user>icecast</user>\n    <group>icecast</group>\n  </changeowner>\n\n</security>\n\
    ```\n\nRemoving the comments allows the `<user>` and `<group>` directives to become\
    \ active and force Icecast2 to run as user and group nobody. If you don't remove\
    \ the comments, Icecast2 runs as the user and group of the process that starts\
    \ it. Because you're logged in as root, Icecast2 runs as the root user.\n\n![](img/41feae212f5c6612ff709354891f7b39_302_0.png)\n\
    \nRunning any service as root can compromise your computer's security.\n\n+  \
    \ 10. Save your changes by clicking the Save button.\n+   11. Quit Gedit by selecting\
    \ File → Quit.\n\nYou just started your multimedia server, but aren't transmitting\
    \ anything. You have dead air now. Because you don't want to run afoul of the\
    \ FCC, the next section describes how to configure and start the lces2 server\
    \ so you can feed content to the Icecast2 server.\n\n# Configuring lces2\n\nConfiguring\
    \ lces2 is similar to configuring Icecast2. Follow these steps to configure lces2\
    \ and then feed an audio stream to Icecast2:"
