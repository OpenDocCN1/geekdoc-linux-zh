- pgno: 182
  md: '# Chapter 13


    # Going to the OpenOffice


    +   In This Chapter

    +   - Introducing OpenOffice

    +   - Using OpenOffice Writer

    +   - Printing from OpenOffice


    Fedora Core is a great product that comes with a large base of services and applications.
    It has always been an outstanding platform for providing services and technical
    applications. But until recently, you didn''t find Fedora Core on many of the
    world''s workday computers; in other words, it lacked a presence on the “desktop.”


    The Fedora Core problem used to be a lack of a full-blown office suite to work
    with word-processing documents, spreadsheets, and other documents. Fortunately,
    desktop productivity suites — such as OpenOffice and its sister application, StarOffice
    — have moved Linux from the back office to the front.


    # Opening Your Office


    The OpenOffice desktop-productivity suite does nearly everything Microsoft Office
    does, but for less money. How much less? Well, 100 percent less because it''s
    100-percent free. Sun Microsystems, Inc. sells the version named StarOffice and
    also provides an open-source version named — you guessed it — OpenOffice. OpenOffice
    is licensed under the GPL/LGPL and SSSL licenses. What do all those letters mean?
    They mean f-r-e-e, and they also mean that Linux can integrate the office-productivity
    features from OpenOffice (because Linux and OpenOffice share the GPL license).
    You can find more information about the licenses at www.openoffice.org/project/www/license.html'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'OpenOffice is not only free (did we mention that it''s free?), but it''s also
    powerful, providing you with these functions:


    Word processor: A full-function, what-you-see-is-what-you-get (WYSIWYG) word processor
    named Writer comes with the OpenOffice package, complete with many functions you
    would expect – formatting, cutting and pasting, graphics, spell-checking, and
    more, as shown in Figure 13-1. It uses its own format and can also read from (and
    write to) documents in Rich Text Format (RTF); plus, it handles Microsoft Word
    6.0, Word 95, Word 97, Word 2000, and Word XP files.


    ![](img/41feae212f5c6612ff709354891f7b39_183_0.png)'
  merge: -1
  img_proc: true
- pgno: 184
  md: '**Spreadsheet:** A full-function spreadsheet program named Calc, used by Wall
    Street brokers to calculate their option-strike prices and similar items. If you’re
    familiar with spreadsheet software, Calc should be straightforward to use. Figure
    13-2 shows the initial Calc window.


    **Presentation:** A graphics program named Impress, with all the bells and whistles
    for creating presentations. The first time you start Impress, you’re prompted
    configure the system. Select the default options and you see Impress as shown
    in Figure 13-3. You can import and export PowerPoint documents with Impress.


    ![](img/41feae212f5c6612ff709354891f7b39_184_0.png)


    **Figure 13-2:** The OpenOffice.org spreadsheet window.'
  merge: -1
  img_proc: true
- pgno: 185
  md: '+   Drawing: The OpenOffice Draw program has graphics tools for creating anything
    from a novice drawing to a masterpiece, as shown in Figure 13-4.


    +   Miscellaneous: OpenOffice provides other functions, such as an HTML editor,
    a math editor for supernerds, and tools for creating labels and business cards.
    You can also create word-processing templates.


    Okay, so OpenOffice has lots of great features. How good are they? Can they get
    the job done? Well, we wrote this edition of the book using OpenOffice, and we
    wrote the preceding edition using StarOffice. That’s not a bad testimonial to
    the capabilities of OpenOffice.


    ![](img/41feae212f5c6612ff709354891f7b39_185_0.png)'
  merge: -1
  img_proc: true
- pgno: 186
  md: '![](img/41feae212f5c6612ff709354891f7b39_186_0.png)


    Figure 13-4: The OpenOffice.org graphics program, Draw.


    # Getting to Know OpenOffice


    If you''re familiar with Microsoft Office, you can find your way around OpenOffice.
    The look and feel are a little different, but the idea is the same. If you''re
    a wild-eyed power-to-the-people person (who''s also thrifty), you may find OpenOffice
    morally superior to Office because it''s free and a part of open source. Or maybe
    you just want to get down to work. Either way, we briefly describe some of the
    most common OpenOffice functions here.'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'This section provides only a basic introduction to the things you can do with
    OpenOffice. No, we''re not hopelessly lazy; it''s just that it would take too
    much space to describe it all in detail. Please experiment with your own test
    documents and consult the online help system for more information.


    # Firing up and using OpenOffice


    Fedora Core provides OpenOffice, and installs it by default. OpenOffice is easy
    to access. Click the GNOME Menu button and then choose Office: OpenOffice.org
    Writer. You can choose some (but not all) other OpenOffice functions from this
    menu as well — but you can start the Calc spreadsheet program only from an OpenOffice
    window. From any window (in Writer or Impress, for example), choose File: New:
    Spreadsheet to open Calc.) After thinking about life for a few seconds, the OpenOffice
    window appears.


    The first time you start OpenOffice, it asks whether you want to use the workstation
    or personal model. The former installs the OpenOffice programs in a central location
    accessible to all users; the latter option installs a copy of OpenOffice in your
    home directory. We use the workstation configuration in this section, but you
    can select the personal model.


    When you use OpenOffice for the first time, we''re also asked a few questions
    about importing an address book. (We cancel this operation because we prefer to
    use the Ximian Evolution address book.)


    You can access all OpenOffice functions by clicking the File button, in the upper-left
    corner of the window, and then clicking the option you want.


    The following list introduces the functions; you''re probably familiar with the
    layout and operation of the menu if you have used Microsoft Office:


    +   ✓ **File**: As you may expect, you can open, close, save, and otherwise manipulate
    OpenOffice documents by using the File menu. Writer files have the .sxw extension.
    You can also read and write other file formats, such as Microsoft Word and HTML,
    by using the File menu.

    +   ✓ **New**: You can create a new document for any OpenOffice function. When
    you choose File: New, you''re given the option to create a new text document,
    spreadsheet, presentation, or other function.

    +   ✓ **Edit**: This menu provides all the functions you need to modify documents.
    Functions such as cut, copy, paste, and delete are all there. The functions that
    are active at any time depend on whether you''re editing a document, spreadsheet,
    or presentation. For example, the cut, copy, and paste options aren''t active
    if you''re not editing a document (as when you first start up OpenOffice and haven''t
    opened any files).'
  merge: -1
  img_proc: true
- pgno: 188
  md: "![](img/41feae212f5c6612ff709354891f7b39_188_0.png)\n\nYou can also track changes,\
    \ just as you can in Microsoft Word. Choose Edit:: Changes and you can track changes\
    \ on a character-by-character basis. You can display the changes or keep them\
    \ hidden from view. When you’re satisfied with your edits, you can make the changes\
    \ permanent and save only the finished document to disk. It’s pretty cool.\n\n\
    OpenOffice also provides the Find and Replace function from the Edit menu. The\
    \ Find and Replace feature enables you to find text strings and either replace\
    \ them with other strings or delete them. You can use it to search forward or\
    \ backward through a document, replacing one instance or all instances.\n\n+ \
    \  - **Spell check:** OpenOffice provides a spell checker, of course. You can\
    \ tell the spell checker to check an entire document by choosing Tools:: Spell\
    \ Check::Check. You’re prompted to act on each possible spelling error the checker\
    \ detects.\n+   \n+   Alternatively, you can set the spell checker to operate\
    \ continuously. Choose Tools::Spellcheck::AutoSpellCheck to toggle on the real-time\
    \ spell checker; when it’s activated, a check mark appears next to the menu option.\
    \ The Continuous option tells OpenOffice Writer to check each word you enter and\
    \ underline possible misspellings with a squiggly red line. The red line disappears\
    \ when you successfully correct the mistake.\n\n+   - **View:** This menu displays\
    \ or hides the various menu bars. You can display a document’s formatting characters\
    \ and zoom in or out to increase or decrease the size of text displayed on-screen.\
    \ The zoom function enables you to make smaller fonts more readable without changing\
    \ the document.\n\n+   - **Insert:** This menu enables you to insert special characters,\
    \ objects, files, and macros into your documents. Special characters include various\
    \ symbols (accents and umlauts, for example) that aren’t part of the everyday\
    \ character set, unless you happen to use words like café frequently. Objects\
    \ include graphics, symbols, and figures. (You can create your own figures with\
    \ Draw.) You can also insert macros and hyperlinks into your documents.\n+   \n\
    +   You can insert tables into documents with any number of rows and columns.\
    \ OpenOffice can automatically adjust the row height, or you can do it manually.\
    \ Choose Table from the Insert menu and play around with this feature.\n\n+  \
    \ - **Tools:** From this menu, you can access the spell checker, thesaurus, various\
    \ OpenOffice configuration settings, and other functions. Some tools (such as\
    \ the spell checker) are self-explanatory.\n\n+   - **Window:** This menu enables\
    \ you to control the look of your desktop. In addition to enabling you to modify\
    \ and move windows, the menu provides other manipulation capabilities."
  merge: -1
  img_proc: true
- pgno: 189
  md: '# ## Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    +   - **Help**: OpenOffice provides pretty good online help services. Many are
    context-sensitive: If you''re editing a text document (for example), click the
    Help menu to get access to information related to the Help module.


    For a further illustration, choose Help > Help Agent and the Help Agent window
    appears. The Help Agent provides assistance in several areas of interest to new
    users, including


    +   - **Introduction to Writer:** Provides an introduction to the word processor


    +   - **Basic tips text documents:** Tells you all you ever wanted to know about
    reading, writing, and printing text documents


    +   - **Advanced tips:** Extends the preceding basic text document tip to more
    advanced subjects


    +   - **Menus:** Describes how all the OpenOffice menus work together


    +   - **Toolbars:** Describes the toolbars that provide information and shortcuts


    +   - **Shortcuts:** Describes which key combinations can be used to perform various
    word processing functions


    +   - **New stuff:** Describes what''s new since the last OpenOffice version


    +   - **Support:** Displays brief information about getting support from Sun Microsystems


    # # Printing with OpenOffice


    Printing from OpenOffice is a simple process after you have configured Fedora
    Core to use a printer. OpenOffice uses the default Linux printer, so all you have
    to do is configure it. This section first describes how to configure a Fedora
    Core printer and then shows you how to set up OpenOffice to use it.


    Configuring a printer attached to your Fedora Core computer is a simple process.
    All you have to do is run the `printconf-gui` printer-configuration utility and
    enter the information about your printer. These steps describe how:


    +   1. Log in to your Fedora Core computer as `root`.


    +   2. Attach a printer to your Linux computer''s parallel (printer) or USB port.
    The parallel port is a 25-pin female connector on the back of your computer case.
    New computers usually label the parallel port with some kind of printer icon (although
    sometimes it''s hard to imagine how they came up with the symbol). If yours isn''t
    marked, there''s no harm in finding the appropriate port through trial and error.


    ![](img/41feae212f5c6612ff709354891f7b39_189_0.png)'
  merge: -1
  img_proc: true
- pgno: 190
  md: '3. Start the printer configuration tool by clicking the **GNOME Menu** button
    and choosing **System Settings→Printing**.


    Enter the `root` password, if you’re prompted. The Printer configuration window
    opens.


    4. To add a printer, click the **New** button. When the introductory *Add a new
    print queue* window opens, click the **Forward** button.


    A dialog box labeled `Queue name` opens.


    5. Enter a descriptive queue name (for example, `Epson777`) and, optionally, a
    *description* of the queue.


    You can, of course, use the default name, `printer`, but we prefer to use descriptive
    names.


    6. Click the **Forward** button to open the `Queue type` dialog box.


    Assuming that your printer is directly connected to your computer, you see the
    device name `/dev/lp0` in a dialog box labeled `Queue type`.


    7. Select the appropriate device and click the **Forward** button.


    A dialog box labeled `Printer model` opens. You can choose from various manufacturers
    and their printer models.


    8. Click the button labeled `Generic` (click to select manufacturer).


    Select your printer’s manufacturer from the drop-down list.


    9. Use the vertical slide bar to locate and select your particular model and then
    click the **Forward** button.


    When you finish, a dialog box labeled *Add a new print queue* opens.


    10. Click the **Finish** button.


    A Question window opens. You’re asked whether you want to print a test page. Click
    the **OK** button and a test page is printed. An *Information* window opens, and
    you’re prompted to check whether the test page printed successfully.


    11. Click the **OK** button to return to the `Printer Configuration` window.


    The `GNOME Print Manager` window opens, showing an icon for the new print queue
    you just created. You can create an additional print queue or modify existing
    ones.


    12. Double-click the new icon.


