    # Checking your wireless NIC


    Linux provides several tools to work with Wi-Fi network interfaces. Fedora Core
    installs the wireless-tools RPM package by default. The tools include *iwconfig*,
    *iwspy*, and other utilities. We describe how to use *iwconfig* to examine your
    Wi-Fi interface configuration.


    Log in as *root*, open a GNOME Terminal window (refer to Chapter 4 for more information),
    and run the *iwconfig* command. If your NIC is configured correctly, you see output
    similar to this example:


    ```

    lo no wireless extensions.\n\neth0 IEEE 802.11-DS ESSID:\"linky\" Nickname:\"...\"\nMode:Ad-Hoc
    Frequency:2.437GHz Cell:\"...\"Bit\nRate:11Mb/s Tx-Power=15 dBm Sensitivity:1/3\nRetry
    limit:4 RTS thr:off Fragment thr:off\nEncryption key:A654-6277-4306-ACC3-E6E0-1C12-98\nPower
    Management:off\nLink Quality:0 Signal level:0 Noise level:0\nRx invalid nwid:0
    Rx invalid crypt:0 Rx invalid ...\nTx excessive retries:0 Invalid misc:0 Missed
    ...

    ```


    These options are the important ones to examine:


    +   * Mode: You have to set this value to Ad-Hoc when you''re connecting to an
    ad-hoc network. (Refer to Chapter 7 for more information about this method.) You
    can use the value Any when you''re connecting to an infrastructure network. The
    Any value can work for an ad-hoc network in some cases; however, a description
    of those cases is beyond the scope of this book, so use ad-hoc mode whenever necessary.'
