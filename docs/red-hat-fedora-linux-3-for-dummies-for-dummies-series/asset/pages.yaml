- pgno: 79
  md: '# In this part ...


    After you have created your Fedora Core workstation, it''s time to get to work.
    The chapters in this part show three different ways to connect to the Internet:
    the traditional, slow but ubiquitous dialup (analog) modem; a cutting-edge and
    blazing broadband DSL or cable modem; or an existing local-area network (LAN)
    connected to the Internet.


    Chapter 5 concentrates on telephone-based modems. Modems are much like old, reliable
    pickup trucks: They may not be the fastest way of getting somewhere, but they
    still get you there. In fact, modems still provide the simplest and most economical
    Internet connection available.


    Chapter 6 introduces broadband Internet connections. Telephone, cable, and companies
    in between provide broadband service to many communities. For not-altogether-unreasonable
    prices, you can get high-speed, always-on service.


    Many people have access to existing local-area networks (called LANs) that link
    computers at work, school, and home. Chapter 7 shows how to connect your computer
    to a LAN — and if your LAN has an Internet connection, you can find out how to
    configure your workstation to use it.


    Your computer becomes vulnerable, however, after you connect to the Internet.
    This statement is especially true if you use a service (such as DSL) that is constantly
    connected. The difference is similar to living on a quiet street versus a busy
    one. You''re more vulnerable on the busy street. That''s why we show you (in Chapter
    8) how to build a firewall to reduce your online vulnerability.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# ## Chapter 5


    # # Dull Dial-Up Modems Still Get the Job Done


    # In This Chapter


    +   - Finding an Internet service provider (ISP)

    +   - Configuring your Internet connection

    +   - Configuring your modem

    +   - Connecting to your ISP


    **S**urfing the Net is lots of fun and sometimes a useful activity. Come on, admit
    it: You know you tie up the phone line for hours just to annoy your family or
    roommates, browse sites with silly addresses such as `www.theonion.com`, and chat
    with people you’d never dream of speaking to in person. The catch is that before
    you join the chaos of the online universe, you have to connect to the Internet.


    Since prehistoric times, the simple modem has been used to make that connection.
    Okay, now that high-speed “broadband” Internet connections have become popular,
    describing how to use an old, slow modem may seem, well, so ’90s. But many (if
    not most) people use modems, so this chapter describes how to set one up to connect
    to an Internet service provider (ISP).


    ![](img/41feae212f5c6612ff709354891f7b39_80_0.png)


    This chapter assumes that you’re connecting to the Internet using a standard dial-up
    modem. We describe how to configure your Fedora Core computer to use faster Internet
    connection technologies, referred to as *broadband connections*, in Chapter 6.


    Many people have access to Internet-connected networks at work and school. (Or
    maybe your five-year-old has constructed an Internet-connected home network!)
    Chapter 7 describes how to connect your Fedora Core computer to an existing private
    network and gain access to the Internet through its connection. You can then surf
    at lightspeed until the cows come home.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# If you’re buying a modem


    Dial-up modems are an old technology, but still the most common method for making
    personal or small-busines Internet connections. This state-ment may not be true
    much longer because the number of users with broadband connections is rising fast,
    and most large businesses also use broadband services.


    An *internal modem* plugs into a PCI or ISA slot on your computer’s motherboard,
    or a PCMCIA slot on laptops, and receives power from the computer. An *external
    modem* comes in its own enclosure, requires its own power supply (those electrical
    plugs sticking out of clunky black boxes), and connects to the computer via a
    serial (sometimes referred to as RS232)


    connection. Both types of modems use your phone jack to connect to the Internet.
    Internal modems are generally less expensive than external ones, but external
    modems have several advantages. You can easily turn them on and off, and you can
    connect them to a computer without opening the computer case, and if your telephone
    line is struck by lightning, the charge passing through the modem doesn’t damage
    your computer. On the other hand, internal modems need only a telephone line cable
    — whereas external modems require a telephone line, a serial connection, and power-supply
    cables.


    # Desperately Seeking ISP


    To get connected using a dial-up modem, you have to hook up a modem to your computer
    and then find a good Internet Service Provider (ISP) to dial up to. Odds are that
    you have an internal modem that came installed with your computer. If not, you
    have to purchase one, either internal or external. Once you have the modem you
    may want to check out *Upgrading & Fixing PCs For Dummies*, 6th Edition, by Andy
    Rathbone (Wiley) to find out how to install it.


    The best way to find a good ISP is by word of mouth. Getting personal recom-mendations
    is a good way to find out both the good and bad points of an ISP that don’t show
    up in advertisements. Before you sign on with an ISP, make sure that the company
    supports Linux.


    If you don’t have any friends and your acquaintances don’t speak to you, try finding
    a local Linux user group (LUG) to ask. You can look up LUGs at the Fedora Core
    community Web page, at www.redhat.com/apps/community.


    Table 5-1 lists some major ISPs that support Linux.


    ![](img/41feae212f5c6612ff709354891f7b39_81_0.png)'
  merge: -1
  img_proc: true
