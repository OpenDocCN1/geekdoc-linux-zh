    # File permissions


    The following examples show different file-permission combinations. Consult Appendixes
    B and C for more information about files and file permissions.


    | -rw-rw-rwx | Create and read, write, and execute permissions for the user, the
    group, and the rest of the world (Mode 777). |

    | :--- | :--- |

    | drwxr-xr- | Create a directory that is completely open to its owner, which can
    also be read and searched by the group and read (but not searched) by the world
    (Mode 754). |

    | crw-r--- | Create a character-special file that the owner can read or write
    to but that the group and the world can only read (Mode 644). |

    | brw---- | Create a block-special file that only the owner can read and write
    to (Mode 600). |


    # A few good commands


    Some commonly used (and useful) commands are listed here. You enter these commands
    from a shell prompt:


    | cd directory | Change the current directory to directory. |

    | :--- | :--- |

    | ls [options] [directory] | List the current directory''s contents. |

    | ls -l | List the current directory''s contents, along with sizes, permissions,
    ownerships, and dates of files. |

    | ls -a | List all files, including invisible files (files whose names begin with
    a period). |

    | pwd [option] | Print the working directory (the one you''re in). |

    | rm [options] filename | Remove the filename. |

    | mkdir [options] directory_name | Make a new (empty) directory. |

    | rmdir [options] directory_name | Remove an empty directory. |

    | cp [options] src_filename dst_filename | Copy a file. |

    | mv [options] src_filename dst_filename(s) | Move (or rename) a file. |

    | cat [options] filename | Concatenate a file to the standard output (display
    the file). |

    | more [options] filename | Paginate a file. |

    | less [options] filename | Paginate a file. |

    | touch [option] filename | Make a new (empty) file or change the access date
    of an existing file. |

    | chown [options] filename | Change the owner of a file or a directory. |

    | chgrp [options] filename | Change the group of a file or a directory. |

    | chmod [options] filename | Change the permissions of a file or a directory.
    |

    | sort [options] filename | Sort a file in a particular order (depending on the
    option). |

    | echo [options] text string | Echo back to the screen what is typed after the
    command. |

    | date [options] text string | Read the date and time (without an argument); set
    the date and time (with an argument). |

    | cut [options] filename | Break a wide file into multiple narrow files. |

    | sed [options] filename | Stream editor for large files or realtime editing.
    |

    | In [options] source_filename/directory target_filename/directory | Link a filename
    to another file. |

    | grep [options] filename | Find data and print it to its output; this searching
    program uses general regular expressions. |


