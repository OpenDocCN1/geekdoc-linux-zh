    # Introducing GNOME Menus


    You can access most Fedora Core and GNOME applications and utilities via the GNOME
    Menu. Individual applications are listed in Chapter 10 but the various menu categories
    listed are as follows:


    +   - **Accessories**: Useful-but-extra applications that don’t belong to any
    groups on this list are labeled as accessories. Applications such as the GNOME
    calculator, a text editor, and a dictionary are placed in this category. Just
    enter a word and its definition is displayed.


    +   - **File Browser**: This utility allows you to browse Windows and Linux (via
    Samba) network file systems.


    +   - **Games**: Because Linux was initially built to run services, it may not
    come to mind first as catering to game players. But it has lots of games. Open
    the Games icon and you see many of them. You can waste your life with Linux just
    as easily as with Windows! Ha!


    +   - **Graphics**: You can view and manipulate images with several graphics utilities.
    Click the GNOME Menu and then the Graphics menu and you can run applications like
    The GIMP (an excellent tool for working with and editing images). You can use
    the Scanning tool to scan images into'
