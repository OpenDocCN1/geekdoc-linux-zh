- pgno: 61
  md: 'The process of configuring these individual systems is described throughout
    this book. However, the following steps describe how to use the Setup Agent immediately
    after completing the Fedora Core installation:


    +   1. When your new Fedora Core computer boots (starts), you see the Setup Agent’s
    Welcome screen. Click the Next button to start the post-installation configuration
    process.


    The License Agreement window opens.


    +   2. Gather your lawyers (guns and money are optional) and read the agreement
    together. Click the button labeled Yes, I agree to the License Agreement and then
    click Next and proceed to court.


    Truthfully, going to court is unlikely. But, just in case, deny everything.


    +   3. The Date and Time window appears. You can change the date and time if you
    need to.


    You can also let your computer automatically and continuously update your clock.
    If you plan to be connected to the Internet, either through a LAN (local area
    network) or a broadband modem (DSL or cable), click the Network Time Protocol
    tab and select the Enable Network Time Protocol (NTP) option. Select an NTP server
    from the drop-down menu of NTP servers and click the Add button. The default choices
    clock.redhat.com and clock2.redhat .com work well, but you can enter one you want.
    Alternatively, you may have access to an NTP server not on the list and can enter
    it manually. Click the Forward button to continue to the Sound Configuration screen.


    We recommend that you use the NTP option if your computer is connected continuously
    to the Internet on an Internet-connected LAN, a DSL connection, or a cable modem.
    PC clocks tend to drift from seconds to minutes per day. It''s better to be up
    to date than not.


    +   4. Click the Next button.


    +   5. The Display window opens. Change your monitor type, display resolution
    and the colors depth, if you want.


    You can change the monitor type by clicking the configure bar and selecting from
    the drop-down menu that opens. Change the resolution and/or color depth by clicking
    on the appropriate bar and selecting a value.


    +   6. Click the Next button.


    The System User window opens. Only the root user account was created during the
    installation process. You have the chance here to create one or more user accounts.'
  merge: -1
  img_proc: true
