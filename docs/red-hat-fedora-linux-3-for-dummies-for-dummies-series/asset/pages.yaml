  md: "# Chapter 2\n\n# Paving the Way for Fedora Core\n\n# In This Chapter\n\n+ \
    \  - Preparing to install Fedora Core\n+   - Determining whether your Windows\
    \ partition is FAT or NTFS\n+   - Defragmenting your hard drive\n+   - Resizing\
    \ FAT partitions\n+   - Resizing NTFS partitions\n\nAll major personal computer\
    \ (PC) manufacturers install Microsoft Windows on their machines by default. However,\
    \ you can purchase computers *sans* operating system via mail-order or from local,\
    \ non-brand stores.\n\nWhat does that mean? Basically, you can skip this chapter\
    \ if you have a “bare” PC without a preinstalled operating system. You can also\
    \ skip this chapter if you want to remove Windows from your PC or if your Windows\
    \ computer has a second partition on which you can install Linux.\n\n![](img/41feae212f5c6612ff709354891f7b39_34_0.png)\n\
    \n> **TECHNICAL STUFF**\n> \n> A *partition* is a portion of a disk drive used\
    \ to organize files and directories. For example, the famous Windows C drive is\
    \ installed on its own partition. A partition can use all or part of a disk. Most\
    \ computers now partition the entire hard disk for drive C, although some include\
    \ a second partition for drive D. However, if you have Windows installed on your\
    \ PC and want to keep it, you have to make accommodations for Fedora Core. Fortunately,\
    \ Linux is an easy-going fellow who gets along well with others. You can install\
    \ Fedora Core next to Windows on the same drive in a configuration called a “*dual-boot*”\
    \ system: You choose which operating system to use when you power up, or *boot*,\
    \ your computer.\n\nThis chapter shows you how to prepare your hard drive so that\
    \ Linux and Windows can live in harmony worthy of a schmalzy soda commercial.\
    \ What the world needs now is dual-boot, sweet dual-boot — oh, never mind."
