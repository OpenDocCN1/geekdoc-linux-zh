    +   5. Click the *Open button*.

    +      The file downloads and the Adobe PostScript Driver Installer window opens.

    +   6. Click the *Next button*.

    +      The End User License Agreement window opens.

    +   7. Pay your lawyers more money and click the *ACCEPT button*.

    +      The Printer Connection Type dialog box opens.


    Now you get to configure the print driver you just downloaded (the hits keep right
    on comin’):


    +   1. Click the button labeled `It is connected to your network (Network Printer)`
    and *then* click the *Next button*.

    +      The Windows computer should automatically see the printer share on your
