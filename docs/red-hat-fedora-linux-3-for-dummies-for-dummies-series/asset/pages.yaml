    ![](img/41feae212f5c6612ff709354891f7b39_175_0.png)


    5. **Next**, **play an Internet stream**.


    Go to www.virgin.co.uk/theastation/listen/ogg.html.


    6. **Click any of the Ogg links**.


    The Vorbis Web page provides links to other Ogg-capable sources. For example,
    click the Music Sites Page link, near the top of the www.vorbis.com/music.psp
    page. You see a page with links to other sources. For example, click the WCPE
    link to go to a Web page that streams classical music.


    # Introducing the Mighty MPlayer


    Whenever a desperate need exists, Superman comes in to . . . er, the open-source
    movement comes in to save the day. Until recently, you couldn’t use any single
    Linux application to listen to and view most popular streaming formats. Now, MPlayer
    has burst on the scene and fills that gap.


    MPlayer can play most popular (and many obscure) audio and video streaming formats.
    Although MPlayer is under intense development — it’s still technically in the
    beta phase while its development team fine-tunes its features — it’s quite usable,
    and we think you should consider using it. We do!


    This list shows some streaming formats MPlayer can play:'
  merge: -1
  img_proc: true
- pgno: 176
  md: '+    MPEG-1/Layer 3 (MP3): MP3 is a popular but proprietary codec used for
    both storing and streaming audio.


    +    Ogg/Vorbis: This new, up-and-coming, open-source streaming format is unencumbered
    by any copyrights or patents (as other formats are).


    +    Microsoft Media Server (MMS): You can listen to radio broadcasts that use
    the popular MMS format with MPlayer. Previously you had to use the Microsoft client
    application to listen to MMS streams.


    +    Digital Versatile Disc (DVD): You can play DVDs from your computer with MPlayer.


    +    RealAudio: You have to download, compile, and install the RTSP package to
    use RealAudio.


