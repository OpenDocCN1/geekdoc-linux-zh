- pgno: 192
  md: '# Chapter 14


    # # The Days of Wine and Windows Applications


    # **In This Chapter**


    +   - Introducing Wine

    +   - Using Wine


    Linux provides for many, if not most, of your desktop needs. The applications
    described in the preceding chapters satisfy most of your daily work requirements.
    All the essential applications, such as OpenOffice, Mozilla, and Evolution, are
    at your disposal.


    Sometimes, however, you need to perform some function that Linux doesn''t provide.
    For example, most games are written for the Microsoft world and aren''t available
    for Linux. At times — such as when you''re editing documents with complex macros
    — you must use Microsoft Word. That''s when Wine, Crossover Office, and VMware
    come to the rescue.


    # ## Introducing Wine


    Wine doesn''t come from the Sonoma Valley, Chile, Australia, or even from the
    south of France. You can''t get tipsy or spend much money on it, either. Wine
    isn''t a beverage, but rather a software system that allows you to run Windows
    applications on a Linux computer. Wine helps to fill-in the small Linux application
    gap.


    Modern Windows applications are, at their core, written to run on Intel, or Intel-compatible
    (AMD, for example), Pentium processors. (Some Windows applications are run on
    Apple Macs; for purposes of this discussion, however, we''re talking about only
    Intel-based PCs.) Linux runs on Pentium-based PCs. However, you can''t just load
    a program like Microsoft Word right onto your Linux computer and expect it to
    work.'
  merge: -1
  img_proc: true
- pgno: 193
  md: "The Microsoft Windows operating system provides a platform for running Microsoft\
    \ applications, such as Word and Explorer. That platform is a little like an electrical\
    \ plug that provides the power to run, and a standard way of accessing that power\
    \ — the electrical outlet, and various appliances — that are analogous to applications.\
    \ What the Windows “plug” provides is a library of commonly used, low-level functions\
    \ — referred to as an Application Program Interface (API). Those functions perform\
    \ tasks common to every application, such as opening a file or talking over a\
    \ network. Using a common library prevents every application from having to reinvent\
    \ the wheel. Instead, the applications just plug into the common “outlet” and\
    \ concentrate on performing their particular functions.\n\nThe problem is that\
    \ the Windows platform (the “plug” in the electrical analogy) has what amounts\
    \ to square holes while Linux has what amounts to round ones. You cannot plug\
    \ Word directly into the Linux operating system, for example. That’s where Wine\
    \ comes in: It provides the adapter so you can plug the Windows application into\
    \ the Linux outlet.\n\n![](img/41feae212f5c6612ff709354891f7b39_193_0.png)\n\n\
    Wine stands for Wine Is Not an Emulator. This typically obscure acronym is the\
    \ type that Linux and Unix programmers love. It means not only that some people\
    \ just need to get out more, but also that Wine doesn’t do its work by simulating\
    \ (that is, emulating) the entire Windows environment. Rather, it duplicates one\
    \ vital part of the environment: the interface between the application and the\
    \ operating system. In the electrical analogy, Wine isn’t trying to be the entire\
    \ electrical grid (as in Windows) but, rather, the adapter.\n\n# ## Downloading\
    \ Wine\n\nCome on, now, Fedora Core has to leave a few things up to the user.\
    \ Therefore Wine isn’t included in the distribution; you have to download it from\
    \ the Internet. These steps describe how:\n\n+   1. **Log in to your Fedora Core\
    \ computer as any user.**\n+   \n+       You can log in as the superuser (root)\
    \ if you want, but that’s not necessary. By not logging in as the superuser, you\
    \ don’t run the risk of unintentionally damaging your computer (for example, deleting\
    \ all your files).\n\n+   2. **Open your Mozilla browser by clicking the blue\
    \ globe on the GNOME Menu.**\n+   \n+       Using Mozilla is described in Chapter\
    \ 11.\n\n+   3. **Enter the address www.winehq.com/site/download in the text box\
    \ at the top of the browser and press Enter.**\n+   \n+       Your browser displays\
    \ the Wine Binary Downloads page. This page contains links to various noncommercial\
    \ and commercial repositories. (We describe the commercial Wine version in the\
    \ section “Introducing"
  merge: -1
  img_proc: true
