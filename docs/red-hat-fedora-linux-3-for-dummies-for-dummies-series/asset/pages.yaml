    +   3. Click the Delete button.

    +   4. Enter cdrom in the Create Share text box.

    +   5. Click the Create Share button. The Share parameters page expands.

    +   6. Enter /media/cdrom in the Path text box.

    +   7. Enter a comment of your choosing in the comment text box.

    +   8. Click the Commit Changes button.


    Your Samba server is now set up to share your CD-ROM with your network.'
