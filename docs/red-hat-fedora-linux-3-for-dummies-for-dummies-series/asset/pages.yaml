- pgno: 102
  md: '# Chapter 7


    # Connect Locally, Communicate Globally: Connecting to a LAN


    +   - Networking with an Ethernet or wireless NIC

    +   - Using the Fedora Core Network utility

    +   - Starting and stopping your local network connection


    This chapter shows how to connect your Fedora Core computer to an existing local-area
    network (also called a LAN or a private network). It''s different from connecting
    directly to the Internet with a dial-up modem or broadband connection as described
    in Chapters 5 and 6; those chapters show you how to connect a single, stand-alone
    Fedora Core computer directly to the Internet. In this case, you connect your
    Fedora Core computer to a LAN, which might have its own Internet connection.


    You may be building your Fedora Core computer to use at home, work, or school.
    It doesn''t matter what the venue is: You can use the information in this chapter
    to connect your computer to any existing LAN.


    Don''t get discouraged if you don''t have access to a LAN. You can make your own!
    Chapter 15 describes how to build one.


    ![](img/41feae212f5c6612ff709354891f7b39_102_0.png)


    In this book, the terms LAN and private network are used interchangeably.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# Introducing Local-Area Networks


    The invention of Linux revolutionized computer networking. Creating a LAN before
    Linux existed was expensive and complicated. LANs were the nearly exclusive domain
    of big corporations, universities, and such.


    But networking was built into Linux, in the form of the TCP/IP networking protocols,
    from the beginning. In the mid-1990s, if you could afford a couple of PCs, a cheap
    piece of coaxial cable, and a couple of Ethernet adapters, a LAN has born. Ethernet
    adapters, also commonly known as network interface cards (NICs), cost about $150
    or more at the time. Prices, fortunately, have crashed since then, falling to
    earth faster than a middle-aged rock star: A 100Mbps NIC now costs as little as
    $10, and you can buy an 11Mbps wireless NIC for less than $50 (54Mbps 802.11g
    cards sell for not much more than $50).


    To get your Fedora Core computer connected to a network, however, you do have
    to configure a handful of networking subsystems. Here are the tasks that have
    to be done for your network to work:


    +   - Install your wireless or Ethernet NIC. Most computers, laptops and desktops,
    include preinstalled Ethernet NICs. Many laptops also come equipped with wireless
    NICs. If you need to retrofit a NIC, follow the instructions that come with the
    device.

    +   - Load your wireless or Ethernet NIC kernel module. Fedora Core generally
    detects your hardware and automatically loads the correct kernel modules.

    +   - Configure your NIC’s IP address, netmask, and gateway.

    +   - Configure your Domain Name Service (DNS), which converts Internet names
    into Internet Protocol (IP) addresses.


    Wireless networking (or Wi-Fi, as explained in an upcoming sidebar) suffers from
    some security vulnerabilities. Consult the “Wireless network warning” sidebar,
    later in this chapter.


    Performing these steps requires some “heavy lifting.” Your load is eased considerably
    by using the graphical Network Configuration Utility, a system-administration
    tool that comes with Fedora Core. Have fun!


    ![](img/41feae212f5c6612ff709354891f7b39_103_0.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Configuring Your NIC with the Fedora Core Network Utility


    To use your Fedora Core computer with an existing local-area network (LAN), you
    need at least two pieces of hardware:


    +   - A wireless or Ethernet NIC (network interface card) installed on your computer

    +   - A network hub, switch, or wireless access point to connect to the NIC


    After you set up the hardware, the next step is to configure your Fedora Core
    network settings.


    # Preparing to configure your wireless NIC


    Before you can configure your wireless NIC, you need to figure out two things:


    +   - The type of wireless NIC you have (or need)

    +   - How your wireless NIC should connect to your network


    The two most widely used types of 802.11b (11Mbps) wireless electronics (or *chip
    sets*) are by WaveLAN (built by Lucent Technologies) and Prism2 (designed by Intersil).
    Fedora Core supports both types. Here are some details (manufacturers and so on)
    to help you figure out what kind of chip set your device uses:


    +   - **WaveLAN**: Orinoco is the leader here; other (less *popular*) models include
    Apple AirPort Enteriasys RoomAbout 802, Elsa AirLancer 11, and Melco/Buffalo 802.11b.

    +   - **Prism2**: D-Link DWL-650, LinkSys, Netgear, WPC11, and Compaq WL110; other,
    less popular models include Addtron WPL-100, Bromax Freeport, GemTek WL-211, Intek/Nokia,
    SMC 2632W, YDI, Z-COM XI300, and Zoom Telephonicus ZoomAir 4100


    At the time this book was written, the newest available wireless protocol was
    **802.11g**. Technology built to this standard can run at up to 54 Mbps, roughly
    five times the speed of an 802.11b system. However, there are not many Linux drivers
    available for this technology yet. The Prism54 project is busy developing open-source
    Linux drivers for the 802.11g protocol, so please look at [www.prism54.org](http://www.prism54.org)
    to see whether your wireless card has a driver by the time you read this chapter.
    One company, Linuxant, sells software that allows your Linux computer to use Microsoft
    drivers. Consult their Web site [www.linuxant.com](http://www.linuxant.com) for
    more information about their product.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# # IEEE, Wi-Fi, and wireless networks


    IEEE (pronounced “eye-triple-o”), or Institute of Electrical and Electronic Engineers,
    is a world-wide professional society of nerds (specifically, those nerds who care
    enough about technical matters to set consistent standards). The IEEE, the “triclops”
    of wireless networking (one eye, three Es, get it?), concerns itself with issues
    such as which frequency wireless networking devices should use. Fortunately, this
    group has devised this wonderful standard that now


    enables everyone who is interested to communicate without stringing wires between
    machines.


    The dominant wireless standard is a combination of ingredients. It’s based partly
    on the IEEE 802.11b standard (also called Wi-Fi, short for wireless fidelity)—and
    also two older standards (802.11a and the more recent 802.11g). Hey, call it shorthand:
    if you hear people talking about a Wi-Fi NIC, they’re just talking about wireless
    NICs.


    The first order of business is to figure out how your wireless NIC (or network
    adapter) should connect to your network. Wireless NICs connect to a LAN in two
    ways:


    +   ✔ **Adapter to adapter**: This type, referred to as an *ad-hoc* connection,
    is useful if you have two or more computers that you want to talk and form their
    own, exclusive private network.


    +   ✔ **Adapter to wireless access point**: This type, called *infrastructure*,
    provides a single entrance (an access point) into a LAN. An *access point* allows
    one or more computers to be connected to a network. However, unlike an ad-hoc
    network, the individual computers can connect to any access point that allows
    them to.


    The wireless-configuration instructions we provide work with either the infrastructure
    or ad-hoc connection methods. Your wireless NIC can connect to either the access
    point or other computers (Linux and Windows) as long as you correctly configure
    your network ID (ESSID) and your encryption key.


    # # Why ad-hoc is better than infrastructure


    Using ad-hoc mode provides several advantages:


    +   ✔ **Lower costs**: You don’t have to purchase an access point; access points
    starts at around $50. Computers using wireless NICs running in ad-hoc mode communicate
    directly with each other, eliminating the need for a common access point.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '**Simpler configuration for Linux users:** Older access-point devices could
    be configured using only Windows-based software — using the simple network-management
    protocol (SNMP), to be exact. You had to physically connect a Windows computer
    to the access point via a wired Ethernet network, and then use the software supplied
    with the device. That was difficult if you didn''t have any Windows-based computers.
    Newer access points tend to use Web-based configuration tools, so you can use
    Mozilla to configure these newer devices.


    **Ad-hoc networks eliminate the need to configure any access points:** You configure
    only the wireless NIC in each computer on your network. You can use the Fedora
    Core Network Configuration utility to configure a wireless NIC, which simplifies
    the process. Each NIC must have the same network ID and encryption key.


    Ad-hoc networks can also provide a bit more security because they connect to other
    networks — and the Internet — through a network router. Access points work as
    network bridges. Routers examine IP addresses and then decide where to direct
    network traffic from one network to another. Bridges automatically pass on all
    traffic. Ad-hoc networks can be configured to more tightly — but not completely
    — control network traffic than access-point-based networks. Ad-hoc networks with
    firewalls are easier to configure than networks that use access points. (Many
    current access points now provide NAT and firewall support; using NAT effectively
    creates a firewall.)


    # Configuring your *Ethernet or wireless* NIC


    To get your Fedora Core computer working on a LAN, you must first configure its
    network interface card, or NIC. The *NIC* is the device that electronically connects
    your computer to your LAN. To work with the other computers on your network, your
    Ethernet or wireless adapter must be given a network address and a few other pieces
    of information.


    > We have divided the configuration instructions between Ethernet and wireless
    NICs. The instructions start by showing you how to start the Fedora Core Network
    Configuration Utility. We then devote a subsection to describing the particulars
    of configuring Ethernet and wireless devices. After we cover the device specifics,
    we discuss general configuration issues. The overall configuration process is
    outlined in these steps:


    +   1. Start the Network Configuration Utility.

    +   2. Configure your Ethernet or wireless NIC.

    +   3. Configure your computer''s host name.

    +   4. Configure your computer''s domain name service.

    +   5. Restart your network.'
  merge: -1
  img_proc: true
- pgno: 107
  md: "# Wireless network warning\n\nWi-Fi, the standard for wireless technology,\
    \ uses an *encryption system named wireless equivalent privacy (WEP)* to provide\
    \ security. WEP encrypts communication between wireless devices to prevent someone\
    \ with the right equipment from listening to and using your wireless network.\
    \ **But WEP is flawed and can be broken using widely available tools.** If a hacker\
    \ breaks in to your Wi-Fi network, he can read your communications. **Can your\
    \ problems don't end there. Hackers can use your wireless network to connect to\
    \ the Internet; you give the bad guys a free lunch and a launch pad to the Internet.**\n\
    \nOn the other hand, wireless networking is so useful that many people make accommodations\
    \ for the risk. The logic? **If you assume that your wireless network is open\
    \ to the public, you can take other precautions to keep your communications private.**\n\
    \nYou should use *OpenSSH, Secure Sockets Layer (SSL), and virtual private networking\
    \ (VPN)* — all bundled with Fedora Core — to conduct all your internal and external\
    \ communication. **Keep in mind that using SSH, SSL, and VPN protects your information,\
    \ but doesn't prevent someone from connecting to your network.** The next generation\
    \ of wireless security is supposed to fix the WEP weakness. **Until the WEP problems\
    \ are solved, be aware of the risks.**\n\n# *Starting the Network Configuration\
    \ utility*\n\nFollow these steps to start the Network Configuration utility:\n\
    \n+   1. Click the **GNOME Menu** button and choose **System Settings > Network**.\n\
    +   2. Enter the ***root password*** if *you're prompted to do so*.\n+       Figure\
    \ 1-3 shows the initial configuration window; a NIC may or may not be displayed\
    \ there. The NIC is displayed only if you configured your networking during Fedora\
    \ Core installation.\n+   3. Click the **New** button if no NIC is displayed on\
    \ the **Devices** tab (or if you want to configure an additional NIC).\n+    \
    \   - If you're working with an Ethernet device, skip to Step 3 in the \"Configuring\
    \ an Ethernet NIC\" section that follows.\n+       - If you're working with a\
    \ Wi-Fi NIC, skip to Step 1 in the \"Configuring a wireless NIC\" section, later\
    \ in this chapter.\n+       \n+       The Select Device Type window appears.\n\
    +   4. Select the ***appropriate type of device*** from the list and click the\
    \ **Forward** button.\n+   \n+       For example, select Ethernet if you're using\
    \ that type of interface. If you're using a Wi-Fi device, select Wireless connection.\n\
    +   \n+   What you do next depends on whether you're configuring an Ethernet NIC\
    \ or a wireless NIC. The following two sections are devoted to Ethernet and wireless\
    \ NICs, respectively."
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/41feae212f5c6612ff709354891f7b39_108_0.png)


    # Configuring an Ethernet NIC


    If you’re using an Ethernet NIC, follow the steps in this section to configure
    its parameters (if you’re using a wireless NIC, go to the following section):


    +   1. Follow the steps in the preceding section, “Starting the Network Configuration
    utility.”


    When you select Ethernet from the drop-down list in Step 4 of the preceding steps,
    the Select Ethernet Device window appears.


    +   2. Select the appropriate Ethernet device and click the Forward button.


    The Network Configuration utility detects all the Ethernet devices attached to
    your computer. Most PCs have only one Ethernet device, so you shouldn’t have to
    decide which one to select.


    The Configure Network Settings window opens (refer to Figure 7-2).


    +   3. Configure your TCP/IP address settings.


    The Network Configuration utility selects DHCP (Dynamic Host Configuration Protocol)
    as the default method for determining your machine’s IP address. (DHCP dynamically
    assigns an IP address and other parameters to your Ethernet NIC, and you’ve finished
    configuring your NIC.) If you’re connecting to a network that provides DHCP service,
    type your computer name in the Hostname (optional) field (for example, Cancun),
    click the Forward button, and go to Step 9.


    If your network doesn’t use DHCP, you need to manually configure your IP address.
    Proceed to Step 4.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 92

    Part II: Got Net?


    # Figure 7-2: Entering your static (non-DHCP) IP address settings.


    ![](img/41feae212f5c6612ff709354891f7b39_109_0.png)


    4. **Click the Statically Set IP Addresses radio button.**

    You should ask your friendly local system administrator (unless you''re the administrator,
    in which case you may want to avoid talking to yourself) which system your network
    uses.


    Life is a bit more complicated if you have both a wireless NIC and an Ethernet
    NIC on your computer. You can run both devices at once, but the configuration
    is more difficult. You can solve the problem by clicking the Automatically Obtain
    IP Address Settings radio button so the dot disappears. This simple mouse click
    prevents the Ethernet NIC from starting automatically.


    ![](img/41feae212f5c6612ff709354891f7b39_109_1.png)


    5. **Assign an IP address to your computer by typing it in the Address text box.**

    IP addresses are analogous to street addresses: They provide a number that uniquely
    distinguishes your machine from all others. Private IP addresses don''t require
    any registration with the powers that be — the InterNIC organization that distributes
    IP addresses. Private IP addresses aren''t routed on the Internet so you can use
    these on your private network.

    If you''re on a network with registered IP addresses, be sure to get an IP address
    from your system administrator. Otherwise use a private IP addresses. You could
    use (for example) any Class-C address between 192.168.1.1 and 192.168.254.254
    — such as 192.168.1.20 or 192.168.32.5. Private IP addresses in this range are
    designated for use by private networks. By design, private IP addresses don''t
    get routed (sent from one network to another) through the Internet.


    ![](img/41feae212f5c6612ff709354891f7b39_109_2.png)'
  merge: -1
  img_proc: true
- pgno: 110
