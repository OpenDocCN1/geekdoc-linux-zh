- pgno: 83
  md: "# Configuring Your Internet Connection\n\nYou need to configure your modem\
    \ so that Fedora Core can use it to connect to your ISP. The Dialup Configuration\
    \ utility does a good job of detecting, and then configuring, your modem. It also\
    \ sets up a dial up account to connect your computer to your ISP (and, therefore,\
    \ to the Internet). When you have the ISP and modem in place, the next step is\
    \ to create a modem configuration:\n\n+   1. Click the GNOME Menu button (the\
    \ red hat in the upper-right corner of your screen) and choose System Tools→ Internet\
    \ Configuration Wizard.\n\n+   2. Enter the root password in the Query dialog\
    \ box, if you’re prompted. \n+   \n+   You must have root (that is, the highest\
    \ level of access to configure your modem.\n\n+   3. When the Add new Device Type\
    \ window opens, click the Modem connection and then the Forward button. \n+  \
    \ \n+   The Searching for Modems dialog box appears briefly while the Internet\
    \ Configuration Wizard scans your computer for modems.\n\n+   4. If no modem is\
    \ detected or recognized, the Warning dialog box opens. \n+   \n+   If the modem\
    \ is found, the Select Provider window opens and you should skip to Step 8.\n\n\
    +   5. Click the OK button. \n+   \n+   The Select Modem window appears, as shown\
    \ in Figure 5-1.\n\n![](img/41feae212f5c6612ff709354891f7b39_83_0.png)"
  merge: -1
  img_proc: true
- pgno: 84
  md: "When the Internet Configuration Wizard doesn't find a modem, it guesses that\
    \ one is attached to a serial port: `/dev/modem`. (A *serial port* is the mechanism\
    \ your computer uses to communicate with a serial device, such as a modem; Universal\
    \ Serial Bus (USB) is the modern equivalent of a serial port.)\n\n+   6. You cannot\
    \ be sure that the `/dev/modem` device exists, so select `/dev/ttyS0`; select\
    \ `/dev/ttyUSB0` if you're using an external USB modem.\n+   \t* The `/dev/ttyS0`\
    \ device is the first serial port on your computer; `/dev/ttyUSB0` is the first\
    \ USB device.\n+   \t* You can also modify the modem settings, if you want, in\
    \ the Select Modem window.\n\n+   7. Click the **Forward** button.\n+   \tThe\
    \ Select Provider window appears.\n\n+   8. Select the appropriate preset configuration\
    \ if you live in one of the listed countries.\n+   \tYou can, of course, choose\
    \ to select another unlisted ISP — and you can click the T-Online button if you\
    \ use that ISP. The German ISP T-Online also provides English service. If you\
    \ select this service, enter your information in the dialog box that opens.\n\n\
    +   9. In the Select Provider window, enter your ISP's phone number, the name\
    \ of your ISP, your login name, and your password in the appropriate boxes.\n\
    +   \tYou should also enter your ISP's prefix and area or country code (if necessary)\
    \ in the appropriate text boxes.\n\n+   10. Click **Forward** after you enter\
    \ the information.\n+   \tThe IP Settings dialog box opens, as shown in Figure\
    \ 5-2.\n\n![](img/41feae212f5c6612ff709354891f7b39_84_0.png)"
  merge: -1
  img_proc: true
- pgno: 85
  md: 'You have two default options in the IP Settings dialog box:


    +   - Automatically obtain IP address settings

    +   - Automatically obtain DNS information from provider


    The default options permit your ISP to use PPP (Point-to-Point Protocol) to create
    an Internet connection across your telephone line and to use your ISP’s DNS service
    to look up Internet names.


    +   11. **These settings should work with your ISP, so click the Forward button.**


    The Create Dialup Connection window opens, showing a summary of the information
    you just entered.


    +   12. **Click Apply.**


    The Network Configuration window opens. You see your new modem and any other network
    device, such as an Ethernet interface, in the window.


    When you’ve finished creating the modem configuration, you can activate it and
    get connected to the Internet. Here’s the drill:


    +   1. **In the Network Configuration window, click the File::Save menu option
    to save your modem configuration.**


    +   2. **Click the OK button when the Information window opens.**


    +   3. **Click the Modem device to select it.**


    The modem line is highlighted in blue.


    +   4. **Click the Activate button to fire up the modem and connect to your ISP.**


    The Network Configuration tool dials up your ISP, authenticates your connection,
    and provides your computer with an Internet connection. Your ISP then uses the
    PPP protocol to set your IP address, default route, and DNS provider — automatically.
    Those numbers take precedence over any existing parameters (such as an Ethernet
    interface) as long as the dialup connection is active.


    +   5. **Click the GNOME menu icon on the GNOME Panel and select Internet::Mozilla.**


    When the browser opens, browse away.


    +   6. **When you’re finished with your Internet connection click the Deactivate
    button.**


    By deactivating your modem connection, you reset your dynamic IP address and default
    route. Your previous DNS provider is reset only if you’re using DHCP on your private
    network; otherwise, the dial-up DNS provider setting remains in effect. See the
    section in Chapter 7 about configuring DNS and an Ethernet or wireless interface.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'Linux uses *device files* to communicate with peripherals. Device files are
    found in the `/dev` directory and are roughly equivalent to Windows drivers: the
    Linux kernel uses them to communicate with your hardware.


    You can connect your modem to one of four serial ports or one of many USB ports
    available on your PC. An external serial modem is generally connected to port
    `/dev/ttyS0`, and sometimes to `/dev/ttyS1`, or even `/dev/ttyS2` or `/dev/ttyS3`;
    USB modems are connected to `/dev/ttyUSB0`, `/dev/ttyUSB1`, and so on. If you
    have an internal modem, it can be any one of the `tty` devices.


    # Firing Up Your Internet Connection


    Fedora Core provides a PPP dialer utility to help you establish a PPP connection.
    You establish this connection by using the PPP configuration you set up with the
    Dialup Configuration tool (which we describe earlier in this chapter, in the section
    “Configuring Your Internet Connection”).


    To connect to the Internet with the PPP dialer, follow these steps:


    +   1.  Click the **GNOME Menu** button and choose **System Tools**:: **Network
    Device Control**.

    +       The Network Device Control window appears, displaying all the network
    interfaces you have.

    +   2.  Click the name of your modem (for example, `Myconnection`) and then click
    **Activate**.

    +       The Network Device Control utility dials and connects to your ISP.

    +   3.  When you finish using the Internet, click the **Deactivate** button in
    the **Network Device Control** window.

    +       Your connection terminates.'
  merge: -1
  img_proc: true
