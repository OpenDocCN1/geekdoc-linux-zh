    \n# ## Configuring Your Monitor and Video Card\n\nThe Fedora Core installation\
    \ process is good at automatically configuring itself to use your video hardware\
    \ and monitor. Linux uses the X Window System (*X*, for short) to display graphics.\
    \ However, occasionally the *X* configuration process fails, or you may want to\
    \ reconfigure it. Either way, Fedora Core gives you access to the same configuration\
    \ tool it uses during the installation process.\n\nThe Fedora Core X configuration\
    \ utility is the **system-config-display**. We refer to it as simply the *Display\
    \ Configurator*. Generally, the Display Configurator automatically detects your\
    \ monitor (display) and graphics card. After they have been detected, you can\
    \ set your display’s resolution and color depth.\n\n# ## Starting the Display\
    \ Configurator\n\nYou can start the Display Configurator even if you’re not running\
    \ X (if you’re running in nongraphical mode; you’re at Run Level 3):\n\n+   1.\
    \ **Log in as *root***.\n+       You automatically see a command-line interface.\n\
    +   \n+   2. **Enter this command at the Bash prompt:**\n+       `system-config-display`\n\
    +       The Display Configurator window opens. The utility runs within a graphical\
    \ interface.\n\nYou can, of course, start the Display Configurator if your computer\
    \ is running X. You may want to reconfigure your system, for example. Follow these\
    \ instructions to start the utility:\n\n+   1. Click the **GNOME** Menu.\n+  \
    \ 2. Choose **System Settings⚙Display**."
