- pgno: 266
  md: '# *Making life even easier with ssh-agent*


    Red Hat automatically starts a system named `ssh-agent`. With ssh-agent, you enter
    your pass phrase and `ssh-agent` remembers it. You have to enter the pass phrase
    only once while logged in to your account. From then on, `ssh-agent` provides
    the OpenSSH clients with the pass phrase and you no longer have to enter a password
    or pass phrase. Life is easy.


    Setting up `ssh-agent` is simple. Follow these steps:


    +   1. **Log in to your user account on the local computer.**

    +   For example, log in as the user `rod` on `cancun`.


    +   2. **Open a GNOME terminal** by clicking the GNOME Menu and choosing **System
    Tools>>Terminal**.


    +   3. **Enter this command:**

    +   ```bash

    +   ssh-add

    +   ```


    +   4. **Enter your pass phrase when you''re prompted.**


    +   5. **Connect to the remote machine** — for example, Cancun:

    +   ```bash

    +   ssh cancun

    +   ```


    You get logged in to your account on the remote machine without having to enter
    a password or pass phrase. This system works great.


    # ## Introducing encryption and security


    Running a simple Web server, such as the one we introduce in Chapter 16, shouldn''t
    require you to make heroic security measures. Serving up static text and graphics
    doesn''t pique the interest of many hackers. However, when you start using the
    Web to do business or process sensitive information, you want to bump up your
    security. You build on the basic Web server and create a secure Web server.


    Use the Secure Sockets Layer (SSL) protocol to construct a secure Web server.
    SSL provides a mechanism that allows your Web server to provide protected and
    authenticated connections. Using SSL with Apache allows the Web server to prevent
    eavesdropping by encrypting the network communications to and from the Web server
    and to identify itself to the client browser.


    SSL provides encryption and ensures identification, as described in the following
    two sections.'
  merge: -1
  img_proc: true
- pgno: 267
  md: "# Part IV: Revenge of the Nerds\n\n# ### Encryption\n\nThe mathematical process\
    \ encryption essentially garbles information so only those with authorization\
    \ can ungarble (and read) it; encryption prevents those you don’t want to read\
    \ your communication from reading it. The process of encryption and decryption\
    \ requires the combination of the mathematical process named encryption algorithm\
    \ and the mathematical entity cryptographic keys (keys, for short). A key is basically\
    \ a very long number that the encryption algorithm uses to hide your message,\
    \ information, or files from unauthorized people.\n\nA description of the mathematical\
    \ process of encryption is beyond the scope of this book, but suffice it to say\
    \ that you need a key to encrypt information and a key to decrypt it. SSL uses\
    \ a type of encryption named public-key encryption. Public-key encryption works\
    \ by having the server use a secret key and the client use a public key. The public\
    \ key can be known and used by anyone and everyone; the private key must be kept\
    \ secret and known only to the server.\n\nPublic-key encryption has an advantage\
    \ over other secret types because distributing public keys across a medium such\
    \ as the Internet is easy. It sounds counterintuitive, but public-key encryption\
    \ does work.\n\n# ### Identification\n\nAll the encryption in the world is useless\
    \ if you’re tricked into connecting to the wrong Web server. Suppose that you\
    \ want to purchase a book from Amazon.com. You fire up Mozilla, connect to www.amazon.com,\
    \ and happily enter your credit card number, expecting to receive your book the\
    \ next day. It never comes.\n\nIn this scenario, some clever hacker has injected\
    \ false DNS information into the Internet, and your browser has connected to www.hackazon.com.\
    \ (Your Web browser looked up the numeric IP address of Amazon.com, but was deceived\
    \ and received the address of the hacker’s fraudulent Web server.) In this case,\
    \ encryption worked just as it was supposed to, and prevented *other* hackers\
    \ from intercepting your credit card. However, it didn’t ensure that the Web server\
    \ was the one you thought it was, and now the hacker is enjoying a wonderful vacation\
    \ in Cancún — the real one — thanks to your credit card. (D’oh!) \n\nSSL identification\
    \ is based on the concept of a certificate. Certificates contain the public key\
    \ you need in order to set up an encrypted connection and additional information\
    \ used to verify the identity of the Web server. The certificate also comes with\
    \ information about who created it, when it was created, and how it was created.\
    \ After you obtain a certificate from the Web server you’re connecting to, you’re\
    \ ready to safely conduct business. (Huh? What good does that do if you’re connecting\
    \ to the hacker’s Web server? The certificate just ensures that you connect securely\
    \ to the bad-boy site.)"
  merge: -1
  img_proc: true
- pgno: 268
  md: 'The problem is solved by using a go-between called a *certificate authority*
    (*CA*). When you connect to a secure Web server, it sends you its certificate.
    The Web server also subscribes to a CA. The CA has investigated the subscribing
    Web server and — if satisfied with its authenticity — vouches for its identity.
    If the CA is on your list of known CAs, you accept the certificate and use the
    public key to verify the server''s identity and set up the encrypted connection.


    # Protecting your Web server with SSL


    A secure Web server requires a *certificate* — a special code used to verify the
    Web server to its clients. The steps in this section describe how to create the
    certificate and work with a certificate authority (CA).


    You can view a list of all the CAs your browser knows about. Follow these steps
    to view the CA list:


    +   1.  **Choose Mozilla Edit > Preferences.**

    +       The Preferences dialog box opens.

    +   2.  **Expand the Privacy & Security menu by clicking the plus (+) sign**

    +       immediately to the left of the menu option.

    +   3.  **Click the Certificates menu.**

    +       The Certificates subwindow opens.

    +   4.  **Click the Manage Certificates button.**

    +       The Certificate Manager window opens behind the Preferences window.

    +   5.  **Click the upper margin of the Preferences window and move it so you**

    +       can see the Certificate Manager window.

    +   6.  **Click to select the Authorities tab and you see a list of all CAs that**

    +       **your browser knows about.**


    Your browser automatically accepts the certificate from any secure Web page you
    visit that subscribes to one of these CAs.


    It costs time and money to subscribe to a CA, of course. However, you don''t necessarily
    need to spend the money if you intend to use your secure Web server for personal
    use (or just to experiment). We show you how to construct a certificate and then
    use it without registering with a CA.


    These steps outline the general process of creating a certificate:


    +   1.  **Install the SSL software.**

    +   2.  **Create your Web server''s private key.**'
