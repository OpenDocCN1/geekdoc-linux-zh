    # Installing Wine


    You have to install Wine after you download it. These steps describe the installation
    process:


    +   1. To install the Wine package, open the Nautilus File Manager by double-clicking
    the Home icon in the upper-left corner of your desktop.


    The Home icon is labeled as X’s Home, where X is the user name that you’re logged
