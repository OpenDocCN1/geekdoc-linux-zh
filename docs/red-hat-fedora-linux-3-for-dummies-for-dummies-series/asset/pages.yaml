- pgno: 332
  md: '# # Appendix A


    ## Fedora Core Administration Utilities


    In This Appendix


    • The Fedora Core system settings

    • The Fedora Core server settings

    • The Fedora Core system tools


    Among Linux distributions, Fedora Core tries to set itself apart from the pack
    by creating utilities to make your life easier. For example, it provides numerous
    system-administration utilities that are integrated, easy to use, and quite powerful.
    These utilities are one reason that Fedora Core wins the market-share competition.
    This appendix outlines the Fedora Core administration utilities.


    You should be able to perform most system-administration tasks by using the utilities
    described in the lists throughout this appendix. The available utilities are organized
    according to the menus on which you find them; the lists given here should help
    you locate the ones you need to manage your Fedora Core computer.


    Not all utilities listed in this appendix are installed by default. Many are installed
    only if you install their respective services. For example, you can use the Apache
    configuration utility only if you install the Apache Web server package. We tell
    you when a utility isn''t installed as part of the Workstation installation type
    that we recommend you install in Chapter 3.


    # ## System Settings


    The system setting utilities are on the GNOME System Settings menu, which you
    find by using the GNOME Menu or the Start Here window:


    +   • **Add/Remove Applications:** Adds and deletes RPM packages. See Appendix
    E for more information.'
  merge: -1
  img_proc: true
- pgno: 333
  md: '+   Authentication: Deals with all forms of Linux user account authentication.
    The default settings should satisfy most people''s needs.


    +   Date & Time: Sets the date, time, and time zone of your Linux computer. You
    can also configure the automatic time synchronizer—the Network Time Protocol (NTP)—daemon.


    +   Display: Allows you to configure both your video driver and monitor. Chapter
    4 provides more information about how to use this utility.


    +   Keyboard: Lets you choose the nationality of your keyboard.


    +   Language: Helps you choose the default language your computer uses.


    +   Login Screen: Lets you configure the look and feel, and other aspects, of
    your login screen.


    +   Network: Configures your network interfaces. You can also use it to turn network
    devices on and off. Refer to Chapters 5, 6, and 7 for examples of how to use this
    tool.


    +   Printing: Configures a printer. Chapter 16 provides an example that uses this
    tool.


    +   Red Hat Network Configuration: Updates your Fedora Core software. Use this
    utility to configure the default RHN configuration.


    +   Root Password: Resets the root password.


    +   Security Level: Enable/disable and configure your workstation''s firewall
    (using iptables). As we discuss in Chapter 3, the Fedora Core installation process
    allows you to enable/disable a firewall and also provides options to allow certain
    external connections such as SSH. The installation also allowed you to enable/disable
    SELinux. This tool allows you to reconfigure those options.


    +   Server Settings: See the next section, "Server Settings."


    +   Soundcard Detection: Detects and configures your sound card. Chapter 12 has
    more instructions.


    +   Users and Groups: Creates new users and groups. You can also modify existing
    ones. Chapter 4 shows how to use this utility.


    # Server Settings


    You display the Server Settings menu by choosing the GNOME Menu>System Settings
    menu and selecting Server Settings. It contains, by default, only the Services
    configuration utility. This list describes the various utilities (beyond the Service
    Configuration) that you can install optionally:


    +   Apache Configuration: Create and modify your Apache Web server. Refer to Chapter
    16 for an introduction to Apache.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '+   ☐ **Domain Name System:** Create and modify your DNS server’s configuration.
    DNS converts Internet names to numeric addresses.


    +   ☐ **NFS:** The Network File System (NFS) allows a computer to share its file
    system with other computers. NFS, which predates Samba, is simpler to configure
    and use but doesn’t provide as much security as Samba.


    +   ☐ **Network Booting Service:** Use this system to boot your computer from
    a network.


    +   ☐ **Samba Server Configuration:** Creates and modifies your Samba server.
    Samba shares files, directories, and printers with other computers on your network.
    Those computers can run Windows, Linux, or Unix; Linux and Unix computers, however,
    must run the Samba client software to connect to a Samba server.


    +   ☐ **Services:** Controls all the services that your Fedora Core computer can
    run. You can start, stop, or restart any server as well as set a service to start,
    or not start, at boot time.


    # # System Tools


    Click the GNOME Menu and choose System Tools to find these tools:


    +   ☐ **Archive Manager:** Starts the File Roller utility used to create, modify,
    and unpack various archive files. You find the tape archive (TAR) system used
    most often on Linux and Unix computers. This utility also works with ZIP, ARJ,
    and other protocols.


    +   ☐ **Configuration Editor:** Starts the GConf editor. GConf edits the GNOME
    configuration, its utilities, and other general application-oriented applications
    and utilities.


    +   ☐ **Disk Management:** Mounts, dismounts, and formats specific file systems
    and devices.


    +   ☐ **Floppy Formatter:** Formats floppy disks.


    +   ☐ **Hardware Browser:** Displays information about your computer’s hardware
    subsystems. Appendix B has more information about this tool.


    +   ☐ **Internet Configuration Wizard:** Lets you create network interfaces. Refer
    to Chapters 5, 6, and 7 for examples of how to work with this tool.


    +   ☐ **Kickstart:** Helps you automate and customize Fedora Core installations.
    Use it to record and customize the settings that created your current Fedora Core
    installation and use that template to create new installations.


    +   ☐ **Network Device Control:** Turns your network devices on and off.


    +   ☐ **Red Hat Network:** Starts the RHN up2date utility.'
  merge: -1
  img_proc: true
- pgno: 335
  md: '+   * **Red Hat Network Alert Icon:** Indicates that an RHN update is available.

    +   * **System Logs:** Shows the contents of your system logs.

    +   * **System Monitor:** Displays information about your computer''s running
    processes. This utility also shows the recent history of your computer''s processor
    and memory use.

    +   * **Terminal:** Starts the GNOME Terminal. You can use the Terminal to interact
    with your computer minus the fancy on-screen graphics. Refer to Chapter 4 for
    information about using the Terminal.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Appendix B


    # # Discovering Your Hardware''s True Identity


    In This Appendix


    +   * PC hardware subsystems

    +   * Hard-drive controllers

    +   * Computer memory

    +   * Hardware identification on Windows 9x and Windows Me computers

    +   * Hardware identification on Windows NT, Windows 2000, and Windows XP computers


    You should know as much about your computer as possible before installing Fedora
    Core. This appendix introduces the basic systems that make up a computer. We also
    show you how to discover information about those parts.


    Knowing your hardware can be useful at parties: “My processor is faster than your
    processor!” In addition to letting you brag at parties, this knowledge can be
    helpful if you have problems installing Fedora Core 3 as described in Chapter
    3. Understanding the bits and pieces that comprise your computer also lets you
    know better what your new Linux computer is capable of. This appendix helps you
    get started on your path to self-discovery.


    Linux runs on Intel processors from the venerable 386 on up to the Digital Equipment
    Corporation (DEC) Alpha, Sun SPARC, and other systems. However, the version of
    Fedora Core included with this book works on only Intel 386-, 486-, and Pentium-based
    computers. That shouldn’t be a problem because it seems 99.9 percent (well, maybe
    not quite that many) of the world’s computers use Intel.


    ![](img/41feae212f5c6612ff709354891f7b39_336_0.png)


    # ## Breaking Down Your Computer


    No, we don’t want you to break your computer. But we do want to describe the computer
    subsystems. Computers may seem mysterious when you first'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'use them, but the truth is that they''re not terribly complex. When you look
    at the parts that make up a PC, you see that each one performs a specific task.
    The sum of the parts equals a computer. This list outlines the subsystems that
    comprise a computer:


    +   - **Central processing unit (CPU):** The CPU, or microprocessor, is often
    referred to as the brains of a computer because the CPU controls, in minute detail,
    everything the computer does. CPUs are controlled by software that is essentially
    a recipe for doing tasks as simple as detecting keyboard input or as complex as
    communicating across networks to display pictures in a Web browser.


    The most common CPUs running current PCs are now Intel Pentiums; chances are you
    have one in your PC. Generally, the faster the CPU, the faster your computer.
    CPU speed is measured in *megahertz* (MHz), which means millions of cycles per
    second. To perform complex tasks, such as sending e-mail, a CPU has to perform
    many simple tasks, or *instructions*, to complete the larger one. Although the
    simplest instructions require a single CPU cycle, most require several cycles.
    By and large, however, the MHz measurement is a reasonably good measure of how
    fast a microprocessor runs.


    +   - **Hard drives:** Hard drives, also referred to as hard disks, store all
    the permanent information on a computer. The actual disks are metalal platters
    that store bits and bytes in tiny magnetic domains (*spots*). The disk spins,
    and a magnetic head that floats on a cushion of air reads and writes from the
    disk. The spinning disk allows gives the head quick access to any location on
    the disk and also creates the air cushion.


    +   - **Disk controllers:** The disk controller connects the drive to the computer''s
    microprocessor. Several types of controllers are commonly used: IDE, USB, FireWire,
    and SCSI. Most PCs come with IDE internal hard drives. However, high-performance
    computers tend to use SCSI-based drives because they''re faster (and more expensive).
    IDE controllers can connect as many as four drives.


    +   - **CD-ROM:** CD-ROMs store information in much the same way as hard drives
    do, but use light rather than magnetic fields to write the data. Most PCs use
    IDE-based CD-ROMs. SCSI CD-ROMs are faster (as are SCSI hard disks). Because the
    prices of USB and FireWire CD-ROMs are dropping fast, they''re becoming more common.


    +   - **RAM, or Random-Access Memory:** Working in RAM is much faster than from
    hard disks and CD-ROMs. Because RAM is used to store temporary information, programs,
    data, and other types of information that are stored in RAM — it "forgets" everything
    when power to the computer is turned off. RAM is measured in megabytes (MB). A
    *megabyte* is roughly one million bytes.


    +   - **Mouse:** Not all mice are created equal. Which type of mouse do you have
    — bus, PS/2, or serial? How many buttons does it have? If you have a serial mouse,
    which COM port is it attached to and which protocol (Microsoft or Logitech) does
    it use?'
  merge: -1
  img_proc: true
- pgno: 338
  md: '+   - **Monitor/flat-panel display:** What are the make and model of the monitor
    or flat-panel display? What are its vertical and horizontal refresh rates? You
    need this information only if you plan to use the X Window System, the graphical
    portion of Linux. Monitors and flat-panel displays perform exactly the same function,
    but with different technologies. Monitors are the ubiquitous, heavy, television-like,
    glass vacuum-tube devices that are quickly being replaced by flat-panel displays.
    These screens use liquid crystal display (LCD) technology, which uses less power
    and space.


    +   - **Video card:** What are the make and model number of the video card or
    video chip set, and what is the amount of video RAM?


    +   - **Network interface card (NIC):** If you have a network connection, what
    are the make and model number of the network interface card?


    That’s the rundown of computer subsystems. Each one performs a specific function;
    buttoned up inside a computer *chassis* (whether a desktop box or laptop); they
    work together to create the computer you’re familiar with. The next two sections
    describe hard drives and memory in more detail.


    # ## Understanding Hard-Drive Controllers


    The two main types of hard drives are IDE and SCSI, and each type has its own
    controller. IDE is more common in PCs; newer PCs usually have two IDE controllers
    rather than one. For each IDE controller, your system can have only two hard drives:
    a master and a slave. Therefore a PC with two IDE controllers can have as many
    as four hard drives. You should know which hard drive is which. Also, if you have
    a Windows system that you want to preserve, you should know on which hard drive
    it resides. The following list shows a normal configuration on a Windows system:


    +   - The first controller’s master drive is named C.

    +   - The next hard drive, named D, is the slave drive on the first controller.

    +   - The next hard drive, E, is the master drive on the second controller.

    +   - The last hard drive, F, is the slave drive on the second controller.


    Windows is normally located on drive C, and your data is on your other drives.
    This lettering scheme is one possibility; your hard drives may be set up differently
    and may include CD-ROMs as drives on your IDE controllers.


    Some high-end PCs have SCSI controllers on their motherboards or on separate SCSI
    controller boards, either in addition to or instead of the IDE controllers. Older
    SCSI controllers can have as many as eight devices on them, numbered from 0 to
    7, including the controller. Newer SCSI controllers (*known as wide controllers*)
    can have as many as 16 devices, including the controller itself.'
  merge: -1
  img_proc: true
- pgno: 339
  md: "# 322  Part VI: Appendices\n\nIf all you have is a SCSI hard drive, Drive 0\
    \ or Drive 1 is usually your drive C, and others follow in order.\n\nIf you have\
    \ a mixture of IDE and SCSI controllers, your drive C could be on any of them.\
    \ The sections “Discovering Your Windows 9x or Windows Me Hardware” and “Discovering\
    \ your Windows NT, Windows 2000, or Windows XP Hardware,” later in this appendix,\
    \ show you how to identify how many hard drives you have, which type(s) they are,\
    \ and which controllers they’re attached to.\n\nConsidering putting Fedora Core\
    \ on a separate hard drive, away from any Windows operating system, for a couple\
    \ of reasons. First, you can now find 80GB hard drives for well under \\$100 (U.S.).\
    \ Second, it’s a pretty daunting task (at worst, nearly impossible) to shrink\
    \ MS-DOS and Windows till they’re small enough to allow Fedora Core to reside\
    \ in its full glory on an existing hard drive. Also, although technically you\
    \ can split the Fedora Core distribution and put it on several hard drives, doing\
    \ so makes updating the distribution difficult later.\n\n![](img/41feae212f5c6612ff709354891f7b39_339_0.png)\n\
    \n# A Bit About Memory Bytes\n\nMemory is the most important factor in determining\
    \ how fast your computer runs. Computers use Random-Access Memory (RAM) to store\
    \ and access the operating system, programs, and data. The Intel processor usually\
    \ has the following amounts of RAM (main memory):\n\n+   Linux can run on a surprisingly\
    \ small amount of memory. With some work and no graphics, you can squeeze Linux\
    \ onto an old PC with only 16MB of memory; 32MB makes life much easier and your\
    \ computer significantly faster.\n+   \n+   Many people use suitable old PCs with\
    \ small amounts of memory as simple network servers.\n\n![](img/41feae212f5c6612ff709354891f7b39_339_1.png)\n\
    \n+   If you want to run Linux with graphics, however, you need 64MB.\n\n+   With\
    \ 128MB, Fedora Core runs multiple graphical programs (such as OpenOffice.org)\
    \ with ease.\n\n+   You need 256MB or more (many PCs now come standard with 512MB)\
    \ for hard-core computing. Using big applications, such as VMware, makes having\
    \ enough memory essential.\n\nVMware virtual computers need their own RAM to operate\
    \ at a reasonable speed; for example, you should allocate a minimum of 128MB of\
    \ memory to run a Windows 2000 virtual computer. Plan to use 512MB if you want\
    \ to run multiple instances of VMware virtual computers.\n\n![](img/41feae212f5c6612ff709354891f7b39_339_2.png)"
  merge: -1
  img_proc: true
- pgno: 340
  md: 'You can install Fedora Core on most laptop computers by using the notebook''s
    built-in CD-ROM drive, or a PCMCIA, USB, or proprietary CD-ROM drive. If you don''t
    have any of these items, you can try to get a PCMCIA Ethernet controller and do
    a network installation, as long as another Linux system on the network has a CD-ROM
    drive installed. If that''s the course you take, consult the Fedora Core installation
    documentation at www.redhat.com/support. You also need a video card that Fedora
    Core understands. Fedora Core supports most video cards, and usually the only
    problems result from bleeding-edge notebook computers that use the latest and
    greatest video hardware. You can use the generic VGA, XGA, or SVGA drivers that
    Fedora Core supplies if you cannot find the specific driver.


    # # Discovering Your Windows 9x or Windows Me Hardware


    You don''t have to go to Hollywood to be discovered — provided you''re a piece
    of computer hardware. Windows provides the tools to discover your bits and pieces
    right at home. This section describes how to use Windows 9x or Windows Me (which
    Microsoft will still support for a while yet) for the discovery process.


    If you have a Windows 9x or Windows Me computer, use this section to discover
    and display information about your computer. Use the ubiquitous Control Panel.
    Start your Windows computer and follow these instructions:


    +   1. Click the **Start** button and choose **Settings: Control Panel**. Double-click
    the **System** icon and select the **Device Manager** tab.


    +   2. At the top of the screen, select **View Devices by Connection**. This step
    shows you all components and how they relate to each other.


    +   3. On the **Device Manager** tab (from the **Control Panel**) in the **System
    Properties** dialog box, select the **View Devices by Type** option.


    On the list, notice how a plus (+) or minus (−) sign precedes some icons. A plus
    sign indicates that the entry is collapsed. A minus sign indicates that the entry
    is expanded to show all subtrees.


    +   4. Click the **plus (+) sign** to expand the list.


    Expanding the list shows each computer subsystem. Every device that makes up your
    computer is shown. Right-click a device and choose the **Properties** option to
    display information about a particular device.


    You can use the Web to find out about your computer. Computer companies provide
    detailed information about their products on their Web sites. Go to the manufacturer''s
    Web page and look up your computer''s model number. When you get to your page,
    look for the **Specification** (or **Specs**) link.'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# # Discovering Your Windows NT, Windows 2000, or Windows XP Hardware


    Discovering information about a system running Windows NT, Windows 2000, and Windows
    XP is similar to making the same discovery on a Windows 9x or Windows Me system.
    The process is the same, although getting there is a little different:


    On Windows NT and Windows 2000 computers, follow these steps:


    +   1. Click the **Start** button and choose **Settings Control Panel**. Then,
    double-click the **System** icon in the **Control Panel** window.

    +   2. Click the **Hardware** tab when the **System Properties** window opens.
    Then, click the **Device Manager** button to open the **Device Manager** window.

    +   3. Click the plus (+) sign of any hardware subsystem you want to examine.

    +   A submenu opens, showing you all the devices of a particular type.

    +   4. **Right-click** any hardware subsystem and choose **Properties**.

    +   The **Properties** option shows you information about that particular device.


    On Windows XP computers, follow these steps:


    +   1. Click the **Start** button and choose the **My Computer** option.

    +   2. **Double-click** the **Control Panel** icon.

    +   3. **Double-click** the **System** icon, select the **Hardware** tab, and
    then double-click the **Device Manager** button.

    +   The **Device Manager** window opens.

    +   4. Click the plus (+) sign to display the devices within a subsystem.

    +   5. **Right-click** a device to open a menu from which you can choose the **Properties**
    option.

    +   The **Properties** window opens and shows information about the device.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# Appendix C

    Filing Your Life Away


    # In This Appendix


    +   - Finding out all about Linux files and directories

    +   - Navigating the Linux file system

    +   - Creating, moving, copying, and destroying directories and files

    +   - Changing file ownership and permissions


    In this appendix, you step boldly through the Linux file and directory structure.
    Don''t worry: Linux may live a structured life, but it''s still flexible. With
    a little bit of introduction, you can quickly get the hang of the Linux way of
    life.


    We also introduce you to file types, subdirectories, paths, and the root directory.
    You''re also shown the way home — to your home directory. After you''re oriented
    to the Linux files-and-directories structure, we show you how to make some changes,
    such as how to copy and move files and directories and how to — eek! — destroy
    them.


    # Getting Linux File Facts Straight


    Linux files are similar to Unix, DOS, Windows, and Macintosh files. All operating
    systems use files to store information. Files allow you to organize your stuff
    and separate your information. For example, the text that makes up this appendix
    is stored in a file — as is every other chapter, each in its own file. Follow
    the bouncing prompt as we make short work of long files.


    # Storing files


    We assume that you know that a file is a discrete collection of information identified
    by a filename — and that Linux can store multiple files in directories, as long
    as the files have different names. (Linux stores any files with the same name
    in different directories.)'
  merge: -1
  img_proc: true
- pgno: 343
  md: 'Wonderful or not, Linux filenames can be as long as 256 characters. The file-names
    can contain uppercase and lowercase letters (also known as *mixed case*), numbers,
    and special characters, such as underscores (_), dots (.), and hyphens (-) and
    spaces. Because filenames can be composed of mixed-case names, and because each
    name is distinct, these names are *case sensitive*. For example, the names FILENAME,
    filename, and FileNAme are unique filenames of different files, although they’re
    made up of the same letters.


    Although filenames technically can contain wildcard characters, such as asterisks
    (*) and question marks (?), using them isn’t a good idea. Various command interpreters,
    or *shells*, use wildcards to match several filenames at once. If your filenames
    contain wildcard characters, you have trouble specifying *only* those files. We
    recommend that you create filenames that don’t contain spaces or other characters
    that have specific meanings to shells. That’s one way Linux filenames are different
    from DOS and Windows filenames.


    ![](img/41feae212f5c6612ff709354891f7b39_343_0.png)


    # Sorting through file types


    Linux files can contain all sorts of information. In fact, Linux sees every device
    — disk drives, monitor, mouse, or keyboard, for example — as a file; the only
    exception is a network interface. These five file categories eventually become
    the most familiar to you:


    +   ✔ **User data files**: These contain information you create. User data files,
    sometimes known as *flat files*, usually contain the simplest data, consisting
    of plain text and numbers. More complex user data files, such as graphics or spreadsheet
    files, must be interpreted and used by special programs. These files are mostly
    illegible if you look at them with a text editor because their content isn’t always
    ASCII text. Changing these files generally affects only the user who owns the
    files.


    +   ✔ **System data files**: These are used by the system to keep track of users
    on the system, logins, and passwords, for example. As system administrator, you
    may be required to view or edit these files. As a regular user, you need not be
    concerned with system data files (except, perhaps, the ones you use as examples
    for your own, private startup files).


    +   ✔ **Directory files**: These hold the names of files — and other directories
    — that belong to them. These files and directories are called *children*. Directories
    in Linux (and Unix) are just another type of file. If you’re in a directory, the
    directory above it is the *parent*. Isn’t that homey?


    When you list files with the `ls -l` command, it displays a list of files and
    directories. Directory files (for example) begin with the letter d, so they’re
    easy to spot in this example:


    ```

    lidia@cancun lidia]$ ls -l

    drwxr-xr-x  5 lidia  lidia  1024 Aug  3  2004 Desktop

    drwx------  2 lidia  lidia  1024 Aug 10  2004 nsmail

    ```'
  merge: -1
  img_proc: true
- pgno: 344
  md: "❖ **Special files**: These represent either hardware devices (such as disk\
    \ drives, tape drives, or keyboards) or some type of placeholder that the operating\
    \ system uses. The /dev directory holds many of these special files. You can see\
    \ this directory by running this command at a command prompt:\n\n    ls -l /dev\n\
    \n❖ **Executable files**: These contain instructions (usually called *programs*\
    \ or *shell scripts*) for your computer. When you type the name of one of these\
    \ files, you’re telling the operating system to *execute* the instructions. Some\
    \ executable files look like gibberish, and others look like long lists of computer\
    \ commands. Many of these executable files are located in /bin, /usr/bin, /sbin,\
    \ and /usr/sbin.\n\n# Understanding files and directories\n\nIf you live in the\
    \ Windows world, you can think of a Linux file system as one huge file folder\
    \ that contains files and other file folders, which in turn contain files and\
    \ other file folders, which in turn contain files and — well, you get the point.\
    \ In fact, the Linux file system is generally organized in this way. One big directory\
    \ contains files and other directories, and all the other directories in turn\
    \ contain files and directories.\n\n# Directories and subdirectories\n\nA directory\
    \ contained, or *nested*, in another directory is a *subdirectory*. For example,\
    \ the directory named /mother may contain a subdirectory named /child. The relationship\
    \ between the two (even if they don’t have such family-derived filenames) is referred\
    \ to as *parent-and-child*. The full name of the subdirectory is /mother/child,\
    \ which would make a good place to keep a file named /mother/child/reunion that\
    \ contains information about a family reunion.\n\n# The root directory\n\nIn the\
    \ tree directory structure of Linux, DOS, and Unix, the big directory at the bottom\
    \ of the tree is the *root directory*. The *root directory* is the parent of all\
    \ other directories (the poor guy must be exhausted) and is represented by a single\
    \ / symbol (pronounced “slash”). From the root directory, the whole directory\
    \ structure grows like a tree, with directories and subdirectories branching off\
    \ like limbs.\n\n![](img/41feae212f5c6612ff709354891f7b39_344_0.png)\n\nIf you\
    \ could turn the tree over so that the trunk is in the air and the branches are\
    \ toward the ground, you would have an *inverted tree* — which is how the Linux\
    \ file system is normally drawn and represented (with the tree’s root at the top).\
    \ If we were talking about Mother Nature, you would soon have a dead tree. Because\
    \ the subject is computer technology, however, you have something that looks like\
    \ an ever-growing, upside-down tree."
  merge: -1
  img_proc: true
- pgno: 345
  md: '# Moving Around the File System


    # What''s in a name?


    You name directories in the same way as you name files, following the same rules.
    Almost the only way you can tell whether a name is a filename or a directory name
    is the way the slash character ( / ) is used to show directories nested in other
    directories. For example, **usr/local** means that *local* is in the *usr* directory.
    You know that *usr* is a directory because the trailing slash character tells
    you so; however, you don''t know whether *local* is a file or a directory.


    If you issue the `ls` command with the `-f` option, Linux lists directories with
    a slash character at the end, as in `local/`, so you know that *local* is a directory.


    ![](img/41feae212f5c6612ff709354891f7b39_345_0.png)


    The simplest way to tell whether the slash character indicates the **root** directory,
    other separate directories, or directories and files, is to see whether anything
    appears before the slash character in the *directory-path specification* (a string
    that shows exactly which directories and subdirectories you have to go through
    to get to the file). If nothing appears before the slash, you have the *root*
    directory. For example, you know that */usr* is a subdirectory or a file in the
    *root* directory because it has only a single slash character in front of it.


    # Home again


    Linux systems have a directory named **/home**, which contains the user''s home
    directory, where she can


    +   - Store files

    +   - Create more subdirectories

    +   - Move, delete, and modify subdirectories and files


    Linux system files and files belonging to other users are never in a user''s **/home**
    directory. Linux decides where the *home* directory is placed, and that location
    can be changed only by a superuser (*root*), and not by general users. Linux is
    dictatorial because it has to maintain order and keep a handle on security.


    # Moving Around the File System


    You can navigate the Linux file system without a map or GPS (Global Positioning
    System). All you need to know are two commands: `pwd` and `cd`. (You run these
    commands from the command line.) However, you also need to know where to start
    — hence the usefulness of the next section.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# Figuring out where you are


    Log in to your Fedora Core computer and open a GNOME Terminal session. In this
    case, as an example, you log in as the user `lida`. To find out where you are
    in the Linux file system, simply type **pwd** at the command prompt:


    ```

    ```

    [lida@cancun lida]$```


    ```


    You receive this response:


    ```

    ```

    /home/lida```


    ```


    This response indicates that you’re logged in as *lida* and are in the */home/lida*
    directory. Unless your alter ego is out there, you should be logged in as *yourself*
    and be in the */home/yourself* directory, where *yourself* is your login name.


    The **pwd** command stands for *print working directory*. Your *working directory*
    is the default directory where Linux commands perform their actions; the *working
    directory* is where you are in the file system when you type a command. When you
    type the `ls(1)` command, for example, Linux shows you the files in your working
    directory. Any file actions on your part occur in your working directory unless
    you’re the **root** user. For security reasons that we don’t go into here, the
    **root** user isn’t configured by default to be able to work on the current working
    directory. You can change this setting, but the **root** user generally must explicitly
    specify the working directory. For example, if you are **root** and are in the
    */etc* directory and you want to indicate the *hosts* file, you must type **cat
    /hosts** rather than just **cat hosts**.


    If you use this command:


    ```

    ```

    ls -la```


    ```


    you see only the files in your working directory. If you want to specify a file
    that isn’t in your working directory, you have to specify the name of the directory
    that contains the file in addition to the name of the file. For example, this
    command lists the *passwd* file in the */etc* directory:


    ```

    ```

    ls -la /etc/passwd```


    ```


    # Specifying the directory path


    If the file you want to read is in a subdirectory of the directory you’re in,
    you can reach the file by typing a relative filename. *Relative paths* specify
    the location of files relative to where you are.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '![](img/41feae212f5c6612ff709354891f7b39_347_0.png)


    In addition to what we discuss earlier in this appendix about specifying directory
    paths, you need to know these three rules:


    +   - One dot (.) always stands for your current directory.

    +   - Two dots (..) specify the parent directory of the directory you''re in.

    +   - All directory paths that include (.) or (..) are relative directory paths.


    You can see these files by using the -a option of the ls (1) command. Without
    the -a option, the ls (1) command doesn''t bother to list the ., .., files, or
    any filename beginning with a period. This statement may seem strange, but the
    creators of Unix thought that having some files normally hidden keeps the directory
    structure cleaner. Therefore, filenames that are always present (. and ..) and
    special-purpose files are hidden. The types of files that should be hidden are
    those a user normally doesn''t need to see in every listing of the directory structure
    (for example, files used to tailor applications to the user''s preferences).


    Specify a path relative to where you are. Here''s an example:


    ```

    ```bash

    cd /etc

    ls -la ../etc/passwd

    ```

    ```


    The first command moves you to the /etc directory, where the passwd file resides;
    the command uses an absolute path (/etc) in this case. The second command redundantly
    starts one directory up (..) and then looks in the /etc directory for the passwd
    file. You move up one directory level and then back down to /etc; this demonstrates
    the use of relative paths (../etc/passwd).


    If you want to see the login accounts on your system, you can issue this command
    from your home directory:


    ```

    ```bash

    ls -la ..

    ```

    ```


    This command lists the parent directory. Because the parent directory (/home)
    has all the login directories of the people on your system, this command shows
    the names of their login directories.


    You have been looking at relative pathnames, which are relative to where you are
    in the file system. Filenames that are valid from anywhere in the file system
    are absolute paths. These filenames always begin with the slash character (,),
    which signifies the root directory. Here''s an example with two:


    ```

    ```bash

    ls -la /etc/passwd

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# Changing your working directory


    You occasionally (often?) want to change your working directory. Why? We''re glad
    you asked — because changing it enables you to work with shorter relative pathnames.
    To do so, you simply use the `cd` (for *change directory*) command.


    To change from your working directory to the /usr directory, for example, type
    this command:


    ```

    cd /usr

    ```


    # Going home


    If you type `cd` by itself, without any directory name, you return to your home
    directory. Just knowing that you can easily get back to familiar territory is
    comforting. There’s no place like home.


    You can also use `cd` with a *relative* specification, like this:


    ```

    cd ..

    ```


    If you’re in the directory /usr/bin and type the preceding command, Linux takes
    you to the parent directory named /usr:


    ```

    cd /usr/bin

    cd ..

    ```


    +   - **TIP** Here are a couple of tricks: If you type `cd ~`, you go to your
    home directory (the tilde symbol (~) is synonymous with /home/username). If you
    type `cd ~username`, you can go to that user’s home directory. On very large systems,
    this command is useful because it eliminates the need for you to remember — and
    type — large directory specifications.


    This list describes the shell redirection symbols:


    +   - `>` is known as *redirect standard output*. When you use it, you tell the
    computer “Capture the information that normally goes to the screen, create a file,
    and put the information in it.”

    +   - `>>` is known as *append standard output*. When you use this symbol, you
    tell the computer “Capture the information that would normally go to the screen
    and append the information to an existing file. If the file doesn’t exist, create
    it.”'
  merge: -1
  img_proc: true
- pgno: 349
  md: '◁ < tells the computer, “Feed the information from the specified file to standard
    in (also known as standard input), acting as though the information is coming
    from the keyboard.”


    # # Manipulating Files and Directories


    Linux has many ways to create, move, copy, and delete files and directories. Some
    features are so easy to use that you need to be careful: Unlike other operating
    systems, Linux doesn’t tell you that you’re about to overwrite a file — it just
    follows your orders and overwrites!


    ![](img/41feae212f5c6612ff709354891f7b39_349_0.png)


    We have said it elsewhere in this book, and we’ll say it again: Make sure that
    you’re not logged in as the root user when you read through these sections. You
    can unintentionally harm your computer when you’re logged in as root. As root,
    or the superuser, you can erase any file or directory — regardless of which permissions
    are set. Be careful!


    # ## Creating directories


    To create a new directory in Linux, you use the mkdir command (there’s an identical
    command in MS-DOS). It looks like this:


    ```

    ```text

    mkdir newdirectory

    ```

    ```


    This command creates a subdirectory under your current or working directory. If
    you want the subdirectory under another directory, change to that directory first
    and then create the new subdirectory.


    Create a new directory named cancun. Go ahead — do it:


    ```

    ```text

    mkdir cancun

    ```

    ```


    (Can you tell where we would rather be right now?)


    Create another directory named veracruz:


    ```

    ```text

    mkdir veracruz

    ```

    ```


    Then change the directory to put yourself in the cancun directory:


    ```

    ```text

    cd cancun

    ```

    ```


    Now, verify that you’re in the directory cancun:


    ```

    ```text

    pwd

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'Appendix C: Filing Your Life Away 333


    # Moving and copying files and directories


    The commands for moving and copying directories and files are mv for move and
    cp for copy. If you want to rename a file, you can use the mv command. No, you’re
    not really moving the file, but the Linux (and Unix) developers realized that
    renaming something was much like moving it. The format of the move command is


    ```

    my source destination

    ```


    Create a file that you can practice moving. The touch command updates the time
    stamp on an existing file or creates an empty file if it doesn’t exist. In this
    case, the file test doesn’t exist and is created by touch:


    ```

    touch go

    ```


    Move the new file:


    ```

    mv go to

    ```


    This command leaves the file in the same directory and changes its name to to.
    The file wasn’t really moved — just renamed.


    Try moving the to file to the veracruz directory. To do that, you have to first
    move the file up and then move it into the veracruz directory. You can do it with
    one command:


    ```

    mv to ../veracruz

    ```


    ![](img/41feae212f5c6612ff709354891f7b39_350_0.png)


    REMEMBER


    The destination file uses the double-dot (..) designation; every directory contains
    a double-dot directory that points to the parent directory. This command tells
    Linux to go up one directory level and look for a directory named veracruz and
    then put the file into that directory with the name newto because you didn’t specify
    any other name. If you do this instead:


    ```

    mv go ../veracruz/now

    ```


    the go file moves to the veracruz directory named now. Note that in both cases
    (with the file maintaining its name, go, or taking the new name now), your current
    directory is still cuncun and all your filenames are relative to that directory.


    ![](img/41feae212f5c6612ff709354891f7b39_350_1.png)


    TECHNICAL STUFF


    Strictly speaking, the file still hasn’t really moved. The data bits are still
    on the same part of the disk as they were originally. The file specification (the
    directory path plus the filename) you use to talk about the file is different,
    so it appears to have moved.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# Part VI: Appendices


    # Removing files and directories


    The command for removing, or deleting, a file is rm. Using rm is straightforward.
    For example, create a dummy file to erase:


    ```

    touch junk

    ```


    You can delete the file with this command:


    ```

    rm junk

    ```


    You have removed the dummy file from the current directory. To remove a file from
    another directory, you need to provide a relative filename or an absolute filename.
    For example, if you want to expunge now from the veracruz directory, you type
    this line:


    ```

    rm ../veracruz/now

    ```


    ![](img/41feae212f5c6612ff709354891f7b39_351_0.png)


    You can use metacharacters (similar in many ways to Windows wildcards) with rm,
    but be very careful if you do so! When files are removed in Linux, they''re gone
    forever — kaput, vanished — and cannot be recovered.


    The following command removes everything in the current directory and all the
    directories under it that you have permission to remove:


    ```

    rm -r *

    ```


    ![](img/41feae212f5c6612ff709354891f7b39_351_1.png)


    Do not give this command as root (the superuser)! You should always be careful
    when you''re running any command as root, but be especially careful with commands
    that can erase entire directories and file systems.


    ![](img/41feae212f5c6612ff709354891f7b39_351_2.png)


    To decrease the danger of removing lots of files inadvertently when you use metacharacters,
    be sure to use the -i option with rm, cp, mv, and various other commands. The
    -i option, which means interactive, lists each file filename to be removed (with
    the rm command) or overwritten (with the mv or cp command). If you answer either
    y or Y to the question, the file is removed or overwritten, respectively. If you
    answer anything else, Linux leaves the file alone.


    You can remove not only files but also directories. Suppose that you have an old
    directory, /tmp/junk, that you don''t need any more. You can remove it and all
    its contents by typing this:


    ```

    rm -rf /tmp/junk

    ```


    Giving the rm command these options (r and f) removes the /tmp/junk directory
    and all files and directories under it. The r option means to remove recursively;
    in recursion, the command works through every subdirectory in the parent directory.
    The f option issues the command forcefully. No prompts are given.'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# # Changing File Ownership and Granting Permissions


    All Linux files and directories have owners and are assigned a list of permissions.
    This system of **ownership** and **permissions** forms the basis for restricting
    and allowing users'' access to files. File permissions can also be used to specify
    whether a file is executable as a command and to determine who can use the file
    or command.


    Files and directories are owned by user accounts. User accounts are defined in
    the `/etc/passwd` file. For example, you created the **root** (superuser) user
    account when you installed Fedora Core in Chapter 3, and the installation system
    created the superuser home directory, **/root**, plus several configuration files
    (for example, ` .bashrc`). The **root** user owns all those files and directories.
    If you created a regular user account — for example, **lidia** — that user’s home
    directory and configuration files are all owned by user **lidia**. Users can access
    and modify any files or directories they own.


    Files and directories all have group ownership in addition to user ownership.
    Groups are defined by the `/etc/group` file and provide a secondary level of access.
    For example, you can assign group ownership to files you own and allow other users
    who belong to the group to access those files.


    Files and directories are assigned permissions that permit or deny read, write,
    and execute access. Permissions are assigned to the owner, group, or non-owner
    of the file or directory. Any non-owner is referred to as **other**. Permissions
    for the owner, for the group, and for any others are independent of each other.


    Using the `ls` command with the `-l` option allows you to see the file’s permissions
    along with other relevant information, such as who owns the file, which group
    of people have permission to access or modify the file, the size of the file or
    directory, the last time the file was modified, and its name.


    First, create a file and then list it:


    ```

    ```bash

    touch gotowork

    ls -l gotowork

    ```

    ```


    You get this response:


    ```

    ```bash

    -rw-rw-r-- owner group 0 Jul 26 16:00 gotowork

    ```

    ```


    The `-rw-rw-r--` characters are the permissions for the `gotowork` file: The owner
    is you, and the group (though it’s probably you) may be someone or something else,
    depending on how your system is set up and administered.'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'You may be wondering how you can become an owner of a file. You''re automatically
    the owner of any file you create, which makes sense. As the owner, you can change
    the default file permissions — and even the ownership. If you change the file
    ownership, however, you lose ownership privileges.


    To change the ownership of a file or a directory, use the **chown (change ownership)**
    command. You generally have to be the **root** to do this.


    Suppose that you have decided to settle down and lead a more contemplative life,
    one more in line with a new profession of haiku writing. Someone else will have
    to plan the weekend spreads and all-night bashes. You give up ownership of the
    **gotowork** file:


    ```

    ```code

    chown root gotowork

    ```

    ```


    This command changes the ownership of **gotowork** to the **root**. To change
    it back, you can use the **chown** command, but you have to do it as **root**.


    Files and users all belong to **groups**. In the **gotowork** example, the group
    consists of users. Having groups enables you to give large numbers of users —
    but not all users — access to files. Group permissions and ownership are handy
    for making sure that the members of a special project or workgroup have access
    to files needed by the entire group.


    To see which groups are available to you on your system, look at the file **/etc/group**.
    Use the **more** command and you see a file something like this:


    ```

    ```code

    root:x:0:root

    bin:x:1:root,bin,daemon

    ...

    nobody:x:99:

    users:x:100:

    floppy:x:19:

    .....

    your_user_name:x:500:your_user_name

    ```

    ```


    where **your_user_name** is the login name you use for your account. Remember
    that the file doesn''t look exactly like this — just similar. The names at the
    beginning of the line are the **group names**. The names at the end of the line
    (such as **root**, **bin**, and **daemon**) are **user group names** that can
    belong to the user-group list.


    To change the group the file belongs to, log in as **root** and use the **chgrp**
    command. Its syntax is the same as that of the **chown** command. For example,
    to change the group that **gotowork** belongs to, you issue this command:


    ```

    ```code

    chgrp newgroupname gotowork

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 354
  md: '![](img/41feae212f5c6612ff709354891f7b39_354_0.png)


    Fedora Core assigns a unique group to each user. For example, when you add the
    first user to your system, that user gets the user ID and group ID of 500. The
    next user receives the user ID and group ID of 501, and so on. This system gives
    you lots of control over who gets what access to your files.


    # ## Making Your Own Rules


    You, as the owner of a file, can specify permissions for reading, writing to,
    or executing a file. You can also determine who (yourself, a group of people,
    or everyone in general) can do these actions on a file. What do these permissions
    mean? Read on (you have our permission):


    +   * **Read permission:** You can read the file. For a directory, read permission
    allows the `ls` command to list the names of the files in the directory. You must
    also have execute permission for the directory name to use the `-l` option of
    the `ls` command or to change to that directory.

    +   * **Write permission:** You can modify the file. For a directory, you can
    create or delete files inside that directory.

    +   * **Execute permission:** You can type the name of the file and execute it.
    You cannot view or copy the file unless you also have read permission. Files containing
    executable Linux commands, called *shell scripts*, must therefore be both executable
    and readable by the person executing them. Programs written in a compiled language,
    such as C, however, must have only executable permissions, to protect them from
    being copied where they shouldn’t be copied.


    For a directory, execute permission means that you can change to that directory
    (with `cd`). Unless you also have read permission for the directory, `ls -l` doesn’t
    work. You can list directories and files in that directory, but you cannot see
    additional information about the files or directories by using just an `ls -l`
    command. Although this arrangement may seem strange, it’s useful for security.


    The first character of a file permission is a hyphen (-) if it’s a file; the first
    character of a directory permission is d. The nine other characters are read,
    write, and execute positions for each of the three categories of file permissions:


    +   * **Owner** (also known as the user)

    +   * **Group**

    +   * **Others**'
  merge: -1
  img_proc: true
- pgno: 355
  md: 'Your *gotowork* file, for example, may show the following permissions when
    it’s listed with the `ls -l gotowork` command:


    ```

    ```

    -rw-rw-r--

    ```

    ```


    The hyphen (\_) in the first position indicates that it’s a regular file (not
    a directory or other special file). The next characters (`rw-`) are the owner’s
    permissions. The owner can read and write to the file, but cannot execute it.
    The next three characters (`rw-`) are the group’s permissions. The group also
    has read-write access to the file. The last three characters (`r--`) are the others’
    permissions, which are read-only.


    “\_[\_:][rw\_-][rw\_-][r\_-\_]” illustrates the four parts of the permissions:
    the file type followed by three sets of triplets, indicating the read, write,
    and execute permissions for the owner, group, and *other* users (meaning *everyone
    else*).


    You can specify most file permissions by using only six letters:


    +   - **ugo** stands for \_ no, not a funky 1980s car \_ user (that is, owner),
    group, and other.

    +   - **rwx** stands for *read, write*, and *execute*.


    These six letters, and some symbols — such as the equal sign (=) and commas —
    are put together into a specification of how you want to set the file’s permissions.


    The command for changing permissions is `chmod`. Here’s its syntax:


    ```

    ```

    chmod specification filename

    ```

    ```


    Change the mode of *gotowork* to give users the ability to read, write, and execute
    a file:


    ```

    ```

    chmod u=rwx gotowork

    ```

    ```


    That was easy enough. What if you want to give the group permission to only read
    and execute the file? You execute the following command:


    ```

    ```

    chmod g=rx gotowork

    ```

    ```


    This command doesn’t affect the permissions for owner or other — just the group’s
    permissions. You can set the permission bits in other ways. But because this way
    is so simple, why use any other?'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# Appendix D


    # Becoming a Suit: Managing the Linux File System


    +   **In This Appendix**

    +   * Mounting and unmounting a file system

    +   * Increasing disk space with a new drive or memory stick


    Managing the Linux file system isn''t a complex job, but it''s an important one.
    You have the responsibility of managing the Linux file system and ensuring that
    users (even if you''re the only user) have access to secure, uncorrupted data.
    You''re the manager (yes, — gag — a suit) of your file system.


    This appendix introduces you to managing your Linux file system. Consider yourself
    a management trainee. When you''re done reading this appendix, feel free to take
    a nice, long, expensive lunch.


    # Mounting and Unmounting a File System


    Fedora Core and other Unix-like operating systems use files in different ways
    from MS-DOS, Windows, and Macintosh operating systems. In Linux, *everything*
    is stored as files in predictable locations in the directory structure; Linux
    even stores commands as files. Like other modern operating systems, it has a tree-structured,
    hierarchical directory organization: the *file system*.


    All user-available disk space is combined in a single directory tree. The base
    of this system is the *root directory* (not to be confused with the root user),
    designated with a slash (/). A file system''s contents are made available to Linux
    by using the mounting process. *Mounting* a file system is setting it up to make
    Linux aware of the files and directories it contains. This process is just like
    mounting a horse — except no horse is involved, and anyway you''d *dismount* from
    a horse. Maybe we''d better forget the horse.


    Unlike in the Windows world, all Linux file systems except for /root must be explicitly
    *mounted* or *unmounted*, which means that file systems can be (respectively)
    connected to or disconnected from the directory tree.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# # Mounting Windows files from a floppy disk


    The process of mounting and unmounting a file system provides a good example of
    the difference between Linux and Windows. If you use a floppy disk or CD with
    Windows, you just insert it into the drive and you have immediate access to what’s
    on it. With Linux, you must insert the floppy disk into the drive and then explicitly
    mount it. Sound complicated? Not really.


    You can mount a Windows hard-drive partition or floppy-disk drive on your Linux
    computer. You can read and write to FAT or FAT32, but can only read from NTFS
    file systems. Here’s how to mount a Windows floppy disk:


    +   1. Insert a Windows MS-DOS-formatted floppy disk into the drive, click the
    GNOME Menu button, and choose System Tools→Disk Management. Enter the root password
    if it’s requested.


    +   2. Select the floppy disk and click the Mount button.


    You know that the floppy disk has been mounted successfully when a floppy-disk
    icon shows up on the left side of the screen.


    You can now read and write to the floppy disk (unless the read-only tab on your
    disk is set).


    +   3. Click the Close button to close the utility.


    Fedora Core and GNOME are configured to automatically start the process that mounts
    your floppy disk or CD when you insert it into the drive. We use the manual method
    here to show you how the process works. To mount the floppy disk manually from
    the command-line interface, log in as root, open the terminal window, and run
    the following command:


    ```

    `mount -t msdos /dev/fd0 /mnt/floppy`

    ```


    # # Unmounting file systems


    Unmounting a Linux file system is a little simpler than mounting one. Because
    the file system is already mounted, you don’t have to specify any options or other
    information. You just have to tell the Red Hat disk management druid to unmount
    the file system. Follow these steps:


    +   1. Click the Main Menu button and choose System Tools→Disk Management. Enter
    the root password, if you’re prompted.


    +   2. When the User Mount Tool window appears, click the button of the file system
    in which you’re interested.


    ![](img/41feae212f5c6612ff709354891f7b39_357_0.png)'
