    # Exchanging keys makes your life easier


    You use OpenSSH by default to log in to a remote user account by using traditional
    passwords. However, OpenSSH can use a second authentication method that takes
    a little work to get started but saves work in the long run.


    OpenSSH provides an authentication method named public-key cryptography. This
    system uses one public and one private key. You install the public key on the
    remote system and keep the private key on your computer. The public key can be
    shared with anyone — hey, it’s public. The private key must be kept secret at
    all costs. In fact, OpenSSH encrypts the private key by default. You must use
    a pass phrase (essentially a password with spaces) to decrypt the private key
    before using it.


    Whenever you want to log in or communicate with the remote computer, the keys
    are used to negotiate the process. The public-private key system guarantees that
    your user account is authenticated and is also the initiating host; passwords
    authenticate only your login account, not the computer you’re connecting from.


    # Setting up for a public-key cryptographic key exchange


    To set up the key exchange, follow these steps:


    +   1. Log in to your user account on the local computer.

    +   For example, log in as the user rod on cancrun.

    +   2. Open a GNOME Terminal session.

    +   3. Run this command:

    +   sssh-keygen -t dsa

    +   This step starts the program that generates your public and private keys.
    Several encryption methods exist: DSA (Digital Signature Standard) and RSA (named
    after Ron Rivest, Adi Shamir, and Len Adleman) are the most popular. DSA is a
    nonproprietary algorithm, whereas RSA was until recently patented. Even though
    RSA is available for public use, we recommend using DSA.


    The program thinks for a moment and returns this output:


    ```

    Enter file in which to save the key

    (/home/rod/.ssh/id_dsa)

    ```'
