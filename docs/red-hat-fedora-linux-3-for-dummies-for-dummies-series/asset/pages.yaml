- pgno: 167
  md: 'You can use the Evolution pilot-link utility to back up your PDA databases
    to your computer. Follow these steps:


    +   1. Plug your Pilot cradle into your computer''s serial port or USB port, depending
    on the type of PDA.


    The cable attached to your cradle has a female 9-pin (a DB9) plug attached to
    it. Most, if not all, modern computers have a 9-pin male plug that connects to
    a serial-port socket controlled by the /dev/ttyS0 Linux device file. (In the Windows
    world, /dev/ttyS0 is equivalent to COM1, /dev/ttyS1 is COM2, and so on.)


    If you''re using a USB-based cradle, the port is /dev/ttyUSB0 or /dev/ttyUSB1.


    +   2. Click the Evolution icon on the GNOME panel.


    The Ximian Evolution application opens.


    +   3. Click the Contacts button and choose Pilot settings from the Tools menu.


    The Welcome to GNOME Pilot Wizard window opens.


    +   4. Click the Forward button and the GNOME Pilot Settings window opens.


    +   - You have to tell Evolution where to find your PDA. Open the Port menu and
    choose the serial device.


    +   - The device is probably /dev/ttyS0 or /dev/ttyS1. There''s no shame in trial
    and error, so choose each port in order until you find the right one.


    +   - Don''t worry about selecting the speed. The default value is adequate unless
    you have a very old computer.


    ![](img/41feae212f5c6612ff709354891f7b39_167_0.png)


    +   5. Click the Forward button.


    The Pilot Identification window opens.


    +   6. Click the No, I''ve Never Used Sync Software with This Pilot Before button.


    Your user name is inserted into the User Name text box. (For example, if you''re
    logged in as paul, then paul is your default Pilot ID.)


    +   7. Click the Forward button to accept the user name; otherwise, type the name
    you want to use for your Pilot ID.


    +   8. Press the synchronize button (for example, HotSync for a Palm Pilot) on
    the PDA cradle.


    The calendar database is copied to your Fedora Core computer.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Chapter 12


    # Using Audio and Video Applications


    # In This Chapter


    +   - Introducing Fedora Core multimedia

    +   - Configuring your computer''s audio

    +   - Playing your CDs

    +   - Ripping music

    +   - Burning CDs

    +   - Using Rhythmbox

    +   - Introducing and using MPlayer

    +   - Installing the MPlayer plug-in

    +   - Installing and using RealPlayer 10


    One of the great innovations of recent times is the use of the Internet to transmit,
    or *stream*, audio and video programming. Streaming technology gives anyone the
    capability to create an online radio or TV station—unlimited by geography or governmental
    approval—inexpensively. Using streaming technology, computer users can listen
    to or view those broadcasts all around the world.


    This chapter describes how to use your Fedora Core machine as a CD player/burner,
    an Internet radio receiver, and a DVD video player. We use various open-source
    applications to perform these functions.'
  merge: -1
  img_proc: true
- pgno: 169
  md: "# Groovin’ to Tunes with CD Player\n\nImagine that you’re sitting alone, working\
    \ at your computer — if you are now, that’s not much of a leap — or you could\
    \ be reading a book that’s boring you — say, this one. It’s Saturday night, of\
    \ course. What a drag. Want to go to a party? Have some fun, play some music,\
    \ watch a video? We can’t provide the party, music, video, or instant fun, but\
    \ we can help get you there — by showing how to use your computer as a multimedia\
    \ center.\n\nIn this chapter, we show you the tools that Fedora Core provides\
    \ to turn your workstation into a sound-and-video system, including all the necessary\
    \ applications to play CDs, DVDs, and streaming Internet media. We also show how\
    \ to connect your PC to a sound card and speakers.\n\n# Setting up your sound\
    \ system\n\nFedora Core should have automatically configured your computer’s sound\
    \ system during the post-installation process described in Chapter 3. However,\
    \ you may run into problems — especially on older computers — so Fedora Core provides\
    \ a sound-card-detection utility.\n\nYou can configure and test your sound card\
    \ at the same time by following these steps:\n\n+   1.  Log in as any user.\n\
    +   2.  Click the GNOME Menu button, and choose System Settings→Soundcard Detection.\n\
    +   \n+   Enter the root password if prompted.\n+   \n+   The Audio Devices dialog\
    \ box opens, as shown in Figure 12-1.\n\n![](img/41feae212f5c6612ff709354891f7b39_169_0.png)"
  merge: -1
  img_proc: true
- pgno: 170
  md: '+   3. Click the **Play test sound** button.


    A dialog box opens asking whether you heard the sounds.


    +   4. Click **Yes** if you hear the sample guitar—and your computer is ready
    to rock.


    If you don''t hear the music, click **No**. Check the following possible causes:


    +   • Your computer has an old, unrecognizable sound card. In that case, you should
    purchase and install a new one.


    +   • You don''t have a sound card. You definitely have to purchase a new card
    and get it put in there.


    +   • Your speaker connections are faulty. Check your cables and try again.


    +   • Someone else''s stereo is way too loud. Call the cops.


    +   5. Click **OK** in the **Audio Devices** dialog box and you''re ready to go.


    # Playing CDs


    Everyone wants a little music in their lives—but you went ahead and bought a computer
    instead of that stereo system. (D''oh!) But it''s not a problem: As it happens,
    you did indeed spend your money wisely—because your Fedora Core computer functions
    well as a stereo system. This section describes how to set up your computer to
    play music CDs.


    Fedora Core bundles several open-source CD players for Linux users: CD Player,
    XMMS (included in the distribution but not installed by default), and Rhythmbox
    (we cover Rhythmbox later in this chapter). We describe CD Player in this chapter
    because it automatically starts whenever you insert a CD in your computer.


    The following steps show you how to start playing CDs:


    +   1. Log in to your computer.


    +   2. Pop a CD into the CD-ROM drive.


    The GNOME CD Player application appears. Depending on how old your audio CD is,
    you may or may not see the title information displayed in the CD Player window.


    +   3. Listen as your CD starts playing.


    ![](img/41feae212f5c6612ff709354891f7b39_170_0.png)


    You can manually start the CD Player by clicking the GNOME Menu button and choosing
    **Sound & Video::CD Player**—there''s nothing to it!'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'The CD Player controls should be familiar territory for anyone born in the
    twentieth century. Here’s a quick refresher for cave people:


    +   ✓ To change the volume, click the vertical slide bar on the right side of
    the CD Player window. Hold the mouse button while you adjust the volume.


    +   ✓ Click the crossed tools (a screwdriver and wrench) button, toward the middle-left
    area of the window, to open the Preferences window. You can then select how CD
    Player reacts when you start and stop it. You can also control the default CD
    device (the default is /dev/cdrom, but you many want to change it to /dev/cdrom1
    or another device, depending on your computer hardware). You can also select the
    theme of the CD Player skin. A simple help system is available too.


    +   ✓ The remaining music controls are self-explanatory.


    As you can see, playing CDs is simple.


    # # Ripping CD Music Files


    Are you juiced? If not, Sound Juicer can help you get there. It *rips* — extracts
    — audio information (the music files) from CDs to files on your hard drive.


    These steps show you how to use Sound Juicer to copy music to your hard drive:


    +   1. Insert your favorite CD in the CD-ROM drive.


    +   2. Click the GNOME Menu button and choose **Sound & Video** > Sound Juicer
    CD Ripper.


    The Sound Juicer window opens, as shown in Figure 12-2.


    +   3. **By default, all the CD tracks are selected** (note the check mark in
    the Extract column). Click the check mark of any tracks you don’t want to extract.


    Sound Juicer can take some time before it reads and displays the CD tracks.


    +   4. **Click the Extract button in the lower-right corner of the window.**


    The Progress dialog box opens, showing the progress of the track and the overall
    extraction process. When you’re finished, the Information dialog box opens.


    +   5. **Click the Close button.**'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/41feae212f5c6612ff709354891f7b39_172_0.png)


    Sound Juicer stores the music it extracts in O gg, the up-and-coming open-source
    audio protocol (it s similar, but technically superior, to MP3). Sound Juicer
    creates directories with the name of the music CD in your home directory. Each
    extracted track is stored as an Ogg-formatted file with the name of the song.


    After you create the music file, you can listen to it with Rhythmbox (click the
    GNOME Menu and choose Sound & Audio \Music Player).


    # ## Burning CDs


    Back in the 1980s, when vinyl started to melt away under the invasion of CDs,
    building the factories to create the CDs cost megabucks: back then, it took a
    huge effort to make a CD. Now, for the handful of bucks it costs to purchase a
    CD burner, you can build your own personal CD factory. Amazing!


    > > **TIP**: A one-time writable CD is referred to as a **CD-R**; a rewritable
    CD is a **CD-RW**. CD burners look like regular read-only drives and are connected
    with either an IDE or SCSI interface.


    But what can you burn? The answer is pretty much whatever you want: data, software,
    digital photos, or music. We ll start by burning music.'
  merge: -1
  img_proc: true
- pgno: 173
  md: "# # Burning DVDs\n\nThe new grovisofs utility makes it possible to create DVDs.\
    \ Because grovisofs is still young, its graphical interface is relatively immature.\
    \ We show you how to use grovisofs via a CLI. Follow these steps to copy files\
    \ to a DVD:\n\n+   1. Insert a **DVD** into your DVD burner.\n+   \t- You can\
    \ use either the \"plus\" (DVD+RW) or \"minus\" (DVD-RAM) format DVD burner.\n\
    +   2. Open a **GNOME Terminal** emulator window by clicking the GNOME Menu and\
    \ choosing **System Tools** > **Terminal**.\n+   3. Run the following command\
    \ to determine which **Linux** device file corresponds to your DVD writer:\n+\
    \   \n+   \t```\n+   \tgrep -i dvd /var/log/dmesg\n+   \t```\n+   \n+   \t- You\
    \ should see output similar to the following, where **hdc** is the device file\
    \ you seek:\n+   \t```\n+   \thdc: Hewlett-Packard DVD Writer 200, ATAPI CD/DVD-ROM\
    \ drive\n+   \t```\n+   4. If you want to burn tracks you ripped via Sound Juicer\
    \ (in the \"**Extracting CD**\n\n**Music with Sound Juicer** section), run this\
    \ command:\n\n```\ngrovisofs -Z /dev/hdc -1 -R -J ~/music/*ogg\n```\n\ngrovisofs\
    \ writes the files to your DVD. Note that /dev/hdc corresponds to the information\
    \ you obtained in Step 3.\n\n+   5. You can **append** more files:\n+   \n+  \
    \ \t```\n+   \tgrovisofs -M /dev/hdc -1 -R -J ~/other music/*ogg\n+   \t```\n\
    +   \n+   6. You're not limited to burning only files. You can also write the\
    \ common ISO-9660-formatted images to a DVD. Run this command to create a DVD\
    \ using an ISO image:\n+   \n+   \t```\n+   \tgrovisofs -vdv -compat -Z /dev/hdc=Image.iso\n\
    +   \t```\n\nThe easy-to-use grovisofs utility allows you to create DVDs, which\
    \ now store more than 4.5GB of data — much more than CD-ROMs can handle. Future\
    \ DVD formats will store more than 40GB of data.\n\nThe following instructions\
    \ show how to burn Ogg music files to a writable CD.\n\n+   1. **Log in** as any\
    \ user and insert a disc (either CD-R or CD-RW) into your CD writer drive.\n+\
    \   \n+   2. **Double-click** your home-directory icon, in the upper-left corner\
    \ of your desktop.\n+   \t- A Nautilus window opens, showing the contents of your\
    \ home directory.\n+   \n+   3. Click the **Places** menu and select **CD Creator**.\n\
    +   \t- The CD Creator window opens.\n+   \n+   4. Back in the first **Nautilus**\
    \ window (your home directory), double-click the folder that contains the music\
    \ files you want to record.\n+   \t- For instance, if you follow the directions\
    \ in the previous section, \"Ripping CD Music Files,\" you save the music in a\
    \ new directory. The files are saved in Ogg format."
  merge: -1
  img_proc: true
- pgno: 174
  md: "+   5. **Click any of the files and drag them to the CD Creator window.**\n\
    +       *   Repeat this step for each file you want to record.\n+       \n+  \
    \ 6. **Click the File menu and select Write to CD.**\n+       *   After a little\
    \ thought, the Write files to a CD recorder dialog box opens.\n+       \n+   7.\
    \ **Click the Write files to CD button.**\n+       *   When the CD write is finished,\
    \ the disc is ejected.\n+       \n+   8. **Click the Close button when you're\
    \ finished.**\n+       \n+   9. **Close the CD tray by pushing it back into the\
    \ drive.**\n+       *   A CD Player window opens and plays the music you just\
    \ recorded.\n\n# ## Using Rhythmbox\n\nThe open-source Rhythmbox program is a\
    \ great tool for listening to audio streams and files. Rhythmbox plays Ogg-formatted\
    \ audio. The Ogg format — codec — doesn’t use any proprietary or patented algorithms.\
    \ Ogg is free for anyone to use, and people and organizations who don’t want to\
    \ depend on proprietary systems are discovering it. Ogg also produces higher-fidelity\
    \ audio streams than other popular systems (such as MP3). Why depend on another\
    \ corporation’s whims when you don’t have to? (Rhythmbox doesn’t play MP3 formatted\
    \ music. Mplayer, described later in this chapter, does play MP3s.)\n\n![](img/41feae212f5c6612ff709354891f7b39_174_0.png)\n\
    \n> *Ogg* is the system used to format audio streams; *Vorbis* is used to compress\
    \ formatted audio streams. Unlike most other technological acronyms, Ogg/Vorbis\
    \ isn’t an acronym, but rather is named after science fiction characters. For\
    \ more information about Ogg/Vorbis and similar open-source multimedia systems,\
    \ go to www.vorbis.com.\n\nNow that you have a bit of technological background,\
    \ you can start using Rhythmbox to listen to Ogg/Vorbis files and streams.\n\n\
    +   1. **Open Mozilla by clicking the blue globe icon in the GNOME Panel.**\n\
    +       *   Alternatively, open Mozilla by clicking the GNOME Menu and selecting\
    \ *Internet›Web Browser*.\n+       \n+   2. **Enter the address www.vorbis.com/music.psp\
    \ in the Mozilla text box and then press Enter.**\n+       \n+   3. **Click any\
    \ of the links.**\n+       *   For example, click the first one, *Epoo-Lepidoptera*.\n\
    +       \n+   4. **The Opening Epoo-Lepidoptera.ogg dialog box opens.** Rhythmbox\
    \ is the default application for playing Ogg files.\n\nRhythmbox opens, as shown\
    \ in Figure 12-3, and downloads the music."
  merge: -1
  img_proc: true
