    # Connecting your Internet gateway


    After you configure your Internet gateway to forward network traffic from your
    private network to your Internet connection (refer to the preceding section),
    you need to make that connection. In this section, we describe how to use the
    Internet connections we introduce in Chapters 5 and 6. You build on those instructions
    to connect your entire network to the Internet through these connections.


    ![](img/41feae212f5c6612ff709354891f7b39_221_1.png)


    From a functional viewpoint, the type of Internet connection you use (telephone,
    DSL, or cable) doesn’t matter because all these Internet connections send and
    receive the same network traffic. (Practically speaking, of course, the higher
    throughput and lower latency of broadband make it more desirable than old telephone
    modems.) For this reason, we can treat as interchangeable the Internet connections
    you we describe in Chapters 5 and 6.'
