    The backslash (\) is an escape character in the Linux world; in the Windows world,
    a backslash (\) separates directory names. That is, backslashes prevent Linux
    (the bash shell) from interpreting the following character literally. Without
    the backslash, Linux (bash) interprets the directory name Program Files as two
    separate entities, Program and Files, because the bash shell figures that the
    space character is a separator and not part of a directory name or filename. Therefore
    the combination of a backslash and a space, \ , allows Linux to process the directory
    name correctly: Program Files. By using backslashes, you don''t have to quote
    the preceding command (refer to Step 8). You could rewrite that command as wine
    C:\Program Files\Microsoft Office\Office\winword.exe.


    Introducing CodeWeavers CrossOver OfficeWine helps you tap into the resources
    of the Windows world. Wine is developed under the open-source system, where volunteers
    provide countless hours of service and innovations to the computing world. The
    open-source community, however, doesn''t limit itself to just the noncommercial
    source. Software developed under the General Public License (GPL) permits commercial
    use as long as no restrictions are placed on the original GPL software.'
