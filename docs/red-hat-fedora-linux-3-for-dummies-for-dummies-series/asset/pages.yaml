  img_proc: true
- pgno: 287
  md: '# Part IV: Revenge of the Nerds


    Type `ifconfig` and your network adapter should be displayed correctly. If it’s
    not, examine the manual page on `ifconfig`. You display this manual page by typing
    this command and then pressing Enter:


    ```

    man ifconfig

    ```


    You can page through the document in several ways: Press Enter to go line by line,
    press the spacebar to go forward one page at a time, press Ctrl+B to page backward,
    or press Q to exit. The `ifconfig` manual page (man page) shows a great deal of
    information about what `ifconfig` is and how it works. (Linux provides man pages
    for most of its programs, libraries, etc.) If you’re still having problems, look
    at the Linux startup information by running this command:


    ```

    dmesg | more

    ```


    You *pipe* (route by using the | symbol) the output from `dmesg` to the `more`
    command. Linux pipes transmit the output of one command to the input of another.
    After you run the preceding command, you see the information that was displayed
    during the boot process. The `more` command shows one page of information at a
    time; press the spacebar to display each subsequent page.


    # Maybe you have a hardware problem


    If you don’t see your Ethernet adapter, you may have a hardware problem. Check
    your adapter. *Reset* it (take it out and put it back in) and see whether it works.
    If not, you probably need a new NIC. If you see the NIC, look inside the Linux
    kernel and see which devices it has. Type the following command to change to a
    special directory named `/proc`, where process information is located:


    ```

    cat /proc/devices

    ```


    You should see a line with your network adapter listed. If you don’t, Linux doesn’t
    know that it exists.


    Try to run your Ethernet NIC again. If it still doesn’t run, you have to find
    out more information.


    # Maybe you have an interrupt or address conflict


    You may have an interrupt or address conflict. Look at the list of interrupts
    and then the I/O addresses of all devices that the kernel knows about, by typing
    these commands:


    ```

    cat /proc/interrupts

    cat /proc/iports

    ```'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# Chapter 18: Bringing in the Fedora Core Repairman


    The I/O address is the location in memory where the device, such as the network
    adapter, is accessed by the microprocessor (for example, your Pentium chip). The
    interrupt communicates to the microprocessor that it should stop whatever it''s
    doing and process the information that has arrived at the device that''s sending
    the interrupt.


    When your Ethernet adapter receives a packet, it sends an interrupt to the microprocessor
    to signal that an event has occurred. Your Pentium stops what it''s doing and
    processes the new information. The microprocessor even interacts with Linux to
    do the processing.


    Type `cat /proc/interrupts` to show both the interrupts and the I/O addresses
    with which Fedora Core is familiar. The output should look like this example:


    ```

    0:  378425  timer

    1:  1120  keyboard

    2:  0  cascade

    10:  16077  3c509

    13:  1  math error

    14:  63652 + ide0

    ```


    This listing shows that Linux knows that the Ethernet NIC (3c509) exists.


    Typing `cat /proc/ioports` shows the input-output ports used by Fedora Core to
    interact with the computer''s devices. This output shows the I/O ports used on
    this computer:


    ```

    0000-001f : dmal0

    0020-003f : pic1

    0040-005f : timer

    0060-006f : keyboard

    ```


    Look for your network adapter. In this case, it''s 3c509. If the adapter is working,
    you shouldn''t have any conflicts. If the I/O ports of two devices overlap, a
    conflict exists and you have to reconfigure the adapter. Run your Ethernet NIC
    configuration program and set the adapter''s parameters in its EEPROM. Older adapters
    may have jumpers or little switches, called DIP switches, to set. If you think
    that you have to do this, remember to write down all the other devices'' interrupts
    and I/O addresses so you don''t end up conflicting with something else.


    # Perhaps you''re missing the correct module


    You also may be missing the correct module. This situation is virtually impossible
    with Fedora Core because the Linux kernel automatically loads networking, and
    other modules, on demand (it''s mature technology). Go ahead and'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'look at these files to gain an understanding of how Linux works. Display the
    networking devices by typing this command:


    ```

    `cat /proc/net/dev`

    ```


    If you don''t see the Ethernet interface, you may have an unsupported network
    adapter or a defective or misconfigured one. The Fedora Core kernel, by default,
    automatically loads modules as they''re needed. You can look back at the results
    of your boot process by using the `dmesg` command. Look for a message that says
    `delaying eth0 configuration`. This message probably means that Linux couldn''t
    load the network adapter module or that the adapter isn''t working.


    Display the information about your devices by using the `cat /proc/net/dev` command.


    The next step is to ensure that your network routing is configured correctly.
    This area is one where you can easily get confused. You don''t have to set up
    routing outside your LAN yet, but Linux needs to know where to send packets on
    its own network. Look at your routing table by typing this command:


    ```

    `netstat -nr`

    ```


    You see a listing of your routing table. In this abbreviated example, some options
    that aren''t important have been removed:


    ```

    Kernel IP routing table

    Destination     Gateway         Genmask         Flags   Iface

    192.168.1.0     0.0.0.0         255.255.255.0   U         eth0

    169.254.0.0     0.0.0.0         255.255.0.0     U         eth0

    127.0.0.0       0.0.0.0         255.0.0.0       U         lo

    0.0.0.0         192.168.1.254   0.0.0.0         UG        eth0

    ```


    This list briefly describes what''s in the fields in the routing table:


    +   * **Destination:** The location, or IP address, where you want to send packets.
    For example, the address `192.168.1.0` refers to your local network.


    +   * **Gateway:** The address (computer or router) where the packets have to
    be sent so they can find their way to their destination. When the destination
    is the local network, the address `0.0.0.0` means no gateway.


    +   * **Genmask:** Used to separate from the host number the parts of the IP address
    used for the network address.


    +   * **Flags:** Indicates various interface information. such as `U` for `up`
    and `G` for `gateway`. The metric is used as a measure of how far a packet must
    travel to its destination (a number greater than 32 is considered infinite; packets
    live in a small universe). The next two flags, Ref and Use, aren''t important
    here.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '**iface**: Shows which network interface is being used. (eth0 refers to an
    Internet adapter, and lo refers to the loopback interface. The loopback interface
    is used internally by the Linux kernel, and you shouldn’t have any need to use
    it directly.)


    The 169.254.0.0 entry is an IPv6 (the next-generation Internet Protocol Version
    6) connection. We don’t use IPv6 in this book.


    The information about each interface — the routing table — is displayed below
    the headings. For example, the first line tells Linux to send packets destined
    for the addresses 192.168.1.0 through 192.168.1.255 to the Ethernet adapter (eth0).
    The second line deals with the kernel’s internal loopback interface. The third
    and last line, with the address 0.0.0.0, is the default route. It defines where
    to send all packets not covered by a specific route.


    If your table deviates from the example, you may have a routing problem. For example,
    if you don’t have the default route, 0.0.0.0, you cannot communicate with any
    machines on your LAN or the Internet. If you lack a loopback — 127.0.0.1 — route,
    many internal processes are doomed to fail.


    # Defining a route to the loopback interface


    You must have a route to the loopback interface (also referred to as lo), which
    is the 127.0.0.0 address. If you’re missing either or both parameters, you must
    set them. To set the loopback device, which must be set for the network adapter
    to work, type this command:


    ```

    route add -net 127.0.0.0

    ```


    To set the route for the network adapter and your local network, type


    ```

    route add 192.168.1.0 dev eth0

    ```


    This route is assigned automatically to your network adapter. You can assign the
    route to another NIC, if necessary. Here’s an example:


    ```

    route add 192.168.1.0 dev eth1

    ```


    Type netstat -rn to see your routing table. You should see entries for the loopback
    and Ethernet. If you don’t see a route to your network interface, try repeating
    the steps. You may have to delete a route. To delete a route, type


    ```

    route del 192.168.1.0 dev eth0

    ```


    Note that you use the network address rather than a host address here. The zero
    (0) designates the Class-C network address 192.168.1.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Doing the ping thing


    If the network adapter is configured correctly and the routing is correct, check
    the network. The best way to do it is to ping the loopback interface first and
    then the other computer. Type the following command, let it run for a few seconds
    (one ping occurs per second), and stop it by pressing Ctrl+C:


    ```

    ping 127.0.0.1

    ```


    You should see a response like this one:


    ```

    PING 127.0.0.1 (127.0.0.1) 56(84) bytes of data.

    64 bytes from 127.0.0.1: icmp_seq=0 ttl=64 time=0.079 ms

    64 bytes from 127.0.0.1: icmp_seq=1 ttl=64 time=0.039 ms

    ```


    Each line shows the number of bytes returned from the loopback interface, the
    sequence, and the round-trip time. The last lines comprise the summary, which
    shows whether any packets didn’t make the trip. This is a working system, but
    if you don’t see any returned packet, something is wrong with your setup and you
    should check your network connections and configuration.


    Next, try pinging your Ethernet interface by typing this command:


    ```

    ping 192.168.1.1

    ```


    You should see a response similar to this bit of code:


    ```

    PING 192.168.1.1 (198.168.1.1): 56 data bytes

    64 bytes from 198.168.1.1: icmp_seq=0 ttl=64 time=2.0 ms

    64 bytes from 198.168.1.1: icmp_seq=1 ttl=64 time=1.2 ms

    --- 198.168.1.1 ping statistics ---

    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip min/avg/max = 1.2/1.6/8.4 ms

    ```


    # “Can I talk to another computer or device?”


    Try to ping another computer, if one exists, on your network. Type the following
    command, let it run for 10 to 15 seconds, and stop it by pressing Ctrl+C:


    ```

    ping 192.168.1.254

    ```'
  merge: -1
  img_proc: true
- pgno: 292
  md: 'This example assumes that another computer has the IP address **192.168.1.254**.
    Adjust the address you use to work with your network. You should see a response
    similar to what’s shown in this bit of code:


    ```

    PING 192.168.1.2 (192.168.1.2): 56 data bytes

    64 bytes from 192.168.1.254: icmp_seq=0 ttl=32 time=3.1 ms

    64 bytes from 192.168.1.254: icmp_seq=1 ttl=32 time=2.3 ms

    --- 192.168.1.2 ping statistics ---

    4 packets transmitted, 4 packets received, 0% packet loss

    round-trip min/avg/max = 2.3/2.5/3.1 ms

    ```


    If you see a continuous stream of returned packets and the packet loss is 0 or
    near it, your network is working. If not, the problem may be in the other machine.
    Review the troubleshooting steps in this chapter. Note that the ICMP is taking
    about 1 full millisecond (ms) longer to travel to the external computer than to
    the loopback device. The reason is that the loopback is completely internal to
    the Linux computer.'
  merge: -1
  img_proc: true
