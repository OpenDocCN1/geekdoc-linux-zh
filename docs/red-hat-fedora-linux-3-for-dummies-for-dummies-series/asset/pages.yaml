- pgno: 117
  md: 'a firewall is important. Then we introduce you to Netfilter/iptables, a Linux

    firewall system, and describe how to set up your firewall-filtering rules. After

    you set up your filters, we describe how to run the firewall automatically.


    ![](img/41feae212f5c6612ff709354891f7b39_117_0.png)


    The firewall described in this chapter is designed to protect a single Fedora

    Core computer that’s connected to the Internet or LAN. The firewall isn’t

    designed to protect an entire LAN. Chapter 15 describes how to modify this

    firewall to protect your private network.


    # # Understanding Why You Need

    # a Firewall in the First Place


    You may think there’s safety in numbers — after all, millions of people, busi-

    nesses, and organizations are connected at any given time to the Internet.

    What do you, an individual with a simple computer or small private network

    connected to the Internet, have to be concerned about? The bad guys are

    usually interested in big money or big publicity. I’m just the little guy and
    no

    one is interested in hacking little ’ol me, right?


    That assumption sounds reasonable but can lead to disaster. Many hackers use

    tools that automatically scan and attack thousands of computers in almost

    no time at all. Even a lazy hacker doesn’t have to work hard to search large

    numbers of networks to find and exploit unprotected computers. (Don’t forget

    that Internet worms propagate quickly too.)


    Don’t risk needlessly getting *owned* — the term used when a hacker breaks

    into and controls your computer. Fortunately, you can take some reasonable

    precautions and greatly increase your security. Linux provides effective tools

    for protecting yourself.


    Using a firewall is one simple (but quite effective) way to protect yourself when

    you connect to the Internet. A firewall allows you to connect to the Internet

    while blocking unnecessary and unwanted connections from coming in.


    ![](img/41feae212f5c6612ff709354891f7b39_117_1.png)


    Firewalls provide good bang-for-the-buck protection — but they’re not the

    only security measure you should take. For example, locking your doors cer-

    tainly helps to protect against burglars, but isn’t 100-percent effective — they

    can still break through a window. Your best bet comes from using layers of

    security, such as locking your windows, using alarms, and keeping tabs on

    neighborhood activities. The idea is to have each layer reinforce the others.

    Chapter 17 describes how to add security layers to your computer. Layered

    security is your best protection.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Building an Effective Firewall


    Fedora Core comes bundled with a simple but extremely effective firewall system
    named Netfilter/iptables. The Netfilter part refers to the firewall system built
    into the Linux operating system — the kernel, to be exact — and iptables is the
    interface that controls it. We refer to the overall system as iptables because
    that’s the utility you work with.


    The iptables system filters the IP packets that are the backbone of the Internet
    (IP stands for Internet Protocol). When you’re connected to the Internet, all
    information (graphics and text) that you send and receive is sent in the form
    of IP packets. All information that enters and leaves your computer via the Internet
    is packaged in the form of IP packets. You can use iptables to accept or deny
    IP packets according to their destinations, source addresses, and ports.


    # Designing filtering rules: Permissive and restrictive methods


    Filtering rules are like the bricks (or asbestos, if you prefer) used to build
    your firewall. Basically, filtering rules determine what network communication
    can go out of and come into your computer.


    When you’re designing firewall-filtering rules, you can choose between two philosophies:


    +   - Allow all connections by default and then deny specific access.

    +   - Deny all connections by default and then allow specific access.


    If you allow all connections, you start by allowing all communication with your
    computer and then deny connections one by one. (This method is used by the Fedora
    Core firewall, which you create during the installation process.) The danger with
    this method is that you can unintentionally allow dangerous traffic to reach your
    machine. The alternative method is to start by denying all communication and then
    selectively allowing certain traffic. This more restrictive method is, from a
    security standpoint, the best way to create a firewall


    because you know exactly what access you’re allowing. However, the restrictive
    method can also create problems; for example, you may unintentionally prevent
    needed or wanted network traffic from reaching your computer.


    We explain how to use the restrictive method, for several reasons.


    +   - **It’s the safest method.** The restrictive method is safer because it minimizes
    all external contact with your Internet-connected computer. For example, it minimizes
    the information about your firewall that would otherwise be available to hackers
    through port scanning and other tricks.

    +   - **It’s easier to configure.** Because iptables provides stateful filtering,
    you have only two rules to configure as you create a safe firewall. By contrast,
    the permissive method requires you to configure numerous individual rules. Extra,
    unnecessary complexity reduces security.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'The iptables system is effective because it uses *stateful filtering*. The
    firewall can keep track of the state of each network connection. It''s a technical
    way of saying that iptables knows which IP packages are valid and which are not.
    For example, if you''re browsing www.dummies.com, iptables keeps track of all
    packets that belong to that connection. The iptables utility can deny packets
    that are trying to reach your computer but don''t belong to your connection, thus
    preventing any hackers from sneaking packets through your firewall.


    +   TIP Fedora Core installs an iptables-based firewall by default. The installation
    system configures a good level of protection during the installation process.
    You may recall from Chapter 3 that we advise you to use the default firewall configuration.
    However, the default firewall isn''t as secure as we would prefer for connecting
    to the Internet. Therefore this chapter describes how to construct a more comprehensive
    and secure firewall.


    +   TECHNICAL STUFF **Ports** — the places where information comes into a computer
    or goes out — are essential to the Internet Protocol. Ports are used to organize
    the communication between clients and servers. For example, when you click a link
    on a Web page, your browser communicates with the Web server by using a port.
    That''s a gross simplification, of course, but it describes the basic idea. Suffice
    to say that ports help control the internal workings of the Internet for such
    tasks as Web browsing.


    # ## Setting Up a Firewall


    So you know that you need a firewall and want to create one. What''s next? This
    section explains how to set up an iptables-based firewall, using the restrictive
    model. When you''re done setting up your rules, see the section "Saving your filtering
    rules to a script," later in this chapter, so you don''t have to enter these rules
    every time you turn on your computer.


    In this section, you design an iptables-based firewall that turns off all incoming
    connections on an Internet connection (modem, LAN, or broadband) and still enables
    you to establish an outgoing connection to the Internet. You then back off of
    the total restriction of incoming communication to allow incoming Secure Shell
    connection. (Secure Shell provides encrypted communications.)


    +   WARNING! Don''t execute these instructions from a remote connection! You must
    run these commands from your computer''s console. That is, you must be sitting
    at your computer and not be working on it from some other location over a network
    connection. The reason is simple: These firewall rules shut off external network
    connections before restoring them.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'The steps that build your firewall, brick by brick, look like this:


    +   1. **Log in to your computer as *root* and then open a GNOME Terminal window**
    (right-click any empty part of the desktop and choose Open Terminal from the menu).


    +   2. **Type the following line to turn off the default Fedora Core firewall:**


    ```

    service iptables stop

    ```


    This firewall is the one created during the installation process we describe in
    Chapter 3. The iptables entries remove any existing filtering or Network Address
    Translation (NAT) rules. NAT rules are frequently used to make your computer appear
    to be coming from your ISP so that you don''t have to register your computer for
    an official Internet Protocol (IP) address.


    +   3. **Start building your firewall by entering the following rules that by
    filter out all network communication to, from, and through your computer:**


    ```

    iptables --policy INPUT DROP

    iptables --policy OUTPUT DROP

    iptables --policy FORWARD DROP

    ```


    These commands set the default policy of your firewall to not allow any network
    traffic in (the *INPUT* rule) or out of (the *OUTPUT* rule) any network interface;
    nor is any traffic allowed to pass between multiple network interfaces (the *FORWARD*
    rule) if you have them. At this point, you have an extremely safe firewall. So
    far, however, your computer is useless for network-related tasks. So the next
    step opens the firewall a little, giving you access to the Internet (or any network
    you''re attached to) in a safe way.


    +   4. **Enter the following rules to allow network traffic to pass through the
    loopback device:**


    ```

    iptables -A OUTPUT -j ACCEPT -o lo

    iptables -A INPUT -j ACCEPT -i lo

    ```


    Linux computers use a virtual internal network that you connect to via the *loopback
    interface* (*lo*). The loopback isn''t a physical device, but rather is a virtual
    one. Linux uses *lo* for internal communications.


    +   5. **To allow all outgoing communication for your computer, type the following
    two commands:**


    ```

    iptables -A OUTPUT -m state

    --state NEW,RELATED,ESTABLISHED -j ACCEPT

    iptables -A INPUT -m state

    --state RELATED,ESTABLISHED -j ACCEPT

    ```'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'These rules don''t specify any particular network interface. However, because
    the filter is stateful, these rules effectively work on your Ethernet, wireless,
    or dialup Point-to-Point (PPP) interface.


    The first filter rule permits all outgoing communication. The `--state NEW,RELATED,ESTABLISHED`
    option tells the firewall to allow packets of both new and already established
    connections to pass. (Packets are the basic building block of all network communication.)
    Also allowed are packets related to existing connections but using different ports,
    such as FTP data transfers.


    The second filter rule controls the packets coming back from outgoing connections.
    When you connect to a Web site, for example, your browser sends out packets and
    the Web server responds to them. You can click a button on the Web site, and a
    new display pops up. Clicking a button sends a packet out, and the Web server
    sends packets back. You started out with blocking packets from the Internet; this
    rule creates an exception, allowing packets that belong to an existing connection
    — such as the one that represents you clicking a button — to return to your computer
    through the firewall. Note that we don''t allow new incoming connections (`--state
    NEW`) to be established; doing so would defeat the purpose of this firewall.


    +   6. (Optional) Use the following rule to allow SSH connections to your Linux
    computer:


    ```

    ```

    iptables -A INPUT -p tcp -m state --state

    NEW,ESTABLISHED -j ACCEPT --dport 22

    ```

    ```


    This rule permits SSH connections on Port 22 to enter into your computer.


    The OpenSSH server is installed by default during the installation process we
    describe in Chapter 3. The service is also started automatically.


    You can modify this rule to allow other types of incoming connections to your
    computer. For example, if you want to create a Web server and allow incoming connections
    to it, run this filter:


    ```

    ```

    iptables -A INPUT -p tcp -m state --state

    NEW,ESTABLISHED -j ACCEPT --dport 80

    ```

    ```


    Port 80 is used for Web server connections. (Chapter 16 shows you how to create
    a Web server.)


    You have just created a simple, effective firewall that protects your computer
    from werewolves and hackers. Your firewall remains active until you turn the rules
    off or reboot your computer. The following section shows you how to display your
    new firewall rules.'
  merge: -1
  img_proc: true
- pgno: 122
  md: "# Displaying Your Firewall Rules\n\nAfter you configure your firewall, you\
    \ naturally want to verify that the filtering rules are set up correctly. To display\
    \ the firewall rules, follow these steps:\n\n+   1. Open a GNOME Terminal emulator\
    \ window (right-click any empty part of the GNOME Desktop and select the *New\
    \ Terminal* menu).\n+      You can also open the GNOME Terminal by clicking the\
    \ GNOME Menu and selecting choosing *Tools>Terminal*.\n+   2. If you’re not already\
    \ the *root* user, enter the *su-* command in the GNOME Terminal window.\n+  \
    \ 3. Enter the *root* password and type the following command to display the firewall\
    \ rules:\n+      iptables -L -v\n\nAfter you complete these steps, you see the\
    \ firewall-filtering rules displayed in the terminal window (use the *verbose\
    \ -v* option in the preceding command to display extra information, including\
    \ the network interfaces — for the sake of brevity, we don’t use the option in\
    \ this example):\n\n```\n```\nChain INPUT (policy DROP)\ntarget prot opt in out\
    \ source destination\nACCEPT all -- lo in lo anywhere anywhere\nACCEPT all --\
    \ any any anywhere anywhere\nstate RELATED,ESTABLISHED\nACCEPT tcp -- any any\
    \ anywhere anywhere\n tcp dpt:ssh state NEW,ESTABLISHED\n\nChain FORWARD (policy\
    \ DROP)\ntarget prot opt in out source destination\n\nChain OUTPUT (policy DROP)\n\
    target prot opt in out source destination\nACCEPT all -- any lo anywhere anywhere\n\
    ACCEPT all -- any any anywhere anywhere\nstate NEW,RELATED,ESTABLISHED\n```\n\
    ```\n\niptables uses the concept of chains. A *chain* is a list of one or more\
    \ interrelated rules. Each rule is a link in the chain. iptables has three built-in\
    \ chains: *INPUT, OUTPUT,* and *FORWARD*. You can create custom chains to perform\
    \ any filtering function you want. (For example, the default Fedora Core firewall\
    \ filter creates a custom chain, called *RH-Firewall-1-INPUT*). However, creating\
    \ custom chains isn’t necessary for this firewall, so we use only the built-in\
    \ chains."
  merge: -1
  img_proc: true
- pgno: 123
  md: 'The first `chain`, `INPUT`, filters incoming packets. You can see that the
    default policy denies all packets. This policy makes for a perfect firewall —
    nothing can get in. However, the perfect firewall is also useless because your
    computer cannot see or interact with the network.


    You can begin to make the firewall useful by creating a rule to allow all incoming
    packets on the logical loopback (`lo`) interface; the loopback interface is used
    for internal communication on your computer. The next rule allows the return packets,
    `RELATED` and `ESTABLISHED`, from outgoing connections to come back in. The last
    rule (which is optional) allows the incoming Secure Shell connections to your
    computer.


    The next chain, `FORWARD`, prevents all packets from being forwarded through your
    Linux computer. Forwarding is necessary only if you use your computer for routing
    or other advanced networking functions.


    The last chain, `OUTPUT`, defines which IP packets are allowed out of your computer.
    Again, the first rule allows unlimited traffic through the loopback (`lo`) interface.
    The second and last rule allows all packets to leave your firewall.


    The following section describes how to save the rules you just created and displayed
    — in such a way that they can start automatically.


    # # Firing Up Your Firewall


    The preceding section describes how to display your firewall-filtering rules.
    However, you certainly don''t want to manually enter these rules every time you
    reboot your computer. This section shows you how to automate your firewall. We
    show you how to make use of the Fedora Core utilities that save the rules you
    just created and start up the firewall whenever you boot your computer.


    These instructions assume that you have configured the firewall as described in
    the preceding section — and that the configuration is still in effect.


    # ## Saving your filtering rules to a script


    You need to save your rule set after you have created your firewall. Fedora Core
    provides a utility for doing just that. The `iptables-save` utility reads your
    current firewall rules and converts them into script-compatible form. Fedora Core
    also provides a script to start up your firewall whenever you'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'start your computer. The `/etc/init.d/iptables` script runs whenever you start
    your computer and, thus, your firewall is started too. Follow these steps:


    +   1. Log in as *root* if necessary, and open a GNOME Terminal window (refer
    to Chapter 4) if necessary.


    +   2. Type the following line to save the default Fedora Core firewall configuration:

    +      ```

    +      mv /etc/sysconfig/iptables /etc/sysconfig/iptables.bak

    +      ```


    +   3. Run this command and your firewall rules are saved to a script:

    +      ```

    +      iptables-save > /etc/sysconfig/iptables

    +      ```


    # # Turning your firewall off and on


    Fedora Core uses the `/etc/sysconfig/iptables` script to start Netfilter/iptables
    firewalls. The `/etc/init.d/iptables` script uses the filtering rules stored in
    the `/etc/sysconfig/iptables` file to implement the filtering rules.


    You can start the Netfilter/iptables firewall by running this iptables script
    or by using the service utility:


    ```

    service iptables start

    ```


    You must be logged in as *root*, of course. Note that you can turn off your firewall
    by replacing start with stop:


    ```

    service iptables stop

    ```


    You can also use (from the graphical interface) the Fedora Core Service Configuration
    Utility. These next instructions show you how to use the utility to start or stop
    your firewall:


    +   1. Click the GNOME Menu button and choose **System Settings→Server Settings→Services**.

    +      If you’re not logged in as *root*, the Input window pops up and you’re
    asked to enter the *root* password.


    +   2. Enter the *root* password you set during the Fedora Core Installation process.

    +      The Service Configuration window appears. This window controls all the
    Linux *daemons* (processes that provide services).'
  merge: -1
  img_proc: true
- pgno: 125
  md: '+   3.  Scroll down the Service Configuration window until you find the iptables
    service.

    +   The check mark should be set in the check box.


    +   4.  Click the Restart button in the upper-left corner of the window.

    +   You could click the Start button, but we advise you to use the Restart function.
    The Start and Restart buttons give you the same result, but restarting works if
    the service is already running. Using the Start function doesn''t work if the
    service is already running.


    +   5.  Click the Stop button to turn off your firewall.

    +   After the service restarts, you see a confirmation message.


    +   6.  Click OK.

    +   Your firewall is restarted, and you can exit from the Service Configuration
    window.


    TIP

    You can also prevent the iptables script from being automatically started when
    you boot the system. Click in the box immediately to the left of the service name
    to remove the check mark. Click the Save button, and the pointer (/etc/rc.d/rc5.d/S08iptables)
    to the startup script (/etc/init.d/iptables) is removed. You can restore the pointer
    by clicking in the box so the check mark reappears.'
  merge: -1
