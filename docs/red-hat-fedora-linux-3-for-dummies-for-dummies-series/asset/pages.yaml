    # # Configuring Samba


    When you’ve finished installing Samba and its configuration utility, we show you
    how to configure it. The process requires you to first activate SWAT and second
    to configure Samba.


    Linux uses a general-purpose daemon called `xinetd` to handle numerous Internet
    service requests. When `xinetd` receives a request for a particular service, it
    reads the service’s configuration file in the `/etc/xinetd.d` directory and starts
    the service (assuming all conditions are satisfied).


    We must configure the SWAT `xinetd` configuration before using SWAT to configure
    Samba. The following steps describe how to configure `xinetd` to start SWAT:


    +   1. Click the GNOME Menu and select System Tools:: Terminal.

    +   2. Enter the following command to switch to the *root* user account: `su -`

    +      (That’s short for “superuser.” Red cape optional.)

    +   3. Edit the Samba SWAT `xinetd` configuration file by entering the following
    command: `gedit /etc/xinetd.d/swat`

    +   4. Change `disable = yes` to `disable = no`.

    +   5. Click the Save button.

    +   6. Click the File:: Quit button.

    +   7. Restart the `xinetd` daemon with this command: `service xinetd restart`'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'With xinetd configured, it''s time to configure Samba. The following steps
