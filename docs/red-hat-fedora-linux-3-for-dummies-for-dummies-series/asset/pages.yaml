    \ opens.\n+   5. **Back in the first Nautilus window, click File➝Open Location.**\n\
    +   \n+   The Open Location dialog window opens.\n+   6. **Enter** `/usr/lib/mozilla/plugins`\
    \ **in the text box and then click Open.**\n+   \n+   Nautilus opens a window\
    \ labeled `plug-ins`.\n+   7. **Click and hold on the flashplayer.xpt icon, and\
    \ drag it to the** `plugins` **folder.**\n+   8. **Repeat step 7 to copy the**\
    \ `libflashplayer.so` **to the** `plugins` **folder.**\n+   9. **Back in your\
    \ Mozilla browser, click the About Plug-Ins from the Help menu and you’ll see\
    \ the new plug-ins displayed, as shown in Figure 11-1.**\n+   \n+   The Mozilla\
