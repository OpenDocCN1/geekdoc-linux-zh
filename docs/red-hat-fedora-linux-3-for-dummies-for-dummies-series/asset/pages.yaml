- pgno: 35
  md: '# # Preparing Your Windows Computer for Fedora Core


    Before you install Fedora Core alongside an existing Windows installation, you
    need to get your hard drive ready. This list of steps provides an overview of
    the disk preparation process:


    +   1. **Put on a red fedora.**


    +   2. **Back up everything that''s on your Windows computer.**


    The processes we describe in this chapter should not affect your existing Windows
    installation. However, you can never be too safe in dealing with your precious
    files, so you should back them up. A description of how to back up the contents
    of a Windows computer is beyond the scope of this book. Numerous commercial and
    freeware (not to be confused with open-source) backup systems are available.


    +   3. **Determine how your Windows computer''s hard drive is formatted.**


    Microsoft Windows uses two types of disk formats: FAT (File Access Table) and
    NTFS (NT File System). FAT is older and less advanced than NTFS. Open-source utilities
    are available for resizing FAT-based disks to make room for Linux, but you have
    to purchase commercial software to repartition NTFS systems. (The next section
    tells you how to know which format you have.)


    +   4. **Defragment your disk.**


    All resizing programs require you to *defragment* your disk before proceeding.
    Over time, the bits and bytes that make up your files tend to get scattered around
    your hard drive. If too many of these fragments are left floating around, resizing
    may not work -- or may even cause problems. Tidy them up; the next section covers
    defragmenting.


    +   5. **Repartition your computer''s hard drive to make room to install Fedora
    Core if you want to install it alongside Windows (or another operating system).**


    You can use destructive or nondestructive resizing to make room for Linux. *Destructive*
    resizing wipes everything, including Windows and your data files, off your hard
    drive and starts fresh. *Nondestructive* resizing uses Windows utilities to dynamically
    shrink the existing partition and then uses the freed space to make a new Linux
    partition. (Resizing is covered later in this chapter.)


    The open-source FIPS (First nonDestructive Interactive Partition Splitting) program
    comes with the full Fedora Core distribution to repartition FAT disks. To repartition
    NTFS disks, you have to use a commercial utility such as Norton PartitionMagic
    8.0 or Norton Ghost 2003; both these programs also work on FAT systems.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# “Am I FAT or Just NTFS?”


    The process of determining your partition type is straightforward. These instructions
    describe how to use the tools provided by Windows (Windows 9x, Windows Me, Windows
    NT, Windows 2000/2003, and Windows XP) to show the partition type.


    Follow these instructions on all Windows systems:


    +   1. Start your computer.

    +   2. Open the My Computer icon.

    +   3. Right-click the drive C icon.

    +   4. Click the Properties button.


    You should see information displayed about the partition, as shown in Figure 2-1.


    Figure 2-1 shows the information about drive C (the partition). The upper-middle
    part of the figure shows (in this case) that the partition uses NTFS.


    ![](img/41feae212f5c6612ff709354891f7b39_36_0.png)


    # Defragmenting Your Hard Drive


    When you know how your hard drive is partitioned, it’s time to defragment. This
    section describes how to defragment both FAT and NTFS partitions.'
  merge: -1
