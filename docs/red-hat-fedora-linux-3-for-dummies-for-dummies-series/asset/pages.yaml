    \ the following command from a terminal window:\n\n```\n```\nrpm -iv /media/cdrom/Fedora/RPMS/mozilla-mail*\n\
    ```\n```\n\nAlternatively, you can upgrade a package that has already been installed\
    \ on your system. Substitute the `RPM upgrade` option, `-U`, in place of the `install`\
    \ option, `-i`. For example, the following command updates the Mozilla e-mail\
    \ client package:\n\n```\n```\nrpm -Uv /media/cdrom/Fedora/RPMS/mozilla-mail*\n\
    ```\n```\n\nThe files that constitute the newer Mozilla-mail package overwrite\
    \ the older version. Existing configurations, however, are saved by adding the\
    \ `.rpmsave` suffix to the configuration file.\n\n# ## Manually removing packages\n\
    \n`RPM` packages are good residents on your computer because they lend themselves\
    \ to easy removal. The `rpm` command permits you to remove packages via the `erase\
    \ (-e)` function.\n\nSuppose you’re not so fond of the Mozilla e-mail client because\
    \ you like the Evolution client better. No problem: You can remove the Mozilla\
    \ mail package. To remove an RPM package, follow these steps:\n\n+   1. Log in\
    \ as *root* and open a terminal emulator window.\n+   \n+       The GNOME Terminal\
    \ window opens.\n+   \n+   2. Enter the following command to find the name of\
    \ the package to remove:\n\n```\n```\nrpm -qa | grep mozilla\n```\n```"
