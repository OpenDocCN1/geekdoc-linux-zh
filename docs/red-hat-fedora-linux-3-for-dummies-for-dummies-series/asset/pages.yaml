  md: "you click the *Run in Terminal* button. Entering **xlock**, for example, displays\
    \ a graphical clock on-screen. Running the simple `ls` command after clicking\
    \ the Run in terminal button displays a list of files.\n\n![](img/41feae212f5c6612ff709354891f7b39_68_0.png)\n\
    \nThe GNOME Terminal is similar to the MS-DOS window in Windows in the way it\
    \ interacts with you. Opening an MS-DOS window provides a text-based window in\
    \ which to enter DOS commands. The underlying technology of a Windows CLI is different\
