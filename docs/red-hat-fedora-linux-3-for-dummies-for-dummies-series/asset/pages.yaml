- pgno: 69
  md: "# ## 52\n\n### Part I: Installing Fedora Core\n\n+   3. **Enter the *root*\
    \ password if you're prompted.**\n+   \n+      The Display Configurator opens\
    \ the Display settings window. Use the set of steps in the next section to configure\
    \ your graphical X interface.\n+   \n+      The X Window System (X, for short)\
    \ was invented at the Massachusetts Institute of Technology (MIT) to display graphical\
    \ applications across a wide range of machines. It was originally built to run\
    \ on Unix platforms, but has been adapted to Linux and other platforms.\n+   \n\
    +      Old monitors that lack multisccanning capability can be damaged if you\
