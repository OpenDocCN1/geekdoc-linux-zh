    \ is the device (router or computer) that connects your network to your ISP and\
    \ the Internet. Obtain the address from your system administrator if you’re at\
    \ work and have one. If you’re a home user, a typical convention is to assign\
    \ the highest address, 254, of a Class C subnetwork as the gateway. For example,\
    \ type **192.168.1.254**.\n+   \n+   Your *TCP/IP Settings* should look similar\
