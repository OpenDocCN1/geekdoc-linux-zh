- pgno: 317
  md: '# "My network is working, yet not working"


    **Problem:** You have configured and checked your network connection and it appears
    to be okay. But you cannot connect to some or all of the machines or network services
    you want. You''re perplexed.


    **Solution:** Check your Iptables-based firewall. Red Hat configures two different
    levels of firewalls during the installation. This book describes several different
    Iptables firewall configurations too. If your firewall isn''t configured correctly,
    it prevents some or all network communications. Even if your firewall is configured
    correctly, it may be designed, in many cases, to block the type of communications
    you want.


    Turn off your firewall with this command:


    ```

    ``` /etc/init.d/iptables stop```

    ```


    If your network connection instantly works, your firewall was most likely the
    culprit. In that case, you have to modify your firewall to make it work for your
    needs. Turn the firewall back on as soon as you fix the problem:


    ```

    ``` /etc/init.d/iptables start```

    ```


    A description of how to customize an Iptables firewall is beyond the scope of
    this book. However, the firewalls we show you how to construct in this book may
    work for you and also be easier to understand and modify. Refer to Chapter 8 for
    more information about Iptables-based firewalls.


    # "I want to make an emergency boot floppy disk"


    **Problem:** You skipped making an emergency boot disk when you installed Fedora
    Core and want one now.


    **Solution:** All is not lost if you read Chapter 3 and skipped making a boot
    disk; it''s easy, in fact, to make one. Log in to your computer as root and insert
    a blank floppy disk — or one that has information you don''t mind deleting (losing
    everything on that disk). Then run this command:


    ```

    ```uname -r```

    ```


    This command returns information about the version of Linux you''re running. The
    output looks similar to this:


    ```

    2.6.3-2.1.253.2.1

    ```'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Use that number to run this command:


    ```

    mkbootdisk 2.6.3-2.1.253.2.1

    ```


    You have a Fedora Core boot floppy disk when the process finishes writing to the
    disk. Restart your computer and press the Enter key at the boot: prompt. Your
    computer then starts Fedora Core.


    # “I can’t boot from my DVD”


    Problem: You get a DVD (or CD-ROM) disc that you cannot boot from. The disc may
    otherwise be good, but it just doesn’t work for booting.


    Solution: You can get around this problem by using the boot image supplied with
    the companion DVD in the back of this book to create a bootable floppy disk. (This
    disc is different from the emergency-boot floppy disk you have the option to create
    in Chapter 3.)


    Log in to your Fedora Core computer as root and mount the companion DVD, using
    the following command:


    ```

    mount /media/cdrom

    ```


    Change to the images directory on the CD-ROM:


    ```

    cd /media/cdrom/images

    ```


    Insert a disk into the floppy drive and run this command:


    ```

    dd if=bootdisk.img of=/dev/fd0

    ```


    A boot image is written to the disk, from which you can boot your computer.


    You can also create a bootable CD-ROM if you have a CD-R drive. Insert a writable
    CD-ROM (CD-R or CD-R/W) and run this command:


    ```

    cdrecord -isosize boot.iso

    ```


    # “Linux can’t find a shell script (or program)”


    Problem: You type a command name, but Linux cannot find the command, even if it’s
    in the current directory.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '**Solution:** When you type a shell or binary command name, Linux looks for
    the name in specific places and in a specific order. To find out which directories
    Linux looks in — and in which order — *type the command* `echo $PATH`.


    You see a stream similar to this one:


    ```

    ```text

    /bin:/usr/bin:/usr/local/bin

    ```

    ```


    Linux looks at these directories to find the command, program, or shell you want
    to execute. You may see more directories, depending on your distribution or how
    your system administrator (if you have one) set up your system.


    Suppose you create a shell or program named *bark* and want to execute it (assuming
    that you have set the permission bits to make *bark* executable by you). You have
    a couple of choices (you actually have more than two choices, but we list just
    the safest ones). One choice is to type this command on the command line:


    ```

    ```text

    .bark

    ```

    ```


    This line tells Linux to look in the directory you’re in ( `/` ) and execute *bark*.
    Your second choice is to move *bark* to one of the directories shown in the `PATH`
    variable, such as `/usr/local/bin`, and enter **bark** at the prompt again.


    # "I don''t know how to make the X Window System start at boot time"


    **Problem:** You don’t want to log in to command-line mode (such as in DOS) and
    type *startx*. Instead, you want to log in through the X Window System.


    **Solution:** If you like to see a graphical interface from the beginning, change
    the following line in the `/etc/inittab` file:


    ```

    ```text

    id:3:initdefault:

    ```

    ```


    to


    ```

    ```text

    id:5:initdefault:

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Chapter 21


    Ten Security Vulnerabilities and Their Fixes


    # **In This Chapter**


    +   * Simplifying your system

    +   * Encrypting your communications

    +   * Using firewalls

    +   * Updating your software

    +   * Backing up your data

    +   * Introducing buffer overflows

    +   * Getting social

    +   * Using good passwords

    +   * Scanning the horizon

    +   * Keeping track of your logs


    T hey''re here! The monster is under the bed. That big wooden horse is full of
    Greeks, er, geeks. He-e-e-ere''s Johnny! Come into the light. And so on and so
    on. However you say it, one thing''s for sure: The computer world is getting more
    dangerous.


    Do you want the good news or the bad news first? The good news is that the Internet
    has changed the world for the better and continues to do so in more (and unforeseen)
    ways. And the speed of change will only accelerate. The bad news is that because
    the Internet is constantly changing, the number of ways that someone can use the
    Internet to hurt you is always growing. This chapter outlines some of the more
    dangerous spooks who lurk out on that poorly lit electronic street.


    Our purpose in this chapter is to point you in the right direction so you can
    gain a *general* awareness of computer security. Computer security is,'
  merge: -1
  img_proc: true
- pgno: 321
  md: 'unfortunately, a complex subject. Because of the complexity of the topic of
    security, we cannot hope to do any more here than touch on some important aspects.
    We just try to give you the most bang for your buck by adding a few simple but
    effective security measures to your new Fedora Core computer.


    This chapter introduces ten important security topics. You can use them as a good
    starting point to increase your computer security.


    # How Many Daemons Can Dance on the Head of the Linux Process Table?


    Every software company wants to make its operating systems easy to install and
    use. Operating systems are inherently complex animals, and Linux is no exception.
    (Of course, we''re not biased when we say that Linux is, overall, a simpler system
    than Windows, whether you measure simplicity by the number of lines of code or
    the transparency — the open-source concept — of its design.) Companies walk the
    tightrope of making systems easy to use and also making them reasonably secure
    — they sell more copies when they make it simple — but buy their wrath when you
    get hacked.


    Ease of use and security often don''t gel along. Your operating system is much
    easier to use, for example, if you install and activate every software package
    and option. On the other hand, running every software package means that you have
    more potential vulnerabilities. Entering your own house is a breeze if you install
    10 doors and 20 windows, but the convenience also provides burglars with juicy
    opportunities. The same logic applies to your computer''s operating system: The
    more software you install, the more chances someone has of breaking into your
    computer.


    We don''t know of a cure-all for this dilemma. The best answer from a security
    viewpoint is to not provide intruders with any openings: Place your computer in
    a locked room with no network or external connections, and turn it off. You then
    have a truly safe system whose only job is to hold the floor down.


    As with most things in life, the best answer is to learn the security basics and
    then use your best judgment to balance security with convenience. Run only the
    services you need. For example, don''t run the Samba file system service if you
    don''t want to use your Fedora computer as a (Windows) file system server. Don''t
    run the text-based Cpm mouse program if you use the graphical X Window mode on
    your computer. The list is endless — and beyond the scope of this book to discuss
    in detail. You can find more info from these sources:


    +   - Web sites: Both www.sans.org and www.usenix.org deal with security issues.'
  merge: -1
  img_proc: true
- pgno: 322
  md: '+   ✔ HOWTOs: Go to www.fedora.redhat.com/docs or www.fedoranews. org and search
    for security articles. You can also go to www.redhat. com/docs/manuals/linux/RHL-9-Manual
    and open the Customization Guide and Reference documents to access security advice.
    Red Hat Linux 9 and Fedora Core 3 share a common heritage, and the Red Hat 9 manuals
    can provide you with valuable insights.


    +   ✔ **Books covering security:** Browse through your local bookstore to find
    Linux books that discuss how to reduce services. Some good books are *Red Hat
    Linux Security and Optimization*, by Mohammed K. Jibril, and *Linux Security Toolkit*,
    by David A. Banel (both published by Wiley). Although these books don’t specifically
    cover Fedora Core, they provide general Linux security information.


    # ## *Hide Your Communications with OpenSSH*


    You may find it difficult to trust communication media that you don’t completely
    control—such as university LANs, wireless home networks, and the Internet. Our
    (and Agent Mulder’s) point: Trust no one!


    The *Secure Shell* (SSH) protocol is used to conduct encrypted CLI (command-line
    interface) terminal sessions and file transfers. Fedora Core bundles OpenSSH with
    its distributions. When you install Fedora Core, you automatically get the OpenSSH
    client. You can use OpenSSH from a terminal session by entering the command `ssh
    destination`. The destination is the computer you want to communicate with. You
    can get information about OpenSSH from www.openssh.org.


    ![](img/41feae212f5c6612ff709354891f7b39_322_0.png)


    Using encryption is essential when you use wireless networking. Wi-Fi (also known
    as 802.11b or 802.11g) wireless networks can use built-in encryption based on
    the WEP (Wired Equivalent Protocol). WEP does have some significant security vulnerabilities,
    though. The only long-term answer is either to wait until the next standard comes
    along to fix the problem, or use OpenSSH to provide your own encryption. You’re
    much safer if you use OpenSSH and SSL for as much of your communication as possible.


    # ### *Aha! No Firewall—Oh Boy!*


    Broadband connections give you a quantum leap in speed and convenience when you’re
    connecting to the Internet. The two most popular choices for a broadband connection
    are DSL and cable modem. After you start using them, you may never go back to
    slow, Stone Age telephone-based modems.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'But every silver lining implies a dark cloud. Broadband connections give you
    not only last Internet connections but also continuous ones. When you''re talking
    about a telephone-based modem, a hacker refers to someone who invents and creates
    technological devices that can attack your home computer and private network only
    while you''re connected to the Internet. Using a 24/7 broadband connection means
    that every hacker on the Internet (that means every hacker in the world) can constantly
    bang on your computer and private network. That''s a lot of vulnerability.


    Firewalls provide your number-one protection from Internet-based attacks. The
    modern Netfilter/iptables packet-filtering firewall system gives you excellent
    protection when it''s properly configured. The Fedora Core installation process
    installs a good iptables-based firewall by default, and Chapter 8 describes how
    to configure an even better one. You should never, ever, connect to the Internet
    without first configuring your personal firewall.


    We don''t want to imply that you''re invulnerable to attack if you use a telephone-based
    modem to connect to the Internet. Traditional modem connections are just as vulnerable
    as continuous broadband connections when they''re active. What we mean is that
    an unconnected modem is a safe modem.


    ![](img/41feae212f5c6612ff709354891f7b39_323_0.png)


    # # Keeping Up with the Software Jonezes


    Nobody''s perfect, and that goes for operating-system vendors too. Even open-source
    Linux developers make mistakes. Vulnerabilities are found in software systems
    all the time and have to be fixed.


    Fedora Core provides a way to keep up-to-date with current problem and security
    fixes through its Web site. Go to fedora.redhat.com/download/ updates.html to
    find the newest and safest versions of all your system''s RPM packages. Refer
    to Chapter 17 for information about updating your computer.


    # # "Backups? I Don''t Need No Stinking Backups!"


    If you don''t regularly make backups of your computer''s contents, then you face
    a security vulnerability, plain and simple. You may lose some or all of your valuable
    information if your computer is compromised. You should back up your data as frequently
    as possible.'
  merge: -1
  img_proc: true
- pgno: 324
  md: 'You can choose from many techniques and software programs for making backups,
    but that’s a topic we couldn’t possibly begin to cover in this book. We wouldn’t
    be able to cover Fedora Core if we even began to go into detail. One great book
    that covers Fedora Core in great detail is *Red Hat Linux Bible: Fedora and Enterprise
    Edition*, by Christopher Negus (Wiley).


    For example, the following commands use the ubiquitous Linux *tar* package archive
    (*tar*) command to create an archive of your home directory. You can then use
    the OpenSSH *scp* command to securely copy the archive to another location, such
    as your ISP account or another computer you have access to.


    Follow these steps to create an archive of your home directory:


    +   1. **Log in to your user account.**


    +   2. **Run this *tar* command:**


    ```

    tar czf mybackup.tgz

    ```


    In this case, the *c* option means to use *tar* to create a new archive. The *z*
    option tells *tar* to compress the data. The *f* option defines the text that
    follows, *mybackup.tgz*, as the file to copy the files to. The single dot (.)
    says to copy to the archive all files in the current working directory.


    +   3. **Use OpenSSH to copy the *tar* archive to another location:**


    ```

    scp mybackup.tgz myloginaccount@myisp.com

    ```


    This command securely copies the *tar* archive to the account *mylogin account*
    at the ISP *myisp.com*.


    # # My Buffer Overflow


    Beneath the surface, computer programs — applications — are made up of many subprograms
    known as subroutines. *Subroutines* allow programmers to divide into many smaller
    tasks the task a program is to perform. Designing big or small programs without
    subroutines would be impossible.


    Whenever a program calls a subroutine, or a subroutine calls a subroutine, information
    can be passed between the two via the stack. *A stack* is like a can of tennis
    balls: The first ball pushed into the can is the last one taken out. This type
    of stack is called *first-in-last-out*. (Other variations are possible, such as
    *first-in-first-out*.) Stacks turn out to be quite efficient for transferring
    information: Memory is consumed when transferring information to a subroutine
    and then automatically released when the subroutine finishes. Stacks are also
    referred to as *buffers* and *queues*.'
  merge: -1
  img_proc: true
- pgno: 325
  md: "Although stacks make programming with subroutines efficient, they're vulnerable\
    \ to a hacking technique called *buffer overflows (or stack-smashing)*. Overflowing\
    \ a buffer is one of the most popular methods hackers use to break into computers.\
    \ The idea is to feed seemingly crazy streams of code, in binary form, to a program\
    \ in order to make them behave in ways their designers never intended.\n\nHere’s\
    \ how buffer overflows work:\n\n+   1. The character stream overflows the intended\
    \ boundaries of the subroutine’s buffer.\n+   2. When the subroutine finishes,\
    \ it reads the return address of the calling program or subroutine off the stack.\n\
    +   3. But the false return address executes the malicious hacker code — and you\
    \ have been hacked!\n\nA little more has to happen for the hacker to be successful,\
    \ but you get the idea. When a hacker finds and exploits a vulnerable program,\
    \ he gains access to your computer. Sometimes that access comes in the form of\
    \ superuser (*root*) access! Yikes!\n\nHere are some simple techniques you can\
    \ use to minimize buffer overflows:\n\n+   ✓ **Your first line of defense is simply\
    \ to minimize the number of services you run.** You run zero risk of compromise\
    \ from a buffer-overflow vulnerability in any particular service *if you don’t\
    \ run that service*.\n+   \n+   For example, the Lion worm wreaked havoc in Spring\
    \ 2001. Lion took advantage of a vulnerability in the Linux *sendmail* and *Lpd*\
    \ printer services. Computers that didn’t run those services weren’t vulnerable\
    \ to the Lion worm.\n+   \n+   ✓ **Your second defense is to update your Fedora\
    \ Core computer as often as possible.** Fedora Core posts package updates (as\
    \ they become available) that fix vulnerabilities. Buffer overflow fixes comprise\
    \ many of the package updates. Updating your system fixes many buffer overflow\
    \ vulnerabilities.\n+   \n+   Click the red exclamation button on the GNOME Panel\
    \ to start the update service. You can also run the command **yum update** to\
    \ accomplish the same function.\n+   \n+   ✓ **Your last defense is the new stack-protection\
    \ system named ExecShield.** ExecShield places a canary in the stack. *A canary\
    \ is a number that, if overwritten by a buffer overflow, creates an invalid state\
    \ for the calling software.* The software that called the compromised subroutine\
    \ sees the invalid state, and can decide to exit before any damage is done."
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Chapter 21: Ten Security Vulnerabilities and Their Fixes


    ExecShield is included in the Fedora Core kernel. When ExecShield is enabled,
    it prevents sections of a program, including its stack, from executing code or
    other programs. Some sections of a program (such as data) shouldn''t be executable
    — and that includes the stack, of course.


    ExecShield provides three modes of operation:


    Disabled: ExecShield is disabled and doesn''t affect your computer''s operation.


    You manually configure Linux to disable ExecShield by logging in as root, starting
    the GNOME Terminal, and running this command:


    ```

    echo 0 > /proc/sys/kernel/exec-shield

    ```


    Alternatively, you can add the following option to the /etc/sysctl.conf configuration
    file to turn ExecShield off at boot time:


    ```

    kernel.exec-shield = 0

    ```


    Enabled for marked binaries only: This mode, the default, enables only enabled
    programs — binaries to work with ExecShield. You may want to use this mode with,
    for example, a Web server. You would protect your most vulnerable services with
    ExecShield and not worry about, for example, your Mozilla browser.


    This mode of operation is the default for ExecShield. However, if you have changed
    to another mode, you can reset this mode by logging in as root, starting the GNOME
    Terminal, and running this command:


    ```

    echo 1 > /proc/sys/kernel/exec-shield

    ```


    Enabled for all binaries: In this mode, all programs on your computer use ExecShield.
    Because ExecShield is relatively new, we recommend this mode only for experimenting.


    You can manually configure Linux to use this higher level of security by logging
    in as root, starting the GNOME Terminal, and running the command echo 2 > /proc/sys/kernel/exec-shield.
    Alternatively, you can add the option kernel.exec-shield = 2 to the /etc/sysctl.conf
    configuration file to set ExecShield to its maximum level at boot time.


    You can find out whether a program is compatible with ExecShield. Use the program
    execstack to query and set programs to use ExecShield. For example, enter the
    command execstack -q /sbin/* and you see that a few files, such as GRUB, are compatible;
    the capital X in the first column indicates that the file has been compiled with
    the ExecShield hooks. You can set GRUB to use ExecShield by typing execstack -s
    /sbin/grub. You should eventually see more programs become ExecShield-compatible.


    ExecShield can also randomize the location where programs are loaded into your
    computer''s virtual memory. A hacker can exploit the knowledge of where a program
    is loaded into your computer''s memory. Linux loads programs at fairly predictable
    locations, but ExecShield mostly fixes the problem.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'ExecShield randomizes Linux memory by default. Woo-hoo! You can manually configure
    the ExecShield random function: Log in as root, start the GNOME Terminal, and
    run the command `echo 1 > /proc/sys/kernel/exec-shield-randomize`. Alternatively,
    you can add the line `kernel.exec-shield-randomize = 1` (or `0`) to `/etc/sysctl.conf`
    to automate the process at boot time.


    # Social Engineering 1010101010


    Hackers don''t have to discover supertechnical tricks to break into your computer.
    Many smart hackers aren''t deterred when they encounter a well-protected computer
    or network. What does a poor hacker in these security-aware times have to do to
    break into your system? Not all that much.


    Some hacker techniques don''t rely on technological means. One such technique
    is social engineering, which is a fancy way of saying "I plan to trick you or
    your associates into giving me information that I will use against you."


    Social engineering can be as simple as a hacker calling you to see whether you''re
    at home or in the office. If you''re not physically present, the hacker can drop
    by, or break in, and simply steal your computer or its disks. A hacker who''s
    not that bold may be able to gain access to a computer by tricking a help desk
    technician into resetting a password. The idea is to gain access or control of
    your computer or network in unexpected ways.


    ![](img/41feae212f5c6612ff709354891f7b39_327_0.png)


    Another social-engineering technique hackers employ is to call a corporation''s
    help desk and pretend to be a VIP. The poor minimum-wage employee can often be
    bullied or cajoled into giving out a password or other important information.


    The moral of the story is to exercise good security hygiene and be careful of
    strangers. Don''t give out information unless it''s essential and you can verify
    the authenticity of the request.


    # Bad Passwords


    The vulnerability that''s probably the easiest to avoid, and most often abused,
    is poor or non-existent passwords. Passwords are your first line of defense. If
    your password is easily guessed or — even worse — blank, someone will break in.


    Bad passwords are easy to fix. Start by assigning a password to every account
    you create — especially root. Then make it a habit to use "good" passwords. Passwords
    can be cracked by brute force because computers'
  merge: -1
  img_proc: true
- pgno: 328
  md: "have become very fast. Because you connect to the Internet, hackers can steal\
    \ your /etc/passwd file, which contains the encrypted version of your text-based\
    \ passwords, and then use a computer to crack them.\n\nDon't use any password\
    \ found in a dictionary. Simple words of any language are easy to crack. For example,\
    \ don't use the password fedora. Instead, using the words fedora and rocks, you\
    \ can change e to 3 and o to 0 and then combine them into the good password f3doraR0cks!,\
    \ which means that the cracking software has to use brute force, which takes longer,\
    \ rather than a mere dictionary search, to discover it.\n\n# Scan Me\n\nInformation\
    \ is king when it comes to people hacking into systems and keeping them out. Hackers\
    \ use knowledge about your computer and network to break into your systems. One\
    \ common and powerful tool for gaining information about which type of operating\
    \ system you have and the services it runs is nmap. This port-scanning tool can\
    \ discover a wealth of information about individual computers and networks.\n\n\
    nmap is included in the Fedora Core distribution. To install it, log in as root,\
    \ mount the DVD (insert it in to the drive), and enter the following command:\n\
    \n```\nrpm -ivh /media/cdrom/Fedora/RPMS/nmap*\n```\n\nYou can then scan yourself,\
    \ or any computer on your private network (if you have one). If you're logged\
    \ in to cancun, for example, you can run the nmap localhost command.\n\nThe nmap\
    \ command probes your internal loopback network interface — lo, for example —\
    \ and returns a list of services you're running. This list shows a sample result:\n\
    \n```\nStarting nmap 3.48 ( www.insecure.org/nmap/ ) at 2004-10-19\n\nInteresting\
    \ ports on localhost.localdomain (127.0.0.1):\n(The ports scanned but not shown\
    \ below are in state: closed)\n   Port      State    Service\n   22/tcp    open\
    \     ssh\n   25/tcp    open     smtp\n   80/tcp    open     http\n   111/tcp\
    \   open     rpcbind\n   631/tcp   open     ipp\n   6000/tcp  open     http-alt\n\
    \nNmap run completed -- 1 IP address (1 host up) scanned\n```"
  merge: -1
  img_proc: true
- pgno: 329
  md: 'If you''re a hacker, this is good stuff. By knowing that the machine is running
    certain services, you can try to find vulnerabilities to exploit. Lots of hackers
    do.


    Another good test is to log in to your ISP account and scan the Internet connection
    to which your computer or home network is attached. If your firewall is running
    correctly, the scan shows little or nothing. That''s good. If the scan displays
    information about your computer and network, your firewall either isn''t running
    correctly or isn''t running at all.


    You can use that information to your advantage. Seeing what the hackers see gives
    you the ability to plug your security holes.


    # # I Know Where You Logged In Last Summer


    Linux is good at keeping a diary. Fedora Core is configured during installation
    to keep logs of every user login and other technical information. Examining logs
    is more of an art than a science, however. (We don''t have any explicit techniques
    for determining whether your system is presently being attacked or has been broken
    into. There are, however, some good intrusion-detection products out there — Snort,
    for example — and we do know of a book that can help you: Wiley publishes *Short
    For Dummies* by Charlie Scott, Paul Wolfe, and Bert Haynes. Check it out.)


    Experience counts for a great deal when you''re examining logs for discrepancies.
    The more you keep track of your system, the more you recognize its idiosyncrasies
    and general behavior. Fedora Core stores its general-purpose logs in the `/var/log`
    directory.


    Naturally, Fedora Core provides a useful graphical log-checking utility. To run
    it, follow these steps:


    +   1.  Click the GNOME Menu and choose **System Tools::System Logs**.

    +       2.  Enter the **root password**, if you''re prompted.

    +           *   The System Log window opens.

    +       3.  Choose any of the log groups on the left submenu to see the selected
    information.


    The moral of the story is “Check your logs frequently!”'
  merge: -1
  img_proc: true
