    # Where to Go from Here


    You’re about to join the legions of people who have been using and developing
    Fedora Core and Linux. We have been using Unix for more than 20 years, Linux for
    more than 10 years, and Fedora Core (and Red Hat Linux) for almost 10 years. We
    have found Fedora Core to be a flexible, powerful operating system, capable of
    solving most problems, even without a large set of commercial software. The future
    of the Linux operating system — Fedora Core in particular — is bright. The time
    and energy you expend in becoming familiar with it will be worthwhile.'
