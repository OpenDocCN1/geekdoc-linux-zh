    # # Adding a Disk Drive


    Sooner or later, life catches up with you, and you’re likely to need or want a
    bigger house or car or a diamond in your tooth, or whatever. The same goes for
    disk space, in which case you want to add another disk drive.


    The first step to increasing your drive space is to add a new storage device.
    It can be a hard drive (IDE or SCSI) or a USB or FireWire memory stick. These
    steps describe the general process of adding a storage device and then for-matting
    and mounting it:


    1. Install the hard drive or insert the USB or FireWire device.


    ![](img/41feae212f5c6612ff709354891f7b39_358_1.png)


    If the device is an IDE or SCSI hard drive, turn off the power to your com-puter
    and monitor. Unplug the power cable and open the computer case. (Don’t cut yourself
    on the sometimes-sharp metal edges when you’re reaching into the computer.) Use
    the antistatic strap that comes with the hard drive; follow the instructions included
    with the strap.


    Most PCs use IDE controllers. SCSI-based PCs are more expensive and aren’t commonly
    owned by consumers; these SCSI types are more common in the commercial realm.
    IDE-based PCs have two IDE con-trollers. Each device can control as many as two
    IDE devices. Ribbon cables connect the controller to the devices.


    You have to configure your new disk to function as a slave device if it’s connected
    to a ribbon cable or IDE controller that already has another device (hard drive
    or CD-ROM) attached.


    If the device is a USB or FireWire memory stick, skip to Step 3.


    2. **Reboot your computer and run the `dmesg` command from a GNOME Terminal window.**'
