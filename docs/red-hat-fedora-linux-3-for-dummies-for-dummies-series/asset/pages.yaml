- pgno: 64
  md: "# Chapter 4\n\n# Getting to Know Fedora Core\n\n+   In This Chapter\n+   \n\
    +   * Booting your Fedora Core computer\n+   * Logging in to your Fedora Core\
    \ computer\n+   * Using graphical and text-based applications and utilities\n\
    +   * Setting up your monitor and video card\n+   * Getting to know the Fedora\
    \ Core file system\n+   * Making user accounts for the first time\n+   * Logging\
    \ out of your Fedora Core computer\n\nIf you have installed Fedora Core, you should\
    \ spend a few minutes studying some basics before you start using it. This chapter\
    \ covers just enough, but no more, of the Linux fundamentals needed to get you\
    \ started. We cover topics such as starting and stopping your Fedora Core computer,\
    \ understanding the difference between graphical and nongraphical applications,\
    \ and how Linux uses files.\n\nWe start by describing how to start your new Fedora\
    \ Core computer. This process is simple, but it’s helpful to know more about it.\n\
    \n# Booting Your Fedora Core Computer\n\nTo boot a computer means simply to start\
    \ it or turn the power on; to reboot a computer means to restart it. The following\
    \ steps describe how to boot your Fedora Core computer:\n\n+   1. Make sure that\
    \ your computer is turned off.\n+   2. Turn on the power to your computer."
  merge: -1
  img_proc: true
- pgno: 65
  md: 'After a short time, the Fedora Core boot menu appears on your screen. If you
    have only Fedora Core installed on your computer, you''re given only one choice
    of operating systems to boot: Linux (see Installation Stage 2: Slicing and Dicing
    the Pie in chapter 3 for more information about dual-booting).


    ![](img/41feae212f5c6612ff709354891f7b39_65_0.png)


    +   3. Press the **up-** and **down-arrow** keys to highlight the word *Linux*
    (if it''s not highlighted already) and then press **Enter**.


    +   - If you don''t press any of the keys, the default operating system (that
    is, Fedora Core, which sets itself as the default when you install it) starts
    automatically after a 10-second delay.


    +   - If you''re running more than one operating system (for example, Fedora Core
    and Windows), you can select any of the listed operating systems to boot; we assume
    here that you choose Linux.


    After you press **Enter**, Fedora Core boots. During this process, a graphical
    progress window shows how far along the boot process is. You can (optionally)
    display lots of technical information by clicking the Show details button. The
    optional information is what Linux is learning about your computer and its hardware
    (disk drives, networks, and memory, for example).


    # ## Logging In to Your Fedora Core Computer


    When you use Fedora Core (or any Linux distribution), you must log in as a particular
    user with a distinct login name. Why? Because Linux is a multiuser system — therefore
    it uses different accounts to keep people from looking at other people''s secret
    files, erasing necessary files from the system, and otherwise (intentionally or
    unintentionally) doing bad things.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The use of unique identities helps to keep the actions of one person from affecting
    the actions of another because many people may be using the same computer system
    at the same time (for example, over a network). A benefit of this strategy is
    that Linux computers are essentially invulnerable to viruses simply because no
    user’s files and directories can be used to corrupt the system as a whole.


    As Fedora Core boots, you see all sorts of messages scrolling by on the screen.
    After the scrolling stops, the login screen appears.


    +   * **REMEMBER**


    If you chose (during installation) not to have the X Window System start automatically
    whenever you boot your system, you see the login: prompt.


    If you make a mistake while typing the password or your login, the system asks
    you to retype it.


    +   * **WARNING!**


    We strongly recommend that you do most of your experimentation with Fedora Core
    as a nonprivileged user — and that you log in as the root user only when necessary.
    If you operate as root, you can delete or change anything and everything — and
    you run the risk of corrupting your system, having to reinstall the operating
    system, or losing data. When you’re logged in as a regular user, you can accidentally
    erase your own files and data, but you cannot erase someone else’s files or system
    files.


    Fortunately, Fedora Core provides many graphical administration utilities you
    can start as a nonprivileged user. Each Fedora Core administrative utility prompts
    you to enter the root password as it starts and then performs its specific function,
    but only that function, with root privileges. You’re prevented, therefore, from
    doing unintended damage to other systems. (See Appendix C for information about
    how file permissions work and how you can modify them.)


    # ## Using Graphical and Text-Based Applications and Utilities


    Fedora Core installs the graphical X Window System (also known simply as X) by
    default. You can perform most administrative tasks with the GUI-based tools (GUI
    stands for graphical user interface) that Fedora Core provides. Most of the how-to
    instructions in this book use the X-based applications and utilities. We do that
    because they’re generally easier to use — and because this book wasn’t written
    for techie systems administrators.


    Occasionally a utility or program doesn’t run graphically. Believe it or not,
    some geeKier users prefer to use a text-based system. If you’re not familiar with
    doing some basic administrative tasks with a text-based system, we'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'don''t recommend using one just because you can. Not being a geek is okay.
    We still like and respect you. On the other hand, it makes good sense to know
    some basics, just in case you have to wing it someday with the text-based interface.


    Text-based interfaces are generally run from a *shell*, which acts as a text-based
    interface between the Fedora Core operating system and you. The *bash* shell,
    which Fedora Core uses by default, displays a prompt, like this: [jldidj@cancun
    ~]$. You enter commands at the shell prompt, and the result is displayed. That''s
    where the term *command-line interface* (*CLI*) comes from.


    *Bash* stands for Bourne-Again Shell. Bash has nothing to do with Ludum movie
    sequels but is technically a command language interpreter. Bash can work interactively
    or receive its input from a file or pipe.


    You can start a shell from within the GNOME interface by starting a GNOME Terminal
    session (also known generically as a terminal emulator). Click the GNOME Applications
    button (the red hat, er, red *fedora* in the upper-right corner of the screen);
    we''ll refer to this as simply the GNOME Menu. Then choose System Tools→Terminal
    (or right-click anywhere on the GNOME Desktop and choose Open Terminal) to start
    a terminal session, as shown in Figure 4-1. (You can find out more about the GNOME
    environment in Chapter 9.)


    # Figure 4-1: A GNOME Terminal session.


    ![](img/41feae212f5c6612ff709354891f7b39_67_0.png)


    The GNOME Menu button is similar in function to the Windows Start button.


    If you want to run individual programs without starting an interactive shell,
    you can use the GNOME Run Program menu: Click the GNOME Menu button and choose
    Run Application. When the Run Application window opens, type the name of any program
    in the text box. The program then runs, if it''s graphically oriented. You don''t
    see the output if the program is designed to interact with the terminal screen
    (the technical term is *standard output*), unless'
  merge: -1
  img_proc: true
