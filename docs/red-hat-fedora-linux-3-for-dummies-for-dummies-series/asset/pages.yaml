- pgno: 22
  md: 'enter either echo “one” or echo “two” or echo “three” if you see a command
    such as echo [one|two|three] show up in the book.


    ✓ An ellipsis (. . .) means “and so on,” or to repeat the preceding command line
    as needed.


    Don’t concern yourself much with these conventions for now. In most chapters in
    this book, you don’t need to fuss all that much with these details. When you do
    need to know something about a particular syntax, come back to this introduction
    for a refresher course.


    # Keystrokes and clicks


    Some instructions require that you press a specific key or keys to execute the
    desired result. If you need to press a single key, we say, for example, “press
    the A key.” We use a plus sign to indicate multiple keys. For example, Ctrl+Alt+
    Delete means that you should press the Ctrl key, Alt key, and Delete key all at
    the same time.


    Most applications and utilities we describe in this book use a graphical user
    interface (GUI), such as the Fedora Core display or network configuration utility,
    which allows you to control your computer by pointing and clicking with your mouse.
    When we tell you to “click” something, we want you to press the left button on
    your mouse. Some actions require that you use the right button; in those cases,
    we explicitly say “right-click.”


    # How This Book Is Organized


    Like all proper For Dummies books, Red Hat Fedora Linux 3 For Dummies is organized
    into independent parts. You can read the parts in any order. (Heck, if you’ve
    ever seen the movie Memento, you may want to read the parts in reverse.) Basically,
    this book isn’t meant to be read from front cover to back; rather, it’s meant
    to be a reference book that helps you find what you’re looking for when you’re
    looking for it. Between the Contents at a Glance page, the table of contents,
    and the index, you should have no problem finding what you need.


    If you do read the chapters in this book in order, you encounter the useful and
    interesting things first and the more technical items last. For example, after
    installing Fedora Core in Part I, you may want to proceed immediately to Part
    II to see how to connect Linux to the Internet or your local network. From there,
    you can use your new workstation to surf the Internet and use e-mail.


    The following sections describe each part.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Part I: Installing Fedora Core


    In Part I, we introduce the Linux operating system, a dash of its history, and
    some things you can do with the Fedora Core distribution. We also describe how
    to prepare your computer to install Fedora Core; because many, if not most, computers
    come with another (ahem) operating system installed, we describe how to reorganize
    your computer''s hard drive so you can install Linux. You find out what Linux
    is and how to prepare your computer to install Fedora Core. We then walk you through
    the installation and show you the basics of working with Fedora Core.


    # Part II: Got Net?


    In Part II, you find out about connecting to the Internet and local networks.
    You see how to jump on the Internet with your everyday modem, high-speed (broadband)
    DSL connection, or cable modem. We also show you how to connect to an existing
    network. If that local network has a high-speed Internet connection, you can use
    it as your portal to the wonderful world of surfing. The Internet can be dangerous,
    so we include instructions for creating your own firewall.


    # Part III: Linux, Huh! What Is It Good For? Absolutely Everything!


    Part III guides you through the particulars of doing something with Fedora Core.
    This part introduces you to the GNOME desktop window environment and takes you
    through its paces by finding out how to move, resize, hide, and close windows
    and how to use the file manager and much more. Two chapters are devoted to using
    the Fedora Core multimedia capabilities, such as listening to CDs and MP3s, in
    addition to how to rip and record them. The world''s online radio stations are
    now available to you with streaming-media technology. We introduce you to the
    Mozilla browser so you can surf the Net and use the Evolution organizer to read
    your e-mail, use your calendar, and perform other tasks. We also describe in detail
    the full-featured OpenOffice desktop-productivity suite. You can use OpenOffice
    with your Fedora Core machine to do all your writing and other work-related functions.
    You can even write a book with it!'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Part IV: Revenge of the Nerds


    In Part IV, we guide you through the use of your Fedora Core computer''s network
    capabilities. It''s Nerd City, but it''s also fun and useful. We start by showing
    you how to build a simple network. After your network is up and running, we describe
    how to build network services, such as the Apache Web server, Samba, and printer
    servers. The last two chapters in this part are devoted to exploring the art of
    network computer security and troubleshooting network problems. Insert your pocket
    protector, strap the old Hewlett-Packard calculator to your hip, retape your glasses,
    and get ready for Saturday night!


    # Part V: The Part of Tens


    A For Dummies book just isn''t complete without The Part of Tens, where you can
    find ten all-important resources and answers to the ten most bothersome questions
    people have after installing Fedora Core. (The folks at Red Hat Software provided
    these questions; they''d know.) We introduce the ten most important security concerns
    too.


    # Part VI: Appendices


    Ah, the appendices. Appendix A outlines the Fedora Core systems administration
    utilities. Appendix B describes how to find out about the details of your computer''s
    individual pieces of hardware; this information is sometimes helpful when you''re
    installing Fedora Core. Appendices C and D introduce you to using and managing
    the Linux file system. Appendix E shows how to use the Red Hat Package manager
    (RPM). Appendix F completes this book by describing what you can find on the companion
    DVD.


    # What You''re Not to Read


    Heck, you don''t have to read any of Red Hat Fedora Linux 3 For Dummies if you
    don''t want to, but then, why did you buy it? (Not that we''re complaining.) Part
    I has background information. If you don''t want it, don''t read it. Also, the
    text in sidebars is optional, although often helpful. If you''re on the fast track
    to using Fedora Core, you can skip the sidebars and the text next to the Technical
    Stuff icon, as described in the following section. But we suggest instead that
    you slow down a bit and enjoy the experience.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Icons in This Book


