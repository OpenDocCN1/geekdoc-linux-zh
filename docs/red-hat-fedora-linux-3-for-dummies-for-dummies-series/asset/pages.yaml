    \ of the information you entered in the preceding steps.\n\n+   9. **Review the\
    \ summary and click the Apply button.**\n+   \n+   You return to the Network Configuration\
    \ window, which now displays the newly configured Ethernet NIC.\n\n+   10. **Save\
    \ the new configuration by choosing File→Save.**\n+   \n+   A dialog box opens,\
    \ informing you that your changes have been saved. Click the OK button to continue.\n\
    \n+   11. **Start the NIC by clicking the Activate button.**\n+   \n+   This step\
    \ completes your Ethernet NIC configuration.\n\nYour Ethernet NIC is now active.\
    \ But you still need to configure your domain name service (DNS) if you aren’t\
