    # Introducing YUM


    The Yellowdog Updater, Manager (YUM) is, simply put, a wonderful system. YUM takes
    software installation and management to the next level by providing three functions
    that RPM doesn’t:


    +   ✔ **Takes over the task of finding and obtaining software packages:** YUM
    can download packages from the Internet (or a private network), a DVD or CD-ROM,
    or your local hard disk.


    +   ✔ **Computes package dependencies:** If you want to install an RPM package
    that happens to require the installation of other packages, you usually have to
    determine what those packages are, find them, and install them manually.


    +   ✔ **Updates your computer:** YUM can update your entire Fedora Core computer
    as well as install and remove individual packages or package groups. RPM can update
    individual packages, but not your entire system. The YUM update option performs
    the same function as the Red Hat up2date system.


    YUM is easy to configure, and can access multiple software repositories (mirrors).
    Here’s the default YUM configuration, /etc/yum.conf:


    ```

    cachedir=/var/cache/yum

    debuglevel=2

    logfile=/var/log/yum.log

    pkgpolicy=newest

    ```'
  merge: -1
  img_proc: true
