    # # Installation Stage 1: Beginning the Journey


    Before you install Fedora Core, you need to insert the companion DVD into the
    DVD/CD-ROM drive and boot or reboot your computer. The instructions in this section
    describe how to start installing Fedora Core on your computer.


    This section gets you started with the Fedora Core installation process. Use these
    initial steps to start the installation and perform some basic configuration:


    +   1.  Insert the companion DVD and boot (start) your computer. (If your computer
    can’t boot from a DVD, use the coupon on the back of this book to obtain Fedora
    Core CD-ROMs.)

    +       After contemplating the meaning of life, your computer displays the first
    installation screen, which includes the boot: prompt.

    +   2.  Press Enter.

    +       A series of messages scroll by, indicating the hardware that the Linux
    kernel detects on your computer. Most of the time, particularly with'
