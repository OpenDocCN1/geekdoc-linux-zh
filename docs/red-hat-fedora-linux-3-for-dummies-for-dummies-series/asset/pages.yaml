- pgno: 129
  md: "# Introducing the X Window System\n\nFedora Core gives you the option of using\
    \ the GNOME and KDE desktop environments. GNOME and KDE, however, run on top of\
    \ X, and X runs on Linux. X is the software that provides the low-level graphical\
    \ bits and pieces that systems like GNOME use. X is the foundation that makes\
    \ complex systems like GNOME possible.\n\nX is composed of three parts:\n\n+ \
    \  • The X server  \n+   • Numerous graphics libraries  \n+   • A set of X client\
    \ graphics applications\n\nThe X server is a program that communicates with the\
    \ human-interactive hardware on your computer — such as the video card, keyboard,\
    \ and mouse — acting as the liaison between the hardware and other graphics software.\
    \ It uses the graphics libraries — software shared by many programs — to work\
    \ properly with the graphics hardware.\n\nX clients are the graphical programs\
    \ (such as Mozilla and xclock) that you interact with. X clients display their\
    \ graphical output through the X server; they also get their keyboard and mouse\
    \ input through the X server. X clients can be run on the same computer that the\
    \ X server runs on or across a network to any computer running an X server. For\
    \ example, by using X, you can run an X client on a computer on the other side\
    \ of the world and view it on the X server running on your home computer.\n\n\
    Suppose you're logged in remotely to a computer in Australia and you want to see\
    \ what time it is there. You could run the text-based date command (from a CLI)\
    \ to see the date and time, but that would be boring. Alternatively, you could\
    \ run the xclock program on the remote machine and see a graphical clock displayed\
    \ on your local computer. You can then verify that the Aussies use clocks that\
    \ indeed run clockwise and have 24-hour days.\n\n![](img/41feae212f5c6612ff709354891f7b39_129_0.png)\n\
    \nThe X server program, often called simply X, isn't part of the operating system,\
    \ as it is in some other operating systems. Instead, the X server is a user-level\
    \ program — although it's special and complex.\n\nThe X Window System provides\
    \ the foundation for these graphics-based systems:\n\n+   • **Desktop environment:**\
    \ A desktop environment is equivalent to a house where X is the foundation. GNOME\
    \ and KDE are desktop environments that make using your computer easy, providing\
    \ high-level functions such as menu systems, icons, and backgrounds."
  merge: -1
