- pgno: 131
  md: '![](img/41feae212f5c6612ff709354891f7b39_131_0.png)


    # # Introducing the GNOME Desktop


    GNOME performs all the basic graphical functions you expect from a desktop environment.
    You can set the background and create icons, for example. This section shows how
    to perform some basic GNOME desktop maneuvers and configurations. After you master
    the basics, you can continue to explore on your own.


    The default GNOME desktop, as installed by the Fedora Core installation, comes
    with several elements preinstalled. This section of the chapter takes a quick
    trip around the desktop.


    # ## Introducing the default desktop icons


    In the upper-left corner of the desktop are four icons: Computer, your home directory,
    your hard drive (for instance, ide1disk1), and Trash (refer to Figure 9-1). You''ll
    also see an icon for each CD-ROM/DVD that you''ve inserted and any additional
    hard drives. The following list describes the function of each standard icon:'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   **Computer:** This icon links to your local file system and network shares.
    Double-clicking the Computer icon opens a window showing four icons: Floppy, CD-ROM,
    Filesystem, and Network (you won''t see the Floppy or CD-ROM icons if you don''t
    have those devices). Double-clicking the Filesystem icon opens a window showing
    all your root-level directories (see Chapter 4) such as /usr and /home. Opening
    the Network icon allows you to browse the network file shares on your network.
    This network provides the same function as Windows Network Neighborhood.


    +   **Home directory:** This icon, which looks like a folder, represents your
    home directory. For example, if you create a user account named `lidia`, a directory
    named `/home/lidia` is created; the icon is labeled `lidia`''s Home. When you
    log in as `lidia`, the home directory icon is linked to that directory. Double-click
    the home directory (or right-click and choose Open) and a Nautilus window opens,
    displaying the contents of the home directory.

    +   Double-click an icon to open the Nautilus window associated with the icon.
    For example, double-clicking your home directory opens a Nautilus file manager
    window linked to your home directory. You can also open an icon by right-clicking
    it and choosing the Open option.


    +   **ideisk1:** This icon is similar to your Home directory icon, except it shows
    the root-level view of your hard drive. Instead of showing the contents of `/home/lidia`,
    it shows `/` by default.

    +   Your hard drive icon name will most likely be ideisk1 because most PCs use
    IDE (Integrated Drive Electronics) hard disks. However, if your computer uses
    SCSI (Small Computer System Interface) disks, then the icon will be called scsidsk1.


    +   **Trash icon:** GNOME provides a method you can use to dispose of files and
    directories via the Trash directory. Click any icon on your desktop, or directory
    and drag it to the Trash icon. Although Jesse James'' *Monster Garage* converted
    minivan trash truck doesn''t come for your file, it''s placed in the Trash directory.
    Like the trashcan in your home, the Trash directory sits in your home directory.

    +   Trashed items aren''t really deleted until you right-click the Trash icon
    and choose Empty trash. You can undelete items by opening the Trash (double-clicking
    the icon) and then clicking the item and dragging it out onto the desktop or to
    an open Preferences window.


    ![](img/41feae212f5c6612ff709354891f7b39_132_0.png)


    ![](img/41feae212f5c6612ff709354891f7b39_132_1.png)


    GNOME provides two methods for running programs from a text-based CLI. You can
    start a GNOME Terminal emulator window or use the GNOME Run Program function.
    The former opens a bash shell in a Terminal emulator window, from which you can
    launch applications. The latter opens a window in which you can enter the name
    of a program to execute. The primary difference between the two systems is that
    you can interact with an application more when you''re using the terminal emulator.
    The Run Program system allows you to interact with an application only if it creates
    a GUI.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Changing GNOME''s look and feel


    GNOME gives you a way to change the look and feel of its elements — that is, their
    *theme*: the size, shape, texture, and color of the buttons, slides, menus, borders,
    and other pieces of an open window.


    # Changing themes


    You can change your theme more easily and quickly than a politician after an election
    by choosing *Preferences*→*Theme* from the GNOME menu; alternatively, you can
    open the *Start Here* icon and select *Preferences* in the window that opens.
    Double-click the *Theme* icon when the *Preferences* window opens.


    When the *Theme Preferences* window opens, the *Application* tab is activated
    by default. You can select any theme and all your open windows immediately adopt
    it. The application theme changes the tint and texture applied to each window.
    For example, selecting the *Metal* theme gives your windows a brushed surface
    appearance.


    Click the *Window Border* tab. Click any of the themes and your window borders
    change. Window borders consist of the tint and texture of the strip that surrounds
    each window and the buttons on the strip.


    Keep selecting different themes until you find one you like. Click the *Close*
    button when you''re finished.


    # Changing desktop backgrounds


    You can also alter the image that''s displayed on your desktop. The image can
    be a picture, a pattern, or solid colors. Change the desktop to find one you like
    by right-clicking any blank (uncluttered) section of the desktop. Choose *Change
    Desktop Background* from the menu and the *Background Preferences* window opens.
    Select an image by clicking the *Picture* section or one of its variations. The
    *Please Select an Image* window opens. You can select any listed image or search
    for another image on your disk. Alternatively, you can select a solid color by
    clicking the *No Picture* button.


    Open the *Background Style* menu and select either a *solid color* or a set of
    colors that change on the vertical or horizontal axis. You can then change the
    color (solid or gradient) by clicking the *Color* button. Select your color from
    the *Pick a Color* window. Repeat the process for the other color and you get
    a screen full of colors.


    ![](img/41feae212f5c6612ff709354891f7b39_133_0.png)


    Right-clicking anywhere on a blank section of the desktop and then choosing *Use
    Default Background* resets the background. The default background is reactivated.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# Toiling in your workplace


    After using GNOME for a while, you find that as you start more and more applications,
    you create lots and lots of windows on the screen. You may even lose windows behind
    other windows. You start to suspect you''ll have to strap together several monitors
    so you can display all the windows at once.


    Monitors and flat panels are either heavy or expensive or both, so you''re probably
    stuck using a single monitor. But you don''t have to be stuck with one screen.
    GNOME lets you spread your work across multiple virtual monitors.


    Imagine that you have a large GNOME desktop spread equally across four monitors.
    Life would be good if you could open windows on any of the monitors. You would
    have lots of real estate to spread out on.


    However, because you probably don''t *have* four monitors, GNOME subdivides the
    one you have into four virtual monitors called *workspaces*. Each workspace is
    equivalent to a real monitor, and you can spread out your work across it. The
    only limitation is that you can view only one workspace at a time.


    # Trading places on your Workspace Switcher


    Switching between workspaces is easy. GNOME provides a utility, the Workspace
    Switcher, to select any workspace. The Workspace Switcher is on the GNOME Panel.


    You use the GNOME Workspace Switcher to access each workspace. The Workspace Switcher
    is divided into four quadrants. Clicking any quadrant displays the corresponding
    desktop; you may want, for example, to pull the lower-left one (for example) and
    you enter that workspace.


    You can force a window into any or all workspaces. Click the downward-facing arrow
    in the upper-left corner of a window. The menu that opens provides all the expected
    functions that close, minimize, maximize, and resize the window. However, toward
    the bottom of the menu are options for placing the window in any of the remaining
    three workspaces — or you can put the window in all the workspaces. You may want,
    for example, to pull an application like Mozilla in all workspaces in order to
    use it no matter what you''re doing.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Using GNOME Windows


    Before you can do anything to a window, you have to get its attention. When you
    have a window’s attention, it has *focus*. Depending on how you have set up GNOME,
    you can give a window focus with GNOME in several ways:


    +   * Click the window’s minimized icon on the GNOME Panel.

    +   * Click the window’s title bar, at the top of the window.

    +   * Click a part of the window itself, which typically also makes the window
    the topmost one. This method is the default.


    ![](img/41feae212f5c6612ff709354891f7b39_135_0.png)


    In this book, we stick with the Fedora Core and GNOME default setting that gives
    focus to a window when you click it.


    # ## Moving windows


    To move a window, click anywhere on the window’s title bar with the left mouse
    button (and hold it down). As long as you continue to hold down that button, the
    window moves anywhere that you move your mouse. Release the button and the window
    stays there.


    # ## Resizing windows


    Sometimes a window is a little too big or a little too small, and life would be
    much easier if you could just nudge that window into shape. To do just that, position
    the mouse cursor on any border of the window. Click and drag the window’s outline
    to the size you want. Release the mouse button and the window takes the new size.


    # ## Minimizing windows


    Now that you have put lots of windows on the screen, how can you get rid of a
    *few* or all of them? You can *minimize* (or *iconify* — what a conceit) a window
    by clicking the bold, underscored button toward the upper-right corner, which
    removes the window from the desktop and places it in a storage area of the GNOME
    Panel. If you’re in a particularly devilish mood, you can be more drastic and
    *close* a window. You can see the icon on the GNOME Panel along the lower, central
    edge of the screen.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Here are a few ways to get rid of a window, starting with the least drastic
    and escalating to outright window death:


    +   1. Take advantage of any exit buttons or menu options that the window (or
    application in the window) gives you. For example, many applications allow you
    to choose *File*→*Exit* to close the application.

    +   2. Click the X button in the upper-right corner of the window''s title bar
    to close the window.

    +   3. Click the upper-left corner of the window (or right-click the title bar)
    and choose the Close option from the menu that opens.


    ![](img/41feae212f5c6612ff709354891f7b39_136_0.png)


    You can return a minimized window to the desktop by clicking the icon that corresponds
    to the window on the GNOME Panel.


    # ## Maximizing windows


    To make a window fill the entire screen, click the Maximize button in the upper-right
    corner of the window. Check out the buttons to the right of the title bar in a
    typical window: The Maximize button is the one in the middle; it looks like a
    square and works like the Cascade button in Windows.


    # ## Making GNOME Desktop Icons


    You can create an icon on your desktop for any application on the GNOME menu.
    Just click the GNOME Menu button, find the menu item for the application you want
    an icon for, and then click the application''s icon and continue to hold the mouse
    button. While holding the mouse button, drag the cursor to any open area on the
    GNOME desktop. Release the mouse button and an icon for that application is placed
    on the GNOME Desktop. You can then start the application by double-clicking the
    icon on the desktop.


    With GNOME, you can enhance icons with *emblems*—additional information about
    what an icon is supposed to do. You can assign an emblem by right-clicking an
    icon and choosing Properties. The Properties window opens. Click the Emblems tab
    and select one of the emblems. For example, if you select the Cool emblem, a pair
    of Wayfarer sunglasses is displayed with the icon on the desktop—cool.


    Another cool GNOME icon feature is the ability to stretch an icon''s boundaries.
    Right-click an icon and choose Stretch. A dashed line and four square buttons
    bracket the icon. Click any button and you can stretch the icon image as much
    as you want.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Introducing the GNOME Panel


    The GNOME Panel is the menu bar along the bottom of the desktop. The GNOME Panel,
    similar to the taskbar in Windows, provides a location to place common menus and
    applets for easy opening or viewing. The GNOME Panel also gives you a view of
    the virtual desktop and enables you to keep track of minimized windows.


    By default, Fedora Core places icons on the GNOME Panel for accessing the GNOME
    menu, Mozilla, Evolution, OpenOffice (Writer, Impress, and Calc), a printer, the
    time, the up2date applet, and the GNOME Workspace Switcher. You can start any
    of these programs and utilities or use the Switcher by clicking its icon.


    The most important element on the GNOME Panel is the GNOME Menu button on the
    far left side, which you use to access all standard GNOME applications and configuration
    tools. The GNOME Menu button, which looks amazingly similar to a red fedora, is
    in the lower-left corner of the screen. You can choose from any of the menus that
    are displayed when you click the GNOME Menu button. For example, the System Settings
    and System Tools menus contain many of the Fedora Core utilities you can use to
    administer your Fedora Core computer. The Sound & Video menu provides access to
    multimedia programs, and the Graphics menu provides access to applications that
    manipulate graphics. You get the idea.


    You can right-click on any GNOME Panel icon to remove it, move it, lock it in
    place or change its launcher’s properties. Changing the icon launcher’s properties
    allows you to change the icon name, comment, command, type or icon graphics.


    You can add icons to the GNOME Panel by right-clicking on any unused portion of
    the GNOME Panel and selecting Add to Panel... and then selecting the icon from
    the Add to Bottom Panel menu window. For instance, select Add to Panel... and
    the Add to Bottom Panel window opens. Select the Application Launcher option and
    then click the Forward button. Click on the Internet option, select Mozilla and
    click the Add button. The Mozilla blue globe and mouse icon is added to the GNOME
    Panel. Another interesting function of the GNOME Panel menu is the Custom Application
    Launcher utility. Open the Add to Bottom Panel window again. Select the Custom
    Application Launcher option and click the Add button. The Create Launcher Applet
    window opens. By entering the name and pathname of an application in the appropriate
    text boxes, you can add a new applet to the GNOME Panel that launches that application.


    Give it a try. For example, if you frequently log into another computer using
    SSH, you can add a custom icon that simplifies the task as follows:'
  merge: -1
  img_proc: true
