- pgno: 240
  md: '```

    ;cancun.paunchy.net.              IN    A

    ;; ANSWER SECTION:

    cancun.paunchy.net.     86400   IN  A 192.168.1.1

    ;; AUTHORITY SECTION:

    paunchy.net.            86400   IN  NS ns.paunchy.net.

    Received 69 bytes from 192.168.1.120#53 in 263 ms

    ```


    This list describes what the various sections in the preceding output mean:


    +   - **Question section:** You see in the *Question* section that the query is
    `cancun.paunchy.net`. Note that we ask for *only* the address of cancun, but that
    the `search` parameter in the `resolv.conf` file specifies that the `paunchy.net`
    domain be appended to cancun. You also see that an A record is part of the query
    — you’re asking for an IP address.


    +   - **Answer section:** This section shows you the answer to your query. The
    answer includes the host name and domain — `cancun.paunchy.net` — and its numeric
    IP address. The *Answer* section also includes the time-to-live (TTL) value.


    +   - **Authority section:** The data in this section shows where the information
    was found in the preceding *Answer* section. You got the answer from the name
    server — `192.168.1.254` — that you just built.


    All the computers on your network can use your DNS server. Your DNS server supplies
    addresses for all internal machines. The server forwards requests for external
    addresses as necessary.


    # # Building a Samba Server


    Early in the game, Linux gained much popularity by acting as a file server for
    both Windows and Linux computers. It did that by dancing the Samba. Samba is more
    than just a dance they do in Brazil: It’s a suite of programs that speaks the
    same file-sharing language (the *protocol*) as Microsoft Windows. Using Samba
    produces a way to share the Linux file system on a network.


    This section describes how to install and configure Samba on your Fedora Core
    computer. Samba comes bundled with Fedora Core, of course, so installation is
    a breeze. Samba is also configured to automatically share the ubiquitous /home
    directory, so configuration is also easy.


    ![](img/41feae212f5c6612ff709354891f7b39_240_0.png)'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'Samba consists of several programs, configuration files, and documentation
    files. The complete Samba package consists of four RPM files that come bundled
    on the DVD accompanying this book. The following list describes the purpose of
    each RPM file:


    +   ✔ **samba-client:** This package contains the utility and other supporting
    software to connect a Linux computer to a Samba server. You can use the interactive
    utility smbc!ient to connect to a Samba share. The default Fedora Core installation
    installs this package by default.


    +   ✔ **samba:** The Samba server software is included in this package. All the
    programs for sharing files, directories, and printers are included here; the two
    essential daemons are smbd and nmbd; the essential configuration file is smb.conf.
    The utilities for controlling the daemons are also included.


    +   ✔ **samba-swat:** You can manually configure the Samba configuration file,
    smb.conf, if you''re an expert. However, Samba provides a Web-based system that
    is much easier to use and produces clean and readable configuration files.


    +   ✔ **samba-common:** All the software required by the other three packages
    is included in this file. This package is also installed by default.


    ![](img/41feae212f5c6612ff709354891f7b39_241_0.png)


    Samba was originally designed and coded by Andrew Tridgell, of Australia. Samba
    instantly became popular worldwide — and became too much work for a few people
    to handle — so the Samba Project was started to take care of further development
    and promotion. You can find more information about Samba at www.samba.org.


    # Installing Samba


    We start by showing you how to install all the Samba software on your computer.
    Follow these steps:


    +   1. Log in as any user.


    +   2. Insert the Fedora Core companion DVD into the DVD/CD-ROM drive.


    +   3. Click the GNOME Menu and choose System Settings > Add/Remove Applications.

    +      If you''re not logged in as root, the Query window opens.


    +   4. Enter the root password if you''re prompted.

    +      The Add and Remove Software window opens.


    +   5. Scroll down to the Servers section and click the Windows File Server button.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '+   6. Click the Update button.

