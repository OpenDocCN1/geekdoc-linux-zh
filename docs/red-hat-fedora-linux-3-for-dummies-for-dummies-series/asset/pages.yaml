    \ computer you securely communicate with. These steps describe how to copy and\
    \ configure them:\n\n+   1.  **Log in to your user account on the local computer.**\n\
    +   \n+       For example, log in as the user `rod` on `cancun`.\n\n+   2.  **Open\
    \ a GNOME Terminal window by clicking the GNOME Menu button and choosing System\
    \ Tools>Terminal.**\n\n+   3.  **Copy your public key to your account on the remote\
    \ computer.** For example, if your account on the remote computer `cancun` is\
    \ `rod`, you can use Secure Copy (`scp`):\n+   \n+       ```\n+       scp .ssh/id_dsa.pub\
    \ rod@cancun:\n+       ```\n+   \n+       In this example, you’re connecting to\
    \ the same computer you’re already logged in to. This technique is the simplest\
    \ way to test the OpenSSH server you’re experimenting with. No other machines,\
    \ or even a network, are needed.\n\n+   4.  **Enter your account password when\
