- pgno: 244
  md: 'Use the following instructions to restart the Samba daemons and make your changes
    visible to your network.


    +   Click the **STATUS** button.


    +   Click the **Start All** button.


    The Samba daemons — smbd and nmbd — start. You can restart these daemons by clicking
    the Restart All button.


    Share authentication essentially leaves your Samba server open to anyone who wants
    to browse it. In this case, however, you''re still safe because you''re exporting
    the DVD/CD-ROM drive — which is read-only. Nobody can modify your file


    ![](img/41feae212f5c6612ff709354891f7b39_244_0.png)


    Using the Share authentication option makes sharing objects a breeze — but use
    it carefully. This option also increases your security risks because there''s
    no password protection. This risk is generally acceptable when sharing read-only
    objects such as printers and CD-ROMs (although you do risk unauthorized reading
    of what''s on your read-only media). However, if you start exporting read-write
    shares, such as your home directory, you should switch to User Authentication
    mode and add user names with passwords to your Samba configuration. In that case,
    you have to authenticate from your Windows computer and specify a user name and
    password before you can print.


    # ## Building a Print Server


    Fedora Core easily works with many, if not most, makes and models of printers.
    All you have to do is connect your computer to the printer, run the printer-configuration
    utility, and you''re done.


    Most consumer-level printers must be physically connected to a computer to work;
    physical connections use either USB (Universal Serial Bus) or parallel-port cables.
    Many business-type printers, however, use either physical or network connections.
    Although Fedora Core computers can connect to either type, we focus on those that
    use physical connections.


    You can, of course, use your Fedora Core computer as a print server for your network.


    The following section describes how to physically connect your Fedora Core computer
    to a printer. The subsequent two sections show how to configure a network print
    server for both Linux and Windows computers.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Connecting your computer to a printer


    You have two types of printers to choose between when you’re creating a print
    server:


    +   ✓ **Networked printers:** Printers that can be connected directly to a LAN
    are networked printers. They have their own Ethernet (and, in the future, wireless)
    NICs. Networked printers are divided between those that can act as their own print
    servers (also called *print spoolers*) and the ones that need to be connected
    to print servers.


    +   ✓ **Non-networked, locally connected printers:** Local printers must be connected
    to a computer through the traditional parallel port or Universal Serial Bus (USB)
    connector. The computer and printer must be close enough to each other to connect
    via parallel or USB cables.


    Non-networked, locally connected printers outnumber networked printers because
    they cost less. But locally connected printers are less flexible because they
    must be connected directly to a computer; networked printers can be located anywhere
    that a network connection exists.


    This section describes how to use non-networked computers because they’re so common.
    The process is simple: You connect your printer to the Linux print server via
    the USB or parallel port. After you’re connected, the Linux computer can be configured
    to send print jobs to the printer.


    Using a parallel port requires no configuration of the Linux operating system.
    The USB connection, however, requires that Linux load a USB *kernel module* (essentially
    a driver; in Windows terminology — a small program that tells the computer how
    to run the device). Loading the kernel module is automatic.


    # Configuring a local printer


    After you connect a printer, you have to configure Linux to act as a print server.
    Fedora Core provides an excellent print-configuration utility that we’ll use later
    to configure our printer.


    Fedora Core can handle five printer types. The printer-configuration utility allows
    you to configure each type. This list describes the printer types:


    +   ✓ **Locally connected:** Use this type if your printer is physically connected
    to your computer through a USB or parallel port. We use this type of configuration
    in the steps in this section to show you how to connect a printer to the Fedora
    Core print server.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   Networked CUPS (IPP): The Common Unix Printing System (CUPS) is the new
    de facto Linux and Unix printing standard. CUPS uses the Internet Printing Protocol
    (IPP) and is easy to use. Windows computers cannot print through CUPS. We use
    CUPS for the Linux-to-Linux networked print server that we describe in the following
    section.


    +   Networked Unix (LPD): The Line Printing Daemon (LPD) is the older printing
    protocol used by Linux and Unix. You can use this system if you’re creating a
    print server that only other Linux and Unix computers use. Windows computers cannot
    print through LPD.


    +   Networked Windows (SMB): Use this printer type if you’re printing to a Windows
    print server. Samba makes the print server look like a Windows print server; the
    clients on the private network use this setting.


    +   Networked Novell: Use this printer type if you’re printing to a Novell print
    server.


    +   Networked JetDirect: Use this printer type if you’re printing to a Hewlett-Packard
    (HP) JetDirect printer. The HP JetDirect interface is built into many HP and other
    printers. You can also purchase JetDirect print server devices that connect to
    non-networked, traditional printers. JetDirect print servers convert traditional
    printers into networked printers.


    The configuration utility works with many different types of printers. The following
    instructions show you how to configure an Epson Stylust printer because it’s a
    good, inexpensive, and common inkjet printer:


    +   1. Connect your printer to your computer by plugging in the appropriate (USB
    or parallel port) cable.


    +   2. Click the GNOME Menu button and choose System Settings→Printing. The Query
    dialog box opens if you’re not logged in as *root*.


    +   3. Enter the *root* password, if you’re prompted to do so. The Printer configuration
    window opens.


    +   4. Click the New button. A dialog box labeled *Add a new print queue* opens.


    +   5. Click the Forward button. The Queue Name dialog box opens, and you’re prompted
    to enter a name for the queue (plus an optional short description of the printer).


    +   6. Enter the name of the printer queue in the Name text box (the default is
    *printer*).'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'You can use any name you want for the queue name. For example, `Epson777` clearly
    indicates that you’re accessing an Epson Stylus 777 printer.


    +   7. Click the Forward button and the Queue Type dialog box opens.


    The printer-configuration utility should detect the printer attached to either
    the USB or parallel port.


    You can also configure a networked printer here, if you have one. For example,
    if you have a high-end HP LaserJet with a JetDirect interface, select Networked
    Jet-­Direct rather than Locally-­connected.


    ![](img/41feae212f5c6612ff709354891f7b39_247_0.png)


    Linux parallel (printer) ports correspond to Windows printer ports. Linux lpt0
    is equivalent to LPT1, and /dev/lpt1 is equivalent to LPT2.


    +   8. Click the printer device (typically, it should be listed as /dev/lpt0 or
    /dev/lpt1) and then click the Forward button.


    The Printer model window pops up.


    +   9. Click the Generic (click to select manufacturer) pull-­down menu and select
    your printer’s manufacturer.


    For example, select Epson. The manufacturer’s model list appears.


    +   10. Scroll down the model list and select your printer model.


    For example, select Stylus Color 777.


    +   11. Click the Forward button and then the Finish button.


    The Question dialog box opens.


    +   12. Click the Yes button to print a test page.


    The printer utility prints a test page and opens a dialog box.


    +   13. Click the Yes button, assuming that the test page was printed successfully.


    Clicking the No button displays the print queue log file in a dialog box. Control
    returns to the Printer Configuration window.


    +   14. Click the Apply button to save your new printer configuration and then
    close the configuration utility by choosing Action: Quit.


    The printer-­configuration utility closes and you have yourself a functioning
    printer.


    Now you can print from your Fedora Core computer to your printer. That’s great
    — and many people find this simple configuration is all they need. However, you
    can configure your computer to function as a network print server.'
  merge: -1
  img_proc: true
- pgno: 248
  md: "# # Sharing your printer to your private network\n\nThis section describes\
    \ how to set up another Fedora Core or Linux computer to print through your print\
    \ server. The first step requires you to share your printer on your network. The\
    \ following steps show you how to create a printer queue to service your network:\n\
