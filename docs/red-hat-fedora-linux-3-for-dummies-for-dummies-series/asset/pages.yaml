  md: '# **352** Part VI: Appendices


    +   - **exarch:** YUM can also be strict about the architecture of the packages
    it installs. When YUM is set to its default of `1`, it doesn''t install an `i386`
    if the installed package is `i686`.

    +   - **exclude:** You can tell YUM not to install certain packages. For example,
    if you don''t want YUM to automatically update your Linux kernel, set `exclude-kernel*`.


    The remaining contents of `/etc/yum.conf` contain the Server sections. These sections
    tell YUM where to look for RPM packages. The Server sections also let YUM know
    the general purpose of the packages. The following list describes each Server
    section option in more detail:


    +   - **serverid:** The server identification (serverid) field tells YUM which
    type of software repository it controls (known as a *channel* by the Red Hat update
    system). Fedora Core is configured to work with the following types: `base`, `updates-released`,
    `updates-testing`, and `development`. The base repository contents are identical
    to what''s on your companion DVD — it includes the "base" Fedora Core 2 distribution.
    The updates-released repository includes all the officially tested and blessed
    upgrades to the base installation; the updates-testing type includes pending updates
    not officially released yet. The development type includes packages intended for
    the next Fedora Core version. It''s essentially the beta version of the next release.

    +     By the time you read this book, the Development repository will include
    the software destined to become Fedora Core 4 (or beyond, depending on when you
    read this book). You can participate in the Fedora Core test cycle by downloading
    and installing the Fedora Core 3 Test distribution. Alternatively, you can use
    YUM to update your computer from the Development repository. That''s what we did
    while writing this book.


    +   - **name:** This option sets a description for the *serverid* that''s displayed
    when you run YUM.

    +   - **baseurl:** This option points to the *serverid* repository URL. You can
    use the base, updates-released, updates-testing, and development repository types.
    The default URL is `fedora.redhat.com`, but you can add one or more mirrors.

    +     For example, you can change the base server ID to

    +     `baseurl` =

    +       `http://fedora.redhat.com/releases/fedora-core-$releasever/`

    +       `http://mirrors.kernel.org/fedora/core/$releasever/1386`

    +     This example provides YUM with two repositories to use (in sequence): if
    one is unavailable, the second is used. Note that each mirror is likely to use
    slightly different directory structures to store its repository. The Fedora Core
    project''s default repository `download.fedora.redhat.com` uses `/fedora/linux/core/3/1386/`
    as its base directory, but'
