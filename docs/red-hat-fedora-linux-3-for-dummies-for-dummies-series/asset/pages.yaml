  md: "+   1. Open the Gedit text editor running the following command:\n+   `gedit\
    \ /usr/local/etc/ices-playlist.xml`\n+   \n+   Ices2 can handle both static and\
    \ live audio streams. The `ices-live.xml` configuration file deals with live streams,\
    \ and the `ices-playlist.xml` configures static streams. However, providing live\
    \ streams is more than we have space to describe in this book, so we leave it\
    \ up to you to investigate that subject.\n\n+   2. Change the <logpath> directive\
    \ to the following:\n+   `<logpath>/var/log/icecast/</logpath>`\n\n+   3. Modify\
    \ Ices2 to work with Ogg audio file, that you just extracted. Find the <input>\
    \ module and modify the file parameter to point to your newly created playlist\
    \ file:\n+   \n+   ```\n+   <module>playlist</module>\n+   <param name=\"type\"\
    >basic</param>\n+   <param name=\"file\">\n+       /usr/local/etc/playlist.txt\n\
    +   </param>\n+   <param name=\"random\">0</param>\n+   <param name=\"restart-after-reread\"\
    >0</param>\n+   <param name=\"once\">0</param>\n+   ```\n+   \n+   The <input>\
    \ and </input> delimiters tell ices2 that these parameters are used to define\
    \ the playlist:\n+   \n+   * *<module>*: These delimiters define the playlist\
    \ boundary.\n+   * *Type*: This parameter defines the type of playlist you’re\
    \ using. In this case, it’s a basic system.\n+   * *File*: The name of the file\
    \ that contains the playlist is defined here.\n+   * *Random*: If this option\
    \ is set to 1, the playlist tracks are played randomly.\n+   * *Once*: If this\
    \ parameter is set to 1, it tells ices2 to play each track only once.\n\n+   4.\
    \ Save your changes by clicking the Save button.\n\n+   5. Choose File:: Quit\
    \ and the Gedit window closes.\n+   \n+   Ices2 uses a configuration file (in\
    \ this case, a *playlist*) to provide static streams to Icecast2. Playlists define\
    \ which audio files ices2 provides to Icecast2.\n\n![](img/41feae212f5c6612ff709354891f7b39_303_0.png)"
