- pgno: 254
  md: "# Chapter 17\n\n# Securing Your Future\n\n+   **In This Chapter**\n+   \n+\
    \   - Thinking security\n+   - Preventing intruders\n+   - Updating Fedora Core\
    \ packages\n+   - Deactivating services\n+   - Using the Secure Shell client\n\
    +   - Configuring a Secure Shell server\n+   - Securing your Web server with SSL\n\
    +   - Reading logs\n+   - Introducing Security-enhanced Linux\n+   - Understanding\
    \ the security process\n\nProtecting your computers and private network is an\
    \ essential task in today's insecure world. Unfortunately, computer and network\
    \ security is a big, complex job. It's still more of an art than a science.\n\n\
    This chapter describes several security methods and utilities that will help make\
    \ the job more manageable. We have chosen the tools and systems that should give\
    \ you the most bang for your buck. This chapter provides a starting point for\
    \ making your computers and network safer. We encourage you to continue learning\
    \ and evolving your security system.\n\n# Thinking Security\n\nComputer security\
    \ is best thought of as an imperfect and ongoing process. No single method, tool,\
    \ or system can magically protect you from the Wild-West Internet. There is no\
    \ silver bullet! Security, like exercise and diet, is just plain hard work."
  merge: -1
  img_proc: true
- pgno: 255
  md: 'Because no silver bullet exists, you have to use the method of *defense in
    depth*, which uses layers of security measures. Each layer helps to protect each
    other. When one layer fails, you fall back on the other. You can also add and
    remove layers as necessary.


    Layered security systems and measures fall into four categories:


    +   ✓ **Prevention:** You can use security-oriented tools, utilities, and methods
    effectively to prevent any attacks from succeeding. Setting up firewalls and updating
    software fall under this heading.


    +   ✓ **Detection:** Not all attacks can be prevented, so detecting them, if possible,
    is essential. However, using an intrusion-detection system (IDS) is still more
    of an art than a science.


    +   ✓ **Eradication:** If you ever get hacked, you must be able to eradicate all
    traces of the compromise. Be ready to reinstall your Fedora Core operating system
    if you cannot identify and remove the software the hacker puts on your computer.


    +   ✓ **Process:** Most computer users would prefer to construct a security system
    and then sit back and forget about it. However, the hacker world changes as fast
    as the rest of the world, and the systems that work now won’t necessarily work
    tomorrow. Therefore you must keep learning and use that knowledge to improve your
    security.


    # # An Ounce of Protection:

    ## Preventing Intruders


    We start by describing how to minimize your chances of being hacked. The following
    sections describe systems that increase your security:


    +   ✓ **Updating software:** The Fedora Core update and YUM utilities help keep
    your computer’s software up-to-date, which eliminates vulnerabilities as they
    are discovered.


    +   ✓ **Removing services:** Hackers cannot take advantage of vulnerable software
    if you don’t use it. Turning off unnecessary services reduces your exposure. You
    may also want to remove software, such as compilers, on your servers. Removing
    the software prevents a hacker from using it.


    +   ✓ **OpenSSH and SSL:** Except when you are viewing garden-variety, nonsecure
    Web pages, you should never communicate over the Internet (or wireless LANs) without
    using encryption. The open-source SecureShell (SSH) and Secure Sockets Layer (SSL)
    provide effective encryption for your communications.


    We describe each system in this section.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# Updating software to remove vulnerabilities


    Standard hacker operating procedure is simple: Find and then exploit vulnerabilities.
    The method, simple but effective, works like this: Joe Hacker walks around the
    Internet, rattling doorknobs and occasionally finding one that''s open. When no
    door is unlocked, the hacker looks for easier locks to pick. Your job is to make
    sure that your doors and windows are locked and reasonably safe.


    Running firewalls, shutting down unnecessary services, and using good passwords
    ensures that you don''t leave anything unlocked. Making sure that your locks aren''t
    easily defeated requires constant supervision and maintenance. Software is getting
    ever more powerful, but also complex. Complexity breeds bugs, and with bugs come
    vulnerabilities. Because the only certainties in life are death, taxes, and buggy
    software, the bugs have to be fixed whenever possible. Everyone needs to continually
    update software whenever errors are found and corrected.


    The new Linux 2.6 kernel (used by Fedora Core 3) uses the Exec-shield system to
    minimize the danger from buffer overflows. Hackers have long used vulnerabilities
    found in stack queues (buffers) to execute their own malicious programs; operating
    systems such as Linux use queues for their internal bookkeeping. ExecShield removes
    many, if not most, of those vulnerabilities.


    Fedora Core uses an excellent method for updating its software: The Yellowdog
    Updater Modified (YUM) can be configured to automatically detect new software
    and install it for you. Fedora Core installs YUM by default. Next to using good
    passwords and firewalls, it''s probably the most effective security system you
    can run. Fedora Core uses the YUM system too.


    Follow these steps to run YUM:


    +   1. Log in as root and connect your Fedora Core computer to the Internet.

    +      See Chapters 5, 6, and 7 for information about connecting to the Internet.

    +   2. Configure YUM to run automatically at boot time.

    +      chkconfig --level 35 yum on

    +   3. If your computer is connected to the Internet through a proxy firewall,
    add the following line to /etc/cron.daily/yum.cron:

    +      export http_proxy=http://abc.xyz:port


    ![](img/41feae212f5c6612ff709354891f7b39_256_0.png)'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'You''ll have to change the fictitious proxy address and port `abc.xyz:port`
    to match your network’s proxy.


    4. Start YUM update service via cron, using this command:

    `service yum start`


    You can manually update your computer, by logging in as root and running the command:
    `yum -y update`. Removing the `-y` option forces you to verify that you want to
    run the updates once they’ve been detected.


    Regularly updating your computer is an essential security measure that''s easy
    to do. Many break-ins occur because of out-of-date software. With the help of
    up2date, you eliminate most vulnerabilities as they occur.


    # Reducing your exposure: Removing and reducing services


    Hackers look for computer vulnerabilities by probing for vulnerable network services.
    Network services — such as Apache, Samba, and DHCP — are, of course, designed
    to respond to network queries. Therefore hackers can readily find out which services
    you run — and then figure out which, if any, attacks to use.


    We describe elsewhere how keeping software updated minimizes your vulnerability.
    However, you can go one step further and make a service invulnerable by turning
    it off. One simple security rule is “Keep it simple.” The simple fact is that
    if you don’t need to run a service, you shouldn’t.


    We describe in this section how to eliminate or reduce both network and non-network
    services. These steps describe how to use the chkconfig utility to change the
    startup scripts that control when, how, and whether a network services starts
    at boot time:


    +   1. Click the GNOME Menu and choose System Settings: Server Settings: Services.
    Enter the root password if you’re prompted. The Service Configuration dialog box
    opens.


    +   2. Select an unnecessary service and shut it off by clicking the Stop button.


    +   3. Click the OK button when the confirmation dialog box appears.


    +   4. Click the check mark to the left of the service to remove the check mark.


    Removing the check mark prevents the service from starting automatically at boot
    time.'
  merge: -1
  img_proc: true
- pgno: 258
  md: "+   5. Repeat Steps 2 through 4 for each unnecessary service.  \n+   6. When\
    \ you have turned off each unnecessary service, click the Save button.  \n+  \
    \ 7. Choose Quit from the File menu.\n\nWhich services you turn off depends on\
    \ your needs, of course. For example, if you're unintentionally running a Web\
    \ server, turn off the **httpd** service. You generally should be able to turn\
    \ off these services:\n\n+   - **The Advanced Power Management Daemon (APMD):**\
    \ APMD is useful if you, like most people, regularly power-off your personal workstation\
    \ or laptop. However, APMD is generally unnecessary on servers that run continuously.\
    \ You want to keep APMD in the former case (workstation or laptop) and remove\
    \ it in the latter (server).  \n+   - **GPM:** This service allows you to use\
    \ a mouse when you're running in nongraphical mode. You're running in graphical\
    \ mode, so turn it off.  \n+   - **The job-queue daemon:** The **atd** daemon\
    \ is used to schedule one-time cron-like jobs. If you need **atd**, you know it.\
    \ Otherwise, turn it off.  \n+   - **Network File Sharing (NFS):** You need only\
    \ services such as **nfs**, **nfslock**, **portmap**, and **autofs** when you're\
    \ running an NFS server or client. The last thing you want to do is share files\
    \ to the Internet, for example.  \n+   - **Print services:** Many people don't\
    \ run the printer daemon on servers. Turn off **CUPS** (Common UNIX Printing System)\
    \ or **lpr** whenever you don't need to print.  \n+   - **Samba:** As with NFS,\
    \ you should turn off Samba if you don't need it.\n\nThe rest is up to you. Terminate\
    \ hackers with a vengeance.\n\n# ## Using chkconfig\n\nYou can use the CLI-based\
    \ **chkconfig** utility to set services to start automatically or not. Open a\
    \ GNOME Terminal session and log in as root (type **su -).** This list shows your\
    \ options:\n\n+   - List the services by running the **chkconfig - --list** command.\
    \  \n+   - List an individual service by specifying the service after the **-\
    \ --list** option: **chkconfig -- list apmd**.\n\n+   - Stop a service with the\
    \ **- -- add** option: **chkconfig - -- add apmd**.  \n+   - Delete a service\
    \ with the **- -- del** option: **chkconfig - -- del apmd**."
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Using a Secure Shell client


    You may be most familiar with graphical network communication applications, such
    as the Mozilla Web browser and Evolution e-mail clients. However, a world of text-based
    tools is available, such as Secure Shell, Telnet, and FTP. Those applications
    provide an interactive method for connecting to other computers across networks
    and the Internet by using a command-line interface (CLI); refer to Chapter 4 for
    more information about CLIs.


    Interactive communication is effective for performing tasks on remote machines.
    For example, the primary way to work on Linux machines originally was via the
    CLI. The CLI is often the best way to perform remote tasks.


    CLI-based communication used to be carried out primarily over the insecure Telnet,
    FTP, and rsh connections. All services used unencrypted connections, and passwords
    were readily detected. The rsh service also used a system of intermachine trust.
    That trust allowed hackers (such as the infamous Kevin Mitnick) to “own” a network
    by breaking into one machine and then logging in to additional ones without authentication.


    Open Secure Shell (OpenSSH) provides an encrypted channel to perform all those
    tasks: Fedora Core bundles OpenSSH by default. We describe (first) how to use
    the OpenSSH client to communicate with other machines and (second) create an OpenSSH
    server.


    > You should (dare we say must?) use encrypted channels when you’re communicating
    over the Internet and wireless networks. Both the Internet and Wi-Fi connections
    are inherently insecure, and you have to protect your communications.


    # Connecting to a Secure Shell server


    Start by using OpenSSH as a client. Suppose you want to log in to your ISP server,
    ssh.myisp.com, with OpenSSH. Here’s the drill:


    +   1. Open a GNOME Terminal session.


    +   2. Enter this command: `ssh ssh.myisp.com`


    Your mileage may vary, of course. You may have to use the -1 option if, for example,
    your ISP user account name is different from your local computer. If your user
    name on your local machine is rod, but it’s wayofthewheel at your ISP, enter this
    line: `ssh -1 wayofthewheel ssh.myisp.com`


    The first time you connect to a remote server, you’re prompted to accept the remote
    server’s fingerprint.'
  merge: -1
  img_proc: true
- pgno: 260
  md: "+   3. Enter yes when you're prompted.\n+   4. Enter your password when you're\
    \ prompted, and you're logged in.\n+   \n+   For example, you can now use a text-based\
    \ e-mail client, such as *pine*, to read your messages. This program is useful\
    \ if you want to read your e-mail securely but cannot connect to your ISP with\
    \ an SSL-enabled Mozilla or Eviolution e-mail client.\n\n# Tunneling X across\
    \ a network\n\nThat was a simple and useful way to use OpenSSH, but you can do\
    \ more. The Red Hat OpenSSH client is automatically configured to forward X-based\
    \ graphics across its secure connection. While logged on to your ISP, you can\
    \ run X Window client software and view it on your local machine:\n\n+   1. Log\
    \ in to your ISP (or any machine running a Secure Shell server), as just described.\n\
    +   2. Run an X Window application, such as *xclock*.\n\nThe simple xclock window\
    \ is displayed on your desktop.\n\nOpenSSH also bundles the file-transfer applications\
    \ Secure Copy (*scp*) and Secure FTP (*sftp*). Secure Copy is non-interactive\
    \ and copies files to and from a remote machine. Secure FTP is a secure version\
    \ of FTP and is also interactive. This list describes how to copy files between\
    \ two machines:\n\n+   *   Copy from a local machine to a remote one: To transfer\
    \ files from your local computer to a remote one, use Secure Copy (*scp*):\n+\
    \       `scp abc myacct@remote.mysp.com`\n+       This command copies the filename\
    \ *abc* from the directory you're working to the myacct.mysp.com home directory\
    \ on the remote machine. You can specify either or both of the local and remote\
    \ directories. For example, the following command copies the file *abc* from the\
    \ /tmp directory on the local machine to the /var/tmp directory on the remote\
    \ machine and renames it to *xyz*:\n+       `scp myaccount@remote.mysp.com:/tmp/abc\
    \ /var/tmp/xyz`\n+       The *scp* syntax is important. If you leave out the colon\
    \ (:), your file isn't copied to the remote machine but rather is simply copied\
    \ to a file named *myacct@remote.mysp.com* in your local directory.\n+   *   Copy\
    \ from a remote to local machine: Reverse the order of the parameters to copy\
    \ from a remote machine. The following example copies the file *abc* from your\
    \ home directory on the remote machine to your current working directory on the\
    \ local machine:\n+       `scp myacct@remote:abc`"
  merge: -1
  img_proc: true
- pgno: 261
  md: 'The **sftp** program works like the old standby FTP, but uses encryption, of
    course. Follow these steps to perform simple file transfers with **sftp**:


    +   1. Open a GNOME Terminal session.

    +   2. Enter this command:

    +   ```text

    +   sftp ssh.myisp.com

    +   ```

    +   3. Enter your user name and password.

    +   4. Enter the help command at the **sftp** prompt.


    You see a list of **sftp** commands. The ones you use most are **cd**, **lcd**,
    **dir**, **ls**, **get**, and **put**. These commands work in a similar fashion
    to their Linux equivalents.


    Using **sftp** is self-explanatory. Use **get** to transfer a file, files, or
    a directory from the remote machine to a local machine; **put** transfers stuff
    from local to remote.


    ![](img/41feae212f5c6612ff709354891f7b39_261_0.png)


    Another cool feature of OpenSSH is its ability to tunnel any protocol. You can
    potentially display an entire X Window from a remote machine via X, for example.
    Consult the OpenSSH documentation for more information.


    # ### Configuring an OpenSSH server


    Configuring an OpenSSH server is straightforward. You only have to modify the
    /etc/ssh/sshd_config file and run the command **service sshd restart** to restart
    the OpenSSH server daemon. Take a look at the configuration file; the important
    parts of which are listed here:


    ✔ **Remove the older and faulty protocol version 1**: Version 1 is broken and
    should not be used (change the parameter Protocol 2,1 to Protocol 2, as shown
    in this example):


    ```

    ```text

    Port 22

    Protocol 2

    # Hostkeys for protocol version 2

    HostKey /etc/ssh/ssh_host_rsa_key

    HostKey /etc/ssh/ssh_host_dsa_key

    ```

    ```


    ✔ **Remove the comment from in front of the login grace-time parameter**: This
    action sets a limit on the length of time from when you start a login and the
    time you complete it:


    ```

    ```text

    LoginGraceTime 600

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 262
  md: "Disallow root logins: You should prevent users, including yourself, from logging\
    \ in directly as root. Forcing users to first log in as a regular user and then\
    \ “su-ing” to root provides an audit trail that can be used to see who did what\
    \ as the root user; it also forces everyone to jump through two hoops before anyone\
    \ can become the all-powerful root user:\n\n\n\n\n\n```\nPermitRootLogin yes\n\
    StrictModes yes\n```\n\nUncomment the following parameters to allow the various\
    \ authentication modes:\n\n\n\n\n```\n# rhosts authentication should not be used\n\
    RhostsAuthentication no\n# Don't read the user's ~/.rhosts and ~/.shosts files\n\
    IgnoreRhosts yes\n# For this to work you will also need host keys in /etc/ssh/ssh_known_hosts\n\
    RhostsRSAAuthentication no\n# similar for protocol version 2\nHostbasedAuthentication\
    \ no\n# Change to yes if you don't trust ~/.ssh/known_hosts for RhostsRSAAuthentication\
    \ and HostbasedAuthentication\nIgnoreUserKnownHosts no\n```\n\nAllow people to\
    \ use password authentication, but don’t allow unauthenticated access:\n\n\n\n\
    \n```\n# To disable tunneled clear text passwords,\n# change to no here!\nPasswordAuthentication\
    \ yes\nPermitEmptyPasswords no\n```\n\nTo start the OpenSSH daemon, follow these\
    \ steps:\n\n+   1. Make the changes and restart the Secure Shell daemon:\n+  \
    \ \n+   service sshd restart\n\n+   2. If you’re running a firewall, add this\
    \ rule to your iptables-based firewall:\n+   \n+   iptables -A INPUT -p tcp -dport\
    \ 22\n+   -m state --state NEW,ESTABLISHED -j ACCEPT\n\n+   3. Save your new firewall:\n\
