- pgno: 112
  md: '# Chapter 7: Connect Locally, Communicate Globally: Connecting to a LAN


    ![](img/41feae212f5c6612ff709354891f7b39_112_0.png)


    Encryption keys are 40- or 128-bit binary numbers. They can be represented as
    text strings (as described in Step 6) or as a string of hexadecimal (hex) numbers.
    Hex numbers are commonly used in computer science to represent the longer, more
    ungainly binary numbers. For your purposes, it’s sufficient to know that a hex
    number is represented by 16 characters: 0 through 9 and A through F. For example,
    hex 0 is represented as decimal 0; hex 3, as decimal 3; and hex 9, as decimal
    9. But decimal 10 is hex A, and the decimal 16 hexadecimal value is F. The hexadecimal
    value of this sample key


    ```

    this-is-a-password


    is


    74686973 6973 6973 615F 686579

    ```


    You can enter the hex value in the Key field by prepending the string 0x to the
    key. In the example, you enter this line:


    ```

    0x74686973 6973 6973 615F 686579

    ```


    After you enter your encryption key and click the Forward button, the Configure
    Network Settings window opens. The processes of assigning a host name, IP address,
    netmask, and gateway to your computer are the same as for an Ethernet interface.
    Consult Steps 3 through 9 in the preceding section, “Configuring an Ethernet NIC,”
    for instructions on how to configure your wireless NIC TCP/IP parameters.


    Your wireless NIC configuration is complete. You still need to configure your
    domain name service (DNS) if you aren’t using DHCP. Proceed to the following section
    if that’s the case.


    # Configuring DNS


    If you’re using domain-name service, you have to configure your computer to use
    from one to three DNS servers. You can use your LAN’s DNS servers, if they’re
    available. You can also use external DNS servers—regardless of whether any exist
    on your LAN. To configure your Fedora Core computer to use DNS, follow these steps:


    +   1. Click the DNS tab in the Network Configuration dialog box, which is where
    you leave off in the preceding list of steps.

    +   2. Type the host name of your computer in the Hostname text box.


    The host name is any name (for example, Cancun) that you want to use.

    If you’re connecting to a network controlled by someone else (for example, at
    work), check with the system administrator before selecting a host name.


    +   3. Type the IP address of your DNS server in the Primary DNS text box.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'If your LAN provides a DNS server, you can use it as your primary name server
    (DNS).


    **4. If you have one, type the IP address of your secondary name server in the
    Secondary DNS text box.**


    Most ISPs provide a backup DNS server address. If your LAN has its own DNS server,
    you can specify your ISP server as your secondary DNS server if you want.


    **5. Type the domain name of your network in the DNS Search Path text box.**


    Figure 7-4 shows a sample DNS configuration screen.


    A domain name is a two-part name separated by a period. For example, *paunchy.net*
    is a domain name, which is the domain name of the sample LAN used in this book.
    You should replace the *paunchy.net* domain name, of course, with the name of
    your LAN.


    **6. Choose File » Quit.**


    The Network Configuration Utility closes. Your settings are saved and are activated
    the next time you reboot your computer. Proceed to the following section to activate
    your settings immediately.


    ![](img/41feae212f5c6612ff709354891f7b39_113_0.png)


    # ## Manually Starting and Stopping Your Network


    Sometimes the Network Configuration utility configures your network stuff, but
    cannot activate it. Why does that happen? Who knows? It may be'
  merge: -1
