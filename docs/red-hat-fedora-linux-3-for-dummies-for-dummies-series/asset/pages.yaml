    \ these instructions to install and upgrade packages:\n\n+   1. Log in as root.\n\
    +   \n+   2. Open a terminal emulator window by clicking the terminal icon in\
    \ the *GNOME Panel* (refer to Chapter 4 for instructions).\n+   \n+       The\
