    \  > Finishing the installation and rebooting  \n+   > Configuring your display\
    \  \n+   > Using the Setup Agent to complete post installation\n\nInstalling Linux\
    \ isn't rocket science --- it's more like astrophysics. (Well, maybe it's not\
    \ quite that complicated.) Although installing Fedora Core may seem at first like\
    \ a difficult job, it's actually pretty simple. The installation process requires\
    \ that you answer a few questions, and then the process takes care of itself.\n\
    \nWhen you're done, you have a powerful computer that's capable of performing\
    \ tasks. It not all, of your daily computing chores --- all for the cost of this\
    \ book! That's pretty amazing when you think about it. For a few bucks, you get\
    \ the same amount of operating power that would have cost a ton just a few years\
    \ ago.\n\nThis chapter walks you through the process of installing Fedora Core\
    \ 3. The process involves inserting the companion Fedora Core 3 DVD disc, powering\
    \ up your computer, and answering some questions.\n\nThis book comes with a companion\
    \ DVD disc that contains the entire Fedora Core 3 distribution. The single DVD\
    \ replaces several CD-ROMs so you don't have to continually swap CD-ROMS during\
    \ the installation process. It also makes installing the software easier, you\
