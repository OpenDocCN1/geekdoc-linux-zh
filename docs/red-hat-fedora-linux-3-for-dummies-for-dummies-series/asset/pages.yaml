- pgno: 234
  md: 'carbon-based humans to remember and use. The **Domain Name System (DNS)** solves
    that problem by converting numbers to names, making it possible to use names like
    `fedora.redhat.com` rather than `209.132.177.50`. In many ways, DNS makes the
    Internet usable and therefore popular.


    *DNS is an interdependent information-sharing system* — a distributed database.
    No centralized servers contain actual addresses, such as `fedora.redhat.com`.
    Instead, DNS is structured so local servers store local addresses, and a few centralized
    servers store information about where to go to find local addresses.


    DNS makes the Internet possible. The Internet just wouldn’t be practical if we
    had to look up numeric IP addresses from some gigantic phone book. DNS also makes
    working on smaller private networks more convenient. By building your own DNS
    server, you avoid having to remember all the addresses of all your machines. This
    section describes how to build a simple DNS system to server your network.


    ![](img/41feae212f5c6612ff709354891f7b39_234_0.png)


    Add the name/address pairs to each computer’s `/etc/hosts` file if you don’t construct
    a DNS server. Edit `/etc/hosts` and add the IP address, full host name, and, optionally,
    an alias for every computer on your private network. For example, add `192.168.1.254
    varacruz.paunchy.net varacruz` to Cancun’s `/etc/hosts` file. Then add `192.168.1.1
    cancun.paunchy.net cancun` to Veracruz’s `/etc/hosts` file. These entries allow
    each of the two machines in the example to address each other by name.


    Introducing DNS components Overall, the Domain Name System is complex; it contains
    many components. But because we show you how to build a DNS server for your private
    network, you can use a simpler system using only a relative handful of DNS components.
    Building your DNS server requires a good working understanding of the basic DNS
    components, so here goes:


    +   ✓ **Domains:** You’re probably familiar with network domains, whether you
    realize it or not. *Domains* are the networks you access all the time on the Internet.
    For example, `redhat.com` is a domain (and `www.redhat.com` is the name of a server
    within the `redhat.com` domain).


    +   *   Domains can optionally be divided into subdomains. For example, Red Hat
    has a subdomain, `fedora.redhat.com`, used for the Fedora Core project.

    +   *   Domains themselves are divided into domains. The ubiquitous `.com`, `.edu`,
    and `.org` are all top-level domains. They organize the Internet into business,
    educational, and not-for-profit arenas, respectively.


    +   ✓ **Zones:** Domains are divided into zones. DNS servers service zones. A
    zone can map directly to a domain; multiple zones can service a domain. The DNS
    server you’re building in this section consists of a single domain that services
    the fictitious `paunchy.net` domain.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '+   Authoritative name servers: Every zone must have an authoritative name
    server. It holds the information for every host within the zone. You can create
    primary and secondary authoritative name servers. The secondary name servers back
    up the primary name servers.


    +   Non-authoritative name servers: To present data that doesn''t change much
    over time, you can create name servers that can load fast but don''t have to provide
    the most up-to-date information.


    +   Caching name server: Name servers can be configured to look up addresses from
    other name servers and temporarily save, or cache, the information. Caching name
    servers helps spread out the load of servicing large domains.


    +   Root name servers: The authorities that control domain-name registrations
    provide root name servers that hold the addresses of name servers for each domain.
    DNS queries go to root name servers to find out where to find authoritative name
    servers.


    The parameters found in DNS configuration and zone files are called resource records
    (RR). This list describes them:


    +   A records: Address (A) records map IP names to numeric addresses.


    +   C records: Canonical (C) records define aliases for A records.


    +   MX records: Mail-exchange (MX) records specify the mail servers that service
    a domain.


    +   NS records: Name-server (NS) records specify the name server for a zone.


    +   SOA: The start-of-authority (SOA) parameter creates a section that describes
    the generic properties of a zone file. The SOA configures parameters that set
    the serial number and various timeouts, plus the domain name of a zone.


    # # Getting a look at a DNS address request


    This section gives you a quick look at the steps your browser takes to find the
    Fedora Core Web page:


    +   1. You open your browser and enter any URL, such as `fedora.redhat.com`.


    +   2. The browser asks Linux for the Web page''s numeric IP address.


    +   3. Linux looks in its `/etc/resolv.conf` configuration file and finds the
    address of a name server.'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'You can use any available DNS server on the Internet. For example, you can
    use Albuquerque''s finest ISP Southwest Cyberport DNS server, 198.59.115.2, from
    anywhere on the Internet. You should use your own ISP''s servers because it has
    fewer router-to-router jumps, or hops, to go through, which results in better
    reliability and higher speed.


    +   4. **Linux requests the IP address for fedora.redhat.com from the name server.**

    +   5. **If the name server doesn''t know the IP address of fedora.redhat.com,
    it asks a root server for the address of an authoritative name server for the
    redhat.com domain.**

    +   6. **The root server returns the address of the Red Hat authoritative name
    server, the first of which is ns1.redhat.com (209.132.177.50).**

    +   7. **The name server asks ns1.redhat.com for the address of fedora.redhat.com.**

    +   8. **The name server ns1.redhat.com returns the fedora.redhat.com address.**

    +   9. **Using the numeric fedora.redhat.com IP address, your browser starts communicating
    with the Web server.**


    # ## Constructing a DNS server


    When you know what you want your DNS server to do, it''s time to build one. The
    steps in this section describe how to build an authoritative name server for your
    private network. The server provides the addresses for the private, nonroutable
    network we describe in Chapter 15; you don''t have to register the addresses with
    any authority. The DNS server is authoritative for your private domain, but that
    information isn''t available outside your network.


    The steps in this section show you how to install the DNS server software. You
    use the Fedora Core configuration utility to create the various configuration
    files. (In the following example, the files are /etc/named.conf, /var/named/local.zone,
    /var/named/pancho.zone, and /var/named/1.168.192.zone files.)


    # ### Installing the DNS software


    Start by installing the bind RPM that contains the named server software:


    +   1. Insert the Fedora Core companion DVD.

    +   2. Click the GNOME Menu and choose System Settings>Add/Remove Applications.'
