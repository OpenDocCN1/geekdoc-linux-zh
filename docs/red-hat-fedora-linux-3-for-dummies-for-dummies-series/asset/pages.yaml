- pgno: 18
  md: '# Introduction


    **R**ed Hat Fedora Linux 3 for Dummies describes how to install and use this popular
    and powerful Linux distribution for fun and profit. Fedora Core is the successor
    to Red Hat Linux. Fedora Core 1 was essentially Red Hat Linux 10; if you *really*
    like numbers, think of Fedora Core 3 as Red Hat Linux 12.


    Let''s back up a little and mention that a Linux distribution is the combination
    of the *Linux kernel* (the core software, also known as an *operating system*,
    that controls your computer) and all its supporting applications, utilities, and
    installation-and-configuration software that helps you get work done and have
    fun with your computer. The word *Linux* has traditionally been used, depending
    on the context, as shorthand to mean a specific Linux distribution.


    So why is *this* Linux distribution named Fedora Core?! What do a fedora and a
    core have to do with *Linux*? Well, the company Red Hat, Inc., recently decided
    it was time to concentrate on its core business, which is centered on its commercial
    product Red Hat Enterprise Linux. Red Hat merged its “free” Red Hat Linux distribution
    with the Fedora Linux Project to create the Fedora Core Project. (The Fedora Linux
    Project previously concentrated on developing third-party Linux-based applications
    and utilities.)


    The Fedora Core Project is an open-source project. *Open source* describes all
    software published under the GNU Public License (GPL) and other similar licenses.
    Open-source software gives you (and *everyone*) access to the underlying source
    code and permits you to use, modify, and *redistribute* (for free or a fee) the
    code. The only restriction is that you cannot prevent *other* people from doing
    the same. Under the new arrangement, therefore, Red Hat maintains editorial control
    over — and provides resources for — the Fedora Core Project; the community of
    Fedora Core users and developers gets a larger role in technical development.


    Less talk, more rock! *Red Hat Fedora Linux 3 for Dummies* will help you install
    and use the immensely popular Fedora Core 3 on your personal computer. We show
    you how to get work done and also do fun stuff. This book is also designed to
    be an effective doostop or coffee-cup coaster. Whatever you use it for, we hope
    you have fun.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# # 2 Red Hat Fedora Linux 3 For Dummies


    # ## About This Book


    Red Hat Fedora Linux 3 For Dummies is designed to be a helping-hands resource.
    It provides a place to turn for help and solace in those moments when, after two
    hours of trying to get your network connection to work, your dog bumps into your
    desk and knocks the book onto your computer, jiggleing the network cable — and
    it magically starts working.


    We tried our hardest to fill up this book with the things you need to know, such
    as how to do the following:


    +   - Install Fedora Core 3.

    +   - Get connected to the Internet, whether using broadband DSL, cable modems,
    or old-fashioned dial-up modems.

    +   - Get connected to your local-area network (LAN).

    +   - Build a simple-but-effective firewall.

    +   - Build Internet and LAN services, such as Web pages and print servers.

    +   - Use Red Hat Linux to play CDs and listen to Internet radio stations.

    +   - Use the GNOME desktop environment. GNOME is the graphical system that makes
    your computer easier and fun to use. GNOME provides the look ''n feel of your
    computer plus many applications.

    +   - Take advantage of useful and usable applications, such as the Open Office
    desktop productivity suite, Evolution desktop organizer and e-mail client, and
    streaming multimedia MPlayer.

    +   - Work with the OpenOffice desktop productivity suite to satisfy your word-processing,
    spreadsheet, and presentation needs — or, install Wine (and possibly the commercial
    Wine enhancer CrossOver Office) so you can use Microsoft Office directly from
    your Fedora Core computer!

    +   - Upgrade your computer and network security.

    +   - Know where to go for help.

    +   - Manage your Fedora Core workstation.


    You also encounter troubleshooting tips throughout this book. Chapter 18 is, in
    fact, devoted to the subject. It''s not that Fedora Core is all that much trouble,
    but we want you to be prepared in case you run into bad luck or unusual situations.


    ![](img/41feae212f5c6612ff709354891f7b39_19_0.png)


    The instructions in *Red Hat Fedora Linux 3 For Dummies* are designed to work
    with the version of Fedora Core you find on this book''s companion DVD; we also
    describe how to download several software packages not found on the DVD. Feel
    free to use other versions of Fedora Core, or even other Linux distributions,
    but be aware that our instructions may not work exactly as given, or (sometimes)
    even at all. O brave new world. Good luck!'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # Foolish Assumptions


    You probably know what they say about people who make assumptions, but **Red Hat
    Fedora Linux 3 For Dummies** *never* would have been written if we didn''t make
    a few. This book is for you if you:


    +   - **Want to build a Fedora Core workstation:** You want to use the Linux operating
    system to build your personal workstation. Surprise! The DVD in the back of this
    book contains the Fedora Core 3 distribution.

    +   - **Have a computer:** It''s just a technologicality, but you need a computer
    because we describe how to install Fedora Core 3 on a computer.

    +   - **Have no duct tape:** You want to put the Fedora Core operating system
    and the computer together, and using duct tape hasn''t worked.

    +   - **Don''t want to be a guru:** You already have hobbies, and don''t want
    to become a Fedora Core guru — at least not yet.


    However, **Red Hat Fedora Linux 3 For Dummies** *is not* for you if you''re looking
    for


    +   - **An all-encompassing reference-style book:** We simply don''t have enough
    space, or permission from the publisher, to provide a comprehensive range of topics.
    We concentrate on providing help with getting popular and useful programs up and
    running. We devote more space, for example, to getting your DSL or cable modem
    working than to describing the theory that makes them work.

    +   - **A system-administration book:** Again, we don''t have enough space to
    do the subject justice. We provide instructions on how to perform certain essential
    administrative tasks, like adding users, packages, and network connections. We
    select certain topics to focus on and leave the rest for other books.


    # # Conventions Used in This Book


    At computer conventions, thousands of computer people get together and talk about
    deep technical issues, such as the following:


    +   - Could Superman beat Batman?

    +   - Could The Punisher beat Superman?

    +   - Could The Punisher, Superman, Batman, and Spiderman together beat Linux?
    *(No way!)*


    But these late-night, coffee-induced conventions aren''t what we mean. Our conventions
    are shorthand ways of designating specific information or tasks.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# # 4 Typing code


    Fedora Core provides various graphical user interfaces (GUIs) to help you do most
    of the tasks you want to do. However, many people still find that performing many
    tasks “manually,” by typing a command, is easier; in some circumstances, it’s
    the only way to get a job done.


    Therefore, we show you in Chapter 4 how to use a text-based terminal-emulator
    window to run a command. In anticipation of manually running commands, we describe
    several conventions in this section.


    When you see URLs (Uniform Resource Locators), filenames, directories, commands,
    and parameters in a paragraph, they’re reformatted in *monospace type*. That helps
    differentiate those items from the general text.


    When you see words in **boldface**, they indicate something you should type; for
    example:


    Type `man chown` at the command prompt and press **Enter**.


    That line tells you to enter the command `man chown` and press the **Enter** (or
    **Return**) key. The command is then executed. (Throughout this book, we say “press
    the **Enter** key” or “press **Enter**” whenever we want you to execute a command;
    the **Enter** key is synonymous with the **Return** key.)


    Commands set off by themselves, rather than shown in the text, look like this:


    `pwd`


    Here’s a rundown of the command *syntax* (how you string ‘em together) in Linux:


    +   - Text **not surrounded by [ ] or ( )** brackets must be typed exactly as
    shown.


    +   - Text inside brackets [ ] is optional.


    +   - Text in *italics* indicates the part of a command that must be replaced
    with appropriate text. You should not type verbatim the italicized part of a command.
    If we say “Enter the command `more somefile`,” we mean for you to replace *somefile*
    with the name of the file you’re interested in. For example, you may end up entering
    the command `more /etc/passwd`, where you substitute */etc/passwd* for *somefile*.


    +   - Text inside braces { } indicates that you must choose one of the values
    inside the braces and separated by the | sign. For example, you should'
  merge: -1
