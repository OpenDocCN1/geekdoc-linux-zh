    \nIf you don’t give your computer a name and domain name during the network configuration\
    \ process, it’s referred to as *localhost.localhost*. Otherwise, the Welcome screen\
    \ refers to whatever name you give it. For example, in the preceding example,\
    \ you would see *Welcome to cancun.pianchy.net*.\n\n7. Enter your **gateway and\
    \ primary DNS** (and, optionally, the **secondary and tertiary DNS**) IP addresses\
    \ in the appropriate text boxes in the **Miscellaneous** section, at the bottom\
    \ of the screen.\n\nThese parameters have distinct functions:\n\n+   - **Gateway**:\
    \ The *Gateway* is the numeric IP address of the computer that connects your private\
    \ network to the Internet (or to another private network). Fedora Core uses the\
    \ address 192.168.1.254 by default. You can accept this address, but leaving it\
    \ blank is a better"
  merge: -1
