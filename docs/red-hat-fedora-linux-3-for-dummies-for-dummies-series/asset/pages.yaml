    10. Click the OK button to return to the Add and Remove Software window.


    Until the advent of the RPM (and the Debian Package Manager on Debian Linux systems),
    Linux software was distributed only by tar archives, which are sometimes referred
    to as tarballs (or more descriptively, hairballs). The tar file storage mechanism
    stores one or more files in a single file in a tar format. A tar file has the
    .tar file suffix; if the tar file is compressed, it has a suffix like .tqz or
    .tar.gz. Using the tar-based distribution system is sufficient if your software
    doesn''t change often and you''re young. But when you need to upgrade or change
    software or work with complex software systems, tar becomes quite difficult to
    work with. Rather than spend your life spitting up hairballs, use systems such
    as RPM to greatly simplify your life.


