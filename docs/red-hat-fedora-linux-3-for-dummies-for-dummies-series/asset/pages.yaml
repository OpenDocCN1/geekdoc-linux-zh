- pgno: 283
  md: '![](img/41feae212f5c6612ff709354891f7b39_283_0.png)


    # ## Ticking Through Your Linux Networking Checklist


    We describe in this section some common network problems and symptoms. We start
    with simpler network problems and move on to more complex ones. After cataloging
    the problems, we look at one of the branches of the fault tree to solve a problem.


    # ### Is the power turned on?


    First, verify that you turned on the power. It sounds simple, but, hey, sometimes
    the simplest things go wrong.


    # ### Is your network cable loose or broken?


    Make sure that your network cables aren''t broken or cut. Check the connectors
    to make sure that they''re okay. You should also make sure that you''re using
    the correct network cable, which should be Category 5 (8-wire) straight-through
    cable.


    # ### Is your Ethernet hub or switch working?


    Your Ethernet hub or switch should also be turned on. Ensure that the network
    cables are also connected securely.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'An experienced electrical engineer and Linux author once got really angry with
    a cable TV company. His cable service went dead in the middle of a Philadelphia
    Eagles game. It didn''t matter that the Eagles were losing — he wanted to see
    the game because the Eagles don''t appear on TV often in Albuquerque. The engineer
    called the cable company immedi-ately. "Bleh! Bleh! My connection — Bleh! Bleh!"
    The nice support person guided the poor engineer step-by-step through his own
    fault tree. Step 1: Is your VCR or TV turned on? "Yes, of course." Step 2: Is
    the VCR button on your VCR toggled on? "Of course — ah, whoops, no, it isn''t.
    Ah, yes, it works now, thank you very much. Goodbye." D''oh! What was five years
    of electrical engineering school good for? (Well, okay, maybe they didn''t cover
    On switches.)


    The *link status* lights should be lit for every cable that''s connected to the
    hub or switch. You should also see lights for active connections flash on and
    off as network communication occurs. If you don''t see any lights, ensure that
    the cable is plugged in snugly.


    # Is your Ethernet adapter inserted correctly?


    You have to have an Ethernet adapter to be connected to an Ethernet network. Make
    sure that your Ethernet adapter is plugged in to your computer''s motherboard
    — snugly. Sometimes you have to pull out the adapter and then reinsert it (carefully,
    of course); this process is called *reseating*.


    # Is your network adapter configured correctly?


    Sometimes a startup script is misconfigured, which causes the startup screen to
    go by without you seeing an error message. If that happens, log in as *root* and
    from the shell prompt and type this command:


    ```

    ifconfig

    ```


    You see a listing of two different interfaces, as shown in the following code,
    or three interfaces if you have PPP configured. The `ifconfig` command tells the'
