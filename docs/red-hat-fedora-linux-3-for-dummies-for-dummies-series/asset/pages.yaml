- pgno: 312
  md: 'You can find lots of information about Linux from the Linux Documentation Project
    (LDP). LDP documents are published under a *copyleft*, which is essentially the
    same as a copyright and simply means that you can print and use them. You can
    find LDP documents at www.tldp.org. You can also find the Fedora Core release
    notes locally, at


    ```

    file:///usr/share/doc/HTML/index.html

    ```


    Red Hat provides online versions of the manuals you get when you purchase its
    full distribution. Look at www.redhat.com/docs/manuals/linux/RHL-9-Manual for
    information about nearly every aspect of Red Hat. Fedora Core is a direct descendant
    of Red Hat Linux 9, and these manuals are still valuable.


    # ## School days


    Another way to find out more information about Unix and Linux is to take a course,
    perhaps at a local community college. Many colleges offer courses in Unix, and
    some have started using Linux to teach their Unix courses. You can do your homework
    on your system at home, or, if you have a notebook (laptop computer), you can
    work anywhere. [on typed text for the first edition of this book in a hotel in
    Auckland, New Zealand, and updated text for the second edition in the United Airlines
    lounge in Chicago] What we would have given during our college years for the chance
    to do computer projects while sitting in the comfort of our own pub, or dorm rooms.
    Instead, we had to sit in a room with a bunch of punch-card machines — well, never
    mind. We would have been much more comfortable and productive with a Linux system.
    Sometimes progress *is* real.


    # ## In the news


    You can obtain additional information about the Linux operating system from mailing
    lists and newsgroups on the Internet. In fact, one of the first popular uses of
    the Internet was the Usenet information-sharing system. Usenet is similar to the
    World Wide Web in that it uses a set of protocols to perform a special type of
    communication other than the general-purpose Internet. Usenet provides the capability
    to let people participate in discussions via e-mail. People post messages to a
    specific interest group that anyone can view and respond to.


    Newsgroups and mailing lists are dedicated to specific topics: technological and
    any topic in which two or more people are interested. Dozens of newsgroups and
    mailing lists are devoted to Linux topics. Searching these groups often provides
    laser-like answers to your questions because someone else is quite likely to have
    encountered your problem and found a solution to it. You can also post your questions
    to newsgroups when necessary.'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# 296 Part V: The Part of Tens


    Check out the Fedora Core mailing lists at

    http://fedorah.redhat.com/participate/communicate

    This Web page provides access to all the Fedora Core lists.


    You can search for newsgroups at, for example, www.dejane.ws.com and www.mailgate.org.
    Google also provides an excellent mechanism to search groups, named Google Groups,
    at www.google.com/advanced_group_search.


    # User groups


    User groups are springing up all over the world. Some are more active than others,
    but most hold meetings at least once a month. Some groups are Linux only; others
    are connected to a larger computer group, either Unix or a more general computer
    users'' association. User groups offer a great opportunity to ask questions. User
    groups also tend to stimulate new ideas and ways of doing tasks.


    You can find out whether a Linux user group is in your area by checking with GLUE
    (Groups of Linux Users Everywhere), a service run by Specialized Systems Consultants,
    Inc. (SSC), which publishes Linux Journal. You can find GLUE, an automated map
    of user groups, at www.ssc.com.


    When you arrive at the site, click the Resources link, which takes you to the
    Linux Journal site. Then check out the Resources area there, to find out where
    the user group closest to you meets.


    ![](img/41feae212f5c6612ff709354891f7b39_313_0.png)


    No user group in your area? Post a message at your local university or community
    college saying that you want to start a group; other people in your area may decide
    to join you. Terrified at the thought of trying to start a user group? User-group
    leaders often aren''t the most technically knowledgeable members, but are simply
    good planners. They organize the meeting space, find (or round) speakers, send
    out meeting notices, locate sponsors, arrange refreshments (usually beer), and
    perform other organizational tasks. Sometimes, being the leader seems a thankless
    job, but when a meeting goes really well, it makes all the work worthwhile. So
    take heart: As a newbie to Linux, you may not know a grep from an awk (yet) but
    you still may make a good chairperson.


    # Fixing Common Problems


    This section describes how to fix several common problems. Each of the following
    sections outlines the problem and then describes the solution.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# **''I forgot my password''**


    **Problem:** You have to remember a zillion passwords at work and home. Unfortunately,
    you cannot remember your Linux password.


    **Solution:** The solution is simple if you have forgotten a user account password
    but still remember the root password. In that case, simply log in as root and
    reset the user password. For example, if your user name is `rod`, run the command
    `passwd rod` and enter the new password — for example, `likes coffee`.


    The solution is more difficult when you forget the root password. You have to
    become a hacker and break in to your computer to fix the problem. Fortunately,
    Red Hat provides two possible solutions: Either boot into single-user mode via
    GRUB or boot from the first Red Hat installation disc.


    # **''I forgot my root password!''**


    **Problem:** You cannot reset a regular user''s password if you cannot log in
    as `root` (superuser). However, you can easily circumvent having to log in as
    the `root` user by booting your Fedora Core computer into single-user mode.


    **Solution:** Turn on or restart your computer and press the cursor keys to select
    the Linux operation system when the GRUB boot screen appears; Linux is selected
    automatically if you''re not using a dual-boot system (you installed only Linux).
    Next, press the `e` key to edit the GRUB configuration. You see three lines, the
    middle of which starts with the word `kernel`. Use the cursor keys to select the
    `kernel` line when the three-line menu appears. Press the `e` key again, press
    the spacebar, and then enter the number 1 at the end of the line. Press the Enter
    key and you return to the original GRUB window. Finally, press the `b` key to
    boot your system into single-user mode.


    ![](img/41feae212f5c6612ff709354891f7b39_314_0.png)


    You can tell Linux to boot into nongraphical, rather than single-user, mode by
    substituting `3` for `1` when you''re editing the GRUB boot mechanism.


    # **''I need to break into my own computer!''**


    Power-on or reset your computer. Change your BIOS to boot from CD-ROM, if necessary.
    Before your computer starts the GRUB boot system, insert the companion DVD into
    the DVD or CD-ROM drive. When the Red Hat installation process begins, type `linux
    rescue` at the `boot:` prompt.'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'Red Hat boots into single-user mode and mounts your Linux partitions. You can
    access and use your computer’s *root* file system by entering the following command:


    ```

    chroot /mnt/sysimage

    ```


    You now have complete control over your computer. For example, you can reset the
    *root* password:


    ```

    passwd

    ```


    Enter the new password when you’re prompted — and note that anyone who has physical
    access to your computer can use this method to break into it! If you use your
    computer in public or semipublic places, you should set your BIOS password. Setting
    a BIOS password doesn’t make using this method of breaking in impossible, but
    it does make it harder.


    # *“I want to change the GRUB boot order”*


    **Problem:** You created a dual-boot computer with Fedora Core and Windows, and
    you want to change which one boots by default.


    **Solution:** Modify the `/etc/grub/grub.conf` file on your Linux computer. The
    *grub.conf* should look similar to this example:


    ```

    default=0

    timeout=10

    splashimage=(hd0,2)/grub/splash.xpm.gz

    title Fedora Core (2.6.3-2.1.253.2.1)

    root (hd0,2)

    kernel /vmlinuz-2.6.3-2.1.253.2.1 ro root=LABEL=/ rhgb

    initrd /initrd-2.6.3-2.1.253.2.1.img

    title Other

    rootnoverify (hd0,1)

    chainloader +1

    ```


    In this case, Linux is the operating system that boots by default, unless you
    select *otherwise*; *default = 0* corresponds to the first operating system on
    the list — the first Title line. To change the order, simply change the default
    value from 0 to 1. Here’s what that looks like:


    ```

    default=1

    timeout=10

    splashimage=(hd0,0)/grub/splash.xpm.gz

    title Fedora Core (2.6.3-2.1.253.2.1)

    root (hd0,2)

    kernel /vmlinuz-2.6.3-2.1.253.2.1 ro root=LABEL=/ rhgb

    ```'
  merge: -1
  img_proc: true
- pgno: 316
  md: "```\ninitrd /initrd-2.6.3-2.1.253.2.1.img\ntitle Other\nrootnoverify (hd0,1)\n\
    chainloader +1\n```\n\nThe next time you boot your computer, your Windows operating\
    \ system (the DOS line) automatically boots.\n\n# \"When I boot into Windows,\
    \ I get the recovery process\"\n\n**Problem:** You have a dual-boot computer with\
    \ Microsoft Windows as the alternative operating system. When you boot into Windows,\
    \ you see the Windows recovery screen. \"What happened? Help, I'm scared!\"\n\n\
    **Solution:** Relax — you almost certainly haven't lost your mind or your Windows\
    \ partition. What happened is that the Fedora Core installation process mistakenly\
    \ selected the Windows recovery partition from which to boot Windows. Most computers\
    \ now come with a preinstalled Windows recovery partition (rather than a recovery\
    \ CD-ROM), so Fedora Core sees at least two Windows partitions when it's configuring\
    \ GRUB, and it made the wrong choice. For example, you have hda1 and hda2, and\
    \ GRUB thinks hda1 is the Windows partition — but hda1 is actually the recovery\
    \ partition, and hda2 is Drive C in Windows.\n\nYou have to reconfigure GRUB to\
    \ point to the correct Windows partition to make it work correctly. For example,\
    \ you may have this `/etc/grub/grub.conf` file:\n\n```\ndefault=0\ntimeout=10\n\
    splashimage=(hd0,2)/grub/splash.xpm.gz\ntitle Fedora Core (2.6.3-2.1.253.2.1)\n\
    \    root (hd0,2)\n    kernel /vmlinuz-2.6.3-2.1.253.2.1 ro root=LABEL=/ rhgb\n\
    \    initrd /initrd-2.6.3-2.1.253.2.1.img\ntitle Other\n    rootnoverify (hd0,0)\n\
    \    chainloader +1\n```\n\nChange the `rootnoverify (hd0,0)` parameter to `rootnoverify\
    \ (hd0,1)` and reboot your computer. Alternatively, if your recovery partition\
