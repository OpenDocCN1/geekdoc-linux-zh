- pgno: 152
  md: '# Programming


    Fedora Core provides a good programming environment. Fedora Core provides links,
    via this menu, to several programming utilities, such as Emacs, that many people
    use for editing source code.


    +   * **Bug Report Tool**. Bug Buddy helps you report problems to the GNOME developers.


    +   * **DevHelp**. This program provides an all-in-one reference for numerous
    GNOME-related manuals. It also provides a search engine.


    +   * **Glade Interface Designer**. This application helps programmers design
    and create graphical user interfaces.


    +   * **Memory Profiler**. Programmers often encounter the problem of memory leakage.
    This program helps developers identify and eliminate memory problems.


    # Sound and Video


    Some fun stuff is stored here. You can access applications such as the Rhythmbox,
    CD player, a music ripper, and other audio applications. In this folder you also
    find more mundane items, such as the volume control and volume monitor utilities.
    See Chapter 12 for more details.


    +   * **CD Player**. You can play music CDs with this application.


    +   * **Helix Media Player**. An open source program that plays Ogg formatted
    files and audio streams.


    +   * **K3b**. This application copies, erases and burns both CD-ROMs and DVDs.


    +   * **Music Player**. This is Rhythmbox, which plays Ogg formatted files and
    Internet streams.


    +   * **Sound Juicer CD Ripper**. This application allows you to extract music
    tracks from your CDs.


    +   * **Sound Recorder**. You can record audio with this program.


    +   * **Volume Control**. This application allows you to control numerous volume
    controls.'
