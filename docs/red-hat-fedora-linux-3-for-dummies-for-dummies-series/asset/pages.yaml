    \ if you’re running your own LAN.\n\n+   - **Netmask**: Private networks based\
    \ on the Internet Protocol (IP) are divided into subnetworks. The netmask is a\
    \ string of binary bits that divides the IP address into two parts: a network\
    \ address and a host address. For IP addresses, such as the example in the preceding\
    \ bullet (192.168.1.1), the most common netmask is 255.255.255.0. This mask creates\
    \ a network address of 192.168.1 and a host address of 1.\n\n5. Click the **OK**\
