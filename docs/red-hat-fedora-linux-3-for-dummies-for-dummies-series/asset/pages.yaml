- pgno: 281
  md: '# # The Fix Is In: Troubleshooting Your Network


    Your Fedora Core machine is the foundation of your network and must be set up
    correctly for anything to run. If it isn''t working or if you have an unusual
    setup (or if Murphy is in a bad mood), you can check for several different causes.


    We use a Fedora Core computer connected to a private network as the troubleshooting
    example in this chapter. The Fedora Core network is one of the more difficult
    things to set up correctly because it depends on not only your Linux computer
    but also other computers. Suppose that your Fedora Core computer isn''t working
    within your private network. If that''s the case, use this chapter to help troubleshoot
    your network.


    ![](img/41feae212f5c6612ff709354891f7b39_281_0.png)


    See Part V for insights into other problems. Chapter 20 describes how to find
    information about common problems with your Fedora Core computer. Chapter 21 describes
    several security fixes.


    # # Introducing Fault Trees


    As with a surprising number or technical pursuits, troubleshooting is more of
    an art than a science. Sometimes, you can easily see what the problem is and how
    to fix it. At other times, that''s not so easy. The degree of difficulty you have
    in fixing a problem depends on how complex the problem is and how well you know
    your stuff. Obviously, the better acquainted you are with computers and Linux,
    the better you are at troubleshooting.


    Every problem has a solution. Computers are cause-and-effect-based machines. When
    something breaks or doesn''t work, there''s always a reason. The reason or reasons
    may not be easy to find, but they exist.


    How do you find the cause? That''s a million-dollar question. Getting a million
    bucks isn''t easy unless you''re willing to grind your teeth, plot against your
    fellow contestants for weeks on a remote island, purchase 10 million PowerBall
    tickets, or — believe it or not — work hard and work smart. Some people are willing
    to eat rats for the chance at a million bucks or are lucky enough to win the lottery;
    most just have to work hard. Oh, well.


    Working hard is conceptually easy, but how do you work smart? This concept is
    where the idea of the fault tree comes into play. (You mean faults grow on trees?
    Not exactly . . . ) The *fault tree* is a conceptual aid that helps you to eliminate
    all but the real cause of your problem. The fault tree looks like an'
  merge: -1
  img_proc: true
- pgno: 282
  md: "upside-down tree, where the trunk of the tree represents the fault, or problem.\
    \ The ends, or leaves, of the branches represent all the possible causes. After\
    \ that's done, solving the problem is virtually guaranteed.\n\nFor example, Figure\
    \ 18-1 shows part of a fault tree that points out which major subsystems you should\
    \ examine. To find the solution to a problem, you have to systematically identify\
    \ what's working. You work your way to what's not working and then when you find\
    \ it, you usually solve your problem. The fault tree simply helps to formalize\
    \ the process of problem solving.\n\nHere are some possible faults:\n\n+   ✓ **The\
    \ first branch on the left involves problems with the physical connection.** Do\
    \ you have a malfunctioning network adapter or switch/hub? Is the cable not connected\
    \ properly to the adapter? In that case, jiggle the cable or fuss with the connector.\
    \ Do you have a break in the cable or a loose connector?\n+   \n+   ✓ **The second\
    \ branch deals with the network interface configuration.** Have you correctly\
    \ configured the IP address for your Ethernet adapter (NIC)?\n+   \n+   ✓ **The\
    \ third branch helps you to decide whether the problem exists with the network\
    \ routing.** Can your network packets be directed toward the correct network?\n\
    \nThe fault tree helps you to break down any big problem into several simpler\
    \ ones. By eliminating each simple problem one by one, you should eventually locate\
    \ the root cause.\n\n![](img/41feae212f5c6612ff709354891f7b39_282_0.png)\n\n#\
    \ The blind leading the blind\n\nA colleague of ours, Ken Hatfield, once said,\
    \ \"One of the side benefits from lots of troubleshooting comes from what I call\
    \ 'the value of blind alleys.' Most often in troubleshooting, you go down blind\
    \ alleys, as in your tree example, the wrong branches of the solution tree. But\
    \ in doing so, you learn something. In the future, when you encounter a different\
    \ problem, that previous blind alley may be the road to the solution.\" Well,\
    \ said:\n\nsystem had filled up, which caused some programs to fail. When space\
    \ on `/var` was freed up, most of the programs started to do their jobs again.\
    \ But one program didn't work. Paul spent a long time trying to figure out why\
    \ it didn't work even after the problem was fixed. As it turned out, this particular\
    \ program's real problem was that its license had expired. He had not only walked\
    \ down a blind alley but also bumped into a wall and kept trying to go forward.\
    \ (D'oh!) \n\nHere's an example: we recently had a server that was having lots\
    \ of problems. The `/var` file"
  merge: -1
