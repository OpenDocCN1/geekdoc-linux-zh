- pgno: 286
  md: '**ESSID:** You have to use the same value on every machine connected to an
    ad hoc LAN. For example, every machine on the network is given the ESSID `linky`.


    **Encryption key:** You must use the same encryption key on every machine connected
    to a wireless network. The key comes in two flavors: 40-bit and 128-bit. The 40-bit
    key is effectively useless: it can be readily cracked by hackers, using widely
    available software. The 128-bit key can also be cracked, but takes more time,
    so it’s better than no key at all.


    Your wireless network should work as long as you set these parameters correctly
    and your computer is within range of the other devices on your LAN. The other
    parameters are either self-generating or unimportant in getting the card to work.


    # Maybe the physical connections aren’t set up right


    If you don’t see the line containing `lo`, which is the loopback interface, or
    `eth0`, which is your network adapter, your physical network connections aren’t
    set up right. The loopback interface isn’t a physical device; it’s used for the
    network software’s internal workings. The loopback interface must be present for
    the network adapter to be configured.


    If the loopback interface isn’t present, type this command:


    ```

    ifup lo

    ```


    If the loopback still isn’t configured, run this command:


    ```

    ifconfig lo 127.0.0.1

    ```


    If the network adapter (generally, an Ethernet card) isn’t present, type


    ```

    ifup eth0

    ```


    If that doesn’t work, run this command:


    ```

    ifconfig eth0 192.168.1.1

    ```


    Because this address is a Class C network address, `ifconfig` automatically defaults
    to the 255.255.255.0 netmask. If you suspect that the netmask isn’t being set
    — for example, you’re using a Class B address, such as 10.0.0.1 on a Class C network
    — type this command:


    ```

    ifconfig eth0 10.0.0.1 netmask 255.255.255.0

    ```'
