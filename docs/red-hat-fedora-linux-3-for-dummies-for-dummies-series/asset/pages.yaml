- pgno: 72
  md: '# Introducing the Linux File System Tree


    Linux, like Windows, uses files and directories to store and organize information
    and applications. This section introduces the Linux file system.


    Linux sees all its parts, except its network, as files. No surprise that Linux
    accesses files, directories, and devices as *file addresses*. To figure out where
    everything is, Linux uses a system of letters and numbers to refer to drives and
    drive partitions — for example, */dev/hda* may be the name of the first IDE hard
    drive in the system, and */dev/sdb* may be the name of the second SCSI hard drive.


    You can compare the Linux file system to an upside down tree. The trunk of the
    tree is the root directory — represented by a */* (slash). A series of limbs,
    branches, and leaves extends below the root: Limbs are mount points, the branches
    that extend from the limbs are directories, and the leaves on those branches are
    your files. Figure 4-4 shows the root, several directories, including etc, and
    a couple of files in etc.


    ![](img/41feae212f5c6612ff709354891f7b39_72_0.png)


    Each mount point is a drive partition or a remote file system (such as your DVD
    or CD-ROM drive) that is mounted to— identified and made visible as a directory
    of the limb “above” it on the imaginary tree. Whenever a disk partition or remote
    file system is mounted on the directory branch, it turns that branch into another
    limb — allowing even more branches to be positioned and attached below the mount
    point.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'Fedora Core needs at least a root partition in your directory structure and
    a swap space partition. The root partition stores all personal and system files
    and directories; Linux uses swap space to extend memory capabilities temporarily
    beyond the limit of your random-access memory (RAM). If you have 512MB of RAM
    and 512MB of swap space, for example, you can run a program that uses almost 1GB
    of memory. Part of it is stored in memory and the rest sits in swap space.


    This configuration isn’t much different from the Windows and MS-DOS file systems
    — Windows, after all, uses the concept of a hierarchical directory tree — but
    the syntax is somewhat different. The top-level directory in Fedora Core, *root*,
    is designated with a forward slash (/). Every subsequent subdirectory name follows
    that initial slash. For example, the home directory is a subdirectory of root
    and is shown as /home. In the Windows world, the equivalent of the root directory
    is designated with an initial backslash (\). The famous C: prompt is synonymous
    with C:\. The theme for both operating systems is carried forward when dividing
    subdirectories: Linux uses forward slashes and Windows uses backslashes. For instance,
    a directory can be shown as /x/y/z in Linux and as C:\x\y\z in Windows. Both operating
    system can have subdirectories, such as /x/y/z/abc in Linux or C:\x\y\z\abc in
    Windows.


    The location of a file or directory is given as a path. For instance, /x/y/z/abc
    describes the path to the subdirectory abc; if the file i23 lives in subdirectory
    abc, then its path is /x/y/z/abc/i23. Paths can be absolute or relative. Absolute
    paths always refer to the root directory (as in the examples just given). Relative
    paths refer to wherever you happen to be in the system; they’re relative to your
    current location.


    ![](img/41feae212f5c6612ff709354891f7b39_73_0.png)


    Another fundamental difference between Linux and Windows file systems is that
    Linux requires you to explicitly mount file systems. Windows does so automatically.
    Explicitly mounting the file system isn’t as onerous as it sounds. Fedora Core
    installs utilities that automatically sense and mount file systems when necessary.
    For example, the default Fedora Core configuration mounts a DVD or CD-ROM automatically
    whenever you insert it in the drive.


    The Workstation installation type we describe in Chapter 3 automatically sets
    up your root and swap partitions in addition to an extra root partition used for
    storing the Fedora Core kernel and other files used for booting your computer.
    (The Personal Desktop installation type uses the same partitioning scheme as the
    Workstation installation type.)


    # ## Creating User Accounts


    Because Fedora Core is a multiuser system, more than one person at a time can
    use it. For example, you can be logged in at the computer console (the attached
    keyboard and monitor) while someone else is logged in via a network connection.
    Therefore you — and every other user — must have an'
  merge: -1
  img_proc: true
- pgno: 74
  md: "individual user account in order to use the computer. Each account requires\
    \ an individual account name and password to protect your information and keep\
    \ your tasks separate from other people’s tasks.\n\nIf you have cause to add new\
    \ users (if you have a home network, for example) or you forgot to create a *nonroot*\
    \ user account during installation, this section shows you how. Fedora Core offers\
    \ both graphical and text-based user account creation and modification tools for\
    \ your convenience. The following two sections describe how to use both types\
    \ of utilities.\n\n![](img/41feae212f5c6612ff709354891f7b39_74_0.png)\n\nYou can\
    \ use the Fedora Core User Manager to modify an existing user account. Click the\
    \ user name and then the Properties button, and a window similar to the Create\
    \ New User window opens. You can then modify any aspect of the account.\n\n# ##\
    \ Using the Graphical User Manager\n\nThe Fedora Core User Manager is an excellent\
    \ administration tool that can make your life easier. It provides an easy-to-use\
    \ interface that simplifies your system administration job. Use the User Manager\
    \ to create a new account by following these steps:\n\n![](img/41feae212f5c6612ff709354891f7b39_74_1.png)\n\
    \n+   1.  **Open the User Manager by clicking the GNOME Menu button and then choosing\
    \ System Settings→ Users and Groups.**\n+       This is a job for *superuser*.\
    \ If you’re not logged in as the *root* user, you’re prompted to enter the *root*\
    \ password.\n+       The Fedora Core User Manager window appears.\n+   \n+   2.\
    \  **Click the Add User button in the upper-left corner of the screen.**\n+  \
    \     The Create New User window appears, as shown in Figure 4-5.\n+   \n+   3.\
    \  **Enter your user name, real-life name (full name), and password twice (to\
    \ confirm that it’s correct); accept the Login Shell default of /bin/bash.**\n\
    +       The Fedora Core User Manager also creates a home directory by default.\n\
    \nMost of these items are self-explanatory, but here’s some additional information:\n\
    \n+   - Your user name (also known as a *login name*) is the name you use to log\
    \ in to your computer. Make your user name easy to remember and use all lowercase\
    \ letters. Cute names may not seem appropriate later. Avoid choosing a name that\
    \ is too long because you may have to type it several times a day. You may also\
    \ end up using your user name as your e-mail address and have to give it up over\
    \ the telephone, so a login name such as *phool* results in missent messages,\
    \ leaving you feeling phoolish."
  merge: -1
  img_proc: true
- pgno: 75
  md: '# Part I: Installing Fedora Core


    ![](img/41feae212f5c6612ff709354891f7b39_75_0.png)


    **Figure 4-5:** The Create New User dialog box.


    +   * You can enter your full name if you want. That information is saved in the
    `/etc/passwd` file, which anyone with an account on your system can read. This
    information is generally useful to system administrators because it allows them
    to connect a person with each account. (Well, okay, it’s probably superfluous
    if you’re configuring your personal system.)


    +   * The new password should be different from the one you use for `root`.


    As you type the password, a line of asterisks (rather than the actual password)
    appears on-screen in case someone is looking over your shoulder as you type. (Fedora
    Core is showing its paranoid side here.) In text mode, you don’t get any feedback,
    such as asterisks or other characters.


    +   * Among your many choices for a default shell, `/bin/bash` is a good choice
    (`bash` is a popular shell that is the default for Fedora Core).


    4. Click **OK**.


    Your account is created.


    ![](img/41feae212f5c6612ff709354891f7b39_75_1.png)


    Fedora Core uses the Pluggable Authentication Module (PAM), which prevents you
    from entering trivial or otherwise dangerous passwords; don’t use that as assurance,
    however, that your new password is a good one. A good password cannot be found
    in any dictionary because password crackers have programs that automatically try
    all dictionary words to crack your password. Avoid birthdays and anniversaries
    or anything someone could associate with you. For ideas about good passwords,
    check out Chapter 3. Just don’t forget it, and *don’t* write it on a sticky note
    and put it on your monitor!'
  merge: -1
  img_proc: true
- pgno: 76
  md: "![](img/41feae212f5c6612ff709354891f7b39_76_0.png)\n\nYou can also use the\
    \ Fedora Core User Manager to delete an existing user account. Click the user\
    \ name and then the Delete button, and the account is immediately removed. Be\
    \ careful and be sure of what you want to do — Fedora Core doesn’t ask you to\
    \ confirm the account deletion. Fortunately (in this case), the account’s home\
    \ directory is left intact (not deleted); you can go back and re-create the account\
    \ if necessary.\n\n# Using the text-based useradd command\n\nMany system administrators\
    \ prefer using text-based (CLI) tools and utilities. Text-based tools are relatively\
    \ easy to use after you become familiar with them. They also tend to save time\
    \ if you’re doing numerous administration jobs simultaneously, because you don’t\
    \ have to work between multiple windows — instead, you just type a series of commands.\n\
    \nThese steps describe how to use the useradd program to create a user account:\n\
    \n+   1. Open a GNOME Terminal window by clicking the GNOME Menu button and choosing\
    \ System Tools→Terminal.\n\n+   2. Log in as root by entering this command:\n\
    +   `su -`\n\n+   3. Enter the root password when prompted.\n\n+   4. Type useradd\
    \ name at the command prompt, where name is the login name for the new login account.\n\
    +   \n+   To change the system assigned password for the account you’ve just created,\
    \ enter the following command:\n+   `passwd name`\n\n+   5. Type a password when\
    \ you’re prompted and press Enter.\n+   \n+   This step changes the password of\
    \ the new account, which had a default password assigned to it by the useradd\
    \ command in Step 4. (What good is a password if you use the default?)\n\n+  \
    \ 6. Type your password again.\n+   \n+   Fedora Core asks you to retype your\
    \ new password to ensure that the password you typed is the one you thought you\
    \ typed. If you don’t retype the password exactly as you did the first time (which\
    \ is easy to do because it doesn’t appear on-screen), you have to repeat the process.\
    \ Fedora Core updates the password for the new login."
  merge: -1
  img_proc: true
- pgno: 77
  md: '# ## Ending Your First Session


    Logging off the system and restarting the login process is simplicity itself.
    To do so, click the GNOME Action button and choose Log Out. The Are You Sure You
    Want to Log Out? window appears, and you’re asked to confirm that you want to
    log out. If you do (do you *really*?), click the OK button and you’re outta there.
    Click No if you change your mind and want to play around with your new operating
    system a while longer.


    You can also choose to reboot — or halt — your computer from this window by clicking
    the Shutdown button or the Reboot button and then clicking OK to confirm your
    decision. Depending on which you choose, your system stops completely or reboots.
    You can also press the Ctrl+Alt+Backspace keys to shut down your current session.
    This method is less graceful but still effective, especially in case some renegade
    process freezes your X session.


    ![](img/41feae212f5c6612ff709354891f7b39_77_0.png)'
  merge: -1
  img_proc: true
