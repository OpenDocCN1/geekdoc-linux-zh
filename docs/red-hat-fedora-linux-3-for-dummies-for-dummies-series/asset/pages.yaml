- pgno: 310
  md: '# # Chapter 20

    # Ten Problem Areas and Solutions


    # ## In This Chapter


    +   * Finding information about Linux

    +   * “I forgot my password”

    +   * “I forgot my root password”

    +   * “I need to break into my own computer!”

    +   * “I want to change the GRUB boot order”

    +   * “When I boot into Windows, I get the recovery process”

    +   * “My network is working, yet not working”

    +   * “I want to make an emergency boot floppy disk”

    +   * “I can’t boot from my DVD”

    +   * “Linux can’t find a shell script (or a program)”

    +   * “I don’t know how to make the X Window System start at boot-time”


    In any technical situation, people end up having problems and issues they need
    help with. This chapter is designed to help answer the most common problems you
    may encounter when you’re using Fedora Core.


    # ## “Help! I Need Some Help!”


    Before this chapter gets into showing you how to solve specific problems, it first
    describes several sources of information. Because we cannot cover more than a
    few of the most common problems, we first point you in the direction toward more
    information and help.


    # ## Books and more books


    When we were working with computers during the Jurassic era, the number of books
    about computers could fill little more than one bookshelf, and they were mostly
    about the electronics of the hardware itself. Networking books'
  merge: -1
  img_proc: true
- pgno: 311
