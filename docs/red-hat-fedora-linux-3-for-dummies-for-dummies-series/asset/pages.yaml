- pgno: 28
  md: '# Chapter 1


    # And in the Opposite Corner . . .

    a Penguin?


    # **In This Chapter**


    +   - Napping through Linux History 101

    +   - Finding out what Fedora Core can do

    +   - Using Fedora Core as a workstation

    +   - Using the Fedora Core network functions


    **W**e see a penguin in your future. He''s an unassuming fellow who''s taking
    on a rather big competitor — that *other* operating system — in the battle for
    the hearts, minds, and desktops of computer users. Fedora Core, the successor
    to Red Hat Linux, is undoubtedly one of the driving forces behind the Linux revolution
    — and is the most popular Linux brand.


    This chapter introduces you to the latest and greatest Fedora Core release, Fedora
    Core 3. This book covers all the bases (a good number of them, at least) about
    how to use Fedora Core as a desktop productivity tool, Internet portal, multimedia
    workstation, and basic network server. You can do lots of things with Fedora Core;
    this chapter gives you an overview of the possibilities — in addition to a brief
    look at the history of Linux.


    # **History of the World, er, Linux: Part II**


    In the beginning of computerdom (said in a booming, thunderous voice), the world
    was filled with hulking mainframes. These slothful beasts lumbered through large
    corporations, required a special species of ultra-nerds to keep them happy; and
    ate up huge chunks of space, power, and money. Then came the IBM PC and Microsoft,
    and the world changed. Power to the people, sort of.'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'In 1991, a student at the University of Helsinki named Linus Torvalds became
    dissatisfied with the standard PC operating system. He thought that the Unix operating
    system might be better suited than MS-DOS or Windows to help him accomplish his
    work. Unix was invented in the 1970s and, although powerful, it was expensive,
    so he began writing his own version of Unix. Now, writing your own operating system
    is a simple task — not! After formulating the basic parts, Torvalds recruited
    a team of talented programmers through the Internet, and together they created
    a new operating system, or kernel, now named Linux.


    One of the most important decisions that Torvalds made in the early days of Linux
    was to freely distribute the Linux kernel code for anyone and everyone to do with
    as they wanted. These *free Linux distributions* were (and still are) available
    in several forms, mainly on-line.


    The only restriction Linus imposed on the free distribution of his creation was
    that no version of the software can be made proprietary. (*Proprietary* software
    is owned and developed by private companies in places that often rival Area 51
    in security. However, *open-source* code is for “the people” — anyone can use
    and develop it without fear of violating copyrights or patent restrictions.) You
    can modify it to your heart’s content and also distribute it for fun or profit.
    What you *can’t* do is stop anyone else from using, modifying, and distributing
    the software you have modified.


    Think of open-source software as a path. Linus and others started building the
    path, and many people came along and found it useful. Some people began adding
    to the path, while others used it as is. You can use the path, make it wider,
    and add another branch, if you want — but you *can’t* stop anyone from using the
    original path or the section they added; neither can you prevent people from adding
    their own branches.


    The lack of traditional proprietary software restrictions on Linux has led to
    continued improvements and innovations in its technology — and subsequently its
    immense popularity. Open-source software, and Linux in particular, is transparent
    to all users and developers. That transparency allows people throughout the world
    to rapidly improve Linux and its associated subsystems. In contrast, proprietary
    operating systems are like a sealed, black box where no one except a small group
    of privileged insiders knows what goes on inside. Only that select group can make
    modifications, and that limits innovation and improvements.


    Return to our brief history lesson: In early spring 1994, the first real version
    of Linux (Version 1.0) was made available for public use. It was very exciting.
    Even then, it was an impressive operating system that ran smartly on computers
    with less than 2MB of RAM and a simple 386 microprocessor. Linux 1.0 also included
    free features for which other operating systems charged hundreds of dollars. Nowadays,
    tens of millions of users enjoy Linux at home and work.'
