- pgno: 71
  md: "![](img/41feae212f5c6612ff709354891f7b39_71_0.png)\n\n![](img/41feae212f5c6612ff709354891f7b39_71_1.png)\n\
    \n+   11. Click **OK** and the Display Settings window closes.\n+   \n+   An Information\
    \ window opens, informing you that you need to log out and then log back in to\
    \ make the changes take effect.\n+   \n+   12. Click **OK** to leave the Information\
    \ window.\n+   \n+   13. Log out and then log back in to make the changes take\
    \ effect.\n\nAlternatively, you can reboot your computer to enforce the changes.\n\
    \nYou can also restart X unceremoniously, but quickly, by pressing Ctrl+Alt+Backspace.\
    \ Your current X session is stopped and eventually restarted. You can then log\
    \ back in.\n\n# Delving deep into color depth\n\n*Color depth*, the number of\
    \ colors your system can have active on the window, is loosely a function of both\
    \ the amount of video memory contained by your system and the window resolution.\n\
    \nIf your system has a small amount of random access memory (RAM), your screen\
    \ can have a resolution of 1024 x 768 pixels (dots) with 256 colors (8 bits) on\
    \ the screen at one time. If your system has 2MB of memory, you can have 64 thousand\
    \ colors (16 bits) on the screen at the same time at the same resolution. The\
    \ more memory you have, the more colors you can display for any given resolution.\n\
    \nWhen you want to display an image and the color depth isn't correct, nothing\
    \ drastic happens. The picture may look lackluster or not quite normal. That's\
    \ because X has an interesting capability that allows the use of *virtual color\
    \ maps*; the active window can utilize all the colors of the bits of color depth,\
    \ even if other windows are using different colors.\n\n![](img/41feae212f5c6612ff709354891f7b39_71_2.png)"
  merge: -1
