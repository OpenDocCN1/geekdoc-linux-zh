    \nding and not on how to build simple networks. You could hardly ever find\n\n\
    any computer operating-system books in the popular bookstores. The\n\nimmensely\
    \ popular book *DOS For Dummies*, by Dan Gookin (Wiley), was, in\n\nfact, one\
    \ of the first operating-system books — and launched the *For*\n\n*Dummies* series.\n\
    \nThousands of books about computers are available now; most describe the\n\n\
    software and its interactions, with the hardware taking a back seat. Books\n\n\
    such as the ones in the *For Dummies* series aren’t just for bookstores any\n\n\
    more. You can also find them in mass-market venues, such as your local elec-\n\
    \ntronics superstore.\n\n![](img/41feae212f5c6612ff709354891f7b39_311_0.png)\n\
    \nOne great source for information about *For Dummies* books is the television\n\
    \nseries *The Simpsons*. That show loves and greatly respects *For Dummies*\n\n\
    authors in particular and provides an amazingly accurate portrait of us. (D’oh)\n\
    \nPerhaps you looked at other books before you bought this one and were\n\nintimidated\
