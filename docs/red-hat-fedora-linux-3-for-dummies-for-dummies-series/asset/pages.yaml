- pgno: 275
  md: "# # Fending off modular rootkits\n\nA *rootkit* is a software program that\
    \ a hacker installs on your machine and then uses against you and others; the\
    \ software also includes tools to hide itself from you. Garden-variety rootkits\
    \ run as regular applications and can be detected with standard tools. Many rootkits\
    \ (nearly 60 at the time we wrote this book) can be detected with the easy-to-use\
    \ chkrootkit system. Go to www.chkrootkit.org and download the software by clicking\
    \ the Latest Source Tarball link (about a page down under “Download”).\n\nOne\
    \ of the newer and more insidious threats is the *modular rootkit*. Modular rootkits\
    \ insert themselves into your Linux kernel and then control everything on your\
    \ computer. Because they live in your kernel, you cannot depend on any standard\
    \ detection tools to ferret them out.\n\nAfter you employ the good security techniques\
    \ discussed in this chapter and this book, the best way to avoid modular rootkits\
    \ is to prevent kernel modules from being loaded. You can download the Linux rootkit\
    \ source code from kernel.org and compile it as a *monolithic kernel*—that is,\
    \ compile modules directly into the kernel. Describing how to compile monolithic\
    \ kernels is beyond the scope of this book, but an alternative method is quite\
    \ easy to use.\n\nHere's the alternative: You can take advantage of a feature\
    \ in the 2.6 Linux kernel that Fedora Core 3 uses. The 2.6 kernel and its modules\
    \ include cryptographic signatures that can be used to prevent non-signed modules\
    \ from loading. Using this feature greatly reduces the danger of getting infected\
    \ with modular rootkits.\n\nTo prevent unsigned module loading add the enforcemodulesig\
    \ option to the kernel configuration in /boot/grub/grub.conf. For instance, your\
    \ grub.conf file should look like the following:\n\n```\ntitle Fedora Core (2.6.8-1.541)\n\
    \    root (hd0,0)\n    kernel /vmlinuz-2.6.8-1.541 ro\n    root=LABEL=/ rhgb quiet\
    \ enforcemodulesig\n    initrd /initrd-2.6.8-1.541.img\n```\n\nThis option will\
    \ take effect the next time you reboot your computer.\n\n# # Introducing SELinux\n\
    \nThe new and powerful Security-Enhanced Linux (SELinux) was designed by the National\
    \ Security Agency (NSA) to increase computer security (see www.nsa.gov/selinux/).\
    \ SELinux has recently been added to the Linux kernel. (Adding new functions to\
    \ the kernel is a difficult process. Only the very best software gets added.)"
  merge: -1
  img_proc: true
- pgno: 276
  md: 'SELinux is based on the Linux Security Module (LSM), which is a general-purpose
    and powerful mechanism for adding security software to Linux. SELinux provides
    the framework to make Linux more secure. Please go to http://lsm.immunix.org/
    for more information.


    # ## Introducing access-control types


    Linux uses a Discretionary Access Control (DAC) model to control file access;
    see Appendix C for more information about file permissions. If used correctly,
    the DAC model provides some security. However, when used incorrectly, or misused,
    it can cause problems. For instance, if you own a file or directory, you can make
    it world-readable and world-writable. Owning a file gives you nearly unlimited
    power over its use. This can create security holes, especially if you''re the
    root user. (For instance, making /etc/shadow file world-writable is a very bad
    idea because that makes it possible for a hacker to change your user passwords.)


    SELinux adds Mandatory Access Control (MAC) capability to the Linux kernel. You
    configure the SELinux policy before starting the computer so users, root included,
    and processes can''t arbitrarily allow access to other objects (files, directories,
    and sockets) they own. This model also helps minimize the access that buggy software
    provides hackers. SELinux isolates processes, files, and users from each other
    to create a more secure environment.


    ![](img/41feae212f5c6612ff709354891f7b39_276_0.png)


    SELinux can''t allow access to an object if the Linux operating system doesn''t.
    Even if SE Linux''s MAC allows access to a file or directory, you''re prevented
    access if denied by Linux''s DAC. Linux takes precedence over SELinux.


    # ## Introducing security contexts


    SELinux uses the concept of *security context* (SC) and policy to control access
    to resources such as files, directories and objects; such resources are referred
    to as objects. When viewed from 40,000 (virtual) feet, this system is very simple:
    Every Linux resource has a security context. A predefined policy determines whether
    one SC (the source) can access another SC (the target).


    The details of how SC and policy work together, however, is more complicated.
    The rules that define policy and the security context for every object take many
    thousands of lines. Fortunately, Fedora Core 3 configures all this for you.


    Defining individual rules to account for every possible SC combination would be
    impossibly complex and rigid because a Fedora Core computer has thousands of files,
    directories, and so on.'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'Therefore, SELinux uses role-based access control (RBAC) to simplify policy
    definitions. RBAC defines what SC users and programs can enter.


    The security context for an object — a file, directory, socket, and so on — consists
    of a security identity (SID), a role and type. A process SC is made up of a SID,
    a role, and a domain. An object gets tagged with a type and a process belongs
    to a domain.


    The following list describes the components of an SC:


    +   - **Domain.** Processes belong to domains. Domains define the object type
    that a process can access. Domains are the flip side of Types.

    +   - **SELinux Identity.** Every process has a SELinux Identity (Sid). SELinux
    uses the SID to track users and processes — that isn’t possible with plain Linux.
    The SID is different from the Linux user identity (UID).

    +   - **Role.** Roles determine the domains that users and processes can access.

    +   - **Type.** Objects are assigned types. An object Type defines the domains
    that can access it.


    # # Introducing SELinux policy options


    Fedora Core 3 installs and configures SELinux by default. The installation includes
    two security policies: *Targeted* and *Strict*.


    The *Strict* policy creates a separate Domain for every daemon, the root user,
    and for nonprivileged users. Using the *Strict* policy creates a very safe system,
    but one that is difficult to modify (thus inflexible). You generally have to manually
    configure the SELinux SC for third-party software and that can be a difficult
    process. Only experienced SELinux administrators should use the Strict policy.


    Fortunately, the Fedora Core development team created the *Targeted* policy as
    a compromise between the traditional Linux DAC and SELinux with a Strict policy.


    The *Targeted* policy creates separate domains for a handful of service daemons
    such as Apache; Apache daemons belong to the HTTP domain (*http_t*), for instance.
    These domains are restricted from accessing all other domains. They’re isolated
    islands that can access the bare minimum of resources.


    On the other hand, every user, process, and object belongs to the Unconditional
    (unconditional_t) domain. No access limitations are placed on members of the unconditional
    domain. Unconditional domain members effectively operate as if they were under
    control of the standard Linux DAC system.'
  merge: -1
  img_proc: true
- pgno: 278
  md: 'The *Targeted* policy compromise makes sense. If you use your Fedora Core computer
    as a workstation protected by a firewall and the methods and systems described
    in this chapter, then you have relatively little security exposure. However, if
    you start running network services such as Apache, then your risk accelerates.
    Protecting network-based services with SELinux provides a big step up in security.


    Describing more about the inner workings of SELinux is beyond the scope of this
    book. Using the *Targeted* policy should be adequate for most people''s needs.
    However, you can read more about SELinux from the following mailing list and Web
    sites:


    +   - `http://fedora.redhat.com/mailman/listinfo/fedora-selinux-list`

    +   - `www.lurking-grue.org/gettingstarted_newselinuxHOWTO.html`

    +   - `www.crypt.gen.nz/selinux/faq.html#WWW.1`

    +   - `www.samag.com/documents/s-7835/sam0303a/0303a.htm`

    +   - `www.crypt.gen.nz/selinux/faq.html`


    # ## Understanding the Security Process


    The best way to look at security is as a process. The more you think about it
    and the more you study it, the safer you are. You should use the security systems
    described in this chapter as the foundation for your security process. However,
    you should continue to build your security process to meet the needs of your own
    computer system and network.


    This section outlines some additional building blocks you may consider adding
    to your process:


    +   - **Making backups:** Backups are part of the security process? Yes! Backups
    are an essential security tool in the sense that you can never eliminate the possibility
    of getting hacked. When your security is breached, you may lose all sorts of information
    and configurations. For example, all the information on your computer may be completely
    erased or, worse, you may not know which files are good or bad. You must ensure
    your ability to recover from these types of catastrophes.


    One good backup method is to use the GnomeTool user application, as we describe
    in Chapter 11. You can store your user account and configuration files on a CD-R/RW
    or DVD+/-RW. This method is reliable, and the discs should last forever. The only
    limitation is the CD''s ability to store only 700MB to 800MB of data (although
    you can store more data with compression).'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'Security education: Keeping up with security trends and topics helps you avoid
    getting bitten by new hacks. Knowing your adversaries and their techniques is
    essential.


    These URLs provide good security-based information; see Chapter 21 for some current
    top security holes:


    +   • www.linuxsecurity.com

    +   • www.sans.org

    +   • www.nmap.org

    +   • www.securitytracker.com

    +   • www.counterhack.net

    +   • www.infosysec.com

    +   • www.cert.org


    Physical security: We focus on discussing network-based security in this book.
    We assume that your Fedora Core computer is running on your home network, in which
    case you have to worry mostly about Internet bad guys. In an office environment,
    however, you have to worry about physical security.


    Physical security involves preventing people from walking up and gaining unauthorized
    access to your computer. You should set a BIOS password to prevent anyone else
    from booting your computer into single-user mode (which would totally avoid your
    Linux passwords). You should lock your computer in your office, if possible, to
    prevent anyone from stealing your hard drive. Don''t, under any circumstances,
    write your passwords in any accessible place (such as on your desk or computer).


    You should also set the GNOME (or KDE) screen lock unless you want to log out
    every time you leave your desk. Choose GNOME Menu→ Preferences→Screensaver and
    then select the Lock Screen After option. Select the amount of time to wait before
    locking your screen and then click the Close button.


    Boring consistency: Good long-term security depends on consistency. Making backups,
    reading security logs, and performing other, similar tasks all depend on your
    maintaining interest. It''s like staying in shape: You cannot be good for a while
    and then forget about your routine.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Chapter 18


    # Bringing In the Fedora Core Repairman


    In This Chapter


    +   - Understanding the art of troubleshooting

    +   - Gardening with the fault tree

    +   - Diagnosing network problems


    This book is perfect, and there’s no way that anything we have written can ever
    go wrong — never, ever. You may be as lonely as the Maytag repairman if you expect
    trouble. As the Pop Will Eat Itself tune goes: The trouble is, trouble never happens.
    Errata (corrections) are as outdated as a brick-and-mortar bookstore. This book
    makes setting up computers and networks so easy that you may wonder why other
    people have so many problems! Blah, blah, blah.


    Yeah, right. The problem is that this guy named Murphy (as in Murphy’s Law) hangs
    out in both virtual and real bookstores, and visits all things mechanical and
    electronic. He’s always jumping in just when things are starting to go well. The
    guy just cannot keep his nose out of other people’s business. This chapter is
    meant to smooth things out between you and Murphy in case he catches up with you.


    One common problem involves getting your Fedora Core computer to work on a network.
    Sometimes, the best-laid plans go a little awry and Murphy comes to visit. This
    chapter is designed to help when networking problems pop up.'
  merge: -1
