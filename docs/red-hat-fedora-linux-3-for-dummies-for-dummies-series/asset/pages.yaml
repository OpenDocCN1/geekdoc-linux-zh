    # ## Protecting your LAN with a firewall


    After you have configured your gateway for IP forwarding, you need to protect
    your network from the bad guys on the Internet. This section describes how to
    turn your gateway into a firewall. You use the same process and many of the same
    rules we describe in Chapter 8; however, this firewall is designed to protect
    your entire network, whereas the one in Chapter 8 is oriented toward protecting
    individual workstations.


    The firewall you’re building helps to protect both your computer and your network.
    The firewall provides the network address translation (NAT) function, which allows
    the computers on your private network to access the Internet. NAT, you may recall,
    converts the nonroutable source IP addresses (192.168.1.1, for example) into the
    routable source IP address of your Internet connection.


    ![](img/41feae212f5c6612ff709354891f7b39_223_0.png)


    Network address translation is also referred to as *IP masquerading*, or simply
    masquerading.


    The basic configuration of the firewall we describe in Chapter 8 works in the
    new configuration. The firewall performs these functions:


    +   -   **Block all incoming, outgoing, and forwarded packets:** Start by blocking
    all network traffic by default. This firewall completely protects your private
    network and also makes it useless! Start with this policy to ensure that the firewall
    blocks all connections except the ones you explicitly allow.'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# Chapter 15: Building Your Own Private Network


    ✔ **Allow all internal traffic**: You must allow all network traffic on the Internet
    gateway''s internal loopback (lo) interface. The loopback interface is used by
    the Linux operating system for its own, internal communication. Many internal
    processes communicate over this virtual network.


    ✔ **Allow all internal NIC traffic**: You reap greater convenience if you allow
    the computers on the private network to communicate with the gateway. For example,
    you may want to administer the gateway via Secure Shell (SSH). Take a lenient
    approach and allow any external machine to communicate with the gateway; this
    strategy makes constructing the firewall easier. You may decide to limit internal
    access if your security needs demand it.


    ✔ **Allow all outgoing traffic from the firewall**: Allow all outgoing connections
    from within the firewall. The firewall needs to perform its own internal processes,
    such as making DNS queries.


    ✔ **Forward all traffic from the private network**: A gateway has to pass traffic
    from one interface to another. You change the forwarding policy to permit communication
    from the private network to pass through the firewall to the Internet. The downside
    is that traffic from the Internet can pass right through the firewall to the private
    network — not a good idea. You fix that problem by adding NAT, which effectively
    prevents external access through the firewall.


    You can set up specific forwarding rules to provide more protection to your private
    network. We believe that using NAT to effectively block connections that originate
    externally is adequate for your needs.


    ✔ **Use NAT for outgoing connections**: Create a NAT rule to make all connections
    originating on the private network appear to be coming from the Internet gateway.
    All private-network machines have their source addresses and port numbers changed
    to that of the gateway.


    Network-address translation isn''t necessary if your Internet connection device
    (telephone, DSL, or cable modem) performs NAT. By providing a NAT filtering rule,
    however, you ensure that your Internet gateway works with any connection device
    — whether or not it performs NAT. NAT also prevents external access to your private
    network.


    ✔ **Allow incoming SSH connections**: The Secure Shell (SSH) protocol encrypts
    network connections. SSH provides a reasonably secure system for connecting to
    your private network from the Internet. We configure the firewall to allow SSH
    connections into our firewall.


    The firewall on the Internet gateway is similar to the firewall we describe in
    Chapter 8, except you add IP forwarding and NAT. IP forwarding allows packets
    from the private network to pass outward through the firewall and on to the Internet.
    In this case, NAT makes all Internet-bound traffic appear to be coming from the
    firewall or gateway — and prevents incoming packets from being forwarded inward
    to your private network.'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'Follow these steps to create your Internet gateway firewall:


    +   1. Log in to your computer as root and open a GNOME Terminal window, by right-clicking
    any empty portion of the desktop and choosing Open Terminal from the menu.


    Alternatively, you can click the GNOME Menu and choose System Tools\>Terminal.


    +   2. Enter this command to turn off any running firewall:


    ```

    service iptables stop

    ```


    +   3. To save the default Fedora Core firewall configuration, type


    ```

    mv /etc/sysconfig/iptables /etc/sysconfig/iptables.bak

    ```


    +   4. Start by denying all network traffic on all devices, by entering these
    commands:


    ```

    iptables --policy INPUT DROP

    iptables --policy OUTPUT DROP

    iptables --policy FORWARD DROP

    ```


    +   5. To allow all outgoing and incoming traffic on the loopback device, type


    ```

    iptables -A OUTPUT -j ACCEPT -o lo

    iptables -A INPUT -j ACCEPT -i lo

    ```


    +   6. Type the following lines to allow all outgoing and incoming traffic on
    the internal NIC:


    ```

    iptables -A OUTPUT -j ACCEPT -o eth0

    iptables -A INPUT -j ACCEPT -i eth0

    ```


    +   7. To allow all outgoing connections from the firewall, enter these commands:


    ```

    iptables -A OUTPUT -m state --state NEW,RELATED,ESTABLISHED -j ACCEPT

    iptables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT

    ```


    These rules allow processes running on the firewall computer to connect to the
    Internet.


    +   8. To forward all traffic from the internal NIC to the external NIC, type
    these lines:


    ```

    iptables -A FORWARD -f eth0 -m state --state NEW,ESTABLISHED,RELATED -j ACCEPT

    iptables -A FORWARD -i eth1 -m state --state ESTABLISHED,RELATED -j ACCEPT

    ```


    The first rule forwards outgoing traffic via the internal NIC (eth0). The second
    rule forwards the return traffic back into the private network via the external
    NIC (eth1).'
  merge: -1
  img_proc: true
- pgno: 226
  md: "![](img/41feae212f5c6612ff709354891f7b39_226_0.png)\n\nForwarding chains are\
    \ independent of input and output chains. You could, for example, stop all incoming\
    \ and outgoing packets to and from the firewall computer Veracruz on the private\
    \ network, simply by skipping Step 6. You wouldn't be able to communicate with\
    \ the firewall itself, but Veracruz would still forward packages from the private\
    \ network to the Internet.\n\n+   9. To **perform network-address translation\
    \ on outgoing traffic**, type \n+   \n+       iptables -A POSTROUTING -t nat -o\
    \ eth1 \\n    -j SNAT --to 192.168.32.254\n+   \n+   All network traffic bound\
    \ from any private network address to the Internet then appears to be coming from\
    \ this single address.\n\n+   10. Type the following line to **allow incoming\
    \ SSH connections**: \n+   \n+       iptables -A INPUT -p tcp -m state --state\
    \ \\n    NEW,ESTABLISHED -j ACCEPT --port 22\n\n+   11. Save the new firewall\
    \ rules permanently by typing this line: \n+   \n+       iptables-save > /etc/sysconfig/iptables\n\
    \n+   12. To ensure that the firewall runs automatically whenever the Internet\
    \ gateway is rebooted, enter this command: \n+   \n+       chkconfig --level 35\
    \ iptables on\n\n+   13. Reconnect your Internet gateway's external NIC to your\
    \ DSL or cable modem.\n\nWhen the steps are complete, your Internet gateway is\
    \ protected by a firewall. It also forwards network traffic from your private\
    \ network to the Internet. Your network is much safer with the firewall than without\
    \ it. Don't kick back just yet, however — you still have some security work to\
    \ do. Read Chapters 17 and 21 for more information about how to protect yourself."
  merge: -1
  img_proc: true
