  md: 'Ices2 starts streaming to the Icecast2 server the Ogg/Vorbis file you created.
    You can start listening to your private streaming server. We describe how to do
    just that in the following section.


    # # Putting It All Together: Streaming Music to Your Private Network


    You can use a multimedia player such as Rhythmbox to connect to and listen to
    an audio stream. The following steps describe how to do it (they assume you’re
    still logged in as Root):


    +   1. **Start your Icecast2 server:**

    +      `icecast -c /usr/local/etc/icecast.xml &`

    +   2. **Start the Ices2 server:**

    +      `ices /usr/local/etc/ices-playlist.xml &`

    +   3. **Start Rhythmbox or MPlayer to play the stream. For instance, use MPlayer
    as follows:**

    +      `mplayer http://127.0.0.1:8000/example.ogg`.


    That’s it! You hear whatever music you ripped from your music CD.


    > **TIP**

    > It’s common to restart Ices2 multiple times while trying to get it working.
    In that case, you may tie up the loopback port that Ices2 and Icecast2 use to
    communicate. In that case, you’ll see a warning in the `/var/log/ices/ices.log`
    file, saying that it can’t connect to port 127.0.0.1:8000. You can solve that
    problem by running the following command as root: `service network restart`.


    You have little to gain by using Icecast2 to serve up music streams locally on
    your PC. Using the CD player described in Chapter 12 is much easier. However,
    listening to your multimedia-streaming server is useful and interesting when it’s
    done across a network.


    # # Streaming on Your Private Network


    The preceding section describes how to broadcast music on and to the computer
    you’re sitting at. If you’ve created Jukebox, now’s the time to expand Jukebox
    into a private-network radio station.'
  merge: -1
  img_proc: true
- pgno: 305
  md: "These steps describe how to configure your Icecast2 server to broadcast over\
    \ your private network:\n\n+   1.  **Log in as root** and open the Gedit text\
    \ editor by clicking the GNOME Menu and choosing **Accessories**: Text Editor.\n\
    +   2.  In the Gedit window, choose **File**: Open.\n+   3.  Select /usr/local/etc/icecast.xml\
    \ and click **OK**.\n+   4.  Change the loopback address, 127.0.0.1, to the IP\
    \ address of your Icecast2 server.\n+   \n+   For example, if your server's IP\
    \ address is 192.168.1.1, modify the file as shown here; change the host name\
    \ as appropriate too:\n\n```\n<hostname>cancun</hostname>\n<!-- You can use these\
    \ two if you only want a\nsingle listener -->\n<port>8000</port>\n<bind-address>127.0.0.1</bind-address>\n\
    \n<!-- You may have multiple <listener> elements -->\n<listen-socket>\n  <port>8000</port>\n\
    \  <bind-address>192.168.1.1\n  </bind-address>\n</listen-socket>\n```\n\nNote\
    \ that the port number doesn't change.\n\n+   5.  Change the source password from\
    \ its default value. Otherwise, anyone who downloads the Icecast2 package can\
    \ determine your password:\n\n```\n<source-password>\n  givememusic\n</source-password>\n\
    ```\n\n+   6.  **Modify the e-mail and location information to match your network.**\n\
    +   This step gives any listeners an idea of who you are and where you're coming\
    \ from.\n\n```\n<location>Hi-Fi Paunchy</location>\n<admin>olgoz@paunchy.net</admin>\n\
    ```\n\n+   7.  **Save your changes** by clicking the Save button.\n+   8.  Open\
    \ the **Icecast2 configuration file** — /usr/local/etc/ices-playlist.xml — in\
    \ Gedit."
