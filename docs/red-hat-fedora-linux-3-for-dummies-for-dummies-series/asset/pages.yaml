- pgno: 58
  md: 'of selecting either the Install default software packages (the default) or
    the Customize software packages to be installed options.


    In this book, we use the default packages from the Workstation installation environment.


    If you select the Customize the software packages to be installed option, the
    Package Group Selection window opens. You can select additional packages to be
    installed individually or by group. For example, if you want to install the KDE
    environment, simply click the button next to the KDE Desktop Environment menu
    and all the necessary packages are then selected. Select individual packages by
    clicking the Select individual packages radio option. After you make your selection,
    click the Next button and proceed to Step 6.


    6. Click the Next button.


    The About to Install Window appears. A loud voice reverberates, announcing that
    this is The Point of No Return! Not exactly. No loud voice says anything, except
    in our heads (it''s so annoying), but this is the point of no return. If you click
    the Next button, your disk is reformatted in whatever way you selected in the
    preceding section — and Fedora Core is then installed. The following section describes
    how that process goes.


    ![](img/41feae212f5c6612ff709354891f7b39_58_0.png)


    # Introducing password etiquette


    To be effective and keep the operating system happy, your password must be at
    least six characters long — but you should use at least eight characters: The
    more characters you use, the harder the password is to break. If you''re concerned
    about security, we recommend that you use a combination of uppercase and lowercase
    letters, symbols, and numbers to make your password as difficult as possible to
    compromise. In addition, don''t choose anything you can find in a dictionary,
    or names or items that are easy to associate with you. In other words, your name,
    your name spelled backward, your birth- day, your dog''s name, or any word in
    any language (including the "unprintable" ones) are all poor choices. Beer, for
    example, is a poor selection for Jon''s password, even though it has both uppercase
    and lowercase letters, because Jon and beer are usually seen in close proximity
    to each other.


    A good way to come up with a good password is to select a phrase and garble it.
    For example, make "i am not a number" to something like iMNOTa#1! Even though
    the result doesn''t spell out the phrase in any real way, it gives you all the
    cues to remember the essentially random characters (Iam" = im, "not" = NOT, "a"
    = un, and number = #). Other common substitutions are @ for a, 3 for e, 9 for
    g, 1 for I, 0 for b, and 5 for s. For example: Those are common.


    If you record your password, store it where it won''t get lost and cannot be easily
    found or stolen. For example, save your work passwords at home or store them in
    a locked desk or safe. You can store passwords in a PDA (personal digital assistant)
    as long as you use the little gadget''s password-protection capability; you can
    also use encryption software to store passwords on PDAs. Do not, however, write
    your password on a sticky note and attach it to your computer monitor. (D''oh!)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '**GNOME** is the default Fedora Core graphical environment for Fedora Core
    3, and it’s what we use throughout this book. However, many people prefer the
    KDE environment. The choice is yours; you can use either environment or both,
    if you want. (If you install both GNOME and KDE on your computer, you can select
    one or the other as your desktop environment when you log in.) To install KDE,
    select the Customize software packages to be installed option, as described earlier,
    in Step 5. Click the check box next to the KDE package group and then click the
    **Next** button.


    # # Installation Stage 5: The Point of No Return


    The installation process described so far in this chapter hasn’t yet resulted
    in making any permanent changes to your computer. Your selections haven’t been
    written in stone, so to speak. Nothing has been erased. No Fedora Core packages
    have been written to your hard drive, either. You can stop the installation process
    and go back to your good old computer by clicking the Back button.


    Make your decision whether to proceed. Then, if the answer is yes, take a deep
    breath and follow these instructions to install Fedora Core on your computer:


    +   1. Click the **Next** button in the **About to Install** window.

    +   The Required Install Media dialog box opens. (If you’re using CD-ROM discs,
    you’re told which discs you need.)

    +   You can click the Reboot button if you want to abort the installation process.
    In that case, no changes will be made to your computer.

    +   2. After you hold your breath for a second (don’t turn blue!) and then decide
    to take the plunge, click the **Continue** button.

    +   Your disk partitions are created and formatted, and then the Fedora Core distribution
    is written to them. The Installing Packages window (see Figure 3-3) tells you
    which package is being installed in addition to how many have been installed,
    how many remain to be installed, and the estimated time remaining.

    +   3. **(Optional)** **If you’re using CD-ROMs, insert the second or third discs
    when prompted and click the Yes button.**

    +   A congratulations window opens.

    +   The installation process takes only a few minutes if you have the latest,
    greatest high-speed computer with a fast DVD or CD-ROM drive. Otherwise plan to
    spend 20 minutes — or longer — when you’re using older equipment.'
  merge: -1
  img_proc: true
