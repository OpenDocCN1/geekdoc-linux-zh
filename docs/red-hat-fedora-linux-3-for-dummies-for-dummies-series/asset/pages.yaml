    +      This user will be run the icecast server, but will not function as a login\
    \ account because we don't set a password.\n\n+   2. Change to the /usr/local/etc\
    \ directory.\n\n+   3. Open the Icecast2 configuration file, like this:\n+   \
    \   \n+      ```\n+      gedit icecast.xml\n+      ```\n+      \n+      Now, you\
    \ have to make some minor modifications to the configuration file to set up your\
    \ simple streaming server.\n\n+   4. Find the part of the configuration file that\
    \ defines the port number and bind address — 127.0.0.1. Remove the comments from\
    \ those parameters.\n+      \n+      Comments encapsulate the configuration parameters\
    \ with these character strings: <! -- and -->.\n\n+   5. Remove the comments and\
    \ the code should look like this:\n+      \n+      ```xml\n+      <!-- You can\
    \ use these two if you only want a single listener -->\n+      <port>8000</port>\n\
    +      <bind-address>127.0.0.1</bind-address>\n+      ```\n+      \n+      These\
    \ parameters tell the Icecast2 server which port number and IP address to listen\
    \ to. They also define the master server as the same machine.\n\n+   6. Find the\
    \ Master Server section of the configuration and remove the comments. The configuration\
    \ should look like this:\n+      \n+      ```xml\n+      <master-server>127.0.0.1</master-server>\n\
    +      <master-server-port>8001</master-server-port>\n+      <master-update-interval>120</master-update-interval>\n\
    +      <master-password>hackme</master-password>\n+      ```\n\n+   7. Find the\
