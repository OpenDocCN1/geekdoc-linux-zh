    \ distribution on CD-ROMS by mailing in the coupon in the back of this book. You\
    \ can also download directly, and for free, from fedora.redhat.com/download if\
    \ you have a broad-band connection or a dial-up and a lot of patience.\n\n![](img/41feae212f5c6612ff709354891f7b39_46_0.png)"
