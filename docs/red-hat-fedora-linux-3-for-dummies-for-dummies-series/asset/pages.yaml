- pgno: 209
  md: '# In this part . . .


    In the great tradition of slackers and procrastinators, we have put off the real
    work as long as possible. In this part, you find out how to make a server out
    of your Fedora Core computer. These chapters don''t instantly turn you into a
    Linux guru capable of commanding six-figure consulting fees, but they do introduce
    you to the technical side of Linux.


    We start by describing in Chapter 15 how to build a simple local-area network
    (LAN). Building a LAN isn''t as difficult as it first sounds. You connect your
    computers, configure them to recognize each other, create an Internet gateway
    or firewall, and (with any luck) you''re off and running.


    Chapter 16 shows you how to use your Fedora Core computer as a network server
    on your newly created network; you can also provide services to the Internet.


    We get serious in Chapter 17 and describe how to start securing your Fedora Core
    servers and private network. You should consider this chapter an introduction
    to security and plan on learning more.


    If (okay, when) you need to troubleshoot Fedora Core, check out Chapter 18. It
    provides some detailed help in fixing computer problems, with a special focus
    on networking. When you''re done with this part, you will be wearing pocket protectors
    with the best of us!


    Chapter 19 returns from the serious world of computer security to have some fun.
    The chapter describes how to run a streaming audio service. (Yes, you can run
    your own private-network radio station online.)'
  merge: -1
