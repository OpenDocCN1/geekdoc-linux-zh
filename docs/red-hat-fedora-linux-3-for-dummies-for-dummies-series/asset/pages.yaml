- pgno: 144
  md: '# Chapter 10


    # # Gnowing More Applications


    # **In This Chapter**


    +   - Introducing Nautilus, the GNOME file manager

    +   - Introducing Fedora Core/GNOME Applications


    Many applications help make your Fedora Core computer useful. In this chapter,
    you find out how to use Nautilus, one of the central GNOME applications. Nautilus
    manages files and other objects. We also introduce all of the Linux and GNOME
    applications that are installed by default.


    # ## Navigating with Nautilus File and Internet Integration Manager


    Being the boss doesn’t necessarily make you a bad person. Does it? It’s just a
    job. Right? Well, that little GNOME guy is a good worker, doesn’t get paid much,
    and likes to get bossed around. Just press a key here and click a button there,
    and you can boss him around like any worthy pointy-headed *Dilbert* manager. GNOME
    even comes with its own file and integration manager that saves you work and makes
    time for those long lunches.


    *Nautilus* is the graphical navigation system that GNOME uses to get you around
    your files and your network. Nautilus follows in the tradition of all good file
    managers, by showing you a display of the files and directories on your computer.
    You can copy, move, delete, and execute files by pointing and clicking — and it’s
    a snap (okay, a click) to create directories and view file details. Nautilus even
    goes a step further: You can use it to configure your GNOME desktop. And that’s
    not all! Nautilus can also navigate the Internet, access multimedia applications,
    and slice and dice! Not a bad deal, considering that it works for free.'
  merge: -1
  img_proc: true
- pgno: 145
  md: "# **Waking up Nautilus**\n\nFedora Core installs a GNOME Desktop Nautilus icon\
