  md: '![](img/41feae212f5c6612ff709354891f7b39_196_0.png)


    ```

    wine notepad.exe

    ```


    Running Wine for the first time creates a .wine directory in your home directory.
    The .wine directory contains all the configuration information that the Wine system
    needs in order to run. The configuration information is in the config file. Several
    additional files, all with the .reg suffix, mimic the Windows Registry. The Windows
    operating system uses the Registry to organize its configuration parameters; Linux
    on the other hand, uses separate files, such as those in the /etc/etcsysconfig,
    and /usr/local/etc directories, to hold its configuration information.


    +   4. You can use Notepad to create, modify, and save text files.

    +   5. Click File◆Exit in Notepad to exit.


    # Having Fun: Playing games


    Now, text editing is great — but when you’ve been there and done that, you can
    move on to a more complex application and investigate Wine’s true power. Wine
    is good at running programs that are not yet available in Linux form (a seriously
    handy capability). In this section, we download and install a Windows-based shareware
    game.


    ![](img/41feae212f5c6612ff709354891f7b39_196_1.png)


    Shareware is software that the developer lets you test for free; sometimes the
    software is usable for a limited period. If you like the program, you can — and
    should — send the programmer a small fee.


    ## Wine utilities


    Wine provides several useful utilities that help you configure and test it, and
    we describe some of them here.


    **wineboot:** Simulates the rebooting of a Windows computer. Rebooting is necessary
    whenever you’re installing numerous Windows applications (for example, Microsoft
    Word), and this utility provides that function.


    **winedbg:** Debugs Wine applications. This utility shows what’s going on under
    the surface, so to speak. You need to use this utility only if you’re developing
    a Wine application.


    **winexcfg:** Helps set many Wine configuration options.


    **clock:** Duplicates the simple Windows clock.


    **regedit:** Duplicates the Registry editor.


    **progman:** Functions as a program manager.


    You can try running one of the Wine utilities. For example, test the *winfile*
    utility, which acts as a file manager.'
