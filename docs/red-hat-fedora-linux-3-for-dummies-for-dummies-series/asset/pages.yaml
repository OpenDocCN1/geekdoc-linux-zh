- pgno: 306
  md: '# Understanding URLs


    Have you ever wondered what the various parts of a URL mean? Using a URL such
    as `///localhost:8000/track1.ogg` to access a streaming-audio server, we thought
    that we should dissect what the various parts mean and do. This list describes
    the function of each URL element:


    +   - **Protocol**: Icecast2 uses HyperText Transport Protocol, or HTTP, packets
    to encapsulate audio streams. HTTP is a good choice because it''s easy to configure
    your firewalls to allow HTTP connections.

    +   - **Address**: The Icecast2 server''s IP address can be either a domain name
    or in numeric


    form. For example, you could replace `localhost` with its numeric address, 127.0.0.1.


    +   - **Port**: Icecast2 lists connection requests on a TCP port and uses port
    8000 by default. You can easily change the port by modifying the Icecast2 configuration
    file.

    +   - **MountPoint**: This component specifies the Icecast2 stream to connect
    to. Icecast2 is capable of playing two streams. In this example, you use the content
    file `track1.ogg`, which you can create by following the steps in the preceding
    section.


    +   9. Modify the file so Ices2 contacts the Icecast2 server:


    ```

    `<hostname>veracruz</hostname>\n<port>8000</port>\n<password>g1vememusic</password>\n<mount>/example1.ogg</mount>`

    ```


    +   10. Save your changes and close the Gedit window.


    You can run the following two steps from the Fedora Core computer running Icecast2/Ices2
    or any Linux computer on your private network.


    You can easily expand your music selection by adding tracks to your playlist.
    For example, if you have a few tracks in another location, just add a line for
    each one in `/usr/local/etc/ices-playlist.xml`.


    ![](img/41feae212f5c6612ff709354891f7b39_306_0.png)


    +   11. Open a GNOME Terminal window and start the server (after stopping any
    old versions):


    ```

    `killall -9 icecast ices\nices -c /usr/local/etc/icecast.xml &\nices /usr/local/etc/ices-playlist.xml
    &`

    ```


    +   12. Enter this command to start Rhythmbox and connect to the newly configured
    Icecast2 stream:


    ```

    `rhythmbox http://192.168.1.1:8000/example1.ogg`

    ```


    You can also use MPlayer to listen to the stream, if you want:


    ```

    `player http://192.168.1.1:8000/example1.ogg`

    ```'
  merge: -1
  img_proc: true
