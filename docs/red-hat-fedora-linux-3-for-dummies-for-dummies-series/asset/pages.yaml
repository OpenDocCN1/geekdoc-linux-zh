- pgno: 294
  md: '# Chapter 19


    # Building a Streaming Audio Server


    +   In This Chapter

    +     * Introducing Ices2 and Icecast2 streaming audio servers

    +     * Creating a music source

    +     * Installing and configuring Ices2 and Icecast2

    +     * Streaming audio to your private network


    All work and no play makes Linux a dull boy. So forget the workaday world of word
    processors and network services for a while and have some fun. This chapter describes
    how to configure your Fedora Core computer as an audio-streaming server for your
    private network.


    We show you in Chapter 12 how to use Linux applications, such as MPlayer, and
    to listen to Internet audio streams. In this chapter, we switch sides and show
    you how to serve up these types of streams. It’s pretty cool when you think about
    it; you can carry your laptop computer around your home and listen to your music.


    # Introducing Ices2 and Icecast2


    Once again, the open-source movement fills the bill with Ices2 and Icecast2. Ices2
    and Icecast2 are designed to serve up audio streams.


    You’re most likely to know how audio streaming works from the user’s perspective.
    Chapter 12, for instance, shows how to use Rhythmbox and MPlayer to listen to
    Internet audio streams. However, most of us aren’t familiar with how multimedia
    streams (audio, video, and slide shows) are created. To create networked audio
    streams, you feed content such as a music track from a CD to the multimedia server
    Ices2. Ices2 converts the audio stream to Ogg format and feeds it to Icecast2.
    (Shoutcast and RealServer, which are commercial servers, operate in a manner similar
    to Icecast2.) Ices2 in turn streams the content to a private network or the Internet.
    You then use a multimedia client such as Rhythmbox to listen to the audio stream.'
  merge: -1
  img_proc: true
- pgno: 295
  md: 'Be careful where you get the audio content. You must abide by copyright law.
    Of course you''re free to broadcast content that you create or for which you obtain
    permission to use on the Internet. You can also use music that you purchase for
    your own. That''s why we describe how to create a private network streaming system.
    The system that we create is just a glorified cd player.


    ![](img/41feae212f5c6612ff709354891f7b39_295_0.png)


    The original Icecast worked with MP3 streams. Icecast is still available, but
    is no longer being developed or supported. Because of possible copyright problems,
    Icecast has essentially been abandoned in favor of Icecast2, which works with
    the open-source Ogg/Vorbis format.


    This list provides more detail on each component in the system:


    +   - **Multimedia client:** The client connects to the multimedia server and
    plays the feed. For example, you use Rhythmbox to connect to Icecast2.


    +   - **Multimedia server:** The server is responsible for accepting requests
    from a client and then streaming multimedia information to the client. The server
    also converts the original multimedia content into Internet Protocol (IP) packets
    in order to route it across a private network or the Internet.


    +   - **Multimedia content:** Your multimedia server isn''t very useful without
    a content source. Your source may be a music CD or a DJ \u2014 you, for example.
    Sources are either fixed or dynamic. For example, a music CD is a fixed source.
    The Ice2 application reads from a fixed source and feeds it to Icecast2.


    # ## Creating a Music Source


    Before you create your server, you have to create something to play. This section
    describes how to create an Ogg/Vorbis file to play. We assume that you want to
    create a file from a commercial music CD. This practice is legal, and does not
    violate copyright law because you don''t create a server that is broadcast on
    the Internet. Instead, you''re creating a server that is broadcast to a private
    network (yours). As far as we know, you''re still allowed to listen to your own
    CDs.


    ![](img/41feae212f5c6612ff709354891f7b39_295_1.png)


    The Ogg/Vorbis audio formatting system is similar in function to MP3. However,
    Ogg/Vorbis (or just Ogg) is an open-source format (also known as a codec) and
    \u2014 unlike MP3, doesn''t use any proprietary algorithms or protocols. Ogg also
    provides higher fidelity than other formats. Ogg/Vorbis is really two separate
    entities: Ogg is an audio compression format, and Vorbis is an encoding system.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'Use the following steps to create an Ogg-Vorbis-formatted music file:


    +   1.  **Log in as the Root user and insert an audio CD.**

    +   2.  **Click the GNOME Menu button and choose Sound & Video -> Sound Juicer
    CD Ripper.**

    +   3.  **Click the Extract button in the swimdow.**

    +       - A progress dialog box opens. Sound Juicer extracts the music from the
    CD to files on your computer. The files are stored in a subdirectory named after
    the album title, which itself is stored in a subdirectory with the name of the
    artist. For example, if the artist is Norah Jones and the album is *Come Away
    with Me*, the music tracks live in the directory `Norah Jones/Come Away with Me`
    (in your home directory).

    +   4.  **When the music is extracted an Information dialog box opens and you
    can click the Close button.**

    +       - Ices2 and Icecast2 use what’s called a Playlist to determine what media
    to stream. The following steps show how to create a simple playlist from the music
    you just extracted.

    +   5.  **Copy the first Ogg file you just created to the /tmp directory and rename
    as example1.ogg.**

    +       - We’re copying to the /tmp directory and renaming, just to keep the configuration
    files as simple as possible. Here’s what looks like:

    +       - ```

    +         cp 01*ogg  /tmp/example1.ogg

    +         ```

    +   6.  **Create the playlist.txt file that points to the Ogg music file, like
    this:**

    +       - ```

    +         echo "/tmp/example1.ogg" > /usr/local/etc/playlist.txt

    +         ```


    Your simple Playlist is now created and ready to be played.


    ![](img/41feae212f5c6612ff709354891f7b39_296_0.png)


    You can convert from Wave to Ogg format by running this command in a terminal
    emulator: `oggenc *.wav`. You can play Ogg-encoded files: `ogg123 xyz.wav`.


    You now have one or more Ogg-Vorbis-formatted audio files. You have to install
    and configure Icecast2 and Ices2 to broadcast music to yourself.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# ## Installing Ices2 and Icecast2


    In this section, we break from our self-imposed rule of using only pre-compiled
    software in package form. First, even though icecast2 comes packaged in RPM format,
    it requires a library package not included with Fedora Core 3. Second, ices2 does
    not come in package form yet. Third, we need to install a library that’s also
    not yet packaged. We’ll show how to download and build Libshout, ices2 and icecast2
    from source code.


    ![](img/41feae212f5c6612ff709354891f7b39_297_0.png)


    Compiling code like ices2 and icecast2 is the reason we recommended installing
    the Workstation class of Fedora Core in Chapter 3. Using the Workstation class
    installs the compilers and associated utilities needed to compile from source
    code.


    In the Linux world, building from source code requires that you follow these general
    steps:


    +   1. **Configure**. The first step requires configuring the software. The configuration
    process builds dependency files. Several Linux systems that do this are available.
    Icecast2 and ices2 use a configure script.

    +   2. **Compile**. After the software is configured, you have to compile it.
    *Compiling* is a universal computer process that changes source code into executable
    code. Source code is readable by human beings — well, at least the class of humans
    known as nerds. Compiling source code changes it into a form that computers can
    understand. All applications are compiled from source code.

    +   3. **Install**. After the result is compiled, it must be installed. Linux
    uses default directories such as /usr/bin, /usr/sbin, /usr/local/bin, and /usr/local/sbin
    to store executable files (applications and services). Most software systems need
    to be placed in these types of locations to work correctly.


    # ## Downloading Libshout, Icecast2 and Ices2


    Before you can build your streaming-audio server, you have to get the icecast2
    and ices2 software plus the Libshout library. This section describes how to download
    the software.


    ![](img/41feae212f5c6612ff709354891f7b39_297_1.png)


    By now, you know that Linux uses many names and acronyms, many of which are cryptic
    at best. So you probably didn’t raise an eyebrow when you encountered the name
    Ogg/Vorbis, icecast2, or xiph.org. Ogg/Vorbis is a science-fiction character that
    its developers like. Icecast2 is a variation on the name *Shoutcast*, and Xiph
    is short for *Xiphophorus hellerii*, a small swordtail fish that’s popular in
    small aquariums.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'These steps help you prepare your Fedora Core computer to start building the
    multimedia server:


    +   1. Log in to your computer as any user.


    +   2. Open Mozilla, go to www.icecast.org, and click the Download link at the
    top of the page.


    Now you have to download the icecast2 and ices2 software from the Internet.


    +   3. Click the icecast-2.0.2.tar.gz link.


    A dialog box labeled Opening icecast-2.0.2.tar.gz opens.


    +   4. Click the Save it to disk option and then click the OK button.


    A dialog box labeled Enter name of file to save to... opens.


    +   5. Click the Save button.


    The file is downloaded to your computer.


    +   6. Back in your browser, scroll down the page and click the libshout-2.0.tar.gz
    link.


    The Enter name of file to save to... dialog opens.


    +   7. Click the Save button and the libshout archive file is downloaded to your
    computer.


    +   8. Once again, back in the www.icecast.org Web page, click the Ices link at
    the top, right of the page.


    The Ices download page opens. Now it''s time to download the ices2 source code.


    +   9. Click the ices-2.0.0.tar.gz link.


    A dialog box labeled Enter name of file to save to... opens.


    +   10. Click the Save button.


    The ices2 file is downloaded into your current directory.


    Note that in this section, we break our unstated rule of installing only pre-compiled
    software from RPM packages. Although Icecast2 is available in RPM format, ices2
    is not. We could use the Icecast2 package, but it requires a library (software
    that''s shared between many programs) that''s difficult to find. Therefore, compiling
    Icecast2 and Ices2 from scratch turns out to be easier. (It''s also fun to know
    how we nerds spend our Saturday nights!)


    Before installing Icecast2 and Ices2, we have to install the libshout libraries:


    +   1. Open a terminal window by clicking the GNOME Menu and choosing System Tools::
    Terminal.


    These instructions assume that you''re working from your home directory.'
  merge: -1
