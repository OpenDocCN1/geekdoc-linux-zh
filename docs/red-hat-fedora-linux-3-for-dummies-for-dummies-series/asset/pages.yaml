  md: '# # Chapter 6

    ## Broadband Rocks!


    ### In This Chapter


    +   ☞ Understanding broadband Internet connections

    +   ☞ Using a cable modem connection

    +   ☞ Using a DSL modem connection


    ![](img/41feae212f5c6612ff709354891f7b39_88_0.png)


    ou’re probably familiar with the ubiquitous dial-up Internet connection: You log
    on to the Internet, hear that sreeching modem sound and — Presto! Whammo! — you’re
    online. If you’re lucky, the entire dial-up process takes less than a minute,
    but it can take longer. And then there are those Web pages that take so-o-o lo-o-o-o-ong
    to finish downloading. There is a better way to get connected — it’s called *broadband*,
    a generic term for high-speed connections via cable TV and digital subscriber
    lines (DSL). Cable connections are provided by cable television companies, and
    DSL by your telephone company. Both are much faster than dial-up connections,
    and both have their advantages and disadvantages.


    ![](img/41feae212f5c6612ff709354891f7b39_88_1.png)


    The *broad* in broadband means that wires and cables that connect a modem to the
    Internet have a wide *bandwidth*; they can handle more data at faster speeds and
    with greater reliability. Plain old telephone service (POTS) was created for transferring
    analog voice data. Needless to say, POTS just doesn’t do as well as broadband
    when it comes to the Internet.


    The two most popular broadband types are cable modems and DSL. Cable modems connect
    through your cable television lines while DSLs use POTS lines. Broadband connections
    work from roughly 100 kilobits per second (Kbps) to several million bits per second
    (Mbps). A *kilobit* is a thousand bits per second; a *megabit* is a million bits
    per second. That’s enough speed to transfer graphics-rich Web pages in a few seconds;
    it’s also enough to listen to several audio streams or to watch a low-resolution
    video stream.


    ![](img/41feae212f5c6612ff709354891f7b39_88_2.png)


    We’re on the verge of wireless broadband. The idea is to connect directly to an
    ISP without wires or cables of any kind. Some companies (such as Starbucks®) already
    offer such service on the small scale. On the larger scale, towns such as Rio
    Rancho, NM are about to become their own ISP. In the future, ISPs will offer wireless
    coverage similar to wireless telephone service. Stay tuned.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "If you're ready to make the switch to a DSL or cable Internet connection, believe\
    \ us when we tell you that you'll never want to go back to a dial-up modem. This\
    \ chapter describes how to obtain and configure a broadband connection.\n\n![](img/41feae212f5c6612ff709354891f7b39_89_0.png)\n\
    \nWe recommend avoiding ISDN (Integrated Services Digital Network), satellite,\
    \ and mental-telepathy-based broadband Internet connections. ISDN technology is\
    \ old, and cable and DSL are better. Satellite Internet connections, just now\
    \ being introduced, suffer from intrinsic problems such as transmission delays\
    \ (latency) that wreak havoc on your communications; unfortunately, you can't\
    \ upgrade to the speed of light. Some people say that mental telepathy (MT) works\
    \ great, but we've found it scrambles our data.\n\n# # DSL and Cable Connections:\
    \ The Difference Is the Wiring\n\nAlthough the voice-based telephone network is\
    \ now modern in many ways, its underpinnings haven't fundamentally changed over\
    \ the last century. The telephone network consists of pairs of copper wires, twisted\
    \ into cables that connect homes and businesses to a telephone company's central\
    \ offices (CO). The phone company uses switches in its COs to connect you to your\
    \ destination when you make a call. The switches are designed to limit the range\
    \ of frequencies (called *bandwidth* that a phone call can use. The bandwidth\
    \ is enough to recognize a voice, but not much more. Those limits prevent today's\
    \ analog modems from pushing more than approximately 56,000 bits per second, or\
    \ 56 Kbps, through the telephone network. (That 56 Kbps speed varies, mostly downward,\
    \ depending on the condition of the copper wires you're connected to.)\n\nTwo\
    \ of the most commonly used broadband systems are\n\n+   - **Digital subscriber\
    \ lines (DSL):** DSL is designed to avoid the restrictions of the traditional\
    \ telephone system by circumventing the low-speed voice switches at the Central\
    \ Office (CO). DSL uses the existing telephone wires, which connect your home\
    \ to the nearest CO, to carry your Internet communication. After you're connected\
    \ to the CO, however, your Internet communication is routed through a high-speed\
    \ digital switch rather than through the voice equipment. By avoiding the voice\
    \ equipment, you can achieve many times the speed of a dial-up modem.\n+   \n\
    +     The main limitation of DSL is that traditional copper wire can carry a high-speed\
    \ connection for only a few miles. Your telephone company can tell you whether\
    \ it can provide you with DSL service."
  merge: -1
  img_proc: true
- pgno: 90
  md: "Cable television networks: Although Cable television (CATV) companies don’t\
    \ provide service to as many residences and businesses as the telephone companies\
    \ do, their networks are not limited by historical constraints and are generally\
    \ much faster than DSL. CATV networks also don’t have the 3- to 4-mile limits\
    \ that DSL has. Typically, you can get an Internet connection through your CATV\
    \ company if the company offers it — and only if the company serves your neighborhood.\n\
    \n# The Cable-Modem Option\n\nCable television companies have invested lots of\
    \ capital to upgrade their networks in order to gain Internet market share. Their\
    \ effort has paid off for consumers, and many places in the United States now\
    \ have access to high-speed Internet connections at fairly reasonable prices.\n\
    \nHowever, you have to consider some downsides:\n\n+   - Unfortunately, not all\
    \ cable companies have caught up with 21st-century technology. Some CATV companies\
    \ provide TV service but no Internet connections.\n+   - Many people don’t live\
    \ in areas served by cable TV. Internet cable is also not a good medium for providing\
    \ services such as Web page hosting.\n+   - Your cable company may require you\
    \ to connect to its ISPs (or use an independent ISP that it approves of). Many\
    \ people like to use an independent ISP because they’re familiar with it or it\
    \ provides better service. Using your own ISP also makes it easier to set up your\
    \ computer (or network) to provide services going out to the Internet. Cable companies\
    \ cannot prevent you from using a different local ISP, but they don’t charge you\
    \ less — so you end up paying for two services, one of which you’re not using.\n\
    +   - Relatively few cable companies directly support Linux. You may get a connection,\
    \ but you’re on your own if you need to troubleshoot problems, even problems that\
    \ have nothing to do with Fedora Core but still affect your machine.\n\nIf you\
    \ decide that cable access is the right choice for your Internet access needs,\
    \ here’s an overview of the process for connecting your Fedora Core computer to\
    \ the Internet via a cable modem:\n\n+   1. **Do some research and subscribe to\
    \ an ICP service.**\n+   \n+      Locate an Internet cable provider (ICP) — usually\
    \ that means your existing cable TV company — and subscribe to its ICP service."
  merge: -1
  img_proc: true
- pgno: 91
  md: "+   2. **Make a hardware commitment.**\n+   \n+   Obtain an Internet cable\
    \ modem through your ICP. Many ICPs provide cable modems as part of their service.\
    \ Otherwise you can purchase a modem from the ICP or a consumer-electronics store.\n\
    \n+   3. **Get registered.**\n+   \n+   Register the cable modem with your ICP.\
    \ You do have to register your modem with your ICP.\n+   \n+   You register your\
    \ modem by giving your ICP the modem's Media Access Control (MAC) address. The\
    \ ICP generates an IP address by using the MAC address as its reference. You don't\
    \ need to do anything to your cable modem. Your ICP does the registration process\
    \ and automatically assigns your modem an IP address. You're ready to use your\
    \ Internet cable modem to connect to the Internet. Woo-hoo! Blazing speed is yours\
    \ now!\n\n+   4. **Set up the cable modem.**\n+   \n+   Cable modems have two\
    \ connectors: a 75-ohm coaxial port and a twisted-pair (RJ-45) connector (the\
    \ coaxial connector is the same type that's used for cable TV; the RJ-45 connector\
    \ looks like a large telephone plug):\n+   \n+   *   Connect a coaxial cable from\
    \ the cable modem's coaxial port to the cable jack on your wall, just like you\
    \ would do with a TV set.\n+   *   Connect a network cable from the RJ-45 modem\
    \ port to your Fedora Core computer. Normal network cables (referred to as Category\
    \ 5 cables) may not work, depending on how the modem uses a single Ethernet connector\
    \ rather than multiple Ethernet ports that are part of a switch. If yours uses\
    \ the former, you need to use a *crossover* cable if you want to directly connect\
    \ a computer to a cable modem. You can use normal Category 5 cables if the cable\
    \ modem incorporates a network switch or if you connect the modem through a separate\
    \ Ethernet hub or switch.\n\n+   5. **Set up your Internet protocols.**\n+   \n\
    +   Configure your computer to use DHCP on the network interface that connects\
    \ to the modem. Restart your computer's network interface, and you should be good\
    \ to go.\n+   \n+   The following sections take you through the process of finding\
    \ a cable provider and setting up your access.\n\n# ## *Finding an Internet cable\
    \ provider*\n\nFinding an *Internet cable provider* (ICP) is as simple as calling\
    \ your cable television company. Not all cable TV systems carry Internet traffic,\
    \ but many do."
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Locating a cable television company that provides broadband Internet connections
    is, unfortunately, quite easy. It’s unfortunate because little competition exists
    within the cable industry. Federal law effectively restricts competition within
    municipalities and creates the environment for monopoly-like companies. The result,
    of course, is that prices remain higher than necessary. Oh, well, at least many
    cable companies are offering Internet connections.


    Your ICP is your default Internet service provider (ISP). Most cable companies
    give you one or more e-mail addresses. However, cable companies don’t generally
    provide login accounts (as other ISPs do).


    Login accounts are used for launching applications and storing information. They
    aren’t essential, but they’re useful. Of course, nothing stops you from maintaining
    a regular ISP and using its login account. You then have a high-speed Internet
    connection you can use to log in to any account you have.


    We don’t run you through the process of signing up for cable Internet service
    because it varies from ICP to ICP. In any case, the process should be simple enough.
    A good portion of the sign-up process involves waiting on hold and listening to
    Muzak. One suggestion, though: Make sure that you have pertinent information about
    your system and that the cable company knows you’re using Linux.


    # Dealing with the hardware


    One great thing about Internet cable is that you can buy the cable modems from
    your local electronics store or an Internet store. (By way of comparison, you
    generally have to lease or purchase DSL equipment through the DSL provider.) Cable
    modems are generally priced the same whether you purchase through your provider,
    the Internet, or a bricks-and-mortar store. (Cable companies sometimes run promotions
    where they return by rebate most, if not all, of the price of the modem.) But
    the convenience of running to a local store is significant, especially if your
    cable modem breaks on a Saturday night and you just *have* to download the latest
    game patch.


    Before you purchase a cable modem, make sure that you


    +   - Ask whether you have to buy your modem through the cable provider. If not,
    you can shop around for the best price.

    +   - Make sure that the modem you buy is compatible with your service provider.
    The cable industry is converging on using the Data Over Cable Service Interface
    Specification (DOCSIS) as its Internet hookup standard. DOCSIS modems are quite
    easy to configure, so keep your fingers crossed that your service provider uses
    them.


    In the unlikely event that your provider doesn’t use DOCSIS, you’ll probably have
    to obtain your modem through your provider.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# TECHNICAL STUFF


    # How cable modems work


    Modern cable modems do more than just transmit and receive Internet Protocol (IP)
    packets. Yes, they do the basic modem job — transmit and receive IP packets by
    modulating and demodulating electrical signals across the cable TV wires (thus
    the name modem, from modulate/demodulate). But cable modems now use the industry-standard
    Data Over Cable Service


    Interface Specification (DOCSIS) protocol to deliver electrical signals across
    the cable network. Those signals carry the actual bits and bytes that make up
    network packets. A good analogy is an AM or FM radio. The DOCSIS-based signals
    transmit bits and bytes just like radio waves transmit speech or music.


    The instructions we provide later in this chapter are designed for DOCSIS modems.


    Setting up your cable modem is usually a straightforward process. DOCSIS cable
    modems act as network bridges. A network bridge simply transfers your network
    packets from one side to the other, and vice versa. One side of the bridge connects
    to the cable TV company. The other side connects to your computer through your
    Ethernet NIC through a Category-5 crossover cable; you can also connect through
    a network switch or hub (LAN). If your modem is the bridge type — most cable ISPs
    in the United States use that system — then it doesn''t require any configuration.


    # Setting up Internet protocols


    You don''t have to configure your DOCSIS cable modem for it to work. What you
    do need to do, however, is register your modem''s Ethernet address with your ICP
    and tell your Fedora Core computer how to connect to the modem. Cable modems typically
    connect to your computer via an Ethernet network interface. Therefore, you need
    to connect the cable modem to your computer using an Ethernet-based network.


    You need to configure your Fedora Core computer''s Ethernet adapter using the
    Dynamic Host Configuration Protocol (DHCP); you need an Ethernet adapter, of course,
    installed on your computer. Your cable modem sets the IP address of your Ethernet
    NIC by using DHCP. These instructions show you how to do that:


    +   1. Log in to your computer.

    +   2. Click the GNOME Menu button and choose System Settings Network.

    +   3. Enter the root password if you''re prompted, and then click OK.'
  merge: -1
  img_proc: true
