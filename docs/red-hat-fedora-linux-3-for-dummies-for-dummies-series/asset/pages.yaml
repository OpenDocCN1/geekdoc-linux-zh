- pgno: 141
  md: '# ## Configuring GNOME MIME Types


    You can modify the look and feel of your desktop by using an assortment of GNOME
    configuration utilities. Double-click the Start Here icon on the desktop. When
    the window opens, double-click the Preferences icon. (You can access the same
    functions by clicking the GNOME Menu button and then opening the Preferences menu.
    A submenu opens, showing the same options as in the Preferences window.)


    The following example shows how to associate the Ogg MIME type with the Rhythmbox
    player:


    +   1.  Double-click the File types and programs icon in the Preferences window.

    +       The File Types and Programs dialog box is displayed.

    +   2.  Choose Audio->OGG audio and click the Edit button.

    +       The Edit file type window opens. The Edit File Type window shows that
    Ogg audio files belong to the application/x-ogg MIME type. The window also shows
    that Ogg audio files use .ogg file suffixes.

    +   3.  Click the Default action pull-down menu and choose Music Player.

    +   4.  Click the OK button and Rhythmbox ready to play Ogg files.


    The Preferences window also lets you configure items other than screen savers
    with maniacal rantings. We leave it to you to explore the wonderful world of setting
    your keyboard bell and other items.


    # ## Goodnight GNOME


    You have two options if you don’t want to turn your computer off but don’t want
    to leave it open to anyone just walking by: locking the GNOME Desktop and logging
    out.


    The following sections describe the processes.


    # ### Locking your computer


    Locking your screen is one of the best security features you can use. To lock
    your screen, click the GNOME Menu button and choose Lock Screen. Your'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'screen locks up and you must enter your password to get back in. Locking your
    screen is a good idea when you''re going to be away from it for even a minute
    or two.


    You can also configure GNOME to automatically lock your screen after a set time
    delay. This is useful if you''re using your Fedora Core computer in a work environment.
    Setting the screen lock ensures that you won''t leave your computer open indefinitely.
    Use the following instructions to set your screen lock:


    +   1. Click the GNOME Menu and select Preferences::Screensaver.

    +   The Screensaver Preferences window opens.


    +   2. Click the Lock Screen After button.


    +   3. Click the up or down arrows to select the time after which the screen lock
    takes affect.

    +   A setting of ten to fifteen minutes is a good compromise.


    +   4. Click the Close button.


    # # Going home for the night


    After you have finished for the day and want to go home (or just upstairs), you
    need to log out. Click the GNOME Menu button and choose *Log Out*. A dialog box
    labeled *Are you sure you want to log out?* opens. Click the OK button and — you
    guessed it — you log out. You also have the options to shut down or reboot your
    computer.


    GNOME configures a random screensaver by default. You can select a single screen
    saver as follows:


    +   1. Click the GNOME Menu button and choosing Preferences::Screensaver.

    +   The Screensaver Preferences window opens.


    +   2. Click the Mode: pull-down menu and select *Only One Screen Saver*.


    +   3. Scroll up and down until you find a screensaver you like.

    +   For example, you can switch from the default random screensaver to the Xjack
    screensaver (because all work and no play makes Xjack a dull Xboy). It''s not
    a bad selection for those long winters spent at peaceful resorts with plenty of
    time to write Linux books!


    +   4. Click the Close button.'
  merge: -1
  img_proc: true
