- pgno: 154
  md: '# ## Chapter 11


    # # Surf in’ the Net and Using E-Mail


    # ### In This Chapter


    +   * Brushing up on Web history

    +   * Using Mozilla to surf the Web

    +   * Getting extra help from plug-ins

    +   * Keeping your passwords safe

    +   * Getting your e-mail with Evolution


    In this chapter, we introduce the open-source Mozilla Web browser and Evolution
    e-mail client. Mozilla provides all the capabilities of other popular browsers.
    We show you how to set up Mozilla for your Fedora Core computer so you can surf
    the Net. You can use your computer as a multimedia device. After you start working
    with Mozilla, we describe how to use Evolution as your e-mail system.


    ![](img/41feae212f5c6612ff709354891f7b39_154_0.png)


    Our goal in this chapter is to introduce the basic Mozilla and Evolution features.
    However, we want you to know that both systems can do far more than we describe
    in this chapter. For more information about Mozilla and Evolution, check out the
    features available on the Help menu, such as the Reference Library or Help contents.


    # ## Making the World Wide Web Possible


    Once upon a time, a company named Netscape created a browser to surf the Internet.
    The browser was originally named Navigator, and later, Communicator. Millions
    of people downloaded it from the Internet for free. Netscape put in the hands
    of millions of people (including us, your authors) the power to access the exploding
    number of Web servers. Netscape made history and changed the world because it
    changed the Internet from a medium that served mainly scientists into a tool that
    anyone can use.


    Even though Netscape Communicator is freely distributed to anyone who wants it,
    it isn’t open-source software in the same way that Linux is. Quite simply, Netscape,
    the company, is a moneymaking venture, and Netscape considers the way the software
    works to be proprietary.'
  merge: -1
  img_proc: true
- pgno: 155
  md: "On the other hand, Netscape recognizes the importance of the open-source dynamic,\
    \ which is why it released an open-source *version* of Netscape named Mozilla.\
    \ Now, countless numbers of people are developing and enhancing Mozilla, the default\
    \ browser for Fedora Core computers.\n\nThe DVD that comes with this book includes\
    \ Mozilla, the open-source brother to Netscape Communicator. Netscape and Mozilla\
    \ are quite similar, although they have a slightly different look and feel.\n\n\
    # Surfin' the Net with Mozilla\n\nIf you have ever browsed the Internet (and who\
    \ hasn't, these days?), the first thing you want to do is to tailor Mozilla to\
    \ your preferences. You can complete this task without connecting to the Internet.\
    \ Follow the steps in this section to customize Mozilla to your liking.\n\n+ \
    \  1. Click the **GNOME Menu** and select **Preferences** > **More Preferences**\
    \ > **Preferred Applications**.\n+      The Preferred Applications dialog window\
    \ opens.\n+      \n+      Fedora Core includes three browsers: Mozilla, Mozilla\
    \ Firefox and Epiphany. Firefox and Epiphany are new, minimalist browsers that\
    \ are quite fun and easy to use. We still prefer Mozilla for its power and maturity\
    \ and use it for our examples.\n\n+   2. **Change the default browser from Firefox\
    \ to Mozilla** by clicking the **pull-down Select a Web Browser: pull-down menu\
    \ and select Mozilla**.\n\n+   3. Click the **Close button**.\n\nNow we'll configure\
    \ Mozilla.\n\n+   1. **Start Mozilla by clicking the blue globe icon on the GNOME\
    \ Panel.**\n+      The Welcome to Fedora Core screen appears in Mozilla. You can\
    \ use this page to find out more information about Fedora Core and its products.\n\
    +      \n+      Concentrate on configuring Mozilla; skip over all the Fedora Core\
    \ information for now (Lots of good information is there, however, so explore\
    \ its world at your leisure.)\n\n+   2. **Choose Edit > Preferences.**\n+    \
    \  On the left side of the Preferences window is a list of categories, which you\
    \ can think of as a map of where you are in the Preferences window.\n\n+   3.\
    \ **Click the plus sign (+) next to the Navigator category to expand it.**\n+\
    \      In this step, you determine which Web page appears when you start Mozilla\
    \ — and which Web page is loaded when you click the Home button on the Navigation\
    \ toolbar.\n\n![](img/41feae212f5c6612ff709354891f7b39_155_0.png)"
  merge: -1
  img_proc: true
- pgno: 156
  md: '+   4. In the Home Page area of the Preferences window, fill in the Location
    field with the URL of the Web page you want to be your home page.

    +      You can also surf to the site of your choice and click the Use Current
    Page button.

    +      For example, type www.linuxworld.com and you see interesting information
    about Linux whenever you start up your browser or click the Home button, in the
    upper-left corner of the Mozilla window.

    +      Mozilla remembers where you have been and lets you select (and go to) a
    previous location. How long Mozilla remembers (and then how big the list becomes)
    depends on how many days of history you choose. The History configuration option
    determines the number of days that the locations you visit are saved. If you''re
    short on disk space, choose a lower History number (such as one or two days).
    Otherwise leave the default setting alone.


    # # Working with proxies


    If your Linux computer is connected to the Internet through a proxy firewall,
    you need to configure Mozilla to work with the proxy.


    +   1. Click Edit:Preferences in the Mozilla window.

    +   2. Click the Plus (+) sign next to the Advanced category.

    +   3. Click the Proxies option.

    +   4. Click the Manual Proxy configuration radio button and enter the URL of
    your proxy.

    +      - For example, enter proxy.mynetwork.com in the HTTP Proxy text box (if
    that''s the name of your firewall) and enter 80 in the Port text box.

    +      - Optionally, if your LAN uses an automated proxy script, click the option
    labeled Automatic proxy configuration URL, and type in the name of your script.

    +   5. Click the OK button and you should be able to use Mozilla through your
    proxy firewall.


    You don''t have to perform this configuration process if you''re using the Fedora
    Core default firewall or the packet-filtering firewalls we describe in this book.


    Fedora Core 3 introduces the new GNOME Web browser Epiphany. Epiphany is designed
    to function solely as a browser and to be easy to use. You can launch Epiphany
    by clicking the GNOME Menu and selecting Internet:Web Browser.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Plugging in plug-ins


    Mozilla performs the tasks you expect from a browser, like displaying Web pages
    while going the extra mile to make browsing simple and easy. Unfortunately, Mozilla
    can''t include commercial plug-ins like Flash animation and JavaScript by default.


    If you want to do that extra mile, however, Mozilla shows how, by providing URLs
    to locations where you can download and install most of the plug-in functions
    you''ll ever want or need. You see, many companies allow you *individual* access
    and use of their proprietary software.


    # Installing the Showwave Flash plug-in


    To make use of plug-ins, all you need to do is (sorry) plug it in. Adding plug-ins
    is straightforward process. You obtain the plug-in and place it, or link it to
    the Mozilla plug-in directory.


    You can find, download, and install several popular plug-ins by searching the
    Mozilla plug-in help page. The following steps show (for example) how to install
    the popular Macromedia Showwave Flash and Java plug-ins:


    +   1.  **Login as *root*.**


    +   2.  **Start up Mozilla and your Internet connection (if necessary).**


    +   3.  **Check to see which plug-ins Mozilla are already installed by choosing
    Help↖ About *Plug-ins*.**


    Mozilla shows that the only installed plug-in is `libnullplugin.so.`


    +   4.  **Click the `plugindoc.mozdev.org` link at the top of the page.**


    You see the Welcome to PluginDoc page, which shows where to find the most popular
    and useful plug-ins.


    +   5.  **Click the Linux (x86) link.**


    +   6.  **Click the Macromedia Flash Player link.**


    +   7.  **Click the Macromedia Flash Player for x86 Linux link.**


    The Macromedia Flash Player Download Center Linux page opens.


    +   8.  **Click the Download Now button.**


    The dialog box labeled Opening `install_flash_player_7_linux.tar.gz` opens.


    Note that the version of this package may change during this book''s life-time.
    You should be able to use a newer version if and when one becomes available.'
  merge: -1
  img_proc: true
- pgno: 158
  md: "+   9.  **Click OK in the dialog box.**\n+   \n+   The Enter name of file to\
    \ save to dialog opens. The default of this dialog is to save to your home directory.\
    \ You can change the directory, but the default will work for our purposes.\n\n\
    +   10. **Click the Save button in the dialog box.**\n+   \n+   The Download Manager\
    \ dialog box opens, showing the progress of the download. You can close the dialog\
    \ box by clicking on the Close Window button — it looks like an X — at the top,\
    \ right corner of the window.\n\nLinux provides a utility called `file-roller`\
