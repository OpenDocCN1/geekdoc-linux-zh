- pgno: 210
  md: '# Chapter 15


    # Building Your Own

    Private Network


    +   **In This Chapter**

    +   - Designing and creating your private network

    +   - Building an Internet gateway

    +   - Building a private network firewall


    A private network is made up of two or more computers, interconnected so they
    can communicate with each other; you can also refer to a private network as a
    *local-area network* (LAN). The computers are generally in close proximity within
    a room or building. Unlike the Internet, which is designed to allow the world’s
    computers to communicate with each other, LANs are designed to keep communication
    local and private. (You can always connect your LAN to the Internet, of course,
    but we talk about that topic elsewhere in this book.)


    Building a private network isn’t as difficult as it may sound. First, you have
    to decide on a general network layout. Second, you have to physically connect
    the computers with cables and wireless devices. Third, and last, you have to configure
    each computer’s network settings. Design, connect, configure — one, two, three
    — it’s as simple as that.


    This chapter shows how to build a simple LAN. If you want to know how to add a
    Linux computer to an existing network, check out Chapter 7. To find out about
    adding a firewall to your LAN, check out Chapter 8.


    ![](img/41feae212f5c6612ff709354891f7b39_210_0.png)


    In this chapter, we show you how to wire computers together. You should refer
    to the Linux network-configuration instructions in Chapter 7 to connect individual
    computers on your network. The steps in Chapter 7 are also designed to work with
    any LAN, including the one you’re building here.'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'In this chapter, we describe how to connect computers to form a LAN.

    However, you can connect many other devices to a network. You can connect a wide
    range of devices to a network (whether it''s wireless or wired); these include
    broadband (cable and DSL) Internet modems, routers, switches, hubs, network-capable
    printers, and even some personal digital assistants (PDAs). In the future, we
    fully expect to be able to connect nearly every elec-tronic device to a LAN. We
    discuss only computers here because we''re focus-ing on getting your Fedora Core
    computer connected. However, remember that you''re not limited to networking *only*
    computers.


    # # Designing and Building Your Private Network


    Private networks take on many shapes and sizes. As you may expect, the design
    of a LAN for a large- or medium-size organization is different from what you''d
    use for a small office or home. Individuals and small organizations gener-ally
    don''t require complex networks unless the work is complex enough to need such
    a tool. For the purposes of this book, we assume that you want and need a simple
    network - and Linux excels at networking. We describe how to design a basic LAN
    that is both powerful and reliable. This network can be used for many small- or
    medium-size businesses and most households.


    This chapter shows you how to design a simple, flat network. *Flat* refers to
    the fact that all the computers connected to the network communicate over a single
    *subnet* (or *subnet*). Subnets can be combined within a single LAN, but that
    makes the network more complex to design, build, and maintain.


    The network we describe in this section is also designed to use a Fedora Core
    *Internet gateway* - a computer that acts as a portal, connecting the private
    network to the Internet. The networked computers in the private network - also
    referred to as *hosts* or *clients* - are connected via one of two methods:


    +   * Wired connections: Hosts are connected to the LAN through a device called
    an *Ethernet hub* or *Ethernet switch* (or just *hub* or *switch*). Switches are
    superior to hubs in performance and security, and have become the standard. For
    your LAN, we suggest that you use an Ethernet switch to connect all the computers
    (hosts) - including the Internet gateway. Figure 15-1 shows an example of our
    private network, where the inter-connecting fabric is the Ethernet switch. (In
    recent years, Ethernet switches have become so inexpensive that Ethernet hubs
    have all but disappeared.) Our example network consists of two computers: Veracruz
    and Cancun.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '✓ **Wireless connections:** Wireless devices make it possible to build a net-  work
    without interconnecting cables. Wireless networks can take two  forms:


    ✓ **An access point:** Using a device called an access *point*, you can connect  wireless
    hosts to a LAN. This design has the hosts connect to the access  point via radio
    frequency (RF) signals. The access point also connects to  a wired network, and
    the wireless hosts communicate with the wired  network through that connection.


    Access points have become the most popular system for creating  wireless LANs.
    You can find access point devices in consumer elec-  tronics stores for much less
    than $100.


    +   • **Ad-hoc mode:** This is an alternative wireless-connection method  that
    doesn’t require a separate access point, other than a wireless  device for each
    host (*ad hoc* is the Latin equivalent of “whatever  works”). Wireless hosts communicate
    directly with each other by  using ad-hoc mode. (You can read more about ad-hoc
    mode in the  “Wiring without wires” section later in this chapter.)


    ![](img/41feae212f5c6612ff709354891f7b39_212_0.png)


    # ## Where did all the wires go?


    The RF (radio-frequency) signals used by wire-  less networks are the same ones
    you tune in to  on your radio — or communicate with on your  cell phone — or use
    to open your garage door.  The only differences between the RF signals  coming
    from an AM radio station and a wireless  network device are its frequency and
    strength.


    The *Federal Communications Commission* (FCC)  permits anybody to use the 5-gigahertz
    (GHz)  portion of the frequency spectrum — billions of  cycles per second — for
    any purpose as long  as the signal strength is low. In effect, radio sig-  nals
    replace the wires in a wireless LAN.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# The ABCs of switches and hubs


    Switches are better than hubs because switches are more secure and faster. Here''s
    a quick comparison to illustrate the differences.


    Suppose your network consists of three machines — A, B, and C — all connected
    to a switch. When Machine A wants to communicate with Machine B, the switch transmits
    the network traffic from A directly to B. Machine C is out of the loop. By making
    sure that C doesn''t know what A and B are saying, the switch keeps network communication
    private. Hubs, on the other hand, broadcast the network traffic from one machine
    to all machines connected to the hub. When A sends information to B, the hub broadcasts
    that information to both B and C.


    Switches are faster than hubs because network traffic flows only between the machines
    that are talking to each other. The computers that aren''t talking to each other
    don''t use the switch''s bandwidth (the maximum rate at which information can
    be transmitted). For example, when Machine A is sending information to Machine
    B, Machine C doesn''t slow up the communication speed by sucking up the bandwidth.


    # Wiring your network with, yes, wires


    This section describes how to build a wired network. You can mix wired and wireless
    networks, but, for simplicity, we describe how to build a pure wired or wireless
    network.


    Way back in prehistoric times (circa 1996), you had to be technically savvy to
    wire your own network. Wiring consisted of coaxial cables like those used for
    cable-TV connections. Coaxial cables are bulky and require you to use special
    tools to attach the connectors to the cable ends.


    Life is easy now. Wiring your network requires that you obtain Cat-5 cables, similar
    in appearance to telephone cables. Cat-5 cables are manufactured with telephone-like
    connectors that are a snap (pardon the pun) to use. No muss, no fuss.


    ![](img/41feae212f5c6612ff709354891f7b39_213_0.png)


    You can buy Cat-5 cables at any electronics store. They come in many colors and
    sizes. Cat-5 cables aren''t cheap, but they''re not terribly expensive either.
    They''re reliable and much easier to work with than coaxial cables.


    You have to use a network switch or hub in conjunction with Cat-5 cables. Switches
    and hubs are the glue that holds your network together. Both switches and hubs
    connect individual computers so they can communicate with each other.'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Most, if not all, networking equipment is now based on the Ethernet protocol.
    Ethernet is inexpensive and readily available. You can purchase it from any consumer-electronics
    store, mail-order catalog, or online computer seller. You don''t need to know
    any of the technical aspects of Ethernet because it requires no configuration.
    You need to know only that an Ethernet connector looks similar to a telephone
    jack. Remember, however, that Ethernet and telephone jacks aren''t compatible.


    For your network, start by connecting your machines to a central switch. (You
    can use a hub, if you want.)


    Although you can connect as many computers as your switch or hub can handle, to
    keep the job as simple as possible, these steps describe how to wire two computers.
    Cancun and Veracruz. The steps assume that you have a switch or hub and at least
    two Cat-5 cables; here''s what to do with them:


    +   1. On the first computer, plug one end of a Cat-5 cable into the Ethernet
    network interface connector (NIC) on the back of the machine.


    +   2. Plug the other end of the cable into the switch.


    A green light should appear near the connector you used on the switch. The green
    light indicates that you have link status, indicating that an Ethernet connection
    has been established: You have an active connection between the computer and the
    switch.


    If you don''t get link status, make sure that both connectors on the cable have
    been properly inserted. Pull each connector out and firmly press it back in (a
    procedure called reseating).


    ![](img/41feae212f5c6612ff709354891f7b39_214_0.png)


    If this suggestion doesn''t fix the problem, make sure that the cable is working
    correctly. Check the cable for cracks and cuts, for example. Check the cable''s
    connectors for loose wires. Substitute another cable, if possible; use a cable
    that you know works. That can help you determine whether the suspect cable is
    at fault.


    If neither of these options works, you may have a broken switch, cable, or Ethernet
    NIC, or any combination. You may have to replace either or all of the devices
    to determine the real problem. Perhaps you can borrow a known good cable and NIC
    from a working network and use them to narrow down (or eliminate) the problem.


    +   3. Repeat Steps 1 and 2 for each additional computer.


    After you have successfully connected all your computers to the switch, you can
    proceed to the section "Building an Internet Gateway" later in this chapter. That
    section describes how to build an Internet gateway on a Linux computer. The Internet
    gateway connects your entire private network to the Internet.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# # 198


    # Part IV: Revenge of the Nerds


    # ## *Wiring without wires*


    Life has gotten easier in the past few years. Wireless networking is the best
    technological advance for home or small-business network users in the past five
    years, and it''s now affordable for consumers.


    Going wireless provides the following advantages:


    +   - **Not having to say you''re sorry while stringing cables around your house
    or office.** You don''t have to spend money and time pulling wires through walls,
    ducts, attics, and cellars, for example. (The authors have enjoyed all these activities.)
    You also save the cost of the cables themselves.


    +   - **Geographical freedom:** You have the freedom to use your computers anywhere,
    regardless of where your server or Internet gateway or printers are located. Ah,
    life is easier when you can sit outside on a nice day and click away at the keyboard.


    +   - **Looking good:** You look high-tech even if you''re not. You can impress
    your friends and family.


    However, wireless networking has some drawbacks:


    +   - **Reduced security:** Wireless communications is more vulnerable to hackers.
    You can partially protect your network by using wireless encryption. You can further
    increase security by using application-based encryption such as Secure Shell (SSH)
    and Secure Socke Layern (SSL).


    +   - **Reduced speed:** Wireless networks are generally slower than wired ones.
    The most commonly available and cheap wireless devices work at a few megabits-per-second
    (Mbs). Newer devices work at about 10 Mbs. This is slower than the typical wired
    network operates at 100 Mbs.


    +   - **More complexity:** Configuring a wireless network is a little more complex
    than wired ones. You have to configure an encryption key and other options to
    make a wireless network work.


    The process of constructing a wireless network is straightforward. You have to
    decide how to connect your wireless devices to your private network. You can do
    that in two ways:


    +   - **Use a wireless access point:** A *wireless access point* (WAP) is a device
    through which wireless devices communicate. An access point provides a single
    point of contact through which all other devices communicate. If you install and
    use access points as part of the network structure, you''re using *infrastructure
    mode*.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Chapter 15: Building Your Own Private Network


    An access point uses two network connections. One is an Ethernet port that connects
    to your private LAN through a Cat-5 Ethernet cable, and the other point connects
    to your wireless devices. The access point serves as a common connection point
    to your LAN.


    The other connection point is the access point''s wireless receiver. The wireless
    "port" communicates with all other wireless devices on your network.


    +   Use point-to-point (ad-hoc) communication: Contrary to popular opinion, you
    can create a wireless network without an access point. Wireless NICs are designed
    to communicate directly with each other, as well as through an access point. You
    configure each NIC to know a common network name and a common encryption key,
    and voilà a Wi-Fi form their own ad-hoc network by communicating directly with
    each other. We show you how, later in this section.


    Point-to-point communication is referred to as ad-hoc mode. The term ad hoc is
    a polite way to say kludge — it means putting something together with what you
    have, in whatever way you can. Using wireless ad-hoc mode means that each wireless
    device can communicate with the other wireless devices. (Setting up a network
    with wireless NICs is less expensive than using WAPs.)


    You can purchase an access point to construct your wireless LAN (though you may
    have use the trendy term Wi-Fi network, which means the same thing, so the salesperson
    knows what you''re talking about). That''s simple and quick, if a little expensive.
    If you choose that route, we leave it up to you to follow the access point''s
    instructions for connecting other computers to it. You can follow the steps in
    Chapter 7 for configuring your Fedora Core wireless network-interface card (excuse
    us, Wi-Fi NIC) to an access point.


    We describe how to save a few bucks and use a Linux computer to build an ad-hoc
    network. Building an ad-hoc network requires you to put a Wi-Fi NIC on a Linux
    gateway. You then configure every computer on your private network to use the
    same network name and encryption key. The computers can then communicate directly
    with each other through the Linux gateway to the Internet.


    Follow these general steps to create a wireless LAN:


    +   1. Install both a Wi-Fi and an Ethernet NIC on the Internet gateway computer.


    Each of your private network''s computers can talk to the Internet gateway through
    the wireless NIC. The Ethernet connects the gateway to the Internet through either
    a DSL or cable modem; you can substitute a telephone modem for the Ethernet NIC,
    if necessary.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'The next section in this chapter describes how to build an Internet gateway.


    +   2. Install a Wi-Fi NIC on each of your Linux and Windows computers.

    +   3. Configure each Wi-Fi NIC to use the same network name and encryption key.


    Refer to Chapter 7 to find out how to configure a Wi-Fi NIC; use the network IP
    addresses, netmasks, and other items described there.


    +   4. Configure your Internet gateway to forward your private network traffic
    to the Internet.

    +   5. Configure a firewall on your Internet gateway.


    Refer to the section “Protecting your LAN with a firewall,” later in this chapter.


    ![](img/41feae212f5c6612ff709354891f7b39_217_0.png)


    One advantage of using *infrastructure mode* (which is what you have when your
    network specifically incorporates access points) is that a wireless device can
    move from access point to access point without reconfiguration. Access points
    provide mobility and flexibility within the LAN, which can be a good thing if
    you happen to work on a large, dispersed environment. For example, if your company
    is spread across several locations, you want to be able to use your computer anywhere.
    However, if you don’t configure your access point correctly — for example, by
    not using an encryption key — flexibility becomes a security liability. Make sure
    that you correctly configure all your wireless devices.


    # # Building an Internet Gateway


    Okay, you have built your LAN. Woo-hoo! That wasn’t too hard. The next question
    is “What can you do with it?” One answer is that every computer on your private
    network can communicate with all the others and share information and services.
    (We describe in Chapter 16 how to share some useful network-based services. You
    find out how to share files and printers, configure a Domain Name Service — DNS
    — server, and build a simple Web server.)


    One essential network function is to be connected to the Internet. Chapters 5
    and 6 show you how to connect a single, standard-look Linux computer to the Internet.
    We expand that process a step further and show you how to turn the Internet connection
    into one that can be used by the entire private network. Any computer connected
    to your LAN subsequently has Internet access. Sharing is good, and your mom should
    be pleased.'
  merge: -1
  img_proc: true
- pgno: 218
  md: "The remainder of this chapter deals with building an Internet gateway. We assume\
    \ that you have a working Internet connection, as we describe in Chapters 5 and\
    \ 6. This connection is the conduit from your LAN to the Internet. You only have\
    \ to configure a Linux computer to redirect (route) Internet-bound traffic from\
    \ your LAN to the Internet and modify the firewall we describe in Chapter 8 to\
    \ work with the gateway.\n\n# Understanding IP forwarding and network-address\
    \ translation (NAT)\n\nAn Internet gateway requires a Linux computer that has\
    \ two network connections. You need one Ethernet or wireless NIC to connect to\
    \ your LAN. The other network connection is used to make the Internet connection;\
    \ this connection may be a traditional telephone-based modem, a DSL modem, or\
    \ a cable modem. You use an Ethernet NIC to make the second connection.\n\nSuppose\
    \ you open Mozilla on the sample Fedora Core computer *Cancun* (with the IP address\
    \ `192.168.1.1`) and enter the URL `fedora.redhat.com`. Network packets bound\
    \ about your LAN and then fly out to the Internet (and back again), and Mozilla\
    \ ends up displaying the Fedora Core Web page.\n\nLots of things have to happen\
    \ to make all these other things happen. Here’s a simplified version of how it\
    \ all works:\n\n+   1. Mozilla asks Linux to look up the address, via DNS, which\
    \ translates `fedora.redhat.com` into the numeric IP address `209.132.177.50`.\n\
    +   2. Linux compares the IP address to its internal routing table. The operating\
    \ system directs network traffic to the default route if the address doesn’t match\
    \ its local networks. (In other words, if the IP address belongs to a machine\
    \ on the private network, Linux directs its communication to the Ethernet device\
    \ connected to the LAN. If the IP address is external to the LAN, however, Linux\
    \ forwards the packets to the appropriate router.)\n+   \n+   In this case, `209.132.177.50`\
    \ doesn’t exist on the LAN, so all traffic for the browsing session is directed\
    \ to the default route.\n+   \n+   3. In the private-network example we describe,\
    \ the default route of each host points to the Internet gateway *Veracruz*. For\
    \ example, all Internet-bound network packets that Cancun produces are sent to\
    \ Veracruz.\n+   \n+   4. The Internet gateway Veracruz receives the outbound\
    \ packets from Cancun on its internal NIC and forwards them to its external NIC.\
    \ Packets going through its external NIC are directed to the Internet."
  merge: -1
  img_proc: true
- pgno: 219
  md: "5. Veracruz (internal NIC address 192.168.1.254) also converts the source address\
    \ of packets from Cancun (192.168.1.1) to the source address of its external NIC.\
    \ For example, if Veracruz’s external NIC (connected to a DSL or cable modem)\
    \ has the address 192.168.32.254, the source address of Cancun packets is converted\
    \ to that same address (192.168.32.254); in other words, Cancun’s source address\
    \ 192.168.1.1 is changed to 192.168.32.254.\n\n6. The packets go to their intended\
    \ destination. The fedora.redhat.com Web server responds to the query and sends\
    \ back the requested information.\n\n7. Veracruz receives the return packets,\
    \ converts their destination address back to that of Cancun, and forwards them\
    \ to the private network.\n\n8. Cancun receives the packets, and the browser displays\
    \ the information.\n\n# Forwarding network traffic  \nthrough your gateway\n\n\
    This section describes how to configure a Linux computer to work as an Internet\
    \ gateway. The process requires you to configure the Linux kernel to forward packets\
    \ from one network interface to another — between the LAN port and the Internet\
    \ port. Because Fedora Core turns off forwarding by default, the steps in this\
    \ section describe how to turn on forwarding (you also need a Linux computer with\
    \ two network connections to construct a gateway):\n\n+   One network connection\
    \ should be an Ethernet or wireless NIC that connects the gateway to the LAN.\
    \ We refer to it as the internal network connection.\n+   \n+   The other connection\
    \ is either the telephone-based modem or an Ethernet NIC connected to a DSL or\
    \ cable modem. We refer to it as the external network connection.\n\nFigure 15-2\
    \ shows the Veracruz computer modified to work as an Internet gateway.\n\nYou\
    \ should turn off your external network connection for now. That’s because turning\
    \ on IP forwarding enables communication between the Internet and your private\
    \ network. IP forwarding can be a security hazard until you finish the Internet\
    \ gateway configuration. Temporarily disconnecting your Internet connection removes\
    \ the insecurity: Unplug your (DSL, cable, or telephone) modem’s external (Internet)\
    \ cable."
  merge: -1
  img_proc: true
- pgno: 220
  md: "# Chapter 15: Building Your Own Private Network 203\n\n![](img/41feae212f5c6612ff709354891f7b39_220_0.png)\n\
    \nThese steps describe how to configure a Linux computer as the Internet gateway\
    \ for a LAN:\n\n+   1.  **Add the appropriate internal and external network connections\
    \ to your intended Internet gateway.**\n+       \n+       For example, the internal\
