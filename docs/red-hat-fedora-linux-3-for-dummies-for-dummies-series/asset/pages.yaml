    +    Go to http://luna.cs.ccsu.edu/dominik/apt/fcl/RPMS/testing.


    +    Click lame-libs-3.96-1.i386.rpm link.

    +   A dialog box labeled Enter name of file to save to... opens.


    +    Click the Save button.

    +   At the time this edition of the book was written, the most recent MPlayer
    RPM package was version 1.0pre5. You may see — and should use — a more recent
