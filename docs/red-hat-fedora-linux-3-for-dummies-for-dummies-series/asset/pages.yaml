- pgno: 228
  md: '# Chapter 16


    # Creating Basic Linux Network Services


    # In This Chapter


    +   Preparing a network server

    +   Building a Linux Web server

    +   Building a DNS server

    +   Building a Samba file server

    +   Building a print server


    Linux was built from scratch with networking in mind. Networking is not merely
    an afterthought, as with other operating systems. Fedora Core comes bundled with
    software that provides file sharing, printer sharing, and other functions. This
    is why Linux gained its initial popularity.


    In earlier chapters, we show you how to use a Fedora Core computer with an existing
    network. We also show you how to build a private network using Fedora Core computers
    as both clients and the Internet gateway, or firewall. In this chapter, we describe
    how to configure a Linux box to provide some popular services to the private network.


    # Preparing a Network Server


    All examples shown in this chapter can be run from any Linux computer, such as
    the one set up around the Fedora Core distribution in Chapter 3. Linux doesn’t
    care what your intentions were when you built your computer. Linux eagerly does
    what it’s told and works gracefully as either a workstation or server.


    Linux works equally well whether it’s running a Web browser or a Web server; the
    difference between them is just the software used and how it’s configured.'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'For example, you start the Mozilla application when you''re using your com-
    puter as a Web browser, or you use the Apache program to serve Web pages. You
    can, of course, run both programs at once and (for example) do word pros- cessing
    while running a Web server.


    You can configure the Fedora Core computer from Chapter 3 to provide ser- vices
    to a private network like the one we describe in Chapters 7 and 15. This chapter
    describes how to make the Apache Web server visible to the Internet. Services
    such as Samba and printing, however, definitely should be kept pri- vate and not
    shown to the Internet.


    We also assume in this chapter that you''re connecting to the Internet through
    a private network, as described in Chapters 7 and 15. (Chapter 15 shows you how
    to create an Internet gateway/firewall for your private network with a Fedora
    Core computer.) This chapter assumes that you want to use the same computer to
    provide services to your private network. This assumption is reasonable for small-office
    and home-office (SOHO) networks because the demands put on a modern PC by a small
    network aren''t excessive. Using a single computer for multiple purposes greatly
    simplifies the work you must do and is an efficient way to use your resources.


    ![](img/41feae212f5c6612ff709354891f7b39_229_0.png)


    Using a single Linux computer to act as an Internet gateway and provide net- work
    services is a cost-effective way of using your limited resources — but this type
    of configuration is more difficult to secure. Each function you place on a single
    machine increases the machine’s potential number of vulnerabili- ties. Think of
    adding functions as similar to adding doors and windows to a house: A house with
    a single door and no windows is more secure than a house with 5 doors and 15 windows
    — but who wants to live in a dark house? As with everything else in life, security
    is a matter of compromise. Consult Part II and Chapters 17 and 21 in this book
    for ways to increase security.


    # # Building an Apache Web Server


    The Web is the Internet, and the Internet is the Web — well, that’s not com- pletely
    true. Although the Internet became immensely popular because of the World Wide
    Web (WWW), there’s more to the Internet — it provides the foun- dation for widely
    used functions. E-mail is one such; the Web is another.


    The Web isn’t as mysterious as it may seem at first. It’s composed of essen- tially
    all Web servers that are interconnected via the Internet. The Internet itself
    serves the same function as the world’s telephone system: It allows everyone to
    communicate with each other. You can think of Web servers as the telephones that
    allow people to contact each other, businesses, and other organizations. Just
    as you can start a business or organization and let people contact you via your
    phone, you can also allow people to contact you via your Web server. This section
    describes how to construct a simple Web server.'
  merge: -1
  img_proc: true
