- pgno: 130
  md: '**Graphical applications:** Fedora Core installs numerous applications, such
    as games, system-administration utilities, the Mozilla browser, and OpenOffice.org,
    to provide the functionality that helps you use your computer (and the Internet)
    for work or play.


    # Introducing the GNOME Graphical Environment


    GNOME stands for GNU Network Object Model Environment. GNU stands for GNU''s Not
    UNIX, an acronym that pretends not to define itself (probably designed by guys
    who probably never went to the prom but did change the world). If you have trouble
    remembering acronyms, just think of GNOME as *great graphics for no money, eh?*
    However you remember it, GNOME is an open source graphical desktop environment.
    It provides a platform for completing your everyday tasks, such as word processing
    and Internet browsing, on your Fedora Core computer.


    Log in to your Fedora Core computer and check out the GNOME interface. It should
    look something like Figure 9-1 and consists of these three major elements:


    +   - **The desktop:** The desktop is what you see on your computer screen. It''s
    the space where you do your work, equivalent to — ta-da! — the top of a desk.
    The desktop comes preconfigured with a neutral background and several icons (which
    include links to such places as your home directory and the trash bin). Icons
    are equivalent to the junk you pile on your desk: Some are useful and some aren''t.


    ![](img/41feae212f5c6612ff709354891f7b39_130_0.png)


    +   - When you double-click any of your Desktop icons, a Nautilus window opens
    and displays the contents of that corresponding object. Nautilus is a graphical
    shell (as opposed to a text-based CLI shell) for working with not only files and
    directories but also administration utilities and Web pages. See Chapter 10 for
    more information about Nautilus.


    +   - **The Panel:** The menu bar that runs across the bottom edge of your GNOME
    screen is the Panel (there''s more about the GNOME Panel later in the chapter).
    You can access every default GNOME and Fedora Core (or properly configured third-party
    application) from the Panel. The Panel is analogous to the drawers in your desk.


    +   - **Applications:** These elements include user programs, system tools, and
    GNOME applications. User programs include applications such as Evolution and OpenOffice.org.
    System applications include the Fedora Core system-administration utilities (such
    as those for network configuration and user management) and GNOME utilities (such
    as the Help browser).'
