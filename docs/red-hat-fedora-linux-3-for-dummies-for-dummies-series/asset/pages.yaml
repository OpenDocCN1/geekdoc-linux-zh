- pgno: 251
  md: 'You can configure a Linux computer to print through the Linux/Samba print server.
    The CUPS printer driver that we show you how to install on your Fedora Core print
    server doesn''t “understand” Windows printer drivers. You cannot use the printer
    drivers that come with your Windows computer. CUPS does understand the nearly
    universal PostScript printer language, however. Just download a generic PostScript
    driver to your Windows computer and use the driver to communicate with your Fedora
    Core print server.


    The following steps describe how to download and install the Adobe PostScript
    print driver on a Windows XP computer:


    +   1. Open Internet Explorer (IE) on your Windows computer and go to www.adobe.com/support/downloads/main.html.

    +   2. Click the Windows link under the *PostScript printer drivers* heading in
    the middle of the page.

    +   3. Select on the next page the most recent driver that meets your language
    requirements.

    +      For example, select `Adobe Universal PostScript Windows Driver Installer
    1.0.6-English`.

