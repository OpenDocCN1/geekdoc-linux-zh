  img_proc: true
- pgno: 96
  md: '# Facing DSL configuration woes head-on


    This section describes the basic DSL modem-configuration issues. We take the time
    to give you an overview because it''s easy to focus on the trees at the expense
    of the forest. Please check out and get familiar with the following list. Getting
    your DSL modem working is easier after you do so.


    Most consumer DSL providers now use the asymmetrical DSL (ADSL) type of connection.
    The following list describes the process for getting an ADSL connection working.
    (Please note that we use the generic acronym DSL interchangeably with ADSL. Most
    consumer DSL connections are really ADSL, and that''s the type of connection we
    describe in this chapter.) Follow these steps to set up DSL service:


    +   1. **Find a DSL provider.**

    +      You need to find out whether you live or work close enough to the DSL provider''s
    equipment to get a connection. DSL providers check your address and tell you whether
    they can take your business. You can often check your proximity on the DSL provider''s
    Web site.


    +   2. **Connect your DSL modem to your telephone jack and your computer.**

    +      Your DSL modem acts as the intermediary between your computer and your
    DSL service provider. You must connect one side to the phone jack and the other
    to your computer''s Ethernet NIC.


    +   3. **Configure your Fedora Core computer to communicate with the DSL modem.**

    +      Your Fedora Core computer connects to the DSL modem via an Ethernet NIC.
    You must configure your Ethernet NIC to work with the modem.


    +   4. **Configure the DSL modem with your PPP account name and password from
    your ISP.**

    +      You must authenticate your DSL modem to your ISP. DSL connections get logged
    on to your ISP, just as those from traditional analog modems do. You configure
    your DSL modem with your ISP user name and password.


    +   5. **Configure the DSL modem''s internal (private) network interface.**

    +      Your DSL modem must be able to communicate with a Fedora Core computer
    over an Ethernet connection. You must configure the DSL modem so that it uses
    the same network parameters as your computer.


    +   6. **Configure the DSL modem user and administrative passwords.**

    +      DSL modems provide a reasonable level of security. You should take advantage
    of this security by assigning your own password to the modem. That action prevents
    hackers from breaking into your modem and causing problems.'
  merge: -1
  img_proc: true
- pgno: 97
  md: '7. If necessary, configure the modem’s network address translation (NAT) settings.

    Many, if not most, DSL modems come configured to use NAT by default. This is a
    good thing because NAT effectively works as a firewall. There’s no such thing
    as too much protection.


    The Internet was designed to send — or route — information as quickly as possible
    to its destination. Internet Protocol (IP) addresses are used to designate where
    the information is coming from and where it’s going. IP addresses can be routable
    or nonroutable. Nonroutable addresses can be reused; you can use the same nonroutable
    addresses that your neighbor uses without interfering with one another.


    NAT converts nonroutable IP addresses into routable ones, which is useful when
    you’re connecting your private network to the Internet by translating your internal
    IP addresses into one of your ISP’s routable IP addresses. You need to configure
    your DSL modem to convert your computer’s private and nonroutable address (for
    example, 192.168.1.1) into an address assigned to your DSL connection by your
    ISP.


    8. Save the settings to nonvolatile memory and restart the modem.

    You need to save your DSL modem’s settings after you have them working. You don’t
    want to enter the configuration every time you turn on your modem.


    # ## Finding a DSL provider


    You must obtain both DSL and ISP services to make your broadband connection. Some
    companies — notably, the regional Bell telephone companies — can provide both
    services. However, in our case, we preferred our ISP to the ISP that was aligned
    with the DSL provider. (We were fortunate enough to retain our existing ISP when
    we purchased our DSL service.)


    The DSL provider market is still quite fluid. Research the DSL service providers
    in your area carefully before choosing one — and remember that longevity is as
    important as a low price. Regional Bells are more likely to provide long-term
    service than many of their competitors.


    Usually, you have to select an ISP after you choose a DSL provider. DSL providers
    either provide their own ISP or allow you to choose from several independent ones
    (the DSL provider makes the arrangements and works directly with the third-party
    ISP).'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# The many faces of DSL


    DSL comes in a variety of flavors. Most consumers end up using ADSL because it
    offers inexpensive Internet connections at reasonably high speeds. ADSL serves
    an individual computer user''s Internet needs very well; it even provides a small
    business with adequate service. ADSL is, not surprisingly, the most available
    of all DSL flavors.


    The other types are more suited for business use. Most locales probably have access
    to only two or three of these services. DSL comes in a range of variations:


    +   - **ADSL (asymmetrical DSL)**: The ADSL down-load (*downstream*) speed isn''t
    the same as its upload (*upstream*) speed. (That''s why it''s *asymmetrical*.)
    The maximum ADSL speed is 8 Mbps, but it''s usually limited to less because of
    the POTS infrastructure limitations.

    +   - **G.Lite**: Also known as Universal DSL or *splitterless* ADSL, G.Lite is
    a low-speed version of ADSL that doesn''t require filtering out the POTS signal.
    It provides as much as 1.5 Mbps downstream and 512 Kbps upstream.

    +   - **HDSL (high-bit-rate DSL)**: HDSL is a symmetrical protocol with equal
    upstream and downstream speeds. You can use HDSL as a substitute for T1 connections
    because it provides the same data rate of 1.544 Mbps.


    +   - **HDSL2 (high-bit-rate DSL 2)**: HDSL2 provides the same specifications
    as HDSL, but works over a single twisted-pair connection.

    +   - **IDSL (ISDN digital subscriber loop)**: IDSL, the successor to the current
    ISDN technology, uses the same line encoding (2B1Q) as ISDN and SDSL. IDSL is
    used mostly to provide DSL service in areas where the more popular forms, such
    as ADSL and SDSL, aren''t available. IDSL is capable of providing upstream and
    downstream rates of 144 Kbps.

    +   - **SDSL (single-line DSL)**: SDSL is commonly called *Symmetric DSL* because
    SDSL upstream and downstream speeds are the same.

    +   - **VDSL (very-high-bit-rate DSL)**: VDSL provides as much as 50 Mbps over
    distances up to 1,500 meters on short loops. VDSL is particularly useful for campus
    environments — universities and business parks. VDSL is now being introduced in
    market trials to deliver video services over existing phone lines. You can also
    configure VDSL in symmetric mode.

    +   - **xDSL**: xDSL is a generic term for all the DSL flavors (the x means “whatever”).


    # A real-world example: Configuring an ActionTec DSL modem


    Writing explicit configuration examples is always difficult and liable to leave
    some readers disappointed. But the DSL world appears to be consolidating around
    modems with Web-based configuration interfaces. Therefore we can provide an example
    here that should be useful to you, regardless of whether you have the same type
    of modem. Good luck!'
  merge: -1
  img_proc: true
- pgno: 99
  md: "This section shows you how to use one of the more common DSL modems. Qwest,\
    \ which is a “baby Bell” and one of the larger DSL providers, uses this equipment.\
    \ Our modem router is the Qwest-recommended equipment. You configure it by editing\
    \ Web-based menus.\n\nThe following instructions describe how to configure your\
    \ ActionTec DSL modem. Remember that we’re including these instructions only to\
    \ provide an example of what a DSL configuration looks like. If you’re using a\
    \ different modem or service provider, or both, your configuration looks somewhat\
    \ different.\n\n+   1.  **Connect your ActionTec modem to your telephone line\
    \ by plugging the supplied cable from the modem’s Line port to a telephone jack.**\n\
    +   2.  **Connect your Fedora Core computer’s Ethernet to the DSL modem’s Ethernet\
    \ port.**\n+   \n+       If your computer is connected to a private network, connect\
    \ the DSL modem’s Ethernet to the same network. This step usually requires that\
    \ both the computer and the modem connect to the same Ethernet switch or hub.\
    \ See Chapter 7 for information about connecting to private networks (also referred\
    \ to as *local-area networks*, or LANs).\n+   3.  **Start Mozilla on your computer\
    \ and type http://192.168.0.1 in the Location text box, at the top of the window.**\n\
    +   \n+       This address happens to be the one that the ActionTec modem uses.\
    \ Your mileage may vary.\n+   4.  **Click the Setup/Configuration button.**\n\
    +   \n+       The Setup/Configuration window opens.\n+   5.  **Click the Basic\
    \ Setup button.**\n+   6.  **The Setup window opens, reminding you to connect\
    \ your modem to a telephone connection and your computer(s).**\n+   7.  **Press\
    \ the Next button.**\n+   \n+       The Broadband Connection window opens.\n+\
    \   8.  **Keep the default PPPoA option and click the Next button.**\n+   \n+\
    \       P (Point-to-Point), P (Protocol) — P (Point-to-Point Protocol) over ATM.\
    \ ATM is Asynchronous Transfer Mode; **don’t stand for “All The Money you want!”\
    \ P (Protocol) over Ethernet. Don’t worry about the acronyms; the important thing\
    \ to know is that P (Point-to-Point Protocol) is the most common method used to\
    \ connect DSL modems to broadband service providers.**\n+   9.  **When the Broadband\
    \ Connection—PPP window opens, enter in the appropriate text boxes the user name\
    \ and password that your DSL provider gave you.**\n+   \n+       Enter the static\
    \ IP only if you asked for and received one from your DSL provider. The only time\
    \ you need to use a static IP is when you want to provide some network service\
    \ to the Internet."
  merge: -1
  img_proc: true
- pgno: 100
  md: '+   10. In the Save and Restart window, press the Save and Restart button.

    +   The Congratulations! Just as it says, the modem connects itself to your DSL
    provider and stops blinking when it’s ready.


    +   11. Click the Status tab to see information about your connection.


    # Securing your DSL modem


    After you set up a connection to the Internet through your DSL modem, you have
    the same need as everyone else who does that: to make it more secure. The following
    steps describe how to set a password (please see Chapter 3 for advice about choosing
    good passwords):


    +   1. If you’re continuing from where you left off in the preceding section,
    click to select the Setup tab.

    +   2. Click the Change Admin Password button.

    +   3. Enter your password in the first text box and repeat it in the second.

    +   4. Click the Save and Restart button.

    +   The Save and Restart window opens.

    +   5. Click the Save and Restart button again.

    +   Your new password is saved. You’re prompted to enter a user name and password
    the next time you try to view or modify the DSL modem. The user name is admin,
    and the password is whatever you just set it to.


    The exact way to accomplish each of these steps varies between manufacturers.
    The general idea is still the same — and many steps should be quite close to what
    we describe here. All DSL modems require the same basic information: ISP user
    name, password, and so on. You should always set your DSL modem to use NAT because
    it acts as a firewall. Consult your modem’s user guide for detailed configuration
    information.'
