- pgno: 56
  md: 'option, unless that address is really your gateway. Chapters 5, 6, and 7 describe
    how to configure your Linux computer to connect to the Internet via a telephone,
    broadband (DSL or cable), and existing LAN connections, respectively. If you do
    that, setting a default route now can interfere with your connection.


    +   * **Primary DNS:** The Internet Protocol uses the Domain Name Service (DNS)
    system to convert names such as *www.redhat.com* into numeric IPs. A computer
    that acts as a DNS server is a *name server*. We suggest leaving this box blank,
    however, unless you’re on a private network with a name server or are connected
    to the Internet (your ISP supplies a DNS). When you designate a nonexistent name
    server, many networking programs work very slowly as they wait in vain for the
    absent server to do something.


    +   * **Secondary and tertiary DNS:** The secondary and tertiary DNS back up the
    primary DNS server. If your computer cannot find the primary DNS server, it may
    find the secondary. If not, it should find the tertiary. Best of luck!


    ![](img/41feae212f5c6612ff709354891f7b39_56_0.png)


    If you’re connecting to someone else’s LAN — if you’re building a Fedora Core
    computer at work, for example — you should obtain this address from your system
    administrator. If you’re connecting to your own LAN at home, consult yourself
    because you’re probably the administrator.


    +   8. **When you complete the Network Configuration form, click the Next button
    to continue.**


    The Firewall Configuration window opens.


    +   9. **In the Firewall Configuration window, click the Remote Login (SSH) button.**


    The firewall is turned on by default. You can turn it off if you want, but we
    recommend leaving it turned on.


    Fedora Core 3 also includes the new and powerful SELinux option. SELinux provides
    mandatory access controls (acIs) that greatly increase the security of your computer.
    We introduce SELinux in Chapter 17. We recommend leaving SELinux active (the default).


    +   10. **Click the Next button.**


    Fedora Core creates for your computer a firewall designed for use by a workstation.
    The firewall is *stateful*, which means that it keeps track of which connections
    the network traffic (both incoming and outgoing packets) belongs to. It provides
    good protection, and we use it for the personal workstations and network servers
    we describe in this book.


    The next section shows you how to finish the configuration of your Fedora Core
    workstation.'
