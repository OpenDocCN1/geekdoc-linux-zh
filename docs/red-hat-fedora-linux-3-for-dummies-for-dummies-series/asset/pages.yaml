- pgno: 111
  md: 'When you select **Wireless** from the drop-down list in Step 4 on the earlier
    list, the **Select Wireless Device** window appears.


    **2. Select the appropriate wireless device.**


    **3. Click the** **Forward** **button.**


    The **Configure Wireless Connection** window opens, as shown in Figure 7-3.


    **4. Select either** **Managed** **or** **Ad-Hoc** **from the** **Mode** **drop-down
    list.**


    You use **Managed** mode when you''re using an access point. Use **Ad-Hoc** mode
    if you configured a wireless network without an access point.


    **5. Type any in the** **ESSID (Network ID)** **text box if you use an access
    point.** **Type the specific** **ESSID** **name for your ad-hoc network.**


    All machines connected to an ad-hoc wireless network must share the same **ESSID**.
    For example, you may choose the string **mynetwork** as your **ESSID**. In that
    case, you must enter **mynetwork** as the **ESSID** for all machines connected
    to your ad-hoc network.


    **6. Enter the** **encryption key** **in the** **Key** **text box and then click
    the** **Forward** **button.**


    You should obtain the **encryption key** from your network administrator. If you
    have set up your own wireless home network, you can generate the key yourself.
    An *encryption key*, similar to a password, protects your wireless network from
    casual eavesdropping. In the **Key** text box, enter a key no more than 13 characters
    — for example, **this is a password** uses all 13 of the allowed characters —
    and the more characters (as a rule), the more effective the **encryption key**.


    ![](img/41feae212f5c6612ff709354891f7b39_111_0.png)


    ![](img/41feae212f5c6612ff709354891f7b39_111_1.png)'
