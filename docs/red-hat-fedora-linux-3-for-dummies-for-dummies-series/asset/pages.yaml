- pgno: 273
  md: '# Danger, Will Robinson! Detecting intruders


    Everybody needs a loyal, vigilant robot to sound the alert when aliens, monsters,
    Dr. Smith, and hackers come at you. You cannot have literal robots (or can you?),
    but you can have an intrusion-detection system (IDS).


    Intrusion detection is the flip side of intrusion prevention. You cannot depend
    on not getting hacked unless you turn off your computer and lock it in your panic
    room. Remember that no silver bullet exists in the world of computer security.
    You have to take measures to detect whether — and when — you get compromised.


    Intrusion detection requires more ongoing work than any of the security systems
    we discuss in this book. The other systems, such as firewalls and password protection,
    require some upfront work and then run without much additional work. An IDS, however,
    requires some initial installation and configuration and then continual review.
    You have to monitor an IDS daily if you want it to be of any use to you.


    *Many* IDSs (far too many to describe here) can give you extra security. We suggest
    two mature


    and relatively easy-to-use systems that provide good bang for your buck: Snort
    and Tripwire.


    *Snort* is a network-based IDS. It looks for patterns in network traffic that
    indicate hacker probes and break-in attempts. Snort isn’t perfect and does report
    false positive alerts. You have to spend time identifying and eliminating false
    positives if you want to use Snort — but that time is well spent, because system
    administrators and security professionals consider Snort an excellent IDS. Go
    to www.snort.org to find more information. Wiley publishes *Snort For Dummies*
    by Charlie Scott, Paul Wolfe, and Bert Hayes.


    *Tripwire* works by securely recording the fingerprints of files and directories
    and then comparing them to subsequent ones. Any differences between the current
    and original fingerprint indicate the file has changed and may have been compromised.
    The fingerprints, or *checksums*, are unique mathematical values calculated from
    the contents of a file or directory. You can find Tripwire at www.tripwire.com.


    # *Modifying your firewall to allow SSL*


    You have to modify your Internet gateway or firewall to allow secure connections.
    You have to allow external Web browsers to connect to Port 443 on your Apache
    server. The following rule allows SSL connections:


    ```

    iptables -A INPUT -p tcp -m state

    - -state NEW,ESTABLISHED -j -dport 443

    ```


    If you’re using a DSL modem such as the one we describe in Chapter 6, you must
    modify the modem’s network address translation (NAT) configuration. Many DSL modems
    are now on the market; describing how to configure them individually is beyond
    the scope of this book. Consult your modem’s manual for configuration instructions.
    You have to allow external connections to Port 443.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# # Reading your logs


    You are ultimately your own best intrusion-detection system (IDS). Log files store
    information about nearly every one of your Fedora Core systems. Reading your logs
    lets you discover what has been happening on your computer — and it’s one way
    to detect intrusions.


    Unfortunately, exploring log files is somewhat akin to reading tea leaves. No
    mechanical method exists for sifting through log-files. You have to look for unusual
    and suspicious occurrences. As you read more, you realize what is usual and, of
    course, unusual. Experience counts for a great deal when you’re an IDS.


    Red Hat provides two good systems for viewing log files. The e-mail-based **Logwatch**
    log-alert system sifts through the log files in `var/log` and e-mails the root
    user any alerts or errors. You can configure the Logwatch operational parameters
    to better fit your operation. However, the default works well at alerting you
    to the happenings on your computer. The Red Hat **Logviewer** graphical utility
    provides one-stop shopping for all standard log files. This manual tool helps
    you to remember which log files to look at.


    # ## Using Logwatch


    Logwatch, installed by default during the Red Hat installation process, is a Perl
    script that is run nightly by cron. It reads through every log file in the `var/log`
    directory and picks out items that it thinks are interesting.


    The Logwatch Perl script is in `/etc/log.d/scripts/logwatch.pl`. The soft link,
    00-logwatch, in the `/etc/cron.daily` directory, directs the cron system to run
    the script nightly.


    Logwatch is controlled by the `/etc/log.d/conf/logwatch.conf` file. This file
    controls such options as who is e-mailed the results. The logwatch configuration
    file is self-documented and simple to configure.


    # ## Using Logviewer


    Logviewer is a simple utility designed to display any of the standard Fedora Core
    log files in the `var/log` directory. Logviewer displays by default the raw log
    information and leaves sifting out suspicious entries to your eyes.


    Nothing is special about Logviewer, except it helps you access common log files
    and look at their data. Don’t underestimate the value of that simple assistance.
    Although our busy lives make reading log files a difficult task, it’s one of those
    mind-numbing but necessary jobs — boring but essential!'
