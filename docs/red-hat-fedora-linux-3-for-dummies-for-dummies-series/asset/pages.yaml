- pgno: 57
  md: '# Installation Stage 4: Configuring Your Options


    This section describes the basic configuration steps for your Fedora Core computer.
    We describe how to set your time zone and the **root user** password. You also
    choose to install extra software in addition to the default packages. The following
    steps describe how to perform these basic tasks.


    Follow these steps:


    +   1. The Additional Language Support window opens. Make your selection, if necessary,
    and click the Next button.


    The Time Zone Selection window appears.


    +   2. To select your time zone, click the dot representing a city closest to
    where you live.


    You can use the map to point and click your way to time-zone bliss. When you click
    one of the thousand points of light, the represented city and its time zone appear
    in the subwindow below the map. You can also click the slider bar at the bottom
    of the screen to locate the name of your city or time zone. After you find it,
    click the text to select your time zone.


    ![](img/41feae212f5c6612ff709354891f7b39_57_0.png)


    +   3. Click Next.


    The Set Root Password window appears.


    +   4. Type your root password in both the Root Password and Confirm text boxes.


    The password is for the root user account. Whoever has this account is also known
    as the *superuser*, and has access to the entire system and can do almost anything
    — good and bad.


    The *root* user is the only user who can access all resources on your computer.
    All files, processes, and devices are controlled by *root*. You should log in
    as the *root* user only to perform system maintenance or administrative tasks.
    To avoid making unwanted changes or deletions to these important files, you should
    normally log in as a regular (non-root) user. See Step 2 in the section “Post-Installation:
    Using the Setup Agent,” later in this chapter, to find out how to add a user.


    ![](img/41feae212f5c6612ff709354891f7b39_57_1.png)


    You have to type the password twice to make sure you typed it correctly. The password
    appears on-screen as asterisks as you type it. (“Holy breach of security, Batman!”
    You wouldn’t want someone to be able to look over your shoulder and get your password,
    would you?)


    +   5. Click Next.


    The Package Installation Defaults window opens and displays a summary of the important
    software to be installed. You’re given the choice'
