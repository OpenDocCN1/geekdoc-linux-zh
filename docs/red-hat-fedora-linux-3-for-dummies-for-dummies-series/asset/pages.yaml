- pgno: 202
  md: '# ## VMware: A Virtual Reality Machine


    Sometimes you need to use an application that just doesn’t run under Linux, not
    even with the help of Wine. For example, one of its authors has to use a trouble-ticket
    system to fix customers’ problems. The problem is that that trouble-ticket application
    doesn’t run under Linux, with or without Wine. That author must then install both
    Windows and Linux on his computer (a dual-boot system) or else maintain a separate
    one for the sole purpose of running the single application.


    Nothing is wrong with using a dual-boot computer, of course. But it seems a waste
    of time if all you need to do is run one or two applications. Dual-boot computers
    also have to be rebooted whenever you need to switch from operating system to
    the other. An alternative to dual booting is VMware, a commercial product from
    VMware, Inc. This program creates a virtual computer within a physical computer.
    The virtual computer runs as an application, just like OpenOffice or Mozilla.


    VMware looks and works just like a real PC. The virtual VMware PC can run an operating
    system such as Linux or Windows in just the same way any real computer can. The
    operating system running on the virtual machine behaves just like the real operating
    system. Any applications that it hosts, therefore, look and work just like the
    real applications! VMware creates not only virtual computers, but also virtual
    networks (imagine trying out a network design before you have to hook it up .
    . . ). Each virtual computer that you configure to use bridged networking connects
    to a virtual switch. If you create two virtual machines on a single host, therefore,
    each machine can communicate with the other —


    — and the host itself — as though they were connected to an Ethernet hub. This
    capability allows you to create experimental and production virtual networks.
    For example, you can use a single powerful PC to create several virtual servers
    rather than purchase and maintain individual ones.


    VMware (as we’ve found) also good for writing Linux books. Writing techy books
    like this one requires you to use early beta versions of new software releases
    while you’re writing the initial draft. The old method required installing the
    beta on your computer and using it for both testing and writing; alternatively,
    you can use two computers side by side. Both methods are clunky and cause numerous
    headaches when the beta does some funky thing. VMware solves the problem by allowing
    you to run the current production version of Fedora Core on your host computer
    and install the beta on the virtual computer. You can test the beta to your heart’s
    content while writing at the same time in OpenOffice — all on the same virtual
    computer. Updating from one beta version to another is a snap too.


    You can download the VMware Workstation product for free. It requires a license
    that costs approximately $300 for commercial use and $100 for educational use.
    It’s money well spent.


    VMware also offers a 30-day evaluation license for no charge. The temporary license,
    which isn’t limited in any way other than the time limit, is ideal for testing
    this powerful tool. The steps in the following section describe how to download
    the product and its temporary license to find out about its power.'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'The commercial use of open-source software can provide an extra punch in certain
    circumstances. Open source for profit? Indeed. Companies such as CodeWeavers (www.codeweavers.com)
    and TransGaming (www.transgaming .com) deliver just such a punch. Both companies
    have added features to the basic Wine software to make the installation process
    simpler. CodeWeavers concentrates on making Wine easier to use on the general
    desktop; the company makes installing and using Microsoft Office, Internet Explorer,
    and various plug-ins easy. The TransGaming product WinX covers the other side
    of the computing spectrum by providing a gaming-oriented system.


    This book is oriented toward using Linux as a useful day-to-day operating system
    for a workstation. Our work (for example) is tilted toward using word processors
    and similar programs. We leave it to you to experiment with WinX. Suffice to say
    that our game-oriented colleagues find WinX useful.


    CodeWeavers produces two consumer-level products: CrossOver Office Standard and
    CrossOver Office Professional. Both Professional and Standard editions provides
    an installation utility that works with many more Windows applications than does
    Wine. CrossOver Plugin provides internally developed software that helps in using
    plug-ins. CrossOver uses mostly unmodif ied Wine software, but provides a slick
    installation system.


    CrossOver Office Professional 3.0.1 costs $84.95 while the Standard version is
    priced at $39.95. (Those prices apply when you download the product from the Internet.
    The CD versions cost a little more.)


