- pgno: 47
  md: "# For installation purists only\n\nYou can run the Fedora Core installation\
    \ system from either a graphical or text-based interface. If the installation\
    \ process successfully detects your graphics hardware, the graphical method is\
    \ selected automatically, and that’s the system we discuss in this chapter. In\
    \ addition to the ease of using a mouse to point and click, the graphical method\
    \ groups similar configuration choices. For example, the keyboard and mouse selections\
    \ are presented within one window; not two, as in the text-based installation.\n\
    \n+   ✔ Your mother told you never to point and click.\n+   \n+   ✔ In an unlikely\
    \ (but possible) turn of events, the Fedora Core installation system found it\
    \ couldn’t use your graphics adapter. Occasionally the installation system cannot\
    \ start the graphics interface; in that case, it defaults to text mode. Using\
    \ the text-mode interface, you use the keyboard to enter information and the cursor\
    \ (arrow) keys to move you from step to step.\n\nYou may have to use the text-based\
    \ installation for these reasons:\n\nYou can select the text-based installation\
    \ method by typing **linux text** at the **boot:** prompt.\n\nThe Fedora Core\
    \ installation process has a point of no return. That time comes toward the end\
    \ of the configuration process, after which your disk is partitioned and the software\
    \ is installed (see the section “Installation Stage 5: The Point of No Return,”\
    \ later in this chapter). If you stop at or before that point, you keep intact\
    \ the old operating system and data on your computer.\n\n# Choosing an Installation\
    \ Type\n\nFedora Core provides several installation types to choose from. Although\
    \ we think that you can probably get away with having less space on your system,\
    \ we decided to give you the minimum disk space requirements that Fedora Core\
    \ suggests for each installation option:\n\n+   ✔ **Workstation:** This option\
    \ adds software-development tools, such as the gcc (GNU C Compiler) compiler,\
    \ to the Personal Desktop installation process described next in this list. You\
    \ need at least 3GB of disk space to use this option. We use the Workstation installation\
    \ option in this book not because we’re programmers but, rather, because the tools\
    \ often come in handy when you’re installing certain applications. We encourage\
    \ you to use the Workstation installation type for your Fedora Core installations.\n\
    +   \n+   ✔ **Personal Desktop:** This option installs the software necessary\
    \ to use your computer as a personal workstation. Applications such as Mozilla,\
    \ OpenOffice, and Evolution plus the GNOME graphical environment give you all\
    \ the tools you need to enjoy the Internet and get your work done. This installation\
    \ type requires at least 2.3GB of free space."
  merge: -1
