- pgno: 50
  md: '# Checking your discs


    Fedora Core provides a validation mechanism for checking its DVD or CD-ROMs. If
    your distribution disc is a DVD, Fedora Core uses numeric keys to help verify
    that it isn''t corrupted: You can enter **linux mediacheck** at the **boot:**
    prompt, at the beginning of the installation process, to verify the disc''s integrity.
    Follow these steps to verify that your DVD is in working order:


    +   1. Select the **OK** option by pressing the **Enter** key if you want to verify
    that your DVD (or CD-ROM) is okay.


    +   2. Press the **Tab** key to select the **Test** option and press the **Enter**
    key to start the integrity check.


    The media-check system displays a progress meter and then shows the result in
    the Media Check Result window when it’s finished. The possible results are **PASS**
    and **FAIL**.


    +   3. Select the **OK** button (the only option) in the Media Check Result window.


    +   4. Assuming your **DVD** passed, re-insert the DVD and select **Continue**.


    +   5. If you’re testing **CD-ROMS**, insert the second or third **CD-ROM** and
    repeat Steps 2–4 for each **CD-ROM**. You’re finished after testing the third
    **CD-ROM**.


    Obviously, if the DVD (or any of the CD-ROMs) fails the test, you shouldn’t use
    it. You should buy another copy of this book. (No, no – just kidding.) Contact
    the Wiley Photo Technical Support department, at www.wiley.com/techsupport, to
    find out how to get a replacement DVD (or CD-ROM).


    # Installation Stage 2: Slicing and Dicing the Pie


    You must decide where on your hard drive to install Fedora Core. This process,
    called *disk partitioning*, divides the disk into multiple sections. Fedora Core
    is then installed on its own partitions.


    Fedora Core provides both automatic and manual methods for creating disk partitions.
    We use the Fedora Core automatic method because it’s easy. The automatic method
    erases any existing Fedora Core partitions, but doesn’t touch any existing Windows
    partitions. If you don’t have any existing Fedora Core partitions or unused space
    on your disk, you have to make some free space. Refer to Chapter 2 for instructions
    on how to shrink Windows partitions to make space for Linux.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Confidential for Windows users


    If you''re installing Fedora Core in a dual-boot configuration with Windows NT,
    Windows 2000, or Windows XP, your NT boot record is temporarily overwritten, which
    means you cannot boot Windows NT. Don''t panic: Your NT panic: Your NT boot record
    — C drive — isn''t erased, it has just been rendered temporarily unbootable. (An
    NT boot record is what enables a Windows NT system to start automatically whenever
    you start your computer.)


    You can install Fedora Core without overwriting the NT boot partition if you click
    the Change Boot Loader button and select the Do Not Install a Boot Loader radio
    button. When you click the Next button, the advanced Boot Loader Configuration
    window opens. Select the First Sector of Boot Partition option and then click
    the Next button. Your Windows boot configuration continues to operate as before.


    ![](img/41feae212f5c6612ff709354891f7b39_51_0.png)


    Linux disk partitions are analogous to Windows disk partitions. The well-known
    C drive uses a single disk partition. The Linux equivalent is the root (/) partition.
    The two operating systems use different terminology, and the analogy isn''t perfect,
    although the concept is the same.


    The Fedora Core installation system must partition your hard drive in order to
    install its software. Partitions divide a hard drive into one or more parts. The
    divisions are used to organize the software and data (the operating system, user
    files, and so on) that make up the operating system.


    Fedora Core provides two partitioning methods: automatic and manual. Using the
    manual method requires you to make numerous decisions about how to divide your
    hard disk into individual partitions. The automatic method makes the whole process
    much simpler, and we recommend it unless you''re feeling lucky (or want to experiment
    or have the experience of manually partitioning your hard drive). We use the automatic
    method in this book.


    +   1. We suggest using the *Automatically partition option* (the default selection),
    so click the **Next** button.


    If you''re using a new disk that has never been partitioned (or your existing
    disk''s partition table has become corrupted in some way), a Warning dialog box
    appears.


    +   2. If prompted, click the **Yes** button in the **Warning** dialog box.


    The Automatic Partitioning window appears. You have three options:'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   • **Remove all Linux partitions on this system:** This option leaves any
    Windows partitions (FAT, VFAT, and NTFS) unmodified while erasing any existing
    Linux partitions. Use this option if you''re reinstalling Fedora Core (in either
    a dual-boot or solo configuration).


    +   • **Remove all partitions on this system:** This option is the most dangerous
    one because it erases everything on your hard drive. Use this option only if you''re
    absolutely sure that you don''t have, or don''t want to save, anything on your
    disk. Your new Fedora Core installation becomes the only operating system on the
    hard drive if you use this option.


    +   • **Keep all partitions and use existing free space:** Use this option if
    you used the nondestructive repartitioning we describe in Chapter 2 to shrink
    your Windows partition and free up space to install Fedora Core alongside Windows;
    this is a *dual-boot* configuration.


    > DANGER, WILL ROBINSON — Danger! Never select the *Remove all partitions* on
    this *Remove all partitions* on this option unless you want to erase everything
    on your hard disk! Use extreme caution because this action destroys all installed
    operating systems (Windows and any earlier version of Fedora Core) along with
    all data. You may use this option, for example, if your computer had Windows preinstalled
    and you want to convert it to a Fedora Core-only workstation.


    **3. Select the partitioning option** — in the Automatic Partitioning window —
    most appropriate for you and then click the Next button.


    Before you select a partition type you should consider the following:


    +   • If you repartitioned your Windows disk (as described in Chapter 2) to make
    room for Linux, click the button labeled Keep all partitions and use existing
    free space. The Fedora Core installation system puts Fedora Core on the extra
    space on the disk.


    +   • If you''re installing Linux over an old Linux installation, click the Remove
    all Linux partitions on this system button.


    +   • If you want to erase any existing operating system (along with all programs
    and data on the disk) and start fresh with Fedora Core, click the Remove all partitions
    on this system button.


    +   • To see how your disk will be partitioned before you give the go-ahead, you
    can select the option labeled Review (and modify if needed) the partitions. Selecting
    this option lets you review and also modify your partitions.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '4. **When a Warning dialog box opens, describing the consequences of your selection,
    choose one of these options:**


    • Click Yes to continue the installation.


    • Click No to return to the Automatic Partitioning window in Step 3.


    If you click Yes, the Boot Loader Configuration window appears, as shown in Figure
    3-1.


    ![](img/41feae212f5c6612ff709354891f7b39_53_0.png)


    5. **The boot-loader defaults should work just fine for you, so click Next.**


    The boot loader helps you start your operating system when you start your computer;
    if you create a dual-boot computer, the boot loader allows you to select one operating
    system or another. The standard Fedora Core boot loader is GRUB, a powerful program
    that can do more than just load an operating system. However, the GRUB default
    options should be all you need (and a description of its advanced features is
    beyond the scope of this book).


    If your computer has a network interface card (NIC), Fedora Core detects it and
