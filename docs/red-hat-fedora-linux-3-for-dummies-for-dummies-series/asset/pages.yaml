    # YUM functions


    YUM provides capabilities to perform the following tasks:


    +   Clean. Use this option to remove accumulated files from the YUM cache directory.


    +   Install. You can use this option to install one or more packages; you can
    use this function to install entire groups too. Let''s say that you want to use
    the XMMS multimedia player that''s included on the Fedora Core 3 distribution
    but not installed by default. But your DVD is in another room and you don''t want
    to get up and get it. (We''re revealing too much of our lazy habits.) No problem.
    Assuming you''re connected to the Internet, run the yum install xmms command and
    you don''t have to get up.


    +   Info. This option provides a summary of the package(s). Run the yum info mozilla
    command and YUM goes out and provides the Mozilla package information summary.


    +   List. This option provides information about packages installed on your computer.
    Enter the yum list mozilla command to find out the information about the Mozilla
    package installed on your computer.


    +   Provides. You use this option plus a character string, and wildcard, to find
    what feature or files a package provides.


    +   Remove. Use this option to remove one or more packages and any dependencies.


    +   Search. Use this option to find packages that match the text string you provide.
    For instance, if you enter yum search moz, you''ll get a list of Mozilla packages.


    +   Update and check-update. Use the update option to, yes, update individual
    packages or your entire computer; the updating process removes the older version
    and then installs the newer one. If you run the command yum update, your entire
    computer will be updated. Specifying a single package (for instance, yum update
    mozilla), updates that package. You can display which, if any, packages can be
    updated. Enter the yum check-update command and all the available package updates
    for your computer will be displayed.


    +   Upgrade. This option is no longer used and will be removed in the future.
    Use the Update option.'
  merge: -1
  img_proc: true
