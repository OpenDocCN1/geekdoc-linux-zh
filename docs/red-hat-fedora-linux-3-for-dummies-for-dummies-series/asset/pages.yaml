    # # Protecting your passwords


    You can use Mozilla to save passwords that you use when you''re browsing the Internet.
    When you start saving passwords, you should also start encrypting them. Encrypting
    passwords is optional, but we highly (highly) recommend it. Encrypting makes finding
    your passwords much more difficult for someone else. With all the business you
    may do on the Internet, you must protect your information as much as possible.
    Follow these steps:


    +   1. From your Mozilla browser, choose **Preferences** from the **Edit** menu.

    +   2. Click the plus sign (+) next to the **Privacy & Security** menu. A submenu
    opens.

    +   3. Click the **Passwords** option. The Passwords dialog box opens.

    +   4. Click the button labeled **Use encryption when storing sensitive data**.

    +   5. Click **OK**.

    +   6. Click the **Edit::Preferences** menu again.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '7. Click the **Master Passwords** option in the Privacy & Security submenu.


    8. Click the **Change Password** button.

    The Change Master Password dialog box opens.


    9. Enter your **password** in the **New password** text box.

    The Password quality meter shows how “good” your password is.


    10. Reenter your **password** in the **New password (again)** text box.

    When both passwords match, the OK button becomes active.


    11. Click the **OK** button.


    Mozilla will now encrypt any password that you save. You have to enter the master
    password just once the first time you access a password-protected object. This
    is a simple and effective security tool.


    You can manage passwords whenever you want. Choose **Preferences** Privacy & Security
    from the Edit menu. Choose **Manage Passwords** and the Passwords dialog box opens.
    You can then remove passwords as desired.


    # # Come the Evolution Revolution


    Evolution is a software system that provides a big step in the — sorry — evolution
    of the Linux desktop. Evolution provides an excellent e-mail-and-calendar client
    (along with other functions) to create a single, integrated package. Evolution
    provides these capabilities:


    +   ✓ Calendar

    +   ✓ Contact manager

    +   ✓ E-mail client

    +   ✓ Personal Digital Assistant (PDA) manager

    +   ✓ Task master (to-do list)


    The following two sections describe how to configure the Evolution e-mail and
    PDA functions.


    # ## E-mail Evolution


    Fedora Core uses Evolution as its default e-mail client. Evolution makes it easy
    for you to configure one or more e-mail accounts. These steps describe how to
    configure Evolution to send messages to and receive messages from your ISP e-mail
    account:'
  merge: -1
