- pgno: 372
  md: '# Appendix F


    # About the DVD


    The DVD that comes with this book contains the full Fedora Core 3 distribution.
    Wiley has pioneered the use of DVDs in place of CD-ROMs because they''re easier
    to use and, we hope, will make using Fedora Core more enjoyable.


    This appendix describes the minimum computer configuration you need in order to
    install Fedora Core and also some of what you get on the companion DVD.


    If your computer isn''t capable of reading DVDs, you can get the Fedora Core 3
    distribution on CD-ROMS by sending in the coupon in the back of this book.


    Although the DVD contains the Linux kernel and supporting GNU programs and applications,
    it doesn''t carry some applications described in this book. You must download
    applications such as Wine, VMWare, MPlayer, and Iccast2/Lices2 from the Internet.
    We describe where and how to download all the applications we discuss in this
    book that aren''t on the companion DVD.


    # System Requirements


    Make sure that your computer meets (or exceeds) the minimum system requirements
    listed here and in Chapter 3. More resources are needed for a graphical workstation.
    If your computer doesn''t match up to most of these requirements, you may have
    problems installing and running Fedora Core:


    +   * A Pentium-class PC with a 400MHz or faster processor is recommended for
    graphical mode (that''s what most people use). Use a 200MHz Pentium-class PC to
    run your computer in text mode. Many people run their Fedora Core computers in
    text mode when they''re providing simple network services (such as Apache Web
    or a LAN firewall). You can make great use of old machines!

    +   * For reasonable performance using the graphical X Window System, we recommend
    at least 256MB, but you can get away with only 192MB of main memory. You can never
    have too much memory, and we recommend that you increase your computer''s memory,
    if possible.'
  merge: -1
  img_proc: true
- pgno: 373
  md: "# # 356 Part VI: Appendixes\n\n+   - You can run Fedora Core in text mode with\
    \ less than **64MB** of memory.\n\n+   - Fedora Core provides several installation\
    \ classes that install different bundles of software. The various classes take\
    \ up different amounts of space, of course. The default class, Personal Desktop,\
    \ requires **2.3GB** of disk space. The Workstation class we use throughout this\
    \ book (refer to Chapter 3) requires **3GB**. The server class can live with **1.1GB**,\
    \ and the minimal Custom installation reduces that number to **620MB**. Using\
    \ the Custom (Everything) installation option requires at least **6.9GB**.\n+\
    \   \n+     We recommend that your computer have at least **5GB** (not such a\
    \ big requirement anymore) when you’re using the Workstation installation so that\
    \ you have some room to work with after you install Linux.\n\n+   - You should\
    \ also have a DVD drive (and, optionally, a 3¾-inch floppy disk drive plus a blank\
    \ 3¾-inch disk), a multisync monitor, an internal IDE or SCSI hard drive, a keyboard,\
    \ and a mouse.\n\nThe instructions for installing the Fedora Core operating system\
    \ from the DVD are detailed in Part I. After you install the software, return\
    \ the DVD to its plastic jacket, or another appropriate place, for safekeeping.\n\
    \n# # What You Find\n\nYou can view much of the documentation on this DVD through\
    \ an HTML viewer, such as Mozilla, which is also included on the DVD; or, you\
    \ can print it. You can also view most of the documentation from other operating\
    \ systems, such as DOS, Windows, or Unix.\n\nBecause the DVD has a full implementation\
    \ of Linux, to list all the accompanying tools and utilities would take too much\
    \ room. The DVD includes, briefly, most of the software so that you can\n\n+ \
    \  - Access the Internet\n+   - Write programs in several computer languages\n\
    +   - Create and manipulate images\n+   - Create, manipulate, and play back sounds\
    \ (if you have a sound card)\n+   - Play certain games\n+   - Work with electrical\
    \ design"
  merge: -1
  img_proc: true
- pgno: 374
  md: '# # If You Have Problems with Your DVD


    We tried our best to test various computers with the minimum system requirements.
    Alas, computers can be cranky, and Linux may not install or work as stated.


    The two likeliest problems are that you don’t have enough RAM for the programs
    you want to use or you have some hardware that Linux doesn’t support. Luckily,
    the latter problem occurs less frequently each day as more hardware becomes supported
    by Linux.


    You may also have one or more FireWire, USB, or SCSI hard drives that use a **driver**
    (called a *kernel module* in Linux parlance) not supported by Linux — or a controller
    that is simply too new for the Linux development team to have given it the proper
    support at the time the DVD was recorded.


    If you have trouble with the DVD, call the Wiley Product Technical Support phone
    number: 800-762-2974. Outside the United States, call 1-317-572-3994. You can
    also contact Wiley Product Technical support on the Internet, at www.wiley.com/techsupport.
    Wiley Publishing, Inc., provides technical support for only installation and other
    general quality-control items; for technical support for the applications themselves,
    consult the program’s vendor or author.


    To place additional orders or to request information about other Wiley products,
    call 800-225-5945.'
  merge: -1
  img_proc: true
