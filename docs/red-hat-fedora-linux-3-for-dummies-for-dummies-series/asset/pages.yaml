    +   - **MPlayer:** Allows Mozilla to play multimedia Internet audio/video streams.
    See Chapter 12 for a description of the standalone MPlayer (non-plug-in) application.


    +   - **RealPlayer 10 (RealAudio):** Allows you to play the RealNetworks audio
    and video streams. Many Internet radio stations still use the RealNetworks protocols
    to stream their content.


    +   - You can also use RealPlayer 10 to listen directly to RealAudio streams.


    +   - **Shockwave (Macromedia):** Provides multimedia, graphics, and game-oriented
