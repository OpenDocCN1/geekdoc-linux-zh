- pgno: 159
  md: '![](img/41feae212f5c6612ff709354891f7b39_159_0.png)


    Installing the Macromedia Flash Player plug-in gives you access to a large quantity
    of multimedia and interesting Web pages. The following section shows how to install
    another important plug-in.


    # Installing the Java 2 Runtime Environment


    The Java 2 Runtime Environment is another important and useful plug-in. The following
    instructions show how to obtain and install it:


    +   1. **Login as root, start Mozilla and your Internet connection (if necessary).**

    +   2. **Click Help About Plug-ins.**

    +   3. **Click the `plugindoc.mozdev.org` link.**

    +   4. **Click the Linux (x86) link.**

    +   5. **Click the Java Runtime Environment link.**

    +   6. **Click the `Sun JRE 5.0` link.**


    Note that the version number may change by the time this book is published. Use
    the latest available version.


    The Sun.com Web page opens, telling you that you’re not registered yet.


    +   7. **Click the Register Now link on the left side of the page.**'
  merge: -1
  img_proc: true
- pgno: 160
  md: '8. Fill out the registration form as appropriate and click the **Register**
    button at the bottom right of the page.


    The Sun shopping cart page opens.


    9. Click the **Check Out** button.


    The License Agreement page opens.


    10. Click the **Accept** radio button and the **Continue** button.


