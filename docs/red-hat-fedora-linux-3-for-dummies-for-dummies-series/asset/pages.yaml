- pgno: 8
  md: '# Dedication


    **Jon ''maddog'' Hall:** To Mom & Pop'', whose aversion to things electronic is
    well known, and who can still call their son *Ron* rather than *maddog*.


    **Paul G. Sery:** To my wife, Lidia Maura Vazquez de Sery.


    # Authors’ Acknowledgments


    I want to thank my wife, Lidia, for her patience, support, and good advice, all
    of which have made writing this book possible. Without her, I would still be the
    pocket-protector-wearing, busted-eyeglasses-fixed-with-tape-looking, “Star Trek”-costume-watching,
    wrinkled-shirt-suffering, spaghetti-in-the-pot-over-the-sink-eating, Saturday-night-hacking
    sorry sort of guy. Well, I was never into “Star Trek,” and I am peeking at this
    keyboard on Saturday night, but my beautiful wife sure has made me a better man.


    I want to thank the staff at Wiley Publishing, who make this book possible and
    provide outstanding support. Terri Varveris and Rebeca Whitney provided constant
    and essential assistance.


    And, I also want to thank Anne Hamilton and Laura Lewin, who gave me the chance
    to write in general and this book in particular. Both showed great confidence
    in and patience with me. I am very grateful and wish them success in their ventures.


    I want to acknowledge a total lack of assistance in writing this book from my
    dog, the infamous Oso Maloso: eater of many things that should have ended his
    long career early, including (but not limited to) ant poison, Advil (poisonous
    to dogs), many pounds of Tootsie Rolls one Halloween, several bags of chicken
    bones at one party, beer, and other assorted items; escaper of many fences and
    gates; and friend of the late, great Paunchy (whose name you see throughout this
    book) and other local dogs.


    How useful was Oso? Well, one night while working on this book I got a phone call.
    Leaving my apple pie next to the keyboard, I went downstairs to take the call
    and passed him on his way up. I should have known something was up because he
    had a cell phone with him and no one answered when I picked up to take the call.
    I went up the stairs while he went down. The apple pie was gone. Oso 1, human
    0.'
  merge: -1
  img_proc: true
