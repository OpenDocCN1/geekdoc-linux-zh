  trans: "\n\n我们创建了一个名为 `static_web` 的目录来存放我们的 `Dockerfile`。这个目录就是我们的构建环境，Docker 将其称为构建上下文（context）或构建上下文（build\
    \ context）。当运行构建时，Docker 会将构建上下文以及其中包含的任何文件和目录上传到 Docker 守护进程。这使得 Docker 守护进程能够直接访问你想要包含在镜像中的任何代码、文件或其他数据。\n\
    \n我们还创建了一个空的 `Dockerfile` 文件作为开始。现在让我们来看一个 `Dockerfile` 示例，用于创建一个作为 Web 服务器的 Docker\
    \ 镜像。\n\n```\n# Version: 0.0.1\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\
    \nRUN apt-get update; apt-get install -y nginx\nRUN echo 'Hi, I am in your container'\
    \ \\\n    >/var/www/html/index.html\nEXPOSE 80\n```\n\n`Dockerfile` 包含一系列与参数配对的指令。每个指令（例如\
    \ `FROM`）应该使用大写，并后跟一个参数：`FROM ubuntu:16.04`。`Dockerfile` 中的指令是从上到下处理的，因此你应该按照相应的顺序进行排列。\n\
    \n每条指令都会为镜像添加一个新层并提交镜像。Docker 执行指令大致遵循以下工作流：\n\n* Docker 从镜像运行一个容器。\n* 执行某条指令并对容器进行更改。\n\
    * Docker 执行等同于 `docker commit` 的操作以提交一个新层。\n* Docker 然后从这个新镜像运行一个新容器。\n* 执行文件中的下一条指令，并重复此过程直到所有指令执行完毕。\n\
    \n这意味着，如果你的 `Dockerfile` 因为某些原因停止（例如，某条指令未能完成），你将获得一个可以使用的镜像。这对于调试非常有用：你可以从该镜像交互式地运行容器，然后使用最后创建的镜像调试为什么你的指令失败了。\n\
    \n注意：`Dockerfile` 也支持注释。任何以 `#` 开头的行都被视为注释。你可以在我们 `Dockerfile` 的第一行看到一个示例。\n\n\
    `Dockerfile` 中的第一条指令必须是 `FROM`。`FROM` 指令指定了一个现有镜像，后续指令将在该镜像上操作；此镜像被称为基础镜像（base\
    \ image）。\n\n在我们的示例 `Dockerfile` 中，我们指定了 `ubuntu:16.04` 镜像作为我们的基础镜像。此规范将在 Ubuntu\
    \ 16.04 基础操作系统之上构建镜像。与运行容器一样，你应该始终明确你具体是从哪个基础镜像进行构建的。\n\n接下来，我们指定了 `LABEL` 指令，值为\
    \ `maintainer=\"james@example.com\"`，这告诉 Docker 镜像的作者是谁以及他们的邮箱地址是什么。这对于指定镜像的所有者和联系方式非常有用。\n\
    \n注意：此 `LABEL` 指令取代了在 Docker 1.13.0 中被弃用的 `MAINTAINER` 指令。\n\n我们紧接着使用了两条 `RUN`\
    \ 指令。`RUN` 指令在当前镜像上执行命令。我们示例中的命令是：更新已安装的 APT 仓库并安装 `nginx` 包，然后创建一个包含一些示例文本的 `/var/www/html/index.html`\
    \ 文件。正如我们发现的，这些每条指令都会创建一个新层，如果成功，它将提交该层并执行下一条指令。\n\n默认情况下，`RUN` 指令在运行 `/bin/sh\
    \ -c` 命令包装器的 shell 中执行。如果你在没有 shell 的平台上运行该指令，或者希望在没有 shell 的情况下执行（例如，为了避免 shell\
    \ 字符串处理），你可以使用 `exec` 格式指定指令：\n\n```\nRUN [ \"apt-get\", \" install\", \"-y\"\
    , \"nginx\" ]\n```\n\n我们使用这种格式来指定一个包含要执行的命令以及传递给命令的每个参数的数组。\n\n接下来，我们指定了 `EXPOSE`\
    \ 指令，它告诉 Docker 容器中的应用程序将使用容器上的特定端口。这并不意味着你可以自动访问容器上在该端口（这里是端口 `80`）上运行的任何服务。出于安全考虑，Docker\
    \ 不会自动打开端口，而是等待在你使用 `docker run` 命令运行容器时手动打开。我们稍后在从此镜像创建新容器时会看到。\n\n你可以指定多个 `EXPOSE`\
    \ 指令来标记多个要暴露的端口。\n\n注意：Docker 还使用 `EXPOSE` 指令来帮助连接容器，我们将在第 5 章中看到。你可以在使用 `docker\
    \ run` 命令配合 `--expose` 选项在运行时暴露端口。\n\n### 4.5.4 从我们的 Dockerfile 构建镜像\n\n当我们运行\
    \ `docker build` 命令时，所有的指令都将被执行并提交，并返回一个新镜像。让我们现在尝试一下：\n\n```\n$ cd static_web\n\
    $ sudo docker build -t=\"jamtur01/static_web\" .\nSending build context to Docker\
    \ daemon  2.56 kB\nSending build context to Docker daemon\nStep 0 : FROM ubuntu:16.04\n\
    \ ---> ba5877dc9bec\nStep 1 : LABEL maintainer=\"james@example.com\"\n ---> Running\
    \ in b8ffa06f9274\n ---> 4c66c9dcee35\nRemoving intermediate container b8ffa06f9274\n\
    Step 2 : RUN apt-get update\n ---> Running in f33105f9274\nRemoving intermediate\
    \ container f33105f9274\nStep 3 : RUN apt-get install -y nginx\n ---> Running\
    \ in 4b989d4730\n ---> 938b9e00\nRemoving intermediate container 4b989d4730\n\
    Step 4 : RUN echo 'Hi, I am in your container' \\\n    >/var/www/html/index.html\n\
    \ ---> Running in b51acc4eb9\n ---> 584ac1def\nRemoving intermediate container\
    \ b51acc4eb9\nStep 5 : EXPOSE 80\n ---> Running in 7ff42bd1f4d\n ---> 22d47c8cb6e\n\
    Successfully built 22d47c8cb65\n```\n\n我们使用了 `docker build` 命令来构建我们的镜像。我们指定了 `-t`\
    \ 选项为我们生成的镜像标记了仓库和名称，这里是 `jamtur01` 仓库和 `static_web` 名称。我强烈建议你始终为镜像命名，以便更容易跟踪和管理它们。\n\
    \n你也可以在构建过程中为镜像打标签，通过在镜像名称后加冒号后缀标签，例如：`docker build -t=\"jamtur01/static_web:v1\"\
    `\n\n注意：如果你没有指定任何标签，Docker 将自动你的镜像标记为 `latest`。\n\n结尾的 `.` 告诉 Docker 在本地目录中查找\
    \ `Dockerfile`。你也可以指定 Git 仓库作为 `Dockerfile` 的源，如下所示：\n\n```\n$ sudo docker build\
    \ -t=\"jamtur01/static_web:v1\" \\\ngithub.com/turnbullpress/docker-static_web\n\
    ```\n\n在这里 Docker 假设 Git 仓库的根目录下有一个 `Dockerfile`。\n\n注意：从 Docker 1.5.0 版本开始，你还可以使用\
    \ `-f` 标志指定文件路径作为构建源。例如，`docker build -t “jamtur01/static_web” -f /path/to/file`。指定的的文件不需要命名为\
    \ `Dockerfile`，但必须位于构建上下之内。\n\n回到我们的 `docker build` 过程。你可以看到构建上下文已上传到 Docker 守护进程。\n\
    \n```\nSending build context to Docker daemon  2.56 kB\nSending build context\
    \ to Docker daemon\n```\n\n"
- fmt: "\nEarlier, we talked about what happens if an instruction fails. Let’s look\
    \ at an example: let’s assume that in `Step 4` we got the name of the required\
    \ package wrong and instead called it `ngin`.\n\nLet’s run the build again and\
    \ see what happens when it fails.\n\n```\n$ cd static_web\n$ sudo docker build\
    \ -t=\"jamtur01/static_web\" .\nSending build context to Docker daemon  2.56 kB\n\
    Sending build context to Docker daemon\nStep 1 : FROM ubuntu:16.04\n  ---> 8dbd9e392a96\n\
    Step 2 : LABEL maintainer=\"james@example.com\"\n  ---> Running in d97e0c1cf6ea\n\
    \  ---> 85130977028d\nStep 3 : RUN apt-get update\n  ---> Running in 85130977028d\n\
    \  ---> 997485f46ec4\nStep 4 : RUN apt-get install -y ngin\n  ---> Running in\
    \ ffca16d58fd8\nReading package lists...\nBuilding dependency tree...\nReading\
    \ state information...\nE: Unable to locate package ngin\n2014/06/04 18:41:11\
    \ The command [/bin/sh -c apt-get install -y ngin] returned a non-zero code: 100\n\
    ```\n\nLet’s say I want to debug this failure. I can use the `docker run` command\
    \ to create a container from the last step that succeeded in my Docker build,\
    \ in this example using the image ID of `997485f46ec4`.\n\n```\n$ sudo docker\
    \ run -t -i 997485f46ec4 /bin/bash\ndcge12e59fe8:/#\n```\n\nI can then try to\
    \ run the `apt-get install -y ngin` step again with the right package name or\
    \ conduct some other debugging to determine what went wrong. Once I’ve identified\
    \ the issue, I can exit the container, update my `Dockerfile` with the right package\
    \ name, and retry my build.\n\n### 4.5.6 Dockerfiles and the build cache\n\nAs\
    \ a result of each step being committed as an image, Docker is able to be really\
    \ clever about building images. It will treat previous layers as a cache. If,\
    \ in our debugging example, we did not need to change anything in `Steps 1` to\
    \ `3`, then Docker would use the previously built images as a cache and a starting\
    \ point. Essentially, it’d start the build process straight from `Step 4`. This\
    \ can save you a lot of time when building images if a previous step has not changed.\
    \ If, however, you did change something in `Steps 1` to `3`, then Docker would\
    \ restart from the first changed instruction.\n\nSometimes, though, you want to\
    \ make sure you don’t use the cache. For example, if you’d cached `Step 3` above,\
    \ `apt-get update`, then it wouldn’t refresh the APT package cache. You might\
    \ want it to do this to get a new version of a package. To skip the cache, we\
    \ can use the `--no-cache` flag with the `docker build` command.\n\n```\n$ sudo\
    \ docker build --no-cache -t=\"jamtur01/static_web\" .\n```\n\n### 4.5.7 Using\
    \ the build cache for templating\n\nAs a result of the build cache, you can build\
    \ your `Dockerfile`s in the form of simple templates (e.g., adding a package repository\
    \ or updating packages near the top of the file to ensure the cache is hit). I\
    \ generally have the same template set of instructions in the top of my `Dockerfile`,\
    \ for example for Ubuntu:\n\n```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\
    \nENV REFRESHED_AT 2016-07-01\nRUN apt-get -qq update\n```\n\nLet’s step through\
    \ this new `Dockerfile`. Firstly, I’ve used the `FROM` instruction to specify\
    \ a base image of `ubuntu:16.04`. Next, I’ve added my `MAINTAINER` instruction\
    \ to provide my contact details. I’ve then specified a new instruction, `ENV`.\
    \ The `ENV` instruction sets environment variables in the image. In this case,\
    \ I’ve specified the `ENV` instruction to set an environment variable called `REFRESHED_AT`,\
    \ showing when the template was last updated. Lastly, I’ve specified the `apt-get\
    \ -qq update` command in a `RUN` instruction. This refreshes the APT package cache\
    \ when it’s run, ensuring that the latest packages are available to install.\n\
    \nWith my template, when I want to refresh the build, I change the date in my\
    \ `ENV` instruction. Docker then resets the cache when it hits that `ENV` instruction\
    \ and runs every subsequent instruction anew without relying on the cache. This\
    \ means my `RUN apt-get update` instruction is rerun and my package cache is refreshed\
    \ with the latest content. You can extend this template example for your target\
    \ platform or to fit a variety of needs. For example, for a `fedora` image we\
    \ might:\n\n```\nFROM fedora:21\nLABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT\
    \ 2016-07-01\nRUN yum -q makecache\n```\n\nWhich performs a similar caching function\
    \ for Fedora using Yum.\n\n### 4.5.8 Viewing our new image\n\nNow let’s take a\
    \ look at our new image. We can do this using the `docker images` command.\n\n\
    ```\n$ sudo docker images jamtur01/static_web\nREPOSITORY          TAG       CREATED\
    \          SIZE\njamtur01/static_web  latest    1 minute ago    120MB\n```\n\n\
    If we want to see how the image was built, we can use the `docker history` command.\n\
    \n```\n$ docker history jamtur01/static_web\nIMAGE          ID             CREATED\
    \          SIZE           COMMAND\n6751b94bb5c0   1 minute ago    120MB      \
    \    \"RUN apt-get -qq update\"\n997485f46ec4   1 minute ago    27B          \
    \   \"ENV REFRESHED_AT=2016-07-01\"\n85130977028d   2 days ago     27B       \
    \      \"LABEL maintainer=james@example.com\"\n8dbd9e392a96   2 days ago     \
    \ 79MB           \"FROM ubuntu:16.04\"\n```\n"
