  trans: "\n\n如果你正在使用 OS X，可以通过 [Docker for Mac](https://docs.docker.com/docker-for-mac/)\
    \ 快速上手使用 Docker。Docker for Mac 是 Docker 组件的集合，包括一个微型虚拟机以及一个配套的命令行工具，该工具安装在 OS\
    \ X 宿主机上，并为你提供 Docker 环境。\n\nDocker for Mac 包含多种组件：\n\n*   Hyperkit。\n*   Docker\
    \ 客户端和服务器。\n*   Docker Compose（参见第 7 章）。\n*   Docker Machine - 帮助创建 Docker 主机。\n\
    *   [Kitematic](https://kitematic.com/) - 这是一个帮助你在本地运行 Docker 并与 Docker Hub 交互的图形用户界面（GUI）。\n\
    \n### 2.4.1 安装 Docker for Mac\n\n要安装 Docker for Mac，我们需要下载安装程序。你可以在[此处](https://www.docker.com/community-edition#/mac)找到它。\n\
    \n让我们获取当前的发布版本：\n\n```bash\n$ wget https://download.docker.com/mac/stable/Docker.dmg\n\
    ```\n\n启动下载的安装程序并按照指示安装 Docker for Mac。\n\n![在 OS X 上安装 Docker for Mac](img/00003.jpeg)\n\
    \n在 OS X 上安装 Docker for Mac\n\n### 2.4.2 测试 Docker for Mac\n\n现在我们可以通过将本地客户端连接到运行在虚拟机上的\
    \ Docker 守护进程，来测试 Docker for Mac 安装是否正常。确保 `Docker.app` 运行，然后打开终端窗口并输入：\n\n```bash\n\
    $ docker info\nContainers: 2\n Running: 0\n Paused: 0\n Stopped: 2\nImages: 13\n\
    Server Version: 1.12.1\nStorage Driver: aufs\n. . .\n```\n\n漂亮！我们在 OS X 宿主机上本地运行了\
    \ Docker。\n\nDocker for Mac 还有很多可以使用和配置的功能，你可以在 [Docker for Mac 站点](https://docs.docker.com/docker-for-mac/)阅读其文档。\n\
    \n## 2.5 Docker for Windows 安装\n\n如果你正在使用 Microsoft Windows，可以通过 [Docker for Windows](https://docs.docker.com/docker-for-windows/)\
    \ 快速上手使用 Docker。Docker for Windows 是 Docker 组件的集合，包括一个微型 Hyper-V 虚拟机以及一个配套的命令行工具，该工具安装在\
    \ Microsoft Windows 宿主机上，并为你提供 Docker 环境。\n\nDocker for Windows 包含多种组件：\n\n* \
    \  Docker 客户端和服务器。\n*   Docker Compose（参见第 7 章）。\n*   Docker Machine - 帮助创建 Docker\
    \ 主机。\n*   [Kitematic](https://kitematic.com/) - 这是一个帮助你在本地运行 Docker 并与 Docker\
    \ Hub 交互的图形用户界面（GUI）。\n\nDocker for Windows 需要 64 位 Windows 10 专业版、企业版或教育版（带有\
    \ 1511 11 月更新，10586 或更高版本）以及 Microsoft Hyper-V。如果你的主机不满足这些要求，你可以安装 [Docker Toolbox](https://docs.docker.com/toolbox/overview/)，它使用\
    \ Oracle Virtual Box 代替 Hyper-V。\n\n提示 你也可以通过 [Chocolatey](https://chocolatey.org/packages/docker)\
    \ 包管理器安装 Docker 客户端。\n\n### 2.5.1 安装 Docker for Windows\n\n要安装 Docker for Windows，我们需要下载安装程序。你可以在[此处](https://www.docker.com/community-edition#/windows)找到它。\n\
    \n让我们获取当前的发布版本：\n\n```bash\nhttps://download.docker.com/win/stable/InstallDocker.msi\n\
    ```\n\n启动下载的安装程序并按照指示安装 Docker for Windows。\n\n### 2.5.2 测试 Docker for Windows\n\
    \n现在我们可以通过将本地客户端连接到运行在虚拟机上的 Docker 守护进程，来测试 Docker for Windows 安装是否正常。确保 `Docker`\
    \ 正在运行，打开终端窗口并运行：\n\n```bash\n$ docker info\nContainers: 2\n Running: 0\n Paused:\
    \ 0\n Stopped: 2\nImages: 13\nServer Version: 1.12.1\nStorage Driver: aufs\n.\
    \ . .\n```\n\n漂亮！我们在 Windows 主机上本地运行了 Docker。\n\nDocker for Windows 还有很多可以使用和配置的功能，你可以在\
    \ [Docker for Windows 站点](https://docs.docker.com/docker-for-windows/)阅读其文档。\n\
    \n## 2.6 在本书的 OSX 和 Windows 上使用 Docker\n\n如果你正在遵循本书中的示例，有时你会被要求使用卷（volumes）或带有\
    \ `-v` 标志的 `docker run` 命令将本地目录挂载到 Docker 容器，这在 Windows 上可能无法工作。你无法将宿主机上的本地目录挂载到运行在\
    \ Docker 虚拟机中的 Docker 主机，因为它们不共享文件系统。如果你想使用任何涉及卷示例（例如第 5 章和第 6 章中的），我建议你在基于 Linux\
    \ 的主机上运行 Docker。\n\n阅读 [Docker for Mac 文件共享](https://docs.docker.com/docker-for-mac/#file-sharing)\
    \ 章节或 [Docker for Windows 共享驱动器](https://docs.docker.com/docker-for-windows/#shared-drives)\
    \ 章节也是值得的。这允许你通过将目录挂载到客户端应用程序来启用卷的使用。\n\n提示 书中的所有示例都假设你使用的是最新版本的 Docker for Mac\
    \ 或 Docker for Windows。\n\n## 2.7 Docker 安装脚本\n\n还有另一种方法，可以使用远程安装脚本在适当的主机上安装 Docker。要使用此脚本，我们需要从\
    \ [get.docker.com](https://get.docker.com) `curl` 它。\n\n注意 脚本目前仅支持 Ubuntu、Debian\
    \ 和 Gentoo。\n\n首先，我们需要确保已安装 `curl` 命令。\n\n```bash\n$ whereis curl\n```\n\n如有必要，我们可以使用\
    \ `apt-get` 安装 `curl`。\n\n```bash\n$ sudo apt-get -y install curl\n```\n\n或者我们可以在\
    \ Fedora 上使用 `yum` 或较新的 `dnf`。\n\n```bash\n$ sudo yum -y curl\n```\n\n现在我们可以使用脚本安装\
    \ Docker。\n\n```bash\n$ curl https://get.docker.com/ | sudo sh\n```\n\n这将确保安装所需的依赖项，并检查我们的内核版本是否合适以及是否支持存储驱动。随后将安装\
    \ Docker 并启动 Docker 守护进程。\n\n## 2.8 二进制安装\n\n如果我们不想使用任何基于包的安装方法，可以下载 Docker 的最新二进制版本。\n\
    \n```bash\n$ wget http://get.docker.com/builds/Linux/x86_64/docker-latest.tgz\n\
    ```\n\n我不建议采用这种方法，因为它降低了 Docker 安装的可维护性。使用包更加简单且更容易管理，特别是使用自动化或配置管理工具时。\n\n"
- fmt: '

    This would bind the Docker daemon to all interfaces on the host. Docker isn’t
    automatically aware of networking changes on the client side. We will need to
    specify the `-H` option to point the `docker` client at the server; for example,
    `docker -H :4200` would be required if we had changed the port to `4200`. Or,
    if we don’t want to specify the `-H` on each client call, Docker will also honor
    the content of the `DOCKER_HOST` environment variable.


    ```

    $ export DOCKER_HOST="tcp://0.0.0.0:2375"

    ```


    **Warning** By default, Docker client-server communication is not authenticated.
    This means that if you bind Docker to an exposed network interface, anyone can
    connect to the daemon. There is, however, some TLS authentication available in
    Docker 0.9 and later. You’ll see how to enable it when we look at the Docker API
    in Chapter 8.


    We can also specify an alternative Unix socket path with the `-H` flag; for example,
    to use `unix:///home/docker.sock`:


    ```

    $ sudo dockerd -H unix:///home/docker.sock

    ```


    Or we can specify multiple bindings like so:


    ```

    $ sudo dockerd -H tcp://0.0.0.0:2375 -H unix:///home/docker.sock

    ```


    **Tip** If you’re running Docker behind a proxy or corporate firewall you can
    also use the `HTTPS_PROXY`, `HTTP_PROXY`, `NO_PROXY` options to control how the
    daemon connects.


    We can also increase the verbosity of the Docker daemon by using the `-D` flag.


    ```

    $ sudo dockerd -D

    ```


    If we want to make these changes permanent, we’ll need to edit the various startup
    configurations. On SystemV-enabled Ubuntu and Debian releases, this is done by
    editing the `/etc/default/docker` file and changing the `DOCKER_OPTS` variable.


    On systemd-enabled distributions we would add an [override file](https://www.freedesktop.org/software/systemd/man/systemd.unit.html)
    at:


    `/etc/systemd/system/docker.service.d/override.conf`


    With content like:


    ```

    [Service]

    ExecStart=

    ExecStart=/usr/bin/dockerd -H ...

    ```


    In earlier Red Hat and Fedora releases, we’d edit the `/etc/sysconfig/docker`
    file.


    **Note** On other platforms, you can manage and update the Docker daemon’s starting
    configuration via the appropriate `init` mechanism.


    ### 2.9.2 Checking that the Docker daemon is running


    On Ubuntu, if Docker has been installed via package, we can check if the daemon
    is running with the Upstart `status` command:


    ```

    $ sudo status docker

    docker start/running, process 1847

    ```


    We can then start or stop the Docker daemon with the Upstart `start` and `stop`
    commands, respectively.


    ```

    $ sudo stop docker

    docker stop/waiting

    $ sudo start docker

    docker start/running, process 1892

    ```


    On systemd-enabled Ubuntu and Debian releases, as well as Red Hat and Fedora,
    we can do similarly using the `service` shortcuts.


    ```

    $ sudo service stop

    $ sudo service start

    ```


    If the daemon’t running, then the `docker` binary will fail with an error similar
    to:


    ```

    2014/05/18 20:08:32 Cannot connect to the Docker daemon. Is ''dockerd'' running?

    ```


    ### 2.10 Upgrading Docker


    After you’ve installed Docker, it is also easy to upgrade it. If you installed
    Docker using native packages via `apt-get` or `yum`, then you can also use these
    channels to upgrade it. For example, run the `apt-get update` command and then
    install the new version of Docker. We’re using the `apt-get install` command because
    the `docker-engine` (formerly `lxc-docker`) package is usually pinned.


    ```

    $ sudo apt-get update

    $ sudo apt-get install docker-engine

    ```


    ### 2.11 Docker user interfaces


    You can also potentially use a graphical interface to manage Docker once you’ve
    got it. Currently, there are a small number of user interfaces and web consoles
    available in various states of development, including:


    * [Shipyard](http://shipyard-project.com/) - Shipyard gives you the ability to
    manage Docker resources, including containers, hosts, and more from a single management
    interface. It’s open source, and the code is available from https://github.com/ehazlett/shipyard.

    * [Portainer](https://github.com/portainer/portainer) - UI for Docker is a web
    interface that allows you to interact with the Docker API. It’s written in JavaScript
    using the AngularJS framework.

    * [Kitematic](https://kitematic.com/) - is a GUI for OS X and Windows that helps
    you run Docker locally and interact with the Docker Hub. It’s a free product released
    by Docker Inc.


    ### 2.12 Summary


    In this chapter, we’ve seen how to install Docker on variety of platforms. We’ve
    also seen how to manage the Docker daemon. In the next chapter, we’re going to
    start using Docker. We’ll begin with container basics to give you an introduction
    to basic Docker operations. If you’re all set up and ready to go jump into Chapter
    3.


    # 3 Getting Started with Docker


