    ### 6.2.5 Building on top of our Tomcat application server


    Now we have the building blocks of a simple on-demand web service. Let’s look
    at how we might expand on this. To do so, we’ve built a simple Sinatra-based web
    application to automatically provision Tomcat applications via a web page. We’ve
    called this application TProv. You can see its source code on [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/6/tomcat/tprov).


    Let’s install it as a demo of how you might extend this or similar examples. First,
    we’ll need to ensure Ruby is installed. We’re going to install our TProv application
    on our Docker host because our application is going to be directly interacting
    with our Docker daemon, so that’s where we need to install Ruby.


    Note We could also install the TProv application inside a Docker container.


    ```

    $ sudo apt-get -qqy install ruby make ruby-dev build-essential

    ```


    We then install our application from a Ruby gem.


    ```

    $ sudo gem install --no-rdoc --no-ri tprov

    . . .

    Successfully installed tprov-0.0.6

    ```


    This will install the TProv application and some supporting gems.


    We then launch the application using the `tprov` binary.


    ```

    $ sudo tprov

    [2014-06-21 16:17:24] INFO  WEBrick 1.3.1

    [2014-06-21 16:17:24] INFO  ruby 1.8.7 (2011-06-30) [x86_64-linux]

    == Sinatra/1.4.5 has taken the stage on 4567 for development with backup from
    WEBrick

    [2014-06-21 16:17:24] INFO  WEBrick::HTTPServer#start: pid=14209 port=4567

    ```


    This command has launched our application; now we can browse to the TProv website
    on port `4567` of the Docker host.


    ![Our TProv web application.](images/00031.jpeg)


    Our TProv web application.


    We specify a Tomcat application name and the URL to a Tomcat WAR file. Let’s download
    a sample calendar application from:


    [https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/gwt-examples/Calendar.war](https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/gwt-examples/Calendar.war)


    And call it Calendar.


    ![Downloading a sample application.](images/00032.jpeg)


    Downloading a sample application.


    We click Submit to download the WAR file, place it into a volume, run a Tomcat
    server, and serve the WAR file in that volume. We see our instance by clicking
    on the `List instances` link.


    This shows us:


    *   The container ID.


    *   The container’s internal IP address.


    *   The interface and port it is mapped to.


    ![Listing the Tomcat instances.](images/00033.jpeg)


    Listing the Tomcat instances.


    Using this information, we check the status of our application by browsing to
    the mapped port. We can also use the `Delete?` checkbox to remove an instance.


    You can see how we achieved this by looking at [the TProv application code](https://github.com/turnbullpress/dockerbook-code/blob/master/code/6/tomcat/tprov/lib/tprov/app.rb).
    It’s a pretty simple application that shells out to the `docker` binary and captures
    output to run and remove containers.


    You’re welcome to use the TProv code or adapt or write your own , but its primary
    purpose is to show you how easy it is to extend a simple application deployment
    pipeline built with Docker.


    Warning The TProv application is pretty simple and lacks some error handling and
    tests. It’s simple code, built in an hour to demonstrate how powerful Docker can
    be as a tool for building applications and services. If you find a bug with the
    application (or want to make it better), please let me know [with an issue or
    PR here](https://github.com/turnbullpress/dockerbook-code).


    ## 6.3 A multi-container application stack


    In our last service example, we’re going full hipster by Dockerizing a Node.js
    application that makes use of the [Express framework](https://expressjs.com/)
    with a Redis back end. We’re going to demonstrate a combination of all the Docker
    features we’ve learned over the last two chapters, including networking and volumes.


    In our sample application, we’re going to build a series of images that will allow
    us to deploy a multi-container application:


    *   A Node container to serve our Node application, linked to:


    *   A Redis primary container to hold and cluster our state, linked to:


    *   Two Redis replica containers to cluster our state.


    *   A logging container to capture our application logs.


    We’re then going to run our Node application in a container with Redis in primary-replica
    configuration in multiple containers behind it.


    ### 6.3.1 The Node.js image


    Let’s start with an image that installs Node.js, our Express application, and
    the associated prerequisites.'
