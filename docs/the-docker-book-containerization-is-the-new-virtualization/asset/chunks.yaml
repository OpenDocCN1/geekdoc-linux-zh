    ## 4.8 Running your own Docker registry


    Having a public registry of Docker images is highly useful. Sometimes, however,
    we are going to want to build and store images that contain information or data
    that we don’t want to make public. There are two choices in this situation:


    *   Make use of private [repositories on the Docker Hub](https://hub.docker.com).


    *   Run your own registry behind the firewall.


    The team at Docker, Inc., have [open-sourced the code](https://docs.docker.com/registry/)
    they use to run a Docker registry, thus allowing us to build our own internal
    registry. The registry does not currently have a user interface and is only made
    available as an API service.


    Tip If you’re running Docker behind a proxy or corporate firewall you can also
    use the `HTTPS_PROXY`, `HTTP_PROXY`, `NO_PROXY` options to control how Docker
    connects.


    ### 4.8.1 Running a registry from a container


    Installing a registry from a Docker container is simple. Just run the Docker-provided
    container like so:


    ```

    $ docker run -d -p 5000:5000 --name registry registry:2

    ```


    This will launch a container running version 2.0 of the registry application and
    bind port 5000 to the local host.


    Tip If you’re running an older version of the Docker Registry, prior to 2.0, you
    can use the [Migrator](https://github.com/docker/migrator) tool to upgrade to
    a new registry.


    ### 4.8.2 Testing the new registry


    So how can we make use of our new registry? Let’s see if we can upload one of
    our existing images, the `jamtur01/static_web` image, to our new registry. First,
    let’s identify the image’s ID using the `docker images` command.


    ```

    $ sudo docker images jamtur01/static_web

    REPOSITORY           TAG     ID            CREATED         SIZE

    jamtur01/static_web  latest  22d47c8cb6e5  24 seconds ago  12.29 kB (virtual 326
    MB)

    ```


    Next we take our image ID, `22d47c8cb6e5`, and tag it for our new registry. To
    specify the new registry destination, we prefix the image name with the hostname
    and port of our new registry. In our case, our new registry has a hostname of
    `docker.example.com`.


    ```

    $ sudo docker tag 22d47c8cb6e5 docker.example.com:5000/jamtur01/static_web

    ```


    After tagging our image, we can then push it to the new registry using the `docker
    push` command:


    ```

    $ sudo docker push docker.example.com:5000/jamtur01/static_web

    The push refers to a repository [docker.example.com:5000/jamtur01/static_web]
    (len: 1)

    Processing checksums

    Sending image list

    Pushing repository docker.example.com:5000/jamtur01/static_web (1 tags)

    Pushing 22d47c8cb6e556420e5d58ca5cc376ef18e2de93b5cc90e868a1bbc8318c1c

    Buffering to disk 58375952/? (n/a)

    Pushing 58.38 MB/58.38 MB (100%)

    . . .

    ```


    The image is then posted in the local registry and available for us to build new
    containers using the `docker run` command.


    ```

    $ sudo docker run -t -i docker.example.com:5000/jamtur01/static_web /bin/bash

    ```


    This is the simplest deployment of the Docker registry behind your firewall. It
    doesn’t explain how to configure the registry or manage it. To find out details
    like configuring authentication, how to manage the backend storage for your images
    and how to manage your registry see the full configuration and deployments details
    in the [Docker Registry deployment documentation](https://docs.docker.com/registry/deploying/).


    ## 4.9 Alternative Indexes


    There are a variety of other services and companies out there starting to provide
    custom Docker registry services.


    ### 4.9.1 Quay


    The [Quay](https://quay.io/) service provides a private hosted registry that allows
    you to upload both public and private containers. Unlimited public repositories
    are currently free. Private repositories are available in a series of scaled plans.
    The Quay product has recently been acquired by [CoreOS](https://coreos.com/) and
    will be integrated into that product.


    ## 4.10 Summary


    In this chapter, we’ve seen how to use and interact with Docker images and the
    basics of modifying, updating, and uploading images to the Docker Hub. We’ve also
    learned about using a `Dockerfile` to construct our own custom images. Finally,
    we’ve discovered how to run our own local Docker registry and some hosted alternatives.
    This gives us the basis for starting to build services with Docker.


    We’ll use this knowledge in the next chapter to see how we can integrate Docker
    into a testing workflow and into a Continuous Integration lifecycle.


    # 5 Testing with Docker


    We’ve learned a lot about the basics of Docker in the previous chapters. We’ve
    learned about images, the basics of launching, and working with containers. Now
    that we’ve got those basics down, let’s try to use Docker in earnest. We’re going
    to start by using Docker to help us make our development and testing processes
    a bit more streamlined and efficient.


    To demonstrate this, we’re going to look at three use cases:


    *   Using Docker to test a static website.


    *   Using Docker to build and test a web application.


    *   Using Docker for Continuous Integration.


    Note We’re using Jenkins for CI because it’s the platform I have the most experience
    with, but you can adapt most of the ideas contained in those sections to any CI
    platform.


    In the first two use cases, we’re going to focus on local, developer-centric developing
    and testing, and in the last use case, we’ll see how Docker might be used in a
    broader multi-developer lifecycle for build and test.


    This chapter will introduce you to using Docker as part of your daily life and
    workflow, including useful concepts like connecting Docker containers. The chapter
    contains a lot of useful information on how to run and manage Docker in general,
    and I recommend you read it even if these use cases aren’t immediately relevant
    to you.


    ## 5.1 Using Docker to test a static website


    One of the simplest use cases for Docker is as a local web development environment.
    Such an environment allows you to replicate your production environment and ensure
    what you develop will also likely run in production. We’re going to start with
    installing the Nginx web server into a container to run a simple website. Our
    website is originally named Sample.


    ### 5.1.1 An initial Dockerfile for the Sample website


    To do this, let’s start with creating some structure, some configuration files
    for our container and a `Dockerfile` from which to build our image. We start by
    creating a directory to hold our `Dockerfile` first.


    ```

    $ mkdir sample

    $ cd sample

    ```


    We’re also going to need some Nginx configuration files to run our website. We
    can download some example files I’ve prepared earlier from GitHub into the `sample`
    directory.


    ```

    $ wget https://raw.githubusercontent.com/jamtur01/dockerbook-code/master/code/5/sample/nginx/global.conf

    $ wget https://raw.githubusercontent.com/jamtur01/dockerbook-code/master/code/5/sample/nginx/nginx.conf

    ```


    Now let’s look at the `Dockerfile` you’re going to create for our Sample website.


    ```

    FROM ubuntu:16.04

    LABEL maintainer="james@example.com"

    ENV REFRESHED_AT 2016-06-01

    RUN apt-get -yqq update; apt-get -yqq install nginx

    RUN mkdir -p /var/www/html/website

    ADD global.conf /etc/nginx/conf.d/

    ADD nginx.conf /etc/nginx/nginx.conf

    EXPOSE 80

    ```


    Here we’ve written a `Dockerfile` that:


    *   Installs Nginx.


    *   Creates a directory, `/var/www/html/website/`, in the container.


    *   Adds the Nginx configuration from the local files we downloaded to our image.


    *   Exposes port `80` on the image.


    Our two Nginx configuration files configure Nginx for running our Sample website.
    The `global.conf` file is copied into the `/etc/nginx/conf.d/` directory by the
    `ADD` instruction. The `global.conf` configuration file specifies:


    ```

    server {

    listen  0.0.0.0:80;

    server_name     _;


    root    /var/www/html/website;

    index   index.html index.htm;


    access_log      /var/log/nginx/default_access.log;

    error_log       /var/log/nginx/default_error.log;

    }

    ```'
