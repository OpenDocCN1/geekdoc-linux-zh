    \ work inside our Docker container. To do this, the `nginx.conf` file is copied\
    \ into the `/etc/nginx/` directory and contains:\n\n```\nuser www-data;\nworker_processes\
    \ 4;\npid /run/nginx.pid;\ndaemon off;\n\nevents {  }\n\nhttp {\n  sendfile on;\n\
    \  tcp_nopush on;\n  tcp_nodelay on;\n  keepalive_timeout 65;\n  types_hash_max_size\
    \ 2048;\n  include /etc/nginx/mime.types;\n  default_type application/octet-stream;\n\
    \  access_log /var/log/nginx/access.log;\n  error_log /var/log/nginx/error.log;\n\
    \  gzip on;\n  gzip_disable \"msie6\";\n  include /etc/nginx/conf.d/*.conf;\n\
    }\n```\n\nIn this configuration file, the `daemon off;` option stops Nginx from\
    \ going into the background and forces it to run in the foreground. This is because\
    \ Docker containers rely on the running process inside them to remain active.\
    \ By default, Nginx daemonizes itself when started, which would cause the container\
    \ to run briefly and then stop when the daemon was forked and launched and the\
    \ original process that forked it stopped.\n\nThis file is copied to `/etc/nginx/nginx.conf`\
    \ by the `ADD` instruction.\n\nYou’ll also see a subtle difference between the\
    \ destinations of the two `ADD` instructions. The first ends in the directory,\
    \ `/etc/nginx/conf.d/`, and the second in a specific file `/etc/nginx/nginx.conf`.\
    \ Both styles are accepted ways of copying files into a Docker image.\n\nNote\
    \ You can find all the code and sample configuration files for this on [Docker\
    \ Book GitHub site](https://github.com/turnbullpress/dockerbook-code). You will\
    \ need to specifically download or copy and paste the `nginx.conf` and `global.conf`\
    \ configuration files into the `nginx` directory we created to make them available\
    \ for the `docker build`.\n\n### 5.1.2 Building our Sample website and Nginx image\n\
    \nFrom this `Dockerfile`, we can build ourselves a new image with the `docker\
    \ build` command; we’ll call it `jamtur01/nginx`.\n\n```\n$ sudo docker build\
    \ -t jamtur01/nginx .\n```\n\nThis will build and name our new image, and you\
    \ should see the build steps execute. We can take a look at the steps and layers\
    \ that make up our new image using the `docker history` command.\n\n```\n$ sudo\
    \ docker history jamtur01/nginx\nIMAGECREATED     CREATED BY    SIZE\nf99cb0a6726d\
    \ 7 secs ago  /bin/sh -c #(nop) EXPOSE 80/tcp       0 B\nd0741c80034e 7 secs ago\
    \  /bin/sh -c #(nop) ADD file:d6698a182fafaf3cb0 415 B\nf1b8d3ab6b4f 8 secs ago\
    \  /bin/sh -c #(nop) ADD file:9778ae1b43896011cc 286 B\n4e88da941d2b About a min\
    \ /bin/sh -c mkdir -p /var/www/html/website     0 B\n1224c6db31b7 About a min\
    \ /bin/sh -c apt-get -yqq update; apt-get -yq 39.32 MB\n2cfbed445367 About a min\
    \ /bin/sh -c #(nop) ENV REFRESHED_AT=2016-06-01 0 B\n6b5e0485e5fa About a min\
    \ /bin/sh -c #(nop) LABEL maintainer= \" 0 B\n91e54dfb1179 2 days ago  /bin/sh\
    \ -c #(nop) CMD [\"/bin/bash\"]   0 B\nd74508fb6632 2 days ago  /bin/sh -c sed\
    \ -i 's/^#\\s*\\(deb.*universe\\)$/ 1.895 kB\nc22013c84729 2 days ago  /bin/sh\
    \ -c echo '#!/bin/sh' > /usr/sbin/polic 194.5 kB\nd3a1f33e8a5a 2 days ago  /bin/sh\
    \ -c #(nop) ADD file:5a3f9e9ab88e725d60 188.2 MB\n```\n\nThe history starts with\
    \ the final layer, our new `jamtur01/nginx` image and works backward to the original\
    \ parent image, `ubuntu:16.04`. Each step in between shows the new layer and the\
    \ instruction from the `Dockerfile` that generated it.\n\n### 5.1.3 Building containers\
    \ from our Sample website and Nginx image\n\nWe can now take our `jamtur01/nginx`\
    \ image and start to build containers from it, which will allow us to test our\
    \ Sample website. To do that we need to add the Sample website’s code. Let’s download\
    \ it now into the `sample` directory.\n\n```\n$ mkdir website; cd website\n$ wget\
    \ https://raw.githubusercontent.com/jamtur01/dockerbook-code/master/code/5/sample/website/index.html\n\
    $ cd ..\n```\n\nThis will create a directory called `website` inside the `sample`\
    \ directory. We then download an `index.html` file for our Sample website into\
    \ that `website` directory.\n\nNow let’s look at how we might run a container\
    \ using the `docker run` command.\n\n```\n$ sudo docker run -d -p 80 --name website\
    \ \\\n-v $PWD/website:/var/www/html/website \\\njamtur01/nginx nginx\n```\n\n\
    Note You can see we’ve passed the `nginx` command to `docker run`. Normally this\
    \ wouldn’t make Nginx run interactively. In the configuration we supplied to Docker,\
    \ though, we’ve added the directive `daemon off`. This directive causes Nginx\
    \ to run interactively in the foreground when launched.\n\nYou can see we’ve used\
    \ the `docker run` command to build a container from our `jamtur01/nginx` image\
    \ called `website`. You will have seen most of the options before, but the `-v`\
    \ option is new. This new option allows us to create a volume in our container\
    \ from a directory on the host.\n\nLet’s take a brief digression into volumes,\
    \ as they are important and useful in Docker. Volumes are specially designated\
    \ directories within one or more containers that bypass the layered Union File\
    \ System to provide persistent or shared data for Docker. This means that changes\
    \ to a volume are made directly and bypass the image. They will not be included\
    \ when we commit or build an image.\n\nTip Volumes can also be shared between\
    \ containers and can persist even when containers are stopped. We’ll see how to\
    \ make use of this for data management in later chapters.\n\nIn our immediate\
    \ case, we see the value of volumes when we don’t want to bake our application\
    \ or code into an image. For example:\n\n*   We want to work on and test it simultaneously.\n\
    \n*   It changes frequently, and we don’t want to rebuild the image during our\
    \ development process.\n\n*   We want to share the code between multiple containers.\n\
    \nThe `-v` option works by specifying a directory or mount on the local host separated\
    \ from the directory on the container with a `:`. If the container directory doesn’t\
    \ exist Docker will create it.\n\nWe can also specify the read/write status of\
    \ the container directory by adding either `rw` or `ro` after that directory,\
    \ like so:\n\n```\n$ sudo docker run -d -p 80 --name website \\\n-v $PWD/website:/var/www/html/website:ro\
    \ \\\njamtur01/nginx nginx\n```\n\nThis would make the container directory `/var/www/html/website`\
    \ read-only.\n\nIn our Nginx website container, we’ve mounted a local website\
    \ we’re developing. To do this we’ve mounted, as a volume, the directory `$PWD/website`\
    \ to `/var/www/html/website` in our container. In our Nginx configuration (in\
    \ the `/etc/nginx/conf.d/global.conf` configuration file), we’ve specified this\
    \ directory as the location to be served out by the Nginx server.\n\nTip The `website`\
    \ directory we’re using is contained in the source code for this book on GitHub\
    \ [here](https://github.com/turnbullpress/dockerbook-code/tree/master/code/5/sample).\
    \ You can see the `index.html` file we downloaded inside that directory.\n\nNow,\
    \ if we look at our running container using the `docker ps` command, we see that\
    \ it is active, it is named `website`, and port `80` on the container is mapped\
    \ to port `49161` on the host.\n\n```\n$ sudo docker ps -l\nCONTAINER ID  IMAGE\
    \ ... PORTS  NAMES\n6751b94bb5c0  jamtur01/nginx:latest ... 0.0.0.0:49161->80/tcp\
    \  website\n```\n\nIf we browse to port `49161` on our Docker host, we’ll be able\
    \ to see our Sample website displayed.\n\n![Browsing the Sample website.](images/00012.jpeg)\n\
    \nBrowsing the Sample website.\n\n### 5.1.4 Editing our website\n\nNeat! We’ve\
    \ got a live site. Now what happens if we edit our website? Let’s open up the\
    \ `index.html` file in the `sample/website` folder on our local host and edit\
    \ it.\n\n```\n$ cd sample\n$ vi $PWD/website/index.html\n```\n\nWe’ll change the\
    \ title from:\n\n```\nThis is a test website\n```\n\nTo:\n\n```\nThis is a test\
    \ website for Docker\n```\n\nLet’s refresh our browser and see what we’ve got\
    \ now.\n\n![Browsing the edited Sample website.](images/00013.jpeg)\n\nBrowsing\
    \ the edited Sample website."
