  trans: "\n\n如果你想为 Docker Engine 贡献代码，现在可以使用 `make` 和 Docker 来构建开发环境。Docker 源码附带了一个\
    \ `Dockerfile`，我们使用它安装构建和测试 Docker 所需的所有构建和运行时依赖。\n\n```bash\n$ cd moby\n$ sudo\
    \ make build\n```\n\n提示 此命令在第一次执行时将需要一些时间才能完成。它可能需要至少具有 2Gb 内存的主机来运行开发构建。\n\n\
    此命令将创建一个完整的、可运行的 Docker 开发环境。它会将当前源码目录作为 Docker 镜像的构建上下文（build context），构建包含 Go\
    \ 以及其他所需依赖的镜像，然后从该镜像启动容器。\n\n使用此开发镜像，我们还会创建一个 Docker 二进制文件来测试任何修复程序或新功能。我们再次使用\
    \ `make` 工具来实现。\n\n```bash\n$ sudo make binary\n```\n\n此命令分别将在 `./bundles/<version>-dev/binary-client/`\
    \ 和 `./bundles/<version>-dev/binary-daemon/` 卷中创建 `docker` 和 `dockerd` 二进制文件。例如，我们将如下创建一个客户端二进制文件和相关的校验和：\n\
    \n```bash\n$ ls -l bundles/1.13.0-dev/binary-client/\ntotal 15344\nlrwxrwxrwx\
    \ 1 root root       17 Aug  9 13:59 docker -> docker-1.13.0-dev\n-rwxr-xr-x 1\
    \ root root 15700192 Aug  9 13:59 docker-1.13.0-dev\n-rw-r--r-- 1 root root  \
    \     52 Aug  9 13:59 docker-1.13.0-dev.md5\n-rw-r--r-- 1 root root       84 Aug\
    \  9 13:59 docker-1.13.0-dev.sha256\n```\n\n你随后可以通过运行该二进制文件而不是本地 Docker 守护进程来对其实时测试。要做到这一点，我们需要停止\
    \ Docker 并运行这个新的二进制文件。\n\n```bash\n$ sudo service docker stop\n$ ~/moby/bundles/1.13.0-dev/binary-daemon/dockerd\n\
    ```\n\n这将交互式地运行开发版 Docker 守护进程。如果你需要，也可以让守护进程在后台运行。\n\n我们随后可以通过针对该守护进程运行 `docker`\
    \ 二进制文件来进行测试。\n\n```bash\n$ ~/moby/bundles/1.13.0-dev/binary-client/docker version\n\
    Client:\n Version:      1.13.0-dev\n API version:  1.25\n Go version:   go1.6.3\n\
    \ Git commit:   04e021d\n Built:        Tue Aug  9 13:58:52 2016\n OS/Arch:  \
    \    linux/amd64\n\nServer:\n Version:      1.13.0-dev\n API version:  1.25\n\
    \ Go version:   go1.6.3\n Git commit:   04e021d\n Built:        Tue Aug  9 13:58:52\
    \ 2016\n OS/Arch:      linux/amd64\n```\n\n你可以看到我们正在运行一个 `1.13.0-dev` 客户端（即该二进制文件），针对我们刚刚启动的\
    \ `1.13.0-dev` 守护进程。你可以使用这种组合来测试并确保你对 Docker 源码所做的更改都能正常工作。\n\n### 9.3.6 运行测试\n\
    \n在向上游回传代码之前，确保所有 Docker 测试都通过也是同样重要的。要执行所有测试，你需要运行此命令：\n\n```bash\n$ sudo make\
    \ test\n```\n\n此命令将再次将当前源码作为构建上下文上传到镜像，然后创建一个开发镜像。容器将从该镜像启动，测试将在其内部运行。同样，初始构建可能需要一些时间。\n\
    \n如果测试成功，输出的结尾应该像如下所示：\n\n```\n. . .\n[PASSED]: save - save a repo using stdout\n\
    [PASSED]: load - load a repo using stdout\n[PASSED]: save - save a repo using\
    \ -o\n[PASSED]: load - load a repo using -i\n[PASSED]: tag - busybox -> testfoobarbaz\n\
    [PASSED]: tag - busybox's image ID -> testfoobarbaz\n[PASSED]: tag - busybox fooo/bar\n\
    [PASSED]: tag - busybox fooaa/test\n[PASSED]: top - sleep process should be listed\
    \ in non privileged mode\n[PASSED]: top - sleep process should be listed in privileged\
    \ mode\n[PASSED]: version - verify that it works and that the output is properly\
    \ formatted\nPASS\nPASS    github.com/docker/docker/integration-cli    178.685s\n\
    ```\n\n提示 你可以使用 `$TESTFLAGS` 环境变量来向测试运行传递参数。\n\n### 9.3.7 在我们的开发环境中使用 Docker\n\
    \n你也可以在新构建的开发容器内部启动交互式会话：\n\n```bash\n$ sudo make shell\n```\n\n要退出容器，请输入 `exit`\
    \ 或按 `Ctrl-D`。\n\n### 9.3.8 提交 pull request\n\n如果你对你的文档更新、bug 修复或新功能感到满意，可以在 GitHub\
    \ 上为它们提交拉取请求（pull request）。要执行此操作，你应该 fork Docker 仓库并在你的 fork 的功能分支上进行更改：\n\n\
    - 如果是 bug 修复，将其命名为 `XXXX-something`，其中 `XXXX` 是问题号。\n- 如果是新功能，将其命名为 `XXXX-something`，其中\
    \ `XXXX` 是问题号。\n\n在提交 pull request 之前，你应该始终运行测试套件。我们还有一些简单的规则可以帮助你的 pull request\
    \ 被快速审核：\n\n最后，Docker 项目使用开发者贡献证明（DCO）来验证你提交的任何代码是你编写的，或者你有权将其作为开源补提交提交你可以在这里了解我们为什么要这样做：[`blog.docker.com/2014/01/docker-contributions-require-of-origin/`](http://blog.docker.com/2014/01/docker-contributions-require-of-origin/)。证书很容易申请。你只需要在每个\
    \ Git 提交中添加一行即可。\n\n```\nDocker-DCO-1.1-Signed-off-by: Joe Smith <joe.smith@email.com>\
    \ (github: github_handle)\n```\n\n注意 你必须使用真实姓名。由于法律原因，我们不允许笔名或匿名贡献。\n\n签名要求有几个小例外。目前包括：\n\
    \n- 你的补丁修复了拼写或语法错误。\n- 你的补丁是对文档仓库中内容的单行更改。\n- 你的补丁修复了文档仓库中的 Markdown 格式或语法错误。\n\
    \n使用 `git commit -s` 命令也很容易自动为你的 Git 提交签名。\n\n注意 签名脚本期望在 `git config --get github.user`\
    \ 中找到你的 GitHub 用户。你可以通过 `git config --set github.user username` 命令设置此选项。\n\n###\
    \ 9.3.9 合并审批与维护者\n\n一旦你提交了 pull request，它将通过审核，你可能会收到反馈。Docker 使用了类似于 Linux 内核的维护者系统。Docker\
    \ 内部每个组件都由一个或多个维护者管理，他们负责确保该组件的质量、稳定性和方向。\n\n"
- fmt: '

    Docker maintainers use the shorthand `LGTM` (or Looks Good To Me) in comments
    on the code review to indicate acceptance of a pull request. A change requires
    `LGTM`s from an absolute majority of the maintainers of each component affected
    by the changes (or for documentation - a minimum of two maintainers). If a change
    affects Documentation and `registry/`, then it needs two maintainers of Documentation
    and an absolute majority of the maintainers of `registry/`.


    **Tip**: For more details, see [the maintainer process](https://github.com/docker/docker/blob/master/MAINTAINERS)
    documentation.


    ## 9.4 Summary


    In this chapter, we’ve learned about how to get help with Docker and the places
    where useful Docker community members and developers hang out. We’ve also learned
    about the best way to log an issue with Docker, including the sort of information
    you need to provide to get the best response.


    We’ve also seen how to set up a development environment to work on the Docker
    source or documentation and how to build and test inside this environment to ensure
    your fix or feature works. Finally, we’ve learned about how to create a properly
    structured and good-quality pull request with your update.

    '
