  trans: "\n\n我们指定了工作目录为 `/opt/logstash`。最后，我们指定了 `ENTRYPOINT` 为 `bin/logstash`，并指定\
    \ `CMD` 为 `--config=/etc/logstash.conf` 以传递我们的命令标志。这将启动 Logstash 并加载我们的 `/etc/logstash.conf`\
    \ 配置文件。\n\n现在来构建我们的 Logstash 镜像。\n\n```\n$ sudo docker build -t jamtur01/logstash\
    \ .\n```\n\n现在我们已经构建了 Logstash 镜像，基于它启动一个容器。\n\n```\n$ sudo docker run -d --name\
    \ logstash \\\n--volumes-from redis_primary \\\n--volumes-from nodeapp \\\njamtur01/logstash\n\
    ```\n\n我们启动了一个名为 `logstash` 的新容器，并两次指定了 `--volumes-from` 标志以从 `redis_primary`\
    \ 和 `nodeapp` 获取卷。这使得我们能够访问 Node 和 Redis 的日志文件。任何到这些文件的事件都将反映在 `logstash` 容器的卷中，并传递给\
    \ Logstash 处理。\n\n让我们再次访问我们的 Web 应用并刷新它以生成一个事件。我们应该能在 `logstash` 容器的 `docker logs`\
    \ 输出中看到该事件。\n\n```\n{\n       \"message\" => \"::ffff:198.179.69.250 - - [Fri,\
    \ 05 Aug 2016 16:39:25 GMT] \\\"GET / HTTP/1.1\\\" 200 20 \\\"-\\\" \\\"Mozilla/5.0\
    \ (Macintosh; Intel Mac OS X 10_11_6) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/51.0.2704.103\
    \ Safari/537.36\\\"\",\n      \"@version\" => \"1\",\n    \"@timestamp\" => \"\
    2016-08-05T16:39:25.945Z\",\n          \"host\" => \"1bbc26b1ed7d\",\n       \
    \   \"path\" => \"/var/log/nodeapp/nodeapp.log\",\n          \"type\" => \"syslog\"\
    \n}\n```\n\n现在，我们的 Node 和 Redis 容器正在将日志记录到 Logstash。在生产环境中，我们会将这些事件发送到 Logstash\
    \ 服务器并将其存储在 Elasticsearch 中。我们还可以轻松地将 Redis 副本容器或解决方案的其他组件添加到我们的日志环境中。\n\n注意：如果我们需要，也可以通过卷进行\
    \ Redis 备份。\n\n### 6.3.8 我们的 Node 栈总结\n\n我们现在已经看到了一个多容器应用栈。我们使用了 Docker 网络将应用程序连接在一起，并使用\
    \ Docker 卷来帮助管理应用程序的各个方面。我们可以在此基础上构建出更复杂的应用程序和架构。\n\n## 6.4 在没有 SSH 的管理 Docker\
    \ 容器\n\n最后，在结束关于使用 Docker 运行服务的章节之前，理解管理 Docker 容器的一些方法以及这些方法与传统管理技术的区别是非常关重要的。\n\
    \n传统上，在管理服务时，我们习惯于 SSH 登录到环境或虚拟机进行管理。在 Docker 世界中，大多数容器运行单个进程，这种访问权限是不可用的。正如我们很多时候所看到的，这种访问并不是必需的：我们将使用卷或网络来执行许多相同的操作。例如，如果我们的服务通过网络接口管理，我们会在容器上暴露它；如果我们的服务通过\
    \ Unix 套接字管理，我们通过卷来暴露它。如果我们需要向 Docker 容器发送信号，我们使用 `docker kill` 命令，如下所示：\n\n```\n\
    $ sudo docker kill -s <signal> <container>\n```\n\n这将你请求的特定信号（例如 `HUP`）发送给目标容器，而不是杀死容器。\n\
    \n然而，有时我们确实需要登录容器。但为了这一点，我们不需要运行 SSH 服务或打开任何访问权限。我们可以使用 `docker exec` 命令。\n\n\
    注意：Docker 1.3 中引入的 `docker exec` 命令取代了之前的工具 `nsenter`。\n\n```\n$ sudo docker exec\
    \ -ti nodeapp /bin/bash\n```\n\n这将在我们的 `nodeapp` 容器内部启动一个交互式的 Bash 壳。\n\n## 6.5\
    \ 总结\n\n在本章中，我们学习了如何使用 Docker 容器构建一些示例生产服务。我们更多地了解了如何构建多容器服务并管理这些栈。我们结合了 Docker\
    \ 网络和卷等功能，并学习了如何扩展这些功能以为我们提供日志记录和备份等能力。\n\n在下一章中，我们将学习使用 Docker Compose、Docker\
    \ Swarm 和 Consul 工具使用 Docker 进行编排。\n\n# 7 Docker 编排与服务发现\n\n编排是一个定义相当模糊的术语。广义上，它是服务的自动化配置、协调和管理的过程。在\
    \ Docker 世界中，我们用它来描述围绕运行多个 Docker 容器以及可能跨越多个 Docker 主机的应用程序的一系列实践。原生编排在 Docker\
    \ 社区中处于起步阶段，但一个令人兴奋的工具生态系统正在整合和开发。\n\n在当前的生态系统中，各种工具正在被构建与 Docker 集成。其中一些工具的设计目的仅仅是优雅地将多个容器“连接”在一起，并使用简单的组合构建应用栈。其他工具则提供了多个\
    \ Docker 主机之间更大规模的协调，以及复杂的服务发现、调度和执行能力。\n\n这些领域的每一个都真的值得写一本书，但我们专注于了一些实用的工具，让你对在编排时可以实现的内容有所了解。在本章中我们将关注三个领域：\n\
    \n- **简单的容器编排**：在这里我们将 [Docker Compose](https://docs.docker.com/compose/)。Docker\
    \ Compose（以前称为 Fig）是由 Orchard 团队开发并在 2014 年被 Docker 收取的开源工具。它用 Python 编写并采用 Apache\
    \ 2.0 许可证。\n- **分布式服务发现**：在这里我们将介绍 [Consul](http://www.consul.io/)。Consul 也是开源的，采用\
    \ Mozilla Public License，用 Go 编写。它为 Docker 提供分布式的高可用服务发现。\n- **Docker 的编排与集群**：在这里我们将查看\
    \ [Swarm](https://docs.docker.com/swarm/)。Swarm 是开源的，采用 Apache 2.0 许可证，用 Go 编写。从\
    \ Docker 1.12 开始，Docker 引擎内置了 Swarm 模式，我们将在以后介绍。\n\n提示：在本章后面还将讨论许多其他编排工具。\n\n\
    ## 7.1 Docker Compose\n\n现在让我们熟悉 Docker Compose。通过 Docker Compose，我们在 YAML 文件中定义一组启动的容器及其运行时属性。Docker\
    \ Compose 将这些容器中的每一个称为“服务”，即：\n\n以某种方式与其他容器交互并具有特定属性的容器。\n\n我们将带你安装 Docker Compose，然后使用它构建简单的多容器应用栈。\n\
    \n### 7.1.1 安装 Docker Compose\n\n我们从安装 Docker Compose 开始。Docker Compose 目前适用于\
    \ Linux、Windows 和 OS。它可以直接作为二进制文件安装，也可以通过 Docker Desktop 用于 Mac 或 Windows 安装。\n\
    \n要在 Linux 上安装 Docker Compose，我们可以从 GitHub 获取 Docker Compose 二进制文件并将其设置为可执行。像\
    \ Docker 一样，Docker Compose 目前支持 64 位 Linux 安装。我们需要 `curl` 命令来完成此操作。\n\n```\n$\
    \ sudo curl -L \"https://github.com/docker/compose/releases/download/$(curl -sL\
    \ https://api.github.com/repos/docker/compose/releases/latest | grep tag_name\
    \ | cut -d'\"' -f 4)/docker-compose-$(uname -s)-$(uname -m)\" -o /usr/local/bin/docker-compose\n\
    $ sudo chmod +x /usr/local/bin/docker-compose\n```\n\n这将从 GitHub 下载 `docker-compose`\
    \ 二进制文件并安装到 `/usr/local/bin` 目录。我们还使用了 `chmod` 命令使 `docker-compose` 二进制文件具有执行权限。\n\
    \n"
- fmt: "\nIf we’re on OS X Docker Compose comes bundled with Docker for Mac or we\
    \ can install it like so:\n\n```bash\n$ sudo bash -c \"curl -L https://github.com/docker/compose/releases/download/1.17.1/docker-compose-Darwin-x86_64\
    \ > /usr/local/bin/docker-compose\"\n$ sudo chmod +x /usr/local/bin/docker-compose\n\
    ```\n\nTip Replace the `1.17.1` with the release number of the current Docker\
    \ Compose release.\n\nIf we’re on Windows Docker Compose comes bundled inside\
    \ Docker for Windows.\n\nOnce you have installed the `docker-compose` binary you\
    \ can test it’s working using the `docker-compose` command with the `--version`\
    \ flag:\n\n```bash\n$ docker-compose --version\ndocker-compose version 1.17.1,\
    \ build f3628c7\n```\n\nNote If you’re upgrading from a pre-1.3.0 release you’ll\
    \ need to migrate any existing container to the new 1.3.0 format using the `docker-compose\
    \ migrate-to-labels` command.\n\n### 7.1.2 Getting our sample application\n\n\
    To demonstrate how Compose works we’re going to use a sample Python Flask application\
    \ that combines two containers:\n\n* An application container running our sample\
    \ Python application.\n* A container running the Redis database.\n\nLet’s start\
    \ with building our sample application. Firstly, we create a directory and a `Dockerfile`.\n\
    \n```bash\n$ mkdir composeapp\n$ cd composeapp\n```\n\nHere we’ve created a directory\
    \ to hold our sample application, which we’re calling `composeapp`.\n\nNext, we\
    \ need to add our application code. Let’s create a file called `app.py` in the\
    \ `composeapp` directory and add the following Python code to it.\n\n```python\n\
    from flask import Flask\nfrom redis import Redis\nimport os\n\napp = Flask(__name__)\n\
    redis = Redis(host=\"redis\", port=6379)\n\n@app.route('/')\ndef hello():\n  \
    \  redis.incr('hits')\n    return 'Hello Docker Book reader! I have been seen\
    \ {0} times'.format(redis.get('hits'))\n\nif __name__ == \"__main__\":\n    app.run(host=\"\
    0.0.0.0\", debug=True)\n```\n\nTip You can find this source code [on GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/7/composeapp).\n\
    \nThis simple Flask application tracks a counter stored in Redis. The counter\
    \ is incremented each time the root URL, `/`, is hit.\n\nWe also need to create\
    \ a `requirements.txt` file to store our application’s dependencies. Let’s create\
    \ that file now and add the following dependencies.\n\n```text\nflask\nredis\n\
    ```\n\nNow let’s populate our Compose `Dockerfile`.\n\n```dockerfile\n# Compose\
    \ Sample application image\nFROM python:2.7\nLABEL maintainer=\"james@example.com\"\
    \nENV REFRESHED_AT 2016-06-01\n\nADD . /composeapp\n\nWORKDIR /composeapp\n\n\
    RUN pip install -r requirements.txt\n```\n\nOur `Dockerfile` is simple. It is\
    \ based on the `python:2.7` image. We add our `app.py` and `requirements.txt`\
    \ files into a directory in the image called `/composeapp`. The `Dockerfile` then\
    \ sets the working directory to `/composeapp` and runs the `pip` installation\
    \ process to install our application’s dependencies: `flask` and `redis`.\n\n\
    Let’s build that image now using the `docker build` command.\n\n```bash\n$ sudo\
    \ docker build -t jamtur01/composeapp .\nSending build context to Docker daemon\
    \  16.9 kB\nSending build context to Docker daemon\nStep 0 : FROM python:2.7\n\
    \ ---> 1c8df2f0c10b\nStep 1 : LABEL maintainer=\"james@example.com\"\n ---> Using\
    \ cache\n ---> aa564fe8be5a\nStep 2 : ADD . /composeapp\n ---> c33aa147e19f\n\
    Removing intermediate container 0097bc79d37b\nStep 3 : WORKDIR /composeapp\n --->\
    \ Running in 76e5ee8544b3\n ---> d9da3105746d\nRemoving intermediate container\
    \ 76e5ee8544b3\nStep 4 : RUN pip install -r requirements.txt\n ---> Running in\
    \ e71d4bb33fd2\nDownloading/unpacking flask (from -r requirements.txt (line 1))\n\
    . . .\nSuccessfully installed flask redis Werkzeug Jinja2 itsdangerous markupsafe\n\
    Cleaning up...\n ---> bf0fe6a69835\nRemoving intermediate container e71d4bb33fd2\n\
    Successfully built bf0fe6a69835\n```\n\nThis will build a new image called `jamtur01/composeapp`\
    \ containing our sample application and its required dependencies. We can now\
    \ use Compose to deploy our application.\n\nNote We’ll be using a Redis container\
    \ created from the default Redis image on the Docker Hub so we don’t need to build\
    \ or customize that.\n\n### 7.1.3 The `docker-compose.yml` file\n\nNow we’ve got\
    \ our application image built we can configure Compose to create both the services\
    \ we require. With Compose, we define a set of services (in the form of Docker\
    \ containers) to launch. We also define the runtime properties we want these services\
    \ to start with, much as you would do with the `docker run`.\n\nWe create a `docker-compose.yml`\
    \ file in the `composeapp` directory.\n\n```bash\n$ touch docker-compose.yml\n\
    ```\n\nNow we populate our `docker-compose.yml` file.\n\n```yaml\nversion: '3'\n\
    services:\n  web:\n    build: .\n    image: jamtur01/composeapp\n    command:\
    \ python.py\n    ports:\n      - \"5000:5000\"\n    volumes:\n      - .:/composeapp\n\
    \  redis:\n    image: redis\n```\n\nThis defines our two services. You can see\
    \ a full list of the available instructions you can use in the `docker-compose.yml`\
    \ file [in the Docker Compose documentation](https://docs.docker.com/compose/compose-file/).\n\
    \n### 7.1.4 Running Compose\n\nOnce we’ve specified our services in `docker-compose.yml`\
    \ we use the `docker-compose up` command to execute them both.\n\n```bash\n$ cd\
    \ composeapp\n$ sudo docker-compose up\nCreating network \"composeapp_default\"\
    \ with the default driver\nRecreating composeapp_web_1 ...\nRecreating composeapp_web_1\n\
    Recreating composeapp_redis_1 ...\nRecreating composeapp_web_1 ... done\nAttaching\
    \ to composeapp_redis_1, composeapp_web_1\nweb_1    |  * Running on http://0.0.0.0:5000/\
    \ (Press CTRL+C to quit)\n. . .\n```\n\nTip You must be inside the directory with\
    \ the `docker-compose.yml` file in order to execute most Compose commands.\n\n\
    Compose has created two new services: `composeapp_redis_1` and `composeapp_web_1`.\
    \ So where did these names come from? Well, to ensure our services are unique,\
    \ Compose has prefixed and suffixed the names specified in the `docker-compose.yml`\
    \ file with the directory and a number respectively.\n"
