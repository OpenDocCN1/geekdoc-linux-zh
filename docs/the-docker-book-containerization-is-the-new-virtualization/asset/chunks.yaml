  raw: "```\nlarry$ sudo docker info\n. . .\nSwarm: active\n NodeID: bu84wfix0h0x31aut8qlpbi9x\n\
    \ Is Manager: true\n ClusterID: 0qtrjqv37gs3yc5f7ywt8nwfq\n Managers: 1\n Nodes:\
    \ 1\n Orchestration:\n  Task History Retention Limit: 5\n Raft:\n  Snapshot interval:\
    \ 10000\n  Heartbeat tick: 1\n  Election tick: 3\n Dispatcher:\n  Heartbeat period:\
    \ 5 seconds\n CA configuration:\n  Expiry duration: 3 months\n Node Address: 162.243.167.159\n\
    . . .\n```\n\nBy enabling a swarm you’ll see a new section in the `docker info`\
    \ output.\n\nWe can also view information on the nodes inside the swarm using\
    \ the `docker node` command.\n\n```\nlarry$ sudo docker node ls\nID          \
    \                 HOSTNAME  STATUS  AVAILABILITY  MANAGER STATUS\nbu84wfix0h0x31aut8qlpbi9x\
    \ *  larry     Ready   Active        Leader\n```\n\nThe `docker node` command\
    \ with the `ls` flag shows the list of nodes in the swarm. Currently we only have\
    \ one node `larry` which is active and shows its role as `Leader` of the manager\
    \ nodes.\n\nLet’s add our `curly` and `moe` hosts to the swarm as workers. We\
    \ can use the command emitted when we initialized the swarm.\n\n```\ncurly$ sudo\
    \ docker swarm join \\\n--token SWMTKN-1-2mk0wnb9m9cdwhheoysr3pt8orxku8c7k3x3kjjsxatc5ua72v-776lg9r60gigwb32q329m0dli\
    \ \\\n162.243.167.159:2377\nThis node joined a swarm as a worker.\n```\n\nThe\
    \ `docker swarm join` command takes a token, in our case the worker token, and\
    \ the IP address and port of a Swarm manager node and adds that Docker host to\
    \ the swarm.\n\nAnd then again with the same command on the `moe` node. Now let’s\
    \ look at our node list again on the `larry` host.\n\n```\nlarry$ sudo docker\
    \ node ls\nID                           HOSTNAME  STATUS  AVAILABILITY  MANAGER\
    \ STATUS\nbu84wfix0h0x31aut8qlpbi9x *  larry     Ready   Active        Leader\n\
    c6viix7oja1twnyuc8ez7txhd    curly     Ready   Active\ndzxrvk6awnegjtj5aixnojetf\
    \    moe       Ready   Active\n```\n\nNow we can see two more nodes added to our\
    \ swarm as workers.\n\n### 7.3.4 Running a service on your Swarm\n\nWith the swarm\
    \ running, we can now start to run services on it. Remember services are a container\
    \ image and commands that will be executed on our swarm nodes. Let’s create a\
    \ simple replica service now. Remember that replica services run the number of\
    \ tasks you specify.\n\n```\n$ sudo docker service create --replicas 2 --name\
    \ heyworld ubuntu /bin/sh -c \"while true; do echo hey world; sleep 1; done\"\n\
    8bl7yw1z3gzir0rmcvnrktqol\n```\n\nTip You can find the full list of `docker service\
    \ create` flags on the [Docker documentation site](https://docs.docker.com/engine/reference/commandline/service_create/).\n\
    \nWe’ve used the `docker service` command with the `create` keyword. This creates\
    \ services on our swarm. We’ve used the `--name` flag to call the service: `heyworld`.\
    \ The `heyworld` runs the `ubuntu` image and a `while` loop that echoes `hey world`.\
    \ The `--replicas` flag controls how many tasks are run on the swarm. In this\
    \ case we’re running two tasks.\n\nLet’s look at our service using the `docker\
    \ service ls` command.\n\n```\n$ sudo docker service ls\nID            NAME  \
    \    REPLICAS  IMAGE   COMMAND\n8bl7yw1z3gzi  heyworld  2/2       ubuntu  /bin/sh\
    \ -c while true; do echo hey world; sleep 1; done\n```\n\nThis command lists all\
    \ services in the swarm. We can see that our `heyworld` service is running on\
    \ two replicas. We can inspect the service in further detail using the `docker\
    \ service inspect` command. We’ve also passed in the `--pretty` flag to return\
    \ the output in an elegant form.\n\n```\n$ sudo docker service inspect --pretty\
    \ heyworld\nID:     8bl7yw1z3gzir0rmcvnrktqol\nName:       heyworld\nMode:   \
    \    Replicated\n Replicas:  2\nPlacement:\nUpdateConfig:\n Parallelism:   1\n\
    \ On failure:    pause\nContainerSpec:\n Image:     ubuntu\n Args:      /bin/sh\
    \ -c while true; do echo hey world; sleep 1; done\nResources:\n```\n\nBut we still\
    \ don’t know where the service running. Let’s look at another command: `docker\
    \ service ps`.\n\n```\n$ sudo docker service ps heyworld\nID      NAME       IMAGE\
    \  NODE  DESIRED STATE CURRENT STATE\n103q... heyworld.1 ubuntu larry Running\
    \       Running about a minute ago\n6ztf... heyworld.2 ubuntu moe   Running  \
    \     Running about a minute ago\n```\n\nWe can see each task, suffixed with the\
    \ task number, and the node it is running on.\n\nNow, let’s say we wanted to add\
    \ another task to the service, scaling it up. To do this we use the `docker service\
    \ scale` command.\n\n```\n$ sudo docker service scale heyworld=3\nheyworld scaled\
    \ to 3\n```\n\nWe specify the service we want to scale and then the new number\
    \ of tasks we want run, here `3`. The swarm has then let us know it has scaled.\
    \ Let’s again check the running processes.\n\n```\n$ sudo docker service ps heyworld\n\
    ID      NAME       IMAGE  NODE  DESIRED STATE CURRENT STATE\n103q... heyworld.1\
    \ ubuntu larry Running       Running 5 minutes ago\n6ztf... heyworld.2 ubuntu\
    \ moe   Running       Running 5 minutes ago\n1gib... heyworld.3 ubuntu curly Running\
    \       Running about a minute ago\n```\n\nWe can see that our service is now\
    \ running on a third node.\n\nIn addition to running replica services we can also\
    \ run global services. Rather than running as many replicas as you specify, global\
    \ services run on every worker in the swarm.\n\n```\n$ sudo docker service create\
    \ --name heyworld_global --mode global ubuntu /bin/sh -c \"while true; do echo\
    \ hey world; sleep 1; done\"\n```\n\nHere we’ve started a global service called\
    \ `heyworld_global`. We’ve specified the `--mode` flag with a value of `global`\
    \ and run the same `ubuntu` image and the same command we ran above.\n\nLet’s\
    \ see the processes for the `heyworld_global` service using the `docker service\
    \ ps` command.\n\n```\n$ sudo docker service ps heyworld_global\nID      NAME\
    \                IMAGE  NODE  DESIRED STATE CURRENT STATE\nc8c1... heyworld_global\
    \     ubuntu moe   Running       Running 30 seconds ago\n48wm...  \\_ heyworld_global\
    \ ubuntu curly Running       Running 30 seconds ago\n8b8u...  \\_ heyworld_global\
    \ ubuntu larry Running       Running 29 seconds ago\n```\n\nWe can see that the\
    \ `heyworld_global` service is running on every one of our nodes.\n\nIf we want\
    \ to stop a service we can run the `docker service rm` command.\n\n```\n$ sudo\
    \ docker service rm heyworld\nheyworld\n```\n\nWe can now list the running services.\n\
    \n```\n$ sudo docker service ls\nID       NAME            REPLICAS IMAGE  COMMAND\n\
    5k3t...  heyworld_global global   ubuntu /bin/sh -c...\n```\n\nAnd we can see\
    \ that only the `heyworld_global` service remains running.\n\nTip Swarm mode also\
    \ allows for scaling, draining and staged upgrades. You can find some examples\
    \ of this in [Docker Swarm tutorial](https://docs.docker.com/engine/swarm/swarm-tutorial/).\n\
    \n## 7.4 Orchestration alternatives and components\n\nAs we mentioned earlier,\
    \ Compose and Consul aren’t the only games in town when it comes to Docker orchestration\
    \ tools. There’s a fast growing ecosystem of them. This is a non-comprehensive\
    \ list of some of the tools available in that ecosystem. Not all of them have\
    \ matching functionality and broadly fall into two categories:\n\n*   Scheduling\
    \ and cluster management.\n\n*   Service discovery.\n\nNote All of the tools listed\
    \ are open source under various licenses.\n\n### 7.4.1 Fleet and etcd\n\nFleet\
    \ and etcd are released by the [CoreOS](https://coreos.com/) team. [Fleet](https://github.com/coreos/fleet)\
    \ is a cluster management tool and [etcd](https://github.com/coreos/etcd) is highly\
    \ available key value store for shared configuration and service discovery. Fleet\
    \ combines systemd and etcd to provide cluster management and scheduling for containers.\
    \ Think of it as an extension of systemd that operates at the cluster level instead\
    \ of the machine level.\n\n### 7.4.2 Kubernetes\n\n[Kubernetes](http://kubernetes.io/)\
    \ is a container cluster management tool open sourced by Google. It allows you\
    \ to deploy and scale applications using Docker across multiple hosts. Kubernetes\
    \ is primarily targeted at applications comprised of multiple containers, such\
    \ as elastic, distributed micro-services.\n\n### 7.4.3 Apache Mesos"
