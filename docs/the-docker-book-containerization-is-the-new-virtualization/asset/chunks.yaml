    \ cat /var/log/redis/redis-server.log\n. . .\n1:M 05 Aug 15:22:21.697 # Server\
    \ started, Redis version 3.2.9\n. . .\n1:M 05 Aug 15:22:21.698 * The server is\
    \ now ready to accept connections on port 6379\n```\n\n在这里我们交互地运行了另一个容器。我们指定了\
    \ `--rm` 标志，它会在运行的进程停止后自动删除容器。我们还指定了 `--volumes-from` 标志，并告诉它挂载来自 `redis_primary`\
    \ 容器的卷。然后，我们指定了一个基础 `ubuntu` 镜像并告诉它 `cat` `/var/log/redis/redis-server.log` 日志文件。这利用了卷，允许我们挂载来自\
    \ `redis_primary` 容器的 `/var/log/redis` 目录并读取其中的日志文件。稍后我们将看到更多关于如何使用它的。\n\n查看我们的\
    \ Redis 日志，我们看到一些常规警告，但一切看起来良好。我们的 Redis 服务器已准备好在端口 `6379` 上接收数据。\n\n接下来，让我们创建第一个\
