    \ \\\n    162.243.167.159:2377\n\nTo add a manager to this swarm, run the following\
    \ command:\n    docker swarm join \\\n    --token SWMTKN-1-2mk0wnb9mcdwhheoysr3pt8orxku8c7k3x3kjjsxatc5ua72v-78bsc54abf35rhprntbh98t8\
    \ \\\n    162.243.167.159:2377\n```\n\nYou can see we’ve run a `docker` command:\
    \ `swarm`. We’ve then used the `init` option to initialize a swarm and the `--advertise-addr`\
    \ flag to specify the management IP of the new swarm.\n\nWe can see the swarm\
    \ has been started, assigning `larry` as the swarm manager. Each swarm has two\
