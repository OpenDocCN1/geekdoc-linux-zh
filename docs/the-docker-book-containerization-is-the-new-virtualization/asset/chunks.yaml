    We see that our container has taken the provided URL and downloaded the `sample.war`
    file. We can’t see it here, but because we set the working directory in the container,
    that `sample.war` file will have ended up in our `/var/lib/tomcat7/webapps/` directory.


    Our WAR file is in the `/var/lib/docker` directory. Let’s first establish where
    the volume is located using the `docker inspect` command.


    ```

    $ sudo docker inspect -f "{{ range .Mounts }}{{.}}{{end}}" sample

    {c20a0567145677ed46938825f285402566e821462632e1842e82bc51b47fe4dc /var/lib/docker/volumes/c20a0567145677ed46938825f285402566e821462632e1842e82bc51b47fe4dc/_data
    /var/lib/tomcat7/webapps local  true}

    ```


    We then list this directory.


    ```

    $ sudo ls -l /var/lib/docker/volumes/c20a0567145677ed46938825f285402566e821462632e1842e82bc51b47fe4dc/_data

    total 8

    -rw-r--r-- 1 root root 4606 Mar 31  2012 sample.war

    ```


    ### 6.2.3 Our Tomcat 7 application server


    We have an image that will get us WAR files, and we have a sample WAR file downloaded
    into a container. Let’s build an image that will be the Tomcat application server
    that will run our WAR file.


    ```

    $ mkdir tomcat7

    $ cd tomcat7

    $ touch Dockerfile

    ```


    Now let’s populate our `Dockerfile`.


    ```

    FROM ubuntu:16.04

    LABEL maintainer="james@example.com"

    ENV REFRESHED_AT 2016-06-01


    RUN apt-get -yqq update

    RUN apt-get -yqq install tomcat7 default-jdk


    ENV CATALINA_HOME /usr/share/tomcat7

    ENV CATALINA_BASE /var/lib/tomcat7

    ENV CATALINA_PID /var/run/tomcat7.pid

    ENV CATALINA_SH /usr/share/tomcat7/bin/catalina.sh

    ENV CATALINA_TMPDIR /tmp/tomcat7-tomcat7-tmp


    RUN mkdir -p $CATALINA_TMPDIR


    VOLUME [ "/var/lib/tomcat7/webapps/" ]


    EXPOSE 8080


    ENTRYPOINT [ "/usr/share/tomcat7/bin/catalina.sh", "run" ]

    ```


    Our image is pretty simple. We need to install a Java JDK and the Tomcat server.
    We’ll specify some environment variables Tomcat needs in order to get started,
    then create a temporary directory. We’ll also create a volume called `/var/lib/tomcat7/webapps/`,
    expose port `8080` (the Tomcat default), and finally use an `ENTRYPOINT` instruction
    to launch Tomcat.


    Now let’s build our Tomcat 7 image.


    ```

    $ sudo docker build -t jamtur01/tomcat7 .

    ```


    ### 6.2.4 Running our WAR file


    Now let’s see our Tomcat server in action by creating a new Tomcat instance running
    our sample application.


    ```

    $ sudo docker run --name sample_app --volumes-from sample \

    -d -P jamtur01/tomcat7

    ```


    This will create a new container named `sample_app` that reuses the volumes from
    the `sample` container. This means our WAR file, stored in the `/var/lib/tomcat7/webapps/`
    volume, will be mounted from the `sample` container into the `sample_app` container
    and then loaded by Tomcat and executed.


    Let’s look at our sample application in the web browser. First, we must identify
    the port being exposed using the `docker port` command.


    ```

    $ sudo docker port sample_app 8080

    0.0.0.0:49154

    ```


    Now let’s browse to our application (using the URL and port and adding the `/sample`
    suffix) and see what’s there.


    ![Our Tomcat sample application.](images/00030.jpeg)


    Our Tomcat sample application.


    We should see our running Tomcat application.


    ### 6.2.5 Building on top of our Tomcat application server


    Now we have the building blocks of a simple on-demand web service. Let’s look
    at how we might expand on this. To do so, we’ve built a simple Sinatra-based web
    application to automatically provision Tomcat applications via a web page. We’ve
    called this application TProv. You can see its source code on [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/6/tomcat/tprov).


    Let’s install it as a demo of how you might extend this or similar examples. First,
    we’ll need to ensure Ruby is installed. We’re going to install our TProv application
    on our Docker host because our application is going to be directly interacting
    with our Docker daemon, so that’s where we need to install Ruby.


    Note We could also install the TProv application inside a Docker container.


    ```

    $ sudo apt-get -qqy install ruby make ruby-dev build-essential

    ```


    We then install our application from a Ruby gem.


    ```

    $ sudo gem install --no-rdoc --no-ri tprov

    . . .

    Successfully installed tprov-0.0.6

    ```


    This will install the TProv application and some supporting gems.


    We then launch the application using the `tprov` binary.


    ```

    $ sudo tprov

    [2014-06-21 16:17:24] INFO  WEBrick 1.3.1

    [2014-06-21 16:17:24] INFO  ruby 1.8.7 (2011-06-30) [x86_64-linux]

    == Sinatra/1.4.5 has taken the stage on 4567 for development with backup from
    WEBrick

    [2014-06-21 16:17:24] INFO  WEBrick 1.3.1

    pid=14209 port=4567

    This command has launched our application; now we can browse to TProv on port
    4567

    ```

