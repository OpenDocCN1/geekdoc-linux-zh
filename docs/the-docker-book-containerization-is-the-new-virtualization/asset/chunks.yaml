  trans: "\n让我们为我们的第一个镜像：Jekyll 基础镜像开始创建一个新的 `Dockerfile`。我们先创建一个新目录和一个空的 `Dockerfile`。\n\
    \n```\n$ mkdir jekyll\n$ cd jekyll\n$ vi Dockerfile\n```\n\n现在我们来填充这个 `Dockerfile`\
    \ 的内容。\n\n```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\nENV\
    \ REFRESHED_AT 2016-06-01\n\nRUN apt-get -yqq update\nRUN apt-get -yqq install\
    \ ruby ruby-dev build-essential nodejs\nRUN gem install jekyll -v 2.5.3\n\nVOLUME\
    \ /data\nVOLUME /var/www/html\nWORKDIR /data\n\nENTRYPOINT [ \"jekyll\", \"build\"\
    , \"--destination=/var/www/html\" ]\n```\n\n我们的 `Dockerfile` 以我们在第 3 章中看到的模板为基础。我们的镜像基于\
    \ Ubuntu 16.04，并安装了 Ruby 以及支持 Jekyll 所需的决条件。它使用 `VOLUME` 指令创建了两个卷：\n\n* `/data/`，将存储我们新网站的源代码。\n\
    * `/var/www/html/`，将存储编译后的 Jekyll 站点。\n\n我们还需要将工作目录设置为 `/data/`，并指定一个 `ENTRYPOINT`\
    \ 指令，它将将 `/data/` 工作目录下发现的任何 Jekyll 站点构建到 `/var/www/html/` 目录。\n\n### 6.1.2 构建\
    \ Jekyll 基础镜像\n\n有了这个 `Dockerfile`，我们现在将构建一个镜像，并从该镜像启动容器。我们将使用 `docker build`\
    \ 命令来实现。\n\n```\n$ sudo docker build -t jamtur01/jekyll .\nSending build context\
    \ to Docker daemon  2.56 kB\nSending build context to Docker daemon\nStep 0 :\
    \ FROM ubuntu:16.04\n ---> 99ec81b80c55\nStep 1 : LABEL maintainer=\"james@example.com\"\
    \n. . .\nStep 7 : ENTRYPOINT [ \"jekyll\", \"build\" \"--destination=/var/www/html\"\
    \ ]\n ---> Running in 542e2de2029d\n ---> 79009691f408\nRemoving intermediate\
    \ container 542e2de2029d\nSuccessfully built 79009691f408\n```\n\n我们看到已经构建了一个\
    \ ID 为 `79009691f408`、名为 `jamtur01/jekyll` 的新镜像，这就是我们的新 Jekyll 镜像。我们使用 `docker\
    \ images` 命令查看新镜像。\n\n```\n$ sudo docker images\nREPOSITORY      TAG    ID   \
    \         CREATED        SIZE\njamtur01/jekyll latest 79009691f408  6 seconds\
    \ ago  12.29 kB (virtual 671 MB)\n. . .\n```\n\n### 6.1.3 Apache 镜像\n\n最后，让我们构建第二个镜像，一个用于提供新站服务的\
    \ Apache 服务器。我们先创建一个新目录和一个空的 `Dockerfile`。\n\n```\n$ mkdir apache\n$ cd apache\n\
    $ vi Dockerfile\n```\n\n现在我们来填充这个 `Dockerfile` 的内容。\n\n```\nFROM ubuntu:16.04\n\
    LABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get\
    \ -yqq update\nRUN apt-get -yqq install apache2\n\nVOLUME [ \"/var/www/html\"\
    \ ]\nWORKDIR /var/www/html\n\nENV APACHE_RUN_USER www-data\nENV APACHE_RUN_GROUP\
    \ www-data\nENV APACHE_LOG_DIR /var/log/apache2\nENV APACHE_PID_FILE /var/run/apache2.pid\n\
    ENV APACHE_RUN_DIR /var/run/apache2\nENV APACHE_LOCK_DIR /var/lock/apache2\n\n\
    RUN mkdir -p $APACHE_RUN_DIR $APACHE_LOCK_DIR $APACHE_LOG_DIR\n\nEXPOSE 80\n\n\
    ENTRYPOINT [ \"/usr/sbin/apache2\" ]\nCMD [\"-D\", \"FOREGROUND\"]\n```\n\n这个最终镜像同样基于\
    \ Ubuntu 16.04 并安装了 Apache。它使用 `VOLUME` 指令创建一个卷 `/var/www/html/`，该卷将存储我们编译后的 Jekyll\
    \ 网站。还将 `/var/www/html` 设置为工作目录。\n\n然后我们将使用一些 `ENV` 指令来设置必要的环境变量，创建一些必要的目录，并 `EXPOSE`\
    \ 端口 `80`。我们还指定了 `ENTRYPOINT` 和 `CMD` 的组合，以便在容器启动时默认运行 Apache。\n\n### 6.1.4 构建\
    \ Jekyll Apache 镜像\n\n有了这个 `Dockerfile`，我们现在将构建一个镜像并从其启动容器。我们使用 `docker build`\
    \ 命令。\n\n```\n$ sudo docker build -t jamtur01/apache .\nSending build context\
    \ to Docker daemon  2.56 kB\nSending build context to Docker daemon\nStep 0 :\
    \ FROM ubuntu:16.04\n ---> 99ec81b80c55\nStep 1 : LABEL maintainer=\"james@example.com\"\
    \n ---> Using cache\n ---> c444e8ee0058\n. . .\nStep 11 : CMD [\"-D\", \"FOREGROUND\"\
    ]\n ---> Running in 7aa5c127b41e\n ---> fc8e913521d\nRemoving intermediate container\
    \ 7aa5c127b41e\nSuccessfully built fc8e913521d\n```\n\n我们看到已经构建了一个 ID 为 `fc8e913521d`、名为\
    \ `jamtur01/apache` 的镜像，这就是我们的新 Apache 镜像。我们使用 `docker images` 命令查看新镜像。\n\n```\n\
    $ sudo docker images\nREPOSITORY      TAG    ID            CREATED        SIZE\n\
    jamtur01/apache latest fc8e9113521d  6 seconds ago  12.29 kB (virtual 671 MB)\n\
    ```\n\n### 6.1.5 启动我们的 Jekyll 站点\n\n现在我们有两个镜像：\n\n* Jekyll - 安装了 Ruby 和先决条件的镜像。\n\
    * Apache - 通过 Web 服务器提供网站的镜像。\n\n让我们通过 `docker run` 命令创建一个新的 Jekyll 容器来启动我们的站点。我们将使用\
    \ `docker run` 创建容器。我们需要一些博客源代码。\n\n```\n$ cd $HOME\n$ git clone https://github.com/jekyll\n\
    ```\n\n我们启动了新容器 `james_blog`，并将我们的 `blog` 目录挂载到容器内的 `/data`。容器获取了这些源码并将其构建为站点。\n\
    \n```\n$ sudo docker run -v /home/james/blog:/data --name james_blog jamtur01/jekyll\n\
    ```\n\n等等，我们在第 4 章简要介绍卷时曾发现过它们的一些特性。让我们回顾一下。卷是一个或多个容器内的特殊目录，它绕过了联合文件系统，为持久数据提供了许多有用功能：\n\
    \n* 卷可以在容器之间共享和复用。\n* 容器不需要运行即可共享卷。\n* 对卷的更改是直接进行的。\n* 更新镜像时不会包含卷的更改。\n* 即使没有容器使用，卷也会持久存在。这允许向镜像中添加数据（例如源代码、数据库或其他内容）而无需提交到镜像，并允许容器之间共享这些数据。\n\
    \n卷位于 Docker 主机的 `/var/lib/docker/volumes` 目录下。使用 `docker inspect` 命令识别特定卷的位置，例如：\n\
    \n`docker inspect -f \"{{ range .Mounts }}{{.end}}\" james_blog`\n\n提示：在 Docker\
    \ 1.9 中，卷通过插件扩展支持 Ceph、Flocker 和 EMC 等第三方存储系统。你可以在[插件文档](https://docs.docker.com/engine/extend/plugins_volume/)\
    \ 和 [docker volume create 命令文档](https://docs.docker.com/engine/reference/commandline/volume_create/)\
    \ 中了解它们。\n\n因此，如果我们想从另一个容器使用 `/var/www/html/` 卷中的编译后站点，我们可以做到。为了这一点，我们将创建一个链接到该卷的新容器。\n\
    \n```\n$ sudo docker run -d -P --volumes-from james_blog jamtur01/apache\n09a570cc2267019352525079fbba9927806f782acb88213bd38dde7e2795407d\n\
    ```\n"
- fmt: "\nThis looks like a typical `docker run`, except that we’ve used a new flag:\
    \ `--volumes-from`. The `--volumes-from` flag adds any volumes in the named container\
    \ to the newly created container. This means our Apache container has access to\
    \ the compiled Jekyll site in the `/var/www/html` volume within the `james_blog`\
    \ container we created earlier. It has that access even though the `james_blog`\
    \ container is not running. As you’ll recall, that is one of the special properties\
    \ of volumes. The container does have to exist, though.\n\nNote: Even if you delete\
    \ the last container that uses a volume, the volume will still persist.\n\nWhat\
    \ is the end result of building our Jekyll website? Let’s see onto what port our\
    \ container has mapped our exposed port `80`:\n\n```\n$ sudo docker port 09a570cc2267\
    \ 80\n0.0.0.0:49160\n```\n\nNow let’s browse to that site on our Docker host.\n\
    \n![Our Jekyll website.](images/00028.jpeg)\n\nOur Jekyll website.\n\nWe have\
    \ a running Jekyll website!\n\n### 6.1.6 Updating our Jekyll site\n\nThings get\
    \ even more interesting when we want to update our site. Let’s say we’d like to\
    \ make some changes to our Jekyll website. We’re going to rename our blog by editing\
    \ the `james_blog/_config.yml` file.\n\n```\n$ vi james_blog/_config.yml\n```\n\
    \nAnd update the `title` field to `James' Dynamic Docker-driven Blog`.\n\nSo how\
    \ do we update our blog? All we need to do is start our Docker container again\
    \ with the `docker start` command.\n\n```\n$ sudo docker start james_blog\njames_blog\n\
    ```\n\nIt looks like nothing happened. Let’s check the container’s logs.\n\n```\n\
    $ sudo docker logs james_blog\nConfiguration file: /data/_config.yml\n       \
    \     Source: /data\n       Destination: /var/www/html\n      Generating...\n\
    \                    done.\nConfiguration file: /data/_config.yml\n          \
    \  Source: /data\n       Destination: /var/www/html\n      Generating...\n   \
    \                 done.\n```\n\nWe see that the Jekyll build process has been\
    \ run a second time and our site has been updated. The update has been written\
    \ to our volume. Now if we browse to the Jekyll website, we should see our update.\n\
    \n![Our updated Jekyll website.](images/00029.jpeg)\n\nOur updated Jekyll website.\n\
    \nThis all happened without having to update or restart our Apache container,\
    \ because the volume it was sharing was updated automatically. You can see how\
    \ easy this workflow is and how you could expand it for more complicated deployments.\n\
    \n### 6.1.7 Backing up our Jekyll volume\n\nYou’re probably a little worried about\
    \ accidentally deleting your volume (although we can prettily easily rebuild our\
    \ site using the existing process). One of the advantages of volumes is that because\
    \ they can be mounted into any container, we can easily create backups of them.\
    \ Let’s create a new container now that backs up the `/var/www/html` volume.\n\
    \n```\n$ sudo docker run --rm --volumes-from james_blog \\\n-v $(pwd):/backup\
    \ ubuntu \\\ntar cvf /backup/james_blog_backup.tar /var/www/html\ntar: Removing\
    \ leading '/' from member\n/var/www/html/\n/var/www/html/assets/\n/var/www/html/assets/themes/\n\
    $ ls james_blog_backup.tar\njames_blog_backup.tar\n```\n\nHere we’ve run a stock\
    \ container and mounted the volume from `james_blog` into that container. That\
    \ will create the directory `/var/www/html` inside the container. We’ve then used\
    \ the `-v` flag to mount our current directory using `$(pwd)` inside the container\
    \ at `/backup`. Our container then runs.\n\nNote: We’ve also specified the `--rm`\
    \ flag, which is useful for single-use or throwaway containers. This is a neat\
    \ way of tidying up after containers we only need once.\n\n```\ntar cvf /backup/james_blog_backup.tar\
    \ /var/www/html\n```\n\nThis will create a tarfile called `james_blog_backup.tar`\
    \ containing the contents of the `/var/www/html` directory and then exit. This\
    \ process creates a backup of our volume. This is a simple example of a backup\
    \ process. You could easily extend this to back up storage locally or in the cloud\
    \ (e.g., to Amazon S3 or more traditional backup like Amanda). Note: This example\
    \ could also work for a database stored in volume or similar. Simply mount the\
    \ volume in a fresh container, perform your backup, and discard the container\
    \ you created for the backup.\n\n### 6.1.8 Extending our Jekyll website\n\nHere\
    \ are some ways we could expand our simple Jekyll website:\n\n- Run multiple Apache\
    \ containers, all use the same volume from `james_blog`. Put a load balancer in\
    \ front of it, and we have a web cluster.\n- Build a further image that cloned\
    \ or copied user-provided source (e.g., `git clone`) into volume. Mount this volume\
    \ into a container created from `jam01/fetcher`. This would make the solution\
    \ portable and would not require any local source on host.\n- With the previous\
    \ expansion, you could easily build a web front for our service that deployed\
    \ automatically from specified source. Then you would have your own variant of\
    \ GitHub Pages.\n\n## 6.2 Building Java application server with Docker\n\nNow\
    \ let’s take a slightly different tack and think about Docker as an application\
    \ server and build pipeline. This time we’re serving more “enterprise” and traditional\
    \ workload: fetching and running a Java application from a `WAR` file in Tomcat\
    \ server. To do this, we’re going to build a two-stage Docker pipeline:\n\n- An\
    \ image that pulls down specified WAR files from a URL and stores them in volume.\n\
    - An image with Tomcat server installed that runs those downloaded WAR files.\n\
    \n### 6.2.1 WAR file fetcher\n\nLet’s start by building an image to download a\
    \ `WAR` file for us and mount it in volume.\n\n```\n$ mkdir fetcher\n$ cd fetcher\n\
    $ touch Dockerfile\n```\n\nNow let’s populate our `Dockerfile`.\n\n```\nFROM ubuntu:16.04\n\
    LABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get\
    \ -y update\nRUN apt-get -y install wget\n\nVOLUME [\"/var/lib/tomcat7/webapps/\"\
    ]\nWORKDIR /var/lib/tomcat7/webapps/\n\nENTRYPOINT [\"wget\"]\nCMD [\"\"]\n```\n\
    \nThis incredibly simple image does one thing: it `wget`s whatever file from a\
    \ URL is specified when a container is run from it and stores the file in the\
    \ `/var/lib/tomcat7/webapps/` directory. This directory is also a volume and the\
    \ working directory for any containers. We’re going to share this volume with\
    \ our Tomcat server and run its contents.\n\nFinally, the `ENTRYPOINT` and `CMD`\
    \ instructions allow our container to run when no URL is specified; they do so\
    \ by returning the `wget` help output when the container is run without a URL.\n\
    \nLet’s build this image now.\n\n```\n$ sudo docker build -t jamtur01/fetcher\
    \ .\n```\n\n### 6.2.2 Fetching a WAR file\n\nLet’s fetch an example file as a\
    \ way to get started with our new image. We’re going to download the sample Apache\
    \ Tomcat application from `https://tomcat.apache.org/tomcat-7.0-doc/appdev/sample/`.\n\
    \n```\n$ sudo docker run -t -i --name sample jamtur01/fetcher \\\nhttps://tomcat.apache.org/tomcat-7.0-doc/appdev/sample/sample.war\n\
    --2014-06-21 06:05:19--  https://tomcat.apache.org/tomcat-7.0-doc/appdev/sample/sample.war\n\
    Resolving tomcat.apache.org (tomcat.apache.org)... 140.211.11.131, 192.87.106.229,\
    \ 2001:610:1:80bc:192:87:106:229\nConnecting to tomcat.apache.org (tomcat.apache.org)|140.211.11.131|:443...\
    \ connected.\nHTTP request sent, awaiting response... 200 OK\nLength: 4606 (4.5K)\n\
    Saving to: 'sample.war'\n\n100%[=================================>] 4,606    \
    \   --.-K/s   in 0\n\n2014-06-21 06:05:19 (14.4 MB/s) - 'sample.war' saved [4606/4606]\n\
    ```\n"
