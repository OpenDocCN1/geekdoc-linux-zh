    \ metadata; if the source is any other kind of file, it is copied individually\
    \ along with its metadata. In our example, the destination ends with a trailing\
    \ slash `/`, so it will be considered a directory and copied to the destination\
    \ directory.\n\nIf the destination doesn’t exist, it is created along with all\
    \ missing directories in its path, much like how the `mkdir -p` command works.\n\
    \n#### 4.5.10.9 LABEL\n\nThe `LABEL` instruction adds metadata to a Docker image.\
    \ The metadata is in the form of key/value pairs. Let’s see an example.\n\n```\n\
    LABEL version=\"1.0\"\nLABEL location=\"New York\" type=\"Data Center\" role=\"\
    Web Server\"\n```\n\nThe `LABEL` instruction is written in the form of `label=\"\
    value\"`. You can specify one item of metadata per label or multiple items separated\
    \ with white space. We recommend combining all your metadata in a single `LABEL`\
    \ instruction to save creating multiple layers with each piece of metadata. You\
    \ can inspect the labels on an image using the `docker inspect` command..\n\n\
    ```\n$ sudo docker inspect jamtur01/apache2\n. . .\n\n    \"Labels\": {\n    \
    \  \"version\": \"1.0\",\n      \"location\": \"New York\",\n      \"type\": \"\
    Data Center\",\n      \"role\": \"Web Server\"\n    },\n```\n\nHere we see the\
    \ metadata we just defined using the `LABEL` instruction.\n\nNote The `LABEL`\
    \ instruction was introduced in Docker 1.6.\n\n#### 4.5.10.10 STOPSIGNAL\n\nThe\
    \ `STOPSIGNAL` instruction sets the system call signal that will be sent to the\
    \ container when you tell it to stop. This signal can be a valid number from the\
    \ kernel syscall table, for instance 9, or a signal name in the format `SIGNAME`,\
    \ for instance `SIGKILL`.\n\nNote The `STOPSIGNAL` instruction was introduced\
    \ in Docker 1.9.\n\n#### 4.5.10.11 ARG\n\nThe `ARG` instruction defines variables\
    \ that can be passed at build-time via the `docker build` command. This is done\
    \ using the `--build-arg` flag. You can only specify build-time arguments that\
    \ have been defined in the `Dockerfile`.\n\n```\nARG build\nARG webapp_user=user\n\
    ```\n\nThe second `ARG` instruction sets a default, if no value is specified for\
    \ the argument at build-time then the default is used. Let’s use one of these\
    \ arguments in a `docker build` now.\n\n```\n$ docker build --build-arg build=1234\
    \ -t jamtur01/webapp .\n```\n\nAs the `jamtur01/webapp` image is built the `build`\
    \ variable will be set to `1234` and the `webapp_user` variable will inherit the\
    \ default value of `user`.\n\nWarning At this point you’re probably thinking -\
    \ this is a great way to pass secrets like credentials or keys. Don’t do this.\
    \ Your credentials will be exposed during the build process and in the build history\
    \ of the image.\n\nDocker has a set of predefined `ARG` variables that you can\
    \ use at build-time without a corresponding `ARG` instruction in the `Dockerfile`.\n\
    \n```\nHTTP_PROXY\nhttp_proxy\nHTTPS_PROXY\nhttps_proxy\nFTP_PROXY\nftp_proxy\n\
    NO_PROXY\nno_proxy\n```\n\nTo use these predefined variables, pass them using\
    \ the `--build-arg <variable>=<value>` flag to the `docker build` command.\n\n\
    Note The `ARG` instruction was introduced in Docker 1.9 and you can read more\
    \ about it in the [Docker documentation](http://docs.docker.com/engine/reference/builder/#arg).\n\
    \n#### 4.5.10.12 SHELL\n\nThe `SHELL` instruction allows the default shell used\
    \ for the shell form of commands to be overridden. The default shell on Linux\
    \ is ``[\"/bin/sh\", \"-c\"]` and on Windows is `[\"cmd\", \"/S\", \"/C\"]`.\n\
    \nThe `SHELL` instruction is useful on platforms such as Windows where there are\
    \ multiple shells, for example running commands in the `cmd` or `powershell` environments.\
    \ Or when need to run a command on Linux in a specific shell, for example Bash.\n\
    \nThe `SHELL` instruction can be used multiple times. Each new `SHELL` instruction\
    \ overrides all previous `SHELL` instructions, and affects any subsequent instructions.\n\
    \n#### 4.5.10.13 HEALTHCHECK\n\nThe `HEALTHCHECK` instruction tells Docker how\
    \ to test a container to check that it is still working correctly. This allows\
    \ you to check things like a web site being served or an API endpoint responding\
    \ with the correct data, allowing you to identify issues that appear, even if\
    \ an underlying process still appears to be running normally.\n\nWhen a container\
    \ has a health check specified, it has a health status in addition to its normal\
    \ status. You can specify a health check like:\n\n```\nHEALTHCHECK --interval=10s\
    \ --timeout=1m --retries=5 CMD curl http://localhost || exit 1\n```\n\nThe `HEALTHCHECK`\
    \ instruction contains options and then the command you wish to run itself, separated\
    \ by a `CMD` keyword.\n\nWe’ve first specified three default options:\n\n*   `--interval`\
    \ - defaults to 30 seconds. This is the period between health checks. In this\
    \ case the first health check will run 10 seconds after container launch and subsequently\
    \ every 10 seconds.\n\n*   `--timeout` - defaults to 30 seconds. If the health\
    \ check takes longer the timeout then it is deemed to have failed.\n\n*   `--retries`\
    \ - defaults to 3\\. The number of failed checks before the container is marked\
    \ as unhealthy.\n\nThe command after the `CMD` keyword can be either a shell command\
    \ or an exec array, for example as we’ve seen in the `ENTRYPOINT` instruction.\
    \ The command should exit with `0` to indicate health or `1` to indicate an unhealthy\
    \ state. In our `CMD` we’re executing `curl` on the `localhost`. If the command\
    \ fails we’re exiting with an exit code of `1`, indicating an unhealthy state.\n\
    \nWe can see the state of the health check using the `docker inspect` command.\n\
    \n```\n$ sudo docker inspect --format '{{.State.Health.Status}}' static_web\n\
    healthy\n```\n\nThe health check state and related data is stored in the `.State.Health`\
    \ namespace and includes current state as well as a history of previous checks\
    \ and their output. The output from each health check is also available via `docker\
    \ inspect`.\n\n```\n$ sudo docker inspect --format '{{range .State.Health.Log}}\
    \ {{.ExitCode}} {{.Output}} {{end}}' static_web\n  0  Hi, I am in your container\n\
    ```\n\nHere we’re iterating through the array of `.Log` entries in the `docker\
    \ inspect` output.\n\nThere can only be one `HEALTHCHECK` instruction in a `Dockerfile`.\
    \ If you list more than one then only the last will take effect.\n\nYou can also\
    \ disable any health checks specified in any base images you may have inherited\
    \ with the instruction:\n\n```\nHEALTHCHECK NONE\n```\n\nNote This instruction\
    \ was added in Docker 1.12.\n\n#### 4.5.10.14 ONBUILD\n\nThe `ONBUILD` instruction\
    \ adds triggers to images. A trigger is executed when the image is used as the\
    \ basis of another image (e.g., if you have an image that needs source code added\
    \ from a specific location that might not yet be available, or if you need to\
    \ execute a build script that is specific to the environment in which the image\
    \ is built).\n\nThe trigger inserts a new instruction in the build process, as\
    \ if it were specified right after the `FROM` instruction. The trigger can be\
    \ any build instruction. For example:\n\n```\nONBUILD ADD . /app/src\nONBUILD\
    \ RUN cd /app/src; make\n```\n\nThis would add an `ONBUILD` trigger to the image\
    \ being created, which we see when we run `docker inspect` on the image.\n\n```\n\
    $ sudo docker inspect 508efa4e4bf8\n...\n\"OnBuild\": [\n    \"ADD . /app/src\"\
    ,\n    \"RUN cd /app/src/; make\"\n]\n...\n```\n\nFor example, we’ll build a new\
    \ `Dockerfile` for an Apache2 image that we’ll call `jamtur01/apache2`.\n\n```\n\
    FROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\nRUN apt-get update;\
    \ apt-get install -y apache2\nENV APACHE_RUN_USER www-data\nENV APACHE_RUN_GROUP\
    \ www-data\nENV APACHE_LOG_DIR /var/log/apache2\nONBUILD ADD . /var/www/\nEXPOSE\
    \ 80\nENTRYPOINT [\"/usr/sbin/apache2\"]\nCMD [\"-D\", \"FOREGROUND\"]\n```\n\n\
    Now we’ll build this image.\n\n```\n$ sudo docker build -t=\"jamtur01/apache2\"\
    \ .\n...\nStep 7 : ONBUILD ADD . /var/www/\n---> Running in 0e117f6ea4ba\n--->\
    \ a79983575b86\nSuccessfully built a79983575b86\n```"
