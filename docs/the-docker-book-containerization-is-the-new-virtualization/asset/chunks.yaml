    ```


    This would bind port `80` on the container to port `8080` on the local host.


    We can also bind to a specific interface.


    ```

    $ sudo docker run -d -p 127.0.0.1:80:80 --name static_web_lb jamtur01/static_web
    nginx -g "daemon off;"

    ```


    Here we’ve bound port `80` of the container to port `80` on the `127.0.0.1` interface
    on the local host. We can also bind to a random port using the same structure.


    ```

    $ sudo docker run -d -p 127.0.0.1::80 --name static_web_random jamtur01/static_web
    nginx -g "daemon off;"

    ```


    Here we’ve removed the specific port to bind to on `127.0.0.1`. We would now use
    the `docker inspect` or `docker port` command to see which random port was assigned
    to port `80` on the container.


    Tip You can bind UDP ports by adding the suffix `/udp` to the port binding.


    Docker also has a shortcut, `-P`, that allows us to publish all ports we’ve exposed
    via `EXPOSE` instructions in our `Dockerfile`.


    ```

    $ sudo docker run -d -P --name static_web_all jamtur01/static_web nginx -g "daemon
    off;"

    ```


    This would publish port `80` on a random port on our local host. It would also
    publish any additional ports we had specified with other `EXPOSE` instructions
    in the `Dockerfile` that built our image.


    Tip You can find more information on port redirection [here](https://docs.docker.com/v1.4/userguide/dockerlinks/#net%20rk-port-mapping-refresher).


    With this port number, we can now view the web server on the running container
    using the IP address of our host or the `localhost` on `127.0.0.1`.


