  trans: "\n我们为 `docker-api` gem 添加了 `require`。我们需要先安装这个 gem 才能让程序正常工作，或者将其添加到 TProv\
    \ 应用程序的 gem 规格规范中。\n\n然后，我们可以使用 `Docker.url` 方法来指定我们想要使用的 Docker 主机的位置。在代码中，我们通过环境变量\
    \ `DOCKER_URL` 来指定它，或者使用默认值 `http://localhost:2375`。\n\n我们还使用了 `Docker.options`\
    \ 来指定想要传递给 Docker 守护进程连接的选项。\n\n我们可以在本地使用 IRB 交互壳来测试这个想法。让我们现在试一试。你需要在测试的宿主机上安装\
    \ Ruby。假设我们正在使用 Fedora 宿主机。\n\n```\n$ sudo yum -y install ruby ruby-irb\n. . .\n\
    $ sudo gem install docker-api json\n. . .\n```\n\n现在我们可以使用 `irb` 来测试我们的 Docker\
    \ API 连接了。\n\n```\n $ irb\nirb(main):001:0> require 'docker'; require 'pp'\n=>\
    \ true\nirb(main):002:0> Docker.url = 'http://docker.example.com:2375'\n=> \"\
    http://docker.example.com:2375\"\nirb(main):003:0> Docker.options = { :ssl_verify_peer\
    \ => false }\n=> {:ssl_verify_peer=>false}\nirb(main):004:0> pp Docker.info\n\
    {\"Containers\"=>9,\n \"Debug\"=>0,\n \"Driver\"=>\"aufs\",\n \"DriverStatus\"\
    =>[[\"Root Dir\", \"/var/lib/docker/aufs\"], [\"Dirs\", \"882\"]],\n \"ExecutionDriver\"\
    =>\"native-0.2\",\n. . .\nirb(main):005:0> pp Docker.version\n{\"ApiVersion\"\
    =>\"1.12\",\n \"Arch\"=>\"amd64\",\n \"GitCommit\"=>\"990021a\",\n \"GoVersion\"\
    =>\"go1.2.1\",\n \"KernelVersion\"=>\"3.10.0-33-generic\",\n \"Os\"=>\"linux\"\
    ,\n \"Version\"=>\"1.0.1\"}\n. . .\n```\n\n我们启动了 `irb` 并加载了 `docker` gem（通过 `require`）以及\
    \ `pp` 库来让输出更美观。然后我们指定了 `Docker.url` 和 `Docker.options` 方法来设置目标 Docker 主机以及所需的选项（这里禁用了\
    \ SSL 节点验证以使用 TLS，但不对客户端进行身份验证）。\n\n我们运行了两个全局方法 `Docker.info` 和 `Docker.version`，它们提供了二进制命令\
    \ `docker info` 和 `docker version` 的 Ruby 客户端 API 等实现。\n\n现在我们可以更新 TProv 容器管理方法，通过\
    \ `docker-api` 客户端库使用 API。让我们来看看现在实现这一点的代码。\n\n```ruby\ndef get_war(name, url)\n\
    \  container = Docker::Container.create('Cmd' => url, 'Image' => 'jamtur01/fetcher',\
    \ 'name' => name)\n  container.start\n  container.id\nend\n\ndef create_instance(name)\n\
    \  container = Docker::Container.create('Image' => 'jamtur01/tomcat7')\n  container.start('PublishAllPorts'\
    \ => true, 'VolumesFrom' => name)\n  container.id\nend\n\ndef delete_instance(cid)\n\
    \  container = Docker::Container.get(cid)\n  container.kill\nend\n```\n\n你可以看到，我们已经将之前的二进制\
    \ shell 替换为使用 Docker API 的相当简洁实现。我们的 `get_war` 方法使用 `Docker::Container.create`\
    \ 和 `Docker::Container.start` 方法创建并启动了 `jamtur01/fetcher` 容器。`create_instance`\
    \ 方法对 `jamtur01/tomcat7` 容器执行相同的操作。最后，我们的 `delete_instance` 方法已更新，通过 `Docker::Container.get`\
    \ 方法根据容器 ID 获取容器。然后我们使用 `Docker::Container.kill` 方法杀掉容器。\n\n你可以通过 gem 安装启用 API\
    \ 的 TProv 应用程序以查看其运行效果。\n\n```\n$ sudo gem install tprov-api\n```\n\n注意：你可以在 [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/8/tprov_api)\
    \ 查看更新后的 TProv 代码。\n\n## 8.5 验证 Docker Engine API 身份\n\n虽然我们展示了可以连接到 Docker Engine\
    \ API，但这意味着其他人也可以连接到该 API。这带来了一定的安全问题。Engine API 自 Docker 0.9 版本起就提供了一种身份验证机制。该身份验证使用\
    \ TLS/SSL 证书来保护你与 API 的连接。\n\n提示 此身份验证不仅适用于 API。通过开启此验证，你还需要配置我们的 Docker 客户端以支持\
    \ TLS 身份验证。我们将在本节中介绍如何这样做。\n\n我们有几种方法可以对连接进行身份验证，包括使用完整的 PKI 基础设施，创建我们自己的证书颁机构\
    \ (CA) 或使用现有的 CA。我们将创建自己的证书颁机构，因为这是一个简单快速的上手方法。\n\n警告 这依赖于运行在你的 Docker 宿主机上的本地\
    \ CA。这不如使用功能完证书颁机构安全。\n\n### 8.5.1 创建证书颁机构\n\n我们将快速完成所需的 CA 证书和密钥，这在大多数平台上都是标准流程。它需要\
    \ `openssl` 二进制文件。\n\n```\n$ which openssl\n/usr/bin/openssl\n```\n\n让我们在 Docker\
    \ 宿主机上创建一个目录来存放 CA 及相关材料。\n\n```\n$ sudo mkdir /etc/docker\n```\n\n现在让我们创建 CA。首先生成一个私钥。\n\
    \n```\n$ cd /etc/docker\n$ echo 01 | sudo tee ca.srl\n$ sudo openssl genrsa -des3\
    \ -out ca-key.pem\nGenerating RSA private key, 512 bit long modulus\n...\n```\n\
    \n这会创建一个名为 `ca-key.pem` 的新文件。这是我们的 CA 密钥；请记住这个短语并保护它。我们需要用它来用 CA 签名证书。\n\n现在让我们创建\
    \ CA 证书。\n\n```\n$ sudo openssl req -new -x509 -days 365 -key ca-key.pem -out\
    \ ca.pem\nEnter pass phrase for ca-key.pem:\n将被要求输入一些纳入证书请求的信息。你输入的内容被称为区分名称 (DN)。有很多字段，但你可以留空。如果你输入\
    \ '.'，该字段将留空。\n-----\nCountry Name (2 letter code) [AU]:\nState or Province Name\
    \ (full name) [Some-State]:\nLocality Name (eg, city)]:\nOrganization Name (eg,\
    \ company) [Internet Widgits Pty Ltd]:\nOrganizational Unit Name (eg, section)\
    \ []:\nCommon Name (e.g. server FQDN or YOUR name) []:docker.example.com\nEmail\
    \ Address []:\n```\n\n这将创建一个 `ca.pem` 文件，它是 CA 的证书。我们稍后需要它来验证我们的安全连接。\n\n现在我们已经有了\
    \ CA，让我们用它为 Docker 服务器创建证书和密钥。\n\n### 8.5.2 创建服务器证书请求和密钥\n\n我们可以使用新的 CA 为我们的 Docker\
    \ 服务器签名并验证证书请求 (CSR) 和密钥。让我们从为服务器创建密钥开始。\n\n```\n$ sudo openssl genrsa -des3 -out\
    \ server-key.pem\nGenerating RSA private key, 512 bit long modulus\n...\nEnter\
    \ pass phrase for server-key.pem:\nVerifying - Enter pass phrase for server-key.pem:\n\
    ```\n\n这会创建我们的服务器密钥 `server-key.pem`。如上所述，我们需要妥善保存此密钥：它保护了我们的 Docker 服务器。\n\n\
    注意 在此处指定任何短语。我们将在使用密钥之前将其移除。你将在接下来的几个步骤中需要它。\n\n接下来让我们创建服务器证书请求 (CSR)。\n"
- fmt: "\n```bash\n$ sudo openssl req -new -key server-key.pem -out server.csr\nEnter\
    \ pass phrase for server-key.pem:\nYou are about to be asked to enter information\
    \ that will be incorporated\ninto your certificate request.\nWhat you are about\
    \ to enter is what is called a Distinguished Name or a DN.\nThere are quite a\
    \ few fields but you can leave some blank\nFor some fields there will be a default\
    \ value,\nIf you enter '.', the field will be left blank.\n-----\nCountry Name\
    \ (2 letter code) [AU]:\nState or Province Name (full name) [Some-State]:\nLocality\
    \ Name (eg, city) []:\nOrganization Name (eg, company) [Internet Widgits Pty Ltd]:\n\
    Organizational Unit Name (eg, section) []:\nCommon Name (e.g. server FQDN or YOUR\
    \ name) []:\nEmail Address []:\n\nPlease enter the following 'extra' attributes\n\
    to be sent with your certificate request\nA challenge password []:\nAn optional\
    \ company name []:\n```\n\nThis will create a file called `server.csr`. This is\
    \ the request that our CA will sign to create our server certificate. The most\
    \ important option here is `Common Name` or `CN`. This should either be the FQDN\
    \ (fully qualified domain name) of the Docker server (i.e., what is resolved to\
    \ in DNS; for example, `docker.example.com`) or `*`, which will allow us to use\
    \ the server certificate on any server.\n\nWe also know folks connect to our host\
    \ via IP address so we need to configure for that too.\n\n```bash\n$ echo subjectAltName\
    \ = IP:x.x.x.x,IP:127.0.0.1 > extfile.cnf\n```\n\nReplacing `x.x.x.x` with the\
    \ IP address(es) of your Docker daemon.\n\nNow let’s sign our CSR and generate\
    \ our server certificate.\n\n```bash\n$ sudo openssl x509 -req -days 365 -in server.csr\
    \ -CA ca.pem \\\n-CAkey ca-key.pem -out server-cert.pem -extfile extfile.cnf\n\
    Signature ok\nsubject=/C=AU/ST=Some-State/O=Internet Widgits Pty Ltd/CN=*\nGetting\
    \ CA Private Key\nEnter pass phrase for ca-key.pem:\n```\n\nWe’ll enter the passphrase\
    \ of the CA’s key file, and a file called `server-cert.pem` will be generated.\
    \ This is our server’s certificate.\n\nNow let’s strip out the passphrase from\
    \ our server key. We can’t enter one when the Docker daemon starts, so we need\
    \ to remove it.\n\n```bash\n$ sudo openssl rsa -in server-key.pem -out server-key.pem\n\
    Enter pass phrase for server-key.pem:\nwriting RSA key\n```\n\nNow let’s add some\
    \ tighter permissions to the files to better protect them.\n\n```bash\n$ sudo\
    \ chmod 0600 /etc/docker/server-key.pem /etc/docker/server-cert.pem \\\n/etc/docker/ca-key.pem\
    \ /etc/docker/ca.pem\n```\n\n### 8.5.3 Configuring the Docker daemon\n\nNow that\
    \ we’ve got our certificate and key, let’s configure the Docker daemon to use\
    \ them. As we did to expose the Docker daemon to a network socket, we’re going\
    \ to edit its startup configuration. As before, for Ubuntu or Debian, we’ll edit\
    \ the `/etc/default/docker` file; for those distributions with Upstart, it’s the\
