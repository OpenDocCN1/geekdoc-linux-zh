  trans: "\n\n```\nrequire 'rubygems'\nrequire 'sinatra'\n\nget '/' do\n\"Hello World!\"\
    \nend\n\nrun Sinatra::Application\n```\n\n每个应用程序都定义在一个块中，分别标记为 `server1` 和 `server2`。在这些块内部，还有一个对\
    \ uWSGI Consul 插件的调用。该调用连接到我们的 Consul 实例，并注册一个名为 `distributed_app` 的服务，ID 分为 `server1`\
    \ 或 `server2`。每个服务被分配了不同的端口，分别为 `2001` 和 `2002`。\n\n当框架运行时，这将创建出我们的两个 Web 应用程序工作进程，并在\
    \ `Consul` 上为每个进程注册一个服务。应用程序将使用本地 `Consul` 节点通过 `%h` 配置快捷方式创建服务，该快捷方式会用正确的主机名填充\
    \ `Consul` URL。\n\n```\nurl=http://%h.node.consul:8500...\n```\n\n最后，我们配置了一个 `ENTRYPOINT`\
    \ 指令来自动运行我们的 Web 应用程序工作进程。\n\n现在让我们构建我们的镜像。\n\n```bash\n$ sudo docker build -t=\"\
    jamtur01/distributed_app\" .\n```\n\n注意：你可以在 [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/7/consul/)\
    \ 上获取我们的 `distributed_app` `Dockerfile`、配置以及应用程序文件。\n\n## 7.2.6.2 构建我们的分布式客户端\n\
    \n我们现在要创建一个 `Dockerfile` 来构建我们的 `distributed_client` 镜像。先创建一个目录来存放我们的镜像。\n\n```bash\n\
    $ mkdir distributed_client\n$ cd distributed_client\n$ touch Dockerfile\n```\n\
    \n现在让我们来看 `distributed_client` 应用程序的 `Dockerfile`。\n\n```docker\nFROM ubuntu:16.04\n\
    LABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get\
    \ -qqy update\nRUN apt-get -qqy install ruby ruby-dev build-essential\nRUN gem\
    \ install --no-ri --no-rdoc json\n\nRUN mkdir -p /opt/distributed_client\nADD\
    \ client.rb /opt/distributed_client/\n\nWORKDIR /opt/distributed_client\n\nENTRYPOINT\
    \ [ \"ruby\", \"/opt/distributed_client/client.rb\" ]\nCMD []\n```\n\n该 `Dockerfile`\
    \ 安装了 Ruby 以及一些预备软件包和 gem。它创建了 `/opt/distributed_client` 目录并将其设置为工作目录。它将包含在 `client.rb`\
    \ 文件中的客户端应用程序代码复制到 `/opt/distributed_client` 目录。\n\n现在让我们快速查看我们的应用程序代码。\n\n```ruby\n\
    require \"rubygems\"\nrequire \"json\"\nrequire \"net/http\"\nrequire \"uri\"\n\
    require \"resolv\"\n\nuri = URI.parse(\"http://consul.service.consul:8500/v1/catalog/service/distributed_app\"\
    )\n\nhttp = Net::HTTP.new(uri.host, uri.port)\nrequest = Net::HTTP::Get.new(uri.request_uri)\n\
    response = http.request(request)\n\nwhile true\n  if response.body == \"{}\"\n\
    \    puts \"There are no distributed applications registered in Consul\"\n   \
    \ sleep(1)\n  elsif\n    result = JSON.parse(response.body)\n    result.each do\
    \ |service|\n      puts \"Application #{service['ServiceName']} with element #{service[\"\
    ServiceID\"]} on port #{service[\"ServicePort\"]} found on node #{service[\"Node\"\
    ]} (#{service[\"Address\"]}).\"\n      dns = Resolv::DNS.new.getresources(\"distributed_app.service.consul\"\
    , Resolv::DNS::Resource::IN::A)\n      puts \"We can also resolve DNS - #{service['ServiceName']}\
    \ resolves to #{dns.collect { |d| d.address }.join(\" and \")}.\"\n      sleep(1)\n\
    \    end\n  end\nend\n```\n\n我们的客户端检查 `Consul` HTTP API 和 `Consul` DNS 以是否存在名为\
    \ `distributed_app` 的服务。它查询主机 `consul.service.consul`，这是我们之前看到的 DNS CNAME 条目，它包含了我们\
    \ `Consul` 集群节点的所有 A 记录。这为我们的查询提供了简单的 DNS 轮询。\n\n如果不存在服务，它会在控制台上打印一条相应消息。如果它检测到\
    \ `distributed_app` 服务，则它将：\n\n*   解析来自 API 调用的 JSON 输出，并将一些有用信息返回到控制台。\n*   对该服务的任何\
    \ A 记录执行 DNS 查找并将其返回到控制台。\n\n这将允许我们看到在 `Consul` 集群上启动 `distributed_app` 容器的结果。\n\
    \n最后，我们的 `Dockerfile` 指定了一个 `ENTRYPOINT` 指令，在容器启动时运行 `client.rb` 应用程序。\n\n现在构建我们的镜像。\n\
    \n```bash\n$ sudo docker build -t=\"jamtur01/distributed_client\" .\n```\n\n注意：你可以在\
    \ [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/7/consul/)\
    \ 上获取我们的 `distributed_client` `Dockerfile`、配置以及应用程序文件。\n\n## 7.2.6.3 启动我们的分布式应用程序\n\
    \n现在我们已经建立了所需的镜像，可以在 `larry` 和 `curly` 上启动我们的 `distributed_app` 应用程序容器。我们假设你已经按照我们在章早期配置的那样运行了\
    \ `Consul`。让我们先在 `larry` 上运行一个应用程序实例。\n\n```bash\nlarry$ sudo docker run --dns=172.17.0.1\
    \ -h $HOSTNAME -d --name larry_distributed jamtur01/distributed_app\n```\n\n"
