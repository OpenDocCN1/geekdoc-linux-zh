    \ and 162.243.170.66.\n```\n\n我们看到 `distributed_client` 应用程序查询了 HTTP API，并发现了\
    \ `distributed_app` 及其 `server1` 和 `server2` 工作节点在节点 `larry` 和 `curly` 上的条目。它还执行了\
    \ DNS 查询，以发现运行该服务的节点 IP 地址：`162.243.167.159` 和 `162.243.170.66`。\n\n如果这是一个真实的分布式应用程序，我们的客户端和工作节点可以利用这些信息来配置、连接以及在分布式应用的元素之间进行路由。这提供了一种简单、易用且弹性的方法来构建运行在独立的\
    \ Docker 容器和主机上的分布式应用程序。\n\n## 7.3 Docker Swarm\n\n[Docker Swarm](http://docs.docker.com/swarm/)\
    \ 是 Docker 的原生集群工具。它将一组 Docker 主机转换为一个单一的虚拟 Docker 主机。Swarm 具有简单的架构。它将多个 Docker\
    \ 主机聚集在一起，并在该集群之上提供标准的 Docker API。这非常强大，因为它将 Docker 容器的抽象层提升到了集群级别，而无需你学习新的 API。这使得与已经支持\
    \ Docker API 的工具（包括标准 Docker 客户端）的集成变得简单。对于 Docker 客户端来说，Swarm 集群只是另一个 Docker\
    \ 主机。\n\nSwarm 与许多其他 Docker 工具一样，遵循“内置电池但可拆卸”的设计原则。这意味着它附带了用于简单用例的工具和后端集成方案，并提供了一个\
    \ API 用于与更复杂的工具和用例进行集成。自 Docker 1.12 版本起，Swarm 就已经集成到 Docker 中了。在此之前，它是一个使用 Apache\
    \ 2 许可证许可的独立应用程序。\n\n### 7.3.1 理解 Swarm\n\nSwarm（群集）是一个 Docker 主机的集群，你可以在上面部署服务。从\
    \ Docker 1.12 开始，命令行工具就已包含了 `swarm` 模式。这允许 `docker` 二进制文件创建和管理集群，并运行本地容器。\n\n\
    Swarm 由管理器节点（manager）和工作节点（worker）组成。管理器负责集群上工作的分发和组织。每个工作单元被称为任务（task）。管理器还处理所有保持集群健康和活跃的集群功能。你可以拥有多个管理器节点，如果数量多于一个，则管理器节点将进行领导者（leader）选举。\n\
    \n工作节点运行来自管理器的任务。在默认情况下，每个节点（包括管理器和工作节点）都会被配置为 swarm 节点，仅执行活动而不运行任务。\n\n由于任务是一个非常原子的单元，因此\
    \ swarm 使用了一个更大的抽象，称为“服务”（service）。定义的服务由在在一个或多个节点上执行的命令组成。你可以在几种模式下运行服务：\n\n\
    - 副本服务（Replicated services）—— 管理器根据规模在工作节点之间分发任务。\n- 全局服务（Global services）—— 为每个可用工作节点分发一个任务。\n\
    \nSwarm 还像本地 Docker 主机一样管理负载均衡和 DNS。每个 swarm 都可以自动或手动暴露端口。swarm 处理内部 DNS，使服务变得是可发现的。\n\
    \n### 7.3.2 安装 Swarm\n\n安装 Swarm 最简单的方法是使用 Docker 本身。因此，Swarm 的先决条件并不比我们在第 2 章看到的更多。在\
    \ Docker 1.12 集成 Swarm 之前，你可以通过 Docker 团队提供的名为 `swarm` 的 Docker 镜像来使用 Swarm。安装和使用说明可以在\
    \ [Docker Swarm 网站](https://docs.docker.com/swarm/) 上找到。我们将复用 `larry`、`curly`\
    \ 和 `moe` 主机来演示 Swarm。这些主机上已经安装了最新的 Docker 版本。\n\n### 7.3.3 设置 Swarm\n\n现在让我们创建一个\
    \ Swarm 集群。我们集群中的每个节点都运行一个代理（agent）。每个代理都将其相关的 Docker 守护进程注册到集群中。此外，还有用于管理集群的\
    \ Swarm 管理器。我们将在三个主机上创建两个工作节点和一个管理器。Swarm 地址与角色：\n\n| 主机 | IP 地址 | 角色 |\n| :---\
    \ | :--- | :--- |\n| larry | 162.243.167.159 | 管理器 (Manager) |\n| curly | 162.243.170.66\
    \ | 工作节点 (Worker) |\n| moe | 162.243.191.16 | 工作节点 (Worker) |\n\n我们需要确保某些端口是开放的。\n\
    \n| 端口 | 用途 |\n| :--- | :--- |\n| 2377 | 集群管理 |\n| 7946 + udp | 节点通信 |\n| 4789\
    \ + udp | 覆盖网络 |\n\n我们将在 `larry` 上启动 swarm，并将其作为我们的 swarm 管理器。我们再次需要 `larry` 的公网\
    \ IP 地址。让我们将其赋值给环境变量。\n\n```\nlarry$ PUBLIC_IP=\"$(ifconfig eth0 | awk -F ' *:'\
    \ '{print $4}')\nlarry$ echo $PUBLIC_IP\n162.243.167.159\n```\n\n现在让我们使用该地址在 `larry`\
    \ 上初始化 swarm。\n\n```\n$ sudo docker swarm init --advertise-addr $PUBLIC_IP\nSwarm\
    \ initialized: current node (bu84wfix0h0x3aut8qlpbi9x) is now a manager\n```\n\
    \n要向此 swarm 添加工作节点，请运行以下命令：\n\n```bash\ndocker swarm join \\\n    --token SWMTKN-1-2mk0wnb9cdwhheoysr3pt8orxku8c7x3kjjsxatc5ua72v-776lg9r60gigwb32q329m0dli\
    \ \\\n    162.243.167.159:237\n```\n\n要向此 swarm 添加管理器，请运行以下命令：\n\n```bash\ndocker\
    \ swarm join \\\n    --token SWMTKN-1-2mk0wnb9cdwhheoysr3pt8orxku8c7x3kjjsxatc5ua72v-78bsc54abf35rhprntbh98t8\
