  trans: "\n\n由于 `Consul` 是分布式的，我们通常会创建三个（或更多）主机分别运行在不同的数据中心、云或区域中。或者甚至在每个应用程序服务器上添加一个代理。这将为我们提供足够的分布式弹性能力。我们将通过创建三个各带有\
    \ `Docker` 守护进程的新主机来运行 `Consul`，以模拟这种所需的分布情况。我们将创建三个新的 Ubuntu 16.04 主机：`larry`、`curly`\
    \ 和 `moe`。在每个主机上，我们都会安装 `Docker` 守护进程。我们还将拉取 `jamtur01/consul` 镜像。\n\n提示：使用任何你启动新主机的方法创建主机，要安装\
    \ `Docker`，可以使用第 2 章中的安装说明。\n\n```\n$ sudo docker pull jamtur01/consul\n```\n\n\
    在每个主机上，我们将运行一个带有 `jamtur01/consul` 镜像的 `Docker` 容器。为了做到这一点，我们需要选择一个运行 `Consul`\
    \ 的网络。大多数情况下这将是一个私有网络，但由于我们只是在模拟 `Consul` 集群，我将使用每个主机的公共接口。为了在这个公共网络上启动 `Consul`，我需要每个主机的公共\
    \ IP 地址。这是我们要绑定到每个 `Consul` 代理的地址。\n\n让我们现在在 `larry` 上获取该地址并将其赋值给环境变量 `$PUBLIC_IP`。\n\
    \n```\nlarry$ PUBLIC_IP=\"$(ifconfig eth0 | awk -F ' *|:' '/inet addr/{print $4}')\"\
    \nlarry$ echo $PUBLIC_IP\n162.243.167.159\n```\n\n然后在 `curly` 和 `moe` 上同样创建相同的\
    \ `$PUBLIC_IP` 变量。\n\n```\ncurly$ PUBLIC_IP=\"$(ifconfig eth0 | awk -F ' *|:'\
    \ '/inet addr/{print $4}')\"\ncurly$ echo $PUBLIC_IP\n162.243.170.66\nmoe$ PUBLIC_IP=\"\
    $(ifconfig eth0 | awk -F ' *|:' '/inet addr/{print $4}')\"\nmoe$ echo $PUBLIC_IP\n\
    159.203.191.16\n```\n\n我们看到已经有了三个主机，并且每个 IP 地址都分配给了 `$PUBLIC_IP`。\n\n### Consul\
    \ 主机 IP 地址\n\n| 主机 | IP 地址 |\n| ------ | ------ |\n| larry | 162.243.167.159 |\n\
    | curly | 162.243.170.66 |\n| moe | 159.203.191.16 |\n\n我们还需要提名一个主机来引导（bootstrap）集群。我们将选择\
    \ `larry`。这意味着我们需要告诉 `curly` 和 `moe` `larry` 的 IP 地址以加入哪个 `Consul` 集群。让我们现在通过将\
    \ `larry` 的 IP 地址 `162.243.167.159` 添加到 `curly` 和 `moe` 的环境变量 `$JOIN_IP` 中来实现。\n\
    \n```\ncurly$ JOIN_IP=162.243.167.159\nmoe$ JOIN_IP=162.243.167.159\n```\n\n###\
    \ 7.2.4 启动 Consul 引导节点\n\n让我们在 `larry` 上启动引导节点。我们的 `docker run` 命令将有点复杂，因为我们要映射许多端口。事实上，我们需要映射表\
    \ 7 中列出的所有端口。而且由于我们是在容器中运行 `Consul` 并连接到其他主机，我们将每个端口映射到本地主机的相应端口。这将允许内部和外部访问 `Consul`。\n\
    \n现在来看看我们的 `docker run` 命令。\n\n```\nlarry$ sudo docker run -d -h $HOSTNAME \\\n\
    -p 8300:8300 -p 8301:8301 \\\n-p 8301:8301/udp -p 8302:8302 \\\n-p 8302:8302/udp\
    \ -p 8400:8400 \\\n-p 8500:8500 -p 53:53/udp \\\n--name larry_agent jamtur01/consul\
    \ \\\n-server -advertise $PUBLIC_IP -bootstrap-expect 3\n```\n\n在这里，我们使用 `jamtur01/consul`\
    \ 镜像启动了一个守护进程容器来运行我们的 `Consul` 代理。我们通过 `-h` 标志将容器的主机设置为 `$HOSTNAME` 环境变量的值。这把\
    \ `Consul` 代理的名字设置为本地主机名 `larry`。我们为 `Consul` 代理指定了一些命令行选项。\n\n```\n-server -advertise\
    \ $PUBLIC_IP -bootstrap-expect 3\n```\n\n`-server` 标志告诉代理以服务器模式运行。`-advertise`\
    \ 标志告诉服务器在 `$PUBLIC_IP` 指定的 IP 地址上进行广播。最后，`-bootstrap-expect` 标志告诉 `Consul` 集群中预期有多少个代理。在这种情况下是\
    \ 3 个代理。它还会引导集群。\n\n让我们用 `docker logs` 命令查看初始 `Consul` 容器的日志。\n\n```\nlarry$ sudo\
    \ docker logs larry_agent\n==> WARNING: Expect Mode enabled, expecting 3 servers\n\
    ==> Starting Consul agent...\n==> Starting Consul agent RPC...\n==> Consul agent\
    \ running!\n         Node name: 'larry'\n        Datacenter: 'dc1'\n         \
    \   Server: true (bootstrap: false)\n       Client Addr: 0.0.0.0 (HTTP: 8500,\
    \ HTTPS: -1, DNS: 53, RPC: 8400)\n      Cluster Addr: 162.243.167.159 (LAN: 8301,\
    \ WAN: 8302)\n    Gossip encrypt: false, RPC-TLS: false, TLS-Incoming: false\n\
    \             Atlas: <disabled>\n\n==> Log data will now stream in as it occurs:\n\
    \n. . .\n\n2016/08/06 12:35:11 [INFO] serf: EventMemberJoin: larry.dc1 162.243.167.159\n\
    2016/08/06 12:35:11 [INFO] consul: adding LAN server larry (Addr: 162.243.167.159:8300)\
    \ (DC: dc1)\n2016/08/06 12:35:11 [INFO] consul: adding WAN server larry.dc1 (Addr:\
    \ 162.243.167.159:8300) (DC: dc1)\n2016/08/06 12:35:11 [ERR] agent: failed to\
    \ sync remote state: No cluster leader\n2016/08/06 12:35:12 [WARN] raft: EnableSingleNode\
    \ disabled, and no known peers. Aborting election.\n```\n\n我们看到 `larry` 上的代理已启动，但由于我们还没有其他节点，所以还没有发生选举。我们从返回的唯一错误知道这一点。\n\
    \n### 7.2.5 启动剩余节点\n\n我们看到 `curly` 加入了 `larry`，确实，在 `larry` 上我们应该看到类似的内容：\n\n\
    ```\n2016/08/06 12:37:17 [INFO] serf: EventMemberJoin: curly 162.243.170.66\n\
    2016/08/06 12:37:17 [INFO] consul: adding LAN server curly (Addr: 162.243.170.66:8300)\
    \ (DC: dc1)\n```\n\n"
- fmt: "\nBut we’ve still not got a quorum in our cluster, remember we told `-bootstrap-expect`\
    \ to expect 3 nodes. So let’s start our final agent on `moe`.\n\n```\nmoe$ sudo\
    \ docker run -d -h $HOSTNAME \\\n-p 8300:8300 -p 8301:8301 \\\n-p 8301:8301/udp\
    \ -p 8302:8302 \\\n-p 8302:8302/udp -p 8400:8400 \\\n-p 8500:8500 -p 53:53/udp\
    \ \\\n--name moe_agent jamtur01/consul \\\n-server -advertise $PUBLIC_IP -join\
    \ $JOIN_IP\n```\n\nOur `docker run` command is basically the same as what we ran\
    \ on `curly`. But this time we have three agents in our cluster. Now, if we look\
    \ at the container’s logs, we will see a full cluster.\n\n```\nmoe$ sudo docker\
    \ logs moe_agent\n==> Starting Consul agent...\n==> Starting Consul agent RPC...\n\
    ==> Joining cluster...\n    Join completed. Synced with 1 initial agents\n==>\
    \ Consul agent running!\n         Node name: 'moe'\n        Datacenter: 'dc1'\n\
    \            Server: true (bootstrap: false)\n       Client Addr: 0.0.0.0 (HTTP:\
    \ 8500, HTTPS: -1, DNS: 53, RPC: 8400)\n      Cluster Addr: 159.203.191.16 (LAN:\
    \ 8301, WAN: 8302)\n    Gossip encrypt: false, RPC-TLS: false, TLS-Incoming: false\n\
    \             Atlas: <disabled>\n\n==> Log data will now stream in as it occurs:\n\
    \n. . .\n\n2016/08/06 12:39:14 [ERR] agent: failed to sync remote state: No cluster\
    \ leader\n2016/08/06 12:39:15 [INFO] consul: New leader elected: larry\n2016/08/06\
    \ 12:39:16 [INFO] agent: Synced service 'consul'\n```\n\nWe see from our container’s\
    \ logs that `moe` has joined the cluster. This causes Consul to reach its expected\
    \ number of cluster members and triggers a leader election. In this case `larry`\
    \ is elected cluster leader.\n\nWe see the result of this final agent joining\
    \ in the Consul logs on `larry` too.\n\n```\n2016/08/06 12:39:14 [INFO] consul:\
    \ Attempting bootstrap with nodes: [162.243.170.66:8300 159.203.191.16:8300 162.243.167.159:8300]\n\
    2016/08/06 12:39:15 [WARN] raft: Heartbeat timeout reached, starting election\n\
    2016/08/06 12:39:15 [INFO] raft: Node at 162.243.170.66:8300 [Candidate] entering\
    \ Candidate state\n2016/08/06 12:39:15 [WARN] raft: Remote peer 159.203.191.16:8300\
    \ does not have local node 162.243.167.159:8300 as a peer\n2016/08/06 12:39:15\
    \ [INFO] raft: Election won. Tally: 2\n2016/08/06 12:39:15 [INFO] raft: Node at\
    \ 162.243.170.66:8300 [Leader] entering Leader state\n2016/08/06 12:39:15 [INFO]\
    \ consul: cluster leadership acquired\n2016/08/06 12:39:15 [INFO] consul: New\
    \ leader elected: larry\n2016/08/06 12:39:15 [INFO] raft: pipelining replication\
    \ to peer 159.203.191.16:8300\n2016/08/06 12:39:15 [INFO] consul: member 'larry'\
    \ joined, marking health alive\n2016/08/06 12:39:15 [INFO] consul: member 'curly'\
    \ joined, marking health alive\n2016/08/06 12:39:15 [INFO] raft: pipelining replication\
    \ to peer 162.243.170.66:8300\n2016/08/06 12:39:15 [INFO] consul: member 'moe'\
    \ joined, marking health alive\n```\n\nWe can also browse to the Consul web interface\
    \ on `larry` on port `8500` and select the `Consul` service to see the current\
    \ state.\n\n![The Consul service in the web interface.](images/00037.jpeg)\n\n\
    The Consul service in the web interface.\n\nFinally, we can test the DNS is working\
    \ using the `dig` command. We specify our local Docker bridge IP as the DNS server.\
    \ That’s the IP address of the Docker interface: `docker0`.\n\n```\nlarry$ ip\
    \ addr show docker0\n3: docker0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc\
    \ noqueue state UP group default\n    link/ether 56:84:7a:fe:97:99 brd ff:ff:ff:ff:ff:ff\n\
    \    inet 172.17.0.1/16 scope global docker0\n       valid_lft forever preferred_lft\
    \ forever\n    inet6 fe80::5484:7aff:fefe:9799/64 scope link\n       valid_lft\
    \ forever preferred_lft forever\n```\n\nWe see the interface has an IP of `172.17.0.1`.\
    \ We use the `dig` command to query.\n\n```\nlarry$ dig @172.17.0.1 consul\n```\n"
  raw: "But we’ve still not got a quorum in our cluster, remember we told `-bootstrap-expect`\
    \ to expect 3 nodes. So let’s start our final agent on `moe`.\n\n```\nmoe$ sudo\
    \ docker run -d -h $HOSTNAME \\\n-p 8300:8300 -p 8301:8301 \\\n-p 8301:8301/udp\
    \ -p 8302:8302 \\\n-p 8302:8302/udp -p 8400:8400 \\\n-p 8500:8500 -p 53:53/udp\
    \ \\\n--name moe_agent jamtur01/consul \\\n-server -advertise $PUBLIC_IP -join\
    \ $JOIN_IP\n```\n\nOur `docker run` command is basically the same as what we ran\
    \ on `curly`. But this time we have three agents in our cluster. Now, if we look\
    \ at the container’s logs, we will see a full cluster.\n\n```\nmoe$ sudo docker\
    \ logs moe_agent\n==> Starting Consul agent...\n==> Starting Consul agent RPC...\n\
    ==> Joining cluster...\n    Join completed. Synced with 1 initial agents\n==>\
    \ Consul agent running!\n         Node name: 'moe'\n        Datacenter: 'dc1'\n\
    \            Server: true (bootstrap: false)\n       Client Addr: 0.0.0.0 (HTTP:\
    \ 8500, HTTPS: -1, DNS: 53, RPC: 8400)\n      Cluster Addr: 159.203.191.16 (LAN:\
    \ 8301, WAN: 8302)\n    Gossip encrypt: false, RPC-TLS: false, TLS-Incoming: false\n\
    \             Atlas: <disabled>\n\n==> Log data will now stream in as it occurs:\n\
    \n. . .\n\n2016/08/06 12:39:14 [ERR] agent: failed to sync remote state: No cluster\
    \ leader\n2016/08/06 12:39:15 [INFO] consul: New leader elected: larry\n2016/08/06\
    \ 12:39:16 [INFO] agent: Synced service 'consul'\n```\n\nWe see from our container’s\
    \ logs that `moe` has joined the cluster. This causes Consul to reach its expected\
    \ number of cluster members and triggers a leader election. In this case `larry`\
    \ is elected cluster leader.\n\nWe see the result of this final agent joining\
    \ in the Consul logs on `larry` too.\n\n```\n2016/08/06 12:39:14 [INFO] consul:\
    \ Attempting bootstrap with nodes: [162.243.170.66:8300 159.203.191.16:8300 162.243.167.159:8300]\n\
    2016/08/06 12:39:15 [WARN] raft: Heartbeat timeout reached, starting election\n\
    2016/08/06 12:39:15 [INFO] raft: Node at 162.243.170.66:8300 [Candidate] entering\
    \ Candidate state\n2016/08/06 12:39:15 [WARN] raft: Remote peer 159.203.191.16:8300\
    \ does not have local node 162.243.167.159:8300 as a peer\n2016/08/06 12:39:15\
    \ [INFO] raft: Election won. Tally: 2\n2016/08/06 12:39:15 [INFO] raft: Node at\
    \ 162.243.170.66:8300 [Leader] entering Leader state\n2016/08/06 12:39:15 [INFO]\
    \ consul: cluster leadership acquired\n2016/08/06 12:39:15 [INFO] consul: New\
    \ leader elected: larry\n2016/08/06 12:39:15 [INFO] raft: pipelining replication\
    \ to peer 159.203.191.16:8300\n2016/08/06 12:39:15 [INFO] consul: member 'larry'\
    \ joined, marking health alive\n2016/08/06 12:39:15 [INFO] consul: member 'curly'\
    \ joined, marking health alive\n2016/08/06 12:39:15 [INFO] raft: pipelining replication\
    \ to peer 162.243.170.66:8300\n2016/08/06 12:39:15 [INFO] consul: member 'moe'\
    \ joined, marking health alive\n```\n\nWe can also browse to the Consul web interface\
    \ on `larry` on port `8500` and select the `Consul` service to see the current\
    \ state\n\n![The Consul service in the web interface.](images/00037.jpeg)\n\n\
    The Consul service in the web interface.\n\nFinally, we can test the DNS is working\
    \ using the `dig` command. We specify our local Docker bridge IP as the DNS server.\
    \ That’s the IP address of the Docker interface: `docker0`.\n\n```\nlarry$ ip\
    \ addr show docker0\n3: docker0: <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc\
    \ noqueue state UP group default\n    link/ether 56:84:7a:fe:97:99 brd ff:ff:ff:ff:ff:ff\n\
    \    inet 172.17.0.1/16 scope global docker0\n       valid_lft forever preferred_lft\
    \ forever\n    inet6 fe80::5484:7aff:fefe:9799/64 scope link\n       valid_lft\
    \ forever preferred_lft forever\n```\n\nWe see the interface has an IP of `172.17.0.1`.\
    \ We then use this with the `dig` command.\n\n```\nlarry$ dig @172.17.0.1 consul.service.consul\n\
    ; <<>> DiG 9.10.3-P4-Ubuntu <<>> @172.17.0.1 consul.service.consul\n; (1 server\
    \ found)\n;; global options: +cmd\n;; Got answer:\n;; ->>HEADER<<- opcode: QUERY,\
    \ status: NOERROR, id: 42298\n;; flags: qr aa rd ra; QUERY: 1, ANSWER: 3, AUTHORITY:\
    \ 0, ADDITIONAL: 0\n\n;; QUESTION SECTION:\n;consul.service.consul.     IN  A\n\
    \n;; ANSWER SECTION:\nconsul.service.consul.  0   IN  A   162.243.170.66\nconsul.service.consul.\
    \  0   IN  A   159.203.191.16\nconsul.service.consul.  0   IN  A   162.243.167.159\n\
    \n;; Query time: 1 msec\n;; SERVER: 172.17.0.1#53(172.17.0.1)\n;; WHEN: Sat Aug\
    \ 06 12:54:18 UTC 2016\n;; MSG SIZE  rcvd: 150\n```\n\nHere we’ve queried the\
    \ IP of the local Docker interface as a DNS server and asked it to return any\
    \ information on `consul.service.consul`. This format is Consul’s DNS shorthand\
    \ for services: `consul` is the host and `service.consul` is the domain. Here\
    \ `consul.service.consul` represent the DNS entry for the Consul service itself.\n\
    \nFor example:\n\n```\nlarry$ dig @172.17.0.1 webservice.service.consul\n```\n\
    \nWould return all DNS A records for the service `webservice`. We can also query\
    \ individual nodes.\n\n```\nlarry$ dig @172.17.0.1 curly.node.consul +noall +answer\n\
    \n; <<>> DiG 9.10.3-P4-Ubuntu <<>> @172.17.0.1 curly.node.consul +noall +answer\n\
    ; (1 server found)\n;; global options: +cmd\ncurly.node.consul.  0   IN  A   162.243.170.66\n\
    ```\n\nTip You can see more details on Consul’s DNS interface [in the Consul documentation](http://www.consul.io/docs/agent/dns.html).\n\
    \nWe now have a running Consul cluster inside Docker containers running on three\
    \ separate hosts. That’s pretty cool but it’s not overly useful. Let’s see how\
    \ we can register a service in Consul and then retrieve that data.\n\n### 7.2.6\
    \ Running a distributed service with Consul in Docker\n\nTo register our service\
    \ we’re going to create a phony distributed application written in the [uWSGI](http://uwsgi-docs.readthedocs.org/en/latest/)\
    \ framework. We’re going to build our application in two pieces.\n\n*   A web\
    \ application, `distributed_app`. It runs web workers and registers them as services\
    \ with Consul when it starts.\n\n*   A client for our application, `distributed_client`.\
    \ The client reads data about `distributed_app` from Consul and reports the current\
    \ application state and configuration.\n\nWe’re going run the `distributed_app`\
    \ on two of our Consul nodes: `larry` and `curly`. We’ll run the `distributed_client`\
    \ client on the `moe` node.\n\n#### 7.2.6.1 Building our distributed application\n\
    \nWe’re going to start with creating a `Dockerfile` to build `distributed_app`.\
    \ Let’s create a directory to hold our image first.\n\n```\n$ mkdir distributed_app\n\
    $ cd distributed_app\n$ touch Dockerfile\n```\n\nNow let’s look at the `Dockerfile`\
    \ for our `distributed_app` application.\n\n```\nFROM ubuntu:16.04\nLABEL maintainer=\"\
    james@example.com\"\nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get -qqy update\n\
    RUN apt-get -qqy install ruby-dev git libcurl4-openssl-dev curl build-essential\
    \ python\nRUN gem install --no-ri --no-rdoc uwsgi sinatra\n\nRUN mkdir -p /opt/distributed_app\n\
    WORKDIR /opt/distributed_app\n\nRUN uwsgi --build-plugin https://github.com/unbit/uwsgi-consul\n\
    \nADD uwsgi-consul.ini /opt/distributed_app/\nADD config.ru /opt/distributed_app/\n\
    \nENTRYPOINT [ \"uwsgi\", \"--ini\", \"uwsgi-consul.ini\", \"--ini\", \"uwsgi-consul.ini:server1\"\
    , \"--ini\", \"uwsgi-consul.ini:server2\" ]\nCMD []\n```\n\nOur `Dockerfile` installs\
    \ some required packages including the uWSGI and Sinatra frameworks as well as\
    \ [a plugin to allow uWSGI to write to Consul](https://github.com/unbit/uwsgi-consul).\
    \ We create a directory called `/opt/distributed_app/` and make it our working\
    \ directory. We then add two files, `uwsgi-consul.ini` and `config.ru` to that\
    \ directory.\n\nThe `uwsgi-consul.ini` file configured uWSGI itself. Let’s look\
    \ at it now.\n\n```\n[uwsgi]\nplugins = consul\nsocket = 127.0.0.1:9999\nmaster\
    \ = true\nenable-threads = true\n\n[server1]\nconsul-register = url=http://%h.node.consul:8500,name=distributed_app,id=server1,port=2001\n\
    mule = config.ru\n\n[server2]\nconsul-register = url=http://%h.node.consul:8500,name=distributed_app,id=server2,port=2002\n\
    mule = config.ru\n```\n\nThe `uwsgi-consul.ini` file uses uWSGI’s Mule construct\
    \ to run two identical applications that do “Hello World” in the Sinatra framework.\
    \ Let’s look at those in the `config.ru` file."
