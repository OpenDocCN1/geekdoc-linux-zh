  trans: "\n如果源是一个目录，则会复制整个目录，包括文件系统元数据；如果源是其他类型的文件，则会单独复制该文件及其元数据。在我们的示例中，目标路径以斜杠\
    \ `/` 结尾，因此它将被视为目录并复制到目标目录。\n\n如果目标不存在，则会创建该目标及其路径上所有缺失的目录，就像 `mkdir -p` 命令的工作方式一样。\n\
    \n### 4.5.10.9 LABEL\n\n`LABEL` 指令用于向 Docker 镜像添加元数据。元数据以键值对的形式存在。让我们来看一个示例。\n\
    \n```\nLABEL version=\"1.0\"\nLABEL location=\"New York\" type=\"Data Center\"\
    \ role=\"Web Server\"\n```\n\n`LABEL` 指令的格式为 `label=\"value\"`。你可以为每个标签指定一个元数据项，也可以指定用空格分隔的多个项。我们建议将所有元数据合并到单个\
    \ `LABEL` 指令中，以避免为每条元数据都创建一个一个新的镜像层。你可以使用 `docker inspect` 命令检查镜像上的标签。\n\n```\n\
    $ sudo docker inspect jamtur01/apache2\n. . .\n\n    \"Labels\": {\n      \"version\"\
    : \"1.0\",\n      \"location\": \"New York\",\n      \"type\": \"Data Center\"\
    ,\n      \"role\": \"Web Server\"\n    },\n```\n\n在这里我们看到了刚刚使用 `LABEL` 指令定义的元数据。\n\
    \n注意 `LABEL` 指令是在 Docker 1.6 中引入的。\n\n### 4.5.10.10 STOPSIGNAL\n\n`STOPSIGNAL`\
    \ 指令设置了当你告诉容器停止时发送给容器的系统调用信号。该信号可以是内核系统调用表中的有效数字（例如 9），也可以是 `SIGNAME` 格式的信号名称（例如\
    \ `SIGKILL`）。\n\n注意 `STOPSIGNAL` 指令是在 Docker 1.9 中引入的。\n\n### 4.5.10.11 ARG\n\n\
    `ARG` 指令定义了可以通过 `docker build` 命令在构建时传递的变量。这是通过 `--build-arg` 标志实现的。你只能指定在 `Dockerfile`\
    \ 中已经定义的构建时参数。\n\n```\nARG build\nARG webapp_user=user\n```\n\n第二个 `ARG` 指令设置了一个默认值，如果在构建时没有为参数赋值，则使用该默认值。现在让我们在\
    \ `docker build`中使用这些参数之一。\n\n```\n$ docker build --build-arg build=1234 -t jamtur01/webapp\
    \ .\n```\n\n在构建 `jamtur01/webapp` 镜像时，`build` 变量将被设置为 `1234`，而 `webapp_user` 变量将继承默认值\
    \ `user`。\n\n警告 此时你可能在想——这是传递凭据或密钥等秘密的一种极方法。不要这样做。你的凭据会在构建过程中以及镜像的构建历史中暴露。\n\n\
    Docker 有了一组预定义的 `ARG` 变量，你可以在构建时使用它们，而无需在 `Dockerfile` 中编写相应的 `ARG` 指令。\n\n```\n\
    HTTP_PROXY\nhttp_proxy\nHTTPS_PROXY\nhttps_proxy\nFTP_PROXY\nftp_proxy\nNO_PROXY\n\
    no_proxy\n```\n\n要使用这些预定义变量，在使用 `docker build` 命令时通过 `--build-arg <variable>=<value>`\
    \ 标志传递它们。\n\n注意 `ARG` 指令是在 Docker 1.9 中引入的，你可以在 [Docker 文档](http://docs.docker.com/engine/reference/builder/#arg)\
    \ 中阅读更多相关信息。\n\n### 4.5.10.12 SHELL\n\n`SHELL` 指令允许覆盖用于 shell 形式命令的默认 shell。Linux\
    \ 上的默认 shell 是 `[\"/bin/sh\", \"-c\"]`，Windows 上的是 `[\"cmd\", \"/S\", \"/C\"]`。\n\
    \n`SHELL` 指令在 Windows 等具有多个 shell 的平台上非常有用，例如在 `cmd` 或 `powershell` 环境中运行命令。或者当需要在\
    \ Linux 的特定 shell（例如 Bash）中运行命令时。\n\n`SHELL` 指令可以使用多次。每个新的 `SHELL` 指令都会覆盖之前所有的\
    \ `SHELL` 指令，并影响任何后续指令。\n\n### 4.5.10.13 HEALTHCHECK\n\n`HEALTHCHECK` 指令告诉 Docker\
    \ 如何测试容器以检查其仍在正常工作。这允许你检查诸如网站是否正在运行或 API 端点是否响应了正确的数据，从而让你能够识别出出现的问题，即使底层进程看起来仍在正常运行。\n\
    \n当容器指定了健康检查时，它除了正常状态外，还有一个健康状态。你可以像这样指定健康检查：\n\n```\nHEALTHCHECK --interval=10s\
    \ --timeout=1m --retries=5 CMD curl http://localhost || exit 1\n```\n\n`HEALTHCHECK`\
    \ 指令包含选项，然后是你想要运行的命令本身，两者通过 `CMD` 关键字隔开。\n\n我们首先指定了三个默认选项：\n\n*   `--interval`\
    \ - 默认 30 秒。这是健康检查之间的间隔。在这种情况下，第一次健康检查将在容器启动 10 秒后运行，之后每 10 秒运行一次。\n*   `--timeout`\
    \ - 默认 30 秒。如果健康检查持续时间超过超时时间，则被认为失败。\n*   `--retries` - 默认 30 次。\n\n"
