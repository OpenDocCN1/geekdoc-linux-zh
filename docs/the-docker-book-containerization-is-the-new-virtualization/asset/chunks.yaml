- fmt: "\nIf you’re using OS X, you can quickly get started with Docker using [Docker\
    \ for Mac](https://docs.docker.com/docker-for-mac/). Docker for Mac is a collection\
    \ of Docker components including a tiny virtual machine with a supporting command\
    \ line tool that is installed on an OS X host and provides you with a Docker environment.\n\
    \nDocker for Mac ships with a variety of components:\n\n* Hyperkit.\n* The Docker\
    \ client and server.\n* Docker Compose (see Chapter 7).\n* Docker Machine - Which\
    \ helps you create Docker hosts.\n* [Kitematic](https://kitematic.com/) - is a\
    \ GUI that helps you run Docker locally and interact with the Docker Hub.\n\n\
    ### 2.4.1 Installing Docker for Mac\n\nTo install Docker for Mac we need to download\
    \ its installer. You can find it [here](https://www.docker.com/community-edition#/mac).\n\
    \nLet’s grab the current release:\n\n```bash\n$ wget https://download.docker.com/mac/stable/Docker.dmg\n\
    ```\n\nLaunch the downloaded installer and follow the instructions to install\
    \ Docker for Mac.\n\n![Installing Docker for Mac on OS X](images/00003.jpeg)\n\
    \nInstalling Docker for Mac on OS X\n\n### 2.4.2 Testing Docker for Mac\n\nWe\
    \ can now test that our Docker for Mac installation is working by trying to connect\
    \ our local client to the Docker daemon running on the virtual machine. Make sure\
    \ the `Docker.app` is running and then open a terminal window and type:\n\n```bash\n\
    $ docker info\nContainers: 2\n Running: 0\n Paused: 0\n Stopped: 2\nImages: 13\n\
    Server Version: 1.12.1\nStorage Driver: aufs\n. . .\n```\n\nAnd presto! We have\
    \ Docker running locally on our OS X host.\n\nThere’s a lot more you can use and\
    \ configure with Docker for Mac and you can read its documentation on the [Docker\
    \ for Mac site](https://docs.docker.com/docker-for-mac/).\n\n## 2.5 Docker for\
    \ Windows installation\n\nIf you’re using Microsoft Windows, you can quickly get\
    \ started with Docker using [Docker for Windows](https://docs.docker.com/docker-for-windows/).\
    \ Docker for Windows is a collection of Docker components including a tiny Hyper-V\
    \ virtual machine with a supporting command line tool that is installed on a Microsoft\
    \ Windows host and provides you with a Docker environment.\n\nDocker for Windows\
    \ ships with a variety of components:\n\n* The Docker client and server.\n* Docker\
    \ Compose (see Chapter 7).\n* Docker Machine - Which helps you create Docker hosts.\n\
    * [Kitematic](https://kitematic.com/) - is a GUI that helps you run Docker locally\
    \ and interact with the Docker Hub.\n\nDocker for Windows requires 64bit Windows\
    \ 10 Pro, Enterprise or Education (with the 1511 November update, Build 10586\
    \ or later) and Microsoft Hyper-V. If your host does not satisfy these requirements,\
    \ you can install the [Docker Toolbox](https://docs.docker.com/toolbox/overview/),\
    \ which uses Oracle Virtual Box instead of Hyper-V.\n\nTip You can also install\
    \ a Docker client via the [Chocolatey](https://chocolatey.org/packages/docker)\
    \ package manager.\n\n### 2.5.1 Installing Docker for Windows\n\nTo install Docker\
    \ for Windows we need to download its installer. You can find it [here](https://www.docker.com/community-edition#/windows).\n\
    \nLet’s grab the current release:\n\n```bash\nhttps://download.docker.com/win/stable/InstallDocker.msi\n\
    ```\n\nLaunch the downloaded installer and follow the instructions to install\
    \ Docker for Windows.\n\n### 2.5.2 Testing Docker for Windows\n\nWe can now test\
    \ that our Docker for Windows installation is working by trying to connect our\
    \ local client to the Docker daemon running on the virtual machine. Ensure the\
    \ `Docker` application is running and open a terminal window and run:\n\n```bash\n\
    $ docker info\nContainers: 2\n Running: 0\n Paused: 0\n Stopped: 2\nImages: 13\n\
    Server Version: 1.12.1\nStorage Driver: aufs\n. . .\n```\n\nAnd presto! We have\
    \ Docker running locally on our Windows host.\n\nThere’s a lot more you can use\
    \ and configure with Docker for Windows and you can read its documentation on\
    \ the [Docker for Windows site](https://docs.docker.com/docker-for-windows/).\n\
    \n## 2.6 Using Docker on OSX and Windows with this book\n\nIf you are following\
    \ the examples in this book you will sometimes be asked to use volumes or the\
    \ `docker run` command with the `-v` flag to mount a local directory into a Docker\
    \ container may not work on Windows. You can’t mount a local directory on host\
    \ into the Docker host running in the Docker virtual machine because they don’t\
    \ share a file system. If you want to use any examples with volumes, such as those\
    \ in Chapters 5 and 6, I recommend you run Docker on a Linux-based host.\n\nIt’s\
    \ also worth reading the [Docker for Mac File Sharing](https://docs.docker.com/docker-for-mac/#file-sharing)\
    \ section or [Docker for Windows Shared Drive](https://docs.docker.com/docker-for-windows/#shared-drives)\
    \ section. This allows you enable volume usage by mounting directories into the\
    \ Docker for Mac and Docker for Windows client applications.\n\nTip All the examples\
    \ in the book assume you are using the latest Docker for Mac or Docker for Windows\
    \ versions.\n\n## 2.7 Docker installation script\n\nThere is also an alternative\
    \ method available to install Docker on an appropriate host using a remote installation\
    \ script. To use this script we need to `curl` it from [get.docker.com](https://get.docker.com).\n\
    \nNote The script currently only supports Ubuntu, Debian, and Gentoo.\n\nFirst,\
    \ we’ll need to ensure the `curl` command is installed.\n\n```bash\n$ whereis\
    \ curl\n```\n\nWe can use `apt-get` to install `curl` if necessary.\n\n```bash\n\
    $ sudo apt-get -y install curl\n```\n\nOr we can use `yum` or the newer `dnf`\
    \ on Fedora.\n\n```bash\n$ sudo yum -y curl\n```\n\nNow we can use the script\
    \ to install Docker.\n\n```bash\n$ curl https://get.docker.com/ | sudo sh\n```\n\
    \nThis will ensure that the required dependencies are installed and check that\
    \ our kernel is an appropriate version and that it supports an storage driver.\
    \ It will then install Docker and start the Docker daemon.\n\n## 2.8 Binary installation\n\
    \nIf we don’t wish to use any of the package-based installation methods, we can\
    \ download the latest binary version of Docker.\n\n```bash\n$ wget http://get.docker.com/builds/Linux/x86_64/docker-latest.tgz\n\
    ```\n\nI recommend not taking this approach as it reduces the maintainability\
    \ of your Docker installation. Using packages is simpler and easier to manage,\
    \ especially using automation or configuration management tools.\n\n## 2.9 The\
    \ Docker daemon\n\nAfter we’ve installed Docker, we need to confirm that the Docker\
    \ daemon is running. Docker runs as a `root`-privileged daemon process to allow\
    \ it to handle operations that can’t be executed by normal users (e.g., mounting\
    \ filesystems). The `docker` binary runs as a client of this daemon and also requires\
    \ `root` privileges to run. You can control the Docker daemon via [the `dockerd`\
    \ binary](https://docs.docker.com/engine/reference/commandline/dockerd/).\n\n\
    Note Prior to Docker 1.12 the daemon was controlled with the `docker daemon` subcommand.\n\
    \nThe Docker daemon should be started by default when the Docker package is installed.\
    \ By default, the daemon listens on a Unix socket at `/var/run/docker.sock` for\
    \ incoming Docker requests. If a group named `docker` exists on our system, Docker\
    \ will apply ownership of the socket to that group. Hence, any user that belongs\
    \ to the `docker` group can run Docker without needing to use the `sudo` command.\n\
    \nWarning Remember that the `docker` group group makes easier, it is still a security\
    \ exposure. The `docker` group is `root`-equivalent and should be limited to those\
    \ users and applications who absolutely need it.\n\n### 2.9.1 Configuring the\
    \ Docker daemon\n\nWe can change how the Docker daemon binds by adjusting the\
    \ `-H` flag when the daemon is run.\n\nWe can use the `-H` flag to specify different\
    \ interface and port configuration; for example, binding to the network:\n\n```bash\n\
    $ sudo dockerd -H tcp://0.0.0.0:2375\n```\n"
