  trans: "\n我们看到我们的示例（Sample）网站已经更新。这是一个编辑网站的简单示例，但你可以看到如何轻松地实现更多操作。更重要的是，你正在测试一个反映生产环境真实的站点。你现在可以为每种生产\
    \ Web 服务环境准备容器（例如 `Apache`、`Nginx`），或者用于运行不同版本的开发框架（如 `PHP` 或 `Ruby on Rails`），或者用于数据库后端等。\n\
    \n## 5.2 使用 Docker 构建和测试 Web 应用程序\n\n现在让我们来看一个更复杂的大型 Web 应用程序测试示例。我们将测试一个[基于 Sinatra\
    \ 的](http://www.sinatrarb.com/)Web 应用程序而不是静态网站，并在 Docker 中测试的同时开发该应用程序。Sinatra\
    \ 是一个基于 Ruby 的 Web 应用程序框架。它包含一个 Web 应用程序库和一个用于创建 Web 应用程序的简单领域语言（DSL）。与 `Ruby\
    \ on Rails` 等复杂的 Web 应用程序框架不同，Sinatra 不遵循模型-视图-控制器（MVC）模式，而是允许你创建快速简单的 Web 应用程序。\n\
    \n因此，它非常适合创建一个用于测试的小示例应用程序。在我们的案例中，这个新应用程序将接收传入的 URL 参数并将其输出为 JSON 哈希。我们还将利用这种应用程序架构向你展示如何将\
    \ Docker 容器连接在一起。\n\n### 5.2.1 构建我们的 Sinatra 应用程序\n\n创建一个名为 `sinatra` 的目录，存放我们的新应用程序以及构建所需的任何相关文件。\n\
    \n```\n$ mkdir -p sinatra\n$ cd sinatra\n```\n\n在 `sinatra` 目录中，让我们从一个 `Dockerfile`\
    \ 开始，以构建我们将用于开发 Sinatra Web 应用程序的基础镜像。\n\n```\nFROM ubuntu:16.04\nLABEL maintainer=\"\
    james@example.com\"\nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get update -yqq; apt-get\
    \ -yqq install ruby ruby-dev build-essential redis-tools\nRUN gem install --no-rdoc\
    \ --no-ri sinatra json redis\n\nRUN mkdir -p /opt/webapp\n\nEXPOSE 4567\n\nCMD\
    \ [ \"/opt/webapp/bin/webapp\" ]\n```\n\n你可以看到，我们创建了另一个基于 Ubuntu 的镜像，安装了 Ruby\
    \ 和 RubyGems，然后使用 `gem` 二进制文件安装了 `sinatra`、`json` 和 `redis` gem。`sinatra` 和 `json`\
    \ gem 包含了 Ruby 的 Sinatra 库以及对 JSON 的支持。我们稍后将使用 `redis` gem 来提供与 [Redis](http://redis.io/)数据库的集成。\n\
    \n我们还创建了一个目录来存放新的 Web 应用程序，并暴露了默认的 WEBrick 端口 `4567`。\n\n最后，我们指定了 `CMD` 为 `/opt/webapp/bin/webapp`，这将是启动我们\
    \ Web 应用程序的二进制文件。\n\n现在使用 `docker build` 命令构建这个新镜像。\n\n```\n$ sudo docker build\
    \ -t jamtur01/sinatra .\n```\n\n### 5.2.2 创建我们的 Sinatra 容器\n\n构建完成后。现在让我们下载 Sinatra\
    \ Web 应用程序的源代码。你可以在[Docker Book 网站](https://github.com/turnbullpress/dockerbook-code)找到此\
    \ Sinatra 应用程序的代码。该应用程序由 `webapp` 目录下的 `bin` 和 `lib` 目录组成。\n\n现在将其下载到 `sinatra`\
    \ 目录。\n\n```\n$ cd sinatra\n$ wget --cut-dirs=3 -nH -r -e robots=off --reject=\"\
    index.html\",\"Dockerfile\" --no-parent http://dockerbook.com/code/5/sinatra/webapp/\n\
    ```\n\n让我们快速查看包含在 `webapp/lib/app.rb` 文件中的 `webapp` 源代码核心。\n\n```\nrequire \"\
    rubygems\"\nrequire \"sinatra\"\nrequire \"json\"\n\nclass App < Sinatra::Application\n\
    \n  set :bind, '0.0.0.0'\n\n  get '/' do\n    \"<h1>DockerBook Test Sinatra app</h1>\"\
    \n  end\n\n  post '/json/?' do\n    params.to_json\n  end\n\nend\n```\n\n这是一个简单的应用程序，可以将任何发布到\
    \ `/json` 端点的参数转换为 JSON 并显示它们。\n\n我们还需要使用 `chmod` 命令在在使用之前确保 `webapp/bin/webapp`\
    \ 二进制文件是可执行的。\n\n```\n$ chmod +x webapp/bin/webapp\n```\n\n现在让我们使用 `docker run`\
    \ 命令从我们的镜像启动新容器。启动时我们应该处于 `sinatra` 目录，因为我们将使用卷（volume）将源代码挂载到容器中。\n\n```\n$ sudo\
    \ docker run -d -p 4567 --name webapp \\\n-v $PWD/webapp:/opt/webapp jamtur01/sinatra\n\
    ```\n\n在这里我们从 `jamtur01/sinatra` 镜像启动了一个名为 `webapp` 的新容器。我们指定了一个新卷，使用了存放新 Sinatra\
    \ Web 应用程序的 `webapp` 目录，并将其挂载到我们在 `Dockerfile` 中创建的目录：`/opt/webapp`。\n\n我们没有提供命令行运行的命令；相反，我们使用了通过镜像\
    \ `Dockerfile` 中的 `CMD` 指令指定的命令。\n\n```\n. . .\nCMD [ \"/opt/webapp/bin/webapp\"\
    \ ]\n. . .\n```\n\n该命令将在容器启动时执行。\n\n```\n. . .\nCMD [ \"/opt/webapp/bin/webapp\"\
    \ ]\n. . .\n```\n"
- fmt: "\n```ruby\nrequire \"rubygems\"\nrequire \"sinatra\"\nrequire \"json\"\nrequire\
    \ \"redis\"\n\nclass App < Sinatra::Application\n\n      redis = Redis.new(:host\
    \ => 'db', :port => '6379')\n\n      set :bind, '0.0.0.0'\n\n      get '/' do\n\
    \"<h1>DockerBook Test Redis-enabled Sinatra app</h1>\"\n      end\n\n      get\
    \ '/json' do\nparams = redis.get \"params\"\nparams.to_json\n      end\n\n   \
    \   post '/json/?' do\nredis.set \"params\", [params].to_json\nparams.to_json\n\
    \      end\nend\n```\n\nNote You can see the full source for our updated Redis-enabled\
    \ Sinatra application at [The Docker Book site](https://github.com/turnbullpress/dockerbook-code).\n\
    \nOur new application is basically the same as our previous application with support\
    \ for Redis added. We now create a connection to a Redis database on a host called\
    \ `db` on port `6379`. We also post our parameters to that Redis database and\
    \ then get them back from it when required.\n\nWe also need to ensure that the\
    \ `webapp_redis/bin/webapp` binary is executable prior to using it using the `chmod`\
    \ command.\n\n```\n$ chmod +x webapp_redis/bin/webapp\n```\n\n## 5.2.3.2 Building\
    \ a Redis database image\n\nTo build our Redis database, we’re going to create\
    \ a new image. Let’s create a directory, `redis` inside our `sinatra` directory,\
    \ to hold any associated files we’ll need for the Redis container build.\n\n```\n\
    $ mkdir redis\n$ cd redis\n```\n\nInside the `sinatra/redis` directory let’s start\
    \ with another `Dockerfile` for our Redis image.\n\n```dockerfile\nFROM ubuntu:16.04\n\
    LABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-06-01\nRUN apt-get\
    \ -yqq update; apt-get -yqq install redis-server redis-tools\nEXPOSE 6379\nENTRYPOINT\
    \ [\"/usr/bin/redis-server\" ]\nCMD []\n```\n\nWe’ve specified the installation\
    \ of the Redis server, exposed port `6379`, and specified an `ENTRYPOINT` that\
    \ will launch that Redis server. Let’s now build that image and call it `jamtur01/redis`.\n\
    \n```bash\n$ sudo docker build -t jamtur01/redis .\n```\n\nNow let’s create a\
    \ container from our new image.\n\n```bash\n$ sudo docker run -d -p 6379 --name\
    \ redis jamtur01/redis\n2df899db52baf469633459fa2abd34148ae4456a8c4a2343a0f372f2ee407756\n\
    ```\n\nWe’ve launched a new container named `redis` from our `jamtur01/redis`\
    \ image. Note that we’ve specified the `-p` flag to publish port `6379`. Let’s\
    \ see what port it’s running on.\n\n```bash\n$ sudo docker port redis 6379\n0.0.0.0:49161\n\
    ```\n\nOur Redis port is published on port `49161`. Let’s try to connect to that\
    \ Redis instance now.\n\nWe’ll need to install the Redis client locally to do\
    \ the test. This is usually the `redis-tools` package on Ubuntu.\n\n```bash\n\
    $ sudo apt-get -y install redis-tools\n```\n\nOr the `redis` package on Red Hat\
    \ and related distributions.\n\n```bash\n$ sudo yum install -y -q redis\n```\n\
    \nThen we can use the `redis-cli` command to check our Redis server.\n\n```bash\n\
    $ redis-cli -h 127.0.0.1 -p 49161\nredis 127.0.0.1:49161>\n```\n\nHere we’ve connected\
    \ the Redis client to `127.0.0.1` on port `49161` and verified that our Redis\
    \ server is working. You can use the `quit` command to exit the Redis CLI interface.\n\
    \n## 5.2.4 Connecting our Sinatra application to the Redis container\n\nLet’s\
    \ now update our Sinatra application to connect to Redis and store our incoming\
    \ parameters. In order to do that, we’re going to need to be able to talk to the\
    \ Redis server. There are two ways we could do this using:\n\n* Docker’s own internal\
    \ network.\n* From Docker 1.9 and later, using Docker Networking and the `docker\
    \ network` command.\n\nSo which method should I choose? Well the first method,\
    \ Docker’s internal network, is not an overly flexible or powerful solution. We’re\
    \ mostly going to discuss it to introduce you to how Docker networking functions.\
    \ We don’t recommend it as a solution for connecting containers.\n\nThe more realistic\
    \ method for connecting containers is Docker Networking.\n\n* Docker Networking\
    \ can connect containers to each other across different hosts.\n* Containers connected\
    \ via Docker Networking can be stopped, started or restarted without needing to\
    \ update connections.\n* With Docker Networking you don’t need to create a container\
    \ before you can connect to it. You also don’t need to worry about the order in\
    \ which you run containers and you get internal container name resolution and\
    \ discovery inside the network.\n\nWe’re going to look at Docker Networking for\
    \ connecting Docker containers together in the following sections.\n\n## 5.2.5\
    \ Docker internal networking\n\nThe first method involves Docker’s own internal\
    \ network. So far, we’ve seen Docker creates a network for every container. Every\
    \ time Docker creates a container, it creates a pair of interfaces. One end is\
    \ plugged into the `docker0` bridge, and the other end is plugged into the container.\
    \ You can think of a `veth` interface as one end of a virtual cable.\n\n```bash\n\
    ip a\n```\n"
