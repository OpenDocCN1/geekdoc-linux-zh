    这种模式传统上被称为“写时复制”（copy on write），它是让 Docker 如此强大的特性之一。每个只读镜像层都是只读的；此镜像永远不会改变。当创建一个容器时，Docker
    会从镜像栈进行构建，并在顶部添加一个读写层。该层结合其下方镜像层的知识以及一些配置数据，共同形成了容器。正如我们在上一章中发现的，容器是可以被更改的，它们具有状态，并且可以启动和停止。这以及镜像分层框架允许我们能够快速构建镜像并运行带有应用程序和服务的容器。


    ## 4.2 列出 Docker 镜像


    让我们通过查看 Docker 宿主机上有哪些镜像来开始学习 Docker 镜像。我们可以使用 `docker images` 命令来实现这一点。


    ```

    $ sudo docker images

    REPOSITORY TAG     IMAGE ID     CREATED     VIRTUAL SIZE

    ubuntu     latest  c4ff7513909d 6 days ago  225.4 MB

    ```


    我们看到有一个来自名为 `ubuntu` 仓库的镜像。那么这个镜像是从哪里来的呢？记得在第 3 章中，当我们运行 `docker run` 命令时，该过程的某一部分是在下载镜像吗？在我们的案例中，它就是
    `ubuntu` 镜像。


    注意本地镜像存储在我们本地 Docker 宿主机的 `/var/lib/docker` 目录下。每个镜像将位于一个以你的存储驱动命名的目录中；例如 `aufs`
    或 `devicemapper`。你还会在 `/var/lib/docker/containers` 目录下找到所有的容器。


    该镜像是从仓库下载的。镜像存储在仓库中，而仓库存储在注册表（registries）中。默认注册表是由 Docker, Inc. 管理的公共注册表 [Docker
    Hub](https://hub.docker.com)。


    提示 Docker 注册表代码是开源的。你也可以运行自己的注册表，正如我们在本章后面将看到的。Docker Hub 产品也作为商业“防火墙后”产品可用，名为
    [Docker Trusted Registry](https://docs.docker.com/docker-trusted-registry/)，以前称为
    Docker Enterprise Hub。![Docker Hub](img/00005.jpeg)


    Docker Hub


    在 [Docker Hub](https://hub.docker.com) 内部（或在你自己运行的 Docker 注册表中），镜像存储在仓库中。你可以将镜像仓库想象成非常像
    Git 仓库。它包含了镜像、层以及关于这些镜像的元数据。


    每个仓库可以包含多个镜像（例如，`ubuntu` 仓库包含 Ubuntu 12.04、12.10、13.04、13.10、14.04、16.04 的镜像）。现在让我们从
    `ubuntu` 仓库再获取另一个镜像。


    ```

    $ sudo docker pull ubuntu:16.04

    16.04: Pulling from library/ubuntu

    Digest: sha256:c6674c44c6439673bf56536c1a15916639c47ea04c3d6296c5df938add67b54b

    Status: Downloaded newer image for ubuntu:16.04

    ```


    在这里，我们使用了 `docker pull` 命令从 `ubuntu` 仓库拉取了 Ubuntu 16.04 镜像。


    让我们看看现在的 `docker images` 命令揭示了什么。


    ```

    $ sudo docker images

    REPOSITORY TAG     IMAGE ID     CREATED      VIRTUAL SIZE

    ubuntu     latest  5506de2b643b 3 weeks ago  199.3 MB

    ubuntu     16.04   0b310e6bf058 5 months ago 127.9 MB

    ```


    提示 在整本书中，我们都使用 `ubuntu` 镜像。这是一个相当重量级的镜像，大小为几百 MB。如果你更倾向于更小的，推荐 [Alpine Linux](https://hub.docker.com/_/alpine/)
    镜像，它是极轻量级的，基础镜像通常只有 5MB。它的镜像名称是 `alpine`。


    你可以看到我们现在已经有了 `latest` 的 Ubuntu 镜像和 `16.04` 镜像。这告诉我们 `ubuntu` 镜像实际上是收集在单个仓库下的的一系列镜像。


    注意 我们称其为 Ubuntu 操作系统，但实际上它并不是完整的操作系统。它是一个精简版本，只包含了运行该发行版所需的最低运行时。


    我们通过 Docker 所谓的“标签”（tags）来标识该仓库内部的每个镜像。每个镜像都是通过应用到其上的标签列出的，例如 `12.04`、`12.10`、`quantal`
    或 `precise` 等。每个标签共同标记了一系列代表特定镜像的镜像层（例如，`16.04` 标签收集了 Ubuntu 16.04 镜像的所有层）。这允许我们在一个仓库中存储多个镜像。


    我们可以通过在仓库名称后加上冒号和标签名称来引用仓库内部的特定镜像，例如：


    ```

    $ sudo docker run -t -i --name new_container ubuntu:16.04 /bin/bash

    root@79e36bff89b4:/#

    ```


    这从 `ubuntu:16.04` 镜像启动了一个容器，它是一个 Ubuntu 16.04 操作系统。


    从 `ubuntu:16.04` 构建容器始终是一个好主意。

