    ```

    $ sudo mkdir -p /var/jenkins_home

    $ cd /var/jenkins_home

    $ sudo chown -R 1000 /var/jenkins_home

    ```


    提示：如果你在 OS X 上运行此示例，你可能需要在 `/private/var/jenkins_home` 创建该目录。


    我们还将 `jenkins_home` 目录的所有者设置为 `1000`，这是我们即将构建的镜像内部 `jenkins` 用户的 UID。这将允许 Jenkins
    向该目录写入内容并存储我们的 Jenkins 配置。


    现在我们已经有了 `Dockerfile` 和 Jenkins 目录，让我们使用 `docker build` 命令构建一个新镜像。


    ```bash

    $ sudo docker build -t jamtur01/jenkins .

    ```


    我们给新镜像起了一个平平无奇的名字：`jamtur01/jenkins`。现在我们可以使用 `docker run` 命令从该镜像创建一个容器。


    ```bash

    $ sudo docker run -d -p 8080:8080 -p 50000:50000 \

    -v /var/jenkins_home:/var/jenkins_home \

    -v /var/run/docker.sock:/var/run/docker.sock \

    --name jenkins \

    jamtur01/jenkins

    ```


    我们可以看到我们使用了 `-p` 标志将宿主机的 `8080` 端口发布到 `8080` 端口，这通常是不良实践，但我们只运行一个 Jenkins 服务器。我们还将端口
    `50000` 绑定到 `50000`，它将被 Jenkins 构建 API 使用。


    接下来，我们使用 `-v` 标志挂载两个卷。第一个卷将 `/var/jenkins_home` 目录挂载到容器内的 `/var/jenkins_home`。这将包含
    Jenkins 的配置数据并允许我们跨容器启动持久化其状态。


    第二个卷将 `/var/run/docker.sock`（Docker 守护进程套接字）挂载到 Docker 容器。这将允许我们在 Jenkins 容器内部运行
    Docker 容器。


    警告：这是一个安全风险。通过在 Jenkins 容器内部绑定 Docker 套接字，你赋予了容器访问底层 Docker 宿主机的权限。这并不十分安全。我建议只有当你确认
    Jenkins 容器以及该 Docker 宿主机上的任何其他容器处于相当的安全水平时，才这样做。


