    \ path => [\"/var/log/nodeapp/nodeapp.log\", \"/var/log/redis/redis-server.log\"\
    ]\n  }\n}\noutput {\n  stdout {\n    codec => rubydebug\n  }\n}\n```\n\nThis is\
    \ a simple Logstash configuration that monitors two files: `/var/log/nodeapp/nodeapp.log`\
    \ and `/var/log/redis/redis-server.log`. Logstash will watch these files and send\
    \ any new data inside of them into Logstash. The second part of our configuration,\
    \ the `output` stanza, takes any events Logstash receives and outputs them to\
    \ standard out. In a real world Logstash configuration we would output to an Elasticsearch\
    \ cluster or other destination, but we’re just using this as a demo, so we’re\
    \ going to skip that.\n\nNote If you don’t know much about Logstash, you can learn\
    \ more [from my book](http://www.logstashbook.com) or the [Logstash documentation](http://logstash.net)."
