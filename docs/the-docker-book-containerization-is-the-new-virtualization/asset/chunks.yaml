    Compose then attaches to the logs of each service, each line of log output is
    prefixed with the abbreviated name of the service it comes from, and outputs them
    multiplexed:


    ```

    redis_1  | 1:M 05 Aug 17:49:17.839 * The server is now ready to accept connections
    on port 6379

    ```


    The services (and Compose) are being run interactively. That means if you use
    `Ctrl-C` or the like to cancel Compose then it’ll stop the running services. We
    could also run Compose with `-d` flag to run our services daemonized (similar
    to the `docker run -d` flag).


    ```

    $ sudo docker-compose up -d

    ```


    Let’s look at the sample application that’s now running on the host. The application
    is bound to all interfaces on the Docker host on port `5000`. So we can browse
    to that site on the host’s IP address or via `localhost`.


    ![Sample Compose application.](images/00035.jpeg)


    Sample Compose application.


    We see a message displaying the current counter value. We can increment the counter
    by refreshing the site. Each refresh stores the increment in Redis. The Redis
    update is done via the link between the Docker containers controlled by Compose.


    Tip By default, Compose tries to connect to a local Docker daemon but it’ll also
    honor the `DOCKER_HOST` environment variable to connect to a remote Docker host.


    ### 7.1.5 Using Compose


    Now let’s explore some of Compose’s other options. Firstly, let’s use `Ctrl-C`
    to cancel our running services and then restart them as daemonized services.


    Press `Ctrl-C` inside the `composeapp` directory and then re-run the `docker-compose
    up` command, this time with the `-d` flag.


    ```

    $ sudo docker-compose up -d

    Starting composeapp_web_1 ...

    Starting composeapp_redis_1 ...

    Starting composeapp_redis_1

    Starting composeapp_web_1 ... done

    $ . . .

    ```


    We see that Compose has recreated our services, launched them and returned to
    the command line.


    Our Compose-managed services are now running daemonized on the host. Let’s look
    at them now using the `docker-compose ps` command; a close cousin of the `docker
    ps` command.


    Tip You can get help on Compose commands by running `docker-compose help` and
    the command you wish to get help on, for example `docker-compose help ps`.


    The `docker-compose ps` command lists all of the currently running services from
    our local `docker-compose.yml` file.


    ```

    $ cd composeapp

    $ sudo docker-compose ps

    Name               Command                     State Ports

    ------------------------------------------------------------------

    composeapp_redis_1 docker-entrypoint.sh redis  Up    6379/tcp

    composeapp_web_1   python app.py               Up    0.0.0.0:5000->5000/tcp

    ```


    This shows some basic information about our running Compose services. The name
    of each service, what command we used to start the service, and the ports that
    are mapped on each service.


    We can also drill down further using the `docker-compose logs` command to show
    us the log events from our services.


    ```

    $ sudo docker-compose logs

    docker-compose logs

    Attaching to composeapp_redis_1, composeapp_web_1

    redis_1 |  (    ''      ,       .-`  | `,    )     Running in stand alone mode

    redis_1 |  |`-._`-...-` __...-.``-._|''` _.-''|     Port: 6379

    redis_1 |  |    `-._   `._    /     _.-''    |     PID: 1

    . . .

    ```


    This will tail the log files of your services, much as the `tail -f` command.
    Like the `tail -f` command you’ll need to use `Ctrl-C` or the like to exit from
    it.


    We can also stop our running services with the `docker-compose stop` command.


    ```

    $ sudo docker-compose stop

    Stopping composeapp_web_1...

    Stopping composeapp_redis_1...

    ```


    This will stop both services. If the services don’t stop you can use the `docker-compose
    kill` command to force kill the services.


    We can verify this with the `docker-compose ps` command again.


    ```

    $ sudo docker-compose ps

    Name               Command         State    Ports

    -------------------------------------------------

    composeapp_redis_1 redis-server    Exit 0

    composeapp_web_1   python app.py   Exit 0

    ```


    If you’ve stopped services using `docker-compose stop` or `docker-compose kill`
    you can also restart them again with the `docker-compose start` command. This
    is much like using the `docker start` command and will restart these services.


    Finally, we can remove services using the `docker-compose rm` command.


    ```

    $ sudo docker-compose rm

    Going to remove composeapp_redis_1, composeapp_web_1

    Are you sure? [yN] y

    Removing composeapp_redis_1...

    Removing composeapp_web_1...

    ```


    You’ll be prompted to confirm you wish to remove the services and then both services
    will be deleted. The `docker-compose ps` command will now show no running or stopped
    services.


    ```

    $ sudo docker-compose ps

    Name   Command   State   Ports

    ------------------------------

    ```


    ### 7.1.6 Compose in summary


    Now in one file we have a simple-Redis stack! You can see how much easier this
    can make constructing applications. This, however, just scratches the surface
    of what you can do with Compose. There are some more examples using [Rails](https://docs.docker.com/compose/rails/),
    [Django](https://docs.docker.com/compose/django/) and [Wordpress](https://docs.docker.com/compose/wordpress/)
    on the Compose website that introduce some advanced concepts.


    Tip You can see a full command line reference in the Docker Compose documentation.


    ## 7.2 Consul, Service Discovery and Docker


    Service discovery is the mechanism by which distributed applications manage their
    relationships. A distributed application is usually made up of multiple components.
    These components can be located together locally or distributed across data centers
    or geographic regions. Each of these components usually provides or consumes services
    to or from other components.


    Service discovery allows these components to find each other when they want to
    interact. Due to the distributed nature of these applications, service discovery
    mechanisms also need to be distributed. As they are usually the “glue” between
    components of distributed applications they also need to be dynamic, reliable,
    resilient and able to quickly and consistently share data about these services.


    Docker, with its focus on distributed applications and service-oriented and microservices
    architectures, is an ideal candidate for integration with a service discovery
    tool. Each Docker container can register its running service or services with
    the tool. This provides the information needed, for example an IP address or port
    or both, to allow interaction between services.


    Our example service discovery tool, [Consul](http://www.consul.io/), is a specialized
    datastore that uses consensus algorithms. Consul specifically uses the [Raft](http://en.wikipedia.org/wiki/Raft_(computer_science))
    consensus algorithm to require a quorum for writes. It also exposes a key value
    store and service catalog that is highly available, fault-tolerant, and maintains
    strong consistency guarantees. Services can register themselves with Consul and
    share that registration information in a highly available and distributed manner.


    Consul is also interesting because it provides:


    *   A service catalog with an API instead of the traditional `key=value` store
    of most service discovery tools.

    *   Both a DNS-based query interface through an inbuilt DNS server and a HTTP-based
    REST API to query the information. The choice of interfaces, especially the DNS-based
    interface, allows you to easily drop Consul into your existing environment.

    *   Service monitoring AKA health checks. Consul has powerful service monitoring
    built into the tool.

