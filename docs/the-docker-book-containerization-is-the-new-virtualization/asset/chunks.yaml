  trans: "\n\n[Apache Mesos](http://mesos.apache.org/) 项目是一个高可用的集群管理工具。从 Mesos `0.20.0`\
    \ 版本开始，它已经[内置了 Docker 集成](http://mesos.apache.org/documentation/latest/docker-containerizer/)，允许你在\
    \ Mesos 中使用容器。Mesos 在许多初创公司中流行，特别是 Twitter 和 AirBnB。\n\n### 7.4.4 Helios\n\n[Helios](https://github.com/spotify/helios)\
    \ 项目由 Spotify 团队发布，是一个 Docker 编排平台，用于在整个集群中部署和管理容器。它创建了“作业”（job）抽象，你可以将其部署在一个或多个运行\
    \ Docker 的 Helios 主上。\n\n### 7.4.5 Centurion\n\n[Centurion](https://github.com/newrelic/centurion)\
    \ 是一个由 New Relic 团队开源的基于 Docker 的部署工具。Centurion 从 Docker 注册表获取容器，并在具有正确环境变量、主机卷映射和端口映射的机群主主机上运行它们。它的设计旨在帮助你使用\
    \ Docker 进行持续部署。\n\n## 7.5 总结\n\n在本章中，我们向你介绍了使用 Compose 进行编排。我们展示了如何添加 Compose\
    \ 配置来创建简单的应用程序堆栈。我们展示了如何运行 Compose 并构建这些堆栈，以及如何对它们执行基础管理任务。\n\n我们还向你介绍了一个服务发现工具\
    \ Consul。我们将 Consul 安装到 Docker 环境中，并创建了一个 Consul 节点集群。我们还演示了简单的分布式应用程序在 Docker\
    \ 上是如何运行的。\n\n我们还查看了 Docker Swarm，将其作为一种 Docker 集群和调度工具。我们看到了如何安装 Swarm、如何管理它以及如何在其上调度工作负载。\n\
    \n最后，我们查看了 Docker 生态系统中可用的其他一些编排工具。\n\n在下一章中，我们将查看 Docker API、我们如何使用它，以及我们如何通过\
    \ TLS 加密到我们 Docker 守护进程的连接。\n\n# 8 使用 Docker API\n\n在第 6 章中，我们看到了一些如何围绕 Docker\
    \ 运行服务、构建应用程序和工作流的优秀示例。其中一个示例 TProv 应用侧重于在命令行中使用 `docker` 二进制执行文件并捕获产生的输出。这并不是一种与\
    \ Docker 集成的优雅方法；特别是当 Docker 自带一个功能强大的 API 可以让你直接进行集成时。\n\n在本章中，我们将向你介绍 Docker\
    \ API 并查看如何利用它。我们将引导你将 Docker 守护进程绑定到网络端口。然后，我们将从高层对你介绍 API 并介绍它的关键方面。我们还将查看在第\
    \ 6 章中看过的 TProv 应用，并重写它的部分内容以使用 API 代替 `docker` 二进制文件。最后，我们将查看如何通过 TLS 对 API 进行身份验证。\n\
    \n## 8.1 Docker APIs 在 Docker 生态系统中存在三个特定的 API。\n\n* [Registry API](https://docs.docker.com/registry/spec/api/)\
    \ - 提供了与 Docker 注册表的集成，该注册表存储了我们的镜像。\n\n* Docker Hub API - 提供与 [Docker Hub](https://hub.docker.com)\
    \ 的集成。\n\n* [Docker Engine API](https://docs.docker.com/engine/api/) - 提供了与 Docker\
    \ 守护进程的集成。\n\n所有三个 API 广上都是 [RESTful](http://en.wikipedia.org/wiki/Representational_state_transfer)。在本章中，我们将关注\
    \ Engine API，因为它是任何与 Docker 进行编程集成和交互的关键。\n\n## 8.2 Engine API 的第一步\n\n让我们探索 Docker\
    \ Engine API 并查看其功能。首先，我们需要记住 Engine API 是由 Docker 守护进程提供的。默认情况下，Docker 守护进程绑定到其运行的宿主机上的\
    \ socket，`unix:///var/run/docker.sock`。守护进程以 `root` 权限运行，以便获得管理相应资源所需的访问权限。正如我们在第\
    \ 2 章中发现的，如果你的系统中存在一个名为 `docker` 的组，Docker 将将 socket 的所有权赋给该组。因此，任何属于 `docker`\
    \ 组的用户都可以在不需要 `root` 权限的情况下运行 Docker。\n\n**警告** 请记住，尽管 `docker` 组让生活变得简单，但它仍然是一个安全漏洞。`docker`\
    \ 组的权限等同于 `root`，应该限制在那些绝对需要它的用户和应用程序上。\n\n如果我们从运行 Docker 的同一台主机上查询 API，这种方法运行良好；但如果我们想远程访问\
    \ API，则需要将 Docker 守护进程绑定到网络接口。这是通过向 Docker 守护进程传递或调整 `-H` 标志来实现。\n\n如果你想在本地使用\
    \ Docker API，我们使用 `curl` 命令来查询它，如下：\n\n```\n$ curl --unix-socket /var/run/docker.sock\
    \ http:/info\n{\"ID\":\"PH4R:BT7H:44F6:GQGP:FS2O:7OZO:HQ2P:NSVF:MK27:NBGZ:N3VP:K2O5\"\
    ,\"Containers\":3,\"ContainersRunning\":3,\"ContainersPaused\":0,\"ContainersStopped\"\
    :0,\"Images\":3,\"\n. . .\n}\n```\n\n在大多数发行版中，我们可以通过编辑守护进程的启动配置文件将 Docker 守护进程绑定到网络接口。对于旧版本的\
    \ Ubuntu 或 Debian，这将会是 `/etc/default/docker` 文件；对于那些使用 Upstart 的版本，将是 `/etc/init/docker.conf`\
    \ 文件；对于 systemd，将是 `/etc/systemd/system/docker.service` 文件。对于 Red Hat，则是 `/lib/systemd/system/docker.service`。\n\
    \n为了将 Docker 守护进程绑定到所有接口，我们将编辑 `/lib/systemd/system/docker.service` 文件并修改：\n\n\
    ```\nExecStart=/usr/bin/dockerd -H tcp://0.0.0.0:2375\n```\n\n然后我们使用 `systemctl`\
    \ 重新加载。\n\n```bash\nsudo systemctl daemon-reload\nsudo systemctl restart docker\n\
    ```\n\n**提示** 确保防火墙允许端口 2375 的 TCP 通信。现在使用 `docker` 二进制文件测试其是否有效，传递 `-H` 标志以指定我们的主机。\n\
    \n```bash\n$ docker -H docker.example.com:2375 info\n```\n\n这假设 Docker 主机名为 `docker.example.com`；我们使用了\
    \ `-H` 标志指定该主机。Docker 也会遵循 `DOCKER_HOST` 环境变量而不是继续使用 `-H` 标志。\n\n```bash\nexport\
    \ DOCKER_HOST=\"tcp://docker.example.com:2375\"\n```\n\n**警告** 请记住这个连接是未经验证且向全世界开放的！在本章后面，我们将查看如何为该连接添加身份验证。\n\
    \n既然我们通过 `docker` 二进制文件建立并确认了与 Docker 守护进程的连接，让我们直接连接 API。为此，我们将使用 `curl` 命令。我们将连接到\
    \ `info` API 端点，它提供的信息与 `docker info` 命令大致相同。\n\n```\n$ curl http://docker.example.com:2375/info\
    \ | python3 -mjson.tool\n{\n    \"ID\": \"PH4R:BT7H:44F6:GQGP:FS2O:7OZO:HQ2P:NSVF:MK27:NBGZ:N3VP:K2O5\"\
    ,\n    \"Containers\": 7,\n    \"ContainersRunning\": 1,\n    \"ContainersPaused\"\
    : 0,\n    \"ContainersStopped\": 6,\n    \"Images\": 3,\n    \"Driver\": \"aufs\"\
    ,\n    \"DriverStatus\": [\n        [\n. . .\n```\n\n我们使用 `curl` 命令连接到 `http://docker.example.com:2375`\
    \  Docker API，并指定了 Docker API 的路径：`docker.example.com` 端口 `2375` 以及端点 `info`。\n\
    \n"
- fmt: "\nWe see that the API has returned a JSON hash, of which we’ve included a\
    \ sample, containing the system information for the Docker daemon. This demonstrates\
    \ that the Docker API is working and we’re getting some data back. We’ve passed\
    \ the JSON through python’s `json.tool` to prettify it.\n\n### 8.3.1 Managing\
    \ images with the API\n\nLet’s start with some API basics: working with Docker\
    \ images. We’re going to start by getting a list of all the images on our Docker\
    \ daemon.\n\n```bash\n$ curl http://docker.example.com:2375/images/json | python3\
    \ -mjson.tool\n[\n    {\n        \"Id\": \"sha256:b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473\"\
    ,\n        \"ParentId\": \"\",\n        \"RepoTags\": [\n            \"jamtur01/distributed_app:latest\"\
    \n        ],\n        \"RepoDigests\": [\n            \"jamtur01/distributed_app@sha256:ecc6b617e9c776d8bd7ed281a55b02e9214d701cad72b9628f5668edfbb86a26\"\
    \n        ],\n        \"Created\": 1470488372,\n        \"Size\": 469434429,\n\
    \        \"VirtualSize\": 469434429,\n        \"Labels\": {}\n    },\n. . .\n\
    ]\n```\n\nWe’ve used the `/images/json` endpoint, which will return a list of\
    \ all images on the Docker daemon. It’ll give us much the same information as\
    \ the `docker images` command. We can also query specific images via ID, much\
    \ like `docker inspect` on an image ID.\n\n```bash\n$ curl http://docker.example.com:2375/images/b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473/json\
    \ | python3 -mjson.tool\n{\n    \"Id\": \"sha256:b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473\"\
    ,\n    \"RepoTags\": [\n        \"jamtur01/distributed_app:latest\"\n    ],\n\
    \    \"RepoDigests\": [\n        \"jamtur01/distributed_app@sha256:ecc6b617e9c776d8bd7ed281a55b02e9214d701cad72b9628f5668edfbb86a26\"\
    \n    ],\n    \"Parent\": \"\",\n    \"Comment\": \"\",\n    \"Created\": \"2016-08-06T12:59:32.957396238Z\"\
    ,\n. . .\n    }\n}\n```\n\nHere we see a subset of the output of inspecting our\
    \ `jamtur01/distributed_app` image. And finally, like the command line, we can\
    \ search for images on the Docker Hub.\n\n```bash\n$ curl \"http://docker.example.com:2375/images/search?term=jamtur01\"\
    \ | python3 -mjson.tool\n[\n    {\n        \"star_count\": 0,\n        \"is_official\"\
    : false,\n        \"name\": \"jamtur01/docker-jenkins-sample\",\n        \"is_automated\"\
    : true,\n        \"description\": \"\"\n    },\n    {\n        \"star_count\"\
    : 5,\n        \"is_official\": false,\n        \"name\": \"jamtur01/docker-presentation\"\
    ,\n        \"is_automated\": true,\n        \"description\": \"\"\n    },\n. .\
    \ .\n]\n```\n\nHere we’ve searched for all images containing the term `jamtur01`\
    \ and displayed a subset of the output returned. This is just a sampling of the\
    \ actions we can take with the Docker API. We can also build, update, and remove\
    \ images.\n\n### 8.3.2 Managing containers with the API\n\nThe Docker Engine API\
    \ also exposes all of the container operations available to us on the command\
    \ line. We can list running containers using the `/containers` endpoint much as\
    \ we would with the `docker ps` command.\n\n```bash\n$ curl -s \"http://docker.example.com:2375/containers/json\"\
    \ | python3 -mjson.tool\n[\n    {\n        \"Id\": \"d580b605fa1bcd210af0d2fe28e50a018f9ea546b56e8b28806d8dc16596340e\"\
    ,\n        \"Names\": [\n            \"/heyworld_global.0.bbctscdrhkro371mkieb0roid\"\
    \n        ],\n        \"Image\": \"ubuntu:latest\",\n        \"ImageID\": \"sha256:42118e3df42f09ca581a9deb3df27460193e42845f7e1833560a\"\
    ,\n        \"Command\": \"/bin/sh -c 'while true; do echo world; sleep 1; done'\"\
    ,\n        \"Created\": 147066972,\n        \"Ports\": [],\n        \"Labels\"\
    : {\n            \"docker.swarm.node.id\": \"c6viix7oja1twny8ez7hd\",\n      \
    \      \"docker.swarm.service.id\": \"5tw55i0509961x\",\n            \"docker.swarm.name\"\
    : \"heyworld_global\",\n            \"docker.swarm.task\": \"bbctscdrhkro371mkieb0roid\"\
    ,\n            \"docker.swarm.task.name\": \"heyworld_global.0\"\n        },\n\
    \        \"State\": \"running\",\n        \"Status\": \"Up 11 hours\",\n     \
    \   \"HostConfig\": {\n            \"NetworkMode\": \"default\"\n        },\n\
    . . .\n    ]\n```\n\nOur query will show all running containers on the Docker\
    \ host, in our case, a single container. To see running and stopped containers\
    \ we can add the `all` flag to the endpoint and set it to `1`.\n\n```bash\nhttp://docker.example.com:2375/containers/json?all=1\n\
    ```\n\nWe can also use the API to create containers by using `POST` request to\
    \ the `/containers/create` endpoint. Here is the simplest possible container call.\n\
    \n```bash\n$ curl -X POST \"Content-Type: application/json\" \\\nhttp://docker.example.com:2375/containers/create\
    \ \\\n-d '{\n     \"Image\":\"jamtur01/jekyll\"\n}'\n{\"Id\":\"591ba02d8d149e5ae5ec2a30ffe8ed4755\"\
    ,\"Warnings\":null}\n```\n\nWe call the `/containers/create` endpoint and `POST`\
    \ a JSON hash containing an image name to the endpoint. The API returns the ID\
    \ of the container we’ve just created and potentially any warnings. This will\
    \ create a container.\n\nWe can further configure our container creation by adding\
    \ key/value pairs to our JSON hash.\n\n```bash\n$ curl -X POST \"Content-Type:\
    \ application/json\" \\\n\"http://docker.example.com:2375/containers/create?name=jekyll\"\
    \ \\\n-d '{\n     \"Image\":\"jamtur01/jekyll\",\n     \"Hostname\":\"jekyll\"\
    \n}'\n{\"Id\":\"591ba02d8d149e5ae5ec2a30ffe8ed4755\",\"Warnings\":null}\n```\n\
    \nHere we’ve specified the `Hostname` key with a value of `jekyll` to set the\
    \ hostname of the resulting container. To start the container we use the `/containers/start`\
    \ endpoint.\n\n```bash\n$ curl -X POST \"Content-Type: application/json\" \\\n\
    http://docker.example.com:2375/containers/591ba02d8d149e5ae5ec2a30ffe8ed4755/start\
    \ \\\n-d '{\n         \"PublishAllPorts\":true\n}'\n```\n\nIn combination, this\
    \ provides the equivalent of running:\n\n```bash\n$ sudo docker run jamtur01/jekyll\n\
    ```\n\nWe can also inspect the resulting container via the `/containers/` endpoint.\n\
    \n```bash\n$ curl http://docker.example.com:2375/containers/591ba02d8d149e5ae5ec2a30ffe8ed4755/json\
    \ | python3 -mjson.tool\n{\n    \"Args\": [\n        \"build\",\n        \"--destination=/var/www/html\"\
    \n    ],\n. . .\n        \"Hostname\": \"591ba02d8d14\",\n        \"Image\": \"\
    jamtur01/jekyll\",\n. . .\n    \"Id\": \"591ba02d8d149e5ae5ec2a30ffe8ed4755\"\
    ,\n    \"Image\": \"29d4355e575cff59d7b7ad837055f231970296846ab58a037dd84be520d1cc31\"\
    ,\n. . .\n    \"Name\": \"/hopeful_davinci\",\n. . .\n}\n```\n\nHere we see we’ve\
    \ queried our container using the container ID and shown a sampling of the data\
    \ available to us.\n\n## 8.4 Improving the TProv application\n\nNow let’s look\
    \ at one of the methods inside the TProv application that we used in Chapter 6.\
    \ We’re going to look specifically at the methods which create and delete Docker\
    \ containers.\n\n```ruby\ndef create_instance(name)\n  cid = `docker run -P --volumes-from\
    \ #{name} -d -t jamtur01/tomcat7 2>&1`.chop\n  [$?.exitstatus == 0, cid]\nend\n\
    ```\n\nNote You can see the previous TProv code on `https://github.com/turnbullpress/dockerbook-code/tree/master/6/tprov`.\n\
    \nPretty crude, eh? We’re directly calling out to the `docker` binary and capturing\
    \ its output. There are lots of reasons that will be problematic, not least of\
    \ which is that you can only run the TProv application somewhere with the Docker\
    \ client installed.\n\nWe can improve on this interface by using the Docker API\
    \ via one of its client libraries, in this case the [Ruby Docker-API client library](https://github.com/swipely/docker-api).\n\
    \nTip You can find a full list of the available client libraries [here](https://docs.docker.com/engine/api/sdks/).\n\
    \nLet’s start by looking at how we establish our connection to the Docker API.\n\
    \n```ruby\nrequire 'docker'\n. . .\n\nmodule TProvAPI\n  class Application < Sinatra::Base\n\
    \n. . .\n\n    Docker.url = ENV['DOCKER_URL'] || 'http://localhost:2375'\n   \
    \ Docker.options = {\n      :ssl_verify_peer => false\n    }\n```\n"
  raw: "We see that the API has returned a JSON hash, of which we’ve included a sample,\
    \ containing the system information for the Docker daemon. This demonstrates that\
    \ the Docker API is working and we’re getting some data back. We’ve passed the\
    \ JSON through python’s JSON tool to prettify it.\n\n### 8.3.1 Managing images\
    \ with the API\n\nLet’s start with some API basics: working with Docker images.\
    \ We’re going to start by getting a list of all the images on our Docker daemon.\n\
    \n```\n$ curl http://docker.example.com:2375/images/json | python3 -mjson.tool\n\
    [\n    {\n        \"Id\": \"sha256:b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473\"\
    ,\n        \"ParentId\": \"\",\n        \"RepoTags\": [\n            \"jamtur01/distributed_app:latest\"\
    \n        ],\n        \"RepoDigests\": [\n            \"jamtur01/distributed_app@sha256:ecc6b617e9c776d8bd7ed281a55b02e9214d701cad72b9628f5668edfbb86a26\"\
    \n        ],\n        \"Created\": 1470488372,\n        \"Size\": 469434429,\n\
    \        \"VirtualSize\": 469434429,\n        \"Labels\": {}\n    },\n. . .\n\
    ]\n```\n\nWe’ve used the `/images/json` endpoint, which will return a list of\
    \ all images on the Docker daemon. It’ll give us much the same information as\
    \ the `docker images` command. We can also query specific images via ID, much\
    \ like `docker inspect` on an image ID.\n\n```\n$ curl http://docker.example.com:2375/images/b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473/json\
    \ | python3 -mjson.tool\n{\n    \"Id\": \"sha256:b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473\"\
    ,\n    \"RepoTags\": [\n        \"jamtur01/distributed_app:latest\"\n    ],\n\
    \    \"RepoDigests\": [\n        \"jamtur01/distributed_app@sha256:ecc6b617e9c776d8bd7ed281a55b02e9214d701cad72b9628f5668edfbb86a26\"\
    \n    ],\n    \"Parent\": \"\",\n    \"Comment\": \"\",\n    \"Created\": \"2016-08-06T12:59:32.957396238Z\"\
    ,\n. . .\n    }\n}\n```\n\nHere we see a subset of the output of inspecting our\
    \ `jamtur01/distributed_app` image. And finally, like the command line, we can\
    \ search for images on the Docker Hub.\n\n```\n$ curl \"http://docker.example.com:2375/images/search?term=jamtur01\"\
    \ | python3 -mjson.tool\n[\n    {\n        \"star_count\": 0,\n        \"is_official\"\
    : false,\n        \"name\": \"jamtur01/docker-jenkins-sample\",\n        \"is_automated\"\
    : true,\n        \"description\": \"\"\n    },\n    {\n        \"star_count\"\
    : 5,\n        \"is_official\": false,\n        \"name\": \"jamtur01/docker-presentation\"\
    ,\n        \"is_automated\": true,\n        \"description\": \"\"\n    },\n. .\
    \ .\n]\n```\n\nHere we’ve searched for all images containing the term `jamtur01`\
    \ and displayed a subset of the output returned. This is just a sampling of the\
    \ actions we can take with the Docker API. We can also build, update, and remove\
    \ images.\n\n### 8.3.2 Managing containers with the API\n\nThe Docker Engine API\
    \ also exposes all of the container operations available to us on the command\
    \ line. We can list running containers using the `/containers` endpoint much as\
    \ we would with the `docker ps` command.\n\n```\n$ curl -s \"http://docker.example.com:2375/containers/json\"\
    \ | python3 -mjson.tool\n[\n    {\n        \"Id\": \"d580b605fa1bcd210af0d2fe28e50a018f9ea546b56e8b28806d8dc16596340e\"\
    ,\n        \"Names\": [\n            \"/heyworld_global.0.bbctscdrhkro371mkieb0roid\"\
    \n        ],\n        \"Image\": \"ubuntu:latest\",\n        \"ImageID\": \"sha256:42118e3df429f09ca581a9deb3df274601930e428e452f7e4e9f1833c56a100a\"\
    ,\n        \"Command\": \"/bin/sh -c 'while true; do echo hey world; sleep 1;\
    \ done'\",\n        \"Created\": 1470676972,\n        \"Ports\": [],\n       \
    \ \"Labels\": {\n            \"com.docker.swarm.node.id\": \"c6viix7oja1twnyuc8ez7txhd\"\
    ,\n            \"com.docker.swarm.service.id\": \"5k3tw55i050qqh16ob9651pqx\"\
    ,\n            \"com.docker.swarm.service.name\": \"heyworld_global\",\n     \
    \       \"com.docker.swarm.task\": \"\",\n            \"com.docker.swarm.task.id\"\
    : \"bbctscdrhkro371mkieb0roid\",\n            \"com.docker.swarm.task.name\":\
    \ \"heyworld_global.0\"\n        },\n        \"State\": \"running\",\n       \
    \ \"Status\": \"Up 11 hours\",\n        \"HostConfig\": {\n            \"NetworkMode\"\
    : \"default\"\n        },\n. . .\n    }\n]\n```\n\nOur query will show all running\
    \ containers on the Docker host, in our case, a single container. To see running\
    \ and stopped containers, we can add the `all` flag to the endpoint and set it\
    \ to `1`.\n\n```\nhttp://docker.example.com:2375/containers/json?all=1\n```\n\n\
    We can also use the API to create containers by using a `POST` request to the\
    \ `/containers/create` endpoint. Here is the simplest possible container creation\
    \ API call.\n\n```\n$ curl -X POST -H \"Content-Type: application/json\" \\\n\
    http://docker.example.com:2375/containers/create \\\n-d '{\n     \"Image\":\"\
    jamtur01/jekyll\"\n}'\n{\"Id\":\"591ba02d8d149e5ae5ec2ea30ffe85ed47558b9a40b7405e3b71553d9e59bed3\"\
    ,\"Warnings\":null}\n```\n\nWe call the `/containers/create` endpoint and `POST`\
    \ a JSON hash containing an image name to the endpoint. The API returns the ID\
    \ of the container we’ve just created and potentially any warnings. This will\
    \ create a container.\n\nWe can further configure our container creation by adding\
    \ key/value pairs to our JSON hash.\n\n```\n$ curl -X POST -H \"Content-Type:\
    \ application/json\" \\\n\"http://docker.example.com:2375/containers/create?name=jekyll\"\
    \ \\\n-d '{\n     \"Image\":\"jamtur01/jekyll\",\n     \"Hostname\":\"jekyll\"\
    \n}'\n{\"Id\":\"591ba02d8d149e5ae5ec2ea30ffe85ed47558b9a40b7405e3b71553d9e59bed3\"\
    ,\"Warnings\":null}\n```\n\nHere we’ve specified the `Hostname` key with a value\
    \ of `jekyll` to set the hostname of the resulting container.\n\nTo start the\
    \ container we use the `/containers/start` endpoint.\n\n```\n$ curl -X POST -H\
    \ \"Content-Type: application/json\" \\\nhttp://docker.example.com:2375/containers/591ba02d8d149e5ae5ec2ea30ffe85ed47558b9a40b7405e3b71553d9e59bed3/start\
    \ \\\n-d '{\n         \"PublishAllPorts\":true\n}'\n```\n\nIn combination, this\
    \ provides the equivalent of running:\n\n```\n$ sudo docker run jamtur01/jekyll\n\
    ```\n\nWe can also inspect the resulting container via the `/containers/` endpoint.\n\
    \n```\n$ curl http://docker.example.com:2375/containers/591ba02d8d149e5ae5ec2ea30ffe85ed47558b9a40b7405e3b71553d9e59bed3/json\
    \ | python3 -mjson.tool\n{\n    \"Args\": [\n        \"build\",\n        \"--destination=/var/www/html\"\
    \n    ],\n. . .\n        \"Hostname\": \"591ba02d8d14\",\n        \"Image\": \"\
    jamtur01/jekyll\",\n. . .\n    \"Id\": \"591ba02d8d149e5ae5ec2ea30ffe85ed47558b9a40b7405e3b71553d9e59bed3\"\
    ,\n    \"Image\": \"29d4355e575cff59d7b7ad837055f231970296846ab58a037dd84be520d1cc31\"\
    ,\n. . .\n    \"Name\": \"/hopeful_davinci\",\n. . .\n}\n```\n\nHere we see we’ve\
    \ queried our container using the container ID and shown a sampling of the data\
    \ available to us.\n\n## 8.4 Improving the TProv application\n\nNow let’s look\
    \ at one of the methods inside the TProv application that we used in Chapter 6\\\
    . We’re going to look specifically at the methods which create and delete Docker\
    \ containers.\n\n```\ndef create\\_instance(name)\n  cid = `docker run -P --volumes-from\
    \ #{name} -d -t jamtur01/tomcat7 2>&1`.chop\n  [\\$?.exitstatus == 0, cid]\nend\n\
    ```\n\nNote You can see the previous TProv code on [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/6/tprov).\n\
    \nPretty crude, eh? We’re directly calling out to the `docker` binary and capturing\
    \ its output. There are lots of reasons that that will be problematic, not least\
    \ of which is that you can only run the TProv application somewhere with the Docker\
    \ client installed.\n\nWe can improve on this interface by using the Docker API\
    \ via one of its client libraries, in this case the [Ruby Docker-API client library](https://github.com/swipely/docker-api).\n\
    \nTip You can find a full list of the available client libraries [here](https://docs.docker.com/engine/api/sdks/).\
    \ There are client libraries for Ruby, Python, Node.JS, Go, Erlang, Java, and\
    \ others.\n\nLet’s start by looking at how we establish our connection to the\
    \ Docker API.\n\n```\nrequire 'docker'\n. . .\n\nmodule TProvAPI\n  class Application\
    \ < Sinatra::Base\n\n. . .\n\n    Docker.url = ENV['DOCKER_URL'] || 'http://localhost:2375'\n\
    \    Docker.options = {\n      :ssl_verify_peer => false\n    }\n```"
