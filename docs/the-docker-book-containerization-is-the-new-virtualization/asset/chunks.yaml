    \ a simple, easy and resilient way to build distributed applications running inside\
    \ separate Docker containers and hosts.\n\n## 7.3 Docker Swarm\n\n[Docker Swarm](http://docs.docker.com/swarm/)\
    \ is native clustering for Docker. It turns a pool of Docker hosts into a single\
    \ virtual Docker host. Swarm has a simple architecture. It clusters together multiple\
    \ Docker hosts and serves the standard Docker API on top of that cluster. This\
    \ is incredibly powerful because it moves up the abstraction of Docker containers\
    \ to the cluster level without you having to learn a new API. This makes integration\
    \ with tools that already support the Docker API easy, including the standard\
    \ Docker client. To a Docker client a Swarm cluster is just another Docker host.\n\
    \nSwarm, like many other Docker tools, follows a design principle of “batteries\
    \ included but removable”. This means it ships with tooling and backend integration\
    \ for simple use cases and provides an API for integration with more complex tools\
    \ and use cases. Swarm is shipped integrated into Docker since Docker 1.12. Prior\
    \ to that it was a standalone application licensed with Apache 2 license.\n\n\
    ### 7.3.1 Understanding the Swarm\n\nA swarm is a cluster of Docker hosts onto\
    \ which you can deploy services. Since Docker 1.12 the command line tool has included\
    \ `swarm` mode. This allows the `docker` binary to create and manage swarms as\
    \ well as run local containers.\n\nA swarm is made up of manager and worker nodes.\
    \ Manager do the dispatching and organizing of work on the swarm. Each unit of\
    \ work is called a task. Managers also handle all the cluster functions that keep\
    \ the swarm healthy and active. You can have many manager nodes, if there is more\
    \ than one then the manager node will conduct an election for leader.\n\nWorker\
    \ nodes run the tasks from manager nodes. Out of the box, every node, managers\
    \ and workers, will instead configure the swarm node to only perform activities\
    \ and not run tasks.\n\nAs a task is a pretty atomic unit swarms use a bigger\
    \ abstraction, called a service. Services defined consists of commands to execute\
    \ on one or more nodes. You can run services in a number of modes:\n\n- Replicated\
    \ services - manager distributes tasks amongst workers according to scale.\n-\
    \ Global services - dispatches one task for every available worker.\n\nThe swarm\
    \ also manages load balancing and DNS like local Docker host. Each swarm can expose\
    \ ports automatically or manually. The swarm handles internal DNS allowing services\
    \ to be discoverable.\n\n### 7.3.2 Installing Swarm\n\nThe easiest way to install\
    \ Swarm is to use Docker itself. As a result, Swarm doesn’t have anymore prerequisites\
    \ than what we saw in Chapter 2. Prior to Docker 1.12, when Swarm was integrated\
    \ into Docker, you can use Swarm via a Docker image provided by the Docker team\
    \ called `swarm`. Instructions for installation and usage are available on the\
    \ [Docker Swarm site](https://docs.docker.com/swarm/). We’re going to reuse our\
    \ `larry`, `curly` and `moe` hosts to demonstrate Swarm. The latest Docker release\
    \ is already installed on these hosts.\n\n### 7.3.3 Setting up a Swarm\n\nNow\
    \ let’s create Swarm cluster. Each node in our cluster runs an agent. Each agent\
    \ registers its related Docker daemon with the cluster. Also available is the\
    \ Swarm manager that we’ll use to manage our cluster. We’re going to create two\
    \ workers and a manager on our three hosts. Swarm addresses and roles\n\n| Host\
    \ | IP Address | Role |\n| :--- | :--- | :--- |\n| larry | 162.243.167.159 | Manager\
    \ |\n| curly | 162.243.170.66 | Worker |\n| moe | 159.203.191.16 | Worker |\n\n\
    We also need to make sure some ports are open between all our nodes. We need to\
    \ consider the following access Docker Swarm default ports.\n\n| Port | Purpose\
    \ |\n| :--- | :--- |\n| 2377 | Cluster Management |\n| 7946 + udp | Node communication\
    \ |\n| 4789 + udp | Overlay network |\n\nWe’re going to start with registering\
    \ a Swarm on our `larry` node and use this host as our Swarm manager. We’re again\
    \ going to need `larry`’s public IP address. Let’s make sure it’s still assigned\
    \ to an environment variable.\n\n```\nlarry$ PUBLIC_IP=\"$(ifconfig eth0 | awk\
    \ -F ' *|:' '/inet addr/{print $4}')\nlarry$ echo $PUBLIC_IP\n162.243.167.159\n\
    ```\n\nNow let’s initialize a swarm on `larry` using this address.\n\n```\n$ sudo\
    \ docker swarm init --advertise-addr $PUBLIC_IP\nSwarm initialized: current node\
    \ (bu84wfix0h0x31aut8qlpbi9x) is now a manager\n\nTo add a worker to this swarm,\
