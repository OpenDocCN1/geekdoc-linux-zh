    ### 4.6.1 Automated Builds


    In addition to being able to build and push our images from the command line,
    the Docker Hub also allows us to define Automated Builds. We can do so by connecting
    a [GitHub](https://www.github.com) or [BitBucket](https://bitbucket.com) repository
    containing a `Dockerfile` to the [Docker Hub](https://hub.docker.com). When we
    push to this repository, an image build will be triggered and a new image created.
    This was previously also known as a Trusted Build.


    Note Automated Builds also work for private GitHub and BitBucket repositories.


    The first step in adding an Automated Build to the Docker Hub is to connect your
    GitHub account or BitBucket to your Docker Hub account. To do this, navigate to
    Docker Hub, sign in, click on your profile link, then click the `Create -> Create
    Automated Build` button.


    ![The Add Repository button.](images/00008.jpeg)


    The Add Repository button.


    You will see a page that shows your options for linking to either GitHub or BitBucket.
    Click the `Select` button under the GitHub logo to initiate the account linkage.
    You will be taken to GitHub and asked to authorize access for Docker Hub.


    On Github you have two options: `Public and Private (recommended)` and `Limited`.
    Select `Public and Private (recommended)`, and click `Allow Access` to complete
    the authorization. You may be prompted to input your GitHub password to confirm
    the access.


    From here, you will be prompted to select the organization and repository from
    which you want to construct an Automated Build.


    ![Selecting your repository.](images/00009.jpeg)


    Selecting your repository.


    Select the repository from which you wish to create an Automated Build and then
    configure the build.


    ![Configuring your Automated Build.](images/00010.jpeg)


    Configuring your Automated Build.


    Specify the default branch you wish to use, and confirm the repository name.


    Specify a tag you wish to apply to any resulting build, then specify the location
    of the `Dockerfile`. The default is assumed to be the root of the repository,
    but you can override this with any path.


    Finally, click the `Create` button to add your Automated Build to the Docker Hub.


    You will now see your Automated Build submitted. Click on the `Build Details`
    link to see the status of the last build, including log output showing the build
    process and any errors. A build status of `Done` indicates the Automated Build
    is up to date. An `Error` status indicates a problem; you can click through to
    see the log output.


    Note You can’t push to an Automated Build using the `docker push` command. You
    can only update it by pushing updates to your GitHub or BitBucket repository.


