    \ over the years and each change has been marked by incrementing the version.\n\
    \nFor our `web` service we’ve specified some runtime options. Firstly, we’ve specified\
    \ the `image` we’re using: the `jamtur01/composeapp` image. Compose can also build\
    \ Docker images. You can use the `build` instruction and provide the path to a\
    \ `Dockerfile` to have Compose build an image and then create services from it.\n\
    \n```\nweb:\n  build: /home/james/composeapp\n. . .\n```\n\nThis `build` instruction\
    \ would build a Docker image from a `Dockerfile` found in the `/home/james/composeapp`\
    \ directory.\n\nWe’ve also specified the `command` to run when launching the service.\
    \ Next we specify the `ports` and `volumes` as a list of the port mappings and\
    \ volumes we want for our service. We’ve specified that we’re mapping port 5000\
    \ inside our service to port 5000 on the host. We’re also creating `/composeapp`\
    \ as a volume.\n\nIf we were executing the same configuration on the command line\
    \ using `docker run` we’d do it like so:\n\n```\n$ sudo docker run -d -p 5000:5000\
    \ -v .:/composeapp \\\n--name jamtur01/composeapp python app.py\n```\n\nNext we’ve\
    \ specified another service called `redis`. For this service we’re not setting\
    \ any runtime defaults at all. We’re just going to use the base `redis` image.\
    \ By default, containers run from this image launches a Redis database on the\
    \ standard port. So we don’t need to configure or customize it.\n\nTip You can\
    \ see a full list of the available instructions you can use in the `docker-compose.yml`\
    \ file [in the Docker Compose documentation](https://docs.docker.com/compose/compose-file/).\n\
    \n### 7.1.4 Running Compose\n\nOnce we’ve specified our services in `docker-compose.yml`\
    \ we use the `docker-compose up` command to execute them both.\n\n```\n$ cd composeapp\n\
    $ sudo docker-compose up\nCreating network \"composeapp_default\" with the default\
    \ driver\nRecreating composeapp_web_1 ...\nRecreating composeapp_web_1\nRecreating\
    \ composeapp_redis_1 ...\nRecreating composeapp_web_1 ... done\nAttaching to composeapp_redis_1,\
    \ composeapp_web_1\nweb_1    |  * Running on http://0.0.0.0:5000/ (Press CTRL+C\
    \ to quit)\n. . .\n```\n\nTip You must be inside the directory with the `docker-compose.yml`\
    \ file in order to execute most Compose commands.\n\nCompose has created two new\
    \ services: `composeapp_redis_1` and `composeapp_web_1`. So where did these names\
    \ come from? Well, to ensure our services are unique, Compose has prefixed and\
    \ suffixed the names specified in the `docker-compose.yml` file with the directory\
    \ and a number respectively."
