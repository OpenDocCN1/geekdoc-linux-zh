- fmt: '

    First, we told Docker to run a command using `docker run`. We passed it two command
    line flags: `-i` and `-t`. The `-i` flag keeps `STDIN` open from the container,
    even if we’re not attached to it. This persistent standard input is one half of
    what we need for an interactive shell. The `-t` flag is the other half and tells
    Docker to assign a pseudo-tty to the container we’re about to create. This provides
    us with an interactive shell in the new container. This line is the base configuration
    needed to create a container with which we plan to interact on the command line
    rather than run as a daemonized service.


    Tip You can find a full list of the available Docker run flags [here](https://docs.docker.com/engine/reference/run/)
    or by typing `docker help run`. You can also use the Docker `man` pages (e.g.,
    example `man docker-run`.)


    Next, we told Docker which image to use to create a container, in this case the
    `ubuntu` image. The `ubuntu` image is a stock image, also known as a “base” image,
    provided by Docker, Inc., on the [Docker Hub](http://hub.docker.com) registry.
    You can use base images like the `ubuntu` base image (and the similar `fedora`,
    `debian`, `centos`, etc., images) as the basis for building your own images on
    the operating system of your choice. For now, we’re just running the base image
    as the basis for our container and not adding anything to it.


    Tip We’ll hear a lot more about images in Chapter 4, including how to build our
    own images. Throughout the book we use the `ubuntu` image. This is a reasonably
    heavyweight image, measuring a couple of hundred megabytes in size. If you’d prefer
    something smaller the [Alpine Linux](https://hub.docker.com/_/alpine/) image is
    recommended as extremely lightweight, generally 5Mb in size for the base image.
    Its image name is `alpine`.


    So what was happening in the background here? Firstly, Docker checked locally
    for the `ubuntu` image. If it can’t find the image on our local Docker host, it
    will reach out to the [Docker Hub](http://hub.docker.com) registry run by Docker,
    Inc., and look for it there. Once Docker had found the image, it downloaded the
    image and stored it on the local host.


    Docker then used this image to create a new container inside a filesystem. The
    container has a network, IP address, and a bridge interface to talk to the local
    host. Finally, we told Docker which command to run in our new container, in this
    case launching a Bash shell with the `/bin/bash` command.


    When the container had been created, Docker ran the `/bin/bash` command inside
    it; the container’s shell was presented to us like so:


    ```

    root@f7cbdac22a02:/#

    ```


    ## 3.3 Working with our first container


    We are now logged into a new container, with the catchy ID of `f7cbdac22a02`,
    as the `root` user. This is a fully fledged Ubuntu host, and we can do anything
    we like in it. Let’s explore it a bit, starting with asking for its hostname.


    ```

    root@f7cbdac22a02:/# hostname

    f7cbdac22a02

    ```


    We see that our container’s hostname is the container ID. Let’s have a look at
    the `/etc/hosts` file too.


    ```

    root@f7cbdac22a02:/# cat /etc/hosts

    172.17.0.4  f7cbdac22a02

    127.0.0.1   localhost

    ::1 localhost ip6-localhost ip6-loopback

    fe00::0 ip6-localnet

    ff00::0 ip6-mcastprefix

    ff02::1 ip6-allnodes

    ff02::2 ip6-allrouters

    ```


    Docker has also added a host entry for our container with its IP address.


    Let’s also check out its networking configuration.


    ```

    root@f7cbdac22a02:/# hostname -I

    172.17.0.4

    ```


    We see that we have an IP address of `172.17.0.4`, just like any other host. We
    can also check its running processes.


    ```

    root@f7cbdac22a02:/#  ps -aux

    USER       PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND

    root         1  0.0  0.0  18156  1936 ?        Ss   May30   0:00 /bin/bash

    root        21  0.0  0.0  15568  1100 ?        R+   02:38   0:00 ps -aux

    ```


    Now, how about we install a package?


    ```

    root@f7cbdac22a02:/# apt-get update; apt-get install vim

    ```


    We’ll now have Vim installed in our container.


    You can keep playing with the container for as long as you like. When you’re done,
    type `exit`, and you’ll return to the command prompt of your Ubuntu host.


    So what’s happened to our container? Well, it has now stopped running. The container
    only runs for as long as the command we specified, `/bin/bash`, is running. Once
    we exited the container, that command ended, and the container was stopped.


    ## 3.4 Container naming


    Docker will automatically generate a name for each container we create. If we
    want to specify a particular name in place of the randomly generated name, we
    can do so using the `--name` flag.


    ```

    $ sudo docker run -i -t --name bob_the_container ubuntu /bin/bash

    root@f7cbdac22:/#

    ```


    A valid container name can contain the following characters: a to z, A to Z, the
    digits 0 to 9, the underscore, period, and dash (or, expressed as a regular expression:
    `[a-zA-Z0-9.-]`).


    We can use the container name in place of the container ID in most Docker commands,
    as we’ll see. Container names are useful to help identify and build logical connections
    between containers and applications. It’s also much easier to remember a specific
    container name (e.g., `web` or `db`) than a container ID or even a random name.
    I recommend using container names to make managing your containers easier.


    Note We’ll see more about how to connect Docker containers in Chapter 5.


    Names are unique. If we try to create two containers with the same name, the command
    will fail. We need to delete the previous container with the same name before
    we can create a new one. We can do so with the `docker rm` command.


    ## 3.5 Starting a stopped container


    So what to do with our now-stopped `bob_the_container` container? Well, if we
    want, we can restart a stopped container like so:


    ```

    $ sudo docker start bob_the_container

    ```


    We could also refer to the container by its container ID instead.


    ```

    $ sudo docker start aa3f365f0f4

    ```


    Tip We can also use the `docker restart` command.


    Now if we run the `docker ps` command without the `-a` flag, we’ll see our running
    container.


    Note In a similar vein there is also the `docker create` command which [creates](https://docs.docker.com/engine/reference/commandline/create/)
    a container but does not run it. This allows you more granular control over your
    container workflow.


    ## 3.6 Attaching to a container


    Our container will restart with the same options we’d specified when we launched
    it with the `docker run` command. So there is an interactive session waiting on
    our running container. We can reattach to that session using the `docker attach`
    command.

