    \ that the latest packages are available to install.\n\nWith my template, when\
    \ I want to refresh the build, I change the date in my `ENV` instruction. Docker\
    \ then resets the cache when it hits that `ENV` instruction and runs every subsequent\
    \ instruction anew without relying on the cache. This means my `RUN apt-get update`\
    \ instruction is rerun and my package cache is refreshed with the latest content.\
    \ You can extend this template example for your target platform or to fit a variety\
    \ of needs. For example, for a `fedora` image we might:\n\n```\nFROM fedora:21\n\
    LABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-07-01\nRUN yum -q\
    \ makecache\n```\n\nWhich performs a similar caching function for Fedora using\
    \ Yum.\n\n### 4.5.8 Viewing our new image\n\nNow let’s take a look at our new\
    \ image. We can do this using the `docker images` command.\n\n```\n$ sudo docker\
    \ images jamtur01/static_web\nREPOSITORY          TAG     ID            CREATED\
    \        SIZE\njamtur01/static_web latest  22d47c8cb6e5  24 seconds ago 12.29\
    \ kB (virtual 326 MB)\n```\n\nIf we want to drill down into how our image was\
    \ created, we can use the `docker history` command.\n\n```\n$ sudo docker history\
    \ 22d47c8cb6e5\nIMAGE         CREATED        CREATED BY                      \
    \              SIZE\n22d47c8cb6e5  6 minutes ago  /bin/sh -c #(nop) EXPOSE map[80/tcp:{}]\
    \       0 B\nb584f4ac1def  6 minutes ago  /bin/sh -c echo 'Hi, I am in your container'\
    \  27 B\n93fb180f3bc9  6 minutes ago  /bin/sh -c apt-get install -y nginx    \
    \       18.46 MB\n9d938b9e0090  6 minutes ago  /bin/sh -c apt-get update     \
    \                20.02 MB\n4c66c9dcee35  6 minutes ago  /bin/sh -c #(nop) MAINTAINER\
    \ James Turnbull \" 0 B\n. . .\n```\n\nWe see each of the image layers inside\
    \ our new `jamtur01/static_web` image and the `Dockerfile` instruction that created\
    \ them.\n\n### 4.5.9 Launching a container from our new image\n\nLet’s launch\
    \ a new container using our new image and see if what we’ve built has worked.\n\
    \n```\n$ sudo docker run -d -p 80 --name static_web jamtur01/static_web nginx\
    \ -g \"daemon off;\"\n6751b94bb5c001a650c918e9a7f9683985c3eb2b026c2f1776e61190669494a8\n\
    ```\n\nHere I’ve launched a new container called `static_web` using the `docker\
    \ run` command and the name of the image we’ve just created. We’ve specified the\
    \ `-d` option, which tells Docker to run detached in the background. This allows\
    \ us to run long-running processes like the Nginx daemon. We’ve also specified\
    \ a command for the container to run: `nginx -g \"daemon off;\"`. This will launch\
    \ Nginx in the foreground to run our web server.\n\nWe’ve also specified a new\
    \ flag, `-p`. The `-p` flag manages which network ports Docker publishes at runtime.\
    \ When you run a container, Docker has two methods of assigning ports on the Docker\
    \ host:\n\n*   Docker can randomly assign a high port from the range `32768` to\
    \ `61000` on the Docker host that maps to port 80 on the container.\n\n*   You\
    \ can specify a specific port on the Docker host that maps to port 80 on the container.\n\
    \nThe `docker run` command will open a random port on the Docker host that will\
    \ connect to port 80 on the Docker container.\n\nLet’s look at what port has been\
    \ assigned using the `docker ps` command. The `-l` flag tells Docker to show us\
    \ the last container launched.\n\n```\n$ sudo docker ps -l\nCONTAINER ID  IMAGE\
    \                      ... PORTS                  NAMES\n6751b94bb5c0  jamtur01/static_web:latest\
    \ ... 0.0.0.0:49154->80/tcp  static_web\n```\n\nWe see that port 49154 is mapped\
    \ to the container port of 80\\. We can get the same information with the `docker\
    \ port` command.\n\n```\n$ sudo docker port 6751b94bb5c0 80\n0.0.0.0:49154\n```\n\
    \nWe’ve specified the container ID and the container port for which we’d like\
    \ to see the mapping, `80`, and it has returned the mapped port, `49154`.\n\n\
    Or we could use the container name too.\n\n```\n$ sudo docker port static_web\
    \ 80\n0.0.0.0:49154\n```\n\nThe `-p` option also allows us to be flexible about\
    \ how a port is published to the host. For example, we can specify that Docker\
    \ bind the port to a specific port:\n\n```\n$ sudo docker run -d -p 80:80 --name\
    \ static_web_80 jamtur01/static_web nginx -g \"daemon off;\"\n```\n\nThis will\
    \ bind port 80 on the container to port 80 on the local host. It’s important to\
    \ be wary of this direct binding: if you’re running multiple containers, only\
    \ one container can bind a specific port on the local host. This can limit Docker’s\
    \ flexibility."
