  trans: "\n\n```\n$ sudo docker search puppet\nNAME                   DESCRIPTION\
    \         STARS     OFFICIAL   AUTOMATED\nmacadmins/puppetmaster Simple puppetmaster\
    \ 21                   [OK]\ndevopsil/puppet         Dockerfile for a   18   \
    \                [OK]\n. . .\n```\n\n提示：你也可以在 [Docker Hub](https://hub.docker.com)\
    \ 在线浏览可用的镜像。\n\n在这里，我们在 Docker Hub 上搜索了术语 `puppet`。它会搜索镜像并返回：\n\n- 仓库名称\n- 镜像描述\n\
    - Stars（星标数）——这些用于衡量镜像的流行程度\n- Official（官方）——由上游开发者管理的镜像（例如，由 Fedora 团队管理的 `fedora`\
    \ 镜像）\n- Automated（自动化）——由 Docker Hub 的自动化构建过程构建的镜像\n\n注意 我们将在本章稍后的部分介绍更多关于自动化构建的内容。\n\
    \n让我们来拉取一个镜像。\n\n```bash\n$ sudo docker pull jamtur01/puppetmaster\n```\n\n这将拉取\
    \ `jamtur01/puppetmaster` 镜像（顺便提一下，该镜像包含一个预装的 Puppet master 服务器）。\n\n然后我们可以使用此镜像来构建一个新的容器。让我们再次使用\
    \ `docker run` 命令现在执行操作。\n\n```bash\n$ sudo docker run -i -t jamtur01/puppetmaster\
    \ /bin/bash\nroot@4655dee672d3:/# facter\narchitecture => amd64\naugeasversion\
    \ => 1.2.0\n. . .\nroot@4655dee672d3:/# puppet --version\n3.4.3\n```\n\n你可以看到我们已经从\
    \ `jamtur01/puppetmaster` 镜像启动了一个新容器。我们以交互模式启动了容器，并告诉容器运行 Bash shell。在进入容器 shell\
    \ 之后，我们运行了 Facter（Puppet 的清单应用程序），它是预装在我们的镜像中的。从容器内部，我们还运行了 `puppet` 二进制文件以确认它已安装。\n\
    \n## 4.5 构建我们自己的镜像\n\n所以我们已经看到可以拉取带有自定义内容的预制镜像。我们该如何修改自己的镜像并更新它们呢？创建 Docker 镜像有两种方法：\n\
    \n- 通过 `docker commit` 命令\n- 通过带有 `Dockerfile` 的 `docker build` 命令\n\n目前不推荐使用\
    \ `docker commit` 方法，因为使用 `Dockerfile` 构建要灵活且强大得多，但为了完整性起见，我们会向你演示这种方法。之后，我们将关注推荐的镜像构建方法：编写\
    \ `Dockerfile` 并使用 `docker build` 命令。\n\n注意 我们通常不会“创建”新镜像；而是从现有的基础镜像中构建新镜像，例如我们已经见过的\
    \ `ubuntu` 或 `fedora` 镜像。如果你想构建一个全新的镜像，可以从[这里](https://docs.docker.com/userguide/)查看一些信息。\n\
    \n### 4.5.1 创建 Docker Hub 账户\n\n镜像构建很大一部分是共享和分发你的镜像。我们通过将它们推送到 [Docker Hub](https://hub.docker.com)\
    \ 或你自己的仓库来实现。为了方便这一操作，让我们先在 Docker Hub 上创建一个账户。你可以从[这里](https://hub.docker.com)加入\
    \ Docker Hub。\n\n![创建 Docker Hub 账户。](img/00006.jpeg)\n\n创建 Docker Hub 账户。创建一个账户并验证你在注册后将收到的电子邮件地址。现在让我们从\
    \ Docker 测试我们的新账户。要登录 Docker Hub，你可以使用 `docker login` 命令。\n\n```bash\n$ sudo docker\
    \ login\n使用你的 ID 登录从 Docker Hub 拉取镜像。如果你没有 Docker ID，请前往 hub.docker.com。\nUsername:\
    \ jamtur01\nPassword: Succeeded\n```\n\n此命令将你登录 Docker Hub 并存储你的凭据供以后使用。你可以使用\
    \ `docker logout` 命令从仓库服务器注销。\n\n注意 你的凭据将存储在 `$HOME/.dockercfg` 文件中。从 Docker 1.7.0\
    \ 开始，这现在是 `$HOME/.docker/config.json`。\n\n### 4.5.2 使用 docker commit 创建镜像\n\n\
    创建镜像的第一种方法使用 `docker commit` 命令。你可以认为这种方法非常类似于在版本控制系统中进行 commit（提交）。我们创建一个容器，随着代码的更改对该容器进行修改，然后将这些更改提交到一个新镜像。\n\
    \n让我们从过去使用过的 `ubuntu` 镜像开始创建一个容器。\n\n```bash\n$ sudo docker run -i -t ubuntu /bin/bash\n\
    root@4aab3cecb76:/#\n```\n\n接下来，我们将在容器中安装 Apache。\n\n```bash\nroot@4aab3cecb76:/#\
    \ apt-get -y update\n. . .\nroot@4aab3cecb76:/# apt-get -y install apache2\n.\
    \ . .\n```\n\n我们已经启动了容器并在其中安装了 Apache。我们将使用此容器作为 Web 服务器，因此我们希望按其当前状态保存它。这样可以避免我们在每次创建新容器时都要用\
    \ Apache 重新构建它。为了实现这一点，我们使用 `exit` 命令退出容器，并使用 `docker commit` 命令。\n\n```bash\n\
    $ sudo docker commit 4aab3cecb76 jamtur01/apache2\n8ce0ea7a1528\n```\n\n你可以看到我们使用了\
    \ `docker commit` 命令（`4aab3cecb76` 是容器的 ID，`jamtur01/apache2` 是目标镜像名称）。\n\n你可以看到我们使用了\
    \ `docker commit` 命令并指定了容器的 ID，它提交了镜像的基础和容器当前状态之间的差异。让我们看看我们的镜像。\n\n```bash\n\
    $ sudo docker images jamtur01/apache2\n. . .\n8ce0ea7a1528  latest  13 seconds\
    \ ago  90.63 MB\n```\n\n我们还可以在提交镜像时提供更多数据，例如：\n\n```bash\n$ sudo docker commit\
    \ -m \"A custom image\" -a \"James Turnbull\" \\\n4aab3cecb76 jamtur01/apache2\n\
    ```\n\n在这里，我们在提交新镜像时指定了一些更多信息。我们添加了 `-m` 选项允许我们为镜像提供提交消息。我们还指定了 `-a` 选项来列出镜像的作者。最后，我们指定了镜像\
    \ ID。\n\n我们可以使用 `docker inspect` 命令查看关于该镜像的信息。\n\n```bash\n$ docker inspect jamtur01/apache2\n\
    [{\n    \"Architecture\": \"amd64\",\n    \"Author\": \"James Turnbull\",\n  \
    \  \"Comment\": \"A custom image\",\n    . . .\n}]\n```\n\n提示 你可以在[这里](https://docs.docker.com/engine/reference/command/commit/)找到\
    \ `docker commit` 参数的完整列表。\n\n如果我们想从我们的新镜像运行容器，可以使用 `docker run` 命令来实现。\n\n```bash\n\
    $ sudo docker run -t -i jamtur01/apache2:webserver /bin/bash\nroot@9c2d3a84b9e:/#\
    \ service apache2 status\n * apache2 is not running\n```\n\n你会注意到我们完整地指定了镜像：`jamtur01/apache2:webserver`。\n\
    \n### 4.5.3 使用 Dockerfile 构建镜像\n\n我们不推荐 `docker commit` 方法。相反，我们建议使用名为 `Dockerfile`\
    \ 的定义文件和 `docker build` 命令来构建镜像。`Dockerfile` 使用用于构建 Docker 镜像的基础指令 DSL（领域特定语言）。相比\
    \ `docker commit`，我们推荐 `Dockerfile` 方法，因为它为创建镜像提供了更具重复性、透明性和等性的机制。\n\n一旦有了 `Dockerfile`，我们就可以使用\
    \ `docker build` 命令根据 `Dockerfile` 中的指令构建新镜像。\n\n#### 4.5.3.1 我们的第一个 Dockerfile\n\
    \n现在让我们创建一个目录和一个初始 `Dockerfile`。我们将构建一个包含简单 Web 服务器的 Docker 镜像。\n\n```bash\n$\
    \ mkdir static_web\n$ cd static_web\n$ touch Dockerfile\n```\n\n"
- fmt: "\nWe’ve created a directory called `static_web` to hold our `Dockerfile`.\
    \ This directory is our build environment, which is what Docker calls a context\
    \ or build context. Docker will upload the build context, as well as any files\
    \ and directories contained in it, to our Docker daemon when the build is run.\
    \ This provides the Docker daemon with direct access to any code, files or other\
    \ data you might want to include in the image.\n\nWe’ve also created an empty\
    \ `Dockerfile` file to get started. Now let’s look at an example of a `Dockerfile`\
    \ to create a Docker image that will act as a Web server.\n\n```\n# Version: 0.0.1\n\
    FROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\nRUN apt-get update;\
    \ apt-get install -y nginx\nRUN echo 'Hi, I am in your container' \\\n    >/var/www/html/index.html\n\
    EXPOSE 80\n```\n\nThe `Dockerfile` contains a series of instructions paired with\
    \ arguments. Each instruction, for example `FROM`, should be in upper-case and\
    \ be followed by an argument: `FROM ubuntu:16.04`. Instructions in the `Dockerfile`\
    \ are processed from the top down, so you should order them accordingly.\n\nEach\
    \ instruction adds a new layer to the image and then commits the image. Docker\
    \ executing instructions roughly follow a workflow:\n\n* Docker runs a container\
    \ from the image.\n* An instruction executes and makes a change to the container.\n\
    * Docker runs the equivalent of `docker commit` to commit a new layer.\n* Docker\
    \ then runs a new container from this new image.\n* The next instruction in the\
    \ file is executed, and the process repeats until all instructions have been executed.\n\
    \nThis means that if your `Dockerfile` stops for some reason (for example, if\
    \ an instruction fails to complete), you will be left with an image you can use.\
    \ This is highly useful for debugging: you can run a container from this image\
    \ interactively and then debug why your instruction failed using the last image\
    \ created.\n\nNote The `Dockerfile` also supports comments. Any line that starts\
    \ with a `#` is considered a comment. You can see an example of this in the first\
    \ line of our `Dockerfile`.\n\nThe first instruction in a `Dockerfile` must be\
    \ `FROM`. The `FROM` instruction specifies an existing image that the following\
    \ instructions will operate on; this image is called the base image.\n\nIn our\
    \ sample `Dockerfile` we’ve specified the `ubuntu:16.04` image as our base image.\
    \ This specification will build an image on top of an Ubuntu 16.04 base operating\
    \ system. As with running a container, you should always be specific about exactly\
    \ from which base image you are building.\n\nNext, we’ve specified the `LABEL`\
    \ instruction with a value of `maintainer=\"“james@example.com”`, which tells\
    \ Docker who the author of the image is and what their email address is. This\
    \ is useful for specifying an owner and contact for an image.\n\nNote This `LABEL`\
    \ instructions replaces the `MAINTAINER` instruction which was deprecated in Docker\
    \ 1.13.0.\n\nWe’ve followed these instructions with two `RUN` instructions. The\
    \ `RUN` instruction executes commands on the current image. The commands in our\
    \ example: updating the installed APT repositories and installing the `nginx`\
    \ package and then creating the `/var/www/html/index.html` file containing some\
    \ example text. As we’ve discovered, each of these instructions will create a\
    \ new layer and, if successful, will commit that layer and then execute the next\
    \ instruction.\n\nBy default, the `RUN` instruction executes inside a shell using\
    \ the command wrapper `/bin/sh -c`. If you are running the instruction on a platform\
    \ without a shell or you wish to execute without a shell (for example, to avoid\
    \ shell string munging), you can specify the instruction in `exec` format:\n\n\
    ```\nRUN [ \"apt-get\", \" install\", \"-y\", \"nginx\" ]\n```\n\nWe use this\
    \ format to specify an array containing the command to be executed and then each\
    \ parameter to pass to the command.\n\nNext, we’ve specified the `EXPOSE` instruction,\
    \ which tells Docker that the application in this container will use this specific\
    \ port on the container. That doesn’t mean you can automatically access whatever\
    \ service is running on that port (here, port `80`) on the container. For security\
    \ reasons, Docker doesn’t open the port automatically, but waits for you to do\
    \ it when you run the container using the `docker run` command. We’ll see this\
    \ shortly when we create a new container from this image.\n\nYou can specify multiple\
    \ `EXPOSE` instructions to mark multiple ports to be exposed.\n\nNote Docker also\
    \ uses the `EXPOSE` instruction to help link together containers, which we’ll\
    \ see in Chapter 5. You can expose ports at run time with the `docker run` command\
    \ with the `–expose` option.\n\n### 4.5.4 Building the image from our Dockerfile\n\
    \nAll of the instructions will be executed and committed and a new image returned\
    \ when we run the `docker build` command. Let’s try that now:\n\n```\n$ cd static_web\n\
    $ sudo docker build -t=\"jamtur01/static_web\" .\nSending build context to Docker\
    \ daemon  2.56 kB\nSending build context to Docker daemon\nStep 0 : FROM ubuntu:16.04\n\
    \ ---> ba5877dc9bec\nStep 1 : LABEL maintainer=\"james@example.com\"\n ---> Running\
    \ in b8ffa06f9274\n ---> 4c66c9dcee35\nRemoving intermediate container b8ffa06f9274\n\
    Step 2 : RUN apt-get update\n ---> Running in f33105f9274\nRemoving intermediate\
    \ container f33105f9274\nStep 3 : RUN apt-get install -y nginx\n ---> Running\
    \ in 4b989d4730\n ---> 938b9e00\nRemoving intermediate container 4b989d4730\n\
    Step 4 : RUN echo 'Hi, I am in your container' \\\n    >/var/www/html/index.html\n\
    \ ---> Running in b51acc4eb9\n ---> 584ac1def\nRemoving intermediate container\
    \ b51acc4eb9\nStep 5 : EXPOSE 80\n ---> Running in 7ff42bd1f4d\n ---> 22d47c8cb6e\n\
    Successfully built 22d47c8cb65\n```\n\nWe’ve used the `docker build` command to\
    \ build our image. We’ve specified the `-t` option to mark our resulting image\
    \ with a repository and a name, here `jamtur01` repository and the name `static_web`.\
    \ I strongly recommend you always name your images to make it easier to track\
    \ and manage them.\n\nYou can also tag images during the build process by suffixing\
    \ the tag after the image name with a colon, for example: `docker build -t=\"\
    jamtur01/static_web:v1\"`.\n\nTip If you don’t specify any tag, Docker will automatically\
    \ tag your image as `latest`.\n\nThe trailing `.` tells Docker to look in the\
    \ local directory to find the `Dockerfile`. You can also specify a Git repository\
    \ as a source for the `Dockerfile` as we see here:\n\n```\n$ sudo docker build\
    \ -t=\"jamtur01/static_web:v1\" \\\ngithub.com/turnbullpress/docker-static_web\n\
    ```\n\nHere Docker assumes that there is a `Dockerfile` located in the root of\
    \ the Git repository.\n\nTip Since Docker 1.5.0 and later you can also specify\
    \ a path to a file to use as a build source using the `-f` flag. For example,\
    \ `docker build -t “jamtur01/static_web” -f /path/to/file`. The file specified\
    \ doesn’t need to be called `Dockerfile` but must still be within the build context.\n\
    \nBut back to our `docker build` process. You can see that the build context has\
    \ been uploaded to the Docker daemon.\n\n```\nSending build context to Docker\
    \ daemon  2.56 kB\nSending build context to Docker daemon\n```\n\nTip If a file\
    \ named `.dockerignore` exists in the root of the build context then it is interpreted\
    \ as a newline-separated list of exclusion patterns. Much like a `.gitignore`\
    \ file it excludes the listed files from being treated as part of the build context,\
    \ and therefore prevents them from being uploaded to the Docker daemon. Globbing\
    \ can be done using Go’s [filepath](http://golang.org/pkg/path/filepath/#Match).\n\
    \nNext, you can see that each instruction in the `Dockerfile` has been executed\
    \ with the image ID, `22d47c8cb6e`, being returned as the final output of the\
    \ build process. Each step and its associated instruction are run individually,\
    \ and Docker has committed the result of each operation before outputting that\
    \ final image ID.\n"
