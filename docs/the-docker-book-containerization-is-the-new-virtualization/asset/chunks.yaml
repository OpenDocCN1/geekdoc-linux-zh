    ### 4.5.10 Dockerfile 指令


    我们已经看到了一些可用的 `Dockerfile` 指令，例如 `RUN` 和 `EXPOSE`。但还有许多其他可以放入 `Dockerfile` 的指令。这些包括
    `CMD`、`ENTRYPOINT`、`ADD`、`COPY`、`VOLUME`、`WORKDIR`、`USER`、`ONBUILD`、`LABEL`、`STOPSIGNAL`、`ARG`、`SHELL`、`HEALTHCHECK`
    和 `ENV`。你可以在[此处]查看完整的指令列表](http://docs.docker.com/reference/builder/)。


    在接下来的几章节中，我们还将看到更多的 `Dockerfile`，并学习如何将一些酷的应用构建到 Docker 容器中。


    #### 4.5.10.1 CMD


    `CMD` 指令指定启动容器时运行的命令。它与 `RUN` 指令类似，但它不是在容器构建时运行命令，而是指定在容器启动时运行的命令，就像在使用 `docker
    run` 命令启动容器时指定运行命令一样，例如：


    ```

    $ sudo docker run -i -t jamtur01/static_web /bin/true

    ```


    这在 `Dockerfile` 中表述为：


    ```

    CMD ["/bin/true"]

    ```


    你也可以为命令指定参数，如下：


    ```

    CMD ["/bin/bash", "-l"]

    ```


    在这里，我们正在将 `-l` 标志传递给 `/bin/bash` 命令。


    警告 你会注意到命令包含在一个数组中。这告诉 Docker “按原样”运行命令。你也可以在不使用的情况下指定 `CMD` 指令，在这种情况下，Docker
    会在命令前加上 `/bin/sh -c`。这可能会在执行命令时导致意想不到的行为。因此，建议始终使用数组语法。


    最后，重要的是要理解我们可以使用 `docker run` 命令来覆盖 `CMD` 指令。如果我们在 `Dockerfile` 中指定了一个 `CMD`，并在
    `docker run` 命令行中也指定了一个，那么命令行将覆盖 `Dockerfile` 的 `CMD` 指令。


    注意 了解 `CMD` 指令与 `ENTRYPOINT` 指令之间的交互也很重要。我们将在下文中看到更多细节。


    让我们更仔细地观察这个过程。假设我们的 `Dockerfile` 包含 `CMD`：


    ```

    CMD [ "/bin/bash" ]

    ```


    我们可以使用 `docker build` 命令构建一个新镜像（称其为 `jamtur01/test`），然后从该镜像启动一个新容器。


    ```

    $ sudo docker run -t -i jamtur01/test

    root@e643e6218589:/#

    ```


    注意到不同之处了吗？我们没有在 `docker run` 的末尾指定要执行的命令。相反，Docker 使用了 `CMD`指定的命令。


