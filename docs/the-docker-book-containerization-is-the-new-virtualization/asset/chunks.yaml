    ```\n\n### 6.3.3 The Redis primary image\n\nLet’s continue with our first Redis\
    \ image: a Redis primary server.\n\n```\n$ mkdir redis_primary\n$ cd redis_primary\n\
    $ vi Dockerfile\n```\n\nNow let’s populate our `Dockerfile`.\n\n```\nFROM jamtur01/redis\n\
    LABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-06-01\n\nENTRYPOINT\
    \ [ \"redis-server\", \"--protected-mode no\", \"--logfile /var/log/redis/redis-server.log\"\
    \ ]\n```\n\nOur Redis primary image is based on our `jamtur01/redis` image and\
