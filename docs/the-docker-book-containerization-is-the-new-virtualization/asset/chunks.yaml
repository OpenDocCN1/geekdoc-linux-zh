  trans: "\n\n这将 Nginx 设置为监听 `80` 端口，并将 Web 服务器的根目录设置为 `/var/www/html/website`，这是我们刚刚通过\
    \ `RUN` 指令创建的目录。\n\n我们还需要配置 Nginx 以非守护模式运行，以便其在 Docker 容器内工作。为了实现这一点，`nginx.conf`\
    \ 文件被复制到 `/etc/nginx/` 目录，内容如下：\n\n```\nuser www-data;\nworker_processes 4;\n\
    pid /run/nginx.pid;\ndaemon off;\n\nevents {  }\n\nhttp {\n  sendfile on;\n  tcp_nopush\
    \ on;\n  tcp_nodelay on;\n  keepalive_timeout 65;\n  types_hash_max_size 2048;\n\
    \  include /etc/nginx/mime.types;\n  default_type application/octet-stream;\n\
    \  access_log /var/log/nginx/access.log;\n  error_log /var/log/nginx/error.log;\n\
    \  gzip on;\n  gzip_disable \"msie6\";\n  include /etc/nginx/conf.d/*.conf;\n\
    }\n```\n\n在此配置文件中，`daemon off;` 选项阻止 Nginx 进入后台运行，并强制其在以前台运行。这是因为 Docker 容器依赖于内部运行的进程来保持活跃。默认情况下，Nginx\
    \ 启动时会自己变为守护进程，这会导致容器在守护进程派生并启动后短暂运行，因为派生它的原始进程已停止。\n\n该文件通过 `ADD` 指令被复制到 `/etc/nginx/nginx.conf`。\n\
    \n你还会发现两个 `ADD` 指令的目标路径之间细微的区别。第一个以目录 `/etc/nginx/conf.d/` 结尾，第二个是特定的文件 `/etc/nginx/nginx.conf`。这两种样式都是将文件复制到\
    \ Docker 镜像的接受方法。注意：你可以在 [Docker Book GitHub 站点](https://github.com/turnbullpress/dockerbook-code)\
    \ 上找到所有的代码和示例配置文件。你需要专门下载或复制粘贴 `nginx.conf` 和 `global.conf` 配置文件到我们创建的 `nginx`\
    \ 目录中，以便供 `docker build` 使用。\n\n### 5.1.2 构建我们的示例网站和 Nginx 镜像\n\n通过这个 `Dockerfile`，我们可以使用\
    \ `docker build` 命令构建一个新镜像；我们将将其命名为 `jamtur01/nginx`。\n\n```\n$ sudo docker build\
    \ -t jamtur01/nginx .\n```\n\n这将构建并命名我们的新镜像，你应该看到构建步骤正在执行。我们可以使用 `docker history`\
    \ 命令来查看组成新镜像的步骤和层。\n\n```\n$ sudo docker history jamtur01/nginx\nIMAGECREATED\
    \     CREATED BY    SIZE\nf99cb0a6726d 7 secs ago  /bin/sh -c #(nop) EXPOSE 80/tcp\
    \       0 B\nd0741c80034e 7 secs ago  /bin/sh -c #(nop) ADD file:d6698a182fafaf3cb0\
    \ 415 B\nf1b8d3ab6b4f 8 secs ago  /bin/sh -c #(nop) ADD file:9778ae1b43896011cc\
    \ 286 B\n4e88da941d2b About a min /bin/sh -c mkdir -p /var/www/html/website  \
    \   0 B\n1224c6db31b7 About a min /bin/sh -c apt-get -yqq update; apt-get -yq\
    \ 39.32 MB\n2cfbed445367 About a min /bin/sh -c #(nop) ENV REFRESHED_AT=2016-06-01\
    \ 0 B\n6b5e0485e5fa About a min /bin/sh -c #(nop) LABEL maintainer= \" 0 B\n91e54dfb1179\
    \ 2 days ago  /bin/sh -c #(nop) CMD [\"/bin/bash\"]   0 B\nd74508fb6632 2 days\
    \ ago  /bin/sh -c sed -i 's/^#\\s*\\(deb.*universe\\)$/ 1.895 kB\nc22013c84729\
    \ 2 days ago  /bin/sh -c echo '#!/bin/sh' > /usr/sbin/polic 194.5 kB\nd3a1f33e8a5a\
    \ 2 days ago  /bin/sh -c #(nop) ADD file:5a3f9e9ab88e725d60 188.2 MB\n```\n\n\
    历史记录从最终层（即我们的新镜像 `jamtur01/nginx`）开始，向回溯到原始父镜像 `ubuntu:16.04`。之间的每个步骤都显示了新层以及生成该层的\
    \ `Dockerfile` 指令。\n\n### 5.1.3 从我们的示例网站和 Nginx 镜像构建容器\n\n现在我们可以使用 `jamtur01/nginx`\
    \ 镜像并从其开始构建容器，这将允许我们测试示例网站。为了做到这一点，我们需要添加示例网站的代码。让我们下载示例网站的代码。\n\n"
- fmt: "\nWe see that our Sample website has been updated. This is a simple example\
    \ of editing a website, but you can see how you could easily do so much more.\
    \ More importantly, you’re testing a site that reflects production reality. You\
    \ can now have containers for each type of production web-serving environment\
    \ (e.g., `Apache`, `Nginx`), for running varying versions of development frameworks\
    \ like `PHP` or `Ruby on Rails`, or for database back ends, etc.\n\n## 5.2 Using\
    \ Docker to build and test a web application\n\nNow let’s look at a more complex\
    \ example of testing a larger web application. We’re going to test a [Sinatra-based](http://www.sinatrarb.com/)\
    \ web application instead of a static website and then develop that application\
    \ whilst testing in Docker. Sinatra is a Ruby-based web application framework.\
    \ It contains a web application library and a simple Domain Specific Language\
    \ or DSL for creating web applications. Unlike more complex web application frameworks,\
    \ like `Ruby on Rails`, Sinatra does not follow the model–view–controller pattern\
    \ but rather allows you to create quick and simple web applications.\n\nAs such\
    \ it’s perfect for creating a small sample application to test. In our case our\
    \ new application is going to take incoming URL parameters and output them as\
    \ a JSON hash. We’re also going to take advantage of this application architecture\
    \ to show you how to link Docker containers together.\n\n### 5.2.1 Building our\
    \ Sinatra application\n\nLet’s create a directory, `sinatra`, to hold our new\
    \ application and any associated files we’ll need for the build.\n\n```\n$ mkdir\
    \ -p sinatra\n$ cd sinatra\n```\n\nInside the `sinatra` directory let’s start\
    \ with a `Dockerfile` to build the basic image that we will use to develop our\
    \ Sinatra web application.\n\n```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\
    \nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get update -yqq; apt-get -yqq install\
    \ ruby ruby-dev build-essential redis-tools\nRUN gem install --no-rdoc --no-ri\
    \ sinatra json redis\n\nRUN mkdir -p /opt/webapp\n\nEXPOSE 4567\n\nCMD [ \"/opt/webapp/bin/webapp\"\
    \ ]\n```\n\nYou can see that we’ve created another Ubuntu-based image, installed\
    \ Ruby and RubyGems, and then used the `gem` binary to install the `sinatra`,\
    \ `json`, and `redis` gems. The `sinatra` and `json` gems contain Ruby’s Sinatra\
    \ library and support for JSON. The `redis` gem we’re going to use a little later\
    \ on to provide integration to a [Redis](http://redis.io/) database.\n\nWe’ve\
    \ also created a directory to hold our new web application and exposed the default\
    \ WEBrick port of `4567`.\n\nFinally, we’ve specified a `CMD` of `/opt/webapp/bin/webapp`,\
    \ which will be the binary that launches our web application.\n\nLet’s build this\
    \ new image now using the `docker build` command.\n\n```\n$ sudo docker build\
    \ -t jamtur01/sinatra .\n```\n\n### 5.2.2 Creating our Sinatra container\n\nWe’ve\
    \ built our image. Let’s now download our Sinatra web application’s source code.\
    \ You can find the code for this Sinatra application at [The Docker Book site](https://github.com/turnbullpress/dockerbook-code).\
    \ The application is made up of the `bin` and `lib` directories from the `webapp`\
    \ directory.\n\nLet’s download it now into the `sinatra` directory.\n\n```\n$\
    \ cd sinatra\n$ wget --cut-dirs=3 -nH -r -e robots=off --reject=\"index.html\"\
    ,\"Dockerfile\" --no-parent http://dockerbook.com/code/5/sinatra/webapp/\n```\n\
    \nLet’s quickly look at the core of the `webapp` source code contained in the\
    \ `webapp/lib/app.rb` file.\n\n```\nrequire \"rubygems\"\nrequire \"sinatra\"\n\
    require \"json\"\n\nclass App < Sinatra::Application\n\n  set :bind, '0.0.0.0'\n\
    \n  get '/' do\n    \"<h1>DockerBook Test Sinatra app</h1>\"\n  end\n\n  post\
    \ '/json/?' do\n    params.to_json\n  end\n\nend\n```\n\nThis is a simple application\
    \ that converts any parameters posted to the `/json` endpoint to JSON and displays\
    \ them.\n\nWe also need to ensure that the `webapp/bin/webapp` binary is executable\
    \ prior to using it using the `chmod` command.\n\n```\n$ chmod +x webapp/bin/webapp\n\
    ```\n\nNow let’s launch a new container from our image using the `docker run`\
    \ command. To launch we should be inside the `sinatra` directory because we’re\
    \ going to mount our source code into the container using a volume.\n\n```\n$\
    \ sudo docker run -d -p 4567 --name webapp \\\n-v $PWD/webapp:/opt/webapp jamtur01/sinatra\n\
    ```\n\nHere we’ve launched a new container from our `jamtur01/sinatra` image,\
    \ called `webapp`. We’ve specified a new volume, using the `webapp` directory\
    \ that holds our new Sinatra web application, and we’ve mounted it to the directory\
    \ we created in the `Dockerfile`: `/opt/webapp`.\n\nWe’ve not provided a command\
    \ to run on the command line; instead, we’re using the command we specified via\
    \ the `CMD` instruction in the `Dockerfile` of the image.\n\n```\n. . .\nCMD [\
    \ \"/opt/webapp/bin/webapp\" ]\n. . .\n```\n\nThis command will be executed when\
    \ the container is launched.\n\n```\n. . .\nCMD [ \"/opt/webapp/bin/webapp\" ]\n\
    . . .\n```\n"
