    \ from this image interactively and then debug why your instruction failed using\
    \ the last image created.\n\nNote The `Dockerfile` also supports comments. Any\
    \ line that starts with a `#` is considered a comment. You can see an example\
    \ of this in the first line of our `Dockerfile`.\n\nThe first instruction in a\
    \ `Dockerfile` must be `FROM`. The `FROM` instruction specifies an existing image\
    \ that the following instructions will operate on; this image is called the base\
    \ image.\n\nIn our sample `Dockerfile` we’ve specified the `ubuntu:16.04` image\
    \ as our base image. This specification will build an image on top of an Ubuntu\
    \ 16.04 base operating system. As with running a container, you should always\
    \ be specific about exactly from which base image you are building.\n\nNext, we’ve\
    \ specified the `LABEL` instruction with a value of `maintainer=“james@example.com”,\
    \ which tells Docker who the author of the image is and what their email address\
    \ is. This is useful for specifying an owner and contact for an image.\n\nNote\
    \ This `LABEL` instructions replaces the `MAINTAINER` instruction which was deprecated\
    \ in Docker 1.13.0.\n\nWe’ve followed these instructions with two `RUN` instructions.\
    \ The `RUN` instruction executes commands on the current image. The commands in\
    \ our example: updating the installed APT repositories and installing the `nginx`\
    \ package and then creating the `/var/www/html/index.html` file containing some\
    \ example text. As we’ve discovered, each of these instructions will create a\
    \ new layer and, if successful, will commit that layer and then execute the next\
    \ instruction.\n\nBy default, the `RUN` instruction executes inside a shell using\
    \ the command wrapper `/bin/sh -c`. If you are running the instruction on a platform\
    \ without a shell or you wish to execute without a shell (for example, to avoid\
    \ shell string munging), you can specify the instruction in `exec` format:\n\n\
    ```\nRUN [ \"apt-get\", \" install\", \"-y\", \"nginx\" ]\n```\n\nWe use this\
    \ format to specify an array containing the command to be executed and then each\
    \ parameter to pass to the command.\n\nNext, we’ve specified the `EXPOSE` instruction,\
    \ which tells Docker that the application in this container will use this specific\
    \ port on the container. That doesn’t mean you can automatically access whatever\
    \ service is running on that port (here, port `80`) on the container. For security\
    \ reasons, Docker doesn’t open the port automatically, but waits for you to do\
    \ it when you run the container using the `docker run` command. We’ll see this\
    \ shortly when we create a new container from this image.\n\nYou can specify multiple\
    \ `EXPOSE` instructions to mark multiple ports to be exposed.\n\nNote Docker also\
    \ uses the `EXPOSE` instruction to help link together containers, which we’ll\
    \ see in Chapter 5\\. You can expose ports at run time with the `docker run` command\
    \ with the `–expose` option.\n\n### 4.5.4 Building the image from our Dockerfile\n\
    \nAll of the instructions will be executed and committed and a new image returned\
    \ when we run the `docker build` command. Let’s try that now:\n\n```\n$ cd static_web\n\
    $ sudo docker build -t=\"jamtur01/static_web\" .\nSending build context to Docker\
    \ daemon  2.56 kB\nSending build context to Docker daemon\nStep 0 : FROM ubuntu:16.04\n\
    \ ---> ba5877dc9bec\nStep 1 : LABEL maintainer=\"james@example.com\"\n ---> Running\
    \ in b8ffa06f9274\n ---> 4c66c9dcee35\nRemoving intermediate container b8ffa06f9274\n\
    Step 2 : RUN apt-get update\n ---> Running in f331636c84f7\n ---> 9d938b9e0090\n\
    Removing intermediate container f331636c84f7\nStep 3 : RUN apt-get install -y\
    \ nginx\n ---> Running in 4b989d4730dd\n ---> 93fb180f3bc9\nRemoving intermediate\
    \ container 4b989d4730dd\nStep 4 : RUN echo 'Hi, I am in your container'     \n\
    >/var/www/html/index.html\n ---> Running in b51bacc46eb9\n ---> b584f4ac1def\n\
    Removing intermediate container b51bacc46eb9\nStep 5 : EXPOSE 80\n ---> Running\
    \ in 7ff423bd1f4d\n ---> 22d47c8cb6e5\nSuccessfully built 22d47c8cb6e5\n```\n\n\
    We’ve used the `docker build` command to build our new image. We’ve specified\
    \ the `-t` option to mark our resulting image with a repository and a name, here\
    \ the `jamtur01` repository and the image name `static_web`. I strongly recommend\
    \ you always name your images to make it easier to track and manage them.\n\n\
    You can also tag images during the build process by suffixing the tag after the\
    \ image name with a colon, for example:\n\n```\n$ sudo docker build -t=\"jamtur01/static_web:v1\"\
    \ .\n```\n\nTip If you don’t specify any tag, Docker will automatically tag your\
    \ image as `latest`.\n\nThe trailing `.` tells Docker to look in the local directory\
    \ to find the `Dockerfile`. You can also specify a Git repository as a source\
    \ for the `Dockerfile` as we see here:\n\n```\n$ sudo docker build -t=\"jamtur01/static_web:v1\"\
    \ \\\ngithub.com/turnbullpress/docker-static_web\n```\n\nHere Docker assumes that\
    \ there is a `Dockerfile` located in the root of the Git repository.\n\nTip Since\
    \ Docker 1.5.0 and later you can also specify a path to a file to use as a build\
    \ source using the `-f` flag. For example, `docker build -t “jamtur01/static_web”\
    \ -f /path/to/file`. The file specified doesn’t need to be called `Dockerfile`\
    \ but must still be within the build context.\n\nBut back to our `docker build`\
    \ process. You can see that the build context has been uploaded to the Docker\
    \ daemon.\n\n```\nSending build context to Docker daemon  2.56 kB\nSending build\
    \ context to Docker daemon\n```\n\nTip If a file named `.dockerignore` exists\
    \ in the root of the build context then it is interpreted as a newline-separated\
    \ list of exclusion patterns. Much like a `.gitignore` file it excludes the listed\
    \ files from being treated as part of the build context, and therefore prevents\
    \ them from being uploaded to the Docker daemon. Globbing can be done using Go’s\
    \ [filepath](http://golang.org/pkg/path/filepath/#Match).\n\nNext, you can see\
    \ that each instruction in the `Dockerfile` has been executed with the image ID,\
    \ `22d47c8cb6e5`, being returned as the final output of the build process. Each\
    \ step and its associated instruction are run individually, and Docker has committed\
    \ the result of each operation before outputting that final image ID.\n\n### 4.5.5\
    \ What happens if an instruction fails?"
