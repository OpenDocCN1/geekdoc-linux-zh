    \ (172.18.0.2): icmp_seq=1 ttl=64 time=0.290 ms\n64 bytes from db (172.18.0.2):\
    \ icmp_seq=2 ttl=64 time=0.082 ms\n64 bytes from db (172.18.0.2): icmp_seq=3 ttl=64\
