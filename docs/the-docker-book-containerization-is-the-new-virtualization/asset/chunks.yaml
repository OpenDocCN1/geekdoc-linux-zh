    \ \"/opt/webapp/bin/webapp\" ]\n. . .\n```\n\nThis command will be executed when\
    \ a container is launched from this image.\n\nWe can also use the `docker logs`\
    \ command to see what happened when our command was executed.\n\n```\n$ sudo docker\
    \ logs webapp\n[2016-08-03 17:34:46] INFO  WEBrick 1.3.1\n[2016-08-03 17:34:46]\
    \ INFO  ruby 2.3.1 (2016-04-26) [x86_64-linux-gnu]\n== Sinatra (v1.4.7) has taken\
    \ the stage on 4567 for development with backup from WEBrick\n[2016-08-03 17:34:46]\
    \ INFO  WEBrick::HTTPServer#start: pid=1 port=4567\n```\n\nBy adding the `-f`\
    \ flag to the `docker logs` command, you can get similar behavior to the `tail\
    \ -f` command and continuously stream new output from the `STDERR` and `STDOUT`\
    \ of the container.\n\n```\n$ sudo docker logs -f webapp\n. . .\n```\n\nWe can\
    \ also see the running processes of our Sinatra Docker container using the `docker\
    \ top` command.\n\n```\n$ sudo docker top webapp\nUID  PID    PPID    C  STIME\
    \  TTY  TIME      CMD\nroot 21506  15332   0  20:26  ?    00:00:00  /usr/bin/ruby\
    \ /opt/webapp/bin/webapp\n```\n\nWe see from the logs that Sinatra has been launched\
    \ and the WEBrick server is waiting on port `4567` in the container for us to\
    \ test our application. Let’s check to which port on our local host that port\
    \ is mapped:\n\n```\n$ sudo docker port webapp 4567\n0.0.0.0:49160\n```\n\nRight\
    \ now, our basic Sinatra application doesn’t do much. It just takes incoming parameters,\
    \ turns them into JSON, and then outputs them. We can now use the `curl` command\
    \ to test our application.\n\n```\n$ curl -i -H 'Accept: application/json' \\\n\
    -d 'name=Foo&status=Bar' http://localhost:49160/json\nHTTP/1.1 200 OK\nContent-Type:\
    \ text/html;charset=utf-8\nContent-Length: 29\nX-Xss-Protection: 1; mode=block\n\
    X-Content-Type-Options: nosniff\nX-Frame-Options: SAMEORIGIN\nServer: WEBrick/1.3.1\
    \ (Ruby/2.3.1/2016-04-26)\nDate: Wed, 03 Aug 2016 18:30:06 GMT\nConnection: Keep-Alive\n\
    {\"name\":\"Foo\",\"status\":\"Bar\"}\n```\n\nWe see that we’ve passed some URL\
    \ parameters to our Sinatra application and returned to us as a JSON hash: `{\"\
    name\":\"Foo\",\"status\":\"Bar\"}`.\n\nNeat! But let’s see if we can extend our\
    \ example application container to an actual application stack by connecting to\
    \ a service running in another container.\n\n### 5.2.3 Extending our Sinatra application\
    \ to use Redis\n\nWe’re going to extend our Sinatra application now by adding\
    \ a Redis back end and storing our incoming URL parameters in a Redis database.\
    \ To do this, we’re going to download a new version of our Sinatra application.\
    \ We’ll also create an image and container that run a Redis database. We’ll then\
    \ make use of Docker’s capabilities to connect the two containers.\n\n#### 5.2.3.1\
    \ Updating our Sinatra application\n\nLet’s start with downloading an updated\
    \ Sinatra-based application with a connection to Redis configured. From inside\
    \ our `sinatra` directory let’s download a Redis-enabled version of our application\
    \ into a new directory: `webapp_redis`.\n\n```\n$ cd sinatra\n$ wget --cut-dirs=3\
    \ -nH -r -e robots=off --reject=\"index.html\",\"Dockerfile\" --no-parent http://dockerbook.com/code/5/sinatra/webapp_redis/\n\
    ```\n\nWe see we’ve downloaded the new application. Let’s look at its core code\
    \ in `lib/app.rb` now."
