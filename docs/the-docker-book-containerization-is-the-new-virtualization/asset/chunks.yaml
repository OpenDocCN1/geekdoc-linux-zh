    Compose 会连接到每个服务的日志，每行日志输出都会将以其所属服务的缩写名称作为前缀，并将它们多路复用输出：


    ```

    redis_1  | 1:M 05 Aug 17:49:17.839 * The server is now ready to accept connections
    on port 6379

    ```


    这些服务（以及 Compose）正以交互式方式运行。这意味着如果你使用 `Ctrl-C` 或类似操作取消 Compose，它将停止正在运行的服务。我们也可以使用
    `-d` 标记运行 Compose，使我们的服务以守护模式运行（类似于 `docker run -d` 标记）。


    ```

    $ sudo docker-compose up -d

    ```


    让我们看看现在运行在宿主机上的示例应用程序。该应用程序绑定到 Docker 宿主机端口 `5000` 上的所有接口。因此，我们可以通过宿主机的 IP 地址或
    `localhost` 访问该网站。


    ![示例 Compose 应用程序。](img/00035.jpeg)


    示例 Compose 应用程序。


    我们看到一条显示当前计数器值的消息。我们可以通过刷新页面来增加计数器值。每次刷新都会将增量存储在 Redis 中。Redis 更新通过 Compose 控制的
    Docker 容器之间的连接完成。


    提示 默认，Compose 会尝试连接到本地 Docker Daemon，但它也会遵循 `DOCKER_HOST` 环境变量以连接到远程 Docker 节点。


    ### 7.1.5 使用 Compose


    现在让我们探索 Compose 的其他选项。首先，让我们使用 `Ctrl-C` 取消正在运行的服务，然后以守护进程服务的形式重启它们。


    在 `composeapp` 目录下按下 `Ctrl-C`，然后重新运行 `docker-compose up` 命令，这次带有 `-d` 标记。


    ```

    $ sudo docker-compose up -d

    Starting composeapp_web_1 ...

    Starting composeapp_redis_1 ...

    Starting composeapp_redis_1

    Starting composeapp_web_1 ... done

    $ . . .

    ```


    我们看到 Compose 重新创建了我们的服务，启动了它们并返回到命令行。


    我们由 Compose 管理的服务现在以守护模式运行在宿主机上。现在让我们使用 `docker-compose ps` 命令来查看它们；它是 `docker
    ps` 命令的近亲。


    提示 你可以通过运行 `docker-compose help` 以及你想获取帮助的命令（例如 `docker-compose help ps`）来获取 Compose
    命令的帮助。


    `docker-compose ps` 命令列出了来自本地 `docker-compose.yml` 文件所有正在运行的服务。


    ```

    $ cd composeapp

    $ sudo docker-compose ps

    Name               Command                     State Ports

    ------------------------------------------------------------------

    composeapp_redis_1 docker-entrypoint.sh redis  Up    6379/tcp

    composeapp_web_1   python app.py               Up    0.0.0.0:5000->5000/tcp

    ```


    这显示了运行中的 Compose 服务的基本信息。每个服务的名称、我们用于启动服务的命令以及在每个服务上映射的端口。


    我们还可以使用 `docker-compose logs` 命令进一步查看以显示我们服务的日志事件。


    ```

    $ sudo docker-compose logs

    docker-compose logs

    Attaching to composeapp_redis_1, composeapp_web_1

    redis_1 |  (    ''      ,       .-`  | `,    )     Running in stand alone mode

    redis_1 |  |`-._`-...-` __...-.``-._|''` _.-''|     Port: 6379

    redis_1 |  |    `-._   `._    /     _.-''    |     PID: 1

    . . .

    ```


    这将尾随你服务的日志文件，类似于 `tail -f` 命令。就像 `tail -f` 命令一样，你需要使用 `Ctrl-C` 或类似操作来退出。


    我们还可以使用 `docker-compose stop` 命令停止正在运行的服务。


    ```

    $ sudo docker-compose stop

    Stopping composeapp_web_1...

    Stopping composeapp_redis_1...

    ```


    这将停止两个服务。如果服务没有停止，你可以使用 `docker-compose kill` 命令强制杀死服务。


    我们可以再次通过 `docker-compose ps` 命令来验证这一点。


    ```

    $ sudo docker-compose ps

    Name               Command         State    Ports

    -------------------------------------------------

    composeapp_redis_1 redis-server    Exit 0

    composeapp_web_1   python app.py   Exit 0

    ```


    如果你使用 `docker-compose stop` 或 `docker-compose kill` 停止了服务，你也可以使用 `docker-compose
    start` 命令再次重启它们。这非常类似于使用 `docker start` 命令并将重启这些服务。


    最后，我们可以使用 `docker-compose rm` 命令移除服务。


    ```

    $ sudo docker-compose rm

    Going to remove composeapp_redis_1, composeapp_web_1

    Are you sure? [yN] y

    Removing composeapp_redis_1...

    Removing composeapp_web_1...

    ```


    系统将提示你确认想要删除这些服务，然后两个服务都将被删除。`docker-compose ps` 命令现在将不再显示运行或已停止的服务。


    ```

    $ sudo docker-compose ps

    Name   Command   State   Ports

    ------------------------------

    ```


    ### 7.1.6 Compose 总结


    现在在一个文件中我们就有了一个简单的 Redis 堆栈！你可以看到这让构建应用程序变得多么容易。然而，这仅仅是使用 Compose 可以做的事情的一小部分。Compose
    网站上有一些关于 [Rails](https://docs.docker.com/compose/rails/)、[Django](https://docs.docker.com/compose/django/)
    和 [Wordpress](https://docs.docker.com/compose/wordpress/) 的示例，引入了一些高级概念。


    提示 你可以在 Docker Compose 文档中查看完整的命令行参考。


    ## 7.2 Consul、服务发现与 Docker


    服务发现是分布式应用程序管理其关系的机制。分布式应用程序通常由多个组件组成。这些组件可以位于一起，也可以跨数据中心或地理区域分布。这些组件每个通常提供或消费其他组件的服务。


    服务发现允许这些组件在想要交互时找到彼此。由于应用程序的分布式特性，服务发现机制也需要是分布式的。由于它们通常是分布式应用程序组件之间的“胶水”，它们还需要是动态的、可靠的、韧性的，并且能够快速一致地共享关于这些服务的信息。


    Docker 专注于分布式应用程序以及微服务架构，是集成服务发现工具的理想候选。每个 Docker 容器都可以向工具注册其运行的服务。这提供了交互所需的信息，例如
    IP 地址或端口或两者。


    我们的示例服务发现工具 [Consul](http://www.consul.io/) 是一个使用共识算法的专用数据存储。Consul 特别使用 [Raft](http://en.wikipedia.org/wiki/Raft_(computer_science))
    共识算法来要求写入操作的法定人数。它还提供了一个键值存储和服务目录，具有高可用性、容错性，并保持强一致性保证。服务可以向 Consul 注册，并以高可用且分布的方式共享这些注册信息。


    Consul 同样有趣，因为它提供了：


    *   带有 API 的服务目录，而不是大多数服务发现工具传统的 `key=value` store。

    *   通过内置 DNS 服务器提供的基于 DNS 的查询接口，以及基于 HTTP 的 REST API 来查询信息。接口的选择（特别是基于 DNS 的接口）允许你轻松地将
    Consul 引入到现有环境中。


    '
- fmt: "\nTo get a better understanding of how Consul works, we’re going to see how\
    \ to run distributed Consul inside Docker containers. We’re then going to register\
    \ services from Docker containers to Consul and query that data from other Docker\
    \ containers. To make it more interesting we’re going to do this across multiple\
    \ Docker hosts.\n\nTo do this we’re going to:\n\n*   Create a Docker image for\
    \ the Consul service.\n*   Build three hosts running Docker and then run Consul\
    \ on each. The three hosts will provide us with a distributed environment to see\
    \ how resiliency and failover works with Consul.\n*   Build services that we’ll\
    \ register with Consul and then query that data from another service.\n\nNote\
    \ You can see a more generic introduction to Consul [in their documentation](http://www.consul.io/intro/index.html).\n\
    \n#### 7.2.1 Building a Consul image\n\nWe’re going to start with creating a `Dockerfile`\
    \ to build our Consul image. Let’s create a directory to hold our Consul image\
    \ first.\n\n```\n$ mkdir consul\n$ cd consul\n$ touch Dockerfile\n```\n\nNow let’s\
    \ look at the `Dockerfile` for our Consul image.\n\n```\nFROM ubuntu:16.04\nLABEL\
    \ maintainer=\"james@example.com\"\nENV REFRESHED_AT 2014-08-01\n\nRUN apt-get\
    \ -qqy update\nRUN apt-get -qqy install curl unzip\n\nADD https://releases.hashicorp.com/consul/0.6.4/consul_0.6.4_linux_amd64.zip\
    \ /tmp/consul.zip\nRUN cd /usr/sbin; unzip /tmp/consul.zip; chmod +x /usr/sbin/consul;\
    \ rm /tmp/consul.zip\n\nADD consul.json /config/\n\nEXPOSE 53/udp 8300 8301 8301/udp\
    \ 8302 8302/udp 8400 8500\n\nVOLUME [\"/data\"]\n\nENTRYPOINT [ \"/usr/sbin/consul\"\
    , \"agent\", \"-config-dir=/config\" ]\nCMD []\n```\n\nOur `Dockerfile` is pretty\
    \ simple. It’s based on an Ubuntu 16.04 image. It installs `curl` and `unzip`.\
    \ We then download the Consul zip file containing the `consul` binary. We move\
    \ that binary to `/usr/sbin/` and make it executable.\n\nWe then add a configuration\
    \ file for Consul, `consul.json`, to the `/config` directory. Let’s create and\
    \ look at that file now.\n\n```\n{\n  \"data_dir\": \"/data\",\n  \"client_addr\"\
    : \"0.0.0.0\",\n  \"ports\": {\n    \"dns\": 53\n  },\n  \"recursor\": \"8.8.8.8\"\
    \n}\n```\n\nThe `consul.json` configuration file is JSON formatted and provides\
    \ Consul with the information needed to get running. We’ve specified a data directory,\
    \ `/data`, to hold Consul’s data. We use the `client_addr` variable to bind Consul\
    \ to all interfaces inside our container.\n\nWe also use the `ports` block to\
    \ configure on which ports various Consul services run. In this case we’re specifying\
    \ that Consul’s DNS service should run on port `53`. Lastly, we’ve used the `recursor`\
    \ option to specify a DNS server to use for resolution if Consul can’t resolve\
    \ a DNS request. We’ve specified `8.8.8.8` which is one of the IP addresses of\
    \ [Google’s public DNS service](https://developers.google.com/speed/public-dns/).\n\
    \nTip You can find the full list of available Consul configuration options [in\
    \ the Consul documentation](http://www.consul.io/docs/agent/options.html).\n\n\
    Back in our `Dockerfile` we’ve used the `EXPOSE` instruction to open up a series\
    \ of ports that Consul requires to operate. I’ve added a table showing each of\
    \ these ports and what they do.\n\nConsul’s default ports.\n\n| Port | Purpose\
    \ |\n| --- | --- |\n| 53/udp | DNS server |\n| 8300 | Server RPC |\n| 8301 + udp\
    \ | Serf LAN port |\n| 8302 + udp | Serf WAN port |\n| 8400 | RPC endpoint |\n\
    | 8500 | HTTP API |\n\nYou don’t need to worry about most of them for the purposes\
    \ of this chapter. The important ones for us are `53/udp` which is the port Consul\
    \ is going to be running DNS on. We’re going to use DNS to query service information.\
    \ We’re also going to use Consul’s HTTP API and its web interface, both of which\
    \ are bound to port `8500`. The rest of the ports handle the backend communication\
    \ and clustering between Consul nodes. We’ll configure them in our Docker container\
    \ but we don’t do anything specific with them.\n\nNote You can find more details\
    \ of what each port does [in the Consul documentation](http://www.consul.io/docs/agent/options.html).\n\
    \nNext, we’ve also made our `/data` directory a volume using the `VOLUME` instruction.\
    \ This is useful if we want to manage or work with this data as we saw in Chapter\
    \ 6.\n\nFinally, we’ve specified an `ENTRYPOINT` instruction to launch Consul\
    \ using the `consul` binary when a container is launched from our image.\n\nLet’s\
    \ step through the command line options we’ve used. We’ve specified the `consul`\
    \ binary. We’ve specified the `consul.json` location.\n\n#### 7.2.2 Testing a\
    \ single node\n\nWe’ve used the `docker run` command to create a container. We’ve\
    \ mapped two ports, port `8500` in the container to `8500` on the host and port\
    \ `53` in the container to `53` on the host. We’ve also used the `-h` flag to\
    \ specify the hostname of the container, here `node1`. We’ve then specified the\
    \ name of our Consul image, `turn01/consul`.\n\n```\n$ docker run -p 8500:8500\
    \ -p 53:53 -h node1 turn01/consul -server -bootstrap\n```\n\nLog data will now\
    \ stream as it occurs:\n\n```\n2016/08/05 17:59:38 [INFO] Starting Consul agent...\n\
    2016/08/05 17:59:38 [INFO] Bootstrap mode enabled!\n2016/08/05 17:59:38 [INFO]\
    \ Node name: node1\n2016/08/05 17:59:38 [INFO] Datacenter: dc1\n2016/08/05 17:59:38\
    \ [INFO] Server: true\n2016/08/05 17:59:38 [INFO] Client Addr: 0.0.0.0\n2016/08/05\
    \ 17:59:38 [INFO] Gossip encrypt: false\n2016/08/05 17:59:38 [INFO] RPC-TLS: false\n\
    2016/08/05 17:59:38 [INFO] TLS: false\n2016/08/05 17:59:38 [INFO] raft: DisablingSingleNode\
    \ (bootstrap)\n2016/08/05 17:59:38 [INFO] consul: leadership acquired\n2016/08/05\
    \ 17:59:38 [INFO] raft: New elected: node1\n2016/08/05 17:59:38 [INFO] consul:\
    \ member 'node1' joined, marking health alive\n2016/08/05 17:59:40 [INFO] agent:\
    \ Synced service 'consul'\n```\n\nWe see that Consul has started `node1` and done\
    \ a local leader election. As we’ve got no other Consul nodes running it is not\
    \ connected to anything else.\n\nWe can also see this via the Consul web interface\
    \ if we browse to our local host’s IP address on port `8500`.\n\n![The Consul\
    \ web interface.](images/00036.jpeg)\n\nThe Consul web interface.\n"
  raw: "To get a better understanding of how Consul works, we’re going to see how\
    \ to run distributed Consul inside Docker containers. We’re then going to register\
    \ services from Docker containers to Consul and query that data from other Docker\
    \ containers. To make it more interesting we’re going to do this across multiple\
    \ Docker hosts.\n\nTo do this we’re going to:\n\n*   Create a Docker image for\
    \ the Consul service.\n\n*   Build three hosts running Docker and then run Consul\
    \ on each. The three hosts will provide us with a distributed environment to see\
    \ how resiliency and failover works with Consul.\n\n*   Build services that we’ll\
    \ register with Consul and then query that data from another service.\n\nNote\
    \ You can see a more generic introduction to Consul [in their documentation](http://www.consul.io/intro/index.html).\n\
    \n### 7.2.1 Building a Consul image\n\nWe’re going to start with creating a `Dockerfile`\
    \ to build our Consul image. Let’s create a directory to hold our Consul image\
    \ first.\n\n```\n$ mkdir consul\n$ cd consul\n$ touch Dockerfile\n```\n\nNow let’s\
    \ look at the `Dockerfile` for our Consul image.\n\n```\nFROM ubuntu:16.04\nLABEL\
    \ maintainer=\"james@example.com\"\nENV REFRESHED_AT 2014-08-01\n\nRUN apt-get\
    \ -qqy update\nRUN apt-get -qqy install curl unzip\n\nADD https://releases.hashicorp.com/consul/0.6.4/consul_0.6.4_linux_amd64.zip\
    \ /tmp/consul.zip\nRUN cd /usr/sbin; unzip /tmp/consul.zip; chmod +x /usr/sbin/consul;\
    \ rm /tmp/consul.zip\n\nADD consul.json /config/\n\nEXPOSE 53/udp 8300 8301 8301/udp\
    \ 8302 8302/udp 8400 8500\n\nVOLUME [\"/data\"]\n\nENTRYPOINT [ \"/usr/sbin/consul\"\
    , \"agent\", \"-config-dir=/config\" ]\nCMD []\n```\n\nOur `Dockerfile` is pretty\
    \ simple. It’s based on an Ubuntu 16.04 image. It installs `curl` and `unzip`.\
    \ We then download the Consul zip file containing the `consul` binary. We move\
    \ that binary to `/usr/sbin/` and make it executable.\n\nWe then add a configuration\
    \ file for Consul, `consul.json`, to the `/config` directory. Let’s create and\
    \ look at that file now.\n\n```\n{\n  \"data_dir\": \"/data\",\n  \"client_addr\"\
    : \"0.0.0.0\",\n  \"ports\": {\n    \"dns\": 53\n  },\n  \"recursor\": \"8.8.8.8\"\
    \n}\n```\n\nThe `consul.json` configuration file is JSON formatted and provides\
    \ Consul with the information needed to get running. We’ve specified a data directory,\
    \ `/data`, to hold Consul’s data. We use the `client_addr` variable to bind Consul\
    \ to all interfaces inside our container.\n\nWe also use the `ports` block to\
    \ configure on which ports various Consul services run. In this case we’re specifying\
    \ that Consul’s DNS service should run on port 53\\. Lastly, we’ve used the `recursor`\
    \ option to specify a DNS server to use for resolution if Consul can’t resolve\
    \ a DNS request. We’ve specified `8.8.8.8` which is one of the IP addresses of\
    \ [Google’s public DNS service](https://developers.google.com/speed/public-dns/).\n\
    \nTip You can find the full list of available Consul configuration options [in\
    \ the Consul documentation](http://www.consul.io/docs/agent/options.html).\n\n\
    Back in our `Dockerfile` we’ve used the `EXPOSE` instruction to open up a series\
    \ of ports that Consul requires to operate. I’ve added a table showing each of\
    \ these ports and what they do.\n\nConsul’s default ports.\n\n| Port | Purpose\
    \ |\n\n| --- | --- |\n\n| 53/udp | DNS server |\n\n| 8300 | Server RPC |\n\n|\
    \ 8301 + udp | Serf LAN port |\n\n| 8302 + udp | Serf WAN port |\n\n| 8400 | RPC\
    \ endpoint |\n\n| 8500 | HTTP API |\n\nYou don’t need to worry about most of them\
    \ for the purposes of this chapter. The important ones for us are `53/udp` which\
    \ is the port Consul is going to be running DNS on. We’re going to use DNS to\
    \ query service information. We’re also going to use Consul’s HTTP API and its\
    \ web interface, both of which are bound to port `8500`. The rest of the ports\
    \ handle the backend communication and clustering between Consul nodes. We’ll\
    \ configure them in our Docker container but we don’t do anything specific with\
    \ them.\n\nNote You can find more details of what each port does [in the Consul\
    \ documentation](http://www.consul.io/docs/agent/options.html).\n\nNext, we’ve\
    \ also made our `/data` directory a volume using the `VOLUME` instruction. This\
    \ is useful if we want to manage or work with this data as we saw in Chapter 6.\n\
    \nFinally, we’ve specified an `ENTRYPOINT` instruction to launch Consul using\
    \ the `consul` binary when a container is launched from our image.\n\nLet’s step\
    \ through the command line options we’ve used. We’ve specified the `consul` binary\
    \ in `/usr/sbin/`. We’ve passed it the `agent` command which tells Consul to run\
    \ as an agent and the `-config-dir` flag and specified the location of our `consul.json`\
    \ file in the `/config` directory.\n\nLet’s build our image now.\n\n```\n$ sudo\
    \ docker build -t=\"jamtur01/consul\" .\n```\n\nNote You can get our Consul `Dockerfile`\
    \ and configuration file [on GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/7/consul/).\
    \ If you don’t want to use a home grown image there is also an officially sanctioned\
    \ [Consul image on the Docker Hub](https://hub.docker.com/_/consul/).\n\n### 7.2.2\
    \ Testing a Consul container locally\n\nBefore we run Consul on multiple hosts,\
    \ let’s see it working locally on a single host. To do this we’ll run a container\
    \ from our new `jamtur01/consul` image.\n\n```\n$ sudo docker run -p 8500:8500\
    \ -p 53:53/udp \\\n-h node1 jamtur01/consul -server -bootstrap\n==> WARNING: Bootstrap\
    \ mode enabled! Do not enable unless necessary\n==> Starting Consul agent...\n\
    ==> Starting Consul agent RPC...\n==> Consul agent running!\n   Node name: 'node1'\n\
    \   Datacenter: 'dc1'\n   Server: true (bootstrap: true)\n   Client Addr: 0.0.0.0\
    \ (HTTP: 8500, HTTPS: -1, DNS: 53, RPC: 8400)\n   Cluster Addr: 172.17.0.8 (LAN:\
    \ 8301, WAN: 8302)\n   Gossip encrypt: false, RPC-TLS: false, TLS-Incoming: false\n\
    \   Atlas: <disabled>\n\n==> Log data will now stream in as it occurs:\n\n. .\
    \ .\n\n2016/08/05 17:59:38 [INFO] consul: cluster leadership acquired\n2016/08/05\
    \ 17:59:38 [INFO] consul: New leader elected: node1\n2016/08/05 17:59:38 [INFO]\
    \ raft: Disabling EnableSingleNode (bootstrap)\n2016/08/05 17:59:38 [INFO] consul:\
    \ member 'node1' joined, marking health alive\n2016/08/05 17:59:40 [INFO] agent:\
    \ Synced service 'consul'\n```\n\nWe’ve used the `docker run` command to create\
    \ a new container. We’ve mapped two ports, port `8500` in the container to `8500`\
    \ on the host and port `53` in the container to `53` on the host. We’ve also used\
    \ the `-h` flag to specify the hostname of the container, here `node1`. This is\
    \ going to be both the hostname of the container and the name of the Consul node.\
    \ We’ve then specified the name of our Consul image, `jamtur01/consul`.\n\nLastly,\
    \ we’ve passed two flags to the `consul` binary: `-server` and `-bootstrap`. The\
    \ `-server` flag tells the Consul agent to operate in server mode. The `-bootstrap`\
    \ flag tells Consul that this node is allowed to self-elect as a leader. This\
    \ allows us to see a Consul agent in server mode doing a Raft leadership election.\n\
    \nWarning It is important that no more than one server per datacenter be running\
    \ in bootstrap mode. Otherwise consistency cannot be guaranteed if multiple nodes\
    \ are able to self-elect. We’ll see some more on this when we add other nodes\
    \ to the cluster.\n\nWe see that Consul has started `node1` and done a local leader\
    \ election. As we’ve got no other Consul nodes running it is not connected to\
    \ anything else.\n\nWe can also see this via the Consul web interface if we browse\
    \ to our local host’s IP address on port `8500`.\n\n![The Consul web interface.](images/00036.jpeg)\n\
    \nThe Consul web interface.\n\n### 7.2.3 Running a Consul cluster in Docker"
