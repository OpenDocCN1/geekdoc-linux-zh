    $ touch Dockerfile

    ```


    现在我们来填充我们的 `Dockerfile`。


    ```

    FROM ubuntu:16.04

    LABEL maintainer="james@example.com"

    ENV REFRESHED_AT 2016-06-01


    RUN apt-get -yqq update

    RUN apt-get -yqq install tomcat7 default-jdk


    ENV CATALINA_HOME /usr/share/tomcat7

    ENV CATALINA_BASE /var/lib/tomcat7

    ENV CATALINA_PID /var/run/tomcat7.pid

    ENV CATALINA_SH /usr/share/tomcat7/bin/catalina.sh

    ENV CATALINA_TMPDIR /tmp/tomcat7-tomcat7-tmp


    RUN mkdir -p $CATALINA_TMPDIR


    VOLUME [ "/var/lib/tomcat7/webapps/" ]


    EXPOSE 8080


    ENTRYPOINT [ "/usr/share/tomcat7/bin/catalina.sh", "run" ]

    ```


    我们的镜像非常简单。我们需要安装 Java JDK 和 Tomcat 服务器。我们将指定 Tomcat 启动所需的一些环境变量，然后创建一个临时目录。我们还会创建一个名为
    `/var/lib/tomcat7/webapps/` 的数据卷，暴露 `8080` 端口（Tomcat 的默认端口），最后使用 `ENTRYPOINT`
    指令启动 Tomcat。


    现在我们来构建我们的 Tomcat 7 镜像。


    ```

    $ sudo docker build -t jamtur01/tomcat7 .

    ```


    ### 6.2.4 运行我们的 WAR 文件


    现在让我们通过创建一个运行示例应用程序的新 Tomcat 实例来查看我们的 Tomcat 服务器运行情况。


    ```

    $ sudo docker run --name sample_app --volumes-from sample \

    -d -P jamtur01/tomcat7

    ```


    这将创建一个名为 `sample_app` 的新容器，它复用了 `sample` 容器的数据卷。这意味着存储在 `/var/lib/tomcat7/webapps/`
    卷中的 WAR 文件将从 `sample` 容器挂载到 `sample_app` 容器中，然后被 Tomcat 加载并执行。


    让我们在浏览器中查看示例应用程序。首先，我们必须使用 `docker port` 命令识别被暴露的端口。


    ```

    $ sudo docker port sample_app 8080

    0.0.0.0:49154

    ```


    现在我们访问我们的应用程序（使用 URL 和端口并添加 `/sample` 后缀），查看那里有什么。


    ![我们的 Tomcat 示例应用程序。](img/00030.jpeg)


    我们的 Tomcat 示例应用程序。


    我们应该能看到正在运行的 Tomcat 应用。


    ### 6.2.5 在我们的 Tomcat 应用服务器之上构建


    现在我们已经有了构建简单的按需 Web 服务的组件。让我们看看如何扩展它。为了实现这一点，我们构建了一个基于 Sinatra 的简单 Web 应用程序，通过网页自动配置
    Tomcat 应用程序。我们将此应用程序命名为 TProv。你可以在 [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/6/tomcat/tprov)
    上看到它的源代码。


    让我们将其安装作为演示，展示你如何扩展此示例或类似的示例。首先，我们需要确保已安装了 Ruby。我们将在 Docker 主机上安装 TProv 应用程序，因为我们的应用程序将直接与
    Docker 守护进程交互，所以我们需要在那里安装 Ruby。


    注意：我们也可以在 Docker 容器内安装 TProv 应用程序。


    ```

    $ sudo apt-get -qqy ruby ruby-dev build-essential

    ```


    然后我们从 Ruby gem 安装我们的应用程序。


    ```

    $ sudo gem install --no-rdoc --no-ri tprov

    . . .

    Successfully installed tprov-0.0.6

    ```


    这将安装 TProv 应用程序以及一些支持性的 gem。


    然后使用 `tprov` 二进制文件启动应用程序。


    ```

    $ sudo tprov

    [2014-06-21 16:17:24] INFO  WEBrick 1.3.1

    [2014-06-21 16:17:24] INFO  ruby 1.8.7 (2011-06-30) [x86_64-linux]

    == Sinatra/1.4.5 has taken the stage on 4567 for development with backup from
    WEBrick

    [2014-06-21 16:17:24] INFO  WEBrick 1.3.1

    pid=14209 port=4567

    此命令已启动我们的应用程序；现在我们可以通过端口 4567 访问 TProv

    ```


