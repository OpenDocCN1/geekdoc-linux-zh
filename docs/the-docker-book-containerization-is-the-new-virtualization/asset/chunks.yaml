- fmt: "\n```\n$ sudo docker rmi `docker images -a -q`\n```\n\n## 4.8 Running your\
    \ own Docker registry\n\nHaving a public registry of Docker images is highly useful.\
    \ Sometimes, however, we are going to want to build and store images that contain\
    \ information or data that we don’t want to make public. There are two choices\
    \ in this situation:\n\n*   Make use of private [repositories on the Docker Hub](https://hub.docker.com).\n\
    *   Run your own registry behind the firewall.\n\nThe team at Docker, Inc., have\
    \ [open-sourced the code](https://docs.docker.com/registry/) they use to run a\
    \ Docker registry, thus allowing us to build our own internal registry. The registry\
    \ does not currently have a user interface and is only made available as an API\
    \ service.\n\nTip If you’re running Docker behind a proxy or corporate firewall\
    \ you can also use the `HTTPS_PROXY`, `HTTP_PROXY`, `NO_PROXY` options to control\
    \ how Docker connects.\n\n### 4.8.1 Running a registry from a container\n\nInstalling\
    \ a registry from a Docker container is simple. Just run the Docker-provided container\
    \ like so:\n\n```\n$ docker run -d -p 5000:5000 --name registry registry:2\n```\n\
    \nThis will launch a container running version 2.0 of the registry application\
    \ and bind port 5000 to the local host.\n\nTip If you’re running an older version\
    \ of the Docker Registry, prior to 2.0, you can use the [Migrator](https://github.com/docker/migrator)\
    \ tool to upgrade to a new registry.\n\n### 4.8.2 Testing the new registry\n\n\
