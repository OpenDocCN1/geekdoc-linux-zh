  trans: "\n为了更好地理解 Consul 的工作原理，我们将查看如何在 Docker 容器中运行分布式 Consul。然后，我们将把 Docker 容器中的服务注册到\
    \ Consul，并从其他 Docker 容器查询这些数据。为了让过程更有趣，我们将在多个 Docker 主机上进行这些操作。\n\n为了实现这一目标，我们将：\n\
    \n*   为 Consul 服务创建一个 Docker 镜像。\n*   构建三个运行 Docker 的主机，并在每个主机上运行 Consul。这三个主机将为我们提供一个分布式环境，以观察\
    \ Consul 的弹性和故障转移机制是如何工作的。\n*   构建一些我们将注册到 Consul 的服务，然后从另一个服务中查询这些数据。\n\n注意：你可以在[它们的官方文档](http://www.consul.io/intro/index.html)中看到更多关于\
    \ Consul 的通用介绍。\n\n#### 7.2.1 构建 Consul 镜像\n\n我们将从创建一个 `Dockerfile` 开始，用于构建 Consul\
    \ 镜像。首先，让我们创建一个目录来存放我们的 Consul 镜像。\n\n```\n$ mkdir consul\n$ cd consul\n$ touch\
    \ Dockerfile\n```\n\n现在让我们来看 Consul 镜像的 `Dockerfile`。\n\n```\nFROM ubuntu:16.04\n\
    LABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2014-08-01\n\nRUN apt-get\
    \ -qqy update\nRUN apt-get -qqy install curl unzip\n\nADD https://releases.hashicorp.com/consul/0.6.4/consul_0.6.4_linux_amd64.zip\
    \ /tmp/consul.zip\nRUN cd /usr/sbin; unzip /tmp/consul.zip; chmod +x /usr/sbin/consul;\
    \ rm /tmp/consul.zip\n\nADD consul.json /config/\n\nEXPOSE 53/udp 8300 8301 8301/udp\
    \ 8302 8302/udp 8400 8500\n\nVOLUME [\"/data\"]\n\nENTRYPOINT [ \"/usr/sbin/consul\"\
    , \"agent\", \"-config-dir=/config\" ]\nCMD []\n```\n\n我们的 `Dockerfile` 非常简单。它基于\
    \ Ubuntu 16.04 镜像。它安装了 `curl` 和 `unzip`。然后我们下载了包含 `consul` 二进制文件的 Consul 压缩包。我们将该二进制文件移动到\
    \ `/usr/sbin/` 并使其变为可执行。\n\n随后我们向 `/config` 目录添加了 Consul 的配置文件 `consul.json`。现在让我们创建并查看该文件。\n\
    \n```\n{\n  \"data_dir\": \"/data\",\n  \"client_addr\": \"0.0.0.0\",\n  \"ports\"\
    : {\n    \"dns\": 53\n  },\n  \"recursor\": \"8.8.8.8\"\n}\n```\n\n`consul.json`\
    \ 配置文件是 JSON 格式，为 Consul 提供了运行所需的信息。我们指定了一个数据目录 `/data` 来存放 Consul 的数据。我们使用 `client_addr`\
    \ 变量将 Consul 绑定到容器内部的所有接口上。\n\n我们还使用 `ports` 块来配置各种 Consul 服务运行在哪些上。在这种情况下，我们指定\
    \ Consul 的 DNS 服务应该运行在端口 `53` 上。最后，我们使用了 `recursor` 选项来指定当 Consul 无法解析 DNS 请求时使用的\
    \ DNS 服务器。我们指定了 `8.8.8.8`，它是[Google 公共 DNS 服务](https://developers.google.com/speed/public-dns/)的\
    \ IP 地址之一。\n\n提示：你可以在[Consul 文档](http://www.consul.io/docs/agent/options.html)中找到所有可用的\
    \ Consul 配置选项完整列表。\n\n回到 `Dockerfile`，我们使用了 `EXPOSE` 指令打开了 Consul 运行所需系列端口。我添加了一个表格显示了这些端口及其的作用。\n\
    \nConsul 的默认端口。\n\n| 端口 | 用途 |\n| --- | --- |\n| 53/udp | DNS 服务器 |\n| 8300 |\
    \ Server RPC |\n| 8301 + udp | Serf LAN 端口 |\n| 8302 + udp | Serf WAN 端口 |\n|\
    \ 8400 | RPC 端点 |\n| 8500 | HTTP API |\n\n就本章而言，你不需要担心大部分端口。对我们来说重要的是 `53/udp`，这是\
    \ Consul 运行 DNS 的端口。我们将使用 DNS 来查询服务信息。我们还将使用 Consul 的 HTTP API 及其 Web 界面，两者都绑定到端口\
    \ `8500`。其余端口处理 Consul 节点之间的后端通信和集群。我们会在 Docker 容器中配置它们，但不会对它们进行任何特殊操作。\n\n注意：你可以在[Consul\
    \ 文档](http://www.consul.io/docs/agent/options.html)中找到每个端口作用的更多细节。\n\n接下来，我们还使用\
    \ `VOLUME` 指令将 `/data` 目录设为卷。如果我们像在第 6 章看到的那样想要管理或处理这些数据，这将非常有用。\n\n最后，我们指定了 `ENTRYPOINT`\
    \ 指令，以便从我们的镜像启动容器时使用 `consul` 二进制文件启动 Consul。\n\n让我们逐步查看使用的命令行选项。我们指定了 `consul`\
    \ 二进制文件。我们指定了 `consul.json`。\n\n#### 7.2.2 测试单节点\n\n我们使用 `docker run` 命令创建一个容器。我们映射了端口：容器的\
    \ `8500` 到主机的 `8500`，容器的 `53` 到主机的 `53`。我们还使用了 `-h` 标志来指定容器的主机名为 `node1`。我们指定了\
    \ Consul 镜像名称 `turn01/consul`。\n\n```\n$ docker run -p 8500:8500 -p 53:53 -h node1\
    \ turn01/consul -server\n```\n\n日志数据现在会发生实时流出：\n\n```\n2016/08/05 17:59:38 [INFO]\
    \ Starting Consul agent...\n2016/08/05 17:59:38 [INFO] Bootstrap mode enabled!\n\
    2016/08/05 17:59:38 [INFO] Node name: node1\n2016/08/05 17:59:38 [INFO] Datacenter:\
    \ dc1\n2016/08/05 17:59:38 [INFO] Server: true\n2016/08/05 17:59:38 [INFO] Client\
    \ Addr: 0.0.0.0\n2016/08/05 17:59:38 [INFO] Gossip encrypt: false\n2016/08/05\
    \ 17:59:38 [INFO] RPC-TLS: false\n2016/08/05 17:59:38 [INFO] TLS: false\n2016/08/05\
    \ 17:59:38 [INFO] raft: DisablingSingleNode (bootstrap)\n2016/08/05 17:59:38 [INFO]\
    \ consul: leadership acquired\n2016/08/05 17:59:38 [INFO] raft: New elected: node1\n\
    2016/08/05 17:59:38 [INFO] consul: member 'node1' joined, marking health alive\n\
    2016/08/05 17:59:40 [INFO] agent: Synced service 'consul'\n```\n\n我们看到 Consul\
    \ 启动了 `node1` 并进行了本地主选举。由于我们没有运行其他 Consul 节点，它没有连接到任何其他地方。\n\n如果我们在本地主机 IP 地址的端口\
    \ `8500` 上浏览，也可以通过 Consul Web 界面看到这一点。\n\n![Consul Web 界面。](img/00036.jpeg)\n\n\
    Consul Web 界面。\n"
- fmt: "\nAs `Consul` is distributed we’d normally create three (or more) hosts to\
    \ run in separate data centers, clouds or regions. Or even add an agent to every\
    \ application server. This will provide us with sufficient distributed resilience.\
    \ We’re going to mimic this required distribution by creating three new hosts\
    \ each with a `Docker` daemon to run `Consul`. We will create three new Ubuntu\
    \ 16.04 hosts: `larry`, `curly`, and `moe`. On each host we’ll install a `Docker`\
    \ daemon. We’ll also pull down the `jamtur01/consul` image.\n\nTip Create the\
    \ hosts using whatever means you run up new hosts and to install `Docker` you\
    \ can use the installation instructions in Chapter 2.\n\n```\n$ sudo docker pull\
    \ jamtur01/consul\n```\n\nOn each host we’re going to run a `Docker` container\
    \ with the `jamtur01/consul` image. To do this we need to choose a network to\
    \ run `Consul` over. In most cases this would be a private network but as we’re\
    \ just simulating a `Consul` cluster I am going to use the public interfaces of\
    \ each host. To start `Consul` on this public network I am going to need the public\
    \ IP address of each host. This is the address to which we’re going to bind each\
    \ `Consul` agent.\n\nLet’s grab that now on `larry` and assign it to an environment\
    \ variable, `$PUBLIC_IP`.\n\n```\nlarry$ PUBLIC_IP=\"$(ifconfig eth0 | awk -F\
    \ ' *|:' '/inet addr/{print $4}')\"\nlarry$ echo $PUBLIC_IP\n162.243.167.159\n\
    ```\n\nAnd then create the same `$PUBLIC_IP` variable on `curly` and `moe` too.\n\
    \n```\ncurly$ PUBLIC_IP=\"$(ifconfig eth0 | awk -F ' *|:' '/inet addr/{print $4}')\"\
    \ncurly$ echo $PUBLIC_IP\n162.243.170.66\nmoe$ PUBLIC_IP=\"$(ifconfig eth0 | awk\
    \ -F ' *|:' '/inet addr/{print $4}')\"\nmoe$ echo $PUBLIC_IP\n159.203.191.16\n\
    ```\n\nWe see we’ve got three hosts and three IP addresses, each assigned to the\
    \ `$PUBLIC_IP` environmental variable.\n\n### Consul host IP addresses\n\n| Host\
    \ | IP Address |\n| --- | --- |\n| larry | 162.243.167.159 |\n| curly | 162.243.170.66\
    \ |\n| moe | 159.203.191.16 |\n\nWe’re also going to need to nominate a host to\
    \ bootstrap to start the cluster. We’re going to choose `larry`. This means we’ll\
    \ need `larry`’s IP address on `curly` and `moe` to tell them which `Consul` node’s\
    \ cluster to join. Let’s set that up now by adding `larry`’s IP address of `162.243.167.159`\
    \ to `curly` and `moe` as the environment variable, `$JOIN_IP`.\n\n```\ncurly$\
    \ JOIN_IP=162.243.167.159\nmoe$ JOIN_IP=162.243.167.159\n```\n\n### 7.2.4 Starting\
    \ the Consul bootstrap node\n\nLet’s start our initial bootstrap node on `larry`.\
    \ Our `docker run` command is going to be a little complex because we’re mapping\
    \ a lot of ports. Indeed, we need to map all the ports listed in Table 7.1 above.\
    \ And, as we’re both running `Consul` in a container and connecting to containers\
    \ on other hosts, we’re going to map each port to the corresponding port on the\
    \ local host. This will allow both internal and external access to `Consul`.\n\
    \nLet’s see our `docker run` command now.\n\n```\nlarry$ sudo docker run -d -h\
    \ $HOSTNAME \\\n-p 8300:8300 -p 8301:8301 \\\n-p 8301:8301/udp -p 8302:8302 \\\
    \n-p 8302:8302/udp -p 8400:8400 \\\n-p 8500:8500 -p 53:53/udp \\\n--name larry_agent\
    \ jamtur01/consul \\\n-server -advertise $PUBLIC_IP -bootstrap-expect 3\n```\n\
    \nHere we’ve launched a daemonized container using the `jamtur01/consul` image\
    \ to run our `Consul` agent. We’ve set the `-h` flag to set the hostname of the\
    \ container to the value of the `$HOSTNAME` environment variable. This sets our\
    \ `Consul` agent’s name to be the local hostname, here `larry`. We’re also mapped\
    \ a series of eight ports from inside the container to the respective ports on\
    \ the local host.\n\nWe’ve also specified some command line options for the `Consul`\
    \ agent.\n\n```\n-server -advertise $PUBLIC_IP -bootstrap-expect 3\n```\n\nThe\
    \ `-server` flag tell the agent to run in server mode. The `-advertise` flag tells\
    \ that server to advertise itself on the IP address specified in the `$PUBLIC_IP`\
    \ environment variable. Lastly, the `-bootstrap-expect` flag tells `Consul` how\
    \ many agents to expect in this cluster. In this case, 3 agents. It also bootstraps\
    \ the cluster.\n\nLet’s look at the logs of our initial `Consul` container with\
    \ the `docker logs` command.\n\n```\nlarry$ sudo docker logs larry_agent\n==>\
    \ WARNING: Expect Mode enabled, expecting 3 servers\n==> Starting Consul agent...\n\
    ==> Starting Consul agent RPC...\n==> Consul agent running!\n         Node name:\
    \ 'larry'\n        Datacenter: 'dc1'\n            Server: true (bootstrap: false)\n\
    \       Client Addr: 0.0.0.0 (HTTP: 8500, HTTPS: -1, DNS: 53, RPC: 8400)\n   \
    \   Cluster Addr: 162.243.167.159 (LAN: 8301, WAN: 8302)\n    Gossip encrypt:\
    \ false, RPC-TLS: false, TLS-Incoming: false\n             Atlas: <disabled>\n\
    \n==> Log data will now stream in as it occurs:\n\n. . .\n\n2016/08/06 12:35:11\
    \ [INFO] serf: EventMemberJoin: larry.dc1 162.243.167.159\n2016/08/06 12:35:11\
    \ [INFO] consul: adding LAN server larry (Addr: 162.243.167.159:8300) (DC: dc1)\n\
    2016/08/06 12:35:11 [INFO] consul: adding WAN server larry.dc1 (Addr: 162.243.167.159:8300)\
    \ (DC: dc1)\n2016/08/06 12:35:11 [ERR] agent: failed to sync remote state: No\
    \ cluster leader\n2016/08/06 12:35:12 [WARN] raft: EnableSingleNode disabled,\
    \ and no known peers. Aborting election.\n```\n\nWe see that the agent on `larry`\
    \ is started but because we don’t have any more nodes yet no election has taken\
    \ place. We know this from the only error returned.\n\n### 7.2.5 Starting the\
    \ remaining nodes\n\nWe see `curly` has joined `larry`, indeed on `larry` we should\
    \ see something like the following:\n\n```\n2016/08/06 12:37:17 [INFO] serf: EventMemberJoin:\
    \ curly 162.243.170.66\n2016/08/06 12:37:17 [INFO] consul: adding LAN server curly\
    \ (Addr: 162.243.170.66:8300) (DC: dc1)\n```\n"
  raw: "As Consul is distributed we’d normally create three (or more) hosts to run\
    \ in separate data centers, clouds or regions. Or even add an agent to every application\
    \ server. This will provide us with sufficient distributed resilience. We’re going\
    \ to mimic this required distribution by creating three new hosts each with a\
    \ Docker daemon to run Consul. We will create three new Ubuntu 16.04 hosts: `larry`,\
    \ `curly`, and `moe`. On each host we’ll install a Docker daemon. We’ll also pull\
    \ down the `jamtur01/consul` image.\n\nTip Create the hosts using whatever means\
    \ you run up new hosts and to install Docker you can use the installation instructions\
    \ in Chapter 2.\n\n```\n$ sudo docker pull jamtur01/consul\n```\n\nOn each host\
    \ we’re going to run a Docker container with the `jamtur01/consul` image. To do\
    \ this we need to choose a network to run Consul over. In most cases this would\
    \ be a private network but as we’re just simulating a Consul cluster I am going\
    \ to use the public interfaces of each host. To start Consul on this public network\
    \ I am going to need the public IP address of each host. This is the address to\
    \ which we’re going to bind each Consul agent.\n\nLet’s grab that now on `larry`\
    \ and assign it to an environment variable, `$PUBLIC_IP`.\n\n```\nlarry$ PUBLIC_IP=\"\
    $(ifconfig eth0 | awk -F ' *|:' '/inet addr/{print $4}')\"\nlarry$ echo $PUBLIC_IP\n\
    162.243.167.159\n```\n\nAnd then create the same `$PUBLIC_IP` variable on `curly`\
    \ and `moe` too.\n\n```\ncurly$ PUBLIC_IP=\"$(ifconfig eth0 | awk -F ' *|:' '/inet\
    \ addr/{print $4}')\"\ncurly$ echo $PUBLIC_IP\n162.243.170.66\nmoe$ PUBLIC_IP=\"\
    $(ifconfig eth0 | awk -F ' *|:' '/inet addr/{print $4}')\"\nmoe$ echo $PUBLIC_IP\n\
    159.203.191.16\n```\n\nWe see we’ve got three hosts and three IP addresses, each\
    \ assigned to the `$PUBLIC_IP` environmental variable.\n\nConsul host IP addresses\n\
    \n| Host | IP Address |\n\n| --- | --- |\n\n| larry | 162.243.167.159 |\n\n| curly\
    \ | 162.243.170.66 |\n\n| moe | 159.203.191.16 |\n\nWe’re also going to need to\
    \ nominate a host to bootstrap to start the cluster. We’re going to choose `larry`.\
    \ This means we’ll need `larry`’s IP address on `curly` and `moe` to tell them\
    \ which Consul node’s cluster to join. Let’s set that up now by adding `larry`’s\
    \ IP address of `162.243.167.159` to `curly` and `moe` as the environment variable,\
    \ `$JOIN_IP`.\n\n```\ncurly$ JOIN_IP=162.243.167.159\nmoe$ JOIN_IP=162.243.167.159\n\
    ```\n\n### 7.2.4 Starting the Consul bootstrap node\n\nLet’s start our initial\
    \ bootstrap node on `larry`. Our `docker run` command is going to be a little\
    \ complex because we’re mapping a lot of ports. Indeed, we need to map all the\
    \ ports listed in Table 7.1 above. And, as we’re both running Consul in a container\
    \ and connecting to containers on other hosts, we’re going to map each port to\
    \ the corresponding port on the local host. This will allow both internal and\
    \ external access to Consul.\n\nLet’s see our `docker run` command now.\n\n```\n\
    larry$ sudo docker run -d -h $HOSTNAME \\\n-p 8300:8300 -p 8301:8301 \\\n-p 8301:8301/udp\
    \ -p 8302:8302 \\\n-p 8302:8302/udp -p 8400:8400 \\\n-p 8500:8500 -p 53:53/udp\
    \ \\\n--name larry_agent jamtur01/consul \\\n-server -advertise $PUBLIC_IP -bootstrap-expect\
    \ 3\n```\n\nHere we’ve launched a daemonized container using the `jamtur01/consul`\
    \ image to run our Consul agent. We’ve set the `-h` flag to set the hostname of\
    \ the container to the value of the `$HOSTNAME` environment variable. This sets\
    \ our Consul agent’s name to be the local hostname, here `larry`. We’re also mapped\
    \ a series of eight ports from inside the container to the respective ports on\
    \ the local host.\n\nWe’ve also specified some command line options for the Consul\
    \ agent.\n\n```\n-server -advertise $PUBLIC_IP -bootstrap-expect 3\n```\n\nThe\
    \ `-server` flag tell the agent to run in server mode. The `-advertise` flag tells\
    \ that server to advertise itself on the IP address specified in the `$PUBLIC_IP`\
    \ environment variable. Lastly, the `-bootstrap-expect` flag tells Consul how\
    \ many agents to expect in this cluster. In this case, 3 agents. It also bootstraps\
    \ the cluster.\n\nLet’s look at the logs of our initial Consul container with\
    \ the `docker logs` command.\n\n```\nlarry$ sudo docker logs larry_agent\n==>\
    \ WARNING: Expect Mode enabled, expecting 3 servers\n==> Starting Consul agent...\n\
    ==> Starting Consul agent RPC...\n==> Consul agent running!\n         Node name:\
    \ 'larry'\n        Datacenter: 'dc1'\n            Server: true (bootstrap: false)\n\
    \       Client Addr: 0.0.0.0 (HTTP: 8500, HTTPS: -1, DNS: 53, RPC: 8400)\n   \
    \   Cluster Addr: 162.243.167.159 (LAN: 8301, WAN: 8302)\n    Gossip encrypt:\
    \ false, RPC-TLS: false, TLS-Incoming: false\n             Atlas: <disabled>\n\
    \n==> Log data will now stream in as it occurs:\n\n. . .\n\n2016/08/06 12:35:11\
    \ [INFO] serf: EventMemberJoin: larry.dc1 162.243.167.159\n2016/08/06 12:35:11\
    \ [INFO] consul: adding LAN server larry (Addr: 162.243.167.159:8300) (DC: dc1)\n\
    2016/08/06 12:35:11 [INFO] consul: adding WAN server larry.dc1 (Addr: 162.243.167.159:8300)\
    \ (DC: dc1)\n2016/08/06 12:35:11 [ERR] agent: failed to sync remote state: No\
    \ cluster leader\n2016/08/06 12:35:12 [WARN] raft: EnableSingleNode disabled,\
    \ and no known peers. Aborting election.\n```\n\nWe see that the agent on `larry`\
    \ is started but because we don’t have any more nodes yet no election has taken\
    \ place. We know this from the only error returned.\n\n```\n[ERR] agent: failed\
    \ to sync remote state: No cluster leader\n```\n\n### 7.2.5 Starting the remaining\
    \ nodes\n\nNow we’ve bootstrapped our cluster we can start our remaining nodes\
    \ on `curly` and `moe`. Let’s start with `curly`. We use the `docker run` command\
    \ to launch our second agent.\n\n```\ncurly$ sudo docker run -d -h $HOSTNAME \\\
    \n-p 8300:8300 -p 8301:8301 \\\n-p 8301:8301/udp -p 8302:8302 \\\n-p 8302:8302/udp\
    \ -p 8400:8400 \\\n-p 8500:8500 -p 53:53/udp \\\n--name curly_agent jamtur01/consul\
    \ \\\n-server -advertise $PUBLIC_IP -join $JOIN_IP\n```\n\nWe see our command\
    \ is similar to our bootstrapped node on `larry` with the exception of the command\
    \ we’re passing to the Consul agent.\n\n```\n-server -advertise $PUBLIC_IP -join\
    \ $JOIN_IP\n```\n\nAgain we’ve enabled the Consul agent’s server mode with `-server`\
    \ and bound the agent to the public IP address using the `-advertise` flag. Finally,\
    \ we’ve told Consul to join our Consul cluster by specifying `larry`’s IP address\
    \ using the `$JOIN_IP` environment variable.\n\nLet’s see what happened when we\
    \ launched our container.\n\n```\ncurly$ sudo docker logs curly_agent\n==> Starting\
    \ Consul agent...\n==> Starting Consul agent RPC...\n==> Joining cluster...\n\
    \    Join completed. Synced with 1 initial agents\n==> Consul agent running!\n\
    \         Node name: 'curly'\n        Datacenter: 'dc1'\n            Server: true\
    \ (bootstrap: false)\n       Client Addr: 0.0.0.0 (HTTP: 8500, HTTPS: -1, DNS:\
    \ 53, RPC: 8400)\n      Cluster Addr: 162.243.170.66 (LAN: 8301, WAN: 8302)\n\
    \    Gossip encrypt: false, RPC-TLS: false, TLS-Incoming: false\n            \
    \ Atlas: <disabled>\n\n==> Log data will now stream in as it occurs:\n\n. . .\n\
    \n2016/08/06 12:37:17 [INFO] consul: adding LAN server curly (Addr: 162.243.170.66:8300)\
    \ (DC: dc1)\n2016/08/06 12:37:17 [INFO] consul: adding WAN server curly.dc1 (Addr:\
    \ 162.243.170.66:8300) (DC: dc1)\n2016/08/06 12:37:17 [INFO] agent: (LAN) joining:\
    \ [162.243.167.159]\n2016/08/06 12:37:17 [INFO] serf: EventMemberJoin: larry 162.243.167.159\n\
    2016/08/06 12:37:17 [INFO] agent: (LAN) joined: 1 Err: <nil>\n2016/08/06 12:37:17\
    \ [ERR] agent: failed to sync remote state: No cluster leader\n2016/08/06 12:37:17\
    \ [INFO] consul: adding LAN server larry (Addr: 162.243.167.159:8300) (DC: dc1)\n\
    2016/08/06 12:37:18 [WARN] raft: EnableSingleNode disabled, and no known peers.\
    \ Aborting election.\n```\n\nWe see `curly` has joined `larry`, indeed on `larry`\
    \ we should see something like the following:\n\n```\n2016/08/06 12:37:17 [INFO]\
    \ serf: EventMemberJoin: curly 162.243.170.66\n2016/08/06 12:37:17 [INFO] consul:\
    \ adding LAN server curly (Addr: 162.243.170.66:8300) (DC: dc1)\n```"
