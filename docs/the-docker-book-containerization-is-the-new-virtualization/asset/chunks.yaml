- fmt: "\nYou can also run your own private registry, and we’ll show you how to do\
    \ that in Chapter 4. This allows you to store images behind your firewall, which\
    \ may be a requirement for some organizations.\n\n### 1.2.4 Containers\n\nDocker\
    \ helps you build and deploy containers inside of which you can package your applications\
    \ and services. As we’ve just learned, containers are launched from images and\
    \ can contain one or more running processes. You can think about images as the\
    \ building or packing aspect of Docker and the containers as the running or execution\
    \ aspect of Docker.\n\nA Docker container is:\n\n*   An image format.\n*   A set\
    \ of standard operations.\n*   An execution environment.\n\nDocker borrows the\
    \ concept of the standard shipping container, used to transport goods globally,\
    \ as a model for its containers. But instead of shipping goods, Docker containers\
    \ ship software.\n\nEach container contains a software image – its ‘cargo’ – and,\
    \ like its physical counterpart, allows a set of operations to be performed. For\
    \ example, it can be created, started, stopped, restarted, and destroyed.\n\n\
    Like a shipping container, Docker doesn’t care about the contents of the container\
    \ when performing these actions; for example, whether a container is a web server,\
    \ a database, or an application server. Each container is loaded the same as any\
    \ other container.\n\nDocker also doesn’t care where you ship your container:\
    \ you can build on your laptop, upload to a registry, then download to a physical\
    \ or virtual server, test, deploy to a cluster of a dozen Amazon EC2 hosts, and\
    \ run. Like a normal shipping container, it is interchangeable, stackable, portable,\
    \ and as generic as possible.\n\nWith Docker, we can quickly build an application\
    \ server, a message bus, a utility appliance, a CI test bed for an application,\
    \ or one of a thousand other possible applications, services, and tools. It can\
    \ build local, self-contained test environments or replicate complex application\
    \ stacks for production or development purposes. The possible use cases are endless.\n\
    \n### 1.2.5 Compose and Swarm\n\nIn addition to solitary containers we can also\
    \ run Docker containers in stacks and clusters, what Docker calls swarms. The\
    \ Docker ecosystem contains two more tools:\n\n*   `Docker Compose` - which allows\
    \ you to run stacks of containers to represent application stacks, for example\
    \ web server, application server and database server containers running together\
    \ to serve a specific application.\n*   `Docker Swarm` - which allows you to create\
    \ clusters of containers, called swarms, that allow you to run scalable workloads.\n\
    \nWe’ll look at `Docker Compose` and `Swarm` in Chapter 7.\n\n### 1.3 What can\
    \ you use Docker for?\n\nSo why should you care about Docker or containers in\
    \ general? We’ve discussed briefly the isolation that containers provide; as a\
    \ result, they make excellent sandboxes for a variety of testing purposes. Additionally,\
    \ because of their ‘standard’ nature, they also make excellent building blocks\
    \ for services. Some of the examples of Docker running out in the wild include:\n\
    \n*   Helping make your local development and build workflow faster, more efficient,\
    \ and more lightweight. Local developers can build, run, and share Docker containers.\
    \ Containers can be built in development and promoted to testing environments\
    \ and, in turn, to production.\n*   Running stand-alone services and applications\
    \ consistently across multiple environments, a concept especially useful in service-oriented\
    \ architectures and deployments that rely heavily on micro-services.\n*   Using\
    \ `Docker` to create isolated instances to run tests like, for example, those\
    \ launched by a Continuous Integration (CI) suite like `Jenkins CI`.\n*   Building\
    \ and testing complex applications and architectures on a local host prior to\
    \ deployment into a production environment.\n*   Building a multi-user Platform-as-a-Service\
    \ (PAAS) infrastructure.\n*   Providing lightweight stand-alone sandbox environments\
    \ for developing, testing, and teaching technologies, such as the Unix shell or\
    \ a programming language.\n*   Software as a Service applications;\n*   Highly\
    \ performant, hyperscale deployments of hosts.\n\nYou can see a list of some of\
    \ the early projects built on and around the Docker ecosystem in the blog post\
    \ [here](http://blog.docker.com/2013/07/docker-projects-from-the-docker-community/).\n\
    \n### 1.4 Docker with configuration management\n\nSince Docker was announced,\
    \ there have been a lot of discussions about where Docker fits with configuration\
    \ management tools like `Puppet` and `Chef`. Docker includes an image-building\
    \ and image-management solution. One of the drivers for modern configuration management\
    \ tools was the response to [the “golden image” model](https://web.archive.org/web/20090207105003/http://madstop.com/2009/02/04/golden-image-or-foil-ball).\
    \ With golden images, you end up with massive and unmanageable image sprawl: large\
    \ numbers of (deployed) complex images in varying states of versioning. You create\
    \ randomness and exacerbate entropy in your environment as your image use grows.\
    \ Images also tend to be heavy and unwieldy. This often forces manual change or\
    \ layers of deviation and unmanaged configuration on top of images, because the\
    \ underlying images lack appropriate flexibility.\n\nCompared to traditional image\
    \ models, Docker is a lot more lightweight: images are layered, and you can quickly\
    \ iterate on them. There are some legitimate arguments to suggest that these attributes\
    \ alleviate many of the management problems traditional images present. It is\
    \ not immediately clear, though, that this alleviation represents the ability\
    \ to totally replace or supplement configuration management tools. There is amazing\
    \ power and control to be gained through the idempotence and introspection that\
    \ configuration management tools can provide. Docker itself still needs to be\
    \ installed, managed, and deployed on a host. That host also needs to be managed.\
    \ In turn, Docker containers may need to be orchestrated, managed, and deployed,\
    \ often in conjunction with external services and tools, which are all capabilities\
    \ that configuration management tools are excellent in providing.\n\nIt is also\
    \ apparent that Docker represents (or, perhaps more accurately, encourages) some\
    \ different characteristics and architecture for hosts, applications, and services:\
    \ they can be short-lived, immutable, disposable, and service-oriented. These\
    \ behaviors do not lend themselves or resonate strongly with the need for configuration\
    \ management tools. With these behaviors, you are rarely concerned with long-term\
    \ management of state, entropy is less of a concern because containers rarely\
    \ live long enough for it to, and the recreation of state may often be cheaper\
    \ than the remediation of state.\n\nNot all infrastructure can be represented\
    \ with these behaviors, however. Docker’s ideal workloads will likely exist alongside\
    \ more traditional infrastructure deployment for a little while. The long-lived\
    \ host, perhaps the host that needs to run on physical hardware, still has a role\
    \ in many organizations. As a result of these diverse management needs, combined\
    \ with the need to manage Docker, both Docker and configuration management tools\
    \ are likely to be deployed in the majority of organizations.\n\n### 1.5 Docker’s\
    \ technical components\n\nDocker can be run on any x64 host running a modern Linux\
    \ kernel; we recommend kernel version 3.10 and later. It has low overhead and\
    \ can be used on servers, desktops, or laptops. Run inside a virtual machine,\
    \ you can also deploy Docker on OS X and Microsoft Windows. It includes:\n\n*\
    \   A native Linux container format that Docker calls `libcontainer`.\n*   [Linux\
    \ kernel namespaces](http://lwn.net/Articles/531114/), which provide isolation\
    \ for filesystems, processes, and networks.\n    *   Filesystem isolation: each\
    \ container is its own root filesystem.\n    *   Process isolation: each container\
    \ runs in its own process environment.\n"
  raw: "You can also run your own private registry, and we’ll show you how to do that\
    \ in Chapter 4\\. This allows you to store images behind your firewall, which\
    \ may be a requirement for some organizations.\n\n### 1.2.4 Containers\n\nDocker\
    \ helps you build and deploy containers inside of which you can package your applications\
    \ and services. As we’ve just learned, containers are launched from images and\
    \ can contain one or more running processes. You can think about images as the\
    \ building or packing aspect of Docker and the containers as the running or execution\
    \ aspect of Docker.\n\nA Docker container is:\n\n*   An image format.\n\n*   A\
    \ set of standard operations.\n\n*   An execution environment.\n\nDocker borrows\
    \ the concept of the standard shipping container, used to transport goods globally,\
    \ as a model for its containers. But instead of shipping goods, Docker containers\
    \ ship software.\n\nEach container contains a software image – its ‘cargo’ – and,\
    \ like its physical counterpart, allows a set of operations to be performed. For\
    \ example, it can be created, started, stopped, restarted, and destroyed.\n\n\
    Like a shipping container, Docker doesn’t care about the contents of the container\
    \ when performing these actions; for example, whether a container is a web server,\
    \ a database, or an application server. Each container is loaded the same as any\
    \ other container.\n\nDocker also doesn’t care where you ship your container:\
    \ you can build on your laptop, upload to a registry, then download to a physical\
    \ or virtual server, test, deploy to a cluster of a dozen Amazon EC2 hosts, and\
    \ run. Like a normal shipping container, it is interchangeable, stackable, portable,\
    \ and as generic as possible.\n\nWith Docker, we can quickly build an application\
    \ server, a message bus, a utility appliance, a CI test bed for an application,\
    \ or one of a thousand other possible applications, services, and tools. It can\
    \ build local, self-contained test environments or replicate complex application\
    \ stacks for production or development purposes. The possible use cases are endless.\n\
    \n### 1.2.5 Compose and Swarm\n\nIn addition to solitary containers we can also\
    \ run Docker containers in stacks and clusters, what Docker calls swarms. The\
    \ Docker ecosystem contains two more tools:\n\n*   Docker Compose - which allows\
    \ you to run stacks of containers to represent application stacks, for example\
    \ web server, application server and database server containers running together\
    \ to serve a specific application.\n\n*   Docker Swarm - which allows you to create\
    \ clusters of containers, called swarms, that allow you to run scalable workloads.\n\
    \nWe’ll look at Docker Compose and Swarm in Chapter 7.\n\n## 1.3 What can you\
    \ use Docker for?\n\nSo why should you care about Docker or containers in general?\
    \ We’ve discussed briefly the isolation that containers provide; as a result,\
    \ they make excellent sandboxes for a variety of testing purposes. Additionally,\
    \ because of their ‘standard’ nature, they also make excellent building blocks\
    \ for services. Some of the examples of Docker running out in the wild include:\n\
    \n*   Helping make your local development and build workflow faster, more efficient,\
    \ and more lightweight. Local developers can build, run, and share Docker containers.\
    \ Containers can be built in development and promoted to testing environments\
    \ and, in turn, to production.\n\n*   Running stand-alone services and applications\
    \ consistently across multiple environments, a concept especially useful in service-oriented\
    \ architectures and deployments that rely heavily on micro-services.\n\n*   Using\
    \ Docker to create isolated instances to run tests like, for example, those launched\
    \ by a Continuous Integration (CI) suite like Jenkins CI.\n\n*   Building and\
    \ testing complex applications and architectures on a local host prior to deployment\
    \ into a production environment.\n\n*   Building a multi-user Platform-as-a-Service\
    \ (PAAS) infrastructure.\n\n*   Providing lightweight stand-alone sandbox environments\
    \ for developing, testing, and teaching technologies, such as the Unix shell or\
    \ a programming language.\n\n*   Software as a Service applications;\n\n*   Highly\
    \ performant, hyperscale deployments of hosts.\n\nYou can see a list of some of\
    \ the early projects built on and around the Docker ecosystem in the blog post\
    \ [here](http://blog.docker.com/2013/07/docker-projects-from-the-docker-community/).\n\
    \n## 1.4 Docker with configuration management\n\nSince Docker was announced, there\
    \ have been a lot of discussions about where Docker fits with configuration management\
    \ tools like Puppet and Chef. Docker includes an image-building and image-management\
    \ solution. One of the drivers for modern configuration management tools was the\
    \ response to [the “golden image” model](https://web.archive.org/web/20090207105003/http://madstop.com/2009/02/04/golden-image-or-foil-ball).\
    \ With golden images, you end up with massive and unmanageable image sprawl: large\
    \ numbers of (deployed) complex images in varying states of versioning. You create\
    \ randomness and exacerbate entropy in your environment as your image use grows.\
    \ Images also tend to be heavy and unwieldy. This often forces manual change or\
    \ layers of deviation and unmanaged configuration on top of images, because the\
    \ underlying images lack appropriate flexibility.\n\nCompared to traditional image\
    \ models, Docker is a lot more lightweight: images are layered, and you can quickly\
    \ iterate on them. There are some legitimate arguments to suggest that these attributes\
    \ alleviate many of the management problems traditional images present. It is\
    \ not immediately clear, though, that this alleviation represents the ability\
    \ to totally replace or supplement configuration management tools. There is amazing\
    \ power and control to be gained through the idempotence and introspection that\
    \ configuration management tools can provide. Docker itself still needs to be\
    \ installed, managed, and deployed on a host. That host also needs to be managed.\
    \ In turn, Docker containers may need to be orchestrated, managed, and deployed,\
    \ often in conjunction with external services and tools, which are all capabilities\
    \ that configuration management tools are excellent in providing.\n\nIt is also\
    \ apparent that Docker represents (or, perhaps more accurately, encourages) some\
    \ different characteristics and architecture for hosts, applications, and services:\
    \ they can be short-lived, immutable, disposable, and service-oriented. These\
    \ behaviors do not lend themselves or resonate strongly with the need for configuration\
    \ management tools. With these behaviors, you are rarely concerned with long-term\
    \ management of state, entropy is less of a concern because containers rarely\
    \ live long enough for it to be, and the recreation of state may often be cheaper\
    \ than the remediation of state.\n\nNot all infrastructure can be represented\
    \ with these behaviors, however. Docker’s ideal workloads will likely exist alongside\
    \ more traditional infrastructure deployment for a little while. The long-lived\
    \ host, perhaps also the host that needs to run on physical hardware, still has\
    \ a role in many organizations. As a result of these diverse management needs,\
    \ combined with the need to manage Docker itself, both Docker and configuration\
    \ management tools are likely to be deployed in the majority of organizations.\n\
    \n## 1.5 Docker’s technical components\n\nDocker can be run on any x64 host running\
    \ a modern Linux kernel; we recommend kernel version 3.10 and later. It has low\
    \ overhead and can be used on servers, desktops, or laptops. Run inside a virtual\
    \ machine, you can also deploy Docker on OS X and Microsoft Windows. It includes:\n\
    \n*   A native Linux container format that Docker calls `libcontainer`.\n\n* \
    \  [Linux kernel namespaces](http://lwn.net/Articles/531114/), which provide isolation\
    \ for filesystems, processes, and networks.\n\n    *   Filesystem isolation: each\
    \ container is its own root filesystem.\n\n    *   Process isolation: each container\
    \ runs in its own process environment."
