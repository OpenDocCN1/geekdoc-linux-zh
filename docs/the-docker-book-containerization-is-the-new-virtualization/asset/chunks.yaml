    We see that we’ve specified the `-H` flag to tell the client to which host it
    should connect. We could instead specify the host using the `DOCKER_HOST` environment
    variable if we didn’t want to specify the `-H` flag each time. We’ve also specified
    the `--tlsverify` flag, which enables our TLS connection to the Docker daemon.
    We don’t need to specify any certificate or key files, because Docker has automatically
    looked these up in our `~/.docker/` directory. If we did need to specify these
    files, we could with the `--tlscacert`, `--tlscert`, and `--tlskey` flags.


    So what happens if we don’t specify a TLS connection? Let’s try again now without
    the `--tlsverify` flag.


    ```

    $ sudo docker -H=docker.example.com:2376 info

    2014/04/13 17:50:03 malformed HTTP response "\x15\x03\x01\x00\x02\x02"

    ```


    Ouch. That’s not good. If you see an error like this, you know you’ve probably
    not enabled TLS on the connection, you’ve not specified the right TLS configuration,
    or you have an incorrect certificate or key.


    Assuming you’ve got everything working, you should now have an authenticated Docker
    connection!


    ## 8.6 Summary


    In this chapter, we’ve been introduced to the Docker Engine API. We’ve also seen
    how to secure the Docker Engine API via SSL/TLS certificates. We’ve explored the
    Docker API and how to use it to manage images and containers. We’ve also seen
    how to use one of the Docker API client libraries to rewrite our TProv application
    to directly use the Docker API.


    In the next and last chapter, we’ll look at how you can contribute to Docker.


    # 9 Getting help and extending Docker


    Docker is in its infancy – sometimes things go wrong. This chapter will talk about:


    *   How and where to get help.

    *   Contributing fixes and features to Docker.


    You’ll find out where to find Docker folks and the best way to ask for help. You’ll
    also learn how to engage with Docker’s developer community: there’s a huge amount
    of development effort surrounding Docker with hundreds of committers in the open-source
    community. If you’re excited by Docker, then it’s easy to make your own contribution
    to the project. This chapter will also cover the basics of contributing to the
    Docker project, how to build a Docker development environment, and how to create
    a good pull request.


    Note This chapter assumes some basic familiarity with Git, GitHub, and Go, but
    doesn’t assume you’re a fully fledged developer.


    ## 9.1 Getting help


    The Docker community is large and friendly. Most Docker folks congregate in three
    places:


    Note Docker, Inc. also sells enterprise support for Docker. You can find the information
    on the [Support](https://www.docker.com/support) page.


    ### 9.1.1 The Docker forums


    There is a [Docker forum](https://forums.docker.com/) available.


    ### 9.1.2 Docker on IRC


    The Docker community also has two strong IRC channels: `#docker` and `#docker-dev`.
    Both are on the [Freenode IRC network](http://freenode.net/).


    The `#docker` channel is generally for user help and general Docker issues, whereas
    `#docker-dev` is where contributors to Docker’s source code gather.


    You can find logs for `#docker` at [https://botbot.me/freenode/docker/](https://botbot.me/freenode/docker/)
    and for `#docker-dev` at [https://botbot.me/freenode/docker-dev/](https://botbot.me/freenode/docker-dev/).


    ### 9.1.3 Docker on GitHub


    Docker (and most of its components and ecosystem) is hosted on [GitHub](http://www.github.com).
    The principal repository for Docker itself is [https://github.com/docker/docker/](https://github.com/docker/docker/).


    Other repositories of note are:


    *   [distribution](https://github.com/docker/distribution) - The stand-alone Docker
    registry and distribution tools.

    *   [runc](https://github.com/opencontainers/runc) - The Docker container format
    and CLI tools.

    *   [Docker Swarm](https://github.com/docker/swarm) - Docker’s orchestration framework.

    *   [Docker Compose](https://github.com/docker/compose) - The Docker Compose tool.


    ## 9.2 Reporting issues for Docker


    Let’s start with the basics around submitting issues and patches and interacting
    with the Docker community. When reporting [issues](https://github.com/docker/docker/issues)
    with Docker, it’s important to be an awesome open-source citizen and provide good
    information that can help the community resolve your issue. When you log a ticket,
    please remember to include the following background information:


    *   The output of `docker info` and `docker version`.

    *   The output of `uname -a`.

    *   Your operating system and version (e.g., Ubuntu 16.04).


    Then provide a detailed explanation of your problem and the steps others can take
    to reproduce it.


    If you’re logging a feature request, carefully explain what you want and how you
    propose it might work. Think carefully about generic use cases: is your feature
    something that will make life easier for just you or for everyone?


    Please take a moment to check that an issue doesn’t already exist documenting
    your bug report or feature request. If it does, you can add a quick “+1” or “I
    have this problem”.


    ## 9.3 Setting up a build environment


    To make it easier to contribute to Docker, we’re going to show you how to build
    a development environment. The development environment provides all the required
    dependencies and build tooling to work with Docker.


    ### 9.3.1 Install Docker


    You must first install Docker in order to get a development environment. The development
    environment is a container in its own right. Use the steps from Chapter 2 to install
    Docker on your local host. You should install the most recent version of Docker.


    ### 9.3.2 Install source and build tools


    Next, you need to install Make and Git so that we can check out the source code
    and run the build process. The source code is stored on GitHub, and the build
    process is built around a `Makefile`.


    On Ubuntu, we install the `git` package.


    ```bash

    sudo apt-get -y install git make

    ```


    On Red Hat and derivatives we would do the following:


    ```bash

    sudo yum install git make

    ```


    ### 9.3.3 Check out the source


    Now let’s check out the Docker source code (or, if you’re working on another component,
    the relevant source code repository) and change into the resulting directory.
    The source code is stored in a repository called Moby, which is the codename for
    the broader ecosystem of Docker source code. It’s named this to reflect that components
    of Docker are used in a variety of different platforms, not just the Docker Engine.


    ```bash

    git clone https://github.com/moby/moby

    cd moby

    ```


    You can now work on the source code and fix bugs, update documentation, and write
    awesome features!


    ### 9.3.4 Contributing to the documentation


    One of the great ways anyone, even if you’re not a developer or skilled in Go,
    can contribute to Docker is to update, enhance, or develop new documentation.
    The Docker documentation lives on the [Docs website](http://docs.docker.com).
    The source documentation, the theme, and the tooling that generates this site
    are stored in the [Docker Docs repo on GitHub](https://github.com/docker/docker.github.io).


    You can find specific guidelines and a basic style guide for the documentation
    at:


    *   [https://github.com/docker/docker.github.io/blob/master/README.md](https://github.com/docker/docker.github.io/blob/master/README.md).


    You can build the documentation locally using Docker itself. Make any changes
    you want to the documentation, and then you can [stage the documentation locally](https://github.com/docker/docker.github.io#staging-the-docs)
    to review your changes.


    ### 9.3.5 Build the environment

