  trans: "\n\n注意 `docker stop` 命令向 Docker 容器的运行进程发送一个 `SIGTERM` 信号。如果你想更“果断”地停止容器，可以使用\
    \ `docker kill` 命令，它将向容器的进程发送 `SIGKILL` 信号。\n\n运行 `docker ps` 来检查已停止容器的状态。这里使用\
    \ `docker ps -n x` 标志非常有用，它可以显示最后 `x` 个正在运行或已停止的容器。\n\n## 3.14 容器自动重启\n\n如果你的容器因为故障而停止，你可以配置\
    \ Docker 使用 `--restart` 标志来重启它。`--restart` 标志会检查容器的退出码，并决定是否重启它。默认行为是完全不重启。\n\n\
    你可以在 `docker run` 命令中指定 `--restart` 标志。\n\n```\n$ sudo docker run --restart=always\
    \ --name daemon_alice -d ubuntu /bin/sh -c \"while true; do echo hello world;\
    \ sleep 1; done\"\n```\n\n在这个示例中，`--restart` 标志被设置为 `always`。无论返回什么种退出码，Docker\
    \ 都会尝试重启容器。或者，我们可以指定 `on-failure` 值，当容器以非零退出码退出时将重启容器。`on-failure` 标志还接受一个可选的重启次数。\n\
    \n```\n--restart=on-failure:5\n```\n\n如果收到非零退出码，这将最多尝试重启容器五次。\n\n注意 `–restart`\
    \ 标志是在 Docker 1.2.0 中引入的。\n\n## 3.15 更多关于我们容器的信息\n\n除了使用 `docker ps` 命令获取有关容器的信息外，我们还可以使用\
    \ `docker inspect` 命令获取多得信息。\n\n```\n$ sudo docker inspect daemon_alice\n[{\n\
    \  \"ID\": \"c2c4e57c12c4c142271c031333823af95d64b20b5d607970c334784430bcbd0f\"\
    ,\n  \"Created\": \"2014-05-10T11:49:01.902029966Z\",\n  \"Path\": \"/bin/sh\"\
    ,\n  \"Args\": [\n  \"-c\",\n  \"while true; do echo hello world; sleep 1; done\"\
    \n  ],\n  \"Config\": {\n    \"Hostname\": \"c2c4e57c12c4\",\n. . .\n```\n\n`docker\
    \ inspect` 命令将查询我们的容器并返回其配置信息，包括名称、命令、网络配置以及许多其他有用数据。\n\n我们还可以使用 `-f` 或 `--format`\
    \ 标志选择性地查询 inspect 结果哈希值。\n\n```\n$ sudo docker inspect --format='{{ .State.Running\
    \ }}' daemon_alice\ntrue\n```\n\n这将返回容器的运行状态，在我们案例中是 `true`。我们也可以获取像容器 IP 地址这样的有用信息。\n\
    \n```\n$ sudo docker inspect --format '{{ .NetworkSettings.IPAddress }}' daemon_alice\n\
    172.17.0.2\n```\n\n提示 `format` 标志比看起来要强大得多。你可以使用 Go 模板来格式化 `docker inspect` 的输出。例如，获取容器的\
    \ IP 地址：\n\n```bash\nsudo docker inspect --format '{{ .NetworkSettings.IPAddress\
    \ }}' daemon_alice\n```\n\n我们还可以使用模板来提取其他信息。例如，获取容器的运行状态：\n\n```bash\nsudo docker\
    \ inspect --format='{{ .State.Running }}' daemon_alice\n```\n\n## 3.16 删除容器\n\n\
    如果你已经完成了对某个容器的操作，可以使用 `rm` 命令删除它。从 Docker 1.2.0 开始，你还可以使用 `-f` 标志删除仍在运行的容器。\n\n\
    ## 3.17 总结\n\n我们现在学习了如何停止、杀死、重启和删除 Docker 容器。我们还学习了如何使用 `inspect` 获取容器的详细信息。在下一章中，我们将探索镜像和仓库。\n\
    \n# 4. 镜像操作\n\n在本章中，我们将探索 Docker 镜像：它们是什么、如何创建、如何修改以及如何共享。\n\n## 4.1 什么是镜像？\n\n\
    让我们继续 Docker 之之旅，学习更多关于镜像的知识。Docker 镜像由层堆叠的文件系统组成。最底层是一个引导文件系统 `bootfs`，它类似于典型的\
    \ Linux/Unix 启动磁盘。当容器启动后，它会被移动到内存中释放磁盘。\n\n到目前为止，这看起来非常像 Linux 虚拟化栈。事实上，Docker\
    \ 在引导文件系统之上又叠加了一个根文件系统 `rootfs`。这个 `rootfs` 可以是一个或多个操作系统（例如 Debian 或 Ubuntu）。\n\
    \n在更传统的 Linux 启动中，根文件系统以只读模式挂载，然后在启动后切换为读写。但在 Docker 世界中，根文件系统保持只读模式，Docker 利用了[合并挂载](https://en.wikipedia.org/wiki/Union_mount)在其之上添加更多的只读文件系统。合并挂载允许多个文件系统同时挂载，但看起来像是一个整体。\n\
    \nDocker 将这些文件系统中的每一个称为镜像（images）。镜像可以层层堆叠在一起。下面的镜像被称为父镜像，你可以遍历每一层，直到到达镜像栈的底部，那里最底的镜像被称为基础镜像。\n\
    \n"
