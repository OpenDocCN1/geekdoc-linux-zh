    首先，让我们确认我们是否拥有足够新的 Linux 内核。我们可以使用 `uname` 命令来完成这一点。\n\n```\n$ uname -a\nLinux\
    \ darknight.example.com 4.4.0-64-generic #85-Ubuntu SMP Mon Feb 20 11:50:30 UTC\
    \ 2017 x86_64 x86_64 x86_64 GNU/Linux\n```\n\n我们看到已经安装了 4.4.0 x86_64 内核。这是 Ubuntu\
    \ 16.04 及更高版本的默认内核。\n\n我们还想要安装 `linux-image-extra` 和 `linux-image-extra-virtual`\
    \ 包，这些包包含了 `aufs` 存储驱动程序。\n\n```\n$ sudo apt-get install linux-image-extra-$(uname\
    \ -r) linux-image-extra-virtual\n```\n\n如果我们使用的是早期版本的 Ubuntu，可能会有较旧的内核。我们应该可以通过\
    \ `apt-get` 将 Ubuntu 升级到较新的内核：\n\n```\n$ sudo apt-get update\n$ sudo apt-get install\
    \ linux-headers-3.16.0-34-generic linux-image-3.16.0-34-generic linux-headers-3.16.0-34\n\
    ```\n\n注意 在此书中，我们将使用 `sudo` 来提供所需的 `root` 权限。\n\n然后我们可以更新 Grub 引导加载程序以加载新内核。\n\
    \n```\n$ sudo update-grub\n```\n\n安装完成后，我们需要重启宿主机以启用新的 3.10 或更高版本的内核。\n\n```\n\
