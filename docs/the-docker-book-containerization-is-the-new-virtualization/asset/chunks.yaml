    \ `ubuntu`。在每个目录内部都有一个不同的 `Dockerfile`，分别包含 CentOS、Debian 或 Ubuntu 镜像的构建指令。这意味着每个启动的任务都将切换到所需操作系统的相应目录，基于该操作系统构建镜像，安装任何所需的先决条件，并启动一个基于该镜像的容器运行我们的测试。\n\
    \n让我们来看这些新 `Dockerfile` 示例之一。\n\n```docker\nFROM centos:latest\nLABEL maintainer=\"\
    james@example.com\"\nENV REFRESHED_AT 2016-06-01\nRUN yum -y install ruby rubygems\
    \ rubygem-rake\nRUN gem install --no-rdoc --no-ri rspec ci_reporter_rspec\n```\n\
    \n这是我们之前任务作为基础的 `Dockerfile` 的基于 CentOS 的变体。它基本上执行了与之前的 `Dockerfile` 相同的任务，但使用了如\
    \ `yum` 等适用于 CentOS 的命令来安装软件包。\n\n我们还将添加一个`发布 JUnit 测试结果报告`（Publish JUnit test\
    \ result report）的构建后操作，并指定我们 XML 输出的位置：`spec/reports/*.xml`。这将允许我们检查测试结果输出。\n\n\
    最后，我们点击`保存`（Save）创建新任务并保存建议的配置。\n\n我们现在可以看到新创建的任务，并注意到它包含一个名为`配置`（Configurations）的部分，该部分包含我们坐标轴上每个元素的子任务。\n\
    \n![我们的 Jenkins 多配置任务](img/00024.jpeg)\n\n我们的 Jenkins 多配置任务\n\n### 5.4.2 测试我们的多配置任务\n\
    \n现在我们来测试这个新任务。我们可以通过点击`立即构建`（Build Now）按钮启动启动新的多配置任务。当 Jenkins 运行时，它将创建一个主任务。这个主任务反过来将生成三个子任务，在我们选择的三个平台上的分别执行我们的测试。\n\
    \n注意：与我们之前的任务一样，第一次运行可能需要一些时间，因为它正在构建我们进行测试所需的镜像。但是，一旦构建完成，下次运行应该会快得多。只有当您更新了\
    \ `Dockerfile` 时，Docker 才会更改镜像。\n\n我们看到主任务首先执行，然后执行每个子任务。让我们来看其中一个子任务（即我们新的 `centos`\
    \ 任务）的输出。\n\n![centos 子任务。](img/00025.jpeg)\n\ncentos 子任务。\n\n我们看到它已经执行：绿色的球告诉我们执行成功了。我们可以深入查看它的执行过程以获取更多信息。为此，请点击`构建历史`（Build\
    \ History）中的 #1 条目。\n\n![centos 子任务详情。](img/00026.jpeg)\n\ncentos 子任务详情。\n\n在这里我们看到了执行的\
    \ `centos` 任务的更多细节。我们看到任务已`由上游项目 Docker_matrix_job 启动`，并且构建编号为 1。要查看运行期间发生的准确细节，我们可以通过点击`控制台输出`（Console\
    \ Output）链接检查控制台输出。\n\n![centos 子任务控制台输出。](img/00027.jpeg)\n\ncentos 子任务控制台输出。\n\
    \n我们看到任务克隆了仓库，构建了所需的 Docker 镜像，从该镜像启动了一个容器，然后运行了所需的测试。所有测试均成功通过（如果需要，我们也可以检查`测试结果`（Test\
    \ Result）链接查看已的 JUnit 测试结果）。\n\n我们现在已成功完成了一个简单但强大的应用程序多平台测试任务示例。\n\n### 5.4.3\
    \ 我们的多配置 Jenkins \n\n这些示例展示了 Jenkins CI 与 Docker 协作的简单实现。您可以增强所示的两个示例的许多额外功能，范围从自动触发的构建到使用平台、架构和版本组合的多级任务矩阵。我们的简单\
    \ Shell 构建步骤也可以以多种方式重写，使其更加复杂，或进一步支持多容器执行（例如，为 Web、数据库或应用层提供单独的容器以更好地模拟实际的多层生产级应用）。\n\
    \n## 5.5 其他替代方案\n\nDocker 生态系统中比较有趣的部分之一是持续集成和持续部署（CI/CD）。除了与 Jenkins 等现有工具集成外，我们还看到人们在\
    \ Docker 之上构建自己的工具和集成。\n\n### 5.5.1 Drone\n\n在 Docker 之上开发的、有前景的 CI/CD 工具之一是 [Drone](http://docs.drone.io/)。Drone\
    \ 是一个基于 SaaS 的持续集成平台，连接到 GitHub 和 Bitbucket。它可以运行各种语言（包括 Python、Node.js、Ruby、Go\
    \ 等）编写的测试套件。\n\n### 5.5.2 Shippable\n\nShippable 是一个针对 GitHub 和 Bitbucket 的免费托管持续集成和服务。它速度极快且轻量，并原生支持\
    \ Docker。\n\n## 5.6 总结\n\n在本章中，我们看到了如何将 Docker 作为开发工作流的核心部分。我们查看了工作站或机器上的开发为中心的测试。我们还探索了使用\
    \ Jenkins CI 作为我们的工具将测试扩展到持续集成模型。我们看到了如何用于点测试以及构建矩阵任务。\n\n# 6 使用 Docker 构建服务\n\
    \n在第 5 章中，我们看到了如何通过在本地工作流和持续集成环境中使用容器来促进测试。在本章中，我们将探索使用 Docker 运行生产服务。\n\n我们将首先构建一个简单的应用程序，然后构建一些复杂的容器应用程序。我们将探索如何利用网络和卷等\
    \ Docker 特性来组合和管理在 Docker 中运行的应用程序。\n\n"
- fmt: "\nLet’s start creating a new `Dockerfile` for our first image: the Jekyll\
    \ base image. Let’s create a new directory first and an empty `Dockerfile`.\n\n\
    ```\n$ mkdir jekyll\n$ cd jekyll\n$ vi Dockerfile\n```\n\nNow let’s populate our\
    \ `Dockerfile`.\n\n```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\
    \nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get -yqq update\nRUN apt-get -yqq install\
    \ ruby ruby-dev build-essential nodejs\nRUN gem install jekyll -v 2.5.3\n\nVOLUME\
    \ /data\nVOLUME /var/www/html\nWORKDIR /data\n\nENTRYPOINT [ \"jekyll\", \"build\"\
    , \"--destination=/var/www/html\" ]\n```\n\nOur `Dockerfile` uses the template\
    \ we saw in Chapter 3 as its basis. Our image is based on Ubuntu 16.04 and installs\
    \ Ruby and the prerequisites necessary to support Jekyll. It creates two volumes\
    \ using the `VOLUME` instruction:\n\n* `/data/`, which is going to hold our new\
    \ website source code.\n* `/var/www/html/`, which is going to hold our compiled\
    \ Jekyll site.\n\nWe also need to set the working directory to `/data/` and specify\
    \ an `ENTRYPOINT` instruction that will automatically build any Jekyll site it\
    \ finds in the `/data/` working directory into the `/var/www/html/` directory.\n\
    \n### 6.1.2 Building the Jekyll base image\n\nWith this `Dockerfile`, we will\
    \ now build an image from which we will launch containers. We’ll do this using\
    \ the `docker build` command.\n\n```\n$ sudo docker build -t jamtur01/jekyll .\n\
    Sending build context to Docker daemon  2.56 kB\nSending build context to Docker\
    \ daemon\nStep 0 : FROM ubuntu:16.04\n ---> 99ec81b80c55\nStep 1 : LABEL maintainer=\"\
    james@example.com\"\n. . .\nStep 7 : ENTRYPOINT [ \"jekyll\", \"build\" \"--destination=/var/www/html\"\
    \ ]\n ---> Running in 542e2de2029d\n ---> 79009691f408\nRemoving intermediate\
    \ container 542e2de2029d\nSuccessfully built 79009691f408\n```\n\nWe see that\
    \ we’ve built a new image with an ID of `79009691f408` named `jamtur01/jekyll`\
    \ that is our new Jekyll image. We view our new image using the `docker images`\
    \ command.\n\n```\n$ sudo docker images\nREPOSITORY      TAG    ID           \
    \ CREATED        SIZE\njamtur01/jekyll latest 79009691f408  6 seconds ago  12.29\
    \ kB (virtual 671 MB)\n. . .\n```\n\n### 6.1.3 The Apache image\n\nFinally, let’s\
    \ build our second image, an Apache server to serve out our new site. Let’s create\
    \ a new directory first and an empty `Dockerfile`.\n\n```\n$ mkdir apache\n$ cd\
    \ apache\n$ vi Dockerfile\n```\n\nNow let’s populate our `Dockerfile`.\n\n```\n\
    FROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-06-01\n\
    \nRUN apt-get -yqq update\nRUN apt-get -yqq install apache2\n\nVOLUME [ \"/var/www/html\"\
    \ ]\nWORKDIR /var/www/html\n\nENV APACHE_RUN_USER www-data\nENV APACHE_RUN_GROUP\
    \ www-data\nENV APACHE_LOG_DIR /var/log/apache2\nENV APACHE_PID_FILE /var/run/apache2.pid\n\
    ENV APACHE_RUN_DIR /var/run/apache2\nENV APACHE_LOCK_DIR /var/lock/apache2\n\n\
    RUN mkdir -p $APACHE_RUN_DIR $APACHE_LOCK_DIR $APACHE_LOG_DIR\n\nEXPOSE 80\n\n\
    ENTRYPOINT [ \"/usr/sbin/apache2\" ]\nCMD [\"-D\", \"FOREGROUND\"]\n```\n\nThis\
    \ final image is again based on Ubuntu 16.04 and installs Apache. It creates a\
    \ volume using the `VOLUME` instruction, `/var/www/html/`, which is going to hold\
    \ our compiled Jekyll website. We also set `/var/www/html` to be our working directory.\n\
    \nWe’ll then use some `ENV` instructions to set some required environment variables,\
    \ create some required directories, and `EXPOSE` port `80`. We’ve also specified\
    \ an `ENTRYPOINT` and `CMD` combination to run Apache by default when the container\
    \ starts.\n\n### 6.1.4 Building the Jekyll Apache image\n\nWith this `Dockerfile`,\
    \ we will now build an image from which we will launch containers. We do this\
    \ using the `docker build` command.\n\n```\n$ sudo docker build -t jamtur01/apache\
    \ .\nSending build context to Docker daemon  2.56 kB\nSending build context to\
    \ Docker daemon\nStep 0 : FROM ubuntu:16.04\n ---> 99ec81b80c55\nStep 1 : LABEL\
    \ maintainer=\"james@example.com\"\n ---> Using cache\n ---> c444e8ee0058\n. .\
    \ .\nStep 11 : CMD [\"-D\", \"FOREGROUND\"]\n ---> Running in 7aa5c127b41e\n --->\
    \ fc8e9135212d\nRemoving intermediate container 7aa5c127b41e\nSuccessfully built\
    \ fc8e9135212d\n```\n\nWe see that we’ve built a new image with an ID of `fc8e9135212d`\
    \ named `jamtur01/apache` that is our new Apache image. We view our new image\
    \ using the `docker images` command.\n\n```\n$ sudo docker images\nREPOSITORY\
    \      TAG    ID            CREATED        SIZE\njamtur01/apache latest fc8e9135212d\
    \  6 seconds ago  12.29 kB (virtual 671 MB)\n. . .\n```\n\n### 6.1.5 Launching\
    \ our Jekyll site\n\nNow we’ve got two images:\n\n* Jekyll - Our Jekyll image\
    \ with Ruby and the prerequisites installed.\n* Apache - The image that will serve\
    \ our compiled website via the Apache web server.\n\nLet’s get started on our\
    \ new site by creating a new Jekyll container using the `docker run` command.\
    \ We’re going to use `docker run` to create a container. We need some source code\
    \ for our blog.\n\n```\n$ cd $HOME\n$ git clone https://github.com/jekyll/jekyll.git\n\
    ```\n\nWe’ve started a new container `james_blog` and mounted our `james_blog`\
    \ directory inside the container as `/data`. The container has taken this source\
    \ code and built it into a compiled site.\n\n```\n$ sudo docker run -v /home/james/blog:/data\
    \ --name james_blog jamtur01/jekyll\n```\n\nWait, when we briefly introduced volumes\
    \ in Chapter 4 we discovered a bit about them. Let’s revisit that. A volume is\
    \ a specially designated directory within one or more containers that bypasses\
    \ the Union File System to provide several useful features for persistent or shared\
    \ data:\n\n* Volumes can be shared and reused between containers.\n* A container\
    \ doesn’t have to be running to share its volumes.\n* Changes to a volume are\
    \ made directly.\n* Changes to a volume will not be included when you update an\
    \ image.\n* Volumes persist even when no containers use them.\n\nThis allows you\
    \ to add data (e.g., source code, a database, or other content) into an image\
    \ without committing it to the image and allows you to share that data between\
    \ containers.\n\nVolumes live on your Docker host, in the `/var/lib/docker/volumes`\
    \ directory. You can identify the location of specific volumes using the `docker\
    \ inspect` command; for example:\n\n`docker inspect -f \"{{ range .Mounts }}{{.end}}\"\
    \ james_blog`\n\nTip In Docker 1.9 volumes have been expanded to also support\
    \ third-party storage systems like Ceph, Flocker and EMC via plugins. You can\
    \ read about them in the [volume plugins documentation](https://docs.docker.com/engine/extend/plugins_volume/)\
    \ and the [docker volume create command documentation.](https://docs.docker.com/engine/reference/commandline/volume_create/)\n\
    \nSo if we want to use our compiled site in the `/var/www/html/` volume from another\
    \ container, we can do so. To do this, we’ll create a new container that links\
    \ to this volume.\n\n```\n$ sudo docker run -d -P --volumes-from james_blog jamtur01/apache\n\
    09a570cc2267019352525079fbba9927806f782acb88213bd38dde7e2795407d\n```\n"
