    ## 3.7 Creating daemonized containers


    In addition to these interactive containers, we can create longer-running containers.
    Daemonized containers don’t have the interactive session we’ve just used and are
    ideal for running applications and services. Most of the containers you’re likely
    to run will probably be daemonized. Let’s start a daemonized container now.


    ```

    $ sudo docker run --name daemon_dave -d ubuntu /bin/sh -c "while true; do echo
    hello world; sleep 1; done"

    1333bb1a66af402138485fe44a335b382c09a887aa9f95cb9725e309ce5b7db3

    ```


    Here, we’ve used the `docker run` command with the `-d` flag to tell Docker to
    detach the container to the background.


    We’ve also specified a `while` loop as our container command. Our loop will echo
    `hello world` over and over again until the container is stopped or the process
    stops.


    With this combination of flags, you’ll see that, instead of being attached to
    a shell like our last container, the `docker run` command has instead returned
    a container ID and returned us to our command prompt. Now if we run `docker ps`,
    we see a running container.


    ```

    CONTAINER ID IMAGE    COMMAND              CREATED      STATUS  PORTS NAMES

    1333bb1a66af ubuntu   /bin/sh -c ''while tr 32 secs ago  Up 27         daemon_dave

    ```


    ## 3.8 Seeing what’s happening inside our container


    We now have a daemonized container running our `while` loop; let’s take a look
    inside the container and see what’s happening. To do so, we can use the `docker
    logs` command. The `docker logs` command fetches the logs of a container.


    ```

    $ sudo docker logs daemon_dave

    hello world

    hello world

    hello world

    hello world

    hello world

    hello world

    hello world

    . . .

    ```


    Here we see the results of our `while` loop echoing `hello world` to the logs.
    Docker will output the last few log entries and then return. We can also monitor
    the container’s logs much like the `tail -f` binary operates using the `-f` flag.


    ```

    $ sudo docker logs -f daemon_dave

    hello world

    hello world

    hello world

    hello world

    hello world

    hello world

    hello world

    . . .

    ```


    Tip Use `Ctrl-C` to exit from the log tail.


    You can also tail a portion of the logs of a container, again much like the `tail`
    command with the `-f` and `--tail` flags. For example, you can get the last ten
    lines of a log by using `docker logs --tail 10 daemon_dave`. You can also follow
    the logs of a container without having to read the whole log file with `docker
    logs --tail 0 -f daemon_dave`.


    To make debugging a little easier, we can also add the `-t` flag to prefix our
    log entries with timestamps.


    ```

    $ sudo docker logs -ft daemon_dave

    2016-08-02T03:31:16.743679596Z hello world

    2016-08-02T03:31:17.744769494Z hello world

    2016-08-02T03:31:18.745786252Z hello world

    2016-08-02T03:31:19.746839926Z hello world

    . . .

    ```


    Tip Again, use `Ctrl-C` to exit from the log tail.


    ## 3.9 Docker log drivers


    Since Docker 1.6 you can also control the logging driver used by your daemon and
    container. This is done using the `--log-driver` option. You can pass this option
    to both the daemon and the `docker run` command.


    There are a variety of options including the default `json-file` which provides
    the behavior we’ve just seen using the `docker logs` command.


    Also available is `syslog` which disables the `docker logs` command and redirects
    all container log output to Syslog. You can specify this with the Docker daemon
    to output all container logs to Syslog or override it using `docker run` to direct
    output from individual containers.


    ```

    $ sudo docker run --log-driver="syslog" --name daemon_dwayne -d ubuntu /bin/sh
    -c "while true; do echo hello world; sleep 1; done"

    . . .

    ```


    This will cause the `daemon_dwayne` container to log to Syslog and result in the
    `docker logs` command showing no output.


    Lastly, also available is `none`, which disables all logging in containers and
    results in the `docker logs` command being disabled.


    Tip Additional logging drivers continue to be added. Docker 1.8 introduced support
    for [Graylog’s GELF protocol](https://www.graylog.org/centralize-your-docker-container-logging-with-graylog-native-integration/),
    [Fluentd](http://blog.treasuredata.com/blog/2015/08/03/5-use-cases-docker-fluentd/)
    and a log rotation driver.


    ## 3.10 Inspecting the container’s processes


    In addition to the container’s logs we can also inspect the processes running
    inside the container. To do this, we use the `docker top` command.


    ```

    $ sudo docker top daemon_dave

    ```


    We can then see each process (principally our `while` loop), the user it is running
    as, and the process ID.


    ```

    PID  USER COMMAND

    977  root /bin/sh -c while true; do echo hello world; sleep 1; done

    1123 root sleep 1

    ```


    ## 3.11 Docker statistics


    In addition to the `docker top` command you can also use the `docker stats` command.
    This shows statistics for one or more running Docker containers. Let’s see what
    these look like. We’re going to look at the statistics for our `daemon_dave` and
    `daemon_dwayne` containers.


    ```

    $ sudo docker stats daemon_dave daemon_dwayne

    CONTAINER     CPU %  MEM USAGE/LIMIT  MEM %  NET I/O         BLOCK I/O

    daemon_dave   0.14%  212 KiB/994 MiB  0.02%  5.062 KiB/648 B 1.69 MB / 0 B

    daemon_dwayne 0.11%  216 KiB/994 MiB  0.02%  1.402 KiB/648 B 24.43 MB / 0 B

    ```


    We see a list of daemonized containers and their CPU, memory and network and storage
    I/O performance and metrics. This is useful for quickly monitoring a group of
    containers on a host.


    Note The `docker stats` command was introduced in Docker 1.5.0.


    ## 3.12 Running a process inside an already running container


    Since Docker 1.3 we can also run additional processes inside our containers using
    the `docker exec` command. There are two types of commands we can run inside a
    container: background and interactive. Background tasks run inside the container
    without interaction and interactive tasks remain in the foreground. Interactive
    tasks are useful for tasks like opening a shell inside a container. Let’s look
    at an example of a background task.


    ```

    $ sudo docker exec -d daemon_dave touch /etc/new_config_file

    ```


    Here the `-d` flag indicates we’re running a background process. We then specify
    the name of the container to run the command inside and the command to be executed.
    In this case our command will create a new empty file called `/etc/new_config_file`
    inside our `daemon_dave` container. We can use a `docker exec` background command
    to run maintenance, monitoring or management tasks inside a running container.


    Tip Since Docker 1.7 you can use the `-u` flag to specify a new process owner
    for `docker exec` launched processes.


    We can also run interactive tasks like opening a shell inside our `daemon_dave`
    container.


    ```

    $ sudo docker exec -t -i daemon_dave /bin/bash

    ```


    The `-t` and `-i` flags, like the flags used when running an interactive container,
    create a TTY and capture `STDIN` for our executed process. We then specify the
    name of the container to run the command inside and the command to be executed.
    In this case our command will create a new `bash` session inside the container
    `daemon_dave`. We could then use this session to issue other commands inside our
    container.


    Note The `docker exec` command was introduced in Docker 1.3 and is not available
    in earlier releases. For earlier Docker releases you should see the `nsenter`
    command explained in Chapter 6.


    ## 3.13 Stopping a daemonized container


    If we wish to stop our daemonized container, we can do it with the `docker stop`
    command, like so:


    ```

    $ sudo docker stop daemon_dave

    ```


    or again via its container ID.


    ```

    $ sudo docker stop c2c4e57c12c4

    ```'
