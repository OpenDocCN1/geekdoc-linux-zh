  trans: "\n但我们的集群尚未达到法定人数（quorum），记得我们之前告诉过 `-bootstrap-expect` 预期有 3 个节点。现在，让我们在\
    \ `moe` 上启动最后一个 agent。\n\n```\nmoe$ sudo docker run -d -h $HOSTNAME \\\n-p 8300:8300\
    \ -p 8301:8301 \\\n-p 8301:8301/udp -p 8302:8302 \\\n-p 8302:8302/udp -p 8400:8400\
    \ \\\n-p 8500:8500 -p 53:53/udp \\\n--name moe_agent jamtur01/consul \\\n-server\
    \ -advertise $PUBLIC_IP -join $JOIN_IP\n```\n\n我们的 `docker run` 命令基本上与在 `curly`\
    \ 上运行的命令相同。但这次我们的集群中有三个 agent。现在，如果我们查看容器的日志，将会看到一个完整的集群。\n\n```\nmoe$ sudo docker\
    \ logs moe_agent\n==> Starting Consul agent...\n==> Starting Consul agent RPC...\n\
    ==> Joining cluster...\n    Join completed. Synced with 1 initial agents\n==>\
    \ Consul agent running!\n         Node name: 'moe'\n        Datacenter: 'dc1'\n\
    \            Server: true (bootstrap: false)\n       Client Addr: 0.0.0.0 (HTTP:\
    \ 8500, HTTPS: -1, DNS: 53, RPC: 8400)\n      Cluster Addr: 159.203.191.16 (LAN:\
    \ 8301, WAN: 8302)\n    Gossip encrypt: false, RPC-TLS: false, TLS-Incoming: false\n\
    \             Atlas: <disabled>\n\n==> Log data will now stream in as it occurs:\n\
    \n. . .\n\n2016/08/06 12:39:14 [ERR] agent: failed to sync remote state: No cluster\
    \ leader\n2016/08/06 12:39:15 [INFO] consul: New leader elected: larry\n2016/08/06\
    \ 12:39:16 [INFO] agent: Synced service 'consul'\n```\n\n我们从容器日志中看到 `moe` 已经加入集群。这使得\
    \ Consul 达到了预期的集群成员数量并触发了领导选举。在这种情况下，`larry` 被选为集群领导。\n\n我们在 `larry` 的 Consul\
    \ 日志中也能看到最后一个 agent 加入的结果。\n\n```\n2016/08/06 12:39:14 [INFO] consul: Attempting\
