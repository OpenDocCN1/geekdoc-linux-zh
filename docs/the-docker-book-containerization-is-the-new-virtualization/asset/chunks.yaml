    \ containers.\n\n*   Resource isolation and grouping: resources like CPU and memory\
    \ are allocated individually to each Docker container using the [cgroups](http://en.wikipedia.org/wiki/Cgroups),\
    \ or control groups, kernel feature.\n\n*   [Copy-on-write](http://en.wikipedia.org/wiki/Copy-on-write):\
    \ filesystems are created with copy-on-write, meaning they are layered and fast\
    \ and require limited disk usage.\n\n*   Logging: `STDOUT`, `STDERR` and `STDIN`\
    \ from the container are collected, logged, and available for analysis or trouble-shooting.\n\
    \n*   Interactive shell: You can create a pseudo-tty and attach to `STDIN` to\
    \ provide an interactive shell to your container.\n\n## 1.6 What’s in the book?\n\
    \nIn this book, we walk you through installing, deploying, managing, and extending\
    \ Docker. We do that by first introducing you to the basics of Docker and its\
    \ components. Then we start to use Docker to build containers and services to\
    \ perform a variety of tasks.\n\nWe take you through the development life cycle,\
    \ from testing to production, and see where Docker fits in and how it can make\
    \ your life easier. We make use of Docker to build test environments for new projects,\
    \ demonstrate how to integrate Docker with continuous integration workflow, and\
    \ then how to build application services and platforms. Finally, we show you how\
    \ to use Docker’s API and how to extend Docker yourself.\n\nWe teach you how to:\n\
    \n*   Install Docker.\n\n*   Take your first steps with a Docker container.\n\n\
    *   Build Docker images.\n\n*   Manage and share Docker images.\n\n*   Run and\
    \ manage more complex Docker containers and stacks of Docker containers.\n\n*\
    \   Deploy Docker containers as part of your testing pipeline.\n\n*   Build multi-container\
    \ applications and environments.\n\n*   Introduce the basics of Docker orchestration\
    \ with Docker Compose, Consul, and Swarm.\n\n*   Explore the Docker API.\n\n*\
    \   Getting Help and Extending Docker.\n\nIt is recommended that you read through\
    \ every chapter. Each chapter builds on your Docker knowledge and introduces new\
    \ features and functionality. By the end of the book you should have a solid understanding\
    \ of how to work with Docker to build standard containers and deploy applications,\
    \ test environments, and standalone services.\n\n## 1.7 Docker resources\n\n*\
    \   [Docker homepage](http://www.docker.com/)\n\n*   [Docker Hub](http://hub.docker.com)\n\
    \n*   [Docker blog](http://blog.docker.com/)\n\n*   [Docker documentation](http://docs.docker.com/)\n\
    \n*   [Docker Getting Started Guide](https://docs.docker.com/docker-for-mac/)\n\
    \n*   [Docker code on GitHub](https://github.com/docker/docker)\n\n*   [Docker\
    \ Forge](https://github.com/dockerforge) - collection of Docker tools, utilities,\
    \ and services.\n\n*   [Docker mailing list](https://groups.google.com/forum/#!forum/docker-user)\n\
    \n*   [The Docker Forum](https://forums.docker.com/)\n\n*   Docker on IRC: irc.freenode.net\
    \ and channel #docker\n\n*   [Docker on Twitter](http://twitter.com/docker)\n\n\
    *   Get [Docker help](http://stackoverflow.com/search?q=docker) on StackOverflow\n\
    \nIn addition to these resources in Chapter 9 you’ll get a detailed explanation\
    \ of where and how to get help with Docker.\n\n# 2 Installing Docker\n\nInstalling\
    \ Docker is quick and easy. Docker is currently supported on a wide variety of\
    \ Linux platforms, including shipping as part of Ubuntu and Red Hat Enterprise\
    \ Linux (RHEL). Also supported are various derivative and related distributions\
    \ like Debian, CentOS, Fedora, Oracle Linux, and many others. Using a virtual\
    \ environment, you can install and run Docker on OS X and Microsoft Windows.\n\
    \nCurrently, the Docker team recommends deploying Docker on Ubuntu, Debian or\
    \ the RHEL family (CentOS, Fedora, etc) hosts and makes available packages that\
    \ you can use to do this. In this chapter, I’m going to show you how to install\
    \ Docker in four different but complementary environments:\n\n*   On a host running\
    \ Ubuntu.\n\n*   On a host running Red Hat Enterprise Linux or derivative distribution.\n\
    \n*   On OS X using [Docker for Mac](https://docs.docker.com/docker-for-mac/).\n\
    \n*   On Microsoft Windows using [Docker for Windows](https://docs.docker.com/docker-for-windows/).\n\
    \nTip Docker for Mac and Docker for Windows are a collection of components that\
    \ installs everything you need to get started with Docker. It includes a tiny\
    \ virtual machine shipped with a wrapper script to manage it. The virtual machine\
    \ runs the daemon and provides a local Docker daemon on OS X and Microsoft Windows.\
    \ The Docker client binary, `docker`, is installed natively on these platforms\
    \ and connected to the Docker daemon running in the virtual machine. It replaces\
    \ the legacy Docker Toolbox and Boot2Docker.\n\nDocker runs on a number of other\
    \ platforms, including Debian, [SUSE](https://docs.docker.com/engine/installation/linux/suse/),\
    \ [Arch Linux](https://docs.docker.com/engine/installation/linux/archlinux/),\
    \ [CentOS](https://docs.docker.com/engine/installation/linux/centos/), and [Gentoo](https://docs.docker.com/engine/installation/linux/gentoolinux/).\
    \ It’s also supported on several Cloud platforms including Amazon EC2, Rackspace\
    \ Cloud, and Google Compute Engine.\n\nTip You can find a full list of installation\
    \ targets in the [Docker installation guide](https://docs.docker.com/engine/installation/).\n\
    \nI’ve chosen these four methods because they represent the environments that\
    \ are most commonly used in the Docker community. For example, your developers\
    \ and sysadmins may wish to start with building Docker containers on their OS\
    \ X or Windows workstations using Docker for Mac or Windows and then promote these\
    \ containers to a testing, staging, or production environment running one of the\
    \ other supported platforms.\n\nI recommend you step through at least the Ubuntu\
    \ or the RHEL installation to get an idea of Docker’s prerequisites and an understanding\
    \ of how to install it.\n\nTip As with all installation processes, I also recommend\
    \ you look at using tools like [Puppet](http://www.puppetlabs.com) or [Chef](http://www.opscode.com)\
    \ to install Docker rather than using a manual process. For example, you can find\
    \ a Puppet module to install Docker [here](https://docs.docker.com/engine/admin/puppet/)\
    \ and a Chef cookbook [here](https://supermarket.chef.io/cookbooks/docker).\n\n\
    ## 2.1 Requirements\n\nFor all of these installation types, Docker has some basic\
    \ prerequisites. To use Docker you must:\n\n*   Be running a 64-bit architecture\
    \ (currently x86_64 and amd64 only). 32-bit architectures are **NOT** currently\
    \ supported.\n\n*   Be running a Linux 3.10 or later kernel. Some earlier kernels\
    \ from 2.6.x and later will run Docker successfully. Your results will greatly\
    \ vary, though, and if you need support you will often be asked to run on a more\
    \ recent kernel.\n\n*   The kernel must support an appropriate storage driver.\
    \ For example,\n\n    *   [Device Mapper](http://en.wikipedia.org/wiki/Device_mapper)\n\
    \n    *   [AUFS](http://en.wikipedia.org/wiki/Aufs)\n\n    *   [vfs](http://en.wikipedia.org/wiki/Virtual_file_system)\n\
    \n    *   [btrfs](http://en.wikipedia.org/wiki/Btrfs)\n\n    *   [ZFS](https://en.wikipedia.org/wiki/ZFS)\
    \ (introduced in Docker 1.7)\n\n    *   The default storage driver is usually\
    \ Device Mapper or AUFS.\n\n*   [cgroups](http://en.wikipedia.org/wiki/Cgroups)\
    \ and [namespaces](https://en.wikipedia.org/wiki/Cgroups#NAMESPACE-ISOLATION)\
    \ kernel features must be supported and enabled.\n\n## 2.2 Installing on Ubuntu\
    \ and Debian\n\nInstalling Docker on Ubuntu and Debian is currently officially\
    \ supported on a selection of releases:\n\n*   Ubuntu Yakkety 16.10 (64-bit)\n\
    \n*   Ubuntu Xenial 16.04 (64-bit)\n\n*   Ubuntu Trusty 14.04 (LTS) (64-bit)\n\
    \n*   Debian Stretch (64-bit)\n\n*   Debian 8.0 Jessie (64-bit)\n\n*   Debian\
    \ 7.7 Wheezy (64-bit)"
