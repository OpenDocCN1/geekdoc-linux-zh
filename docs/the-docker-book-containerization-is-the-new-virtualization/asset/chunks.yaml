    ,\n  \"Args\": [\n  \"-c\",\n  \"while true; do echo hello world; sleep 1; done\"\
    \n  ],\n  \"Config\": {\n    \"Hostname\": \"c2c4e57c12c4\",\n. . .\n```\n\nThe\
    \ `docker inspect` command will interrogate our container and return its configuration\
    \ information, including names, commands, networking configuration, and a wide\
    \ variety of other useful data.\n\nWe can also selectively query the inspect results\
    \ hash using the `-f` or `--format` flag.\n\n```\n$ sudo docker inspect --format='{{\
    \ .State.Running }}' daemon_alice\ntrue\n```\n\nThis will return the running state\
    \ of the container, which in our case is `true`. We can also get useful information\
    \ like the container’s IP address.\n\n```\n$ sudo docker inspect --format '{{\
    \ .NetworkSettings.IPAddress }}' daemon_alice\n172.17.0.2\n```\n\nTip The `format`\
    \ flag is more powerful than it seems. You can use Go templates to format the\
    \ output of `docker inspect`. For example, to get the IP address of a container:\n\
    \n```bash\nsudo docker inspect --format '{{ .NetworkSettings.IPAddress }}' daemon_alice\n\
    ```\n\nWe can also use templates to extract other information. For example, to\
    \ get the running state of a container:\n\n```bash\nsudo docker inspect --format='{{\
    \ .State.Running }}' daemon_alice\n```\n\n## 3.16 Deleting a container\n\nIf you\
    \ are finished with a container, you can delete it using the `rm` command. Since\
    \ Docker 1.2.0, you can also delete a container that is still running using the\
    \ `-f` flag.\n\n## 3.17 Summary\n\nWe’ve now learned how to stop, kill, restart,\
    \ and delete Docker containers. We’ve also learned how to use `inspect` to get\
    \ detailed information about our containers. In the next chapter, we’ll explore\
    \ images and registries.\n\n# 4. Working with images\n\nIn this chapter, we’re\
    \ going to explore Docker images: what they are, how to create, how to modify,\
    \ and how to share.\n\n## 4.1 What is an image?\n\nLet’s continue our journey\
    \ with Docker by learning more about images. A Docker image is made up of filesystems\
    \ layered over each other. At the base is a boot filesystem, `bootfs`, which resembles\
    \ the typical Linux/Unix boot disk. When a container has booted, it is moved into\
    \ memory to free up the disk.\n\nSo far this looks pretty much like a Linux virtualization\
    \ stack. Indeed, Docker next layers a root filesystem, `rootfs`, on top of the\
    \ boot filesystem. This `rootfs` can be one or more operating systems (e.g., Debian\
    \ or Ubuntu).\n\nIn a more traditional Linux boot, the root filesystem is mounted\
    \ read-only and then switched to read-write after boot. In the Docker world, however,\
    \ the root filesystem stays in read-only mode, and Docker takes advantage of a\
    \ [union mount](https://en.wikipedia.org/wiki/Union_mount) to add more read-only\
    \ filesystems onto it. A union mount is a mount that allows several filesystems\
    \ to be mounted at one time but appear to be one.\n\nDocker calls each of these\
    \ filesystems images. Images can be layered on top of one another. The image below\
    \ is called the parent image and you can traverse each layer until you reach the\
    \ bottom of the image stack where the final image is called the base image. Finally,\
    \ when a container is launched from an image, Docker mounts a read-write filesystem\
    \ on top of any layers below. This is where whatever processes we want our Docker\
    \ container to run will execute.\n"
  raw: "Note The `docker stop` command sends a `SIGTERM` signal to the Docker container’s\
    \ running process. If you want to stop a container a bit more enthusiastically,\
    \ you can use the `docker kill` command, which will send a `SIGKILL` signal to\
    \ the container’s process.\n\nRun `docker ps` to check the status of the now-stopped\
    \ container. Useful here is the `docker ps -n x` flag which shows the last `x`\
    \ containers, running or stopped.\n\n## 3.14 Automatic container restarts\n\n\
    If your container has stopped because of a failure you can configure Docker to\
    \ restart it using the `–restart` flag. The `--restart` flag checks for the container’s\
    \ exit code and makes a decision whether or not to restart it. The default behavior\
    \ is to not restart containers at all.\n\nYou specify the `--restart` flag with\
    \ the `docker run` command.\n\n```\n$ sudo docker run --restart=always --name\
    \ daemon_alice -d ubuntu /bin/sh -c \"while true; do echo hello world; sleep 1;\
    \ done\"\n```\n\nIn this example the `--restart` flag has been set to `always`.\
    \ Docker will try to restart the container no matter what exit code is returned.\
    \ Alternatively, we can specify a value of `on-failure` which restarts the container\
    \ if it exits with a non-zero exit code. The `on-failure` flag also accepts an\
    \ optional restart count.\n\n```\n--restart=on-failure:5\n```\n\nThis will attempt\
    \ to restart the container a maximum of five times if a non-zero exit code is\
    \ received.\n\nNote The `–restart` flag was introduced in Docker 1.2.0.\n\n##\
    \ 3.15 Finding out more about our container\n\nIn addition to the information\
    \ we retrieved about our container using the `docker ps` command, we can get a\
    \ whole lot more information using the `docker inspect` command.\n\n```\n$ sudo\
    \ docker inspect daemon_alice\n[{\n  \"ID\": \"c2c4e57c12c4c142271c031333823af95d64b20b5d607970c334784430bcbd0f\"\
    ,\n  \"Created\": \"2014-05-10T11:49:01.902029966Z\",\n  \"Path\": \"/bin/sh\"\
    ,\n  \"Args\": [\n  \"-c\",\n  \"while true; do echo hello world; sleep 1; done\"\
    \n  ],\n  \"Config\": {\n    \"Hostname\": \"c2c4e57c12c4\",\n. . .\n```\n\nThe\
    \ `docker inspect` command will interrogate our container and return its configuration\
    \ information, including names, commands, networking configuration, and a wide\
    \ variety of other useful data.\n\nWe can also selectively query the inspect results\
    \ hash using the `-f` or `--format` flag.\n\n```\n$ sudo docker inspect --format='{{\
    \ .State.Running }}' daemon_alice\ntrue\n```\n\nThis will return the running state\
    \ of the container, which in our case is `true`. We can also get useful information\
    \ like the container’s IP address.\n\n```\n$ sudo docker inspect --format '{{\
    \ .NetworkSettings.IPAddress }}' daemon_alice\n172.17.0.2\n```\n\nTip The `–format`\
    \ or `-f` flag is a bit more than it seems on the surface. It’s actually a full\
    \ Go template being exposed. You can make use of all [the capabilities of a Go\
    \ template](http://golang.org/pkg/text/template/) when querying it.\n\nWe can\
    \ also list multiple containers and receive output for each.\n\n```\n$ sudo docker\
    \ inspect --format '{{.Name}} {{.State.Running}}' \\\ndaemon_dave daemon_alice\n\
    /daemon_dave true\n/daemon_alice true\n```\n\nWe can select any portion of the\
    \ inspect hash to query and return.\n\nNote In addition to inspecting containers,\
    \ you can see a bit more about how Docker works by exploring the `/var/lib/docker`\
    \ directory. This directory holds your images, containers, and container configuration.\
    \ You’ll find all your containers in the `/var/lib/docker/containers` directory.\n\
    \n## 3.16 Deleting a container\n\nIf you are finished with a container, you can\
    \ delete it using the `docker rm` command.\n\nNote Since Docker 1.6.2 you can\
    \ delete a running Docker container using the `-f` flag to the `docker rm` command.\
    \ Prior to this version you must stop the container first using the `docker stop`\
    \ command or `docker kill` command.\n\n```\n$ sudo docker rm 80430f8d0921\n80430f8d0921\n\
    ```\n\nThere isn’t currently a way to delete all containers, but you can slightly\
    \ cheat with a command like the following:\n\n```\n$ sudo docker rm -f `sudo docker\
    \ ps -a -q`\n```\n\nThis command will list all of the current containers using\
    \ the `docker ps` command. The `-a` flag lists all containers, and the `-q` flag\
    \ only returns the container IDs rather than the rest of the information about\
    \ your containers. This list is then passed to the `docker rm` command, which\
    \ deletes each container. The `-f` flag force removes any running containers.\
    \ If you’d prefer to protect those containers, omit the flag.\n\n## 3.17 Summary\n\
    \nWe’ve now been introduced to the basic mechanics of how Docker containers work.\
    \ This information will form the basis for how we’ll learn to use Docker in the\
    \ rest of the book.\n\nIn the next chapter, we’re going to explore building our\
    \ own Docker images and working with Docker repositories and registries.\n\n#\
    \ 4 Working with Docker images and repositories\n\nIn Chapter 2, we learned how\
    \ to install Docker. In Chapter 3, we learned how to use a variety of commands\
    \ to manage Docker containers, including the `docker run` command.\n\nLet’s see\
    \ the `docker run` command again.\n\n```\n$ sudo docker run -i -t --name another_container_mum\
    \ ubuntu \\\n/bin/bash\nroot@b415b317ac75:/#\n```\n\nThis command will launch\
    \ a new container called `another_container_mum` from the `ubuntu` image and open\
    \ a Bash shell.\n\nIn this chapter, we’re going to explore Docker images: the\
    \ building blocks from which we launch containers. We’ll learn a lot more about\
    \ Docker images, what they are, how to manage them, how to modify them, and how\
    \ to create, store, and share your own images. We’ll also examine the repositories\
    \ that hold images and the registries that store repositories.\n\n## 4.1 What\
    \ is a Docker image?\n\nLet’s continue our journey with Docker by learning a bit\
    \ more about Docker images. A Docker image is made up of filesystems layered over\
    \ each other. At the base is a boot filesystem, `bootfs`, which resembles the\
    \ typical Linux/Unix boot filesystem. A Docker user will probably never interact\
    \ with the boot filesystem. Indeed, when a container has booted, it is moved into\
    \ memory, and the boot filesystem is unmounted to free up the RAM used by the\
    \ `initrd` disk image.\n\nSo far this looks pretty much like a typical Linux virtualization\
    \ stack. Indeed, Docker next layers a root filesystem, `rootfs`, on top of the\
    \ boot filesystem. This `rootfs` can be one or more operating systems (e.g., a\
    \ Debian or Ubuntu filesystem).\n\nIn a more traditional Linux boot, the root\
    \ filesystem is mounted read-only and then switched to read-write after boot and\
    \ an integrity check is conducted. In the Docker world, however, the root filesystem\
    \ stays in read-only mode, and Docker takes advantage of a [union mount](http://en.wikipedia.org/wiki/Union_mount)\
    \ to add more read-only filesystems onto the root filesystem. A union mount is\
    \ a mount that allows several filesystems to be mounted at one time but appear\
    \ to be one filesystem. The union mount overlays the filesystems on top of one\
    \ another so that the resulting filesystem may contain files and subdirectories\
    \ from any or all of the underlying filesystems.\n\nDocker calls each of these\
    \ filesystems images. Images can be layered on top of one another. The image below\
    \ is called the parent image and you can traverse each layer until you reach the\
    \ bottom of the image stack where the final image is called the base image. Finally,\
    \ when a container is launched from an image, Docker mounts a read-write filesystem\
    \ on top of any layers below. This is where whatever processes we want our Docker\
    \ container to run will execute.\n\nThis sounds confusing, so perhaps it is best\
    \ represented by a diagram.\n\n![The Docker filesystem layers](images/00004.jpeg)\n\
    \nThe Docker filesystem layers\n\nWhen Docker first starts a container, the initial\
    \ read-write layer is empty. As changes occur, they are applied to this layer;\
    \ for example, if you want to change a file, then that file will be copied from\
    \ the read-only layer below into the read-write layer. The read-only version of\
    \ the file will still exist but is now hidden underneath the copy."
