    \ hostname of the container. This overrides the default behavior (setting the\
    \ hostname of the container to the short container ID) and allows us to specify\
    \ our own hostname. We’ll use this to ensure that our container is given a hostname\
    \ of `redis_primary` and will thus be resolved that way with local DNS.\n\nWe’ve\
    \ specified the `--name` flag to ensure that our container’s name is `redis_primary`\
    \ and we’ve specified the `--net` flag to run the container in the `express` network.\
    \ We’re going to use this network for our container connectivity, as we’ll see\
    \ shortly.\n\nLet’s see what the `docker logs` command can tell us about our Redis\
