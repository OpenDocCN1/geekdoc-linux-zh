    #### 4.5.10.3 WORKDIR


    `WORKDIR` 指令提供了一种设置容器工作目录以及从镜像启动容器时执行的 `ENTRYPOINT` 和/或 `CMD` 的方法。


    '
- fmt: '

    We can use it to set the working directory for a series of instructions or for
    the final container. For example, to set the working directory for a specific
    instruction we might:


    ```bash

    WORKDIR /opt/webapp/db

    RUN bundle install

    WORKDIR /opt/webapp

    ENTRYPOINT [ "rackup" ]

    ```


    Here we’ve changed into the `/opt/webapp/db` directory to run `bundle install`
    and then changed into the `/opt/webapp` directory prior to specifying our `ENTRYPOINT`
    instruction of `rackup`.


    You can override the working directory at runtime with the `-w` flag, for example:


    ```bash

    $ sudo docker run -ti -w /var/log ubuntu pwd

    /var/log

    ```


    This will set the container’s working directory to `/var/log`.


    ## 4.5.10.4 ENV


    The `ENV` instruction is used to set environment variables during the image build
    process. For example:


    ```bash

    ENV RVM_PATH /home/rvm/

    ```


    This new environment variable will be used for any subsequent `RUN` instructions,
    as if we had specified an environment variable prefix to a command like so:


    ```bash

    RUN gem install unicorn

    ```


    would be executed as:


    ```bash

    RVM_PATH=/home/rvm/ gem install unicorn

    ```


    You can specify single environment variables in an `ENV` instruction or since
    Docker 1.4 you can specify multiple variables like so:


    ```bash

    ENV RVM_PATH=/home/rvm RVM_ARCHFLAGS="-arch i386"

    ```


    We can also use these environment variables in other instructions.


    ```bash

    ENV TARGET_DIR /opt/app

    WORKDIR $TARGET_DIR

    ```


    Here we’ve specified a new environment variable, `TARGET_DIR`, and then used its
    value in a `WORKDIR` instruction. Our `WORKDIR` instruction would now be set to
    `/opt/app`.


    **Note**- You can also escape environment variables when needed by prefixing them
    with a backslash.


    These environment variables will also be persisted into any containers created
    from your image. So, if we were to run the `env` command in a container built
    with the `ENV RVM_PATH /home/rvm/` instruction we’d see:


    ```bash

    root@bf42aadc7f09:~# env

    . . .

    RVM_PATH=/home/rvm/

    . . .

    ```


    You can also pass environment variables on the `docker run` command line using
    the `-e` flag. These variables will only apply at runtime, for example:


    ```bash

    $ sudo docker run -ti -e "WEB_PORT=8080" ubuntu env

    HOME=/

    PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin/bin

    HOSTNAME=792b171c5e9f

    TERM=xterm

    WEB_PORT=8080

    ```


    Now our container has the `WEB_PORT` environment variable set to `8080`.


    ## 4.5.10.5 USER


    The `USER` instruction specifies a user that the image should be run as; for example:


    ```bash

    USER nginx

    ```


    This will cause containers created from the image to be run by the `nginx` user.
    We can specify a username or a UID and group or GID. Or even a combination thereof,
    for example:


    ```bash

    USER user

    USER user:group

    USER uid

    USER uid:gid

    USER user:gid

    USER uid:group

    ```


    You can also override this at runtime by specifying the `-u` flag with the `docker
    run` command.


    **Tip**- The default user if you don’t specify the `USER` instruction is `root`.


    ## 4.5.10.6 VOLUME


    The `VOLUME` instruction adds volumes to any container created from the image.
    A volume is a specially designated directory within one or more containers that
    bypasses the Union File System to provide several useful features for persistent
    or shared data:


    - Volumes can be shared and reused between containers.

    - A container doesn’t have to be running to share its volumes.

    - Changes to a volume are made directly.

    - Changes to a volume will not be included when you update an image.

    - Volumes persist even if no containers use them.


    This allows us to add data (like source code), a database, or other content into
    an image without committing it to the image and allows us to share that data between
    containers. This can be used to do testing with containers and an application’s
    code, manage logs, or handle databases inside a container. We’ll see examples
    of this in Chapters 5 and 6.


    You can use the `VOLUME` instruction like so:


    ```bash

    VOLUME ["/opt/project"]

    ```


    This would attempt to create a mount point `/opt/project` to any container created
    from the image.


    **Tip**- Also useful and related is the `docker cp` command. This allows you to
    copy files to and from your containers. You can read about it in the [Docker command
    line documentation](https://docs.docker.com/engine/reference/commandline/cp/).


    Or we can specify multiple volumes by specifying an array:


    ```bash

    VOLUME ["/opt/project", "/data" ]

    ```


    **Tip**- We’ll see a lot more about volumes and how to use them in Chapters 5
    and 6. If you’re curious you can read more about volumes [in the Docker volumes
    documentation](https://docs.docker.com/storage/volumes/).


    ## 4.5.10.7 ADD


    The `ADD` instruction adds files and directories from our build environment into
    our image; for example, when installing an application. The `ADD` instruction
    specifies a source and a destination for the files, like so:


    ```bash

    ADD software.lic /opt/application/software.lic

    ```


    This `ADD` instruction will copy the file `software.lic` from the build directory
    to `/opt/application/software.lic` in the image. The source of the file can be
    a URL, filename, or directory as long as it is inside the build context or environment.
    You cannot `ADD` files from outside the build directory or context.


    When `ADD`ing files Docker uses the ending character of the destination to determine
    what the source is. If the destination ends in a `/`, then it considers the source
    a directory. If it doesn’t end in a `/`, it considers the source a file.


    The source of the file can also be a URL; for example:


    ```bash

    ADD http://wordpress.org/latest.zip /root/wordpress.zip

    ```


    Lastly, the `ADD` instruction has some special magic for taking care of local
    `tar` archives. If a `tar` archive (valid archive types include gzip, bzip2, xz)
    is specified as the source file, then Docker will automatically unpack it for
    you:


    ```bash

    ADD latest.tar.gz /var/www/wordpress/

    ```


    This will unpack the `latest.tar.gz` archive into the `/var/www/wordpress/` directory.
    The archive is unpacked with the same behavior as running `tar` with the `-x`
    option: the output is the union of whatever exists in the destination plus the
    contents of the archive. If a file or directory with the same name already exists
    in the destination, it will not be overwritten.


    **Warning**- Currently this will not work with a tar archive specified in a URL.
    This is somewhat inconsistent behavior and may change in a future release.


    Finally, if the destination doesn’t exist, Docker will create the full path for
    us, including any directories. New files and directories will be created with
    a mode of 055 and a UID and GID of 0.


    **Note**- It’s also important to note that the build cache can be invalidated
    by `ADD` instructions. If the files or directories added by an `ADD` instruction
    change then this will invalidate the cache for all following instructions in the
    `Dockerfile`.


    ## 4.5.10.8 COPY


    The `COPY` instruction is closely related to the `ADD` instruction. The key difference
    is that the `COPY` instruction is purely focused on copying local files from the
    build context and does not have any extraction or decompression capabilities.


    ```bash

    COPY conf.d/ /etc/apache2/

    ```


    This will copy files from the `conf.d` directory to the `/etc/apache2/` directory.


    The source of the files must be the path to a file or directory relative to the
    build context, the local source directory in which your `Dockerfile` resides.
    You cannot copy anything that is outside of this directory, because the build
    context is uploaded to the Docker daemon, and the copy takes place there. Anything
    outside of the build context is not available. The destination should be an absolute
    path inside the container.


    Any files and directories created by the copy will have a UID and GID of 0.

