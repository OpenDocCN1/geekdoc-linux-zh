- fmt: "\nIf you want to contribute to Docker Engine, you can now use `make` and Docker\
    \ to build the development environment. The Docker source code ships with a `Dockerfile`\
    \ that we use to install all the build and runtime dependencies necessary to build\
    \ and test Docker.\n\n```bash\n$ cd moby\n$ sudo make build\n```\n\nTip This command\
    \ will take some time to complete when you first execute it. It might require\
    \ a host with at least 2Gb of RAM to also run the development build.\n\nThis command\
    \ will create a full, running Docker development environment. It will upload the\
    \ current source directory as build context for a Docker image, build the image\
    \ containing Go and any other required dependencies, and then launch a container\
    \ from this image.\n\nUsing this development image, we also create a Docker binary\
    \ to test any fixes or features. We do this using the `make` tool again.\n\n```bash\n\
    $ sudo make binary\n```\n\nThis command will create a `docker` and `dockerd` binary\
    \ in a volume at `./bundles/<version>-dev/binary-client/` and `./bundles/<version>-dev/binary-daemon/`\
    \ respectively. For example, we would create a client binary and associated checksums\
    \ like so:\n\n```bash\n$ ls -l bundles/1.13.0-dev/binary-client/\ntotal 15344\n\
    lrwxrwxrwx 1 root root       17 Aug  9 13:59 docker -> docker-1.13.0-dev\n-rwxr-xr-x\
    \ 1 root root 15700192 Aug  9 13:59 docker-1.13.0-dev\n-rw-r--r-- 1 root root\
    \       52 Aug  9 13:59 docker-1.13.0-dev.md5\n-rw-r--r-- 1 root root       84\
    \ Aug  9 13:59 docker-1.13.0-dev.sha256\n```\n\nYou can then use this binary for\
    \ live testing by running it instead of the local Docker daemon. To do so, we\
    \ need to stop Docker and run this new binary instead.\n\n```bash\n$ sudo service\
    \ docker stop\n$ ~/moby/bundles/1.13.0-dev/binary-daemon/dockerd\n```\n\nThis\
    \ will run the development Docker daemon interactively. You can also background\
    \ the daemon if you wish.\n\nWe can then test the `docker` binary by running it\
    \ against this daemon.\n\n```bash\n$ ~/moby/bundles/1.13.0-dev/binary-client/docker\
    \ version\nClient:\n Version:      1.13.0-dev\n API version:  1.25\n Go version:\
    \   go1.6.3\n Git commit:   04e021d\n Built:        Tue Aug  9 13:58:52 2016\n\
    \ OS/Arch:      linux/amd64\n\nServer:\n Version:      1.13.0-dev\n API version:\
    \  1.25\n Go version:   go1.6.3\n Git commit:   04e021d\n Built:        Tue Aug\
    \  9 13:58:52 2016\n OS/Arch:      linux/amd64\n```\n\nYou can see that we’re\
    \ running a `1.13.0-dev` client, this binary, against the `1.13.0-dev` daemon\
    \ we just started. You can use this combination to test and ensure any changes\
    \ you’ve made to the Docker source are working correctly.\n\n### 9.3.6 Running\
    \ the tests\n\nIt’s also important to ensure that all of the Docker tests pass\
    \ before contributing code back upstream. To execute all the tests, you need to\
    \ run this command:\n\n```bash\n$ sudo make test\n```\n\nThis command will again\
    \ upload the current source as build context to an image and then create a development\
    \ image. A container will be launched from this image, and the test will run inside\
    \ it. Again, this may take some time for the initial build.\n\nIf the tests are\
    \ successful, then the end of the output should look something like this:\n\n\
    ```\n. . .\n[PASSED]: save - save a repo using stdout\n[PASSED]: load - load a\
    \ repo using stdout\n[PASSED]: save - save a repo using -o\n[PASSED]: load - load\
    \ a repo using -i\n[PASSED]: tag - busybox -> testfoobarbaz\n[PASSED]: tag - busybox's\
    \ image ID -> testfoobarbaz\n[PASSED]: tag - busybox fooo/bar\n[PASSED]: tag -\
    \ busybox fooaa/test\n[PASSED]: top - sleep process should be listed in non privileged\
    \ mode\n[PASSED]: top - sleep process should be listed in privileged mode\n[PASSED]:\
    \ version - verify that it works and that the output is properly formatted\nPASS\n\
    PASS    github.com/docker/docker/integration-cli    178.685s\n```\n\nTip You can\
    \ use the `$TESTFLAGS` environment variable to pass in arguments to the test run.\n\
    \n### 9.3.7 Use Docker inside our development environment\n\nYou can also launch\
    \ an interactive session inside the newly built development container:\n\n```bash\n\
    $ sudo make shell\n```\n\nTo exit the container, type `exit` or `Ctrl-D`.\n\n\
    ### 9.3.8 Submitting a pull request\n\nIf you’re happy with your documentation\
    \ update, bug fix, or new feature, you can submit a pull request for it on GitHub.\
    \ To do so, you should fork the Docker repository and make changes on your fork\
    \ in a feature branch:\n\n- If it is a bug fix, name it `XXXX-something` where\
    \ `XXXX` is the issue number.\n- If it is a feature, name it `XXXX-something`\
    \ where `XXXX` is the issue number.\n\nYou should always run the test suite before\
    \ submitting a pull request. We have some other simple rules that will help your\
    \ pull request reviewed quickly:\n\nLastly, the Docker project uses a Developer\
    \ Certificate of Origin to verify that you wrote any code you submit or otherwise\
    \ have the right to pass it as an open-source patch. You can read about why we\
    \ do this at [http://blog.docker.com/2014/01/docker-contributions-require-certificate-of-origin/](http://blog.docker.com/2014/01/docker-contributions-require-certificate-of-origin/).\
    \ The certificate is easy to apply. All you need to do is add a line to each Git\
    \ commit message.\n\n```\nDocker-DCO-1.1-Signed-off-by: Joe Smith <joe.smith@email.com>\
    \ (github: github_handle)\n```\n\nNote You must use your real name. We do not\
    \ allow pseudonyms or anonymous contributions for legal reasons.\n\nThere are\
    \ several small exceptions to the signing requirement. Currently these are:\n\n\
    - Your patch fixes spelling or grammar errors.\n- Your patch is a single-line\
    \ change to documentation contained in the Documentation repository.\n- Your patch\
    \ fixes Markdown formatting or syntax errors in the documentation contained in\
    \ the Documentation repository.\n\nIt’s also pretty easy to automate the signing\
    \ of your Git commits using the `git commit -s` command.\n\nNote The signing script\
    \ expects to find your GitHub user name in `git config --get github.user`. You\
    \ can set this option with the `git config --set github.user username` command.\n\
    \n### 9.3.9 Merge approval and maintainers\n\nOnce you’ve submitted your pull\
    \ request, it will be reviewed, and you will potentially receive feedback. Docker\
    \ uses a maintainer system much like the Linux kernel. Each component inside Docker\
    \ is managed by one or more maintainers who are responsible for ensuring the quality,\
    \ stability, and direction of that component.\n"
