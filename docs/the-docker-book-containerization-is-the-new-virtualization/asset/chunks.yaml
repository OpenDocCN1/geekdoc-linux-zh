- fmt: '

    Tip If we add a new dependency or require another package to run our tests, all
    we’ll need to do is update this `Dockerfile` with the new requirements, and the
    image will be automatically rebuilt when the tests are run.


    Here we’re building an Ubuntu host, installing Ruby and `RubyGems`, and then installing
    two gems: `rspec` and `ci_reporter_rspec`. This will build an image that we can
    test using a typical Ruby-based application that relies on the RSpec test framework.
    The `ci_reporter_rspec` gem allows RSpec output to be converted to JUnit-formatted
    XML that Jenkins can consume. We’ll see the results of this conversion shortly.


    Back to our script. We’re building an image from this `Dockerfile`. Next, we’re
    creating a new environment variable called `$MNT` using the `$WORKSPACE` variable.
    This is a variable, created by Jenkins, holding the workspace directory we defined
    earlier in our job. This is where our Git repository containing the code we want
    to test is going to be checked out to, and it is this directory we’re going to
    mount into our Docker container. We can then execute our tests from this checkout.


    Next we create a container from our image and run the tests. Inside this container,
    we’ve mounted our workspace via a volume to the `/opt/project` directory. When
    the container runs, we’re executing a command that changes into this directory
    tree and executes the `rake spec` command, which actually runs our RSpec tests.


    Now we’ve got a started container and we’ve grabbed the container ID.


    Tip Docker also comes with a command line option called `–cidfile` that captures
    the container’s ID and stores it in a file specified in the `–cidfile` options,
    like so: `–cidfile=/tmp/containerid.txt`.


    Whilst the container is running, we want to attach to that container to get the
    output from it using the `docker attach` command. and then use the `docker wait`
    command. This will echo the test output into our Jenkins job. Finally, the `docker
    wait` command blocks until the command the container is executing finishes and
    then returns the exit code of the container. The `RC` variable captures the exit
    code from the container when it completes.


    Finally, we clean up and delete the container we’ve just created and exit with
    the container’s exit code. This should be the exit code of our test run. Jenkins
    relies on this exit code to tell it if a job’s tests have run successfully or
    failed.


    Next we click the `Add post-build action` and add `Publish JUnit test result report`.
    In the `Test report XMLs`, we need to specify `spec/reports/*.xml`; this is the
    location of the `ci_reporter` gem’s XML output, and locating it will allow Jenkins
    to consume our test history and output.


    Finally, we must click the `Save` button to save our new job.


    ![Jenkins job details part 2.](images/00018.jpeg)


    Jenkins job details part 2.


    ### 5.3.3 Running our Jenkins job


    We now have our Jenkins job, so let’s run it. We’ll do this by clicking the `Build
    Now` button; a job will appear in the `Build History` box.


    ![Running the Jenkins job.](images/00019.jpeg)


    Running the Jenkins job.


    Note The first time the tests run, it’ll take a little longer because Docker is
    building our new image. The next time you run the tests, however, it’ll be much
    faster, as Docker will already have the required image prepared.


    We’ll click on this job to get details of the test run we’re executing.


    ![The Jenkins job details.](images/00020.jpeg)


    The Jenkins job details.


    We can click on `Console Output` to see the commands that have been executed as
    part of the job.


    ![The Jenkins job console output.](images/00021.jpeg)


    The Jenkins job console output.


    We see that Jenkins has downloaded our Git repository to the workspace. We can
    then execute our Shell script and build a Docker image using the `docker build`
    command. Then, we’ll capture the image ID and use it to build a new container
    using the `docker run` command. Running this new container executes the RSpec
    tests and captures the results of the tests and the exit code. If the job exits
    with an exit code of `0`, then the job will be marked as successful.


    You can also view the precise test results by clicking the `Test Result` link.
    This will have captured the RSpec output of our tests in JUnit form. This is the
    output that the `ci_reporter` gem produces and our After Build step captures.


    ### 5.3.4 Next steps with our Jenkins job


    We can also automate our Jenkins job further by [enabling SCM polling](https://wiki.jenkins-ci.org/display/JENKINS/Building+a+software+project#Buildingasoftwareproject-Configuringautomaticbuilds),
    which triggers automatic builds when new commits are made to the repository. Similar
    automation can be achieved with a post-commit hook or via a GitHub or Bitbucket
    repository hook.


    ### 5.3.5 Summary of our Jenkins setup


    We’ve achieved a lot so far: we’ve installed Jenkins, run it, and created our
    first job. This Jenkins job uses Docker to create an image that we can manage
    and keep updated using the `Dockerfile` contained in our repository. In this scenario,
    not only does our infrastructure configuration live with our code, but managing
    that configuration becomes a simple process. Containers are then created (from
    that image) in which we then run our tests. When we’re done with the tests, we
    can dispose of the containers.


    Tip You could also use [parameterized builds](https://wiki.jenkins-ci.org/display/JENKINS/Parameterized+Build)
    to make this job more generic.


    ## 5.4 Multi-configuration Jenkins


    We’ve now seen a simple single container build using Jenkins. What if we wanted
    to test our application on multiple platforms? Let’s say we’d like to test it
    on Ubuntu, Debian, and CentOS. To do that, we can take advantage of a job type
    called a “multi-configuration job” that allows a matrix of test jobs to be run.


    ### 5.4.1 Create a multi-configuration job


    Let’s look at creating our multi-configuration job. Click on the `New Item` link
    from the Jenkins console. We’re going to name our new job `Docker_matrix_job`,
    select `Multi-configuration project`, and click `OK`.


    ![Creating a multi-configuration job.](images/00022.jpeg)


    Creating a multi-configuration job.


    We’ll see a screen that is similar to the job creation screen we saw earlier.
    Let’s add a description for our job, select `Git` as our repository type, and
    specify our sample repository: `https://github.com/turnbullpress/docker-jenkins-sample.git`.


    Next, let’s scroll down and configure our multi-configuration axis. The axis is
    the list of matrix elements that we’re going to execute as part of the job. We’ll
    click the `Add Axis` button and select `User-defined Axis`. We’re going to specify
    an axis named `OS` (which will be short for operating system) and specify three
    values: `centos`, `debian`, and `ubuntu`. When we execute our multi-configuration
    job, Jenkins will look at this axis and spawn three jobs: one for each point on
    the axis.


    Then, in the `Build Environment` section, we click `Delete workspace before build
    starts`. This option cleans up our build environment by deleting the checked-out
    repository prior to initiating a new set of jobs.


    ![Configuring a multi-configuration job Part 2.](images/00023.jpeg)


    Configuring a multi-configuration job Part 2.


    Lastly, we’ve specified another shell build step with a simple shell script. It’s
    a modification of the shell script we used earlier.

