    ## 5.4 Multi-configuration Jenkins


    We’ve now seen a simple, single container build using Jenkins. What if we wanted
    to test our application on multiple platforms? Let’s say we’d like to test it
    on Ubuntu, Debian, and CentOS. To do that, we can take advantage of a Jenkins
    job type called a “multi-configuration job” that allows a matrix of test jobs
    to be run. When the Jenkins multi-configuration job is run, it will spawn multiple
    sub-jobs that will test varying configurations.


    ### 5.4.1 Create a multi-configuration job


