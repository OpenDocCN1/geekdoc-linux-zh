  trans: "\n\n- 网络隔离：在容器之间分离虚拟接口和 IP 地址划分。\n- 资源隔离与分组：使用 [cgroups](http://en.wikipedia.org/wiki/Cgroups)（即控制组）内核功能，将\
    \ CPU 和内存等资源单独分配给每个 Docker 容器。\n- [写时复制](http://en.wikipedia.org/wiki/Copy-on-write)：文件系统采用写时复制机制创建，这意味着它们是分层的、快速的，并且对磁盘占用有限。\n\
    - 日志：收集来自容器的 `STDOUT`、`STDERR` 和 `STDIN` 并进行记录，以供分析或故障排除使用。\n- 交互式 shell：你可以创建一个伪终端并附加到\
    \ `STDIN`，从而为你的容器提供一个交互式 shell。\n\n## 1.6 本书中包含哪些内容？\n\n在本书中，我们将引导你完成 Docker 的安装、部署、管理和扩展。我们将通过首先介绍\
    \ Docker 的基础知识及其组件来实现目标。然后，我们将开始使用 Docker 构建容器和服务，以执行各种任务。\n\n我们将带你了解从测试到生产的开发生命周期，看看\
    \ Docker 处于何种位置以及它如何让你的生活变得更轻松。我们将利用 Docker 为新项目构建测试环境，演示如何将 Docker 与持续集成工作流相结合，然后介绍如何构建应用服务平台。最后，我们将向你展示如何使用\
    \ Docker 的 API 以及如何自己扩展 Docker。\n\n我们将教你如何：\n\n- 安装 Docker。\n- 开启 Docker 容器的第一步。\n\
    - 构建 Docker 镜像。\n- 管理和共享 Docker 镜像。\n- 运行和管理复杂的 Docker 容器和容器栈。\n- 作为测试流水线的一部分部署\
    \ Docker 容器。\n- 构建多容器应用和环境。\n- 使用 Docker Compose、Consul 和 Swarm 介绍 Docker 协调的基础知识。\n\
    - 探索 Docker API。\n- 获取帮助和扩展 Docker。\n\n建议阅读每一章。每一章都将在你 Docker 知识的基础上进行构建，并引入新的特性和功能。到本书结束时，你应该对如何使用\
    \ Docker 构建标准容器以及部署应用程序、测试环境和独立服务有坚固的理解。\n\n## 1.7 Docker 资源\n\n- [Docker 首页](http://www.docker.com/)\n\
    - [Docker Hub](http://hub.docker.com)\n- [Docker 博客](http://blog.docker.com/)\n\
    - [Docker 文档](http://docs.docker.com/)\n- [Docker 入门指南](https://docs.docker.com/docker-for-mac/)\n\
    - GitHub 上的 Docker 代码](https://github.com/docker/docker)\n- [Docker Forge](https://github.com/dockerforge)\
    \ - Docker 工具、实用程序和服务集合。\n- [Docker 邮件列表](https://groups.google.com/forum/#!forum/docker-user)\n\
    - [Docker 论坛](https://forums.docker.com/)\n- IRC 上的 Docker：`irc.freenode.net`\
    \ 和频道 `#docker`\n- Twitter 上的 Docker](http://twitter.com/docker)\n- 获取 [Docker\
    \ 帮助](http://stackoverflow.com/search?q=docker)\n\n除了第 9 章中的这些资源外，你还将获得关于在哪里以及如何获取\
    \ Docker 帮助的详细说明。\n\n# 2 安装 Docker\n\n安装 Docker 快速又简单。Docker 目前支持多种 Linux 平台，包括作为\
    \ Ubuntu 和红帽企业 Linux (RHEL) 的一部分提供。此外还支持各种派生和相关发行版，如 Debian、CentOS、Fedora、Oracle\
    \ Linux 等。使用虚拟环境，你可以在 OS X 和 Microsoft Windows 上安装并运行 Docker。\n\n目前，Docker 团队建议在\
    \ Ubuntu、Debian 或 RHEL 家族（CentOS、Fedora 等）主机上部署 Docker，并提供了你可以用于此的包。在本章中，我将向你如何在四个不同但互补环境中安装\
    \ Docker：\n\n- 在运行 Ubuntu 的主机上。\n- 在运行红帽企业 Linux 或派生发行版主机上。\n- 在使用 [Docker for\
    \ Mac](https://docs.docker.com/docker-for-mac/) 的 OS X 上。\n- 在使用 [Docker for Windows](https://docs.docker.com/docker-for-windows/)\
    \ 的 Microsoft Windows 上。\n\n提示 Docker for Mac 和 Docker for Windows 是一系列组件，包含了你启动\
    \ Docker 所需的所有内容。它包含一个带有管理脚本的微型虚拟机。该虚拟机运行守护进程，并在 OS X 和 Microsoft Windows 上提供本地\
    \ Docker 守护进程。Docker 客户端二进制文件 `docker` 原生安装在这些平台上，并连接到运行在虚拟机中的 Docker 守护进程。它取代了旧的\
    \ Docker Toolbox 和 Boot2Docker。\n\nDocker 运行在许多其他平台上，包括 Debian、[SUSE](https://docs.docker.com/engine/installation/linux/suse/)、[Arch\
    \ Linux](https://docs.docker.com/engine/installation/linux/archlinux/)、[CentOS](https://docs.docker.com/engine/installation/linux/centos/)\
    \ 和 [Gentoo](https://docs.docker.com/engine/installation/linux/gentoolinux/)。它还支持多个云平台，包括\
    \ Amazon EC2、Rackspace Cloud 和 Google Compute Engine。\n\n提示 你可以在 [Docker 安装指南](https://docs.docker.com/engine/installation/)\
    \ 中找到安装目标的完整列表。\n\n我选择这四方法是因为它们代表了 Docker 社区中最常用的环境。例如，你的开发者和系统管理员可能希望从在 OS X\
    \ 或 Windows 上构建容器开始，然后将这些容器推广到测试、阶段或生产环境。我建议你至少通过 Ubuntu 或 RHEL 的安装步骤来了解。\n\n\
    提示对于所有的安装过程，我都建议使用 [Puppet](http://www.puppetlabs.com) 或 [Chef](http://opscode.com)\
    \ 等工具来安装 Docker，而不是手动安装。例如，你可以从这里找到 Puppet 模块](https://docs.docker.com/admin/puppet/)\
    \ 和从这里找到 Chef Recipe](https://cookbooks/docker)。\n\n## 2.1 要求\n\n对于所有这些安装类型，Docker\
    \ 都有一些基本前提。要使用 Docker 你必须：\n\n- 运行 64 位架构（目前仅支持 x86_64 和 amd64）。不支持 32 位架构。\n\
    - 运行 3.10 或更高版本的 Linux 内核。较早的 2.6 内也能成功运行 Docker。\n- 内核必须支持适当的存储驱动。例如\n    - [Device\
    \ Mapper](http://en.wikipedia.org/wiki/Device_mapper)\n    - [AUFS](http://en.wikipedia.org/wiki/Aufs)\n\
    \    - [vfs](http://en.wikipedia.org/wiki/Virtual_file_system)\n    - [btrfs](http://en.wikipedia.org/wiki/Btrfs)\n\
    \    - [ZFS](https://en.wikipedia.org/wiki/ZFS)（Docker 1.7 引入）\n    - 默认存储驱动通常是\
    \ Device Mapper 或 AUFS。\n- [cgroups](http://en.wikipedia.org/wiki/Cgroups) 和 [namespaces](https://en.wikipedia.org/wiki/Cgroups#NAMESPACE-ISOLATION)\
    \ 内核功能必须受并启用。\n\n## 2.2 在 Ubuntu 和 Debian 上安装\n\n在 Ubuntu 和 Debian 上安装 Docker\
    \ 目前官方支持某些版本：\n\n- Ubuntu Yakkety 16.10 (64 位)\n- Ubuntu Xenial 16.04 (64 位)\n\
    - Ubuntu Trusty 14.04 (LTS) (64 位)\n- Debian Stretch (64 位)\n- Debian 8.0 Jessie\
    \ (64 位)\n- Debian 7.7 Wheezy (64 位)\n\n"
- fmt: "\nNote This is not to say Docker won’t work on other Ubuntu (or Debian) versions\
    \ that have appropriate kernel levels and the additional required support. They\
    \ just aren’t officially supported, so any bugs you encounter may result in a\
    \ WONTFIX.\n\nTo begin our installation, we first need to confirm we’ve got all\
    \ the required prerequisites. I’ve created a brand new Ubuntu 16.04 LTS 64-bit\
    \ host on which to install Docker. We’re going to call that host `darknight.example.com`.\n\
    \n### 2.2.1 Checking for prerequisites\n\nDocker has a small but necessary list\
    \ of prerequisites required to install and run on Ubuntu hosts.\n\n#### 2.2.1.1\
    \ Kernel\n\nFirst, let’s confirm we’ve got a sufficiently recent Linux kernel.\
    \ We can do this using the `uname` command.\n\n```\n$ uname -a\nLinux darknight.example.com\
    \ 4.4.0-64-generic #85-Ubuntu SMP Mon Feb 20 11:50:30 UTC 2017 x86_64 x86_64 x86_64\
    \ GNU/Linux\n```\n\nWe see that we’ve got a 4.4.0 x86_64 kernel installed. This\
    \ is the default for Ubuntu 16.04 and later.\n\nWe also want to install the `linux-image-extra`\
    \ and `linux-image-extra-virtual` packages that contain the `aufs` storage driver.\n\
    \n```\n$ sudo apt-get install linux-image-extra-$(uname -r) linux-image-extra-virtual\n\
    ```\n\nIf we’re using an earlier release of Ubuntu we may have an earlier kernel.\
    \ We should be able to upgrade our Ubuntu to the later kernel via `apt-get`:\n\
    \n```\n$ sudo apt-get update\n$ sudo apt-get install linux-headers-3.16.0-34-generic\
    \ linux-image-3.16.0-34-generic linux-headers-3.16.0-34\n```\n\nNote Throughout\
    \ this book we’re going to use `sudo` to provide the required `root` privileges.\n\
    \nWe can then update the Grub boot loader to load our new kernel.\n\n```\n$ sudo\
    \ update-grub\n```\n\nAfter installation, we’ll need to reboot our host to enable\
    \ the new 3.10 or later kernel.\n\n```\n$ sudo reboot\n```\n\nAfter the reboot,\
    \ we can then check that our host is running the right version using the same\
    \ `uname -a` command we used above.\n\n### 2.2.2 Installing Docker\n\nNow we’ve\
    \ got everything we need to add Docker to our host. To install Docker, we’re going\
    \ to use the Docker team’s DEB packages.\n\nFirst, we need to install some prerequisite\
    \ packages.\n\n```\nsudo apt-get install \\\n    apt-transport-https \\\n    ca-certificates\
    \ \\\n    curl \\\n    software-properties-common\n```\n\nThen add the official\
    \ Docker GPG key.\n\n```\n$ curl -fsSL https://download.docker.com/linux/ubuntu/gpg\
    \ | sudo apt-key add -\n```\n\nAnd then add the Docker APT repository. You may\
    \ be prompted to confirm that you wish to add the repository and have the repository’s\
    \ GPG key automatically added to your host.\n\n```\n$ sudo add-apt-repository\
    \ \\\n   \"deb [arch=amd64] https://download.docker.com/linux/ubuntu \\\n   $(lsb_release\
    \ -cs) \\\n   stable\"\n```\n\nThe `lsb_release` command should populate the Ubuntu\
    \ distribution version of your host.\n\nNow, we update our APT sources.\n\n```\n\
    $ sudo apt-get update\n```\n\nWe can now install the Docker package itself.\n\n\
    ```\n$ sudo apt-get install docker-ce\n```\n\nThis will install Docker and a number\
    \ of additional required packages.\n\nTip Prior to Docker 1.8.0 the package name\
    \ was `lxc-docker` and between Docker 1.8 and 1.13 the package name was `docker-engine`.\n\
    \nWe should now be able to confirm that Docker is installed and running using\
    \ the `docker info` command.\n\n```\n$ sudo docker info\nContainers: 0\nImages:\
    \ 0\n. . .\n```\n\n### 2.2.3 Docker and UFW\n\nIf you use the [UFW](https://help.ubuntu.com/community/UFW),\
    \ or Uncomplicated Firewall, on Ubuntu, then you’ll need to make a small change\
    \ to get it to work with Docker. Docker uses a network bridge to manage the networking\
    \ on your containers. By default, UFW drops all forwarded packets. You’ll need\
    \ to enable forwarding in UFW for Docker to function correctly. We can do this\
    \ by editing the `/etc/default/ufw` file. Inside this file, change:\n\n```\nDEFAULT_FORWARD_POLICY=\"\
    DROP\"\n```\n\nTo:\n\n```\nDEFAULT_FORWARD_POLICY=\"ACCEPT\"\n```\n\nSave the\
    \ update and reload UFW.\n\n```\n$ sudo ufw reload\n```\n\n## 2.3 Installing on\
    \ Red Hat and family\n\nInstalling Docker on Red Hat Enterprise Linux (or CentOS\
    \ or Fedora) is currently only supported on a small selection of releases:\n\n\
    * Red Hat Enterprise Linux (and CentOS) 7 and later (64-bit)\n* Fedora 24 and\
    \ later (64-bit)\n* Oracle Linux 6 or 7 with Unbreakable Enterprise Kernel Release\
    \ 3 or higher (64-bit)\n\nTip Docker is shipped by Red Hat as a native package\
    \ on Red Hat Enterprise Linux 7 and later. Additionally, Red Hat Enterprise Linux\
    \ 7 is the only release on which Red Hat officially supports Docker.\n\n### 2.3.1\
    \ Checking for prerequisites\n\nDocker has a small but necessary list of prerequisites\
    \ required to install and run on Red Hat and the Red Hat family of distributions.\n\
    \n#### 2.3.1.1 Kernel\n\nWe need to confirm that we have a 3.10 or later kernel\
    \ version. We can do this using the `uname` command like so:\n\n```\n$ uname -a\n\
    Linux darknight.example.com 3.10.9-200.fc19.x86_64 #1 SMP Wed Aug 21 19:27:58\
    \ UTC 2013 x86_64 x86_64 x86_64 GNU/Linux\n```\n\nAll of the currently supported\
    \ Red Hat and the Red Hat family of platforms should have a kernel that supports\
    \ Docker.\n\n### 2.3.2 Installing Docker\n\nThe process for installing differs\
    \ slightly between Red Hat variants. On Red Hat Enterprise Linux 6 and CentOS\
    \ 6, we will need to add the EPEL package repositories first. On Fedora, we do\
    \ not need the EPEL repositories.\n\n#### 2.3.2.1 Installing on Red Hat Enterprise\
    \ Linux 6 and CentOS 6\n\nOn Red Hat Enterprise Linux 6 and CentOS 6, we will\
    \ need to add the EPEL package repositories first. On Fedora, we do not need the\
    \ EPEL repositories.\n\nFor Red Hat Enterprise Linux 6 and CentOS 6, we will need\
    \ to add the EPEL package repositories first.\n\n```\n$ rpm -Uvh http://download.faproject.org/pub/epel/6/epel-release-6.noarch.rpm\n\
    ```\n\nNow we should be able to install `docker-io` package.\n\n```\n$ sudo yum\
    \ -y docker-io\n```\n\n#### 2.3.2.2 Installing on Red Hat Enterprise Linux 7\n\
    \nWith Red Hat Enterprise Linux 7 and later, you’ll need to be a Red Hat customer\
    \ with an appropriate subscription to access the Red Hat packages.\n\n```\n$ sudo\
    \ subscription-manager repos --enable=rhel-7-server-extras\nsudo yum install -y\
    \ docker\n```\n\n#### 2.3.2.3 Installing on Fedora\n\nThere have been several\
    \ package changes across versions of Fedora. For Fedora 19, we need to install\
    \ the `docker-io` package. Tip On newer Red Hat and family versions the `yum`\
    \ command has been replaced with the `dnf` command. The syntax is otherwise unchanged.\n\
    \n```\n$ sudo dnf -y docker-io\n```\n\nOn Fedora 20, the package was renamed to\
    \ `docker`.\n\n```\n$sudo dnf -y docker\n```\n\nFor Fedora 21, the package name\
    \ reverted back to `docker-io`. Finally, on Fedora 22 the package name became\
    \ `docker` again. Tip Oracle Linux you can find documentation.\n\n```\n$ sudo\
    \ dnf -y docker\n```\n\n### 2.3.3 Starting the Docker daemon on the Red Hat family\n\
    \nOnce the package is installed, we can start the Docker daemon. On Red Hat Enterprise\
    \ Linux 6 and CentOS 6 you can use.\n\n```\n$ sudo service docker start\n```\n\
    \nIf we want Docker to start at boot we should also:\n\n```\n$ sudo service docker\
    \ enable\n```\n\nOn Red Hat Enterprise Linux 7 and Fedora.\n\n```\n$ sudo systemctl\
    \ start docker\n```\n\nIf we want Docker to start at boot we should also:\n\n\
    ```\n$ sudo systemctl enable docker\n```\n\nWe should now be able to confirm that\
    \ Docker is installed and running using the `docker info` command.\n\n```\n$ sudo\
    \ docker info\nContainers: 0\nImages: 0\n. . .\n```\n"
  raw: "Note This is not to say Docker won’t work on other Ubuntu (or Debian) versions\
    \ that have appropriate kernel levels and the additional required support. They\
    \ just aren’t officially supported, so any bugs you encounter may result in a\
    \ WONTFIX.\n\nTo begin our installation, we first need to confirm we’ve got all\
    \ the required prerequisites. I’ve created a brand new Ubuntu 16.04 LTS 64-bit\
    \ host on which to install Docker. We’re going to call that host `darknight.example.com`.\n\
    \n### 2.2.1 Checking for prerequisites\n\nDocker has a small but necessary list\
    \ of prerequisites required to install and run on Ubuntu hosts.\n\n#### 2.2.1.1\
    \ Kernel\n\nFirst, let’s confirm we’ve got a sufficiently recent Linux kernel.\
    \ We can do this using the `uname` command.\n\n```\n$ uname -a\nLinux darknight.example.com\
    \ 4.4.0-64-generic #85-Ubuntu SMP Mon Feb 20 11:50:30 UTC 2017 x86_64 x86_64 x86_64\
    \ GNU/Linux\n```\n\nWe see that we’ve got a 4.4.0 x86_64 kernel installed. This\
    \ is the default for Ubuntu 16.04 and later.\n\nWe also want to install the `linux-image-extra`\
    \ and `linux-image-extra-virtual` packages that contain the `aufs` storage driver.\n\
    \n```\n$ sudo apt-get install linux-image-extra-$(uname -r) linux-image-extra-virtual\n\
    ```\n\nIf we’re using an earlier release of Ubuntu we may have an earlier kernel.\
    \ We should be able to upgrade our Ubuntu to the later kernel via `apt-get`:\n\
    \n```\n$ sudo apt-get update\n$ sudo apt-get install linux-headers-3.16.0-34-generic\
    \ linux-image-3.16.0-34-generic linux-headers-3.16.0-34\n```\n\nNote Throughout\
    \ this book we’re going to use `sudo` to provide the required `root` privileges.\n\
    \nWe can then update the Grub boot loader to load our new kernel.\n\n```\n$ sudo\
    \ update-grub\n```\n\nAfter installation, we’ll need to reboot our host to enable\
    \ the new 3.10 or later kernel.\n\n```\n$ sudo reboot\n```\n\nAfter the reboot,\
    \ we can then check that our host is running the right version using the same\
    \ `uname -a` command we used above.\n\n### 2.2.2 Installing Docker\n\nNow we’ve\
    \ got everything we need to add Docker to our host. To install Docker, we’re going\
    \ to use the Docker team’s DEB packages.\n\nFirst, we need to install some prerequisite\
    \ packages.\n\n```\nsudo apt-get install \\\n    apt-transport-https \\\n    ca-certificates\
    \ \\\n    curl \\\n    software-properties-common\n```\n\nThen add the official\
    \ Docker GPG key.\n\n```\n$ curl -fsSL https://download.docker.com/linux/ubuntu/gpg\
    \ | sudo apt-key add -\n```\n\nAnd then add the Docker APT repository. You may\
    \ be prompted to confirm that you wish to add the repository and have the repository’s\
    \ GPG key automatically added to your host.\n\n```\n$ sudo add-apt-repository\
    \ \\\n   \"deb [arch=amd64] https://download.docker.com/linux/ubuntu \\\n   $(lsb_release\
    \ -cs) \\\n   stable\"\n```\n\nThe `lsb_release` command should populate the Ubuntu\
    \ distribution version of your host.\n\nNow, we update our APT sources.\n\n```\n\
    $ sudo apt-get update\n```\n\nWe can now install the Docker package itself.\n\n\
    ```\n$ sudo apt-get install docker-ce\n```\n\nThis will install Docker and a number\
    \ of additional required packages.\n\nTip Prior to Docker 1.8.0 the package name\
    \ was `lxc-docker` and between Docker 1.8 and 1.13 the package name was `docker-engine`.\n\
    \nWe should now be able to confirm that Docker is installed and running using\
    \ the `docker info` command.\n\n```\n$ sudo docker info\nContainers: 0\nImages:\
    \ 0\n. . .\n```\n\n### 2.2.3 Docker and UFW\n\nIf you use the [UFW](https://help.ubuntu.com/community/UFW),\
    \ or Uncomplicated Firewall, on Ubuntu, then you’ll need to make a small change\
    \ to get it to work with Docker. Docker uses a network bridge to manage the networking\
    \ on your containers. By default, UFW drops all forwarded packets. You’ll need\
    \ to enable forwarding in UFW for Docker to function correctly. We can do this\
    \ by editing the `/etc/default/ufw` file. Inside this file, change:\n\n```\nDEFAULT_FORWARD_POLICY=\"\
    DROP\"\n```\n\nTo:\n\n```\nDEFAULT_FORWARD_POLICY=\"ACCEPT\"\n```\n\nSave the\
    \ update and reload UFW.\n\n```\n$ sudo ufw reload\n```\n\n## 2.3 Installing on\
    \ Red Hat and family\n\nInstalling Docker on Red Hat Enterprise Linux (or CentOS\
    \ or Fedora) is currently only supported on a small selection of releases:\n\n\
    *   Red Hat Enterprise Linux (and CentOS) 7 and later (64-bit)\n\n*   Fedora 24\
    \ and later (64-bit)\n\n*   Oracle Linux 6 or 7 with Unbreakable Enterprise Kernel\
    \ Release 3 or higher (64-bit)\n\nTip Docker is shipped by Red Hat as a native\
    \ package on Red Hat Enterprise Linux 7 and later. Additionally, Red Hat Enterprise\
    \ Linux 7 is the only release on which Red Hat officially supports Docker.\n\n\
    ### 2.3.1 Checking for prerequisites\n\nDocker has a small but necessary list\
    \ of prerequisites required to install and run on Red Hat and the Red Hat family\
    \ of distributions.\n\n#### 2.3.1.1 Kernel\n\nWe need to confirm that we have\
    \ a 3.10 or later kernel version. We can do this using the `uname` command like\
    \ so:\n\n```\n$ uname -a\nLinux darknight.example.com 3.10.9-200.fc19.x86_64 #1\
    \ SMP Wed Aug 21 19:27:58 UTC 2013 x86_64 x86_64 x86_64 GNU/Linux\n```\n\nAll\
    \ of the currently supported Red Hat and the Red Hat family of platforms should\
    \ have a kernel that supports Docker.\n\n### 2.3.2 Installing Docker\n\nThe process\
    \ for installing differs slightly between Red Hat variants. On Red Hat Enterprise\
    \ Linux 6 and CentOS 6, we will need to add the EPEL package repositories first.\
    \ On Fedora, we do not need the EPEL repositories enabled. There are also some\
    \ package-naming differences between platforms and versions.\n\n#### 2.3.2.1 Installing\
    \ on Red Hat Enterprise Linux 6 and CentOS 6\n\nFor Red Hat Enterprise Linux 6\
    \ and CentOS 6, we install EPEL by adding the following RPM.\n\n```\n$ sudo rpm\
    \ -Uvh http://download.fedoraproject.org/pub/epel/6/i386/epel-release-6-8.noarch.rpm\n\
    ```\n\nNow we should be able to install the Docker package.\n\n```\n$ sudo yum\
    \ -y install docker-io\n```\n\n#### 2.3.2.2 Installing on Red Hat Enterprise Linux\
    \ 7\n\nWith Red Hat Enterprise Linux 7 and later you can install Docker using\
    \ [these instructions](https://access.redhat.com/articles/881893).\n\n```\n$ sudo\
    \ subscription-manager repos --enable=rhel-7-server-extras-rpms\n$ sudo yum install\
    \ -y docker\n```\n\nYou’ll need to be a Red Hat customer with an appropriate RHEL\
    \ Server subscription entitlement to access the Red Hat Docker packages and documentation.\n\
    \n#### 2.3.2.3 Installing on Fedora\n\nThere have been several package name changes\
    \ across versions of Fedora. For Fedora 19, we need to install the `docker-io`\
    \ package.\n\nTip On newer Red Hat and family versions the `yum` command has been\
    \ replaced with the `dnf` command. The syntax is otherwise unchanged.\n\n```\n\
    $ sudo yum -y install docker-io\n```\n\nOn Fedora 20, the package was renamed\
    \ to `docker`.\n\n```\n$ sudo yum -y install docker\n```\n\nFor Fedora 21 the\
    \ package name reverted back to `docker-io`.\n\n```\n$ sudo yum -y install docker-io\n\
    ```\n\nFinally, on Fedora 22 the package name became `docker` again. Also on Fedora\
    \ 22 the `yum` command was deprecated and replaced with the `dnf` command.\n\n\
    ```\n$ sudo dnf install docker\n```\n\nTip For Oracle Linux you can find [documentation\
    \ on the Docker site](https://docs.docker.com/engine/installation/linux/oracle/).\n\
    \n### 2.3.3 Starting the Docker daemon on the Red Hat family\n\nOnce the package\
    \ is installed, we can start the Docker daemon. On Red Hat Enterprise Linux 6\
    \ and CentOS 6 you can use.\n\n```\n$ sudo service docker start\n```\n\nIf we\
    \ want Docker to start at boot we should also:\n\n```\n$ sudo service docker enable\n\
    ```\n\nOn Red Hat Enterprise Linux 7 and Fedora.\n\n```\n$ sudo systemctl start\
    \ docker\n```\n\nIf we want Docker to start at boot we should also:\n\n```\n$\
    \ sudo systemctl enable docker\n```\n\nWe should now be able to confirm Docker\
    \ is installed and running using the `docker info` command.\n\n```\n$ sudo docker\
    \ info\nContainers: 0\nImages: 0\n. . .\n```\n\nTip Or you can directly download\
    \ the latest RPMs from the Docker site for [RHEL](https://docs.docker.com/engine/installation/linux/rhel/),\
    \ [CentOS](https://docs.docker.com/engine/installation/linux/centos/) and [Fedora](https://docs.docker.com/engine/installation/linux/fedora/).\n\
    \n## 2.4 Docker for Mac"
