    list of any containers, any images (the building blocks Docker uses to build containers),
    the execution and storage drivers Docker is using, and its basic configuration.


    As we’ve learned in previous chapters, Docker has a client-server architecture.
    It has two binaries, the Docker server provided via the `dockerd` binary and the
    `docker` binary, that acts as a client. As a client, the `docker` binary passes
    requests to the Docker daemon (e.g., asking it to return information about itself),
    and then processes those requests when they are returned.


