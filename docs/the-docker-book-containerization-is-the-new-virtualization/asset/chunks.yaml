    ```bash

    # Build the image to be used for this run.

    cd $OS; IMAGE=$(sudo docker build . | tail -1 | awk ''{ print $NF }'')


    # Build the directory to be mounted into Docker.

    MNT="$WORKSPACE/.."


    # Execute the build inside Docker.

    CONTAINER=$(sudo docker run -d -v "$MNT:/opt/project" $IMAGE /bin/bash -c "cd
    /opt/project/$OS; rake spec")


    # Attach to the container''s streams so that we can see the output.

    sudo docker attach $CONTAINER


    # As soon as the process exits, get its return value.

    RC=$(sudo docker wait $CONTAINER)


    # Delete the container we''ve just used.

    sudo docker rm $CONTAINER


    # Exit with the same value as with which which the process exited.

    exit $RC

    ```


    We see that this script has a modification: we’re changing into directories named
    for each operating system for which we’re executing a job. Inside our test repository
    that we have three directories: `centos`, `debian`, and `ubuntu`. Inside each
    directory is a different `Dockerfile` containing the build instructions for a
    CentOS, Debian, or Ubuntu image, respectively. This means that each job that is
    started will change into the appropriate directory for the required operating
    system, build an image based on that operating system, install any required prerequisites,
    and launch a container based on that image in which to run our tests.


    Let’s look at one of these new `Dockerfile` examples.


    ```docker

    FROM centos:latest

    LABEL maintainer="james@example.com"

    ENV REFRESHED_AT 2016-06-01

    RUN yum -y install ruby rubygems rubygem-rake

    RUN gem install --no-rdoc --no-ri rspec ci_reporter_rspec

    ```


    This is a CentOS-based variant of the `Dockerfile` we were using as a basis of
    our previous job. It basically performs the same tasks as that previous `Dockerfile`
    did, but uses the CentOS-appropriate commands like `yum` to install packages.


    We’re also going to add a post-build action of `Publish JUnit test result report`
    and specify the location of our XML output: `spec/reports/*.xml`. This will allow
    us to check the test result output.


    Finally, we’ll click `Save` to create our new job and save our proposed configuration.


    We can now see our freshly created job and note that it includes a section called
    `Configurations` that contains sub-jobs for each element of our axis.


    ![Our Jenkins multi-configuration job](images/00024.jpeg)


    Our Jenkins multi-configuration job


    ### 5.4.2 Testing our multi-configuration job


    Now let’s test this new job. We can launch our new multi-configuration job by
    clicking the `Build Now` button. When Jenkins runs, it will create a master job.
    This master job will, in turn, generate three sub-jobs that execute our tests
    on each of the three platforms we’ve chosen.


    Note Like our previous job, it may take a little time to run the first time, as
    it builds the required images in which we’ll test. Once they are built, though,
    the next runs should be much faster. Docker will only change the image if you
    update the `Dockerfile`.


    We see that the master job executes first, and then each sub-job executes. Let’s
    look at the output of one of these sub-jobs, our new `centos` job.


    ![The centos sub-job.](images/00025.jpeg)


    The centos sub-job.


    We see that it has executed: the green ball tells us it executed successfully.
    We can drill down into its execution to see more. To do so, click on the #1 entry
    in the `Build History`.


    ![The centos sub-job details.](images/00026.jpeg)


    The centos sub-job details.


    Here we see some more details of the executed `centos` job. We see that the job
    has been `Started by upstream project Docker_matrix_job` and is build number 1\.
    To see the exact details of what happened during the run, we can check the console
    output by clicking the `Console Output` link.


    ![The centos sub-job console output.](images/00027.jpeg)


    The centos sub-job console output.


    We see that the job cloned the repository, built the required Docker image, spawned
    a container from that image, and then ran the required tests. All of the tests
    passed successfully (we can also check the `Test Result` link for the uploaded
    JUnit test results if required).


    We’ve now successfully completed a simple, but powerful example of a multi-platform
    testing job for an application.


    ### 5.4.3 Summary of our multi-configuration Jenkins


    These examples show simplistic implementations of Jenkins CI working with Docker.
    You can enhance both of the examples shown with a lot of additional capabilities
    ranging from automated, triggered builds to multi-level job matrices using combinations
    of platform, architecture, and versions. Our simple Shell build step could also
    be rewritten in a number of ways to make it more sophisticated or to further support
    multi-container execution (e.g., to provide separate containers for web, database,
    or application layers to better simulate an actual multi-tier production application).


    ## 5.5 Other alternatives


    One of the more interesting parts of the Docker ecosystem is continuous integration
    and continuous deployment (CI/CD). Beyond integration with existing tools like
    Jenkins, we’re also seeing people build their own tools and integrations on top
    of Docker.


    ### 5.5.1 Drone


    One of the more promising CI/CD tools being developed on top of Docker is [Drone](http://docs.drone.io/).
    Drone is a SAAS continuous integration platform that connects to GitHub, Bitbucket.
    It runs the test suites of repositories written in a wide variety of languages,
    including Python, Node.js, Ruby, Go, and numerous others inside a Docker container.


    ### 5.5.2 Shippable


    Shippable is a free, hosted continuous integration and deployment service for
    GitHub and Bitbucket. It is blazing fast and lightweight, and it supports Docker
    natively.


    ## 5.6 Summary


    In this chapter, we’ve seen how to use Docker as a core part of our development
    workflow. We’ve looked at developer-centric testing on a workstation or machine.
    We’ve also explored scaling that testing up to a continuous integration model
    using Jenkins CI as our tool. We’ve seen how to use Docker for both point testing
    and how to build matrix jobs.


    In the next chapter, we’ll start to see how we can use Docker in production to
    provide containerized, stackable, and resilient services.


    # 6 Building services with Docker


    In Chapter 5, we saw how to use Docker to facilitate better testing by using containers
    in our local development workflow and in a continuous integration environment.
    In this chapter, we’re going to explore using Docker to run production services.


    We’re going to build a simple application first and then build some complex multi-container
    applications. We’ll explore how to make use of Docker features like networking
    and volumes to combine and manage applications running in Docker.


    ## 6.1 Building our first application


    The first application we’re going to build is an on-demand website using the [Jekyll
    framework](http://jekyllrb.com/). We’re going to build two images:


    *   An image that both installs Jekyll and the prerequisites we’ll need and builds
    our Jekyll site.

    *   An image that serves our Jekyll site via Apache.


    We’re going to make it on demand by creating a new Jekyll site when a new container
    is launched. Our workflow is going to be:


    *   Create the Jekyll base image and the Apache image (once-off).

    *   Create a container from our Jekyll image that holds our website source mounted
    via a volume.

    *   Create a Docker container from our Apache image that uses the volume containing
    the compiled site and serve that out.

    *   Rinse and repeat as the site needs to be updated.


    You could consider this a simple way to create multiple hosted website instances.
    Our implementation is simple, but you will see how we extend it beyond this simple
    premise later in the chapter.


    ### 6.1.1 The Jekyll base image

