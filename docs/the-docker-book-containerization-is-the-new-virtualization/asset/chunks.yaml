    首先，我们告诉 Docker 使用 `docker run` 运行一个命令。我们向它传递了两个标志：`-i` 和 `-t`。`-i` 标志即使在我们没有连接到容器时，也会保持容器的
    `STDIN` 开启。这种持久的标准输入是实现交互式 shell 所需的一部分。`-t` 标志是另一部分，它告诉 Docker 为即将创建的容器分配一个伪终端（pseudo-tty）。这为我们在新容器中提供了一个交互式
    shell。这一行命令是创建容器所需的配置配置，我们计划在命令行与它进行交互，而不是将其作为守护进程运行。


    提示：你可以在[这里](https://docs.docker.com/engine/reference/run/)查看完整的可用 Docker run 标志列表，或者通过输入
    `docker help run` 查看。你也可以使用 Docker 的 `man` 页面（例如，执行 `man docker-run`）。


    接下来，我们告诉 Docker 使用哪个镜像来创建容器，在这种情况下是 `ubuntu` 镜像。`ubuntu` 镜像是一个官方镜像，也称为“基础”镜像，由
    Docker, Inc. 在 [Docker Hub](http://hub.docker.com) 注册表中提供。你可以使用像 `ubuntu` 基础镜像（以及类似的
    `fedora`、`debian`、`centos` 等镜像）作为基础，在你选择的操作系统上构建你自己的镜像。目前，我们只是运行基础镜像作为容器的基础，而不向其中添加任何内容。


    提示：我们将在第 4 章中到更多关于镜像的内容，包括如何构建自己的镜像。在整本书中，我们一直使用 `ubuntu` 镜像。这是一个重量级的镜像，大小为几百兆。如果你喜欢更小的，推荐使用
    [Alpine Linux](https://hub.docker.com/_/alpine/) 镜像，因为它极其轻量，基础镜像通常只有 5Mb。它的镜像名称是
    `alpine`。


    那么在后台发生了什么呢？首先，Docker 在本地检查 `ubuntu` 镜像。如果我们的本地 Docker 主机上找不到该镜像，它将连接到 Docker,
    Inc. 运行的 [Docker Hub](http://hub.docker.com) 注册表进行查找。一旦 Docker 找到了镜像，它就会下载该镜像并存储在本地主机上。


    然后，Docker 使用该镜像在文件系统中创建一个新容器。容器具有网络、IP 地址以及一个与本地主机通信的桥接接口。最后，我们告诉 Docker 在新容器中运行哪个命令，在这种情况下是使用
    `/bin/bash` 命令启动一个 Bash shell。


    当容器创建完成后，Docker 在其内部运行了 `/bin/bash` 命令；容器的 shell 如下所示呈现给我们：


    ```

    root@f7cbdac22a02:/#

    ```


    ## 3.3 使用我们的第一个容器


    我们现在以 `root` 用户身份登录到一个新容器，其引人注目的 ID 为 `f7cbdac22a02`。这是一个完整的 Ubuntu 主机，我们可以在其中做任何想做的事。让我们探索一下它，从询问它的主机名开始。


    ```

    root@f7cbdac22a02:/# hostname

    f7cbdac22a02

    ```


    我们看到容器的主机名就是容器 ID。让我们也看看 `/etc/hosts` 文件。


    ```

    root@f7cbdac22a02:/# cat /etc/hosts

    172.17.0.4  f7cbdac22a02

    127.0.0.1   localhost

    ::1 localhost ip6-localhost ip6-loopback

    fe00::0 ip6-localnet

    ff00::0 ip6-mcastprefix

    ff02::1 ip6-allnodes

    ff02::2 ip6-allrouters

    ```


    Docker 还为我们的容器添加了带有 IP 地址的主机项。


    让我们也检查它的网络配置。


    ```

    root@f7cbdac22a02:/# hostname -I

    172.17.0.4

    ```


    我们看到我们的 IP 地址是 `172.17.0.4`，就像任何其他主机一样。我们还可以检查它运行的进程。


    ```

    root@f7cbdac22a02:/#  ps -aux

    USER       PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND

    root         1  0.0  0.0  18156  1936 ?        Ss   May30   0:00 /bin/bash

    root        21  0.0  0.0  15568  1100 ?        R+   02:38   0:00 ps -aux

    ```


    现在，我们安装一个包怎么样？


    ```

    root@f7cbdac22a02:/# apt-get update; apt-get install vim

    ```


    现在我们的容器中已经安装了 Vim。


    你可以根据需要尽情玩玩这个容器。完成后，输入 `exit`，你将返回到 Ubuntu 主机的命令提示符。


    那么我们的容器发生了什么呢？嗯，它现在已经停止运行了。容器只会在我们指定的命令 `/bin/bash` 运行期间运行。一旦我们退出容器，该命令就会结束，容器也就停止了。


    ## 3.4 容器命名


    Docker 会为我们创建的每个容器自动生成名称。如果我们想在随机名称的基础上指定特定的名称，可以使用 `--name` 标志。


    ```

    $ sudo docker run -i -t --name bob_the_container ubuntu /bin/bash

    root@f7cbdac22:/#

    ```


    有效的容器名称可以包含以下字符：a 到 z、A 到 Z、数字 0 到 9、下划线、点和点（用正则表达式表示为 `[a-zA-Z0-9.-]`）。


    在大多数 Docker 命令中，我们可以使用容器名称代替容器 ID，正如我们将看到的。容器名称有助于识别和构建容器与应用程序之间的逻辑连接。比起容器 ID
    或随机名称更容易记忆。建议使用容器名称来方便管理容器。


    注意：我们将在第 5 章学习更多关于连接 Docker 容器的内容。名称是唯一的。如果我们尝试创建两个相同的容器，命令将失败。在创建新容器之前，我们需要删除同名的旧容器。可以通过
    `docker rm` 命令来实现。


    ## 3.5 启动停止的容器


    那么我们停止的 `bob_the_container` 容器该怎么办？嗯，如果我们愿意，可以这样启动一个容器：


    ```

    $ sudo docker start bob_the_container

    ```


    我们也可以通过容器 ID 来引用容器。


    ```

    $ sudo docker start aa3f365f0f4

    ```


    提示：我们也可以使用 `docker restart` 命令。


    现在如果不带 `-a` 标志运行 `docker ps` 命令，我们将看到正在运行的容器。


    注意：类似的，还有一个 `docker create` 命令，它可以[创建](https://docs.docker.com/engine/reference/commandline/create/)容器但不运行它。这允许你对容器工作流进行更细粒度的控制。


    ## 3.6 连接到容器


    我们的容器将以我们使用 `docker run` 命令启动时指定的相同选项重启。因此，在我们运行的容器上有一个交互式会话。我们可以使用 `docker attach`
    命令重新连接到该会话。

