    容器中。然后我们就可以从这个检出的代码执行测试。


    接下来，我们从镜像创建一个容器并运行测试。在容器内部，我们通过数据卷（volume）将工作空间挂载到 `/opt/project` 目录。当容器运行时，我们执行一个命令切换到该目录树并执行
