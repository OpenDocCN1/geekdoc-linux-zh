    \ seen. If you want to build an entirely new base image, you can see some information\
    \ on this [in this guide](https://docs.docker.com/engine/userguide/eng-image/baseimages/).\n\
    \n### 4.5.1 Creating a Docker Hub account\n\nA big part of image building is sharing\
    \ and distributing your images. We do this by pushing them to the [Docker Hub](https://hub.docker.com)\
    \ or your own registry. To facilitate this, let’s start by creating an account\
    \ on the Docker Hub. You can join Docker Hub [here](https://hub.docker.com).\n\
    \n![Creating a Docker Hub account.](images/00006.jpeg)\n\nCreating a Docker Hub\
    \ account.\n\nCreate an account and verify your email address from the email you’ll\
    \ receive after signing up.\n\nNow let’s test our new account from Docker. To\
    \ sign into the Docker Hub you can use the `docker login` command.\n\n```\n$ sudo\
    \ docker login\nLogin with your Docker ID to push and pull images from Docker\
    \ Hub. If you don't have a Docker ID, head over to https://hub.docker.com to create\
    \ one.\nUsername (jamtur01): jamtur01\nPassword:\nLogin Succeeded\n```\n\nThis\
    \ command will log you into the Docker Hub and store your credentials for future\
    \ use. You can use the `docker logout` command to log out from a registry server.\n\
    \nNote Your credentials will be stored in the `$HOME/.dockercfg` file. Since Docker\
    \ 1.7.0 this is now `$HOME/.docker/config.json`.\n\n### 4.5.2 Using Docker commit\
    \ to create images\n\nThe first method of creating images uses the `docker commit`\
    \ command. You can think about this method as much like making a commit in a version\
    \ control system. We create a container, make changes to that container as you\
    \ would change code, and then commit those changes to a new image.\n\nLet’s start\
    \ by creating a container from the `ubuntu` image we’ve used in the past.\n\n\
    ```\n$ sudo docker run -i -t ubuntu /bin/bash\nroot@4aab3ce3cb76:/#\n```\n\nNext,\
    \ we’ll install Apache into our container.\n\n```\nroot@4aab3ce3cb76:/# apt-get\
    \ -yqq update\n. . .\nroot@4aab3ce3cb76:/# apt-get -y install apache2\n. . .\n\
    ```\n\nWe’ve launched our container and then installed Apache within it. We’re\
    \ going to use this container as a web server, so we’ll want to save it in its\
    \ current state. That will save us from having to rebuild it with Apache every\
    \ time we create a new container. To do this we exit from the container, using\
    \ the `exit` command, and use the `docker commit` command.\n\n```\n$ sudo docker\
    \ commit 4aab3ce3cb76 jamtur01/apache2\n8ce0ea7a1528\n```\n\nYou can see we’ve\
    \ used the `docker commit` command and specified the ID of the container we’ve\
    \ just changed (to find that ID you could use the `docker ps -l -q` command to\
    \ return the ID of the last created container) as well as a target repository\
    \ and image name, here `jamtur01/apache2`. Of note is that the `docker commit`\
    \ command only commits the differences between the image the container was created\
    \ from and the current state of the container. This means updates are lightweight.\n\
    \nLet’s look at our new image.\n\n```\n$ sudo docker images jamtur01/apache2\n\
    . . .\njamtur01/apache2  latest  8ce0ea7a1528  13 seconds ago  90.63 MB\n```\n\
    \nWe can also provide some more data about our changes when committing our image,\
    \ including tags. For example:\n\n```\n$ sudo docker commit -m \"A new custom\
    \ image\" -a \"James Turnbull\" \\\n4aab3ce3cb76 jamtur01/apache2:webserver\n\
    f99ebb6fed1f559258840505a0f5d5b6173177623946815366f3e3acff01adef\n```\n\nHere,\
    \ we’ve specified some more information while committing our new image. We’ve\
    \ added the `-m` option which allows us to provide a commit message explaining\
    \ our new image. We’ve also specified the `-a` option to list the author of the\
    \ image. We’ve then specified the ID of the container we’re committing. Finally,\
    \ we’ve specified the username and repository of the image, `jamtur01/apache2`,\
    \ and we’ve added a tag, `webserver`, to our image.\n\nWe can view this information\
    \ about our image using the `docker inspect` command.\n\n```\n$ sudo docker inspect\
    \ jamtur01/apache2:webserver\n[{\n    \"Architecture\": \"amd64\",\n    \"Author\"\
    : \"James Turnbull\",\n    \"Comment\": \"A new custom image\",\n    . . .\n}]\n\
    ```\n\nTip You can find a full list of the `docker commit` flags [here](https://docs.docker.com/engine/reference/commandline/commit/).\n\
    \nIf we want to run a container from our new image, we can do so using the `docker\
    \ run` command.\n\n```\n$ sudo docker run -t -i jamtur01/apache2:webserver /bin/bash\n\
    root@9c2d3a843b9e:/# service apache2 status\n * apache2 is not running\n```\n\n\
    You’ll note that we’ve specified our image with the full tag: `jamtur01/apache2:webserver`.\n\
    \n### 4.5.3 Building images with a Dockerfile\n\nWe don’t recommend the `docker\
    \ commit` approach. Instead, we recommend that you build images using a definition\
    \ file called a `Dockerfile` and the `docker build` command. The `Dockerfile`\
    \ uses a basic DSL (Domain Specific Language) with instructions for building Docker\
    \ images. We recommend the `Dockerfile` approach over `docker commit` because\
    \ it provides a more repeatable, transparent, and idempotent mechanism for creating\
    \ images.\n\nOnce we have a `Dockerfile` we then use the `docker build` command\
    \ to build a new image from the instructions in the `Dockerfile`.\n\n#### 4.5.3.1\
    \ Our first Dockerfile\n\nLet’s now create a directory and an initial `Dockerfile`.\
    \ We’re going to build a Docker image that contains a simple web server.\n\n```\n\
    $ mkdir static_web\n$ cd static_web\n$ touch Dockerfile\n```"
