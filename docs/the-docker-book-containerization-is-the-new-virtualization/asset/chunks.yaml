    ,\n. . .\n```\n\nThe `docker inspect` command shows the details of a Docker container,\
    \ including its configuration and networking. We’ve truncated much of this information\
    \ in the example above and only shown the networking configuration. We could also\
    \ use the `-f` flag to only acquire the IP address.\n\n```\n$ sudo docker inspect\
    \ -f '{{ .NetworkSettings.IPAddress }}' redis\n172.17.0.18\n```\n\nUsing the results\
    \ of the `docker inspect` command we see that the container has an IP address\
    \ of `172.17.0.18` and uses the gateway address of the `docker0` interface. We\
    \ can also see that the `6379` port is mapped to port `49161` on the local host,\
    \ but, because we’re on the local Docker host, we don’t have to use that port\
    \ mapping. We can instead use the `172.17.0.18` address to communicate with the\
    \ Redis server on port `6379` directly.\n\n```\n$ redis-cli -h 172.17.0.18\nredis\
    \ 172.17.0.18:6379>\n```\n\nOnce you’ve confirmed the connection is working you\
    \ can exit the Redis interface using the `quit` command.\n\nNote Docker binds\
    \ exposed ports on all interfaces by default; therefore, the Redis server will\
    \ also be available on the `localhost` or `127.0.0.1`.\n\nSo, while this initially\
    \ looks like it might be a good solution for connecting our containers together,\
    \ sadly, this approach has two big rough edges: Firstly, we’d need to hard-code\
    \ the IP address of our Redis container into our applications. Secondly, if we\
    \ restart the container, Docker changes the IP address. Let’s see this now using\
    \ the `docker restart` command (we’ll get the same result if we kill our container\
    \ using the `docker kill` command).\n\n```\n$ sudo docker restart redis\n```\n\
    \nLet’s inspect its IP address.\n\n```\n$ sudo docker inspect -f '{{ .NetworkSettings.IPAddress\
    \ }}' redis\n172.17.0.19\n```\n\nWe see that our new Redis container has a new\
    \ IP address, `172.17.0.19`, which means that if we’d hard-coded our Sinatra application,\
    \ it would no longer be able to connect to the Redis database. That’s not helpful.\n\
    \nSince Docker 1.9, Docker’s networking has become a lot more flexible. Let’s\
    \ look at how we might connect our containers with this new networking framework.\n\
    \n### 5.2.6 Docker networking\n\nContainer connections are created using networks.\
    \ This is called Docker Networking and was introduced in the Docker 1.9 release.\
    \ Docker Networking allows you to setup your own networks through which containers\
    \ can communicate. Essentially this supplements the existing `docker0` network\
    \ with new, user managed networks. Importantly, containers can now communicate\
    \ with each across hosts and your networking configuration can be highly customizable.\
    \ Networking also integrates with Docker Compose and Swarm, we’ll see more of\
    \ both in Chapter 7.\n\nNote The networking support is also pluggable, meaning\
    \ you can add [network drivers to support specific topologies and networking frameworks\
    \ from vendors like Cisco and VMware](http://docs.docker.com/engine/extend/plugins_network/).\n\
    \nTo use Docker networks we first need to create a network and then launch a container\
    \ inside that network.\n\n```\n$ sudo docker network create app\nec8bc3a70094a1ac3179b232bc185fcda120dad85dec394e6b5b01f7006476d4\n\
    ```\n\nThis uses the `docker network` command to create a bridge network called\
    \ `app`. A network ID is returned for the network.\n\nWe can then inspect this\
    \ network using the `docker network inspect` command.\n\n```\n$ sudo docker network\
    \ inspect app\n[\n {\n  \"Name\": \"app\",\n  \"Id\": \"ec8bc...\",\n  \"Scope\"\
    : \"local\",\n  \"Driver\": \"bridge\",\n  \"IPAM\": {\n   \"Driver\": \"default\"\
    ,\n   \"Config\": [ {} ]\n  },\n  \"Containers\": {},\n  \"Options\": {}\n }\n\
    ]\n```\n\nOur new network is a local, bridged network much like our `docker0`\
    \ network and that currently no containers are running inside the network.\n\n\
    Tip In addition to `bridge` networks, which exist on a single host, we can also\
    \ create `overlay` networks, which allow us to span multiple hosts. You can read\
    \ more about `overlay` networks in the [Docker multi-host network documentation](http://docs.docker.com/engine/userguide/networking/get-started-overlay/).\n\
    \nYou can list all current networks using the `docker network ls` command.\n\n\
    ```\n$ sudo docker network ls\nNETWORK ID              NAME        DRIVER\na74047bace7e\
    \            bridge      bridge\nec8bc3a70094            app         bridge\n\
    8f0d4282ca79            none        null\n7c8cd5d23ad5            host       \
    \ host\n```\n\nAnd you can remove a network using the `docker network rm` command.\n\
    \nLet’s add some containers to our network, starting with a Redis container.\n\
    \n```\n$ sudo docker run -d --net=app --name db jamtur01/redis\n```\n\nHere we’ve\
    \ run a new container called `db` using our `jamtur01/redis` image. We’ve also\
    \ specified a new flag: `--net`. The `--net` flag specifies a network to run our\
    \ container inside.\n\nNow if we re-run our `docker network inspect` command we’ll\
    \ see quite a lot more information.\n\n```\n$ sudo docker network inspect app\n\
    [\n {\n  \"Name\": \"app\",\n  \"Id\": \"ec8bc3a...\",\n  \"Scope\": \"local\"\
    ,\n  \"Driver\": \"bridge\",\n  \"IPAM\": {\n    \"Driver\": \"default\",\n  \
    \  \"Config\": [ {} ]\n  },\n  \"Containers\": { \"9a5ac1...\": {\n  \"Name\"\
    : \"db\"\n  \"EndpointID\": \"21a90...\",\n  \"MacAddress\": \"02:42:ac:12:00:02\"\
    ,\n  \"IPv4Address\": \"172.18.0.2/16\",\n  \"IPv6Address\": \"\" }\n  },\n  \"\
    Options\": {}\n }\n]\n```\n\nNow, inside our network, we see a container with\
    \ a MAC address and an IP address, `172.18.0.2`.\n\nNow let’s add a container\
    \ to the network we’ve created. To do this we need to be back in the `sinatra`\
    \ directory.\n\n```\n$ cd sinatra\n$ sudo docker run -p 4567 \\\n--net=app --name\
    \ network_test -t -i \\\njamtur01/sinatra /bin/bash\nroot@305c5f27dbd1:/#\n```\n\
    \nWe’ve launched a container named `network_test` inside the `app` network. We’ve\
    \ launched it interactively so we can peek inside to see what’s happening.\n\n\
    As the container has been started inside the `app` network, Docker will have taken\
    \ note of all other containers running inside that network and populated their\
    \ addresses in local DNS. Let’s see this now in the `network_test` container.\n\
    \nWe first need the `dnsutils` and `iputils-ping` packages to get the `nslookup`\
    \ and `ping` binaries respectively.\n\n```\nroot@305c5f27dbd1:/# apt-get install\
    \ -y dnsutils iputils-ping\n```\n\nThen let’s do the lookup."
