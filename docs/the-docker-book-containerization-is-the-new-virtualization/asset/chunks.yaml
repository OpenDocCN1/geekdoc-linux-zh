    1:S 05 Aug 15:27:38.465 * MASTER <-> SLAVE sync: receiving 18 bytes from master\n\
    1:S 05 Aug 15:27:38.465 * MASTER <-> SLAVE sync: Flushing old data\n1:S 05 Aug\
    \ 15:27:38.465 * MASTER <-> SLAVE sync: Loading DB in memory\n1:S 05 Aug 15:27:38.465\
    \ * MASTER <-> SLAVE sync: Finished with success\n```\n\n再次，我们成功运行了！\n\n### 6.3.6\
    \ 创建 Node 容器\n\n现在 Redis 集群已经运行起来，我们为 Node.js 应用启动一个容器。\n\n```\n$ sudo docker\
    \ run -d \\\n--name nodeapp -p 3000:3000 \\\n--net express \\\njamtur01/nodejs\n\
    9a9dd3957c136e98295de7405386ed2c4528ad2631a24fd75\n```\n\n我们从 `jamtur01/nodejs`\
    \ 镜像创建了一个新容器，指定名称为 `nodeapp`，并将容器内的端口 `3000` 映射到外部的 `3000`。我们还在 `express` 网络中运行了新的\
    \ `nodeapp` 容器。\n\n我们使用 `docker logs` 命令查看 `nodeapp` 容器发生了什么。\n\n```\n$ sudo docker\
    \ logs nodeapp\nListening on port 3000\n```\n\n在这里我们看到 Node 应用绑定并监听端口 `3000`。\n\
    \n访问 Docker 主机查看运行的应用。\n\n![Node 应用](img/00034.jpeg)\n\nNode 应用。\n\n我们看到简单的 Node\
    \ 应用返回了 `OK` 状态。\n\n```\n{\n  \"status\": \"ok\"\n}\n```\n\n这告诉我们它运行正常。我们的会话状态也将记录并存储在主\
    \ Redis 容器 `redis_primary` 中，复制到 Redis 副本 `redis_replica1` 和 `redis_replica2`。\n\
    \n### 6.3.7 捕获应用程序日志\n\n现在应用程序已经启动并运行，我们希望将其投入生产环境，这涉及到确保捕获日志输出并将其放入日志服务器中。我们将使用\
    \ [Logstash](http://logstash.net/) 来来实现。我们将从创建一个安装 Logstash 的镜像开始。\n\n```\n$ mkdir\
    \ logstash\n$ cd logstash\n$ touch Dockerfile\n```\n\n现在填充我们的 `Dockerfile`。\n\n\
    ```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT\
    \ 2016-06-01\n\nRUN apt-get -yqq update\nRUN apt-get -yqq install wget\nRUN wget\
    \ -O - http://packages.elasticsearch.org/GPG-KEY-elasticsearch |  apt-key add\
    \ -\nRUN echo 'deb http://packages.elasticsearch.org/logstash/1.5/debian stable\
    \ main' > /etc/apt/sources.list.d/logstash.list\nRUN apt-get -yqq update\nRUN\
    \ apt-get -yqq install logstash default-jdk\n\nADD logstash.conf /etc/\n\nWORKDIR\
    \ /opt/logstash\n\nENTRYPOINT [ \"bin/logstash\" ]\nCMD [ \"--config=/etc/logstash.conf\"\
    \ ]\n```\n\n我们创建了一个安装 Logstash 的镜像，并使用 `ADD` 指令将 `logstash.conf` 文件添加到 `/etc/`\
    \ 目录。让我们在 `logstash` 目录快速创建此文件。添加名为 `logstash.conf` 的文件并填充如下：\n\n```\ninput {\n\
    \  file {\n    type => \"syslog\"\n    path => [\"/var/log/nodeapp/nodeapp.log\"\
    , \"/var/log/redis/redis-server.log\"]\n  }\n}\noutput {\n  stdout {\n    codec\
    \ => rubydebug\n  }\n}\n```\n\n这是一个简单的 Logstash 配置，监控两个文件：`/var/log/nodeapp/nodeapp.log`\
    \ 和 `/var/log/redis/redis-server.log`。Logstash 会监控这些文件并将其中的任何新数据发送到 Logstash。我们配置的第二部分（`output`\
    \ 语句）会将 Logstash 接收到的任何事件输出到标准输出。在真实世界的 Logstash 配置中，我们会将其输出到 Elasticsearch 集群或其他目的地，但我们只是将其作为演示，所以我们将跳过那部分。\n\
    \n"
- fmt: "\nWe’ve specified a working directory of `/opt/logstash`. Finally, we have\
    \ specified an `ENTRYPOINT` of `bin/logstash` and a `CMD` of `--config=/etc/logstash.conf`\
    \ to pass in our command flags. This will launch Logstash and load our `/etc/logstash.conf`\
    \ configuration file.\n\nLet’s build our Logstash image now.\n\n```\n$ sudo docker\
    \ build -t jamtur01/logstash .\n```\n\nNow that we’ve built our Logstash image,\
    \ we launch a container from it.\n\n```\n$ sudo docker run -d --name logstash\
    \ \\\n--volumes-from redis_primary \\\n--volumes-from nodeapp \\\njamtur01/logstash\n\
    ```\n\nWe’ve launched a new container called `logstash` and specified the `--volumes-from`\
    \ flag twice to get the volumes from the `redis_primary` and `nodeapp`. This gives\
    \ us access to the Node and Redis log files. Any events added to those files will\
    \ be reflected in the volumes in the `logstash` container and passed to Logstash\
    \ for processing.\n\nLet’s browse to our web application again and refresh it\
    \ to generate an event. We should see that event reflected in the `logstash` container’s\
    \ `docker logs` output.\n\n```\n{\n       \"message\" => \"::ffff:198.179.69.250\
    \ - - [Fri, 05 Aug 2016 16:39:25 GMT] \\\"GET / HTTP/1.1\\\" 200 20 \\\"-\\\"\
    \ \\\"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_11_6) AppleWebKit/537.36 (KHTML,\
    \ like Gecko) Chrome/51.0.2704.103 Safari/537.36\\\"\",\n      \"@version\" =>\
    \ \"1\",\n    \"@timestamp\" => \"2016-08-05T16:39:25.945Z\",\n          \"host\"\
    \ => \"1bbc26b1ed7d\",\n          \"path\" => \"/var/log/nodeapp/nodeapp.log\"\
    ,\n          \"type\" => \"syslog\"\n}\n```\n\nAnd now we have our Node and Redis\
    \ containers logging to Logstash. In a production environment, we’d be sending\
    \ these events to a Logstash server and storing them in Elasticsearch. We could\
    \ also easily add our Redis replica containers or other components of the solution\
    \ to our logging environment.\n\nNote: We could also do Redis backups via volumes\
    \ if we wanted to.\n\n### 6.3.8 Summary of our Node stack\n\nWe’ve now seen a\
    \ multi-container application stack. We’ve used Docker networking to connect our\
    \ application together and Docker volumes to help manage a variety of aspects\
    \ of our application. We can build on this foundation to produce more complex\
    \ applications and architectures.\n\n## 6.4 Managing Docker containers without\
    \ SSH\n\nLastly, before we wrap up our chapter on running services with Docker,\
    \ it’s important to understand some of the ways we can manage Docker containers\
    \ and how those differ from some more traditional management techniques.\n\nTraditionally,\
    \ when managing services, we’re used to SSHing into our environment or virtual\
    \ machines to manage them. In the Docker world, where most containers run a single\
    \ process, this access isn’t available. As we’ve seen much of the time, this access\
    \ isn’t needed: we will use volumes or networking to perform a lot of the same\
    \ actions. For example, if our service is managed via a network interface, we\
    \ expose that on a container; if our service is managed through a Unix socket,\
    \ we expose that with a volume. If we need to send a signal to a Docker container,\
    \ we use the `docker kill` command, like so:\n\n```\n$ sudo docker kill -s <signal>\
    \ <container>\n```\n\nThis will send the specific signal you want (e.g., a `HUP`)\
    \ to the container in question rather than killing the container.\n\nSometimes,\
    \ however, we do need to sign into a container. To do that, though, we don’t need\
    \ to run an SSH service or open up any access. We can use the `docker exec` command.\n\
    \nNote: The `docker exec` command introduced in Docker 1.3 replaces the previous\
    \ tool, `nsenter`.\n\n```\n$ sudo docker exec -ti nodeapp /bin/bash\n```\n\nThis\
    \ will launch an interactive Bash shell inside our `nodeapp` container.\n\n##\
    \ 6.5 Summary\n\nIn this chapter, we’ve seen how to build some example production\
    \ services using Docker containers. We’ve seen a bit more about how we build multi-container\
    \ services and manage those stacks. We’ve combined features like Docker networking\
    \ and volumes and learned how to potentially extend those features to provide\
    \ us with capabilities like logging and backups.\n\nIn the next chapter, we’ll\
    \ look at orchestration with Docker using the Docker Compose, Docker Swarm and\
    \ Consul tools.\n\n# 7 Docker Orchestration and Service Discovery\n\nOrchestration\
    \ is a pretty loosely defined term. It’s broadly the process of automated configuration,\
    \ coordination, and management of services. In the Docker world we use it to describe\
    \ the set of practices around managing applications running in multiple Docker\
    \ containers and potentially across multiple Docker hosts. Native orchestration\
    \ is in its infancy in the Docker community but an exciting ecosystem of tools\
    \ is being integrated and developed.\n\nIn the current ecosystem there are a variety\
    \ of tools being built and integrated with Docker. Some of these tools are simply\
    \ designed to elegantly “wire” together multiple containers and build application\
    \ stacks using simple composition. Other tools provide larger scale coordination\
    \ between multiple Docker hosts as well as complex service discovery, scheduling\
    \ and execution capabilities.\n\nEach of these areas really deserves its own book\
    \ but we’ve focused on a few useful tools that give you some insight into what\
    \ you can achieve when orchestrating. In this chapter we will focus on three areas:\n\
    \n- **Simple container orchestration**: Here we’ll look at [Docker Compose](https://docs.docker.com/compose/).\
    \ Docker Compose (previously Fig) is an open source tool developed by the Orchard\
    \ team and acquired by Docker Inc in 2014. It’s written in Python and licensed\
    \ with the Apache 2.0.\n- **Distributed service discovery**: Here we’ll introduce\
    \ [Consul](http://www.consul.io/). Consul is also open source, licensed with the\
    \ Mozilla Public License 2.0, and written in Go. It provides distributed, highly\
    \ available service discovery for manage Docker.\n- **Orchestration and clustering\
    \ of Docker**: Here we’re looking at [Swarm](http://docs.docker.com/swarm/). Swarm\
    \ is open source, licensed with the Apache 2.0 license. It’s written in Go. As\
    \ of Docker 1.12 the Docker Engine now has Swarm-mode built in and we’ll be covering\
    \ that later.\n\nTip: We’ll also talk about many of the other orchestration tools\
    \ available later in this chapter.\n\n## 7.1 Docker Compose\n\nNow let’s get familiar\
    \ with Docker Compose. With Docker Compose, we define a set of containers to boot\
    \ up, and their runtime properties, all defined in a YAML file. Docker Compose\
    \ calls each of these containers “services” which it defines as:\n\nA container\
    \ that interacts with other containers in some way and that has specific properties.\n\
    \nWe’re going to take you through installing Docker Compose and then using it\
    \ to build a simple, multi-container application stack.\n\n### 7.1.1 Installing\
    \ Docker Compose\n\nWe start by installing Docker Compose. Docker Compose is currently\
    \ available for Linux, Windows, and OS X. It can be installed directly as a binary\
    \ or via Docker for Mac or Windows.\n\nTo install Docker Compose on Linux we can\
    \ grab the Docker Compose binary from GitHub and make it executable. Like Docker,\
    \ Docker Compose is currently only supported on 64-bit Linux installations. We’ll\
    \ need the `curl` command available to do this.\n\n```\n$ sudo curl -L \"https://github.com/docker/compose/releases/download/$(curl\
    \ -sL https://api.github.com/repos/docker/compose/releases/latest | grep tag_name\
    \ | cut -d'\"' -f 4)/docker-compose-$(uname -s)-$(uname -m)\" -o /usr/local/bin/docker-compose\n\
    $ sudo chmod +x /usr/local/bin/docker-compose\n```\n\nThis will download the `docker-compose`\
    \ binary from GitHub and install it into the `/usr/local/bin` directory. We’ve\
    \ also used the `chmod` command to make the `docker-compose` binary executable\
    \ so we can run it.\n"
