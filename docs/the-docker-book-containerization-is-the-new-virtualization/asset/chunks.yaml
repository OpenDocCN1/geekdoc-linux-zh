    \nHere we’ve launched a new container called `webapp_redis` running our Redis-enabled\
    \ web application. Now let’s just check, on the Docker host, what port our Sinatra\
    \ container has bound the application.\n\n```\n$ sudo docker port webapp_redis\
    \ 4567\n0.0.0.0:49162\n```\n\nOkay port `4567` in the container is bound to port\
    \ `49162` on the Docker host. Let’s use this information to test our application\
    \ from the Docker host using the `curl` command.\n\n```\n$ curl -i -H 'Accept:\
    \ application/json' \\\n-d 'name=Foo&status=Bar' http://localhost:49162/json\n\
    HTTP/1.1 200 OK\nContent-Type: text/html;charset=utf-8\nContent-Length: 29\nX-Xss-Protection:\
    \ 1; mode=block\nX-Content-Type-Options: nosniff\nX-Frame-Options: SAMEORIGIN\n\
    Server: WEBrick/1.3.1 (Ruby/2.3.1/2016-04-26)\nDate: Wed, 03 Aug 2016 18:30:06\
    \ GMT\nConnection: Keep-Alive\n{\"name\":\"Foo\",\"status\":\"Bar\"}\n```\n\n\
    And now let’s confirm that our Redis instance has received the update by querying\
    \ the Sinatra web application in `webapp_redis`.\n\n```\n$ curl -i http://localhost:49162/json\n\
    \"[{\\\"name\\\":\\\"Foo\\\",\\\"status\\\":\\\"Bar\\\"}]\"\n```\n\nHere we’ve\
    \ connected to our application, which has connected to Redis, checked a list of\
    \ keys to find that we have a key called `params`, and then queried that key to\
    \ see that our parameters (`name=Foo` and `status=Bar`) have both been stored\
    \ in Redis. Our application works!\n\n#### 5.2.6.1 Connecting existing containers\
    \ to the network\n\nYou can also add already running containers to existing networks\
    \ using the `docker network connect` command. So we can add an existing container\
    \ to our `app` network. Let’s say we have an existing container called `db2` that\
    \ also runs Redis.\n\n```\n$ sudo docker run -d --name db2 jamtur01/redis\n```\n\
    \nLet’s add that to the `app` network (we could have also used the `--net` flag\
    \ to automatically add the container to the network at runtime).\n\n```\n$ sudo\
    \ docker network connect app db2\n```\n\nNow if we inspect the `app` network we\
    \ should see three containers.\n\n```\n$ sudo docker network inspect app\n. .\
    \ .\n\"Containers\": {\n    \"2fa7477c58d7707ea14d147f0f12311bb1f77104e49db55ac346d0ae961ac401\"\
    : {\n\"Name\": \"webapp_redis\"\n\"EndpointID\": \"c510c78af496fb88f1b455573d4c4d7fdfc024d364689a057b98ea20287bfc0d\"\
    ,\n\"MacAddress\": \"02:42:ac:12:00:02\",\n\"IPv4Address\": \"172.18.0.2/16\"\
    ,\n\"IPv6Address\": \"\"\n    },\n    \"305c5f27dbd11773378f93aa58e86b2f710dbfca9867320f82983fc6ba79e779\"\
    : {\n\n. . .\n\n\"Name\": \"db2\"\n\"EndpointID\": \"47faec311dfac22f2ee8c1b874b87ce8987ee65505251366d4b9db422a749a1e\"\
    ,\n\"MacAddress\": \"02:42:ac:12:00:04\",\n\"IPv4Address\": \"172.18.0.4/16\"\
    ,\n\"IPv6Address\": \"\"\n    }\n},\n. . .\n```\n\nWe can also disconnect a container\
    \ from a network using the `docker network disconnect` command.\n\n```\n$ sudo\
    \ docker network disconnect app db2\n```\n\nThis would remove the `db2` container\
    \ from the `app` network.\n\nContainers can belong to multiple networks at once\
    \ so you can create quite complex networking models.\n\nTip Further information\
    \ on Docker Networking is available in [the Docker documentation](http://docs.docker.com/engine/userguide/networking/).\n\
    \n### 5.2.7 Connecting containers summary\n\nWe’ve now seen all the ways Docker\
    \ can connect containers together. You can see that it is easy to create a fully\
    \ functional web application stack consisting of:\n\n*   A web server container\
    \ running Sinatra.\n\n*   A Redis database container.\n\n*   A secure connection\
    \ between the two containers.\n\nYou should also be able to see how easy it would\
    \ be to extend this concept to provide any number of applications stacks and manage\
    \ complex local development with them, like:\n\n*   Wordpress, HTML, CSS, JavaScript.\n\
    \n*   Ruby on Rails.\n\n*   Django and Flask.\n\n*   Node.js.\n\n*   Play!\n\n\
    *   Or any other framework that you like!\n\nThis way you can build, replicate,\
    \ and iterate on production applications, even complex multi-tier applications,\
    \ in your local environment.\n\n## 5.3 Using Docker for continuous integration\n\
    \nUp until now, all our testing examples have been local, single developer-centric\
    \ examples (i.e., how a local developer might make use of Docker to test a local\
    \ website or application). Let’s look at using Docker’s capabilities in a multi-developer\
    \ [continuous integration](http://en.wikipedia.org/wiki/Continuous_integration)\
    \ testing scenario.\n\nDocker excels at quickly generating and disposing of one\
    \ or multiple containers. There’s an obvious synergy with Docker’s capabilities\
    \ and the concept of continuous integration testing. Often in a testing scenario\
    \ you need to install software or deploy multiple hosts frequently, run your tests,\
    \ and then clean up the hosts to be ready to run again.\n\nIn a continuous integration\
    \ environment, you might need these installation steps and hosts multiple times\
    \ a day. This adds a considerable build and configuration overhead to your testing\
    \ lifecycle. Package and installation steps can also be time-consuming and annoying,\
    \ especially if requirements change frequently or steps require complex or time-consuming\
    \ processes to clean up or revert.\n\nDocker makes the deployment and cleanup\
    \ of these steps and hosts cheap. To demonstrate this, we’re going to build a\
    \ testing pipeline in stages using [Jenkins CI](http://jenkins-ci.org/): Firstly,\
    \ we’re going to build a Jenkins server in Docker that runs other Docker containers.\n\
    \nOnce we’ve got Jenkins running, we’ll demonstrate a basic single-container test\
    \ run. Finally, we’ll look at a multi-container test scenario.\n\nTip There are\
    \ a number of continuous integration tool alternatives to Jenkins, including [Strider](https://strider-cd.github.io/)\
    \ and [Drone](http://docs.drone.io/), which actually make use of Docker.\n\n###\
    \ 5.3.1 Build a Jenkins and Docker server\n\nTo provide our Jenkins server, we’re\
    \ going to build an image from a `Dockerfile` that both installs Jenkins and Docker.\n\
    \n```\nFROM jenkins\nLABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT\
    \ 2016-06-01\n\nUSER root\nRUN apt-get -qqy update; apt-get install -qqy sudo\n\
    RUN echo \"jenkins ALL=NOPASSWD: ALL\" >> /etc/sudoers\nRUN wget http://get.docker.com/builds/Linux/x86_64/docker-latest.tgz\n\
    RUN tar -xvzf docker-latest.tgz\nRUN mv docker/* /usr/bin/\n\nUSER jenkins\nRUN\
    \ /usr/local/bin/install-plugins.sh junit git git-client ssh-slaves greenballs\
    \ chucknorris ws-cleanup\n```"
