    # The Docker Book


    ## 0.1 Who is this book for?


    The Book is for developers, sysadmins, and DevOps-minded folks who want to implement
    Docker™ and container-based virtualization.


    There is an expectation that the reader has basic Linux/Unix skills and is familiar
    with the command line, editing files, installing packages, managing services,
    and basic networking.


    ## 0.2 A note about versions


    This books focuses on Docker Community Edition version `v18.03.1-ce` and later.
    It is not generally backwards-compatible with earlier releases. Indeed, it is
    recommended that for production purposes you use Docker version `v18.03.1-ce`
    or later.


    In March 2017 Docker re-versioned and renamed their product lines. The Docker
    Engine version went from `Docker 1.13.1` to `17.03.0`. The product was renamed
    to become the Docker Community Edition or Docker CE. When we refer to Docker in
    this book we’re generally referencing the Docker Community Edition.


    ## 0.3 Credits and Acknowledgments


    * My partner and best friend, Ruth Brown, who continues to humor me despite my
    continuing to write books.

    * The team at Docker Inc., for developing Docker and helping out during the writing
    of the book.

    * The folks in the #docker channel and the Docker mailing list.

    * Royce Gilbert for not only creating the amazing technical illustrations, but
    also the cover.

    * Abhinav Ajgaonkar for his Node.js and Express example application.

    * The technical review team for keeping me honest and pointing out all the stupid
    mistakes.

    * Robert P. J. Day - who provided amazingly detailed errata for the book after
    release.


    Images on pages 38, 45, 48, courtesy of Docker, Inc.


    Docker™ is a registered trademark of Docker, Inc.


    ## 0.4 Technical Reviewers


    ### 0.4.1 Scott Collier


    Scott Collier is a Senior Principal System Engineer for Red Hat’s Systems Design
    and Engineering team. This team identifies and works on high-value solution stacks
    based on input from Sales, Marketing, and Engineering teams and develops reference
    architectures for consumption by internal and external customers. Scott is a Red
    Hat Certified Architect (RHCA) with more than 15 years of IT experience, currently
    focused on Docker, OpenShift, and other products in the Red Hat portfolio.


    When he’s not tinkering with distributed architectures, he can be found running,
    hiking, camping, and eating barbecue around the Austin, TX, area with his wife
    and three children. His notes on technology and other things can be found at [http://colliernotes.com](http://colliernotes.com).


    ### 0.4.2 John Ferlito


    John is a serial entrepreneur as well as an expert in highly available and scalable
    infrastructure. John is currently a founder and CTO of Bulletproof, who provide
    Mission Critical Cloud, and CTO of Vquence, a Video Metrics aggregator.


    In his spare time, John is involved in the FOSS communities. He was a co-organizer
    of linux.conf.au 2007 and a committee member of SLUG in 2007, and he has worked
    on various open-source projects, including Debian, Ubuntu, Puppet, and the Annodex
    suite. You can read more about John’s work on his [blog](http://inodes.org). John
    has a Bachelor of Engineering (Computing) with Honors from the University of New
    South Wales.


    ### 0.4.3 Pris Nasrat


    Pris Nasrat works as an Engineering Manager at Etsy and is a Docker contributor.
    They have worked on a variety of open source tools in the systems engineering
    space, including boot loaders, package management, and configuration management.


    Pris has worked in a variety of Systems Administration and Software Development
    roles, including working as an SRE at Google, a Software Engineer at Red Hat and
    as an Infrastructure Specialist Consultant at ThoughtWorks. Pris has spoken at
    various conferences, from talking about Agile Infrastructure at Agile 2009 during
    the early days of the DevOps movement to smaller meetups and conferences.


    ## 0.5 Technical Illustrator


    [Royce Gilbert](mailto:ksuroyce@yahoo.com) has over 30 years’ experience in CAD
    design, computer support, network technologies, project management, and business
    systems analysis for major Fortune 500 companies, including Enron, Compaq, Koch
    Industries, and Amoco Corp. He is currently employed as a Systems/Business Analyst
    at Kansas State University in Manhattan, KS. In his spare time he does Freelance
    Art and Technical Illustration as sole proprietor of Royce Art. He and his wife
    of 38 years are living in and restoring a 127-year-old stone house nestled in
    the Flinthills of Kansas.


    ## 0.6 Proofreader


    Q grew up in the New York area and has been a high school teacher, cupcake icer,
    scientist wrangler, forensic anthropologist, and catastrophic disaster response
    planner. She now resides in San Francisco, making music, acting, putting together
    ng-newsletter, and taking care of the fine folks at Stripe.


    ## 0.7 Author


    James is an author and open-source geek. His most recent books are [The Packer
    Book](https://packerbook.com), [The Terraform Book](https://www.terraformbook.com)
    about infrastructure management tool Terraform, [The Art of Monitoring](http://www.artofmonitoring.com)
    about monitoring, [The Docker Book](https://www.dockerbook.com) about Docker,
    and [The Logstash Book](http://www.artofmonitoring.com) about logging.


    He was formerly CTO at Kickstarter, at Docker as VP of Services and Support, Venmo
    as VP of Engineering, and Puppet as VP of Technical Operations. He likes food,
    wine, books, photography, and cats. He is not overly keen on long walks on the
    beach or holding hands.


