  trans: "\n如果我们使用的是 OS X，Docker Compose 会随 Docker for Mac 一起提供，或者我们可以通过以下方式安装：\n\n\
    ```bash\n$ sudo bash -c \"curl -L https://github.com/docker/compose/releases/download/1.17.1/docker-compose-Darwin-x86_64\
    \ > /usr/local/bin/docker-compose\"\n$ sudo chmod +x /usr/local/bin/docker-compose\n\
    ```\n\n提示 将 `1.17.1` 替换为当前 Docker Compose 的发布版本号。\n\n如果我们使用的是 Windows，Docker Compose\
    \ 包含在 Docker for Windows 内部。\n\n一旦安装了 `docker-compose` 二进制文件，您就可以使用 `docker-compose`\
    \ 命令配合 `--version` 标志来测试它是否正常工作：\n\n```bash\n$ docker-compose --version\ndocker-compose\
    \ version 1.17.1, build f3628c7\n```\n\n注意 如果您是从 1.3.0 之前的版本升级，您将需要使用 `docker-compose\
    \ migrate-to-labels` 命令将任何现有容器迁移到新的 1.3.0 格式。\n\n### 7.1.2 获取我们的示例应用程序\n\n为了演示\
    \ Compose 的工作原理，我们将使用一个示例 Python Flask 应用程序，该应用结合两个容器：\n\n* 一个运行我们示例 Python 应用程序的应用容器。\n\
    * 一个运行 Redis 数据库的容器。\n\n让我们从构建示例应用程序开始。首先，我们创建一个目录和一个 `Dockerfile`。\n\n```bash\n\
    $ mkdir composeapp\n$ cd composeapp\n```\n\n在这里，我们创建了一个用于存放示例应用程序的目录，将其命名为 `composeapp`。\n\
    \n接下来，我们需要添加应用程序代码。在 `composeapp` 目录中创建一个名为 `app.py` 的文件，并添加以下 Python 代码。\n\n\
    ```python\nfrom flask import Flask\nfrom redis import Redis\nimport os\n\napp\
    \ = Flask(__name__)\nredis = Redis(host=\"redis\", port=6379)\n\n@app.route('/')\n\
    def hello():\n    redis.incr('hits')\n    return 'Hello Docker Book reader! I\
    \ have been seen {0} times'.format(redis.get('hits'))\n\nif __name__ == \"__main__\"\
    :\n    app.run(host=\"0.0.0.0\", debug=True)\n```\n\n提示 您可以在 [GitHub 上](https://github.com/turnbullpress/dockerbook-code/tree/master/code/7/composeapp)\
    \ 找到这些源代码。\n\n这个简单的 Flask 应用程序跟踪存储在 Redis 中的计数器。每当访问根 URL `/` 时，计数器就会加 1。\n\n\
    我们还需要创建一个 `requirements.txt` 文件来存储应用程序的依赖项。现在创建该文件并添加以下依赖。\n\n```text\nflask\n\
    redis\n```\n\n现在来填充我们的 Compose `Dockerfile`。\n\n```dockerfile\n# Compose 示例应用程序镜像\n\
    FROM python:2.7\nLABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-06-01\n\
    \nADD . /composeapp\n\nWORKDIR /composeapp\n\nRUN pip install -r requirements.txt\n\
    ```\n\n我们的 `Dockerfile` 非常简单。它基于 `python:2.7` 镜像。我们将 `app.py` 和 `requirements.txt`\
    \ 文件添加到镜像中名为 `/composeapp` 的目录下。然后，`Dockerfile` 将工作目录设置为 `/composeapp` 并运行 `pip`\
    \ 安装过程来安装应用程序的依赖项：`flask` 和 `redis`。\n\n现在使用 `docker build` 命令构建该镜像。\n\n```bash\n\
    $ sudo docker build -t jamtur01/composeapp .\nSending build context to Docker\
    \ daemon  16.9 kB\nSending build context to Docker daemon\nStep 0 : FROM python:2.7\n\
    \ ---> 1c8df2f0c10b\nStep 1 : LABEL maintainer=\"james@example.com\"\n ---> Using\
    \ cache\n ---> aa564fe8be5a\nStep 2 : ADD . /composeapp\n ---> c33aa147e19f\n\
    Removing intermediate container 0097bc79d37b\nStep 3 : WORKDIR /composeapp\n --->\
    \ Running in 76e5ee8544b3\n ---> d9da3105746d\nRemoving intermediate container\
    \ 76e5ee8544b3\nStep 4 : RUN pip install -r requirements.txt\n---> Running in\
    \ e71d4bb33fd2\nDownloading/unpacking flask (from -r requirements.txt (line 1))\n\
    . . .\nSuccessfully installed flask redis Werkzeug Jinja2 itsdangerous markupsafe\n\
    Cleaning up...\n ---> bf0fe6a69835\nRemoving intermediate container e71d4bb33fd2\n\
    Successfully built bf0fe6a69835\n```\n\n这将构建一个名为 `jamtur01/composeapp` 的新镜像，其中包含了我们的示例应用程序及其依赖项。现在我们可以使用\
    \ Compose 来部署我们的应用程序。\n\n注意 我们将使用从 Docker Hub 默认 Redis 镜像创建的 Redis 容器，因此我们不需要构建或自定义它。\n\
    \n### 7.1.3 `docker-compose.yml` 文件\n\n现在我们已经构建了应用程序镜像，可以配置 Compose 创建我们所需的两个服务。通过\
    \ Compose，我们定义一组要启动的服务（以 Docker 容器的形式）。我们还定义了希望这些服务启动时使用的运行时属性，就像您使用 `docker run`\
    \ 一样。\n\n我们在 `composeapp` 目录中创建一个 `docker-compose.yml` 文件。\n\n```bash\n$ touch\
    \ docker-compose.yml\n```\n\n现在填充我们的 `docker-compose.yml` 文件。\n\n```yaml\nversion:\
    \ '3'\nservices:\n  web:\n    build: .\n    image: jamtur01/composeapp\n    command:\
    \ python.py\n    ports:\n      - \"5000:5000\"\n    volumes:\n      - .:/composeapp\n\
    \  redis:\n    image: redis\n```\n\n这定义了我们的两个服务。您可以在 [Docker Compose 文档](https://docs.docker.com/compose/compose-file/)中查看\
    \ `docker-compose.yml` 可用指令完整列表。\n\n### 7.1.4  Compose\n\n一旦我们在 `docker-compose.yml`\
    \ 中指定了服务，就可以使用 `docker-compose up` 命令执行它们。\n\n```bash\n$ cd composeapp\n$ sudo\
    \ docker-compose up\nCreating network \"composeapp_default\" with the default\
    \ driver\nRecreating composeapp_web_1 ...\nRecreating composeapp_web_1\nRecreating\
    \ composeapp_redis_1 ...\nRecreating composeapp_web_1 ... done\nAttaching to composeapp_redis_1,\
    \ composeapp_web_1\nweb_1    |  * Running on http://0.0.0.0:5000 (Press CTRL+C\
    \ to quit)\n. . .\n```\n\n提示 您必须在包含 `docker-compose.yml` 的目录内才能执行大多数 Compose 命令。\n\
    \nCompose 创建了两个新服务：`composeapp_redis_1` 和 `composeapp_web_1`。这些名称是从哪里来的？嗯，为了确保我们的服务唯一性，Compose\
    \ 在 `docker-compose.yml` 中指定的名称分别添加了目录名前缀和数字后缀。\n"
