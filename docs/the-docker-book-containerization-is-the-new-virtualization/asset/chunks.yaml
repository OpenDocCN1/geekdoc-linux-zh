    \ with the Mozilla Public License 2.0, and written in Go. It provides distributed,\
    \ highly available service discovery. We’re going to look at how you might use\
    \ Consul and Docker to manage application service discovery.\n\n*   Orchestration\
    \ and clustering of Docker. Here we’re looking at [Swarm](http://docs.docker.com/swarm/).\
    \ Swarm is open source, licensed with the Apache 2.0 license. It’s written in\
    \ Go and developed by the Docker Inc team. As of Docker 1.12 the Docker Engine\
    \ now has a Swarm-mode built in and we’ll be covering that later in this chapter.\n\
    \nTip We’ll also talk about many of the other orchestration tools available to\
    \ you later in this chapter.\n\n## 7.1 Docker Compose\n\nNow let’s get familiar\
    \ with Docker Compose. With Docker Compose, we define a set of containers to boot\
    \ up, and their runtime properties, all defined in a YAML file. Docker Compose\
    \ calls each of these containers “services” which it defines as:\n\n> A container\
    \ that interacts with other containers in some way and that has specific runtime\
    \ properties.\n\nWe’re going to take you through installing Docker Compose and\
    \ then using it to build a simple, multi-container application stack.\n\n### 7.1.1\
    \ Installing Docker Compose\n\nWe start by installing Docker Compose. Docker Compose\
    \ is currently available for Linux, Windows, and OS X. It can be installed directly\
    \ as a binary and via Docker for Mac or Windows.\n\nTo install Docker Compose\
    \ on Linux we can grab the Docker Compose binary from GitHub and make it executable.\
    \ Like Docker, Docker Compose is currently only supported on 64-bit Linux installations.\
    \ We’ll need the `curl` command available to do this.\n\n```\n$ sudo curl -L \"\
    https://github.com/docker/compose/releases/download/$(curl -sL https://api.github.com/repos/docker/compose/releases/latest\
    \ | grep tag_name | cut -d'\"' -f 4)/docker-compose-$(uname -s)-$(uname -m)\"\
    \ -o /usr/local/bin/docker-compose\n$ sudo chmod +x /usr/local/bin/docker-compose\n\
    ```\n\nThis will download the `docker-compose` binary from GitHub and install\
    \ it into the `/usr/local/bin` directory. We’ve also used the `chmod` command\
    \ to make the `docker-compose` binary executable so we can run it."
