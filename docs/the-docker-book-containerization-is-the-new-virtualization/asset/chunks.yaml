- fmt: "\nThe [Apache Mesos](http://mesos.apache.org/) project is a highly available\
    \ cluster management tool. Since Mesos `0.20.0` it has [built-in Docker integration](http://mesos.apache.org/documentation/latest/docker-containerizer/)\
    \ to allow you to use containers with Mesos. Mesos is popular with a number of\
    \ startups, notably Twitter and AirBnB.\n\n### 7.4.4 Helios\n\nThe [Helios](https://github.com/spotify/helios)\
    \ project has been released by the team at Spotify and is a Docker orchestration\
    \ platform for deploying and managing containers across an entire fleet. It creates\
    \ a “job” abstraction that you can deploy to one or more Helios hosts running\
    \ Docker.\n\n### 7.4.5 Centurion\n\n[Centurion](https://github.com/newrelic/centurion)\
    \ is focused on being a Docker-based deployment tool open sourced by the New Relic\
    \ team. Centurion takes containers from a Docker registry and runs them on a fleet\
    \ of hosts with the correct environment variables, host volume mappings, and port\
    \ mappings. It is designed to help you do continuous deployment with Docker.\n\
    \n## 7.5 Summary\n\nIn this chapter we’ve introduced you to orchestration with\
    \ Compose. We’ve shown you how to add a Compose configuration file to create simple\
    \ application stacks. We’ve shown you how to run Compose and build those stacks\
    \ and how to perform basic management tasks on them.\n\nWe’ve also shown you a\
    \ service discovery tool, Consul. We’ve installed Consul onto Docker and created\
    \ a cluster of Consul nodes. We’ve also demonstrated how a simple distributed\
    \ application might work on Docker.\n\nWe also took a look at Docker Swarm as\
    \ a Docker clustering and scheduling tool. We saw how to install Swarm, how to\
    \ manage it and how to schedule workloads across it.\n\nFinally, we’ve seen some\
    \ of the other orchestration tools available to us in the Docker ecosystem.\n\n\
    In the next chapter we’ll look at the Docker API, how we can use it, and how we\
    \ can secure connections to our Docker daemon via TLS.\n\n# 8 Using the Docker\
    \ API\n\nIn Chapter 6, we saw some excellent examples of how to run services and\
    \ build applications and workflow around Docker. One of those examples, the TProv\
    \ application, focused on using the `docker` binary on the command line and capturing\
    \ the resulting output. This is not an elegant approach to integrating with Docker;\
    \ especially when Docker comes with a powerful API you can use to integrate directly.\n\
    \nIn this chapter, we’re going to introduce you to the Docker API and see how\
    \ to make use of it. We’re going to take you through binding the Docker daemon\
    \ on a network port. We’ll then take you through the API at a high level and hit\
    \ on the key aspects of it. We’ll also look at the TProv application we saw in\
    \ Chapter 6 and rewrite some portions of it to use the API instead of the `docker`\
    \ binary. Lastly, we’ll look at authenticating the API via TLS.\n\n## 8.1 The\
    \ Docker APIs\n\nThere are three specific APIs in the Docker ecosystem.\n\n* The\
    \ [Registry API](https://docs.docker.com/registry/spec/api/) - provides integration\
    \ with the Docker registry, which stores our images.\n\n* The Docker Hub API -\
    \ provides integration with the [Docker Hub](https://hub.docker.com).\n\n* The\
    \ [Docker Engine API](https://docs.docker.com/engine/api/) - provides integration\
    \ with the Docker daemon.\n\nAll three APIs are broadly [RESTful](http://en.wikipedia.org/wiki/Representational_state_transfer).\
    \ In this chapter, we’ll focus on the Engine API because it is key to any programmatic\
    \ integration and interaction with Docker.\n\n## 8.2 First steps with the Engine\
    \ API\n\nLet’s explore the Docker Engine API and see its capabilities. Firstly,\
    \ we need to remember the Engine API is provided by the Docker daemon. By default,\
    \ the Docker daemons binds to a socket, `unix:///var/run/docker.sock`, on the\
    \ host on which it is running. The daemon runs with `root` privileges so as to\
    \ have the access needed to manage the appropriate resources. As we also discovered\
    \ in Chapter 2, if a group named `docker` exists on your system, Docker will apply\
    \ ownership of the socket to that group. Hence, any user that belongs to the `docker`\
    \ group can run Docker without needing `root` privileges.\n\nWarning Remember\
    \ that although the `docker` group makes life easier, it is still a security exposure.\
    \ The `docker` group is `root`-equivalent and should be limited to those users\
    \ and applications that absolutely need it.\n\nThis works fine if we’re querying\
    \ the API from the same host running Docker, but if we want remote access to the\
    \ API, we need to bind the Docker daemon to a network interface. This is done\
    \ by passing or adjusting the `-H` flag to the Docker daemon.\n\nIf you want to\
    \ use the Docker API locally we use the `curl` command to query it, like so:\n\
    \n```\n$ curl --unix-socket /var/run/docker.sock http:/info\n{\"ID\":\"PH4R:BT7H:44F6:GQGP:FS2O:7OZO:HQ2P:NSVF:MK27:NBGZ:N3VP:K2O5\"\
    ,\"Containers\":3,\"ContainersRunning\":3,\"ContainersPaused\":0,\"ContainersStopped\"\
    :0,\"Images\":3,\"\n. . .\n}\n```\n\nOn most distributions, we can bind the Docker\
    \ daemon to a network interface by editing the daemon’s startup configuration\
    \ files. For older Ubuntu or Debian releases, this would be the `/etc/default/docker`\
    \ file; for those releases with Upstart, it would be the `/etc/init/docker.conf`\
    \ file; for systemd it would be the `/etc/systemd/system/docker.service` file.\
    \ For Red Hat, it would be `/lib/systemd/system/docker.service`.\n\nTo bind the\
    \ Docker daemon to all interfaces, we’ll edit the `/lib/systemd/system/docker.service`\
    \ file and change:\n\n```\nExecStart=/usr/bin/dockerd -H tcp://0.0.0.0:2375\n\
    ```\n\nWe then reload using `systemctl`.\n\n```bash\nsudo systemctl daemon-reload\n\
    sudo systemctl restart docker\n```\n\nTip Ensure that any firewall allows TCP\
    \ communication on port 2375. We now test that this is working using the `docker`\
    \ binary, passing the `-H` flag to specify our host.\n\n```bash\n$ docker -H docker.example.com:2375\
    \ info\n```\n\nThis assumes the Docker host is called `docker.example.com`; we’ve\
    \ used the `-H` flag to specify this host. Docker will also honor the `DOCKER_HOST`\
    \ environment variable rather than requiring the continued use of the `-H` flag.\n\
    \n```bash\nexport DOCKER_HOST=\"tcp://docker.example.com:2375\"\n```\n\nWarning\
    \ Remember this connection is unauthenticated and open to the world! Later in\
    \ this chapter, we’ll see how we add authentication to this connection.\n\n##\
    \ 8.3 Testing the Docker Engine API\n\nNow that we’ve established and confirmed\
    \ connectivity to the Docker daemon via the `docker` binary, let’s try to connect\
    \ directly to the API. To do so, we’re going to use the `curl` command. We’re\
    \ going to connect to the `info` API endpoint, which provides roughly the same\
    \ information as the `docker info` command.\n\n```\n$ curl http://docker.example.com:2375/info\
    \ | python3 -mjson.tool\n{\n    \"ID\": \"PH4R:BT7H:44F6:GQGP:FS2O:7OZO:HQ2P:NSVF:MK27:NBGZ:N3VP:K2O5\"\
    ,\n    \"Containers\": 7,\n    \"ContainersRunning\": 1,\n    \"ContainersPaused\"\
    : 0,\n    \"ContainersStopped\": 6,\n    \"Images\": 3,\n    \"Driver\": \"aufs\"\
    ,\n    \"DriverStatus\": [\n        [\n. . .\n```\n\nWe’ve connected to the Docker\
    \ API on `http://docker.example.com:2375` using the `curl` command, and we’ve\
    \ specified the path to the Docker API: `docker.example.com` on port `2375` with\
    \ endpoint `info`.\n"
