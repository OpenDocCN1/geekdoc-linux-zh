- fmt: "\n```\nrequire 'rubygems'\nrequire 'sinatra'\n\nget '/' do\n\"Hello World!\"\
    \nend\n\nrun Sinatra::Application\n```\n\nEach application is defined in a block,\
    \ labelled `server1` and `server2` respectively. Also inside these blocks is a\
    \ call to the uWSGI Consul plugin. This call connects to our Consul instance and\
    \ registers a service called `distributed_app` with an ID of `server1` or `server2`.\
    \ Each service is assigned a different port, `2001` and `2002` respectively.\n\
    \nWhen the framework runs this will create our two web application workers and\
    \ register a service for each on `Consul`. The application will use the local\
    \ `Consul` node to create the service with the `%h` configuration shortcut populating\
    \ the `Consul` URL with the right hostname.\n\n```\nurl=http://%h.node.consul:8500...\n\
    ```\n\nLastly, we’ve configured an `ENTRYPOINT` instruction to automatically run\
    \ our web application workers.\n\nLet’s build our image now.\n\n```bash\n$ sudo\
    \ docker build -t=\"jamtur01/distributed_app\" .\n```\n\nNote You can get our\
    \ `distributed_app` `Dockerfile` and configuration and application files [on GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/7/consul/).\n\
    \n## 7.2.6.2 Building our distributed client\n\nWe’re now going to create a `Dockerfile`\
    \ to build our `distributed_client` image. Let’s create a directory to hold our\
    \ image first.\n\n```bash\n$ mkdir distributed_client\n$ cd distributed_client\n\
    $ touch Dockerfile\n```\n\nNow let’s look at the `Dockerfile` for the `distributed_client`\
    \ application.\n\n```docker\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\
    \nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get -qqy update\nRUN apt-get -qqy install\
    \ ruby ruby-dev build-essential\nRUN gem install --no-ri --no-rdoc json\n\nRUN\
    \ mkdir -p /opt/distributed_client\nADD client.rb /opt/distributed_client/\n\n\
    WORKDIR /opt/distributed_client\n\nENTRYPOINT [ \"ruby\", \"/opt/distributed_client/client.rb\"\
    \ ]\nCMD []\n```\n\nThe `Dockerfile` installs Ruby and some prerequisite packages\
    \ and gems. It creates the `/opt/distributed_client` directory and makes it the\
    \ working directory. It copies our client application code, contained in the `client.rb`\
    \ file, into the `/opt/distributed_client` directory.\n\nLet’s take a quick look\
    \ at our application code now.\n\n```ruby\nrequire \"rubygems\"\nrequire \"json\"\
    \nrequire \"net/http\"\nrequire \"uri\"\nrequire \"resolv\"\n\nuri = URI.parse(\"\
    http://consul.service.consul:8500/v1/catalog/service/distributed_app\")\n\nhttp\
    \ = Net::HTTP.new(uri.host, uri.port)\nrequest = Net::HTTP::Get.new(uri.request_uri)\n\
    response = http.request(request)\n\nwhile true\n  if response.body == \"{}\"\n\
    \    puts \"There are no distributed applications registered in Consul\"\n   \
    \ sleep(1)\n  elsif\n    result = JSON.parse(response.body)\n    result.each do\
    \ |service|\n      puts \"Application #{service['ServiceName']} with element #{service[\"\
    ServiceID\"]} on port #{service[\"ServicePort\"]} found on node #{service[\"Node\"\
    ]} (#{service[\"Address\"]}).\"\n      dns = Resolv::DNS.new.getresources(\"distributed_app.service.consul\"\
    , Resolv::DNS::Resource::IN::A)\n      puts \"We can also resolve DNS - #{service['ServiceName']}\
    \ resolves to #{dns.collect { |d| d.address }.join(\" and \")}.\"\n      sleep(1)\n\
    \    end\n  end\nend\n```\n\nOur client checks the `Consul` HTTP API and the `Consul`\
    \ DNS for the presence of a service called `distributed_app`. It queries the host\
    \ `consul.service.consul` which is the DNS CNAME entry we saw earlier that contains\
    \ all the A records of our `Consul` cluster nodes. This provides us with a simple\
    \ DNS round robin for our queries.\n\nIf no service is present it puts a message\
    \ to that effect on the console. If it detects a `distributed_app` service then\
    \ it:\n\n*   Parses out the JSON output from the API call and returns some useful\
    \ information to the console.\n*   Performs a DNS lookup for any A records for\
    \ that service and returns them to the console.\n\nThis will allow us to see the\
    \ results of launching our `distributed_app` containers on our `Consul` cluster.\n\
    \nLastly our `Dockerfile` specifies an `ENTRYPOINT` instruction that runs the\
    \ `client.rb` application when the container is started.\n\nLet’s build our image\
    \ now.\n\n```bash\n$ sudo docker build -t=\"jamtur01/distributed_client\" .\n\
    ```\n\nNote You can get our `distributed_client` `Dockerfile` and configuration\
    \ and application files [on GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/7/consul/).\n\
    \n## 7.2.6.3 Starting our distributed application\n\nNow we’ve built the required\
    \ images we can launch our `distributed_app` application container on `larry`\
    \ and `curly`. We’ve assumed that you have `Consul` running as we’ve configured\
    \ it earlier in the chapter. Let’s start by running one application instance on\
    \ `larry`.\n\n```bash\nlarry$ sudo docker run --dns=172.17.0.1 -h $HOSTNAME -d\
    \ --name larry_distributed \\\njamtur01/distributed_app\n```\n\nHere we’ve launched\
    \ the `jamtur01/distributed_app` image and specified the `--dns` flag to add a\
    \ DNS lookup from the Docker server, here represented by the `docker0` interface\
    \ bridge IP address of `172.17.0.1`. As we’ve bound `Consul`’s DNS lookup when\
    \ we ran the `Consul` server this will allow the application to lookup nodes and\
    \ services in `Consul`. You should replace this with the IP address of your own\
    \ `docker0` interface.\n\nWe’ve also specified `-h` flag to set the hostname.\
    \ This is important because we’re using this hostname to tell uWSGI what `Consul`\
    \ node to register the service on. We’ve called our container `larry_distributed`\
    \ and run it daemonized.\n\nIf we check the log output from the container we should\
    \ see uWSGI starting our web application workers and registering the service on\
    \ `Consul`.\n\n```\nlarry$ sudo docker logs larry_distributed\n*** Starting uWSGI\
    \ 2.0.13.1 (64bit) on [Sat Aug  6 13:44:26 2016] *** \ncompiled with version:\
    \ 5.4.0 20160609\nos: Linux-4.4.0-31-generic #50-Ubuntu Jul 13 00:07:12 UTC 2016\n\
    \n. . .\n\nSat Aug  6 13:44:26 2016 - [consul] workers ready, let's register the\
    \ service to the agent\nspawned uWSGI mule 2 (pid: 13)\n[consul] service distributed_app\
    \ registered successfully\nSat Aug  6 13:44:27 2016 - [consul] workers ready,\
    \ let's register the service to the agent\n[consul] service distributed_app registered\
    \ successfully\n```\n\nWe see a subset of the logs here and that uWSGI has started.\
    \ The `Cons` plugin has constructed [a service entry](http://www.consul.io/docs/agent/services.html)\
    \ for each `distributed_app` worker and then registered them with `Consul`. If\
    \ we now look at the `Consul` web interface we should be able to see our new services.\n\
    \n![The distributed_app service in the Consul web interface.](images/00038.jpeg)\n\
    \nThe distributed_app service in the Consul web interface.\n\nLet’s start some\
    \ more web application workers on `curly` now.\n\n```bash\ncurly$ sudo docker\
    \ run --dns=172.17.0.1 -h $HOSTNAME -d --name curly_distributed \\\njamtur01/distributed_app\n\
    ```\n\nIf we check the logs and the `Consul` web interface we should now see more\
    \ services registered.\n\n![More distributed_app services in the Consul web interface.](images/00039.jpeg)\n\
    \nMore distributed_app services in the Consul web interface.\n\n## 7.2.6.4 Starting\
    \ our distributed application client\n\nNow we’ve got web application workers\
    \ running on `larry` and `curly` let’s start our client on `moe` and see if we\
    \ can query data from `Consul`.\n\n```bash\nmoe$ sudo docker run -ti --dns=172.17.0.1\
    \ --name moe_distributed_client jamtur01/distributed_client\n```\n\nThis time\
    \ we’ve run the `jamtur01/distributed_client` image on `moe` and created an interactive\
    \ container called `moe_distributed_client`. It should start emitting log output\
    \ like so:\n"
