    ```


    ### 2.10 升级 Docker


    安装 Docker 之后，升级它也很容易。如果你使用 `apt-get` 或 `yum` 通过原生包安装了 Docker，那么你也可以使用这些通道来升级它。例如，运行
    `apt-get update` 命令，然后安装新版本的 Docker。我们使用 `apt-get install` 命令是因为 `docker-engine`（以前称为
    `lxc-docker`）包通常被固定了版本。


    ```

    $ sudo apt-get update

    $ sudo apt-get install docker-engine

    ```


    ### 2.11 Docker 用户界面


    一旦你安装了 Docker，你还可能可以使用使用图形化界面来管理它。目前，有少量处于不同开发阶段的用户界面和 Web 控制可用，包括：


    * [Shipyard](http://shipyard-project.com/) - Shipyard 让你能够从单个管理界面管理 Docker 资源，包括容器、主机等。它是开源的，代码可以从
    https://github.com/ehazlett/shipyard 获取。

    * [Portainer](https://github.com/portainer/portainer) - Docker 的 UI 是一个允许与 Docker
    API 交互的 Web 界面。它使用 AngularJS 框架用 JavaScript 。

    * [Kitematic](https://kitematic.com/) - 是一个适用于 OS X 和 Windows 的 GUI，帮助你在本地运行 Docker
    并与 Docker Hub 交互。它是 Docker Inc 推出的免费产品。


