  trans: '

    由于容器被视为操作系统的客体（guest），它们有时被认为灵活性较低：它们通常只能运行与底层主机相同或类似的客体操作系统。例如，你可以在 Ubuntu 服务器上运行红帽企业
    Linux，但不能在 Ubuntu 服务器上运行微软 Windows。


    容器也被认为安全性不如虚拟机监控程序（hypervisor）虚拟化的完全隔离。反驳这一点的理由是，轻量级容器缺乏虚拟机所需的完整操作系统的庞大攻击面，也没有虚拟机监控程序层本身潜在的暴露风险。


    尽管存在这些局限性，容器已部署在各种用场景中。它们在多租户服务的大规模部署、轻量级沙箱方面非常受欢迎，而且尽管对其安全性存在担忧，也被用作进程隔离环境。事实上，容器最常见的示例之一是
    `chroot` 禁闭，它为运行的进程创建一个隔离的目录环境。如果攻击者攻破了禁闭中的运行进程，他们会发现自己被困在这个环境中，无法进一步破坏主机。


    更新的容器技术包括 [OpenVZ](http://openvz.org/)、Solaris Zones 以及如 [lxc](http://lxc.sourceforge.net/)
    这样的 Linux 容器。使用这些较新的技术，容器现在可以像独立的完整主机，而不仅仅是执行环境。在 Docker 的案例中，拥有现代 Linux 内核功能（如控制组
    cgroups 和命名空间 namespaces）意味着容器可以具有强大的隔离性、自己的网络和存储堆栈，以及允许多个容器在主机上友好共存的资源管理能力。


    容器被认为是一种精简技术，因为它们需要的开销有限。与传统的虚拟化或半虚拟化技术不同，它们不需要仿真层或虚拟机监控程序层，而是使用操作系统的正常系统调用接口。这减少了运行容器所需的开销，并允许主机上运行更高密度的容器。


    尽管历史悠久，容器尚未实现大规模采用。这很大程度上归于它们的复杂性：容器可能很复杂、难以设置，并且难以管理和自动化。Docker 旨在改变这一点。


    ## 1. 介绍 Docker


    Docker 是一个自动将应用程序部署到容器中的开源引擎。它由 [Docker, Inc](http://www.docker.com/) 团队编写（前身为
    dotCloud Inc，平台即服务 (PAAS) 市场的早期参与者）编写，并根据 Apache 2.0 许可证发布。


    注意免责声明与披露：我是 Docker Inc 的顾问。


    那么 Docker 的特殊之处何呢？Docker 在虚拟化容器执行环境之上添加了一个应用程序部署引擎。它旨在提供一个轻量且快速的环境来运行你的代码，并提供一个高效的工作流，将代码从你的笔记本传输到测试环境，然后进入生产环境。Docker
    极其简单。事实上，你可以在仅运行兼容的 Linux 内核和 `Docker` 二进制文件的最小主机上启动 Docker。Docker 的使命是提供：


    注意 Docker 的底层组件是一个名为 [Moby](https://github.com/moby/moby) 项目的一部分。这些组件被汇集在一起并[构建成](https://mobyproject.org/#moby-and-docker)
    终端用户工具。


    ### 1.1. 一种简单且轻量级的现实建模方式


    Docker 很快。你可以在几分钟内将应用程序 Docker 化。Docker 依赖于写复制（copy-on-write）模型，因此更改你的应用程序也极快：只有你想要更改的内容会被更改。


    然后你可以创建运行你应用程序的容器。大多数 Docker 容器的启动时间不到一秒。移除虚拟机监控器的开销意味着容器具有极高的性能，你可以在主机中封装更多容器，并最大限度地利用你的资源。


    ### 1.2. 职责的逻辑分离


    使用 Docker，开发者关心运行在容器内部的应用程序，而运维人员关心容器的管理。Docker 的设计旨在通过确保开发者编写代码的环境与应用程序部署的环境相匹配来增强一致性。这减少了“在开发环境中运行良好，现在却变成了运维问题”的风险。


    ### 1.3. 快速、高效的开发生命周期


    Docker 旨在缩短代码编写与代码测试、部署和使用之间的周期。它旨在让你的应用程序可迁移、易于构建且易于协作。


    ### 1.4. 鼓励面向服务的架构


    Docker 同时也鼓励面向服务和[微服务](http://martinfowler.com/articles/microservices.html)架构。Docker
    建议每个容器运行单个应用程序或进程。这促进了分布式应用程序模型，其中应用程序或服务由一系列相互连接的容器表示。这使得你的应用程序分发、扩展、调试和内省变得简单。


    注意 如果你不愿意，不需要这种方式构建应用程序。你可以轻松地在单个容器内运行多进程应用程序。


    ## 2. Docker 组件


    让我们来看看组成 Docker 社区版的核心组件：


    * Docker 客户端和服务器，也称为 Docker Engine。

    * Docker 镜像 (Images)

    * 注册表 (Registries)

    * Docker 容器 (Containers)


    ### 2.1. Docker 客户端和服务器


    Docker 是一个客户端-服务器应用程序。Docker 客户端与 Docker 服务器或守护进程通信，由后者完成所有工作。你有时也会看到 Docker 守护进程被称为
    Docker Engine。Docker 自带了一个命令行客户端二进制文件 `docker`，以及一个[完整的 RESTful API](http://docs.docker.com/reference/api/docker_remote_api/)
    与守护进程交互：`dockerd`。你可以在同一主机上运行 Docker 守护进程和客户端，也可以将本地 Docker 客户端连接到另一个主机上的远程守护进程。你可以在这里看到
    Docker 的架构：


    ![Docker architecture](img/00002.jpeg)


    ### 2.2. Docker 镜像


    镜是 Docker 世界的构建块。你从镜像启动容器。镜是 Docker 生命周期中的“构建”部分。它们具有分层格式，使用联合文件系统（Union file
    systems），通过一系列指令逐步构建。例如：


    * 添加一个文件。

    * 运行一个命令。

    * 打开一个端口。


    你可以将镜像视为容器的“源代码”。它们具有高度的可移植性，并且可以共享、存储和更新。在书中，我们将学习如何使用现有镜像以及构建我们自己的镜像。


    ### 2.3. 注册表


    Docker 将你构建的镜像存储在注册表中。注册表有两种类型：公共和私有。Docker, Inc. 运营着镜像的公共注册表，称为 [Docker Hub](http://hub.docker.com)。你可以在
    Docker Hub 上[创建账户](https://hub.docker.com/account/signup/) 并使用它来共享和存储你自己的镜像。


    Docker Hub 还包含（截至上次统计）超过 10,000 个由他人构建并共享的镜像。想要一个用于 [Nginx Web 服务器](https://hub.docker.com/search?q=nginx)
    的 Docker 镜像、[Asterisk 开源交换机](https://hub.docker.com/search?q=Asterisk) 或 [MySQL
    数据库](https://hub.docker.com/search?q=mysql) 的 Docker 镜像吗？所有这些都可用，还有更多内容。


    你还可以在 Docker Hub 上存储你想保持私有的镜像。这些镜像可能包含源代码或你希望保持安全或仅与团队或组织其他成员共享的专有信息。

