    \ if you wish.\n\nWe can then test the `docker` binary by running it against this\
    \ daemon.\n\n```\n$ ~/moby/bundles/1.13.0-dev/binary-client/docker version\nClient:\n\
    \ Version:      1.13.0-dev\n API version:  1.25\n Go version:   go1.6.3\n Git\
    \ commit:   04e021d\n Built:        Tue Aug  9 13:58:52 2016\n OS/Arch:      linux/amd64\n\
    \nServer:\n Version:      1.13.0-dev\n API version:  1.25\n Go version:   go1.6.3\n\
    \ Git commit:   04e021d\n Built:        Tue Aug  9 13:58:52 2016\n OS/Arch:  \
    \    linux/amd64\n```\n\nYou can see that we’re running a `1.13.0-dev` client,\
    \ this binary, against the `1.13.0-dev` daemon we just started. You can use this\
    \ combination to test and ensure any changes you’ve made to the Docker source\
    \ are working correctly.\n\n### 9.3.6 Running the tests\n\nIt’s also important\
    \ to ensure that all of the Docker tests pass before contributing code back upstream.\
    \ To execute all the tests, you need to run this command:\n\n```\n$ sudo make\
    \ test\n```\n\nThis command will again upload the current source as build context\
    \ to an image and then create a development image. A container will be launched\
    \ from this image, and the test will run inside it. Again, this may take some\
    \ time for the initial build.\n\nIf the tests are successful, then the end of\
    \ the output should look something like this:\n\n```\n. . .\n[PASSED]: save -\
    \ save a repo using stdout\n[PASSED]: load - load a repo using stdout\n[PASSED]:\
    \ save - save a repo using -o\n[PASSED]: load - load a repo using -i\n[PASSED]:\
    \ tag - busybox -> testfoobarbaz\n[PASSED]: tag - busybox's image ID -> testfoobarbaz\n\
    [PASSED]: tag - busybox fooo/bar\n[PASSED]: tag - busybox fooaa/test\n[PASSED]:\
    \ top - sleep process should be listed in non privileged mode\n[PASSED]: top -\
    \ sleep process should be listed in privileged mode\n[PASSED]: version - verify\
    \ that it works and that the output is properly formatted\nPASS\nPASS    github.com/docker/docker/integration-cli\
    \    178.685s\n```\n\nTip You can use the `$TESTFLAGS` environment variable to\
    \ pass in arguments to the test run.\n\n### 9.3.7 Use Docker inside our development\
    \ environment\n\nYou can also launch an interactive session inside the newly built\
    \ development container:\n\n```\n$ sudo make shell\n```\n\nTo exit the container,\
    \ type `exit` or `Ctrl-D`.\n\n### 9.3.8 Submitting a pull request\n\nIf you’re\
    \ happy with your documentation update, bug fix, or new feature, you can submit\
    \ a pull request for it on GitHub. To do so, you should fork the Docker repository\
    \ and make changes on your fork in a feature branch:\n\n*   If it is a bug fix\
    \ branch, name it XXXX-something, where XXXX is the number of the issue.\n\n*\
    \   If it is a feature branch, create a feature issue to announce your intentions,\
    \ and name it XXXX-something, where XXXX is the number of the issue.\n\nYou should\
    \ always submit unit tests for your changes. Take a look at the existing tests\
    \ for inspiration. You should also always run the full test suite on your branch\
    \ before submitting a pull request.\n\nAny pull request with a feature in it should\
    \ include updates to the documentation. You should use the process above to test\
    \ your documentation changes before you submit your pull request. There are also\
    \ specific guidelines (as we mentioned above) for documentation that you should\
    \ follow.\n\nWe have some other simple rules that will help get your pull request\
    \ reviewed and merged quickly:\n\n*   Always run `gofmt -s -w file.go` on each\
    \ changed file before committing your changes. This produces consistent, clean\
    \ code.\n\n*   Pull requests descriptions should be as clear as possible and include\
    \ a reference to all the issues that they address.\n\n*   Pull requests must not\
    \ contain commits from other users or branches.\n\n*   Commit messages must start\
    \ with a capitalized and short summary (50 characters maximum) written in the\
    \ imperative, followed by an optional, more detailed explanatory text that is\
    \ separated from the summary by an empty line.\n\n*   Squash your commits into\
    \ logical units of work using `git rebase -i` and `git push -f`. Include documentation\
    \ changes in the same commit so that a revert would remove all traces of the feature\
    \ or fix.\n\nLastly, the Docker project uses a Developer Certificate of Origin\
    \ to verify that you wrote any code you submit or otherwise have the right to\
    \ pass it on as an open-source patch. You can read about why we do this at [http://blog.docker.com/2014/01/docker-code-contributions-require-developer-certificate-of-origin/](http://blog.docker.com/2014/01/docker-code-contributions-require-developer-certificate-of-origin/).\
    \ The certificate is easy to apply. All you need to do is add a line to each Git\
    \ commit message.\n\n```\nDocker-DCO-1.1-Signed-off-by: Joe Smith <joe.smith@email.com>\
    \ (github: github_handle)\n```\n\nNote You must use your real name. We do not\
    \ allow pseudonyms or anonymous contributions for legal reasons.\n\nThere are\
    \ several small exceptions to the signing requirement. Currently these are:\n\n\
    *   Your patch fixes spelling or grammar errors.\n\n*   Your patch is a single-line\
    \ change to documentation contained in the Documentation repository.\n\n*   Your\
    \ patch fixes Markdown formatting or syntax errors in the documentation contained\
    \ in the Documentation repository.\n\nIt’s also pretty easy to automate the signing\
    \ of your Git commits using the `git commit -s` command.\n\nNote The signing script\
    \ expects to find your GitHub user name in `git config –get github.user`. You\
    \ can set this option with the `git config –set github.user username` command.\n\
    \n### 9.3.9 Merge approval and maintainers\n\nOnce you’ve submitted your pull\
    \ request, it will be reviewed, and you will potentially receive feedback. Docker\
    \ uses a maintainer system much like the Linux kernel. Each component inside Docker\
    \ is managed by one or more maintainers who are responsible for ensuring the quality,\
    \ stability, and direction of that component."
