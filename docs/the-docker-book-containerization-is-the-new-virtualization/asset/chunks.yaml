  trans: "\n\n你也可以运行自己的私有仓库，我们将在第 4 章向你展示如何做到这一点。这允许你在自己的防火墙后存储镜像，这可能是某些组织的要求。\n\n\
    ### 1.2.4 容器\n\nDocker 帮助你构建并部署容器，你可以在容器内部封装你的应用程序和服务。正如我们刚刚学的那样，容器是从镜像启动的，并可以包含一个或多个运行中的进程。你可以将镜像视为\
    \ Docker 的构建或打包方面，而将容器视为 Docker 的运行或执行方面。\n\n一个 Docker 容器是：\n\n*   一种镜像格式。\n*\
    \   一组标准操作。\n*   一个执行环境。\n\nDocker 借用了用于全球运输货物的标准集装箱的概念作为其容器的模型。但 Docker 容器运输的不是货物，而是软件。\n\
    \n每个容器都包含一个软件镜像——它的“货物”——就像它的物理实体一样，它允许执行一组操作。例如，它可以被创建、启动、停止、重启和销毁。\n\n就像运输集装箱一样，Docker\
    \ 在执行这些操作时并不关心容器的内容；例如，容器是 Web 服务器、数据库还是应用程序服务器。每个容器的加载方式与其他任何容器都是一样的。\n\nDocker\
    \ 也不关心你将容器部署到哪里：你可以在笔记本电脑上构建，上传到仓库，然后下载到物理或虚拟服务器，进行测试，部署到由几十个 Amazon EC2 主机组成的集群并运行。像普通的运输集装箱一样，它是可交换的、可堆叠的、可移植的，并且尽可能通用。\n\
    \n通过 Docker，我们可以快速构建应用程序服务器、消息总线、实用设备、应用程序的 CI 测试平台，或者数千种其他可能的应用程序、服务和工具之一。它可以构建本地的、自包含的测试环境，也可以为了生产或开发目的复制复杂的应用栈。可能的用例是无尽的。\n\
    \n### 1.2.5 Compose 和 Swarm\n\n除了孤立的容器，我们还可以以栈和集群的形式运行 Docker 容器，即 Docker 所说的\
    \ swarms（集群）。Docker 生态系统包含另外两个工具：\n\n*   `Docker Compose` - 允许你运行容器栈来表示应用程序栈，例如\
    \ Web 服务器、应用程序服务器和数据库服务器共同运行以为特定应用程序提供服务。\n*   `Docker Swarm` - 允许你创建容器集群（称为 swarms），让你能够运行可扩展的负载。\n\
    \n我们将在第 7 章查看 `Docker Compose` 和 `Swarm`。\n\n### 1.3 你可以用 Docker 做什么？\n\n所以，你为什么要关注\
    \ Docker 或通用的容器呢？我们简要讨论了容器提供的隔离性；结果是它们是各种测试目的的极佳沙箱。此外，由于它们的“标准”性质，它们也是服务的极佳构建模块。Docker\
    \ 在现实中运行的一些示例包括：\n\n*   帮助让你的本地开发和构建工作流更快、更高效、更轻量化。本地开发者可以构建、运行和共享 Docker 容器。容器可以在开发环境中构建并推广到测试环境，进而推广到生产环境。\n\
    *   在多个环境中一致地运行独立的服务和应用程序，这一概念在面向服务的架构和高度依赖微服务的部署中特别有用。\n*   使用 `Docker` 创建隔离实例来运行测试，例如由持续集成\
    \ (CI) 套件（如 `Jenkins CI`）启动的测试。\n*   在部署到生产环境之前，在本地主机构建并测试复杂的应用程序和架构。\n*   构建多用户平台即服务\
    \ (PAAS) 基础设施。\n*   为开发、测试和教学技术（如 Unix shell 或编程语言）提供轻量级的独立沙箱环境。\n*   软件即服务 (SaaS)\
    \ 应用程序；\n*   高性能、大规模的主机部署。\n\n你可以在此博客文中查看构建在 Docker 生态系统及其周围的一些早期项目列表：[这里](http://blog.docker.com/2013/07/docker-projects-from-the-docker-community/)。\n\
    \n### 1.4 结合配置管理的 Docker\n\n自从 Docker 发布以来，有很多讨论在乎 Docker 如何与 `Puppet` 和 `Chef`\
    \ 等配置管理工具相结合。Docker 包含了镜像构建和镜像管理解决方案。现代配置管理工具的驱动因素之一是对[“黄金镜像”模型](https://web.archive.org/web/20090207105003/http://madstop.com/2009/02/04/golden-image-or-foil-ball)\
    \ 的响应。使用黄金镜像，你最终会面临巨大且不可管理的镜像泛滥：大量处于不同版本状态的（已部署）复杂镜像。随着镜像使用量的增长，你会在环境中制造随机性并加剧熵增。镜像往往也是沉重且难以处理的。这通常迫使由于底层镜像缺乏适当的活性，而在镜像之上进行手动更改或添加多层偏差和未管理的配置。\n\
    \n与传统的镜像模型相比，Docker 要轻量得多：镜像是分层的，你可以对它们进行快速迭代。虽然有一些正合理的论据表明，这些属性缓解了传统镜像带来的许多管理问题。然而，目前尚不清楚这种缓解是否就代表了完全替换或补充配置管理工具的能力。通过配置管理工具提供的幂等性和自省功能，可以获得惊人的力量和控制力。Docker\
    \ 本身仍然需要在主机上安装、管理和部署。该主机也需要管理。反之，Docker 容器可能需要被编排、管理和部署，通常与外部服务和工具结合使用，而这些都是配置管理工具非常擅长的能力。\n\
    \n同样明显，Docker 代表（或者更准确地说鼓励）主机、应用程序和服务的某些不同特征和架构：它们可以是短期的、不可变的、可丢弃的以及面向服务的。这些行为并不与配置管理工具的需求强烈共鸣。由于这些行为，你很少担心状态的长期管理，熵增也不再是问题，因为容器存活的时间不足以产生这种影响，而且重建状态通常比修复状态便宜得多。\n\
    \n然而，并非所有基础设施都能用这些行为来表示。Docker 的理想负载可能会与传统的基础设施部署共存一段时间。长期主机（可能是运行在物理硬件上的主机）在许多组织中仍发挥作用。由于这些多样化的管理需求，结合对\
    \ Docker 的管理，大多数组织都会部署 Docker 和配置管理工具。\n\n### 1.5 Docker 技术组件\n\nDocker 可以在运行现代\
    \ Linux 内核的任何 x64 主机上运行；建议内核版本为 3.10 及更高。它的开销低，可以在服务器、桌面或笔记本电脑上运行。在虚拟机内部，你可以在\
    \ OS X 和 Microsoft Windows 上部署 Docker。它包括：\n\n*   Docker 原原生 Linux 容器格式。\n*  \
    \ [Linux 内核命名空间](http://lwn.net/Articles/531114/)，为文件系统、进程和网络提供隔离。\n    *   文件系统隔离：每个容器都有自己的根文件系统。\n\
    \    *   进程隔离：每个容器运行在自己的进程环境中。\n\n"
- fmt: "\n- Network isolation: separate virtual interfaces and IP addressing between\
    \ containers.\n- Resource isolation and grouping: resources like CPU and memory\
    \ are allocated individually to each Docker container using the [cgroups](http://en.wikipedia.org/wiki/Cgroups),\
    \ or control groups, kernel feature.\n- [Copy-on-write](http://en.wikipedia.org/wiki/Copy-on-write):\
    \ filesystems are created with copy-on-write, meaning they are layered and fast\
    \ and require limited disk usage.\n- Logging: `STDOUT`, `STDERR` and `STDIN` from\
    \ the container are collected, logged, and available for analysis or trouble-shooting.\n\
    - Interactive shell: You can create a pseudo-tty and attach to `STDIN` to provide\
    \ an interactive shell to your container.\n\n## 1.6 What’s in the book?\n\nIn\
    \ this book, we walk you through installing, deploying, managing, and extending\
    \ Docker. We do that by first introducing you to the basics of Docker and its\
    \ components. Then we start to use Docker to build containers and services to\
    \ perform a variety of tasks.\n\nWe take you through the development life cycle,\
    \ from testing to production, and see where Docker fits in and how it can make\
    \ your life easier. We make use of Docker to build test environments for new projects,\
    \ demonstrate how to integrate Docker with continuous integration workflow, and\
    \ then how to build application services and platforms. Finally, we show you how\
    \ to use Docker’s API and how to extend Docker yourself.\n\nWe teach you how to:\n\
    \n- Install Docker.\n- Take your first steps with a Docker container.\n- Build\
    \ Docker images.\n- Manage and share Docker images.\n- Run and manage more complex\
    \ Docker containers and stacks of Docker containers.\n- Deploy Docker containers\
    \ as part of your testing pipeline.\n- Build multi-container applications and\
    \ environments.\n- Introduce the basics of Docker orchestration with Docker Compose,\
    \ Consul, and Swarm.\n- Explore the Docker API.\n- Getting Help and Extending\
    \ Docker.\n\nIt is recommended that you read through every chapter. Each chapter\
    \ builds on your Docker knowledge and introduces new features and functionality.\
    \ By the end of the book you should have a solid understanding of how to work\
    \ with Docker to build standard containers and deploy applications, test environments,\
    \ and standalone services.\n\n## 1.7 Docker resources\n\n- [Docker homepage](http://www.docker.com/)\n\
    - [Docker Hub](http://hub.docker.com)\n- [Docker blog](http://blog.docker.com/)\n\
    - [Docker documentation](http://docs.docker.com/)\n- [Docker Getting Started Guide](https://docs.docker.com/docker-for-mac/)\n\
    - [Docker code on GitHub](https://github.com/docker/docker)\n- [Docker Forge](https://github.com/dockerforge)\
    \ - collection of Docker tools, utilities, and services.\n- [Docker mailing list](https://groups.google.com/forum/#!forum/docker-user)\n\
    - [The Docker Forum](https://forums.docker.com/)\n- Docker on IRC: `irc.freenode.net`\
    \ and channel `#docker`\n- [Docker on Twitter](http://twitter.com/docker)\n- Get\
    \ [Docker help](http://stackoverflow.com/search?q=docker)\n\nIn addition to these\
    \ resources in Chapter 9 you’ll get a detailed explanation of where and how to\
    \ get help with Docker.\n\n# 2 Installing Docker\n\nInstalling Docker is quick\
    \ and easy. Docker is currently supported on a wide variety of Linux platforms,\
    \ including shipping as part of Ubuntu and Red Hat Enterprise Linux (RHEL). Also\
    \ supported are various derivative and related distributions like Debian, CentOS,\
    \ Fedora, Oracle Linux, and many others. Using a virtual environment, you can\
    \ install and run Docker on OS X and Microsoft Windows.\n\nCurrently, the Docker\
    \ team recommends deploying Docker on Ubuntu, Debian or the RHEL family (CentOS,\
    \ Fedora, etc) hosts and makes available packages that you can use to do this.\
    \ In this chapter, I’m going to show you how to install Docker in four different\
    \ but complementary environments:\n\n- On a host running Ubuntu.\n- On a host\
    \ running Red Hat Enterprise Linux or derivative distribution.\n- On OS X using\
    \ [Docker for Mac](https://docs.docker.com/docker-for-mac/).\n- On Microsoft Windows\
    \ using [Docker for Windows](https://docs.docker.com/docker-for-windows/).\n\n\
    Tip Docker for Mac and Docker for Windows are a collection of components that\
    \ installs everything you need to get started with Docker. It includes a tiny\
    \ virtual machine shipped with a wrapper script to manage it. The virtual machine\
    \ runs the daemon and provides a local Docker daemon on OS X and Microsoft Windows.\
    \ The Docker client binary, `docker`, is installed natively on these platforms\
    \ and connected to the Docker daemon running in the virtual machine. It replaces\
    \ the legacy Docker Toolbox and Boot2Docker.\n\nDocker runs on a number of other\
    \ platforms, including Debian, [SUSE](https://docs.docker.com/engine/installation/linux/suse/),\
    \ [Arch Linux](https://docs.docker.com/engine/installation/linux/archlinux/),\
    \ [CentOS](https://docs.docker.com/engine/installation/linux/centos/), and [Gentoo](https://docs.docker.com/engine/installation/linux/gentoolinux/).\
    \ It’s also supported on several Cloud platforms including Amazon EC2, Rackspace\
    \ Cloud, and Google Compute Engine.\n\nTip You can find a full list of installation\
    \ targets in the [Docker installation guide](https://docs.docker.com/engine/installation/).\n\
    \nI’ve chosen these four methods because they represent the environments that\
    \ are most commonly used in the Docker community. For example, your developers\
    \ and sysadmins may wish to start with building containers on OS X or Windows\
    \ and then promote these containers to a testing, staging, or production environment.\
    \ I recommend you step through at least the Ubuntu or the RHEL installation to\
    \ get an idea of how to install it.\n\nTip As with all installation processes,\
    \ I also recommend using tools like [Puppet](http://www.puppetlabs.com) or [Chef](http://opscode.com)\
    \ to install Docker rather than using a manual process. For example, you can find\
    \ a Puppet module to install Docker [here](https://docs.docker.com/admin/puppet/)\
    \ and a Chef cookbook [here](https://supermarket.chef.io/cookbooks/docker).\n\n\
    ## 2.1 Requirements\n\nFor all of these installation types, Docker has some basic\
    \ prerequisites. To use Docker you must:\n\n- Be running a 64-bit architecture\
    \ (currently x86_64 and amd64 only). 32-bit architectures are NOT currently supported.\n\
    - Be running a Linux 3.10 or later kernel. Some earlier kernels from 2.6.x and\
    \ later will run Docker successfully.\n- The kernel must support an appropriate\
    \ storage driver. For example,\n    - [Device Mapper](http://en.wikipedia.org/wiki/Device_mapper)\n\
    \    - [AUFS](http://en.wikipedia.org/wiki/Aufs)\n    - [vfs](http://en.wikipedia.org/wiki/Virtual_file_system)\n\
    \    - [btrfs](http://en.wikipedia.org/wiki/Btrfs)\n    - [ZFS](https://en.wikipedia.org/wiki/ZFS)\
    \ (introduced in Docker 1.7)\n    - The default storage driver is usually Device\
    \ Mapper or AUFS.\n- [cgroups](http://en.wikipedia.org/wiki/Cgroups) and [namespaces](https://en.wikipedia.org/wiki/Cgroups#NAMESPACE-ISOLATION)\
    \ kernel features must be supported and enabled.\n\n## 2.2 Installing on Ubuntu\
    \ and Debian\n\nInstalling Docker on Ubuntu and Debian is currently officially\
    \ supported on a selection of releases:\n\n- Ubuntu Yakkety 16.10 (64-bit)\n-\
    \ Ubuntu Xenial 16.04 (64-bit)\n- Ubuntu Trusty 14.04 (LTS) (64-bit)\n- Debian\
    \ Stretch (64-bit)\n- Debian 8.0 Jessie (64-bit)\n- Debian 7.7 Wheezy (64-bit)\n"
