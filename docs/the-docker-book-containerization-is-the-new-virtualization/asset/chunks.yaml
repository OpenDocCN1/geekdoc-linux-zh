    \      end\nend\n```\n\nNote You can see the full source for our updated Redis-enabled\
    \ Sinatra application at [The Docker Book site](https://github.com/turnbullpress/dockerbook-code).\n\
    \nOur new application is basically the same as our previous application with support\
    \ for Redis added. We now create a connection to a Redis database on a host called\
    \ `db` on port `6379`. We also post our parameters to that Redis database and\
    \ then get them back from it when required.\n\nWe also need to ensure that the\
    \ `webapp_redis/bin/webapp` binary is executable prior to using it using the `chmod`\
    \ command.\n\n```\n$ chmod +x webapp_redis/bin/webapp\n```\n\n#### 5.2.3.2 Building\
    \ a Redis database image\n\nTo build our Redis database, we’re going to create\
    \ a new image. Let’s create a directory, `redis` inside our `sinatra` directory,\
    \ to hold any associated files we’ll need for the Redis container build.\n\n```\n\
    $ mkdir redis\n$ cd redis\n```\n\nInside the `sinatra/redis` directory let’s start\
    \ with another `Dockerfile` for our Redis image.\n\n```\nFROM ubuntu:16.04\nLABEL\
    \ maintainer=\"james@example.com\"\nENV REFRESHED_AT 2016-06-01\nRUN apt-get -yqq\
    \ update; apt-get -yqq install redis-server redis-tools\nEXPOSE 6379\nENTRYPOINT\
    \ [\"/usr/bin/redis-server\" ]\nCMD []\n```\n\nWe’ve specified the installation\
    \ of the Redis server, exposed port `6379`, and specified an `ENTRYPOINT` that\
    \ will launch that Redis server. Let’s now build that image and call it `jamtur01/redis`.\n\
    \n```\n$ sudo docker build -t jamtur01/redis .\n```\n\nNow let’s create a container\
    \ from our new image.\n\n```\n$ sudo docker run -d -p 6379 --name redis jamtur01/redis\n\
    2df899db52baf469633459fa2abd34148ae4456a8c4a2343a0f372f2ee407756\n```\n\nWe’ve\
    \ launched a new container named `redis` from our `jamtur01/redis` image. Note\
    \ that we’ve specified the `-p` flag to publish port `6379`. Let’s see what port\
    \ it’s running on.\n\n```\n$ sudo docker port redis 6379\n0.0.0.0:49161\n```\n\
    \nOur Redis port is published on port `49161`. Let’s try to connect to that Redis\
    \ instance now.\n\nWe’ll need to install the Redis client locally to do the test.\
    \ This is usually the `redis-tools` package on Ubuntu.\n\n```\n$ sudo apt-get\
    \ -y install redis-tools\n```\n\nOr the `redis` package on Red Hat and related\
    \ distributions.\n\n```\n$ sudo yum install -y -q redis\n```\n\nThen we can use\
    \ the `redis-cli` command to check our Redis server.\n\n```\n$ redis-cli -h 127.0.0.1\
    \ -p 49161\nredis 127.0.0.1:49161>\n```\n\nHere we’ve connected the Redis client\
    \ to `127.0.0.1` on port `49161` and verified that our Redis server is working.\
    \ You can use the `quit` command to exit the Redis CLI interface.\n\n### 5.2.4\
    \ Connecting our Sinatra application to the Redis container\n\nLet’s now update\
    \ our Sinatra application to connect to Redis and store our incoming parameters.\
    \ In order to do that, we’re going to need to be able to talk to the Redis server.\
    \ There are two ways we could do this using:\n\n*   Docker’s own internal network.\n\
    \n*   From Docker 1.9 and later, using Docker Networking and the `docker network`\
    \ command.\n\nSo which method should I choose? Well the first method, Docker’s\
    \ internal network, is not an overly flexible or powerful solution. We’re mostly\
    \ going to discuss it to introduce you to how Docker networking functions. We\
    \ don’t recommend it as a solution for connecting containers.\n\nThe more realistic\
    \ method for connecting containers is Docker Networking.\n\n*   Docker Networking\
    \ can connect containers to each other across different hosts.\n\n*   Containers\
    \ connected via Docker Networking can be stopped, started or restarted without\
    \ needing to update connections.\n\n*   With Docker Networking you don’t need\
    \ to create a container before you can connect to it. You also don’t need to worry\
    \ about the order in which you run containers and you get internal container name\
    \ resolution and discovery inside the network.\n\nWe’re going to look at Docker\
    \ Networking for connecting Docker containers together in the following sections.\n\
    \n### 5.2.5 Docker internal networking\n\nThe first method involves Docker’s own\
    \ network stack. So far, we’ve seen Docker containers exposing ports and binding\
    \ interfaces so that container services are published on the local Docker host’s\
    \ external network (e.g., binding port 80 inside a container to a high port on\
    \ the local host). In addition to this capability, Docker has a facet we haven’t\
    \ yet seen: internal networking.\n\nEvery Docker container is assigned an IP address,\
    \ provided through an interface created when we installed Docker. That interface\
    \ is called `docker0`. Let’s look at that interface on our Docker host now.\n\n\
    Tip Since Docker 1.5.0 IPv6 addresses are also supported. To enable this run the\
    \ Docker daemon with the `–ipv6` flag.\n\n```\n$ ip a show docker0\n4: docker0:\
    \ <BROADCAST,MULTICAST,UP,LOWER_UP> mtu 1500 qdisc noqueue state UP\n    link/ether\
    \ 06:41:69:71:00:ba brd ff:ff:ff:ff:ff:ff\n    inet 172.17.42.1/16 scope global\
    \ docker0\n    inet6 fe80::1cb3:6eff:fee2:2df1/64 scope link\n    valid_lft forever\
    \ preferred_lft forever\n. . .\n```\n\nNote Depending on your distribution, you\
    \ may need the `iproute2` package to run the `ip` command.\n\nThe `docker0` interface\
    \ has an RFC1918 private IP address in the `172.16-172.30` range. This address,\
    \ `172.17.42.1`, will be the gateway address for the Docker network and all our\
    \ Docker containers.\n\nTip Docker will default to `172.17.x.x` as a subnet unless\
    \ that subnet is already in use, in which case it will try to acquire another\
    \ in the `172.16-172.30` ranges.\n\nThe `docker0` interface is a virtual Ethernet\
    \ bridge that connects our containers and the local host network. If we look further\
    \ at the other interfaces on our Docker host, we’ll find a series of interfaces\
    \ starting with `veth`.\n\n```\nvethec6a  Link encap:Ethernet  HWaddr 86:e1:95:da:e2:5a\n\
    \  inet6 addr: fe80::84e1:95ff:feda:e25a/64 Scope:Link\n. . .\n```\n\nEvery time\
    \ Docker creates a container, it creates a pair of peer interfaces that are like\
    \ opposite ends of a pipe (i.e., a packet sent on one will be received on the\
    \ other). It gives one of the peers to the container to become its `eth0` interface\
    \ and keeps the other peer, with a unique name like `vethec6a`, out on the host\
    \ machine. You can think of a `veth` interface as one end of a virtual network\
    \ cable. One end is plugged into the `docker0` bridge, and the other end is plugged\
    \ into the container. By binding every `veth*` interface to the `docker0` bridge,\
    \ Docker creates a virtual subnet shared between the host machine and every Docker\
    \ container.\n\nLet’s look inside a container now and see the other end of this\
    \ pipe.\n\n```\n$ sudo docker run -t -i ubuntu /bin/bash\nroot@b9107458f16a:/#\
    \ hostname -I\n172.17.0.29\n```\n\nWe see that Docker has assigned an IP address,\
    \ `172.17.0.29`, for our container that will be peered with a virtual interface\
    \ on the host side, allowing communication between the host network and the container.\n\
    \nLet’s trace a route out of our container and see this now.\n\n```\nroot@b9107458f16a:/#\
    \ apt-get -yqq update; apt-get install -yqq traceroute\n. . .\nroot@b9107458f16a:/#\
    \ traceroute google.com\ntraceroute to google.com (74.125.228.78), 30 hops max,\
    \ 60 byte packets\n 1  172.17.42.1 (172.17.42.1)  0.078 ms  0.026 ms  0.024 ms\n\
    . . .\n15  iad23s07-in-f14.1e100.net (74.125.228.78)  32.272 ms  28.050 ms  25.662\
    \ ms\n```\n\nWe see that the next hop from our container is the `docker0` interface\
    \ gateway IP `172.17.42.1` on the host network.\n\nBut there’s one other piece\
    \ of Docker networking that enables this connectivity: firewall rules and NAT\
    \ configuration allow Docker to route between containers and the host network."
