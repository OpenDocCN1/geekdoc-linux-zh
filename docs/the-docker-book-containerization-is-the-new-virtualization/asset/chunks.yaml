    XML，Jenkins 可以读取该格式。我们很快就会看到这种转换的结果。


    回到我们的脚本。我们正在根据这个 `Dockerfile` 构建镜像。接下来，我们使用 `$WORKSPACE` 变量创建一个名为 `$MNT` 的新环境变量。这是一个由
