  raw: 'As a result of their status as guests of the operating system, containers
    are sometimes seen as less flexible: they can generally only run the same or a
    similar guest operating system as the underlying host. For example, you can run
    Red Hat Enterprise Linux on an Ubuntu server, but you can’t run Microsoft Windows
    on top of an Ubuntu server.


    Containers have also been seen as less secure than the full isolation of hypervisor
    virtualization. Countering this argument is that lightweight containers lack the
    larger attack surface of the full operating system needed by a virtual machine
    combined with the potential exposures of the hypervisor layer itself.


    Despite these limitations, containers have been deployed in a variety of use cases.
    They are popular for hyperscale deployments of multi-tenant services, for lightweight
    sandboxing, and, despite concerns about their security, as process isolation environments.
    Indeed, one of the more common examples of a container is a chroot jail, which
    creates an isolated directory environment for running processes. Attackers, if
    they breach the running process in the jail, then find themselves trapped in this
    environment and unable to further compromise a host.


    More recent container technologies have included [OpenVZ](http://openvz.org/),
    Solaris Zones, and Linux containers like [lxc](http://lxc.sourceforge.net/). Using
    these more recent technologies, containers can now look like full-blown hosts
    in their own right rather than just execution environments. In Docker’s case,
    having modern Linux kernel features, such as control groups and namespaces, means
    that containers can have strong isolation, their own network and storage stacks,
    as well as resource management capabilities to allow friendly co-existence of
    multiple containers on a host.


    Containers are generally considered a lean technology because they require limited
    overhead. Unlike traditional virtualization or paravirtualization technologies,
    they do not require an emulation layer or a hypervisor layer to run and instead
    use the operating system’s normal system call interface. This reduces the overhead
    required to run containers and can allow a greater density of containers to run
    on a host.


    Despite their history containers haven’t achieved large-scale adoption. A large
    part of this can be laid at the feet of their complexity: containers can be complex,
    hard to set up, and difficult to manage and automate. Docker aims to change that.


    ## 1.1 Introducing Docker


    Docker is an open-source engine that automates the deployment of applications
    into containers. It was written by the team at [Docker, Inc](http://www.docker.com/)
    (formerly dotCloud Inc, an early player in the Platform-as-a-Service (PAAS) market),
    and released by them under the Apache 2.0 license.


    Note Disclaimer and disclosure: I am an advisor at Docker Inc.


    So what is special about Docker? Docker adds an application deployment engine
    on top of a virtualized container execution environment. It is designed to provide
    a lightweight and fast environment in which to run your code as well as an efficient
    workflow to get that code from your laptop to your test environment and then into
    production. Docker is incredibly simple. Indeed, you can get started with Docker
    on a minimal host running nothing but a compatible Linux kernel and a Docker binary.
    Docker’s mission is to provide:


    Note Docker’s underlying components are part of a project called [Moby](https://github.com/moby/moby).
    These are brought together and [constructed into](https://mobyproject.org/#moby-and-docker)
    the end user tool.


    ### 1.1.1 An easy and lightweight way to model reality


    Docker is fast. You can Dockerize your application in minutes. Docker relies on
    a copy-on-write model so that making changes to your application is also incredibly
    fast: only what you want to change gets changed.


    You can then create containers running your applications. **Most Docker containers
    take less than a second to launch**. Removing the overhead of the hypervisor also
    means containers are highly performant and you can pack more of them into your
    hosts and make the best possible use of your resources.


    ### 1.1.2 A logical segregation of duties


    With Docker, Developers care about their applications running inside containers,
    and Operations cares about managing the containers. Docker is designed to enhance
    consistency by ensuring the environment in which your developers write code matches
    the environments into which your applications are deployed. This reduces the risk
    of “worked in dev, now an ops problem.”


    ### 1.1.3 Fast, efficient development life cycle


    Docker aims to reduce the cycle time between code being written and code being
    tested, deployed, and used. It aims to make your applications portable, easy to
    build, and easy to collaborate on.


    ### 1.1.4 Encourages service oriented architecture


    Docker also encourages service-oriented and [microservices](http://martinfowler.com/articles/microservices.html)
    architectures. Docker recommends that each container run a single application
    or process. This promotes a distributed application model where an application
    or service is represented by a series of inter-connected containers. This makes
    it easy to distribute, scale, debug and introspect your applications.


    Note You don’t need to build your applications this way if you don’t wish. You
    can easily run a multi-process application inside a single container.


    ## 1.2 Docker components


    Let’s look at the core components that compose the Docker Community Edition:


    *   The Docker client and server, also called the Docker Engine.


    *   Docker Images


    *   Registries


    *   Docker Containers


    ### 1.2.1 Docker client and server


    Docker is a client-server application. The Docker client talks to the Docker server
    or daemon, which, in turn, does all the work. You’ll also sometimes see the Docker
    daemon called the Docker Engine. Docker ships with a command line client binary,
    `docker`, as well as a [full RESTful API](http://docs.docker.com/reference/api/docker_remote_api/)
    to interact with the daemon: `dockerd`. You can run the Docker daemon and client
    on the same host or connect your local Docker client to a remote daemon running
    on another host. You can see Docker’s architecture depicted here:


    ![Docker architecture](images/00002.jpeg)


    Docker architecture


    ### 1.2.2 Docker images


    Images are the building blocks of the Docker world. You launch your containers
    from images. Images are the “build” part of Docker’s life cycle. They have a layered
    format, using Union file systems, that are built step-by-step using a series of
    instructions. For example:


    *   Add a file.


    *   Run a command.


    *   Open a port.


    You can consider images to be the “source code” for your containers. They are
    highly portable and can be shared, stored, and updated. In the book, we’ll learn
    how to use existing images as well as build our own images.


    ### 1.2.3 Registries


    Docker stores the images you build in registries. There are two types of registries:
    public and private. Docker, Inc., operates the public registry for images, called
    the [Docker Hub](http://hub.docker.com). You can [create an account](https://hub.docker.com/account/signup/)
    on the Docker Hub and use it to share and store your own images.


    The Docker Hub also contains, at last count, over 10,000 images that other people
