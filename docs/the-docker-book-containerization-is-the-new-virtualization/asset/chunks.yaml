  trans: "\n\n早些时候我们讨论了指令失败时会发生什么。让我们来看一个例子：假设在 `Step 4` 中我们写错了所需的包名称，错误地将其变成了 `ngin`。\n\
    \n让我们再次运行构建，看看失败时会发生什么。\n\n```\n$ cd static_web\n$ sudo docker build -t=\"jamtur01/static_web\"\
    \ .\nSending build context to Docker daemon  2.56 kB\nSending build context to\
    \ Docker daemon\nStep 1 : FROM ubuntu:16.04\n  ---> 8dbd9e392a96\nStep 2 : LABEL\
    \ maintainer=\"james@example.com\"\n  ---> Running in d97e0c1cf6ea\n  ---> 85130977028d\n\
    Step 3 : RUN apt-get update\n  ---> Running in 85130977028d\n  ---> 997485f46ec4\n\
    Step 4 : RUN apt-get install -y ngin\n  ---> Running in ffca16d58fd8\nReading\
    \ package lists...\nBuilding dependency tree...\nReading state information...\n\
    E: Unable to locate package ngin\n2014/06/04 18:41:11 The command [/bin/sh -c\
    \ apt-get install -y ngin] returned a non-zero code: 100\n```\n\n假设我想调试这个失败。我可以使用\
    \ `docker run` 命令从 Docker 构建中上一个执行的步骤创建一个容器，在本例中，我们使用的是镜像 ID `997485f46ec4`。\n\
    \n```\n$ sudo docker run -t -i 997485f46ec4 /bin/bash\ndcge12e59fe8:/#\n```\n\n\
    然后，我可以尝试使用正确的包名重新运行 `apt-get install -y ngin` 步骤，或者进行其他调试以确定问题出在哪里。一旦我确定了问题，我就可以退出容器，用正确的包名更新我的\
    \ `Dockerfile`，并重试构建。\n\n### 4.5.6 Dockerfile 和构建缓存\n\n由于每一步都会被提交为镜像，Docker 在构建镜像时能够非常智能。它会将之前的层视为缓存。如果在我们的调试示例中，我们不需要更改\
    \ `Steps 1` 到 `3` 中的任何内容，那么 Docker 就会使用之前构建的镜像作为缓存和起点。本质上讲，它将直接从 `Step 4` 开始构建过程。如果之前的步骤没有发生变化，这将为你节省大量时间。然而，如果你更改了\
    \ `Steps 1` 到 `3` 中的某些内容，Docker 将会从第一个更改的指令重新开始。\n\n但是，有时你可能想确保不使用缓存。例如，如果你上面缓存了上面的\
    \ `Step 3`（即 `apt-get update`），那么它就不会刷新 APT 包缓存。你可能希望它执行此操作以获取包的新版本。若要跳过缓存，我们可以在\
    \ `docker build` 命令中使用 `--no-cache` 标记。\n\n```\n$ sudo docker build --no-cache\
    \ -t=\"jamtur01/static_web\" .\n```\n\n### 4.5.7 使用构建缓存进行模板化\n\n由于构建缓存的存在，你可以以简单模板的形式构建\
    \ `Dockerfile`（例如，在文件顶部添加包仓库或更新包以确保命中缓存）。我通常会在 `Dockerfile` 的顶部设置相同的模板指令集，例如针对\
    \ Ubuntu 的：\n\n```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\n\
    ENV REFRESHED_AT 2016-07-01\nRUN apt-get -qq update\n```\n\n让我们逐步查看这个新的 `Dockerfile`。首先，我使用了\
    \ `FROM` 指令来指定 `ubuntu:16.04` 基础镜像。接下来，我添加了 `MAINTAINER` 指令来提供我的联系方式。然后我指定了一个新指令\
    \ `ENV`。`ENV` 指令在镜像中设置环境变量。在这种情况下，我指定了 `ENV` 指令来设置名为 `REFRESHED_AT` 的环境变量，显示模板最后一次更新的时间。最后，我在\
    \ `RUN` 指令中指定了 `apt-get -qq update` 命令。该命令在执行时会刷新 APT 包缓存，确保可以安装最新版本的包。\n\n通过我的这个模板，当我想刷新构建时，只需更改\
    \ `ENV` 指令中的日期。随后 Docker 在遇到该 `ENV` 指令时会重置缓存，并重新运行后续的每一个指令，而不依赖缓存。这意味着我的 `RUN\
    \ apt-get update` 指令被重新运行，我的包缓存也用最新内容进行了刷新。你可以针对目标平台扩展此模板示例，或以适应各种需求。例如，对于 `fedora`\
    \ 镜像，我们可以：\n\n```\nFROM fedora:21\nLABEL maintainer=\"james@example.com\"\nENV\
    \ REFRESHED_AT 2016-07-01\nRUN yum -q makecache\n```\n\n这为 Fedora 使用 Yum 执行了相似的缓存功能。\n\
    \n### 4.5.8 查看我们的新镜像\n\n现在让我们来看看我们的新镜像。我们可以使用 `docker images` 命令来实现。\n\n```\n\
    $ sudo docker images jamtur01/static_web\nREPOSITORY          TAG       CREATED\
    \          SIZE\njamtur01/static_web  latest    1 minute ago    120MB\n```\n\n\
    如果我们想查看镜像是如何构建的，可以使用 `docker history` 命令。\n\n```\n$ docker history jamtur01/static_web\n\
    IMAGE          ID             CREATED          SIZE           COMMAND\n6751b94bb5c0\
    \   1 minute ago    120MB          \"RUN apt-get -qq update\"\n997485f46ec4  \
    \ 1 minute ago    27B             \"ENV REFRESHED_AT=2016-07-01\"\n85130977028d\
    \   2 days ago     27B             \"LABEL maintainer=james@example.com\"\n8dbd9e392a96\
    \   2 days ago      79MB           \"FROM ubuntu:16.04\"\n```\n\n"
