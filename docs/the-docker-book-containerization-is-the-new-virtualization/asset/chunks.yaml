- fmt: "\n```\n$ sudo docker attach bob_the_container\n```\n\nor via its container\
    \ ID:\n\n```\n$ sudo docker attach aa3f365f0f4e\n```\n\nand we’ll be brought back\
    \ to our container’s Bash prompt:\n\nTip You might need to hit `Enter` to bring\
    \ up the prompt\n\n```\nroot@aa3f365f0f4e:/#\n```\n\nIf we exit this shell, our\
    \ container will again be stopped.\n\n## 3.7 Creating daemonized containers\n\n\
    In addition to these interactive containers, we can create longer-running containers.\
    \ Daemonized containers don’t have the interactive session we’ve just used and\
    \ are ideal for running applications and services. Most of the containers you’re\
    \ likely to run will probably be daemonized. Let’s start a daemonized container\
    \ now.\n\n```\n$ sudo docker run --name daemon_dave -d ubuntu /bin/sh -c \"while\
    \ true; do echo hello world; sleep 1; done\"\n1333bb1a66af402138485fe44a335b382c09a887aa9f95cb9725e309ce5b7db3\n\
    ```\n\nHere, we’ve used the `docker run` command with the `-d` flag to tell Docker\
    \ to detach the container to the background.\n\nWe’ve also specified a `while`\
    \ loop as our container command. Our loop will echo `hello world` over and over\
    \ again until the container stopped or the process stops.\n\nWith this combination\
    \ of flags, you’ll see that, instead of being attached to a shell like our last\
    \ container, the `docker run` command has instead returned a container ID and\
    \ returned us to our prompt. Now if we run `docker ps`, we see a running container.\n\
    \n```\nCONTAINER ID    IMAGE              CREATED      STATUS  NAMES\n1333bb1a66af\
    \ ubuntu   /bin/sh -c 'while' 32 secs ago  Up         daemon_dave\n```\n\n## 3.8\
    \ Seeing what’s happening inside our container\n\nWe now have a daemonized container\
    \ running our `while` loop; let’s take a look inside the container and see what’s\
    \ happening. To do so, we can use the `docker logs` command. The `docker logs`\
    \ command fetches the logs of a container.\n\n```\n$ sudo docker logs daemon_dave\n\
    hello world\nhello world\nhello world\nhello world\nhello world\n```\n\nHere we\
    \ see the results of our `while` loop echoing `hello world` to the logs. Docker\
    \ will output the last few entries and then return. We can also monitor the container’s\
    \ logs like the `tail -f` binary using the `-f` flag.\n\n```\n$ sudo docker logs\
    \ -f daemon_dave\nhello world\nhello world\nhello world\nhello world\nhello world\n\
    ```\n\nTip Use `Ctrl-C` to exit from the log tail. You can also tail a portion\
    \ of the logs of a container, again like the `tail` command with the `-f` and\
    \ `--tail` flags. For example, you can get the last lines of a log using `docker\
    \ logs --tail 10 daemon_dave`. You can also follow the logs of a container without\
    \ having to read the whole file with `docker logs --tail 0 -f daemon_dave`.\n\n\
    To make debugging a little easier, we can also add the `-t` flag to prefix our\
    \ log entries with timestamps.\n\n```\n$ sudo docker logs -ft daemon_dave\n2016-08-02T03:31:16.74367959Z\
    \ hello world\n2016-08-02T03:31:17.74476949Z hello world\n2016-08-02T03:31:18.74578625Z\
    \ hello world\n2016-08-02T03:31:19.74683992Z hello world\n```\n\nTip Again, use\
    \ `Ctrl-C` to exit from the log tail.\n\n## 3.9 Docker log drivers\n\nSince Docker\
    \ 1.6 you can also control the logging driver used by your daemon and container.\
    \ This is done using the `--log-driver` option. You can pass this option to both\
    \ the daemon and the `docker run` command.\n\nThere are a variety of options including\
    \ the default `json-file` which provides the behavior we’ve just seen using the\
    \ `docker logs` command.\n\nAlso available is `syslog` which disables the `docker\
    \ logs` command and redirects all log output to Syslog. You can specify this with\
    \ the Docker daemon to output all container logs to Syslog or override it using\
    \ `docker run` to direct output from individual containers.\n\n```\n$ sudo docker\
    \ run --log-driver=\"syslog\" --name daemon_dave -d ubuntu /bin/sh -c \"while\
    \ true; do echo hello world; sleep 1; done\"\n```\n\nThis will cause the `daemon_dwayne`\
    \ container to log to Syslog and result in the `docker logs` command showing no\
    \ output.\n\nLastly, also available is `none`, which disables all logging in containers\
    \ and results in the `docker logs` command being disabled.\n\nTip Additional logging\
    \ drivers continue to be added. Docker 1.8 introduced support for [Graylog’s GELF\
    \ protocol](https://www.graylog.org/centralize-your-docker-container-logging-with-graylog-native-integration/),\
    \ [Fluentd](http://blog.treasuredata.com/blog/2015/08/03/5-use-cases-docker-fluentd/)\
    \ and a log rotation driver.\n\n## 3.10 Inspecting the container’s processes\n\
    \nIn addition to the container’s logs we can also inspect the processes running\
    \ inside the container. To do this, we use the `docker top` command.\n\n```\n\
    $ sudo docker top daemon_dave\n```\n\nWe can then see each process (principally\
    \ our `while` loop), the user it is running as, and the process ID.\n\n```\nPID\
    \  USER COMMAND\n977  root /bin/sh -c while true; do echo hello world; sleep 1;\
    \ done\n1123 root sleep 1\n```\n\n## 3.11 Docker statistics\n\nIn addition to\
    \ the `docker top` command you can also use the `docker stats` command. This shows\
    \ statistics for one or more running Docker containers. Let’s see what these look\
    \ like. We’re going to look at the statistics for our `daemon_dave` and `daemon_dwayne`\
    \ containers.\n\n```\n$ sudo docker stats daemon_dave daemon_dwayne\nCONTAINER\
