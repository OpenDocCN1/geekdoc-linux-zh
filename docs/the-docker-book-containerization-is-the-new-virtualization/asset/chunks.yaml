  trans: "\n我们看到 API 返回了一个 JSON 哈希值（我们在其中包含了一个示例），包含了 Docker 守护进程的系统信息。这表明 Docker\
    \ API 正在工作，并且我们正在获取一些数据。我们通过 python 的 `json.tool` 对 JSON 进行了格式化处理。\n\n### 8.3.1\
    \ 使用 API 管理镜像\n\n让我们从一些 API 的基础知识开始：与 Docker 镜像的操作。我们将从获取 Docker 守护进程上所有镜像的列表开始。\n\
    \n```bash\n$ curl http://docker.example.com:2375/images/json | python3 -mjson.tool\n\
    [\n    {\n        \"Id\": \"sha256:b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473\"\
    ,\n        \"ParentId\": \"\",\n        \"RepoTags\": [\n            \"jamtur01/distributed_app:latest\"\
    \n        ],\n        \"RepoDigests\": [\n            \"jamtur01/distributed_app@sha256:ecc6b617e9c776d8bd7ed281a55b02e9214d701cad72b9628f5668edfbb86a26\"\
    \n        ],\n        \"Created\": 1470488372,\n        \"Size\": 469434429,\n\
    \        \"VirtualSize\": 469434429,\n        \"Labels\": {}\n    },\n. . .\n\
    ]\n```\n\n我们使用了 `/images/json` 端点，它将返回 Docker 守护进程上所有镜像的列表。它提供的信息与 `docker images`\
    \ 命令非常相似。我们也可以通过 ID 查询特定的镜像，就像对镜像 ID 使用 `docker inspect` 一样样。\n\n```bash\n$ curl\
    \ http://docker.example.com:2375/images/b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473/json\
    \ | python3 -mjson.tool\n{\n    \"Id\": \"sha256:b608dbb10e2564f5bd0eef045bf297e56b1149edc70bece54fef4b217261a473\"\
    ,\n    \"RepoTags\": [\n        \"jamtur01/distributed_app:latest\"\n    ],\n\
    \    \"RepoDigests\": [\n        \"jamtur01/distributed_app@sha256:ecc6b617e9c776d8bd7ed281a55b02e9214d701cad72b9628f5668edfbb86a26\"\
    \n    ],\n    \"Parent\": \"\",\n    \"Comment\": \"\",\n    \"Created\": \"2016-08-06T12:59:32.957396238Z\"\
    ,\n. . .\n    }\n}\n```\n\n在这里，我们看到了检查 `jamtur01/distributed_app` 镜像输出的一个子。最后，就像命令行一样，我们可以在\
    \ Docker Hub 上搜索镜像。\n\n```bash\n$ curl \"http://docker.example.com:2375/images/search?term=jamtur01\"\
    \ | python3 -mjson.tool\n[\n    {\n        \"star_count\": 0,\n        \"is_official\"\
    : false,\n        \"name\": \"jamtur01/docker-jenkins-sample\",\n        \"is_automated\"\
    : true,\n        \"description\": \"\"\n    },\n    {\n        \"star_count\"\
    : 5,\n        \"is_official\": false,\n        \"name\": \"jamtur01/docker-presentation\"\
    ,\n        \"is_automated\": true,\n        \"description\": \"\"\n    },\n. .\
    \ .\n]\n```\n\n在这里，我们搜索了所有包含术语 `jamtur01` 的镜像，并显示了返回输出的一个子。这只是我们使用 Docker API\
    \ 可以执行的操作的一个示例。我们还可以构建、更新和删除镜像。\n\n### 8.3.2 使用 API 管理容器\n\nDocker Engine API\
    \ 还暴露了我们在命令行中可用的所有容器操作。我们可以使用 `/containers` 端点列出运行中的容器，就像使用 `docker ps` 命令一样。\n\
    \n```bash\n$ curl -s \"http://docker.example.com:2375/containers/json\" | python3\
    \ -mjson.tool\n[\n    {\n        \"Id\": \"d580b605fa1bcd210af0d2fe28e50a018f9ea546b56e8b28806d8dc16596340e\"\
    ,\n        \"Names\": [\n            \"/heyworld_global.0.bbctscdrhkro371mkieb0roid\"\
    \n        ],\n        \"Image\": \"ubuntu:latest\",\n        \"ImageID\": \"sha256:42118e3df42f09ca581a93df27460193e4284f7e183356a\"\
    ,\n        \"Command\": \"/bin/sh 'while true; do echo world; sleep 1; done'\"\
    ,\n        \"Created\": 1470488372,\n        \"Ports\": [],\n        \"Labels\"\
    : {\n            \"docker.swarm.node.id\": \"c6viix0oja1twny8ezhd\",\n       \
    \     \"docker.swarm.service.id\": \"5tw55i050961x\",\n            \"docker.swarm.name\"\
    : \"heyworld_global\",\n            \"docker.swarm.task\": \"bbctscdrhkro371mkieb0roid\"\
    ,\n            \"docker.swarm.task.name\": \"heyworld_global.0\"\n        },\n\
    \        \"State\": \"running\",\n        \"Status\": \"Up 11 hours\",\n     \
    \   \"HostConfig\": {\n            \"NetworkMode\": \"default\"\n        },\n\
    . . .\n    ]\n```\n\n将显示 Docker 主机上所有运行的容器，在本例中只有一个。要查看停止的容器，我们可以在端点添加 `all` 标志并设置为\
    \ `1`。\n\n```bash\nhttp://docker.example.com:2375/containers/json?all=1\n```\n\
    \n我们也可以通过向 `/containers/create` 端点发送 `POST` 请求来使用 API 创建容器。这是最简单的调用。\n\n```bash\n\
    $ curl -X POST \"Content-Type: application/json\" \\\nhttp://docker.example.com:2375/containers/create\
    \ \\\n-d '{\n     \"Image\":\"jamtur01/jekyll\"\n}'\n{\"Id\":\"591ba02d8d149e5ae5ec2a30ffe8ed455\"\
    ,\"Warnings\":null}\n```\n\n我们调用 `/containers/create` 端点并 `POST` 一个包含镜像名称的 JSON\
    \ 哈希。API 返回我们刚刚创建的容器 ID 以及任何警告。这将创建一个容器。\n\n我们可以通过向 JSON 哈希添加键值对来进一步配置我们的容器。\n\
    \n```bash\n$ curl -X POST \"Content-Type: application/json\" \\\n\"http://docker.example.com:2375/containers/create?name=jekyll\"\
    \ \\\n-d '{\n     \"Image\":\"jamtur01/jekyll\",\n     \"Hostname\":\"jekyll\"\
    \n}'\n{\"Id\":\"591ba02d8d149e5ae5ec2a30ffe8ed455\",\"Warnings\":null}\n```\n\n\
    在这里，我们指定了值为 `jekyll` 的 `Hostname` 键来设置结果容器的主机名。要启动容器，我们使用 `/containers/start`\
    \ 端点。\n\n```bash\n$ curl -X POST \"Content-Type: application/json\" \\\nhttp://docker.example.com:2375/containers/591ba02d8d149e5ae5ec2a30ffe8ed455/start\
    \ \\\n-d '{\n         \"PublishAllPorts\":true\n}'\n```\n\n组合起来等同于运行：\n\n```bash\n\
    $ sudo docker run jamtur01/jekyll\n```\n\n我们还可以通过 `/containers/` 端点检查结果容器。\n\n\
    ```bash\n$ curl http://docker.example.com:2375/containers/591ba02d8d149e5ae5ec2a30ffe8ed455/json\
    \ | python3 -mjson.tool\n{\n    \"Args\": [\n        \"build\",\n        \"--destination=/var/www/html\"\
    \n    ],\n. . .\n        \"Hostname\": \"591ba02d8d14\",\n        \"Image\": \"\
    jamtur01/jekyll\",\n. . .\n    \"Id\": \"591ba02d8d149e5ae5ec2a30ffe8ed455\",\n\
    \    \"Image\": \"29d4355e575cff59d7b7ad837055f231970296846ab58037dd84be520d1cc31\"\
    ,\n. . .\n    \"Name\": \"/hopeful_davinci\",\n. . .\n}\n```\n\n在这里我们看到使用容器 ID\
    \ 查询了容器，并展示了我们可以使用的数据的采样。\n\n## 8.4 改进 TProv \n\n现在让我们看看我们在第 6 章中使用的 TProv 应用内部的一个方法。我们将专门查看创建和删除\
    \ Docker 容器的方法。\n\n```ruby\ndef create_instance(name)\n  cid = `docker run -P\
    \ --volumes-from #{name} -d -t jamtur01/tomcat7 2>&1`.chop\n  [$?.exitstatus ==\
    \ 0, cid]\nend\n```\n\n注意：你可以在 `https://github.com/turnbullpress/dockerbook-code/tree/master/6/tprov`\
    \ 看到之前的 TProv 代码。\n\n相当粗糙，对吧？我们直接调用 `docker` 二进制文件并捕获它的输出。有很多会导致问题的原因，其中最不提到的是你只能在安装了\
    \ Docker 客户端的地方运行 TProv 应用。\n\n我们可以通过使用其中一个客户端库通过 Docker API 来改进此接口，在这种情况下是 [Ruby\
    \ Docker-API 客户端库](https://github.com/swipely/docker-api)。\n\n提示你可以在[这里](https://docs.docker.com/engine/api/sdks/)找到可用客户端库的完整列表。\n\
    \n让我们看看我们是如何建立与 Docker API 连接的。\n"
- fmt: "\nWe’ve added a `require` for the `docker-api` gem. We’d need to install this\
    \ gem first to get things to work or add it to the TProv application’s gem specification.\n\
    \nWe can then use the `Docker.url` method to specify the location of the Docker\
    \ host we wish to use. In our code, we specify this via an environment variable,\
    \ `DOCKER_URL`, or use a default of `http://localhost:2375`.\n\nWe’ve also used\
    \ the `Docker.options` to specify options we want to pass to the Docker daemon\
    \ connection.\n\nWe can test this idea using the IRB shell locally. Let’s try\
    \ that now. You’ll need to have Ruby installed on the host on which you are testing.\
    \ Let’s assume we’re using a Fedora host.\n\n```\n$ sudo yum -y install ruby ruby-irb\n\
    . . .\n$ sudo gem install docker-api json\n. . .\n```\n\nNow we can use `irb`\
    \ to test our Docker API connection.\n\n```\n $ irb\nirb(main):001:0> require\
    \ 'docker'; require 'pp'\n=> true\nirb(main):002:0> Docker.url = 'http://docker.example.com:2375'\n\
    => \"http://docker.example.com:2375\"\nirb(main):003:0> Docker.options = { :ssl_verify_peer\
    \ => false }\n=> {:ssl_verify_peer=>false}\nirb(main):004:0> pp Docker.info\n\
    {\"Containers\"=>9,\n \"Debug\"=>0,\n \"Driver\"=>\"aufs\",\n \"DriverStatus\"\
    =>[[\"Root Dir\", \"/var/lib/docker/aufs\"], [\"Dirs\", \"882\"]],\n \"ExecutionDriver\"\
    =>\"native-0.2\",\n. . .\nirb(main):005:0> pp Docker.version\n{\"ApiVersion\"\
    =>\"1.12\",\n \"Arch\"=>\"amd64\",\n \"GitCommit\"=>\"990021a\",\n \"GoVersion\"\
    =>\"go1.2.1\",\n \"KernelVersion\"=>\"3.10.0-33-generic\",\n \"Os\"=>\"linux\"\
    ,\n \"Version\"=>\"1.0.1\"}\n. . .\n```\n\nWe’ve launched `irb` and loaded the\
    \ `docker` gem (via a `require`) and the `pp` library to help make our output\
    \ look nicer. We’ve then specified the `Docker.url` and `Docker.options` methods\
    \ to set the target Docker host and our required options (here disabling SSL peer\
    \ verification to use TLS, but not authenticate the client).\n\nWe’ve then run\
    \ two global methods, `Docker.info` and `Docker.version`, which provide the Ruby\
    \ client API equivalents of the binary commands `docker info` and `docker version`.\n\
    \nWe can now update our TProv container management methods to use the API via\
    \ the `docker-api` client library. Let’s look at some code that does this now.\n\
    \n```ruby\ndef get_war(name, url)\n  container = Docker::Container.create('Cmd'\
    \ => url, 'Image' => 'jamtur01/fetcher', 'name' => name)\n  container.start\n\
    \  container.id\nend\n\ndef create_instance(name)\n  container = Docker::Container.create('Image'\
    \ => 'jamtur01/tomcat7')\n  container.start('PublishAllPorts' => true, 'VolumesFrom'\
    \ => name)\n  container.id\nend\n\ndef delete_instance(cid)\n  container = Docker::Container.get(cid)\n\
    \  container.kill\nend\n```\n\nYou can see we’ve replaced the previous binary\
    \ shell with a rather cleaner implementation using the Docker API. Our `get_war`\
    \ method creates and starts our `jamtur01/fetcher` container using the `Docker::Container.create`\
    \ and `Docker::Container.start` methods. The `create_instance` method does the\
    \ same for the `jamtur01/tomcat7` container. Finally, our `delete_instance` method\
    \ has been updated to retrieve a container using the container ID via the `Docker::Container.get`\
    \ method. We then kill the container with the `Docker::Container.kill` method.\n\
    \nYou can install the API-enabled version of the TProv application via gem to\
    \ see it in action.\n\n```\n$ sudo gem install tprov-api\n```\n\nNote You can\
    \ see the updated TProv code on [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/8/tprov_api).\n\
    \n## 8.5 Authenticating the Docker Engine API\n\nWhilst we’ve shown that we can\
    \ connect to the Docker Engine API, that means that anyone else can also connect\
    \ to the API. That poses a bit of a security issue. The Engine API has an authentication\
    \ mechanism that has been available since the 0.9 release of Docker. The authentication\
    \ uses TLS/SSL certificates to secure your connection to the API.\n\nTip This\
    \ authentication applies to more than just the API. By turning this authentication\
    \ on, you will also need to configure our Docker client to support TLS authentication.\
    \ We’ll see how to do that in this section, too.\n\nThere are a couple of ways\
    \ we could authenticate our connection, including using a full PKI infrastructure,\
    \ either creating our own Certificate Authority (CA) or using an existing CA.\
    \ We’re going to create our own certificate authority because it is a simple and\
    \ fast way to get started.\n\nWarning This relies on a local CA running on your\
    \ Docker host. This is not as secure as using a full-fledged Certificate Authority.\n\
    \n### 8.5.1 Create a Certificate Authority\n\nWe’re going to quickly step through\
    \ creating the required CA certificate and key, as it is a pretty standard process\
    \ on most platforms. It requires the `openssl` binary as a prerequisite.\n\n```\n\
    $ which openssl\n/usr/bin/openssl\n```\n\nLet’s create a directory on our Docker\
    \ host to hold our CA and related materials.\n\n```\n$ sudo mkdir /etc/docker\n\
    ```\n\nNow let’s create our CA.\n\nWe first generate a private key.\n\n```\n$\
    \ cd /etc/docker\n$ echo 01 | sudo tee ca.srl\n$ sudo openssl genrsa -des3 -out\
    \ ca-key.pem\nGenerating RSA private key, 512 bit long modulus\n....++++++++++++\n\
    .................++++++++++++\ne is 65537 (0x10001)\nEnter pass phrase for ca-key.pem:\n\
    Verifying - Enter pass phrase for ca-key.pem:\n```\n\nWe’ll specify a passphrase\
    \ for the CA key, make note of this phrase, and secure it. We’ll need it to create\
    \ and sign certificates with our new CA.\n\nThis also creates a new file called\
    \ `ca-key.pem`. This is our CA key; we will not share it.\n\nNow let’s create\
    \ the CA certificate.\n\n```\n$ sudo openssl req -new -x509 -days 365 -key ca-key.pem\
    \ -out ca.pem\nEnter pass phrase for ca-key.pem:\nYou are about to be asked to\
    \ enter information that will be incorporated\ninto your certificate request.\n\
    What you enter is is called a Distinguished Name or a DN.\nThere are quite a few\
    \ fields but you can leave some blank\nFor some fields there will be a default\
    \ value,\nIf you enter '.', the field will be left blank.\n-----\nCountry Name\
    \ (2 letter code) [AU]:\nState or Province Name (full name) [Some-State]:\nLocality\
    \ Name (eg, city)]:\nOrganization Name (eg, company) [Internet Widgits Pty Ltd]:\n\
    Organizational Unit Name (eg, section) []:\nCommon Name (e.g. server FQDN or YOUR\
    \ name) []:docker.example.com\nEmail Address []:\n```\n\nThis will create the\
    \ `ca.pem` file that is the certificate for our CA. We’ll need this later to verify\
    \ our secure connection.\n\nNow that we have our CA, let’s use it to create a\
    \ certificate and key for our Docker server.\n\n### 8.5.2 Create a server certificate\
    \ signing request and key\n\nWe can use our new CA to sign and validate a certificate\
    \ signing request or CSR and key for our Docker server. Let’s start with creating\
    \ a key for our server.\n\n```\n$ sudo openssl genrsa -des3 -out server-key.pem\n\
    Generating RSA private key, 512 bit long modulus\n...................++++++++++++\n\
    ...............++++++++++++\ne is 65537 (0x10001)\nEnter pass phrase for server-key.pem:\n\
    Verifying - Enter pass phrase for server-key.pem:\n```\n\nThis will create our\
    \ server key, `server-key.pem`. As above, we need to keep this key safe: it is\
    \ what secures our Docker server.\n\nNote Specify any pass phrase here. We’re\
    \ going to strip it out before we use the key. You’ll only need it for the next\
    \ couple of steps.\n\nNext let’s create our server certificate signing request\
    \ (CSR).\n"
  raw: "We’ve added a `require` for the `docker-api` gem. We’d need to install this\
    \ gem first to get things to work or add it to the TProv application’s gem specification.\n\
    \nWe can then use the `Docker.url` method to specify the location of the Docker\
    \ host we wish to use. In our code, we specify this via an environment variable,\
    \ `DOCKER_URL`, or use a default of `http://localhost:2375`.\n\nWe’ve also used\
    \ the `Docker.options` to specify options we want to pass to the Docker daemon\
    \ connection.\n\nWe can test this idea using the IRB shell locally. Let’s try\
    \ that now. You’ll need to have Ruby installed on the host on which you are testing.\
    \ Let’s assume we’re using a Fedora host.\n\n```\n$ sudo yum -y install ruby ruby-irb\n\
    . . .\n$ sudo gem install docker-api json\n. . .\n```\n\nNow we can use `irb`\
    \ to test our Docker API connection.\n\n```\n $ irb\nirb(main):001:0> require\
    \ 'docker'; require 'pp'\n=> true\nirb(main):002:0> Docker.url = 'http://docker.example.com:2375'\n\
    => \"http://docker.example.com:2375\"\nirb(main):003:0> Docker.options = { :ssl_verify_peer\
    \ => false }\n=> {:ssl_verify_peer=>false}\nirb(main):004:0> pp Docker.info\n\
    {\"Containers\"=>9,\n \"Debug\"=>0,\n \"Driver\"=>\"aufs\",\n \"DriverStatus\"\
    =>[[\"Root Dir\", \"/var/lib/docker/aufs\"], [\"Dirs\", \"882\"]],\n \"ExecutionDriver\"\
    =>\"native-0.2\",\n. . .\nirb(main):005:0> pp Docker.version\n{\"ApiVersion\"\
    =>\"1.12\",\n \"Arch\"=>\"amd64\",\n \"GitCommit\"=>\"990021a\",\n \"GoVersion\"\
    =>\"go1.2.1\",\n \"KernelVersion\"=>\"3.10.0-33-generic\",\n \"Os\"=>\"linux\"\
    ,\n \"Version\"=>\"1.0.1\"}\n. . .\n```\n\nWe’ve launched `irb` and loaded the\
    \ `docker` gem (via a `require`) and the `pp` library to help make our output\
    \ look nicer. We’ve then specified the `Docker.url` and `Docker.options` methods\
    \ to set the target Docker host and our required options (here disabling SSL peer\
    \ verification to use TLS, but not authenticate the client).\n\nWe’ve then run\
    \ two global methods, `Docker.info` and `Docker.version`, which provide the Ruby\
    \ client API equivalents of the binary commands `docker info` and `docker version`.\n\
    \nWe can now update our TProv container management methods to use the API via\
    \ the `docker-api` client library. Let’s look at some code that does this now.\n\
    \n```\ndef get_war(name, url)\n  container = Docker::Container.create('Cmd' =>\
    \ url, 'Image' => 'jamtur01/fetcher', 'name' => name)\n  container.start\n  container.id\n\
    end\n\ndef create_instance(name)\n  container = Docker::Container.create('Image'\
    \ => 'jamtur01/tomcat7')\n  container.start('PublishAllPorts' => true, 'VolumesFrom'\
    \ => name)\n  container.id\nend\n\ndef delete_instance(cid)\n  container = Docker::Container.get(cid)\n\
    \  container.kill\nend\n```\n\nYou can see we’ve replaced the previous binary\
    \ shell with a rather cleaner implementation using the Docker API. Our `get_war`\
    \ method creates and starts our `jamtur01/fetcher` container using the `Docker::Container.create`\
    \ and `Docker::Container.start` methods. The `create_instance` method does the\
    \ same for the `jamtur01/tomcat7` container. Finally, our `delete_instance` method\
    \ has been updated to retrieve a container using the container ID via the `Docker::Container.get`\
    \ method. We then kill the container with the `Docker::Container.kill` method.\n\
    \nYou can install the API-enabled version of the TProv application via gem to\
    \ see it in action.\n\n```\n$ sudo gem install tprov-api\n```\n\nNote You can\
    \ see the updated TProv code on [GitHub](https://github.com/turnbullpress/dockerbook-code/tree/master/code/8/tprov_api).\n\
    \n## 8.5 Authenticating the Docker Engine API\n\nWhilst we’ve shown that we can\
    \ connect to the Docker Engine API, that means that anyone else can also connect\
    \ to the API. That poses a bit of a security issue. The Engine API has an authentication\
    \ mechanism that has been available since the 0.9 release of Docker. The authentication\
    \ uses TLS/SSL certificates to secure your connection to the API.\n\nTip This\
    \ authentication applies to more than just the API. By turning this authentication\
    \ on, you will also need to configure our Docker client to support TLS authentication.\
    \ We’ll see how to do that in this section, too.\n\nThere are a couple of ways\
    \ we could authenticate our connection, including using a full PKI infrastructure,\
    \ either creating our own Certificate Authority (CA) or using an existing CA.\
    \ We’re going to create our own certificate authority because it is a simple and\
    \ fast way to get started.\n\nWarning This relies on a local CA running on your\
    \ Docker host. This is not as secure as using a full-fledged Certificate Authority.\n\
    \n### 8.5.1 Create a Certificate Authority\n\nWe’re going to quickly step through\
    \ creating the required CA certificate and key, as it is a pretty standard process\
    \ on most platforms. It requires the `openssl` binary as a prerequisite.\n\n```\n\
    $ which openssl\n/usr/bin/openssl\n```\n\nLet’s create a directory on our Docker\
    \ host to hold our CA and related materials.\n\n```\n$ sudo mkdir /etc/docker\n\
    ```\n\nNow let’s create our CA.\n\nWe first generate a private key.\n\n```\n$\
    \ cd /etc/docker\n$ echo 01 | sudo tee ca.srl\n$ sudo openssl genrsa -des3 -out\
    \ ca-key.pem\nGenerating RSA private key, 512 bit long modulus\n....++++++++++++\n\
    .................++++++++++++\ne is 65537 (0x10001)\nEnter pass phrase for ca-key.pem:\n\
    Verifying - Enter pass phrase for ca-key.pem:\n```\n\nWe’ll specify a passphrase\
    \ for the CA key, make note of this phrase, and secure it. We’ll need it to create\
    \ and sign certificates with our new CA.\n\nThis also creates a new file called\
    \ `ca-key.pem`. This is our CA key; we’ll not want to share it or lose it, as\
    \ it is integral to the security of our solution.\n\nNow let’s create a CA certificate.\n\
    \n```\n$ sudo openssl req -new -x509 -days 365 -key ca-key.pem -out ca.pem\nEnter\
    \ pass phrase for ca-key.pem:\nYou are about to be asked to enter information\
    \ that will be incorporated\ninto your certificate request.\nWhat you are about\
    \ to enter is what is called a Distinguished Name or a DN.\nThere are quite a\
    \ few fields but you can leave some blank\nFor some fields there will be a default\
    \ value,\nIf you enter '.', the field will be left blank.\n-----\nCountry Name\
    \ (2 letter code) [AU]:\nState or Province Name (full name) [Some-State]:\nLocality\
    \ Name (eg, city) []:\nOrganization Name (eg, company) [Internet Widgits Pty Ltd]:\n\
    Organizational Unit Name (eg, section) []:\nCommon Name (e.g. server FQDN or YOUR\
    \ name) []:docker.example.com\nEmail Address []:\n```\n\nThis will create the\
    \ `ca.pem` file that is the certificate for our CA. We’ll need this later to verify\
    \ our secure connection.\n\nNow that we have our CA, let’s use it to create a\
    \ certificate and key for our Docker server.\n\n### 8.5.2 Create a server certificate\
    \ signing request and key\n\nWe can use our new CA to sign and validate a certificate\
    \ signing request or CSR and key for our Docker server. Let’s start with creating\
    \ a key for our server.\n\n```\n$ sudo openssl genrsa -des3 -out server-key.pem\n\
    Generating RSA private key, 512 bit long modulus\n...................++++++++++++\n\
    ...............++++++++++++\ne is 65537 (0x10001)\nEnter pass phrase for server-key.pem:\n\
    Verifying - Enter pass phrase for server-key.pem:\n```\n\nThis will create our\
    \ server key, `server-key.pem`. As above, we need to keep this key safe: it is\
    \ what secures our Docker server.\n\nNote Specify any pass phrase here. We’re\
    \ going to strip it out before we use the key. You’ll only need it for the next\
    \ couple of steps.\n\nNext let’s create our server certificate signing request\
    \ (CSR)."
