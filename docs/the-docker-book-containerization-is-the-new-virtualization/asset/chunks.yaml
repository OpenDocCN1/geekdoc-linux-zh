    - Official - an image managed by the upstream developer (e.g., the `fedora` image\
    \ managed by the Fedora team)\n- Automated - an image built by the Docker Hub’s\
    \ Automated Build process\n\nNote We’ll see more about Automated Builds later\
    \ in this chapter.\n\nLet’s pull down an image.\n\n```\n$ sudo docker pull jamtur01/puppetmaster\n\
    ```\n\nThis will pull down the `jamtur01/puppetmaster` image (which, by the way,\
    \ contains a pre-installed Puppet master server).\n\nWe can then use this image\
    \ to build a new container. Let’s do that now using the `docker run` command again.\n\
    \n```bash\n$ sudo docker run -i -t jamtur01/puppetmaster /bin/bash\nroot@4655dee672d3:/#\
    \ facter\narchitecture => amd64\naugeasversion => 1.2.0\n. . .\nroot@4655dee672d3:/#\
    \ puppet --version\n3.4.3\n```\n\nYou can see we’ve launched a new container from\
    \ our `jamtur01/puppetmaster` image. We’ve launched the container interactively\
    \ and told the container to run the Bash shell. Once inside the container’s shell,\
    \ we’ve run Facter (Puppet’s inventory application), which was pre-installed on\
    \ our image. From inside the container, we’ve also run the `puppet` binary to\
    \ confirm it is installed.\n\n## 4.5 Building our own images\n\nSo we’ve seen\
    \ that we can pull down pre-prepared images with custom contents. How do we go\
    \ about modifying our own images and updating them? There are two ways to create\
    \ a Docker image:\n\n- Via the `docker commit` command\n- Via the `docker build`\
    \ command with a `Dockerfile`\n\nThe `docker commit` method is not currently recommended,\
    \ as building with a `Dockerfile` is far more flexible and powerful, but we’ll\
    \ demonstrate it to you for the sake of completeness. After that, we’ll focus\
    \ on the recommended method of building images: writing a `Dockerfile` and using\
    \ the `docker build` command.\n\nNote We don’t generally “create” new images;\
    \ rather we build new images from existing base images, like the `ubuntu` or `fedora`\
    \ images we’ve already seen. If you want to build an entirely new image, you can\
    \ see some information [here](https://docs.docker.com/userguide/).\n\n### 4.5.1\
    \ Creating a Docker Hub account\n\nA big part of image building is sharing and\
    \ distributing your images. We do this by pushing them to [Docker Hub](https://hub.docker.com)\
    \ or your own registry. To facilitate this, let’s start by creating an account\
    \ on Docker Hub. You can join Docker Hub [here](https://hub.docker.com).\n\n![Creating\
    \ a Docker Hub account.](images/00006.jpeg)\n\nCreating a Docker Hub account.\
    \ Create an account and verify your email address you’ll receive after signing\
    \ up. Now let’s test our new account from Docker. To sign into the Docker Hub\
    \ you can use the `docker login` command.\n\n```bash\n$ sudo docker login\nLogin\
    \ with your ID to pull images from Docker Hub. If you don't have a Docker ID,\
    \ head over to hub.docker.com.\nUsername: jamtur01\nPassword: Succeeded\n```\n\
    \nThis command will log you into the Docker Hub and store your credentials for\
    \ future use. You can use the `docker logout` command to log out from a registry\
    \ server.\n\nNote Your credentials will be stored in the `$HOME/.dockercfg` file.\
    \ Since Docker 1.7.0 this is now `$HOME/.docker/config.json`.\n\n### 4.5.2 Using\
    \ docker commit to create images\n\nThe first method of creating images uses the\
    \ `docker commit` command. You can think about this method much like making a\
    \ commit in a version control system. We create a container, make changes to that\
    \ container as you change code, and then commit those changes to a new image.\n\
    \nLet’s start by creating a container from the `ubuntu` image we’ve used in the\
    \ past.\n\n```bash\n$ sudo docker run -i -t ubuntu /bin/bash\nroot@4aab3cecb76:/#\n\
    ```\n\nNext, we’ll install Apache into our container.\n\n```bash\nroot@4aab3cecb76:/#\
    \ apt-get -y update\n. . .\nroot@4aab3cecb76:/# apt-get -y install apache2\n.\
    \ . .\n```\n\nWe’ve launched our container and then installed Apache within it.\
    \ We’re going to use this container as a web server, so we’ll want to save it\
    \ in its current state. That will save us from having to rebuild it with Apache\
    \ every time we create a new container. To do this we exit from the container,\
    \ using the `exit` command, and use the `docker commit` command.\n\n```bash\n\
    $ sudo docker commit 4aab3cecb76 jamtur01/apache2\n8ce0ea7a1528\n```\n\nYou can\
    \ see we’ve used the `docker commit` command and specified the ID of the container\
    \ we’ve just changed (to find that ID you could use the `docker ps -l -q` command\
    \ to return the ID of the last created container) as well as a target repository\
    \ and image name, here `jamtur01/apache2`. Of note is that the `docker commit`\
    \ command only commits the differences between the image the container was created\
    \ from and the current state of the container. This means updates are lightweight.\n\
    \nLet’s look at our new image.\n\n```bash\n$ sudo docker images jamtur01/apache2\n\
    . . .\njamtur01/apache2  latest  8ce0ea7a1528  13 seconds ago  90.63 MB\n```\n\
    \nWe can also provide some more data about our changes when committing our image,\
    \ including tags. For example:\n\n```bash\n$ sudo docker commit -m \"A new custom\
    \ image\" -a \"James Turnbull\" \\\n4aab3cecb76 jamtur01/apache2:webserver\nf99ebb6fed1f559258840505a0f5d5b6173177623946815366f3e3acff01adef\n\
    ```\n\nHere, we’ve specified some more information while committing our new image.\
    \ We’ve added the `-m` option which allows us to provide a commit message explaining\
    \ our new image. We’ve also specified the `-a` option to list the author of the\
    \ image. We’ve then specified the ID of the container we’re committing. Finally,\
    \ we’ve specified the username and repository of the image, `jamtur01/apache2`,\
    \ and we’ve added a tag, `webserver`, to our image.\n\nWe can view this information\
    \ about our image using the `docker inspect` command.\n\n```bash\n$ sudo docker\
    \ inspect jamtur01/apache2:webserver\n[{\n    \"Architecture\": \"amd64\",\n \
    \   \"Author\": \"James Turnbull\",\n    \"Comment\": \"A new custom image\",\n\
    \    . . .\n}]\n```\n\nTip You can find a full list of the `docker commit` flags\
    \ [here](https://docs.docker.com/engine/reference/commandline/commit/).\n\nIf\
    \ we want to run a container from our new image, we can do so using the `docker\
    \ run` command.\n\n```bash\n$ sudo docker run -t -i jamtur01/apache2:webserver\
    \ /bin/bash\nroot@9c2d3a84b9e:/# service apache2 status\n * apache2 is not running\n\
    ```\n\nYou’ll note that we’ve specified our image with the full tag: `jamtur01/apache2:webserver`.\n\
    \n### 4.5.3 Building images with a Dockerfile\n\nWe don’t recommend the `docker\
    \ commit` approach. Instead, we recommend that you build images using a definition\
    \ file called a `Dockerfile` and the `docker build` command. The `Dockerfile`\
    \ uses a basic DSL (Domain Specific Language) with instructions for building Docker\
    \ images. We recommend the `Dockerfile` approach over `docker commit` because\
    \ it provides a more repeatable, transparent, and idempotent mechanism for creating\
    \ images.\n\nOnce we have a `Dockerfile` we then use the `docker build` command\
    \ to build a new image from the instructions in the `Dockerfile`.\n\n#### 4.5.3.1\
    \ Our first Dockerfile\n\nLet’s now create a directory and an initial `Dockerfile`.\
    \ We’re going to build a Docker image that contains a simple web server.\n\n```bash\n\
    $ mkdir static_web\n$ cd static_web\n$ touch Dockerfile\n```\n"
