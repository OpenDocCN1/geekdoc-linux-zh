    ## 4.3 Pulling images


    When we run a container from the `docker run` command, if the image isn’t present
    Docker will download it from the Docker Hub. By default, if you don’t specify
    a tag, Docker will download the `latest` tag, for example:


    ```

    $ sudo docker run -t -i --name new_container ubuntu /bin/bash

    root@79e36bff89b4:/#

    ```


    Will download the `ubuntu:latest` image if it isn’t already present. Alternatively,
    we can use the `docker pull` command to pull images down preemptively. Using `docker
    pull` saves us some time launching a container from a new image. Let’s see that
    now by pulling down the `fedora:21` base image.


    ```

    $ sudo docker pull fedora:21

    21: Pulling from library/fedora

    d60b4509ad7d: Pull complete

    Digest: sha256:4328c03e6cafef1676db038269fc9a4c3528700d04ca1572e706b4aaa320000

    ```


    Let’s see this new image on our Docker host using the `docker images` command.
    This time, however, let’s narrow our review of the images to only the `fedora`
    images. To do so, we can specify the image name after the `docker images` command.


    ```

    $ sudo docker images fedora

    REPOSITORY TAG    IMAGE ID     CREATED     VIRTUAL SIZE

    fedora     21     7d3f07f8de5f 6 weeks ago 374.1 MB

    ```


    We see that the `fedora:21` image has been downloaded. We could also download
    another tagged image using the `docker pull` command.


    ```

    $ sudo docker pull fedora:20

    ```


    This would have just pulled the `fedora:20` image.


    ## 4.4 Searching for images


    We can also search all of the publicly available images on [Docker Hub](https://hub.docker.com)
    using the `docker search` command:

