  raw: 'We see that our `Dockerfile` inherits from the `jenkins` image. The `jenkins`
    image is the [official Jenkins image maintained by their community on the Docker
    Hub](https://hub.docker.com/_/jenkins/). The `Dockerfile` then does a lot of other
    stuff. Indeed, it is probably the most complex `Dockerfile` we’ve seen so far.
    Let’s walk through what it does.


    We’ve first set the `USER` to `root`, installed the `sudo` package and allowed
    the `jenkins` user to make use of `sudo`. We then installed the Docker binary.
    We’ll use this to connect to our Docker host and run containers for our builds.


    Next we switch back to the `jenkins` user. This user is the default for the `jenkins`
    image and is required for containers launched from the image to run Jenkins correctly.
    We then use a `RUN` instruction to execute the `install-plugins.sh` command to
    install a list of Jenkins plugins we’re going to use.


    Next, let’s create a directory, `/var/jenkins_home`, to hold our Jenkin’s configuration.
    This means every time we restart Jenkins we won’t lose our configuration.


    Tip Another approach would be to use [Docker data volumes](https://docs.docker.com/engine/admin/volumes/volumes/),
    which we’ll discuss further in Chapter 6.


    ```

    $ sudo mkdir -p /var/jenkins_home

    $ cd /var/jenkins_home

    $ sudo chown -R 1000 /var/jenkins_home

    ```


    Tip If you’re running this example on OS X you might need to create the directory
    at `/private/var/jenkins_home`.


    We also set the ownership of the `jenkins_home` directory to `1000`, which is
    the UID of the `jenkins` user inside the image we’re about to build. This will
    allow Jenkins to write into this directory and store our Jenkins configuration.


    Now that we have our `Dockerfile` and our Jenkins home directory, let’s build
    a new image using the `docker build` command.


    ```

    $ sudo docker build -t jamtur01/jenkins .

    ```


    We’ve called our new image, somewhat unoriginally, `jamtur01/jenkins`. We can
    now create a container from this image using the `docker run` command.


    ```

    $ sudo docker run -d -p 8080:8080 -p 50000:50000 \

    -v /var/jenkins_home:/var/jenkins_home \

    -v /var/run/docker.sock:/var/run/docker.sock \

    --name jenkins \

    jamtur01/jenkins

    cc130210491ee959a287f04b5e4c46340bbcb6a46971de15d3899699b7718656

    ```


    We can see that we’ve used the `-p` flag to publish port `8080` on port `8080`
    on the local host, which would normally be poor practice, but we’re only going
    to run one Jenkins server. We’ve also bound port `50000` on port `50000` which
    will be used by the Jenkins build API.


    Next, we bind two volumes using the `-v` flag. The first mounts our `/var/jenkins_home`
    directory into the container at `/var/jenkins_home`. This will contain Jenkin’s
    configuration data and allow us to perpetuate its state across container launches.


    The second volume mounts `/var/run/docker.sock`, the socket for Docker’s daemon
    into the Docker container. This will allow us to run Docker containers from inside
    our Jenkins container.


    Warning This is a security risk. By binding the Docker socket inside the Jenkins
    container you give the container access to the underlying Docker host. This is
    not overly secure. I recommend you only do this if you are comfortable that the
    Jenkins container, any other containers on that Docker host are at a comparable
    security level.


