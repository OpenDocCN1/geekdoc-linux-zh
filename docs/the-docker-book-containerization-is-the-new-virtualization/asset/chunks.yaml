  trans: "\n\n这看起来像是一个典型的 `docker run` 命令，不同之处在于我们使用了一个新标志：`--volumes-from`。`--volumes-from`\
    \ 标志会将命名容器中的任何卷添加到新创建的容器中。这意味着我们的 Apache 容器可以访问之前创建的 `james_blog` 容器内 `/var/www/html`\
    \ 卷中编译好的 Jekyll 站点。即使 `james_blog` 容器没有运行，它仍然拥有该访问权限。正如你记得的，这是卷的特殊属性之一。不过，容器必须存在。\n\
    \n注意：即使你删除了使用该卷的最后一个容器，卷仍然存在。\n\n构建我们的 Jekyll 网站的最终结果是什么？让我们看看容器将我们的暴露端口 `80`\
    \ 映射到了哪个端口上：\n\n```\n$ sudo docker port 09a570cc2267 80\n0.0.0.0:49160\n```\n\n\
    现在让我们在 Docker 宿主机上访问该网站。\n\n![我们的 Jekyll 网站。](img/00028.jpeg)\n\n我们的 Jekyll 网站。\n\
    \n我们有一个正在运行的 Jekyll 网站了！\n\n### 6.1.6 更新我们的 Jekyll 站点\n\n当我们想要更新网站时，事情会变得更有趣。假设我们想对\
    \ Jekyll Jekyll 网站做一些更改。我们将通过编辑 `james_blog/_config.yml` 文件来重命名博客。\n\n```\n$ vi\
    \ james_blog/_config.yml\n```\n\n并将 `title` 字段更新为 `James' Dynamic Docker-driven\
    \ Blog`。\n\n那么我们如何更新我们的博客呢？我们需要做的就是使用 `docker start` 命令重新启动我们的 Docker 容器。\n\n\
    ```\n$ sudo docker start james_blog\njames_blog\n```\n\n看起来什么都没有发生。让我们检查容器的日志。\n\
    \n```\n$ sudo docker logs james_blog\nConfiguration file: /data/_config.yml\n\
    \            Source: /data\n       Destination: /var/www/html\n      Generating...\n\
    \                    done.\nConfiguration file: /data/_config.yml\n          \
    \  Source: /data\n       Destination: /var/www/html\n      Generating...\n   \
    \                 done.\n```\n\n我们看到 Jekyll 构建过程已经运行了第二次，我们的站点已经更新。更新内容已写入我们的卷中。现在，如果我们访问\
    \ Jekyll 网站，就应该看到我们的更新。\n\n![我们更新后的 Jekyll 网站。](img/00029.jpeg)\n\n我们更新后的 Jekyll\
    \ 网站。\n\n这一切都是在不需要更新或重启 Apache 容器的情况下发生的，因为它共享的卷被自动更新了。你可以看到这个工作流有多简单，以及你可以如何将其扩展到更复杂的部署。\n\
    \n### 6.1.7 备份我们的 Jekyll 卷\n\n你可能有点担心不删除了卷（尽管我们可以使用现有流程非常容易地重建站点）。卷的优势之一是由于它们可以挂载到任何容器中，我们可以轻松地创建它们的备份。现在创建一个新容器来备份\
    \ `/var/www/html` 卷。\n\n```\n$ sudo docker run --rm --volumes-from james_blog\
    \ \\\n-v $(pwd):/backup ubuntu \\\ntar cvf /backup/james_blog_backup.tar /var/www/html\n\
    tar: Removing leading '/' from member\n/var/www/html/\n/var/www/html/assets/\n\
    /var/www/html/assets/themes/\n$ ls james_blog_backup.tar\njames_blog_backup.tar\n\
    ```\n\n在这里，我们运行了一个标准容器并将 `james_blog` 的卷挂载到该容器中。将在容器内部创建 `/var/www/html` 目录。然后我们使用\
    \ `-v` 标志通过 `$(pwd)` 将当前目录挂载到容器内的 `/backup`。随后我们的容器运行。\n\n注意：我们还指定了 `--rm` 标志，这对于一次性或丢弃型容器非常有用。这是清理仅需一次容器的整洁方法。\n\
    \n```\ntar cvf /backup/james_blog_backup.tar /var/www/html\n```\n\n这将创建一个名为 `james_blog_backup.tar`\
    \ 的 tar 文件，其中包含 `/var/www/html` 目录的内容，然后退出。这个过程创建了我们卷的备份。这是一个简单的备份过程示例。你可以轻松将其扩展为备份到本地或云端（例如到\
    \ Amazon S3 或更传统的备份工具 Amanda）。注意：此示例也适用于存储在卷中的数据库或类似内容。只需在新的容器中挂载卷，执行备份，然后丢弃你为备份创建的容器即可。\n\
    \n### 6.1.8 扩展我们的 Jekyll 网站\n\n以下是我们扩展这个简单的 Jekyll 网站的一些方法：\n\n- 运行多个 Apache 容器，它们都使用来自\
    \ `james_blog` 的卷。在前面放置一个负载均衡器，我们就有了 Web 集群。\n- 构建进一步的镜像，克隆或复制用户提供的源码（例如 `git\
    \ clone`）到卷中。将此卷挂载到从 `jam01/fetcher` 创建的容器。这将使解决方案具有移植性，且不需要宿主机上的任何本地源码。\n- 通过前面的扩展，你可以轻松为我们的服务构建一个从指定源自动部署的\
    \ Web 前。这样你就有了自己的 GitHub Pages 变体。\n\n## 6.2 使用 Docker 构建 Java 应用程序服务器\n\n现在让我们换一种思路，将\
    \ Docker 视为应用程序服务器和构建流水线。这次我们处理的是更具“企业级”且传统的的工作负载：从 `WAR` 文件获取并运行 Java 应用程序。为了实现此目标，我们将构建两个流水线：\n\
    \n- 一个从 URL 下载 WAR 文件并将其存储在卷中的镜像。\n- 一个安装了 Tomcat 的镜像来运行这些下载的文件。\n\n### 6.2.1\
    \ 文件 fetcher\n\n让我们通过构建一个用于下载 WAR 文件的镜像并开始，将其挂载到卷中。\n\n```\n$ mkdir fetcher\n\
    $ cd fetcher\n$ touch Dockerfile\n```\n\n现在填充我们的 `Dockerfile`。\n\n```dockerfile\n\
    FROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\nENV REFRESH_AT 2016-06-01\n\
    \nRUN apt-get -y update\nRUN apt-get -y install wget\n\nVOLUME [\"/var/lib/tomcat7/webapps/\"\
    ]\nWORKDIR /var/lib/tomcat7/webapps/\n\nENTRYPOINT [\"wget\"]\nCMD [\"\"]\n```\n\
    \n这个极其简单的镜像只做一件事：当运行时，它从 URL `wget` 指定的文件并存储到 `/var/lib/tomcat7/webapps/` 目录。该目录也是一个卷，并且\
    \ `/var/lib/tomcat7/webapps/` 的工作目录。我们将此卷与 Tomcat 共享并运行其内容。\n\n最后，`ENTRYPOINT`\
    \ 和 `CMD` 指令允许容器在未指定 URL 时运行时，通过返回 `wget` 的帮助输出来实现。\n\n现在让我们构建此镜像。\n\n```\n$ sudo\
    \ docker build -t jam01/fetcher .\n```\n\n### 6.2.2 获取 WAR 文件\n\n让我们获取一个示例文件来开始使用新镜像。我们将从\
    \ `https://tomcat.apache.org/tomcat-7.0-doc/appdev/` 下载示例 Apache 应用程序。\n\n```\n\
    $ sudo docker run -t -i --name sample jamtur01/fetcher \\\nhttps://tomcat.apache.org/tomcat-7.0-doc/appdev/sample.war\n\
    --2014-06-21 06:05:19-- https://tomcat.apache.org/tomcat-7.0-doc/appdev/sample.war\n\
    Resolving tomcat.apache.org (tomcat.apache.org)... 140.211.11.131, 192.87.106.229,\
    \ 2001:610:1:80bc:192:87:106:229\nConnecting to tomcat.apache.org (tomcat.apache.org)|140.211.11.131|:443...\
    \ connected.\nHTTP request sent, awaiting response... 200 OK\nLength: 4606 (4.5K)\n\
    Saving to: 'sample.war'\n\n100%[=================================>] 4,606    \
    \   --.-K/s   in 0\n\n2014-06-21 06:05:19 (14.4 MB/s) - 'sample.war' saved [4606/4606]\n\
    ```\n"
