    ```\n\n我们又运行了另一个容器：这次来自 `jamtur01/redis_replica` 镜像。我们再次指定了主机名（使用 `-h` 标志）为 `redis_replica1`\
    \ 以及名称（使用 `--name`）为 `redis_replica1`。我们还使用了 `--net` 标志将我们的 Redis 副本容器运行在 `express`\
    \ 网络中。\n\n让我们检查这个新容器的日志。\n\n```\n$ sudo docker run -ti --rm --volumes-from redis_replica1\
    \ \\\nubuntu cat /var/log/redis/redis-replica.log\n...\n1:S 05 Aug 15:23:57.733\
