    ### 4.5.10 Dockerfile instructions


    We’ve already seen some of the available `Dockerfile` instructions, like `RUN`
    and `EXPOSE`. But there are also a variety of other instructions we can put in
    our `Dockerfile`. These include `CMD`, `ENTRYPOINT`, `ADD`, `COPY`, `VOLUME`,
    `WORKDIR`, `USER`, `ONBUILD`, `LABEL`, `STOPSIGNAL`, `ARG`, `SHELL`, `HEALTHCHECK`
    and `ENV`. You can see a full list of the available `Dockerfile` instructions
    [here](http://docs.docker.com/reference/builder/).


    We’ll also see a lot more `Dockerfile`s in the next few chapters and see how to
    build some cool applications into Docker containers.


    #### 4.5.10.1 CMD


    The `CMD` instruction specifies the command to run when a container is launched.
    It is similar to the `RUN` instruction, but rather than running the command when
    the container is being built, it will specify the command to run when the container
    is launched, much like specifying a command to run when launching a container
    with the `docker run` command, for example:


    ```

    $ sudo docker run -i -t jamtur01/static_web /bin/true

    ```


    This would be articulated in the `Dockerfile` as:


    ```

    CMD ["/bin/true"]

    ```


    You can also specify parameters to the command, like so:


    ```

    CMD ["/bin/bash", "-l"]

    ```


    Here we’re passing the `-l` flag to the `/bin/bash` command.


    Warning You’ll note that the command is contained in an array. This tells Docker
    to run the command ‘as-is’. You can also specify the `CMD` instruction without
    an array, in which case Docker will prepend `/bin/sh -c` to the command. This
    may result in unexpected behavior when the command is executed. As a result, it
    is recommended that you always use the array syntax.


    Lastly, it’s important to understand that we can override the `CMD` instruction
    using the `docker run` command. If we specify a `CMD` in our `Dockerfile` and
    one on the `docker run` command line, then the command line will override the
    `Dockerfile`’s `CMD` instruction.


    Note It’s also important to understand the interaction between the `CMD` instruction
    and the `ENTRYPOINT` instruction. We’ll see some more details of this below.


    Let’s look at this process a little more closely. Let’s say our `Dockerfile` contains
    the `CMD`:


    ```

    CMD [ "/bin/bash" ]

    ```


    We can build a new image (let’s call it `jamtur01/test`) using the `docker build`
    command and then launch a new container from this image.


    ```

    $ sudo docker run -t -i jamtur01/test

    root@e643e6218589:/#

    ```


    Notice something different? We didn’t specify the command to be executed at the
    end of the `docker run`. Instead, Docker used the command specified by the `CMD`
    instruction.


    If, however, I did specify a command, what would happen?


    ```

    $ sudo docker run -i -t jamtur01/test /bin/ps

    PID TTY      TIME CMD

    1 ?    00:00:00 ps

    $

    ```


    You can see here that we have specified the `/bin/ps` command to list running
    processes. Instead of launching a shell, the container merely returned the list
    of running processes and stopped, overriding the command specified in the `CMD`
    instruction.


    Tip You can only specify one `CMD` instruction in a `Dockerfile`. If more than
    one is specified, then the last `CMD` instruction will be used. If you need to
    run multiple processes or commands as part of starting a container you should
    use a service management tool like [Supervisor](http://supervisord.org/).


    #### 4.5.10.2 ENTRYPOINT


    Closely related to the `CMD` instruction, and often confused with it, is the `ENTRYPOINT`
    instruction. So what’s the difference between the two, and why are they both needed?
    As we’ve just discovered, we can override the `CMD` instruction on the `docker
    run` command line. Sometimes this isn’t great when we want a container to behave
    in a certain way. The `ENTRYPOINT` instruction provides a command that isn’t as
    easily overridden. Instead, any arguments we specify on the `docker run` command
    line will be passed as arguments to the command specified in the `ENTRYPOINT`.
    Let’s see an example of an `ENTRYPOINT` instruction.


    ```

    ENTRYPOINT ["/usr/sbin/nginx"]

    ```


    Like the `CMD` instruction, we also specify parameters by adding to the array.
    For example:


    ```

    ENTRYPOINT ["/usr/sbin/nginx", "-g", "daemon off;"]

    ```


    Note As with the `CMD` instruction above, you can see that we’ve specified the
    `ENTRYPOINT` command in an array to avoid any issues with the command being prepended
    with `/bin/sh -c`.


    Now let’s rebuild our image with an `ENTRYPOINT` of `ENTRYPOINT ["/usr/sbin/nginx"]`.


    ```

    $ sudo docker build -t="jamtur01/static_web" .

    ```


    And then launch a new container from our `jamtur01/static_web` image.


    ```

    $ sudo docker run -t -i jamtur01/static_web -g "daemon off;"

    ```


    We’ve rebuilt our image and then launched an interactive container. We specified
    the argument `-g "daemon off;"`. This argument will be passed to the command specified
    in the `ENTRYPOINT` instruction, which will thus become `/usr/sbin/nginx -g "daemon
    off;"`. This command would then launch the Nginx daemon in the foreground and
    leave the container running as a web server.


    We can also combine `ENTRYPOINT` and `CMD` to do some neat things. For example,
    we might want to specify the following in our `Dockerfile`.


    ```

    ENTRYPOINT ["/usr/sbin/nginx"]

    CMD ["-h"]

    ```


    Now when we launch a container, any option we specify will be passed to the Nginx
    daemon; for example, we could specify `-g "daemon off";` as we did above to run
    the daemon in the foreground. If we don’t specify anything to pass to the container,
    then the `-h` is passed by the `CMD` instruction and returns the Nginx help text:
    `/usr/sbin/nginx -h`.


    This allows us to build in a default command to execute when our container is
    run combined with overridable options and flags on the `docker run` command line.


    Tip If required at runtime, you can override the `ENTRYPOINT` instruction using
    the `docker run` command with `–entrypoint` flag.


    #### 4.5.10.3 WORKDIR


    The `WORKDIR` instruction provides a way to set the working directory for the
    container and the `ENTRYPOINT` and/or `CMD` to be executed when a container is
    launched from the image.'
