    ## 0.9 Code and Examples


    You can find all the code and examples from the book on GitHub [https://github.com/turnbullpress/dockerbook-code](https://github.com/turnbullpress/dockerbook-code).


    ## 0.10 Colophon


    This book was written in Markdown with a large dollop of LaTeX. It was then converted
    to PDF and other formats using PanDoc (with some help from scripts written by
    the excellent folks who wrote [Backbone.js on Rails](https://learn.thoughtbot.com/products/1-backbone-js-on-rails)).


    ## 0.11 Errata


    Please email any errata you find to [james+errata@lovedthanlost.net](mailto:james+errata@lovedthanlost.net).


    ## 0.12 Version


    This is version `v18.03.1-ce` (`d498111`) of The Docker Book.


    # 1 Introduction


    Containers have a long and storied history in computing. Unlike hypervisor virtualization,
    where one or more independent machines run virtually on physical hardware via
    an intermediation layer, containers instead run in user space on top of an operating
    system’s kernel. As a result, container virtualization is often called operating
    system-level virtualization. Container technology allows multiple isolated user
    space instances to be run on a single host.

