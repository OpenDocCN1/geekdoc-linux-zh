    ### 5.3.2 Create a new Jenkins job


    Now that we have a running Jenkins server, let’s continue by creating a Jenkins
    job to run. To do this, we’ll click the `create new jobs` link, which will open
    up the New Job wizard.


    ![Creating a new Jenkins job.](images/00016.jpeg)


    Creating a new Jenkins job.


    Let’s name our new job `Docker_test_job`, select a job type of `Freestyle project`,
    and click `OK` to continue to the next screen.


    Now let’s fill in a few sections. We’ll start with a description of the job. Then
    click the `Advanced. . .` button, tick the `Use Custom workspace` radio button,
    and specify `/var/jenkins_home/jobs/${JOB_NAME}/workspace` as the `Directory`.
    This is the workspace in which our Jenkins job is going to run. It’s also stored
    in our Jenkins home directory to ensure we maintain state across builds.


    Under `Source Code Management`, select `Git` and specify the following test repository:
    `https://github.com/turnbullpress/docker-jenkins-sample.git`. This is a simple
    repository containing some Ruby-based RSpec tests.


    ![Jenkins job details part 1.](images/00017.jpeg)


    Jenkins job details part 1.


    Now we’ll scroll down and update a few more fields. First, we’ll add a build step
    by clicking the `Add Build Step` button and selecting `Execute shell`. Let’s specify
    this shell script that will launch our tests and Docker.


    ```

    # Build the image to be used for this job.

    IMAGE=$(sudo docker build . | tail -1 | awk ''{ print $NF }'')


    # Build the directory to be mounted into Docker.

    MNT="$WORKSPACE/.."


    # Execute the build inside Docker.

    CONTAINER=$(sudo docker run -d -v $MNT:/opt/project/ $IMAGE /bin/bash -c ''cd
    /opt/project/workspace; rake spec'')


    # Attach to the container so that we can see the output.

    sudo docker attach $CONTAINER


    # Get its exit code as soon as the container stops.

    RC=$(sudo docker wait $CONTAINER)


    # Delete the container we''ve just used.

    sudo docker rm $CONTAINER


    # Exit with the same value as that with which the process exited.

    exit $RC

    ```


    So what does this script do? Firstly, it will create a new Docker image using
    a `Dockerfile` contained in the Git repository we’ve just specified. This `Dockerfile`
    provides the test environment in which we wish to execute. Let’s take a quick
    look at it now.


    ```

    FROM ubuntu:16.04

    LABEL maintainer="james@example.com"

    ENV REFRESHED_AT 2016-06-01

    RUN apt-get update

    RUN apt-get -y install ruby rake

    RUN gem install --no-rdoc --no-ri rspec ci_reporter_rspec

    ```'
