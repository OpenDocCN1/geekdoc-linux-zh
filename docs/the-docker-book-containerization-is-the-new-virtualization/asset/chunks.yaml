    `Dockerfile` 管理并保持其更新。在这种情况下，我们的基础设施配置不仅与代码一起，而且管理该配置变成了一个简单的过程。然后（从该镜像）创建容器，我们在其中运行测试。测试完成后，我们可以丢弃这些容器。


    提示：你也可以使用[参数化构建](https://wiki.jenkins-ci.org/display/JENKINS/Parameterized+Build)
    来使此作业更通用。


    ## 5.4 多配置 Jenkins


    我们现在已经看到了使用 Jenkins 进行简单的单容器构建。如果我们想在多个平台上测试我们的应用程序呢？假设我们想在 Ubuntu、Debian 和 CentOS
    上测试它。为了实现这一点，我们可以利用一种称为“多配置作业”（multi-configuration job）的作业类型，它允许运行测试矩阵的测试作业。


    ### 5.4.1 创建多配置作业


    让我们看看如何创建多配置作业。点击 Jenkins 控制台上的 `New Item`（新建项目）链接。我们将新作业命名为 `Docker_matrix_job`，选择
    `Multi-configuration project`（多配置项目），并点击 `OK`。


    ![Creating a multi-configuration job.](img/00022.jpeg)


    创建多配置作业


    我们将看到一个与之前作业创建界面类似的屏幕。为我们的作业添加描述，选择 `Git` 作为仓库类型，并指定我们的示例仓库：`https://github.com/turnbullpress/docker-jenkins-sample.git`。


    接下来，向下滚动配置我们的多配置轴（axis）。轴是作业一部分执行的矩阵元素列表。我们将点击 `Add Axis`（添加轴）按钮并选择 `User-defined
    Axis`（自定义轴）。我们将指定一个名为 `OS` 的轴，并指定三个值：`centos`、`debian` 和 `ubuntu`。当我们执行多配置作业时，Jenkins
    将查看此轴并生成三个作业：对应轴上的每个点。


    然后，在 `Build Environment`（构建环境）部分，我们点击 `Delete workspace before build starts`（构建前删除工作空间）。此选项将在启动新作业集之前删除检出的仓库来清理我们的构建环境。


    ![Configuring a multi-configuration job Part 2.](img/00023.jpeg)


    配置多配置作业部分 2


    最后，我们指定了另一个带有简单 Shell 脚本的 Shell 构建步奏。它是我们之前使用的 Shell 脚本的修改版本。


