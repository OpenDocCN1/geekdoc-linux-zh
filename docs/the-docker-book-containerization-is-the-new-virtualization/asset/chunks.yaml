    \ Docker 进行测试。\n\n## 5.1 使用 Docker 进行测试\n\nDocker 最强大的功能之一是创建一致测试环境。你可以使用 Docker\
    \ 启动你的应用程序及其所有依赖，然后针对它们运行测试。\n\n### 5.1.1 在容器中运行测试\n\n运行测试的最简单方法是在容器内部直接运行：\n\n\
