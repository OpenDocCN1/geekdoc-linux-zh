    Bar\\\"}]\"\n```\n\n在这里我们连接到了应用程序，应用程序连接到了 Redis，检查了键列表发现我们有一个名为 `params` 的键，然后查询该键发现我们的参数（`name=Foo`\
    \ 和 `status=Bar`）都已存储在 Redis 中。我们的应用程序运行正常！\n\n### 5.2.6.1 将现有容器连接到网络\n\n你也可以使用\
