    在容器运行时，我们想要使用 `docker attach` 命令连接到容器以获取其输出，然后使用 `docker wait` 命令。这将测试输出回到我们的
    Jenkins 作业中。最后，`docker wait` 命令会阻塞直到容器正在执行的命令完成，然后返回容器的退出码。`RC` 变量捕捉了容器完成时的退出码。


    最后，我们清理并删除刚刚创建的容器，并带有容器的退出码退出。这应该是我们测试运行的退出码。Jenkins 依靠这个退出码来判断作业的测试是运行成功还是失败。


