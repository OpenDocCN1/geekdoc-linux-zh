    `Dockerfile` 了。让我们过一遍它的具体功能。


    我们首先将 `USER` 设置为 `root`，安装了 `sudo` 软件包并允许 `jenkins` 用户使用 `sudo`。然后我们安装了 `Docker`
    二进制文件。我们将用它连接到 Docker 宿主机并为构建运行容器。


    接下来，我们切换回 `jenkins` 用户。该用户是 `jenkins` 镜像的默认用户，且从该镜像启动的容器需要它才能正确运行 Jenkins。然后我们使用
    `RUN` 指令执行 `install-plugins.sh` 命令，安装我们将使用的一系列 Jenkins 插件。


