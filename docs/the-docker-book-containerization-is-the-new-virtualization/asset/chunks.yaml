    We now have an image with an `ONBUILD` instruction that uses the `ADD` instruction
    to add the contents of the directory we’re building from to the `/var/www/` directory
    in our image. This could readily be our generic web application template from
    which I build web applications.


    Let’s try this now by building a new image called `webapp` from the following
    `Dockerfile`:


    ```

    FROM jamtur01/apache2

    LABEL maintainer="james@example.com"

    ENV APPLICATION_NAME webapp

    ENV ENVIRONMENT development

    ```


    Let’s look at what happens when I build this image.


    ```

    $ sudo docker build -t="jamtur01/webapp" .

    ...

    Step 0 : FROM jamtur01/apache2

    # Executing 1 build triggers

    Step onbuild-0 : ADD . /var/www/

    ---> 1a018213a59d

    ---> 1a018213a59d

    Step 1 : LABEL maintainer="james@example.com"

    ...

    Successfully built 04829a360d86

    ```


    We see that straight after the `FROM` instruction, Docker has inserted the `ADD`
    instruction, specified by the `ONBUILD` trigger, and then proceeded to execute
    the remaining steps. This would allow me to always add the local source and, as
    I’ve done here, specify some configuration or build information for each application;
    hence, this becomes a useful template image.


    The `ONBUILD` triggers are executed in the order specified in the parent image
    and are only inherited once (i.e., by children and not grandchildren). If we built
    another image from this new image, a grandchild of the `jamtur01/apache2` image,
    then the triggers would not be executed when that image is built.


    **Note**: There are several instructions you can’t `ONBUILD`: `FROM`, `MAINTAINER`,
    and `ONBUILD` itself. This is done to prevent Inception-like recursion in `Dockerfile`
    builds.


    ## 4.6 Pushing images to the Docker Hub


    Once we’ve got an image, we can upload it to the [Docker Hub](https://hub.docker.com).
    This allows us to make it available for others to use. For example, we could share
    it with others in our organization or make it publicly available.


    **Note**: The Docker Hub also has the option of private repositories. These are
    a paid-for feature that allows you to store an image in a private repository that
    is only available to you or anyone with whom you share it. This allows you to
    have private images containing proprietary information or code you might not want
    to share publicly.


    We push images to the Docker Hub using the `docker push` command.


    Let’s build an image without a user prefix and try and push it now.


    ```

    $ cd static_web

    $ sudo docker build --no-cache -t="static_web" .

    . . .

    Successfully built a312a2ed58c7

    $ sudo docker push static_web

    The push refers to a repository [docker.io/library/static_web]

    c0121fc36460: Preparing

    8591faa9900d: Preparing

    9a39129ae0ac: Preparing

    98305c1a8f5e: Preparing

    0185b3091e8e: Preparing

    ea9f151abb7e: Waiting

    unauthorized: authentication required

    ```


    What’s gone wrong here? We’ve tried to push our image to the repository `static_web`,
    but Docker knows this is a root repository. Root repositories are managed only
    by the Docker, Inc., team and will reject our attempt to write to them as unauthorized.
    Let’s try again, rebuilding our image with a user prefix and then pushing it.


    ```

    $ sudo docker build --no-cache -t="jamtur01/static_web" .

    $ sudo docker push jamtur01/static_web

    The push refers to a repository [jamtur01/static_web] (len: 1)

    Processing checksums

    Sending image list

    Pushing repository jamtur01/static_web to registry-1.docker.io (1 tags)

    . . .

    ```


    This time, our push has worked, and we’ve written to a user repository, `jamtur01/static_web`.
    We would write to your own user ID, which we created earlier, and to an appropriately
    named image (e.g., `youruser/yourimage`).


    We can now see our uploaded image on the [Docker Hub](https://hub.docker.com/r/jamtur01/static_web/).


    ![Your image on the Docker Hub.](images/00007.jpeg)


    Your image on the Docker Hub.


    **Tip**: You can find documentation and more information on the features of the
    Docker Hub [here](https://docs.docker.com/docker-hub/).


    ### 4.6.1 Automated Builds


    In addition to being able to build and push our images from the command line,
    the Docker Hub also allows us to define Automated Builds. We can do so by connecting
    a [GitHub](https://www.github.com) or [BitBucket](https://bitbucket.com) repository
    containing a `Dockerfile` to the [Docker Hub](https://hub.docker.com). When we
    push to this repository, an image build will be triggered and a new image created.
    This was previously also known as a Trusted Build.


    **Note**: Automated Builds also work for private GitHub and BitBucket repositories.


    The first step in adding an Automated Build to the Docker Hub is to connect your
    GitHub account or BitBucket account. [Note: The source text provided contained
