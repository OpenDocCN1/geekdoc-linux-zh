- fmt: "\n```\n$ mkdir -p nodejs/nodeapp\n$ cd nodejs/nodeapp\n$ wget https://raw.githubusercontent.com/jamtur01/dockerbook-code/master/code/6/node/nodejs/nodeapp/package.json\n\
    $ wget https://raw.githubusercontent.com/jamtur01/dockerbook-code/master/code/6/node/nodejs/nodeapp/server.js\n\
    $ cd ..\n$ vi Dockerfile\n```\n\nWe’ve created a new directory called `nodejs`\
    \ and a sub-directory, `nodeapp`, to hold our application code. We’ve then changed\
    \ into this directory and downloaded the source code for our Node.JS application.\n\
    \n**Note**: You can get our Node application’s source code on GitHub [here](https://github.com/turnbullpress/dockerbook-code/tree/master/code/6/node/).\n\
    \nFinally, we’ve changed back to the `nodejs` directory and now we populate our\
    \ `Dockerfile`.\n\n```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\
    \nENV REFRESHED_AT 2016-06-01\n\nRUN apt-get -yqq update\nRUN apt-get -yqq install\
    \ nodejs npm\nRUN ln -s /usr/bin/nodejs /usr/bin/node\nRUN mkdir -p /var/log/nodeapp\n\
    \nADD nodeapp /opt/nodeapp/\n\nWORKDIR /opt/nodeapp\nRUN npm install\n\nVOLUME\
    \ [ \"/var/log/nodeapp\" ]\n\nEXPOSE 3000\n\nENTRYPOINT [ \"nodejs\", \"server.js\"\
    \ ]\n```\n\nOur Node.js image installs Node and makes a simple workaround of linking\
    \ the binary `nodejs` to `node` to address some backwards compatibility issues\
    \ on Ubuntu.\n\nWe then add our `nodeapp` code into the `/opt/nodeapp` directory\
    \ using an `ADD` instruction. Our Node.js application is a simple Express server\
    \ and contains both a `package.json` file holding the application’s dependency\
    \ information and the `server.js` file that contains our actual application. Let’s\
    \ look at a subset of that application.\n\n```\n. . .\n\nvar logFile = fs.createWriteStream('/var/log/nodeapp/nodeapp.log',\
    \ {flags: 'a'});\n\napp.configure(function() {\n\n. . .\n\n  app.use(express.session({\n\
    \        store: new RedisStore({\n            host: process.env.REDIS_HOST ||\
    \ 'redis_primary',\n            port: process.env.REDIS_PORT || 6379,\n      \
    \      db: process.env.REDIS_DB || 0\n        }),\n        cookie: {\n\n. . .\n\
    \napp.get('/', function(req, res) {\n  res.json({\n    status: \"ok\"\n  });\n\
    });\n\n. . .\n\nvar port = process.env.HTTP_PORT || 3000;\nserver.listen(port);\n\
    console.log('Listening on port ' + port);\n```\n\nThe `server.js` file pulls in\
    \ all the dependencies and starts an Express application. The Express app is configured\
    \ to store its session information in Redis and exposes a single endpoint that\
    \ returns a status message as JSON. We’ve configured its connection to Redis to\
    \ use a host called `redis_primary` with an option to override this with an environment\
    \ variable if needed.\n\nThe application will also log to the `/var/log/nodeapp/nodeapp.log`\
    \ file and will listen on port `3000`.\n\n**Note**: You can get our Node application’s\
    \ source code on GitHub [here](https://github.com/turnbullpress/dockerbook-code/tree/master/code/6/node/).\n\
    \nWe’ve then set the working directory to `/opt/nodeapp` and installed the prerequisites\
    \ for our Node application. We’ve also created a volume that will hold our Node\
    \ application’s logs, `/var/log/nodeapp`.\n\nWe expose port `3000` and finally\
    \ specify an `ENTRYPOINT` of `nodejs server.js` that will run our Node application.\n\
    \nLet’s build our image now.\n\n```\n$ sudo docker build -t jamtur01/nodejs .\n\
    ```\n\n### 6.3.2 The Redis base image\n\nLet’s continue with our first Redis image:\
    \ a base image that will install Redis. It is on top of this base image that we’ll\
    \ build our Redis primary and replica images.\n\n```\n$ mkdir redis_base\n$ cd\
    \ redis_base\n$ vi Dockerfile\n```\n\nNow let’s populate our `Dockerfile`.\n\n\
    ```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT\
    \ 2017-06-01\n\nRUN apt-get -yqq update\nRUN apt-get install -yqq software-properties-common\
    \ python-software-properties\nRUN add-apt-repository ppa:chris-lea/redis-server\n\
    RUN apt-get -yqq update\nRUN apt-get -yqq install redis-server redis-tools\n\n\
    VOLUME [ \"/var/lib/redis\", \"/var/log/redis\" ]\n\nEXPOSE 6379\nCMD []\n```\n\
    \nOur Redis base image installs the latest version of Redis (from a PPA rather\
    \ than using the older packages shipped with Ubuntu), specifies two `VOLUME`s\
    \ (`/var/lib/redis` and `/var/log/redis`), and exposes the Redis default port\
    \ `6379`. It doesn’t have an `ENTRYPOINT` or `CMD` because we’re not actually\
    \ going to run this image. We’re just going to build it.\n\n```\n$ sudo docker\
    \ build -t jamtur01/redis\n```\n\n### 6.3.3 The Redis primary image\n\nLet’s create\
    \ the Redis primary image on top of the base image.\n\n```\n$ mkdir redis_primary\n\
    $ cd redis_primary\n$ vi Dockerfile\n```\n\nNow let’s populate our `Dockerfile`.\n\
    \n```\nFROM ubuntu:16.04\nLABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT\
    \ 2017-06-01\n\nRUN apt-get -yqq update\nRUN apt-get install -yqq redis-server\
    \ redis-tools\n\nVOLUME [ \"/var/lib/redis\", \"/var/log/redis\" ]\n\nEXPOSE 6379\n\
    ```\n\nOur Redis primary image is based on the base image and has an `ENTRYPOINT`.\
    \ Let’s build our image now.\n\n```\n$ sudo docker build -t jamtur01/redis-primary\n\
    ```\n\n### 6.3.4 The Redis replica image\n\nAs a complement to the primary image,\
    \ we will create a replica image.\n\n```\n$ mkdir redis_replica\n$ cd redis_replica\n\
    $ touch Dockerfile\n```\n\nNow let’s populate our `Dockerfile`.\n\n```\nFROM ubuntu:16.04\n\
    LABEL maintainer=\"james@example.com\"\nENV REFRESHED_AT 2017-06-01\n\nRUN apt-get\
    \ -yqq update\nRUN apt-get install -yqq redis-server redis-tools\n\nVOLUME [ \"\
    /var/lib/redis\", \"/var/log/redis\" ]\n\nEXPOSE 6379\nENTRYPOINT [\"redis-server\"\
    , \"--replica-of\", \"redis_primary\"]\n```\n\nOur Redis replica image is based\
    \ on the base image and has an `ENTRYPOINT` that tells it to be a replica. Let’s\
    \ build our image now.\n\n```\n$ sudo docker build -t jamtur01/redis-replica\n\
    ```\n\n### 6.3.5 Creating our Redis back-end cluster\n\nNow that we have both\
    \ primary and replica image, we build our own replication environment. Let’s start\
    \ by creating a network. We’ll call it `express`.\n\n```\n$ sudo docker network\
    \ create redis\n```\n\nNow let’s run the primary container inside this network.\n\
    \n```bash\n$ sudo docker run -d -h redis_primary \\\n--net redis --name redis_primary\
    \ jamtur01/redis-primary\n```\n\nNow let’s run the replica container inside this\
    \ network.\n\n```bash\n$ sudo docker run -d -h redis_replica \\\n--net redis --name\
    \ redis_replica jamtur01/redis-replica\n```\n\nNow let’s check that both containers\
    \ are running.\n\n```bash\n$ docker ps\n```\n\nBoth containers are running. Now\
    \ let’s check that the replica can connect to the primary.\n\n```bash\n$ docker\
    \ exec redis_replica redis-cli ping\n```\n\nThe output should be `PONG`. This\
    \ means our Redis cluster is working.\n"
