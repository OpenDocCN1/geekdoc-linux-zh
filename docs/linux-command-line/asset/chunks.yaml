    a specific purpose and being designed exactly for that task. The idea is to use
    one tool per task. In order to achieve more complex goals, you would combine several
    tools into a chain. The following example combines the two commands ‘ls’ and ‘wc’
    by means of a pipe to be able to count the number of Python files in the current
    directory.


    | $ ls *.py &#124; wc -l6$ |


    We will explain these commands and their usage in more detail later on in the
    guide.


    1.2 A Brief History of Linux


    Similar to UNIX, the Linux operating system has different roots and is based on
    the work of quite a few masterminds. Among others, this includes Richard M. Stallman,
    Andrew S. Tanenbaum and Linus Torvalds.


    Richard M. Stallman, a hacker and developer at MIT, is the first president of
    the Free Software Foundation (FSF), and the father of the GNU project. GNU abbreviates
    the slogan GNU is Not UNIX. The goal of the project was to develop a free UNIX
    operating system. Until the beginning of the 1990s a collection of tools was available,
    but the kernel was still missing. The entire software was published under the
    GNU Public License (GPL) around 1983\.


    The next step for Linux came from Andrew S. Tanenbaum. At that time, he was a
    professor at the University of Amsterdam. For his students he developed Minix,
    an operating system for educational purposes to demonstrate and understand the
    UNIX principles. As he pointed out, Minix was not intended to be used in practice.


    Linus Torvalds, a Finish student at the University of Helsinki, was a user of
    Minix and quite unhappy with its boundaries. In 1990 he began to develop a new
    operating system based on the ideas of Minix, the UNIX principles, and the POSIX
    standard. His motivation was to have his own system that was understandable, and
    maximized to the boundaries of the hardware. He also wanted to have fun, and had
    no commercial intent in mind. The entire story behind Linux is described in his
    autobiographical book titled Just for Fun. Today, Linus Torvalds oversees the
    development of the Linux kernel.


    To make Linux attractive to the outside world it needed a nice logo. Based on
    a competition for mascots, a large number of proposals were handed in. Larry Ewing
    sent in his idea for a penguin as seen on the cover of this book, and his proposal
    won. Designed with a cheeky smile and a well-fed body this penguin, named Tux,
    represents the image of a happy and satisfied user.


    1.3 Linux Range of Use


    Originally designed for Intel-based systems, Linux runs on a variety of platforms
    today. Among others this includes the ARM architectures (named arm and arm64),
    Motorola/Freescale’s 68k architecture (m68k), Intel x86 (i386 and amd64), IBM
    s390 (s390), PowerPC (powerpc) and SPARC (sparc).


    Right from the beginning Linux focused on server systems. It is in constant use
    as a web server, file server, mail and news server, internet gateway, wireless
    router and firewall. Used as a computing unit, it helped to render video sequences
    and entire films such as Titanic, Shrek and Toy Story. Furthermore, Linux is in
    use in automotive products, astronautics, military, logistics and the engineering
    environment. Since 2006, Linux servers run all the world’s stock exchanges. It
    also runs almost all internet search engines.


    Over the last decade Linux also conquered the desktop. Due to its high flexibility
    and stability, it works as a reliable setup for text processing, graphic design,
    desktop publishing, calculations in spreadsheets, communication (email, chat,
    audio, and video) as well as user interfaces for your phone and television.


    1.4 Linux Certifications


    The widespread use of Linux has increased the demand for engineers and users who
    know exactly what they are doing. At this point a certification for Linux becomes
    advantageous. These certifications can be divided into programs that are general
    (not specific to a distribution) and focused (specific to a Linux distribution).
    The lists below give an overview of the primary certifications that currently
    exist.


    # Chapter 1. Using the Linux


    If you are reading this book, you either have Linux and need some help learning
    how to use it, or you are thinking about getting Linux. For those who are still
    “on the fence” about making the switch to this operating system, this section
    should help you decide.


    One problem with technology fanatics is that they can be very biased — almost
    like sports fans. If you were to speak with someone who loves Linux, and has been
    using it for years, they might paint a very positive picture of it. In addition,
    they would probably tell you that the other operating systems are junk. However,
    someone who loves Mac OS or Windows might inform you that Linux is junk, and that
    you shouldn’t bother trying to use it.


    Many people seem to believe that Linux is overly complicated, and that only truly
    dedicated tech-lovers could ever hope to figure out how to use it. That is very
    untrue, and if you are worried that Linux is hard to use, leave those thoughts
    behind. There are versions of Linux that many believe are more user-friendly than
    anything else available.


    Now, with an open mind, take a look at some of the top reasons why you should
    choose to use Linux:


    ● It is free. This is probably one of the biggest reasons for many people to choose
    anything. Of course, your computer probably came with an operating system already,
    and that would make this a minor factor. Have you thought about updates in the
    future? It will cost money to upgrade to the latest operating systems, in most
    situations. On the other hand, Linux is free and it will almost certainly be free
    long into the future.


    ● Great with slow computers. Many people choose to install Linux on older, slower
    computers. If you are still using an old PC from 10 years ago, the chances are
    that it will not run a new operating system well. Many people are happy running
    the operating system that came with their old computer. However, in time, these
    stops being supported, making them very unsecure, and almost impossible to use
    in any productive way. There are some versions of Linux that are specifically
    designed to run on low-end hardware, so you can get more out of your old PC. But
    keep in mind that not all versions of Linux will run well on slower hardware.


    ● Greater security. If you have been online much in your life, you are probably
    painfully aware of computer viruses. Even if you do have an antivirus on other
    computers, there is still a chance that your system with be corrupted. Linux users
    do not have to worry about computer viruses. In fact, you will not even need to
    install an antivirus on a computer running Linux.'
