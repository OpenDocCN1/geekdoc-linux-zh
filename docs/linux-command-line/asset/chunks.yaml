  trans: "\n你可以使用 `lcd` 命令来更改本地目录。在下面的示例中，使用 `!pwd` 命令来检查远程目录，并使用 `lcd` 命令切换到 `Documents`（文档）目录。\n\
    \n![](img/image00205.jpeg) \n\n## 获取文件 \n\n要从 FTP 服务器获取或下载文件，可以使用 `get` 命令后跟文件名。在下面的示例中，使用\
    \ `!ls` 命令查看本地目录，使用 `ls` 命令查看远程目录，使用 `mget` 命令获取 `myfile4` 文件，并使用 `!ls` 命令查看本地目录以验证文件是否已下载。\n\
    \n![](img/image00206.jpeg) \n\n要从 FTP 服务器获取或下载多个文件，可以像下面的示例所示使用 `mget` 命令后跟文件名。\n\
    \n![](img/image00207.jpeg)\n\n## 上传文件\n\n要向 FTP 服务器存入或上传文件，可以使用 `put` 命令后跟文件名。默认情况下，`vsftpd`\
    \ 的配置为不允许写入 FTP 服务器，如下面的示例所示。\n\n![](img/image00208.jpeg) \n\n若要启用向 FTP 服务器写入，必须编辑\
    \ `vsftpd.conf` 文件，删除 `write_enable=YES` 一行前面的 `#` 字符并保存文件。Ubuntu 和 Debian 将 `vsftpd.conf`\
    \ 文件放在 `/etc/` 目录下，而 Fedora 将该文件放在 `/etc/vsftpd` 目录下。\n\n![00133.jpeg](img/image00209.jpeg)\n\
    \n你需要重启 vsftpd 服务。\n\n```bash\nsudo systemctl restart vsftpd\n```\n\n一旦服务器重启，你就可以像下面的示例所示使用\
    \ `put` 命令上传文件了。\n\n![00134.jpeg](img/image00210.jpeg)\n\n若要向 FTP 服务器上传多个文件，可以像下面的示例所示使用\
    \ `mput` 命令后跟文件名和通配符。\n\n![00135.jpeg](img/image00211.jpeg)\n\n## 退出 FTP\n\n要退出\
    \ ftp 程序，只需使用 `exit` 命令即可。\n\n## SFTP\n\n由于 FTP 是不安全的，因此不建议用于安全文件传输。要安全地传输文件，你可以使用\
    \ SFTP 协议，它使用 TCP 端口 `22`  SSH 协议来传输文件。\n\n你可以像在下面的示例中使用 `ftp` 命令一样使用 `sftp` 命令。\n\
    \n![00136.jpeg](img/image00212.jpeg)\n\n## HTTP/HTTPS\n\n你可以使用 HTTP 和 HTTPS 协议共享文件。放置在\
    \ Web 服务器上下载的文件可以使用 `wget` 命令后跟 URL 从命令行下载，如下面的示例所示。\n\n![00137.jpeg](img/image00213.jpeg)\n\
    \n如果下载文件目录中已存在同名文件，`wget` 命令会在文件名末尾添加一个 `.` 和一个数字。\n\n## NFS\n\n网络文件系统 (NFS) 允许\
    \ Linux 系统之间跨网络共享文件和目录。NFS 服务器托管目录，NFS 客户端可以在远程系统上挂载。\n\n### Ubuntu 和 Debian 服务器\n\
    \n在 Ubuntu 和 Debian 上安装 NFS 服务器，使用 `apt-get install` 命令。\n\n```bash\nsudo apt-get\
    \ install nfs-kernel-server\n```\n\n### Fedora 服务器  \n\n在 Fedora 上安装 NFS 服务器，使用\
    \ `dnf install` 命令。\n\n```bash\nsudo dnf install nfs-utils --best\n```\n\n###\
    \ 防火墙\n\n如果你的 Linux 系统安装并运行了基于主机的防火墙，则你必须开放 NFS TCP 和 UDP 端口 `2049` 的入站端口以允许传入连接。在\
    \ Linux 系统上运行 NFS 等协议都存在安全风险，因此在打开防火墙端口之前，请确保已正确配置系统并将其放置在网络中。\n\n本节将涵盖以下子章节：\n\
    \n- Ubuntu 和 Debian\n- Fedora\n- `/etc/exports`\n\n#### Ubuntu 和 Debian\n\nUbuntu\
    \ 和 Debian 使用简单防火墙 (UFW) 来控制基本的防火墙配置，但防火墙默认未配置。使用以下命令打开 TCP 和 UDP 端口 `2049`：\n\
    \n```bash\nsudo ufw allow in nfs\n```\n\n#### Fedora\n\nFedora 使用 firewalld 控制基本的防火墙配置，且防火墙默认已配置。使用以下命令打开\
    \ TCP 和 UDP 端口 `2049`：\n\n```bash\nfirewall-cmd --permanent --add-service=nfs\n\
    firewall-cmd --reload\n```\n\n#### /etc/exports\n\n安装完服务器后，需要编辑 `/etc/exports`\
    \ 文件以添加你想要通过 NFS 提供的目录。\n\n```bash\nsudo vi /etc/exports\n```\n\nexports 文件中的条目语法如下：\n\
    \n`directoryhosts(options)`\n\n- `directory` 是你想要共享的本地目录。\n- `hosts` 是允许访问该共享的主机。你可以使用\
    \ IP 地址、网络 ID、主机名或 `*`（表示所有主机）。\n- `options` 控制共享的权限。以下是常用选项：\n  - `ro` - 只读访问\n\
    \  - `rw` - 读写写访问\n  - `no_root_squash` - 允许客户端的 root 用户在服务器上拥有 root 权限。\n  -\
    \ `no_subtree_check` - 如果共享了整个卷，则禁用目录子树的验证以加快访问速度。\n  - `sync` - 防止数据损坏\n\n以下是\
    \ `/etc/exports` 文件中的共享示例：\n\n向任何 IP 地址共享 `/home` 目录并提供读写权限：\n`/home *(rw)`\n\n\
    向 IP 地址 192.168.1.3 共享 `/home` 目录并提供只读权限：\n`/home 192.168.1.3(ro)`\n\n向 IP 地址\
    \ 192.168.1.3（读写）和 192.168.1.4（只读）共享 `/home` 目录并允许 root 拥有权限：\n`/home 192.168.1.3(rw,no_root_squash)\
    \ 192.168.1.4(ro,no_root_squash)`\n\n一旦编辑了 `/etc/exports` 文件，你必须重启 nfs 服务：\n\n\
    对于 Ubuntu 和 Debian：\n```bash\nsudo systemctl restart nfs-kernel-server\n```\n\n\
    对于 Fedora：\n```bash\nsudo systemctl restart nfs-server\n```\n\n### NFS 客户端\n\n\
    为了从 Linux 系统连接到 NFS 服务器，系统必须拥有 NFS 客户端，且客户端的用户在服务器上具有相同的用户名和密码。\n\n#### Ubuntu\
    \ 和 Debian\n\n在 Ubuntu 和 Debian 上安装 NFS 客户端，使用 `apt-get install` 命令。\n\n```bash\n\
    sudo apt-get install nfs-common\n```\n\n#### Fedora\n\n在 Fedora 上安装 NFS 客户端，使用\
    \ `dnf install` 命令。\n\n```bash\nsudo dnf install nfs-utils --best\n```\n\n####\
    \ mount\n\n为了访问 NFS 服务器上的 NFS 共享，你必须将共享挂载到本地空目录。使用 `mkdir` 命令制作一个空目录：\n\n```bash\n\
    mkdir ~/mydir\n```\n\n将共享挂载到空目录，使用 `mount` 命令。语法如下：\n\n```bash\nsudo mount ip_address:share_name\
    \ local_directory\n```\n\n在下面的示例中，使用 `mount` 命令将 IP 地址为 192.168.56.163 的 NFS 服务器上的\
    \ `/home` 文件夹挂载到本地文件夹 `myfolder`。\n\n![00138.jpeg](img/image00214.jpeg)\n\n若要在启动时自动挂载共享，请将共享信息添加到\
    \ `/etc/fstab` 文件：\n\n```\n192.168.56.163:/home ~/myfoldernfsrw00\n```\n\n"
- fmt: "\nTo install the Samba server on Ubuntu and Debian use the `apt-get install`\
    \ command.\n\n```bash\nsudo apt-get install samba\n```\n\n![00139.jpeg](Images/image00215.jpeg)\n\
    \n### Fedora Server\n\nTo install the Samba server on Fedora use the `dnf install`\
    \ command.\n\n```bash\nsudo dnf install samba --best\n```\n\nFedora does not automatically\
    \ start the `smb` service so you will need to start the service using the `systemctl`\
    \ command.\n\n```bash\nsudo systemctl start smb nmb\n```\n\n### Firewalls\n\n\
    If your Linux system has a host-based firewall installed and running then you\
    \ will have to open up the port for `SMB`, `TCP` port `445`, inbound in order\
    \ to allow incoming connections. There are security risks with running any protocol\
    \ such as `SMB` on a Linux system so make sure that you have the system properly\
    \ configured and placed in the network before opening up a port on the firewall.\n\
    \nThe following subsections will be covered in this section:\n\n- [Ubuntu and\
    \ Debian](#part0000.xhtml__ohgk6qenk2xc)\n- [Fedora](#part0000.xhtml__px5dwl7dkdk7)\n\
    \n#### Ubuntu and Debian\n\nUbuntu and Debian use the Uncomplicated Firewall (`UFW`)\
    \ to control basic firewall configurations, however the firewall is not configured\
    \ by default. To open `TCP` port `445` using the following command:\n\n```bash\n\
    sudo ufw allow in samba\n```\n\n#### Fedora\n\nFedora uses `firewalld` to control\
    \ basic firewall configurations and the firewall is configured by default. To\
    \ open `TCP` port `445` using the following command:\n\n```bash\nfirewall-cmd\
    \ --permanent --add-service=samba\nfirewall-cmd --reload\n```\n\n### Configure\
    \ a Samba Password\n\nSamba uses a separate password than the Linux login password\
    \ for a user, however you can make the passwords the same. Before a user can access\
    \ a Samba share a password must be set using the `smbpasswd` command with the\
    \ `-a` option as in the example below.\n\n![00140.jpeg](Images/image00216.jpeg)\n\
    \n##### Edit `/etc/samba/smb.conf`\n\nSamba shares are defined in the `/etc/samba/smb.conf`\
    \ file.\n\n```bash\nsudo vi /etc/samba/smb.conf\n```\n\nGo to the end of the file\
    \ and add the following:\n\n```text\n[share_name]\n  comment = share_comment\n\
    \  path = share_path\n  valid users = samba_user\n  read only = yes or no\n  guest\
    \ ok = yes or no\n  browseable = yes or no\n```\n\nThe example below shows the\
    \ configuration for a share name `myshare`.\n\n![00141.jpeg](Images/image00217.jpeg)\n\
    \nYou will need to restart the `smb` service for the changes to take effect.\n\
    \n#### Ubuntu and Debian\n\n```bash\nsudo systemctl restart smbd\n```\n\n####\
    \ Fedora\n\n```bash\nsudo systemctl restart smb nbd\n```\n\n### Connecting to\
    \ a Samba Server\n\nIn order to connect from a Linux system or Windows system\
    \ to a Samba server the system must have an `SMB` client and the user using the\
    \ client must have a username and password on the server.\n\n#### Linux\n\nOn\
    \ Linux systems you have to install a Samba client is one is not already installed.\n\
    \n##### Ubuntu and Debian\n\n```bash\nsudo apt-get install smbclient\n```\n\n\
    ##### Fedora\n\n```bash\nsudo dnf install samba --best\n```\n\nOnce the Samba\
    \ client is installed you can use the `smbclient` command with the `-L` option\
    \ to query the Samba server for share information as in the examples below. The\
    \ first example is share information from an Ubuntu server and the second example\
    \ is from a Fedora server. In both examples you can see the share `myshare`. You\
    \ will have to provide the Samba password that was created previously.\n\n![00142.jpeg](Images/image00218.jpeg)\n\
    ![00143.jpeg](Images/image00219.jpeg)\n\nYou can also use the `smbclient` command\
    \ to connect to the share. In the example below there are four `\\` before the\
    \ IP address and two after. This is because when using the `smbclient` command\
    \ you must escape the `\\` character to give it meaning so if you need two `\\\
    ` characters you have to escape each one which gives you four. You will have to\
    \ provide the Samba password that was created previously. Once connected you will\
    \ get the `smb: >` prompt which means you are connected to the server. In the\
    \ example below the `?` command is used to access the help menu.\n\n![00144.jpeg](Images/image00220.jpeg)\n\
    \nWhen connected to the Samba server you can use commands to get and put files\
    \ on the server just like you can with `FTP` and `SFTP`.\n\nThe example below\
    \ shows what happens when not enough `\\` characters are used.\n\n![00145.jpeg](Images/image00221.jpeg)\n\
    \nYou can also mount Samba shares using the Common Internet File System (`CIFS`).\
    \ Most Linux system do not have `CIFS` installed by default so you will have to\
    \ install the software.\n\n##### Ubuntu and Debian\n\n```bash\nsudo apt-get install\
    \ cifs-utils\n```\n\n##### Fedora\n\n```bash\nsudo dnf install cifs-utils --best\n\
    ```\n\nOnce `CIFS` is installed you can use the `mount` command to mount the Samba\
    \ share as in the example below.\n\n![00146.jpeg](Images/image00222.jpeg)\n\n\
    You can also use the `mount` command to view information about the mounted share\
    \ as in the example below. You will want to use the `grep` command to isolate\
    \ the specific share as there may be many shares on the server.\n\n![00147.jpeg](Images/image00223.jpeg)\n\
    \nTo unmount a Samba share use the `umount` command.\n\n```bash\nsudo umount ~/myfolder\n\
    ```\n\n#### Fstab\n\nUsing the `/etc/fstab` file you can configure Samba shares\
    \ to be mounted to the filesystem during the boot process. There are some security\
    \ concerns with this configurations, however, as the Samba username and password\
    \ are place into a configuration file.\n\n##### User File\n\nSince the Samba share\
    \ controls access to the share based on a username and Samba password you have\
    \ to make the username and password available to the boot process by storing them\
    \ in a file.\n\nCreate `/etc/samba/user` file.\n\nAdd the following lines replacing\
    \ `sabmba_username` with the actual username and the `samba_password` with the\
    \ actual password.\n\n```text\nusername=sabmba_username\npassword=samba_password\n\
    ```\n\nEdit `/etc/fstab` and add the following.\n\n```text\n//ip_address/sharename\
    \ /local_mount_point cifs credentials=/etc/samba/user,noexec 0\n```\n\nReboot\
    \ the system to mount the Samba share.\n\n##### Windows\n\nTo access a Samba share\
    \ from a Windows system, open a File Explorer window and type `\\\\` followed\
    \ by the IP address of the Linux server running Samba in the address bar..\n\n\
    `\\\\ip_address\\`\n\nYou can also connect directly to the share by including\
    \ the share name.\n\n`\\\\ip_address\\sharename`\n\nYou will be required to provide\
    \ the Samba username and password.\n"
  raw: 'To install the Samba server on Ubuntu and Debian use the apt-get install command.


    sudo apt-get install samba


    ![00139.jpeg](Images/image00215.jpeg)


    ### Fedora Server   


    To install the Samba server on Fedora use the dnf install command.


    sudo dnf install samba --best


    Fedora does not automatically start the smb service so you will need to start
    the service using the systemctl command.


    sudo systemctl start smb nmb


    ### Firewalls   


    If your Linux system has a host-based firewall installed and running then you
    will have to open up the port for SMB, TCP port 445, inbound in order to allow
    incoming connections.  There are security risks with running any protocol such
    as SMB on a Linux system so make sure that you have the system properly configured
    and placed in the network before opening up a port on the firewall.


    The following subsections will be covered in this section:


    [Ubuntu and Debian](#part0000.xhtml__ohgk6qenk2xc)


    [Fedora](#part0000.xhtml__px5dwl7kdk7)


    Ubuntu and Debian


    Ubuntu and Debian use the Uncomplicated Firewall (UFW) to control basic firewall
    configurations, however the firewall is not configured by default.  To open TCP
    port 445 using the following command:


    sudo ufw allow in samba


    Fedora 


    Fedora uses firewalld to control basic firewall configurations and the firewall
    is configured by default.  To open TCP port 445 using the following command:


    firewall-cmd --permanent --add-service=samba


    firewall-cmd --reload


    ### Configure a Samba Password


    Samba uses a separate password than the Linux login password for a user, however,
    you can make the passwords the same.  Before a user can access a Samba share a
    password must be set using the smbpasswd command with the -a option as in the
    example below.


    ![00140.jpeg](Images/image00216.jpeg)


    Edit /etc/samba/smb.conf


    Samba shares are defined in the /etc/samba/smb.conf file.


    sudo vi /etc/samba/smb.conf


    Go to the end of the file and add the following:


    [share_name]


       comment = share_comment


       path = share_path


       valid users = samba_user


       read only = yes or no


       guest ok = yes or no


       browseable = yes or no


    The example below shows the configuration for a share name myshare.


    ![00141.jpeg](Images/image00217.jpeg)


    You will need to restart the smb service for the changes to take effect.


    Ubuntu and Debian


    sudo systemctl restart smbd


    Fedora


    sudo systemctl restart smb nbd


    ### Connecting to a Samba Server


    In order to connect from a Linux system or Windows system to a Samba server the
    system must have an SMB client and the user using the client must have a username
    and password on the server.


    [Linux](#part0000.xhtml__oawf115zyzwy)


    [Fstab](#part0000.xhtml__hs0eiywngor2)


    [Windows](#part0000.xhtml__rfqm994di3qv)


    Linux


    On Linux systems you have to install a Samba client is one is not already installed.


    Ubuntu and Debian


    sudo apt-get install smbclient


    Fedora


    sudo apt-get install samba --best


    Once the Samba client is installed you can use the smbclient command with the
    -L option to query the Samba server for share information as in the examples below. 
    The first example is share information from an Ubuntu server and the second example
    is from a Fedora server.  In both examples you can see the share myshare.  You
    will have to provide the Samba password that was created previously.


    ![00142.jpeg](Images/image00218.jpeg)


    ![00143.jpeg](Images/image00219.jpeg)


    You can also use the smbclient command to connect to the share.  In the example
    below there are four \ before the IP address and two after.  This is because when
    using the smbclient command you must escape the \ character to give it meaning
    so if you need two \ characters you have to escape each one which gives you four. 
    You will have to provide the Samba password that was created previously.  Once
    connected you will get the smb: \> prompt which means you are connected to the
    server.  In the example below the ? command is used to access the help menu.


    ![00144.jpeg](Images/image00220.jpeg)


    When connected to the Samba server you can use commands to get and put files on
    the server just like you can with FTP and SFTP.


    The example below shows what happens when not enough \ characters are used.


    ![00145.jpeg](Images/image00221.jpeg)


    You can also mount Samba shares using the Common Internet File System (CIFS). 
    Most Linux system do not have CIFS installed by default so you will have to install
    the software.


    Ubuntu and Debian


    sudo apt-get install cifs-utils


    Fedora


    sudo dnf install cifs-utils --best


    Once CIFS is installed you can use the mount command to mount the Samba share
    as in the example below.


    ![00146.jpeg](Images/image00222.jpeg)


    You can also use the mount command to view information about the mounted share
    as in the example below.  You will want to use the grep command to isolate the
    specific share as there may be many shares on the server.


    ![00147.jpeg](Images/image00223.jpeg)


    To unmount a Samba share use the umount command.


    sudo umount ~/myfolder


    Fstab


    Using the /etc/fstab file you can configure Samba shares to be mounted to the
    filesystem during the boot process.  There are some security concerns with this
    configurations, however, as the Samba username and password are place into a configuration
    file.  


    ##### User File 


    Since the Samba share controls access to the share based on a username and Samba
    password you have to make the username and password available to the boot process
    by storing them in a file.  


    Create /etc/samba/user file.


    Add the following lines replacing sabmba_username with the actual username and
    the samba_password with the actual password.


    username=sabmba_username


    password=samba_password


    Edit /etc/fstab and add the following line.


    //ip_address/sharename /local_mount_point cifs credentials=/etc/samba/user,noexec
    0 0


    The example below mounts the myshare share from 192.168.56.1 to /home/matt/myfolder
    and users the username and password from the /etc/samba/user file.


    //192.168.56.1/myshare /home/matt/myfolder cifs credentials=/etc/samba/user,noexec
    0 0


    Reboot the system to mount the Samba share.


    Windows


    To access a Samba share from a Windows system, open a File Explorer window and
    type \\ followed by the IP address of the Linux server running Samba in the address
    bar..


    \\IP_address\


    You can also connect directly to the share by including the share name.


    \\IP_address\share_name


    You will be required to provide the Samba username and password.


    # Chapter 11. I/O Direction


    Almost all of the Linux commands that you will encounter have a common feature
    – they are all received from your system’s standard input (your keyboard, for
    example), and then written to the standard output (your computer monitor). The
    standard error device receives any error messages that you may get. In Linux,
    these devices are called the following:


    *   stdin – standard input


    *   stdout – standard output


    *   stderror – standard error


    These are also called streams, which define how inputs and outputs are distributed
    in a Linux environment.


    Commands get the necessary input that they need from files, and in turn, they
    sent their outputs to another line. This entire process has a rather highfalutin
    name, called the I/O (input/output) redirection.


    ## Redirecting Streams


    If you want Linux to redirect the commands for these streams, you will need to
    enter a command that will do so. What happens is that Linux will write the output
    to a particular file. If the indicated file does not exist, your operating system
    will create a file with the name that you included in your command.


    Note: If you use a command with a single bracket, the command will overwrite the
    contents of the existing destination.


    Here is a table of the most common I/O redirection commands:


