    \ has then been displayed alongside some other text. \n\nVariables in Shell\n\n\
    The two types of shell variables are:\n\n1.  System variables- these are created\
    \ and maintained by the OS. They are defined in upper case letters.\n\n2.  User\
    \ Defined Variables- the user creates and maintains these. They are defined in\
    \ lower case letters.\n\nThe following are some of the system variables in shell:\n\
    \nBASH- the shell name.\n\nHOME- our home directory\n\nLOGNAME- our login name.\n\
    \nPATH- our setting for the path.\n\nUSERNAME- the currently logged in user.\n\
    \nCOLUMNS- number of columns making up our screen. \n\nOSTYPE- the type of the\
    \ OS we are running.\n\nPWD- the current working directory. \n\nThe above shows\
    \ only a sample of the system variables. If you want to print any of the above\
    \ variables, use the echo and the $ sign command as shown below:\n\necho $HOME\n\
    \necho $PWD\n\nThe next section explains how to work with user defined variables. \n\
    \nUse the following syntax to define a user defined variable:\n\nvariable name=value\n\
    \nThe ‘name’ refers to the name to be used to refer to the variable. The value\
    \ is what it is. This is usually a number or a string. Example:\n\nnum=10\n\n\
    name=Mary\n\nTips when naming variable\n\n1.  There shouldn’t be any spaces on\
    \ either side of the equal sign. Example:\n\nnum=12- this is right\n\nnum= 12-\
    \ this is wrong\n\nnum =12- this is wrong\n\nnum = 12- this is wrong\n\n2.  The\
    \ name of the variable should begin with an underscore or any of the alphanumeric\
    \ characters. This should then be followed by any of the alphanumeric characters.\
    \ The following are examples of valid variables:\n\nPWD\n\nSYSTEM_VERSION\n\n\
