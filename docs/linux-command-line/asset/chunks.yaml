    ## Mounting Drives


    The last big thing that you have to understand in order to navigate Linux is mounting
    drives. This is where you have an external hard drive, you plug it into the computer,
    and you need to mount the drive in order for you to browse its contents. That
    external hard drive could be a normal hard drive, a flash drive, or a CD-ROM drive.
    Flash drives and CD-ROM drives are considered as hard drives in Linux.


    Basically, any drive that you will connect to the computer is a drive that would
    have to be mounted. The first thing that you have to understand is how the mounting
    process works in Linux. The mounting process is as follows:


    Step 1 – Connect the hard drive.


    Step 2 – Create a folder for your mount point.


    Step 3 – Grab some specific information about the hard drive and then point the
    mount point folder to that hard drive.


    That is essentially how you mount the drive. The mount point folder now gets tied
    to the hard drive. Since they are tied together, you can now browse the contents
    of the hard drive through the mount point folder.


    So how do you actually make the mount point folder in the command prompt? Simple:
    just type the command below:


    $ sudo mkdir /mnt/<name of mount point folder>


    Take note of the /mnt directory that we are creating here. Know that /mnt is the
    standard mounting directory in Linux. This mounting directory is universal. You
    can use a different mounting directory if you want. However, using /mnt is considered
    as a best practice since most Linux administrators and programmers will use it
    by default. 


    Now, let’s say you want to mount a connected hard drive to a mount point named
    drive1\. To do this, you just type:


    $ sudo mkdir /mnt/drive1


    By typing the command above, you are creating the folder that your hard drive
    will be mounted to. Once you do this, the next thing that you have to do is find
    out the information about the hard drive that you are trying to mount. To do this
    you just run the command below:


    $ sudo fdisk -l


    The above command will list all of the physical hard drives that are connected
    to your system. This list is going to show you the different hard drives that
    are connected to your system, how much space they have, etc. In there, you are
    looking for something that is going to look like /dev/sda1\. These are called
    disk names in Linux.


    Linux disk names are always arranged in an alphabetical order. If you have two
    hard drives connected to your Linux system, for example, they will be named /dev/sda
    and /dev/sdb, respectively. The numbers that succeed the disk names refer to the
    partitions within that particular disk.


    If you have two partitions in your first hard drive for example, they will show
    up as /dev/sda1 and /dev/sda2 respectively. If you have three partitions in your
    second hard drive, they will show up as /dev/sdb1, /dev/sdb2, and /dev/sdb3 respectively.


    So, in order to mount the hard drive, all we are going to do once we find the
    disk name is type the following:


    $ sudo mount <disk name> <mount point>


    If we were to apply this command syntax to our example, the command should look
    like this:


    $ sudo mount /dev/sda /mnt/drive1


    This is all you to do mount your hard drive. Now, you can go and change directory
    to /mnt/drive1 by typing:


    $ sudo cd /mnt/drive1


    And once you are in your mount point directory, you can type:


    $ ls -l


    The above command will list all the contents of that hard drive. You can now apply
    all the Linux navigation commands that you have learned so far in your mounted
    drive. That is basically how you mount a hard drive in Linux.


    Now, if you are done with that hard drive and you want to un-mount it, all you
    need to do is type:


    $ sudo umount <disk name> <mount point>


    As you may have already guessed, umount stands for un-mount. Once you have successfully
    un-mounted a hard drive, you can repeat the same process of mounting a drive if
    you want to use a new hard drive.


    # Chapter 15. The Processes


    You should also understand processes if you want to be a Linux user. In this chapter,
    you’ll learn about the different computer processes performed in Linux operating
    systems.


    The Basics


    Multi-users and Multi-tasking


    Now that you know how to interact with the system, you may study computer processes
    in more detail. Some commands cannot be executed using a single process. There
    are commands (e.g. “mozilla”) that trigger a group or series of processes.


    Additionally, Linux is based on the Unix system, where it is natural to have different
    users running different commands simultaneously. Obviously, you need to make sure
    that the computer’s processor can handle all the active processes. You should
    also provide a functionality that allows users to switch between different processes.
    In certain cases, you have to continue running a process even if the user who
    initiated it already logged out. You should also give users the capability to
    resume interrupted processes.


    ## Different Types of Processes


    Interactive Processes


    You have to use a terminal session to start and control interactive processes.
    That means you can only start an interactive process if you are already connected
    to the system. Basically, the system doesn’t start these processes automatically
    as part of its basic functions. An interactive process runs in the foreground,
    taking over the terminal that started it. When this happens, you can’t initiate
    other programs as long as that particular process is active. As an alternative,
    you may run them in the background, so that the terminal you used can receive
    other commands.


    Linux shells provide a feature called “job control.” This feature allows you to
    handle various processes easily. Job control can switch processes between the
    background and the foreground. With this, you may quickly start processes in the
    background.


    Important Note: You can only run processes in the background for programs that
    don’t require user inputs. In general, tasks are placed in the background if they
    take a long time to complete.


