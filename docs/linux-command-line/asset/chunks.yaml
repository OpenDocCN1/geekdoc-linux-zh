    \ on 2345\n# chkconfig -l apache2\napache2 0:off 1:off 2:on 3:on 4:on 5:on 6:off\n\
    ```\n\n#### Managing services with the `chkconfig` command\n\n**Common usage examples:**\n\
    \n- `chkconfig -l`: List runlevel configuration for all services\n- `chkconfig\
    \ -l [SERVICE]`: List a service's current configuration\n- `chkconfig -s [SERVICE]\
    \ on [LEVEL]`: Enable a service on the specified level(s)\n- `chkconfig -s [SERVICE]\
    \ off [LEVEL]`: Disable a service on the specified level(s)\n\n### `rc-status`\n\
    \n**Purpose:** Display the status of services on Gentoo Linux systems.\n\n**Usage\
    \ syntax:** `rc-status [OPTIONS]`\n\n```\n# rc-status\nRunlevel: default\namavisd\
    \ [ started ]\napache2 [ started ]\nclamd [ started ]\ncourier-authlib [ started\
    \ ]\ncourier-imapd [ started ]\ncourier-imapd-ssl [ started ]\ncourier-pop3d [\
    \ started ]\nhostname [ started ]\nkeymaps [ started ]\n...\n```\n\n#### Output\
