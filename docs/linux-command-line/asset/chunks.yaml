    a (theoretically) unique address assigned to a computer. It''s a bit like a street
    address - it lets other computers send traffic to and receive traffic from your
    system. An IP address consists of four groups of numbers separated by dots:


    192.168.1.1


    These numbers are actually the numerical form of a binary number. None of these
    numbers can be higher than 255\. (While watching a detective TV show, it’s occasionally
    hilarious to see the police track a criminal using a ludicrously implausible IP
    address, like 689.34.385.339.)


    The dominant version of the IP protocol is Version 4, commonly referred to as
    IPv4\. Under IPv4, there are only 4.6 billion IP addresses available, and the
    available IP addresses ran out in late 2011\. (IPv6, which has many more available
    addresses, will eventually replace IPv4, but for now, IPv4 remains dominant.)
    There are obviously far more computers, phones, routers, switches, and other networked
    devices in the world than 4.6 billion, so how do all these devices receive IP
    addresses?


    The answer is a private IP address. Certain blocks of IP addresses have been reserved
    for use in private networks. These blocks, using a technology called Network Address
    Translation (NAT), are then translated to public IP addresses. This has extended
    the lifetime of the available IPv4 address space for decades. The ranges of the
    reserved private addresses are:


    10.0.0.0 - 10.255.255.255


    172.16.0.0 - 172.31.255.255


    192.168.0.0 - 192.168.255.255


    Odds are, your computer has an IP address in one of those ranges as part of a
    private network (even if it''s just a private network generated by your wireless
    router).


    SUBNET MASKS


    IP address also have a subnet mask. A subnet mask defines which parts of the IP
    address designate the network, and which part designates the individual computer.
    Let''s say the IP address of 192.168.1.1 from above has a subnet mask like this:


    255.255.255.0


    That means the 192.168.1 part of the address indicates the network, while the
    final 1 indicates the computer.


    IP addresses usually include a broadcast address. Any traffic sent to the broadcast
    address is directed to every single computer in the local network. A broadcast
    address has a 255 as its final number, so a computer with a 192.168.1.1 address
    will have a broadcast address of 192.168.1.255.


    DEFAULT GATEWAY


    Lastly, IP addresses usually (but not always) come with a default gateway. The
    default gateway is the address your computer sends traffic destined for anywhere
    outside the local network segment. Like, say you want to visit Google with your
    web browser. Your computer recognizes that Google isn''t on the 192.168.1.* network,
    and so forwards the request to the default gateway, which then sends the traffic
    on to Google. (This is a simplification, but adequate for our purposes.)


    DNS


    The final important piece of basic networking is the Domain Name System, or DNS.


    As we mentioned above, every website on the Internet has, in theory, its own unique
    web address. Remembering all of those IP addresses can prove impractical. A few
    people might have keen enough memories to remember that microsoft.com has an IP
    address of 206.46.232.182 (at least at the time of this writing), but most of
    us cannot.


    DNS provides an easier way to find websites. DNS maps each address to a domain
    name. When you type in a web address, such as microsoft.com or distrowatch.org,
    your request goes to a DNS server. The DNS server checks its database of domain
    name mappings (called zone data) and responds with the IP address assigned to
    that domain name. Your computer is then able to contact the website and begin
    downloading data.


    DNS is integral to the smooth functioning of most computer networks. If your computer
    is suffering connection problems, DNS is one of the first things to check (other
    than making sure the network cable is plugged in, of course).


    # Chapter 9. Bash One-liners


    Working with files


    1.  To truncate the size of a file to 0 (emptying) - Use the redirection command
    in this case. If the file exists, then its size is truncated to zero whereas if
    it does not exist, it is created. Note the operator opens the file for writing.


    $ > file


    To create a file containing content of your choice or to replace the file’s contents,
    use the following command:


    $ echo “string to replace” > file


    The string that you specify in between the quotes will act as the replacement    
    string. 


    2.  To add a string to your file - the on-liner uses the output redirection operator
    >> to append some content to your file. Example:


    $ echo “content to be appended” >> file


    If the operator fails to find the file, a new one is created.  After the string
    has been appended to the file, a new line will follow it. 


    To avoid this, use the –n option as shown below:


    $ echo -n “content to be appended” >> file


    3.  To assign the first line of a file to a variable- in this case, you need to
    read the first line of the file and then assign this line to a variable. The input
    redirection operator < is used. 


    Consider the line of code shown below:


    $ read -r myline < file'
