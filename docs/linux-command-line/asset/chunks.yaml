    ```\n\n### 8. To randomize the lines of a file\n```bash\nshuf filename.txt\n```\n\
    \n### 9. To sum a particular column\n```bash\nawk '{ sum+=$1} END {print sum}'\
    \ document.txt\n```\n\n# Chapter 10. Sharing files commands\n\nWhen working in\
    \ a network environment it is important to be able to share files between users\
    \ and systems. Linux has multiple ways to share file between Linux, Windows, and\
    \ Mac systems.\n\n- [FTP](#part0000.xhtml__wzdov2u0wm8)\n- [SFTP](#part0000.xhtml__e9821a49wqxy)\n\
    - [HTTP/HTTPS](#part0000.xhtml__pa57plpui70u)\n- [NFS](#part0000.xhtml__7oy0d1nulda0)\n\
    \n## Samba\n\n## FTP\n\nThe FTP protocol is a quick and easy way to share files\
    \ on the Internet or a network but is also very insecure. The FTP protocol passes\
    \ the username and password in clear text which can be captured by anyone able\
    \ to capture traffic between the client and the FTP server. Due to security concerns,\
    \ you should only use FTP to share files that do not need to be secured.\n\nOn\
    \ most Linux system you will need to install an FTP server if you want to makes\
    \ files available via FTP. If you have to use FTP, make sure that the server you\
    \ install the FTP server software on does not perform any critical function on\
    \ the network. You should also not put an FTP server on your internal network\
    \ that allows connections from outside the network or the Internet. If you need\
    \ to share files with the Internet, your FTP server should be in the Demilitarized\
    \ Zone (DMZ) on the firewall.\n\n### FTP Server install Ubuntu and Debian\nTo\
    \ install an FTP server on Ubuntu and Debian you can use the `apt-get install`\
    \ command.\n\n```bash\nsudo apt-get install vsftpd\n```\n\nUbuntu and Debian configure\
    \ and enable the `vstfpd` service and start the service automatically during the\
    \ install process.\n\n### FTP Server install Fedora\nTo install an FTP server\
    \ on Fedora you can use the `dnf install` command. The `--best` option tells Fedora\
    \ to install the version of the software that best matches your system when there\
    \ are multiple versions available.\n\n```bash\nsudo dnf install vsftpd --best\n\
    ```\n\nFedora installs the `vsftpd` server but does not start the service automatically.\
    \ To start and enable the `vsftpd` server to start during boot use the `systemctl`\
    \ command.\n\n```bash\nsudo systemctl start vsftpd\nsudo systemctl enable vsftpd\n\
    ```\n\n### Firewalls \n\nIf your Linux system has a host based firewall installed\
    \ and running then you will have to open up the port for FTP, TCP port 21, inbound\
    \ in order to allow incoming connections. There are security risks with running\
    \ an insecure protocol such as FTP on a Linux system so make sure that you have\
    \ the system properly configured and placed in the network before opening up a\
    \ port on the firewall.\n\nThe following subsections will be covered in this section:\n\
    \n- [Ubuntu and Debian](#part0000.xhtml__k8i2ho83u4t4)\n- [Fedora](#part0000.xhtml__tl76v3lzju8h)\n\
    \n#### Ubuntu and Debian\nUbuntu and Debian use the Uncomplicated Firewall (`UFW`)\
    \ to control basic firewall configurations, however the firewall is not configured\
    \ by default. To open TCP port 21 using the following command:\n\n```bash\nsudo\
    \ ufw allow in ftp\n```\n\n#### Fedora \nFedora uses `firewalld` to control basic\
    \ firewall configurations and the firewall is configured by default. To open TCP\
    \ port 21 using the following commands:\n\n```bash\nfirewall-cmd --permanent --add-port=21/tcp\n\
    firewall-cmd --reload\n```\n\n### FTP Client\nIn order to connect to an FTP server,\
    \ you need an FTP client. Ubuntu and Debian come with it already. Fedora does\
    \ not so you must install it with the `dnf install` command.\n\n```bash\nsudo\
    \ dnf install ftp\n```\n\nThe following subsections will be covered in this section:\n\
    - [Connecting to a server](#part0000.xhtml__k8i2ho83u4t4)\n- [Passive Mode](#part0000.xhtml__tl76v3lzju8h)\n\
    - [Help](#part0000.xhtml__k8i2ho83u4t4)\n- [List Remote Files](#part0000.xhtml__tl76v3lzju8h)\n\
    - [List Local Files](#part0000.xhtml__k8i2ho83u4t4)\n- [Current Remote Directory](#part0000.xhtml__tl76v3lzju8h)\n\
    - [Current Local Directory](#part0000.xhtml__k8i2ho83u4t4)\n- [Change Remote Directory](#part0000.xhtml__tl76v3lzju8h)\n\
    - [Change Local Directory](#part0000.xhtml__k8i2ho83u4t4)\n\n#### Connecting to\
    \ a server\nTo connect to an FTP server use the `ftp` command followed by either\
    \ the IP address or hostname. In the example below:\n\n```bash\nftp 192.168.1.10\n\
    ```\n\nYou will be asked for the username and password to access the server. By\
    \ default, `ftp` will use the username of the current user unless you specify\
    \ a specific user.\n\nYou can also open a connection to a server from inside the\
    \ `ftp` program by using the `open` command with the IP address or hostname as\
    \ in the example below:\n\n```bash\nopen 10.0.0.1\n```\n\nIf you leave an `ftp`\
    \ connection open for too long you will get disconnected from the server and may\
    \ need to reconnect.\n\n#### Passive Mode\nThe FTP protocol can run in two modes,\
    \ active or passive. Active mode uses two TCP ports, 20 and 21, and passive mode\
    \ uses just TCP port 21. Most servers today run in passive mode but most FTP clients\
    \ assume active mode by default. To make sure you are using the proper mode you\
    \ must set the FTP client to passive mode using the `passive` command as in the\
    \ example below:\n\n```bash\npassive\n```\n\n#### Help\nThe FTP client comes with\
    \ a help menu that can be accessed by typing either `?` or `help` to access the\
    \ help menu. You can get help on a specific command by using the `help` command\
    \ followed by the name of the command as in the example below:\n\n```bash\nhelp\
    \ get\n```\n\n#### List Remote Files\nYou can get a list of files and directories\
    \ on the remote system by using either the `dir` or `ls` commands as in the example\
    \ below:\n\n```bash\nls\n```\n\n#### List Local Files\nYou can get a list of files\
    \ and directories on the local system by putting the `!` character in front of\
    \ the `dir` or `ls` commands as in the example below:\n\n```bash\n!ls\n```\n\n\
    #### Current Remote Directory\nYou can find out what the current remote directory\
    \ is by using the `pwd` command as in the example below:\n\n```bash\npwd\n```\n\
    \n#### Current Local Directory\nYou can find out what the current local directory\
    \ is by using the `!pwd` command as in the example below:\n\n```bash\n!pwd\n```\n\
    \n#### Change Remote Directory\nYou can change the remote directory by using the\
    \ `cd` command. In the example below, the `pwd` command is used to check the remote\
    \ directory, the `ls` command is used to view the remote directory, and the `cd`\
    \ command is used to change to the Documents directory.\n\n```bash\ncd Documents\n\
    ```\n\n#### Change Local Directory\nTo change the local directory use the `!cd`\
    \ command.\n\n```bash\n!cd Downloads\n```\n"
