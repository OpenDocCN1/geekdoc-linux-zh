    \ the following command (see to it that you are logged in as root):\n\n### PAMs\n\
    \nLinux also uses another feature when it comes to improving password security\
    \ by using an MD5 algorithm. What it does is that it reduces a message to a 128-bit\
    \ digest, which is called fingerprint, of a document so that you will be able\
