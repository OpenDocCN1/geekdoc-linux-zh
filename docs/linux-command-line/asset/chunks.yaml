    本章将向你展示如何从命令行执行网络任务。你将学习如何查找计算机的 IP 地址和 MAC 地址，如何测试连接性，以及如何查找计算机的 DNS 服务器是否正常运行。


    ## 查找你的 IP 地址


    在大多数 Linux 发行版中，从命令行查找 IP 地址实际上比通过图形界面（GUI）简单得多。只需在提示符处输入此命令：


    ```

    ifconfig

    ```


    `ifconfig` 命令将生成如下输出：


    ![](img/image00188.jpeg)


    这里信息很多，但大部分都是很有用的。`eth0` 指系统上的第一个以太网连接。`indet addr` 显示系统的 IP 地址，而 `Mask` 显示子网掩码。`HWaddr`
    显示你的以太网适配器的 MAC（媒体访问控制）地址，该地址（理论上）对于每个适配器都是唯一的。（某些无线网络要求你在允许系统连接之前提供 MAC 地址。）


    你可以将 `ifconfig` 命令的输出通过管道（pipe）传给 `grep` 来快速找到你需要的特定项目。假设你只想找到 IP 地址：


    ```

    ifconfig | grep inet

    ```


    这次的输出将如下所示，你可以从结果中快速选出你的 IP 地址：


    ![](img/image00188.jpeg)


    同样，你可以用 `ifconfig` 和 `grep` 快速找到计算机的 MAC 地址。（MAC 地址代表媒体访问控制，是一种硬接地址，理论上对每个网络适配器都是唯一的。）


    ```

    ifconfig | grep HWaddr

    ```


    你可以轻松地从输出中提取出 MAC 地址：


    ![](img/image00188.jpeg)


    ## 查找默认网关


    `ifconfig` 命令生成了很多有用输出，但它不包含默认网关的地址。要获取它，你可以使用带有 `route` 选项 `ip` 命令：


    ```

    ip route

    ```


    命令将生成如下输出：


    ![](img/image00188.jpeg)


    寻找以 `default via` 开头的行。你的系统默认网关就是这两个词之后的 IP 地址。在示例截图中，默认网关将是 `192.168.2.1`。


    ## 获取 IP 地址


    大多数时候，你的 Linux 系统将从 DHCP 服务器接收 IP 地址。


    `DHCP` 代表 `动态主机配置协议`（Dynamic Host Configuration Protocol），是一种服务器，当客户端连接到 DHCP
    服务器的网络时，它会为客户端分配 IP 地址。手动为每台计算机配置 IP 地址既耗时又容易出错；如果一台或多个计算机接收到相同的 IP 地址，将由于地址冲突而无法连接。DHCP
    消除了这个过程中的猜测。当计算机插入以太网网络（或连接到无线网络）时，它会向 DHCP 服务器发送请求。如果网络上有 DHCP 服务器，它会为计算机提供 IP
    地址，并且 DHCP 服务器会确保没有两台计算机接收到相同的 IP 地址。


    大多数时候，当你接入新网络时，会自动获得 DHCP 地址。但如果没有获得，请尝试此命令：


    ```

    dhclient

    ```


    注意，你需要以 root 身份运行 `dhclient`，无论是以 root 登录还是通过 `sudo` 借用 root 权限。


    这将手动告诉你的系统搜索 DHCP 服务器并接受地址。如果此命令不起作用，说明你使用的网络没有运行正常的 DHCP 服务器，或者有某些阻止了 DHCP 服务器与你的计算机通信。


    ## 释放 IP 地址


    DHCP 地址带有一个`租期`（`lease`），这意味着你的计算机允许保留该地址的时间。通常，你的计算机会在租期到期前的一半处联系 DHCP 服务器，并请求保留它，DHCP
    服务器几乎总是授予该请求。


    有时你想尽早释放已租的 IP 地址——例如如果你的网络 DHCP 服务器更改了，或者你的计算机拒绝释放 IP 地址。你可以使用 `dhclient` 命令和
    `-r` 选项来实现这一点：


    ```

    dhclient -r

    ```


    这将释放你的 IP 地址，然后你可以使用 `dhclient` 联系 DHCP 服务器以接收新地址。


    ## 测试你的 DNS 服务器


    如我们上面提到的，如果你的 DNS 服务器停止响应，你可能会遇到各种网络问题。当它正常工作时，你会忘记它的存在。但一旦它故障，一切都会停滞。没有它，你无法在浏览器的地址栏中输入地址，无法使用任何依赖
    DNS 的网络资源。


    要诊断你的 DNS 服务器，你可以使用名为 `nslookup` 的命令。`nslookup` 命令提供当前 DNS 服务器的 IP 地址，并对该服务器运行测试查找以检查其是否运行正常。例如，如果你想确定
    DNS 服务器是否可以运行，可以使用此命令：


    ```

    nslookup distrowatch.org

    ```


    输出将如下所示：


    ![](img/image00188.jpeg)


    前两行列出了计算机使用的 DNS 服务器。在这种情况下，我们正在使用 IP 地址为 `192.168.2.1` 的 DNS 服务器。第二组行显示了我们执行的查找结果——`distrowatch.org`
    的 IP 地址。在这里，你可以看到 `distrowatch.org` 的 IP 地址是 `66.180.174.35`。由于 `nslookup` 成功返回了
    `distrowatch.org` 的 IP 地址，你知道你的 DNS 服务器运行正常。


    ## 测试连接性


    如果你曾经修理过电脑（甚至用过电脑），你就知道网络和互联网连接问题是一个令人沮丧的常见现象。幸运的是，命令行工具对于获取任何网络问题的价值信息非常有帮助。


    第一个也是最常用的网络诊断命令是 `ping` 命令。`ping` 命令代表数据包互联网探测器（Packet Internet Groper），它依赖于 ICMP
    协议（互联网控制消息协议）。基本上，`PING` 命令向网络目标（如服务器或其他 PC）发送一个数据包，如果目标处于激活状态，它将返回一个确认包。例如，如果你想
    ping IP 地址为 `192.168.1.2` 的 PC，将使用此命令：


    ```

    ping 10.10.11.254

    ```


    如果 `10.10.11.254` 是在线的，`ping` 命令将生成如下输出：


    ![](img/image00188.jpeg)


    `ping` 命令将继续 ping 目标，直到你按下 `CTRL-C` 取消命令。


    该命令还有几个你可以使用的选项来更改其性能。`-c` 选项告诉 `ping` 发送固定数量的数据包然后停止。例如，如果你只想 ping `192.168.1.2`
    六次，你将使用此命令：


    ```

    ping -c 6 192.168.1.2

    ```


    注意，即使远程目标具有活跃的网络连接，`ping` 命令也不总是起作用的。这是因为某些操作系统默认会拦截 ICMP 流量。但是，有足够的设备允许 ICMP
    流量，使得 PING 成为一个实用的诊断工具。


    ## 追踪路径


    有时你的网络连接是激活的，但你无法访问特定目标。在这种情况下，`traceroute` 命令变得很有用。`traceroute` 命令映射从你的计算机到目的地的网络路由，并向路径中的每个设备发送一个
    ICMP 数据包。然后你可以查看路径中哪些设备没有响应，并希望确定解决方案。例如，要追踪到 `10.10.11.254` 的路径，你可以这样使用 `traceroute`：


    ```

    traceroute 10.10.11.254

    ```


    输出将如下所示，每一行代表通往目的地的一个跳（`hop`，链中的另一个设备）：


    ![](img/image00188.jpeg)


    `traceroute` 命令默认运行三十跳。


