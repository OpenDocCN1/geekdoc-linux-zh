    \ be useful for common users to know some things about it. This knowledge becomes\
    \ important if the users’ own tasks and efficiency are concerned.\n\nThis section\
    \ will explain system performance using theories. Here, you’ll learn about:\n\n\
    - The problems encountered by common users\n- The methods common users can use\
    \ to optimize available resources\n\n## How Much Time Does a Process Require?\n\
    \nBash provides a pre-installed `time` command that shows the amount of time required\
    \ to execute processes. This tool offers accuracy and versatility – you can use\
    \ it to get precise data about any command. To help you understand the `time`\
    \ command, a screenshot is given below:\n\nIn this example, the `time` command\
    \ is used to calculate the amount of time needed to create a certain `.pdf` file.\
    \ The result shows that the process requires 1 minute and 41 seconds.\n\nThe file\
    \ directory `/usr/bin` contains a `time` command for GNU (this is different from\
    \ the pre-installed `BASH` tool). This command shows more data that can be used\
    \ in various ways. Additionally, it displays the command’s exit status and total\
    \ elapsed time. When used with the GNU `time` command, the example given above\
    \ provides these results:\n\nYou may check the system’s `Info` pages if you want\
    \ to learn more about these time commands.\n\n## Performance\n\nFor common users,\
    \ “excellent performance” refers to quick and correct execution of processes.\
    \ For system managers, however, these words have more meaning: the admin needs\
    \ to maximize the performance of the entire system, including daemons, programs,\
    \ and users. In general, system performance may depend on numerable “insignificant”\
    \ things that are not evaluated by the `time` command. Here are some examples\
    \ of these “insignificant” things:\n\n- Access to drives, display, controllers,\
    \ interfaces, etc.\n- The program being run was poorly designed or doesn’t utilize\
    \ the computer’s resources efficiently.\n- The number of active users in the system.\n\
    - The time of day.\n- The accessibility of remote networks.\n\n## Load\n\nBasically,\
    \ load relies on what is ordinary for your network. For instance, an old P133\
    \ that runs a firewall, file server, SSH server, route daemon, proxy server, sendmail\
    \ server, and other devices can support up to 7 active users. In this kind of\
    \ situation, the load is still zero. Some systems, particularly those that have\
    \ several processors, can easily support up to 67 users.\n\nThere is just one\
    \ way to identify your network’s load: check it on a regular basis. This way,\
    \ you’ll know what’s ordinary for your network. If you won’t use this method,\
    \ you can only gauge system load from the command line’s response time. The response\
    \ time lacks accuracy – it cannot be reliable since various factors are affecting\
    \ it.\n\nRemember that different networks behave differently even if they have\
    \ identical load averages. For instance, a network can render 3D images smoothly\
    \ if it has a graphics card that supports hardware acceleration. A network that\
    \ uses an old VGA card, however, will be as slow as a turtle when rendering images.\
    \ An old system can be extremely slow when starting an X server, while modern\
    \ ones won’t even “feel” the added load.\n\n## Priority\n\nThe importance (or\
    \ priority) of a task is determined by its nice number. Tasks with a high nice\
    \ number are “cooperative” (or nice) to other users, other tasks, and the network\
    \ itself: they are low-priority tasks. Low nice numbers indicate that the tasks\
    \ they belong to are important and will take more system resources.\n\nYou can\
    \ make a task “nicer” by giving it a higher nice number. However, this technique\
    \ is only effective for processes that require lots of CPU time (e.g. software\
    \ compilers). Processes that utilize lots of I/O time consistently are provided\
    \ with a low nice number (i.e. higher priority). For instance, keyboard inputs\
    \ always receive the highest priority in a computer network.\n\nYou can set a\
    \ program’s importance using the `nice` command.\n\nMany systems offer a command\
    \ called `BSD renice`. This command allows users to edit the “niceness” of an\
    \ active program. You may check the manual of your OS to find out if this command\
    \ is available.\n\n## CPU Resources\n\nOn each operating system, many processes\
    \ need to use the computer’s CPU at the same time. This is true even if you’re\
    \ the only active user. Each process requires a specific amount of CPU resource\
    \ in order to run properly. Sometimes, computer programs don’t get sufficient\
    \ resources since the CPU handles many requests. You need to know the available\
    \ system resources if you want to optimize your computer. There are tools that\
    \ you can use to obtain this data.\n\n`Uptime`, one of the commands you can use\
    \ in Linux, lacks accuracy (it can only show averages, you need to identify the\
    \ normal number), but can be useful in some situations. Here are some of the things\
    \ you can do to improve the efficiency of your CPU.\n\n- Stop your system from\
    \ performing unnecessary tasks. Stop programs and daemons that you aren’t using.\
    \ You may use the `locate` command for this.\n- Run resource-intensive processes\
    \ when the system’s load is at a low level. Often, you should run “heavy” processes\
    \ during nighttime.\n- Run low-priority tasks first.\n\nIf these methods don’t\
    \ solve your problem, you may need to get a better CPU. For Linux systems, this\
    \ is the system admin’s job.\n\n## Users\n\nIn Linux systems, computer users can\
    \ be segregated into different types, depending on how they use system resources.\
    \ Here are the three types of Linux users:\n\n- People who run lots of small processes.\
    \ A good example for this would be inexperienced Linux users.\n- People who run\
    \ several (but complex) processes. Examples for this type are people running emulators,\
    \ calculations, and simulations.\n- People who run few processes that require\
    \ CPU time.\n\n## Visual Tools\n\nIn graphical environments, you have a wide-range\
    \ of tools. Here’s a screenshot of a tool called System Monitor. This tool can\
    \ find tasks.\n\n## Listing and Displaying Information\n\nTo display the currently\
    \ running processes use the `ps` command. If no options are specified, `ps` displays\
    \ the processes associated with your current session.\n\n- To see all processes,\
    \ use `ps -e`.\n- To see processes including ones not owned by you, use `ps -A`.\n\
    - To see a specific user, use `ps -u`.\n- To see a specific PID, use `ps -p`.\n\
    - To see a full listing, use `ps -f`.\n- To see all processes, use `ps -ef`.\n\
    - To see the process tree, use `ps -H`.\n- To see the process tree, use `ps --forest`.\n\
    - To see the process tree, use `ps --tree`.\n\n```bash\nps\n  19511 pts/2    00:00:00\
    \ bash\n  19554 pts/2    00:00:00 ps\n\n\n```bash\nps -p 19511\n  19511 pts/2\
    \    00:00:00 bash\n```\n\n```bash\nps -f\nUID         PID  PPID C STIME TTY \
    \         TIME CMD\nbob         19511 19509 0 16:50 pts/2      00:00:00 -bash\n\
    bob         19556 19511 0 16:50 pts/2      00:00:00 ps -f\n```\n\n```bash\nps\
    \ -e | head\n  PID TTY             TIME\n    1 ?               00:00:02 init\n\
    \    2 ?               00:00:00 kthreadd\n    3 ?               00:00:19 ksoftirqd/0\n\
    \    5 ?               00:00:00 kworker/0:0H\n    7 ?               00:00:00 migration/0\n\
    \    8 ?               00:00:00 rcu_bh\n```\n"
  raw: 'Although it is the Admin’s job to manage the system’s processes, it may be
    useful for common users to know some things about it. This knowledge becomes important
    if the users’ own tasks and efficiency are concerned.


    This section will explain system performance using theories. Here, you’ll learn
    about:


    The problems encountered by common users


    The methods common users can use to optimize available resources


    How Much Time Does a Process Require?


    Bash provides a pre-installed time command that shows the amount of time required
    to execute processes. This tool offers accuracy and versatility – you can use
    it to get precise data about any command. To help you understand the time command,
    a screenshot is given below:


    In this example, the time command is used to calculate the amount of time needed
    to create a certain .pdf file. The result shows that the process requires 1 minute
    and 41 seconds.


    The file directory /usr/bin contains a time command for GNU (this is different
    from the pre-installed BASH tool). This command shows more data that can be used
    in various ways. Additionally, it displays the command’s exit status and total
    elapsed time. When used with the GNU time command, the example given above provides
    these results:


    You may check the system’s Info pages if you want to learn more about these time
    commands.


    Performance


    For common users, “excellent performance” refers to quick and correct execution
    of processes. For system managers, however, these words have more meaning: the
    admin needs to maximize the performance of the entire system, including daemons,
    programs, and users. In general, system performance may depend on numerable “insignificant”
    things that are not evaluated by the time command. Here are some examples of these
    “insignificant” things:


    *   Access to drives, display, controllers, interfaces, etc.


    *   The program being run was poorly designed or doesn’t utilize the computer’s
    resources efficiently.


    *   The number of active users in the system.


    *   The time of day.


    *   The accessibility of remote networks.


    Load


    Basically, load relies on what is ordinary for your network. For instance, an
    old P133 that runs a firewall, file server, SSH server, route daemon, proxy server,
    sendmail server, and other devices can support up to 7 active users. In this kind
    of situation, the load is still zero. Some systems, particularly those that have
    several processors, can easily support up to 67 users.


    There is just one way to identify your network’s load: check it on a regular basis.
    This way, you’ll know what’s ordinary for your network. If you won’t use this
    method, you can only gauge system load from the command line’s response time.
    The response time lacks accuracy – it cannot be reliable since various factors
    are affecting it.


    Remember that different networks behave differently even if they have identical
    load averages. For instance, a network can render 3D images smoothly if it has
    a graphics card that supports hardware acceleration. A network that uses an old
    VGA card, however, will be as slow as a turtle when rendering images. An old system
    can be extremely slow when starting an X server, while modern ones won’t even
    “feel” the added load.


    Priority


    The importance (or priority) of a task is determined by its nice number. Tasks
    with a high nice number are “cooperative” (or nice) to other users, other tasks,
    and the network itself: they are low-priority tasks. Low nice numbers indicate
    that the tasks they belong to are important and will take more system resources.


    You can make a task “nicer” by giving it a higher nice number. However, this technique
    is only effective for processes that require lots of CPU time (e.g. software compilers).
    Processes that utilize lots of I/O time consistently are provided with a low nice
    number (i.e. higher priority). For instance, keyboard inputs always receive the
    highest priority in a computer network.


    You can set a program’s importance using the nice command.


    Many systems offer a command called BSD renice. This command allows users to edit
    the “niceness” of an active program. You may check the manual of your OS to find
    out if this command is available.


    CPU Resources


    On each operating system, many processes need to use the computer’s CPU at the
    same time. This is true even if you’re the only active user. Each process requires
    a specific amount of CPU resource in order to run properly. Sometimes, computer
    programs don’t get sufficient resources since the CPU handles many requests. You
    need to know the available system resources if you want to optimize your computer.
    There are tools that you can use to obtain this data.


    Uptime, one of the commands you can use in Linux, lacks accuracy (it can only
    show averages, you need to identify the normal number), but can be useful in some
    situations. Here are some of the things you can do to improve the efficiency of
    your CPU.


    *   Stop your system from performing unnecessary tasks. Stop programs and daemons
    that you aren’t using. You may use the locate command for this.


    *   Run resource-intensive processes when the system’s load is at a low level.
    Often, you should run “heavy” processes during nighttime.


    *   Run low-priority tasks first.


    If these methods don’t solve your problem, you may need to get a better CPU. For
    Linux systems, this is the system admin’s job.


    Users


    In Linux systems, computer users can be segregated into different types, depending
    on how they use system resources. Here are the three types of Linux users:


    *   People who run lots of small processes. A good example for this would be inexperienced
    Linux users.


    *   People who run several (but complex) processes. Examples for this type are
    people running emulators, calculations, and simulations.


    *   People who run few processes that require lots of CPU time (e.g. game developers).


    As you can see, system requirements differ for each type of user. Also, it is
    extremely difficult to meet the needs of all the users in a network. If you belong
    to a multiuser network, it is beneficial (and entertaining) to identify the habits
    of your fellow users. This technique will help you to maximize the available system
    resources.


    Visual Tools


    For graphical environments, you have a wide-range of options in terms of monitoring
    tools. Here’s a screenshot of a tool called Gnome System Monitor. This tool can
    find and show information about active tasks. Also, it can monitor system resources.


    Most Linux systems have some useful icons (e.g. monitors for load, disk, memory,
    etc.) that you may install onto your taskbar.


    ## Listing Processes and Displaying Information


    To display the currently running processes use the ps command. If no options are
    specified, ps displays the processes associated with your current session. To
    see every process including ones that are not owned by you, use ps -e. To see
    processes running by a specific user, use ps -u username.


    ps - Display process status.


    Common ps options:


    -e - Everything, all processes.


    -f - Full format listing.


    -u username - Display processes running as username.


    -p pid - Display process information for pid. A PID is a process ID.


    Common ps commands:


    ps -e - Display all processes.


    ps -ef - Display all processes.


    ps -eH - Display a process tree.


    ps -e --forest - Display a process tree.


    ps -u username - Display processes running as username.


