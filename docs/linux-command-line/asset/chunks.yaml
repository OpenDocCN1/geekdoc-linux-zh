- fmt: "\nThe `sysv-rc-conf` command manages service/runlevel configuration on Linux\
    \ systems. In the above example, executing `sysv-rc-conf` starts a configuration\
    \ utility which enables the user to select which services start on the various\
    \ runlevels.\n\nServices can also be displayed and modified via the command line\
    \ using the `--list` and `--level` options as demonstrated in the next example.\n\
    \n```\n# sysv-rc-conf --level 2345 apache off\n\n# sysv-rc-conf --list apache2\n\
    ```\n\n```\napache2 2:off 3:off 4:off 5:off\n\n# sysv-rc-conf --level 2345 apache2\
    \ on\n\n# sysv-rc-conf --list apache2\n```\n\n```\napache2 2:on 3:on 4:on 5:on\n\
    ```\n\n### Using the `sysv-rc-conf` command to manage services on the command\
    \ line\n\n**Common usage examples:**\n\n- `sysv-rc-conf`: Display the runlevel\
    \ configuration utility\n- `sysv-rc-conf --list`: List runlevel configuration\
    \ for all services\n- `sysv-rc-conf --level [LEVEL] [SERVICE] on`: Enable a service\
    \ on the specified level(s)\n- `sysv-rc-conf --level [LEVEL] [SERVICE] off`: Disable\
    \ a service on the specified level(s)\n\n### `chkconfig`\n\n**Purpose:** Display\
    \ and edit runlevel configuration on Red Hat Linux-based systems.\n\n**Usage syntax:**\
    \ `chkconfig [OPTIONS] [SERVICE] [ON|OFF] [LEVEL]`\n\n```\n# chkconfig -l\nacpi-support\
    \ 0:off 1:off 2:on 3:on 4:on 5:on 6:off\nacpid 0:off 1:off 2:on 3:on 4:on 5:on\
    \ 6:off\nalsa-utils 0:off 1:off 2:off 3:off 4:off 5:off 6:off\nanacron 0:off 1:off\
    \ 2:on 3:on 4:on 5:on 6:off\napache2 0:off 1:off 2:off 3:off 4:off 5:off 6:off\n\
    apport 0:off 1:off 2:on 3:on 4:on 5:on 6:off\n...\n```\n\n#### Listing service\
    \ configuration with the `chkconfig` command\n\nThe `chkconfig` command manages\
    \ services on Red Hat Linux systems. The `-l` parameter lists the current runlevel\
    \ configuration, as shown in the above example. If no service is specified, all\
    \ services will be displayed. Specifying a service name will display the runlevel\
    \ configuration for the service, as shown in the next example.\n\n```\n# chkconfig\
    \ -l apache2\napache2 0:off 1:off 2:on 3:on 4:on 5:on 6:off\n```\n\n#### Listing\
    \ a specific service with the `chkconfig` command\n\nThe `-s` option is used to\
    \ enable or disable services at the specified run levels as demonstrated in the\
