    `UNIX` 的概念被授权给多家公司，这些公司开发并维护了各自的 `UNIX` 变体。包括 `Solaris/SUN OS`（SUN Microsystems，现由
    `Oracle` 所有）、`AIX`（IBM）、`Scenix`（西门子）、`SCO UNIX`、`Xenix`（微软），以及 `HP-UX`（惠普）、`NeXTSTEP`、`Mac
    OS`（苹果）和 `Android`（谷歌）。


    开源实现由伯利系统发行版（`BSD`）及其变体组成：`NetBSD`、`OpenBSD` 和 `FreeBSD`。今天，`Linux` 是开源开发者中最受欢迎的免费软件。上述系统也拥有强力的商业支持。


    ## UNIX 哲学


    `UNIX` 的设计考虑了许多严格的原则。这些原则涵盖了可移植性、多任务和多用户方向，并结合了分时共享方法。此外，它基于遵循 `TCP/IP` 方案的网络连接。


    原始开发使用 `C` 编程语言完成，这使得它独立于硬件平台。它随带了一系列开发工具和库，允许你轻松地扩展以满足特定需求。它简单，但具有强大的任务自动化能力，支持复杂但可维护的脚本。


    `UNIX` 类似于一个工具箱，由各种工具组成。每种工具都有特定的用途，并专为该任务而设计。其理念是每个任务使用一个工具。为了实现更复杂的目标，你可以将几个工具组合成一条链。下面的示例通过管道结合了
    `ls` 和 `wc` 命令，以便统计当前目录下 Python 文件的数量。


    ```bash

    $ ls *.py | wc -l

    ```


    我们将在指南的后部分更详细地解释这些命令及其用法。


    ## 1.2 Linux 简史


    与 `UNIX` 类似，`Linux` 操作系统具有不同的根源，并基于多位大师的作品。其中，这包括 `Richard M. Stallman`、`Andrew
    S. Tanenbaum` 和 `Linus Torvalds`。


    `Richard M. Stallman` 是 `MIT` 的一名黑客和开发者，也是自由软件基金会（`FSF`）的首任主席以及 `GNU` 项目之父。`GNU`
    是口号 `GNU is Not UNIX`（GNU 不是 UNIX）的缩写。该项目的目标是开发一个自由的 `UNIX` 操作系统。直到 20 世纪 90 年代初，一组工具可用，但缺少内核。整个软件于
    1983 年左右根据 `GNU 公共许可证`（`GPL`）发布。


    `Linux` 的下一步来自 `Andrew S. Tanenbaum`。当时他是阿姆斯特丹大学的教授。他为学生开发了 `Minix`，这是一个用于教学目的的操作系统，旨在演示和理解
    `UNIX` 原则。正如他指出的，`Minix` 并非用于实际操作。


    `Linus Torvalds` 是赫尔辛基大学的一名芬兰学生，他是 `Minix` 的用户并对其局限性非常不满。1990 年，他开始基于 `Minix`
    的思想、`UNIX` 原则和 `POSIX` 标准开发一个新的操作系统。他的动力是拥有一个自己能理解的、并最大限度利用硬件边界的系统。他还想玩得开心，没有任何商业意图。`Linux`
    背后的整个故事记录在他名为《只为有趣》（`Just for Fun`）的自传中。今天，`Linus Torvalds` 监督着 `Linux` 内核的开发。


    为了让 `Linux` 对外产生吸引力，它需要一个漂亮的标志。根据吉祥物竞赛，提交了大量的提案。`Larry Ewing` 提交了他的企鹅的想法（如图本书所示），他的提案获胜了。这只名为
    `Tux` 的企鹅带着调皮的微笑和丰满的身体，代表了一个快乐且满意的用户形象。


    ## 1.3 Linux 应用范围


    `Linux` 最初为基于 Intel 的系统设计，如今运行在各种平台上。其中包括 `ARM` 架构（命名为 `arm` 和 `arm64`）、摩托罗拉/飞思半的
    `68k` 架构（`m68k`）、`Intel x86`（`i386` 和 `amd64`）、`IBM s390`（`s390`）、`PowerPC`（`powerpc`）和
    `SPARC`（`sparc`）。


    从一开始，`Linux` 就专注于服务器系统。它被持续用于 Web 服务器、文件服务器、邮件和新闻服务器、互联网网关、无线路由器和防火墙。作为计算单元，它帮助渲染视频序列和整部电影，如《泰坦尼克号》、《史瑞》和《玩具总动员》。此外，`Linux`
    还应用于汽车产品、航天、军事、物流和工程环境。自 2006 年以来，`Linux` 服务器运行着世界上所有的交易所。它还运行着几乎所有的互联网搜索引擎。


    在过去的十年里，`Linux` 也征服了桌面。由于其高度的灵活性和稳定性，它可以作为文本处理、图形设计、桌面出版、电子表格计算、通信（电子邮件、聊天、音频和视频）以及手机和电视用户界面的可靠配置。


    ## 1.4 Linux 认证


    `Linux` 的广泛使用增加了对准确了解自己在做什么的工程师和用户的需求。在这种情况下，获得 `Linux` 认证将变得有利。这些认证可以分为通用程序（不针对特定发行版）和专注程序（针对特定
    Linux 发行版）。下面的列表提供了目前存在的主要认证概述。


    # 第 1 章：使用 Linux


    如果你正在阅读这本书，你要么已经拥有 `Linux` 并需要一些学习如何使用它的帮助，要么你正在考虑获取 `Linux`。对于那些对是否切换到这个操作系统“犹豫不决”的人来说，这一节应该帮助你做出决定。


    技术狂热者的一个问题是他们非常偏见——就像体育迷一样。如果你与一个热爱 `Linux` 且使用了多年的人交谈，他们可能会向你描绘一幅非常积极的画面。此外，他们可能会告诉你其他操作系统都是垃圾。然而，热爱
    `Mac OS` 或 `Windows` 的人可能会告诉你 `Linux` 是垃圾，你不必费气去尝试使用它。


    许多人似乎认为 `Linux` 过于复杂，只有真正狂热的技术爱好者才可能希望弄懂如何使用它。这完全不是事实，如果你担心 `Linux` 很难用，请抛弃这些念头。有些
    `Linux` 版本被许多人认为比其他可用软件都更用户友好。


    现在，请带着开放的心态，看看为什么你应该选择使用 `Linux` 的一些主要原因：


    - 它是免费的。这可能是许多人选择任何东西的最大原因之一。当然，你的电脑可能已经带了操作系统，这会使其成为一个次要因素。你考虑过未来的更新吗？在大多数情况下，升级到最新的操作系统将花费费用。另一方面，`Linux`
    是免费的，而且在未来的将来几乎肯定一直是免费的。


    - 对慢电脑非常友好。许多人选择在旧的、慢的电脑上安装 `Linux`。如果你仍在使用 10 年前的旧 PC，它可能无法良好地运行新的操作系统。许多人乐于运行旧电脑自带的操作系统。然而，随着时间的推移，这些系统将停止支持，导致它们非常不安全，几乎无法以任何有效方式使用。有些
    `Linux` 版本是专门设计用于在低端硬件上运行的，因此你可以让旧 PC 发挥更多价值。但请记住，并不是所有的 `Linux` 版本在较慢的硬件上运行得良好。


    - 更高的安全性。如果你在生活中经常上网，你可能对电脑病毒有切骨之心的体会。即使你在其他电脑上安装了杀病毒软件，你的系统仍有被损坏的可能性。`Linux`
    用户不需要担心电脑病毒。事实上，你甚至不需要在运行 `Linux` 的电脑上安装杀病毒软件。


