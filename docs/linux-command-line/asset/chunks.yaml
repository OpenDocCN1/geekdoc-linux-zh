- fmt: "\nUnix passwords are historically stored in a file named `/etc/passwd`, which\
    \ can be read by any user. For example, the file entry for `/etc/passwd` for a\
    \ computer’s root user may ![00099.jpeg](Images/image0022.jpeg)appear like this:\n\
    \nYou will notice that colons separate the fields in this file, with the second\
    \ field displaying the user’s password in an encrypted form. For the system to\
    \ verify whether an entered user password is valid, the program that uses the\
    \ password encrypts the entry and then compares the result with the encrypted\
    \ text that was stored in the `/etc/passwd` file. If the entries match, then the\
    \ user can use the program.\n\nHowever, any hacker can easily decrypt passwords\
    \ using a dictionary attack – a type of decrypting method by trying out possible\
    \ combinations in an encrypted password to find out what the plain text equivalent\
    \ is. If you have access to the `/etc/passwd` file, then you are only a few steps\
    \ away from being able to crack a password. If you are not an authorized user\
    \ of the computer that you are trying to hack, then you can make use of possible\
    \ vulnerabilities in the target’s web services, such as the FTP and mailing services,\
    \ in order to infiltrate and get the file that you want.\n\nIt is a good thing\
    \ that Linux has made several improvements when it comes to making the operating\
    \ more secure, which include the following:\n\n### Shadow Passwords\n\nLeaving\
    \ passwords in locations that are easily accessible is bad security, even though\
    \ these passwords are encrypted. For this reason, Linux no longer makes it a practice\
    \ to store passwords in `/etc/passwd` file, which everyone can access – passwords\
    \ are now stored in a shadow password file, which is named `/etc/shadow`, that\
    \ only the root user can access. \n\n![00100.jpeg](Images/image00225.jpeg)In Linux,\
    \ the `/etc/passwd` file looks like this: \n\nTake note that the second field\
    \ does not show an encrypted password; instead, it shows a single character `x`.\
