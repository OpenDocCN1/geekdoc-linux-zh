    This chapter will show you how to perform networking tasks from the command line.
    You''ll learn how to find your computer''s IP address and MAC address, how to
    test connectivity, and how to find if your computer''s DNS server is functioning
    properly.


    ## Finding Your IP Address


    It''s actually a lot easier to find your IP address from the command line than
    from the GUI in most Linux distributions. Simply type this command at the prompt:


    ```

    ifconfig

    ```


    The `ifconfig` command will generate an output that looks something like this:


    ![](Images/image00188.jpeg)


    There''s quite a bit of information here, but most of it is useful. The `eth0`
    refers to the first Ethernet connection on your system. The `indet addr` displays
    your system''s IP address, while `Mask` shows the subnet mask. `HWaddr` shows
    your Ethernet adapter''s MAC (Media Access Control) address, which is (theoretically)
    unique to each adapter. (Some wireless networks require you to supply your MAC
    address before allowing your system to connect.)


    You can pipe the output from the `ifconfig` command to `grep` to quickly find
    the specific item you want. Let''s say you just want to find the IP address:


    ```

    ifconfig | grep inet

    ```


    This time, the output will look like this, and you can quickly pick your IP address
    from the mix:


    ![](Images/image00188.jpeg)


    Likewise, you can quickly find your computer''s MAC address with `ifconfig` and
    `grep`. (A MAC address stands for Media Access Control, and is a hard-wired address
    that is theoretically unique to each network adapter.)


    ```

    ifconfig | grep HWaddr

    ```


    You can easily pick out your MAC address from the output:


    ![](Images/image00188.jpeg)


    ## Finding Your Default Gateway


    The `ifconfig` command generates lots of useful output, but it does not include
    the address of your default gateway. To do so, you can use the `ip` command with
    the `route` option:


    ```

    ip route

    ```


    The command will generate an output that looks something like this:


    ![](Images/image00188.jpeg)


    Look for the line that begins `default via`. Your system''s default gateway will
    be the IP address after those two words. In this example screenshot, the default
    gateway would be `192.168.2.1`.


    ## Obtaining an IP Address


    Most of the time, your Linux system will receive an IP address from a DHCP server.


    `DHCP` stands for `Dynamic Host Configuration Protocol`, and is a kind of server
    that assigns an IP address to a client computer when it connects to the DHCP server''s
    network. Configuring each individual computer with an IP address by hand is time-consuming
    and error prone; if one or more computers receive the same IP address, they won''t
    be able to connect due to the address conflict. DHCP takes the guesswork out of
    the process. When a computer plugs into an Ethernet network (or connects to a
    wireless network), it sends out a request for a DHCP server. If there''s a DHCP
    server on the network, it supplies the computer with an IP address, and the DHCP
    server ensures that no two computers receive the same IP address.


    Most of the time, when you plug into a new network, you''ll receive a DHCP address
    automatically. If you don''t, however, try this command:


    ```

    dhclient

    ```


    Note that you will need to run `dhclient` as root, whether logged in as root or
    borrowing root powers via `sudo`.


    This will manually tell your system to search for a DHCP server and accept an
    address. If this command doesn''t work, that means either the network you''re
    using doesn''t have a functioning DHCP server, or that something is blocking the
    DHCP server from communicating with your computer.


    ## Releasing an IP Address


    DHCP addresses come with a `lease`, which means the amount of time your computer
    is allowed to keep the address. Usually, your computer will contact the DHCP server
    at the halfway point before the lease expires, and ask for permission to keep
    it, which the DHCP server almost always grants.


    Sometimes you want to release a leased IP address early - like if your network''s
    DHCP server changes, or if your computer refuses to release its IP address. You
    can do this with the `dhclient` command and the `-r` option:


    ```

    dhclient -r

    ```


    This releases your IP address, and you can then use `dhclient` to contact a DHCP
    server to receive a new one.


    ## Testing Your DNS Server


    As we mentioned above, if your DNS server stops responding, you can have all sorts
    of network problems. When it''s working right, you will forget that it''s there.
    But it goes bad, everything grinds to a halt. Without it, you can''t type addresses
    into the address bar of your web browser, or use any network resources that depend
    upon DNS.


    To diagnose your DNS server, you can use a command called `nslookup`. The `nslookup`
    command provides the IP address of your current DNS server, and also runs a test
    lookup against the server to see if it is functioning. For example, if you wanted
    to determine if your DNS server was operational, you would do so with this command:


    ```

    nslookup distrowatch.org

    ```


    The output would look something like this:


    ![](Images/image00188.jpeg)


    The first two lines list the DNS server your computer is using. In this case,
    we are using a DNS server with an IP address of `192.168.2.1`. The second group
    of lines shows the result of the lookup we preformed – the IP address of `distrowatch.org`.
    In this case, you can see that `distrowatch.org` has an IP address of `66.180.174.35`.
    Since `nslookup` successfully returned an IP address for `distrowatch.org`, you
    know that your DNS server is functioning correctly.


    ## Testing Connectivity


    If you’ve ever had to repair a computer (or even used one, for the matter), you
    know that network and Internet connection problems are a depressingly common occurrence.
    Fortunately, the command line’s tools are useful for obtaining valuable information
    about any network problems.


    The first and most commonly used network-diagnostic command is the `ping` command.
    The `ping` command stands for `Packet Internet Groper`, and it relies upon the
    ICMP protocol, the Internet Control Message Protocol. Basically, the `PING` command
    sends a packet to a network destination, such as a server or another PC, and if
    the destination is active, it sends back an acknowledgment packet. For instance,
    if you wanted to ping the PC at the IP address of `192.168.1.2`, you would use
    this command:


    ```

    ping 10.10.11.254

    ```


    If `10.10.11.254` is up, the `ping` command will generate an output like this:


    ![](Images/image00188.jpeg)


    The `ping` command will continue pinging the target until you hit `CTRL-C` to
    cancel the command.


    The command also has a few command options you can use to alter its performance.
    The `-c` option tells `ping` to send a set number of packets and then stop. For
    example, if you only wanted to ping `192.168.1.2` six times, you would use this
    command:


    ```

    ping -c 6 192.168.1.2

    ```


    Note that the `ping` command will not always work, even if a remote destination
    has an active network connection. This is because some operating systems by default
    block ICMP traffic. However, enough devices do permit ICMP traffic to make PING
    a useful diagnostic tool.


    ## Tracing Paths


    Sometimes your network connection is active, but you can’t access a particular
    destination. In this case, the `traceroute` command becomes useful. The `traceroute`
    command maps the network route from your computer to the destination, and sends
    every device in the path an ICMP packet. You can then see which devices in the
    path are not responding, and then hopefully determine a solution. For instance,
    to trace the path to `10.10.11.254`, you would use `traceroute` like this:


    ```

    traceroute 10.10.11.254

    ```


    The output will look something like this, with one line for each `hop` (another
    device in the chain) to the destination:


    ![](Images/image00188.jpeg)


    The `traceroute` command by default runs up to thirty hops.


    # Chapter 6. Startup and Shutdown


    ## Overview


    This chapter covers commands used to startup and shutdown Unix, Linux, and BSD
    systems. It also provides an overview of platform specific service control commands
    for popular platforms.


    ## Commands covered in this section:


    ```

    shutdown

    ```

