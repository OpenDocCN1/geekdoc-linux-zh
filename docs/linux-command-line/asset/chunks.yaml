    - 步骤 1 – 连接硬盘。

    - 步骤 2 – 为你的挂载点创建一个文件夹。

    - 步骤 3 – 获取硬盘的一些特定信息，然后将挂载点文件夹指向该硬盘。


    这基本上就是你挂载驱动器的方法。挂载点文件夹现在与硬盘绑定在一起。由于它们绑定在一起了，你现在可以通过挂载点文件夹浏览硬盘的内容。


