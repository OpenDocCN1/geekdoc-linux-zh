- fmt: '

    Now, consider the example diagram above. Let us say that you are in the root directory
    and you want to go to the `www` directory. If you type:


    ```

    cd www

    ```


    Linux will not be able to bring you to the `www` directory; it will say that the
    directory does not exist. Why? Because remember, you are in the root directory.
    As far as Linux is concerned, there are only two files within the root directory
    at this point: `etc` and `var`. To be able to go to the `www` directory from root,
    you must type:


    ```

    cd /var/www

    ```


    Now you might be asking, won''t the second forward slash in the above command
    bring you back to root? No, it will not. Linux only interprets the first instance
    of the forward slash as the root directory. The second forward slash will be interpreted
    as an instruction to look for the directory that succeeds it, from the directory
    that precedes it.


    Here is another example: Let us say you are in the `www` directory and you want
    to go to the `etc` directory. If you type in:


    ```

    cd etc

    ```


    This command will not work. Keep in mind that you are currently in the `www` directory.
    As far as Linux is concerned, there is no `etc` directory inside the `www` directory.
    To make this work, you have to type the command below:


    ```

    cd /etc

    ```


    So again, the first instance of the forward slash will be interpreted by Linux
    as an instruction to go to the root directory first. Once it is in the root directory,
    it will then find the `etc` directory. Of course, this command will successfully
    bring you inside the `etc` directory since it exists within the root folder.


    ## Listing/Displaying Files


    Now, once you are in a directory, it is always important to find out what else
    is in that directory. To list files in Linux, you simply use the command `ls`.


    ```

    ls

    ```


    And then, depending on what you want to do, you can apply one of two arguments.
    If you do:


    ```

    ls -l

    ```


    What will happen is that all the files and folders will get listed. In addition
    to that, it will also show you the permissions for those files and folders, the
    date they were modified, the group ownership of the files and folders, and the
    individual owner.


    A lot of times that can turn into a really big file. So, what you can also do
    is type:


    ```

    ls -m

    ```


    This time, instead of Linux giving you a really long list, it just types everything
    into a nice block so you can see every bit of information about the files and
    folders. That is all you need to do to list files and folders in Linux.


    Now, let’s say you want to edit a critical configuration file, but you have absolutely
    no idea where that file is. Frankly, Linux does have a search option. In order
    to search for files and folders, all you do is type:


    ```

    sudo find -iname <file/folder name>

    ```


    That is `sudo`, a space, followed by the word `find`, another space, the argument
    `-iname`, another space, and then finally the name of the file or folder that
    you are looking for. Now you might be askin, what does the `-iname` argument do?
    Well, what it does is it makes the search case insensitive.


    If you are looking for a folder named `home` for example, and you use the search
    command with the `-iname` argument, it will come back with all the folder that
    has `home` as the folder name. Whether that folder is name as `Home`, `homE`,
    `hOme`, `HOme`, `hoMe`, or `HOME`, it will come up in the search result.


    Whereas if you mess up the capitalization of the name of the file or folder that
    you are looking for, and you did not use the `-iname` argument, the search may
    come back with no results because no file or folder match the capitalization.


    Also, do not forget about the `sudo` command when executing `find` commands in
    Linux. If you do not put in `sudo` at the beginning, the `find` command will fail
    in the most obnoxious way in that it will not tell you that it failed. It will
    simply not give you any results. So you will think that the file does not exist
    on the computer, when in actuality it does exist but you just did not use `sudo`.


    If you put an asterisk `*` before a file or folder name, that means that you are
    looking for "anything before" that particular file or folder name. Let us say
    you are trying to locate a configuration file in Linux. In Linux, all configuration
    files have `.conf` suffix. If you are looking for a configuration file but you
    forgot what the exact name is, you may want to pull up all the files that have
    `.conf` as their suffix. In this case, what you do is type the command below:


    ```

    sudo find -iname *.conf

    ```


    What this command will do is look for a file or folder name that begins with anything
    and ends with `.conf`. Now, what if you know the filename of the file that you
    are looking for, but you do not know the suffix. In this case, you need to type
    the command below:


    ```

    sudo find -iname php*

    ```


    What this command will do is look for a file or folder name that begins with `php`
    and ends with anything.


    ## Making, Deleting, Moving, Copying, Renaming


    Now we need to talk about making, deleting, moving, copying, and renaming files
    and folders in Linux. The first thing we we are going to do is talk about creating
    a folder. It is pretty straightforward. All you do is type:


    ```

    sudo mkdir <name of directory/folder>

    ```


    That is `sudo`, followed by a space, and then the `mkdir` parameter, another space,
    and then the name of the folder or directory that you want to make. As you can
    probably already guess, `mkdir` stands for "make directory."


    Keep in mind that if you do not put the full path of the directory, this command
    will simply create that directory or folder inside the directory that you are
    in. For example, let us say you are in the `var` directory and you want to create
    a `Notes` folder inside the `etc` directory. If you type:


    ```

    sudo mkdir Notes

    ```


    This command will just create the `Notes` folder in the `var` directory. To create
    the `Notes` folder in the `etc` directory, you must type the full path like the
    one:


    ```

    sudo mkdir /etc/Notes

    ```


    This way, Linux will go to the root directory first, and then the `etc` directory,
    and within the `etc` directory create a folder. Typing in the full path will ensure
    that no matter where you are, you would be able to create the folder. That is
    all you need to do to create a folder or directory in Linux.


    Deleting files or folders is just as simple. What you do is type the command below:


    ```

    sudo rm <file or folder name>

    ```


    That is `sudo`, a space, followed by the letters `rm`, another space, and then
    finally the name of the file or folder that you want to delete. As you may have
    already guessed, `rm` stands for remove. Let us say for example you want to delete
    a file named `Notes`.


    ### Deleting folders


    Deleting folders is a little bit different, however. You actually still follow
    the same syntax as when you are deleting a file. The only difference is that you
    have to add the `-R` argument at the end of the command when deleting folders.
    The argument `-R` stands for recursive. By using the recursive argument, you are
    basically telling Linux to do the same task to the contents of the folder.


    Let us say you want to delete the `www` folder that has three files in it. To
    do this, you just type:


    ```

    sudo rm www -R

    ```


    This command will not only delete the folder itself, but also the three files
    that are inside it. If you do not put a recursive argument at the end of a delete
    folder command, Linux will not be able to execute it successfully, since you cannot
    delete a folder without deleting the contents as well. The only time you would
    be able to delete a folder successfully without the recursive argument is when
    the folder is empty to begin with.


    ### Renaming files and folders


    In Linux, there is no command to rename files and folders per se. Instead of rename,
    we have the `mv` command in Linux. Let us say for example you have a file named
    `file1`, and you want to change the name to `file2`. To do that you have to type
    the command syntax below:


    ```

    sudo mv <name of old file> <name of new file>

    ```

