- fmt: '

    There is a permission setting that can be seen as threatening to security, which
    is called `setuid` or `suid` (set user ID). This permission setting applies to
    files that you can run, or executable files. When the `setuid/suid` permission
    is allowed, a file is executed under the owner’s user ID. In short, if the `suid`
    permission is on and the file is owned by the `root` user, the targeted program
    will view the `root` user to be the one running the file and not check on who
    ran the program in reality. This also means that the permission for `suid` will
    allow the program to do more functions than what the owner intends all the other
    users to perform. It also helps to take note that if the said program that contains
    the `suid` permission has some security vulnerabilities, criminal hackers can
    create more havoc through these programs.


    To find all enabled `suid` permissions, you can use the `find` command like this:


    ![00109.jpeg](Images/image00234.jpeg)


    ![00110.jpeg](Images/image00235.jpeg)After entering this command, you will see
    a list of files that appears like this example:


    Take note that there are numerous programs that are set with a `suid` permission
    because they require it. However, you may want to check the entire list to make
    sure that there are no programs that have odd `suid` permissions. For example,
    you may not want to have `suid` programs located in your home directory.


    ![00111.jpeg](Images/image00236.jpeg)Here is an example: typing the `ls –l /bin/su`
    will give you the following result:


    The character s in the permission setting alluded to the owner (appears as `–rws`)
    shows that the file `/bin/su` has `suid` permission. This means that the `su`
    command, which allows any user to have superuser privileges, can be used by anyone.


    # Conclusion


    There are thousands of reasons why you should learn Linux in this age. Even if
    you are not yet ready to make the switch from your current operating system to
    Linux-based systems, learning how they operate is a useful skill. A recent survey
    found out that employers are more likely to hire someone conversant with Linux-based
    distributions since it shows that you are flexible and versatile. There are many
    instances where using a Linux-based system will be more appropriate.


    The Linux community is also another thing which should attract you. There are
    many Linux users always eager to help you out. In most cases, any issue you encounter
    will most likely have been resolved in the forums. So, take your time, sign up
    in a forum and go through the conversations to learn more about what is happening
    in the Linux world. When you finally become an advanced user, give back to the
    community be helping others. This is what makes the Linux community great and
    such a big force.


    We can list many reasons why you should be using Linux, but the most important
    is the fact that you have the freedom to experiment and try out new things. The
    command line gives you so much power to understand and control how your computer
    works, the free software repositories, the multiple desktop feature, the hardware
    support, using Linux on any computer, security, and interoperability with other
    systems. All these reasons and many more make it essential to learn and be conversant
    with Linux.


    If you want a new system that’s different from windows, more secure, and in many
    cases better than windows, Linux is ultimately the way to go with all of this,
    since you can do so much with it, and there are many customizing options that
    you can try out, including changing some of the aspects of the system. It is not
    as held back as Windows is in that regard, and there is a reason why many people
    are switching over to Linux when compared to other systems. The next step that
    you should take when it comes to Linux, is to try it out for yourself. You should
    take some time and try to ensure that you are working on this system, and you
    can from there, create a great database and environment for your system. It does
    take a bit of time to learn, and it can be scary, but once you start running your
    computer on Linux, you will understand why everyone is doing it these days. It
    is simpler, faster, and overall allows for more options for you to try out, and
    a lot that you can enjoy with this that it will allow you to try out. It does
    make a difference when you use this, and you will be happier with this as well.

