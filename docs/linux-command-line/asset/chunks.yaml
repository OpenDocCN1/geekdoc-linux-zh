    *   `bg` – This is used to reactivate an interrupted process in the background.

    *   `fg` – This returns the process onto the foreground.

    *   `jobs` – It shows the commands being run in the background.

    *   `kill` – This ends a task.

    *   `regular_command` – This runs the command in the system’s foreground.

    *   `command &` – This runs the command in the system’s background. It releases
    the terminal: you can run other programs while the previous command is still active.

    *   `Ctrl + Z` – This stop (suspend, but not terminate) a process that runs in
    the system’s foreground.

    *   `Ctrl + C` – This interrupt (stops and terminates) a process that runs in
    the foreground.

    *   `%n` – The system assigns a number to each process that runs in the background.
    Using the `%` symbol, you can refer to a process through its number (e.g. `bg
    %2`).


    ## Automatic Processes


    Automatic (also known as batch) processes are not linked to any terminal. Instead,
    these are jobs that can be lined up in the spooler area, where they will be performed
    on a first-in first-out basis. These processes can be executed using one of these
    methods:


    *   At a specific time and date – You must use the `at` command to accomplish
    this.

    *   At times when the overall system load is sufficiently low to receive additional
    tasks. You can do this through the `batch` command. In general, processes are
    lined up so they can be executed once the system load is below `0.8`. In huge
    systems, the administrator may utilize batch processing when huge amounts of data
    need to be processed or when tasks requiring many resources need to be performed
    on an already busy system. You can also use batch processing to optimize system
    performance.


    ## Daemons


    These are server processes that continuously run. Often, they are activated during
    startup and wait in the system’s background until their services are needed. A
    common example is `xinetd`, the networking process, which is triggered in each
    boot procedure. After the booting process, `xinetd` waits until a program (e.g.
    a POP3 client) needs to connect to the internet.


    ## The Boot Process


    One of the popular features of Linux is its method of initiating and suspending
    the OS, where it gets specific programs through their ideal settings, allows you
    to modify the settings and the boot procedure, and stops in an organized and graceful
    way.


    Beyond manipulating the boot and shutdown processes, the "openness" of Linux systems
    helps you to determine the causes of problems related to shutting down or booting
    up your machine.


    ### The Procedure


    When a computer is started up, the CPU looks for the Basic Input/Output System
    (BIOS) and executes it. This program is coded into the computer’s permanent-ROM
    (read-only memory) and is available for use anytime. The computer’s `BIOS` provides
    peripheral devices with a low-level interface and manipulates the first phase
    of the startup procedure.


    The `BIOS` checks the entire system, searches for and tests peripheral devices,
    and searches for a drive that can be used to start the system. Often, `BIOS` checks
    the CD-ROM drive (for newer OS) or the floppy drive (for older ones) for usable
    media. The sequence of the drives utilized for the booting process is commonly
    managed by a certain `BIOS` configuration on the operating system. Once a Linux
    system is installed onto the computer’s hard drive, the `BIOS` searches for an
    `MBR` (i.e. master boot record) starting at the initial part of the first hard
    disk, puts the data into the memory, and gives control to it.


    The `MBR` holds the steps on how to use the `LILO` or `GRUB` boot-loader, through
    a predetermined OS. Afterward, the `MBR` activates the boot-loader, which controls
    the rest of the process (that is, if a boot-loader is installed in the Master
    Boot Record). In the standard configuration of the Red Hat OS, `grub` utilizes
    the settings in the master boot record to show available boot choices. Once `grub`
    gets the right instructions for the OS to boot, either from the configuration
    file or its own command line, it acquires the required boot file and passes the
    control of the computer to the OS.


    ## The Different Features of GRUB


    This method of booting up a computer is known as direct loading. This is because
    no transitional code exists between the boot-loader and the OS’s main files (e.g.
    the kernel). Thus, startup instructions are utilized to load the OS directly.


    On the other hand, the boot procedure used by other systems may be different from
    the one given above. For instance, MS-DOS and Windows OS overwrite the `MBR` completely
    as soon as they are installed without using any part of the existing `MBR`’s settings.
    This deletes the data stored by other operating systems (e.g. Linux) inside the
    `MBR`. Microsoft’s operating systems, just like other commercial systems, are
    booted through a process called chain loading startup method. In this method,
    the `MBR` checks the initial segment of the partition that holds the OS, where
    it gets the files required to boot the operating system.


    `Grub` can support both of these methods. That means you can use `grub` with almost
    all operating systems, common file structures, and hard disks that can be recognized
    by your `BIOS`.


    `GRUB` has other useful features. Here are the most important ones:


    *   `Grub` provides x86 computers with a command-based environment (even if no
    OS has been installed yet). This allows computers to achieve maximum versatility
    – they can easily load operating systems or collect data about those systems.

    *   `Grub` is compatible with LBA (i.e. Logical Block Addressing) mode. This mode
    is required to access IDE and SCSI hard drives. Without LBA, hard disks may face
    a 1024-cylinder restriction, where the computer’s `BIOS` cannot get a file past
    that point.

    *   Each time the system is started, `grub`’s configuration files are loaded from
    the hard disk. That means you can change boot options without overwriting the
    data in the `MBR`.


    ## The INIT


    Once loaded, the kernel finds `INIT` in the `/sbin` directory and runs it.


    The `INIT` is the parent/grandparent of all the tasks that run automatically on
    a Linux OS. First, `INIT` reads its own initialization file (this file is located
    in the `/etc/inittab` directory). The initialization file tells `INIT` to load
    a configuration script for the system, which arranges the paths, begins swapping,
    scans the system files, etc. Simply put, this stage completes everything your
    machine needs during system startup (i.e. starting serial ports, setting the computer’s
    clock, etc.).


    Afterward, `INIT` keeps on reading the initialization file, which defines how
    the OS should be run in every operating level. This file also assigns a run level
    for the system. Run levels are the configurations of computer processes. Once
    a run level is assigned for the system, `INIT` begins the background tasks required
    by the system. `INIT` does this by checking the correct `/rc` directory for the
    assigned run level. Lastly, `INIT` runs all of the kill scripts using a stop parameter.


    ## Shutdown


    Linux was not designed to be turned off. If you really need to, however, you may
    run the `shutdown` command. Once the shutdown process is completed, you may use
    `-h` to suspend the system or `-r` to restart it.


    The `-r` and `-h` options are now capable of invoking the `shutdown` command if
    used while the OS is using run levels 1 to 5. This range of run levels ensure
    correct shutdown for the whole system. However, this is a bad habit to develop
    since not all Linux systems have this capability.


    If the machine doesn’t turn itself off, you must not power off the machine until
    the screen shows a message indicating that the OS is suspended or completed shutting
    down. Waiting for this message gives your computer ample time to disconnect active
    partitions. Remember: impatience can result to data loss.


    ## How to Manage Processes


    ### The Admin’s Tasks

