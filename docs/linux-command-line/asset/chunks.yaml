  trans: '


    有一种权限设置被认为是对安全的威胁，它被称为 `setuid` 或 `suid`（设置用户 ID）。这种权限设置适用于你可以运行的文件，即可执行文件。当允许
    `setuid/suid` 权限时，文件将在其所有者的用户 ID 运行下执行。简而言之，如果开启了 `suid` 权限且该文件属于 `root` 用户，那么目标程序将认为
    `root` 用户是运行该文件的执行者，而不会检查实际上是谁运行了该程序。这意味着 `suid` 权限将允许该程序执行比所有者意图让其他用户执行的更多的功能。还需要注意的是，如果包含
    `suid` 权限的上述程序存在某些安全漏洞，犯罪黑客可以通过这些程序造成更大的破坏。


    要找到所有已启用的 `suid` 权限，你可以像这样使用 `find` 命令：


    ![00109.jpeg](img/image00234.jpeg)


    ![00110.jpeg](img/image00235.jpeg)输入此命令后，你将看到一个像示例所示的文件列表：


    请注意，许多程序因为需要而设置了 `suid` 权限。然而，你可能想检查整个列表，以确保没有具有异常 `suid` 权限的程序。例如，你可能不希望在你的主目录下存在
    `suid` 程序。


    ![00111.jpeg](img/image00236.jpeg)这是一个示例：输入 `ls –l /bin/su` 将给你带来以下结果：


    权限设置中指向所有者的字符 s（显示为 `–rws`）表示文件 `/bin/su` 具有 `suid` 权限。这意味着允许任何用户拥有超级用户权限的 `su`
    命令可以被任何人使用。


    # 结论


    在当时代，你应该学习 Linux 的理由数以千千计。即使你还没有准备好从当前的操作系统切换到基于 Linux 的系统，学习它们的运行机制也是一项有用的技能。最近的一项调查发现，雇主更有可能雇用熟悉
    Linux 发行版的人，因为这证明了你的灵活性和多才。在许多情况下，使用基于 Linux 的系统会更合适。


    Linux 社区也是另一个应该吸引你的点。有很多 Linux 用户总是渴望为你提供帮助。在大多数情况下，你遇到的任何问题很可能已经在论坛中得到了解决。所以，请花点时间注册一个论坛并浏览对话，以了解更多关于
    Linux 世界正在发生的事情。当你最终成为高级用户时，请通过帮助他人来回馈社区。这正是 Linux 社区变得如此伟大并成为如此强大力量的原因。


    我们可以列出许多你应该使用 Linux 的理由，但最重要的一点是你拥有实验和尝试新事物的自由。命令行赋予了你巨大的力量来理解和控制计算机的工作方式、免费的软件库、多种桌面功能、硬件支持、在任何计算机上使用
    Linux、安全性以及与其他系统的互操作性。所有这些原因以及更多原因使得学习并熟悉 Linux 变得至关重要。


    如果你想要一个与 Windows 不同、更安全且在许多情况下比 Windows 更好的系统，Linux 最终是实现这些目标的唯一选择，因为你可以用它做很多事情，并且有很多你可以尝试的自定义选项，包括更改系统的某些方面。在这一方面，它不像
    Windows 那样受到束缚，而且与其他系统相比，许多人切换到 Linux 是有原因的。在 Linux 时，你应该采取的下一步是亲自尝试一下。你应该花一些时间尝试确保你正在这个系统上工作，并从那里为你的系统创建一个出色的数据库和环境。学习确实需要一点时间，可能会令人恐惧，但一旦你开始在
    Linux 上运行你的计算机，你就会理解为什么现在大家都在这样做了。它更简单、更快，而且总体来说为你提供了更多可以尝试的选项，以及许多你可以从中享受的体验。当你使用它时确实会有所不同，你也会变得更加快乐。


    '
