    ## 挂载驱动器 (Mounting Drives)


    为了在 Linux 中导航，你需要理解的最后一个大概念就是挂载驱动器。当你有一个外部硬盘并将其插入计算机时，你需要挂载驱动器才能浏览其内容。这个外部硬盘可以是普通硬盘、优盘或
