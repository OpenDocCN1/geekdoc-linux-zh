    \ known for making documents secure, the same concept works well for passwords.\n\
    \nAnother advantage that MD5 has over traditional passwords is that you can use\
    \ a longer password. As you already know, longer passwords are tougher to crack,\
    \ even when the `/etc/shadow` file falls into the hands of a criminal hacker.\
    \ You can see that the password ![00104.jpeg](Images/image00229.jpeg)field in\
    \ this file employs an MD5 encryption:\n\nAnother module that called the PAM (pluggable\
    \ authentication module) encrypts the passwords with MD5. In Linux, you can set\
    \ the PAMs in such a way that you can switch authentication while on the go, without\
    \ having to change programs that are necessary in verifying identity, such as\
    \ the username and the password.\n\nThe PAMs in Linux are used extensively and\
    \ they are also used in different other modules in your system. All configuration\
    \ files involving the PAMs are stored in the directory named ![00105.jpeg](Images/image00230.jpeg)`etc/pam.d`.\
