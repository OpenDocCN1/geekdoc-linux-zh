    ## Glossary of terms used in this section:


    ### Init (INITialization)

    A program that controls the startup (AKA initialization) of Unix, Linux, and BSD
    systems.


    ### Runlevel

    A set of profiles used by the `init` program that defines the programs and services
    to load during system startup (or when called by the `telinit` command).


    ### Service

    A system program that provides a service as a web server, DNS server, email server,
    etc. Services are sometimes referred to as Daemons or Service Daemons.


    ## shutdown

    **Purpose:** Shut down the system.

    **Usage syntax:** `shutdown [OPTIONS] [TIME] [MESSAGE]`


    ### # shutdown now

    ```

    BROADCAST MESSAGE FROM ROOT:

    The system is going down for shutdown now!

    * Stopping services [ OK ]

    * Terminating processes [ OK ]

    ...

    The system will now halt.

    ```

    Example output from the shutdown command


    The `shutdown` command is used to shutdown the local system. There are several
    different types of shutdowns that can be performed: `halt`, `poweroff`, and `reboot`.


    **Note:** Usage of the `shutdown` command varies between the various Unix, Linux,
    and BSD platforms. Examples on this page are intended for Linux systems. For usage
    examples specific to your environment, type `man shutdown` on your local system.


    When the `shutdown` command is executed, a warning is broadcast to all users logged
    in to the local system. An optional message can be specified following the time
    argument as shown in the next example.


    ### # shutdown 2 Save your work and log off ASAP!

    ```

    BROADCAST MESSAGE FROM ROOT:

    The system is going down for shutdown in 2 minutes!

    Save your work and log off ASAP!

    ```

    Example output from the shutdown command''s broadcast message


    **Common usage examples:**

    * `shutdown now` - Shutdown the system immediately

    * `shutdown [MIN]` - Wait the specified number of minutes before shutting down

    * `shutdown [HH:MM]` - Shutdown at the specified time (24-hour format)

    * `shutdown -r now` - Restart the system

    * `shutdown -H now` - Halt the system

    * `shutdown -P now` - Power off the system


    ## poweroff

    **Purpose:** Power off the system.

    **Usage syntax:** `poweroff`


    ### # poweroff

    ```

    BROADCAST MESSAGE FROM ROOT:

    The system is going down for power off now!

    * Stopping services [ OK ]

    * Terminating processes [ OK ]

    ...

    The system will now power off.

    ```

    Example output of the poweroff command


    The `poweroff` command will immediately shutdown and power off the system. It
    is essentially a shortcut for `shutdown -P now`. The `poweroff` command is found
    on all Linux distributions and some BSD and Unix systems.


    **Note:** To see if the `poweroff` command is supported on your system, type `whereis
    poweroff`.


    **Warning:** The `poweroff` command does not offer a grace period and will immediately
    bring down the system when executed.


    **Common usage examples:**

    * `poweroff` - Shutdown and poweroff the system


    ## reboot

    **Purpose:** Reboot the system.

    **Usage syntax:** `reboot`


    ### # reboot

    ```

    BROADCAST MESSAGE FROM ROOT:

    The system is going down for reboot now!

    * Stopping services [ OK ]

    * Terminating processes [ OK ]

    ...

    The system will now reboot.

    ```

    Example output of the reboot command


    The `reboot` command is used to gracefully reboot the system. It is essentially
    a shortcut for `shutdown -r now`. Executing `reboot` on the command line will
    immediately reboot the system as demonstrated in the above example.


    **Warning:** The `reboot` command does not offer a grace period and will immediately
    reboot the system when executed.


    ## halt

    **Purpose:** Halt the system.

    **Usage syntax:** `halt`


    ### # halt

    ```

    BROADCAST MESSAGE FROM ROOT:

    The system is going down for halt now!

    * Stopping services [ OK ]

    * Terminating processes [ OK ]

    ...

    The system will now halt.

    ```

    Example output of the halt command


    The `halt` command will halt an online system. A `halt` is a special type of shutdown
    which gracefully shuts down the operating system without powering off the system.


    **Note:** Some commercial Unix systems will enter maintenance mode when halted.
    This can be used to access a pre-boot configuration/diagnostic environment.


    ## telinit

    **Purpose:** Change the runlevel.

    **Usage syntax:** `telinit [RUNLEVEL]`


    ### # telinit 1

    ```

    *** Switching to run level 1 ***

    ```


    ### # runlevel

    ```

    3 1

    ```

    Using `telinit` to change the system''s runlevel


    `telinit` tells the system''s `init` process to stop and start the necessary services
    configured for the specified runlevel. In the above example the `telinit` command
    is used to change the system to runlevel 1. The `runlevel` command (see Section
    7) is then executed to display the current and previous runlevels.


    Each system''s runlevel configuration is specific to the distribution being used
    and can be customized to fit your needs. Most Unix, Linux, and BSD systems will
    have a runlevel configuration similar to the one described in the following table:


    | Runlevel | Description |

    | :--- | :--- |

    | 0 | Shutdown or special administrative mode |

    | 1 | Single user mode |

    | 2 | Multiuser mode |

    | 3 | Multiuser mode |

    | 4 | Multiuser mode |

    | 5 | Distribution specific |

    | 6 | Reboot |


    **Common usage examples:**

    * `telinit [RUNLEVEL]` - Tell the init process to load the specified runlevel


    ## runlevel

    **Purpose:** Display the previous and current runlevel.

    **Usage syntax:** `runlevel`


    ```bash

    $ runlevel

    3 1

    ```

    Output of the runlevel command


    The `runlevel` command displays the current and previous runlevel. The runlevel
    is an initialization sequence called by the `init` process and defines procedures
    for system startup and shutdown. In the above example the first number is the
    previous runlevel and the second number is the current runlevel.


    **Note:** If there is no previous runlevel, the system will display `N` in the
    first field.


    **Common usage examples:**

    * `runlevel` - Display the previous and runlevel


    ## service

    **Purpose:** Manage services on a Linux system.

    **Usage syntax:** `service [OPTIONS] [SERVICE] [ACTION]`


