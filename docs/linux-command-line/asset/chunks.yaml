    当你与 Linux 终端交互时，你的计算机会识别你的输入设备（如鼠标和键盘）为应当传输命令的设备。另一方面，标准输出和错误输出会以终端中文本的形式显示在你的屏幕上。


    当你成功更改命令的输入和输出方向时，你会得到什么呢？做到这一点可以让你在操作系统中执行更复杂的任务。例如，如果你正尝试管理文件，或者在使用 Linux 进行软件开发时，能够操作
    I/O 流将使你变得更高效。


    ## 从文件获取输入


    如果你需要某个命令从特定文件读取指令，你可以指示 Linux 使用该特定文件作为标准输入，而不是键盘。例如，输入命令：


    ```bash

    cat < /etc/passwd

    ```


    运行此命令将允许你看到 `/etc/passwd` 文件中包含的所有行列表。因为你使用了 `<` 符号，你成功地重定向了标准输入，让 Linux 认为 `stdin`
    是 `/etc/passwd` 文件而不是你的键盘。


    ## 将命令输出发送到另一个文件


    如果你想记录某个命令的输出并将其保存为文件，你需要将 `stdout` 更改为文件。例如，在进入主目录后，输入以下命令：


    ```bash

    grep typedef *" > typedef.out

    ```


    使用此命令将允许你搜索所有包含文本 `typedef` 的文件，然后将结果保存到名为 `typedef.out` 的文件中。`>` 符号将标准输出重定向到你指定的文件。请注意，上述命令展示了另一个
    bash 特性：当使用星号 `*` 时，你本质上是在要求 Linux 包含指定目录中的所有文件，在此例中，即 `/usr/include` 目录下的所有文件。


    提示：你可以使用 `>>` 符号将输出追加或添加到现有文件的末尾，而不是必须创建一个新文件来保存输出。请注意此格式：


    ```bash

    grep typedef *" >> typedef.out

    ```


    你也可以通过 `cat` 命令将标准输出更改为文件，这将准备一些小的文本文件。例如，如果你想让 Linux 存储你输入的所有内容，并且仅在你输入 `ZZ`
    并按回车时才停止，可以使用此命令：


    ```bash

    cat > file.txt

    ```


    这意味着你的计算机将记录你在键盘上输入的所有内容，并且只在你按下 `ZZ` 和回车键时才会停止。


    ## 将错误保存到文件中


    在某些情况下，你输入了错误并想将其重定向到文件。你可以使用 `2>` 运算符来重定向 `stderr`。例如：


    ```bash

    ls /non_existent_directory 2> error.log

    ```


    这将错误信息保存在 `error.log` 中，而不是显示在终端上。

