    sudo apt-get install samba\n```\n\n![00139.jpeg](img/image00215.jpeg)\n\n### Fedora\
    \ 服务器\n\n在 Fedora 上安装 Samba 服务器，请使用 `dnf install` 命令。\n\n```bash\nsudo dnf install\
    \ samba --best\n```\n\nFedora 不会自动启动 `smb` 服务，因此您需要使用 `systemctl` 命令启动该服务。\n\n\
    ```bash\nsudo systemctl start smb nmb\n```\n\n### 防火墙\n\n如果您的 Linux 系统安装并运行了主机防火墙，那么您必须开放\
    \ `SMB` 的 `TCP` 端口 `445` 入站端口以允许传入连接。在 Linux 系统上运行任何如 `SMB` 的协议都存在安全风险，因此在防火墙上开放端口之前，请确保您的系统已正确配置并处于网络环境中。\n\
    \n本节将涵盖以下子章节：\n\n- Ubuntu 和 Debian\n- Fedora\n\n#### Ubuntu 和 Debian\n\nUbuntu\
    \ 和 Debian 使用简单的防火墙 (`UFW`) 来控制基本的防火墙配置，但防火墙默认未配置。使用以下命令开放 `TCP` 端口 `445`：\n\n\
    ```bash\nsudo ufw allow in samba\n```\n\n#### Fedora\n\nFedora 使用 `firewalld`\
    \ 控制基本的防火墙配置，且防火墙默认已配置。使用以下命令开放 `TCP` 端口 `445`：\n\n```bash\nfirewall-cmd --permanent\
    \ --add-service=samba\nfirewall-cmd --reload\n```\n\n#### 配置 Samba 密码\n\nSamba\
    \ 用户使用的密码与 Linux 登录密码不同，但您可以将它们设置为相同。在用户访问 Samba 共享之前，必须使用 `smbpasswd` 命令配合 `-a`\
    \ 选项设置密码，如下示例所示。\n\n![00140.jpeg](img/image00216.jpeg)\n\n##### 编辑 `/etc/samba/smb.conf`\n\
    \nSamba 共享定义在 `/etc/samba/smb.conf` 文件中。\n\n```bash\nsudo vi /etc/samba/smb.conf\n\
    ```\n\n进入文件末尾并添加以下内容：\n\n```text\n[share_name]\n  comment = share_comment\n  path\
    \ = share_path\n  valid users = samba_user\n  read only = yes or no\n  guest ok\
    \ = yes or no\n  browseable = yes or no\n```\n\n下例显示了共享名称 `myshare` 的配置。\n\n![00141.jpeg](img/image00217.jpeg)\n\
    \n您需要重启 `smb` 服务使更改生效。\n\n#### Ubuntu 和 Debian\n\n```bash\nsudo systemctl restart\
    \ smbd\n```\n\n#### Fedora\n\n```bash\nsudo systemctl restart smb nbd\n```\n\n\
    ### 连接到 Samba 服务器\n\n为了从 Linux 系统或 Windows 系统连接到 Samba 服务器，系统必须拥有 `SMB` 客户端，且使用该客户端的用户在服务器上拥有用户名和密码。\n\
    \n#### Linux\n\n在 Linux 系统上，如果尚未安装 Samba 客户端，则必须安装。\n\n##### Ubuntu 和 Debian\n\
    \n```bash\nsudo apt-get install smbclient\n```\n\n##### Fedora\n\n```bash\nsudo\
    \ dnf install samba --best\n```\n\n安装 Samba 客户端后，您可以使用 `smbclient` 命令配合 `-L` 选项查询\
    \ Samba 服务器的共享信息，如下示例所示。第一个示例是来自 Ubuntu 服务器的共享信息，第二个示例来自 Fedora 服务器。在两个示例中，您都能看到共享\
    \ `myshare`。您需要提供之前创建的 Samba 密码。\n\n![00142.jpeg](img/image00218.jpeg)\n![00143.jpeg](img/image00219.jpeg)\n\
    \n您还可以使用 `smbclient` 命令连接到共享。在下例中，IP 地址之前有四个 `\\`，之后有两个。这是因为在使用 `smbclient` 命令时，您必须转义\
    \ `\\` 字符以赋予其特殊含义，因此如果您需要两个 `\\` 字符，则必须转义每一个，从而得到四个。您需要提供之前创建的 Samba 密码。连接后，您将获得\
    \ `smb: >` 提示符，这意味着您已连接到服务器。在下例中，使用 `?` 命令来访问帮助菜单。\n\n![00144.jpeg](img/image00220.jpeg)\n\
    \n连接到 Samba 服务器后，您可以使用命令在服务器上获取和存放文件，就像使用 `FTP` 和 `SFTP` 一样。\n\n下例显示了使用的 `\\`\
    \ 字符不足时会发生什么。\n\n![00145.jpeg](img/image00221.jpeg)\n\n您还可以使用通用网络文件系统 (`CIFS`)\
    \ 挂载 Samba 共享。大多数 Linux 系统默认没有安装 `CIFS`，因此您需要安装该软件。\n\n##### Ubuntu 和 Debian\n\
    \n```bash\nsudo apt-get install cifs-utils\n```\n\n##### Fedora\n\n```bash\nsudo\
    \ dnf install cifs-utils --best\n```\n\n安装 `CIFS` 后，您可以使用 `mount` 命令挂载 Samba 共享，如下例所示。\n\
    \n![00146.jpeg](img/image00222.jpeg)\n\n您还可以使用 `mount` 命令查看已挂载共享的信息，如下例所示。您可能需要使用\
    \ `grep` 命令来筛选特定的共享，因为服务器上可能有许多共享。\n\n![00147.jpeg](img/image00223.jpeg)\n\n要卸载\
    \ Samba 共享，请使用 `umount` 命令。\n\n```bash\nsudo umount ~/myfolder\n```\n\n#### Fstab\n\
    \n使用 `/etc/fstab` 文件，可以配置让 Samba 共享在启动过程中挂载到文件系统。这种配置存在一些安全问题，因为 Samba 用户名和密码被写入了配置文件。\n\
    \n##### 用户文件\n\n由于 Samba 共享根据用户名和 Samba 密码控制访问，您必须通过将用户名和密码存储在文件中，以便启动过程可以使用。\n\
    \n创建 `/etc/samba/user` 文件。\n\n添加以下行，并将 `sabmba_username` 替换为实际用户名，将 `samba_password`\
    \ 替换为实际密码。\n\n```text\nusername=sabmba_username\npassword=samba_password\n```\n\
    \n编辑 `/etc/fstab` 并添加如下内容：\n\n```text\n//ip_address/sharename /local_mount_point\
    \ cifs credentials=/etc/samba/user,noexec 0\n```\n\n重启系统以挂载 Samba 共享。\n\n#####\
    \ Windows\n\n从 Windows 系统访问 Samba 共享，打开文件资源管理器窗口并在地址栏中输入 `\\\\` 后跟运行 Samba 的 Linux\
    \ 服务器的 IP 地址。\n\n`\\\\ip_address\\`\n\n您也可以通过包含共享名称直接连接到共享。\n\n`\\\\ip_address\\\
    sharename`\n\n您将需要提供 Samba 用户名和密码。\n"
- fmt: "\nWhen you interact with the Linux terminal, your computer recognizes your\
    \ input devices, such as your mouse and keyboard, to be the ones that should be\
    \ transmitting commands. The standard output and error, on the other hand, are\
    \ displayed on your screen as a text displayed in a terminal. \n\nWhat do you\
    \ get when you manage to change the input and the output directions of your commands?\
    \ Being able to do so allows you to make more complex tasks in your operating\
    \ system. For example, if you are trying to manage your files or when you use\
    \ Linux for software development, being able to manipulate I/O streams will allow\
    \ you to become more efficient. \n\n## Getting Your Input from a File\n\nIf you\
    \ need a command to take instructions from a particular file, you can instruct\
    \ Linux to make use of that particular file as the standard input instead of your\
    \ keyboard. For example, key in the command:\n\n```bash\ncat < /etc/passwd\n```\n\
    \nRunning this command will allow you to see a list of all the lines that the\
    \ `/etc/passwd` file contains. Because you used the `<` sign, you have managed\
    \ to redirect the standard input, making Linux think that the `stdin` is the `/etc/passwd`\
    \ file instead of your keyboard.\n\n## Sending Your Command Output to Another\
    \ File\n\nIf you want to have a record of a command’s output and save it as a\
    \ file, you need to change the `stdout` to a file. For example, type the following\
    \ command after changing into your home directory:\n\n```bash\ngrep typedef *\"\
    \ > typedef.out\n```\n\nUsing this command will allow you to search all the files\
    \ that contains the text `typedef`, and then saves the results in a file named\
    \ `typedef.out`. The `>` sign redirects the standard output into the file that\
    \ you indicated. Also take note that the above command showed another bash feature:\
    \ when an asterisk `*` is used, you are essentially asking Linux to include all\
    \ the the files in the indicated directory, which in this case, all the files\
    \ that are in the directory `/usr/include`.\n\nTip: You can append or add an output\
    \ to the end of an existing file rather than having to create another file to\
    \ save your output, you can use the `>>` sign. Take note of this format:\n\n```bash\n\
    grep typedef *\" >> typedef.out\n```\n\nYou can also change the standard out to\
    \ a file by using the `cat` command, which will prepare small text files. For\
    \ example, if you want Linux to store all the things that you are writing and\
    \ only stop when you type in `ZZ` and press enter, you can use this command:\n\
    \n```bash\ncat > file.txt\n```\n\nThis means that your computer will be recording\
    \ all the things that you are typing in your keyboard and will only stop when\
    \ you press `ZZ` and Enter. \n\n## Saving Errors in Files\n\nThere are situations\
    \ wherein you enter an error and you want to redirect it to a file. You can use\
    \ the `2>` operator to redirect the `stderr`. For example:\n\n```bash\nls /non_existent_directory\
    \ 2> error.log\n```\n\nThis will save the error message in `error.log` instead\
    \ of displaying it on the terminal.\n"
  raw: 'When you interact with the Linux terminal, your computer recognizes your input
    devices, such as your mouse and keyboard, to be the ones that should be transmitting
    commands. The standard output and error, on the other hand, are displayed on your
    screen as a text displayed in a terminal. 


    What do you get when you manage to change the input and the output directions
    of your commands? Being able to do so allows you to make more complex tasks in
    your operating system. For example, if you are trying to manage your files or
    when you use Linux for software development, being able to manipulate I/O streams
    will allow you to become more efficient. 


    ## Getting Your Input from a File


    If you need a command to take instructions from a particular file, you can instruct
    Linux to make use of that particular file as the standard input instead of your
    keyboard. For example, key in the command:


    Running this command will allow you to see a list of all the lines that the /etc/passwd
    file contains. Because you used the < sign, you have managed to redirect the standard
    input, making Linux think that the stdin is the /etc/passwd file instead of your
    keyboard.


    ## Sending Your Command Output to Another File


    If you want to have a record of a command’s output and save it as a file, you
    need to change the stdout to a file. For example, type the following command after
    changing into your home directory:


    Using this command will allow you to search all the files that contains the text
    typedef, and then saves the results in a file named typedef.out. The > sign redirects
    the standard output into the file that you indicated. Also take note that the
    above command showed another bash feature: when an asterist is used, you are essentially
    asking Linux to include all the the files in the indicated directory, which in
    this case, all the files that are in the directory /usr/include.


    Tip: You can append or add an output to the end of an existing file rather than
    having to create another file to save your output, you can use the >> sign. Take
    note of this format:


    You can also change the standard out to a file by using the cat command, which
    will prepare small text files. For example, if you want Linux to store all the
    things that you are writing and only stop when you type in ZZ and press enter,
    you can use this command:


    This means that your computer will be recording all the things that you are typing
    in your keyboard and will only stop when you press ZZ and Enter. 


    ## Saving Errors in Files


    There are situations wherein you enter a command and then Linux returns with several
    lines of error messages. These error messages may scroll too fast that you cannot
    figure out what really is going on. When this happens, you have the option of
    saving these error messages in a file in order to know what really happened in
    the command by changing the standard error to a file that you can find later.


    Type in the following command in a terminal:


    This will look through your entire computer system for files that are named COPYING
    and will then save all the error to a file named finderr. The command 2> allows
    you to redirect the standard error to a file. 


    Pipes


    Type this command in the terminal:


    ls | less


    This command will pipe the data coming from ls, and then send it to the less command.
    The ls command is supposed to display the contents of a directory across numerous
    rows. When you pipe it to the less command, the directory entries are instead
    placed on a different line.


    Filters


    Commands that change the output and the piped redirection are called filters.
    They are also standard commands on Linux that you can use without having to use
    pipes. Here are some of the filter commands that you can use on the terminal:


    *   grep – gives results that matches a text that corresponds to a string pattern
    that is sent to grep command


    *   tr – finds one string and then replaces it with another one


    *   find – displays files that has names that match arguments that are sent to
    the find command


    *   tee – redirects the standard input to one/multiple files and the standard
    output


    *   wc – counts lines, characters, and words


    # Chapter 12. Commands for compressing and decompressing files


    ## To create a compress file with the tar extension that has the name file.tar


    | tar cf file.tar filestar cf file.tar  file1.c file2.cpp |


    ## To unpack the file


    | tar xf file.tar |


    ## To create a compressed file by the Gzip program


    | tar czf file.tar.gz filestar czf file.tar.gz  file1.c file2.cpp |


    ## To decompress the file created by Gzip


    | tar xzf file.tar.gz |


    ## To create a file compressed by the Bzip2 program


    | tar cjf file.tar.bz2 filestar cjf file.tar.bz2  file1.c file2.cpp |


    ## To decompress the file created by Gzip


    | tar xjf file.tar.bz2 |


    # Chapter 13. Wildcards in Linux


    There are numerous wildcards in Linux. Let’s examine them.


    The “*” wildcard


    This is used to match one or more characters in a specified file. When you want
    to know the list of files in the current directory whose name start with the letter
    “f”, run the following command:


    ls f*


    The above command is demonstrated in the figure shown below:


    From the figure shown, it is clear that I only have two files whose name start
    with the letter “f” in the above directory. You can also use the wildcard to find
    out the files whose names end with a certain pattern. For example:


    To know all the files whose name end with …me, run the following command:


    ls *me


    On my computer, the above command gives the following output:


    From the above figure it is very clear that only one file in the directory obeys
    the pattern specified. 


    The “?” wildcard


    In Linux the above wildcard is used to match exactly one character. Run the following
    command:


    ls f?le


    The above command gives the following output in my computer:


    Getting Help


    It is also possible to get help in Linux. If you want to know more about a certain
    command, you can consult the manual files. To find out more about the command
    “ls”, run the following command:


    man ls


    The above command will tell you more about the “ls” command and the options associated
    with it. If you want a short description of the command, run the following command:


    whatis ls


    With the above command, the options associated with the command “ls” will not
    be displayed, so use it only when you are not interested in the options.


    If you are not sure how to write a certain command in Linux, use the command “apropos”
    to get help. For example:


    To find out the exact name of the “copy” command, type the following:


    apropos copy


    # Chapter 14. Advanced Linux Navigation commands


    ## Changing Directories and Finding Files


    So, to find any particular file that you want to edit, you must first learn how
    to get to the folder or directory where that particular file is located. Again,
    to change directories, all you need to do is make use of the cd command just like
    in Windows. The syntax to change directory is:


    $ cd <name of folder>


    Now, there is more to this command than meets the eye. Remember, Linux is exceptionally
    literal when it comes to the interpretation of commands syntaxes. Again, let us
    make use of the diagram below:


    If for example you are in the var directory/folder and you want to go to the abc
    folder, all you need to do is type:


    $ cd abc


    Now, if for example you are in the var folder and you want to go to the etc folder,
    just typing in $ cd etc from within var will not work. Because then Linux will
    think that you want to go to the etc folder that is within the var folder, which
    does not exist.


    What you must do is type the command below:


    $ cd /etc


    Take note of the forward slash before the name of the directory that you want
    to go to. This forward slash will tell Linux to first go to the root directory
    and then find the etc folder or directory. Now, Linux will now be able to successfully
    bring you to the etc folder since it is able to locate it in the root directory.'
