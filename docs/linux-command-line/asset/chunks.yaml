    \ of the file and place it in the variable `myline`. The `-r` option will ensure\
    \ that this line is read raw.\n\n### 4. To read a file\na `read` command can be\
    \ combined with the `while` loop to read a file line-by-line. This is illustrated\
    \ below:\n\n```bash\nwhile read -r myline; do\n    # perform something on the\
    \ variable myline\ndone < file\n```\n\nA code of failure will be returned when\
    \ the `read` command meets end-of-failure. The `while` loop will then halt.\n\n\
    Note that we have placed `< file` at the end. To avoid this, pipe the file’s content\
    \ to a `while` loop as shown below:\n\n```bash\ncat file | while IFS= read -r\
    \ myline; do\n    # perform something on the variable myline\ndone\n```\n\n###\
    \ 5. To read any line of a file and assign it to a variable\nexternal programs\
    \ assist the bash to read the lines of a program. Consider the code shown below:\n\
    \n```bash\n$ read -r rline < <(shuf file)\n```\n\n`shuf` is available on modern\
    \ Linux systems and helps with this. The above code will read a random line of\
    \ a file and assign it to the variable `rline`. \n\n### 6. To extract a tar archive\n\
    use the following command:\n\n```bash\ntar xvf b.tar\n```\n\n### 7. To find the\
