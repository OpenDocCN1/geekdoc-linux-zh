    ## 在前台和后台运行进程


    到目前为止，你执行的所有命令都是在前台运行的。当一个命令、进程或程序在前台运行时，在进程进程退出之前，shell 提示符都不会显示。对于运行时间长的程序，将它们发送到后台可能会非常方便。后台运行进程仍然会执行并完成其任务，但它们不会阻止你在
    shell 提示符处输入后续命令。要将进程放入后台，请在命令末尾加上一个和符号 (`&`)。


    - `command &` - 在后台启动命令。

    - `Ctrl-c` - 杀死前台进程。

    - `Ctrl-z` - 挂起前台进程。

    - `bg [%num]` - 将挂起的进程放入后台。

    - `fg [%num]` - 将后台进程放入前台。

    - `kill [%num]` - 通过作业号或 PID 杀死进程。

    - `jobs [%num]` - 列出作业。


    ```bash

    $ ./long-running-program &

    [1] 22686


    $ ps -p 22686

    PID TTY           TIME CMD

    22686 pts/1     00:00:00 long-running-pr


    $ jobs

    [1]+  Running  ./long-running-program &


    $ fg

    ./long-running-program

    ```


    当命令被放入后台时，会显示两个数字。括号中的数字是作业号，可以通过在其加百分号来引用它。第二个数字是 PID。以下是在后台启动多个进程的示例外观。


    ```bash

    $ ./long-running-program &

    [1] 22703


    $ ./long-running-program &

    [2] 22705


    $ ./long-running-program &

    [3] 22707


    $ ./long-running-program &

    [4] 22709


    $ jobs

    [1]    Done      ./long-running-program

    [2]    Done      ./long-running-program

    [3]-  Running  ./long-running-program &

    [4]+  Running  ./long-running-program &

    ```


    `jobs` 输出中的加号 (`+`) 代表当前作业，而减号 (`-`) 代表上一个作业。当前作业被认为是最后一个在前台被停止的作业，或者是最后一个在后台启动的作业。当前作业可以通过
    `%%` 或 `%+` 引用。如果未向 `fg` 或 `bg` 提供作业，则对当前作业进行操作。上一个作业可以通过 `%-` 引用。你会注意到作业 1 和
    2 被报告为完成。shell 不会中断你的命令行，但在显示新提示符之前会报告作业状态。例如，如果你在后台启动一个程序，会返回一个提示符。shell 不会在显示新提示符之前报告作业状态。你可以通过简单按回车键请求显示新提示符。要将作业带回前台，输入作业名称或使用
    `fg`。要将当前作业调前台，执行 `%%`、`%+`、`fg %%`、`fg %+` 或 `fg %num`。要将作业 3 调前台，执行 `%3` 或 `fg
    %3`。


    ```bash

    $ jobs

    [3]-  Running  ./long-running-program &

    [4]+  Running  ./long-running-program &


    $ fg %3

    ./long-running-program

    ```


    要暂停或挂起正在前台运行的作业，输入 `Ctrl-z`。一旦作业被挂起，就可以在前台或后台恢复。要将挂起的作业放入后台，输入作业名称后加上和符号，或通过作业名使用
    `bg`。


    ```bash

    $ jobs

    [1]  Running  ./long-running-program &

    [2]-  Running  ./long-running-program &

    [3]+  Running  ./another-program &


    $ fg

    ./another-program

    ^Z

    [3]+  Stopped  ./another-program


    $ jobs

    [1]  Running  ./long-running-program &

    [2]-  Running  ./long-running-program &

    [3]+  Stopped  ./another-program


    $ bg %3

    [3]+ ./another-program &


    $ jobs

    [1]  Running  ./long-running-program &

    [2]-  Running  ./long-running-program &

    [3]+  Running  ./another-program &

    ```


    你可以使用 `kill` 命令停止或杀死后台作业。例如，要杀死作业 1，执行 `kill %1`。要杀死正在前台运行的作业，输入 `Ctrl-c`。


    ```bash

    $ jobs

    [1]  Running  ./long-running-program &

    [2]-  Running  ./long-running-program &

    [3]+  Running  ./another-program &


    $ kill %1

    [1]  Terminated  ./long-running-program


    $ jobs

    [2]-  Running  ./long-running-program &

    [3]+  Running  ./another-program &


    $ fg %2

    ./long-running-program

    ^C

    $ jobs

    [3]+  Running  ./another-program &

    ```


    ## 杀死进程


    - `Ctrl-c` - 杀死前台进程。

    - `kill [signal] pid` - 向进程发送信号。

    - `kill -l` - 显示信号列表。


    `kill` 使用的信号是终止（termination）。你会看到此信号被称为 `SIGTERM` 或简写 `TERM`。信号有与其名称对应的数字。默认的
    `TERM` 信号是 15。因此，运行 `kill pid`、`kill -15 pid` 和 `kill -TERM pid` 都是等效的。如果进程在你发送
    `TERM` 信号后没有终止，请使用 `KILL` 信号，它是数字 9。


    # 第 16 章. 让 Linux 更安全


    有很多理由你你保护计算机免受其他用户的侵害，但根本在于你不希望任何用户删除或修改你的系统文件。如果你正在处理一个计算机网络，你也不希望任何用户无意或故意更改其系统中的任何可能导致整个系统受到破坏的内容。


