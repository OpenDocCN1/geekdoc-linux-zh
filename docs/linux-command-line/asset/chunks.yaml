    FTP


    The FTP protocol is a quick and easy way to share files on the Internet or a network
    but is also very insecure.  The FTP protocol passes the username and password
    in clear text which can captured by anyone able to capture traffic between the
    client and the FTP server.  Due to security concerns, you should only use FTP
    to share files that do not need to be secured.


    On most Linux system you will need to install an FTP server if you want to makes
    files available via FTP.  If you have to use FTP, make sure that the server you
    install the FTP server software on does not perform any critical function on the
    network.  You should also not put an FTP server on your internal network that
    allows connections from outside the network or the Internet.  If you need to share
    files with the Internet, your FTP server should be in the Demilitarized Zone (DMZ)
    on the firewall.


    ### FTP Server install Ubuntu and Debian


    To install an FTP server on Ubuntu and Debian you can use the apt-get install
    command.


    sudo apt-get install vsftpd


    Ubuntu and Debian configure and enable the vstfpd service and start the service
    automatically during the install process.


    ### FTP Server install Fedora


    To install an FTP server on Fedora you can use the dnf install command.  The --best
    option tells Fedora to install the version of the software that best matches your
    system when there are multiple versions available.


    sudo dnf install vsftpd --best


    Fedora installs the vsftpd server but does not start the service automatically. 
    To start and enable the vsftpd server to start during boot use the systemctl command.


    sudo systemctl start vsftpd


    sudo systemctl enable vsftpd


    ### Firewalls   


    If your Linux system has a host based firewall installed and running then you
    will have to open up the port for FTP, TCP port 21, inbound in order to allow
    incoming connections.  There are security risks with running an insecure protocol
    such as FTP on a Linux system so make sure that you have the system properly configured
    and placed in the network before opening up a port on the firewall.


    The following subsections will be covered in this section:


    [Ubuntu and Debian](#part0000.xhtml__k8i2ho83u4t4)


    [Fedora](#part0000.xhtml__tl76v3lzju8h)


    Ubuntu and Debian


    Ubuntu and Debian use the Uncomplicated Firewall (UFW) to control basic firewall
    configurations, however the firewall is not configured by default.  To open TCP
    port 21 using the following command:


    sudo ufw allow in ftp


    Fedora 


    Fedora uses firewalld to control basic firewall configurations and the firewall
    is configured by default.  To open TCP port 21 using the following commands:


    firewall-cmd --permanent --add-port=21/tcp


    firewall-cmd --reload


    ### FTP Client


    In order to connect to an FTP server, you need to use an FTP client.  Ubuntu and
    Debian come with ftp already installed.  Fedora does not come with an FTP client
    so you must install it with the dnf install command.


