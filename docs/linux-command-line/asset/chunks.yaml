    如果没有给出命令行，则将打印错误信息，即必须提供一个整数。下部分涉及检查已传递的参数数量。如果我们传递了任何参数，那么“`if`”将结果为假，反之为真。`exit\
    \ 1` 语句将在成功执行后终止程序。\n\n# 第 8 章：网络\n\n单机家用电脑的时代早已过去了。现代服务器和工作站几乎总是连接到互联网，或者至少连接到局域网。为了从命令行有效地使用\
    \ Linux 系统，你至少需要具备 TCP/IP 计算机网络的基础知识，以及从提示符可用的网络命令。在本章中，我们将为你提供网络原理的基本概述。\n\n\
    ## 什么是 IP 地址？\n\n首先，我们应该讨论 IP 地址。在解释 Linux 命令行提示符的网络命令之前，牢固掌握 IP 划分的基础知识是一个好主意。\n\
    \n`IP` 字母代表互联网协议（Internet Protocol），而互联网协议是 `TCP/IP`（传输控制协议/互联网协议）套件的一部分，这是一组相关的协议，规定了计算机在网络（包括局域网和更广泛的互联网）上通信的规则。因此，IP\
    \ 地址是（理论上）分配给计算机的唯一地址。它有点像地址——它允许其他计算机向你的系统发送流量并从你的系统接收流量。IP 地址由四组由点分隔的数字组成：\n\
    \n`192.168.1.1`\n\n这些数字实际上是二进制数字的形式形式。这些数字中没有高于 255。（在看侦探剧集时，偶尔看到警察使用一个荒谬且不可信的\
    \ IP 地址（如 `689.34.385.339`）来追踪罪犯，会非常搞笑。）\n\nIP 协议的主流版本是第 4 版，通常称为 `IPv4`。（此处原文中存在大量重复内容，已处理。）\n\
    \n"
