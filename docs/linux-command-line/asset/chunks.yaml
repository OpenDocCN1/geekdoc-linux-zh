    Unix 密码在历史上被存储在一个名为 `/etc/passwd` 的文件中，任何用户都可以读取该文件。例如，计算机 root 用户的 `/etc/passwd`
    文件条目可能![00099.jpeg](img/image0022.jpeg)所示：


    你会发现该文件中的字段是用冒号分隔的，第二个字段显示的是加密形式的用户密码。为了让系统验证输入的用户密码是否有效，使用密码的程序会对该条目进行加密，然后将结果与
    `/etc/passwd` 文件中存储的加密文本进行比较。如果条目匹配，用户就可以使用该程序。


    然而，任何黑客都可以轻松地使用字典攻击来破解密码——这种解密方法通过尝试加密密码中所有可能的组合来寻找其对应的明文等值。如果你拥有 `/etc/passwd`
    文件的访问权限，那么你离破解密码仅一步之遥。如果你不是你尝试破解的计算机的授权用户，你可以利用目标 Web 服务（如 FTP 和邮件服务）中可能存在的漏洞来渗透并获取你想要的文件。


    幸的是，Linux 在提高操作系统安全性方面做了多项改进，包括以下内容：


    ### 影子密码 (Shadow Passwords)


    将密码存储在易于访问的位置是不安全的，即使这些密码经过了加密。出于这个原因，Linux 不再将密码存储在每个人都可以访问的 `/etc/passwd` 文件中——密码现在存储在一个名为
    `/etc/shadow` 的影子密码文件中，该文件只有 root 用户可以访问。


    ![00100.jpeg](img/image00225.jpeg)在 Linux 中，`/etc/passwd` 文件看起来如下所示：


    请注意，第二个字段并没有显示加密密码，而是显示单个字符 `x`。该字段中的 `x` 是你的影子密码，真正的加密![00101.jpeg](img/image00226.jpeg)密码存储在
    `/etc/shadow` 文件中，其内容如下：


    你会发现文件中的字段仍然是用冒号分隔的，其中前两个字段分别代表用户名和加密密码。另一方面，其余字段控制着密码的有效期。这意味着你不需要更改甚至解密存储在此文件中的密码。相反，你可以使用
    `change` 命令更改密码的过期日期。


    作为 root 用户，你可以使用以下![00102.gif](img/image00227.jpeg)命令查看用户的密码过期日期：


    如果你想确保会强制定期更改密码，可以使用 `-M` 设置密码的有效天数。例如，如果你想强制用户 `kdulaney` 每 90![00103.jpeg](img/image00228.jpeg)天更改密码，请使用以下命令（确保你已以
    root 身份登录）：


    ### PAM (可插身份模块)


    Linux 在提高密码安全性方面还使用了另一种功能，即使用 MD5 算法。它的作用是将文档归纳为 128 位的摘要（称为指纹），这样你就可以附加数字签名并使用私钥对其进行加密。虽然
    MD5 以确保文档安全闻名，但同样的原理适用于密码。


    MD5 优于传统密码的另一个优势是你可以使用更长的密码。正如你所知，即使 `/etc/shadow` 文件落入犯罪黑客手中，更长的密码也难以破解。你可以看到此文件中的![00104.jpeg](img/image00229.jpeg)字段采用了
    MD5 加密：


    另一个名为 PAM（pluggable authentication module）的模块使用 MD5 加密密码。在 Linux 中，你可以设置 PAM，以便在运行时切换身份验证方式，而无需更改验证身份所需的程序（如用户名和密码）。


    Linux 中的 PAM 被广泛使用，也被用于系统的其他不同模块。所有涉及 PAM 的配置文件都存储在名为![00105.jpeg](img/image00230.jpeg)`etc/pam.d`
    的目录下。要查看该目录下的文件，请使用以下命令：


    ## 配置默认权限


    当你创建一个新文件时，默认情况下谁可以使用这个文件？你可以通过输入 `umask` 命令来确定答案，它将显示用户文件创建掩码。当你输入此命令时，将看到你所查询的文件创建掩码。如果你是
    root 用户，用户掩码配置为 `22`，而其他人为 `0002`。在以下练习中，你将看到文件创建掩码的工作原理：


    1.  ![00106.gif](img/image00231.jpeg)以 root 用户登录并输入：


    这将创建一个名为 `junkfile` 的空文件。


    2.  输入 `ls -l` 命令来查看权限。你会看到一行类似![00107.jpeg](img/image00232.jpeg)的内容：


    现在，你可以通过转换第一个字段中显示的权限字母来解释权限设置的值。为此，认为第一个字母赋值为 4，第二个赋值为 2，第三个为 1。如果你有权限字母 `rw-`，它翻译为
    `4+2+0`（0 是因为第三字母不可用），等同于 `6`。继续下一个三个字母 `r--`，你得到等同于 `4` 的值。这意味着权限字符串 `-rw--r--`
    等同于 `644`。


    3.  从 `666` 减去你得到的权限设置，以确定 umask 设置。`666-644` 等于 `022`。


    现在，如果你想设置不同的 umask，只需输入 `umask` 命令，然后输入掩码的数值值。你可以这样执行此任务：


    1.  确定新创建文件的权限设置。如果你希望所有新文件仅允许所有者读取和编辑，你需要编写一个显示为 `rw-------` 的权限设置。


    2.  将权限设置转换为对应的数值值。你需要为起始字段分配 4，下一个字段分配 2，第三个分配 1。在本例中，你需要设置一个值为 `600` 的权限设置。


    3.  从 `666` 减去目标权限，得到你想要分配的掩码值。为了实现 `600` 权限设置，通过计算 `666-600` 的结果来得出掩码。你得到值 `066`。


    4.  输入 `umask` 命令，后跟确定的值。


    ![00108.gif](img/image00233.jpeg)要获得你需要的权限设置，请输入此命令：


    注意：022 被设置为默认 umask，因为它翻译为仅允许文档所有者读取和写入功能，而赋予其他人读取权限。这样做的原因是 Linux 假设文件所有者不希望其文件被所有人编辑，以防止潜在风险。


    ## 关注设置用户 ID (User ID) 的权限


