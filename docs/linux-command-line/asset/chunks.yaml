  trans: "\n`myline` 是一个变量。`read` 命令将只读取文件的第一行并放入变量 `myline` 中。`-r` 选项确保该行以原始格式读取。\n\
    \n### 4. 读取文件\n`read` 命令可以与 `while` 循环结合使用逐行读取文件。下文所示：\n\n```bash\nwhile read\
    \ -r myline; do\n    # 对变量 myline 执行某些操作\ndone < file\n```\n\n当 `read` 命令遇到文件结束符（EOF）时，将返回错误代码。此时\
    \ `while` 循环将停止。\n\n注意，我们将 `< file` 放在了末尾。为了避免这种情况，可以将文件内容通过管道传递给 `while` 循环，如下：\n\
    \n```bash\ncat file | while IFS= read -r myline; do\n    # 对变量 myline 执行某些操作\n\
    done\n```\n\n### 5. 读取文件的任意行并赋值给变量\n外部程序可以帮助 bash 读取程序的行。考虑下面的代码：\n\n```bash\n\
    $ read -r rline < <(shuf file)\n```\n\n`shuf` 在现代 Linux 系统上可用，并可以实现此功能。上述代码将读取文件的随机行并将其赋值给变量\
    \ `rline`。\n\n### 6. 提取 tar 归包\n使用以下命令：\n\n```bash\ntar xvf b.tar\n```\n\n###\
    \ 7. 查找两个文件中共同行的数\n```bash\nsort doc1 doc2 | uniq –d\n```\n\n### 8. 随机化文件的行\n\
    ```bash\nshuf filename.txt\n```\n\n### 9. 求特定列的和\n```bash\nawk '{ sum+=$1} END\
    \ {print sum}' document.txt\n```\n\n# 第 10 章. 文件共享命令\n\n在网络环境中工作时，能够在用户和系统之间共享文件非常重要。Linux\
    \ 有多种方法可以在 Linux、Windows 和 Mac 系统之间共享文件。\n\n- FTP\n- SFTP\n- HTTP/HTTPS\n- NFS\n\
    \n## Samba\n\n## FTP\n\nFTP 协议是在互联网或网络上共享文件的一种快速方便的方法，但它非常不安全。FTP 协议以明文传输用户名和密码，这可以被任何能够截获客户端与\
    \ FTP 服务器之间流量的人捕获。由于安全考虑，您应该只使用 FTP 共享不需要加密的文件。\n\n在大多数 Linux 系统上，如果您想通过 FTP 提供文件，将需要安装\
    \ FTP 服务器。如果您必须使用 FTP，请确保安装 FTP 服务端软件的服务器没有在网络中执行任何关键功能。您也不应该在内部网络上放置允许来自外部网络或互联网连接的\
    \ FTP 服务器。如果您需要与互联网共享文件，您的 FTP 服务器应该位于防火墙的非军事化区（DMZ）。\n\n### 在 Ubuntu 和 Debian\
    \ 上安装 FTP 服务器\n在 Ubuntu 和 Debian 上安装 FTP 服务器，可以使用 `apt-get install` 命令。\n\n```bash\n\
    sudo apt-get install vsftpd\n```\n\nUbuntu 和 Debian 会配置并启用 `vstfpd` 服务，并在安装过程中自动启动该服务。\n\
    \n### 在 Fedora 上安装 FTP 服务器\n在 Fedora 上安装 FTP 服务器，可以使用 `dnf install` 命令。当有多个版本可用时，`--best`\
    \ 选项告诉 Fedora 安装与系统最匹配的软件版本。\n\n```bash\nsudo dnf install vsftpd --best\n```\n\
    \nFedora 安装了 `vsftpd` 服务器但不会自动启动服务。使用 `systemctl` 命令启动并启用 `vsftpd` 服务器以便在开机时启动。\n\
    \n```bash\nsudo systemctl start vsftpd\nsudo systemctl enable vsftpd\n```\n\n\
    ### 防火墙\n\n如果您的 Linux 系统安装并运行了基于主机的防火墙，那么您必须开放 FTP 入站端口 TCP 端口 21，以允许传入连接。在 Linux\
    \ 系统上运行 FTP 这种不安全的协议存在安全风险，因此在防火墙上开放端口之前，请确保系统已正确配置并放置在网络中。\n\n本节将涵盖以下子章节：\n\n\
    - Ubuntu 和 Debian\n- Fedora\n\n#### Ubuntu 和 Debian\nUbuntu 和 Debian 使用 Uncomplicated\
    \ Firewall (`UFW`) 来控制基础防火墙配置，但防火墙默认是不配置的。使用以下命令打开 TCP 端口 21：\n\n```bash\nsudo\
    \ ufw allow in ftp\n```\n\n#### Fedora \nFedora 使用 `firewalld` 控制基础防火墙配置，且防火墙默认已配置好。使用以下命令打开\
    \ TCP 端口 21：\n\n```bash\nfirewall-cmd --permanent --add-port=21/tcp\nfirewall-cmd\
    \ --reload\n```\n\n### FTP 客户端\n为了连接到 FTP 服务器，您需要一个 FTP 客户端。Ubuntu 和 Debian 已经自带了它。Fedora\
    \ 没有，所以您必须使用 `dnf install` 命令安装。\n\n```bash\nsudo dnf install ftp\n```\n\n本节将涵盖以下子章节：\n\
    - 连接到服务器\n- 被动模式\n- 帮助\n- 列出远程文件\n- 列出本地文件\n- 当前远程目录\n- 当前本地目录\n- 更改远程目录\n- 更改本地目录\n\
    \n#### 连接到服务器\n连接到 FTP 服务器，使用 `ftp` 命令后跟 IP 地址或主机名。如下：\n\n```bash\nftp 192.168.1.1\n\
    ```\n\n系统将被要求输入用户名和密码以访问服务器。默认情况下，`ftp` 使用当前用户，除非您指定特定用户。\n\n您可以在 `ftp` 程序内部通过\
    \ `open` 命令连接到服务器，如下：\n\n```bash\nopen 10.0.0.1\n```\n\n如果让 `ftp` 连接保持过久，将会与服务器断，可能需要重新连接。\n\
    \n#### 被动模式\nFTP 协议可以在两种模式运行：主动或被动。主动模式使用两个 TCP 端口 20 和 21，而被动模式仅使用 TCP 端口 21。大多数服务器现在运行被动模式，但大多数\
    \ FTP 客户端默认使用主动模式。要确保使用正确的模式，可以使用 `passive` 命令将 FTP 客户端设置为被动模式，如下：\n\n```bash\n\
    passive\n```\n\n#### 帮助\nFTP 客户端带有一个帮助菜单，可以通过输入 `?` 或 `help` 访问。可以通过 `help` 命令后跟特定命令来获取帮助，如下：\n\
    \n```bash\nhelp get\n```\n\n#### 列出远程文件\n使用 `dir` 或 `ls` 命令可以获取远程系统的文件和目录列表，如下：\n\
    \n```bash\nls\n```\n\n#### 列出本地文件\n在 `dir` 或 `ls` 命令前加上 `!` 字符可以获取本地系统的文件和目录列表，如下：\n\
    \n```bash\n!ls\n```\n\n#### 当前远程目录\n使用 `pwd` 命令可以查看当前远程目录，如下：\n\n```bash\npwd\n\
    ```\n\n#### 当前本地目录\n使用 `!pwd` 命令可以查看当前本地目录，如下：\n\n```bash\n!pwd\n```\n\n#### 更改远程目录\n\
    使用 `cd` 命令可以更改远程目录。在示例中，`pwd` 命令用于检查远程目录，`ls` 命令用于查看远程目录，`cd` 命令用于切换到 Documents\
    \ 目录。\n\n```bash\ncd Documents\n```\n\n#### 更改本地目录\n使用 `!cd` 命令更改本地目录。\n\n```bash\n\
    !cd Downloads\n```\n\n"
- fmt: "\nYou can change the local directory by using the `lcd` command. In the example\
    \ below, the `!pwd` command is used to check the remote directory and the `lcd`\
    \ command is used to change to the Documents directory.\n\n![](Images/image00205.jpeg)\
    \ \n\n## Get Files \n\nTo get or download a file from an FTP server you can use\
    \ the `get` command followed by the filename. In the example below the `!ls` command\
    \ is used to view the local directory, the `ls` command is used to view the remote\
    \ directory, the `mget` command is used to get the `myfile4` file, and the `!ls`\
    \ command is used to view the local directory and verify that the file download\
    \ occurred. \n\n![](Images/image00206.jpeg) \n\nTo get or download multiple files\
    \ from an FTP server you can use the `mget` command followed by the filename as\
    \ in the example below.\n\n![](Images/image00207.jpeg)\n\n## Put Files\n\nTo put\
    \ or upload a file to an FTP server you can use the `put` command followed the\
    \ filename. By default, `vsftpd` is configured not to allow writing to the FTP\
    \ server as in the example below.\n\n![](Images/image00208.jpeg) \n\nTo enable\
    \ writing to the FTP server you must edit the `vsftpd.conf` file and remove the\
    \ `#` character in front of the `write_enable=YES` line and save the file. Ubuntu\
    \ and Debian put the `vsftpd.conf` file in the `/etc/` directory and Fedora puts\
    \ the file in the `/etc/vsftpd` directory.\n\n![00133.jpeg](Images/image00209.jpeg)\n\
    \nYou will need to restart the vsftpd server.\n\n```bash\nsudo systemctl restart\
    \ vsftpd\n```\n\nOnce the server has restarted you will be able to use the `put`\
    \ command to upload the file as in the example below.\n\n![00134.jpeg](Images/image00210.jpeg)\n\
    \nTo upload multiple files to an FTP server you can use the `mput` command followed\
    \ by the filename and a wildcard as in the example below.\n\n![00135.jpeg](Images/image00211.jpeg)\n\
    \n## Exit FTP\n\nTo exit the ftp program just use the `exit` command.\n\n## SFTP\n\
    \nSince FTP is an insecure it is not recommended for secure file transfers. To\
    \ securely transfer files, you can use the SFTP protocol which uses the SSH protocol\
    \ on TCP port `22` to transfer files.\n\nYou can use the `sftp` command just like\
    \ you would use the `ftp` command as in the example below.\n\n![00136.jpeg](Images/image00212.jpeg)\n\
    \n## HTTP/HTTPS\n\nYou can share files using the HTTP and HTTPS protocols. Files\
    \ placed on a web server for download can be downloaded from the CLI using the\
    \ `wget` command followed by the URL as in the example below.\n\n![00137.jpeg](Images/image00213.jpeg)\n\
    \nThe `wget` command will append a `.` and a number to the end of the filename\
    \ if a file with the same name already exists in the directory the file is being\
    \ downloaded into.\n\n## NFS\n\nThe Network File System (NFS) allows files and\
    \ directories to be shared across the network between Linux systems. The NFS server\
    \ hosts directories that can be mounted by the NFS client on a remote system.\n\
    \n### Ubuntu and Debian Server\n\nTo install the NFS server on Ubuntu and Debian\
    \ use the `apt-get install` command.\n\n```bash\nsudo apt-get install nfs-kernel-server\n\
    ```\n\n### Fedora Server  \n\nTo install the NFS server on Fedora use the `dnf\
    \ install` command.\n\n```bash\nsudo dnf install nfs-utils --best\n```\n\n###\
    \ Firewalls\n\nIf your Linux system has a host based firewall installed and running\
    \ then you will have to open up the port for NFS, TCP and UDP port `2049`, inbound\
    \ in order to allow incoming connections. There are security risks with running\
    \ any protocol such as NFS on a Linux system so make sure that you have the system\
    \ properly configured and placed in the network before opening up a port on the\
    \ firewall.\n\nThe following subsections will be covered in this section:\n\n\
    - Ubuntu and Debian\n- Fedora\n- `/etc/exports`\n\n#### Ubuntu and Debian\n\n\
    Ubuntu and Debian use the Uncomplicated Firewall (UFW) to control basic firewall\
    \ configurations, however the firewall is not configured by default. To open TCP\
    \ and UDP port `2049` using the following command:\n\n```bash\nsudo ufw allow\
    \ in nfs\n```\n\n#### Fedora\n\nFedora uses firewalld to control basic firewall\
    \ configurations and the firewall is configured by default. To open TCP and UDP\
    \ port `2049` using the following commands:\n\n```bash\nfirewall-cmd --permanent\
    \ --add-service=nfs\nfirewall-cmd --reload\n```\n\n#### /etc/exports\n\nFollowing\
    \ the installation of the server the `/etc/exports` file needs to be edited to\
    \ add directories that you want to make available via NFS.\n\n```bash\nsudo vi\
    \ /etc/exports\n```\n\nThe syntax for entries in the exports file are as follows:\n\
    \n`directoryhosts(options)`\n\n- `directory` is the local directory that you want\
    \ to share.\n- `hosts` are hosts that should be allowed to access the share. You\
    \ can use an IP address, network ID, hostname, or `*` which means all hosts.\n\
    - The `options` control the permissions for the share. The following are the common\
    \ options:\n  - `ro` - Read only access\n  - `rw` - Read and write access\n  -\
    \ `no_root_squash` - Allows the root user from the client to have root permission\
    \ on the server.\n  - `no_subtree_check` - disables the verifications of directory\
    \ subtrees if an entire volume is shared to speed up access time.\n  - `sync`\
    \ - Prevents data corruption\n\nThe following are examples of shares in the `/etc/exports`\
    \ file:\n\nShare the `/home` directory with any IP address and provide Read and\
    \ Write permissions:\n`/home *(rw)`\n\nShare the `/home` directory with IP address\
    \ 192.168.1.3 and provide Read only permissions:\n`/home 192.168.1.3(ro)`\n\n\
    Share the `/home` directory with IP address 19.168.1.3 (Read and Write) and 192.168.1.4\
    \ (Read Only) and allows root to have permissions:\n`/home 192.168.1.3(rw,no_root_squash)\
    \ 192.168.1.4(ro,no_root_squash)`\n\nOnce you edit the `/etc/exports` file you\
    \ must restart the nfs service:\n\nFor Ubuntu and Debian:\n```bash\nsudo systemctl\
    \ restart nfs-kernel-server.service\n```\n\nFor Fedora:\n```bash\nsudo systemctl\
    \ restart nfs-server.service\n```\n\n### NFS Client\n\nIn order to connect from\
    \ a Linux system to an NFS server the system must have an NFS client and the user\
    \ using the client must have a matching username and password on the server.\n\
    \n#### Ubuntu and Debian\n\nTo install the NFS client on Ubuntu and Debian use\
    \ the `apt-get install` command.\n\n```bash\nsudo apt-get install nfs-common\n\
    ```\n\n#### Fedora\n\nTo install the NFS client on Fedora use `dnf install` command.\n\
    \n```bash\nsudo dnf install nfs-utils --best\n```\n\n#### mount\n\nIn order to\
    \ access NFS shares on an NFS server you must mount the share to a local directory\
    \ that is empty. To make an empty directory use the `mkdir` command:\n\n```bash\n\
    mkdir ~/mydir\n```\n\nTo mount the share in the empty directory, use the `mount`\
    \ command. The syntax is as follows:\n\n```bash\nsudo mount ip_address:share_name\
    \ local_directory\n```\n\nIn the example below the `mount` command is used to\
    \ mount the `/home` folder on the NFS server with the IP address `192.168.56.163`\
    \ and mount it in the local folder `myfolder`.\n\n![00138.jpeg](Images/image00214.jpeg)\n\
    \nTo mount the share automatically during boot add the share information to the\
    \ `/etc/fstab` file:\n\n```\n192.168.56.163:/home ~/myfoldernfsrw00\n```\n"
  raw: 'You can change the local directory by using the lcd command.   In the example
    below, the !pwd command is used to check the remote directory and the lcd command
    is used to change to the Documents directory.


    ![](Images/image00205.jpeg) 


    Get Files 


    To get or download a file from an FTP server you can use the get command followed
    by the filename.  In the example below, the !ls command is used to view the local
    directory, the ls command is used to view the remote directory, the mget command
    is used to get the myfile4 file, and the !ls command is used to view the local
    directory and verify that the file download occurred. 


    ![](Images/image00206.jpeg) 


    To get or download multiple files from an FTP server you can use the mget command
    followed by the filename as in the example below.


    ![](Images/image00207.jpeg)


    Put Files


    To put or upload a file to an FTP server you can use the put command followed
    the filename.  By default, vsftpd is configured not to allow writing to the FTP
    server as in the example below.


    ![](Images/image00208.jpeg) 


    To enable writing to the FTP server you must edit the vsftpd.conf file and remove
    the # character in front of the write_enable=YES line and save the file.  Ubuntu
    and Debian put the vsftpd.conf file in the /etc/ directory and Fedora puts the
    file in the /etc/vsftpd directory.


    ![00133.jpeg](Images/image00209.jpeg)


    You will need to restart the vsftpd server.


    sudo systemctl restart vsftpd


    Once the server has restarted you will be able to use the put command to upload
    the file as in the example below.


    ![00134.jpeg](Images/image00210.jpeg)


    To upload multiple files to an FTP server you can use the mput command followed
    by the filename and a wildcard as in the example below.


    ![00135.jpeg](Images/image00211.jpeg)


    Exit FTP


    To exit the ftp program just use the exit command.


    SFTP


    Since FTP is an insecure it is not recommended for secure file transfers.  To
    securely transfer files, you can use the SFTP protocol which uses the SSH protocol
    on TCP port 22 to transfer files.


    You can use the sftp command just like you would use the ftp command as in the
    example below.


    ![00136.jpeg](Images/image00212.jpeg)


    HTTP/HTTPS


    You can share files using the HTTP and HTTPS protocols.  Files placed on a web
    server for download can be downloaded from the CLI using the wget command followed
    by the URL as in the example below.


    ![00137.jpeg](Images/image00213.jpeg)


    The wget command will append a . and a number to the end of the filename if a
    file with the same name already exists in the directory the file is being downloaded
    into.


    NFS


    The Network File System (NFS) allows files and directories to be shared across
    the network between Linux systems.  The NFS server hosts directories that can
    be mounted by the NFS client on a remote system.


    [Ubuntu and Debian Server](#part0000.xhtml__p643lhdlwjst)


    [Fedora Server](#part0000.xhtml__vahrzj5yk8zz)


    [Firewalls](#part0000.xhtml__ym0r6ckb6ns3)


    [/etc/exports](#part0000.xhtml__3o9eofvo7cgc)


    [NFS Client](#part0000.xhtml__31m1k6qnf8ot)


    ### Ubuntu and Debian Server  


    To install the NFS server on Ubuntu and Debian use the apt-get install command.


    sudo apt-get install nfs-kernel-server


    ### Fedora Server   


    To install the NFS server on Fedora use the dnf install command.


    sudo dnf install nfs-utils --best


    ### Firewalls   


    If your Linux system has a host based firewall installed and running then you
    will have to open up the port for NFS, TCP and UDP port 2049, inbound in order
    to allow incoming connections.  There are security risks with running any protocol
    such as NFS on a Linux system so make sure that you have the system properly configured
    and placed in the network before opening up a port on the firewall.


    The following subsections will be covered in this section:


    [Ubuntu and Debian](#part0000.xhtml__s9m6b592ukpv)


    [Fedora](#part0000.xhtml__q3bwkk6te9q3)


    Ubuntu and Debian


    Ubuntu and Debian use the Uncomplicated Firewall (UFW) to control basic firewall
    configurations, however the firewall is not configured by default.  To open TCP
    and UDP port 2049 using the following command:


    sudo ufw allow in nfs


    Fedora 


    Fedora uses firewalld to control basic firewall configurations and the firewall
    is configured by default.  To open TCP and UDP port 2049 using the following commands:


    firewall-cmd --permanent --add-service=nfs


    firewall-cmd --reload


    ### /etc/exports   


    Following the installation of the server the /etc/exports file needs to be edited
    to add directories that you want to make available via NFS.


    sudo vi /etc/exports


    The syntax for entries in the exports file are as follows:


    directoryhosts(options)


    The directory is the local directory that you want to share.


    The hosts are hosts that should be allowed to access the share.  You can use an
    IP address, network ID, hostname, or * which means all hosts.


    The options control the permissions for the share.  The following are the common
    options:


    ro - Read only access


    rw - Read and write access


    no_root_squash - Allows the root user from the client to have root permission
    on the server.


    no_subtree_check - disables the verifications of directory subtrees if an entire
    volume is shared to speed up access time.


    sync - Prevents data corruption


    The following are examples of shares in the /etc/exports file:


    Share the /home directory with any IP address and provide Read and Write permissions:


    /home  *(rw)


    Share the /home directory with IP address 192.168.1.3 and provide Read only permissions:


    /home  192.168.1.3(ro)


    Share the /home directory with IP address 19.168.1.3 (Read and Write) and 192.168.1.4
    (Read Only) and allows root to have permissions:


    /home  192.168.1.3(rw,no_root_squash) 192.168.1.4(ro,no_root_squash)


    Once you edit the /etc/exports file you must restart the nfs service:


    For Ubuntu and Debian:


    sudo systemctl restart nfs-kernel-server.service


    For Fedora:


    sudo systemctl restart nfs-server.service


    ### NFS Client


    In order to connect from a Linux system to an NFS server the system must have
    an NFS client and the user using the client must have a matching username and
    password on the server.


    [Ubuntu and Debian](#part0000.xhtml__kcg5pil5a99u)


    [Fedora](#part0000.xhtml__pyyi0nxizlk3)


    [mount](#part0000.xhtml__aat8zd85o81r)


    Ubuntu and Debian


    To install the NFS client on Ubuntu and Debian use the apt-get install command.


    sudo apt-get install nfs-common


    Fedora


    To install the NFS client on Fedora use dnf install command.


    sudo dnf install nfs-utils --best


    mount


    In order to access NFS shares on an NFS server you must mount the share to a local
    directory that is empty.


    To make an empty directory use the mkdir command:


    mkdir ~/mydir


    To mount the share in the empty directory, use the mount command .  The syntax
    is as follows:


    sudo mount ip_address:share_name local_directory


    In the example below the mount command is used to mount the /home folder on the
    NFS server with the IP address 192.168.56.163 and mount it in the local folder
    myfolder.


    ![00138.jpeg](Images/image00214.jpeg)


    To mount the share automatically during boot add the share information to the
    /etc/fstab file:


    192.168.56.163:/home ~/myfoldernfsrw00


    Samba


    The Samba service allows files and directories to be shared across the network
    between Linux, Unix, Mac, and Windows systems.  The Samba server hosts directories
    that can be accessed and mounted by a Samba client on a remote system. Samba uses
    the Server Message Block (SMB) Protocol.


    [Ubuntu and Debian Server](#part0000.xhtml__r8x2nghh5jfw)


    [Fedora Server](#part0000.xhtml__zdc0ss9snqy0)


    [Firewalls](#part0000.xhtml__10vwfgr4y5nr)


    [Configure a Samba Password](#part0000.xhtml__n6azq0rr9xdd)


    [Edit /etc/samba/smb.conf](#part0000.xhtml__hc0zqt5dnnqo)


    [Connecting to a Samba Server](#part0000.xhtml__cmnj1658sa9l)


    [Linux](#part0000.xhtml__oawf115zyzwy)


    [Windows](#part0000.xhtml__rfqm994di3qv)


    ### Ubuntu and Debian Server  '
