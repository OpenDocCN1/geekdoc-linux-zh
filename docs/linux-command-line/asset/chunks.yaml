- fmt: "\nTo see the status of an individual service, a service name can be specified\
    \ as demonstrated in the next example.\n\n# svcs\n\n```\nsvcs apache\nSTATE STIME\
    \ FMRI\nlegacy_run 19:42:17 lrc:/etc/rc3_d/S50apache\n```\n\nListing the status\
    \ of an individual service using the `svcs` command.\n\n## Common usage examples\
    \ for `svcs`\n\n- `svcs`: Display all active-services.\n- `svcs -a`: Display all\
    \ services.\n- `svcs [SERVICE]`: Display the specified service.\n- `svcs -d [SERVICE]`:\
    \ Display the specified service's dependencies.\n- `svcs -D [SERVICE]`: Display\
    \ services that depend on the specified service.\n- `svcs -l [SERVICE]`: Display\
    \ detailed information about the specified service.\n\n# svcadm\n\n**Purpose**:\
    \ Start/stop services on Solaris systems.\n\n**Usage syntax**: `svcadm [OPTIONS]\
    \ [SERVICE]`\n\n## svcadm enable sendmail\n\n```bash\nsvcadm enable sendmail\n\
    svcs sendmail\nSTATE STIME FMRI\nonline 14:26:14 svc:/network/smtp:sendmail\n\
    ```\n\nStarting a service with the `svcadm` command. The `svcadm` command controls\
    \ services on Solaris systems. It can be used to start, stop, and restart services.\
    \ In the above example, the `enable` parameter is used to start the `sendmail`\
    \ service. The next example demonstrates using the `disable` parameter to stop\
    \ the `sendmail` service.\n\n# svcadm disable sendmail\n\n```bash\nsvcadm disable\
    \ sendmail\nsvcs sendmail\nSTATE STIME FMRI\ndisabled 14:27:51 svc:/network/smtp:sendmail\n\
    ```\n\nStopping a service with the `svcadm` command. To restart a service, use\
    \ the `restart` parameter as demonstrated in the next example.\n\n# svcadm restart\
    \ sendmail\n\n```bash\nsvcadm restart sendmail\n```\n\nRestarting a service with\
    \ the `svcadm` command.\n\n## Common usage examples for `svcadm`\n\n- `svcadm\
    \ enable [SERVICE]`: Start the specified service.\n- `svcadm disable [SERVICE]`:\
    \ Stop the specified service.\n- `svcadm restart [SERVICE]`: Restart the specified\
    \ service.\n\n# Chapter 7. Linux shell programming\n\nIn Linux, it is very easy\
    \ to create shell scripts. With shell programming, we can group multiple commands\
    \ in a chain and then execute them to obtain the desired output. Let’s begin by\
    \ writing out first script. Open your editor of choice; I am using the `vi` editor.\
    \ Add the following shell program to the file:\n\n```bash\n#!/bin/bash\necho \"\
    Hello World\"\n```\n\nThe above is an example of a shell program. Save the file\
    \ and give it the name `hello.sh`. Note that we have used the `.sh` extension\
    \ to imply that it is a shell program. Now, the next step is to make the script\
    \ executable. This can be achieved as follows:\n\nOpen the command prompt and\
    \ type the following command:\n\n```bash\nchmod 744 hello.sh\n```\n\nAfter running\
    \ the above command, an executable of the file `hello.sh` will be created; `chmod`\
    \ stands for change mode. `744` refers to the permissions and we have used this\
    \ to add an execute permission to the file. Since we have made the program executable,\
    \ we now need to execute it.\n\nThis can be achieved by running the following\
    \ command on the terminal:\n\n```bash\n./hello.sh\n```\n\nAfter running the above\
    \ command, the following output will be observed on the standard output:\n\n![](Images/image00190.jpeg)\n\
    \nThe command outputs a text saying “Hello World”. Remember that this is the text\
    \ that we command the `echo` command to output.\n\n`#!/bin/bash` is called the\
    \ shebang and is used to precede shell programs.\n\nTo add comments to your program,\
    \ precede them with a pound sign (`#`).\n\nConsider the shell program shown below:\n\
    \n```bash\n#! /bin/bash\necho \"Hey $USER\"\necho \"Hello, i am\" $USER \"The\
    \ following are the processes running currently\"\necho \"List of running processes:\"\
    \nps\n```\n\nYou can write and run the program. The following output will be observed\
    \ after running the program:\n\n![](Images/image00191.jpeg)\n\nAs shown in the\
    \ above figure, the program outputs your name. It also shows the list of processes\
    \ that are currently running on your system.\n\nNow, let’s write a more interactive\
    \ program. Write the code shown below and run it:\n\n```bash\n#! /bin/bash\necho\
    \ \"Enter your name\"\nread name;\necho \"welcome Mr. /Mrs. $name \";\necho \"\
    Thanks Mr./Mrs. $name. You have provided us with your names\"\necho \"-----------------------------------------------------------------\"\
    \necho \"Mr. /Mrs. $name, good bye friend\"\n```\n\nAfter running the above program,\
    \ the following output will be observed:\n\n![](Images/image00192.jpeg)\n\nAs\
    \ you can see, you are prompted to provide your name. This has been achieved by\
    \ use of the `read` command, which prompts users to provide their input. This\
    \ input has then been displayed alongside some other text.\n\n## Variables in\
    \ Shell\n\nThe two types of shell variables are:\n\n1. **System variables**: these\
    \ are created and maintained by the OS. They are defined in upper case letters.\n\
    2. **User Defined Variables**: the user creates and maintains these. They are\
    \ defined in lower case letters.\n\nThe following are some of the system variables\
    \ in shell:\n\n- `BASH`: the shell name.\n- `HOME`: our home directory.\n- `LOGNAME`:\
    \ our login name.\n- `PATH`: our setting for the path.\n- `USERNAME`: the currently\
    \ logged in user.\n- `COLUMNS`: number of columns making up our screen.\n- `OSTYPE`:\
    \ the type of the OS we are running.\n- `PWD`: the current working directory.\n\
    \nThe above shows only a sample of the system variables. If you want to print\
    \ any of the above variables, use the `echo` and the `$` sign command as shown\
    \ below:\n\n```bash\necho $HOME\necho $PWD\n```\n\nThe next section explains how\
    \ to work with user variables. Use the following syntax to define a user variable:\n\
    \n```bash\nname=value\n```\n\n`name` refers to the name. The value is what it\
    \ is, usually a number or string.\n\n### Tips for naming variables\n\n1. There\
    \ shouldn’t be any spaces on either side of the equal sign: `num =12` is wrong.\n\
    2. The name should begin with an underscore or alphanumeric character (not digit).\n\
    3. Names are case sensitive. Example: `Num=9`.\n4. To print a variable, use `$name`.\n\
    5. Some characters are not allowed in variable names, like the asterisk (`*`).\n\
    \n## Loops in Shell\n\nThe `for` loop:\n\n```bash\nfor item in list\ndo\n    #\
    \ instructions\ndone\n```\n\nThe `while` loop:\n\n```bash\nwhile condition\ndo\n\
    \    # instructions\ndone\n```\nAs long as the condition is true, the loop will\
    \ execute.\n\n## Case statement\n\nThis is also common in Linux. It takes the\
    \ following syntax:\n\n```bash\ncase $name_of_variable in\n  pattern1)\n    command\n\
    \    ;;\n  pattern2)\n    command\n    ;;\nesac\n```\n"
