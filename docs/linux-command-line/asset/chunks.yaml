    ## Running Processes in the Foreground and Background


    Up until this point all the commands you have been executing have been running
    in the foreground. When a command, process, or program is running in the foreground
    the shell prompt will not be displayed until that process exits. For long running
    programs it can be convenient to send them to the background. Processes that are
    backgrounded still execute and perform their task, however they do not block you
    from entering further commands at the shell prompt. To background a process, place
    an ampersand (`&`) at the end of the command.


    - `command &` - Start command in the background.

    - `Ctrl-c` - Kill the foreground process.

    - `Ctrl-z` - Suspend the foreground process.

    - `bg [%num]` - Background a suspended process.

    - `fg [%num]` - Foreground a background process.

    - `kill [%num]` - Kill a process by job number or PID.

    - `jobs [%num]` - List jobs.


    ```bash

    $ ./long-running-program &

    [1] 22686


    $ ps -p 22686

    PID TTY           TIME CMD

    22686 pts/1     00:00:00 long-running-pr


    $ jobs

    [1]+  Running  ./long-running-program &


    $ fg

    ./long-running-program

    ```


    When a command is backgrounded two numbers are displayed. The number in brackets
    is the job number and can be referred by preceding it with the percent sign. The
    second number is the PID. Here is what it looks like to start multiple processes
    in the background.


    ```bash

    $ ./long-running-program &

    [1] 22703


    $ ./long-running-program &

    [2] 22705


    $ ./long-running-program &

    [3] 22707


    $ ./long-running-program &

    [4] 22709


    $ jobs

    [1]    Done      ./long-running-program

    [2]    Done      ./long-running-program

    [3]-  Running  ./long-running-program &

    [4]+  Running  ./long-running-program &

    ```


    The plus sign (`+`) in `jobs` output represents the current job while the minus
    sign (`-`) represents the previous job. The current job is considered to be the
    last job that was stopped while it was in the foreground or the last job started
    in the background. The current job can be referred by `%%` or `%+`. If no job
    is supplied to `fg` or `bg`, the current job is operated upon. The previous job
    can be referred by `%-`. You will notice that jobs number 1 and 2 are reported
    as done. The shell does not interrupt your command line, but report job statuses
    before a new prompt is displayed. For example, if you start a program in the background
    a prompt is returned. The shell will not report the status of the job until a
    new prompt is displayed. You can request a new prompt be displayed by simply hitting
    Enter. To bring a job back to the foreground, type the name of the job or use
    `fg`. To foreground the current job execute `%%`, `%+`, `fg %%`, `fg %+`, or `fg
    %num`. To foreground job number 3, execute `%3` or `fg %3`.


    ```bash

    $ jobs

    [3]-  Running  ./long-running-program &

    [4]+  Running  ./long-running-program &


    $ fg %3

    ./long-running-program

    ```


    To pause or suspend a job that is running in the foreground, type `Ctrl-z`. Once
    a job is suspended it can be resumed in the foreground or background. To background
    a suspended job type the name of the job followed by an ampersand or use `bg`
    by the job name.


    ```bash

    $ jobs

    [1]  Running  ./long-running-program &

    [2]-  Running  ./long-running-program &

    [3]+  Running  ./another-program &


    $ fg

    ./another-program

    ^Z

    [3]+  Stopped  ./another-program


    $ jobs

    [1]  Running  ./long-running-program &

    [2]-  Running  ./long-running-program &

    [3]+  Stopped  ./another-program


    $ bg %3

    [3]+ ./another-program &


    $ jobs

    [1]  Running  ./long-running-program &

    [2]-  Running  ./long-running-program &

    [3]+  Running  ./another-program &

    ```


    You can stop or kill a background job using the `kill` command. For example, to
    kill job number 1 execute `kill %1`. To kill a job that is running in the foreground,
    type `Ctrl-c`.


    ```bash

    $ jobs

    [1]  Running  ./long-running-program &

    [2]-  Running  ./long-running-program &

    [3]+  Running  ./another-program &


    $ kill %1

    [1]  Terminated  ./long-running-program


    $ jobs

    [2]-  Running  ./long-running-program &

    [3]+  Running  ./another-program &


    $ fg %2

    ./long-running-program

    ^C

    $ jobs

    [3]+  Running  ./another-program &

    ```


    ## Killing Processes


    - `Ctrl-c` - Kills the foreground process.

    - `kill [signal] pid` - Send a signal to a process.

    - `kill -l` - Display a list of signals.


    The default signal used by `kill` is termination. You will see this signal referred
    to as `SIGTERM` or `TERM` for short. Signals have numbers that correspond to their
    names. The default `TERM` signal is number 15. So running `kill pid`, `kill -15
    pid`, and `kill -TERM pid` are all equivalent. If a process does not terminate
    when you send it the `TERM` signal, use the `KILL` signal which is number 9.


    ```bash

    $ ps | grep hard-to-stop

    27398 pts/1     00:00:00 hard-to-stop


    $ kill 27398

    $ ps | grep hard-to-stop

    27398 pts/1     00:00:00 hard-to-stop


    $ kill -9 27398

    $ ps | grep hard-to-stop

    ```


    # Chapter 16. Making Linux More Secure


    There are a lot of reasons that you need to protect your computer from other users,
    but the bottom line is that you do not want any user to delete or modify your
    system files. If you are handling a network of computers, you also do not want
    any user to inadvertently or purposely change anything in their system that may
    cause the entire system to be compromised.


    As there is also a good chance that you will be connecting your Linux computer
    to the internet, you will need to ensure that you are always able to establish
    a secure connection and that you have done all the steps to protect your computer
    from unwanted access. In this chapter, you will learn how to create layers of
    security in order to prevent other users from denying you access to your computer,
    stealing information, or destroying your data.

