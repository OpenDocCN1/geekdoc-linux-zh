    One nice feature of working with the terminal emulator application in the GUI
    is the ability to open multiple terminal windows. There are several advantages
    to running multiple terminal windows – if you run a command that displays real-time
    output (like the `top` monitoring command), you can open a new window to execute
    additional commands. Or if you''re running a command that take a long time to
    process, like copying several gigabytes of files, you can open a new window and
    run another command while the first one finishes working.


    Most terminal emulator applications support opening a new terminal window. To
    do so, you usually go to the File menu and select either `New Window` or `New
    Terminal`. A new terminal window will open up.


    If you don''t want to clutter up your desktop with a bunch of windows, most terminal
    applications now offer tabs, much as the Mozilla Firefox and Google Chrome web
    browsers allow you to open new tabs for different web pages. If you open new tabs
    in the terminal emulator, a row of tabs will appear below the menu bar, each containing
    a separate terminal session. Usually, you can open new tabs by going to the File
    menu and clicking on `New Tab`.


    Obviously a graphical terminal application will not work in the command-line environment.
    It is nonetheless possible to run multiple terminal windows from the command line
    using virtual consoles, which we will discuss in the next session.


    ## VIRTUAL CONSOLES


    A virtual console is, essentially, a second connection to the same computer. Remember
    that Linux was based upon UNIX, and most early UNIX machines were massive mainframe
    computers. To connect to those mainframes, users employed remote consoles or dumb
    terminals. Because UNIX was a multi-user operating system, multiple users could
    log into the mainframe at the same time from different consoles.


    Virtual consoles are a legacy of those mainframes. Most Linux versions support
    a maximum of seven virtual consoles, software consoles built into the operating
    system that mimic the function of those old dumb terminals. Basically, a user
    can log into the operating system using one of those virtual consoles, and then
    a second user could switch to a different virtual console and log in, leaving
    the first user''s session unaffected (though they would, of course, have to share
    the keyboard and mouse).


    As we mentioned, Linux supports seven virtual consoles. To switch between virtual
    consoles, press the `CTRL-ALT-FUNCTION#` keys simultaneously. So to switch to
    virtual console one, you would hit `CTRL-ALT-F1`, to switch to virtual console
    2, `CTRL-ALT-F2`, and so forth. When you switch to a new virtual console, you''ll
    see a standard prompt to log in. You (or another user) can then log into the virtual
    console without affecting your original session.


    If you have a version of Linux running a GUI, you can also use virtual consoles.
    By default, the GUI runs in virtual console seven (`CTRL-ALT-F7`). You can switch
    to any of the other six virtual consoles. When you are finished, you can return
    to the GUI by hitting `CTRL-ALT-F7`.


    # Chapter 4. More to know about Files


    Am sure that you are eager and keen to get stuck into more commands and begin
    doing some actual playing around with the system. We need to cover some theories
    first before we get into that. When you begin to play around with the system you
    are able to understand why it is behaving in such a way and you can also be able
    to learn the commands further.


    ## Everything is a file


    The first thing that we need to know is that everything is a file. For example,
    a text file is a file, your keyboard is a file, a directory is a file and even
    a monitor is a file.


    ## Linux is an Extensionless System


    A file extension is usually a set of 2 – 4 characters subsequent to the end of
    a file, which determines the type of file it is.


    Common extension includes:


    - `File.exe` – an executable program or file,

    - `File.txt` – a plain text file.

    - `File [path]`


    ## Case Sensitivity


    Many people who are new to learning Linux struggle with one specific problem -
    while many other systems, such as Windows, don’t pay attention to the case of
    a character in file reference, Linux does. Thanks to this feature, it’s possible
    to have multiple files or directors than have the same name, but letters in different
    cases.


    Is Docs


    `MYFILE1.txt` `Myfile1.txt` `myfile1.TXT`


    `file Docs/myfile1.txt`


    `Docs/myfile1.txt: ERROR: cannot open ‘fil1.txt’ (No such file or directory)`


    In Linux, all of these are interpreted as completely separate files.


    It’s important to be aware of case sensitivity while working with command line
    options. For example, in the command line the two options `s` and `S` perform
    completely different actions - it’s common to read an option in upper case, enter
    it in lower case, and then wonder why your input doesn’t return the expected output.


    ## Name Spaces


    While it is possible to incorporate spaces in perfectly valid file and directory
    names, it’s important to be careful with them. Spaces in a command line signify
    separate items - that’s how we can know what a program name is and identify each
    argument in the command line. For example, if the goal were to move into a director
    called ‘My Photos,’ the following command would not work properly:


    Is Docs


    `MYFILE1.txt` `Myfile1.txt` `myfile1.TXT` `My Photos`


    `cd My Photos`


    `bash: cd: Happyday: No such file or directory`


    In this example, ‘My Photos’ is interpreted as two separate arguments in the command
    line. The first argument specifies the directory into which `cd` moves. In order
    to make this work properly, you can use one of two valid options.


    ### Quotation Marks


    First, you can surround an entire item with quotation marks. Single or double
    quotation marks are both acceptable, though slightly different in ways that will
    be addressed later. Anything within a set of quotation marks will be interpreted
    as an individual item.


    ```bash

    cd ‘My Photos’

    pwd

    ```

    ```

    /home/mike/Docs/My Photos

    ```


    ### Escape Characters


    You can also define an item with a space in it by using an escape character, also
    known as a backslash (\). The backslash nullifies the meaning of the character
    directly following it.


    ```bash

    cd Happyday\ Pictures

    pwd

    ```

    ```

    /home/mike/Docs/My Photos

    ```


    You can see above that the space between ‘Happyday’ and ‘Pictures,’ which would
    normally have a special meaning (separating into unique command line arguments).
    Thanks to the backslash, the special meaning is ignored in the argument.


    ## Hidden Files and Directories


    The mechanism to specify whether a file or directory is hidden is very elegant
    in Linux. By beginning a file or directory’s name with a `.` (full stop), it will
    be interpreted as hidden - it doesn’t even require any sort of special command
    or action. There are several reasons for a file or directory to be hidden. For
    example, a user’s configuration files (stored in the home directory) are generally
    hidden in order to declutter the space for the user’s everyday tasks.


    Is Docs


    `MYFILE1.txt` `Myfile1.txt` `myfile.TXT`


    `ls -a Docs`


    … `MYFILE1.txt` `Myfile1.txt` `myfile.TXT` `.hidden` `.file.txt` …


    ## The tar command


    The `tar` command is used very often because it is simple and efficient. It backs
    up files, including the file tree.


    ### Backup


    ```bash

    tar -cvf Filename.tar Files

    ```

    - `c`: creation of archive

    - `v`: Verbose chat mode: displays what is done

    - `f`: indicates that the following parameter is the name of the archive


    Example:

    ```bash

    tar -cvf /media/your_media/archive.tar /home/user01/Documents/

    ```


    ### Backup with compression


    ```bash

    tar -cvzf archive.tar.gz Filers

    ```

    Example:

    ```bash

    tar -cvzf /media/your_media/archive.tar.gz /home/user01/Documents/

    ```

    - `z`: add Gzip compression.


    ### Show the contents of the archive


    ```bash

    tar -tvf archive.tar

    ```

    - `t`: show the contents of the archive


    ### Restoration


    NB: Do not forget to place in the folder (`/`) by the command `cd /`


    ```bash

    tar -xvf archive.tar Fichiers

    ```

    - `x`: extracting all the files from the archive.


    Example:

    ```bash

    tar -xvf /media/your_media/archive.tar

    tar -xvzf /media/your_media/archive.tar.gz

    ```

