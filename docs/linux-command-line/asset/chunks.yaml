    ## 本节使用的术语表：


    ### Init (初始化程序)

    一个控制 Unix、Linux 和 BSD 系统启动（又称初始化）的程序。


    ### Runlevel (运行级别)

    `init` 程序使用的一组配置文件，定义了系统启动期间（或通过 `telinit` 命令调用时）要加载的程序和服务。


    ### Service (服务)

    一种提供 Web 服务器、DNS 服务器、邮件服务器等服务的系统程序。服务有时被称为守护进程（Daemons）或服务守护进程（Service Daemons）。


    ## shutdown

    **目的：** 关闭系统。

    **用法语法：** `shutdown [OPTIONS] [TIME] [MESSAGE]`


    ### # shutdown now

    ```

    来自 ROOT 的广播消息：

    系统现在正在关机！

    * 正在停止服务 [ OK ]

    * 正在终止进程 [ OK ]

    ...

    系统现在停止。

    ```

    shutdown 命令的示例输出


    `shutdown` 命令用于关闭本地系统。可以执行几种不同类型的关机：`halt`、`poweroff` 和 `reboot`。


    **注意：** `shutdown` 的用法在不同的 Unix、Linux 和 BSD 平台之间有所不同。本页示例适用于 Linux 系统。如需特定环境的特定用法示例，请在本地系统上输入
    `man shutdown`。


    当执行 `shutdown` 命令时，会向所有登录到本地系统的用户广播警告。可以在时间参数之后指定一个可选消息，如下例所示。


    ### # shutdown 2 请尽快保存工作并注销！

    ```

    来自 ROOT 的广播消息：

    系统将在 2 分钟后关机！

    请尽快保存工作并注销！

    ```

    shutdown 命令广播消息的示例输出


    **常见用法示例：**

    * `shutdown now` - 立即关闭系统

    * `shutdown [MIN]` - 等待指定的分钟数后关机

    * `shutdown [HH:MM]` - 在指定时间关闭（24 小时制格式）

    * `shutdown -r now` - 重启系统

    * `shutdown -H now` - 停止系统运行

    * `shutdown -P now` - 关机


    ## poweroff

    **目的：** 关系统电源。

    **用法语法：** `poweroff`


    ### # poweroff

    ```

    来自 ROOT 的广播消息：

    系统现在正在关机电源！

    * 正在停止服务 [ OK ]

    * 正在终止进程 [ OK ]

    ...

    系统现在将断电。

    ```

    poweroff 命令的示例输出


    `poweroff` 命令将立即关闭并切断系统电源。它本质上是 `shutdown -P now` 的快捷方式。`poweroff` 命令存在所有 Linux
    发行版以及某些 BSD 和 Unix 系统中。


    **注意：** 要检查你的系统是否支持 `poweroff` 命令，请输入 `whereis poweroff`。


    **警告：** `poweroff` 命令不提供缓冲期，执行时将立即关掉系统。


    **常见用法示例：**

    * `poweroff` - 关并切断系统电源


    ## reboot

    **目的：** 重启系统。

    **用法语法：** `reboot`


    ### # reboot

    ```

    来自 ROOT 的广播消息：

    系统现在正在重启！

    * 正在停止服务 [ OK ]

    * 正在终止进程 [ OK ]

    ...

    系统现在将重启。

    ```

    reboot 命令的示例输出


    `reboot` 命令用于平稳地重启系统。它本质上是 `shutdown -r now` 的快捷方式。在命令行上执行 `reboot` 将如上例所示立即重启系统。


    **警告：** `reboot` 命令不提供缓冲期，执行时将立即重启系统。


    ## halt

    **目的：** 停止系统运行。

    **用法语法：** `halt`


    ### # halt

    ```

    来自 ROOT 的广播消息：

    系统现在正在停止运行！

    * 正在停止服务 [ OK ]

    * 正在终止进程 [ OK ]

    ...

    系统现在将停止。

    ```

    halt 命令的示例输出


    `halt` 命令将停止运行中的系统。`halt` 是一种特殊的关机类型，它会平稳地关闭操作系统，但不切断系统电源。


    **注意：** 某些商用 Unix 系统在停止后会进入维护模式。这可以访问启动前的配置/诊断环境。


