  trans: "\n\n虽然管理系统进程是管理员的工作，但对于普通用户来说，了解一些相关知识可能也会帮助。当涉及到用户自己的任务和效率时，这些知识就会变得非常重要。\n\
    \n本节将用理论解释系统性能。在这里，你将学习到：\n\n- 普通用户遇到的问题\n- 普通用户可以用来优化可用资源的方法\n\n## 进程需要多少时间？\n\
    \nBash 提供了一个预装的 `time` 命令，用于显示执行进程所需的时间。该工具具有准确性和多功能性——你可以用它获取任何命令的精确数据。为了帮助你理解\
    \ `time` 命令，下面提供了一个截图：\n\n在此示例中，使用 `time` 命令来计算创建某个 `.pdf` 文件所需的时间。结果显示该过程需要 1\
    \ 分钟 41 秒。\n\n文件目录 `/usr/bin` 包含一个 GNU 版本的 `time` 命令（这与预装的 `BASH` 工具不同）。该命令显示了更多可以各种方式使用的数据。此外，它还会显示命令的退出状态和总运行时间。当配合\
    \ GNU `time` 命令使用时，上述示例提供了这些结果：\n\n如果你想了解更多关于这些时间命令的知识，可以检查系统的 `Info` 页面。\n\n\
    ## 性能\n\n对于普通用户而言，“卓越性能”指的是进程执行快速且正确。然而，对于系统管理员来说，这些词具有更多含义：管理员需要最大化整个系统的性能，包括守护进程、程序和用户。通常，系统性能可能取决于许多未被\
    \ `time` 命令评估的“微不足道”因素。以下是这些“微不足道”因素示例：\n\n- 对驱动器、显示器、控制器、接口等的访问。\n- 运行的程序设计不合理或未有效利用计算机资源。\n\
    - 系统中活动用户的数量。\n- 一天中的时间。\n- 远程网络的可用性。\n\n## 负载\n\n基本上，负载取决于你网络中的正常情况。例如，一台运行防火墙、文件服务器、SSH\
    \ 服务器、路由守护进程、代理服务器、sendmail 服务器和其他设备的旧 P133 可以支持最多 7 个活动用户。在这种情况下，负载仍然为零。某些系统（特别是具有多个处理器的系统）可以轻松支持高达\
    \ 67 个用户。\n\n识别网络负载的方法只有一种：定期检查。这样，你就能知道对你的网络来说什么是正常的。如果不使用这种方法，你只能从命令行的响应时间来判断系统负载。响应时间缺乏准确性——由于各种因素会影响它，因此它是不可靠的。\n\
    \n记住，即使负载平均值相同，不同的网络表现也不同。例如，如果一个网络拥有支持硬件加速的显卡，它可以流畅地渲染 3D 图像。然而，使用旧 VGA 卡的网络在渲染图像时会像乌龟一样慢。旧系统在启动\
    \ X 服务器时可能缓慢，而现代系统甚至“感觉不到”增加的负载。\n\n## 优先级\n\n任务的重要性（或优先级）由其 **nice 值**（谦性值）决定。高\
    \ nice 任务对其他用户、其他任务以及网络本身都是“合作”的（或“友好”的）：它们是低优先级任务。低 nice 值表示其所属的任务很重要，并将占用更多的系统资源。\n\
    \n你可以通过给任务更高的 nice 值来让任务变得“更友好”。然而，这种技术仅对需要大量 CPU 时间的进程（例如软件编译器）有效。持续利用大量 I/O\
    \ 时间的进程会被赋予较低的 nice 值（即更高的优先级）。例如，键盘输入在计算机网络中始终获得最高优先级。\n\n你可以使用 `nice` 命令设置程序的重要性。\n\
    \n许多系统提供名为 `BSD renice` 的命令。该命令允许用户编辑活动程序的“友好程度”。你可能需要检查操作系统的手册以确定此命令是否可用。\n\n\
    ## CPU 资源\n\n在每个操作系统上，许多进程需要同时使用计算机的 CPU。即使你是唯一的活动用户也是如此。每个进程都需要特定数量的 CPU 资源才能正常运行。由于\
    \ CPU 处理许多请求，有时计算机程序无法获得足够的资源。如果你想优化计算机，就需要了解可用的系统资源。可以使用工具来获取这些数据。\n\n`Uptime`\
    \ 是 Linux 中可以使用命令之一，它缺乏准确性（它只能显示平均值，你需要识别正常数值），但在某些情况下很有用。以下是你可以采取的一些提高 CPU 效率的方法：\n\
    \n- 停止系统执行不必要的任务。停止你不使用的程序和守护进程。你可以使用 `locate` 命令来实现。\n- 在系统负载低水平时运行资源密集型进程。通常，你应该在夜运行“重型”进程。\n\
    - 先运行低优先级任务。\n\n如果这些方法不能解决你的问题，你可能需要一个更好的 CPU。对于 Linux 系统，这是系统管理员的工作。\n\n## 用户\n\
    \n在 Linux 系统中，根据使用系统资源的方式，计算机用户可以分为不同的类型。以下是 Linux 用户的三种类型：\n\n- 运行许多小进程的人。一个很好的例子是缺乏经验的\
    \ Linux 用户。\n- 运行几个（但复杂的）进程的人。这种类型的示例是运行模拟器、计算和仿真的人。\n- 运行少量需要 CPU 时间的进程的人。\n\n\
    ## 可视化工具\n\n在图形环境中，你有大量的工具。这是一个名为 System Monitor（系统监控）的工具截图。该工具可以查找任务。\n\n## 列出和显示信息\n\
    \n使用 `ps` 命令显示当前运行的进程。如果没有指定选项，`ps` 将显示与当前会话相关的进程。\n\n- 要查看所有进程，使用 `ps -e`。\n\
    - 要查看包括非你所有的在内的进程，使用 `ps -A`。\n- 要查看特定用户，使用 `ps -u`。\n- 要查看特定 PID，使用 `ps -p`。\n\
    - 要查看完整列表，使用 `ps -f`。\n- 要查看所有进程，使用 `ps -ef`。\n- 要查看进程树，使用 `ps -H`。\n- 要查看进程树，使用\
    \ `ps --forest`。\n- 要查看进程树，使用 `ps --tree`。\n\n```bash\nps\n  19511 pts/2    00:00:00\
    \ bash\n  19554 pts/2    00:00:00 ps\n\n\n``````bash\nps -p 19511\n  19511 pts/2\
    \    00:00:00 bash\n```\n\n```bash\nps -f\nUID         PID  PPID C STIME TTY \
    \         TIME CMD\nbob         19511 19509 0 16:50 pts/2      00:00:00 -bash\n\
    bob         19556 19511 0 16:50 pts/2      00:00:00 ps -f\n```\n\n```bash\nps\
    \ -e | head\n  PID TTY             TIME\n    1 ?               00:00:02 init\n\
    \    2 ?               00:00:00 kthreadd\n    3 ?               00:00:19 ksoftirqd/0\n\
    \    5 ?               00:00:00 kworker/0:0H\n    7 ?               00:00:00 migration/0\n\
    \    8 ?               00:00:00 rcu_bh\n```\n\n"
