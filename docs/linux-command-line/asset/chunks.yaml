  trans: '


    *   `bg` – 用于在后台重新激活被中断的进程。

    *   `fg` – 将进程返回到前台。

    *   `jobs` – 显示正在后台运行的命令。

    *   `kill` – 结束一个任务。

    *   `regular_command` – 在系统的前台运行该命令。

    *   `command &` – 在系统的后台运行该命令。这会释放终端：你可以在上一个命令仍处于激活状态运行时其他程序。

    *   `Ctrl + Z` – 停止（挂起但不终止）一个在系统前台运行的进程。

    *   `Ctrl + C` – 中断（停止并终止）一个在在前台运行的进程。

    *   `%n` – 系统为每个后台运行的进程分配一个数字。使用 `%` 符号，你可以通过数字引用进程（例如 `bg %2`）。


    ## 自动进程


    自动进程（也称为批处理进程）不链接到任何终端。相反，这些是在可以在打印队列区域（spooler area）中排序的任务，它们将按照先入先出的原则执行。这些进程可以使用以下方法之一执行：


    *   在指定的日期和时间 – 你必须使用 `at` 命令来实现。

    *   在系统整体负载足够低以接收额外任务的时间。你可以通过 `batch` 命令实现此操作。通常，进程会排队，以便在系统负载低于 `0.8` 时执行。在大型系统中，当需要处理海量数据或在已经繁忙的系统上执行需要大量资源的任务时，管理员可能会利用批处理。你也可以使用批处理来优化系统性能。


    ## 守护守护进程 (Daemons)


    这些是持续运行的服务器进程。它们通常在启动期间激活，并在系统后台等待，直到需要其服务。一个常见的例子是 `xinetd`，这是一个网络进程，在每次启动过程中都会被触发。启动过程完成后，`xinetd`
    会一直等待某个程序（例如 POP3 客户端）需要连接互联网。


    ## 启动过程


    Linux 的流行特性之一是其启动和挂起操作系统的方法，它通过理想设置获取特定程序，允许你修改设置和启动程序，并以组织且优雅的方式停止。


    除了操作启动和关机过程外，Linux 系统的“开放性”有助于你确定与机器关机或启动相关的问题原因。


    ### 步骤


    当计算机启动时，CPU 会寻找并执行基本输入/输出系统 (BIOS)。该程序被编码在计算机的永久性-ROM（只读存储器）中，并可随时使用。计算机的 `BIOS`
    为外围设备提供低级接口，并处理启动过程的第一阶段。


    `BIOS` 检查整个系统，搜索并测试外围设备，并寻找可启动系统的驱动器。通常，`BIOS` 会检查 CD-ROM 驱动器（针对较新的操作系统）或软盘驱动器（针对旧的系统）是否有可用介质。用于启动过程的驱动器序列通常由操作系统上的特定
    `BIOS` 配置管理。一旦 Linux 系统安装到计算机的硬盘上，`BIOS` 将搜索从第一块硬盘起始部分开始的 `MBR`（即主引导记录），将数据放入内存并将控制权移交给它。


    `MBR` 存储了如何通过预定的操作系统使用 `LILO` 或 `GRUB` 引导加载程序的步骤。之后，`MBR` 激活加载程序（如果主引导记录中安装了加载程序，它将控制过程的其余部分）。在红帽操作系统的标准配置中，`grub`
    利用主引导记录中的设置显示可用的启动选项。一旦 `grub` 从配置文件或其命令行获取了启动操作系统的正确指令，它就会获取所需的启动文件并将计算机的控制权传递给操作系统。


    ## GRUB 的不同特性


    这种启动计算机的方法被称为直接加载。这是因为在加载程序和操作系统主文件（例如内核）之间不存在过渡代码。因此，启动指令被用于直接加载操作系统。


    另一方面，其他系统使用的启动过程可能与上述过程不同。例如，MS-DOS 和 Windows 操作系统在安装后会立即完全覆盖 `MBR`，而不会使用现有 `MBR`
    设置的任何部分。这会删除存储在 `MBR` 内部其他操作系统（例如 Linux）的数据。微软的操作系统和其他商业系统一样，通过一种称为链式加载启动的方法启动。在这种方法中，`MBR`
    检查持有操作系统的分区的初始段，从那里获取启动操作系统所需的文件。


    `Grub` 可以同时支持这两种方法。这意味着你可以将 `grub` 用于几乎操作系统、常见的文件结构以及你的 `BIOS` 可以识别的硬盘。


    `GRUB` 还有其他实用的特性。以下是最重要的几个：


    *   `Grub` 为 x86 计算机提供了一个基于命令的环境（即使尚未安装操作系统）。这允许计算机实现最大的通用性——它们可以轻松加载操作系统或收集有关这些系统的数据。

    *   `Grub` 兼容 LBA（即逻辑块寻址）模式。访问 IDE 和 SCSI 硬盘需要这种模式。如果没有 LBA，硬盘可能会面临 1024 磁道的限制，此时计算机的
    `BIOS` 无法获取超过该点之后的文件。

    *   每次启动系统时，`grub` 的配置文件都会从硬盘加载。这意味着你可以在不覆盖 `MBR` 中数据的情况下更改启动选项。


    ## INIT


    一旦加载完成，内核就会在 `/sbin` 目录中找到 `INIT` 并运行它。


    `INIT` 是 Linux 操作系统上自动运行的所有任务的父进程/祖进程。首先，`INIT` 读取它自己的初始化文件（该文件位于 `/etc/inittab`
    目录）。初始化文件告诉 `INIT` 加载系统配置脚本，该脚本安排路径、开始交换、扫描系统文件等。简单来说，此阶段完成了你的机器在系统启动期间需要的所有工作（例如启动串口、设置计算机时钟等）。


    之后，`INIT` 继续读取初始化文件，该文件定义了操作系统在每个运行级别应如何运行。该文件还为系统分配了一个运行级别（run level）。运行级别是计算机进程的配置。一旦为系统分配了运行级别，`INIT`
    开始执行系统所需的后台任务。`INIT` 通过检查对应运行级别的正确 `/rc` 目录来实现。最后，`INIT` 使用 stop 参数运行所有的 kill
    脚本。


    ## 关机


    Linux 设计并不是为了关闭。然而，如果你确实需要，可以运行 `shutdown` 命令。一旦关机过程完成，你可以使用 `-h` 挂起系统或使用 `-r`
    重启系统。


    如果在操作系统使用运行级别 1 到 5 时使用 `-r` 和 `-h` 选项，现在调用 `shutdown` 命令。这个运行级别范围确保了整个系统的正确关机。然而，这是一个坏习惯，并不是所有的
    Linux 系统都具备这种能力。


    如果机器没有自动关闭，在屏幕显示指示操作系统已挂起或完成关机的消息之前，你不能关闭电源。等待此消息可以为你的计算机提供充足的时间断开活动的分区。记住：急躁可能会导致数据丢失。


    ## 如何管理进程


    ### 管理员的任务


