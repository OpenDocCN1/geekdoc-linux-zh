  raw: 'It is an environmental variable in the Linux operating system. It becomes
    active as you enter a command or a shell script. A shell script is just like a
    mini program that offers text-only user interface for the users of Unix-like systems.
    It can read commands and then execute them accordingly. It is important to consider
    here that PATH with all capitals must not be replaced with a path with all the
    lower-case letters. 


    The path variable is a completely different thing as it is the address of a directory.
    Relative path alludes to the address in relation to the directory you are currently
    in. There also is an absolute path as already discussed, which is the address
    in relation to the root directory. 


    On the other hand, the PATH will turn out a series of paths distinguished by colons
    and stored in the form of plain text files. For revision and explanation purposes
    let’s take a look at how it is executed.


    [aka@localhost ~]$ echo $PATH


    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin


    You can add new directories to this string. Let’s try it.


    [aka@localhost ~]$ echo $PATH


    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin


    [aka@localhost ~]$ PATH=$PATH:/home/rich/azuresky


    [root@localhost ~]# echo $PATH


    /usr/local/sbin:/bin:/sbin:/usr/bin:/usr/sbin:/usr/local/bin:/home/rich/azuresky


    [root@localhost ~]$


    It is important to mention that each user in the Linux operating system has a
    different PATH variable than others. Upon installation of an operating system,
    a default variable for your PATH is set. After that, you can add more to it or
    completely change as it suits you.


    Note: It is important to mention that the root user’s PATH variable has more directories
    than any other user. An interesting thing about the PATH variable is that either
    you can change it just for the current session or on a permanent basis. 


    How to find Environment Variables of the Linux System


    There are multiple variables that a system uses for identification purpose in
    the shell scripts. With the help of system variables, you can easily procure important
    information for the programs. There are different startup methods in the Linux
    system, and in each system, the bash shell executes the startup files in a different
    way.


    The Login Shell


    This locates four distinct startup files from where it could process its commands.
    The very first file that is executed is the /etc/profile. You can dub it as the
    default file for the bash shell. Each you time you log in, this command will be
    executed. 


    [aka@localhost ~]# cat /etc/profile


    # /etc/profile


    I have run this command while logged in as a superuser. The result on your window
    can be slightly different. 


    Just take a look at the export command stated as under:


    export PATH USER LOGNAME MAIL HOSTNAME HISTSIZE HISTCONTROL


    You can clearly see that the export command ensures that the variables remain
    accessible to the child processes.


    The $HOME


    This one is a user-specific variable. Let’s run it to know what it has got. 


    [aka@localhost ~]# cat .bash_profile


    # .bash_profile


    # Get the aliases and functions


    if [ -f ~/.bashrc ]; then


            . ~/.bashrc


    fi


    # User specific environment and startup programs


    PATH=$PATH:$HOME/bin


    export PATH


    Interactive Shell


    If you happen to start the bash shell without first logging into the system, you
    kickstart the interactive shell. You have the command line to enter command here.
    With the start from an interactive shell, the system does not load the /etc/profile
    file. It locates another file called .bashrc in the home directory of the user.
    Let’s see how this startup file looks in the Linux operating system.


    [aka@localhost ~]# cat .bashrc


    It conducts a couple of key tasks; first is checking for the bashrc file in the
    /etc directory. The second one is to allow the user to enter aliases. 


    [aka@localhost ~]$ cat /etc/bashrc


    Variable Arrays


    You can use variables as arrays. The fun thing with arrays is their capacity to
    hold multiple values which you can reference for a complete array. You can simply
    cram multiple values in a single variable by listing them with single spacing
    in parenthesis. Let’s try it.


    [aka@localhost ~]$ myworld=(one two three four five)


    [aka@localhost ~]$ echo $myworld


    one


    [aka@localhost ~]$ echo ${myworld[2]}


    three


    [aka@localhost ~]$ echo ${myworld[1]}


    two


    [aka@localhost ~]$ echo ${myworld[4]}


    five


    You can see how easy it is to build up a variable array. You can bring out each
    value in the array with a special command. Now try the following to bring out
    the entire array.


    [aka@localhost ~]$ echo ${myworld[*]}


    one two three four five


    In addition to this you can also unset a specific value from the array.


    [aka@localhost ~]$ unset myworld[3]


    [aka@localhost ~]$ echo ${myworld[*]}


    one two three five


    If you want to get rid of the entire array, you can do that by unsetting it. 


    [aka@localhost ~]$ unset myworld[*]


    [aka@localhost ~]$ echo ${myworld[*]}


    [aka@localhost ~]$


    Variable arrays are not portable to other shell environments, that’s why they
    are not the foremost option to be used with Linux operating system users.


    # Chapter 3. Using the Terminal And Virtual Consoles


    Before you do anything from the command line, you have to first actually access
    the command line interface. When you boot up Ubuntu or Linux Mint or another Linux
    distribution with a graphical interface, you might wonder how to even get to the
    command line. In this chapter, we''ll discuss how to reach the command-line interface
    both from a GUI-based Linux distribution and a CLI-based one. We''ll also show
    you how to have multiple command-line windows open at once, whether in the GUI
    or in a pure CLI environment.


    ACCESSING THE COMMAND LINE FROM A CLI-BASED DISTRIBUTION


    Some Linux distributions, such as Ubuntu Server, do not include a GUI. For such
    distributions, getting to the command line isn''t hard. You simply boot up the
    computer or server, and the system goes to the logon prompt. Enter your username
    and password, and you will log into the system and arrive at the command line
    prompt, also known as a terminal session. The term terminal dates back to the
    days when UNIX ran on large mainframes accessed via remote terminals.


    Sometimes you might see a blank screen on a CLI Linux machine that''s powered
    up. This is no cause for panic – to save power, the system is usually configured
    to power off the screen after a set interval of inactivity. Simply tap the space
    bar to awaken the display once more.


    ACCESSING THE COMMAND LINE FROM A GUI-BASED DISTRIBUTION


    Accessing the command line from a GUI-based Linux distribution is a little trickier.
    By default, a GUI-based distribution boots into the graphical interface. Even
    within the GUI, it’s simple to access a command prompt. There are two common ways
    of doing so.


    The first and most common is an application called a terminal emulator. As the
    name implies, a terminal emulator recreates the command line environment, but
    within a window of your GUI. You can access the full range of Linux commands from
    the terminal emulator application, but you can still use the benefits of the GUI
    - the mouse, the menu bar, and copying & pasting. (Copy & paste is particularly
    useful, since you can copy and paste complex and lengthy commands into the terminal
    emulator without the hassle of typing them.)


    Almost all desktop Linux distributions include a terminal emulator application.
    You can usually launch it by going to the Applications menu, then to the Accessories
    category, and finally by clicking on the Terminal icon. If your distribution comes
    with a quick-launch bar (like Ubuntu’s Unity Launcher), very often the icon for
    the terminal emulator is pinned to the launcher.


    The second way to access the command line in a Linux GUI is through what’s called
    a virtual console. We’ll discuss virtual consoles in this chapter, but first we’ll
    describe how to open multiple terminal windows.


    OPENING MULTIPLE TERMINAL WINDOWS IN THE GUI'
