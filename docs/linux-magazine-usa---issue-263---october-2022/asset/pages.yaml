    # # EMuDeck


    One of the best things to come from Valve''s Deck is the extra scrutiny our community
    saw and a coming wave of Linux newcomers. Thanks to the Deck running its variation
    on Arch, with a touch-enabled KDE Plasma software, more people are ever than ever
    using Discover software to install applications. When they run into problems,
    these users are around a generic forum and when someone finds a solution, it can
    be shared with a reasonable degree of confidence. It was same popularity that
    helped Ubuntu into the many forums and Stack Exchanges, and it sustains Ubuntu
    to today.


