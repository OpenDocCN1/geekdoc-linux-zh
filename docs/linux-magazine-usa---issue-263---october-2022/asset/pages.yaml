    \nWhen the for variable is reached, earlier entries are deleted and replaced by\
    \ new. Many users first opt to use a high number, such as 10,000 entries. Because\
    \ the history is a text file, there should be no problem with how you store the\
    \ history file\n\nHISTSIZE-NUMBER\nHISTFILESIZE-NUMBER\n\n```\n```bash\n90 apt\
