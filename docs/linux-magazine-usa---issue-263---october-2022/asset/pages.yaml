  md: '# Roll your own IoT Linux with Buildroot


    # Getting Small


    Whether you need a tiny OS for 1MB of flash memory or a complex Linux with a graphical
    stack, you can quickly set up a working operating system using Buildroot.

    By Arnold Vandercappelle


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_21_0.png)


    To put together a Linux-based IoT system, you need a quick and easy approach to
    getting a base system and running. While you are at it, you also need to keep
    an eye on the footprint—some IoT platforms have only 4MB flash memory. You will
    want to keep control of the software included in the system, and you want to be
    able to choose your own applications. Last but not least, you will need to pay
    attention to security and comply with both open source and proprietary libraries.


    The Yocto Project system will help you with these tasks. Buildroot, emerging in
    the early 2000s from the meslinux and Busybox projects, focuses on creating systems
    with a minimal footprint. Buildroot is easier to use and configure compared simply
    to Yocto


    If you do not need the Yocto''s expansive capabilities, which use a layer-based
    system and other advanced features, and you just need to generate an OS for an
    embedded device, Buildroot is the better choice.


    Buildroot can generate:

    - a cross-compilation toolchain

    - a root filesystem

    - a kernel image

    - a bootloader for the device


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_21_1.png)


    Once you decide which packages to include, Buildroot helps with downloading, patching,
    configuring, and finally installing each package (Figure 1). In addition, you
    can generate metadata if desired—a manifest of installed packages, size (graph-size),
    and the dependencies between the packages (graph-deps). All packages are built
    from the source code, which gives you maximum control over the configuration.


    Unlike Ubuntu Core and Linux from Scratch, Buildroot runs on cross-compiling,
    which means the build happens on a host machine different from the target machine
    on which the build will eventually run. For example, you can build on a computer
    with an x86 architecture, even though the target system is ARM. Most processor
    architects in the


    A selection tool based on the menu of the Linux kernel lets you specify required
    packages and the associated configuration options. This menu-driven approach helps
    select the components you need and makes it easy to leave out any components you
    don''t need to minimize the flash footprint.


    ```

    ################

    # tinifier

    ################

    TINIFIER_VERSION = $(shell curl.github,tarpampam,tinifier,vi$(TINIFIER_VERSION))

    TINIFIER = make

    TINIFIER_LICENSE = license

    TINIFIER_GOCMD = ~/cmd/tinifier

    shell=$(golang-package))

    ```


    Figure 1: After downloading and patching the packages, some configuration and
    work is required before you can install.'
