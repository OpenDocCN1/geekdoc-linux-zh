    \ SSH connection to the e-reader using the following command (replace 127.0.0.1\
    \ with the actual IP address of the e-reader)\n\nA slightly less versatile approach\
    \ is to rsync onto the e-reader so you can make operations directly on the device!\
    \ To install rsync on a KOReader, download the rsync binary and install the KoStuff\
    \ package.\n\n```\nssh -p 2222 root@127.0.0.1\n```\n\nLaunch KOReader, open the\
    \ top bar, switch to Tools | More | terminal, emulators, and Open session. Run\
    \ the rsync command to sync the content of the Library directory to a Linux machine.\
    \ Here is an example of a command you can use to back up to a Linux on a local\
    \ network:\n\nOn most Linux distributions, the default file browser handles the\
