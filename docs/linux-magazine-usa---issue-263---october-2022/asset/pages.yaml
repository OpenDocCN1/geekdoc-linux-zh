    \n```\n#!/bin/sh\nrsync -avz -delete -e \"ssh -p 2222\" /mnt/onboard/library/\
    \ /user@127.0.0.1:/path/to/backup/\nrsync -avz -delete -e \"ssh -p 2222\" /mnt/onboard/adds/koreader/clipboard/\
    \ \nuser@127.0.0.1:/path/to/export\n```\n\nThe easiest way to connect to KOReader\
    \ is to enable SSH without password. The easiest approach is to use a secure connection,\
