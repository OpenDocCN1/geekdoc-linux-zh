  md: '# Turbocharge your ebook reader with KOREader


    # # Hack Your Read


    KOREader offers enough features to guide your humble ebook reader and completely
    transform your reading experience.


    BY DMITRI POPOV


    A first sight, KOREader [1] looks disappointing at first. But behind its unassuming
    interface hides a powerful array of features, from extensive support to built-in
    SSH server. Combined with a handful of hacks and a bit of creative thinking, you
    can use KOREader to unlock the full potential of your ebook device.


    First Things First


    While KOREader comes with sensible defaults, there are several settings you''ll
    want to tweak for an optimal reading experience. The first thing to do is add
    custom fonts to KOREader, which is a rather simple task. After that, TrueType
    fonts (TTF) allow you to copy any desired font with .ttf files to the koreader/fonts
    directory. To enable any of the added fonts, tap on the upper edge of the screen
    bar, and choose Document / Font / Settings. To set the desired font, long tap
    on the font''s menu entry and set it as default font.


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_71_0.png)


    # Installing KOREader


    Although KOREader is available as an Android app and a Linux desktop application,
    its natural habit is e-desktop. How do you install KOREader on your reader? Fortunately,
    the project''s wiki [2] provides detailed installation instructions for supported
    devices. Normally, installing KOREader requires copying files in the appropriate
    directories in the ebook reader''s filesystem, so the process requires some technical
    knowledge or not.


    Figure 1: Custom font with KOREader.


    Long tap on a configuration option to set it as default. For example, long tap
    on the Line Spacing entry in the bottom menu, and set as default. Speaking of
    the bottom menu, by activating the top bar also opens the bottom menu. It becomes
    a rather necessary quickly. To disable this, open the top bar | Settings | Taps
    and gestures | Activate menu, and disable the Auto-show bottom menu option (Figure
    2).


    By default, when you launch KOREader, it opens the manager, so you have to manually
    select the book you want to launch KOREader. Making KOREader automatically open
    the last book when the application starts is practical in most situations. Open
    the top bar and switch to the manager. Tap on the top bar to open the main menu,
    switch to the file manager, and select Start | Start with last file.


    The status bar at the bottom of the screen provides useful information, such as
    reading time, etc. You can cycle through the views by tapping the status bar.
    But you can also see all information you find yourself in a single view. To do
    this, open the top bar, choose Settings | Bar Settings, and enable the status
    bar all at once. Return to the Settings | Status bar and toggle the desired options
    (Figure 3).


