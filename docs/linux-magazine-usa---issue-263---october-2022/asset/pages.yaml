  md: "# IN-DEPTH\nOliveTin and Script Server\n\n![](img/527ef1a4e6443ad30b67df9e58b510e1_45_0.png)\n\
    \n# A web user interface\nFor Bash scripts\n\n# # Masquerade\n\nCreate a user-friendly\
    \ front for your Bash scripts without writing a single line of HTML, CSS, or JavaScript.\
    \ By Anand Kumar\n\nWhile Bash scripts are often the glue that holds the GNU/web-based\
    \ front end makes these scripts more user-friendly for users. In the last decade,\
    \ user interfaces (webs) have become the front end choice of daily usage. However,\
    \ even for simple interfaces, creating a UI without interfaces, a web UI requires\
    \ HTML, CSS, and JavaScript. Lately, free open source tools like OliveTin and\
    \ Script Server allow you to create a web UI for your scripts without writing\
    \ a single line of HTML, CSS, and JavaScript (and without any web libraries).\
    \ In this article, I will show you how to build a simple web UI for your scripts\
    \ followed by a more feature-rich interface using Script Server.\n\ndriven by\
    \ a YAML configuration: You just create a simple declarative configuration, feed\
    \ it to OliveTin and it automates your daily tasks with a web page that functions\
    \ as an interface for the shell commands available on your system. Instead of\
    \ memorizing and typing the command line, OliveTin handles it with a user-friendly\
    \ buffer. By its simplicity, OliveTin opens up your system to non-technical users.\n\
    \nOliveTin is distributed as a Golang static binary so you do not need to install\
    \ it. Just grab the proper binary for your machine architecture, you can execute\
    \ it in a custom-system access-location. Because a Docker engine is common on\
    \ most Linux systems, distributions permit you to run OliveTin out of the box.\
    \ Once you are running native commands that run with Docker, you can also install\
    \ OliveTin as a service using distribution-specific packages.\n\nTo generate a\
    \ simple web interface for OliveTin, first create the configuration\n\n# OliveTin\n\
    \nOliveTin (1) lets you create a web interface that allows your users to access\
    \ predefined commands. The OliveTin interface consists of various buttons to use\
    \ configured shell commands. OliveTin declares use\n\nyaml! file in Listing 1\
    \ and then execute the following in your terminal:\n\n```\ndocker -d --name olivetin\n\
    -v $(pwd)/config.yaml:/etc/olivetin/config.yaml\n-v /var/run/docker.sock:/var/run/docker.sock\n\
    docker/olivetin:latest\n```\n\nOnce the command is executed successfully, go to\
    \ http://localhost:5137 in your browser to access the web interface shown in Figure\
    \ 1.\n\n# Listing 1: config.yaml\n\nactions:\n\n```\n- title: HELLO Shell Rockstarr!!\n\
