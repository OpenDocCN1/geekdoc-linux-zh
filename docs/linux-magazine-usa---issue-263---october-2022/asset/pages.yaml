    a track or the amount of memory you''ve used, Viddy is a little tool for building
    scripts to monitor changes or errors. What watch lacks, however, is more dynamic
    output, and it is written. Viddy is named after a famous character in A Clockwork
    Orange (which was inspired by vivid, the Latin word for “saw”), and it performs
    the same function as watch with some modern


    augmentation. The most useful of these augmentations is a diff mode to highlight
    any part of your output activity. Very useful on more complicated commands because
    they are immediately colored in yellow, letting you see exactly which values are
    new. If you do miss the moment when a value changes, another Viddy feature will
    let you roll the back out through history so you can see what changed and when.
    All this can be done with Vim-like bindings, which can be edited, and in full
    color, which can also be configured to your own taste.


    Viddy can be used to track output changes and monitor suspicious jealous activity.


    output is pag so you can easily scroll up or down through large volumes of output,
