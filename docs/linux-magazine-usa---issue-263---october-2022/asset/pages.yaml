    \ you’re like most people, your use of history may have been confined to scrolling\
    \ through the\nlist of previously used commands. If you are interested in the\
    \ most recently used commands, the arrow may be all you need. However, the history\
    \ command is capable of doing much more and in an economical way—especially if\
