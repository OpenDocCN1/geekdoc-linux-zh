    Many of the browser extensions for finding content use artificial intelligence
    methods. For example, on texts, certain phrases such as "my opinion" or "I think,"
    already draw attention to the content''s objectivity. These browser extensions
    also use databases to compare messages and analyze their truthfulness.


    On Facebook and other social networks, the add-ons can also show comments about
    what has been posted by others. When they show images, some extensions check whether
    an image has been published elsewhere. If you find the same image on earlier web
    pages, and it is not marked as an archive or image on the page you are visiting,
    someone has misled you. You can also search for copies of the image, a practice
    known as reverse image search, to detect infringement.


