    Save the file and make it executable using:


    ```

    chmod +x /koreader/scripts/up.sh

    ```


    To launch the script in the re-reader, open the terminal emulator and run the
    koreader/scripts/backup.sh


    If you happen to use a second re-reader, and want to download the saved settings
    and data, all you have to do is create a script that runs the following commands:


    ```

    rsync -avzh --delete -n --no-o -p -e "ssh" USER@127.0.0.1:/path/to/library/mnt/observed/

    rsync -avzh --delete -n --no-o -p -e "ssh" USER@127.0.0.1:/path/to/clipboard/mnt/observed/adb/koreader

    ```


    Every time you run the scripts described above, you''ll be prompted to enter the
    password, which can quickly become a nuisance. To fix this, generate an SSH key
    pair in KOReader, and add the public key to the authorized keys on the remote-machine


    To create an SSH key pair, launch the terminal emulator in KOReader and run the
    ssh-keygen command. Follow the prompts, skip specifying a passphrase. This generates
    a key pair in /usr/local/niluje/usnet/etc/dot/ directory. To make sure that the
    keys are there,


    ```

    ssh-agent sh -c ''ssh-agent; ssh-add -l''

    ```


    Copy the /usr/local/niluje/usnet/etc/dot/id_rsa.pub file to a Linux machine, and
    use the command below to add to the authorized_keys file on the remote server:


    ```

    cat id_rsa.pub | ssh USER@127.0.0.1 "mkdir -p ~/.ssh && cat >> ~/.ssh/authorized_keys"

    ```


    From now you can run the scripts (or any commands and actions that require an
    SSH connection to the remote machine) without a password.


    # Wrap Up


    You don''t have to stop here, because KOReader has so much more to offer. Dive
    into its configuration, and you''ll discover that you can control practically
    every aspect of the application gestures. Once you''ve configured gestures to
    your liking, explore KOReader''s reading statistics. In short, you''re hard pressed
    to find a better and more powerful reading experience. And if you are willing
    to put some effort and time learning its functionality, you''ll be rewarded with
    a reading experience you never thought possible.


