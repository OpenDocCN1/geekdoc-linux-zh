    and news information you find online.


    ### 46 OliveTin and Script Server

    You don''t need to be a coder to create a polished web-based front end for a Bash
    script.


    ### 76 A.D.

    Navigate through lost civilizations with this classic game.


    ### 90 Drawing with ImageMagick

    This handy image fixer can do more than touch up photos. We''ll show you how to
    draw pictures with scripts.


    ### 60 RFID with SPI

    Convert your Rasp Pi to an an RFID reader using the RC522 kit and an SPI display.


    # NEWS


    # IN-DEPTH


    ### 08 News


    +   - Kali Linux 2022 3 Released

    - 14" Pinebook Lx Linux Laptop

    - OpenMandriva Lx QOME Technical Preview Review

    - Linux Mint 21 Now Available

    - Firefox Adds Long-Anticipated Feature

    - System76 Pro Laptop Refresh with a New CPU


    ### 30 Disinformation Detector


    Information is experiencing a boom, but given the right tools, you can reliably
    separate the wheat from the chaff.


    ### 34 Command Line — Bash History


