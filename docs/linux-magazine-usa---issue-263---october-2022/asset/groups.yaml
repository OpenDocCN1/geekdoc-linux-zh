    time typing. We let the first shell keep notes on what gets typed, before a program
    guesses the next command and runs it for you.


    ### 16 Yocto


    The Yocto project gathers all the tools you need to build a custom Linux for an
    IoT device.


    ### 22 Buildroot


    Whether you need a tiny OS for 1MB of flash memory or a complex Linux with a graphical
    stack, you can quickly set up a working operating system by Buildroot.


    ### 56 Introducing Rocky Linux


    Rocky Linux emerges as a free alternative to Red Hat Enterprise.


    # REVIEW


    ### 26 Distro Walk — Many Hats


    The Hat family and all its derivatives.'
