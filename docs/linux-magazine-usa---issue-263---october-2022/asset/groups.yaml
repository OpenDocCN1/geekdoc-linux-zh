    Yu 回复说，他对特定的 `BUG_ON(n)` 使用（即 `VM_BUG_ON(n)`）只会影响内核构建过程，而不影响运行时。Andrew 回答道：“我告诉，许多生产构建启用了
    VM_BUG_ON。”


    但 Yu 反问道：“没有人想在生产环境中调试 VM。某些发行版通过之前的最新 CONFIG_DEBUG_VM 提供了该功能，以便在后续可用时有更好的测试覆盖。人们会在生产环境中使用它吗！绝对会，如果我们没有足够的测试覆盖。而我们本该避免这种情况。”


