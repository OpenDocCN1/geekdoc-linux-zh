    # Welcome


    # SENTIENCE AND SENSIBILITY


    Dear Reader,


    I feel like we entered a new era this year when I thought Google scientist Blake
    Lemoine declared that Google''s LaMDA intelligence is "sentient," and that the
    company was probably asking LaMDA''s permission before studying it. The news month
    that Google fired Lemoine. The reason was that he violated a confidentiality agreement,
    but few could ignore the fact that the claim was made and the controversy that
    followed.


    Computer scientists are working overnight now trying to create conscious systems
    that behave as they are humans will react to them "naturally." In other words,
    these systems will manipulate us.


    We will have two choices:


    - Fall for artificial response patterns and emotional cues in other words, as
    if they were our friends - in other words, manipulated;

    - Fall for artificial response patterns and emotional cues, give practice every
    day entities that behave like humans in an uncanny and uncanny manner that defines
    their humanity)


    Let me explain, I don''t think this is important because of. In fact, I''m sure
    it isn''t. I find it strange that we are talking about it, and the way we are
    talking about it is strange. Several computer scientists and Google as a company
    have found the claim preposterous. The news wasn''t as much a computer science
    event, but as a popular phenomenon, it was pure. Was this classic dystopian sci-fi
    story of a man falling in love with a machine? Or is there a chance that this
    is sentient and of form? (Whoa, kind of things you make think, don''t it...?)


    Neither option seems particularly appealing to me. Our course, Google, Meta, and
    the other for-profit corporations who are working on kinds of solutions will they
    just want to build a better chatbot, but that''s the whole problem with this space:
    We''re not so good at putting genes back into boxes once they get out.


    The term "sentient," in this case, relates to the state of having feelings, rather
    than just knowledge. Many have equated this to a state of consciousness. This
    debate has migrated from the cold, analytical realm of computer science, where
    these concepts are quite difficult to define.


    Before you say a computer has consciousness, you have have to define what consciousness
    is, and there is a vast range of answers for that, depending on whether you are
    talking to a priest, a psychologist, a neurologist, or a new age mystic. But the
    point is, Like LaMDA are not created to be human - they are created to make people
    think they are human. If you learn to tap into human response patterns and emotional
    cues, humans will treat you differently. (Sorry love lovers: That''s what your
    dog does.)


