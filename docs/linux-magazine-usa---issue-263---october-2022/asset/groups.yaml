    对手已来到你帝国的门口。如果所有条件已就绪，你可以点击“开始游戏”（Start Game!）开始游戏！


    它们出现在屏幕下方。如果你选择“田”（Field）图标，你可以在行政总部附近建立田。田总是准备就绪的，提供可再生食物来源。使用剩余的农民耕作两块田。


    ## 收集资源


    开始时，你有一个行政总部和市民（图 4），他们分为市民（女性）和民兵（男性）。市民仅限平民身份。他们通过步行或骑马收集资源并建造建筑。步行时，他们可以采集资源并建造建筑，但可以使用武器防御攻击。骑马兵会限制他们的资源采集和狩猎活动。你可以通过点击该区域或取消选择来选择他们。


    如果你猎杀所有自由流动的市民，将需要建造一个围栏并将牲畜圈其中。


    接下来，将你的每位市民发送到森林砍木、发送到石矿采采石，并生产金属。市民还会将资源送回行政总部。根据资源地与行政总部之间的距离，可能会浪费大量时间。这就是为什么派遣目前空闲的第四个市民在森林、石矿和矿矿附近建造仓库是有意义的。资源可以送送到仓库，而无需花费大量时间。


    你可以通过左键点击选择单位，并通过右键定义所选项目的指令。你需要做的第一件事是建立食物、木材、石头和金属的来源。如果你选择高卢文明，你的人将由四名市民、四名民兵和一个骑兵兵组成。


    选择四名市民之一，右键点击浆莓丛。市民将开始采集浆果并将其送到行政总部。


    此外，自由流动的动物也提供充足的食物。行政总部附近有一些野产——根据地图的不同，有猪、羊、鸡或山羊。在更广范围内，有野生动物四奔——鹿、兔子、熊、狼、斑马、长颈鹿、狮子、大象、野牛或鳄鱼。选择骑兵兵，用鼠标右键点击该单位派遣他狩猎。他会将食物送回行政总部。如果定点位于海边，鱼也可以作为食物来源。


    ## 人口增长


    当你忙于事务时，请仔细观察行政总部。左键点击建筑会在屏幕下方显示详情（图 6）。在那里，对于任何建筑，你都会在顶部面板看到你创建的单位。对于高卢行政总部，这些单位包括一名市民、一名矛兵（用于近战）、一名弓箭手（用于远程战斗）和一个骑兵兵。


    在下方区域，你将看到正在研究的技术。右键点击单位或图标以了解其能力和重要性，以及创建或研究它所需的资源。


    在通过行政总部创建更多市民之前，你首先需要建造房屋。人口上限在开始时设定，默认为 30 人。这是绝对上限。实际的人口限制是该上限内的房屋数量。


    可用的食物资源有限。这意味着你的文明在耗尽食物之前需要作物并养殖牲畜（图 5）。要做到这一点，左键点击其中一个市民。代表一切符号


    图 6：你可以在此处创建新市民并研究技术的行政总部。


    你可以派遣目前空闲的士兵去建造新房屋。屏幕顶部的栏显示左侧的人口数量。建造几座新房屋后，创建更多市民，然后可以派遣他们获取更多资源。


    ## 探索地图


    一条彩色线标记了你控制的定居点区域。你只能看到该区域内的内容。要探索地图，你需要创建骑兵并派遣他们出去探索。通过这种方式，你可以看到哪里有更多资源以及敌人在哪里定居。区域之外尚未探索的区域显示为黑色。之前探索过的区域被战争迷雾覆盖。你将看到你的某个单位（例如骑兵侦险员）最后去那里时的状态。


    随着游戏的进行，你需要扩大定居点区域。你可以通过建造新建筑来实现。每个建筑都有占据你定居点区域的半径。如果你在区域边缘建造，你的定居点区域就会增加。大多数建筑只能在定居点区域内建造，行政总部除外。你也可以在中立领上建造它，因为它拥有最大的影响力。


    图 7：德鲁伊是高卢的治疗者。他们治疗德鲁伊颜色范围单位。


    为了扩大定居点区域，建议建造更多的行政总部。但要注意：由于其重要性，敌人会频繁攻击这些总部。


    ## 探索技术


    随着人口增长和谷仓填满，你需要研究技术来推动文明的发展。这些是在建筑中进行的。例如，在行政总部你可以控制食物，在其他地方你可以开发开采资源的工具。


    现在也是建造更多建筑的好时机。市场让你与盟友进行交易，以保持谷仓丰满。在铁炉


    图 8：如果你的定居点位于海边，你可以建造港口以及航海国家需要的一切，从鱼船到战舰。


    一旦你的商店里有了资源并建造了足够的建筑且研究了技术，你就可以通过以下从村庄阶段进入城市阶段：


    图 9：在兵营训练步兵（左），在马场训练骑兵，并在军械库建造如冲槌之类的攻城武器（右）。


    2022年10月第263期


