    ```\n\n(Figure 11) You will also notice in Figure 11 that docker image prune now\
    \ executes successfully.\n\nWith the information gathered here, you would be able\
    \ to start and configure right with Script Server. The documentation [4] and [5]\
    \ will help you unleash Script Server's full potential.\n\nWhen you switch to\
