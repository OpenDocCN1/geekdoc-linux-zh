    # 深度解析


    # 介绍 Rocky Linux


    # Rocky Linux 正在企业市场寻找足之地


    # 回应呼召


    Rocky Linux 成为 Red Hat Linux 的免费替代方案。作者：Joe Casad。


    开源世界在不断演进，每当需要时，新的 Linux 发行版就会出现。Rocky Linux (1) 去年刚刚出现，部分是为了应对企业领域的动荡，但正如开源世界的常态一样，它正不断进入专业软件领域、工作站和云实例。Rocky
    Linux 是什么？它源自哪里？讲述这个故事最好的方法是从头开始。


    从前以前，Source RHEL 的免费版本作为一个社区驱动的分支应运而出。虽然红帽是一家营利性企业，但 Red Hat Linux 是一个更具价格效益的选项。任何人都可以使用它，许多志愿者在全球范围内工作多年，进行测试并帮助论坛。


    2014 年，红帽宣布将赞助 CentOS 并聘佣了他们的几位开发者。到那时，团队已经计划了变更，他们并不认为同一份代码提供免费版和订阅版并不是问题。看来，如果用户从
    CentOS 开始然后转到 RHEL，新的 CentOS 实际上可以帮助 RHEL。


    IBM 收购红帽导致了优先事项的转变，并在 2020 年再次发生，使得 CentOS 不再是企业的克隆。这本很容易，但遗憾的是由红帽来完成。


    社区再次忙碌起来，寻找一个新的发行版来扮演 CentOS 长期以来的角色。涌出的基于 RHEL 的免费 Linux 领导者之一就是 Rocky Linux。


    一天，红帽（公司）宣布他们将不再免费提供 CentOS 的二进制版本。二进制版的 Rocky Linux 随之诞生，它虽然有成本，但可以提供服务。如果你想知道对
    Linux 收费是否符合 Linux 的 GNU 通用公共许可许可证 (GPL)，请放心，它是符合的。GPL 要求如果程序被修改，代码必须是可用的——它并不要求分发者免费分发编译后的二进制版本。只要红帽在某处发布了源代码，他们就可以自由对二进制版本进行任何修改——而且修改的程度就像微软为
    Windows 收取的费用那样多（为什么 Rocky Linux 比 CentOS 好？）。


    但 GPL（他们无法准确阻止他们）将永远存在。根据 GPL 条款的要求，源代码仍然存在，任何想要它的人都可以获取源码，移除商标和其他专有组件，然后编译并赋予它不同的名称。


    在全盛时期，多个项目提供了 RHEL 的免费重新编译版本。随着时间的推移，RHEL 克隆版中涌出了领导者，CentOS 拥有了忠实的用户和志愿者社区，它可以运行在服务器、Web
    服务器和企业工作负载上。每当红帽发布新版本的 RHEL 时，CentOS 就会变得免费，团队会进行必要的适配并发布新版本的 CentOS，这成为了最受欢迎的——这也是为什么它如此受欢迎：因为它是免费的，并且包含了企业级
    Linux 的所有测试和完善。


    为了保持与社区的联系，红帽宣布他们仍将提供一个名为 Fedora 的免费版本。许多用户从红帽切换到 Fedora，Fedora 直到今天仍然吸引粉丝，但每个人都知道
    Fedora 是完全那样的。首先，它取决于像 RHEL 那样的订阅，因此没有同等水平测试测试。其次，它缺少了 RHEL 中包含的许多功能和工具。红帽更多的是“社区”版而非“企业”版，就像公司领域的许多其他开源产品一样。


    ## 介绍 Rocky


    在 IBM 和红帽宣布将 CentOS 移向上游的那天，共同创始人 Greg Kurtitzer 倾向于启动新项目以继续最新的红帽企业服务。作为 CentOS
    的老兵，Kurtitzer 兴趣的不仅是企业代码库——还有“旨在”帮助社区的设计以及对源码仓库的更新。在这种背景下，他们向社区贡献了一个对其他开发者有吸引力的新工具。


    Peridot（是的，你得这样读那个 "T"）是由 Rocky 开发者构建的一个云原生系统，用于帮助他们获取更新。Rocky 团队将其作为开源软件发布并通过
    GitHub 提供。


    Rocky 项目的创始赞助商是 CIO (2)，一家拥有约 50 名员工的公司，支持 Rocky 并为 Rocky 添加组件；然而，Rocky 是一个独立项目，还有几个其他赞助商，包括
    AWS、Google Cloud 和 Microsoft Azure。存储公司也使用 Rocky 作为它们的存储平台。网站上的 Rocky 页面 (3) 目前列出了
    12 个赞助商，Rocky 正在寻求增长。


    Rocky 将帮助他们跟上红帽的新版发布和更新计划。Peridot 也可以是帮助支持使用现代版本 Rocky 的特殊兴趣用户社区。


    ## SIGs


    Rocky 鼓励有相似兴趣的用户聚集在一起分享想法和解决方案。特殊兴趣小组 (SIGs) 为 Rocky 项目带来了不同的观点和视角。Rocky 有内核、虚拟化、容器、高性能计算和语言的
    SIG。桌面 SIG 致力于各种版本的 KDE、Gnome 和 Xfence。


    ## Peridot


    Rocky 开发者力求无缝衔接，因为在过去，他们必须为每个新版本重复相同的步骤。然而，尽管使用了源文件和补丁，代码本身仍无法改变。开发者需要构建 Peridot
    来自动化构建过程。当更新准备就绪时，你使用按钮和补丁自动获取代码，Peridot 手动选择预定义的补丁并构建包（图 1）。


    Rocky 团队使用 Peridot 构建所有的 Rocky Linux，你也可以使用它。


    ## 深度解析


    ## Rocky Linux


    Rocky 团队的 SIG 将不再仅仅是小组，我们正在从 Rocky 发行版的各个方面工作支持他们的特殊兴趣。高性能计算 (HPC) 是 Rocky 项目特别感兴趣的领域。Rocky
    系统使用广泛的测试来确保性能，但同时，高度并行的 HPC 系统可以拥有数百（数千）个实例，提供了以较低成本获得的竞争优势。CentOS 曾是许多 HPC 用户的最爱，现在正捕捉这一点。Greg
    Kurtz 有 HPC 历史——他还创建了用于 HPC 的 Kubernetes 容器系统 CIQ，该公司对 HPC 领域投入巨大。CIQ 现在提供 Furnuzzing
    (2022年秋) 计算平台，旨在取代 CentOS、服务和全球数据中心，同时保持从本地到云端再到边缘的供应链完整性。其价值声明包括以下内容：


    - 保持务实。作为开源倡导者，对简单的直觉是使用那些本身允许所有权的工具，但解决问题的最佳实践可能需要我们使用正确的工具。

    - 保持慷慨。欢迎公开的理由；所有社区和所有视角的投入都受到重视并经过考虑。

    - 团队领先于自我。不需要奉承者，也不需要唯唯诺诺。


    虽然我们正开始创建一个稳定的下游 Linux 发行版，但我们的目标正在增长，需要关注特殊兴趣的需求，包括帮助教育项目、研讨会、会议，无疑……


    Rocky 做到 RHEL 能做的一切，除非你想付，否则你不需要付费。Rocky 知道他们的使命取决于高效的流程。Peridot 构建也是你投资的一部分。如果你有需求，Rocky
    可以让你轻松发布 Rocky 系统，但不要重造轮子，你可以在 Rocky 网站寻找 SIG。


    ## 结论


    Rocky 项目正式归 Rocky Enterprise Foundation (RESF) 所有。它是一个由 Rocky 创建者 Kurtz 拥有的公共公司，其设计旨在平衡利润与开源选择。社区在
    matter 聊天中进行讨论（图 4）。Rocky 的聊天网站注册了超过 7,000 名成员，包括连接到公共论坛集合 [5] 的用户，为用户提供更多关于 Rocky
    及相关主题的通用信息。


    ## Info


    - Rocky: https://rockylinux.org/

    - CIO: https://ciq.com/

    - Rocky Sponsors: https://rockylinux.org/sponsors/

    - Rocky chart: https://chat.rockylinux.org/

    - Rocky forum: https://forums.rockylinux.org/

    - :://chat.rockylinux.org/


    ## 社区很重要


    为了支持其社区，该项目采用了一份章程，发布在 Rocky 论坛上。社区使用聊天来……


