    Once you refresh your browser, you should see a login screen for your username\
    \ and password (Figure 10). Also added test and admin users (the password is admin).\n\
    \nBecause shell sequences tend to recur, smart predictions can save you typing.\
    \ For example, if I edit code, then I save it, then I compile it, a smart tool\
    \ would be capable of predicting what comes next. In 90 percent of the cases,\
