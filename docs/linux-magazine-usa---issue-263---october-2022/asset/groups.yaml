    Liam Howlett 代表自己和 Matthew Wilcox 最近宣布了“枫树”（Maple Tree），他希望这个特性曾能被包含在 Linux 中。Andrew
    Morton 请求对枫树进行一个详尽的解释。因此，尽管你可能想象了接下来会发生什么场景，Liam 都说：“枫树是一个 RCU 安全的范围 B 树，旨在有效利用现代进程。”


    一种 B 树数据结构旨在让用户极快地找到和检索数据片段。名称中的“树”指的是搜索路径，在该路径你可以排除错误的路径并迅速缩小范围。这就像一个有趣的游戏，人们在
    1 到 100 之间选一个数字，并告诉朋友他们的猜测比秘密数字高还是低。然而，B 树并不是通过“二分/高低方式”向下搜索，而是每次将树分裂成两个以上的分支。


    我个人觉得的一点是，枫树并不是为了增加某些缺失的内容或修复已损坏的部分——尽管与其他人一样，该补丁旨在让内核更快，并让代码本身更整洁。人们很容易忘记，在许多安全讨论和其他高关注的话题之外，Linux
