    # FOSPICKS LINUX 之声


    ## Libre TrainSim


    Libre TrainSim 这里有两个元素在起作用。首先显然是火车，以及某些极客喜爱的模型音乐，这与 Linux 粉丝不同。其次是游戏正变得越来越流行。这些是那些需要思考或血糖飙升式反应的游戏，能让你在让自己忙碌的同时放松或听音乐。Libre
    TrainSim 正是那样的游戏，尽管它有很大的深度。


    对于想要体验 TrainSim 的玩家，最简单的入门方法是加载游戏并使用训练轨道（此处是双关语）。你很快就会发现自己控制着一列 3D 虚拟火车，面前是虚拟的树木、轨道和铁轨视图。画面效果虽然简单，但能有效地传达出真实驾驶员拥有的视野。你还可以从第一人称视角切换到整个列车的完全渲染视图。


    训练模式将引导你完成启动和停止火车的基础操作，信息包含在设置时间表的提示中。你还拥有额外的灯光、门以及最重要的——声音控制按钮！你还必须学习如何使用信号和限速。Libre
    TrainSim 最初是由一名学生在课余时间使用 Godot 引擎创建的，现在该项目有一个小型开发团队支持支持，为编辑器和后台功能添加了所有新轨道、路线和功能。你也可以自己完成一切，而且还有一些优秀的文档伴随着项目轨道、场景，甚至还教你如何使用少量的
    Godot 脚本创建路线和服务的逻辑。


    项目网站

    https://www.libretrainsim.com


    ## 实时策略游戏


    ## MegaGast


    MegaGast 是一款实时策略（RTS）游戏，它是对一款名为《Ghost》的旧游戏的重新诠释。这两款游戏在过去的不同阶段都曾被遗弃。MegaGast 最近已发布并开始调整其源代码，看到它再次回归非常棒。如果你想支持多人玩家并获得
    Steam Deck 的一键安装体验，可以再次从 Steam 获取；或者获取游戏本身——它是开源的，可以从软件包安装，这会让任何玩过 RTS 的人立即感到熟悉。


    游戏中的某些元素让它看起来像《殖民者》（Settlers）系列，战斗画面看起来则像来自出色的《魔法之旅》（Magicka）。你从俯瞰视角观察密度——这既体现在你土地的字面顶视视图中，也比喻地体现在居民毫无疑问的反应中。你需要分配矿产任务、建造结构，并与许多不同的地形和七个不同的派系战斗。这些派系包括科技、魔法、埃及、波斯和罗马。派系类型会影响你能做的事情、需要哪些资源，而这可以通过“科技树”功能来理解。


    游戏提供了一个更好的场景来引入游戏机制。当你能够立即开始战斗时，不如先获取资源并建设基础设施。在此过程中，你可以发展出一支大军，最后通过入侵邻居来揭示你的自恋本质，并希望赢得他们的领土和资源。这很有挑战性，有一个学习曲线，但你也可以独自对抗优秀的电脑控制对手，然后再在线与一些精英人类玩家对。无论如何，这都很有趣，对于一款开源游戏来说，它完全且彻底地实现了现实。


    项目网站

    https://meggast.org


    ## LINUX 之声教程 – IMAGEMICK


    ## 使用 ImageMagick 进行脚本绘图


    ### 剪影


    ImageMagick 的功能不仅仅是编辑图像。这款免费软件甚至可以通过脚本来创建简单的图形。


    作者：RALF KIRSCHNER


    通常你会使用带骨的图形程序进行绘图，并且需要在图像中绘制以固定间隔重复的规则形状——如此处所示，例如在创建一个虚拟城市的剪影时（图 1）。本教程使用的是一个带有复杂语言的昂贵图形程序。而在命令行使用免费开源的
    ImageMagick 软件包完全胜任此工作。


    要组合更广泛的图像，你需要类似脚本语言的支持，例如 Bash，它使用循环和其他结构来表示将内容插入到图形中。在大多数 Linux 发行版的包源中都可以找到
    ImageMagick，也可以从项目的下载源下载并安装 [1]。


    为了证明你确实可以在命令行界面使用 ImageMagick 绘图，请参见列表 1 中的命令。


    这是为了使用参数设置图像大小。然后：`skyblue` 将图像背景涂成天蓝色。在历史上，`xc-` 代表“颜色”，但今天它代表画布（canvas）。ImageMagick
    将在当前目录下创建 ge.gif 文件。它显示了图中右上角的魔法术师。你可以通过在 ImageMagick 内部测试图像中打开文件来轻松检查这一点，内部测试图像可以使用该名称和魔法术师：创建更多测试图像
    [2]。


