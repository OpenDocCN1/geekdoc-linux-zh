    MkDocs [1]。对于任何寻找简单且低成本方式来维护文档的人来说，这简直是天降的灵赐（见图）。你也可以将 MkDocs 用于任何需要结构化和易于搜索的格式呈现的内容，从研究笔记到知识库等。


    ## 第一步


    如果你的机器上已经安装了 Python 3 和 pip，你可以通过 root 身份运行以下命令来部署 MkDocs：


    ```bash

    pip3 install mkdocs

    ```


    顺便，你还可以通过以下命令安装带有 [2] 扩展的 Material 主题：


    ```bash

    pip3 install mkdocs-material

    ```


    虽然在技术上是正确的，但仅仅称之为 Material 主题将对其大不敬。MkDocs 不仅仅是与新工具合并了 Docs，它还增加了一层功能，单此这一点就值得。尽管付费支持者可以使用某些功能，但本文描述的所有功能都是免费的。


    ## 通用步骤


    mkdocs server 是一个静态链接的二进制文件，以 tarball、deb/rpm 包和 Docker 镜像的形式提供。我们支持所有的 x86、arm64
    和 armv7架构。


    - 1. 使用下方描述的方法之一安装 mkdocs

    - 2. 运行（可选）`mkdocs-server` 启动本地服务器

    - 3. 使用 `mkdocs build` 部署（可选）以生成静态站点。要测试更改，使用 `mkdocs serve`。


    **图 1：** MkDocs 允许你以最小的努力为项目构建文档。


    可用功能。要利用这些功能，你需要通过编辑 `mkdocs.yml` 配置文件来启用并配置它们。最初，文件包含几个配置参数：功能列表。如果你希望标题栏在用户滚动过某一点时自动隐藏，请在主题的
    header 部分启用 autohide 功能：


    - autohide


    当你准备好创建项目文档时，运行命令：


    ```bash

    mkdocs new

    ```


    （替换为你的项目-name）这将创建一个包含两个项目的项目结构：`mkdocs.yml` 配置文件和存储实际内容的 `docs` 目录。其中的内容是 Markdown
    格式的。你现在可以添加更多文件并在内部进行组织。例如，你可以为每个主题创建一个单独的文件，并将它们分组到子目录中，如入门、教程、参考资料等。


    当你准备好查看文档时，运行 `mkdocs serve`，它会在浏览器中打开 `127.0.0.1:8000`。服务器会自动重新加载以反映项目目录中的更改。虽然构建的服务器允许你预览文档站点，但你仍然需要源代码转换为自包含的静态站点。当你准备好发布文档时，运行
    `mkdocs build`，它会创建一个包含所有必需组件的静态站点。


    这比从单个根文件要好。MkDocs 允许你像管理代码一样管理文档项目。如果你选择这种方法，只需要使用 Git 并上传到 GitHub、GitLab 或私有实例来托管源代码，你可以使用仓库替换文档站点右下角的链接。


    Material 允许通过在调色板设置中使用相应的条目指定主色和强调色来调整其色板。要确定你想使用哪些颜色，请打开颜色更改页面 [3] 并选择产生细节的主色和强调色。带有切换选项的深色模式使阅读体验更舒适。通过在
    Material 中启用此功能，你可以开启深色模式并为默认主题定义切换器。列表 1 是针对默认主题的：


    - scheme:


    ```yaml

    <..>

    ```


    - toggle:


    ```yaml

    icon: material/lightbulb-outline

    switch: Switch to dark mode

    ```


    MkDocs 添加了星标（Stars）和分支（Forks）。但不仅如此。如果你想鼓励读者为你的文档做出贡献，你可以轻松地编辑并在每个页面添加链接。该链接指向仓库，读者可以在其中进行编辑并创建请求（pull
    requests）。


