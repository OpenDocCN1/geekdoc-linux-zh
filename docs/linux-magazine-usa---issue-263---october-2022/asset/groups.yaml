    then made the change to RHEL.


    IBM''s acquisition of Red Hat caused a turning of priorities, changed again in
    2020, making that CentOS no longer be a clone of the enterprise. It would be easy,
    but it was unfortunately up to the red hat to do it.


    Once again the community scrambled, searching for a new distro to play the role
    that CentOS had played for so long. One of the leaders to emerge as a free Linux
    based on RHEL is Rocky Linux.


    One day Red Hat (the company) announced that it would no longer provide a binary
    version of CentOS for free. The binary Rocky Linux was born, which came at a cost
    but could support services. If you''re wondering whether charging for Linux is
    consistent with Linux''s GNU General Public License (GPL), rest assured it is.
    The GPL requires that the code available if the program is modified - it doesn''t
    require the distributor to distribute the compiled, binary version for free. As
    long as Red Hat posted the source code somewhere, they were free to change whatever
    they wanted for the binary version - and changed as much as Microsoft was charging
    for Windows (Why is Rocky Linux better than CentOS?).


