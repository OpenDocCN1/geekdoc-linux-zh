    MkDocs, a static site generator, lets you easily transform Markdown files into
    ready-to-use, user-friendly project documentation. By Dmitry Popov


    Documentation: Everybody needs it, but not everyone wants to deal with it, especially
    for smaller projects where time and resources are limited. Even if you manage
    to find time to create technical content, turning it into user-friendly, searchable
    and easy-to-navigate documentation is no mean feat — unless you use MkDocs [1].
    This is manna from heaven for anyone looking for a straightforward and low effort
    way to maintain documentation (Figure). You can also use MkDocs for any content
    needs to be presented in a structured and easily searchable format, from research
    notes to knowledge base.


    # First Steps


    If you have Python 3 and pip installed on your machine, you can deploy Mk-Docs
    by running the following command as root:


    ```

    pip3 install mkdocs

    ```


    While you are at it, you can also install the Material theme with [2] with:


    ```

    pip3 install mkdocs-material

    ```


    Although technically correct, to call Material theme would be doing it a great


