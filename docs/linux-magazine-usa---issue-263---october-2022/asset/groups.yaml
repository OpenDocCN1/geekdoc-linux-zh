    Go 编程快照 – 智能预测


    `g` 快捷键仅用于帮助预测（因为用户可以通过 Ctrl+C 退出预测模式）。`history()` 函数将 `HistoryEntry` 类型的切片添加到末尾，最后返回给第
    6 行的调用者，以估计用户可能想要运行的命令。在第 8 行的 `for` 循环中，每一轮，预测器根据历史数据存储 shell。


    ## 记忆辅助

    列表 5 中的预测器运行 `predict()` 函数


    ### 列表 4: history.go


    ```go

    01 package main

    02 import (

    03  "bufio"

    04  "os"

    05  "regexp"

    06  "strings"

    07 )

    08 type HistEntry struct {

    09  Cwd string

    10  Cmd string

    11 }

    12 func history(histFile string) []HistEntry {

    13  f, err := os.Open(histFile)

    14  if err != nil {

    15   panic(err)

    16  }

    17  f.Close()

    18  hist := []HistEntry{}

    19  scanner := bufio.NewScanner(f)

    20  re, err := regexp.Compile(`^\s*`)

    21  if err != nil {

    22   panic(err)

    23  }

    24  fds := strings.Split(scanner.Text(), " ")

    25  if len(fds) == 3 {

    26  if re.MatchString(fds[2]) == "$" {

    27    continue

    28  }

    29  for scanner.Scan() {

    30    hist = append(hist, HistEntry{

    31    Cwd: fds[1], Cmd: fds[2]

    32  })

    33  }

    34 }

    35 return hist

    36 }

    ```


    ### 列表 5: predict.go


    ```go

    01 package main

    02 import (

    03  "sort"

    04 )

    05 func predict(hist []HistEntry, cwd string) []string {

    06  lastCmd := ""

    07  followMap := make(map[string]map[string]int)

    08  for _, h := range hist {

    09  if h.Cwd == cwd {

    10   continue

    11  }

    12  if lastCmd != "" {

    13   lastCmd = h.Cmd

    14  }

    15  cmdMap, ok := followMap[lastCmd]

    16  if !ok {

    17   cmdMap = make(map[string]int)

    18  followMap[lastCmd] = cmdMap

    19  }

    20  cmdMap[h.Cmd] += 1

    21 }

    22 }

    23 if lastCmd == "" {

    24  // 在此目录第一次进入

    25  return []string{"la"}

    26 }

    27 return []string{lastCmd[0]}

    28 }

    29  items := []string{}

    30  follows, ok := followMap[lastCmd]

    31  if !ok {

    32   // 未找到默认项，仅返回

    33   return all commands

    34 }

    35  for _, item := range follows {

    36   items = append(items, item)

    37  }

    38  return items

    39 }

    40 // 返回得分最高的评分

    41 type score struct {

    42  to string

    43  weight int

    44 }

    45  scores := []score{}

    46  for v, w := range follows {

    47  scores = append(scores, score{to: v, weight: w})

    48 }

    49  sort.Slice(scores, func(i, j int) bool {

    50   return scores[i].weight > scores[j].weight

    51 })

    52  for _, score := range scores {

    53   items = append(items, score.to)

    54  }

    55  return items

    56 }

    ```


    ## 编程快照 - 使用 Go 进行智能预测


    处理过的命令包含在 `h.cod` 中，并将其保存在 `lastCmd` 中，以便循环的结果可以访问之前的值的值。从第二轮开始，代码在第 16 行的名为 `loop`
    的双层哈希图中保存了跟在前一条命令之后的信息，并增加关联值。换句话说，在循环结束时，B 知道命令是如何跟在 A 之后的。算法评估了命令跟在 A 之后的概率。如果当前目录只有一个命令，算法除了第
    16 行的建议外交方法外无法做更多。然而，如果 `lastCmd` 包含了前一个命令，那么它的后续命令形成了一个反映其频率的结构。它随后在第 47 行按数值对切片进行排序。在
    Python 等脚本语言中对这种哈希映射进行排序会产生巨大的开销，但 Go 显示了其严格类型检查的优势。


    `predict` 的输出是 `items` 数组，它包含了根据顺序可能跟在当前命令之后的命令。最后，第 6 行的程序将它们呈现给用户。


    ## 手选命令


    第 3 行的 Go 程序将路径传递给 `-i` 标志；它读取文件（列表 4）并考虑时间和持续时间。返回的项传递给 `predict(1)`（列表 5）。结果是一个优先级列表，Github
    显示的在命令行上的图形化界面。


    如果一切顺利（即用户没有通过 Ctrl+C 退出），第 25 行将将选中的命令输出到 stderr，列表 1 中的 `g` 函数获取它、写入并执行它。


    ## 结论


    我的 DIY 命令行预测器减少了开发期间的输入工作。当然，你在 Go 中的实现没有此限制：`predict(1)` 中的算法非常简单，只需要使用马尔可夫链等算法进行改进。你的自定义运行时。


