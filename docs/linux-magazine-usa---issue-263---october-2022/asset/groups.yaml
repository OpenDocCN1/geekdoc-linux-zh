    With the release of Firefox 103, a few new features are added at greatly improving
    the experience of some users. One of the biggest additions to the open source
    browser is firefox horizontal swipe gesture for navigating back and forward with
    a trackpad. This feature has been in the works for some time and is now seeing
    the light of day. However, there is a caveat to the new update: developers'' goal
    was to have the full support with two-finger gesture is to first press and hold
    the Alt key on your keyboard. Hopefully, somewhere in the next update that requirement
    will be removed and the feature will work exactly as expected.


    Other goodies to Firefox 103 included highlighted required fields on PDFs, significant
    performance improvements for monitors with 120Hz+ refresh rates, improved Picture-in-Tab
    subtitles, and Tab-Shift-Tab shortcut keys.


    Several issues have also been fixed, as preserving non-breaking spaces, WebGL
    performance issues, and start-time slideshows due to processing web content storage.


