    # Maker空间 (MakerSpace)


    # 树莓派上的 RFID 读取器


    # 数南瓜


    用于 SPI 接口的廉价组件让你可以将树莓派 4 升级为用于非接触式 RFID 数据采集显示系统。Martin Mohr


    无线频率识别 (RFID) 标签已成为工业、政府以及批发和零售空间不可或缺的工具。廉价的应器芯片可以在衣服标签、身份卡和信用卡上找到。通过 RFID 和树莓派，你可以从这些芯片中读取数据并在显示器上查看。


    将 ST7735 串行外设接口 (SPI) 薄膜晶体管 (TFT) 显示器 [2] 连接到树莓派 4。这些模块在网上商店的总成本可能低于 15 美元（15
    欧元，14 英镑）。南瓜包含简单的 RFID 标签 [3]，这些标签也可以免费获得。尽管项目展示的接口非常清晰，看起来可以立即运行，但请查看“意外、不幸与故障”以了解可能出现的问题。


    在这个项目中，我从贴在 3D 打印南瓜上的 RFID 标签中读取数字——这是一种稍微不同的检测任务。为了实现这一点，我连接了一个 RC522 [1] RFID
    套件和一个 1.8 英显示器。


    图 1 中的电路图显示了模块如何连接到树莓派，其中包含两个用于测试的南瓜和 LED。


    # 意外、不幸与故障


    在经过短暂的思考后，我检查了将使用哪些库来控制模块。在了一整天的调试和编程后，结果发现 RFID 读取器的库已经多年没有维护了。在 Python 3 中让它运行的唯一方法是进行一些更改。在开源项目中，你应该始终查看最后提交（commit）的日期以及问题（issues），这些会告诉你项目是否仍在由社区开发。


    我最近在网上偶然发现了许多被遗弃的软件。起初，它们看起来可能还可用，但实际上，它们已经落灰了多年。例如，非常流行的树莓派热（hot）自 Pi Pico 文章从树莓派
    OS 源中移除以来，已经很久没有看到支持了。然而，互联网会遗忘，这意味着用户不断被过时的手册和教程所绊倒。


    不幸的是，某些 Python 库在没有经过广泛测试的情况下就被硬编码了，导致了不兼容性。因此，我必须将读取器和显示程序分开。


    # 通过 SPI 的 RFID 制作空间


    图 1：项目的电路布局包含在本文的下载部分 [4]。你可以在右侧看到 SPI 和 RFID 读取器的连接。


    之前的型号带有三个 SPI 接口，其中只有两个布线到引脚上。表 1 显示了默认情况下引脚上的哪些引脚对应于各个接口。


    # 显示器和 RFID 读取器


