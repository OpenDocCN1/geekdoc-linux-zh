    绘制高层大楼的缓慢感可以使用一个确定图像大小的脚本来解决。最后，使用 if 语句处理绘图逻辑。它还定义了背景颜色并设置了楼数。


    ### 三盒结构


    列表 2 中第一次调用的结果如图 2 所示：一个简单的矩形图像。


    ### 列表 3：miniHouse


    ```xml

    <?xml version="1.0" encoding="UTF-8">

