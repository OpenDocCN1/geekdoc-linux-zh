    # MADDOG''S DOGHOUSE


    A look at the history of computer memory and a classic algorithm text. BY JOHN
    "MADDOG" HALL


    # Sorting and Searching


    When I started programming in 1969, every mainframe computers from IBM might have
    had only 1MB of memory and two disk drives that were measured in hundreds of megabytes,
    with microfilm tape drives that would support anything. Any type of parallelism
    in programming stressed the goal of having the data coming into memory, while
    you were also trying to get the data out via "stable storage disk or directly
    to a tape.


    Some of the first IBM programmers used an operating system called MFT (Multi File
    Task) which had up to 16 "partitions", each of a fixed size until the operating
    system was changed.


    When I started with the operators, the Control General Language (JCL) told the
    operating system how much memory it would take, and when it was slotted into a
    memory that was large enough to hold it. If the JCL specified too much memory,
    then memory was wasted. Too small and the program might not finish, or crash.


    The later operating system changed to Multiprogramming with a Variable of Tasks
    (MVT), which allowed the programmer (who was typically the one who generated the
    JCL) to specify the size of one or more slots. The problem was that it could create
    severe fragmentation in the physical memory of the system, and when several small
    slots were joined together a program run would run a cascade of garbage collection.


    If this sounds a bit complex, and even unusual, in the day of the early mainframes,
    I will tell you in additional information that the start of these IBM mainframes
    was only 24 bits (instead of 32 or 64) 16 millions of bytes at a time.


    The machines we used were incredibly slow, and by today''s standards, they thought
    they were "magic". Still, we gave thought to how much memory was needed to give
    each calculation. This worked against us in the long run, and some were perfectly
    useless, as the "YK"


    Jon "maddog" Hall is an author, educator, scientist, and father of Thomas person
    who has been a passionate advocate for Linux since 1994 when he first met Linus
    Torvalds and facilitated the port of Linux. He serves as president of Linux International.


    problem, when we thought that two digits, and not four, enough for the data.


    Many people remember that as we moved toward the year 2000, panic started to erupt
    near or at December 31, 1999, as we turned to see what would happen people started
    thinking about this early on and working to fix it.


    However, some earlier, a series of books named The Art of Computer Programming,
    by Donald E. Knuth, was published that Sorting and Searching was published in
    1973, when I started programming IBM mainframes, and shortly before I started
    my masters degree in computer science.


    In the book clearly explained the methods of sorting and searching and how they
    could take advantage of levels of storage from CPU registers to everything (memory,
    cache, etc.). The book pointed out that the 24 bit address space limitations of
    that day (compared to modern computers), made hash techniques were inefficient
    due to the number of collisions the search make.


    However, it is important to knowing the efficiency of the algorithm, the size
    of the sort, and the architecture that this can avoid consequences. I also remember
    when we tried to sort 1,266 32-byte records, which on a PDP-1170 computer (with
    a 64KB data size) running OS/3 as an operating system, took 10 hours to finish.
    The program used a buffer that could be held to be in memory, but only so that
    virtual memory was not possible. The program made 10 million calls and 1,000,000
    operations to take the task.


    Rewriting the program using a sort and sort as described in Knuth''s book took
    the records into 7 files of which could be read and written in main memory. I
    merged the merged files together into the final output. The result was reduced
    from 10 hours to 5 hours.


    Knuth is not the only author on algorithm study, the depth of analysis he makes
    these ways much more timeless than the editions of other computer books.'
