    # LINUX replacement FOSSPICKS


    ## Watch replacement


    ## Viddy


    There can''t be too many alternatives to the watch command. It''s a brilliant
    command that is typically used to run a command at intervals so you can monitor
    any output change. If you need to check the status of something, for example,
    a track or the amount of memory you''ve used, Viddy is a little tool for building
    scripts to monitor changes or errors. What watch lacks, however, is more dynamic
    output, and it is written. Viddy is named after a famous character in A Clockwork
    Orange (which was inspired by vivid, the Latin word for “saw”), and it performs
    the same function as watch with some modern augmentation.


    The most useful of these augmentations is a diff mode to highlight any part of
    your output activity. Very useful on more complicated commands because they are
    immediately colored in yellow, letting you see exactly which values are new. If
    you do miss the moment when a value changes, another Viddy feature will let you
    roll back out through history so you can see what changed and when. All this can
    be done with Vim-like bindings, which can be edited, and in full color, which
    can also be configured to your own taste.


    Viddy can be used to track output changes and monitor suspicious jealous activity.
    Output is paged so you can easily scroll up or down through large volumes of output,
    and you can pause and resume wherever you''re running directly. The resulting
    updates are likely to make Viddy a more common occurrence in your history, and
    the perfect tool for any ad monitoring and data tracking jobs.


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_85_0.png)


    # Project Website


    https://github.com/sachao/viddy


    ## Process launcher


    ## mprocs


    Any of us are accurately accustomed to use semicolons on the command line to separate
    and run multiple commands at once, but the old nohup script to fork tasks into
    the background is quite apart from the task management offered by the average
    environment. What is missing is a better task management functionality, and what
    mprocs is providing functionality but with far more. It runs by the list of commands
    you want to run simultaneously, and you''ll be presented with a TUI-like interface
    with the list of commands on the left and a pane containing the selected command''s
    output.


    The words UP and DOWN are used to show whether a command is running, and you can
    switch between commands with the cursor or Vim keys. It''s perfect for small clients
    and servers. A variety of techniques are used to focus on the output process,
    letting you interact with an editor or change the order of help, but you can perform
    more dynamic operations like kill and add new process on the fly using the interface
    in the bottom of the panel, there are also keys to help you start, stop, and restart
    a process, and it''s easier to manage these commands from mprocs than to remember
    the secret key.


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_85_1.png)


    mprocs is like tmux for repeatable sets of commands which you want to control.
    If you have a terminal manager you need to setup it, all of this can be put into
    a YAML-formatted file to describe the commands you want to run and the environments
    you''ll run in. An even more advanced version is via SSH. With this enabled, you
    can remotely manage whatever is running on the server, with a local version of
    the controls. It works highly and is a genuine alternative for more complex and
    over-engineered tools.


    # Project Website


    https://github.com/vmok/mprocs


    ## Emulator configuration


    ## EMuDeck


    One of the best things to come from Valve''s Deck is the extra scrutiny our community
    saw and coming wave of newcomers. Thanks to the Deck running its variation on
    Arch with touch-enabled KDE Plasma, more people than ever are using Discover software
    to install applications. When they run into problems around, and when someone
    finds a solution, it can be shared with a reasonable degree of confidence that
    helped Ubuntu into many forums, and it sustains Ubuntu today.


    EMuDeck is one project born from Steam''s new popularity. It helps new users navigate
    the notoriously complex world of configuration, and does this by asking a few
    simple questions. At its heart, EMuDeck is a complex script that handles the installation
    of RetroArch and which emulators to install, configuring their library, and building
    a working configuration to add games to Steam with various launchers. It also
    adds shaders, covers, and game bezels, helping your emulated games fit side-by-side
    with your Steam games. If you need more control over these elements, it is configured.


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_86_0.png)


    While EMuDeck was created to solve Deck issues, the developers plan to port it
    to Android and other devices.


    | Question | Name |

    |---|---|

    | What tools do you want to get the latest version of? | Emulators |

    | Steam Manager | Steam ROM Manager |

    | RetroArch | Steam Room Manager |

    | Without Wii | All and Everything Else |


    # Project Website


    https://www.emudeck.com


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_86_1.png)


    ## Steam ROM Manager


    One of the final EMuDeck setup processes is to configure and run Steam ROM Manager
    (SRM). This is a graphical application that has been the core of adding emulated
    games to Steam library for years, and does something that isn''t easily feasible.
    It can manage game entries in Steam for any individual title, a game from homebrew,
    or any other game you wish to add. It manages these entries with graphics, bezels,
    and anything else it can find by searching the internet for matching assets. It
    is far better than those of us who don''t want to add (or remove) every one by
    one. The same thing really requires remembering exactly where each asset is loaded,
    sometimes from the box view, sometimes from the banner view, and the properties
    menu. SRM does all of this and works brilliantly with the Steam Deck, but also
    works in the desktop library when you''re browsing on Steam.


    The only downside is configuring your games, and that can take some time out of
    the Steam Deck. The manually installed approach involves creating a preset for
    each emulator you want, and you can use the command-line interface to use details
    on what assets might be downloaded.


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_86_2.png)


    Steam ROM Manager can also be used to change the artwork for native-installed
    games. You can find examples online, and EMuDeck also includes a list that will
    work with RetroArch''s various versions. With the paired assets, you can scan
    your games and SRM will automatically organize what it can. If you like the preview
    you can then add all of them to Steam; you can change any titles you don''t like
    or images that have been wrongly detected. Assets include banners, posters, and
    other images associated with the titles you have, and you can find how assets
    are searched for and where they come from.


    # Project Website


    https://github.com/SteamDB/steam-rom-manager


    ## Paperless-ngx


    We''ve all been waiting to go paperless for a couple of decades now (wonderful,
    tactile, recyclable magazines but still those pulp persist). This isn''t so much
    of a problem for us individuals who can manage the occasional piece of paper with
    a scanner or have a local NAS and remote drive for long-term storage. If we''re
    hoping to go paperless, a cloud service can scan and make them searchable. If
    not, then a self-hosted version of Nextcloud is another good option. But none
    of these scale well, and they''re not specifically made to handle thousands of
    scanned printed documents over a long period of time. What Paperless-ngx has built
    up to is:


    Paperless-ngx, and like its predecessor, runs as a web-accessed server. This is
    important because it means you have complete control over where your documents
    are stored and how they''re accessed, without the overhead of having to run the
    background service yourself. Your another great feature is that it is group-based,
    like Linux, which means different users can have their own accounts and belong
    to one or more groups. Most importantly, Paperless-ngx performs excellent character
    recognition on your documents so you can easily search for any text across multiple
    documents.


    Installation is relatively easy, especially if you choose to follow the Docker
    method, and native Linux installation are excellently documented. There are also
    several ways to get data into Paperless-ngx. The most practical is a physical
    scanner that-


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_87_0.png)


    You can enter files manually via the web interface, via a scanner, from an Android
    app, or by sending an email. It can either serve as a universally accessible network
    or is connected to your server where it can save documents to a shared directory.
    But there are also options, including uploading via the web interface, via an
    Android app, or by sending documents to a preconfigured IMAP address.


    This is Paperless-ngx really shines, because its interface is fast and responsive,
    even when dealing with large number of documents. One or more can be opened at
    the same time, and they become small tabs in the left pane, so back to the dashboard.
    Using an external viewer is a configuration option, and the latest release has
    overhauled the look and feel of the experience. The only downside is that none
    of our documents are encrypted, which means it''s up to you to find a solution
    if you need to safeguard the security of your collection. There are obviously
    plenty of Linux solutions to this problem, but it''s something to consider if
    Paperless-ngx comes as the hub of your office document management.


