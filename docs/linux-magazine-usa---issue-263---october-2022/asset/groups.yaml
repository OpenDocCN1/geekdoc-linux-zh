    # ## Practical Steps


    So I have derived the structure of a BSP based on the Yoacto framework. The next
    steps are to build an image, flash it to your device, and run a small "Hello,
    World!" I used the Digi-C60N-SBC as the hardware.


    # ## Listing 1: Software Installation


    ```

    $ sudo apt-get install wget git-diff unzip texinfo debbsync g-cc-multilib |\n$
    g++ build-essential-chain socat libssl-dev libld2-dev xmin

    ```


    # ## Listing 2: Set Up Repo


    ```

    $ sudo curl -o /usr/local/bin/repo \

    $ http://codestorage.googleapis.com/git-repo-downloads/repo \

    $ chmod a+x /usr/local/bin/repo

    ```


    # ## An Application


    The last step is to run a custom application or modify your custom hardware. The
    first thing you need to do is create two new repositories. One repository owns
    your layer, and the other is for the manifest used to download all layers, using
    the Yo tool. Because the vendor (Digi in this example) controls the manifest,
    you need to add your layer to the repository, and modify the manifest with your
    own repo.


    The second thing you need is the files for your layer. You can copy the configuration
    file from another and create your own using the structure shown previously. For
    a "Hello, World" in application, the resulting structure would be like the one
    in Listing 4.


