    # NEWS

    Kernel News


    First you say that VM_BUG_ON() is only for VM testers


    Then you say ''some testers (ordinary users) IGNORE WARN_ONCE when the kernel
    crashes:''


    So which is it?


    "VM developers, or ordinary users? Honestly, if a VM developer is ignoring a WARN_ONCE()
    from the VM subsystem, I don''t know what to say. ''Anyway, a VM_BUG_ON() is worth
    a million times better, because:''


    +   * the machine will continue working, so they can report the crash even when
    they don''t do it; distros have automated reporting infrastructure


    "That''s why I absolutely ''DETEST'' that BUG_ON() cases - they will often kill
    the kernel with nasty locks, resulting in a completely undebug thing that never
    reported.''


    "Yes, you can be and only put BUG_ON() in places where recovery is possible. But
    even then, they have no actual advantages, just over a WARN_ONCE.''


    Yu clarified that he was not talking about kernel developers ignoring warnings
    or that he believed BUG_ON was only for VM developers. He really was concerned
    with the ordinary user who might more inclined to report a crash to the kernel
    developers than only a warning. To Linux''s point, ''I hear you, and I wasn''t
    arguing about anything, sharing my two cents.''


    Meanwhile, Justin Forbes from Red Hat explained some of the thinking behind use
    of CONFIG_DEBUG_VM is. He said, ''We most split into 3 scenarios:''


    In rahide we run a standard Fedora config for rc releases and .0, but git snapshots
    are built with debug configs. The trade off is that we can''t turn certain options
    which kill performance, but we do get more users running these kernels which expose
    bugs. The rapid kernel follows Linus'' tree and is rebuilt most weekdays. Since
    Fedora is not a default config, but in cases where we can keep a debug on without
    much matching in the way of performance, as is the case with CONFIG_DEBUG_VM,
    I think there is not. And of course RHEL is a much more conservative config, and
    much more conservative reactive/back codebase.''


    He added, ''Keeping the option on becomes problematic, we can simply turn it off.
    Fedora certainly has a more diverse base than typical distributions, and more
    diverse than most pools. Both in the array of hardware, and in the use patterns,
    so things get uncovered would not be seen otherwise.''


    And, regarding the desire to report rather than crash, Justin, ''I agree very
    much with this. We have warnings from users, they don''t go unnoticed, and several
    of these users are willing to spend time to get to the bottom of an issue. They
    may not know the code, but plenty are testing various patches or scenarios.''


    At a certain point in a discussion, Yu said, ''Based on all the feedback, my action
    is to replace all VM_BUG_ONS with WARN_ON_ONCES.''


    And that was the end of the discussion.


