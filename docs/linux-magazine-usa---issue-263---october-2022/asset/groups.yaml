    # COVER STORY


    # Yocto


    # The Yocto framework brings Linux to IoT devices


    # Favorite Recipe


    The Yocto project gives you all the tools you need to build a custom Linux for
    IoT devices.


    By Mohammed Billoo and Jose Cascad


    Hardware has always been a challenge for the Linux community. Although it is possible
    to compile the Linux kernel and its surrounding applications for most hardware,
    doing so can be complicated. It actually takes significant effort to adapt an
    operating system for a hardware platform. Giant companies such as Microsoft and
    Apple have unlimited resources to work out the details with hardware vendors,
    but Linux has been largely left to its own devices to deal with.


    Today Linux developers are in close contact with mega chip vendor Intel, and Linux
    has proven its value on ARM, AMD, MIPs, and other leading hardware platforms.
    Debian supports almost 10 architectures, in multiple variants.


    But what if you''re starting from scratch on a new hardware system? Or if you''re
    developing and the available alternatives for the project you''re building don''t
    meet your needs? Is Linux an option?


    There are other options designed for embedded systems, but if they don''t offer
    the features you need - or if they offer too many features you don''t need - then
    they can be difficult to adapt. (See the boxed "OS Options." The challenges of
    rolling your system to use Linux for many embedded projects, Yocto is working
    to change that perspective)


    The Yocto project [1] describes itself as "an open source collaboration project
    that helps developers create Linux-based systems for embedded projects, regardless
    of the architecture. The project provides a flexible set of tools for building
    embedded Linux that share technologies, software stacks, configurations, and practices
    that can be used to create tailored images for embedded devices".


    +   * a reference embedded distribution, which they call Pokey

    * the OpenEmbedded build system, which is co-maintained by Yocto and the OpenEmbedded
    project


    The overall goal of Yocto is to provide a complete development environment for
    adapting Linux to run on embedded or IoT devices. Environment includes templates,
    tools, methods, and working code.


    One of the most powerful features of Yocto is a modular architecture built around
    layers. A layer is a collection of


    # OS Options


    One key in the development of any IoT project concerns the choice of operating
    system. The choice of OS often depends on the nature of the project.


    For a bare metal environment, no special operating system is needed. Instead,
    it is up to the developer to build capabilities into the application. Developing
    for a bare metal system requires implementing a hardware abstraction layer (HAL)
    that removes the need for the application to directly access hardware drivers.


    Other projects require a real-time operating system (RTOS). While Linux is always
    real-time in environments, it always has a limit on processing. RTOS systems are
    common in the field of robotics, where the consequences can be catastrophic if
    reaction times are not met. Bare-metal Linux systems and RTOS often integrate
    the operating system and kernel.


    A third category of IoT projects calls for a more complete operating system. Bare
    metal Linux favors the lower resource requirements, but requires that a Processor
    has a Memory Management Unit (MMU). On the other hand, Linux as an operating system
    allows access to a huge of ready-made applications and services that are not available
    for bare metal systems and RTOS.


    Since 2008, Linux is supported by the Linux Foundation and through collaboration
    with the OpenEmbedded project. The Yocto project "... combines, and maintains
    three key development elements:


    +   * a set of integrated tools, such as "tools" for automated building and testing,
    and process support through open license compliance, and component information
    for custom Linux-based embedded systems


    Legal: Linux-magazine.com | linux-promagazine.com


