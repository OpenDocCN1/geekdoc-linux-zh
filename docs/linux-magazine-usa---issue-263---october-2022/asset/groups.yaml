  mdcn: "\n\n## 封面故事\n\n## Yocto\n\n`hello-world.bb` 文件必须经过特殊的格式化；列表 5 显示了其内容。前四行描述了配方（recipe）及其许可证。如果是\
    \ GPL ，则必须指定校验和。如果你不想在免费许可证下发布配方，可以在 License 字段中输入值 `CLOSED`。\n\n### 列表 4：目录结构\n\
    \n```\nmeta-custom\n|-- appgs\n|   |-- files\n|   -- hello-world.bb\n```\n\n###\
    \ 列表 5：hello-world.bb\n\n```\n01 DESCRIPTION = \"Simple Hello World Application\"\
    \n02 SECTION = \"examples\"\n03 LICENSE = WITH\n04 LIC_FILE_CHECKSUM = \"://$(COMMON_LICENSE_DIR)\"\
    \n    MIT=$GG3S3gade8e6cf885ec6ad5f7b9f6f2\"\n05 SRC_URI = \"file://hello-world.c\"\
    \n06 S = \"$${WORKDIR}\"\n07 do_compile() {\n08     $$(WORKDIR)\n09 }\n10 do_install()\
    \ {\n11     install -d $$(bindir)\n12     install -o 755 hello-world $$(bindir)\n\
    13 }\n```\n\n### 列表 6：hello-world.c\n\n```\n#include <stdio.h>\n\nint main() {\n\
    \    printf(\"Hello, world!\\n\");\n    return 0;\n}\n```\n\n### 列表 7：追加文件\n\n\
    ```\nIMAGE_INSTALL_APPEND += \" hello-world\"\n```\n\n列表 5 中的 `SRC_URI` 告诉 BitBake\
    \ 与配方相关的文件所在。在这个示例中，唯一的文件是一个单一 C 文件。然而，你可以指定由 Git 管理或划分的仓库。\n\n配方的末尾包含另外两个函数（第\
    \ 7 行和第 10 行），用于编译应用程序源码并安装结果。Yocto 框架带有这些函数的基础版本，用户可以对其进行覆盖。框架还已经包含了其他用函数的模板，例如下载配方（down-recipes）。\n\
    \n实际的应用程序是非常简单的 C 文件（列表 6）。要创建该配方，只需使用 `bitbake hello-world` 命令即可。\n\n为了让列表设备运行“Hello,\
    \ World”应用程序，你需要将其添加到最终镜像中。因此，`bitbake-image-class` 已经告诉 BitBake 从 image-class\
