    他补充道：“保持选项开启会变得有问题，我们可以简单地将其关闭。Fedora 的基础比典型的发行版更多样，也比大多数池更多样。无论是在硬件数组还是使用模式上，因此在其他情况下无法发现的问题会被发现。’


    此外，对于报告而不是崩溃的愿望，Justin 表示（此处可能是 Justin said 的笔误），‘我非常同意。我们收到了用户的警告，这些警告没有被忽视，其中一些用户愿意花时间彻底解决问题。他们可能不懂代码，但有很多[用户懂代码]。’


    # OS 选项


    ## 封面故事


    ## Yocto


    ## 配方


    Yocto 项目提供了一套构建自定义 Linux 的工具。该项目提供了：


    - 一个参考发行版，他们称之为 Pokey

    - OpenEmbedded 构建系统，由 Yocto 和 OpenEmbedded 共同维护


    Yocto 的总体目标是为将 Linux 适配到嵌入式设备上运行提供一个完整的开发环境。环境包括模板、工具和工作代码。


    Yocto 最强大的功能之一是围绕层（layers）构建的模块化架构。层是……的集合


    # OS 选项


    任何项目开发中的一个关键点是操作系统的选择。系统的选择通常取决于项目的性质。


    对于裸机环境（bare metal environment），不需要特殊的操作系统。相反，需要开发者将功能构建到应用程序中。为裸机系统开发需要实现一个硬件抽象层（HAL），以消除应用程序直接访问硬件驱动程序的需求。


    其他项目需要实时操作系统（RTOS）。虽然 Linux 在环境中始终是实时的，但它在处理上一直有限制。RTOS 系统在机器人领域很常见，如果不能满足反应时间，后果将是灾难性的。裸机
    Linux 系统和 RTOS 经常将操作系统和内核集成。


    第三类 IoT 项目需要一个更完整的操作系统。裸机 Linux 有利于较低的资源需求，但要求处理器具有内存管理单元（MMU）。另一方面，Linux 作为操作系统允许访问大量的现成应用程序和服务，而这些服务在裸机系统和
    RTOS 中是不可用的。


