    # 自由与开源软件

    在经历了一场为了寻求真理的漫长虚拟探寻后，本月 Steam Deck 世界的新发布品中出现了闪闪发光的明珠。作者：GRAHAM MORRISON, Cecilia


    # Cecilia 5

    我们过去研究过音频处理软件，但还没有什么能与 Cecilia 相比。它是一个用于声音探索的具体站点，其用户界面是为高级用户设计的。它可能模拟我们能想到的任何其他应用程序。你选择的每个模块都可以随着主模式中的线条或曲线随时间改变。它可以根据你的需要简单或复杂，还有其他选项可以生成数学精确的正弦波或方波，或随机分布的模式，所有这些随后都可以被平滑或从另一个分离。按下任何点即可听到你调整的结果。你通常会得到长长的浸在混响中的低鸣声或合成纹理。通过明智的编辑，你将发现漂亮的铺音色（pads）。它的复杂性取决于你的需求，但非常神奇。Cecilia
    是所有的实验和集成。


    项目网站：http://ajasoundstudio.com/cecilia/


    1. 输入和输出：Cecilia 接收文件并录制新的输出。

    2. 时间拉伸：设置音频拉伸或收缩的长度。

    3. 模块：声音产生取决于选择了哪些模块。

    4. 曲线：Cecilia 中的任何参数都可以通过曲线自动化。

    5. 生成器：曲线可以手动绘制，也可以通过函数生成。

    6. 模块：这是一个简单的示例，但更复杂的模块可以自动化。

    7. 颗粒：所有效果都可以通过 FFT 失真。

    8. 效果：将你的声音通过某些音频效果。


    # Calibre 6.1

    Calibre 是顶级开源应用，如 ''population''、''europe'' 或 ''harry'' 和 ''dobby''。它本身是非常出色的，并且执行重要功能，它还是一个具有稳定库和重大更新的应用程序。这个版本是一个例子，因为在十个月的努力之后，它带来了许多数字媒体管理器想要的功能。这些功能之一是全局搜索，它允许你在整个出版库中搜索单词和短语，甚至包含布尔选项。在此之前，你需要为集合手动建立索引，这需要一些时间。但这是一次性的，因为集合中的新标题会自动扫描。如果你不需要搜索，默认设置就好。但如果你需要，它非常有用，特别是当你想将媒体组织在不同的集合中以便更好地隔离搜索结果时。对于你需要的，另一个新功能将是从电子书视图读取书籍。这可以通过插件实现，但看到内置选项很棒。


    你可以同时使用 Calibre 5 和 6，如果你这样做，书籍必须添加到最新版本中才能正常工作。从 Qt 5 升级到 Qt 6，使其成为少数处理这一变更的
    Qt 应用程序之一。这显然带来了更好的证明，但由于 Calibre 缺少某些架构更改，32 位支持已删除。ARM 平台现在已正式支持，并适用于在树莓派上运行。


