    what has been posted by others. When they show images, some extensions check whether
    an image has been published elsewhere. If you find the same image on earlier web
    pages, and it is not marked as an archive or image on the page you are visiting,
    someone has misled you. You can also search for copies of the image, a practice
    known as reverse image search, to detect infringement.


    Fakes are far harder to detect, and a manual check is usually required. Services
    as FactCheck[3] offer an online forum for collaborative verification and annotation
    of videos as well as other media. Amnesty International''s Citizen Eye[4] includes
    online video verification facts meta-data. If the video is found to be from a
