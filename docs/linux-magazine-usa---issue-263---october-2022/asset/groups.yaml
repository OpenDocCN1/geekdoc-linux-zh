    # IoT Components


    Every Linux for IoT device consists of five main components (Figure 2). First
    is the bootloader, which compiles to source code on the developer''s PC that will
    later be executed on the device. The second is executed by the bootloader in the
    CPU''s ROM as soon as the power is turned on. The ROM knows where it can find
    the boot loader, from an MMC or MicroSD card, from the status pins of the CPU.


    The code in ROM then configures the boot medium and searches for the boot loader
    at a preset address. If the boot loader is found, the ROM transfers the code to
    RAM, where the CPU processes it. The boot loader is responsible for setting up


    Although desktop Linux users are accustomed to downloading ISO file to a USB flash
    drive and using it to install Linux on their PC, the process works differently
    for IoT systems. To create all five of the essential components I just described,
    a framework is required.


