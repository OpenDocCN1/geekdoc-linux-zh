- md: "\n## COVER STORY\n\n## Yocto\n\nThe hello-world.bb file must be specially formatted;\
    \ Listing 5 shows the contents. The first four lines describe the recipe and its\
    \ license. If this is under the GPL, the checksum must be specified. If you do\
    \ not want to publish the recipe under a free license, you can enter the value\
    \ CLOSED in the License field.\n\n### Listing 4: Directory Structure\n\n```\n\
    meta-custom\n|-- appgs\n|   |-- files\n|   ||-- hello-world.bb\n```\n\n### Listing\
    \ 5: hello-world.bb\n\n```\n01 DESCRIPTION = \"Simple Hello World Application\"\
    \n02 SECTION = \"examples\"\n03 LICENSE = WITH\n04 LIC_FILE_CHECKSUM = \"://$(COMMON_LICENSE_DIR)\"\
    \n    MIT=$GG3S3gade8e6cf885ec6ad5f7b9f6f2\"\n05 SRC_URI = \"file://hello-world.c\"\
    \n06 S = \"$${WORKDIR}\"\n07 do_compile() {\n08     $$(WORKDIR)\n09 }\n10 do_install()\
    \ {\n11     install -d $$(bindir)\n12     install -o 755 hello-world $$(bindir)\n\
    13 }\n```\n\n### Listing 6: hello-world.c\n\n```\n#include <stdio.h>\n\nint main()\
    \ {\n    printf(\"Hello, world!\\n\");\n    return 0;\n}\n```\n\n### Listing 7:\
    \ Append file\n\n```\nIMAGE_INSTALL_APPEND += \" hello-world\"\n```\n\nThe SRC_URI\
    \ in List 5 tells BitBake where the files associated with the recipe are. In this\
    \ example, the only file is a single C file. However, you can specify repositories\
    \ that are managed by Git or subdivision.\n\nThe end of the recipe contains two\
