    # LINUX NEWSSTAND


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics to complete your collection.


    # #262/September 2022

    Beyond 5G


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_94_0.png)


    Behind the scenes, the cellular phone network has always been the presence of
    highly prized and proprietary equipment, but some recent innovations could be
    changing. This month we explore the Open RAN specification, which could allow
    one day more of the mobile phone network to operate on off-shelf hardware.


    On the DVD: openSUSE Leap 15.4 and MX Linux 21.1


    # #261/August 2022

    USB Boot


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_94_1.png)


    Live boot was such an exciting idea 15 years ago – just carry a CD and boot from
    anywhere. But old-style CDs had some limitations. Today''s USB boot tools solve
    problems plus offer that no one even thought about: access to server images on
    a single stick.


    On the DVD: Linux Mint MATE 20.3 and FreeBSD 13.1


    # #260/June 2022

    Privacy


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_94_2.png)


    If you are really serious about privacy, you''ll need to lean more than your browser''s
    tracking block. Those who need anonymity most depend on the Tor network – a global
    firewall offering safe surfing even in surveillance states. We also look at Portmaster,
    an application firewall with some useful features.


    On the DVD: Ubuntu 22.04 and Fedora Workstation 36


    # #259/May 2022

    Zero Trust


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_94_3.png)


    Twenty Years ago, everyone thought a gateway firewall was all you needed to stay
    safe from intruders, but recent history has a different story. Today, the best
    advice is: Don''t trust anyone. Your internal network could be as dangerous as
    the Internet.


    On the: Zorin OS 16.1 Core and Super GRUB Disk


    # #258/April 2022

    Clean IT


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_94_4.png)


    Most people know you can save energy by changing to more light bulbs, but did
    you know you can save with more efficient software? This month we examine the
    efforts to bring sustainability to the IT industry.


    On the DVD: Manjaro 21.2 Qonos and DragonFly BSD 6.2.1


    # #257/April 2022

    Encryption


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_94_5.png)


    This month, we survey the state of encryption in Linux. We look beyond the basics
    of some tools and technologies that underpin the system of security – and show
    you what you need to ensure your privacy is airtight.


    On the DVD: Linux Mint 20.3 Cinnamon and edition 20.4'
