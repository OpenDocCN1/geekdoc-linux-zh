    \ only read protected chips. If you want to delve a little deeper into the RFID\
    \ authentication, you can refer to the RC522 library documentation [8].\n\nI used\
    \ several another approaches to read the chips. NFC Tag 9 is great for starting\
    \ and offers numerous functions, it allows for a lot of annoying everything.\n\
