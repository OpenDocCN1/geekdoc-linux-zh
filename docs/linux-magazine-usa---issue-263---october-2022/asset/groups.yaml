    \ Wayback Internet archive [1]. For more information, see the box \"The Two Sources\"\
    .\n\nIf you want to continue using the Raspberry Pi's GPIO, you need to look for\
    \ an alternative to wiringPi. The successor is Piggio, which reads the Raspberry\
