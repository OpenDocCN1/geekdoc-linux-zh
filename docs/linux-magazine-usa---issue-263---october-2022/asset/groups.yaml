    ## 深度解析


    ### 技术


    许多用于查找内容的浏览器扩展程序使用了人工智能方法。例如，在文本中，某些短语如“我的观点”或“我认为”已经引起了人们对内容客观性的关注。这些浏览器扩展程序还使用数据库来比较信息并分析其真实性。


    在 Facebook 和其他社交网络上，这些插件还可以显示关于他人发布内容的评论。当它们显示图像时，某些扩展程序会检查图像是否已在其他地方发布。如果你在早期的网页上发现了相同的图像，且它在你访问的页面上未被标记为存档或图像，那么有人在误导你。你还可以搜索该图像的副本（这种做法被称为反向图像搜索），以检测侵权行为。


    伪造信息更难检测，通常需要人工检查。像 FactCheck[3]这样的这样的提供了一个在线论坛，对视频及其他媒体进行协作验证和标注。国际赦赦组织的 Citizen
    Eye[4] 包含了在线视频核实事实元数据。如果发现视频日期比其声称的内容早得多，那么你很可能在看一个伪造视频。


