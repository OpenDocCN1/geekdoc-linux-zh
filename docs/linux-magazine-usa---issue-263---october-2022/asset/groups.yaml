    并不是正确的工具。BUG_ON() 是唯一正确的方法。”


    Yu 坚持了自己的立场，回复 Linus 说：“为了更大的目标，我们希望更多地关注一小部分运行实验性内核的用户，以便他们回来向我们大叫，而且叫得更大声！据推，BUG_ON
