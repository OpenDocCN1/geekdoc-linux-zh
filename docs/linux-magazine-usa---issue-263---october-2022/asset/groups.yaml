    # 封面故事


    # Buildroot


    # 你的应用程序


    为了生成一个可工作的产品，应用程序需要提供 IoT 设备的功能。有时，它仅限于几个脚本，例如你通过网络使用的 PHP 文件，这些文件是根覆盖层（roots
    overlay）的一部分。然而，你通常需要创建自己的自定义组件。


    Buildroot 为编译组件提供了两种方法。你可以为每个组件编辑或设置包定义，这些定义仅包含几行（图 1）。对于每个支持的系统，你将使用 Meson、Cmake、Autotools
    和 Waf。语言是原生处理的：对于 Go 使用 Cargo，Rust 使用，Erl 使用 Rebar，Lua 使用 Luarocks，Perl 使用 MB
    或 EUM。Python 脚本可以通过 Distutils、Setuptools、Peps517 和 Maturin 轻松运行。


    另一种方法是将你自己的定义与 Buildroot 的源码包混合。@EXTERNAL 机制非常简单，允许用户将自定义包定义添加到属于 Buildroot 的包定义中。此外，你还可以配置你的系统和其他文件，例如
    @EXTERNAL root。这使得你所有的自定义内容都整洁地集中在一个地方。


    有时，在 Buildroot 之外编译应用程序更加方便。在较大的项目中，你可能会发现某些开发者并不是每天都使用 Buildroot，如果你直接在开发环境中工作，那么从
    IDE 中编译会更容易。该环境由 Buildroot SDK 提供，其中包含了编译工具链、所有配置好的库和主机环境（hosts）。毕竟，你需要其中一些内容来构建你的项目。它提供了库的选项，并能为
    Google protobuf 定义生成代码。SDK 是一个 tar 包，你可以在任何地方解压。如果你在 SDK 的上下文中设置了 IDE，就可以直接从它进行编译和调试。


    # 管理


    一旦开发出操作系统，通常会有更新和新代产品随之而来。维护包含安全问题修复和新功能的更新发行版至关重要。Buildroot 自 2001 年以来一直存在，它是最古老的
    IoT 工具构建工具之一，这使其成为一个经过验证的产品，而且项目的持续性无疑非常重要。自 2009 年以来，开发者必须保持每年四次的固定发布计划：20XX.2、20XX.5、20XX.8
    和 20XX.11。每个发布版本都要经过为期月的稳定期，在此期间只接受修复；发布版本将维护三个月（错误修复和安全更新）。之后将发布一个新版本。20XX.2
    版本是 LTS（长期支持版本），维护时间超过一年，并再次每月添加发布。


    Buildroot 是社区驱动的，有 100 多人参与贡献，每个版本有 1500 处更改。社区通过邮件列表（lists@buildroot.org）或 Open
    and Free Technology Community (OFT) 上的 IRC 进行通信。随着时间的推移，开发者可以帮助解决问题并学习新知识。在议程中，社区通过公司决策讨论并决定争议性问题。背后没有额外的控制。然而，有一些公司和自由职业服务为
    Buildroot 提供支持。


    开发者可以在笔记本电脑上运行操作系统，并具备开发所需的所有功能。


    开发者提供了工具帮助你维护 Buildroot。你可以使用 pkg-help 列出 Buildroot 中的包，并使用 pkg-config 收集包的信息，在网络上搜索新版本，检查漏洞（国家国家漏洞数据库和
    CVE 报告），并以 HTML 和 JSON 格式提供结果。


    进一步发展 —— 440 项测试。2027 年的 SBC、Somtu 和 Qemu 配置都是使用 Buildroot 构建的。最后，有 10 台生成任意配置的构建服务器。这些服务器的报告可以在线获取。


    # 结论


    Buildroot 多年来演变成了一个在嵌入式世界中成熟且经过验证的系统。Buildroot 使用了大量案例，从只有少量 MB 闪存的系统到用于云部署的 Docker
    镜像，从带有图形栈或数据库的复杂系统。简单、灵活、可重现和维护性使 Buildroot 成为 IoT 系统的选择。通过 Git 仓库克隆 Buildroot
    后，配置它需要一个月以上。回报是一个运行良好的产品。


