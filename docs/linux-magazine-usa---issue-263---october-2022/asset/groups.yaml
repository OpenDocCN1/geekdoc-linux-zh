    # 征稿启


    我们正在寻找关于 Linux 和 Linux 环境工具的优质文章。尽管我们会考虑任何主题，但对以下主题特别感兴趣：


    文章的技术水平应与您通常在《Linux 杂志》中阅读的内容保持一致。请记住，《Linux 杂志》在许多国家阅读，您的文章可能会被翻译成我们姐妹刊物之一。最好避免使用可能并非所有读者都能理解的俚语和成语。


    - 系统管理

    - 有用的技巧和工具

    - 安全（包括新闻和技术）

    - 源自真实体验的产品评论

    - 社区新闻和项目


    如果您有想法，请将包含大纲、长度预估、背景描述和联系方式的提案发送至 edit@linux-magazine.com。


    处理未来的日期或活动时请注意。从您订阅到最终稿件送到读者手中，可能会过去好几周。在发送邮件时，请在邮件主题中使用注明帮助我们识别您的邮件为文章提案。随时欢迎提供截图和其他支持材料。


    更多信息请访问：http://www.linux-magazine.com/write_for_us。


