    TinEye 在搜索中显示图像与日期的关系，以及 URL 和图像大小。这可以很容易判断图像是否是最近创建的——图像是否经过了后期的修饰篡改。TinEye 还会跟踪图像的复制侵权。


    声称分析了来自 50,000 名记者和 2,000 个新闻来源的 1000 万新闻报道，以开发了一种根据四个因素评估新闻的评分系统：


    - 多样性与来源

