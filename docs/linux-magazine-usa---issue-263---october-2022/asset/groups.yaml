    \n[content]\n# IN-DEPTH\nCommand Line – Bash History\n\n## Enhancing efficiency\
    \ with history\n\n## Don’t Know Much\nAbout History\n\nThe versatile Bash history\
    \ command can save time and effort at the command line. By Bruce Byfield\n\n###\
    \ Environmental Variables\nThe history command has several environmental variables\
    \ and all are added or modified in .profile or .bashrc in your home directory,\
    \ depending on the distribution. The size of the history file is limited by HISTSIZE,\
    \ which sets the number of entries in the history; and by HISTFILESIZE, the maximum\
    \ memory to allow for the history. Both have similar structures:\n\n> If you work\
    \ in a terminal, you likely used Bash’s history command to save yourself the trouble\
    \ of retrying a command (1) (Figure 1). If you’re like most people, your use of\
    \ history may have been confined to scrolling through the list of previously used\
    \ commands. If you are interested in the most recently used commands, the arrow\
    \ may be all you need. However, the history command is capable of doing much more\
    \ and in an economical way—especially if you have a good memory. You can start\
    \ adjusting history’s environmental variables and learn to manage history more\
    \ easily by searching and for repurposing them using three types of editing options:\
    \ event, designers and modifiers. The flexibility of all three is so great that\
    \ you can make the Bash history work for you to save time with minimal effort.\n\
    \nWhen the HISTSIZE variable is reached, earlier entries are deleted and replaced\
    \ by new. Many users first opt to use a high number, such as 10,000 entries. Because\
    \ the history is a text file, there should be no problem with how you store the\
    \ history file.\n\n### Author\nBruce Byfield is a computer journalist and a freelance\
    \ writer and editor specializing in open and free software projects. In addition\
