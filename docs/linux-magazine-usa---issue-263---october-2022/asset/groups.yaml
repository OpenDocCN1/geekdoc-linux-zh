    通过 0 A.D. 沉浸在活生的历史中。


    # 古代重生


    在即时策略游戏 0 A.D. 中主掌古代文明的命运并复兴历史。


    BY D TIBI


    也许你在学校里喜欢历史，也许你只是觉得那种历史很无聊。无论如何，玩一下 0 A.D. 即时策略游戏 [1] 是值得的，它带你回到公元 1 年（我们的历法中没有公元零），并将古代文明的命运交在你手中。建筑、单位和技术基于真实的历史。游戏让历史栩如生。


    0 A.D. 是经典的 Linux 游戏之一，所有流行的发行版在其软件包源中都包含它。但如果你通过发行版的包管理器安装游戏，你可能无法获得最新版本，这就是为什么我建议从项目网站
    [2] 下载最新发布。你可以在那里找到各种版本以及相应的安装说明。0 A.D. 也以 AppImage 和 Flatpak 软件包格式提供（AppImage
    是一种独立于发行版的 Linux 包格式，程序下载后即可立即启动）。


    # 安装


    0 A.D. 的起源可以追溯到 20 多年前。奇怪的是，游戏的发展一直没有离开 Alpha阶段，尽管这并不影响它的趣味性。当前版本（测试时）为 Alpha
    25 "Yanna"，于 2021 年 8 月 8 日发布。继任版本 Alpha 26 在 2022 年 4 月已进入功能冻结（即停止向当前 Alpha 版本添加新功能的阶段）。


    > 地图编辑器

    >0 A.D. 自带了地图编辑器 Atlas，你可以用它创建自己的地图和战役。为此，点击主屏幕左侧边栏的“Editor”（编辑器）。


