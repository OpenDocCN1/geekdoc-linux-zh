    是我提到的模型（实验性/稳定型）的一个例子。我问了内核维护者 Justin，他可以澄清：‘我们不想要许多 VM_BUG_ON，除非我们允许。（但如果拒绝了它，就违背了拥有
    CONFIG_DEBUG_VM 的目的）’”


