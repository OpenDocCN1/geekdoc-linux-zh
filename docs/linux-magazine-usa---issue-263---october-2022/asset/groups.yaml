    ## 开启你的 Web 开发第一步！


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_6_0.png)


    ## Web 开发基础知识


    现代软件应用通常针对 Web 开发。Linux 专业人员协会（Linux Professional Institute）全新的“Web 开发基础知识”课程支持你完成软件开发的第一步。它包含了适用于培训和自学的学习材料。通过
    Web 开发基础知识考试后，你将获得一张证书来证明你的技能。


    LPI 学习材料可在 learning.lpi.org 获取。

    访问 lpi.org/wde 了解更多关于该计划和考试的信息。


    # 新闻


    ## 技术、趋势和工具更新


    ## 本月新闻


    - Kali Linux 2022.3 发布

    - 14 英 Pinebook Pro Linux 笔记本电脑芯片

    - OpenMandriva Lx ROME 技术预览版发布

    - Linux Mint 21 现已

    - 更多在线


    ## Kali Linux 2022.3 发布


    Kali Linux 是市场上使用最广泛的渗透测试发行版之一。凭借大量预装工具，安全专家和渗透人员可以使用该平台发现你网络中的任何漏洞或弱点。


    2022.3 版本包含了一些新技巧，包括新的 VirtualBox 镜像格式、每周更新以及五种新工具（BruteShark（一种网络分析工具）、Defectojo（一个用于漏洞关联和分析的开源工具）、Splploot（一个后渗透框架）以及
    SprayingToolkit（一种用于 LFI/RI 和命令注入漏洞的工具））。


    Kali 的另一个新增是他们的 Discord 服务器（Kali Linux & Friends），你可以在那里实时聊天 Kali Linux。该 Discord
    服务器是“一个拥有共同兴趣爱好的社区服务器。我们的目标不是获取尽可能多的用户，而是正在为彼此建立一个互相帮助的地方。我们关注的是质量而非数量。”


    最后，还有一个新的测试环境，你可以在其中创建一个测试床进行学习、练习和基准测试。为了方便构建测试床，开发者们创建了 DWIAA (https://www.kali.tools/dwia/)
    和 Juice Shop (https://www.kali.org/juice-shop/)，后者涵盖了整个 OWASP 前十的漏洞。


    - 下载 Kali Linux 2022.3 副本 (https://www.kali.org/get-kali/) 并阅读官方发布说明 (https://www.kali.org/blog/kali-linux-2022-3-release/)
    以了解详情。


    ## 14 英寸 Pinebook Pro Linux 笔记本电脑芯片


    在经历了中国 COVID-19 限制导致的长时间运输延迟后，ARM-64 版 Pinebook Pro 已由 Pine64 发售。该设备配备了双核 ARM
    1.8GHz Cortex-A72 和四核 ARM 1.4GHz Cortex A53，配有四核 Mali T-860 GPU、4GB LPDDR4 双通道系统内存以及
    64GB eMMC 存储。


    Pinebook Pro 14 的受众主要集中于那些想要在 ARM 设备上尝试 Linux 的人员。Pine64 甚至明确表示：“如果你正在寻找 x86 笔记本电脑的替代品，或者只是出于好奇并打算提交退货退款申请，请不要订购
    Pine Pro。”


    这些预订是针对熟悉 ARM 架构并出于特定原因对 Pine Pro 感兴趣的爱好者的。


    该笔记本电脑的其他规格包括 WiFi-11 AC、蓝牙 5.0、一个 USB 3.0 和两个 USB 2.0 type A 接口、一个 USB C 端口、microSD
    卡槽、内置耳机接口、全尺寸 (ANSI) 键盘、机械触感反馈、9600mAh 电池以及 2.0 万像素前摄像头。


    你可以从我们的官方网站了解更多关于 Pine Pro 14 和你的购买信息：$199 (https://www.pine6.com/product/14%E2%80%A4%B3%pine-pro-linux-laptop-ansi-us-keyboard.)，Pine
    Pro 14 的价格仅为 $219，而且公司让你免受设备保护，因为这些笔记本电脑是对 Pine64 和 BSD 社区提供的社区服务。


