    # Paperless-ngx


    We''ve all been waiting to go paperless for a couple of decades now (wonderful,
    tactile, recyclable magazines but still those of pulp persist). This isn''t so
    much a problem for us individuals who can manage the occasional piece of paper
    with a scanner or have a local NAS and remote drive for long-term storage. If
    we''re hoping to go paperless for, a cloud service can scan and make them searchable.
    If not, then a self-hosted version of Nextcloud is another good option. But none
    of these scale well, and they''re not specifically made to handle thousands of
    scanned printed documents over a long period of time. What Paperless-ngx has built
    up to is:


    Paperless-ngx, and like its predecessor, runs as a web accessed server. This is
    important because it means you have complete control over where your documents
    are stored and how they''re accessed, without the overhead of having to run the
    background service yourself. Your another great feature is that it is access group-based,
    like Linux, which means different users can have their own accounts and belong
    to one or more groups. Most importantly, Paperless-ngx performs excellent character
    recognition on your documents so you can easily search for any text across multiple
    documents.


    Installation is relatively easy, especially if you choose to follow the Docker
    method and native Linux installation are excellently documented. There are also
    several ways to get data into Paperless-ngx. The most practical is a physical
    scanner that-


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_87_0.png)


    You can enter files manually via the web interface, with a scanner, from an Android
    app, or by sending an email.


    can either serve as a universally accessible network or is connected to your server
    where it can save documents to a shared directory. But there are also options,
    including uploading via the web interface, via an Android app, or by sending documents
    to a preconfigured IMAP address. There is also an excellent REST API for integrating
    with your tools and for potentially automating and archiving. Paperless-ngx can
    pick up these documents automatically, run the OCR process, archive them as a
    PDF, and then add any tags that it recognizes to the eventual data base. Only
    then do they come from the web interface.


    This is Paperless-ngx really shines, because its interface is fast and responsive,
    even when dealing with large number of documents. One or more can be opened at
    the same time, and they become small tabs in the left pane, so back to the dashboard.
    Using an external viewer is a configuration option, and the latest release has
    overhauled the look and feel of the experience. The only downside is that none
    of our documents are encrypted, which means it''s up to you to find a solution
    if you need to safeguard the security of your collection. There are obviously
    plenty of Linux solutions to this problem, but it''s something to consider if
    Paperless-ngx comes as the hub of your office document management.


    ![](img/527ef1a4e6443ad30b67df9e58b510e1_87_1.png)


    Paperless-ngx has been built with Django and is brilliant at accessing and printing
