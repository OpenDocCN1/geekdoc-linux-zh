    如果你对其他安装方式感兴趣，可以在该工具的网站上找到更多细节 [5]。


    ```

    $ grep abyz.me.uk/rpi/piggio/piscope.tar

    $ tar xvf piscope.tar

    $ cd piscope

    $ make

    $ make install

    $ ./piscope

    ```


    ```

    $ abyz.me.uk/rpi/piggio/piscope.tar

    $ tar xvf piscope.tar

    $ cd piscope

    $ export PISCOPE_ID_ADDR=<raspberrypi.local>

    $ ./piscope_x86_64

    ```


    这种方法直接将源码下载到树莓派并即时连接接口。PiSpace 通过本地回连接到 Piggio 守护进程，在运行过程中你可能需要解决一些依赖关系。


    # 结论


    Piggio 库无疑是一个编写应用程序的实用框架。所有的编程语言都有封装器和模块。现有的工具允许你顺畅工作，并支持通过网络支持 GPIO。


    在与树莓派对比使用 Piggio 时，你会习惯 GPIO 引脚的不同命名约定。然而，有一点非常突出：在一年多时间里，该项目在 GitHub 上处于捐赠状态。我希望这仅仅是因为自此之后没有看到变化
