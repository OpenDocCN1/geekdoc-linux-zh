    # COVER STORY


    # Buildroot


    # Your Own Applications


    To generate a working product, an application needs to deliver the functionality
    of the IoT device. Sometimes it is limited to a few scripts such as PHP file that
    you use through the web which are part of the roots overlay. However, you will
    usually need to create your own custom components.


    Buildroot offers two approaches to compiling your components. You can edit or
    set up package definitions for each component, consisting of just a few lines
    (Figure 1). For each of the supported systems you will use Meson, Cmake, Autotools
    and Waf. Languages are handled natively: for Go, Cargo for Rust, Rebar for Er,
    Luarocks for Lua, MB or EUM for Perl. Python scripts are easy to run with Distutils,
    Setuptools, Peps517, and Maturin.


    Another way is to look at mixing your own definitions with Buildroot''s source
    packages. The @EXTERNAL mechanism is simple to allow the user to add custom package
    definitions to those belonging to Buildroot. Additionally, you can configure your
    system and other files, such as the @EXTERNAL root. This keeps all your customizations
    neat in one place.


    Sometimes it is more convenient to compile applications outside of Buildroot.
    In larger projects, you might find developers who do not use Buildroot on a daily
    basis and it is easier to compile from an IDE if you are working directly with
    the development environment. This environment is provided by Buildroot SDK containing
    the compilation toolchain, all configured libraries, and the hosts. After all,
    you will need some of them to build your project. It provides the options of library,
    and generate the code for a Google protobuf definition. The SDK is a tarball that
    you can unpack anywhere. If you set up the IDE with the SDK''s context, you can
    compile and debug directly from it.


    # Management


    Once an OS is developed, updates and new generations will usually follow. It is
    important to maintain the updating distribution with fixes for security issues
    and new features. Buildroot has been around since 2001, making it the one oldest
    IoT tool builds makes it a proven product, and the project''s continuity definitely
    matters. Since 2009, the developers have had to keep a fixed release schedule
    of four releases per year: 20XX.2, 20XX.5, 20XX.8, and 20XX.11. Each release goes
    through a one-month stabilization period, during which only fixes take; the release
    is maintained (bug fixes and security updates) for three months. A newer version
    is released after that. The 20XX.2 release is an LTS (Long Term Support) which
    is maintained for over a year and has again release added monthly.


    Buildroot is community-driven, with over 100 people contributing to reach and
    1500 changes per release. The community communicates via the mailing lists (lists@buildroot.org)
    or IRC on Open and Free Technology Community (OFT). With time, a developer can
    help solve problems and learn new things. In agenda, the community discusses and
    decides on controversial issues by company decision. There is no control behind.
    However, some companies and freelance services are offered to Buildroot.


    Developers can then get the operating system running on the laptop with all features
    necessary for development.


    The developers provide tools to help you maintain Buildroot. You can use pkg-help
    to list the packages in Buildroot and use pkg-config for collection information
    about the packages, search for new versions on the networks, checks for vulnerabilities
    (National National Vulnerability Database and CVE reports) which provides the
    results in HTML and JSON.


    Further going on - 440 tests. The 2027 configurations for SBCs, Somtu, and Qemu
    are built with Buildroot. Finally, there are 10 build servers that generate arbitrary
    configurations. The reports from these servers are available online.


    # Conclusions


    Buildroot has evolved over the years into a system that is well established and
    proven in the embedded world. Buildroot uses numerous cases, from systems with
    little IMB flash memory to Docker images for cloud deployment, complex systems
    with a graphical stack or database. The points of simplicity, flexibility, reproducibility,
    and maintainability Buildroot an excellent choice for IoT systems. After cloning
    Buildroot via its Git repository, configuring it takes more than a month. The
    reward is a product that works well.


    # Info


    - [1] Buildroot: https://buildroot.org/

    - [2] Build manual: https://manual.buildroot.org/manual.html

    - [3] NIST CVE report: https://auto.buildroot.org/stats/master.html

    - [4] Build server reports: http://auto.buildroot.org

    - [5] Buildroot (Git repository): https://git.buildroot.org/netbuildroot


