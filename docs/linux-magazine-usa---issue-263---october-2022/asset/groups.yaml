    \nThe wiringPi library, which many Raspberry Pi fans have grown attached to over\
    \ the years, is no longer under maintenance by its developer. An alternative,\
    \ in the form of Piggio, has arrived in time. By Martin Mohr\n\nOr as long as\
    \ the Raspberry Pi has been around, wiringPi has served as a library for accessing\
    \ the GPIO. With the great gpio programmers could quickly manage the GPIO at the\
    \ command line. Many Raspberry Pi projects build on this.\n\nNot least because\
    \ of frustration about what were in part rude communications from some users,\
    \ Henderson decided to discontinue his project in August 2019 after releasing\
    \ his last version. He explained in detail on his website why he had stopping\
    \ the library. The post, which has since been deleted, is still available on the\
    \ Wayback Internet archive [1]. For more information, see the box \"The Two Sources\"\
    .\n\nIf you want to continue using the Raspberry Pi's GPIO, you need to look for\
    \ an alternative to wiringPi. The successor is Piggio, which reads the Raspberry\
    \ Pi's GPIO but uses a daemon to do so. At last, Piggio library offers everything\
    \ you might need for your projects. In this article, we take a look at the library\
    \ to see if this first impression is correct.\n\n# The Two Sides of Open Source\n\
    \nThe open community makes software projects available to the general public.\
    \ Open source thrives on enthusiasts who develop projects in their spare time.\
    \ All too often, however, it happens that these do not get any recognition for\
    \ their work. On the contrary, many people expect to develop the kind of professional\
    \ support you would want from a vendor, and people feel insulted if bugs are not\
    \ fixed immediately. As result, projects disappear because developers no longer\
    \ want to work under these conditions.\n\nit takes some time to notice that a\
    \ particular library no longer works with the current version of the programming\
    \ language. I have seen across Python libraries that developers never ported to\
    \ Python 3. Only then are people responsible enough to remove their outdated projects.\
    \ What matters worse, you also find a plethora of documentation that no longer\
    \ works. Especially for beginners, for whom the Raspberry Pi is first, this often\
    \ causes people to deplete the small-board computer (SBC) in frustration.\n\n\
    Another phenomenon relates to developers who upload a library or tool to GitHub\
    \ and leave it orphaned after some\n\n# Piggio\n\nMuch like wiringPi, Piggio lets\
    \ you access the GPIO of the Raspberry Pi. However, you need to be aware of some\
    \ differences. The first thing to notice about the library is that it requires\
    \ a daemon to work. On one hand, the daemon consumes a bit of the Raspberry Pi\
    \ resources, which is not a problem for most projects. On the other hand a daemon\
    \ has some advantages - over that.\n\nBoth wiringPi and Piggio are based on C\
    \ style. Piggio has a tool to access the GPIO ports at\n\nthe command. Unlike\
    \ wiringPi, it uses the BCM pin designations (Figure 1), although not a genius\
    \ design, requires some getting used to.\n\nThe commands you need to start, stop\
