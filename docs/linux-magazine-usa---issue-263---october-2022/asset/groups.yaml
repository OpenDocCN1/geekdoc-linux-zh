    # MakerSpace


    # RFID reader on a Raspberry Pi


    # Counting Pumpkins


    Inexpensive components for the SPI interface let you upgrade a Raspberry Pi 4
    to a display system for zero-contact RFID-based data acquisition. Martin Mohr


    radio-frequency identification (RFID) tags have become dispensable in industry
    and government, as well as wholesale and retail spaces. The inexpensive transponder
    chips can be found on clothing tags, identification cards, and credit cards. With
    an RFID and a Raspberry Pi, you can read the data from these chips and view it
    on a display.


    ST7735 serial peripheral interface (SPI) thin-film transistor (TFT) display [2]
    to the Raspberry Pi 4. Together, the modules could cost less than $15 (EUR15,
    £14) in online stores. The pumpkins contain simple RFID tags [3], also available
    for free. Although the project shows clear-cut joints as if it would work right
    away, check out the "Mishaps, Misfortunes, and Breakdowns" to find out what can
    go wrong.


    In this project, I read numbers from RFID tags stuck on 3D-printed pumpkins —
    slightly different kind of detection task. To do this, I connected an RC522 [1]
    RFID kit and a 1.8-inch.


    The circuit diagram in Figure 1 shows how the modules connect to the Raspberry
    Pi, with two pumpkins and LEDs for testing purposes.


    # Mishaps, Misfortunes, and Breakdowns


    After some brief, I checked which libraries I was going to control the modules.
    After a day of undoubtedly and programming, it turned out that the library for
    the RFID reader had not been maintained for several years. The only way to get
    it working in Python 3 was to make some changes. In open source projects, you
    should always take a look at the date of the last commit, and the issues, which
    will inform you whether the project is under development by the community.


    I have stumbled across many pieces of orphaned software on the web recently. At
    first, they might still see them tentative, in fact, they have been gathering
    dust for years. For example, the very popular Raspberry Pi hot has not seen support
    for a long time since the Pi Pico article was removed from the Raspberry Pi OS
    sources. However, the internet forgets, which means users are continually tripped
    over outdated manuals and how-to.


    Unfortunately, it looks like some Python libraries have been hot-wired without
    extensive testing, which results in incompatibilities. Therefore, I had to separate
    the reader and display programs in.


    # RFID over SPI MAESPPACE


    Figure 1: The circuit layout of the project is included in the download section
    of this article [4]. You can see the SPI and RFID reader connections on the right.


    previous models came with three SPI interfaces, of which only two were routed
    to the header. Table 1 shows which pins correspond to the individual interfaces
    on the header by default.


    # Display and RFID Reader


    Each of the modules is connected to its own SPI interface. Figure 2 shows the
    project after the build; the RFID tags are hidden in the pumpkins. Please note
    that only the Raspberry 4 has multiple onboard SPI interfaces.


    # Reading from the SPI Interface


    The Raspberry Pi 4 has a total of seven SPI interfaces, all of which can be accessed
    from the 40-pin GPIO header.


    In Table 1 shows all overlap and that SPI is not available on the header in the
    default configuration. However, the SPI interface configuration can be adjusted
    with the dtoverlay command, which also lets you output a list of all predefined
    SPI interfaces (Listing 1). The individual interfaces have various configurations,
    each with a different number of chip select (CS) lines. There, you can configure
    the interfaces precisely to suit your project


    # Listing 1: SPI interfaces


    ```

    $ dtoverlay -all | grep spi.

    sppi0-2cs

    sppi1-1cs

    sppi1-2cs

    sppi2-1cs

    sppi2-2cs

    sppi3-1cs

    sppi3-2cs

    sppi4-1cs

    sppi4-2cs

    sppi5-1cs

    sppi5-2cs

    sppi6-1cs

    sppi6-2cs

    ```


    Figure 2: The complete test setup with a horde of pumpkins, the reader at front
    left, and the display at back left.


    LINUX-MAGAZINE.COM | LINUXPROMAGAZINE.COM ISSUE 262 OCTOBER 2022 61


    # MAKESPACE RFID OVER SPI


    Table 1: Default SPI Pins


    | SPI | Header | Pin | SPI | Header | Pin |

    |---|---|---|---|---|---|

    | SPI0 | MOSI | 19 | SPI4 | MISO | 31 |

    | | MISO | 21 | | MISO | 29 |

    | | SCLK | 23 | | SCLK | 26 |

    | | CE0 | 24 | | CE0 | 7 |

    | | CE1 | 26 | | CE1 | 22 |

    | SPI1 | MOSI | 38 | SPI5 | MOSI | 8 |

    | | MISO | 35 | | MISO | 33 |

    | | SCLK | 40 | | SCLK | 10 |

    | | CE0 | 12 | | CE0 | 32 |

    | | CE1 | 11 | | CE1 | 37 |

    | SPI3 | 36 | SPI6 | MISO | 38 |

    | | MISO | 28 | | SCLK | 40 |

    | | SCLK | 5 | | CE0 | 12 |

    | | CE0 | 27 | | CE1 | 13 |

    | | CE1 | 18 | | | |


    To get the currently loaded overlays, use the -l option. To view the concrete
    definition of a SPI device, with the default pins on the device, use the -h option
    (Listing 2). To output a list of available SPI devices, run:


    ```

    ls dev/spi*

    ```


    Make sure you enable SPI support with dtparam=spi-on in the /boot/config.txt file.
    Alternatively, you can use the Raspberry Pi configuration tool if you want to
    configure devices directly, you can also add them to /boot/config.txt (e.g., dtoverlay=spi1-3cs).
    In principle you can create a software device for the individual lines of the
    interfaces with dtoverlay, but that would be a bit over the top of this page.


    # Listing 2: dtoverlay Output


    ```

    $ dtoverlay-spi

    name=3cs

    Info: Enables spi with three chip select (CS) lines and associated nodes. The
    gpio pin numbers for CS lines and spi device are configurable. Note: this only
    works on devices with a header (eg: Pi A+, B, Zero and Pi B+) as Compute Module.

    Usage: dtoverlay-spi3cs,<param>=value

    Params: cs_pin gpio for CS (default 18 BCM_SPI0)

    c1_pin gpio for CS (default 17 BCM_SPI1)

    c2_pin gpio for CS (default 27 BCM_SPI2)

    s0_device Set to stop the creation of device dev/spi0 (default is ''off'' or enabled)

    c1_device Set to stop the creation of device dev/spi1 (default is ''off'' or enabled)

    c2_device Set to stop the creation of device dev/spi2 (default is ''off'' or enabled).

    ```


    # Prepping the Pi


    The operating system for the Raspberry Pi is an up-to-date 32-bit Raspberry OS.
    Listing 3 shows the commands for updating and installing the required programs
    and libraries from the Python Package Index (PyPI). When you are ready, do not
    forget to enable support for the SPI0 and SPI1 interfaces by enabling the /boot/config.txt
    file and adding two lines:


    ```

    dtparam=spi-on

    dtoverlay=spi-1cs

    ```


    to the end of the file. You will need to restart the Raspberry Pi for the changes
    to effect.


    # Setting Up the Display


    The sample program display.py in Listing 4 is designed to display the text presented
    as a parameter on the display. The system controls the screen with the help of
    ST7735 libraries [5], which was specifically developed to transfer data to the
    display. To incorporate the appropriate interface, access the Pillow [6] image
    processing library (also known as


    # Listing 3: Preferences


    ```

    ### ### Update Raspberry Pi

    sudo apt update

    ### Install OS packages

    sudo apt install python3-pip dev-python

    ### SPI and graphics libraries

    sudo python3 -m pip install RPi.GPIO Pillow numpy

    ### Libraries for display

    sudo python3 -m pip install st7735

    ### The library for RFID

    sudo python3 -m pip install mrc522

    ```


    # RFID over SPI MAAPER


    PIL is a very powerful library with a large number of functions, which I will
    only use a few. The documentation [7] will give you a rough idea of what you can
    do with Pillow.


    When launched, the display.py script first imports (1 through 5) the ST7735 library,
    the required parts of PIL, and the sys library, which reads the arguments from
    the command line. After that it creates a SPI object with parameters suitable
    to the hardware you are using (using 7).


    It generates an image of size suitable for the display and stores it in the image.
    Then it controls the color generate from the parameter passed in the command line
    and to insert into the image (image 14). The last command then transfers the image
    to the display.


    If you run the program with python3 Display.py "Hello world!"


    # Configuring the RFID Reader


    The program in Listing 5 reads the individual UIDs from the RFID chips (1 through
    10) and displays them on the screen (line 13). The display is addressed by an
    external call to avoid the libraries for the display and the reader getting in
    each other''s. After outputting the UID, the program reads the first data blocks
    from the RFID chip in a loop (starting in line 14) and displays them, too.


    Note that the reader does not authenticate against the chip, which means that


    # Listing 4: Display.py


    ```

    01 from PIL import Image

    02 from PIL import ImageDraw

    03 from PIL import ImageFont

    04 import ST7735

    05 import sys


    07 display = ST7735(port=1, cs=0, dc=23, backlight=True, width=128, height=160,
    rotation=0, invert=False, offset_left=0, offset_top=0)

    08 image = Image.new(''RGB'', (display.width, display.height))

    09 draw = ImageDraw.Draw(image)

    10 print(len(sys.argv))

    11 if len(sys.argv) < 2:

    12 print("Usage: Display.py <text>")

    13 sys.exit()

    14 draw.text((0, 70), sys.argv[1], font=ImageFont.etype("UbuntuMono-Bold.ttf",
    10), fill=(255, 255, 255))

    15 display.show(image)

    ```


    command, the Hello world! output pops up on the screen.


