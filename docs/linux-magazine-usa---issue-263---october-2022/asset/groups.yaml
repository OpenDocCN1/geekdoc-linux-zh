    previous models came with three SPI interfaces, of which only two were routed
    to the header. Table 1 shows which pins correspond to the individual interfaces
    on the header by default.


    # Display and RFID Reader


    Each of the modules is connected to its own SPI interface. Figure 2 shows the
    project after the build; the RFID tags are hidden in the pumpkins. Please note
    that only the Raspberry 4 has multiple onboard SPI interfaces.


    # Reading from the SPI Interface


    The Raspberry Pi 4 has a total of seven SPI interfaces, all of which can be accessed
    from the 40-pin GPIO header.


    In Table 1 shows all overlap and that SPI is not available on the header in the
    default configuration. However, the SPI interface configuration can be adjusted
    with the


    dtoverlay command, which also lets you output a list of all predefined SPI interfaces
    (Listing 1). The individual interfaces have various configurations, each with
    a different number of chip select (CS) lines. There, you can configure the interfaces
    precisely to suit your project


