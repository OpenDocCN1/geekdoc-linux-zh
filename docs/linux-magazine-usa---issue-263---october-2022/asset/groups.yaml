    # General steps


    The mkdocs server is a statically linked binary and is shipped as tarball, deb/rpm
    packages and a Docker image. We support all x86, arm64 and armv7.


    +   1. Installing mkdocs using one of the methods described below

    2. Running (optional) with `mkdocs-server` to start your local server

    3. Deploying (optional) with `mkdocs build` to generate the static site. To test
    changes, use `mkdocs serve`.


