    \ 30 | |\n| 10 | 4 | 5v | | 31 | |\n| 11 | 5 | GPCLK | | 32 | |\n| 12 | 6 | Rx\
    \ (UART) | | 26 | |\n| 13 | 7 | Tx (UART) | | 27 | |\n[/content] (Wait, I see\
