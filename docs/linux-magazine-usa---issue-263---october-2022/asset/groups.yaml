    \ a command as it was used; for example, !4 shows the command from four entries\
    \ ago. Additionally, if you enter a string that !pipe shows the command that contains\
    \ \"pipes\". You can even find a string and replace it with another. If you type\
    \ it once,\n\n## Modifiers\n\nModifiers edit your history, allowing it to be removed.\
    \ Modifiers simply remove the entry you want. For instance, h removes everything\
    \ after the modifier, -h head/1/music/pogues from the history. Using, /music/pogues\
    \ delete /head/1/music/from the same entry. Similarly, with ~old would extend\
    \ the extension from an office file, like .docx. With .point, you would only display\
    \ without being, which would be hard if you are unsure exactly which history entry\
