    ## Building project documentation

    from Markdown files


    Documentation,

    Please!


    MkDocs, a static site generator, lets you easily transform Markdown files into
    ready-to-use, user-friendly project documentation. By Dmitry Popov


    Documentation: Everybody needs it, but not everyone wants to deal with it, especially
    for smaller projects where time and resources are limited. Even if you manage
    to find time to create technical content, turning it into user-friendly, searchable
    and easy-to-navigate documentation is no mean feat — unless you use MkDocs [1].
    This is manna from heaven for anyone looking for a straightforward and low-effort
    way to maintain documentation (Figure). You can also use MkDocs for any content
    needs to be presented in a structured and easily searchable format, from research
    notes to knowledge base.


    ## First Steps


    If you have Python 3 and pip installed on your machine, you can deploy MkDocs
    by running the following command as root:


    ```bash

    pip3 install mkdocs

    ```


    While you are at it, you can also install the Material theme with [2] with:


    ```bash

    pip3 install mkdocs-material

    ```


    Although technically correct, to call Material theme would be doing it a great
    disservice. Instead of merely merging Docs with a new tool, MkDocs adds an new
    level of functionality, making it worth for reason alone. With capabilities available
    to paying supporters, all the features described in this article are free.


    ## General steps


    The mkdocs server is a statically linked binary and is shipped as tarball, deb/rpm
    packages and a Docker image. We support all x86, arm64 and armv7.


    - 1. Installing mkdocs using one of the methods described below

    - 2. Running (optional) with `mkdocs-server` to start your local server

    - 3. Deploying (optional) with `mkdocs build` to generate the static site. To
    test changes, use `mkdocs serve`.


    **Figure 1:** MkDocs allows you to build documentation for your projects with
    a minimum of effort.


    available features. To make use of these features leaking the surface, you need
    to enable and configure them by editing the mkdocs.yml configuration file. Initially,
    the file contains several configuration parameters: features list. If you want
    the header bar to automatically hide when the user scrolls past a certain point,
    enable the autohide feature in the header section of your theme:


    - autohide


    When you are ready to create your project documentation, run the command:


    ```bash

    mkdocs new

    ```


    (replacement with your project-name) this creates a project structure that includes
    two items: the mkdocs.yml configuration file and the docs directory for storing
    the actual content. The content in this is Markdown-formatted. You can now add
    more files to organize them inside. For example, you can create a separate file
    for each topic and group them into subdirectories, such as Getting Started, Tutorials,
    References, etc.


    When you are ready to view your documentation, run mkdocs serve, which opens the
    browser to 127.0.0.1:8000. The server automatically reloads to reflect changes
    in the project directory. While the built server allows you to preview your documentation
    site, you will need to convert source to a self-contained static site. When you
    are ready to publish your documentation, run mkdocs build which creates the static
    site with all the required components.


    This gets better than starting with a single root file. MkDocs allows you to manage
    your documentation projects as code. You only have to use Git if you choose this
    approach and upload to GitHub or GitLab or private instances for hosting your
    source code, you can use the repository to replace the link in the lower-right
    corner of the documentation site.


    Material makes it possible to adjust its color palette by specifying and accent
    colors using the appropriate entries in the palette settings. To figure out what
    colors you want to use, open the Changing of colors page [3] and pick the primary
    and accent colors that result in detail. A dark mode with the option to toggle
    it makes the readers experience more comfortable. By enabling this feature in
    Material, you can enable a dark mode in addition to define toggles for the default
    theme. Listing 1, for the default theme is:


    - scheme:


    ```yaml

    <..>

    ```


    - toggle:


    ```yaml

    icon: material/lightbulb-outline

    switch: Switch to dark mode

    ```


    MkDocs adds Stars and Forks. But that''s not all. If you want to encourage readers
    to contribute to your documentation, you can easily edit it and add a link to
    each page. This link points to the repository where the reader can make edits
    and create requests.

