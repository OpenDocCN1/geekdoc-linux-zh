    浏览器在显示比较结果后会弹出一个小窗口，工具提供了有关所检查文章状态的视觉信息。这四个因素评估了所调查媒体的总体质量、作者的专业知识、使用的来源以及文章语言。通过这种方式，扩展程序还会将质量作为一个绝对因素，并识别机构的身份。


