    # MADDOG''S DOGHOUSE


    回顾计算机内存的历史和经典的经典的算法文本。作者：JOHN "MADDOG" HALL


    当我们认为两位数字而不是四位数就足够存储数据时，问题就出现了。


    许多人记得，当我们向 2000 年迈进时，恐慌在 1999 年 12 月 31 日前后或当天爆发，当我们转头看会发生什么时，人们很早就开始考虑这个问题并努力修复它。


    然而，在早时候，由 Donald E. Knuth 编写名为《计算机程序设计》（The Art of Computer Programming）的系列书籍在
    1973 年出版，当我开始编写 IBM 主机时，我正在攻读计算机科学学位。


    # 排序与搜索


    当我 1969 年开始编程时，每台 IBM 主机可能只有 1MB 内存和两个以兆字节为单位的硬盘驱动器，并支持任何类型的磁带驱动器。编程中的任何并行都强调了将数据引入内存，同时你也在试图通过稳定存储器或直接到磁带输出数据。


    早期的一些 IBM 程序员使用一种名为 MFT（多文件作业）的操作系统，它有多多 16 个“分区”，每个分区的大小都是固定的，直到操作系统被更改。


    当我开始接触操作员时，控制作业语言（JCL）告诉操作系统它需要多少内存，当它被放入程序员（通常是生成 JCL 的人）指定的足够大的内存槽位时。如果 JCL
    指定的内存过多，则内存被浪费了；如果太小，则程序可能无法运行或崩溃。


    后来的操作系统变为 MVT（可变任务多作业），它允许程序员指定一个或多个槽的大小。问题是，这会在系统的物理内存中产生严重的碎片，当多个小槽组合在一起时，程序运行就会触发级垃圾回收。


    如果这听起来有点复杂，甚至有些反常，在那个早期主机的时代，我会告诉你补充信息，这些 IBM 主机最初只有 24 位（而不是 32 位或 64 位），每次处理
    1600 万字节。


    我们使用的机器极其缓慢，按照今天的标准，它们被认为是“魔法”。尽管如此，我们仍然考虑每次计算需要多少内存。从长远来看，这不利于我们，而且有些完全没有用处，正如“YK”所说。


