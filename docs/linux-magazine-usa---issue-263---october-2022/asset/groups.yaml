    ## OpenMandriva Lx Rome 技术预览版


    曾经几何，我在一次会议上与 Mandrake Linux 团队待在一起。那是 20 世纪 90 年代后期，之后发生了很大变化。Mandrake Linux
    于 2011 年停止。在灰烬中，OpenMandriva（巴西 Linux 和 Mandrake 的融合体）曾繁荣过。


    最近，OpenMandriva 开发者宣布了 Lx Rome 的最新预览版，这是开源操作系统的滚动发布版本。需要注意的是，软件已经切换了 Rome 的自动工具，因为他们一直在
    Cook 分支中对工具链系统包进行更改。


    所以，对于那些想知道 OpenMandriva Lx Rome 即将带来什么的人？预览如下：


    OpenMandriva Lx 将带来的最大变化包括 Python 3.11、Java 20、内核 5.18.2；usr 合并（最新的 KDE 软件 Plasma
    v5.23.0 是 Linux 桌面环境的重大变化）；已支持 Btrfs 和 XFS，DR 和两者现在均可用。


    从 Forge (https://sourceforge.org/) 下载预览副本并阅读我们的官方 OpenMandriva 博客。


