- pgno: 17
  md: 'local exploits that are compatible with the system’s environment. A hacker
    or penetration tester will now be able to obtain system-level or super-user capabilities
    after these exploits are used. A tester can now launch further assaults on the
    computers connected to the local network. This technique can be either non-restricted
    or restricted depending on a target’s scope. Cracking passwords to various services,
    observing network traffic, and using spoofing techniques on local networks are
    other ways to learn more about a compromised target. This suggests that obtaining
    the highest level of access to the targeted system is the primary goal of privilege
    escalation.


    +   9. Access preservation In some cases, a client may ask a penetration tester
    to continue having access to the system for a predetermined amount of time. This
    can be used to demonstrate to network administrators how unauthorized access to
    the system can be accomplished without the need for further penetration methods.
    Additionally, it helps to reduce the amount of time, money, and resources needed
    to get to the system in order to evaluate its security. One can select to use
    end-to-end connection methods, proxy protocols, or hidden tunneling techniques.
    By doing so, a tester can build backdoor access that will help them stay present
    in a target system for however long is necessary. This method of entering the
    system shows us how an attacker might remain present in a targeted system without
    drawing attention to themselves.


    +   10. Reporting and Documentation Without presenting the vulnerabilities that
    were discovered during the penetration test, the exercise is not complete. Vulnerabilities
    that have been verified and exploited ought be adequately reported, displayed,
    and documented.


    This is essential ethically since it will enable network and system managers and
    administrators to focus their resources on plugging any security gaps in their
