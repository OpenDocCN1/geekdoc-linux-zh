- pgno: 105
  md: '# Chapter 7: Network Management and Scanning


    The key to being a good hacker is having the capacity to search for and connect
    to other network devices from your system, and with wireless technologies like
    WiFi and Bluetooth becoming the norm, being able to locate and manage WiFi and
    Bluetooth connections is essential. A wireless connection can be hacked, giving
    an intruder access to a device and private data. Of course, learning where to
    discover these devices is the first step. The two most popular wireless technologies
    in Linux that we will be looking at in this chapter are WiFi and Bluetooth.


    # Network scanning


    As the name suggests, is the process of using a computer network to gather data
    on IT systems. We perform network scanning primarily to assist with system maintenance
    or a security evaluation. Before starting an attack, hackers might also perform
    a network scan.


    Some of the reasons we scan networks


    +   * Identifying the current TCP and UDP network services, which may be running

    * on the targets.

    * to learn about the filtering systems that lie between the user and the targeted
    hosts.

    * By examining their IP answers, determine the OS systems that are being used.

    * Analyze a specific host that is being targeted for its TCP sequence number predictability.
    This will enable attack sequence prediction and TCP spoofing.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Vulnerability scanning and network port scanning are the two main components
