  md: '# Chapter 3: The Hacking Process


    In defense hacking for businesses and organizations, which includes the discovery
    of possible threats on a computer or network, is known as ethical hacking, carried
    out by white hat hackers.


    Ethical hacking follows a similar set of distinct phases to all good initiatives.
    Making a planned ethical hacking attack aids hackers. The process of ethical hacking
    is described in various ways in security training books, however in my experience,
    it may be divided into the following six phases:


    +   reconnaissance.

    Scannable.

    Gaining Access.

    Preserve Access.

    Make your tracks clear.

    Reports


    # Renaissance


    Renaissance: What is it? It is a preliminary survey that is conducted to gather
    information, according to the dictionary definition. The exploratory surveys that
    militaries carry out on enemy territory serve as an illustration. Reconnaissance
    in the context of cyber security is the process of learning more about a target
    using a variety of methods.


    An ethical hacker is interested in three types of information throughout this
    exercise:


    +   1. The Network.

    2. The Host'
