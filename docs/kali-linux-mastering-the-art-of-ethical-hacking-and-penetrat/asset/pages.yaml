- pgno: 14
  md: 'Bing, and Google are just a few of the online resources one can use to find
    relevant information.


    Kali Linux also comes with a number of tools that you can employ to get network
    information about a target. The programs collect data from DNS servers, email
    addresses, traceroutes, phone numbers, the Who database, personal information,
    and user accounts using essential data mining techniques. The more data that is
    acquired, the higher the likelihood that a penetration test would succeed.


    3. Target discovery critical actions include determining the network state of
    chosen targets, their operating system, and, if practical, their network architecture.
    Such details provide a penetration tester with a thorough understanding of the
    network''s connected devices or cutting-edge technologies. As a result, they will
    be able to list all of the various services that are now active within the network.
    Using all the Kali Linux advanced network tools, it is feasible to perform all
    of these tasks (identifying the live hosts on the network, identifying the OS
    that each host is running, and characterizing each host according to their functions
    in the network system). These instruments use active detection methods or passive
    detection methods. This is carried out on top of network protocols and is manipulatable
    to produce meaningful data. The OS fingerprinting is an illustration of this information.


    4. Finding open ports on the systems being targeted at this part of the process,
    “target enumeration,” boosts earlier efforts. Following the detection of open
    ports, the ports used by active services will be listed.


    A hacker or penetration tester can help by using port scanning techniques including
    stealth, full-open, and half-open scan to check the visibility of ports. For hosts
    protected by a firewall or an intrusion'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'detection system, this is conceivable. An examination of the services that
    are mapped to the open ports can be carried out to assist penetration testers
    or hackers in finding existing vulnerabilities in the infrastructure of a target
    network. This indicates that we can use enumeration as a base to find vulnerabilities
    in the various network devices. One can enter the network through the vulnerabilities.
    Target enumeration can be carried out by a security auditor using Kali Linux’s
