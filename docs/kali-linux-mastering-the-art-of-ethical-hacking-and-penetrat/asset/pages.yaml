    # Anti-Forensics


    Before we dive into this subject, let''s first define forensics. We define computer
    forensics as a science whose fundamental goal is to make it possible for forensic
    professionals to gather, preserve, analyze, and present digital evidence in a
    court of law. We describe anti-forensics as a field that includes any method and
    technology currently in use for erasing, altering, or concealing digital data.
    The modification, deletion, or destruction of digital evidence is the primary
    goal of anti-forensics. One can tell from the name that this is concerned with
    the methods or actions that are intended to obstruct an eventual digital investigation
    and to reduce both the quantity and quality of evidence. Antiforensics has also
    been defined by some as the “Attempts made to negatively compromise the quality,
    amount, and existence of evidence from a crime scene or to complicate the examination
    and analysis of evidence so that it is impossible or difficult to conduct.” Anti-forensic
