    # Velocities Scanning


    We can infer from the name that port scanning is a technique for locating active
    ports on a network. The way a port scanner operates is by sending client requests
    to the set of targeted ports on a network. After saving the port-specific information,
    a reply will be sent back. This is how active ports are discovered, good readers.
    After obtaining a target''s IP address (by scanning the UDP and TCP ports of the
    victim organization), the hacker will move on to map the network of the target
    company.


    # Port scanning techniques


    SYNScan: The TCP three-way handshake method is not finished in this mode of scanning.
    Here, a victim will get the SYN packet from a hacker or penetration tester. The
    target will establish a connection and the port will be able to listen if a SYN/ACK
    response frame is received. If you get a RST from the destination, the port might
    not be open or it might be closed. Form of scan has the advantage that only a
    few IDS systems would report it as an attack or a connection attempt.'
