- pgno: 24
  md: '# Chapter 2: The Fundamentals of Kali Linux


    # Obtaining Kali


    As we mentioned in the introduction, Kali Linux is a Linux distribution that is
    available for download as an ISO file. You’ll have to download it from a different
    computer, then you''ll need to create a disk and install it from there. Download
    this intriguing Linux distro by visiting http://www.kali.org/downloads/. You may
    find the documentation for setups, sophisticated operations, and special cases
    on http://www.kali.org/official-docs/ to learn how to install it. We have a vibrant
    community where you may ask any questions or offer assistance to other people
    in need if you require any more aid. These community boards are controlled by
    Offensive Security, and new users must register in order to access them.


    The Kali Linux developers are the security firm. about the occasion, Offensive
    Security will send out messages with information about their products, community
    news, and upgrades. Make careful to choose the appropriate architecture for your
    machine (either amd64564-bit or i386532-bit) when downloading Kali Linux. Since
    the knowledge of Kali images is adequately covered in the resources I supplied,
    I won’t discuss them in this. To pick and download the image, click on the appropriate
    link. If you’re using Microsoft Windows, you’ll need to burn the image using Burn
    ISO or another program (Ruxus comes to mind). Burning should continue until it
    is finished. Similar to Windows users, Linux users can convert the ISO image using
    a disk-burning program (like K3b).'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Kali Linux installation on a hard drive


    You will discover how to install this operating system both graphically and textually.
    The graphical user interface has been made as uncomplicated as feasible. You must
    set up your Basic Input Output System (BIOS) so that it can boot from the produced
    optical disk. Start by inserting Kali’s optical disk flash drive into the PC.
    There is the possibility for sophisticated users to employ virtualization software
    like Oracle’s VirtualBox or VMware’s Player.


