    # Finding Yourself with pwd


    Unlike Windows or macOS, the Linux command line does not always clear which directory
    you are currently in. You often need to be aware of your location in order to
    browse a new directory. Your position inside the directory hierarchy is returned
    by the pwd command, which shows the current working directory. To find out where
    you are, type pwd into your terminal: kali >pwd/root in this case, Linux responded
    with /root, indicating that I am in the root user’s directory. You should also
    be in the root user’s directory, which is located one level below the top of the
    disk hierarchy (/) since you logged in as root when you began Linux. Pwd will
    instead return the name of the directory you are currently in.


    # Using Whoami to Check Your Login


    The sole “all-powerful” superuser or system administrator in Linux is known as
    the root, and it has all the privileges to add users, modify passwords, alter
    permissions, and other things. Naturally, you do not want just anyone to have
    this authority; you want someone you can rely on and who is familiar with the
    operating system. You might wish to log in as root because, as a hacker, you often
    need all those privileges to execute the'
