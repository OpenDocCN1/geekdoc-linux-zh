- pgno: 60
  md: 'XMASScan: The scan sends a packet with the flags PSH (for push), URG (for urgent),
    and FIN (for completion). Assume we have an open port; we do not anticipate a
    response; if the port is closed, the target will respond with a RST/ACK packet.
    (RST=reset)


    FINScan: With one exception, this scan is virtually analogous to an XMAS scan.
    Only the FIN (finish) flag is transmitted in packets sent via FINScan.


    The other two flags (URG and PSH flags) are not present in the scan.


    The reaction is comparable to an XMAS scan. The limits of the two scans are comparable
    as well.


    IDLEScan: This type of scan determines the responses from the port scan along
    with the IP header sequence number to transmit a SYN packet to the target using
    a fake IP address. Depending on the scan’s outcome, the port is either regarded
    as open or closed.


    TCP Inverse Flag Scan: In this scenario, a hacker will send TCP probe packets
    with or without a TCP flag (FIN, URG, PSH). If there is no response, the port
    is open, and RST indicates that the port is closed.


    ACK Flag Probe Scan: In this kind of port scanning, a hacker sends TCP probe packets
    to a location where an ACK flag is set to a distant device that is utilized for
    header information analysis.


    This data consists of the WINDOW and TTL fields. One utilizes the RST packet to
    determine whether the port is open or closed. This scan can also be'
