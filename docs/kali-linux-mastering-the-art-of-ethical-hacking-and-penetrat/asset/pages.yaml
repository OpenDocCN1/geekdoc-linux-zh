    best strategy is to mix the two so that a security auditor may have a clear understanding
    that will allow them to look into network system vulnerabilities that are either
    known or undiscovered.


    +   6. Social engineering is a sort of attack that employs people as its attack
    vectors. Humans are typically seen as the weak point in information security configurations—the
    gateway via which an attacker can access a system. A target network can be breached
    by an attacker, who can then run malicious code to do harm and, occasionally,
    open a backdoor for later use. All of this will have been made feasible by tricking
    the administrators or users of a certain network. There are many distinct types
    of social engineering.'
