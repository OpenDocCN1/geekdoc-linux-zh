- pgno: 7
  md: '# # Chapter 1: Introduction to Kali Linux


    You will learn about variety of ethical penetration testing topics in this chapter.
    It is also known as ethical hacking, and it is described as a technical process
    and approach that provides professional hackers with a platform to model the methods
    and techniques that actual hackers would use to exploit an information system
    or computer network. We will discover the procedures that a penetration tester
    typically follows, starting with the comprehension and evaluation of a particular
    target and ending with the actual break-in.


    The book also addresses issues related to the various tools employed in the penetration
    testing process. These are introduced in this chapter, but Chapter 4 will go into
    further detail.


    Along with learning how to download and install Kali Linux, the reader will also
    gain an understanding of the real-world applications of this Linux distribution.
    So without further ado, let''s start.


    Offensive Security is the firm that created the excellent distribution known as
    Kali Linux.


    The latest offering from the company is Kali Linux. Over 300 security and penetration
    testing tools may be found in Kali, a live disk security distribution. If you''re
    familiar with the operating system, you might have observed that the tools have
    been divided into groups that penetration testers and other organizations that
    evaluate information systems frequently use. In contrast to past editions made
    by Offensive Security, Kali Linux uses the Debian 7.0 distribution as its foundation.'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'The operating system shares a family tree with Backtrack Linux, which it replaced.
    It is important to note that the same team also supports it.


    According to Offensive the name change to Kali Linux implies that this operating
    system is a complete rebuild of the Backtrack version. The significant upgrades
    made meant that it wasn''t just a new version of Backtrack but an entirely new
    operating system. If you think back, you will recall that Backtrack was an upgrade
    that came from White Hat and SLAX, also known as WHAX and Auditor, just like Kali.


    Technically speaking, Kali is the most recent iteration of the tools used for
    penetration and auditing assessments in the information security sector.


    Tools available in different categories in Kali Linux


    Kali Linux is preloaded with a variety of tools that can be used for penetration
    testing. The tools in Kali Linux are grouped in a way that facilitates the penetration
    testing exercise, as we have previously stated.


    The basic categories are listed below:


    +   1) Information-gathering tools:


    This category includes a variety of tools used in the information-gathering process.
    A penetration tester is typically curious about knowledge of DNS, operating systems,
    IDS/IPS, SSL, network scanning, routing, voice over IP, SMB, email addresses,
    VPNs, and SNMP.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# 2)Tools for vulnerability assessment:


    These are tools that are located here and are generally used to scan for vulnerabilities.
    We have tools that are used to evaluate the Cisco network and database servers
    for vulnerabilities. We also offer a number of fuzzing tools under this heading.


    # 3) Web


    As implied by the category''s name, these tools are related to web apps. They
    consist of web crawlers, web application proxies, content management system scanners,
    database exploitation, and scanners for web vulnerabilities.


    # 4) Tools for password attacks:


    This category includes tools that can be used to conduct both online and offline
    password attacks.


    # 5) Exploitation tools:


    These are tools for exploiting the flaws discovered in a particular target environment.


    You may find exploitation tools for databases, the Web, and networks here. Additionally,
    you can find tools for launching social engineering assaults in this area. The
    user will receive information from the tools about the exploits that were used
    as well


    # 6) Sniffing and spoofing'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'These tools are used to snoop on network and web traffic. Additionally, we
    offer network spoofing tools like Yersinia and Ettercap.


    # 7) Access-maintenance tools:


    A penetration tester will utilize the tools listed below to keep access to a target
    computer. It goes without saying that you need the highest degree of privilege
    to install the tools in this category. We have tools that can be used to backdoor
    OS systems and online apps. This category includes tunneling equipment as well.


    # 8) Reporting Tools:


    This category includes tools for recording the penetration testing technique,
    as well as the outcomes and recommendations.


    # 9) System services:


    This category includes a wide range of services that are required for the penetration
    testing operation. The Metasploit service, Apache service, SSH service, and MySQL
    service are a few examples.


    # 10) Wireless attacks:


    This section contains techniques for attacking Bluetooth, RFID, and wireless devices.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   11) Reverse engineering;


    This category of tools is typically used for troubleshooting software or performing
    executable file disassembly.


    +   12) Stress testing;


    You can discover all the necessary tools in this category to perform stress tests
    on your network, VOIP environment, wireless network, and Web.


    +   13) Hardware hacking;


    This page has all the tools you need to work with Arduino and Android applications.


    +   14) Forensics:


    This category includes many tools that are typically used in digital forensics.
    The acquisition of hard disk images, file carving, and—most significantly—the
    analysis of the image extracted from the hard disk are examples of forensics.
    A user must choose the No Drives or Swap Mount option from the booting menu in
    Kali Linux Forensics in order to do these procedures correctly. In this manner,
    the operating system won’t mount the drives automatically. This suggests that
    the drive’s integrity will be preserved.


    Keep this knowledge in mind since Chapter 5 will examine some of it.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'The Penetration Testing Lifecycle There are several different lifecycle models
    for penetration testing that are utilized today. The methodology outlined and
    used by the EC-Council Certified Ethical Hacker program are currently the ones
    that are most popular. The five phases of the penetration testing life cycle include
    reconnaissance, scanning, gaining access, maintaining access, and covering tracks,
    in that order.


    We shall examine each of the aforementioned stages in more detail later on in
    the book.


    General Penetration Testing Framework As we have previously stated, Kali Linux’s
    extensive toolset gives us the adaptability we require for penetration testing
    and security assessment. Without a good framework, a penetration tester is more
    likely to receive unsatisfying results from failed testing. As a result, it is
    crucial for managers and technical administrators to make sure that security testing
    is in line with a defined framework because the test’s objective is to produce
    valuable discoveries.


    This article will teach you a general testing framework that both the white box
    and black box methodologies typically


    You will learn the fundamentals of the normal steps that a penetration tester
    or security auditor should take from it. However, the frameworks must be suitably
    modified based on the objective being evaluated. The following actions must be
    taken in order for the assessment process to be successful.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Target scoping Information gathering Target discovery Target enumeration mapping
    out Vulnerabilities Social engineering Target exploitation Privilege escalation
    Access maintenance Reporting and documentation 1. Prior to starting the technical
    examination of the security, the target is often scoped. In order to fully comprehend
    the scope, observations must be made on the target network environment. Additionally,
    the auditor may be given a specific group of entities or a single entity to establish
    the scope for.


    Typical decisions that are typically made in this step include things like:


    +   - What element needs testing?

    - How will the testing be done?

    - What are the criteria that will be used when the test is run?

    - What are the constraints on the testing procedure?

    - How much time will the exam take?

    - What goals are meant to be attained


    Any successful penetration testing exercise requires the tester to have a solid
    grasp of the technology being tested, its fundamental workings, and how it interacts
    with the network environment.


    +   1. This means that the effectiveness of the penetration testing process depends
    on the auditor’s knowledge.


    +   2. Information collecting The reconnaissance step comes after scoping is complete.
    In this case, the penetration tester will use freely accessible sites to learn
    more about their target.


    Social networks, articles, forums, blogs, bulletin boards, business or non-commercial
    websites, newsgroups, and search engines like MSN'
