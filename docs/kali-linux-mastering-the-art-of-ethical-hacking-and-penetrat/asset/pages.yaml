- pgno: 20
  md: 'various perspectives on how they are used in their respective fields. The terms
    we''ll be utilizing are listed below along with their definitions.


    Penetration according to our definition, is the methodology, process, and procedures
    used to try to get beyond an information system’s built-in security measures and
    other safeguards. Normally, the entire procedure adheres to predefined rules.
    Examining a system’s administrative, technical, and operational settings and controls
    is the focus of penetration testing. A specific information system’s security
    is evaluated during testing exactly as it is set up. It’s possible that the targeted
    network’s system administrators and workers are unaware that such an exercise
    is taking place.


    Performing an assault on computer or network systems for a company or a specific
    owner of the information system is the primary responsibility of an ethical hacker,
    a professional penetration tester. You’ll see that the terms “ethical hacking”
    and “penetration testing” are used interchangeably in this book.


    White Hat This phrase refers to a computer security expert or an ethical hacker
    who specializes in the security testing of information systems in order to either
    improve or add security where it is needed.


    A person who uses their IT expertise to circumvent the security of information
    systems without authorization is referred to as a “black hat” in this parlance.
    Black hats typically intend to commit computer crimes. Members of the Red Team
    and penetration testers frequently use Black Hat techniques in their job. This
    is done in security testing to imitate hostile individuals performing valid tests
    or activities.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'Grey Hat In life, there are good guys, bad guys, and people who fall in the
    middle. Grey hats represent the midway ground in hacking. In most circumstances,
    they will attempt to bypass the security measures of an information system without
    authorization. They typically do this to alert the system administrators to any
    holes they have found. They often are not in for the money. They are illegal since
    they don''t ask permission from the owners first before engaging in their operations.


    # Vulnerability Assessment/Analysis


    This activity is used to assess a system’s security settings. The types of evaluations
    that can be done include assessing the security patches that have been installed
    on a system and the ones that are missing. Vulnerability assessment teams can
    either be external or internal to an organization’s IT department.


    # Malicious User Testing


    In this case, the assessor will behave maliciously as though they were an insider.
    Of course, their insider status makes them a reliable source.


    The assessor will be provided with authentic login information belonging to an
    authorized user; this will be a test account. They will use the credentials to
    try to go beyond security measures that have been put in place. They can achieve
    this by altering settings and documents that the account isn’t allowed to view,
    and elevating their permissions and privileges over what the test account ought
    to have. In conclusion, a malicious user test tries to mimic'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'the activities that an untrustworthy insider could perform using their trusted
    credentials.


    Phishing In this kind of attack, efforts are made to persuade the targets to divulge
    private data such as passwords, account numbers, and user names. Typically, fraudulent
    emails with authentic-looking subject lines are used to do this. The emails may
    come from companies, banks, or customer service representatives. Users are encouraged
    to click on bogus hyperlinks in a different kind of phishing assault. By doing
    this, harmful software could be secretly installed on the target system without
    the owner’s awareness. Following this, the malware can be used to target other
    computers or to steal data that is stored on them. Phishing assaults are by their
    very nature non-targeted. Targets can include everyone on a mailing list or those
    whose email addresses have a particular extension, such as “@kali.com.”


    Spear phishing is a kind of phishing attempt in which the targets are narrowly
    defined. For instance, an attacker could conduct reconnaissance to find the email
    addresses of an organization’s top executives. The phishing assault can now be
    launched specifically against these people.


    # Container diving


    Using this method, the penetration tester will try to search through a system’s
    trash. Any user, as well as the system administrators, could be the source of
    this garbage. Any knowledge gleaned from this will be very beneficial in comprehending
    a certain target. Information describing network diagrams, system settings and
    configurations, the hardware components, and the software versions that are being
    used might be found by a penetration tester. On a good day, one might obtain user'
  merge: -1
  img_proc: true
