    +   5. Vulnerability mapping At this point, we should have sufficient knowledge
    on the target network.


    On the basis of the services and ports we have identified, we must now examine
    the vulnerabilities that have been found. We may accomplish the goals of this
    phase with the help of Kali Linux’s automated vulnerability assessment tools for
    networks and apps. Manual vulnerability mapping is an additional option. The main
