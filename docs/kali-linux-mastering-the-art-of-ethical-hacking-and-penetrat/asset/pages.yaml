  md: '3. Users/Participants.


    # How to Perform a Reconnaissance Exercise in Steps.


    The first phase in ethical hacking is typically intended to aid a penetration
    tester in comprehending their targets. This falls within the umbrella of the category
    of information gathering.


    Underneath, we have something called reconnaissance, which we characterize as
    being a collection of methods and procedures used in learning and gathering vital
    details about a target. They consist of scanning, counting, and fingerprinting.
    Following the seven steps outlined below, an ethical hacker attempts to learn
    as much as they can about a target system during a reconnaissance exercise;


    +   Gathering preliminary data.

    Establish the range of a network.

    Determining which machines are on.

    Learning about available open ports and access points.

    Fingerprinting of operating systems.

    Checking for services that are active on different ports.

    Maps of the network.


    There are two main categories for reconnaissance.


    Active Reconnaissance: Information obtained through active reconnaissance is accurate
    because it includes making direct contact with your target''s computer system.
    There is a chance of being discovered engaging in active reconnaissance without
