  md: 'Navigating around Linux can be tedious until you get used to it, learning a
    few fundamental commands and tricks will make the command line much more user-friendly.
    You can use the following commands at the terminal to find stuff.


    Locate is probably the most user-friendly command for searching. This command,
    when used with a keyword specifying what you’re looking for, will search your
    whole filesystem for that term anywhere it appears. Enter the following, for instance,
    to search for aircrack-ng:


    ```

    kali >locate aircrack-ng

    /usr/bin/aircrack-ng

    /usr/share/applications/kali-aircrack-ng.desktop

    /usr/share/desktop-directories/05-1-01-aircrack-ng.directory--snip--

    /var/lib/dpkg/info/aircrack-ng.mg5sums

    ```


    However, the locate command is not faultless. The information you receive from
    locate’s results may occasionally be too much to handle.


    locate uses a database that is typically only updated once per day, so if you
    recently generated a file, it could not appear in this list until the following
    day. Knowing the drawbacks of these fundamental commands can help you choose when
    to use each one.


    Using the where is command to find binary files'
