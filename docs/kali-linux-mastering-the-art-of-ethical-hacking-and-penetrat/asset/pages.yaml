- pgno: 16
  md: 'For instance, a phone-based attacker may impersonate a network administrator
    to ask a user for their account information.


    Email phishing scams are another type of social engineering that malevolent users
    use to acquire your bank account information.


    A person can physically impersonate a legitimate user to enter a physical space.
    Also social engineering. These illustrations demonstrate the vast possibilities
    for reaching a necessary objective. Understanding the human psychology is a talent
    that will enable the tester or attacker to improvise appropriately in their targeting,
