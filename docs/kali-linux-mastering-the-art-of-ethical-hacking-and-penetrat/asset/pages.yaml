- pgno: 97
  md: '# Integrity:


    This part of the triangle is making sure that data is reliable, consistent, and
    accurate over its entire life cycle.


    The integrity of data while it is in transit must be maintained at all costs.


    Effective measures must be made to prevent unauthorized individuals from altering
    the data. For instance, when there is a breach of confidentiality. User access
    restrictions and file permissions can be used as countermeasures in this case.
    Version control can be used to avoid inadvertent deletion or incorrect changes
    by authorized users. Mechanisms must be in place to aid in the detection of data
    changes that may be caused by non-human events, such as a server crash or an electromagnetic
    pulse. Checksums and cryptographic checksums can be used to aid in the data integrity
    verification process. Finally, it could be required to include redundancies and
    backups of some kind to aid in the restoration of the system to its prior state.


    # Availability:


    The consistent upkeep of all the hardware guarantees that the services provided
    by it will always be available.


    To maintain a stable operating system environment free of any software conflicts,
    failing equipment should be fixed immediately and adequately. The update of all
    essential system components is another aspect of maintenance that should be done.
    Additionally, it will need to'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'ensure that communications have enough bandwidth and that blockages are rare.


    High-availability clusters, redundancy, RAID, and even failovers can be used to
    mitigate the effects of hardware failures.


    Disaster recovery that is both quick and flexible is crucial for worst-case scenarios.
    The established catastrophe recovery strategy must be thorough in order for this
    to be feasible.


    Unpredictable events must be taken into account while preventing data loss or
    connection lapses. Natural calamities and fire are couple of such examples. To
    prevent data loss as a result of such events, backup data copies can be safely
    kept at a geographically remote site. These locations also need to be fire and
    water resistant. We can utilize additional security equipment, such as proxy servers,
    firewalls, and software, to prevent problems like network intrusions, downtime,
    and data inaccessibility caused by denial-of-service assaults.


    # Concerns related to the CIA


    Big data presents significant challenges to the CIA paradigm. This is primarily
    due to the enormous amount that needs to be protected, the variety of data formats,
    and, lastly, the abundance of the sources from which the data originated. Duplicate
    data sets and disaster recovery plans all drive up the already high cost.'
  merge: -1
