    It is crucial to remember that rmdir will not remove a directory that is not empty,
    as you can see in this example, but will instead notify you that the directory
    is not empty. Before you remove the directory, you must first remove all of its
    contents. This will prevent you from inadvertently removing items that you did
    not mean to. If you do to remove a directory and its content all in one, you can
    use the -r switch after rm, as shown below:

    kali >rm -r newdirectory


