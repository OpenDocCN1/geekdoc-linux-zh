- pgno: 80
  md: 'In order to give users the same amount of privacy as wired networks, WEP, which
    stands for Wired Equivalent Privacy, was developed. It complies with IEEE 802.11
    WLAN requirements. Data sent over a network is encrypted with WEP to prevent eavesdropping.


    WEP design faults This type of authentication method has several serious design
    flaws:


    +   1. In order to check the integrity of packets, it employs Cyclic Redundancy
    Check 32. The issue with CRC32 is that it only takes two packets to be captured
    for a hacker to get access to the network. In order to force the system to accept
    the packet, they can also change the checksum and encrypted stream.


    +   2. It creates stream ciphers with an Initial Value (IV) and a secret key using
    the RC4 encryption technique. The secret key can be anywhere between 40 and 104
    bits long, but the IV length is set at 24 bits. The network becomes more vulnerable
    to hacking if a secret key with a shorter duration is utilized.


    +   3. A hacker can use a dictionary attack since it uses a password-based authentication
    method.


    +   4. It lacks a central key management mechanism, making key changes in large
    networks extremely challenging.


    WEP has lost favor and been been replaced by WPA as a result of various security
    issues.'
  merge: -1
  img_proc: true
