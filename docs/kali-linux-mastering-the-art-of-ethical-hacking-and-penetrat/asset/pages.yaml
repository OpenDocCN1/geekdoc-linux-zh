    # Getting Help


    In Linux, almost every command, program, and utility have a specific help file
    that describes how to use it. For instance, if I needed assistance with the best
    wireless cracking program, aircrack-ng, I could enter kali >aircrack-ng --help.
    Note the double dash here. In Linux, it is customary to use a double dash (--)
    before word dash options with just one letter, like “h”. When you input this command,
    you ought to receive instructions for using the tool as well as a brief description
    of it. You may be able to use either -h or ? to access the help document. For
    instance, kali >nmap -h would be entered if I required assistance using Nmap,
    the best port scanning tool for hackers. Unfortunately, even while many applications
