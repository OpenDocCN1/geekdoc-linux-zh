- pgno: 99
  md: 'Since gathering data and using it to create some form of meaningful interpretation
    is big data’s primary goal, oversight is sometimes inadequate as well. We are
    all familiar with the man, Edward Snowden, who made this problem public. Across
    the globe, security agencies acquire a vast amount of personal information on
    individuals. We have unique considerations known as the Internet of Things privacy
    to protect personal information from exposure in the IoT ecosystem. To enable
    autonomous communications over a network, including the Internet, practically
    every logical or physical entity can be given a special identifier.


    It''s not always the case that the transferred data from a certain endpoint leads
    to privacy problems. The problem is that sensitive data can be retrieved when
    the fragmented data from several endpoints are accessible, collated, and analyzed.
    The Internet of Things, which includes many other Internet-enabled devices besides
    computers, presents a significant security risk in and of itself. These devices
    are frequently configured with weak default passwords, or they may even be unpatched
    in some circumstances. IoT might either be used as a separate attack vector or
    integrated into a thingbot if it isn’t appropriately safeguarded. In recent times,
    researchers have shown that all it takes to compromise a network is the use of
    a Wi-Fi light bulb. We must take into account the security of the many network-capable
    products that are now being developed.


    # Encryption


    As a mechanism for converting plaintext or other data types from their currently
    readable form to an encoded one, encryption is what we refer to as. The data can
    only be decoded by a party with access to a decryption key. This crucial step
    is typically taken to offer complete data protection across networks.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'On the internet, encryption is frequently employed as a preventative security
    measure to safeguard sensitive user data that is transferred between servers and
    browsers. Private data including payment information, passwords, and other personal
    data are examples of what may fall under this category. Encryption is a security
    measure that can be used by both individuals and businesses to protect sensitive
    data that is kept on computers, servers, and mobile devices.


    # How to use encryption


    A combination of an encryption algorithm and an encryption key is used to encrypt
    plaintext data, sometimes referred to as unencrypted data.


    This produces a ciphertext that can only be seen in its original form when decrypted
    with the right key. Decryption, on the other hand, is the opposite of encryption.
    The procedures for encryption are carried out backwards. There are two encryption
    algorithms that are widely utilized in the present era. Both symmetric and asymmetric
    encryptions are used.


    A single key is used for encryption when using the symmetric encryption process.
    Among symmetric-key ciphers, the Advanced Encryption Standard (AES) is frequently
    employed. Its main purpose when it was designed was to safeguard governments’
    secret information. In comparison to asymmetric encryption, this approach is quicker.
    The recipient must, however, have access to the sender’s encryption key.


    A secure method of key management is required. Most of the time, this use an asymmetric
    algorithm.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'On the other asymmetric cryptography is available. Additionally, it is known
    as public-key cryptography. Here, two distinct keys are employed. However, they
    are mathematically related. The keys are as follows, with one being private and
    the other being public. The public key can frequently be distributed to everyone.
    It is required to keep the private key private. The RSA encryption algorithm is
    one that is frequently used in asymmetric cryptography. The two keys can, to some
    extent, encrypt a message, which implies that the key used to decrypt it is the
    opposite of the key used for encryption. With the use of this function, we can
    make sure that electronic conversations and data are authentic, unreliable, and
    intact in addition to being confidential.


    # Gains from Encryption


    Encryption safeguards the confidentiality of digital data that is stored on computer
    systems or transmitted over the internet or any other computer network. Sensitive
    data must be encrypted, according to organizations like Payment Card Industry
    Data Security Standard (PCI DSS), in order to prevent unauthorized parties from
    accessing the information. Additionally, there are several standards that suggest
    or call for encryption. Today’s encryption algorithms play a crucial part in ensuring
    that communications and IT systems are secure and possess the following critical
    security characteristics in addition to confidentiality:


    +   - Authentication: A message’s origin should be able to be confirmed.


    +   - Integrity: This has to do with maintaining the integrity of the message.
    In other words, since a message was sent, its contents have not been changed or
    removed.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '+   •Non-repudiation: In this context, non-repudiation refers to the inability
    of a specific sender to deny sending the communication.


    # Protection and redundancy


    In most cases, we use backup, where copies of the data are made in case of a severe
    loss. However, redundancy encompasses much more than just data storage. Redundancy
    attempts to maintain service levels no matter what happens. Data redundancy ensures
    ensuring that data is stored in a variety of different places. We also have a
    concept known as “network redundancy” in which a network is set up with a lot
    of backup systems. No matter what happens, the alternate systems maintain service
    continuation.


    # Redundancy in Data


    First and foremost, it is crucial for any firm to quickly resume regular operations
    following a security compromise.


    As soon as feasible, data should be able to be rebuilt. Businesses have developed
    a number of strategies to ensure data redundancy as a result. It is widely recognized
    that these techniques have advantages in terms of cost-effectiveness, speed, and
    management. The most typical method is to use off-site tape backups. This technique
    stores a complete bit-for-bit replica of a storage volume on magnetic tapes. The
    tapes can be moved to an off-site storage location where they are conveniently
    accessible in the event of a catastrophic failure. Additionally, we can employ
    cloud backup to protect data from Losses.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# System Redundancy


    The majority of the infrastructure that supports our networks is incredibly unstable.
    For instance, if a router burns out for any reason, the network will be unavailable
    for an extended length of time. Businesses take precautions to mitigate this by
    ensuring that the networks they utilize have sufficient redundancy so that they
    can function and offer services in an emergency.


    Network redundancy essentially means that a network will continue to function
    no what kind of failure takes place. We can accomplish this by configuring additional
    network devices, such as hubs, routers, and switches, to take the place of a failing
    one. We also have ISP redundancy, when a network gateway is connected to multiple
    distinct ISPs. One ISP will take over anytime there is a failure, just like with
    the devices. When a network is operating well, we can use the ISPs to share the
    traffic, which reduces network congestion. This is referred to as load sharing.


    preventing a single point of failure from occurring. We do not want a system to
    become completely inoper due to the breakdown of a single crucial component. Any
    strategy must reduce this occurrence. Redundancy can decrease or even get rid
    of a single point of failure.


    This will ensure that no one element can interfere with a system’s correct operation.'
  merge: -1
  img_proc: true
