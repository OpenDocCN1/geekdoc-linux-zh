    \n针对性钓鱼（Spear phishing）是一种目标定义非常窄的钓鱼尝试。例如，攻击者可以进行侦察以找到组织高层执行人员的电子邮件地址。现在就可以专门针对这些人发起钓鱼攻击了。\n\
    \n## 容器挖掘（Container diving）\n\n使用这种方法，渗透测试人员将尝试搜索系统的垃圾。任何用户以及系统管理员都可能是这些垃圾的来源。从从中获得的任何知识对于理解某个目标都非常有帮助。渗透测试人员可能会找到网络拓图、系统设置和配置、硬件组件以及正在使用的软件版本的信息。在运气好的情况下，可能会获得用户凭据，包括用户名和密码。进入大垃圾桶的行为被称为“倾倒”（dumping）。此外，办公的小垃圾桶经常包含价值信息。\n\
    \n“LiveOS”、“Live Disk”和“Live CD”这些词都用于描述包含整个操作系统的光盘。Live disks 是渗透测试人员和评估人员的价值工具，因为它们可以根据当前的情况进行定制。它们可以自定义为具有特定的设置、资源和软件元素。尽管多年来开发了多个\
    \ Microsoft Windows 版本，但发行版中的大多数 live CD 通常是 Linux 的。在大多数评估中，评估人员只需提供一个 live disk。被评估的系统可以从\
    \ live disk ，本质上是利用信息系统的资源来对系统本身。\n\n![](img/b146791563029878b633b40c50200a6d_23_0.png)\n\
    \n```\n<div id=\"container\">\n  <!-- Basic Structure Elements of an HTML Document\
    \ -->\n  <!DOCTYPE html>\n  <html>\n    <!-- The document type declaration is\
