    deleted. By performing what we refer to as “file carving,” we can still restore
    the thumbnail even after it has been deleted.


    Jumplists can also provide details on the photographs, programs, papers, and various
    other kinds of files that the user has used. Even for files that are accessed
    from the outside, jumplists are typically established.


