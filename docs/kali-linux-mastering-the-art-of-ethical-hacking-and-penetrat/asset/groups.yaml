    \n当根基程序被安装在内核级时，它们将获得对受攻击系统的完全管理权限。与木马不同，根基程序通常会建立通往操作系统的直接路径。\n\n## 消除根基程序\n\n\
    传统的安全方法（如杀病毒软件）不足以完全根根基程序。作为替代方案，您可以使用专门为此目的设计的应用程序从系统中移除根基程序，例如 Malwarebytes\
    \ Anti-rootkit、TDSSKiller、Sophos Anti-Rootkit 和 GMER。请记住，根基程序并不总是能从您的机器上被完全消除。上述工具只能减少根基程序给系统留下的负面影响。除了使用工具处理根基程序外，用户还可以选择启动清理程序。在此过程中，会备份关键文件并重新安装操作系统。在大多数情况下，这将确保根基程序从您的计算机中清除。再次强调，这并不意味着删除操作将\
    \ 100% 成功。尽管并不多见，但 BIOS 级根基程序可以在重装后幸存。无论根基程序如何努力隐藏自己，系统中总会有表明其存在的迹象。这一点非常重要，因为它们的设计初衷是防止攻击者从外部进入建筑内部。\n\
    \n数据外泄是将数据非法移动到组织外部的系统或设备的行为。数据可能来自计算机系统或 IT 服务器。该过程可以手动（通过复制和粘贴）或自动（通过恶意软件）执行。安全公司\
