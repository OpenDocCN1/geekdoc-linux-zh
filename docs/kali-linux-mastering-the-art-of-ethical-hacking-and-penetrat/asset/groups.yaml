    # 序言


    诚心感谢你购买《Kali Linux：一份完整的分步初学者指南，学习网络安全基础与道德计算机黑客，包括用于保护网络的无线渗透测试工具》。本书讨论了 Kali
    Linux 中所有用于进行渗透测试的工具。此外，你将发现此 Debian 安装版中的各种工具是如何工作的。为了有效使用本书，你至少需要对命令行工具、计算机网络和
    Linux 管理有基本的了解。这将有助于你更好地理解这里介绍的系列主题。


    你将学习黑客如何潜入你的系统以及他们用来窃取信息的技巧。你将学习防御各种黑客策略所需的防御。为了实现这一目标，本书涵盖了许多主题，例如 Kali Linux
    简介、Kali Linux 基础、黑客流程、无线网络攻击、Kali Linux 的用途与应用、网络安全简介、网络扫描与管理，以及你在成为专业黑客之路上需要的一些
    Web 安全基础知识。


    当你翻到这本书的最后一页时，你已经掌握了基础黑客技术的理论和实践原理。你将具备进入计算机系统、应用程序和网络所需的方法。让我说明一下，尽管我们有几本书涵盖了该主题，但你选择了这本。


    我对此深表感谢。我们已尽一切努力使书中的信息对你有用且具有启发性。阅读愉快！


    ![](img/b146791563029878b633b40c50200a6d_6_0.png)


    # # 第1章：Kali Linux 简介


    在本章中，你将学习各种种渗透渗透测试主题。它也被称为道德黑客（ethical hacking），被描述为一种技术过程和方法，为专业黑客提供一个平台，以模拟实际黑客在利用信息系统或计算机网络时使用的方法和技术。我们将发现渗透测试员通常遵循的程序，从理解和评估特定目标开始，到实际入侵结束。


    本书还涉及了与渗透测试过程中使用的各种工具相关的问题。这些在本章中介绍，但第4章将进行更详细的内容。


    在学习如何下载和安装 Kali Linux 的同时，读者还将理解这种 Linux 发行版在现实世界的应用。那么话不多说，让我们开始吧。


    Offensive Security 是创建了 Kali Linux 这一优秀发行版的公司。


    该公司的最新产品是 Kali Linux。在 Kali（一种 Live 磁盘安全发行版）中，可以找到 300 多种安全和渗透测试工具。如果你熟悉该操作系统，可能会注意到这些工具被分成不同的小组，渗透测试员和其他评估系统的组织经常使用这些小组。与
    Offensive Security 制作的过去版本相比，Kali Linux 使用 Debian 7.0 发行版作为基础。


    该操作系统与它取代的 Backtrack Linux 拥有共同的家族树。需要注意的是，同一团队也支持它。


    根据 Offensive 的说法，更名为 Kali Linux 意味着该操作系统是对 Backtrack 版本的完全重构。重大的升级意味着它不仅仅是 Backtrack
    的新版本，而是一个完全全新的操作系统。如果你回想起来，你会记起 Backtrack 是一个源自 White Hat 和 SLAX 的升级版，也被称为 WHAX
    和 Auditor，与 Kali 一样。


    从技术上说，Kali 是信息安全领域用于渗透和审计评估工具的最新迭代版本。


    ## Kali Linux 中不同类别的工具


    Kali Linux 预装了多种可用于渗透测试的工具。正如我们之前提到的，Kali Linux 中的工具分组合方式便于渗透测试练习。


    基本类别列于下方：


    - 1) 信息收集工具：

    该类别包括在信息收集过程中使用的各种工具。渗透测试员通常对 DNS、操作系统、IDS/IPS、SSL、网络扫描、路由、IP 语音、SMB、电子邮件地址、VPNs
    和 SNMP 感兴趣。


    - 2) 漏洞评估工具：

    这些工具位于此处，通常用于扫描漏洞。我们有工具可以评估思科网络和数据库服务器的漏洞。我们还在该标题下提供了许多模糊测试（fuzzing）工具。


    - 3) Web

    正如类别名称所示，这些工具与 Web 应用有关。它们由爬虫、Web 应用代理、内容管理系统扫描器、数据库利用和 Web 漏洞扫描器组成。


    - 4) 密码攻击工具：

    该类别包括用于进行在线和离线密码攻击的工具。


    - 5) 利用工具：

    这些是用于利用目标环境中发现缺陷的工具。你可以在这里找到数据库、Web 和网络的利用工具。此外，你还可以找到用于社交工程攻击的工具。


    - 6) 嗅探与欺骗

    这些工具用于监听网络和 Web 流量。此外，我们提供了 Yersinia 和 Ettercap 等网络欺骗工具。


    - 7) 访问维护工具：

    渗透测试员将利用下面列出的工具保持对目标计算机的访问。无需多说，你需要最高权限才能安装此类类别中的工具。我们有可以用于对操作系统和在线应用程序留后门的工具。该类别还包括隧道设备。


    - 8) 报告工具：

    该类别包括记录渗透测试技术以及结果和建议的工具。


    - 9) 系统服务：

    该类别包含了渗透测试操作所需的各种服务。Metasploit 服务、Apache 服务、SSH 服务和 MySQL 服务都是其中的例子。


    - 10) 无线攻击：

    此部分包含了攻击蓝牙、RFID 和无线设备的技术。


