  - '[PAGE 84]


    +   1. Ensure that monitoring mode is selected on your Wi-Fi adapter.

    Enter the following command to discover the specified wireless network and any
    clients connected to it: Airodump-ng—c [channel]-ssid [target router MAC Addres]-l
    wlan0mon A window displaying a list of clients connected to the network will open.
    Their MAC addresses on their whitelist will also be displayed.


    To access the network, you must spoof these addresses.


    +   2. To fake your own address, choose one of the whitelisted MAC addresses from
    the list. Remove the monitoring interface first, then carry out the spoofing.
    Type Airmon-ng stop wlan0mon 3 into the command line. The following action is
    to disable the wireless interface for the MAC address you want to forge. Type
    ifconfig wlan0 down 4 into the command line. After that, you modify the address
    using Mcchanger program.

    Macchanger—m [New MAC Address] wlan0 is the command to enter. Keep in mind that
    in step 3, you have disabled the wireless interface.


    It’s time to bring it up again right now. Use the following syntax:

    ifconfig wlan0 up


    Test to determine if the network will confirm your connection now that the MAC
    address of your wireless adapter has been updated to that of an authorized user.
    The wireless network ought to be accessible to you.


    The three main risks from transmission hacking on wireless networks are disruption,
    alteration, and interception. You can employ signal-hiding techniques to stop
    malicious hackers from listening in wireless transmissions. A malicious hacker
    must first find the wireless access point'
  - '[PAGE 85]


    in order to intercept wireless broadcasts. A company can make this more challenging
    by turning off the SSID (service set identifier) that the access point is broadcasting,
    giving the SSID a mysterious name, reducing signal strength to provide only the
    necessary coverage, or positioning access points away from exterior walls and
    windows. There are also more advanced but more expensive methods, such as using
    TEMPEST (a method to prevent the emission of wireless signals) or directional
    antennas to confine the signal to a certain area.


    Stronger encryption of all wireless traffic — This is crucial, especially for
    businesses that need to safeguard the privacy of their data being transmitted
    wirelessly. The likelihood of a man-in-the-middle assault is decreased by this
    measure.


    Stronger authentication processes – Both users’ devices and users themselves should
    be covered by this. Man-in-the-middle assaults are reduced as a result.


    # Countermeasures against Denial of Service Attacks


    Although malicious hackers may occasionally try to take down an organization’s
    servers, a DOS attack may occasionally be accidental. To reduce the dangers of
    this type of assault, the following actions can be taken:


    +   doing thorough site surveys to locate signals coming from other devices. When
    determining where the access points should be placed, consider this as a guide.'
  - '[PAGE 86]


    conducting routine audits of network activity and performance to identify trouble
    spots. If there are any disruptive devices, they need to be taken out. Additionally,
    steps should be taken to improve signal strength and coverage in troubled areas.


    Wireless access points that are improperly set provide a serious vulnerability
    and may give hostile hackers unauthorized access to sensitive data. The following
    countermeasures must be implemented in order to secure wireless access points:
    Get rid of any rogue access points – Using 802.11i is the best approach to accomplish
    this. Ix to stop unauthorized devices from connecting to the wireless network
    via the USB port.


    Make sure that all valid access points are correctly set up. Since default settings
    are made available to the public, hackers can easily take advantage of them.


    Use 802.11 to authenticate each device. Strong authentication measures in the
    Ix protocol will stop unauthorized devices from installing backdoors. Prior to
    giving any device an IP address, this protocol makes sure that strict authentication
    is ensured.


    Devices There are two ways to evaluate security risks posed by wireless devices:
    theft/loss and compromise.


    Since laptops and PDAs frequently contain important and secret data, they must
    be secured against theft and loss.'
  - '[PAGE 87]


    When a malevolent hacker gains access to the device''s data storage, wireless
    client devices are also susceptible to intrusion. The tool can be used by hackers
    to attack other networks and systems.


    The most effective method for securing a wireless network is network encryption.


    The majority of base stations, access points, and wireless routers have built-in
    encryption algorithms that allow network traffic to be scrambled. Make sure the
    router you purchase has an encryption feature at all times. Make sure to manually
    activate this option before using your router since most manufacturers leave it
    off.


    Make sure your wireless network is safeguarded the same way a cable connection
    is by installing anti-spyware, anti-virus, and firewall software. Keep all of
    your software up to date, and make sure your firewall is constantly turned on.


    Turn off your router''s identifier broadcasting. A wireless router utilizes this
    feature to announce its presence to nearby devices. However, if people are already
    aware of a network, there is no need to make an announcement about its existence.
    Malicious hackers frequently look for broadcast identification to narrow focus
    on potential targets.


    Change the default identifier — The manufacturer of each router assigns a default
    ID. Even if you have the identifier broadcaster turned off, hackers can still
    target the network if they know the default ID, which is made available to the
    public.'
  - '[PAGE 88]


    Don’t forget to configure the new ID into your computer after changing the identifier.


    Alter the default password — The manufacturer assigns a default password to each
    router. This is for initial device configuration reasons. Because it''s simple
    to locate these default passwords, be sure to change your router’s password to
    something far more difficult to guess. Make an effort to extend the length of
    your password as well.


    Establish the devices that are permitted to connect to the network – Set your
    router to only permit connections from certain Mac addresses. Do not, however,
    rely solely on this method because Mac spoofing is still a possibility.


    When not in use, turn off any wireless networks. Ensure that any wireless networks
    are turned off when not in use.


    As a window of opportunity that hackers have to break into the network will be
    reduced.


    Be cautious in Wi-Fi hotspots – Most people like using free Wi-Fi at hotels, airports,
    and other public locations. Do not assume that these wireless networks are safe
    as this is rarely the case.


    The Users Educating and training every user is the best way to secure a wireless
    network. Users include not just those who connect to the network but also administrators
    and IT staff. Teaching individuals appropriate behavior is crucial to maintaining
    the wireless network’s security. This user education and training must be a recurring
    project.'
