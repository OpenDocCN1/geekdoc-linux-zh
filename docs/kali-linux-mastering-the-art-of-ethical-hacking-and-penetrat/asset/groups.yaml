    ## Chapter 8: Web Security


    ## Web Safety


    Web apps and websites are equally susceptible to having their security systems
    and protocols broken as real stores, houses, and government buildings. Strong
    and trustworthy security measures are required to combat cybercrimes and the compromise
    of web applications.


    This is exactly what web security does. A practical definition of web security
    for us would be that it is a collection of protocols and safety measures used
    to secure your website and online apps from hacking and unauthorized personnel
    entering your system without authorization. Web services, websites, and web apps
    can all be protected by the essential division of information security.


    This offers essential security for anything done on the Internet.


    there are a number of factors to take into account while discussing web protection
    and/or web security. An online application or website must be supported by a number
    of methods and checkpoints to ensure its security in order to be deemed secure.
    We always have security requirements that must be met. These standards are to
    be highlighted and put into practice by OWASP. Experienced web developers usually
    follow OWASP guidelines and pay close attention to the Web Hacking Incident Database
    in order to understand the vulnerabilities that result in website hacks and how
    they happen.


    ### common dangers to website security


    Websites can come under assault in a variety of ways. We must first comprehend
    some typical dangers to the security of websites before moving forward.


    During the planning of security measures, we will try to prevent these and be
    ready for them. Among many more, some of the issues include spam, malware and
    viruses, WHOIS domain registration, and DDoS attacks.


    ## How to make your website secure


    Let''s concentrate on how to prevent typical security threats after learning about
    them. It is incorrect to assume that your website is secure. There is a good probability
    that it can be assaulted if you have not put in place any protective measures.
    You must take the following actions to increase the security of your website:


    ### limits on file uploads


    Allowing users to upload files to your website is dangerous. The uploads can include
    a script designed to take advantage of holes in your website. Every upload must
    be viewed as a potential risk to the website''s security.


    ### using the HTPS protocol


    This signals to website visitors that they are, in fact, working with a reliable
    server. The literal translation of this is “no one can intercept the interactions
    they are having or the content they are viewing.”


    ### Safeguard your computer.


    With you, security begins! It is crucial that you maintain your devices'' security.
    Your computer may be used by hackers as a portal to your website. Make sure your
    antivirus program is current with definition updates. This shield will protect
    you from a variety of malicious attacks, including those that come from file downloads.
    Malware can potentially be injected into websites using stolen FTP login information.
    It’s crucial that you constantly scan your devices for viruses and spyware.


    ### Modify your CMS’s default settings.


    We have observed that many attacks today are typically automated. Bots are created
    by malicious individuals to assist them find websites that are still utilizing
    their default settings. Create obstacles for them. When installing a CMS that
    you own, change any default settings that are present:


    Settings for comments, User-required Controls, Information Visibility, and File
    Permissions


    You can immediately change the parameters listed above.


    ### program upgrades


    The software must always be current. This covers, among many other things, the
    CMS, plugins, and Word Press software. The updates provide enhanced functionality,
    security patches to close security holes, bug and software glitch repairs, and
    other improvements.


    ### Choose a secure web hosting package


    Shared web hosting packages are more likely to be compromised. Although the potential
    cost savings make them enticing to users, the levels of security are decreased.
    They are not a safe choice as a result. Don’t forget: cheap is dear!


    ### User access restrictions


    The bulk of cybersecurity threats are the result of human error. Reducing or limiting
    the number of humans can significantly help with error reduction. Not every employee
    has to have access to your website. Visitors, web designers, and consultants are
    all ineligible for automatic access. To secure your website, the least privilege
    concept must be used.


    ### Change your password.


    Changing passwords often is a big boost for web security.


    Change your password, then. Making a habit of regularly changing your password
    is far more important than simply changing it once.


    ### Check your security.


    Online, you can find tools to help you keep an eye on the security of your websites.
    These tools can assist you in conducting security audits, which can help to identify
    potential weaknesses. By doing this, you can start countermeasures prior to an
    assault.


    ### Create a website backup.


    It is said that you should arm yourself when you have been warned. Being constantly
    ready for the worst is a good idea. The worst that can happen in this situation
    is that your website might be compromised. A backup gives you piece of mind because
    it prevents data loss in the case of a compromise.


    ## Conclusion


    Please allow me to take this time to thank you for persevering through this educational
    book, Kali Linux. It''d like to think that it was instructive and that you are
    now well-equipped to tackle issues relating to hacking. I also hope you have acquired
    the necessary knowledge to launch your hacking career or advance your abilities
    if you already have one. From the first topic, Introduction to Kali Linux, all
    the way through the Basics of Kali Linux, The Hacking Process, Wireless Hacking,
    Uses and Applications of Kali Linux, Introduction to Cybersecurity, Network Scanning
    and Management, and Web Security, I sincerely hope you have enjoyed turning the
    pages. I hope that by reading this book, you have gained a wealth of practical
    knowledge that will help you become an accomplished hacker. By this you must had
    access to a substantial body of theoretical information about the different kinds
    of attacks that might be launched against your systems, the motivations behind
    them, and the defenses you can put in place to prevent them. These are the initial
    steps you need to do become a skilled hacker. The book discusses current topics
    including penetration testing, cyberattacks, and wireless network threats, among
    others. It follows that you are now well-positioned to identify network attack
    methods that manifest in the real world and recommend effective countermeasures.
    I''ve also provided you with a few security steps you can use to protect your
    networks. You can grasp the need of protecting your networks because the format''s
    user-friendly terminology. The next stage is to start putting the ideas you have
    learned from this book into practice. As they say, practice makes perfect, and
