    创建目录的命令是 `mkdir`，它是 "make directory" 的缩写。输入以下命令创建一个名为 `newdirectory` 的目录：


    ```

    kali >mkdir newdirectory

    ```


    输入以下内容进入此最近创建的目录：


    ```

    kali >cd newdirectory

    ```


    # 复制文件


    `cp` 命令用于复制文件。通过这种方式，旧文件将保留在原处，并在新位置创建一个它的副本。在这里，我们将使用 `touch` 在根目录下创建一个名为 `oldfile`
    文件，并将其复制到 `/root/newdirectory`，同时重命名原始的 `oldfile` 以保留在原处：


    ```

    kali >touch oldfile

    kali >cp oldfile /root/newdirectory/newfile

    ```


    你可以简单地在目录路径末尾添加你想要的名称来选择重命名文件。如果你在复制时没有重命名它，系统默认将保留文件的原始名称。当我们下次导航到 `newdirectory`
    时，我们可以发现 `newfile` 是 `oldfile` 的完全副本：


    ```

    kali >cd newdirectory

    kali >ls

    newfile oldfile

    ```


    # 重命名文件


    遗憾的是，与 Windows 等其他操作系统不同，Linux 缺少专门用于重命名文件的命令。然而，它有一个 `mv` (move) 命令。`mv` 命令可用于重命名现有文件或目录或将其移动到不同的位置。你可以输入以下内容将
    `newfile` 重命名为 `newfile2`：


    ```

    kali >mv newfile newfile2

    kali >ls

    oldfile newfile2

    ```


    现在 `newfile2` 已经重命名，当你列出 (ls) 该目录时，可能会看到它，但看不到 `newfile`。目录也可以进行同样的操作。


    # 删除文件


    要删除文件，请如下所示使用 `rm` 命令：

    kali >rm newfile2


    你可以通过对目录执行详细列出来验证文件是否已删除。


    # 目录


    用于删除文件的 `rm` 命令带有一个 `dir`（directory 的缩写）参数，如下：


    ```

    kali >rmdir newdirectory

    rmdir:failed to remove ''newdirectory'': Directory not empty

    ```


    至关重要的是，`rmdir` 不会删除非空目录，正如示例所示，它会通知你目录非空。在删除目录之前，你必须先删除它的所有内容。这将防止你无意中删除不需要删除的项目。如果你想一次性删除目录及其内容，可以在
    `rm` 之后使用 `-r` 选项，如下所示：

    kali >rm -r newdirectory


    不过提醒一下：在使用 `rm` 时要务必小心 `-r` 选项，因为很容易误删珍贵的文件和目录。例如，在主目录下使用 `rm -r` 将删除那里的每一个文件和目录；这无疑不是你的本意。


    # 查找工具和包


    在下载软件包之前，你可以检查它是否已经存在操作系统的仓库（数据存储所在）。`apt` 工具的搜索功能允许你查看该包是否已安装。这里使用了简单的语法：


    ```

    apt-cache search keyword

    ```


    记住，要搜索 `apt-cache`——即存储包名称的位置——我们使用 `apt-cache` 命令。例如，你可以执行下面所示的命令来查找入侵检测系统 Snort。


    - - kali>apt-cache search snort

    - fsnort - Snort-to-iptables rule translator

    - ipple - IP protocols logger

    - --snip--

    - snort - flexible Network Intrusion Detection System

    - sn-common - flexible Network Intrusion Detection System - common files

    - --snip--


    如你所示，“snort”一词出现在许多文件中，但在输出的中心，我们发现了短语“snort - flexible Network Intrusion Detection
    System”。这正是我们要找的内容。


    # 安装软件


    既然你已经知道 `snort` 包在仓库中可用，现在可以使用 `apt-get` 获取该程序。在终端中使用 `apt-get` 命令、关键字 `install`，后跟你想要安装的包名，即可从你操作系统的默认仓库安装软件。格式如下：`apt-get
    install package name`。让我们测试一下。格式如下：：


    ```

    apt-get install snort

    Reading package lists... Done

    Building tree

    Reading state information... Done

    The following NEW packages will be installed:

    snort

    --snip--

    Do you want to continue?

    ```


    # 卸载软件


    要卸载软件，请使用带有 `remove` 选项的 `apt-get`。可能会看到如下所示的输出。


    ```

    apt-get remove snort

    Reading package lists... Done

    Building tree

    Reading state information... Done

    The following packages will be removed:

    snort

    --snip--

    Do you want to continue?

    ```


    要删除软件和配置文件，请使用 `apt-get purge`。你可以在下面看到。


    ```

    apt-get purge snort

    Reading package lists... Done

    Building tree

    Reading state information... Done

    The following packages will be removed:

    snort

    --snip--

    Do you want to continue?

    ```


    # 软件包升级


    新软件或软件更新版本会定期添加到仓库中。你必须要求它们应用这些更新，因为它们不会自动推给你。升级 (upgrading) 与更新 (updating) 的区别在于升级是将包提升到仓库的最新版本，而更新则是更改可访问的包列表。通过使用
    `apt-get` 命令和 `update` 词，你可以通过 `apt-get update` 升级你的系统。这将检查系统上的每个包查看是否有更新。如果是，将下载更新。见下方的插。


    ```

    kali >apt-get update

    Get:1 http://mirrors.ocf.berkeley.edu/kali/kali-rolling InRelease

    [30.5kb]

    Get:2 http://mirrors.ocf.berkeley.edu/kali kali-rolling/main amd64 Packages

    [14.9MB]

    Get:3 http://mirrors.ocf.berkeley.edu/kali kali-rolling non-free Packages

    [163kb]

    Get:4 http://mirrors.ocf.berkeley.edu/kali kali-rolling/contrib amd64 Packages

    [107kb]

    Fetched 15.2 MB in 1min 4s (236 kB/s)

    Reading package lists... Done

    ```


    完成。你的系统软件仓库现在将使用可用程序列表进行刷新。如果更新成功，终端上将显示读取包列表。如上所示，已完成。请注意，仓库名称、值、时间等因素在你的系统中可能会不同。


    使用 `apt-get upgrade` 更新系统中已安装的包。在执行 `apt-get upgrade` 之前，你必须以 root 身份登录或使用 sudo
    命令，因为更新包可能会触发软件的修改。此命令将升级你系统中所有 apt 能够升级的包。


    '
