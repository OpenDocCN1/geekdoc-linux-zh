    系统管理员可以配置 IDS 和防火墙，在检测扫描的同时阻止扫描尝试。使用唯一规则来保护网络并阻塞不良端口。为了检查端口扫描是否准确检测到任何扫描，用户可能会利用工具。反欺骗规则必须正确配置，安全专家必须确保系统路由器、IDS
    和固件都是最新版本。


