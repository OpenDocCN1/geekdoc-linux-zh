    and it can be used for network scanning.


    By typing ifconfig into the terminal, you may use it to check the status of your
    active network connections.


    # Using the ifconfig command to Scan Wireless Networks


    If you have a wireless adapter, you can use it to obtain vital data for wireless
    hacking, like the adapter’s IP address, MAC address, what mode it’s in, and more.
    When using wireless hacking tools like airc-ng, the information you can learn
    from this is quite crucial.


    # Changing your network information


    Being able to modify your IP address and other network information will allow
    you to access other networks while presenting yourself as a reliable device on
    those networks, which is an important skill. For instance, you can spoof your
    IP in a denial of service (DoS) attack to make it appear as though the attack
    is coming from a different source, enabling you avoid having your IP captured
    for forensic analysis. The ifconfig command is used in Linux to complete this
    rather easy process.


    # Changing Your IP Address


    Type ifconfig, the interface you wish to reassign, and the new IP address you
    wish to be allocated to that interface to change your IP address. For instance,
    to give interface eth0 the IP address 192.168.181.115,


    ```

    Kali >ifconfig eth0 192.168.181.115

    ```


    ```

    kali >

    ```


    If you did this successfully, Linux will return to the command line and say nothing.
    This is advantageous! Following that, you should see that your IP address has
    changed to the new IP address you just assigned when you check your network connections
    once again using ifconfig.


    # Changing Your Network Mask and Broadcast Address


    The ifconfig command also allows you to alter your network mask (netmask) and
    broadcast address. For example, you would input the following if you wanted to
    give the same eth0 interface the netmask 255.255.0.0 and the broadcast address
    192.168.1.255:


    ```

    Kali >ifconfig eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255

