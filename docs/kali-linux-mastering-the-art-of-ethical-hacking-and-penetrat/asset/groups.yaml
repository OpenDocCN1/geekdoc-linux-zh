    黑客可以通过操纵目标的域名系统（DNS）来获取有关该目标的大量信息。尽管 DNS 的初目的是将域名转换为 IP 地址，但这一互联网的核心组成部分也可以被黑客用来收集有关目标的信息。


    像 `google.com` 这样的域名会通过 `dig` DNS 服务翻译为正确的 IP 地址。你的系统将知道如何访问它。如果没有 DNS，我们就必须记住与我们经常访问的网站相关的成上万个
    IP 地址。任何有志的黑客都应该知道的命令之一就是 `dig`。它提供了一种编译目标域名 DNS 数据的方法。在攻击之前，获取 DNS 存储数据可能是早期侦察中至关重要的部分。这些信息可能包括目标邮件服务器的
    IP 地址、名称服务器（将目标名称转换为 IP 地址的服务器）以及可能的任何子域名。通过包含 `mx` 选项（mail exchange server 的缩写），你还可以使用
    `dig` 命令了解更多关于与域名相关的邮件服务器的信息。针对电子邮件系统的攻击需要这些信息可用可用。


    ## 更改你的 DNS 服务器


    有时你可能需要使用不同的 DNS 服务器。你可以通过修改系统的 `/etc/resolv.conf` 明文文件来实现这一点。


    在文本编辑器中打开该文件。之后，在命令行中输入编辑器的确切名称，后跟文件的路径和名称。


    让我们从查看 WiFi 网络开始。在在此之前，这里是通常使用的各种 WiFi 安全协议的简要介绍。有线隐私（WEP）是最初的，它有严重的缺陷且容易被破解。取而代之的是
    WiFi 保护访问（WPA），它安全一些。最后，所有的 WiFi AP（企业级 WiFi 除外）现在都使用 WPA2PSK，它要安全得多，并采用了所有用户共享的预共享密钥（PSK）。


    ## 基础无线命令


    ```

    ifconfig

    ```


    在基于 Unix 的操作系统中，需要使用 `ifconfig` 来配置网络接口。系统包含此工具用于管理。`ifconfig` 提供了用于配置、探索和管理 TCP/IP
    接口参数的工具。`ifconfig` 可以作为一个交互式工具来显示和检查网络接口设置。


    总之，`ifconfig` 执行以下任务：启用查看网络设置；执行网络接口的启用和禁用；为网络接口分配广播地址；为网络接口分配 IP 地址、子网掩码和广播地址；以及更改网络接口的
    MTU。


    更改网络接口的 MAC 地址；开启和关闭混杂模式；从网络接口添加和删除新的别名。


    RTNetlink socket 接收的无线事件通过 `ievent` 命令显示。每行显示一个唯一的无线事件（Wireless Event），详细说明所选无线接口上发生的情况。该命令不接受参数。


    `iwlist` 命令可以用于搜索可用的无线网络，并显示 `iwconfig` 命令未显示的关于无线网络的任何进一步信息。`iwlist` 用于生成相邻无线接入点的列表，连同它们的
    SSID 和 MAC 地址。


    ## iwspy


    此命令用于监控网络节点。它也可以用于监控节点的链路质量。


    `ifname` 命令使用各种静态标准为每个接口一致地分配名称，用于重命名无线网络接口。通常，接口名称在本质上是动态的。此命令帮助用户选择网络接口的名称。


    这用于报告当前使用的无线网络接入点的 NWID、ESSID 或地址。默认情况下，`iwgetid` 将显示设备的 ESSID。如果不可用，它将输出其 NWID。提供的数据与
    `iwconfig` 显示的数据匹配。相比之下，集成到不同的脚本更为简单。


    ## 识别并使用蓝牙


    几乎所有现代小设备、系统和设备都配备了蓝牙。电脑、iPad、智能手机、扬声器、游戏控制器、键盘和平板电脑只是可以使用的设备少数示例。如果一个设备被控制，并且获取了一个向从从设备发送特权信息的平台（其他等），那么进入蓝牙网络的能力可能会导致设备上信息的泄露。因此，为了充分利用蓝牙，我们必须理解它是如何运行的。


    你可以从书中中学到一些基础技能，这些技能在扫描和连接蓝牙设备以进行破解时将非常有帮助。


    ## 蓝牙的工作原理


    蓝牙是一种无线通信技术，允许在设备之间无线传输音频或数据。


    这发生在相当小的区域内。这项技术的开发是为了取代连接小设备的常用电缆，同时保持它们之间通信的安全性。配对是连接两个蓝牙设备的过程。如果两个设备处于可发现模式，它们几乎总是可以配对。蓝牙设备在可发现模式下会广播关于自身的以下细节：

    - 技术信息

    - 名称

    - 服务列表

    - 类别


    当蓝牙设备配对时，它们会交换链路密钥。为了在随后的配对中识别另一个设备，设备将保存该密钥。每个设备都有独特的身份，通常是制造商给它的一个名称。当我们想要定位和访问设备时，这些将是有益的信息。


    我们将使用 BlueZ 搜索蓝牙信号，BlueZ 是 Linux 程序 `Bluetooth Scanning and Reconnaissance` 提供的蓝牙协议栈实现。大多数
    Linux 发行版（包括 Kali Linux）都作为标准功能自带它。BlueZ 具有可以管理和扫描具备蓝牙能力的工具。以下示例说明了这些实用：`hciconfig`
    是 Linux `ifconfig` 的蓝牙特定版本。


    我们利用名为 `hcitool` 的工具进行查询。请求设备的名称、类别、ID 甚至其时钟信息。这使得设备更加同步。


    `hcidump`：由于此工具执行蓝牙嗅嗅，它允许我们记录通过蓝牙信号传输的数据。


    检查我们正在使用的蓝牙适配器是否被识别并启用，允许我们利用它来扫描其他设备，作为蓝牙扫描和侦察的第一阶段。


    ## 使用 hcitool 扫描蓝牙设备


    现在我们已经知道蓝牙适配器正在运行，我们可以使用 `hcitool`（另一个 BlueZ 套件工具）来搜索附近的蓝牙设备。


    我们可以通过简单的 `scan` 命令来识别通过发现信标通信的蓝牙设备。换言之，即发现模式下的设备。你最可能会遇到在脚本中使用这些命令的蓝牙破解工具。这些命令允许你使用
    Python 甚至 bash 脚本来构建自己的工具。


