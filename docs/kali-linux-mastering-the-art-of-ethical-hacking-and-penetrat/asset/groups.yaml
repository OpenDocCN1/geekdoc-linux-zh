    away, it will continue to exist. These lists often include a MAC address, the
    name of the item being viewed, the path to the file being accessed, the application
    being used to view the file, the name of the computer, and the time and date of
    the access. This suggests that jumplists provide great proof of access. Manually
    deleting the “chat sync” folder’s internal data will not remove Skype history.
    You can find tidbits of user interactions in the folder’s content. Despite the
    method''s flaws (deleting), when done correctly, it can permanently delete evidence,
    leaving forensics specialists without any evidence.


    Even though some wrongdoers can use this technique to avoid detection, hiding,
    moving, renaming, or altering files may come across as naive. Here, trails can
    be hidden by renaming or relocating files that contain histories or by changing
    file extensions. My friends, this is not a simple task. There are programs available
    that can be used to partition files into smaller ones. The ends of other files
    can obscure these divisions. A hacker can use the unused file space, also known
    as slack space, by using specialized tools to hide important data from view. Additionally,
    a hacker may bury a file inside another (stenography, perhaps). With executable
    files, this technique functions perfectly.


    ### Timestamping Investigators frequently don’t look through every file on a computer
    system. Most of the time, they arrange the data in chronological order so they
    may focus their search for possibly pertinent data. When an attack is known, they
    will want to see the information right after it happened. Criminals will often
    make an effort to thwart this strategy by altering the metadata of the files they
    need. The names and dates each file was last visited, last modified, and created
    are often changed. Time stamping is a deceptive forensic method. The computer
    or device will believe that the file is a different one once modification or transformation
    has been made. Changing the name of an mp4 file to make it appear like a gif,
    for instance, to locate moved or renamed files, forensic investigators typically
    rely on their experience and expertise. Additionally, we have information forensics
    techniques that can automatically check hard drives for unusual discrepancies.
    Data carving is an illustration of such a strategy. This technique is employed
    to do a thorough and sequential scan of the material. Data carving works well
    because it can easily read low-level data from the media. It is independent of
    how the file locations and names are displayed on the file system. For instance,
    an mp3 file’s identification is dependent on the actual data stream that it contains
    rather than the file’s name.


    The final security mechanism a hacker can use is encryption. Encryption is a headache
    in terms of digital forensics. By using a powerful encryption method, the data
    may become unreadable and so useless to the investigators.


    ## Log Tampering


    Log files are commonly saved in the event viewer on Windows-based PCs. It is simple
    to find using the “Search” bar. The /var/log directory houses the logs in the
    majority of Linux and UNIX operating systems.


    ![](img/b146791563029878b633b40c50200a6d_75_0.png)


