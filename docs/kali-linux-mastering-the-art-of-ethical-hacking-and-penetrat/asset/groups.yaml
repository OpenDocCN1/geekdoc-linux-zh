    ## Getting Help


    In Linux, almost every command, program, and utility have a specific help file
    that describes how to use it. For instance, if I needed assistance with the best
    wireless cracking program, aircrack-ng, I could enter kali >aircrack-ng --help.
    Note the double dash here. In Linux, it is customary to use a double dash (--)
    before word-dash options with just one letter, like “h”. When you input this command,
    you ought to receive instructions for using the tool as well as a brief description
    of it. You may be able to use either -h or ? to access the help document. For
    instance, kali >nmap -h would be entered if I required assistance using Nmap,
    the best port scanning tool for hackers. Unfortunately, even while many applications
    accept all three options, there is no guarantee that the one you are using will
    work. So kindly try a different option if the first one’t.


    ## Finding Files


    Navigating around Linux can be tedious until you get used to it, learning a few
    commands and tricks will make the command line more user-friendly. You can use
    the following commands at the terminal to find stuff.


    Locate is probably the most user-friendly command for searching. This command,
    when used with a keyword specifying what you’re looking for, will search your
    whole filesystem for that term anywhere it appears. Enter the following, for instance,
    to search for aircrack-ng:


    kali >locate aircrack-ng

    /usr/bin/aircrack-ng

    /usr/share/applications/kali-aircrack-ng.desktop

    /usr/share/directories--

    /var/lib/dpkg/info/aircrack-ng.gz


    However, the locate command is not flawless. The information you receive from
    locate’s results may be too much to handle. locate uses a database that is typically
    updated once per day, so if you recently generated a file, it could not appear
    in this list until the following day. Knowing the drawbacks of these fundamental
    commands can help you choose when to use each.


    ## Using the where command to find binary files


    If you’re looking for a binary file, you can use this command to find it. If they
    are available, this command also returns the binary’s source code in addition
    to the binary’s location. Here’s an illustration:


    kali >which aircrack-ng

    /usr/bin/aircrack-ng

    /usr/share/man/aircrack-ng.1.gz


    ## Using the Command to Locate Binaries in the PATH Variable


    The command is even more specific: In Linux, it only returns the location of the
    binaries that are present in the PATH variable. For instance, when I run the command
    aircrack-ng, the operating system consults the PATH variable to determine which
    directories to search for. In this case, aircrack-ng was successful in locating
    a single binary file in the PATH variable’s listed directories. These directories
    typically contain /usr/bin as a minimum, but they may also contain /sbin and maybe
    a few more.


    ## Using the Find Command to Conduct More Powerful


    The find command is the most robust and adaptable of the searching utilities.
    It can start your search in any specified directory and look for a number of different
    criteria, including the filename of course, but also the owner, the group, the
    size, and the date of creation or modification. The fundamental syntax for find
    is as follows: find directory options expression


    ## Filtering with grep


    You may frequently want to search for a certain term while using the command line.
    To do this, you can narrow your term search using the grep command. When output
    is piped from one command to another, the grep command is frequently utilized.


    kali ~ps aux | grep apache2


    The command in the aforementioned example will list all the services that are
    currently active before passing the result to grep. grep searches the received
    output for the term we specified in the command. The keyword in our situation
    is apache2. grep will proceed and output just the results that are pertinent.
    Saving time with this command.


    After you''ve located the folders and files you were looking for, you might need
    to perform a number of operations on them. We''ll learn how to create directories
    and files, copy and rename files, as well as delete files and folders.


