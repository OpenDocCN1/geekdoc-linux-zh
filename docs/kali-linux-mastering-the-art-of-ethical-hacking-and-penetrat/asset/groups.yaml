    ## 第 8 章：网络安全


    ## 网络安全


    网络应用程序和网站遭受安全系统和协议被破坏的风险，与实体商店、房屋和政府建筑一样高。为了应对网络犯罪和 Web 应用程序的攻破，需要强大且值得信赖的安全措施。


    这正是网络安全所从事的。对我们来说，网络安全的实际定义是：它是系列协议和安全措施的集合，用于保护您的网站和在线应用程序免受黑客攻击以及未经授权的人员进入您的系统。网络服务、网站和
    Web 应用程序都可以通过信息安全的基本划分来保护。


    这为在互联网上进行的任何操作提供了基本的安全保障。


    在讨论网络保护和/或网络安全时，需要考虑许多因素。一个在线应用程序或网站必须由多种方法和检查点支持以确保其安全性，才能被认为是安全的。我们始终有必须满足的安全需求。这些标准由
    OWASP 重点强调并诸实践。丰富的 Web开发者通常遵循 OWASP 指南，并密切关注 Web 黑客攻击数据库，以了解导致网站被黑的漏洞以及其发生机制。


    ### 网站安全的常见危险


    网站可能会以多种方式受到攻击。在继续之前，我们必须首先理解网站安全的一些典型危险。


    在规划安全措施期间，我们将尝试防止这些问题并做好准备。在许多问题中，其中一些问题包括垃圾邮件、恶意软件和病毒、WHOIS 域名注册以及 DDoS 攻击。


    ## 如何让您的网站安全


    在了解了典型的安全威胁后，让我们专注于如何防止它们。假设您的网站是安全的是错误的。如果您没有采取任何保护措施，那么您的网站极有可能受到攻击。您必须采取以下行动来提高您网站的安全性：


    ### 文件上传限制


    允许用户向您的网站上传文件是危险的。上传的内容可能包含设计用于利用您网站漏洞的脚本。每次上传都必须视为对网站安全的潜在风险。


    ### 使用 HTTPS 协议


    这向网站访问者发出了信号，表明他们实际上正在与可靠的服务器进行交互。这的字面意思是“没有人可以拦截他们正在进行的交互或他们正在查看的内容”。


    ### 保护您的计算机。


    安全从你开始！维护设备的设备安全性至关重要。您的计算机可能会被黑客用作进入您网站的门户。确保您的杀病毒软件已更新最新定义。这道盾牌将保护您免受各种恶意攻击，包括来自文件下载的攻击。恶意软件可能会利用被盗的
    FTP 登录信息注入网站。不断扫描设备以检测病毒和间谍软件是至关重要的。


    ### 修改您的 CMS 默认设置。


    我们观察到现在的许多攻击通常是自动化的。机器人由恶意个人创建，以帮助他们发现仍在使用默认设置的网站。为他们制造障碍。在安装您拥有的 CMS 时，更改任何存在的默认设置：


    评论设置、用户所需控制、信息可见性和文件权限


    您可以立即更改上述列出的参数。


    ### 程序升级


    软件必须始终保持最新。这涵盖了许多内容，包括 CMS、插件和 WordPress 软件。更新提供了增强的功能、用于关闭安全漏洞的安全补丁、错误和软件故障的修复，以及其他改进。


    ### 选择安全的 Web 托管包


    共享 Web 托管包更容易被攻破。虽然潜在的成本节约对用户具有吸引力，但安全级别降低了。因此，它们并不是一个安全的选择。不要忘记：廉价意味着昂贵！


    ### 用户访问限制


    大多数网络安全威胁源于人为失误。减少或限制人员的数量可以显著帮助减少错误。并不是每个员工都必须访问您的网站。访问者、Web 设计师和顾问都不具备自动访问的权限。为了保护您的网站，必须使用最小权限原则。


    ### 修改您的密码。


    经常更改密码对网络安全很有帮助。


    经常更改密码。


    ### 检查您的安全。


    在网上，您可以找到一些工具来帮助监控网站的安全。这些工具可以帮助您进行安全审计，有助于识别弱点。通过这样做，您可以在攻击发生前采取措施。


    ### 创建网站备份。


    人们说，在警告时要做好准备。做好最坏打算是一个好主意。在这种情况下最坏的情况是您的网站可能被攻破。备份让您放心，因为它在被破解的情况下可以防止数据丢失。


