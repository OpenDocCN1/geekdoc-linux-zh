    取证：取证 Linux 现场启动环境在过去几年变得越来越流行。该发行版包含了许多基于 Linux 的取证工具。通过 Kali，取证专家可以执行与其职业相关的所有任务，从初步分检和数据取证到案件管理和彻底分析。


    反向工程：近期，这种人才在许多领域（包括执法部门）变得至关重要。定位漏洞和创建利用程序的主要技术之一就是反向工程。这是在进攻端。


    反向工程可用于分析已防御性攻击特定系统的恶意软件。


    在这里，确定某项特技（tradecraft）的能力是主要目标。


    无线攻击：Kali 支持多种无线黑客工具。无线网络被广泛使用，这使其成为频繁的攻击目标。作为黑客对各种类型无线网络发起攻击的首选方案，Kali Linux
    还支持多种无线设备。


    密码攻击：当用户遇到身份验证系统时，可以使用 Kali Linux 进行密码攻击。由于此原因，操作系统包含了许多实用的工具和实用程序。为了处理哈希和加密系统，Kali
    Linux 用户可以使用离线和在线密码攻击。


    数据库评估：Kali Linux 能够执行 SQL 注入和凭据窃取等数据库攻击。Kali 丰富的存储库中提供的工具可以测试从数据提取和分析到 SQL 注入的各种攻击向量，这使得这一切成为可能。


    再次，Kali Linux 包含了大量熟练黑客或有志之客可以使用的工具，用以访问正在通过网络传输的数据，包括嗅探和伪装工具。如果你想获取并评估刚刚捕获的数据，可以在使用伪装工具伪装成网络授权用户后，使用嗅探工具。


