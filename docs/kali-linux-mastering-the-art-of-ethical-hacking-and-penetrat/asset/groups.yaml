    造假者、网络恐怖分子和其他网络犯罪分子。显而易见，他们想要消除任何可能让他们陷入证据。


    ## 证据删除


    我们中的某些人非常担心，以至于花钱购买磁盘清理和隐私保护软件，只为了擦除我们不想让别人看到的信息。人们认为硬盘上的所有内容都可以通过这些程序永久删除。用户可以使用“安全删除”选项擦除文件，并专门删除以下类型的数据：注册表项、缩略图、跳转列表（jumplists）、Skype聊天同步等。网络浏览器历史和缓存也是可以删除的信息类型之一。


    许多此类清理程序都可以被取证专家使用专业的取证仪器所破解。例如，取证专家感兴趣的内容是可以恢复的。这是因为即使在原始图像被删除后，Windows缩略图中仍包含该图像的较小版本。通过执行我们所谓的“文件雕（file
    carving）”，即使在缩略图被删除后我们仍然可以恢复它。


    跳转列表还可以提供用户使用过的照片、程序、文档和其他各种类型文件的细节。即使是从外部访问的文件，通常也会建立跳转列表。


    无论原始文件已被擦除还是外部设备已被带走，它都会继续存在。这些列表通常包含MAC地址、正在查看的项目名称、所访问的文件路径、用于查看文件的应用程序、计算机名称以及访问的时间和日期。这表明跳转列表为访问行为提供了有力证明。手动删除“聊天同步”文件夹的内部数据不会删除Skype历史记录。你可以在文件夹的内容中找到用户交互的碎片信息。尽管这种方法有缺陷（删除），但只要操作得当，它就可以永久删除证据，让取证专家无证可查。


    尽管一些作法者可以使用这种技术来规避检测，但隐藏、移动、重命名或更改文件可能显得有些天真。在这里，可以通过重命名或重新定位包含历史的文件，或通过更改文件扩展名来隐藏踪迹。我的朋友们，这不是一项简单的任务。现许多程序可以将文件分割成更小的文件。其他文件的结尾可以遮盖这些划分。黑客可以使用专用工具利用未使用的文件空间（也称为碎片空间，slack
    space）来隐藏重要数据。此外，黑客可能会将一个文件埋在另一个文件内部（可能是隐写术）。对于可执行文件，这种技术运行得完美。


    ### 时间标记


    调查人员通常不会查看计算机系统上的每一个文件。大多数时候，他们会将数据按时间顺序排列，以便将搜索集中在可能相关的数据上。当攻击已知时，他们想要看到攻击发生后的信息。犯罪分子往往会努力通过更改他们所需的文件的元数据来阻挠这一策略。每个文件最后访问、最后修改和创建的名称及日期经常会被更改。时间标记是一种具有欺骗性的取证方法。一旦进行了修改或转换，计算机或设备就会认为该文件是另一个文件。例如，通过更改mp4文件的名称使其看起来像gif，以定位已移动或重命的文件，取证调查人员通常依赖于他们的经验和专业知识。此外，我们还有信息取证技术可以自动检查硬盘是否存在异常差异。数据雕刻（Data
    carving）就是这种策略的示例。该技术用于对材料进行彻底且顺序的扫描。数据雕刻之所以有效是因为它可以轻松读取来自介质的低级数据。它独立于文件系统如何显示文件位置和名称。例如，一个mp3文件的标识取决于于它所包含的实际数据流，而不是文件名。


    黑客可以使用的最终安全机制是加密。在数字取证方面，加密是一个头疼的问题。通过使用强大的加密方法，数据可能变得不可读，从而对调查人员毫无用处。


    ## 日志篡改


    日志文件通常保存在Windows电脑的事件查看器中。使用“搜索”栏很容易找到。在大多数Linux和UNIX操作系统中，/var/log目录存储着日志。


    ![](img/b146791563029878b633b40c50200a6d_75_0.png)


    只需通过查看日志文件，系统管理员就可以看到系统中发生的任何有害活动。日志文件有两种不同类型：系统生成的和应用程序生成的日志文件。在操纵日志时，黑客有两种选择：一种方法是完全删除日志，另一种方法是更改其内容。为了防止发现任何网络入侵的迹象，黑客还可以将系统二进制文件替换为木马等恶意软件。


    通常情况下，删除日志文件不是好主意，因为这会在日志中留下空白并引发疑问。可以使用日志文件进行有害行为检测。它们可以作为有关系统状况和实际状态的警报方法。记录中的任何异常都可能引起不必要的注意。敏锐的攻击者可能会在日志数据不太可能看到的时候发起攻击，例如周末或深夜。


    要篡改日志文件中的数据，攻击者需要root权限。黑客在提升权限后，可以在日志文件内部更改与其活动相关的日志数据。因此，系统管理员的任何调查都不会显示任何异常活动。谨慎的系统管理员通常会配置系统，将所有日志文件发送到远程服务器。总结来说，狡猾是成功的要求之一。在黑客期间避免被发现是不够的。即使在执行实际攻击后，程序也应该继续。任何错误都可能触发雷达，取证小组将立即被定位攻击者。这表明掩盖踪迹的最后阶段极其重要，不应轻视。我们声称黑客使用秘密行动作为一种安全措施来让他们远离危险。问题可能会立即出现，也可能以后出现，例如在调查期间。


