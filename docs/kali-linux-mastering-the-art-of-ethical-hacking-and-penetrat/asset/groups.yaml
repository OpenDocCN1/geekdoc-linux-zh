    | bin | initrd.img | media | run | var |

    | :--- | :--- | :--- | :--- | :--- |

    | boot | initrd.img.old | mnt | sbin | vmlinuz |

    | dev | lib | opt | srv | vmlinuz.old |

    | etc | lib64 | proc | tmp | |

    | home | lost+found | root | usr | |


    This command displays a list of the directory’s files and folders. By adding the
    directory name after the command, for example, ls /etc, you can use this command
    on any specific directory in addition to the one you are presently in. . shows
    the contents of the /etc directory. You can add the -l switch after ls (the l
    stands for long) to acquire extra details about the files and directories, including
    their permissions, owner, size, and when they were last edited.


    The long listing is another name for this. See the illustration below:


