    \    </head>\n    <body>\n      <!-- The body is where all the content of a web\
    \ page is displayed -->\n      <div id=\"content-level\"></div>\n    </body>\n\
    </</html>\n```\n\n## 第 2 章：Kali Linux 基础\n\n## 获取 Kali\n\n正如我们在引言中提到的，Kali Linux\
    \ 是一种可以以 ISO 文件格式供下载的 Linux 发行版。你必须从另一台计算机下载它，然后你需要创建一个磁盘并从那里安装它。通过访问 http://www.kali.org/downloads/\
    \ 下载这个有趣的 Linux 发行版。你可以在 http://www.kali.org/official-docs/ 上找到关于设置、高级操作和特殊情况的文档，学习如何安装它。我们有一个活跃的社区，如果你需要更多帮助，可以在那里提出任何问题或向需要帮助的人提供协助。这些社区论坛由\
    \ Offensive Security 控制，新用户必须注册才能访问它们。\n\nKali Linux 的开发者是这家安全公司。关于此类，Offensive\
    \ Security 将发送有关其产品、社区新闻和升级的消息。在下载 Kali Linux 时，务必为你的机器选择合适的架构（amd64 64 位或 i386\
    \ 32 位）。由于 Kali 镜像的知识在我提供的资源中已充分涵盖，我将不会在这里讨论它们。要选择并下载镜像，请点击相应的链接。如果你使用 Microsoft\
    \ Windows，你需要使用 Burn ISO 或程序（想起来有 Rufus）刻录镜像。刻录应该持续直到完成。与 Windows 用户类似，Linux 用户可以使用光盘刻录程序（如\
    \ K3b）转换 ISO 镜像。\n\n## 在硬盘上安装 Kali Linux\n\n你将发现如何以图形化和文本方式安装此操作系统。图形用户界面已设计得尽可能简单。你必须设置你的基本输入输出系统（BIOS），使其能够从生成的光盘启动。通过将\
    \ Kali 的光盘闪存器插入 PC。高级用户有可能会使用虚拟化软件，如 Oracle 的 VirtualBox 或 VMware 的 Player。\n\n\
    ## 首次启动 Kali Linux\n\n下方截图中的 PC 已成功从 Kali Linux 磁盘启动。在本书中使用了 64 位的 Kali Linux\
    \ 1.0.5。你最终会注意到在不同时期下载的 Kali Linux 版本之间会略有不同。除此之外，图形化安装是相似的。\n\n![](img/b146791563029878b633b40c50200a6d_25_0.png)\n\
    \n你可以在 http://www.kali.org/ 获取所有发行版的指南。作为结果，在执行之前访问这一点至关重要。除了安装在硬盘上，Kali 也可以直接从包含镜像的磁盘启动。我们将这种称为\
    \ live CD。唯一需要注意的是，当计算机关闭时，内存、保存设置和其他工作都可能丢失。在非持久状态下运行 Kali Linux 是学习如何使用它的极方法。你可以看到有语音合成选项。我们不会深入探讨它的细节，但你应该意识到这是\
    \ Kali 和 Debian 操作系统的最新升级。如果他们的硬件支持语音合成，用户就可以语音控制安装过程。多么令人兴奋！正如我所指出的，让我们专注于图形化安装。使用方向键滚动并选择\
    \ Graphical Install，然后按回车键。\n\n## 正在设置默认\n\n接几个面板将要求你为区域、键盘布局和语言选择默认选项。在做出必要的选择后点击继续进入下一阶段。当机器开始真正的\
    \ Kali 安装时，将在屏幕上看到许多进度条。对于大多数选择显示，选择默认选项是明智的。\n\n## 网络设置\n\n看下图。你必须对你的主网卡进行基础配置和初始设置。选择主机名。通过提供的框输入这些信息，然后点击继续按钮。为了防止同一网络上的多个机器具有相同的主机名，请选择唯一的主机名。这将减少网络相关问题。确定主机名后点击继续按钮。你需要在屏幕屏幕提供\
    \ FDN，即完全限定域名。除非你想加入域环境，否则大多数实验环境都不需要。让我们保持留空。要继续，我们将点击继续选项。\n\n![](img/b146791563029878b633b40c50200a6d_27_0.png)\n\
    \n## 配置密码\n\n接下来的屏幕将要求你设置 root 级密码。Kali Linux 的默认密码太简单了。我建议你想出一个难以猜测、强大且无法追溯到用户的新密码。在输入两次密码后点击继续按钮进入下一步。\n\
    \n"
