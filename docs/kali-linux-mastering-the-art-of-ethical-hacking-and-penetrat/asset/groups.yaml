    `ifconfig` 是检查和处理活动网络接口的关键工具，可以用于网络扫描。


    通过在终端中输入 `ifconfig`，你可以使用它来检查你的活动网络连接状态。


    # 使用 ifconfig 命令扫描无线网络


    如果你有一个无线适配器，可以利用它获取无线黑客所需的关键数据，例如适配器的 IP 地址、MAC 地址、其所处的模式等。在使用 `airc-ng` 等无线黑客工具时，从从中学习到的信息是非常关重要的。


    # 修改你的网络信息


    能够修改 IP 地址和其他网络信息将允许你在访问其他网络的同时，在这些网络上表现得一个可靠的设备，这是一项重要技能。例如，你可以在拒绝服务（DoS）攻击中欺骗你的
    IP，使攻击看起来来自不同的源，从而避免你的 IP 被捕获进行取证分析。Linux 中的 `ifconfig` 命令用于完成这一简单过程。


    # 修改你的 IP 地址


    输入 `ifconfig`、你想要重新分配的接口以及你想要分配给接口的新 IP 地址来更改你的 IP 地址。例如，要给 `eth0` 接口分配 IP 地址
    `192.168.181.115`，


    ```

    Kali >ifconfig eth0 192.168.181.115

    ```


    ```

    kali >

    ```


    如果你操作成功，Linux 将返回命令行界面且什么都不说。这是有利的！随后，当你再次使用 `ifconfig` 检查网络连接时，你应该发现你的 IP 地址已更改为你刚刚分配的新
    IP 地址。


    # 修改你的网络掩码和广播地址


    `ifconfig` 命令还允许你更改网络掩码（netmask）和广播地址。例如，如果你想给同一个 `eth0` 接口设置掩码 `255.255.0.0`
    和广播地址 `192.168.1.255`，可以输入：


    ```

    Kali >ifconfig eth0 192.168.181.115 netmask 255.255.0.0 broadcast 192.168.1.255

    kali >

    ```


    再次，假设一切按照计划进行，Linux 将返回一个新的命令提示符。再次输入 `ifconfig` 以确认所有选项都已正确调整。


    # 欺骗你的 MAC 地址


    你可以使用 `ifconfig` 命令修改 MAC 地址。由于 MAC 地址是全球唯一的，它经常被安全机制用于防止黑客访问网络或对其进行追踪。更改 MAC
    地址并伪装另一个 MAC 地址几乎非常简单，这会破解那些安全程序。因此，它是绕过网络访问控制的有用工具。使用 `ifconfig` 命令的 `down` 选项关闭接口（在本例中为
    `eth0`）以伪造你的 MAC 地址。接下来，输入 `ifconfig` 命令，跟随接口名称（`hw` 代表硬件，`ether` 代表以太网）以及新创建的伪
    MAC 地址。为了使修改生效，最后必须使用 `up` 选项将接口恢复启动。


    IP 地址分配 Linux 有一个 DHCP（动态主机配置协议）服务器，它运行一个守护进程（后台进程），称为 `dhcpd` 或 DHCP 守护进程。连接到子网的所有系统都将由
    DHCP 服务器分配 IP 地址。此外，它会在日志中跟踪哪台机器当前分配了哪个 IP 地址。这使其成为取证调查人员在攻击后识别黑客的价值工具。正因为如此，理解
    DHCP 服务器如何运作非常有帮助。通常情况下，从局域网连接到互联网需要一个 DHCP 分配的 IP。


    在设置静态 IP 地址后，你必须回来获取一个新的 DHCP 分配的 IP 地址。你可以重启电脑来实现，但我将教你一种不需要重启即可获取新 DHCP 方法。通过
    DHCP 请求 IP 地址仅需向 DHCP 服务器发送 `dhclient` 请求，然后指定你想要分配地址的接口。不同的 Linux 发行版使用不同的 DHCP
    客户端。例如，Kali 使用 `dhclient` 它是基于 Debian 的。


