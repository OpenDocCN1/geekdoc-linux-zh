  md: '# Dynamic Host Configuration Protocol (DHCP)


    DHCP is a network management protocol used to automate the process of configuring
    devices on IP networks, allowing them to use dynamically assigned IP addresses
    and network configurations.


    # Installing DHCP Server


    ```

    $ sudo apt update

    $ sudo apt install isc-dhcp-server

    ```


    # Configuring DHCP Server


    Edit the DHCP configuration file, typically located at

    $ sudo nano /etc/dhcp/dhcpd.conf

    Add the following configuration to define the DHCP range and options:


    ```

    subnet 192.168.1.0 netmask 255.255.255.0 {

    range 192.168.1.100 192.168.1.200;

    option routers 192.168.1.1;

    option subnet-mask 255.255.255.0;

    option domain-name-servers 8.8.8.8, 8.8.4.4;

    option domain-name "gitforgits.com";n}

    ```


    # Starting DHCP Service'
  merge: -1
  img_proc: true
