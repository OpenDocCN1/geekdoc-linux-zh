    # Adding a Default Route


    A default route is used to send packets to destinations not specified in the routing
    table. The following command sets a default route via the gateway


    ```

    $ sudo ip route add default via 192.168.1.1

    ```


    # Adding a Static Route


    Static routes are used for directing packets to specific networks. The below code
    snippet adds a route to the network 10.0.0.0/24 via the gateway


    ```

    $ sudo ip route add 10.0.0.0/24 via 192.168.1.254

    ```


    # Deleting a Route


    To delete a route, use the following command:


    ```

    $ sudo ip route del 10.0.0.0/24 via 192.168.1.254

    ```


