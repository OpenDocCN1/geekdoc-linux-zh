- pgno: 95
  md: 'Save and Restore Rules:


    +   > Saves the current rules to a file.

    < Restores rules from a file.


    Targets in


    ACCEPT: Allows the packet to pass.

    DROP: Discards the packet without any response.

    REJECT: Discards the packet and sends an appropriate response to the sender.

    LOG: Logs the packet details to the system log.


    # ‘firewalld’ Syntax and Commands


    firewalld simplifies firewall management by using zones and predefined services.
    Zones define the trust level for network interfaces, and services define de sets
    of rules for common applications.


    Zones in


    Drop: Any incoming network packets are dropped, with no reply.

    Block: Any incoming network connections are rejected with an icmp-prohibited message.


    Public: For use in untrusted public areas. You do not trust other computers but
    can allow selected incoming connections.

    External: For use on external networks with masquerading enabled.'
  merge: -1
