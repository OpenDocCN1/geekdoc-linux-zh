- pgno: 80
  md: '# Scaling Wireless Networks


    Scaling a wireless network involves expanding its capacity and coverage to support
    more devices and users. This process includes adding new access points, configuring
    switches, and ensuring that the network can handle increased traffic without performance
    degradation.


    # Assessing Current Network Capacity


    Begin by assessing the current network capacity and identifying areas that require
    expansion. Use network monitoring tools to gather data on traffic patterns, device
    counts, and coverage gaps.


    # Adding New Access Points


    To scale the network, add new wireless access points (APs) to extend coverage
    and support more devices.


    Choose access points that support the required wireless standards (e.g., 802.11ac,
    802.11ax) and have sufficient capacity for the expected number of devices.


    Physically install the new access points in strategic locations to ensure optimal
    coverage. Configure the access points using their management interface.


    Following is the sample configuration for Ubiquiti UniFi AP:


    Access the UniFi Controller interface via a web browser.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Go to the "Devices" section and click "Adopt" next to the new access point.


    Set the SSID (network name) and configure security settings (e.g., WPA2, WPA3).


    Optimize the channels and transmit power to minimize interference.


    # Configuring Switches


    Configure network switches to handle increased traffic and ensure efficient data
    flow between wired and wireless devices.


    Access the switch management interface using a web browser or command-line tool.


    Following is the sample configuration for Cisco Switch:


    ```

    # Log in to the switch

    ssh admin@switch_ip_address

    # Enter global configuration mode

    switch> enable

    switch# configure terminal

    # Configure VLAN for wireless network

    switch(config)# vlan 10

    switch(config-vlan)# name Wireless

    switch(config-vlan)# exit

    # Assign VLAN to switch ports connected to APs

    switch(config)# interface gigabitethernet 0/1

    switch(config-if)# switchport mode access

    switch(config-if)# switchport access vlan 10

    switch(config-if)# exit

    # Save the configuration

    switch(config)# end

    switch# write memory

    ```'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Ensuring Network Scalability


    Implement Quality of Service (QoS) policies and load balancing to

    ensure network scalability and performance.


    Prioritize network traffic to ensure that critical applications receive

    sufficient bandwidth.


    Following is the sample QoS configuration:


    ```

    # Log in to the switch

    ssh admin@switch_ip_address

    # Enter global configuration mode

    switch> enable

    switch# configure terminal

    # Define QoS policy

    switch(config)# class-map match-all HighPriority

    switch(config-cmap)# match ip dscp 46

    switch(config-cmap)# exit

    switch(config)# policy-map QSPolicy

    switch(config-pmap)# class HighPriority

    switch(config-pmap-c)# set dscp 46

    switch(config-pmap)# exit

    # Apply QoS policy to interface

    switch(config)# interface gigabitethernet 0/1

    switch(config-if)# service-policy input QSPolicy

    switch(config-if)# exit

    # Save the configuration

    switch(config)# end

    switch# write memory

    ```


    # Configuring Access Points, Switches, and Routers'
  merge: -1
  img_proc: true
