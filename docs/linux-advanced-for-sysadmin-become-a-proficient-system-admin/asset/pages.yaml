    ```


    Update the bind directive in HAProxy to point to the generated certificates.


    # Health Checks and Failover


    HAProxy performs health checks to ensure back-end servers are available. If a
    server fails the health check, it is automatically removed from the pool.


    Following is the sample health check configuration:

    backend http_back balance roundrobin server web1 192.168.1.101:80 check fall 3
    rise 2 server web2 192.168.1.102:80 check fall 3 rise 2


    check: Enables health checks.

    fall 3: Server is considered down after 3 consecutive failed health checks.

    rise 2: Server is considered up after 2 consecutive successful health checks.


