- pgno: 52
  md: 'Determine if devices communicate with each other over the network.

    Understand delays and data loss in network communication.

    Identify the route taken by packets from the source to the destination.

    Detect unauthorized access and potential threats.

    Make adjustments to improve speed and efficiency.


    # Exploring ‘ping’


    The ping command is a simple yet powerful tool for diagnosing network connectivity
    issues. It sends ICMP (Internet Control Message Protocol) Echo Request packets
    to a target host and waits for Echo Reply packets. This helps verify if the target
    host is reachable and measures the round-trip time.


    # Basic ‘ping’ Usage


    To check if a host is reachable, use the ping command followed by the IP address
    or hostname of the target.


    ```

    $ ping 192.168.1.1

    ```


    Following is the sample output:

    PING 192.168.1.1 (192.168.1.1) 56(84) bytes of data.

    64 bytes from 192.168.1.1: icmp_seq=1 ttl=64 time=0.234 ms

    64 bytes from 192.168.1.1: icmp_seq=2 ttl=64 time=0.218 ms

    64 bytes from 192.168.1.1: icmp_seq=3 ttl=64 time=0.211 ms


    # Specifying the Number of Packets


    Use the -c option to specify the number of packets to send.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '```

    $ ping -c 4 192.168.1.1

    ```


    # Continuous Ping


    To continuously ping a host until interrupted, use the ping command without the
    -c option.


    ```

    $ ping alphaproject.local

    ```


    # Ping with Interval


    Use the -i option to set the interval between packets.


    ```

    $ ping -i 2 192.168.1.1

    ```


    # Ping with Packet Size


    Use the -s option to specify the size of the packets.


    ```

    $ ping -s 1000 192.168.1.1

    ```


    # Interpreting ‘ping’ Results


    Round-Trip Time (RTT): Indicates the time taken for a packet to travel to the
    target and back.


    Packet Loss: Shows the percentage of packets lost during transmission. TTL (Time
    to Live): Indicates the number of hops a packet can make before being discarded.


