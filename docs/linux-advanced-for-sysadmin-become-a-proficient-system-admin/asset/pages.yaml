    # Data Encryption


    # Encrypting Data at Rest


    Encrypt the database files on disk to protect data if the physical storage is
    compromised. Use LUKS (Linux Unified Key Setup) to encrypt the file system where
    PostgreSQL data is stored.


    ```

    $ sudo cryptsetup luksFormat /dev/sdX

    ```


    ```

    $ sudo cryptsetup luksOpen /dev/sdX encrypted_data

    ```


    ```

    $ sudo mkfs.ext4 /dev/mapper/encrypted_data

    ```


    ```

    $ sudo mount /dev/mapper/encrypted_data /var/lib/postgresql

    ```


    # Column-Level Encryption


    Use PostgreSQL''s built-in functions or extensions to encrypt specific columns.
    Install the pgcrypto extension if not already installed:


    ```

    $ -u postgres pgsql -c "CREATE EXTENSION pgcrypto;"

    ```


    Encrypt sensitive data when inserting:


    ```

    INSERT INTO users (username, password, email)

    VALUES (''john_doe'', crypt(''password123'', gen_salt(''bf'')),

    ''john.doe@gitforge.com'');

    ```


    Decrypt data when querying:


    ```

    SELECT username, email, (password = crypt(''password123'',

    password)) AS password_match

    FROM users

    WHERE username = ''john_doe'';

    ```'
