    ## 修改 Snort 配置以启用 inline模式


    编辑 Snort 配置文件以启用 inline模式：

    $ sudo nano /etc/snort/snort.conf

    确保包含以下行：

    config policy_mode:inline


    ## 定义防御规则


    添加规则以丢弃匹配特定模式的数据包。例如，丢弃 SSH 暴力破解尝试：

    drop tcp any any -> $HOME_NET 22 (msg:"SSH Brute Force Attempt"; flow:to_server,established;
    detection_filter:track by_src, count 5, seconds 120; id:1000003; rev:1);


    将此规则添加到 local.rules 文件：

    $ sudo nano /etc/snort/rules/local.rules

    添加防御规则：


    drop tcp any any -> $HOME_NET 22 (msg:"SSH Brute Force Attempt"; flow:to_server,established;
    detection_filter:track by_src, count 5, seconds 120; sid:1000003; rev:1);


    ## 配置 iptables 以支持 inline模式


    配置 iptables，使用 NFQUEUE 目标将数据包传递给 Snort：


    ```

