    # Configuring Triggers in Nagios


    Triggers in Nagios are defined using service checks that return critical, warning,
    or OK statuses. These checks are configured to monitor various parameters like
    disk space, CPU load, memory usage, and more.


    ### Define a Service Check


    Edit the Nagios configuration file to define a service check. For example, to
    check disk space:


    ```

    $ sudo nano /usr/local/nagios/etc/objects/alphaproject.cfg

    ```

    Add the following service definition:

    ```

    define service { use generic-service host_name alphaproject_server

    service_description Disk Space check_command check_disk!20%!10%/ }

    ```


    `check_command`: Specifies the command to run, in this case, with warning and
    critical thresholds of 20% and 10% respectively.


    # Define Notification Options


    Define who gets notified and how. This can be set in the contacts file:

    ```

    $ sudo nano /usr/local/nagios/etc/objects/contacts.cfg

    ```

    Add a contact definition:

    ```

    define contact { contact_name admin alias Admin admin@gitforge.com service_notification_period
    24x7

