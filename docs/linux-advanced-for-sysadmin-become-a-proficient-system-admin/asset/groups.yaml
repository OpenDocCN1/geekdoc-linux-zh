    # Implementing Load Balancing


    # Introduction to Load Balancers


    When deploying on a big scale, load balancers play an essential role in distributing
    application or network traffic among numerous servers. To improve availability,
    dependability, and performance, load balancing primarily aims to prevent any one
    server from becoming a bottleneck. Layer 4 (transport) and Layer 7 (application)
    are two examples of the network stack layers at which load balancers can function.


    # Types of Load Balancers


    Hardware Load Balancers: Physical devices that distribute traffic. Software Load
    Balancers: Software solutions running on standard hardware.


    DNS Load Balancing: Using DNS to distribute traffic across multiple IP addresses.


    # Common Algorithms


    Round Robin: Distributes traffic equally across all servers. Least Connections:
    Directs traffic to the server with the fewest active connections.


    IP Hash: Uses the client’s IP address to determine which server receives the request.'
  - '[PAGE 320]


    # Monitoring System Load


    Before implementing load balancing, it is crucial to monitor the system load to
    understand traffic patterns and identify potential bottlenecks. Tools such as
    iostat are commonly used for monitoring system load in Linux.


    Using top and htop to Monitor System Load:


    ```

    $ top $ htop

    ```


    Using vmstat to Monitor System Performance:


    ```

    $ vmstat 1 10

    ```


    Using iostat to Monitor Disk I/O:


    ```

    $ iostat -xz 1 10

    ```


    These commands provide real-time insights into CPU usage, memory usage, process
    statistics, and disk I/O, helping sysadmins determine if load balancing is necessary.


    # Sample Program: Load Balancing using HAProxy


    One of the most well-known open-source software load balancers, HAProxy, has multiple
    load balancing methods and can manage many concurrent connections. Following is
    the process for configuring HAProxy to provide load balancing:


    Installing HAProxy


    ```

    $ sudo apt update $ sudo apt install hapxy

    ```


    # Configuring HAProxy'
  - '[PAGE 321]


    Edit the HAProxy configuration file to set up load balancing. The default configuration
    file is located at


    Given below is the example of the configuration:


    ```

    global log /dev/log0 log /dev/log1 notice chroot

    /var/lib/hapxy stats socket /run/hapxy/admin.sock mode 660 level

    admin expose-d front listeners stats timeout 30s user group hapxy

    daemons defaults global log global mode http option httlog option dontnull

    timeout connect 5000 timeout client 5000 timeout server 5000 error

    400 /etc/happroxy/errors/400.http error 403 /etc/happroxy/errors/403.http

    error 408 /etc/happroxy/errors/408.http error 500

    /etc/happroxy/errors/500.http error 502 /etc/happroxy/errors/502.http

    error 503 /etc/happroxy/errors/503.http error 504

    /etc/happroxy/errors/504.http frontend http_front bind *:80 uri

    /happroxy?stats default_backend http_back backend http_back back

    roundrobin server web1 192.168.1.101:80 check server web2

    192.168.1.102:80

    ```


    In the above code snippet, front: Defines the front-end configuration listening
    on port 80.


    backend http_back: Defines the back-end servers and the load balancing algorithm
    (round robin).


    server web1 192.168.1.101:80 check: Specifies a back-end server with

    health check enabled.


    Restarting HAProxy


    Apply the configuration changes by restarting HAProxy:


    ```

    $ sudo systemctl restart happroxy

    ```'
  - '[PAGE 322]


    # Verifying Load Balancer Configuration


    To ensure the load balancer is working correctly, access the HAProxy statistics
    page or use curl to simulate traffic.


    ```

    $ for i in {1..10}; do curl -I http://; done

    ```


    Observe the distribution of requests across the back-end servers.


    # Advanced Load Balancing


    # Using Least Connections Algorithm


    Modify the backend section in the HAProxy configuration to use the least connections
    algorithm:


    ```

    backend http_back balance leastconn server web1 192.168.1.101:80 check server
    web2 192.168.1.102:80 check

    ```


    # Load Balancing with SSL Termination


    To handle SSL termination at the load balancer, update the HAProxy configuration:


    ```

    frontend https_front bind *:443 ssl crt /etc/hapxy/certs/site.pem default_backend
    http_back backend http_back balance roundrobin server web1 192.168.1.101:80 check
    server web2 192.168.1.102:80 check

    ```


    # Generate SSL Certificates


    Let’s Encrypt or OpenSSL to generate SSL certificates. Following is the example
    with Let’s Encrypt:'
  - '[PAGE 323]


    ```

    $ apt-get install certbot $ sudo certbot certonly --standalone -d yourdomain.com

    ```


    Update the bind directive in HAProxy to point to the generated certificates.


    # Health Checks and Failover


    HAProxy performs health checks to ensure back-end servers are available. If a
    server fails the health check, it is automatically removed from the pool.


    Following is the sample health check configuration:

    backend http_back balance roundrobin server web1 192.168.1.101:80 check fall 3
    rise 2 server web2 192.168.1.102:80 check fall 3 rise 2


    check: Enables health checks.

    fall 3: Server is considered down after 3 consecutive failed health checks.

    rise 2: Server is considered up after 2 consecutive successful health checks.


    # Monitoring and Managing Load Balancer


    Viewing HAProxy Logs:

    Logs are configured in the global section of the HAProxy configuration. To view
    HAProxy logs:


    ```

    $ tail -f /var/log/haproxy.log

    ```


    Enabling HAProxy Management Interface:

    To enable the HAProxy management interface, add the following to the configuration:'
  - '[PAGE 324]


    frontend stats bind*:8404 stats enable stats / stats refresh 10s stats auth admin:password


    Access the interface via http://8404.

    By using tools like HAProxy, sysadmins can easily configure and manage load balancers.
    Monitoring system load using tools like and iostat helps identify bottlenecks
    and optimize resource utilization. Advanced configurations such as least connections
    algorithm, SSL termination, and health checks provide robust and efficient load
    balancing solutions for large-scale deployments like AlphaProject.


    # Customizing Kernel


    # Kernel Customization Overview


    Operating systems rely on their kernels to manage hardware resources and facilitate
    software-hardware communication. Improving security, adding new features, optimizing
    performance, and supporting specific hardware are all possible through kernel
    customization. This procedure incorporates user-defined modules, recompiles the
    kernel, and modifies kernel parameters.


    Following are some situations where kernel customization may be necessary:


    Performance Optimization: Tailoring the kernel to improve performance for specific
    workloads.


    Hardware Support: Adding or enhancing support for new or specialized hardware.


    Security Enhancements: Integrating security patches or hardening the kernel against
    vulnerabilities.'
  - '[PAGE 325]


    Feature Additions: Enabling or disabling specific kernel features based on project
    requirements.


    Troubleshooting: Debugging and resolving issues related to kernel functionality.


    # Step-by-Step Customizing Kernel


    # Preparing the Environment


    Ensure the system is updated and necessary packages are installed for kernel compilation.


    ```

    $ sudo apt update sudo apt upgrade $ sudo apt install build-essential libncurses-dev
    bison flex libssl-dev libelf-dev

    ```


    # Downloading the Kernel Source


    Download the latest or required kernel source from the official website.

    $ wget https://cdn.kernel.org/pub/linux/kernel/v5.x/linux-5.10.1.tar.xz tar -
    xf linux-5.10.1.tar.xz cd linux-5.10.1


    # Configuring the Kernel


    Configure the kernel options. This can be done using a menu-driven interface.


    ```

    $ make menuconfig

    ```


    Navigating


    Processor Type and Features: Customize CPU-specific options.'
  - '[PAGE 326]


    General Setup: General kernel settings.


    Device Drivers: Enable or disable support for specific hardware.

    File Systems: Include or exclude support for different file systems.

    Networking Support: Configure networking protocols and features.


    # Compiling the Kernel


    Compile the kernel and its modules. This process can be time-consuming based on
    the system’s capabilities.


    ```

    $ make -j$(nproc) $ make modules_install $ sudo make install

    ```


    # Updating the Bootloader


    Update the bootloader to include the new kernel. For systems using GRUB, update
    GRUB configuration.


    ```

    $ sudo update-grub

    ```


    # Rebooting into the New Kernel


    Reboot the system to use the newly compiled kernel.

    Verify the running kernel version after reboot.


    ```

    $ sudo reboot

    $ uname -r

    ```


