    \ 集群由一个或多个工作节点和一个或多个主节点组成。工作节点负责负载，而主节点负责监督所有工作节点以及运行在它们上的容器（Pod）。\n\nKubernetes\
    \ 集群的组件：\n\n- 主节点（Master Node）：管理集群的控制平面。\n  - kube-apiserver：暴露 Kubernetes API。\n\
