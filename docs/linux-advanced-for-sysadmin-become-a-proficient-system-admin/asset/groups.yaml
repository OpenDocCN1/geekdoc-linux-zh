    # Automated Failover


    Automated failover ensures that if a primary system fails, a backup system can
    take over automatically. To begin with, first install Keepalived as repeated in
    of the previous chapter:


    +   $ sudo apt-get install keepalived

    Configure Keepalived on both the primary and backup servers:

    $ sudo nano /etc/keepalived/keepalived.conf


    Following is the sample configuration for the primary server:

    vrp_script chk_haproxy { script "killall -0 haproxy" interval 2 }

    vrrp_instance VI_1 { interface eth0 state MASTER virtual_router_id 51 priority
    100 advert_int 1 authentication { auth_type PASS auth_pass 1234 } virtual_ipaddress
    { 192.168.1.100 } track_script { chk_haproxy }


    Following is the sample configuration for the backup server:

    vrp_script chk_haproxy { script "killall -0 haproxy" interval 2 }

    vrrp_instance VI_1 { interface eth0 state BACKUP virtual_router_id 51 priority
    90 advert_int 1 authentication { auth_type PASS auth_pass 1234 } virtual_ipaddress
    { 192.168.1.100 } track_script { chk_haproxy } }


    Restart Keepalived:

    $ sudo systemctl restart keepalived


