    # 创建自定义配置


    Wireshark 允许你创建具有特定设置和过滤器的自定义配置：


    - 点击 Edit > Configuration Profiles >

    - 输入配置名称并根据需要配置设置。


    切换配置以快速让 Wireshark 适应不同的分析场景。


    # 导出数据


    为了进行外部分析导出数据包数据：


    - 点击 File > Export Dissections >


    # 命令行使用 Wireshark


    Wireshark 还提供了命令行界面用于捕获和分析数据包。


    捕获数据包：

    ```

    tshark -i eth0 -w output.pcap

    ```


