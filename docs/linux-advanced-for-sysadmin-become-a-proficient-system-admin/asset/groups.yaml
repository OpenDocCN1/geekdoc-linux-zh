    $ sudo journalctl -u isc-dhcp-server

    $ sudo journalctl -u bind9

    $ sudo journalctl -u nfs-kernel-server

    识别任何错误消息或问题。如有需要，重启服务。

    $ sudo systemctl restart isc-dhcp-server

    $ sudo systemctl restart bind9

