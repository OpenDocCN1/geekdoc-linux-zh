    # Exploring Clusters


    A cluster is a collection of computers that share resources and operate as an
    integrated whole. In order to guarantee high availability, redundancy, and improved
    performance, clusters are utilized. One or more worker nodes and one or more master
    nodes make up a cluster in Kubernetes. Workers take care of workloads, while the
    master node oversees all the worker nodes and the containers (pods) that operate
    on them.


    Components of a Kubernetes Cluster:


    +   Master Node: The control plane that manages the cluster.


    +   - kube-apiserver: Exposes the Kubernetes API.

    - etcd: A distributed key-value store used for configuration data.

    - kube-scheduler: Schedules the pods on the worker nodes.

    - kube-controller-manager: Runs controller processes to regulate the state of
    the cluster.

    - cloud-controller-manager: Manages cloud-specific controller logic.

    - Worker Nodes: Execute the containers.


    +   - kubelet: Ensures that containers are running in a pod.

    - kube-proxy: Maintains network rules for pod communication.

    - Container Runtime: Runs the containers (e.g., Docker).


