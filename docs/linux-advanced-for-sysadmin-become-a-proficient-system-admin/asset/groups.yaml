    \ \"Disk usage is above $THRESHOLD% on ($hostname)\" | mail -s \"Disk Usage Alert\"\
    \ admin@gitforges.com\nfi\n```\n\n### 场景 4：用户管理\n\n用户账户可以自动化。我们将创建一个脚本来添加用户并设置密码。\n\
    以下是管理脚本：\n\n```bash\n#!/bin/bash\n# User management script\nUSERNAME=$1\nPASSWORD=$2\n\
    if [ \"$USERNAME\" &>/dev/null; then\n  echo \"User $USERNAME already exists\"\
