    of CPU, consider optimizing or distributing its workload.

    $ htop


    Use the interactive interface to sort processes by CPU usage and identify the
    resource-intensive ones.


    ## Optimizing Memory Usage


    Monitor memory usage using vmstat to identify memory bottlenecks.

    $ vmstat 5


    Following is the desired output:


    ```

    procs ---------memory----------swap -----io-----system-----

    cpu----- r b swpd free buff cache si so bo in cs us sy yd wa st 2 0 10240

    204800 50000 102400 0 0 1 2 10 20 5 2 90 3 0

    ```


    Focus on si (swap in) and so (swap out) columns. High values indicate heavy swapping,
    suggesting the need for more RAM or better memory management.


    ## Reducing Disk I/O


    Use iostat to monitor disk I/O performance.

    $ iostat -dx 5


    Following is the desired output:


    ```

    Device: rqrm/s wrqm/s r/s w/s rMB wMB/s avqr-sz avgqu-sz await

    r_await w_await svctm %util sda 0.00 0.00 0.40 1.20 0.01 0.05 72.00 0.10

    8.00 8.00 8.00 1.50 0.20

    ```


    Wherein,


    - r/s and w/s: Read and write requests per second.

    - await: Average wait time for I/O operations.

    - %util: Percentage of time the device is active.


    High values in await or %util indicate disk I/O bottlenecks. Consider using faster
    storage solutions or optimizing disk usage patterns.


    ## Enhancing Network Performance


    Use iftop to monitor network traffic and identify bandwidth issues.

    $ sudo iftop -i eth0

    Identify hosts consuming excessive bandwidth and examine further.

    Consider optimizing network configurations or upgrading network hardware if necessary.


