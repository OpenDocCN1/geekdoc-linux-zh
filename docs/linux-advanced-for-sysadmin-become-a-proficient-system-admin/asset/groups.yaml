    要将 Snort 配置为入侵防御系统 (IPS)，我们将使用 inline模式（在线模式）。此模式允许 Snort 主动丢弃或修改匹配预定义规则的数据包。


    ## 安装必要的包


    确保您已安装了 libnetfilter-queue 库：

