    Snort uses rules to detect patterns of malicious activity. These rules specify
    the conditions under which an alert should be generated. Rules consist of a header
    and options, where the header defines the rule''s action, protocol, source and
    destination IPs, and ports, and the options specify the content to match.


    Following is the sample rule to detect SSH brute force attacks:


    ```

    alert tcp any any -> $HOME_NET 22 (msg:"SSH Brute Force Attempt"; flow:to_server,established;
    detection_filter:track by_src, count 5, seconds 120; sid:1000002; rev:1);

    ```


    In the above snippet,


    alert specifies that Snort should generate an alert.'
  - '[PAGE 143]


    tcp indicates -> rule applies to TCP packets.

    any any -> $HOME_NET 22 matches any source IP and port to

    destination IPs in $HOME_NET on port 22 (SSH).

    msg provides a message for the alert; detection_filter limits alerts to

    repeated attempts; sid is the rule identifier; rev is the rule revision.


    # Add Rules to Local Rules


    Edit the local.rules file to add custom detection rules:

    $ sudo nano /etc/snort/local.rules

    Add the SSH brute force detection rule:

    alert tcp any any -> $HOME_NET 22 (msg:"SSH Brute Force

    Attempt"; flow:to_server,established; detection_filter:track by_src, count

    5, seconds 120; sid:1000002; rev:1);


    # Test Snort Configuration


    Test the Snort configuration to ensure there are no syntax errors:

    $ sudo snort -T /etc/snort/snort.conf


    # Start Snort in Detection Mode


    Start Snort in network intrusion detection mode:


    $ sudo snort -A console -c /etc/snort/snort.conf -i eth0

    Snort will now monitor network traffic and generate alerts for any SSH

    brute force attempts.


    # Using Snort for Intrusion Prevention'
