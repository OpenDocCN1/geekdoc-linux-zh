    ### 场景 6：网络健康检查\n\n自动化网络健康检查确保了连接性。我们将创建一个脚本 ping 一组服务器并报告它们的状态。\n以下是脚本：\n\n```bash\n\
    #!/bin/bash\n# Network health check script\nSERVERS=(\"192.168.1.1\" \"192.168.1.2\"\
    \ \"www.google.com\")\nLOGFILE=/var/log/network_health.log\necho \"Checking network\
