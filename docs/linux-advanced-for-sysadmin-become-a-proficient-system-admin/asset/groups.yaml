    # Introduction


    Part of being a good system administrator is being able to manage networks, and
    in this chapter, "Managing Networks," you will learn how it is done. Understanding
    network interfaces, the building blocks of Linux network connectivity, will be
    your first step. You can ensure that your systems can communicate internally and
    outside by learning to configure IP addresses and routing. This will enable you
    to set up and manage network communication successfully.


    The next step is to learn how to administer network services like NFS, DNS, and
    DHCP. Domain name resolution, file sharing across networks, and dynamic IP address
    allocation are three services that are absolutely necessary. You will learn to
    detect network faults using tools like traceroute and ping, which will help you
    maintain a healthy network environment.


    In this chapter, you will learn how to set up network file systems, which will
    make sharing files across many platforms simple and straightforward. By keeping
    an eye on network traffic with Wireshark, you may examine data from your network
    and spot unusual activity. We will put a lot of emphasis on troubleshooting network
    difficulties so that you may learn to recognize and fix typical network problems.


    Lastly, you will gain knowledge of wireless network management and how to build
    high availability to keep your network services operational despite hardware failures
    or other interruptions. In order to ensure that'
