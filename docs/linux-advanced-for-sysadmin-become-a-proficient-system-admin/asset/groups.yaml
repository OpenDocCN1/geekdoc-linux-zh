    \ Snort to begin monitoring and logging alerts:\n$ sudo snort -A console -c /etc/snort/snort.conf\
    \ -i eth0\nSnort will now monitor network traffic and log alerts based on the\
    \ defined rules.\n\n## Pull Snort Logs\n\nUse the previously created script to\
    \ pull Snort logs to the central log server.\n"
