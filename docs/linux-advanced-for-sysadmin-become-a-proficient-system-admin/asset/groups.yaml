    ## 示例程序：自动化每日报告\n\n系统管理员的一个常见任务是生成系统健康和性能的每日报告。可以使用 shell 脚本实现自动化。\n\n以下是每日报告示例脚本：\n\
    \n```bash\n#!/bin/bash\nREPORT_FILE=\"/var/report/daily-report-$(date +%F).txt\"\
