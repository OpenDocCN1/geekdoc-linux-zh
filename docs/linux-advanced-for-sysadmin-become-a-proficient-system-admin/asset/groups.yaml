    此输出显示了数据包到达主机并返回的延迟（毫秒级时间）。持续的高延迟或丢包表明存在网络问题。


    ## 使用 ‘traceroute’ 追踪网络路径


    traceroute 显示了数据包到达网络主机所经过的路径，有助于诊断路由问题。

    运行 traceroute 命令：


    - $ traceroute www.gitforge.com


    以下是预期的输出：

    traceroute to www.gitforge.com (93.184.216.34), 30 hops max, 60 byte packets 1
    router.local (192.168.1.1) 1.223 ms 1.173 ms 1.157 ms 2 10.0.0.1 (10.0.0.1) 2.432
    ms 2.427 ms 2.418 ms 3 172.16.0.1 (172.16.0.1) 15.367 ms 15.537 ms 15.524 ms 4
    example.net (93.184.216.34) 13.343 ms 13.320 ms 13.301


    在上述输出中，每一行显示了路径中的一个跳数（hop），包括路由器 IP 和往返时间。特定跳数上的延迟或超时可以指示问题发生的位置。


    ## 使用 ‘iftop’ 监控带宽使用


    iftop 是一个基于控制的实时网络带宽监控工具。首先，安装 iftop：

    $ sudo apt-get install iftop

    运行 iftop 命令：

    $ sudo iftop

    以下是预期的输出：


    interface eth0 => dst. \<= src 192.168.1.2:49152 => 93.184.216.34:80 4.00Kb 4.00Kb
    4.00Kb 192.168.1.2:49152 <= 93.184.216.34:80 3.00Kb 3.00Kb TX: cum: 4.00Kb peak:
    4.00Kb rates: 4.00Kb 4.00Kb 4.00Kb RX: cum: 3.00Kb peak: 3.00Kb rates: 3.00Kb
    3.00Kb TOTAL: cum: 7.00Kb peak: 7.00Kb rates: 7.00Kb 7.00Kb


    在上述 iftop 输出中，


    TX: 发送速率。

    RX: 接收速率。

    TOTAL: 合计流量。


    此输出有助于识别哪些主机正在消耗最多的带宽。


    ## 使用 ''netstat'' 显示网络统计


    netstat 提供网络统计信息和连接详情。


    ```

    $ netstat -tln

    ```


    以下是预期的输出：

    | Active Internet connections（仅限服务器） | Proto | Recv-Q | Send-Q | Local Address
    | Foreign Address | State |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | tcp | 0 | 0 | 0.0.0.0:22 | 0.0.0.0:* | LISTEN |

    | tcp6 | 0 | 0 | ::80 | *:* | LISTEN |

    | udp | 0 | 0 | 0.0.0.0:123 | 0.0.0.0:* | |

    | udp6 | 0 | 0 | ::123 | *:* | |


    在上述 netstat 输出中，


    Proto: 协议（TCP, UDP）。

    Recv-Q: 接收队列。

    Send-Q: 发送队列。

    Local Address: 本地地址和端口。

    Foreign Address: 远程地址和端口。

    State: 连接状态（如 LISTEN, ESTABLISHED）。


    此输出显示了活动连接和监听端口。


    ## 使用 ‘vnstat’ 监控流量


    vnstat 记录网络流量并提供使用统计。首先，安装 vnstat：

    - $ sudo apt-get install vnstat

    - 初始化数据库：

    - $ sudo vnstat -u eth0


    运行 vnstat 命令：

    - $ vnstat


    以下是预期的输出：


    ```

    rx / tx / total / estimated eth0: Apr ''24 1.95 GiB / 1.23 GiB / 3.18 GiB / 3.51
    GiB today 50.34 MiB / 30.20 MiB / 80.54 MiB / 101.2 MiB

    ```


    在下面的 vnstat 输出中，


    rx: 接收的数据。

    tx: 发送的数据。

    total: 合计流量。

    estimated: 特定期间的估计流量。


    此输出提供了网络使用的概览。


