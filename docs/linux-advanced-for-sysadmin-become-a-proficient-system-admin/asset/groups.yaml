    # Securing SSH Access


    Secure Shell (SSH) is a protocol used for secure remote login and other network
    services over an insecure network. While SSH provides a secure channel, it can
    still be a target for attacks such as brute force attempts, man-in-the-middle
    attacks, and unauthorized access.'
  - '[PAGE 148]


    Implementing additional security measures can significantly reduce these risks.


    Following are the techniques to secure SSH access:


    +   - Disabling Root Login

    - Using Key-Based Authentication

    - Changing the Default SSH Port

    - Limiting User Access

    - Enforcing Strong Password Policies

    - Using Two-Factor Authentication (2FA)

    - Configuring SSH with Fail2Ban


    # Disabling Root Login


    Disabling root login prevents attackers from directly accessing the root account,
    which has the highest privileges.


    ```

    Open the SSH configuration file:

    $ sudo nano /etc/ssh/sshd_config

    Find the following line and set it to

    PermitRootLogin no

    Restart the SSH service to apply the changes:

    $ sudo systemctl restart sshd

    ```


    # Using Key-Based Authentication


    Key-based authentication provides a more secure method of logging into SSH than
    password authentication.


    ```

    Generate a key pair on the client machine:

    $ ssh-keygen -t rsa -b 4096

    ```'
  - '[PAGE 149]


    Copy the public key to the server using

    $ ssh-copy-id user@server_ip

    Edit the SSH configuration file to disable password authentication:


    ```

    $ sudo nano /etc/ssh/sshd_config

    ```


    Set the following line to

    PasswordAuthentication no

    Restart the SSH service:

    $ sudo systemctl restart ssh


    # Changing Default SSH Port


    Changing the default SSH port (22) can reduce the risk of automated attacks targeting
    the default port.

    Open the SSH configuration file:

    $ sudo nano /etc/ssh/sshd_config

    Find the following line and change the port number:

    Port 2222

    Update the firewall rules to allow the new SSH port:

    $ sudo ufw allow 2222/tcp

    Restart the SSH service:

    $ sudo systemctl restart sshd


    # Limiting User Access


    Restricting SSH access to specific users or groups can further secure your system.

    Open the SSH configuration file:

    $ sudo nano /etc/ssh/sshd_config

    Add the following lines to restrict access:

    AllowUsers user1 user2'
  - '[PAGE 150]


    AllowGroups sshusers

    Restart the SSH service:

    $ sudo systemctl restart sshd


    # Enforcing Strong Password Policies


    Ensure users set strong passwords to enhance security. At first, install the libpam-pwquality
    module:

    $ sudo apt install libpam-pwquality

    Edit the PAM configuration for passwords:

    $ sudo nano /etc/pam.d/common-password

    Add the following line to enforce strong passwords:

    password requisite pam_pwquality.so retry=3 minlen=12 difok=3


    # Using Two-Factor Authentication (2FA)


    Add an extra layer of security with two-factor authentication can prevent unauthorized
    access even if passwords are compromised.

    Install the Google Authenticator PAM module:

    $ sudo apt install libpam-google-authenticator

    Run the following command for each user to set up 2FA:

    $ google-authenticator

    Address the prompts to configure 2FA for the user. Edit the SSH PAM file:

    n sudo nano /etc/pam.d/sshd

    Add the following line:

    auth required pam_google_authenticator.so

    Edit the SSH configuration file:

    $ sudo nano /etc/ssh/sshd_config

    Ensure the following lines are set:'
  - '[PAGE 151]


    ChallengeResponseAuthentication yes

    Restart the SSH service:

    $ sudo systemctl restart sshd


    # Configuring SSH with Fail2Ban


    Fail2Ban helps protect against brute force attacks by banning IP addresses that
    show malicious signs.

    Install Fail2Ban:

    $ sudo apt install fail2ban

    Create a local configuration file:

    $ sudo nano /etc/fail2ban/jail.local

    Add the following configuration for SSH:

    ```

    [sshd]

    enabled = true

    port = 2222

    filter = sshd

    logpath = /var/log/auth.log

    maxretry = 3

    ```


    Restart the Fail2Ban service:

    $ sudo systemctl restart fail2ban

    Check the status of Fail2Ban to ensure it is working correctly:

    $ sudo fail2ban-client status sshd

    Following is the sample output:

    Status for the jail: sshd

    |- Filter

    |- Currently failed: 1

    |- Total failed: 5

    |- File list: /var/log/auth.log

