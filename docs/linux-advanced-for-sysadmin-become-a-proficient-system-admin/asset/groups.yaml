    ## 使用 Lynis 进行安全更新和补丁


    Lynis 在审计过程中有助于识别过期软件包并推荐安全补丁。


    ## 运行 Lynis 审计


    首先，运行 Lynis 审计以检查过期的软件包和必要的安全更新：


    ```

    $ sudo lynis audit system

    ```


    Lynis 将扫描您的系统并列出任何需要关注的过期软件包或安全漏洞。


    ## 分析 Lynis 输出


    查看 Lynis 的输出以识别需要更新的软件包。寻找报告中突出显示过期软件或建议更新的章节。


