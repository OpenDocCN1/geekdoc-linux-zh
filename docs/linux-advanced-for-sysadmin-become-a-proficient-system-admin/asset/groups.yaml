    $ sudo -i -u postgres


    ```

    $ psql

    CREATE USER nagios_user WITH PASSWORD ''yourpassword'';

    GRANT CONNECT ON DATABASE alphaproject_db TO nagios_user;

    GRANT USAGE ON SCHEMA public nagios_user;

    GRANT SELECT ON ALL TABLES IN SCHEMA public nagios_user;

    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO nagios_user;

    q

    ```


    # Configure Nagios to Use the PostgreSQL Plugin


    Edit the Nagios configuration to add commands for monitoring PostgreSQL. Open
    the commands.cfg file:

    $ sudo nano /usr/local/nagios/etc/objects/commands.cfg


    Add the following command definition for

    define command {

    command_line check_postgres_connection

    command_line=/usr/lib/nagios/plugins/check_postgres --

    host=$HOSTADDRESS$--dbuser=nagios_user --\dbname=alphaproject_db --action=connection

    }


