    To configure Snort as an Intrusion Prevention System (IPS), we will use the inline
    mode. This mode allows Snort to actively drop or modify packets that match predefined
    rules.


    # Install Necessary Packages


    Ensure you have the libnetfilter-queue library installed:

    $ sudo apt install libnetfilter-queue-dev


    # Modify Snort Configuration for Inline Mode


    Edit the Snort configuration file to enable inline mode:

    $ sudo nano /etc/snort/snort.conf

    Ensure the following lines are included:

    config policy_mode:inline


    # Define Prevention Rules


    Add rules to drop packets that match specific patterns. For example, to drop SSH
    brute force attempts:

    drop tcp any any -> $HOME_NET 22 (msg:"SSH Brute Force Attempt"; flow:to_server,established;
    detection_filter:track by_src, count 5, seconds 120; id:1000003; rev:1);


    Add this rule to the local.rules file:

    $ sudo nano /etc/snort/rules/local.rules

    Add the prevention rule:


    drop tcp any any -> $HOME_NET 22 (msg:"SSH Brute Force Attempt"; flow:to_server,established;
    detection_filter:track by_src, count'
  - '[PAGE 145]


    5, seconds 120; sid:1000003; rev:1);


    Configure iptables for Inline Mode


    Configure iptables to pass packets to Snort using the NFQUEUE target:


    ```

    $ sudo iptables -I INPUT -p tcp --dport 22 -j NFQUEUE --queue-num 0

    ```


    This command inserts a rule to send incoming TCP packets on port 22 (SSH) to NFQUEUEUE
    0.


    Start Snort in Inline Mode


