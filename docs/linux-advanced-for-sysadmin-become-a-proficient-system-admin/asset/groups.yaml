    nameserver 8.8.4.4

    确保 DNS 服务器配置正确。


    ## 网络性能缓慢


    ### 高延迟和数据包丢包


    使用 `ping` 测量延迟。


    ```

    $ ping -c 10 google.com

    以下是示例输出：

