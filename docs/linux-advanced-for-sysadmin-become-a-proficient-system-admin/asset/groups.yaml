  - '[PAGE 199]


    # Connection Time


    It measures the time taken to establish a connection to the database.

    The Nagios command is check_postgres --action=connection


    # Cache Hit Ratio


    It is the percentage of times the data is read from the cache rather than the
    disk and the Nagios command is check_postgres --action=cache_hit

    Following the command definition for cache hit ratio:


    ```

    define command {

    command_name check_postgres_cache_hit

    command_line=/usr/lib/nagios/plugins/check_postgres --nhost=$HOSTADDRESS --dbuser=nagios_user
    --dbname=alphaproject_db --action=cache_hit

    }

    ```


    And, below is the service definition for cache hit ratio:

    define service {

    use generic-service

    host_name localhost

    service_description PostgreSQL Cache Hit Ratio

    check_command check_postgres_cache_hit

    check_interval 5

    retry_interval 1

    max_check_attempts 3

    check_period 24x7

    notification_interval 60

    notification_period 24x7

    contacts nagiosadmin

    }'
