    \ -f1 -d: /etc/passwd); do\n  if [ -f /home/$user/.bash_history ]; then\n    echo\
    \ \"Commands executed by $user:\" >> $LOGFILE\n    tail -n 10 /home/$user/.bash_history\
    \ >> $LOGFILE\n  fi\ndone\necho \"User Activity Audit completed at $(date)\" >>\
    \ $LOGFILE\n```\n\n在上述代码段中，\nLOGFILE: 指定记录审计信息的日志文件。\n\n- who: 列出当前登录登录用户。\n-\
    \ last: 显示最近的登录尝试。\n- .bash_history: 包含每个用户的命令历史。\n\n运行脚本：\n$ chmod +x user_activity_audit.sh\n\
