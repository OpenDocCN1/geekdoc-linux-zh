    # High Availability Clustering


    High Availability (HA) clustering ensures that if one node fails, another can
    take over its workload.


    # Install and Configure HA Cluster


    ```

    Use tools like Pacemaker and Corosync to set up an HA cluster.

    $ sudo apt-get install pacemaker corosync

    Edit the Corosync configuration file:

    $ sudo nano /etc/corosync/corosync.conf

    Following is the sample configuration:

    totem { version: 2 scauth: on threads: 0 interface { ringnumber: 0

    bindnetaddr: 192.168.1.0 mcastaddr: 239.255.1.1 mcastport: 5405 }

    quorum { provider: corosync_votequorum two_node: 1 }

    Start and enable the services:

    ```'
  - '[PAGE 259]


    $ sudo systemctl start cosync $ sudo systemctl start pacemaker $

    sudo systemctl enable corync $ sudo systemctl enable pacemaker

    Add nodes to the cluster:

    $ sudo pcs cluster auth node1 node2 $ sudo pcs cluster setup --name

    mycluster node1 node2 $ sudo pcs cluster start --all


    # Create Resources and Constraints


    Create resources for the services you want to maintain high availability

    for, such as a web server.

    $ sudo pcs resource create WebServer ocf:heartbeat:apache

    configFile=/etc/apache2/apache2.conf op monitor interval=30s

    Set constraints to ensure the resource runs on only one node at a time:

    $ sudo pcs constraint location add WebServer with WebServer-clone

    INFINITY $ sudo pcs constraint order WebServer then WebServer-clone


    # Load Balancing


    Load balancing distributes incoming network traffic across multiple

    servers to ensure no single server becomes overwhelmed.

    Install HAProxy:

    $ sudo apt-get install haproxy

    Configure HAProxy for balance traffic between backend servers:

    $ sudo nano /etc/haproxy/haproxy.cfg

    Following is the sample configuration:

    frontend http_front bind*:80 uri /haproxy?stats default_backend

    http_back backend http_back balance roundrobin server server1

    192.168.1.101:80 check server server2 192.168.1.102:80 check

    Restart HAProxy:

    $ sudo systemctl restart haproxy'
