    \ 测试缺失\n\n建议 (14)：\n--------------------------------\n* 安装防火墙\n(2017) 启用防火墙\n\
    * 配置法律横幅\n(2018) 未配置法律横幅\n\n## 合规性测试\n\nLynis 包含多种合规性测试，以确保你的系统符合行业标准和最佳实践。\n\n\
    ### 运行合规性测试\n\n使用以下命令运行合规性测试：\n$ sudo lynis audit system --compliance\n该命令将执行与合规标准相关的检查，如\
    \ PCI-DSS、HIPAA 和 CIS 基准。Lynis 将提供有关系统合规状态的详细报告。\n\n### 查看合规报告\n\n查看 Lynis 生成的合规报告。报告将突出系统符合或未符合合规要求的地方。解决已发现的问题以提高合规性。\n\
    \n合规状态：\n- PCI-DSS: 75%\n- HIPAA: 80%\n- CIS: 70%\n\n系统加固\n\nLynis 根据审计结果提供加固系统的建议。这些建议有助于提高系统的整体安全态势，如下：\n\
    \n识别加固建议\n\n"
