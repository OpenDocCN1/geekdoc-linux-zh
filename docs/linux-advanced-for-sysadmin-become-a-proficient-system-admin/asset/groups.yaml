    \ 验证集群\n\n检查节点状态：\n\n```\n$ kubectl get nodes\n```\n\n你应该能看到主节点和工作节点列出出来，且状态为\
    \ `Ready`。\n\n## 部署应用程序\n\n现在，我们将部署一个简单的 Nginx 应用来验证设置。\n\n创建部署：\n```\n$ kubectl\
