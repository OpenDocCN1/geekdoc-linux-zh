    检查接口状态。

    $ ip addr show eth0

    确保接口已启动且配置正确。


    ## 使用 `ping` 测试连接性


    Ping 网关和外部主机以测量延迟和丢包。

    $ ping -c 10 192.168.1.1

    $ ping -c 10 8.8.8.8

