    \ \"Disk Usage:\" >> $REPORT_FILE\necho \"\" >> $REPORT_FILE\necho \"Memory Usage:\"\
    \ >> $REPORT_FILE\nfree -m >> $REPORT_FILE\necho \"\" >> $REPORT_FILE\necho \"\
    Top Processes:\" >> $REPORT_FILE\ntop -b -n 1 | head -n 20 >> $REPORT_FILE\necho\
    \ \"\" >> $REPORT_FILE\necho \"Network Usage:\" >> $REPORT_FILE\nvnstat -d >>\
