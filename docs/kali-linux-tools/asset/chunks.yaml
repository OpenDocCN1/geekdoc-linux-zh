    # Dirb


    ## Description

    DIRB 是一个 Web 内容扫描器。它搜索现有的（以及隐藏的）Web 对象。它本质上通过对 Web 服务器发送基于字典的攻击并调查响应来工作。DIRB 带有一组预配置的攻击字典列表以便方便使用，但你也可以使用自定义字典列表。此外，DIRB
    有时可以用作典型的 CGI 扫描器，但记住——它是一个内容扫描器而不是漏洞扫描器。


    更多数据：[`dirb.sourceforge.net/faq.txt`](http://dirb.sourceforge.net/faq.txt)


    - **用法**: `dirb <url><your dict file>`

