    `pro` ( `Automated Corporate Enumerator` ) 是一个基础但强大的 VoIP 企业目录规范工具，它模拟 IP 电话的行为，下载给定电话可以在其屏幕界面上显示的名称和扩展字段。专家可以通过两种方式使用它：首先，可以通过
    `DHCP` 自动发现 `TFTP Server IP Address`，或者（其次）客户端可以将 `TFTP Server IP address` 作为工具的命令行边界。无论如何，你都应该通过
    `-m` 选项提供 IP 电话的 `MAC Address`，工具才能通过 `TFTP` 有效下载配置文件。


    **USAGE:** `pro [-I interface] [ - m macintosh address ] [ - t tftp server ip
    address | - c cdp mode | - v voice vlan id | - r vlan interface | - d verbose
    mode ]`


    **OPTIONS:** `http://ucsniff.sourceforge.net/ace.html`


    **EXAMPLE:** `pro - I eth0 - v 96 - m 00:1E:F7:28:9C:8E` (指示语音 VLAN ID 的模式)


    **EXAMPLE:** `pro - I eth0 - c 0 - m 00:1E:F7:28:9C:8E` (在 CDP 监听模式下自动查找语音 VLAN
    ID 的模式)


    **EXAMPLE:** `pro - I eth0 - c 1 - m 00:1E:F7:28:9C:8E` (在 CDP 模拟模式下自动查找语音 VLAN
    ID 的模式)


