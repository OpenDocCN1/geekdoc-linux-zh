    - 拦截代理，允许你评估和调整你的程序与目标应用程序之间的流量。

    - 应用程序感知蜘蛛虫 (Spider)，用于爬取内容和功能。

    - 高级 Web 应用程序扫描器，用于自动化发现各种弱点。

    - 入侵者工具 (Intruder)，用于执行强大的自定义攻击以发现并利用异常弱点。

    - 重复器 (Repeater)，用于控制和重新发送单个请求。

    - 排序器 (Sequencer)，用于测试会议令牌的随机性。

    - 保存工作并在稍后恢复工作的能力。

