    # cisco-ocs


    ## 描述

    `cisco-ocs` 也称为 `cisco-ocs` 批量扫描器。该工具提供单一功能，用于检查大范围的 IP 寻找 Cisco 设备或任何监听 TCP 端口
    `23` 的设备，尝试使用密钥 `cisco` 通过 `telnet` 登录，然后如果 Cisco 交换机已准备好通过 `telnet` 登录，则发送 `empower`
    命令，再次使用 `cisco` 作为 `empower` 密语，最后如果能够通过这些精确步骤获取 `empower` 摘要则报告成功。遗憾的是，这是该工具的主要功能，因为你无法指定尝试的密码列表，或者就目前而言你无法为要扫描的
    IP 地址设置任何标识。


