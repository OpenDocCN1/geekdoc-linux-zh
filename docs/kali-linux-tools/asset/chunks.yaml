    # ProxyStrike


    ProxyStrike 是一个功能性的 Web 应用程序代理。它是一个旨在在浏览应用程序时追踪弱点的设备。开发它的理由是：我们在对高度依赖 Javascript
    的 Web 应用进行渗透测试时发现，针对这些问题，相对较少的 Web 扫描器在这一阶段表现良好，因此我们开发了这一中间件。目前，它已具备可用的 SQL 注入和
    XSS 模块。这两个模块旨在尽可能获取所有弱点，这就是为什么 SQL 注入模块是不可比拟的 DarkRaver "Sqlibf" 的 Python 移植版。交互异常直观，ProxyStrike
    自然地运行在端口 8008 上的中间件中，因此你需要查看理想的网站设置，将程序配置为使用 ProxyStrike，随后 ProxyStrike 将会在基础模式下每一个边界。对于客户端来说，它是一个隐性的中间代理，因为你不会看到应用程序的行为有任何异，但在后台它运行非常活跃。


    更多信息：[`code.google.com/p/proxystrike`](https://code.google.com/p/proxystrike)


