    \ `thc-pptp-bruter`，并确定你正在攻击的用户名和主机。请注意，在与该工具交互后，你将看到有关所关联主机的简要数据，例如，“Hostname\
    \ ˜c2611wooter, Vendor ˜Cisco Systems, Inc., Firmware: 4608。”这对于远程应用层指纹识别非常有用的策略。\n\
    \n更多信息：http://flylib.com/books/en/3.418.1.83/1/\n\n## 用法\n`thc-pptp-animal [options]\
    \ <remote ip>`\n\n## \n- `-v` 详细结果/调试输出\n- `-W` 禁用 Windows 破解 [默认: 启用]\n- `-u\
    \ <user>` 用户 [默认: administrator]\n- `-w <file>` 密码字典记录 [默认: stdin]\n- `-p < >`\
    \ PPTP 端口 [默认: 1723]\n- `-n < >` 相同尝试次数 [默认: 5]\n- `-l < >` 限制每秒密码数 [默认: 100]\n\
    \n## 示例\n`thc-pptp-bruter - u g0tmi1k - n 99 - l 999 10.0.0.3`\n\n# Webscarab\n\
    \n## 描述\nWebScarab 是一个用于检查 HTTP 和 HTTPS 协议应用程序的框架。它用 Java 编写，对于许多阶段非常方便。WebScarab\
    \ 有由各种模块执行的活动模式。在最常用的情况下，WebScarab 作为阻塞中间件工作，允许管理员在请求发送到服务器之前检查并修改程序发出的请求，并在程序接收服务器响应之前审计并更改这些响应。WebScarab\
    \ 可以同时捕获 HTTP 和 HTTPS 通信。管理员还可以审计通过 WebScarab 的会话（请求和响应）。\n\n更多信息：https://www.owasp.org/index.php/WebScarab_Getting_Started\n\
