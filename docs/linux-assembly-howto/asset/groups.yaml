    份的文档不透明副本，你必须在每份不透明副本中包含一份机器可读的透明副本，或者在每个不透明副本中说明一个包含文档透明副本的公共可访问网络位置，该副本不包含添加材料，且公众可以使用标准网络协议免费下载。如果你使用后一种方案，则在你开始批量分发不透明副本时，必须采取合理谨慎的步骤，以确保该透明副本在你最后一次向公众分发（直接或通过你的代理或零售商）不透明副本后至少一年内在该位置保持可访问。


