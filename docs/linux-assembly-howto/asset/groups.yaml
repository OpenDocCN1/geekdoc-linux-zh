    # ## Chapter 2. Do you need assembly?


    Well, I wouldn''t want to interfere with what you''re doing, but here is some
    advice from the hard-earned experience.


    # ### 2.1. Pros and Cons


    # #### 2.1.1. The advantages of Assembly


    Assembly can express very low-level things:


    +   * you can access machine-dependent registers and I/O

    * you can control the code behavior in critical sections that might otherwise
    inline deadlock between multiple software or hardware devices

    * you can break the conventions of your usual compiler, which might allow some
    optimizations (like temporarily breaking rules about memory allocation, threading,
    calling conventions, etc)

    * you can build interfaces between code fragments using incompatible conventions
    (e.g. produced by different compilers, or separated by a low-level interface)

    * you can get access to unusual programming of your processor (e.g. 16 bit mode
    to interface startup, firmware, or legacy code on Intel PCs)

    * you can produce reasonably fast code for tight loops to cope with a bad non-optimizing
    compiler (but then, there are few optimizing compilers available!)

    * you can produce optimized code perfectly tuned for your particular hardware
    setup, though not to someone else''s

    * you can write some code for your new language''s optimizing compiler (that is
    something what very few will ever do, and even if they not)

    * i.e. you are in complete control of your code


    # ### 2.1.2. The disadvantages of Assembly


    Assembly is a very low-level language (the lowest above hard-coding the binary
    instruction patterns). This means


    +   * it is long and tedious to write initially

    * it is quite bug-prone

    * your bugs can be very difficult to chase

    * your code is difficult to maintain

    * the result is non-portable to other architectures: existing or upcoming

    * your code will be optimized only for a certain implementation of the same architecture:
    for instance, Intel-compatible platforms each CPU design and its variations (relative
    latency), output-throughput, and capacity, of processing units, caches, RAM, bus,
    disks, presence of FPU, MMX, 3DOWN, SIMD extensions, each potentially different
    optimization techniques. CPU designs include: Intel 386, 486, Pentium, PPro, PIII,
    PIV, Pentium V; Cyrix 5x86, x862, M2; AMD K5, K6 (K2–III), K7 (Athlon, Duron).
    New designs keep popping up, so don''t expect this list or code to be up-to-date.

    * you spend more time on a few details and can''t focus on small and large algorithmic
    design, that are very known to bring the largest part of the speed up (e.g. you
    might spend time writing fast list/array manipulation primitives in assembly;
    only a hash table would have sped up your program'
