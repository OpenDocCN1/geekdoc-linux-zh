  - '[PAGE 13]


    # Linux Assembly HOWTO


    comes together with GAS the GNU bitutils archive. It works as a filter, like CPP
    and M4. It has no idea onndetails, but it comes with its own textinfo documentation,
    which you would like to browse (info gasp), print,

    grok. GAS as GASP looks like a regular macro–assembler to me.


    # 3.3. NASM


    The Netwide Assembler project provides cool i386 assembler, written in C, that
    should be modular enough toeventually support all known syntaxes and object formats.


    # 3.3.1. Where to find NASM


    http://nasm.sourceforge.net, http://www.cryogen.com/nasm/


    Binary release for your usual metal mirror in devel/lang/asm/ directory. Should
    also be available as

    .rpm or .deb in your RedHat/Debian distributions'' contrib.


    # 3.3.2. What it does


    The syntax is Intel-style. Comprehensive macroprocessing support is integrated.


    Supported object formats are bin, aout, coff, elf, as86, obj (DOS), win32 (their

    format).


    NASM can be used as a backend for the free BCC compiler (support files included).


    Unless you’re using 16-bit (which is out of scope of these 32–bit HOWTO), you
    should

    definitely use NASM instead of AS86 or MASM, because it runs on all platforms.


    +   NASM comes with a disassembler, NDISASM.


    Its hand-written parser makes it much faster than GAS, though of course, it doesn’t
    support three bazillion

    different architectures. If you like Intel–style syntax, as opposed to GAS syntax,
    then it should be the

    assembler of choice..


    Note: there are few programs where you may help to convert code between AT&T and
    Intel

    assembler syntax, some of which are capable of performing conversion in both directions.


    # 3.4. AS86


    AS86 is a 8086 assembler, both 16–bit and 32–bit, with integrated macro support.
    It has mostly

    Intel–syntax, though it differs slightly for addressing modes.


    # 3.4.1. Where to get AS86


    Current version is 0.16, and can be found at http://www.cix.co.uk/~mayday/, in
    bin86 package with linker

    (ld86), or as separate archive.'
  - '[PAGE 14]


    A completely outdated version 0.4 of AS86 is distributed by HJLu to compile the
    Linux kernel versions prior to 2.4, in a package named bin86, available in any
    GCC repository. But I advise not to use it for anything else besides compiling.
    This version supports only a hacked object file format, which is not supported
    by the GNU binutils or anything, and it has a few bugs in 32-bit mode, so you
    really better keep it for compiling Linux.


    # 3.4.2. Where to find docs


    See the man page and as.doc from the source package. When in doubt, the sources
    themselves are often a good docs: they aren''t well commented, the programming
    style is straightforward. You might try to see how as86 is used in ELKS, LILO,
    or Tunes 0.0.0.25...


    # 3.4.3. Using AS86 with BCC


    Here''s the GNU Makefile for using BCC to transform .s asm into both a.out .o
    object and .l listing:


    ```

    ```

    .o: %.s

    bcc -3 -G -C -A -A1 -AS* -o $* $<$

    ```

    ```


    Remove the %.1, -A1, and -AS*, if you don''t want any listing. If you want something
    else than a.out, you can examine BCC out the other supported formats, and/or use
    the objcopy utility from the GNU binutils package.


    # 3.5. Other Assemblers


    There are other assemblers with various interesting and outstanding features which
    may be of your interest as well.


    > They can be in various stages of development, and can be non-classic/high-level/whatever
    else.


    # 3.5.1. YASM


    YASM is a complete rewrite of the NASM assembler under the GNU GPL (some portions
    are the "new" BSD License). It is designed from the ground up to allow for multiple
    syntaxes to be supported (eg. NASM, TASM, GAS, etc.) in addition to multiple output
    object formats. Another primary module of the overall design is an optimizer module.


    It looks promising; it is under heavy development, and you may want to take part.
    See http://www.tortall.net/projects/yasm/


    # 3.5.2. FASM


    FASM (flat assembler) is a fast, efficient 80x86 assembler that runs in ''flat
    real mode''. Unlike many other 80x86 assemblers, FASM only requires the source
    code to include the information it really needs. It is in itself and very small
    and fast. It runs on DOS/Windows/Linux and can produce flat binary, DOS EXE, Win32
    PE and COFF output. See http://fasm.sourceforge.net.


    Chapter 3. Assemblers'
- md: "\n## 3.5.3. OSIMPA (SHASM)\n\nosimba is an assembler for Intel 8038 processors\
    \ and subsequent, written entirely in the GNU Bash command interpreter shell.\
    \ The predecessor of osimba was shasm. osimba is much cleaned up, can create useful\
    \ Linux ELFs, has various HLL-like extensions and programmer convenience commands.\n\
    \nIt is (course) slower than other assemblers. It has its own syntax (and uses\
    \ its names for x86 opcodes) Fair good documentation is included. Check it out:\
    \ ftp:/linux01_gwd/pub/clLeNUX/interim/. Probably you'll not use it on regular\
    \ basis, but at least it serves as an interest that you arouse.\n\n## 3.5.4. TDASM\n\
    \nThe Table Driven Assembler (TDASM) is a free portable assembler for any kind\
    \ of assembly language. It should be possible to use it as a compiler to any target\
    \ microprocessor using a table that defines the compilation process.\n\nIt is\
    \ available from http://www.penguin.cz/~-niki/tdasm/\n\n## 3.5.5. HLA\n\nHLA is\
    \ a High Level Assembly language. It uses a high level language like similar to\
    \ Pascal, C/C++, and other HLLs) for variable declarations, procedure declarations,\
    \ and procedure calls. It uses a modified assembly language for the standard machine\
    \ instructions. It also provides several level language style controls (if, while,\
    \ repeat...until, etc.) that help you write more readable code.\n\nHLA is free\
    \ and with source, Linux and Win32 versions available. On Win32 you need MASM\
    \ and a 32–bit version of MS-link on Linux you need GAS, because HLA produces\
    \ assembled assembler code and uses that for assembling and linking.\n\n## 3.5.6.\
    \ TALC\n\nTALC is not free ASM/Win32 based compiler (however it supports ELF output,\
    \ does it?)\n\nTAL stands for Typed assembly Language. It extends traditional\
    \ untyped assembly languages with typing annotations, memory primitives, and a\
    \ set of typing rules, to guarantee the memory safety, control flow, and type\
    \ of TAL programs. Moreover, the constructs are expressive enough to encode most\
    \ source executing programming features including records and structures, higher–order\
    \ and polymorphic functions, exceptions, abstract data types, subtype, and modules.\
    \ Just as importantly, TAL is flexible enough to admit many low–level compiler\
    \ optimizations. Consequently, TAL is an ideal platform for type-directed compilers\
    \ that want to produce verifiably safe code for use in mobile code applications\
    \ or extensible operating system kernels.\n\n## 3.5.7. Free Pascal\n\nFree Pascal\
    \ has an internal 32–bit assembler (based on NASM tables) and a switchable output\
    \ that allows:\n\n- ELF and conf when crosscompiled.o output\n- NASM\n- MASM\n\
    - TASM\n- AS (aout.coff, elf32)\n\nLinux Assembly HOWTO\n\nThe MASM and TASM output\
    \ are not as debugged the other two, but can be handy sometimes.\n\nThe assembler's\
    \ look and feel are based on Turbo Pascal's internal BASM, and the IDE supports\
    \ highlighting, and FPC can fully integrate with gcc (on C level, not C++).\n\n\
    Using a dummy RTL, one can generate pure assembler programs.\n\n## 3.5.8. Win32forth\n\
    \nWin32For is a free 32-bit ANS system that successfully runs under Win32s, Win95,\
    \ Win/NT. It includes a free 32-bit assembler (either prefix or postfix syntax)\
    \ integrated into the reflective FORTH language. Macro processing is done with\
    \ the full power of the reflective FORTH; however, the only supported input and\
    \ output contexts are Win32For itself (no dumping of .obj file, but could add\
    \ that feature of course), Find it at http://ftp.forth.org/pub/Forth/Compilers/native/windows/Win32For/.\n\
    \n## 3.5.9. Terse\n\nTerse is a programming tool that provides THE most compact\
    \ assembler for the x86 family! However, it is entirely proprietary software.\
    \ It is said that there was a project for a free clone somewhere, that was abandoned\
    \ after worthless pretenses that the syntax would be owned by the original author.\
    \ Thus, if you're looking for a nifty programming project to restart hacking,\
    \ I invite you to develop a tersese-frontend to NASM, if you like that syntax.\n\
    \nAn interesting historic remark, on the moderator wrote:\n\n> \"There's no reason\
    \ that assemblers have to have awful syntax. About 30 years ago I met Niklaus\
    \ Wirth's PL360, which was basically a S360 assembler with Algol syntax and a\
    \ little syntactic sugar while loops ran into the obvious branches. It was really\
    \ an assembler, e.g., you had to write out expressions with explicit assignments\
    \ of values to registers, but it was nice. Wirth used it to write Algol, a small\
    \ fast subset, which was predecessor to Pascal. As is often the case, Algol was\
    \ a significant improvement over many of its successors.\" - John\n\n## 3.5.10.\
    \ Non-free and/or 32-bit x86 assemblers\n\nYou might find more about them, together\
    \ with the basics of x86 assembly, in the Linux Assembly FAQ. Note that DOS-based\
    \ assemblers should include as well as other emulators, that if you already own\
    \ one, you can still use it in a real OS, together with your tools, perhaps using\
    \ GNU objcopy (part of binutils) as a conversion filter.\n\nChapter 3. Assemblers\n\
    \n 4. Metaprogramming\n\n### 4.1. External filters\n\nWhatever is from your assembler,\
    \ or whatever language you use (even C!), if the language is not expressive enough,\
    \ you can have files passed through an external filter with Makefile like that:\n\
    \n```\n.%s:\n    other_dependencies\n    $(FILTER) $(FILTER_OPTIONS) < $@\n```\n\
    \n### 4.1.1. CPP\n\nCPP is truly too expressive, but it's enough for easy things,\
    \ it's standard, and called transparently by GCC. However, considering how mediocre\
    \ it is, stay away from it by chance you can make it without C.\n\n### 4.1.2.\
    \ M4\n\nM4 gives you the full power of metaprogramming, with a Turing equivalent\
    \ language, recursion, regular expressions. You can do it with everything CPP\
    \ cannot. The right version of M4 is GNU m4 1.4 (or later exists), which has the\
    \ most features and the least bugs or limitations of all. m4 is designed to be\
    \ slow for the simplest uses, which might still be ok for most assembly programming\
    \ (you are not writing million–assembly programs, are you?). declare objects so\
    \ that destructors are automatically called at the end of the block; you don't\
    \ have diversions or scoping.\n\n### 4.1.3. Macroprocessing with your own filter\n\
    \nYou can write your own simple macro–expansion filter with the usual tools: perl,\
    \ awk, sed, etc. It can be made rather quickly, and you control everything. But,\
    \ of course, power in macroprocessing implies the \"hard way\".\n\n## 4.2. Metaprogramming\n\
    \nInstead of using an external filter that expands macros, one way to do things\
    \ is to write programs that part or all of other programs.\n\nFor instance, you\
    \ could use a program outputting source code\n\n- to generate sine/cosine/whatever\
    \ lookup tables,\n- to extract a source–form representation of a binary file,\n\
    - to compile your bitmaps into fast display routines,\n- to extract documentation,\
    \ initialization/finalization code, description tables, as well as normal code\
    \ from the same source files,\n- to have customized assembly code, generated from\
    \ a perl/shell/scheme script that does arbitrary processing,\n- to propagate data\
    \ defined at one point only into several cross-referencing tables and chunks.\n\
    - etc.\n\nThink about it\n\n### 4.2.1. Backends from compilers\n\nCompilers like\
    \ GCC, SMI/NJ, Objective CAML, MIT–Scheme, CMUCL, etc., do have their own generic\
    \ assembler back, which you might choose to use, if you intend to generate code\
    \ semi-automatically from the according languages, or from a language you have:\
    \ rather than write great assembly code, you may instead modify a compiler so\
    \ that it dumps great assembly code!\n\n### 4.2.2. The New–Jersey Machine–Code\
    \ Toolkit\n\nThere is a project, using the programming language Icon (with an\
    \ experimental ML version), to build a basis for producing assembly–manipulating\
    \ code. See around http://www.eecs.harvard.edu/~nr/toolkit/\n\n### 4.2.3. TUNES\n\
    \nThe TUNES Project for a Free Reflective Computing System is its own extension\
    \ as an to the Scheme language, as part of its development process. It doesn’t\
    \ run at yet, though help is welcome.\n\nThe assembler translates abstract syntax\
    \ trees, so it could easily serve the basis for a syntax translator, a disassembler,\
    \ a common assembler/compiler back–end, etc. Also, the full power of a real language,\
    \ Scheme, make it unchallenged as for macroprocessing/metaprogramming.\n"
  mdcn: "\n\n## 3.5.3. OSIMPA (SHASM)\n\nosimba 是一个针对 Intel 8038 及其后续处理器的汇编器，完全用 GNU\
    \ Bash 解释器 shell 编写。osimba 的前身是 shasm。osimba 经过了大量的清理，可以创建实用的 Linux ELF 文件，具有各种类高级语言的扩展和程序员便利命令。\n\
    \n它的运行速度（课程）比其他汇编器慢。它有自己的语法（并使用自己的名称作为 x86 机器码），并包含了相当不错的文档。你可以查看一下：ftp:/linux01_gwd/pub/clLeNUX/interim/。你可能不会经常使用它，但至少它可以作为一个你兴趣的来源。\n\
    \n## 3.5.4. TDASM\n\n表驱动汇编器 (TDASM) 是一个适用于任何汇编语言的免费可移植汇编器。通过一个定义编译过程的表，应该可以将其作为编译器到任何目标微处理器上。\n\
    \n你可以在 http://www.penguin.cz/~-niki/tdasm/ 获取。\n\n## 3.5.5. HLA\n\nHLA 是一种高级汇编语言。它使用类似于\
    \ Pascal、C/C++ 以及其他高级语言的高级语言进行变量声明、过程声明和过程调用。它使用修改过的汇编语言来处理标准的机器指令。它还提供了几种层级语言风格的控制（if,\
    \ while, repeat...until 等），帮助你编写更具可读性的代码。\n\nHLA 是免费的并提供源码，有 Linux 和 Win32 版本。在\
    \ Win32 上你需要 MASM 和 32 位的 MS-link；在 Linux 上你需要 GAS，因为 HLA 产生汇编后的汇编代码，并使用它进行汇编和链接。\n\
    \n## 3.5.6. TALC\n\nTALC 不是免费的基于 ASM/Win32 的编译器（然而，它支持 ELF 输出，它不是吗？）。\n\nTAL 代表类型汇编语言\
    \ (Typed assembly Language)。它通过类型注解、内存原语和一组类型规则扩展了传统的无类型汇编语言，以保证 TAL 程序的内存安全、控制流和类型。此外，这些结构足够强大，可以编码大多数源代码执行程序特性，包括记录和结构、高阶和多态函数、异常、抽象数据类型、子类型和模块。同样重要的是，TAL\
    \ 足够灵活，可以接受许多低级编译器优化。因此，TAL 是类型导向编译器的理想平台，旨在产生可验证的安全代码，用于移动代码应用程序或可扩展的操作系统内核。\n\
    \n## 3.5.7. Free Pascal\n\nFree Pascal 拥有一个内部的 32 位汇编器（基于 NASM 表）以及一个可切换的输出，允许：\n\
    \n- 交叉编译时输出 ELF 和 conf .o\n- NASM\n- MASM\n- TASM\n- AS (aout.coff, elf32)\n\n\
    Linux 汇编语言 HOWTO\n\nMASM 和 TASM 的输出没有另外两个那样经过调试，但有时可能很有用。\n\n该汇编器的外观和感觉基于 Turbo\
    \ Pascal 内部的 BASM，且 IDE 支持高亮，FPC 可以与 gcc 完全集成（在 C 级别，而不是 C++ 级别）。\n\n使用一个虚拟的 RTL，人们可以生成纯汇编程序。\n\
    \n## 3.5.8. Win32forth\n\nWin32For 是一个免费的 32 位 ANS 系统，可以在 Win32s、Win95、Win/NT\
    \ 下成功运行。它包含一个集成在反射式 FORTH 语言中的免费 32 位汇编器（前缀或后缀语法）。宏处理通过反射式 FORTH 的全部威力完成；然而，唯一支持的输入输出上下文是\
    \ Win32For 自身（不导出 .obj 文件，但当然可以添加该功能）。可以在 http://ftp.forth.org/pub/Forth/Compilers/native/windows/Win32For/\
    \ 找到。\n\n## 3.5.9. Terse\n\nTerse 是一个编程工具，为 x86 家族提供了最紧凑的汇编器！然而，它是完全专有的软件。据说某处有一个免费克隆项目，但在“语法应归原作者所有”的无理借口后被放弃了。因此，如果你正在寻找一个巧妙的编程项目来重启黑客活动，如果你喜欢那种语法，我邀请你开发一个针对\
    \ NASM 的 tersse前端（tersese-frontend）。\n\n一个有趣的历史备注，版员写道：\n\n> “没有理由汇编器必须有糟糕的语法。大约\
    \ 30 年前，我遇到了 Niklaus Wirth 的 PL360，它基本上是一个带有 Algol 语法和少量语法糖的 S360 汇编器，while 循环运行在显的分分支中。它确实是一个汇编器，例如，你必须通过显式向寄存器赋值值来写出表达式，但它很好。Wirth\
    \ 用它来编写 Algol，一个小型快速的子集，它是 Pascal 的前身。正如通常一样，Algol 相对于它的许多继任者有了重大的改进。” - John\n\
    \n## 3.5.10. 非免费和/或 32 位 x86 汇编器\n\n你可以在 Linux Assembly FAQ 中找到更多关于它们的信息，以及 x86\
    \ 汇编的基础知识。请注意，基于 DOS 的汇编器也应该包含其他模拟器内，如果你已经拥有了一个，你仍然可以在真实的操作系统中使用它，并结合你的工具，可能使用\
    \ GNU objcopy（binutils 的一部分）作为转换过滤器。\n\n第 3 章 汇编器\n\n 4. 元编程\n\n### 4.1. 外部过滤器\n\
    \n无论来自你的什么汇编器，或者无论你使用哪种语言（即使是 C！），如果该语言的表达能力不足，你可以像下面这样通过 Makefile 将文件传递通过外部过滤器：\n\
    \n```\n.%s\n    other_dependencies\n    $(FILTER) $@\n```\n\n### 4.1.1. CPP\n\n\
    CPP 确实非常有表达力，但考虑到它如此平庸，请远离它。\n\n### 4.1.2. M4\n\nM4 为你提供了元编程的全部能力，具有递归、正则表达式等。你可以用它完成一切。M4\
    \ 的正确版本是 1.4（或更高），它功能最多，缺陷最少。\n\n### 4.1.3. 使用自己的过滤器进行宏处理\n\n你可以使用 perl, awk 等常用工具编写自己的简单的过滤器。它可以很快完成，而且你控制一切。但是，当然，宏处理意味着“困难的方法”。\n\
