    ## Chapter 5. Calling conventions


    ## 5.1. Linux


    ### 5.1.1. Linking to GCC


    This is the preferred way if you are developing mixed C–asm project. Check GCC
    docs and examples from Linux kernel .S files that go through gas (not that go
    through as86).


    32-bit arguments are pushed down in reverse syntactic order (hence accessed/popped
    in the right order), above the 32-bit return address. %ebp, %esi, %edi, %ebx are
    callee-saved, other registers are caller-saved; %eax is to hold the result, and
    %edx:eax for 64–bit results.


    FP stack: I am sure, but the result is in st (0), however stack callee-saved.
    The SVR4 i386 ABI specs at http://www.caldera.com/developer/specs is a good reference
    point if you want more details.


    Note that GCC has options to modify the calling conventions by reserving registers,
    having arguments in registers, not assuming the FPU, etc. Check the i386 .info
    pages.


    Beware that you must declare the cdecl and regparam(0) attribute for a function
    that will follow standard GCC calling conventions. See C Extensions::Extended
    As:: section from the GCC pages. Also how Linux defines its asm macro.


    ### 5.1.2. ELF vs a.out problems


    Some compilers prepend an underscore before every symbol, while others do not.


    Particularly, Linux a.out GCC does such preceding, while Linux ELF GCC does not.


    If you need to cope with both behaviors at once, we have existing packages. For
    instance, get an old Linux source tree, the elks, threads, or OCaml...


    You can also override the implicit C->asm renaming by inserting statements like


    ```c

    void foo asm("bar");

    ```


    to be sure that the function foo () will be called bar in assembly.


    Note that the objcopy utility from the binutils package should allow you to transform
    your a.out objects into ELF objects, and perhaps the contrary too, in some cases.
    More generally, it will do lots of file format conversions.


    ### 5.1.3. Direct Linux syscalls


    Often you will be told that C library (libc) is the only way, and direct syscalls
    are called. This is true to some extent. In general, you must know that libc is
    not safe, and in most cases it only does checks, then calls kernel, and sets errno.
    You can do this in your program (if you need to), and your program will be dozens
    times smaller, and this will result in improved performance as well, just because
    you''re not using shared libraries (static binaries are faster). Or not using
    lib in assembly programming is more a question of taste/belief than practical.
    Remember, Linux is aiming to be POSIX compliant, so does lib. This means that
    syntax of any lib "system calls" exactly matches syntax of real kernel system
    calls (and vice versa). Besides, GNU glibc becomes slower and slower from version
    to version, and eats more and more; so, cases of using direct system calls become
    quite usual. But, the main drawback of throwing lib away is that possibly you
    will need to implement several libc functions (that are not just syscall wrappers)
    over your own (printf() and etc.). and you are ready for that, aren''t you?


    Here is summary of direct system calls pros and cons.


    Pros:


    - the smallest possible size; squeezing the last byte out of the system

    - the highest possible size; cycles out of your favorite benchmark

    - full control: you can adapt your program/library to your specific language or
    memory requirements or whatever

    - no pollution by lib craft

    - no pollution by C calling conventions (if you''re developing your own language
    or environment)

    - static binaries make you independent from lib upgrades or crashes, or dangling
    #! path to an interpreter (and are faster)

    - just for the fun out of it (don''t you get a kick out of assembly programming?)


    Cons:


    - If any other program on your computer uses the lib, then duplicating the code
    will actually waste memory, not saves it.

    - Services redundantly implemented in many static binaries are a waste of memory.
    But you can make your lib replacement a shared library.

    - Size is much better saved by having some kind of bytecode, wordcode, or structure
    interpreter than by writing in everything (the interpreter itself could be either
    in C or assembly). The best way to keep libraries small is not to have multiple
    binaries, but instead to have an interpreter process files with # prefix. This
    is how OCaml works when used in code mode (as opposed to native code), and it
    is compatible with using the lib. This is also Christian''s Perl Powers implementation
    of unix utilities. Finally, one last way to keep things small, that doesn''t depend
    on an external file with a hardcoded path, be it library or interpreter, is to
    have only one binary, nicely-named hard or soft links to the same binary will
    provide everything you need in an optimal space, with no redundancy of subroutines
    or unless binaries; it will dispatch its specific behavior according to argv[];
    in case it isn''t called with a recognized name, it must default to a, and possibly
    also usable as an interpreter!

    - You cannot benefit from many functionalities that lib provides there linux syscalls:
    that is functionality described in section 3 of the manual pages, so such as malloc,
    threads, password, high-level network management, etc.

    - Therefore, you might have to implement large parts of lib, from printf() to
    malloc() and getbyname. With the redundant edit it can be quite boring sometimes.
    Some people have already implemented "light" replacements for the lib — check
    them out! (Redhat''s minimal, Rick Hosebley''s libs, Felix von Lenstra''s, Christian
    Fowelin''s libASM, asmutil is working on purely assembly)

    - Static libraries prevent you to benefit from lib upgrades as from lib add-ons
    such as the zip package, that does on–the–fly decompression of gzip-compressed
    files.

    - The few instructions added by the lic can be a ridiculously small speed overhead
    compared to the cost of a system call. If speed is a concern, your main problem
    is in your usage of system calls, not in their wrapper implementation.

    - Using the standard assembly API for system calls is much slower than the lic
    API when running in micro-kernel versions of Linux as L4Linux, that have their
    faster calling convention, pay high context-translation overhead when using the
    standard one (L4Linux comes with lic recompiled with their system API; of course,
    you could recompile your code with their API, too).

    - See previous discussion for general speed optimization issue.

    - If syscalls are too slow for you, you might want to hack the kernel cores (in
    C) instead of staying in usersland.


    If you''ve probed the pros and cons, and want to use direct syscalls, here is
    one example:


    - You can easily define your system functions in a portable way in C (as opposed
    to portable assembly), by including asm/unistd.h, and using provided macros.


    - Since you''re trying to replace it, get the source for the lib, and got. (And
    if you think you can do better, send feedback to the authors!)


    - As an example of pure assembly code that does you want, examine Linux assembly
    resources.


    Basically, you issue an int 0x80, with the _NR_syscallname (from/unistd.h) in
    eax, and parameters (up to six) in ebx, ecx, esi, edi, edx, ebp respectively.


    Result returned in eax, with a negative result being an error, whose opposite
    is what libc would put into errno. The user-stack is not touched, so you don''t
    need a value when doing a syscall.


    > Passing sixth parameter in ebp allowed Linux 2.4, previous Linux versions understand
    only 5 parameters in registers.


    Kernel Internals, and especially How System Calls Are Implemented on i386 chapter
    will give you more robust overview.


    As for the invocation arguments passed to a process setup, the general principle
    is that the stack originally contains the number of arguments argc, then the list
    of pointers that constitute *argv, then null-terminated variable=value strings
    for the environment. For details examine assembly resources, read the sources
    of C startup code from your lic (crt0.S or crtl1.S), or those from the Linux kernel
    (exec.c and binfmt-*.fs).


    ### 5.1.4. Hardware I/O under Linux


    If you want to perform direct I/O under Linux, either it''s something simple that
    does not need OS arbitration, or you should see the IO-Port-Programming mini-HOWTO;
    or it needs a device driver, and you for which there are other excellent HOWTOs
    and documents from the LDP.


    Particularly, if you want is Graphics, then do one of the GGI or XFree86 projects.


    Some people have done better, writing small and robust Free86 drivers in an interpreted
    domain—specific language, GAL, and achieving the efficiency of hand-written drivers
    through partial

