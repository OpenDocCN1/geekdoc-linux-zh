    # Linux Assembly HOWTO


    evaluation (drivers not only in asm, but not even in C!). The problem is that
    the partial evaluator used to achieve efficiency is not free software. Any taker
    for the replacement?


    Anyway, in all these cases, you''ll be better using GCC inline assembly with the
    macros linux/asm/*..h than writing assembly source files.


    # 5.1.5. Accessing 16-bit drivers from Linux/i386


    Such thing is theoretically possible (see how DOSEMU selectively grant hardware
    port access to programs), and I''ve heard rumors that somewhere did do it (in
    the PCI driver)? Some VESA access stuff? ISA PnP dunno). If you have some more
    precise information on that, you''ll be most welcome. Anyway, good places to look
    for more information are the Linux kernel sources, DOSEM sources (and other programs
    in the DOSUM repository), and sources for various low-level programs under Linux...
    (perhaps GIF if it supports VESA).


    Basically, you must use 16-bit protected mode or vm86 mode.


    The first is simpler to setup, but only with well-behaved code that won''t do
    any kind of segment arithmetics or absolute segment addressing (particularly segment
    0), unless it happens that all segments can be used in the LDT.


    The latter allows for "compatibility" with vanilla 16-bit environments, but requires
    more complicated handling.


    In both cases, you can jump to 16-bit code, you


    +   * map any absolute address used in the 16-bit code (such as ROM, video buffers,
    DMA targets, and memory-mapped I/O) from /dev/mem to your process'' address space

    * setup the LDT/or vm86 monitor.

    * grab proper I/O permissions from the kernel (the above section)


    Again, consider the source for the stub contributed to the DOSEMU project, particularly
    mini-emulators for running ELKS or simple .COM programs under Linux/i386.


    # 5.2. DOS and Windows


    Most DOS extends use some interface to DOS services. Read their docs about that,
    but often, they use simulate int 0x21, and so do "if" you are in real mode (I
    doubt whether they have more than stubs and extend to work with 32-bit operands;
    they most likely will just interrupt the real-mode or vm86 handler).


    Docs about DPIM (and much more) can be found on: x2ftp.oulu.in/pub/msdos/programming/
    (again, the original x2ftp site is closing (no?), so use a mirror site).


    DJGPP comes with its own (limited) glad derivative/replacement, too.


    It is possible to cross-compile from Linux to DOS, see the devel/msdos directory
    of your local FTP mirror for metalab.unc.edu; Also see the DOS-extender from the
    Flux project from the university of Utah.


    Chapter 5. Calling conventions'
