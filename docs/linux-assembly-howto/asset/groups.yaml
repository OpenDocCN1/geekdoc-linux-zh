    \ in assembly?\n- 8.6. How do I allocate memory dynamically?\n- 8.7. I can't understand\
    \ how to use system call!\n\n### 8.1. How do I graphics programming in Linux\n\
    \nAn answer from Paul Further:\n\n> You have a number of options to graphics in\
    \ Linux. Which one you use depends on what you want to do. There isn't one Web\
    \ site with all the information but here are some tips:\n> GALib: This is a C\
    \ library for console SVGA.\n> Pros: very easy to learn, good coding examples,\
    \ not all that different from equivalent gfxx libraries for DOS, all the effects\
    \ you know from DOS can be converted with little difficulty.\n> Cons: need special\
    \ rights to run since they write directly to the hardware, doesn't work with chipsets,\
    \ can run under X-Windows.\n> Search for svgalib-1.4x on http://ftp.isco.za\n\
    > Framebuffer: Do it yourself graphics at SVGA res\n> Pros: fast, linear mapped\
    \ video access, ASM can be used if you want :\n> Cons: has to be compiled into\
    \ the kernel, chipset-specific issues, must switch out of X to run, relies on\
    \ good knowledge of linux system calls and kernel, tough to debug\n> Example:\
    \ (http://www.linuxassembly.org/) and the leaves example and my own site for framebuffer\
    \ code and tips in asm (http://ma.verick.co/linuxx/)\n> Xlib: The access control\
    \ and development libraries for XFree86.\n> Pros: Complete control over your X\
    \ application\n> Cons: Difficult to learn, horrible to work with and requires\
    \ a bit of knowledge to how X works at the low level.\n> Not recommended if you're\
    \ really masochistic for it. All the include and file libs are probably installed\
    \ already so you have what you need.\n> Low-level APIs: include PTC, SGI, and\
    \ Clanlib\n> Pros: very flexible, run under X or the console, generally abstract\
    \ away video hardware a little so you can draw a linear surface, lots of good\
