    # 3.1.2. Where to find docs for GCC Inline ASM


    The documentation of GCC includes documentation files in TexInfo format. You can
    compile them with TeX and print result, or convert them to .info, and browse them
    with emacs, or convert them to .html, or whatever you like; (with the right tools)
    to whatever you like, or just read as is. The .info files are generally found
    on any installation of GCC.


    The right section to look for is C Extensions::Extended ASM:


    Invoking DJGPP::Submodel Options::i86 Options::might help too. Particularly


    The DJGPP Games resource (not only for game hackers) had page specifically about
    assembly, but it''s down. Its data has nonetheless been recovered on the DJGPP
    site, that contains a mine of other useful information: http://www.delorie.com/djgpp/doc/breman/,
    and in the DJGPP Quick ASM Programming Guide.


    GCC depends on GAS for assembling and its syntax (see below); do mind that inline
    asm needs characters to be quoted, they will be passed to GAS. See the section
