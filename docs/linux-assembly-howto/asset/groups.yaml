- md: '

    # Linux Assembly HOWTO


    /usr/lib/gcc-lib/i486-linux/2.7.2.3/specs or wherever that is on your system (better
    not add -Wall all, though). The exact location of the GCC specs files on system
    can be found by gcc -v.


    ## 3.1.4. Macro support


    GCC allows (and requires) you to register constraints in your inline assembly
    code, so the optimizer always knows about it; inline assembly is really made of
    patterns, not forcibly exact code.


    Thus, you can put your assembly into CPP macros, and inline C functions, so anyone
    can use it in any C/function macro. Inline functions resolve macros much very,
    but are cleaner to use. Beware that in all cases, code will be duplicated, so
    only local labels ( : style) should be defined in that as code. However, a macro
    would allow the name for a non-local label to be passed as a parameter (or else,
    you should use additional meta-programming methods). Also, note that propagating
    inline assembly code will prevent potential bugs in them; watch out for register
    constraints in inline asm code.


    Lastly, the C language itself may be considered as a good abstraction to assembly
    programming, which relieves you most of the trouble of assembling.


    ## 3.2. GAS


    GAS is the GNU Assembler, that GCC relies upon.


    ### 3.2.1. Where to find it


    Find at the same place where you''ve found GCC, in the binutils package. The latest
    version of binutils is available from http://sources.redhat.com/binutils/


    ### 3.2.2. What is this AT&T syntax


    Because GAS was invented to support a 32-bit compiler, it uses standard AT&T syntax,
    which resembles a syntax for standard m86 assemblers, and is standard in the UNIX
    world. This syntax is neither worse, nor better than the Intel syntax. It''s just
    different. When you get to use it, you find it more regular than the Intel syntax,
    a bit boring.


    Here are the few caveats about GAS:


    - Register names are prefixed with %, so that registers are %ax, %edx and dl,
    instead of just dl. This makes it possible to include external C symbols directly
    in assembly source, without any risk of confusion, or any need for underscores
    prefixes.

    - The order of operands is (source) first, and destination, as opposed to the
    Intel convention of destination first and last. Hence, what in Intel syntax is
    mov eax, %edx (move contents of register ed into eax) will be in GAS mov %edx,
    %ax.

    - The operand size is specified as a suffix to the instruction name. The suffix
    is b for (8-bit) byte, w for (16-bit) word, and l for (32-bit) word. However,
    the correct syntax for the above instruction would have been movl %edx, eax. Gas
    does not require strict AT&T syntax, so the suffix is optional when size can be
    guessed from register operands, and defaults to 32–bit (with a warning).

    - Immediate operands are marked with a $ prefix, as in add $5, %ax (add immediate
    value 5 to register %ax).

    - Missing operand prefix indicates that it is memory-contents; mov $foo, %eax
    puts the address of variable foo in register %eax, mov foo, %eax puts the contents
    of variable foo into %eax.

    - Indexing or indirection is by enclosing the index register or memory cell address
    in parentheses, testb $0x80,17 (%ebp) (the high bit of the byte value at offset
    17 from the cell pointed to %ebp).


    Note: There are few programs which may help you convert source code between AT&T
    and Intel assembler syntaxes; some of the are capable of performing conversion
    in both directions.


    GAS has comprehensive documentation in TeXinfo format, which comes at least with
    the source distribution. Browsed extracted .info pages were always. Used to be
    a file named gas.doc or as.doc around the GAS source package, but it was merged
    into the TeXinfo docs. Of course, in case of doubt, the ultimate documentation
    is the sources themselves! A section that will particularly interest you is Machine
    Dependencies: i386-Dependent:


    Again, the sources for Linux (the OS) come in as excellent examples; see under
    linux/arch/i386/ the following files: kernel/*.S, boot/compressed/*.S, math/*.S.


    If you are writing a kind of assembly, a package, you may see as well as other
    languages (OCaml, Gforth, etc.), or thread packages (QuickThreads, LinuxThreads,
    etc.), or whatever else.


    Finally, compiling a C program might show you the syntax for the kind you want.
    See you need assistance?


    ## 3.2.3. Intel syntax


    Good news are since binutils 2.10, GAS supports Intel syntax. It can be triggered
    with .intel_syntax. Unfortunately this mode is not documented (yet?) in the official
    binutils manual, so if you want to use it, try http://home.snafu.de/php/85.gz,
    which is extract from AMD 64-bit port of binutils 2.11.


    ## 3.2.4. 16-bit mode


    Binutils (2.9+) now supports 16-bit mode (registers and addressing) on i386 PCs.
    Use .code16 and .code32 to switch between modes. Also, a neat trick used by several
    people (the authors) is to force GCC to produce code for 16-bit, using 32-bit
    prefixes. Moreover, while GCC recognizes .s files as raw assembly to send to GAS,
    it also recognizes .s files to pipe through CPP before feeding to GAS. Again and
    again, see Linux sources for examples.


    ## 3.2.5. Macro support


    GAS has some capability included, as detailed in TeXinfo docs. GAS also has GASP
    (GAS Preprocessor), which adds all the universal macro tricks to GAS together.
    It works as a filter, like CPP and M4. It has no idea on details, but it comes
    with its own documentation which you would like to browse. GASP looks like a regular
    macro–assembler to me.


    ## 3.3. NASM


    The Netwide Assembler project provides cool i386 assembler, written in C, that
    should be modular enough to support all known syntaxes and object formats.


    ### 3.3.1. Where to find NASM


    http://nasm.sourceforge.net, http://www.cryogen.com/nasm/ Binary release for your
    usual metal in devel/lang/asm/ directory. Should also be available as .rpm or
    .deb in your Red/Debian distributions'' contrib.


    ### 3.3.2. What it does


    The syntax is Intel-style. Comprehensive macro support is integrated. Supported
    object formats are bin, aout, coff, elf, as86, obj (DOS), win32 (format).


    NASM can be used as a backend for the free BCC compiler (support files included).
    Unless’re using 16-bit (which is out of scope of these 32–bit HOWTO), you should
    definitely use NASM instead of AS86 or MASM, because it runs on all platforms.


    - NASM comes with a disassembler, NDISASM. Its hand-written parser makes it much
    faster than GAS, though of course it doesn’t support bazillion different architectures.
    If you like Intel–style syntax, as opposed to GAS syntax, then it should be the
    assembler of choice.


    Note: there are few programs where you may help to convert code between AT&T and
    Intel assembler syntax, some of which are capable of performing conversion in
    both directions.


    ## 3.4. AS86


    AS86 is a 8086 assembler, both 16–bit and 32–bit, with integrated macro support.
    It has mostly Intel–syntax, though it differs slightly for addressing modes.


    ### 3.4.1. Where to get AS86


    Current version is 0.16, and can be found at http://www.cix.co.uk/~mayday/, in
    bin86 package with linker (ld86), or as separate archive.


    A completely outdated version 0.4 of AS86 is distributed by HJLu to compile the
    Linux kernel versions prior to 2.4, in a package named bin86, available in any
    GCC repository. But I advise not to use it for anything else besides compiling.
    This version supports only a hacked object file format, which is not supported
    by the GNU binutils or anything, and it has a few bugs in 32-bit mode, so you
    really better keep it for compiling Linux.


    ### 3.4.2. Where to find docs


    See the man page and as.doc from the source package. When in doubt, the sources
    themselves are often a good docs: they aren''t well commented, the programming
    style is straightforward. You might try to see how as86 is used in ELKS, LILO,
    or Tunes 0.0.0.25...


    ### 3.4.3. Using AS86 with BCC


    Here''s the GNU Makefile for using BCC to transform .s asm into both a.out .o
    object and .l listing:


    ```

    .o: %.s

    bcc -3 -G -C -A -A1 -AS* -o $* $<$

    ```


    Remove the %.1, -A1, and -AS*, if you don''t want any listing. If you want something
    else than a.out, you can examine BCC out the other supported formats, and/or use
    objcopy utility from the binutils package.


    ## 3.5. Other Assemblers


    There are other assemblers with various interesting and outstanding features which
    may be of your interest as well.


    They can be in various stages of development, and can be non-classic/high-level/whatever
    else.


    ### 3.5.1. YASM


    YASM is a complete rewrite of the NASM assembler under the GNU GPL (some portions
    are the "new" BSD License). It is designed from the ground up to allow for multiple
    syntaxes to be supported (eg. NASM, TASM, GAS, etc.) in addition to multiple output
    object formats. Another primary module of the overall design is an optimizer module.


    It looks promising; it is under heavy development, and you may want to take part.
    See http://www.tortall.net/projects/yasm/


    ### 3.5.2. FASM


    FASM (flat assembler) is a fast, efficient 80x86 assembler that runs in ''flat
    real mode''. Unlike many other 80x86 assemblers, FASM only requires the source
    code to include the information it really needs. It is in itself and very small
    and fast. It runs on DOS/Windows/Linux and can produce flat binary, DOS EXE, Win32
    PE and COFF output. See http://fasm.sourceforge.net.

    '
