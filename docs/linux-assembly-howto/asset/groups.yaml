    ## 8.7. 我不理解如何使用系统调用！


    来自 Patrick Model 的回答：


    当你调用 `sys_open` 时，你会得到一个文件描述符，它实际上是你的进程所拥的所有打开的文件描述符表中的索引。`stdin`、`stdout` 和 `stderr`
    分别是 0、1和2，因为从那里开始它们按此顺序为你的进程打开。此外，请注意，你打开的第一个文件描述符（在没有关闭任何这些描述符之前）总是3，并从那里开始递增。


    理解了索引方案就能解释 `select` 是什么了。当你调用 `select` 时，你是在表示你在等待某些文件描述符可读、某些可写，并监控某些除了这些以外的。你的进程最多可以打开
    1024 个文件描述符，因此 `fd_set` 只是一个位掩码，用于描述哪些文件描述符对于每个操作是有效的。明白的吗？


    由于你打开的每个 fd 都是索引，且在每个 `fd_set` 中它只需要开启或关闭，因此 `fd_set` 结构只需要 1024 位。1024 / 32 =
    32 个 long 就足够表示该结构。


    现在，来看一个松散的例子。

    假设你想从一个文件描述符读取（不带超时）。


    - 分配与 `fd_set` 等效的内存。


    ```assembly

    .data

    my_fds times:32 dd 0

    ```


    - 打开你想读取的文件描述符。


    - 设置 `fd_set` 结构中的位。


    首先，你需要确定 32 位双字 dword 中的哪一位。在设置位时，`bts` 会对 32 取模。这就是为什么你首先需要确定要从哪个 dword 开始。


    ```assembly

    mov edx,0

    mov ebx,32

    div ebx


    lea eax,my_fds

    bts ebx[eax*4],ed

    ```


    - 对任何你想读取的文件描述符重复最后一步。


    - 如果你想从这两个 `fd_set` 执行操作，则对整个练习重复一遍。


    这就留下了公式中的另外两个部分——`n` 参数和超时


    ## 第 8 章 常见问题


    参数。我把超时（timeout）参数留给读者作为练习题（是的，我很懒），我将简要介绍一下 `n` 参数。


    它是你所选择的最大文件描述符的值（来自任何 `fd_set`）加一。为什么要加1 呢？因为从该值很容易确定掩码。假设 `x` 个文件描述符上有可用数据，但你关心的最高值是
    (n-1)。由于 `fd_set` 只是一个位掩码，内核需要某种高效的方法来确定你关心的位是否有可用数据。

    嗯，这并没有我想象中那么简单。要看内核如何确定该掩码，请查看内核源码树中的 `fs/select.c`。


    总之，你需要知道那个数字，最的方法是将最后一个打开的文件描述符的值保存在某处，以免丢失。


    好了，这就是我知道的。对上述代码的警告（如往常）是它没有经过测试。我认为它应该可以工作，但如果不起用请告诉我。

