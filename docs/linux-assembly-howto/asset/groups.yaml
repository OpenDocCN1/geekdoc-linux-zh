    # Linux Assembly HOWTO


    Fourth hand tunes them looking for tiny improvements over the machine generated.


    The human wins because he can use the machine.


    ## 2.2.2. Languages with optimizing compilers


    Languages like ObjectiveCAML, SML, CommonLISP, Scheme, ADA, Pascal, C++, among
    others, all free optimizing compilers that will utilize the bulk of your programs,
    and often better than hand–coded assembly for tight loops, allowing you to focus
    on higher-level details, and without forbidding you to grab a few percent of extra
    performance in the above–mentioned worry, once you''ve reached a stable design.
    Of course, there are also commercial optimizing compilers for most of these languages,
    too!


    ## 2.2.3. General procedure to speed up your code


    For speeding code up, you should do it for parts of a program that a profiling
    tool has consistently identified as being a bottleneck.


    Hence, if you use some code portion as being too slow, you should:


    - first try to use a better algorithm;

    - then try to compile it rather than interpret it;

    - then try to enable and tweak optimization from your compiler; own- then give
    the compiler hints about how to optimize (typing information in LISP; register
    usage with GCC; lots of options in most compilers, etc.);

    - then possibly fallback to assembly programming


    Finally, before you end writing assembly, you should inspect generated code, to
    check the problem is really with bad code generation, as this really may not be
    the case: compiler-generated code might be better than what you''ve written, particularly
    in modern multi-pipelined architectures! Slots of a program might be intrinsically
    so. The biggest problems on modern architectures with fast processors are due
    to memory access, cache–misses, TLB–misses, and page–faults; register optimization
    becomes useless, and you''ll more profitably rethink data structures and threading
    to achieve better locality in memory access. A completely different approach to
    the problem might help, then.


    ## 2.2.4. Inspecting compiler-generated code


    There are many reasons to inspect compiler-generated assembly code. Here is what
    you''ll do with such code:


    - whether generated code can be enhanced with hand–coded assembly (or by tweaking
    switches)

    - when that''s the case, start from generated code and modify it instead of starting
    from scratch

    - more generally, use generated code as stubs, which at least gets right the way
    your assembly routines to the external world

    - track bugs in your compiler (hopefully the rarer)


    The standard way to have assembly code generated is to invoke your compiler with
    the –S flag. This works with Unix compilers, including the GNU C Compiler (GCC),
    but YMMV. For GCC, it will produce more understandable assembly code with the
    -fverbose-asm command-line option. Of course, if you want to get good assembly
    code, don''t forget your usual optimization options and hints!


    Chapter 2. Do you need assembly?


    ## 2.3. Linux and assembly


    You probably noticed, in general case you don''t need to use assembly language
    in Linux programming. Unlike DOS, you do not have to write Linux drivers in assembly
    (well, actually you can do it if you really want). And with modern optimizing
    compilers, if you are care of speed optimization for different CPUs, it''s much
    simpler to write in C. However, if you''re reading this, you might have some reason
    to use assembly instead of C/C++.


    You may need to use assembly, or you may want to use assembly. In short, main
    practical (need) reasons of diving into the assembly realm are small code and
    libc independence. Practical (want), and the most often reason is just an old
    crazy hacker, who has twenty years old habit of doing everything in assembly.


    However, if you''re porting Linux to some embedded hardware you can be quite short
    at the size of whole system: you need fit kernel, libc and all that stuff of (file
    text) utils until several hundreds of kilobytes, and every kilobyte costs much.
    One of the possible ways is to rewrite (or all) parts of system in assembly, and,
    this will really save you a lot of space. For instance, a simple httpd written
    in assembly can take less than 600 bytes; you can fit a server consisting of kernel,
    httpd and ftpd in 400 KB or less... Think about it.


