    \ clean api, tons of functionality and examples, industry standard\n> so you can\
    \ learn from SGI demos for example\n> Cons: hardware acceleration is normally\
    \ a must, some quirks between versions and platforms\n> Examples: loads - check\
    \ out we mesa3.org for the links section.\n> To get going looking at the avgalib\
    \ examples and also install SDL and get it working. After that, get the sky's\
