    developed the cygwin32.dll library, for GNU programs to run on Win32 platform;
    thus, you can use GCC, GAS, all the GNU tools, and many other Unix applications.


    # 5.3. Your own OS


    Control is what attracts many OS developers to assembly, often is is what leads
    to or stems from assembly hacking. Note that any system that allows self-development
    could be qualified "OS", though it can run "on the top" of an underlying system
    (much like Linux over Mach or OpenGenera Unix).


    Hence, for easier debugging purpose, you might like to develop your "OS" first
    as a process running on top of Linux (despite the slowness), then use the Flux
    OS kit (which grants use of Linux and BSD drivers in your own OS) to make it stand-alone.
    When your OS is stable, it is time to write your own hardware drivers if you really
    love that.


    This HOWTO will not cover topics about bootloader code, getting into 32-bit mode,
    handling Interrupts, the basics about Intel protected mode or V86/R86 braeadness,
    defining your object format and calling conventions.


    The main place where to find reliable information about that all, is source code
    of existing OSes and bootloaders. Lots of pointers are on the following webpage:
    http://www.tunes.org/Review/OSes.html'
  - '[PAGE 25]


    # Chapter 6. Quick start


    # 6.1. Introduction


    Finally, if you want to try this crazy idea and write something in assembly (if
    you''ve reached this section — you''re real assembly fan), here''s what you need
    to start.


    As you''ve read before, you can write for Linux in different ways; I''ll show
    how to use direct kernel calls, since this is the fastest way to call kernel service;
    our code is not linked to any library, does not use ELF interpreter, it communicates
    with kernel directly.


    I will show the same sample program in two assemblers, nasm and gas, showing Intel
    and AT&T syntax.


    You may also want to read Introduction to UNIX assembly programming tutorial,
    it contains sample code for other UNIX-like OSEs.


    # 6.1. Tools you need


    First of all you need assembler (compiler) — nasm or gas.


    Second, you need a linker — ld, since assembler produces only object code. Almost
    all distributions have it ld, in the binutils package.


    As for most, you may have to download and install binary packages for Linux and
    docs from the nasm site; note that several distributions (Stampede, SuSe, Debian,
    Mandrake) already have nasm, check.


    If you''re going to dig in, you should also include files for your OS, and if
    possible, kernel source.


    # 6.2. Hello, world!


    # 6.2.1. Program layout


    Linux is 32-bit, runs in protected mode, has flat memory model, and uses ELF for
    binaries.


    A program can be divided into sections: .text for your code (read-only), .data
    for your data (read-write), .bss for uninitialized data (read-write); there can
    actually be a few other standard sections, as well as some user-defined sections,
    but there''s rare need to use them and they are out of interest here. A program
    must have at least .text section.


    Now we will show your first program. Here is code:


    ```

    section .data                      ;section declaration

    msg      db          "Hello, world!",0xa    our dear string

    len     equ        $ - msg             ;length of our dear string


    section .text                      ;section declaration

    ```


    # 6.2.2. NASM (hello.asm)'
  - '[PAGE 26]


    # Linux Assembly HOWTO


    | global _start | ;we must export the entry point to the ELF linker or

    ;loader. They conventionally recognize _start as their

    ;entry point. Use ld -e foo to override the default. |

    | --- | --- |

    | :start:write string to stdout | mov edx,len ;third argument: message length

    |mov ecx,msx ;second argument: pointer to message to write

    |mov ebx,1 ;first argument: file handle (stdout)

    |mov eax,4 ;system call number (sys_write)

    |int 0x80 ;call kernel |

    |and exit | mov ebx,0 ;first syscall: exit code

    |mov eax,1 ;system call number (sys_exit)

    |int 0x80 ;call kernel |


    # 6.2.3. GAS (hello.S)


    .data # section declaration

    msg .ascii "Hello, world!\n" # our dear string

    len - . msg # length of our dear string

    .text # section declaration

    .global _start # we must export the entry point to the ELF linker or

    # loader. They conventionally recognize _start as their

    # entry point. Use ld -e foo to override the default.


    _start:

    # write our string to stdout


    | movl $len,$ebx #third argument: message length

    |movl $msg,$ecx #second argument: pointer to message to write

    |movl $1,$ebx #first argument: file handle (stdout)

    |movl $4,$eax #system call number (sys_write)

    |int 0x80 #call kernel |

    |and exit | movl $0,$ebx #first argument: exit code

    |movl $1,$eax #system call number (sys_exit)

    |int 0x80 #call kernel |


    # 6.3. Building an executable


    # 6.3.1. Producing object code


    First step of building an executable is compiling (or assembling) object file
    from the source:'
  - '[PAGE 27]


    For nasm example:


    ```

    $ nasm -f elf hello.asm

    ```


    For gas example:


    ```

    $ as -o hello.o hello.S

    ```


    This makes hello.o object file.


    # 6.3.2. Producing executable


    Second step is producing executable file itself from the object file by invoking
    linker:


    ```

    $ ld -s -o hello.o

    ```


    This will finally build hello executable.


    Hey, try to run it... Works? That''s it. Pretty simple.'
