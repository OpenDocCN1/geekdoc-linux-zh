  mdcn: "\n\n## 第 7 章 资源\n\n## 7.1. 指南与链接\n\n你获取 Linux/UNIX 汇编编程材料的主要资源是：\n\nhttp://linuxassembly.org/resources.html\n\
    \n请访问该网站，获取大量关于不同 UNIX 操作系统和 CPU 的汇编项目、工具、教程、文档、指南等资源。由于其内容更新很快，我将不再在此处罗列。\n\n\
    如果你是汇编语言初学者，这里有一些入门指南：\n\n- *The Art Of Assembly*（汇编语言艺术）\n- x86 汇编语言常见问题解答 FAQ\n\
    - ftp.ltuth.se 镜像了 hornet 和 x2ftp 之前的 msdos 汇编编码相关存档\n- CoreWars：一种学习通用汇编语言的趣味方式\n\
    - Usenet: comp.lang.asm.x86; alt.lang.asm\n\n## 7.2. 邮件列表\n\n如果你对 Linux/UNIX 汇编编程感兴趣（或有疑问，或者只是好奇），我特别邀请你加入\
    \ Linux 汇编编程邮件列表。\n\n这是一个关于在 Linux、*BSD、BeOS 或任何其他 UNIX/POSIX 类操作系统下进行汇编编程的开放讨论；同时它不限于\
    \ x86 汇编（欢迎 Alpha、Sparc、PPC 等其他架构的开发者！）。\n\n列表地址为 <linux-assembly@vger.kernel.org>。\n\
    \n如需订阅，请向 <majordomo@vger.kernel.org> 发送邮件，并在正包含以下内容：\n\n```\nsubscribe linux-assembly\n\
    ```\n\n详细信息和列表存档可以在 http://linuxassembly.org/list.html 获取。\n\n## 第 8 章 常见问题解答\n\
    \n以下是关于 Linux 汇编编程的常见问题（答案）。部分问题（及答案）摘自 linux–assembly 邮件列表。\n\n- 8.1. 我如何在 Linux\
    \ 中进行图形编程？\n- 8.2. 我如何在 Linux 下调试汇编代码？\n- 8.3. 有没有其他好用的调试工具？\n- 8.4. 我如何从内核模块（BSD、BeOS\
    \ 等）访问 BIOS 函数？\n- 8.5. 是否可能用汇编语言编写内核模块？\n- 8.6. 我如何动态分配内存？\n- 8.7. 我不理解如何使用系统调用！\n\
    \n### 8.1. 我如何在 Linux 中进行图形编程？\n\n来自 Paul 的回答：\n\n> 在 Linux 中图形编程有多种选择。使用哪种取决于你想做什么。虽然没有哪一个网站涵盖了所有信息，但这里有一些建议：\n\
    > GALib：这是一个用于控制台 SVGA 的 C 库。\n> 优点：非常易学，有良好的代码示例，与 DOS 下对应的 gfxx 库没有太大区别，你在 DOS\
    \ 中知道的所有效果都可以很小困难地转换。\n> 缺点：由于它们直接写入硬件，运行它们需要特殊权限，不兼容某些芯片组，但可以在 X-Windows 下运行。\n\
    > 请在 http://ftp.isco.za 搜索 svgalib-1.4x。\n> Framebuffer（帧缓冲区）：在 SVGA 分率下自己实现图形。\n\
    > 优点：速度快，线性映射视频访问，如果你愿意可以使用 ASM：\n> 缺点：必须编译进内核，存在特定于芯片组的问题，必须退出 X 环境才能运行，依赖于对\
    \ Linux 系统调用和内核的深厚知识，调试困难。\n> 示例：(http://www.linuxassembly.org/) 以及 leaves 示例，以及我个人关于汇编版\
    \ framebuffer 代码和技巧的网站 (http://ma.verick.co/linuxx/)。\n> Xlib：XFree86 的访问控制和开发库。\n\
    > 优点：完全控制你的 X 应用。\n> 缺点：学习困难，操作极其痛苦，并且需要对 X 底层工作原理有所了解。\n> 如果你真的以此虐，否则不建议使用。所有的包含文件和库文件可能已经安装好了，所以你拥有所需的内容。\n\
    > 低级 API：包括 PTC、SGI 和 Clanlib。\n> 优点：非常灵活，可以在 X 或控制台下运行，通常会部分抽象视频硬件让你能够绘制线性表面，有大量良好的代码示例，可以链接到\
    \ OpenGL 和音频库等其他 API，免费提供 Windows DirectX 版本。\n> 缺点：速度不如自己实现，即使是开发版也是如此（版本变化频繁）。\n\
    > 示例：PTC 和 SGI 有极好的演示，SDL 用于 sdlQuake、Myth II、Civ CTP，Clanlib 也已用于游戏。\n> 高级 API：OpenGL\
    \ – 还有吗？\n> 优点：接口整洁，功能和示例极其丰富，行业标准。\n> 比如你可以从 SGI 的演示中学习。\n> 缺点：通常必须硬件加速，某些版本和平台之间存在怪异。\n\
    > 示例：loads - 请查看 we mesa3.org 的链接部分。\n> 想要开始的话可以查看 avgalib 示例，并安装 SDL 且使其运行。在此之后，大有可为。\n\
    \n### 8.2. 我如何在 Linux 下调试汇编代码？\n\n有一个早期版本的汇编语言调试器（Assembly Language Debugger），它是专门为汇编代码设计的，并且可以移植到\
    \ Linux 和 #BSD 上运行。它已经可以使用了，应该是正确的选择，去看看吧！\n\n你也可以尝试 gdb。虽然它是一个源码级调试器，但可以用来调试纯汇编代码，通过一些技巧，你可以使用\
    \ gdb 实现你的需求（遗憾的是，nam-'g' 选项不会为 gdb 生成正确信息；这是一个讨厌的 bug，这里是来自 Dmitry Bakhvalov\
    \ 的回答）：\n\n- 我个人使用 gdb 作为调试辅助工具。尝试一下这种方法：\n\n1) 使用以下命令：\n   $ nm -f elf -g smth\n\
    \n2) 启动 gdb：\n   $ gdb smth\n\n3) 在 gdb 中：\n   $ gdb *0x\n\n- 8.3. 有其他好用的调试工具？\n\
    - 8.4. 我如何从内核模块（BSD、BeOS 等）访问 BIOS 函数？\n- 8.5. 是否可能用汇编语言编写内核模块？\n- 8.6. 我如何动态分配内存？\n\
    - 8.7. 我不理解如何使用系统调用！\n\n"
