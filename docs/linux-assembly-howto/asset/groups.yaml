    透明副本的适用格式示例包括无标记的纯 ASCII、LaTeX 输入格式、使用可用 DTD 的 SGML 或 XML，以及为人类修改而设计的标准格式 HTML。不透明格式包括
    PostScript、PDF、只能由专有文字处理器读取和编辑的专有格式、DTD 和处理工具通常不可用的 SGML 或 XML，以及文字处理器仅为输出目的而生成的
    HTML。


    印刷书籍的“标题页”、标题本身，以及后续页面需要装载本许可要求在标题中出现的材料。对于没有标题页的作品，“标题页”是指作品标题出现最显著的文本，位于正文开始之前。


