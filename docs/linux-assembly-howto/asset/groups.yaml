    anyway, for C code, GCC is fairly good);

    * And in any case, as moderator John Leveine on comp.compilers,


    ```

    "compilers make a lot easier to use complex data structures, and compilers don''t
    get bored halfway through and generate reliably pretty good code."

    ```


    They will also correctly propagate code transformations throughout the whole (huge)
    program optimizing code between procedures and module boundaries.


    # 2.1.3. Assessment


    In all you, you might find that using assembly is sometimes needed, and might
    even be useful in a few cases where it is not, you''ll want to:


    +   * minimize use of assembly code

    * encapsulate this code in well-defined interfaces

    * have your assembly code automatically generated from patterns expressed in a
    higher–level language than assembly (e.g. GCC inline assembly)

    * have automatic tools to translate these programs into assembly code

    * have this code optimized if possible

    * All of the above, i.e. write (an extension) to an optimizing compiler back–end.


    Even when assembly is needed (e.g. OS development), you''ll find that not much
    of it is required, and the above principles remain.


    The Linux kernel sources concerning this: little assembly as needed, resulting
    in a fast, reliable, portable, maintainable OS. Even a successful game DOOM was
    almost massively written in C, with a tiny part being written in assembly for
    speed up.


    # 2.2. How to NOT use Assembly


    # 2.2.1. General procedure to achieve efficient code


    As says Charles Fitman on comp.compilers about human vs computer–generated assembly
    code:


    > The human should always win and here is why.


    First the human writes the whole thing in a high level language.

    Second he profiles to find the hot spots where it spends its time.

    Third he has the compiler produce assembly for those small sections of code.


