    # Linux 汇编指南


    第四手调优它们，是为了寻找比机器生成代码更微的改进。


    人类之所以胜出，是因为人类可以使用这种机器。


    ## 2.2.2. 带有优化编译器的语言


    像 ObjectiveCAML、SML、CommonLISP、Scheme、ADA、Pascal、C++ 等语言都提供了免费的优化编译器。这些编译器可以处理你程序的大部分，而且对于紧凑循环，其效果往往比手写的汇编代码更好。这让你能够关注更高级别的细节，同时在设计达到稳定设计后，它们并不会阻止你针对上述顾虑获取几个百分比的额外性能。当然，大多数这些语言也有相应的商业化优化编译器！


    ## 2.2.3. 加速代码的通用步骤


    为了加速代码，你应该针对性能分析工具持续识别为瓶颈的程序部分进行优化。


    因此，如果你认为某部分代码运行太慢，你应该：


    - 首先尝试使用更好的算法；

    - 然后尝试编译它而不是解释它；

    - 然后尝试启用并调整编译器的优化选项；

    - 接着尝试向编译器提供优化提示（例如：在 LISP 中输入类型信息；在 GCC 中指定寄存器使用；大多数编译器中的大量选项等）；

    - 最后可能回退到汇编编程


    最后，在结束编写汇编之前，你应该检查生成的代码，以确认问题是否真的出在代码生成上，因为事实可能并非如此：编译器生成的代码可能比你写的更好，特别是在现代多流水线架构中！程序的某些部分本质上就是如此。在具有快速处理器的现代架构上，最大的问题由于内存访问、缓存缺失（cache–misses）、TLB
    缺失（TLB–misses）和页错误（page–faults）；寄存器优化变得毫无用，重新思考数据结构和线程以实现更好的内存访问局部性会更有利。这时，完全不同的方法可能会有所帮助。


    ## 2.2.4. 检查编译器生成的代码


    检查生成的汇编代码有很多原因。你可以对这类代码进行以下操作：


    - 检查生成的代码是否可以通过手写汇编（或通过调整开关）进行增强

    - 如果是如此，从生成的代码开始对其进行修改，而不是从头开始

    - 更通俗地说，将生成的代码作为存根（stubs），这至少可以确保你的汇编例程与外部交互的方式是正确的

    - 跟踪编译器中的 Bug（希望越少越好）


    生成汇编代码的标准方法是使用 `-S` 标志调用编译器。这适用于 Unix 编译器，包括 GNU C 编译器 (GCC)，但结果因人而异 (YMMV)。对于
    GCC，使用 `-fverbose-asm` 选项可以产生更易读的汇编代码。当然，如果你想获得良好的汇编代码，别忘记你常用的优化选项和提示！


    第 2 章。你需要汇编吗？


    ## 2.3. Linux 与汇编


    你可能已经注意到，通常情况下，在 Linux 编程中不需要使用汇编语言。与 DOS 不同，你不需要用汇编编写 Linux 驱动（实际上，如果你真的想做，你是可以的）。而且有了现代优化编译器，如果你是为了针对不同
    CPU 进行速度优化，用 C 编写要简单得多。然而，如果你正在阅读这些，你可能某些理由使用汇编而不是 C/C++。


    你可能需要使用汇编，或者你可能想使用汇编。简而言之，深入汇编领域的主要实际（需要）理由是代码量小和对 libc 的独立。实际（想要）且最常见的理由仅仅是一个老怪黑客，他有着了二十年用汇编完成一切的习惯。


    然而，如果你正在将 Linux 移植到某些嵌入式硬件，你对整个系统的尺寸可能非常严苛：你需要将内核、libc 以及所有（文件）实用工具压缩到几百 KB 以内，而每一字节的成本都是昂贵的。一种可能的方法是用汇编重写（或全部重写）系统的部分，这将为你节省大量空间。例如，用汇编编写的简单
    httpd 可以少于 600 字节；你可以将一个包含内核、httpd 和 ftpd 的服务器装进 400 KB 以内……考虑一下。


    # 第 3 章。汇编器


    ## 3.1. GCC 内联汇编


    众著名的 GNU/C++ 编译器 (GCC) 是 GNU 项目的核心 32 位优化编译器...


