    # 第 1 章 引言


    如果你熟悉 HOWTO（操作指南），或者只是讨厌阅读这些与汇编无关的垃圾内容，可以跳过本章。


    ## 1.1. 法律声明


    根据《自由 GNU 文档许可协议 1.1》的条款，允许复制、分发和/或修改本文档；但不包含任何不变部分（Invariant Sections）、前封文本（Front-Cover
    Texts）和后封副本（Back-Cover copies）。GNU 自由文档许可协议附录中包含了该协议副本。


    本文档的最新官方版本可在 Linux Assembly LDP 网站获取。如果你阅读的是几个月前的版本，请检查上述 URL 以获取新版本。


    ## 1.2. 前言


    本文档旨在解决那些使用自由软件（或想使用）32 位 x86 汇编语言的人，特别是在 Linux 操作系统下的问题。在许多地方，为某些软件或文档库提供了通用资源链接（URL）。本文档还指向了其他关于非自由、非
    32 位汇编的文档，尽管这并不是你的首要目标。另请注意，关于你喜爱的平台（无论它是什么）的 FAQ 和文档，你应该咨询这些来解决平台特定的问题，而不是与汇编编程相关的问题。


    由于汇编编程的主要兴趣是构建操作系统、解释器、编译器的内核，以及当 C 编译器无法提供所需的扩展性时（性能已越来越少不再是首要问题），我们专注于这类软件的开发。


    如果你不知道什么是自由软件，请仔细阅读《GNU 通用公共许可协议》（GPL 或拷贝权协议），它被用于许多自由软件，并且是它们大多数许可协议的模板。它通常位于名为
    `COPYING`（或 `COPYING.LIB`）的文件中。自由软件基金会（FSF）的文献可能对你有帮助。特别是自由软件一个有趣的特点是，它带有源代码，你可以查阅并纠正它，有时甚至可以借用。请仔细阅读你的特定许可并遵守它。


    ## 1.3. 贡献


    这是一个交互式演化的文档：我们特别邀请你提问、回答问题、提供正确答案、指向新软件、向当前维护者指出页面中的错误或缺陷。简而言之，请贡献吧！


    如需贡献，请联系维护者。


    > 在编写时，维护者是 Konstantin Boldys 而不再是 François-Rena Ribeiro（自 0.5 版本起）。我（Fare）一直在寻找一位严肃的黑客来取代我担任本文档的维护者，很高兴宣布
    Konstantin 是我优秀的继任者。


    ## 1.4. 翻译


    本 HOWTO 的韩语翻译请见 http://kldp.org/HOWTO/html/Assembly-HOWTO/。此外，早期版本的 HOWTO 有过法语翻译，但我现在找不到了。


    ## 第 2 章 你需要汇编吗？


    嗯，我不想干涉你正在做的事情，但这里有一些基于经验的建议。


    ### 2.1. 优缺点


    ### 2.1.1. 汇编的优点


    汇编可以表达非常底层的内容：


    - 你可以访问依赖机器的寄存器和 I/O

    - 你可以控制关键区域中的代码行为，否则这些区域可能会在多个软件或硬件设备之间导致内联死锁

    - 你可以打破常规编译器的约定，这可能允许某些优化（例如临时打破关于内存分配、线程、调用约定等规则）

    - 你可以使用不兼容的约定在代码片段之间构建接口（例如，由不同的编译器产生，或通过低级接口分离）

    - 你可以访问处理器中不寻编程方式（例如，在 Intel PC 上使用 16 位模式来处理启动、固件或遗留代码）

    - 你可以为紧凑循环生成相当快速的代码，以对付糟糕的非优化编译器（但话如此，可用的优化编译器并不多！）

    - 你可以为紧凑循环生成完美调优的优化代码以应对糟糕的编译器


    ### 2.1.2. 汇编的缺点


    汇编是一种非常底层的语言，这意味着：


    - 编写汇编代码非常耗时

    - 它容易出错

    - 你的代码难以维护

    - 汇编代码无法移植到其他架构

    - 小小的算法改变就可能完全使现有的汇编代码失效

    - 在任何情况下，你可能需要手动编写汇编


    '
