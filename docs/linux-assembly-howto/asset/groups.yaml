    patterns, not forcibly exact code.


    Thus, you can put your assembly into CPP macros, and inline C functions, so anyone
    can use it in any C/function macro. Inline functions resolve macros much very,
    but are cleaner to use. Beware that in all cases, code will be duplicated, so
    only local labels ( : style) should be defined in that as code. However, a macro
    would allow the name for a non local label to be passed as a parameter (or else,
    you should use additional meta-programming methods). Also, note that propagating
    inline assembly code will prevent potential bugs in them; watch out for register
    constraints in inline asm code.


    Lastly, the C language itself may be considered as a good abstraction to assembly
    programming, which relieves you most of the trouble of assembling.


    # 3.2. GAS


    GAS is the GNU Assembler, that GCC relies upon.


    # 3.2.1. Where to find it


    Find at the same place where you''ve found GCC, in the binutils package. The latest
    version of binutils is available from http://sources.redhat.com/binutils/


    # 3.2.2. What is this AT&T syntax


    Because GAS was invented to support a 32-bit compiler, it uses standard AT&T syntax,
    which resembles a syntax for standard m86 assemblers, and is standard in the UNIX
    world. This syntax is neither worse, nor better than the Intel syntax. It''s just
    different. When you get to use it, you find it more regular than the Intel syntax,
    a bit boring.


    Here are the few caveats about GAS:


    +   * Register names are prefixed with %, so that registers are %ax, %edx and
    dl, instead of just dl. This makes it possible to include external C symbols directly
    in assembly source, without any risk of confusion, or any need for underscores
    prefixes.

    * The order of operands is (source) first, and destination, as opposed to the
    Intel convention of destination first and last. Hence, what in Intel syntax is
    mov eax, %edx (move contents of register ed into eax) will be in GAS mov %edx,
    %ax.

    * The operand size is specified as a suffix to the instruction name. The suffix
    is b for (8-bit) byte, w for (16-bit) word, and l for (32-bit) word. However,
    the correct syntax for the above instruction would have been movl %edx, eax. Gas
    does not require strict AT&T syntax, so the suffix is optional when size can be
    guessed from register operands, and defaults to 32–bit (with a warning).

    * Immediate operands are marked with a $ prefix, as in add $5, %ax (add immediate
    value 5 to register %ax).


    Chapter 3. Assemblers'
  - '[PAGE 12]


    # Linux Assembly HOWTO


    +   - Missing operand prefix indicates that it is memory-contents; mov $foo, %eax
    puts the address of variable foo in register %eax, mov foo, %eax puts the contents
    of variable foo into %eax.

    - Indexing or indirection is by enclosing the index register or memory cell address
    in parentheses, testb $0x80,17 (%ebp) (the high bit of the byte value at offset
    17 from the cell pointed to %ebp).


    Note: There are few programs which may help you convert source code between AT&T
    and Intel assembler syntaxes; some of the are capable of performing conversion
    in both directions.


    GAS has comprehensive documentation in TeXinfo format, which comes at least with
    the source distribution. Browsed extracted .info pages were always. Used to be
    a file named gas.doc or as.doc around the GAS source package, but it was merged
    into the TeXinfo docs. Of course, in case of doubt, the ultimate documentation
    is the sources themselves! A section that will particularly interest you is Machine
    Dependencies:i386-Dependent:


    Again, the sources for Linux (the OS) come in as excellent examples; see under
    linux/arch/i386/ the following files: kernel/*.S,boot/compressed/*.S,math-emu/*.S.


    If you are writing a kind of assembly, a thread package, you may see as well as
    other languages (OCaml, Gforth, etc.), or thread packages (QuickThreads, MIT threads,
    LinuxThreads, etc), or whatever else do it.


    Finally, compiling a C program might show you the syntax for the kind of instructions
    you want. See do you need assistance?


    # 3.23. Intel syntax


    Good news are since binutils 2.10, GAS supports Intel syntax. It can be triggered
    with .intel_syntax directive. Unfortunately this mode is not documented (yet?)
    in the official binutils manual, so if you want to use it, try example http://home.snafu.de/phpr/lupas85.html.gz,
    which is an extract from AMD 64-bit port of binutils 2.11.


    # 3.2.4. 16-bit mode


    Binutils (2.9.1.25+) now supports 16-bit mode (registers and addressing) on i386
    PCs. Use .code16 and .code32 to switch between assembly modes.


    Also, a neat trick used by several people (the oskit authors) is to force GCC
    to produce code for 16–bit real mode, using an inline assembly statement(".code16\n").
    GCC will emit only 32–bit addresses, but GAS will insert proper 32–bit prefixes
    for them.


    # 3.2.5. Macro support


    GAS has some capability included, as detailed in the TeXinfo docs. Moreover, while
    GCC recognizes .s files as raw assembly to send to GAS, it also recognizes .s
    files as files to pipe through CPP before feeding to GAS. Again and again, see
    Linux sources for examples.


    GAS also has GASP (GAS Preprocessor), which adds all the universal macroassembly
    tricks to GAS. GASP


    Chapter 3. Assemblers


