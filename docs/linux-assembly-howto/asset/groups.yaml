- md: "\n# Linux Assembly HOWTO\n\nevaluation (drivers not only in asm, but not even\
    \ in C!). The problem is that the partial evaluator used to achieve efficiency\
    \ is not free software. Any taker for the replacement?\n\nAnyway, in all these\
    \ cases, you'll be better using GCC inline assembly with the macros linux/asm/*..h\
    \ than writing assembly source files.\n\n## 5.1.5. Accessing 16-bit drivers from\
    \ Linux/i386\n\nSuch thing is theoretically possible (see how DOSEMU selectively\
    \ grant hardware port access to programs), and I've heard rumors that somewhere\
    \ did do it (in the PCI driver)? Some VESA access stuff? ISA PnP dunno). If you\
    \ have some more precise information on that, you'll be most welcome. Anyway,\
    \ good places to look for more information are the Linux kernel sources, DOSEM\
    \ sources (and other programs in the DOSUM repository), and sources for various\
    \ low-level programs under Linux... (perhaps GIF if it supports VESA).\n\nBasically,\
    \ you must use 16-bit protected mode or vm86 mode.\n\nThe first is simpler to\
    \ setup, but only with well-behaved code that won't do any kind of segment arithmetics\
    \ or absolute segment addressing (particularly segment 0), unless it happens that\
    \ all segments can be used in the LDT.\n\nThe latter allows for \"compatibility\"\
    \ with vanilla 16-bit environments, but requires more complicated handling.\n\n\
    In both cases, you can jump to 16-bit code, you:\n\n- map any absolute address\
    \ used in the 16-bit code (such as ROM, video buffers, DMA targets, and memory-mapped\
    \ I/O) from /dev/mem to your process' address space\n- setup the LDT/or vm86 monitor.\n\
    - grab proper I/O permissions from the kernel (the above section)\n\nAgain, consider\
    \ the source for the stub contributed to the DOSEMU project, particularly mini-emulators\
    \ for running ELKS or simple .COM programs under Linux/i386.\n\n## 5.2. DOS and\
    \ Windows\n\nMost DOS extends use some interface to DOS services. Read their docs\
    \ about that, but often, they use simulate int 0x21, and so do \"if\" you are\
    \ in real mode (I doubt whether they have more than stubs and extend to work with\
    \ 32-bit operands; they most likely will just interrupt the real-mode or vm86\
    \ handler).\n\nDocs about DPIM (and much more) can be found on: x2ftp.oulu.in/pub/msdos/programming/\
    \ (again, the original x2ftp site is closing (no?), so use a mirror site).\n\n\
    DJGPP comes with its own (limited) glad derivative/replacement, too.\n\nIt is\
    \ possible to cross-compile from Linux to DOS, see the devel/msdos directory of\
    \ your local FTP mirror for metalab.unc.edu; Also see the DOS-extender from the\
    \ Flux project from the university of Utah.\n\n## Chapter 5. Calling conventions\n\
    \nOther documents and FAQs are not DOS-centered; we do not recommend DOS development.\n\
    \nWindows and Co. This document is not about Windows programming, you can find\
    \ lots of documents about everywhere.. The thing you should know is that Cygus\
    \ Solutions developed the cygwin32.dll library, for GNU programs to run on Win32\
    \ platform; thus, you can use GCC, GAS, all the GNU tools, and many other Unix\
    \ applications.\n\n## 5.3. Your own OS\n\nControl is what attracts many OS developers\
    \ to assembly, often is is what leads to or stems from assembly hacking. Note\
    \ that any system that allows self-development could be qualified \"OS\", though\
    \ it can run \"on the top\" of an underlying system (much like Linux over Mach\
    \ or OpenGenera Unix).\n\nHence, for easier debugging purpose, you might like\
    \ to develop your \"OS\" first as a process running on top of Linux (despite the\
    \ slowness), then use the Flux OS kit (which grants use of Linux and BSD drivers\
    \ in your own OS) to make it stand-alone. When your OS is stable, it is time to\
    \ write your own hardware drivers if you really love that.\n\nThis HOWTO will\
    \ not cover topics about bootloader code, getting into 32-bit mode, handling Interrupts,\
    \ the basics about Intel protected mode or V86/R86 braeadness, defining your object\
    \ format and calling conventions.\n\nThe main place where to find reliable information\
    \ about that all, is source code of existing OSes and bootloaders. Lots of pointers\
    \ are on the following webpage: http://www.tunes.org/Review/OSes.html\n\n## Chapter\
    \ 6. Quick start\n\n## 6.1. Introduction\n\nFinally, if you want to try this crazy\
    \ idea and write something in assembly (if you've reached this section — you're\
    \ real assembly fan), here's what you need to start.\n\nAs you've read before,\
    \ you can write for Linux in different ways; I'll show how to use direct kernel\
    \ calls, since this is the fastest way to call kernel service; our code is not\
    \ linked to any library, does not use ELF interpreter, it communicates with kernel\
    \ directly.\n\nI will show the same sample program in two assemblers, nasm and\
    \ gas, showing Intel and AT&T syntax.\n\nYou may also want to read Introduction\
    \ to UNIX assembly programming tutorial, it contains sample code for other UNIX-like\
    \ OSEs.\n\n### 6.1. Tools you need\n\nFirst of all you need assembler (compiler)\
    \ — nasm or gas.\n\nSecond, you need a linker — ld, since assembler produces only\
    \ object code. Almost all distributions have it ld, in the binutils package.\n\
    \nAs for most, you may have to download and install binary packages for Linux\n\
    \n## 6.2. Hello, world!\n\n### 6.2.1. Program layout\n\nA program can be divided\
    \ into sections: .text for code (read-only), .data for data (read-write), .bss\
    \ for uninitialized data, as well as some user-defined sections, but there actually\
    \ be few other sections. Now we will show your first program. Here is code:\n\n\
    ```\nsection .data\nmsg      db          \"Hello, world!\",0xa\nlen     equ  \
    \      $ - msg\n```\n\n### 6.2.2. NASM (hello.asm)\n\n:start:\n    mov edx, len\
    \        ; third argument: message length\n    mov ecx, msg        ; second argument:\
    \ pointer to message to write\n    mov ebx, 1          ; first argument: file\
    \ handle (stdout)\n    mov eax, 4          ; system call number (sys_write)\n\
    \    int 0x80            ; call kernel\n    \n    mov ebx, 0          ; first\
    \ argument: exit code\n    mov eax, 1          ; system call number (sys_exit)\n\
    \    int 0x80            ; call kernel\n```\n\n### 6.2.3. GAS (hello.S)\n\n.data\
    \ # section declaration\nmsg .ascii \"Hello, world!\\n\" # our dear string\nlen\
    \ - . msg # length of our string\n.text # section declaration\n.global _start\
    \ # we must export the entry point\n\n_start:\n    mov $len, %edx      ; third\
    \ argument: message length\n    mov $msg, %ecx      ; second argument: pointer\
    \ to message to write\n    mov $1, %ebx       ; first argument: file handle (stdout)\n\
    \    mov $4, %eax       ; system call number (sys_write)\n    int 0x80       \
    \    ; call kernel\n\n    mov $0, %ebx       ; first argument: exit code\n   \
    \ mov $1, %eax       ; system call number (sys_exit)\n    int 0x80           ;\
    \ call kernel\n\n## 6.3. Building an executable\n\n\n\n### 6.3.1. Producing object\
    \ code\n\nFirst step of building an executable is compiling (or assembling) object\
    \ file from the source:\n\nFor nasm example:\n\n```\n$ nasm -f elf hello.asm\n\
    ```\n\nFor gas example:\n\n```\n$ as -o hello.o hello.S\n```\n\nThis makes hello.o\
    \ object file.\n\n### 6.3.2. Producing executable\n\nSecond step is producing\
    \ executable file itself from the object file by invoking linker:\n\n```\n$ ld\
    \ -s -o hello.o\n```\n\nThis will finally build hello executable.\n"
  mdcn: "\n\n# Linux 汇编指南\n\n评估（驱动程序不仅是用汇编写的，甚至不是用 C 语言）。问题是用于提高效率的部分评估器不是免费软件。有人能替代它吗？\n\
    \n无论如何，在所有这些情况下，使用带有 `linux/asm/*..h` 宏的 GCC 内联汇编，会比编写汇编源文件更好。\n\n## 5.1.5. 从\
    \ Linux/i386  16 位驱动程序\n\n这在理论上是可能的（查看 DOSEMU 如何选择性地向程序授予硬件端口访问权限），我听说某个地方确实实现了（在\
    \ PCI 驱动程序中）？某些 VESA 访问内容？ISA PnP 不清楚）。如果你有关于这些更精确的信息，欢迎提供。总之，寻找更多信息的好地方是 Linux\
    \ 内核源码、DOSEM 源码（以及 DOSUM 仓库中的其他程序），以及 Linux 下各种底层程序的源码……（也许 GIF 如果支持 VESA 的话）。\n\
    \n基本上，你必须使用 16 位保护模式或 vm86 模式。\n\n前者更容易设置，但仅适用于良好的代码，即不会进行任何形式的段算术或绝对段寻址（特别是段\
    \ 0），除非所有段都可以在 LDT 中使用。\n\n后者允许与原生的 16 位环境保持“兼容性”，但需要更复杂的处理。\n\n在两种情况下，你都可以跳转到\
    \ 16 位代码并：\n\n- 将 `/dev/mem` 映射到 16 位代码使用的任何绝对地址（如 ROM、视频缓冲区、DMA 以及内存映射 I/O）。\n\
    - 设置 LDT 或 vm86 监视器。\n- 从内核抓取正确的 I/O 权限（见上文）。\n\n再次，考虑为 DOSEMU 项目贡献的源码，特别是在 Linux/i386\
    \ 下运行 ELKS 或简单 .COM 程序的模拟器。\n\n## 5.2. DOS 和 Windows\n\n大多数 DOS 使用某些接口到 DOS 服务。阅读关于这些的文档，但通常，它们使用\
    \ `int 0x21`（我怀疑它们有 32 位操作数；实模式或 vm86 处理程序）。\n\n关于 DPIM（以及更多内容）可以在这里找到：2ftp.oulu.in/pub/msdos/programming/（再次，该站点已关闭（所以使用\
    \ `devel/msdos` 目录）。\n\nDJGPP 带有它自己的（有限）替代。\n\n从 Linux 交叉编译到 DOS，参考 Utah 大学的项目。\n\
    \n## 第5章 调用约定\n\n其他文档和 FAQ 不是以 DOS 为中心的；我们不推荐 DOS 开发。\n\nWindows 等。本文不是关于 Windows\
    \ 编程的，你可以在各处找到它的文档……你应该知道的是 Cygus Solutions 开发了 `cygwin32.dll` 库，用于在 Win32 平台上运行；因此你可以使用\
    \ GCC、GAS 以及许多其他 Unix 应用。\n\n## 5.3. 自己的 OS\n\n控制吸引了许多 OS 开发者，通常源于汇编。注意，任何允许自开发的系统都是“OS”，尽管它可以运行在\
    \ Linux 之上（尽管很慢）。\n\n因此，为了方便调试，你可能喜欢先开发你的“OS”（使用 Linux 和 BSD 驱动程序），然后编写自己的硬件驱动程序。当你的\
    \ OS 稳定后，本 HOWTO 将涵盖关于引导程序代码、进入 32 位模式、处理中断、Intel 保护模式基础、定义你的对象格式和调用约定。\n\n寻找关于这些所有可靠信息的主要地方，是现有\
    \ OS 和引导程序的源码。许多指针在以下网页：http://www.tunes.org/Review/OSes.html\n\n## 第6章 快速上手\n\
    \n## 6.1. 引言\n\n最后，如果你想尝试这个疯狂的想法并用汇编编写一些（如果你到了这一节——你是汇编粉丝），这里你需要：\n\n正如你之前看到的，你可以用不同的方式编写\
    \ Linux；我将展示如何使用内核调用，因为这是调用内核最快的方法；我们的代码没有链接任何库，不使用 ELF 解释器，直接与内核通信。\n\n我将用两个汇编器\
    \ nasm 和 gas 显示相同的示例程序，展示 Intel 和 AT&T 语法。\n\n你可能也想阅读 汇编编程教程，它包含了其他类 Unix OS 的示例代码。\n\
    \n### 6.1. 你需要的工具\n\n首先，你需要汇编器（编译器）——nasm 或 gas。\n\n其次，你需要链接器——ld，因为汇编器只产生目标代码。几乎所有的发行版\
    \ binutils 包中包含它。\n\n对于大多数人来说，你可能需要下载并安装 Linux 的二进制包。\n\n## 6.2. Hello, world!\n\
    \n### 6.2.1. 程序布局\n\n程序可以分为若干部分：.text 用于代码（只读），.data 用于数据（读写），.bss 用于未初始化数据，以及一些用户定义的部分，但实际上只有少数其他部分。现在我们将展示你的第一个程序。代码如下：\n\
    \n```\nsection .data\nmsg      db          \"Hello, world!\",0xa\nlen     equ\
    \        $ - msg\n```\n\n### 6.2.2. NASM (hello.asm)\n\n```\n:start:\n    mov\
    \ edx, len        ; 第三个参数：消息长度\n    mov ecx, msg        ; 第二参数：要写入的消息的指针\n   \
    \ mov ebx, 1          ; 第一个参数：文件句柄 (stdout)\n    mov eax, 4          ; 系统调用号 (sys_write)\n\
    \    int 0x80            ; 调用内核\n    \n    mov ebx, 0          ; 第一个参数：退出代码\n\
    \    mov eax, 1          ; 系统调用号 (sys_exit)\n    int 0x80            ; 调用内核\n\
    ```\n\n### 6.2.3. GAS (hello.S)\n\n```assembly\n.data # 段声明\nmsg .ascii \"Hello,\
    \ world!\\n\" # 我们亲爱的字符串\nlen - . msg # 我们字符串的长度\n.text # 段声明\n.global _start\
    \ # 我们必须导出入口点\n\n_start:\n    mov $len, %edx      ; 第三个参数：消息长度\n    mov $msg,\
    \ %ecx      ; 第二参数：要写入的消息的指针\n    mov $1, %ebx       ; 第一个参数：文件句柄 (stdout)\n \
    \   mov $4, %eax       ; 系统调用号 (sys_write)\n    int 0x80           ; 调用内核\n\n\
    \    mov $0, %ebx       ; 第一个参数：退出代码\n    mov $1, %eax       ; 系统调用号 (sys_exit)\n\
    \    int 0x80           ; 调用内核\n```\n\n## 6.3. 构建可执行文件\n\n### 6.3.1. 生成目标代码\n\n\
    构建可执行文件的第一步是从源码编译（或汇编）目标文件：\n\n对于 nasm 示例：\n\n```bash\n$ nasm -f elf hello.asm\n\
    ```\n\n对于 gas 示例：\n\n```bash\n$ as -o hello.o hello.S\n```\n\n这产生了 hello.o 文件。\n\
    \n### 6.3.2. 生成可执行文件\n\n第二步是通过调用链接器从目标文件生成可执行文件本身：\n\n```bash\n$ ld -s -o hello.o\n\
    ```\n\n这最终构建了 hello 可执行文件。\n\n"
