    # 3.5.4. TDASM


    The Table Driven Assembler (TDASM) is a free portable assembler for any kind of
    assembly language. It should be possible to use it as a compiler to any target
    microprocessor using a table that defines the compilation process.


    It is available from http://www.penguin.cz/~-niki/tdasm/


    # 3.5.5. HLA


    HLA is a High Level Assembly language. It uses a high level language like similar
    to Pascal, C/C++, and other HLLs) for variable declarations, procedure declarations,
    and procedure calls. It uses a modified assembly language for the standard machine
    instructions. It also provides several level language style controls (if, while,
    repeat...until, etc.) that help you write more readable code.


    HLA is free and with source, Linux and Win32 versions available. On Win32 you
    need MASM and a 32–bit version of MS-link on Linux you need GAS, because HLA produces
    assembled assembler code and uses that for assembling and linking.


    # 3.5.6. TALC


    TALC is not free ASM/Win32 based compiler (however it supports ELF output, does
    it?)


    TAL stands for Typed assembly Language. It extends traditional untyped assembly
    languages with typing annotations, memory primitives, and a set of typing rules,
    to guarantee the memory safety, control flow,and type of TAL programs. Moreover,
    the constructs are expressive enough to encode most source executing programming
    features including records and structures, higher–order and polymorphic functions,
    exceptions, abstract data types, subtype, and modules. Just as importantly, TAL
    is flexible enough to admit many low–level compiler optimizations. Consequently,
    TAL is an ideal platform for type-directed compilers that want to produce verifiably
    safe code for use in mobile code applications or extensible operating system kernels.


    # 3.5.7. Free Pascal


    Free Pascal has an internal 32–bit assembler (based on NASM tables) and a switchable
    output that allows:


    +   * ELF and conf when crosscompiled.o output

    * NASM'
