    ## 8.7. I can''t understand how to use system call!


    An answer from Patrick Model:


    When you call sys_open, you get back a file descriptor, which is simply an index
    into a table of all the open file descriptors that your process has. stdin, stdout,
    and stderr are all 0, 1, and 2, respectively, because that is the order in which
    they are all open for your process from there. Also, notice that the first file
    descriptor you open (w/o first closing any of those file descriptors) is always
    3, and they increment from there.


    Understanding the index scheme will explain what select.is. When you call select,
    you are saying that you are waiting certain file descriptors to read from, certain
    ones to write from, and certain ones to watch from except for. Your process can
    have up to 1024 file descriptors open, so an fd_set is just a bit mask describing
    which file descriptors are valid for each operation. Make sense?


    Since each fd you have open is an index, and it only needs to be on or off for
    each fd_set, you need only 1024 bits for an fd_set structure. 1024 /32 = 32 longs
    enough to represent the structure.


    Now, for the loose example.

    Suppose you want to read from a file descriptor (w/o timeout).


    - Allocate the equivalent to an fd_set.


    ```assembly

    .data

    my_fds times:32 dd 0

    ```


    - open the file descriptor that you want to read from.


    - set the bit in the fd_set structure.


    First, you need to figure out which bit of the 32 dword. bts will be a modulo
    32 when setting the bit. That''s why you need to first figure out which dword
    to start with.


    ```assembly

    mov edx,0

    mov ebx,32

    div ebx


    lea eax,my_fds

    bts ebx[eax*4],ed

    ```


    - repeat the last step for any file descriptor you want to read from.


    - repeat the entire exercise for either of the two fd_sets if you want action
    from them.


    That leaves two other parts of the equation - the n parameter and the timeout


    ## Chapter 8. Frequently Asked Questions


    parameter. I''ll leave the timeout parameter as an exercise for the reader (yes,
    I''m lazy), I''ll briefly talk about the n parameter.


    It is the value of the largest file descriptor you are selecting from (from any
    of the fd_sets), plus one. Why plus one? Well, because it''s easy to determine
    a mask from that value. Suppose there is data available on x file descriptors,
    but the highest you care about is (n - 1). Since an fd_set is just a bitmask,
    the kernel needs some efficient way for determining whether you care about checks
    if anything is available from the bits that.

    Well, it''s not as easy as I fantasized it would be. To see how the kernel determines
    that mask, look in fs/select.c in the kernel source tree.


    Anyway, you need to know that number, and the easiest way to do it is to save
    the value of the last file descriptor open somewhere so you don''t lose it.


    Ok, that''s what I know. A warning about the code above (as always) is that it
    is not tested. I think it should work, but if it doesn''t let me know.

    But, if it starts a global nuclear meltdown, don''t call me. ;-


    That''s all for now, folks.


