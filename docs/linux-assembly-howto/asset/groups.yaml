    # 8.1. How do I graphics programming in Linux


    An answer from Paul Further:


    > You have a number of options to graphics in Linux. Which one you use depends
    on what you want to do. There isn''t one Web site with all the information but
    here are some tips:

    GALib: This is a C library for console SVGA.

    Pros: very easy to learn, good coding examples, not all that different from equivalent
    gfxx libraries for DOS, all the effects you know from DOS can be converted with
    little difficulty.

    Cons: need special rights to run since they write directly to the hardware, doesn''t
    work with chipsets, can run under X-Windows.

    Search for svgalib-1.4x on http://ftp.isco.za

    Framebuffer: Do it yourself graphics at SVGA res

    Pros: fast, linear mapped video access, ASM can be used if you want :

    Cons: has to be compiled into the kernel, chipset-specific issues, must switch
    out of X to run, relies on good knowledge of linux system calls and kernel, tough
    to debug

    Example: (http://www.linuxassembly.org/) and the leaves example and my own site
    for framebuffer code and tips in asm (http://ma.verick.co/linuxx/)

    Xlib: The access control and development libraries for XFree86.

    Pros: Complete control over your X application

    Cons: Difficult to learn, horrible to work with and requires a bit of knowledge
    to how X works at the low level.

    Not recommended if you''re really masochistic for it. All the include and file
    libs are probably installed already so you have what you need.

    Low-level APIs: include PTC, SGI, and Clanlib

    Pros: very flexible, run under X or the console, generally abstract away video
    hardware a little so you can draw a linear surface, lots of good coding examples,
    can link to other APIs like OpenGL and sound libs, Windows DirectX versions for
    free

    Cons: Not as fast as doing it yourself, even in development so versions (can change
    frequently)

    Examples: PTC and SGI have excellent demos, SDL is used in sdlQuake,

    Myth II, Civ CTP and Clanlib have been used for games as well.


