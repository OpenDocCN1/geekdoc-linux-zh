    # Linux Assembly HOWTO


    Find lots of useful examples in the linux/include/asm-i386/subdirectory of the
    sources for the Linux kernel.


    # 3.1.3. Invoking GCC to build proper inline assembly


    Because assembly routines from the kernel heads (or your own heads, if you are
    making your assembly programming clean as it is in the kernel) are embedded in
    extern functions. GCC must be invoked with the -O flag (or -O2, -O3, etc), for
    these routines to be available. If not, your code may compile, but not link properly;
    since it will be looking for non-inline extern functions in the libraries against
    which your program is being linked! Another way is to link against libraries that
    fallback versions of the routines.


    Inline assembly can be disabled with -fno-asm, which will have the compiler die
    when using extended inline syntax, or generate calls to an external function named
    asm() that the linker can resolve. Counter counter flag; -fasm restores treatment
    of the asm keyword.


    More generally, consider good flags for GCC on the x86 platform


    ```

    gcc -O2 -fomit-frame-pointer -W -Wall

    ```


    -O2 is the good optimization level in most cases. Optimizing besides takes more
    time, and yields code that is much larger, but only a bit faster; over-optimization
    might be useful for tight loops only (if any), which you may be doing in assembly
    anyway. In cases when you really need compiler optimization for a few files, consider
    using up to -O6.


    -fomit-frame-pointer allows generated code to skip the stupid frame pointer maintenance,
    which makes code smaller, and frees a register for further optimizations. It precludes
    the easy use of debugging tools (gdb), but when you use these, you don''t just
    care about size and speed anymore.


    -WWall enables all useful warnings and helps you to catch any stupid errors.

    You can add CPU-specific -m486 or such flag so that GCC will produce code that
    is more adapted to your CPU. Note that GCC has -mpentium and such flags (GCC has
    even more), whereas GCC 2.7 and older versions do not. A good choice of CPU-specific
    flags should be used in the Linux kernel. Check the TexInfo documentation of your
    GCC installation for.


    -m386 will optimize for size, hence also for computers whose memory is tight and/or
    loaded, since big programs cause swap, which counts more than “optimization” intended
    by the larger code. In these settings, it might be useful to stop using GCC, and
    use a language that allows code factorization, such as a functional language and/OR
    FORTH, and a bytecode- or wordcode- based implementation.


    Note that you can vary code generation from file to file, performance—critical
    files will use maximum optimization, whereas other files will be optimized for
    size.


    To optimize more, option -mrearg=2 and/or corresponding function attribute might
    help bit, but solve lost of problems when linking to foreign code, including like.
    There are ways to correctly declare foreign functions so the right call sequence
    be generated, or you might want to reconcile the foreign libraries to use the
    same register-based calling convention...


    Note that you can add these flags the default by editing file


