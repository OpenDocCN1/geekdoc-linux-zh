    # Chapter 1. Introduction


    You can skip this chapter if you are familiar with HOWTOs, or just hate to read
    all this assembly-unrelated crap.


    ## 1.1. Legal Blurb


    Permission is granted to copy, distribute and/or modify this document under the
    terms of the Free GNU Documentation License Version 1.1; with no Invariant Sections,
    with no Front-Cover Texts, and no Back-Cover copies. A copy of the license is
    included in the GNU Free Documentation License appendix.


    The most recent official version of this document is available from the Linux
    Assembly LDP sites. If you are reading a few-months-old copy, consider checking
    above URLs for a new version.


    ## 1.2. Foreword


    This document aims answering questions of those who program or want to program
    32-bit x86 assembly using free software, particularly under the Linux operating
    system. At many places Universal Resources (URL) are given for some software or
    documentation repository. This document also points to other documents about non-free,
    non-32-bit assemblies, although this is not your primary goal. Also note that
    there are FAQs and docs about programming on your favorite platform (whatever
    it is), which you should consult for platform-specific issues, not related to
    assembly programming.


    Because the main interest of assembly programming is to build the guts of operating
    systems, interpreters, compilers, and where C compiler fails to provide the needed
    extensibility (performance is more and more seldom as issue), we are focusing
    on development of such kind of software.


    If you don''t know free software is, please do read carefully the GNU General
    Public License (GPL or copyleft), which is used in a lot of free software, and
    the model for most of their licenses. It generally comes in a file named COPYING
    (or COPYING.LIB). Literature from the Free Software Foundation (FSF) might help
    you too. Particularly, the interesting feature of free software is that it comes
    with code source which you can consult and correct, or sometimes even borrow from.
    Read your particular license carefully and do comply to it.


    ## 1.3. Contributions


    This is an interactively evolving document: you are especially invited to ask
    questions, to answer questions, to give correct answers, to point pointers to
    new software, to point the current maintainer to bugs or deficiencies in the pages.
    In one word, contribute!


    To contribute, please contact the maintainer.


    > At the time of writing, it is Konstantin Boldys and no more François-Rena Ribeiro
    (since 0.5). I (Fare) have been looking for some time for a serious hacker to
    replace me as maintainer of this document, and am pleased to announce Konstantin
    as my worthy successor.


    ## 1.4. Translations


    Korean translation of this HOWTO is available at http://kldp.org/HOWTO/html/Assembly-HOWTO/.
    Also, there was French translation of the early HOWTO versions, but I couldn''t
    find it now.


    ## Chapter 2. Do you need assembly?


    Well, I wouldn''t want to interfere with what you''re doing, but here is some
    advice from the hard-earned experience.


    ### 2.1. Pros and Cons


    ### 2.1.1. The advantages of Assembly


    Assembly can express very low-level things:


    - you can access machine-dependent registers and I/O

    - you can control the code behavior in critical sections that might otherwise
    inline deadlock between multiple software or hardware devices

    - you can break the conventions of your usual compiler, which might allow some
    optimizations (like temporarily breaking rules about memory allocation, threading,
    calling conventions, etc)

    - you can build interfaces between code fragments using incompatible conventions
    (e.g. produced by different compilers, or separated by a low-level interface)

    - you can get access to unusual programming of your processor (e.g. 16 bit mode
    to interface startup, firmware, or legacy code on Intel PCs)

    - you can produce reasonably fast code for tight loops to cope with a bad non-optimizing
    compiler (but then, there are few optimizing compilers available!)

    - you can produce optimized code perfectly tuned for your particular hardware
    setup, though not to someone else''s

    - you can write some code for your new language''s optimizing compiler (that is
    something what very few will ever do, and even if they not)

    - i.e. you are in complete control of your code


    ### 2.1.2. The disadvantages of Assembly


    Assembly is a very low-level language (the lowest above hard-coding the binary
    instruction patterns). This means


    - it is long and tedious to write initially

    - it is quite bug-prone

    - your bugs can be very difficult to chase

    - your code is difficult to maintain

    - the result is non-portable to other architectures: existing or upcoming

    - your code will be optimized only for a certain implementation of the same architecture:
    for instance, Intel-compatible platforms each CPU design and its variations (relative
    latency), output-throughput, and capacity, of processing units, caches, RAM, bus,
    disks, presence of FPU, MMX, 3D, SIMD extensions, each potentially different optimization
    techniques. CPU designs include: Intel 386, 486, Pentium, PPro, PIII, PIV, Pentium
    V; Cyrix 5x86, x862, M2; AMD K5, K6 (K2–III), K7 (Athlon, Duron). New designs
    keep popping up, so don''t expect this list or code to be up-to-date.

    - you spend more time on a few details and can''t focus on small and large algorithmic
    design, that are very known to bring the largest part of the speed up (e.g. you
    might spend time writing fast list/array manipulation primitives in assembly;
    only a hash table would have sped up your program much more; or, in another context,
    a binary tree; or some high–level structure distributed over a cluster of CPUs)

    - a small change in algorithmic design might completely invalidate all your existing
    assembly code. So that you''re ready (and able) to rewrite it, or if you''re tied
    to a particular algorithmic design

    - On that it ain''t too far from what''s in standard benchmarks, commercial optimizing
    compilers outperform hand-coded assembly (well, that''s less true on the x86 architecture
    than on RISC architectures, and perhaps less true for widely available/free compilers;
    anyway, for C code, GCC is fairly good);

    - And in any case, as moderator John Levine on comp.compilers,


    ```

    "compilers make a lot easier to use complex data structures, and compilers don''t
    get bored halfway through and generate reliably pretty good code."

    ```


    They will also correctly propagate code transformations throughout the whole (huge)
    program optimizing code between procedures and module boundaries.


    ### 2.1.3. Assessment


    In all you, you might find that using assembly is sometimes needed, and might
    even be useful in a few cases where it is not, you''ll want to:


    - minimize use of assembly code

    - encapsulate this code in well-defined interfaces

    - have your assembly code automatically generated from patterns expressed in a
    higher–level language than assembly (e.g. GCC inline assembly)

    - have automatic tools to translate these programs into assembly code

    - have this code optimized if possible

    - All of the above, i.e. write (an extension) to an optimizing compiler back–end.


    Even when assembly is needed (e.g. OS development), you''ll find that not much
    of it is required, and the above principles remain.


    The Linux kernel sources concerning this: little assembly as needed, resulting
    in a fast, reliable, portable, maintainable OS. Even a successful game DOOM was
    almost massively written in C, with a tiny part being written in assembly for
    speed up.


    ## 2.2. How to NOT use Assembly


    ### 2.2.1. General procedure to achieve efficient code


    As says Charles Fitman on comp.compilers about human vs computer–generated assembly
    code:


    > The human should always win and here is why.


    First the human writes the whole thing in a high level language.

    Second he profiles to find the hot spots where it spends its time.

    Third he has the compiler produce assembly for those small sections of code.

    '
