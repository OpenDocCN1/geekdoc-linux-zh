    \ DirectX versions for free\n> Cons: Not as fast as doing it yourself, even in\
    \ development so versions (can change frequently)\n> Examples: PTC and SGI have\
    \ excellent demos, SDL is used in sdlQuake, Myth II, Civ CTP and Clanlib have\
