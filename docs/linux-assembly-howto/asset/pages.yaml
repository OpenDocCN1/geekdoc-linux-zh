    # 2.3. Linux and assembly


    You probably noticed, in general case you don''t need to use assembly language
    in Linux programming. Unlike DOS, you do not have to write Linux drivers in assembly
    (well, actually you can do it if you really want). And with modern optimizing
    compilers, if you are care of speed optimization for different CPUs, it''s much
    simpler to write in C. However, if you''re reading this, you might have some reason
    to use assembly instead of C/C++.


    You may need to use assembly, or you may want to use assembly. In short, main
    practical (need) reasons of diving into the assembly realm are small code and
    libc independence. Practical (want), and the most often reason is just an old
    crazy hacker, who has twenty years old habit of doing everything in assembly.


    However, if you''re porting Linux to some embedded hardware you can be quite short
    at the size of whole system: you need fit kernel, libc and all that stuff of (filefindtext[shjlec.)
    utils until several hundreds of kilobytes, and every kilobyte costs much. One
    of the possible ways is to rewrite (or all) parts of system in assembly, and,
    and this will really save you a lot of space. For instance, a simple httpd written
    in assembly can take less than 600 bytes; you can fit a server consisting of kernel,
    httpd and ftpd in 400 KB or less... Think about it.'
