  md: '# Chapter 5. Calling conventions


    # 5.1. Linux


    # 5.1.1. Linking to GCC


    This is the preferred way if you are developing mixed C–asm project. Check GCC
    docs and examples from Linux kernel .S files that go through gas (not that go
    through as86).


    32-bit arguments are pushed down in reverse syntactic order (hence accessed/popped
    in the right order), above the 32-bit return address. %ebp, %esi, %edi, %ebx are
    callee-saved, other registers are caller-saved; %eax is to hold the result, and
    %edx :eax for 64–bit results.


    FP stack: I am sure, but I result is in st (0), however stack callee-saved. The
    SVR4 i36 ABI specs at http://www.caldera.com/developer/specs is a good reference
    point if you want more details.


    Note that GCC has options to modify the calling conventions by reserving registers,
    having arguments in registers, not assuming the FPU, etc. Check the i386 .info
    pages.


    Beware that you must declare the cdecl and regparam(0) attribute for a function
    that will follow standard GCC calling conventions. See C Extensions::Extended
    As:: section from the GCC pages. Also how Linux defines itsasm macro..


    # 5.1.2. ELF vs a.out problems


    Some compilers prepend an underscore before every symbol, while others do not.


    Particularly, Linux a.out GCC does such preceding, while Linux ELF GCC does not.


    If you need to cope with both behaviors at once, we have existing packages de.
    For instance, get an old Linux source tree, the Elk, threads, or OCaml...


    You can also override the implicit C->asm renaming by inserting statements like


    ```

    void foo asm("bar");

    ```


    to be sure that the function foo () will be called bar in assembly.


    Note that the objcopy utility from the binutils package should allow you toto
    transform your a.out objects into ELF objects, and perhaps the contrary too, in
    some cases. More generally, it will do lots of file format conversions.


