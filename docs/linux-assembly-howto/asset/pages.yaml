  md: '# 4.1.3. Macroprocessing with your own filter


    You can write your own simple macro–expansion filter with the usual tools: perl,
    awk, sed, etc. It can be made rather quickly, and you control everything. But,
    of course, power in macroprocessing implies the "hard way".


    # 4.2. Metaprogramming


    Instead of using an external filter that expands macros, one way to do things
    is to write programs that part or all of other programs.


    For instance, you could use a program outputting source code


    +   * to generate sine/cosine/whatever lookup tables,

    * to extract a source–form representation of a binary file,

    * to compile your bitmaps into fast display routines,

    * to extract documentation, initialization/finalization code, description tables,
    as well as normal code from the same source files,

    * to have customized assembly code, generated from a perl/shell/scheme script
    that does arbitrary processing,

    * to propagate data defined at one point only into several cross-referencing tables
    and chunks.

    * etc.


    Think about it


    # 4.2.1. Backends from compilers


    Compilers like GCC, SMI/NJ, Objective CAML, MIT–Scheme, CMUCL, etc., do have their
    own generic assembler back, which you might choose to use, if you intend to generate
    code semi-automatically from the according languages, or from a language you have:
    rather than write great assembly code, you may instead modify a compiler so that
    it dumps great assembly code!


    # 4.2.2. The New–Jersey Machine–Code Toolkit


    There is a project, using the programming language Icon (with an experimental
    ML version), to build a basis for producing assembly–manipulating code. See around
    http://www.eecs.harvard.edu/~nr/toolkit/


    # 4.2.3. TUNES


    The TUNES Project for a Free Reflective Computing System is its own extension
    as an to the Scheme language, as part of its development process. It doesn’t run
    at yet, though help is welcome.


    The assembler translates abstract syntax trees, so it could easily serve the basis
    for a syntax translator, a disassembler, a common assembler/compiler back–end,
    etc. Also, the full power of a real language, Scheme, make it unchallenged as
    for macroprocessing/metaprogramming.'
