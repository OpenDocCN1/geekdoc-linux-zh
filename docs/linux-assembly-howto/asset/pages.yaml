  md: '# Chapter 3. Assemblers


    # 3.1. GCC Inline Assembly


    The well-known GNU/C++ Compiler (GCC), an optimizing 32–bit compiler at the heart
    of GNU project, supports the x86 architecture quite well, the ability to insert
    assembly code in C programs, in a way that register allocation deallocation can
    either be specified or left to GCC. GCC works on most available platforms, notably
    Linux, *BSD, VSta, OS/2, *DOS, Win*, etc.


    The original GCC site is the GNU FTP site /prep.ai.mit/pub/gnu/gcc/ together with
    all released software from the GNU project. Link-compiled and pre–compiled versions
    can be found in ftp/metalab.unc.edu/pub/linux/GCC There are a lot of mirrors of
    both sites everywhere around the world, as well as CD-ROM copies.


    GCC development has split into two branches time ago (GCC 2.8 and EGCS), but they
    merged, and current GCC webpage is http://gcc.gnu.org.


    Sources adapted to your favorite OS and pre–compiled binaries should be found
    at your usual FTP sites.


    DOS port of GCC is called DJGPP.


    There are two Win32 GCC ports: cygwin and mingw


    There is also an OS/2 port of GCC called EMX; it works under DOS too, and includes
    lots of unix-emulation library routines. Look around the following site: ftp/ftp-os2.cdrom/pub/os2/emx099c.


    # 3.1.2. Where to find docs for GCC Inline ASM


    The documentation of GCC includes documentation files in TexInfo format. You can
    compile them with TeX and print result, or convert them to .info, and browse them
    with emacs, or convert them to .html, or whatever you like; (with the right tools)
    to whatever you like, or just read as is. The .info files are generally found
    on any installation of GCC.


    The right section to look for is C Extensions::Extended ASM:


    Invoking DJGPP::Submodel Options::i86 Options::might help too. Particularly


    The DJGPP Games resource (not only for game hackers) had page specifically about
    assembly, but it''s down. Its data has nonetheless been recovered on the DJGPP
    site, that contains a mine of other useful information: http://www.delorie.com/djgpp/doc/breman/,
    and in the DJGPP Quick ASM Programming Guide.


    GCC depends on GAS for assembling and its syntax (see below); do mind that inline
    asm needs characters to be quoted, they will be passed to GAS. See the section
    about GAS below.'
