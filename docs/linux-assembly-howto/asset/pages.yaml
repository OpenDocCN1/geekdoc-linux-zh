    # 2.2.2. Languages with optimizing compilers


    Languages like ObjectiveCAML, SML, CommonLISP, Scheme, ADA, Pascal, C++, among
    others, all free optimizing compilers that will utilize the bulk of your programs,
    and often better than hand–coded assembly for tight loops, allowing you to focus
    on higher-level details, and without forbidding you to grab a few percent of extra
    performance in the above–mentioned worry, once you''ve reached a stable design.
    Of course, there are also commercial optimizing compilers for most of these languages,
    too!


    # 2.2.3. General procedure to speed up your code


    For speeding code up, you should do it for parts of a program that a profiling
    tool has consistently identified as being a bottleneck.


    Hence, if you use some code portion as being too slow, you should


    +   - first try to use a better algorithm;

    - then try to compile it rather than interpret it;

    - then try to enable and tweak optimization from your compiler;

    - then give the compiler hints about how to optimize (typing information in LISP;
    register usage with GCC; lots of options in most compilers, etc.);

    - then possibly fallback to assembly programming


    Finally, before you end writing assembly, you should inspect generated code, to
    check the problem is really with bad code generation, as this really not be the
    case: compiler-generated code might be better than what you''ve written, particularly
    in modern multi-pipelined architectures! Slots of a program might be intrinsically
    so. The biggest problems on modern architectures with fast processors are due
    to memory access, cache–misses, TLB–misses, and page–faults; register optimization
    becomes useless, and you''ll more profitably rethink data structures and threading
    to achieve better locality in memory access. A completely different approach to
    the problem might help, then,


    # 2.2.4. Inspecting compiler-generated code


    There are many reasons to inspect compiler-generated assembly code. Here is what
    you''ll do with such code:


    +   - whether generated code can be enhanced with hand–coded assembly (or by tweaking
    switches)

    - when that''s the case, start from generated code and modify it instead of starting
    from scratch

    - more generally, use generated code as stubs, which at least gets right the way
    your assembly routines to the external world

    - track bugs in your compiler (hopefully the rarer)


    The standard way to have assembly code generated is to invoke your compiler with
    the –S flag. This works


    Chapter 2. Do you need assembly?'
