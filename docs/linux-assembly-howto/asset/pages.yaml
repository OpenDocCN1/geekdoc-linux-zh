  md: "# Linux Assembly HOWTO\n\n# 8.3. Any other useful debugging tools?\n\nDefinitely\
    \ strace can help a lot (ktrace kdump on FreeBSD), it is used to trace system\
    \ calls and signals. Read its manual page (man strace) and strace --help output\
    \ for details.\n\n# 8.4. How do I access BIOS functions from Linux (BSD, BeOS,\
    \ etc)?\n\nShort answer is -- now. This is protected, use OS services instead.\
    \ Again, you can't int 0x10, int 0x13. Fortunately almost everything can be implemented\
    \ by system calls or library functions. In the worst case you may go through direct\
    \ access, or make a kernel patch to implement functionality, or use LRMI library\
    \ to access BIOS functions.\n\n# 8.5. Is it possible to write kernel modules in\
    \ assembly?\n\nYes, indeed it is. While in general it is not a good idea (it would\
    \ wildly anything), there may be a need of such wizard. The process of writing\
    \ a module itself is not that hard — a module must have some predefined global\
    \ function, it may also need to call some external functions from the kernel.\
    \ Examine kernel source (that can be built as module) for details.\n\nMeanwhile,\
    \ here's an example of a minimum kernel module (module.asm) (source is based on\
    \ example by mammoth_ API #8):\n\n```\nsection .text\n\nglobal init_module\nglobal\
    \ cleanup_module\nglobal kernel_version\n\nextern printk\n\ninit_module:\n   \
    \ push    db str1\n    call    printk\n    pop     eax\n    xor     eax, eax\n\
    \    ret\n\ncleanup_module:\n    push    db str2\n    call    printk\n    pop\
    \     eax\n    ret\n\nstr1    db      \"init_module done\",0xa,0\nstr2    db \
    \     \"cleanup_module done\",0xa,0\n\nkernel_version  db      \"2.18\",0\n```\n\
    \nThe only thing this example shows is reporting its acts. Modify kernel_version\
    \ to match yours, and build with:\n\n```\n$ nasm -f elf -o module.m module.asm\n\
    \n$ ld -r -o module.o module.m\n```\n\nChapter 8. Frequently Asked Questions"
