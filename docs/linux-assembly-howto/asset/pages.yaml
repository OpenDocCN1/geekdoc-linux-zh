  md: "# Linux Assembly HOWTO\n\nNow you can play with it using insmod/rmmod/lsmod\
    \ (root privileged are required); a lot of fun, huh?\n\n# 8.6. How do I allocate\
    \ memory dynamically?\n\nA laconic answer from H–Peter Reckwald:\n\n```\nebx :=\
    \ 0                (in fact, any value below .bss seems to do)\nsys_brk\neax \
    \   := current top (of .bss section)\n\n\n\n\n\nebx := [ current top < ebx < (esp\
    \ - 16K) ]\nsys_brk\neax    := new top of  .bss\n```\n\nAn extensive answer from\
    \ Tiago Gasiba:\n\n```\nsection .bss\n\nvarl resb 1\nsection .text\n\n;\n;allocate\
    \ memory\n;\n%define LIMIT 0x04000000      ; about 100Megs\nmov      ebx,0   \
    \                ; get bottom of data segment\ncall     sys_brk\n\ncmp      eax,-1\
    \                  ; ok?\nje       errol\n\nadd      eax,LIMIT              ;\
    \ allocate +LIMIT memory\nmov      ebx,eax\ncall     sys_brk\n\ncmp      eax,-1\
    \                  ; ok?\nje       errol\n\nncmp      eax,varl+1             ;\
    \ has the data segment grown?\nje       errol\n\n;\nuse allocated memory\n;\n\n\
    mov      ebx,eax                ; now eax contains bottom of\nmov      ebax,varl\
    \               ; data segment\nrepeat:                         ; save bottom\n\
    \      mov      ebax\nmov      word  [eax],1          ; fill up with 1's\ninc\
    \      eax                 ; eax-beginning of data\ncmp      ebx,eax         \
    \    ; current pos = bottom\njne      repeat\n\n;\n;free memory\n;\n```\n\n# Chapter\
    \ 8. Frequently Asked Questions"
