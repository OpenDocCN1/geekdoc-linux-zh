  md: "# Chapter 4. Metaprogramming\n\nYou should use the appropriate tool for the\
    \ right task, so don't choose assembly when it does not fit; C, OCaml, perl, Scheme,\
    \ might be a better choice in the most cases.\n\nHowever, there are cases when\
    \ these tools do not give enough control over the machine, and assembly is useful\
    \ or needed. In these cases you'll appreciate a system of metaprogramming and\
    \ metaprogramming that allows recurring patterns to be factored into one indefinitely\
    \ reusable definition, which allows safer programming, automatic propagation of\
    \ pattern modification, etc. Plain assembler often is not enough, even when one\
    \ is doing only small routines to link with C.\n\n# 4.1. External filters\n\n\
    Whatever is the macro from your assembler, or whatever language you use (even\
    \ C!), if the language is not expressive enough to you, you can have files passed\
    \ through an external filter with a Makefile like that:\n\n```\n.%s:\n    %.S\
    \ other_dependencies\n    $(FILTER) $(FILTER_OPTIONS) < $ > $@\n```\n\n# 4.1.1.\
    \ CPP\n\nCPP is truly too expressive, but it's enough for easy things, it's standard,\
    \ and called transparently by GCC.\n\nAs an example of its limitations, you can't\
    \ declare objects so that destructors are automatically called at the end of the\
    \ declaring block; you don't have diversions or scoping.\n\nCPP comes with any\
    \ C compiler. However, considering how mediocre it is, stay away from it if by\
    \ chance you can make it without C.\n\n# 4.1.2. M4\n\nM4 gives you the full power\
    \ of metaprogramming, with a Turing equivalent language, recursion, regular expressions.\
    \ You can do it with everything that CPP cannot.\n\nSee macro4th (this4th) and\
    \ the Tuples 0.0.25 as examples of advanced metaprogramming using m4.\n\nIts dysfunctional\
    \ quoting and quoting semantics forces you to use explicit continuation-passing\
    \ tail-recursive macro style if you want to do advanced macro programming (which\
    \ is remind of TeX — BTW, has anyone tried to use TeX as a macroprocessor for\
    \ anything other than typesetting?). This is Not worse than CPP that allows quoting\
    \ and recursion anyway.\n\nThe right version of M4 is GNU m4 1.4 (or later exists),\
    \ which has the most features and the least bugs or limitations of all. m4 is\
    \ designed to be slow for the simplest uses, which might still be ok for most\
