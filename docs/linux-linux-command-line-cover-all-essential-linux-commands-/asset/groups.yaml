    # Chapter 1


    # Introduction to Linux


    ## About Linux Operating System


    Linux is a Unix-like and mostly POSIX-compliant computer operating system assembled
    under the model of free and open-source software development and distribution.


    Linux usually works as a server, because of its stability and security''s feature.


    Linux programs are extremely advantageous:


    - Linux programs are free, you''ll see, most of Linux programs are.

    - They are frequently updated and for Zero charge! Some of them are better than
    those in windows. And other doesn''t even exist in windows!


    If Linux is free and almost all their softwares are free, it is for a reason;
    to understand we have to go back to 1984.


    ## 1984


    So we are back in 1984, computer science was not very developed. Microsoft has
    just launched its first os: MS-DOS, but this one is far away from being done.


    But, was MS-DOS the only one then?


    No! There was other operating system but less known by the public.


    The one that was called the best was "Unix". It was a lot powerful than MS-DOS
    but a lot complicated, what explains that only the professionals could use it.


    Graphically UNIX looked a lot like MS-DOS they were both seen like a black screen
    with some white text in it. We must say that computers back then were not capable
    of doing better.


    # GNU Project


    It is just in 1984, that Richard Stallman created GNU project. The GNU Project
    is free software, mass collaboration project, announced on 27 September 1983,
    by Richard Stallman at MIT. Its aim is to give computer users freedom and control
    in their use of their computers and computing devices, by collaboratively developing
    and providing software that is based on the following freedom rights: users are
    free to run the software, share it (copy, distribute), study it and modify it.
    GNU software guarantees these freedom-rights legally (via its license), and is
    therefore free software; the use of the word "free" always being taken to refer
    to freedom.


    Richard Stallman was a researcher in Artificial intelligence in MIT. He wanted
    to create an operating system based on UNIX (the commands still the same).


    But why would he create a copy of "UNIX"? Because UNIX was not free and it was
    getting more expensive! Richard Stallman wanted to react by creating a free alternative:
    the GNU was born.


    # GNU is an open operating system


    GNU should not only be a free OS; it also had to be "open" What is the difference?

    A free program is a program where you can have the source code, that is to say,
    the "batch recipe." In contrast, Windows is a proprietary OS whose source code
    is stored by Microsoft. Imagine it''s like Coca-Cola: nobody knows the recipe
    (there are many people who try to imitate it, but hey ...). So we cannot change
    it or see how it works inside.

    an open program is mostly a free program, it is also a program that has the right
    to copy, modify, redistribute. It''s a real ideology in computer science: people
    think it is better to give the source code of the programs that we create because
    it allows knowledge sharing and helps the computer to evolve faster. The slogan
    of the Free World might be: "Unity is strength."


    # Linus Torvalds is doing his hobby


    In 1991, Linus Torvalds, a student at the University of Helsinki (Finland), began
    creating his free own operating system. This system became known as Linux, referring
    to the name of its creator (Linux is a contraction of Linus and UNIX).

