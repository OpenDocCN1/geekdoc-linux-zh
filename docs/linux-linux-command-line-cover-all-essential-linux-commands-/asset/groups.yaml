    # The command history


    We often need to find a command that was typed there five minutes (or even five
    seconds). Sometimes it is because we have forgotten the command, but it''s often
    because you like really too lazy to rewrite the entire command.


    This shortcut is gold: press the Up arrow key; you will see the last command you
    typed.


    If you press again the directional arrow key, you will see the penultimate command,
    then the second-to-last, etc.


    If you press the Down arrow key, you will return to the most recent commands.


    Thus I can successively find the commands I just type in reverse command:


    - --all;

    - -a,

    - Is;

    - Date;

    - Etc.


    If you want to "go" very far back into the history of your commands, no need to
    type a hundred times on the directional arrow Top like madmen.


    There is the history command that reminds you of the command history:


    Example:


    Press the Up arrow key; you will see the last command you typed. Then the screen
    will display:


    Date 152 Is Is Is 153 154 155--all -a 156 157 history


    You will notice that the controls are numbered: thus, we can know that date is
    the 152nd command I typed into the

