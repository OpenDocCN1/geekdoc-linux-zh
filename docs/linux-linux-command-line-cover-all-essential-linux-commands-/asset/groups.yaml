    ## 关于参数


    参数是写在命令后面的选项。


    命令和参数之间用空格分隔，如下：


    ```

    user2014 @ user-linux: ~ $ command parameters

    ```


    参数本身可以包含空格、字母、数字……真的包含了各种内容。关于设置方法没有真正的规则，但幸运的是程序员们采用了某种“约定”，以便我们识别不同类型的参数。


    ### 短参数（单字母）


