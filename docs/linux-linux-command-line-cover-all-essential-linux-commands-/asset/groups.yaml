    ## 关于 Linux 命令


    命令的典型语法看起来如下：


    ```

    command --option argument

    ```


    或者


    ```

    command parameter

    ```


    让我们来看一些命令和参数的示例：


    ## 示例：


    输入“date”并按回车键。


