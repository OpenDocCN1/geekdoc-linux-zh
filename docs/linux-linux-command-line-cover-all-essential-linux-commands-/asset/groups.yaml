    # Linus Torvalds, creator of Linux


    What relationship with GNU? Well it turns out that these two projects were complementary:
    while Richard Stallman created the basic programs (program file copy, delete,
    file, text editor), Linus had embarked on the creation of the "heart" an operating
    system kernel.


    The GNU (free programs) and Linux (OS kernel) project merged to create GNU / Linux.


    Theoretically, we should talk about GNU / Linux. But it is a bit difficult to
    write and pronounce, and by abuse of language, we often say just "Linux". This
    is why I continue to speak of "Linux" in the rest of the book, even though the
    politically correct name is "GNU / Linux" because it is the merger of two complementary
    projects.


    # Original operating systems


    You should now have a better idea of the origin of the three major operating systems
    that exist today: Mac OS, Linux and Windows.


    Thus, Mac OS and Linux are both based on UNIX, the ancestor of operating systems,
    while Windows, from MS-DOS is a separate branch. Overall, this is all you need
    to remember.


    It is said that Mac OS and Linux are based on UNIX because they have "copied"
    its operation. It''s not quite pejorative, it''s quite the opposite: it''s been
    an honor to UNIX.


    Linux programs do not use all the same source code as UNIX (it was also the owner,
    so private). They have been completely rewritten but work the same way.


    If I told you all this is because I believe that knowing the origin of Linux is
    important. This will help you understand many things thereafter.


    # Linux distributions


    A Linux distribution (often called distro for short) is an operating system made
    as a collection of software based around the Linux kernel and often around a package
    management system. The most well known distributions are RedHat, SUSE, Debian,
    Mandriva, Slackware and Ubuntu. You can find much different software and are hundreds
    of different ways to install it.


    To make life easier for users and allow them to make a choice, different Linux
    distributions were created. This is a concept that does not really exist in Windows.
    It''s like the difference between Windows 7 Home and Windows 7 Professional, but
    it goes much further than that.


    Here''s what can differ from one distribution to another:


    - Installation: it can be greatly simplified as very complicated;

    - Installing management programs: If it is done well and centralized, it can make
    the installation of new software simpler than Windows, as discussed further!

    - The preinstalled programs on your computer (e.g. Windows is bundled with Internet
    Explorer and Windows Media Player).


    In fact, distribution is somehow packing Linux. The heart itself remains the same
    for all distributions.


    Whichever distribution you install, you get a Linux compatible with others. Some
    distributions are just more or less easy to handle. :-)


    # Various existing distributions


    There are many different Linux distributions. Hard to choose, you will say: indeed,
    the first time it is unclear what to choose ... especially since all are free!
    Do not worry, I''ll help you make your choice.


    I will not list all existing distributions, but here at least the main ones:


    - Slackware: one of the oldest Linux distributions. It still exists today!

    - Mandriva: published by a French company, it is simple to use;

    - RedHat: published by an American company, this distribution is known and widespread,
    especially on servers;

    - SUSE: Novell published by the company;

    - Debian: Debian distribution alone which is managed by independent developers
