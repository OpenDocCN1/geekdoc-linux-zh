    The error message begins with the name of the program that encountered the error—your
    interactive shell. The dash (- ) in front of the shell''s name was put there by
    login to tell the shell that it is a login shell, which is how it knows that it
    is supposed to process /etc/profile, ~/.profile, and your environment file.


