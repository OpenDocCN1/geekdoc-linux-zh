    # 3.1.3 PIPELINES (U)


    When UNIX was first introduced, its shell''s pipeline facility was seen as one
    of

    of most innovative features, a feature that shaped the use of the operating sys-

    tem in profound ways.


    Many utility programs, called filters, were written to read data (almost always

    text) from stdin, manipulated the data, and wrote results to stdout. Each filter

    was designed to just do one thing,and users would connect sequences of filters

    together, called pipelines, to create customized tools to meet their needs.


    You''ve already created some simple pipelines in this chapter, such as the one

    that counted the number of built-in commands and the one that kept the list of

    built-in commands from scrolling off the screen.


    In this exercise, you''ll practice using some "classic" UNIX filters in a pipeline.


