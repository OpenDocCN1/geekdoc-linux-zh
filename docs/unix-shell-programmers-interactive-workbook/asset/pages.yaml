- pgno: 275
  md: '# LAB 6.1


    # TYPED VARIABLES AND SCOPE


    | LAB OBJECTIVES |

    | After this lab, you will be able to:

    | - Declare Variables and Assign Values

    | - Write Arithmetic Expressions

    | - Use Arithmetic Expansion

    | - Control the Scope of Variables |


    Before you start writing “real” scripts, it''s a good idea to see some of the
    principles of using variables effectively. This lab will introduce two of them,
    types and scoping.


    # LAB 6.1 EXERCISES


    | 6.1.1 DECLARE NUMERIC VARIABLES AND ASSIGN VALUES |


    The KornShell provides four different primitive types of variables for you to
    use. The most commonly used type has values that are strings, and they don''t'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Chapter 6: ADVANCED VARIABLE USAGE 257


    need to be "declared" in any way. Just assign a value to a variable, and the shell
    creates a string variable to receive the value.


    # FOR EXAMPLE


    If you type the command, or put it in a script or function, the shell will create
    a variable named a_variable, and will give it the value 123.456.


    ```

    a_variable=123.456

    ```


    Even though characters to the right of the equal sign are a number, a_variable
    is still a string variable. There is going to be a bit of confusion here, because
    you can treat the value as a number and do arithmetic with it, but the type of
    the variable is string. You will see the significance of this fact as this Lab
    progresses.


    The shell provides two commands to declare that variables are going to hold numeric
    values instead of strings, and the commands have the same names as the two numeric
    data types that the shell can work with, integer and float. Integers can be positive,
    zero, or negative numbers, but they may not have fractions. Floats have fractions
    and can represent a larger range of values than do integers, but arithmetic operations
    using them are slower.


    You will see the fourth type of variable, called a name reference, at the end
    of this exercise. First, though, we''ll start with the numeric types, the integers
    and floats.


    Once you declare a variable to hold numeric value, the shell will always make
    sure it contains a value of the proper type, even if you attempt to assign a different
    type of value to it.


    Run the following commands:


    ```

    integer i j

    float x y z

    i=3.5 j=4.9 k=99.999

    x=3.5 y=4.9 z=99.999

    print i=$i j=$j k=$k x=$x y=$y z=$z

    ```'
  merge: -1
  img_proc: true
