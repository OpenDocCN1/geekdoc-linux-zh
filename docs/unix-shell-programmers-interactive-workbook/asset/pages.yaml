    +   i) What does the % operator compute?

    Answer:The remainder when you divide the first operand by the second.


    In line 6042, the right-hand side is equivalent to 8%5 (because the value of i
    was changed in line 6041), so the result is 3 because 8 divided by 5 has a quotient
    of 1 (which is discarded) and a remainder of 3.


    > This “remainder operator” is usually called the modulus operator, or modulo,
    and is shortened to mod.


    +   j) What does the << operator compute?

    Answer:It shifts the bits to the left the number of positions specified.


    This is one of several “bit manipulation” operators. Others include >> (shift
    right), & (bit-wise and), | (bit-wise or), ^ (bit-wise exclusive or), and - (bit-wise
    negation, also known as one''s complement). You usually use these operators when
    you read data from some sort of device that uses a non-standard data encoding
    scheme and you need to convert it into values that you can work with your programs.


    The value printed after line 6043, 96, is equal to the value of i times 2⁵ Each
    position you shift the bits in an integer to the left doubles its value, so shifting
