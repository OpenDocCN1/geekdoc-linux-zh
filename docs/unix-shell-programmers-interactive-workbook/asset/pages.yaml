- pgno: 576
  md: '# Appendix B: Built-In Command Reference 557


    ksh performs all calculations using the double precision floating point arithmetic
    type on your system. ksh does not check for overflow.


    A floating point constant has the form ([number].[number][exponent]), where number
    is any non-negative decimal, and exponent is E or optionally followed by + - and
    a non-negative decimal number.


    An integer constant has the form [base]#number, where base is a decimal integer
    between 2 and 64 that defines the arithmetic base (default is 10), and number
    is any non-negative number.


    A variable is denoted by a *. If in an arithmetic expression has the integer attribute,
    then ksh uses the value of the variable. Otherwise, ksh assumes that


    the value of the variable is an arithmetic expression, and tries to evaluate it.


    An arithmetic function is denoted by function(expression), where function is one
    of the following: abs (absolute value), acos (arc cosine of angle in radians),
    asin (arc sine), atan (arc tangent), cos (cosine),cosh (hyperbolic cosine), exp
    (exponential with base e (2.718281828459045)), int (greatest integer less than
    or equal to value of expression), log (logarithm base), sin (sine), sinh (hyperbolic
    sine), sqrt (square root), tan (tangent), tanh (hyperbolic tangent).


    An expression is a constant, a variable, or is constructed with the following
    operators. The value of an expression with a comparison operator or a logical
    operator is 1 if non-zero (true) or 0 (false) otherwise. Operators are listed
    in order of precedence, with the highest ones first. Items of the same precedence
    are listed under the same base. ksh evaluates all items of the same precedence
    left-to-right, except for = and op= and other assignment operators, which it evaluates
    right-to-left.


    +   * (expression)


    +   * varname/++idname


    +   * varname--idname


    +   * +expression


    +   * -expression


    +   * !expression


    Overrides precedence rules.


    Postfix/prefix increment.


    Postfix/prefix decrement.


    Unary plus.


    Unary minus.


    Logical negation. The value is 0 for any expression whose value is 0.'
  merge: -1
  img_proc: true
- pgno: 577
  md: '# Appendix B: Built-In Command Reference


    -expression Bit-wise negation.


    +   * expression * expression Multiplication.


    expression / expression Division.


    expression % expression Remainder of 1st expression after division by the 2nd
    expression.


    +   * expression + expression Addition.


    expression - expression Subtraction.


    +   * expression << expression Left shift first expression by the number of bits
    given by the second expression.


    expression >> expression Right shift expression by the number of bits given by
    the second expression.


    +   * expression <= expression Less than or equal to.


    expression >= expression Greater than or equal to.


    expression < expression Less than.


    expression > expression Greater than.


    +   * expression == expression Equal.


    expression != expression Not equal to.


    +   * expression & expression Bit-wise OR. Both expressions are always evaluated.


    +   * expression ^ expression Bit-wise Exclusive OR.


    +   * expression | expression Bit-wise OR. Both expressions are always evaluated.


    +   * expression && expression Logical AND. If the first expression is non-zero,
    then the second expression is not evaluated.


    +   * expression || expression Logical OR. If the first expression is non-zero,
    then the second expression is not evaluated.


    +   * expression ? expression: expression Conditional operator. If the first expression
    is non-zero, then the second expression is evaluated. Otherwise the third expression
    is evaluated.'
  merge: -1
  img_proc: true
- pgno: 578
  md: '# Appendix B: Built-In Command Reference 559


    +   - varname = expression


    Assignment.


    +   - varname op = expression


    Compound assignment. The is equivalent to varname = varname expression. op must
    be * / % + - << >> ^ or |


    +   - expression, expression


    Comma operator. Both expressions are evaluated. The resulting value is the value
    of the second expression.


    For more information: see Chapter 6 (Advanced Variable Usage).


    # [ ... ] LEFT BRACKET COMMAND


    ```

    [expression]

    test [expression]

    ```


    The [[ ... ]] compound command makes test and [ obsolescent.)


    # [[ ... ]] CONDITIONAL COMMAND


    ```

    [[ test-expression [Newline ... ]]]

    ```


    test-expression must be a conditional expression primitive or some combination
    of conditional primitives formed by combining one or more of them with one of
    the following, The following are listed in order of precedence, from highest to
    lowest:


    +   - (test-expression)


    Evaluates to value of test-expression. The ( ) are used to override normal precedence
    rules.


    +   - ! test-expression


    Logical negation of test-expression.


    +   - test-expression && test_expression


    Evaluates to True if both test expressions are True. The second test expression
    is expanded and evaluated only if the first test expression is True.


    +   - test-expression || test-expression


    Evaluates to True if either of the test expressions are True. The second test
    expression is expanded and evaluated only if the first test expression is False.'
  merge: -1
  img_proc: true
- pgno: 579
  md: '# Appendix B: Built-In Command Reference


    Conditional expression primitives are unary and binary expressions that evaluate
    to True or False. Spaces or tabs are required to separate operators from operands.


    +   -e file: True if file exists.


    +   -a file: True if file exists. Do not use this primitive; use -e instead.


    +   -r file: True if file exists and is readable.


    +   -w file: True if file exists and is writable. file will not be writable on
    a readonly file system even if this test indicates True.


    +   -x file: True if file exists and is executable. If file is a directory, True
    indicates that the directory can be searched.


    +   -f file: True if file exists and is a regular file.


    +   -d file: True if file exists and is a directory.


