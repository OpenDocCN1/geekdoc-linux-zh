- pgno: 244
  md: '# Chapter 5: Parameters


    The first time you run an undefined function, the shell looks for a file with
    the same name in each of your FPATH directories and "dots" file (runs the file
    as a script in the context of the interactive shell). The file does not have to
    be executable for it. Your script, ~/fun/f511, contains both a function definition
    and a print statement, so the function becomes defined and the first line you
    see after line 5010 prints. The shell runs the newly defined function, leading
    to the second output line after line 5010. The whence command on line 5011 shows
    that the function is now defined, and line 5012 shows that the shell runs the
    function without dotting the definition file again.


    You could delete ~/fun/f511 now and still use the f511 function because the shell
    stores a copy of the function definition in its own memory and does not need the
    function definitions across sessions, so if you log out and in again, you would
    have to redefine the function. Chapter 1, "Setting Up," covered setting up your
    environment so that commands, such as ones that define functions you always want
    to use, get run automatically every time you log in.


