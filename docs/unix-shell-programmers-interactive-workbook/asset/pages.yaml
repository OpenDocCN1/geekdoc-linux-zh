- pgno: 604
  md: '# # APPENDIX C


    # # GLOSSARY


    Just knowing what these terms mean won''t make you into a shell programmer, but
    it will be hard to write shell programs if you don''t know what they mean. Except
    maybe the last one. Chapter 2 references, where given, indicate a good place to
    start looking for more information on the term, but many of these terms are used
    throughout the book.


    +   - argument: Many commands recognize option parameters (the ones that start
    with - or+) and that some option parameters are followed by "argument". Unfortunately,
    the same term is sometimes used for any parameter inside a script or function,
    or sometimes for positional parameters in a command line. You have to figure out
    which meaning of the term is intended by the context it''s used in. Chapter 2
    [Command Line Syntax].


    +   - arithmetic expansion: The shell substitutes the value of expression for
    $(( expression )), where expression is an arithmetic expression.


    +   - assign: You assign a value to a variable in order to make the association
    between the name and its value. There are commands for making the assignment explicitly,
    and the shell sometimes assigns values to variables as its normal housekeeping
    operations. Chapter 6 [Advanced Usage].


    +   - associative array: A variable that holds a set of values. Elements are accessed
    using arbitrary strings as subscript values. Chapter 6 [Advanced Variable Usage].


    +   - command substitution: The shell substitutes whatever command writes to its
    standard output for ($ command ). Chapter 10 [Patterns, Expansions, and Substitutions].


    +   - co-process: A command that runs concurrently with a script having the additional
    feature that the script can read from the co-process'' standard output and write
    to its standard input. Chapter 3 [Compound Command Syntax].'
  merge: -1
  img_proc: true
- pgno: 605
  md: '# 586 Appendix C: Glossary


    discipline function A function with a name in the form varname_action, where name
    is the name of a variable, and action is one of set, get, or unset. The function
    is automatically run when the indicated action is applied to the named variable.
    Chapter 6 [Advanced Usage].


    dot (a script) The dot (. ) is a command that takes a script or function command
    as its argument. The script or function runs in the same environment as the shell
    that runs the dot command. Chapter 1 [Setting Up].


    environment file A file whose name is the value of the ENV variable. If such a
    file is defined, the shell executes the commands in it before issuing its first
    prompt in an interactive session. Normally, you post an assignment to ENV in ~/.profile
    to establish an environment file. Chapter 1 [Setting Up].


    environment variable Any variable that is defined in a script or function''s environment.


    environment The environment of a script or function consists of a set of variables
    as well as a collection of parameter settings determined by the user''s file access
    rights, current working directory, trap settings, and other information that can
    be tested or control the behavior of the program.


    evaluate When the shell sees a reference to a variable in a command, it substitutes
    the value of the variable for the reference to it before executing the command.
    This substitution is called "evaluating a reference" or "evaluating a variable."
    Chapter 4 [Simple Variables].


    field splitting The operation of breaking a string into a sequence of tokens using
    the IFS variable to determine what characters serve as token delimiters. Chapter
    11 [I/O and Trap Processing].


    initialize The first time you assign a value to a variable you are to initialize
    it. Before that, the variable is "uninitialized." Chapter 4 [Simple Variables].


    interactive shell When you run the KornShell so that it reads its commands from
    your keyboard and writes its output to your screen. A non-interactive shell would
    be when you run a script or function in a separate invocation of the KornShell.


    job A process that executes a command entered from the keyboard. You can use the
    fg and bg commands, among others, to manage the execution of jobs. Chapter 3 [Compound
    Syntax].'
  merge: -1
  img_proc: true
- pgno: 606
  md: '# Appendix C: Glossary


    # 587


    lvalue


    Short for "left-hand side value." The things that are valid to put on the left
    side of an equal sign, such as a variable name.


    name


    A variable name is any combination of letters, underscores, and digits, but must
    not start with a digit. Upper and lower-case letters are not the same. Chapter
    4 [Simple Variables].


    option argument


    The value, such as a file name, that must follow certain option letters. Chapter
    5 [Parameters].


    option letter


    Commands that process command line values in the standard way use option letters,
    indicated by a dash followed by the letter, to specify execution alternatives.
    Chapter 5 [Parameters].


    option parameter


    Command line values that are option letters or option arguments. Chapter 5 [Parameters].


    parameter expansion


    In its simplest form, the shell substitutes the value of a parameter for a reference
    to it in the form $(parameter), where parameter is the name of a variable. There
    are several expansion operators, such as :- = ? * + # % % % that cause the shell
    to modify the value being substituted and/or the variable named by parameter.
    Chapter 10 [Patterns, and Substitutions].


    parameter


    When you run a command, a shell script or function, you can type parameters after
    the command name. The shell assigns these parameters as the values of parameter
    variables, which can be referenced by code inside the script or function. Chapter
    2 [Command Line Syntax].


    pathname expansion


    If a command takes files as arguments, the KornShell will generate a list of file
    names matching the files in the current directory using ? to match any string
    of characters, [...] to match sets of characters, and any of several pattern matching
    rules (defined next) to generate the file names. Chapter 10 [Patterns, Expansions,
    and Substitutions].


    pattern matching rule


    Also called sub-patterns. Any of the symbols * ? @ or followed by a pattern list
    enclosed in parentheses. Chapter 10 [Patterns, Expansions, and Substitutions].


    positional parameter


    The values entered on a command line are passed to the command as the values of
    positional parameters, which are variables with small integers as their names.
    0 is the name of the command, 1 is the first parameter following the command name,
    and so forth. Chapter 5 [Parameters].'
  merge: -1
  img_proc: true
- pgno: 607
  md: '# 588 Appendix C: Glossary


    precedence When evaluating an expression, the shell calculates the result of higher
    precedence operators before doing the calculation for lower-precedence operators.
    Generally, operators of equal precedence are evaluated in left to right order;
    exceptions are the assignment operators such as +=. For example, multiplication
    has a higher precedence than addition, so a+b*c is evaluated as a+(b*c). Use parentheses
    to override precedence rules if necessary. Chapter 6 [Advanced Variable Usage].


    process ID Every process that is running on the computer at any time has a unique
    integer assigned to it by the kernel called its process id.


    process The operating system construct that executes programs. When it is created,
    a process has a thread of execution that is scheduled for CPU usage by the kernel
    and an address space, which includes its environment and the code that it executes.
    Chapter 1 [Setting Up].


    program executable code.


    quote removal The last step the shell performs on a command line before executing
    a command, with single and double quotation marks are removed, as well as escape
    characters (back slashes). Chapter 2 [Command Line Syntax].


    reference You reference a variable by putting a dollar sign ($) before its name
    in a command line. Sometimes the variable''s name has to be enclosed in curly
    braces to make it clear where the name begins and ends. Chapter 4 [Simple Variables].


    she-bang She-bang notation gets its name from the first two characters that may
    appear in the first line of a script file: (#!). The first one is sometimes called
    sharp, and the second one is often called "bang" because that is easier to say
    "exclamation mark." The rest of the line gets the pathname of the program that
    will process the commands in the file. Depending on where your copy of the KornShell
    is installed, it might look like /bin/ksh or something similar. Chapter 1 [Setting
    Up].


    subscript The expression inside square brackets that tells what element of an
    array you want to access or modify. Use a number for indexed arrays, or an arbitrary
    string for associative arrays. Chapter 6 [Advanced Variable Usage].'
  merge: -1
  img_proc: true
- pgno: 608
  md: '# Appendix C: Glossary 589


    subshell


    Not necessarily a separate process, a subshell refers to executing a command or
    command list in a separate environment from the shell that started the command,
    accomplished by putting the command inside single parentheses. Chapter 3 [Compound
    Syntax].


    trap condition


    The signal or other event (DEBUG, ERR, EXIT, KEYBD) to be intercepted by a trap
    command. Chapter 11 [I/O and Trap Processing].


    trap handler


    The code to be executed when a trap condition occurs. Chapter 11 [I/O and Trap
    Processing].


    value


    The value of a variable is normally a string of characters, but you can give a
    variable a numeric type so that it will be handled as either an integer, a floating-point,
    an exponential number, or a reference to another variable. Chapters 4 [Simple
    Variables] and 6 [Advanced Variable Usage].


    variable


    A variable is a name and an associated value. You or the shell can assign a value
    to a name, and the shell will substitute the value when you reference the name
    in your programs. Chapter 4 [Simple Variables].


    xtrace


    An option you can set (set -x) so that the shell prints each command just before
    it executes it. Very useful for debugging scripts and functions. Turn it off with
    set +x.


    zythepsary


    A brewery.'
  merge: -1
  img_proc: true
