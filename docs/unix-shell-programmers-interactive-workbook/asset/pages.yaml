    +   **What does the *loop* test part of this *for loop***

    Answer:The loop test part is in "$@".


    The loop test part of this type of for loop consists of the keyword followed by
    the list of values to be iterated over. When there are no more values in the list,
    the test fails, and the shell skips to the next statement after the done.


    +   **What is the word in after the control variable name?**

    Answer:It is a keyword, a piece of syntax that tells which type of for loop this
    is is.


    The next token after *for* must be either *in*, the start of an arithmetic expression
    (see next exercise), or the keyword do.'
