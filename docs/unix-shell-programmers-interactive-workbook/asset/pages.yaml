  md: 'b) Set *OPTIND* to *1* and show that this lets you process the options over
    again from the beginning.


    A script or function normally goes through two phases. In the first phase it uses
    getopts to process the option parameters. In the second phase, it processes the
    positional parameters. Because the second phase doesn''t know how many parameters
    there were, it is convenient to do a shift that puts the first positional parameter
    into parameter variable number *1*.


