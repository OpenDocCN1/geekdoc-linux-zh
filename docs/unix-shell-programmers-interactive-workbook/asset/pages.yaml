- pgno: 125
  md: "# 106 Lab 2.3: Command Syntax\n\nThe three standard file descriptor numbers\
    \ are 0 for stdin, 1 for stdout, and 2 for stderr.\n\n+   e) Write a cat command\
    \ that copies file out to file out1 using fd numbers for stdin and stdout.\n\n\
    Answer:The following interaction shows the cat command and verifies that it worked.\n\
    \n```\n$ cat 0<out >|out1\n$ more out1\n  hello again\n  good-bye again\n$\n```\n\
    \nNote the use of 1> for output redirection. If you know the file doesn't exist\
    \ or you know the shell's noclobber option isn't set, you could have just used\
    \ 1.\n\n+   f) Remembering that out1 > out2 means to redirect stdout to out2,as\
    \ you saw earlier, what do you think out>3 2>out3 means?\n\nAnswer:It means that\
    \ both stdin and stderr are redirected to the same file, but it doesn't work,\
    \ as the following interaction shows:\n\n```\n$ rm -f out3\n$ set -o noclobber\n\
    $ cat out1>out3 2>out3\n-ksh: out3: file already exists [File exists]\n$\n```\n\
    \nThe problem is that the shell sees two separate output redirections. When it\
    \ sees 1>out3, it creates file out3 with zero bytes. Then, when it sees 2>out3,\
    \ the file out3 already exists and the redirection fails because the noclobber\
    \ option is set and >| wasn't used. The cat command was never run because the\
    \ problem was detected by the shell.\n\nIf noclobber had not been set, the shell\
    \ would have run the cat command, but there is another subtle issue here that\
    \ you won't see using cat, which is that a program that writes to both stdout\
    \ and stderr might produce a different sequence of output lines using this form\
    \ of redirection than linked fds, which is covered in the next exercise. The issue\
    \ is based on the fact that the operating system buffers output written to stdout\
    \ but not to stderr."
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Chapter 2: Command Syntax 107


    You could try to deal with this problem using 1>>out3 2>>out3 or 1>out3 2>out3,
    but those won''t work either. This entire, complex topic can be summarized in
    the following Tip:


    > Don''t try to use separate redirections to send information from two fds to
    one file


    # 2.3.4 ANSWERS


    +   a) Why must there be no space between the 2 and the >


    Answer: Consider this command:

    cat out 2 >out2


    This would copy the files named out 2 and 2 (because 2 is a valid file name) to
    out2.


    > If you find files with names like 1 or 2 in a directory, it probably means someone
    made typing errors when they were trying to redirect fds. But you never know,
    they might be real files, so double-check before deleting them!


    +   b) Why must there be no space between the > and the ampersand?


    Answer: Consider this command:

    cat out 2> &out2


    Under this, you have to “think like the shell.” When it sees the 2> token, it
    knows the next thing must be the name of the file you want stderr redirected to,
    but the next thing it sees is the ampersand, which is its “background job” indicator,
    which you will cover in the next lab. That doesn''t make any sense, and it issues
    an error message saying the sand was “unexpected.” The cat command never gets
    run.'
