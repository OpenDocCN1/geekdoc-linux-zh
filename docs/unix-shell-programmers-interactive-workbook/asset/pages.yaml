- pgno: 584
  md: '# Appendix B: Built-In Command Reference


    Use exec to replace ksh with command without creating a new process. If you specify
    -c, ksh clears the environment of all variables before execution except variable
    assignments that are part of the current exec command. If you specify -a, ksh
    passes name as the zero-th argument of command.


    If you do not specify any options, command, or arg, exec will open, close, and/or
    copy file descriptors as specified by I/O redirection.


    +   - exec [n]< readfile

    Open readfile as descriptor n for reading n is 0 (stdin) if omitted.


    +   - exec [n]< writefile

    Open writefile as descriptor n for writing n is 1 (stdout) if omitted.


    +   - exec m<&\-

    Make file unit m a copy of file descriptor n.


    +   - Close file descriptor n.


    For more information: see Chapters 2 (Command Syntax) and Chapter 11 (I/O and
    Trap Processing).


    # EXIT


    exit [n]


    Causes ksh to exit. If this is the login shell, ksh logs you out. Otherwise, ksh
    returns to the program that invoked ksh. If set, a trap on EXIT is executed before
    ksh terminates. If specified, n is the return value.


    # EXPORT


