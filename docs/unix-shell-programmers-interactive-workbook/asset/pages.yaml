  md: '# Lab 6.2: Arrays and Compound Variables


    # LAB 6.2


    # ARRAYS AND

    COMPOUND

    VARIABLES


    # LAB OBJECTIVES


    +   After this lab, you will be able to:

    - Use Indexed Arrays

    - Declare and Use Associative Arrays

    - Use Compound Variables and Discipline Functions


    In this lab, you will learn to work with arrays and compound variables. There
    are two types of arrays, called indexed arrays and associative arrays. Both of
    them use a single variable name to hold a list of values, and you use another
    value, called a subscript, to tell which element of the array you want to use.
    An indexed array uses integer numbers between 0 and 4095 as subscripts. In Chapter
    8, "Loops," you will see how to use loops to access the different elements of
    an indexed array in a systematic order. An associative array uses strings as subscripts.
    Associative arrays are also known as property lists or hashtables, and are used
    for many purposes in computer programming.'
  merge: -1
  img_proc: true
