- pgno: 38
  md: '# Chapter 1: SETTING UP 19


    b) What (if anything) printed?


    Answer:Your answer depends on how your PATH environment variable is set up.

    Your interaction might look like the following:

    ```bash

    $ typeset -x grep "PATH"

    PATH=/usr/bin:/usr/local/bin:/home/vickery/bin

    ```


    This command line consists of two parts. The first part (typeset - the shell to
    print a list showing the names and values of all the shell''s exported variables,
    which could be quite long, and should include PATH. The second part (grep "PATH=")
    invokes the grep utility to search the output of the typeset command for the string
    PATH= at the beginning of a line (indicated by the ^ at the beginning of the string).
    You will learn more about this type of command in Chapter 4, "Simple Variables."
    For now, just type the command exactly as shown and observe the output.


    If nothing printed when you typed the command, either PATH is not set up at all,
    which is highly unlikely, or it is not exported. You can see whether it is set
    by running the following command:


    ```

    print $PATH

    ```


    If that command prints nothing, you should check with the person who set up your
    system; there should be a PATH= command in /etc/profile so that each user will
    have an initial setting for this environment variable.


    If a print command shows that PATH has a value, but the typeset -x command doesn''t
    show it, it means you have to use your favorite text editor to add the following
    command to ~/.profile:


    ```

    export PATH

    ```'
