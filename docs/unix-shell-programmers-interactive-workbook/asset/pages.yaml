- pgno: 506
  md: '# Chapter II: I/O and TRAP Processing 487


    # LAB II.1 EXERCISES


    # 11.1.1 USE THE read COMMAND


    There are a couple of points to make before we start working with the read command.
    The first is that in this exercise we will use read to process information coming
    from stdin (fd number zero), but the command has an option, -u, that you can use
    to process a file using fds other than number zero. You will learn to work with
    different fds in the next lab. The principles covered in this exercise carry over
    directly to performing input from all fds, not just stdin.


    The second point has to do with the distinction between text and binary files.
    UNIX treats all files equivalently, as streams of bytes, but we can use the text
    file to mean a file that contains only ASCII character codes, such as one you
    prepare using a text editor or generate using the output of print commands. Binary
    files, on the other hand, contain arbitrary bit patterns, such as the machine
    language code generated by a compiler when it processes a C/C++ or Java program.
    You can use the read command to process text files very nicely, but it won''t
    work very well with binary files because read uses ASCII codes in the file and
    end, but having non-ASCII codes in a file makes the concepts of lines within a
    line begin and end, and having words meaningless.


    Here is the syntax of the read command:


    ```

    read [-Aprs] [-U [n]] [-d char] [-t sec [name?prompt]] [name ...]

    ```


    As you can see, the command has a lot of options and parameters you can use, but
    they are all shown in square brackets, which means that they are all optional.
    So we''ll start with as simple read command as possible, one with no parameters
    or arguments. When you run that command, the shell will wait for you to type a
    line of text, which it will read, then the shell will show a prompt for you to
    enter another command.'
  merge: -1
  img_proc: true
