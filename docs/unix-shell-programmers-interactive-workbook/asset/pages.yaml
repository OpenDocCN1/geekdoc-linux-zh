- pgno: 432
  md: '# Chapter 9: The case and select Statements 413


    +   - Each function can be run any number of times in any order; the order is
    determined by the order of the letters on the command line.

    - If a parameter is something other than "a", "b", or "c", the program prints
    an error message, but it continues to process the other command line parameters
    after that.


    b) What does the "dot" command do at the beginning of the script?

    Answer: It gets the shell to read and remember the three function definitions.


    The shell automatically "dots" a function definition the first time you run a
    function, provided the definition file has the same name as the function and provided
    the file is in your FPATH. However, in this case, we have adopted the common strategy
    of putting several small functions into one definition file, and have given the
    file a name that doesn''t match any of the function names. To have the functions
    defined inside script, we explicitly dot the file that holds the three function
    definitions.


    > If you are familiar with the UNIX in command, you could link three files named
    f911_a, f911_b, and f911_c to the "real" file, f911.Then the shell would read
    all three definitions the first time any of them is referenced and you would not
    have to dot f911.


    ![](img/694fa9f0320e707804a4c650b96a09b4_432_0.png)


    c) What is the first pattern in the case command?

    Answer: It''s the letter "a".


    Patterns are covered in Chapter 10, "Patterns, Expansions, and Substitutions,"
    but we will explain some simple ones as we go along here. In this case, the pattern
    is simply a string. It doesn''t have to be a single letter; we just did that in
    this case (pardon the pun) to make the command line easy to type. If you want
    the same command executed if the value matches any of several patterns, you could
    put them all before the close parentheses, separated by vertical bar (|) symbols.'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# 414 Lab 9.1: The case and select Statements


    ![](img/694fa9f0320e707804a4c650b96a09b4_433_0.png)


    # FOR EXAMPLE


    If you wanted to let the user type an upper or lowercase "a" or the word alpha
    to run f911_a, you could have used the following line in place of the first one
    in the case body:


    ```

    a | A | alpha )      f911_a ;;

    ```


    +   d) What is the last pattern, and what do you think it means?

    Answer:The last pattern is an asterisk (*). I think it matches any value.


    Your answer is technically "correct," even if you didn''t think what I think.
    But now you know what it means!


    The asterisk pattern is the standard thing to use as the "leg" of a case command.
    If none of previous legs is matched, this one is guaranteed to get executed, and
    you can use it (in this script) to print an error message, and you to take whatever
    other action might be appropriate, possibly such as exiting the script using an
    exit or return command.


    +   e) What is the reference to the variable 0 in the print command for?

    Answer:It prints the name of the script.


    This print command is an example of the standard format for UNIX error messages.


    +   f) What is the reason for 1>&2 at the end of the print command?

    Answer:This causes the output of the print command to be redirected to stderr.


    The print command has an option, -u, that tells what fd to print to, so the following
    line of code would also print the message to stderr:


    ```

    * ) print -u2 -- $0: "fun":\nUnrecognized parameter.

    ```


    ![](img/694fa9f0320e707804a4c650b96a09b4_433_1.png)'
  merge: -1
  img_proc: true
