    # 1.2.2 SET UP YOUR PROFILE AND ENVIRONMENT FILE


    Setting things up properly to use the KornShell involves creating or modifying
    some files in your home directory. Before you do that, here is some background
    that will help you understand the rationale for what you are going to do with
    these files.


    When you connect to your computer system, a program, usually named login, prompts
    you to enter your username and password, which it looks up in the system''s user
    database (such as a file named passwd or in the Windows registry). That database
    also tells login the pathname of your home directory and the pathname of your
    shell program.


    At this point, a process starts executing your shell (ksh). In general, you can
    use the terms process and program interchangeably, but there are real differences
    between the two. For example, on most systems, login and ksh are two programs
    (executable files) that are executed by the same process. Processes take a'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Chapter I: SETTING UP 13


    lot of time to create, so a general strategy is to try to minimize how many processes
    you create.


    If you can do the same thing two different ways, one of which creates a new process
    and the other doesn''t, choose the one that does not create a new process.


    ![](img/694fa9f0320e707804a4c650b96a09b4_32_0.png)


    One important feature of a process is that each process has its own area of memory
    (called its address space), which includes a list of names and associated values,
    called its environment. The names in this list are called environment variables.
    (You will be learning a lot about variables throughout this book.)


    # LAB

    1.2


    A second important characteristic of processes is that one process can tell the
    operating system to create another process; the creating process is called the
    parent of the created process, called a child.


    Finally, only one process can be executed by a hardware processor at a time. The
    operating system schedules all the processes on the system so that they all get
    to use the available processors in a fair and timely fashion.


    Before your login process starts executing ksh, it makes the current working directory
    your home directory and puts three variables in the process''s environment, named
    LOGNAME (value is the name you used for logging into the system), HOME (value
    is the pathname of your home directory), and SHELL (tells the pathname of your
    shell).


    Log into your system and run the following commands:


    ```

    print "My login name is $LOGNAME"

    print "My home directory is $HOME"

    print "My shell is $SHELL"

    ```


    +   a) What printed?'
  merge: -1
  img_proc: true
