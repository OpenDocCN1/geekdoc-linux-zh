    # 2.3.1 LINK FILE DESCRIPTORS FOR REDIRECTION (n >&)


    If a program writes output to two different fds (for example stdout and stderr),
    you can get the shell to make both fds go to the same file by redirecting one
    fd to the file, and linking the second fd to the first one using the link redirection
    symbol, (n>&). In this symbol, the n is a number telling what fd you want to link.


    # FOR EXAMPLE


    ```

    cat >out 2>&1

    ```'
