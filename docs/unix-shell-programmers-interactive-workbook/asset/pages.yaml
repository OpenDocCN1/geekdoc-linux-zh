- pgno: 423
  md: '# Lab 9.1: The case and select Statements


    # LAB 9.1


    # THE case AND select STATEMENTS


    LAB OBJECTIVES

    After this lab, you will be able to:

    ✓ Use the case Command

    ✓ Use the select Command

    ✓ Work with select Details


    The two commands in this lab are often used together, yet they have totally different
    uses. The case command is one you will use a lot once you master it because it
    simplifies doing things that would otherwise require complex if-elif constructions.
    It''s also very efficient compared to the equivalent structures. The select command,
    on the other hand, is an easy way to set up menus for interacting with a user.
    The relationship between the two is that you typically use a case command in the
    body of a select command to process the user''s menu selection.


    The syntax for the two commands looks like the following:


    ```

    case value in

    [pattern | pattern ] ... Command ... ;

    [pattern | pattern ] ... Command ... &

    ```'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# Chapter 9: The case and select Statements 405


    ...


    # LAB 9.1


    esac


    select name in list


    do


    Command ... This is the select body, where you typically put a case command.


    done


    For the case command, value is the value you want to test, normally a reference
    to a variable. The keyword in is followed by any number of pattern tests, each
    of which is followed by a set of one or more commands that are executed if the
    value of the variable being tested matches one of the patterns in the pattern
    test. If a command list ends with a doublesicolon (;;), the case command terminates
    when the last command in the list finishes, and the shell jumps to the next command
    after the esac. However, if the list ends with semicolon-ampersand (& &), the
    case command executes commands until it completes a command list that ends with
    a double-semicolon.


    ![](img/694fa9f0320e707804a4c650b96a09b4_424_0.png)


    > The (& &) form is used seldom. It tends to make a program''s logic "tricky."


    For the select command, list is a list of strings that will be displayed to the
    user as a menu from which to choose. The shell displays the list and waits for
    the user to make a selection from the items displayed. When the user makes a selection,
    the shell assigns the item selected as the value of the variable given as the
    name and executes the commands inside the body. As the syntax diagram points out,
    you almost always use a single case in the select body, with one pattern test
    for each of the items in the menu list.'
  merge: -1
  img_proc: true
