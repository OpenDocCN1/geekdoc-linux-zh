- pgno: 240
  md: '# 5.1.5 USE shift TO ACCESS POSITIONAL PARAMETERS


    The shell''s built-in shift command is usually used inside loops, which won''t
    cover until Chapter 8, "Loops." Nonetheless, you can easily learn what it does
    now, and you will be ready to use it in loops later. In addition, this exercise
    will give you some good practice working with variables.


    In its simplest form, the shift command moves parameter variables "down" in the
    set of positional parameter variables. That is, what was in variable 2 becomes
    variable 1, what was in variable 3 becomes variable 2, and so on.


    > The shift command is usually used in scripts or functions when one part of the
    program "uses up" some of the parameter variables but another part of the program
    doesn''t have a good way of knowing which variable is "next." In this case, the
    first part of the program shifts away the parameter variables it has dealt with,
    leaving the rest of the program to start with the "next" parameter in variable
    1.


    Use set to give the values red, white, and blue to positional parameters / through
    3. Print $ and $@, run the shift command, and print $ and $@ again. Repeat the
    shift and print commands three more times.


    +   a) What happens to the variable / each time you run shift?


    > Note that the set command in this exercise totally replaces the values of all
    the special variables and positional parameter variables. Whatever was left in
    them from the previous exercise is completely gone.


    You can shift away more than one parameter variable at a time by specifying a
    number as a parameter to the shift command.'
  merge: -1
  img_proc: true
