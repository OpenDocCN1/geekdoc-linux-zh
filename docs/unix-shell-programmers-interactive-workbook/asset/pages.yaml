  md: '# 2.3.2 ANSWERS


    Run the following commands:


    ```

    set -o noclobber

    touch out out1

    cat out > out1

    ```


    +   a) What does the error message mean?

    Answer:You should get something like the following:

    $ set -o noclobber

    $ touch out out1

    $ cat out > out1

    -ksh: out1: file already exists [File already exists]


    The touch command will create empty files named out and out1 if they do not already
    exist. (If either does already exist, touch silently sets its last modification
    time to “now,” but that has nothing to do with this exercise.


    The error message says that the program ksh found that the file named out1 already
    exists. Why didn''t the message come from cat instead of ksh? Because it is the
    shell that sets up the I/O redirection and finds the problem. The cat command
    never got to run.


    Now run these commands:


    ```

    set -o noclobber

    touch out out1

    cp out out1

    ```


    +   b) Why is there no error message this time?

    Answer:There was no error message (file out really did get copied over file out1)
    even though the noclobber option is set because noclobber is a shell option, and
    it affects only things the shell does, such as output redirection.


    The cp command has no way of knowing what options are set in the shell; cp and
    ksh are totally separate programs.'
