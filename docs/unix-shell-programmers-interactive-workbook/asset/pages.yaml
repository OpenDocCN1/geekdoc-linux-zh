- pgno: 387
  md: '# LAB 8.1


    # # LOOPS: while AND until


    | LAB OBJECTIVES |

    | After this lab, you will be able to: |

    | Use while to Repeat Commands |

    | Use break and continue to Manage a Loop |

    | Use until, a Variant of while |


    A loop is a set of commands that gets executed more than once. Every loop has
    markers to indicate where the loop starts and ends, and some testing mechanism
    that decides how many times the commands inside the loop will be executed.


    The two types of loops you will learn about in this lab, called while and until,
    nearly identical syntax diagrams:


    ```

    while

    Command ... This is the loop test, the commands to decide whether or not to execute
    the loop body.

    do

    Command ... This is the loop body, the commands inside the loop.

    done

    ```'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Chapter 8: Loops 369


    until

    Command ... This is the loop test, the commands to decide whether or not to execute
    the loop body.


    do

    Command ... This is the loop body, the commands inside the loop.


    done

    Execution of either type of loop proceeds as follows: First, the shell executes
    all the commands in the loop test, resulting in a true/false value that is used
    to decide whether or not to execute the commands in the loop body. After the loop
    is executed and the done command is reached, the shell returns to the while or
    until command (called the top of the loop because it is at the beginning), and
    executes all the commands in the loop test again to decide whether or not execute
    the loop body again. This cycle can repeat forever, but normally, something eventually
    happens in the loop body that makes the loop test fail, and the shell then skips
    to the first command after the done and resumes execution from there.


    ![](img/694fa9f0320e707804a4c650b96a09b4_388_0.png)


    # LAB 8.1 EXERCISES


    +   8.1.1 USE while TO REPEAT COMMANDS


    The while loop executes the loop body if the loop test results in a value of true.
    (You might be able to guess how this differs from the operation of the until loop.)


    In this exercise, we will use the exit code of a single getopts command for the
    loop test, and inside the loop body we will set the values of some variables to
    keep track of the command line options passed to a script.


    > You can put any number of commands in the loop test, but most of the time, there
    is just one command because it is easier to understand the logic that way. When
    there is more than one command in the loop test, the shell takes the exit code
    of the last one as the value of the entire loop test.'
  merge: -1
  img_proc: true
