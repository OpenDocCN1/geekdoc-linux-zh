    Answer:A reference means to use a variable''s name in such a way that the shell
    substitutes its associated value.


    A reference to a variable starts with a dollar sign ($), which is followed immediately
    by either the name of the variable or the name of the variable enclosed in curly
    braces ({}). The curly braces are usually, but not always, optional.


