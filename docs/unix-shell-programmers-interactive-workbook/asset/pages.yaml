  md: '# 2.3.2 CONTROL CLOBBERING!


    >> | Now about that "possible problem" mentioned in the previous exercise. The
    UNIX philosophy has traditionally been that if you tell the system to do something,
    you really mean it, and you don''t want to be bothered with messages asking if
    you really do mean it.


    This approach is particularly appealing when you are writing scripts that need
    to run without stopping every step of the way to ask the user whether or not to
    do what the script says.


    On the other hand, this behavior can have pretty grim consequences—there is no
    way to "undelete" files on UNIX systems,the way you can with some other systems.
    So the shell lets you have it both ways.


    There is a shell option, noclobber, that you can turn on or off to cause the shell
    to prevent overwriting existing files or not, as you wish.


    > There are lots of shell options having to do with many, many features of the
    shell.TheThey are all listed in Appendix B, "Built-In Command Summary," so you
    can refer to them.The exercises will tell you when you need to use one of them.


    Run the following commands:


    ```

    set -o noclobber

    touch out out1

    cat out out1

    ```


    a) What does the error message mean?


    Now run these commands:'
