- pgno: 538
  md: '# Chapter 11: I/O and TRAP Processing 519


    c) What would have happened if you had created a function with these commands
    and run it, or had run the commands from the shell prompt, or dotted the script?

    Answer:You would have been logged out from your KornShell session!


    In all three situations listed, the exec command would have caused your interactive
    shell process to be replaced by the ls command, and when it terminated, you would
    have been logged out. When it finishes generating its output, the ls command internally
    does the equivalent of the shell''s exit command, logging you off the system.


    Self-Review Question 1 shows a somewhat more realistic way that you might make
    use of the exec command in a script.


    # 11.2.2 ANSWERS


    ```

    exec 3 file1

    exec 4> file2

    while read -ru3

    do    print -u4 "$REPLY"

    done

    exec 3<&-

    exec 4<&-

    ```


    a) What do the first two exec commands do?

    Answer:They open file1 for reading and file2 for writing.


    Although these look like commands to redirect I/O for the exec command, they do
    it for the program that runs exec. That is, if you run commands from the command
    line (*from an interactive shell*), they open fds 3 and 4 for the interactive
    shell you are running, but if you do them from inside a script, they take effect
    for the code inside the script. Doting a script or running a function with these
    commands in them would have the same effect as entering execs from the command
    line.'
  merge: -1
  img_proc: true
- pgno: 539
  md: '# 520 Lab 11.2: The exec Command


    Inside a script the standard I/O fds (0, 1, and 2) will be copies of those in
    effect in your interactive shell, but all fds greater than number 2 will be closed.
    However, all the interactive shell''s fds will still be open when control returns
    to it.


    ![](img/694fa9f0320e707804a4c650b96a09b4_539_0.png)


    +   b) What do the last two lines do?

    Answer:They close the two fds that were opened by the first command lines.


    LAB 11.2


    Closing files when you are finished with them is a good thing to do, although
    failing to do so will generally not have much effect on your life. Doing so prevents
    your program from doing more reads or prints using the fd until it is opened again.
    You saw that m&n is the syntax for connecting fd m to the same file or device
    as fd in Lab 2.3, "Redirect Input and Output." Now you can see that using a dash
    ( ) for n means that fd m gets closed and cannot be used for I/O.


    +   c) What does the -ru3 on the read command accomplish?

    Answer:It makes the command read from the first input file.


    The -r part says to treat backslashes ( \ ) at the ends of lines as normal characters
    rather than line-continuation characters. The u3 part says to read from fd number
    3. You could have typed this as -r -u3, if you prefer.


    > It''s always a good idea to use -r when you read from a file; line continuation
    is really designed for interactive use.


    ![](img/694fa9f0320e707804a4c650b96a09b4_539_1.png)


    +   d) What do the quotes around the reference to REPLY accomplish?

    Answer:They preserve the spacing in the lines being printed.


    The IFS variable was set to the empty string before entering the loop that does
    the shuffle so that no token splitting would be done by the two read commands
    inside the loop, and the print commands used to prevent the spacing from being
    lost in the output. The value of IFS is restored to its default value after doing
    the copying, so that the read command asking for the next two file names will
    do token splitting as required.'
  merge: -1
  img_proc: true
- pgno: 540
  md: '# Chapter 11: I/O and TRAP Processing 521


    Don''t try to use these commands to copy anything but text files. Trying to read
    and print non-ASCII character codes will almost always lead to unpredictable results.


    ![](img/694fa9f0320e707804a4c650b96a09b4_540_0.png)


    +   e) What is inefficient about the second version compared with the first version?


    Answer: In the second version, two shell commands are executed for every line
    of the input file, whereas the cp command executes no commands to do the copy.


    Shell commands, even built-in ones such as read and print, almost always take
    longer to execute than the equivalent machine language instructions inside an
    external "binary" command.


    ![](img/694fa9f0320e707804a4c650b96a09b4_540_1.png)


    The reason for using a shell program to read a file is so that you can do something
    special with its contents. If you can, use the external commands that came with
    your system, such as cp, mv, grep, sort, uniq, head, and tail to do "standard"
    things with files.


    +   f) What are four things the user could use to cause this script to stop executing?


    Answer: (.), q, Ctrl-D, or Ctrl-C.


    The program checks whether the user types a dot or a q as the first token on the
    command line, and exits the outer while loop (by executing return in either case).
    Because the outer while loop continues for as long as the read command returns
    true, the user can press Ctrl-D (or Ctrl-Z on DOS/Windows systems, whatever the
    user has set as his/her end-file character, to use the system''s stty stof command)
    to indicate end of input. Finally, if the user types Ctrl-C (or whatever her interrupt
    character is to use the system''s stty intr command), the program will terminate
    abruptly.


    +   g) What is the purpose of the print command at the end of the script?


    Answer: It positions the cursor properly in the case user presses Ctrl-D.


    Because the cursor does not move to the start of a new line in this case, the
    script does a print command if execution gets past the end of the outer while
    loop.'
