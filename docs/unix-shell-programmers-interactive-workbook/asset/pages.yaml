    The shell is very flexible letting you intermix string and numeric variables,
    which makes shell programming much easier to do than conventional programming
    languages like C, C++, and Java, in which every variable must have a declared
    data type, and the rules for what can be assigned to what are very rigid.The tradeoff
    is that it''s relatively easy to make mistakes in shell programs if you forget
    what variables hold types of values.


