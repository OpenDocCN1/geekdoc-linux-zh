    +   b) What does the -ld part of this command do?

    Answer: It specifies a long listing using directory names.


    By default, the ls command shows the contents of any directories you

    name on the command line, but the l option tells the command to list

    just the name of the directory instead. The l gives a long listing, which

    well let us verify whether we are looking at files or directories.


    +   c) Were there any files or directories named bin or fun in your home

    directory?

    Answer:Well, it depends! Here is what we want our interaction to look like:

    $ ls -ld bin fun

    drwx-xr-x 2 wickery users 1024 Oct 7 17:02 bin

    drwx----- 2 wickery users 512 Jun 17 17:19 fun

    $


    We are interested in the first and last three characters on these

    two lines. The middle parts will be different for you, depending on several

    issues that aren''t important to us here, such as your username and default

    permissions.


    The first four characters, drwx, say that the names bin and fun are direc-

    tories for which you have read, write and execute permissions. If the first

    letter is anything other than a d, it means that you have something other

    than a directory with the name bin (or fun), probably a regular file. If

    that is the case, you have a regular file with one of these names, and you

    should change its name using an command.


    The two directories we are setting up here are going to hold two kinds of

    shell programs that you write, scripts (which go in bin) and functions

    (which go in fun). Don''t use a different name for bin unless you have

    a really good reason for doing so. It''s the standard name to use for the

    directory that holds your own copies of executable programs, as as the

    kornShell scripts you will be writing.'
