- pgno: 360
  md: '# Chapter 7: Basic Tests 341


    When the print command (it will be the second one) is executed, the shell will
    substitute -a for the reference to the variable l, and the command without the
    double dashes would look like the following:


    ```

    print "-a" is not the name of a month.

    ```


    Remember, the shell removes quotes before running a command, so the print command
    receives the -a (without any quotes) as its first parameter because it starts
    with a dash. Because -a is not a valid option for print, the user will get an
    error message from print instead of the message from your script.


    Always write your code so that it behaves “reasonably,” no matter what the user
    types! (I know, you already saw this advice, but it''s important).


    ![](img/694fa9f0320e707804a4c650b96a09b4_360_0.png)


