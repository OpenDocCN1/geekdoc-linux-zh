- pgno: 519
  md: '# 500 Lab : The read and printf Commands


    g) What does the expression (( chars += $(#REPLY)) )) compute?


    Answer: It adds the number of characters in each line to the variable chars.


    Because there is no field splitting when the read command at the top of the loop
    is executed, REPLY contains all the characters in each line, including all spaces
    and tabs. (We''ll deal with those new lines later.) We covered the use of $(#
    ... ) to find the number of characters in a string in Exercise 10.3.3, “Work with
    Strings and Substrings,”


    h) Does the shell field splitting when the read command inside the loop is executed?


    Answer: It uses the default value of IFS to field splitting “in the usual way.”


    The idea here is by manipulating the value of IFS you can get the first read to
    input each line as an image of what is in the input file (except for the new lines)
    and then to get the second read to split the line into words, where a word is
    defined as a sequence of non-whitespace characters.


    ![](img/694fa9f0320e707804a4c650b96a09b4_519_0.png)


    When a read command does field splitting, it normally treats a backslash \) at
    the end of a line as a continuation marker and appends the “next” line of the
    file to the first one automatically.The -r option suppresses this behavior and
    is used in mywc so that whatever looks like a line in the file is counted as such.


    i) What does the expression, (( words += $(#inWords[@]) )) compute?


    Answer: It adds the number of elements in the array inWords to the integer variable
    words.


    You can infer from this line and the output of the program that the second read
    command has split the input line into tokens and stored them as separate values
    in the array inWords. This is an extension of the idea of having multiple input
    buffers already discussed in the present exercise. By using ${#inWords[@]}, which
    was covered in Exercise 10.3.3, “Work with Strings and Substrings,” we get a count
    of how many elements there are in the array, which is the same as the number of
    tokens in the line.'
  merge: -1
  img_proc: true
- pgno: 520
  md: '# Chapter 11: I/O and TRAP Processing 501


    j) What is it in the code that makes the variable inWords an array?

    Answer: It''s the -A option on the second read command.


    This option is a very useful feature for this type of application. The variable
    you name is automatically made into an indexed array with the number of elements
    equal to the number of tokens obtained by splitting the input line.


    > Don''t confuse the -A option of the read command with the -A option of the typeset
    command. With read you get an indexed array, but with typeset you get an associative
    array.


    k) What is the purpose of the statement typeset IFS?


    Answer: It guarantees executing this function will not change the value of IFS
    from whatever value it had beforehand.


    Imagine an unwitting user who has set IFS to a colon (:) in order to split the
    fields, in for example, the PATH variable, then runs mywc. The user would not
    automatically expect that running your function would affect his or her working
    environment. A change to IFS could be confusing. The typeset command makes IFS
    a local variable (Exercise 6.1.4, “Control the Scope of Variables”), so changing
    it the function will have no effect on the user''s environment.


    If you wrote mywc as a script instead of as a function you wouldn''t need to worry
    about saving and restoring the value of IFS. The shell gives IFS its default value
    at the beginning of every script it runs. Functions, however, normally share this
    variable (and all other variables) with the environment from which they run.


    # 11.1.2 ANSWERS


    a) What variable is affected by the set typeset command?

    Answer: Just the variable x.'
  merge: -1
  img_proc: true
