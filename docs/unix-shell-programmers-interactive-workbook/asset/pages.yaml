    command is true, it is a waste of time to execute the second and third.


    ![](img/694fa9f0320e707804a4c650b96a09b4_391_0.png)


    Keep your thinking about efficiency in perspective. You are about to spend more
    time making a function more efficient than will ever actually be saved, even if
    you run the function a million times.


    Sometimes it''s not just inefficient to execute all of the commands in a loop''s
    body, it may be logically wrong. This exercise will show two ways to "short-circuit"
    a loop that you might use either for efficiency or for logical correctness.


    The first command is continue. When the shell encounters this command in a loop,
    it skips all the remaining commands in the loop body and runs the loop test commands
    again. Some people like to think of this as jumping to the done command, which
    in turns takes you back to the top of the loop to test whether to start a new
    iteration or not.


