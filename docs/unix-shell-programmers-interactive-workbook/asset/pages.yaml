- pgno: 225
  md: '# Lab 4.3: Quoting Variables


    [304]:


    What you have stumbled onto here is the special feature of the backslash when
    it is the very last character on the line. In this case, the backslash quotes
    the end-of-line character itself. The shell removes the end-of-line character
    from the command line and prompts you to continue typing the command.


    In this example, you would have to type another backslash and space on the command-continuation
    line to get the new value of PS1 to end with a space.


    You can use backslash at the end of a line to let you type long lines-without
    having some of your input scroll to the left and become invisible.


    ![](img/694fa9f0320e707804a4c650b96a09b4_225_0.png)


    Run the following command:


    ```

    y=hello; print "$y" ''$y'' \$y "\$y" ''\$y'' ''\$y'' \

    :Your interaction should look like the following:

    [304]: y=hello ; print "$y" ''$y'' \$y "\$y" ''\$y'' ''\$y'' \

    hello $y $ $ $ \hello \

    [305]:

    ```


    The first output (hello) is the value of y, which shows that variable-substitution
    takes place inside double quotes, as you already know.


    The second and third outputs ($ $y) show that the backslash both hide the special
    meaning of the dollar sign, and it is printed just like any other character.


    The fourth output ($y again) shows that the backslash hides the special meaning
    of the dollar sign, even inside double quotes.


    The fifth output (\$y) shows that single quotes remove the special meaning of
    both backslash and dollar sign.'
  merge: -1
