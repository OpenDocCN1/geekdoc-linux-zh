    The speedup of a program is given by the ratio of the time to execute it before
    an improvement is made, divided by the time to execute it after the improvement
    is made. If you subtract 1 and multiply by 100, you get a "percent faster" measure.
    (f812 is 21 percent faster than f811.) Using the number of commands as a measure
    of time to execute a program is not totally accurate because commands don''t all
    take the same amount of time to run.


