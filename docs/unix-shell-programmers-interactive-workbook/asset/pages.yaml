    present multiple times) in any particular UNIX file name is sometimes a point
    of confusion for people coming from a DOS/ Windows background, where a dot is
    significant because it introduces the extension that identifies the type of file.
    UNIX programs often look at a file''s extension to decide what to do with it but
    not, for example, to find out whether a file is executable.


