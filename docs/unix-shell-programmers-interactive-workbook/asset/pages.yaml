    \ but they are not identical, and their spacing is different. The reasons for\
    \ the differences can be attributed to the difference between how the shell's\
    \ read command operates compared with the logic of the C language code that was\
    \ used to generate the wc command. The matter of how the numbers are spaced is\
    \ not important here, but the fact that the final numbers output by the two programs\
    \ are different is significant: The new line characters (the ASCII \"linefeed\"\
    \ code) at the end of each line are removed by the read command, but the system's\
    \ wc reads and counts them the same as any other characters in the file. If you\
    \ used a non-UNIX editor to prepare your data file, there would be both an ASCII\
    \ \"carriage return\" code, as well as a new line at the end of each line, and\
    \ your results would differ accordingly (The values would be 59 and 56, instead\
    \ of 56 and 53).\n\n+   f Does the shell do field splitting when the read at the\
    \ top of the loop is executed?\n\nAnswer: No, because IFS is the empty string\
    \ whenever this read command is executed.\n\nThe empty string is assigned to IFS\
    \ before the while loop is entered the first time, then again as the last statement\
    \ of the loop, returning to the top to execute read again."
