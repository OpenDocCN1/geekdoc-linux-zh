    # 6.1.2 WRITE ARITHMETIC EXPRESSIONS


    You may not be too surprised to learn that the reason for having arithmetic variables
    is so that you can do arithmetic with their values. The rationale for doing arithmetic
    in scripts or functions will become more evident after you learn how to get the
    values for variables from files or by interacting with the user, which you will
    see in later chapters. For now, you can find how to perform arithmetic calculations
    while remaining in the rather contrived realm of using interactive commands to
    assign values and print results.


    The KornShell provides two ways to write arithmetic expressions. One is to use
    a special built-in command, let, and the other is to enclose the expression you
    want to compute in double parentheses.'
