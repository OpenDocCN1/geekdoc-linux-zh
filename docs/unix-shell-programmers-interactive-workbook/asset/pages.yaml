  md: '# 350 Lab 7.2: The [[ COMMAND... ]] OPERATOR


    d) Could this program have been written as a script instead of as a function?


    # 7.2.3 WRITE LOGICAL EXPRESSIONS


    So far, you have discovered what the unary operators, -d, -e, and -f do. For this
    exercise, you will use some other unary operators, plus binary operators that
    compare two things. The following table, which is extracted from Appendix B,"Command
    Summary,” lists the operators, also called testing primitives, that you will use
    here:


    | -d name | is the name of a directory |

    | -e name | is the name of a file or directory that exists |

    | -f name | is the name of a regular file |

    | -r name | is a file or directory that the user can read |

    | -w name | is a file or directory that the user can write |

    | -x name | is a file that the user can execute or the name of a directory the
    user can browse |

    | -o name | is a shell option that is currently set |

    | string1 == string2 | string1 is the same as string2 |

    | string1 != string2 | string1 is not the same as string2 |

    | name1 -nt name2 | The file name1 was modified more recently than ("newer than")
    the file name2, or there is no file name2 |

    | name1 -ot name2 | The file name1 was modified before ("is older than") the file
    name2, or there is no file name2 |


    You can use the && and || operators that you have already seen for command grouping
    in test expressions.'
