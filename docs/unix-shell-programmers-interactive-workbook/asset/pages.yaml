    \ signal 1 tt2 &\n[11055]:\n```\n\nFirst, we see that an INT signal is caught\
    \ by the script, and when we deliver a USR1 signal, for message prints in the\
    \ usual way. for which the script has not set a trap, the program terminates immediately,\
    \ and the “Exiting Normally” message does not get printed. However, the EXIT trap\
    \ still gets handled, even though the script did not reach the end.\n\nThe EXIT\
    \ trap is great for “cleaning up,”even when an unusual condition prevents a script\
    \ from doing its full job.\n\n![](img/694fa9f0320e707804a4c650b96a09b4_558_0.png)"
