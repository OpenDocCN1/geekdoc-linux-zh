  md: '# 492 Lab : The read and print Commands


    LAB 11.1nline delimiter, and the -u option will be covered when we look at the
    exec com-mand in the next lab. As you might infer from the -u option of the print
    com-mand, it is used to read to get its input from an fd other than zero (stdin).


    # 11.1.2 FORMAT OUTPUT


    The KornShell provides three different ways to control the appearance of your
    programs'' output. You have already seen the simplest form of control you have,
    which is to embed control codes as tabs (\t) and new lines (\n) into the messages
    that you print. However, the shell provides two other ways to control output formatting,
    one of which is based on options to the types command, and the other of which
    is provided by the printf command, which is patterned on a statement of the same
    name in the C programming language.


    You can use types to affect how a variable''s value is kept internally, and this
    will (normally) determine how the variable looks when it is printed using the
    print command. If you use printf, you provide a format string as the first parameter
    of the command, and the format string describes the remaining parameters are to
    be formatted for printing. If you use types to establish how a variable is stored
    internally by the shell, then print the variable using printf, the printf format
    string controls how the internal value will be printed but does not affect the
    internal value in any way.


    Both types and printf provide more features than we will cover here. For further
    details, consult Appendix B, "Built-In Command Reference."


    Normally, the values you print are left-justified, and you can use types''s -R
    option to make a variable right-justified. To see this, enter the following commands:


    ```

    a1=a a2=aa a3=aaa a4=aaaa a5=aaaaa

    for x in $a1 $a2 $a3 $a4 $a5; do print "$x"; done

    types -R6 x

    for x in $a1 $a2 $a3 $a4 $a5; do print "$x"; done

    ```'
