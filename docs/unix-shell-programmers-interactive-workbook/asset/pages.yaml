- pgno: 230
  md: '# CHAPTER 5


    # PARAMETERS


    The values of the parameters that you pass to a command control whatnthe command
    does.


    CHAPTER OBJECTIVES

    In this chapter


    You have already seen that a command consists of a command name followed by some
    number of parameters (possibly none). The parameters are subdivided into option
    parameters (also called option letters or just options) normally appearing to
    the left of the positional parameters. It doesn''t matter whether the command
    is a shell built-in, a script, a function, or a command written in a language
    like C, C++, or Java—the shell passes all of the parameters you type on the command
    line to the command as a list of values.


    In this chapter you will see how you can write code that uses the list of parameter
    values that the shell passes to a script or function. First you will learn about
    the special variables that you can use inside a script or function to find out
    how many values there are in the parameter list and what their values are. Then
    you will learn how to use a special command inside a script or function to process
    option parameters in the “standard way.”'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# LAB 5.1


    # PARAMETERS


    # LAB OBJECTIVES


    +   After this lab, you will be able to:

    * Verify Your Set-Up

    * Pass Parameters to a Function or Script

    * Use Special Parameter Variables ( # @ * )

    * Use set to Assign Positional Parameters

    * Use shift to Access Positional Parameters


    You have already seen parameters from a user''s point of view. They are the tokens,
    such as file names, that you type after the options part of a command string.
    In this lab, you will see how functions and scripts find out what parameters are
    passed to them using a special set of variables provided by the shell.


    # SETTING UP FOR THIS LAB


    You will be writing several scripts in this lab, so you should go over the material
    in Lab 1.3, "Editing and Running Scripts and Functions," if you haven''t already
    done so, before you proceed. The first exercise checks to be sure you are set
    up correctly.'
  merge: -1
