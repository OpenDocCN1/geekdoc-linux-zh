- pgno: 438
  md: '# Chapter 9: The case and select Statements 419


    # LAB 9.1 SELF-REVIEW QUESTIONS


    To test your progress, you should be able to answer the following questions:


    +   1) What does the following line do inside a case statement?

    x | xx | xxx) print oh! ;

    a) Nothing, because you can''t have more than one pattern before the parentheses.

    b) Nothing, because you have to use left parentheses before the parentheses.

    c) It always prints oh!.

    d) It never prints oh!.

    e) It prints oh! if the value of the control variable is x, xx, or xxx.


    +   2) What is the pattern, (*), used for in case statement?

    a) Nothing, it is never used.

    b) It marks the beginning of the list of patterns.

    c) It marks the end of the list of patterns.

    d) It matches any value and may be used after all valid values have been tested
    to detect errors, unexpected values, or values that can be handled in default
    way.

    e) It is used to tell the shell that an error has occurred.


    +   3) How many patterns can you have for one command list in a case statement?

    a) None.

    b) One.

    c) Two.

    d) Three.

    e) Any number greater than zero.


    +   4) How many command lists can you have in a case statement?

    a) None.

    b) One.

    c) Two.

    d) Three.

    e) Any number greater than zero.'
