- pgno: 215
  md: '# LAB 4.3 EXERCISES


    # 4.3.1 QUOTE THE VALUE PART OF AN ASSIGNMENT


    The shell uses spaces and tabs to tell where to separate the parts of a command.
    If you want to put spaces inside a part of a command, such as the value part of
    a variable assignment, enclose it in quotation marks.


    The shell understands three different kinds of quotation marks, single (''''),
    double (""), and back (``). This exercise deals with double and single quotes,
    the ones that are normally on the same key of the keyboard. Backquotes were used
    for command substitution in the Bourne Shell and are recognized by the KornShell
    for compatibility, but as you will see in Lab 10.2.1, "Command Substitution,"
    the KornShell provides a better way to do command substitution than using backquotes.


