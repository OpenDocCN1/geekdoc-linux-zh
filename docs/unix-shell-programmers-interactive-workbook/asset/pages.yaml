    # 2.1.3 DOCUMENT A PROGRAM''S SYNTAX


    When you write a program, you should tell people what it does and how to use it.
    On UNIX systems, the traditional way to do this is to write a manual page containing
    the documentation for your program, written in a standard format. As we pointed
    out earlier, people who want to know how to use the program look at the manual
    pages using the man command.


    You are probably already familiar with man pages, because they are the standard
    way to document UNIX commands.


    In this exercise, you will review the notation used in the "Synopsis" section
    of a man page, and you will practice writing your own.


    You will see in Chapter 8, "Option Processing," that being able to write a standard
    synopsis for a command translates directly into writing commands that allow users
    to use options and parameters to control your command.


    > There is a trend moving away from traditional man pages toward user documentation.
    Also, programs with graphical user interfaces, unlike the command-line programs
    you will be writing, often include much (if not all) of their user documentation
    in the program itself


