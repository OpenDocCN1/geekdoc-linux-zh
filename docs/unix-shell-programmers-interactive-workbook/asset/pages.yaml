    [1031]: s1021


    Hello!

    It is now Wed Aug 5 11:57:00 EDT 1998.

    This script was last run never.


    [1032]:


    The here document uses command substitution in the "It is now" message and uses
    variable substitution in the "This script was" message. The variable last_time
    has the value never, which is appropriate for the first time the script is run.'
