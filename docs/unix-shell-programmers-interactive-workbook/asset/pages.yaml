  md: "# FOR EXAMPLE\n\nYou could use the following function to test whether a parameter\
    \ is the name of a regular file that is also readable:\n\n```\n# f723 -- Test\
    \ if parameter 1 is a readable regular file\nfunction f723 {\n  [[ -f \"$1\" &&\
    \ -r \"$1\" ]] && {\n    print \"$1 is a readable regular file.\"\n    return\n\
    \  }\n  print \"\\$1\" is not a readable regular file.\n}\n```\n\nIn this example,\
    \ the && operator is used twice. Inside the double brackets, it performs a logical\
    \ \"and\" between the -f and -r tests; the second time it is used in the way you\
    \ have already seen (Lab 3.2, \"Command Groups\") to perform a logical \"and\"\
    \ between the double bracket and the print/return command group inside the braces.\n\
    \nThe two uses work just about the same way, with the shell using true/false values\
    \ to decide how much work to do. The double bracket command has a true exit code\
    \ if both the -f and -r tests are.\n\nAs with && used for command grouping, the\
    \ shell evaluates the right-hand side of a && only if the left-hand side's result\
    \ is true.\n\n> If you are not familiar with the ideas of file modification times\
    \ or the permission bits that UNIX systems associate with files (read, write,\
    \ execute), you should consult your documentation. Likewise, if you are running\
    \ KornShell on a non-UNIX system that does not have similar file system capabilities,\
    \ the tests used in this exercise may not work for you. For example, U/WIN running\
    \ a FAT file system cannot mimic all these features, although U/WIN does fine\
    \ with an NTFS file system.\n\n![](img/694fa9f0320e707804a4c650b96a09b4_370_0.png)\n\
    \nPut f723 in your fun directory, and run the following commands:\n\n```\nf723\
    \ ~/.kshrc\nf723 ~/bin\nf723 \"A figment of your imagination\"\n```"
