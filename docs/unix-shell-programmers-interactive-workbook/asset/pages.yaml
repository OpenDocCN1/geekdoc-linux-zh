  md: '# Chapter 6: ADVANCED VARIABLE USAGE 313


    e) What does ${venus[@]} print?

    Answer:The values of all the initialized elements of the associative array.


    The shell prints this list of values in just the same way as when you evaluate
    it ${...[@]} for an indexed array. Note, however, that the values are not listed
    in any obvious sequence.


    f) What does ${!venus[]} print?

    Answer:The names of the subscripts that have been used to assign values to elements
    of the array.


    Note that the names of the subscripts are printed in the same sequence as the
    sequence in which the values were printed before. However, the sequence is neither
    alphabetical nor the sequence in which they were first used. The shell performs
    a calculation on each subscript used with an associative array to make it efficient
    to locate any element.


    g) What does ${!venus} print?

    Answer:It prints the name of the variable.


    This may not seem too useful a feature; in this case, it really isn''t. On the
    other hand, if you have used a variable as a name reference for another variable
