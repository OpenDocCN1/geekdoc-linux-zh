- pgno: 127
  md: '# 108 Lab 2.3: Command Syntax


    The shell uses spaces to tell it how to divide the parts of a command line into
    syntactic elements. If you want to link fds, the fd number, the >, and the ampersand
    must all be a single syntactic element with no spaces within it.


    ![](img/694fa9f0320e707804a4c650b96a09b4_127_0.png)


    +   c) Why there be a space between the ampersand and the 1?

    Answer: There is no ambiguity. Once the shell sees 2&, it knows that the next
    thing has to be an fd number, and it doesn''t matter whether there is a space
    before it or not.


    Pay attention to where spaces are required, where they are optional, where they
    are prohibited in command lines. These are all common sources of syntax errors.


    ![](img/694fa9f0320e707804a4c650b96a09b4_127_1.png)


    +   d) What is the difference between the following two commands:

    cat out1 out2 >out3 2& > 1

    cat out1 out2 2& > 1 out3


    Answer: The first command redirects stdout (fd 1) to out3, and then redirects
    stderr to the same place as fd 1 (i.e., to out3 also). The second one redirects
    stderr to the same place as fd 1, which is still connected to your screen, then
    it redirects-out to the file out3. The net effect of the second command is the
    same as the following command:

    cat out1 out2 > out3


    Remember the left-to-right order that the shell uses to process redirection symbols.
    The fd association is done in left-to-right order, just like all other redirection
    operations.


    # 2.3.5 ANSWERS


    +   a) What effect did the exclamation mark after the word document have?

    Answer: It had no effect; it is part of the content of the here document.


    The marker symbol can appear inside the here document, but when it is the only
    thing on a line, it marks the end of the here document.


    LAB 2.3'
