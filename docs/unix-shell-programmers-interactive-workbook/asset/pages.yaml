- pgno: 524
  md: '# Chapter 11: I/O and TRAP Processing 505


    If the \n wasn''t inside quotes, the shell would treat it as an escaped n because
    of the special meaning of the backslash character, and just the character immediately
    after the slash (the \n inside quotes would have been passed to printf. Putting
    the \n inside quotes removes the special meaning of backslash, and printf receives
    both the backslash and the n as part of the format string parameter.


    In addition to \n for new line, the printf and print commands recognize the following
    escape conventions, which are based on the C language:


    +   \a Alert (bell character)

    \b Backspace

    \c Do not put a newline at the end of the line. Anything this code will be skipped.

    \f Formfeed (for printers)

    \n Newline

    \t Horizontal Tab

    \v Vertical Tab

    \\ Backslash itself

    \E Escape. Used to introduce ANSI escape sequences, such as \E[2J to clear the
    screen

    \0n The character with ASCII code n, given in octal, such as \007 for the bell
    character.


    > Don''t use the \c code with printf because that command never prints a new line
    unless you expressly put it in the format string or in one of the values to be
    printed. Likewise, you don''t need to use \n with print (unless you want to print
    extra new lines) because that command always puts a new line at the end of what
    it prints (unless you use -n option.)


    ![](img/694fa9f0320e707804a4c650b96a09b4_524_0.png)


    “If we had some tea


    ![](img/694fa9f0320e707804a4c650b96a09b4_524_1.png)'
