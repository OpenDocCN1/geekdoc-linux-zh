    e) What would happen to optpletter if the getopts command were run again?


    # 5.2.2 USE THE OPTIND VARIABLE


    The getopts command keeps track of which option parameter it is processing by
    means of a variable named OPTIND ("option index"). Each time getopts finishes
    with the option letters in a parameter, it adds one to the value of OPTIND, which
    means that when you finish processing a command or function''s options, OPTIND
    will be the index of the first positional parameter on the command line.


    a) What are the values of OPTIND and @ after completing the previous exercise?


    You can assign a value to OPTIND, and the next time you run getopts, it will start
    looking for option letters in the parameter number that you assigned to OPTIND.
    Almost always, you assign the value I to OPTIND because you want to process the
    options over again again from the beginning. But you can use any number you want,
    depending on the nature of the program you are writing.'
  merge: -1
  img_proc: true
