    **LZ** Left-justifies and strips leading zeros. n specifies field width.

    **R** Right-justifies. n specifies field width.

    **RZ** Right-justifies. n specifies field width, and fills with leading zeros.

    **Z** Same as RZ

    **r** readonly

    **x** export

    **H** UNIX system-to-host operating system pathname mapping.

    **t** User-defined tag


    **For more information:** see Chapter 6 (Advanced Variable Usage) and Chapter
