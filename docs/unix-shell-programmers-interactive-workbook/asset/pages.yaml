- pgno: 173
  md: '# Lab 3.2: Command Groups


    ```

    hello

    Sunday

    Monday

    Tuesday

    Wednesday

    Thursday

    Friday

    Saturday

    $

    ```


    LAB 3.2


    Because print doesn''t read from stdin, the redirection goes to the first command
    inside the command group that does read from stdin, the cat command. So the print
    command prints "hello" and then the cat command runs and copies the data file
    to stdout.


    +   * Which of the following two command lines do you think would run more efficiently?

    print hello; print again} > out

    print hello > out; print again >> out


    Answer: Both command lines accomplish exactly the same thing, but it is more efficient
    to redirect the entire group, as in the first command line, than it is to separate
    redirections within the group.


    Setting up redirection involves interacting with the I/O system each time it is
    done, so doing it once is faster than doing it twice. On the other hand, command
    grouping is done internally by the shell, and doesn''t take as much time as an
    interaction with the I/O system.


    > You will find that there will often be more than one way to do something, but
    that picking the more efficient way will affect the speed of your programs dramatically.
    You can''t see the difference in this case unless you''re using a really slow
    computer, but there will be plenty of cases where you can easily see the effects
    of how efficiently you do something because you can easily set up loops that make
    individual commands run many, many times, which will magnify seemingly small speed
    differences


    ![](img/694fa9f0320e707804a4c650b96a09b4_173_0.png)


    # 3.2.3 ANSWERS'
