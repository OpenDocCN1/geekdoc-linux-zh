  md: '# 362 Lab 7.2: The [[ COMMAND... ]] OPERATOR


    c) What is the result of the double-bracket command?

    Answer:The result of the double bracket command is the opposite of the result
    of the expression inside the parentheses, because of the exclamation mark.


    Note that the exclamation mark applies to the result of evaluating all the tests
    inside the parentheses. All four of the inner tests will be true for the exclamation
    mark to make the double-bracket return false.


    ![](img/694fa9f0320e707804a4c650b96a09b4_381_0.png)


    Always put a space or open parentheses after an exclamation mark or you will get
    a syntax error from the shell.


    d) Is the message "/home/vick/bin is good" appropriate?

    Answer:Yes, assuming that "good" means that the directory exists and that the
    user can read, write, and browse it. (Substitute the pathname of your own home
    directory, of course).


    If everything inside the parentheses is true, the double bracket will return false,
    so the shell will run the print command because of the rule for evaluating |||
    in command groups.


