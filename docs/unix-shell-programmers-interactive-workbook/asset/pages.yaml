    +   h) Why is the parameter in quotes? (There are two answers to this)

    Answer:The first answer is that we want the entire parameter to be the format
    string, so the quotes prevent token splitting due to the embedded space. The second
    answer is that the \n has to be inside quotes to be treated as a newline character.


    Without quotes, the format string would have been "Hello," so is all that would
    have printed. Unless the format string contains control strings (indicated by
    percent symbols), printf will not look for additional parameters to print. Because
    "Hello," has no percent symbols in it, that''s all that prints.'
