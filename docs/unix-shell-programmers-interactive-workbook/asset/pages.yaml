- pgno: 103
  md: '# LAB 2.3


    # # REDIRECTING STANDARD INPUT AND OUTPUT


    +   ### LAB OBJECTIVES

    After this lab, you will be able to:

    - Redirect stdin and stdout (< and >)

    - Control Clobbering! (>> and |)

    - Redirect stderr (2>)

    - Link file descriptors for Redirection (n&)

    - Use a here document for stdin (<<)


    Every command that the KornShell runs has three standard I/O devices that it can
    use as it executes:


    | stdin | The standard input device, normally the user''s keyboard. |

    | stdout | The standard output device, normally the window in which ksh is running.
    |

    | stderr | The standard error device, also normally the window in which ksh is
    running. Used for error messages. |'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Each of these devices is associated with a small integer, called a file descriptor,
    or fd, which are 0, 1, and 2 for stdin, stdout, and stderr, respectively. You
    will see how to do I/O using other fds than these three in Chapter 11, "I/O Trap
    Processing." In this lab, you will learn the syntax for getting the shell to connect
    the standard devices to files instead of the keyboard and screen.


    There are six basic symbols you can use to tell the shell to redirect I/O for
    a command. They can appear anywhere within the command, but by convention, they
    appear at the right end.


    +   < filename Connect stdin to filename instead of the user''s keyboard.

    > filename Connect stdout to filename instead of to the console window. The file
    will be overwritten if it already exists.

    >| filename Same as >, but works even if the shell''s noclobber option is set.

    >> filename Connect stdout to filename, but instead of overwriting the file, append
    text to whatever is already there.

    & n Link two file descriptors so that they refer to the same file.

    << symbol Used for here documents.


    # LAB 2.3 EXERCISES


    # 2.3.1 REDIRECT stdin AND stdout (< AND >)


    The UNIX cat command, without any options or parameters, copies stdin to stdout.
    Thus, it provides a convenient tool for practicing I/O redirection.


    Use cat without any options or parameters, and observe that it writes out whatever
    you type in. Use Control-C (^C) or Control-D (^D) to stop.'
  merge: -1
  img_proc: true
