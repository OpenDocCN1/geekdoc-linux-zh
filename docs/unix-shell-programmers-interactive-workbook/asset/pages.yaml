- pgno: 137
  md: 'd) What does the shell do first, break the command line into commands, or process
    redirection symbols?


    For this exercise, there is no difference between typing all three commands as
    part of one command line and typing three separate command lines. Each command
    begins executing when the one to its left finishes. You will see that this feature
    can be useful later on, but for now, the semicolon is just a piece of syntax that
    lets you string multiple commands together on one command line.


    # 3.1.2 PARALLEL EXECUTION (&)


    Note that this exercise is affected by two shell options. Run the following command
    before you start this exercise to be sure these options are set “correctly,” at
    least for now:


    ```

    set -o monitor +o notify

    ```


    The ampersand is used to separate commands that you want the shell to run in parallel.
    If the last (or only) command on a line is followed by an ampersand, the shell
    will prompt you for another command line without waiting for the previous command
    to finish.


    # FOR EXAMPLE


    Try this command line:


    ```

    print hello & sleep 2 & print hello again &

    Wait at least 2 seconds after you type this command, and press Enter again. The
    numbers in square brackets are job numbers.

    ```'
