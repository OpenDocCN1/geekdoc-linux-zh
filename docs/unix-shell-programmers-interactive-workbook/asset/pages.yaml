- pgno: 620
  md: '# # Learn Through Doing! It''s Fast, Fun, and Easy!


    # # UNIX

    INTERACTIVE WORKBOOK

    SERIES


    Each title includes a **FREE** web-based companion training module that features:


    +   - A home page that contains links to all of the other training modules in
    the series.

    - A Message Board where authors and students can interact informally.

    - Interactive questions and answers available.

    - Author''s Corner for updates, new information, etc.

    - A feedback section for students to help shape the future of the series.


    # ### UNIX User''s

    Interactive Workbook


    # ### UNIX Shell Programmer''s

    Interactive Workbook


    JOHN MCMULLEN


    CHRISTOPHER VICKERY


    1999, 640PP, 0-13-09820-6


    1999, 460PP, 0-13-02006-6


    A quick, friendly, hands-on tutorial on UNIX. This interactive workbook covers
    everything UNIX users need to get producing fast! For everyone who needs to learn
    the basics of UNIX.


    Includes CBT Systems UNIX training module on CD-ROM! This interactive workbook
    is for UNIX and NT users and sysadmins who need to know shell programming and
    looking for ways to automate as many tasks as possible. Learn how to customize
    the command line; build scripts; execute internal and external commands; use token
    splitting and much more.


    # ### UNIX Awk And Sed

    Command Line

    Interactive Workbook


    # ### UNIX Web Server

    Administrator''s

    Interactive Workbook


    PETER PATSIS


    JIM MOHR


    1999, 500PP, 0-13-08226-5


    1999, 624PP, 0-13-02005-6


    Learn to solve practical problems with awk, sed and grep. Begin with a hands-on
    introduction to regular expressions and grep. Through interactive Labs, learn
    the fundamentals of sed, including addressing commands, scripting and much more.


    This is cup-to-run Apache — all of it hands-on and interactive! Learn how to compile,
    install and configure Apache. Discover how to develop and organize a site, implementation
    strategy and indexing, extent HTML with graphics, images, frames and tables; secure
    a system with firewalls. Includes OpenLinux Lite with Apache on CD-ROM.


    # ### UNIX System Administrator''s

    Interactive Workbook


    JOSE KAPLENEN


    1999, 640PP, 0-13-08138-7


    # ### BOOK WITH CD-ROM


    This interactive workbook focuses on helping users develop the “thinking skills”
    and understanding UNIX system administrators need. Includes CBT Systems System
    Administration training module on CD-ROM


    PRENTICE HALL PR


