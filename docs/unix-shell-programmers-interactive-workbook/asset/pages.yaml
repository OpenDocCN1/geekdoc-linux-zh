    problem could be because (1) you didn''t use the chmod +x to make the script executable,
    (2) you used a different name for the command when you built it, (3) your current
    directory is not one of the places the shell looks to for commands, or (4) there
    is an invalid ''she-bang'' (#!) in the first line of your script. In the case
    of (3), you can use /mn to run the command, and in the case of (4), you should
    refer to Chapter 1, “Setting Up,” to see how to use she-bang, if you need it at
    all.


