    > LAB OBJECTIVES

    After this lab, you will be able to:

    * Use the read Command

    * Format Output


    In this lab, you will learn how to "get inside" a text file so that you can perform
    operations using its contents. Until now (except for the select statement), you
    have seen only how to get a file''s contents sent to other programs, such as the
    filter programs you used in Lab 3.1.3, "Pipelines," for processing. However, your
    scripts and functions can read the contents of a text file just as well as any
    other program can by using the shell''s built-in read command.


    Also, the print command by itself does not make it very easy for you to format
    the output generated by your program—for example, to make columns of numbers line
    up neatly. This issue is not so important when the output consists of messages
    you want to display for the user to read, but it becomes significant when you
    need to generate a report that people read "off line," where appearances matter
    more. The printf command and some options for the typeset command will give you
