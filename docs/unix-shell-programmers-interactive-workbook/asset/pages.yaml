  md: '# FROM THE EDITOR


    Prentice Hall''s Interactive Workbooks are designed to get you up and run-ning
    fast, with just the information you need, when you need it.


    We are certain that you will find our unique approach to learning simple

    straightforward. Every chapter of every Interactive Workbook begins

    with a list of clearly defined Learning Objectives. A series of labs make up

    t heart of each chapter. Each lab is designed to teach you specific skills

    in the form of exercises. You perform these exercises at your computer

    and answer pointed questions about what you observe. Your answers will

    lead to further discussion and exploration. Each lab ends with multi-

    ple-choice Self-Review Questions, to reinforce what you''ve learned.

    Finally, we have included Test Your Thinking projects at the end of each

    chapter. These projects challenge you to synthesize all of the skills you''ve

