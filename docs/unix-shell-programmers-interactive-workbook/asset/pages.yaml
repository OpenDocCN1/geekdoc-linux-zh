  md: '# LAB 10.2


    # # COMMAND

    SUBSTITUTION


    # LAB OBJECTIVES


    +   After this lab, you will be able to:

    - Use Command Substitution for the Value of a Variable

    - Use Command Substitution for the Value of a Parameter


    You already know that a command sets an exit code, a number that is normally interpreted
    as a true/false value (0 or not-0, respectively) that you can test to see whether
    the command was "successful". You also know that commands normally write messages
    to stdout, which you can redirect to a file if you want to save it. In this lab,
    you will see how to use the messages that a program writes to stdout as values
    that can be assigned to variables or passed as parameters to scripts. The exercises
    will suggest some ways that this capability can be used; once you have mastered
    the concept, you will find a surprising number of situations where this is a valuable
    tool.'
