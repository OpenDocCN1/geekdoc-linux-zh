- pgno: 356
  md: '# Chapter 7: Basic Tests 337


    ```

    [7005]: if print hello || |

    > print there

    > then print again

    > fi

    hello

    again

    [7006]:

    ```


    the print there command does not run because it is joined to the print command
    with the || (logical or) operator. The fact that the two print commands are entered
    on separate lines do not make them separate commands. Rather, they are a command
    group, as defined in Chapter 2, "Command Syntax." The "there" was not printed
    because of the rule for evaluating commands with the || operator: If the first
    command results in true (and print commands always return true), the shell does
    not run the second command because true || X is true, regardless of the value
    of X. Then, because the result of the || operator was true, the then command was
    run, resulting in "again" being printed.


    The previous question shows that applying a number of simple principles can require
    a very complex analysis. However, you can do it if you look at all the simple
    parts systematically.


