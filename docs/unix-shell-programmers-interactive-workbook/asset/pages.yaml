- pgno: 625
  md: '# About the CD-ROM


    The CD-ROM that accompanies this book contains the source code for all of the
    illustrative-programs, starting with the SQUARES example in Chapter 1 and continuing
    all the way to the explorations of compiler output in Chapter 13.


    The CD-ROM has been manufactured to have partitions that present the files appropriately
    to either a Macintosh or a Windows desktop client system. On a Macintosh, the
    files can be viewed with BBEDIT (see Suggested Resources), SimpleText, or a word
    processor. On a Windows system, the files can be viewed with WordPad or a word
    processor, as well as with the TYPE command at the DOS prompt.


    Files that are independent of operating system are at the top directory level.
    Those files include programs in various high level languages as well as miscellaneous
    test data files. Assembly language files specific to MACRO-64 are in an OpenVMS
    subdirectory (folder). Similarly, files specific to the UNIX assembler for the
    Alpha are in a UNIX subfolder(folder).


    # Technical Support


    Prentice Hall does not offer technical support for this software. However, if
    there is a problem with the media, you may obtain a replacement copy by emailing
    us with your problem at:


    ```

    discexchange@phptr.com

    ```'
