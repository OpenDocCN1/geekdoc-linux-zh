  md: '# LAB 11.3: Intercepting and Generating Traps


    # LAB 11.3


    # INTERCEPTING AND GENERATING TRAPS


    # LAB OBJECTIVES


    +   After this lab, you will be able to:

    - Intercept INT and EXIT Traps

    - Use the DEBUG Trap


    The KornShell''s trap command is built on the UNIX signal mechanism. You use the
    trap command to set up a trap handler (a command) that you want to run whenever
    a trap event occurs. The trap event can be any of the UNIX signals (use the command
    kill -1 to see a list of UNIX signal names) or any of several events specific
    to KornShell processing.


    In this lab you will learn how to set up trap handlers for some of the more common
    trap events.'
