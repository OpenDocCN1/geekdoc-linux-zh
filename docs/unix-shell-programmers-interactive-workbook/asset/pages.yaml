  md: '# Chapter 1: SETTING UP 41


    There are several issues to sort out here, although the conclusions will turn
    out to be not too complicated. For scripts, the file must be in one of the directories
    in PATH, or you may specify the pathname of the file explicitly. In either case,
    script files must have their execution permission bit(s) set or the shell will
    issue a "not found" message.


    However, for function definitions that you put inside a file, the file does not
    have to have its execution permission bit(s) set, and if you give the file''s
    pathname explicitly (by starting it with a tilde, in this case), the shell will
    read the function definition from the file. When you typed the first command for
    this question, the shell read the new function definition and used it to replace
    the previous definition that you had entered from the command line but it did
    not run the function. The fact that we used ~/directory for this file and the
    fact that the file''s name and the function''s name are the same are irrelevant
    for now.


    +   e) What are the four ways that you run the function?


    Answer: In a subshell, dotted in a subshell, as a command, and as a dotted command.


    Putting the command in parentheses—whether dotting the command or not-causes it
    to run in a subshell, as the first two invocations of f133 illustrate. The second
    two invocations ran the function without using a subshell.


    +   f) Under what conditions does a function run using the shell''s process?


    Answer: All four ways use the shell''s process. Your interaction should have looked
