- pgno: 517
  md: '# 498 Lab : The read and printf Commands


    The shell uses REPLY as the variable to serve as the input buffer by default,
    but you can give another variable name to use for this purpose if you wish. In
    this case, we used answer as the input variable.


    Did you notice the difference between what you typed and what was printed as the
    value of answer? If you typed exactly what was shown for the second line, you
    should have typed two spaces after the "OK." in the second line, but the value
    of answer has only one space following the dot. This is a clue that the read command
    is doing token splitting on the input line, as you will see next.


    +   c) What is the string after the question mark ( ) used for?

    Answer: It serves as prompt string Your interaction should have looked like the
    following:


    ```

    [11004]: read r1?"Type something: " r2 r3

    Type something: This is really something.

    [11005]: print r1 is\$r1", r2 is\$r2", and r3 is\$r3\"

    r1 is "This", r2 is "really", and r3 is "is something."

    [11006]:

    ```


    You could use any string as the prompt that you want. If it contains spaces, as
    this one does, you do need to enclose it in quotes or to escape the spaces with
    backslashes (\).


    +   d) What are the values of the three variables, r1, r2, and r3 after the read
    command completed?

    Answer: They are "This,"really," and "is something" respectively.


    The read command lets you to have multiple input buffers; simply list them the
    names on the command line. The shell does token splitting on the command line,
    putting the first token in the first buffer, the second token in the second buffer,
    and so forth. If there are more tokens than there are buffers, any tokens remaining
    go in the last buffer you name, as in r3 in this example. Whenever a single variable
    receives multiple tokens, they are separated from each other by a single space.
    We will look at token splitting more carefully shortly.'
  merge: -1
  img_proc: true
