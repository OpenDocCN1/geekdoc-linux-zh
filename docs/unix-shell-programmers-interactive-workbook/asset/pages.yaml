    # THE exec COMMAND


    # LAB OBJECTIVES


    After this lab, you will be able to:


    +   - Use exec to Execute Another Program

    - Use exec to Open and Close Files

    - Use exec to Read and Write "Interesting" Devices


    The exec command has two distinct uses. One is to cause another program to execute
    in place of the one that is running when exec is executed, and the other, which
    might be used in combination with the first, is to open and close fds. In this
    lab, we''ll look briefly at the first use, from which exec gets its name, but
    we will spend most of our time looking at the second, more common use for this
    versatile command.


