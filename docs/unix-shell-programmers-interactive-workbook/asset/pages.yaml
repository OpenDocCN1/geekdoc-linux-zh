  md: '# Chapter 10: Patterns, Expansions, and Substitutions 469


    b) What do the two numbers after the colons ( ) tell the shell?


    You can also substitute a string for a pattern that occurs in a variable''s value.
    To see this, run the following command line:


    ```

    NOW=$ (date)

    print ${NOW/[0-9][0-9][0-9][0-9][0-9][0-9]/"Very Late!"}

    ```


    c) What is the code between the slashes?


    d) Explain the output of the print command.


    Here are four variations on this theme of substituting strings for patterns, starting
    with the one you just looked at:


    +   1. ${name/pattern/string} Substitute string for the first occurrence of pattern.

    2. ${name//pattern/string} Substitute string for all occurrences of pattern.

    3. ${name#pattern/string} Substitute only if pattern is at the start of the value.

    4. ${name%pattern/string} Substitute only if pattern is at the end of the value.


    To see how these work, run the following commands:


    ```

    SAMPLE=aaabbbcc

    print ${SAMPLE/b/x}

    ```'
