- pgno: 20
  md: '# CHAPTER 1


    # SETTING UP


    Let''s get started on the right foot.


    # CHAPTER OBJECTIVES


    +   In this chapter, you will learn about:

    - Running the Current KornShell Page 2

    - Setting Up Your Interactive Environment Page 10

    - Editing and Running Scripts and Functions Page 26


    Welcome to KornShell programming! The KornShell is a powerful computing environment
    that you can use both as a command interpreter and as a programming language.
    I know, a graphical user interface, with its bitmap display, windows, icons, and
    mouse port, is great for much of the work you do with a computer. But the "old-fashioned"
    command line can''t be as an efficient way to operate when you need to work in
    terms of a real computer instead of a desktop metaphor or when you have computing
    tasks that you want to automate.


    In this book, you will do lots of exercises, and all assume that you are using
    a computer that is configured so you can use the KornShell in a standard way.
    Even if you are already using the KornShell, you should go through this chapter
    carefully to make sure that your system is set up to operate in the standard way
    that we will assume throughout the remainder of the book. You can avoid a lot
    of aggravation later in the book if you make sure your system matches the one
    we will set up here.'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# LAB 1.1


    # RUNNING THE CURRENT KORNSHELL


    # LAB OBJECTIVES


    After this lab, you will be able to:


    +   - Set Up for LINUX and other UNIX Systems

    - Set Up for MS Windows Systems


    It''s a fact of life that “the” KornShell has been under active development by
    David G. Korn of AT&T Research Laboratories for many years. The up side of this
    is that the shell continues to be available on more and more computing platforms.
    Today you can run the KornShell on virtually any UNIX system, including LINUX,
    Solaris, HP-UX, and many others, as well as on Microsoft Windows 9x and NT systems.
    You can write powerful programs using just a few lines of KornShell commands,
    and they will run the same way on all the systems that support the KornShell.


    But there is a down side, too. It''s that there are many “old” versions of the
    KornShell around that are missing features available in the current version. Also,
    because it is a big feature-rich software environment, there have been errors
    in some versions of the KornShell that are fixed in the most recent version.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Chapter 1: SETTING UP


    The bottom line here is to verify that you have a current version of the KornShell
    up and running on your system or to get it up and running you don''t.


    # QUICK CHECK


    If you have a system that you plan to use with this book and you think it''s running
    the current version of the KornShell, log into it now, and press Control-V (press
    the "V" key while holding the key labeled "Ctrl\ If you are running the current
    version of the KornShell, you should see a message that looks like this:


    ```

    Version M-12/28/1993f

    ```


    If you see a caret (*) when you press Control-V, you need to press the Escape
    key after Control-V to see the version message.


    If you got that message or one like it that has a letter greater than £ at the
    end, or one with a date later than 12/28/93 in it: Congratulations, you are running
    a version of the KornShell that is compatible with this book and may skip the
    remainder of this book. Go on to Lab 1.2. However, if you got any other response
    when you pressed Ctrl-V, or if you don''t have KornShell running on your system,
    you will need to get it and install it on your system. If you are not an administrator
    for the system you are using, you will have to install a personal copy of the
    software, but if you are an administrator, you can install a copy for everyone
    who uses your system to share.


    How you proceed now depends on whether you are running a UNIX system or Microsoft
    Windows. Depending on which applies to you, you should Exercise 1.1.1 (UNIX) or
    1.1.2 (Windows).


    If some reason you find yourself "stuck" with an earlier version of the KornShell,
    you may still be able to do most of the Exercises in this workbook. There are
    really just three major versions of the KornShell. The one we will use was released
    in 1993 and is known as ksh93. An earlier version was released in 1988 and is
    known as ksh88. as well as versions released from sources other than AT&T. For
    example, you can probably find "pdksh" on the Internet, and there is a version
    available commercially from Mortice Kern Systems (MKS), which at the time of this
    writing is being licensed by Microsoft for use with Win-'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Lab 1.1: Running the KornShell


    dows 2000. Neither pdksh nor MKS ksh is compatible enough with ksh93 to be able
    to recommend using them with this book. On the other hand, anything that works
    with ksh88 will also work with ksh93. The Bolsky & Korn cited in the Preface lists
    seven pages of features that were added to ksh88 to produce ksh93, and the vast
    majority of the features you will work with this book will also work with ksh88.
    However, I have made no attempt in this book to cover those differences. If you
    have to work with ksh88, you should get a copy of the Bolsky & Korn book and look
    up anything from this book that doesn''t seem to work right to see whether it
    is a version problem.


    Some versions of ksh do not understand the Ctrl-V character. If you press Ctrl-V
    and don''t see a version message, try the command /bin/ksh (substitute the pathname
    your system uses if the KornShell is not in /bin/ksh), and you should see what
    version you have


    On Solaris, and possibly other systems that run the CDE (Common Desktop Environment),
    you will find an early version of ksh93 as the command dtksh is better than ksh88
    for doing the Exercises in this workbook.


