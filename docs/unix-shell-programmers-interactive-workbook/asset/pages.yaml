    # 4.3.3 QUOTE SINGLE CHARACTERS


    There is another type of quoting you can use that works the same way as single
    quotes but applies to single characters. The backslash (\) character tells the
    shell that the next character is to be treated literally as that character, not
    as a character that might otherwise have significance to the shell as it analyzes
    the command line.


    This type of quoting is sometimes called a literal escape or an escape quote.


    > The backslash as a quoting character has nothing to do with the ASCII <Esc>
    code, even though the word escape is used for both, don''t confuse the two.


