  md: '# 3.1.4 ANSWERS


    +   Run the following two command lines and explain the output:

    true && print hello

    false && print hello


    Answer:Your interaction should look like the following:

    $ true && print hello

    hello

    $ false && print hello

    $


    In the first command line, the print command is executed, because after the true
    command completes “normally,” the shell has to run the second command to see whether
    it is evaluating true && true (result would be true) or true && false (result
    would be false).


    In the second command line, the print command is not executed. After the false
    command completes the shell knows that executing the second command won''t affect
    the result of the && operator: false && false would give false as its result,
    but so would false && true. So executing the print command can''t affect the result
    of &&, and it doesn''t get run.


    +   What happens if you have multiple && operators in one command line?

    For example, what is the output of this command:

    true && true && false && print hello


    Answer:The print command does not run.


    The result is true only if all the commands have true exit codes. So the example
    given above does not print anything. Only true && true && true && print hello
    would have printed anything.


    +   Run the following two command lines and explain the output:

    true || print hello

    false || print hello


    Answer:Your interaction should look like the following:

    $ true || print hello

    $ false || print hello

    hello

