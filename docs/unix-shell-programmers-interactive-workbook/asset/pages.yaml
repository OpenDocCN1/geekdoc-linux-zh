- pgno: 574
  md: '# APPENDIX B


    # # BUILT-IN COMMAND

    REFERENCE


    The material in this Appendix is excerpted from The New KornShell Command and
    Programming Language by Morris I. Bolsky and David G. Korn, Prentice-Hall, 1995.
    Reproduced by permission.


    This Appendix uses a slightly different typographic convention from the remainder
    of this book. Names of commands, symbols and words that you must type exactly
    as shown are in **boldface**. Items for which you must substitute actual values
    are shown in *italics*. Throughout this Appendix, *name* typically refers to the
    name of a variable, and *compound-list* refers to one or more simple commands
    separated by Newlines or by the symbols covered in Chapter 3, "Command Command
    Syntax". The remainder of the conventions used here were introduced in Chapter
    2, "Command Syntax": Square brackets ([ ] ) surround optional items and ellipses
    ( ... ) follow items that may be repeated two or more times. Be careful to differentiate
    the square brackets that indicate optional items ([ ]) from the ones that you
    must type explicitly ([ ] ).


    # . DOT COMMAND


    +   - name [arg ...]


    If **name** refers to a function defined with the **function name syntax**, **ksh**
    executes this function in the current environment. Otherwise, **ksh** reads the
    complete file (called a dot script) and executes commands from it the current
    environment. **ksh** uses the path specified by the PATH variable to find the
    file. Dotting a file that is not a script or function leads to unpredictable results.
    **For more infortion: see Chapter 1 (Setting Up.)**'
  merge: -1
  img_proc: true
- pgno: 575
  md: '# 556 Appendix B: Built-In Command Reference


    to unpredictable results. For more infortion: see Chapter 1 (Setting Up.)


    # { ... } BRACE GROUPING OPERATOR


    { compound-list }


    ksh runs compound-list in the current environment. The return value is the return
    value of the last command in compound-list. For more information: see Chapter
    3 (Compound Command Syntax).


    # ( ...) SUBSHELL GROUPING OPERATOR


    ( compound-list )


    ksh runs compound-list in a subshell environment. For more information: see Chapter
    3 (Compound Command Syntax).


    # ( ...) ARRAY INITIALIZATION


    ```

    varname=( value ... )

    varname=( ([expression]=value ... )

    varname=(assignment ... )

    ```


    The first form assigns values to the indexed array varname, starting with index
    position 0.


    The second form assigns values to the associative array varname using expression
    as the array subscript.


    The third form assigns values to a set of variables whose names are of the form
    varname.name, where name is the left-hand side of an assignment. typeset commands
    are allowed in assignments provided they are separated by semicolons or newlines.
    For more information: see Chapter 6 (Advanced Variable Usage).


    # (( )) ARITHMETIC COMMAND


    ```

    (( word ... ))

    ```


    ksh does command substitution, parameter expansion, arithmetic expansion, and
    quote removal for each word to generate an arithmetic expression that is evaluated
    as follows:'
