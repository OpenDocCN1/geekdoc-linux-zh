- pgno: 118
  md: '# Chapter 2: Command Syntax 99


    g) Do you have to specify input redirection before output redirection, or doesn''t
    the order matter?


    Answer:They can be specified in either order, as the following interaction illustrates:

    $ cat > out1 out <

    $ more again

    hello

    good-bye again

    $


    The “natural” way to specify both is to put input redirection before output redirection.
    Because it''s always a good idea write code so that someone looking at it later
    will have the least number of surprises, it makes sense to write redirection “the
    natural way”, even though it makes difference to the shell.


    h) Use cat out1 > out2 > out3 to find out what happens if you specify input or
    output redirection twice in the same command.


    Answer: Depending on how many bytes are in your file out1, your interaction would
    look like this:

    $ rm -f out2 out3

    $ cat out1 > out2 > out3

    $ ls -l out1 out2 out3


    | -rw-r--r-- | 1 Administrator None | 12 Jul 16 20:02 out1 |

    | -rw-r--r-- | 1 Administrator None | 0 Jul 16 20:02 out2 |

    | -rw-r--r-- | 1 Administrator None | 12 Jul 16 20:02 out3 |


    The rm command removes out2 and out3 to make the results of the test unambiguous.
    The -f option forces the command to skip any queries or messages—in this case
    to suppress any messages in case the files don''t exist.


    Look at the size column of the output from the ls command (just before the date).
    It shows that both out2 and out3 were created, but that out2 has zero bytes, whereas
    out3 is the same size as out1.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'You could use the diff command to verify that out1 and out3 have identical
    contents.The command diff out1 out3 will produce no output if there are no differences
    between the files. Consult your UNIX documentation if you are not familiar with
    how to use the diff command.If you want a challenge, run the command, diff3 out1
    out2 out3, and interpret the results.


    In summary, both out2 and out3 were created, but only out3 got the data that was
    output by the cat command.


    The shell sets up I/O redirection for a command before it executes the command
    itself. Redirection can be specified anywhere within the command line, but it
    is processed by the shell in left to right sequence. Every time the shell comes
    to an output redirection, it creates the specified output file, but actual output
    is written only to the rightmost output file specified in the command.


    # EXERCISE 2.3.1 SUMMARY


    A command, including any shell script that you write, reads “normal” input from
    fd 0, writes “normal” output to fd 1, and writes “error” output to fd 2. Because
    I/O redirection is handled by the shell before it runs the command, connected
    to the user’s keyboard and monitor or to files, and should not make any assumptions
    that would conflict with this model. As you will see in the next Lab, the standard
    I/O fds can also be connected to the standard I/O fds of other commands in command
    pipelines, a powerful programming construct.


    You can make a test in your script to tell whether an fd is connected to a file
    or a terminal.You will see how to do that in Chapter 7, “Basic Tests.”'
