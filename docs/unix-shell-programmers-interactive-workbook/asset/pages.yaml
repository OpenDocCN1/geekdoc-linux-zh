- pgno: 334
  md: '# Chapter 6: ADVANCED VARIABLE USAGE 315


    The second difference is that compound variables use "dot notation" to indicate
    which element of a compound variable you want to work with instead of subscript
    notation. The element name is separated from the variable by a dot (.). instead
    of being inside square brackets ([]). In line 6115, we used dot notation to set
    the value of pluto.room, and in line 6117 we used dot notation to reference each
    of the elements of pluto individually. Line 6114 shows a convenient way to initialize
    several elements of pluto in one command. If you use this syntax, you don''t need
    to declare pluto ahead of time with a typeset command. Line 6116 shows that you
    can reference the entire compound variable using just the "root" part of the name.


    ![](img/694fa9f0320e707804a4c650b96a09b4_334_0.png)


    You could use any string you wanted as a subscript for an associative array, but
    all the parts of a compound variable''s name must follow the normal rules for
    variable names; there cannot be any embedded spaces or tabs. You could not write
    pluto."an arbitrary string"=hello,for example.


    Note that we said "all the parts of a compound variable''s name" rather than "both
    parts" in the Tip. That''s going to be the next difference between compound variables
    and associative arrays that you will look at.


    ```

    pluto.address=IP

    pluto.address.ip=149.4.44.109

    pluto.address.mask=255.255.255.0

    ```


    +   What is address the child of?

    Answer: It is the child of pluto.


    The variable pluto is the parent of address, and address is the child of pluto.


    +   What is address the parent of?

    Answer: It is the parent of both ip and mask.


    A parent can have any number of children. In this case, address has two children.
    You can also think of ip and mask as "grandchildren" or, more more generically,
    as "descendants" of pluto, and you can call pluto an "ancestor" of ip and mask.'
