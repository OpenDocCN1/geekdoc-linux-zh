- pgno: 113
  md: '# 2.3.5 USE A HERE DOCUMENT FOR stdin (<<)


    When you start writing scripts and functions, you will find that sometimes you
    want a command''s stdin to consist of some text that you will supply.


    You could type the text into a file and redirect the command''s stdin to come
    from the file, but that can get messy because the user needs both your script
    or function and the text file to use the program.


    The shell provides a mechanism for dealing with this problem by letting you put
    the text right inside the script using a mechanism called a here document.


    Here documents have another big advantage over external files:The shell will process
    references to variables in here documents, but not for data coming from an external
    file.You''ll see how to work with variables in Chapter 4, "Simple Variables,"
    and the importance of this point should become clear then.


    ![](img/694fa9f0320e707804a4c650b96a09b4_113_0.png)


    For now, you can use the shell''s interactive mode to see how a here document
    works.


    # FOR EXAMPLE


    The following interaction sends two lines of text to a cat command''s stdin using
    a here document:


    ```

    cat <<!

    This is the first line of a here document!

    This is the last line of a here document.

    !

    ```


    The syntax is to type << followed immediately by any symbol you want to use as
    a marker (which was a single exclamation point in this example).


    Then, starting on the next line, the shell reads lines until it comes to one that
    contains only the marker symbol you used (there must be no spaces before it) and
    passes the lines before the marker line as the stdin data for the command.'
  merge: -1
  img_proc: true
