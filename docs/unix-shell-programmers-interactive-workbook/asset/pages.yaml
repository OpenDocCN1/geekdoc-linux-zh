    Note that neither print command executed. The shell does parameter

    expansion before it runs a command. (This makes sense, because it does

    parameter expansion to produce the value that will be passed to the com-

    mand when it executes, so it has to do the expansion before the exec-

    tion.) As soon as the shell found the unset variable, it printed its own

    error message and stopped executing the function. It''s not just the first

