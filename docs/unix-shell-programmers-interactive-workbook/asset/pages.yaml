- pgno: 181
  md: '# LAB 4.1


    # TERMINOLOGY


    # LAB OBJECTIVES


    After this lab, you will be able to:


    +   - Use Proper Terminology for Variables


    Before diving into the topics related to using variables, you need to know the
    terms that are used to refer to variables in different contexts. Unfortunately,
    some terms are used in ambiguous ways, and you will also need to know some of
    the common cases in order to reduce the chances for confusion.


    > There is a Glossary of Terms in Appendix C. You will use that as the basis for
    the exercises in this lab, so you might want to stick a bookmark there now to
    make it easy to find during the lab.


    There are really only a few terms you need to master in this lab, so it will be
    a short one. However, it''s important to get them under control right away to
    avoid headaches later on.


    Variables are names for values. The name of a variable never changes, but its
    value may change very well as your program runs. The very term variable reflects
    this ability to change, or vary, the value associated with a name. The shell allows
    you to assign a value to a variable, and later on you can reference the variable
    name and the shell will substitute the value for the name. A new variable can
    be created just by assigning a value to a new variable name, which is called initializing
    the variable. If you try to'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Chapter 4: Simple Variables


    # 163


    reference a variable that hasn''t been initialized yet (a reference to an uninitialized
    variable), you will get “nothing” as the value, which may or may not be an error,
    depending on the circumstances.


    # LAB 4.1


    Substituting the value of a variable for its name is also called evaluating the
    variable. There are also times when the shell evaluates a variable without doing
    substitution, so evaluation is a more general term than substitution.


    There are three ways variables are used:


    +   1. You may create and use variables to help your programs perform their intended
    tasks.

    2. You may assign values to variables that the shell consults in the process of
    doing its work.

    3. The shell assigns values to variables that you can reference to help your programs
    do their work.


    # FOR EXAMPLE


    You will see examples of the first way to use variables throughout this book.


    The PATH variable is an example of the second usage for variables. The value you
    assign to it is a list of directories that contain executable files, and the shell
    consults this list to find the external commands you run.


    You have already seen “half” of an example of the third way variables are used:
    When you run a command or function, you know that you can specify option parameters
    and positional parameters for the command on the command line. The “other half”
    of this usage is that the shell passes those parameters as the values of a parameter
    variables that the program can evaluate to determine the particulars about what
    the user wants to do. The term arguments is sometimes used to refer to both parameters
    on the command line and to the corresponding parameter variables inside a script
    or function.


    This lab will give you some practice defining these terms yourself. By the end
    of the chapter, you should have a working knowledge of all the concepts given
    here (and more)!'
  merge: -1
