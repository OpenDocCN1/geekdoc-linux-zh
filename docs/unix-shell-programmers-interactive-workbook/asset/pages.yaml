    # 5.2.3 USE THE OPTARG VARIABLE


    If an option requires an argument, put a colon ( : ) after its letter in the list
    you give to getopts, and getopts will automatically put the corresponding argument
    in the variable OPTARG. This variable is defined only after you run getopts and
    the option letter is one that had an argument.


