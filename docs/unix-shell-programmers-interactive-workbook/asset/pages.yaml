    Putting the command inside $( ... ) triggers the shell''s command-substitution
    mechanism. It runs the command, capturing whatever the command writes to stdout,
    and substitutes that as the value of $( ... ).


    +   b) What is the difference between $(date), $(date),and $date?

    Answer:The first causes the shell to do command substitution, the second and third
    cause it to do variable substitution.


    In the command substitution, date is the name of a command. You could use any
    command name here, including the name of one of your scripts or functions. In
    the variable substitutions, date is the name of a variable.


    > You can use the name of a command as the name of a variable, as in this example,
    but it''s not a good practice because it can be confusing to people who read your
    programs.


    ![](img/694fa9f0320e707804a4c650b96a09b4_474_0.png)


