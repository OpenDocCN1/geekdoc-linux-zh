    When I pressed the Enter key, the last two lines below printed.


    ```

    [1] + Done tt1\n[11043]:

    ```


    The USR and HUP signals cause the program to terminate abruptly (without printing
    its “Normal Termination” message). In addition, the shell displays the “full name”
    of the signal that caused the job to terminate in its message, telling that the
    background job is finished. The HUP signal was originally designed to tell a program
    when a user’s dial-in connection to a program has been lost (a “hangup”) but now
    is often used to tell long-running programs that they should reinitialize themselves.
    USR1 and USR2 signals are provided for any use you might wish to make of them.
    However, unless you create a trap handler for these or most other signal types,
    the default behavior is to terminate the process which they are sent.


    The CHLD signal is an example of a signal that, by default, does not cause the
    process receiving it to be terminated. As the interaction with ttl on line 11042
    shows, sending this signal has no effect on the program, which continues to run
    and finally prints its “Normal Completion” message. This signal is automatically
    delivered to a process any time one of its child processes terminates. For example,
    if you run a program in the background, your interactive shell receives this signal
    when the background job finishes. Internally, that’s how the shell knows when
    it is time to print its “Done” message for the job.


    LAB 11.3'
