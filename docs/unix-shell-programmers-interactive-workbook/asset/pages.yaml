- pgno: 77
  md: '# 58 Lab 2.1: Command Syntax


    Answer:The synopsis should be written as follows:

    myscript [-ab ]


    You could also write this synopsis like this:


    ```

    myscript [-a] [-b]

    ```


    However, this format gets unwieldy if there are a lot of option letters (look
    at the man page for ls!), so the convention is to join them together, as shown
    in the first answer.


    As a user, you generally have the choice between entering commands with one dash
    before all the option letters or using a separate dash for each letter. Some old
    commands require you to do it one way or the other. You will need to write scripts
    and functions that give users the choice in Lab 5.2, "Processing Option Parameters."


    ![](img/694fa9f0320e707804a4c650b96a09b4_77_0.png)


    +   b) Add to your myscript synopsis an option -f that takes the name of a file
    as an argument.


    Answer:The addition should look like this:

    myscript [-ab] [-f file]


    The convention is to list each option that takes an argument separately, although
    a user would also be able to invoke this command with the option letters connected,
    as in the following example:


    ```

    myscript -af a_file

    ```


    +   c) Change your myscript synopsis to indicate that instead of option -f followed
    by one file name argument, there may be (i) zero or more file name positional
    parameters, or (ii) one or more file name positional parameters.


    Answer: For zero or more file name parameters, you should have made the following
    change:

    myscript [-ab] [file...]


    The ellipses could go outside the brackets in this situation without changing
    the meaning.


    For one or more file name parameters, you should have made the following change:

    myscript [-ab] file...'
  merge: -1
