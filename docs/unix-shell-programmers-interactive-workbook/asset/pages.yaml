    \ the variable from the command line, you will see the that the value of the variable\
    \ was changed inside the script.\n\nOn the other hand, you can use typeset to\
    \ create variables inside a function that are different from variables with the\
    \ same name that exist outside the function. You may say that the scope of such\
    \ variables is local to the function in which they are defined, or just that they\
    \ are local variables for short.Variables that are not local are called global\
