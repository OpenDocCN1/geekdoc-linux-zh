  md: '# LAB 10.3


    # PARAMETER EXPANSION


    # LAB OBJECTIVES


    +   After this lab, you will be able to:

    - Manage Defaults and Errors

    - Distinguish Between Null and Unset Variables

    - Work with Strings and Substrings


    This lab deals with parameter expansion, which you have already seen in its basic
    form when you learned about variable references. The KornShell has extended the
    basic syntax of putting a variable name inside ${ ... } to provide a rich set
    of operations you can do with the values of variables. Some of these operations
    give you efficient ways of dealing with common tests that would otherwise require
    double-bracket or if commands. Others give you ways of selecting parts of a variable''s
    value in systematic ways.


    There are some constructs that use the ${ ... } syntax that are not covered here.
    They are all listed in Appendix B, "Built-In Command."'
