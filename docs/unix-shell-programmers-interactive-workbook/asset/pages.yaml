  md: '# LAB 1.3


    # EDITING AND RUNNING SCRIPTS AND FUNCTIONS


    # LAB OBJECTIVES


    After this lab, you will be able to:


    +   - Define and Run a Script

    - "Dot" a Script

    - Define and Run a Function


    There are two kinds of shell programs, scripts and functions. A script is a list
    of commands that you put into a file and that the shell processes by reading the
    file. The /etc/profile, ~/.profile and your environment file are examples of scripts,
    albeit special ones, because the shell executes them automatically. The scripts
    we will be concerned with here are the ones that you write to create new commands.
    If you put a set of commands in a file and have everything set up properly, you
    can use the name of the script file as a new command name. Just type its name,
    and the shell will execute the commands inside it.


    There are two ways to run a script. You can run it as a command that has its own,
    private environment, or you can run it so that it shares the envi-'
