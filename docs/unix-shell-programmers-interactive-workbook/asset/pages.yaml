  md: '# Lab 8.2: Loops: List and Arithmetic for


    You don''t have to put a dollar sign in front of variable references arithmetic
    commands.


    a) What is the control variable in the example?


    The loop test in an arithmetic for has three parts, separated by two semicolons
    ( ; ). In left-to-right order, they are:


    +   * The initialization part, which assigns the value to the control variable
    that will be used for the first iteration of the loop. In the example, the number
    zero ( 0 ) is assigned to the control variable, i. You can have multiple initializations
    in the initialization part if you separate them with commas.

    * The termination test part, which consists of an expression that gives a true/false
    value. You usually use the numeric comparison operators (<, <=, ==, >=, >) for
    less than, less than equal, not equal, equal, greater than equal, and greater
    than, respectively), but you can do any arithmetic calculation with a result of
    zero meaning false and any nonzero result meaning true. The termination test is
    performed before each iteration of the loop, and the loop body is executed if
    the result of the test is true. In the example, the loop is executed as long as
    the variable i has a value less than 10.

    * The loop expression is any arithmetic expression you would like to calculate
    at the end of each iteration. Most always, it is an expression that computes a
    new value for the control variable. In the example, we added 1 to the control
    variable using the postincrement operator ( ++1). A complete list of arithmetic
    operators is in Appendix B, "Built-In Command."


    Each of the three parts of the arithmetic expression is optional; only the semicolons
    are required.'
  merge: -1
  img_proc: true
