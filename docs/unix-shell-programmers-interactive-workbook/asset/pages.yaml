  md: '# Chapter 2: Command Syntax 97


    The UNIX design is based on the idea that "everything looks like a file." That
    means programs can work with things as diverse as files, I/O devices, network
    connections, and memory using the same basic I/O operations. The best programs
    take advantage of this philosophy and do not make unnecessary assumptions about
    what type of device they read or write to.


    Redirect stdout to that cat copies what you type to a file named out. Do this
