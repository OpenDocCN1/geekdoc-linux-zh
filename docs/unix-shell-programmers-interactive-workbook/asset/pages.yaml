- pgno: 560
  md: "# Chapter II: I/O and TRAP Processing 541\n\nA DEBUG trap handler is executed\
    \ just before each command is executed. Unlike the xtrace option, which just prints\
    \ the command about be executed, the trap handler can do anything you want it\
    \ to. In this case, we defined a function that prints the values of some variables.\
    \ Naturally, you can put any number of commands inside such a function.\n\n![](img/694fa9f0320e707804a4c650b96a09b4_560_0.png)\n\
    \nDebugging is a skill that requires careful analysis of a program that isn't\
    \ working right. If a program goes into an endless loop, you can locate the problem\
    \ by turning the xtrace option on and off at different places in the code. If\
    \ a value is computed incorrectly, judicious use of DEBUG traps to print key values\
    \ can help you locate the problem.\n\nLAB 11.3\n\n![](img/694fa9f0320e707804a4c650b96a09b4_560_1.png)\n\
    \nYou can save a lot of debugging time by writing and testing code incrementally.Write\
    \ a little bit, and test everything carefully.Then write a bit more, and test\
    \ again. If a problem crops up during testing, it has to be because of that little\
    \ bit of code that you just wrote, reducing the scope of the problem greatly.\n\
    \n# LAB 11.3 SELF-REVIEW QUESTIONS\n\nTo test your progress, you should be able\
    \ to answer the following questions:\n\n+   1) What does the trap command do?\n\
    \ a) It sends a signal to a process.\nb) It receives a signal from a process.\n\
    \ c) It tells what code you want to execute when a signal occurs.\n d) It stops\
    \ a script when it is executed.\n e) It prints the time of day."
  merge: -1
  img_proc: true
