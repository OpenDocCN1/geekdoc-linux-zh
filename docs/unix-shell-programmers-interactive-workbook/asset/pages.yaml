    +   c) What prints this time?


    This mechanism for providing a default value is very convenient, provided that
    you know the default value will work. However, if BROWSER isn''t defined and lynx
    isn''t installed on the user''s system? In that case, using ${BROWSER:-lynx} as
    a command would fail, which is definitely uncool in a shell script! Run the following
    commands to see one way to manage this situation.(If you have lynx installed on
    your computer, choose some other program name that you don''t have.)


    ```

    unset BROWSER

    if ! whence ${BROWSER:-lynx} >/dev/null

    then print -u2 no browser

    fi

    ```


    +   d) What printed when you ran these commands?


    +   e) What does the > on the second line accomplish?


    Another approach would be to require the user to set the BROWSER variable before
    running your script or function, using the KornShell''s :? parameter expansion.'
