- pgno: 238
  md: '# Chapter 5: Parameters 219


    # 5.1.4 USE set TO ASSIGN POSITIONAL PARAMETERS


    # LAB 5.1


    What is the difference between $@ and $? As mentioned before, it has to do with
    quoting, but you haven''t learned enough tools to see the difference ... yet.
    This exercise will introduce you to the KornShell''s mechanism for managing the
    positional parameters that you can access from the command line, and with that
    in place you will be able to see the difference $@ and $*.


    The built-in command set, followed by a list of values, replaces the values that
    were passed to a command or function with the ones given in the set command. The
    shell also assigns new values to the special symbols, #, $, and $* when you use
    this form of the set command.


    ![](img/694fa9f0320e707804a4c650b96a09b4_238_0.png)


    > Thought Question:You have already seen that set command without any options
    or parameters will print the names of all variables and their values, and you
    have also already seen that set can be used to set shell options, such as noclobber.
    Think about how the shell figures out what it is supposed to do when it reads
    a set command that you type in. See the Test Your Thinking section of this chapter,
    item 1.


    Run this command from the command line to print the values of the three special
    variables #, $@, and $*:


    ```

    print $$: $0: $*

    ```


    +   a) Is the variable # defined? How many parameters were passed to ksh when
    it started running?


    You can use the set command in an interactive session to give yourself a set of
    positional parameters to work with, just as if you were inside a script or function.
    We''ll use this feature here to save the trouble of creating more script or function
    definition lines.


    Use a set command to set the positional parameters to the message, My name is
    "Your Name." Use quotes so your first and last name, separated by five spaces,
    will be one parameter value.'
  merge: -1
