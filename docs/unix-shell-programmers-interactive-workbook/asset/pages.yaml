- pgno: 358
  md: '# Chapter 7: Basic Tests 339


    that the comment $ indicates that the name of the script is s712b, so that that
    should be the name of the executable file.


    d) What does the -i option do?


    Answer: It tells `grep` to ignore the case of the characters as it looks for lines
    containing the given pattern.


    By using this option, you can have "January" in the Months file match "january"
    or "January" (or "January," or however the user utilizes it) over the command
    line.


    e) What does ^ \$ around "$1" do?


    Answer:They "anchor" the pattern so that it must occur as the only characters
    on a line.


    The caret (^) says that the command line argument must appear at the beginning
    of a line, and the dollar sign says the argument must appear at the end of a line.
    If it has to be at both the beginning and the end of a line, it must be the only
    type on the line, which is the structure of the Months file you wrote Chapter
    2, "Command Syntax." If you didn''t provide this "anchoring" information, the
    user could type part of the name of a month, for example, "marc," and grep would
    match it to the line containing "."


    ![](img/694fa9f0320e707804a4c650b96a09b4_358_0.png)


    > Be careful when you make up the pattern part of a grep command; it''s easy to
    get unintended results.


    The version of `grep` that you may have not support the -w option to match "words"
    or allow you to include the pattern inside angle brackets (< and >) to indicate
    that you want to match words. Be sure to quote the brackets so the shell doesn''t
    interpret them as redirection symbols. These word options are very useful for
    searching files with multiple words on a line.


    f) Why is it necessary to put ^1\$ inside quotes in the grep command?


    Answer:They prevent embedded spaces in variable $1 from "breaking" the script.


    Imagine what happens if the user types this command:


    ```

    s712b "January February",

    ```'
  merge: -1
  img_proc: true
- pgno: 359
  md: '# Lab 7.1: THE if COMMAND


    Inside the script, a reference to the variable i will include a space in the middle.
    If the reference is not enclosed in quotes, the grep command, after the reference
    is evaluated by the shell, will look like the following command:


    ```

    grep ^January February$ Months

    ```


    This command tells grep to look for “January” at the beginning of any line in
    the two files named February$ and Months, which is clearly not at all what you
    want to do.


    ![](img/694fa9f0320e707804a4c650b96a09b4_359_0.png)


    Kids say the darndest things!


    Art Linkletter


    ![](img/694fa9f0320e707804a4c650b96a09b4_359_1.png)


    Users do too!


    Anonymous


    ![](img/694fa9f0320e707804a4c650b96a09b4_359_2.png)


    Always write your code so that it behaves “reasonably,” no matter what the user
    types.


    +   g) Why is the output of the grep command redirected to /dev/null?

    Answer: So the user doesn''t see it.


    The grep command writes all lines that match your pattern to stdout. For this
    script, you want to print your own message rather than show the user the matching
    line. The special file named /dev/null accepts anything you send to it—and silently
    discards it.


    +   h) Why is -- put on both print commands?

    Answer: So the program doesn''t break if the user puts options on the command
    line.


    This is another example of “defensive programming.” Consider the possibility that
    the user types the following command line:


    ```

    s712b -a

    ```'
