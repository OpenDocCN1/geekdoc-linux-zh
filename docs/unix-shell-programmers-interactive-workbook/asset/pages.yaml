    e) What is the reason for 2>/dev/null on line 3?


    Answer: It redirects stderr to the null device so it won''t appear on the screen.


    The first time you run the script, the timestamp file does not exist, and the
    cat command will issue an error message when it can''t find it. For this script,
    a missing timestamp file is a normal event that we have anticipated, so we get
    rid of the error message by sending it to oblivion.


    f) What would be the difference between the following two versions of line 3?


    ```

    last_time=$(cat timestamp) 2>/dev/null

    last_time=$(cat timestamp) 2>/dev/null

    ```


    Answer:The first (the one used in the script) sends any error messages from the
    cat command to /dev/null, whereas the second one sends any error messages from
    the assignment to /dev/null.


    You can see from this code that it is all right to put I/O redirection inside
    the parentheses used for command substitution, and the shell performs the redirection
    while running the command. The second line will not redirect the error message
    from the cat command, which could confuse a user.'
