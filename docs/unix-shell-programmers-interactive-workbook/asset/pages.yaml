    ULIMIT


    ```

    ulimit [-HSacdfmnvst]

    ```


    **Use ulimit to set** or display system resource limits. If you specify n, ksh
    sets the specified resource limit to n. n can be any arithmetic expression or
    unlimited. If you do not specify n, ksh displays the specified limit. If you specify
    -H a hard limit is set or displayed. If you specify -S as soft limit is set or
    displayed if soft limits exist. If you specify neither -H nor -S, both hard and
    soft limits are set; soft limits are displayed.


    a displays all current resource limits. c specifies the limit on the size of core
