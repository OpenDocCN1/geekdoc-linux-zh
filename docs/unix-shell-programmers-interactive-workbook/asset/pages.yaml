    There are four manipulations that are very widely used because they can manipulate
    values that represent file pathnames. They can be used with any strings, of course,
    but pathnames are “naturals” for these operations. Here are:


    +   1. ${name#pattern} Remove shortest left pattern.

    2. ${name##pattern} Remove longest left pattern.

    3. ${name%pattern} Remove shortest right pattern.

    4. ${name%%pattern} Remove shortest right pattern.


    To see how these work, run the following commands:


    ```

    SAMPLE=/usr/local/bin/fringe

    print ${SAMPLE#/*}

    print ${SAMPLE##/*}

    print ${SAMPLE%%/*}

    print ${SAMPLE%%%/*}

    ```'
