- pgno: 482
  md: '# Chapter 10: Patterns, Expansions, and Substitutions 463


    # LAB 10.3 EXERCISES


    # 10.3.1 MANAGE DEFAULTS AND ERRORS


    Shell variables provide a convenient way for users to indicate their personal
    preferences when there is more than one way to do something. Such variables are
    typically initialized in the user''s ENV file when the user logs in, but what
    if the user hasn''t initialized one of these preference variables? The two most
    common ways to deal with this situation are to use a default value or to issue
    an error message. Parameter expansion lets you do either easily.


    # FOR EXAMPLE


    Imagine a script that will run the user''s web browser. There might be several
    browsers on the user''s system, so the problem is to determine which one to use.


    Run the following commands:


    ```

    unset BROWSER

    print Your browser is ${BROWSER:-lynx}.

    ```


    You could run the browser by using ${BROWSER:-lynx} as a command name, but actually
    running a web browser in this exercise would be too distracting, so we''ll just
    print out its name.


    ![](img/694fa9f0320e707804a4c650b96a09b4_482_0.png)


    +   a) What did the first command accomplish?


    +   b) What prints when you run this command?'
