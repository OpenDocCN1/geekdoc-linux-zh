- pgno: 442
  md: '# CHAPTER 10

    PATTERNS, EXPANSIONS, AND SUBSTITUTIONS


    > Though this be madness, yet there is method in''t.

    Hamlet, Act 2 Scene 2.


    # CHAPTER OBJECTIVES


    | In this chapter, you will learn about: |

    | ✓ Patterns | Page 424 |

    | ✓ Command Substitution | Page 449 |

    | ✓ Parameter Expansion | Page 462 |


    Once the shell has read a command line and has broken it into a set of individual
    commands (see Chapter 2, "Command Line Syntax"), it performs several very powerful
    operations on the tokens that make up the command''s name and parameters. These
    operations are performed in the following sequence: alias expansion, message substitution,
    tilde expansion, command substitution, parameter expansion, arithmetic expansion,
    field splitting, pathname expansion, and quote removal. As you can see from the
    list of chapter objectives, this chapter deals with several of these operations
    in the order in which the shell performs them on a command. We won''t cover alias
    substitution, message substitution, tilde expansion, or quote removal, because
    you''ve either already seen them or they are outside the scope of this workbook.
    Field splitting will be covered in the next chapter (Chapter 11, "I/O and Trap
    Processing").'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# LAB 10.1


    # PATTERNS


    # LAB OBJECTIVES


    +   After this lab, you will be able to:

    - Use Asterisk (*) to Match Zero or More Characters

    - Use the Question Mark (?) to Match a Single Character

    - Use Square Brackets ([]) to Match Character Sets

    - Work with Subpatterns


    Patterns have to do with strings of characters. Sometimes patterns are used to
    describe sets of strings that you want to match a given string, and sometimes
    patterns are used to describe sets of strings that you want to generate in some
    way. The KornShell uses patterns in four different-situations:


    +   1. In case statements, the items before the ) character are patterns that
    describe the sets of strings that the control value must match in order for the
    associated command list to be executed. As you saw in Chapter 9, "The case and
    select Statements," you can specify multiple patterns, separated by | symbols
    in one leg of a case statement, and the command list will be executed if the control
    value matches any one of the patterns. You also saw that a pattern can be as simple
    as a string. In this lab, you will learn how to construct more elaborate patterns.'
  merge: -1
  img_proc: true
- pgno: 444
  md: '# Chapter 10: Patterns, Expansions, and Substitutions 425


    2. In double-bracket tests, the right side of a double-equal (=) or not-equal
    (!) is a pattern unless it is enclosed in quotes. With quotes, the shell treats
    the right side as a string instead of a pattern. If you don''t use the special
    pattern symbols described in this lab, strings and patterns are the same. If you
    use a pattern, you can test whether a string (the left side) matches any of the
    strings described by the pattern on the right side.


    3. In parameters that you are passing to a command, you can use patterns to generate
    list of file names that have characteristics you are interested in. You have undoubtedly
    seen the form of this wildcard expansion, such as using an asterisk (*) to generate
    the names of all the files and subdirectories in the current directory. This use
    of patterns is what was meant by the term pathname expansion in the introduction
    to this chapter.


    4. Patterns are also used in substring expansion, which will be covered later
    in this chapter. In fact, the reason for introducing patterns at this point is
    that we could deal with the first three items without saying too much about patterns,
    but we can''t talk about substring expansion at all until you understand patterns
    more fully.


    The KornShell''s pattern features are related to the idea of regular expressions
    used elsewhere, such as in the grep command and inside editors. However, KornShell
    patterns are different from these regular expressions, and you shouldn''t assume
    you already know about patterns if you already know about grep-style regular expressions.
    Likewise, what you learn will help you understand other regular expressions better,
    but it would be a mistake to think that you understand all regular expressions
    after you finish this chapter.


    # LAB 10.1 EXERCISES


    # 10.1.1 Use Asterisk (*) TO MATCH ZERO OR MORE CHARACTERS


    This exercise uses pathname expansion to look at the use of the shell''s asterisk
    (*) character for pattern substitution.'
  merge: -1
  img_proc: true
