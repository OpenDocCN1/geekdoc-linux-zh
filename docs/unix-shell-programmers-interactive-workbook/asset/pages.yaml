- pgno: 256
  md: '# LAB 5.2


    # PROCESSING OPTION

    PARAMETERS


    # LAB OBJECTIVES


    +   After this lab, you will be able to:

    * Use the getopts Command

    * Use the OPTIND Variable

    * Use the OPTARG Variable

    * Customize getopts Error Messages


    The shell provides a number of variables that you can use along with the built-in
    getopts command to find out what option parameters and arguments were passed to
    a script or function. Option processing is usually done using one of the control
    structures covered in Chapter 8, “Loops,” so this lab''s goal is to introduce
    you just to the getopts command and associated variables. You will learn the standard
    ways to do option processing after you have learned about the shell''s control
    structures.


    # BACKGROUND FOR THIS LAB


    The shell does not differentiate between option parameters and positional parameters
    in a command line. It simply passes everything between the command name and the
    end of the command (except I/O redirection) to'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'the command, and it is up to the command to decide what to do with each of
    the parameters. Because the first parameters passed to most commands are options,
    programmers have to write virtually the same code or script that they work on.
    This is not only wasted duplication of effort, it leads to different commands
    having different rules for the proper syntax of the options: Can you put several
    option letters after one dash, or do you have to use a separate dash for each
    one? Does there to be a space between an option letter and an argument that follows
    it? When the POSIX standard for shell programs and utilities was developed, it
    included a specification for the proper syntax for option parameters. To encourage
    programmers to adopt the standard, the *getopts* command was developed for use
    in shell scripts, and a corresponding function named getopt() was developed for
    C/C++ programmers. The getopts command doesn''t do all the work of processing
    options, but it makes it easy to process them in the standard way.


    > Just to make things interesting, many UNIX systems provide a getopt command
    (no ''s'' at the end) that does something similar to the getopts command. The
    *getopt* command is obsolete, but the getopt() function for C/C++ is not!


    Most UNIX systems have an external command named getopts, probably in the /bin
    directory. For efficiency, the KornShell also provides a built-in version that
    works the same way as the external one.


    # LAB 5.2 EXERCISES


    # 5.2.1 USE THE getopts Command


    The getopts command takes (at least) two parameters, a list of option letters,
    and the name of a variable. When it runs, it puts the next option that it finds
    in the parameter variables into the variable named in the command.'
  merge: -1
  img_proc: true
