- pgno: 160
  md: '# Chapter 3: Compound Command Syntax 141


    The first command line does not produce any output once true sets its exit code,
    there is no need to execute the print command; the shell already knows that the
    result of evaluating || will be true. if print command returns false, the expression
    will be true || false (result is true), but if print returns a value of true (which
    is what it always does), the expression will be true (result is also true). There
    is no need to run the print command, and the shell doesn''t run it. The second
    command line requires both commands to be executed. When the shell finds that
    the first exit code is false, it has to execute the second command to see if the
    result of evaluating || will be true (if the exit code from print is true) or
    false (if the exit code from print is false.)


