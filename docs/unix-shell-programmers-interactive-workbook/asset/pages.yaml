    it does, and on some systems it doesn''t), you will end up with a colon (:) at
    the beginning of your FPATH value, which the shell will interpret as “the current
    directory followed by the remaining directories in the value string. “That, it’s
    the same as having dot (.) at the beginning of your FPATH.The same thing holds
    for PATH. If you don''t want this behavior, you will need to use one of the parameter
    expansions covered in Chapter 10, “Patterns, Expansions, and Substitutions,”to
    deal with the problem.


