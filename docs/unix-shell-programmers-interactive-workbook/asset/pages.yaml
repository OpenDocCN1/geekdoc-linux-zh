  md: '# Chapter 10: Patterns, Expansions, and Substitutions 457


    Housekeeping files, such as $1021''s timestamp, normally should not be put in
    the current directory as in this example because you never know what directory
    the script will be run from. It''s better to pick a known location in the file
    system for files, perhaps in the user''s home directory, in which case it''s a
    good idea to make them hidden (a dot at the beginning of the file name) so they
    don''t clutter up directory listings. Most UNIX systems provide a /tmp directory
    that you can use for files, however, all users on the system share the /tmp directory,
    which can cause problems if two users run the script at the same time. You can
    use $$ in such file names to create file names that are unique to a user''s process.


    ![](img/694fa9f0320e707804a4c650b96a09b4_476_0.png)


    +   g) What does line 4 do?

    Answer: It runs the date command, with the output redirected to the timestamp
    file.


    Note that this is not command substitution—it is just the regular execution of
    a command from within a script. The >| redirection guarantees that the timestamp
    file will be written, even if it exists and the user has the noclobber option
    set.


    +   h) What does line 6 do?

    Answer: It tests whether the last_time variable has been assigned a nonempty string
    value, and sets it to never if not.


    If the timestamp file does not exist (such as the first time the script is run),
    the output of the first cat command will be nothing, and the shell will assign
    the empty string value to last_time.


