  md: '# Chapter I: SETTING UP 35


    +   b) What was the purpose of the > command?

    Answer: It creates the file name ~/bin/s131.


    This is an example of output redirection, which will be covered in Chapter 2,
    "Command Syntax."


    Creating the file in the proper directory is not enough for the owner. The second
    s131 command still produces the "not found" error message, even though the file
    is in a directory listed in PATH.


    +   c) What was the purpose of the chmod command?

    Answer: It turns on the execute permission bits for the file.


    You should consult your system''s documentation for the chmod command if you are
    not already familiar with it. Here''s a simplified review: Every file or directory
    has nine permission bits associated with it-read, write, and execute permissions
    for the "user" (owner), the owner''s group, and for "others"—everyone else who
    uses the system. By default, a file is created with read and write permissions
    for the owner and read permission for the owner''s group and for everyone else.
    The chmod command used here turned on the execute bits for the owner, group, and
    others. If you wanted to make the file executable only by you, you could have
    used the following command instead of the one shown:


    ```

    chmod u+x ~/bin/s131

    ```


    If you want to make the default set of permissions for files you create not allow
    reading by anyone but yourself, put this command in your ~/.profile or (if you
    want it to apply only to your interactive sessions) umask 77


    Because chmod and umask are standard UNIX commands, you should consult your system''s
    documentation for more information on their use. The KornShell provides its own
    version of umask that is a superset of the standard UNIX command; it is summarized
    in Appendix B, "Reference".


