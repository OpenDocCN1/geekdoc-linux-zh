- pgno: 361
  md: '# 7.1.3 ANSWERS


    ```

    # s713 -- Tell if the user typed the name of a month

    grep ^1$ Months > /dev/null || print -- "$1" is not the name of a month.

    ```


    Explain how this script works.

    Answer: It uses the || operator to group the grep and the print commands.


    If the grep commands does find the argument in Months, its exit code will be true,
    and the shell will not execute the print command. However, if the grep command
    fails, its exit code will be false, and the shell will execute the print command.


    Using || instead of if in this situation is a popular programming technique which
    is more concise to write. Even if you don''t care to use it, you should recognize
    it as a common "programming idiom" that you are likely to see in other people''s
    scripts.


    ![](img/694fa9f0320e707804a4c650b96a09b4_361_0.png)


    # 7.1.4 ANSWERS


    +   What happens if you give the name of a month as a parameter?

    Answer: The month name is printed, followed by the message, "is the name of a
    month.",


    The first grep command will have an exit code of true, so the first then will
    be executed, giving the "month" message.


    +   What happens if you give the name of a day of the week?

    Answer: The day''s name is printed, followed by the message, "is the name of a
    day."


    The first grep command will fail (that is, its exit code will be false), so the
    first else will be executed, giving the "day" message.


    +   What happens if you give something else?

    Answer: Whatever the user typed will be printed inside quotes, followed by the
    "is neither" message.


    Both the first and second grep commands will fail, so the second else will be
    executed, giving the "neither" message.'
  merge: -1
