  md: '# 14 Lab 1.2: Setting Up Your Interactive Environment


    On some systems, login initializes another environment variable named PATH to
    a default value, but on other systems, PATH is initialized in the step we are
    about to describe. Other variables, which won''t concern us, that might be initialized
    by login include MAIL (tells the pathname of your incoming mailbox) and TZ (tells
    the name of the computer''s "local time" zone zone).


    When the shell starts executing, it processes commands that it reads from a system-wide
    file name profile, normally in the directory /etc. Then the shell processes commands
    from a file in your home directory named .profile, followed by the commands in
    your environment file, if it exists. Finally, the shell goes into interactive
    mode and prints a prompt string (by default, a dollar sign followed by a space),
    inviting you to type in commands. When you enter the exit command in response
    to this prompt, the shell processes and logs you out of the system. You can also
    terminate the shell by pressing Ctrl-D in response to the shell''s prompt for
    an interactive command.


    The shell adds variables to its environment when it reads commands from the form
    name=value. For this exercise, we want to be sure the variables PATH and FPATH
    both have the proper values. As you can see from the previous paragraph, they
    can be set when the shell reads commands from /etc/profile, from .profile in your
    home directory, from your environment file, or by when you respond to an interactive
    prompt. Unless they are set up for you by commands in /etc/profile, the best way
    to initialize PATH and FPATH is by editing your .profile.


    > If you put the characters tilde-slash (~) in front of a file name, it means
    the file is in your home directory, whether your current working directory is
    your home directory or has been changed by a cd command. You accomplish the same
    by putting $HOME/ in front of the file name. So your .profile is referred to as
    ~.profile.


    > A dot at the beginning of a file''s name makes it invisible to normal directory
    listings. This is done to keep cluttering up your directory listings, especially
    in your home directory, with ~/.profile and numerous'
