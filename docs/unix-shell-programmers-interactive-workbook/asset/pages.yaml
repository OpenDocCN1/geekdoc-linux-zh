  md: '# Lab 4.2: Evaluating and Assigning Values


    The answer to the question might involve looking up quite a bit of information
    about grep. The argument to grep, `RANDOM` in this case, is called a pattern or
    regular expression. You can use a string of characters as the pattern, and grep
    will find the lines that contain them, such as the RANDOM= part of the pattern
    used in this example. The caret (^) at the beginning of the pattern is a special
    code that tells grep that we are interested only in lines that have RANDOM= at
    the beginning of the line. This way, a line would not print if, for example, the
    characters RANDOM= appeared to the right of an equal sign in the output of the
    set command.


