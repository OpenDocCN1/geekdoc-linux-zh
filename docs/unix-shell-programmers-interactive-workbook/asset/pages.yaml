  md: '# Chapter 6: ADVANCED VARIABLE USAGE 317


    f) What are the values of the compound variables .sh.name and .sh.value when a
    discipline function is run?


    Answer:The name of the variable is the value of .sh.name, and the value is the
    value of .sh.value.


    As the interactions show, you can always determine the name of the variable being
    set, unset, or referenced using the special variable .sh.name. Note that this
    variable name starts with a dot, which makes it impossible for you to use as your
    own variable name; only the shell can assign a value to it.


    The compound variable .sh.value can be used two different ways. In the set discipline
    function, you can use it to find out the value assigned to the variable. In the
    get discipline function, you can assign a value to this compound variable, and
    that will become the value that the shell actually assigns to the original variable,
    regardless of the value specified in the original assignment.


    g) Does the shell run discipline functions when something happens to compound
    variables?


    Answer: Not unless you explicitly define a discipline function for the fully qualified
    compound variable name.


    6126 shows that no discipline function is called for descendants of the parent
    variable for which a discipline function is defined. If you want to, you can explicitly
    create discipline functions for descendants. For example, if you had defined a
    function named pluto.address.set, line 6126 would have caused it to be run.


