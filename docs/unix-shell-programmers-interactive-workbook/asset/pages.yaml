- pgno: 66
  md: '# CHAPTER 2


    # COMMAND SYNTAX


    You may already be familiar with many of the elements of UNIX command lines. This
    chapter makes sure you understand how the KornShell recognizes the significant
    parts of individual commands.


    # CHAPTER OBJECTIVES


    +   In this chapter, you will learn about:

    - Command Parts Page 48

    - Command Types Page 61

    - Redirecting Standard Input and Output Page 84


    In essence, the shell spends its life repeatedly doing just two things:


    +   1. Obtaining a string of text, called a command line.

    2. Executing the command line.


    The shell can read command lines interactively from a user''s keyboard, it can
    read them from a file (called a shell script or shell program), or it can receive
    one command line as a parameter when it starts executing. When the shell is in
    an interactive mode, Step 1 includes writing some text, called a prompt string,
    on the user''s screen before reading a command line. However, Step 2 is the same,
    regardless of how the command line was obtained.


    Before executing anything, the shell breaks a command line into individual commands,
    then it executes those commands. Often, there is just one command in a command
    line, but there are also several useful ways to put than one command in a command
    line. This chapter starts with individual commands, and the next chapter goes
    on command lines with multiple commands in them.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# LAB 2.1


    # COMMAND PARTS


    LAB OBJECTIVES

    After this lab, you will be able to:

    - Identify Command Names

    - Identify Parameters

    - Document a Program''s Syntax


    In this lab, you will practice identifying the parts of single commands. As a
    shell programmer, you should tell people how to invoke the commands that you write,
    so this lab also includes some practice in using notation for doing that.


    # LAB 2.1 COMMAND SYNTAX


    Every command has three parts, the name, option parameters, and positional parameters.


    The option parameters are sometimes called flags or switches. Some option parameters,
    depending on the particular command involved, are followed by a name or value,
    known as the option''s argument. You will also see the option parameters and positional
    parameters collectively referred to as command arguments, so you need to be careful
    when you see the word argument used.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Chapter 2: Command Syntax 49


    There always has to be a command name, but the option parameters and/ positional
    parameters can be left out if they aren''t needed. Like any programming language
    processor, the shell can''t handle commands unless they follow certain syntax
    rules.


    LAB 2.1


    FOR EXAMPLE


    In any command, the name has to be given first, followed by the option parameters,
    then the positional parameters, as follows:


    ```

    ls -LF myfile mydir

    ```


    Here, the command name is ls, there is one option parameter, -l, and there are
    two positional parameters, myfile, and mydir. Option parameters are identified
    by their option letters, which are 1 and F in this example, and positional parameters
    are identified by their left-to-right position in the command. In this example,
    myfile is the first positional parameter, and mydir is the second positional parameter.


    If you don''t follow the syntax rules when you write commands, the shell prints
    an error message. Unfortunately, following the syntax rules doesn''t guarantee
    that the command does what you want to do! It just means that the shell recognizes
    it as an executable command.


    A command name can be pretty anything that looks like a name: letters, underscores,
    and digits are usually used, with upper- and lowercase case being distinct, provided
    your file system differentiates between upper- and lowercase file names. As you
    will see so, there are different types of commands; the rules for valid names
    vary somewhat from one command type to another, but if you don''t try to be tricky,
    there would be no surprises here. When you start making up your own command names,
    remember that there is a UNIX convention that commands are kept short to reduce
    typing overhead. For example, the command to list the files in a directory is
    ls instead of list.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Lab 2.1: Command Syntax


    You are probably already familiar with many standard UNIX command names, such
    as cp, rm, mv, cd, and mkdir. On the other hand, there are lots of command names
    you probably have not yet heard of. Because this book is about creating new commands
    (shell scripts and functions), not about using UNIX, we''ll assume that you have
    either online or printed copies of the UNIX manual pages for looking up those
    commands that you aren''t familiar with.


    Most UNIX systems have the manual pages available on line. You use the man command
    to find out how to use a command, including the man command itself. (Type man
    to find out how to use the man command.)


    There are conventions for the option parameters part of a command, although you
    probably will come across commands that don''t follow these conventions carefully.
    The conventions are as follows:


    +   - Each option starts with a dash (-) or a plus (+) followed immediately by
    a letter.

    - An letter can be followed by an argument value (the name of a file, for example).
    If there is an argument, it should be separated from the option letter by a space.

    - Multiple option letters can be combined after one dash or plus. For example,
    -1F in the previous example is short-hand for -1 -F. No more than one option letter
    in a group may take an argument.


    By the way, if you don''t know all the options for the ls command, try this:


    Riddle: "What do e, h, j, k, v, w, y, and z have in common?"


    If an option is the kind of thing that is either present or absent, its presence
    is indicated using a dash (-), but if it is the kind of thing that can be turned
    on or off, the convention is to use a dash to turn it on (“in the usual way” is
    a favorite phrase here), and to use a plus (+) to turn it off.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Chapter 2: Command Syntax 51


    This convention can be counterintuitive until you get used to "the usual way"
    using a dash to indicate the presence of an option.


    Option parameters are optional (duh!), which implies that the positional parameters
    could start any place after the command name. Normally, a program can tell that
    it has reached the end of the options by seeing something that doesn''t start
    with a dash or a plus. However, there is a special code, two dashes (--), that
    you can use to mark the end of the options, in case you have a positional parameter
    that starts with a dash.


    LAB 2.1


    If you don''t mind the extra typing, it''s a good idea always to put a double
    dash after the options because it never does any harm, and it eliminates the chance
    that you will forget it when you really do it.


    ![](img/694fa9f0320e707804a4c650b96a09b4_70_0.png)


    Is it a dash, a hyphen, or a minus sign? There is only one key on the keyboard
    that you can use to type it, so it really doesn''t matter what you call it. We
    use dash because it''s the shortest word. Similarly for dot, period, or (if you
    are British) full stop. Dot is easiest to say and write to, so that''s what we''ll
    use.


    ![](img/694fa9f0320e707804a4c650b96a09b4_70_1.png)


