  md: '# CHAPTER 6


    # # ADVANCED

    VARIABLE USAGE


    Integers, floats, locals, and arrays. Master these and you''re on your way

    to great shell programs!


    | CHAPTER OBJECTIVES |

    | In this chapter, you will learn about: |

    | ✓ Typed Variables and Scope | Page 256 |

    | ✓ Arrays and Compound Variables | Page 296 |


    Now that you have seen how to use shell variables to hold values,

    are ready for some advanced features the KornShell provides for

    working with variables efficiently and effectively. Until now, we have

    looked only at string values, but you can improve the efficiency of your

    programs and write more powerful scripts if you let the shell know which

    of variables hold *numbers*, and you can further improve matters by

    differentiating between numbers that have fractions (*floats*) and numbers

    that''t have fractions (integers).


    In this chapter you will also learn how to work with groups of variables

    efficiently. The KornShell provides two types of arrays (*indexed* and *associative*)
    that let you create a list of values that you can access using either a

    number or a name. You will also learn how to group variables in a hier-\archy
    rather than in list form in this chapter.


    255'
