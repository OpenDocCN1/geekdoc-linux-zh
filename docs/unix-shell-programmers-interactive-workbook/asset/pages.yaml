  md: '# 506 Lab : The read and printf Commands


    LAB 11.1


    +   In the first printf command, how many conversion control strings are there
    in the format string, and how many times is the variable i after the format string?


    Answer:There were five conversion control strings, and five references to the
    variable i, as the following interaction shows:


    ```

    [11023]: integer i=12345

    [11024]: printf "%d\n %10d\n %10s\n %o\n %x\n" i i i i 12345

    ```


    ```

    12345

    30071

    3039

    ```


    ```

    [11025]: h=hello

    [11026]: printf "%s\n %10s\n %10s\n" Sh Sh $ Sh

    ```


    ```

    hello

    hello

    ```


    ```

    [11027]:

    ```


    In both lines 11024 and 11026, the number of conversion strings references (the
    number of percent symbols) is equal to the number of variable references on the
    remainder of the command line. Note that you don''t need dollar signs when referencing
    integer variables using the %d conversion string in printf commands, but you do
    need them when referencing string variables.


    ![](img/694fa9f0320e707804a4c650b96a09b4_525_0.png)


    If the number of conversion strings doesn''t match the number of variable references
    in the format string, printf will reuse the entire format string from the beginning
    to print the remainder of the variables.


    +   What does a number between the percent symbol and the conversion character
    do?


    Answer: It tells how many character positions to use for the value of the variable
    being printed.


    If you don''t use a number, the command will use just as many character positions
    as needed to represent the value. If the number you give is not large enough,
    the shell will use the minimum number of characters that it needs to show the
    value, just as if you didn''t give any number at all.'
  merge: -1
  img_proc: true
