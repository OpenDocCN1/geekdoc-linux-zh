- pgno: 435
  md: '# 416  Lab 9.1: The case and select Statements


    f911_a mean. Normally, you would provide more descriptive values for

    the elements of the list.


    +   d) is choice set to the number the user typed, or to the value of one

    the items in the menu list?

    Answer: It is set to the value of one of the items in the menu list.


    The user has to type in a number, but the control variable is set to the cor-

    responding variable.


    +   e) What happens if the user makes an invalid selection?

    Answer: The print command is executed, so the error message is printed, and the

    prompt is shown again.


    If you don''t supply a "default" leg for the case statement (the one with the

    asterisk pattern), there will be no error message. The shell does not print

    an error message on its own. It just repeats the prompt and waits for the

    user to enter another selection.


    +   f) What happens if the user presses Enter in response to the prompt?

    Answer: The shell shows the menu over again.


    If the user types an invalid choice, the shell simply redisplays the value of

    PS3, but if the user responds with a blank line, the shell redisplays the

    whole menu list before showing PS3 again.


    +   g) What happens if the user presses Ctrl-D ( ^D ) in response to the

    prompt?

    Answer: The user is returned to the normal command prompt.


    Ctrl-D is the way to indicate "end of file" to programs that read input

    from the keyboard. (Watch out; if you type it when the shell is trying to

    read a command interactively, it will log you off!) Inside a select com-\mand,
    it causes the command to terminate, and the shell executes the

    next command after done. In this script, there are no commands after

    done, so the script terminates, and you get another command prompt

    from the shell.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# Chapter 9: The case and select Statements 417


    +   h) What is the purpose of the break commands?

    Answer: They terminate the select command.


    Once the user makes a valid selection, the program runs the selected function.
    In each case, the next command is a break command, which terminates select. Then,
    because there are no more commands in the script after done, the script terminates,
    and you get another command prompt from the shell again.


    +   i) Name two commands that would cause the select to terminate by ending the
    whole script.

    Answer: exit and return


    commands immediately terminate the script or function they are in, so they will
    take you out of place of the break commands in this script because there is nothing
    else in the script after select, but you would use break if there were more more
    commands in the script that you wanted to execute after select completes.


    # 9.1.3 ANSWERS


    ```

    Run the following command lines:

    select choice in a b;

    do if [[ $choice == "a" ]] then

    print ok

    break

    fi

    done

    ```


    +   a) What prompt string is used? Answer: A number sign followed by a question
    mark. Your interaction with this command line might look like the following (depending
    on what you type in response to the prompt:


    ```

    [9001]: select choice in a b;

    do if [[ $choice == "a" ]] then

    print ok

    break

    fi

    ```'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# 418 Lab 9.1: The case and select Statements


    LAB 9.1


    +   > done

    1) a

    2) b

    #? 2

    #? 3

    #? hello

    #? 1

    ok

    [9002]:


    This rarse case command line prompts you to select between “a” and “b.” It also
    shows the default value for PS3, a pound sign followed by a question mark.


    +   b) What happens if you enter 2 as your selection?


    Answer: As the previous interaction shows, the shell does nothing but issue another
    prompt.


    This behavior is because the body of the select statement is an if statement that
    checks only if the user selected “a” (by typing a 1) and ignores anything else
    the user selects. As the next two selections (3 and hello) illustrate, the user
    can make erroneous selections too, and nothing happens if you don''t write code
    to handle those cases; the shell just reissues the prompt.


    +   c) What happens if you enter l as your selection?


    Answer: The message “ok” prints, and the shell prompts for another command.


    This behavior is also illustrated at the end of the previous interaction. The
    “ok” prints because of the print command before the break command.


    +   d) Is it necessary to put a case command inside every select command?


    Answer: No.


    This is the point of the interaction you just looked at: You can program anything
    you inside the select command, it’s that the most common thing to use is a single
    case command with one leg for each of the menu items, plus a default case to handle
    invalid selections.'
