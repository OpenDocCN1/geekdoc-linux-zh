  md: '# 540 Lab 11.3: Intercepting and Generating Traps


    # 11.3.2 ANSWERS


    +   a) What happened when you executed tt3?

    Answer:Your interaction should look like the following:

    [11055]: tt3

    [3]+ print This is the first command in this script

    This is the first command in this script

    [4]+ print This is the second command in this script

    This is the second command in this script

    [5]+ print This is the last command in this script

    [5]+ 1> /dev/null

    [11056]:


    The set -x command turns on the shell''s xtrace facility. (You can turn it off
    with the set +x command.) As you can see, every command that the shell executes
    is printed before it is executed, along with its line number in the script. Note
    that the output redirection on the third print command is treated as a separate
    command by the shell. This is consistent with the fact that the shell allows you
    to use redirection without a command, for example, to create files.


    ![](img/694fa9f0320e707804a4c650b96a09b4_559_0.png)


    You can change the shell prints to the left of each command in xtrace mode by
    giving a value to the variable PS4. The default value of PS4, as shown above,
    is "[$LINENO]+".


    As you can see, this can be a valuable tool for finding out what your program
    is doing, although the output can get voluminous. (Don''t try turning it on the
    command line if you have a KEYBD trap set! You''ll get a line of output for every
    character you type!)


    +   b) What happened when you executed tt4?

    Answer:Your interaction should look like the following:

    [11056]: tt4

    Variable values are: X= Y= Z=

    Variable values are: X=abc Y=cba Z=bac

    Variable values are: X=hello Y=cba Z=bac

    Variable values are: X=hello Y=greetings! Z=bac

    [11057]:'
