- pgno: 46
  md: '# Chapter I: SETTING UP 27


    ronment of your interactive shell''s process. You will learn about setting up
    and running scripts both ways in this lab.


    Functions are normally smaller pieces of code that also provide new commands that
    you can use. The key difference between a script and a function is that once the
    shell reads the definition of a function, it keeps a copy of it in its own address
    space (memory), so that running the script again takes less time. Scripts, on
    the other hand, are read from their disk files every time they are run.


    This lab will make sure you are set up to run scripts and functions properly.


    # LAB 1.3 EXERCISES


    # I.3.1 DEFINE AND RUN A SCRIPT


