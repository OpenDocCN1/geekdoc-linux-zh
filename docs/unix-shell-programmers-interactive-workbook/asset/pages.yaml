  md: '# COMMAND TYPES


    # LAB OBJECTIVES


    After this lab, you will be able to:


    +   - List All Built-In Commands

    - Use Two Built-In Tools: print and whence

    - Execute External Commands

    - Define Aliases

    - Write and Run a Simple Function


    A command can be built-in, external, a function, or an alias. This lab examines
    how the shell determines the type of a command, and how each type is executed.
    It also shows you how to use the whence command to find out whether a command
    is built-in, external, a function, or an alias.


    # LAB 2.2 BUILT-IN COMMANDS


    Built-in commands are the ones, as their name implies, that are built into the
    shell itself. If a command name is one of these, the shell has a routine in its
    own memory that it calls on to do whatever the command calls for.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Lab 2.2: Command Syntax


    # ■ FOR EXAMPLE


    There is a built-in command, *print*, that prints whatever parameters are given
    on the command line.


    # EXTERNAL COMMANDS


    There are two kinds of external commands—those that contain binary machine code
    and those that contain shell scripts.


    Binary machine code is generated by using a text editor to create a *source file*
    in a high-level language such as C, C++, or Java, compiling the source file into
    an *object file* (or a class file, in the case of Java). The object file then
    has to be *linked* to library files to produce an executable file (or loaded into
    a Java Virtual Machine with other class files, in the case of Java). The resulting
    program executes very quickly, but there is a lot of overhead involved in getting
    the code from the programmer writes to the final product.


    Shell scripts, on the other hand, are ready to run as soon as they have been typed
    using a text editor. When you have more shell programming tools under your belt,
    you will look at the relative efficiency of executing equivalent built-in, external-binary,
    and external-script programs to get a better feeling for what the trade-offs are
    between shell programming and compiled language programming.


    > One of the big advantages of shell programming is that you can edit, test, and
    correct your code in a very rapid cycle compared with conventional programming
    languages.


    The code for external commands comes from files. The shell keeps a list of directories,
    where it looks for external commands. Alternatively, you can type the full pathname
    of the file as the command name.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Chapter 2: Command Syntax 63


    # FOR EXAMPLE:


    The ls command is kept in the /usr/bin directory on most UNIX systems, and that
    is one of the directories the shell searches when you type a command name. You
    should be able to get the same results if you type /usr/bin/ls as if you just
    type ls, except for the number of key strokes.


    LAB 2.2


    # ALIASES


    An alias is simply a second name for a command. Aliases are normally used to save
    typing for interactive work, not for shell programming. In fact, if you define
    an alias from the command line, it won''t be understood inside a shell script.


    # FOR EXAMPLE:


    The syntax for defining an alias is very simple. For example,


    ```

    alias p=print

    ```


    makes p an alias for the print command.


    Note that there must be no spaces before or after the = sign.


    A tracked alias is an alias that the shell defines itself to improve its efficiency
    during an interactive session. The first time the shell does a search to locate
    the directory containing an external command, it saves the complete path name
    to the command so that it can find and run it faster in the future.


    # FOR EXAMPLE


    The command ls is normally a tracked alias for /usr/bin/ls.'
  merge: -1
  img_proc: true
- pgno: 83
  md: "# Lab 2.2: Command Syntax\n\nThe name tracked alias might seem to mean that\
    \ something is an alias that the shell is keeping track of, but it doesn't. It\
    \ means the shell is using its internal alias mechanism to keep track of a command\
    \ file's location in the file system.\n\n![](img/694fa9f0320e707804a4c650b96a09b4_83_0.png)\n\
    \n# FUNCTIONS\n\nA function is a way to group a set of commands as if they were\
    \ a one, just like a shell script. The big difference between a function and a\
    \ shell script is that a function works like a built-in command. Instead of reading\
    \ a file to find out what commands to execute, the shell keeps track of the commands\
    \ internally, which is much more efficient. You will be writing both functions\
    \ and scripts as you progress through this work-book.\n\nThere are two ways to\
    \ start the definition of a function. One uses the word function, followed by\
    \ the name of the function. The other starts with the name of the function, followed\
    \ by a pair of parentheses. After starting either way, you simply enclose the\
    \ statements that make up the function between opening ({}) and closing}) braces.\
    \ You will see the distinction between these two forms in Lab 6.1,\"Typed Variables\
    \ and Scope,\"where you will see that starting with function is better.\n\n# FOR\
    \ EXAMPLE\n\nHere is a function that creates command named 1 that pipes the output\
    \ of an ls command to more: \n\n```\nfunction 1 {\n  ls \"$@\" | more\n}\n```\n\
    \nThis example is very similar to an alias definition. The difference is that\
    \ you can pass parameters to functions, but not to aliases. The \"$@\" on the\
    \ ls command is an example of this; it represents whatever parameters the user\
    \ types as arguments when entering 1 command. You will practice passing parameters\
    \ to functions in Chapter 4, \"Variables and Parameters.\""
  merge: -1
  img_proc: true
