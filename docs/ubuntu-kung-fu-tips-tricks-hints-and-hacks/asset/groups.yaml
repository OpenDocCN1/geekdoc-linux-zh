    # The layout of the desktop


    The Ubuntu desktop might seem a little strange at first, but don''t worry. You''ll
    soon get used to it.


    # Panels


    The Ubuntu desktop differs from Windows in that it has two taskbars (known within
    Ubuntu as panels)—one at the top of the screen, and one at the bottom.


    The one at the top is concerned with presenting information, starting programs,
    and configuring the system. The panel at the bottom is where programs minimize
    to, and this panel also includes a Show Desktop button (left), a trash icon (right),
    and a virtual desktop selector (right; of which more later). Files can be dragged
    and dropped onto the trash icon, and clicking it lets you view and empty the trash
    contents.


    # Main menus


    The three menus at the top of the screen (Applications, Places, System) are known
    as the main menus. They stay on-screen all the time. When an application starts,
    its own menus appear within its program window beneath.'
