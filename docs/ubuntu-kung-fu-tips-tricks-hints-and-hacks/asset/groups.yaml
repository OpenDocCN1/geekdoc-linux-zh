    # Problematic installations (alternate install)


    Sometimes Ubuntu''s installation program goes wrong. Most commonly, this results
    in graphical problems that mean the installer program doesn''t work correctly.


    In situations such as this, you can use the alternate install CD. This can be
    downloaded from www.ubuntu.com as an ISO image, just like the main install CD
    (click the link marked "Text-based alternate installer installation disk", and,
    after selecting a download location near you, choose the file whose name ends
    with -alternate-i386.iso).


    The alternate CD provides the same version of Ubuntu as the main install disc,
    but uses a "text mode" installer that doesn''t have a graphical interface. As
    such the installer is compatible with virtually all computers, but this comes
    at a price because it isn''t as user-friendly as the main Ubuntu installer. The
    terminology can be obtuse for beginners, and the lack of a graphical interface
    means no mouse—you must navigate around the interface using the keyboard.


    Here are the steps needed to use the alternate install CD:


    +   1. Assuming that you''ve downloaded the CD and burned it to a blank CD-R/RW
    disc, as described earlier, boot your computer using the disc. Follow Step 1 under
    the Standard (Repartitioning) heading to ensure your computer boots from the CD-R/RW
    disc.


    +   2. At the boot menu, choose your language and select the Install Ubuntu menu
    option.


    +   3. When the installer starts, follow the initial installation steps by highlighting
    a choice on-screen using the cursor keys, and hitting Enter. In most cases, the
    default choices are fine. At one stage the installer will attempt to go online,
    and might report an error. Don''t worry about this. If you''re prompted for wireless
    network details, just select not to go online (select "Do not configure the network
    at this time").


    +   4. Eventually you''ll be prompted for a hostname. This is how the computer
    is referred to on the network. The default is fine.


    +   5. As with the main installer, the alternate installer will attempt to resize
    the Windows partition. Hit Enter when offered the Guided—Resize SCSI1 option (or
    Guided—Resize IDE1).'
