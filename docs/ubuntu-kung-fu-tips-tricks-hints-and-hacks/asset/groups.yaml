    ## APPENDIX A


    ### Glossary of terms


    The following is a partial glossary of terms you''re likely to encounter in this
    book, or in the Ubuntu community. The descriptions are contextualized for Ubuntu
    and no attempt is made to provide full definitions.


    ### A


    - **absolute path**: A full description of the location of a file or folder, from
    the root of the filesystem upwards. See also *relative path*.

    - **applet**: In the context of the Ubuntu desktop, an applet is a small program
    with a narrowly-defined function (for example, displaying the time).

    - **Apache**: Web *server* software. See *LAMP*.

    - **APT**: Advanced Packaging Tool; the higher-level software management subsystem
    in Ubuntu. See also *dpkg*.


    ### B


    - **bash**: Bourne-Again SHell; the default *command-line* *shell* used in Ubuntu
    and most versions of *Linux*. Based on the older sh.

    - **binary**: *Source code* that has undergone *compilation* into a program that
    can run natively on a computer. An *executable*.

    - **BSD**: Berkeley Software Distribution; a version of *Unix* originating at
    the University of California, Berkeley in the 1970s. Nowadays, it is available
    in several variations, including NetBSD, OpenBSD and FreeBSD.


    ### C


    - **C / C++**: Programming languages used to create much of the *Linux* operating
    system *source code*.

    - **client**: A computer (or program) that connects to a *server*.

    - **command-line**: The line at which commands are typed in a terminal window
    or a *virtual console*. More often, the term refers to the overall interface and
    practice of entering commands, in contrast to using a GUI.

    - **compilation**: The process of turning *source code* into a *binary* file,
    normally using the GNU Compiler Collection (gcc) software.

    - **config file**: Short for configuration file; a file containing software settings.

    - **cron**: *Service* that allows tasks to occur at scheduled times, usually in
    the background.

    - **CUPS**: Common Unix Printing System; software that provides Ubuntu’s printing
    functionality (including printer drivers). See www.cups.org.


    ### D


    - **Debian**: Venerable community-generated *distribution* of *Linux* upon which
    Ubuntu is based, along with several other distributions of Linux. For more information,
    see www.debian.org.

    - **dependency**: Additional software needed for a program to work.

    - **dependency hell**: A situation where a user manually attempts to solve *dependency*
    issues while installing or removing software, only to be presented with more dependency
    requirements.

    - **desktop environment**: Software that provides the graphical user interface,
    such as the desktop, trash facility, file manager, and so on. Examples available
    for *Linux* include *Gnome*, *KDE* and *Xfce*, but there are many others.

    - **device file**: Special files, usually contained in the /dev folder, that provide
    access to hardware, or a particular function provided by the kernel.

    - **directory**: Another word for a filesystem folder.

    - **distribution**: A version of the *Linux* operating system. Shortened to "distro".

    - **dpkg**: Debian Packaging system; the basic software subsystem that gets software
    on and off the system. See also *APT*.

    - **dual-boot**: If Windows and Ubuntu are installed on the same computer, it
    is said to dual-boot. A computer might also *triple-boot* if three operating systems
    are installed.


    ### E


    - **ext3**: Underlying technology that provides the filesystem used within Ubuntu
    and many other *distributions* of *Linux*.


    ### F


    - **Free Software**: Term devised by *Richard Stallman* of the *GNU Project* to
    identify software whose *source code* is freely available for all to utilize,
    inspect, modify, and redistribute. See also *GPL*.

