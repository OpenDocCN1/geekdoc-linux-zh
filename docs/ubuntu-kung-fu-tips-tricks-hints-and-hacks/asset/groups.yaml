    要更改字体的显示方式，请在 渲染 下选择一个条目，或点击 详细信息 按钮以获得更大的控制程度。如果你使用的是 LCD 面板或笔记本电脑，你几乎肯定会想要选择
    Subpixel (LCD) 选项，尽管这取决于个人喜好。随意尝试，直到你对结果满意为止。


