    System ⇨ Quit）才能使更改生效。


    > TIP 如果你在配置多个显示器时发现图形设置混乱，请重新启动计算机，并在启动菜单中选择 Ubuntu “恢复模式”选项（通常是列表中的第二个选项）。当第二个菜单出现时，选择
    xfix 选项。然后选择 resume 选项以正常启动。


    ## 更改屏幕背光


