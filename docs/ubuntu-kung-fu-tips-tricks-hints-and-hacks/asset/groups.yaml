    的 64 位版本已知会出现一些烦人的兼容性问题，虽然不是致命问题，但会使生活比必要的更困难。


    记住：如果打算使用 Wubi，就不需要这样做，因为 Wubi 可以为你获取 Ubuntu 安装文件——请参阅本章后面的 Within Windows（Wubi）部分。


