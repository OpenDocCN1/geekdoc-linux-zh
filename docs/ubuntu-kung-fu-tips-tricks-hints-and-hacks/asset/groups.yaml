    > CAUTION If you opt to remove the Windows partition, be aware that there''s no
    way of bringing it back. Be absolutely sure it''s what you want to do.


    The Manual option is for experts and lets you appropriate existing partitions
    (useful if you''re upgrading from an older Ubuntu installation), or create new
    ones manually.


    - 5. After making your partitioning choices, click FORWARD. You''ll be asked to
    confirm your choices. Once repartitioning has finished, you''ll be invited to
    create a user account. As directed, you''ll need to type your chosen password
    twice to confirm correct typing.


    > TIP The password can contain numbers, letters, symbols, and even spaces. The
    longer and more complex a password, the stronger it is.


    You''ll also be invited to type a name for the computer. This is how your Ubuntu
    computer will be identified on a network. It''s also the name that you’ll see
    at the command prompt (as explained in Chapter 5). Ubuntu will make a suggestion
    based on your login name, but you can change it if you wish. Something like `desktop-pc`
    or `laptop` will be fine. Note that spaces and most symbols aren’t allowed in
    the computer name.


    ![](img/48d064407ff591f0b5365c2d2919ee6e_29_0.png)


    **Figure 1-2.** Resizing the Windows partition.


    If installing Ubuntu 8.10, you’ll also see a Log In Automatically checkbox. If
    checked, Ubuntu will go straight to the desktop each time after booting, without
    prompting for a username/password.


    **CAUTION** This option is considered highly insecure by some, but if you’re the
    only one will ever access your computer, you might opt to select it. Laptop owners
    should definitely think twice because it will mean any files are freely available
    to a thief should the computer get stolen.


    - 6. Next, and assuming you haven’t opted to wipe Windows, you’re asked if you
    want to import Windows documents. All user accounts available under Windows will
    be shown, and you can put a check against any to automatically import into Ubuntu
    documents, wallpaper, and browser favorites.


    - 7. Following this, you’re presented with a summary. Click the INSTALL button
    and installation will commence. At this point you can relax. Installation will
    take up to half an hour. Once it’s completed, you can progress to the next chapter.


    ## Within Windows (Wubi)


    Wubi allows Ubuntu to be installed inside Windows as a series of virtual hard
    disk files. It is perhaps the simplest and most fuss-free method of installing
    Ubuntu.


    There are two methods of using Wubi:


    - 1. Downloading the Wubi standalone installer and letting it download the Ubuntu
    installation files as needed during installation;

    - 2. Inserting the Ubuntu installation CD while Windows is running and running
    Wubi from the CD.


    There''s no real benefit of one method over the other and, when it comes to the
    installation process, each is practically identical.


    Here are the steps required whatever you choose:


    - 1. If you would like to download the Wubi standalone program, and didn''t create
    a CD earlier, head off to http://wubi-installer.org and click the Download Now
    link. Run the program once it''s downloaded and skip to Step 3 below.

    - 2. If you created an Ubuntu CD from the downloaded ISO image file, insert the
    Ubuntu CD while Windows is up and running. Select the Run Wubi.exe option, if
    prompted, and, from the menu that appears, select the Install Inside Windows option.

    - 3. The Wubi program window will appear, as shown in Figure 1-3. Under the Installation
    Drive heading, select the partition or hard disk on which you want to place the
    Ubuntu files. Usually the default choice of C: is fine.

    - 4. Under the Installation Size heading, choose how much space you''d like the
    Ubuntu installation to take-up. The default setting will probably be fine, but
    you can reduce it if disk space is tight.

    - 5. If you''re installing using the Ubuntu CD, there will be only one choice
    under the Desktop Environment heading, so leave this as it is. If you''re using
    the standalone installer, here you can choose whether to install Ubuntu, Kubuntu,
    Xubuntu, or MythBuntu.

    - 6. Under the Language heading, select your preferred language.


    '
