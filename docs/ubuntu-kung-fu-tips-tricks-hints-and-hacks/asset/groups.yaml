  - '[PAGE 105]


    Perhaps the most useful keyboard shortcut is to hit the Tab key. This autocompletes
    commands and/or filenames. Most commands are short enough to be typed manually,
    but some filenames and paths can be long and therefore irritating to type.


    Say you wanted to delete (rm) the file verylongfilename.doc. You could type rm
    very and hit Tab to autocomplete the filename.


    Give Tab autocomplete a try. It’s more intuitive than it might sound.


    > TIP Tab autocomplete also works when installing programs using the apt-get or
    dpkg commands, as described in Chapter 7. It will autocomplete package names based
    on what’s in the repositories.


    # Command history


    Every time you type a command at the prompt, it’s remembered. A rolling list of
    500 commands are recorded, in fact, and you can see a list of them by typing history
    at the command prompt.


    > TIP If you only want to look at the last 10 commands, you could type history
    10. For the last 20, type history 20, and so on.


    Commands are remembered so you can reuse them. You can cycle through the history
    list, from the most-recently-typed command up, using the up/down cursor keys (Ctrl+P
    and Ctrl+N do the same thing).


    Alternatively, you can reuse any command in the history list by typing its number
    (as shown by the history command), preceded by an exclamation mark. If you want
    a view a file listing of the Documents folder, and ls Documents is command #480
    in the list, you could type !480.


    Here’s another great trick: say you’ve just typed a long file copy (cp) command,
    and want to use it again. Typing !cp will find the last line in your history list
    that begins with cp and reuse it.


    There are other neat history shortcuts too. Typing two bangs (!!) will cause the
    last command you typed to be reused. Typing !? and then part of a recently-typed
    command will cause bash to autocomplete using the nearest match it can find in
    the history. For example, typing !?upd on my system caused bash to reuse the sudo
    updatedb command, that was #471 in my computer’s history list.


    Hitting Ctrl+R lets you interactively search the history—just start typing the
    first part of the command, and bash will fill in the rest, guessed from your history.
    If bash autocompletes with an entry from your history that’s incorrect, hit Ctrl+R
    again to step further back through your history to see another match until you
    find the one you’re looking for.'
