  mdcn: '


    大多数手册页描述的是命令行工具，但某些 GUI 应用的作者也会创建它们。


    TIP 许多基本命令，例如 cd 的手册页，可以通过输入 man builtins 来查看。


    对于新手来说，手册页毫不留情。它们不仅使用技术性强且详尽的语言编写，而且还假设读者对 Linux 的工作原理有深入的预先知识。


    如第 5 章所述，grep 命令会在文件中搜索文本。然而，一个新手很难从 grep 手册页中的描述中辨认出这一点：


    ```

    grep [OPTIONS] PATTERN [FILE...]

    ```


    grep 会在指定的输入文件 FILES 中搜索包含与给定 PATTERN 匹配的行（如果未指定文件，则搜索标准输入；或如果文件名给出为单个连字符减号 (-)）。默认情况下，grep
    会打印匹配的行。


    然而，只要理解几条简单的规则，即使手册页乍看之下很复杂，也很容易导航。


    ## Terminology


    你已经知道在手册页中经常出现的两个术语——argument 和 option——因为它们在第 5 章中已经介绍过。回顾一下，argument（在手册页中有时称为
    arg）是你告诉命令去操作（或使用）的对象。这通常是一个文件或文件夹。命令 option 会改变命令的工作方式，通常是一个单词或（更常见的是）一个字母，以连字符（或两个）为前缀。


    NOTE 根据命令 option 的作用及其复杂程度，你可能会发现一个 option 拥有自己的参数集，这些参数会改变该特定 option 的工作方式！


    手册页中经常出现的三个短语是：standard input、standard output 和 standard error。技术上称为 standard
    streams，它们对于 Linux 的运行方式具有特定且重要的含义。


    Standard input 是程序从中获取输入的地方，如果未指定文件。Standard output 是程序输出被发送到的地方。Standard error
    与 standard output 类似，但如你可能猜到的，它只包含错误输出。


    > NOTE Standard input、output 和 error 有时被称为 stdin、stdout 和 stderr。


    你需要知道的就是：简单来说，standard input 通常等同于键盘，而 standard output 等同于显示器。


    有了这个认识，让我们重新审视 grep 手册页中的摘录。它说如果没有提供文件名，grep 将搜索 standard input。换句话说，如果未指定文件名，grep
    将搜索你输入的内容。


    这种能够搜索你输入内容的能力似乎用途存疑。然而，如第 5 章所述，可以将输入重定向或通过管道输入到命令中。实际上，重定向和管道会替换 standard input（因此得名
    redirect 或 pipe——输入被重定向到命令，或通过管道传入）。


    有了这个认识，很明显我们可以将输入重定向或通过管道输入到 grep，或任何可以接受 standard input 的类似命令中。


    > NOTE 此外，只要命令使用 standard output，我们就可以重定向或管道其输出，也就是说，它通常会在屏幕上显示其结果。


    grep 命令手册页的作者当然知道所有关于 standard streams 的知识，他之所以这样写描述，是因为他期望你也知道。如果他必须从头解释，描述 grep
    的功能不会用四行就能完成——而需要四页。


    ## Structure


    手册页分为标题，每个标题都缩进并加粗。常见标题如下，尽管典型的手册页可能包含更多或更少的条目：


    - **Name:** 命令的名称及其功能的简要总结。

    - **Synopsis:** 命令的假设示例。参数和选项以下划线标出，并在应出现的位置列出。方括号中的任何内容（[ ]）都是可选的。管道符（|）分隔在可以指定多种选项时的选择。省略号表示可以提供多个参数或选项。

    - **Description:** 命令的简洁且技术性的描述。

    - **Options:** 可能的命令选项，以及它们的作用。


