    ## Personalizing


    Just about any element of the Ubuntu user interface can be customized, from the
    desktop wallpaper to the program titlebars and buttons.


    To view the personalization options, click System ⇨ Preferences ⇨ Appearance.
    This will open the Appearance Preferences dialog box, and you can select between
    the tabs in the program window to make your choices.


    ## Themes


    The look and feel of program windows and dialog boxes is known as a theme, and
    several are available within Ubuntu, above and beyond the orange default appearance.
    You can switch between them by selecting the Theme tab in the Appearance Preferences
    dialog box. Changes take effect immediately.


    By clicking the CUSTOMIZE button, you can fine-tune personalization of program
    windows and dialog boxes, including changing the colors used.


    See Figure 3-2 for an example. As above, changes are applied the instant you make
    them.


    > TIP New themes and wallpaper can be downloaded from websites such as http://gnome-look.org.
    Once the new theme has downloaded, just drag and drop the archive file anywhere
    on the Appearance Preferences dialog box to install it. There''s no need to unpack
    the archive first. Additionally, several community-generated themes can be added
    to Ubuntu 8.10 by installing the package community-themes, and some excellent
    wallpapers added by installing the gnome-backgrounds package (on both 8.10 and
    8.04). Software installation is described in Chapter 6.


    ## Fonts


    Under Ubuntu it''s not only possible to customize what fonts are used for various
    elements of the desktop display, but also fine-tune how they appear on screen
    (known as font rendering). To tweak font settings, click System ⇨ Preferences
    ⇨ Appearance and select the Fonts tab.


    To change the font used for Applications, or the Desktop, and so on, click the
    dropdown list alongside each heading.


    To change how fonts appear, choose an entry under the Rendering heading, or click
