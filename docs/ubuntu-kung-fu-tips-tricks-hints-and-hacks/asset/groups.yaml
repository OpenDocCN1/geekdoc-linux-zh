    \n## 什么是 Ubuntu？\n\nUbuntu 是 Linux 操作系统的一个版本。操作系统是“运行你的电脑”的软件。Microsoft Windows\
    \ 是世界上最流行的操作系统，至少对于台式电脑而言，但 Linux 是一个完全独立的项目。\n\n## GNU\n\n事情始于 1980 年代，当时一位才华横溢的计算机科学家\
    \ Richard Stallman 决定创建一个名为 Unix 的古老操作系统的克隆。当时，Unix 运行着世界上许多工业和学术计算机系统。\n\nStallman\
    \ 这样做是因为 Unix 变得越来越专有——不再允许分享其源代码（程序员创建的列表），而自 1969 年 Unix 诞生以来一直可以这样做。\n\n这对\
    \ Stallman 来说是不可容忍的，他认为分享软件是自然且健康的。他决定他的 Unix 版本将永远免费提供，并发明了自由软件的法律和伦理概念以确保这一点。简单来说，自由软件表示用户应始终拥有分享软件的自由，而不受限制。在技术层面，自由软件保证了查看源代码的权利，甚至可以将其作为制作新程序的基础进行修改。然而，任何增补或更改也必须作为自由软件发布，以便他人继续受益。\n\
    \nNOTE 自由软件的理想被铭刻在应用于所有自由软件项目的软件许可证中。它被称为 GNU 公共许可证，或 GPL。这就像随 Windows 附带的 Microsoft\
    \ 最终用户许可协议（你在从头安装 Windows 时会看到），而微软的 EULA 在任何情况下都禁止分享 Windows，GPL 则恰恰相反——它说你可以随时分享软件！\n\
    \nStallman 将他的 Unix 版本命名为“GNU”（发音为 G-noo）。这是一个递归缩写，代表 GNU's Not Unix。换句话说，该缩写指代自身——程序员喜欢的一种玩笑\n\
    \n## Linux 内核\n\nGNU 发展成为一个拥有众多贡献者的主要项目。然而，尽管它很出色，但它缺少一个内核。内核是任何操作系统的核心程序，负责处理基本事务，例如让硬件与软件通信。\n\
    \n几乎是偶然的，一位名叫 Linus Torvalds 的人提供了解决方案。1991 年他开始了一个个人项目来创建内核。由于在将内核上传到互联网时出现命名错误，它以他的名字命名并被称为\
    \ Linux——“Linus”与“Unix”的混合。\n\n至关重要的是，Torvalds 选择将他的内核作为自由软件发布，并邀请任何感兴趣的人帮忙。他们这样做了。世界各地成千上万的人参与其中。随着岁月的流逝，该项目变得越来越重要，其设计和视野也越来越宏大。今天，Linux\
    \ 内核获得了包括 IBM 在内的许多大型公司的赞助。\n\nNOTE Torvalds 至今仍在监督并为 Linux 内核项目做出贡献。他幽默地将自己的角色描述为“仁慈的独裁者”。\n\
    \n"
