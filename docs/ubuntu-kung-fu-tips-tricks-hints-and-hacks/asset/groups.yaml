    无线网络将被检测到，不过你也应确保计算机的无线功能已激活——对于某些笔记本电脑，需要按下特定的组合键，或在计算机的 BIOS 设置中专门启用无线网络。


    > TIP 如果你遇到无线网络无法工作的情况，可以尝试安装 linux-backports-modules-intrepid 软件包，如果使用的是 Ubuntu
    8.10；或安装 linux-backports-modules-hardy，如果使用的是 Ubuntu 8.04（安装后重启）。如果这样仍无法修复，你可以考虑使用
    Ndiswrapper。这是一个硬件驱动程序，可让你在 Linux 下使用 Windows 无线驱动程序。我在我的书《Ubuntu Kung Fu》中写过关于
    Ndiswrapper 的内容。你可以通过访问 Ubuntu Kung Fu 网站阅读相关摘录：www.ubuntukungfu.org/ndiswrapper.html。


    ## 有线网络（以太网）


    只要将以太网电缆连接到计算机，计算机就会立即在线。无需配置。


    例外情况是如果你的网络不自动分配 IP 地址（即缺乏 DHCP 服务器）。这种情况很少见，但在某些工作场所可能会出现。在这种情况下，你需要手动输入 IP 地址、子网掩码、网关和
    DNS 地址，具体如下。


    ## 配置静态 IP 地址（Ubuntu 8.10 及以上）


    要在 Ubuntu 8.10 下配置静态 IP 地址（非 DHCP），右键单击屏幕右上角的 NetworkManager 图标并选择编辑连接。在出现的窗口中，确保已选择有线标签，然后单击
    Auto eth0 条目。单击编辑按钮。在出现的新窗口中，单击 IPv4 设置标签，并从方法下拉列表中选择手动。单击添加按钮，然后通过单击相关标题下的条目输入你的
    IP 地址、子网掩码和网关（路由器）详细信息。在 DNS 服务器文本字段中添加 DNS 地址（用逗号分隔每个地址）。你可以将搜索域字段留空。完成后单击确定并重新启动计算机。


    ## 配置静态 IP 地址（Ubuntu 8.04）


    要在 Ubuntu 8.04 下配置静态 IP 地址，单击系统 → 管理 → 网络。在出现的程序窗口中，单击解锁按钮并在提示时输入你的密码。选择有线连接条目并单击属性按钮。在出现的对话框中，取消选中启用漫游模式，并在配置下拉列表中选择静态
    IP 地址。将 IP 地址、子网掩码和网关（路由器）详细信息输入到相应的文本字段中。单击确定，然后在父对话框中单击 DNS 选项卡并单击添加按钮。输入第一个
    DNS 地址并按回车。再次单击添加并输入第二个 DNS 地址。完成后，单击关闭按钮。你可能需要在新配置生效前重新启动计算机。


    ## 打印机


    你的打印机将被 Ubuntu 自动检测并配置。你可以通过单击系统 ⇨ 管理 ⇨ 打印来检查打印机是否已被检测到。如果你使用的是 Ubuntu 8.10，打印机将以图标形式显示在出现的窗口中。在
    Ubuntu 8.04 中，打印机将列在出现的对话框左侧的本地打印机标题下方。


    > TIP 确保你的打印机已打开——否则 Ubuntu 无法检测到它！在打印机刚连接或首次打开后，Ubuntu 需要几秒钟来安装和配置打印机。配置完成后，你会在屏幕右上角通过一个弹出气泡得到通知。


    ## 打印测试页


    要在 Ubuntu 8.10 中打印测试页，打开打印机配置窗口（系统 ⇨ 管理 ⇨ 打印），然后双击打印机的图标并单击打印测试页按钮。在 Ubuntu 8.04
    中，按上述描述打开打印机配置对话框，单击左侧列表中的打印机条目，然后单击打印测试页按钮（首先确保程序窗口中已选择设置选项卡）。


    ## 设置默认打印选项


    要设置默认打印选项，例如纸张类型或打印质量，打开打印机配置窗口（系统 ⇨ 管理 ⇨ 打印），如果你使用的是 Ubuntu 8.10，请在出现的窗口中双击打印机的图标。随后，单击程序窗口左侧列表中的打印机选项条目。在
    Ubuntu 8.04 中，按上述描述打开打印机配置对话框并确保打印机在程序窗口左侧被选中。然后单击打印机选项选项卡。


