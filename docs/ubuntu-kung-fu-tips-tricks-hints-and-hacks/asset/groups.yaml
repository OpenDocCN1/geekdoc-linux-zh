  - '[PAGE 131]


    Before attempting to compile software yourself, use Synaptic to install the `build-essential`
    package. This installs the necessary program compilation software.


    Three commands are commonly used in succession to compile software, once you’ve
    unpacked the source code and switched into the folder containing it:


    +   - `./configure`

    +   - `make`

    +   - `sudo make install`


    The first command runs a script that checks the system has the required software
    needed to compile the software, and also any dependency software required to eventually
    run the program.


    The second command actually compiles the software, and as such can take quite
    a while to complete. The screen may seem to fill with garbage during this stage.
    This is *debug output*, and is nothing to be worried about, although if you run
    into problems when compiling software and ask for help online, others may ask
    to see it.


    The third command copies the newly-made program files to the relevant locations
    in the filesystem, so they’re ready for everyday use.


    It’s beyond the scope of this pocket guide to explain software compilation in
    more depth than this but, bearing in mind this is the most fundamental (and oldest)
    of Unix tasks, you’ll find excellent instructions online—just hit your favorite
    search engine.'
