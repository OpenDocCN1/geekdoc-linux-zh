    \ Working with repositories\n\nAs an Ubuntu user you’re not limited to the official\
    \ repositories. Many third parties offer their own repositories, and you can sign-up\
    \ to as many as you wish.\n\nThe benefits of signing up to a third-party repository\
    \ are that you can install any software contained in the repository via Synaptic\
    \ or apt-get. Additionally, if a new version of the software becomes available,\
    \ you will be notified automatically via Ubuntu’s Update Manager, and will be\
    \ able to install the new version alongside system updates.\n\n# Adding a repository\n\
    \nTo add a new repository, all you need is the address. This looks like an extended\
    \ web address. For example, here’s the repository address provided by Skype, the\
    \ people behind the VoIP telephone communications software:\n\n```\ndeb http://download.skype.com/linux/repos/debian/\
    \ stable non-free\n```\n\nTo add a new repository address to the system, follow\
    \ these steps:\n\n+   1. Start the Software Sources program (it can be found in\
    \ the System → Administration menu), and click the Third Party Software tab in\
    \ the window that appears.\n+   \n+   2. Click the ADD button and, in the APT\
    \ line field, type the whole address line, including the deb component at the\
    \ beginning of the line, and any words at the end (it would make sense to copy\
    \ and paste if it’s on a web page).\n+   \n+   3. Once done, click the ADD SOURCE\
    \ button, and the CLOSE button in the parent window. You’ll be prompted to update\
    \ the list of software contained in the repositories, so do so.\n\nIt should be\
    \ noted that the Software Sources program merely adds the address you enter to\
    \ the /etc/apt/sources.list file. Therefore, to add a repository at the command-line,\
    \ you need only edit this file and add the new repository line at the end. Then\
    \ perform a refresh of the repository lists (sudo apt-get update)."
  - "[PAGE 130]\n\n# Adding a new repository key\n\nSometimes a repository contains\
    \ *digitally signed* packages. Signing is a method of ensuring packages haven’t\
    \ been tampered with, or forged. The programmer stamps each package with an ID\
    \ that only she can create. This is done using a cryptographic key, the public\
    \ component of which is offered for download and must be installed by end users.\n\
    \nYou can add the public key to your system in the following way:\n\n+   1. The\
    \ key is usually offered for download at the same place you’ll find the package—it\
    \ will have an `.asc` or `.gpg` file extension. Right-click it and select Save\
    \ As, then save it to disk. Be sure to download the key only from the package\
    \ creator’s website, and not a mirror site. After all, it’s possible the key may\
    \ also have been tampered with.\n+   \n+   2. In the Software Sources program,\
    \ click the Authentication tab and click the IMPORT KEY FILE button. Then navigate\
    \ to the file you saved. Click OK when done.\n\nTo import the key at the command-line,\
    \ type the following, replacing `keyfile.gpg` with the name of the downloaded\
    \ file:\n\n```\nsudo apt-key add keyfile.gpg\n```\n\n> **NOTE**  If the packages\
    \ you attempt to install come from a third party repository and *aren’t* digitally\
    \ signed, you may see a warning during installation saying the packages can’t\
    \ be authenticated. This is there to warn you that you’re installing non-official\
    \ packages, but is usually nothing to worry about.\n\n# Compiling from source\
    \ code\n\nThe nature of Linux means that virtually all available software is *open\
    \ source*—the source code is free for people to view, use, and even adapt into\
    \ new software.\n\nIn the heyday of Unix back in the 1970s/80s, the *only* method\
    \ of installing new software was to take the source code and **compile** it—manually\
    \ turn it into a *binary* that can be run day-to-day.\n\nAlthough ready-made and\
    \ pre-compiled software packages rule the roost when it comes to Ubuntu software\
    \ installation, you may find some Linux software is only available as source code.\
    \ This is often the case with new hardware drivers that must be manually compiled\
    \ in order to work correctly with the kernel program."
