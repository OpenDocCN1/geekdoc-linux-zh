    ## Uninstalling software


    Removing a software package is just as easy as installing it. Use Synaptic''s
    search function to find the relevant package (search by the program name, as when
    installing software), and click the checkbox alongside the program''s package
    in the list.


    A menu will pop-up offering a variety of options, as follows:


    - **Mark for Reinstallation:** This will refresh the software, as described in
    the section below.

    - **Mark for Removal:** This will remove the software, but leave behind its configuration
    files so that the software will function in the same way should you decide to
    install it again at a future date. This is the best choice.

    - **Mark for Complete Removal:** This will remove the software and also delete
    its configuration files.


    Assuming you make a selection to remove the software, a cross will appear in the
    checkbox. When you click the APPLY button on the main toolbar, you''ll once again
    see a summary of the actions that are to be performed. Click APPLY in the dialog
    box to continue.


    Removing a software package doesn''t remove any dependencies that were installed
    along with it. That presently isn''t possible using Synaptic, although it is possible
    at the command-line, as described in the Command-Line Software Management section
    below.


    > NOTE Sometimes you might see a heading in the Summary dialog that reads Unchanged.
    This indicates software packages for which updates are available. I explain more
    about updating in Chapter 7, but if you wish to install updates using Synaptic
    you can click the MARK ALL UPGRADES button on the toolbar.


