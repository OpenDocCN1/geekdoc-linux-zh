    然而，在下载 Ubuntu 之前，你需要决定使用哪个版本。


    ## 选择版本


    Ubuntu 项目催生了许多衍生项目。每个项目都通过添加和/或移除软件来改编主要的 Ubuntu 版本，通常以不同的桌面环境的形式出现，尽管有些只是添加了专业软件。


    > NOTE 安装后可以切换到不同版本的 Ubuntu，因此现在做出此选择并非关键。


    以下是主要选项：


