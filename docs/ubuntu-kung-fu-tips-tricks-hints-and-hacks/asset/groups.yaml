    ## 第一章


    ## 安装 Ubuntu


    本章解释了在计算机上安装 Ubuntu 的方法。此外，你还将学习如何：


    - 选择适合你的 Ubuntu 版本（和发行版）；

    - 进行准备工作以确保安装顺利进行；

    - 创建自己的 Ubuntu 安装 CD-ROM；

    - 在有问题的计算机上安装 Ubuntu；

    - 在基于 Intel 的 Apple Macintosh 计算机上安装 Ubuntu。


    ## 安装类型


    安装 Ubuntu 比你想象的要容易得多，本质上共有三种方法，如下所示：


    ### #1：双启动


    如果你打算全职切换到 Ubuntu，通过重新分区计算机硬盘来安装 Ubuntu 是最佳选择。这涉及缩小现有的 Windows 分区并在其旁边创建新的分区用于
    Ubuntu。之后，安装 Ubuntu 并添加一个菜单，以便你在启动时在 Ubuntu 和 Windows 之间进行选择。在 PC 上同时拥有 Ubuntu
    和 Windows 被称为*双启动*。


    这听起来很复杂，但 Ubuntu 安装软件已将其自动化。然而，重新分区存在一定风险，因此在操作前备份重要数据是非常明智的。


    > 注意 有些用户选择不重新分区，而是将 Windows 从硬盘中完全擦除并安装 Ubuntu 取而代之。这也可以使用上述安装方法完成。


    ### #2：在 Windows 中安装


    Wubi 是 Windows 软件，它在 Windows 文件系统中包含一系列虚拟硬盘文件内安装 Ubuntu。然后它配置一个启动菜单，以便你可以在启动 Ubuntu
    或 Windows 之间进行选择。如果你选择启动 Ubuntu，一个巧妙的技巧会使虚拟硬盘文件看起来像真实磁盘。因此，用户完全不会意识到他们没有使用前面描述的传统基于分区的安装。


    使用 Wubi 安装 Ubuntu 就像安装某些 Windows 软件一样，并且同样没有风险。甚至在添加/删除程序中还添加了卸载选项。唯一的缺点是与传统安装相比性能略有下降，而且你会发现
    Ubuntu 的挂起到磁盘（休眠）节能模式不起作用。


    > 提示 你仍然可以使用将计算机大多数组件的电源挂起但保留 RAM 的“睡眠”节能模式。


    ### #3：虚拟计算机


    通过下载虚拟计算机应用程序，例如免费的 VMware Player（www.vmware.com/products/player），你可以安装 Ubuntu
    使其在 Windows 桌面上的程序窗口内运行。


    虚拟计算机本质上是在软件中重建的完整计算机。它提供了一种试用 Ubuntu 的绝佳方式，尽管虚拟计算机软件的限制意味着你无法充分体验 Ubuntu（例如桌面视觉效果将无法工作）。此外，为了获得最佳效果，你需要一台内存超过
    1GB 的功能强大的 PC。


    ## 为 Ubuntu 准备你的 PC


    在安装 Ubuntu 之前，建议在 Windows 中进行一些准备工作。


    ## 确保有足够的磁盘空间


    无论你选择哪种安装方法，Ubuntu 至少需要 5GB 的可用磁盘空间。对于你打算全职使用的安装，你可能需要更多。


