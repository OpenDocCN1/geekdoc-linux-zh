    Security 下拉菜单来选择。


    要连接到不广播其名称（ESSID）的无线网络，请单击 NetworkManager 图标并从菜单中选择 Connect to Hidden Wireless
    Network（或在 Ubuntu 8.04 下选择 Connect to Other Wireless Network）。在 Network Name 文本字段中输入
    ESSID，并从 Wireless Security 下拉列表中选择正确的无线保护类型，在其下方填写适当的密钥/密码短语详细信息。完成后单击 CONNECT
