  - '[PAGE 12]


    Because the kernel is such an important aspect of an operating system, people
    began to refer to the combination of GNU and Linux simply as Linux. This upset
    Stallman, who asked that the name GNU/Linux be used instead. But it was too late.
    The name stuck.


    > NOTE Whether to refer to the operating system as GNU/Linux or simply Linux is
    a debate that continues to this day.


    Software from other sources is typically included in the Linux operating system
    too, alongside GNU and the Linux kernel. Virtually all the software in Linux is
    Free Software, even though much of it has no direct ties with GNU or Richard Stallman.
    Arguably, Stallman’s greatest gift to the world was not the GNU software, but
    the concept of Free Software. Much of Stallman’s activity nowadays involves evangelizing
    around the world about Free Software.


    > NOTE Often the term open source is used instead of Free Software. It has a similar
    meaning—see www.opensource.org.


    # Linux distros


    There isn’t just one version of Linux. There are hundreds. Versions are known
    as distributions of Linux, or distros for short. Examples of other distros include
    Red Hat (www.redhat.com) and SUSE (www.suse.com), but there are many others, and
    new ones appear all the time.


    This variety is possible because of the freedom allowed by Free Software—anybody
    can take the source code and make their own version.


    Some distros are commercially sponsored, while others arose from the massive community
    of Linux users around the world. Ubuntu is a little of both: it is sponsored by
    Canonical, a company founded by the entrepreneur Mark Shuttleworth in 2004, but
    it also benefits from massive community support, and is based on Debian (www.debian.org),
    a community-generated distro.


    # What makes Ubuntu special


    Three things make Ubuntu stand out from the crowd:


    +   1. Its focus on desktop users;

    +   2. The Ubuntu philosophy and community;

    +   3. Ease of use.


    Let’s take a closer look at each.'
  - '[PAGE 13]


    # Focus on desktop users


    Although it comes in versions for all kinds of computers, at its core Ubuntu is
    a distribution of Linux aimed primarily at desktop users.


    Most Linux distros are equally at home on desktop or server computers (the powerful
    computers that run the Internet), but lack polish when it comes to the desktop
    experience. Indeed, in many cases the needs of desktop users are something of
    an afterthought.


    In contrast, the desktop experience is something to which the Ubuntu developers
    pay very close attention.


    When Ubuntu was created back in 2004, Mark Shuttleworth recorded the very first
    bug in the online database. However, it wasn’t about software. Instead, it was
    a revolutionary call to arms. It read as follows: “Microsoft has a majority market
    share in the new desktop PC marketplace. This is a bug, which Ubuntu is designed
    to fix”.


    # Philosophy and community


    As you might have realized, Linux is as much a philosophy as it is an operating
    system. Ubuntu is no different.


    # African values


    Ubuntu gets its title from the African concept of the same name that translates
    roughly as “humanity to others”. The term gained popularity in post-apartheid
    South Africa, where it stressed the importance of individuals recognizing their
    role within communities, and being generous of spirit because of this.


    When Mark Shuttleworth founded the Ubuntu Linux project in 2004, he drew-up a
    philosophical statement, based on this concept, and on the principles of Free
    Software.


    In a nutshell, the Ubuntu project is driven by the idea that software should be
    inclusive. It should be possible for anybody, anywhere to use, share, or modify
    Ubuntu. This means the software should be available in a particular user’s language
    too. If they have a disability, the software should be accessible to them.


    Ubuntu is free of charge, like nearly all versions of Linux. Updates are also
    free-of-charge for a set period after release (usually 18 months, but see the
    table on page 7 for more details).'
  - '[PAGE 14]


    **NOTE** You can read more about the Ubuntu philosophy at www.ubuntu.com/community/ubuntustory/philosophy,
    and read more about the Free Software Foundation’s principles at www.gnu.org/philosophy/free-sw.html.


    What Ubuntu represents is *freedom*—freedom to use and share the software, to
    do what you want with it, and to learn.


    # The community


    The Ubuntu community arose directly out of the Ubuntu philosophy. Put simply,
    people respect the principled stand Ubuntu takes. They also like the fact that
    Ubuntu focuses on the desktop experience.


    There have been many versions of Linux that, like Ubuntu, were aimed specifically
    at desktop users. Virtually all failed. This was because they compromised on some
    component of Free Software principles. Maybe their version of Linux included a
    proprietary installation program that couldn’t be freely shared or modified. Sometimes
    they attempted to limit redistribution of their version of Linux.


    Ubuntu doesn’t do any of this. Its reward is a truly massive community of users
    around the world—arguably the biggest user-base of any version of Linux. It’s
    certainly one of the friendliest Linux communities.


    Shuttleworth takes a back seat and, apart from occasionally issuing edicts, the
    community runs the show. Decisions about new features are made democratically,
    and many of its users help develop Ubuntu (provided they have the skills, of course).


    For a humble end-user of Ubuntu, the benefit of the Ubuntu community is found
    in the magnificent technical support offered at www.ubuntuforums.org, the community
    forums site where Ubuntu users hang-out and help each other.


    **NOTE** It isn’t 100% accurate that Ubuntu doesn’t include proprietary software.
    A small amount of proprietary hardware firmware is provided to support wireless
    and graphics devices presently not fully supported by Free Software. This is seen
    as a stopgap measure, however, until more acceptable alternatives become available.


    # Ease of use


    Alongside strong principles and financial sponsorship, Shuttleworth brought something
    else to the Linux party: He wanted to make a “Linux for human beings”. Indeed,
    this is Ubuntu’s tag line.'
