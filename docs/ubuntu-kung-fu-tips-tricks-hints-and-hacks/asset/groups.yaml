    **小贴士**：在尝试理解 Linux 如何处理文件时，请记住它是 Unix 的一个克隆，而 Unix 是一款为成百上千甚至成千上万不同用户设计的操作系统，这会很有帮助。关于
    Linux 的一个有趣事实是，尽管你可能在自己的普通台式电脑上使用它，但它确实能够不经任何修改就直接运行在大型计算机上。


    你可以通过右键单击任意文件或文件夹，然后从菜单中选择“属性”来查看和编辑其文件权限。在弹出的对话框中，单击“权限”选项卡。然后，你就可以更改自己所拥有的文件或文件夹的权限。


    让我们看看实际的权限案例。名为 frank 的用户创建了一个电子表格。他和名为 jane 的用户（会计部门的同事）都是 accounts 组的成员。frank
    希望 jane 能够编辑该电子表格，因此他设置了文件的组权限，让 accounts 组中的任何人都能读取和写入该电子表格。frank 还希望公司里的其他人能够查看该电子表格，包括不在
    accounts 组的其他部门用户。但他不想让他们编辑它。因此，他为“其他用户”设置了只读权限。


    对于由 root 用户拥有的操作系统文件，权限通常设置为：系统上的其他用户可以查看（读取）文件，但不能修改（写入）它们。重要的系统文件夹也以这种方式受到保护，因此无法在其中创建新文件。root
    用户还拥有文件系统的根目录（在 Windows 中称为 C:\）。这种特殊权限是“固定不变”的，因此只有 root 用户才能在其中创建新的文件或文件夹。同样，这是出于安全原因。


    **注意**：在 Ubuntu 下，对于 root 用户拥有的文件，组文件权限并不重要，因为 root 用户属于一个专有的组，该组也叫 root。


    我们将在第 5 章中重新讨论文件权限，该章将介绍 Linux 命令行。正是在命令行中，文件权限才变得更加重要，尤其是在管理系统时。


    ## Nautilus：概述


    随 Ubuntu 提供的文件浏览程序称为 Nautilus。它是 Gnome 桌面环境的重要组成部分，功能极其强大，同时又对用户友好。


    你可以通过单击“位置 ➔ 主文件夹”来启动 Nautilus。这将让你查看 /home 文件夹中个人文件夹的内容。


    ![](img/48d064407ff591f0b5365c2d2919ee6e_74_0.png)


    图 4-3 中标注了 Nautilus 程序窗口的各个组件的作用。说明如下。


    - 1. **工具栏：**在这里，你可以在文件浏览历史中后退或前进，或单击“向上”按钮转到当前浏览文件夹的父文件夹。“重新加载”按钮将刷新文件列表，显示最近添加或删除的文件，而“主文件夹”和“计算机”按钮则提供到这些浏览位置的快捷方式。


    > **注意**：“计算机”位置相当于 Windows 的“我的电脑”（Vista 下的“计算机”），其中列出了连接到计算机的存储设备。


    “搜索”按钮启动 Nautilus 的文件搜索功能，本章稍后将介绍。


    - 2. **地址栏：**地址栏显示当前浏览的文件夹，并支持两种模式：按钮模式和文本模式。


    按钮模式（默认启用）会为你浏览到的每个文件夹显示一个按钮。例如，如果浏览到 `/home/keir/Pictures/Disneyland`，则会有一个 `Disneyland`
    按钮、一个 Pictures 按钮和一个 `keir` 按钮（为节省空间，主文件夹不会获得按钮）。单击每个按钮将直接带你进入该特定文件夹。


    文本模式通过单击地址栏最左侧的按钮激活，相当于大多数文件浏览器中的标准地址栏：路径以文本形式显示以供参考，但也可以编辑以切换到新位置。图 4-4 显示了两种模式并列对比。


    ![](img/48d064407ff591f0b5365c2d2919ee6e_75_0.png)


    ## 3. 侧边栏：


    侧边栏显示与所浏览文件或文件夹相关的信息。可以通过单击窗格右上角的 X 按钮将其关闭，或者通过单击下拉列表标题，将其切换为以下六种模式之一：


    地点（Places）：这是默认模式，显示重要文件系统位置的快捷方式，并提供一键访问连接到计算机的任何存储设备的功能。如果存储设备可以弹出或在移除前需要卸载（如
    DVD-ROM 驱动器或 USB 记忆棒），旁边会出现一个弹出图标（仅限 Ubuntu 8.10 及以上版本）。


    信息（Information）：此模式类似于某些 Windows 版本中的模式，显示当前浏览的文件夹名称以及其中包含的项目数。


    树形（Tree）：这是文件浏览窗口左侧窗格中出现的“传统”视图。它显示完整的文件系统。通过单击列表中每个条目旁边的 V 形符号，你可以“展开”该特定文件夹以查看其内容。选择文件夹将使其内容显示在主浏览区域中。

    '
