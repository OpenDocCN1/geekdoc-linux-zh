    given the folder /home/jane. The /home folder is akin to C:\Documents and Settings
    under Windows.


    TIP Linux users often refer to their folder within /home as their "home folder",
    saying things like, "I couldn''t find the file but I remembered I''d saved it
    in my home folder."


    Users aren''t permitted to save their personal files outside of their /home folder.
    This is rigidly enforced using ownerships and file permissions, as I explain in
    the Understanding Users section below.


    Outside of the /home folder, the Ubuntu filesystem is a little more complicated
    than Windows, and it isn''t quite a case of program files being in one location,
    and system files in another.


    A cursory rundown of the Ubuntu filesystem can be found in Table 4-1, although
    this is not essential knowledge and is provided largely for reference purposes.


    Perhaps the most important locations for the majority of users are /home, as described
    above; /usr/bin, where practically all software is located; and /etc, where system
    configuration files are found.


    NOTE Like many versions of Linux, Ubuntu broadly follows the Filesystem Hierarchy
    Standard (FHS) to decide where things should go in the filesystem. For more details,
    including in-depth descriptions of each location, see www.pathname.com/fhs/.


    # Hidden files and folders


    Windows lets users hide files and folders by setting a file attribute.


    Linux takes a simpler approach. Any file or folder that has a period (.) at the
    beginning doesn''t appear in file listings, unless the user specifically requests
    all files/folders be listed.


    In other words, if you rename report.doc to .report.doc, it will instantly become
    invisible and will seem to disappear from the file browsing window (you might
    have to hit the Refresh button in the file browser window to update the listing
    before the file actually vanishes).


    A user''s personal configuration files are stored in his or her /home folder and
    are hidden in this way. To view them, and other hidden files, click View ⇨ Show
    Hidden Files in a file browsing window.


    NOTE Any file or folder that has a tilde (~) at the end of its filename (i.e.
    report.doc~) will be hidden in file listings provided by the Nautilus file manager,
    and on the desktop. They will be visible everywhere else, including at the command-line.'
