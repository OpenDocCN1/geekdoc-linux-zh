    字体文件放入其中，来将自己的字体导入 Ubuntu。请注意这是一个隐藏文件夹，在正常文件列表中不会显示；要查看它，请在文件浏览窗口中点击 查看 ⇨ 显示隐藏文件。一旦添加，新字体将立即在应用程序中可用。一个常见的技巧是从
    Windows 复制字体。


    ## 登录屏幕


    要个性化启动 Ubuntu 时出现的登录屏幕，请点击 系统 ⇨ 管理 ⇨ 登录窗口，并在出现的对话框中点击 本地 标签。然后从主题列表中选择。


    > TIP 与桌面主题一样，新的登录屏幕主题可以从像 http://gnome-look.org 这样的网站下载。新的主题也可以在 Ubuntu 的软件仓库中找到；它们通常在软件包名称中包含
    gdm-theme 这个词。软件安装在第 6 章中有描述。


    ## 配置菜单


    应用程序和系统主菜单的内容可以通过选择 系统 ⇨ 首选项 ⇨ 主菜单 来自定义。点击并拖动以重新排列菜单项的顺序，或取消选中某项以将其从菜单中移除。


    ## 自定义桌面图标


    图标通常作为更广泛的桌面主题的一部分进行自定义，但你可以通过右键单击它，选择 属性，然后点击出现的对话框中的左上角图标预览，为桌面图标使用自己的图片。之后，导航到图片文件。


