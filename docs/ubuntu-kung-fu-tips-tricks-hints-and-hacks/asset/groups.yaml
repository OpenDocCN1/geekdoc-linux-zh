    and wants to switch to /home/frank/Music?


    Frank could specify the absolute path (i.e. cd /home/frank/Music), but he can
    also use a relative path, like this:


    - cd ../../Music


    In this case, Frank has specified the parent of the folder he’s browsing, and
    then the parent of that folder (i.e. the parent of the parent). At that

