    the Disneyland folder, that is in the Pictures folder?


    Frank has been paying close attention to this book, because he knows he can type
    the cd command, as mentioned above. But what should he type next?


    He could type the full path to the folder, like this:


    - cd /home/frank/Pictures/Disneyland


    This works fine, but it’s a lot of typing.


    In the above command, Frank has specified the absolute path to the file—the full
    location, from the root of the filesystem up. Of course, it would make far more
    sense if Frank simply typed:


    - cd Disneyland


    After all, he’s already browsing the Pictures folder.


    Frank doesn’t realize it, but here he has specified a relative path. Rather than
    provide the path from the bottom-up, he specified a filesystem location relative
    to where he’s currently browsing.


    > NOTE The folder a user is currently browsing is sometimes referred to as the
    working directory.


    Once Frank has switched into the Disneyland folder, he can switch back to the
    Pictures folder by typing the following:


    - cd ..


