    # GNU Project


    Seminal operating system project that recreates the venerable *Unix* operating
    system using entirely *Free Software. See www.gnu.org.


    # GPL


    GNU Public License; software license used by most *Free Software* projects that
    enshrines in a legal contract the right of users to view, study, modify, and redistribute
    the *source code* of software, along with future iterations. The *Lesser GPL (LGPL)*
    cedes some of the requirements of the GPL, and is usually used to enable the redistribution
    of library files.


