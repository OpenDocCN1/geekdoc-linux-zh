    As mentioned in Chapter 5, the grep command searches for text in a file. However,
    a newcomer would have trouble discerning this from the description in grep’s man
    page:


    ```

    grep [OPTIONS] PATTERN [FILE...]

    ```


    grep searches the named input FILES (or standard input if no files are named,
    or for a single hyphen-minus (-) is given as file name) for lines containing a
    match to the given PATTERN. By default, grep prints the matching lines.


    However, as complex as man pages might seem at first, they can be easily navigated
    provided a few simple rules are understood.


    # Terminology


    You already know two terms that appear frequently in man pages—argument and option—because
    they were introduced in Chapter 5. To recap, an argument (sometimes referred to
    as an arg in man pages) is what you tell a command to work on (or with). This
    is usually a file or folder. A command option alters how a command works, and
    is usually a word or (more often) a letter, preceded by a hyphen (or two).


