    # Wired (Ethernet)


    As soon as you attach an Ethernet cable to your computer, your computer will be
    online straight away. No configuration is necessary.


    The exception is if your network doesn''t automatically assign IP addresses (i.e.
    it lacks a DHCP server). This is rare, but is sometimes the case in certain workplaces.
    In this case you''ll need to enter the IP, subnet mask, gateway, and DNS addresses
    manually, as follows.


    # Configuring a static IP address (Ubuntu 8.10 and above)


    To configure a static IP address (non-DHCP) under Ubuntu 8.10, right-click the
    NetworkManager icon at the top-right of the screen and select Edit Connections.
    In the window that appears, ensure the Wired tab is selected and click the Auto
    eth0 entry. Click the EDIT button. In the new window that appears, click the IPv4
    Settings tab, and select Manual from the Method dropdown list. Click the ADD button
    and enter your IP address, subnet mask, and gateway (router) details by clicking
    the entries under relevant headings. Add the DNS addresses in the DNS Servers
    text field (separate each address by a comma). You can leave the Search Domains
    field blank. Click OK when done and reboot the computer.


    # Configuring a static IP address (Ubuntu 8.04)


    To configure a static IP address under Ubuntu 8.04, click System → Administration
    → Network. In the program window that appears, click the UNLOCK button and enter
    your password when prompted. Select the Wired Connection entry and click the PROPERTIES
    button. In the dialog box that appears, uncheck Enable Roaming Mode and, in the'
  - '[PAGE 44]


    Configuration dropdown list, select Static IP Address. Enter the IP address, subnet
    mask, and gateway (router) details into the relevant text fields. Click OK and,
    in the parent dialog box, click the DNS tab and then the ADD button. Enter the
    first DNS address and hit Enter. Click ADD again and enter the second DNS address.
    Once done, click the CLOSE button. You may have to reboot your computer before
    the new configuration works.


    # Printers


    Your printer will be automatically detected and configured by Ubuntu. You can
    check to see if your printer has been detected by clicking System ⇨ Administration
    ⇨ Printing. If you’re using Ubuntu 8.10, the printer will be shown as an icon
    in the window that appears. With Ubuntu 8.04, the printer will be listed beneath
    the Local Printers heading on the left of the dialog box that appears.


    > TIP Ensure your printer is turned on—it can’t be detected by Ubuntu otherwise!
    It takes Ubuntu a few seconds to install and configure a printer after it’s just
    been attached or first switched on. You’ll be told when configuration has finished
    via a call-out balloon at the top right of the screen.


    # Printing a test page


    To print a test page in Ubuntu 8.10, open the Printer Configuration window (System
    ⇨ Administration ⇨ Printing), then double-click the printer’s icon and click the
    PRINT TEST PAGE button. In Ubuntu 8.04, open the Printer Configuration dialog
    as described previously, click the printer’s entry in the list on the left, and
    click the PRINT TEST PAGE button (ensure the Settings tab is selected in the program
    window first).


    # Setting default print options


    To set the default print options, such as paper type or print quality, open the
    Printer Configuration window (System ⇨ Administration ⇨ Printing) and, if you’re
    using Ubuntu 8.10, double-click the printer’s icon in the window that appears.
    Following this, click the Printer Options entry in the list on the left of the
    program window. In Ubuntu 8.04, open the Printer Configuration dialog as described
    previously and ensure the printer is selected on the left of the program window.
    Then click the Printer Options tab.'
