  - '[PAGE 15]


    # How it used to be


    To understand why this is important, let me recount an experience I had with Linux
    in 2002, before Ubuntu hit the scene. I wanted the wireless card in my notebook
    to connect to my network, but I couldn’t get it working under Linux. So, I asked
    for help on a popular forum. I received something similar to the following in
    reply:


    > > “Getting the card to work is simple! Just grab the source code for the module
    and compile it against the kernel. insmod it and then use iwconfig to configure
    a WEP password.”


    Are you still reading? As you can tell, that’s a complex answer. It involves working
    at the command-line, and requires knowledge of how Linux works on a very technical
    level. I knew what the poster was talking about, although inwardly I sighed at
    the amount of work involved. However, a newcomer would be baffled.


    That’s how it was back then. Linux was “for techies only”. It was considered an
    industrial-strength operating system, and brought with it a steep learning curve
    that drove many away.


    # How it is now


    Ubuntu changed everything. It focuses on the desktop user experience and, to this
    end, features graphical configuration software. It includes a wide variety of
    hardware drivers so that nearly all standard hardware “just works”. Ubuntu comes
    with an installer program that doesn’t feature mind-boggling terminology, and
    updating the system takes just a few clicks of the mouse.


    **NOTE**  To be fair, it can be argued Ubuntu was part of a broader revolution
    in desktop Linux, and several other versions of Linux were heading in the same
    direction. Ubuntu was the first to get there, and continues to lead the charge
    with each new release.


    While the command-line is still around, there’s no longer an obligatory requirement
    to use it. It’s often quicker and more efficient to use it, as you’ll find out
    later in this book, but you don’t have to. Ubuntu makes Linux truly accessible
    to all.


    Don’t think Ubuntu is somehow “less Linux” than other versions. Scratch under
    the surface and you’ll find Ubuntu is based on Debian, a widely-respected community-generated
    version of Linux that many consider definitive. See www.debian.org.'
  - '[PAGE 16]


    # What Ubuntu offers


    Ubuntu is a thoroughly modern operating system that provides everything you might
    find in Windows or Macintosh OS X, but without the drawbacks. It keeps things
    simple, yet offers sophisticated features.


    Want to browse the web? Firefox will do the job. This is the same Firefox you
    might have been using under Windows and, yes, the same add-ons will work. Want
    for instant-message friends using AIM, MSN, or ICQ? Pidgin provides the solution.
    Need to do some word-processing, or spreadsheets, or presenting? OpenOffice.org
    will do the trick. GIMP will handle image-editing, while RhythmBox will take care
    of music playback (stand-alone video playback is handled by Totem).


    All of these programs are installed by default. They''re not extras and they''re
    all free of charge.


    Hardware support is excellent, with virtually every item of day-to-day hardware
    supported, including graphics/sound cards, printers, wireless, USB memory sticks,
    cameras, iPods, and so-on. There''s no need to fumble around with driver CDs—practically
    everything will be up and running straight after installation, although as with
    any operating system you may have to configure the system to your own tastes and
    needs.


    TIP Ubuntu works well on older hardware. The minimum realistic requirements for
    Ubuntu 8.04 are a 700MHz processor, 384MB of memory, and 8GB of disk space. You
    might consider installing Ubuntu on an older PC to evaluate it, before installing
    it on your day-to-day computer.


    # How to read this book


    Ubuntu Pocket Guide and Reference is concise. Its goal is to explain the essentials
    of day-to-day Ubuntu administration in a fuss-free manner. Due to the limited
