    what you want to connect to is set to be "discoverable" and click the Bluetooth
    icon on Ubuntu''s desktop. Select Setup New Device from the menu that appears
    and click the FORWARD button in the dialog box. The device you want to pair with
    will instantly appear in the list of detected devices, although it might not immediately
    be identified by its make/model details. Just wait a second or two for the full
    information to appear. Select the device in the list and click the FORWARD button.
    You''ll be given a PIN to enter on the device, so do so. Once this is done, the
    devices will be paired.


    > NOTE On some Bluetooth devices you may have to further authorize the pairing.
    How this is done varies according to device.


    # Pairing (Ubuntu 8.04)


    Bluetooth functionality under Ubuntu 8.04 is less than perfect. If you intend
    to use Bluetooth devices with Ubuntu frequently, I recommend upgrading to Ubuntu
    8.10. However, if you have no other choice, the following instructions should
    suffice.


    First, right-click the Bluetooth icon and select Preferences from the menu that
    appears. In the dialog box that appears, ensure the first tab is selected (the
    tab''s title will relate to the name of your Ubuntu system), and click Visible
    and Connectable for Other Devices.


    Initiate pairing on the Bluetooth device. How this is done varies from device
    to device but once it''s done a callout will appear at the top-right of the Ubuntu
    desktop prompting you to type the PIN you entered on the device. Once this is
    done, the devices will be paired.


