    A quick word about *radio buttons* and *checkboxes*, both of which I reference
    throughout the book. Both are elements of dialog boxes, and activate certain functions.
    Radio buttons are usually round, while checkboxes are usually square. See Figure
    1-1 for an annotated example.


    ## Ubuntu versions


    This book was written using Ubuntu 8.10 as a base, and was further tested using
