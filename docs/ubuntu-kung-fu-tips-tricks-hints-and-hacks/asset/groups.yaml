    # Within Windows (Wubi)


    Wubi allows Ubuntu to be installed inside Windows as a series of virtual hard
    disk files. It is perhaps the simplest and most fuss-free method of installing
    Ubuntu.


    There are two methods of using Wubi:


    +   1. Downloading the Wubi standalone installer and letting it download the Ubuntu
    installation files as needed during installation;

    +   2. Inserting the Ubuntu installation CD while Windows is running and running
    Wubi from the CD.


    There''s no real benefit of one method over the other and, when it comes to the
    installation process, each is practically identical.


    Here are the steps required whatever you choose:


    +   1. If you would like to download the Wubi standalone program, and didn''t
    create a CD earlier, head off to http://wubi-installer.org and click the Download
    Now link. Run the program once it''s downloaded and skip to Step 3 below.

    +   2. If you created an Ubuntu CD from the downloaded ISO image file, insert
    the Ubuntu CD while Windows is up and running. Select the Run Wubi.exe option,
    if prompted, and, from the menu that appears, select the Install Inside Windows
    option.

    +   3. The Wubi program window will appear, as shown in Figure 1-3. Under the
    Installation Drive heading, select the partition or hard disk on which you want
    to place the Ubuntu files. Usually the default choice of C: is fine.

    +   4. Under the Installation Size heading, choose how much space you''d like
    the Ubuntu installation to take-up. The default setting will probably be fine,
    but you can reduce it if disk space is tight.

    +   5. If you''re installing using the Ubuntu CD, there will be only one choice
    under the Desktop Environment heading, so leave this as it is. If you''re using
    the standalone installer, here you can choose whether to install Ubuntu, Kubuntu,
    Xubuntu, or MythBuntu.

    +   6. Under the Language heading, select your preferred language.'
