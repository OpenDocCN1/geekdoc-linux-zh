- raw:
  - '[PAGE 102]


    This adds (+) write (w) permissions for others (o).


    On the other hand, if we wanted strict secrecy so that only the file''s owner
    could read or write to the file, and nobody else, we could type the following:


    +   - `chmod go-rw report.doc`


    This removes (-) read and write permissions (rw) from report.doc for the group
    and others (go). If anybody apart from the owner should subsequently try to view
    or modify report.doc, they''ll get a “Permission denied” error.


    TIP A quick way of removing all permissions for a type of user is to use the equals
    sign (=). For example, to remove all permissions for the group, you''d type chmod
    g= report.doc. This is the equivalent of typing chmod g-rwx report.doc.


    # Changing folder permissions


    Folders are handled in the same way, although to allow/deny access to the folder,
    the execute (x) permission is set/unset.


    The following will stop everybody apart from the folder''s owner reading a file
    listing of the Documents folder, reading/writing files, and switching into the
    folder:


    +   - `chmod go-rwx Documents`


    In other words, this makes the folder entirely private.


    NOTE Don''t forget that the root user can access all files and folders, no matter
    what their ownership or permission. It''s worth mentioning with respect to privacy
    that the Ubuntu boot menu''s Recovery option allows anybody using the computer
    to login as root, with no password required. Because of this, true privacy of
    files is only guaranteed via encryption, as explained in Chapter 7.


    Subfolders within a folder inherit the execute permissions of the parent folder.
    In other words, if it''s not possible to access the Music folder because the execute
    permission isn''t set, you won''t be able to access a folder within it even if
    permissions are set correctly for that subfolder.


    # Special permissions


    In addition to read, write and execute, there are three other types of permission
    you might encounter: Set user ID (SUID, or SETUID); Set Group ID (SETGID); and
    the “sticky bit”.'
  - '[PAGE 103]


    These might be described as specialist permissions with specific system administration
    uses, and it''s unlikely you''ll need to make use of them day-to-day. They operate
    as follows:


    # Set User ID:


    In its most typical use, the SUID permission allows a program to run as if the
    program''s owner was running it (in other words, it runs with the permissions
    of the file owner, rather than the user who''s running it). It''s most commonly
    used to allow ordinary users to run programs with root powers, without the need
    to use sudo or switch to root user first. Such a program would be owned by root,
    will be set as executable, and have the SUID permission set. The s permission
    must be specified with chmod to set SUID (i.e. sudo chmod u+s programname). The
    SUID permission shows-up in long file listings as an s in place of the usual x
    that marks an executable file (i.e. -rwsr-xr-x).


    > NOTE Under Ubuntu the SUID permission has no relevance when applied to folders,
    and is ignored if set.


    # Set Group ID:


    As with SUID, the Set Group ID permission causes a program to run with the permissions
    of its group. However, SETGID is mostly used with folders, where it forces all
    files or subfolders created within the folder to inherit the group permission
    of the folder, rather than the user who created it. As above, the s permission
    is specified (i.e. chmod g+s myfolder), and the permission shows up as s in file
    listings.


    # Sticky bit:


    When set on a folder, the sticky bit means that only the owner of a file or subfolder
    within that folder can delete it (although the owner of the folder itself will
    be able to delete the file, as can root). The sticky bit is useful for folders
    where files are shared, but the administrator doesn''t want users to be able to
    delete any other user''s files. The sticky bit is indicated in file listings by
    a t at the end of the permission listing (i.e. drwxrwxrwt), and is set by typing
    chmod +t foldername. When applied to a file within Ubuntu, the sticky bit is meaningless
    and is ignored.


    > NOTE Should you see a capital S or capital T within file listings, instead of
    lower case letters, the execute permission hasn''t been set for the relevant file
    or folder. Although SUID and sticky bits normally rely upon the file/folder being
    executable, they don''t automatically set it.'
