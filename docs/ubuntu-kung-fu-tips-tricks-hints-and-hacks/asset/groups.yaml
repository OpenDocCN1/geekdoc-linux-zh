    refresh rate most find comfortable is 75Hz. Flat panels should be set to 60Hz.


    If the screen resolution you want isn’t available in the Resolution drop-down
    list, or just doesn’t work as expected, you might have to activate the proprietary
    graphics card drivers, as described below.


    # Installing proprietary drivers


    Installing proprietary graphics card drivers means Ubuntu will no longer use the
    Free Software versions. It should only be done if absolutely necessary (for example,
    if the built-in drivers don’t produce optimal results) because proprietary drivers
    are not updated as frequently as the Free Software versions and, some suggest,
    can be very buggy.


    To install proprietary drivers, first ensure you’re online—see the *Getting Online*
    section later. This is necessary because the new drivers will be downloaded. Then
    click System ➜ Administration ➜ Hardware Drivers.


    If you’re using Ubuntu 8.10, select the entry in the list for your graphics driver
    and click the ACTIVATE button (see Figure 2-1 for an example).


    > **TIP**  If several drivers are offered, select the one that’s marked “Recommended”.
    If this proves less than optimal, repeat this step and choose a different version.


    If you’re using Ubuntu 8.04, simply put a check in the Enabled column alongside
    the entry for your graphics card.


    With either version of Ubuntu, the new graphics driver will be downloaded once
    you’ve made the selection. You may have to reboot the computer once it’s finished
    installing—just follow the on-screen prompts.'
