    # Rebooting and shutting down


    To shutdown or reboot the computer, click the Shut Down entry on the System menu
    (under Ubuntu 8.04, select the Quit entry). Then select the relevant option from
    the dialog box that appears.


    > TIP You can also end your Ubuntu session by selecting the relevant entry the
    Fast User Switcher applet; see Figure 3-3 above.


    Depending on your PC''s hardware capabilities, you might also see options to suspend,
    and to hibernate. These are power saving modes, and the differences are as follows:


    Suspend: This reduces power to all hardware devices with the exception of RAM.
    To "wake" the computer, you must hit a key, or press the computer''s power button.
    The computer will come back to life within a second or two, and you can continue
    working in applications that were open prior to suspending.


    Hibernate: This saves the contents of the RAM to hard disk and entirely powers-down
    the computer, as if it has been switched off. When the computer is next powered
    on, the contents of the RAM are loaded from disk, and you should find yourself
    back at the exact instant you chose to hibernate.


    You should test either mode before relying on them. The hibernate mode in particular
    may or may not work correctly, depending on your hardware configuration. Always
    save data in any open applications before hibernating or suspending your computer.


    > TIP To configure a laptop to automatically enter hibernate/ suspend mode when
    the lid is closed, click System ▸ Preferences ▸ Power Management, click the On
    AC Power/On Battery Power tabs, and choose the relevant option from the When Laptop
    Lid is Closed dropdown list.'
