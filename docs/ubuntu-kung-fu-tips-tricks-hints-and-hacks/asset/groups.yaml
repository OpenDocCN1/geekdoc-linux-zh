    | 仓库 | 详情 |

    |---|---|

    | Main | Main 仓库包含核心软件包。本质上，这是全新安装 Ubuntu 所需的最低限度仓库，尽管 Main 中也有一些并非基础环境所必需的额外软件包。Main
    中的软件由 Ubuntu 的赞助商 Canonical 正式支持，因此保证在该特定 Ubuntu 版本的生命周期内持续更新。 |

    | Universe | 被称为“社区维护”仓库，也可以称为“其余部分”，因为它包含 Linux 社区生成的大多数自由软件，而这些软件未包含在 Main 中。每个软件包都由
    Ubuntu 或 Debian 社区的成员维护。Universe 中的软件不受官方支持，因此不保证更新。 |

    | Restricted | 又称“专有驱动程序”，该仓库包含少量非开源软件，用于使某些 PC 硬件（主要是无线和图形设备）正常工作。该仓库中的软件会定期更新。
    |

    | Multiverse | 被称为“受版权或法律问题限制的软件”，该仓库实际上是“其余部分的其余部分”。Multiverse 中的软件与 Ubuntu 所使用的自由软件许可协议的字面意义或精神都不兼容。不过，这并不一定意味着
    Multiverse 中的软件是专有的。Multiverse 软件不受官方支持，可能不会更新。 |

    | Updates | 提供了两个更新仓库，用于发布软件修复程序；“security”仓库提供必要的安全更新，而“updates”仓库提供推荐的更新。 |


    如果软件需要安装其他软件包，则称它依赖于其他软件包。如果依赖软件包未安装，软件将无法工作。事实上，你甚至无法安装该软件。


    APT 的工作就是处理依赖关系，并且它会自动、几乎无感地完成这一工作。它知道某个特定软件包需要什么，并会自动将所需的软件包加入从仓库下载和安装的清单中。


    ![](img/48d064407ff591f0b5365c2d2919ee6e_118_0.png)


    图 6-1 Synaptic 软件包管理器。


    反过来也是如此——如果你尝试卸载某个被其他软件依赖的软件，APT 会警告你并建议解决方案，例如同时删除其他软件。这类软件包称为反向依赖。


    ## Synaptic：概述


    你可以通过两种方式添加和删除软件：使用图形界面工具 Synaptic 软件包管理器，或在命令行中操作。本节将介绍这两种方式，先从 Synaptic 开始。


    Synaptic 可以在“系统 → 管理”菜单中找到。它的界面易于理解，图 6-1 显示了一张带有标注的截图。各标注的描述如下所列。（请注意，该截图来自 Ubuntu
    8.10；Ubuntu 8.04 中的 Synaptic 版本略有不同，但大体相同。）


    +   1. 工具栏：在这里可以快速访问 Synaptic 的关键功能。也许最有用的按钮是 RELOAD（强制计算机获取仓库中最新的软件包列表）和 APPLY（在主软件包列表中做出选择后，必须单击该按钮才能开始安装/删除软件）。


    提示：部分仓库会频繁更新，因此在安装新软件之前，应始终从仓库获取最新列表。为此，每次启动 Synaptic 时，点击 RELOAD 按钮应当是你要做的第一件事。


    +   2. 筛选器列表：筛选器选择就显示在此处（参见紧下方“筛选器”标题）。单击此列表中的每个条目，可以细化主软件包列表。


    +   3. 筛选器：筛选器选择区域中的按钮允许你在上方筛选器列表区域显示的筛选器集合之间进行选择。每个按钮上都标注了每个筛选器选择的性质，具体描述如下：


    SECTIONS：这是默认视图。仓库通常按部分（sections）划分，便于浏览；选择 Sections 筛选器列表，可以让你根据这些部分细化主软件包列表。有关这些部分的说明可在
    http://packages.ubuntu.com/intrepid/ 找到。


    STATUS：在这里，你可以按已安装的软件包来筛选软件包列表。此外，“未安装（残留配置）”选项允许你筛选已被卸载但配置文件仍保留在系统中的软件。


    ORIGIN：此选项允许你按单个仓库筛选软件包列表。默认仓库列表请参见表 6-1。


    CUSTOM FILTERS：通过单击“设置 ⇨ 筛选器”，你可以创建自己的筛选器，通常用于帮助修复软件管理子系统中的问题。单击 CUSTOM FILTERS
    按钮即可显示这些筛选器，其中包含一系列现成的问题解决筛选器。


    SEARCH RESULTS：每当你搜索软件包时，此选项会自动被选中。


    +   4. 搜索：Ubuntu 8.10 提供了多种搜索软件包的方法，其中两种位于此处工具栏上（Ubuntu 8.04 附带的 Synaptic 只显示一个
    SEARCH 按钮）。在“快速搜索”（Quick Search）字段中输入内容，可以快速搜索软件包名称和描述。或者，你可以单击 SEARCH 按钮进行更彻底的搜索。

