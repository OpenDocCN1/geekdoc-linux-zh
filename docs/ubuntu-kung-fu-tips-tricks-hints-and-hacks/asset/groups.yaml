    # Command-line software management


    As useful as it is, Synaptic is little more than a graphical front-end for a series
    of commands that administer the APT software subsystem.


    The two most useful commands are apt-get and apt-cache. In addition to these commands,
    it is possible to install packages you''ve manually downloaded using the dpkg
    command.


    Installing software at the command-line can be quicker and more efficient than
    using Synaptic, so is a skill worth learning.


    > NOTE Of course, command-line software installation is also possible if the GUI
    isn''t working. It can therefore be very useful when trying to repair a broken
    system.


    In the sections below, I look at the same common software installation tasks mentioned
    previously, but this time at the command-line.


    For those who want a quick start, the most useful subset of software administration
    commands are outlined in Table 6-2. Remember that software installation requires
    root powers, so each software install or remove command should be preceded with
    sudo (commands that search or display information do not usually require root
    powers).


    > TIP Some people prefer to use the aptitude command instead of the APT commands.
    aptitude is slightly better in how it handles dependencies, and features a semi-GUI
    interface that makes it easy to use. For more details, see http://algebraicthunk.net/~dbrowne/projects/aptitude/doc/en/.


