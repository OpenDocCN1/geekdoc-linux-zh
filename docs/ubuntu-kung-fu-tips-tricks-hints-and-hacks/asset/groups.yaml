    There’s a lot more to the command history function provided by bash. You’re advised
    to read the history man page by typing man history.


    # TIP


    If ever you want to clear your history, just type history -c. Incidentally, the
    history data is kept in a simple text file called .bash_history in your /home
    folder.


    # Job management


    Thanks to the astonishing power of modern computers, very few commands take a
    long time to complete.


    # NOTE


    Bear in mind that modern computers are like gods compared to the room-sized computers
    that Unix was first developed on in the 1970s and 80s. Because of this, some of
    bash’s features can seem a little redundant in our modern day and age but it’s
    surprising how often they come in useful.


    However, even though most commands complete in the blink of an eye, it’s often
    useful to be able to run a particular command in the background, in order to get
    on with something else.


    For example, the updatedb command updates the database of files used by the locate
    file search command. You can run it from the command-line by typing sudo updatedb.
    If you do so, the prompt will be tied up for up to a few minutes, during which
    you won’t be able to work unless you open a new terminal window.


    To avoid this, you can set the command to run in the background after starting
    by adding an ampersand (&) character to the end:


    +   - sudo updatedb &


    You’ll be told the job number (in square brackets), and can switch to the new
    job by typing fg.


    Alternatively, you can start the command as usual and hit Ctrl+Z. This will then
    put the command to the background, returning control of the prompt to you. Again,
    you can switch back by typing fg.'
  - '[PAGE 107]


    # Managing processes


    One of the commonest command-line tasks is clearing-up programs that have crashed,
    something known as managing processes.


    On a technical level, Linux refers to currently running programs as processes.


    > NOTE Some programs start more than one process, so perhaps a better definition
    of a process is that it is all or part of a program, and not necessarily an entire
    program.


    You can see a constantly updating list of processes by typing the top command
    in a terminal window (hitting Q will quit when you''re done).


    As with files and folders, all processes are "owned" by a user. Only the individual
    who owns a process can terminate it, although the root user has the power to terminate
    any process.


    The majority of processes listed in top are started at boot-up. These provide
    essential background services, such as the GUI. Such processes are usually owned
    by the root user. This protects them from interference by ordinary users.


    All processes are numbered. The number is known as the Process ID, or PID, and
    this is listed on the left of each entry in the top program list.


    To force a process to quit—known as killing the process—hit K and type the PID.
    You''ll be asked what signal you wish to send. Hitting Enter selects the default
    (15). This is fine in most cases.


    You can also use the ps command to list processes at the command-line, and find-out
    process IDs. Normally the a, u and x command options are used with ps, and cause
    the command to return a full list of all processes complete with their names.


    Additionally, the output is usually "piped" into the grep command to search for
    the program you''re interested in. I discuss piping in the Advanced Bash Techniques
    section later, but for now it''s enough to know that piping "sends" the output
    of one command into another.


    Let''s look at an example. Although Firefox very rarely crashes, let''s say that
    you''ve visited a website that''s caused it to lock-up. All attempts to quit the
    program in the usual way no longer work.


    The following command will search the list of running processes and return the
    PID of Firefox:


    +   - ps aux|grep firefox'
  - '[PAGE 108]


    The PID is the first number listed on each line in the results, and on my test
    PC the PID for Firefox was 15994. Knowing this, I was able to use the kill command,
    as follows:


    +   - `kill 15994`


    This caused Firefox to instantly quit. Bear in mind that, if you kill a program
    in which you are editing data, you won''t be prompted to save it first. The kill
    command shows no mercy!


    Another method of killing a program is to use the killall command. This lets you
    specify a command name, rather than the PID. So, to terminate Firefox, you could
    type the following:


    +   - `killall firefox`


    The downside of killall is that you need to know the program''s command name.
    ps aux can be used to discover this. killall also, as its name suggests, kills
    all examples of the process with the specified name.


    If you need to kill a root-owned process, simply precede kill or killall with
    sudo. Be very careful killing root-owned processes, however, because they tend
    to be related to the running of background services. Additionally, background
    service processes frequently spawn their own set of processes, and killing the
    parent process will in most cases also kill its child processes—often with disastrous
    results.


    # Working with compressed files


    As mentioned on page 65, a variety of file compression and archive types might
    be encountered by the typical Ubuntu user. However, the two main types are zip
    files, as used in the world of Windows, and compressed tar archives.


    # Zip files


    The following will create a new zip file called report.zip, and add report.doc
    to it:


    +   - `zip report.zip report.doc`


    To zip a folder full of files, add the -r command option. The following will create
    reports.zip, containing the contents of the reports folder:


    +   - `zip -r reports.zip reports`


    NOTE If any files or folders have spaces or unusual characters in them, enclose
    them in quotation marks.'
