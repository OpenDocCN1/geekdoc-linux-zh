    ## 简要介绍\n\n本章的目的是向你介绍 Ubuntu 操作系统，以及支撑它的哲学。\n\n你正在阅读这本书可能意味着你已经了解 Ubuntu，但一两个读者可能只是随兴购买了本书的印刷版（或下载了\
