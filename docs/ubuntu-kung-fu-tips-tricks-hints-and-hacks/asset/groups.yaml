    Most man pages describe command-line tools, but the authors of some GUI applications
    also create them.


    TIP The man pages for many basic commands, such as cd, can be viewed by typing
    man builtins.


    Unfortunately for newbies, man pages take no prisoners. Not only are they written
    in technical and thorough language, but they also assume in-depth foreknowledge
    of how Linux works.


    As mentioned in Chapter 5, the grep command searches for text in a file. However,
    a newcomer would have trouble discerning this from the description in grep’s man
    page:


    ```

    grep [OPTIONS] PATTERN [FILE...]

    ```


    grep searches the named input FILES (or standard input if no files are named,
    or for a single hyphen-minus (-) is given as file name) for lines containing a
    match to the given PATTERN. By default, grep prints the matching lines.


    However, as complex as man pages might seem at first, they can be easily navigated
    provided a few simple rules are understood.


    ## Terminology


    You already know two terms that appear frequently in man pages—argument and option—because
    they were introduced in Chapter 5. To recap, an argument (sometimes referred to
    as an arg in man pages) is what you tell a command to work on (or with). This
    is usually a file or folder. A command option alters how a command works, and
    is usually a word or (more often) a letter, preceded by a hyphen (or two).


    NOTE Depending on what a command option does and its complexity, you may find
    an option has its own set of arguments that alter how that particular option works!


    Three phrases occur frequently in man pages: standard input, standard output,
    and standard error. Known technically as standard streams, they have a specific
    and important meaning relating to how Linux operates.


    Standard input is where a program takes input from, if a file isn’t specified.
    Standard output is where the output of a program is sent. Standard error is similar
    to standard output but, as you might have guessed, contains only error output.


    > NOTE Standard input, output, and error are sometimes referred to as stdin, stdout,
    and stderr.


    All you need to know is this: In simple terms, standard input usually equates
    to the keyboard, and standard output equates to the display.


    With this in mind, let’s re-examine the extract from grep’s man page. It says
    that if no filename is supplied, grep will search standard input. In other words,
    if no filename is specified, grep will search what you type.


    This ability to search what you type might seem of questionable usefulness. However,
    as mentioned in Chapter 5, it’s possible to redirect or pipe input into a command.
    In actual fact, redirection and piping replace standard input (hence the terms
    redirect or pipe—input to a command is redirected, or piped in).


    With this in mind, it becomes clear we can redirect or pipe input into grep, or
    any command like it that can take standard input.


    > NOTE Additionally, we can redirect or pipe the output of a command provided
    it uses standard output, which is to say, it usually displays its results on screen.


    The author of the grep command’s man page knew all about standard streams, of
    course, and he wrote the description the way he did because he expected you to
    know it too. If he’d had to explain from scratch, it wouldn’t have taken four
    lines to describe grep’s function—it would have taken four pages.


    ## Structure


    man pages are split into headings, each one inset against the main text and bolded.
    Commonly-encountered headings are as follows, although a typical man page may
    include more or fewer than this selection:


    - **Name:** Name of the command and a brief summary of its function.

    - **Synopsis:** A hypothetical example of the command. Arguments and options are
    underlined and listed where they should appear. Anything in square brackets ([
    ]) is optional. Pipes (|) separate choices where a variety of options can be specified.
    Ellipses indicate where more than one argument or option can be supplied.

    - **Description:** A concise and technical description of the command.

    - **Options:** Possible command options, and what they do.

