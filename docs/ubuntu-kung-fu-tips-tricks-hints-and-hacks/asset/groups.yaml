    # Configuring the firewall


    Ubuntu contains a very powerful firewall called netfilter that is part of the
    central kernel program. However, it isn''t active by default, and must be manually
    configured. The reason for this is that Ubuntu has no outward-facing services.
    If you imagine Ubuntu as a house, you could say that it has no windows or doors
    through which intruders can gain access. All incoming connections hit a brick
    wall.


    However, despite this fundamental protection, hackers are ingenious and there
    can be no room for complacency. Configuring the firewall using a GUI application
    like Firestarter, as described below, is so easy that there''s little reason not
    to do so.


    > TIP The ufw command can be used to configure the firewall at the command-line.
    This is relatively simple to use, but is still not as straightforward as a GUI
    application like Firestarter. For more details, see http://ubuntuforums.org/showthread.php?t=823741.


    # Installing and configuring Firestarter


    Firestarter is a simple yet very powerful firewall configuration tool. To install
    it, start Synaptic and search for firestarter. Put a check in the box alongside
    the firestarter entry in the results list and select Mark for Installation from
    the menu that appears. Click the APPLY button on the toolbar, and the APPLY button
    in the dialog box that appears.


    There''s no need to restart because Ubuntu''s firewall component can be started,
    stopped and reconfigured while the system is up and running. However, it is necessary
    to complete an initial wizard to configure Firestarter itself, so start the program
    by clicking System ⇨ Administration ⇨ Firestarter to run through this.


    > NOTE Bear in mind that there''s no reason to have the Firestarter configuration
    program running to enjoy the protection of Ubuntu''s firewall. All Firestarter
    does is configure Ubuntu''s built-in firewall. It isn''t a firewall application
    in itself.


    Click the FORWARD button to work through the wizard. When asked to select the
    network device you wish to protect, select the connection type from the Detected
    Device(s) dropdown list. If you''re using a wireless connection, ensure the list
    reads Wireless Device, or similar (see Figure 7-1). Bear in mind that "Ethernet"
    refers to a wired connection, wherein the computer is connected by cable to a
    router, switch, or hub.


    Leave the other options as they are and click FORWARD to work through the wizard
    to completion. At the end, click the SAVE button.'
