    Add to Panel。在出现的列表中，选择 Brightness Applet 并单击 ADD 按钮。这将添加一个新图标，单击后会显示一个滑块，让你调整背光程度。


    ## 屏幕保护程序


    你可以通过单击 System ⇨ Preferences ⇨ Screensaver 来选择屏幕保护程序并调整其激活的时间。


    ## 声音


    你可以通过单击桌面右上角的扬声器图标来更改音频音量。双击此图标将打开主混音器窗口，你可以在其中控制声音系统各个组件的音量，例如 CD 播放器，或 PCM（PCM
    是来自应用程序的音频输出，包括媒体播放器和网页浏览器）。


    > NOTE PCM 在 Windows 下有时被称为“wave”或“wav”。


    要充分利用声卡的功能集，请单击主混音器窗口中的 PREFERENCES 按钮，并在列表中为你希望添加到主混音器窗口的任何控件旁边打勾（在 Ubuntu 8.04
    中，单击 Edit ⇨ Preferences）。新的滑块或控件将立即添加。


