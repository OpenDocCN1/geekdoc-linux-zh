    Windows 不同。


    ### 路径


    Ubuntu 下没有盘符。相反，文件系统的根目录，在 Windows 下称为 C:\，在 Ubuntu 中仅用正斜杠（/）标识。


    此外，Windows 使用反斜杠（\ ）来表示文件系统的根目录，并在路径列表中分隔文件夹，而 Ubuntu 使用正斜杠。


    因此，在 Windows 下常见的路径如 `C:\Documents ... and Settings\Owner\My Documents`，在 Ubuntu
    中你会看到类似 `/home/frank/Documents` 的路径。这种差异起初可能令人不适，但你会惊讶于自己适应得有多快。


    ### 挂载


    如果没有盘符，那么像 CD/DVD 驱动器或 USB 记忆棒等其他存储设备是如何访问的呢？


    答案是它们被 *挂载* 了——有效地，存储设备的文件系统被神奇地连接到 Ubuntu 文件系统中的某个特定文件夹。例如，插入 CD/DVD 后，其内容在浏览到
    `/media/cdrom` 文件夹时就会可见。


    需要注意的是，文件并非真正复制到该文件夹中。它们是以虚拟的方式提供的。你可以像操作其他任何文件和文件夹一样操作它们，尽管看起来它们包含在那个特定文件夹中，但实际上并非如此。


    任何可能已经存在于用作 *挂载点* 的文件夹中的内容都会暂时消失。但是，内容仍然在那里，如果存储设备被 *卸载*，内容就会重新出现。


    挂载听起来可能很复杂，但不用担心——它几乎总是自动完成的，要么在启动时对永久连接到电脑的设备进行，要么在将可移动存储设备连接到电脑时进行，例如 USB 棒。事实上，你可能根本不会注意到它的发生；用户在插入
    USB 记忆棒后看到的只是桌面上出现一个新图标，双击后即可浏览 USB 棒上的文件。当然，如果用户仔细观察，她会看到自己实际上是在浏览 USB 记忆棒被挂载到的文件夹。


