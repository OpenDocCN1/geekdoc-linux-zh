    ## 桌面搜索


    Ubuntu 提供了一个强大的桌面搜索工具 Tracker。与标准的文件搜索工具不同，Tracker 能够编目 PDF 或办公文档等文件的内容，以及它们的文件名。这意味着你不仅可以按文件名搜索，还可以按文档可能包含的关键短语进行搜索。


    要激活 Tracker，请单击 系统 ⇨ 首选项 ⇨ 搜索和索引。在“启用索引”和“启用监视”框中打勾。如果你使用的是笔记本电脑，还可以选择“在电池供电时禁用所有索引”。完成后单击确定，并在提示时单击重新启动按钮。


    > 注意 Tracker 默认未激活，因为担心笔记本电脑的电池寿命问题——Tracker 需要频繁访问磁盘来构建其索引，这会消耗电量。一些人也担心 Tracker
    对整体计算机性能的影响。最好的办法是试用一下。如果你不喜欢它，始终可以关闭它。


    一旦 Tracker 被激活，一个新图标将被添加到屏幕右上角的通知区域。通过单击它，你将能够输入搜索词或单词。请注意，Tracker 激活后，初始搜索索引的构建需要几分钟时间。


    > 提示 要让 Tracker 索引 Microsoft Word 文档的内容，请安装 wv 包。软件安装在第 6 章中有说明。安装 wv 后，通过右键单击搜索图标并从出现的菜单中选择该选项，强制
    Tracker 重新索引。


    ## Deskbar


    虽然它可能被视为 Tracker 的附属工具，但 Ubuntu 的 Deskbar 搜索小程序是一个具有自己功能集的独立工具。它可以通过在面板上右键单击空白处，从出现的菜单中选择“添加到面板”，在小程序列表中选择
    Deskbar，然后单击“添加到面板”按钮来添加到面板。


    ### 表 3-1. 有用的日常 Ubuntu 应用程序。


    | 类型 | 应用程序 | 详情 |

    |---|---|---|

    | Web 浏览器 | Firefox 应用程序 ⇨ Internet ⇨ Firefox Web 浏览器 | 完全能够替代 Internet Explorer
    用于一般浏览和访问交互式“Web 2.0”应用程序，例如 Google Docs (http://docs.google.com)。可以安装多个附加组件以提供额外功能，并且界面可以个性化——单击
    工具 ⇨ 附加组件 即可。 |

    | 即时消息 | Pidgin 应用程序 ⇨ Internet ⇨ Pidgin Internet Messenger | 功能强大的聊天程序，可“使用”AIM、Yahoo!、MSN、IRC、ICQ
    和许多其他协议。首次启动时你会被提示添加初始账户。随后可以添加更多账户（单击 账户 ⇨ 管理账户），这样你就可以通过同一程序与所有联系人聊天。 |

    | 邮件/PIM | Evolution 应用程序 ⇨ Internet ⇨ Evolution Mail | 一体化邮件客户端、日历应用程序、通讯录和组织器。它毫不掩饰地借鉴了
    Microsoft Outlook，也许是 Ubuntu 武器库中最强大、最专业的工具之一。启动时你会逐步完成初始邮件账户的配置。 |

    | 图像编辑与编目 | GIMP 应用程序 ⇨ Graphics ⇨ GIMP Image Editor F-Spot 应用程序 ⇨ Graphics ⇨
    F-Spot Photo Manager | GIMP 是一款专业级图像编辑器，提供与 Adobe Photoshop 等商业应用程序中发现的大部分功能。GIMP
    不应与 F-Spot Photo Manager 混淆。后者编目照片并允许简单图像调整。F-Spot 将在你连接数码相机时自动启动，并将照片存储在你的 /home
    文件夹内的 Pictures 文件夹中。 |


    Deskbar 的目标只是提供另一种访问计算机的方式。想要打开你的文档文件夹？只需单击 Deskbar 图标并在出现的 Deskbar 文本字段中输入 documents。然后从出现的菜单中选择“打开位置”选项（你可以使用光标键来执行此操作，而不是单击鼠标；请注意，最常访问的条目始终位于列表顶部）。


    想要访问网站？在其中输入 URL 并从 Deskbar 菜单中选择打开。当然，如果你想搜索文件——或文件中的某些文本——只需将其输入 Deskbar 搜索字段即可。文件将列在结果中，你可以选择它来打开它。


    > 注意 要能够搜索文件或文件内容，必须启用 Tracker，如前所述。


    事实上，Deskbar 可以搜索和/或允许访问的内容几乎没有限制。它依赖于插件结构，这意味着可以轻松添加新功能。要查看已安装哪些插件并激活/停用它们，请右键单击
    Deskbar 图标并从出现的菜单中选择首选项。然后，确保已选择“搜索”选项卡，在你感兴趣的项目旁边打勾。


    > 提示 新的小程序以及安装说明可以在 http://live.gnome.org/DeskbarApplet/Extending 上找到。


    ## 键盘快捷键


    Ubuntu 使用各种键盘快捷键快速访问内置功能。其中一些快捷键与 Windows 下的相似，而一些是独特的。有关更多信息，请参阅表 3-2。其中一些快捷键仅在启用桌面特效时才有效——请参阅第
    2 章中的图形部分。


    ## 添加新用户


    向你的 Ubuntu 系统添加新用户非常容易。你可能想这样做，以便为你的孩子或配偶提供自己的账户。


    与 Windows 一样，你可以创建有限用户账户，阻止个人管理系统。系统 ⇨ 管理 菜单中的多个条目将被删除，如果用户以某种方式绕过此限制并运行某些配置软件，他们的密码
    simply 不会被接受为授权。


    '
