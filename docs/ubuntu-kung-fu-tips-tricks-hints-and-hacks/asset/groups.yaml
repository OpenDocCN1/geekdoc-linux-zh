    in the filesystem—/home/keir/Documents/report.doc, for example. Paths can be expressed
    in two ways: relative and absolute.


    Imagine that a user called Frank is using the command-line and is browsing his
    Pictures folder, whose location is /home/frank/Pictures.


    > NOTE Remember that the root of the filesystem, indicated by C:\ under Windows,
    is indicated in Linux by a single forward slash (/).


