    # Desktop search


    Ubuntu offers a powerful desktop search tool in the form of Tracker. Unlike standard
    file searching tools, Tracker is able to catalog the contents of files such as
    PDFs or office documents, as well as their filenames. This means you are able
    to search not only by filename, but by key phrases that the document might contain.


    To activate Tracker, click System ⇨ Preferences ⇨ Search and Indexing. Put a check
    in the Enable Indexing and Enable Watching boxes. If you''re using a notebook
    computer, you might also choose Disable All Indexing When on Battery. Click OK
    once done, and click the RESTART button when prompted.


    > NOTE Tracker isn''t activated by default because of fears over battery life
    with laptop computers—Tracker has to frequently access the disk to build its index,
    and this consumes power. Some also have concerns about Tracker''s affect on overall
    computer performance. The best bet is to give it a try. You can always turn it
    off if you don''t like it.


    Once Tracker is activated a new icon will be added to the notification area at
    the top-right of the screen. By clicking this, you will be able to type a search
    term, or word. Note that it will take a few moments for the initial search index
    to build after Tracker is activated.


    > TIP To have Tracker index the contents of Microsoft Word documents, install
    the wv package. Software installation is explained in Chapter 6. Once wv is installed,
    force Tracker to reindex by right-clicking the search icon and selecting the option
    from the menu that appears.


    # Deskbar


    Although it might be considered an adjunct to Tracker, Ubuntu''s Deskbar search
    applet is a separate tool with its own feature set. It can be added to a panel
    by right-clicking a blank spot on the panel, selecting Add to Panel from the menu
    that appears, selecting Deskbar in the applet list, and clicking the ADD TO PANEL
    button.'
