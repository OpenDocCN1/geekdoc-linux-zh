    ## 附录 B

    ## 深入学习

    以及获取帮助


    高效使用 Ubuntu 的一个重要方面是知道在哪里以及如何获取帮助，一般来说，帮助可以从三个地方找到：在印刷品中、在线以及 Ubuntu 本身中。


    ## 书籍和杂志


    Linux 受到了杂志出版物的良好服务。其中被认为具有权威性的包括 Linux Journal（www.linuxjournal.com）和 Linux Magazine（www.linux-mag.com）。在美国以外，值得注意的英文刊物有
    Linux Format（www.linuxformat.co.uk）、Linux User & Developer（www.linuxuser.co.uk）以及
    Linux Pro Magazine（www.linux-magazine.com；在美国以外仅称为 Linux Magazine）。


    也有几本基于 PDF 的杂志可供使用。Full Circle Magazine 专门报道 Ubuntu 以及影响 Ubuntu 社区的问题。它由社区生成，可免费获取。如需了解更多信息，请访问
    http://fullcirclemagazine.org。


    同样值得阅读的是 Free Software Magazine，大约每两个月出版一次免费的 PDF 版，涵盖与自由软件世界相关的问题，包括但不限于 Linux。如需了解更多信息，请访问
    www.freesoftwaremagazine.com。


    就书籍而言，作为 Ubuntu 的完整指南，我推荐我自己的书，Beginning Ubuntu Linux（www.apress.com/book/view/）。1598599918）。现在已是第三版，Beginning
    Ubuntu Linux 是第一本涵盖 Ubuntu 的英文书籍。它后来获得了 Linux Journal 年度终端用户/非技术图书奖，并经常位居其出版商畅销书榜首。


    也可能感兴趣的是我的另一本书，Ubuntu Kung Fu（www.pragprog.com/titles/ktuk/ubuntu-kung-fu）。它经常位居
    Amazon.com Linux 畅销书榜首，Ubuntu Kung Fu 包含超过 300 条适用于各级别 Ubuntu 用户的技巧、窍门、提示和黑客。它是
    Ubuntu Pocket Guide and Reference 的绝佳搭档，将帮助你进一步提升 Ubuntu 技能，同时有效改善你的 Ubuntu 使用体验。


    ## 在线帮助


    Linux 与互联网一起成长，因此不足为奇的是，Linux 新手最好的帮助来源是在线找到的。


    ### 论坛


    Ubuntu 社区聚集的核心无疑是 http://ubuntuforums.org，一个致力于 Ubuntu 使用各个方面的留言板论坛系列。


    除了众多专家版主外，许多 Ubuntu 老手也经常光顾这些板块，并渴望与遇到问题的人分享他们的智慧和经验。此外，许多人创建了 How To 指南，尤其涉及前沿软件的使用，这些构成了
    Ubuntu 社区文档的重要组成部分。


    从 Ubuntuforums.org 获得最大收益的关键是“先做研究”。Ubuntuforums.org 的管理员之一 Matthew Helmke 这样说。“搜索
    Google 等，”他继续说道，“提及你找到的内容，以及你为解决问题已尝试的任何方法的成果。”


    Matthew 还建议在发帖时表述清晰，并完整描述问题——包括你在选择的主题行中。主题标题如“配置 wifi：WEP 不工作”更有可能获得更高质量的回复，而不是“帮助！它不工作！”。保持礼貌，即使有人不愉快地回应。


    “一次只问一个问题，”Matthew 继续说。如果你有多个问题，请创建多个帖子，但不要一次发太多内容。没有人喜欢看到同一人连续五条消息。


    最重要的是，当问题解决时，添加一条消息说明这一点。“如果解决方案是由帖子中的某人发布的，”Matthew 说，“请感谢他们。”你可以通过发帖表示感谢来感谢用户，但也可以点击有帮助帖子右下角的
    **Thanks!** 图标。这会增加用户的“感谢”计数，并有助于表明值得信赖和受重视的社区成员。


    如果你在其他地方找到了答案，请发布链接，并解释你找到的信息如何帮助了你。如有必要，请提供上下文。


    最重要的是，请记住 Ubuntuforums.org 充当着与 Ubuntu 相关的庞大智慧库。你的帖子提升了这一努力。


    Ubuntuforums.org 当然不是唯一的实用论坛网站。我还推荐 **www.linuxquestions.org**，这是一个通用的 Linux 论坛网站，拥有强大的
    Ubuntu 板块，但还有许多其他网站。


    ### 邮件列表


    除了网站之外，你还可以考虑加入众多 Ubuntu 电子邮件列表之一。一旦你订阅，发送到列表的任何消息都会发送给所有成员，人数可能达到数百或数千人。邮件列表的其他成员可以回答你的问题，要么直接通过电子邮件，要么通过创建另一条邮件列表帖子。


    有关 Ubuntu 所有官方支持的邮件列表的列表，请参阅 https://lists.ubuntu.com。


    ### 内置文档


    如第 5 章所述，所有版本的 Linux 都包含手册页。这些本质上是关于相关软件如何工作的技术文档。


    此外，许多程序的创建者有时会创建单独的文档，通常更非正式，这些文档可以在 /usr/share/doc 文件夹中找到。


    最后，许多 GUI 程序都有自己的帮助文件，就像 Windows 一样。可以通过点击帮助菜单访问这些文件。


    ## 理解手册页


