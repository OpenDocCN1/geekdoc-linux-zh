    Agree to save your changes, if prompted. You will have to log out and back in
    again (System ⇨ Log Out in Ubuntu 8.10; System ⇨ Quit in Ubuntu 8.04) for the
    changes to take effect.


    > TIP If you find the graphical settings get scrambled while configuring multiple
