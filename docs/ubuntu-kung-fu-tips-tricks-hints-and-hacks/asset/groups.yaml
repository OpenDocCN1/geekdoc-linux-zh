    # Managing print jobs


    To view or cancel print jobs, click Applications ⇨ Accessories ⇨ Manage Print
    Jobs. This will display the current print queue. To delete a job, right-click
    its entry in the list and select Cancel.


    If a print job stalls for whatever reason, an icon will appear at the top-right
    of the screen. Double-clicking this will bring up the printer queue window automatically.


    # Installing a network printer


    To install a shared network printer in Ubuntu 8.10, such as one connected to another
    computer in your home or office, click System ⇨ Administration ⇨ Printing and
    click the NEW button in the toolbar (click NEW PRINTER if using Ubuntu 8.04).
    Then select the type of network printer you’d like to connect to across the network.


    For printers utilizing a network server device—normally found only in corporate
    environments—select AppSocket/HP JetDirect. Enter the address details on the right
    of the program window. This will probably take the form of an IP address and a
    queue name—see your administrator for these, or the print server’s documentation.


    If connecting to a shared printer on a Windows PC, select Windows Printer via
    SAMBA, and click the BROWSE button to have Ubuntu automatically detect shared
    printers on the local network, as shown in Figure 2-3. Click the chevrons alongside
    each heading to “unfold” them and, when you find the printer you’re looking for,
    select it and click the OK button.


    Back in the parent window, click the radio button alongside Set Authentication
    Details Now (under Ubuntu 8.04 click the Authentication Required checkbox) and
    enter the Windows (not Ubuntu!) login username/password required to access the
    Windows account that’s sharing the printer. Click VERIFY to check that the details
    work.


    Click Forward when done to install the printer driver. It is unlikely it will
