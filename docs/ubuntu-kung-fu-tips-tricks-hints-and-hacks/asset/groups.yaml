    ## 个性化


    几乎 Ubuntu 用户界面的任何元素都可以自定义，从桌面壁纸到程序标题栏和按钮。


    要查看个性化选项，请点击 系统 ⇨ 首选项 ⇨ 外观。这将打开 外观首选项 对话框，你可以在程序窗口中选择标签页来做出你的选择。


    ## 主题


    程序窗口和对话框的外观和感觉被称为主题，Ubuntu 中提供了多个主题，超出了橙色的默认外观。你可以通过在 外观首选项 对话框中选择 主题 标签在它们之间切换。更改会立即生效。


    通过点击 自定义 按钮，你可以微调程序窗口和对话框的个性化设置，包括更改所使用的颜色。


    请参阅 图 3-2 作为示例。如上所述，更改会在你做出更改的瞬间应用。


    > TIP 新主题和壁纸可以从 http://gnome-look.org 等网站下载。一旦新主题下载完成，只需将归档文件拖放到 外观首选项 对话框的任何位置即可安装它。无需先解压归档文件。此外，通过安装
    community-themes 软件包，可以将多个社区生成的主题添加到 Ubuntu 8.10，并通过安装 gnome-backgrounds 软件包（在
    8.10 和 8.04 上均可）添加一些优秀的壁纸。软件安装在第 6 章中有描述。


    ## 字体


    在 Ubuntu 下，不仅可以自定义桌面显示的各个元素所使用的字体，还可以微调它们在屏幕上的显示效果（称为字体渲染）。要调整字体设置，请点击 系统 ⇨ 首选项
    ⇨ 外观 并选择 字体 标签。


