    文件夹中）。在出现的程序窗口中，选择左侧磁盘列表中代表你的硬盘的最顶层条目，然后点击右侧的 PARTITION 按钮。在分区图形预览中选择 BOOTCAMP
    条目，然后点击下方的减号按钮。然后点击 REMOVE。完成后关闭磁盘工具。


    - 3. 下载并安装 rEFIt 软件。它提供了一个启动菜单，让你可以在 Mac OS X 和 Ubuntu 之间进行选择。rEFIt 可以从 http://refit.sourceforge.net
