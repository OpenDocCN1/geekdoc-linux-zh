  - "[PAGE 27]\n\n+   1. Insert the Ubuntu CD and reboot your computer. At the BIOS\
    \ startup screen, look for the keypress option that brings up the boot device\
    \ menu. Exactly what this is varies from computer to computer. On many computers\
    \ you’ll need to hit the Esc key, or F12. Select the CD/DVD-ROM drive from the\
    \ menu when it appears. If there’s no option for bringing up the boot device menu,\
    \ enter BIOS setup by hitting the relevant key (usually Delete). Then configure\
    \ the CD/DVD-ROM drive as the first boot device. Again, how this is done varies\
    \ from PC to PC.\n+   \n+   2. When the computer boots from the CD, the Ubuntu\
    \ CD-ROM boot menu will appear. Using the up/down cursor keys, select your preferred\
    \ language from the list and hit Enter. Then highlight the Install Ubuntu option\
    \ on the main menu using the cursor keys and hit Enter.\n+   \n+   3. Eventually\
    \ the Ubuntu installation program window will appear, as shown in Figure 1-1.\
