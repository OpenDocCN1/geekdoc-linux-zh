    user account and the operation of the desktop. You can also alter some hardware
    settings, such as the screen resolution, but only those that relate to your personal
    desktop configuration.


    **Administration:** This menu offers system-wide hardware configuration options,
    such as altering the time/date, and options for configuring the underlying Ubuntu
    system, such as adding/removing software.


    ## Icons and applets


    Alongside the menus are quick launch icons for the web browser, email client,
    and help system, respectively.


    > TIP You can add your own icons here by clicking and dragging them from the menus,
    or even from the desktop.


    At the right of the top panel is a time/date display, along with a system tray
    area (known within Ubuntu as the notification area). As with Windows, various
    icons appear here informing you of the system status (such as battery charge if
    you''re using a laptop), or when certain administrative actions are required.
