    | .tar.bz2 | 使用 bzip2 软件额外压缩的 Tar 归档，通常在创建时进行压缩。Bzip2 压缩会导致所有文件中最小的文件，因此更可取。有时使用
    .tbz 文件扩展名代替 .tar.bz2。 |

    | .zip | 与 Windows 类似，zip 文件是压缩归档。由于多年前法律上的顾虑，zip 文件在 Linux/Unix 世界中并未获得太多关注。这已不再是问题，但
    gzip 和 bzip2 等其他归档格式更为成熟。 |


    技术。然而，tar 文件几乎总是使用附加程序压缩，最受欢迎的是 bzip2 和 gzip。使用压缩的 Tar 文件通常具有双重文件扩展名，表示使用的压缩类型：.tar.bz2
    或 .tar.gz。


    > 注意 有时单个文件使用 bzip2 或 gzip 压缩，而无需先创建 tar 文件。如果是这种情况，它们只需具有 .gz 或 .bz2 扩展名。例如，Ubuntu
    文档中 /usr/share/doc 目录下的文件就是这种情况。


    在 Ubuntu 下使用的最流行压缩文件格式类型的详情列在表 4-3 中。


    ## 第五章


    ## 在命令行上手操作


    本章探讨了有些人认为 Linux 最迷人且最有用的方面：命令行。本章解释了：


    - 如何理解命令行提示符告诉你的内容；

    - 命令的工作原理（即参数和选项）；

    - 有用的日常命令概述；

    - 让你高效工作的技巧；

    - 在命令行中使用 root 权限；

    - 处理崩溃或停滞的程序；

    - 理解和操作文件权限；

    - 高级技巧（重定向、管道和大括号展开）。


    ## 关于 shell 的一切


    当我们谈论“命令行”时，我们指的是直接向 Linux 发出键入命令。大部分命令与操作文件有关，而一些则管理系统。命令行提供了强大的功能和灵活性，但代价是学习曲线稍陡——而且可以说缺乏直观性。


    ## bash 概览


    Ubuntu 中使用的命令行被称为 bash——Bourne Again SHell。这是 Bourne sh 程序的进化版本，Bourne sh 是 Unix
    最古老的命令行程序之一。大多数人认为 bash 提供了功能性和易用性的最佳综合。


    命令行程序有时被称为 shell，这个术语来源于——就像软体动物和甲壳类动物一样——shell “包裹”在操作系统的精密内部，保护它免受意外损坏！


    > 注意 图形用户界面有时也被称为 shell，因为根据上述定义，它与命令行提示符具有相同的功能。


    在 Linux 下，有时也会使用 bash 以外的 shell 程序。也许最流行的是 Korn Shell（ksh）和 C Shell（csh）。两者都面向编程，你不太可能与它们接触。bash
    是大多数流行 Linux 发行版的默认设置。


    ## 要 DOS 还是不要 DOS


    你可能会想知道 Linux 命令行是否与 Microsoft DOS 相似。它们是远房表亲，而不是兄弟姐妹。DOS 是 CP/M 的克隆，而 CP/M 本身借鉴了大量
    Unix 命令行。一些 DOS 知识会让你起步更快，但你必须在学习的同时忘掉同样多的东西！


    ## 理解提示符


    让我们马上开始。


    ## 启动命令行会话


    启动命令行会话有两种方法：运行桌面终端程序（有时称为终端模拟器），或切换到虚拟控制台（也称为虚拟终端）。在这两种情况下，你访问的是完全相同的命令行。


    要切换到虚拟控制台，按 Ctrl+Alt+F2。GUI 将消失并被登录提示符取代。别担心——你的桌面仍然在那里，你可以通过按 Ctrl+Alt+F7 切换回来。只是虚拟控制台需要接管屏幕。


    > 注意 有六个虚拟控制台，可通过按 Ctrl+Alt 和 F2、F3、F4、F5、F6 访问。F1 上的控制台用于调试和日志输出，最好避免使用。


    通过输入你的用户名，然后输入密码登录。你不会因为已经在桌面登录而被阻止登录——在 Linux 下，用户可以登录任意多次。


