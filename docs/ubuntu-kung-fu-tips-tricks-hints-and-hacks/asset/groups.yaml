    \ root 权限，而是其一个组件。这更安全，并且最终 Ubuntu 的所有管理应用程序都将以这种方式工作。\n\n> **NOTE**  \n> 在命令行工作时，任何需要管理权限的命令都必须以\
    \ `sudo` 为前缀（例如，对于 GUI 应用应使用 `sudo sh`）。我在第 5 章中对此进行了更详细的解释。\n\n## 文件权限\n\n尽管\
    \ root 用户账户在 Ubuntu 中处于次要位置，但其影响无处不在。大多数操作系统文件由 root 用户“拥有”，并且权限设置只有 root 才能编辑它们。换句话说，只有\
    \ root 用户——或借用 root 权限的用户——才能\n\n![](img/48d064407ff591f0b5365c2d2919ee6e_72_0.png)\n\
    \nFigure 4-2. Typing a password to borrow root powers and administer the system.\n\
    \n删除或修改重要文件。在某些情况下，即使是普通用户查看操作系统文件也被禁止。\n\n通过 root 用户所有权来保护操作系统文件这一简单机制，就是 Linux\
    \ 强制执行安全性和系统保护的方式。它简单但非常有效，并且多年来经受住了时间的考验。\n\n> NOTE Windows 失败于做出这种区分，并有效地合并了标准用户和管理员类型的用户账户，这就是它如此不安全的原因之一。如果病毒感染了系统，它将以管理员权限运行，因此会造成真正的麻烦。Vista\
    \ 通过在用户对系统做任何稍微危险的事情时不断烦扰用户，在某种程度上修复了这种情况。\n\n文件权限是理解和操作 Linux 文件系统的核心，因此让我们更深入地了解一下它们。\n\
    \n如前所述，每个文件都由特定用户拥有——即使是系统文件，也由 root 用户拥有。\n\n文件的所有者可以设置三组不同的权限：首先为自己，其次为组，最后为其他所有人。\n\
    \n在为自己设置文件权限时，文件的所有者可以例如将文件标记为只读，以避免意外更改它。\n\n所有用户都是某个组的成员，每个文件除了由用户拥有外，还分配给一个特定组。因此，可以为该组的成员授予单独的文件权限集。\n\
    \n第三组也是最后一组权限可以为其他人配置，也就是说，为计算机上的不是文件所有者且不在该组中的用户。\n\n"
