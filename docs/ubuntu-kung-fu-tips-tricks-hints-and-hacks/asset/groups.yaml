    # Uninstalling software


    Removing software is just as easy as installing software, and all you need is
    the name of the package. If you''ve forgotten what this is, you can once again
    use apt-cache search to find it.


    Following this, use the apt-get autoremove command—the following will uninstall
    Frozen-Bubble:


    +   - sudo apt-get autoremove frozen-bubble


    You''ll be shown a list of the packages to be removed (that will include any redundant
    dependencies), and asked to confirm your decision by hitting Y or N.


    > NOTE Only unused dependencies will be marked for removal. This might vary from
    the list of dependencies that were originally installed. This disparity occurs
    because other software you''ve installed since also requires the dependencies.


    # Reinstalling software


    To refresh a package that''s already installed, type the following, replacing
    packagename with the name of the program as it is listed in Synaptic or via apt-cache
    search:


    +   - sudo apt-get --reinstall install packagename


    If the package isn''t already present in the system''s package cache (located
    at /var/cache/apt/archives), it will be downloaded afresh.


    # Manually installing/uninstalling packages


    If you find yourself having to install a package manually, the dpkg command can
    be used. The -i command option is used to install and the -r option can be used
    to remove packages, as follows:


    +   - sudo dpkg -i packagename.deb


    +   - sudo dpkg -r packagename


    > NOTE Once a package is installed using dpkg, it can also be removed using the
    apt-get autoremove command.


    The full filename of the package file must be specified when installing.'
