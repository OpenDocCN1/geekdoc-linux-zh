    ## Figure 2-1. Utilizing proprietary graphics drivers.


    ## Activating desktop visual effects


    As with all modern operating systems, Ubuntu includes a number of desktop visual
    effects that mean program windows fade into view when first activated, or visually
    shrink when minimized. This can make using Ubuntu a much more pleasant experience.


    Visual effects are made possible through the use of advanced graphics drivers.
    On systems utilizing some Intel or AMD/ATI graphics chips, open source versions
    of such drivers are available and will be installed by default, but for computers
    utilizing certain graphics chipsets, proprietary drivers must be installed for
    desktop effects to work.


    You can tell if your computer has desktop effects already activated by holding
    down Ctrl+Alt and hitting the left or right arrow keys. This will activate virtual
    desktop switching (I explain more about this in Chapter 3). If the desktop "slides"
    out of view, visual effects are already activated and no further work is needed.
    If you see a small panel appear in the


    ![](img/48d064407ff591f0b5365c2d2919ee6e_39_0.png)


    Agree to save your changes, if prompted. You will have to log out and back in
    again (System ⇨ Log Out in Ubuntu 8.10; System ⇨ Quit in Ubuntu 8.04) for the
    changes to take effect.


    > TIP If you find the graphical settings get scrambled while configuring multiple
    monitors, reboot your computer and, at the boot menu, choose the Ubuntu "recovery
    mode" option (usually the second choice in the list). When a second menu appears,
    select the xfix option. Then select the resume option to boot normally.


    ## Changing screen backlighting


    If you''re using Ubuntu on a notebook computer, you should be able to alter the
    screen backlighting brightness using the notebook''s standard keyboard combination,
    as with Windows. If this doesn''t work, right-click a blank spot on the bar running
    across the top of the screen and select Add to Panel from the menu that appears.
    In the list that appears, select Brightness Applet and click the ADD button. This
    will add a new icon that, when clicked, presents a slider that will let you alter
    the degree of backlighting.


    ## Screensaver


    You can choose a screensaver and adjust the amount of time after which it activates
    by clicking System ⇨ Preferences ⇨ Screensaver.


    ## Sound


    You can change the audio volume by clicking the speaker icon at the top-right
    of the desktop. Double-clicking this icon will bring up the main mixer window
    where you can control the volume of individual components of the sound system,
    such as the CD player, or PCM (PCM is the audio output from applications, including
    media players and the web browser).


    > NOTE PCM is sometimes referred to as "wave" or "wav" under Windows.


    To fully exploit the feature set of your sound card, click the PREFERENCES button
    in the main mixer window and put a check alongside any controls you''d like to
    add to the main mixer window (in Ubuntu 8.04, click Edit ⇨ Preferences). The new
    slider or control will be added immediately.


    The precise features offered will depend on the capabilities of your computer''s
    sound hardware. For example, to add a slider control for surround sound, put a
    check alongside the relevant checkbox in the list.


    ![](img/48d064407ff591f0b5365c2d2919ee6e_42_0.png)


    ## Getting online


    Depending on the hardware used, there are a variety of ways of getting online
    and/or connecting to a network. I deal with each separately below.


    ## Wireless


    Network connections are handled by Ubuntu''s NetworkManager applet that can be
    found at the top right of the desktop. Its icon is two monitors inset against
    each other. Clicking it will show a list of nearby wireless networks, as shown
    in Figure 2-2. Connecting to a network is simply a matter of selecting it and
    typing the wireless password when prompted. When done, click CONNECT.


    > TIP Ensure the right kind of wireless protection (i.e. WEP/WPA) has been detected
    by Ubuntu. Ubuntu got this wrong in one of my tests. You can select by clicking
    the Wireless Security dropdown.


    To connect to a wireless network that doesn''t broadcast its name (ESSID), click
    the NetworkManager icon and select Connect to Hidden Wireless Network from the
    menu (or Connect to Other Wireless Network under Ubuntu 8.04). Type the ESSID
    into the Network Name text field, and select the correct type of wireless protection
    from the Wireless Security dropdown list, filling-in the appropriate key/passphrase
    details beneath this. Click the CONNECT button when done.


    The Ubuntu 8.10 release includes much better wireless hardware support than earlier
    releases. If you find your wireless hardware isn''t supported by Ubuntu, and you''re
    using Ubuntu 8.04 or earlier, consider upgrading. You''ll know if the wireless
    card isn''t supported because no

