    \ Partition Size 标题旁边的手柄，你可以更改所创建的可用空间大小（参见图 1-2，下一页，手柄通过注释标出；请注意图 1-2 显示的是 Ubuntu\
    \ 8.10 安装程序）。\nNo changes are made until you click the FORWARD button. 通常安装程序的默认调整大小选择是可以的，但它在为\
    \ Ubuntu 占用空间方面可能有点激进，因此你可能选择拖动滑块以保留 Windows 分区中多一点的可用空间。如果在点击 FORWARD 按钮后你看到错误信息“Too\
    \ small size”，你将需要将滑块向右拖动一点以给 Windows 提供更多可用空间。\n- \n如果想将计算机硬盘完全用于 Ubuntu 并删除\
    \ Windows，点击 Guided—Use\n\n"
