    Files can be dragged and dropped between tabs. To do so, drag the file or folder
    to the other tab, and Nautilus will switch to it automatically. Then release the
    mouse button. Alternatively, you can simply copy, cut and paste files in the usual
    way using the Edit menu.


    # Searching for files


    Ubuntu offers two methods of searching for files: using the system-wide Tracker
    tool, as detailed in the *Desktop Search* section in Chapter 3, or using Nautilus’
    own more humble file search function. The two methods are independent, and you
    don’t need to have Tracker enabled to use Nautilus’ search functionality.


    To use Nautilus’ search function, click the SEARCH button on the toolbar, or hit
    Ctrl+F. Type part of the filename you’re looking for and hit Enter. By clicking
    the plus sign icon in the list of results, you can further refine the search results
    by filtering by file type.


    > **TIP**  Nautilus also offers a quick and dirty search function for files in
