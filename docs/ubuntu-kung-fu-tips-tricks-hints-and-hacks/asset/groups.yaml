    You should ensure Windows is shutdown cleanly before installing Ubuntu. If Windows
    crashes during shutdown, or you simply switch the power off, it won''t be possible
    for Ubuntu to resize the partition.


    ## Getting Ubuntu


    Ubuntu is offered for download as an ISO image file. This is quite simply the
    contents of a CD-ROM in one large file. The ISO file is designed to be burned
    to a blank CD-R or CD-RW disk using your computer. Ubuntu can then be installed
    using this disc.


    If you intend to use Wubi to install Ubuntu within the Windows filesystem, downloading
    the ISO image file is optional because Wubi can do it for you. See the Within
    Windows (Wubi) section later.


    > TIP The Ubuntu install CD also includes a "live" mode that runs Ubuntu straight
    from the CD. This lets you try-out Ubuntu but it''s too slow to be used permanently.


    However, before downloading Ubuntu, you''ll need to decide what version to use.


    ## Choosing a version


    The Ubuntu project has given rise to a number of spin-off projects. Each adapts
    the main Ubuntu release by adding and/or removing software, usually in the form
    of a different desktop environment, although some simply add-in specialist software.


    > NOTE It''s possible to switch to a different version of Ubuntu once it''s been
    installed, so making this choice now is not critical.


    Here are the main options:


    Ubuntu main release: This is the standard version of Ubuntu. It''s built around
    the user-friendly Gnome desktop environment (www.gnome.org) and includes a host
    of high-quality programs, including the Firefox web browser. If you don''t know
    what version of Ubuntu to choose, this is the one for you.


    > NOTE This book uses Ubuntu main release as a basis for all explanations, so
    is perhaps the best choice at this stage.


    Kubuntu: This is a version of Ubuntu that uses the KDE desktop environment (www.kde.org)
    instead of Gnome. KDE is mostly


    similar to Gnome but tends to offer more configuration options. It might be argued
    that Kubuntu is popular with power users. Kubuntu differs from Ubuntu in that
