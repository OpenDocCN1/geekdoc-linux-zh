    # Table 1-2. Ubuntu releases and support expiry dates.


    | Version number | Nickname | Updated until |

    |---|---|---|

    | 4.10 | Warty Warthog | April 2006 |

    | 5.04 | Hoary Hedgehog | October 2006 |

    | 5.10 | Breezy Badger | April 2007 |

    | 6.06 LTS¹ | Dapper Drake | June 2009 |

    | 6.10 | Edgy Eft | April 2008 |

    | 7.04 | Feisty Fawn | October 2008 |

    | 7.10 | Gutsy Gibbon | April 2009 |

    | 8.04 LTS | Hardy Heron | April 2011 |

    | 8.10 | Intrepid Ibex | April 2010 |

    | 9.04 | Jaunty Jackalope | October 2010 |


    ¹ 6.06 LTS was released eight months after the previous release, rather than six.


    # Making the best choice


    What should you use? At the time of writing, the choice is either the 8.04 LTS
    release, released April 2008, or the newer 8.10 release, released October 2008.
    There''s no point using an earlier release than this because its support period
    will soon expire, if it hasn''t already.


    > NOTE Releases prior to 8.04 don''t include the Wubi software.


    8.04 LTS offers support for a longer period, and is designed to be stable and
    reliable, so is the logical choice. Non-LTS releases are used to experiment with
    new features and software, so can be unpredictable and even buggy.


    If you simply want to switch to Ubuntu for a fuss-free life then, undoubtedly,
    8.04 LTS is best. It''s also ideal for corporate or home office environments.
    It is supported with updates until April 2011.


    However, if you''d like to use cutting-edge software, and really see what the
    world of Linux has to offer right now, you might choose the 8.10 release. It is
    supported until April 2010.


    > NOTE The 8.10 release also has much better wireless network and Bluetooth support
    than 8.04.


    # Downloading Ubuntu


    To download Ubuntu, simply head off to www.ubuntu.com and click the relevant link
    to download the ISO image of Ubuntu.


    Select the desktop edition for 32-bit computers.'
