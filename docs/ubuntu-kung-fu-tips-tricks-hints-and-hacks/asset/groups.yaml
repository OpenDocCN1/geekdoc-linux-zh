    ![](img/48d064407ff591f0b5365c2d2919ee6e_118_0.png)


    Figure 6-1. Synaptic Package Manager.


    This applies the other way around too—should you try to uninstall some software
    that''s depended upon by other software, APT will warn you and suggest a solution,
    such as removing the other software at the same time. Such packages are known
    as reverse dependencies.


    # Synaptic: An overview


    You can add and remove software in two ways: using Synaptic Package Manager, which
    is a GUI tool, or at the command-line. Both are covered here, starting with Synaptic.


    Synaptic can be found on the System → Administration menu. Its interface is easy
    to understand, and Figure 6-1 shows an annotated screenshot. Descriptions of the
    callouts are listed below. (Note that the screenshot is taken from Ubuntu 8.10;
    the version of Synaptic in Ubuntu 8.04 looks slightly different, but is largely
    identical.)


    +   1. Toolbar: Here you can quickly access key functions of Synaptic. Perhaps
    the most useful buttons are RELOAD, that forces the computer to grab the latest
    list of packages in the repositories, and APPLY, that must be clicked to start
    installation/removal of software after selections have been made in the main package
    list.'
  - '[PAGE 119]


    TIP Some of the repositories are frequently updated, so you should always grab
    the latest lists from the repositories before installing new software. To this
    end, clicking the RELOAD button should be one of the first things you do each
    time upon starting Synaptic.


    +   2. Filter list: This is where the filter selection appears (see the Filters
    heading directly below). Clicking each entry in this list refines the main list
    of packages.


    +   3. Filters: The buttons in the filter selection area let you select between
    collections of filters that are displayed in the filter list area above. The nature
    of each filter selection is marked on each button, and is described below:


    SECTIONS: This is the default view. Repositories are typically split into sections
    for easy browsing, and selecting the Sections filter list allows you to refine
    the main package list according to these sections. A description of the sections
    can be found at http://packages.ubuntu.com/intrepid/.


    STATUS: Here you can choose to filter the package list by those that are installed.
    Additionally, the "Not Installed (residual config)" option lets you filter by
    software that has been removed but whose configuration files are still present
    on the system.


    ORIGIN: This option lets you can filter the list of packages by individual repository.
    See Table 6-1 for a list of the default repositories.


    CUSTOM FILTERS: By clicking Settings ⇨ Filters you can create you own filters,
    typically to help repair problems within the software administration subsystems.
    Clicking the CUSTOM FILTERS button shows these filters, which include a list of
    readymade problem-solving filters.


    SEARCH RESULTS: This option is automatically selected whenever you search for
    a package.


    +   4. Search: Ubuntu 8.10 offers various methods of searching for packages, and
    two are found here on the toolbar (Synaptic as supplied with Ubuntu 8.04 only
    shows the single SEARCH button). By typing into the Quick Search field, you can
    quickly search package names and descriptions. Alternatively, you can click the
    SEARCH button and perform a more thorough search.'
