    \ 界面中点击 PROPERTIES 按钮。然后点击并拖动 Recording Speed 滑块向左，使其处于可能的最低速度。选择慢速是必要的，因为如果使用高速写入，刻录\
    \ ISO 映像到 CD 将会失败。\n- \n- 5. 点击 OK 关闭对话框，并点击 NEXT 按钮实际刻录光盘。\n\n光盘在刻录完成后会被弹出。再次插入光盘并跳到下面相关的小标题，该小标题描述了你希望使用的安装方法。\n\
    \n## Step-by-step: Installing Ubuntu\n\n下面详细介绍了三种安装 Ubuntu 的方法。\n\n## Standard\
    \ (repartitioning)\n\n这种安装 Ubuntu 的方法涉及使用 Ubuntu CD 启动计算机，并在安装过程中缩小 Windows 分区以腾出空间给\
    \ Ubuntu。\n\n> **NOTE**  在技术层面，发生的情况是 Windows 分区被缩小，并为 Ubuntu 创建了一个扩展分区。随后在扩展分区内部创建了两个新分区：*root*，将包含\
    \ Ubuntu 安装，以及 *swap*。后者类似于 Windows 的分页文件，只是它位于自己的分区中。一些 Linux 发行版为操作系统文件和用户数据创建单独的分区，但\
