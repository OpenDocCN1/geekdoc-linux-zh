    # #2: Installing within Windows


    Wubi is Windows software that installs Ubuntu within a series of virtual hard
    disk files contained in the Windows filesystem. It then configures a boot-time
    menu so you can choose between booting into Ubuntu or Windows. If you choose to
    boot into Ubuntu, a clever trick makes the virtual hard disk files appear to be
    real disks. As a result, the user will be entirely unaware they''re not using
    a traditional partition-based installation, as described previously.


    Using Wubi to install Ubuntu is just like installing some Windows software, and
    is equally risk-free. There''s even an uninstall option added to Add/Remove Programs.
    The only drawback is a slight reduction in performance compared to a traditional
    installation, and you''ll also find the Ubuntu suspend-to-disk (hibernate) power-saving
    mode doesn''t work.


    > TIP You can still use the "sleep" power saving mode that suspends power to most
    of the computer''s components except RAM.


    # #3: Virtual computer


    By downloading a virtual computer application, such as the free-of-charge VMware
    Player (www.vmware.com/products/player), you can install Ubuntu so it runs within
    a program window on the Windows desktop.


    A virtual computer is effectively a complete computer recreated in software. It
    offers an excellent way to trial Ubuntu, although the limitations of the virtual
    computer software mean you won''t experience Ubuntu to its full advantage (desktop
    visual effects won''t work, for example). Additionally, you''ll need a powerful
    PC with over 1GB of memory for optimal results.


