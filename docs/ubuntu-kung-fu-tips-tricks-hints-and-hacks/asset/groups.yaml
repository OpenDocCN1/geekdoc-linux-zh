    ## CHAPTER TWO

    ## Configuring Ubuntu


    In this chapter, you''ll learn how to configure your new Ubuntu system. Every
    major area of hardware is tackled, including:


    - Keyboard and mouse;

    - Graphics and display(s);

    - Sound;

    - Networking (including wireless);

    - Printing;

    - Digital cameras/MP3 players/USB memory sticks;

    - Flatbed scanners;

    - Bluetooth devices.


    ### Getting started


    Put simply, Ubuntu just works. Unlike with Windows, you don''t have to fiddle
    around with driver CDs after installation—support for all types of hardware is
    built into the central kernel program.


    > NOTE The kernel is frequently updated, and each update brings better and better
    hardware support. This is one reason why you should keep your system updated.
    I explain how in Chapter 7.


    However, you will still have to configure the system to your requirements—configuring
    Ubuntu to access your wireless network, for example, or setting-up the printer
    for optimal output.


    ### Keyboard and mouse/trackpad


    Entries for configuring the keyboard and mouse (or laptop trackpad) can be found
    on the System → Preferences menu—click the Keyboard entry and not the Keyboard
    Shortcuts entry to configure the keyboard.


    The options presented shouldn’t present any challenges to anybody who has configured
    a mouse or keyboard under Windows.


    ### Switching keyboard languages


    It’s possible to switch between two or more keyboard layouts on the fly. This
    can be useful if you find yourself regularly typing in different languages. To
    configure this feature, follow these steps:


    - 1. Open the Keyboard Preferences dialog (System → Preferences → Keyboard), and,
    ensuring the Layouts tab is selected, click the large plus button (click the +ADD
    button if using Ubuntu 8.04).

    - 2. Select the keyboard layout from the Country/Variants dropdown lists. When
    you’ve made a selection, click the +ADD button.

    - 3. In the parent dialog box, and in the list under the Selected Layouts heading,
    click the radio button alongside the entry you’d like to be default. This will
    be the layout activated when Ubuntu boots. When done, click the CLOSE button.

    - 4. Right-click the bar running across the top of the screen, and select Add
    to Panel in the menu that appears. In the dialog that appears, click and drag
    the Keyboard Indicator entry to a panel. Then click CLOSE.


    From now on you can switch between layouts by clicking the applet—clicking will
    cycle through the choices of keyboard layout you selected in the Keyboard Preferences
    dialog.


    ### Mouse


    If the pointer seems to move too quickly for you, open the Mouse Preferences dialog
    box (System → Preferences → Mouse), and click and drag the Acceleration slider
    a little to the left. Changes take effect immediately, so test the mouse movement
    and adjust again if necessary until you’re entirely happy with the settings.


    To deactivate touchpad tap-to-click, so that only clicking a touchpad’s mouse
    button performs a left click, select the Touchpad tab and remove the check from
    the relevant box.


    ### Graphics


    In nearly all cases Ubuntu’s graphical subsystem will work fine straight away.
    However, there are a handful of common but easily fixed issues.


    ### Changing screen resolution


    Ubuntu might guess the wrong screen resolution after installation. You’ll know
    if this is the case because everything will appear blocky and/or blurred. To adjust
    the resolution, click the System menu at the top of the screen, and then Preferences
    ➜ Screen Resolution.


    > **NOTE** You may have to adjust the Refresh Rate dropdown if you’re using a
    CRT monitor (i.e. a glass tube display, rather than a TFT LCD panel). The standard
    refresh rate most find comfortable is 75Hz. Flat panels should be set to 60Hz.


    If the screen resolution you want isn’t available in the Resolution drop-down
    list, or just doesn’t work as expected, you might have to activate the proprietary
    graphics card drivers, as described below.


    ### Installing proprietary drivers


    Installing proprietary graphics card drivers means Ubuntu will no longer use the
    Free Software versions. It should only be done if absolutely necessary (for example,
    if the built-in drivers don’t produce optimal results) because proprietary drivers
    are not updated as frequently as the Free Software versions and, some suggest,
    can be very buggy.


    To install proprietary drivers, first ensure you’re online—see the *Getting Online*
    section later. This is necessary because the new drivers will be downloaded. Then
    click System ➜ Administration ➜ Hardware Drivers.


    If you’re using Ubuntu 8.10, select the entry in the list for your graphics driver
    and click the ACTIVATE button (see Figure 2-1 for an example).


    > **TIP** If several drivers are offered, select the one that’s marked “Recommended”.
    If this proves less than optimal, repeat this step and choose a different version.


    If you’re using Ubuntu 8.04, simply put a check in the Enabled column alongside
    the entry for your graphics card.


    With either version of Ubuntu, the new graphics driver will be downloaded once
    you’ve made the selection. You may have to reboot the computer once it’s finished
    installing—just follow the on-screen prompts.

