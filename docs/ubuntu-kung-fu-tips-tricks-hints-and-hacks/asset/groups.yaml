    - *文件系统：* 这里提供直接链接到主文件系统的根目录（/；相当于 Windows 下的 C:\）。

    - *网络：* 在这里你可以浏览网络上其他计算机上的资源，例如 Microsoft Windows 计算机上的共享文件夹。相当于“网络邻居”。

    - *13.8GB 媒体：* 这是 Windows 文件系统的快捷方式。此图标的名称基于 Windows 分区的大小；例如，如果 Windows 分区大小为
