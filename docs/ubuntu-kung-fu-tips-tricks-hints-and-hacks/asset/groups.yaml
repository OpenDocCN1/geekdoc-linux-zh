    \ was created for you. As part of this process, a folder named after your username\
    \ was created in `/home`, as mentioned previously.\n\n## Root user\n\nIn fact,\
    \ on most Linux systems two login accounts are created during installation—a standard\
    \ user, and the root user. The root user is a special user account gifted with\
    \ the ability to do anything, such as delete system files, or install software.\
    \ Its username is always root.\n\nNormally when Linux is used on a PC, a standard\
    \ user logs into the root account whenever she has to administer the system, and\
    \ then logs out when she’s finished. However, she will spend most of her time\
    \ logged into her ordinary user account, doing day-to-day stuff like browsing\
    \ the web.\n\nUbuntu differs slightly from most Linuxes. Although the root account\
    \ is there in the background, the user is discouraged from directly logging in\
    \ as root. Instead, the user “borrows” root powers to administer the system when\
    \ necessary. Usually, this is done by simply entering your login password when\
    \ prompted. See Figure 4-2 for an example that appears when attempting to run\
    \ Synaptic, a program that administers software. Synaptic lives on the System\
    \ ➞ Administration menu, and, in fact, if you run any program on this menu a password\
    \ prompt dialog box will pop-up. You won’t be able to get any further until the\
    \ password is typed but, after this, the application will run with root powers.\n\
    \nAlternatively, some applications will start, but will have restricted functionality\
    \ until the UNLOCK button is clicked, at which point the same password request\
    \ will appear. With these applications, typing your password doesn’t give the\
    \ entire application root powers, but a component of it. This is more secure and,\
    \ eventually, all of Ubuntu’s administrative applications will work this way.\n\
    \n> **NOTE**  \n> When working at the command-line, any command needing administrative\
    \ powers must be preceded by `sudo` (eg. `sudo sh` should be used for GUI apps).\
    \ I explain more about this in Chapter 5.\n\n## File permissions\n\nAlthough the\
    \ root user account has a back seat in Ubuntu, its influence is felt everywhere.\
    \ Most operating system files are “owned” by the root user, and have permissions\
    \ so that only root can edit them. In other words, only the root user—or a user\
    \ borrowing root powers—can\n\n![](img/48d064407ff591f0b5365c2d2919ee6e_72_0.png)\n\
    \nFigure 4-2. Typing a password to borrow root powers and administer the system.\n\
    \ndelete or modify vital files. In some cases, even viewing operating system files\
    \ by ordinary users is prohibited.\n\nThis simple mechanism of protecting operating\
    \ system files through root user ownership is how Linux enforces security and\
    \ system protection. It's simple but highly effective, and has stood the test\
    \ of time for many years.\n\n> NOTE The fact that Windows fails to make this distinction,\
    \ and effectively merges the standard and administrator types of user account,\
    \ is one reason it's so insecure. If a virus infects the system, it operates with\
    \ administrator powers, so it is really cause trouble. Vista fixes this situation\
    \ somewhat by pestering the user every time they do something even remotely dangerous\
    \ to the system.\n\nFile permissions lie at the heart of understanding and working\
    \ with the Linux filesystem, so let's take a look at them in more depth.\n\nAs\
    \ mentioned previously, every file is owned by a particular user—even system files,\
    \ which are owned by the root user.\n\nThe owner of a file can set three separate\
    \ sets of permissions: firstly for himself, secondly for the group, and lastly\
    \ for all others.\n\nIn setting file permissions for himself, the file's owner\
    \ could mark a file as read-only, for example, to avoid accidentally changing\
    \ it.\n\nAll users are members of a group, and each file is assigned to a particular\
    \ group, in addition to being owned by a user. So, a separate set of file permissions\
    \ can be granted for members of that group.\n\nA third and final set of permissions\
    \ can be configured for others, which is to say, users on the computer who aren't\
    \ the file's owner, and who aren't in the group.\n"
  mdcn: "\n\n## 理解用户\n\n当你安装 Ubuntu 时，会为你创建一个个人用户账户。作为此过程的一部分，如前所述，在 `/home` 中创建了一个以你的用户名命名的文件夹。\n\
    \n## root 用户\n\n事实上，在大多数 Linux 系统的安装过程中会创建两个登录账户——一个标准用户和 root 用户。root 用户是一个特殊的用户账户，拥有做任何事情的能力，例如删除系统文件或安装软件。它的用户名始终是\
    \ root。\n\n通常当 Linux 在 PC 上使用时，标准用户在需要管理系统时会登录到 root 账户，然后在完成后注销。但是，她大部分时间都会登录到自己的普通用户账户，进行日常操作，如浏览网页。\n\
    \nUbuntu 与大多数 Linux 略有不同。虽然 root 账户在后台存在，但用户被劝阻直接以 root 身份登录。相反，用户在必要时“借用” root\
    \ 权限来管理系统。通常，这只需在提示时输入你的登录密码即可。尝试运行 Synaptic 时会出现 Figure 4-2 所示的示例，Synaptic 是一个管理软件的程序。Synaptic\
    \ 位于 System ➞ Administration 菜单上，事实上，如果你运行此菜单上的任何程序，都会弹出密码提示对话框。在输入密码之前你无法继续，但之后应用程序将以\
