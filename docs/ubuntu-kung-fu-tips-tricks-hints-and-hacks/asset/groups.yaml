  - '[PAGE 117]


    # Table 6-1. Default Ubuntu software repositories.


    | Repository | Details |

    |---|---|

    | Main | The Main repository is where core packages can be found. Essentially,
    this is the minimum repository needed to install Ubuntu from scratch, although
    several additional packages can also be found in Main that are non-essential to
    a fundamental setup. Software in Main is officially supported by Canonical, the
    sponsor of Ubuntu, so is guaranteed to be updated for the life of the particular
    release of Ubuntu. |

    | Universe | Known as the "Community maintained" repository, this could also be
    referred to as "the rest", because it contains the majority of Free Software generated
    by the Linux community that isn''t included in Main. Each package is maintained
    by members of the Ubuntu or Debian communities. The software in Universe isn''t
    officially supported, so updates aren''t guaranteed. |

    | Restricted | Also known as "Proprietary drivers", this repository includes a
    small amount of non-open source software needed to make certain PC hardware work
    (mainly wireless and graphics devices). Software in this repository is regularly
    updated. |

    | Multiverse | Known as "Software restricted by copyright or legal issues", this
    repository is effectively "the rest of the rest". Software found in Multiverse
    is incompatible with either the word or spirit of the Free Software license agreement
    used by Ubuntu. This doesn''t necessarily mean software in Multiverse is proprietary,
    however. Multiverse software isn''t officially supported and might not be updated.
    |

    | Updates | Two update repositories are provided by which software fixes are made
    available; the "security" repository provides essential security updates, while
    the "updates" repository provides recommended updates. |


    If software needs additional packages to be installed, it is said to depend on
    the other packages. If the dependency packages aren''t installed, the software
    just won''t work. In fact, you won''t even be allowed to install the software.


    APT''s job is to take care of dependencies, and it does so automatically and largely
    invisibly. It is aware of what a particular package requires and will automatically
    add any necessary packages to the tally for download and installation from the
    repositories.'
