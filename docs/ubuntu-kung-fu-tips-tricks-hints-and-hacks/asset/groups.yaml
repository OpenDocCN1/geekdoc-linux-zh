    Ubuntu。但是，当分区阶段开始时，不要调整大小。相反，选择 Guided-Use the Largest Continuous Free Space。


    > 注意 Ubuntu 8.10 存在一个错误，即选择 Guided-Use the Largest Continuous Free Space 选项时，“之后”图形预览中显示
    Ubuntu 占据整个磁盘。这是错误的，可以忽略。


    - 5. 按照安装阶段继续，就像在标准 PC 上安装一样。重新启动时，在 rEFIt 启动菜单中选择 Linux 企鹅以启动 Ubuntu，或选择 Apple
    图标以启动 OS X（使用光标键突出显示其中一个，然后按 Enter 选择）。


    > 注意 在我安装后第一次启动时，我发现 rEFIt 菜单不可见。再次重新启动后，它出现了。


    旧款 PowerPC Mac 计算机的用户可以下载并安装社区支持的 Ubuntu PowerPC 版本，尽管安装更复杂，因为你必须手动重新分区。请参阅 https://wiki.ubuntu.com/PowerPC。


