    ## 配置防火墙


    Ubuntu 包含一个非常强大的防火墙 netfilter，它是内核核心程序的一部分。然而，它默认处于非激活状态，必须手动配置。其原因在于 Ubuntu 没有面向外部的服务。如果你把
    Ubuntu 想象成一栋房子，可以说它没有窗户或门供入侵者进入。所有传入的连接都会撞上一堵砖墙。


    然而，尽管有这种基本保护，黑客们也很狡猾，不能有丝毫懈怠。使用 Firestarter 等 GUI 应用程序配置防火墙，如下所述，操作非常简单，几乎没有不这样做的理由。


    > TIP 可以使用 ufw 命令在命令行配置防火墙。这相对简单易用，但仍然不如 Firestarter 等 GUI 应用程序直观。更多详情请参阅 http://ubuntuforums.org/showthread.php?t=823741。


    ## 安装和配置 Firestarter


    Firestarter 是一个简单但功能非常强大的防火墙配置工具。要安装它，请启动 Synaptic 并搜索 firestarter。在结果列表中 firestarter
    条目旁边的框中打勾，然后从出现的菜单中选择 Mark for Installation。点击工具栏上的 APPLY 按钮，并在出现的对话框中点击 APPLY
    按钮。


    无需重启，因为 Ubuntu 的防火墙组件可以在系统运行时启动、停止和重新配置。然而，有必要完成一个初始向导来配置 Firestarter 本身，因此通过点击
    System ⇨ Administration ⇨ Firestarter 启动程序以完成此操作。


    > NOTE 请记住，没有必要让 Firestarter 配置程序一直运行才能享受 Ubuntu 防火墙的保护。Firestarter 所做的只是配置 Ubuntu
