    文件和文件夹名称可以包含空格，就像 Windows 一样，但在 Linux 中大小写字母很重要。一个文件夹完全可以包含名为 `Report.doc`、`REPORT.doc`、`report.doc`、`REPORT.doc`
    等等的文件。


