  - '[PAGE 123]


    After confirming what it''s about to do via the Summary dialog box (just like
    when installing/removing software), Synaptic will run through the procedures of
    installing the software, such as unpacking the package and configuring the software,
    but without actually downloading it afresh unless the package file isn''t stored
    in the package cache, in which case it will have to be downloaded from the repositories.


    # Manually installing a package


    It is inadvisable you attempt to manually download a package and install it. The
    process is fraught with problems, the most significant being the potential difficulty
    of manually sourcing dependencies.


    > NOTE Because of dependency issues, if you intend to install software found on
    a developer''s website, you''ll probably find that the developer has her own package
    repository that you can subscribe to. This will let you use Synaptic to install
    the program, thus taking care of dependencies automatically. Adding a new repository
    is described in the Working with Repositories section below.


    However, there are a handful of situations where installing a package "by hand"
    might be required.


    The GDebi Package Installer program automatically associates with package files
    (they have a .deb extension), in the same way that OpenOffice.org''s Writer associates
    with Microsoft Word .doc files. Therefore, manually installing a package is simply
    a matter of downloading the package file and double-clicking it, or more simply,
    selecting the Open with GDebi Package Installer option in the web browser''s download
    dialog box.


    GDebi attempts to mitigate any dependency issues by downloading the necessary
    dependency packages from the main repositories. However, you shouldn''t assume
    the dependency packages will always be available, particularly if you are installing
    a package that isn''t built specifically for the release of Ubuntu you''re using.


    Once the GDebi program window appears, click the INSTALL PACKAGES button. Following
    this, any dependencies will be downloaded (if possible) and the software installed.


    If any required dependencies can''t be found in the repositories, the INSTALL
    PACKAGE button will be grayed out, and a warning will appear telling you the names
    of the missing dependencies. You will have to manually source and install the
    dependency packages before continuing.'
