    ## 将 Ubuntu 安装到 Apple Mac 上


    你可以使用 Ubuntu 的安装光盘在采用 Intel CPU 的 Mac 上安装 Ubuntu。这将让你双启动 Mac OS X 和 Ubuntu。但是，你首先需要使用
    OS X 的 Boot Camp 功能来创建空间。


    以下为说明。这些步骤假设 Mac 上未与 OS X 一同安装 Windows——如果存在这种情况会引入复杂性；请参阅 https://help.ubuntu.com/community/MacBook。


    - 1. 启动 Boot Camp Assistant 并按照向导操作，就像要创建 Windows 安装一样。Boot Camp Assistant 可以通过打开
    Finder 并点击 Applications，然后选择 Utilities 文件夹来找到。你选择的 Windows 分区大小将等同于 Ubuntu 分区大小，因此请确保释放超过
