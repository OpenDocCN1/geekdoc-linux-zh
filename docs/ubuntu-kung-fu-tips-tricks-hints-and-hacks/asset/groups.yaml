    Kubuntu：这是一个使用 KDE 桌面环境（www.kde.org）而不是 Gnome 的 Ubuntu 版本。KDE 在很大程度上与 Gnome 相似，但往往提供更多配置选项。可以说
    Kubuntu 在高级用户中很受欢迎。Kubuntu 与 Ubuntu 的不同之处在于它使用 Konqueror 进行网页浏览，使用 Kontact 进行邮件/PIM（尽管可以安装
    Firefox 和其他 Ubuntu 标准程序）。在系统配置工具方面还有一些其他关键差异，但底层系统仍然是 100% 的 Ubuntu。


    > NOTE. Kubuntu 在 8.04 之前的版本使用的是较旧的 KDE v2 系列。8.04 同时发布了 v3 和更新的实验性 v4 系列，但从 8.10
