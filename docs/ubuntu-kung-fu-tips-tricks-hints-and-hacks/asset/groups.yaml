    详细信息，以及防止恶意软件网站的保护，在这些网站上病毒或其他危险文件会被秘密提供。请参阅图 7-2，了解如果你成为网络钓鱼攻击的受害者会看到什么示例（请注意，这是在
    www.mozilla.com 网站上的 staged 演示，并非实际攻击；www.mozilla.com 是安全的，可以访问）。


    无需配置即可使用这些功能，因为它们默认已启用。但是，除此之外，你可能还选择激活主密码功能，并安装附加软件以阻止基于脚本的攻击，如下一节所述。


    > TIP 以下讨论的任何功能都不是 Ubuntu 独有的。提供的说明同样适用于 Windows 或 Mac OS X 上的 Firefox 安装。


    ## 启用主密码


    与许多浏览器一样，Firefox 3 可以记住各种网站的登录用户名和密码，因此你不必每次访问时都输入它们。然而，任何有权访问你计算机的人因此都能够使用你的详细信息访问这些网站，如果你将计算机无人看管。


    设置主密码允许你锁定和解锁存储用户名和密码的密码文件。每当你启动 Firefox 并访问需要密码的网站时，你将被邀请输入


    主密码。只有在完成此操作后，网站的用户名/密码字段才会被填入。当退出 Firefox 时，密码存储将被锁定。每次使用 Firefox 时只需解锁密码文件一次即可。


    TIP 因为你每次使用 Firefox 时只需解锁密码文件一次一次，因此养成在完成使用后退出 Firefox 的习惯，而不是让它在后台保持打开状态是有意义的。


    要启用主密码，在 Firefox 程序窗口中单击“编辑 ⇔ 首选项”，单击出现的对话框顶部的安全标题，并在“使用主密码”旁放置复选标记。然后按提示输入新密码。完成后，退出并重新启动
    Firefox。更改会立即生效——当你访问 Firefox 已知的需要用户名/密码的网站时，你将被提示输入主密码。


    ## 避免“可执行内容”攻击


    许多网站使用 JavaScript、Java 和/或 Flash 来提供有用的功能。此类网站功能被称为可执行内容。


    不幸的是，在少数情况下，可执行内容可用于攻击你的计算机并窃取数据。正因如此，许多注重安全的 Ubuntu 用户选择安装 NoScript，这是一个 Firefox
    附加程序，让你能够按站点授权或限制 JavaScript、Java、Flash 和其他技术。


    ## 安装 NoScript


    要安装 NoScript，启动 Firefox 并单击“工具 ⇔ 附加组件”。确保在出现的对话框中选择了“获取附加组件”图标，并在“搜索所有附加组件”文本字段中输入
    noscript。在结果列表中，单击 NoScript 条目旁边的“添加到 Firefox”按钮。在出现的对话框中，单击“立即安装”按钮，并在安装完成后单击“重新启动
    Firefox”。


    ## 阻止/允许可执行内容


    当 Firefox 重新启动时，你会注意到程序窗口右下角出现了一个新的“S”图标。单击它可以让你为正在浏览的站点启用或拒绝可执行内容。默认策略是 NoScript
    将停用所有内容，包括 Java、JavaScript、Adobe Flash 和 Microsoft SilverLight 组件。然而，一些站点在中心


