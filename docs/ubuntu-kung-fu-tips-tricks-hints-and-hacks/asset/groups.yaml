    and can be useful for diagnosing hardware faults.


    TIP For more information on this program, see www.memtest.org.


    Windows occupies the bottom position in the list and you can move the selection
    highlight between options using the up/down cursor keys. Hit Enter to confirm
    your choice and start the boot procedure.


    > NOTE If you wiped Windows during installation, the boot menu won’t appear unless
    you hit a key during the on-screen countdown.


    If you didn’t select the automatic login option during installation, the next
    thing you will see, after Ubuntu has finished the first stage of booting, is the
    login screen. See Figure 3-1 for an example.


    Simply type your username, hit Enter, and type your password. Assuming both details
    are correct, booting will finish, and the desktop will appear.


    TIP If you want Ubuntu to login automatically on future boot-ups, as with some
    versions of Windows, click System → Administration → Login Window. Type your login
    password when prompted. In the dialog box that appears, click the Security tab.
    Put a check in the Enable Automatic Login box, and select your username from the
