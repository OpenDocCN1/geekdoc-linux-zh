    +   - Create, modify or delete files in the folder;

    +   - Switch into the folder by double-clicking its icon using Nautilus, or using
    the cd command.


    If a user attempts any of these actions, and the execute permission isn''t set,
    she will see a "Permission Denied" error message.


    As with files, execute permissions can be set for the folder owner, the group
    it''s assigned to, and others.


    # Read/write permissions


    Although the execute permission controls access to the folder, permissions for
    reading and writing can be set separately. However, neither has any relevance
    unless the execute permission is also set.


    **Read permission:** By setting the read permission of a folder, it''s possible
    to control who can view a listing of the files/folders there. If a user tries
    to view a file listing, and the read permission isn''t set, he''ll see a "Permission
    denied" error.


    **Write permission:** By setting the write permission, it''s possible to control
    who can create, delete or rename files/folders within a folder. If the folder''s
    write permission isn''t set, and a user attempts to create, delete or rename a
    file/folder, he''ll see an error.


    As with files, separate read and write permissions can be set for the owner of
    the folder, the group it''s assigned to, and others.


    # Folder permissions in more depth


    It isn''t entirely true to say that users won''t be able to view the listing of
    a folder unless the execute permission is set. If the read permission for a folder
    is set, but not the execute permission, users will be able to view a short file
    listing using the ls command but the long listing command option (i.e. ls -l myfolder)
    won''t work. Why this happens is to do with the way Linux works on a technical
    level.


    > NOTE In a Nautilus file-browsing window, if the read permission is set, but
    not the execute permission, the user will be able to access the folder but it
    will appear to be empty.


    If all of this is giving you a migraine, don''t worry. For most users, folder
    permissions boil down to the following day-to-day rules:'
  - '[PAGE 98]


    Read only: To limit a user to viewing a listing of files in a folder, ensure the
    read and execute permissions are set, but not the write permission;


    Write permission: To let a user create or delete files in a folder, ensure the
    read, write and execute permissions are set (note: it''s possible for a folder
    to be set to "write-only" if the read permission isn''t also set—users will be
    able to save files there, but not view a file listing);


    Deny access: To deny complete access to a folder for a user, unset all permissions—read,
    write, and execute.


    Any other combination of folder permissions can lead to confusion.


    # What permissions look like


    Within a command-line file listing, permissions are indicated by r, for read,
    w, for write, and x, for execute. For all files and folders, the permissions are
    listed in a line: owner first, followed by group, and then others. See Figure
    5-1 for an annotated example.


