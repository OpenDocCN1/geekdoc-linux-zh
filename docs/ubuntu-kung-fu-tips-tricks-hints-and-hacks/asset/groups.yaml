    are in place, but any vital system tweaks necessary for the program to work correctly
    haven''t been carried out.


    A package installed without dependencies is known as a broken package. Installing
    a broken package will leave the package management system in a damaged state;
    apt-get will refuse to work until the dependencies are met or the errant package
    is uninstalled, while Synaptic will automatically insist on removing the package
    before allowing any further package installation.


