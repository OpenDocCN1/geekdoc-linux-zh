    ## 97: Give an example of an iptables command that will block incoming TCP traffic
    on port 25, on all network interfaces. This rule should be the last rule in the
    list, and it should drop the SYN packet that it receives from an external host.


    **Answer:**

    ```bash

    /sbin/iptables -A INPUT -p tcp -dport 25 -j DROP

    ```


    ## 98: Give an example of an iptables command that will block incoming TCP traffic
    on port 25, when the source address is 209.181.6.8. This rule should be the last
    rule in the list.


    **Answer:**

    `/sbin/iptables -A INPUT -p tcp --dport 25 -s 209.181.6.8 -j DROP`


    ## 99: Give an example of an iptables command to block all ICMP traffic, on interface
    eth0. This rule should be the first rule on the list.


    **Answer:**

    `/sbin/iptables -I INPUT -p icmp -i eth0 -j DROP`


    ## 100: Give an example of an iptables command that will redirect all traffic
    on TCP port 25 (eth0) to another host, 192.168.0.5. This rule should be the first
    rule in the chain.


    **Answer:**

    `/sbin/iptables -I INPUT -p tcp --dport 25 -i eth0 -j DNAT --to 192.168.0.5`


    ## 101: Give an example of an iptables command that will redirect all traffic
    on TCP port 8080 (eth0) to the host 192.168.0.5, port 80. This rule should be
    the last rule in the chain.


    **Answer:**

    ```

    /sbin/iptables -A INPUT -p tcp -dport 8080 -i eth0 -j DNAT --to 192.168.0.5:80

    ```


