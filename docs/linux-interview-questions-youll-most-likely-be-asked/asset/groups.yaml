    \ 声明有什么问题：**\n\n```text\n<VirtualHost 192.168.0.1:80>\n    ServerName example.com\n\
    \    DocumentRoot /var/www/html/example.com\n    CustomLog /var/www/logs/example.com_access.log\n\
    \        combined\n    ErrorDocument 404 /error.php\n    ErrorDocument 403 /error.php\n\
    </VirtualHost>\n```\n\n- a) 缺少 ServerAlias 指令\n- b) 缺少 Directory 指令\n- c) VirtualHost\
    \ 指令设置不正确\n- d) 以上都不是\n\n**答案：** b) 缺少 Directory 指令\n\n**128: 在主 Apache 配置中启用外部模块\
    \ mod_rewrite 的正确语法是什么？**\n\n**答案：**\n\n`LoadModule rewrite_module modules/mod_rewrite.so`\n\
    \n**129: Apache 中 \"StartServers\" 的默认值是什么？**\n\n**答案：** 5\n\n# **130: 在修改 PHP\
    \ 配置后，必须重启以下哪项服务？**\n\n- a) Apache\n- b) PHP\n- c) MySQL\n- d) PostgreSQL\n\n\
    **答案：** a) Apache\n\n**131: 启动 MySQL 进入“安全模式”以重置 MySQL root 密码的命令是什么？**\n\n**答案：**\n\
    \n`mysqld_safe --skip-grant-tables`\n\n**132: 为 PHP 提供 MySQL 支持的 CentOS 软件包名称是什么？**\n\
    \n**答案：** php-mysql\n\n# 133: 创建名为 'test' 的新数据库的 MySQL 命令是什么？\n\n**答案：**\n\n```sql\n\
    CREATE DATABASE test;\n```\n\n# 134: 创建名为 'test'（密码为 'password'）的新用户，并赋予 'test'\
