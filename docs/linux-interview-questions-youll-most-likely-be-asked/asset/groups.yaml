    \ ON test.* TO 'test'@'localhost' IDENTIFIED BY 'password';\n```\n\n# 135: 如果\
    \ Apache 允许 Web 浏览器下载 PHP 文件，而不是正确执行它们，Apache 配置中缺少什么指令？\n\n**答案：**\n\nAddHandler\n\
    \n**136: 在创建新用户或修改访问控制后，你应该输入什么 MySQL 命令？**\n\n**答案：**\n\n`FLUSH PRIVILEGES;`\n\
    \n**137: 在 CentOS/RHEL 中，Apache 的默认错误日志位于哪里？**\n\n**答案：**\n\n/var/log/httpd/error_log\n\
    \n**138: 在为新 Web 应用程序创建新数据库时，除了新的 MySQL 数据库，还应该创建什么？**\n\n**答案：**\n\n作为一种最佳实践，一个新的\
    \ MySQL 用户，该用户拥有对新数据库的完全访问权限（且仅限于新数据库）。\n\n# Samba\n\n**139: Samba 配置文件通常在哪里找到？**\n\
    \n**答案：**\n\n/etc/samba/smb.conf\n\n**140: Samba 可用的两种安全身份验证类型是什么？**\n\n**答案：**\n\
    \nsecurity, user\n\n**141: 如果共享具有“create mask”为“700”，这意味着什么？**\n\n**答案：**\n\n\
    所有创建的文件都将执行“chmod 700”，这意味着该用户将对文件拥有完整的读、写和执行权限，而其他任何人都无法访问该文件。\n\n**142: 假设用户\
    \ 'tom' 已经作为用户添加到服务器本身，你应使用什么命令为用户 'tom' 创建 Samba 账户？**\n\n**答案：**\n\n`smbpasswd\
    \ -a tom`\n\n**143: 如果用户在尝试浏览服务器共享时遇到登录屏幕，你首先应该做什么（假设该用户 Windows 计算机上的用户名和密码与他们试图在\
    \ Samba 服务器上使用的账户匹配）？**\n\n**答案：**\n\n重置该用户的 Samba 密码，并验证用户账户是否已创建（在本地服务器的 /etc/passwd\
    \ 中）。\n\n**144: 以下选项在 Samba 服务器上有什么作用：\"SO_RCVBUF=8192 SO_SNDBUF=8192 socket options\
    \ = TCP_NODELAY\"？**\n\n**答案：**\n\n通过设置发送和接收缓冲区大小来提高 Samba 性能。\n\n145: 判断对错：默认情况下，本地\
    \ CUPS 服务器上的所有打印机都通过 Samba 共享。\n\n**答案：** 正确\n\n146: 判断对错：Samba 权限覆盖任何文件系统权限。\n\
    \n**答案：** 错误。文件系统权限将覆盖任何 Samba 权限。\n\n147: 为存储在 Samba 服务器上的文件或目录设置高级 ACL 的最佳方法是什么？\n\
    \n**答案：** 使用 Windows 计算机。Samba 目前没有为文件和目录设置高级 ACL 的方法。\n\n148: 判断对错：默认情况下，Samba\
    \ 将配置为充当域“master”或域服务器。\n\n**答案：** 正确。Samba 默认允许用户登录服务器，并充当域“master”或域服务器。\n\n\
    **149: 由大多数默认安装创建的哪个共享定义通常设置为 \"read only = yes\"、\"browsable = no\" 和 \"guest\
    \ ok = no\"？**\n\n**答案：**\n\n[homes]\n\n**150: 'valid users = @reception' 是什么意思？**\n\
    \n**答案：**\n\n表示组 'reception' 中的所有用户都被允许访问该共享。\n\n# 服务器性能\n\n# 151: 什么命令允许你微调 Linux\
    \ 服务器上的硬盘性能？\n\n**答案：**\n\nhdparm\n\n# 152: 根据上述问题，允许你对硬盘驱动器 /dev/sda 进行基准测试的确切命令是什么？\n\
    \n**答案：**\n\n`hdparm -T /dev/sda`\n\n# 153: 什么命令允许你查看已用、空闲和缓存的 RAM 数量？\n\n**答案：**\n\
    \n`free`\n\n# 154: 什么命令允许你查看所有挂载驱动器上可用和已用的磁盘空间量？\n\n**答案：**\n\n`df`\n\n**155:\
    \ 上述命令的哪个选项将以易于阅读的格式输出值？**\n\n**答案：**\n\n`df -h`\n\n**156: 包含处理器信息（包括 CPU 频率、支持的标志、CPU\
    \ 缓存大小以及已安装处理器数量）的文件是什么？**\n\n**答案：**\n\n/proc/cpuinfo\n\n**157: 什么命令将停止所有正在运行的具有给定名称的进程？**\n\
    \n**答案：**\n\n`killall`\n\n**158: 如果你知道...，什么命令将停止正在运行的进程**\n\n"
