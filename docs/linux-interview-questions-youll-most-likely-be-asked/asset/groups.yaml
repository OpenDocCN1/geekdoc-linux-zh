    mission in relation to current industry trends, and engage the interviewer in
    interesting, relevant conversation. Additionally, clear up anything else you need
    to know about the specific position before leaving – so that if the interviewer
    calls with an offer, you’ll be prepared to answer.


    ### 9: Are you the best candidate for this position?


    **Answer:**


    Yes! Offer specific details about what makes you qualified for this position,
    and be sure to discuss (and show) your unbridled passion and enthusiasm for the
    new opportunity, the job, and the company.


    ### 10: How did you prepare for this interview?


    **Answer:**


    The key part of this question is to make sure that you have prepared! Be sure
    that you’ve researched the company, their objectives, and their services prior
    to the interview, and know as much about the specific position as you possibly
    can. It’s also helpful to learn about the company''s history and key players in
    the current organization.


    ### 11: If you were hired here, what would you do on your first day?


    **Answer:**


    While many people will answer this question in a boring fashion, going through
    the standard first day procedures, this question is actually a great chance for
    you to show the interviewer why you will make a great hire. In addition to things
    like going through training or orientation, emphasize how much you would enjoy
    meeting your supervisors and coworkers, or how you would spend a lot of the day
    asking questions and taking in all of your new surroundings.


    ### 12: Have you viewed our company''s website?


    **Answer:**


    Clearly, you should have viewed the company''s website and done some preliminary
    research on them before coming to the interview. If for some reason you did not,
    do not say that you did, as the interviewer may reveal you by asking a specific
    question about it. If you did look at the company''s website, this is an appropriate
    time to bring up something you saw there that was of particular interest to you,
    or a value that you especially supported.


    ### 13: How does *X experience* on your resume relate to this position?


    **Answer:**


    Many applicants will have some bit of experience on their resume that does not
    clearly translate to the specific job in question. However, be prepared to be
    asked about this type of seemingly-irrelevant experience, and have a response
    prepared that takes into account similar skill sets or training that the two may
    share.


    ### 14: Why do you want this position?


    **Answer:**


    Keep this answer focused positively on aspects of this specific job that will
    allow you to further your skills, offer new experience, or that will be an opportunity
    for you to do something that you particularly enjoy. Don''t tell the interviewer
    that you''ve been looking for a job for a long time, or that the pay is very appealing,
    or you will appear unmotivated and opportunistic.


    ### 15: How is your background relevant to this position?


    **Answer:**


    Ideally, this should be obvious from your resume. However, in instances where
    your experience is more loosely-related to the position, make sure that you''ve
    researched the job and company well before the interview. That way, you can intelligently
    relate the experience and skills that you do have, to similar skills that would
    be needed in the new position. Explain specifically how your skills will translate,
    and use words to describe your background such as “preparation” and “learning.”
    Your prospective position should be described as an “opportunity” and a chance
    for “growth and development.”


    ### 16: How do you feel about X mission of our company?


    **Answer:**


    It’s important to have researched the company prior to the interview – and if
    you’ve done so, this question won’t catch you off guard. The best answer is one
    that is simple, to the point, and shows knowledge of the mission at hand. Offer
    a few short statements as to why you believe in the mission’s importance, and
    note that you would be interested in the chance to work with a company that supports
    it.


    ### 17: Would you rather receive more authority or more responsibility at work?


    **Answer:**


    There are pros and cons to each of these options, and your interviewer will be
    more interested to see that you can provide a critical answer to the question.
    Receiving more authority may mean greater decision-making power and may be great
    for those with outstanding leadership skills, while greater responsibility may
    be a growth opportunity for those looking to advance steadily throughout their
    careers.


    ### 18: What do you do when someone in a group isn''t contributing their fair
    share?


    **Answer:**


    This is a particularly important question if you''re interviewing for a position
    in a supervisory role – explain the ways in which you would identify the problem,
    and how you would go about pulling aside the individual to discuss their contributions.
    It''s important to understand the process of creating a dialogue, so that you
    can communicate your expectations clearly to the individual, give them a chance
    to respond, and to make clear what needs to change. After this, create an action
    plan with the group member to ensure their contributions are on par with others
    in the group.


    ### 19: Tell me about a time when you made a decision that was outside of your
    authority.


    **Answer:**


    While an answer to this question may portray you as being decisive and confident,
    it could also identify you to an employer as a potential problem employee. Instead,
    it may be best to slightly refocus the question into an example of a time that
    you took on additional responsibilities, and thus had to make decisions that were
    outside of your normal authority (but which had been granted to you in the specific
    instance).


    Discuss how the weight of the decision affected your decision-making process,
    and the outcomes of the situation.


    ### 20: Are you comfortable going to supervisors with disputes?


    **Answer:**


    If a problem arises, employers want to know that you will handle it in a timely
    and appropriate manner. Emphasize that you''ve rarely had disputes with supervisors
    in the past, but if a situation were to arise, you feel perfectly comfortable
    in discussing it with the person in question in order to find a resolution that
    is satisfactory to both parties.


    ### 21: If you had been in charge at your last job, what would you have done differently?


    **Answer:**


    No matter how many ideas you have about how things could run better, or opinions
    on the management at your previous job, remain positive when answering this question.
    It’s okay to show thoughtful reflection on how something could be handled in order
    to increase efficiency or improve sales, but be sure to keep all of your suggestions
    focused on making things better, rather than talking about ways to eliminate waste
    or negativity.


    ### 22: Do you believe employers should praise or reward employees for a job well
    done?


    **Answer:**


    Recognition is always great after completing a difficult job, but there are many
    employers who may ask this question as a way to infer as to whether or not you’ll
    be a high-maintenance worker. While you may appreciate rewards or praise, it’s
    important to convey to the interviewer that you don’t require accolades to be
    confident that you’ve done your job well. If you are interviewing for a supervisory
    position where you would be the one praising other employees, highlight the importance
    of praise in boosting team morale.


    ### 23: What do you believe is the most important quality a leader can have?


    **Answer:**


    There are many important skills for a leader to have in any business, and the
    most important component of this question is that you explain why the quality
    you choose to highlight is important. Try to choose a quality such as communication
    skills, or an ability to inspire people, and relate it to a specific instance
    in which you displayed the quality among a team of people.

