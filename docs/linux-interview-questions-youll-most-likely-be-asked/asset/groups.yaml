    TCP port 80 to host 192.168.0.1, with a RST packet. This rule should be the last
    rule in the chain.


    **Answer:**

    ```

    /sbin/iptables -A INPUT -p tcp -dport 80 -s 192.168.0.1 -j REJECT --reject-with
    tcp-reset

    ```


    ## 104: Give an example of the syntax used to start a port scan, using the utility
    NMAP, on the host 192.168.0.10. Pinging the host before the scan should be disabled,
    since the host drops all ICMP traffic.


    **Answer:**

    `nmap -P0 192.168.0.10`


    ## 105: What command will delete the default route?


    **Answer:**

    `route del default`


