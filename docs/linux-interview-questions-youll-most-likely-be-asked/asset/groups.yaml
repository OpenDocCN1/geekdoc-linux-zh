    # Linux 问题


    *复习这些典型的面试问题，并思考你会如何回答。阅读列出的答案，你将找到最佳答案以及策略和建议。*


    ---


    ## 硬件


    **1：哪个命令显示与硬件相关的内核消息？**


    - a) dmesg

    - b) messages

    - c) kmesg


    **答案：**

    a) dmesg


    **2：哪个命令显示 PCI 卡信息？**


    - a) show_pci

    - b) lspci

    - c) cat /var/log/messages


    **答案：**

    b) lspci


    **3：命令 ''lsmod'' 的作用是什么？**


    - a) 列出当前已加载的模块

    - b) 列出可用的模块

    - c) 列出未加载的模块


    **答案：**

    a) 列出当前已加载的模块


    **4：命令 ''insmod'' 的作用是什么？**


    - a) 显示模块信息

    - b) 显示可用模块

    - c) 加载一个可用模块


    **答案：**

    c) 加载一个可用模块


    **5：服务器上第一块 SATA 驱动器的设备名称是什么？**


    - a) /dev/hda

    - b) /dev/sda

    - c) /dev/disk1

    - d) /dev/diska


    **答案：**

    b) /dev/sda


    **6：服务器上第一块 IDE 驱动器的设备名称是什么？**


    - a) /dev/sda

    - b) /dev/disk1

    - c) /dev/diska

    - d) /dev/hda


    **答案：**

    d) /dev/hda


    **7：哪两家显卡厂商需要专有驱动程序才能获得完整的硬件支持？**


    - a) Intel/Nvidia

    - b) Nvidia/ATI

    - c) ATI/Intel

    - d) 以上都不是


    **答案：**

    b) Nvidia/ATI


    **8：哪个设备对应物理内存？**


    - a) /dev/mem

    - b) /dev/kmem

    - c) /dev/memory

    - d) /dev/umem


    **答案：**

    b) /dev/kmem


    **9：哪个守护进程检查硬盘的健康状态？**


    - a) SMARTD

    - b) Ide-Status

    - c) Watchdog Syslog


    **答案：**

    a) SMARTD


