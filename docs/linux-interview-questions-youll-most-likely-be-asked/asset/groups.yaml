    \n# **121: 判断对错：备份 `/var` 目录将备份所有 MySQL 数据库。**\n\n**答案：** 正确\n\n**122: 你应使用什么命令来访问正在你正在处理的服务器上运行的\
    \ MySQL 实例，并连接到数据库 'mail'？**\n\n**答案：**\n\n`mysql -u root mail`\n\n**123: 判断对错：大多数\
    \ PHP 应用程序需要打开 safe_mode。**\n\n**答案：** 错误\n\n**124: 用于配置脚本可消耗的最大内存量的 PHP 设置名称是什么？**\n\
    \n- a) mem_limit\n- b) mlimit\n- c) memory_limit\n- d) memorylimit\n\n**答案：**\
    \ c) memory_limit\n\n**125: 在 PHP 配置中应设置什么选项，以便将所有 PHP 错误记录到外部文件 `/tmp/php-errors.log`？**\n\
    \n**答案：**\n\n`error_log = /tmp/php-errors.log`\n\n**126: 在 Apache 配置中应设置什么选项和值，以禁用\
