- pgno: 101
  md: '# **1: How do you make decisions?**


    **Answer:**


    This is a great opportunity for you to wow your interviewer with your decisiveness,
    confidence, and organizational skills.


    Make sure that you outline a process for decision-making, and that you stress
    the importance of weighing your options, as well as in trusting intuition. If
    you answer this question skillfully and with ease, your interviewer will trust
    in your capability as a worker.


    # **2: What are the most difficult decisions for you to make?**


    **Answer:**


    Explain your relationship to decision-making, and a general synopsis of the process
    you take in making choices. If there is a particular type of decision that you
    often struggle with, such as those that involve other people, make sure to explain
    why that type of decision is tough for you, and how you are currently engaged
    in improving your skills.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 3: When making a tough decision, how do you gather information?


    Answer:


    If you’re making a tough choice, it’s best to gather information from as many
    sources as possible. Lead the interviewer through your process of taking information
    from people in different areas, starting first with advice from experts in your
    field, feedback from coworkers or other clients, and by looking analytically at
    your own past experiences.


    # 4: Tell me about a decision you made that did not turn out well.


    Answer:


    Honesty and transparency are great values that your interviewer will appreciate
    – outline the choice you made, why you made it, the results of your poor decision
    – and finally (and most importantly!) what you learned from the decision.


    Give the interviewer reason to trust that you wouldn’t make a decision like that
    again in the future.'
  merge: -1
  img_proc: true
