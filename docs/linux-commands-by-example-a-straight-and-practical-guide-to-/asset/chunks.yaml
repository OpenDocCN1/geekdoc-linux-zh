    ## 12 LINKS


    Links are often used to store multiple copies of the same file in different places
    but still reference to one file.


    ### Symbolic links


    Symbolic links are like shortcuts or references to the actual file or directory,
    they are used all the time to link libraries and make sure files are in consistent
    places without moving or copying the original.


    Any modification to the linked file will be changed on the original file. If you
    delete the link, the original file is unchanged, it will still exist, and if you
    delete the original file but not the link, the link will remain but will point
    to a file that does not exist.


    We’ll make an example to understand this concept.


    Go into the `/tmp` directory and create a folder named `practice`, inside that
    folder, make a copy of `/etc/profile`:


    ```bash

    $ cd /tmp

    $ mkdir practice

    $ cd practice/

    $ cp /etc/profile profile

    $ ls –ila profile

    2251799814816612 -rw-r--r-- 1 … 8 Nov. 15:53 profile

    ```


    The last command shows the copied file, take note of the inode at the first column.
    The inode is the physical reference on the hard drive where the file resides.


    Now let’s create a symbolic link called `slinkprofile`, it points to the `profile`
    file:


    ```bash

    $ pwd

    /tmp/practice

    $ ln -s profile slinkprofile

    $ ls -ila slinkprofile

    20547673300372152 lrwxrwxrwx 1 … slinkprofile -> profile

    ```


    Note how the inode for the link is different.


    In the following example, we’re editing the link to see if the changes will be
    made on the real file:


    ```bash

    $ pwd

    /tmp/practice

    $ echo ''#something'' >> slinkprofile

    $ tail -2 slinkprofile

    export PROFILEREAD PATH ORIGINAL…

    #something


    $ tail -2 profile

    export PROFILEREAD PATH ORIGINAL…

    #something

    ```


    Let’s move `/tmp/practice/profile` and see if it causes any problems:


    ```bash

    $ pwd

    /tmp/practice

    $ mv profile ../

    $ cat slinkprofile

    cat: slinkprofile: No such file or directory

    ```


    After moving the original file, the symbolic link becomes broken as it is linked
    to a file name and not to the inode/physical location.


    Keep in mind that symbolic links can reference a file or a folder on a different
    hard disk/volume; and that they reference abstract filenames/directories and NOT
    physical locations. They are given their own inode.


    ### Hard links


    This type differentiates from symbolic links by the following points:


    - They only link to a file not a directory.

    - They cannot reference a file on a different disk/volume.

    - They reference a file even if it is moved.

    - They reference the inode/physical locations on the disk.


    Go to `/tmp/practice`, move back the `profile` file to its initial location (`/tmp/practice`)
    and create a hard link called `hlinkprofile`:


    ```bash

    $ pwd

    /tmp/practice

    # Move the file on the parent directory to the current one

    $ mv ../profile .

    $ ln profile hlinkprofile

    $ ls -ila hlinkprofile profile

    2251799814816612 -rw-r--r-- 2 … 8 Nov. 15:53 hlinkprofile

    2251799814816612 -rw-r--r-- 2 … 8 Nov. 15:53 profile

    ```


    Notice how the inode numbers are exactly the same for the hard link and the actual
    file.


    Editing and saving the hard link would have the same effect on the original file
    as the symbolic link.


    So let’s move the original file:


    ```bash

    $ pwd

    /tmp/practice

    $ mv profile ../

    $ tail -2 hlinkprofile

    export PROFILEREAD PATH ORIGINAL…

    #something

    ```


    Looks like the hard link still work even though we moved the original file. This
    is because the hard link was linked to the inode, the physical reference on the
    hard drive where the file resides.


    This leads to an interesting question. What happens if I delete a hard link?


    Even though the hard link references the physical location of the file on the
    hard drive through an inode, removing a hard link will not delete the original
    file.


    Type the following commands and see what happens:


    ```bash

    $ pwd

    /tmp/practice

    $ rm hlinkprofile

    $ ls ../

    #### practice profile

    ```


    ### Use case


    Let’s create two long directory structures:


    ```bash

    $ cd

    $ pwd

    /home/Khaled Jamal

    $ mkdir -p project/linux/prod/l1/batch

    $ mkdir -p project/linux/prod/l2/batch

    ```

