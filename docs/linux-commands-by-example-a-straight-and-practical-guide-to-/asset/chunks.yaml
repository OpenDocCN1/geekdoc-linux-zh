    var

    $pwd

    /


    Now if you type `cd etc`, the system assumes the current directory (slash `/`)
    as a starting point, which puts you in `/etc`:


    ```

    $ cd etc

    $pwd

    ```

    /etc


    That’s what we call a relative path. It’s a path relative to the current working
    directory.


    ### Tab completion


    This mechanism is very helpful to speed up typing, it is case sensitive and can
    be used while typing commands, options or file names. For example, typing `cd
    /ho` followed by the tab key will expand the command line to `cd /home/`. The
    same thing can be applied to commands, you should just enter enough letters followed
    by the tab key and the terminal would guess what you want to type.


