    Try it again:


    ```bash

    $ sudo mount -t iso9660 /dev/sr0 /media/VBox_GAs_5.2.1/

    ```


    ```

    mount: /dev/sr0 is write-protected, mounting read-only

    ```


    The `-t` option is used to indicate the given file system type.


    The `iso9660` argument describes standard and default file system structure to
    be used on CD/DVD ROMs.


    To check the mounting, type:


    ```bash

    $ mount | grep ''^/dev''

    ```


    ```

    /dev/sda1 on / type ext4 (rw,relatime,errors=remount-ro,data=ordered)

    /dev/sr0 on /media/jamal/VBox_GAs_5.2.1 type iso9660 (ro,relatime)

    ```


    ```bash

    $ ls /media/VBox_GAs_5.2.1/

    ```


    ```

    32Bit AUTORUN.INF cert runasroot.sh VBoxLinuxAdditions.run VBoxWindowsAdditions-amd64.exe
    VBoxWindowsAdditions-x86.exe

    64Bit autorun.sh OS2 TRANS.TBL VBoxSolarisAdditions.pkg VBoxWindowsAdditions.exe

    ```


    To unmount the `/dev/sr0` device, use the `umount` command:


    ```bash

    $ sudo umount /dev/sr0

    $ mount | grep ''^/dev''

    ```


    ```

    /dev/sda1 on / type ext4 …

    ```


    ### df command


    You can also use the `df` command to show which file systems are mounted to what
    points and to get information about the total usages:


    ```bash

    $ df -hT

    ```


    ```

    Filesystem Type Size Used Avail Use% Mounted on

    udev devtmpfs 689M 0 689M 0% /dev

    tmpfs tmpfs 142M 4.7M 137M 4% /run

    /dev/sda1 ext4 8.8G 4.2G 4.2G 51% /

    tmpfs tmpfs 708M 196K 708M 1% /dev/shm

    tmpfs tmpfs 5.0M 4.0K 5.0M 1% /run/lock

    tmpfs tmpfs 708M 0 708M 0% /sys/fs/cgroup

    …

    ```


    The `h` option (or `--human-readable`) transforms the output into a form understandable
    for common users.


    The `T` option prints the file system type (the `Type` column).


    `df` is useful specially to display the amount of disk space available on the
    file system containing a specific file or directory:


    ```bash

    $ df -h /home

    ```


    ```

    Filesystem Size Used Avail Use% Mounted on

    /dev/sda1 8.8G 4.2G 4.2G 51% /

    ```


    ### ENDING


    At this point you should have a great knowledge in Linux commands and bash scripting,
    I hope so.


    If you have a little time, let me know please your review, my email is `jamalbayi@gmail.com`.

