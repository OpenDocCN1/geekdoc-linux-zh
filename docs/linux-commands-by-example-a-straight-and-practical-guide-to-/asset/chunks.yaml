    ### Zero or more


    There are two operators that indicate zero, one or more occurrences of the preceding
    characters:


    - The star `*`: means that the preceding character can be repeated 0 or more times.

    - The plus `+`: means that the preceding character can be repeated 1 or more times.


    Suppose we want to find any line that begins with `#` and ends with a period,
    we can use the following expression:


    ```

    ##### $ cat .bash_profile | grep "^#.*\.$"

    ```


    `~/.bash_profile`: executed by `bash(1)` for login shells.

    (rest of comments omitted)


    Let’s decorticate the regex expression:


    `^#` is for matching a `#` at the beginning of line.

    `.*` the star after the dot means that any character could be repeated zero or
    more times.

    `\.$` is for matching a period at the end of line, the ending period is escaped
    so that it represents a literal period instead of the usual "any character" meaning.


    Let’s use the plus sign instead of the star:


    ```

    ##### $ cat .bash_profile | grep "^#.+\.$"

    ```


    Nothing shows up, as if the plus sign didn’t work.


    Actually there are many types of regular expressions, we state:


    - The basic regular expression (BRE): `("^" , "$" , "*" , "." , "[]")`

    - The extended regular expression (ERE): `("?" , "+" , "{" , "|" , "(" , ")")`


    As noted, the plus sign is one of the ERE operators, in order to use ERE with
    the `grep` command we should use the `-E` option:


    ```

    ##### $ cat .bash_profile | grep -E "^#.+\.$"

    ```


    Another way to make it work is to escape the plus operator:


    ```

    ##### $ cat .bash_profile | grep "^#.\+\.$"

    ```


    ### Rounded brackets ()


    Rounded brackets are used to group several characters to behave as one.


    Let’s analyse the following command:


    ```

    ##### $ cat .bash_profile | grep -E ''HOME.*/(bin|etc)''

    ```


    The command looks for lines that contain the string `''HOME''`, followed by zero
    or more characters (`.*`), followed by `/`, followed by `bin` or `etc`.


    To indicate alternation, we use the pipe character `|`. These are often used within
    parenthetical grouping to specify that one of two or more possibilities should
    be considered a match.


    Suppose you want to modify the command in order to make the `''HOME''` string
    as optional, to do that we’ll use rounded brackets to group `HOME`’s characters
    and apply an operator to them as a unit:


    ```

    ##### $ cat .bash_profile | grep -E ''(HOME)?.*/(bin|etc)''

    ```


    The question mark `?` we used above represents zero or one occurrence of the preceding
    unit (`HOME`).


    # 10 FILTERS


    In this chapter we’ll learn the most common filters like `grep`, `cut`, `tr`,
    `wc`, `sort`, `sed` and `awk`.


    ### grep


    The `grep` command is used to filter lines of text, containing or not containing
    a certain specific string.


    Let’s prepare a file to experiment with this command:


    ```

    $ pwd

    /home/Khaled Jamal

    $ echo This is the first line >> sample.txt

    $ echo This is the second line >> sample.txt

    $ cat sample.txt

    This is the first line

    This is the second line

    ```


    The following command brings us only lines containing the `''first''` string:


    ```

    $ cat sample.txt | grep first

    This is the first line

    ```


    You can use `grep` directly by supplying the file name:


    ```

    $ grep first sample.txt

    This is the first line

    ```


    `grep` with the `-i` option ignores case distinctions in both the filtering `PATTERN`
    and the input files:


    ```

    $ echo THIS IS THE THIRD LINE >> sample.txt

    $ grep -i third sample.txt

    THIS IS THE THIRD LINE

    ```


    To select non-matching lines use the `-v` option:


    ```

    $ grep -vi third sample.txt

    This is the first line

    This is the second line

    ```


    To filter by many words, use quotes or double quotes:


    ```

    $ grep -i ''the third'' sample.txt

    THIS IS THE THIRD LINE

    ```


    And to search in all files in the current directory and its subdirectories, the
    `-r` (recursive) option is the one you need to use.


    In the following example we’re creating a `tmp` directory, and a `notes.txt` file
    into it:


    ```

    $ cd

    $ pwd

    /home/Khaled Jamal

    $ mkdir tmp

    $ touch tmp/notes.txt

    $ ls -R

    ##### .:

    sample.txt

    tmp:

    notes.txt

    ```


    Then we add a few lines into `notes.txt`:


    ```

    $ echo This is the first line >> tmp/notes.txt

    $ echo This is the second line >> tmp/notes.txt

    $ cat tmp/notes.txt

    This is the first line

    This is the second line

    ```


    Finally we make use of the `-r` option to search recursively in the `tmp` directory:


    ```

    ##### $ grep -r ''the first'' tmp

    tmp/notes.txt:This is the first line

    ```


    We can also use `grep` without the `[FILE]` argument to look recursively in the
    current directory:


    ```

    $ cd

    $ pwd

    /home/Khaled Jamal

    $ grep -r ''the first''

    sample.txt:This is the first line

    tmp/notes.txt:This is the first line

    ```


    One important option to talk about is the `-l` option that print only file names.


    Suppose we want to get only file names containing lines that start with the string
    `''export''`, let’s look for that in all files under `/etc`:


    ```

    $ grep -l ''^export'' /etc/*

    ```


    We got many error messages indicating directories that are not valid for this
    search, the `-s` option allows to suppress these error messages:


    ```

    $ grep -sl ''^export'' /etc/*

    /etc/bash.bashrc

    /etc/profile

    ```


    You can use the `-r` option to make a recursive search as well:


    ```

    $ grep -srl ''^export'' /etc/*

    /etc/bash.bashrc

    /etc/defaults/etc/bash.bashrc

    /etc/defaults/etc/profile

    ```


    Obviously, if you remove the `-l` option you’ll get a full result (file names
    and lines):


    ```

    ##### $ grep -sr ''^export'' /etc/*

    /etc/bash.bashrc:export EXECIGNORE="*.dll"

    /etc/defaults/etc/bash.bashrc:export EXECIGNORE= …

    /etc/defaults/etc/profile:export PROFILEREAD PATH …

    ```


