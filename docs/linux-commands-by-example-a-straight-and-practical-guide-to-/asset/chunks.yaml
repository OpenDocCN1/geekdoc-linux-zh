    ## 6 IO REDIRECTION


    Every program we run on the command line has three data streams connected to it.


    - `STDIN (0)` - Standard input: data fed into the program.

    - `STDOUT (1)` - Standard output: data printed by the program, defaults to the
    terminal.

    - `STDERR (2)` - Standard error: for error messages, also defaults to the terminal.


    Piping and redirection are the means by which we may connect these streams between
    programs and files to direct data in interesting and useful ways.


    ### Redirection


    The greater than operator (`>`) indicates to the command line that we wish the
    programs output to be saved in a file instead of printed to the screen.


    Let''s see an example where we redirect the `ls` output to a file:


    ```bash

    pwd

    /home/Khaled Jamal

    ls /etc > output.txt

    cat output.txt

    ```


    alternatives

    bash.bash_logout

    bash.bashrc

    defaults


    Note that the file is created first (if it does not already exist) and then the
    program is run, and output saved into the file.


    If we save into a file which already exists, its content will be cleared, then
    the new output saved to it:


    ```bash

    echo This is a test > output.txt

    cat output.txt

    ```

    This is a test


    We can instead get the new data to be appended to the file using the double greater
    than operator (`>>`):


    ```bash

    echo ''This line will be appended to the file'' >> output.txt

    cat output.txt

    ```

    This is a test

    This line will be appended to the file


    The less than operator (`<`) sends data the other way. We read data from the file
    and feed it into the program via its `STDIN` stream.


    For example, here we count the lines in the `output.txt` file:


    ```bash

    wc -l < output.txt

    ```


    We may easily combine the two forms of redirection into a single command. In the
    following example we look for lines with the word ''appended'' in the `output.txt`
    file, and then put the result in another newly created file:


    ```bash

    grep ''appended'' < output.txt > grep-result.txt

    cat grep-result.txt

    ```

    This line will be appended to the file


    Note: `grep` is a search command, we’ll talk about it later.


    Now let''s look at the third stream which is Standard Error or `STDERR`. Before
    that we want to mention that these streams have numbers associated with them and
    we may use these numbers to identify the streams.


    `STDERR` is stream number `2`.


    If we place a number before the greater (`>`) operator, then it will redirect
    that stream. In the example below, we use the `rm` command to delete two existing
    files, but we include in the arguments, a file that does not exist, the `rm` command
    runs, and redirects errors to the `errors.txt` file:


    ```bash

    rm grep-result.txt output.txt no-such-file.txt 2> errors.txt

    ls

    errors.txt

    cat errors.txt

    ```

    rm: cannot remove ''no-such-file.txt'': No such file or directory


    ### Piping


    Piping is a mechanism for sending data from one program to another, the operator
    we use is (`|`). What this operator does is to feed the output from the program
    on the left as input to the program on the right.


    In this example we list only the first three files in the `/etc` directory:


    ```bash

    ls /etc | head -3

    ```

    alternatives

    bash.bash_logout

    bash.bashrc


    So the output of `ls /etc` is sent to the `head` command which prints only three
    lines from this output. We may pipe as many programs together as we like. For
    example here we pipe the previous output to the `tail` command so as to get only
    the third file:


    ```bash

    ls /etc | head -3 | tail -1

    ```

    bash.bashrc


    ## 7 SHELL VARIABLES


    An environment variable is a setting that the operating system, or programs working
    in the operating system access.


    ### Shell variable


    A shell variable is a variable that is available in the current shell (the current
    command line interpreter); it is only seen by built in shell commands.


    In the following example, we create a shell variable and try to act on:


    ```bash

    NAME=kevin

    ```


    Below we display this variable’s value by using built in shell commands like `echo`,
    `printf` or `set`:


    ```bash

    echo $NAME

    kevin

    printf $NAME

    kevin

    ```


    Note: To read a variable’s value, both `$VARNAME` or `${VARNAME}` are valid forms
    to use.


    `set` is a built in shell command that displays all variables in the system, let’s
    use it and redirect its output to the `grep` command that searches and displays
    the `NAME` variable:


    ```bash

    set | grep kevin

    ```

    NAME=kevin


    But this variable won’t be seen by external commands like `env`. `env` is not
    a built in shell command, it is used also to display all variables in the system,
    but it won’t return any result in this case:


    ```bash

    env | grep kevin

    ```


    ### Environment variable


    An environment variable is available globally in the current shell; it is seen
    by all commands and child sessions.


    So to make the `NAME` variable an environment variable, we have to export it this
    way:


    ```bash

    export NAME

    ```


    Note: You can use `export VARNAME=something` to create an environment variable
    in one shot.


    After exporting the `NAME` variable, every command in the current shell can see
    it:


    ```bash

    env | grep kevin

    NAME=kevin

    set | grep kevin

    NAME=kevin

    echo $NAME

    kevin

    ```


    We can use the `unset` command to remove a shell or an environment variable.

