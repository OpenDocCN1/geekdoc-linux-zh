    ### ps


    The `ps` command on Linux is one of the most basic commands for viewing processes
    running on the system. It provides a snapshot of the current processes along with
    detailed information like user id, cpu usage, memory usage, command name etc.


    When `ps` is used without any options, it sends to standard output, four items
    of information for at least two processes currently on the system:


    ```bash

    $ ps

    PID TTY TIME CMD

    2294 pts/2 00:00:00 bash

    2412 pts/2 00:00:00 ps

    ```


    `PID` is the process ID, it is very important.


    `CMD` is the name of the command that launched the process.


    To obtain much more complete information about the processes currently on the
    system, use the following command:


    ```bash

    $ ps -aux | less

    USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND

    root 1 0.8 0.3 24944 5004 ? Ss 14:27 0:14 /sbin/init splash

    root 2 0.0 0.0 0 0 ? S 14:27 0:00 [kthreadd]

    root 4 0.0 0.0 0 0 ? S< 14:27 0:00 [kworker/0:0H]

    ```


    ### …


    The `-a` option tells `ps` to list the processes of all users on the system.


    The `-u` option is used to provide detailed information about each process.


    The `-x` option adds to the list, processes that have no controlling terminal,
    such as daemons, which are programs that are launched during booting (i.e. computer
    start-up) and run unobtrusively in the background until they are activated by
    a particular event or condition.


    To sort processes by cpu or memory usage, do it like this:


    ```bash

    $ ps -aux --sort=-pcpu,+pmem | head -5

    USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND

    jamal 1512 9.9 8.2 294740 126456 ? Ssl 14:30 3:53 compiz

    ```


    ### …


    To display processes by process id, use the `-p` option and provide the process
    id (or ids separated by comma):


    ```bash

    $ ps -up 1512

    USER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND

    jamal 1512 8.3 8.0 291932 123752 ? Ssl 14:30 3:57 compiz

    ```


    Let’s create a shell script and monitor its execution using the `ps` command,
    use these commands to set up and run the shell script: (Notice the script process
    ID 2986)


    ```bash

    ~$ echo ''#!/bin/bash

    > for i in {1..20}

    > do

    > sleep 1

    > done'' > shell-script.sh

    $ chmod 755 shell-script.sh

    $ ./shell-script.sh &

    ```


    #### [1] 2986


    You can monitor the execution with `ps` like this:


    ```bash

    $ ps -p 2986

    PID TTY TIME CMD

    2986 pts/2 00:00:00 shell-script.sh

    ```


    The output tells you that the script is always running, wait a little time and
    retry to see if it’s done:


    ```bash

    $ ps -p 2986

    PID TTY TIME CMD

    [1]+ Done ./shell-script.sh

    ```


    Likewise, each command that runs as a background job (e.g. `gzip`) can be monitored
    by the `ps` command.


    ### du


    The `du` (Disk Usage) command is used to check the information of disk usage of
    files and directories.


    For example, use it this way to find out the disk usage summary of the `/home`
    directory tree and each of its subdirectories:


    ```bash

    $ du -h /home | less

    32K /home/kevin

    4.0K /home/jamal/.local/share/unity-settings-daemon

    4.0K /home/jamal/.local/share/evolution/mail/trash

    8.0K /home/jamal/.local/share/evolution/mail

    ```


    ### …


    And to get simply the size of `/home`, use the `-s` or `--summarize` option that
    displays only a total for each argument:


    ```bash

    $ du -sh /home

    18M /home

    ```


    You can also use the `-c` option to get a grand total usage disk space at the
    last line:


    ```bash

    $ du -ch /home/jamal

    4.0K /home/jamal/.local/share/unity-settings-daemon

    ```

