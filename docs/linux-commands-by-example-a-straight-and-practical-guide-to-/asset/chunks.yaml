- fmt: "\n![cover](Images/image-21I757U4.jpg)![cover](Images/image-21I757U4.jpg)\n\
    \n# Linux Commands By Example\n\n### KHALED JAMAL\n\nCopyright © 2018 Khaled Jamal\n\
    All rights reserved.\n\nISBN: 9781370151974\n\n### FORWARD\n\nThis book is intended\
    \ for IT fellows who want to acquire a basic to intermediate Linux knowledge rapidly.\n\
    \nI used many references to arrange it in such a way to be clear, extremely focused\
    \ and practical.\n\nThe key of getting full benefit is to install the nice tool\
    \ in the first chapter, to read and execute the examples, by the end of this practice\
    \ you will be able to use commands and deal comfortably with Linux.\n\n## 1 GETTING\
    \ STARTED\n\nThis chapter provides general information about the Linux file system,\
    \ explains what a distribution is and finally shows you how to prepare a light\
    \ environment to practice commands.\n\n### The root\n\nIn a file system, there\
    \ is always what is called a root, which is a big base folder that contains all\
    \ the other folders and files.\n\nWindows has actually several roots. `C:\\` is\
    \ the root of your hard drive; `D:\\` could be the root of your CD drive.\n\n\
    Linux has one root that is the slash `/`. There is no higher level folder than\
    \ `/`.\n\n### The directory contents\n\nWe’ll make you here a list of the most\
    \ common directories found directly under Linux root `/`.\n\nIt is important to\
    \ get an idea about it, but don’t worry if you don’t fully understand the meaning\
    \ of each of these directories.\n\n- `/bin`: contains programs (executable) that\
    \ can be used by all users of the machine.\n- `/boot`: contains files for booting\
    \ Linux.\n- `/dev`: contains subfolders that represent each device. For example,\
    \ there are files that represent your partitions and CD drive.\n- `/etc`: contains\
    \ configuration files specific to the system.\n- `/home`: contains by default\
    \ the user home directories, each user of the computer has his personal folder\
    \ in here. For example, my personal home directory is `/home/Khaled Jamal`.\n\
    - `/lib`: contains the shared libraries used by the programs.\n- `/media`: when\
    \ a removable device (such as an SD memory card or a USB flash drive) is inserted\
    \ into your computer, Linux allows you to access it from a subfolder of `/media`.\n\
    - `/proc`: contains information about the system state and processes.\n- `/root`:\
    \ this is the root user’s home directory, normally, the personal folders are placed\
    \ in home, but that of \"root\" is an exception. Because \"root\" is the super\
    \ user, he is entitled to a special space.\n- `/usr`: this is one of the biggest\
    \ files, in which will settle most of the programs requested by the user.\n- `/tmp`:\
    \ contains temporary files created by programs during system use.\n- `/var`: contains\
    \ \"variable\" data, often logs (written traces of what has happened recently\
    \ on the computer).\n\n### Linux distributions\n\nThe Linux operating system isn’t\
    \ produced by a single organization. Different organizations and people work on\
    \ different parts, for example there’s:\n\n- The Linux kernel: the core of the\
    \ operating system.\n- The GNU shell utilities: the terminal interface and many\
    \ of the commands you use.\n- The X server: produces a graphical desktop.\n- The\
    \ desktop environment: runs on the X server to provide a graphical desktop.\n\n\
    And more, System services, graphical programs, many are developed independently\
    \ from another. They’re all open-source software distributed in source code form.\n\
    \nLinux distributions take all the code from the open-source projects and compile\
    \ it for you, combining it into a single operating system you can boot up and\
    \ install. They also make choices for you, such as choosing the default desktop\
    \ environment, browser, and other software. Most distributions add their own finishing\
    \ touches, such as themes and custom software.\n\nThere are multiple different\
    \ Linux distributions, if you’re a desktop user, you’ll probably want something\
    \ simple, like Ubuntu or Mint. Others are suited for different purposes like Red\
    \ Hat, Centos, Fedora, and OpenSuse.\n\n### Cygwin\n\nCygwin is a large collection\
    \ of Open Source tools which provide functionality similar to a Linux distribution\
    \ on Windows.\n\nI recommend using this light tool to practice the examples, later\
    \ when you become familiar with the subject we’ll set up a more advanced environment.\n\
    \nTo install Cygwin, open this link `http://cygwin.com/` in your web browser,\
    \ then Look for the `setup-x86.exe` (32-bit installation) or `setup-x86_64.exe`\
    \ (64-bit installation) link and click on it to download the appropriate setup\
    \ program.\n\nThe installation is straightforward, run the Cygwin setup program,\
    \ keep the default configuration and click next many times till you come at the\
    \ screen for selecting the packages.\n\nBy default, the executable will install\
    \ only the packages in the Base category and their dependencies, resulting in\
    \ a minimal Cygwin installation and that is sufficient for our purpose.\n\nJust\
    \ keep the default and click next, the base packages will be downloaded and installed\
    \ automatically.\n\nFinally check the Create icon on Desktop and click finish\
    \ to close the setup program.\n\nGo to your Desktop and click on the Cygwin icon,\
    \ the console will show up:\n\n![](Images/image-4V5MKHF2.png)\n\nType `whoami`\
    \ to print the user id.\n\nClick on the icon in the upper left corner and choose\
    \ Options, there you can customize all kinds of things, the foreground and the\
    \ background, the font, the cursor …\n\n## 2 MAN PAGES\n\nThe manual pages are\
    \ a set of pages that explain every command available on your system including\
    \ what they do, the specifics of how you run them and what command line arguments\
    \ they accept.\n\nThe `man` command is very easy to use, it takes as parameter\
    \ the name of the command whose doc you want.\n\n### man mkdir\n\nType the following\
    \ command: (to quit the manual press q)\n\n`man mkdir`\n\nYour console should\
    \ display something like this:\n\n```\nNAME\n       mkdir - make directories\n\
    \nSYNOPSIS\n       mkdir [OPTION]... DIRECTORY...\n\nDESCRIPTION\n       Create\
    \ the DIRECTORY(ies), if they do not already exist.\n\nMandatory arguments to\
    \ long options are mandatory for short options too.\n        -m, --mode=MODE set\
    \ file mode (as in chmod)\n        -p, --parents  no error if existing, make parent\
    \ directories as needed\n```\n\n### …\n\nLet’s explain the most important section\
    \ which is the SYNOPSIS:\n\n`mkdir [OPTION]... DIRECTORY...`\n\n`[OPTION]`: after\
    \ `mkdir`, you can write an option. We put square brackets to indicate it is optional.\
    \ You don’t have to write an option.\n\n`DIRECTORY`: it is the name of the directory\
    \ to create. This parameter is mandatory since it is not in square brackets.\n\
    \n``: the term `DIRECTORY` is followed by suspension points. This means that we\
    \ can repeat `DIRECTORY` as many times as we want. It means we can specify several\
    \ directories to create at once.\n\n`[OPTION]…` means we can specify as many options\
    \ as we want.\n\nSYNOPSIS: words written in bold are words to type as they are.\
    \ Underlined words must be replaced by the appropriate name, this is logical,\
    \ we must write precisely `mkdir`, however we should not write `DIRECTORY` but\
    \ the name of the directory to create.\n\nAll options in the description section\
    \ can be used instead of `[OPTION]` in the SYNOPSIS.\n\n### man cp\n\nLet's try\
    \ a slightly more complex command: `cp`. It is used to copy files and directories.\n\
    \nType the following command:\n\n`man cp`\n\nYour console displays this synopsis:\n\
    \n```\nSYNOPSIS\n       cp [OPTION]... [-T] SOURCE DEST\n       cp [OPTION]...\
    \ SOURCE... DIRECTORY\n       cp [OPTION]... -t DIRECTORY SOURCE...\n```\n\n###\
    \ …\n\nHere is the explanation of each part:\n\n`cp [OPTION] ... [-T] SOURCE DEST`:\
    \ The only thing required here are the parameters `SOURCE` (the name of the file\
    \ to copy) and `DEST` (the name of the copy to be created) .These files can be\
    \ preceded by one or more options (note the ellipsis) as well as the `-T` option.\n\
    \n`cp [OPTION]... SOURCE... DIRECTORY`: This time you can copy one or more files\
    \ (`SOURCE...`) to a directory (`DIRECTORY`). All of this can again be preceded\
    \ by one or more options.\n"
