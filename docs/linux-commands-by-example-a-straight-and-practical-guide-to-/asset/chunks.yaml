    ### 18 USEFUL TOOLS II


    This chapter introduces tools to download and install software, as well as tools
    to monitor processes and disk usages.


    The last section is dedicated to ownership.


    ### apt-get


    Linux don’t have installation programs (.exe) like windows; it has what we call
    packages.


    A package is a kind of zipped folder that contains all the program files. It is
    in the form of `.deb`. It contains all the necessary instructions to install the
    program.


    It is very rare for a program to work alone on Linux. Very often, it uses other
    programs or other "bits of programs" called libraries. We say programs have dependencies.


    Fortunately, the Debian package system is smart. Each package indicates which
    other packages it depends on. This allows the system to recover dependencies automatically.


    All packages are grouped together in one place called a repository. This is a
    server that offers all the packages that exist (or almost), which greatly simplifies
    your search.


    By default, when you install Ubuntu, it uses the official repositories of the
    distribution.


    To get the list of repositories you use, type the following command:


    ```bash

    grep "^[^#]" /etc/apt/sources.list

    ```


    `deb http://ma.archive.ubuntu.com/ubuntu/ xenial …`

    `deb http://ma.archive.ubuntu.com/ubuntu/ xenial …`


