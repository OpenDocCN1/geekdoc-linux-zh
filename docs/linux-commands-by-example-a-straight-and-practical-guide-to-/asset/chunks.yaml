    To go up to the direct parent directory use `cd` followed by a double dot (`..`):


    ```

    $ cd ..

    $pwd

    ```

    /home


    You can use the double dot (`..`) several times to get to parent in one shot like:


    ```

    $ cd ../..

    $pwd

    ```

    /


    ### Absolute and relative paths


    When you type a path starting with slash (`/`), you’re using an absolute path
    beginning from the root. Remember, Linux has one root that is the slash (`/`).
    From anywhere in the directory tree, you can use an absolute path to get exactly
    where you want:


    ```

    $ cd /usr/bin

    $pwd

    ```

