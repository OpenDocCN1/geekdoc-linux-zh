    Hello Kevin


    Hello Bruce


    Suppose you need to iterate over all text files in the current user’s home directory,
    and to edit each file by substituting the string Hello by Hi.


    The following script can do it automatically, it iterates over the fgrep result
    and executes vi upon each file, we make use of the here document mechanism to
    feed commands to the vi current session:


    #!/bin/bash


    ORIGINAL=Hello


    REPLACEMENT=Hi


    for word in $(fgrep -l $ORIGINAL ~/*.txt)


    do


    # Feeding two commands to every vi session


    #### vi $word <<EOF


    :%s/$ORIGINAL/$REPLACEMENT/g


    :wq


    EOF


    #The delimiter above must NOT be preceded by a space


    done


    Execute the script and check the files:


    ./bash-scripting.sh


    $ cat demo1.txt demo2.txt


    Hi Kevin


    Hi Bruce


    By the way it was just a demonstration to clarify the concept, in real world you
    would use a filter like this one:


    $ sed -ie ''s/Hi/Hello/g'' $(fgrep -il ''Hi'' ~/*.txt)


    $ cat demo1.txt demo2.txt


    Hello Kevin


    Hello Bruce


    ### 17 SETTING UP A LINUX ENVIRONMENT


    This chapter is a step by step demonstration of a Linux environment installation.


    I installed this environment many times to be sure it will work for you but anyway
    if you encounter any problem, please make a google search and fix it.


    ### Installing VirtualBox


    Virtualization is about running multiple operating systems on a single machine,
    while giving the perfect illusion that they are on different physical computers.


    There are many tools for managing virtual machines; VirtualBox is the one we’re
    going to use.


    You need to download the VirtualBox installer here:


    [http://www.oracle.com/technetwork/server-storage/virtualbox /downloads/index.html](http://www.oracle.com/technetwork/server-storage/virtualbox%20/downloads/index.html)


    Double click the executable, keep the default setting and install VirtualBox.


    When installation completes, double click the VirtualBox icon on your desktop.
    You should see something like this:


    ![](Images/image-DUI8IKQF.jpg)


    ### Creating a Virtual Machine


    To create a virtual machine click New, inside that virtual machine we’ll install
    the Ubuntu operating system, so name it Ubuntu, Choose a Linux type and the version
    (32bit or 64bit according to your machine).


    Click next and select a great amount of RAM memory but don’t exceed the green
    line.


    Click next and choose to create a virtual hard disk now.


    Click next and choose VDI (VirtualBox Disk Image).


    Click next and choose dynamically allocated.


    Click next and select the size of your virtual hard disk, 10 GB or 15 GB is enough.


    Click Create.


    ### Installing Ubuntu


    You need to download The Ubuntu ISO file here:


    [https://www.ubuntu.com/download/desktop](https://www.ubuntu.com/download/desktop)'
