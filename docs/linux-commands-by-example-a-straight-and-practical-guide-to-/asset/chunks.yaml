    \n分隔符告诉 shell `here document` 已经完成。如果没有它，shell 将无限地读取下去。分隔符必须是一个不包含空格或制表符的单词。\n\
    \n下面的示例提供了相关思路，在 `eof` 分隔符之间的文本行被发送给 `cut` 命令，该命令会提取第一个字段：\n\n```bash\n$ cut -d';'\
    \ -f1 << eof\nbruce;java\nkevin;linux\neof\n```\n```text\nbruce\nkevin\n```\n\n\
    既然我们已经讨论了文本行，那么向交互式程序或命令提供命令列表又是怎样的。\n\n首先，我们将创建两个文件`demo1.txt` 和 `demo2.txt`：\n\
    \n```bash\n$ cd\n$pwd\n/home/Khaled Jamal\n$ echo Hello Kevin > demo1.txt\n$ echo\
    \ Hello Bruce > demo2.txt\n$ cat demo1.txt demo2.txt\n```\n```text\nHello Kevin\n\
    Hello Bruce\n```\n\n假设你需要遍历当前用户主目录下的所有文本文件，并将字符串 `Hello` 替换为 `Hi` 来编辑每个文件。\n\n\
    ```bash\n#!/bin/bash\nORIGINAL=Hello\nREPLACEMENT=Hi\nfor word in $(fgrep -l $ORIGINAL\
    \ ~/*.txt)\ndo\n  # 向每个 vi 输入两个命令\n  vi $word <<EOF\n:%s/$ORIGINAL/$REPLACEMENT/g\n\
    :wq\nEOF\ndone\n```\n\n```bash\n# 检查文件：\n./bashing.txt\nHi\nHi\n```\n\n## 17 配置\
    \ LINUX 环境\n\n本章是 Linux 环境的一个演示步骤。\n\n我安装了多次这个环境以确保它对你有效，但无论如何，如果你遇到任何问题，请在 Google\
