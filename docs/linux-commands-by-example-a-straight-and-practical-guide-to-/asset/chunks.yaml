  trans: "\n\n![cover](img/image-21I757U4.jpg)![cover](img/image-21I757U4.jpg)\n\n\
    # 实例化的 Linux 命令\n\n### KHALED JAMAL\n\nCopyright © 2018 Khaled Jamal\n版权所有所有。\n\
    \nISBN: 9781370151974\n\n### 前言\n\n本书旨在想要快速获取基础到中级 Linux 知识的 IT 同事。\n\n我参考了许多资料，将其编排得清晰、重点突出且具有实用性。\n\
    \n获得充分收益的关键在于安装第一章中好用的工具，阅读并执行示例。在这些练习结束时，你将能够熟练使用命令并舒适地处理 Linux。\n\n## 1 入门\n\
    \n本章提供了关于 Linux 文件系统的通用信息，解释了什么是发行版（distribution），并最后向你展示如何准备一个轻量级环境来练习命令。\n\n\
    ### 根目录 (root)\n\n在文件系统中，总有一个被称为“根”（root）的地方，这是一个包含所有其他文件夹和文件的基础目录。\n\nWindows\
    \ 实际上有几个根目录。`C:\\` 是你硬盘的根；`D:\\` 可能是你 CD 驱器的根。\n\nLinux 只有一个根目录，即斜杠 `/`。没有比 `/`\
    \ 更高级别的文件夹。\n\n### 目录内容\n\n我们在这里为你列出 Linux 根目录 `/` 下直接找到的最常见目录列表。\n\n了解它们很重要，但如果你不完全理解这些每个目录的含义，也不要担心。\n\
    \n- `/bin`: 包含机器所有用户都可以使用的程序（可执行文件）。\n- `/boot`: 包含启动 Linux 所需的文件。\n- `/dev`:\
    \ 包含代表每个设备的子目录。例如，有代表你的分区和 CD 驱器的文件。\n- `/etc`: 包含特定于系统的配置文件。\n- `/home`: 默认包含用户家目录，计算机的每个用户在这里都有自己的个人文件夹。例如，我的个人家目录是\
    \ `/home/Khaled Jamal`。\n- `/lib`: 包含程序使用的共享库。\n- `/media`: 当将移动设备（如 SD 内存或 USB\
    \ 闪存盘）插入电脑时，Linux 允许你从 `/media` 的子文件夹访问它。\n- `/proc`: 包含有关系统状态和进程的信息。\n- `/root`:\
    \ 这是 root 用户的家目录。通常，个人文件夹放在 home 中，但 \"root\" 是个例外。因为 \"root\" 是超级用户，他有权拥有特殊空间。\n\
    - `/usr`: 这是最大的目录之一，其中包含了用户请求的大部分程序。\n- `/tmp`: 包含程序在系统使用期间创建的临时文件。\n- `/var`:\
    \ 包含“变量”数据，通常是日志（最近在计算机上发生事件的记录）。\n\n### Linux 发行版\n\nLinux 操作系统不是由单一机构生产的。不同的机构和个人负责不同的部分，例如：\n\
    \n- Linux 内核：操作系统的核心。\n- GNU Shell 实用程序：终端界面以及你使用的许多命令。\n- X Server：产生图形桌面。\n\
    - 桌面环境：运行在 X Server 上以提供图形桌面。\n\n以及更多，系统服务、图形化程序，其中许多是独立于其他程序开发的。它们都是以源代码形式分发的开源软件。\n\
    \nLinux 发行版从开源项目中获取所有代码并为你进行编译，将其组合成一个你可以启动和安装的单一操作系统。它们还为你做选择，例如选择默认的桌面环境、浏览器和其他软件。\n\
    \n大多数发行版都会添加自己的后期完善，如主题和自定义软件。\n\n有多个不同的 Linux 发行版，如果你是桌面用户，可能想要像 Ubuntu 或 Mint\
    \ 那样简单的。其他的适用于不同的用途，如 Red Hat, Centos, Fedora 和 OpenSuse。\n\n### Cygwin\n\nCygwin\
    \ 是大型开源工具集，在 Windows 上提供类似于 Linux 发行版的功能。\n\n我建议使用这个轻量工具来练习示例，以后当你熟悉该主题后，我们将设置更高级的环境。\n\
    \n要安装 Cygwin，请在浏览器中打开此链接 `http://cygwin.com/`，然后寻找 `setup-x86.exe`（32 位安装）或 `setup-x86_64.exe`（64\
    \ 位安装）链接并点击它下载相应的安装程序。\n\n安装非常简单，运行 Cygwin 安装程序，保持默认配置并多次点击下一步，直到进入选择软件包的屏幕。\n\
    \n默认情况下，可执行文件将只安装 Base 类中的包及其依赖项，这将导致最小化的 Cygwin 安装，这对于我们的目的已经足够。\n\n保持默认并点击“下一步”，基础包将自动下载并安装。\n\
    \n最后检查桌面上的 Create 图标并点击“完成”以关闭安装程序。\n\n回到桌面并点击 Cygwin 图标，控制台将会出现：\n\n![](img/image-4V5MKHF2.png)\n\
    \n输入 `whoami` 来打印用户 ID。\n\n点击左上角的图标并选择 Options，你那里可以自定义各种内容，前景和背景、字体、光标……\n\n\
    ## 2 手册页 (MAN PAGES)\n\n手册页是一组解释系统上可用每个命令的页面，包括它们的作用、运行它们的具体细节以及它们接受的命令行参数。\n\n\
    `man` 命令非常易用，它接受你想查看文档的命令名称作为参数。\n\n### man mkdir\n\n输入以下命令：（按 q 退出手册页）\n\n`man\
    \ mkdir`\n\n你的控制台应该显示类似以下的内容：\n\n```\nNAME\n       mkdir - make directories\n\n\
    SYNOPSIS\n       mkdir [OPTION]... DIRECTORY...\n\nDESCRIPTION\n       Create\
    \ the DIRECTORY(ies), if they do not already exist.\n\nMandatory long options\
    \ are mandatory for short options too.\n        -m, --mode=MODE 设置文件模式（类似于 chmod）\n\
    \        -p, --parents  如果存在则不报错，根据需要创建父目录\n```\n\n### …\n\n让我们解释最重要的部分，即 SYNOPSIS：\n\
    \n`mkdir [OPTION]... DIRECTORY...`\n\n`[OPTION]`：在 `mkdir` 之后，你可以写一个选项。我们使用方括号表示它是可选的。你不需要写选项。\n\
    \n`DIRECTORY`：它是要创建的目录名称。这个参数是强制性的，因为它不在方括号中。\n\n`...`：术语 `DIRECTORY` 后面跟着悬挂点。这意味着我们可以根据需要重复\
    \ `DIRECTORY`。这意味着我们可以一次指定多个目录。\n\n`[OPTION]...` 意味着我们可以指定任意数量的选项。\n\nSYNOPSIS：粗体单词是要实际输入的单词。下划线单词必须替换为相应的名称，这是逻辑，我们必须精确编写\
    \ `mkdir`，但不应写 `DIRECTORY` 而是要创建的目录名称。\n\n描述部分所有的选项都可以代替 SYNOPSIS 中的 `[OPTION]`。\n\
    \n### man cp\n\n尝试一个稍微复杂的命令：`cp`。它用于复制文件和目录。\n\n输入以下命令：\n\n`man cp`\n\n你的控制台显示如下摘要：\n\
    \n```\nSYNOPSIS\n       cp [OPTION]... [-T] SOURCE DEST\n       cp [OPTION]...\
    \ SOURCE... DIRECTORY\n       cp [OPTION]... -t DIRECTORY SOURCE...\n```\n\n###\
    \ …\n\n这里是每个部分的解释：\n\n`cp [OPTION]... [-T] SOURCE DEST`：这里唯一的参数是 `SOURCE`（要复制的文件名称）和\
    \ `DEST`（要创建的副本名称）。这些文件之前可以使用多个选项（注意省略号）以及 `-T` 选项。\n\n`cp [OPTION]... SOURCE...\
    \ DIRECTORY`：这次你可以将一个或多个文件（`SOURCE...`）复制到目录（`DIRECTORY`）。这一切同样可以使用多个选项引导。\n\n\
    `cp [OPTION]... -t DIRECTORY SOURCE...`：使用 `-t` 参数可以先指定目录，然后是源文件。\n\n"
- fmt: '

    `cp [OPTION]... -t DIRECTORY SOURCE...` : This means that we can also write the
    directory (DIRECTORY) at first, followed by one or more files (SOURCE...). Be
    careful, in this case it is mandatory to use the `-t` parameter which is no longer
    in square brackets.


    ## man file


    The `file` command is used to determine file type.


    Type this command:


    ```

    $ man file

    ```


    Your console displays:


    SYNOPSIS


    `file [-bcdEhiklLNnprsvzZ0] [--apple] [--extension] [--mime-encoding] [--mime-type][-e
    testname] [-F separator] [-f namefile] [-m magicfiles] [-P name=value] file ...`


    ### …


    The `file` command must begin with "file" (this word is written in bold). That''s
    logical.


    Then you can use one of the options `-bcdEh…` (you can use `-b`, but also `-bc`,
    `-d`, `-dEs`, `-dcdEh` ...). These options are in square brackets, so they are
    optional.


    Same then for other options which are optional. However, you will notice that
    `-e` for example must be followed by a value.


    The fact that `testname`, `separator` or `namefile` are underlined means that
    you don’t have to copy these words as they are in the console: you have to replace
    them with a suitable value.


    ## Options section


    This section describes all of the options from the synopsis.


    Type this command:


    ```

    $ man rm

    ```


    Your console displays:


    NAME


    `rm - remove files or directories`


    SYNOPSIS


    `rm [OPTION]... [FILE]...`


    DESCRIPTION


    This manual page documents the GNU version of `rm`. `rm` removes each specified
    file. By default, it does not remove directories.


    ### …


    OPTIONS


    ### …


    ### -i prompt before every removal


    ### …


    `-r, -R, --recursive`


    remove directories and their contents recursively


    `-d, --dir`


    remove empty directories


    ### …


    The name and description sections describe what the command does, and if you look
    at the `-r` option, they say it removes directories and their contents recursively.
    The other options in the same line (`-R` and `--recursive`) do the same thing,
    so you can write:


    ```

    $ rm -r xdirectory

    ```


    Or


    ```

    $ rm -R xdirectory

    ```


    Or


    ```

    $ rm --recursive xdirectory

    ```


    ## man -k or apropos


    The `-k` option is used to search the man pages for a command. Suppose you want
    to get information about your disk space usage, type the following command:


    ```

    $ man –k disk space

    ```


    It would list all the commands with `disk` (and or) space in the command name
    or description.


    You can search the exact expression by adding quotes: (this command doesn’t work
    on Cygwin but would return a result on a real Linux system)


    ```

    $ man -k ''disk space''

    ```


    `df (1) - report file system disk space usage`


    The same could be achieved using `apropos`:


    ```

    $ apropos ''disk space''

    ```


    `df (1) - report file system disk space usage`


    Notice the `df` command that reports file system disk space usage.


    ## df --help


    Now that you’ve found the `df` command, let’s get some help, you can use the `man
    df` command to view the complete documentation, but we’ll use the `--help` option
    to get less details and quick help:


    ```

    $ df --help

    ```


    ### Usage: df [OPTION]... [FILE]...


    Show information about the file system on which `FILE` resides, or all file systems
    by default.


    ### …


    ### -h, --human-readable print sizes in human readable format (e.g., 1K,23M,4G)


    By using the help, you can type this command to get information about all file
    systems:


    ```

    $ df -h

    ```


    Filesystem Size Used Avail Mounted on C:/cygwin2 88G 72G /


    Or this command to get information about file system on which `/etc` resides:


    ```

    $ df -h /etc

    ```


    Filesystem Size Used Avail Mounted on C:/cygwin2 88G 72G /


    Note: the result would be different on a real Linux machine where file systems
    exist (e.g. more than one partition or volume).


    ### Searching


    It is possible to search within a manual page. To do this, while you’re in a particular
    manual page, press forward slash `/` followed by the word you look for and hit
    `Enter`. If the word appears multiple times may cycle through by pressing `n`
    for next or `N` for precedent. Type the following command:


    ```

    $ man df

    ```


    Search for the word `space` (`/space`), press Enter and navigate over search result
    using `n` or `N`.


    ## WORKING WITH DIRECTORIES


    In this chapter, we’ll learn how to navigate through directories and list their
    contents.


    ### pwd


    The `pwd` command (Print Working Directory) displays your current directory:


    ```

    $ pwd

    ```

    /home/Khaled Jamal


