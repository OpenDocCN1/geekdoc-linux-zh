    ### Here document


    A here document is used to redirect input into an interactive shell script or
    program.


    The general form for a here document is:


    command << delimiter


    text or commands


    delimiter


    The shell interprets the (<<) operator as an instruction to read input until it
    finds a line containing the specified delimiter. All input lines up to the line
    containing the delimiter are then fed into the standard input of the command.


    The delimiter tells the shell that the here document has completed. Without it,
    the shell continues to read the input forever. The delimiter must be a single
    word that does not contain spaces or tabs.


    The following example gives an idea about it, the text lines between the eof delimiters
    are sent to the cut command which retrieves the first field:


