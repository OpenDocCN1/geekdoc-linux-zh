    to move to the last line of the file, `1G` to move to the first line of the file.


    In order to display a file starting at a specific line number, use the following
    syntax:


    ```bash

    less +10 /etc/profile

    ```


    If you need to track down the number of every line with the `less` command, use
    the `-N` option like this:


