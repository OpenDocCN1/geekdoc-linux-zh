    ```bash

    $ ls -l


    total 1

    -rw-r--r-- 1 … 21 11 Nov. 22:42 my-script.sh

    ```


    You, as the owner of this script have permissions to read and write (`rw-`), any
    group you belong to has a read permission (`r--`); everyone else in the system
    has the read permission (`r--`).


    Try to execute the script like this:


    ```bash

    $ ./my-script.sh

    -bash: ./my-script.sh: Permission denied

    ```


    A permission denied error occurs because initially you have no permission to execute
    the script, but since you are the owner, you can grant the execute permission
    to yourself and to everyone if you want.


    That’s what we’re doing below, we’re granting the execute permission (`x`) to
    the user (`u`), the group (`g`) he belongs to, and everyone (`o`):


    ```bash

    $ chmod u+x,g+x,o+x my-script.sh

    $ ls -l


    total 1

    -rwxr-xr-x 1 … 21 11 Nov. 22:42 my-script.sh

    $ ./my-script.sh

    Hello

    ```


    You can remove the granted permission easily using this syntax:


    ```bash

    $ chmod u-x,g-x,o-x my-script.sh

    $ ./my-script.sh

    -bash: ./my-script.sh: Permission denied

    ```


    In the following example we’ll grant these permissions again, but this time we’ll
    use the octal way, first of all type the `ls -l` command:


    ```bash

    $ ls -l


    total 1

    -rw-r--r-- 1 … 21 11 Nov. 22:42 my-script.sh

    ```


    Refer to the graphic to calculate the initial permission, it is 644, so to grant
    the execute permission we have to add 1 to each number:


    ```bash

    $ chmod 755 my-script.sh

    $ ls -l


    total 1

    -rwxr-xr-x 1 … 21 11 Nov. 22:42 my-script.sh

    ```


    You can reset the initial permissions easily like this:


    ```bash

    $ chmod 644 my-script.sh

    $ ls -l


    total 1

    -rw-r--r-- 1 … 21 11 Nov. 22:42 my-script.sh

    ```


    One important thing to talk about is the `R` option; it is used to change files
    and directories permissions recursively.


    Suppose you want to grant all users the write permission for the content of your
    folder.


    Firstly, create a folder and two files into it:


    ```bash

    $ cd /tmp

    $ mkdir jamal-folder

    $ touch jamal-folder/notes.txt jamal-folder/contacts.txt

    ```


    As you see below, other users have just the read and execute permissions on the
    folder we’ve created:


    ```bash

    $ ls -ld jamal-folder/

    drwxr-xr-x+ 1 … 0 13 Dec. 23:59 jamal-folder/


    $ ls -l jamal-folder/

    total 0

    -rw-r--r-- 1 … 0 13 Dec. 23:59 contacts.txt

    -rw-r--r-- 1 … 0 13 Dec. 23:59 notes.txt

    ```


    Use the `R` option to grant them the write permission on the folder and all its
    content recursively:


    ```bash

    $ chmod -R o+w jamal-folder/

    $ ls -ld jamal-folder/

    drwxr-xrwx+ 1 … 0 13 Dec. 23:59 jamal-folder/


    $ ls -l jamal-folder/

    total 0

    -rw-r--rw- 1 … 0 13 Dec. 23:59 contacts.txt

    -rw-r--rw- 1 … 0 13 Dec. 23:59 notes.txt

    ```


    ## 14 VI EDITOR


    The vi editor is a tool to put content into files and edit that content as well.
    It operates in two basic modes, command mode and insert mode. When `vi` is started,
    it is in command mode.


    The command mode allows you to move around the file, perform actions such as deleting,
    copying, search and replace, saving, however, you can only insert text by using
    the insert mode.


    From command mode, you can enter into insert mode by typing the letter `i` or
    `a`. To return to command mode, use the Escape key (sometimes you need to hit
    it more than once).


    ### Navigate


    In the following example we’re redirecting the list of all files in `/bin`, to
    `file-list.txt`:


    ```bash

    $ pwd

    /home/Khaled Jamal

    $ ls -lh /bin > file-list.txt

    ```


    Type `vi file-list.txt` and press enter, as we said, when `vi` is started, it
    is in command mode.


    Try to practice all the following commands by editing this file or another of
    your choice, it’s very important.


    Let’s learn how to navigate through the file; obviously arrow keys move the cursor
    as they do in other editors.


    Here are the most common navigation commands for moving around the current line:


    - `0`: Move to the beginning of the current line.

    - `$`: Move to the end of the current line.

    - `w`: Move to the beginning of the next word.

    - `b`: Move backwards to the beginning of the previous word.


    Here are the most common navigation commands for moving around the current screen:


    - `H`: Move to the first line on the screen.

    - `M`: Move to the middle of the screen.

    - `L`: Move to the last line on the screen.


    Here are the most common navigation commands for moving around the file:


    - `G`: Move to the last line.

    - `1G`: Move to the first line.

    - `f`: Move forward to the character.

    - `b`: Move backward to the character.


    ### Delete and replace


    In command mode, here are the commands for deleting:


    - `x`: Delete the character below the cursor.

    - `X`: Delete the character before the cursor.

    - `r`: Replace the character below the cursor.


    ### Undo and repeat


    When in command mode, you can undo mistakes with `u`.


    - `.`: Repeat the last command.


    ### Cut, copy and paste


    With the cursor at desired line, you can:


    - `dd`: Cut the line.

    - `yy`: Copy the line.

    - `p`: Paste after the line.

    - `P`: Paste before the line.


    ### Join or add lines


    Pressing `o` will append the next line and go into insert mode.


    Pressing `O` will add a line above and go into insert mode.


    ### Leave vi


    Pressing the colon (`:`) allow you to give instructions to vi:


    - `:w`: Write (save) the file.

    - `:q!`: Quit discarding any changes.

    - `:wq`: Save and quit.


    To save your current file as another use: `:w fileName`


    ### Search


    While in command mode: Type `/` (slash). Enter the text to search for. Press `Enter`.
    The cursor moves to the first occurrence of that text.


    To repeat the search in a forward direction, type: `n`.


    To repeat the search in a backward direction, type: `N`.


    ### Search and replace


    To do this operation you have to switch to ex mode by pressing colon (`:`). From
    this vi mode you can do simple things, like quitting your vi session:


    `:q!` or `:wq!`


    Or you can issue Linux commands from within your vi session, like this simple
    `ls` command:


    `:!ls`


    It''s really handy sometimes to be able to stay in your vi session but still be
    able to run Linux commands.


    You can also perform search and replace commands. So to replace all occurrences
    of the string `old` with `new`, as we said press colon, then type the following
    command: `:1,$ s/old/new/g`. `1,$` will do the replace all from the first to the
    last line. You can write `1,5` to only process the first five lines.


    ### Insert mode


    Remember that when you first start vi like this: `vi [filename]` you are initially
    in command mode. Here are the commands to enter insert mode so you can type text
    into your file:


    - `i`: Insert text before cursor, until `<Esc>` hit.

    - `a`: Append text after cursor, until `<Esc>` hit.


    A very important concept to know is that when you''re in vi insert mode, you can
    easily move back to command mode by pressing the [Esc] key.


    ## 15 BASH SCRIPTING I


    The shell is a command line interpreter that provides access to the internal functionalities
    of an operating system. On most Linux systems, a program called `bash` acts as
    the shell. Besides `bash`, there are other shell programs that can be installed
    on a Linux system (e.g. `sh`, `ksh`, `csh`, `tcsh`, `zsh`).

