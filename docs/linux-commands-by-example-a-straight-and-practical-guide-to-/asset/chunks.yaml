    ![cover](Images/image-21I757U4.jpg)![cover](Images/image-21I757U4.jpg)


    ## Linux Commands By Example


    ### KHALED JAMAL


    Copyright © 2018 Khaled Jamal


    All rights reserved.


    ISBN:


    9781370151974


    ### FORWARD


    This book is intended for IT fellows who want to acquire a basic to intermediate
    Linux knowledge rapidly.


    I used many references to arrange it in such a way to be clear, extremely focused
    and practical.


    The key of getting full benefit is to install the nice tool in the first chapter,
    to read and execute the examples, by the end of this practice you will be able
    to use commands and deal comfortably with Linux.


    ### 1 GETTING STARTED


    This chapter provides general information about the Linux file system, explains
    what a distribution is and finally shows you how to prepare a light environment
    to practice commands.


    #### The root


    In a file system, there is always what is called a root, which is a big base folder
    that contains all the other folders and files.


    Windows has actually several roots. C:\ is the root of your hard drive; D:\ could
    be the root of your CD drive.


    Linux has one root that is the slash "/". There is no higher level folder than
    "/".


    #### The directory contents


    We’ll make you here a list of the most common directories found directly under
    Linux root "/".


    It is important to get an idea about it, but don’t worry if you don’t fully understand
    the meaning of each of these directories.


    /bin: contains programs (executable) that can be used by all users of the machine.


    /boot: contains files for booting Linux.


    /dev: contains subfolders that represent each device. For example, there are files
    that represent your partitions and CD drive.


    /etc: contains configuration files specific to the system.


    /home: contains by default the user home directories, each user of the computer
    has his personal folder in here. For example, my personal home directory is /home/Khaled
    Jamal.


    /lib: contains the shared libraries used by the programs.


    /media: when a removable device (such as an SD memory card or a USB flash drive)
    is inserted into your computer, Linux allows you to access it from a subfolder
    of /media.


    /proc: contains information about the system state and processes.


    /root: this is the root user’s home directory, normally, the personal folders
    are placed in home, but that of "root" is an exception. Because "root" is the
    super user, he is entitled to a special space.


    /usr: this is one of the biggest files, in which will settle most of the programs
    requested by the user.


    /tmp: contains temporary files created by programs during system use.


    /var: contains "variable" data, often logs (written traces of what has happened
    recently on the computer).


    #### Linux distributions


    The Linux operating system isn’t produced by a single organization. Different
    organizations and people work on different parts, for example there’s:


    The Linux kernel: the core of the operating system.


    The GNU shell utilities: the terminal interface and many of the commands you use.


    The X server: produces a graphical desktop.


    The desktop environment: runs on the X server to provide a graphical desktop.


    And more, System services, graphical programs, many are developed independently
    from another. They’re all open-source software distributed in source code form.


    Linux distributions take all the code from the open-source projects and compile
    it for you, combining it into a single operating system you can boot up and install.
    They also make choices for you, such as choosing the default desktop environment,
    browser, and other software. Most distributions add their own finishing touches,
    such as themes and custom software.


    There are multiple different Linux distributions, if you’re a desktop user, you’ll
    probably want something simple, like Ubuntu or Mint. Others are suited for different
    purposes like Red Hat, Centos, Fedora, and OpenSuse.


    #### Cygwin


    Cygwin is a large collection of Open Source tools which provide functionality
    similar to a Linux distribution on Windows.


    I recommend using this light tool to practice the examples, later when you become
    familiar with the subject we’ll set up a more advanced environment.


    To install Cygwin, open this link http://cygwin.com/ in your web browser, then
    Look for the setup-x86.exe (32-bit installation) or setup-x86_64.exe (64-bit installation)
    link and click on it to download the appropriate setup program.


    The installation is straightforward, run the Cygwin setup program, keep the default
    configuration and click next many times till you come at the screen for selecting
    the packages.


    By default, the executable will install only the packages in the Base category
    and their dependencies, resulting in a minimal Cygwin installation and that is
    sufficient for our purpose.


    Just keep the default and click next, the base packages will be downloaded and
    installed automatically.


    Finally check the Create icon on Desktop and click finish to close the setup program.


    Go to your Desktop and click on the Cygwin icon, the console will show up:


    ![](Images/image-4V5MKHF2.png)


    Type whoami to print the user id.


    Click on the icon in the upper left corner and choose Options, there you can customize
    all kinds of things, the foreground and the background, the font, the cursor …


    ### 2 MAN PAGES


    The manual pages are a set of pages that explain every command available on your
    system including what they do, the specifics of how you run them and what command
    line arguments they accept.


    The man command is very easy to use, it takes as parameter the name of the command
    whose doc you want to read.


    #### man mkdir


    Type the following command: (to quit the manual press q)


    $ man mkdir


    Your console should display something like this:


    NAME


    ##### mkdir - make directories


    SYNOPSIS


    ##### mkdir [OPTION]... DIRECTORY...


    DESCRIPTION


    Create the DIRECTORY(ies), if they do not already exist.


    Mandatory arguments to long options are mandatory for short options too.


    -m, --mode=MODE


    set file mode (as in chmod), not a=rwx - umask


    -p, --parents


    no error if existing, make parent directories as needed


    #### ……


    Let’s explain the most important section which is the SYNOPSIS:


    ##### mkdir [OPTION]... DIRECTORY...


    [OPTION]: after mkdir, you can write an option. We put square brackets to indicate
    that it is optional. You don’t have to write an option.


    DIRECTORY: it is the name of the directory to create. This parameter is mandatory
    since it is not in square brackets.


    …: the term DIRECTORY is followed by suspension points. This means that we can
    repeat DIRECTORY as many times as we want. It means we can specify several directories
    to create at once.


    Obviously [OPTION]… means we can specify as many options as we want.


    SYNOPSIS words written in bold are words to type as they are. Underlined words
    must be replaced by the appropriate name, this is logical, we must write precisely
    mkdir, however we should not write DIRECTORY but the name of the directory to
    create.


    All options in the description section can be used instead of [OPTION] in the
    SYNOPSIS.


    #### man cp


    Let''s try a slightly more complex command: cp. It is used to copy files and directories.


    Type the following command:


    $ man cp


    Your console displays this synopsis:


    SYNOPSIS


    ##### cp [OPTION]... [-T] SOURCE DEST


    ##### cp [OPTION]... SOURCE... DIRECTORY


    ##### cp [OPTION]... -t DIRECTORY SOURCE...


    #### …


    Here is the explanation of each part:


    cp [OPTION] ... [-T] SOURCE DEST : The only thing required here are the parameters
    SOURCE (the name of the file to copy) and DEST (the name of the copy to be created)
    .These files can be preceded by one or more options (note the ellipsis) as well
    as the -T option.


    cp [OPTION]... SOURCE... DIRECTORY: This time you can copy one or more files (SOURCE...)
    to a directory (DIRECTORY). All of this can again be preceded by one or more options.'
