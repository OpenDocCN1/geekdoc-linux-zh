    ### 11 USEFUL TOOLS I


    This chapter introduces tools to find and compress files, together with other
    common tools to execute commands as a background job.


    ### find


    This is a very useful command to search for files recursively.


    If you simply type ''find'' without any argument, all files in the current directory
    and its subdirectories will be listed:


    $ pwd


    /home/Khaled Jamal


