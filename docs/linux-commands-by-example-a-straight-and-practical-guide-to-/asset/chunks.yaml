    ### 13 PERMISSIONS


    Permissions specify what a particular person may or may not do with respect to
    a file or directory.


    ### The mode


    Every file has an inode that stores information about the file, including when
    the file was last modified, file size, data block location, permissions, and ownership
    (remember, directories are also files in the Linux system).


    The portion of the inode that stores permission information is called the mode.


    The mode has three sections, User permissions (owner), Group permissions (group
    owner), and other permissions (everyone on the Linux system).


    There are three types of permissions contained in the mode:


    Read(r): Allows to open and read the file, to list directory contents if the execute
    permission is also present.


    Write(w): Allows to open, read and edit the file, as for directories it allows
    to add, delete and rename files if the execute permission is also present.


    Execute(x): Allows executing the file (if it’s a program file) or the shell script,
    for directories it allows to enter the directory and work with its contents.


    When you identify permissions, you can either use the letter abbreviation (r,
    w, x), or the octal number that corresponds to the permission, the following graphic
    shows a detailed depiction of how permissions are displayed and how they can be
    referenced.


    ![](Images/image-6MUX8AMS.jpg)


    You should note the following facts about the mode:


    A d preceding the permissions indicates that the object is a directory, a dash
    (-) identifies a file (the example above is for a file).


    Permissions are grouped according to user, group, and other permissions.


    If a permission has not been assigned, a dash (-) takes its place in order.


    When using numbers to represent permissions, add the decimal numbers together
    within each permission group. Then string the numbers together. For example, the
    permissions in the graphic above can be represented by the number 764.


    The root user has all permissions to files and directories regardless of what
    the mode indicates.


    ### The chmod command


    The chmod command (change mode, change permissions) allows modifying the permissions
    on a file.


    It can be used in two ways: either by specifying the permissions in an octal way,
    using numbers; either by adding or removing permissions to one or more categories
    of users using the symbols r, w and x.


