  raw: '$ unset NAME


    Type these commands to make sure the variable is removed:


    $ set | grep kevin


    $ env | grep kevin


    $ echo $NAME


    #### Process locality


    The values of environment variables are local, which means they are specific to
    the running process in or for which they were set.


    This means that if we open two terminal windows (which means we have two separate
    bash processes running), and change a value of an environment variable in one
    of the windows, that change will not be seen by the shell in the other window
    or any other program currently on the desktop.


    #### Script files


    A real world requirement is that system and user environment variables are set
    automatically immediately after users log in, that’s when script files come in
    play.


    At its most basic level, a script is a command or commands stored in a file. When
    the shell reads the file, it executes the commands as if you were entering them
    through the keyboard.


    Here are some common script files in the order they execute, remember that settings
    in file that execute later in the process take precedence.


    /etc/profile: this file executes immediately after a user logs in. It is a system
    wide initialization file that is used primarily to set system environment variables.


    /etc/bashrc: this file executes after /etc/profile. It is also a system wide file
    that is often executed by individual users .bashrc file. It is most commonly used
    for aliases and functions.


    ~/.bash_profile or ~/bash_login or ~/.profile:


    After /etc/profile executes, the system searches for these files in the user’s
    home directory. These are optional files in which users can create settings specific
    to their systems.


    ~/.bash_profile executes first.


    ~/.bash_login only executes in the absence of ~/.bash_profile.


    ~/.profile only executes in the absence of the other two.


    #### Real world scenario


    In this section we’ll manage to define an environment variable automatically every
    time a user logs in.


    That environment variable will be accessed by a shell script we create.


    Use these commands to create a simple shell script:


    $ pwd


    /home/Khaled Jamal


    $ echo ''#!/bin/sh'' > my-script.sh


    $ echo ''echo Hello ${MYNAME}'' >> my-script.sh


    $ chmod 755 my-script.sh


    Execute the script like this:


    $ ./my-script.sh


    Hello


    Note: to execute a script, grant yourself the execute permission using chmod (we’ll
    talk about it later), then type the full path to the script, since the dot (.)
    refers to the current directory (/home/Khaled Jamal in our case) in which the
    script exists, we used simply ./my-script.sh.


    The script looks for a non-existing environment variable called MYNAME, type this
    command to create it and re-execute:


    $ MYNAME=Jamal


    $ ./my-script.sh


    Hello


    It doesn’t work because the script execution is a sub process and won’t see a
    simple shell variable, we need to export it:


    $ export MYNAME


    $ ./my-script.sh


    Hello Jamal


    Now shut down the current shell (terminal), open a new one and run the script,
    it will display just ‘Hello’ because the environment variable lives as long as
    the shell.


    We need to make the export command in the ~/.bash_profile script which executes
    immediately after the user logs in, thus the environment variable will be created
    automatically.


    Use the ls -a command to list bash scripts in your home directory, every user
    has its own profile scripts:


    $ pwd


    /home/ Khaled Jamal


    $ ls -a


    . .. .bash_history .bash_profile .bashrc .profile


    Type the following command to add the environment variable to ~/.bash_profile:


    $ pwd


    /home/Khaled Jamal


    $ echo export MYNAME=Jamal >> .bash_profile


    Use the source command to reload ~/.bash_profile then execute the script: (Or
    shut down the terminal and open a new one then execute)


    $ source .bash_profile


    $ ./my-script.sh


    Hello Jamal


    Note: the dot can also be used to reload script files (the command would be .
    .bash_profile).


    As long as you log in by that user account, the environment variable will be always
    available for you.


    What happens if you log in by another user account and try to access MYNAME environment
    variable?


    It won’t show up, you must define it in ~/.bash_profile of that other user, or
    you can define it in /etc/profile and make it available to all users.


    ### 8 WILDCARDS


    Commands can use wildcards to perform actions on more than one file at a time.


    #### The asterisk *


    The asterisk has the broadest meaning of any of the wildcards, as it can represent
    zero or more characters.


    For example, ls *.jpg would tell the ls command to provide the names of all files
    in the current directory that have a .jpg extension.


    Likewise, the following command would copy all files (in /etc) that have the string
    ''stab'' in their names, to the /tmp directory:


    ##### $ cp -rfv /etc/*stab* /tmp


    ##### ''/etc/fstab'' -> ''/tmp/fstab''


    ##### ''/etc/fstab.d'' -> ''/tmp/fstab.d''


    $ ls /tmp/*stab*


    /tmp/fstab


    /tmp/fstab.d:


    Another example here where we list each entry (in /etc) that starts with the string
    ''bash'':


    $ ls -l /etc/bash*


    ##### -rw-r--r-- 1 … 856 1 Nov. 21:37 /etc/bash.bash_logout


    ##### -rw-r--r-- 1 … 1176 1 Nov. 21:37 /etc/bash.bashrc


    What about listing all files that have a ''.conf'' extension:


    $ ls -l /etc/*.conf


    ##### -rw-r--r-- 1 … 5139 1 Nov. 21:37 /etc/man_db.conf


    ##### -rw-r--r-- 1 … 393 1 Nov. 21:37 /etc/nsswitch.conf


    Try to figure out how this command works:


    Remember, the asterisk (*) represents zero or more characters, so /*/ means any
    directory under the root.


    $ ls /*/*conf*


    ##### /bin/cyglsa-config /bin/cygserver-config /bin/getconf.exe /etc/man_db.conf
    /etc/nsswitch.conf


    #### The question mark ?


    The question mark (?) is used as a wildcard character to represent exactly one
    character.


    In the following example we list each entry that has the string ''file'' starting
    at the fourth position:


    $ ls -l /etc/???file*


    ##### -rw-r--r-- 1 … 5171 1 Nov. 21:37 /etc/profile


    ##### /etc/profile.d:


    total 24


    -rw-r--r-- 1 … 1107 20 Oct. 09:55 gawk.csh


    -rw-r--r-- 1 … 757 20 Oct. 09:55 gawk.sh


    #### …


    Our command lists one file directly under /etc, its name is profile, and the content
    of the /etc/profile.d directory.


    #### Square brackets []


    The third type of wildcard is a pair of square brackets, which represent any of
    the characters enclosed in the brackets.


    For example, the following would provide information about all objects that had
    an extension starting with b or c or i:


    $ file /etc/*.[bci]*


    ##### /etc/bash.bash_logout: ASCII text


    ##### /etc/bash.bashrc: ASCII text


    ##### /etc/man_db.conf: ASCII text


    ##### /etc/nsswitch.conf: ASCII text


    ##### /etc/rebase.db.i386: data


    When a hyphen is used between two characters in the square brackets wildcard,
    it indicates a range inclusive of those two characters.


    The following would list all files starting with any letter from b through d:


    $ cd /etc


    $ ls [b-d]*


    ##### bash.bash_logout bash.bashrc


    ##### defaults:


    etc


    Sometimes it can be useful to have a succession of square bracket wildcards:


    $ cd /etc


    ##### $ ls *.[a-ci-k][0-9]*


    ##### rebase.db.i386


    The previous command displays all file names that had an extension starting with
    a letter:


    From a to c, which means the first letter after the dot could be a or b or c


    Or


    From i to k, which means the first letter after the dot could be i or j or k


    The letter will be followed by one digit from 0 to 9, and then followed by zero
    or more characters.


    ### 9 REGEX


    A regular expression is a text string that describes a particular search pattern.


    Different applications and programming languages implement regular expressions
    slightly differently. We’ll explore a subset of the way that the grep command
    describes its patterns.


    #### The caret ^


    This symbol is for matching the beginning of line.


    grep ''^#'' in the example below searches every line starting with ''#'' (in .bash_profile),
    and redirect its output to the head command to display just one line:


    $ pwd


    /home/Khaled Jamal


    $ grep ''^#'' .bash_profile | head -1'
