    `Spacebar` key to navigate one page at a time, the page being your current terminal
    screen size.


    To exit the command, press `q` key.


    A useful option of the `more` command is the `-number` switch which allows you
    to set the number of line a page should contain, type the following command and
    navigate through the file:


    ```bash

    more -10 /etc/profile

    ```


    The `more` command can be used also with pipes in a multitude of Linux commands
    in order to narrow their screen output allowing you to scroll through results.


    To understand this, type the following command and look what it returns:


    ```bash

    ls -l /usr/bin | more -10

    ```


    The command `(ls -l /usr/bin)` displays the list of files under `/usr/bin`.


    The pipe (`|`) feeds the output from the program on the left (`ls -l /usr/bin`)
    as input to the program on the right (`more -10`).


    The command `(more -10)` displays ten lines of the piped input.


    ## less


    Similar to `more`, `less` command allows you to view the content of a file and
    navigate through it. The main difference between `more` and `less` is that `less`
    command is faster and allows navigation using up/down keys and other keys.


    Type the same command as before with `less`:


