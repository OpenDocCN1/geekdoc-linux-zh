- fmt: '

    We’ll study `bash` because it’s found by default on Linux, makes scripting simpler
    than `sh` and it’s more common than `ksh` and `zsh`.


    Scripting chapters assume prior programming knowledge.


    ### Setting up the scripting environment


    We continue to use `Cygwin`, Firstly type the commands below to set up a `bash`
    script:


    ```

    $ pwd

    /home/Khaled Jamal

    $ touch bash-script.sh

    $ chmod 755 bash-script.sh

    ```


    In following sections, you can use `vi` or `Notepadd++` to write `bash` programs.


    Note: to use `Notepadd++`, look for your script on the default installation location
    of `Cygwin`, in my case it’s `C:\cygwin\home\Khaled Jamal`. After editing the
    script, execute from `Cygwin` terminal. If it doesn’t work, make use of ''Convert
    to UNIX format'' on the `Edit` menu under `EOL Conversion`, then ''Encode in ANSI''
    on the `Format` menu, after that save and retry.(anyway be careful of encoding
    errors)


    We’re going to use the `truncate` command to empty the bash script from time to
    time:


    ```

    $ truncate -s 0 bash-script.sh

    ```


    ### Variables


    Let’s code this example to talk about variables:


    We want to mention that formatting is very important in `bash` scripting; note
    that there’s no space or empty lines around the first line, nor on either sides
    of the equals (`=`) sign.


    ```bash

    #!/bin/bash

    subject=Greeting

    recipient=Kevin

    message="Hello $recipient, I hope you are well"

    signature=''Khaled Jamal''


    echo $subject

    echo

    echo $message

    echo

    echo $signature

    ```


    The first line indicates the path to the program that should be used to interpret
    the rest of lines in the script (`bash` in our case); it must be on the very first
    line with no spaces around or in between.


    Then, three variables are set and printed using the basic equal sign (with no
    spaces around) and `echo` command.


    To read a variable we place its name preceded by a `$` sign. `${variable}` is
    another syntax used as a disambiguation mechanism, so you can say `${dir}01072018`
    when you mean the content of the variable `dir` followed by `01072018`, as opposed
    to `$dir01072018` which means, the content of the variable `dir01072018`.


    To make variables store more than one word, we need to use quotes (e.g. the `signature`
    variable).


    Double quotes must be used to allow referencing variables within variable’s value
    (e.g. we referenced `$recipient` in the value of the `message` variable).


    Execute the script:


    ```

    $ ./bash-script.sh

    Greeting

    Hello Kevin, I hope you are well

    Khaled Jamal

    ```


    In addition to normal variables set by users, `bash` has some built in variables
    that are pre-set by the system.


    Let’s empty the bash script and write this code:


    ```bash

    #!/bin/bash

    echo

    echo The name of the current script is $0

    echo

    echo Here are the command line supplied arguments: $1 - $2

    echo

    echo The process ID of the current script is $$

    echo

    echo The username of the current user is $USER

    ```


    Execute the script, this time we supply two arguments `arg1`, `arg2`:


    ```

    $ ./bash-scripting.sh arg1 arg2

    The name of the current script is ./bash-scripting.sh

    Here are the command line supplied arguments: arg1 - arg2

    The process ID of the current script is 12228

    The username of the current user is Khaled Jamal

    ```


    The example explains itself, notice that you can supply up to 9 arguments to the
    `bash` script (from `$1` to `$9`).


    One last thing to talk about before finishing this section is command substitution,
    this simply allows to assign a command’s result to a variable, to do this we place
    the command within rounded brackets, preceded by a `$` sign.


    Here is an example:


    ```bash

    #!/bin/bash

    result=$(ls -l /etc | grep ''^d'' | wc -l)

    echo There are $result directories under /etc

    echo

    echo There are $(ls -l /etc | grep ''^d'' | wc -l)

    directories under /etc

    ```


    `$(command)` can be used directly to evaluate a command and return its output
    (as we did in the last lines).


    Execute the script:


    ```

    $ ./bash-scripting.sh

    There are 11 directories under /etc

    There are 11 directories under /etc

    ```


    There’s another form that uses back quotes (instead of `$` and rounded brackets):


    ```

    $ echo There are `ls -l /etc | grep ''^d'' | wc -l`

    directories under /etc

    There are 11 directories under /etc

    ```


    Command substitution is useful if the command output is a single word or line.


    ### Conditions


    The basic syntax of an `if` statement is:


    ```bash

    if [ test ]

    then

    echo "Hello"

    fi

    ```


    Again, formatting is very important, note the spaces around the `''test''` condition,
    and that `then` should be written on a new line.


    To write `then` on the same line, you must add a semicolon after the brackets,
    actually it’s another syntax you might encounter, here it is:


    ```bash

    if [ test ]; then

    echo "Hello"

    fi

    ```


    Let’s empty the bash script and make this example:


    ```bash

    #!/bin/bash

    directories=$1

    if [ "$directories" = ''/etc /dev'' ]

    then

    ls $directories

    fi

    ```


    The code is very simple, we assign a given argument (`$1`) to a variable and then
    compare this variable against `''/etc /dev''`, if it’s true, we run `ls /etc /dev`,
    else we do nothing.


    Execute the script by supplying the `/etc /dev` argument:


    ```

    $ ./bash-script.sh ''/etc /dev''

    /dev:

    clipboard conout dsp full mqueue ptmx random sda sda2 shm …

    /etc:

    alternatives bash.bashrc DIR_COLORS fstab.d man_db.conf …

    ```


    To do something when the condition is not met, you can use the `else` keyword
    like this:


    ```bash

    #!/bin/bash

    directories=$1

    if [ "$directories" = ''/etc /dev'' ]

    then

    ls $directories

    else

    ls /

    fi

    ```


    Let’s supply an argument that triggers the `else` block:


    ```

    $ ./bash-script.sh something

    bin cygdrive Cygwin.bat Cygwin.ico Cygwin-Terminal.ico desktop dev etc home lib
    proc sbin tmp usr var

    ```


    Here are the different types of test you can perform on strings:


    - `$str1 = $str2`: check if both strings are identical.

    - `$str1 != $str1`: check if both strings are different.

    - `-z $str`: check if the string is empty.

    - `-n $str`: check if the string is not empty.


    For example, in the following program, we use the `-z` option to check if an argument
    exists:


    ```bash

    #!/bin/bash

    if [ -z $1 ]

    then

    echo ''No given argument''

    else

    echo $1

    fi

    ```


    Execute the script:


    ```

    $ ./bash-scripting.sh

    No given argument

    $ ./bash-scripting.sh something

    something

    ```


    By default, `bash` handles all variables as strings, but nothing prevents from
    making number comparisons if these variables contain numbers.


    Here are the different types of test we can perform with numeric variables:


    - `$n1 -eq $n2`: check if the numbers are equal. Not to be confused with the `=`
    which compares two strings.

    - `$n1 -ne $n2`: check if the numbers are different. Not to be confused with `=`
    which compares two strings.

    - `$n1 -lt $n2`: checks if `n1` is lower than `n2`.

    - `$n1 -le $n2`: checks if `n1` is lower than or equal to (`<=`) `n2`.

    - `$n1 -gt $n2`: checks if `n1` is greater (`>`) than `n2`.

    - `$n1 -ge $n2`: checks if `n1` is greater than or equal to (`>=`) n2.


    In the following example, we’re comparing numbers as well as introducing the `elif`
    keyword which simply means else if:


    ```bash

    #!/bin/bash

    number=$1

    if [ $number -eq 100 ]

    then

    echo "$number = 100"

    elif [ $number -gt 100 ]

    then

    echo "$number > 100"

    elif [ $number -lt 100 ]

    then

    echo "$number < 100"

    fi

    ```


    Execute the script with different arguments:


    ```

    $ ./bash-script.sh 100

    100 = 100

    $ ./bash-script.sh 20

    20 < 100

    $ ./bash-script.sh 200

    200 > 100

    ```


    The last type of tests is about files, we can check if they exist, if they’re
    editable or executable and more.


    Here are the different types of test we can do in this direction:


    - `-e $filename`: check if the file exists.

    - `-d $filename`: check if the file is a directory.

    - `-f $filename`: check if the file is a file.

    - `-L $filename`: check if the file is a symbolic link.

    - `-w $filename`: check if the file is editable (w).

    - `-x $filename`: check if the file is executable (x).


    The following program performs few tests over a given argument that is supposed
    to be a file or a directory:


    Note: `$#` is a built in variable that represents the number of parameters passed
    to the script.


    ```bash

    #!/bin/bash

    if [ $# -ge 1 ]

    then

    if [ -e $1 ] && [ -d $1 ]

    then

    echo $1 is a directory

    elif [ -e $1 ] && [ -f $1 ]

    then

    echo $1 is a file

    else

    echo $1 doesn''t exist

    fi

    else

    ```

    '
