    ### chown


    The owner of a file can be changed with the chown command; we’ll exercise a scenario
    about ownership.


    Firstly, use the su command to switch to root and create two users, bruce and
    jason:


    $ su root


    Password:


    $ useradd bruce


    $ useradd jason


    After that, switch to bruce and create a file named bruce-notes.txt in the /tmp
    directory:


    $ su bruce


    $ cd /tmp


    $ touch bruce-notes.txt


    bruce and his primary group are the owners of this file, anyone else has just
    the read permission, and bruce can control this permission and remove it from
    others as we do here:


    $ ls -l bruce-notes.txt


    #### -rw-rw-r-- 1 bruce bruce … bruce-notes.txt


    #### $ chmod o-r bruce-notes.txt


    Now switch to root then to jason, try to access bruce file, you’ll get a permission
    denied error message:


    $ su root


    Password:


    $ su jason


    $ cat bruce-notes.txt


    cat: bruce-notes.txt: Permission denied


    Only the root admin can change the ownership and grant it to Jason, let’s do it:


    $ su root


    Password:


    $ chown jason:jason bruce-notes.txt


    $ ls -l bruce-notes.txt


    #### -rw-rw---- 1 jason jason … bruce-notes.txt


    Now, when bruce tries to access his file, he gets a permission denied because
    he is not the owner anymore, and because he has removed the read permission to
    other users when he was the owner:


    $ su bruce


    $ cat bruce-notes.txt


    cat: bruce-notes.txt: Permission denied


    Jason as the owner can modify the file, rename it and even grant bruce the read
    permission:


    $ su root


    Password:


    $ su jason


    $ mv bruce-notes.txt jason-notes.txt


    $ chmod o+r jason-notes.txt


    $ ls -l jason-notes.txt


    #### -rw-rw-r-- 1 jason jason … jason-notes.txt


    ### 19 MOUNTING


    In Linux world, everything is a file. These files are organized in a tree structure,
    beginning at the root /.


    Your file systems (disks, partitions, CD-ROM, remote directories) will then be
    mounted at the appropriate places in the root (/) according to the /etc/fstab
    file.


    ### File system table


    This file contains information about your file systems, which device they belong
    to and to which point they will get mounted. It is usually at /etc/fstab.


    Below is an example of an fstab file:


    ![](Images/image-TYQ2GBAU.png)


    Here is the description of the most important columns:


    File system: This field is the path to the device file or the label that describes
    the volume.


    Mount point: specifies where to mount the device.


    Type: specifies the device’s file system type.


    Options: specifies the additional options accepted when mounting the device. Options
    include options for permissions on the volume, and for how the file system is
    mounted (either automatically or specific users who can mount the file system).
    Options can be strung together in comma-separated list.


    ### Mounting facts


    When you mount a volume, you mount it to a directory. When you access that directory
    in the file system, you are actually accessing the volume mounted to that directory.


    Device files are located in the /dev directory.


    You should always mount volumes and other storage devices to empty directories.
    If you mount a volume to a directory that contains data, the mounted volume makes
    that data inaccessible.


    The /mnt and /media directories (depending on your system configuration) are directories
    that contain mount points specifically for external storage devices (e.g. CD-ROM
    drive, floppy drives, USB drives…).


    If you get a disk is busy error when unmounting a device, make sure your current
    working directory is not in that file system. Also, run the command lsof +f --
    <mountpoint or device>. This will allow you to close the file or at worse kill
    the process that has the file open.


    ### Mounting commands


    Let’s take a look at our fstab file:


    $ cat /etc/fstab | grep -v ''^#''


    UUID=8b9fe08d-70ad-41fc-b9e7-60f31c52050b / ext4 …


    UUID=2e36109c-4d9b-4f4f-b476-5c4f4a03e3a0 none swap …


    It is not very helpful to understand the UUID of a drive partition, use this command
    to convert it to the familiar /dev device name:'
