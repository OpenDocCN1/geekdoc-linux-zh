  输入你在 Ubuntu 安装期间设置的用户名和密码，大功告成，现在你已经从主机操作系统远程连接到 Ubuntu：\n\n![](img/image-2Q7P7XBA.png)\n\
  \n### 安装 WinSCP\n\nWinSCP 是一个开源的 SFTP 客户端。此目的是允许在本地和远程计算机之间进行安全复制。在这里下载 WinSCP`https://winscp.net/`，保持默认设置并安装它。\n\
  \n![](img/image-GTS121.jpg)\n\n还有一个非常有趣的“Find（查找）”功能可以使用。它的作用与`find` 命令相同。\n\n![](img/image-G72NMH.jpg)\n\
  \n等待，等 the the the the the the the the the the the the the the the the the the the\
  \ the the the the the the the …\n\n注意：我们将在接下来的章节中使用此环境。\n\n## 18 有用的工具 II\n\n本章介绍了下载和安装软件的工具，以及监控进程和磁盘占用的工具。\n\
  \n最后一部分专门用于所有权。\n\n### apt-get\n\nLinux 没有像 Windows 那样的安装程序 (.exe)，它有我们称为包的东西。包是一个包含所有程序文件的压缩文件夹。格式为\
  \ `.deb`。它包含了安装程序所需的所有指令。\n\nLinux 程序很少独立运行。通常，它使用其他程序或其他程序碎片，称为库。我们说程序有依赖关系。\n\n\
  幸运的是，软件包系统非常智能。每个包都会指示它依赖于哪些包。这允许系统自动恢复依赖关系。\n\n所有包组合在一个被称为仓库的地方。这极大地简化了你的搜索。\n\n\
  默认情况下，当你安装 Ubuntu 时，它使用发行版的官方仓库。\n\n要获取你使用的仓库列表，输入以下命令：\n\n```bash\ngrep \"^#]\"\
  \ /etc/apt/sources.list\n```\n\n`deb http://ma.archive.ubuntu.com/ubuntu/ xenial\
  \ …`\n`deb http://ma.archive.ubuntu.com/ubuntu/ xenial …`\n\n### …\n\n\n\n\n例如，安装\
  \ filezilla ftp 客户端，可以使用如下 `apt-get install` 命令：\n\n```\n$ sudo apt-get install\
  \ filezilla\n```\n\n[sudo] 密码对于 jamal:\n\n读取软件包列表... 完成\n\n正在构建依赖树\n\n### …\n\n\
  您要继续吗？[Y/n] Y\n\n### …\n\n如果您想卸载一个包及其所有的依赖项，请使用 `apt-get autoremove` 命令：\n\n```bash\n\
  $ sudo apt-get autoremove filezilla\n```\n\n读取软件包列表... 完成\n\n### …\n\n以下软件包将被移除：\n\
  \nfilezilla filezilla-common libfilezilla0 libpugixml1v5 libwxbase3.0-0v5 libwxgtk3.0-0v5\n\
  \n### …\n\n您要继续吗？[Y/n] Y\n\n### …\n\n### ps\n\nLinux 上的 `ps` 命令是查看系统中运行进程最基础的命令之一。它提供了当前进程的快照，并包含如用户\
  \ ID、CPU 占用率、内存占用率、命令名称等详细信息。\n\n在不带任何选项的情况下使用 `ps` 时，它会向标准输出发送关于系统中当前至少两个进程的四项信息：\n\
  \n```bash\n$ ps\nPID TTY TIME CMD\n2294 pts/2 00:00:00 bash\n2412 pts/2 00:00:00\
  \ ps\n```\n\n`PID` 是进程 ID，它非常重要。\n\n`CMD` 是启动进程的命令名称。\n\n要获取关于系统中当前进程的更完整的信息，请使用以下命令：\n\
  \n```bash\n$ ps -aux | less\nUSER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\n\
  root 1 0.8 0.3 24944 5004 ? Ss 14:27 0:14 /sbin/init splash\nroot 2 0.0 0.0 0 0\
  \ ? S 14:27 0:00 [kthreadd]\nroot 4 0.0 0.0 0 0 ? S< 14:27 0:00 [kworker/0:0H]\n\
  ```\n\n### …\n\n`-a` 选项告诉 `ps` 列出系统中所有用户的进程。\n\n`-u` 选项用于提供有关每个进程的详细信息。\n\n`-x`\
  \ 选项向列表中添加没有控制终端的进程，例如守护进程（daemons），这些程序是在系统启动期间（即计算机启动）启动的程序，并在后台静默运行，直到被特定的事件或条件激活。\n\
  \n若要按 CPU 或内存占用率对进程进行排序，可以这样操作：\n\n```bash\n$ ps -aux --sort=-pcpu,+pmem | head\
  \ -5\nUSER PID %CPU %MEM VSZ RSS TTY STAT START TIME COMMAND\njamal 1512 9.9 8.2\
  \ 294740 126456 ? Ssl 14:30 3:53 compiz\n```\n\n### …\n\n要按进程 ID 显示进程，请使用 `-p` 选项并提供进程\
  \ ID（或逗号分隔的 ID）：\n\n```bash\n$ ps -up 1512\nUSER PID %CPU %MEM VSZ RSS TTY STAT\
  \ START TIME COMMAND\njamal 1512 8.3 8.0 291932 123752 ? Ssl 14:30 3:57 compiz\n\
  ```\n\n让我们创建一个 shell 脚本并使用 `ps` 命令监控它的执行，使用这些命令来设置并运行 shell 脚本（注意脚本进程 ID 为 2986）：\n\
  \n```bash\n~$ echo '#!/bin/bash\n> for i in {1..20}\n> do\n> sleep 1\n> done' >\
  \ shell-script.sh\n$ chmod 755 shell-script.sh\n$ ./shell-script.sh &\n```\n\n####\
  \ [1] 2986\n\n你可以这样用 `ps` 监控执行：\n\n```bash\n$ ps -p 2986\nPID TTY TIME CMD\n2986\
  \ pts/2 00:00:00 shell-script.sh\n```\n\n输出告诉你脚本一直在运行，等一会儿再重试看它是否完成：\n\n```bash\n\
  $ ps -p 2986\nPID TTY TIME CMD\n[1]+ Done ./shell-script.sh\n```\n\n同样，每个作为后台作业运行的命令（例如\
  \ `gzip`）都可以通过 `ps` 命令进行监控。\n\n### du\n\n`du` (Disk Usage) 命令用于检查文件和目录的磁盘占用信息。\n\
  \n例如，使用这种方法查找 `/home` 目录树及其每个子目录的磁盘占用摘要：\n\n```bash\n$ du -h /home | less\n32K /home/kevin\n\
  4.0K /home/jamal/.local/share/unity-settings-daemon\n4.0K /home/jamal/.local/share/evolution/mail/trash\n\
  8.0K /home/jamal/.local/share/evolution/mail\n```\n\n### …\n\n若只需获取 `/home` 的大小，使用\
  \ `-s` 或 `--summarize` 选项，它只会显示每个参数的总计：\n\n```bash\n$ du -sh /home\n18M /home\n\
  ```\n\n你还可以使用 `-c` 选项在最后一行获取总磁盘空间占用：\n\n```bash\n$ du -ch /home/jamal\n4.0K /home/jamal/.local/share/unity-settings-daemon\n\
  ```\n\n\n\n\n\n```bash\n$ grep '^UUID' /etc/fstab | while read line; do findfs $(\
  \ echo $line | cut -d' ' -f1 ); echo $line;done\n```\n\n`/dev/sda1`\n\n`UUID=8b9fe08d-70ad-41fc-b9e7-60f31c52050b\
  \ / ext4 …`\n\n`/dev/sda5`\n\n`UUID=2e36109c-4d9b-4f4f-b476-5c4f4a03e3a0 none swap\
  \ …`\n\n注意：作为一个练习，请尝试分析上一个示例中的命令（`findfs` 允许通过标签或 UUID 查找文件系统）。\n\n输出我们 `/dev/sda1`\
  \ 挂载在根目录 (`/`) 上。我们可以通过使用不带参数的 `mount` 命令来获取更多信息：\n\n```bash\n$ mount\n```\n\n```\n\
  sysfs on /sys type sysfs …\nproc on /proc type proc …\nudev on /dev type devtmpfs\
  \ …\ndevpts on /dev/pts type …\ntmpfs on /run type tmpfs …\n/dev/sda1 on / type\
  \ ext4 …\n…\n```\n\n`udev`, `tmpfs` 或 `sysfs` 文件系统是本书中不会讨论的高级主题，因此为了只显示挂载在 `/dev`\
  \ 的文件系统类型：\n\n```bash\n$ mount | grep '^/dev'\n```\n\n```\n/dev/sda1 on / type ext4\
  \ …\n```\n\n再次，这简单意味着第一个 SCSI 驱动器 (`sda1`) 挂载在根目录 `/` 上。\n\n为了练习挂载命令，我们将在 `/dev`\
  \ 目录中查找光驱设备并将其挂载到 `/media/VBox_GAs_5.2.1`：\n\n```bash\n$ pwd\n/home/jamal\n$ cd\
  \ /dev\n$ ls -l | grep -E '(cdrom|cd-rom)'\n```\n\n```\nlrwxrwxrwx 1 root root 3\
  \ Dec 25 22:05 cdrom -> sr0\ncrw-rw----+ 1 root cdrom 21, 0 Dec 25 22:05 sg0\nbrw-rw----+\
  \ 1 root cdrom 11, 0 Dec 25 22:05 sr0\n```\n\n`cdrom` 设备的名称为 `sr0`，如果该设备已经挂载，请输入以下命令卸载设备：\n\
  \n```bash\n$ sudo umount /dev/sr0\n```\n\n现在让我们创建挂载点，我们说的是 `/media/VBox_GAs_5.2.1`：\n\
  \n```bash\n$ cd /media\n/media$ ls -l\ntotal 0\n$ sudo mkdir VBox_GAs_5.2.1\n[sudo]\
  \ password for jamal:\n```\n\n然后我们使用 `mount` 命令：\n\n```bash\n$ sudo mount -t iso9660\
  \ /dev/sr0 /media/VBox_GAs_5.2.1\n```\n\n```\nmount: no medium found on /dev/sr0\n\
  ```\n\n发生了一个错误消息；它表示在 `/dev/sr0` 上没有找到介质，我们应该向设备设备插入光驱才能使挂载工作。（如果你以前这样做过，将不会收到此错误，直接跳过此部分）\n\
  \n在虚拟 Box 上，选择虚拟机并点击设置：\n\n![](img/image-V5N9OLZQ.jpg)\n\n点击光驱按钮并添加介质（iso 文件），然后点击确定。\n\
  \n再次尝试：\n\n```bash\n$ sudo mount -t iso9660 /dev/sr0 /media/VBox_GAs_5.2.1/\n```\n\
  \n```\nmount: /dev/sr0 is write-protected, mounting read-only\n```\n\n`-t` 选项用于指定特定的文件系统类型。\n\
  \n`iso9660` 参数描述了在 CD/DVD ROM 上使用的标准默认文件系统结构。\n\n要检查挂载情况，输入：\n\n```bash\n$ mount\
  \ | grep '^/dev'\n```\n\n```\n/dev/sda1 on / type ext4 (rw,relatime,errors=remount-ro,data=ordered)\n\
  /dev/sr0 on /media/jamal/VBox_GAs_5.2.1 type iso9660 (ro,relatime)\n```\n\n```bash\n\
  $ ls /media/VBox_GAs_5.2.1/\n```\n\n```\n32Bit AUTORUN.INF cert runasroot.sh VBoxLinuxAdditions.run\
  \ VBoxWindowsAdditions-amd64.exe VBoxWindowsAdditions-x86.exe\n64Bit autorun.sh\
  \ OS2 TRANS.TBL VBoxSolarisAdditions.pkg VBoxWindowsAdditions.exe\n```\n\n要卸载 `/dev/sr0`\
  \ 设备，使用 `umount` 命令：\n\n```bash\n$ sudo umount /dev/sr0\n$ mount | grep '^/dev'\n\
  ```\n\n```\n/dev/sda1 on / type ext4 …\n```\n\n### df 命令\n\n你也可以使用 `df` 命令显示哪些文件系统挂载在哪些点，并获取关于总使用的信息：\n\
  \n```bash\n$ df -hT\n```\n\n```\nFilesystem Type Size Used Avail Use% Mounted on\n\
  udev devtmpfs 689M 0 689M 0% /dev\ntmpfs tmpfs 142M 4.7M 137M 4% /run\n/dev/sda1\
  \ ext4 8.8G 4.2G 4.2G 51% /\ntmpfs tmpfs 708M 196K 708M 1% /dev/shm\ntmpfs tmpfs\
  \ 5.0M 4.0K 5.0M 1% /run/lock\ntmpfs tmpfs 708M 0 708M 0% /sys/fs/cgroup\n…\n```\n\
  \n`h` 选项（或 `--human-readable`）将输出转换为普通用户理解的形式。\n\n`T` 选项打印文件系统类型（`Type` 列）。\n\n\
  `df` 特别用于显示包含特定文件或目录的文件系统的可用磁盘空间：\n\n```bash\n$ df -h /home\n```\n\n```\nFilesystem\
  \ Size Used Avail Use% Mounted on\n/dev/sda1 8.8G 4.2G 4.2G 51% /\n```\n\n### 结束\n\
