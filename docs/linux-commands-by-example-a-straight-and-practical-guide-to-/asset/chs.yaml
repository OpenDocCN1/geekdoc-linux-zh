  \ Google 上搜索并让它工作。\n\n### 安装 Putty\n\nPutty 是一个 SSH 和 telnet 客户端，重点是将它安装在你的主机操作系统并远程连接到\
  \ Ubuntu 虚拟机。\n\n你可以在这里下载它`http://www.putty.org/`，安装非常简单，尽管尝试。\n\n要与 Ubuntu 建立 SSH\
  \ 客户端连接，你需要在 Ubuntu 上安装`openssh-server`，运行终端并输入以下命令：\n\n```bash\nsudo apt-get update\n\
