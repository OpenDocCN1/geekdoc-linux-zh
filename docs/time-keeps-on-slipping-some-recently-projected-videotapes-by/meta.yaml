    the ''haunted fishtank''. The aesthetic devices of alienation here concurrently
    evoke the ''alienist'', both in the sense of the early term for psychoanalyst,
    unearthing the solemnly displaced subtexts of historical events, and a medium,
    channelling another zeitgeist through making the ''wrong'' associations in this
    one. They also perform the haunting on the sensory level of ectoplasmic compositing,
    spooky coloured filters on archive stills, and spectral computer-generated forms
    flitting through those stills. If the image is the authenticator of historical
    doxa, it is also the privileged field of its perversion.


    ![](img/c390b40ca0eae7029921df1e9bf21b60_1_0.png)


    > > British air raid in Hagen, 15 March 1945


    # The Long Sleep of Reason


    The specifically German referents are not elided with their diffusion into the
    wider European (seldom American) context – although *Changing Time (Quickly)*
    and *Antiques of Advertising* montage debris of German material culture like old
    advertisements, the Heidegger-Arendt pathos, and Nazi athletic manoeuvres. *Why
    Are You Crying, Antonio?* reflects on epoch-defining phenomena for all of Europe
    like Chamberlain''s policy of appeasement, Mussolini''s ascent, and the immediate
    aftermath of ceasefire in WWI. They are read, however, through the markedly German
    Romantic tradition of the uncanny. This is coupled with the abiding influence
    of the Frankfurt School on Kluge, leading him to link Benjamin''s and Adorno''s
    theses on the Fascist aestheticisation of politics with a quixotic take on the
    legacy of irrationalism in German culture that another New German Cinema exponent,
    Werner Herzog, also found enticing. The faulty domestication of unreason is a
    point that Kluge systematically accents. Fascism''s pre-history is traced through
    the sequential tableaux of New Year''s Eve fireworks and Allied aerial bombardment
    that Kluge composites to look virtually the same and with the antiquated astrological
    diagrams annotated with significant dates in history sporting an illustration
    of Beethoven at the centre. A national predilection for mysticism is not really
    what''s at stake; Kluge is more interested in Germany''s reluctance to negotiate
    the implications of its recent past in the several decades after the war, and
    parodies this reticence by invoking the putative monsters of unreason that dwell
    on long into the desultory project of modernity. For Kluge, this will inexorably
    provoke a recognition of the persistence of Fascism, [return of the repressed]
    in social democratic West Germany, ramified by Cold War Realpolitik.


