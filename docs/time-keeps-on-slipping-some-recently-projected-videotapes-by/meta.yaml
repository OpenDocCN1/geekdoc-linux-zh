    accompanying Mussolini and his henchmen to the opera. The performance is Verdi''s
    Macbeth. The intertitles observe that Chamberlain and his cabinet were rationalists
    and did not believe in witches. Hence they had no way of apprehending the threat
    posed by the geomancers of Fascism and National Socialism. Neither did they have
    the historical perspective to decipher the harbingers of catastrophe, adopting
    the phlegmatic view that Hitler''s lebensraum was not too remote from the militant
    sectarianism of a colonially subdued Indian population. Later on, a voiceover
    hits on this historical caesura by putting it to us that the policy of appeasement
    ''either leads to peace, in which case it must be pursued consistently, but if
    it leads to war it was always wrong.'' Further exposition dwells fetishistically
    on archive images of Chamberlain and Hitler''s momentous summit in a charming
    rural hotel, calling on contemporary and post-War souvenir postcards to graphically
