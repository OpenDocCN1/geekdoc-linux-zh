    # ARTICLES


    # TIME KEEPS ON SLIPPING (SOME RECENTLY PROJECTED VIDEOTAPES BY ALEXANDER KLUGE)


    By Marina Vishmidt, 25 February 2004


    Three of Alexander Kluge''s 1988 videos, made for the German television programme
    ''10 vor 11'', were screened last month at Whitechapel Gallery. Here, Marina Vishmidt
    unravels their tangled collage of wartime imagery, advertising and philosophy,
    in relation to Kluge''s conception of an ''oppositional public sphere''


    ![](img/c390b40ca0eae7029921df1e9bf21b60_0_1.png)


    The New German Cinema. This is the New Criticism. ''We got there two years too
    late,'' Kluge apocryphally describes the Federal Republic of Germany''s riposte
    to the nouvelle vague, ''but we explored it thoroughly.'' It could be seen in
    context of that era''s spate of national minor cinemas, characterised by its insistence
    that social conditions were the proper stuff of celluloid magic. And that the
    image could and should speak its own mediation, shuffling genres and motifs, flagging
    up its own constructedness and by implication that of the social and productive
    relations that traversed it. Alexander Kluge has been practicing cinema since
    the early 1960s, but is now principally known for co-authoring *Public Sphere
    and Experience* with Oskar Negt in 1972 and his episode in the Baader Meinhof-themed
    portmanteau film *Germany in Autumn*. From the Benjaminian élan of arguing for
    a mass counter-cinema to materially usher in an oppositional public sphere, to
    the conspiratorial glee of late-night broadcasting slots on private German terrestrial
    channels twenty five years later, the modernist polymath (lawyer, critical theorist,
    sci-fi novelist, film and video maker) has been nothing if not thorough. The current
    Whitechapel film programme, curated by Ian White along the Gerhard Richter Atlas
    exhibition, showcased some of this work not long ago.


    These 1988 made-for-television short subjects encapsulate some of Kluge''s main
    concerns. What kinds of subjectivities are produced in the relation to history?
    Or, rather, the relation to historical images? What are the synapses between seemingly
    distinct eras and symbolic orders, and can their forced interaction make the imaginary
    explicit, the explicit absurd? And how crucial is a tiny, video-generated pointer
    in decoding archive footage? Yet besides just offering a speculative counter-history
    of Germany''s twentieth century, couched in the usual didactic instability between
    visuals and ideology, each film is a repository of buried code that develops furiously
    after one or many viewings. Given the variety of source material intricately pastiched,
    collating advertising, philosophy, wartime newsreels and the rudimentary charm
    of its stock video-art special effects, it would be strange if it were otherwise,
    though it''s quite strange already.


    > **Mnemonic Collage/Montage is Measurement** The three films, *Antiques of Advertising,
    Changing Time (Quickly)*, and *Why Are You Crying, Antonio?* are between 15 and
    25 minutes in length. They constitute a sort of polemical reverie on the German
    cultural groupmind, realised in a fitful and captivating mosaic of old and new
    media – archive footage, stills, text, and the wonky incursions of analogue video-manipulation
    technology. The idea of incompatible times, of constant repositioning of events
    and moods and just-in-time historicisation emerges from the visual content and
    structure – but also from the vying addresses of these media forms, already purposely
    anachronistic at the time the project first aired, and how much more so in the
    eternal present of the digitally malleable data manifold. This experience of haptic,
    troubled seeing underscores the impossibility of transparent processes of reading
    history: found footage is grievously interfered with, pointing to (at times literally,
    with a winsome arrow or circle) the intervention of human agency, creativity in
    the drone of received history. There is a Nietzschean whiff of ''any documentation
    is already evaluation'', particularly when it intends to document nothing but
    its own frisky commodity appeal (*Antiques of Advertising*). The problematisation
    of the visual relation to history, exposing the contingency of its reality effect,
    can seem old-hat as critique by now, so ultra-embedded in what we see around us
    as to almost go without saying. But if the critique was absorbed, it was also
    neutralised, and Kluge eschews the great postmodernist'
