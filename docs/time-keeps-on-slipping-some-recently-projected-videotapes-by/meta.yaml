- md: '## Time Keeps on Slipping (Some Recently Projected Videotapes by Alexander
    Kluge)

    Nazism was by any stretch transparent to itself: the hybrid fuel of technocratic
    rationality and paranoid occultism that propelled the killing machine was surprisingly
    resilient but finally doomed – like the zombie charisma of embalmed Lenin at his
    funeral in the old Soviet newsreel that takes up a large part of *Changing Time
    (Quickly)*. And the figure of the golem here might be a suggestive heuristic.
    These archive images, reanimated with Kluge''s dense artisanal craft and Marxist
    politics, are undead, but no more so than when they were judged to have life –
    it is only when we can seize upon the equivocal nature of their legibility, their
    authority, that lived experience can actually do something with them. The golem,
    too, was an avatar engendered by a marginalised community, Eastern and Central
    European shtetl Jews, as a gnostic disclosure of the hollowness of domination
    and an attempt to imaginatively purloin some of its power. This is telling, in
    light of the disruptive potential Kluge assigns to critical media practices, and
    the debunking of institutional narratives with alternate constellations of meaning
    that can in turn be used to transform subjective and collective reality. At any
    rate, there''s definitely a spectacle marching through Europe.


    ![](img/c390b40ca0eae7029921df1e9bf21b60_2_0.png)


    ## Prolepticon

    There are moments in the films where the spectacle of mass social mobilisation
    is pruned back into risibility, and popular genres are inoculated against their
    own schmaltz by the virus of commercialism. A fantastic sequence of Nazi-era athletes
    concluding their paroxysm of strength through joy by an artful and maybe spontaneous
    arrangement into a human swastika is one; there is also a lovely series of outtakes
    from a Nazi-era romantic film where the framespace of tender moments is never
    free of the graphic ministrations of 1930s ads for superior matches and luxury
    footwear.


    The Nazi athletes are also assailed by an ad for a children''s textbook company,
    highlighting the intimate traffic between Aryan doctrines of perfectibility and
    the self-improvement touted by education providers; whereas the amorous couple
    is reminded of the fungibility of human emotions with consumer items in capitalism.
    Kluge comments in the 1965 essay ''Word and Film'' that there is a risk in the
    kind of disjunctive cinematic/textual practice he projects of becoming a ''total
    work of art.'' Mobilising so many affects and discursive approaches to craft a
    contestational new cinematic language for him evokes parallelisms with a Nazi
    ''gesamtkunstwerke''. A cinema that neither replicates illusionist narrative forms
    nor founders in depoliticised ''deep structure'' abstraction must conceive of
    itself as consciousness-shaping implement, and Kluge identifies this as the bridge
    precariously spanning leftist and reactionary movements for social change.


    The Frankfurt School axiom that Nazism was the apotheosis of capitalism since
    it proved capable of mobilising the whole productive process (not just in the
    piecemeal fashion of liberal democracies), is allegorical here for desires that
    animate the production of revolutionary culture; but this axiom also prefigures
    contemporary discussions about affective labour and real subsumption of social
    productivity by the panoply of ''cognitive capitalisms'' and administrative models
    of governance. Kluge contended that there could be a counter-productivity, an
    ''oppositional public sphere'', but he seemed ambivalent about the prospect of
    this translating onto a grand scale, because then totalitarian impulses might
    establish themselves. This was the aporia that the terms ''oppositional'' and
    ''public'' tried to contain: as long as there are refractory strata in the field
    of constituted power, then they can operate to create critical ruptures in the
    tranquil circulation of consent. But oppositional is always inherently parasitic.
    What happens when the alibi of the public sphere is as etiolated as it is now,
    and counter-productivity has no choice but to operate immanently across the atomised
    zones of administrative functionality, often under deep cover in its listless
    interstices? The parasitism is now mediated differently, the stakes have shifted.


    In a 1998 interview with Hans Ulrich Obrist, Alexander Kluge remarked on ''the
    conservative interest in the public sphere'' coinciding with the moment of its
    relative obsolescence. We can conjecture perhaps that at this point for Kluge
    the strategic indispensability of an oppositional public sphere may have been
    due for a return to the drawing board, once the public sphere it was opposing
    no longer counted for much in the calculations of power.


    Alexander Kluge''s *Why Are You Crying, Antonio?*, *Antiques of Advertising* and
    *Changing Time (Quickly)* were screened at Whitechapel Gallery on 29 January 2004
    as part of the *Gerhard Richter Film Programme* curated by Ian White. The related
    *Gerhard Richter - Atlas* exhibition will be open until March 14, 2004.


    Alexander Kluge''s films for German television are available for rental or sale
    from Electronic Arts Intermix.'
