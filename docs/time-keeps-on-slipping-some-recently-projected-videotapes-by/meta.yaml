- md: '## TIME KEEPS ON SLIPPING (SOME RECENTLY PROJECTED VIDEOTAPES BY ALEXANDER
    KLUGE)

    By Marina Vishmidt, 25 February 2004


    Three of Alexander Kluge''s 1988 videos, made for the German television programme
    ''10 vor 11'', were screened last month at Whitechapel Gallery. Here, Marina Vishmidt
    unravels their tangled collage of wartime imagery, advertising and philosophy,
    in relation to Kluge''s conception of an ''oppositional public sphere''.


    The New German Cinema. This is the New Criticism. ''We got there two years too
    late,'' Kluge apocryphally describes the Federal Republic of Germany''s riposte
    to the nouvelle vague, ''but we explored it thoroughly.'' It could be seen in
    context of that era''s spate of national minor cinemas, characterised by its insistence
    that social conditions were the proper stuff of celluloid magic. And that the
    image could and should speak its own mediation, shuffling genres and motifs, flagging
    up its own constructedness and by implication that of the social and productive
    relations that traversed it. Alexander Kluge has been practicing cinema since
    the early 1960s, but is now principally known for co-authoring *Public Sphere
    and Experience* with Oskar Negt in 1972 and his episode in the Baader Meinhof-themed
    portmanteau film *Germany in Autumn*. From the Benjaminian élan of arguing for
    a mass counter-cinema to materially usher in an oppositional public sphere, to
    the conspiratorial glee of late-night broadcasting slots on private German terrestrial
    channels twenty five years later, the modernist polymath (lawyer, critical theorist,
    sci-fi novelist, film and video maker) has been nothing if not thorough. The current
    Whitechapel film programme, curated by Ian White along the Gerhard Richter Atlas
    exhibition, showcased some of this work not long ago. These 1988 made-for-television
    short subjects encapsulate some of Kluge''s main concerns. What kinds of subjectivities
    are produced in the relation to history? Or, rather, the relation to historical
    images? What are the synapses between seemingly distinct eras and symbolic orders,
    and can their forced interaction make the imaginary explicit, the explicit absurd?
    And how crucial is a tiny, video-generated pointer in decoding archive footage?
    Yet besides just offering a speculative counter-history of Germany''s twentieth
    century, couched in the usual didactic instability between visuals and ideology,
    each film is a repository of buried code that develops furiously after one or
    many viewings. Given the variety of source material intricately pastiched, collating
    advertising, philosophy, wartime newsreels and the rudimentary charm of its stock
    video-art special effects, it would be strange if it were otherwise, though it''s
    quite strange already.


    > **Mnemonic Collage/Montage is Measurement**


    The three films, *Antiques of Advertising, Changing Time (Quickly)*, and *Why
    Are You Crying, Antonio?* are between 15 and 25 minutes in length. They constitute
    a sort of polemical reverie on the German cultural groupmind, realised in a fitful
    and captivating mosaic of old and new media – archive footage, stills, text, and
    the wonky incursions of analogue video-manipulation technology. The idea of incompatible
    times, of constant repositioning of events and moods and just-in-time historicisation
    emerges from the visual content and structure – but also from the vying addresses
    of these media forms, already purposely anachronistic at the time the project
    first aired, and how much more so in the eternal present of the digitally malleable
    data manifold. This experience of haptic, troubled seeing underscores the impossibility
    of transparent processes of reading history: found footage is grievously interfered
    with, pointing to (at times literally, with a winsome arrow or circle) the intervention
    of human agency, creativity in the drone of received history. There is a Nietzschean
    whiff of ''any documentation is already evaluation'', particularly when it intends
    to document nothing but its own frisky commodity appeal (*Antiques of Advertising*).
    The problematisation of the visual relation to history, exposing the contingency
    of its reality effect, can seem old-hat as critique by now, so ultra-embedded
    in what we see around us as to almost go without saying. But if the critique was
    absorbed, it was also neutralised, and Kluge eschews the great postmodernist levelling
    of image truth-claims that finishes by shining the instruments of domination.
    The juxtaposition of unlikely timeframes and image formats doesn''t flatten, it
    proliferates other possibilities of memory and experience. There is a sequence
    in *Changing Time (Quickly)*, where a group of contemporary German chic intellectual
    females are grouped around a table on New Year''s Eve, tipsily trying to remember
    the lyrics to Beethoven''s *Ode to Joy*. Their dogged but absent-minded efforts
    might be a small emblem of the re-appropriations that high culture is prey to,
    with the grandiloquent paean to nationalist emotion later shown performed by a
    Japanese choir numbering in the thousands. This might just seem incongruous at
    first, until you consider the fatally entwined histories of the two countries.
    Kluge''s hatchet job on the historical record also utilises spiritualist techniques
    to dissolve time, signalling his serious approach to the old cognomen of TV as
    the ''haunted fishtank''. The aesthetic devices of alienation here concurrently
    evoke the ''alienist'', both in the sense of the early term for psychoanalyst,
    unearthing the solemnly displaced subtexts of historical events, and a medium,
    channelling another zeitgeist through making the ''wrong'' associations in this
    one. They also perform the haunting on the sensory level of ectoplasmic compositing,
    spooky coloured filters on archive stills, and spectral computer-generated forms
    flitting through those stills. If the image is the authenticator of historical
    doxa, it is also the privileged field of its perversion.


    > > British air raid in Hagen, 15 March 1945


    ### The Long Sleep of Reason

    The specifically German referents are not elided with their diffusion into the
    wider European (seldom American) context – although *Changing Time (Quickly)*
    and *Antiques of Advertising* montage debris of German material culture like old
    advertisements, the Heidegger-Arendt pathos, and Nazi athletic manoeuvres. *Why
    Are You Crying, Antonio?* reflects on epoch-defining phenomena for all of Europe
    like Chamberlain''s policy of appeasement, Mussolini''s ascent, and the immediate
    aftermath of ceasefire in WWI. They are read, however, through the markedly German
    Romantic tradition of the uncanny. This is coupled with the abiding influence
    of the Frankfurt School on Kluge, leading him to link Benjamin''s and Adorno''s
    theses on the Fascist aestheticisation of politics with a quixotic take on the
    legacy of irrationalism in German culture that another New German Cinema exponent,
    Werner Herzog, also found enticing. The faulty domestication of unreason is a
    point that Kluge systematically accents. Fascism''s pre-history is traced through
    the sequential tableaux of New Year''s Eve fireworks and Allied aerial bombardment
    that Kluge composites to look virtually the same and with the antiquated astrological
    diagrams annotated with significant dates in history sporting an illustration
    of Beethoven at the centre. A national predilection for mysticism is not really
    what''s at stake; Kluge is more interested in Germany''s reluctance to negotiate
    the implications of its recent past in the several decades after the war, and
    parodies this reticence by invoking the putative monsters of unreason that dwell
    on long into the desultory project of modernity. For Kluge, this will inexorably
    provoke a recognition of the persistence of Fascism, [return of the repressed]
    in social democratic West Germany, ramified by Cold War Realpolitik. *Why Are
    You Crying, Antonio?* sees Chamberlain on a peace-brokering trip to Italy, accompanying
    Mussolini and his henchmen to the opera. The performance is Verdi''s Macbeth.
    The intertitles observe that Chamberlain and his cabinet were rationalists and
    did not believe in witches. Hence they had no way of apprehending the threat posed
    by the geomancers of Fascism and National Socialism. Neither did they have the
    historical perspective to decipher the harbingers of catastrophe, adopting the
    phlegmatic view that Hitler''s lebensraum was not too remote from the militant
    sectarianism of a colonially subdued Indian population. Later on, a voiceover
    hits on this historical caesura by putting it to us that the policy of appeasement
    ''either leads to peace, in which case it must be pursued consistently, but if
    it leads to war it was always wrong.'' Further exposition dwells fetishistically
    on archive images of Chamberlain and Hitler''s momentous summit in a charming
    rural hotel, calling on contemporary and post-War souvenir postcards to graphically
    map their tryst. If Chamberlain didn''t understand what he was getting into, neither'
