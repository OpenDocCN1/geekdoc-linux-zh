    # Reset NVRAM settings


    UEFI, like BIOS, has access protection mechanisms, including passwords for entering
    settings. We also know that in order to reset the settings in the computer BIOS,
    you need to disconnect or remove the small battery that is located on the motherboard.
    After this procedure, all the settings are canceled, including the set passwords.
    For UEFI technology, things are different.


    If the user has forgotten the password for entering the UEFI settings, then there
    are several ways to reset it:


    +   a) One way is to use a special code or "jumper" that can reset the password.
    These codes are usually provided by the motherboard manufacturer and can be found
    in the user manual or on the manufacturer''s website.

    b) Another way is to reset the UEFI settings to factory values. This can be done,
    example, through the UEFI menu or using a special button on the motherboard (if
    any). However, note that this will remove all UEFI settings, including boot order
    and other user settings.

    c) Some motherboards may have a special switch or jumper that allows you to reset
    the UEFI settings to factory defaults. The user manual or manufacturer''s website
    should contain information about where this switch is located and how to use it.'
