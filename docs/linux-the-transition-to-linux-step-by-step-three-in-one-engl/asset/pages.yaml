    **Описание команды chmod**

    Команда chmod используется в Linux для изменения прав доступа к файлам и папкам.
    Права доступа в Linux могут быть разделены на три группы: права доступа для владельца
    файла, группы пользователей и всех остальных пользователей.


    Синтаксис команды chmod выглядит следующим образом:


    ```

    chmod [опции] [режим доступа] [имя файла или директории],

    ```


    где **опции** - это дополнительные параметры команды, **режим доступа** - это
    новые права доступа, которые вы хотите установить, **имя файла или директории**
    - это имя файла или папки, права которой вы хотите изменить.'
