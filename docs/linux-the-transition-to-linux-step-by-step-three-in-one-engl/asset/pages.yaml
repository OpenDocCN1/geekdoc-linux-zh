    # EN II.2.2 Device Drivers


    A driver is a program that allows the operating system to interact with devices
    or software components. The driver translates operating system requests into a
    language that a specific device or component can understand, and passes them the
    appropriate commands.


    Drivers play an important role in the operation of a computer and other devices,
    without them the operating system will not be able to communicate or "talk" with
    connected devices, will not be able to manage them and use their functionality.
    For example, there are drivers for printers, scanners, sound cards, video cards,
    network cards and other devices. It is necessary to know that each driver is designed
    for a specific device and operating system, and it must be installed on a computer
    or device in order for this device to work correctly, as planned.


