    à la place du BIOS pour profiter de ce qu''il offre.


    # FR II.2 Logiciel système


    Les logiciels système sont les programmes qui permettent aux autres programmes
    d''un système informatique d''interagir avec les programmes de base et avec le
    matériel. Disons qu''il s''agit du logiciel principal (software) de l''objet qu''il''incarne.
    Nous parlons ici des logiciels suivants: un système d''exploitation pour un ordinateur
    et un pilote (il s''agit d''un programme spécifique chargé d''interagir avec des
    périphériques spécifiques) pour différents appareils informatiques, compris les
    périphériques.


    # FR II.2.1 Système d''exploitation


    En termes simples, on peut dire que le système d''exploitation (SE) est un programme
    qui vous permet d''entrer dans le dialogue avec l''ordinateur. Il s''agit d''un
    ensemble de programmes conçus pour gérer le processus de traitement de l''information
    dans une machine informatique électronique'
