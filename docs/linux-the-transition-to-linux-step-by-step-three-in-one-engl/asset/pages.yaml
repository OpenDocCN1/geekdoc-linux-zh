    Donc, la différence entre «man» et «help» est que «man» fournit une aide détaillée
    sur la commande externe, tandis que «help» est utilisé pour obtenir de brèves
    informations sur les commandes Shell intégrées.


    La syntaxe pour obtenir l''aide avec la commande man est la suivante:


    ```

    man [options] nom_commande

    ```


    où les options sont les options supplémentaires pour la commande man qui peuvent
    empêcher la sortie de l''aide, et nom_commande est le nom de la commande pour
    laquelle l''aide doit être obtenue.


    La syntaxe pour obtenir l''aide avec la commande help dépend du Shell dans lequel
    travaillez. Si vous travaillez dans un Shell «Bash» standard, la syntaxe ressemblera
    à ceci:


    ```

    help [nom_commande]

    ```


    où nom_commande est le nom de la commande pour laquelle vous souhaitez obtenir
    de l''aide. Si aucun nom de commande n''est spécifié, la liste de toutes les commandes
    disponibles dans le Shell s''affiche.


    Si vous travaillez dans un Shell différent, la syntaxe peut être différente, mais
    la commande help est généralement utilisée pour obtenir de l''aide des commandes
    Shell intégrées.


