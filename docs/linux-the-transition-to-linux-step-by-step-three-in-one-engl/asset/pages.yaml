    # III.2 Описание некоторых базовых функций системы


    # II.2.1 Суперпользователь и его возможности в Linux


    Суперпользователь (англл. Superuser) — это учетная запись в операционной системе
    Linux с полными правами доступа ко всем ресурсам системы, включая системные файлы
    и директории, процессы и устройства.


    Суперпользователь имеет максимальные права на выполнение любых операций в системе,
    включая установку и удаление программ, изменение системных настроек, создание
    и удаление файлов и директорий, и т.д.


    В Linux суперльзователь обычно называется root, и он создается при установке операционной
    системы. Для того чтобы выполнять задачи с правами суперпользователя, пользователь
    должен войти в систему под учетной записью root, либо выполнить команду sudo для
    временного повышения своих прав до уровня суперпользователя.


    Использование суперпользователя может быть опасно, так как ошибки или неправильные
    команды могут привести к необратиму повреждению системы или утечке конфиденциальной
    информации.'
