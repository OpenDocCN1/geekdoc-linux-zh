    # III.2 Description of some basic functions of the system


    # III.2.1 Superuser and their capabilities in Linux


    Superuser is an account in the Linux operating system with full access rights
    to all system resources, including system files and directories, processes and
    devices.


    The superuser has maximum rights to perform any operations on the system, including
    installing and removing programs, changing system settings, creating and deleting
    files and directories.


    On Linux, the superuser is usually called root and is created when the operating
    system is installed. In order to perform tasks with superuser privileges, the
    user must be logged in as root, or use the sudo command to temporarily elevate
    their privileges to superuser.'
