    27. Pour redémarrer un service sous Linux, utilisez la commande systemctl restart.
    Par exemple, pour redémarrer un service nommé *httpd*, vous devez exécuter la
    commande **systemctl restart httpd**.


    28. Pour répertier les services en cours d''exécution Linux, utilisez la commande
    systemctl list-units --type=service --state=running.


    29. Pour répertier les utilisateurs sous Linux, utilisez **cat /etc/passwd | cut
    -d -f1**.


    30. Pour renommer un fichier sur la ligne de commande Linux, utilisez la commande
    mv. Par exemple, pour renommer le fichier *oldimia* en *newimia*, vous devez exécuter
    la commande suivante : **mv oldimia newimia**


    Cela renmera le fichier *oldimia* en *newimia*. Si le fichier *newimia* existe
    déjà, il sera remplacé par le fichier *oldimia*.


    31. Pour supprimer un fichier sur la ligne de commande Linux, utilisez la commande
    rm. Par exemple, pour supprimer le fichier *myfile.txt*, vous exécuterez la commande
    suivante :


    ```

    rm myfile.txt

    ```


    Cela supprimera le fichier *myfile.txt*. Si le fichier est protégé contre la suppression,
    vous devez utiliser l''option **-f** pour forcer la suppression du fichier :


    ```

    rm -f myfile.txt

    ```


    32. Pour supprimer un répertoire de la ligne de commande Linux, utilisez la commande
    rmdir. Cependant, pour supprimer un répertoire avec son contenu, vous devez exécuter
    la commande **rm** avec l''option **-r**. Par exemple, pour supprimer le répertoire
    *mydirectory* ainsi que tout son contenu, vous exécuterez la commande suivante
    :


    ```

    rm -r mydirectory

    ```


    Cela supprimera le répertoire *mydirectory* et tout son contenu.'
