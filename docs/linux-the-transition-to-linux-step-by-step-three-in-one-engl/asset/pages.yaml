    installer «Openoffice.org est `sudo dnf install openoffice`. Cependant, sur une
    distribution basée sur «Arch», nous rappelons qu''avant installation, il utilisera
    d''abord de mettre à jour la liste des packages disponibles sur votre système.
    Sous Ubuntu, nous écrira la commande: `sudo apt-get update` et en fin sur «Arch»,
    la commande sera: `sudo pacman -Syu`.


    Il est possible que vous demandiez pourquoi la ligne de commande est mentionnée
    dans ce chapitre où nous essayons d''aider les nouveaux utilisateurs à choisir
    un système d''exploitation parmi tant un pour un début de travail. En réalité,
    nous n''avons déjà dit aux précédents chapitres, la plupart des distributions
    Linux ont une interface graphique pour la gestion des paquets. Par exemple, GNOME
    a «GNOME Software», KDE a «Discover» et les distributions basées sur Arch Linux
    ont «Pamac». La plupart des nouveaux utilisateurs peuvent installer des applications
    sans problème en ouvrant la boutique d''applications, cherchant le logiciel souhaité
    et en l''installant.


    Cependant, nous recommandons vivement aux nouveaux utilisateurs de se limiter
    aux distributions utilisant «apt», soit «dnf», c''est-à-dire celles basées sur
    Ubuntu ou Fedora.'
