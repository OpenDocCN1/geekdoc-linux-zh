    FR I.5 Interface du système d''exploitation Astra Linux


    Astra Linux est également un système d''exploitation sécurisé russe basé sur Linux
    open source et destiné à être utilisé dans les organisations gouvernementales,
    militaires et commerciales travaillant avec des secrets d''État.


    Le système d''exploitation Astra Linux a été développé par RusBITech en 2008 et
    a reçu un certificat du FSTEC de Russie pour la conformité aux exigences de sécurité
    de l''information. Astra Linux est basé sur l''open source Debian et utilise son
    propre gestionnaire de packages pour gérer les logiciels.


    Astra Linux a plusieurs versions, dont «Standard », «Basic », «Security » et «Special
    ». Chaque version est conçue pour résoudre des problèmes spécifiques et possède
    ses propres caractéristiques et fonctionnalités.


    Astra Linux possède de nombreux mécanismes de sécurité intégrés, notamment un
    mécanisme anti-malware, un mécanisme de contrôle d''accès, un mécanisme de cryptage
    des données et d''autres. De plus, Astra Linux a la capacité de fonctionner avec
    des réseaux sécurisés, y compris des réseaux utilisant des outils de protection
    cryptographique.


    Il est important de noter que l''utilisation d''Astra Linux est obligatoire pour
    les organisations gouvernementales russes travaillant avec des secrets d''État,
    ainsi que pour les sous-traitants impliqués dans le développement et la maintenance
    de systèmes d''information avec des secrets d''État.


    Astra Linux est livré avec de nombreux logiciels installés par défaut. Certaines
    des applications les plus courantes que vous trouverez sur Astra Linux incluent
    :


    +   1. Navigateurs: Mozilla Firefox, Chromium.

    2. Applications bureautiques: LibreOffice.

    3. Multédia: VLC, Audacity, Clementine, K3b, KMix, gucvview, Qmmp, PulseAudio.

    4. Graphismes: éditeur de vecteurs Inkscape, Okular, Gwenview, KolourPaint, Blender,
    GIMP, Scan, Spectacle.'
