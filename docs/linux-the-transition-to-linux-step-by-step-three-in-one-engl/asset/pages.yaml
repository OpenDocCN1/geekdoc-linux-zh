    # RU I.4 Интерфейс системы ReactOS Linux


    ReactOS — это международный проект свободной и бесплатной операционной системы
    с открытым кодом, совместимой с приложениями и драйверами Windows (Windows NT
    версии 5.x и выше — Windows 2000 и далее), при этом не являющейся точным клоном
    Windows. Разработчики ReactOS сотрудничают с разработчиками Wine и MinGW. ** Wine
    — это свободное программное обеспечение, позволяющее пользователям UNIX-подобных
    операционных систем, например, GNU/Linux, Apple macOS и других UNIX-подобных с
    поддержкой архитектуры CPU x86, AMD64 (и других архитектур CPU при наличии совместимости
    с ними) многими незавершенными ( приложений) исполнять 16-, 32- и 64-битные приложения,
    в том числе игры, созданные исключительно для установленной Microsoft Windows,
    без ограничений при этом установленной Microsoft Windows.


    По состоянию на апрель 2021 года проект всё ещё находится на незавершённой стадии
    альфа-тестирования, но многие приложения'
