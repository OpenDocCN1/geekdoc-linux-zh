    actuels et des informations concernant, telles que le nom d''utilisateur, le terminal
    qu''ils utilisent, la date et l''heure de la dernière connexion.


    Pour savoir si un utilisateur est un administrateur, vous devez vérifier ses droits
    dans le système, par exemple, via la commande "id", qui affiche des informations
    sur l''utilisateur et ses groupes, ou vérifier les droits de superutilisateur
    (root) via la commande «sudo».


    > Différence entre **useradd** et **adduser**


    Les commandes **useradd** et **adduser** sont utilisées pour créer de nouveaux
    utilisateurs sur un système Linux, mais elles ont des fonctionnalités différentes.'
