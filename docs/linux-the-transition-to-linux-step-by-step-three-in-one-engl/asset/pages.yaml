    > RU I1.3 Интерфейс системы Linux Alt Edu


    ALT Linux – это российская операционная система, основанная на Linux и предназначенная
    для использования на рабочих станциях, серверах и встраиваемых устройствах.


    Она разрабатывается с 2001 года и является одной из самых популярных дистрибутивов
    Linux в России и странах бывшего СССР.'
  merge: -1
