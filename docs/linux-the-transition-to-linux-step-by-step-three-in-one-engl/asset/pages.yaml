    L''ordinateur par exemple, aura besoin de systèmes d''exploitation pour fonctionner.
    La question qu''on peut se poser est savoir quel système utiliser pour notre machine
    électronique?


    # Report entre l''ordinateur et le système d''exploitation


    Un ordinateur est un appareil électronique qui est conçu pour effectuer des tâches
    de traitement de données. Pour qu''un ordinateur fonctionner et exécuter des tâches,
    il a besoin d''un système d''exploitation'
  merge: -1
