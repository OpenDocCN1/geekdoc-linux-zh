- img_proc: true
  md: '# CHAPITRE III. COMMANDES POUR L''INTERFACE LIGNE DES COMMANDES LINUX


    La commande **useradd** est de niveau inférieur à **adduser** et vous permet de
    créer des utilisateurs avec des paramètres plus fins que l''UID (ID utilisateur),
    le GID (ID de groupe), le répertoire personnel et autres. Il ne crée pas de répertoire
    personnel par défaut et ne définit pas de mot de passe pour l''utilisateur.


    La commande **adduser** est de niveau supérieur et fournit un processus interactif
    pour créer un nouvel utilisateur. Il définit le répertoire personnel et définit
    un mot de passe pour l''utilisateur, si nécessaire. Il permet également de créer
    un utilisateur dans des groupes par défaut et d''effectuer des actions avancées.


    Ainsi, si un réglage plus fin des paramètres utilisateur est nécessaire, il est
    recommandé d''utiliser **useradd**. Si vous avez besoin de créer rapidement un
    nouvel utilisateur avec des paramètres minimaux, alors **adduser** peut être une
    option plus pratique.


    Il convient de noter que deux systèmes d''exploitation ne peuvent pas avoir différents
    utilitaires et programmes par défaut. Par exemple, certaines distributions Linux
    n''ont pas d''utilitaires pour travailler avec **git**, **curl**, **wget**, **nano**
    et d''autres programmes.


