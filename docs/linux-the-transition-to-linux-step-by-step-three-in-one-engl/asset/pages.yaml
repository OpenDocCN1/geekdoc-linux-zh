    Микрограмма (Firmware) — программное обеспечение, которое находится на устройствах
    ввода-вывода, таких как клавиатура, мышь, принтер, сканер, модем и т.д. Функциональность
    устройств ввода-вывода зависит от этого программного обеспечения.


    Драйверы устройств (Device drivers) — программы, которые устанавливаются в операционной
    системе и позволяют ей взаимодействовать с устройствами ввода-вывода, например,'
