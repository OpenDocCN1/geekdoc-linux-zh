    # FR I.4 Interface du système ReactOS Linux


    ReactOS est un projet international de système d''exploitation gratuit et open
    source compatible avec les applications et les pilotes Windows (Windows NT version
    5.x et supérieur - Windows 2000 et supérieur), sans être un clone exact de Windows.
    Les développeurs ReactOS collaborent avec les développeurs Wine et MinGW. Wine
    est un logiciel libre qui permet aux utilisateurs de systèmes d''exploitation
    de type UNIX, comme GNU/Linux, Apple macOS et d''autres systèmes de type UNIX
    prenant en charge les architectures de processeur x86, AMD64 (et d''autres architectures
    de processeur si les applications qu''ils exécutent) pour exécuter des applications
    16, 32 bits et 64 bits, y compris des jeux, créés exclusivement pour Microsoft
    Windows sans avoir installé Windows.


    Depuis avril 2021, le projet est toujours dans une phase de test alpha inachevée,
    mais de nombreuses applications Windows (par exemple Adobe'
