    # Relationship between a computer and an operating system


    A computer is an electronic device that is designed to perform data processing
    tasks. In order to function and perform tasks, a computer needs an operating system
    which is software that manages the hardware and software resources of the computer.


    The operating system is a program that is installed on a computer and which allows
    the user to interact with the computer. It provides a user interface, manages
    input and output devices such as keyboard, mouse and monitor, and manages files
    and folders on the hard disk or other disks.'
