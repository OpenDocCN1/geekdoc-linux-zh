    **Le rôle de la simplification des tâches:** l''interface graphique peut automatiser
    de nombreuses tâches quotidiennes telles que copier et coller du texte, glisser-déposer
    des fichiers et des dossiers, redimensionner des fenêtres, etc. cela permet aux
    utilisateurs d''utiliser leur temps plus efficacement et réduit les risques d''erreurs.


    **Améliorer l''accessibilité:** l''interface utilisateur graphique peut rendre
    le système d''exploitation et les applications plus accessibles aux personnes
    handicapées, par exemple en permettant de modifier la taille et la couleur des
    éléments de l''interface, d''utiliser des commandes vocales, etc.'
