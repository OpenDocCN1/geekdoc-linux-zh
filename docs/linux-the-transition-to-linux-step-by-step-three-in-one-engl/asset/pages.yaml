    # RU II.2.2 Драйверы


    Драйвер (англ. driver) — это программа, которая позволяет операционной системе
    взаимодействовать с устройствами или программными компонентами.  Драйвер переводит
    запросы операционной системы на язык, который может понимать конкретное устройство
    или компонент, и передает им соответствующие команды.


    Драйверы играют важную роль в работе компьютера и других устройств, так как ни
    одна операционная система не сможет общаться или «разговаривать» с подключениями
    устройствами, не будет иметь управлять ими и использовать их функциональные возможности.
    Например, существуют драйверы для работы принтеров, сканеров, звуковых карт, видеокарт,
    сетевых карт и других устройств. Необходимо знать, что каждый драйвер разработан
    для конкретного устройства и операционной системы, и он должен быть установлен
    на компьютере или на устройстве для того, чтобы это устройство работало правильно,
    как и было запланировано.'
