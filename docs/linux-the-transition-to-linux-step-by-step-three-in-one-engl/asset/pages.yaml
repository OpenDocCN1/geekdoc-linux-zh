- img_proc: true
  md: 'ALT Linux имеет свой собственный пакетный менеджер RPM (это бесплатная система
    управления пакетами с открытым исходным кодом. Название RPM относится к формату
    файла “.rpm” для дистрибутивов Linux), который обеспечивает удобное управление
    установкой и обновлением программного обеспечения.


    ALT Linux имеет несколько вер, каждая из которых предназначена для определенной
    цели: ALT Workstation для рабочих станций, ALT Server для серверов, ALT Education
    для образовательных учреждений и т.д.


    ![](img/f7d3edbe212287bdf40c9582a51bff25_56_0.png)


    Рис. 1.28 Выбор типа системы ALT Linux для запуска


    ALT Linux также имеет несколько различных вариантов интерфейса пользователя, таких
    как Frames, Xfce, GNOME, KDE, LXDE и другие. В зависимости от версии ядра Linux
    может использоваться различная версия ядра Linux. Кроме того, ALT Linux поддерживает
    множество языков, включая русский, казахский, английский и др.


    Один из особенностей ALT Linux является ее открытость и возможность участия в
    разработке. Пользователи могут вносить вклад в проект, сообщать об ошибках, улучшать
    документацию и т.д.'
