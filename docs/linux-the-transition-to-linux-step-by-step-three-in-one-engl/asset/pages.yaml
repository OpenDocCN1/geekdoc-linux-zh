    # Solution de l''exercice 5


    +   a) Ouvrez le terminal et exécutez la commande « top ». Cela vous permettra
    de voir la liste des processus triés par utilisation du processeur. En haut de
    l''écran, vous verrez des informations générales sur le système et en bas, une
    liste de processus.


    +   b) Pour voir uniquement les processus qui utilisent le plupart du temps processeur,
    appuyez sur la touche « Shift » + P ». Cela basculera le mode pour trier les processus
    en fonction de l''utilisation du processeur.


    +   c) Sélectionnez le processus qui utilise le plus de temps CPU et mémorisez
    son PID (ID de processus). Pour quitter « top », appuyez sur le bouton « q ».


    +   d) Exécutez la commande « ps -p <PID> -o %cpu,%mem,cmd ». Cela affichera des
    informations sur le processus, y compris le pourcentage d''utilisation du processeur,
    le pourcentage d''utilisation de la mémoire et la commande exécutée par le processus.


    Par exemple, si un processus avec PID 3002 utilise le plupart du temps du processeur,
    alors il faut exécuter la commande:


    ```

    ps -p 3002 -o %cpu,%mem,cmd

    ```'
