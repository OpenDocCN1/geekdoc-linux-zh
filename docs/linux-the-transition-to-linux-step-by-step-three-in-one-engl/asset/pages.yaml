  md: '# LA TRANSITION VERS LINUX ÉTAP PAR ÉT: TROIS EN UN


    a Vérifiez que le service est installé et configuré pour démarrer au démarrage
    du système. En règle générale, les services sont installés via un gestionnaire
    de packages et configurés pour démarrer automatiquement au démarrage.


    b) Ouvrez un terminal et exécutez `sudo service <service_name> start`, en remplaçant
    `<service_name>` par le nom du service que vous souhaitez démarrer. Par exemple,
    pour démarrer le service Apache sous Ubuntu, utilisez la commande `sudo service
    apache2 start`.


    c) Pour vérifier que le service est en cours d''exécution, exécutez la commande
    `sudo service <service_name> status`. Il affichera l''état actuel du service,
    y compris s''il est en cours d''exécution ou non.


    d) Si vous souhaitez que le service redmarre automatiquement à chaque démarrage
    du système, exécutez la commande `sudo systemctl enable <service_name>`.


    e) Pour arrêter le service, exécutez la commande `sudo service <service_name>
    stop`.


    f) Si vous souhaitez que le service redémarre automatiquement en cas d''erreur,
    exécutez `sudo systemctl enable --now <service_name>`.


    En plus de la commande `service`, certaines distributions Linux peuvent également
    utiliser `systemctl`, `initctl`, `rc-service` et autres. La syntaxe et l''utilisation
