    autres utilisateurs pour tous les fichiers et dossiers de répertoire/path/to /
    dir.


    # **Décryptage du code 755 – comment le faire ?**


    La valeur 755 pour chmod sous forme numérique est généralement utilisée pour définir
    des autorisations pour les répertoires et les fichiers exécutables sous Linux.
    Cela signifie que quoi:


    +   - 7: autorisations pour le propriétaire du fichier-lecture (4) + écriture
    (2) + exécution (1)


    +   - 5: autorisations pour le groupe d''utilisateurs-lecture (4) + exécution
    (1)


    +   - 5: autorisations pour tous les autres utilisateurs-lecture (4) + exécution
    (1)


    Par conséquent, les autorisations du propriétaire du fichier sont définies sur
    lecture, écriture et exécution, tandis que celles du groupe et de tous les autres
    utilisateurs sont définies sur lecture et exécution uniquement.'
