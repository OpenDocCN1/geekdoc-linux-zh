  md: '# LA TRANSITION VERS LINUX ÉTAPE PAR ÉTAPE: TROIS EN UN


    générale, une console est un clavier physique et un moniteur connectés directement
    à un serveur ou à un ordinateur.


    Un terminal est une application logicielle qui émule une console et permet à l''utilisateur
    d''interagir avec le système d''exploitation en mode texte. Le terminal est généralement
    lancé dans l''interface graphique du système d''exploitation, et plusieurs fenêtres
    de terminal peuvent être ouvertes dans la même session.


    Ainsi, la différence entre une console et un terminal est que la console est un
    périphérique physique tandis que le terminal est une application logicielle. Cependant,
    dans l''usage quotidien, ces termes peuvent être utilisés de manière interchangeable
    car ils donnent à l''utilisateur l''accès à la ligne de commande et permettent
    à l''utilisateur d''interagir avec le système d''exploitation en mode texte.


