    # Solution de l''exercice 6


    Pour faire cela, nous pouvons utiliser la commande crontab-e pour modifier le
    fichier de tâches crontab, et ajouter la ligne suivante:


    ```

    0 16 *** /path/to/script.sh

    ```


    Cette ligne signifie que le script script.sh sera lancé tous les jours à 16h00.
    Analysons plus en détail les valeurs des paramètres:


    +   * 0 - minutes (dans ce cas, 0 minutes)

    * 16 - heures (dans ce cas, 16 heures)

    * * - jours du mois (tous les jours)

    * * - mois (n''importe quel mois)

    * * - jours de la semaine (n''importe quel jour de la semaine)


    Notez que pour modifier le fichier de tâches crontab, vous devez disposer des
    privilèges d''administrateur (sudo).


