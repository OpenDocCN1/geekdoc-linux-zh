    # 1.4 ReactOS Linux system interface


    ReactOS is an international project of a free and open source operating system
    that is compatible with Windows applications and drivers (Windows NT version 5.x
    and higher - Windows 2000 and later), while not being an exact clone of Windows.
    The ReactOS developers are collaborating with the Wine and MinGW developers. Wine
    is free software that allows users of UNIX-like operating systems such as GNU/Linux,
    Apple macOS and other UNIX-like operating systems with x86, AMD64 (and other CPU
    architectures) running applications that are compatible with them) run 16-bit,
    32-bit and 64-bit applications, including games created exclusively for Microsoft
    Windows, without having Microsoft Windows installed.


    As of April 2021, the project is still in an unfinished testing phase, but many
    Windows applications (e.g. Adobe Reader 6.0, Apache OpenOffice.) are already running
    on the system.


    ReactOS partially copies the features of the Windows API and has a versioned to
    the AMD64 architecture.


    In order to have a visual representation of ReactOS and these different user interfaces,
    it is important to analyze the following figures: from 1.50 to 1.52.'
