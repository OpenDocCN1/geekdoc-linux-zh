    # EN III.1.2 Comparison of the file system structure between Windows and Linux


    The main difference (see Table 3.2) of the file system from Linux from the file
    system in Windows is that Linux uses a hierarchical file system in which all files
    and folders are arranged in a tree structure, starting from the root folder "/.
    On Windows, the file system has a flatter structure and is divided into logical
    drives (eg C.; D.; etc.).


    In addition, Linux has a uniform approach to naming files and folders, based on
    the use of characters that define their role and purpose. On Windows, file and
    folder naming can be less structured and often depends on user preference.


    Also in Linux, each folder has its own unique identifier (inode), which allows
    the system to track the metadata of files and folders, including access rights,
    owner, and creation or modification time. Windows uses the file attribute system
    for this purpose.


    Finally, Linux uses the division of file and folder permissions between users
    and user groups, which provides a more flexible and secure approach'
