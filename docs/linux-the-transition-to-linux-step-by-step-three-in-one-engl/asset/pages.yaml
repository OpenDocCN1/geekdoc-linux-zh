    # III.1.2 Comparaison de la structure du système de fichiers Windows et Linux


    La principale différence (tableau 3.2) entre le système de fichiers Linux et le
    système de fichiers Windows est que Linux utilise une structure de fichiers hiérarchique
    dans laquelle les fichiers et dossiers sont organisés dans une structure arbocente,
    à partir du dossier racine « ». Windows, le système de fichiers a une structure
    plus plate et est divisé en lecteurs logiques (par exemple C.; D; etc., etc.).


    De plus, Linux a une approche uniforme pour nommer les fichiers et les dossiers,
    basée sur l''utilisation de caractères qui définissent leur rôle et leur objectif.
    Windows, la dénomination des fichiers et des peut est moins restrictive et dépend
    souvent des préférences de l''utilisateur.


    Tous sous Linux, chaque dossier a son propre identifiant unique (inode), qui permet
    de suivre les métadonnées des fichiers et des dossiers, y compris les droits d''accès,
    le propriétaire et l''heure de création ou de modification. Windows utilise le
    système d''attribution de fichier à cet fin.


    Enfin, Linux utilise la division des autorisations de fichiers et de dossiers
    entre les utilisateurs et les groupes d''utilisateurs, ce qui offre une approche
    plus flexible et sécurisée de la gestion des fichiers et des dossiers. Windows
    dispose également d''un système d''autorisations, mais il n''est pas aussi flexible
    et ne permet pas la même granularité des paramètres d''accès aux fichiers et dossiers
    que nous Linux.


    # Tableau 3.2 – Différences dans la structure de fichiers Windows et Linux


