    # Réinitialiser les paramètres NVRAM


    UEFI, comme le BIOS, dispose de mécanismes de protection d''accès, y compris des
    mots de passe pour entrer les paramètres. Nous savons également que pour réinitialiser
    les paramètres du BIOS de l''ordinateur, vous devez déconnecter ou retirer la
    petite batterie située sur la carte mère. Après cette procédure, tous les paramètres
    définis sont annulés, y compris les mots de passe définis. Pour la technologie
    UEFI, les choses sont différentes.


    Si l''utilisateur a oublié le mot de passe pour accéder aux paramètres UEFI, il
    existe plusieurs façons de réinitialiser :


    +   a) Une façon consiste à utiliser un code spécial ou « jumper » qui peut réinitialiser
    le mot de passe. Ces codes sont généralement fournis par le fabricant de la carte
    mère et peuvent être trouvés dans le manuel de l''utilisateur ou sur le site Web
    du fabricant.

    b) Une autre méthode consiste à réinitialiser les paramètres UEFI aux valeurs
    d''usine. Cela peut être fait, par exemple, par le menu des paramètres UEFI ou
    en utilisant un bouton spécial sur la carte mère (le cas échéant). Cependant,
    notez que cela supprimera tous les paramètres UEFI, y compris l''ordre de démarrage
    et d''autres paramètres utilisateur.


