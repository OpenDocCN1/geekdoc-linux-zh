    37. La ligne de commande `sh-4.4$` est une invite du shell permettant d''entrer
    des commandes. L''apparition de cette ligne après l''exécution réussie de la commande
    «su » signifie que vous êtes connecté en tant que superutilisateur (root).


    En analysant une chaîne, on peut distinguer plusieurs de ses éléments :


    > « sh » est le nom du shell de ligne de commande à utiliser, dans ce cas le «Bourne
    shell`.


    > « 4.4 » est un caractère délimiteur qui indique que la chaîne est une invite
    du shell pour taper des commandes.


    Ainsi, la chaîne « sh-4.4$` signifie que vous êtes dans le shell Bourne version
    4.4 et que vous pouvez entrer des commandes en tant que root. Vous pouvez utiliser
    ce shell pour effectuer diverses opérations et contrôler le système. Pour quitter
    le shell, tapez «exit» et appuyez sur Enter.


