    Pour planifier une tâche de suppression de tous les fichiers temporaires du dossier
    «tmp» tous les vendredis à 17h00 sous Linux, vous pouvez utiliser l''utilitaire
    cron. Pour le faire, suivez ces étapes:


    +   a) Ouvrez un terminal et entrez la commande «crontab -e » pour éditer le fichier
    cron.


    +   b) Ajoutez la ligne suivante à la fin du fichier cron :


    ```

    0 17 * * 5 rm /tmp/*

    ```


    Cette ligne signifie que le travail s''exécutera à 17h00 tous les vendredis (5ème
    jour de la semaine) et supprimera tous les fichiers du dossier /tmp.


    Une description de commande plus spécifique:


    +   - « 0 » est la valeur des minutes de l''heure à laquelle la tâche doit être
    lancée. Ici, "0" signifie que la tâche s''exécutera exactement au début de chaque
    heure.


    +   - « 17 » est la valeur des heures de la journée où la tâche doit être démarrée.
    Ici, "17" signifie que la tâche s''exécutera à 17h00.


    +   - « * » est un astérisque qui représente la valeur des jours du mois, des
    mois et des jours de la semaine. Ici un astérisque est utilisé pour exécuter le
    travail n''importe quel jour du mois, et n''importe quel mois si cela correspond
    à la condition d''exécution le jour de la semaine spécifié.


    +   - « 5 » est la valeur du jour de la semaine où la tâche doit être démarrée.
    Ici, "5" signifie que le travail s''exécutera le vendredi.


    +   - « f » est un paramètre de la commande « rm », qui signifie « forcer » (de
    force). Il s''agit d''un paramètre qui indique à la commande d''ignorer les erreurs
    pouvant survenir lors de la suppression de fichiers dans le dossier /tmp. Si ce
    paramètre n''est pas spécifié, la'
