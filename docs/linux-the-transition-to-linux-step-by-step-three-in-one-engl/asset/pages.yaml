    La séquence des étapes de l''action de l''ordinateur après l''action de l''utilisateur
    avec le clavier (voir tableau 2.7):


    Lorsqu''un utilisateur entre une commande avec le clavier, cette commande est
    envoyée à l''unité centrale de traitement (CPU) de l''ordinateur pour traitement.
    La CPU interprète la commande, exécute les actions nécessaires et renvoie le résultat
    à l''utilisateur.


    La commande est entrée sous forme d''une séquence de caractères sur le clavier,
    qui sont convertis en signaux électriques et transmis par le bus de données aux
    ports d''entrée de la CPU. Le CPU reçoit la commande et commence à traiter en
    utilisant les instructions de la mémoire vive (RAM) de l''ordinateur.


    La CPU décode l''instruction et effectue les opérations nécessaires à l''aide
    de ses blocs arithmétiques et logiques. Lors de l''exécution d''une instruction,
    le CPU peut accéder à d''autres composants de l''ordinateur, tels que le disque
    dur ou le processeur graphique.


    Lorsque la commande est terminée, les résultats peuvent être réécrits sur l''écran
    de l''ordinateur. Dans certains cas, les résultats peuvent également être transférés
    vers d''autres appareils tels qu''une imprimante ou un réseau.


    Tableau 2.7 – Interaction entre les principaux composants d''un ordinateur


    | Étapes | Les processus |

