  md: '# CHAPTER II. ANALOGUE SOFTWARE OF WINDOWS FOR LINUX

    II.1.1 Description of some examples of basic software


    The BIOS (Basic Input/Output System) is one example of basic software that consists
    of a set of programs stored on the computer''s motherboard and executed when it
    starts up. They are responsible for the initial setup, checking the hardware,
    and starting the operating system. This is the very first program that runs when
    you turn on your computer (system unit, laptop, ...).


    Some of the important information found in the BIOS includes:


