    NUL, CON, PRN, COM1-9, LPT1-9 – are special devices in the Windows operating system
    that are used for data input/output.


    +   - NUL is a device that does not output any data, and any data sent to NUL
    will simply be discarded.

    - CON is a device that is used for input/output console data.

    - PRN is the device that is used to send data to the printer.

    - COM1-9 is the interface ports that are used to connect devices through the serial
    port.

    - LPT1-9 are parallel ports that are used to connect printers and other devices
    through the parallel port.


    /dev/null, /dev/random /dev/zero – are special devices in Unix operating systems
    and Unix-like systems such as Linux. They are used for data input/output and have
    the following meanings:


    +   - /dev/null is a device that ignores all data sent to it. Any data directed
    to /dev/null will simply be discarded, and this can be useful for ignoring output
    from a program or script.

    - /dev/random is the device that generates random data. This can be useful for
    generating encryption keys or for creating passwords.

    - /dev/zero is the device that generates the byte stream. This can be useful,
    for example, to create a file of given size filled with null bytes.

    - /dev/full is a device that does not allow data to be written to when it is full.
    It can be used to test programs that handle disk errors.

    - /dev/urandom is a device that generates random data, like /dev/random, but unlike
    the latter, it does not block when there is not enough entropy in the system.

    - /dev/shm is a section of memory that is used to exchange data between processes.
    It can be faster than regular files because the data is stored in memory rather
    than on disk.'
