    # Option 2: Installing VirtualBox from the installation package


    a) Download the installation package for your version of Linux from the official
    VirtualBox website:


    https://www.virtualbox.org/wiki/Linux_Downloads


    b) Open a terminal and navigate to the directory where the downloaded package
    is located:


    ```

    cd /path/to/download/directory

    ```


    c) Install dependencies for VirtualBox:


    ```

    sudo apt-get install build-essential linux-headers-$(uname -r)

    ```


    d) Install VirtualBox from the installation package:


    ```

    sudo dpkg -i virtualbox-*.deb

    ```


    e) Start VirtualBox from the application menu or from the terminal by entering
    the command:


    ```

