    # Решение задачи 17


    В Linux службы (или демоны) запускаются и управляются с помощью инструментов и
    командной строки. Вот несколько шагов для запуска службы в Linux:


    +   а) Убедитесь, что служба установлена и настроена на запуск при загрузке системы.
    Обычно службы устанавливаются через пакетный менеджер и настраиваются для автоматического
    запуска при загрузке.


    +   б) Откройте терминал и выполните команду `sudo service <service_name>` на
    имя службы, которую вы хотите запустить. Например, для запуска службы Apache в
    Ubuntu, используйте команду `sudo service apache2 start`.


    +   в) Чтобы убедиться, что служба запущена, выполните команду `sudo service <service_name>
    status`. Она покажет статус службы, в том числе, запущена она или нет.


    +   г) Если вы хотите, чтобы служба запускалась автоматически при каждой загрузке
    системы, выполните команду `sudo systemctl enable <service_name>`.


    +   д) Чтобы остановить службу, выполните команду `sudo service <service_name>
    stop`.'
