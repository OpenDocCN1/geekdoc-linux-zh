    NUL, CON, PRN, COM1-9, LPT1-9 sont des périphériques spéciaux du système d''exploitation
    Windows qui sont utilisés pour l''entrée/sortie de données.


    +   - NUL est un appareil qui produit aucune donnée, et les données envoyées à
    NUL sont simplement rejetées.

    - CON est un appareil utilisé pour entrer/sortir les données de la console.

    - PRN est le périphérique utilisé pour envoyer des données à l''imprimante.

    - COM1-9 sont les ports d''interface série utilisés pour connecter des périphériques
    via le port série.

    - LPT1-9 sont des ports parallèles utilisés pour connecter des imprimantes et
    d''autres périphériques via le port parallèle.


    /dev/null, /dev/random et /dev/zero sont des fichiers spéciaux sur les systèmes
    d''exploitation Unix et les systèmes de type Unix comme Linux. Ils sont utilisés
    pour l''entrée/sortie de données et ont les significations suivantes:


    +   - /dev/null est un périphérique qui ignore les données qui lui sont envoyées.
    Toutes les données dirigées vers /dev/null seront les données supprimées. Ce peut
    être utile pour ignorer la sortie d''un programme ou'' un script.

    - /dev/random est le périphérique qui génère des données aléatoires. Cela peut
    être utile pour générer des clés de cryptage aléatoires ou pour créer des mots
    de passe aléatoires.

    - /dev/zero est le périphérique qui génère le flux de zéro octet. Cela peut être
    utile, par exemple, pour créer un fichier d''une taille rempli d''octets null.

    - /dev/full est un périphérique qui n''autorise pas l''écriture de données lorsqu''il
    est plein. Il peut être utilisé pour tester des programmes qui gèrent les erreurs
    d''écriture sur disque.

    - /dev/urandom est un périphérique qui génère des données aléatoires, comme /dev/random,
    mais contrairement à ce dernier, il se bloque pas lorsqu''il n''y a pas assez
    d''entropie dans le système.'
