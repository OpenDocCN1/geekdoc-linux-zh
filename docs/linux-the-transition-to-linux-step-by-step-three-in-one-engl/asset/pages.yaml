    устройства и т.д.


    # Сброс настроек NVRAM


    В UEFI, как и в BIOS, существуют механизмы защиты доступа, включая пароли для
    входа в настройки. Знаем также, что для сброса настроек в BIOS компьютера, необходимо
    отсоединить и извлечь небольшую батарею, которая находится на материнской плате.
    После этой процедуры все установленные настройки отменяются, включая установленные
    пароли. Для технологии UEFI все по-другому.


    Если пользователь забыл пароль входа в настройки UEFI, то можно назвать несколько
