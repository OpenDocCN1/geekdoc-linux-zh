    and effectiveness in solving server tasks, it is still rarely used among ordinary
    desktop users.


    In this course, we introduce the basic concepts and principles of the Linux operating
    system for beginners. The book contains information about the visual representations
    of the Linux operating system interface, the main analogues of Windows programs
    for Linux, commands for working in the command line interface of the Linux operating
    system, as well as indicators for choosing the Linux operating system that meets
    your desired needs. Any interested reader of this manual should obtain, after
