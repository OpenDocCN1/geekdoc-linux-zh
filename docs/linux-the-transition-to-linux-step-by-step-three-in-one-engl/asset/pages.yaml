  md: '# TRANSITION TO LINUX BY STEP: THREE IN ONE


    This line means that the job will run at 17:00 every Friday (5th day of the week)
    and will delete all files in the /tmp folder.


    A more specific description of the command:


    +   * "0" is the value of minutes per hour when the task should be started. Here
    "0" means the task will be started exactly at the beginning of each hour.


    +   * "17" is the value of the hours in the day when the task should be started.
    Here "17" means that the task will start at 17:00.


    +   * "* is an asterisk that represents the value for all days of the month, months
    and days of the week. Here the asterisk is used to start the task on any day of
    the month and any month if it meets the condition of starting on the specified
    day of the week.


    +   * "5" is the value of the day of the week when the task should be started.
    Here "5" means that the task will start on Friday.


    +   * "f" is a parameter of the "rm" command, which means "force" (forced). This
    is a parameter that tells the command to ignore any errors that may occur during
    the process of deleting files in the /tmp folder. If this parameter is not specified,
    the "rm" command will request confirmation to delete each file, which may be inconvenient
    when deleting a large number of files.


    +   * Save the file and close it.


