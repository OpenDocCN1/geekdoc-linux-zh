    # Description of the chmod command


    The chmod command is used in Linux to change permissions of files and folders.
    Permissions in Linux can be divided into three groups: permissions for the owner
    of a file, a group of users, and all other users. The syntax for the chmod command
    is as follows:


    ```

    chmod [options] [access mode] [file or directory name]

    ```


    where options are additional command options, access mode is the new permissions
    you want to set, and file or directory name is the name of the file or folder
    whose permissions you want to change. To specify the access mode, chmod uses a
    numeric format, where digit is the sum of the permissions set for the file''s
    owner, user group, and all other users. The following table 3.4 lists the main
    values and their respective numerical codes:


    3.4 - Basic values for setting the access mode in the chmod command


    | Meaning | Numeric code | Description |

    | --- | --- | --- |

    | r (read) | 4 | reading |

    | w (write) | 2 | record |

    | x (execute) | 1 | performance |

    | (no access) | 0 | No access |

    | s | | SUID or SGID (depending on where applicable) |

    | t | 1 | sticky bit (only for directories) |


