    Au sein du SE, les utilisateurs doivent interagir avec les informations en manipulant
    des widgets visuels qui permettent ensuite d''interagir avec les données qu''ils
    contiennent. Widgets de l''interface (voir tableau. 2.2) permettent aux utilisateurs
