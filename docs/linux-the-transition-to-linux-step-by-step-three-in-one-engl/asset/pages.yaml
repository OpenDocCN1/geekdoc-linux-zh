    +   * NULL — это устройство, которое не выводит данных, и любые данные, отправленные
    в NULL, будут просто отброшены.

    * CON — это устройство, которое используется для ввода-вывода консольных данных.

    * PRN — это устройство, которое используется для отправки данных на принтер.

    * COM1-9 — это порты интерфейса, которые используются для подключения устройств
    через последовательный порт.

    * LPT1-9 — это параллельные порты, которые используются для подключения принтеров
    и других устройств через параллельный порт.


    /dev/null, /dev/random и /dev/zero — это специальные файлы в операционных системах
    Unix и Unix-подобных системах, таких как Linux. Они используются для ввода-вывода
    данных и имеют следующие значения:


    +   * /dev/null — это устройство, которое игнорирует все данные, любые данные,
    отправленные в /dev/null, будут просто отброшены, и это может быть полезно для
    того, чтобы игнорировать вывод из программы или скрипта.

    * /dev/random — это устройство, которое генерирует случайные данные. Это может
    быть полезно для генерации случайных ключей шифрования или для создания случайных
    паролей.

    * /dev/zero — это устройство, которое генерирует поток нулевых байтов. Оно может
    быть полезно для создания файла заданного размера, заполненного нулевыми байтами.

    * /dev/full — это устройство, которое не позволяет записывать данные на него,
    когда оно заполнено. Оно может использоваться для тестирования программ, которые
    обрабатывают ошибки записи на диск.'
