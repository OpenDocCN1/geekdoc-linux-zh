    bureautiques courantes, telles que la navigation sur le Web, la rédaction de documents
    et l''envoi de courriels, vous n''avez pas besoin d''une distribution complexe.
    Cependant, si vous êtes un programmeur, vous aurez besoin d''une distribution
    qui prend en charge les langages de programmation dont vous avez besoin.


    +   7. Niveau de compétence technique : Linux est réputé pour sa personnalisation
    et son contrôle, mais certaines distributions peuvent être plus difficiles à utiliser
    que d''autres. Si vous êtes nouveau dans le monde de Linux, vous pouvez opter
    pour une distribution'
