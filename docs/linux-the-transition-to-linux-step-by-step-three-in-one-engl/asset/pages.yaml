    # II.2 Системное программное обеспечение


    Системное программное обеспечение — это те программы, которые обеспечивают взаимодействие
    прочих программ компьютерной системы с программами базового уровня и непосредственно
    с аппаратным обеспечением. Скажем, что это основное программное обеспечение (ПО)
    объекта, которое воплощает. Здесь речь идет о следующем программном обеспечении:
    операционная система для компьютера, и драйвер (это конкретная программа, отвечающая
    за взаимодействие с конкретными устройствами) для различных устройств компьютера
    и том числе периферийные.


    # II.2.1 Операционные системы


    С простыми словами, можно сказать, что операционная система (OC) — это программа,
    которая позволяет ввести диалог с компьютером. Этот комплекс программ, предназначенный
    для управления процессом обработки информации в электронной вычислительной машины
    (ЭВМ) и организации связи между человеком(пользователем) с ЭВМ.


    Внутри ОС, пользователи должны взаимодействовать с информацией, манипулируя визуальными
    виджетами, которые в дальнейшем позволяют взаимодействовать с данными, содержащимися
