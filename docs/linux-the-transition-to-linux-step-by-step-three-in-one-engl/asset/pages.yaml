    DANS DIFFERENTES DIRECTIONS


    Commençons par comprendre qu''un logiciel est une application conçue pour résoudre
    un problème bien défini sur un ordinateur ; il vise à effectuer une tâche conformément
    aux programmes ou aux réglages effectués par l''utilisateur.


    Par définition, un logiciel informatique est un ensemble d''instructions, de programmes
    utilisent un ordinateur ou un autre appareil électronique (smartphone, tablette,
    console de jeux, etc.) pour afficher et exécuter des tâches qui lui sont assignées
    et qui sont écrites dans le langage sélectionné. langage fonctionnalité de programmation.


    Selon la fonctionnalité, tous les logiciels sont divisés en cinq types: de base,
    système, de service, d''application et instrumental.


    # FR II.1 Logiciel de base


    De jours où la technologie informatique essaie de traverser un nouveau tournant
    de développement, chaque appareil électronique (ordinateur, routeur, smart TV,
    smartphone, ...) possède un logiciel de base, qui permet de l''initialiser; afin
    d''assurer et contrôler le bon déroulement et l''interchange entre les différents
    composants de l''appareil. Ces programmes sont appelés logiciel de base. Ils n''ont
    pas été créés pour subir constamment des modifications pendant le processus d''exploitation
    ou de mise en application. Dans l''ordinateur, ce logiciel est connu sous le nom
    de BIOS (Basic Input/Output System). Le programme crée un bon environnement de
    fonctionnement, nécessaire pour exécuter le programme principal qui n''est d''autre
    que le système d''exploitation.


    Dans le cadre de la différenciation entre le Linux et le Windows, il n''y a pas
    lieu d''en faire une nécessité de comparaison, à la mesure où ils sont les mêmes
    dans les deux cas.


    Il s''agit du niveau de logiciel le plus bas. Il est responsable de l''interaction
    avec le matériel sous-jacent. Ils sont dans des circuits intégrés, c''est-à-dire
    sont stockés dans des microcircuits spéciaux appelés dispositifs de stockage permanents.'
