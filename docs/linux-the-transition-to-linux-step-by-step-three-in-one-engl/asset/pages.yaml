    # III.2 Description de quelques fonctions de base du système


    # III2.1 Superutilisateur et ses capacités sous Linux


    Le superutilisateur est un compte du système d''exploitation Linux avec des droits
    d''accès à toutes les ressources système, y compris les fichiers et répertoires
    système, les processus et les périphériques.


    Le superutilisateur a le maximum de droits pour effectuer toutes les opérations
    sur système, y compris l''installation et la suppression de programmes, la modification
    des paramètres du système, la création et la suppression de fichiers et de répertoires.


    Sous Linux, le superutilisateur est généralement appelé root et est créé lors
    de l''installation du système d''exploitation. Pour effectuer des tâches avec
    des privilèges de superutilisateur, l''utilisateur doit être connecté en tant
    que root ou utiliser la commande pour élever temporairement ses privilèges au
    niveau de superutilisateur.


    L''utilisation du superutilisateur peut être dangereuse, car des erreurs des commandes
    incorrectes peuvent causer des dommages permanents au système ou divulguer des
    informations confidentielles. Par conséquent, l''utilisation du superutilisateur
    doit être minimisée et limitée à la seule période de temps nécessaire et pour
    effectuer les tâches nécessaires.


    Dans cette section, nous examinerons les commandes qui permettent d''apporter
    des modifications au système en effectuant diverses tâches nécessitant des privilèges
    élevés. Certaines des commandes les plus importantes sont décrites dans le Tableau
    3.3.


