  md: '# TRANSITION TO LINUX STEP BY STEP: THREE IN ONE

    Chapter II. THE MAIN ANALOGUE SOFTWARE OF WINDOWS FOR LINUX IN DIFFERENT DIRECTIONS


    Let''s start by understanding that a software is an application designed to solve
    a well-defined problem on a computer; it aims to perform a task in accordance
    with the programs or settings made by the user.


    By definition, software is a set of instructions, computer programs that use a
    computer or other electronic device (smartphone, tablet, game console, etc.) to
    display and perform tasks that are assigned to it and written in selected programming
    language.


    Depending on the functionality, all software is divided into five types: basic,
    system, service, application and instrumental.


    # II.1 Basic software


    Nowadays, when computer technologies are trying to pass a new stage of development,
    every electronic device (computer, router, smart TV, smartphone, etc.) has basic
    software that allows it to be initialized; to ensure and control the smooth operation
    and interaction between the various components of the device. These programs are
    called the base software. They were not designed to be constantly subject to change
    during operation or implementation. On a computer, this software is known as the
    BIOS (Basic Input/Output System). The software creates a good operating environment
    necessary to run the main program, which is nothing more than an operating system.


    This is the lowest software level. It is responsible for interacting with the
    underlying hardware. They are in integrated circuits, i.e. are stored in special
    microcircuits called permanent storage devices.


    In the context of describing the difference between Linux and Windows, there is
    no need to compare them, as they are the same in both cases.'
  merge: -1
