    LVM (Logical Volume Manager) est une couche logicielle d''exploitation Linux et
    d''autres systèmes de type Unix qui fournit l''abstraction pour la gestion des
    volumes logiques.


    LVM permet à plusieurs périphériques de disque physique d''être combinés en groupes
    de volumes qui peuvent être créés, modifiés et supprimés sans interruption du
    système ni perte de données. Les groupes de volumes peuvent être divisés en volumes
    logiques, qui leur tour peuvent être formatés et utilisés comme des partitions
    de disque ordinaires.


    | Des droits d''accès ACL (Access Control List) | Des droits d''accès (owner/group/other)
    |


    Les autorisations d''accès sont un mécanisme qui détermine peut utiliser les fichiers
    et les répertoires sur les systèmes d''exploitation et comment les utiliser.


    Dans les systèmes compatibles POSIX (ENG. Portable Operating System Interface
    (interface portable des systèmes d''exploitation) tels que Linux et macOS, les
    droits d''accès sont définis pour chaque fichier ou répertoire et sont spécifiés
    par trois types d''utilisateurs différents: propriétaire(owner), groupe(group)
    et autres utilisateurs(others).


    Chac de ces types d''utilisateurs peut avoir différents niveaux d''accès au fichier
    ou au répertoire:


    +   - lecture (read): l''utilisateur peut afficher le contenu d''un fichier ou
    d''un répertoire.

    - écriture (write): l''utilisateur peut modifier le contenu d''un fichier ou répertoire,
    ainsi que créer ou supprimer des fichiers dans un répertoire.

    - exécution: l''utilisateur peut exécuter le fichier (dans le cas d''un répertoire,
    il peut accéder).


    Les droits d''accès sont comme un masque de bits chaque bit correspond à l''un
    des droits d''accès. En outre, les droits d''accès peuvent être définis pour le
    propriétaire, le groupe et les autres utilisateurs. Par exemple, 755 signifie
    que le propriétaire a des droits de lecture, d''écriture et d''exécution, tandis
    que le groupe et les autres utilisateurs ont des droits de lecture et d''exécution,
    mais non pas de droits d''écriture.


