  md: '# ГЛАВА III. КОМАНДЫ ДЛЯ РАБОТЫ В КОМАНДНОЙ СТРОКИ LINUX


    LVM (Logical Volume Manager) – это программный слой в операционных системах Linux
    и других Unix-подобных системах, который предоставляет абстракцию управления логическими
    томами.


    LVM позволяет объединять несколько физических дисковых устройств в группы томов,
    которые могут быть созданы, изменены и удалены без прерывания работы системы или
    потери данных. Группы томов могут быть расширены на логические тома, которые могут
    быть отформатированы и использова как обычные разделы диска.


    Права доступа ACL (Access Control List) (owner/group/other)


    Права доступа (access permissions) – это механизм, который определяет, как и как
    можно использовать файлы и директории в POSIX-совместимых системах (англл. Portable
    Operating System


    Interface переносимый интерфейс операционных систем), таких как Linux и macOS,
    права доступа определяются для каждого файла и директории и указываются тремя
    различными типами пользователей: владельцем (owner), группы (group) и остальными
    пользователями (others).


    Каждый из этих типов пользователей может иметь различные уровни доступа к файлу
    или директории:


    +   - чтение (read): пользователь может просматривать содержимое файла или директории.

    - записи (write): пользователь может изменять содержимое файла или директории,
    также создавать и удалять файлы в директории.

    - выполнение (execute): пользователь может запускать файл (в случае с дирерией
    - переходить в нее)


    Права доступа устанавливаются в виде битовой маски, где каждый бит соответствует
    одному из прав доступа. Кроме того, права доступа могут быть установлены для владельца,
    группы и остальных пользователей. Например, 755 означает, что владелец имеет права
    чтения, записи и выполнения, а группа и остальные пользователи имеют права чтения
    и выполнения, но не имеют прав на запись.


    | Разделение директорий | \ (обратный ключ) | / (прямой ключ) |'
