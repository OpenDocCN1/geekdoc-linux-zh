    # Solution de l''exercice 5


    a) Vous devez d''abord créer un utilisateur s''il n''existe pas, en utilisant
    la commande useradd.


    ```

    sudo useradd userpc2

    ```


    Ensuite, vous devez ajouter l''utilisateur «userpc2» au groupe «sudo».


    ```

    sudo usermod -aG sudo userpc2

    ```


    Après cela, il pourra exécuter des commandes avec des droits d''administrateur
    pour créer un fichier dans ce répertoire.


    b) Essayons de créer un fichier «proverka.txt» dans «/var/www/html/»:

    Pour résoudre l''exercice, vous devez d''abord créer des dossiers dans le repertoire
    «var» déjà existant à l''aide de la commande: **mkdir**: «www» et «html». Avant
    cela, utilisez les commandes **cd**, **ds** pour arriver dans le dossier «var».


    Ensuite, utilisez la commande **touch** pour créer un fichier nommé «proverka.txt»
    dans le répertoire «/var/www/html/». La commande est exécutée avec le préfixe
    sudo, qui lui donne les droits d''administrateur pour effectuer cette opération.


    ```

    sudo touch /var/www/html/proverka.txt

    ```


    c) Vérifiez que ceci a bien été créé dans le bon répertoire. Pour afficher le
    contenu d''un répertoire, utilisez la commande ls:


    ```

    ls /var/www/html

    ```


    Cette commande listera les fichiers dans le répertoire «/var/www/html».

    Vou devez voir le fichier «proverka.txt» dans la liste.


    d) Modifiez les autorisations sur le fichier créé afin qu''il puisse être, écrit
    et exécuté par tous les utilisateurs.'
