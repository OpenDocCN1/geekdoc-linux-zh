    # III.2.9 Commandes dans la section «Environnement d’un utilisateur» sous Linux


    Sous Linux, l’environnement d’un utilisateur (ou « environnement ») est un ensemble
    de variables d’environnement qui déterminent la configuration et le comportement
    du shell interactif de l’utilisateur (tel Bash) et de tous les processus qu’il
    exécute.


    L’environnement de l’utilisateur comprend des variables telles que PATH (termine
    où le système recherche les fichiers exécutables), HOME (termine la langue et
    les paramètres régionaux de l’utilisateur) et bien d’autres. L’utilisateur peut
    définir ses propres valeurs pour ces variables ou utiliser les valeurs par défaut
    définies par le système.


    De plus, les alias pour les commandes, les fonctions du shell, ainsi que les paramètres
    qui contrôlent le comportement du shell interactif (par exemple, l’historique
    des commandes, le schéma de couleurs du terminal, etc.) peuvent être définis dans
    l’environnement de l’utilisateur.


    L’utilisateur peut vérifier les valeurs actuelles des variables d’environnement
    en exécutant la commande «printenv » ou «env ». Il peut également modifier les
    variables d’environnement de la session en cours avec la commande «export », par
    exemple:


    ```

    export MY_VARIABLE=my_value

    ```


    Vous trouverez ci-dessous (voir tab. 3.12) les principales commandes de la section
    «Environnement d’un utilisateur» sous Linux via la ligne de commande.'
