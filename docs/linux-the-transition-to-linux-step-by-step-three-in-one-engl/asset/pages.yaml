    # Решение задачи 10


    Для планирования задания на удаление всех временных файлов в папке «tmp» каждую
    пятницу в 17:00 в Linux, можно использовать утилиту cron. Для этого следуйте этим
    шагам:


    а) Откройте терминал и введите команду “crontab -e” для редактирования файла cron.


    б) Добавьте следующую строку в конец файла cron:


    ```

    0 17 * * 5 rm -f /tmp/*

    ```


    Эта строка означает, что задание будет запускаться в 17:00 каждую пятницу (5-й
    день недели) и будет удалять все файлы в папке /tmp.


    Более конкретное описание команды:


    +   * “0” — это значение минут в часу, когда должно быть запущено задание. Здесь
    “0” означает, что задание будет запускаться в точно в начале каждого часа.

    * “17” — это значение часов в сутках, когда должно быть запущено задание. Здесь
    “17” означает, что задание будет запущено в 17:00.'
