    # EN III.2.5 Commands for managing processes in Linux


    In the Linux operating system, a process is an executing program or task that
    has its own unique identification information and is a unit of planning and management
    of system resources.


    A process can be created in various ways, for example, at system startup, when
    running a command on the command line, starting a daemon or an application running
    in the background. We remind you that a daemon is a process that runs in the background,
    has no interactive interaction with the user and performs certain tasks. Daemons
    are usually started during system boot and run until the system is shut down.
    One example of a daemon in Linux is the daemon, which processes requests and manages
    printers. Another example is a web server daemon (for example, Apache) that processes
    requests to web pages and returns them to clients. Linux uses special commands
    such as `systemctl` or `service` to control daemons.


    Each process in Linux has its unique process identifier (PID), which is used to
    manage it. Each process has its own memory space, a set of resources such as files
    and sockets, and a list of child processes. Linux uses process scheduling mechanisms
    to efficiently use system resources so that multiple processes can run in parallel.
    The operating system can suspend and resume processes, manage their priorities,
    and provide security and isolation between them.


    To manage processes in Linux from the command line, you need to know certain commands.
    Additional commands are found in Table 3.8.


