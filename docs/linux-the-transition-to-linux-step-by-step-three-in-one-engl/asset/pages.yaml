    The sequence of stages of the computer''s action after the user''s action through
    the keyboard (see Table 2.7):


    When a user enters a command through the keyboard, that command is sent to the
    central processing unit (CPU) of the computer for processing. The CPU interprets
    the command, performs the necessary actions, and sends the result back to the
    user.


    The command is entered as a sequence of characters on the keyboard, which are
    converted into electrical signals and transmitted via the data bus to the input
    ports of the CPU. The CPU receives the command and begins processing it by reading
    instructions from the computer''s random access memory (RAM).


    The CPU decodes the instruction and performs the necessary operations using its
    arithmetic and logic blocks. While executing an instruction, the CPU can access
    other components of the computer, such as the hard disk or graphics processor.


    When the command is completed, the results can be written back to memory or displayed
    on the computer screen. In some cases, the results may also be transferred to
    other devices such as a printer or network.


    > Table 2.7 – Interaction between major components in a computer


    | Steps | Basic processes |

    |---|--|

    | 1 | The keyboard sends signals to the processor when data is entered |

    | 2 | The processor processes the entered data and sends it to memory for temporary
    storage |

    | 3 | If data needs to be saved to disk, the processor sends it to disk for long-term
    storage |'
