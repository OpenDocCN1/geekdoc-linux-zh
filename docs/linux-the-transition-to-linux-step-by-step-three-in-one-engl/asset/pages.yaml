    # FR I1.3 Interface système Linux Alt Edu


    ALT Linux est un système d''exploitation russe basé sur Linux et conçu pour être
    utilisé sur des postes de travail, des serveurs et des appareils intégrés.


    Il a été développé depuis 2001 et est l''une des distributions Linux plus populaires
    en Russie et dans les pays de l''ex-URSS. ALT Linux possède'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# LA TRANSITION VERS LINUX ÉTAPE PAR ÉTAPE: TROIS EN UN


    son propre gestionnaire de packages RPM (c''est un système de gestion de packages
    gratuit et open source. Le nom RPM fait référence au format de fichier ".rpm"
    pour les distributions Linux qui permet de gérer facilement l''installation et
    les mises à jour des logiciels.


    ALT Linux a plusieurs versions (voir Figure 1.27), chacune conçue pour un usage
    spécifique : ALT Workstation pour les postes de travail, ALT Server pour les serveurs,
    ALT Education pour les établissements d''enseignement, et etc.


    ![](img/f7d3edbe212287bdf40c9582a51bff25_134_0.png)


    Fig. 1.28 Sélection du système de ALT Linux Education à exécuter


    ALT Linux propose également plusieurs options d''interface utilisateur différentes
    que Frames, Xfce, GNOME, KDE, LXDE et plus encore. Selon la version d''ALT Linux,
    une version différente du niveau Linux peut être utilisée. De plus, ALT Linux
    prend en charge de nombreuses langues, dont le russe, le kazakh, l''anglais, etc.


    L''une des caractéristiques d''ALT Linux est son ouverture et sa capacité à participer
    au développement. Les utilisateurs peuvent contribuer au projet, signaler des
    bogues, améliorer la documentation, et etc.'
