    # III.2.5 Commandes de gestion des processus sous Linux


    Dans le système d''exploitation Linux, un processus est un programme ou une tâche
    en cours d''exécution qui possède ses propres informations d''identification uniques
    et constitue l''unité de planification et de gestion des ressources système.

    Un processus peut être créé de différentes manières, par exemple le démarrage
    du système, de l''exécution d''une commande sur la ligne de commande, du démarrage
    d''un démon ou d''une application exécutée en arrière-plan. Nous rappelons qu''un
    démon est un processus qui s''exécute en arrière-plan, aucune interaction utilisateur
    interactive et effectue certaines tâches. Les démons sont généralement démarrés
    au démarrage du système et exécutés jusqu''à ce que le système soit arrêté. Un
    démon Linux est le démon d''impression, qui gère les demandes d''impression et
    les imprimantes. Un autre exemple est le démon de serveur Web (tel qu''Apache)
    qui traite les demandes de pages Web et les renvoie. Pour gérer les démons sous
    Linux, des commandes spéciales sont utilisées, telles que «systemctl » ou «service
    ».'
  merge: -1
  pgno: 480
- img_proc: true
  md: '# LA TRANSITION VERS LINUX ÉAPE PAR ÉTAPE: TROIS EN UN


    Chaque processus sous Linux a son propre ID de processus unique (PID) qui est
    utilisé pour le contrôler. Chaque processus a son propre espace mémoire, un ensemble
    de ressources telles que des fichiers et des sockets, et une liste de processus
    enfants. Linux utilise des mécanismes de planification de processus pour utiliser
    efficacement les ressources système afin que de nombreux processus puissent s''exécut
    en parallèle. Le système d''exploitation interrompt et reprend les processus,
    gérer leurs priorités et assurer la sécurité et l''isolement entre eux.


