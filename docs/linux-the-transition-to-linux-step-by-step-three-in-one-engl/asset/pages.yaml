    В зависимости от функциональности, все программные обеспечения разделить на пять
    видов: базовый, системный, служебный, прикладной и инструментальный.


    # Базовое программное обеспечение


    В наши дни, когда компьютерные технологии пытаются пройти новый этап развития,
    каждое электронное устройство (компьютер, маршрутизатор, smart TV, смартфон и
    т. д.) имеет базовое программное обеспечение, которое позволяет его инициализировать;
    чтобы обеспечить и контролировать бесперебойную работу и взаимодействие между
    различными компонентами устройства. Эти программы называются базовым программным
    обеспечением. Они не были созданы для того, чтобы постоянно подвергаться изменениям
    в процессе эксплуатации или внедрения. На компьютере, это программное обеспечение
    известно, как BIOS (Basic Input/Output System) «Базовая система ввода-вывода».
    ПО создает хорошуюю операционную среду, необходимую для запуска основной программы,
    которая является не чем иным, как операционной системой.


    Это самый низкий уровень ПО. Он отвечает за взаимодействие с базовыми аппаратными
    средствами. Они находятся в интегрированных'
