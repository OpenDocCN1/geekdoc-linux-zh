    # Нюанс в управлении пакетами


    Менеджеры пакетов являются важными инструментами для установки и управления программным
    обеспечением в операционной системе Linux. В большинстве случаев команды для установки
    программного обеспечения схожи, хотя дистрибутивы Linux используют разные менеджеры
    пакетов. Например, чтобы установить Openoffice.org:


    на «Ubuntu» из командной строки используйте команду `sudo apt-get install openoffice`.


    На «Fedora» команда для установки Openoffice.org» — `sudo dnf install openoffice`.


    Однако в дистрибутиве на основе Arch команда будет выглядеть так: `sudo pacman
    -S openoffice`.


    Наминаем, что перед любой установкой будет полезно сначала обновить список пакетов,
    доступных в вашей системе. В Ubuntu напишем команду: `sudo apt-get update`; на
    Fedora: `sudo dnf update` и в конце на «Arch» зададим будет: `sudo pacman -Syu`.


    Вы можете задаться вопросом, почему командная строка упоминается в этой главе,
