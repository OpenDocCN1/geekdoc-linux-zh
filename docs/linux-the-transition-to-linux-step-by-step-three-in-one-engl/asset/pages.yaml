    # 1.1 Interface pour le système Linux Lite version 6.2


    La représentation visuelle de l''interface du système d''exploitation Linux peut
    varier considérablement en fonction de la distribution utilisée et de l''environnement
    de travail. Par exemple, GNOME et KDE, deux environnements de bureau populaires
    pour Linux, ont des conceptions et des fonctionnalités différentes.


    En règle générale, l''interface Linux est représentée par une interface utilisateur
    graphique (GUI), qui comprend des menus, des fenêtres, des icônes et des boutons
    pour effectuer des tâches. Cependant de nombreux utilisateurs Linux (utilisateurs
    expérimentés) préfèrent travailler à partir de la ligne de commande, où ils peuvent
    effectuer des tâches via des commandes et des scripts. Plus de détails seront
    fournis au chapitre III.


