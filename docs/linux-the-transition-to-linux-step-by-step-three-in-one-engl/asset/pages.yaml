    # FR II.1.1 Description de quelques exemples de logiciels de base


    Le BIOS est un exemple de logiciel de base constitué d''un ensemble de programmes
    stockés sur la carte mère de l''ordinateur et exécutés au démarrage. Ils sont
    responsables de la configuration initiale, de la vérification du matériel et du
    démarrage du système d''exploitation. C''est le tout premier programme qui s''exécute
    lorsque vous allumez votre ordinateur (unité centrale, ordinateur portable, ...).


    Certaines informations importantes trouvées dans le BIOS incluent:


    +   - des informations sur les disques (HDD : Hard Disk Drive – disque dur; SSD
    : Solid State Drive – disque statique à semiconducteurs ou disque électronique;
    ...) et autres équipements connectés à l''ordinateur;


    +   - l''ordre de chargement du système d''exploitation et au début d''autres
    programmes;


    +   - horloge système et calendrier;


    +   - paramètres du processeur, de la mémoire et d''autres composants;


    +   - mots de passe et autres mesures de sécurité.


    Il faut rappeler que le BIOS a été développé à l''origine pour l''IBM PC (le premier
    ordinateur personnel produit en série fabriqué par IBM (International Business
    Machines – société américaine) au début des années 1980 et est encore utilisé
    par le plupart des ordinateurs. Il est important de noter que le BIOS a été remplacé
    par une nouvelle technologie appelée UEFI (Unified Extensible Firmware Interface),
    qui offre plusieurs d''options pour la configuration du système et offre une meilleure
    sécurité de démarrage (voir Figure 2.1).'
