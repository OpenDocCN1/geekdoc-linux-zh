    # ### FR II.2.2 Pilotes pour les périphériques


    Un pilote (en anglais driver) est un programme qui permet au système d''exploitation
    d''interagir avec des périphériques ou des composants logiciels. Un pilote traduit
    les demandes du système d''exploitation dans un langage qu''un périphérique ou
    un composant particulier peut comprendre et leur transmettre les commandes appropriées.


    Les pilotes jouent un rôle important dans le fonctionnement d''un ordinateur et
    d''autres appareils, car sans eux, le système d''exploitation ne pourra communiquer
    ou «parler » avec les appareils, ne pourra pas les contrôler et utiliser leurs
    fonctionnalités. Par exemple, il existe des pilotes pour les imprimantes, les
    scanners, les cartes son, les cartes vidéo, les cartes réseaux et d''autres périphériques.
    Vous devez savoir que chaque périphérique, et doit être installé sur l''ordinateur
    ou le périphérique pour que ce périphérique fonctionne correctement comme prévu.


    La création d''un pilote est un processus assez complexe et spécialisé qui nécessite
    que le programmeur ait des connaissances dans plusieurs domaines:


    +   1. Langages de programmation: pour écrire des pilotes, vous devez connaître
    les langages de programmation, tels que C, C++, Assembler, Pascal à certains endroits,
    qui prennent en charge les interfaces binaires du système d''exploitation correspondant.
    Les amateurs de Python doivent comprendre que ce langage ne répond pas à ses exigences.


