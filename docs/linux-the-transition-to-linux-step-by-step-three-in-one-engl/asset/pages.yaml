    Name from the title screen.


    This course book is intended for students who are interested in the Linux operating

    system, who want to deepen their knowledge of the command line of Linux to migrate
    from Windows

    to Linux. Particular attention is paid to the Linux operating system. This

    manual will be useful for anyone who wants to gain practical skills in working
    in this\environment. The teaching material of the manual also enables foreign
    students to master the

    discipline, overcoming the language barrier. Students who speak Russian can improve
    their

    knowledge in French and English by synchronizing the material presented in these
    languages.


    The publication is recommended for students of various fields of study, teachers
    and

    ayone interested in choosing and using the Linux operating system instead of Windows.


    It is also recommended for the acquisition of general professional skills in accordance

    with the higher education standards of the Russian Federation.


