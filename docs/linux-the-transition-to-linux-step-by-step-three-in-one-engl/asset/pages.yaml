  md: '# III.1.2 Сравнение структуры файловой системы между Windows и Linux


    Основным отличием (см. там. 3.2) файловой системы в Linux от файловой системы
    в Windows является то, что Linux использует иерархическую структуру файловой системы,
    в которой все файлы и папки расположены в древовидной структуре, начиная с корневой
    папки "/.". В Windows файловая система имеет более плоскую структуру и разделена
    на логические диски (например, C; D; и т.д.).


    Кроме того, в Linux существует единообразный подход к именованию файлов и папок,
    основанный на использовании символов, которые определяют их вид и назначение.
    В Windows именование файлов и папок может быть менее структурированным и часто
    зависит от предпочтения пользователя.


    Также в Linux у каждой папки есть свой уникальный идентификатор (inode), который
    позволяет системе отслеживать метаданные файлов и папок, включая права доступа,
    владельца и время создания или изменения. В Windows для этой цели используется
    система атрибутов файла.


    Наконец, в Linux используется разделение прав доступа на файлы и папки между пользователями
    и группами пользователей, что обеспечивает более гибкий и безопасный подход к
    управлению файлами и папками. В Windows также существует система прав доступа,
    но она не такая гибкая и не позволяет такую гранулярность настроек доступа к файлам
    и папкам, как в Linux.


    Таблица 3.2 Различия в структуре файловой системы в Windows и Linux


    | Описание | Windows | Linux |

    |---|---||}{

    | Структура | NTFS, FAT32, FAT16(FAT) | ext2, ext3, ext4, XFS, Btrfs, Swap |

    | Корневая директория | C; D:\ | / |

    | Разделы | Диски C; D; и т. д. | Разделы дисков, LVM |'
