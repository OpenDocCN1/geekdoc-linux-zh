    # FR II.1.3 Question - réponses: pour clarifier la compréhension du thème


    # 1) Comment entrer dans le BIOS ou l''UEFI ?


    Pour entrer dans le BIOS ou l''UEFI, les étapes suivantes doivent être suivies


    +   a) Redémarrez votre ordinateur ou allumez-le s''il était éteint.


    +   b) Appuyez sur la touche souhaitée pour accéder au BIOS ou à l''UEFI jusqu''à
    ce que le logo de démarrage du fabricant de l''ordinateur apparaisse. La clé de
    connexion peut varier selon la marque et le modèle de votre ordinateur. Il s''agit
    généralement des touches F2, F10, DEL ou ESC.


    +   c) Si vous ne savez pas quelle clé est nécessaire pour entrer dans le BIOS
    ou l''UEFI, vous pouvez consulter les instructions de l''ordinateur ou essayer
    différentes clés jusqu''à ce que vous voyiez l''écran des paramètres du BIOS ou
    de l''UEFI.


    +   d) Si vous utilisez Windows 10


    Une fois que vous entrez dans le BIOS ou l''UEFI, vous pouvez configurer les paramètres
    de votre ordinateur, y compris l''ordre de démarrage, divers paramètres de périphérique
    et d''autres paramètres, en fonction des fonctionnalités BIOS ou UEFI disponibles
    sur votre ordinateur.


