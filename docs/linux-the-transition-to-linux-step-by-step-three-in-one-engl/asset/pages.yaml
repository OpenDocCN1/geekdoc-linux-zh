    # RU I.5 Интерфейс системы Astra Linux


    Astra Linux — это российская защищенная операционная система, созданная на базе
    открытого кода Linux и предназначенная для использования в государственных организациях,
    военных и коммерческих организациях, работающих с государственными секретами.


    Операционная система Astra Linux была разработана компанией «РусБИТех» в 2008
    году и впоследствии получила сертификат ФСТЭК России на соответствие требованиям
    информационной безопасности. Astra Linux основана на открытом коде Debian и использует
    свой пакетный менеджер для управления программным обеспечением.


    Astra Linux имеет несколько версий, в том числе «Стандарт», «Базовая», «Безопасность»
    и «Специальная». Каждая версия разработана для решения конкретных задач и имеет
    свои характеристики и функциональные возможности.


    Astra Linux имеет множество встроенных механизмов безопасности, в том числе механизм
    защиты от вредоносных программ, механизм контроля доступа, механизм шифрования
    данных и многие другие. Кроме того, в Astra реализована возможность работы с защищенными
    сетями, включая сети с применением криптографических средств защиты.


    Важно отметить, что использование Astra Linux является обязательным для государственных
    организаций России, работающих с государственными секретами, а также для подрядных
    организаций, занимающихся разработкой или обслуживанием информационных систем
    с государственной тайной.


    Astra Linux поставляется с большим количеством программного обеспечения, которое
    устанавливается по умолчанию. Некоторые из наиболее распространенных приложений,
    которые вы найдете в Astra Linux, включают:


    +   1. Браузеры: Mozilla Firefox, Chromium.

    2. Офисные приложения: LibreOffice.'
