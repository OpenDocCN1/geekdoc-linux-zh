    # III.2.9 Команды в разделе “окружение пользователя” в Linux


    B окружение пользователя (или “environment”) — это набор переменных среды, которые
    определяют конфигурацию и поведение интерактивной оболочки пользователя (например,
    Bash), а также любых запущенных им процессов.


    Окружение пользователя включает в себя такие переменные, как PATH (определяет,
    исполняемые файлы), HOME (определяет домашнюю директорию пользователя), LANG (определяет
    язык и локаль пользователя) и многие другие. Пользователь может установить свои
    собственные значения для этих переменных или использовать значения по умолчанию,
    установленные системой.


    Кроме того, в окружении могут быть установлены псевдонимы для команд, функции
    оболочки, а также настройки, управляющие поведением интерактивной оболочки (например,
    история команд, цветовая схема терминала и т.д.)


    Пользователь может проверить текущие значения переменных окружения, выполнив команду
    “printf” или “env”. Он может из переменные окружения для текущей сессии оболочки
    с помощью команды “export”, и т.д.


    ```

    export MY_VARIABLE=my_value

    ```


    Ниже приведены (см. таб. 3.12) основные команды в разделе “Окружение пользователя”
    в Linux через командную строку.'
