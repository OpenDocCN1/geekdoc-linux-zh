  md: '# Глава V. ПОКАЗАТЕЛИ ВЫБОРА ОПЕРАЦИОННОЙ СИСТЕМЫ LINUX


    Операционная система Linux — это семейство операционных систем, разработанных
    частными кампаниями и сообществами свободных разработчиков. В отличие от других
    операционных систем, для Linux не существует единого стандарта. Вместо этого вид
    операционной системы, называемый дистрибутивом, полностью разрабатывается собственными
    разработчиками. Дистрибутивы различаются по своему назначению (персональные компьютеры,
    серверы, встроенные устройства и т. д.) — каждый дистрибутив имеет свой собственный
    набор приложений и утилит. В настоящее время существует несколько сот дистрибутивов
    Linux, не считая тех, которые были снуты с производства или созданы для частного
    использования. Для человека, незнакомого с операционными системами и компьютерными
    технологиями, может быть сложно ориентироваться в этом разнообразии вариантов.


    Итак, мы постараемся сделать для вас необходимые индикаторы, позволяющие сделать
    правильный выбор дистрибутива Linux.


    # Новая адаптация в «новом мире»


    Выбор дистрибутива Linux может быть трудным для людей, незнакомых с операционными
    системами с открытым исходным кодом. Linux - популярная и мощная операционная
    система, которую можно использовать для множества приложений, от серверов до персональных
    компьютеров и Интернет. Однако, несмотря на свои преимущества Linux не удалось
    завоевать значительную долю рынка в секторе персональных компьютеров. Это отсутствие
    успеха частично можно объяснить множеством доступных дистрибутивов. Для пользователей,
    знакомых с Linux, разнообразие доступных опций является преимуществом, но для
    новичков это может затруднить выбор. Тем не менее, Linux остается жизнеспособным
    вариантом для персональных компьютеров, обеспечивая стабильность и гибкость, не
    имеющие аналогов в других операционных системах.'
