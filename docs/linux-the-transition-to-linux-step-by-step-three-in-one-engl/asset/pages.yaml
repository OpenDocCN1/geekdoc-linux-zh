    # II.2.1 Operating systems


    In simple words, we can say that an operating system (OS) is a program that allows
    you to enter a dialogue with a computer. This is a set of programs designed to
    manage the process of processing information in an electronic computer (computer)
    and organize communication between a person (user) with a computer.


    Inside the OS, users must interact with information by manipulating visual widgets,
    which then allow you to interact with the data they contain. Interface widgets
    (see Table 2.2) allow users to achieve the goals when working with data in the
    operating system.


    It should be remembered that the graphical user interface and interface widgets
    are two different ways of presenting information on the screen of a computer or
    device. They have their own characteristics and different purposes of use.


    A graphical user interface (GUI) is a complete graphical user interface that includes
    various elements such as windows, menus, buttons, and so on. It allows users to
    control the computer and applications using the mouse and keyboard, providing
    graphical elements to perform various tasks. It provides an easier and more intuitive
    way to manage the operating system and applications.


    UI widgets, on the other hand, are more focused elements that can be displayed
    on the desktop, taskbar, lock screen, and so on. They may include elements such
    as calendar, weather, news, clock, etc. Widgets are typically'
