    # II.1.3 Вопросы – ответы: для уточнения понимания предмета


    # 1) Как войти в BIOS или UEFI?


    Чтобы войти в BIOS или UEFI, необходимо выполнить следующие шаги:

    a) Перезагрузите компьютер или включите его, если он был выключен.


    б) Нажмите на нужную клавишу для входа в BIOS или UEFI после появления загрузочного
    логотипа производителя компьютера. Клавиша для входа может быть разной в зависимости
    от производителя и модели компьютера. Обычно это клавиши F2, F10, F12, DEL или
    ESC.


    в) Если вы не знаете, какая клавиша нужна для входа в BIOS или UEFI, попробуйте
    разные клавиши до тех пор, пока не увидите экран настроек BIOS или UEFI.'
