    # Responses aux tests de vérification de connaissances sur Linux


    Voici quelques réponses possible aux questions:


    +   1. Il s''agit d''une interface de ligne de commande qui permet aux utilisateurs
    d''exécuter des commandes et de contrôler le système d''exploitation Linux.


    +   2. Un répertoire est un type spécial de fichier qui contient une liste de
    fichiers et d''autres rétoires.


    +   3. Linux utilise les commandes cp ou scp pour copier des fichiers (copier
    en toute sécurité des fichiers entre serveurs).


    Par exemple, pour copier un fichier nommé «monfichier.txt» dans le répertoire
    «mondirecto», vous devez exécuter la commande cp monfichier.txt mondirecto/


    Cela copia monfichier.txt dans le répertoire directo. Si un fichier du même nom
    existe déjà dans le répertoire directo, il sera remplacé par le fichier monfichier.txt.


    +   4. Les autorisations déterminent quels utilisateurs ou groupes d''utilisateurs
    peuvent lire, écrire ou exécuter des fichiers ou des rétoires sous Linux.


    +   5. Pour modifier les autorisations d''un fichier ou d''un répertoire, utilisez
    la commande chmod.


    +   6. Les processus sont des programmes ou des tâches qui s''exécutent sur le
    système d''exploitation Linux.


    +   7. Les commandes kill, pkill, killall, top, htop et ps sont utilisées pour
    contrôler les processus sous Linux.


    +   8. Un archiveur sous Linux est un programme qui vous permet de regrouper des
    fichiers et des rétoires dans un seul fichier d''archive.


    +   9. Linux utilise les commandes useradd, userdel, passwd et su sudo pour gérer
    les utilisateurs.'
