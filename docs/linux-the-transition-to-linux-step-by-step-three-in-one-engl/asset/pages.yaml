    or UEFI settings screen.

    d) If you are using Windows 10, you can also enter the BIOS or UEFI settings by
    pressing the Shift key and selecting “Reboot” from the Start menu. Then, in the
    action selection menu, you need to select “Advanced Settings” and “UEFI Firmware
    Settings” or “BIOS Setup”.


    Once you enter the BIOS or UEFI, you can configure your computer settings, including
    boot order, various device settings, and other settings, depending on the BIOS
    or UEFI features available on your computer.


