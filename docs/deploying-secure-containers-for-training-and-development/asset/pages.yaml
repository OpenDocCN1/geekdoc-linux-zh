  md: 'Using Containers in Training 19


    The precursor to ISLET named BroLive! also known as Bro sandbox was launched at
    BroCon14. It was a beta release intended to demonstrate a better way to train
    at conferences. It was developed out of a need to address some of the issues we
    mentioned earlier that occurred at early Bro. BroLive was used to teach the Bro
    scripting language and to analyze Logs with standard toolset e.g. grep, awk, etc..
    We had roughly 50 users simultaneously working with Bro in a container that was
    launched by the tool. The container had installed along with various command line
    tools that were used to analyze the output of Bro. The machine was hosted on a
    lower end EC2 virtual machine on Amazon’s AWS infrastructure. It went pretty well
    for its first run, and addressed the problems it was meant to solve. Colleagues
    began to see value in the tool and became more cognizant of the state of IT software
    training. I set out to make it more software neutral and wrote much of it in my
    free time as was used to train others. It was later named ISLET which was coined
    by Adam Slagel of the National Center for Supercomputing Applications.


    It has since used in various settings, notably at the University of Illinois at
    Urbana-Champaign, the Digital Forensics 2 course ISLET to train students using
    computer forensics tools such as Volatility, Sleuthkit, and Autopsy. ISLET has
    been used to teach Bro training at events like Flowcon and Derbycon. Many hundred
    users at once. I used it to teach various pieces of software at the GNU/Linux
    User Group and OpenNSM at UIUC.


    # Feedback loop


    Container logs show user''s actions e.g. mistakes which can be used to improve
    future training


    I conducted research and work on a paper that evaluated ISLET against a number
    of metrics to see how it would perform in the real world. Jeanette Dopheide, Adam
    Slagel, and myself all of Cybersecurity Directorate at the National Center for
    Supercomputing Application worked on the paper which was eventually published
    at the XSIDE (Extreme Science and Engineering Discovery Environment) conference
    in 2015. We used the Bro network security monitor as the tool for training. We
    ran Bro against a network trace file that’s commonly used at Bro training events
    which produced many different'
