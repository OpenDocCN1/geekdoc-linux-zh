  md: '# Container Concurrency


    ![](img/6a3a5763947e676430e69e4cbb77fa2f_31_0.png)


    We also test the container concurrency. We talk about density earlier I.e. how
    many containers can be running on a host. We were easily able to execute 1000
    containers each running the program top at the same time on a 16 core host without
    saturating the system. These containers are all running concurrently. Imagine
    the overhead of a thousand virtual machine each running top. It would be much
    harder to scale that on a single host of the same size. Glancing at the load averages
    on the graph System Load vs. Number of Running Containers you can see that this
    scales very well until until we run more than 700 containers at once which causes
    a large spike in load averages. This can be investigated further to find the cause.'
