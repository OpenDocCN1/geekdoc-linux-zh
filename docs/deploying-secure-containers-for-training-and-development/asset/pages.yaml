  md: "# Simulate Training\n\n+   - Metric: Response/execution time of program to\
    \ train\n Standard time: Average of 2.13 seconds\n Cutoff point: 6 seconds (too\
    \ long to wait)\n\n+   - We used the Bro network security monitor as the test.\
    \ Processed a network trace file used for training for Bro events. Bro is a process\
    \ that does a lot of work.\n\n+   - Introduced small randomization delays for\
    \ pauses & common commands for environment - looped 20 times. Ends up simulating\
    \ ~10 minutes of high user activity\n\nOur next experiment was to perform a simulated\
    \ training test with the goal of finding how many users can train simultaneously\
    \ using Bro. Our metric is the execution time it takes for Bro to process through\
    \ the network trace file. The execution time of the software to be trained measures\
    \ how well our system is performing during training. If the execution time increases\
    \ to a point where it affects the users ability to train as growing impatience\
    \ we need to allocate more resources to the computer. We ran Bro 100 times through\
    \ the network trace file, 3 times the average amount, was our cutoff point i.e.\
    \ the point from which we need to add more resources or not allow more users.\
    \ To find the cutoff point on our system we simulated common commands used in\
    \ a Bro training session. Tasks like generating and analyzing Bro logs were performed.\
    \ 10 minutes of simulated but active user activity was created. We simulated an\
    \ overly active user, one who is not representative of the typical class: for\
    \ example a training event user performs instructions that the trainer provides.\
    \ There is a delay between listening to instructions and then carrying them out.\
    \ This means there will be pauses between tasks as listening to an explanation.\
    \ We simulate a few seconds of pauses between commands but not that would be representative\
    \ of a class with a lecture because that’s difficult to measure length of pauses\
    \ during speech, and we did not have any available data for past conferences."
