  md: 'Using Containers in Training


    # How does ISLET address the criticisms? To begin, the participation is very low,
    all one needs a remote access tool such as an SSH client. OpenSSH is a cross platform
    tool that is available on servers, smart phones, tablets, and supported by many
    operating systems. The student is therefore not banished to a workstation where
    a hypervisor depends upon as a result the choice of hardware is much greater.
    Next, recall that shared system training had an issue managing user accounts.
    Having to distribute usernames and passwords for students can be a pain for the
    trainers. ISLET allows users to create and manage their own accounts. Only one
    account is shared and that is to allow the users to remotely access the server
    ISLET. This is often something that can be displayed to all students like an SSID
    and wireless password. Every student will use it to connect to the system and
    be placed in the ISLET software where they will create their ISLET account, and
    be able to immediately gain access to a training environment. From the user''s
    point of view it takes a handful of seconds or two to end in a training environment
    ready to perform work. From the perspective of the trainer only a single account
    on the host needs to be created. In sum, most of the work regarding account management
    is eliminated. Continuing, updating training materials can easily be done by mounting
    a directory containing the materials from the host into the containers. Updating
    or correcting material in the host makes them immediately available to the users.


    Moving along, we''ll address the issue of waiting for virtual machines to boot
    and having to configure them. ISLET tells Docker to create containers that consist
    of the software the students will be instructed on. This can be anything from
    the GCC (GNU C Compiler) to an IDS (Intrusion Detection System). It happens to
    be that just about whatever you can install and run on a GNU/Linux system you
    can package into a Docker image. From the ISLET menu one can make a selection
    regarding the training environment they want to enter. The trainer can provide
    multiple options if they wish. There may be different environments with different
    software for different topics instead of using large image containing all the
    tools. Once a training environment is selected a user can perform work it in less
    than a second, it''s instantaneous. Being placed in a training environment can
    happen in less than 30 seconds from the initial connection to the ISLET system.
    It''s harder to feel impatient with that kind of time, the student has more time
    to get focused and not worry about whether'
