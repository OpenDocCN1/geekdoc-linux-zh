  md: '# Cost Comparison


    ![](img/6a3a5763947e676430e69e4cbb77fa2f_34_0.png)


    We did a cost comparison where there''s one user per VM allocation on Amazon AWS
    vs. one host with one container per user. You can see a linear growth with the
    cost of virtual machines where the cost per hour rises as there are more users.
    Whereas, in the case of ISLET there''s one user per container it grows in steps.
    Remember that there is one user per training environment and a training environment
    is either a container or virtual machine. For ISLET you can see that we have step-like
    growth where you can actually have multiple training environments grow at less
    cost than it would be if you were using one virtual machine.


