  md: '# CHAPTER 1


    # Containers


    # Our Focus:


    Excels at teaching command-line software on Linux


    +   - Event training

    - Internal software training

    - Development environments

    - Playing around


    Containers are typically used to deploy web applications and software stacks.
    An example of this is deploying software such as WordPress, MySQL, or just hosting
    your website in a container running Apache or NGINX. Reproducibility and scalability
    are two benefits of deploying with containers. You can think of container as a
    package of software including libraries, services, and the application itself.
    Having your application and all its dependencies wrapped up in a container allows
    you to deploy it to any system that uses the same container runtime engine or
    container specification. Reproducibility is achieved in that way, in addition
    it is easily scalable across multiple systems when network traffic is high or
    provides redundancy when a system needs an upgrade. All you need to do is configure
    the container to run on multiple systems and tell a load balancer to redirect
    traffic. Tools like Kubernetes, Docker Swarm, and others make it easy to scale
    containers across hosts. While these are typical uses, we will look into the use
    of containers for software development and training. For example, we can utilize
    Linux containers to provide a package of a filesystem containing all the common
    tools used for training on the GNU/Linux operating system. Another example is
    to compile and run applications for testing and deployment without installing
    them on your host filesystem. The result of which ends providing a tidier filesystem
    and eliminates inconveniences of managing multiple versions of shared libraries
    or programs.'
  merge: -1
