  md: '# Simulation Data


    ![](img/6a3a5763947e676430e69e4cbb77fa2f_33_0.png)


    We plotted the result in the provided graph. The dotted line on x axis is the
    processing user''s time. The solid line represents the execution time per simulated
    user''s actively working on the system. As more users are training the execution
    time increases because the system has to run multiple simulations concurrently.
    If the execution time intersects and rises above the cutoff point value for that
    the system needs more resources because it took 6 seconds or more run Bro. The
    execution time ascends completely (including valleys) above the cutoff point when
