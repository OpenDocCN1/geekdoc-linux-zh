  md: 'protocol logs. Note that the Bro process performs a lot of work, it''s both
    CPU intensive and requires a lot of memory to keep state of protocols such as
    TCP. It attaches various analyzers to the connections to decode the network traffic
    up to the application layer and produces readable logs of the results.


    # Container Startup


    ![](img/6a3a5763947e676430e69e4cbb77fa2f_30_0.png)


    We performed a number of experiments in our evaluation of Docker Engine and the
    ISLET training software. First, we were curious about container startup time.
    For example on the CoreOS website it stated that containers start up in milliseconds
    and we did not see that claim substantiated so we tested it ourselves. We did
    a number of independent trials, 100 containers each running the uptime command
    and exiting. What we found was that it took ~400 milliseconds to create the container,
    execute the uptime program, and then exit the container. That''s how fast the
    start-up time was for the containers in our system. Container creation time is
    very fast and most of the time is actually spent running the application.'
  merge: -1
