  md: "# Linux Kernel Stuff\n\n+   * **Support:** 3.8 introduce the final building\
    \ block for containers\n* **Namespaces:** Process isolation\n  Currently available:\
    \ pid, net, ipc, uts, mnt, and user\n* **Control Groups:** Resource management\n\
    \  e.cpu, cpuset, ludzi, memory, etc.\n\n+   * It's not may, you can create namespaces\
    \ and cgroups directly from your shell by modifying procfs and sysfs.\nThat's\
    \ how they were deployed before userland tools like\nLXC and Docker existed\n\n\
    The Linux 3.8 kernel introduced what could said to be the most complete set of\
    \ building blocks for containers yet. Earlier versions from 2.49 had namespaces\
    \ and more were added over time but not enough to give us the capabilities we\
    \ have now. The two building blocks we spoke about earlier are namespaces and\
    \ control groups. Namespaces provide a way to isolate resources. There are currently\
    \ 6 namespaces provided by the kernel and they include: PID, Network, IPC, UTS,\
    \ and User. The user namespace adds additional security by mapping users such\
    \ as root inside a container to an newest of them and not implemented in all runtimes\
    \ at the time of this writing. An example of the PID namespace follows. Process\
    \ Z is assigned to namespace A and process Y is assigned to namespace B. A user\
    \ enters namespace A and runs top sees Process Z, correspondingly a user namespace\
    \ B and runs top but only sees Process Y. The same with root entering namespace\
    \ A or B and running top. Though, if not on the global namespace the root user\
    \ can see that Process Z is running in namespace A and Process Y is running in\
    \ namespace B. You can see that the PID namespace effectively isolates the view\
    \ of the operating system. Note that namespaces don't have names, rather they\
    \ have inode numbers, letters were assigned to simplify expressions. Another example\
    \ includes the Network namespace which allows each container to have its own network\
    \ interface and IP address to make a request to the URL of the Apache process\
    \ running in namespace A and get an entirely different website from the Apache\
    \ process running in namespace B with a different URL. Apache in namespace A and\
    \ Apache in namespace B are not able to communicate containers unless configured."
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Control groups provide a level of resource management or control on containers.
    Resources like memory utilization or amount of memory allocated to a container,
    as well as limiting the disk read and write throughput that a container can serve.
    CPU limitations such as sharing and quota values per container allow prioritization
    of processes in containers or prioritization of entire containers. In sum, Namespaces
    and cgroups used together form what we know as containers.


    One can create their own namespaces using the clone(2) system call. Cgroups can
    be created directly from the shell by mounting the pseudo cgroup filesystem and
    interacting with its files in sysfs.


    # Linux Containers?


    Docker popularized the technology. It''s actually been around for 7 years.


    ![](img/6a3a5763947e676430e69e4cbb77fa2f_18_0.png)


    +   * Automates the deployment of Linux based container

    * Provides layers of abstraction

    * Various methods of container creation

    * Docker hub and registries for sharing and deployment


    The use of containers are getting more and more popular because there are better
    ways to create them and there are tools that make it a lot easier to create, manage,
    and deploy containers. It''s not unreasonable to say that Docker Inc., formerly
    dotCould, has created a large amount of desire, their implementation Docker Engine
    has a great deal for getting people to contribute and take notice and utilize
    the container technology. Docker, later renamed Docker Engine, automates the deployment
    of Linux containers and provides the ability to use copy-write filesystems as
