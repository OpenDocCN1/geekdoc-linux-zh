  raw:
  - '[PAGE 12]


    # Isolation


    via kernel namespaces and cgroups

    The user can''t tell the difference.


    # Scalability


    Horizontally and vertically with faster hardware meaning

    more users or work can be performed


    # Lightweight


    ~100ms startup time, near bare metal performance, JeOS


    # Density


    Higher density than virtual machines


    Let''s move on to describe what containers are and what they can provide. Containers
    enable a layer of isolation and this is done in the Linux Kernel via two kernel
    components: namespaces and cgroups. Namespaces divide the operating system into
    virtual segments. For example, assigning a process to namespace A makes it invisible
    and unreachable to a process in namespace B, even if it runs the “ps” command
    in a different namespace. Cgroups are short for control groups, which can apply
    constraints, or limitations, to system resources such as memory, utilization;
    and CPU, by a percentage of its use.


    From the perspective of us, interacting with software such as a web application
    in a container, a virtual machine, or on bare metal, acts and looks the same.
    The average user is not able to tell what kind of system they are in, or what
    kind of level of virtualization they are using.


    Scalability with containers seems to be very easy to do and that''s one of its
    promising points. You can scale both horizontally and vertically. With vertical
    scaling we scale by applying more resources to the host: more CPU, more memory,
    faster disks, etc. You can do this with a virtual machine as well, any software
    really... You can add more resources to the box and then usually perform more.
    More interesting though is the number of tools to scale horizontally by clustering
    nodes to run containers. The Apache Mesos project is one example where running
    your application in a container can be scaled over pools of hundreds or thousands
    of different machines. Newer tools include Google''s Kubernetes and Docker''s
    own Swarm.'
  - '[PAGE 13]


    Containers tend to be lightweight in size which makes them suitable for scaling.
    The acronym JeOS (Just Enough Operating System) indicates this, in other words
    it''s alright to say that many images are bare bone. A testament of this is that
    using a Debian or Ubuntu Docker container image and issuing the “man” command
    to view the manual pages will result in a “command not found” error from the shell.
    This is even because the man-doc package is not installed! They tend to be measured
    in hundreds of megabytes instead of the full distribution one installs is usually
    much larger.


    Containers share the kernel that is running on the host. This means there is one
    running kernel, the Linux kernel, and it''s asked for resources directly. The
    application can ask it to write to disk, to send a packet across the network,
    to read from an open file, without having to pass instructions through another
    layer such as a Hypervisor is the case in Virtual Machines. This gives you a performance
    increase because the system has to perform less work for kernel requests i.e system
    calls. Less instructions and translations mean less work and the result is higher
    level of density for containers than you would have with virtual machines. That
    means you can run more containers on a host than you would have been able to run
    with virtual machines. It''s not unheard of be able to run 1000 containers on
    commodity hardware.


    In sum, applications in containers tend to run faster than their counterparts
    in a virtual machine. A user can get near bare metal performance in the right
    conditions and the startup time for a container is often less than a second where
    multiple seconds is the norm when booting virtual machines.


    # Security


    Less secure than virtual machines, containers isolate the user land (e.g filesystem,
    processes) not the kernel


    # Portability


    Less portable across operating systems. Tends to be portable within an operating
    system.


    # Concurrency


    Some implementations are designed to run a single application or process


    # Kernel Versions


    Containers must use the same kernel as the host'
  - '[PAGE 14]


    Let''s delve into a few other differences in security, portability, concurrency,
    and the kernel. Containers happen to be less secure than virtual machines. That''s
    not to say that they''re not secure but rather they''re less secure than virtual
    machines. This is mainly because containers isolate their user land e.g. filesystem,
    processes etc. and not the kernel. Virtual machines will isolate the entire operating
    system: the kernel, user land, and all.


    On the topic of portability containers tend to be less portable across operating
    systems. Note that containers are a subset of a virtualization type called light
    operating system virtualization, also known as lightweight process virtualization.
    These technical terms define an entire domain of technology that allows the operating
    system to run multiple instances of itself on the same host. Different operating
    systems have different ways of implementing this and the word containers often
    refer to the Linux kernel implementation. Circling back around, this means that
    if you run a container on GNU/Linux it''s not going to be run on FreeBSD or SmartOS
    because each have their own operating system virtualization implementation. However,
    within GNU/Linux system you can run containers across different distributions
    as long as the run time implementation is supported. Linux container runtime implementations
    such as Docker will run across Debian and Fedora families among others provided
    the kernel has the necessary features included for running containers. A modern
    kernel will have everything you need to run containers.


    A note on concurrency is that some container implementations such as Docker are
    designed to run a single application or process inside the container. Docker is
    designed in a way that advocates running one process per container. An example
    use case of this is where you have 10 websites that need to be isolated and served
    to the world. Each website is placed in a container where it''s running an Apache
    process to serve the web content. While running 10 instances of Apache might seem
    inefficient, one gains from the extra layer of security that is provided. If an
    attacker compromises an Apache daemon in a container and can access the system
    and issue commands—they''re not able to see or interact with the other websites
    in the other 9 containers. The design of a single process per container is not
    a hard limit; Docker doesn''t allow it there are plenty of use cases. You can
    run multiple processes by making the container''s first process (PID 1) an init
    system that can spawn and'
  - '[PAGE 15]


    manage other processes in the container. Docker doesn’t provide an init system
    which is why multiple process cannot be managed but installing one as supervisord
    is simple enough.


    Regarding kernel versions, a container as you may remember uses the same kernel
    running as the host. Because of this we are not able to experiment with different
    kernel versions. You can''t have a container that''s using Linux kernel 4.1 and
    another container running 4.2 and your host running 4.3. Virtual machines don''t
    have this problem because they virtualize an entire operating system. The benefit
    of sharing the kernel is what allows us to get that performance benefit that we
    talked about in the previous slide.


    # Containers


    +   Important: "Linux Based Containers"

    There is no internal container specification.

    As of, there is a container runtime specification called OCI


    +   There are different container (and like) technologies

    Linux: LXC, OpenVZ, Google containers, etc.

    Non-Linux: BSD Jails, Solaris Zones, AIX WPAR.


    The technology isn''t new, but it''s gaining great momentum now.


    +   What do containers do?

    Light-weight process virtualization, A.K.A. operating system virtualization


    +   What do virtual machines do?

    Hardware virtualization


    A note on terminology, when referring to Linux containers as a general technology
    it''s better to use the more encompassing term Linux-based containers. There are
    many runtime implementations of Linux-based containers such as LXC which is short
    for Linux containers and thus causes confusion. In addition there''s also no kernel
    container specification, there are a few building blocks in the kernel that runtime
    implementations take advantage of to create containers. Though, as of recent there
    is an effort to standardize a container runtime specification called OCI (Open
    Container Initiative); before OCI the CoreOS group worked on a specification called
    Appsec was subsumed into OCI. OCI is a Linux Foundation project that is'
- md: "\ndedicated to providing a specification: a set of guidelines and rules for\
    \ the packaging, deployment, and runtime of containers. Some tools follow this\
    \ and some do not. The specification will be adopted by more runtime implementations\
    \ as it becomes more mature.\n\nGNU/Linux mentioned that there were multiple implementations\
    \ of containers. Popular ones like Docker, LXC, and Rocket are gaining traction.\
    \ Many others exist including lesser known like OpenVZ which uses a modified Linux\
    \ kernel that the project maintains to provide resource controls and scheduling.\n\
    \nOn non-Linux systems, but UNIX derivatives, the BSDs; Solaris has Zones, AIX\
    \ has Partitions, Operating system virtualization technology isn't new, it's around\
    \ for a long time. FreeBSD, one of the earliest implementations, came out in 2000\
    \ which is 15 years ago at the time of publication. The technology is gaining\
    \ a lot of momentum as late because of of the high level of adoption rate for\
    \ the GNU/Linux operating system as well as the advent of better runtime implementations\
    \ like Docker that made creation and deployment convenient and workable for system\
    \ administrators and developers.\n\nContrast operating system virtualization with\
    \ virtual machines which provide hardware virtualization, virtual machines have\
    \ to translate hardware instructions; they worry about hardware such as busses,\
    \ and software as schedulers for the guests. The hypervisor is additional layer\
    \ of software required to create and manage virtual machines. Although hardware\
    \ virtualization is getting better and faster, containers simply don't have to\
    \ do as much work. A simplified illustration is an application in a container\
    \ that makes a system call to the kernel to ask for a resource such as opening\
    \ a file for reading and then the kernel (shared with the host) responds back\
    \ with the result of the system call and moves on. Whereas in the case of an application\
    \ in a virtual machine it makes a system call, the kernel in the guest services\
    \ the call but needs to talk to the hypervisor which is the real manager of the\
    \ hardware (the file resides on disk). The hypervisor translating for the hardware\
    \ gives the kernel what it needs, the kernel in the guest returns back to the\
    \ application which can proceed. In general you can see that this is a longer\
    \ code path, though things are constantly improving over time.\n\n# Linux Kernel\
    \ Stuff\n\n- **Support:** 3.8 introduce the final building block for containers\n\
    - **Namespaces:** Process isolation\n  Currently available: pid, net, ipc, uts,\
    \ mnt, and user\n- **Control Groups:** Resource management\n  e.cpu, cpuset, ludzi,\
    \ memory, etc.\n\n- It's not may, you can create namespaces and cgroups directly\
    \ from your shell by modifying procfs and sysfs. That's how they were deployed\
    \ before userland tools like LXC and Docker existed\n\nThe Linux 3.8 kernel introduced\
    \ what could said to be the most complete set of building blocks for containers\
    \ yet. Earlier versions from 2.4.9 had namespaces and more were added over time\
    \ but not enough to give us the capabilities we have now. The two building blocks\
    \ we spoke about earlier are namespaces and control groups. Namespaces provide\
    \ a way to isolate resources. There are currently 6 namespaces provided by the\
    \ kernel and they include: PID, Network, IPC, UTS, and User. The user namespace\
    \ adds additional security by mapping users such as root inside a container to\
    \ a newest of them and not implemented in all runtimes at the time of this writing.\
    \ An example of the PID namespace follows. Process Z is assigned to namespace\
    \ A and process Y is assigned to namespace B. A user enters namespace A and runs\
    \ top sees Process Z, correspondingly a user namespace B and runs top but only\
    \ sees Process Y. The same with root entering namespace A or B and running top.\
    \ Though, if not on the global namespace the root user can see that Process Z\
    \ is running in namespace A and Process Y is running in namespace B. You can see\
    \ that the PID namespace effectively isolates the view of the operating system.\
    \ Note that namespaces don't have names, rather they have inode numbers, letters\
    \ were assigned to simplify expressions. Another example includes the Network\
    \ namespace which allows each container to have its own network interface and\
    \ IP address to make a request to the URL of the Apache process running in namespace\
    \ A and get an entirely different website from the Apache process running in namespace\
    \ B with a different URL. Apache in namespace A and Apache in namespace B are\
    \ not able to communicate containers unless configured.\n\nControl groups provide\
    \ a level of resource management or control on containers. Resources like memory\
    \ utilization or amount of memory allocated to a container, as well as limiting\
    \ the disk read and write throughput that a container can serve. CPU limitations\
    \ such as sharing and quota values per container allow prioritization of processes\
    \ in containers or prioritization of entire containers. In sum, Namespaces and\
    \ cgroups used together form what we know as containers.\n\nOne can create their\
    \ own namespaces using the clone(2) system call. Cgroups can be created directly\
    \ from the shell by mounting the pseudo cgroup filesystem and interacting with\
    \ its files.\n\n# Linux Containers?\n\nDocker popularized the technology. It's\
    \ actually been around 7 years.\n\n![image](img/6a3a576394e676430e9e4cbb7fa2f.png)\n\
    \n- Automates the deployment of Linux container\n- Provides layers of abstraction\n\
    - Various methods of creation\n- Docker hub and registries for sharing\n\nThe\
    \ use of containers are getting more and popular because there are better ways\
    \ to create them. It's not unreasonable to say Docker Inc., formerly dotCould,\
    \ has created a large amount of desire for people to contribute and take notice\
    \ and utilize the container. Docker, later renamed Docker Engine, automates the\
    \ deployment of Linux containers. The provided chart shows the search terms using\
    \ Google Trends which is a good indicator of popularity. You can see that around\
    \ 2013 we have an almost linear growth, as Docker was released as open source\
    \ project in March 2013. I expect adoption and growth to continue as others improve\
    \ their systems as well as find use cases for containers.\n\n# Research Moment\n\
    \n“In general, Docker equals or exceeds KVM performance in every case we tested.”\n\
    \n- IBM Research Report: An Updated Performance Comparison of Virtual Machines\
    \ and Linux Containers (http://domino.research.ibm.com/library/cyberberg.nsfipapers/0299052195DD819C85257D2300681E7/$File/rc25482.pdf)\n\
    \nTo substantiate some of the performance claims made earlier there have been\
    \ a few studies including one noted by IBM titled “An Updated Performance Comparison\
    \ of Virtual Machines and Linux Containers.” In that report you will find the\
    \ concluding statements KVM was the chosen hypervisor to represent virtual machines\
    \ and Docker was the chosen runtime to implement containers. Disk, memory, CPU,\
    \ and network experiments were conducted using applications such as Redis, MySQL,\
    \ netperf, and LZMA. I highly recommend reading the report, freely available online,\
    \ for more information.\n\n# Container Security\n\n- Networking can be disabled\n\
    - Don't run processes as root\n- Follow standard filesystem rules for securing\
    \ data\n- Control CPU and RAM allocation\n- Devicemapper backend can limit disk\
    \ space\n- Finer environment controls via ulimit for Docker processes: fsize,\
    \ nproc, etc.\n- Keep container packages up to date\n\nWhen it comes to running\
    \ important services in containers a defense-in-depth approach is best. By this\
    \ I mean tighten security across the the\n"
  mdcn: "\n致力于提供一种规范：一套关于容器打包、部署和运行的指南和规则。某些工具遵循这一规范，而某些则不遵循。随着规范变得越来越成熟，更多的运行时实现将采用它。\n\
    \nGNU/Linux 提到有多种容器的实现。像 Docker、LXC 和 Rocket 这样的流行工具正受到关注。还有许多其他实现，包括较为人知的 OpenVZ，它使用由该项目维护的修改版\
    \ Linux 内核提供资源控制和调度。\n\n在非 Linux 系统上，但在 UNIX 派生系统中，例如 BSD 家族；Solaris 有 Zones，AIX\
    \ 有 Partitions，操作系统虚拟化技术并不新鲜，它已经存在很长时间了。FreeBSD 是最早的实现之一，于 2000 年发布，在出版时已是 15\
    \ 年前。这项技术之所以现在才获得巨大的势头，是因为 GNU/Linux 操作系统的普及率很高，以及像 Docker 这样更好的运行时实现的出现，这使得系统管理员和开发人员创建和部署变得方便且可行。\n\
    \n将操作系统虚拟化与提供硬件虚拟化的虚拟机进行对比：虚拟机必须翻译硬件指令；它们担心总线等硬件，以及作为客户机调度器的软件。虚拟机程序是创建和管理虚拟机所需的额外软件层。尽管硬件虚拟化正在变得更好、更快，但容器根本不需要做那么多工作。一个简化的说明是：容器中的应用程序向内核发出系统调用，请求某种资源（例如打开文件进行读取），然后内核（与主机共享）返回系统调用的结果并继续执行。而在虚拟机中的应用程序情况下，它发出系统调用，客户机内的内核处理该调用，但需要与虚拟机程序通信，虚拟机程序才是硬件的真实管理器（文件位于磁盘上）。虚拟机程序为硬件进行翻译，为内核提供所需，客户机内核将结果返回给应用程序，应用程序即可继续运行。通常情况下你可以看到这是一个更长的代码路径，尽管随着时间的推移一直在不断改进。\n\
    \n# Linux 内核相关\n\n- **支持：** 3.8 版本引入了容器的最终构建模块\n- **命名空间 (Namespaces):** 进程隔离\n\
    \  当前可用：pid, net, ipc, uts, mnt 和 user\n- **控制组 (Control Groups):** 资源管理\n  e.cpu,\
    \ cpuset, ludzi, memory 等。\n\n- 这并不难事，你可以通过修改 procfs 和 sysfs 直接从 shell 创建命名空间和\
    \ cgroups。这就是在 LXC 和 Docker 等用户态工具出现之前的部署方式。\n\nLinux 3.8 内核引入了可以说是目前最完整的容器构建模块。早期的\
    \ 2.4.9 版本已经有了命名空间，随着时间的推移增加了更多，但不足以赋予我们现在拥的能力。我们之前讨论的两个构建模块是命名空间和控制组。命名空间提供了一种隔离资源的方法。内核目前提供了\
    \ 6 个命名空间，包括：PID、Network、IPC、UTS 和 User。用户命名空间通过将容器内的 root 等用户映射到它们中的一个新用户增加了额外的安全性，但在本文写作时，它尚未在所有运行时中都实现。以下是\
    \ PID 命名空间的示例：进程 Z 被分配给命名空间 A，进程 Y 被分配给命名空间 B。用户进入命名空间 A 并运行 top，看到的是进程 Z；相应地，用户进入命名空间\
    \ B 并运行 top，只能看到进程 Y。root 进入命名空间 A 或 B 并运行 top 也是如此。尽管如此，如果不在全局命名空间，root 用户也可以看到进程\
