    # CHAPTER 3


    ## Experimentation


    ## Problem 2. Experimentation


    ### Comparison and research


    Our next section discusses another use for containers, for development and research.
    We want to be able to experiment in a particular domain. NSM (Network Security
    Monitoring) is a field that I''ve been very interested in and is primarily focused
    on analyzing the results of tools. There are many NSM tools available on GNU/Linux
    systems. An issue that arises is there no standards for how a tool should produce
    the results of network traffic for forensic investigation. For example, processing
    trace file through Httpry or PassiveDNS vs Bro will yield different results for
    HTTP and DNS protocols. The former tools will parse application information from
    a single packet but not across multiple packets where pieces of data can reside
    and then joined at the receiving host. Bro does because it keeps state and understands
    the protocols. Bro does have more accurate information than tools parsing a single
    packet. Being able to quickly test and experiment with many tools and different
    inputs is very useful in finding the right tool for the job as well as finding
    areas for improvement. OpenNSM (Open Network Security Monitoring Group) has an
    ongoing project to package up NSM tools at various versions — major and minor
    releases and make them easily available. Being able to run a network trace file
    of attack against 3 versions of one tool and 4 of another for comparison and validation
    of results in an automated fashion is timely. One can have multiple points of
    reference and achieve second or third opinions over sample. The project can also
    be used to analyze performance and experiment with the tools. There was not an
    easy way to organize and do until now. You could have 1000 Debian packages or
    RPMs on a system for the different tools and versions which would be an organization
    and dependency nightmare. It seems to be very efficient and better for organization
    to have all contained and isolated in an environment where they have their own
    file system and their own libraries etc. This allows us to use and reproduce software
    without interference.


    ## Types of Useful Experimentation


    - 1. Comparison of software and its versions

    - 2. Debugging and development

    - 3. Performance analysis

    - 4. Research


    One can figure out how these tools work and how to improve them by having all
    of them ready to go in containers. When you enter the container, you run your
    tools, analyze the results, and can make changes, repeat, and the results are
    contained and reproducible. Users no longer need to hunt down, compile, install,
    and package the tools, we do the hard work ahead of time.


    ## Goals


    > Software: Provide reproducible images with tagged versions of different software


    > Application: Use to experiment, research, and compare various software


    Our ambitious goal is to contain every network security monitoring tool, Free
    and Open Source, that we can get our hands on and at every major release or minor
    release that we can obtain. To package them up into Docker images that anyone—researcher,
    analyst, developer can pull them down to play, debug, and develop on. I hope that
    by making it easier to obtain and use NSM software we can improve the tools over
    time.


    ## ContainNSM


    Project to create Docker images of all available Free and Open Source network
    monitoring tools for evaluation, training, study. Releases of major and minor
    versions version tagged images.


    The project is called ContainNSM and is available online at https://github.com/open-nsm/containnsm.
    We currently have more than 100 images including Bro, Snort, Suricata, Tshark,
    Tcpdump, and more. In addition, we have written a command-line tool called /containnsm
    to manage and utilize the images efficiently.


    ## Real World Use Cases:


    - Created images of all available versions of Bro.


    ```

    for i in $(docker images -f "label=program-bro") do docker run -it $i bro --version;
    done

    bro version 2.4

    bro version 2.3

    bro version 2.2

    bro version 2.3.2

    bro version 2.3.1

    bro version 2.1

    bro version 1.5

    ```


    - 100+ images available for NSM tools such as Snort, Suricata, Tcpdump, Tshark,
    etc.


    From the host we perform common tasks when execution of the tool is completed
    in a container.


    - 1. Read a network trace file on the host by the tool in the container and displays
    the results on host

    - 2. Listen on a virtual network interface in the container with the tool and
    display results on host

    - 3. Listen on a physical interface on the host from the container and write the
    results on the host


    For a brief look I created a Docker image for a number of different Bro versions
    from 1.5 to 2.4. We can iterate through every Bro container at different versions
    and execute a task such as a policy. The image shows a concise example of running
    Bro printing the different versions.


    ## Roadmap:


    - Develop command-line tool to manage and utilize images

    - Pass and configure various inputs and output e.g. PCAP, logs

    - User contributed configurations for applications


    The future includes providing user contributed configurations for tools as well
    as supporting multiple input and output settings. The project is incredibly easy
    to contribute to and the directory structure is very simple to follow. We think
    this is going to be a very powerful reference for allowing security analysts and
    researchers in the field to get more work done and faster. At the point we have
    explored the use of containers for less commonly used and I hope it gets you thinking
    about other possibilities and problems that can be solved by taking advantage
    of the technology.

