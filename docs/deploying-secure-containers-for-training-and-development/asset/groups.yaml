    如果你想为 ISLET 贡献代码，非常简单，你只需要克隆仓库并提交补丁（patch）或拉取请求（pull request）。此外，还有一个 Vagrantfile
    可为 ISLET 设置开发环境。


    # 第 3 章


    ## 实验


    ## 问题 2. 实验


    ### 对比与研究


    我们的下一节将讨论容器的另一个用途：用于开发和研究。我们希望能够在特定领域内进行实验。NSM（网络安全监控）是我非常感兴趣的一个领域，它主要关注分析工具产生的结果。GNU/Linux
    系统上有许多 NSM 工具。出现的一个问题是，对于工具如何生成用于取证调查的网络流量结果，并没有标准。例如，通过 Httpry 或 PassiveDNS 处理追踪文件，与通过
    Bro 处理相比，在 HTTP 和 DNS 协议方面会产生不同的结果。前者从单个数据包解析应用程序信息，但无法跨多个数据包（数据碎片可能存在于多个包中并在接收主机处合并）。Bro
    可以，因为它保持状态并理解协议。Bro 比解析单个数据包的工具具有更准确的信息。能够快速测试和实验许多工具以及不同的输入，对于寻找合适的工具以及发现改进领域非常有。OpenNSM（开放网络安全监控小组）有一个正在进行的项目，旨在将各种版本的
    NSM 工具（主版本和次版本）打包并使它们易于获取。能够以自动化的方式针对某个工具的 3 个版本和另一个工具的 4 个版本运行攻击网络追踪文件进行对比和结果验证是非常及时的。人们可以拥有多个参考点，并对样本获得第二或第三意见。该项目还可以用于分析性能和对工具进行实验。直到现在，还没有简单的方法来组织和执行。你可能在系统中拥有
    1000 个用于不同工具和版本的 Debian 包或 RPM 包，这将是组织和依赖关系的噩梦。似乎将所有内容包含并隔离在一个环境中，让它们拥有自己的文件系统和库等，会更加高效且有利于组织。这允许我们在不受干扰的情况下使用和重现软件。


    ## 有用的实验类型


    - 1. 软件及其版本的比较

    - 2. 调试与开发

    - 3. 性能分析

    - 4. 研究


    通过将所有工具都准备在容器中，可以弄清楚这些工具是如何工作的以及如何改进它们。当你进入容器时，运行你的工具，分析结果，并进行更改、重复，且结果是包含且可重现的。用户不再需要寻找、编译、安装和打包工具，我们提前完成了这些艰性工作。


    ## 目标


    > 软件：提供带有不同软件版本标记的可重现镜像


    > 应用程序：用于实验、研究和比较各种软件


    我们雄心勃勃的目标是包含我们能获得的每一个免费开源的网络安全监控工具，以及我们能获得的每一个主版本或次版本发布。将它们打包成 Docker 镜像，让任何人——研究人员、分析师、开发者都可以下载并进行测试、调试和开发。我希望通过让获取和使用
    NSM 软件变得更容易，随着时间的推移改进这些工具。


    ## ContainNSM


    一个为所有可用的免费和开源网络监控工具创建 Docker 镜像的项目，用于评估、培训和学习。发布带有主次版本标记的镜像。


    该项目名为 ContainNSM，在线地址为 https://github.com/open-nsm/containnsm。我们目前有超过 100 个镜像，包括
    Bro、Snort、Suricata、Tshark、Tcpdump 等。此外，我们还编写了一个名为 /containnsm 的命令行工具来高效地管理和利用这些镜像。


    ## 现实用例：


    - 创建了 Bro 所有可用版本的镜像。


    ```

    for i in $(docker images -f "label=program-bro") do docker run -it $i bro --version;
    done

    bro version 2.4

    bro version 2.3

    bro version 2.2

    bro version 2.3.2

    bro version 2.3.1

    bro version 2.1

    bro version 1.5

    ```


    - 提供 100 多个镜像用于 NSM 工具，如 Snort、Suricata、Tcpdump、Tshark 等。


    在宿主机上，当工具在容器中执行完成后，我们执行常见任务。


    - 1. 由容器中的工具读取宿主机上的网络追踪文件并在宿主机上显示结果

    - 2. 使用工具在容器的虚拟网络接口上监听并在宿主机上显示结果

    - 3. 从容器在宿主机的物理接口上监听并将结果写入宿主机


    为了进行简要查看，我为从 1.5 到 2.4 的多个不同 Bro 版本创建了 Docker 镜像。我们可以遍历每个版本的 Bro 容器并执行诸如策略之类的任务。镜像展示了运行
    Bro 并打印不同版本的简洁示例。


    ## 路线图：


    - 开发用于管理和利用镜像的命令行工具

    - 传递和配置各种输入和输出，例如 PCAP、日志

    - 用户贡献的应用程序配置


    未来包括为工具提供用户贡献的配置，以及支持多个输入和输出设置。该项目非常容易贡献，目录结构简单易懂。我们认为这将是一个非常有力的参考，允许领域内的安全分析师和研究人员更快更高效地完成工作。在我们探讨了容器在不常用用途方面的用法之后，希望这能引发你思考其他可以利用该技术解决的可能性和问题。


