    Contrast operating system virtualization with virtual machines which provide hardware
    virtualization, virtual machines have to translate hardware instructions; they
    worry about hardware such as busses, and software as schedulers for the guests.
    The hypervisor is additional layer of software required to create and manage virtual
    machines. Although hardware virtualization is getting better and faster, containers
    simply don''t have to do as much work. A simplified illustration is an application
    in a container that makes a system call to the kernel to ask for a resource such
    as opening a file for reading and then the kernel (shared with the host) responds
    back with the result of the system call and moves on. Whereas in the case of an
    application in a virtual machine it makes a system call, the kernel in the guest
    services the call but needs to talk to the hypervisor which is the real manager
    of the hardware (the file resides on disk). The hypervisor translating for the
    hardware gives the kernel what it needs, the kernel in the guest returns back
    to the application which can proceed. In general you can see that this is a longer
    code path, though things are constantly improving over time.'
