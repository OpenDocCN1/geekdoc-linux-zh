    \n## 容器启动\n\n![](img/6a3a5763947e676430e69e4cbb77fa2f_30_0.png)\n\n我们在对 Docker\
    \ Engine 和 ISLET 训练软件进行评估时，进行了多项实验。首先，我们对容器的启动时间感到好奇。例如，CoreOS 网站上提到容器在毫秒内启动，但我们没有看到这一说法得到证实，因此我们自己进行了测试。我们进行了多次独立实验，每次实验运行\
    \ 100 个容器，每个容器运行 `uptime` 命令并退出。我们发现，创建容器、执行 `uptime` 程序然后退出容器需要约 400 毫秒。这就是我们系统中容器启动速度的快慢。容器的创建时间非常快，大部分时间实际上都花在了运行应用程序上。\n\
    \n## 容器并发\n\n![](img/6a3a5763947e676430e69e4cbb77fa2f_31_0.png)\n\n我们还测试了容器的并发性。我们之前提到密度，即主机上可以运行多少个容器。我们很容易在\
    \ 16 核主机上同时执行 1000 个容器，每个容器运行 `top` 程序，而不会使系统饱和。这些容器都是并发运行的。想象一下一千个每个运行 `top`\
    \ 的虚拟机的开销。在相同大小的单主机上扩展这种规模要困难得多。看一眼“系统负载与运行中容器数量”图表上的负载平均值，你可以发现它的扩展性非常好，直到我们一次性运行超过\
    \ 700 个容器，导致负载平均值出现巨大的峰值。这可以进一步调查以找到原因。\n\n## 模拟训练\n\n- 指标：训练程序的响应/执行时间\n  - 标准时间：平均\
    \ 2.13 秒\n  - 截止点：6 秒（等待时间太长了）\n\n- 我们使用 Bro 网络安全监控器作为测试对象。处理了一个用于训练 Bro 事件的网络跟踪文件。Bro\
    \ 是一个执行大量工作的进程。\n\n- 为环境中的暂停和常用命令引入了小的随机延迟——循环了 20 次。最终模拟了约 10 分钟的高用户活跃度\n\n我们的下一个实验是进行模拟训练测试，目标是找到有多少用户可以同时使用\
    \ Bro 进行训练。我们的指标是 Bro 处理网络跟踪文件所需的执行时间。被训练软件的执行时间衡量了我们系统在训练期间的性能。如果执行时间增加到影响用户训练能力（由于不耐烦日益增加）的程度，我们需要为计算机分配更多资源。我们让\
    \ Bro 通过网络跟踪文件运行了 100 次，是平均值的 3 倍，这是我们的截止点，即我们需要添加更多资源或不允许更多用户加入的点。为了在我们的系统中找到截止点，我们模拟了\
    \ Bro 训练课程中常用的命令。执行了生成和分析 Bro 日志等任务。创建了 10 分钟模拟但活跃的用户活动。我们模拟了一个过度活跃的用户，这种用户并不能代表典型的学生：例如，一个训练活动用户执行培训师提供的指令。在听取指令和执行指令之间存在延迟。这意味着任务之间会有暂停，例如听取解释。我们在命令之间模拟了几秒钟的暂停，但并不会代表有讲座的课程，因为很难衡量演讲期间暂停的长度，而且我们没有过去会议的可用数据。\n\
    \n## 模拟数据\n\n![](img/6a3a5763947e676430e69e4cbb77fa2f_33_0.png)\n\n我们在提供的图表中绘制了结果。x\
