- md: "\n# Isolation\nvia kernel namespaces and cgroups\nThe user can't tell the difference.\n\
    \n# Scalability\nHorizontally and vertically with faster hardware meaning more\
    \ users or work can be performed\n\n# Lightweight\n~100ms startup time, near bare\
    \ metal performance, JeOS\n\n# Density\nHigher density than virtual machines\n\
    \nLet's move on to describe what containers are and what they can provide. Containers\
    \ enable a layer of isolation and this is done in the Linux Kernel via two kernel\
    \ components: namespaces and cgroups. Namespaces divide the operating system into\
    \ virtual segments. For example, assigning a process to namespace A makes it invisible\
    \ and unreachable to a process in namespace B, even if it runs the “ps” command\
    \ in a different namespace. Cgroups are short for control groups, which can apply\
    \ constraints, or limitations, to system resources such as memory, utilization;\
    \ and CPU, by a percentage of its use.\n\nFrom the perspective of us, interacting\
    \ with software such as a web application in a container, a virtual machine, or\
    \ on bare metal, acts and looks the same. The average user is not able to tell\
    \ what kind of system they are in, or what kind of level of virtualization they\
    \ are using.\n\nScalability with containers seems to be very easy to do and that's\
    \ one of its promising points. You can scale both horizontally and vertically.\
    \ With vertical scaling we scale by applying more resources to the host: more\
    \ CPU, more memory, faster disks, etc. You can do this with a virtual machine\
    \ as well, any software really... You can add more resources to the box and then\
    \ usually perform more. More interesting though is the number of tools to scale\
    \ horizontally by clustering nodes to run containers. The Apache Mesos project\
    \ is one example where running your application in a container can be scaled over\
    \ pools of hundreds or thousands of different machines. Newer tools include Google's\
    \ Kubernetes and Docker's own Swarm.\n\nContainers tend to be lightweight in size\
    \ which makes them suitable for scaling. The acronym JeOS (Just Enough Operating\
    \ System) indicates this, in other words it's alright to say that many images\
    \ are bare bone. A testament of this is that using a Debian or Ubuntu Docker container\
    \ image and issuing the “man” command to view the manual pages will result in\
    \ a “command not found” error from the shell. This is even because the man-doc\
    \ package is not installed! They tend to be measured in hundreds of megabytes\
    \ instead of the full distribution one installs is usually much larger.\n\nContainers\
    \ share the kernel that is running on the host. This means there is one running\
    \ kernel, the Linux kernel, and it's asked for resources directly. The application\
    \ can ask it to write to disk, to send a packet across the network, to read from\
    \ an open file, without having to pass instructions through another layer such\
    \ as a Hypervisor is the case in Virtual Machines. This gives you a performance\
    \ increase because the system has to perform less work for kernel requests i.e\
    \ system calls. Less instructions and translations mean less work and the result\
    \ is higher level of density for containers than you would have with virtual machines.\
    \ That means you can run more containers on a host than you would have been able\
    \ to run with virtual machines. It's not unheard of be able to run 1000 containers\
    \ on commodity hardware.\n\nIn sum, applications in containers tend to run faster\
    \ than their counterparts in a virtual machine. A user can get near bare metal\
    \ performance in the right conditions and the startup time for a container is\
    \ often less than a second where multiple seconds is the norm when booting virtual\
    \ machines.\n\n# Security\nLess secure than virtual machines, containers isolate\
    \ the user land (e.g., filesystem, processes) not the kernel\n\n# Portability\n\
    Less portable across operating systems. Tends to be portable within an operating\
    \ system.\n\n# Concurrency\nSome implementations are designed to run a single\
    \ application or process\n\n# Kernel Versions\nContainers must use the same kernel\
    \ as the host\n\nLet's delve into a few other differences in security, portability,\
    \ concurrency, and the kernel. Containers happen to be less secure than virtual\
    \ machines. That's not to say that they're not secure but rather they're less\
    \ secure than virtual machines. This is mainly because containers isolate their\
    \ user land e.g. filesystem, processes etc. and not the kernel. Virtual machines\
    \ will isolate the entire operating system: the kernel, user land, and all.\n\n\
    On the topic of portability containers tend to be less portable across operating\
    \ systems. Note that containers are a subset of a virtualization type called light\
    \ operating system virtualization, also known as lightweight process virtualization.\
    \ These technical terms define an entire domain of technology that allows the\
    \ operating system to run multiple instances of itself on the same host. Different\
    \ operating systems have different ways of implementing this and the word containers\
    \ often refer to the Linux kernel implementation. Circling back around, this means\
    \ that if you run a container on GNU/Linux it's not going to be run on FreeBSD\
    \ or SmartOS.\n\n# Containers\n\n- **Important: Linux Based Containers**\n  There\
    \ is no internal container specification.\n  As of, there is a container runtime\
    \ specification called OCI\n\n- **There are different container (and like) technologies**\n\
    \  Linux: LXC, OpenVZ, Google containers, etc.\n  Non-Linux: BSD Jails, Solaris\
    \ Zones, AIX WPAR.\n\n- **What do containers do?**\n  Light-weight process virtualization,\
    \ A.K.A. operating system virtualization\n\n- **What do virtual machines do?**\n\
    \  Hardware virtualization\n\nThe technology isn't new, but it's gaining great\
    \ momentum now. A note on terminology, when referring to Linux containers as a\
    \ general technology it's better to use the more encompassing term Linux-based\
    \ containers. There are many runtime implementations of Linux-based containers\
    \ such as LXC which is short for Linux containers and thus causes confusion. In\
    \ addition there's also no kernel container specification, there are a few building\
    \ blocks in the kernel that runtime implementations take advantage of to create\
    \ containers. Though, as of recent there is an effort to standardize a container\
    \ runtime specification called OCI (Open Container Initiative); before OCI the\
    \ CoreOS group worked on a specification called Appsec was subsumed into OCI.\
    \ OCI is a Linux Foundation project that is\n"
  mdcn: "\n\n# 隔离\n通过内核命名空间 (namespaces) 和 cgroups\n用户无法感知区别。\n\n# 可扩展性\n通过更快的硬件进行水平和垂直扩展，意味着可以处理更多的用户或工作。\n\
    \n# 轻量化\n启动时间约 100ms，接近裸机性能，JeOS。\n\n# 密度\n比虚拟机更高的密度\n\n让我们继续描述什么是容器以及它们能提供什么。容器实现了隔离层，这是通过\
    \ Linux 内核的两个内核组件实现的：命名空间 (namespaces) 和 cgroups。命名空间将操作系统划分为虚拟段。例如，将一个进程分配给命名空间\
    \ A，它对于命名空间 B 中的进程是不可见且无法访问的，即使在不同的命名空间中运行“ps”命令也是如此。cgroups 是控制组（control groups）的缩写，可以对系统资源（如内存、CPU\
    \ 使用百分比）应用约束或限制。\n\n从我们的角度来看，与容器、虚拟机或裸机上的 Web 应用等软件交互，其行为和看起来是相同的。普通用户无法判断自己处于哪种系统，或者正在使用何种程度的虚拟化。\n\
    \n容器的可扩展性似乎非常容易实现，这是其极具前景的优势之一。你可以进行水平和垂直扩展。垂直扩展是通过向主机应用更多资源来实现：更多的 CPU、更多内存、更快的磁盘等。你也可以在虚拟机上这样做，任何软件都是如此……你可以为机器添加更多资源，然后通常可以执行更多任务。更有趣的是通过集群节点来运行容器以水平扩展的工具数量。Apache\
    \ Mesos 项目就是一个例子，在容器中运行应用程序可以扩展到数百或数千台不同机器的池中。较新的工具包括 Google 的 Kubernetes 和 Docker\
    \ 自己的 Swarm。\n\n容器的大小往往很轻量，这使其适合扩展。JeOS（恰好操作系统，Just Enough Operating System）这一缩写说明了这一点，换句话说，可以说许多镜像都是精简的。这一证明是，使用\
    \ Debian 或 Ubuntu Docker 容器镜像并执行“man”命令查看帮助页时，shell 会返回“command not found”错误。这是因为没有安装\
    \ man-doc 软件包！它们的度量通常以百 MB 计，而你所安装的完整发行版通常要大得多。\n\n容器共享运行在主机上的内核。这意味着只存在一个运行的内核，即\
    \ Linux 内核，并且它直接请求资源。应用程序可以请求它写入磁盘、跨网络发送数据包、从打开的文件读取，而不需要像虚拟机那样通过 Hypervisor 等其他层传递指令。这带给你性能提升，因为系统为内核请求（即系统调用）执行的工作更少。更少的指令和转换意味着更少的工作，结果容器的密度比虚拟机更高。这意味着在主机上运行的容器比使用虚拟机运行得多。在商用硬件上运行\
    \ 1000 个容器并非未闻。\n\n总而言之，容器中的应用程序运行速度通常比虚拟机中的程序更快。在适当条件下，用户可以获得接近裸机的性能，容器的启动时间通常小于一秒，而启动虚拟机时几秒是常态。\n\
    \n# 安全\n比虚拟机不安全，容器隔离的是用户态（例如文件系统、进程）而不是内核。\n\n# 可移植性\n跨操作系统的可移植性较差。通常在操作系统内部具有可移植性。\n\
    \n# 并发\n某些实现设计用于运行单个应用程序或进程\n\n# 内核版本\n容器必须使用与主机相同的内核\n\n让我们深入研究安全、可移植性、并发和内核方面的其他一些差异。容器的安全性确实比虚拟机低。这并不是说它们不安全，而是它们比虚拟机不安全。这主要是因为容器隔离了它们的用户态（例如文件系统、进程等），而不是内核。虚拟机将隔离整个操作系统：内核、用户态以及一切。\n\
    \n在可移植性方面，容器跨操作系统的可移植性往往较差。注意，容器是名为轻量级操作系统虚拟化（也称为轻量级进程虚拟化）的虚拟化类型的子集。这些技术术语定义了一个允许操作系统在同一主机上运行多个实例的技术领域。不同的操作系统有不同的实现方式，而“容器”一词通常指的是\
    \ Linux 内核的实现。回到这一点，这意味着如果你在 GNU/Linux 上运行容器，它将无法在 FreeBSD 或 SmartOS 上运行。\n\n\
    # 容器\n\n- **重要：基于 Linux 的容器**\n  没有内部的容器规范。\n  截至目前，有一个名为 OCI 的容器运行时规范。\n\n- **有不同的容器（以及类似的）技术**\n\
