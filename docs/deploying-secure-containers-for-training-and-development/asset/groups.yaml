    允许用户创建并管理自己的账户。只共享一个账户，用于允许用户远程访问 ISLET 服务器。这通常可以像 SSID 和无线密码一样显示给所有学生。每个学生都将使用它连接到系统并进入
    ISLET 软件，在其中创建自己的 ISLET 账户，并立即获得培训环境的访问。从用户的角度来看，只需要几秒钟进入可以开始工作的培训环境。从培训人员的角度来看，只需要在主机上创建一个账户。总之，消除了大部分关于账户管理的工作。此外，通过将包含材料的主机目录挂载到容器中，可以轻松地更新培训材料。在主机上更新或修正材料，用户可以立即使用。


