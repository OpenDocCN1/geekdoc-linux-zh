    \ AIX WPAR。\n\n- **容器是做什么的？**\n  轻量级进程虚拟化，即操作系统虚拟化。\n\n- **虚拟机是做什么的？**\n  硬件虚拟化\n\
    \n这项技术并不新，但它现在正获得巨大的势头。关于术语的说明，当作为通用技术提到 Linux 容器时，使用更具包性的术语基于 Linux 的容器（Linux-based\
    \ containers）更好。基于 Linux 的容器有很多运行时实现，例如 LXC 是 Linux containers 的缩写，这导致了混淆。此外，还没有内核容器规范，内核中有几个构建块供运行时实现利用以创建容器。尽管如此，近期有一项旨在标准化名为\
