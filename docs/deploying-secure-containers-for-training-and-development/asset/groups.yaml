    # CHAPTER 3


    # Experimentation


    # Problem 2. Experimentation


    # Comparison and research


    Our next section discusses another use for containers, for development and research.
    We want to be able experiment in a particular domain. NSM (Network Security Monitoring)
    is a field that I''ve been very interested in and is primarily focused on analyzing
    the results of tools. There are many NSM tools available on GNU/Linux systems.
    An issue that arises is there no standards for how a tool should produce the results
    of network traffic for forensic investigation. For example, processing trace file
    through Httpry or PassiveDNS vs Bro will yield different results for HTTP and
    DNS protocols. The former tools will parse application information from a single
    packet but not across multiple packets where pieces of data can reside and then
    joined at the receiving host. Bro does because it keeps state and understands
    the protocols. Bro does have more accurate information than tools parsing a single
    packet. Being able to quickly test and experiment with many tools and different
    inputs is very useful in finding the right tool for the job as well as finding
    areas for improvement. OpenNSM (Open Network Security Monitoring Group) has an
    going project to package up NSM tools at various versions — major and minor releases
    and make them easily available. Being able to run a network trace file of attack
    against 3 versions of one tool and 4 of another for comparison and validation
    of results in an automated fashion is timely. One can have multiple points of
    reference and achieve second or third opinions over sample. The project can also
    be used to analyze performance and experiment with the tools. There was not an
    easy way to organize and do until now. You could have 1000 Debian packages or
    RPM’s on a system for the different tools and'
  - '[PAGE 40]


    versions which would be an organization and dependency nightmare. It seems to
    be very efficient and better for organization to have all contained and isolated
    in an environment where they have their own file system and their own libraries
    etc. This allows us to use and repro-duce software without interference.


    # Types of Useful Experimentation


    +    1. Comparison of software and its versions


    +    2. Debugging and development


    +    3. Performance analysis


    +    4. Research


    One can figure out how these tools work and how to improve them by having all
    of them ready to go in containers. When you enter the container, you run your
    tools, analyze the results, and can make changes, repeat, and the results are
    contained and reproducible. Users no longer need to hunt down, compile, install,
    and package the tools, we do the hard work ahead of time.


    # Goals


    > Software: Provide reproducible images with tagged versions of different software


    > Application: Use to experiment, research, and compare various software


    Our ambitious goal is to contain every network security monitoring tool, Free
    and Open Source, that we can get our on and at every major release or minor release
    that we can obtain. To package them up into Docker images that anyone—researcher,
    analyst, developer can pull them down to play, debug, and develop on. I hope that
    by making it easier to obtain and use NSM software we can improve the tools over
    time.'
