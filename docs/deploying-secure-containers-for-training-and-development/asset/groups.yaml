    IDS（入侵检测系统）的任何内容。事实上，几乎任何可以在 GNU/Linux 系统上安装和运行的内容，都可以封装到 Docker 镜像中。从 ISLET 菜单中，用户就可以想要进入的培训环境进行选择。培训人员如果愿意，可以提供多个选项。针对不同的主题可以使用带有不同软件的环境，而不是使用包含所有工具的大型镜像。一旦选择了培训环境，用户可以在不到一秒的时间内开始工作，它是瞬时完成的。从初始连接到
    ISLET 系统到进入培训环境可以在 30 秒内完成。面对这种时间，很难感到焦急，学生有更多的时间专注于学习，而不必担心他的虚拟机是否会启动。此外，ISLET
    对学生来说是不需要配置的；配置由培训人员提供。这减少了某些学生因技术困难而落后于他人的可能性，每个人都在服务器上使用相同的配置。结果减少了压力和挫败感，提高了学生的整体培训体验。


    下一个要解决的问题是基于 Web 培训的常见问题。提供的软件环境通常是有限的或针对特定任务的临时。ISLET 并不是提供一个简化的解释器，而是赋予用户具有标准
    Unix 工具集的完整文件系统的权限和灵活性，学生在 Bash 等命令解释器中工作。学生不仅可以编写代码，还可以探索目录结构、系统文档，并利用系统上提供的强大工具来配合和增强所学习的软件。ISLET
    擅长基于命令行培训。


    最后，ISLET 使用的 Docker 引擎提供了反馈循环的来源。标准输出和错误的日志（其中包含了学生执行的命令）可供审查。培训人员可以发现学生犯的错误，并在此基础上通过将信息整合回课程来改进培训。例如，如果许多学生在代码或执行命令时犯了同样的错误，可能可以通过更好的解释或改进的指令在下次避免。老师可能没有像他们所能那样解释清楚，这就是为什么用户会犯错。


    # 真实世界用例：


    - 在 BroCon 14 发布了前身版本。用于教授 Bro 脚本，约 50 名用户同时在低端 (m3.xlarge) EC2 虚拟机上拥有 Bro 和 Unix
    工具的 shell 访问 - 毫无问题。

    - 伊利诺伊大学数字取证 2 课程。

    - FlowCon，数百用户。

    - 在 UIUC 的会议上教授 Linux 工具。


    名为 BroLive 的 ISLET 前身（也称为 Bro sandbox）已发布。这是一个旨在展示更好的培训方式的测试版本。它是为了解决我们提到的早期 Bro
    活动的问题而开发的。BroLive 用于教学 Bro 脚本并使用标准工具集（如 grep, awk 等）进行分析。我们有大约 50 名用户同时在容器中使用
    Bro。容器内安装了用于分析 Bro 输出的各种工具。机器托管在 Amazon 基础设施上的低端 EC2 虚拟机上。它的首次运行效果相当不错，并解决了它旨在解决的问题。


