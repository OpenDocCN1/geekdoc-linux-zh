    # Isolated, Scalable, and Lightweight Environment for Training


    A container system for teaching Linux based software with minimal participation
    effort. The participation barrier is set very low, students only need an SSH client.


    ISLET (Isolated Scalable and Lightweight Environment for Training) is a tool that
    I wrote that utilizes Docker to quickly provide various training environments
    that can be used for training events. It streamlines the process and is FOSS (Free
    and Open Source Software) available on Github.


    ## Using Containers in Training


    ### How does ISLET address the criticisms? To begin, the participation is very
    low, all one needs a remote access tool such as an SSH client. OpenSSH is a cross
    platform tool that is available on servers, smart phones, tablets, and supported
    by many operating systems. The student is therefore not banished to a workstation
    where a hypervisor depends upon as a result the choice of hardware is much greater.
    Next, recall that shared system training had an issue managing user accounts.
    Having to distribute usernames and passwords for students can be a pain for the
    trainers. ISLET allows users to create and manage their own accounts. Only one
    account is shared and that is to allow the users to remotely access the server
    ISLET. This is often something that can be displayed to all students like an SSID
    and wireless password. Every student will use it to connect to the system and
    be placed in the ISLET software where they will create their ISLET account, and
    be able to immediately gain access to a training environment. From the user''s
    point of view it takes a handful of seconds or two to end in a training environment
    ready to perform work. From the perspective of the trainer only a single account
    on the host needs to be created. In sum, most of the work regarding account management
    is eliminated. Continuing, updating training materials can easily be done by mounting
    a directory containing the materials from the host into the containers. Updating
    or correcting material in the host makes them immediately available to the users.


    Moving along, we''ll address the issue of waiting for virtual machines to boot
    and having to configure them. ISLET tells Docker to create containers that consist
    of the software the students will be instructed on. This can be anything from
    the GCC (GNU C Compiler) to an IDS (Intrusion Detection System). It happens to
    be that just about whatever you can install and run on a GNU/Linux system you
    can package into a Docker image. From the ISLET menu one can make a selection
    regarding the training environment they want to enter. The trainer can provide
    multiple options if they wish. There may be different environments with different
    software for different topics instead of using large image containing all the
    tools. Once a training environment is selected a user can perform work it in less
    than a second, it''s instantaneous. Being placed in a training environment can
    happen in less than 30 seconds from the initial connection to the ISLET system.
    It''s harder to feel impatient with that kind of time, the student has more time
    to get focused and not worry about whether his virtual machine is going boot up.
    In addition, ISLET is configuration-less for students; the configuration is provided
    by the trainer. This reduces the possibility of some students falling behind others
    due to technical difficulties, rather everyone is using the same configuration
    on the server. Less stress and frustration is experienced as a result which improves
    the overall training experience for the student.


    The next issue to address is common of Web based training. The software environment
    provided is often limited or ad-hoc for specific tasks. Instead of providing a
    simplified interpreter for ISLET is intended to give users the power and flexibility
    of a full file system with the standard unix toolset the student works from a
    command interpreter like Bash. Students can not only write code but explore the
    directory structure, system documentation, and take advantage of the powerful
    tools available on a system that can be used in conjunction with and to enhance
    the software to learn. ISLET excels at command-line base training.


    Finally, a source for a feedback loop is available in the Docker Engine which
    ISLET uses. A log of standard output and error which includes the commands students
    executed are available for review. Trainers can spot mistakes made by student
    and can build on that to improve their training by incorporating information back
    into the curriculum. For example, if a number of students make the same mistake
    in their code or executing a command it might be avoided next time by a better
    explanation or improved instruction. The instructor may not have explained something
    as well as they could that’s why users were making mistakes.


    # Real World Use Cases:


    - Launched the precursor at BroCon 14. Used to teach Bro scripting, ~50 users
    had shell access to Bro and unix tools in a container simultaneously on a lower
    end (m3.xlarge) EC2 VM - no problem.

    - University of Illinois Digital Forensics 2 course

    - FlowCon Bro training ~100 users

    - Used to teach Linux tools at UIUC LUG meetings


    The precursor to ISLET named BroLive! also known as Bro sandbox was launched at
    BroCon14. It was a beta release intended to demonstrate a better way to train
    at conferences. It was developed out of a need to address some of the issues we
    mentioned earlier that occurred at early Bro. BroLive was used to teach the Bro
    scripting language and to analyze Logs with standard toolset e.g. grep, awk, etc..
    We had roughly 50 users simultaneously working with Bro in a container that was
    launched by the tool. The container had installed along with various command line
    tools that were used to analyze the output of Bro. The machine was hosted on a
    lower end EC2 virtual machine on Amazon’s AWS infrastructure. It went pretty well
    for its first run, and addressed the problems it was meant to solve. Colleagues
    began to see value in the tool and became more cognizant of the state of IT software
    training. I set out to make it more software neutral and wrote much of it in my
    free time as was used to train others. It was later named ISLET which was coined
    by Adam Slagel of the National Center for Supercomputing Applications.


    It has since used in various settings, notably at the University of Illinois at
