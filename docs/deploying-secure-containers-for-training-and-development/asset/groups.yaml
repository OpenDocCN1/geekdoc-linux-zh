    # ABOUT THE AUTHORS


    **Henry Dalziel** is a serial education entrepreneur, founder of Concise Ac Ltd,
    online cybersecurity blogger, and e-book author. He writes for the Concise-Courses.com
    blog and has developed numerous cybersecurity continuing education courses and
    books. Concise Ac Ltd develops and distributes continuing education content [books
    and courses] for cybersecurity professionals seeking skill enhancement and career
    advancement. The company was recently accepted onto the UK Trade & Investment''s
    (UKTI) Global Entrepreneur Programme (GEP).


    **Jon Schipp** is a Security Engineer at the National Center for Supercomputing
    Applications, Director of Security at Dracony, as well as the founder and chair
    of OpenNSM at the University of Illinois at Urbana-Champaign. He is the author
    of ISLET, among other tools, as well as a contributor to Free and Open Source
    Projects including The Netsniff-NG Toolkit, SecurityOnion, and the Bro Project.
    With a few publications and many talks, he has been fortunate enough to have audiences
    at various conferences including DerbyCon, AIDE, Hack3rCon, BroCon, XSEDE, MOSSCon,
    and more. In his free time, he enjoys reading about history and philosophy, listening
    to death metal and playing recreational volleyball.


    # INTRODUCTION


    I first started looking into containers as a way to scale training environments
    for BroCon 2014. We were trying to find a more sufficient solution to teach the
    Bro programming language that involved less setup time. We found that we can have
    hundreds of training environments on a single host, rather than distributing large
    machine files to all conference users. Upon research and experimentation, I found
    that Linux containers were a good solution to the problem. I since explored ways
    to further apply this technology to other remote areas, which include deploying
    secure containers for training and development. This short book is intended to
    present concepts and to spark ideas rather than a walkthrough or tutorial of software.
    My name is Jon Schipp; I''m a Security Engineer at the National Center for Supercomputing
    Applications (NCSA) at the University of Illinois at Urbana-Champaign. The NCSA
    takes advantage of high-performance computing to facilitate scientific research.
    I am also the Director of Security at Draconyx, a full-service IT consulting business
    that specializes in information security. In addition, I have contributed to a
    number of free and open source projects, including the Netsniff-NG Toolkit, Security
    Onion, and the Bro Project. I am the founder and chair of OpenNSM, which is a
    weekly network monitoring group with international participation.


    # Project Contributions


    - Bro Team

    - The Netsniff-NG Toolkit


    # CHAPTER 1


    # Containers


    # Our Focus:


    Excels at teaching command-line software on Linux


    - Event training

    - Internal software training

    - Development environments

    - Playing around


    Containers are typically used to deploy web applications and software stacks.
    An example of this is deploying software such as WordPress, MySQL, or just hosting
    your website in a container running Apache or NGINX. Reproducibility and scalability
    are two benefits of deploying with containers. You can think of container as a
    package of software including libraries, services, and the application itself.
    Having your application and all its dependencies wrapped up in a container allows
    you to deploy it to any system that uses the same container runtime engine or
    container specification. Reproducibility is achieved in that way, in addition
    it is easily scalable across multiple systems when network traffic is high or
    provides redundancy when a system needs an upgrade. All you need to do is configure
    the container to run on multiple systems and tell a load balancer to redirect
    traffic. Tools like Kubernetes, Docker Swarm, and others make it easy to scale
    containers across hosts. While these are typical uses, we will look into the use
    of containers for software development and training. For example, we can utilize
    Linux containers to provide a package of a filesystem containing all the common
    tools used for training on the GNU/Linux operating system. Another example is
    to compile and run applications for testing and deployment without installing
    them on your host filesystem. The result of which ends providing a tidier filesystem
    and eliminates inconveniences of managing multiple versions of shared libraries
    or programs.

    '
