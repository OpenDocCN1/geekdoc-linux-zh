    \ mapping users such as root inside a container to an newest of them and not implemented\
    \ in all runtimes at the time of this writing. An example of the PID namespace\
    \ follows. Process Z is assigned to namespace A and process Y is assigned to namespace\
    \ B. A user enters namespace A and runs top sees Process Z, correspondingly a\
    \ user namespace B and runs top but only sees Process Y. The same with root entering\
    \ namespace A or B and running top. Though, if not on the global namespace the\
    \ root user can see that Process Z is running in namespace A and Process Y is\
    \ running in namespace B. You can see that the PID namespace effectively isolates\
    \ the view of the operating system. Note that namespaces don't have names, rather\
    \ they have inode numbers, letters were assigned to simplify expressions. Another\
    \ example includes the Network namespace which allows each container to have its\
    \ own network interface and IP address to make a request to the URL of the Apache\
    \ process running in namespace A and get an entirely different website from the\
    \ Apache process running in namespace B with a different URL. Apache in namespace\
