    # 第 2 章

    在培训中使用容器


    ## 问题 1. 培训


    IT 培训并非易事


    既然我们已经涵盖了主要的概念、实现和安全实践，我们将介绍用于培训和开发的用例。我们首先处理用容器解决 IT 培训问题。IT 培训问题的总结是，为基于软件的培训创建和部署培训环境相当困难且耗时。我参加过许多涵盖并行编程、网络安全监控、恶意软件分析以及各种语言编程等主题的培训活动，我发现培训的一种常用方法是分发虚拟机。这通常在活动开始前通过下载链接完成，或者在活动期间通过
    USB 闪盘等介质进行分发。这两种方法对用户和培训提供者来说都是很麻烦的。对于用户来说，他们必须花宝贵的时间下载磁盘镜像（这些镜像可能有几个 GB 大），而且可用的软件通常是一个虚拟机监控程序。这个大型软件被用来运行虚拟机，然后就会出现虚拟机监控程序兼容性的问题，例如，它是否是可以在
    Oracle 的 VirtualBox 或 VMware/Fusion 等上运行的镜像。我曾见证过为了给会议参与者分发一个磁盘镜像而花费了一个多小时，这导致了用户培训时间的损失。一旦磁盘镜像在工作站上随处可见，会有几个用户在运行镜像时遇到问题。我曾见证过网络和总线配置中的错误配置。这些问题往往会导致学生落后于小组中的其他人，特别是当工作人员无法提供协助时。活动的网络基础设施通常很慢或饱和，这种情况发生的频率比你想象的要多。它阻止或延长了磁盘镜像、培训材料或在线资源的传输。场馆设备无法容纳如此数量的学生或他们在无线网络上的流量习惯。


    培训材料的分发也可能出现问题。培训材料中的错误会导致其不完整，直到在培训期间需要时才被察觉。如果有错误，我脑海中最好的方案是学生可以快速获得新更新的材料。将材料打包在虚拟机中是不可行的。但如果网络可靠，将它们放在网络可访问的存储库或网站上是有效的。


    账户管理是我想要提出的最后一个关注点。在访问需要账户凭据来验证用户的资源时，这是一个关注的问题。管理员必须为学生创建并分发这些凭据，理想情况下以自动方式进行，否则将是一项耗时且枯燥的工作。这在虚拟机培训中问题不大，但在提供我所说的“共享托管培训”的环境中就会出现。共享主机是一个用户使用自己的账户远程交互以进行培训的系统。最常见的例子是使用
    SSH 访问类 Unix 系统。账户用户名和密码必须分发给每个用户。我曾在现场看到这种情况，通过在房间里传阅写有每个学生凭据的纸条。


    # 常见的 IT 培训类型


    1. 共享系统培训（多个账户）

    2. 虚拟机培训（每个学生一个虚拟机）

    3. 容器培训（每个学生一个容器）

    4. 基于 Web 的培训


    在讨论解决方案之前，我想介绍我见过的不同培训环境。第一是上述的共享系统培训，单台服务器为多个用户提供访问。如果你要培训 100 个用户，系统中就有相应数量的账户。如
    SSH 等远程访问工具会将用户连接到系统。这种类型培训的不便之处在于账户的创建和分发，以及缺乏对用户足够的隔离。


    第二种培训类型是虚拟机培训。这是我见过的最常见的。我参加过许多会议，他们依赖于给所有参与者分发虚拟机磁盘镜像。这类培训的主要问题是分发、软件依赖、软件兼容性和硬件资源。由于虚拟机监控程序是消耗资源的大型软件，因此实际上禁止使用平板电脑和手机等移动设备。一个优点是用户被允许保留该虚拟机。这允许他们在未来的任何时候都能在该环境中工作。在某些情况下，例如进行内核工作、管理网络配置和实现网络服务，虚拟机是最佳解决方案。


    此外，还有使用操作系统虚拟化技术（如我们讨论的 Linux 容器）进行培训的情况。这是我探索过并发现非常有用的培训媒介。对于这种类型，我们在单台主机上为每个学生分配一个容器。用户登录主机并被放置在他们自己的容器中，从那里他们与一个隔离但全功能的环境进行交互。


    最后，我们有基于 Web 的培训。基于 Web 的培训是一种提供某种嵌入网页的交互式软件（如 shell 或解释器）的方法。Go 编程语言在他们的网站上有一个在线教程，允许你尝试该语言。同样，Bro
    项目有 try.org，人们可以在那里编写代码并直接在网络浏览器中返回结果。但基于 Web 的培训方法通常限于完成简短的临时任务，并仅提供软件功能的子集。需要让学生沉浸在需要使用多种软件并协同工作的环境中的培训师，应该考虑其他培训类型。

    '
