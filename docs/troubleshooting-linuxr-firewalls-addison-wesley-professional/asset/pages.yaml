  md: '# CHAPTER 14 SMTP (E-MAIL)


    Filter rules themselves, we feel, are not a realistic mechanism for dealing with
    spam; there are too many bad guys coming from too many IPs to realistically create
    a mechanism in iptables. A better option would be to use one of the RBL (http://www.mail-abuse.com/)
    services in your MTA itself. Even these services are not a silver bullet in fighting
    spam, which is why we opt for either content-filtering systems, such as spamassassin
    (http://www.spamassassin.org), a DSPAM (http://www.nuclareelephant.com/projects/dspam/),
    or challenge-response systems such as TMDA (http://tmda.net/).


    That being said, this chapter should leave you with a a good understanding on
    how to create host-based firewall rules or DMZs to contain your mail servers.
    The rules themselves are intended to be self-contained, so you should not have
    to reference other chapters to get something working on your firewall right away.'
