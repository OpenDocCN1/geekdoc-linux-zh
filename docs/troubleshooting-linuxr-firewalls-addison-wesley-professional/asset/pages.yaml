  md: "# CHAPTER 17 INSTANT MESSAGING\n\nSupportNATEndEndpoints=1\n[RasSvr::ARQFeatures]\n\
    CallUnregisteredEndpoints=1\n[Proxy]\nEnable=1\n[GkStatus::Auth]\nrule=allow\n\
    \nYou also can more or less control the ports that are used using the following\
    \ parameters in the config file:\n\n+   [RoutedMode]\nQ931PortRange=20000-20020\n\
    H245PortRange=30000-30010\n[Proxy]\nT120PortRange=40000-40010\nRTPPortRange=50000-59999\n\
    \nWe recommend the use of the the gatekeeper. The gatekeeper will permit you to\
    \ make calls from an internal GnomeMeeting to external GnomeMeeting and NetMeeting\
    \ users. External GnomeMeeting and NetMeeting users will have to register to the\
    \ gatekeeper to be able to call you your alias.\n\n# BLOCKING OUTBOUND NetMeeting/GnomeMeeting\
    \ TRAFFIC\n\nBlocking outbound Net/GnomeMeeting traffic is a fairly basic iptables\
    \ filter rule:\n\n```\n# these rules will log attempts to use Net/GnomeMeeting\n\
    $IPTABLES -A FORWARD -p tcp --dport 1503 -m limit \\\n    --limit 1/second -j\
    \ LOG --log-level info \\\n    --log-prefix \\\n    \"Policy Violation: Net/Gnome\
    \ meeting: \"\n$IPTABLES -A FORWARD -p tcp --dport 1720 -m limit \\\n    --limit\
    \ 1/second -j LOG --log-level info \\\n    --log-prefix \\\n    \"Policy Violation:\
    \ Net/Gnome meeting: \"\n```\n\n```\n# and these will drop the connections\n$IPTABLES\
    \ -A FORWARD -p tcp --dport 1720 -j DROP\n$IPTABLES -A FORWARD -p tcp --dport\
    \ 1503 -j DROP\n```\n\nEnsure that these rules appear before any global ALLOW\
    \ rules of course!"
