  md: "# FORWARD: FILTERING ACCESS TO A FORWARDED SERVER\n\nThis next rules shows\
    \ how to limit the hosts that can connect to the forwarded web server. In this\
    \ example, our firewall, Host-A, forwards connections to the internal server Host-B\
    \ (192.168.1.80). The following network is allowed to connect, 22.33.44.0/24 (Internet)\
    \ to TCP ports 80 and 443.\n\nThis first configuration demonstrates the rules\
    \ needed to achieve this type of configuration using DNAT rules:\n\n```\n# eth0\
    \ is the external interface (Internet)\n# eth1 is the internal interface (10.10.10.0/24)\n\
    # eth2 is the DMZ interface (192.168.1.0/24)\n# EXTERNALIP is the external IP\
    \ on your firewall\n# 192.168.1.1 is the internal IP address on the\n# firewall1\
    \ eth2 interface\n\nIPTABLES -A FORWARD -i eth0 -o eth2 -p tcp \\\\\n  -s 22.33.44.0/24\
    \ --dport 80 -m state \\\\\n  --state NEW,ESTABLISHED,RELATED -j ACCEPT\nIPTABLES\
    \ -A FORWARD -i eth0 -o eth2 -p tcp \\\\\n  -s 22.33.44.0/24 --dport 443 -m state\
    \ \\\\\n  --state NEW,ESTABLISHED,RELATED -j ACCEPT\n```\n\n```\n# For our internet\
    \ users from 22.33.44.0/24\nIPTABLES -t nat -A PREROUTING -i eth0 -p tcp \\\\\n\
    \  -s 22.33.44.0/24 --dport 80 -d $EXTERNAL \\\\\n  -j DNAT --to-destination 192.168.1.80:80\n\
    ```\n\n```\nIPTABLES -t nat -A PREROUTING -i eth0 -p tcp \\\\\n  -s 22.33.44.0/24\
    \ --dport 443 -d $EXTERNAL \\\\\n  -j DNAT --to-destination 192.168.1.80:443\n\
    ```\n\n# OUTBOUND: SOME WEBSITES ARE INACCESSIBLE (ECN)\n\nThe symptoms of this\
    \ problem are that in general, you reach most websites with no performance or\
    \ other issues; a small portion of websites, however, cannot be reached. This\
    \ is a common problem with the Explicit Congestion Notification (ECN) feature\
    \ of the Linux kernel. If you have compiled this into your kernel and cannot connect\
    \ to a small segment of non-Linux web servers, this is the most likely culprit.\
    \ The fix is to disable ECN in your kernel."
