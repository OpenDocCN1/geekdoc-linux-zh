    \ Open this file in your preferred editor and change the following lines:\n\n\
    ```\nforwarders {\n    11.22.33.44;\n    11.22.33.45;\n}\n```\n\nSet these numerical\
    \ IP addresses to correspond with your upstream Internet responding nameservers.\n\
    \n+   3. Configure your nameserver to listen only on your internal interface(s).\
    \ By default, when you start the nameserver, it will bind to all interfaces, including\
    \ the external ones. Open the named.conf file with your preferred editor and modify/create\
    \ the following lines in the Options section:\n\n```\nlisten-on {\n    10.10.10.1;\n\
    }\n```\n\nSet these numerical IP addresses to correspond to your firewall's internal\
    \ interfaces.\n\n+   4. Allow DNS requests to your firewall from hosts on your\
    \ internal network. In our example, the internal network is 10.10.10.0/24 with\
    \ the following rule:\n\n```\n$IPTABLES -A INPUT -p tcp --dport 53 -i eth1 -j\
