  md: "# CHAPTER 16 FILE SERVICES (NFS AND FTP)\n\n# NFS: CANNOT GET NFS TRAFFIC TO\
    \ TRAVERSE A NAT OR IP\nFORWARDING FIREWALL\n\nNFS is an RPC service that typically\
    \ does not use predictable port numbers, which makes RPC services in general difficult\
    \ to process effectively through netfilter.\nFortunately, NFS is an exception.\
    \ While it is an RPC service, it actually does use predictable port numbers, which\
    \ makes it less of a chore to process through firewall rules.\n\t\t\tIn this configuration,\
    \ you have an NFS server (Host-B, 10.10.10.100) on one side of the firewall (Host-A)\
    \ on the network 10.10.10.0/24 and one or more clients on the other side of the\
    \ firewall in the network 192.168.1.0/24. Clients cannot successfully mount exported\
    \ drives from the NFS server.\n\n![](img/9e2290071e555156f9bb68f2189d9345_297_0.png)\n\
    \nFigure 16.1 NFS traffic cannot traverse the firewall.\n\nTo forward or route\
    \ to an NFS server firewall, we will first need to make some configuration changes\
    \ to the NFS server itself to ensure that it is using the same consistent ports—due\
    \ to the somewhat dynamic nature of RPC services port selection. Fortunately NFS\
    \ is more \"tame\" than most other RPC services, so we will not need to make a\
    \ great number of changes on the server itself to ensure consistent operation.\n\
    This example covers two types of complex configurations—the first assumes that\
    \ the firewall is the destination for the NFS mount requests and forwards these"
  merge: -1
  pgno: 297
- img_proc: true
  md: 'connections to the real NFS server. The following documentation assumes you''re
    using a Linux NFS server:


    +   - Portmapper, TCP/UDP ports 111: No changes need to be made; this is the default
    port.

    - rpc.nfsd, TCP/UDP port 2049: No changes need to be made; this is the default
    port.

    - rpc.statd, TCP/UDP port 4000: On a Redhat system, this is started from the /etc/init.d/nfslock
    script. Open this file in your preferred editor and change the following line:


    ```

    daemon rpc.statd

    ```


    to


    ```

    daemon rpc.statd -p 4000

    ```


    +   - rpc.lockd, TCP/UDP port 4001: On a Redhat system, this is generally a kernel
    module, so we will need to modify the /etc/modules.conf file to pass in the parameters
    to this component. Open /etc/modules.conf in your preferred editor and set the
    following:


    ```

    options lockd nlm_udpport=4001 nlm_tcpport=4001

    ```


    For nonmodular kernels you will need to set this in your boot loader, lilo or
    grub with the following:


    ```

    lockd.udpport=4001 lockd.tcpport=4001

    ```


    +   - rpc.mounted, TCP/UDP port 4002: On a Redhat system, this is configured from
    /etc/sysconfig/nfs. Load this file into your preferred editor and set the following:


    ```

    MOUNT_PORT=4002

    ```


    +   - rpc.quotad, TCP/UDP port 4003: On a Redhat system, this is set from the
    /etc/services file. Load this file into your preferred editor and set the following:


    ```

    rquotad 4003/tcp

    quotad 4003/udp

    ```'
