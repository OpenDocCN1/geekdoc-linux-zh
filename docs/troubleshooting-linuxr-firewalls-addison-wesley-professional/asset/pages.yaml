  md: "$SIPTABLES -A OUTPUT -m state --state NEW,ESTABLISHED,RELATED -j ACCEPT\n\n\
    $SIPTABLES -A INPUT -p tcp --dport 22 -m state \\\n  --state NEW -j ACCEPT\n$SIPTABLES\
    \ -A INPUT -p tcp --dport 21 -m state \\\n  --state NEW -j ACCEPT\n\n# this rule\
    \ allows the server to perform DNS lookups\n$SIPTABLES -A INPUT -A INPUT -p udp\
    \ --udp \\\n  -s DNSSERVER --sport 53 -d 0/0 -j ACCEPT\n\nThis example is right\
    \ from the Redhat firewall rule generator; it demonstrates a completely different\
    \ method that achieves a similar effect. The key difference is that the former\
    \ rules use netfilter's stateful filtering to control new connection, whereas\
    \ the following ruleset use a simpler and less secure method of determining if\
    \ a connection is new. Specifically, the following rules use the -syn rule to\
    \ check the headers of the TCP packet to determine if it is part of an initial\
    \ connection attempt. In theory, this would only allow connections to the services\
    \ allowed in these rules.\n\n# where $DNSSERVER is the IP address of your DNS\
    \ server.\n$SIPTABLES -N RH-Lokkit-0-50-INPUT\n$SIPTABLES -A INPUT -j RH-Lokkit-0-50-INPUT\n\
    $SIPTABLES -A FORWARD -j RH-Lokkit-0-50-INPUT\n$SIPTABLES -A RH-Lokkit-0-50-INPUT\
    \ -p tcp -m tcp \\\n  --dport 22 --syn -j ACCEPT\n$SIPTABLES -A RH-Lokkit-0-50-INPUT\
    \ -p tcp -m tcp \\\n  --dport 21 --syn -j ACCEPT\n$SIPTABLES -A RH-Lokkit-0-50-INPUT\
    \ -i lo 10 -j ACCEPT\n$SIPTABLES -A RH-Lokkit-0-50-INPUT -p udp -m udp \\\n  -s\
    \ DNSSERVER --sport 53 -d 0/0 -j ACCEPT\n$SIPTABLES -A RH-Lokkit-0-50-INPUT -p\
    \ tcp -m tcp \\\n  --syn -j REJECT\n$SIPTABLES -A RH-Lokkit-0-50-INPUT -p udp\
    \ \\\n  -j REJECT\n\n# FTP INBOUND: RESTRICTING ACCESS WITH FIREWALL\n\nThis ruleset\
    \ shows how to perform the same as the previous section but limiting the hosts\
    \ that can connect to the FTP server. In our example, the FTP server Host-A is\
    \ using"
