  md: '# netfilter and iptables

    Overview


    The first thing to get out of the way is that netfilter and iptables are not the
    same thing. They are largely written by the same group of developers, but they
    are very different parts of a whole. netfilter comprises the kernel level code
    that Linux can use to conduct packet filtering, state management, NAT, packet
    mangling, QoS, and other neat tricks. iptables is the userland tool that can manipulate
    kernel hooks to do these things for you. It''s important to point this out because
    there are other userland tools that use netfilter as well and that can also accomplish
    some pretty neat tricks.


    # How NETFILTER WORKS


    Starting with 2.4 of the Linux kernel, a complete rewrite of the “firewalling”
    code was undertaken. Because of this, 2.4 and greater kernels now have the ability
    to do stateful packet management. This means no more strange rules to prevent
    SYN packets from going the wrong way; the kernel will maintain state on outbound
    (or inbound for that matter) connections and open external ports for you as needed
    and only allow back the packets that it''s supposed to track for that specific
    connection. From this comes the term “connection tracking,” which you will hear
    about frequently in later chapters.


    It also means things completely changed from the old style of userland management
    tools, iptchains, to the new standard tool, iptables.


    First, let''s briefly discuss the differences between iptchains and iptables.
    iptchains is the userland tool used under 2.0 and 2.2 Linux kernels to manage
    firewall rules. It is not stateful but still allows one to set up some fairly
    strong firewall rules. It''s important to'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# CHAPTER 6 NETFILTER AND IPTABLES OVERVIEW


    note that without the ability to manage state, the 2.0 and 2.2 firewalling code
    is limited in terms of the traffic it can adequately and safely control. It is
    for this reason that we strongly advise to use the newer netfilter firewalling
    capabilities in the 2.4, 2.5, and 2.6 kernels, netfilter is such a fantastic improvement
    that we can''t recommend it enough.


    Because the internal firewalling code between 2.0 and 2.2 kernels is different
    from 2.4 and 2.6 kernels, the use of ipchains on 2.4 and 2.6 kernels is largely
    an illusion. When ipchains is used with 2.4 and 2.6 kernels, it is through a compatibility
    layer that basically attempts to translate ipchains rules into the netfilter format.
    This doesn''t always work correctly, which is yet another reason not to use ipchains.
    Even though the internals are different, when you get a feel for the new features
    in iptables, it is not difficult to convert ipchains rules to iptables. Also given
    some of the powerful new features, there is all more reason to make the netfilter
    worth.


    # HOW NETFILTER PARSES RULES


    The value of understanding how netfilter parses rules can''t be understated. The
    rules are parsed in different order depending on which chain you choose to use.
    For instance, the SNAT, DNAT, and FORWARD chains are part of a different path
    in the kernel. Traffic destined for the firewall versus being routed by the firewall
    takes two independent paths through the netfilter decision criteria.


    This last point is really the most critical one with iptables. INPUT and FORWARD
    rules are on two totally different paths, and they make up the key split in what
    rules will be triggered as a packet moves through your firewall. Let''s take a
    look at some examples.


    Our first case is what happens when a packet is sent from some remote host to
    service running on our firewall. This is different from what happens when a packet
    is sent through the firewall and then on to some different system for processing.


    # Packet Sent to Service Running on Firewall from Remote Host (INPUT) Steps:


    +   * Packet is sent from remote client.

    * Packet received by physical interface(s).

    * Packet is processed by the kernel driver.

    * Packet is processed by the networking protocol(s) layer(s).

    * Packet is processed by netfilter in this order.

    * PREROUTING mangle (TOS, etc).

    * PREROUTING NAT

    * Routing decision: Is the packet for the local box, or is it to be forwarded
    to another system by us?'
  merge: -1
