  md: '# CHAPTER 7 DIAGNOSTICS


    The kernel will try to automatically set the maximum number of connections it
    can handle based on the amount of RAM in your system. You can see this by looking
    at your logs on bootup. If your machine has not been rebooted in a while, you
    might need to check messages.1, messages.2, and so on.


    ```

    cat /var/log/messages | grep ip_conntrack

    ip_conntrack version 2.1 (4095 buckets, 32760 max) - 360 bytes per conntrack

    ```


    After you have this information, you can tell what the maximum recommended setting
    for your system should be and then compare with what your system is set to support
    by looking once again in /proc:

    cat /proc/sys/net/ipv4/ip_conntrack_max

    32760


    On our system, the value returned was "32760", which is exactly the "safe" limit.
    In reality, the system can handle significantly more than 32K connections with
    512MB of memory. For 32,760 connections, with a connection size of around 360
    bytes on our test system, that''s only 11,793,600 bytes, or around 11.8MB of memory
    used. But that''s for the memory used per connection and the maximum number of
    connections. It might be tempting to change the value in /proc/sys/net/ipv4/ip_conntrack_max,
    but do not do this without reading on. Changing this value alone will only increase
    the number of connections to track but not the amount of buckets allocated for
    those connections. This will actually cause a decrease in performance by making
    the collision chains longer.


    According to published information about the engine, the ultimate ratio for performance
    is 2:1 for buckets to connections. So if you want to track 32,760 connections,
    you need to increase the number of buckets as well.


    If you want to increase the number of connections the engine is managing, you
    can modify it by increasing the hashsize allocated for the module ip_conntrack.


    ```

    modprobe ip_conntrack hashsize=16380

    ```


    This will need to be run when the ip_conntrack module is first loaded. In 2.4
    with a monolithic kernel (a kernel without module support), the only way to change
    this value is by altering the kernel source. For 2.6, module parameters can be
    specified in a generic manner from the boot command line. Returning to the'
