  md: 'If you just want a simple means of tricking traceroute, just rely on the rules
    detailed here. They work like magic.


    # STATE TRACKING RULES


    You can now add in your ESTABLISHED and RELATED rules. As most packets will fall
    into one of these categories, it makes sense to put these rules near the top of
    your firewall rulesets before your other ACCEPT rules. However, we prefer not
    to put these rules ahead of our sanity checking rules. Remember, iptables is linear.
    Rules are matched in the order from first added to last added, so if you have
    a rule to drop spoofed packets after your RELATED or ESTABLISHED rules, then spoof
    detection will not occur on ESTABLISHED or RELATED packets. To keep things simple,
    we prefer to set up our rules using a simple principle, DROP before ACCEPT. We
    do not set up any rules to ACCEPT until we are finished with all of our specifically
    defined DROP rules. Keep in mind, though, that we are not talking about your final
    DROP rules—those come last.


    ```

    echo established and related

    iptables -A INPUT -m conntrack -ctstate \

    ESTABLISHED, RELATED -j ACCEPT

    iptables -A OUTPUT -m conntrack -ctstate \

    ESTABLISHED, RELATED -j ACCEPT

    iptables -A FORWARD -m conntrack -ctstate \

    ESTABLISHED, RELATED -j ACCEPT

    ```


    # STEALTH RULES


    This next ruleset uses the STEALTH module from http://www.security.net/download.php.
    From the STEALTH module documentation:


    Enabling this option will drop all syn packets coming to unserved tcp ports as
    well as all packets coming to unserved udp ports. If you are using your system
    to route any type of packets (i.e., via NAT) you should put this module at the
    end of your ruleset, since it will drop packets that aren''t going to ports that
    are listening on your machine itself. It doesn''t take into account that the packet
    might be destined for someone on your internal network if you''re using NAT for
    instance.'
  merge: -1
