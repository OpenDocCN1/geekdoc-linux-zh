  md: '# UNDERSTANDING TCP


    TCP stands for the Transmission Control Protocol and is situated in Layer 4 of
    the OSI model. It is a connection-oriented service and handles the transfer of
    data, flow control, reliability, and multiplexing all in one protocol. TCP is
    a very robust protocol and can handle most error conditions with automated recovery.
    TCP is a good protocol for higher-level protocols, such as HTTP and SMTP, that
    do not have built error recovery and flow control capabilities. But TCP is not
    ideal for protocols that handle this internally, such as VPN protocols, which
    are tunneling connections within. With VPNs, UDP is the better protocol to use.
    We discuss this in more detail later in this chapter when we cover UDP.


    There are 13 fields in a TCP Packet. They are (from left to right):


    +   1. **Source Port**: The port number the packet was sent from the source machine.

    2. **Destination Port**: The port number the packet is being sent to the remote
    machine.

    3. **Sequence Number**: Either an initial number sequence used in the upcoming
    transmission or number assigned to the first byte of data in the current message.

    4. **Acknowledgment Number**: The sequence number for the next byte of data.

    5. **Data Offset**: The number of 32-bit words in the TCP header.

    6. **Reserved**: Set aside for future use.

    7. **Flags**: Control information for the packet. SYN, ACK, FIN, RST, URG, and
    PSH flags are part of this field.

    8. **Window**: Size of the sender''s buffer space available for incoming data.

    9. **Checksum**: A checksum of the header to determine if it was damaged during
    transmission.

    10. **Urgent Pointer**: Location of the first urgent data byte in the packet.

    11. **Options**: TCP options.

    12. **Padding**: The padding field is used when alignment is needed or sometimes
    used with encryption, such as IPSEC.

    13. **Data**: The actual message or content being sent by the TCP packet.


    TCP provides many additional capabilities, such as reliability, efficient and
    varied methods of flow control (Linux has the capability to modify this further
    through /proc as detailed in later chapters), full-duplex communication, multiplexing,
    and streaming.'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'With streaming, TCP can deliver bytes in an unstructured form identified by
    sequence numbers. This is used when an application does not or cannot break data
    into blocks that fit efficiently on the network. TCP is left to work this out
    for the application. In these cases, TCP groups the packets together into what
    are called sequences, based on internally determined maximum sizes based on network
    conditions and the way the system is configured.


    # Reliability


    TCP provides reliability to data through full duplex connections. Unlike UDP,
    TCP packets always receive acknowledgment from the receiver, or they are sent
    until acknowledged. TCP accomplishes this by performing what is called “forward
    acknowledgment” by adding in an Acknowledgement number for the next byte of data
    source expects the receiver to receive. A specified amount of time is tracked
    by the sender, and if the block of data is not acknowledged within that period
    of time, the packet is sent again to the receiver. This makes it possible for
    TCP to respond to lost or damaged packets reliably. The receiver may also request
    that a packet be resent.


    # Full Duplex and Multiplexing


    TCP is truly full duplex, which means that the protocol can be used to both send
    and receive data at the same time. TCP also can be used to perform multiplexing,
    which means that many simultaneous connections and conversations are conversing
    over one connection. This is accomplished via upper layers of the OSI model through
    higher-level protocols, such as SMTP and HTTP for instance.


    # Flow Control


    Flow control is another feature of TCP. Flow control is defined as a technique
    used to stop the sender of data from sending more data than the receiver can accept.
    This is achieved through the use of sequence numbers, where the receiver sends
    back the sequence number it can receive without exceeding its receive buffers.
    The sender is supposed to transmit packets up to but not exceeding that sequence
    number, and then the sender is to wait until the receiver sends another ACK packet
    with a higher sequence number. There are a number of algorithms to achieve this,
    many of which are configurable through /proc under Linux. More detail on this
    is provided in later chapters.'
  merge: -1
  pgno: 96
- img_proc: true
  md: '# CHAPTER 3 THE OSI MODEL START FROM THE BEGINNING


    # Congestion Control


    TCP also provides for what is called congestion control by adapting network conditions
    to slow down or speed up the rate at which packets are sent. This is to respond
    to the “common” reality of IP networks, where guaranteed flow rates are difficult
    to accomplish and packets are lost due to overloaded routers, switches, hosts,
    and any other device in the path.


    # How TCP Connections Are Established


    TCP, unlike UDP, is designed to operate via fully established connections. It
    is not a broadcast protocol, but a true three-way communications protocol. Nothing
    is assumed with TCP until both the receiver and sender acknowledge the communication.
    To do this, TCP uses a three-way handshake to establish a new connection and to
    synchronize the hosts on both ends to each other’s capability to receive and send
    data. If you recall the sequence numbers discussed earlier, this is how TCP accomplishes
    flow control and reads both sides to send and receive data at that established
    rate. This helps to prevent unnecessary packet retransmissions.


    As each host starts the process, it is supposed to randomly pick a sequence number.
    It’s worth noting that not all random number generators are the same. Some OSs,
    including some Linux kernels, may not pick sequence numbers that are truly random.
    This may seem unimportant, but there are a number of attacks on TCP streams that
    are accomplished by predicting the next sequence number and spoofing the next
    packet in a stream to “hijack” the stream. A good random number generator for
    your sequence numbers helps to protect against these sorts of attacks and also
    makes certain types of DoS and DDoS bounce attacks more difficult against your
    systems. Frankly, there are patches for the Linux kernel that make the sequence
    numbers and other random numbers used by the IP stack truly random.


    After the hosts have picked random numbers to use as their sequence numbers, the
    host that is initiating the connection, Bob sends a TCP packet to the receiver,
    Alice, with the initial sequence number, XY, and the SYN flag set in the header
    of the packet. Alice, the receiver, processes the packet, records the sequence
    number XY, and sends back a packet to Barrett with the acknowledgment field set
    to XY+1. The receiver increments the original sequence number by 1. Alice also
    adds its own initial sequence number to the packet, Z, and sets the ACK flag in
    the headers of the TCP packet. Each host then increments these sequence numbers
    by the number of bytes of data it has successfully received from the other host.
    This acts as a mechanism for each host to limit the amount of data sent in each
    packet to only the data the other party needs and can receive.'
