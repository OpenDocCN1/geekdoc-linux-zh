- img_proc: true
  md: '# # Diagnostics


    The intent of this chapter is to provide general technical guidance for troubleshooting
    firewall problems that this book does not directly cover in Section III. We have
    taken great pains in Section III to research some of the most common and not so
    common problems users have encountered with iptables firewalls, but we cannot
    cover every possible protocol or configuration—hence the purpose of this chapter.
    It is our hope that this chapter provides enough info about how we diagnose new
    and fabulously obscure problems with the firewalls we build. We''ve been able
    to solve every problem so far by applying a solid troubleshooting methodology
    and by using these techniques and tools.


    # DIAGNOSTIC LOGGING


    This first trick to figuring out what''s causing a strange problem with your firewall
    is to log everything netfilter is doing. Logging will help you to keep a record
    of how your rules are being executed, and a sniffer can give you visibility into
    the packets themselves to determine why a connection is behaving in a certain
    manner. As opposed to normal logging, which consists of logging behavior you want
    to know about, such as suspicious behavior or providing audit trails for certain
    connections, diagnostic logging is all about verbosity. You want to see things
    that you normally would not want to log, such as the execution of all your rules—even
    packets that you normally allow and do not care about. Naturally, this form of
    logging is not something you normally want to do with your logs, as it can fill
    them up with tons of information that you don''t care about. Therefore, these
    techniques are only for diagnostic purposes and are not recommended for ongoing
    use'
  merge: -1
  pgno: 182
- img_proc: true
  md: "# CHAPTER 7 DIAGNOSTICS\n\nwith production firewalls. They can fill up your\
    \ logs quickly and might also reduce performance- on the firewall.\n\nThe goal\
    \ with diagnostic logging is to see everything. You don't want to assume that\
    \ something is working or that a packet is taking one route through one chain,\
    \ INPUT for instance, when it's really being handled by the FORWARD chain. By\
    \ logging everything, you can empirically ascertain the actual sequence of events.\n\
    \n# Scripts To Do This For You\n\nIn classic engineer form, we prefer to use good\
    \ scripts to add in and remove logging rules for us-on-fly. You can always add\
    \ in rules manually, but we prefer to have tools at our disposal to diagnose problems\
    \ quickly so that we can start ruling false root causes.\n\n```\n#!/bin/bash\n\
    # $ Id iptables-trace,v 1.14 2004/11/13 00:31:15 apc Exp $\n# Tony Clayton -ct\
    \ ny-netfilter@clayt n.ca>\n\n# You may use and edit this code freely. If you\
    \ make changes to\n# it that are generally useful, please email them to me and/or\n\
    # post them on the netfilter mailing list.\n\nLOGPREFIX='${table:0:1}:${chain:0:14}$rulenum:${target:0:14}'\n\
    \nlog_entry() {\n  local action=$1\n  local table=$3 chain=$5\n  shift 5\n  if\
    \ [ \"$last_chain\" != \"$chain\" ]; then\n    rulenum=1\n  fi\n  case $action\
    \ in\n    (skip) ;;\n    (add)\n      local rulespec\n      while [ \"$1\" !=\
    \ \"-j\" ]; do\n        rulespec=\"$rulespec $1\"\n        shift\n      done\n\
    \      shift;\n      target=$1*\n      eval prefix=\"${LOGPREFIX} $I chain $rulenum\
    \ $rulespec -j LOG \\\n        --log-level debug --log-prefix \"*${prefix:0:27}:\"\
    \n```"
