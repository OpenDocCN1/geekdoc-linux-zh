  md: '# Security/Linux


    When something goes wrong with your Linux firewall, you need to fix it—right now.
    You don''t have time for endless news searches, confusing man pages, emails to
    the developers... it''s an! One book brings together all the step-by-step solutions
    and proven problem-solving techniques you''ll need when time comes:


    # Troubleshooting Linux® Firewalls.


    Michael Shin and Scott Shin are among the world''s leading firewall experts; they''ve
    even been hired to protect computer security at the White House. In this book,
    they cover every area where Linux firewalls can go wrong: filtering problems,
    Layer 2/3/4 issues, trouble with individual services, DNS/DHCP failures, misconfigured
    VPNs. They also present an easy, start-to-finish troubleshooting methodology that
    will help you identify the newest or most obscure firewall problem—fast and solve
    it!


    Michael Shin is managing partner of the Prometheus Group, an IT consulting firm.
    He was formerly a member of Cisco''s Advanced Network Security Research group
    and a senior software developer and founding member of the firm''s Signatures
    and Exploits Development Team.


    Scott Shin co-founded Plesk, a server management firm. He was formerly a senior
    network security engineer specializing in penetration testing for Fortune 50 clients
    at Wheelgroup, a firm later acquired by Cisco.


    Inside, you will find in-depth information on the following areas:


    +   * What you must know about iptables and netfilter to troubleshoot and avoid
    problems

    * Using loggers, sniffers, and other tools to diagnose even the most obscure firewall
    problems

    * Making sure your firewall rules the way they''re supposed to

    * Resolving problems with Network Address Translation and IP Forwarding

    * Troubleshooting SMTP, Apache, Squid, NFS, FTP, instant messaging, and other
    Web-based services

    * Finding and fixing common problems with IPSec VPN configuration

    * Making your firewalls more failure-resistant: recommendations from the experts


    Both served on the White House technology staff, specializing in security and
    penetration testing of both internal and Internet-connected systems.


    If you depend on a Linux firewall, what will you do if it goes down? With Troubleshooting
    Linux® Firewalls, you can be confident that the solutions are right at hand—so
    you can sleep at night!


