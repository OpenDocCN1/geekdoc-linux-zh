  md: '# CHAPTER 12 - NETWORK ADDRESS TRANSLATION AND IP FORWARDING


    Note that we are binding this rule to our external interface, eth0. This is a
    good practice to get into because not specifying an interface will cause this
    rule to masquerade across all interfaces. It doesn''t really matter in a two-interface
    setup like our firewall; however, if you were to add VPNs or other interfaces
    at a later date, this would cause problems.


    # Forward: A Basic SNAT Firewall


    In a network where you have a external IP, SNAT will provide you with better performance
    than a masquerading firewall. The following example demonstrates the same configuration
    as just detailed, the firewall Host-A protects an internal network, 10.10.10.0/24,
    and has the static IP address 22.33.44.55 on its external interface. If you are
    in a SOHO environment with a dynamic IP address, you do not want to use SNAT.


    ![](img/9e2290071e555156f9bb68f2189d9345_239_0.png)


    Figure 12.2 A basic SNAT firewall.


    This example script is self-contained; it consists of a filtering filtering, allowing
    all traffic from the internal RFC1918 network to be NAT-ed out through the external
    interface. In addition, this example demonstrates a stricter "unless allow, deny";'
