    \ firewall configuration, the system Host-A is running a web server. The only\
    \ services you want to allow to this system are HTTP (TCP Port 80), HTTPS (TCP\
    \ Port 443), and potentially SSH (TCP Port 22).\nThe first example ruleset shows\
