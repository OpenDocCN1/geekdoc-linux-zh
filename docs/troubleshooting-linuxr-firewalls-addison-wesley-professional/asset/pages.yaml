- img_proc: true
  md: '# CHAPTER 3 THE OSI MODEL: START FROM THE BOTTOM


    # ## What an IP Packet Looks Like


    There are 14 fields in an IP packet. They are (from left to right):


    +   1. Version: The version of the IP packet, currently either IPv4 or IPv6.

    2. IP Header Length (IHL): The datagram header length, in 32-bit words.

    3. Type-of-Service (TOS): Specifies how an upper layer protocol (Layer 4+) should
    handle the packet and the importance of the packet.

    4. Total Length: The length of the IP packet in bytes.

    5. Identification: An integer that identifies the datagram, used for fragmentation
    reassembly.

    6. Flags: 3-bit field, which designates the fragmentation information. The first
    bit specifies if the packet can be fragmented. ... The third bit is unused.

    7. Fragment Offset: Specifies what position the fragment is in relation to the
    beginning of the datagram.

    8. Time-to-Live (TTL): This is a counter as the traffic moves between IP devices
    is decremented. When this counter reaches zero, the packet is discarded. The TTL
    counter is used to prevent IP traffic from looping.

    9. Protocol: This designates what upper layer protocol the packet is destined
    to after the IP layer routing information has been processed.

    10. Header Checksum: This is used to ensure that the IP packet has not been damaged
    in transmission.

    11. Source Address: Referred to as SRC in many netfilter/iptables logging rules
    and sniffers like tcpdump and ethereal. This is the address field in the packet
    that designates what system sent the packet.

    12. Destination Address: Referred to as DST in many netfilter/iptables logging
    rules and sniffers like tcpdump and ethereal. This is the address field in the
    packet that designates where the packet is going.

    13. Options: Allows IP to support options like IPSEC.

    14. Padding.

    15. Data: Contains the upper layer information, like a TCP or UDP packet.


    A word of caution—all of the headers in an IP packet can be more or less manipulated
    by any point between two points. This means that you shouldn''t trust the fields
    in an IP packet arbitrarily. You can attempt to encrypt the traffic between two
    points, but if those two points are using IP, the headers on those packets can
    still be changed by an attacker. The bottom line is not to trust the headers of
    a packet by themselves.'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# UNDERSTANDING ICMP


    The Internet Control Message Protocol (ICMP) is a quasi Layer 3 protocol (Network),
    documented by RFC 792 and RFC 1700. ICMP is used to pass IP packet error and processing
    information between IP devices. We call this information an “ICMP Message.” A
    common ICMP packet is the “ping” packet, but there are many others. Some of them
    are not necessary anymore, and some are really critical to a healthy network.


    ICMP packets are somewhat unique in the world of TCP/IP. Because ICMP cannot live
    in Layer 3 all by itself, it’s actually contained inside of an IP packet as documented
    here, much like the Layer 4 TCP and UDP packets documented in the following sections.
    Also unique to the ICMP packet is that the data portion of the packet does not
    contain the “ICMP Message.” Rather, the “Message” component is in the Type and
    Code fields as documented in Table 5.1.


    | Type | Code | Checksum |

    |---|---|---|

    | Identifier | Sequence Number |

    | Data | | |


    Figure 5.3 The ICMP Packet.


    # What an ICMP Message Looks Like


    The two fields of real importance with ICMP are the Type and Code fields. There
    are technically 255 ICMP message types, although presently only 34 are used, of
    which there are also several sub-types or codes for each of those 34 types. To
    put it succinctly, there are many ICMP messages out there. As stated previously,
    only some of them are necessary to keep your network healthy; the others you can
    and probably should learn to live without.'
