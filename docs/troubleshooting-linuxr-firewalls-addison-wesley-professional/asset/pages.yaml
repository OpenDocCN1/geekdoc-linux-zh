    # # SNIFFERS


    Sniffers are arguably a command line network most important tool sets in any network
    engineer''s toolkit.

    Network sniffers are some of the first tools we use when we''re debugging firewalls
    or just

    networks in general. They give visibility into the network itself in ways that
    host-based

    tools on the firewall or end nodes can. You might read that your firewall rules
    are sup-posed to do one thing, but until you get down and look with a sniffer,
    there''s no way to

    independently validate what your packets are doing. We can''t tell you how many
    times by

    using a sniffer we discovered some PEBKAC (Problem Exists Between Keyboard

    and Chair) that was being blamed on the nonexistent DNS

    server). We regularly use sniffers such as tcpdump and ethereal on both the firewall
    and

    client systems to watch sessions from source to destination and independently
    verify that

    our rules are in, in fact, doing what we expect from them. This is especially
    handy when

    atempting to debug bizarre VPN sessions through NAT firewalls.


    tcpdump is a command line network sniffer based on the libcap library and is avail-able
    for nearly every operating system under the sun. This is the de facto standard
    sniffer

    comes with nearly every Linux distribution comes these days. Assuming, by some
    freak

    chance, that your distribution does not come with tcpdump, you can find it at


    Whereas tcpdump is nice, powerful, and comes with nearly every Linux distribution,

    ethereal (http://www.ethereal.com) is still our favorite network sniffer. It includes
    both

    graphical and command line sniffer (tethereal), supports numerous protocol

    doders, is available for both Windows and Linux, and can use data captured from

    tcpdump. One especially great feature with the command line version of ethereal

    (tethereal), is the ability to format the output like command line sniffers,

    including tcpdump and Sun Micros''s default sniffer, snnoop.


    For protocol level debugging, we highly recommend ngrep (http://ngrep.source-forge.net/),
    written by a good friend of ours, Jordan Ritter. ngrep is a network version

    of the Unix command, grep, which makes it very useful for debugging every protocol-level
    problems like you''d find in an instant messaging or our personal favorite, string

    matching firewall rules. We discuss string matching later in the book, but in
    essence,

    think about implementing Anti-Virus or Intrusion Detection rules in your firewall.

    grep is a good way to have an independent mechanism for debugging when those

    rules fire.'
