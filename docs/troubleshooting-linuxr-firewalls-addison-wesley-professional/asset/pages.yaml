  md: '# ANALYZE AND COMPARE POSSIBLE SOLUTIONS


    +   1. Start with simplest problems first. Make a checklist and run down it from
    top to bottom. Generally it''s a good idea to start with the standard network
    engineering problems before delving into more complex rule tracking. The rule
    of thumb is to test the easy stuff first!


    +   2. Start also with the simplest solution first. For example, check for loose
    or bad cabling, DNS issues, or if the systems being affected are even before investing
    a great deal of time debugging the firewall itself. More often than not, problems
    blamed on the firewall actually have nothing to do with it.


    +   3. The OSI model, which is explained in the next chapter, is good to use here
    as a checklist of sorts. You work your way up the OSI model, ruling out dependencies
    that might be creating symptoms higher up in the OSI model. This further reinforces
    the process of working on the simplest problems first before moving onto the next
    complex problem.


    # SELECT AND IMPLEMENT THE SOLUTION


    Put your plan into action. This is where you do all the work. Before this step,
    all you should have done collected information about the problem and developed
    your plan of action.


    # CRITALLY ANALYZE THE SOLUTION FOR EFFECTIVENESS


    At this point, you will want to test your solution against the End State that
    you defined earlier. Is performing everything exactly as expected? Does the diagnostic
    data support the solution? Does this solve the entire problem or merely a symptom
    of the problem? The fact that you''re in changing things might be making things
    worse, so above all else, take the time to track what you''re changing in the
    process of solving the problem, you may have to “undo” those changes.'
