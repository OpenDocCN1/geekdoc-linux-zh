    To be more succinct, your software and hardware probably have bugs in them. They
    probably have a lot of bugs. Prepare for that, no matter how great your software
    or hardware-vendor is or what they might say about the security of their products
    or their track record.


    It''s best to look at your systems as the flawed, imperfect and insecure things
    they probably are. If you start with this assumption, the task at hand can seem
    daunting. Don''t fear! You''ve made this far in life, and real life is no more
    certain, perfect, or secure than the computing world. In nature, there is no such
    thing as total security. That concept does not exist. There is only risk management.
    Sometimes you crawl out of your hole to seek food, and something eats you; other
    times you stay in your hole and starve; other times, most of the time, you leave
    your hole, you find food, purpose, enjoyment and everything turns out fine. Balancing
    those risks, threats, and rewards defines life.


    With computers it''s no different. Sometimes you have to take greater risks with
    your Information Technology systems to reach a new customer, to link with an important
    vendor, or to simply operate your business. If you have systems attached to the
    Internet, then you are taking a risk.


    # Know Your Vulnerabilities


    Continuing this thread, it''s important to understand what your weaknesses and
    vulnerabilities are before you try to solve any security problem through improvement.
    After all, if you don''t know what''s broken, how can you fix it? As we mentioned
    before, the best way to learn what your adversaries can do and where you need
    to focus your efforts, is to look at your network and its assets from the perspective
    of an attacker in a brutally honest manner. You will want to attack your network
    or engage someone who can do it for you. The intent is to enumerate every known
    vulnerability in your organization so that you can make an informed assessment
    to manage the risks created by these vulnerabilities. We will explore this topic
    in more depth in later chapters. Just remember, it''s not enough to secure your
    network. After you do that, you will want to try and break in. You can''t know
    if your efforts are worthwhile without testing them.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# CREATING SECURITY POLICIES


    In addition to the technical methods used to secure networks and computers, via
    electronic rules, it''s important to create rules for the people that will be
    using those computers and networks. Many times, you cannot engineer away the cause
    of the problem: the user. Having a clearly defined security policy is critical
    to the success of any risk management plan.


    # TRAINING


    After you have your security model and policies in place, users will need to be
    trained on them. This can be something as simple, as, for a home firewall, explaining
    to your spouse, roommates, or whoever you now have a firewall in place and how
    it is configured.


    For larger organizations, you will need to go a little further than this. Training
    your users can be the difference between a security plan that works and one that
    fails on the first day. For instance, your plan might be thwarted via something
    as simple as a social engineering attack. An employee or user is convinced to
    give someone else access to your systems or building.


    # DEFENSE IN DEPTH


    We can''t stress enough the need for Defense in Depth (DID). Computers, software,
    firewalls, and all the creations of man have one fundamental flaw: People created
    them, and people are not perfect; people make mistakes. You simply cannot rely
    on one thing to protect your network and computers. Firewalls are wonderful and
    powerful tools for protecting systems, but they are neither nor complete solutions
    for the incredibly wide range of vulnerabilities and threats that modern networks
    and computers face.


    # SUMMARY


    Even though this is a book specifically about firewalls, we would be remiss if
    we did not point out that security requires more than just deploying a firewall.
    A firewall will not protect your systems from many of the electronic threats they
    may face. Remember, a firewall is just one security tool; it''s not a silver bullet!
    We will discuss this in detail in the next chapter, but suffice to say that firewalls
    are over emphasized in many security plans. At the very least, plan for what you
    will do if your firewall fails you miserably. Create a plan to recover and build
    additional layers of defense to protect your assets.'
  merge: -1
  pgno: 34
- img_proc: true
