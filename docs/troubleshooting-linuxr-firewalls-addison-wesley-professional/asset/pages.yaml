    # PROBING TOOLS


    nmap (http://www.insecure.org) is a highly advanced scanner with OS detection
    capabilities, banner grabbing, IDS evasion, and network discovery capabilities—among
    all the wonderful features this tool provides. Besides being a nifty tool, nmap
    is also a powerful network diagnostics tool. It gives the operator the ability
    to test remote connections via many different methods, such as opening connections
    without normal three-way handshakes. We cover using nmap in more detail later
    in the book. It suffices to say, that port scanner is the ideal tool to quickly
    verify what kinds of traffic can pass through firewall filter rules (in either
    direction!)


