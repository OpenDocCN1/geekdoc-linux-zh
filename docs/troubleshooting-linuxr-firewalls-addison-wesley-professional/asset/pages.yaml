  md: "# CONNECTING TO AIM\n\nAIM uses very basic TCP ports for connecting into their\
    \ central servers, typically TCP port 5190. If you're using a standard NAT or\
    \ Masquerading configuration, this won't be a problem for you. However, like MSN,\
    \ file and video traffic can get confused when traversing NAT firewalls. To get\
    \ these connections to work properly, you will need to install a transparent proxy\
    \ on the firewall. We recommend ReAIM (http://ream.sourceforge.net/), which after\
    \ paying up and running on the firewall will require some transparent proxy rules\
    \ to complete the configuration. After it is in place, your users will not need\
    \ to make any changes to their AIM clients.\nThe following firewall rules will\
    \ need to be added after the ReAIM proxy is running:\n\n```\n# eth0 assumes the\
    \ external interface\n# eth1 assumes the internal interface\nEXTERNAL=eth0\nINTERNAL=eth1\n\
    \nIPTABLES -t nat -A PREROUTING -i $INTERNAL -p tcp \\\n  --dport 5190 -j REDIRECT\
    \ --to-ports 5190\n```\n\n```\n# this rule allows the firewall to accept the\n\
    # redirected connection, if you have a default DROP\n# policy. And do you have\
    \ one of those right?\nIPTABLES -A INPUT -i $INTERNAL -p tcp --dport 5190 \\\n\
    \  -j ACCEPT\n```\n\nAssuming your firewall is using eth0 for the external interface,\
    \ you will want to modify the -i variable to -i eth0. Further, if you are not\
    \ supporting MSN traffic, remove the following line:\n\n```\nIPTABLES -A INPUT\
    \ -i eth0 -p tcp --dport 1863:1864 \\nn  -j ACCEPT\n```\n\n# BLOCKING AOL INSTANT\
    \ MESSEN TRAFFIC\n\nAs we have discussed in reference to blocking other IM traffic,\
    \ the number of servers and ports that these applications support generally involve\
    \ multiple methods to consistently"
