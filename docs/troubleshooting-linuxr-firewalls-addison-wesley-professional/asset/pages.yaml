    tcp 6 271 ESTABLISHED src=172.31.254.2 dst=1.2.3.4 sport=2053 dport=80

    src=1.2.3.4 dst=EXTERNAL_IP_FOR_NAT_CLIENT sport=80 dport=2503 use=1=118740288


    For UDP, the process looks a little different:


    # Step 1:


    udp 17 26 src=10.10.10.8 dst=10.10.10.253 sport=40082 dport=53 src=10.10.10.253

    dst=10.10.10.8 sport=53 dport=40082 use=1=255


