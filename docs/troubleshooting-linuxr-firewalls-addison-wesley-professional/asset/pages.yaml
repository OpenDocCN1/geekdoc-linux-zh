    # OUTBOUND: BLOCK CLIENTS FROM ACCESSING WEBSITES


    In this scenario you are in a position where you need to filter out access to
    specific websites by internal systems traversing your firewall. This example really
    belongs in the NAT section of this book; however, given that this might only be
    related to a single service (web), we will address how to achieve this goal. In
    the following example, the firewall Host A handles traffic for the internal network
    10.10.10.0/24. Hosts on this network are only allowed to communicate with the
    web server at 11.22.33.44:


    ```

    $iptables -A PRERUTING -t nat -s 10.10.10.0/24 \

    -d 11.22.33.44 -dport 80 -j ACCEPT

    $iptables -A PRERUTING -t nat -s 10.10.10.0/24 \

    -d 0/0 -p tcp -dport 80 -j REJECT \

    -reject-with icmp-not-prohibited

    ```


    The first rule allows the systems on the network 10.10.10.0/24 to access the web
    server at 11.22.33.44.


    The second rule rejects traffic to any other web server, with the net-prohibited
    ICMP message. This is to aid in debugging and cleanly reject the attempted connections
    to disallowed web servers.


    # TRANSPARENT PROXY SERVERS (SQUID) ON OUTBOUND WEB TRAFFIC


    A transparent proxy server is a method of installing an application layer proxy
    server, such as squid (http://www.squid-cache.org), in such a way that the end
    users do not know it is by using REDIRECT on web traffic. This is useful because,
    amongst other things, traffic is cached on the proxy server, increasing performance
    and reducing bandwidth usage to oft-used websites.


    In addition to the caching, a transparent proxy server like squid in conjunction
    with an iptables/nefilter firewall advantages brings other advantages. You can,
    for example, implement content filtering, ad-blocking, user authenticated web
    browsing, or provide'
  merge: -1
