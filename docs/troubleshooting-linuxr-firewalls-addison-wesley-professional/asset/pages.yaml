  md: '# CHAPTER 13 GENERAL IP (LAYER 3/LAYER 4)


    # part 3

    $IPTABLES -A SSHCLIENTS -p tcp -m tcp --syn -j REJECT

    $IPTABLES -A SSHCLIENTS -p udp -m udp -j REJECT


    In part 1 of these rules, we first create the user-defined chain, SSHCLIENTS with
    iptables -N SSHCLIENTS and then set the user define chain to be applied against
    the INPUT and FORWARD chains. This is so that we can store our SSH routes in one
    chain and, if we were in a diagnostic mode, disable them. Also note that the -syn
    flag—this means that the connection is to accepted if it starts with a SYN packet.
    If it does not, the rule will not be matched and the traffic discarded by rules
    further down.


    Part 2 is where we deny the policy. Any packets that do not match the ruleset
    in part 1 will be caught and dumped with a RST/ACK message from the server. The
    plus side to using -j REJECT is that it returns the response to the system originating
    the connection (clearly, there are a lot of blocked IPs out there) and shutting
    down the connection. The downside is that if you were trying to hide that you
    have an SSH service on this system, you just failed because you sent the bad guy
    an RST/ACK response. If you just want to drop the packets into the ether, use
    -j DROP.


