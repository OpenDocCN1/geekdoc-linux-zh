  md: '# FILTERING


    As you are no doubt already aware, this is the bread and butter of what a firewall
    does— it filters traffic, or at least it tries to, and we hope that it does. The
    golden rule with firewalls is always this: unless allowed, deny it. Never under
    any circumstances attempt to build a firewall that is configured the other way
    around: allow everything; deny something. This is an approach doomed to fail.
    One advantage of the good approach, "unless allowed, deny," is that you learn
    very quickly what sort of traffic is traversing your firewall. This might produce
    time-consuming work determining what to allow in and out of your firewall, but
    it''s an invaluable tool for determining what''s going on. This approach gives
    you visibility into your network and users that would otherwise never see if your
    firewalls were built only to block certain things.


    Also keep in mind that ports alone do not go a good firewall policy make. Do not
    assume that just because you allow only port 80 traffic into a network that the
    traffic will be HTTP if you are using the Linux packet filtering capabilities.
    By default, the kernel has no way of inspecting the traffic to ensure that it
    is HTTP traffic. Ports are no longer enough to define what the traffic is. If
    you want to filter the traffic into or out of a network by protocol, then you
    will need to use either an application proxy that understands the protocol (squid,
    gatekeeper, reiam, and so on) or utilize some of the iptables modules that can
    perform protocol inspection, such as ipt2p. We have had the unfortunate task of
    cleaning up security breaches of customers that failed to understand this distinction.
    A port is nothing but a number to an IP stack; it has no bearing on the protocol
    that might run over that port. Anything could be running on that port, not just
    the service that normally resides there.


    # INGRESS/EGRESS FILTERING


    Filtering what goes out of your networks is just as important as filtering what
    is allowed to come in. This is easily one of the most overlooked elements of firewall
    configuration. Too many organizations set up their firewalls to, essentially,
    allow anything out of their networks. We recommend that you carefully control
    what traffic you allow out of your networks so that you can minimize the effects
    of internal security breaches, such as information leakage, deliberate or inadvertent
    exposure of sensitive data, worms and viruses and unauthorized VPNs, and other
    tunnels set up by your users to bypass your security controls.'
