- img_proc: true
  md: '# CHAPTER 2 GETTING STARTED


    excellent books and resources that explain how to secure all the elements of an
    enterprise. We must stress that this phase is not complete until all the elements,
    not just the firewall and the network or networks it protects, properly secured
    through the use of additional security technologies and counter measures, such
    as IDS, patch management, AAA, and so on.


    # SECURING THE FIREWALL ITSELF


    More about how to accomplish this is detailed in Chapter 3, “Local Firewall Security.”
    The key point to remember is that the firewall, as a trusted element of the security
    model, needs extra attention to securing it. A firewall should have as few functions
    as possible and should never be used for anything other than a firewall. When
    you run any service on a firewall, you are changing its function into a server
    that doubles as a firewall. If you have the extra resources, do not run any services
    on your firewall; run them on other servers.


    # ISOLATING ASSETS


    Isolation or compartmentalization is the cornerstone of security and what firewalls
    are really good at implementing. The principle is simple—secure an asset so that
    it cannot be used to break into another asset regardless of how compromised that
    asset might have become. An example of this would be two servers, one on each
    side of a firewall, that have no means of communicating with each other through
    the firewall. In that sense, those servers are isolated and compartmentalized
    from one another, so if one is broken into it, it cannot be used to break into
    the other. Typically with firewalls, this is accomplished with what are called
    DMZs or Demilitarized Zones. Basically, a DMZ is like a man''s land for systems
    that might be exposed to greater threats than other systems and have a higher
    probability of being broken into.


    Another example of compartmentalization is the use of internal network firewalls,
    isolating elements of an organization''s networks from one another. An example
    would be firewalling the accounting department from the rest of the company to
    prevent unauthorized users on the company’s network from accessing the accounting
    network. Each separate isolated network is sometimes referred to as an enclave
    or domain. We prefer to use the term enclave, because domain has a different context
    with some systems, but you might see the term used interchangeably in this book.


    36'
