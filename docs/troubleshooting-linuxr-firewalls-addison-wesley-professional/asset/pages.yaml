  md: '# READING OUTPUT FROM NMAP


    The reliability of data from nmap depends on the type of scanning being used and
    the types of systems you''re scanning. Just remember, you can get false positives!
    If you''re not sure, can things more than once.


    Personally, we favor TCP and SYN scanning; FIN and UDP scanning are unreliable
    when dealing with slow networks. Especially in the case of Microsoft-based systems,
    FIN scans are next to useless. UDP scanning is by nature very unreliable and time
    consuming. In general you''ll find that doing full 65K port scans is not going
    to be fast unless you are on a very fast network. Let''s look at some example
