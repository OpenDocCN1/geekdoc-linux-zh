- img_proc: true
  md: 'ISCS provides a very reliable mechanism for rolling out an initial deployment
    of internal firewalls into a business for the first time, and frankly this is
    probably one of the most important uses for low cost, highly configurable devices
    such as a Linux firewall. If you''re in an environment where you''re considering
    (or presenting!) the use of Linux firewalls, this is one potential way of demonstrating
    a low-impact rollout of firewall devices—for example, deploying multiple internal
    Linux firewalls as primarily a worm-defense system. Over time, more stringent
    firewall rules could be applied to restrict access between networks (or Quality
    of Service... ISCS does that too!). This is a far lower impact strategy than implementing
    a strict firewall policy from the get-go, while more secure, is typically sensitive
    or even more likely, to cause issues with your users due to some unknown network
    behavior. This is just one example of where we used ISCS to save time and money—and
    it worked.


    Of course, you''ll also run into environments where you have a mix of firewalls
    and don''t need the management infrastructure of something as powerful as ISCS.
    That''s where Firewall Builder (fwbuilder) comes.


    fwbuilder(http://www.fwbuilder.org/) is a rule generation interface that supports
    both open source (Linux, BSD) and commercial firewalls (Cisco PIX). It''s a graphical
    front end that allows you to quickly create complex rule policies. Until we discovered
    ISCS, we used fwbuilder for large corporate rollouts, and we still do for what
    we call the "Diet-Coke" firewall implementations, "Just one firewall! Not enough
    for ISCS!"


    Obviously, this tool is another X11-based interface for rule generation. It''s
    absolutely fantastic when you''re faced with the problem of creating and maintaining
    rules on a Linux firewall in conjunction with another firewall (like a PIX, they''re
    everywhere). ISCS, like fwbuilder, can control the rules on multiple types of
    firewalls, not just Linux-based firewalls. This tool also includes a Druid, an
    open source speak for what Windows users would call a "wizard" for rapidly creating
    a basic firewall ruleset. In addition, there is a drag-and-drop interface for
    more common rules such as IPS or Voice-over-IP,


    The open source community is not the only source of useful technologies to help
    you with the process of managing and troubleshooting your firewalls. However,
    we chose to cover only those technologies we felt would always be within the reach
    of all our readers, so the focus will be on open source tools. Additionally, we
    have not found wanting for lack of commercial tools. We have not encountered any
    problem we could not diagnose and resolve through the sole use of open source
    tools.'
