    to cover in this book. Their use is very specialized, and it is not practical
    to construct them with **iptables** or **ipchains**. The other types fall into
    two categories, trusted guards and one-way firewalls. Trusted guards basically
    prevent data, in theory, from moving from one domain to another domain. Basically,
    they are designed to prevent “Top Secret” data, for instance, from moving into
