  md: '# What''s common to this problem?


    +   - Does it happen from everywhere on the network?

    - Do all systems and/or OSs seem to be affected by this problem? For example,
    turning ECN on under Linux can make it hard for a Linux box to connect to some
    systems that drop packets with "undefined" header options. Because ECN is an optional
    setting not defined in early RFCs, some firewalls and routers will assume the
    packet is bogus and drop it. In these cases, only the Linux systems with ECN turned
    on would be experiencing network problems, whereas all other systems would be
    functioning correctly. The point is to determine the scope of the problem rather
    than assuming it''s universal.


    # DEFINE WHAT THE “END STATE” SHOULD BE


    This is a simple one—basically define as specifically and precisely as you can
    know how the system should be normally, optimally, and so on. In other words,
    how should the system or systems behave in the best case? Make sure you know what
    the correct behavior is; otherwise, you will not be able to test the system to
    determine if it is functioning properly.


    # DEVELOP POSSIBLE SOLUTIONS AND CREATE AN ACTION PLAN


    In the case of simple problems, your plan could literally spell itself out, but
    for more complex problems where the stakes are high, it pays to take some time
    and lay out your plan. This way, you can look at all the consequences created
    by the different solutions and work out which parties this might affect. For a
    large organization, this can be a critical step to ensure that all the necessary
    parties have approved the plan before executing. It''s also an exercise in good
    communication if the problem requires more than one party to execute. Documenting
    complex action plans in a typed form will help reduce the probability of miscommunication
    or misunderstood steps, which can result in disaster. Remember, even something
    as subtle as the order of your firewall rules can cause changes to all your other
    rules and might lock you out of the very systems you are trying to fix. Planning
    pays off in the end.'
