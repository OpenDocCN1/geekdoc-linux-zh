  md: 'we can spell bad news for your firewall. Make sure you understand what the
    software does, and that you are configuring it correctly. If you''re not sure,
    ask.


    # USE A HARDENED KERNEL


    “The reality that secure applications require secure operating systems, and any
    effort to provide system security that ignores this premise is doomed to fail.”
    (P. A. Loscoco, S. D. Smalley, P. A. Muckelbauer, R. C. Taylor, S. J. Turner,
    and J. F. Farrell. The Inevitability of Failure: The Flawed Assumption of Security
    in Modern Computing Environments,” proceedings of The 21st National Information
    Systems Security Conference, page 303-314, Oct. 1998).


    The vanilla kernel is a marvel of open source development but has traditionally
    been lacking in truly above and beyond security models. The security model, particularly
    in the 2.4 kernel, is only adequate for systems where security is not a primary
    concern and with a firewall that''s system''s entire purpose: security. To rest
    easy, the security model of the vanilla kernel will not.


    With 2.6, these trusted enhancements, referred to as SELinux, or Security Enhanced
    Linux, are now available in the vanilla kernel. SELinux, according to the NSA,
    for a “...flexible mandatory access control architecture incorporated into the
    major subsystems of the kernel. The system provides a mechanism to ensure the
    separation of information based on confidentiality and integrity requirements.
    This allows threats of tampering and bypassing of application security mechanisms
    to be addressed and enables the confinement of damage that can be caused by malicious
    or flawed applications. You will have to check your system to see if these features
    are compiled in default to use them. There are also SELinux patches for the 2.4
    kernel, should you choose to use a 2.4 kernel.


    In addition to SELinux, we are particularly fond of combining the grsecurity patches
    with a 2.6 kernel running SELinux, or when running 2.4, we always add in the grsecurity
    patches. grsecurity, another kernel security enhancement project run by Brad Spengler
    includes covert hardening, IP stack hardening, stack overflow protection, address
    randomization, trusted path execution, and a real RBAC and MAC security model.
    The combination of two works wonderfully for us and provides for many extra features,
    it’s more than worth the effort to protect your 2.6 kernel with grsecurity features.


    You can find the grsecurity patches at http://www.grsecurity.net.

    Have also collected many essays and manuals on SELinux at our website (www.getroot.com).
    You can also go straight to the source, the NSA, which funded the SELinux enhancements
    for Linux for the latest patches, documents, and for instructions on how to join
    the SELinux mailing lists at http://www.nsa.gov/selinux/.'
