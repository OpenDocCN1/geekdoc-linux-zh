    t packet is destined for another host.

    13. Any netfilter POSTROUTING mangle rules are applied; this might change TOS
    or TTL

    values in the packet.

    14. Final netfilter step—any POSTROUTING NAT rules are applied.

    15. Sent out of our interface(s) to destination.

    16. On wire to destination (might not arrive).


