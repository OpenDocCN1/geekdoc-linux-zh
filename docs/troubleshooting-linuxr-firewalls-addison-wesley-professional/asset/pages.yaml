  md: "This example script is self-contained; it consists of a simple filtering policy\
    \ allowing all traffic from the internal RFC1918 network to be NAT-ed out through\
    \ the external interface and DNAT-ing all traffic from the firewall's 22.33.44.55\
    \ IP address to the DMZ server, 192.168.1.80:\n\n```\n#!/bin/sh\n\nIPTABLES=\"\
    /bin/iptables\"\nEXTERNAL=\"eth0\"\nINTERNAL=\"eth1\"\nDMZ=\"eth2\"\nEXTERNALIP=\"\
    22.33.44.55\"\n\n# servers\nWEBSERVER=192.168.1.80\n\necho \"Setting default filter\
    \ policy\"\nIPTABLES -P INPUT DROP\nIPTABLES -P OUTPUT DROP\nIPTABLES -P FORWARD\
    \ DROP\n\n# load your connection tracking modules\nmodprobe ip_connrack\nmodprobe\
    \ ip_connrack_ftp\n# this next rule is PPPoE, and DSL users\nIPTABLES -A OUTPUT\
    \ -o eth0 -p tcp \\\\\n  --tcp-flags SYN,RST SYN -j TCPMSS \\\\\n  --clamp-mss-to-pmtu\n\
    \n# these are our connection tracking rules\nIPTABLES -A INPUT -m state \\\n \
    \ --state ESTABLISHED,RELATED -j ACCEPT\nIPTABLES -A OUTPUT -m state \\\n  --state\
    \ NEW,ESTABLISHED,RELATED -j ACCEPT\nISPTABLES -A FORWARD -m state \\\n  --state\
    \ NEW,ESTABLISHED,RELATED -j ACCEPT\n\n# Allow SSH to the firewall on the internal\
    \ interface\n# only\nIPTABLES -A INPUT -p tcp --dport 22 -i $INTERNAL \\\\\n \
    \ -j ACCEPT\n\n# Forward traffic to our DMZ server, 192.168.1.80\nIPTABLES -A\
    \ FORWARD -i $EXTERNAL -o $DMZ -p tcp \\\n```"
