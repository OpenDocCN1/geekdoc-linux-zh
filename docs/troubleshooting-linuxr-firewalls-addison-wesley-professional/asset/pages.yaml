    System memory is also used to handle things such as fragment reassembly, which

    might seem to insignificant, but fragment reassembly on a network that is supporting

    clients with ever-changing MTU can actually consume a substantially more significant

    amount of memory than the connection tracking engine. In earlier kernels, it was
    even

    possible to exhaust all of the system''s memory by generating a flood of fragments
    and

    filling up the system''s buffers while waiting for the rest of the fragments to
    arrive.

    caused the kernel to start dropping connections, and in some cases could cause
    a DoS of

    the firewall''s IP stack. The point here is that memory is quite important for
    a firewall,

    and because it''s so cheap these days, there is great opportunity and need to
    increase the

    memory on a heavily used firewall. If your firewall is engaging in some extremely
    hard to

    diagnose problems, consider that it might simply be overworked and check the systems

    accordingly to determine if that is the case.'
