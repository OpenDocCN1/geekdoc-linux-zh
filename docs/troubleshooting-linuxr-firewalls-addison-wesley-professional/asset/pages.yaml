  md: "# CHAPTER 17 NAT (NETWORK TRANSLATION) AND IP FORWARDING\n\nThis is most likely\
    \ due to the Explicit Congestion Notification (ECN) feature in the Linux kernel.\
    \ While a highly useful feature, some broken TCP/IP stacks cannot safely handle\
    \ this traffic. Fortunately it is very easy to disable, using /proc:\n\n```\n\
    # this will disable ECN\necho 0 >/proc/sys/net/ipv4/tcp_ecn\n\n#this will enable\
    \ ECN\necho 1 >/proc/sys/net/ipv4/tcp_ecn\n```\n\n# Internal Systems Communicate\
    \ with External Systems, but only with Small Packets—Large File Transfers Fail\n\
    \nYou are configuring a network on a DSL and have created internal and/or DMZ\
    \ network(s). Only small payload traffic, as ping, will work inconsistently through\
    \ the firewall. Most large payload traffic fails to traverse the firewall 100%\
    \ of time.\n\nMost likely this is due to an MTU mismatch when you're dealing with\
    \ DSL, PPPoE, or VPN connections. Generally, the following rule should solve this\
    \ problem:\n\n```\nIPTABLES -A FORWARD -p tcp --tcp-flags SYN,RST SYN \\\n   \
    \ -j TCPMSS -clamp-mss-to-pmtu\n```\n\nOn VPN connections you might need to further\
    \ reduce your MTU settings, due to the even higher overhead. Consult the VPN chapter\
    \ for more information on this topic.\n\n# SUMMARY\n\nAs you can see, netfilter\
    \ is capable of a considerable amount of granularity and flexibility, from creating\
    \ a basic SOHO connection-sharing environment to complex DMZ configurations in\
    \ line with large enterprise deployments. This, combined with the Layer 2 functionality\
    \ discussed in the previous chapter, shows the range of using Linux firewalls\
    \ as a one-stop solution for solving complex corporate network configuration issues.\n\
    \nIn later chapters we discuss how to specify using NAT rules both on source and\
    \ destination addresses to allow you to break out destinations by the port as\
    \ well as the IP, redirect traffic transparently into application layer proxies,\
    \ and create multiple NAT configurations for VPN configurations."
  merge: -1
