- img_proc: true
  md: '![](img/9e2290071e555156f9bb68f2189d9345_50_0.png)


    **Figure 2.2** The wrong and right ways to forward traffic through a firewall.


    For those systems that need to have presence in multiple enclaves, this is where
    DMZs come into effect. It''s generally a bad idea to just allow traffic from a
    system in a less secure enclave (the Internet) to have direct access to a system
    on your more secure enclave (your internal networks). Moving systems into a DMZ
    segment that is isolated from both enclaves ensures a more secure design. A compromise
    on the system utilizing a DMZ will not allow an intruder to escalate access across
    the board on your internal network. This is known as *Secondary Exploitation*.
    Remember, the intent with compartmentalization is to isolate a system or systems
    so that if they are compromised, they cannot-be used to break into other systems.


    One bad trend we have seen recently is placing web servers on a DMZ and having
    them communicate to internal database servers back through the firewall. This
    is a recipe for disaster. A better model would be to set up a duplicate database
    server on the DMZ and to have the internal database server synchronize itself
    with the DMZ-ed copy. This way, if the DMZ database is compromised, the internal
    database server cannot be broken into and then used to break into other internal
    systems.'
