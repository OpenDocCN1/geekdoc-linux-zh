- img_proc: true
  md: '# Virtual Private Networks


    VPNs are becoming increasingly important as companies move away from using private
    WANs for intra-business warriors communication or dial-up modem pools for remote
    access. More “road users” needing to access data on the corporate LAN from the
    road has driven a need for better approaches to security for wireless networking,
    the need to secure Voice-over IP connections connections between offices and homes,
    and ubiquitous security access from anywhere in the world to anywhere in the world.
    All of these demands and many others are driving the need for robust and sustainable
    VPNs between multiple locations and roving users. Depending on the VPN technology
    being used, this can be a simple project (openvpn, cipe, and so on) or an absolute
    nightmare (IPSEC!). In this chapter we will cover diagnostic procedures on some
    of the most common issues with two of the most popular VPNs, IPSEC, and PPTP.


    # THINGS TO CONSIDER WITH IPSIC


    Spent far too much time attempting to get the overly elaborate IPSEC VPNs working
    between our houses, businesses, and business partners (one of us has four separate
    VPNs—the other has five!), we can safely say...we hate IPSEC. Setting aside the
    firewall issues for a moment, IPS is less a standard and more a compilation of
    “shoulds.” “Should” might even be too strong of a word...it’s more like a lot
    of “yeah, kinds.” Needless to say, before blaming your firewall for your VPN woes,
    it’s important to dive into some of the very common issues with getting IPSEC
    to work.'
  merge: -1
  pgno: 348
- img_proc: true
  md: '# CHAPTER 11 PRIVATE NETWORKS


    First, IPSec implementations are not always compatible. Even IPSec is supposed
    to be a standard, that does not mean that the implementations out there have to
    play nice with one another. Because of this, we tend to favor openswan (for the
    time being) for IPSec VPNs. Even 2.6 Linux kernels have native IPSec support,
    we still prefer openswan, for the most part, it just “works” with most of the
    IPSec implementations out there. It''s also relatively easy to set up on 2.4 and
    2.6 Linux systems, and standardizing it is a good thing. Further, openswan uses
    the native IPSec support in 2.6 kernels; it abstracts away so you can use openswan
    configurations from 2.4 systems without any changes.


    Nevertheless, you will still find that even old and robust as openswan might not
    work with the VPNs you need to support. For instance, one of our laptops openswan,
    the Cisco IPSec package, and (given that it doesn''t work with Redhat 9) Checkpoints
    VPN-1 IPSec client running in a Redhat 7.3 Vmware (www.vm.com) image. The main
    issue we''ve run into on the compatibility front is that they use different authentication
    mechanisms—so always check your documentation first! Some VPN software packages
    need to be configured to be NAT-aware, so they work perfectly outside a firewall
    and not at all behind. By default, IPSec wasn''t designed for NAT-ing, so more
    often than not, it won''t work behind a firewall unless the implementation has
    been extended to work in NAT environments.


    Network hardware matters! Specifically with IPSec, you''re going to have to worry
    about the Maximum Transmission Unit (MTU) with DSL connections, some wire-less
    connections, or if you''re doing any other tunneling such as Point to Point Protocol
    over Ethernet (PPPoE). We found that you have to play with the MTU starting around
    1470, dropping as low as 1300. We''ve even run into some cellular wireless services
    that required us to go even lower. It depends on your configuration, IPSec implementation,
    and networking environment upstream. This is a critical issue with IPS—MTUs really
    do matter. If the VPN isn''t working, check the MTU and try lowering. We recommend
    1300 as a good starting point.


    Another important step is to bind it to the right interface. This is more of a
    reminder of an embarrassing mistake made on another system and a warning on not
    to over-think-the-problem. Keep the simple things first—like the network card...


    # COMMON QUESTIONS/PROBLEMS


    When enabling a VPN, whether it''s IPSec or securing in Layer 4, sometimes the
    VPN software will change your default route to the VPN. Keep an eye on your routes
    starting to perform diagnostics.'
  merge: -1
  pgno: 349
- img_proc: true
  md: 'Sometimes IPSPs will implement no-VPN policies, so if your VPN stops working
    one day and you have literally changed nothing, check with your ISP to see if
    it has changed its VPN policy. A sniffer on both ends can help you to diagnose
    the VPN packets are going out and if the destination is receiving them.


    PPPoE, DSL, and other environments involving encapsulation suffer from issues
    with MTU path discovery (mentioned in previous chapters). This is a common problem
    with VPNs and will manifest in all sorts of different ways: poor performance,
    large transfers of data failing where small ones succeed, a VPN “stalling” (working
    one minute and stopping suddenly) or authentication issues with VPN applications.
    The fix in nearly every occasion is to use PMTU and iptables/netfilter to manipulate
    the Maximum Segment Size (MSS) setting on your firewall with the following:


    ```

    $IPTABLES -A FORWARD -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --clamp-to-pmtu

    ```


    In our testing of IPSec over the traversing firewalls, we have generally had a
    relatively small number of problems that occur across multiple implementations.
    When dealing with IPSC clients or servers, we''ve found a number of them have
    specific settings for traversing NAT environments. Always double-check your IPSec
    documentation to see if you need to enable different settings for VPN environments.


    The following is a sniffer capture of an IPSEC session not responding:


    ```

    [root@minimoose root#] ethereal -i eth0 66.167.232.50

    Capturing on eth0

    0.000000 68.98.150.6 -> 66.167.232.50 ISAKMP Identity Protection (Main Mode)

    9.994140 68.98.150.6 -> 66.167.232.50 ISAKMP Identity Protection (Main Mode)

    29.995130 68.98.150.6 -> 66.167.232.50 ISAKMP Identity Protection (Main Mode)

    ```


    This is telling us that the originating system is sending out its authentication
    information, but the server on the other end is not responding for some reason.
    In this case, we are getting no response at all from the remote end. This could
    be because of any number of things, from the authentication information not being
    recognized, to filter rules, to IPSec just running on the remote system.


    This is what it looks like:


    ```

    [root@minimoose root#] ethereal -i eth0 68.100.73.75

    274.959573 68.100.73.75 -> 68.98.150.6 ISAKMP Identity Protection (Main Mode)

    274.960127 68.98.150.6 -> 68.100.73.75 ISAKMP Identity Protection (Main Mode)

    275.006148 68.100.73.75 -> 68.98.150.6 ISAKMP Identity Protection (Main Mode)

    275.045370 68.98.150.6 -> 68.100.73.75 ISAKMP Identity Protection (Main Mode)

    ```'
