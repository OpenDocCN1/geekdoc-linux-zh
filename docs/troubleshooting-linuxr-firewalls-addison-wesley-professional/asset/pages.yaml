    # Port Scan Rules


    Sometimes you will want to detect what are referred to as port scans. These are
    either attempts to enumerate available services on your hosts or specially crafted
    packets to subvert your firewall rules to accomplish the same. The first set of
    rules will attempt to detect otherwise normal traffic that appears to be attempting
    to map out the services running on the hosts protected by your firewall. The following
    rules require the PSD (Port Scan Detection) module from patch-o-matic, as this
    module is not normally included in most Linux distributions.


    After you have this module loaded, these rules will give your firewall the ability
    to detect certain types of port scans and, optionally, to take action when those
    port scans are detected.


    ```

    iptables -A INPUT -i eth1 -m psd -m limit \

    --limit 5/minute -j PSD2

    iptables -A INPUT -i eth2 -m psd -m limit \

    --limit 5/minute -j PSD2

    iptables -A INPUT -i eth4 -m psd -m limit \

    --limit 5/minute -j PSD2

    iptables -A FORWARD -i eth1 -m psd -m limit \

    --limit 5/minute -j PSD2

    iptables -A FORWARD -i eth2 -m psd -m limit \

    --limit 5/minute -j PSD2

    iptables -A FORWARD -i eth4 -m psd -m limit \

    --limit 5/minute -j PSD2

    iptables -A PSD2 -m limit --limit 1/2second -j LOG \

    --log-level info --log-prefix "PSD2 --" DROP SHUN " \

    --log-tcp-sequence --log-tcp-options \

    --log-ip-options

    iptables -A PSD2 -m recent --set-j DROP

    ```'
